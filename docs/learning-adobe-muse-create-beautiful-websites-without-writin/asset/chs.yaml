- "## 9\n\n## 更多小部件——组合和幻灯片\n\n在上一章中，我们使用 Muse 的小部件快速轻松地为所有页面添加菜单或导航系统，并使用手风琴面板在小区域内显示大量文本。在本章中，我们将继续使用小部件为网页添加额外的功能和交互性。\n\
  \n我们将使用幻灯片小部件创建一个优雅的幻灯片，并使用组合小部件创建一个简单的照片库。除了使用小部件添加功能外，我们还将使用任意 HTML 为页面添加交互元素。\n\
  \n到本章结束时，您将知道如何：\n\n- - 使用组合小部件\n- - 使用幻灯片小部件创建幻灯片\n- - 使用任意 HTML 添加交互式 Google 地图和\
  \ feed\n\n## 组合小部件\n\nMuse 中有几个交互式小部件属于组合小部件的 umbrella 术语。它们由一个称为“触发器”的小容器和一个称为“目标”的较大容器组成。当您单击触发器时，目标中会发生某些事情。一个例子是照片库，用户单击缩略图图像，完整大小的版本会在容器中显示。例如，您可以使用基本组合小部件创建照片库，其中缩略图触发器在用户单击触发器时显示全尺寸照片。\n\
  \n**小部件库**菜单的 **组合** 部分包括以下内容：\n\n- - **空白**：此小部件由多个小缩略图组成，您可以手动将其链接到较大的容器区域。当单击缩略图时，大容器的内容会相应更改。\n\
  - - **精选新闻**：此小部件与我们在上一章中看到的手风琴和选项卡式小部件 somewhat 相似。当单击文本触发器时，主要内容会更改，主要内容可以由文本和图像组成。\n\
  - - **灯箱显示**：当单击缩略图时，其余页面变暗，而目标的内容处于活动状态。\n- - **演示**：此小部件由链接到较大幻灯片或图像的小编号缩略图组成。默认情况下，幻灯片水平滑动。\n\
  - - **工具提示**：当用户将鼠标悬停在触发器上时显示文本作为工具提示。\n\n每种小部件类型都有不同的显示行为，允许您轻松地为网站添加复杂的功能，如以下屏幕截图所示。与\
  \ Muse 中所有可用的小部件一样，组合小部件完全可编辑和可定制：\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_203_0.png)\n\
  \n## 使用图像与小部件\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_203_1.png)\n\n添加到幻灯片或组合小部件的图像应以适合\
  \ Web 的格式保存，即 GIF、JPEG 或 PNG。也可以使用原生 Photoshop 文件 .psd，因为 Muse 会将其转换为正确的 Web 格式。提前以您希望在幻灯片中显示的大小保存图像。Muse\
  \ 会自动生成较小的缩略图，并在您完成网站并准备上传时创建图像文件夹。图像可以链接到计算机上的任何位置。\n\n\n\n\n\n## 使用空白合成创建简单的照片库\n\
  \n我们将创建一个由三张图片组成的照片库。使用空白合成，我们可以“告诉” Muse 哪个触发器对应于目标区域中出现的较大图像。按照以下步骤创建简单的照片库：\n\
  \n- 1. 在设计视图中打开页面，并从部件库菜单中拖出空白合成部件。\n- 2. 单击一次合成部件以选择整个部件。现在你可以将其放置在页面上的任何位置。\n\
  - 3. 单击目标区域下方的第一个浅灰色触发器缩略图以选择它。\n- 4. 单击控制栏上的填充链接。从下拉菜单中，单击图像图标并浏览以在合成部件图像面板中选择第一个冲浪图像。将适配设置为缩放以填充，如以下屏幕截图所示：\n\
  \n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_204_0.png)\n\n请注意，状态部件中状态列表中的缩略图现在都相同了。如果你想创建悬停效果，可以单击该部件中的悬停状态，然后像之前那样更改图像。对于本示例，我们保持一切简单，因此我们将对所有四个可用状态使用相同的缩略图。\n\
  \n- 5. 通过重复步骤 4 向剩余的触发器添加另外两个缩略图图像。从合成部件图像文件夹中选择图像。\n- 6. 如果你想添加额外的缩略图，单击触发器元素右侧出现的加号\
  \ (+) 图标。如果你想删除一个触发器，选择它并按下计算机键盘上的 Delete 键。\n\n## 向目标区域添加内容\n\n我们的下一步是使用以下步骤将较大的图像添加到目标区域，这样当我们单击缩略图时，正确的图像就会出现：\n\
  \n- 1. 在设计视图中，再次单击一次合成部件以选择整个部件。\n- 2. 单击一次第一个缩略图以选择触发器。\n- 3. 单击较大的内容区域以选择它。通过先单击触发器然后单击目标，我们是在告诉\
  \ Muse 这两者是关联的。\n- 4. 在内容区域被选中的情况下，单击下拉填充菜单并添加第一张图像。再次将适配设置为缩放以填充。\n\n> 在本示例中，我们添加的是图像，但你可以向目标中添加任何类型的你喜欢的内容。\n\
  \n5. 重复步骤 1 到 4 为第二个和第三个缩略图的目标添加内容。当你将图像添加到触发器和目标后，它应该看起来像以下屏幕截图：\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_206_0.png)\n\
  \n6. 在预览视图中测试你的照片库，并确保大图像与缩略图图像匹配。\n\n> 你可以单独更改每个缩略图和每个目标区域的大小。只需单击一次以选择整个部件，再次单击以选择触发器（缩略图）或目标。一旦元素被选中，一个带有角落手柄的边界框就会出现。拖动手柄可以调整元素大小。\n\
  \n## 更改合成部件选项\n\n每个合成部件都提供多个设置部件功能方式的选项。要访问选项，请单击编辑选项图标——蓝色箭头。在下面的列表中，你将找到我们刚刚添加到页面上的空白合成可用的每个选项的说明：\n\
  \n- **位置**：这设置目标区域在页面上的位置。通过选择**堆叠**，所有内容都会重叠，例如目标内容出现在网页的同一位置。通过选择**分散**，可以让你将每个目标容器放置在页面上的不同位置。选择**灯箱**会使网页的其余部分变暗并将焦点放在目标内容上。\n\
  \n- **事件**：我们可以选择在用户单击缩略图时更改目标区域中的内容 – **单击时** 或在用户将鼠标悬停在缩略图上时 – **悬停时**，如以下屏幕截图所示：\n\
  \n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_207_0.png)\n\n- **过渡**：我们可以指定在触发器被单击或悬停时内容如何变化。动画过渡的选项有：\n\
  \n  - **淡入淡出**：这会在同时淡出之前目标的同时淡入新的目标内容。\n  - **水平**：这会使新的目标内容以水平滑动的方式滑入。\n  - **垂直**：这会使新的目标内容以垂直滑动效果滑入。\n\
  \  - **速度**：这里的选项指定过渡的速度。如果你想要即时过渡，请选择**无**。\n\n- **自动播放**：此选项创建无需用户交互的幻灯片。\n- **初始隐藏全部**：此选项在页面首次加载时隐藏所有目标区域。为了查看内容，用户需要单击触发器。\n\
  - **部件**：如果你想添加额外的用户交互，可以使用这些选项在部件中显示上一个、下一个或关闭按钮。\n- **编辑时显示灯箱部件**：如果你在**位置**下选择了**灯箱**选项，你就可以在**设计**视图中编辑时隐藏或显示目标区域的内容。\n\
  - **设计模式下显示全部**：此选项让你在**设计**视图中同时显示所有目标内容区域。默认情况下此选项未选中，意味着在**设计**视图中只显示所选触发器元素的目标内容。\n\
  \n## 使用多张图片创建触发器和目标的另一种方法\n\n在之前的示例中，我们手动先将图像添加到触发器，然后添加到目标区域。我们单独设置每个触发器和目标。还有另一种方法可以同时向目标区域添加多张图像，Muse\
  \ 会自动为你创建相应的触发器元素，按以下步骤操作：\n\n- 1. 在**设计**视图中，将一个新的空白**合成**部件添加到页面。\n- 2. 单击一次**合成**部件以选择整个部件。\n\
  - 3. 再次单击以选择较大的目标区域。\n- 4. 选择**文件 | 放置**。\n- 5. 选择你想要放置的多个图像。按住 *Ctrl*（Windows）/*Cmd*（Mac\
  \ OS）键以从文件夹中选择多个图像。\n- 6. 单击**选择**（Windows）或**打开**（Mac OS）。\n\n7. 通过单击目标的内容区域内放置图像组，如以下屏幕截图所示。Muse\
  \ 会自动为每张图像添加触发器元素：\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_209_0.png)\n\n8.\
  \ 不幸的是，它不会将相应的图像添加到缩略图触发器中。如果你想这样做，那么选择每个触发器元素并放置与对应目标区域匹配的图像以创建缩略图图像触发器。\n\n##\
  \ 幻灯片部件\n\n幻灯片部件的工作方式与合成部件非常相似，主要区别在于幻灯片部件专门用于图像，而合成部件可以处理任何类型的内容。部件库菜单中可用的幻灯片部件类型有：\n\
  \n- **基础**：基础幻灯片部件由一个大内容区域组成，四周环绕着深灰色边框。在内容区域下方有标题区域、幻灯片或图像的数量以及下一个和上一个按钮。当你拖出部件时，它预装了三张幻灯片。\n\
  \n- **空白**：**空白幻灯片**部件与**基础幻灯片**部件类似，只是当你将其拖放到页面上时它是空的。\n- **灯箱**：**灯箱幻灯片**部件会在画廊元素处于活动状态时使页面的其余部分变暗。这是网络上非常流行的一种幻灯片类型，因为它使访客的注意力集中在画廊元素上，同时减少了页面上的其他干扰。\n\
  - **缩略图**：**缩略图幻灯片**部件显示缩略图，默认情况下缩略图位于较大内容区域的左侧。随着用户单击缩略图，图像会变大。\n\n以下屏幕截图显示了不同类型的幻灯片：\n\
  \n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_210_0.png)\n\n与 Muse 中的其他部件一样，幻灯片部件完全可编辑和可定制。\n\
  \n\n\n\n\n## 创建幻灯片演示\n\n本章前面我们创建了一个照片库，需要用户点击缩略图才能看到大图。这种功能也可以使用 Lightbox Slideshow\
  \ 小部件或 Thumbnails Slideshow 小部件来实现。它们的工作方式与我们已创建的照片库非常相似，因此与其重现那些步骤，在下一个示例中我们将使用\
  \ Blank Slideshow 小部件创建一个幻灯片。我们将更改设置，使幻灯片自动播放，循环播放一系列图像。我们将指定过渡效果和幻灯片播放的速度。执行以下步骤创建幻灯片演示：\n\
  \n- 1. 在 Design 视图中打开你的页面。\n- 2. 在 Widgets Library 菜单中，选择 Blank Slideshow 小部件并将其拖到页面上。\n\
  - 3. Blank Slideshow 小部件由一个深灰色矩形组成，用于容纳我们的 large 图像、一个标题区域、一个图像计数器，以及用于导航的下一张和上一张图像按钮。\n\
  - 4. 点击蓝色箭头以访问 Options 菜单。点击顶部 Add Images... 选项旁边的文件夹图标。\n- 5. 导航到你的图像文件夹并选择要添加到幻灯片中的任意数量的图像。按住\
  \ Ctrl/Cmd 选择多个图像，然后点击 Open。\n- 6. 你的图像将被添加到内容区域，图像计数器中的数字将增加以反映幻灯片中的图像数量。Muse 的默认图像仍保留在幻灯片中。我们在添加自己的图像后只需删除这些图像。\n\
  \n7. 再次点击蓝色箭头以打开小部件的 Options 菜单，如以下屏幕截图所示：\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_212_0.png)\n\
  \n8. 设置以下选项：\n\n- Transition: Horizontal\n- Auto Play: Medium\n- New Hero: Fill\
  \ Frame Proportionally (Hero 只是主图像的名称)\n- New Thumbnail: Fill Frame Proportionally\
  \ – 这里无关紧要，因为我们不使用缩略图\n- Lightbox: Deselected\n- Parts: 取消选择所有选项以隐藏标题、计数器、下一个和上一个按钮\n\
  \n设置这些选项后，页面上只剩下一张图像。\n\n9. 选择 Preview 以查看幻灯片在浏览器中的工作方式。当所有图像都显示完毕后，幻灯片将循环回到第一张图像并继续播放。\n\
  \n10. 如果你想更改幻灯片的大小，请返回 Design 视图并拖动 Hero 图像框架的其中一个角柄。拖动时按住 Shift 以限制幻灯片的比例。随着拖动，你会看到深灰色区域增大，以及图像本身。\n\
  \n在当前设置下，此幻灯片不需要用户交互。如果你决定想让用户控制幻灯片，再次点击蓝色箭头以打开小部件的选项。\n\n11. 要为大图像提供对应的缩略图，请在 Parts\
  \ 部分选择 Thumbnails。\n\n12. 要提供下一张和上一张图像控制器按钮，请在 Parts 部分选择这些选项。\n\n13. 你可以将小部件的每个部分放置在页面的不同位置。记住先单击一次以选择整个小部件，然后单击小部件的各个部分将其定位到你想要的位置。\n\
  \n14. 选择并将缩略图定位在主图像区域下方。\n\n15. 选择并将下一个和上一个按钮定位在主图像的顶部和右侧，如以下屏幕截图所示：\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_213_0.png)\n\
  \n## 插入任意 HTML\n\n虽然 Muse 为我们在本书中看到的所有内容编写了 HTML 和 CSS，但有时你可能需要自己添加一点 HTML。别担心；你也不必编写这段代码。假设例如你想在网站上添加一个\
  \ Google 地图，以向客户或感兴趣的各方展示你的位置。Google 会为你提供代码，你只需复制它，然后将其粘贴回 Muse 中的页面即可。\n\n另一个例子是如果你想添加一个\
  \ YouTube 视频。你不需要托管视频，只需粘贴 YouTube 提供的一些代码，视频就会出现在你的页面中嵌入。 使用此类服务的一个巨大优势是，你不必担心托管视频内容，它仍然由\
  \ YouTube 托管，看起来就像在你的网站上一样。\n\n在网站页面上使用任意 HTML 允许你在页面上设置一个窗口，供第三方内容出现。正如你所能想象的，这为你在无需编写自己的代码的情况下可以添加到页面上的内容打开了巨大的可能性。你可以让访客知道天气会如何，展示你家乡的地图，用音频和视频给他们留下深刻印象，或为他们提供股市报价。\n\
  \n## 向你的页面添加 Google 地图\n\n让我们使用以下步骤向新页面添加地图：\n\n- 1. 在 Plan 视图中，点击 Home 页面下方的加号符号\
  \ (+) 添加新页面。\n- 2. 将新页面重命名为 Location。请注意，新页面自动采用 A-Master 页面，因为它是子页面或使用 A-Master\
  \ 页面的 Home 页面。\n- 3. 双击新的 Location 缩略图以在 Design 视图中打开它。向 Location 添加一个标题并使用你在上一个练习中创建的\
  \ Heading 样式对其进行样式设置。\n- 4. 打开一个 Internet 浏览器并前往 Google Maps，地址为 maps.google.com。\n\
  - 5. 输入地址或搜索词以找到你希望出现在地图上的位置。\n- 6. 点击界面左上角出现的 Link 按钮。\n- 7. 点击界面右上部分出现的 Link 按钮。再次点击\
  \ Customize And Preview Embedded Map 选项。\n\n8. 一个新的 Customize 窗口出现，允许你更改将在页面上嵌入的地图大小。选择\
  \ Map size 中的 Custom 单选按钮，将 Width 设置为 800 像素，Height 设置为 400 像素，如以下屏幕截图所示：\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_215_0.png)\n\
  \n9. 你可能需要重新定位窗口内的地图，以确保图钉和地址文本完全可见。你可以通过简单地点击并拖动地图，直到图钉和地址位于你想要的位置来实现。\n\n- 10.\
  \ Google 会即时生成地图的代码，你可以选择并复制它。\n- 11. 返回 Muse。选择 Object | Insert HTML 以打开 HTML 代码窗口。使用键盘快捷键粘贴代码（Windows\
  \ 为 Ctrl + V，Mac 为 Cmd + V）将你复制的代码粘贴进去。\n- 12. 使用 Selection 工具将地图定位到页面上的所需位置，如以下屏幕截图所示：\n\
  \n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_216_0.png)\n\n在 Design 视图中，你将能够了解 Google\
  \ 地图对访客的外观。为了查看地图如何交互工作，请点击 Preview 以查看它在实时网站上的外观。你可以放大、缩小并在嵌入在页面上的地图上移动。\n\n##\
  \ 向你的网站添加 Twitter（或其他类型）feed\n\n除非你一直生活在山洞里，否则你很可能听说过或使用过 Twitter。许多 Twitter 用户将其“tweets”feed\
  \ 添加到其网站或博客中，这可能是你想对自己的 Muse 构建的网站所做的。无论你添加的是 Twitter feed 还是 RSS feed 或任何其他类型的动态数据到你的网站，过程本质上是相同的。以下步骤展示了如何为\
  \ Twitter feed 执行此操作：\n\n- 1. 你需要有一个 Twitter 账户。Twitter 注册免费，使用也免费。注册后，前往 twitter.com/goodies/widgets，你可以在那里获取一个小部件以添加到你的网页。\n\
  - 2. 你可以选择希望 Twitter 小部件如何工作。你可以仅显示你的 tweets、你喜欢的 Twitter 配置文件的 tweets、你喜欢的 tweets，或关于你选择的主题的话题\
  \ tweets 流。\n- 3. 一旦做出选择，你就可以设置你的小部件。你可以使用 Settings、Preferences、Appearance 和 Dimensions\
  \ 菜单进行更改。选择一种与你自己的网站配色方案相匹配或互补的配色方案。\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_217_0.png)\n\
  \n\n\n\n\n4. 当你设置好 Twitter 小部件的“外观”后，点击 Finish And Grab Code 按钮。你会看到一段可以复制的 HTML\
  \ 代码。选中所有代码，使用 Ctrl + C/Cmd + C 复制，然后返回 Muse。\n\n5. 在 Muse 中的 Design 视图中，选择 Object\
  \ | Insert HTML 并通过按 Ctrl + V/Cmd + V 将你复制的代码粘贴到对话框中。点击 OK。\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_218_0.png)\n\
  \n6. 你的小部件现在会出现在页面上。通过使用 Preview 视图进行测试。\n\n## Summary\n\n在本章中，我们讨论了 Composition\
  \ 和 Slideshow 小部件，它们允许我们在几乎没有任何编码的情况下为页面添加非常有用的交互性和功能。我们还看到了如何从其他网站（如 YouTube、Google\
  \ Maps 和 Twitter）获取代码并将其嵌入到我们的 Muse 网页中。\n\n在下一章中，我们将了解 Muse 如何与 Photoshop 和 Fireworks\
  \ 等其他 Adobe 产品良好协作。\n"
- "## 10\n\n## Muse，认识 Adobe Creative Suite\n\n在上一章中，我们使用 Muse 内置的小部件为页面添加了幻灯片。如果你使用\
  \ Adobe 的其他产品，如 Photoshop，你会很高兴知道 Muse 与 Adobe Creative Suite 中的其他产品紧密集成。Adobe Muse\
  \ 不是 Adobe Creative Suite® 6 发行版的一部分，但它是 Adobe Creative Cloud 会员的一部分。然而，即使你使用的是\
  \ Photoshop 和 Fireworks 的旧版本，Muse 也能很好地处理你使用这些程序创建的文件。\n\n在本章中，我们将了解如何使用 Photoshop\
  \ 或 Fireworks 创建图形并轻松将其带入你用 Muse 创建的网站。我们将学习如何：\n\n- 创建并添加一个 Photoshop 按钮\n- 添加基于\
  \ Photoshop 或 Fireworks 的图形\n- 使用 Edit Original 用 Photoshop 或 Fireworks 编辑图像\n\n\
  ### 添加 Photoshop 悬停按钮\n\n悬停按钮是由网页设计师创建的图形，它在页面访客和页面本身之间提供交互性。“悬停”一词源于这样一个想法：当访客将鼠标移过按钮时，视觉上会发生某些变化。\n\
  \n简单的悬停效果使用两张图像。第一张图像是我们首次加载页面时看到的图像。当我们将鼠标悬停在该按钮上时，第二张图像会迅速替换显示。当我们将鼠标移离按钮时，第一张图像会恢复显示。这种类型的交互性使用\
  \ JavaScript 创建，但与往常一样，Muse 在幕后完成工作并为我们编写代码。\n\n> 悬停有时也被称为 mouseovers。\n\n悬停不一定使用图像；最简单的悬停完全使用文本。文本可能只是改变颜色或以粗体、斜体或下划线显示。我们在第\
  \ 6 章《Typography, Muse, and the Web》中添加菜单系统到页面时创建了一些基于文本的悬停效果。悬停的想法，无论是否基于图像，都是交互性为用户提供反馈并告诉他们这是一个按钮，将鼠标移过时会发生某些事情。而且通常点击它时也会发生某些事情。\n\
  \n### States\n\n我们可以通过添加第三张图像来进一步扩展悬停按钮。第三张图像在用户实际点击按钮时出现。还有一个选项可以使用第四张图像，如果你希望按钮在被点击后以某种方式显示。\n\
  \n图像在网站上的显示方式可能会根据鼠标是否悬停在其上、点击它或移开而改变。每一种鼠标位置都被称为一个 State。我们可以在 Photoshop 或 Fireworks（或任何其他图形编辑器）中创建使用以下四种状态的按钮：\n\
  \n- Up：用户未与其交互时按钮的外观\n- Over：用户将鼠标移过它时按钮的外观\n- Down：用户选择（点击）它时按钮的外观\n- Active：按钮被点击后其外观\n\
  \n> 你不必使用四种状态，甚至如果不想的话也不必使用三种，只要知道这些状态是可用的即可。\n\n在下面的屏幕截图中，取自 Apple 网站，我们可以看到三种状态。当页面首次加载时，菜单上的所有按钮看起来都一样。它们都处于\
  \ Up State。当用户将鼠标悬停在菜单项上时，按钮会变为深灰色。当用户点击按钮时，按钮图像顶部和右侧的一些阴影给人一种按钮被按下下来的印象。\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_222_0.png)\n\
  \n### 在 Photoshop 中创建具有多种状态的悬停按钮\n\n在本节中，我们将使用 Photoshop 创建一个类似的具有三种状态的按钮。如果你没有\
  \ Photoshop 的副本，可以跳到下一节，我们将在其中将按钮添加到页面，你可以使用提供的 .PSD 文件。\n\n1. 打开 Photoshop 并创建一个新的图像，宽度和高度分别为\
  \ 200 像素 x 75 像素。\n2. 在图层面板中，点击 New Group 图标。点击图层面板中的新组名称并将其重命名为 Up。\n3. 在工具面板上，将前景色设置为红色。\n\
  \n4. 选择 **Rounded Rectangle Tool**（它可能隐藏在矩形形状工具下）。在 Photoshop 界面顶部的工具选项栏上，确保第一个图标\
  \ **Shape Layers** 已被选中。拖放一个圆角矩形到文档窗口。\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_223_0.png)\n\
  \n一个新的形状图层已添加到 **Up** 组。现在我们将添加一些文本。\n\n5. 在工具栏上选择 **Type** 工具。在工具顶部选项栏上将颜色设置为白色并选择你喜欢的任何字体。点击红色矩形并输入\
  \ Read More。会添加一个新的文本图层，位于矩形形状图层之上。确保 **Read More** 居中在矩形上方。\n\n6. 现在我们需要为 **Over**\
  \ 和 **Down** 做类似的设置，但与其重复整个过程，我们只需复制我们为 **Up** 状态制作的组结构。\n\n7. 右键点击 **Up** 文件夹并选择\
  \ **Duplicate Group**。将新组命名为 Over 并点击 **OK**。\n\n8. 新的 **Over** 组包含之前制作的图层的精确副本。我们将对文本图层中文字的颜色进行更改。\n\
  \n9. 再次选择 **Type** 工具并点击 **Read More copy** 图层。现在在屏幕顶部的工具选项中，将文字颜色更改为黑色。\n\n10.\
  \ 现在让我们再创建一个组。选择你最初创建的 **Up** 组，然后右键点击它并选择 **Duplicate Group**。将新组命名为 Down 并点击 **OK**。\n\
  \n11. 再次你拥有了 **Up** 组的精确副本。这次我们将文字保持为白色，但我们将添加一个图层效果，使按钮看起来像被按下。\n\n12. 在 **Down**\
  \ 组中选择 **Shape 1 copy** 图层。点击图层面板底部的 **fx**（图层样式）图标。从下拉菜单中选择 **Inner Shadow**。\n\
  \n13. 在 Inner Shadow 对话框中，将 Distance 设置为 2 px，Size 设置为 2 px。按钮上会出现一个小的暗影。如果我们想改变阴影的方向，拖动\
  \ Angle 按钮进行圆形移动。点击 OK。\n\n14. 所以在所有这些之后，我们的图层和按钮应该看起来与以下屏幕截图相似：\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_224_0.png)\n\
  \n15. 我们必须合并每个组中的图层，以便每个组只包含一个图层。从顶部组（Down）开始。点击文本图层然后 Shift + 点击形状图层以便两个图层都被选中。右键点击并从下拉菜单中选择\
  \ Merge Layers。我们会看到我们的两个图层已变成一个图层。\n\n16. 对 Over 组和 Up 组重复此过程，以便每个组只包含一个合并的图层。\n\
  \n17. 对于每个合并的图层，返回并重命名图层为 Up、Over 和 Down，如后面的屏幕截图所示。\n\n\n\n\n\n18. 最后，我们不需要白色背景图层。点击\
  \ Background 图层将其选中，右键点击并选择 Delete Layer，或者直接按下键盘上的 Delete/Backspace 键。我们的最终图层设置应与以下截图类似：\n\
  \n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_225_0.png)\n\n19. 将文件与你为网站使用的其他图像一起保存。将其命名为\
  \ ReadMore.psd。\n\n## Placing the Photoshop button\n\n现在我们已经完成了准备分层文件的繁重工作，就可以将该按钮图形放置到页面上了。你可以通过以下步骤操作：\n\
  \n- 1. 在 Muse 中，在 Design 视图中打开你想要放置按钮的页面。\n- 2. 选择 File | Place Photoshop Button。Place\
  \ Photoshop Button 对话框出现。浏览找到你的 Photoshop 文件 ReadMore.psd。点击 Select。\n- 3. Photoshop\
  \ Import Options 对话框出现。这让我们可以看到 Normal State、Rollover State、Mouse Down State 和 Active\
  \ State 的预览（或在网页设计中常被称为 Up、Over、Down 和 Active）。\n\n使用下拉菜单，我们可以指定 Photoshop 文件中的哪个图层将显示为按钮的\
  \ Normal State（或 Up 状态）、Rollover State（或 Over 状态）以及 Mouse Down State（或 Down 状态）。三个状态菜单会显示\
  \ Photoshop 图层的名称，并且缩略图会直观地显示每个所选图层的外观。你可以使用以下选项：\n\n- - 对于 Normal State，从下拉菜单中选择\
  \ Composite\n- - 对于 Rollover State，选择 Over 图层\n- - 对于 Mouse Down State，选择 Down 图层\n\
  \n由于我们只为这三种状态设置了图层，因此可以将 Active 状态保留为 None。\n\n4. 你可能会发现 Muse 已经为你正确选择了图层，根本无需更改菜单设置。点击\
  \ OK 以接受默认排列的状态。\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_226_0.png)\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_227_0.png)\n\
  \n在本示例中，我们使用非常简单的图形为一个外观相当标准的按钮创建了三种不同的状态。然而，在创建按钮时，你的想象力是唯一限制。它们甚至不一定非得看起来像按钮。一些设计师会为每个状态使用许多图层创建精美的设计。需要记住的关键是，在最终放置到\
  \ Muse 之前，先将每个组中的图层合并为一个图层。\n\n5. 单击一次将 Photoshop 按钮放置到页面上。\n与 Muse 中的大多数对象一样，我们可以根据需要缩放、旋转和定位新的\
  \ Photoshop 按钮。\n\n6. 点击 Preview 链接来测试按钮。页面首次加载时，按钮的 Normal State 会出现。当我们将光标悬停在按钮上时，Read\
  \ More 文本会变为黑色，当我们点击按钮时，文本会变回白色，并且按钮上会出现内阴影。我们可以按住按钮任意长时间，它都会保持这种外观。\n\n## Adding\
  \ a Photoshop image that's not a button\n\n大多数设计师使用 Photoshop 不仅仅是创建按钮而已。在创建图像时，Photoshop\
  \ 几乎只受我们想象力的限制。当我们在第 7 章 Working with Images 中讨论添加图像时，我们讨论了可在 Web 上使用的三种主要图像格式，即\
  \ JPEG、GIF 和 PNG。那么分层 Photoshop 文件（PSD）又如何融入其中呢？\n\n答案是 Muse 让我们可以将多层 PSD 引入页面中，并在保存时创建该文件的一个适合在\
  \ Web 上显示的文件格式版本。最好还是让 Photoshop 将其转换为 JPEG、GIF 或 PNG，因为它在图像压缩方面做得更好，但让我们看看如何将 PSD\
  \ 文件引入 Muse：\n\n- 1. 在 Design 视图中打开你的页面。\n- 2. 点击 File | Place。\n- 3. 浏览到你的 PSD\
  \ 文件所在的文件夹，选择它并点击 Open。\n\n4. Image Import Options 框打开。你可以选择将图像作为 Composite Image\
  \ 导入，或导入单个 Layer。如果选择 Composite，你将导入分层文件的扁平化版本。如果选择单个图层，你可以仅在透明背景上选择一个图层。选择 Clip\
  \ To Layer Contents 意味着图像将被裁剪以去除该图层上对象周围的额外空间。\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_228_0.png)\n\
  \n5. 点击 OK，然后将图像定位到页面上的所需位置。同样，你可以根据需要缩放和旋转图像。\n\n## Editing our Photoshop file\n\
  \nMuse 在处理 PSD 文件时提供的一个不错功能是，我们可以轻松返回并对 PSD 进行更改，它将在 Muse 网页中自动更新。使用以下步骤操作：\n\n\
  - 1. 在 Assets 面板中，你会看到新图像列为 YourFilename.psd。在面板中右键点击其名称以查看菜单选项列表。\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_229_0.png)\n\
  \n- 2. 如果你需要返回并编辑原始 PSD 文件，请选择 Edit Original。这会带你返回 Photoshop，你可以随意进行尽可能多的更改。\n\
  - 3. 在 Photoshop 中完成编辑后，选择 File | Save。\n- 4. 返回 Muse，你会看到对 PSD 所做的更改会立即反映出来。\n\n\
  > 如果你的更改未出现，再次右键点击 Assets 面板中的文件名并选择 Update Asset。你现在应该能看到更新生效。\n\n## Paste an image\
  \ from another program\n\n假设我们在 Photoshop、Illustrator 或 Fireworks 中创建了其他图像，并且想要将其中一个图像的全部或部分直接带入\
  \ Muse。操作方法如下：\n\n- 1. 在另一个程序中，例如 Adobe Illustrator，通过选择其全部或部分，然后在键盘上选择 Ctrl + C（Windows）或\
  \ Command + C（Mac OS）来复制图像。在本示例中，我们复制了一个使用 Illustrator 中许多路径创建的图像。\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_230_0.png)\n\
  \n- 2. 在 Muse 的 Design 视图中打开我们想要放置图像的网页，并通过选择 Edit | Paste，或使用键盘上的 Ctrl + V（Windows）或\
  \ Command + V（Mac OS）来粘贴图像。\n- \n- 就这样，图像出现在页面上。我们可以为图像添加描边或链接，以及根据需要进行缩放、旋转或定位。\n\
  - 3. 查看 Assets 面板。注意现在其中列出了一个对象为 clipboard。这是我们刚刚从其他程序粘贴的文件。当我们保存网站时，Muse 会将此资源作为网站的一部分保存。\n\
  \n## Embedding rich media content\n\n如果我们有一些富媒体，例如需要添加到网页中的 Flash 演示文稿，我们可以像添加图像一样轻松地完成此操作。请按照以下步骤操作：\n\
  \n- 1. 在 Design 视图中打开你想要添加媒体文件的页面。\n- 2. 选择 File | Place。在 Import 对话框中，导航到包含媒体文件的文件夹并选择所需的文件。Muse\
  \ 支持 Adobe Flash SWF 文件。\n- 3. 点击 OK 并将对象放置到页面上的所需位置。\n\n如果我们想向页面添加视频文件，强烈建议将视频上传到\
  \ YouTube 等服务。YouTube 主机托管视频，因此我们不必担心网站的带宽问题。我们只需按照第 9 章 More Widgets – Compositions\
  \ and Slideshows 中概述的方式，将 YouTube 提供的任意 HTML 代码添加到页面中即可。\n\n## Summary\n\n在本章中，我们简要研究了如何在\
  \ Photoshop 中创建分层图像，然后将其作为 Photoshop 按钮放置在 Muse 中。这使我们能够创建具有多种状态的按钮，这是一种向网站访问者提供反馈的有用方式。我们还看到了将另一个程序中创建的图像复制并粘贴到\
  \ Muse 中是多么容易。\n\n在下一章中，我们将研究在发布网站之前预览和测试整个网站。\n\n\n\n\n"
- "## 11\n## 预览和测试你的网站\n\n一旦你完成了组建网站的所有艰苦工作，最后的障碍就是测试、测试、再测试。这是网页设计过程中非常重要的一部分，涉及在各种浏览器中预览你的网站，以确保一切正常工作。你在制作网站的过程中已经通过边做边预览页面进行了一些测试。\n\
  \n在本章中，我们将了解 Muse Preview 如何使用 WebKit 来渲染预览，并讨论如何严格测试你的网站。我们将研究如何：\n\n- 在 Muse 中预览单个页面\n\
  - 在浏览器中预览单个页面\n- 在浏览器中预览整个网站\n- 导出 Muse 网站的 HTML 及所有相关资源\n- 遵循一套测试网站的步骤\n\n## 预览页面\n\
  \nAdobe Muse 使用 WebKit 作为预览的渲染引擎。WebKit 是一个开源布局引擎，创建目的是让网络浏览器能够渲染网页。它驱动了 Apple Safari\
  \ 和 Google Chrome 浏览器。它也被用作亚马逊 Kindle 电子书阅读器中包含的实验性浏览器的基础，以及 iOS、Android、BlackBerry\
  \ Tablet OS 和 webOS 移动操作系统的默认浏览器。\n\n这意味着当你在 Muse 内部预览页面或网站时，你将对它在前面提到的所有浏览器上的显示效果有一个相当好的了解。\n\
  \n## 完成网站\n\n要完成我们迄今为止构建的网站，请将文本添加到 Home 和 Sails 页面，这些文本以 .txt 文件提供。向 Contact 页面添加一个虚构的地址和电子邮件链接。\n\
  \n完成的冲浪网站也以 Windsurf-CompleteSite.muse 的形式提供，如以下屏幕截图所示：\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_233_0.png)\n\
  \n## 在 Muse 中预览页面\n\n如果你一直跟着做，你现在已经多次做过这个操作，但这里快速回顾一下如何在 Muse 中预览页面的方法：\n\n- 1.\
  \ 在设计视图中打开你想要预览的页面。\n- 2. 点击 Muse 界面左上角的 Preview 链接。\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_233_1.png)\n\
  \n## 在浏览器中预览页面\n\n虽然从 Muse 中预览显然非常方便快捷，但作为你测试流程的一部分，你应该在外部浏览器中预览在 Muse 中创建的网页。请按照以下步骤操作：\n\
  \n- 1. 在设计视图中打开你想要预览的页面。\n- 2. 选择 File | Preview Page in Browser，如以下屏幕截图所示：\n\n\
  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_234_0.png)\n\n## 在浏览器中预览整个网站\n\n如果你想在预览时测试链接，你需要让\
  \ Muse 为整个网站创建预览文件。\n\n要从主页开始预览整个网站，请选择 File | Preview Site in Browser。\n\n## 导出\
  \ HTML 以便在浏览器中测试\n\n在第 12 章《发布你的网站》中，我们将了解如何发布我们的网站以及可用的各种选项。然而，作为测试的一部分，我们可以导出\
  \ HTML 文件并检查 Muse 创建的资源。导出 HTML 文件意味着文件存储在我们的计算机本地，我们可以访问并查看 Muse 生成的内容。\n\n## 预览和测试你的网站\n\
  \n当你导出网站时，Muse 会切片和优化图像，并创建一个文件夹来保存这些图像、HTML、层叠样式表以及使网站发挥魔力的脚本。\n\n如果你对代码感兴趣，可以在任何文本编辑器中打开\
  \ HTML 文件，查看构建页面的标签。如果你对代码不感兴趣，而大多数使用 Muse 的人不会感兴趣，你只需在机器上安装的任何浏览器中打开 index.html（你的主页）并在本地测试即可。\n\
  \n要将整个网站导出为 HTML，请按照以下步骤操作：\n\n- 1. 选择 File | Export as HTML 或按 Ctrl + E（Windows）或\
  \ Command + E（Mac）。\n- 2. 在 Export to HTML 对话框中，通过点击文件夹图标指定文件将保存到计算机上的位置，然后点击 OK。\n\
  \n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_235_0.png)\n\n你的文件将出现在你指定的文件夹中，应与以下屏幕截图类似：\n\
  \n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_236_0.png)\n\n> 在拍摄此屏幕截图的计算机上，Chrome\
  \ 设置为默认浏览器；这就是为什么在每个生成的 HTML 文件旁边都出现 Chrome 图标。\n\n## 在已安装的浏览器上查看你的主页\n\n你可以通过右键单击（Windows）/\
  \ Command + 单击（Mac）并从菜单中选择 Open With，然后选择你想要查看 HTML 页面的浏览器，来在计算机上安装的任何浏览器中打开主页。\n\
  \n## 测试什么？\n\n测试应在网站开发的每个阶段完成。新设计师常犯的两个错误是等到发布前才测试，或根本不测试。\n\n如果你一直跟着书本进行，你会在每次创建页面后通过点击\
  \ Preview 链接进行一些测试。通过在过程中进行测试，我们减少了如果留到发布前可能出现的错误和 bug。信息是，在整个 Muse 项目中持续测试和预览。\n\
  \n那么我们需要测试什么呢？\n\n## 在多个浏览器和平台上测试你的网站\n\n即使你的网站在 Muse 中看起来不错并且运行良好，也并不意味着它在其他浏览器和/或平台上看起来一样好或功能一样好。Adobe\
  \ 创建了一个产品，应该能创建在所有浏览器和平台上看起来都好的网页，但检查和测试它们是否确实如此是你的工作的一部分。\n\n## 测试哪些浏览器和平台？\n\n\
  在第 2 章《Muse 工作流程》中，我们讨论了网页设计与印刷设计相比的挑战。主要挑战是访问你网站的访客可能使用多个平台和许多互联网浏览器。有许多流行的操作系统和浏览器你可以测试你的网站。\n\
  \n以下是操作系统的列表：\n\n- Macintosh OS X\n- Macintosh OS 9\n- Windows 7\n- Windows XP SP1\
  \ 和 SP2\n- Windows 2000\n- Windows 98\n- Linux\n- Android\n- iOS\n- Windows Mobile\n\
  \n以下是流行浏览器的列表：\n\n- Safari\n- Mozilla\n- Firefox\n- Chrome\n- Opera\n- Internet\
  \ Explorer\n- 移动设备浏览器\n\n有几个在线工具可帮助进行跨浏览器测试，因为你不太可能拥有所有类型的平台上的所有浏览器。查看以下网站，了解如何一次在多个浏览器上测试你的网站：\n\
  \n- Browsershots: http://www.browsershots.org/\n- Browsercam: http://www.browsercam.com/\n\
  - Browserlab: http://browserlab.adobe.com/\n\n只有 Adobe Browserlab 提供免费服务。\n\n##\
  \ 测试页面优化\n\n从一开始就优化你的页面可以帮助确保你的网站设计和图像支持快速的页面加载时间，并且网站的开发顺畅高效。我们已在第 7 章《处理图像》中讨论过图像优化的重要性，在最佳质量与最低文件大小之间取得平衡。\n\
  \n还有一些免费的在线工具可以计算文档权重、构成和页面加载时间，甚至提供优化网页文档的建议。查看 Website Optimization 的网页分析器：http://www.websiteoptimization.com/services/analyze/。\n\
  \n## 在各种显示器上查看页面\n\n访客将从台式电脑、笔记本电脑、平板电脑和智能手机访问你的网站。你的精美设计可能无法在每种显示器上都经受住考验，因此在尽可能多的这些显示器上尝试你的页面非常重要。\n\
  \n## 在不同的屏幕分辨率下查看页面\n\n与印刷设计不同，并非每个人都会以相同的分辨率查看你的网站。Firefox 的 Web Developer 插件是测试不同屏幕分辨率下网站的有用工具。它包含一个可自定义的窗口调整大小工具。\n\
  \n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_239_0.png)\n\n## 检查足够的颜色对比度\n\n确保人们能够轻松看到你的内容，通过在文本和背景之间提供良好的对比度。一个有助于检查设计颜色对比度的有用工具是\
  \ Vischeck（http://www.vischeck.com/），它模拟色盲视觉，让你看到页面就像色盲用户看到的那样。\n\n\n\n\n\n## 测试所有小部件的功能\n\
  \n如果你添加了 Muse 提供的便捷小部件功能，请确保它能正常工作。它应该可以工作，但不要忘记进行测试。如果出现问题，通常是由于旧版浏览器不支持某些功能。如果发现有大量访客使用旧版浏览器（你可以通过网站日志或\
  \ Google Analytics 随着时间的推移发现这一点），那么你可能需要为该功能提供替代方案。\n\n## 测试所有链接，包括导航\n\n确保所有链接都能正常工作。主导航中的链接是由\
  \ Muse 自动创建的，因此请检查它是否包含了你想要的所有页面，并且没有包含你不想要的页面。\n\n检查所有指向外部网站的链接，并检查你的锚点链接，确保它们能将访客带到正确的位置。\n\
  \n## 测试所有下载\n\n如果你添加了指向 PDF 文件等下载的链接，请确保你的下载链接指向正确的文件，并且下载文件确实存在。\n\n## 测试网站的无障碍合规性\n\
  \n使用至少两种不同的无障碍评估工具。W3C 无障碍倡议网站上提供了有用的工具列表：http://www.w3.org/WAI/RC/tools/complete。\n\
  \n## 校对所有内容\n\n拼写错误是网站访客的主要反感点。确保你进行拼写检查并通读网站的每个页面，以检查所有文本是否清晰、简洁且适合你网站的目标受众。\n\n\
  ## 可用性测试\n\n迄今为止列出的测试和检查是你自己可以完成的，但要真正测试你的网站，你需要一双新鲜的眼睛；理想情况下是几双眼睛。可使用性测试的主要目标是确保你的最终版本，即你的实时网站，对访客友好且运行良好。\n\
  \n你需要测试以下内容：\n\n- **有效性**：测试用户是否能够完成期望的任务\n- **效率**：测试完成期望任务所需花费的精力\n- **满意度**：测试用户是否拥有令人满意的体验并且会再次光临\n\
  \n你可能会惊讶于对你来说似乎完全显而易见的事情，可能会让独立的测试人员抓耳挠腮，不知道在你的网站上该做什么。\n\n> 要获取大量关于网站可用性的信息，请访问雅各布·尼尔森的网站：http://www.useit.com/。\n\
  > \n> 尼尔森先生被公认为网站可用性测试的先驱之一。你也可能会惊讶于该网站的简洁。\n\n其中一些测试只有在你将网站上传到服务器后才可能进行（我们将在下一章介绍），但许多测试可以通过在本地机器上测试来完成。\n\
  \n如果你正在创建一个非常大的网站，你需要进行额外的测试，但对于使用 Muse 创建的小型个人网站，测试到目前为止提到的所有内容就是一个良好的开端。\n\n##\
  \ 创建设备友好的网站\n\n虽然 Adobe 在 Muse 版本 1 中并未正式支持移动设备设计，但设计网站时可以考虑以下几点使其对移动设备友好：\n\n-\
  \ Adobe Flash 技术在 iPhone 和 iPad 上不受支持。这是苹果与 Adobe 之间产生一些敌意的来源。如果你将 Flash 放在你的网站上，iPhone\
  \ 或 iPad 用户将无法看到它。\n- 苹果也不喜欢固定图像。在 iPhone 和 iPad 上，你的固定图像将不会停留在你想要的位置。\n- 使用 对象\
  \ | 插入 HTML 添加到页面的某些嵌入式 HTML 可能在智能手机和平板电脑上产生意外结果。你应该在移动设备上测试网站，如果有问题，应删除嵌入式 HTML，看看其余页面是否表现正常。\n\
  - 触摸设备上没有悬停/悬停状态。在许多设备上，第一次触摸被视为悬停，第二次触摸则作为单击或按下状态。同样，需要在移动设备上测试，以确保你的菜单小部件和其他链接能正确工作。\n\
  - 为所有访客提供良好的用户体验。此时，很难甚至不可能在移动设备上复制桌面或笔记本电脑上的体验。因此，保持你的网站简单易用是确保你的网站在移动设备上表现良好的方法之一。\n\
  \n## 总结\n\n在本章中，我们了解了如何在 Muse 和浏览器中预览页面，如何在浏览器中预览整个网站，以及如何将网站导出为 HTML 及其相关资源。我们还讨论了测试以及作为设计师你应该检查的内容，并了解了一些使你的网站对移动设备友好的技巧。\n\
  \n在下一章也是最后一章中，我们将学习如何将网站发布到网络上。\n"
- "## 12\n\n## 发布你的网站\n\n你从零开始构建了网站，添加了文本、图像和交互性，现在是时候将你的辛苦成果发布到网络上了。最后一步也是令人兴奋的一步就是发布你的网站。在本章中，我们将了解如何将你的网站发布到网络上，让所有人都能看到。有两种方法可以托管你用\
  \ Muse 创建的网站，我们将介绍这两种方法。在本章中，你将学习以下主题：\n\n- 发布临时网站\n- 使用 Business Catalyst 发布你的网站\n\
  - 将你的网站发布到第三方托管提供商\n\n## Adobe ID\n\n当你首次下载并安装 Muse 时，需要创建一个 Adobe ID。如果你之前已创建过\
  \ Adobe ID（在 www.adobe.com 上访问其他 Adobe 服务），你可以使用相同的密码登录你的 Muse 账户。以下屏幕截图显示了一个登录窗口。\n\
  \n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_244_0.png)\n\n如果你购买了 Adobe Creative Cloud\
  \ 订阅，首次安装 Muse 时登录时将使用相同的密码。\n\n如果你之前创建了 Business Catalyst 账户并使用相同的登录电子邮件创建了 Adobe\
  \ ID，系统将检测到你输入的电子邮件地址与 Business Catalyst 数据库中的记录匹配。\n\n无论你如何首次设置 ID，在发布网站时你都需要知道该用户名和密码。\n\
  \n## 发布临时网站\n\n使用 Muse 时，你可以创建并发布任意多个临时网站。你创建的每个临时网站都有效期为 30 天。这给了你充足的时间上传你的网站、测试它们，并在最终发布前与客户分享。如果愿意，你可以发布网站的原始版本，将第二个版本作为临时网站发布，并对其进行更改。这允许你和你的客户比较同一网站的修改前后的迭代。\n\
  \n如果一个临时网站活跃超过 30 天，你只需从你的 .muse 文件再次发布该网站即可延长其使用寿命。\n\n## 再提醒一下 .muse 文件是什么\n\n\
  当你在 Muse 中设计、构建并保存你的网站时，会创建一个扩展名为 .muse 的单个文件。这与你可能手工编码或使用 Dreamweaver 等程序创建网站的情况非常不同。在那种情况下，你将有一个文件夹，其中包含以下文件：\n\
  \n- 每个页面的 HTML 文件\n- 至少一个用于设置页面样式的 CSS 文件\n- 所有图像文件\n- 你可能在网站上使用的任何其他文件，例如 Flash\
  \ 电影。\n\n单个 .muse 文件的优点是你的所有链接、页面、样式和图像都包含在此文件中。如果你进行协作工作，你可以向工作伙伴发送 .muse 文件以及放置的图像，他们可以安全地打开它，并确信所需的一切都在这个文件中。\n\
  \n当你发布到临时网站时，你上传的就是这个单个 .muse 文件。\n\n让我们现在看看如何发布临时网站；稍后我们将学习如何将你的网站永久发布到网络上的最终位置。\n\
  \n\n\n\n\n当你发布一个站点时，它会自动采用项目开始时使用的站点名称，并加上 Business Catalyst 域名。例如，我们的冲浪站点临时站点的\
  \ URL 将如下所示：\n\n```\nhttp://windsurfing.businesscatalyst.com\n```\n\n请记住，这只是临时的，因此当你准备进行最终站点发布时，你可以为其分配你选择的域名。以下步骤需要在\
  \ Muse 中发布临时站点时执行：\n\n- 1. 点击 Muse 工作区顶部 **Publish** 链接。\n- 2. **Publish** 对话框出现。在\
  \ **Site Name** 字段中输入临时站点的名称。这应该是一个描述性的名称，有助于你识别站点。例如，你可以输入 My windsurfing site。\n\
  \n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_246_0.png)\n\n- 3. 如果尚未显示，点击 **Options**\
  \ 链接以查看临时站点的更多选项。\n- 4. 将 **Publish to** 保留为 **New site**....\n- 5. **Options**\
  \ 部分中的站点 **URL** 字段将自动删除在 **Site Name** 字段中输入的空格和特殊字符，并为你的实时临时站点创建一个建议的 URL。如果你愿意，可以编辑\
  \ **URL** 字段的内容来更改自动生成的 URL。\n- 6. **Data Centre** 字段选择站点文件将被托管的数据中心。Muse 会自动检测此项，但如果你想指定，可以从美国、欧盟或澳大利亚中选择。\n\
  \n7. 如果你不住在这三个选项中的任何一个，你可以选择离你客户位置最近的数据中心。\n\n8. 完成后，对话框应如下所示的屏幕截图：\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_247_0.png)\n\
  \n9. 点击 OK 发布你的新临时站点。\n\n10. Muse 将上传你的所有页面和资源，上传完成后，你会收到一条确认消息，告知你的临时站点现已托管。点击\
  \ OK。\n\n11. 你的 Web 浏览器将自动在临时站点地址打开。你同时也会收到一封发送到你的 Adobe ID 地址的电子邮件，祝贺你发布了临时站点，并附带临时\
  \ URL 的链接。\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_247_1.png)\n\n如果你想对 Muse\
  \ 站点进行更多更改并上传到同一位置，再次点击 Muse 中的 Publish 链接。你会看到临时站点的链接会自动显示在 Site Name 字段下方。点击该链接在新的浏览器窗口中启动你的临时站点并测试它。\n\
  \n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_248_0.png)\n\n临时站点的 URL 可以复制并发送给你的客户以供审阅。你现在有了一个绝佳的机会，可以通过我们之前章节讨论的所有测试进行检查。而且，你将测试一个正在运行的在线网站，但无需担心公众会误入该站点。\n\
  \n一旦你发布了临时站点，Manage 链接现在将可用并处于活动状态。我们稍后将使用它来发布最终站点。\n\n## 编辑和更新站点\n\n你现在已经发布了站点并与客户进行了沟通，但你可能会发现需要进行一些更改。为了编辑和更新你的站点，请应用以下步骤：\n\
  \n- 1. 在 Muse 中打开同一个 .muse 文件。\n- 2. 你现在有两个选项：\n  - 在现有的 .muse 文件中进行更改，然后选择 File\
  \ | Save 并再次点击 Publish 链接。\n  - 选择 File | Save As 创建站点的副本。在 Muse 工作区中进行所需的更改，然后再次点击\
  \ Publish 链接。\n\n3. 你现在可以通过在 Publish 对话框中保持选项不变来覆盖现有的临时站点，也可以创建一个新的临时站点。这使得你的客户可以轻松比较更改前后的情况。\n\
  \n- 通过选择 File | Save As，你可以确保原始站点安全。\n\n4. 当你发布临时站点时，它会在 Publish 对话框中的 Publish to\
  \ 菜单中列出。你可以从列表中选择现有站点，也可以选择创建新站点。\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_249_0.png)\n\
  \n5. 你可以上传所有文件，或仅上传已修改的文件。如果你的网站非常庞大，最好只上传修改过的文件。当 Muse 升级时，最好重新发布整个站点。\n\n6. 重复此过程，直到你和客户对站点满意为止。希望这不会花费太多迭代。\n\
  \n## 升级和发布\n\n最后的步骤涉及“升级”你的站点并发布它。当你到达此阶段时，你需要支付托管费用。你还需要为你的站点注册一个域名，这需要通过第三方完成。\n\
  \n## 注册域名\n\n你需要联系域名注册商以购买你想要用于网站的域名。网上有许多提供此服务的网站，你应该能够以不到 10 美元的价格在线购买 .com 域名。购买域名非常简单，通常会很快完成。我们将在完成更多步骤后返回域名注册商。\n\
  \n## 升级为已发布站点\n\n以下步骤将告诉你如何升级站点并发布它：\n\n- 1. 在 Muse 中，使用你之前发布的临时站点打开，点击 Manage 链接。Manage\
  \ 链接只有在你发布临时站点后才可用。\n\n- 2. 点击 Manage 链接后，Business Catalyst 管理控制台将在你的 Web 浏览器窗口中打开。你将看到\
  \ Dashboard，在这里你可以管理由 Business Catalyst 托管的 Muse 站点。你还将能够查看站点的统计信息。\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_250_0.png)\n\
  \n- 3. 点击 **Dashboard** 上的 **Push Site Live** 按钮。\n- 4. **Site Upgrade** 窗口出现。点击\
  \ **Proceed to checkout**。你需要输入信用卡信息以完成升级。\n- 5. 保留前两个选项的默认设置：\n  - Site hosting\
  \ plan: **webBasics**\n  - Billing option: **Invoice Me Directly**\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_251_0.png)\n\
  \n- 6. 选择你希望计费的频率，填写你的信用卡详细信息并点击 **Make Payment**。\n- 7. 你的信用卡付款将根据你的选择立即处理。\n\n\
  8. 你将被返回到 Dashboard，站点状态现在为 Live。\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_252_0.png)\n\
  \n## 将域名与你的 Muse 站点关联\n\n我们的临时站点现在已升级并由 Business Catalyst 商业托管。此次升级意味着我们可以将从域名注册商购买的域名与站点名称关联。\n\
  \n在从临时站点升级之前，站点地址看起来像这样：\n\n```\nhttp://my_site.businesscatalyst.com\n```\n\n例如，http://mywindsurfingsite.businesscatalyst.com\n\
  \n在站点升级和发布后，我们可以添加我们的域名，使其看起来更像这样：\n\n```\nhttp://my_domain_name.com\n```\n\n例如，mywindsurfingsite.com\n\
  \n在本节中，你将使用管理控制台 Dashboard 中的界面。\n\n- 1. 点击 Dashboard 中的选项，然后点击 Add a domain。\n\n\
  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_252_1.png)\n\n- 2. 当 **Site Domains** 对话框出现时，点击\
  \ **New Domain** 选项。\n- 3. 在 **Domain** 字段中输入你注册的域名。不要在域名前包含 www. 前缀，但要包含域名的扩展名（如\
  \ .com、.org 或其他）；例如：`my_domain_name.com`。\n- 4. 在 **Start Page** 菜单上选择 **Home Page**。为站点设置\
  \ **Country** 和 **Culture**。保留所有其他默认设置并点击 **Save**。\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_253_0.png)\n\
  \n- 5. 你会看到一条确认消息。点击 **Close** 关闭 **Add a New Domain** 对话框并返回管理控制台。你添加到站点的域名现在已列出。\n\
  - 6. 点击左侧边栏中的 **Dashboard** 链接返回到 **Dashboard**。\n- 7. 在 **Domains** 部分，你输入的域名现在已列出。\n\
  \n## 重新委派你的域名\n\n你几乎完成了。只剩下最后一件事，那就是重新委派你的域名。这只是意味着确保当你在浏览器中输入你的域名时，它会转到正确的位置。\n\
  \n不幸的是，这不是你可以通过 Muse 或通过 **Business Catalyst** 仪表板完成的事情。操作方法如下：\n\n- 1. 前往你购买域名的注册商的网站。\n\
  - 2. 大多数注册商都有一个控制面板，你可以使用它来重新委派你的域名。你需要注册商提供的用户名和密码。\n\n\n\n\n\n3. 使用您的账户信息登录注册商的网站。您需要找到更新域名系统(DNS)设置的选项。您需要将注册商上的名称服务器更新为以下内容：\n\
  - ns1.worldsecuresystems.com\n- ns2.worldsecuresystems.com\n- ns3.worldsecuresystems.com\n\
  \n4. 此过程因注册商而异。如果您在查找更改 DNS 设置的位置时遇到问题，请直接联系他们。\n\n5. 更改名称服务器后，您可能需要等待 24 小时才能使设置生效。生效后，您的域名将直接带您进入由\
  \ muse 创建的网站。恭喜！\n\n## 替代托管\n\n您并非必须使用 Adobe 的 Business Catalyst 托管服务。您可以使用您选择的任何托管服务。唯一的区别是，首先您需要将网站导出为\
  \ HTML，如第 11 章《预览和测试您的网站》中所述，然后使用 FTP 程序将文件夹和文件上传到您的主机。\n\n## 文件传输协议 (FTP)\n\n文件传输协议\
  \ (FTP) 是一种将文件上传到托管网站的方法。在将网站导出为 HTML 后，您可以使用 FTP 软件将文件传输到您的主机。\n\n您需要为托管和域名付费。市场上有很多托管和域名套餐的惊人优惠，因此在购买您看到的第一个托管套餐之前请先做一些调查。\n\
  \n当您为您的网站安排好主机后，您会收到一封包含 FTP 详细信息的电子邮件，或一个链接到他们网站上可找到 FTP 详细信息的页面。最低限度，您需要用户名、密码和\
  \ FTP 地址。您无法猜测这些；它们需要由托管公司提供。FTP 是一种验证您是否输入了正确的用户名和密码以连接到特定站点的验证方法。\n\n## FTP 客户端\n\
  \n网上有大量免费的 FTP 客户端（软件）可用，它们工作得非常完美。对于简单的上传或下载，您无需购买一个。以下是一些知名 FTP 客户端：\n- FileZilla\
  \ 用于 Linux、Mac OS X 和 Windows 操作系统\n- SmartFTP 仅用于 Windows 操作系统\n- SimpleFTP 仅用于\
  \ Mac OS X 操作系统\n- CuteFTP 用于 Mac OS X 和 Windows 操作系统\n\n使用 FTP 时，您可以从本地计算机上传文件到主机服务器，并从主机服务器下载文件到本地计算机。\n\
  \n将您的 FTP 详细信息输入客户端后，单击“连接”按钮。如果所有详细信息都正确，FTP 客户端将与主机计算机连接。FTP 客户端界面的其中一侧会显示您本地计算机上的文件；另一侧会显示您远程或主机计算机上的文件。\n\
  \n按照托管提供商的说明，您将能够将本地文件（您已导出为 HTML）上传到远程主机。上传与从 Business Catalyst 仪表板发布文件相同。\n\n\
  文件上传完成后，您的网站已在互联网上上线。如果您需要对网站进行更改，请在 Muse 中进行这些更改，然后再次导出文件。仅上传已更改的文件。上传完成后，单击“断开连接”。\n\
  \n## 摘要\n\n在本章中，我们讨论了如何发布和启动您的网站。您可以使用 Adobe 自己的 Business Catalyst 托管服务进行发布，也可将网站导出为\
  \ HTML，然后上传到您选择的托管服务。\n\n至此，我们一起完成了对 Adobe Muse 的探索之旅。我希望您喜欢学习该程序，并将继续制作出精美的网站。\n"
