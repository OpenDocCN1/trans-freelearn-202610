- pgno: 122
  md: '# # Introduction to temporal data


    In *Chapter 2*, we briefly introduced temporal data or data in the form of a time
    series or a group of time series. **Time series data** tracks important metrics
    in many different industries: daily store sales volumes, weekly software product
    marketing lead volumes, daily incidence of an emerging disease, yearly behavior
    rates (such as smoking or vegetable consumption) in a population, or hourly stock
    prices tracking market trends. Many related factors can influence trends over
    time, and some models consider these factors directly if they are known in advance.


    However, consider the case of sales trends for a new gem store in a city where
    gem stores are a new phenomenon, perhaps somewhere rural between Haifa and Tel
    Aviv (*Figure 6.1*). Thus, there is very little known about what might influence
    sales. Understanding what trends exist in the time series data is critical when
    mining for factors that might influence sales. However, time series datasets pose
    significant challenges to many supervised learning methods, such as **random forest
    models or linear regression**. At one point in time, sales are not independent;
    they rely on factors that influence sales in the previous days, limiting the use
    of supervised learning and many types of **unsupervised learning**. The lack of
    predictors also poses a challenge.


    ![](img/71ff737206f7d80bb625b3c9aca9dc7f_122_0.png)


    Figure 6.1 – An illustration of a gem store located partway between Tel Aviv and
    Haifa, Israel'
  merge: -1
  img_proc: true
- pgno: 123
  md: 'Fortunately, for our gem store, many algorithms are designed to handle time
    series data, such as **autoregressive integrated moving average models (ARIMA
    models)**, **singular spectrum analysis (SSA)**, and **Holt–Winters models**.
    However, changes in time series behavior (spikes, crashes, and changes in variance)
    pose a challenge to these models. Capturing and predicting these changes is critical
    if you want to create a predictive model or mine for factors influencing the time
    series values. In our gem store example, seasonality in tourism, conflicts in
    the region, and holiday travel promotions may influence traffic along the route
    in which our store is positioned.


    One industry with abundant and very complex time series data is finance. Many
    social and economic factors influence stock prices, and untangling the relationships
    and randomness in stock price fluctuations underlies much of the finance industry.
    Let’s have a look at the stock market pricing data and common tasks in analyzing
    stock market pricing data.


    # Stock market applications


    In recent years, the financial sector has shifted from an expert-driven model
    of stock market insight to a more machine learning-based approach. Machine learning
    models sift out emerging trends and catch subtle trends that may escape a human
    pouring over the data. This tactic also allows analysts to process a much larger
    data collection than a human could process, including many different sectors,
    international stock exchanges, and even individual frontier markets. By collecting
    more insight, it is possible for investors and investment management firms to
    invest in a wider variety of markets without as much expertise in those markets.


    Stock market analytics covers a vast field of applications. Investments can be
    made within certain market sectors (such as technology or agriculture) or across
    markets. They can focus on short-term gains (including those made in minutes or
    hours) and long-term gains (which may span decades). They can also focus on foreign
    markets, where stock prices may be influenced by factors very different from those
    influencing a local market’s prices. All these scenarios guide analytics efforts
    and the time scale of data collected for analysis.


    In general, analyzing stock market data involves assessing many types of trends
    over time. Stocks can have constant prices over time, experience gradual price
    growth and reduction, crash suddenly, or grow exponentially. Each of these suggests
    a different purchase/sale strategy for investors in the short term and the long
    term. Figure 6.2 shows a hypothetical stock that exhibits many of these patterns:'
  merge: -1
  img_proc: true
- pgno: 124
  md: '![](img/71ff737206f7d80bb625b3c9aca9dc7f_124_0.png)


    Figure 6.2 – An example of stock data trends, including stagnant periods, growth,
    shrinkage, and a crash


    We can see in Figure 6.2 that Stock A begins 2022 with a consistent price before
    entering a growth phase around July 2022. This growth phase lasts until early
    2023, at which point it enters a constant pricing phase again. As an event happens
    in March of 2024, the price of Stock A crashes and then enters a period of price
    decline until the end of our tracked time period.


    Often, these trends do not occur in isolation. The stocks of companies that share
    supply chains may exhibit similar trends. Stocks in the same industry may exhibit
    similar or opposite trends, depending on how companies relate to each other or
    news in the industry. Stocks in shared trade or defense regions may exhibit similar
    trends, as well, given the sociopolitical ties across countries and their markets
    (such as the COVID crash across most economies).


    **Tipping points,** where trends change dramatically, attract a lot of attention
    in financial analytics. These represent opportunities to invest before a period
    of accelerating growth or warnings to pull out of a market or particular investment
    before a crash. However, detecting these trends challenges many of the commonly
    used tools in market analytics.


    Thankfully, newer tools, including a few rooted in network science, identify tipping
    points more readily than traditional methods. Many tools hinge on large-scale
    coupling across markets, sectors, or stocks. As more and more stocks (or markets)
    exhibit similar behavior, the system becomes vulnerable to outside influences
    that can tip it into a crash (such as supply chain issues, new legislation, or
    a pandemic). Simply calculating the correlations among individual stocks or sectors
    of a market can provide some insight, but transforming correlations (within slices
    of time) to networks allows us to leverage many network science tools that dive
    deeper into the nature of their correlations and their changes over time. Specifically,
    centrality metrics allow us to quantify and classify relationships that exist
    within a network. Let’s explore a few of these centrality metrics.'
  merge: -1
  img_proc: true
- pgno: 125
  md: '# Introduction to centrality metrics


    We’ve encountered some centrality metrics in *Chapter 3*, where we learned about
    bridges and hubs. Many vertex-based centrality metrics calculate properties related
    to hubs—the connection of a vertex to its nearest neighbors and their nearest
    neighbors. Many edge-based centrality metrics calculate bridging properties, where
    the edges near a vertex act as connectors between different hubs.


    Degree is the simplest **vertex-based centrality metric**, which we encountered
    in *Chapter 5*. **Degree centrality** is simply the number of vertices directly
    connected to the vertex of interest. Many Laplacian-based metrics or algorithms
    depend on the degree matrix within algorithm calculations. On the surface, this
    metric seems to capture important hub properties; a vertex with a high degree
    centrality will carry a lot of influence within the network (and, thus, might
    make a good intervention target). It also scales well to very large networks.
    However, one limitation of degree centrality is its lack of awareness of a vertex’s
    position beyond any immediate connections to neighbors; a vertex with a low degree
    centrality may be connected to many vertices with a high degree centrality, giving
    it more influence over network behavior and structure than its degree centrality
    suggests.


    **Eigenvector centrality** and its variants (including **PageRank** and **Katz
    centrality**) incorporate awareness about connectivity beyond immediate neighbors
    to give a more comprehensive vertex-based centrality metric. Thus, **eigenvector
    centrality** would score our hypothetical low-degree centrality vertex connected
    to high-degree centrality vertices highly, as that vertex is near very connected
    vertices. Technically, to find the eigenvector centrality of each vertex in a
    network, we can perform an eigen decomposition on the adjacency matrix. Because
    the adjacency matrix does not include negative values, we can assume that the
    first eigenvalue is the largest, and its eigenvector yields the eigenvector centrality
    scores for our vertices.


    PageRank centrality extends eigenvector centrality and increases its flexibility
    by replacing the adjacency matrix with an adjusted adjacency matrix that is constructed
    by performing a random walk across vertices to determine the adjacency properties.
    In addition, random surfer properties, where a random walk can cross the unconnected
    areas of a graph with a low probability, create an adjusted adjacency matrix that
    is connected. This adjusted adjacency matrix is then scaled before performing
    the eigen decomposition on the adjusted adjacency matrix, which is carried out
    to compute eigenvector centrality scores. PageRank centrality scores, thus, provide
    flexibility. In addition, this computation is typically easier and faster with
    the adjusted adjacency matrix, allowing the algorithm to scale well to networks
    of even hundreds of millions of vertices.


    **Edge-based centrality measures** capture network infrastructure that is important
    for spreading processes and connectivity across different hubs. **Betweenness
    centrality** is one of the most common edge-based centrality metrics, capturing
    the relative number of shortest paths that include a given vertex among all shortest
    paths that exist in the network. Consider a network with 10 shortest paths, 8
    of which include a particular vertex. Without this vertex, many of the shortest
    paths would not exist, inconveniencing the network greatly in terms of spreading
    processes on a social network or route efficiency on a transportation network.
    However, betweenness centrality does not scale well, and it should not be used
    on large networks without some sort of parallelization of the operation.'
  merge: -1
  img_proc: true
- pgno: 126
  md: 'One recent edge-based centrality network has proven to be an efficient tool
    for finding stock market tipping points. **Forman–Ricci curvature** is a geometry-based
    tool that considers adjacent edges in relation to an edge of interest. On an unweighted
    network, Forman–Ricci curvature is calculated by subtracting the degree centrality
    of the two vertices attached to an edge of interest from 2. The constant, 2, represents
    the connection between the two vertices connected by the edge of interest. The
    degree centrality of both vertices connected by the edge counts the number of
    adjacent edges to our edge of interest (minus the vertices connected by that edge,
    whereby we obtain our constant of 2). In *Figures 6–3*, we see three vertices:
    two vertices with a single edge in relation to the middle vertex (both with a
    degree centrality of 1) and a middle vertex connecting to both of the outer vertices
    (with a degree centrality of 2). Both edges, thus, have a Forman–Ricci curvature
    of -1, as the sum of the vertex degree centralities for both is 3 (2 - 3 = -1).


    ![](img/71ff737206f7d80bb625b3c9aca9dc7f_126_0.png)


    Figure 6.3 – An example network demonstrating Forman–Ricci curvature, where the
    middle vertex is pulled from both the first and third outer vertices


    To obtain vertex centrality metrics from this edge metric, we can sum the edge
    metrics for each vertex to score the vertices. In our example in *Figure 6.3*,
    we have outer vertices with a Forman–Ricci vertex centrality of -1, as both only
    connect to a single edge. However, the middle vertex connects to two edges, with
    a Forman–Ricci curvature of -1, giving it a Forman–Ricci vertex centrality of
    -2. Because this centrality metric relies on low-cost computations, it scales
    well to large networks and can be used as an alternative edge-based centrality
    score when betweenness centrality is not feasible.


    Now, let''s explore some stock market data and see how network science can help
    us identify key trends over time.'
  merge: -1
  img_proc: true
- pgno: 127
  md: '# Application of centrality metrics across time slices


    The NASDAQ stock market is an American stock exchange in New York City that includes
    publicly traded companies such as Apple, Alphabet, Nvidia, and Microsoft. Kaggle
    provides a full history of NASDAQ stock prices under a public license (https://www.kaggle.com/datasets/jacksoncrow/stock-market-dataset?resource=download)
    that can give us stock data for these four tech companies during the period in
    which they were all publicly traded up to April 1, 2020. We’ve munged the data
    for you to include only these four stocks in the period from August 19, 2004,
    to April 1, 2020. Let’s take a peek at these data to see what trends might exist
    (Figure 6.4):


    ![](img/71ff737206f7d80bb625b3c9aca9dc7f_127_0.png)


    In Figure 6.4, we can see that Alphabet has a consistently higher price, but all
    stocks exhibit the typical trends of constant pricing, dips, spikes, and upward
    or downward trends over this long period of trading. Of note is the 2020 trend,
    where stocks experienced the COVID-19 crash. Periods of volatility include 2008–2009
    and 2016–2020.


    One of the important aspects of time series analysis is windowing the time series
    data into overlapping pieces. While windowing can be optimized by using a grid
    search, windowing tends to be more of an art than a science. Choosing a window
    impacts the length of time in which trends can be captured. In our stock market
    data, window length limits the period in which we can search for trends and, thus,
    limits the time period after the last window in which we can forecast market behavior.
    A window that is too large can miss important trends that impact short-term market
    behavior. A window that is too small can limit forecasting to the immediate future.'
  merge: -1
  img_proc: true
- pgno: 128
  md: 'We’ll choose a window of 5 trading days or roughly a week’s worth of stock
    data. This allows us to capture trends relevant to day trading, where stocks are
    traded frequently based on volatility. Our network metrics should work well for
    volatility-based trading for quick gains, as they capture increasing correlations
    across the two stocks.


    Another aspect that is important to windowing time series data is the choice of
    overlap. For our example, we’ll choose maximal overlap (4 days’ overlap) to maximize
    our sensitivity to day-to-day trends. In other applications, less overlap may
    be desirable to investigate longer time trends. Note that our example uses a path
    on one of our machines. Your file path will be different from ours.


    Let’s import our packages and load our data into Python with Script 6.1 to get
    started:


    ```

    #import packages

    import igraph as ig

    from igraph import Graph

    import numpy as np

    import pandas as pd

    import os

    import matplotlib as plt


    #import stock data

    File="C:/users/njfar/OneDrive/Desktop/AAPL_GOOGL_Stock_2004_2020.csv"

    pwd=os.getcwd()

    os.chdir(os.path.dirname(File))

    mydata=pd.read_csv(os.path.basename(File),encoding=''latin1'')

    ```


    Now that we have our data imported, we can add a loop that windows our time series
    to 5-day periods that overlap by 4 days across slices. This window strategy yields
    the best chance to find daily changes in trends. We’ll then create correlations
    among the four stocks within that time slice, threshold those correlations to
    limit our analysis to high correlations, create an unweighted network from those
    thresholds, and analyze Pagerank centrality, degree centrality, betweenness centrality,
    and Forman-Ricci curvature centrality across the time slices. We’ll also save
    each unweighted network for future retrieval, as well as the network metrics and
    their averages over each time slice. Let’s add these pieces to Script 6.1:


    ```

    #script to create time slices, derive networks,

    #and compute centrality metrics

    stock_networks=[]

    bet_t=[]

    deg_t=[]

    eig_t=[]

    vcurv_t=[]

    bet_ave=[]

    deg_ave=[]

    ```'
