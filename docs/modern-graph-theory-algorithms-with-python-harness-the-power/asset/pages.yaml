- pgno: 142
  md: '# An introduction to spatiotemporal data


    In Chapter 2, we discussed some aspects of spatial and temporal data that make
    such data difficult to wrangle, analyze, and scale with statistical and machine
    learning methods. Recall that both types of data are not independent, with dependencies
    crossing either space or time in the dataset. Alternative approaches to prediction
    are needed, and representations of spatial and temporal data as a network allow
    analysts to leverage the tools of network science to find change points, mine
    for patterns, and even predict future system behavior in the case of temporal
    data. In the previous chapters, we’ve learned how to analyze both spatial and
    temporal data with network science tools such as centrality to understand important
    trends.


    Many analytic tasks in the real world involve spatiotemporal data—including the
    analysis of world stock markets influenced by local policies, data mining of store
    data across locations for trends in customer behavior and revenue, discerning
    disease sources and population vulnerabilities during an epidemic, tracking human
    behavior (such as crime, eating habits, substance use, birth rates, or terrorism)
    across countries or regions of a specific country, and demonstrating the effects
    of climate change across vulnerable countries.


    Let’s get acquainted with our two datasets and problems relevant to many applications
    of spatiotemporal data.


    # The Burkina Faso market dataset


    In Chapter 2, we introduced the Burkina Faso market dataset, which recorded market
    millet prices across the country from Quarter 2 of 2015 to Quarter 2 of 2022.
    During this period, world grain prices fluctuated due to COVID-19 supply chain
    issues and the Ukraine conflict limiting food distribution and aid. Food security
    is a major issue in many regions of the world, and understanding what might cause
    prices to soar out of reach for the average person or family is critical in meeting
    the world’s food needs and avoiding famine.


    Some regions of a country may be more vulnerable to food shortages or soaring
    costs of goods than others, and the spatial features in our dataset capture these
    for the Burkina Faso markets. We’d imagine a rural market (such as the one shown
    in Figure 7.1) would face greater pricing and availability instability than a
    market in the heart of a city such as Ouagadougou. In addition, some events within
    a period may cause more pricing volatility than other events in that same period.
    Capturing the time series trends is also important to understand the causes and
    potential effects of events on grain prices in the region. Thus, capturing the
    data as spatiotemporal data allows us to analyze both trends across locations
    and across time.'
  merge: -1
  img_proc: true
