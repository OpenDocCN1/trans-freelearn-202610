    Now, let’s split our data into training and test sets (80% and 20% splits, respectively),
    create a k-nearest neighbors classifier (which classifies points according to
    the labels of their two nearest neighbors with k = 2), and measure the test set
    error by adding to Script 5.2:


    ```

    #create KNN classifier and test accuracy

    from sklearn.neighbors import KNeighborsClassifier

    from sklearn.model_selection import train_test_split


    #get predictors and outcome

    BERT_df1[''Type'']=mydata[''Type'']

    df_train, df_test = train_test_split(BERT_df1,test_size=0.2, random_state=0)

    X = df_train.iloc[:,0:767]

    y = df_train.iloc[:,768]

    X_test = df_test.iloc[:,0:767]

    y_test = df_test.iloc[:,768]


    #create KNN classifier and print accuracy

    eu=KNeighborsClassifier(n_neighbors=2,metric=''euclidean'')

    eu.fit(X,y)

    print(eu.score(X_test,y_test))

    ```


    Our split yields an accuracy of 100%, suggesting no misclassification of ecosystem
    types. Yours may vary given seeds and random number generators on your machine.
    However, this approach seems to work well for this dataset. Our pipeline of processing
    text data via embeddings, deriving a good start to label creation via spectral
    clustering, and then creating a classifier model yielded a high-accuracy classification
    system for our dataset.'
