    Now that we have embedded our data, we can create our nearest neighbors graph.
    Since we have such a small sample size, we’ll consider a point’s three nearest
    neighbors by adding to Script 5.2:


    ```

    #make nearest neighbors graph

    from sklearn.neighbors import kneighbors_graph

    n_adj = kneighbors_graph(encoded_text1, n_neighbors=3).toarray()

