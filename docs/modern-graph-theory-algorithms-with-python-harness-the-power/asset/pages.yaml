  md: 'of the training. Let’s consider a training process with four training epochs
    of a very small feedforward neural network with an input layer of two nodes, a
    hidden layer of three nodes, and an output layer of two nodes that originates
    as a fully-connected network, undergoes two epochs of pruning, and then adds back
    one of the pruned connections between the hidden and output layers, shown in Figure
    2.5:


    ![](img/71ff737206f7d80bb625b3c9aca9dc7f_49_0.png)


    Figure 2.5 – The evolution of a simple deep learning model across training epochs


    In *Figure 2.5*, we can see how each epoch has a different network structure across
    the deep learning model. Typically, we calculate fit statistics for each epoch,
    and perhaps we are interested in how properties of the deep learning network structure
    influence training accuracy on training and test sets across epochs. While this
    model is quite simple, deep learning models in practice may have several layers,
    directed edges between vertices (nodes in deep learning parlance), and many epochs
    of training. This creates a rich set of networks and network metrics across training
    to relate to model accuracy, which may be of use when tuning the model or changing
    initial parameters (perhaps adjusting pruning parameters when fine-tuning a pre-trained
    transformer model).


    Fine-tuning pre-trained models is a common approach in *computer vision* and *large
    language modeling*. New training data to cover domain-specific use cases may be
    added, and model parameters need adjusting to incorporate the new training data
    into the full model. For instance, a large language model housed on HuggingFace
    might work well for embedding most scientific papers for cluster analysis but
    require fine-tuning to work well when plasma physics papers are included in the
    sample of scientific'
