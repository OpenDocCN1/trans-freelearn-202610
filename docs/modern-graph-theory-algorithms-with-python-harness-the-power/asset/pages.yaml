- pgno: 157
  md: '# Dynamic Social Networks


    In previous chapters, we’ve considered networks that don’t change over time. Their
    geometry remains unchanged, and spreading processes and importance metrics calculated
    on them don’t vary, either. However, this is not the case for many real-world
    networks, where new connections are forged and old connections break.


    In this chapter, we’ll consider networks that change over time and how these changes
    impact network structure and spreading processes. For instance, within a social
    network, users can join or deactivate accounts. The strength of their ties can
    change as they interact with other users’ content. All these actions drive network
    changes over time, which impact how processes such as information exchange across
    a network function as hubs appear and disappear or bridges forge across different
    hubs. We’ll consider simulation data and trial data collected from wildlife observations
    and hypothetical epidemics spreading across populations of crocodiles and blue
    herons, respectively.


    By the end of this chapter, you’ll understand how networks change over time and
    what these impacts mean for spreading processes and network metrics. You’ll also
    know how to wrangle dynamic datasets into networks and analyze time slices. These
    methods scale to larger populations and longer time frames, so you’ll be equipped
    to work with population models at scale by the end of this chapter.


    In this chapter, we will cover the following topics:


    +   - Social networks that change over time

    +   - A deeper dive into spreading on networks

    +   - Example with evolving wildlife interaction datasets


    # Technical requirements


    In this chapter, we will be using a Jupyter notebook to run our dynamic network
    examples. You can also run this code on a cloud platform that supports Jupyter
    notebooks, such as Amazon Web Services (AWS) or Google Cloud Platform (GCP). We
    will be using a Jupyter notebook run on a laptop computer, and it is not necessary
    to have cloud access to process the examples in this chapter.'
  merge: -1
  img_proc: true
- pgno: 158
  md: '# Social networks that change over time


    Consider your group of closest friends. How has that group changed over the last
    year? The last 5 years? The last 10?


    Many social relationships and other types of data that can be represented using
    networks evolve over time. Friendships drift away and forge as people move, graduate
    from school, get married, change jobs, travel, or pass away. Animals migrate with
    changes in season, changes in climate, and human activity encroaching on grazing
    lands. Sales patterns across stores can be interrupted by new stores in the area,
    movements of population, and major world events such as COVID-19 or the Ukraine
    conflict.


    In the next sections, we’ll explore dynamic networks, whose structure changes
    over time. As network structure changes, so do many important properties related
    to information/disease flow and partitioning of the network.


    # Friendship networks


    Many social network platforms allow friendship groups to evolve and even encourage
    changes in structure. Consider sharing posts or tweets, tagging other people in
    your network post/tweet/picture who might have friends who have not met you yet,
    and adding searchable hashtags related to the content you are sharing. Each of
    these activities provides more visibility for you outside your initial social
    network, allowing friends of friends, acquaintances who haven’t connected with
    you on the social media platform, and individuals who share similar interests
    in your topic post to find you and connect.


    Let’s say someone posted a surreal dreamcatcher image on a social media platform
    (Figure 8.1):


    ![](img/71ff737206f7d80bb625b3c9aca9dc7f_158_0.png)


    Figure 8.1 – A dreamcatcher image created with artificial intelligence (AI) posted
    to a social media platform'
  merge: -1
  img_proc: true
- pgno: 159
  md: 'Perhaps the user added #AIArt and #Dreamcatcher and tagged a friend who posts
    similar content to Figure 8.1. Other platform users may search for others creating
    images with AI art platforms and want to follow the user or like/share the content.
    This provides more connections for the user and expands their network.


    The friend who is tagged may benefit from these new connections, as the new connections
    for this user visit the friend''s page. Additionally, friends of that friend who
    haven''t encountered the user may also connect with the user or like/share their
    content. This also expands the user''s network.


    Many social media platforms also connect users by creating interest pages or groups
    where users with similar interests can post content, connect, and discuss the
    topic. For instance, many social media platforms provide animal interest groups
    or pages with cute animal art or photographs, such as the animal art shown in
    Figure 8.2:


    ![](img/71ff737206f7d80bb625b3c9aca9dc7f_159_0.png)


    Figure 8.2 – An AI art image of a baby elephant in a teacup surrounded by roses


    These interest groups encourage connections between users and the sharing of searchable
    content to grow the group''s membership (sometimes encouraged by advertising optimization
    algorithms or other paid users, including groups themselves in some cases). Popular
    content tends to encourage group growth and interactions/connections between users
    in the group. Unpopular content tends to discourage growth.'
  merge: -1
  img_proc: true
- pgno: 160
  md: 'The darker side of algorithms that encourage connection generation between
    users with similar interests and optimize content spread is the potential for
    conspiracy theories and misinformation spread, as well as promoting connections
    between racist or discriminatory groups. During the 2016 and 2020 United States
    presidential elections (and during the COVID-19 pandemic), misinformation spread
    rapidly across social media platforms. During pandemics or national crises, misinformation
    can create public panic, increase strain on resources, or precipitate higher death
    rates. Within the political realm, misinformation can sway election results or
    accelerate divides between different political groups.


    Algorithms that encourage the evolution of a social network to increase the number
    of likes by connecting people who probabilistically will like other users’ content
    or views of related advertisements can inadvertently do the following:


    +   - Promote the spread of misinformation among users likely to like or comment
    on it

    +   - Encourage connections between users sharing misinformation or harmful content

    +   - Create a feedback loop that perpetuates this problem on the social network


    This can happen on social media platforms as well as community groups, internet
    chatrooms, and other forums. While promoting more cat memes may not be harmful
    (minus the potential for time wasted looking at cat memes), promoting racist ideologies
    or encouraging religious violence is quite harmful.


    # Triadic closure


    Most of the network evolution algorithm impacts result from a network property
    called **triadic closure**. Triadic closure on social networks roughly relies
    on the premise that friends of a user’s friends in a network might know the user
    in real life but not be connected yet. This is a direct connection-based instance
    of triadic closure in social networks. Another user who shares a friend group
    with many of our user’s friends likely knows that user (or would be a good connection
    for the user based on the shared social network). In addition, other users might
    share many interests with the user (the premise of many friend suggestion algorithms);
    this is a metadata-based instance of triadic closure, where connection formation
    hinges on similarity of user metadata rather than shared connections.


    Consider Pieter, Kwame, and Pablo. All three enjoy football, software engineering,
    and hiking. Pablo and Pieter know each other, as do Pieter and Kwame; however,
    we don’t know if Kwame and Pablo know each other (Figure 8.3):'
  merge: -1
  img_proc: true
- pgno: 161
  md: '![](img/71ff737206f7d80bb625b3c9aca9dc7f_161_0.png)


    ![](img/71ff737206f7d80bb625b3c9aca9dc7f_161_1.png)


    ![](img/71ff737206f7d80bb625b3c9aca9dc7f_161_2.png)


    Figure 8.3 – A diagram of the known relationships among our three football fans


    Given the two relationships that are known, along with the shared interest metadata,
    it is likely that Kwame and Pablo know each other, as well (or would get along
    if they connected). The percentage of open triads on a network measures the overall
    triadic openness of the network. Networks with a high percentage of open triads
    have a high potential for evolution over time as friends of friends or individuals
    with similar interests connect over shared content or group membership. Now that
    we know a bit more about relationships and how they can evolve over time, let’s
    dig deeper into spreading processes over evolving networks.


    # A deeper dive into spreading on networks


    Now that we understand a bit about how networks can change over time, let’s see
    how we can represent these networks in Python and compute spreading processes
    such as epidemic models over time on a dynamic network. Python provides several
    tools to help us both visualize and analyze dynamic networks as we have in prior
    chapters. Let’s get started.


    # Dynamic network introduction


    We can track changes over a network through time by keeping track of connections
    at different time points. Let’s consider a pride of lions in which individuals
    interact periodically over the course of the day. Figure 8.4 shows this example
    network with timestamps to track edges:'
