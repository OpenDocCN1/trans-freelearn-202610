  md: 'We can also create or update a record in the database using the MERGE statement
    with a CREATE and a MATCH statement to either create a new record or update an
    existing record (depending on what exists in the database). We’ll add Brad Pitt’s
    information back into the database using the code shown in Figure 12.14:


    ![](img/71ff737206f7d80bb625b3c9aca9dc7f_242_0.png)


