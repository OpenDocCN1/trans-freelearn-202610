    \ (assessed via Laplacian, which results in a different approach to the clustering\
    \ than would be run for a fully connected network). Neither of these warnings\
    \ will impact the result.\n\n```\n#import packages needed\nfrom sklearn.cluster\
    \ import SpectralClustering\nfrom sklearn import metrics\n\n#perform spectral\
    \ clustering and attach to dataset\nsc = SpectralClustering(3, affinity='precomputed',n_init=5)\n\
    sp_clust=sc.fit(cor)\nmydata['sp']=sp_clust.labels_\nsp_clust.labels_\n```\n\n\
    These results differ significantly compared to the k-means solutions we obtained\
    \ in the previous subsection. Given that both k-means models consider specific\
    \ activities and course schedules rather than just a correlation summary, this\
    \ difference makes sense. The spectral clustering solution focuses solely on network\
    \ connectivity rather than the factors included in the friendship dataset or a\
    \ combination of connectivity and factors. In this case, the k-means solutions\
    \ make more sense given our data—particularly the second k-means solution, which\
    \ includes network metrics and the original factors.\n\nThe selection of unsupervised\
    \ versus semi-supervised clustering algorithms is highly specific to the task\
    \ at hand. For very large networks, k-means algorithms have solutions that scale\
    \ well, and adding network connectivity metrics that scale well may improve k-means\
    \ solutions without sacrificing efficiency. For problems that involve a pure network\
    \ connectivity solution, spectral clustering may be preferable, particularly if\
    \ the factors used to construct the network were not collected or are unknown\
    \ for a third-party network. However, spectral clustering can also take partially\
    \ labeled data as input, allowing for SSL that can guide the learning process\
    \ given what is known already about the data.\n\nNow that we've seen how UL and\
    \ SSL algorithms can be used on network datasets, let's turn our attention to\
    \ SL algorithms, focusing on an exciting new type of deep learning (DL) algorithm\
    \ specifically designed to take network datasets as their input."
