  md: '![](img/71ff737206f7d80bb625b3c9aca9dc7f_185_0.png)


    Figure 9.1 – An illustration of a group of boys playing basketball before school


    Figure 9.1 shows three of the strong-social-tie boys playing basketball before
    school. We’d expect ideas, behaviors, and communicable diseases to spread quickly
    through this part of the network, as this group spends most of its time together.


    In contrast, weak social ties within the network consist of occasional interactions
    that might include core courses or one shared interest that brings individuals
    together for short periods of time, such that they recognize each other and might
    know something about fellow students but probably don’t know much about other
    students’ interests, home life, or aspirations:'
