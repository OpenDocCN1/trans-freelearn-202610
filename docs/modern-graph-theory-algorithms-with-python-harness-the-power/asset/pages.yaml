- pgno: 59
  md: "To turn this data into a social network with NetworkX, we’ll need to populate\
    \ our network with vertices and edges, which we can do through loops. We’ll first\
    \ add vertices that include metadata including students’ names and demographic\
    \ characteristics. Then, we’ll add edges that connect vertices based on the five\
    \ closest relationships a particular student endorsed in our survey by adding\
    \ to Script 2.2:\n\n```\n#initializing the social network\n aimsNetwork = nx.Graph()\n\
    \ #populating the network with nodes and edges\n for i in range(len(data[\"Name\"\
    ])) :\n     aimsNetwork.add_node(data[\"Name\"][i],\n         Age = data[\"Age\"\
    ][i], country=data[\"Country\"][i],\n         Field=data[\"Field\"][i],\n    \
    \     background=data[\"Background\"][i])\n     for j in range(len(data[\"Name\"\
    ])) :\n         aimsNetwork.add_edge(data[\"Name\"][j],data[\"Friend 1\"][j])\n\
    \         aimsNetwork.add_edge(data[\"Name\"][j],data[\"Friend 2\"][j])\n    \
    \     aimsNetwork.add_edge(data[\"Name\"][j],data[\"Friend 3\"][j])\n        \
    \ aimsNetwork.add_edge(data[\"Name\"][j],data[\"Friend 4\"][j])\n         aimsNetwork.add_edge(data[\"\
    Name\"][j],data[\"Friend 5\"][j])\n```\n\nThis gives us our initial network of\
    \ AIMS students and their closest friends within the program. Let’s plot this\
    \ data to visualize our AIMS student social network. Because we want to show the\
    \ names of students in our plot, we’ll first compute the degree of each vertex,\
    \ a centrality metric that we’ll revisit in later chapters. Here, it suffices\
    \ to show the importance of different students to the network and allow vertices\
    \ to be large enough to visualize the names of students. Let’s do this by adding\
    \ to Script 2.2:\n\n```\n#plot AIMS student social network\n Degree=aimsNetwork.degree()\n\
    \ var = [500*k[1] for k in list(Degree)]\n plt.figure(figsize=(20,20))\n nx.draw_spring(aimsNetwork,\
    \ font_size=10, node_size = var,\n     with_labels=True, node_color=\"red\")\n\
    \ plt.show()\n```"
