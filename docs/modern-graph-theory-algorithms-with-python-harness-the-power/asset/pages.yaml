  md: 'Figure 2.10 shows a much sparser network, where many markets are isolated.
    Some markets that were regionally connected still show connections among markets;
    however, many are not mutually connected anymore. Interestingly, our group of
    six regional markets is still connected with most connections intact after the
    thresholding. Indeed, only one market in that region shows a difference in connectivity
    relative to our non-thresholded version.


    While this example considers correlations across the entire time period, it is
    possible to slice spatiotemporal data into overlapping time slices, create time-aware
    metrics like the local Moran statistic (with or without thresholding), and visualize
    the metrics’ changes over time by plotting a series of networks created from these
    time slices and their network-defining metrics. We’ll explore this notion further
    in Chapter 7 when we break our Burkina Faso millet dataset into time slices to
    analyze changing graph metrics over time and space.


    Now that we know how to wrangle data into an igraph network, let’s see how this
    is done in NetworkX with another example.


    # Social network examples with NetworkX


    Here, we’ll consider a social network of African Institute of Mathematical Sciences
    (AIMS) students collected from a 2022 cohort in Cameroon. Students in this program
    live together in the same building, interact during class, eat meals together,
    and study together. However, students who share a country, come from the same
    undergraduate university, and speak the same language tend to interact more frequently
    than those who come from different backgrounds. Interactions such as those shown
    in Figure 2.11 thus happen either organically as a function of background or artificially
    through shared programs and living arrangements:


    ![](img/71ff737206f7d80bb625b3c9aca9dc7f_57_0.png)


    Figure 2.11 – An illustration of a classroom setting, where students share courses
    within a program'
