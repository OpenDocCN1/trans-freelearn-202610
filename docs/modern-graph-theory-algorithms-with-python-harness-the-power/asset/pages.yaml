- pgno: 256
  md: 'Those of you who are interested in the linear algebra formulation of generalized
    linear regression and GEEs can consult the references at the end of this chapter
    for detailed explanations of these models and the estimators used to find predictor
    effect sizes. The Nelder (1972) text overviews the theory of generalized linear
    models and their computation very nicely. The Hanley et al. (2003) text provides
    both a linear algebra overview of GEEs and a simple case study where estimates
    can be calculated easily by readers. It’s recommended that those of you who wish
    to understand the mathematics behind GEEs start with the mathematics and computational
    methodology of generalized linear models before tackling models derived from them,
    such as GEEs.


    For now, let’s turn back to the construction of our dataset.


    # Our problem and GEE formulation


    In our formulation of Ebola risk over time and geography in the Democratic Republic
    of Congo, we’ll look at the number of yearly Ebola cases in one of the following
    cities as our outcome:


    +   - Mandima

    +   - Mabalako

    +   - Kangulata

    +   - Katwa

    +   - Butembo

    +   - Bunia

    +   - Beni


    We’ll cluster these cities by province, including Mandima and Bunia in Ituri and
    Mandima, Mabalako, Kangulata, Katwa, Butembo, and Beni in North Kivu. Next, we’ll
    construct a network of transportation options between cities and obtain betweenness
    and degree of centrality for each city. This will provide us with an estimate
    of bridgeness and hubness within each year’s network.


    We’ll also include other statistics, including the number of violent incidents
    that year involving our cities and the number of natural disasters impacting our
    cities.


    For a number of Ebola cases, we’ll consolidate the ebola-epidemic-health-zone-figures.csv
    Humanitarian Data Exchange (HDX) dataset (https://data.humdata.org/dataset/ebola-cases-and-deaths-drc-north-kivu)
    to include the cities of interest for our analysis. To obtain the necessary transportation,
    we’ll search the web for feasible routes between cities (biking, public transportation,
    or driving). Given that this is current data, we will also search for changes
    within the period of 2017-2021, including COVID-19 restrictions. We’ll use ReliefWeb
    to find incidents mentioning natural disasters (https://reliefweb.int/disasters?list=Democratic%20of%20the%20Congo%20Disasters&advanced-search=%28C75%29).'
  merge: -1
  img_proc: true
- pgno: 257
  md: 'Consolidating another HDX dataset will yield information about violent incidents
    in each area (https://data.humdata.org/dataset/ucdp-data-for-democratic-republic-of-the-congo).
    While this may not include all information for a region in our time period, we
    should capture major conflicts or disasters.


    Now that we have our data sources, let''s explore the data and perform the needed
    transformations to coax the data into a format that will work as input to our
    GEE model.


    # Data transformation


    As we assembled our dataset, we noticed a few caveats in data quality worth mentioning.
    Very few natural disasters hit the area during our time period of interest, and
    these were spread across a wide geography. It''s unlikely that this factor will
    impact Ebola spread, but we will keep this variable in our dataset.


    The source for violent incidents appears to be missing information, as known attacks
    on aid workers and Ebola treatment sites in Katwa are not included in the data.
    This suggests an incomplete data source that may not capture violent incidents
    at the level needed for a real-world analysis of factors influencing Ebola spread.
    However, for purposes of demonstrating this method, it captures enough to be potentially
    interesting in the analysis. In projects such as this, data quality can be questionable,
    as good sources are hard to find in much of the developing world.


    The search for transportation routes was also questionable, yielding some insight
    into direct routes but not in as much detail as would be ideal. We considered
    any route between city pairs to be viable if travel would take less than 10 hours
    by car, bus, or foot travel. Most cities yielded useable data; however, some cities
    did not show viable routes, yielding isolated vertices in our travel network.
    No major differences in routing existed across the years (no projects listed to
    create new roads or bus routes), so our network properties will not change over
    the years.


    The Ebola case source data likely showed some errors, as cumulative cases were
    sometimes lower over time for certain locations. We erred on the side of retaining
    positive or zero case totals per year, given that we hope to model our outcome
    as count data. Cases can be difficult to determine in such outbreaks, as lab confirmation
    is difficult and often time-consuming when sent to another city for analysis.


    Thus, our data collection for this project highlights some of the real-world challenges
    of building datasets from scratch, particularly in areas where data collection
    may be incomplete or nonexistent with respect to open source sites. It is often
    advantageous to examine many potential sources and either merge insights or choose
    the best source. In our case, we chose the most complete sources to obtain our
    dataset.'
  merge: -1
  img_proc: true
- pgno: 258
  md: "# Python wrangling\n\nFrom our sources, we’ve assembled a .csv file containing\
    \ year, city, region, conflict, disaster, and Ebola case data. However, we’ll\
    \ need to compute **betweenness centrality** and **degree centrality** from our\
    \ transportation network and add that to our dataset to capture transportation\
    \ network properties for each city.\n\nLet’s get started by computing the centrality\
    \ metrics for each city in our transportation dataset so that we can append these\
    \ values to our .csv file. We’ll compute the metrics using Script 13.1:\n\n```\n\
    #install igraph and pycairo\n!pip install igraph\n!pip install pycairo\n\n#import\
    \ igraph, pandas, and numpy\nimport igraph as ig\nfrom igraph import Graph\nimport\
    \ numpy as np\nimport pandas as pd\nimport os\n\n#import adjacency matrix\nFile\
    \ =\"C:/users/njfar/OneDrive/Desktop/DRC_Transport.csv\"\npwd = os.getcwd()\n\
    os.chdir(os.path.dirname(File))\nmydata =\n    pd.read_csv(os.path.basename(File),encoding='latin1',header=None)\n\
    \n#create and plot graph\ng_transport=Graph.Adjacency(mydata)\nig.plot(\n    g_transport,bbox=(200,200),\n\
    \    vertex_label = [\"Beni\",\"Bunia\",\"Butembo\",\"Kalunguta\",\"Katwa\",\n\
    \    \"Mabalako\",\"Mandima\"]\n)\n\n#calculate betweenness and degree centrality\n\
    bet=Graph.betweenness(g_transport)\ndeg=Graph.degree(g_transport)\n\n#create vector\
    \ to add to dataset\ndegree=deg+deg+deg+deg+deg\nbetweenness=bet+bet+bet+bet+bet\n\
    ```"
