- pgno: 23
  md: '# 1


    # What is a Network?


    This chapter introduces the basics of graph theory and its applications in network
    science. Network science is not a commonly taught area of data science, but many
    problems can be framed through a network science perspective. Network-based algorithms
    often scale better than other machine learning algorithms, making them ideal for
    analyzing datasets with many variables, exploring spatial datasets with many locations
    represented, or spotting trends in high-dimensional time series data. Later chapters
    will delve more deeply into the topics with hands-on examples.


    In this chapter, we will define terms that will be used throughout the book, explore
    some common uses of network science in analyzing social relationship data, and
    introduce two Python packages that will be used in subsequent chapters. After
    finishing this chapter, you''ll start to recognize data science problems that
    can be formulated as network science problems and how to represent them visually
    in Python.


    Formally, we will cover the following topics:


    +   - Introduction to graph theory and networks

    +   - Examples of real-world social networks

    +   - Other type of networks


    # Technical requirements


    We have very few technical requirements or assumptions for this chapter. If you
    have not installed Python, you are encouraged to do so, as we will be using Python
    regularly—specifically, the Jupyter Notebooks that are installed with the Anaconda
    version of Python installation. If you have difficulty with installation, support
    can be found on Stack Overflow. The code for each chapter can be found under this
    GitHub link: https://github.com/PacktPublishing/Modern-Graph-Theory-Algorithms-with-Python.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# Introduction to graph theory and networks


    Social connections are fundamental to society, including family ties, shared roles
    in communities, trading relationships, and many more. Social networks—from MySpace
    to Twitter to TikTok—have played a larger and larger role in marketing, job-hunting,
    and information sharing in the last decades. Software systems might even be built
    between engineers scattered across the globe collaborating on platforms such as
    GitHub or Slack to coordinate efforts from teams in Kenya, India, and Australia
    who have never met.


    A branch of data science called **network science** studies these relationships
    between individuals, groups, and even societies within social networks using algorithms
    and statistical methods originating in a field of math called **graph theory**.
    Graph theory studies pairwise relationships between objects. Graph objects (including
    people, towns, ideas, points in time, and many more types of objects to study)
    are represented in network science as vertices, or points, within the network;
    note that some disciplines may use the term “node” instead of “vertex.” Relationships
    between objects (such as mutual collaborations between people or bridges connecting
    different islands or statistical connections between time points) are represented
    as edges within the network and connect pairs of vertices that share a relationship.


    To make this a little more concrete, let’s consider three young women: Ayanda
    in South Africa, Machiko in Japan, and Greta in Belgium:


    ![](img/71ff737206f7d80bb625b3c9aca9dc7f_24_0.png)


    ![](img/71ff737206f7d80bb625b3c9aca9dc7f_24_1.png)


