- pgno: 228
  md: 'We obtain average betweenness centralities of 0.131 (Greenberg’s) and 0.127
    (Dimmendaal’s), suggesting that bridging properties are similar across these subfamily
    trees. Let’s assess hubness properties by calculating the average degree centrality
    by adding to Script 11.2:


    ```

    #compare degree centrality of language families

    gd=nx.degree_centrality(G)

    print(np.mean(np.array(list(gd.values()))))

    gd2=nx.degree_centrality(G2)

    print(np.mean(np.array(list(gd2.values()))))

    ```


    We obtain average degree centralities of 0.182 (Greenberg’s) and 0.278 (Dimmendaal’s),
    suggesting that hubness properties vary somewhat across these subfamily trees.
    Given the added layer of depth connecting other layers of the tree in Dimmendaal’s
    subfamily tree structure, we’d expect to see this difference.


    Let’s turn our attention to a centrality metric especially suited for real-world
    linguistic data (and other ontology or phylogeny network datasets).


    **Subgraph centrality** measures how each vertex participates within subgraphs
    on the network by weighting small subnetworks heavily and larger subnetworks less,
    using the spectra of the network’s adjacency matrix, and estimating subnetworks
    through random walks on the network. This blends the properties of **spectral
    clustering** (seen in *Chapter 5*) and degree centrality to create a hybrid centrality
    measurement.


    We can see this in action on our two subfamily trees by adding to Script 11.2:


    ```

    #compare subgraph centrality of language families

    gs=nx.subgraph_centrality(G)

    print(np.mean(np.array(list(gs.values()))))

    gs2=nx.subgraph_centrality(G2)

    print(np.mean(np.array(list(gs2.values()))))

    ```


    This script shows that average subgraph centrality varies between the two subfamily
    trees, with Greenberg’s average subgraph centrality of 2.478 and Dimmendaal’s
    average subgraph centrality of 3.276. This suggests that the spectra and degree
    distributions are different across these hypothesized subfamily trees.


    While this example only involves two small ontology structures, these types of
    analyses can be helpful when working with many ontologies or comparing very large
    ontologies where visualization is not recommended. For example, we may wish to
    compare the full Nilo-Saharan language trees hypothesized across many different
    papers. These trees would include hundreds of vertices and possibly dozens of
    trees. Tracking the differences visually would be quite a challenge!'
  merge: -1
  img_proc: true
- pgno: 229
  md: 'When we consider linguistic OWL databases, the scale of our analysis grows
    even further to hundreds of thousands of vertices to compare across OWL databases.
    At this scale, it is not possible to visually mine the data in a comparison. Network
    science provides a way to compare the proposed OWL database structures and zero
    in on differences that exist between those databases to find key differences between
    the proposed structures. In addition, many of the tools we’ve overviewed scale
    well to this size of data analysis, providing an efficient way to find these key
    differences. However, understanding the differences that exist in etymology theory
    is beyond the scope of this book, and many OWL databases include storage in proprietary
    systems or are proprietary themselves.


    This chapter has focused on the field of linguistics. However, many types of ontologies
    and phylogenies exist in other disciplines. Zoology and human genomics often use
    ontologies to study relationships between genes, environments, and gene expression.
    These ontologies tend to be large, and the curation of knowledge to create these
    ontologies can result in significant differences or knowledge gaps between different
    ontologies attempting to capture the same knowledge. Scalable centrality metrics,
    such as those we overviewed in a simple-to-visualize example, can pinpoint overall
    and individual branch differences across these complicated ontologies to pinpoint
    areas of interest and potential caveats of using one open source ontology versus
    another.


    As knowledge in different fields grows, the methodology to compare ontologies
    will develop further, and network science will play a significant role in the
    management, understanding, and usage of ontologies within different disciplines.


    # Summary


    In this chapter, we learned how to represent linguistic data in databases and
    networks. We compared two Nilo-Saharan language subfamily networks using centrality
    metrics and introduced subgraph centrality as a centrality metric particularly
    suited to analyzing ontologies and phylogenies. Finally, we expanded our treatment
    of ontologies to those outside the field of linguistics and discussed how the
    tools in this chapter can be used to scale these analyses to very large groups
    of very large ontologies to compare suitability for use in real-world applications.


    In the next chapter, we will learn about graph databases, which can be used to
    store ontology data such as the data discussed in this chapter.


