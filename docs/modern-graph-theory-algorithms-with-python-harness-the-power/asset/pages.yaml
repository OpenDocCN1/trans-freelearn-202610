- pgno: 54
  md: "Now that we have our data imported, we can construct our local Moran statistic\
    \ by computing the correlation coefficient across markets (ignoring the time indicator\
    \ column) and multiplying the result by the weight matrix:\n\n```\n#define the\
    \ metric between markets and construct the local Moran\n#statistic\n#here, correlation\
    \ coefficient\ndata=mydata.iloc[:,1:46]\nweights_total=weights.iloc[:,1:46]\n\
    cor=np.corrcoef(data.transpose())\ncor[cor>0]=1\ncor_weighted=np.multiply(cor,weights_total)\n\
    ```\n\nNow that we have our local Moran statistic constructed as cor_weighted,\
    \ we can turn our data into a network with igraph. Our graph does not have any\
    \ directionality of relationship, so we can set the mode to undirected. However,\
    \ because our correlations include autocorrelations within individual markets,\
    \ we need to remove loops from our network. We'll do this by defining possible\
    \ self-loops and removing them from our edge list:\n\n```\n# create market graph\
    \ and get rid of loops created from the correlation\nbf_market_w=Graph.Adjacency(cor_weighted,mode=\"\
    undirected\")\nedge_list=bf_market_w.get_edgelist()\nself_loop=[]\nfor i in range(0,46):\n\
    \    self=(i,i)\n    self_loop.append(self)\nto_remove=[]\nfor i in edge_list:\n\
    \    for j in self_loop:\n        if i==j:\n            to_remove.append(i)\n\
    bf_market_w.delete_edges(to_remove)\n```\n\nNow, we can visualize our network\
    \ to see which markets are isolated by plotting our results:\n\n```\n#create plot\n\
    ig.plot(bf_market_w)\n```"
  merge: -1
  img_proc: true
