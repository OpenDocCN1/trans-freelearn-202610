- pgno: 58
  md: 'To understand these interactions within our cohort of students, we administered
    a questionnaire about interactions with other students in various settings. The
    data was collected between November and December of 2022. The following are some
    example questions:


    +   - Whom do you like to sit with during lunch or dinner?

    +   - Who do you like to ask questions when you are having difficulty with a subject
    or course?


    From these questions, students’ perceptions of their networks could be examined
    to see the degree to which they agree. Upon looking at the data, we realized most
    interactions were reciprocated. If Student A endorsed survey items of closeness
    to Student B, Student B was likely to endorse those items, as well. Thus, the
    data form an undirected network of mutual interactions.


    The dataset we’ll use includes several fields. In the first column, we have the
    name of the surveyed student. In the next four fields, we have demographic factors
    (to which we’ll return in later chapters), including country of origin, age, field
    of study, and undergraduate background. In the remaining five columns, we have
    five friends that the student most strongly endorsed.


    Let’s start by importing the packages we’ll need to wrangle this dataset into
    a network with Script 2.2:


    ```

    #import needed packages

    import pandas as pd

    import networkx as nx

    import matplotlib.pyplot as plt

    import numpy as np

    import math

    ```


    Now, let’s import the dataset:


    ```

    #reading the dataset

    fichier = pd.read_csv("C:/users/njfar/OneDrive/Desktop/AIMS_data.csv")

    data = pd.DataFrame(fichier)

    ```'
