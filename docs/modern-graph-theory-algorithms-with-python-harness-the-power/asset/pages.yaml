  md: '# Introduction to Bayesian networks and causal pathways


    Many outcomes of interest across industries involve a sequence of events or choices
    to reach the outcome of interest. The arrival of packages depends on the safe
    arrival of packages at each relay point between shipping and arrival. Machinery
    failure can involve single points of failure (SPOFs) or cascades of failure, in
    which multiple parts of the machine fail before the machinery itself fails.


    Consider the pathway to drug addiction. First, a person must be in a situation
    where drug use occurs—through friends, through family, or through a new social
    group. Then, a person must try an addictive substance. Then, they must like the
    substance enough to continue using the substance frequently enough to reach a
    point of physical or psychological dependence on the drug. Figure 10.1 shows this
    sequence of steps in a diagram format:


    ![](img/71ff737206f7d80bb625b3c9aca9dc7f_202_0.png)


    Figure 10.1 – A sequential progression of events leading to drug addiction


    Figure 10.1 looks a lot like a directed network, where each situation is a vertex
    and each step in the pathway is a directed edge. Each edge representing a progression
    step might be weighted by a probability of progression from one vertex to the
    next. Let’s consider a population of adolescents at high risk of trying a new
    type of drug and some cross-sectional data on populations at each stage of use
    that a researcher has collected on the population to determine risks at each step.
    Let’s say that all adolescents have been in a situation where they could try the
    drug, but only 30% of those who could try it actually do try it. Of those who
    try the drug, only 20% like it enough to continue using the drug. However, of
    those who do continue using it, 40% will become dependent on the drug. Figure
    10.2 summarizes this information:


    ![](img/71ff737206f7d80bb625b3c9aca9dc7f_202_1.png)


    Figure 10.2 – A pathway to drug addiction with probability of transition at each
    step in the pathway'
