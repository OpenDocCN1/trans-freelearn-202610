  img_proc: true
- pgno: 197
  md: "This piece of the script should output embedding vectors for each vertex in\
    \ our network. Now that we have our vertices embedded, we can create our labels.\
    \ Given that we wish to demonstrate a semi-supervised approach, we’ll feed our\
    \ network information on six vertices (1, 3, 5, 12, 15, and 32). You can play\
    \ around with this part of the script to see how fewer or more vertices impact\
    \ the performance and stability of our chosen architecture. Let’s add the label\
    \ information by adding to `Script 9.2`:\n\n```\n```python\n#obtain labels and\
    \ denote available labels for GNN learning\n#(here: 1, 3, 5, 12, 15, 32)\nlabels\
    \ = g.ndata['label']\nlabeled_nodes = [1, 3, 5, 12, 15, 32]\n```\n```\n\nNext,\
    \ we’ll need to build our GNN architecture and define training parameters. Many\
    \ of the papers and tutorials on GNNs using this dataset employ a very shallow\
    \ network architecture and Adam optimizers. For the sake of comparison and demonstration\
    \ of other options for building GNNs, we’ll use two hidden layers instead of one\
    \ (including convolution layers coupled with ReLU functions), employ small layers\
    \ (eight and six nodes, respectively for hidden layers), an SGD fitting algorithm\
    \ (with a learning rate of `0.01` and a momentum driving the algorithm of `0.8`,\
    \ which is close to the default value), and 990 iterations. Many examples that\
    \ exist online use Adam optimizers and a single hidden layer with more nodes than\
    \ our architecture, allowing for fewer training iterations. However, for larger\
    \ network vertex-label prediction problems, a more complex architecture is likely\
    \ to perform better, so we will show a way to include more hidden layers and a\
    \ way to use a different fitting algorithm than Adam. Let’s define our architecture\
    \ and fit our weights by adding to `Script 9.2`:\n\n```\n```python\n#build a three-layer\
    \ GraphSAGE model\nclass GraphSAGE(nn.Module):\n    def __init__(self, in_feats,\
    \ h_feats1, h_feats2,\n                 num_classes):\n        super(GraphSAGE,\
    \ self).__init__()\n        self.conv1 = SAGEConv(in_feats, h_feats1, 'mean')\n\
    \        self.conv2 = SAGEConv(h_feats1, h_feats2, 'mean')\n        self.conv3\
    \ = SAGEConv(h_feats2, num_classes, 'mean')\n\n    def forward(self, g, in_feat):\n\
    \        h = self.conv1(g, in_feat)\n        h = F.relu(h)\n        h = self.conv2(g,\
    \ h)\n        h = F.relu(h)\n        h = self.conv3(g, h)\n        return h\n\n\
    #6 embedding dimensions as input,\n#a hidden layers of 8 and 6 nodes, and 2 classes\
    \ to output\nnet = GraphSAGE(6,8,6,2)\n```\n```"
