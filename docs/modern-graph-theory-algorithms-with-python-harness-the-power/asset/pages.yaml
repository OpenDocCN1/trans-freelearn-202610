    addition, early additions of interactions provide the opportunity for a disease
    to spread across the population, as crocodiles begin to interact with each other.


    Let’s consider an epidemic that starts with the infection of one crocodile with
    a high infection rate (`beta = 0.3`) relative to the recovery rate (`gamma = 0.05`).
    This corresponds to a moderately infectious disease passing through our crocodile
    population that results in a long infection period. Crocodile pox is one such
    disease that can cause mortality in juvenile crocodiles. Infected animals tend
    to be symptomatic for weeks or months. Infection of cells tends to happen rapidly
    with a low incubation period (minutes). While the exact parameters for infection
    rate and recovery rate are not known, these estimates are good proxies for the
    infection. Let’s add to `Script 8.2` to simulate crocodile pox spread in our population
    of crocodiles as they interact over 12 time periods:


    ```

    ```python

    #run epidemic model

    import ndlib.models.ModelConfig as mc

    %matplotlib inline

    from ndlib.viz.mpl.DiffusionTrend import DiffusionTrend

    import ndlib.models.dynamic as dm


    #model selection

    model = dm.DynSIRModel(crocodile)


    #model configuration

    config = mc.Configuration()

    config.add_model_parameter(''beta'', 0.3) # infection rate

    config.add_model_parameter(''gamma'', 0.05) # recovery rate

    config.add_model_parameter("percentage_infected", 0.25)

    model.set_initial_status(config)


    # simulate snapshot based execution

    iterations = model.execute_snapshots()


    #iterations = model.execute_iterations()

    trends = model.build_trends(iterations)


    #visualize trends

    viz = DiffusionTrend(model, trends)

    viz.plot()

    ```

