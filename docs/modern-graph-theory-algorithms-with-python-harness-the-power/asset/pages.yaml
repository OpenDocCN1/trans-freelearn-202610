    new universe that is much smaller (shown in Figure 10.4):


    ![](img/71ff737206f7d80bb625b3c9aca9dc7f_204_0.png)


    Figure 10.4 – A new universe of trying the drug within our initial universe of
    being exposed to drug use


    Figure 10.4 shows a new universe, where a subset of adolescents try the new drug.
    Of these adolescents, 20% will regularly use the drug. This creates a new universe,
    as shown in Figure 10.5:


