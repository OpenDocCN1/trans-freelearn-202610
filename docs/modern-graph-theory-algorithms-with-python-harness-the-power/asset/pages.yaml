- pgno: 183
  md: '# Machine Learning for Networks


    In this chapter, we’ll consider **machine learning** (ML) models typically used
    on relational data and their applications within network science. While many network-specific
    tools provide good insights into network structure and prediction of spread across
    a network, ML tools allow us to leverage additional information about individuals
    in the network to construct a more complete view of relationships, spreading processes,
    and key outcomes related to the network or its individuals. We’ll consider friendship
    networks and metadata associated with individuals and their connections to other
    individuals to explore ML on networks.


    We’ll first return to network construction based on shared activities and traits
    of individuals, move on to clustering based on both network and metadata features,
    and finally predict individual and friendship network outcomes based on networks
    and their metadata. You’ll learn how to combine network metrics with metadata
    and how to build several types of ML models using network data, upon which we
    will build in the remaining chapters of this book. Let’s dive into some friendship
    networks and their metadata.


    Specifically, we will cover the following topics in this chapter:


    +   - Introduction to friendship networks and friendship relational datasets

    +   - ML on networks

    +   - SDL on networks


    # Technical requirements


    The code for the practical examples presented in this chapter can be found here:
    https://github.com/PacktPublishing/Modern-Graph-Theory-Algorithms-with-Python'
  merge: -1
  img_proc: true
- pgno: 184
  md: '# Introduction to friendship networks and friendship relational datasets


    In this section, we’ll consider a friendship network based on student behavior
    factors to form a network. We’ll then apply **unsupervised learning (UL)** methods,
    namely clustering, to group individuals into friendship groups to compare performance
    before and after adding extra network structural information.


    # Friendship network introduction


    Let’s consider a group of classmates in a small school with enrollment based on
    age and geography, as is common in the United States. Classmates may participate
    in the same extracurricular activities, such as sports teams, the school paper,
    or a concert band. They may also study together, share meals, or get together
    to hang out on weekends. Some may form a core group of friends who take some of
    the same classes, participate in the same extracurriculars, study together, and
    hang out together outside of school-related activities. Strong social ties such
    as these often form an integral source of social support and lasting social relationships.
    These tend to be very important to individual life decisions and outcomes, particularly
    in adolescence and early adulthood, where peers play an important role in psychosocial
    development.


    Other groups of friends may only study together or play on the same team, with
    few other shared interests or interactions. Weak social ties such as these also
    play an important role in society, connecting individuals with a wide range of
    resources across a community and exposing young people to a wider variety of viewpoints
    and new ideas. Social change often comes from weak ties across diverse communities,
    such as playing on the same sports teams, sharing classes in school, and participating
    in religious activities. While weak social ties often don’t provide strong social
    support, they serve a bridging function within networks and can introduce individuals
    to others who will become strong social ties.


    In our first friendship network, we’ll consider both weak and strong social ties.
    Strong social ties mainly occur within a group of seven friends who mostly play
    on the same team, share some classes, study together, and play sports before school
    and at weekends:'
  merge: -1
  img_proc: true
