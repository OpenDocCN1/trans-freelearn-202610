  md: "# Note\n\nOur example is very limited in size such that it is easy to visualize\
    \ results and why our analyses may show differences. Working with full OWL databases\
    \ or full language hierarchies creates much more nuanced and large networks to\
    \ study. However, the tools for doing so are the same regardless of network size\
    \ or complexity. Thus, the analyses we’re about to begin can be applied to much\
    \ more complicated linguistic data structures where simply visualizing the differences\
    \ between OWL databases created by different research groups or different language\
    \ family hierarchies may not be feasible.\n\n# Mapping language families\n\nLet’s\
    \ return to our two examples of Nilo-Saharan language family trees. To examine\
    \ differences in structure, we’ll need to first create these in NetworkX. For\
    \ the Dimmendaal family tree, we’ll break with the tree structure slightly to\
    \ show the interrelationships that exist for some of the child subfamilies. Let’s\
    \ get started by creating and plotting the Greenberg tree with Script 11.1:\n\n\
    ```\n#load needed packages\nimport numpy as np\nimport networkx as nx\nimport\
    \ matplotlib.pyplot as plt\n\n#create the Greenberg Nilo-Saharan language family\
    \ network\nG = nx.Graph()\nG.add_nodes_from([1, 11])\nG.add_edges_from([(1,2),(1,3),(1,4),(1,5),(1,6),(1,7),(7,8),\n\
    \    (7,9),(7,10),(7,11)])\n\n#plot the Greenberg Nilo-Saharan language family\
    \ network\nimport matplotlib.pyplot as plt\nG.nodes[1]['subfamily'] = 'Nilo_Saharan'\n\
    G.nodes[2]['subfamily'] = 'Koman'\nG.nodes[3]['subfamily'] = 'Saharan'\nG.nodes[4]['subfamily']\
    \ = 'Songhay'\nG.nodes[5]['subfamily'] = 'Fur'\nG.nodes[6]['subfamily'] = 'Maban'\n\
    G.nodes[7]['subfamily'] = 'Chari_Nile'\nG.nodes[8]['subfamily'] = 'Central_Sudanic'\n\
    G.nodes[9]['subfamily'] = 'Kunama'\nG.nodes[10]['subfamily'] = 'Berta'\nG.nodes[11]['subfamily']\
    \ = 'Eastern_Sudanic'\nlabels = nx.get_node_attributes(G, 'subfamily')\nnx.draw(G,\
    \ labels=labels, font_weight='bold')\n```"
