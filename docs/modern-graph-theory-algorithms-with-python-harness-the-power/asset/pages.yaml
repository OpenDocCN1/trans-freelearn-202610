- pgno: 166
  md: 'For more technically minded readers, we can arrange these terms to define a
    system of differential equations governing spread and recovery within a population
    of susceptible individuals, as shown next:


    \(\frac{dS}{dt} = -\frac{\beta IS}{N}\)

    \(\frac{dI}{dt} = \frac{\beta IS}{N} - \gamma I\)

    \(\frac{dR}{dt} = \gamma I\)


    A high transmission rate coupled with a low recovery rate will yield a large population
    of infected individuals. A low transmission rate with a high recovery rate will
    result in a slow or fizzling-out epidemic in the population.


    However, interactions within a population are rarely random, as assumed by the
    SIR equations. Dynamic networks provide a way to capture interactions over time,
    leading to more accurate models of transmission within a population of interest
    or allowing for more accurate planning through simulated models of interaction
    levels within a population of interest. Let’s build on Chapter 3’s discussion
    of epidemics by introducing some new network metrics that influence epidemic spread.


    # Factors influencing spread


    In Chapter 3, we examined the importance of bridges and hubs to the spread of
    a music trend or epidemic across networks. Since then, we’ve considered many network
    centrality metrics that relate to the concepts of hubs and bridges. Let’s briefly
    review a few of these centrality metrics.


    Hubness can be assessed with several centrality metrics, including the following:


    +   - Degree centrality (defined in Chapter 6)

    +   - PageRank centrality (defined in Chapter 6)

    +   - Hubness centrality (defined in Chapter 6)


    Degree centrality is the simplest and most related to spreading processes on a
    network. The number of connections an infected vertex has to other vertices impacts
    the ability of an infected vertex to spread the disease to its immediate neighbors.
    The combination of degree centralities across the network impacts the overall
    ability of a disease to spread globally. Sparse networks with very low degree
    centralities don’t offer chances for the disease to infect many individuals at
    the same time, leading to a situation where public health workers can effectively
    implement strategies such as isolation and contact tracing without being overwhelmed
    by many infected patients at a given time point.'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'However, networks with very high degree centralities likely include many hubs
    or a single large hub. A large hub allows one infected individual to pass along
    the disease to many others, who also have many contacts who can become infected.
    This means that public health resources are easily overwhelmed at the start of
    an epidemic, and the chances of containing such an epidemic before many people
    are infected are quite low. We saw this in many global cities during COVID-19,
    and citywide shutdowns became necessary to avoid overwhelming healthcare systems;
    rural areas did not experience the same rapid spikes of infection rates that we
    saw in large cities.


    Bridges also play an important role in epidemic modeling on networks. If two large
    hubs are not connected, it''s easy to isolate one hub from the other to stop an
    epidemic from spreading from one hub to the other, as we simply ensure that no
    bridges are built between the two hubs until the epidemic has ended in the infected
    hub. Bridges connecting the two hubs provide an opportunity for the bridge vertex/vertices
    to become infected and pass the infection from one community to another. Thus,
    bridges provide an opportunity for infection to spread and become a regional or
    global problem rather than a local community problem.


    Recall that bridging properties can be measured through **betweenness centrality**
    (defined in *Chapter 6*), which measures the number of a network''s shortest paths
    that pass through a vertex. Essentially, this measures the importance of each
    vertex to spreading processes on the network. A vertex with a high betweenness
    centrality represents a high chance of passing a disease to other parts of a population
    should that vertex become infected. Isolating or vaccinating vertices with a high
    betweenness centrality can disrupt disease spread on a network, and these individuals
    represent a chance to make a big impact on overall epidemic severity with limited
    resources. Within the context of COVID-19, frequent international travelers served
    as bridges between countries. Halting international travel from infected areas
    to areas not yet impacted allowed small nations, such as those on Caribbean islands,
    to avoid epidemic spread to their populations.


    **Forman-Ricci curvature centrality** (defined in *Chapter 6*) accounts for both
    bridging properties and hub properties within a network by considering edges connected
    to other edges through a set of vertices. Recent studies suggest that Forman-Ricci
    curvature can find edges and vertices important to spreading processes and, thus,
    serves as an effective metric to use in epidemic simulations where vertices are
    isolated or otherwise taken out of a population (through vaccination, for instance).


    **Eccentricity**, the maximum distance from a vertex to another vertex in a graph,
    is another metric commonly used to measure the potential impact of an epidemic
    at a population level. The **radius** of a network is the smallest eccentricity
    value across network vertices, and the **diameter** of a network is the largest
    eccentricity value across network vertices. Dense networks have smaller diameters
    than sparse networks, as vertices tend to be more interconnected (allowing for
    greater spread potential in shorter periods of time).


    Both radius and diameter bound the behavior of differential equations, such as
    our SIR model, on a network. While the theoretical proofs are beyond the scope
    of this book, we''ll explore radius and diameter in practice with a real-world
    simulation of two wildlife epidemic datasets in the next section. Let''s get started
    by exploring our datasets.'
  merge: -1
  img_proc: true
- pgno: 168
  md: "# Example with evolving wildlife interaction datasets\n\nWe collected two datasets\
    \ on within-species wildlife interactions (interactions involving animals of the\
    \ same species) over short periods of time.\n\nThe first dataset includes the\
    \ observation of 4 crocodiles in a South Florida lagoon across 15-minute intervals\
    \ over 12 time periods after a cold front passed through the area, prompting more\
    \ crocodiles to seek out sunny shorelines. Social interactions between crocodiles\
    \ were defined as animals that interacted within a single 15-minute period. Connections\
    \ were noted for each 15 minutes, giving a dynamic network of crocodile social\
    \ interactions across 12 time periods.\n\nThe second dataset includes the observation\
    \ of 7 blue herons interacting at a bait ball of migrating fish in a South Florida\
    \ lagoon captured across 5-minute intervals over 10 time periods. Interaction\
    \ among blue herons was defined as herons occupying the same cubic meter of space\
    \ above the bait ball. Connections were noted for each 5 minutes, giving a dynamic\
    \ network of blue heron social interactions across 10 time periods. Populations\
