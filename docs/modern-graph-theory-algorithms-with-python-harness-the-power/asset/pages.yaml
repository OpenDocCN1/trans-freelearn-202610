  md: "Let’s create a function that defines the Vietoris–Rips simplicial complex for\
    \ two-way interactions (corresponding to a network) using Script 6.2:\n\n```\n\
    #define Vietoris-Rips complex\nfrom itertools import combinations\nfrom numpy\
    \ import linalg as LA\ndef graph_VR(points, eps):\n    points=[np.array(x) for\
    \ x in points]\n    vr=[(x,y) for (x,y) in combinations(points, 2)\n    if LA.norm(x\
    \ - y) <= 2*eps]\n    return np.array(vr)\n```\n\nNow, we can apply this to the\
    \ first slice of our stock market time series data. We’ll choose thresholds of\
    \ 1 and 10 as a starting point to understand which vertex pairs will be included\
    \ in our simplicial complex (here, only at the two-way interaction level). Let’s\
    \ add this to Script 6.2 to calculate the Vietoris–Rips simplicial complex for\
    \ the first slice of our stock market time series data:\n\n```\n#apply Vietoris-Rips\
    \ with multiple thresholds to a slice of our stock\n#dataset\ndata=mydata.iloc[0:5,1:5]\n\
    vr1=graph_VR(data.transpose(),1)\nvr2=graph_VR(data.transpose(),10)\n```\n\nWe\
    \ can examine the vertex pairs included in each filtration by adding the following\
    \ to Script 6.2:\n\n```\n#print the results\nprint(\"Vietoris-Rips Complex, Threshold=1:\"\
    )\nprint(vr1)\nprint(\"Vietoris-Rips Complex, Threshold=10:\")\nprint(vr2)\n```\n\
    \nThis gives us pairs of vertices for each filtration, which should show the following:\n\
    \n```\nVietoris-Rips Complex, Threshold=1:\n[[0 1]\n [0 2]\n [1 2]\n [1 3]\n [2\
    \ 3]\n [2 4]\n [3 4]]\nVietoris-Rips Complex, Threshold=10:\n[[0 1]\n [0 2]\n\
    \ [0 3]\n```"
