- pgno: 91
  md: 'Hazard-weighting of paths can be wise when working with optimal travel routes
    and determining which mode of transportation is most cost-effective and convenient.
    Most areas of the world contain open source hazard data and material to determine
    which hazards are present and how likely one is to encounter them. For instance,
    the World Bank provides the **Climate Change Knowledge Portal (CCKP)** with natural
    disaster risks during different periods, including downloadable data.


    Now that we know some routing considerations, let’s dive into a simple example,
    including five stores in a localized area of Miami needing produce delivered that
    are all accessible via truck and defined to exclude current construction zones
    in a time of year when the area does not experience flooding or hurricanes. First,
    we’ll need to understand how we can calculate the shortest paths between vertices
    in a network, which has deep roots in graph theory.


    # Shortest path applications


    The shortest paths between places and sets of places have a long history in graph
    theory. Originally, this problem arose from a question about traversing the seven
    bridges of Königsberg, Germany. In 1736, Leonhard Euler posited that a route that
    crossed each bridge to a region next to one side of a bridge exactly once did
    not exist. Indeed, this is the case. If there is one more region than the number
    of bridges for an odd number of bridges, a trip is possible without traversing
    bridges more than once. Note that the proof of this is beyond the scope of this
    book; if you are interested, you can find many proofs online if you search for
    proofs of the Königsberg bridge problem.


    However, problems such as this come up often in the transportation industry and
    **global positioning system (GPS)** routing solutions and algorithms that calculate
    shortest paths with or without specific constraints such as the Königsberg bridge
    problem are common in routing problems today. We often want to visit multiple
    locations while traversing the fewest roads, bridges, or obstacles possible, and
    we can formulate this problem much in the way Euler formulated his bridge problem.
    However, we typically have many different possible routes and locations, making
    proof much more difficult given alternative routes that exist.


    **Dijkstra’s algorithm** calculates the shortest path between vertices on a network.
    As we’ve seen before, networks can be unweighted (with 0 or 1 representing the
    existence of an edge between vertices in the adjacency matrix) or weighted (where
    edges that exist have numbers not limited to 1 designating their existence and
    some property between them). In the context of shortest path calculation in geographical
    data, these weights usually represent distances between locations.'
