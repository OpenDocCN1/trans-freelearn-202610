  img_proc: true
- pgno: 89
  md: 'Ground routes, particularly when coupled with electric delivery vehicles (shown
    in *Figure 4.4(a)*), can provide a good option for companies operating locally.
    However, many supply chains depend on parts or goods located overseas, and options
    such as shipping (shown in *Figure 4.4(b)*) or air travel are necessary:


    ![](img/71ff737206f7d80bb625b3c9aca9dc7f_89_0.png)


    Figure 4.4 – An illustration of: (a) A semi-truck used to haul goods domestically
    and (b) a shipping option to move goods overseas


    However, the cost of fuel is rarely the only consideration, as time is critical
    for any goods that might spoil and as safety concerns related to cargo losses
    often take precedence over fuel costs in real-world problems. Let’s consider some
    scenarios where TTD is an important consideration in the optimization algorithms
    used to schedule delivery times, routes, and best modes of transportation.


    # Time to deliver goods


    The first consideration for delivery time involves the urgency factor. Goods may
    spoil within a certain time frame (such as produce or vaccines), and this often
    outweighs the cost, as the goods will not be useable outside of the necessary
    time-to-use period. Sales windows also merit consideration, as Christmas or Ramadan
    items will not be in as great a demand after the holiday passes. This results
    in a loss of profits for the business.'
