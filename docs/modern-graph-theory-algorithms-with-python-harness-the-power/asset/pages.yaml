- pgno: 112
  md: 'There are multiple ways we can compute the Fielder vector to get our spectral
    clustering results. We’ll go through two ways to compute this with Python. You
    may need to replace nx.from_numpy_matrix with nx.from_numpy_array, depending on
    your version of NetworkX. Depending on the size of the problem, it may be easier
    to use a linear algebra solver similar to the one we added to Script 5.1:


    ```

    #define Fiedler vector and obtain clustering

    G = nx.from_numpy_matrix(adj_mat_w)

    ev = nx.linalg.algebraicconnectivity.fiedler_vector(G)

    labels = [0 if v < 0 else 1 for v in ev]

    labels


    nx.draw(G,with_labels=True, node_color=labels)

    ```


    This shows two distinct snake populations that converge to the sixth region of
    our Loango National Park sampling area (along with snakes staying in the exact
    same area, noted by loops), as shown in Figure 5.7:


    ![](img/71ff737206f7d80bb625b3c9aca9dc7f_112_0.png)


    Figure 5.7 – Spectral clustering of snake populations'
