- pgno: 53
  md: 'Let’s dive into our example dataset, derived from Humanitarian Data Exchange’s
    Burkina Faso – Food Prices dataset from the World Food Programme Price Database
    (https://data.humdata.org/dataset/wfp-food-prices-for-burkina-faso; accessed July
    15, 2022). In this dataset, we have pre-selected millet prices across 45 Burkina
    Faso province markets and aggregated data by quarter, starting in Quarter 2 of
    2015 and ending in Quarter 2 of 2022. This period covers the COVID-19 pandemic
    and the beginning of the Ukraine War, both of which influenced supply chains.
    Given that markets in neighboring provinces may be impacted by the same local
    factors and supply chains, we have created a spatial weight matrix of 1’s and
    0’s, representing adjacent provinces and non-adjacent provinces respectively.


    To run all of the code, it may be necessary to install other packages that are
    dependencies of igraph or NetworkX, such as pycairo for visualizations. Each machine
    may function differently or have other packages already installed if you are using
    a cloud platform; if you run into any difficulties, please consult the igraph
    or NetworkX help guides’ suggestions for running the packages on your operating
    system.


    Let’s first import the needed packages to construct our network in igraph with
    Script 2.1:


    ```

    ```python

    #import packages

    import igraph as ig

    from igraph import Graph

    import numpy as np

    import pandas as pd

    import os

    ```

    ```


    When importing data, you’ll need to specify your own file path after you download
    the dataset. We import both the pricing data and the weight matrix from a local
    machine by adding to Script 2.1:


    ```

    ```python

    #import Burkina Faso market millet prices from the csv file

    File="C:/users/njfar/OneDrive/Desktop/BF_Millet.csv"

    pwd=os.getcwd()

    os.chdir(os.path.dirname(File))

    mydata = pd.read_csv(os.path.basename(File),encoding=''latin1'')


    #import weight matrix of Burkina Faso markets

    File="C:/users/njfar/OneDrive/Desktop/weights_bk.csv"

    pwd=os.getcwd()

    os.chdir(os.path.dirname(File))

    weights = pd.read_csv(os.path.basename(File),encoding=''latin1'')

    ```

    ```'
