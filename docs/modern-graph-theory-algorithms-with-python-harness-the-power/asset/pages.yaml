- pgno: 41
  md: '# Wrangling Data into Networks with NetworkX and igraph


    In this chapter, we will introduce many types of data that are common in analytics
    projects, including **spatial data**, **temporal data**, and **spatiotemporal
    data**. Because these data structures do not exist as networks, they must be preprocessed
    into networks for further analytics. In future chapters, we will detail strategies
    for optimal preprocessing, but the goal of this chapter is to get familiar with
    the basics and how preprocessing works with the NetworkX and igraph packages.


    We’ll consider many real-world problems in this chapter and the remaining chapters
    to build intuition around data that can be reformatted and analyzed as a network
    science problem. Oftentimes, network-based algorithms have lower computational
    costs than algorithms designed for time series analytics or spatial data. By the
    end of this chapter, you’ll be able to recognize many types of problems that work
    well with network analytics, and you’ll walk away equipped to dive into the problems
    in later chapters.


    Specifically, we will cover the following topics in this chapter:


    +   - Introduction to different data sources

    +   - Wrangling data into networks with igraph

    +   - Social network examples with NetworkX


    # Technical requirements


    To run the practical examples in this chapter, you need to be familiar with Python
    programming and must install the igraph and NetworkX Python packages.


    The code for this chapter is available here: https://github.com/PacktPublishing/Modern-Graph-Theory-Algorithms-with-Python'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# Introduction to different data sources


    In practice, we’ll rarely create a network from scratch or come across a data
    source that naturally occurs as a network. We often must create a network from
    different data sources, including survey or sensor data, geographic data, time
    series data, demographic data, or even output data from machine learning models.
    In this section, we’ll overview some common data sources before diving into two
    practical examples of data wrangling with igraph and NetworkX. Let’s dive into
    our first data source, social interaction data.


    # Social interaction data


    Much of network science originated with social networks, which capture relationships
    or interactions between individuals. Marketing campaigns often recruit individuals
    with many connections to others within a demographic group of interest, as well
    as those whose connections also have many connections within a demographic group.
    For instance, a toy manufacturer might have a new toy coming out for the Christmas
    season, perhaps a *steampunk nutcracker ballet mouse king doll* (shown in *Figure
    2.1*), that they would like to market to European girls between the ages of 5
    and 11 based on market research about which age and gender groups are most likely
    to see the Nutcracker ballet:


    ![](img/71ff737206f7d80bb625b3c9aca9dc7f_42_0.png)


    Figure 2.1 – Marketing advertisement for the new Mouse King doll debuting at Christmas'
