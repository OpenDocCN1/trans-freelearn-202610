- pgno: 115
  md: 'models in the literature. Here, we use a pretrained HuggingFace model, a Bidirectional
    Encoder Representations from Transformers (BERT) model by first filling in missing
    data and then embedding it with the BERT model we’ve selected by adding to Script
    5.2:


    ```

    #prepare data

    mydata[''Notes'']=mydata[''Notes''].fillna(value=".")


