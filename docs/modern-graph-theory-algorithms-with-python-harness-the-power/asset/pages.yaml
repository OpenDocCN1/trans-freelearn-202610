- pgno: 164
  md: "Understanding edge structure at each time point is critical in the assessment\
    \ of network structure and properties that facilitate flow on the network, such\
    \ as hubs and bridges. Visualization and edge lists provide us a way to summarize\
    \ information, as well, which might provide added insight into, say, an epidemic\
    \ through a small population. Moving away from our lion example, let’s consider\
    \ badge tracking in an office setting during the outbreak of a new disease (such\
    \ as COVID-19). Different individuals will interact with different people and\
    \ different numbers of people in the office on different days, depending on their\
    \ schedules. Lists of edges that exist at different time points and visualizations\
    \ of interactions among employees can help researchers track the new outbreak\
    \ and calculate important epidemic model parameters to understand the potential\
    \ impact of the disease on a larger population.\n\nJust as connections between\
    \ individuals can change over time, so can the individuals in the network themselves.\
    \ Perhaps one employee is out sick or takes a personal day, thus dropping out\
    \ of the network at that time point. With DyNetx, we can also create an interaction\
    \ network to model a dynamic structure in which both vertices and edges can appear\
    \ and disappear as time evolves. Returning to Figure 8.4, let’s add to Script\
    \ 8.1 to create the following interaction stream:\n\n```\n#print interaction stream\n\
    for i in g.stream_interactions():\n    print(i)\n```\n\nThis script creates an\
    \ interaction list for each time point, denoting interactions that exist in the\
    \ network. While we don’t have individual lions leaving or entering our network,\
    \ lion interactions do change, and lions may or may not have interactions with\
    \ other lions in the network for a given time point. Let’s look a bit further\
    \ at the output to see which time points involve the most and least interaction\
    \ among the network lions:\n\n```\n#output of interactions for each time point\n\
    ('D', 'E', '+', 0)\n('C', 'F', '+', 1)\n('F', 'E', '+', 1)\n('D', 'E', '-', 2)\n\
    ('B', 'E', '+', 2)\n('A', 'B', '+', 2)\n('B', 'C', '+', 3)\n('C', 'D', '+', 3)\n\
    ('A', 'C', '+', 4)\n```\n\nThe first two values specify the vertices participating\
    \ in an edge. The third value designates the type of edge operation, with '+'\
    \ indicating an appearance (edge creation) and '-' denoting vanishing (edge removal).\
    \ The last value signifies the timestamp associated with the edge operation. For\
    \ instance, we can see that lion F establishes multiple interactions within the\
    \ network at time point 1. We can also see that lions D and E, whose interaction\
    \ began at the 0th time point, cease interaction at time point 2."
