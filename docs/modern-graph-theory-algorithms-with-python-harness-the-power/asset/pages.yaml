  md: 'clustering allows us to embed data through tools in these fields, create a
    network based on nearest neighbors, and apply spectral clustering to obtain labels
    for a dataset that can then be used to train a classification algorithm. This
    process is termed **semi-supervised learning**, and real-world data science in
    natural language processing and image analytics often relies on this methodology
    to build classification models from datasets. Let’s see this in action by considering
    a text-based ecological dataset.


    # Spectral clustering on text notes


    Let’s consider a dataset of ecological notes, including five healthy and five
    unhealthy local parks. While these notes are not as extensive as a full ecological
    survey, they should demonstrate how to create a semi-supervised learning pipeline
    to classify ecosystem health. Here is one example of a healthy ecosystem in the
    notes:


    ```

    "Mangrove ecosystem. Numerous butterflies, lizards, and insects. Gumbolimbo trees.
    Soggy soil.", ''Tropical pines. Scat shows raccoon and coyote populations here.
    Recent controlled burn."

    ```


    Here is an example of an unhealthy ecosystem in the dataset:


    ```

    "Small grass area. Some saplings. Gravel paths. Many cars parked in non-parking
    zones. Lots of run-off."

    ```


    While we could annotate these notes ourselves, we’ll use spectral clustering to
    see how semi-supervised learning can be used to generate training data labels
    for much larger datasets where annotation might be unfeasible or unreliable. First,
    we’ll import our data with Script 5.2:


    ```

