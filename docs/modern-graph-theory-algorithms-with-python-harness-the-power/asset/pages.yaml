    nx.draw(G2, labels=labels2, font_weight=''bold'')

    ```


    This piece of the script produces a plot of Dimmendaal''s Nilo-Saharan language
    subfamily tree, shown in Figure 11.7:


    ![](img/71ff737206f7d80bb625b3c9aca9dc7f_227_0.png)


    Figure 11.7 – A plot of Dimmendaal''s Nilo-Saharan language subfamily tree


    Note the connections that exist in Dimmendaal''s Nilo-Saharan language subfamily
    tree between Kunama and Fur, as well as Saharan and Eastern Sudanic. These represent
    related child subfamilies within the Northeastern branch of Nilo-Saharan languages.
    From Figures 11.6 and 11.7, we can see a similar overall structure, where a lot
    of shallow, unconnected branches exist. However, Dimmendaal''s Nilo-Saharan language
    subfamily tree adds an extra layer to the tree and includes the related subfamilies
    without a common ancestor directly begetting them.


    Given these differences, we''d expect some centrality metrics to vary between
    the two language subfamily trees. We''ll start with some familiar metrics defined
    in earlier chapters. Script 11.2 analyzes the differences in average betweenness
    centrality across our two language subfamily trees:


    ```

    #compare betweenness centrality of language families

    gb=nx.betweenness_centrality(G)

    print(np.mean(np.array(list(gb.values()))))

    gb2=nx.betweenness_centrality(G2)

    print(np.mean(np.array(list(gb2.values()))))

    ```'
