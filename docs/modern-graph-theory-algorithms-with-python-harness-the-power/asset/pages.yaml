- pgno: 73
  md: 'To model the spread of trends—or diffusion of ideas or spread of disease—we
    turn to a field of mathematics called differential equations. **Differential equations**
    relate functions and changes in those functions over time (their derivatives)
    across a system of interest. For instance, differential equations can model heat
    flow across a machinery part, opinion changes in a population, gravity’s impact
    on an object in motion, movement of sound through a room, or weather patterns
    over history (among many others!).


    Differential equations can include first-order derivatives, or changes in the
    slope of a function of interest, second-order derivatives, related to the curvature
    of the function, and even higher-order derivatives. For spreading processes on
    networks, we’ll limit our discussion to differential equations with first-order
    derivatives. However, any type of differential equation can be defined and run
    using the software we’ll be using on our NetworkX network.


    Sometimes, differential equations include multiple variables in the function of
    interest; these equations are called **partial differential equations**. Many
    real-world processes, including epidemic spread models, are modeled with partial
    differential equations. In addition, many real-world processes have a component
    of randomness or a dependency on where the process starts on an object or a network.
    On networks, it’s common to run a partial differential equation many times with
    the same or varying starting points of the process. This allows for a range of
    possible outcomes.


    Now that we know a bit about differential equations, let’s dive into our model
    of interest for spreads of behavior, ideas, and epidemics: the **susceptible-infected-resistant
    (SIR)** model. The SIR model was originally developed to study epidemics (in 1927),
    with components related to susceptible individuals in a population (not yet infected
    but able to be infected), infected individuals (those currently infected with
    the disease), and recovered or resistant individuals (those who had been infected
    or were immune and could not be infected).


    As individuals mix in the population, infected individuals can pass on their infection
    to those who are susceptible with a certain probability. For our model, the probability
    of infecting a susceptible individual is given by the parameter *beta*. In practice,
    this is either known from estimates in the literature regarding behavior or disease
    spread probability or is estimated within a range of best guesses, with models
    run between those best guesses to estimate potential spread within that range
    of possibilities. Once an individual is infected, that individual has a probability
    of recovery, given by the parameter *gamma*. Once recovered, our model does allow
    for reinfection. In a **susceptible-infected-recovered-susceptible (SIRS)** model,
    however, individuals who have recovered can be reinfected after a period of time.
    In a **susceptible-infected-susceptible (SIS)** model, recovery is replaced by
    an immediate chance of reinfection rather than recovery.


    One important property of epidemic spread is the so-called **reproductive number
    (R₀)**, or the number of secondary infections caused by an infected individual.
    We can calculate R₀ by dividing our beta parameter value by our gamma parameter
    value. If R₀ is above 1, the epidemic is expected to spread across the population
    in its initial phases, signaling the potential for a large epidemic. Many infectious
    disease outbreaks have an R₀ value above 1, including recent Ebola outbreaks (R₀~1.5),
    the 1960s measles outbreak in Ghana (R~14), and the 1918 Spanish flu (R₀~1.5 initially
    and ~3.5 in later'
  merge: -1
  img_proc: true
- pgno: 74
  md: 'waves). The R₀ value for COVID-19 varied dramatically between variants and
    countries, making it difficult to obtain a standard R₀. However, one estimate
    across Africa puts COVID-19’s estimated R₀ at 2.0-9.7 for most countries.


    SIR models work a bit differently on networks. An infected vertex typically infects
    only neighbors in the network, creating a proximity effect. In our network, the
    bridging properties limit the chance of spreading from one subnetwork to another,
    as infection rates of a bridge vertex and its adjacent vertices are lower than
    spread through a hub of mutually connected vertices. In general, bridges are important
    vertices in networks with respect to information, ideas, or epidemic spread and
    are often intervention targets. Vaccination campaigns in a disease epidemic to
    limit spread, targeting in a marketing campaign to increase product adoption rates,
    and capturing in a criminal communications network are all real-world examples
    of bridge targeting to impact spread dynamics on a network of interest.


    Let’s dive a bit deeper into the geometry of networks, including hubs and bridges.
    Hubs are regions of high connectivity, where many vertices connect to many other
    vertices. Geometrically, densely connected regions such as hubs have high curvature
    and provide many possible paths for spreading processes or random walks on the
    network. In our Francophone Africa network, Cameroon, Senegal, and Mali all show
    hub properties.


    Note, however, that Senegal has many edges to other vertices that do not have
    large numbers of edges associated with them. While Senegal serves as a hub owing
    to its connectivity, it does not make an ideal spreading target, as the process
    will die in the fairly isolated vertices surrounding it. Cameroon and Mali, however,
    are hubs connected to other vertices that serve as either hubs or bridges, allowing
    the process to continue spreading with high probability. Centrality metrics measure
    how central a vertex is to the network, creating different types of network hub
    measurements that can find vertices that function as Mali/Cameroon or as Senegal
    within the network. We will revisit these centrality measurements in later chapters,
    where we will assess network properties with igraph.


    Bridges work a bit differently but also contribute important geometric features
    to networks. Niger and Chad serve as bridges in our Francophone Africa network,
    connecting hubs that share no other edges between them. Technically, a type of
    centrality called betweenness centrality measures this bridging property by computing
    the shortest paths between each vertex pair (representing the most direct communication
    route) and counting the number of shortest paths that include a given vertex.
    Those vertices with many of the shortest paths passing through them act as bridges
    between different parts of the network. Geometrically, bridges serve as crossing
    points from one part of a network to another with respect to flow. Our music spread
    from Gabon to West Africa would not be possible without bridges such as Chad and
    Niger connecting North and West Africa with Central Africa, as the trend must
    spread through those countries to leave Central Africa.


    For our music spread across Francophone Africa, let’s consider a SIR model that
    begins with 5% of our countries listening to a new Rumba artist. We’ll say that
    our music trend has a 25% chance of spreading to a neighboring country (our beta
    parameter) and a 10% chance of fizzling out as a trend (our gamma parameter).
    This gives us R₀~2.5, which means our music trend should spread well initially.'
  merge: -1
  img_proc: true
