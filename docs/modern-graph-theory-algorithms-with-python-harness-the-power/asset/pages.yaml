  md: 'This path starts at **store 1**, proceeds to **store 3** (2.4 miles), then
    **store 5** (0.9 miles), then **store 4** (5.4 miles), then **store 2** (1.4 miles),
    and finally back to **store 1** (2 miles).


    Let’s see how this works on our secondary store network by adding to `Script 4.3`:


    ```

    ```python

    #apply TSP algorithm to the second stores''s networks

