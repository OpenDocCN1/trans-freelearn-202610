- pgno: 203
  md: 'Figure 10.2 shows a chain of probabilities as drug use progresses through different
    stages of use. We can find the probability of reaching each stage by multiplying
    the transition probability of each step before a given stage. For instance, regular
    use in this population involves trying the drug (30% chance of doing so) and starting
    regular use (20% chance of doing so); this gives a 6% chance (0.3 multiplied by
    0.2) of an adolescent in this population using this new drug regularly. Given
    that 40% of these adolescents using the new drug regularly end up dependent on
    it, we’d expect any given adolescent in this population to have a 2.4% chance
    of progressing to dependency on the new drug given their environment that is conducive
    to trying the drug.


    Mathematics provides us with a formal way to study these pathways or construct
    them from a set of data. Let’s turn to the mathematical tools we need to formalize
    this intuition of probabilities across a sequence of events.


    # Bayes’ Theorem


    The probability of an event that depends on other events is called **conditional
    probability**. In probability theory, conditional probability is a measure of
    the probability of an event occurring, given that another event has already occurred.
    In Figure 10.2, the progression to drug dependence relies on regularly using the
    new drug, which relies upon trying the drug for the first time, which relies upon
    being in a situation where people use the drug. While conditional probability
    doesn’t need to involve this many conditional steps, it does involve a prior event
    that influences the probability of an event of interest occurring.


    Going back to our example in Figure 10.2, we have a universe where an adolescent
    is exposed to drug use, represented in Figure 10.3 as a rectangle:


    ![](img/71ff737206f7d80bb625b3c9aca9dc7f_203_0.png)'
  merge: -1
  img_proc: true
