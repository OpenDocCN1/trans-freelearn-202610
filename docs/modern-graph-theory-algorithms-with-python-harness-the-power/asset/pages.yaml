  md: '# 12


    # Graph Databases


    In the previous chapters, we’ve considered networks as data structures that we
    can analyze to extract insight into data science problems. In this chapter, we’ll
    consider networks as data storage options, linking many pieces of information
    in a multi-relational way. Many storage options exist but we’ll focus on an open
    source option that integrates well with Python—Neo4j.


    We will cover the following topics in this chapter:


    +   - Introduction to graph databases

    +   - Querying and modifying data in Neo4j


    By the end of this chapter, you’ll understand the advantages of graph databases
    to store network science datasets, be able to visualize graph databases and know
    how to query them for the quick retrieval of relevant information. You’ll feel
    comfortable modifying tables by insertion and deletion. You’ll understand how
    the tools in our previous chapters can help you query efficiently to find relevant
    data. Let’s get started by exploring the rationale behind graph databases.


    # Introduction to graph databases


    **Graph databases** (databases that store data in network form) offer many advantages
    over traditional relational databases. First, graph databases can capture and
    traverse hierarchical relationships. While relational databases can capture taxonomies,
    they do so in different columns that are not explicitly linked.


    In addition, graph databases capture complex relationships between items or groups
    of items explicitly by connecting them with edges. This allows for multiway relationships
    to exist within the database; querying for nearest neighbors, for instance, is
    much easier when neighbors are connected by an edge and do not require estimation
    steps to find **Euclidean** or **Manhattan distances** between all items in the
    database.


    Furthermore, graph databases can capture the directionality of relationships between
    items in the database very easily. In a relational database, the directionality
    of a single relationship may involve several columns’ worth of information to
    capture that single relationship. Thus, for items with complicated'
  merge: -1
  img_proc: true
- pgno: 232
  md: 'relationships that may be unidirectional, a graph database provides a compact
    representation of data structure.


    Finally, within graph databases, it is possible to mine the dataset for implicit
    relationships that have not been programmed into the database by using network
    algorithms to probe for similar patterns in different parts of a network or to
    infer edges that don’t exist based on triadic closure. For many datasets—such
    as continuously-growing -omics datasets, evolving ontologies, or other non-static
    datasets where knowledge is incomplete—mining the data provides new research avenues.


    Now that we know a bit about the advantages of graph databases, let’s dive into
    specific differences between graph databases and relational databases.


    # What is a graph database?


    Graph databases are databases based on network science. Rather than storing data
    as columns in a spreadsheet (shown in the following figure), as is done in relational
    databases, graph databases store data as networks, with items that would occupy
    a row represented as a vertex connected to other vertices per relations that exist.
    Column data is used to either add metadata to the vertex or connect it to other
    vertices. Graph database queries rely on network science algorithms to traverse
    the graph, pattern-finding algorithms, and combinations of these two approaches.
    Thus, queries for graph databases can become quite sophisticated without necessarily
    leading to a long run-time as subqueries in SQL will require. Efficiency is a
    big advantage of graph databases. Let’s look at an example of supermarket customer
    feedback related to customer service or products, shown in Figure 12.1:


    ![](img/71ff737206f7d80bb625b3c9aca9dc7f_232_0.png)


    Figure 12.1 – An example of relational database design, where rows contain items
    with information organized into columns (Used with permission from Microsoft Excel)'
  merge: -1
  img_proc: true
- pgno: 233
  md: 'Figure 12.1 shows a relational database with many rows of data that exist as
    columns. However, this data may be better represented as a graph database, where
    items relate through the columns or use columns as metadata in a queryable way.
    Perhaps there are dates attached to the comments that could link items by time
    and use the department related to the complaint as metadata.


    While it is difficult to visualize a relational database, visualizing a graph
    database is much more straightforward. Some graph databases come with built-in
    visualization tools to zoom into areas of interest or query results. Some allow
    developers to build on pre-existing visualizations to tailor this feature to their
    needs. When hovering over edges and vertices, most graph database visualization
    tools will show metadata associated with a vertex or edge, providing context for
    the relationships of interest pulled by the query. Cytoscape is one of the most
    commonly used programs for network visualization at scale; originally, it was
    constructed to visualize proteomics datasets, where protein interactions are documented
    across organisms. Here’s Cytoscape with demo images of the example graphs: https://js.cytoscape.org/.


    One of the advantages of Cytoscape is its ability to handle saved igraph networks
    such that analysis of very large networks can be done in Python and then visualized
    with Cytoscape, where the network size will not complicate visualization as it
    will with the igraph plotting functions. In addition, Cytoscape offers a desktop
    version that should work with Java-based devices and a web interface version for
    those who do not have access to the desktop version. If you are interested, you
    are encouraged to download Cytoscape and test out its visualization either with
    the datasets we use in this book or with your own datasets of interest.


    Now that we understand the structure and advantages of graph databases, let’s
    dive into some datasets where a graph database may function better than a relational
    database with respect to organizing the information and retrieving information
    of interest.


    # What can you represent in a graph database?


    There are many data science domains that can benefit from graph databases. We’ll
    explore a few of these use cases in depth before diving into coding in one open
    source graph database. Let’s start with an example from epidemiology.


    # Contact tracing


    When a new epidemic starts in an area, epidemiologists often employ a tool called
    contact tracing, where data on each case is collected to connect cases to each
    other in the hopes of finding the outbreak source, or patient zero. Patient zero
    often provides insight into the source of the epidemic—whether an animal vector,
    a laboratory breach, or an environmental disaster. Epidemiologists, then, can
    pinpoint effective containment policies and monitor potential sources to prevent
    future outbreaks.


    In longer outbreaks where a virus has enough time to mutate, contact tracing allows
    epidemiologists to study the viral evolution of an outbreak. During the COVID-19
    pandemic, we saw many mutations of COVID-19 with different rates of mortality
    and different symptomologies, some of which did not'
