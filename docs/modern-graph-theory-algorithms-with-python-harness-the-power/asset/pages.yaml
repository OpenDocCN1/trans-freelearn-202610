  md: "# Spectral clustering on the friendship network\n\nAs we saw in Chapter 5,\
    \ spectral clustering offers a clustering option to partition either an adjacency\
    \ matrix or a distance matrix; this can be done as a UL or semi-SL (SSL) algorithm.\
    \ Here, we'll use our correlation matrix from Script 9.1 to run an unsupervised\
    \ spectral clustering with three clusters and five initializations (similar to\
    \ our k-means runs) on our friendship dataset to compare with our k-means results\
    \ by adding to Script 9.1:\n\n> Note\n> \n> Again, you may encounter a Windows\
