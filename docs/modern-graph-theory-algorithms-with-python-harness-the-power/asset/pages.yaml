- pgno: 36
  md: 'A decade later, some of these university friends are no longer in contact with
    each other, yielding a much different friendship network, shown in Figure 1.14:


    ![](img/71ff737206f7d80bb625b3c9aca9dc7f_36_0.png)


    Figure 1.14 – The university friendship network a decade after graduation


    Figure 1.14 shows that one friend (in the upper-right corner) has lost touch with
    all but one close university friend. One friend (lower-left corner) has maintained
    all her close university friendships. This change may seem rather trivial, as
    all friends have maintained at least one friend from the original group. However,
    in terms of information exchange across the network, the original friendship network
    was more amenable to information exchange from the friend in the upper-right corner
    to the others in the network. She could communicate directly with each friend.


    However, after a decade of drifting friendships, information exchange from the
    friend at the top right must go through the friend at the bottom left to reach
    the rest of the network. The time taken for important news (perhaps regarding
    a reunion or wedding) to reach the full network will be longer in the network
    in Figure 1.14 than in Figure 1.13.


    In this section, we’ve introduced a few types of social networks. We’ve seen how
    relationships can be mutual or one-sided. We’ve seen how networks can change over
    time and how this may impact information exchange on networks. We’ll revisit social
    relationships in Chapters 2, 3, 8, and 9. Now, let’s explore some other types
