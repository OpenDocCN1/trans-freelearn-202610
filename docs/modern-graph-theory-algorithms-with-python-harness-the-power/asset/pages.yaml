- pgno: 26
  md: '# What is a Network?


    The evolution of networks over time is a key problem in network science today,
    as we often have incomplete data on relationships that exist outside of what we
    explicitly observe and want to predict future phenomena, such as predicting the
    potential for bipartisan fake news spread in the next election or when new members
    may join a criminal organization based on ties that exist in the present. We will
    wrangle some problems related to dynamic social networks and their applications
    in *Chapter 8*, where we analyze the spread of disease over time as a social network
    evolves.


    Before jumping into real-world problems and their solutions in Python, it’s important
    to understand the fundamentals of network science. Let’s dive into some of the
    terminology and conventions of graph theory and networks.


    # Formal definitions


    Real-world networks are usually formalized and studied with tools from graph theory.
    As we’ve mentioned, graph theory defines relationships between objects in the
    form of vertices and the edges that connect related vertices. Let’s formalize
    this a bit and explore the foundations of network science found in graph theory.
    A graph is defined as a set of vertices and a set of lines, or edges, that connect
    pairs of vertices (Berge, 2001). Thus, a graph represents the structure of a network
    well. Returning to our hackathon social network, we represent our colleagues as
    vertices and connect them with edges if they collaborate.


    Graphs can represent different types of relationships. A self-relationship of
    a vertex can be shown with a loop connecting the vertex to itself. For instance,
    when writing emails, someone might copy themselves on the email or send an email
    to themselves as a reminder. Another type of relationship is directionality. For
    instance, reposting content is a unidirectional interaction (usually), but friending
    someone is a bidirectional interaction where both parties mutually connect. Unidirectional
    relationships are represented in a graph with directed edges, usually denoted
    with an arrow on visualizations of the graph. Bidirectional relationships have
    undirected edges, denoted as lines without arrows. *Figure 1.4* shows a graph
    with loops, directed edges, and undirected edges:


    ![](img/71ff737206f7d80bb625b3c9aca9dc7f_26_0.png)


    Figure 1.4 — A graph with loops, directed edges, and undirected edges'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'In scientific literature, the terms network and graph are used interchangeably,
    as are terms for edges and vertices. Table 1.1 shows a few of the common terms
    encountered:


    | Network Science | Graph Theory |

    |---|---|

    | Network | Graph |

    | Node | Vertex |

    | Link | Edge |

    | Collection | Set |

    | Relationship | Function |

    | Directed graph | Digraph |


    Table 1.1 – A terminology comparison between network science and graph theory


    In practice, these distinctions are rarely made, so these two terminologies are
    often synonyms of each other. In this book, we’ll stick with edges and vertices
    as our graph components and networks as our preferred term for the collection
    of vertices and edges created from real-world data.


    Many types of graphs exist within graph theory that are realized in real-world
    data. Let’s briefly define some types of graphs that exist:


    +   - A directed graph contains one or more edges with a direction (to or from
    another vertex, called arcs)

    +   - An undirected graph only has edges, which do not have an origin or destination
    vertex


    “A graph is simple if it has no multiple lines (typically used to represent multiple
    relationships that exist or denote the strength of a relationship).” A simple
    undirected graph contains no loops, but a simple directed graph can contain loops.
    Let’s visualize what these graphs look like in practice:'
  merge: -1
  img_proc: true
