- pgno: 45
  md: '# Temporal data


    Networks are rarely static. Social networks evolve over time as connections forge
    and break. Sales patterns change as new items are added, needs for specific items
    change over seasons, or changes in the economy spur changes in consumer behavior.
    Stock market trading volumes and industry/regional correlations change over time
    as political and business climates change.


    All these changes involve a time component in the data. There are a few ways to
    model time trends in networks, and we’ll start with two use cases and build out
    more uses in Part 3 of this book.


    First, let’s return to our example of a job seeker leveraging his or her social
    network to find a new job. As this individual begins a job search, they may add
    suggested professional connections on LinkedIn, attend local networking events,
    or connect with a few recruiters looking to hire; all these actions add connections
    to their social network (and increase the likelihood of finding a new job). Figure
    2.3 shows women meeting at a networking event, forging new professional connections
    to leverage in their job searches:


    ![](img/71ff737206f7d80bb625b3c9aca9dc7f_45_0.png)


    Figure 2.3 – A changing social network over 8 weeks'
