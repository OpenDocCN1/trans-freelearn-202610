  md: '![](img/71ff737206f7d80bb625b3c9aca9dc7f_108_0.png)


    Figure 5.5 – An illustration of a forest stream, from which flora can be identified
    through deep-learning algorithms


    Now that we know how to collect ecological data, let’s explore a few tools from
    graph theory that will help us analyze ecological data that has been collected
    across different geographical regions.


    # Spectral graph tools


    The **adjacency matrix** and **degree of vertices** in the adjacency matrix contain
    information about the connectivity of vertices within the network. For an undirected
    network, the **Laplacian matrix** of the network is found by subtracting the adjacency
    matrix from the degree matrix (i.e., \(L = D - A\), where \(D\) is the degree
    matrix and \(A\) is the adjacency matrix). This matrix contains information about
    many important properties of the network, including the number of connected components,
    the sparsest cut that can separate the network into separate components, and the
    strength of connection within the network overall.'
  merge: -1
  img_proc: true
- pgno: 109
  md: '**Connectivity** is an important concept in graph theory. A **connected network**
    is one in which there is a path between all pairs of vertices; a **disconnected
    network** is one in which some vertices do not have paths to all other vertices.
    Connected networks can be separated by cutting edges; the **minimum cut set**
    is the set of the fewest edges that need to be removed to separate a network into
    two pieces to disconnect a connected network. Not only do these values connect
    to theoretical results in graph theory related to spreading processes and other
    differential equations defined on the network, but this information also tells
    us about how to separate groups on the network.


    To obtain this information, we need to perform a decomposition on the Laplacian
    matrix to obtain eigenvectors and eigenvalues (the network spectrum). Sometimes,
    we normalize the Laplacian matrix first; in spectral clustering, this is less
    of a necessity than when computing specific graph theoretic values from the spectrum.
    Then, we find the Laplacian matrix’s eigenvalues and eigenvectors. In practice,
    this is done through an algorithm rather than through linear algebra operations
    directly.


    The second eigenvalue obtained from this process corresponds to the **Fiedler
    value** (also termed **algebraic connectivity**); this value calculates how many
    connected components exist in the network and relates to the robustness of the
    network. The corresponding eigenvector partitions the network into separate networks,
    thus providing a two-cluster solution to partitioning groups on the network. In
    spectral clustering, this process of partitioning a network into two separate
    networks can be repeated until a predefined stopping point is reached (such as
    a total number of clusters).


    Spectral clustering on spatial networks constructed from ecological data allows
    researchers to partition out areas in which animals migrate, distinguish populations
    that might be isolated, and catalog differences in vegetation type or crop disease.
    Let’s set up a simple example and explore different ways to compute spectral clustering.


    # Clustering ecological populations using spectral graph tools


    Consider a researcher in Gabon hoping to understand the interconnectivity of Gaboon
    viper populations in a protected area of Loango National Park (*Figure 5.6*).
    Snakes are tagged in seven regions of the park (represented by a vertex), and
    their tags record their location for the next month. Snakes often will move between
    regions if their habitat overlaps with multiple regions. It’s possible that multiple
    populations of snakes exist, giving different territories for different populations
    of snakes. If the two regions share a regional population, then the two vertices
    corresponding to these regions will have an edge. If no snakes migrate between
    regions, two vertices will not share an edge and likely represent different populations.
    Isolated populations tend to be more vulnerable to climate change, poaching, and
    habitat loss; understanding species and individual population ranges is critical
    to conservation efforts.'
  merge: -1
  img_proc: true
