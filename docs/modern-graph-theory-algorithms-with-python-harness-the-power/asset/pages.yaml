    Given these trends in the market, network science tools are poised to play a critical
    role in stock market analytics. Relatively little work exists in terms of the
    application of these tools to stock market data or time series data more generally,
    and few centrality metrics have been studied systematically. Much of the existing
    research on the application of centrality metrics to understand stock market trends
    over time involves extensions of networks to include multi-way relationships.
    Let’s now turn our attention to an extension of applying networks to the relationships
    that exist among more than two entities.


    # Extending network metrics for time series analytics


    Because networks are topological objects and because our correlation matrix can
    use a threshold of any value, it is possible to extend network metrics to the
    realm of topological data analysis. Networks capture the two-way relationships
    between entities. However, three-way, four-way, and even larger-way interactions
    can exist, as well. **Simplicial complexes** extend the idea of networks to capture
    these higher-numbered interactions. Three-way interactions are represented as
    faces (or triangles) outlined by two-way lines. Four-way interactions are represented
    as tetrahedra, comprised of three-way faces that have four-way interactions. This
    process can continue to any value of mutual interactions, where'
  merge: -1
  img_proc: true
- pgno: 136
  md: 'the lower-dimensional interactions form the boundaries of the higher-dimensional
    interactions. A simplicial complex collects the highest-level interactions that
    exist among vertices into a single object. Figure 6.8 shows an example of a three-way
    interaction bounded by mutual, two-way interactions:


    ![](img/71ff737206f7d80bb625b3c9aca9dc7f_136_0.png)


    Figure 6.8 – A diagram showing how a three-way interaction is defined by mutual,
    two-way interactions


    Just as networks can be weighted or unweighted, simplicial complexes can be weighted
    or unweighted across n-way interactions within the simplicial complex. In addition,
    just as networks are constructed from an adjacency matrix, so simplicial complexes
    are created from adjacency matrices at each level of n-way interactions (technically
    the boundary matrices). Just as we typically need to construct an adjacency matrix
    to create a network from raw data, we can use raw data to define the n-way interactions
    existing in that data.


    First, a relationship metric must be defined for the raw data. In our stock dataset,
    we chose correlation metrics. Distance metrics are also commonly used when constructing
    both networks and simplicial complexes, and many, many distance metrics can be
    defined for continuous or discrete measurements on a dataset. Once a metric is
    defined, a threshold or series of thresholds are applied to the metric matrix
    to define the relationships within a given radius of each other (defined by the
    threshold). Two main options exist for constructing the simplicial complex and
    its relationships:


    +   - Defining the n-way relationships through the union of points, the radii
    of which touch (called a Vietoris–Rips complex)

    +   - Counting the connection points, which involves the mutual overlap of points
    within a given radius, where all connected points must lie within each other''s
    radius (called a Čech complex)


    The filtration of simplicial complexes involves varying the radius by different
    metric thresholds. Remember how applying different correlation thresholds produced
    different results and insights for our stock market dataset? Different filtration
    levels of simplicial complexes can produce different simplicial complexes at each
    filtration level with different properties that may contain important information
    for an analyst.'
  merge: -1
  img_proc: true
