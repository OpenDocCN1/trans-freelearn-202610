    will be relatively short compared to the ones in the Francophone Africa network,
    as most vertices are connected or nearly connected to each other. The diameter
    of a network, the longest-shortest path, represents the maximum shortest travel
    route for information or disease to spread between two vertices. A small network
    diameter (or a small average shortest path length) suggests efficiency in spreading
    processes, such as information, trends, or disease. Thus, we’d expect our AIMS
    Cameroon student network to be more vulnerable to spreading processes than our
    Francophone Africa network. Technically, the diameter provides bounds for differential
    equations, such as our spreading process, that are defined on the network.


    An epidemic with an R₀ over 1 on this network would likely spread quickly and
    infect most of the network. Let’s run an epidemic with the same beta and gamma
    parameters as we did on our Francophone network and plot the results to see how
