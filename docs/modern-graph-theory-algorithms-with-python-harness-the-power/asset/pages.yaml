- pgno: 4
  md: '# Foreword


    As the CTO/CIO of life sciences as well as automotive, energy, and high-tech industry-focused
    companies, I have continuously been challenged with creating meaningful data insights
    from a great variety of unstructured and semi-structured data sources. A decade
    ago, my advanced analytics and machine learning journey experienced the biggest
    push forward when I benefited from one of the most impactful introductions in
    my career. Ever since I got to work with Colleen Farrelly on our ontology-focused
    data science requirements when building out a genomics diagnostics platform, my
    approach to AI has been tremendously elevated. Subsequently, I got to work on
    Colleen Farrelly’s exceptional book, The Shape of Data, which intrigued me deeply
    with her unique delivery of how to combine geometry and machine learning-based
    algorithms and supporting data structures to create powerful topological representations
    of complex data problems.


    In this equally captivating sequel, Modern Graph Theory Algorithms with Python,
    Colleen Farrelly and Franck Kalala Mutombo take you to the next level of unleashing
    the potential of network science by diving deep into specific graph theory approaches
    to solve a great variety of industry problems ranging from ecological to financial,
    spatial and temporal sales, and clinical data challenges. It is easy to see why
    readers and data science practitioners of any level will find each chapter profoundly
    valuable based on the supporting Python library and code examples along with the
    underlying mathematical explanations.


    With each turn of a page, I found myself wanting to reinforce the presented learnings
    by applying well-defined examples to my own business requirements. Being a keen
    user of graph databases, I very much enjoyed the hands-on practical discussions
    on specific technologies such as in Chapter 12 to illustrate the relative ease
    of Python integrations and built-in capabilities of open source solutions that
    can be leveraged in today’s growing powerful set of available tools.


    This comprehensive book provides just-enough and just-in-time fundamental concepts
    to enable data scientists and software engineers to greatly elevate their machine
    learning techniques with directly applicable well-structured scenarios. Each of
    the consistent problem-solution breakdowns includes key considerations for the
    required data wrangling, transformation, and modeling aspects.


    Furthermore, this book provides a convincing lead into the relevance of new frontiers
    such as quantum network science algorithms, neural network architectures as graphs,
    hierarchical networks, and hypergraphs. With a concise and easy-to-follow thought
    process, this book provides you with the important context of how to reduce the
    large volumes of parameterization required for large language models and address
    the critical aspect of metadata management via hypergraph databases, for example.'
  merge: -1
  img_proc: true
