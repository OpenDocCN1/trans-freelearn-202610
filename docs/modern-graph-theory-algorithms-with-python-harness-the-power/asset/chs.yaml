- "# 整合应用\n\n在前面的章节中，我们探索了适用于网络科学解决方案的不同数据问题，学习了许多网络中心性度量，并将**机器学习（ML）**模型应用于网络科学数据集。在本章中，我们将整合目前所学的内容，评估一个时空数据集上的流行病风险，该数据集在每个时间点都评估了中心性度量和埃博拉病例数。我们的示例将包括在刚果民主共和国一个地理区域收集的网络和数据，该地区在2018-2020年间曾遭受一次大规模埃博拉疫情，自2020年以来还发生了数次较小规模的疫情。我们还将介绍一种用于对时间序列数据建模的统计模型，其方式与回归模型非常相似。\n\
  \n具体来说，本章将涵盖以下主题：\n\n- 问题简介\n- **广义估计方程（GEEs）**简介\n- 数据转换\n- 数据建模\n\n到本章结束时，你将理解如何使用网络科学工具和统计模型端到端地解决一个问题。你将能够在\
  \ Python 中运行时间序列模型，并从数学上解释结果。最后，完成本章后，你将具备将本书所学应用于工作中遇到的数据科学问题的能力。\n\n## 技术要求\n\n\
  本章实际示例的代码可在此处找到：https://github.com/PacktPublishing/Modern-Graph-Theory-Algorithms-with-Python\n\
  \n## 问题简介\n\n埃博拉病毒是一种**丝状病毒**，是一种具有脂质包膜的单链核糖核酸（RNA）病毒。它于1976年首次被发现，属于**人畜共患**病毒——从受感染的动物宿主传播给人类。埃博拉病毒传播给人类的动物媒介目前尚不清楚。然而，该病毒通过直接接触体液在人与人之间传播，使一线医护人员和家庭照护者面临感染和传播病毒的高风险。\n\
  \n埃博拉病毒抑制免疫反应，抑制凝血，促进肾功能和电解质紊乱，并促进酸中毒。所有这些都导致血容量不足，进而在许多病例中引发器官衰竭和死亡。该病毒在非洲多个地区呈地方性流行，包括刚果盆地，大多数疫情都起源于此。在已知疫情中，病死率通常在40%至50%之间，这通常是由于农村地区缺乏输血和生命支持等支持性护理，而这些地区往往是初始病例的发生地。\n\
  \n疫情暴发期间，个人防护装备对于避免传播给医护人员以及由医护人员造成的传播至关重要。然而，在许多农村地区，医疗物资缺乏限制了医护人员的自我保护能力，从而促进了疾病的早期传播。此外，必须对病例进行隔离，以避免感染在诊所就诊的其他患者。图13.1展示了一位穿着个人防护装备的医生，在一家为隔离埃博拉患者而设立的诊所中工作：\n\
  \n![](img/71ff737206f7d80bb625b3c9aca9dc7f_250_0.png)\n\n图13.1 – 一位穿着个人防护装备的医生在临时诊所治疗埃博拉患者的示意图\n\
  \n2013年12月，埃博拉病毒最严重的一次疫情爆发始于几内亚盖凯杜省梅利安杜——一个病毒由此传播到几内亚及其邻国塞拉利昂和利比里亚的小镇。最终，病例传播到了意大利、马里、尼日利亚、塞内加尔、西班牙、英国和美国，其中几个国家报告了二代病例（主要是医护人员）。到疫情结束时，近30000人被感染，超过10000人死亡。到2016年疫情结束时，该病毒已多次变异，研究人员开发出一种疫苗，以扑灭疫情并限制其在全球以及几内亚科纳克里等大城市内的传播。基本再生数在利比里亚为1.20，在塞拉利昂为2.02，导致受影响的三个主要国家传播迅速，感染率居高不下。\n\
  \n2018年刚果民主共和国的埃博拉疫情影响了伊图里省、北基伍省和南基伍省，病例集中在贝尼、布滕博、卡特瓦、卡伦古塔、马巴拉科和曼迪马。到2020年，共发现超过3500例确诊和疑似病例，尽管当地和国际公共卫生工作者及时干预，并且有2014年西非埃博拉疫情期间研发的疫苗可用，仍有超过2200人死亡。从2018年底到2019年年中，基本再生数保持在1以上，表明存在持续的感染潜力。事实上，大多数病例确实发生在这个时间段。\n\
  \n由于城镇隔离和公共卫生工作者的及时干预，及时的干预将潜在感染人数限制在约16000人——而不是受影响省份中的1600万居民。边境监测措施限制了埃博拉向布隆迪和卢旺达等邻国的传播。然而，对国际援助人员的不信任、与M23叛军的持续冲突，以及暴力蔓延至治疗区域，使当地和国际援助组织的疫情应对复杂化。如果应对协调更好，安全威胁处理更得当，本可以防止传播并提高生存率。\n\
  \n虽然本章将侧重于模拟促进埃博拉病毒在刚果民主共和国各地区传播的网络，但我们将使用的方法可以扩展到处理与网络传播相关的任何类型的**偏微分方程（PDE）**模型。例如，对生态学和保护感兴趣的读者可能会考虑采用网络科学方法，模拟影响叶海龙、巴哈马锯鲨或苏卡达陆龟种群的毒素的地理传播；他们可能还想了解捕食者-被捕食者关系中的逃避或延迟。社会科学家可能会考虑政治意识形态在一个地区各国间的传播，或这样的模型：在社交媒体运动的推动下，人口层面的行为改变效应可能存在延迟，变化发生在较长时间内，或需要达到某个阈值才会显现效果。生物医学研究者可能会考虑细胞分化和形态发生背景下的化学梯度模型、癫痫发作通过大脑皮层的扩散，甚至肿瘤在大脑各区域生长的动态。农民可能希望考虑空间模型，在屏障资源有限的情况下，限制蝗虫或其他威胁作物的害虫的传播。\n\
  \n现在，让我们回到埃博拉病毒示例，更深入地了解疫情的背景。\n\n\n\n\n## 刚果民主共和国埃博拉疫情传播 – 2018-2020 年暴发\n\n尽管公共卫生工作者迅速应对，2018\
  \ 年埃博拉暴发仍出现了指数级增长的波次。许多受影响地区包括人口超过 10 万的城市，而暴发前和暴发期间对医疗机构的武装袭击威胁着医疗基础设施和患者的及时救治。由于冲突持续，许多主要城市以外农村地区的风险人群犹豫接受疫苗或遵循公共卫生建议。错误信息大量存在，延误了部分患者的治疗，并使埃博拉传播给护理人员。所有这些因素都促进了埃博拉在受影响地区从城市到城市的传播。\n\
  \n然而，伊图里、北基伍和南基伍的大部分地区包括茂密的雨林、野生动物保护区和人口稀疏的区域，限制了城市间的旅行，而城市间的旅行通常会推动疫情在地区间传播（见图\
  \ 13.2）。事实上，大部分传播发生在通过交通连接的大城市之间。这可能缓解了此次埃博拉疫情的影响，与包括许多交通路线的城市的 2014 年西非暴发相比：\n\n\
  ![](img/71ff737206f7d80bb625b3c9aca9dc7f_252_0.png)\n\n图 13.2 – 刚果盆地保护区的示意图\n\n\
  不幸的是，由于城市嵌套在埃博拉动物媒介生活的茂密森林地区，刚果民主共和国东北部的地理增加了该地区暴发的可能性。这增加了该地区未来埃博拉暴发的可能性。因此，研究促进疫情传播和随时间推移的脆弱性的一些因素非常重要，以便在另一次暴发被识别后，快速有效的应对措施能够尽快到达该地区。这限制了接触人群的数量，并随着更多人接种疫苗和接受治疗而可能降低死亡率。\n\
  \n## 地理和后勤\n\n正如我们在前面的小节中所看到的，区域地理和城市间交通的后勤在疫情潜在传播中发挥了重要作用。在一次疫情中，与其他地区几乎没有或没有人口混合的孤立地区表明疫情得到控制。然而，交通枢纽（例如每天有许多国际航班的城市）在暴发期间对公共卫生构成更大风险。事实上，这正是\
  \ COVID-19 迅速传播的原因；短的潜伏期加上许多旅客从国际枢纽前往其他国际枢纽，导致新国家和大陆的病例激增，直到边境关闭以遏制疾病流动。\n\n在我们的分析中，我们将考虑\
  \ 2018 年埃博拉暴发受影响最严重的几个地区，包括基于地区间交通路线网络连接指标、每年病例数、暴力事件数量（可能导致地区内人口流离失所）和 2017-2021\
  \ 年的灾害事件数量（同样是地区流离失所风险）。我们假设从区域连通性得出的网络指标会影响暴发期间的埃博拉病例数。\n\n在开始构建数据集之前，让我们先建立分析所需的工具——具体来说，纵向回归建模。\n\
  \n## GEE 简介\n\n回归模型带有许多假设，需要为许多类型的现实问题放松。对于实例，线性回归假设结果呈正态分布。在许多问题中，我们可能希望处理二元结果数据（是/否、存活/死亡、复发/未复发…）、计数数据（一段时间内事件的数量，例如本章的结果），或制造产品的故障率（故障结果的可能性）。\n\
  \n最常见的结果分布之一来自二项分布，其中在人群中收集二元数据。例如，我们可能在胶质母细胞瘤研究中有一组患者，其中我们比较不同治疗组患者的 6 个月生存率。每位患者要么存活要么死亡（二元结果）；按组汇总，这些结果形成二项分布，可以进行统计比较以确定胶质母细胞瘤患者是否存在最佳治疗方法。\n\
  \n**广义线性回归**通过使用链接函数将结果变换为正态分布的几何根映射来扩展线性回归，以处理上述结果；大多数类型的结果都适合这一框架，因为它们属于称为**指数族**的结果族。指数族中的分布可以使用几何工具相互映射。\n\
  \n然而，广义线性回归带有与线性回归共同的许多假设：变量的线性独立性、预测变量与结果之间的线性关系，以及误差在预测变量水平上的恒定性（技术上称为同方差），\n\n\
  等等。其中一些假设——尤其是预测变量的独立性——对于时间序列或空间数据不成立。在一个时间点测量的预测变量可能依赖于在先前时间点测量的这些变量的值。在我们的例子中，公共卫生工作者和医生能够及早识别暴发以阻止它的能力在后期的病例率和资源需求中发挥了重要作用（见图\
  \ 13.3）：\n\n![](img/71ff737206f7d80bb625b3c9aca9dc7f_254_0.png)\n\n图 13.3 – 医生和流行病学家追踪暴发源头的示意图\n\
  \nGEE 是一种数学上将广义线性模型变换为涉及多个时间点或数据集中聚类的解决方案。本质上，我们可以使用依赖相关矩阵对时间（或聚类）间的依赖关系进行建模。GEE\
  \ 保留链接函数，使其能够对指数族内的结果进行建模，例如我们各地区每年的埃博拉病例数。\n\n与时间序列或聚类数据的其他广义线性模型扩展相比，这种方法的一个优势是\
  \ GEE 更易于计算。许多其他扩展，例如广义线性混合模型，需要多水平建模，跨水平存在依赖关系。这会产生额外的参数和模型内的依赖关系（产生条件分布）。GEE 不涉及条件分布计算。这使我们能够节省计算成本，即使在模型中包含简单的时序或聚类成分。\n\
  \n那些对广义线性回归和 GEE 的线性代数公式感兴趣的人可以查阅本章末尾的参考文献，以详细了解这些模型以及用于寻找预测因子效应大小的估计量。Nelder（1972）文本非常好地概述了广义线性模型的理论及其计算。Hanley\
  \ 等人（2003）文本提供了 GEE 的线性代数概述以及一个简单的案例研究，读者可以轻松计算估计值。建议希望了解 GEE 背后数学的人先从广义线性模型的数学和计算方法开始，然后再处理从它们派生的模型，例如\
  \ GEE。\n\n现在，让我们回到数据集的构建。\n\n## 我们的问题和 GEE 公式\n\n在我们对刚果民主共和国埃博拉风险随时间和地理变化的公式中，我们将以下列城市之一的每年埃博拉病例数作为结果：\n\
  \n- Mandima\n- Mabalako\n- Kangulata\n- Katwa\n- Butembo\n- Bunia\n- Beni\n\n我们将把这些城市按省份聚类，包括\
  \ Mandima 和 Bunia 在伊图里，Mandima、Mabalako、Kangulata、Katwa、Butembo 和 Beni 在北基伍。接下来，我们将构建城市间的交通网络，并获得每个城市的中介中心性和度中心性。这将为我们提供每年网络中桥梁性和枢纽性的估计。\n\
  \n我们还将包括其他统计数据，包括当年涉及我们城市的暴力事件数量和影响我们城市的自然灾害数量。\n\n对于埃博拉病例数，我们将整合 ebola-epidemic-health-zone-figures.csv\
  \ 人道主义数据交换（HDX）数据集（https://data.humdata.org/dataset/ebola-cases-and-deaths-drc-north-kivu）以包含我们分析感兴趣的城市。为了获得必要的交通信息，我们将在网上搜索城市间的可行路线（骑自行车、公共交通或驾车）。鉴于这是当前数据，我们还将搜索\
  \ 2017-2021 年期间的变化，包括 COVID-19 限制。我们将使用 ReliefWeb 查找提及自然灾害的事件（https://reliefweb.int/disasters?list=Democratic%20of%20the%20Congo%20Disasters&advanced-search=%28C75%29）。\n\
  \n\n\n\n\n整合另一个HDX数据集将提供各地区暴力事件的信息（https://data.humdata.org/dataset/ucdp-data-for-democratic-republic-of-the-congo）。虽然这可能无法涵盖我们研究时段内某个地区的所有信息，但我们应当捕捉重大冲突或灾难。\n\
  \n现在我们有了数据来源，接下来让我们探索数据并进行必要的转换，以便将数据整理成适合作为GEE模型输入的格式。\n\n## 数据转换\n\n在整合数据集的过程中，我们注意到了数据质量方面的一些问题，值得在此提及。在我们关注的时间段内，该地区遭受的自然灾害很少，而且这些灾害分布在地理上很广泛的区域。这一因素不太可能影响埃博拉病毒的传播，但我们仍会将该变量保留在数据集中。\n\
  \n暴力事件的数据来源似乎存在信息缺失，因为已知的针对Katwa地区援助工作者和埃博拉治疗中心的袭击并未包含在数据中。这表明数据来源不完整，可能无法以现实世界分析所需的详细程度来捕捉影响埃博拉传播的暴力事件。然而，就演示本方法而言，这些数据足以在分析中产生潜在有趣的发现。在这类项目中，数据质量可能存在问题，因为在许多发展中国家很难找到可靠的数据来源。\n\
  \n交通路线的搜索也存在问题，虽然能提供一些直达路线的信息，但详细程度并不理想。我们认为，如果两座城市之间通过汽车、公交车或步行所需时间少于10小时，那么任何路线都是可行的。大多数城市都能提供可用的数据；但有些城市没有显示可行的路线，导致我们的交通网络中出现孤立节点。各年份之间的路线没有重大差异（没有新建道路或公交线路的项目），因此我们的网络属性在各年份间不会发生变化。\n\
  \n埃博拉病例数据源可能存在一些错误，因为某些地点的累计病例数有时会随时间推移而减少。鉴于我们希望将结果作为计数数据进行建模，我们倾向于保留每年的正数或零病例总数。在此类疫情中，病例的确定可能很困难，因为实验室确认往往具有挑战性，而且当样本被送往其他城市分析时，通常相当耗时。\n\
  \n因此，我们为该项目收集数据的过程突显了从零开始构建数据集的一些现实挑战，尤其是在那些相对于开源网站而言，数据收集可能不完整或根本不存在数据的地区。通常，考察多个潜在数据源，并整合其信息或选择最佳来源是有利的。在我们的案例中，我们选择了最完整的数据源来构建数据集。\n\
