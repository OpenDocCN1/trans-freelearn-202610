- "# 动态社交网络\n\n在之前的章节中，我们考虑的网络是随时间不变的。它们的几何结构保持不变，在其上计算的传播过程和重要性指标也不会变化。然而，这并不是许多现实世界网络的情况，在这些网络中，新的连接会被建立，旧的连接会断裂。\n\
  \n在本章中，我们将考虑随时间变化的网络，以及这些变化如何影响网络结构和传播过程。例如，在社交网络中，用户可以加入或停用账户。他们与他人内容互动时，联系的强度可能会发生变化。所有这些行为都会推动网络随时间变化，从而影响诸如信息在网络中交换等过程的功能，因为枢纽出现和消失，或桥梁在不同枢纽之间形成。我们将考虑模拟数据和从野生动物观察以及分别在鳄鱼和蓝鹭种群中传播的假设性流行病中收集的试验数据。\n\
  \n在本章结束时，你将了解网络如何随时间变化，以及这些影响对传播过程和网络指标意味着什么。你还将知道如何将动态数据集整理成网络并分析时间切片。这些方法可扩展到更大的人口和更长的时间范围，因此到本章结束时，你将具备按规模处理人口模型的能力。\n\
  \n在本章中，我们将涵盖以下主题：\n- 随时间变化的社交网络\n- 对网络上传播的深入探讨\n- 演化野生动物互动数据集的示例\n\n## 技术要求\n\n\
  在本章中，我们将使用 Jupyter notebook 来运行我们的动态网络示例。你也可以在支持 Jupyter notebook 的云平台上运行此代码，例如\
  \ Amazon Web Services (AWS) 或 Google Cloud Platform (GCP)。我们将使用在笔记本电脑上运行的 Jupyter\
  \ notebook，并且不需要云访问权限即可处理本章中的示例。\n\n## 随时间变化的社交网络\n\n考虑你最亲密的朋友群体。过去一年里，这个群体发生了怎样的变化？过去\
  \ 5 年呢？过去 10 年呢？\n\n许多可以用网络表示的社交关系和其他类型的数据会随时间演化。友谊会随着人们搬家、毕业、结婚、换工作、旅行或去世而疏远和建立。动物会随着季节变化、气候变化以及人类活动侵占放牧地而迁徙。商店的销售模式可能会因该地区的新店、人口流动以及\
  \ COVID-19 或乌克兰冲突等重大世界事件而中断。\n\n在下一节中，我们将探索动态网络，其结构随时间变化。随着网络结构的变化，与信息/疾病流动和网络划分相关的许多重要属性也会随之变化。\n\
  \n### 友谊网络\n\n许多社交网络平台允许友谊群体演化，甚至鼓励结构变化。考虑分享帖子或推文，在你的网络帖子/推文/图片中标记可能尚未认识你的朋友的其他人，并在分享的内容中添加可搜索的主题标签。每项活动都会为你在初始社交网络之外提供更多曝光度，让朋友的朋友、尚未在社交媒体平台上与你建立联系的熟人以及对你的主题帖感兴趣的个人找到你并建立联系。\n\
  \n假设有人在社交媒体平台上发布了一张超现实的捕梦网图像（图 8.1）：\n\n![](img/71ff737206f7d80bb625b3c9aca9dc7f_158_0.png)\n\
  \n图 8.1 – 使用人工智能（AI）创建的捕梦网图像发布到社交媒体平台\n\n也许用户添加了 #AIArt 和 #Dreamcatcher，并标记了一位发布类似内容的朋友，如图\
  \ 8.1 所示。其他平台用户可能会搜索使用 AI 艺术平台创建图像的其他人，并希望关注该用户或点赞/分享内容。这为用户提供了更多连接并扩展了其网络。\n\n\
  被标记的朋友也可能从这些新连接中受益，因为该用户的这些新连接会访问朋友的页面。此外，那位朋友的朋友如果尚未遇到该用户，也可能与该用户建立联系或点赞/分享其内容。这也扩展了用户的网络。\n\
  \n许多社交媒体平台还通过创建兴趣页面或群组来连接用户，在这些页面或群组中，具有相似兴趣的用户可以发布内容、建立联系并讨论主题。例如，许多社交媒体平台提供动物兴趣群组或页面，展示可爱的动物艺术或照片，如图\
  \ 8.2 所示的动物艺术：\n\n![](img/71ff737206f7d80bb625b3c9aca9dc7f_159_0.png)\n\n图 8.2 –\
  \ 一只小象在茶杯中被玫瑰包围的 AI 艺术图像\n\n这些兴趣群组鼓励用户之间的联系以及可搜索内容的分享以扩大群组成员（有时由广告优化算法或其他付费用户鼓励，包括某些情况下的群组本身）。热门内容往往会鼓励群组增长以及群组内用户之间的互动/联系。不受欢迎的内容往往会阻碍增长。\n\
  \n鼓励用户之间建立联系并优化内容传播的算法的阴暗面是阴谋论和错误信息传播的潜力，以及促进种族主义或歧视性群组之间的联系。在 2016 年和 2020 年美国总统选举期间（以及\
  \ COVID-19 大流行期间），错误信息在社交媒体平台上迅速传播。在大流行或国家危机期间，错误信息可能引发公众恐慌，增加资源压力或导致死亡率升高。在政治领域，错误信息可能左右选举结果或加剧不同政治群体之间的分歧。\n\
  \n鼓励社交网络演化以增加点赞数的算法，通过连接可能喜欢其他用户内容或相关广告浏览的用户，可能会无意中导致以下情况：\n- 在可能喜欢或评论它的用户中推广错误信息的传播\n\
  - 鼓励分享错误信息或有害内容的用户之间的联系\n- 在社交网络上形成 perpetuate 这一问题的反馈循环\n\n这可能发生在社交媒体平台以及社区群组、互联网聊天室和其他论坛上。虽然推广更多猫咪表情包可能无害（除去浪费时间看猫咪表情包的可能性），但推广种族主义意识形态或煽动宗教暴力则非常有害。\n\
  \n### 三元闭合\n\n大多数网络演化算法的影响源于一种网络属性，称为 **三元闭合**。社交网络上的三元闭合大致依赖于这样一个前提：用户朋友的朋友在现实生活中可能认识该用户，但尚未建立联系。这是在社交网络中基于直接连接的三元闭合实例。另一个与我们用户的许多朋友共享朋友群体的用户很可能认识该用户（或基于共享的社交网络，是该用户的良好联系）。此外，其他用户可能与该用户共享许多兴趣（许多好友推荐算法的前提）；这是基于元数据的三元闭合实例，其中连接形成取决于用户元数据的相似性而非共享连接。\n\
  \n考虑 Pieter、Kwame 和 Pablo。三人都喜欢足球、软件工程和徒步旅行。Pablo 和 Pieter 相识，Pieter 和 Kwame 也相识；然而，我们不知道\
  \ Kwame 和 Pablo 是否相识（图 8.3）：\n\n![](img/71ff737206f7d80bb625b3c9aca9dc7f_161_0.png)\n\
  \n![](img/71ff737206f7d80bb625b3c9aca9dc7f_161_1.png)\n\n![](img/71ff737206f7d80bb625b3c9aca9dc7f_161_2.png)\n\
  \n图 8.3 – 我们三位足球迷之间已知关系的图示\n\n鉴于已知的两个关系以及共享的兴趣元数据，很可能 Kwame 和 Pablo 也相互认识（或如果建立联系会相处融洽）。网络上开放三元组的百分比衡量了网络整体的三元开放性。开放三元组比例高的网络在随时间演化方面具有高潜力，因为朋友的朋友或具有相似兴趣的个人会通过共享内容或群组成员身份建立联系。现在我们对关系及其如何随时间演化有了更多的了解，让我们更深入地探讨演化网络上的传播过程。\n\
  \n## 对网络上传播的深入探讨\n\n现在我们了解了网络如何随时间变化，让我们看看如何在 Python 中表示这些网络并计算随时间在动态网络上进行的传播过程，例如流行病模型。Python\
  \ 提供了多个工具来帮助我们可视化和分析动态网络，正如我们在前几章中所做的那样。让我们开始吧。\n\n## 动态网络介绍\n\n我们可以通过在不同时间点跟踪连接来跟踪网络随时间的演变。让我们考虑一群狮子，其中个体在一天中定期互动。图\
  \ 8.4 显示了此示例网络，并带有时间戳以跟踪边：\n\n\n\n![](img/71ff737206f7d80bb625b3c9aca9dc7f_162_0.png)\n\
  \n*Figure 8.4* 显示了一个具有随时间信息标记的演化边和顶点结构的动态狮子网络示例。Python 提供了一个便捷的包来创建此类网络。`NDLib`\
  \ 包利用 `Dynetx` 来建模时变图，它利用了 `DyNetx` 中的几个关键原语来创建和分析动态网络。这为在现实世界中处理动态网络提供了一个强大的框架。这在流行病学、社会网络分析和交通系统等领域尤其有价值，因为理解时间动态至关重要。让我们通过使用\
  \ *Script 8.1* 创建 *Figure 8.4* 来探索这个包：\n\n```\n```python\n#create Figure 8.4\n#import\
  \ packages\n#install dynetx if needed\n#!pip install dynetx\nimport dynetx as dn\n\
  import networkx as nx\nimport matplotlib.pyplot as plt\n#create an empty graph\n\
  g = dn.DynGraph()\n#add vertices and edges with time information added\n\n#adding\
  \ the edge (\"D\",\"E\") at t=0 that vanishes at time e=2\ng.add_interaction(u=\"\
  D\", v=\"E\", t=0, e=2)\n\n# adding some edges at time t=1\ng.add_interactions_from([(\"\
  C\", \"F\"), (\"F\", \"E\")], t=1)\n```\n```\n\n在每个时间点了解边结构对于评估网络结构和促进网络上流动的属性至关重要，例如枢纽和桥梁。可视化和边列表也为我们提供了一种汇总信息的方式，这可能会为例如小群体中的流行病提供额外的见解。离开我们的狮子示例，让我们考虑在新疾病爆发期间办公室环境中的徽章追踪，例如\
  \ COVID-19。不同个体在不同天会与不同的人以及不同数量的人互动，这取决于他们的时间安排。存在于不同时间点的边列表以及员工之间互动的可视化可以帮助研究人员追踪新的爆发并计算重要的流行病模型参数，以了解该疾病对更大人群的潜在影响。\n\
  \n正如个体之间的连接会随时间变化一样，网络中的个体本身也可能发生变化。也许某位员工因病请假或请个人假，从而在该时间点退出网络。使用 DyNetx，我们还可以创建一个交互网络来模拟动态结构，其中顶点和边都可以在时间演化过程中出现和消失。回到\
  \ Figure 8.4，让我们扩展 Script 8.1 以创建以下交互流：\n\n```\n#print interaction stream\nfor i\
  \ in g.stream_interactions():\n    print(i)\n```\n\n此脚本为每个时间点创建一个交互列表，指定网络中存在的交互。虽然我们没有个体狮子进入或离开我们的网络，但狮子之间的互动确实会发生变化，并且狮子在给定时间点可能与网络中的其他狮子有或没有互动。让我们进一步查看输出，看看哪些时间点涉及网络狮子之间最多的和最少的互动：\n\
  \n```\n#output of interactions for each time point\n('D', 'E', '+', 0)\n('C', 'F',\
  \ '+', 1)\n('F', 'E', '+', 1)\n('D', 'E', '-', 2)\n('B', 'E', '+', 2)\n('A', 'B',\
  \ '+', 2)\n('B', 'C', '+', 3)\n('C', 'D', '+', 3)\n('A', 'C', '+', 4)\n```\n\n前两个值指定参与边的顶点。第三个值指定边操作的类型，其中\
  \ '+' 表示出现（边创建），'-' 表示消失（边移除）。最后一个值表示与边操作相关的时间戳。例如，我们可以看到狮子 F 在时间点 1 在网络内建立了多次互动。我们也可以看到狮子\
  \ D 和 E 之间的互动始于第 0 个时间点，并在时间点 2 停止。\n\n对于技术性更强的读者，我们可以将这些术语排列起来定义一个控制易感人群中传播和恢复的微分方程组，如下所示：\n\
  \n\\(\\frac{dS}{dt} = -\\frac{\\beta IS}{N}\\)\n\\(\\frac{dI}{dt} = \\frac{\\beta\
  \ IS}{N} - \\gamma I\\)\n\\(\\frac{dR}{dt} = \\gamma I\\)\n\n高传播率加上低恢复率会导致大量感染人群。低传播率和高恢复率会导致人群中流行病缓慢或逐渐消失。\n\
  \n然而，人群内的互动很少是随机的，就像 SIR 方程所假设的那样。动态网络提供了一种捕捉随时间变化的互动的方法，从而更准确地模拟感兴趣人群内的传播，或通过模拟感兴趣人群内的互动水平模型实现更准确的规划。让我们在第\
  \ 3 章关于流行病的讨论基础上，通过引入一些影响流行病传播的新网络指标来继续。\n\n## 影响传播的因素\n\n在第 3 章中，我们研究了桥梁和枢纽对音乐趋势或流行病在网络中传播的重要性。此后，我们考虑了许多与枢纽和桥梁概念相关的网络中心性指标。让我们简要回顾其中几个中心性指标。\n\
  \n枢纽性可以通过以下几个中心性指标来评估，包括：\n\n- Degree centrality (defined in Chapter 6)\n- PageRank\
  \ centrality (defined in Chapter 6)\n- Hubness centrality (defined in Chapter 6)\n\
  \n度中心性是最简单且与网络上传播过程最相关的。感染顶点与其他顶点的连接数量会影响感染顶点将其疾病传播给其直接邻居的能力。网络中度中心性的组合影响疾病在全球传播的整体能力。度中心性非常低的稀疏网络不会为疾病同时感染许多个体提供机会，导致公共卫生工作者能够在不被某一时间点大量感染患者压垮的情况下有效地实施隔离和接触追踪等策略。\n\
  \n然而，度中心性非常高的网络可能包含许多枢纽或一个大型枢纽。大型枢纽使一个感染个体能够将疾病传播给许多其他人，而这些人也有许多可以被感染的联系。这意味着在流行病开始时公共卫生资源很容易不堪重负，在许多人被感染之前遏制此类流行病的机会非常低。我们在\
  \ COVID-19 期间的许多全球城市中看到了这一点，城市范围的停摆变得必要以避免压垮医疗系统；农村地区没有经历我们在大城市中看到的感染率的快速飙升。\n\n\
  桥梁在网络上的流行病建模中也发挥着重要作用。如果两个大型枢纽未连接，则很容易将一个枢纽与另一个枢纽隔离，以阻止流行病从一个枢纽传播到另一个枢纽，因为我们只需确保在感染枢纽中的流行病结束之前两个枢纽之间不建立桥梁即可。连接两个枢纽的桥梁为桥梁顶点/顶点提供了被感染并将感染从一个社区传播到另一个社区的机会。因此，桥梁为感染传播提供了机会，使其成为区域或全球问题而非当地社区问题。\n\
  \n回想一下，桥接属性可以通过 **betweenness centrality**（在 *Chapter 6* 中定义）来衡量，它衡量通过一个顶点的网络最短路径数量。本质上，这衡量了每个顶点对网络上传播过程的重要性。具有高介数中心性的顶点代表如果该顶点被感染，则将其疾病传播到人群其他部分的很大机会。隔离或为具有高介数中心性的顶点接种疫苗可以破坏网络上的疾病传播，并且这些个体代表了在有限资源下对整体流行病严重程度产生重大影响的机会。在\
  \ COVID-19 的背景下，频繁的国际旅行者充当了国家之间的桥梁。停止从受感染地区到尚未受影响地区的国际旅行使加勒比岛屿等小国能够避免其人群的流行病传播。\n\
  \n**Forman-Ricci curvature centrality**（在 *Chapter 6* 中定义）通过考虑通过一组顶点连接的其他边的边来同时考虑网络中的桥接属性和枢纽属性。最近的研究表明，Forman-Ricci\
  \ 曲率可以找到对传播过程重要的边和顶点，因此可作为在流行病模拟中顶点被隔离或以其他方式从人群中移除（例如通过疫苗接种）时使用的有效指标。\n\n**Eccentricity**，即图中一个顶点到另一个顶点的最大距离，是衡量流行病在人群层面的潜在影响的另一个常用指标。网络的\
  \ **radius** 是网络顶点中最小的偏心值，而网络的 **diameter** 是网络顶点中最大的偏心值。密集网络的直径小于稀疏网络，因为顶点往往更相互连接（允许在更短的时间内具有更大的传播潜力）。\n\
  \n半径和直径都限制了微分方程（例如我们的 SIR 模型）在网络上的行为。虽然理论证明超出了本书的范围，但我们将在下一节中通过对两个野生动物流行病数据集的真实模拟来实践探索半径和直径。让我们开始探索我们的数据集。\n\
  \n\n\n\n\n## 示例：不断演化的野生动物互动数据集\n\n我们在短时间内收集了两个关于种内野生动物互动（涉及同种动物之间的互动）的数据集。\n\n第一个数据集包含对南佛罗里达泻湖中4条鳄鱼的观察，在冷锋经过该地区后，促使更多鳄鱼寻找阳光充足的岸边，我们在12个时间段内以15分钟为间隔记录了这些鳄鱼。鳄鱼之间的社交互动被定义为在单个15分钟内发生互动的动物。每15分钟记录一次连接，从而形成跨越12个时间段的鳄鱼社交互动动态网络。\n\
  \n第二个数据集包含对南佛罗里达泻湖中7只蓝鹭在一群洄游鱼形成的饵球上方互动的观察，我们在10个时间段内以5分钟为间隔进行了记录。蓝鹭之间的互动被定义为占据饵球上方同一立方米空间的鹭。每5分钟记录一次连接，从而形成跨越10个时间段的蓝鹭社交互动动态网络。这些鹭最初被分成两个筑巢群落，一个群落有2只鹭，另一个群落有5只鹭。\n\
  \n让我们从检查鳄鱼网络数据集上的流行病动力学和中心性指标开始。\n\n## 鳄鱼网络\n\n我们首先来看鳄鱼网络，其中4条鳄鱼在3小时内进行互动。脚本8.2加载相关包并随时间创建我们的初始网络集合：\n\
