  \n让我们考虑一种流行病，它始于一条鳄鱼被感染，其感染率（`beta = 0.3`）相对于恢复率（`gamma = 0.05`）较高。这对应于一种中等传染性的疾病在鳄鱼种群中传播，并导致较长的感染期。鳄鱼痘就是其中一种可导致幼鳄死亡的疾病。受感染的动物往往在数周或数月内表现出症状。细胞感染往往发生迅速，潜伏期短（以分钟计）。虽然感染率和恢复率的确切参数尚不清楚，但这些估计值是感染的良好近似值。让我们向`脚本8.2`中添加代码，以模拟鳄鱼痘在鳄鱼种群中随着它们跨12个时间段互动而传播的情况：\n\
