- "# Introduction to Bayesian networks and causal pathways\n\n许多行业中感兴趣的结果都涉及一系列事件或选择以达到感兴趣的结果。包裹的到达取决于包裹在运输和到达之间每个中继点的安全到达。机械故障可能涉及单点故障（SPOF）或故障级联，其中机器的多个部件在机器本身故障之前发生故障。\n\
  \n考虑导致药物成瘾的路径。首先，一个人必须处于药物使用发生的环境中——通过朋友、通过家庭或通过新的社交群体。然后，一个人必须尝试一种成瘾物质。然后，他们必须足够喜欢这种物质以继续频繁使用这种物质，直到达到对药物的身体或心理依赖的程度。图\
  \ 10.1 以图表格式显示了这一系列步骤：\n\n![](img/71ff737206f7d80bb625b3c9aca9dc7f_202_0.png)\n\n\
  图 10.1 – 导致药物成瘾的一系列事件的逐步进展\n\n图 10.1 看起来很像一个有向网络，其中每个情况是一个顶点，每个路径中的步骤是一个有向边。表示进展步骤的每条边可能由从一个顶点到下一个顶点的进展概率加权。让我们考虑一个青少年群体，他们有很高的风险尝试一种新型药物，以及研究人员收集的关于每个使用阶段人群的横截面数据，以确定每个步骤的风险。假设所有青少年都处于可能尝试药物的环境中，但只有\
  \ 30% 的能够尝试的人实际上会尝试。尝试过药物的人中，只有 20% 足够喜欢它以继续使用药物。然而，在继续使用的人中，40% 会对药物产生依赖。图 10.2\
  \ 总结了这些信息：\n\n![](img/71ff737206f7d80bb625b3c9aca9dc7f_202_1.png)\n\n图 10.2 – 导致药物成瘾的路径以及路径中每个步骤的转换概率\n\
  \n图 10.2 显示了药物使用在不同使用阶段进展时的概率链。我们可以通过将给定阶段之前每个步骤的转换概率相乘来找到达到每个阶段的概率。例如，在这个人群中，规律使用涉及尝试药物（有\
  \ 30% 的机会这样做）和开始规律使用（有 20% 的机会这样做）；这意味着该人群中青少年规律使用这种新药物的几率为 6%（0.3 乘以 0.2）。鉴于这些规律使用这种新药物的青少年中有\
  \ 40% 最终对其产生依赖，我们预计该人群中任何一个青少年在有利于尝试药物的环境下，进展到对新药物产生依赖的几率为 2.4%。\n\n数学为我们提供了一种正式的方法来研究这些路径或从一组数据中构建它们。让我们转向我们需要形式化这一跨事件序列概率直觉的数学工具。\n\
  \n## Bayes’ Theorem\n\n依赖于其他事件的事件的概率称为 **条件概率**。在概率论中，条件概率是衡量在另一个事件已经发生的情况下某事件发生的概率。在图\
  \ 10.2 中，进展到药物依赖依赖于规律使用新型药物，而这又依赖于首次尝试药物，而这又依赖于处于人们使用药物的环境中。虽然条件概率不需要涉及这么多条件步骤，但它确实涉及一个先前事件，该事件影响感兴趣事件发生的概率。\n\
  \n回到图 10.2 中的例子，我们有一个青少年接触药物使用的宇宙，如图 10.3 中的矩形所示：\n\n![](img/71ff737206f7d80bb625b3c9aca9dc7f_203_0.png)\n\
  \n\n\n\n\nFigure 10.3 显示了我们青少年群体中 100% 发生的事件；他们所有人都在家中、在学校或与朋友在一起时接触到这种新药。然而，在一个更小的宇宙中（如图\
  \ 10.4 所示），尝试这种新药的事件只发生在 30% 的时间内：\n\n![](img/71ff737206f7d80bb625b3c9aca9dc7f_204_0.png)\n\
  \nFigure 10.4 – 在我们最初的接触药物使用的宇宙中尝试药物的新宇宙\n\nFigure 10.4 显示了一个新宇宙，其中一部分青少年尝试了这种新药。在这些青少年中，20%\
  \ 会定期使用这种药物。这形成了一个新宇宙，如图 10.5 所示：\n\n![](img/71ff737206f7d80bb625b3c9aca9dc7f_204_1.png)\n\
  \nFigure 10.5 – 包含定期使用新药的青少年的更小宇宙\n\nFigure 10.5 显示的青少年宇宙与最初所有有尝试这种新药风险的青少年宇宙相比非常小（正如我们所预期的那样，因为该人群中只有\
  \ 6% 的青少年最终会定期使用这种新药）。在定期使用新药的人群中，我们可以再次对图 10.5 所示的宇宙进行划分，以获得对药物产生依赖的青少年集合。我们不会可视化这个宇宙，因为它太小，无法在定期使用药物的较小的矩形内很好地可视化。\n\
  \n**Bayes’ Theorem** 提供了一种通过将先验事件的概率与感兴趣的事件联系起来来计算条件概率的公式。我们可以通过以下公式计算事件 *A* 在事件\
  \ *B* 发生的条件下发生的概率：\n\nP(A | B) = (P(A) * P(B | A)) / P(B)\n\n这里，*P(A|B)* 是在事件 *B*\
  \ 发生的情况下事件 *A* 发生的概率，*P(A)* 是事件 *A* 发生的概率，*P(B|A)* 是在事件 *A* 发生的情况下事件 *B* 发生的概率，而\
  \ *P(B)* 是事件 *B* 发生的概率。\n\n为了更具体地说明，让我们回到我们的药物使用示例。我们将事件 *A* 称为尝试新药，事件 *B* 称为身处药物被使用的场所。事件\
  \ *B* 的概率为 100%，事件 *A* 发生时事件 *B* 的概率也是 100%。事件 *A* 的概率为 30%。让我们将这些值代入公式：\n\nP(A\
  \ | B) = (0.3 * 1) / 1\n\n这给出了我们预期的 30%。然而，在概率论中，并非所有事件的概率都是 100%，并且随着条件事件的增加，许多计算会变得更加复杂。在现实世界的数据中，我们可能需要根据收集到的数据使用算法来估计这些概率。让我们继续讨论事件链，例如我们的药物使用示例。\n\
  \n## Causal pathways\n\n条件概率可能涉及不止两个具有条件关系的感兴趣事件。**Causal pathways** 涉及条件概率链，可以像我们的药物依赖示例那样相对较短，也可以像导致疾病风险的蛋白质激活途径那样非常、非常长且复杂。\n\
  \n得益于 Bayes’ Theorem，我们可以将条件概率以分段的方式串联起来，直到所有条件概率都链接到最终的途径中。这对于估计众所周知的因果途径的效果大小和进展速率非常有效。然而，很多时候，我们并不知道导致感兴趣结果的确切事件序列，只是收集了大量我们认为与结果相关的数据。要分析这些数据，我们需要一个算法。幸运的是，已经存在这样一个算法。让我们深入探讨贝叶斯网络及其在因果途径挖掘中的应用。\n\
  \n## Bayesian networks\n\n**Bayesian network** 将一组变量及其条件概率描绘为 **directed acyclic\
  \ graph (DAG)**。未被边连接的顶点是条件独立的（彼此不依赖）。被边连接的顶点是条件依赖的。\n\n**chain rule of probability**\
  \ 允许我们将贝叶斯网络构建为条件概率的乘积。考虑事件 *A*、*B* 和 *C*。回到我们的药物使用示例，事件 *A* 可能是规律使用，事件 *B* 是尝试药物，事件\
  \ *C* 可能是身处药物环境。我们的因果链因此如下：\n\n$$P(A, B, C) = P(A \\mid B, C) * P(B \\mid C) * P(C)$$\n\
  \n*P(A, B, C)* 指的是所有事件同时发生的概率。*P(A|B, C)* 指的是在 *B* 和 *C* 已发生的情况下 *A* 发生的概率。*P(B|C)*\
  \ 是在 *C* 发生的情况下 *B* 发生的概率。因为这些事件通常是从数据中推断出来的，所以我们需要使用算法来估计联合概率分布 *P(A,B,C)*。通常，这是通过期望值计算使用期望最大化算法来完成的，该计算基于数据条件下的期望值。然后，算法在假设计算出的期望值是正确的情况下最大化完整似然。然后根据上一步计算的似然再次调整值。一旦期望值和似然收敛，算法就会停止。\n\
  \n现在我们知道了贝叶斯网络的基础知识，让我们转向一个教育数据示例，展示因果途径以及贝叶斯网络可以从中学习的数据集。\n\n## Educational pathway\
  \ example\n\n贝叶斯概率和网络在教育研究中的常见用途之一。课程排序建立在先前知识之上，学生在先前知识条件下修读课程，必须先获得该先前知识，然后才能在当前课程中取得成功。先修课程允许教授要求学生在修读他们的课程之前先修读某些课程。进入大学然后进入研究生项目的资格取决于在上一教育阶段成功完成考试。因此，教育是一个贝叶斯网络自然出现的领域。让我们深入探讨一个示例。\n\
  \n## Outcomes in education\n\n教育中的许多结果都是学生所修课程长序列的 culmination。例如，在南非和美国，希望从事法律实践的学生必须修读许多课程并通过最终考试后才能独立执业。通过考试依赖于课程学习的先前成功以及在实习和其他实践法律活动中获得的经验。大多数医学学位遵循类似的教育方法，课程学习、实践经验和最终考试的结合最终导致在该领域的专业地位。\n\
  \n了解这些途径中的关键里程碑和转折点可确保尽可能多的学生通过最终考试获得执照。然而，存在许多课程，并非所有学生在整个教育过程中都修读相同的课程。医学生可能会专注于与他们感兴趣的医学亚专业最相关的课程。法学生可能会在不同的法律实践分支中实习，以了解他们可能喜欢从事的法律类型。因此，数据通常是不完整的；加上项目规模小，这造成了困难的数据挖掘场景。\n\
  \n- 2. 我们将向 Script 10.1 添加最后两门课程以及最终考试的依赖表现：\n\n```\n#create two other courses that\
  \ are not related to performance on\n#final exam\ncourse4=np.random.binomial(1,0.8,200)\n\
  course5=np.random.binomial(1,0.85,200)\n\n#create final exam passage rates\npassa=np.random.binomial(1,0.95,200)\n\
  passb=np.random.binomial(1,0.75,200)\npass_final=np.where(course1+course2+course3>2,\n\
  \    passa,passb)\n```\n\n- 3. 现在我们有了课程通过/失败表现的数据，我们可以创建一个包含这些数据的数据框，以便传递到使用贝叶斯网络的途径挖掘中。让我们将这部分添加到\
  \ Script 10.1 以准备我们的途径挖掘：\n\n```\nCourse_Data=pd.DataFrame([course1, course2, course3,\n\
  \    course4, course5, pass_final],\n    index=['Course_1', 'Course_2', 'Course_3',\n\
  \    'Course_4', 'Course_5',\n    'Pass_Final_Exam']).transpose()\n```\n\n现在我们有了数据集，我们可以把注意力转向我们将创建的贝叶斯网络。\n\
  \n## bnlearn analysis\n\nPython 有一个易于使用的包，可以将贝叶斯网络拟合到像我们在 Script 10.1 中生成的数据集上：bnlearn\
  \ 包。如果您尚未安装当前版本的 numpy，则需要在安装 bnlearn 包之前更新 numpy 版本以避免安装错误。我们假设您已完成此步骤。请按照以下步骤操作：\n\
  \n> Note\n> 还有一个 pandas 依赖项，因此我们将在以下代码中提供安装特定版本包的示例来处理 pandas 版本依赖项。您需要在安装后重新启动\
  \ Jupyter 内核。\n\n- 1. 首先，我们将安装 bnlearn 包并使用 Script 10.2 加载它：\n\n```\n#install bnlearn\
  \ package if not already in directory and import\n!pip install pandas==1.5.3\n!pip\
  \ install bnlearn\nimport bnlearn as bn\n```\n\n\n\n\n\n我们确实发现了模拟的几个依赖关系。发现Course_2依赖于Course_1，期末考试表现依赖于Course_1、Course_2和Course_3。虽然这并非100%准确，但我们确实发现所有四个依赖关系都处于因果路径中。\n\
  \n- 4. 通过添加到脚本10.2中，我们可以将分析中发现的DAG可视化：\n\n```\n#plot Bayesian network derived from\
  \ dataset\nbn.plot(model)\n```\n\n该图应显示类似图10.7的内容，展示我们模拟的四个相关变量存在于课程成功路径中：\n\n![](img/71ff737206f7d80bb625b3c9aca9dc7f_211_0.png)\n\
  \n图10.7 – 贝叶斯网络结果图\n\n对于我们用条件分布和随机分布模拟的小数据集而言，我们的结果相当不错。然而，贝叶斯网络对拟合所用的算法非常敏感。让我们使用穷举搜索重新运行分析，该搜索对所有可能的贝叶斯网络结构进行评分以选择最佳模型，而不是使用爬山算法。请注意，由于拟合该模型所需的计算时间和算力增加，不建议将其用作大型数据集或包含许多待探索变量的数据集的拟合算法。\n\
  \n> 注意\n> 取决于你的系统，以下脚本可能在你系统上运行完成，也可能无法运行完成。在我们的机器上，以下脚本运行了一个多小时。\n\n脚本10.3将对这三门课程运行新的贝叶斯网络拟合，这些课程被设计为依赖于先前课程的成绩：\n\
  \n```\n#fit Bayesian network\nmodel = bn.structure_learning.fit(Course_Data,methodtype='ex')\n\
  ```\n\n现在，通过向脚本10.3中添加以下内容，我们可以检查贝叶斯网络发现的关系表，如图10.8所示：\n\n```\n#print dependencies\n\
  print(model['adjmat'])\n```\n\n| 来源 | Course_1 | Course_2 | Course_3 |\n|--------|----------|----------|----------|\n\
  | Course_1 | False | True | True |\n| Course_2 | False | False | True |\n| Course_3\
  \ | False | False | False |\n\n图10.8 – 我们模拟的三门课程之间依赖关系的贝叶斯网络表\n\n图10.8显示，这种穷举搜索算法确实发现所有三门课程都存在依赖关系，并且这些依赖的方向性也是正确的——通过Course_2依赖于通过Course_1，通过Course_3依赖于通过Course_1和Course_2。\n\
  \n现在，让我们通过向脚本10.3中添加以下内容，用贝叶斯网络的图形表示来可视化这些结果：\n\n```\n#plot Bayesian network derived\
  \ from dataset\nbn.plot(model)\n```\n\n这将产生如图10.9所示的输出，显示了三门课程之间发现的依赖关系。请注意图10.6中的方向性与我们在数据集中模拟的依赖关系一致：\n\
  \nbnlearn 有向无环图（DAG）\n\n![](img/71ff737206f7d80bb625b3c9aca9dc7f_213_0.png)\n\n\
  图10.9 – 模拟为具有相互依赖关系的三门课程之间的课程通过依赖关系图\n\n请注意，虽然穷举搜索找到了正确的因果路径，但对于大多数现实世界的问题来说，它并不实用，因为其运行时间限制使其只能用于变量较少的数据集。即使对于我们的完整数据集，使用穷举搜索计算贝叶斯网络的运行时间也不切实际。然而，贪婪爬山算法足以解析我们的数据并发现数据集中可能存在的关联。在现实世界中，挖掘路径通常只是理解系统的第一步。识别主要组成部分通常足以支持后续步骤，我们将在接下来讨论这些步骤。\n\
  \n### 结构方程模型\n\n一旦我们对路径中哪些部分可能导致感兴趣的结果有了概念，我们就可以针对这些部分之间的逻辑步骤形成假设。例如，在我们的课程示例中，我们可能知道大多数学生先修Course_1再修Course_2，先修Course_2再修Course_3。这导致一个假设：Course_1影响Course_2和Course_3的成绩，Course_2影响Course_3的成绩。假设这三门课程都会影响执业考试的成绩。这就给出了图10.10所示的假设路径：\n\
  \nWise, R. A., & Koob, G. F. (2014). 药物成瘾的发展与维持。*神经心理药理学，39*(2)，254–262。\n\nWu,\
  \ W., Garcia, K., Chandrahas, S., Siddiqui, A., Baronia, R., & Ibrahim, Y. (2021).\
  \ USMLE Step 1考试成绩的预测因素。*西南呼吸与重症监护纪事，9*(39)，63–72。\n"
- "# 映射语言家族——一种本体论方法\n\n在本章中，我们将探索一个重要的科学领域——语言学。**语言学**是对语言的研究，包括词汇使用模式、语法演变以及语言的社会建构。我们将探索**本体论**，它通过定义的关系将诸如词语等概念相互关联，并构建**语言家族**，其中同一家族的语言在时间和地理上相互关联。\n\
  \n网络科学为我们提供了总结和比较本体论与语言家族的工具，以研究假设的相似性和差异性。我们将在本章末尾量化假设的语言家族之间的差异，尽管该方法也可应用于本体论或源于语言学研究的任何其他基于网络的结构。\n\
  \n在本章中，我们将涵盖以下主题：\n\n- 什么是本体论？\n- 语言家族\n- 映射语言家族\n\n到本章结束时，你将了解语言相关分析中使用的某些基本工具，并能够比较不同网络以理解它们之间的关键差异。由于这些工具具有良好的扩展性，你将能够处理非常大的本体论。\n\
  \n## 技术要求\n\n你需要 Jupyter Notebook 来运行本章的实际示例。\n\n本章代码可从此处获取：`https://github.com/PacktPublishing/Modern-Graph-Theory-Algorithms-with-Python`\n\
  \n## 什么是本体论？\n\n在本节中，我们将学习本体论以及它们如何被表示和存储为网络。虽然本章侧重于语言本体论，但还存在许多其他类型的本体论，包括基因本体论，本节将简要回顾以作为引子。\n\
  \n## 本体论简介\n\n如本章引言所述，本体论是一组通过某种属性相关联的概念。通常，它们用于在特定学科内组织知识。让我们用一个例子使这一点更具体。由于遗传学中的示例在本体论研究中更为常用，我们将在处理语言学之前先通过一个生物学示例建立直觉。\n\
  \n假设我们有五个基因位于调控动物毒液中所含酶或多肽产生的调控通路中。通常，环境条件和地理因素会通过调节毒腺内的基因转录，影响毒液中活性化合物的比例，即使在同一种物种内也是如此。在我们开始收集这些基因及其对毒液产生影响的信息之前，我们只是拥有一组基因，如*图11.1*所示：\n\
  \n![](img/71ff737206f7d80bb625b3c9aca9dc7f_218_0.png)\n\n图11.1 – 参与调控毒液产生的五个基因集合\n\
  \n为了更好地理解*图11.1*中的基因，我们可能会在不同的环境条件下进行实验，以开启和关闭基因，并阐明它们之间的相互关系——即该调控通路中存在的依赖关系。相互依赖可以通过连接这些基因顶点中的每一个的边来表示。假设我们进行了几次实验并发现了以下关系：\n\
  \n![](img/71ff737206f7d80bb625b3c9aca9dc7f_219_0.png)\n\n图11.2 – 表示调控毒液产生的基因之间关系的本体论\n\
  \n图11.2显示所有其他四个基因都在Gene 1的下游，表明该基因对动物毒液中关键化合物的调控至关重要。Gene 1的突变可能导致功能丧失（并可能危及动物）。将该本体论可视化为网络，使我们能够轻松定位所研究系统中的关键信息。\n\
  \n然而，许多生物的基因调控通路比这个例子大得多，在实践中很难可视化——尤其是完整的基因本体论，其中生物体的全套基因被映射并通过功能通路连接。这意味着我们需要使用网络分析工具来研究所提出的基因调控通路之间的差异，或比较表现出相同功能的不同生物体之间的基因调控通路。例如，在我们的毒液示例中，我们可能感兴趣的是绘制一种海蛇（眼镜蛇科成员）的完整基因本体论，并将其完整基因本体论与另一种眼镜蛇科物种（如太攀蛇或黑曼巴）进行比较。这些物种可能拥有多达12,000个基因，从而产生一个非常大的本体论比较问题。\n\
  \n让我们回到对语言学的关注上，看看与语言相关的本体论是如何构建的，以及如何用于研究方言、皮钦语或社会经济群体之间的语言差异——或者仅仅是为了理解一种语言的结构和功能。\n\
  \n考虑英语中的两个词：go 和 went。这两个词都是动词。就句子的主语而言，两者具有相同的语义。然而，一个是现在时，另一个是过去时。所有这些信息都帮助我们理解这些词在英语中的功能。我们可以将这些关系映射到每个词的网络结构中，如图11.3所总结：\n\
  \n\n\n![](img/71ff737206f7d80bb625b3c9aca9dc7f_220_0.png)\n\n图 11.3 – 展示词语 “go”\
  \ 和 “went” 的语言学属性的两个网络\n\n图 11.3 总结了我们两个词的语言学属性：go 和 went。想象一下为英语中的每个词都创建这样的网络。我们将拥有非常多的网络来映射语言学属性与词语，并且很容易丢失重要的网络。我们在图集合中搜索感兴趣的词语或属性时也会消耗大量计算资源。让我们进一步探索本体创建。\n\
  \n## 将信息表示为本体\n\n要创建本体，我们需要定义感兴趣的概念/词语/术语以及它们可能共享的属性。在我们的图 11.3 示例中，我们有一组具有感兴趣的语言学属性的词语。一旦我们定义了这两个集合（在图\
  \ 11.3 的示例中分别为词语和语言学属性），我们就可以在这两个集合之间创建映射（图 11.3 中显示的线条）。我们的词语示例是一个非常小的示例，不过。很多时候，这些集合中的每一个都可能包含数千甚至数万个项目。\n\
  \n为了处理这些更大的信息集合以及它们之间可能存在的关系，我们需要一种系统的方法来存储这两个集合及其关系。我们还需要很多人来创建这个非常大的本体，最好有一种方式让所有参与创建本体的人之间共享信息。这就是数据库发挥作用的地方。\n\
  \n**本体网络语言（OWL）** 数据库系统组织像图 11.3 中所示的知识网络。每个词语、术语或概念在数据库中占据一行，并映射到本体中与该词语/术语/概念匹配的感兴趣属性，从而创建一种数据库的数据库，用于存储词语/术语/概念数据以及它们与本体中感兴趣的关键属性的关系。从这个数据库中，我们可以搜索信息、可视化感兴趣的关系，并挖掘整个本体以寻找总体主题。\n\
  \n任何类型的知识都可以组织在 OWL 数据库中。例如，我们可以使用 OWL 数据库来组织关于动物分类学或进化遗传学的知识，以便根据遗传分析结果快速搜索不同拟水蛇物种之间的关系。我们还可以组织医学术语，为医生创建一个易于使用的查询系统，以便在遇到超出其专业领域的症状或疾病时促进患者诊断。我们甚至可以组织关于长篇小说中人物关系的知识，为《*战争与和平*》这样的书籍提供学习指南。\n\
  \n现在我们知道了关于本体及其存储系统的基础知识，让我们把注意力转回语言学，在那里我们可能希望研究语言家族中语言的演变。\n\n## 语言家族\n\n**语言家族**\
  \ 是具有共同祖先并通常在相关地理区域内演化的语言群。例如，罗曼语族由在南欧地区从通俗拉丁语（晚期拉丁语）演化而来的语言组成。尼罗-撒哈拉语族在努比亚王国时期在尼罗河三角洲演化。今天大约有\
  \ 150 个语言家族被归入主要语言家族，外加几个**语言孤立**，它们与其他语言没有关系（例如澳大利亚的 Tiwi）。语言孤立没有与其它语言相连的遗传祖先。Campbell\
  \ 给出了七个主要语言家族（每大洲一个），尽管其他研究人员将主要语言家族归类为其他语言组。\n\n## 语言漂移和关系\n\n语言家族的出现是因为不同遗传祖先语言的人群地理上隔离到足以使祖先语言在区域内演化。随着语言的演化，词语可能会改变。发音可能会改变。语法可能会演化。在许多英语\
  \ **皮钦语**（两种或多种语言的混合，包括本例中的英语）中，英语与当地语言混合形成了保留英语部分语法和用法的混合语言，同时也包含当地语言。在尼日利亚英语皮钦语中，英语与当地语言如伊博语、豪萨语或约鲁巴语混合。例如，“How\
  \ are you?” 变为 “How na?” 而 “Please come join me for a meal” 变为 “Abeg come chop food.”\n\
  \n随着时间的推移，皮钦语可能会演化到成为完全独立的语言（英语的后代，就像中古英语从古英语演化而来一样，同时其他语言影响了古英语）或仍保持为母语（本例中为英语）的皮钦语。当语言演化时，它就成为母语的一个子分支。就英语而言，其在商业和学校系统中的广泛使用表明，随着时间的推移，许多子语言将发展为具有不同词汇和语法的独立语言。鉴于尼日利亚皮钦语的广泛使用，尼日利亚英语子语言很可能是未来一两个世纪内最有可能发展的子语言。\n\
  \n有几个驱动因素往往有利于语言演化为子语言或皮钦语。不同国家或地区之间因语言不重叠而产生的商业往来需要交流手段。皮钦语通常在市场中发展，在那里许多不同语言的说话者必须相互交流以买卖商品。常见的词语和短语在交易中可能会反复使用（如货币价值或数量）。棘手的语法或冠词可能会被省略以促进两种不同语言说话者之间的理解。\n\
  \n帝国扩张是语言演化的另一个驱动因素。罗马帝国将拉丁语传播到欧洲大部分地区，影响了语言，特别是那些最接近罗马的语言，历经数个世纪。西班牙和葡萄牙是很有趣的案例，在那里拉丁语的罗马影响和阿拉伯语的摩尔影响都影响了当地方言。随着时间的推移，随着罗马帝国权力衰落以及其他语言和文化影响使曾在商业、学校和宗教中使用拉丁语的地区分离，罗曼语，包括西班牙语和葡萄牙语，从拉丁语中演化出来。事实上，罗马帝国如此直接地影响了这些语言的发展，以至于术语\
  \ **罗曼语** 指的就是罗马帝国！\n\n今天存在的多数英语皮钦语都归功于英国殖民主义，正如大不列颠、美利坚合众国和澳大利亚所说的英语不同方言一样。取决于英语作为商业通用语能持续多久，我们可能会在未来几个世纪看到许多子语言从英语演化而来。\n\
  \n**系统发育树** 可以通过显示亲子关系来直观地总结思想、语言或物种随时间的演化关系。这使得演化结构的研究变得更容易，因为视觉提供了关于演化假设路径的线索以及一个易于分析信息和潜在统计差异的网络结构。一般本体结构没有层次结构，其中网络的一部分在意识形态上依赖于网络的先前部分。让我们通过尼罗-撒哈拉语言的假设演化路径来实际看看这一点。\n\
  \n## 尼罗-撒哈拉语言\n\n尼罗-撒哈拉语言包括在南苏丹、埃塞俄比亚、苏丹、肯尼亚、坦桑尼亚、乌干达、乍得、布基纳法索、喀麦隆、马里、刚果民主共和国、贝宁、阿尔及利亚、尼日利亚、尼日尔、埃及和利比亚等国使用的语言。一些其他国家也存在进一步的小型语言社区。该语族中一些常见的语言有马赛语、松盖语、丁卡语、卢奥语和卡努里语。约有\
  \ 7000 万人使用尼罗-撒哈拉语言，部分地区和方言的使用者数量正在增加。\n\n\n\n\n\n尼罗-撒哈拉语系的语言学研究可追溯至至少 1800 年代，过去十年来许多论文都在争论语言漂移以及母语与子语之间的关系。在本节中，我们将考察其中几种提出的层级结构，然后在下一节中利用\
  \ Python 代码返回分析这些层级结构的相似性和差异。如果你对论文本身感兴趣，可以查阅本章末尾的参考文献，特别是 Dimmendaal 的论文，它总结了尼罗-撒哈拉语系中亲子关系最近的争论。\n\
  \nGreenberg 在 1963 年提出了以下层级结构，对若干语言家族分支进行了分类。图 11.4 显示了该层级结构，包括从更大的尼罗-撒哈拉语系的一个子分支衍生的子分支：\n\
  \n![](img/71ff737206f7d80bb625b3c9aca9dc7f_223_0.png)\n\n图 11.4 – Greenberg 对尼罗-撒哈拉语系的分类\n\
  \n图 11.4 显示了尼罗-撒哈拉语系的部分亚分类，这些亚分类属于该语言家族。每一个亚分类都继续延伸到单个语言，总计约有 130 种语言分布于该地区，这些语言起源于尼罗河支流汇合的地区，即曾经的努比亚。\n\
  \n自 1963 年以来，许多论文进一步细分了这些子类并增加了额外的子类，最终形成了我们将在本节讨论的 Dimmendaal 论文，有时形成了非常复杂和深层的网络结构。语法、用词、音系学（就本例而言是辅音的发音）以及术语通常决定了划分界限的位置，但语言往往是流动的，可能在某种程度上重叠，使得分类系统难以辨别。让我们转向尼罗-撒哈拉语系的最新研究之一。\n\
  \nDimmendaal 的最新研究提出了尼罗-撒哈拉语亚家族的新层级结构，总结于图 11.5：\n\n![](img/71ff737206f7d80bb625b3c9aca9dc7f_224_0.png)\n\
  \n图 11.5 – Dimmendaal 的尼罗-撒哈拉语亚家族层级结构\n\n**注意**\n在图 11.5 中，Dimmendaal 的分类首先按地区划分语言，然后按方言或地区划分。还要注意的是，一些语言亚家族似乎是共同出现的（例如\
  \ Fur 和 Kunama），而没有中间家族的存在。这比图 11.4 中 Greenberg 的分类结构更为复杂。\n\n随着语言被更系统地研究，语言家族层级结构随时间演变，记录出现的差异及其潜在原因非常重要。这照亮了进一步语言学研究的途径，并可为未来语言家族层级结构的发展做出贡献。\n\
  \n现在我们对尼罗-撒哈拉语言及其层级结构有了一些了解，让我们看看网络科学如何帮助我们理解可能重要的结构差异。\n\n## 注意\n\n我们的示例规模非常有限，因此结果易于可视化，并且我们分析可能显示差异的原因也很清楚。使用完整的\
  \ OWL 数据库或完整的语言层级结构会产生更细致和更大的网络来研究。然而，无论网络规模或复杂性如何，所使用的工具都是相同的。因此，我们即将开始的分析可以应用于更复杂的语言数据结构，在这些结构中，仅仅可视化不同研究小组创建的\
  \ OWL 数据库或不同语言家族层级结构之间的差异可能不可行。\n\n## 映射语言家族\n\n让我们回到尼罗-撒哈拉语言家族树的两个示例。为了检查结构差异，我们首先需要在\
  \ NetworkX 中创建它们。对于 Dimmendaal 家族树，我们将稍微偏离树结构，以显示某些子亚家族之间存在的相互关系。让我们开始通过脚本 11.1\
  \ 创建并绘制 Greenberg 树：\n\n```\n#load needed packages\nimport numpy as np\nimport networkx\
  \ as nx\nimport matplotlib.pyplot as plt\n\n#create the Greenberg Nilo-Saharan language\
  \ family network\nG = nx.Graph()\nG.add_nodes_from([1, 11])\nG.add_edges_from([(1,2),(1,3),(1,4),(1,5),(1,6),(1,7),(7,8),\n\
  \    (7,9),(7,10),(7,11)])\n\n#plot the Greenberg Nilo-Saharan language family network\n\
  import matplotlib.pyplot as plt\nG.nodes[1]['subfamily'] = 'Nilo_Saharan'\nG.nodes[2]['subfamily']\
  \ = 'Koman'\nG.nodes[3]['subfamily'] = 'Saharan'\nG.nodes[4]['subfamily'] = 'Songhay'\n\
  G.nodes[5]['subfamily'] = 'Fur'\nG.nodes[6]['subfamily'] = 'Maban'\nG.nodes[7]['subfamily']\
  \ = 'Chari_Nile'\nG.nodes[8]['subfamily'] = 'Central_Sudanic'\nG.nodes[9]['subfamily']\
  \ = 'Kunama'\nG.nodes[10]['subfamily'] = 'Berta'\nG.nodes[11]['subfamily'] = 'Eastern_Sudanic'\n\
  labels = nx.get_node_attributes(G, 'subfamily')\nnx.draw(G, labels=labels, font_weight='bold')\n\
  ```\n\n```\nlabels2 = nx.get_node_attributes(G2, 'subfamily')\nnx.draw(G2, labels=labels2,\
  \ font_weight='bold')\n```\n\n脚本的这一部分生成了 Dimmendaal 的尼罗-撒哈拉语亚家族树的图，显示在图 11.7 中：\n\
  \n![](img/71ff737206f7d80bb625b3c9aca9dc7f_227_0.png)\n\n图 11.7 – Dimmendaal 的尼罗-撒哈拉语亚家族树的图\n\
  \n注意 Dimmendaal 的尼罗-撒哈拉语亚家族树中 Kunama 与 Fur 之间、以及 Saharan 与 Eastern Sudanic 之间存在的连接。这些代表了尼罗-撒哈拉语东北分支内相关的子亚家族。从图\
  \ 11.6 和 11.7 可以看出总体结构相似，其中存在大量浅层且不相连的分支。然而，Dimmendaal 的尼罗-撒哈拉语亚家族树在树中增加了额外的一层，并包含了相关亚家族，而这些亚家族没有共同祖先直接产生它们。\n\
  \n鉴于这些差异，我们预计两种语言亚家族树之间的中心性指标会有所不同。我们将从前几章中定义的一些熟悉指标开始。脚本 11.2 分析了我们两种语言亚家族树之间平均中介中心性的差异：\n\
  \n```\n#compare betweenness centrality of language families\ngb=nx.betweenness_centrality(G)\n\
  print(np.mean(np.array(list(gb.values()))))\ngb2=nx.betweenness_centrality(G2)\n\
  print(np.mean(np.array(list(gb2.values()))))\n```\n\n我们得到平均中介中心性为 0.131（Greenberg）和\
  \ 0.127（Dimmendaal），表明这些亚家族树的桥接属性相似。让我们通过添加到脚本 11.2 来计算平均度中心性来评估枢纽属性：\n\n```\n#compare\
  \ degree centrality of language families\ngd=nx.degree_centrality(G)\nprint(np.mean(np.array(list(gd.values()))))\n\
  gd2=nx.degree_centrality(G2)\nprint(np.mean(np.array(list(gd2.values()))))\n```\n\
  \n我们得到平均度中心性为 0.182（Greenberg）和 0.278（Dimmendaal），表明这些亚家族树的枢纽属性在某种程度上有所不同。鉴于 Dimmendaal\
  \ 的亚家族树结构中连接其他层的额外深度层，我们预计会看到这种差异。\n\n让我们将注意力转向一种特别适合真实世界语言数据（以及其他本体或系统发育网络数据集）的中心性指标。\n\
  \n**子图中心性**衡量每个顶点在网络子图中的参与程度，通过加权网络邻接矩阵的谱，并通过网络上的随机游走估计子网络，对小型子网络赋予较大权重，对大型子网络赋予较小权重。这融合了**谱聚类**（见*第\
  \ 5 章*）和度中心性的属性，创造出一种混合中心性度量。\n\n我们可以在两个亚家族树上看到这一点，通过添加到脚本 11.2：\n\n```\n#compare\
  \ subgraph centrality of language families\ngs=nx.subgraph_centrality(G)\nprint(np.mean(np.array(list(gs.values()))))\n\
  gs2=nx.subgraph_centrality(G2)\nprint(np.mean(np.array(list(gs2.values()))))\n```\n\
  \n该脚本显示两个亚家族树的平均子图中心性有所不同，Greenberg 的平均子图中心性为 2.478，Dimmendaal 的平均子图中心性为 3.276。这表明这些假设亚家族树的谱和度分布是不同的。\n\
  \n虽然本示例仅涉及两个小的本体结构，但当处理许多本体或比较非常大的本体而可视化不被推荐时，这类分析会很有帮助。例如，我们可能希望比较许多不同论文中假设的完整的尼罗-撒哈拉语言树。这些树将包括数百个顶点和可能数十棵树。视觉上跟踪差异将是一项相当大的挑战！\n\
  \n\n\n\n当我们考虑语言学 OWL 数据库时，分析规模会进一步扩大到数十万个顶点，以跨 OWL 数据库进行比较。在这种规模下，通过可视化方式挖掘比较数据是不可能的。网络科学提供了一种比较所提出的\
  \ OWL 数据库结构的方法，并聚焦于这些数据库之间存在的差异，从而找到这些结构之间的关键区别。此外，我们之前概述的许多工具都能很好地扩展到这种规模的数据分析，为找到这些关键差异提供了一种高效的方法。然而，理解词源学理论中存在的差异超出了本书的范围，而且许多\
  \ OWL 数据库的存储依赖专有系统，或者它们本身就是专有的。\n\n本章聚焦于语言学领域。然而，许多其他学科中也存在多种类型的本体和系统发育。动物学和人类基因组学经常使用本体来研究基因、环境和基因表达之间的关系。这些本体往往规模庞大，而构建这些本体所需的知识整理可能导致试图捕获相同知识的不同本体之间存在显著差异或知识空白。可扩展的中心性度量（例如我们在一个易于可视化的简单示例中概述的那些）能够定位这些复杂本体的整体及个别分支差异，从而找出值得关注的领域，以及使用某个开源本体而非另一个时可能存在的注意事项。\n\
  \n随着不同领域知识的增长，比较本体的方法也将进一步发展，网络科学将在不同学科内本体的管理、理解和使用中发挥重要作用。\n\n## 小结\n\n在本章中，我们学习了如何在数据库和网络中表示语言学数据。我们使用中心性度量比较了尼罗-撒哈拉语系的两个语族网络，并引入了子图中心性，这是一种特别适合分析本体和系统发育的中心性度量。最后，我们将本体的讨论扩展到语言学领域之外，并讨论了如何利用本章中的工具将这些分析扩展到非常庞大的本体群，以比较它们在实际应用中的适用性。\n\
