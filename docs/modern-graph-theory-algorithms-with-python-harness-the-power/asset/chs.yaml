  self_loop=[]\n\nfor i in range(0,52):\n    self=(i,i)\n    self_loop.append(self)\n\
  to_remove=[]\n\nfor i in edge_list:\n    for j in self_loop:\n        if i==j:\n\
  \            to_remove.append(i)\nstores.delete_edges(to_remove)\nnets.append(stores)\n\
  d=Graph.degree(stores)\ne=Graph.pagerank(stores)\neig_t.append(e)\neig_ave.append(np.mean(e))\n\
  ecurvw=[]\n\nfor edge in stores.es:\n    s=edge.source\n    t=edge.target\n    ecurvw.append(2-d[s]-d[t])\n\
  vcurvw=[]\n\nfor vertex in stores.vs:\n    inc=Graph.incident(stores,vertex)\n \
  \   inc_curv=[]\n    for i in inc:\n        inc_curv.append(ecurvw[i])\n    vcurvw.append(sum(inc_curv))\n\
  \    vcurv_t.append(vcurvw)\n    vcurv_ave.append(np.mean(vcurv_t))\n```\n\n再次，我们可以通过添加到脚本\
  \ 7.2 来绘制 PageRank 和 Forman-Ricci 曲率中心性，以识别高波动和低波动时期：\n\n```\n#plot metric averages\
  \ across time slices\ntime=range(0,52)\nplt.plot(time, eig_ave, label = \"PageRank\
  \ Average\")\nplt.plot(time, vcurv_ave, label = \"Forman-Ricci Curvature Average\"\
  )\nplt.xlabel(\"Time Slice\")\nplt.ylabel(\"PageRank and Forman-Ricci Curvature\
  \ Averages\")\n```\n\n```\nplt.legend()\nplt.show()\n```\n\n你应该会看到类似图 7.8 的图，其中在整个时间段内波动性总体上相当恒定，有几个波动性增加或减少的时期，标志着定价可能受到我们商店经理无法控制的外部因素影响的时期。\n\
  \n![](img/71ff737206f7d80bb625b3c9aca9dc7f_153_0.png)\n\n图 7.8 – PageRank 和 Forman-Ricci\
  \ 曲率平均值的图\n\n虽然我们不会期望每个时期的网络图中波动性从一个时期到另一个时期的重大变化会显示出来，但我们确实看到了一些值得调查的波动性差异。让我们再次选择两个时期进行调查（第\
  \ 10 期和第 30 期）。我们将首先调查第 10 期，通过添加到脚本 7.2，按 Forman-Ricci 曲率加权我们的顶点以可视化销售额的互联性：\n\n\
  ```\n#examine different time points with\n#Forman-Ricci curvature plots, tenth slice\n\
  ig.plot(nets[10],vertex_size=np.array(vcurv_t[10])*-0.5)\n```\n\n这应该会显示出类似图 7.9\
  \ 的图，其中只有两家商店相互连接，表明相对稳定的时期，外部影响不应像在其他更不稳定的时期那样影响我们商店的销售额。\n\n![](img/71ff737206f7d80bb625b3c9aca9dc7f_154_0.png)\n\
  \n图 7.9 – 第 10 期的商店图\n\n让我们通过添加到脚本 7.2 将此图与第 30 期的图进行比较：\n\n```\n#examine different\
  \ time points with\n#Forman-Ricci curvature plots, thirtieth slice\nig.plot(nets[30],vertex_size=np.array(vcurv_t[30])*-0.5)\n\
  ```\n\n此代码应生成类似图 7.10 的图，显示所有四家商店之间的连通性（最大可能的波动性），这使得商店容易受到可能影响所有四家商店的销售事件的影响，而不是仅影响一家本地商店：\n\
  \n![](img/71ff737206f7d80bb625b3c9aca9dc7f_154_1.png)\n\n图 7.10 – 第 30 期商店数据的网络图，显示最大波动性\n\
  \n综合来看，我们的结果表明，在 COVID-19 之前几个月，我们商店的波动性相当恒定，并在居家办公强制令后增加，并在返岗政策期间或多或少持续。从我们的原始模拟数据来看，一些商店从这一变化中受益，而其他商店则遭受了相当大的损失。随着波动性的变化，商店经理需要专注于他们可以控制的与各自商店相关的因素，而负责该地区所有商店的经理可能需要制定策略，如何在考虑为\
  \ struggling 商店整合建筑物的同时，调整成长商店的供应和成长需求。\n\n总体而言，这些分析提供了有关危机时期价格和销售脆弱性的一些见解，使决策者能够确定需要策略调整的时间。结合其他分析（例如通过多通道奇异谱分析进行时间序列预测，或有关人口统计或一天中不同时间购买行为差异的信息），这些类型的分析可提供有关需要关注的时间和特定地理位置的见解，以便在不断变化的时代继续蓬勃发展。\n\
  \n## 总结\n\n在本章中，我们扩展了我们对时空数据的先前见解，以解决具有时空数据集的分析问题，包括商店销售数据集和布基纳法索市场小米价格数据集。我们按时间切片划分了两个数据集，计算了空间统计，并分析了网络中心性指标，以识别数据中的变化点和波动时期。波动时期对应于网络对价格、销售额和其他指标的崩盘和飙升的脆弱性，因为系统的互联性使得对网络一部分的影响会蔓延到网络的其他部分。我们在\
  \ COVID-19 和乌克兰冲突期间看到了布基纳法索市场的这一现象，以及 COVID-19 对销售数据的影响。在第 7 章中，我们将研究销售和商品价格在时间和地理上的变化，以了解网络科学如何解决时空数据中的问题。在第\
  \ 8 章中，我们将考虑动态网络，其中连接甚至个体都可能随时间变化，并检查这些变化如何影响野生动物种群中的疾病传播。\n\n## 参考文献\n\nHan, X.,\
