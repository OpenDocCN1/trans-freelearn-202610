  \ AIMS 网络中任教。\n\n> *我对旅程中支持我的网络表示感激。我感谢为我的职业生涯做出贡献的朋友和教授。我欠非洲各地无数学生以及他们的继任者一份债。他们的热情和好奇心不断提醒我，数学和科学对塑造更美好的世界具有深远的影响。怀着感激之情，我拥抱教学和分享知识的机会，培养一个致力于利用这些学科变革潜能造福社会的学习者社区。*\n\
  \n\n\n\n\n# 关于审阅者\n\n**Casey Moffatt**，拥有应用数学硕士学位以及纯数学和哲学双学士学位，专攻图论、优化和计算机科学。他精通\
  \ Python 以及用于图数据科学、机器学习和算法开发的各种必备软件。他渴望在数学和计算机科学领域不断突破。他要感谢 Packt Publishing 和贡献者使像这样项目得以实现，并感谢开源技术背后无数个人。\n\
  \n# 前言\n\n你好！**网络科学**将分析的力量与图论的深层理论工具相结合，以解决数据分析中的难题。这使研究人员和工业工程师/数据科学家能够大规模分析数据，并将难以处理的分析问题重新构建为对问题产生强大洞察并预测系统行为的方法，包括生物、物理和社会系统。\n\
  \n网络科学今天有许多重要应用，包括：\n\n- 社交网络数据\n- 空间数据\n- 时间序列数据\n- 时空数据\n- 更高级的数据结构，如本体或超图\n\n\
  本书简要概述了社交网络应用，并专注于网络科学在数据科学领域前沿应用，如交通物流、对话、公共卫生、语言学和教育。到你旅程结束时，你将能够在网络科学框架内构建自己的数据问题，以获得洞察并解决你领域中的难题。\n\
  \n我们将在深入探讨过去数十年我们在学术界和工业界工作中相关的实践示例和代码时提供必要的数学背景，包括预测埃博拉疫情、预测食品价格波动、建模遗传和语言关系，以及挖掘社交网络以洞察社会纽带形成。随着世界面临粮食短缺、公共卫生危机、经济不平等、供应链崩溃和环境危机，网络科学将在为社会服务的海量数据分析中发挥重要作用。\n\
  \n## 本书适合谁\n\n如果你正在处理数据，本书适合你。为了充分利用本书，你应该对 Python 有一定熟悉度，特别是 pandas 和 numpy 包。此外，假设你对数据分析有一定熟悉度，尽管我们处理的网络科学工具和问题是从零开始构建，供没有这些问题或方法背景的读者使用。\n\
  \n网络科学在许多科学学科中都有丰富的历史，包括流行病学、生物医学工程、社会学、遗传学、环境科学、粒子物理、计算机科学和经济学。其在图论的基础也影响着纯数学和应用数学的许多领域研究。任何在科学、技术、工程和数学领域的从业者都可以从网络科学的工具箱和问题解决方法中受益。\n\
  \n# 本书涵盖内容\n\n第 1 章，什么是网络？，介绍了网络的理论概念，并提供了现实世界应用中网络的多个示例，包括随机图的工作。我们还将开始使用 Python\
  \ 的 igraph 和 NetworkX 包。\n\n第 2 章，使用 NetworkX 和 igraph 将数据整理为网络，在第 1 章的基础上，通过三个现实世界数据的示例展示可被表述为网络数据的数据，并展示如何在\
  \ Python 中将数据转换为网络形式。我们将介绍涉及空间数据、时间数据和时空数据的问题，并探讨网络科学如何通过将数据转换为网络形式来解决这些问题。\n\n\
  第 3 章，人口统计数据，探索了两个使用发展中国家人口统计数据的现实项目，以了解网络结构和信息/传染病传播能力。我们将考虑朋友群的人口统计特征和网络属性，以了解这两种信息如何共同影响疾病传播。\n\
  \n第 4 章，交通数据，提供了交通网络的现实示例，并介绍了与最小路径和网络流相关工具。我们将考虑最优路由和到目的地的最短路径，包括从一个地点到另一个地点的多站路径。\n\
  \n第 5 章，生态数据，展示了生态网络的现实示例，并介绍了谱图理论工具，包括谱聚类和图拉普拉斯算子。\n\n第 6 章，股票市场数据，检查了使用网络工具对股票市场数据进行分析的现实示例，包括波动率的基于边的中心性度量。我们将挖掘数据以寻找转折点，预示市场增长或市场崩盘的时期。\n\
  \n第 7 章，商品价格/销售数据，提供了两个关于商业数据在空间和时间上分析的现实示例，使用了之前在时间序列和空间数据应用中介绍的工具。我们将检查跨时间和空间的销售和定价趋势，以更好地了解消费者行为以及价格变化在时间和空间上的影响。\n\
  \n第 8 章，动态社交网络，介绍了一个随时间演化的社交网络数据集的现实示例，并分析其对传播过程如流行病和错误信息流动的脆弱性。我们将考虑影响生态社交网络对疾病传播脆弱性的因素。\n\
  \n\n\n\n\n第 9 章《网络机器学习》对基于网络的机器学习和深度学习进行了全面描述，包括使用监督学习、无监督学习和半监督学习的示例，以了解社交网络中的疾病风险。\n\
  \n第 10 章《路径挖掘》介绍了贝叶斯网络和利用教育数据示例进行因果路径挖掘，我们将看到课程顺序和表现如何影响学生成绩。\n\n第 11 章《语言家族映射——本体论方法》涵盖了本体论以及本体之间的映射，使用来自尼罗-苏丹语系及其词汇变体的语言数据示例。\n\
  \n第 12 章《图数据库》介绍了图数据库 Neo4j，包括来自前几章的数据以及如何使用前几章介绍的图工具和 Neo4j 的查询语言查询 Neo4j。我们将看到图数据库和网络科学工具如何在数据科学中产生协同作用，以及高效的数据存储解决方案。\n\
  \n第 13 章《整合全书》将前几章的材料整合到一个最终项目中，分析来自伊图里和北基伍省的时空网络数据和人口统计数据，并使用广义估计方程来了解 2019 年埃博拉疫情的演变。\n\
  \n第 14 章《新前沿》介绍了量子图算法、神经网络优化的图论、层次网络和超图。\n\n## 如何充分利用本书\n\n我们提供了 Python 脚本，并假设您具备基本的\
  \ Python 分析包（如 NumPy 和 scikit-learn）以及 Python 语法的一些知识。我们假设您具备基本的分析任务知识，例如汇总统计以及使用\
  \ numpy 或 pandas 在 Python 中处理不同类型的数据。每个章节都编写了脚本，后续脚本通常依赖于本章中的早期脚本来构建知识。Python 和分析中的其他概念将以概念方式介绍，然后通过\
