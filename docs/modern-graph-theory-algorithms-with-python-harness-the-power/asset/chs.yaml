  \ 注意\n\n处理长标签时，带有标签的图形会包含重叠或截断的标签。然而，图3.6展示了我们网络的一些重要属性：即我们有两个国家（乍得和尼日尔）连接着两个独立的网络（加蓬或布隆迪等中部非洲法语国家，以及塞内加尔或摩洛哥等西非/北非法语国家）。正如我们稍后在创建音乐潮流传播模型时所看到的，连接网络不同部分的桥梁（例如法语国家网络中的乍得和尼日尔）控制着从一个子网络到另一个子网络的传播过程。\n\
  \n为了模拟潮流的传播——或思想的扩散或疾病的传播——我们求助于一个名为微分方程的数学领域。**微分方程**描述了一个感兴趣系统中函数及其随时间的变化（导数）之间的关系。例如，微分方程可以模拟热量在机械部件上的流动、人群中观点的变化、重力对运动物体的影响、声音在房间中的传播，或历史上的天气模式（以及其他许多应用！）。\n\
  \n微分方程可以包括一阶导数（即感兴趣函数斜率的变化）、与函数曲率相关的二阶导数，甚至更高阶的导数。对于网络上的传播过程，我们将把讨论限制在一阶导数的微分方程上。然而，任何类型的微分方程都可以使用我们将用于NetworkX网络的软件来定义和运行。\n\
  \n有时，微分方程在感兴趣的函数中包含多个变量；这些方程被称为**偏微分方程**。许多现实世界的过程，包括流行病传播模型，都用偏微分方程建模。此外，许多现实世界的过程具有随机性，或依赖于过程在物体或网络上开始的位置。在网络中，通常会在过程的起点相同或变化的情况下多次运行偏微分方程。这允许产生一系列可能的结果。\n\
  \n现在我们了解了微分方程的基础知识，让我们深入探讨用于行为、思想和流行病传播的感兴趣模型：**易感-感染-抵抗（SIR）**模型。SIR模型最初（1927年）是为了研究流行病而开发的，其组成部分涉及人群中的易感个体（尚未感染但可能被感染）、感染个体（当前患有该疾病的人）以及康复或抵抗个体（曾经感染过或具有免疫力且不会被感染的人）。\n\
  \n当个体在人群中混合时，感染个体可以以一定概率将感染传给易感个体。对于我们的模型，感染易感个体的概率由参数*β*给出。在实践中，这个值要么通过文献中关于行为或疾病传播概率的估计得知，要么在最佳猜测范围内进行估计，模型在那些最佳猜测之间运行，以估计在该可能性范围内的潜在传播。一旦个体被感染，该个体就有恢复的概率，由参数*γ*给出。一旦康复，我们的模型确实允许再次感染。然而，在**易感-感染-康复-易感（SIRS）**模型中，康复的个体在一段时间后可以被再次感染。在**易感-感染-易感（SIS）**模型中，恢复被立即再次感染的机会所取代，而不是恢复。\n\
  \n流行病传播的一个重要特性是所谓的**基本再生数（R₀）**，即一个感染者引起的继发感染人数。我们可以用β参数值除以γ参数值来计算R₀。如果R₀大于1，则预期疫情在初始阶段会在人群中传播，这标志着可能发生大规模流行病。许多传染病疫情都有大于1的R₀值，包括最近的埃博拉疫情（R₀~1.5）、20世纪60年代加纳的麻疹疫情（R~14）以及1918年西班牙流感（初始R₀~1.5，后期~3.5\n\
  \n\n\nwaves). COVID-19 的 R₀ 值在不同变异株和国家之间差异巨大，使得难以获得标准的 R₀。然而，非洲范围内的一个估计显示，COVID-19\
  \ 在大多数国家的估计 R₀ 为 2.0-9.7。\n\nSIR 模型在网络上工作方式略有不同。感染顶点通常只感染网络中的邻居，从而产生邻近效应。在我们的网络中，桥接特性限制了从一个子网络向另一个子网络传播的机会，因为桥接顶点及其相邻顶点的感染率低于通过相互连接顶点的枢纽传播。一般来说，桥梁在网络中对于信息、思想或流行病传播而言是重要顶点，并且通常是干预目标。在疾病流行期间的疫苗接种活动以限制传播、在营销活动中针对性投放以提高产品采用率，以及在犯罪通信网络中进行抓捕，都是现实世界中针对桥梁以影响网络传播动态的例子。\n\
  \n让我们更深入地探讨网络的几何结构，包括枢纽和桥梁。枢纽是连接性高的区域，许多顶点连接到许多其他顶点。几何上，密集连接的区域如枢纽具有高曲率，并为网络上的传播过程或随机游走提供许多可能路径。在我们的法语非洲网络中，喀麦隆、塞内加尔和马里都表现出枢纽特性。\n\
  \n然而请注意，塞内加尔与许多其他顶点有大量边连接，而这些顶点本身并没有大量边。虽然塞内加尔由于其连接性而充当枢纽，但它并不是理想的传播目标，因为该过程会在其周围相当孤立的顶点中消亡。喀麦隆和马里则是与充当枢纽或桥梁的其他顶点相连的枢纽，从而使过程有很大概率继续传播。中心性指标衡量顶点在网络中的中心程度，创建不同类型的网络枢纽测量，可以找到在网络中发挥马里/喀麦隆或塞内加尔作用的顶点。我们将在后面的章节中重新审视这些中心性测量，在那里我们将使用\
  \ igraph 评估网络属性。\n\n桥梁的工作方式略有不同，但也为网络贡献了重要的几何特征。尼日尔和乍得在我们的法语非洲网络中充当桥梁，连接彼此之间没有其他边连接的枢纽。技术上，一种称为中介中心性的中心性类型通过计算每对顶点之间的最短路径（代表最直接的通信路线）并计算包含给定顶点的最短路径数量来衡量这种桥接特性。那些有大量最短路径经过的顶点充当网络不同部分之间的桥梁。几何上，桥梁充当网络中流动从一个部分到另一个部分的交叉点。我们的音乐从加蓬传播到西非如果没有乍得和尼日尔等桥梁连接北非和西非与中非就不可能，因为趋势必须通过这些国家传播才能离开中非。\n\
  \n对于我们在法语非洲的音乐传播，让我们考虑一个 SIR 模型，该模型以 5% 的国家收听新 Rumba 艺术家的音乐开始。我们说我们的音乐趋势有 25% 的机会传播到邻国（我们的\
  \ beta 参数）以及 10% 的机会作为趋势消退（我们的 gamma 参数）。这给我们 R₀~2.5，这意味着我们的音乐趋势最初应该传播良好。\n\n```python\n\
  viz = DiffusionTrend(model, trends)\np = viz.plot(width=500, height=400)\nshow(p)\n\
  ```\n\n这应该会给出与图 3.7 相似的图，该图显示了我们音乐趋势流行病中易感、感染和恢复/移除国家的比例。请注意，我们受此新 Rumba 艺术家影响的国家预期峰值数量约为我们国家的三分之一，而此新艺术家的影响持续了超过半年的时间。这对于我们的新艺术家来说是一个相当成功的结局：\n\
  \n![](img/71ff737206f7d80bb625b3c9aca9dc7f_76_0.png)\n\n图 3.7 – 音乐趋势在法语国家网络中的传播\n\
  \n现在，让我们将我们的 gamma 参数修改为 0.3，给出小于 1 的 R₀。我们预计在这种动态下我们的趋势会很快消退。在这种新情景下修改脚本 3.1 会产生截然不同的动态（图\
  \ 3.8）：\n\n```python\n# Model Configuration\nimport ndlib.models.ModelConfig as\
  \ mc\n\nconfig = mc.Configuration()\nconfig.add_model_parameter('beta', 0.25)\n\
  config.add_model_parameter('gamma', 0.3)\nconfig.add_model_parameter(\"fraction_infected\"\
  , 0.05)\nmodel.set_initial_status(config)\n\n# Simulation\niterations = model.iteration_bunch(50)\n\
  trends = model.build_trends(iterations)\n\n#visualize spread dynamics\nfrom bokeh.io\
  \ import output_notebook, show\nfrom ndlib.viz.bokeh.DiffusionTrend import DiffusionTrend\n\
  \nviz = DiffusionTrend(model, trends)\np = viz.plot(width=500, height=400)\nshow(p)\n\
  ```\n\n![](img/71ff737206f7d80bb625b3c9aca9dc7f_77_0.png)\n\nbeta: 0.25, gamma:\
  \ 0.3, fraction infected: 0.05, tp rate: 1\n\n图 3.8 – 在新的 gamma 参数下，音乐在法语国家网络中的传播\n\
  \n*图 3.8* 表明，新 Rumba 艺术家的音乐并没有在很大程度上传播到邻国，并在专辑发行后不久就消退了。艺术家不太可能在自己的家乡以外的地方为人所知，而听过专辑的人也会很快忘记歌曲。这与原始情景相比，对我们艺术家来说是一个截然不同的结果。\n\
  \n## AIMS 喀麦隆学生网络流行病模型\n\n为了了解流感如何在社交网络中传播，让我们回到我们的 AIMS 喀麦隆学生网络。回想一下，我们使用关于互动的调查数据在学生之间创建了连接。这使我们能够连接定期互动的学生。然而，考虑调查数据不存在的情况。如何推断学生之间可能的连接？\n\
  \n我们拥有诸如原籍国、专业领域和学生年龄等信息。来自同一国家的学生可能共享共同文化——也许是相同的当地语言、相同的最爱安慰食物，或相同的最爱音乐人。\n\n\
  同样，同一专业领域的学生很可能在课堂内外一起度过时间，因为他们有共同的课程和职业兴趣。学习小组、小组项目以及他们领域的专业活动很可能定期将学生聚集在一起。如果在这些聚会中发生流感或\
  \ COVID-19 等传染性爆发，它很可能在专业领域内传播。\n\n让我们通过连接来自同一国家或共享专业领域的学生来创建一个新的 AIMS 喀麦隆学生网络。我们将使用\
  \ `Script 3.2` 加载数据集：\n\n```python\n#import needed packages\nimport pandas as pd\n\
  import networkx as nx\nimport matplotlib.pyplot as plt\nimport numpy as np\nimport\
  \ math\n\n#reading the dataset\nfichier = pd.read_csv(\"C:/users/njfar/OneDrive/Desktop/AIMS_data.csv\"\
  )\ndata = pd.DataFrame(fichier)\n```\n\n现在，让我们设置我们的网络以及一些初步向量和数量，以帮助我们生成学生之间的连接，包括学生数量及其属性，通过向\
  \ `Script 3.2` 添加内容：\n\n```python\n#initializing the social network\naimsNetwork\
  \ = nx.Graph()\n\n#populating the network with nodes and edges\nfor i in range(len(data[\"\
  Name\"])):\n    aimsNetwork.add_node(\n        data[\"Name\"][i], Age=data[\"Age\"\
  ][i],\n        country=data[\"Country\"][i], Field=data[\"Field\"][i],\n       \
  \ background=data[\"Background\"][i])\n\n#define length\nN = len(aimsNetwork.nodes())\n\
  \n# one can build the adjacency matrix\nAIMS_by_Country_or_Field = nx.Graph()\n\n\
  #define objects\nAIMS = aimsNetwork\nstudents = list(AIMS.nodes())\n```\n\n现在，我们可以根据共享的祖籍国或专业领域连接学生，通过循环遍历我们的属性在\
  \ NetworkX 中构建图，通过向脚本 3.2 添加内容：\n\n```python\n#create edges\nfor i in range(N-1):\n\
  \    for j in range(i+1,N):\n        sti = students[i]\n        stj = students[j]\n\
  \        if (AIMS.nodes[sti]['Field'] == AIMS.nodes[stj]['Field'] or\n         \
  \   AIMS.nodes[sti]['country'] == AIMS.nodes[stj]['country']):\n            AIMS_by_Country_or_Field.add_edge(sti,stj)\n\
  ```\n\n现在我们有了网络，让我们可视化 AIMS 学生之间的连接：\n\n```python\n#create plot\nDegree=AIMS_by_Country_or_Field.degree()\n\
  var = [10*k[1] for k in list(Degree)]\nplt.figure(figsize=(20,20))\nnx.draw_random(AIMS_by_Country_or_Field,\
  \ font_size=10,\n    node_size = var, with_labels=True, node_color=\"red\")\nplt.show()\n\
  ```\n\n\n\n\n\n这应该会给出一个高度互联的学生网络的图示，显示在 *图 3.9：*\n\n![](img/71ff737206f7d80bb625b3c9aca9dc7f_80_0.png)\n\
  \n图 3.9 – 按原籍国和专业领域连接的 AIMS 喀麦隆学生网络\n\n图 3.9 显示了一个密集连接的网络，表明许多学生很可能与许多其他学生互动。该网络没有很多桥梁，但大多数顶点似乎是枢纽。在非常密集的网络中，传播过程往往移动得更快。该网络中顶点之间的最短路径与法语非洲网络中的相比会相对较短，因为大多数顶点彼此连接或几乎连接。网络的直径，即最长最短路径，表示信息或疾病在两个顶点之间传播的最大最短旅行路线。小的网络直径（或小的平均最短路径长度）表明传播过程的效率，例如信息、趋势或疾病。因此，我们预计我们的\
  \ AIMS 喀麦隆学生网络比我们的法语非洲网络更容易受到传播过程的影响。从技术上讲，直径为定义在网络上的传播过程等微分方程提供了界限。\n\n在这个网络上 R₀\
  \ 超过 1 的流行病很可能会迅速传播并感染网络的大部分。让我们在 AIMS 喀麦隆学生网络上运行一个与我们在法语网络上相同的 beta 和 gamma 参数的流行病，并绘制结果，以了解类似于西班牙流感的流行病可能如何通过我们的学生群体传播，通过向脚本\
  \ 3.2 添加内容：\n\n```\n#Run the simulated epidemic on the AIMS Cameroon student network\n\
  model = ep.SIRModel(G)\nconfig = mc.Configuration()\nconfig.add_model_parameter('beta',\
  \ 0.25)\nconfig.add_model_parameter('gamma', 0.1)\nconfig.add_model_parameter(\"\
  fraction_infected\", 0.05)\nmodel.set_initial_status(config)\niterations = model.iteration_bunch(50)\n\
  trends = model.build_trends(iterations)\nviz = DiffusionTrend(model, trends)\np\
  \ = viz.plot(width=500, height=400)\nshow(p)\n```\n\n图 3.10 显示了流行病的动态，包括在流行病高峰时有许多感染的学生，并且到第\
  \ 32 周流行病减弱时几乎整个网络都被感染：\n\n![](img/71ff737206f7d80bb625b3c9aca9dc7f_82_0.png)\n\n\
  图 3.10 – beta = 0.25 且 gamma = 0.1 的流行病在 AIMS 喀麦隆学生网络中传播\n\n图 3.10 显示了一个非常严重的流行病，很可能需要关闭课程并隔离感染的学生。在第\
  \ 8 章中，我们将考虑您可以利用的具体策略，以降低在人口层面流行病的影响，包括移除连接人群或形成枢纽的关键顶点。现在，让我们修改脚本 3.2 以运行第二种类型的流行病，其中\
