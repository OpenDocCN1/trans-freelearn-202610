  \n![](img/71ff737206f7d80bb625b3c9aca9dc7f_174_0.png)\n\n图8.9 – 鹭网络第一个时间点的图\n\n\
  请注意，我们的鹭网络在观察期内显示出许多不同的互动模式。这将影响我们的病毒传播动态，因为不同动物在不同时间段进行互动。让我们考虑一种传播迅速（beta = 0.4）且恢复较慢（gamma\
  \ = 0.2）的传染病。禽流感流行病往往传播迅速，这些参数可能代表一种新型禽流感变种在种群中传播。在真实的禽流感疫情中，感染潜伏期较长意味着我们需要在超过50分钟的时间内观察种群（也许需要数天）。然而，让我们通过向脚本8.3添加代码，看看我们提出的流行病如何基于互动在鹭种群中传播：\n\
  \n```python\n#run epidemic model\nimport ndlib.models.ModelConfig as mc\n%matplotlib\
  \ inline\nfrom ndlib.viz.mpl.DiffusionTrend import DiffusionTrend\n#from ndlib.viz.mpl.DiffusionPrevalence\
