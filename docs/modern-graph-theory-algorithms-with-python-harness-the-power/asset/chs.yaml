  \n![](img/71ff737206f7d80bb625b3c9aca9dc7f_83_0.png)\n\n图 3.11 – beta = 0.25 且 gamma\
  \ = 0.3 的流行病在 AIMS 喀麦隆学生网络中传播\n\n正如我们从 *图 3.11* 中看到的，即使是密集连接的网络也并非对某些类型的流行病构成威胁。如果没有通过网络结构或通过影响传播潜力的疾病特征来有效传播的正确条件，流行病会在人群中消退。然而，一种病毒有可能从\
  \ *图 3.11* 所示的初始动态突变为更具传染性的东西。\n\n如本章前面所述，1918 年西班牙流感毒株从一种传染病突变为一种高度传染性疾病，使 R₀ 从刚好超过\
  \ 1（允许传播）变为 3.5，预示着一场全球灾难。实际上，在模拟通过感兴趣网络传播的流行病时，考虑各种现实的参数值很重要，因为参数的微小差异可能导致非常不同的结果；流行病规划在模拟各种场景时效果最好。\n\
  \n## 总结\n\n在本章中，我们介绍了人口统计因素以及它们如何通过同质性影响网络发展。我们还介绍了枢纽和桥梁的概念。然后我们转向 SIR 模型，以显示基于微分方程模型中传播因素的社会网络中的趋势和疾病传播。我们考虑了两个网络：邻近法语国家的地理网络和基于人口统计因素推断边的\
  \ AIMS 喀麦隆学生网络。然后我们通过改变流行病参数模拟流行病，检查了 R₀ 在两个网络上的作用；这证明了趋势或疾病在网络中传播需要特定的条件。我们将在第\
  \ 8 章再次重温这些想法和影响传播行为的策略，当我们更详细地深入研究中心性度量时，关于动态网络指标如何随着个人随着时间的推移改变与其他人的联系而随时间变化。\n\
