  trends = model.build_trends(iterations)\n\n#visualize trends\nviz = DiffusionTrend(model,\
  \ trends)\nviz.plot()\n```\n\n```python\ndd = nx.betweenness_centrality(dg)\nplt.plot(dd.values())\n\
  plt.title(\"betweenness centrality\")\nprint()\nplt.show()\nprint (\"timestamp =\
