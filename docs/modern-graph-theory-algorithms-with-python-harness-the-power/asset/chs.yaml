  \ 10 月 20 日\n\n## 人口学导论\n\n**人口学**，最初被表述为对人口生命统计的研究，衡量感兴趣的人口中的个体特征。关于人口的生命记录对于公共政策制定、流行病追踪、城市规划以及许多其他对基础设施和增长至关重要的政府任务非常重要。约翰·斯诺在\
  \ 1854 年伦敦霍乱爆发期间开创了人口学领域，绘制了地理数据和感染个体的共同特征，以确定霍乱爆发的来源（一个水泵）。此后，人口学在医学研究、政策规划、教育改革以及社会科学对社会需求的其他应用中发挥了重要作用。\n\
  \n在本章中，我们将介绍人口学研究的一些重要方面，以及如何利用共同的人口统计和地理因素通过基于共同地理和人口统计因素的边连接顶点来创建网络。\n\n### 人口统计因素\n\
  \n人口学为我们提供了许多潜在的测量方法来研究人口及其子群体，从而让我们推断这些人口和子群体中个体之间可能的社会联系。例如，我们可能希望了解城市如卢旺达基加利、印度班加罗尔或中国西安在城市增长期间一段时间内性别、教育程度、宗教、社会经济地位或原籍国在城市中的分布情况。通常，我们将结果绘制成简单的图表以显示随时间的变化，如\
  \ *图 3.1* 所示，该图描绘了卢旺达宗教构成的 30 年变化：\n\n![](img/71ff737206f7d80bb625b3c9aca9dc7f_66_0.png)\n\
  \n图 3.1 – 比较 1993 年与 2023 年卢旺达宗教归属的图表\n\n### 地理因素\n\n地理在决定社会联系的形成和可能性方面也发挥着重要作用。同一地区的个体更有可能在同一餐厅共进晚餐、在同一地区徒步旅行并加入基于地区的兴趣团体。例如，考虑三个区域——拥有更大房屋和茂盛院子的郊区、人口稠密的城市以及房屋稀少的非常农村社区（如图\
  \ 3.3 所示）：\n\n![](img/71ff737206f7d80bb625b3c9aca9dc7f_68_0.png)\n\n图 3.3 – 三个不同地理区域的插图\n\
  \n也许图 3.3 中显示的区域都位于比利时，使它们具有共同的国家文化。虽然我们预计图 3.3 中每个地理区域内个体的社会联系形成可能性高于跨区域，但比利时这些地区之间的社会联系形成可能性高于与内罗毕或德黑兰的个体形成，如图\
  \ 3.4 所示：\n\n![](img/71ff737206f7d80bb625b3c9aca9dc7f_68_1.png)\n\n图 3.4 – 分别在内罗毕和德黑兰的女性的插图\n\
  \n\n\n\n生活在同一地理区域的人们，无论在国家、城市还是社区层面，都更可能通过地区性互动相互认识。然而，布鲁塞尔的研究人员可能会通过学术会议或**ResearchGate**、**LinkedIn**等专业社交媒体平台结识内罗毕或德黑兰的研究人员。全球经济和全球社交媒体平台的兴起削弱了地理因素对社会关系的影响，但同一地理区域的人们仍然更有可能形成社会联系，尤其是当他们具有相似的人口统计特征时。\n\
  \n然而，全球化，尤其是对于受过教育的专业人士而言，已经改变了社会联系的形成过程。对于研究专业人士社交网络的人来说，明智的做法是考虑与该职业相关的其他人口统计因素，而不仅仅是地理因素。COVID-19疫情以及随后线上/混合办公、会议和社交活动的兴起，使许多专业人士的社交网络超出了本地地理范围。尽管如此，那些在地理上拥有共同背景的人往往拥有共同的文化，因此即使疫情以来相关人员的地理位置发生了变化，这些联系也更有可能存在。\n\
  \n## 网络中的同质性\n\n正如我们所见，人口统计和地理因素驱动着人口中个体之间的联系。自知识经济出现以来，大多数地理区域都集中在某些人口统计因素上，因为人们选择与和自己相似的人生活在一起：在相同地区工作、财富水平相近、教育背景相似。相似的人更有可能相遇、更有可能结婚，也更有可能属于相同的群体。\n\
  \n让我们看一下日本津和野的三位年轻女性（真理子、玲和凉子），她们年龄相仿，教育水平相近，且都来自传统背景，如图3.5所示：\n\n![](img/71ff737206f7d80bb625b3c9aca9dc7f_69_0.png)\n\
  \n图3.5 – 日本津和野外的真理子、玲和凉子\n\n基于地理和共同的人口统计因素，我们可以预期真理子、玲和凉子如果见面会形成社会联系；考虑到她们所在城镇的规模，她们很可能已经见过面了。在网络科学中，顶点与其他具有重要特征（如人口统计或地理因素）的顶点形成边的倾向被称为**同质性**。\n\
  \n同质性在社交网络中的链接预测中扮演着重要角色，它基于共同的人口统计/地理因素以及共同的联系人，为个体提供潜在联系。例如，考虑路易斯和让之间建立联系的可能性：他们是巴黎的两位数据科学家，未发现彼此有职业联系，但共享二十位共同同事和许多人口统计因素：年龄段、教育背景、居住和工作的街区以及职业。如果他们在一个专业活动中相遇，他们很可能会建立职业联系，而且他们可能已经认识，但尚未在社交媒体平台上建立连接。与帕特里克相比，路易斯认识让的可能性要大得多；帕特里克是一位年长得多的房地产专业人士，住在另一个街区，从未上过研究生院，也从不参加科技会议。\n\
  \n除了链接预测，同质性在网络聚类中也非常有用。我们可以不通过网络特定的聚类方法（将在后续章节详述）先基于网络连接性对顶点进行聚类，而是使用k-means或基于密度的聚类方法，根据我们收集的人口统计和地理因素对顶点进行聚类。虽然这在社交网络中更常见，但这种聚类也可以应用于基因网络、基于地理的销售网络或任何其他类型的网络。\n\
  \n让我们通过两个例子来观察同质性的实际作用：第一个例子突出同质性如何影响非洲法语国家音乐潮流的传播，第二个例子展示流行病如何基于学生的研究领域和祖国的社会互动，在我们的AIMS学生网络中传播。\n\
  \n## 非洲法语国家的音乐传播\n\n使用同一种语言的国家往往共享相近的音乐品味、文学和其他文化标志，同时也进行贸易合作、提供跨境就业机会并建立经济联系。在非洲，许多国家的历史都包含殖民时期，它们当时受英国或法国控制；许多国家仍将英语或法语作为行政通用语言。为了理解音乐在法语国家间的传播，我们将构建一个网络，将法语人口超过10%且共享边界的国家连接起来。虽然毛里求斯或马达加斯加等其他国家也有大量法语人口，但它们在地理上与其他法语非洲地区隔绝。音乐或文学潮流可能会通过在线渠道或广播电台从其他法语国家传播过来；然而，区域演唱会和文化活动可能不会像在共享边界的国家之间那样容易促进传播。\n\
