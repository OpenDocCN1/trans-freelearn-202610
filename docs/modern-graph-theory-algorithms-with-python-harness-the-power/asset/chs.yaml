  \ 4.2* 显示了这样一条路径：\n\n![](img/71ff737206f7d80bb625b3c9aca9dc7f_87_0.png)\n\n*图 4.2*\
  \ — 向假设郊区各家杂货店运送水果和蔬菜的路线规划\n\n与 *图 4.2* 相反，在实际情况中，卡车在商店之间可能有许多路线可走。可能存在替代街道和路线组合。卡车可能需要在商店之间加油，加油站的位置可能会影响理想路线的选择。道路可能因施工而封闭。下午的雷暴可能会淹没一些好路上的街道，造成卡车需要避免的危险。一些商店可能缺橙子和葡萄柚，这使得它们需要优先进行早期送货，以便顾客可以购买这些水果。\n\
  \n\n\n\n\n在更长的距离上，交通方式的选择也成为一个问题。如果需要补货的商店之间存在海洋或山脉等障碍，通过海运或空运运输货物可能是更优的选择。自世界全球化以来，货物跨洲和跨洋运输已变得司空见惯（运输情况如图\
  \ 4.3 所示）：\n\n![](img/71ff737206f7d80bb625b3c9aca9dc7f_88_0.png)\n\n图 4.3 – 一艘货轮离港的插图\n\
  \n美国和欧洲使用的许多产品或产品部件来自中国、日本或印度。海运可以为陆运或空运提供更便宜、更快捷的替代方案。供应链物流中的一个关键问题是如何在成本效益、交货时间（TTD）和大宗货物运输需求之间取得平衡。让我们更详细地探讨其中一些考虑因素。\n\
  \n## 燃油成本\n\n当今物流中迫切需要解决的问题之一是根据交付成本优化路线。客户不希望为交付支付高价，也不希望长时间等待货物到达。自 COVID-19 停摆和乌克兰战争以来，燃油价格上涨，一些货物运输路线已不再可用。这推高了制造商、需要将货物运送到实体地点的企业以及从企业购买商品的消费者的成本。地面运输路线，特别是与电动配送车辆（见*图\
  \ 4.4(a)*）结合使用时，可以为在本地运营的公司提供一个不错的选择。然而，许多供应链依赖海外零件或货物，诸如运输（见*图 4.4(b)*）或空运等选择是必要的：\n\
  \n![](img/71ff737206f7d80bb625b3c9aca9dc7f_89_0.png)\n\n图 4.4 – 插图说明：（a）用于国内运输货物的半挂卡车和（b）用于海外运输货物的运输选项\n\
  \n然而，燃油成本很少是唯一的考虑因素，因为对于可能变质的货物而言时间至关重要，而且与货物损失相关的安全问题在实际问题中往往优先于燃油成本。让我们考虑一些 TTD\
  \ 在用于安排交付时间、路线和最佳运输方式的优化算法中成为重要考虑因素的场景。\n\n## 货物交付时间\n\n交付时间的首要考虑因素涉及紧迫性。货物可能在一定时间内变质（如农产品或疫苗），这通常超过成本考虑，因为货物在必要的使用时间之外将无法使用。销售窗口也值得考虑，因为圣诞节或斋月商品在节假日过后需求不会那么大。这会导致企业利润损失。\n\
  \n让我们考虑两个旅游咖啡馆，一个位于苏里南的帕拉马里博市，另一个位于苏里南乡村靠近自然探险营地。城市位置（见图 4.5 (a)）可以利用冰箱储存用于其冰沙的水果；乡村位置（见图\
  \ 4.5 (b)）没有冰箱。从当地农场运送新鲜水果的运输优先权可能会优先考虑乡村位置，因为水果在那里变质更快：\n\n![](img/71ff737206f7d80bb625b3c9aca9dc7f_90_0.png)\n\
  \n图 4.5 – 插图说明：（a）苏里南帕拉马里博的一家咖啡馆和（b）苏里南乡村靠近旅游营地的一家咖啡馆\n\n除了变质货物和错过促销期的问题外，时间因素还可能包括交付障碍，例如路线上的施工或收费公路。此外，不同国家在海关停留的时间可能差异很大，避免途经特定国家而选择更长的驾驶路线可能是有利的。\n\
  \n通常，有必要在数学上对路线进行加权，不仅按物理距离，还按旅行时间，包括海关或施工可能性等因素。\n\n## 导航危害\n\n导航问题不仅包括人为的交付障碍，还包括自然障碍。飓风会延误通过繁忙港口（如迈阿密港）的运输。阿尔卑斯山的雪崩是选择铁路运输的公司需要考虑的导航因素。航运业平均每年因恶劣海况和\
  \ rogue 波浪损失 10 艘船。一些航线，例如南非东南海岸附近的航线，以产生高浪而闻名（通常是由于洋流与来自不同方向的各种海浪混合）。\n\n在处理最佳旅行路线和确定哪种运输方式最具成本效益和便利性时，对路径进行危害加权是明智的。世界大多数地区都提供开放源代码的危害数据和材料，以确定存在哪些危害以及遇到它们的可能性。例如，世界银行提供了\
  \ **气候变化知识门户（CCKP）**，其中包含不同时期的自然灾害风险数据，并可下载数据。\n\n现在我们了解了一些路线规划的考虑因素，让我们深入研究一个简单的例子，包括迈阿密一个本地化区域的五家商店需要通过卡车配送农产品，并且已定义为排除当前施工区域，且一年中的这个时段该地区不会发生洪水或飓风。首先，我们需要了解如何在网络中计算顶点之间的最短路径，这在图论中有着深厚的根源。\n\
  \n## 最短路径应用\n\n地点和地点集合之间的最短路径在图论中已有悠久历史。最初，这个问题源于关于穿越德国柯尼斯堡七座桥的问题。1736 年，莱昂哈德·欧拉提出了一条路线，该路线恰好一次穿越每座桥到桥旁区域的路线不存在。确实如此。如果桥梁数量为奇数，且区域数量比桥梁数量多一个，则可以在不重复穿越桥梁的情况下完成一次旅行。请注意，此证明超出了本书的范围；如果您感兴趣，可以在网上搜索柯尼斯堡桥问题的证明，找到许多证明。\n\
  \n然而，这类问题在运输行业中经常出现，**全球定位系统（GPS）** 路由解决方案和算法会计算最短路径，无论是否有柯尼斯堡桥问题等特定约束，这些算法在当今的路由问题中很常见。我们通常希望在穿越最少的道路、桥梁或障碍物的情况下访问多个地点，我们可以以欧拉提出其桥问题的方式来表述这个问题。然而，我们通常有许多不同的可能路线和地点，这使得证明变得更加困难，因为存在替代路线。\n\
  \n**迪杰斯特拉算法** 计算网络上顶点之间的最短路径。正如我们之前所见，网络可以是无权重的（在邻接矩阵中用 0 或 1 表示顶点之间边的存在）或加权（其中存在的边具有不局限于\
  \ 1 的数字，表示它们的存在和它们之间的某些属性）。在地理数据中最短路径计算的背景下，这些权重通常代表地点之间的距离。\n\n顶点之间可能存在许多路径。例如，考虑一个具有七个顶点的网络。在顶点一和顶点六之间，存在许多可能的路径，包括图\
  \ 4.6 中所示的路径。然而，最短路径始终存在，最小化网络中任意两个顶点之间的距离（物理或其他，取决于从数据集分配的边权重）。当网络未连接时，这可能未定义或设为无限距离：\n\
  \n![](img/71ff737206f7d80bb625b3c9aca9dc7f_92_0.png)\n\n图 4.6 – 一个具有七个顶点且从第一个顶点到第六个顶点的路径的网络\n\
  \n有时，顶点之间的最短路径（例如，我们图 4.6 网络中顶点一和顶点七之间）可能不是唯一的。可能存在长度相同的多条路径，例如顶点一和顶点七之间的两条最短路径（见图\
  \ 4.7）：\n\n![](img/71ff737206f7d80bb625b3c9aca9dc7f_93_0.png)\n\n图 4.7 – 一对顶点（顶点一和顶点七）之间存在多条最短路径的网络\n\
  \n在无向网络中，找到顶点之间的最短路径时可以考虑所有顶点之间的边。如前所述，如果网络未连接，则可能存在无限路径长度。对于无向且无权重的网络，最短路径将穿越最少的边（如果没有边路径连接两个顶点，则可能存在无限值）。图\
  \ 4.8 显示了一个未连接的网络：\n\n\n\n![](img/71ff737206f7d80bb625b3c9aca9dc7f_94_0.png)\n\n\
  顶点八和顶点九之间的最短路径就是连接顶点八到顶点九的边。假设该网络未加权，则该路径的最短距离为一。顶点一和顶点六之间的最短路径由连接顶点六到顶点三以及顶点三到顶点一的边给出。因此，顶点六和三之间的最短距离为二。然而，顶点八和顶点六之间的最短路径不存在，将被指定为无穷大距离。\n\
  \nDijkstra 算法从一对顶点中的一个开始，并探索与该顶点相连的顶点。然后记录该初始顶点与其邻居顶点之间的最短路径，减去初始顶点本身（因为它已在我们的路径集合中）。然后探索与最短距离邻居顶点相连的下一组顶点，以找到存在的下一个最短路径。这种迭代探索会一直持续，直到找到另一对顶点。\n\
  \n让我们考虑 Dijkstra 算法如何帮助我们找到商店之间的最短路线。考虑郊区同一家连锁超市的五家商店，可能需要由母公司供应商补货。*表 4.1* 给出了这五家商店之间距离的汇总，单位为英里：\n\
  \n| | Store 1 | Store 2 | Store 3 | Store 4 | Store 5 |\n|---|---|---|---|---|---|\n\
  | Store 1 | 0 | 2 | 2.4 | 3 | 3 |\n| Store 2 | 2 | 0 | 3.7 | 1.4 | 4.3 |\n| Store\
  \ 3 | 2.4 | 3.7 | 0 | 4.9 | 0.9 |\n| Store 4 | 3 | 1.4 | 4.9 | 0 | 5.4 |\n| Store\
  \ 5 | 3 | 4.3 | 0.9 | 5.4 | 0 |\n\n表 4.1 – 郊区一家连锁商店之间的英里距离表\n\n我们可以通过脚本 4.1 在 NetworkX\
  \ 中创建这个商店网络：\n\n```\n#import packages\nimport networkx as nx\n\n#create the Stores\
  \ network\nSTRS = nx.Graph()\nSTRS.add_nodes_from([\"store1\",\"store2\",\"store3\"\
  ,\"store4\",\"store5\"])\n\n#define weighted ebunches, which represent lists of\
  \ edges\ne1 = [[\"store1\",\"store2\",2),((\"store1\",\"store3\",2.4),\n((\"store1\"\
  ,\"store4\",3),(\"store1\",\"store5\",3)]\ne2 = [[\"store2\",\"store3\",3.7),((\"\
  store2\",\"store4\",1.4),\n((\"store2\",\"store5\",4.3)]\ne3 = [[\"store3\",\"store4\"\
  ,4.9),((\"store3\",\"store5\",0.9),\n((\"store4\",\"store5\",5.4)]\n\n#add edges\n\
  STRS.add_weighted_edges_from(e1)\nSTRS.add_weighted_edges_from(e2)\nSTRS.add_weighted_edges_from(e3)\n\
  \n#plot\nweight_labels=nx.get_edge_attributes(STRS,'weight')\npos = nx.spring_layout(STRS)\n\
  nx.draw(STRS,pos,with_labels=True,)\nnx.draw_networkx_edge_labels(STRS, pos,edge_labels=weight_labels)\n\
  ```\n\n脚本 4.1 为我们提供了五家商店的网络，并附有漂亮的绘图摘要，显示商店之间的距离，如图 4.9 所示：\n\n![](img/71ff737206f7d80bb625b3c9aca9dc7f_96_0.png)\n\
  \n图 4.9 – 我们五家商店及其之间距离的绘图\n\n现在我们可以在脚本 4.1 的基础上创建基于网络的邻接矩阵并找到位置之间的最短路径。让我们计算商店 1\
  \ 与我们连锁店其他各店之间的最短距离：\n\n```\n#create adjacency matrix\nadj1 = nx.adjacency_matrix(STRS)\n\
  adj1.todense()\n\n#find all shortest paths starting at Store 1\nlength1, path1 =\
  \ nx.single_source_dijkstra(STRS,\"store1\")\nlength1\n```\n\n通过此计算，我们得出了商店 1 与所有其他商店之间的最短距离（length1）以及一般的最短路线（path1）。我们可以看到商店\
  \ 1 与其他商店之间的最短距离来自 length1。前往商店 2 的最短路线为两英里，而前往商店 4 或商店 5 的最短路线为三英里。商店 3 距离商店 1\
  \ 为 2.4 英里。\n\n使用 Dijkstra 算法的主要缺点之一是它是一种盲目搜索算法，需要遍历所有可能的选择才能找到路径上每对可能顶点之间的最短路径。对于大型网络来说，这需要很长时间，实际上需要对\
  \ Dijkstra 算法进行修改以减少搜索时间。\n\n**A* 算法**（发音为 A-star）通过使用启发式函数来指导搜索来修改 Dijkstra 算法（与\
  \ Dijkstra 算法中访问每个顶点不同）。启发式函数在搜索任务中很常见，因为它们加快了过程，并且可以在算法失败时修改搜索。A* 算法中使用的启发式函数结合了从起始顶点到路径的成本以及到达最终顶点的剩余成本的估计，以优先考虑最接近最终顶点的顶点。A*\
  \ 算法的主要用途之一是为 GPS 用户提供方向以找到前往目的地的最佳路线。\n\n总体而言，A* 算法能有效地找到最短路径候选，特别是在大型或密集的网络中。然而，其性能取决于用于估计遍历网络到达给定目的地的成本的启发式方法。虽然\
  \ Dijkstra 算法保证能找到最短路径，但 A* 算法不能保证找到最短路径。然而，在大型密集网络上，运行 Dijkstra 算法是不切实际的，因此必须使用\
  \ A*。\n\n*表 4.2* 总结了 Dijkstra 算法和 A* 算法之间的差异，以指导您在最短路径计算中如何以及何时使用每种算法：\n\n| Shortest\
  \ path algorithm | Type of search | Result guarantees | Computational speed |\n\
  |---|---|---|---|\n| Dijkstra’s algorithm | Blind search of all vertices | Always\
  \ finds the shortest path | Slow enough to limit use on dense or large networks\
  \ |\n| A* algorithm | Heuristic function guiding search | No guarantees to finding\
  \ the shortest path | Fast enough for most problems |\n\n表 4.2 – Dijkstra 算法与 A*\
  \ 算法的差异\n\n让我们考虑一个不同的商店网络，其中并非每家商店之间都存在路线，通过 `Script 4.2` 在 NetworkX 中创建一个二级商店网络：\n\
  \n```\n```python\n#create a different Stores network\nSTRS2 = nx.Graph()\nSTRS2.add_nodes_from([\"\
  store1\",\"store2\",\"store3\",\"store4\",\"store5\"])\n\n#define weighted ebunch\n\
  e12 = [(\"store1\",\"store2\",2),(\"store1\",\"store4\",3)]\ne22 = [(\"store2\"\
  ,\"store3\",3.7),(\"store2\",\"store4\",1.4)]\n```\n```\n\n让我们考虑从商店 2 到商店 5 的路线。存在几种可能的路线（商店\
  \ 2 到商店 3 到商店 4 到商店 5，商店 2 到商店 1 到商店 4 到商店 5，以及商店 2 到商店 4 到商店 5）。如果所有距离都相对较短，最短的可能路线可能不是停靠次数最少的路线。在这种情况下，我们只需查看我们的网络即可发现商店\
  \ 2 到商店 4 到商店 5 是最短路线。然而，在非常大的网络中，这将花费大量时间，并且可能涉及更长的路径。\n\n我们可以通过在脚本 4.2 中添加以下内容，使用\
  \ NetworkX 中的 A* 算法找到最短路线：\n\n```\n#find shortest path from Store 2 to Store 5\n\
  nx.astar_path(STRS2,\"store2\",\"store5\", weight='weight')\n```\n\n正如预期的那样，A* 算法找到了从商店\
  \ 2 到商店 4 到商店 5 的最短路径。同样，对于更大的网络，我们需要像 A* 算法这样的算法来快速找到最短路线。即使是 20 家商店且商店之间有若干连接的网络，从网络可视化中手工计算也会有问题。我们已经看到算法如何帮助我们找到两个特定目的地之间的最短路径。现在让我们来看看包含多个不同顶点停靠的最短路径。这种类型的解决方案对于许多最优路由问题至关重要，并且建立在我们寻找两个不同目的地之间最短路径的问题之上。\n\
  \n## 旅行商问题\n\n最短路径的自然扩展是停靠每个地点的最短可能路线。例如，考虑一辆需要为我们五家商店全部补货的蔬菜卡车。停靠我们五家商店的最短路线可以为司机节省时间和燃料，并使蔬菜在最短时间内到达每家商店。\n\
  \n旅行商问题旨在找到停靠每个地点的最短路线，或停靠任意数量可能地点的最短路线。在图论中，该问题（以及欧拉问题）与图的循环有关，循环定义为从同一顶点开始和结束的非空路径。\n\
  \n在实践中，需要算法来找到最短路径，对于大型问题，计算时间和收敛到解决方案可能会限制大多数算法的使用。NetworkX 提供了 Christofides 算法作为求解器，它找到最短生成树（结构类似于树且无环的网络），然后匹配树的顶点以找到最小距离。\n\
  \n让我们使用脚本 4.3 为我们原始的五家商店网络找到旅行商问题的解决方案：\n\n```\n#define traveling salesman algorithm\
  \ and apply it to the stores's\n#networks\ntsp = nx.approximation.traveling_salesman_problem\n\
  tsp(STRS)\n```\n\n\n这条路径从**商店1**出发，依次经过**商店3**（2.4英里）、**商店5**（0.9英里）、**商店4**（5.4英里）、**商店2**（1.4英里），最后返回**商店1**（2英里）。\n\
  \n让我们在次要门店网络上进一步了解这一点，将以下代码添加到`Script 4.3`中：\n\n```\n```python\n#apply TSP algorithm\
  \ to the second stores's networks\ntsp(STRS2)\n```\n```\n\n在这种情况下，我们需要多次访问某些商店才能访问每家商店。我们的算法给出的解决方案从**商店1**出发，然后到**商店4**（3英里），再到**商店5**（5.4英里），然后再次经过**商店4**（5.4英里），接着到**商店2**（1.4英里），再到**商店3**（3.7英里），然后返回**商店2**（3.7英里），最后回到**商店1**（2英里）。这比我们在原始门店网络中需要的路线长得多（12.1英里对比22.6英里），原因是许多商店之间的路径不是直达的。\n\
  \n在本节中，我们回顾了旅行商问题的一个解决方案，其中我们有一组需要访问的顶点，并希望找到访问所有这些顶点的最有效方式。在下一节中，我们将从研究最短路径问题转向划分顶点，以最大化每个集合中顶点之间的通行量（例如，在关闭几条路线进行维护时，最大化高峰时段的交通流量）。\n\
  \n## 最大流最小割算法\n\n除了最短路径和路线之外，交通物流有时还涉及城市规划，例如规划道路施工，以尽量减少对交通模式或供应链的中断。目标是在尽量减少被切断的路线数量的同时，最大化通过兴趣点（例如主要交叉路口或每天有大量访客/工作人员的建筑）的交通流量。\n\
  \n在图论中，最大流最小割算法旨在对网络进行划分，以最大化信息在社交网络中的流动、交通在运输网络中的流动，或物质在电力或水管网络中的流动等。通常，关于流量存在一个起始顶点和一个终止顶点，尽管也可以在所有可能的组合上运行该算法并汇总结果，以最大化整个网络的流量。\n\
  \n让我们考虑一个交通流量的例子：从城市外密集的住宅区到大多数人的工作地点——市中心。我们想规划在全市关键交叉路口更换交通信号灯的工作，这些交叉路口被运河分隔。城市中一些道路比其他的拥有更多车道，允许更多车辆使用这些路线。我们希望尽量减少工作日对通勤者的干扰。\n\
  \n我们可以为这种情况创建一个网络，将住宅区指定为顶点“a”，将市中心指定为顶点“g”。我们将使用容量参数来指定路线所能承受的交通量。让我们用`Script 4.4`在NetworkX中构建一个示例网络：\n\
  \n```\n```python\n#build the city intersection network\nG1=nx.DiGraph()\n```\n```\n\
  \n```\nG1.add_edge(\"a\", \"b\", capacity=2.0)\nG1.add_edge(\"a\", \"d\", capacity=0.5)\n\
  G1.add_edge(\"b\", \"d\", capacity=3.0)\nG1.add_edge(\"c\", \"d\", capacity=2.5)\n\
  G1.add_edge(\"c\", \"e\", capacity=1.0)\nG1.add_edge(\"e\", \"f\", capacity=4.0)\n\
  G1.add_edge(\"f\", \"g\", capacity=1.0)\n\n#plot network\ncapacity_labels=nx.get_edge_attributes(G1,'capacity')\n\
  pos = nx.spring_layout(G1)\nnx.draw(G1,pos,with_labels=True,)\nnx.draw_networkx_edge_labels(G1,pos,edge_labels=capacity_labels)\n\
  ```\n\n这个脚本应该生成一个类似于图4.11中的网络：\n\n![](img/71ff737206f7d80bb625b3c9aca9dc7f_101_0.png)\n\
  \n图4.11 – 交通网络图\n\n现在我们已经有了网络，让我们应用最大流最小割算法，通过向Script 4.4添加代码来找到我们可以更换第一个交通信号灯的位置：\n\
  \n```\n#find cut-points\npartition = nx.minimum_cut(G1, \"a\", \"g\")\nprint(partition)\n\
  ```\n\n我们的划分结果表明，最佳方案是切断交叉路口“c”和“d”之间的连接。一些通勤者可能会受到影响，但这保证了总体上最多通勤者的通行。\n\n## 总结\n\
  \n在本章中，我们探讨了交通问题和路径规划问题，这些问题在现实世界的行业中经常出现。我们在两个示例门店网络上使用Dijkstra和A*算法找到了商店之间的最短路径。然后，我们考虑了旅行商问题以在两个门店网络上进行最优路线规划，观察连通性如何影响路线长度。最后，我们考虑了在小型城市网络上最大化流量的最优割集。在下一章中，我们将通过检查生态数据来处理网络上的聚类问题。\n\
