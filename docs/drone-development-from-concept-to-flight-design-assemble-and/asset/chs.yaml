- '# 第 1 部分：飞行工程基础


  本部分介绍无人驾驶航空系统，即无人机，包括不同类型及其背后的工程原理。它还介绍了航空系统开发领域使用的基本术语，以及它如何在决定系统在三维空间中的姿态方面发挥重要作用。


  本部分包含以下章节：


  *   *第 1 章*，*UAV 和无人机工程入门*

  *   *第 2 章*，*理解飞行术语和运动物理学*

  *   *第 3 章*，*学习和应用基本指令与控制接口*

  *   *第 4 章*，*了解 UAV 系统、子系统和组件*

