  \ API | 有限的定制 API |\n| **飞行模式** | 多功能，支持多种飞行模式 | 丰富的飞行模式列表 | 专注于 GPS 辅助导航和稳定 | 取决于用于飞行控制的\
  \ API | 模式有限，可通过脚本定制 |\n| **社区与支持** | 庞大、活跃的社区 | 活跃的社区 | 活跃的社区 | 中等规模社区 | 活跃的社区\
  \ |\n| **文档质量** | 详尽的文档，用户友好 | 全面的文档，开发者友好 | 良好的文档，用户友好 | 一般的文档 | 文档有限，学习曲线陡峭 |\n\
  | **自主功能** | 丰富的自主功能和任务 | 功能丰富，注重通用性和模块化 | 主要为导航设计，较少关注自主任务 | 提供用于无人机控制和遥测的 API\
  \ | 基础自主功能，侧重固定翼无人机 |\n| **易用性** | 用户友好界面，功能强大的 `Mission Planner` | 用户友好界面，`QGroundControl`\
  \ | 用户友好界面，配置相对简单 | 需要编程技能和 `Python` 知识 | 设置复杂，学习曲线陡峭 |\n| **硬件兼容性** | 广泛的硬件支持，适用于各种自驾仪板卡\
  \ | 广泛的硬件支持，适用于各种自驾仪板卡 | 仅限于特定板卡 | 兼容各种无人机和硬件 | 硬件兼容性有限 |\n| **定制选项** | 高度可定制，参数丰富\
  \ | 高度可定制，模块化是关键特性 | 定制选项有限 | 通过 `Python` 脚本定制 | 通过 `C` 和 `XML` 配置文件定制 |\n| **地面站软件**\
  \ | `Mission Planner`，`APM Planner` | `QGroundControl`，`MAVSDK` | `INAV Configurator`\
  \ | 支持 `MAVLink` 的各种地面站软件 | `Paparazzi ground segment` |\n\n表 6.2 – 不同飞行栈的对比\n\n\
  在接下来的几个小节中，我们将了解无人机固件以及当今无人机中广泛使用的固件栈。一些固件栈是开源的，这意味着它们免费使用且任何人都可以修改，而另一些则是闭源的——即它们是公司创建者的专有财产，不能由公众自由使用。让我们继续来看看这些。\n\
  \n### 基本 PX4 控制器环路图\n\n下图是一个使用 PX4 自驾仪栈的无人机环路图，它展示了无人机不同软硬件组件之间的相互关联，无人机正是基于这些组件工作的。\n\
  \n![图 6.1 – PX4 环路图](img/B19566_06_1.jpg)\n\n图 6.1 – PX4 环路图\n\n我们将详细了解各个阶段，如下所示：\n\
  \n*   **传感器**：正如我们之前讨论的，传感器嵌入在飞行控制器和外围设备中，例如 GPS 指南针，它帮助无人机获取其 GPS 位置以及速度、线速度和角速度，这些由位置和姿态估计器引导。\n\
  \n*   **位置和姿态估计器**：PX4 中的位置和姿态估计器，特别是 `Extended Kalman Filter 2` (`EKF2`)，在飞行过程中确定无人机的位置和方向方面起着关键作用。`EKF2`\
  \ 位置估计器利用来自各种传感器的数据，包括 `GPS`、加速度计、陀螺仪、磁力计和气压计，来估计无人机的 3D 位置（纬度、经度和高度）和速度。同时，姿态估计器利用陀螺仪和加速度计的数据，并结合磁力计数据以改进偏航估计，来确定无人机的姿态，即横滚、俯仰和偏航角。这些估计器利用传感器融合技术来减轻噪声和不准确性，提供自适应能力以适应无人机动力学或传感器特性的变化。用户可以配置参数，根据特定的无人机和传感器设置优化这些估计器的性能，确保在\
  \ PX4 软件栈中实现精确可靠的飞行控制。\n\n*   **位置控制器**：位置控制器是多旋翼的重要组件，负责在飞行过程中保持期望位置并在航点间导航。在定点悬停中，位置控制器确保多旋翼保持在指定位置，主动调整电机输出以抵消外部干扰并保持稳定位置。对于航点导航，位置控制器引导多旋翼沿预定义路径飞行，解析\
  \ GPS 坐标并调整电机指令以通过一系列航点。通过结合传感器数据、GPS 信息和控制算法，位置控制器实现精确的定点悬停和准确的航点导航，有助于多旋翼在任务期间的整体稳定性和自主性。\n\
  \n*   **导航器**：PX4 无人机固件中的导航器作为一个关键模块，负责任务规划、路径跟踪和航点导航。它解析高层指令，如航点或电子围栏，并将其转化为位置控制器的可执行指令。通过结合\
  \ GPS 数据和传感器测量值，导航器协助位置控制器精确引导无人机沿其指定轨迹飞行。它向位置控制器提供关键信息，使无人机能够自主通过预定义的航点序列或保持固定位置，确保任务计划的准确可靠执行。导航器充当任务指令与底层控制之间的桥梁，增强了无人机在\
  \ PX4 固件中的整体自主性和导航能力。\n\n*   **姿态和速率控制器**：在 PX4 中，姿态控制器是负责维持无人机期望方向的关键组件，涵盖横滚、俯仰和偏航角。这些控制器通常使用\
  \ `PID` 算法实现，持续调整电机输出以最小化无人机当前姿态与期望设定点之间的差异。另一方面，速率控制器专注于控制无人机绕其三个轴的旋转速率。通过使用陀螺仪的数据，它们生成指令以稳定和控制旋转运动。例如，如果无人机经历意外的横滚，姿态控制器将采取行动进行修正，而速率控制器将管理旋转速度以确保平滑调整。这些控制器协同工作，有助于无人机在各种飞行条件下的稳定性和响应性。\n\
  \n*   **混控器**：混控器是一种控制算法，它接收来自姿态和位置控制器的指令，并驱动执行器达到所需的速度和位置。\n\n*   **执行器**：PX4 中的执行器在将飞行控制器的控制指令转化为无人机电机的物理运动方面起着关键作用。这些组件将飞行控制器产生的电子信号转换为机械动作，直接影响电机的转速或调整固定翼飞机的控制面。例如，在四旋翼中，执行器响应来自姿态和速率控制器的指令，修改每个电机的推力输出以实现期望的俯仰、横滚和偏航运动。执行器的有效性对于执行精确和响应迅速的机动至关重要，有助于无人机在\
  \ PX4 固件生态系统中的整体稳定性和控制。\n\n\n\n# PX4 飞行栈\n\nRC 用于飞行员对无人机的手动控制。RC 的使用会启动辅助驾驶模式来飞行无人机，例如高度模式和位置模式。这是飞行员向无人机发出飞行指令的地方，位置控制器将根据\
  \ RC 给出的指令进行相应行为。\n\n我们已经看过一个高层环路图，展示了在手动或自动任务的给定场景中，控制器如何使用传感器数据来驱动执行器。它演示了固件中不同控制器（如位置、姿态和速率控制器）如何在环路中协同工作，以向执行器提供准确且实时的信息。它以反馈机制运行，其中输出也作为输入，且输入依赖于输出。\n\
  \nPX4 飞行栈是一个通用且强大的自动驾驶栈，可用于控制多种不同类型的无人驾驶载具，包括固定翼和多旋翼，以及地面载具（如探测车）和水下载具（如潜艇）。由于其飞行控制器传感器和其他外围设备，该开源固件兼容众多飞行控制器硬件，其中包含高级飞行模式和安全功能。完整的用户和开发者文档可在网站上找到：`https://px4.io/`。\n\
  \n如果我们谈论 PX4 的架构，它本质上相当冗长且相互关联，这可以在图 6.2 中看到。PX4 飞行控制器的主要部分是其控制器模块，由其机器的当前状态管理。架构分为四大部分，即\
  \ **存储**、**驱动**、**外部连接** 和 **飞行控制**，它们进一步细分为接下来列出的模块和子模块。\n\n![图 6.2 – PX4 飞行栈高层架构图](img/B19566_06_2.jpg`)\n\
  \n图 6.2 – PX4 飞行栈高层架构图\n\n让我们浏览飞行栈架构的不同部分，以了解每个组件的作用：\n\n## 存储\n\n存储是飞行栈的关键元素，用于在配置和任务期间存储完整飞行栈的关键参数。这些存储机制共同确保关键数据可用于飞行操作、固件更新和飞行后分析。我们还可以看到飞行栈不同方面之间的互联及其相互依赖性。飞行控制器中可用的各种存储类型如下：\n\
  \n### NVM\n\n这种存储类型在断电后仍能保留数据。它通常存储固件、配置参数和关键飞行日志。\n\n### MicroSD 卡\n\n无人机通常使用 MicroSD\
  \ 卡作为额外存储。这可以包括高分辨率传感器数据、详细飞行日志和其他特定任务信息。\n\n### 板载内存\n\n飞行控制器拥有板载内存，用于存储固件、配置设置以及飞行操作期间的临时数据。\n\
  \n## 飞行日志\n\n飞行日志包含无人机飞行的详细记录，包括传感器数据、GPS 信息、控制输入和系统状态。这些日志对于无人机操作中的飞行后分析、故障排查和性能优化至关重要。\n\
  \n## 外部连接\n\n外部连接是指飞行控制器通过其与外部接口（如 GCS）交互的双向消息。外部连接是指无人机通过连接通道进行的连接，例如通过名为 MAVLink\
  \ 的协议进行无线电遥测。这有助于 GCS 配置无人机并对其进行命令和控制，例如规划和执行任务。外部连接通过两种基本协议建立：\n\n### MAVLink\n\
  \n**MAVLink** 是用于无人系统的 **微型飞行器** 协议，充当无人机和 GCS 之间的通信桥梁。其接口的特点是轻量级的二进制数据包结构，允许高效的数据传输。MAVLink\
  \ 采用发布-订阅模型，允许你订阅相关消息或发布信息，从而实现无缝且模块化的通信。该协议支持串口链路、使用 TCP/UDP 的网络连接，以及使用 UART 协议的无线电链路，以建立无人机和\
  \ GCS 之间的连接。当无人机连接到 GCS 时，我们将在 GCS 部分介绍此方法。\n\n### Fast RTPS\n\n**Fast RTPS**，即\
  \ **快速实时发布-订阅**，就像无人机的高速通信超级英雄。它帮助无人机及其外设快速可靠地相互通信。Fast RTPS 确保通信瞬间完成，这对于无人机快速导航和响应命令至关重要。它使用多种连接类型（如有线或无线链路）连接无人机的各个部分，例如大脑（飞行控制器）和眼睛（传感器）。\n\
  \n下表展示了 MAVLink 和 Fast RTPS 在技术差异和用法方面的对比：\n\n| 特性/方面 | MAVLink | Fast RTPS |\n\
  | --- | --- | --- |\n| 通信协议 | 面向 UAV 的轻量级消息协议 | 面向实时系统的通用中间件 |\n| 使用领域 | 主要设计用于\
  \ UAV 组件与 GCS 之间的通信 | 适用于机器人、物联网和工业自动化等各种实时系统的通用中间件 |\n| 数据序列化 | 高效二进制序列化 | XML\
  \ 或二进制序列化，可定制 |\n| 传输层 | 支持多种传输层，包括串口、UDP 和 TCP | 支持通过 UDP、TCP、共享内存和串口链路传输 |\n|\
  \ 发布-订阅模型 | 利用发布-订阅进行消息分发 | 遵循发布-订阅通信范式，允许单个主题有多个订阅者 |\n| 服务质量 (QoS) | 有限的 QoS 功能，基本消息可靠性\
  \ | 高级 QoS 功能，包括可靠性、持久性和历史管理 |\n| 中间件目的 | 专为 UAV 生态系统设计，特别是在开源无人机社区 | 通用中间件，适用于除\
  \ UAV 之外的广泛实时应用 |\n| 社区支持 | 在无人机和机器人社区拥有广泛的社区支持 | 在各行业广泛使用，获得 Eclipse 基金会的强力支持 |\n\
  | 协议开销 | 轻量级，协议开销极小 | 功能更全面的协议，具有额外功能，导致开销略高 |\n| 实现语言 | 主要用 C 实现，带有一些语言绑定 | 用 C++\
  \ 实现，提供 C、Java 等语言绑定 |\n| 示例实现 | ArduPilot, PX4 | 机器人操作系统 2 (ROS 2), eProsima Fast\
  \ RTPS |\n\n表 6.3 – MAVLink 与 Fast RTPS 的对比\n\n虽然 MAVLink 和 Fast RTPS 都可用于机器人和 UAV\
  \ 应用，但 MAVLink 专门针对 UAV 组件之间的轻量级通信进行了定制，而 Fast RTPS 是一种具有更高级功能的通用中间件，适用于更广泛的实时系统。\n\
  \n## 驱动\n\n在 PX4 中，驱动是与飞行控制器和各种硬件外设及传感器之间通信进行接口和管理的软件组件。这些驱动对于将不同的传感器和执行器集成到 PX4\
  \ 生态系统中至关重要。它们提供了一个抽象层，使飞行控制器能够与硬件组件通信，而无需直接处理其具体细节。\n\n\n\n# PX4 飞行栈\n\n## PX4\
  \ 驱动程序\n\nPX4 驱动程序通常由 PX4 社区编写，该社区包括正在从事开源项目工作的开发者、贡献者和爱好者。他们为各种传感器的驱动程序开发做出贡献，例如加速度计、陀螺仪、磁力计、气压计、GPS\
  \ 模块、相机和激光雷达。\n\n这些驱动程序用于各种 PX4 支持的飞行器，包括多旋翼、固定翼飞机和其他无人系统。它们的主要目的是使飞行控制器能够访问和利用来自不同传感器的数据并控制执行器，以确保稳定可控的飞行。\n\
  \n### PX4 驱动程序示例\n\n*   **`I2C` 和 `SPI` 驱动程序**：这些驱动程序促进了与使用 `I2C` 和 `SPI` 协议的传感器和外设的通信。\n\
  *   **`IMU` 驱动程序**：负责与加速度计、陀螺仪和磁力计接口以获取姿态和运动数据。\n*   **`GPS` 驱动程序**：支持与 GPS 模块通信以收集精确的位置和速度信息。\n\
  *   **`PWM` 驱动程序**：用于控制舵机、电调 (ESC) 和其他执行器。\n*   **模数转换器 (`ADC`) 驱动程序**：与模拟传感器接口，将模拟信号转换为数字数据。\n\
  \n## 飞行控制\n\n在 PX4 飞行控制架构中，模块代表协同管理无人机 (UAV) 操作各个方面的不同软件组件。这些模块协同工作，以确保采用全面且模块化的方法进行飞行控制。关键模块包括指挥官，负责解释高层命令和用户输入；导航器，管理任务规划、航点导航和飞行中的决策；以及估计器模块\
  \ (`EKF2`)，利用 `EKF` 基于传感器数据估计无人机的位置、速度和姿态。此外，姿态和速率控制器在稳定无人机方面发挥着关键作用，而执行器将控制命令转化为物理运动。传感器、混控器和\
  \ GPS 模块有助于数据采集、控制信号生成和精确导航。这些模块之间的相互作用定义了 PX4 飞行控制系统，确保了一个稳健且灵活的平台，适用于各种无人机应用。\n\
  \n## 结论\n\n总之，PX4 飞行栈代表了一个用于无人机控制的稳健且模块化的框架。凭借多样化的模块阵列，PX4 确保了精确的飞行控制、自主导航和对各种硬件设置的适应性。作为一个开源平台，它依靠社区贡献蓬勃发展，使其成为无人机爱好者和开发者的动态且持续演进的解决方案。探索\
  \ PX4 飞行栈可全面了解现代无人机控制系统背后的复杂性。\n\n# ArduPilot 飞行栈\n\nArduPilot 飞行栈是一个开源自动驾驶软件套件，旨在控制无人机。由全球社区开发，ArduPilot\
  \ 支持多种飞行器，包括多旋翼、固定翼飞机、直升机、地面无人车和船只。ArduPilot 包含硬件和软件组件，为无人机爱好者、研究人员和商业应用提供完整的解决方案。\n\
  \n虽然 ArduPilot 与 PX4 飞行栈有相似之处，但它们在设计理念和架构上存在关键差异。ArduPilot 的特点是单体架构，提供了一体化解决方案，其模块化组件比\
  \ PX4 少。它依赖于一个可适应各种飞行器类型的单一固件代码库。相比之下，PX4 遵循更模块化的面向微服务架构，允许更大的灵活性和对不同硬件及用例的适应性。在\
  \ ArduPilot 和 PX4 之间的选择通常取决于特定的项目需求、硬件兼容性和用户偏好。可在 [www.ardupilot.org](https://www.ardupilot.org)\
  \ 进一步学习 ArduPilot。\n\n## ArduPilot 飞行栈架构\n\n高层架构的框图如下图所示。\n\n![图 6.3 – ArduPilot\
  \ 高层架构图](img/B19566_06_3.jpg`)\n\n图 6.3 – ArduPilot 高层架构图\n\nArduPilot 飞行控制架构的特点是单体设计，将各种组件集成到单一固件代码库中。该架构旨在支持多种无人机，包括多旋翼、固定翼飞机、直升机、地面无人车和船只。以下是\
  \ ArduPilot 架构中的关键组件及其角色：\n\n*   **`ArduCopter`**：该模块负责多旋翼飞行器的控制和稳定，支持四轴、六轴和八轴等不同配置。\n\
  *   **`ArduPlane`**：专为固定翼飞机设计，`ArduPlane` 处理各类飞机的飞行控制、导航和任务规划。\n*   **`ArduRover`**：面向地面载具，`ArduRover`\
  \ 为陆地无人机（包括无人车和船只）提供控制和导航能力。\n*   **通用代码库**：ArduPilot 维护一个支持各种飞行器类型的通用代码库。这种集成方法简化了开发和固件更新。\n\
  *   **硬件抽象层 (`HAL`)**：ArduPilot 中的 `HAL` 抽象了底层硬件，使固件能轻松移植到不同的自动驾驶板上。\n*   **`AP_Motors`\
  \ 模块**：该模块管理电机输出和控制信号，确保不同飞行器类型的正确驱动。\n*   **`AP_Notify` 模块**：负责系统通知，`AP_Notify`\
  \ 有助于向用户或地面站 (GCS) 提供状态更新和警告。\n*   **`AP_Mission` 模块**：任务规划和执行由 `AP_Mission` 模块处理，支持自主航点导航和任务脚本编写。\n\
  \n虽然我们简要地看过了 ArduPilot 的结构，但让我们浏览一下前面的架构图，以简要了解各层级的主题。\n\n### UI/API\n\nUI/API 是指\
  \ ArduPilot 飞行栈接收命令的外部来源。UI/API 来源的一些示例如下：\n\n*   **地面站**：此处提到的地面站是 `GCS` 软件，安装在笔记本电脑或平板电脑上，作为配置和指挥无人机的\
  \ UI。\n*   **`DroneKit`**：`DroneKit` 是一个 Python API，帮助开发者开发应用程序通过通信层与无人机通信。`DroneKit`\
  \ 帮助开发者开发轻量级应用程序向无人机传递特定命令，而非完整的 `GCS`。如果我们想通过开发板（如 `Raspberry Pi`）与固件通信，这些应用程序很有用。\n\
  \n### 通信层\n\n通信层是飞行栈的一部分，有助于在 UI/API 和飞行控制器之间建立通信链路。`GCS` 正是通过这个通信层与无人机飞行代码进行通信的。\n\
  \n通信层的一个示例如下：\n\n*   **`MAVLink`**：正如我们之前介绍的，`MAVLink` 是一种轻量级通信协议，有助于在 `GCS` 和无人机之间传输和接收命令。\n\
  \n### 飞行代码\n\nArduPilot 飞行代码是指运行在自动驾驶硬件上并控制无人机操作的固件。该代码用 `C++` 编写，包含适用于不同类型飞行器的广泛功能，包括多旋翼\
  \ (`ArduCopter`)、固定翼飞机 (`ArduPlane`)、地面无人车 (`ArduRover`) 和船只。以下是 ArduPilot 飞行代码的更多细节：\n\
  \n\n\n# 特定机型代码\n\nArduPilot 中的特定机型代码是指固件中针对不同类型无人飞行器的独特特性和需求量身定制的部分。ArduPilot 支持多种机型，包括多旋翼（ArduCopter）、固定翼飞机（ArduPlane）、地面无人车（ArduRover）和无人艇。每种机型都有其自身的动力学特性、控制机制和操作考量，因此需要特定的代码以确保最佳性能。\n\
  \n以下是 ArduPilot 中特定机型代码结构的概述：\n\n## ArduCopter（多旋翼）\n\nArduCopter 代码包含特定于多旋翼飞行器的算法和控制逻辑。这涵盖了稳定、高度控制、GPS\
  \ 导航，以及自动起飞和降落等功能。特定机型参数，如电机混控和控制增益，均在此部分定义。\n\n## ArduPlane（固定翼飞机）\n\nArduPlane\
  \ 代码专注于固定翼飞机的独特特性。它包含用于维持稳定飞行、航点导航和自动降落的算法。与空速控制、导航模式和舵机输出相关的参数均为固定翼飞行器量身定制。\n\n\
  ## ArduRover（地面无人车）\n\nArduRover 代码专为地面载具（如无人车和汽车）设计。它包含转向、油门和制动的控制逻辑。导航功能（如航点跟随和避障）专门针对地面动力学特性。\n\
  \n## 艇艇和水面载具\n\n对于艇艇和水面载具，代码解决了水上导航的挑战。这包括推进、转向和水面稳定性的控制。\n\n# 共享库\n\nArduPilot\
  \ 主要使用 C++ 编写，并采用模块化架构以增强代码的可复用性和可维护性。然而，传统软件开发中常见的共享库概念可能无法直接适用于 ArduPilot。相反，ArduPilot\
  \ 使用带有库和模块的模块化方法。\n\n在 ArduPilot 中，共享库或模块是指封装特定功能的可复用代码组件。这些模块被设计为独立且可互换的，允许开发者在现有代码基础上构建并添加新功能，而不影响整个系统。\n\
  \n# 硬件抽象层\n\nArduPilot 中的 HAL，称为 `AP_HAL`，是一个关键组件，它抽象并封装了硬件特定细节，使自驾仪软件能在不同的飞控硬件上无缝运行。`AP_HAL`\
  \ 为访问外设、传感器、通信端口和其他硬件组件提供了标准化接口。通过采用 HAL，ArduPilot 实现了可移植性，使同一代码库能兼容各种自驾仪板卡。该抽象层简化了开发流程，因为开发者可以针对一致的\
  \ API 编写代码，而无需担心底层硬件的复杂性，从而促进了无人机系统设计的模块化和可扩展性方法。\n\n# 操作系统\n\n**Chibi 操作系统**（**ChibiOS**）是\
  \ ArduPilot 项目中使用的**实时操作系统**（**RTOS**）之一。ChibiOS 作为某些自驾仪板卡的底层操作系统发挥着关键作用，为任务管理、调度和底层硬件交互处理提供了框架。以下是\
  \ ChibiOS 在 ArduPilot 中作用的简要说明：\n\n*   **RTOS 功能**：ChibiOS 是一个专为嵌入式系统设计的开源 RTOS，它提供了无人机应用所必需的实时能力。\n\
  *   它便于任务调度、中断处理和高效的资源管理，确保关键飞行控制过程的及时且确定性执行。\n*   **硬件抽象**：ChibiOS 在 ArduPilot\
  \ 中充当 HAL，使飞控代码能以一致的方式与各种传感器、外设和通信接口交互。\n*   这种抽象简化了开发流程，并增强了跨不同自驾仪硬件的可移植性。\n* \
  \  **并发与多线程**：ChibiOS 支持多任务并发执行，使自驾仪能同时处理多种操作。\n*   这对于并发管理传感器读数、控制计算、通信和导航等任务至关重要。\n\
  *   **底层硬件交互**：ChibiOS 提供了用于与特定硬件组件（包括定时器、串口和 I2C 总线）交互的底层驱动和抽象。\n*   这使 ArduPilot\
  \ 开发者能在更高层级编写代码，而无需直接处理硬件寄存器和配置的复杂性。\n*   **可移植性**：使用 ChibiOS 的主要优势之一是其跨不同微控制器架构的可移植性。\n\
  *   ArduPilot 可在各种自驾仪板卡上利用 ChibiOS，确保与多样化硬件平台的灵活性和兼容性。\n\n# 外部传感器\n\n在 ArduPilot\
  \ 中，外部传感器是指可连接到自驾仪系统以增强其感知和数据收集能力的额外传感器。这些传感器可提供主飞控集成传感器之外的补充信息，从而实现更精确的导航、控制和决策。ArduPilot\
  \ 中外部传感器的示例包括以下内容：\n\n*   **激光雷达或激光测距仪**：激光雷达传感器常用于通过发射激光束并测量其返回时间来测量距离。\n*   它们提供高精度高度信息，并协助地形跟随和避障。\n\
  *   例如 LightWare SF20 激光雷达。\n*   **雷达高度计**：雷达高度计测量飞行器到地面的距离，对于精确的高度控制特别有用，尤其是在低空飞行期间。\n\
  *   它们有助于更安全的起降。\n*   例如 TeraRanger Tower。\n*   **光流传感器**：光流传感器利用视觉信息估算飞行器位置的变化。\n\
  *   它们在 GPS 信号可能不可靠的场景中很有用，例如室内环境或低空飞行期间。\n*   例如 PX4Flow 光流传感器。\n*   **GPS/指南针模块**：虽然\
  \ GPS 集成在许多飞控中，但带有集成指南针的外部 GPS 模块提供了冗余并提高了姿态估计的准确性。\n*   例如 u-blox M8N GPS 模块。\n\
  *   **空速数据传感器**：这些传感器测量空速、气压和温度，为精确的高度控制和空速估计提供关键数据。\n*   例如 MS5611 气压计。\n*   **磁力计模块**：外部磁力计可用于获取更精确的指南针读数，减少机载其他电子设备磁干扰的影响。\n\
  *   例如 HMC5883L 磁力计。\n\n# 总结\n\n在本章中，我们浏览了不同的固件，涵盖了 PX4 和 ArduPilot 的结构与架构，这些固件将帮助您了解无人机飞行栈的构建模块。我们还参考了开源固件栈\
  \ PX4 和 ArduPilot，它们是无人机领域的领导者。\n\n在下一章中，我们将了解地面站（GCS）及其操作，这将有助于配置无人机和执行自主任务。\n"
- "## 第 7 章：地面站软件简介\n\n\n\n在本书的前几章中，我们学习了主要的无人系统、其子系统以及硬件侧的传感器。我们还学习了固件，它作为硬件和软件之间的纽带使系统运行，以及命令与控制软件的基础知识，称为地面控制软件，包括其不同的类型和用法。在本章中，我们将学习用于指挥、控制和设置无人机飞行的地面控制软件的深度用法。**地面控制站**（**GCS**）还用于在飞行期间传输和接收实时遥测数据，并在无人机以手动和自主模式飞行时监控其导航和传感器健康状况。我们将介绍不同种类的\
  \ GCS 系统，以及如何在 GCS 的帮助下控制和配置无人机。\n\n在本章中，我们将涵盖以下主题，这些主题将帮助我们了解 GCS 及其在无人机中的用法。通过学习这些内容，你将能够在桌面端或移动端下载并安装\
  \ GCS，将其连接到你构建的无人机，对其进行配置，并以你想要的模式飞行。\n\n以下是本章将涵盖的主要主题：\n\n*   GCS 简介\n*   市场上可用的主要\
  \ GCS 软件\n*   AeroGCS 软件概览\n*   连接无人机的方法\n*   自主任务规划\n\n# 技术要求\n\n为了安装和运行所讨论的 GCS\
  \ 软件，建议使用配备基于 x64 的 i5 1.9 GHz CPU 或更高配置、至少 30 GB 可用空间和 8 GB 内存的计算机/台式机。建议配备 1 GB\
  \ 显卡和 `USB 2.0` 接口。我们将使用具有相同配置的笔记本电脑/台式机来下载和安装 GCS 软件。\n\n计算机/笔记本电脑至少需要 `Windows\
  \ 10` 或 `Ubuntu 20.xx LST` 版本。系统应具备 `LAN` 或 `Wi-Fi` 连接功能，以及 1,366 x 768 的横向分辨率。\n\
  \n如果你计划使用基于移动端的 `Android` 版本，则应具备 USB 网络共享功能或 Wi-Fi。\n\n# GCS 简介\n\nGCS 软件通过为用户提供统一的界面来与无人机交互和控制，在无人机运行中发挥着关键作用。作为操作员与飞行器之间的桥梁，GCS\
  \ 软件实现了实时监控、任务规划和数据分析。这些应用程序是爱好者和专业人士的必备工具，提供了一个用户友好的平台来指挥和监督无人机的飞行。GCS 软件通常提供实时遥测、航点导航、相机控制以及可视化和分析飞行数据的能力。无论是对于娱乐无人机爱好者、研究人员还是商业无人机操作员，设计良好的\
  \ GCS 软件都能提升用户体验，确保无人机任务的安全、高效和可控。\n\n市场上有各种类型的 GCS 软件可供选择，满足从爱好者到专业操作员等不同用户的需求。以下是一些常见类型：\n\
  \n*   **开源 GCS**：开源 GCS 软件免费提供，通常由无人机社区协作开发。它提供任务规划、遥测数据可视化和参数调整等功能。Mission Planner\
  \ 常用于基于 `ArduPilot` 的无人机，而 QGroundControl 则流行于基于 PX4 的飞行器。\n\n    **示例**：Mission\
  \ Planner 和 QGroundControl。\n\n*   **专有 GCS**：专有 GCS 解决方案由无人机制造商为其特定硬件开发。大疆的 GCS\
  \ 软件，如 DJI GO 和 GS Pro，专为其无人机平台量身定制。这些应用程序通常与制造商的硬件无缝集成，并提供智能飞行模式和专业航拍工具等高级功能。\n\
  \n    **示例**：DJI GO 和 DJI GS Pro。\n\n*   **基于云的 GCS**：基于云的 GCS 解决方案允许用户通过在线平台规划、监控和分析无人机任务。这些服务通常提供飞行日志记录、任务规划和数据分析等功能。例如，DroneDeploy\
  \ 使用户能够规划飞行、获取航拍图像，并处理用于测绘和勘测应用的数据。\n\n    **示例**：Airdata UAV 和 DroneDeploy。\n\n\
  *   **移动端 GCS 应用**：移动端 GCS 应用运行在智能手机或平板电脑上，为无人机操作员提供便携式解决方案。Litchi 为大疆无人机提供高级任务规划工具，而\
  \ PIX4Dcapture 专为测绘和摄影测量任务设计。这些应用通常具有直观的界面和实时遥测功能。\n\n    **示例**：Litchi 和 PIX4Dcapture。\n\
  \n*   **企业级 GCS**：企业级 GCS 解决方案面向专业和工业无人机应用。它们通常包括高级任务规划工具、机队管理以及与其他企业系统的集成。例如，UgCS\
  \ 支持多种无人机平台，并提供电子围栏和多飞行器协同等功能。\n\n    **示例**：UgCS 和 PrecisionFlight。\n\n*   **仿真\
  \ GCS**：仿真 GCS 工具允许用户在虚拟环境中练习和测试无人机任务。这些应用对于培训目的以及在实际飞行操作前优化任务计划非常有价值。\n\n    **示例**：Mission\
  \ Simulator。\n\n因此，我们已经了解了不同类型的 GCS。在接下来的章节中，我们将研究市场上可用的各种 GCS。\n\n# 市场上可用的主要 GCS\
  \ 软件\n\n在快速发展的无人机领域，复杂 GCS 软件的可用性已成为塑造无人机操作成功的关键因素。众多 GCS 解决方案面向从爱好者、发烧友到专业操作员和企业等多样化的用户群体。本概览将探讨市场上一些主要的\
  \ GCS 选项，每种选项都提供独特的功能和能力，以增强无人机任务的规划、控制和监控。\n\n## Mission Planner 或 APM Planner\n\
  \nMission Planner 或 APM Planner 是一款由开源无人机社区支持、Michael Oborne 开发的开源软件，专门用于搭载 `ArduPilot`\
  \ 固件（`www.ardupilot.org`）的无人机。这款 GCS 功能强大，可配置用于固定翼、多旋翼和地面车。目前，该软件仅兼容 Windows，但通过安装名为\
  \ `mono` 的模块，也可配置到 Linux 机器上。\n\nMission Planner 可从 `https://firmware.ardupilot.org/Tools/MissionPlanner/MissionPlanner-latest.msi`\
  \ 下载。\n\n以下屏幕截图显示了 Mission Planner 的标准仪表板（主屏幕）：\n\n![图 7.1 – Mission Planner GCS\
  \ 的仪表板（主屏幕）](img/B19566_07_1.jpg`)\n\n图 7.1 – Mission Planner GCS 的仪表板（主屏幕）\n\n\
  ### 主要功能\n\nMission Planner 是一款多功能的 GCS 软件，让你能完全控制你的系统，从配置和调参到飞行和调试。它提供了一系列额外的外设供你根据应用需求连接到无人机上，以便进行配置和测试。它主要专注于提供任务规划、飞行器监控和配置管理工具。以下是\
  \ Mission Planner 的一些常见功能：\n\n*   **飞行规划**：它提供了通过指定航点、高度和其他参数来规划自主飞行任务的优势。可以在此基础上设计复杂的任务。\n\
  \n*   **实时遥测**：屏幕上可以看到实时遥测数据，包括飞行器的位置、高度、速度和传感器健康信息。这有助于用户在操作过程中监控其飞行器的状态。\n\n\n\
  \n# 地面控制站软件概览\n\n## Mission Planner\n\nMission Planner 的主要功能包括：\n\n*   **配置与校准**：用于配置和校准飞行器的各种参数，如无线电设置、电机和传感器校准以及其他硬件配置。\n\
  *   **数据记录**：支持飞行数据记录，用户可在任务结束后回顾和分析飞行器性能。这些数据对故障排查和提升飞行器能力至关重要。\n*   **固件更新**：用户可通过\
  \ Mission Planner 更新飞行器固件，更新通常包含改进、错误修复和新功能。\n*   **相机控制**：允许用户控制和配置搭载相机或云台的飞行器的相机设置，特别适用于航拍和测绘任务。\n\
  *   **电子围栏**：支持创建电子围栏，即限制飞行器移动的虚拟边界，确保飞行器停留在指定区域内。\n*   **仿真**：用户可在虚拟环境中模拟任务，再在现实中执行。这有助于在不损坏飞行器的风险下测试和优化任务计划。仿真提供飞行器和环境的\
  \ 2D 视图，并显示来自传感器的实时数据。\n*   **手柄支持**：通常兼容手柄和其他输入设备，必要时可手动控制飞行器。\n*   **任务分析**：任务结束后，用户可分析记录的数据，包括飞行路径、高度和其他相关信息，以评估任务成功程度并找出改进空间。\n\
  \n除上述关键功能外，Mission Planner 还提供无人机编队和 MAVLink 数据包签名等高级工具以增强安全性。该 GCS 软件在一处提供飞行日志和分析，无需第三方软件进行日志分析。\n\
  \n要了解 Mission Planner 的配置、设置和飞行规划，可查阅 ArduPilot 页面。\n\n## QGroundControl\n\nQGroundControl\
  \ 是另一款知名 GCS，由开源无人机社区管理和开发，用于 PX4 和 ArduPilot 飞行器的全程飞行控制和设置。与其他 GCS 软件一样，QGroundControl\
  \ 提供从固件安装到飞行记录和分析的完整车辆设置流程。QGC 兼容 Windows、Linux 和 Android，可从 <http://qgroundcontrol.com/>\
  \ 下载。\n\nQGroundControl 的基本原理与其他无人机系统相同：MAVLink 为通信协议，飞行栈为 ArduPilot 或 PX4。\n\n\
  QGroundControl 的主要功能包括：\n\n*   支持任何支持 MAVLink 协议的飞行栈\n*   提供系统的完整设置和配置\n*   协助手动和自主飞行\n\
  *   支持 Bing 和 Google Maps 等多种地图用于任务规划\n*   支持内置视频传输\n*   兼容几乎所有操作系统\n*   可用于测绘、监视和农业等多种应用\n\
  \n下图显示了 QGroundControl 站的仪表盘或主屏幕：\n\n![图 7.2 – QGroundControl 任务规划模式下的主屏幕](img/B19566_07_2.jpg)\n\
  \n图 7.2 – QGroundControl 任务规划模式下的主屏幕\n\n图中显示了飞行窗口和一个准备开始的计划任务。\n\n## UgCS\n\nUgCS\
  \ 是一款用于不同类型无人机任务规划和执行的高级 GCS 软件。UgCS 非开源软件，而是需要许可证并按年收费的专有软件；但也提供功能受限的免费版本。该软件兼容\
  \ ArduPilot、PX4、DJI、Parrot 和 Autel 等多种飞行栈，因此支持多种类型的无人机。UgCS 兼容 Windows 和 macOS。\n\
  \nUgCS 可从 <https://www.sphengineering.com/support> 下载。\n\n下图显示了 UgCS 任务规划软件，指示无人机系统健康状态、遥测数据和任务计划：\n\
  \n![图 7.3 – UgCS 任务规划软件的屏幕截图](img/B19566_07_3.jpg)\n\n图 7.3 – UgCS 任务规划软件的屏幕截图\n\
  \nUgCS 具有独特功能、用户界面且操作简单，使其与其他控制站区别开来。其主要功能如下：\n\n*   可创建线性或圆形航点，支持区域和周长扫描\n*   支持\
  \ 2D 和 3D 地图，便于任务视图和地形跟随\n*   支持特定的 LiDAR 工具用于 LiDAR 传感器\n*   支持多 SDK 连接以进行自定义开发\n\
  *   优秀的 3D 任务规划环境\n\n以下是 Mission Planner、QGroundControl 和 UgCS 的简要对比表：\n\n| 功能特性\
  \ | Mission Planner | QGroundControl | UgCS |\n| --- | --- | --- | --- |\n| 平台兼容性\
  \ | Windows（主要），可适配其他平台 | 跨平台（Windows、macOS、Linux 和 Android） | Windows、macOS 和各种\
  \ Linux 发行版 |\n| 开发状态 | 社区驱动，在 GitHub 上积极维护 | 开源，由 PX4 社区积极开发 | 商业软件，提供更新和支持 |\n\
  | 集成 | 与 ArduPilot 固件相关联 | 基于 PX4 飞行栈开发，支持其他 | 兼容各种自动驾驶仪，包括 DJI |\n| 自动驾驶仪支持 | 主要面向基于\
  \ ArduPilot 的飞行器 | 专为基于 PX4 的飞行器设计，支持其他 | 兼容广泛的自动驾驶仪 |\n| 用户界面 | 具有各种工具的综合界面 | 用户友好，强调简洁性\
  \ | 直观的界面，平衡简洁性与深度 |\n| 社区支持 | GitHub 上活跃的社区贡献 | 由 PX4 社区支持 | 商业软件，提供用户支持 |\n| 高级功能\
  \ | 侧重任务规划、遥测、配置 | 平衡简洁性与高级功能 | 测绘和农业等高级功能 |\n| 硬件支持 | 广泛支持，特别是基于 ArduPilot 的无人机\
  \ | 兼容多种自动驾驶仪 | 支持各种自动驾驶仪，包括 DJI 和 ArduPilot |\n| 许可证 | 开源 (GPLv3) | 开源 (Apache\
  \ 2.0) | 商业许可，提供免费版本 |\n| 使用场景侧重 | 任务规划、遥测、配置 | 任务规划、遥测、仿真 | 专业应用、高级功能 |\n\n表 7.1\
  \ – Mission Planner、QGroundControl 和 UgCS 的对比表\n\n除上述 GCS 软件外，还有许多可用于指挥和控制无人机的软件，但我们仅选取这些软件进行基本概览，不作深入探讨。不过，这些软件的基本功能是相似的。在后续章节中，我们将深入了解另一款名为\
  \ AeroGCS 的专有 GCS，学习如何使用该软件设置和配置无人机。我们将把 AeroGCS 作为 GCS 进行研究，并学习如何配置无人机和规划成功的任务。\n\
  \n# AeroGCS 软件概览\n\n\n\n\n# AeroGCS\n\nAeroGCS 是由总部位于印度的 AeroGCS 公司开发的专有 GCS，用于无人机配置、驾驶、机群管理和无人机项目管理。该软件提供多个版本，可在笔记本电脑或手机上运行。AeroGCS\
  \ 软件的优势在于它极大地帮助飞行员规划任务，并在基于云的环境中工作，随时随地提供数据访问。通过使用它，您可以将任务数据存储在云端，并监控不同无人机在不同项目上的协同工作。\n\
  \n与其他 GCS 软件一样，AeroGCS 有助于规划任务、设置参数，并对无人机拥有完整的指挥和控制权。AeroGCS 软件基于 MAVLink 协议；因此，它兼容\
  \ PX4、ArduPilot 或任何基于 MAVLink 的飞控栈。然而，由于 PX4 和 ArduPilot 飞控栈具有简洁性和丰富的用户界面，因此最受青睐。\n\
  \n要下载软件，请访问 `https://aeromegh.com/aerogcs-kea/`。\n\n## AeroGCS 主仪表盘\n\n仪表盘是主要的 AeroGCS\
  \ 窗口，包含操作远程驾驶航空器所需的不同参数设置及其指定值和条件。图 7.4 显示了登录软件后看到的界面。现在，我们将浏览仪表盘上用于处理无人机操作的不同快捷方式以及各种信息。\n\
  \n![图 7.4 – AeroGCS 仪表盘](img/Image96480.jpg`)\n\n图 7.4 – AeroGCS 仪表盘\n\n右上角的顶栏如下所示：\n\
  \n![图 7.5 – AeroGCS 仪表盘中的顶栏选项](img/B19566_07_5.jpg`)\n\n图 7.5 – AeroGCS 仪表盘中的顶栏选项\n\
  \n各项如下：\n\n1.  **云同步**：此功能可供现场飞行员直接将任务计划、拍摄的图像等管理并上传至云端，以便通过 **AeroMegh** 云服务平台中包含的\
  \ **团队访问管理** 功能直接与团队成员共享信息。这有助于确保管理者和团队成员查看到的是正在进行的项目的最新信息。\n\n2.  **直接飞行视图**：**直接飞行视图**\
  \ 按钮可直接带您进入导航栏，飞行员可在其中查看与无人机相关的数据，如纬度、经度、速度和方向。\n\n3.  **连接设备**：此按钮有助于连接 GCS 和无人机。这是关键步骤；无人机在飞行前应完全连接到软件。我们需要选择可用的最佳协议（例如串口、TCP\
  \ 或 UDP）进行无人机连接。可根据应用选择不同的波特率。\n\n4.  **RPA 配置**：可通过此按钮访问进一步的无人机设置。RPA 此处指远程驾驶航空器。\n\
  \n5.  **通知**：通知按钮可帮助我们查看飞行期间发生的一切实时消息，如警告、飞行日志、发送和接收命令。此通知还包括发送飞行计划、解锁电机、起飞和降落等关键消息。\n\
  \n6.  **互联网连接**：互联网连接选项显示 AeroGCS 是否连接到互联网；如果未连接，则图标会显示划线状态。\n\n## AeroGCS 主菜单\n\
  \nAeroGCS 主窗口是用于配置无人机不同功能的关键导航窗口。以下是主菜单，显示了可供用户使用的不同选项：\n\n![图 7.6 – AeroGCS 的主菜单](img/B19566_07_6.jpg`)\n\
  \n图 7.6 – AeroGCS 的主菜单\n\n我们将简要了解一下 **常规设置** 选项。\n\n常规设置是指 AeroGCS 软件的基本操作设置；您可以使用它来创建个人资料、选择喜欢的主题、查看天气设置，并根据需要更改度量单位。以下是\
  \ **常规设置** 中可用的选项：\n\n*   **AeroMegh 登录**：由于 AeroGCS 是专有软件，需要年度许可证才能登录以访问用户资料并管理该资料和项目。以下是登录页面：\n\
  \n![图 7.7 – AeroGCS 的登录窗口](img/B19566_07_7.jpg`)\n\n图 7.7 – AeroGCS 的登录窗口\n\n* \
  \  **主题**：用户可以从此设置更改主题。默认主题为 **AeroGCS 浅色**，可更改为 **AeroGCS 深色**。应用程序必须重新启动更改才能生效。以下是主题更改选项的屏幕截图：\n\
  \n![图 7.8 – AeroGCS 中的主题选择](img/B19566_07_8.jpg`)\n\n图 7.8 – AeroGCS 中的主题选择\n\n\
  *   **天气设置**：通过在选项卡中准确选择城市来应用天气设置。这会考虑当前天气：\n\n![图 7.9 – 用于选择城市以获取天气预报的选项](img/B19566_07_9.jpg`)\n\
  \n图 7.9 – 用于选择城市以获取天气预报的选项\n\n*   **单位设置**：根据飞行员和系统的便利性，飞行前需要进行单位设置，以反映所需的单位制。单位设置涵盖飞行员所需的主要参数，如距离、面积、速度和温度。全球各地遵循不同的单位惯例；因此，这对全球飞行员很有用：\n\
  \n![图 7.10 – 不同物理量的单位选择](img/B19566_07_10.jpg`)\n\n图 7.10 – 不同物理量的单位选择\n\n用户可以为以下项目设置单位：\n\
  \n*   **距离**：用户可将距离单位设置为 **米** 或 **英尺**\n*   **面积**：面积单位可从下拉列表中设置为所需单位，如下截图所示：\n\
  \n![图 7.11 – 单位选择](img/B19566_07_11.jpg`)\n\n图 7.11 – 单位选择\n\n*   **速度**：根据要求设置飞行器的速度单位\n\
  *   **温度**：温度单位可设置为 **华氏度** 或 **摄氏度**\n\n因此，从前面的介绍中，我们已经了解了如何配置 AeroGCS 的常规设置。现在，我们可以继续了解如何配置\
  \ **远程驾驶航空器** (**RPA**) 或无人机。我们不会涵盖通过 AeroGCS 进行的完整设置；我们将只涵盖基本和入门部分。要完全了解此软件，您可以访问他们的网站\
  \ (`https://www.aeromegh.com`) 并查阅他们的教程。\n\n## 连接无人机的方法\n\n将无人机连接到 GCS 是在进行任何进一步步骤之前应遵循的主要步骤。根据通用理解，我们只有在通过\
  \ USB 线缆或射频模块连接到无人机后，才能访问内部参数并对无人机进行编程。无人机、GCS 和遥控器之间应有适当的通信。飞行员提供正确的设置和方法来连接无人机至关重要，我们可以在以下屏幕截图中看到这一点。此外，强烈建议您阅读并查阅您正在使用的无人机的制造商手册或数据手册。我们将采用\
  \ RFD900 型号和串口连接：\n\n1.  点击仪表盘顶栏（或主菜单）上的 **连接** 图标以连接无人机。\n\n2.  我们需要在开始项目前连接无人机。对于任何要求您连接的提示，请选择“是”。在以下屏幕截图中，我们可以看到将无人机连接到\
  \ GCS（笔记本电脑/平板电脑/计算机）的第三个选项。我们在前几章中已经学习了连接无人机的不同方式，例如使用 RFD/USB：\n\n![图 7.12 – 连接选项](img/Image96554.jpg`)\n\
  \n图 7.12 – 连接选项\n\n\n\n\n# 将无人机连接到 GCS\n\n在下面的屏幕截图中，我们可以看到一个弹出窗口；软件请求将设备连接到它。单击\
  \ `Yes` 后，通过无线电模块将无人机连接到 GCS 的后续步骤将会出现。这将要求您选择我们要用来连接无人机的协议以及各种其他参数配置选项：\n\n![图\
  \ 7.13 – 连接无人机的提示](img/Image96562.jpg)\n\n图 7.13 – 连接无人机的提示\n\n以下是建立上述任意方法连接的步骤：\n\
  \n1.  选择通信链路。可以是 `Serial`、`TCP` 或 `UDP`。根据您选择的通信设备选择合适的链路，如下面的屏幕截图所示。既然我们提到了使用 RFD\
  \ 900，我们将继续选择 `Serial` 连接：\n\n![图 7.14 – 连接设置](img/B19566_07_14.jpg)\n\n图 7.14 –\
  \ 连接设置\n\n既然我们选择了串行连接，我们将继续查看与此选项相关的设置。\n\n1.  当我们使用串行协议（如 UART）和串行射频模块（如 RFD 900\
  \ 433Mhz）通过 USB 连接无人机时，需要设置 `Serial Port`。由于这些设备基于串行协议工作，必须在顶部选择 `Serial`：\n\n![图\
  \ 7.15 – 串口设置](img/B19566_07_15.jpg)\n\n图 7.15 – 串口设置\n\n继续之前需要设置一些参数，如下所示：\n\n\
  *   **`Serial Port`**：当我们通过 USB 连接 RFD 900 或任何其他模块时，它会建立自己的通信端口，通过该端口可以访问模块。此通信端口将出现在\
  \ `Serial Port` 的下拉菜单中。\n*   **`Baud rate`**：我们知道在串行通信中，数据通过在传输介质中将比特（数字数据）从一个设备传输到另一个设备来进行通信。波特率是指信号元素的数量或信号每秒发生变化的次数（当其通过传输介质时）。波特率越高，数据发送/接收的速度越快。对于通过\
  \ USB 线缆的有线通信，波特率通常为 115,200；对于无线连接，如果连接到飞控，则为 57,600。\n*   **`Data bits`**：通过串口传输的任何消息都是通过数据位发送的。这些可以是命令、传感器读数、错误消息等。大多数串口使用\
  \ 5 到 8 个数据位进行传输，文本数据使用 7 或 8 位传输。这些位用于以 ASCII 格式表示数据中的字符。\n*   **`Parity`**：奇偶校验是一种错误检查程序，它使用传输位中包含的\
  \ 1 的个数。对于无错误传输的每组位，1 的个数必须始终相同，要么为奇数，要么为偶数。\n\n单击窗口右上角的 `Connect`，无人机应连接到 GCS。\n\
