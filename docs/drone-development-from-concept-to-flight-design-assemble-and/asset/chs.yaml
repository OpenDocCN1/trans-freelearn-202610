  \ 米。飞行的无人机搭载相机作为载荷，并按特定间隔拍摄区域图像。这些图像带有地理标签，稍后用于创建整个区域的地图。由于测绘是一项重要的工业应用，这些任务预先加载好，并可通过调整一些参数进行配置，以获得富有成果的结果。以下屏幕截图显示了测绘规划任务的典型视图：\n\
