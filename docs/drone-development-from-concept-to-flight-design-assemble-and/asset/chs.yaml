- '## 第 8 章：理解飞行模式与任务规划


  ### 理解飞行模式与任务规划


  在本书前面的章节中，我们探讨了各种**地面站**（**GCS**）操作和功能，以及它们如何帮助实时指挥和控制无人机。我们还了解了 GCS 如何通过其众多界面来配置无人机及其各种外围设备。在前几章中，我们学习了如何配置无人机，以便它可以使用由
  ArduPilot 和 PX4 的相关开发者预先配置好的不同飞行模式。在本章中，我们将了解这些飞行模式是什么，它们如何帮助飞行员驾驶无人机，以及它们使用哪些传感器。本章将帮助您了解无人机飞行时所处的不同飞行模式，以及如何使用遥控器或
  GCS 激活这些飞行模式。这反过来将帮助您更多地了解如何使用遥控器或 GCS 驾驶无人机。


  在本章中，我们将涵盖以下主题，因为它们将帮助我们理解每种飞行模式及其设置方法：


  *   飞行模式与类型

  *   通过遥控器分配飞行模式

  *   在 GCS 中分配和更改飞行模式

  *   规划和执行自主航点任务


  # 技术要求


  对于本章，您需要了解 IMU 传感器的工作原理及其运作方式。您还需要具备基本的物理知识和设备操作技能。除此之外，您还需要阅读预先存在的飞行栈（如 ArduPilot
  和 PX4）的文档，因为我们将讨论在这两个飞行栈中开发的基础知识。


  # 飞行模式与类型


  飞行模式是预定义的设置，它们控制自动驾驶系统在飞行期间如何指挥无人机的行为。它们还定义了要使用哪些传感器以及允许飞行员进行多少手动干预。总之，飞行模式是一组指令，帮助自动驾驶系统在飞行时按预定方式运行。


  我们可以使用 GCS 或直接通过遥控器设置飞行模式；因此，飞行员可以根据情况轻松在两种飞行模式之间切换。




  # 飞行模式


  一般来说，我们可以认为飞行模式可帮助飞行员更轻松地驾驶无人机。它们允许控制某些参数，如高度和位置，这有助于飞行员平稳地驾驶无人机，因为自动驾驶仪会根据其传感器读数以及飞行员提供的输入响应来接管无人机的控制权。“飞行模式”一词在各种无人驾驶载具中很常见，例如多旋翼、固定翼飞机和地面车辆。所有载具根据其物理结构和预期任务的不同，在不同种类的飞行模式下会有不同的响应。


  在接下来的几节中，我们将讨论什么是飞行模式，以及如何使用遥控器或 GCS（地面站）来设置它们。设置飞行模式是为飞行配置载具时最重要的部分，因为它告诉载具飞行员是如何驾驶无人机的，以及载具应如何响应。


  ## 飞行模式的类型


  正如我们之前讨论的，可以在多旋翼上实现多种类型的飞行模式开关，以实现平稳且轻松的飞行。这些飞行模式取决于无人系统的类型及其配置。本节将仅研究多旋翼中使用的模式，同时考虑到广泛使用的
  ArduPilot 和 PX4 飞控软件栈。


  根据飞控使用的输入，飞行模式可分为三类：**手动**、**半自主**和**自主**。每种模式都需要飞控使用某些机载传感器，如 GPS 和气压计。对于每种飞行模式，必须有输入传给飞控，来源可以是机载传感器，也可以是外部源（如遥控器）。有时，它们会同时使用机载传感器和遥控器来保持水平并完成所需飞行模式下的指令。飞行模式的例子包括手动、定位、定高和稳定模式。


  这些飞行模式还根据其等级（从初级到专家）进行分类。正在学习遥控器摇杆控制的初级飞行员会使用半自主模式，在这种模式下无人机可在空中自行水平，初级飞行员只能控制其前进、后退和侧向移动——即滚转、俯仰和偏航——这有助于飞行员了解无人机飞行的基础知识。然后飞行员可以进阶使用一些专家模式，如自主和手动模式。某些飞行模式用于高速飞行，如手动和特技模式，以让无人机完成特技动作和翻滚。让我们看看有哪些可用的飞行模式可以帮助飞行员。对于初级飞行员，起飞和降落等手动操作也可以在
  GCS 提供的自动指令帮助下自主完成。


  由此，我们看到了飞行模式的重要性。它们是设置无人机飞行的主要方式。现在，让我们了解不同种类的飞行模式以及如何设置它们。


  ### 手动模式/稳定模式


  手动模式是一种飞行模式，飞行员对无人机拥有完全控制权，飞控不参与控制。无人机的移动掌握在飞行员的摇杆手中，无人机根据飞行员给出的输入移动，因此得名**手动模式**或**稳定模式**。在此模式飞行时，自动驾驶系统不接收来自传感器的任何输入。飞行员必须能看见无人机并驾驶它。这是一种高级飞行模式，需要良好的经验和对遥控器的肌肉记忆，才能在空中稳定无人机并正确飞行。


  当居中的滚转和俯仰摇杆使载具水平，但载具位置必须通过滚转俯仰摇杆手动管理，高度（上升和下降）通过油门摇杆管理时，我们称此模式为完全遥控器模式。偏航由油门摇杆的左右旋转控制。


  滚转和俯仰摇杆还控制载具的角度——即**姿态**。一旦我们释放控制摇杆，它们就会回到中心点，载具将保持在原地悬停。它将在机械上保持平衡并维持其高度，除非施加外力。


  下图展示了遥控器中的手动飞行模式和稳定实现，以及无人机的行为。遥控器通常由许多开关和电位器组成，它们帮助我们控制和配置连接到无人机的外设：


  ![图 8.1 – 手动模式飞行](img/B19566_08_1.jpg)


  图 8.1 – 手动模式飞行


  ### 半自主模式


  正如之前讨论的，半自主模式是指飞行模式，其中飞控利用其主要传感器提供部分输入以使无人机水平，但主要输入（如高度和滚转俯仰力矩）由飞行员提供。这些也称为辅助模式，因为飞行员在飞控和传感器的辅助下，可确保位置和高度方面的平稳性。让我们看看一些可用的辅助模式。


  #### 定位模式


  定位模式是一种简单的飞行模式，对驾驶多旋翼的初学者很有帮助。在此模式下，滚转和俯仰摇杆控制相对于地面的加速度，使载具前进、后退、左移和右移，而油门摇杆控制无人机的上下移动。当你释放遥控器摇杆时，无人机会停止——即载具停止加速并保持在原位。因为是辅助模式，飞控利用
  GPS 锁定无人机当前飞行的位置，并持续保持该位置，不受风等不同外力的影响。这是对初学者最安全的飞行模式：


  ![图 8.2 – 处于定位模式的无人机](img/B19566_08_2.jpg)


  图 8.2 – 处于定位模式的无人机


  #### 姿态保持模式


  姿态保持模式也是一种相对简单的遥控飞行模式，其中滚转和俯仰摇杆控制左右和前后方向的运动，偏航摇杆控制无人机的顺时针和逆时针移动，油门摇杆控制无人机如何上升和下降。


  当这些摇杆被释放时，它们会回到遥控器上的中心位置，因此无人机也会水平并保持当前高度。这里的重要一点是，与定位模式不同，无人机不会保持其位置，而是保持其高度。飞控将利用其气压传感器或高度计传感器（如果已安装）来维持飞行员设定的当前高度。


  因此，我们可以认为，在此模式下，无人机不会像在定位模式那样保持其相对于地面的位置。飞行员必须使用滚转和俯仰摇杆手动控制无人机以控制其位置。然而，飞控会控制其高度，该高度由飞行员固定：


  ![图 8.3 – 处于姿态保持模式的无人机](img/B19566_08_3.jpg)


  图 8.3 – 处于姿态保持模式的无人机


  ### 自主模式


  自主模式是不需要飞行员通过遥控器输入的飞行模式；相反，这些模式完全自主，可通过 GCS 进行规划。让我们考虑一下可以通过 GCS 或遥控器（通过分配模式开关）切换的不同模式。


  #### 悬停模式





  # 飞行模式


  ## 定点模式


  顾名思义，`hold mode` 有助于在无需飞行员输入的情况下，将无人机保持在其当前的 `GPS` 位置和相应高度。这有助于使无人机保持水平。在此模式下，`flight
  controller` 会接收来自 `GPS sensor` 和 `barometer sensor` 的帮助，将无人机锁定在特定的 `GPS` 坐标和姿态上。因此，无人机可以抵抗风力或任何其他外力而保持位置。此模式可用于暂停任务，并在紧急情况下重新获得对无人机的控制权。此模式也可通过
  `GCS` 配置，或分配给 `remote control` 上的任意开关以激活它。


  ## 返航模式


  `Return mode` 是无人机中最重要的恢复模式，因为它帮助飞行员将无人机带回其原始起飞位置。这有助于无人机飞行一条清晰的路径到达安全位置，并且可以手动、通过
  `remote control` 或通过故障保护来激活。此模式可配置为在任何故障保护条件下激活，例如电量低、数据链路丢失或电子围栏闯入。此模式下的行为可在飞行前由
  `GCS` 根据环境条件进行配置和决定。此模式利用 `GPS` 位置，因此会引导无人机自动飞往该特定位置，然后再返回其原始起飞位置，因此得名。


  ## 任务模式


  顾名思义，在 `mission mode` 下，无人机执行由 `GCS` 编程的预定义任务。在编程任务时，飞行员可以为无人机设置不同高度、不同期望速度的航点。切换到
  `mission mode` 后，无人机会穿越不同高度的各个航点。在此模式下，无人机在返回前会使用其所有 `IMU sensors` 和额外的外围设备。


  ## 起飞模式


  `Take-off mode` 可帮助我们在不使用 `remote controller` 的情况下进行自动起飞，方法是通过 `GCS` 给无人机设定一个合适的高度。无人机自动达到该高度后，会进入悬停位置。此时，它会保持其高度和
  `GPS` 位置，并继续悬停。


  ## 降落模式


  此模式会使多旋翼无人机在无需飞行员任何输入的情况下自动降落。此模式可配置在任务结束时触发，或在触发任何故障保护条件时触发。


  # 通过遥控器分配飞行模式


  到目前为止，我们已经了解到 `remote controller` 是飞行员手动控制无人机飞行的关键要素。正如我们所见，`remote controller`
  通常包含许多开关和电位器，所有这些都帮助我们控制和配置连接到无人机上的外设。借助这些开关和电位器，飞行员可以完全控制无人机，并通过开关在不同模式之间切换。在本节中，在使用
  `remote controller` 时，我们将在不同通道上使用相同的 `MAVLink` 协议来配置各种飞行模式。


  在 `remote controller` 中，`channel` 是 `transmitter` 和无人机上的 `receiver` 之间独立的通信路径。每个
  `channel` 分配给特定的功能或控制，例如 `throttle`、`pitch`、`roll` 或 `yaw`，允许飞行员操控无人机运动和功能的不同方面。


  如今，市场上有许多 `remote controllers`，例如 `FrSky`、`Flysky` 和 `SIYI`，其中一些集成了 `GCS`。在所有类型的
  `remote controllers` 中，设置开关和飞行模式是通用的。我们建议您阅读您正在使用的 `remote controller` 的用户手册，这将帮助您完成以下步骤并执行它们。在这里，我们将使用一种通用方法来启用开关并将其分配给
  `channel`。这可能因控制器而异。


  1.  **在遥控器上启用开关**：每个 `remote controller` 都有某些默认未启用的开关和电位器，这意味着它们需要设置。建议始终在 `remote
  controller` 上选择三档开关，因为这将帮助您在单个开关上设置三种不同的飞行模式。开关的启用方式因 `remote controllers` 而异，但一旦开关激活，我们就需要分配一个合适的
  `channel` 让开关在其上工作。


  2.  **分配飞行模式通道**：为了让开关向无人机发送信号并让无人机理解给出的指令，两者必须在一个共同的 `channel` 上。因此，开关上设置的 `channel`
  应通过 `GCS` 和飞行模式进行配置，稍后我们将看到。我们将 `channel 5` 分配给开关作为飞行模式通道。请确保在配置飞行模式时，将相同的 `channel`
  分配给 `GCS`。


  3.  **在 GCS 中配置飞行模式并设置开关**：在本章后面，我们将学习如何根据 `remote controller` 中的设置在 `GCS` 中配置飞行模式。然而，在此步骤中，我们将为开关设置不同的飞行模式。当您拨动此开关时，您会看到指示器切换到不同的飞行模式；这可以在飞行屏幕上配置。您还可以选择要分配给开关的飞行模式类型。这意味着可以将三种飞行模式分配给一个开关。


  至此，我们已经学会了如何在 `remote controller` 上配置飞行模式，这有助于我们在无人机飞行时使用不同的飞行模式。我们也可以通过 `GCS` 切换到未在
  `remote controller` 上配置的其他飞行模式。同样，`remote controller` 可以切换到不同的 `channels`；通过这些不同的
  `channels`，我们可以连接不同的外设，例如 `gimbal`、`sprayer` 或 `camera`，并借助 `remote controller`
  控制它们。


  ## 工作原理


  我们将 `pulse width modulation` (`PWM`) 分解为不同的片段，其中每个片段可用于同一 `channel` 中的特定功能。我们现在知道
  `PWM channel` 的工作范围在 1,000 到 2,000 微秒之间，其中 1,000 是信号强度最低，2,000 是最高。当我们在 `three-way
  switch` 上启用此 `PWM` 时，限制被分成三等份，这意味着 `PWM` 被分成三个片段，每个片段在我们设置的同一 `channel` 上发送不同的命令。幸运的是，借助开关将其分解为片段，我们可以通过同一
  `channel` 发送不同的消息。这也帮助我们用更少的资源控制各种外设。


  # 在 GCS 中分配和更改飞行模式


  在本节中，我们将深入探讨上一节中的 `step 3`。在这里，我们将把三种不同的飞行模式分配给我们之前配置的开关。正如我们所知，`GCS` 是无人机配置的主要来源，因此我们将利用这一知识来配置我们想要放在该开关上的飞行模式，以便我们在飞行时更改它。


  飞行模式配置也是飞行前的一项关键要求，至关重要，没有它，无人机就无法在 `remote controller` 的帮助下飞行。在这里，我们将了解如何在 `GCS`
  中配置飞行模式，以及如何通过 `GCS` 更改飞行模式。


