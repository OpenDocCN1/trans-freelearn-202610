  \ | --- | --- |\n| 架构 | C++ 和脚本语言 (APL) 的混合 | 带 NuttX 实时操作系统的 C/C++ | 主要为 C 语言，专为固定翼设计\
  \ | Python SDK，通过 MAVLink 通信 | C 和 Python 脚本的混合 |\n| 中间件 | 机器人操作系统 (ROS) | 微对象请求代理\
  \ (uORB) | 无特定中间件，依赖标准库 | 用于通信的 MAVLink | 自定义中间件 |\n| 通信协议 | MAVLink | MAVLink |\
  \ MAVLink | MAVLink | 自定义 (UDP、串口或以太网) |\n| 主要语言 | C++ | C/C++ | C | Python | C\
  \ 或 Python |\n| 许可证 | GPLv3 | BSD 3-clause license | GPLv3 | Apache 2.0 | GPLv2\
  \ |\n| 实时支持 | 有限 | 是 | 否 | 否 | 有限 |\n| 任务规划工具 | Mission Planner, APM Planner | QGroundControl,\
