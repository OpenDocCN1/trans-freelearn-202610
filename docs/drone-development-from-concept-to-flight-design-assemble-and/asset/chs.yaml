  \ GCS 和无人机之间建立连接。我们现在可以对无人机进行指挥和配置。\n\n# RPA 或无人机配置\n\n当我们将无人机连接到 GCS 时，必须在任何飞行前设置无人机的必要配置并进行所需的校准。无人机配置是必需的，以便飞控知道传感器的确切数值、机型、电池状态、通信强度等，这些在飞行期间都是必需的。飞控根据这些数据做出必要的决策。\n\
  \n飞行前检查传感器校准、电机、电调和指南针很重要；这应在任何飞行前完成。\n\n应设置相机参数，以捕获无人机飞越区域的最大数量的最高质量图像和视频。\n\n\
  必须采取必要的失效保护措施，以便在电池故障或通信丢失的情况下应急恢复无人机。\n\n通过 RPA 配置，可以非常轻松地调整和设置与电池、电源等相关的参数。\n\n\
