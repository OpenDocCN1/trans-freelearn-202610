  \ |\n\n\n\n\n| 项目 | 数量 | 规格 |\n| --- | --- | --- |\n| 飞行控制器 | 1 | 具备 GPS 功能，兼容测绘应用\
  \ |\n| 电机 | 4 | 大扭矩，无刷电机 |\n| 电子调速器 | 4 | 与电机匹配，具有足够的额定电流 |\n| 螺旋桨 | 4 对 | 高效率，与电机兼容\
  \ |\n| 电池 | 1 | 大容量锂聚合物电池，适合长时间飞行 |\n| 遥控发射机和接收机 | 1 套 | 长距离，可靠通信 |\n| 电源分配板 | 1\
  \ | 将电池电力分配给各个组件 |\n| GPS 模块 | 1 | 为测绘提供精确定位数据 |\n| 云台（可选） | 1 | 稳定相机以获取清晰的测绘图像\
