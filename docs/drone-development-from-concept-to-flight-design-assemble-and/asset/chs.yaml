  本书面向初级无人机工程师、机器人工程师、硬件与设计工程师，以及希望进入无人机行业并增强其在无人机、多旋翼飞行器和无人驾驶飞行器（UAV）的物理、力学、航空电子和编程方面知识的爱好者。具备电路、组装、微控制器以及万用表和电池等电子仪器的基础知识，并理解物理学和数学的基本概念，将有助于阅读本书。


