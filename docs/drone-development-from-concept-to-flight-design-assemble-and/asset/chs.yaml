- "## 第 9 章：无人机组装、配置与调试\n\n在本章中，我们将从硬件角度涵盖无人机的多个方面。之前，我们学习了无人机如何在空中悬停和移动的理论。我们还学习了组装无人机所需的不同组件，以及飞行和配置无人机所需的软件。在本章中，我们将深入探讨无人机组装和配置的基本方面，深入了解构成无人机的复杂组件、构建无人机所需的工具，以及优化其性能所需的软件和固件调整。从选择合适的机架、电机和飞控，到校准传感器和设置遥控器，本指南将为你提供所需的知识和指导，让你在首飞前踏上无人机构建之旅。\n\
  \n本章将帮助我们了解组装无人机的端到端过程，并使其在所有 `X`、`Y`、`Z` 方向上保持机械稳定，以便无人机的总力直接向下，垂直于地面。\n\n为了深入理解并将其应用于现实生活，我们将涵盖以下主题，因为它们将帮助我们了解从零开始构建无人机所需的技能、工具和预防措施：\n\
  \n*   构建无人机所需的组件和工具\n*   组装无人机组件\n*   设置和配置航空电子设备\n*   了解校准和故障保护\n*   设置首飞\n\n###\
  \ 技术要求\n\n构建和飞行无人机需要技术技能和软件知识的结合。我们在前几章中学习了这些技能和组件，它们将在这里帮助你。让我们仔细看看：\n\n**组件技术理解**：\n\
  \n*   **无人机组件知识**：你需要了解无人机的各种组件，包括其机架、电机、**电子调速器 (ESC)**、飞控、电池和传感器\n*   **电源系统理解**：你需要熟悉\
  \ **锂聚合物 (LiPo)** 电池，包括其电压和容量，以及如何计算无人机的功率需求\n*   **螺旋桨理解**：你需要知道如何根据电机规格和预期用途选择合适的螺旋桨\n\
  \n**电子和布线技能**：\n\n*   **焊接**：你必须精通焊接，以安全地连接电线、组件和连接器\n*   **电路理解**：你必须了解基本的电子学和电路知识，以便排查和修复电气问题\n\
  \n**编程和软件技能**：\n\n*   **飞控配置**：你必须知道如何使用 Betaflight 或 Cleanflight 等软件，甚至制造商提供的软件来配置和编程飞控\n\
  *   **遥控器设置**：你必须能够配置和校准你的遥控器（远程控制），以便与飞控有效通信\n*   **PID 调参理解**：你必须了解如何调整 **比例-积分-微分\
  \ (PID)** 控制器，以优化无人机的飞行稳定性和性能\n\n**飞行技能**：\n\n*   **基本飞行技能**：你必须熟练掌握基本的无人机飞行动作，包括起飞、降落、悬停和基本导航\n\
  \n这些技术技能是必要的，因为你需要物理和分析方法来构建无人机，并具备扎实的布线和组件技能。\n\n### 构建无人机所需的组件和工具\n\n要开始组装无人机的过程，我们必须专注于收集所需的基本组件。这些包括无人机的机架、电机、电调、螺旋桨、飞控、电池和发射器/接收器。在深入复杂的组装步骤之前，准备好这些组件是关键的第一步。那么，让我们看看组装无人机所需的完整材料清单。\n\
  \n在本节中，我们将学习组装无人机所需的不同工具和组件。我们将只关注如何组装不同的组件，因为我们已经学习了无人机的各种传感器、物理学和动力学。\n\n以下表格提供了完整的构建材料和工具清单，以及无人机的\
  \ **物料清单 (BOM)**：\n\n**工具**：\n\n| 工具 | 数量 | 用途 |\n|------|----------|---------|\n\
  | 螺丝刀套装 | 1 | 组装和固定组件 |\n| 电烙铁 | 1 | 焊接电子连接 |\n| 焊锡丝 | 1 卷 | 焊接时提供导电路径 |\n| 剥线钳\
  \ | 1 | 去除电线绝缘层 |\n| 热缩管 | 多规格 | 绝缘和保护焊接连接 |\n| 钳子 | 1 | 夹持和弯曲电线 |\n| 六角扳手套装 | 1\
  \ | 拧紧机架和电机上的六角螺丝 |\n| 万用表 | 1 | 测量电压、电流和电阻 |\n| 镊子 | 1 | 精确处理小型组件 |\n| 套筒扳手套装 |\
  \ 1 | 拧紧螺栓和螺丝上的螺母 |\n| 剪线钳 | 1 | 干净地剪切电线 |\n| 护目镜 | 1 | 焊接时保护眼睛 |\n| 防静电垫 | 1 |\
  \ 保护电子元件免受静电影响 |\n| 防静电腕带 | 1 | 将组装人员的静电导地 |\n\n表 9.1：所需工具清单\n\n**BOM**：\n\n| 组件\
