  \n图 12.8 – ArduPilot 组装示意图\n\n## 无人机配置\n\n组装完无人机后，我们需要对其进行配置以便飞行。我们需要根据 `AeroGCS`\
  \ 执行一系列步骤来配置无人机。我们之前学习了 `AeroGCS` 中可用的各种选项，因此这里我们将快速浏览流程并为我们的用例选择正确的选项（不过，使用我们上面选择的\
  \ `Herelink` `GCS`，也可以通过 `QGroundControl` 进行相同的配置过程）：\n\n1.  通过 `USB` 线缆连接无人机。\n\
  2.  选择机型：\n\n    ![图 12.9 – 在 AeroGCS 中选择机型](img/B19566_12_9.jpg)\n\n    图 12.9\
  \ – 在 AeroGCS 中选择机型\n\n    选择以下选项：\n\n    *   **类别**：`Quad` (四旋翼)\n    *   **类型**：`X`\
  \ (考虑到机身为 X 型)\n\n    点击 `Update` 后，您将看到 `ESCs` 接收到 `PWM` 信号。\n\n3.  校准传感器。\n\n\
  \    a.  **校准加速度计**。我们之前学过这个。`SENSORS` (传感器) 标签页将帮助我们完成此操作：\n\n        *   点击 `Calibrate`\
  \ (校准)\n        *   点击 `Calibrate` 后，`GCS` 会要求您在几秒内将无人机保持在特定方向\n        *   自动驾驶仪将记录不同方向的加速度计读数并保存\n\
  \        *   按照屏幕上的说明校准加速度计：\n\n        ![图 12.10 – ACCELEROMETER (加速度计) 窗口](img/B19566_12_10.jpg)\n\
  \n        图 12.10 – ACCELEROMETER (加速度计) 窗口\n\n    b.  **罗盘校准**。这对于自动驾驶仪读取该区域的磁偏角是必需的。点击\
  \ `Calibrate`，然后绕多个轴旋转无人机。进度条将随着无人机旋转而增加。\n\n        完成后，必须重启无人机：\n\n        ![图\
  \ 12.11 – COMPASS (罗盘) 窗口](img/B19566_12_11.jpg)\n\n        图 12.11 – COMPASS (罗盘)\
  \ 窗口\n\n    c.  **水平校准**。这用于校准飞控的水平度。它有助于调整飞控放置在水平面上时的任何微小错位，以在地面站飞行视图中实现适当的水平。强烈建议进行此类校准以获得最佳飞行性能。\n\
  \n        将无人机放置在水平面上并点击 `LEVEL HORIZON` (水平校准)。水平校准过程将自动完成。\n\n\n\n\n![图 12.12\
  \ – LEVEL HORIZON 窗口](img/B19566_12_12.jpg)\n\n图 12.12 – LEVEL HORIZON 窗口\n\n##\
  \ 气压/气压计校准\n\n接下来是气压/气压计校准。校准气压传感器会将无人机当前高度在当前气压下设为 0：\n\n*   点击 **`Calibrate`**\
  \ 按钮；校准将开始。\n*   校准过程完成后，屏幕上将显示一条提示 **`Barometer calibration complete`** 的消息。\n\n\
  ![图 12.13 – PRESSURE 窗口](img/B19566_12_13.jpg)\n\n图 12.13 – PRESSURE 窗口\n\n## 安全参数\n\
  \n接下来，我们必须设置安全参数：\n\n### 电池失效保护触发\n\n*   **`Low Action`**: `RTL (Return to Launch)`\n\
  *   **`Critical Action`**: `RTL (Return to Launch)`\n*   **`Low Voltage Threshold`**:\
  \ `21 V`\n*   **`Critical voltage threshold`**: `20 V`\n\n### 失效保护触发\n\n*   **`Ground\
  \ Station Failsafe`**: `Always enable RTL`\n*   **`Throttle Failsafe`**: `Always\
  \ RTL`\n\n### PWM 阈值\n\n*   将 **`PWM Threshold`** 设置为 `1000`\n\n### RTL（返航）\n\n\
  根据您的需求调整这些设置。不过，对于测绘任务，高度应保持在 80 至 150 米 AGL（地面高度）之间。因此，建议选择 **`Return At Current\
  \ Altitude`**。其余设置可保持不变：\n\n![图 12.14 – RTL 窗口](img/B19566_12_14.jpg)\n\n图 12.14\
  \ – RTL 窗口\n\n保持其他设置不变，或参阅 AeroGCS 手册并根据您的需求调整设置。\n\n## 飞行模式\n\n接下来，我们将分配飞行模式。请保持\
  \ **`Flight Mode Channel`** 设置为 **`Channel 5`**，因为这是飞控栈的标准。请注意这并非强制要求。用户可根据需求选择其他通道。\n\
  \n为该通道分配不同的飞行模式，以便也能在 RC/Herelink 上进行配置：\n\n![图 12.15 – FLIGHT MODES 窗口](img/B19566_12_15.jpg)\n\
  \n图 12.15 – FLIGHT MODES 窗口\n\n## RC 校准\n\n最后是 RC 校准。对于 RC 配置（**`RPA Configuration`**\
  \ | **`RC Config`**），RC 遥控器允许飞行员设置飞行模式、控制飞行器的移动和姿态，还能开启/关闭辅助功能（即升降起落架等）。\n\nRC 校准涉及采集每个\
  \ RC 输入通道的最小值、最大值和“微调”值，以便 ArduPilot 能正确解析输入。\n\n将两根摇杆以最大可能的圆周移动，使其达到完整的运动范围。拨动\
  \ **`Channel 5`** 和 **`Channel 6`** 的拨轮开关遍历其所有档位。\n\n您的遥控器应产生以下控制变化：\n\n*   **`Channel\
  \ 1`**：低 = 左滚，高 = 右滚\n*   **`Channel 2`**：低 = 俯仰前，高 = 俯仰后\n*   **`Channel 3`**：低\
  \ = 油门关（关闭），高 = 油门开\n*   **`Channel 4`**：低 = 偏航左，高 = 偏航右\n\nHerelink 还内置了一个 RC 校准工具，可用于\
  \ RC 校准：\n\n![图 12.16 – RC CALIBRATION 窗口](img/B19566_12_16.jpg)\n\n图 12.16 – RC\
  \ CALIBRATION 窗口\n\n# 电机和 ESC 校准\n\n**`MOTOR and ESC`** 选项卡用于测试不同方向的电机和 ESC。请遵循软件中的说明校准\
  \ ESC 并测试电机：\n\n![图 12.17 – MOTOR TEST 窗口](img/B19566_12_17.jpg)\n\n图 12.17 – MOTOR\
  \ TEST 窗口\n\n## ESC 校准\n\nESC 根据飞控的 PWM 输入值调节电机转速（和方向）。ESC 响应的输入范围是可配置的，即使是同型号的\
  \ ESC，默认范围也可能不同。\n\n此校准过程会将飞控将提供的最大和最小 PWM 输入值更新到所有 ESC 中。随后，所有 ESC/电机将以相同方式响应飞控的输入（覆盖整个输入范围）：\n\
  \n![图 12.18 – ESC CALIBRATION 窗口](img/B19566_12_18.jpg)\n\n图 12.18 – ESC CALIBRATION\
  \ 窗口\n\nESC 校准步骤如下：\n\n1.  点击 **`Calibrate`** 按钮，并按照屏幕上出现的说明操作。完成所有步骤以校准所有 ESC。\n\
  2.  断开 USB 和电池，使飞控断电。\n3.  连接电池。如果飞行器连接了蜂鸣器，将播放解锁音。\n4.  按住安全按钮（如果飞控有的话），直到其变为常亮红色。\n\
  5.  听取两声播放乐调的蜂鸣声。\n6.  几秒后，听取数声蜂鸣声（每个电池芯一声）。\n7.  听取最后一声长鸣。这表示端点已确认，ESC 校准完成。\n\
  8.  断开电池并正常重新上电。\n\n遵循这些说明，我们可以成功配置一架无人机。本指南只是对各项设置的简要介绍。您掌握的技能取决于实践和阅读。练习得越多，理解得越深。初次尝试时您会遇到许多障碍。\n\
  \n上述配置也可通过 Herelink 及其内置的 QGC 应用完成。请参阅 Herelink 指南，了解如何使用它配置无人机。\n\n# 总结\n\n在本章中，我们完成了测绘无人机的开发。该过程的关键在于选择正确的组件。\n\
  \n我们了解到可以选择基本机架；不过，我们可以随心所欲地设计和改进无人机的外观。我们还学习了通过 AeroGCS 进行无人机配置。我们使用 Herelink 系统进行遥测和\
  \ RC 控制，其配置可通过其数据手册学习。然后，我们简要了解了组装无人机后必须执行的操作。如前所述，熟能生巧；学习和实践得越多，我们就越接近完美。养成研读数据手册和集成手册的习惯将大有裨益。\n\
