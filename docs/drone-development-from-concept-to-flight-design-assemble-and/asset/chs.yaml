  # 摘要


  在本章中，我们了解了飞行中最重要的部分——飞行模式。本章帮助你理解了简单的无人机如何以不同方式飞行，以及飞行模式如何帮助我们执行许多使用无人机的商业应用。我们还学习了如何使用不同的平台执行不同的项目。最后，我们了解了手动模式和自主模式在飞行中的工作原理，以及如何对无人机进行编程，使其能够在自主模式下飞行。


