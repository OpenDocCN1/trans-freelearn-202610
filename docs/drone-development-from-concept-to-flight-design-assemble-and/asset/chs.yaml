- '## 第 1 章：UAV 和无人机工程入门


  **无人驾驶飞行器**（**UAV**）系统已成为全球热门词汇，因为这项新技术正在彻底改变生活的各个领域，从民用到国防，从小型摄影公司到大型工业和安全领域。在本章中，我们将了解各种可用的无人系统，重点关注
  UAV 系统、其结构及其在不同领域的用途。通过阅读本章，我们将了解无人机的主要系统、子系统和组件及其功能，这将帮助我们理解整个系统及其各个部分。读完本章后，您将精通可用的无人机类型及其主要组件和应用，这将推动您理解本书后续的内容。


  在本章中，我们将涵盖以下主要主题，这将帮助我们分割章节并更好地理解它：


  *   无人系统介绍——无人地面、空中和水面载具

  *   无人机类型及其与应用的相关性

  *   无人机的主要机械和结构组件

  *   无人机的航空电子系统和子系统


  ### 无人系统介绍——无人地面、空中和水面载具




  # 无人系统概述：演变、需求与应用


  随着世界经历创新与新发展，科技不断进步，事物规模大幅缩减。任何新兴技术最初源于安全与国防需求，随后融入民用领域，无人技术也不例外。


  有人驾驶系统体积庞大，不适合情报收集，且用于敌方情报侦察风险极高。一旦陷入战斗或伏击，人员与装备将付出巨大代价。为规避此类风险，无人技术应运而生，分别服务于陆地、空中和海洋，即**无人地面车辆**（UGV）、**无人飞行器**（UAV）和**无人水面/水下载具**（UWV）。


  ## 各类无人载具


  UAV 经过长期演变逐渐成型，正如我们日常见到的各类载具：陆地有汽车和卡车，海洋有潜艇和舰船，空中有飞机；同理，无人系统覆盖陆、海、空三大领域，具体如下：


  ### UWV（无人水下载具）


  UWV 是无人潜艇，可深入水下远航，由远端地面人员操控。此类自主航行器按预设路径与深度巡航，任务完成后自动返航。


  主要用途包括：利用 RGB 相机进行水下监视，或利用**光探测和测距**（LiDAR）开展水深测量；国防领域用于侦察与海域监控。


  ### UGV（无人地面车辆）


  UGV 与 UWV 类似，区别在于其在陆地表面行驶而非空中或水中。操作人员远离基站，支持手动与自主模式，按预设路径、速度与路线运行，任务结束自动归位。


  ### UAV（无人飞行器）


  UAV 无机上人员，依靠机载精密传感器系统飞行。由地面控制站通过远程天线操控。广泛应用于民用与军用场景，如人群监控、航测、农业作业等。后续章节将深入解析。


  ## 无人机的历史与演变


  UAV（无人机）的发展历程颇具趣味。无人驾驶飞行器的构想可追溯至 1900 年代初。早期无人机主要用于军事侦察与监视，在派遣人类飞行员风险过大的任务中证明了价值。


  随着技术进阶，无人机体积缩小、性能精进，衍生出多元应用。2000 年代消费级无人机问世，用途突破军事限制，迅速在爱好者、摄影师、电影制片人中普及，提供全新空中视角。


  近年应用进一步拓展：农业作物监测、搜救行动、环境监测、物流配送等。UAV 从军事专用走向多功能民用工具，展现了无人航空技术的显著演进。


  ## 无人系统的必要性


  随着时代发展，对多源数据与情报的需求持续增长。过往受限于技术，依赖人力与大型装备；如今无人机以更低成本、更少投入抵达地面载具难以到达的区域。


  以下是 UAV 取代有人驾驶飞机的关键原因：


  *   **极致触达**：以更低成本与投入抵达人力与地面车辆难以企及的偏远地区。

  *   **便捷部署**：高度可扩展，形态规格多样，适配多种任务。体积极小，易于小型化运输，做到更小、更简、更智。

  *   **低功耗易维护**：小型化与强健设计降低能耗，经济性更优。

  *   **高性价比**：在航测、监视等航空应用中，相比传统方案极具成本优势。


  ## 何为无人航空系统？


  **无人航空系统**（UAS）是由航空电子系统通过无线网络远程操控的无人航空平台。涵盖各类重量、尺寸与性能等级，搭载不同载荷适配多元应用。UAV 亦称**远程驾驶航空器系统**（RPAS）。下节将详述
  UAS 应用场景。


  当前 UAV 主要民用应用包括：


  ### 无人机民用应用


  #### 航空摄影

  无人机助力影视从业者从多角度、多高度拍摄高质量画面，过往此类拍摄难度大、成本高。因体积小、易操控、性价比高，婚庆活动航拍已普及。


  #### 资产巡检

  风机、管线、输电塔、桥梁等大型设施巡检过去受限于人力触达，成本高、耗时长。无人机搭载 LiDAR 与相机等载荷，凭借小体积与极强触达能力，实现高效低成本近距离巡检，助力及时决策。


  #### 野生动物保护

  无人机可在数分钟内监控广域野生动物分布，向操作员实时回传视频流，大幅节省人力巡护时间。亦可预警、近距离观察特定区域，上报突发事件。


  #### 农业遥感

  搭载多光谱/高光谱相机的无人机获取农田地理标注影像，经软件分析提取叶片化学成分，诊断作物缺素情况，按地理位置预测长势并采取保护措施。


  #### 航空测绘

  搭载高分相机的无人机获取地表地理标注影像，后处理生成高精度地图，解析地表形态。小型化优势使测绘更高效、省力。


  #### 蚊虫防控

  大载重无人机喷洒驱蚊剂，解决人力难以均匀覆盖无法到达区域的难题，显著提升防蚊效率与性价比。





  # 无人机用例


  ## 货运无人机


  如今，无人机也被用于货物配送，这被称为空中配送。大型公司将其视为未来配送的趋势。用于跨越偏远地区运送重型货物的用例也在开发中。


  ## 无人机的国防用例


  ### 人群监控


  配备扬声器和摄像头的无人机在人群监控中发挥了关键作用。无人机提供现场实时画面，人员可借助扬声器指挥人群，并借助摄像头调查情况，而无需亲自前往现场。


  ### 监视


  配备昼夜两用摄像头的无人机帮助国防部队昼夜监控关键资产。这些摄像头具备跟踪能力和激光器，可精准获取目标的地理位置。这有助于部队在无人干预的情况下对大面积区域进行监视。


  ### 空中作战


  正如我们在世界上所见，无人机已成为战争中的关键装备。这有助于在不冒险人员生命的情况下实现更强的杀伤力。


  ### 无线电中继


  无人机还被用作偏远地区的无线电信号增强器和中继器，这些地区通信是关键工具。此类无人机用于视线 (`line of sight`, `LOS`) 不可能实现的山区，系留无人机被用作信号放大和建立通信的塔台。


  上述是无人机技术被用于帮助降低人力成本和风险、并缩短项目完成时间的部分用例。我们看到，不同类型的无人机正在被制造和使用，以满足不同的应用需求。正如战斗机不能作为客机使用，反之亦然，一种类型的无人机不适用于所有应用；因此，任何系统都完全根据需求/应用/目的等从头设计。


  # 无人机类型及其与应用的相关性


  在了解了由无人机技术服务的用例后，这里我们将研究为满足不同应用需求（如高续航、远程、高空等）而制造的不同类型无人机。通过这样做，我们将了解不同种类的无人机，并进一步建立对其开发的理解。下一节将简要介绍各类无人机。


  ## 无人机类型及其规格


  在本节中，我们将研究各种类型的无人机、其关键功能以及它们之间的区别。


  ### 多旋翼


  多旋翼是一种基于电机-螺旋桨的无人机。在空中产生力和升力的主要元件是电机及其连接的螺旋桨。这为无人机产生推力，并帮助提升系统的负载。


  根据电机数量，这些无人机分类如下：


  #### 双旋翼（两个电机）


  双旋翼是一种多旋翼，具有两个位于中心两侧的旋翼。这些系统是单向系统，仅能承载较轻负载，且续航和控制性能较低。因此，这些系统不太常用：


  ![Figure 1.1 – A bi-copter](img/B19566_01_1.jpg`)


  图 1.1 – 双旋翼


  #### 三旋翼（三个电机）


  三旋翼有三个臂，每个臂末端有产生升力的元件，彼此间夹角 120 度。这类无人机体积小、不具备载重能力，但可用于短距离的检查和监视：


  ![Figure 1.2 – A tri-copter](img/B19566_01_2.jpg`)


  图 1.2 – 三旋翼


  #### 四旋翼（四个电机）


  四旋翼是全球最著名的无人机构型。它们被认为是最稳定、最易控制的无人机。无人机的动力学特性使其易于在三维空间机动，并赋予其在远程和高空飞行中的稳定性和速度。这些构型也用于携带多达几千克的载荷：


  ![Figure 1.3 – A quadcopter](img/B19566_01_3.jpg`)


  图 1.3 – 四旋翼


  #### 六旋翼（六个电机）


  六旋翼是四旋翼之后最著名的构型之一。顾名思义，它们有 6 个臂，彼此间夹角 60 度。这些构型用于更稳定的飞行，并能承载更重的负载。最终，在相同功率下，其续航时间比四旋翼短：


  ![Figure 1.4 – A hexacopter](img/B19566_01_4.jpg`)


  图 1.4 – 六旋翼


  #### 八旋翼（八个电机）


  八旋翼顾名思义，有 8 个臂，彼此间夹角 45 度。它是六旋翼的扩展版本，能举起更重重量，体积较大。这些在空气动力学上更稳定，但也是更重、更耗电的飞行器：


  ![Figure 1.5 – An octocopter](img/B19566_01_5.jpg`)


  图 1.5 – 八旋翼


  #### 八旋翼四轴（四轴八电机）


  八旋翼四轴模型在商业市场上不太常见。它是一种在小型构型中承载更多重量的良好构型。它是一种四旋翼，有四个臂，每个臂顶部和底部各放置两个电机，以在更小的尺寸因素下产生更大推力。这类无人机主要用于保持良好的尺寸重量比：


  ![Figure 1.6 – An octa-quad](img/B19566_01_6.jpg`)


  图 1.6 – 八旋翼四轴


  #### 十六旋翼（六轴十二电机）


  十六旋翼顾名思义，在 6 个臂上装有 12 个电机，呈上下对置布局。这些构型用于大型无人机，如载人无人机或重型货运无人机。这些拥有更大尺寸的电机、更大的载荷能力和尺寸因素：


  ![Figure 1.7 – A deca-hexa copter](img/B19566_01_7.jpg`)


  图 1.7 – 十六旋翼


  上述构型根据确定的载荷、载重能力和应用进行选择。


  ### 固定翼无人机


  固定翼无人机顾名思义，是一种基于标准翼型机翼的设计，机翼作为系统的关键升力发生器，单个电机（推式/拉式）帮助其在空中巡航。巡航速度帮助通过机翼产生足够的升力在空中飞行，控制面在空中提供方向控制：


  ![Figure 1.8 – A fixed-wing drone](img/B19566_01_8.jpg`)


  图 1.8 – 固定翼无人机


  ### 固定翼垂直起降（混合无人机）


  `垂直起降` (`VTOL`) 飞行器，也称为混合飞行器，由四个电机辅助起飞，随后过渡为固定翼飞行器。这种类型的无人机不像固定翼无人机那样需要长跑道。它像多旋翼一样从单一地点起降，并像固定翼飞行器一样巡航：


  ![Figure 1.9 – A fixed-wing VTOL](img/B19566_01_9.jpg`)


  图 1.9 – 固定翼垂直起降


  ### 倾转旋翼无人机


  倾转旋翼无人机属于固定翼垂直起降混合无人机类别，它们像多旋翼一样起降，像固定翼无人机一样巡航。这些无人机与固定翼垂直起降无人机的唯一区别在于，这些无人机基于差推原理工作，巡航和起飞使用共同的电机。相同的电机用作起飞升力电机，在过渡期间将角度从
  90 度变为 180 度，并用作巡航电机。


  这些无人机比固定翼垂直起降无人机效率高得多，因为电机数量减少，功耗也随之降低：


  ![Figure 1.10 – A tilt-rotor hybrid drone](img/B19566_01_10.jpg`)


  图 1.10 – 倾转旋翼混合无人机


  因此，我们已经了解了不同类型的无人机。这些无人机可以按不同的重量和尺寸类别制造，但为了根据其重量概况进行区分，印度 `民航总局` (`DGCA`) 将无人机分为五类。





  # 无人机按重量分类


  *   **纳米级**：重量小于或等于 250 克的无人机归属于纳米级无人机类别

  *   **微型**：重量在 250 克至 2 千克之间的无人机归属于微型无人机类别

  *   **小型**：重量在 2 千克至 25 千克之间的无人机归属于小型无人机类别

  *   **中型**：重量大于 25 千克且小于或等于 150 千克的无人机

  *   **大型**：重量大于 150 千克的无人机


  我们现在已经根据结构和应用研究了不同类型的无人机，但尚未研究无人机内部实际包含什么以及它所包含的系统。在接下来的章节中，我们将了解无人机的构成，并将其划分为不同的类别。


  # 无人机系统构成


  无人机拥有许多系统和子系统，使其能够在空中飞行并自动执行任务，同时保证安全性和精确性。这些系统是硬件和软件的组合，它们执行各自的任务，以保持系统受控并在空中保持稳定：


  ![Figure 1.11 – Overview of a drone system](img/B19566_01_11.jpg)


  图 1.11 – 无人机系统概览


  既然我们已经了解了无人机的系统构成，现在让我们来看看无人机的主要机械和结构组件。


  # 无人机主要机械和结构组件


  无人机系统是一个机器人系统，由用于其所有功能的机电系统组成。机械系统被称为骨架，无人机的所有航空电子系统都在其下工作。机械系统以适当的强度牢固地固定航空电子系统，以便它能承受机动力直到极限。


  我们将在此研究无人机的主要机械和结构组件，这些组件用于固定不同部件并具有各自独立的功能。


  ## 机身


  机身是无人机的主骨架，它将所有航空电子组件固定在适当位置，并帮助它们牢固地安装和贴合，在飞行过程中无振动和松动。它作为无人机的主体，赋予系统适当的形状和尺寸，容纳所有模块，并保护它们免受外部环境的直接暴露：


  ![Figure 1.12 – A hexacopter carbon fiber airframe](img/B19566_01_12.jpg)


  图 1.12 – 六旋翼碳纤维机身


  一个完整的机身由以下子组件组成：


  ### 电机座


  用于使用螺丝或其他材料固定电机的位置：


  ![Figure 1.13 – A motor mount](img/B19566_01_13.jpg)


  图 1.13 – 电机座


  ### 机臂


  主体与电机座之间的管子/管道称为机臂。这些被用作刚性机械结构，以提升主体以及电机与主体之间的布线：


  ![Figure 1.14 – An arm set](img/B19566_01_14.jpg)


  图 1.14 – 一组机臂


  ### 中心体


  中心体是放置主要航空电子设备（如飞行控制器、**全球定位系统**（**GPS**）和其他组件）的地方，它们通过适当的接口和连接放置，帮助系统获取处理所需的必要数据。机臂连接在中心体上并向外延伸：


  ![Figure 1.15 – A drone hub](img/B19566_01_15.jpg)


  图 1.15 – 无人机中心体


  ### 起落架


  这也连接在中心体上并向下延伸。这有助于无人机在不同地形上着陆，并为载荷安全保持足够的离地间隙：


  ![Figure 1.16 – A landing gear](img/B19566_01_16.jpg)


  图 1.16 – 起落架


  就机械机身的特性而言，建议如下：


  *   机身在 `x`、`y` 和 `z` 轴上应从各方面对称

  *   机身制造应采用碳纤维、玻璃纤维等轻质材料

  *   免螺丝设计对稳定性和性能将更有帮助


  # 无人机航空电子系统和子系统


  在机械系统之后是航空电子系统，它被安装在机械系统的适当位置，以施加推力和其他力，同时保持重心平衡。这些航空电子系统包括由电源系统供电的传感器和执行器，用于在需要的地方施加必要的力，并让无人机完成必要的任务：


  ![Figure 1.17 – Avionics components](img/B19566_01_17.jpg)


  图 1.17 – 航空电子组件


  在以下章节中，我们将简要了解无人机主要的航空电子系统和子系统，它们是相互关联的。


  ## 动力系统（传动系统）


  动力系统负责产生将系统升入空中所需的力，维持升重比。这也是在空中保持稳定、高空飞行和为系统提供速度的原因。这是无人机系统最重要的部分和最初的构建模块。它也有助于维持系统的电气稳定性：


  ![Figure 1.18 – A power train](img/B19566_01_18.jpg)


  图 1.18 – 动力总成


  它由以下主要部件组成：


  ### 电机


  这些是动力系统的主要组件。这些是**无刷直流**（**BLDC**）电机，效率更高、功耗更低且寿命更长。这些电机与螺旋桨一起高速旋转，产生将系统升入空中所需的推力。电池的大部分电量由这些电机消耗。这些电机是创建三维空间运动、从一个位置移动到另一个位置以及提升负载的主要执行器：


  ![Figure 1.19 – A BLDC motor](img/B19566_01_19.jpg)


  图 1.19 – 无刷直流电机


  ### 螺旋桨


  螺旋桨是多旋翼中的关键推力发生器。这些通过螺丝或其他机制安装在电机上。螺旋桨采用轻质材料制造，当高速旋转时，它们向下推动空气，产生推力，将系统向上提升。每个螺旋桨在所需转速下旋转时会产生设定量的推力，我们将在后续章节中看到：


  ![Figure 1.20 – Propellers](img/B19566_01_20.jpg)


  图 1.20 – 螺旋桨


  ## 电源系统


  电源系统是负责为整个无人机及其载荷和其他外围设备供电的系统。这是保持无人机供电的关键系统，有助于获得所需的续航时间，并抵消大风或剧烈机动的影响。当需要升降压电压且电流消耗较大时，会添加某些升降压变换器和滤波器。


  这些是无人机电源系统的主要组件：


  ### 电池


  电池是系统最重要的部分。它作为向系统供电的关键电源。所有系统和子系统均由电池供电。电池必须能够在无故障的情况下按系统要求提供电力，并满足电流输送需求。它还负责决定无人机的续航时间：


  ![Figure 1.21 – A battery](img/B19566_01_21.jpg)


  图 1.21 – 电池


  ### 电源分配板


  顾名思义，电源分配板有助于将电力分配给不同的系统。电机等大功率消耗元件通过该板获取电力，并均匀分配给它们。还添加了一些滤波元件，如电容，以防止任何部件因浪涌和过载电流而烧毁：


  ![Figure 1.22 – A power distribution board](img/B19566_01_22.jpg)


  图 1.22 – 电源分配板





  * `Buck-and-boost converters`：`Buck-and-boost converters` 用于电路中，根据外围设备的需求升高或降低电压，并满足电流需求。这些是根据负载的电源规格使用的：


  ![图 1.23 – 降压变换器](img/B19566_01_23.jpg`)


  **图 1.23 – 降压变换器**


  ## 指挥与控制系统


  这是一个有助于连接无人机以进行指挥和控制的系统，并帮助保持无人机处于受控状态。正是由于该系统，无人机才能保持受控状态，并能按照飞行员的意愿进行控制和操作。该系统还有助于监控无人机健康状况，并实现传感器数据的实时监控。


  共同构成通信系统的主要部分如下：


  ### `遥控器 (RC)`


  `RC` 设备，即遥控器，用于在目视视距内 (`VLOS`) 驾驶无人机。它有助于手动驾驶系统到达任何地点和任何姿态。它有助于更改飞行模式，并在自主任务期间接管系统控制权。


  然而，它无法对系统的传感器数据进行实时监控，也无法查看系统的实时健康状况：


  ![图 1.24 – 遥控器](img/B19566_01_24.jpg`)


  **图 1.24 – 遥控器**


  ### `地面控制站 (GCS)`


  `GCS` 是一个集成控制站，用于系统配置和系统地面测试，以及监控系统健康状况和传感器数据，并对无人机进行 `LOS` 和 `beyond VLOS` (`BVLOS`)
  应用的指挥与控制。`GCS` 负责在完全自主模式下进行任务规划和执行。它还负责系统的自动调参，以实现更平稳的飞行：


  ![图 1.25 – 手持式 GCS](img/B19566_01_25.jpg`)


  **图 1.25 – 手持式 GCS**


  ### `无线电调制解调器`


  `无线电调制解调器` 是用于 `GCS` 和无人机之间通信的主要设备。系统的通信距离取决于无线电调制解调器的通信距离。它作为从 `GCS` 控制和指挥无人机的关键通信链路。无线电调制解调器有助于为链路提供安全性，并传输
  `GCS` 和无人机通信所依赖的信号：


  ![图 1.26 – 无线电调制解调器](img/B19566_01_26.jpg`)


  **图 1.26 – 无线电调制解调器**


  ### `天线`


  `天线` 在信号传输和传播中起关键作用。天线增益和方向决定了系统的范围及其在空中机动的程度。天线类型是决定无人机或飞行器航程的重要参数，我们将在后续章节中看到：


  ![图 1.27 – 天线](img/B19566_01_27.jpg`)


  **图 1.27 – 天线**


  ### `导航系统`


  在动力、推进和通信之后，便是 `导航系统`。该导航系统仅在以自主模式驾驶系统时才有帮助。导航系统帮助无人机确定方向和坐标，并自主或按任务引导的方向移动。


  在内置传感器的支持下，导航系统帮助无人机沿选定的路径和方向移动。构成导航系统的主要组件如下：


  #### `GPS`


  `GPS` 是导航系统的关键组件。无人机使用的 `GPS` 内嵌 `GNSS`，如伽利略、北斗及其他类似导航系统，有助于获取无人机的实时坐标以在 `GCS` 中显示，并帮助飞行员获取实时地图和位置。任务规划软件使用相同的
  `GPS` 坐标来决定无人机的自主路径，无人机也用其导航至提供的 `GPS` 坐标。起飞坐标也保存在无人机中，这有助于无人机在失效保护条件下执行 `Return
  to Launch` (`RTL`)：


  ![图 1.28 – GPS](img/B19566_01_28.jpg`)


  **图 1.28 – GPS**


  #### `罗盘或磁力计`


  `罗盘` 或 `磁力计` 是无人机导航系统的关键组件。`GPS` 给出系统的坐标和期望的目标位置，但 `罗盘` 给出无人机行进的方向。无人机在 `罗盘` 的指引下飞往特定坐标。`罗盘`
  指示无人机的航向，即机头指向的方向。`罗盘` 需要相对于空间磁场进行校准，以实现正确的导航：


  ![图 1.29 – 磁力计](img/B19566_01_29.jpg`)


  **图 1.29 – 磁力计**


  #### `处理单元或飞控`


  `飞控` 是无人机的 `central processing unit` (`CPU`)。这被称为无人机的大脑。`飞控` 接收来自内置传感器和外围传感器的传感器数据，并将其传递给执行器和电机，从而使无人机能够在手动和自动模式下飞行。


  `飞控` 被编程为在各种飞行模式、任务和特定条件下表现出特定行为，我们将在后续章节中看到：


  ![图 1.30 – 飞控](img/B19566_01_30.jpg`)


  **图 1.30 – 飞控**


  ### `负载`


  飞行器旨在用于其设计和开发目的的特定应用和工作。安装在无人机上执行该特定工作的设备称为 `负载`。例如，日/夜摄像机是日/夜监视的 `负载`（见 **图 1.31**），喷药箱是农业植保无人机的
  `负载`（见 **图 1.32**），`RGB` 传感器是测绘无人机的 `负载`。


  `负载` 是执行无人机预期任务的唯一对象。我们将在本书后面看到针对不同应用使用类似负载的工作：


  ![图 1.31 – 摄像机负载](img/B19566_01_31.jpg`)


  **图 1.31 – 摄像机负载**


  ![图 1.32 – 作为负载的喷药箱](img/B19566_01_32.jpg`)


  **图 1.32 – 作为负载的喷药箱**


  这些是无人机系统中使用的一些主要组件。在后续章节中，我们将了解每个组件使用的规格，以及如何对它们进行最佳优化以构建满足特定规格的无人机。


  ## 总结


  读完本章，我们了解了无人系统、其发展历程及其需求。我们转向无人机，研究了其类型、重要系统和子系统及其功能。


  在本书的下一章中，我们将介绍无人机动力学、作用在空中系统上的各种力，以及如何使其安全平衡。我们还将介绍各种空气动力学术语，这将帮助我们更好地理解相关内容，并探讨如何利用工程手段结合上述组件来实现这些力，并构建一个完整的可飞行系统。

  '
- "## 理解飞行术语与运动物理学\n\n在本章中，我们将学习无人机在空中的行为和稳定性。什么力必须作用在系统上以维持无人机在空中的位置，我们如何利用工程手段实现这些力？我们还将了解无人机控制机制在空中如何工作，包括其在自由空间中的力矩以及与这些机动相关的主要术语。\n\
  \n\n\n在这里，我们将了解作用在机体和质心上的主要力，涉及 `X` 轴、`Y` 轴和 `Z` 轴，以及作用在无人机上的主要物理原理。这些主题有助于理解无人机的基本物理原理，这对设计师设计机身、计算无人机在悬停和巡航动作中铰链上的载荷很有帮助，也有助于航空电子开发工程师在设计师提供的载荷条件下工作。力学和航空电子是相互关联的概念，应针对富有成效的系统开发进行优化。\n\
  \n在本章中，我们将涵盖以下主题：\n\n*   推力、重量、升力、阻力和巡航简介\n*   飞行轴及其术语简介\n*   四轴飞行器飞行物理简介\n*   实现绕三个旋转轴运动的工程技术\n\
  \n# 推力、重量、升力、阻力和巡航简介\n\n任何计划在空中飞行的系统，都由作用于其在三维空间（即 `X` 轴、`Y` 轴和 `Z` 轴）上的物理力来表征。在地球上，将物体向下拉的力是重力，寻求飞行时必须首先克服它。重力对地球上的所有物体作用方式相同，以\
  \ 9.8 m/sec² 的加速度将它们向下拉。考虑到这一点，所有物体都有与该过程相关的重量，该重量受重力作用。\n\n考虑到牛顿第三定律，作用力与反作用力大小相等、方向相反。无人机受到的力与作用在机体上的重力大小相等、方向相反。让我们看看与此相关的各种术语以及如何应对它们。\n\
  \n## 推力\n\n推力是由无人机电机和螺旋桨的旋转产生的反作用力。在多旋翼无人机中，该力与重力方向相反，以克服无人机的重量。这是作用在无人机上使其产生升力并升空的重要力量。\n\
  \n其单位为千克或牛顿。无人机产生的推力取决于螺旋桨的尺寸和旋转速度，以及无人机所用电池的总电压。作用在无人机上的总力必须是重力作用在无人机上的力的两倍，以便无缝应对无人机的巡航和升力。\n\
  \n从技术上讲，每个螺旋桨产生的推力与电机转速（RPM 或 rad/sec）之间的关系是二次方关系。换句话说，推力与旋转角速度的平方成正比。\n\n## 重量\n\
  \n系统的重量是系统设计中最重要、最基本的参数，它帮助我们计算其他参数，如推力、功率等。无人机的总重量包括机身、电池、电机、螺旋桨和任务载荷的重量。提到无人机时有不同类型的重量，如下所示：\n\
  \n*   **全装重或总重**：这是指系统起飞入空那一刻的重量。此重量因任务载荷和飞行条件而异。此重量始终小于系统的**最大起飞重量**（**MTOW**），以在安全限度内操作。\n\
  *   **最大起飞重量**：这是无人机在不影响系统适航性的前提下能安全升空的最大重量。MTOW 取决于许多因素，如设计、结构和航空电子限制。MTOW 是在考虑所有类型任务载荷重量的基础上定义的，超过此重量系统将不再安全飞行。\n\
  \n## 升力\n\n升力是推力作用在多旋翼无人机上产生的垂直力，帮助系统向上升空。为了产生无人机所需的升力，必须设计合适的动力系统，我们将在后续章节中探讨。对于多旋翼无人机，升力是由所有旋转螺旋桨的综合效应产生的。\n\
  \n## 阻力\n\n阻力是一种空气动力摩擦力，由风撞击机体产生。该力始终与运动方向相反。无人机的每个部件都会产生该力。无人机的巡航速度必须足以克服阻力。\n\n\
  在为特定应用计算和设计无人机时，会考虑所有这些力。\n\n## 巡航\n\n顾名思义，**巡航**是指以特定速度向特定方向移动。它被称为系统起飞后在空中向特定方向飞行的阶段，包括在开始降落前获得所需高度。系统飞行的速度称为**巡航速度**。\n\
  \n# 飞行轴及其术语简介\n\n到目前为止，我们已经介绍了飞行术语。我们可以这样说：当升力等于无人机重量且在空中具有巡航速度时，多旋翼飞行器处于悬停状态，这可以称为在三维（3D）空间中巡航。为了简化计算，我们考虑无人机在三个主要通用轴（即\
  \ `X` 轴、`Y` 轴和 `Z` 轴）下的三维空间中工作。这些有助于我们设计和编程无人机。质量和力在这三个轴上的平衡和均匀分布有助于我们实现稳定飞行。让我们更多地了解无人机在这些轴上的运动及其术语。\n\
  \n![图 2.1 – 显示无人机在不同轴上运动的示意图](img/B19566_02_1.jpg)\n\n图 2.1 – 显示无人机在不同轴上运动的示意图\n\
  \n如上所述，无人机在三维平面的 `X` 轴、`Y` 轴和 `Z` 轴上的运动分别称为**滚转**、**俯仰**和**偏航**运动。以下各节简要描述这些运动。\n\
  \n## 滚转运动\n\n在三维空间中，`X` 轴上的运动称为**滚转运动**。简单来说，系统在空间中的左右侧向运动称为滚转运动。滚转运动帮助系统在 `X` 轴上向左或向右侧向飞行。\n\
  \n在多旋翼中，滚转运动通过增加右侧电机转速并同等降低左侧电机转速来实现左转，右转则反之。在固定翼或其他飞机上，滚转运动通过称为副翼的控制面实现。\n\n##\
  \ 俯仰运动\n\n在三维空间中，`Y` 轴上的运动称为**俯仰运动**。简单来说，俯仰运动是无人机在三维空间中的前进和后退运动。\n\n在多旋翼无人机中，俯仰运动通过增加后两个电机的\
  \ RPM 并降低前电机的 RPM 来实现前飞，后飞则反之。所有这些设置和配置都预定义在无人机固件中，帮助飞行员遵循预定义的控制。\n\n## 偏航运动\n\n\
  **偏航运动**是无人机在三维平面上绕 `Z` 轴的运动。偏航运动帮助我们在空中改变无人机机头指向的任何方向。简单来说，偏航运动帮助我们在整个 360 度圆周内以任何角度改变无人机机头的指向。这种运动帮助我们改变三维平面上的运动方向。\n\
  \n无人机的偏航力矩是电机扭矩的函数，通过电机旋转施加到机身上。为了在 `Z` 方向上顺时针运动，逆时针电机以更高的 RPM 旋转；为了逆时针运动，它们以较低的\
  \ RPM 旋转。这有助于无人机绕其轴线顺时针旋转，反之亦然。我们稍后将了解这些方向和力。\n\n## 油门\n\n\n\n油门的概念类似于我们在日常生活中关于自行车或汽车所听到的油门。油门是物体移动的速度程度。在无人机中，油门指的是电机旋转的速度，这会导致螺旋桨运动加快，从而产生更大的推力和升力。随着推力增加，无人机的重量开始沿\
  \ `Z` 轴被抬升到空中，一旦无人机达到期望高度，这就会稳定下来。\n\n对于稳定悬停，总推力应等于无人机的总重量，这意味着无人机将在空中稳定悬停。无人机的高度可以通过增加或减少油门来相应地升高或降低，以增加或减少推力的产生。对于稳定悬停，在\
  \ 50% 油门时总推力应等于无人机的重量，为了安全的空气动力学性能，所有电机的总推力容量应是无人机重量的两倍。\n\n下图进一步阐释了无人机在三个轴上的运动，以机身为参考：\n\
  \n![图 2.2 – 显示无人机横滚、俯仰和偏航轴运动的示意图](img/B19566_02_2.jpg)\n\n图 2.2 – 显示无人机横滚、俯仰和偏航轴运动的示意图\n\
  \n承接前述术语，还有其他一些有助于无人机设计的技术术语。\n\n# 推重比 (TWR)\n\n推重比是一个无量纲量，也是无人机的性能指标。它是系统在 100%\
  \ 油门下能产生的总推力与无人机重量的比值。其表示如下：\n\n`TWR` = Total thrust produced at 100% throttle /\
  \ Weight of the drone\n\n在 50% 油门时，产生的总推力应等于系统的总重量，以实现稳定悬停。\n\n为了安全飞行，有效 `TWR` 为\
  \ 2，这意味着产生的总推力应是系统总重量的两倍。\n\n对于 **第一人称视角** (**FPV**) 无人机或竞速无人机，该比率有时会达到 3 或更高，因为这些设计需要更高的机动性和更急的转弯。\n\
  \n我们将在本书后面从零开始设计无人机时了解更多关于这些技术方面的内容。\n\n# 四轴飞行器飞行物理学简介\n\n在本主题中，我们将从零开始彻底理解基本飞行物理学概念，涉及四轴飞行器的悬停、横滚、俯仰和偏航力矩。在这里，我们将了解飞行中实时作用的力，以及不同力如何以不同方式起作用；然而，所有力的合力决定了无人机在空中的运动。\n\
  \n下图显示了四轴飞行器的运动学及作用于其上的不同力。这有助于我们研究作用于飞行的不同力：\n\n![图 2.3 – 显示作用于无人机的不同力的示意图](img/B19566_02_3.jpg)\n\
  \n图 2.3 – 显示作用于无人机的不同力的示意图\n\n在上图中，我们可以看到一个四轴飞行器的受力图，其中不同的力和运动作用于无人机。让我们逐一查看并理解这些力和参数，以便我们能进一步研究它们。\n\
  \n无人机的重量产生一个向下的力：`M x g`（`g` = 重力加速度）。\n\n`ω x` = 电机以 RPM 为单位的旋转速度；因此，`ω 1` 是电机\
  \ 1 的 RPM，同理，`ω 2`、`ω 3` 和 `ω 4` 分别是电机 2、3 和 4 的旋转速度。\n\n正如我们在图中所见，电机 1 和 2 顺时针旋转，电机\
  \ 3 和 4 逆时针旋转。\n\n当两个对角线电机（1 和 2）顺时针旋转，另外两个对角线电机（3 和 4）逆时针旋转时，就会发生这种情况；当电机这样旋转时，会产生相反方向的扭矩；因此，在相同\
  \ RPM 下，两个顺时针和两个逆时针方向会相互抵消扭矩，使系统在空中保持稳定。此外，相同的反扭矩被用来给无人机在空中提供偏航运动（绕 `Z` 轴旋转）。\n\n\
  `Fx` 是电机旋转产生的每个螺旋桨向上对抗重力产生的力。因此 `F1`、`F2`、`F3` 和 `F4` 分别是电机 1、2、3 和 4 产生的力。\n\n\
  `Ui` 是力 `F1`、`F2`、`F3` 和 `F4` 作用于无人机质心和重心产生的系统总力。因此，`Ui` = `F1` + `F2` + `F3` +\
  \ `F4`。\n\n`L` 是每个电机与质心之间的距离。`L` 定义用于计算每一端作用于质心的力，这称为 **力矩**。\n\n这意味着电机 1 在质心上产生的力矩\
  \ `M1` 将是 `M1` = `F1` X `L1`。\n\n同理，`Mx` = `Fx` X `Lx`。\n\n因此，对于无异常的稳定飞行，所有四个电机的力矩应相等且相反，相互抵消，使重心处的合力矩为零。\n\
  \n`Theta` (`∅`) = 无人机在 `X` 轴移动的角度，即横滚；因此这称为横滚角。\n\n`Phi` (`ϕ`) = 无人机在 `Y` 轴移动的角度，即俯仰；因此这称为俯仰角。\n\
  \n`Sai` (`ψ`) = 无人机在 `Z` 轴移动的角度，即偏航；因此这称为偏航角。\n\n现在，每个旋翼产生的总力 `F` = `Kf` X `Wx`，其中\
  \ `kf` 是比例常数，`W2` 是电机的旋转速度。\n\n同样，螺旋桨旋转中的阻力矩 `M` = `Km` X `Wx`。\n\n这两种力都可以在下面绘制的推力、阻力和\
  \ RPM 之间的图表中看到。\n\n下图描绘了产生的力与旋翼速度之间的关系。它还反映了旋翼在系统上产生的总速度和力矩。\n\n![图 2.4 – 显示力与旋翼速度关系的图表](img/B19566_02_4.jpg)\n\
  \n图 2.4 – 显示力与旋翼速度关系的图表\n\n我们可以认为，旋翼产生的总力的四分之一消耗在克服电机产生的阻力上；因此，旋翼产生的总有效力将是 `F_effective`\
  \ = ¼（总 `产生的推力`）。\n\n现在，推力产生的总合力如下：\n\n*   悬停条件是\n    `F Total` = `F1` + `F2` +\
  \ `F3` + `F4` − `mg`，这是合力，其中 `Fi` = `Kf` X `ωi` 2。\n*   质心处的合力矩是\n    `M` = `L1`\
  \ X `F1` + `L2` X `F2` + `L3` X `F3` + `L4` X `F4` + `M1` + `M2` + `M3` + `M4`\n\
  \    `Mx` = (`F3` − `F4`) X `L`；即 x 轴上的力矩为 0，因为力会相互抵消，使合力为零。\n    `My` = (`F1` −\
  \ `F2`) X `L`；即 y 轴上的力矩为 0，因为力会相互抵消，使合力为零。\n    因此，作用在无人机上的所有力矩也为零。\n\n所以，最终，从这些方程来看，无人机上的所有净合力为零，从而实现稳定悬停飞行。\n\
  \n现在，牛顿第二定律指出，对于直线运动，`F` = `Ma`，即力 = 物体质量乘以加速度。\n\n对于旋转运动扭矩，`T` = `L` X `a`，即扭矩\
  \ = 转动惯量乘以角加速度。\n\n# 实现绕三个旋转轴运动的工程技术\n\n在前面的章节中，我们学习了无人机不同运动背后的物理学原理，即悬停以及横滚、俯仰和偏航运动。是什么力驱动这些运动并帮助我们实现全方位的运动？在本主题中，我们将学习应用于无人机以实现这些方向力的工程技术，以及我们如何利用这些工程技术来操控无人机的机械结构。\n\
  \n## 悬停运动\n\n\n\n\n## 垂直运动条件\n\n此运动需满足以下条件：\n\n*   **重量**：电机转速增加至旋翼产生的总力等于无人机重量；因此，合力变为零，无人机在特定位置悬停。\n\
  \n*   **力矩**：由于所有机臂长度相同，且旋翼产生的力也相等且方向相反，相互抵消，这使得合力为零。\n\n    此外，两个对角线电机顺时针旋转，另外两个对角线电机逆时针旋转，这又抵消了各自的反扭矩，使得\
  \ `Z` 轴上的合力为零，系统在 `X`、 `Y` 和 `Z` 轴上保持稳定。\n\n*   **上升运动**：当增加油门时，旋翼开始以相同的转速更快地旋转，产生相等的推力，从而增加无人机的升力。对于向上升高的运动，旋翼产生的总力应大于无人机的重量；即力越大，无人机上升越快。当向上的力略大于无人机重量时，无人机开始增高。现在，根据直线运动方程，平衡状态下稳定悬停飞行的条件是\
  \ `F = Mg`。如果 `F` 增加到大于 `Mg`，则会产生向上的加速度。因此，对于上升运动，`F > Mg`，即 `F1 + F2 + F3 + F4\
  \ > 无人机重量`。力增加得越快，加速度增加得越快，无人机将持续增高，直到减小油门为止。\n\n*   **下降运动**：当降低油门时，旋翼转速降低，总推力也随之减小，变得小于无人机的总重量。因此，无人机向下移动。用技术术语表示即：无人机重量应大于旋翼产生的总力。即\
  \ `F1 + F2 + F3 + F4 < Mg`。\n\n    当推力略小于重量时，无人机开始降低高度并向下移动。\n\n## 水平运动\n\n无人机的水平运动需要一些特殊的工程设计来调节力，以提供前进和侧向移动。此运动需满足以下条件：\n\
  \n*   **横滚运动**：对于横滚运动，无人机绕 `X` 轴倾斜一个西塔角；因此，产生运动水平和垂直矢量分量的力 `F`（即 `F_cos(∅)` 和 `F_sin(∅)`）可以看作是悬停状态下指向上方的力\
  \ `F`。在横滚中，`F` 的方向绕 `X` 轴倾斜西塔角，意味着以下关系：\n\n```\n水平分量 = F_cos(∅)\n垂直分量 = F_sin(∅)\n\
  ```\n\n    因此，导致 x 轴运动的力表示为 `F_X_axis = F_cos_theta`，因为 `F = Ma` 且 `a = F/m`，加速度将等于无人机上的总力除以无人机的质量。无人机的重量由称为\
  \ `F_sin(∅)` 的垂直分量来抵消。因此，由于这些力我们得到了横滚运动。\n\n*   **左侧移动**：左侧的两个电机减速，右侧的两个电机以相同幅度加速。这使得总推力和总升力保持不变而不受影响，但绕重心的力矩向左侧增加，从而将系统推向左侧。侧向运动的速度将等于向左的\
  \ `F_Cos_theta`：\n\n    `左侧电机产生的力矩 < 右侧电机产生的力矩。`\n\n    `F_left X L < F_right X\
  \ L.`\n\n*   **右侧移动**：右侧的两个电机减速，左侧的两个电机以相同幅度加速。这使得总推力和总升力保持不变而不受影响，但绕重心的力矩向右侧增加，从而将系统推向右侧。侧向运动的速度将等于向右的\
  \ `F_Cos_theta`。\n\n    `右侧电机产生的力矩 < 左侧电机产生的力矩。`\n\n    `F_right X L < F_left X\
  \ L.`\n\n    因此，左侧的力大于右侧的力，从而将系统推向右侧。\n\n## 俯仰运动或前后移动\n\n这些运动需满足以下条件：\n\n*   **前进运动**：前侧的两个电机减速，后侧的两个电机以相同幅度加速。这使得总推力和总升力保持不变而不受影响，但绕重心的力矩向前侧增加，从而将系统推向前方。前进运动的速度等于前进方向上的\
  \ `F_Cos_theta`。\n\n    `前侧电机产生的力矩 < 后侧电机产生的力矩。`\n\n    `F_front X L < F_back X\
  \ L.`\n\n    因此，后侧旋翼的力大于前侧旋翼的力，从而将系统向前推。\n\n*   **后退运动**：后侧的两个电机减速，前侧的两个电机以相同幅度加速。这使得总推力和总升力保持不变而不受影响，但绕重心的力矩向后侧增加，从而将系统推向后方。前进运动的速度等于后退方向上的\
  \ `F_Cos_theta`：\n\n    `后侧电机产生的力矩 < 前侧电机产生的力矩。`\n\n    `F_back X L < F_front X\
  \ L.`\n\n    因此，后侧旋翼的力大于前侧旋翼的力，从而将系统向前推。（注：原文此处结论与“后退运动”标题矛盾，译文保持原文逻辑）\n\n*   **偏航运动**：偏航运动是由电机旋转产生的扭矩导致的绕\
  \ `Z` 轴的力矩引起的。它包括顺时针和逆时针两种。根据旋转运动方程，绕 `CG`（重心）的力矩为 `M = L1 X F1 + L2 X F2 + L3 X\
  \ F3 + L4 X F4 + M1 + M2 + M3 + M4 = 0`。在稳定悬停时，所有力为零。\n\n    在偏航条件下，由于 `F1`、`F2`、`F3`\
  \ 和 `F4` 都指向上方，它们对绕 `Z` 轴的力矩没有任何影响。\n\n    所以，`M = M1 + (-M2) + (-M3) + M4`，负号（-）表示反方向旋转，因为两个对角线电机顺时针旋转，另外两个对角线电机逆时针旋转。\n\
  \n    对于 **顺时针偏航运动**，我们减速两个对角相对的顺时针电机，并按相同比例加速另外两个对角相对的逆时针电机。这样做总推力保持不变，但两个逆时针电机的反作用力（顺时针方向）大于顺时针电机的反作用力（逆时针方向）。因此，合力方向为顺时针，机身绕\
  \ `Z` 轴顺时针旋转。\n\n    其向任一方向旋转的速率即为电机转速变化的速率。\n\n    对于 **逆时针偏航运动**，我们减速两个对角相对的逆时针电机，并按相同比例加速另外两个对角相对的顺时针电机。这样做总推力保持不变，但两个顺时针电机的反作用力（逆时针方向）大于逆时针电机的反作用力（逆时针方向，原文此处疑为笔误，应为顺时针方向）。因此，合力方向为逆时针，机身绕\
  \ `Z` 轴逆时针旋转。\n\n# 总结\n\n\n\n\n"
- "## 第 3 章：学习并应用基本指挥与控制接口\n\n在前几章中，我们了解了各种无人系统及其应用。我们还学习了无人机背后的基本物理学原理，以及电机和执行器如何对无人机施加不同的力。我们还介绍了各种术语，例如\
  \ `roll`（横滚）、`pitch`（俯仰）和 `yaw`（偏航），以及如何利用执行器产生的力来实现这些动作。\n\n在本章中，我们将学习如何指挥和控制无人机以执行特定任务或任务，以及如何在不同应用中使用它。此外，我们还将了解用于此目的的指挥与控制软件和硬件及其各种类型。我们还将学习行业中用作无人机与\
  \ `Ground Control Station (GCS)`（地面控制站）之间通信接口的基本通信协议。\n\n通过学习本章，您将了解用于控制无人机的 `GCS`\
  \ 和 `remote control (RC)`（遥控器）及其工作原理。我们将在本章中涵盖以下主题：\n\n*   `GCS` 硬件和软件简介\n*   不同种类\
  \ `GCS` 简介\n*   `MAVLink` 和串行协议简介\n*   `RC` 及不同可用选项简介\n*   `RC` 协议简介\n\n通过学习这些主题，您将深入了解各种通信协议及其在无人机方面的用法。这也将帮助您理解通过通信设备建立的空中单元（无人机）与地面单元（`GCS`）之间的连接。\n\
  \n## GCS 硬件和软件简介\n\n`GCS` 是一套基于地面的集成硬件和软件，无人机操作员使用它来配置无人机，并监控系统健康状态、航向和其他参数。同一个\
  \ `GCS` 还用于为无人机编程自主任务，并监控高度、速度和方向等实时参数。它还会在飞行前进行检查，以校准飞行前的传感器。\n\n以下是 `GCS` 的组成部分：\n\
  \n*   `GCS` 硬件\n*   `GCS` 软件\n\n让我们仔细看看每一部分。\n\n### GCS 硬件\n\n`GCS` 硬件是运行 `GCS`\
  \ 软件并与无人机通信（即地面数据终端）所需的所有硬件的集合。这种 `GCS` 硬件是带有人机界面、遥测天线、接口和视频采集卡的笔记本电脑/平板电脑的组合。`GCS`\
  \ 硬件是一个兼容平台，在该平台下，所有用于运行无人机系统的必需软件均可工作。这包括 `GCS` 软件、遥测数据和视频。视频数据终端或通信模块可能是 `GCS`\
  \ 硬件的一部分，也可能不是。一些制造商将它们作为集成模块一起提供，而另一些则给予用户选择自己的视频遥测和通信模块的自由。\n\n以下是 `GCS` 硬件的组成部分：\n\
  \n*   `GCS` 计算机\n*   多块屏幕（可选），用于地图、视频、任务规划和监控\n*   地面数据终端\n*   界面按钮、开关和电位器\n*  \
  \ 电池供电\n\n### GCS 软件\n\n`GCS` 软件是一种基于 GUI 的虚拟驾驶舱，供无人机飞行员使用，它运行在兼容硬件上，并使用 `ground\
  \ data terminal (GDT)`（地面数据终端）与无人机通信。这有助于规划/编辑无人机执行的任务。它配置模块，如电池传感器，校准 `Electronic\
  \ Speed Controllers (ESCs)`（电子调速器）和 `RC`，并调整无人机的性能参数。\n\n以下是 `GCS` 软件的主要组件/窗口：\n\
  \n*   **Vehicle setup window（机型设置窗口）**  \n    这包括与无人机机型相关的设置。它包括机架设置、传感器校准、`ESC`\
  \ 校准、电源设置、`RC` 设置等。简而言之，该窗口管辖所有与系统性能和飞行相关的参数。\n\n*   **Mission planning window（任务规划窗口）**\
  \  \n    该窗口包含无人机当前所在区域的地图。这是从互联网获取的，并反映无人机的当前位置。飞行员打算执行的任务类型在此窗口中规划。\n\n*   **Control\
  \ and command window（控制与指令窗口）**  \n    该窗口提供各种选项/按钮以向无人机发送指令，例如起飞、降落、模式切换和返航。这有助于控制无人机的行为。\n\
  \n*   **Compass and level horizon windows（指南针和水平仪窗口）**  \n    这些窗口协助无人机在空中拦截航向和水平。指南针窗口帮助飞行员观察无人机的航向和移动方向，而水平仪窗口有助于确认相对于地面的水平度及其在\
  \ `roll`（横滚）、`pitch`（俯仰）和 `yaw`（偏航）方面的运动。\n\n*   **Video panel（视频面板）**  \n    视频面板直接在\
  \ `GCS` 中显示来自无人机的相机画面。这有助于飞行员观察并从视频中提取必要信息。\n\n*   **Pre-flight checks window（飞行前检查窗口）**\
  \  \n    该窗口帮助飞行员在飞行前检查无人机的基础项目，例如螺旋桨和电机方向、电池、模式、`RTL` 和电子围栏（如果已设置）。\n\n*   **Log\
  \ downloads and analysis（日志下载与分析）**  \n    大多数 `GCS` 软件都有一个窗口，可在其中下载飞行日志并用于分析。\n\
  \n## GCS 的类型\n\n根据应用和无人机，`GCS` 硬件可根据其尺寸、外形规格和可用功能分为多个类别。其中一些如下所示：\n\n### 大型车载 GCS\n\
  \n大型车载 `GCS` 是一种供无人机飞行员使用的虚拟驾驶舱。它包含所有 `GCS` 系统，例如用于地图和视频的多块屏幕。它安装在可移动车辆下方，具有类似飞机的视野，并配备卫星和微波天线，用于与远程无人机通信。这些类型的\
  \ `GCS` 用于作业半径高达 300 公里的大型无人机。这些 `GCS` 是高等级专业系统：\n\n![Figure 3.1 – A vehicle-mounted\
  \ GCS system](img/B19566_03_1.jpg)\n\nFigure 3.1 – 车载 GCS 系统\n\n### 非车载便携式 GCS\n\
  \n这些类型的 `GCS` 介于手持 `GCS` 和车载 `GCS` 之间。这些 `GCS` 也有多块屏幕，并与航空级操纵杆连接，但它们是人力便携的，不需要车辆即可移动。它们也由电池供电，并可同时与多架\
  \ `UAV` 连接。这些 `GCS` 没有固定的设置，但可根据应用需求进行管理：\n\n![Figure 3.2 – A non-vehicle-mounted\
  \ GCS system](img/B19566_03_2.jpg)\n\nFigure 3.2 – 非车载 GCS 系统\n\n### 手持 GCS\n\n\
  顾名思义，手持 `GCS` 是一个简单的单一实体，集成了内置无线电调制解调器和天线、单块屏幕和手持操纵杆。这些 `GCS` 提供单手便携性，用于中小型无人机：\n\
  \n![Figure 3.3 – A handheld GCS system](img/B19566_03_3.jpg)\n\nFigure 3.3 – 手持\
  \ GCS 系统\n\n\n\n\n\n# GCS 软件类型与分类\n\n大多数公司开发 GCS 软件时，仅使其兼容其专有系统。此类 GCS 软件不对其他用户开放，且基于订阅制。某些公司开发的\
  \ GCS 软件兼容多种无人机。这些公司并非无人机制造商，但会为其 GCS 丰富所需功能。\n\n第三类是开源 GCS 软件。此类软件由开源社区开发，用户可免费下载使用。该\
  \ GCS 软件的源代码公开可用。用户可下载相关源代码并用于开发功能。\n\n部分 GCS 基于 Windows，部分基于 Linux 系统；也有两者兼容的。它们还可分为基于笔记本电脑和基于移动设备的\
  \ GCS 软件。让我们看看一些被归类为桌面端或移动端的 GCS 软件类型。它们可从各自的网站下载。\n\n## 基于桌面的 GCS 软件\n\n* Universal\
  \ GCS\n* SmartAP GCS\n* UrbanMatrix LaunchPad\n* Orbit GCS\n\n## 基于移动设备/平板的 GCS\
  \ 软件\n\n* Tower\n* Mav Pilot\n* Side Pilot\n\n# MAVLink 及其他开源遥测协议简介\n\n遥测协议是一种无线串行协议，可实现无人机与\
  \ GCS 之间的无线通信。这些协议轻量级且运行所需能量低。它们通过发射器和接收器在无线介质上启用。\n\n各种遥测协议广泛应用于无人系统，以实现遥测通信。以下是一些示例：\n\
  \n* MAVLink\n* ZigBee\n* LoRaWAN\n* 消息队列遥测传输协议\n* Open-LTE\n\n让我们深入研究这些协议，以了解其用法和操作：\n\
  \n* **MAVLink**：MAVLink，即微型飞行器链路，是一种通信协议，无人机用它在各个组件之间通信，如飞手、GCS 和其他机载设备。这是无人机各部分相互通信并共享无人机状态、传感器数据和操作指令信息的一种简单高效的方式。MAVLink\
  \ 确保无人机系统不同组件之间的集成与通信。\n\n* **ZigBee**：Zigbee 是一种基于蓝牙的先进串行无线协议，能耗低，在 2.4 GHz 下以\
  \ 250 Kbps 运行，通信范围为 10 至 100 米。Zigbee 具有抗干扰和高可靠性特性。Zigbee 协议采用 128 位加密标准算法和消息完整性代码。\n\
  \n* **LoRaWan**：LoRaWan 是一种远程遥测协议，数据传输速率低，范围从 0.3 Kbps 到 50 Kbps，可在最基础的基础设施上工作，运营成本低。它使用\
  \ AES 算法进行加密和认证。\n\n* **MQTT**：MQTT 是一种短距离协议，采用发布/订阅模型，具有高可靠性，这使其轻量且高效。该协议工作在网状拓扑上。\n\
  \n* **Open-LTE**：LTE 代表**长期演进**。它基于蜂窝网络技术，因此具有高可靠性和卫星覆盖。它还支持硬 QoS，具备端到端 QoS 和无线承载的保证比特率。其数据传输速率范围为\
  \ 20 Mbps 至 100 Mbps。\n\n# 遥控器及可用选项简介\n\n无人机系统可通过多个通道同时控制，如射频、LTE 和卫星无线电，基于不同协议。在此，每个通道对无人机拥有同等控制权，并遵循各自系统的指挥与控制。\n\
  \n同样，遥控器在 **串行总线** (**SBUS**) 协议上工作，同时配合运行在串行协议上的 MAVLink 协议。通过遥控器操作，可为无人机控制提供第二通道。\n\
  \n遥控器是一种手持设备，基于射频信号工作，用于控制无人机行为。它协助无人机起飞、降落、手动飞行，并从安全距离控制载荷。\n\n这意味着即使 GCS 控制失效，飞手仍可通过此备用通道手动控制无人机，并发送基本指令，如返航和降落。在远程操作中，遥控器连接会断开，但远程\
  \ GCS (MAVLink) 连接保持畅通，可用于指挥与控制。手持 GCS 系统通过 MAVLink 传输遥控器数据，有助于实现远程遥控控制。\n\n使用遥控发射器的首要需求是对无人机进行手动控制，即飞手驾驶无人机而非使用自动驾驶模式。飞手拥有完全自由来操控和驾驶无人机，而非遵循预定义的任务模式，以便在需要时执行紧急恢复。因此，娱乐飞行不需要\
  \ GCS。娱乐飞行可使用简单的遥控器手动驾驶无人机。可配置某些模式，使遥控器发送重要指令，如返航、降落等。\n\n## 遥控发射器系统的组成部分\n\n遥控发射器系统有两个主要组成部分：\n\
  \n* 遥控发射器\n* 遥控接收器\n\n让我们详细了解一下。\n\n遥控发射器（地面单元）通常简称为 RC。无人机发射器是一种手持设备，帮助将飞手的实时指令传输给无人机。它协助起飞、降落、手动飞行无人机，以及移动和控制载荷。下图展示了一款\
  \ FlySky 遥控器，用作无人机的发射器；它配有摇杆、电位器和开关，可配置到各个通道，以控制无人机和载荷的各种功能。它还有一个显示屏，显示有价值的信息：\n\
  \n![Figure 3.4 – A FlySky RC](img/B19566_03_4.jpg)\n\nFigure 3.4 – A FlySky RC\n\
  \n遥控接收器（空中单元）是天线；它接收发射器发出的信号，解码后发送给相应通道以进行控制和操作。\n\n飞控接收到来自遥控器的信号后，将其引导至连接的外围设备，从而使一切正常工作。遥控器的典型范围为\
  \ 1 公里至 1.5 公里。\n\n## 遥控器的工作模式\n\n无人机的油门、横滚、俯仰和偏航由遥控发射器上的摇杆控制。控制模式由横滚、俯仰、偏航和油门的分配决定。各种工作模式如下图所示：\n\
  \n![Figure 3.5 – The different modes of working of a transmitter](img/B19566_03_5.jpg)\n\
  \nFigure 3.5 – The different modes of working of a transmitter\n\n如你所见，不同模式下使用不同的摇杆操作。在大多数情况下，我们会在发射器端使用模式\
  \ 2。\n\n下图简要描述了使用遥控模式 2 时，每个摇杆关联的通道：\n\n![Figure 3.6 – The different channels of\
  \ each stick when using RC mode 2](img/B19566_03_6.jpg)\n\nFigure 3.6 – The different\
  \ channels of each stick when using RC mode 2\n\n具体如下：\n\n* **横滚**：无人机的左右移动由发射器右侧摇杆控制。\n\
  \n* **俯仰**：无人机的前后移动由发射器右侧摇杆的上下移动控制。这被称为俯仰运动。\n\n* **油门**：无人机的上升和下降由发射器左侧摇杆的上下移动控制。这称为油门，用于高度调整。\n\
  \n* **偏航**：无人机的顺时针和逆时针旋转由发射器左侧摇杆的左右移动控制。\n\n## 主要遥控协议\n\n遥控协议可分为两组：\n\n\n\n\n* \
  \  **RX 协议**：无线电**接收机**（**RX**）与**飞控**（**FC**）之间的通信\n*   **TX 协议**：无线电**发射机**（**TX**）与无线电接收机之间的通信\n\
  \n在下图中，我们可以看到发射机与接收机的同步，以及它们与飞控的绑定关系：\n\n![图 3.7 – 发射机和接收机如何与飞控配合工作](img/B19566_03_7.jpg)\n\
  \n图 3.7 – 发射机和接收机如何与飞控配合工作\n\n## 发射机协议\n\n无线通信是无线电发射机与接收机之间使用的一种通信方式。许多制造商提供自己的\
  \ TX 协议。某些品牌甚至根据所用硬件提供多种协议。以下是常用 TX 协议的列表：\n\n*   ACCST (Frsky)\n*   ACCESS (Frsky)\n\
  *   DSM (Spektrum)\n*   DSM2 (Spektrum)\n*   DSMX (Spektrum)\n*   AFHDS (Flysky)\n\
  *   AFHDS 2A (Flysky)\n*   A-FHSS (Hitec)\n*   FASST (Futaba)\n*   Hi-Sky (Deviation\
  \ / Devo)\n\n此处未对这些协议进行解释，因为它们在今天已不广泛使用，且与本书无关。如果您想快速了解，可以在网上轻松找到这些协议的资料。\n\n##\
  \ 接收机协议\n\n无线电接收机通过有线接口与飞控通信。一些 RX 协议是标准的，可在同一制造商的所有接收机中找到，而另一些则是特定制造商的专有协议。以下是一些标准\
  \ RX 协议：\n\n*   PPM 或 CPPM\n*   PWMSBUS (Futaba, Frsky)\n*   IBUS (Flysky)\n*  \
  \ XBUS (JR)\n*   MSP (Multiwii)\n*   CRSF (TBS Crossfire)\n*   SPEKTRUM1024 (Spektrum\
  \ DSM2)\n*   SPEKTRUM2048 (Spektrum DSMX)\n*   FPort (Frsky)\n\n### 脉冲位置调制 (PPM)\n\
  \nPPM 也称为 CPPM 或 PPMSUM。PPM 帧是一组在单根平衡线上随机发送的 PWM 信号。\n\nPPM 优于 PWM 的优势在于它用一根线缆即可传输多个通道。因此，通常情况下，地线、电源线和信号线应连接到八个通道。\n\
  \n它不如串行通信准确或平滑（即使是小流量串行通信），因为通道数值不会同时到达：\n\n![图 3.8 – 显示 PPM 三针线缆连接的图片](img/B19566_03_8.jpg)\n\
  \n图 3.8 – 显示 PPM 三针线缆连接的图片\n\n### 脉宽调制 (PWM)\n\nPWM 兼具数字信号和模拟信号的特性，脉冲的长度指示舵机输出或油门位置。信号通常在\
  \ 1000 μs 到 2000 μs（微秒）之间。\n\n这是最常见且最原始的遥控协议。由于没有飞控，接收机用于通过标准 PWM 信号直接控制舵机和电调。\n\
  \n其缺点是布线麻烦，因为每个通道只有一根舵机线。因此，在使用飞控时，PPM 和 SBUS 通常比 PWM 更好。如果能在一根线上获取所有通道，飞控的工作效果一样好——甚至更好：\n\
  \n![图 3.9 – 遥控接收机与 PWM 连接](img/B19566_03_9.jpg)\n\n图 3.9 – 遥控接收机与 PWM 连接\n\n###\
  \ 串行协议\n\n串行协议是一种无损数字协议，仅使用三根线（信号、电源和地）即可传输多个通道。与在时域发信号的 PPM 不同，串行协议是完全数字化的——即使用\
  \ 1 和 0。顾名思义，串行协议要求飞控上有串口。\n\n### SBUS 协议\n\nSBUS 是无人机和遥控器用来相互通信的共同语言。这是遥控器告诉无人机做什么的一种数字方式。通信简单高效，因为信息通过单根导线发送，而不是多根导线。这有助于无人机理解并遵循遥控指令，从而平稳飞行。\n\
  \n# 总结\n\n在本章中，我们了解了各种指挥与控制接口及其对无人机的意义。我们了解了地面站的多种类型、其工作原理及其含义。我们还了解了遥控发射机和接收机涉及的协议和程序，以及如何使用它们。我们现在清楚地知道什么是\
  \ GCS 以及为什么需要它。\n\n在下一章中，您将学习如何从零开始设计无人机、如何选择无人机的每个部件，以及如何打造一架成功的无人机。\n"
- "## 第 4 章：了解无人机系统、子系统和组件\n\n早前，我们阅读了作用在无人机上的力、其主要硬件、系统和子系统，以及适用于无人机的系统。现在，我们将继续学习这些硬件系统的开发。在本章中，我们将学习对无人机整体开发有帮助的主要概念、术语和法规。这将使用户能够根据给定的规格设计自己的系统。\n\
  \n在本章中，我们将学习如何根据规格要求为无人机选择最佳组件，以及如何将它们集成以开发无人机。我们将通过以下主题帮助您详细理解该概念：\n\n*   理解和构想系统\n\
  *   设计动力系统\n*   设计和开发机身\n*   开发控制系统\n*   选择导航和通信系统\n\n## 技术要求\n\n在本章中，主要技术要求是基础高中物理、作用在物体上的合力知识，以及基础电气工程和计算。了解电路电压、电流、功率、电池等将大有裨益。有操作电气仪器的经验更佳。\n\
  \n## 理解和构想系统\n\n理解和构想有助于我们为专用应用和目的构建各类无人机。正如我们在 *第 1 章* 中看到的无人机可用的主要应用，我们现在将看到无人机如何被构想和开发。\n\
  \n无人机基本上是一个能够携带特定载荷能力飞入空中的平台，我们已经结合**最大起飞重量**（**MTOW**）对此进行了研究。因此，无人机平台可通过施加允许载荷并优化其重量、续航、尺寸和功率，帮助将无人机转变为不同的应用。\n\
  \n在构想系统时，我们需要考虑并决定以下事项：\n\n*   **应用**：目的是了解无人机构建所针对的应用和目的，例如，激光雷达载荷进行城市测绘、RGB 相机进行土地测绘、农业中的作物喷洒/播种、昼夜监视或高续航系留无人机。了解应用将有助于您在机身设计和组件选择及布局方面更好地构想系统。您将更清楚无人机必须经历的情况和工作类型；因此，无人机可以为此进行定制。\n\
  *   **续航（飞行时间）**：续航是在构想无人机时必须考虑的关键因素。长续航可帮助您飞行更久，执行更多高效任务，而无需频繁降落更换电池。然而，应用的需求仍然是首要考量。\n\
  \n\n\n\n\n# 无人机设计参数\n\n## 航程\n无人机的航程是指其在与地面控制站保持通信链路连接的情况下能飞多远。该参数取决于我们要服务的应用场景。对于不需要飞往远距离的摄影无人机，1\
  \ 到 1.5 公里的航程就足够了；但对于需要长距离飞行的测绘和监视无人机，15-20 公里的航程也仅属一般水平。属于**高空长航时 (HALE)** 或**中空长航时\
  \ (MALE)** 类别的大型无人机，其航程可达 200-300 公里。因此，航程也是决定设计方案的重要因素之一。\n\n## 最大载荷重量\n该参数给出了无人机安全起飞时所能承载的最大允许载荷重量。由于无人机有其自身重量，现在作为变量的是载荷重量，应将其确定为最大值。这将帮助我们仅选择重量合适的载荷安装到无人机上。\n\
  \n## 功能与特性\n这一点决定了除了传统飞行平台外，我们还想为系统增加哪些额外功能。这些功能包括导航灯和 ADS-B 进/出功能。这些并非强制性功能，而是取决于当地法规或客户需求。遵守国家法律法规在设定系统运行特性方面起着至关重要的作用。一些国家要求飞越视距外\
  \ (BVLOS) 需要许可，而另一些则不需要。在某些国家（如美国），强制要求远程 ID，而一些国家正在制定针对无人机运营的合规标准。我们可以认为，功能和规格应根据当地法规和合规要求进行修改。\n\
  \n通过确定上述因素，我们可以逐步决定无人机的基本组件，这些将在后续主题中介绍。\n\n# 设计动力系统\n\n动力系统或动力总成是无人机中最重要的系统。它是无人机的骨干，使无人机能安全起飞、执行任务、提供所需续航时间，并能在行动过程中进行急剧机动和抵抗大风。正如我们在前一章所学，无人机的重量是选择其动力系统的关键，我们可以展望不同组件的大致重量分布，以估算无人机的大致总重。\n\
  \n无人机的动力系统主要由电机、螺旋桨、`ESC`、电源分配板和电池组成。这些是关键组件，其重量在决定无人机的 `MTOW`（最大起飞重量）中起关键作用。让我们看看这些组件，以及基于多旋翼开发经验选择最佳组件的方法。\n\
  \n假设一架无人机的估计总重（含载荷）为 4 公斤，要求最低续航时间为 60 分钟。我们可以按如下方式划分组件的大致重量分布：\n\n| **序号** | **组件**\
  \ | **重量百分比** |\n| --- | --- | --- |\n| 1. | 机身 | 15% |\n| 2. | `ESC` + 电机 + 螺旋桨\
  \ | 13% |\n| 3. | 电池 | 40% |\n| 4. | 载荷 | 15% |\n| 5. | 航电设备 | 10% |\n| 6. | 杂项及预留\
  \ | 7% |\n\n表 4.1 – 组件大致重量分配\n\n上表描述了无人机所用组件的大致重量分布。这纯粹基于开发多旋翼的个人经验，并非必须遵循的铁律。根据开发经验，重量比往往遵循这一趋势。因此，可根据用户需求和应用进行调整。\n\
  \n## 电机与螺旋桨组合的选择标准\n\n我们在前几章已经学习过，电机用于提供旋转，根据旋转情况，螺旋桨产生所需的推力将无人机拉入空中。这里我们将了解如何为电机螺旋桨选择最佳动力总成，以在重量更轻、功耗更低、体积更小的前提下获得所需推力。\n\
  \n选择过程中的权衡如下：\n\n*   **重量与功率**：选择重量较轻且功耗较低、同时能提供所需推力的电机。\n*   **尺寸与功率**：搭配上述选定电机的较小尺寸螺旋桨功耗较低，但能提供相当的推力。\n\
  *   **推重比**：值得注意的是，在任何电机和螺旋桨的组合中，不应通过选择尺寸更小、重量更低的组件来妥协推力需求。请务必确保该组合能产生所需推力，因此在选择这些组合时需要适当关注。\n\
  \n### 推重比\n\n**推重比 (`TWR`)** 是多旋翼设计和运行中的基本比率。`TWR` 影响无人机的飞行动力学及其在应用中的能力。顾名思义，`TWR`\
  \ 是动力系统产生的总推力与多旋翼总重量的比值。\n\n#### TWR 的重要性\n\n`TWR` 对于预测多旋翼上升、机动和有效载荷的能力（具有响应性和稳定性）非常重要。这对于开发用于航拍、监视和娱乐飞行等应用的无人机至关重要。较低的\
  \ `TWR` 会导致无人机性能迟钝，难以执行急剧机动；而过高的 `TWR` 会损害无人机的稳定性。\n\n#### 通用多旋翼的理想 TWR\n\n对于普通多旋翼，典型的\
  \ `TWR` 通常为 2:1 到 3:1。这有助于在灵活性和稳定性之间寻求平衡，使多旋翼能高效完成各种任务。它为快速上升和动态机动提供了足够的推力，而不牺牲整体控制和稳定性。\n\
  \n#### 计算 TWR\n\n`TWR` 使用以下公式计算：\n\n```\nTWR = 总推力 / 总重量\n```\n\n此处，总推力是多旋翼中所有动力单元（电机）的综合输出，重量是飞行器的总质量（含任意载荷）。\n\
  \n高 `TWR` 和低 `TWR` 的区别如下：\n\n*   **高 TWR**：具有高 `TWR`（即 `TWR` >3:1）的多旋翼，其推力相对于重量较强。这种\
  \ `TWR` 适用于需要快速加速、急剧机动和快速上升的应用，如竞速无人机。\n*   **低 TWR**：反之，具有低 `TWR`（即 `TWR` <2:1）的多旋翼可能更稳定，但缺乏动态飞行所需的灵活性。低\
  \ `TWR` 的多旋翼通常部署在以稳定性为首要要求的应用中，如航拍或监视。\n\n实现最佳 `TWR` 的要求如下：\n\n*   **电机和螺旋桨选择**：选择适合预期应用的电机和螺旋桨。高质量、大功率的电机搭配兼容的螺旋桨，能实现高效的推力产生。\n\
  *   **电池选择**：选择具有所需容量和放电率的电池，以提供最佳推力所需的功率。\n*   **重量管理**：通过为机身和组件使用轻量化材料，优化多旋翼的整体重量，在结构强度和减重之间建立平衡。\n\
  *   **高效电子元件**：使用高效的电子元件，包括 `ESC` 和飞控，以增强电源管理和整体性能。\n\n## 所用电机的特性\n\n\n\n\n既然我们正在开发一款无人机，就不能使用市面上任意可买到的电机。无人机推荐使用**无刷直流\
  \ (BLDC)** 电机，这种电机效率高、重量轻、体积小且耗电流少。电机还应产生足够的扭矩来旋转螺旋桨以产生所需的推力。作为无人机工程师，以下是我们应了解的电机几项关键规格：\n\
  \n*   **KV 值**：BLDC 电机的 KV 值规定了在空载条件下，每施加 1 伏特电压电机转动的 RPM（每分钟转数）。简单来说，KV 值表示 BLDC\
  \ 电机每伏特的 RPM。如果电机是 100 KV，意味着施加 1 伏特电压时，BLDC 电机将转动 100 次。在实际工况下，由于螺旋桨和旋转时的空气阻力，电机上会有一定负载，因此电机无法达到空载\
  \ RPM，但会接近该值。由于负载的存在，扭矩的概念随之而来，我们稍后将看到。\n\n    因此，在选定电机时，也应考虑电池配置，具体指这些电机将在哪种电池上运行，即\
  \ 6S、8S 或 12S。对于 100 KV 电机和 25 伏特电池，最大电压下的 RPM 将是 `25 x 100 = 2500 RPM`。\n\n*  \
  \ **电机扭矩**：扭矩基本上是电机克服风阻旋转螺旋桨的力量。换句话说，它是电机克服施加负载所需的力。因此，大螺旋桨和重载应用使用扭矩较大的电机，而轻载应用使用扭矩较小、RPM\
  \ 较高的电机。\n\n    电机的扭矩和 KV 值成反比。KV 越高，扭矩越低，反之亦然。较高 KV 的电机在特定电压下 RPM 更高、扭矩更小，因此它们搭配较小的螺旋桨在较高\
  \ RPM 下产生推力。\n\n    KV 较低的电机 RPM 较低、扭矩大，因此转速较慢但使用较大的螺旋桨，产生的推力大小相同。\n\n*   **工作电压**：这是电机选型中最重要的参数。我们需要确定所用电池是\
  \ 6S、8S、12S（以此类推），并选择在该电压下工作的电机。选择工作电压低于电池电压的电机会烧毁电机，因此应根据我们选择的电池的合适电压来选择电机。\n\n\
  ## 电机规格与推力图表\n\n电机规格包括电机的机械图纸及其参数，而推力数据图表尤为重要，它提供了电机搭配不同兼容螺旋桨时的性能详情。这些图表由电机制造商提供，包含关于推力、功率扭矩和其他参数的精确细节，有助于观察电机性能并选择合适的电机。同样的数据也可在本地使用推力测试台对任意电机推导得出。\n\
  \n为给我们的应用选择电机，我们可以浏览不同制造商的电机规格和推力测试台数据，并对这些电机推力数据进行对比分析。我们可以重点关注以下参数：\n\n*   **电压**：既然我们构建的是\
  \ 6S 配置的系统，我们会选择至少支持 6S（标称电压 22.2V）的电机。因为下文提到的电机适用于 6S 配置，所以我们可以继续使用它。\n*   **推力**：我们会观察这些电机产生的推力，其应接近无人机重量（保持推重比\
  \ TWR 为 2:1），并选择能产生该推力的螺旋桨组合。\n*   **重量与尺寸**：考虑上述因素，我们会寻找以最轻电机重量和最小螺旋桨尺寸产生所需推力的组合。这有助于减小无人机的尺寸和重量。\n\
  *   **电流消耗**：既然我们需要高续航，我们需要寻找能提供相同推力、更轻重量、更小尺寸且更低电流消耗的组合。\n\n上述四点是为无人机选择动力系统时需观察的四个主要要点。由于实际场景包含热损耗和其他环境因素，推力测试台数据可能不完全准确。\n\
  \n考虑上述因素后，我们将研究一款 `T-Motor Antigravity 5006 300 KV Motor` 的推力图表，该图表包含不同尺寸螺旋桨在不同油门百分比下的数据，反映了其性能。\n\
  \n电机的产品图纸帮助设计师提取以下机械信息：\n\n*   安装孔直径\n*   孔距\n*   电机直径和厚度\n\n这些信息帮助设计师在机身设计中提供安装结构，并对其进行更好的优化。\n\
  \n以下是所选电机的规格和机械图纸：\n\n![图 4.1 – MN5006 300 KV 电机外形图（来源：T-Motor）](img/B19566_04_1.jpg)\n\
  \n图 4.1 – MN5006 300 KV 电机外形图（来源：T-Motor）\n\n以下是制造商 T-Motor 提供的电机规格图片，清晰列出了物理属性和配合该电机使用的推荐电子元件。这有助于航电工程师计算无人机重量和推进系统的总功耗：\n\
  \n![图 4.2 – MN5006 300 KV 电机规格（来源：T-Motor）](img/B19566_04_2.jpg)\n\n图 4.2 – MN5006\
  \ 300 KV 电机规格（来源：T-Motor）\n\n以下是制造商的推力测试台数据图片，将帮助我们为之前确定的 4 公斤无人机选择螺旋桨。数据表展示了电机搭配螺旋桨在不同油门百分比下的电流、功率、RPM\
  \ 和扭矩。还给出了电机在运行过程中达到的最高温度：\n\n![图 4.3 – MN5006 300 KV 电机测试报告（来源：T-Motor）](img/B19566_04_3.jpg)\n\
  \n图 4.3 – MN5006 300 KV 电机测试报告（来源：T-Motor）\n\n## 电机与螺旋桨选择\n\n在上图中，我们可以看到对于 `18*6.1”\
  \ CF 螺旋桨`，在 50% 油门下，单个电机推力等于 968 克。既然我们开发的是四旋翼无人机，四个旋翼产生的总推力为 `968 x 4 = 3872 克`，这接近\
  \ 4 公斤（无人机重量），保持了通用应用 2:1 的推重比 (TWR)。\n\n`17*5.8” CF 螺旋桨` 效率低于 `18*6.1 CF 螺旋桨`。因此我们可以继续选择\
  \ `18*6.1 CF 螺旋桨`。\n\n单个电机在 50% 油门下的电流消耗为 3.67 安培，而四个电机在 50% 油门下的总电流消耗为：`3.67 x\
  \ 4 = 14.68 安培`。因此，电机产生的总推力足以在 14.68 安培下悬停，该数据来自规格图表。这些数据足以让我们继续采用该组合，因为在此场景下工作温度不会过高。\n\
  \n因此，我们可以认为该电机符合我们的要求，并根据数据表证明是高效的。然而，这并非理想情况；在实际场景中，风、速度、飞行方式等许多其他因素都会发挥作用，上述数据可能会受到轻微影响。\n\
  \n下一步是计算该组合的飞行时间以获得良好的续航。让我们为该应用考虑一款合适的电池。\n\n## 电池选择\n\n电池是无人机的动力源。正如我们在前一章讨论的不同电池类型，在为我们的应用选择合适的电池前，有几个关键额定值需要牢记。\n\
  \n\n\n\n我们现在已经从上图中得到了无人机的电流消耗。由于其他航空电子设备和环境影响（如风），总电流消耗将始终高出 5%，因此让我们将电流消耗保持在 `14.68\
  \ + 5% = 15.414` 安培，这意味着无人机的总电流消耗可视为 `15.414` 安培。我们将以此作为所有计算的基础。\n\n选择电池时需要注意以下事项：\n\
  \n- **重量**：由于我们拥有一个飞行系统，始终建议将重量降至最低。我们应始终寻找具有高能量密度和低重量的电池，这将为我们带来更好的效率和更高的续航时间。\n\
  \n- **C 率**：根据电池大学的说法，电池的充放电速率由 C 率决定。C 率决定了电池的安全放电，即电池在不损坏的情况下能安全向系统提供的安培数。它标注为\
  \ `5C`、`15C`、`22C`。计算方法如下：假设电池容量为 `16Ah`，即 `16000mAh`，C 率为 `5`，安全放电电流等于 `Ah x C`，所以\
  \ `16 x 5 = 80 安培`。因此，该电池可持续提供 `80 安培` 而不损坏，尽管我们的应用消耗电流应小于该值。\n\n如果满足上述考虑重量和能量密度的额定值，我们可以从聚合物锂电池、锂离子电池和固态聚合物锂电池中选择任意一种电池化学体系。\n\
  \n# 计算飞行时间（续航时间）\n\n飞行时间使用一个简单的基本公式计算：储存能量除以消耗能量。\n\n对于我们的应用，总电流消耗为 `15.5 安培`（四舍五入）。如果我们选择\
  \ `16 AH` 的电池，将以最小重量满足我们的续航要求。\n\n## 计算飞行时间的公式\n\n多旋翼飞行时间 (T) 可使用以下简化公式估算：\n\n```\n\
  Flight Time = ( Capacity(Ah) × 60) / Ampere Draw\n```\n\n其中飞行时间待计算，容量 (Ah) = `16Ah`\
  \ 或 `16000mAh`，电流消耗为 `15.5`。\n\n将数值代入公式得出 `61.93 分钟`。\n\n因此，我们计算出 `4 千克` 无人机的飞行时间为\
  \ `61.93 分钟`。\n\n这就是我们如何选择合适的动力系统并计算系统飞行时间。请注意，飞行时间是一个近似的理想飞行时间。实际上，飞行时间受温度、湿度、飞行高度、风力等诸多因素影响，因此续航时间会有所变化。\n\
  \n# 设计与开发机身\n\n机身是无人机的骨架，它将航空电子设备和其他组件紧密且刚性地固定在一起。它是真正进入空中并承受环境影响的结构；因此，机身应刚性强、结实且轻量化。我们可以使用各种可用软件设计自己的机身并遵循复合材料制造工艺，也可以使用市场上现成的机身。\n\
  \n无论我们是设计机身还是购买机身，都需要考虑以下要点，这些要点有助于我们了解无人机能承载多少负载以及机动性如何：\n\n- **专业工程设计**：当机身在实验室开发时，会选择特定材料，如碳纤维、玻璃纤维等，并必须经过切割、钻孔等制造工艺。材料（即碳纤维）按特定层序铺设在模具中，使用树脂固化。这使纤维硬化并形成模具形状。从而得到所需形状，再通过机加工进行工程化处理。\n\
  \n    如果您内部设计了机身并有一些独特概念，这就是制造机身的过程。然而，对于初学者构建，市场上有四轴/六轴飞行器机身可供起步构建。\n\n    机身内外应光滑平整，无粗糙表面，且在所有轴向上尺寸等效。\n\
  \n- **构型与尺寸**：机身的通用测量术语称为轮距。轮距指两个电机座之间的对角线中心距。螺旋桨应完美适配机身，在空中不与机身任何部件或自身碰撞。机身不应有任何松动末端。机身在所有构型下也应保持平衡，具有合适的重心和质心。\n\
  \n- **安装座与固定件**：安装座与固定件是安装航空电子设备（如电机、`ESC` 和其他部件）的硬件，按期望方式安装在无人机上。电机的这些安装座和固定件设计开发有孔位和固定装置，用于放置\
  \ `PDB`、`ESC` 和飞控。载荷安装座和空间必须预留，以保证载荷自由移动。安装硬件（如螺丝、胶水、螺母和螺栓）的细节应恰当。\n\n- **材料**：制造机身的材料应轻量且坚固，在所有轴向上具有良好强度。复合材料如碳纤维、玻璃纤维或凯夫拉因其轻量和优异的强度特性，被广泛用于制造机身。这些材料对环境条件也应惰性，长期使用不应磨损。\n\
  \n- **强度**：机身应具有足够强度以承受电机产生的力和重力。易损区域如臂关节和电机安装关节必须坚固，能在剧烈机动中承受空中载荷。\n\n# 开发控制系统\n\
  \n本节将介绍控制系统开发。\n\n## 电子调速器与飞行控制器\n\n`电子调速器` (`ESC`) 是位于 `飞行控制器` (`FC`) 和 `BLDC`\
  \ 电机之间的小型设备。顾名思义，`ESC` 根据从 `飞行控制器` 接收到的信号控制 `BLDC` 电机的转速。每个电机需要一个 `ESC` 来控制其转速，并连接到\
  \ `飞行控制器`。`FC` 同时拥有连接 `ESC` 的 `脉宽调制` (`PWM`) 引脚。`FC` 根据 `GCS` `RC` 给出的指令向 `ESC`\
  \ 发送 `PWM`/`DShot` 信号以运行电机。`ESC` 从电池获取电力，从 `飞行控制器` 获取信号。下图说明了此设置：\n\n![Figure 4.4\
  \ – The workings of an ESC](img/B19566_04_4.jpg)\n\nFigure 4.4 – The workings of\
  \ an ESC\n\n`ESC` 连接电池并向电机提供电池电压。`ESC` 是一种振荡器或脉冲发生器，传递可变占空比，常用作电机调速器。这由 `FC` 通过\
  \ `PWM` 信号控制。`FC` 产生的用于驱动 `BLDC` 电机的 `PWM` 信号被送入 `ESC`。`PWM` 信号值在 `1000` 到 `2000`\
  \ 微秒之间变化，其中 `1000` 代表最低电压电平，`2000` 代表需供给电机的最高电压电平。该电压值取决于供给 `ESC` 的 `PWM` 值。`飞行控制器`\
  \ 拥有特殊的电机驱动算法，根据电机转速控制滚转、俯仰和偏航。\n\n选择无人机 `ESC` 时需考虑的因素如下：\n\n\n\n\n\n## ESC 选择标准\n\
  \n### 电流额定值\n\n**电流额定值**：电流额定值是必须首先检查且最重要的指标。ESC 的电流额定值是指在不烧毁的情况下，可以安全通过的电流大小。电机工作时会拉取电流，电流经过\
  \ ESC。为此，必须了解电机-桨叶组合的正确电流额定值。在我们之前的电机参数表示例中，可以看到每个电机可拉取 19.6 安培的电流，因此 ESC 的额定值应至少比该值高\
  \ 10%。\n\nESC 有两种电流额定值类型：\n\n*   **持续电流**：持续电流是指 ESC 能够稳定通过的最大电流，包含尖峰和波动。\n*   **爆发电流**：爆发电流是指在不损坏\
  \ ESC 的情况下，短时间内（即 10 秒）通过的最大电流。ESC 的爆发额定值有助于应对大风和剧烈机动等情况，此时电机必须加速旋转并需要额外电流。\n\n\
  ### 工作电压额定值\n\n**工作电压额定值**：工作输入电压是指 ESC 能够承受且电机在此电压下工作的电池最大输入电压。许多 ESC 支持 `4S` 到\
  \ `6S`（S 表示电芯数）电池，而其他 ESC 支持 `12S` 到 `14S` 电池。具体需要哪种 ESC 取决于应用场景。对于我们之前确定的 4 千克配置，40\
  \ 安培的 ESC 就足够了。\n\n### 重量和尺寸\n\n**重量和尺寸**：ESC 的尺寸和重量是关键因素，因为它们影响无人机的重量及其在机架上的安装位置。电流额定值越大，ESC\
  \ 的尺寸越大。一些大电流 ESC 还配有散热片，这会使尺寸和重量进一步增加。\n\n### ESC 协议\n\n**ESC 协议**：协议是飞控与 ESC 之间的通信工具。它们定义了飞控与\
  \ ESC 之间通信速度和时间同步的方式。更好的 ESC 是指支持所有主流协议的 ESC。常用的通用协议包括脉宽调制（`PWM`），这是一种用于向 ESC 传输信号的模拟协议。然而，更新、更高效的数字协议已经出现——`Dhot`\
  \ 和 `proshot`——它们更精准、更快速。\n\n因此，ESC 是无人机的重要组成部分，应根据电机的电流消耗和最新协议进行选择。\n\n## 飞行控制器\n\
  \n飞行控制器是无人机最重要、最关键的部件；它有助于控制无人机的运动和稳定性。根据功能、协议以及 IMU 和传感器选择合适的飞控时，必须牢记许多因素。\n\n\
  飞行控制器是无人机的大脑。它主要根据从传感器接收到的输入来控制 ESC 和电机的运行。飞控拥有板载传感器、处理器、通信协议和外部通信接口。飞控的目的是利用其板载传感器（包括我们之前讨论过的\
  \ IMU）在飞行过程中稳定无人机。\n\n### 如何选择飞行控制器\n\n市面上有各种飞控可供选择，我们如何挑选最适合我们应用的最佳飞控？基于各种因素，可以选择最佳飞控：\n\
  \n#### 微控制器\n\n**微控制器**：每个飞控都有一个微控制器，它主导所有决策和操作速度。在关键决策场景下，我们需要能够快速决策和快速处理数据的飞控。有许多飞控配备不同的微控制器板，例如\
  \ `Atmel Mega 644PA 8 Bit`、`ATMega 328P`、`STM 32 F4 32 bit` 等。这类似于我们在选择笔记本电脑时查看处理器，即\
  \ `i5`、`i7`、`Ryzen`。\n\n因此，如果需要快速处理数据，必须选择具有最佳微控制器板的飞控。\n\n#### 固件\n\n**固件**：固件是飞控的灵魂，也是无人机的灵魂，因此必须选择支持且兼容可靠固件的飞控。目前广泛使用的一些关键开源固件包括\
  \ `ArduPilot` 和 `PX4`。除此之外，还有 `Betaflight` 和 `INAV`，它们引领着行业。固件代码也应易于获取，并且在需要时应能根据用户需求进行修改。\n\
  \n让我们看看业界知名的飞控固件：\n\n##### ArduPilot 固件\n\n**ArduPilot 固件**：`ArduPilot` 是一个知名的开源飞行栈，支持多种飞行器配置，包括多旋翼。它包含一套简要功能，对业余爱好者和专业用户都很有帮助：\n\
  \n*   **通用性**：`ArduPilot` 飞行栈用途广泛，因为它支持多种飞行器类型，如多旋翼、固定翼、地面车和船只。\n*   **功能丰富**：`ArduPilot`\
  \ 包含许多功能，包括航点导航、一键返航、定高，以及对各种传感器和执行器的支持。\n*   **庞大且活跃的社区**：`ArduPilot` 的用户社区庞大且活跃，确保了持续的开发和支持。\n\
  \n##### PX4 固件\n\n**PX4 固件**：`PX4` 是一个类似的知名开源飞行栈，专为无人飞行器设计，包括多旋翼。它以模块化和实时能力著称。其主要特点如下：\n\
  \n*   **模块化和适应性**：`PX4` 的基本设计是模块化的，使用户能够修改并将其适配到不同的飞行器和配置中。\n*   **实时操作系统** (`RTOS`)：`PX4`\
  \ 包含一个 `RTOS`，提供精确且低延迟的控制。这对于要求多旋翼具有响应性能的应用特别有用。\n*   **硬件集成**：`PX4` 支持与其栈兼容的广泛硬件组件，为用户选择兼容的传感器、控制器和其他组件提供了灵活性。\n\
  \n#### 传感器\n\n**传感器**：传感器是收集无人机物理信息的主要来源；它们充当无人机的感官器官。现代飞控配备内置传感器，如加速度计、陀螺仪、温度传感器和磁力计，它们向微控制器提供数据，以便根据编写的固件做出所需决策。传感器主要用于获取无人机的姿态，并在滚转、俯仰和偏航时进行稳定。\n\
  \n以下是不同类型板卡所用传感器的列表：\n\n*   `KK 2.1.5 飞控板`：`MPU6050` 陀螺仪和加速度计\n*   `ArduPilot APM\
  \ 2.8`：三轴陀螺仪加速度计、气压计\n*   `OpenPilot CC3D`：三轴陀螺仪加速度计\n*   `ArduPilot APM 2.6`：三轴陀螺仪加速度计、气压计\n\
  \n#### 通信协议\n\n**通信协议**：要与任何外围设备（如 GPS、测距仪或喷洒器）配合工作，我们需要一种与该外围设备兼容的通信协议。为此，我们需要一款支持多种通信协议的飞控，如\
  \ `UART`、`I2C`、`CAN`、`PWM` 等。我们在前面的章节中讨论过这些协议。这些协议用于在传感器和飞控之间双向传输数据，飞控以此快速准确地做出所需决策。以下是几个具有通信协议的飞控示例：\n\
  \n*   `KK` 飞控：内置 LCD 显示屏和四个配置按钮\n*   `ArduPilot APM` 飞控板：`PWM`、`I2C`、`UART`、`PWM`、`PMU`\
  \ 和 `SBUS`\n*   `OpenPilot CC3D` 飞控：`UART`、`I2C` 和 `SBUS`\n*   `ArduPilot APM 2.6`\
  \ 飞控板：`UART`、`I2C`、`SBUS`、`CAN` 等。\n\n\n\n\n\n上述飞行控制器是根据应用、所需通信协议和固件选择最佳飞行控制器的关键参数。其他一些次要因素包括控制器的尺寸和重量以及功耗，功耗应极低。\n\
  \n### 一些知名的飞行控制器板\n\n前面我们学习了根据应用需求，飞行控制器所需的不同特性。以下是一些行业内知名、运行在不同无人机上的飞行控制器板列表：\n\
  \n*   **KK 飞行控制器板**：KK 飞行控制器是一款入门级飞行控制器，内置 LCS 和四个按钮，用于配置板卡以进行飞行。该飞行控制器专为多旋翼、三旋翼、四旋翼或六旋翼设计，并在飞行过程中保持其稳定。该飞行控制器基于\
  \ `Atmega644 PA IC`，搭配 `InvenSense MPU-6050` IMU 传感器。\n\n*   **Pixhawk 2.8 飞行控制器**：随着无人行业的发展，我们开始将相同的自动驾驶板或硬件用于多种无人应用。Pixhawk\
  \ 飞行控制器是一款开源飞行控制器，通过更换固件，可使用相同的硬件构建固定翼无人机、多旋翼和无人车。这使我们有机会利用相同的硬件和传感器构建更多无人飞行器。Pixhawk\
  \ 可使用 `GCS 软件` 执行预编程的自主任务，并利用机载指南针执行多航点任务，这使其成为一款先进的飞行控制器。集成的三轴 IMU 和基于 `ATMega`\
  \ 芯片的机载日志记录功能，使这款飞行控制器更加先进，并更易于用于具有专用失效保护模式的自动化任务。\n\n*   **DJI Naza**：DJI Naza\
  \ 是一款功能全面增强的先进飞行控制器，最多可支持九种类型的多旋翼。它配备有配置好的 GPS、智能手机助手软件和免费地面控制站。该飞行控制器具有电源输出故障保护、智能操作控制、飞行模式和多种外设通信协议，可帮助其连接输出传感器以获取数据和进行决策，从而使其更加独特。对于寻求稳定且长航时飞行的高级用户来说，DJI\
  \ Naza 是一块很棒的板卡。\n\n*   **Pixhawk Cube Orange**：Pixhawk Cube Orange 是无人行业中应用最广泛的开源飞行控制器。使用这款\
  \ Pixhawk 飞行控制器最大的优势之一是其开源设计，甚至提供了硬件的微小细节，进而允许访问硬件和设计的详细信息。这结合了开源无人机固件，如 `ArduPilot`\
  \ 或 `PX4`，它们是与 Pixhawk Cube Orange 搭配运行任何无人系统的两款最先进且应用最广泛的固件。Pixhawk Cube 支持多旋翼、固定翼和\
  \ VTOL 无人机、无人车和潜艇。通过更换固件，可将其装备在任何载具上。Cube Orange 之所以先进，是因为它配备了 `STM32H7` 微控制器和一个失效保护协处理器。它为外部硬件和外设接口提供了高连接选项，如\
  \ `SPI`、`I2C`、`PWM` 和 `CAN`。它拥有冗余电源和用于数据记录的 microSD 卡。\n\n因此，我们可以得出结论，上述列出的飞行控制器都是现代自动驾驶系统，可用于构建特定应用的无人机。在前面的主题中，我们还了解了如何为我们的无人机选择外围设备和自动驾驶系统。\n\
  \n# 选择导航和通信系统\n\n导航和通信系统是无人机中最重要的系统。通信系统有助于在更长距离上对无人机进行指挥和控制，而导航系统帮助无人机确定其北向，并在自主任务中引导系统前往航点。\n\
  \n## 通信系统\n\n通信系统基本由一个无线电调制解调器和一个天线组成，它们连接到地面控制站和无人机，两者相互连接。该系统有助于为无人机编程自主任务，并在飞行中指挥无人机执行特定任务。让我们看看通信系统存在的参数（无线电调制解调器的例子是\
  \ `RFD900 433Mhz`）：\n\n*   **无人机航程**：航程是帮助工程师决定和集成通信系统的关键因素。随着航程要求的增加，无线电调制解调器和天线的要求也随之增加。\n\
  \n*   **功能性**：功能性是在选择通信系统时起重要作用的另一个关键因素。我们需要查看应用是否需要视频传输系统以及指挥控制功能，然后选择相应的无线电调制解调器。\n\
  \n*   **工作协议**：为了使通信与系统兼容，应匹配无人机飞行控制器的工作协议，并应具有足够的端口。通信系统的一些工作协议如下：\n\n    *   **串行\
  \ UART**：`Serial UART` 是一种通用的传统 UART 协议，用于与无人机建立串行连接。它直接连接到飞行控制器的串行接口。\n\n    *\
  \   **基于网络的通信系统（智能电台）**：存在一种带有智能电台和 `IP-based network`（基于 IP 的网络）的通信无线电设备，这是一种先进的通信设备。在这些设备中，网络在两个或更多设备之间形成，并在这些设备之间共享数据。这些设备是新时代的设备，基于互联网协议的网络通信工作，有助于共享音频、视频以及指挥和控制。这些设备在多种模式下工作，例如\
  \ `master-slave mode`（主从模式）和 `mesh mode`（组网模式）。这些是不同的网络拓扑，有助于管理它们之间的网络类型。此类设备的一些例子包括\
  \ `Doodle reduce microhard` 和 `silvus radios`，它们在无人机领域被广泛使用。\n\n*   **功耗**：在选择无线电调制解调器之前，必须记住无线电调制解调器应从无人机消耗较少的电力，因为它可能直接影响系统的飞行时间，因此即使在距离地面控制站最远的距离，无线电调制解调器也应尽可能少地消耗电力。因此，最好在购买无线电调制解调器前确保并检查数据手册。\n\
  \n*   **尺寸和重量**：正如我们所知，无人机用于偏远地区，由有限的人员操作，并且有重量限制，正如我们在前面的主题中所见，在选择无线电之前，我们应该注意它应尽可能轻巧且体积小，以免给无人机增加额外重量。系统也必须不那么复杂，以便于在\
  \ GCS 侧进行运输和组装，并节省时间。\n\n*   **频率和功率的合法性**：据观察，不同国家对可发射的最大功率有不同规定。某些频段也被允许在无需许可证的情况下使用。要使用受管制频段以外的任何其他频谱频段，必须获得州政府的许可证。例如，`2.4\
  \ GHz` 和 `5.8 GHz` 是大多数国家（如印度）用于 Wi-Fi 通信的无证频率，无需政府许可。在选择任何无线电之前，必须根据当地法规检查输出功率和频率。\n\
  \n### 集成通信设备的 GCS 系统\n\n\n\n\n\n# 集成 GCS 系统\n\n集成 `GCS` 系统是手持设备，包含摇杆、屏幕以及集成在一个外壳中的无线电调制解调器，并由一块小电池供电。这些是小型手持系统，用作无人机控制器，具备通过软件操作和通过摇杆手动操作的功能。它们还拥有多个按钮，用于配置不同功能或配置控制器本身。它们集成了无线电调制解调器，帮助无人机实现长距离飞行，同时具备指挥控制和实时视频传输功能，这使得它们重量轻、易于携带。\n\
  \n## 集成 GCS 设备示例\n\n### Herelink\n\n`Herelink` 由 `CubePilot` 制造，面向无人系统生态。它是一款小巧紧凑的手持设备，配备\
  \ 5.5 英寸屏幕、集成的 `Android` 版 `QGroundControl` `GCS`，以及一个工作在 2.4 `GHz` 频段、带有摇杆和按钮的内置无线电调制解调器。它支持\
  \ `RC` 数据、遥测数据和实时视频传输，制造商声称范围可达 15 `km`，还允许通过网络进行视频流传输。对于需要小型轻量级集成 `GCS` 进行实时视频流传输和长距离应用的新手无人机飞行员来说，这是最佳选择。它可作为任何类型手动和自主任务的完整\
  \ `GCS` 系统运行。更多详情请访问 `Herelink` 官方网站，该网站会指导您在无人机上配置该系统。\n\n### Siyi AK28\n\n`Siyi\
  \ AK28` 是一款类似于我们之前看到的 `Herelink` 的手持 `GCS`。这款遥控器由 `SIYI` 专门为农业无人机制造。该遥控器配备了一个射程\
  \ 5 `km` 的无线电调制解调器，以及一块运行其自有 `GCS` 软件的 7 英寸显示屏。单次充电可运行 10 小时。它是一款简单高效的集成 `GCS`，附带\
  \ `RC` 数据、遥测数据和实时视频传输。该设备也易于通过 `4G` 网络配置，为农业植保无人机提供有效的任务规划和控制。\n\n## 通信系统\n\n一些著名通信系统的示例如下：\n\
  \n### RFD 900 无线电调制解调器\n\n`RFD 900 radio modem` 是一种基于串行通信协议的无线电调制解调器，有助于实现 `GCS`\
  \ 与无人机之间的长距离通信。该无线电属于 `ISM` 频段无线电，工作频率范围为 900 至 928 `MHz`。由于这是基于串行协议的遥测，它通过 `GCS`\
  \ 直接向无人机提供指挥控制接口，无需遥控器控制。由于较低的数据速率和串行协议，它不具备视频流传输能力。它是一款小型轻量级无线电，在澳大利亚、加拿大、美国和新西兰免执照使用。\n\
  \n### Doodle Labs 无线电\n\n`Doodle Labs radio` 是一系列专为工业应用设计的组网无线电。它们是以长距离、高吞吐量和低 `SWaP`（`尺寸、重量和功耗`）需求著称的智能无线电。`Doodle\
  \ Labs radios` 并非像 `RFD 900` 那样的通用串行通信无线电。它们是基于 `IP` 的无线电，能组建网络，并在此网络下通过射频信号传输 `MAVLink`\
  \ 数据。\n\n#### Doodle Labs 无线电的应用\n\n`Doodle Labs radios` 用于多种应用：\n\n##### 无人机和航空器\n\
  \n`Doodle Labs radios` 用于为无人机和其他航空器提供长距离通信。这使它们能够飞越长距离并保持与地面站的连接。\n\n##### Microhard\
  \ 和 UAV 无线电\n\n这些公司与 `Doodle Labs` 类似，开发智能无线电或无人机及其他通信应用。两款无线电都有各自的操作系统和软件，在性能和功耗方面各不相同。两者都属于智能无线电范畴，能够将控制信号、通信信号和视频传输至长距离。\n\
  \n# GPS 和导航系统的选择\n\n正如我们在*第 1 章*中看到的关于无人机中 `GPS` 和指南针的用法，这里我们将了解如何为我们的无人机选择 `GPS`\
  \ 和指南针。由于无人机行业是朝阳产业，市面上有许多提供 `GPS` 和指南针一体化解决方案的制造商。`全球导航卫星系统`（`GNSS`）设备可用于汽车和国防领域以获得更好的效果，但其可用的实际数据可分为以下几类：\n\
  \n*   **定位**：确定您在世界中的位置\n*   **导航**：规划从一处位置到另一处位置的最佳路线\n*   **跟踪**：监控物体在世界中的移动\n\
  *   **测绘**：为特定区域创建地图\n*   **授时**：计算精确时间\n\n由于 `GNSS` 设备的这些优势可融入无人机用于各种应用，因此使用 `GPS`\
  \ 可提高效率。以下是在选择合适的导航模块前必须满足的标准列表。\n\n## GNSS 卫星星座数量\n\n我们都知道，不同国家发射了不同的 `GNSS` 卫星星座，用于提供\
  \ `GNSS` 服务。例如，我们有以下系统：\n\n*   美国的 `GPS`，其频段为 `L1` (1575.42 `MHz`)、`L2` (1227.60\
  \ `MHz`) 和 `L5` (1176.45 `MHz`)\n*   俄罗斯的 `Glonass`，其频段为 `L1` (1598.0625-1605.375\
  \ `MHz`)、`L2` (1242.9375-1248.625 `MHz`) 和 `L3` (1202.025 `MHz`)\n*   欧盟的 `Galileo`，其频段为\
  \ `E1` (1575.42 `MHz`)、`E5` (1191.795 `MHz`)、`E5a` (1176.45 `MHz`)、`E5b` (1207.14\
  \ `MHz`) 和 `E6` (1278.75 `MHz`)\n*   中国的 `Beidou`，其频段为 `B1I` (1561.098 `MHz`)、`B1C`\
  \ (1575.42 `MHz`)、`B2a` (1175.42 `MHz`)、`B2I` 和 `B2b` (1207.14 `MHz`) 以及 `B3I` (1268.52\
  \ `MHz`)\n*   日本的 `QZSS`，其频段为 `L1` (1575.42 `MHz`)、`L2` (1227.60 `MHz`)、`L5` (1176.45\
  \ `MHz`) 以及 `L6` (1278.75 `MHz`)\n*   印度的 `IRNSS/NavIc`，其频段为 `L5` (1176.45 `MHz`)\
  \ 以及 `S-Band` (2492.028 `MHz`)\n*   `GPS`、`Glonass`、`Galileo` 和 `Beidou` 构成全球导航系统，而\
  \ `QZSS` 和 `IRNSS/Navic` 构成特定国家的区域导航系统。\n\n下表展示了不同 `GNSS` 星座及其名称、运营商和其他有用详情：\n\n\
  ![图 4.5 – GNSS 星座对比表](img/B19566_04_5.jpg`)\n\n图 4.5 – GNSS 星座对比表\n\n一个优秀的 `GPS`\
  \ 模块支持大多数这些卫星星座，有助于获得良好的精度。例如，大多数 `GPS` 使用所有四大全球导航系统，如 `Ublox` 和 `Here3`。\n\n##\
  \ 通信协议\n\n与其他外设一样，`GPS` 设备需要通信协议与飞控通信，因此我们需要查看 `GPS` 支持哪些通信协议，以及它们是否与飞控兼容。\n\n##\
  \ 重量、尺寸和功耗\n\n外设单元必须轻量化、体积小、低功耗，同时具备更高的精度。\n\n## GNSS GPS 设备示例\n\n一些在全球制造并广泛应用于无人机的\
  \ `GNSS` `GPS` 设备示例如下：\n\n### Here3\n\n`Here3` 是开源栈 `ArduPilot` 和 `PX4` 中最著名、应用最广泛的\
  \ `GNSS` 设备。`Here3` 可靠耐用，能以厘米级精度为您提供无人机的纬度和经度位置。这证明它在获取无人机精确位置方面更准确。该设备支持 `CAN`（`控制器局域网`）协议，具有高数据速率和可升级性，因此信号质量更好，抗外部干扰能力更强。该设备运行在一个带有内置\
  \ `IMU`（`惯性测量单元`）的微控制器板上，以满足高级导航需求。\n\n\n\n\n\n## GNSS 设备示例\n\n- **Drotek DP0601**：Drotek\
  \ DP0601 是一款基于**实时动态**（**RTK**）的 GNSS 设备，支持 GPS、GLONASS、北斗、伽利略和 QZSS 信号接收，提供厘米级精度，并内置对标准\
  \ RTCM 差分修正的支持。它拥有内置通信协议，同时支持 `UART` 串行协议和 `SPI`，使其适用于多种设备。\n\n- **Synerex MDU-2000**：MDU-2000\
  \ 是一款基于 RTK 的 GNSS 接收机，配备双天线以实现厘米级精度。得益于其双天线技术，即使在强磁场干扰下也能提供真实航向，因此该设备不受外部电磁场影响。\n\
  \n因此，我们了解了如何根据上述标准为无人机选择 GNSS 导航设备，并看到了几个无人机行业广泛使用的 GNSS 设备示例，它们用于辅助无人机的 GNSS 定位。\n\
  \n# 总结\n\n在本章中，我们学习了无人机关键部件的理论与选择，以及从动力系统到 GNSS 设备的选型标准。这是基于所有可用部件绘制无人机蓝图的关键概念。\n\
  \n在下一章中，我们将更多地关注这些部件的组装与集成，以及用于飞行的配置软件。\n"
- '# 第 2 部分：系统概念化与航空电子开发


  现在我们已经了解了无人机（即四旋翼）的构造，在本部分中，我们将更详细地研究无人机，包括每个部件的工作原理以及四旋翼的工作原理。我们将学习每个部件的变化如何影响四旋翼在空中的工作与动力学。本部分将更加详细和深入分析，包含数学概念和术语，以在软硬件层面开发整个系统。


  本部分包含以下章节：


  - 第 5 章：传感器与 IMU 及其在无人机中的应用

  - 第 6 章：无人机固件与飞行栈简介

  - 第 7 章：地面站软件简介

  - 第 8 章：理解飞行模式与任务规划

  '
- '## 第 5 章：传感器与 IMU 在无人机中的应用


  在本章中，我们将学习并理解无人机起飞、辅助系统飞行并导航至航点所使用的主要传感器。借助这些传感器，无人机可以在手动和自主模式下以各种模式和模式飞行。我们将在本章中学习这些传感器的工作原理、接口方式及其输出。我们还将了解它们对无人机系统的影响。在本章末尾，我们将深入探讨无人机的构造，帮助我们理解其工作原理。


  我们将在以下主题下涵盖无人机系统所需的主要传感器：


  - 惯性测量单元及其作用

  - 气压计及其作用

  - GPS 与磁力计及其作用

  - 电压与电流传感器及其作用

  - 传感器融合与状态估计


  通过学习上述主题，我们将简要了解每个传感器的作用，这些知识将有助于推导无人机在该方面所需的方程和编程。


  ### 惯性测量单元及其作用


  **惯性测量单元**（**IMU**）是无人机最重要的部件，因为它帮助无人机计算线性加速度和角加速度；它还有助于测量 `roll`（横滚）、`pitch`（俯仰）和
  `yaw`（偏航）机动中的姿态角，帮助自动驾驶仪做出决策并引导其电机和执行器产生所需的输出以实现水平飞行。


  #### IMU 的组成


  IMU 是多旋翼飞控系统中的关键组件。它集成多个传感器，以提供关于飞行器运动和姿态的综合信息。IMU 通常包括加速度计、陀螺仪，有时还包括磁力计。这些传感器的集成对于精确的飞行控制、稳定性和导航至关重要。


  IMU 的组件：


  - **加速度计**：测量不同轴（`X`、`Y` 和 `Z`）上的线性加速度

  - **陀螺仪**：测量不同轴周围的角速度或旋转速率

  - **磁力计**（可选）：测量磁场的强度和方向


  IMU 由以下列表中提到的传感器组成，这些传感器主要存在于飞控中，意味着它们有助于确定飞行器的位置和姿态。然而，一些 IMU 内置磁力计，而某些设备则需要外部添加。以下是
  IMU 中使用的主要传感器：


  - **加速度计**：测量其轴向的加速度。

  - **陀螺仪**：测量角速度和角加速度。

  - **磁力计**：这是 IMU 中的可选传感器；一些 IMU 自带磁力计，一些则没有。飞控通常包含加速度计和陀螺仪；不过，气压计和磁力计是可选的。


  为了正常飞行，无人机需要 IMU。无人机的内部平衡感，即 IMU，使其保持水平并促进平稳飞行。IMU 向无人机的计算机提供数据，后者利用这些数据确定其运动。它的功能类似于无人机确保保持控制并遵循用户指令的手段。IMU
  的数据处理使无人机能够精确飞行并按预期执行任务。


  ##### 加速度计


  加速度计测量加速度，即速度变化的率，以了解速度和方向的变化。它有助于稳定性，帮助飞控保持飞行水平并响应飞行员指令。加速度计三个轴的数据由飞控处理，以计算无人机速度的变化率。


  通过测量每个轴向的加速度，飞控可以对这些数据随时间积分来计算速度变化。本质上，加速度计提供关于无人机在不同方向上加速或减速率的信息，允许飞控进行实时调整以保持稳定。


  飞控中使用的 MEMS 加速度计设备示例：


  - STMicroelectronics LSM6DS3

  - InvenSense MPU-6050

  - Bosch Sensortec BMI160

  - ADXL345


  下图展示了一个 MEMS 加速度计：


  ![Figure 5.1 – MEMS Accelerometer](img/B19566_05_1.jpg)


  Figure 5.1 – MEMS 加速度计


  标准加速度计测量其各轴承受的重力。静止时，地球上的标准加速度计会测量到 `9.8 m/s²` 的加速度。当系统运动时，它给出加速度数据，有助于推导无人机的速度、运动和位置。


  ##### 陀螺仪


  陀螺仪传感器测量绕不同轴的旋转速率或角速度。在无人机中，陀螺仪有助于确定无人机的姿态并在飞行中提供稳定性。陀螺仪的数据帮助飞控了解无人机如何以及向哪个方向转弯，并允许其通过调整电机转速进行实时调整以保持水平飞行。例如，当无人机向一侧倾斜或旋转时，陀螺仪数据通知飞控，飞控随即调整该侧的电机转速以抵消运动，保持无人机稳定水平：


  ![Figure 5.2 – Mechanical three-axis gyroscope](img/B19566_05_2.jpg)


  Figure 5.2 – 机械三轴陀螺仪






  现代飞控中使用的 MEMS 陀螺仪示例是 InvenSense MPU-6050。它将三轴陀螺仪与三轴加速度计结合在一起。陀螺仪数据的积分，连同加速度计以及有时的磁力计数据，提供了关于无人机运动的一整套综合信息。这些集成数据对于飞控准确确定无人机在三维空间中的姿态至关重要，从而实现稳定且可控的飞行。


  ## 磁力计


  磁力计传感器提供地球磁场强度和方向的测量值。在无人机中，它用于确定无人机相对于地球磁场或磁北的航向或姿态。航向信息有助于导航，且对无人机自主移动至预定航路点至关重要。现代
  MEMS 磁力计通常与加速度计和陀螺仪一起集成在 IMU 中。然而，某些飞控倾向于将其分离放置。


  广泛使用的磁力计示例是 Bosch Sensortec BMM150，这是一种通常用于无人机飞控的 MEMS 磁力计。磁力计数据通过传感器融合算法与其他传感器输入融合；这有助于计算无人机的确切位置和姿态，从而在自主任务飞行时对其导航实现精细控制。


  下图展示了地球磁场及其磁航向和倾角：


  ![Figure 5.3 – Earth’s magnetic field](img/B19566_05_3.jpg)


  Figure 5.3 – Earth’s magnetic field


  ## IMU 在无人系统中的应用


  现代 IMU 的数量因无人机的复杂程度及其应用而异。许多无人机只有一个 IMU，而许多为专业应用设计的无人机则拥有冗余 IMU 以提高可靠性和精度。


  ### 冗余 IMU 设置


  这见于飞控中，旨在用于高端专业无人机，如工业无人机，以及为任务关键型应用设计的无人机。冗余 IMU 的主要原因是它们在一个单元故障时作为备份，故障切换可切换到备用
  IMU，从而提高整体可靠性。让我们看看三重冗余 IMU 设置由以下内容组成：


  *   **配置**：有三个独立的 IMU 集成在无人机飞控的三个轴上

  *   **冗余**：每个 IMU 由加速度计、陀螺仪组成，有时也包括磁力计，提供关于无人机运动和姿态的冗余数据

  *   **算法**：现代飞控部署传感器融合算法，可处理来自所有三个 IMU 的数据，以确定最准确和可靠的信息


  冗余 IMU 系统的主要特点如下：


  *   **故障切换机制**：这提供了一种故障安全机制。如果一个 IMU 发生故障，系统将无缝切换到备用单元

  *   **精度**：冗余 IMU 可用于交叉验证，提高确定无人机姿态和运动的整体精度

  *   **任务关键型应用**：适用于可靠性和精度至关重要的任务，如测绘、制图或巡检


  IMU 在高级飞控中的应用：


  *   **定位与导航**：单个或冗余 IMU 在确定无人机位置及其姿态方面发挥重要作用，辅助精确导航

  *   **自主飞行**：IMU 数据辅助自主飞行模式，允许无人机在无需持续飞手输入的情况下导航并执行任务

  *   **安全功能**：结合其他传感器，IMU 有助于实现紧急降落、避障和电子围栏等安全功能


  ## 气压计及其作用


  气压计提供高度信息，有助于无人机的精确控制和导航。基本上，气压计测量大气压力，因为随着高度增加气压会降低，这告知飞控其上升了多高。


  关于高度控制，无人机飞控使用气压计数据来估算当前海拔高度。这使得飞控能够精确计算无人机的垂直位置。


  气压计数据与其他传感器（如加速度计和陀螺仪）融合。因此，可以在飞控的 IMU 部分观察到传感器数值。以下两款气压计——Bosch Sensortec BMP280
  和 BMP388——主要用于无人机飞控；它们以与 IMU 建立协作而闻名，从而能够更彻底地测量涉及高度控制、导航和稳定性的数据。


  具有 I2C 或 SPI 接口的气压计将高度信号数据发送给飞控。飞控随后识别所需高度并推动电机产生更大推力，从而获得期望高度。期望高度将由气压计传感器显示。


  ### 它是如何工作的？


  在飞控中，气压计通过测量无人机上升或下降时大气压力的变化来估算高度。其背后的基本原理是气压随高度增加而降低。气压计向飞控提供无人机当前位置的当前大气压力数据。气压计首先需要校准到一个参考压力点，以向飞控提供参考数据。在海平面，飞控计算高于该校准参考点的高度。不同的高度基准包括以下内容：


  *   **地面高度 (AGL)**：AGL 代表相对于地面或地形的高度，提供相对于地球表面的度量

  *   **平均海平面高度 (AMSL)**：AMSL 代表相对于标准参考点（通常为海平面）的高度，提供无论局部地形变化如何都一致的高程度量。


  飞控将此气压高度信息用于不同目的，如稳定飞行、执行精确机动以及在三维空间中导航。


  ## GPS 和磁力计及其作用


  GPS 和磁力计是无人机的两个主要且相互关联的组件。这两个组件都充当无人机的“眼睛和耳朵”，帮助无人机相对于地球在 3D 环境中定位自身，并在 3D 空间中导航。GPS
  和指南针的存在帮助无人机完全自主地穿越空间中的不同航路点，并在返航时发挥作用：


  ![Figure 5.4 – An image depicting how a GPS works](img/Image97624.jpg)


  Figure 5.4 – An image depicting how a GPS works


  ### GPS 是如何工作的？


  GPS 模块通过某种硬件协议（即 SPI、I2C 或 CAN，取决于制造商和型号，请参阅产品用户手册）与飞控连接。GPS 模块包含不同的定位系统，如 GPS、Glonass、北斗等，它们通过无线电接收器接收来自卫星网络的信号。这些信号包含速度、时间和位置坐标数据，馈送给飞控。飞控利用这些坐标相对于地球定位自身，并在估算速度、位置和时间时使用这些坐标。这些数据再次被发送到飞控中的传感器融合算法，并与
  IMU 数据融合以给出正确的估算。


  ### GPS 在无人机中的应用


  尽管无人机可以在没有 GPS 的情况下手动飞行，但 GPS 是无人机在自动模式下运行和执行航路点任务所必需的。GPS 的优势如下：






  ## GPS 角色


  ### 稳定性

  通过安装 GPS，飞行稳定性得以提高。GPS 拥有关于无人机位置的固定坐标。因此，它利用坐标帮助无人机不因任何来源（如风）而偏离其原始位置，并稳定其位置；不过，这取决于
  GPS 的质量及其精度。GPS 质量越好，其保持位置的能力就越强。


  ### 返航

  在紧急恢复程序期间，这是防止无人机飞失和坠毁的最佳功能。原始 GPS 坐标保存在无人机中，一旦发生任何意外或信号丢失，它会自动返回并降落在原始坐标处。这有助于无人机的安全回收。


  ### 导航

  导航是自主任务的一个重要方面。每当规划自主任务时，会给出几个 GPS 坐标供无人机自动跟随。在 GPS 的帮助下，实现了平稳的自动飞行，这主要用于测绘、监视和农业等商业应用。


  GPS 的作用非常广泛——我们这里只涵盖了其中的几个方面。在接下来的章节中，我们将看到不同的 GPS 应用。


  ## 电压和电流传感器及其作用


  无人机中的电流和电压测量对于监控电气系统的健康状况和无人机的电源管理至关重要，特别是消耗和电池状态。让我们看看如何使用不同的机载传感器来测量电压和电流：


  ### 电流测量


  #### 传感器

  通常使用霍尔效应电流传感器（例如 `ACS712`）来测量电压和电流流向。


  #### 工作原理

  霍尔效应传感器检测电流通过导体时产生的磁场大小。传感器输出与电流强度成正比的模拟电压，随后由飞控读取以做出相应决策。


  #### 接口

  模拟电压通常馈入飞控上的 `ADC`（模数转换器），提供电流的数字化表示。


  ### 电压测量


  #### 传感器

  分压器或电压测量 IC（例如 `INA219`、`INA226` 等）


  #### 工作原理

  分压器 IC 利用电阻将电池电压降低到适合测量的电平。电压测量 IC 直接测量电压并提供数字输出。这些数字输出是测量电流和电压的现代方式。


  #### 接口

  来自分压器或 IC 的输出连接到飞控上的 `ADC`，将模拟信号转换为数字值以供处理。


  ### 电压和电流测量的用途


  #### 低电压保护

  飞控利用电压测量在电池电压严重偏低时触发安全警告或启动安全程序。通常，这些值由飞手在飞行前设定，并触发诸如 `RTL` 或着陆等安全行为。


  #### 过流保护

  电流测量有助于检测过流情况，使飞控能够实施保护措施。


  ## 传感器融合与状态估计


  传感器融合与状态估计代表了飞控算法的重要组成部分，因为这是帮助无人机融合通过 `IMU`、指南针和 GPS 传入的所有数据的功能；系统随后对速度、速率、高度、方向和角加速度的确切值做出决策。这些数据很重要，因为它帮助飞控在机动性方面做出计算决策：


  ![图 5.5 – 传感器融合的概念](img/B19566_05_5.jpg)


  图 5.5 – 传感器融合的概念


  状态估计算法获取加速度计和 GPS 坐标的数据，将它们融合在一起，进行合理性检查，并将它们传递给飞控，飞控观察无人机当前的加速度和速度。传感器融合还负责处理某些传感器读数中的错误，并在决策过程中忽略它们。


  ## 总结


  在本章中，我们介绍了无人机中存在的不同传感器，以及每个传感器如何为稳定和安全的飞行提供帮助。对这些传感器的了解有助于系统工程师设计新应用，也有助于固件工程师设计新算法来驾驭它们。


  在下一章中，我们将进一步了解这些传感器如何在不同飞行模式下提供帮助，以及飞控如何解读这些数据。

