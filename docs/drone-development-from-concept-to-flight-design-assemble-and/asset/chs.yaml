- "## 第 6 章：无人机固件与飞行栈简介\n\n在前几章中，我们了解了主要硬件和外围设备，以及有助于无人机控制、指令、制导和导航的各种传感器。这些是组装成我们称为无人机的系统硬件的机械和电子部件。但您知道，没有灵魂的硬件毫无用处，而无人机的灵魂就是无人机固件。为了整体控制或指挥无人机，我们需要称为\
  \ `GCS`（地面站）的软件，我们将在下一章简要研究它。\n\n在本章中，我们将介绍固件的高层架构、它的需求、包含的内容，以及与其交互以构成无人机的软件。我们将涵盖以下主题，这将有助于我们更好地理解固件由什么组成以及我们将使用的其他有用库。\n\
  \n本章涵盖的主要主题如下：\n\n*   固件简介\n*   无人机固件简介\n*   无人机飞行栈简介\n*   PX4 飞行栈\n*   ArduPilot\
  \ 飞行栈\n\n本章将更多地关注代码库的通用方面和结构，而不是完整的代码库。我们不会涵盖整个代码库及其开发过程，因为那将需要单独的一整章。相反，我们将着眼于哪些是基本部分以及完整的栈整体。\n\
  \n## 技术要求\n\n在本章中，我们将关注架构和软件模块。了解 `C++` 或 `Python` 等编程语言、`VS` Code 或 Eclipse 等开发环境，以及\
  \ `Git` 和 `GitHub` 等版本控制系统将会有所帮助。\n\n## 固件简介\n\n固件是一种专门设计用于安装在嵌入式硬件上的特殊软件。固件的主要职责是控制和管理设备特定硬件组件的功能。固件存储在\
  \ `NVM`（非易失性存储器）中且具有持久性，这意味着即使关闭电源，它也能保留其编程。它充当硬件和高层软件之间的桥梁，促进通信并确保设备正常运行。\n\n固件有多种类型，每种都针对其控制的设备或系统的特定需求量身定制。以下是不同类型的固件及其示例：\n\
  \n### BIOS/UEFI 固件\n\n**描述**：`BIOS`（基本输入/输出系统）或 `UEFI`（统一可扩展固件接口）固件在计算机启动过程中初始化硬件组件。\n\
  \n**示例**：现代 PC 中的 `UEFI` 固件。\n\n### 嵌入式固件\n\n**描述**：用于嵌入式系统，如物联网设备、消费电子产品和工业机器，以控制特定硬件功能。\n\
  \n**示例**：管理温度控制和用户界面的智能恒温器中的固件。\n\n### 引导加载程序固件\n\n\n\n\n# 固件类型\n\n## 引导加载程序固件\n\
  \n**描述**：负责在启动过程中将**操作系统 (OS)** 加载到内存中，执行系统检查，并提供基本配置。\n\n**示例**：Linux 系统中的**统一引导加载程序\
  \ (GRUB)**。\n\n## 外设固件\n\n**描述**：控制打印机、摄像头、网络设备和其他外部设备等硬件外设的操作。\n\n**示例**：管理打印任务、纸张处理和与计算机通信的打印机固件。\n\
  \n## 微控制器固件\n\n**描述**：用于微控制器以管理输入/输出操作、与传感器和执行器交互，并执行特定任务。\n\n**示例**：控制连接的传感器、LED\
  \ 或电机的 `Arduino` 微控制器固件。\n\n## 网络设备固件\n\n**描述**：管理路由器、调制解调器和网络交换机中的网络协议、安全功能和与其他设备的通信。\n\
  \n**示例**：控制网络配置和安全设置的 Wi-Fi 路由器固件。\n\n## 存储设备固件\n\n**描述**：存在于硬盘驱动器和**固态硬盘 (SSD)**\
  \ 等存储设备中，管理数据存储、检索和纠错。\n\n**示例**：优化数据放置和磨损均衡算法的 SSD 固件。\n\n## 汽车固件\n\n**描述**：控制车辆中的各种系统，包括**发动机控制单元\
  \ (ECU)**、信息娱乐系统和安全功能。\n\n**示例**：管理燃油喷射、点火时机和排放控制的汽车 ECU 固件。\n\n## GPU 固件\n\n**描述**：存在于**图形处理单元\
  \ (GPU)** 中，管理图形渲染、着色器执行和其他 GPU 特有功能。\n\n**示例**：优化图形处理的 NVIDIA 或 AMD GPU 固件。\n\n\
  ## 相机固件\n\n**描述**：控制数码相机的操作，管理图像处理、对焦、曝光和其他相机特有功能。\n\n**示例**：优化图像捕捉设置的单反相机固件。\n\n\
  # 固件组件及其作用\n\n固件组件在控制和管理设备特定硬件功能方面发挥着关键作用。这些组件协同工作以确保设备正常运行。以下是关键固件组件及其作用：\n\n##\
  \ 引导加载程序\n\n`Bootloader` 是设备上电时运行的初始固件。它执行硬件初始化和系统检查，并将操作系统或主固件加载到内存中。\n\n## 内核或操作系统\n\
  \n在某些情况下，固件包含简化的操作系统或内核。该组件管理系统资源并为上层应用程序提供平台。\n\n## 设备驱动程序\n\n`设备驱动程序` 促进操作系统或应用软件与特定硬件组件之间的通信。它们实现对传感器、外设或通信接口等功能的控制和利用。\n\
  \n## 应用代码\n\n这是定义设备主要功能的主程序或程序集。它处理数据处理、用户界面控制和与外部设备交互等特定任务。\n\n## 配置设置\n\n固件通常包含可自定义的设置和配置，以使设备适应不同的环境或用户偏好。这些设置可能影响性能、功耗或通信参数等方面。\n\
  \n## 安全功能\n\n许多固件实现包含安全功能，以防止未经授权的访问、数据泄露或其他潜在威胁。安全措施可能包括加密、访问控制和安全启动机制。\n\n## 启动配置\n\
  \n固件管理启动配置，指定可启动设备的顺序和来源。这包括启动顺序、启动设备优先级和启动超时值等设置。\n\n## 更新机制\n\n固件包含用于更新其代码以修复错误、提高性能和添加新功能的机制。这些更新过程可能涉及\
  \ `FOTA`（空中下载固件）更新或通过物理连接刷写新固件。\n\n## 错误处理和日志记录\n\n固件包含检测和处理运行期间可能发生错误的机制。它可能记录错误信息用于调试，或向用户提供关于系统状态的反馈。\n\
  \n## 中断服务程序 (ISR)\n\n在实时系统中，固件包含处理硬件事件产生的中断的 `ISR`（中断服务程序）。这些程序确保及时响应关键事件并有助于维持系统稳定性。\n\
  \n## 电源管理\n\n对于有功耗限制的设备，固件包含电源管理功能以优化能源使用。这可能涉及控制睡眠模式、调整时钟频率或选择性地激活/停用组件。\n\n##\
  \ 内存管理\n\n固件高效管理内存以最小化资源使用并防止内存泄漏或碎片化等问题。它根据不同任务的需要分配和释放内存。\n\n# 固件示例\n\n让我们考虑一个用\
  \ C 语言编写的简单固件代码示例，用于控制 LED 的假设嵌入式系统。此示例使用流行的微控制器 `Arduino` 及其开发环境：\n\n```cpp\n//\
  \ LED Blinking Firmware for Arduino\n// Define the pin connected to the LED\n#define\
  \ LED_PIN 13\n\nvoid setup() {\n  // Initialize the LED pin as an output\n  pinMode(LED_PIN,\
  \ OUTPUT);\n}\n\nvoid loop() {\n  // Turn the LED on\n  digitalWrite(LED_PIN, HIGH);\n\
  \  delay(1000); // Wait for 1 second\n  // Turn the LED off\n  digitalWrite(LED_PIN,\
  \ LOW);\n  delay(1000); // Wait for 1 second\n}\n```\n\n在此示例中，固件代码使用 `Arduino` 框架控制\
  \ LED 的状态。`setup()` 函数将连接到 LED 的引脚初始化为输出，`loop()` 函数使用 `digitalWrite()`、`HIGH`、`LOW`\
  \ 和 `delay()` 重复以一秒间隔开关 LED。\n\n# 用于开发固件的工具\n\n以下是用于开发固件的工具：\n\n## 集成开发环境 (IDE)\n\
  \n**作用**：IDE 提供了一个用于编写、编译和将固件代码上传到目标微控制器的平台。\n\n**示例**：`Arduino IDE`、`MPLAB X`、`Keil\
  \ µVision` 和 `PlatformIO`。\n\n## 编译器\n\n**作用**：编译器将开发人员编写的高级固件代码转换为特定微控制器的机器可读指令。\n\
  \n**示例**：`GCC`、`Keil` 和 `MPLAB XC`。\n\n## 调试器\n\n**作用**：调试器通过允许开发人员检查变量、设置断点和单步执行代码，促进固件的调试和测试。\n\
  \n**示例**：在线调试器和 `JTAG` 调试器。\n\n## 编程器/调试器硬件\n\n**作用**：编程器/调试器硬件将开发环境连接到目标微控制器，允许代码上传、调试和在线编程。\n\
  \n**示例**：`JTAG` 编程器、`USBasp` 和 `ST-LINK`。\n\n## 微控制器开发板\n\n**作用**：微控制器开发板提供了一个包含必要硬件组件（微控制器、输入/输出引脚和电源）的平台，用于测试和运行固件。\n\
  \n**示例**：`Arduino` 开发板、`STM32 Nucleo` 开发板和 `PIC` 开发板。\n\n## 示波器/逻辑分析仪\n\n**作用**：用于硬件级调试、信号完整性分析和数字通信协议（如\
  \ SPI、I2C、UART）的时序验证。\n\n\n\n\n**角色**：示波器/逻辑分析仪有助于分析和调试电路中各点的电信号，这对于优化时序和诊断问题非常有用。\n\
  \n**示例**：Saleae Logic 和 Rigol 示波器。\n\n*   **文本编辑器/IDE 扩展**：\n\n    **角色**：开发人员通常使用文本编辑器或\
  \ IDE 扩展来增强编码体验，例如语法高亮和代码补全等功能。\n\n    **示例**：VS Code 和 Sublime Text。\n\n*   **版本控制系统**：\n\
  \n    **角色**：版本控制系统管理版本控制和协作开发，允许多个开发人员同时处理固件代码。\n\n    **示例**：Git 和 SVN。\n\n* \
  \  **仿真与模拟工具**：\n\n    **角色**：仿真与模拟工具在虚拟平台上模拟固件的行为，有助于在部署到物理硬件之前进行测试和调试。\n\n   \
  \ **示例**：Proteus 和 QEMU。\n\n*   **文档工具**：\n\n    **角色**：文档工具为固件代码生成文档，使开发人员更容易理解和维护代码库。\n\
  \n    **示例**：Doxygen 和 Javadoc。\n\n我们现在已经看到了固件和开发工具的示例。对于您想要开发和安装的任何类型的软件和固件，这些工具都是相同的。\n\
  \n# 软件与固件的区别\n\n固件和软件代表计算机程序的两个不同类别，它们在范围和功能上有关键区别。固件是一种与嵌入式设备硬件紧密相关的专用软件类型。它驻留在\
  \ NVM（非易失性存储器）中，对特定硬件组件提供底层控制。值得注意的是，即使设备断电，固件依然存在，并负责设备的初始化和管理。相比之下，软件涵盖在计算机系统中运行的更广泛程序范围，通过操作系统与硬件交互。与固件不同，软件通常加载到易失性存储器中，并且不在断电周期中持久化。软件提供广泛的定制选项，通常更容易更新，并且在开发时侧重于高级编程语言。总之，固件与硬件紧密相连，提供基础控制；而软件在更高层级运行，在计算环境中提供多样化的应用和功能。\n\
  \n以下是代码和架构层面软件与固件对比的表格展示：\n\n| **方面** | **软件** | **固件** |\n| --- | --- | --- |\n\
  | **执行环境** | 通常运行在通用处理器上 | 运行在专用处理器或微控制器上 |\n| **编程语言** | 高级语言（C++、Java、Python 等）\
  \ | 低级语言（C 和汇编） |\n| **内存使用** | 大量利用 RAM 和其他易失性内存 | 设计上尽量减少 RAM 使用；通常使用 Flash 存储器\
  \ |\n| **实时约束** | 可能没有严格的实时约束 | 通常需要遵守实时约束 |\n| **错误处理** | 倾向于依赖异常和错误检查机制 | 由于资源限制，可能使用更简单的错误处理机制\
  \ |\n| **硬件交互** | 主要依赖操作系统 API 进行硬件访问 | 直接与特定硬件组件和外设交互 |\n| **抽象层级** | 在较高抽象层级运行\
  \ | 在较低层级运行，更接近硬件 |\n| **资源优化** | 强调性能和资源效率的优化 | 鉴于硬件限制，优先考虑资源效率 |\n| **开发环境** |\
  \ 使用通用开发工具和环境进行开发 | 通常需要专用开发工具和针对硬件的特定考量 |\n| **可移植性** | 可在不同硬件平台间更好地移植 | 特定于硬件架构，移植时可能需要修改\
  \ |\n| **代码示例** | ```python\\nprint(\"Hello, World!\")\\n``` | ```c\\nint main()\
  \ {\\n    printf(\"Hello, World!\");\\n    return 0;\\n}\\n``` |\n\n表 6.1 – 软件与固件的对比\n\
  \n我们现在已经了解了软件和固件的区别、它们的角色以及开发所需的工具。在下一节中，我们将继续探讨无人机中使用的固件。\n\n# 无人机固件简介\n\n无人机固件是专门设计用于控制**无人驾驶飞行器（UAV）**，即常说的无人机的飞行、导航和整体操作的专用软件。它在管理无人机的硬件组件、处理传感器数据、执行控制算法以及确保稳定灵敏的飞行方面发挥着重要作用。无人机固件的独特之处在于它解决了航空飞行器特有的挑战和需求，提供对电机输出、姿态、高度和位置等各个方面的控制。\n\
  \n## 它与通用固件有何不同\n\n虽然通用固件是指控制电子设备操作的软件，但无人机固件是针对无人飞行系统的特定需求量身定制的。\n\n主要区别包括以下几点：\n\
  \n*   **控制复杂性**：无人机固件包含复杂的控制算法，用于管理飞行动力学、稳定性和导航，这些在通用固件中通常不存在。\n\n*   **传感器融合**：无人机依赖各种传感器（加速度计、陀螺仪、气压计和\
  \ GPS）来维持稳定飞行。无人机固件旨在集成和处理来自这些传感器的数据，以实现精确控制。\n\n*   **导航与自主性**：与许多通用固件不同，无人机固件通常包含自主飞行、航点导航和避障等功能。\n\
  \n*   **实时操作**：无人机需要实时响应以在飞行中保持稳定。无人机固件针对低延迟操作进行了优化，确保快速而精确的调整。\n\n## 无人机固件的结构\n\
  \n无人机固件的结构旨在处理飞行控制、传感器集成、通信和用户定制的不同方面。\n\n多旋翼飞行器中的固件架构是一个复杂的系统，旨在控制和管理飞行器飞行的各个方面。以下是固件架构中各组件及其角色的详细说明：\n\
  \n*   **主控制循环**：\n\n    *   **角色**：控制多旋翼整体飞行行为的核心控制循环\n\n    *   **组件**：\n\n   \
  \     *   **传感器**：采集加速度、角速度和高度等数据\n\n        *   **飞行控制器**：处理传感器数据，执行控制算法，生成电机指令\n\
  \n        *   **执行器（电机）**：响应电机指令，影响多旋翼的运动\n\n*   **传感器集成与融合**：\n\n    *   **角色**：采集并融合来自多个传感器的数据，以建立对多旋翼状态的全面理解\n\
  \n    *   **组件**：\n\n        *   **惯性测量单元 (IMU)**：融合加速度计和陀螺仪数据以确定姿态\n\n        *\
  \   **气压计**：测量大气压力以估算高度\n\n        *   **GPS 接收机**：提供全球定位数据，用于导航和定点悬停\n\n*   **姿态控制器**：\n\
  \n    *   **角色**：维持多旋翼的期望姿态（横滚、俯仰和偏航）\n\n    *   **组件**：\n\n        *   **比例-积分-微分\
  \ (PID) 控制器**：根据期望姿态与实际姿态的差异调整电机输出\n\n*   **高度控制器**：\n\n    *   **角色**：管理多旋翼飞行过程中的高度\n\
  \n\n\n\n\n# 固件架构\n\n## 组件\n\n### PID 控制器\n调节电机输出以控制多旋翼的垂直位置。\n\n### 位置控制器\n**角色**：控制多旋翼在空间中的位置，特别是在水平方向上。\n\
  \n**组件**：\n- **PID 控制器**：根据期望位置与实际位置的差异调整电机输出。\n\n### 导航与航点处理\n**角色**：通过处理 GPS 数据并遵循预定义航点，实现自主飞行。\n\
  \n**组件**：\n- **导航算法**：根据 GPS 坐标确定最优路径。\n- **航点管理器**：协调多旋翼的运动以遵循预定义路线。\n\n### 通信接口\n\
  **角色**：促进多旋翼与外部设备（如地面站或遥控器）之间的通信。\n\n**组件**：\n- **遥测系统**：将实时飞行数据发送至地面控制。\n- **无线电接收机**：接收来自遥控器的用户输入。\n\
  \n### 电源管理\n**角色**：监控和管理电源系统，包括电池电压和电流。\n\n**组件**：\n- **电池监控器**：确保电池安全使用并提供低电量警告。\n\
  \n### 电机与 ESC 接口\n**角色**：将飞行控制器生成的电机指令转换为 **电子调速器 (ESC)** 和电机的特定信号。\n\n**组件**：\n\
  - **脉宽调制 (PWM) 发生器**：根据控制输入生成 ESC 信号。\n\n### 配置与设置\n**角色**：允许用户自定义多旋翼行为的参数和设置。\n\
  \n**组件**：\n- **配置存储**：保存用户定义的设置以供未来飞行使用。\n\n### 飞行日志\n**角色**：记录飞行数据以供分析和故障排除。\n\n\
  **组件**：\n- **数据记录器**：在飞行过程中捕获传感器读数、控制输入和其他参数。\n\n## 主控制循环\n该固件架构在一个连续循环中运行，主控制循环协调各个组件之间的交互。传感器、控制器和通信接口的集成确保多旋翼能够实现稳定飞行、响应用户输入，并在需要时执行自主任务。先进的固件架构可能包含用于避障、计算机视觉或其他专用功能的额外组件。\n\
  \n# 无人机飞行栈简介\n\n飞行栈是控制无人机飞行的软件组件集合。因此，我们可以说开源飞行栈是指其软件组件的源代码公开可用，供公众使用、查看、修改和分发，以增强公共协作和联合开发。另一方面，专有无人机飞行栈是由特定公司或实体开发并拥有的，其源代码不公开供查看、修改和分发。\n\
  \n接下来，我们将探讨开源与闭源飞行栈的主要区别，以便更好地理解。\n\n## 开源无人机飞行栈\n\n### 源代码\n开源无人机飞行栈的源代码免费向公众开放，允许任何人查看、修改和分发代码。\n\
  \n### 协作\n广泛的社区开发者为开源项目做出贡献，鼓励社区协作，从而实现快速开发、错误修复和新功能开发。\n\n### 概念理解\n访问开源项目的源代码有助于用户理解软件栈如何协同工作。用户可以审查代码，从而增加信任度和安全性。\n\
  \n### 修改\n用户可以舒适地修改源代码以满足其特定需求或开发新功能。这种灵活性对研究人员、爱好者以及有独特实验和测试的组织大有裨益。\n\n### 价格\n\
  开源软件免费使用。用户可以下载、使用和修改软件，无需支付许可费。\n\n### 示例\n- **PX4 Autopilot**：PX4 是由 Dronecode\
  \ 项目维护的开源项目，拥有来自全球开发者社区的贡献。\n- **ArduPilot**：ArduPilot 是一个开源项目，拥有来自全球多元化开发者社区的贡献。\n\
  - **Paparazzi UAV**：Paparazzi UAV 是由研究人员、学生和爱好者组成的社区开发的开源项目。\n- **DroneKit**：DroneKit\
  \ 是由 **3D Robotics (3DR)** 和社区开发的开源项目。\n\n## 闭源（专有）无人机飞行栈\n\n### 源代码可用性\n闭源无人机飞行栈的源代码不公开可用。它由特定公司或实体拥有，属于专有，提供知识产权保护。\n\
  \n### 控制\n拥有闭源栈的公司对开发、更新和功能发布拥有完全控制权。用户依赖公司提供支持和更新。\n\n### 有限协作\n社区协作有限，主要开发由拥有专有栈的公司内部开发团队执行。通常不接受来自更广泛社区的外部贡献。\n\
  \n### 支持\n闭源解决方案的用户对公司的依赖性增加。更新和新功能根据公司的时间表提供。\n\n### 价格\n闭源解决方案需要支付许可费；用户可能需要为软件和任何额外功能付费，持续的支持服务可能产生额外费用。\n\
  \n### 示例\n- **DJI 飞行栈 (DJI SDK)**：作为领先的无人机制造商，DJI 为其无人机开发专有飞行栈。DJI **软件开发工具包 (SDK)**\
  \ 可供开发者在 DJI 的飞行控制系统之上构建应用程序。\n- **Yuneec 飞行栈**：Yuneec International 是一家无人机制造商，为其无人机开发专有飞行栈。\n\
  - **Autel Robotics 飞行栈**：Autel Robotics 是另一家无人机制造商，为其无人机开发专有飞行栈。\n\n## 飞行栈对比\n\n\
