  \ EA 时，它们通常只是将人员从一个区域调到另一个区域，而不理解并非每个人都能像架构师那样行动和思考。EA 本质上是社会的，而不仅仅是智力上的努力。架构从纯抽象角度理解起来很困难。尽管\
  \ EA 并非新事物且仍处于起步阶段，它仍带来了一些利益相关者难以理解的概念。为了实现信任，EA 工作必须为双方组织所理解。如果人们变得精通技术，他们会怀疑 EA\
  \ 的价值，因为其交付价值的能力已经有限。\n\n传统 EA 中糟糕的沟通也可能导致组织对新举措产生强烈抵制。EA 信息必须清晰简洁地传达给所有利益相关者，以便他们理解并最终扩大讨论范围。为了管理组织内所有实体之间的工件生命周期和关系，正在考虑采用数字\
  \ EA 的组织应考虑投资数字 EA 工具和存储库。数字 EA 下的 EA 承认了数字化转型的影响，并努力使组织保持在数字时代的前沿。除了技术差异外，数字团队在文化、实践、平台和领域方面与传统团队存在根本差异。\n\
  \n## 总结\n\n业务不断演进，企业必须能够评估这些变化对 IT 格局的影响，以及这些变化将如何影响其运营、客户体验和增长能力。更深入地审视这些问题有助于改善转型过程。此外，企业架构师保持精简且敏捷的\
  \ IT 环境，以便 IT 能够运行即将到来的业务转型项目。基于此，本章阐明了 EA 使能就绪性为何至关重要，以及组织可以采取哪些步骤来促进它。在此过程中，我们还确定并提供了一个基础，有助于我们理解建立\
  \ EA 实践的过程和流程。本章涵盖了识别所有者以及每个所有者的工作流程，以及角色和职责。我们的主要重点仍然是更详细地解释 EA 建模语言。\n\n在下一章中，我们将回顾并总结本书全部九章的内容，并提供用例。\n\
  \n## 结论\n\n随着组织系统的日益互联，企业架构通过允许开发团队使用一套清晰、经过验证的方法，甚至产品线，为其应用架构工作，从而在各系统间促进一致性。系统间的通用机制和兼容语义使重用以及系统集成成为可能。通过超越当前技术需求并为未来举措奠定基础，这些团队可以超越单一应用并评估架构对整个企业的[content]\n\
  ## 将数据转化为洞察再转化为行动\n\n数据洞察发挥着重要作用，但行动更为关键。你可以通过基于 EA 数据构建指标来理清分散的信息。因此可以做出明智的商业决策。要向前推进，需要回答这样一个问题：是否可以使用现有工具创建组织的数字孪生，或者需要考虑其他选项。\n\
  \n## 未来仍在进行中\n\n未来无法预测。因此，你的 EA 功能必须协助企业快速、准确地采纳战略。在这里，自动化至关重要——通过自动化你的未来模型，你可以更快地构建更多模型。\n\
  \n你需要知道的是：你的思维是否足够灵活以鼓励灵活性？\n\n## 在 EA 中构建可扩展性\n\n数据资产可能呈指数级增长——而这正是你可以确信的一点。可扩展的\
  \ EA、流程和服务至关重要。这是你需要回答的关键问题：你的 EA 工具是否能随着资产的增长而自动扩展？\n\n拥抱协作并展示 EA 工作的价值以取得成功。企业各部门的利益相关者参与你的工作非常重要——并且他们能从中受益。告知利益相关者他们应有的期望以及如何使用数据更有效地做出战略决策。\n\
  \n为了实现目标或交付期望的结果，当今的 EA 专注于定制和优化业务能力。作为企业架构师，我们可以推动组织投资于正确的能力，这些能力可以被视为业务能力的组合。基于成果的架构出现后，企业更清楚数字化转型带来的影响，并创造了保持数字领先的新方法以维持竞争力。此次从传统到数字\
  \ EA 的转变正是通过这些新方法实现的。\n\nEA 趋势似乎也在向创建领域专家社区的方向转变，而非指定 EA 团队。一个允许组织内多个业务和 IT 团队协作、进行讨论并考虑不同架构视角和方法的平台，对于实现\
  \ EA 至关重要。随着人们变得更加敏捷，EA 的角色发生了变化，治理已成为 EA 越来越重要的方面。传统上，EA 仅用于项目团队和解决方案，并由 EA 委员会管理。由于\
  \ EA 已成为公司文化的重要组成部分，数字 EA 通过灵活的治理模式促进协作。\n\n传统 EA 交付物以静态文档形式存在，由于其不稳定性，很难维护和更新。数字\
  \ EA 已演进为可随时间更新和维护的实时存储库，作为可实现企业敏捷性的单一事实来源。创新管理在通过数字 EA 培育组织创新文化方面也发挥着关键作用。这里的重点是破坏性或迭代性的变化。数字\
  \ EA 必须拥有完善的管理创新流程，才能成为数字变革驱动力。\n\n## 发展数字技能\n\n根据组织所述，员工数字技能的发展是当前时代最紧迫的问题之一。当组织决定实施\
