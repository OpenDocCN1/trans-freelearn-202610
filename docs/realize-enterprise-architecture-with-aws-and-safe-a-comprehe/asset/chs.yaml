  \ EA 并非新事物且仍处于起步阶段，它仍带来了一些利益相关者难以理解的概念。为了实现信任，EA 工作必须为双方组织所理解。如果人们变得精通技术，他们会怀疑 EA\
  \ 的价值，因为其交付价值的能力已经有限。\n\n传统 EA 中糟糕的沟通也可能导致组织对新举措产生强烈抵制。EA 信息必须清晰简洁地传达给所有利益相关者，以便他们理解并最终扩大讨论范围。为了管理组织内所有实体之间的工件生命周期和关系，正在考虑采用数字\
  \ EA 的组织应考虑投资数字 EA 工具和存储库。数字 EA 下的 EA 承认了数字化转型的影响，并努力使组织保持在数字时代的前沿。除了技术差异外，数字团队在文化、实践、平台和领域方面与传统团队存在根本差异。\n\
  \n## 总结\n\n业务不断演进，企业必须能够评估这些变化对 IT 格局的影响，以及这些变化将如何影响其运营、客户体验和增长能力。更深入地审视这些问题有助于改善转型过程。此外，企业架构师保持精简且敏捷的\
  \ IT 环境，以便 IT 能够运行即将到来的业务转型项目。基于此，本章阐明了 EA 使能就绪性为何至关重要，以及组织可以采取哪些步骤来促进它。在此过程中，我们还确定并提供了一个基础，有助于我们理解建立\
  \ EA 实践的过程和流程。本章涵盖了识别所有者以及每个所有者的工作流程，以及角色和职责。我们的主要重点仍然是更详细地解释 EA 建模语言。\n\n在下一章中，我们将回顾并总结本书全部九章的内容，并提供用例。\n\
  \n## 结论\n\n随着组织系统的日益互联，企业架构通过允许开发团队使用一套清晰、经过验证的方法，甚至产品线，为其应用架构工作，从而在各系统间促进一致性。系统间的通用机制和兼容语义使重用以及系统集成成为可能。通过超越当前技术需求并为未来举措奠定基础，这些团队可以超越单一应用并评估架构对整个企业的影响。\n\
  \n制定、验证然后支持架构框架的任务落在企业架构师的职责范围内。数据、安全、网络和硬件基础设施由你的企业管理员构建。此外，你的应用项目团队将负责实施你的企业架构。这是企业架构师应积极参与并提供支持的工作。\n\
  \n企业架构的范围使其与应用架构区别开来。企业架构师指导应用架构师理解和应用企业架构，就像应用架构师指导应用设计师和实施者理解和应用应用架构一样。与应用架构师类似，企业架构师对系统的设计者和实施者而言具有更广但通常更浅的视角。尽管企业架构由企业架构师制定，但实际实施工作由你的应用开发团队和企业管理员负责。\n\
  \n## 架构治理\n\n为了保持顺畅无缝的工作流程，企业架构领导者必须领先于组织的某些要素。首要之列是团队规模、基础设施和组织结构。然而，数字行业领导者必须考虑随此转型而来的挑战和复杂性。只有结构良好且深思熟虑的业务敏捷模型才能适应系统内的持续进步。选择不断变化会带来很大的风险和不可预测性，这对一些利益相关者来说会令人筋疲力尽。\n\
  \n\n\n## 企业内部的治理层级\n\n架构治理在治理结构层级中运作并不罕见，尤其是对于大型企业而言，可能包括以下具有各自学科和流程的独立领域：\n\n-\
  \ 公司治理\n- 技术治理\n- IT治理\n- 架构治理\n\n在企业内部，这些治理领域可以在多个地理层级出现，例如全球、区域和本地。诸如 **开放群组架构框架\
  \ (TOGAF)** 之类的企业架构框架并不涵盖公司治理的全部主题。如前所述，由于其通常运作的层级结构，本节及相关小节从企业整体治理的角度描述架构治理。\n\n\
  ## 治理的本质\n\n治理的责任是确保业务得到妥善开展。组织的战略目标更有可能通过指导方针以及资源公平有效的使用来实现，而不是通过明显的控制和严格遵守规则。\n\
  \n## 治理——通用视角\n\n**经济合作与发展组织 (OECD)** 已将以下内容确定为公司治理的基本原则：\n\n- 对股东权利、角色和公平性的审查\n\
  - 确保组织的战略得到良好指导，董事会有效监督管理层，并对公司的成功承担责任\n- 董事会成员通过审查和指导公司战略来监督管理层实现公司目标的情况\n\n作为公司治理结构的一部分，董事会确定谁负责什么以及如何负责，以及决定对公司做什么的规则和程序。\n\
  \n## 治理的特征\n\n源自公司治理，以下治理特征旨在强调在企业及其与其他各方的互动中采用治理的价值和必要性：\n\n- **纪律**\n  在整个过程中，所有相关方必须遵循组织的政策、程序和授权结构。\n\
  - **透明度**\n  授权的组织或服务提供商可以检查所有已实施的行动及其决策支持。\n- **独立性**\n  将努力在所有流程、决策和所用机制中尽量减少或避免潜在的利益冲突。\n\
  - **问责制**\n  组织内有若干不同的团体对其行动和决策负有授权和责任；例如，治理委员会。\n- **责任**\n  组织及其利益相关者期望每个签约方都能负责任地行事。\n\
  - **公平**\n  不会在任何决策、所用流程或流程的实施中给予一方不公平的优势。\n\n这些特征有助于确立公司的目标，提供实现目标的手段，并有助于监控公司的绩效。\n\
  \n## 技术治理\n\n利用技术开发、生产和营销组织的产品和服务是技术治理的责任。技术治理不仅仅涉及 IT 治理。由于技术在整个组织范围内的普遍存在，技术治理是一项关键能力、要求和资源。\n\
  \n除了运营和盈利能力之外，组织越来越多地依赖 IT 来维护其品牌和声誉，这最终会影响其资产的价值。\n\n## IT治理\n\n将 IT 资源和信息与企业目标和战略保持一致的管理被称为\
  \ IT 治理。为了确保企业的 IT 资产支持其业务目标，IT 治理将规划、采购、实施和监控 IT 绩效的最佳实践制度化。随着信息系统灾难和电子欺诈报告的增加，监管机构越来越多地要求公司对信息实施更严格的控制。在当今的企业治理框架中，管理与\
  \ IT 相关的风险被广泛接受为关键组成部分。\n\n总之，需要一个得到高层管理支持的 IT 治理战略，明确谁拥有企业的 IT 资源以及谁对其实体整合负有最终责任。\n\
  \n## 架构治理框架\n\n本节从概念上和组织上解释架构治理。在架构治理的诸多方面中，实施治理只是其中之一。其目的是管理和控制组织中的所有流程。企业架构师也会考虑企业架构和其他架构设计。\n\
  \n在传统 IT 孤岛仍然存在的情况下，迁移到云没有标准化，也没有集中管理或合规措施。企业工作负载之间标准差异可能导致组织内部出现竞争利益和不一致，尤其是在各方未保持一致时。经常，IT\
  \ 组织不知道工作负载部署在哪里或如何部署，可用于监控的指标是什么，或哪些工作负载容易受到安全威胁。缺乏控制和审计跟踪使其成为重大的合规风险。开发人员甚至可能不遵循行业安全标准。集中管理不存在。这需要得到控制。Amazon\
  \ Web Services (AWS) 使客户能够配置和控制其环境以实现业务敏捷性。作为服务的云计算以及 AWS 管理和治理服务为构建者提供预防性和检测性控制，以构建稳健的基础设施并减少漏洞。\n\
  \n## 公司治理的基本原则\n\n而不是严格执行规则，战略规划更多地是提供方向，以及确保公平合理地分配资源以可持续地实现目标。治理本质上涉及业务事务的适当管理。\n\
  \n公司董事会、管理层、股东和其他利益相关者被赋予不同的权利和责任，并且为公司决策制定了规则和程序。商业计划可作为设定和衡量公司目标以及监控其实现程度的方式。\n\
  \n## 亚马逊服务和组织结构\n\n在亚马逊，产品团队会思考开发某款产品的每一个原因以及为什么任何人会想要它。为了说服目标客户选择该产品，会起草一份引人注目的新闻稿。如果没有这份公告，你的生活将是不完整的。只有这样你才能产生影响力。\n\
  \n亚马逊的服务远不止软件；它也代表了一个组织。这可以通过为客户反向工作来实现。通过强大的所有权模式，小团队被分配到特定产品以最大化生产力。个人的需求和愿望将被考虑在内，以及他们个人的、专一的关注。反向工作是我们用来确保服务满足客户需求的过程。\n\
  \n随着数字化加速，许多公司正在重新思考其架构。为了满足不断增长的期望，公司应尽可能在尽可能多的数字渠道上提供产品。多国公司随着时间的推移发展出非常复杂的结构，这使得及时对其结构进行更改变得困难。与其扩展应用程序的各个部分，不如对整体进行扩展。微服务架构在集成到软件开发中时可以减少软件吞吐时间。除了提高生产力和灵活性之外，微服务还具有健壮性和弹性，因为它们可以独立构建和部署。\n\
  \n## TOGAF 及其目标\n\nTOGAF 的很大一部分源自美国国防部开发的 TAFIM 框架。TOGAF 以及其他 IT 管理框架强调跨部门协调以及将\
  \ IT 计划与业务目标保持一致。在项目开始前在 TOGAF 中定义和组织需求可使项目顺利进行且错误较少。其设计目的是通过四个目标帮助企业组织和解决商业和战略需求：\n\
  \n- 所有利益相关者和团队成员必须使用共同的语言\n- 不要为企业架构依赖专有解决方案\n- 可以节省时间和金钱，并能更有效地利用资源\n- 需要可衡量的投资回报率\
  \ (ROI)\n\n尽管 TOGAF 的词典中为企业架构工件添加了新的标题，但其规划方法保持不变。最近的更改似乎使当前 TOGAF 规定与行业最佳实践的重叠最小化。根据\
  \ TOGAF，它是一个参考库，其中包含指南、模板、模式和其他类型的参考材料，以加速企业架构的创建。\n\n\n\n## 云转型\n\n将您的数据、应用程序、网络和基础设施迁移到云环境被称为云转型。云的各种形式，包括按需计算、智能开发和人工智能，都必须得到利用。如果由于遗留技术、流程和基础设施而难以获得竞争优势，云似乎可能是完美的解决方案。在\
  \ Google 上搜索一下，你会发现几家大型咨询公司可以帮助你规划云转型战略。最终，你需要将应用程序迁移到虚拟世界。尽管提供了许多指南和步骤来帮助你，但归根结底就是迁移你的应用程序。作为企业架构的一部分，企业架构确保组织与其目标保持一致，朝着实现这些目标所做的变更被定义和分析。云计算创造了以服务为中心的新的商业模式。云计算提供了诸多好处，包括成本节约、效率提升、开发周期缩短以及上市时间加快。迁移到云可以帮助公司大幅削减成本，因为它可以提高资产利用率、降低运营成本，并重新定义\
  \ IT 员工与管理层之间的关系。\n\n## 一个架构良好的企业架构\n\n在 AWS 上开发最佳实践是我们运行互联网规模系统经验的结果。专家如首席工程师在识别最佳实践方面发挥关键作用，这些最佳实践通常由数据驱动。随着社区工作中涌现出新的最佳实践，首席工程师确保团队遵循这些实践。随着时间的推移，这些最佳实践将被纳入其中，确保合规性。我们在内部评审流程的结果下展示了我们对\
  \ Well-Architected Framework 的客户友好型实现。建筑师、内部工程师以及来自领域的其他人员已被纳入其中。此信息可使用 Well-Architected\
  \ Framework 以可扩展的方式利用。\n\n通过使用具有分布式所有权的首席工程社区，可以根据客户需求形成一个架构良好的企业架构。对整个投资组合的风险进行整体视图对\
  \ CTO 和其他技术领导者至关重要。因此，你的组织可以识别跨团队的主题，这些主题可以通过培训、午餐讨论或其他机制来解决，在这些机制中，你的首席工程师可以在团队之间分享他们对特定主题的想法。\n\
  \n作为 AWS 内部评审流程的一部分，架构良好的系统和服务会接受评审。根本原因分析侧重于影响架构方法实施的设计原则；它还提出问题以确保个人不会忽视存在于许多\
  \ RCA 中的因素。每当内部系统或服务出现技术问题，或客户联系我们时，我们的评审流程就会接受评审，以查看是否可以改进。产品评审应在产品生命周期的关键里程碑进行，例如在设计阶段早期以避免单向门，并在服务首次发布之前。如果你投入生产后添加新功能并实施新技术，你将继续有更多工作要做。工作负载在增长时会发生变化。如果你希望其架构特性在老化过程中保持完整，则保持良好的卫生实践至关重要。建议在进行重大架构变更之前执行\
  \ Well-Architected 评审。\n\n要将评审用作一次性快照或独立测量，你必须确保合适的人员参与对话。在评审会议期间，团队可以首次评估其工作的质量。在评审另一团队的工作负载时，有助于就另一团队的架构进行非正式讨论。为了获得清晰度或深入挖掘，你可以举行第二次或第三次会议来澄清或解决模糊性。业务背景应帮助你在评审问题后决定你的优先事项。此外，你需要考虑这些问题可能如何影响你团队的常规工作。解决反复出现的问题会更早，让你有更多时间为公司创造价值。随着问题的解决和架构的改进，你的评审将被更新。\n\
  \n评审的好处在进行后会变得明显，但新团队可能首先表示抵制。你可以通过教育来解决反对意见，说明评审将如何使团队受益：\n\n- 团队太忙了！（在启动大型项目前使用的说法。）\n\
  \  - 在推出大型产品之前，请确保其准备充分。你可以通过评审来确定是否犯了任何错误。\n  - 为了在产品生命周期的早期制定缓解计划，进行早期评审非常重要。\n\
  - 在像超级碗这样的大型活动之前，人们经常说，*没有时间采取行动来应对结果！*\n  - 无法改变前面提到的事件。你是否希望在不了解其与架构的关系的情况下经历这种风险？即使你不解决所有问题，如果它们出现，仍然需要操作手册。\n\
  - 我们无意让他人知道我们如何实施解决方案：\n  - 当将问题指向 Well-Architected Framework 团队时，很明显没有任何问题会透露任何技术或商业专有信息。\n\
  \n你组织内不同团队进行的一系列评审可能会导致发现主题性问题。如果你检查一组团队，问题可能出在某个特定的支柱或主题上。作为全面评审的一部分，你需要确定任何机制、培训或工程师主导的讨论，这些可以帮助你解决这些主题性问题。在许多行业，由于数字技术的\
  \ proliferate，变化正在更快地发生。公司被迫每隔几年就重新发明自己，因为获得竞争优势变得越来越困难。政府机构也在改进其提供数字服务的方式，以响应公民的期望和行为。利用数字技术来适应市场变化、取悦客户并加速业务成果的企业更成功。\n\
  \n## 云迁移战略\n\n有数百万客户在使用 AWS，从初创公司到政府机构。业务流程必须数字化并优化，遗留工作负载必须迁移和现代化，商业模式必须重新发明。由云驱动的转型使运营更高效、降低风险并降低成本。此外，它们还能提高员工士气和客户满意度，以及敏捷性。云可以有效地用于数字化转型，但前提是你拥有一套基础的组织能力（你的云就绪性）。通过识别这些能力并提供指导性建议，AWS\
  \ Cloud Transformation Accelerator 帮助全球数千家组织加速其云转型工作。\n\n一旦你了解迁移到云环境的理由，你就可以制定云迁移战略。在云计算中，无需维护数据中心，可扩展性得到改善，弹性得到改善，团队可以远程协作。当你使用\
  \ AWS 时，你可以现代化你的技术，并获得移动能力、云架构、设计和开发的端到端支持。AWS 的 Well-Architected Framework 允许你优化应用程序的开发、维护和升级方式。\n\
  \n通过培训课程、午餐讨论或其他机制促进首席工程师之间关于特定主题的沟通，你的组织可以解决跨团队的主题。你可以使用 Amazon Cloud Architecture\
  \ Framework 识别和优先考虑转型的机会。评估和改进你的云就绪性，并在转型组织时迭代改进你的路线图，最终将提高你组织的敏捷性。\n\n## 架构开发方法阶段\n\
  \n由于 TOGAF 主要由 VLE 使用，对于较小的公司而言，ADM 就足够了。在敏捷项目中，需求阶段的迭代很常见。在大多数情况下，业务需求会在你明确定义和理解它们之前被提取和澄清。ADM\
  \ 有 10 个阶段，如下所述。Open Group 网站上的 TOGAF 文档提供了 TOGAF 方法的完整概述以及每个阶段的描述，确定其目标、输入、步骤和成果。\n\
  \n### 初步阶段 – 框架和原则\n\n组织的初步阶段关注在特定企业内定义架构的地点、何物、为何、谁以及如何进行。它解决了企业定义并帮助你识别关键驱动因素和要素。它还允许你确定架构的要求并定义将执行任何架构工作的架构原则。定义框架和管理框架之间的关系，以及确定企业架构的成熟度也被涵盖。\n\
  \n\n\n## 阶段 A – 架构愿景\n架构工作请求由赞助组织发送给架构组织。本阶段包括定义架构范围、制定愿景以及申请审批。\n\n## 阶段 B – 业务架构\n\
  如果业务架构尚未在其他流程中得到处理，则必须从业务架构开始。例如，可以通过企业规划或战略业务规划来重新设计业务流程。\n\n## 阶段 C – 信息系统架构\n\
  在本阶段，您开发数据架构、应用架构和信息系统架构。例如，对于每个架构域，您会分别获得数据架构和应用架构的详细说明。\n\n## 阶段 D – 技术架构\n技术架构包括以下步骤：\n\
  \n- 工具、视角和参考模型\n- 开发基线技术架构描述\n- 开发目标技术架构描述\n- 评估差距\n- 开发路线图组件\n- 解决架构全景中的影响\n- 进行正式的利益相关者评审\n\
  - 完成技术架构\n- 创建架构定义文档\n\n## 阶段 E – 机会与解决方案\n当您识别出变化的参数时，您就处于机会与解决方案阶段。同时也会确定通往目标的途中需要采取的主要阶段以及为实现目标而执行的顶层项目。\n\
  \n## 阶段 F – 迁移规划\n优先排序实施项目是迁移规划的一部分。评估迁移项目的成本、收益和依赖关系也包含在此活动中。\n\n## 阶段 G – 实施治理\n\
  在此阶段，您收集管理各种实施项目所需的所有信息。\n\n## 阶段 H – 架构变更管理\n在此阶段，您为新的企业架构基线建立处理架构变更管理的流程。\n\n\
  ## ADM 架构需求管理\n通过架构需求管理流程，ADM 不断推进。在软件、硬件、电气、电子等技术专业领域工作的开发人员开发运营价值流。担任此角色的人员在内部和外部客户中定义、开发、测试和部署解决方案。客户中心性和设计思维使公司能够开发适合客户的产品，而敏捷性使他们能够快速应对市场变化和新兴机会。\n\
  \n软件行业多年来一直拥抱敏捷。SAFe 流程足够灵活，可以在各种企业可扩展性级别部署。行为驱动开发（BDD）、测试驱动开发（TDD）、敏捷测试、重构和尖峰是我们的一些高级兴趣。规模化敏捷软件架构通过结合实践、价值观和合作伙伴关系支持演进式设计和架构。DevOps\
  \ 哲学强调在支持用户需求的同时不断增强系统架构的重要性。大量返工和重新设计投入到 BDUF 和阶段门流程中，导致延迟。正如敏捷开发实践提供测试、部署和发布能力一样，敏捷架构也提供这些能力。在敏捷开发实践中，敏捷架构鼓励协作和设计简洁。\n\
  \n为公司的业务目标配置计算资源是企业架构的前提条件。为了取得成功，公司的运营、数据和信息以及支持的基础设施必须与其战略目标保持一致。组织可以生成技术分析报告，展示技术如何变化以及未来技术如何融入其现有技术。数字化转型时代带来了各种业务和技术变化。观察到企业架构师也在很大程度上受益于变革管理的工具箱。EA\
  \ 构建模型并利用这些模型产生可操作见解的能力在制定战略和执行这些举措中发挥着关键作用。尽管传统规划流程不包括那些模型，但它们迫使的沟通水平远高于其传统对应物。\n\
  \n如果有幸被选为企业架构师的角色，企业架构师必须了解其价值的来源。因此，与其与业务战略团队和 PMO 团队竞争，您应该共同合作。将一个想法转变为全面的企业架构需要大量的对话和时间。随着技术进步和优先事项的变化，EA\
  \ 的职责和旅程会随着时间的推移而演进和成熟。制定企业架构战略会带来风险和挑战。由于技术进步速度快，整个方法论、系统和应用程序都可能在很短时间内过时。EA 模型在结合追随最新趋势的倾向时往往会迅速过时。标准版本更容易受到此影响。\n\
  \n在这种情况下，企业架构师陷入了永无止境的追赶游戏中，战略永远无法完全实现其预期效益。人们普遍认为架构师脱离现实，就像许多业务团队一样。开发人员通常对文档的益处持怀疑态度。技术高管必须不断强调企业架构对实现短期和长期业务目标的战略重要性。企业治理团队在确定企业治理目标和监管限制之外，还评估和规划未来的业务能力。这些努力旨在提高安全性和实现规模经济。\n\
  \n这些实践和策略对于敏捷架构师的成功至关重要。\n\n数字时代是指技术对为客户提供价值至关重要的时代。当业务战略发生变化时，提供业务战略的系统、应用程序和技术也必须发生变化。客户体验的所有变化都是支持应用程序和系统的团队的责任。业务负责人和产品经理应与架构师密切协调，以便这些系统能够实现当前和未来的业务目标。为了开发公司的架构，会起草投资组合愿景、投资组合画布和战略主题。这些约束为投资组合中的技术投资提供方向和背景。\n\
  \n企业架构师在缩小对架构的关注范围之外，还应考虑组织的更大战略。端到端价值流的定义包括确保期望结果的所有活动，无论是内部客户还是外部客户。为了识别触发业务架构价值流并参与其中的利益相关者，识别他们的身份至关重要。此外，通过实现价值主张而积累的增量项目也包含在内。这代表了客户寻求和获得的价值，或者换句话说，他们与企业开展业务的目的。\n\
  \n运营价值流解释了 SAFe 框架中向客户交付商品和服务的流程。除了执行工作的人员和系统外，运营价值流还包括向客户交付价值的信息流、系统和材料。\n\n\n\n\
  ## SAFe 与规模化敏捷框架\n\n本章讨论了 SAFe，这是规模化敏捷框架之一。这些框架旨在帮助大型组织采用精益和敏捷实践。基于 SAFe，企业架构促进创新和工程实践，并帮助团队协调。除了提供战略指导和参考架构外，企业架构师在帮助开发人员实施标准化标准方面也发挥着重要作用。当公司的标准不一致时，可能需要返工。此外，组织内部的壁垒可以被打破。\n\
  \n此外，企业架构强调将计算资源与业务需求相匹配的重要性。使公司的战略与所产生的信息、其支持基础设施和当前流程保持一致对成功至关重要。组织通过定期发布单独的信息获得成功。为了创建无缝的端到端价值流，敏捷架构师使用定制架构。\n\
  \n如果你不了解其运营的深入基础设施，AWS 如此快速增长似乎令人难以置信。基于 10 家公司经验的 **国际数据公司（IDC）** 研究显示，基于 AWS 的亚马逊客户投资回报率达到\
  \ 560%。按需付费的 IT 基础设施为公司提供了许多优势，包括财务效益和消除数据中心成本的能力。*Capital One* 的首席执行官 Robert Alexander\
  \ 解释说，将 Capital One 的基础设施迁移到 AWS 的主要原因是因为 AWS。在 Alexander 看来，公司需要将精力集中在高性能软件工程上。此外，他补充说，在银行业拥有出色技术的公司将获胜，而使用\
  \ AWS 的公司可以比使用私有数据中心更安全地运营业务。\n\n利用最先进的技术和实践，AWS 解决了与管理云基础设施和迁移到云相关的挑战。由于迁移到云不仅仅涉及技术，通过与亚马逊合作，我们可以帮助公司迁移到云并将其业务转变为数字企业。组织的发现过程中会确定重新购买机会。如今，构建和维护自己的邮件系统变得越来越困难。如果邮件服务目前在内部运行并且是发现评估的一部分，那么最具成本效益的邮件解决方案将是\
  \ **软件即服务（SaaS）** 方案。\n\n由于这一发展为 AWS 重新采购开辟了许多新途径，我们预计未来几年迁移到 AWS 的比例将从 5% 显著增加到\
  \ 15%。在 AWS Marketplace 中，买家一直可以选择重新购买应用程序，而不是迁移脆弱的本地产品。该过程类似于升级，其中旧平台的数据和配置被转移到重新购买的平台。\n\
  \n由于 AWS Marketplace 和 Service Catalog 的发展，现在可以同时租用设备和 SaaS 软件。卖家可以与 AWS 谈判复杂的私有报价，甚至可以自带许可证。AWS\
  \ 的快速增长可能会让不熟悉其复杂基础设施的人们怀疑是否存在潜在原因。根据基于 10 家公司数据的研究，亚马逊客户可以预测其在 AWS 上的投资在未来 5 年内将回报\
  \ 560%。公司可以从按需付费的 IT 基础设施中获得财务效益，并消除对数据中心的投资需求，这也可以提供许多竞争优势。Capital One 的首席执行官 Robert\
  \ Alexander 解释说，它迁移到 AWS 的主要原因之一是利用云计算平台。Alexander 认为公司需要转变为专门从事高性能软件工程的组织。他表示：“*银行业拥有出色技术的公司将获胜，对于我们这样的公司来说，AWS\
  \ 使我们在公共云中比在私有数据中心更安全地运营业务变得容易得多。*”\n\n利用最先进的技术和实践，AWS 解决了与管理云基础设施和迁移到云相关的挑战。由于迁移到云不仅仅涉及技术，通过与亚马逊合作，我们可以帮助公司迁移到云并将其业务转变为数字企业。由于\
