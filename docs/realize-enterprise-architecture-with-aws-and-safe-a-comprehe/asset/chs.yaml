  \n图 5.3 – 组织内产品转型的构成因素\n\n在前述图表中，有一个价值链，由使产品转型成为可能的技术、流程和组织组成。降低风险、改善**环境、社会和治理**（ESG）绩效、以及提高收入和运营效率是其中的一些业务成果。\n\
  \n## 云转型价值链\n\n使用云进行遗留基础设施、应用程序以及数据和分析平台的迁移和现代化是技术转型的核心，具体如下：\n\n- 根据云价值基准测试，从本地迁移到\
  \ AWS 可将每用户成本降低 27%，将每位管理员管理的**虚拟机 (VMs)** 数量增加 58%，停机时间减少 57%，安全事件减少 34%。\n- 通过流程转型，业务运营可以实现数字化、自动化和优化。分析平台是提取数据可操作见解的有力工具。**机器学习\
  \ (ML)** 可用于在客户服务、员工生产力、欺诈检测和预测等多个领域提高运营效率。这样，您可以在提高运营效率和运营成本的同时提高客户和员工满意度。\n- 组织的转型侧重于重新发明其运营模式——即如何协调努力为客户提供价值并与战略目标保持一致。利用敏捷方法快速迭代和演进，同时围绕产品和价值流组织团队，将有助于您变得更具响应性和以客户为中心。\n\
  - 业务模式转型涉及通过新的价值主张重新构想您的产品/服务提供和收入模式。您可能能够利用此机会触达新的客户细分市场。根据*云价值基准报告*，使用 AWS 可将**上市时间\
  \ (TTM)** 缩短 37%，代码部署频率提高 32%，部署新代码的时间减少 38%。\n\n能力有助于组织利用资源（人员、技术以及任何其他有形或无形资产）来实现特定目标。使用\
  \ AWS CAF 能力，您可以提高有效利用云以推动数字化转型的能力。**云原生计算基金会 (CNCF)** 将其能力分为六个类别——**业务**、**人员**、**治理**、**平台**、**安全**和**运营**。\n\
  \n您的云转型之旅由不同功能相关利益相关者拥有或管理的多项能力组成，如下所述。\n\n## AWS CAF 视角和基础能力\n\n如果您牢记业务目标，您的云投资将更成功。首席执行官、**首席财务官\
  \ (CFOs)**、**首席运营官 (COOs)**、CIO 和 CTO 构成了这一群体。以下是一些可采取的方法：\n\n- 将人员视角带入云之旅，可加速我们的战略，帮助组织更快地实现学习型文化的持续成长。CIO、COO、CTO、云总监以及各职能和部门的高级领导通常是利益相关者。\n\
  - 治理视角有助于您最大化云计划的收益并最小化风险。**首席转型官**（也称为**CTOs**，与首席技术官一起）、CIO、CTO、CFO、**首席数据官 (CDOs)**\
  \ 和**首席风险官 (CROs)** 是典型的利益相关者。\n- 构建企业级、可扩展的混合云平台、现代化现有工作负载以及实施云原生解决方案只是平台视角带来的诸多益处之一。典型的利益相关者是\
  \ CTO、工程师和技术领导者。\n- 当您采取安全视角时，您的云工作负载和数据将更安全。安全管理的利益相关者包括**首席信息安全官 (CISOs)**、**首席合规官\
  \ (CCOs)**、内部审计专家以及安全工程师和架构师。\n- 通过了解运营，您可以确保云服务交付达到满足业务要求的水准。许多利益相关者参与此过程，例如 IT\
  \ 服务经理、基础设施和运营领导者以及站点可靠性工程师。\n\n一旦确定了 AWS CAF 视角和基础能力，我们将继续深入探索云转型的旅程。\n\n## 云转型之旅\n\
  \n云驱动的业务成果在**Envision**阶段得到展示。该流程在四个转型领域内识别并优先考虑转型机会，以符合您的战略业务目标。以下是您可以采取的措施以从此流程中获得最大价值：\n\
  \n- 将关键利益相关者和可衡量的业务成果与转型计划联系起来，将增强您在转型之旅中展示价值的能力。\n- 对齐流程的*阶段 A* 检查 AWS CAF 视角中的差距，识别组织间的依赖关系，并揭示利益相关者的关注点和挑战。制定云就绪策略、确保利益相关者一致性以及促进组织变革管理将有助于您变得更具云就绪性。\n\
  - 在启动阶段，试点计划在生产环境中交付，并展示增量的业务价值。为了影响未来的方向，试点需要具有高度影响力。从试点中学习将帮助您在扩展到全面生产之前调整方法。\n\
  - 作为规模化阶段的一部分，您的云投资应具有可扩展性，并且您的业务价值将根据需要得以持续。\n\n某些基础能力可能不需要立即解决。您的云转型之旅需要您开发基础能力并提高云就绪度。\n\
  \n## AWS EDF\n\n云迁移使用敏捷方法进行准备和实施。该流程涉及以下内容：\n\n- 为能够响应变化，请考虑将工作结构化为史诗和用户故事\n- 优先排序积压工作并进行生产\n\
  - 制作进度报告\n- 通过迁移路线图确保业务需求高效有效地与技术计划相联系\n\n敏捷开发涉及从小处着手、迭代、评估、管理和扩展庞大的用户故事。接下来讨论的是使流程无缝衔接所涉及的步骤。\n\
  \n\n\n## Preparation\n\n这里是迁移准备工作涉及的步骤：\n\n- 1. 组建两个由就绪和规划阶段定义的内部资源组成的、每队规模相当于两块披萨的\
  \ Scrum 团队。团队应分为职能和技术角色。除了实现迁移外，这些团队还为企业规模的迁移做好业务准备：\n- A. *2披萨团队1* 结构和资源——业务案例开发、项目治理、人员技能和\
  \ **卓越中心 (CoE)**\n- B. *2披萨团队2* 结构和资源——应用发现、应用迁移、登陆区、安全和运营集成\n- 2. 迁移就绪评估结果将在与两个\
  \ Scrum 团队的规划会议中进行审查。\n- 3. *AWS 第一波* 将处理 10 到 30 个应迁移到 AWS 的本地应用程序。\n- 4. 根据 *预先准备好的*\
  \ 史诗，规划并优先处理所有工作流。\n- 5. 应用程序的迁移将分为八个为期两周的冲刺。\n- 6. 创建迁移计划，包括资源、待办事项、风险和缓解措施，以及角色和职责，例如\
  \ **负责、问责、咨询、知情 (RACI)**。\n\n鉴于这些要点，您可以识别出在项目期间负责管理风险的资源。\n\n## Implementation\n\
  \n迁移实施涉及以下步骤：\n\n- 1. 为每个冲刺与两个团队共同创建冲刺计划和目标。\n- 2. 史诗应被审查，分解为具有验收标准的用户故事，并组织到冲刺\
  \ *1* 到 *8*。\n- 3. 每个 2 披萨团队需要每日开会以保持节奏。\n- 4. 更快的反馈和不间断的工作流程是此次会议的两个重要成果。通过创建每日站会，Scrum\
  \ 负责人传达进展、解决阻碍并报告交付成果。\n- 5. 建立实施监督会议计划用于沟通和报告。确保团队运作良好并使用敏捷指标交付价值。\n- 6. 专注于管理冲刺，重点目标如下：\n\
  - A. 理解、使能和动员劳动力的能力是做中学关键。\n- B. 通过从小开始并取得早期成功，构建完整的迁移能力。\n- 7. 建立可在规模化迁移中使用的输出、最佳实践和经验教训清单。\n\
  - 8. 以 Wave 1 为指导，创建敏捷迁移的蓝图。为规划和就绪阶段奠定基础。\n\n在完成这些初始 Wave 1 迁移的过程中积累经验和信心是有益的。作为此过程的一部分，您将选择最适合您组织的迁移模式和工具。测试运营和安全流程也包含在此过程中。创建基于常见模式的应用程序分组列表，以识别投资组合内的模式（例如，常见架构和技术堆栈）。结果是针对一组应用程序的标准化的迁移流程。\n\
  \n## Value-adding outcomes\n\n当您将此敏捷模型应用于大规模运营时，可以加速实现业务成果。敏捷方法产生以下增值业务成果：\n\n-\
  \ 1. 迁移的 7 个 R 应应用于应用程序选择。\n- 2. 规划迁移工具的迁移波——使用迁移工具制定迁移组优先级列表。\n- 3. 测试和部署登陆区的各种组件将验证其功能。\n\
  - 4. **Development operations (DevOps)**——通过 DevOps 模型促进新功能、修复和更新的持续开发。\n- 5. 使用供应商工具自动化迁移流程。\n\
  - 6. 使用 AWS Prescriptive Guidance catalog 查找迁移模式。\n- 7. 目标是为服务器、数据和应用程序的迁移设计目标状态架构。\n\
  - 8. 资源将接受 AWS 服务培训并获得迁移的实践经验。\n- 9. 运行 AWS 运营运行手册使您能够验证运营模型。\n- 10. 迁移管理——处理迁移范围、计划、资源计划、问题和风险。\n\
  \n通过加速改进迁移的过程，这些要素被证明极其有效且有益。\n\n## Summary\n\n为了保持竞争力、发展业务并取得成功，您必须改变前进的道路。云采用策略需要创建或审查，以确保组织走在正确的道路上并提高其业务敏锐度。在定义组织未来将如何利用云的愿景时，确保云战略考虑到公司的业务目标。无论是短期还是长期举措，都应概述全面的路线图，然后制定纳入业务目标的迁移计划，这需要花费时间。\n\
  \n在了解为何迁移到云后，您可以制定云迁移战略。云计算通常用于避免数据中心维护成本、增强可扩展性、提高弹性并增强团队之间的远程协作。作为 AWS 的客户，您的业务发展团队可以访问技术现代化以及应用程序架构、设计、开发、移动能力、测试和协作解决方案的端到端支持。AWS\
  \ 的 Well-Architected Framework 可以帮助您优化在 AWS 上构建、维护和升级应用程序的方式。\n\n您的组织可以通过培训课程、午餐讨论或其他促进首席工程师在特定主题上沟通的机制来解决跨团队的主题。AWS\
  \ CAF 将使您能够识别和优先考虑转型机会、评估和改进您的云就绪情况，并在转型组织时迭代增强您的路线图。\n\n下一章将介绍 **The Open Group\
  \ Architecture Framework (TOGAF)** 架构域并在 AWS 上下文中探讨云生态系统。我们还将回顾参考架构和模型，以了解更多关于每个\
  \ TOGAF **Architecture Development Method (ADM)** 在 AWS 云转型中每个阶段的信息。\n\n## TOGAF\
  \ Framework in Action with AWS\n\n与传统的瀑布流程相比，架构可以以迭代方式开发。显然，敏捷-Scrum 方法已被证明是成功的，因为它们强调迭代。在此过程中，文档和适当的规划不必被忽视。事实上，它们应该受到鼓励。\n\
  \n在本章中，我们将涵盖以下主题：\n\n- TOGAF – Architecture Development Method (ADM) phases and\
  \ approaches\n- Cloud architecture development method\n- Cloud ecosystem reference\
  \ models\n- Enterprise architecture principles of the cloud ecosystem\n\n### TOGAF\
  \ – ADM phases and approaches\n\n我们的目标是开发一个高效且有效的 information systems 架构。但请记住，这不是为了创建无尽且不必要的工件。通常，敏捷项目在需求阶段涉及迭代。项目很少有明确定义且理解的业务需求，而无需事先收集和澄清它们。\n\
  \n下表中列出了 ADM 阶段。每个阶段涵盖特定角色并描述基本方面：\n\n| Phase | Description |\n|---|---|\n| Preliminary\
  \ Phase | 创建架构能力需要准备和启动活动，例如定制 TOGAF、选择工具和定义架构原则。 |\n| Requirements Management |\
  \ 业务需求应在 TOGAF 项目的每一步中纳入。ADM 阶段处理、处理和根据其识别、存储以及输入和输出来优先考虑需求。 |\n| Phase A: Architecture\
  \ Vision | TOGAF 项目应具有明确的范围、需求和期望。建立架构愿景并识别利益相关者。建立架构工作说明书并验证业务背景。获得任何变更的批准。 |\n\
  | Phase B: Business Architecture<br>Phase C: Information Systems Architectures<br>Phase\
  \ D: Technology Architecture | 以下四个域应开发：<br>1. 业务<br>2. 信息系统 – 应用<br>3. 信息系统 – 数据<br>4.\
  \ 技术<br><br>为每种情况构建基线和目标架构并评估差距。 |\n| Phase E: Opportunities and Solutions | 识别之前识别的构建块，并确定将交付它们的载体。识别如果需要增量方法所需的过渡架构。\
  \ |\n| Phase F: Migration Planning | 通过制定详细计划，规划基线架构到目标架构的实施和迁移。 |\n| Phase G: Implementation\
  \ Governance | 从架构角度监督实施。起草架构合同并发布。检查项目执行是否符合架构。 |\n| Phase H: Architecture Change\
  \ Management | 为确保架构满足企业需求并最大化其价值，应持续监控架构并建立变更管理流程。 |\n\n### Preliminary phase\n\
  \n在此第一阶段，企业正在定义架构应在企业中何时、何地、何事、为何、谁以及如何完成。主要方面如下列出：\n\n- Enterprise definition\n\
  - Key drivers and elements in the organizational context identification\n- Requirements\
  \ for the architecture\n- Development of architecture principles\n\n\n\n- 架构框架的定义\n\
  - 管理框架之间的关系\n- 企业架构成熟度的评估\n\n为了使高管、规划者、架构师和工程师能够有效协调、整合并开展其活动，企业架构为组织提供战略性的自上而下的视图。通过企业架构框架，该团队拥有一个战略框架，使其能够有效开展活动。因此，企业架构师必须考虑其框架与组织内其他框架之间的互操作性，因此不可能孤立地开发企业架构。愿景和目标必须在战略、中期和战术层面设定。\n\
  \n## 企业架构\n架构面临与组织范围相关的诸多挑战。企业架构能力对利益相关者的影响程度取决于企业的范围以及是否采用联邦模式。为了使由此产生的活动获得资源并得到管理层的明确支持，在此阶段，任命一位赞助者至关重要。企业内部可能存在多个组织，赞助者负责确保所有利益相关者群体都参与到架构能力的定义、建立和利用过程中。\n\
  \n## 组织背景\n企业在做出明智和有效的决策之前，必须了解其计划使用的架构框架所处的背景。应考虑以下具体领域清单：\n\n- 当企业架构没有商业模式或预算可用时，应基于初步阶段\n\
  - 在架构生命周期中识别企业利益相关者的关键问题和关注点\n- 描述组织的业务原则和目标，如董事会制定的方向、要求和战略所表达的那样\n- 关注技术和信息组合管理流程和方法，以及当前系统设计和开发框架和方法\n\
  - 基于基线架构，描述当前在文档中如何呈现架构全景，以及企业的现状\n- 采用该框架的组织和企业必须识别其技能和能力。\n\n## 架构工作的要求\n企业架构工作的要求和绩效指标由业务要求驱动。必须确保业务成果和资源需求足够明确，以便本阶段能够定义待完成企业架构工作的范围，并定义企业业务信息需求和相关战略的大纲。以下是一些示例：\n\
  \n- 业务需求\n- 文化愿景\n- 组织意图\n- 战略意图\n- 预测财务需求\n\n阐明其中每个要素的关键要素很重要。作为定义和建立架构能力的过程的一部分，赞助者有必要识别所有相关的决策者和利益相关者。\n\
  \n## 原则\n在开始任何需要企业批准的架构工作之前，初步阶段定义架构原则。为了开发企业架构，必须定义架构原则。除了架构原则外，业务原则也在企业架构中发挥作用。业务原则也是架构原则本身的一部分。通常，架构职能不负责定义业务原则。如果这些原则在企业内部制定并推广，则可能将其与其他业务原则、战略业务驱动因素或业务目标交叉引用。\n\
  \n## 管理框架\nTOGAF 框架必须与组织内可能存在的其他管理框架（正式或非正式）共存。大多数组织使用系统开发解决方案，其中大多数情况下包含 IT 组件。在业务中，系统很重要，因为它们包括人员和流程。建议将\
  \ TOGAF 与以下框架列表进行协调：\n\n- 业务能力管理包括 **投资回报率 (ROI)** 的定义以及确定交付业务价值所需业务能力所需的绩效指标\n\
  - 用于管理公司变革计划的方法取决于项目或组合\n- 运营管理描述了企业如何开展日常运营，包括其如何管理自身的 IT\n- 根据解决方案开发方法，按照 IT 系统架构交付业务系统的流程\n\
  \n## 管理框架的关联\n为了规划、创建和交付项目章程中指定的架构组件，组合管理框架采用解决方案开发方法论。新建建筑、新技能、新设备、招聘、营销等都是交付成果的示例，但它们并不仅限于\
  \ IT。企业架构支持业务流程，而不仅仅是 IT。为了企业利益，管理框架需要相互补充并协同工作。\n\n在战略层面，企业架构由业务规划指导。以年度为单位提供更新的规划是一种提供更精细指导水平的方法。企业中另一种流行的方法是基于能力规划。有时，企业架构师会被调至战略方向组或在某些组织内与其密切合作。企业架构框架使用\
  \ TOGAF 开发。如以下图所示，能力规划是一个复杂的循环，需要了解业务的多个方面：\n\n![](img/16bfeb984938aba3d9334582c2cd6e69_161_0.png)\n\
  \n图 6.1 – 业务发展和能力规划的循环\n\n## 业务变革成熟度评估\n使用能力成熟度模型，组织可以评估其行使各种能力的能力。通常，能力成熟度模型会识别行使能力所需存在的因素。通过衡量组织执行特定因素的能力，可以识别出有助于改进能力的顺序步骤。高管可以将此作为一种工具来务实地改进其能力。\n\
  \n为了开发和应用企业架构，企业架构成熟度模型必须涵盖必要的特性。然而，建议组织采用现有的成熟度模型，对其进行定制，然后确定应考虑的因素。\n\n## Phase\
  \ A – 架构愿景\n从 Phase A 开始，赞助组织向架构组织发送《架构工作请求》文档。此外，它还描述了架构工作 effort 中包含的内容和不包含的内容，以及必须解决的约束条件。\n\
  \n## 总则\nADM 周期中架构活动的范围定义将在初步阶段确定，并在架构愿景阶段的架构框架中体现。架构愿景阶段仅解决 ADM 周期的特定目标。当现有的架构框架与拟议的架构愿景不一致时，请考虑重新审视初步阶段并扩展企业架构框架。\n\
  \n## 创建架构愿景\n通过架构愿景向企业利益相关者和决策者推销拟议能力的益处是赞助者的工作。通过解决利益相关者的关注点，它在满足组织目标的同时也解决了利益相关者的关注点。适应新兴技术及其可能对行业和企业产生的影响是架构愿景不可或缺的一部分，否则可能会错失许多业务机会。\n\
  \n此活动的关键部分之一是明确并就目的达成一致，并且目的需要在为架构工作创建的内容中得到清晰体现。在更广泛的业务战略或企业规划过程中，企业使命、愿景、战略和目标是组织架构愿景的一部分。为了在企业战略与架构背后的目标和决策之间建立桥梁，核实和理解已记录的业务战略和目标至关重要。企业对其客户和利益相关者的利益进行建模，这是一项重要的战略成果。\n\
  \n让我们研究并查找有关基本业务架构概念的材料，例如以下内容：\n\n- **业务能力：**\n  这些是企业可能拥有或交换的特定能力，以帮助其实现特定目标或目的。架构师必须确定组织是否具有表示业务能力的框架。\n\
  \n\n\n- **价值流：**\n  这些是为客户、利益相关者或终端用户贡献整体成果的活动。\n- **组织图：**\n  它们展示了企业与其合作伙伴和利益相关者之间主要组成部分的关系。\n\
  \n除企业架构之外，架构愿景还探索与企业架构相关的额外领域。利益相关者域可能由基础域的元素组成，但也具有独特的目的。以下是一些示例：\n\n- Information\n\
  - Security\n- Digital network\n- Network management\n- Knowledge\n- Industry-specific\
  \ domains\n- Services\n- Partnership\n- Cybersecurity\n\n我们的基线架构和目标架构可以根据此架构愿景针对业务、数据、应用和技术域进行描述。该大纲的进一步开发将随后进行。\n\
  \n## Phase B – 业务架构\n\n在本报告中，您将获得对能力、端到端价值交付、信息和组织结构的全景概述，以及这些组件、产品、政策和举措之间的联系。以域为基础的方法，业务架构将业务要素与业务目标和其他域要素联系起来。\n\
  \n### General\n\n业务架构知识是所有其他架构活动的先决条件，应是流程中的第一步，特别是当它未在其他组织流程中得到解决时。此外，通常需要业务架构，以便让关键利益相关者相信后续架构工作的业务价值，并相信他们通过支持和参与后续工作所获得的好处。\n\
  \n业务战略定义业务战略及其目标，尽管不一定是如何实现它们。Phase B工作的范围主要由Phase A的架构愿景决定。Phase B详细定义了业务架构的作用。在最大程度上，应重复使用现有材料。在架构更成熟的环境中，可能已经存在架构定义，这些定义可能自上次架构开发周期以来一直得到维护。\n\
  \n### Developing the baseline description\n\n如果企业已有架构描述，基线描述应基于现有架构描述。在开发架构愿景时，Phase\
  \ A可能已包含业务能力图或核心价值流集。\n\n如果实施了新的价值流、缺少业务能力，或发生了企业架构项目中未考虑的组织单位变更，则应更新这些材料。如果不存在架构描述，则应收集信息并开发业务架构模型。\n\
  \n### Applying business capabilities\n\n作为架构愿景阶段的一部分，业务能力图是从独立于组织结构、业务流程、信息系统以及投资组合中包含的其他产品或服务的单独业务的角度开发的。必须在企业架构项目的范围内，基于组织单位、价值流和信息系统创建这些业务能力的地图。这样，每个域都能更有效地对齐和优化。\n\
  \n### Applying value streams\n\n在架构愿景阶段，记录业务的初始价值流模型。如果特定企业架构项目的范围足够广泛，则可能需要在该项目中创建新的价值流。通过热力图或围绕价值流的完整定义开发用例，可以在项目范围内分析新的或现有的价值流。\n\
  \n### Applying the organization map\n\n组织企业生态系统涉及识别构成其的关键组织单位、合作伙伴和利益相关者群体。组织图基于业务单元概念。与仅显示层级汇报关系的组织结构图不同，该图还应显示这些实体之间的工作关系。该图描绘了各种业务实体之间的交互和关系，通常表示为网络或网状结构。\n\
  \n### Applying modeling techniques\n\n如Phase B所述，业务能力、价值流和组织图在该阶段通过建模和映射技术进行扩展并应用于业务。为了实现其目标，组织必须扩展其运营模型。运营模型是对组织在各个域中如何运作的表示。除了能力图、价值流和组织图之外，还可以应用许多其他建模技术，例如以下内容：\n\
  \n- **活动模型/业务流程模型** – 这些描述与企业内部交换相关的功能，例如业务活动、活动之间交换的数据和/或信息。\n- **用例模型** – 这些基于建模工作的目的；它们描述业务流程或系统功能。\n\
  - **类模型** - 这些描述信息行为。它们也可以对多种粒度进行建模，就像许多其他模型一样。\n\n架构团队将在Phase B期间探索架构存储库，具体如下：\n\
  \n- Reference models for the industry for which the organization operates\n- Views\
  \ specific to a business enterprise such as capability maps, value stream maps,\
  \ and organization maps\n- Building blocks that are specific to your enterprises\
  \ such as process components, business rules, and job descriptions\n- Applicable\
  \ standards\n\n## Phase C – 数据架构的关键考虑因素\n\n企业在进行大规模架构转型时必须解决数据管理问题。系统化和全面的数据管理方法使利用数据发挥其竞争优势变得更加容易。\n\
  \n### Data management\n\n当企业选择进行大规模架构转型时，必须理解和解决相关问题。通过结构化和全面的数据管理方法可以实现数据的有效使用。数据管理考虑因素包括以下列表：\n\
  \n- It should be determined which of the application components in the landscape\
  \ will serve as the enterprise master data system or reference\n- See whether there\
  \ are any enterprise-wide standards that all software packages and application components\
  \ must adopt\n- Understand how data entities are used in business processes, functions,\
  \ and services\n- Be able to clearly understand how, where, and for how long enterprise\
  \ data entities are stored, transported, and reported\n- In order to support information\
  \ exchange between applications, what level of data transformations are required?\n\
  - In what ways will the software be required to support the integration of enterprise\
  \ data with that of its customers and suppliers?\n\n### Data migration\n\n当新应用替换现有应用时，必须从现有应用迁移数据。数据架构应包括数据转换、筛选和清理的程度，以便以满足目标应用要求和约束的格式呈现数据。填充目标应用时的目标是数据质量。此外，为了使转换成功，需要开发通用的数据定义。\n\
  \n### Data governance\n\n为了确保企业能够成功转型，数据治理考虑因素将确保必要的[content]\n- **价值流：**\n  这些是为客户、利益相关者或终端用户贡献整体成果的活动。\n\
  - **组织图：**\n  它们展示了企业与其合作伙伴和利益相关者之间主要组成部分的关系。\n\n除企业架构之外，架构愿景还探索与企业架构相关的额外领域。利益相关者域可能由基础域的元素组成，但也具有独特的目的。以下是一些示例：\n\
  \n- Information\n- Security\n- Digital network\n- Network management\n- Knowledge\n\
  - Industry-specific domains\n- Services\n- Partnership\n- Cybersecurity\n\n我们的基线架构和目标架构可以根据此架构愿景针对业务、数据、应用和技术域进行描述。该大纲的进一步开发将随后进行。\n\
  \n## Phase B – 业务架构\n\n在本报告中，您将获得对能力、端到端价值交付、信息和组织结构的全景概述，以及这些组件、产品、政策和举措之间的联系。以域为基础的方法，业务架构将业务要素与业务目标和其他域要素联系起来。\n\
  \n### General\n\n业务架构知识是所有其他架构活动的先决条件，应是流程中的第一步，特别是当它未在其他组织流程中得到解决时。此外，通常需要业务架构，以便让关键利益相关者相信后续架构工作的业务价值，并相信他们通过支持和参与后续工作所获得的好处。\n\
  \n业务战略定义业务战略及其目标，尽管不一定是如何实现它们。Phase B工作的范围主要由Phase A的架构愿景决定。Phase B详细定义了业务架构的作用。在最大程度上，应重复使用现有材料。在架构更成熟的环境中，可能已经存在架构定义，这些定义可能自上次架构开发周期以来一直得到维护。\n\
  \n### Developing the baseline description\n\n如果企业已有架构描述，基线描述应基于现有架构描述。在开发架构愿景时，Phase\
  \ A可能已包含业务能力图或核心价值流集。\n\n如果实施了新的价值流、缺少业务能力，或发生了企业架构项目中未考虑的组织单位变更，则应更新这些材料。如果不存在架构描述，则应收集信息并开发业务架构模型。\n\
  \n### Applying business capabilities\n\n作为架构愿景阶段的一部分，业务能力图是从独立于组织结构、业务流程、信息系统以及投资组合中包含的其他产品或服务的单独业务的角度开发的。必须在企业架构项目的范围内，基于组织单位、价值流和信息系统创建这些业务能力的地图。这样，每个域都能更有效地对齐和优化。\n\
  \n### Applying value streams\n\n在架构愿景阶段，记录业务的初始价值流模型。如果特定企业架构项目的范围足够广泛，则可能需要在该项目中创建新的价值流。通过热力图或围绕价值流的完整定义开发用例，可以在项目范围内分析新的或现有的价值流。\n\
  \n### Applying the organization map\n\n组织企业生态系统涉及识别构成其的关键组织单位、合作伙伴和利益相关者群体。组织图基于业务单元概念。与仅显示层级汇报关系的组织结构图不同，该图还应显示这些实体之间的工作关系。该图描绘了各种业务实体之间的交互和关系，通常表示为网络或网状结构。\n\
  \n### Applying modeling techniques\n\n如Phase B所述，业务能力、价值流和组织图在该阶段通过建模和映射技术进行扩展并应用于业务。为了实现其目标，组织必须扩展其运营模型。运营模型是对组织在各个域中如何运作的表示。除了能力图、价值流和组织图之外，还可以应用许多其他建模技术，例如以下内容：\n\
  \n- **活动模型/业务流程模型** – 这些描述与企业内部交换相关的功能，例如业务活动、活动之间交换的数据和/或信息。\n- **用例模型** – 这些基于建模工作的目的；它们描述业务流程或系统功能。\n\
  - **类模型** - 这些描述信息行为。它们也可以对多种粒度进行建模，就像许多其他模型一样。\n\n架构团队将在Phase B期间探索架构存储库，具体如下：\n\
  \n- Reference models for the industry for which the organization operates\n- Views\
  \ specific to a business enterprise such as capability maps, value stream maps,\
  \ and organization maps\n- Building blocks that are specific to your enterprises\
  \ such as process components, business rules, and job descriptions\n- Applicable\
  \ standards\n\n## Phase C – 数据架构的关键考虑因素\n\n企业在进行大规模架构转型时必须解决数据管理问题。系统化和全面的数据管理方法使利用数据发挥其竞争优势变得更加容易。\n\
  \n### Data management\n\n当企业选择进行大规模架构转型时，必须理解和解决相关问题。通过结构化和全面的数据管理方法可以实现数据的有效使用。数据管理考虑因素包括以下列表：\n\
  \n- It should be determined which of the application components in the landscape\
  \ will serve as the enterprise master data system or reference\n- See whether there\
  \ are any enterprise-wide standards that all software packages and application components\
  \ must adopt\n- Understand how data entities are used in business processes, functions,\
  \ and services\n- Be able to clearly understand how, where, and for how long enterprise\
  \ data entities are stored, transported, and reported\n- In order to support information\
  \ exchange between applications, what level of data transformations are required?\n\
  - In what ways will the software be required to support the integration of enterprise\
  \ data with that of its customers and suppliers?\n\n### Data migration\n\n当新应用替换现有应用时，必须从现有应用迁移数据。数据架构应包括数据转换、筛选和清理的程度，以便以满足目标应用要求和约束的格式呈现数据。填充目标应用时的目标是数据质量。此外，为了使转换成功，需要开发通用的数据定义。\n\
  \n### Data governance\n\n为了确保企业能够成功转型，数据治理考虑因素将确保必要的[content]\n- **价值流：**\n  这些是为客户、利益相关者或终端用户贡献整体成果的活动。\n\
  - **组织图：**\n  它们展示了企业与其合作伙伴和利益相关者之间主要组成部分的关系。\n\n除企业架构之外，架构愿景还探索与企业架构相关的额外领域。利益相关者域可能由基础域的元素组成，但也具有独特的目的。以下是一些示例：\n\
  \n- 信息\n- 安全\n- 数字网络\n- 网络管理\n- 知识\n- 行业特定域\n- 服务\n- 合作伙伴关系\n- 网络安全\n\n我们的基线架构和目标架构可以根据此架构愿景针对业务、数据、应用和技术域进行描述。该大纲的进一步开发将随后进行。\n\
  \n## Phase B – 业务架构\n\n在本报告中，您将获得对能力、端到端价值交付、信息和组织结构的全景概述，以及这些组件、产品、政策和举措之间的联系。以域为基础的方法，业务架构将业务要素与业务目标和其他域要素联系起来。\n\
  \n### 通用\n\n业务架构知识是所有其他架构活动的先决条件，应是流程中的第一步，特别是当它未在其他组织流程中得到解决时。此外，通常需要业务架构，以便让关键利益相关者相信后续架构工作的业务价值，并相信他们通过支持和参与后续工作所获得的好处。\n\
  \n业务战略定义业务战略及其目标，尽管不一定是如何实现它们。Phase B工作的范围主要由Phase A的架构愿景决定。Phase B详细定义了业务架构的作用。在最大程度上，应重复使用现有材料。在架构更成熟的环境中，可能已经存在架构定义，这些定义可能自上次架构开发周期以来一直得到维护。\n\
