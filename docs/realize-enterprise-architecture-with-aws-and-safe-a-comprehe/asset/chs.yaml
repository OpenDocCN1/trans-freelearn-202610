  \ 构建业务特定的核心基础\n\n符合 EA 原则的组织必须拥有 EA 领导者，他们能提前思考流程要素以保持工作流顺畅无缝。团队规模、基础设施模型和组织结构位列首位。共同为项目和共同目标工作的个人或团队方法可能不同，但工作伦理和\
  \ EA 模型必须一致，以维持有效工作流并确保运营敏捷性：\n\n### 了解 EA 利益相关者\n吸引并识别符合特定标准的利益相关者群体，包括客户，是组织转型\
  \ EA 模型的首要任务。每个利益相关者都处于特定职位，有可由可信 EA 结构满足的具体需求。例如，在为技术奠定业务价值基础时，CIO 可能会对应用路线图、投资和成本结构提出一系列问题。参考应用生命周期图、财务矩阵和成本热力图可帮助找到答案。\n\
  \n### 参与 EA 利益相关者\n获得合适团队并使其加入可能比保持所有人一致、提供持续支持和有效沟通更容易。利益相关者参与计划会根据组织结构和 EA 项目范围而变化，但通常涉及以下渐进层级：\n\
  - **制定策略**：规划方法，同时考虑到必须维持的持续流程，以保留关键利益相关者支持\n- **了解组织**：对组织历史、文化和关键利益相关者有坚实把握，更易评估和识别最佳机构实践\n\
  - **评估当前能力**：利用分析、组织洞察和数据来规划实现预期成果的步骤\n- **运营与演进**：根据组织指南建立 EA 运营，并在行业和组织发展中持续演进工作，以产生和维持利益相关者支持\n\
  \n### 选择运营模式\n建立能够巩固组织并能高效应对内部或外部问题的模式很重要。这是 EA 执行基础的第一步。\n每个模式都不同，基于组织的核心理念、目标和项目规模。以下是常见的\
  \ EA 运营模式：\n- **协调运营模式**：自主业务单元控制业务流程设计并适应其运营。\n- **统一运营模式**：采用矩阵方法整合全球业务流程集并进行集中管理。在此模式下，高层管理保持关注所有单元业务流程标准化。\n\
  - **多元化运营模式**：每个业务单元独特，拥有独立交易集。除最低限度业务流程标准化外，大多数 IT 决策和业务选择均由共享服务集独立做出。\n- **复制运营模式**：业务单元采用联邦方法进行整合和标准化。工作流集中管理，但数据本地拥有，并与企业进行部分汇总和共享。\n\
  \n### 定义 EA 团队结构\n如何构建 EA 团队有时是组织计划建立内部 EA 结构时不断回响的问题。开始时做出的任何决定都将产生长期影响，且在此阶段更容易获得组织认可。\n\
  尽管团队规模小、预算有限、决策权小，大多数企业架构师仍被期望实施强大的战略技术项目。EA 可以分布在组织各领导层中，以寻求更好的一致性和工作流。\n\n###\
  \ 构建 EA 生态系统\n通过从主要利益相关者获得认可不断扩大网络，最终将实现最大利益。核心 EA 团队应不断探索其与更广泛团队合作的方式并在过程中改进。\n\
  核心 EA 团队拥有整体 EA 结构、定义标准并制定业务对齐战略。根据 Gartner 研究副总裁 Marcus Blosch 的说法，与其关注标准、结构和控制，组织必须将战略拓宽至推动业务成果，并灵活创造性地工作以定义未来及实现路径。通过采用这些特质，EA\
  \ 团队可培养新人才以支持数字业务和数字化转型。他们将建立在制定业务战略、设计新服务和体验、推动创新、在组织内协调协作以及导航未来方面的能力。\n\n> “任何\
  \ EA 成功的关键在于架构师的战略配置。\n> 他们可以设在单一部门或分散在向不同经理汇报的各组中。\n> 因此，没有两个 EA 团队看起来相同。”\n>\n\
  > *Forrester*\n\n相反，更广泛的 EA 团队由解决方案、技术和业务架构师组成，是核心团队的延伸。他们与利益相关者在不断演变、混乱的环境中工作。核心团队与更广泛团队之间顺畅一致的信息流确保更稳健的基础设施和更好成果。\n\
  \n### 准确配置团队规模\n大型 EA 团队可能有 50+ 人专注于不同架构域或 EA 整体，中型团队由 15-50 人组成，小型团队少于 15 人。以下因素可帮助\
  \ EA 领导者确定团队适当规模：\n- 组织内的产品和服务数量\n- 收入和利润计算的时间\n- 组织内业务流程的成熟度\n- 账户和财务管理的效率\n- 组织资源和用于进阶的\
  \ IT 预算\n- 组织适应 EA 的速度\n\n总体而言，EA 团队的合适规模没有固定标准，因为它基于组织内的某些因素。\n\n## 构建核心基础的 EA\
  \ 域\n\n*Stephen Spewak's Enterprise Architecture Planning* 大大促进了当前将 EA 划分为四个域的流行。虽然其方法于\
  \ 1993 年发表，但至今仍被大多数 EA 项目团队使用。\n\n让我们看看 EA 工作的四个域。\n\n### 业务架构\n该域定义组织结构，同时解决谁参与以及他们在公司功能能力内做什么。让我们看看代表该域必须回答的一些示例问题。一般而言，业务架构包括业务流程、业务能力、服务、运营模式和价值流。业务愿景、战略和目标是什么？谁负责推动并实现预期目标？\n\
  \n### 应用架构\n该域考虑特定应用与组织核心业务流程之间的关系，同时提出问题：当前业务能力是如何实现的？根据不断变化的需求定制软件解决方案的过程在此阶段得到解决。当组织使用的软件无法满足客户需求时，功能更新至关重要。重新设计软件是最后的手段，但在无法适应现代进步的情况下是必要的。\n\
  \n### 数据架构\n该域涉及组织数据资产和资源的结构。业务分析的洞察使企业能够随着客户需求而演进。用户收集的数据存储在数据库中，以便将来参考时进行管理和维护。战略架构使处理复杂数据变得容易得多。\n\
  \n### 技术架构\n实施应用服务需要软件和硬件等资源。现代技术对于构建功能网络至关重要。这包括设备、路由器、软件和存储。适应变化是成功的关键，而这些变化将以动态市场和不断变化的用户行为的形式出现。\n\
  \n将数据和应用域合并为单一信息系统组件的常见做法对许多 EA 框架有效。此外，客户收集的所有数据可能占用大量空间。将其放在云中是最安全、最先进的方式，以保持顺畅运行。\n\
  \n## 核心基础在业务中扮演什么角色？\n\n每个企业都有内置的 EA 来帮助实现特定目标。在某些组织中，它经过深思熟虑设计，以支持高度专业团队，他们聚集在一起形成战略指南。基于这些指南，EA\
  \ 得到实施。对于其他组织，EA 可能只是设计、改进和维护 IT 网络的底层流程，而没有适当的基础设施。\n\n应用区块链、人工智能 AI 和认知计算等创新技术似乎很诱人。但你永远不能低估坚实\
  \ EA 的潜力和力量，因为它可以改变组织。在每个框架中，EA 代表组织可视化、描述和采用的全面方法。它是将基础设施与一系列经过验证的好处相关联的方式之一。\n\
  \n\n\nHere are the benefits of establishing a core EA foundation:\n\n- **Comprehensive\
  \ strategy**\n\nEA can safely be considered a bridge between the business values\
  \ and IT infrastructure of an organization. Providing teams with the direction for\
  \ IT processing and a technical roadmap, EA is an essential strategic tool that\
  \ offers the comprehensive insights that are required for effective communication\
  \ across the board. EA provides the blueprint for delivering concrete products,\
  \ services, processes, and other structural elements.\n\n- **Reduced complexity**\n\
  \nThe purpose of modern advancements, tools, and IT solutions is to make processes\
  \ simpler. EA can be a game-changer when an organization pairs a proactive, results-oriented\
  \ approach with a streamlined workflow. Businesses with data-driven core values\
  \ that are striving for strategic changes are most likely to benefit from this optimal\
  \ setup.\n\n- **Minimized costs**\n\nBudget allocation and accountability are the\
  \ driving forces behind smoothly executed business operations. When costs are poorly\
  \ managed, an EA team’s efforts can go awry in the blink of an eye, and the problems\
  \ they see will just be the tip of the iceberg since worse outcomes are likely to\
  \ follow. A thoughtful EA strategy can be the impetus for more efficient resource\
  \ allocation, which will lead to significant savings. These benefits go beyond resource\
  \ investments that have an impact on stability, profits, and the time to market.\
  \ A streamlined finance structure reduces friction for EA teams and greatly increases\
  \ the likelihood of achieving the desired outcomes.\n\n- **Standardization and flexibility**\n\
  \nEvery stakeholder across the technical, sales, marketing, research, and development\
  \ teams must be aligned on the strategy for EA values to achieve maximum productivity.\
  \ Done well, an EA initiative will ensure this. In addition to creating multiple\
  \ business units that can be managed hassle-free, EA can offer better software support\
  \ and guidance than ever before.\n\nBy harnessing the power of EA, an organization\
  \ can strengthen and streamline its working environment by integrating services\
  \ and applications.\n\n- **Robust security**\n\nEA can be the guiding force behind\
  \ data protection and cybersecurity processes in general. With constantly rising\
  \ security concerns across digital networks, an effective EA blueprint is crucial\
  \ to mounting a robust defense against the burgeoning risks of cybersecurity threats.\
  \ This doesn’t even include the additional security risks that stem from internal\
  \ IT missteps, such as shadow IT and redundant applications. EA, in that area, holds\
  \ the key to protection and ensuring better use of your digital assets.\n\n- **Analytical\
  \ adaptability**\n\nEA empowers teams with quick reaction capabilities, adaptability\
  \ to embrace modern advancements, and greater agility to adapt to sudden shifts\
  \ in the industry. Nothing beats the ability to assess a situation and do away with\
  \ outdated and potentially harmful practices. An organization can use these data-driven\
  \ insights to improve the business model and its strategies. The perks that follow\
  \ include a noticeable decrease in business risks.\n\nThese benefits of establishing\
  \ a core foundation speak volumes about the usability of an EA. For an organization\
  \ juggling innovation, growth, and strategy, EA can act like the glue that holds\
  \ the company’s vision and operations together. That is why consultants who work\
  \ with organizations on their EA development often encourage them to abandon legacy\
  \ systems and establish EA as an ongoing project – success hinges on effective planning\
  \ and implementation over time.\n\nOne such consulting firm, *NetSol Technologies*,\
  \ has worked with companies to accelerate the reinvention of their applications\
  \ and data for a cloud-native world. With the benefit of having experience with\
  \ hundreds of engagements on EA projects, the team has found that the reality of\
  \ effective IT infrastructure is being able to elegantly orchestrate interconnected\
  \ elements within a multi-level organization. Complexities are often associated\
  \ with unpleasant events. Simplicity and adaptability are the names of the game.\n\
  \n## Business dynamics versus IT complexity in businesses and IT systems\n\nSomething\
  \ that the thriving leaders of the digital world must consider is that such systems\
  \ can be complicated to understand but not necessarily bad. On the contrary, they\
  \ have proven to offer a massive turnover. In dynamic and uncertain environments,\
  \ complexity confers critical benefits.\n\nIt’s time to dive deep into the business\
  \ dynamics to reflect on the nature, benefits, and costs of complexity. We will\
  \ offer guidance and insights into the best practices on how to manage complexity\
  \ in a business organization.\n\n### What good does complexity bring?\n\nAs far\
  \ as business circumstances are concerned, complexity can be defined as multiple\
  \ elements, including technological infrastructure, raw materials, products, services,\
  \ and other organizational units. They are interconnected and are codependent and\
  \ equally prone to offering advantages and disadvantages, depending on the way they’re\
  \ managed.\n\nSome notable advantages include an increase in the resilience of the\
  \ business architecture. There is no second thought about the fact that companies\
  \ that adapt to modern technologies and equip their employees with industry best\
  \ practices are in a better position to cater to any unforeseen unpleasant situation.\
  \ Adaptability is the most natural phenomenon when dealing with human matters, including\
  \ business and technology. Shuffling and reshuffling existing elements can ensure\
  \ sustainable learning mechanisms. This approach has helped leading fashion retailers,\
  \ such as *Zara*, create a tailored selection for customers and adapt to ever-evolving\
  \ trends. Closely correlated and interconnected elements ensure effective coordination.\
  \ Shared behavioral protocols and a similar wavelength with which their movement\
  \ is enabled ensure foolproof collective security.\n\nAbove all other benefits,\
  \ inimitability caused by complexity can be an unbeatable element for competitors.\
  \ The challenge of replicating the interrelationship between each element requires\
  \ unmatched skill. The same happened with *Apple* when they tried their luck with\
  \ the Map application. The results were devastating and struggled to gain acceptance\
  \ with consumers.\n\n### The costs of complexity\n\nA phenomenon that offers a plethora\
  \ of benefits to taking your organization to new heights is bound to cost a fortune.\
  \ Creating and maintaining multiple elements is not only complex and beneficial\
  \ but expensive as well, especially compared to other standard approaches that bring\
  \ down a company’s productivity.\n\nThe inability to manage regular operations gets\
  \ difficult with increased complexity, which is rooted in the system’s decreased\
  \ understandability. Things can get hard for the leaders within an organization\
  \ as they will have no clue about where and how to intervene to manage performance\
  \ in case of a system glitch.\n\nWhen combined, the whole situation that’s ingrained\
  \ in complexity can cause extreme uncertainty. The organization works tirelessly\
  \ to set up a system with responses based on predictable behavior. This is taken\
  \ over by unpredictability if it’s not managed effectively and promptly. Catering\
  \ to this situation of uncertainty demands high levels of reliability through strategic\
  \ investment in time and resources.\n\n### Losing sight of business matters\n\n\
  History is loaded with examples that showcase diverse impacts of excessive complexity.\
  \ At top of the list, *Three Mile Island Nuclear Reactor* was the result of a complex\
  \ control panel. The team failed to interpret the crazy alarms and layers of notifications,\
  \ resulting in catastrophic confusion. A fixable rudimentary issue of the stuck\
  \ coolant draining valve turned into something horrific – courtesy of complexity.\n\
  \n### Why complexity gets out of hand\n\nThe ever-so-evolving internet has exposed\
  \ the inflexibility of many technologies and business processes. The inability to\
  \ adapt to new channels comes complimentary with it. This inflexibility is rooted\
  \ in complex systems, where developing and testing new capabilities is time-consuming,\
  \ and every change becomes an expensive adventure. In major banks, the systems are\
  \ often so complex that even the bare minimum operations result in rigidity and\
  \ high expenses.\n\nInefficient and non-value-adding variations of complexity make\
  \ it difficult for the system to maintain the culture of innovation and growth,\
  \ resulting in strategic disadvantages. Implementing a standard centralized digital\
  \ process may sound boring but is the right approach in many cases.\n\nGoing beyond\
  \ anecdotes for dealing with quantifiable results and a larger sample led us to\
  \ two major findings:\n\n- Conventional wisdom may consider agility-borne benefits\
  \ to be contradictory – that is, efficiency at the cost of employee engagement.\
  \ However, our results show otherwise. Smooth and seamless agile transformations\
  \ delivered 30% higher customer satisfaction, employee engagement, and operational\
  \ performance, leading to a turbocharged innovation model. Organizations with a\
  \ successful agile transformation are more likely to be top-quartile performers\
  \ among their counterparts.\n- Management and organization leaders must take charge\
  \ of the operations, rather than sitting back and waiting for this to happen bottom-up.\
  \ Four elements stood out in our logistic regression model when we compared around\
  \ 300 highly successful transformations with the 580 less successful ones to see\
  \ the difference in their course of action. The results of this analysis are the\
  \ secret behind a higher success average of around 75%:\n  - To ensure a trickle-down\
  \ impact, ensure that the team at a higher level within an organization has these\
  \ concepts at their fingertips. They should be in a position to lead by example\
  \ and enable change.\n  - Among all the efforts toward agility, do not forget to\
  \ set clear organizational values and ensure that the top team follows them in a\
  \ structured manner.\n  - There is more to an agile infrastructure than just the\
  \ top team. Focus on building connective tissue among strategy, business process,\
  \ people, and technical aspects.\n  - Slow and sturdy wins the race, but do not\
  \ let the organization exhaust itself with unnecessarily extended processes. Commit\
  \ by picking high-priority areas.\n\nBased on this analysis and findings, organizations\
  \ that improve customer satisfaction and boost operational turnover can rely on\
  \ agile transformation.\n\n\n\n## 通过敏捷转型实现显著的绩效提升\n\n敏捷转型确实拥有诸多益处，但它在现实中发挥作用是否与理论中一样好？有了这个新模式，你将拥有一支具有全新高度积极心态、有效战略和最先进技术的团队。承担风险和投资的范围将随之而来。员工是决策过程不可或缺的一部分并有机会精通其技艺的敏捷工作环境推动创新。\n\
