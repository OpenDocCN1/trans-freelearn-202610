- "## 建立企业架构实践\n\n公司的增长前景成功取决于其数字化转型。为了使自己更具竞争力并与客户保持相关性，尤其是大型公司，必须通过技术变革完成业务转型。虽然技术更熟练的竞争对手夺取市场份额和客户，但他们希望抓住数字增长机会。企业架构师在转型中的作用至关重要，因为他们对整个业务流程有可见性，并了解\
  \ IT 格局如何影响业务成果。\n\n由于业务不断变化，企业需要轻松评估这些变化对 IT 格局的影响，以及它们将如何影响其运营、客户体验和增长能力。对这些问题的概述可以推动转型过程。企业架构师通过维护精简且敏捷的\
  \ IT 格局，确保 IT 能够运行即将到来的业务转型项目。\n\n本章将涵盖以下主题：\n- 企业架构实践与卓越中心\n- 企业架构方法\n- 企业架构实践中的流程和工作流\n\
  - 企业架构的目标\n- 企业架构的好处\n- 企业架构师角色\n- 企业架构工具和软件\n- 具有角色的企业架构实践\n- 具有职责的企业架构实践\n- 设置架构委员会\n\
  - 架构委员会的运作\n- 以企业细分进行表征\n- 架构工具和建模语言\n- IT 与业务利益相关者之间的全面协作\n- 采用企业架构师管理工具的推荐步骤\n\
  - 在组织中启动和演进 **企业架构** (EA) 实践\n- 培养数字技能\n\n## 企业架构实践与卓越中心\n\n通过创建在整个公司中使用的基础设施，企业架构师可以绘制当前的\
  \ IT 环境。在进行应用程序清单时，可以使用多种视角，例如应用程序生命周期、成本、部署、交换流程以及它们如何支持业务。我们通过数据收集和众包流程添加信息到清单中，另外还有角色、流程、位置和供应商。这些步骤的成果是能力地图，通过反映组织的业务能力来帮助填补运营差距。为了进行客观分析，企业架构师使用收集到的数据，包括\
  \ **关键绩效指标 (KPIs)**，例如生命周期、成本、风险、使能技术和供应商依赖性。\n\n此外，他们将通过向利益相关者提供自动问卷来执行主观分析，以确定他们使用的应用程序是否高效、有效并满足其业务需求。企业架构师根据重要性和价值汇总分数并交叉引用\
  \ KPI。优先获取最关键的应用程序至关重要，以确保最重要的资源和投资投入到这些应用程序中。\n\n## 企业架构方法\n\nIT 投资组合可以通过使用技术架构管理进行标准化，从而使企业架构师避免过时。技术会与供应商和生命周期信息（发布日期、终止支持等）一起进行清单，这些信息是从现有的客户管理数据库中获取并清理的。当有多个信息来源时，标准化工具可以简化技术名称。技术生命周期数据库和技术清单也可以从外部库中编译。\n\
  \n之后，他们进行以下程序：\n- 根据开发人员、架构师和风险经理的反馈，选择将作为标准进行评估的技术。\n- 决定是否根据供应商支持应用程序的能力、其业务能力或其供应商依赖性对其进行评级。\n\
  - 在技术的生命周期各个阶段，其状态可以更新：\n  - **构想中**：目前正在评估该技术的潜在应用。\n  - **新兴**：该技术仍在开发中。该技术尚未得到广泛部署。\n\
  \  - **已确认**：组织了解该技术并可完全访问它。\n  - **已淘汰**：已淘汰的技术可能带来风险。一旦对技术进行评估，我们可以确定其是否符合公司的标准，并将其归入以下两类之一：\n\
  \    - **已批准**：符合公司政策并被视为标准的技术\n    - **已许可**：公司批准的技术\n  - **已禁止**：公司禁止的技术。\n\n\
  实现业务目标的第一步是建立明确的目标。在业务团队的支持下，企业架构师可以绘制当前的业务能力并分析它们可能如何变化。这有助于您了解能力未来应如何发展，或者它是否可以解决新的客户细分市场或与业务战略保持一致。业务架构师使用企业路线图和时间表来捕获和衡量当前和未来的业务需求。之后，企业架构师确保未来的\
  \ IT 架构支持业务能力。通过根据当前 IT 环境的地图定义业务能力，他们可以开发新的 IT 架构。当公司发展以应对新挑战时，能力地图可识别所需的 IT 资源。\n\
  \n\n\n成功的数据治理的关键在于定义标准的数据治理流程、分享最佳实践，并在整个业务流程链中记录数据使用情况。企业收集、处理和管理的数据通过企业架构（EAs）变得更加清晰和易于理解。通过企业架构（EA）流程，数据架构师或数据管理员会开发业务术语表和组织的语义表示。可以创建数据字典并对现有数据库进行逻辑建模。在此过程中，顾问从现有来源或数据湖中发现数据，并从中提取元数据以对其进行规范化。然后数据字典能够与业务数据相连接。架构师可以通过自动化数据关联来利用这些信息分析潜在变更的影响，从而实现业务数据血缘。对业务和技术数据保持一致的表示，有助于公司预测并管理持续的市场变化。此外，企业可以通过将企业架构（EA）与**通用数据保护条例\
  \ (GDPR)** 要求整合，例如加州消费者隐私法案，从而提高对以下修订法规的合规性：\n\n- 企业架构（EAs）需要描述个人数据在其应用程序中的处理方式，以便记录\
  \ GDPR 影响。\n- 重用由企业架构（EAs）开发的应用程序，有助于 GDPR 合规官（数据保护办公室）更轻松地记录 GDPR 处理活动。\n- 数据保护官（DPO）可以通过访问业务流程和应用程序来获取有关现有\
  \ GDPR 处理活动的详细信息。这些信息通常以图表、流程图或详细描述的形式呈现。\n\n人们普遍认为企业架构师生活在象牙塔中，与现实脱节，无法证明 EA 产生的业务价值。尽管如此，企业架构师在当今高度颠覆性和敏捷的环境中促进数字化业务转型方面发挥着重要作用。\n\
  \n## 作为业务合作伙伴\n与敏捷团队合作并成为真正的业务合作伙伴的好处在于，业务合作伙伴可以突出趋势并为数字化转型提供有价值的见解。作为业务合作伙伴，企业架构师会提出战略建议。评估新兴技术的潜力、评估业务变更实施对\
  \ IT 系统的影响，以及建立完全定制的生态系统，是他们执行的一些任务。在作为业务合作伙伴的角色中，他们展示了人与人、流程、应用程序和基础设施之间联系所带来的价值。\n\
  \n当今企业架构师的角色包括以下内容：\n\n- 通常，组织在各自为政，缺乏整体视野。它们必须为这些组织带来战略愿景。\n- 参与业务讨论以细化其需求，提供业务能力在未来\
  \ 3 年内应如何演进的示例，或公司是否有能力应对新的客户细分市场。\n- 为更好的 IT 路线图做出贡献，在规划企业未来 IT 投资的同时提高业务有效性和效率。\n\
  \n## 作为技术趋势洞察者\n大力投资新兴技术是公司竞争力的关键指标之一。2017 年，Forrester 在线调查了 105 位国际技术高管。据调查显示，86%\
  \ 的领先企业认为技术是业务战略中最具影响力的因素。当企业试图了解和分析新兴和战略技术的影响时，企业架构师发挥着关键作用。这些领导者以实践的方式，将数字业务平台定义为向现代企业交付价值的一种方式。\n\
  \n趋势洞察者是企业架构师，因为他们能够看到市场趋势以及即将到来技术中的潜在价值。他们主要处理新技术或新兴技术，或可能颠覆市场的技术。通过使用能够使公司领先于竞争对手的技术，他们帮助业务领导者和\
  \ IT 团队做出更好的决策。通过结合 IT 能力和业务战略，企业架构师也成为业务转型的先行者。\n\n## 作为敏捷开发团队的积极成员\n在敏捷环境中，开发进展迅速，而敏捷宣言的第十一条原则赋予敏捷团队设计所需任何架构的权力。在\
  \ SAFe 框架中，这被称为 *涌现式设计*。此外，一些开发团队对组织业务目标、技术标准或正在进行的其他架构项目缺乏了解。使用由开发团队设计的架构可能会导致返工并影响上市时间。\n\
  \n企业架构师作为敏捷团队成员的角色包括以下内容：\n\n- 与开发团队分享有意架构并识别其局限性。然后开发团队可以协助纠正有意架构。\n- 使用 SAFe 框架，通过结合涌现式设计和有意架构创建\
  \ *架构跑道*。随着新史诗的开发，企业架构师不仅必须保持架构最新，还必须支持新史诗。\n\n## 作为影响者和领导者\n组织中最具影响力的领导者之一是企业架构师。作为变革领导者，他们利用企业资产，探索新的业务机会，并利用新兴技术。传统上，EA\
  \ 被视为一个成本中心，只为架构而创建架构，导致大量浪费性支出。为了从被视为喧闹转变为真正具有影响力，企业架构师可以采取多项措施来加速并提升其价值。\n\n所有公司都需要从新的视角来应对数字化转型，吸收过去几年已被证明成功的最佳实践。此外，它将\
  \ EA 优先视为业务转型和创新过程的关键组成部分。为了确保组织数字化转型计划的成功，必须聘用企业架构师。企业架构师分析持续业务变化的影响，以提供业务数字化、IT\
  \ 战略规划、数据治理等方面影响的综合视图。\n\n数字孪生技术和 **人工智能** (AI) 将为企业架构师带来新的挑战，因为两者都预计会加速数字化转型进程。在此背景下，EA\
  \ 模型将通过在业务和应用层级纳入真实数据（通过数据挖掘）而得到增强。通过分析数据，架构师可以识别理论模型与现实世界之间的差距，并确定系统可以改进或失败的最关键领域。为了加速数字化转型，企业架构师发挥着至关重要的作用。这些专家协助决策者实施战略业务规划、采用新兴技术、改善客户体验和保护数据。\n\
  \n要构建数字孪生，您必须从代表单个工作站的工作区开始。工作区包含创建数字孪生所需的所有资源（例如模型和视觉资产）。在工作区内部，您可以创建代表其现实世界系统的数字副本的实体。您还可以指定实体之间的自定义关系，这些关系将形成数字孪生图。然后，您必须连接到各种数据存储中的数据，并为存储的数据添加设备上下文。AWS\
  \ IoT TwinMaker 使您能够在不创建另一个数据存储且无需重新输入已存在于数据存储中的模式信息的情况下轻松整合这些数据。为了为数据存储中存在的数据提供上下文，您可以将实体与这些多样化数据存储的内置连接器关联，例如\
  \ AWS IoT SiteWise 中的时序传感器数据、Amazon Kinesis Video Streams 中的视频数据以及 Amazon S3 中的文档数据。\n\
  \n## 企业架构实践中的流程和工作流\n企业架构师的实践是对企业战略进行分析、设计、规划和实施，以促进业务成功。利用架构原则和实践，企业架构师帮助公司构建其\
  \ IT 项目和政策，以实现业务成果并跟上市场趋势。此过程也被称为企业架构规划。根据\n\n**企业架构知识体系（EABOK）。** 在 1980 年代，当第一台计算机引入工作场所时，EA\
  \ 框架应运而生，以应对业务技术增加。技术迅速发展，企业意识到需要长期战略来支持这种增长。\n\n现代 EA 战略涵盖整个组织，而不仅仅是 IT，以确保业务与数字化转型战略和技术增长保持一致。对于拥有遗留流程和应用的企业而言，实施数字化转型项目如\
  \ EA 尤其有益，因为它能无缝融合它们。\n\n## 企业架构的目标\n\n业务需求指导组织的 EA。在其他方面，它们决定了组织内部信息、业务和技术的流动方式。云计算、物联网、**机器学习**（ML）以及这些等其他新兴趋势已成为企业为保持最新技术领先而优先考虑的事项。\n\
  \n根据 EABOK，通过结合人员、数据和技术，可以获得对 IT 组织内部相互关系的全面理解。从所有者、设计者和建设者的角度来看，该过程对整个企业进行全面审视。该框架不依赖正式文档；相反，它旨在从整体角度提供企业视图。\n\
  \nEA 战略必须考虑到业务流程、组织结构、信息系统和技术方面的最新发展。还将涵盖标准语言和最佳实践，以及如何在组织的各个部分集成或消除流程。业务信息应可靠、及时且尽可能高效。\n\
  \n## 企业架构的优势\n\n在重新设计和重组活动，尤其是在并购中，EA 可以提供帮助。此外，流程的标准化和整合促进了组织内部的更多一致性。根据 CompTIA，EA\
  \ 最重要的优势如下：\n\n- 使 IT 和业务部门能够更轻松地协作\n- 使企业投资更轻松\n- 通过评估现有架构促进长期评估目标\n- 建立评估和采购技术的流程\n\
  - 通过为所有业务部门提供全面视图，提高对 IT 架构的理解程度\n- 建立基准以便与其他组织或行业标准进行比较\n\nEA 的结果是减少错误、系统故障和安全漏洞，以及\
  \ IT 管理。技术还可以使 IT 对其他业务部门更易访问，或使企业能够驾驭复杂的 IT 结构。\n\n## 企业架构师角色\n\n公司架构师通常向 **首席信息官（CIO）**\
  \ 或其他 IT 管理员汇报。业务分析师的工作是评估业务结构和流程与公司目标的一致性。企业架构师还必须确保结构和流程具有敏捷性和稳健性，以便能够快速适应变化并承受重大中断。\n\
  \n根据 PayScale 的数据，该职位的平均年薪为 128,600 美元，年薪范围为 93,000 美元至 190,000 美元。CTO、开发人员、软件工程总监和\
  \ CIO 通常来自企业架构师。企业架构师至少需要在 IT 或相关领域拥有 10 年经验，以及计算机科学、信息技术或相关领域的本科学位。PayScale 报告称，IT\
  \ 企业架构师需要以下硬技能：\n\n- **面向服务架构（SOA）**\n- 企业应用集成\n- 云计算\n- 软件和系统架构\n- 企业解决方案\n- 战略制定\n\
  - IT 和项目管理\n\n此外，你需要彻底了解计算机系统、硬盘、主机和其他架构技术。沟通、团队合作、解决问题、批判性思维和领导力都是企业架构师需要具备的软技能。\n\
  \n## 企业架构工具和软件\n\n规划 EA 时，你主要会使用 Excel 和 PowerPoint。基于 Gartner 同行评议，目前市场上可用的几种流行选项如下：\n\
  \n- Orbus Software\n- Sparx Systems\n- Software AG\n- Avolution\n- Mega\n- Erwin\n\
  - BiZZdesign\n- Planview\n- BOC Group\n\n然而，还有另一套工具和软件套件可以帮助企业开发先进的 EA 战略。\n\n##\
  \ 具有角色的企业架构实践\n\n在架构中，架构制品是描述企业、系统或解决方案状态的文档。系统 *环境* 是决定对系统产生影响的所有外部影响的因素。可能影响系统的环境因素包括开发、技术、经济、法律、政府、生态和社会因素。一个\
  \ *系统*，然而，指的是一组相互连接的组件，执行一个或多个预定功能。\n\n架构师将架构定义为系统的基本概念或特征。架构描述是用于传达架构信息的工作产品；它们由视图和模型组成，共同描述架构。*利益相关者*\
  \ 另一方面，由对给定系统感兴趣的个人、团队或组织组成。\n\n术语 *关注点* 指一个或多个对系统感兴趣的利益相关者。系统的开发、运行或功能中的任何方面，包括性能、可靠性、安全、分布和可演进性，都可能被视为关注点或其可接受性的决定因素。采用\
  \ *系统架构视图* 就像从特定关注点集合的角度表示系统。系统架构模型表示系统是什么样的。*架构模型* 表示感兴趣的主题。作为主题的简化表示，模型以更小规模呈现主题内容。\n\
  \n架构师在捕获或表示系统架构设计时可能会创建一个或多个架构模型。因此，架构视图将由一个或多个模型的要素组成，以这种方式选择，以证明一个或多个利益相关者的关注点在系统架构设计中得到适当解决。一般来说，架构视图是架构规范，用于实现架构视图的约定。这种架构视图可以称为定义或模式。为了解决\
  \ *关注系统* 的特定关注点（或关注点集合），它建立了构建、解释和使用架构视图的约定。\n\n*模型种类* 建立一种建模约定。模型可以通过架构观点查看；架构视图可能包含多个模型。架构存储库的参考库部分包含架构观点规范的集合：\n\
  \n- 观点决定你看到什么，从什么视角或角度\n- 架构视图始终特定于其所描绘的架构，可以存储在库中以便重复使用；观点是通用的，可以存储在库中以便重复使用\n\
  - 它至少隐式地由与每个架构视图关联的架构观点描述\n\n请注意 *关注点* 和 *需求* 并非同义词。它们描述不同的事物。一些利益相关者可能对系统可靠性有关注/兴趣。架构观点应与关注点相关联，以确保这些关注点以某种方式被架构模型解决。例如，仅选择结构架构观点的架构师几乎肯定没有考虑可靠性问题，因为结构模型无法表示这些问题。在该关注点内可能存在许多不同的利益相关者需求；不同用户类别对系统能力可能有不同的需求。\n\
  \n监督战略实施的架构委员会对于成功的架构治理战略至关重要。通常，该小组由负责审查和维护整体架构的高管以及所有关键利益相关者的代表组成。大多数大型组织的架构委员会由至少两层深度的代表组成——即本地（领域专家线路责任）和全球（组织范围责任）。在这种情况下，将成立一个委员会，具有可识别且明确的职责：\n\
  \n- 决策责任和能力\n- 权限和职权的限制\n\n## 具有职责的企业架构实践\n\n以下目标通常委托给架构委员会：\n\n- 为所有架构相关决策建立基础\n\
  - 在子架构之间保持一致性\n- 设定组件重用的目标\n- 创建灵活的 EA 以利用新技术并满足不断变化的业务需求\n- 确保架构合规性得到执行\n\n\n\n\
  - 启动组织内架构学科成熟度水平的提升\n- 确保基于架构的开发得到实施\n- 提高超出权限决策的升级能力的可见性\n\n下列职责应从运营角度加以处理：\n\n\
  - 监控和控制架构契约的各个方面\n- 定期召开会议\n- 以有效且一致的方式管理和实施架构\n- 解决升级的歧义、问题或争议\n- 提供信息、建议和指导\n\
  - 实施技术战略和目标，确保符合架构，并在必要时授予豁免\n- 考虑为类似豁免（如新服务类型）而请求并批准的政策变更\n- 与架构契约实施团队协作，在受控条件下发布所有与实施相关的信息并使其可供授权方使用\n\
  - 核实报告的服务水平和成本节约\n\n此外，从治理角度来看，架构委员会负责以下事项：\n\n- 开发可用的治理材料和活动\n- 通过共识建立架构的接受和批准的正式体系，并授权发布架构\n\
  - 通过提供基本控制机制确保架构的有效实施\n- 实施企业架构（EA）并将其与业务战略目标相联系，基于其中体现的架构战略和目标\n- 可能需要豁免或政策更新以重新调整架构和规划活动\n\
  \n在详细说明需求的过程中，关注点是起点。需求代表架构中的关注点。最好拥有 SMART 需求（即具体的度量指标）。\n\n## 设置架构委员会\n\nCIO（或其他高级主管）在大多数公司中通常是初始架构工作的执行赞助人。然而，在争取企业支持方面，赞助机构的影响力更大。在此，架构委员会是赞助机构，但名称并不重要。战略架构及其所有子架构均由该高管层级小组进行审查和维护。\n\
  \n## 触发因素\n\n通常，架构委员会是针对以下一项或多项情况而设立的：\n\n- 新任 CIO\n- 收购或合并\n- 考虑切换到更先进的计算形式\n-\
  \ 认识到 IT 与业务缺乏一致性\n- 将技术作为实现竞争优势的手段\n- 企业架构（EA）计划的实施\n- 快速增长或重大的业务变化\n- 复杂解决方案的跨职能需求\n\
  \n在企业内部，架构委员会赞助架构，但架构委员会本身需要在公司最高层级拥有执行赞助人。架构项目必须在规划过程中并通过维护得到承诺。在一些公司中，由于缺乏高管参与和鼓励，架构规划会失败。\n\
  \n在许多情况下，公司董事会被忽视为架构委员会成员的潜在来源。此类人员通常对企业的运营和竞争对手有深入了解。他们在验证 IT 战略与业务目标的一致性方面发挥着重要作用，因为他们影响着业务愿景和目标。\n\
  \n## 架构委员会规模\n\n我们建议架构委员会包括四至五名常任成员（最多十名）。架构委员会可以在一段时间内轮换其成员，将决策权和职责从一名高级经理转移到另一名，以保持架构委员会规模合理。一些架构委员会成员可能会发现时间限制妨碍他们长期积极参与。\n\
  \n然而，架构委员会必须保持连续性，以防止企业架构从一个想法偏离到下一个想法。可以通过为每位成员设定任期并使任期在不同时间到期来确保轮换。在初始工作之后，在持续的架构工作中，架构委员会可能需要重新授权。如果需要，执行赞助人在审查架构委员会的工作后会更新或更改架构合规审查流程。\n\
  \n## 委员会结构\n\nTOGAF 架构治理框架提供的通用组织框架将架构委员会置于更广泛的企业治理结构中。除识别主要组织团体和职责外，它还概述了它们之间的关系。根据组织的架构和形式，可能需要对该模型进行调整。\n\
  \n考虑组织的规模和形式以及 IT 功能的实施至关重要。通过考虑整体治理环境，您可以为设计架构委员会结构奠定基础。一个需要考虑的重要概念是全球所有权和本地实施，以及来自各个领域的最新技术和概念的整合。\n\
  \n作为一个组织，架构委员会应根据其结构进行构建。可能需要比 TOGAF 架构治理框架概述的更复杂的架构治理结构。组织需要建立一个 IT 治理流程，将现有的企业结构和能力结合起来。它通常包括全球治理委员会、本地治理委员会、设计授权机构和工作组。\n\
  \n## 架构委员会运作\n\n在本节中，我们将主要从治理角度描述架构委员会。\n\n## 总则\n\n有关架构委员会的会议需要有明确的目标、主题和行动。**信息和相关技术控制目标（COBIT）**框架为例，解释了董事会会议的最佳实践。在这些会议期间，将就以下事项做出关键决策：\n\
  \n- 制作高质量的治理材料和活动\n- 通过共识和授权提供正式的接受机制\n- 实施确保架构成功实施的控制机制\n- 将架构实施与组织战略和目标（业务和 IT）相联系并保持这种联系\n\
  - 如果偏离合同，可能需要豁免或政策更新以重新与合同保持一致\n\n此外，有关架构委员会的会议议程包含明确定义的主题和所需行动。\n\n## 准备\n\n每位参与者应熟悉议程内容和所有支持文件，例如豁免请求、绩效管理报告等。被分配行动的个人负责报告这些行动的进展情况。每位个人必须确认其出席架构委员会会议的情况和可用性。\n\
  \n## 议程\n\n本节概述了架构委员会会议的议程。议程上的项目均根据其内容进行描述。\n\n## 上次会议纪要\n\n架构委员会上次会议的会议纪要是标准组织程序，提供有关过去会议的详细信息。\n\
  \n## 变更请求\n\n此标题下的变更请求通常与架构和原则修订有关。业务控制还可能包括阻止向高级会员发送语音流量，例如天气报告，以及控制对某些网站的访问。架构契约定义了可以请求变更的权限级别和参数。\n\
  \n## 豁免\n\n作为请求对现有合同、原则和结构进行变更的机制，使用豁免。该机构还可能在正常运营参数之外运作，例如将子公司排除在服务提供之外、因特殊业务原因请求不寻常的服务水平，或部署非标准技术或产品以支持特定的业务举措。\n\
  \n豁免是授予一定期限的，并且必须符合某些运营标准和一组已识别的服务。豁免不是无限期授予的，而是确保服务水平得到满足的替代方式，同时允许在实施和付款时间上具有灵活性。由于其有时限性，有时限的豁免将触发架构合规性。\n\
  \n\n\n## 合规性评估\n\n组织根据 **服务等级协议 (SLAs)**、**运营等级协议 (OLAs)** 以及所需的架构更新来评估合规性。根据 TOGAF\
  \ 架构治理框架中规定的标准，评估结果将被接受或拒绝。评估报告将包含有关架构的详细信息。\n\n## 纠纷解决\n\n在架构合规性评估和豁免中，未能通过架构合规性和豁免流程解决的纠纷将被记录在案。\n\
  \n## 架构战略和方向文档\n\n只有全球架构委员会才会制定架构战略、方向和优先级。应编制标准架构文档。\n\n## 指派的行动\n\n本报告提供了在之前的架构委员会会议上指派的行动概述。在架构委员会会议期间，行动会被分配到跟踪器中，用于跟踪其状态并记录其进展情况：\n\
  \n- 参考\n- 优先级\n- 行动描述\n- 行动负责人\n- 行动详情\n- 提出日期\n- 到期日期\n- 状态\n- 类型\n- 解决日期\n\n##\
  \ 合同文档管理\n\n架构文档在此正式接受，以便后续发布、更新和更改。\n\n## 其他事项 (AOB)\n\n这包括超出上述任何阶段的问题。无论是否包含在议程中，都应在会议开始时提出。管理支持文档是架构治理的责任。\n\
  \n## 安排会议\n\n所有会议的日期应详细公布。企业架构师是一位有远见者、教练、团队领导、技术与业务之间的联络人，以及其领域的专家。\n\n## 企业架构师职位描述\n\
  \n实现完整的架构要求架构师充分回应其利益相关者的所有相关关切。他们必须确保所有观点都相互关联，调和关键利益相关者之间相互冲突的利益，并说明为此做出的权衡。企业架构师角色的关键组成部分是决定开发哪些架构视图。必须将选择限制在实际因素以及适用性原则上。作为企业架构师，你的角色更类似于城市规划师，而非建筑师。与其将企业架构师的工作定义为设计良好的建筑物或建筑物集合，不如更恰当地将其描述为规划社区。\n\
  \n企业架构师并不创建企业的技术愿景，而是与企业高管协商制定并阐明技术愿景，并制定实现该愿景的战略。业务计划始终与此计划相连，设计决策也遵循业务计划。这确保了设计决策不会因战术上的便利而被规避，因为企业架构师的战略计划与企业架构治理流程相连。\n\
  \n对于实施团队和应用开发团队，企业架构师记录设计决策。\n\n在整个过程中，架构师协助客户理解其需求与想要的内容之间的区别，并将这些需求转化为经过验证能够满足其要求的\
  \ capabilities。此外，架构师可能会向每个客户展示不同的模型，演示如何满足这些需求，从而使其在咨询销售过程中不可或缺。架构师不能是建造者，他们必须保持足够的抽象性，以免妨碍实施。\n\
  \n因此，架构师的角色可概括如下：\n\n- **理解并解释需求**\n\n这涉及信息收集、倾听、影响、共识建立、将想法综合成可执行的 需求、向他人传达这些想法、识别用途或目的、约束、风险等。除了发现并记录驱动解决方案的客户业务场景外，架构师还参与解决方案的概念设计过程。\n\
  \n## 创建有用的模型\n\n这涉及根据需求制定解决方案的有效模型，根据需要增强模型以应对所有情况，并通过模型以多种方式传达想法。\n\n在架构方面，架构师负责维护产品的愿景并保持架构完整性。此外，架构师确保识别出利用机会，并通过作为职能组之间的联络人利用构建块来实现这些机会。架构师构建和维护这些模型，以指导组织内部或外部的工作并理解开发工作的领域。架构师必须了解所有业务组件以代表组织的架构。\n\
  \n## 验证、完善和扩展模型\n\n模型应根据需要使用主题专家进行修订和进一步定义，以提高灵活性并确保其紧密基于当前和预期需求。架构师还应考虑现场工作产生的任何改进的价值，并在适当时将其纳入架构模型。\n\
  \n## 管理架构\n\n模型应定期更新以显示必要的更改、增添和修改。它们必须协助讨论和决定项目的架构。架构师代表变革作为实施架构的代理。通过这一过程，架构师确保客户、架构和组织间技术方面的信息得到持续共享。\n\
  \n## 以企业分段为特征的表征\n\n在某些情况下，由于解决方案的复杂性，可能需要额外的架构师来支持架构工作。所有类别的架构师也执行前面概述的任务。企业架构师、企业解决方案架构师和解决方案架构师团队可以共同完成任务。根据开发过程的阶段，每个成员可能有特定的关注点，如果没有特定的角色和职责。如果认为有必要组建架构团队，则必须指定一名首席企业架构师来管理和领导团队，具体如下：\n\
  \n- 企业架构师负责将架构设计和文档应用于技术和景观参考模型。在大多数情况下，企业架构师领导由细分架构师和/或解决方案架构师组成的团队来实施特定项目。企业架构师的重点是所需的企业级业务功能。\n\
  - 细分架构师记录并设计组织的具体业务问题。他们将详细的 技术解决方案与整体架构景观相结合，依赖于所有其他架构师的输出。细分架构师负责在多个领域（包括财务、人力资源和销售）范围内界定企业级业务解决方案。\n\
  - 解决方案架构师负责在各个层面（如管理、安全）设计和记录系统。通过为企业/细分架构师屏蔽系统、技术和产品的不必要细节，解决方案架构师可能会使企业/细分架构师受益。解决方案架构师处理系统技术。例如，企业数据仓库解决方案的组件就属于此关注范围。\n\
  \n## 制作设计所需的技能和经验\n\n设计复杂系统需要企业架构师的技能。除发现和分析需求外，还涉及识别和评估解决方案替代方案、选择技术和配置设计。\n\n\
  ## 在一个或多个学科中具有广泛的技术广度和技术深度\n\n拥有 IT 行业经验是企业架构师的重要资格。此外，团队将能够开发和部署应用程序，以及为复杂的应用环境设计和维护基础设施。在当今的\
  \ IT 环境中，异构性是常态，这意味着经验丰富的企业架构师必须能够在多个平台上工作，从传统的 mainframe 到分布式系统。在职业生涯结束时，企业架构师将在至少一个领域拥有专业知识，被认为是该领域的主题专家。\n\
  \n## 以方法驱动的执行方式\n\nTOGAF 架构开发方法 (ADM) 是企业架构师使用的最受认可的设计方法之一。企业架构师应了解不止一种设计方法，并应能够准确地将这些方法的一部分适应他们所处的环境。企业架构师在创建设计工作时反复使用不止一种设计方法来证明这一点。要熟练使用方法论，你必须知道在特定情况下使用方法中的哪些部分以及不使用哪些部分。\n\
  \n## 完整项目范围经验\n\n企业架构师的角色是设计项目并将其移交给实施团队，但拥有开发、测试、实施和支持项目所有阶段的经验至关重要。企业架构师将从这种经验范围中受益，因为它将帮助他们使用实用且切合实际的系统实施概念。作为企业架构师，拥有完整项目范围的经验应导致更好的设计决策，并最终就权衡做出更明智的决策。\n\
  \n\n\n## 领导力\n\n要使企业架构师取得成功，沟通和团队合作至关重要。要在这个岗位上取得成功，你需要具备良好的技术技能和领导素质。IT管理层和客户应将企业架构师视为企业中的领导者。\n\
  \n## 个人和专业技能\n\n沟通和人际关系技能对企业架构师至关重要。企业架构师负责向项目的各利益相关者传达复杂的 technical 信息，包括那些没有技术培训的人员。该角色还要求出色的沟通和谈判技能。为了使项目保持正轨，企业架构师必须与项目经理密切合作以做出及时决策。\n\
  \n## 一个或多个行业的技能和经验\n\n如果企业架构师具备行业专业知识，就能更轻松、更有效地收集需求。优秀的企业架构师应了解公司业务流程如何与同行业同行的流程相互作用。除了发现关键趋势和识别有缺陷的流程外，他们还应能够为IT部门提供引领企业而不仅仅是响应请求的能力。业务架构师的角色是成为战略技术领导者。\n\
  \n## 架构工具和建模语言\n\n面向帮助组织在未来蓬勃发展的企业架构工具旨在帮助他们取得成功。以下企业架构工具功能将在为团队和公司选择最佳解决方案时帮助您的业务目标与IT保持一致。\n\
  \n## 快速实现价值\n\n**企业资产管理 (EAM)** 工具的采用速度以及其为组织创造价值的速度决定了EA战略的成功。使用传统工具时，组织需要等待3到6个月才能看到成果，并且需要对其进行大量定制。尽管现代EAM软件更直观、结果更快，但仍存在学习曲线。以下几项EAM工具的功能使其与传统产品区别开来：\n\
  \n- 在当今的EAM世界中，即开即用且准备就绪的产品提供基于行业最佳实践的强大数据模型，并且易于理解。\n- 直观的用户界面几乎不需要培训和定制，非常适合在组织孤岛之间推广产品。\n\
  - 成本基于存储在存储库中的应用程序数量，而非使用该服务的人数。多用户访问和跨机构协作是这一概念的优势。\n\n最佳实践和灵活的数据模型使其能够在无需大量初始配置的情况下轻松配置。此外，模型可以在过程中进行调整，使其能够及早获得有价值的见解。\n\
  \n## IT与业务利益相关者之间的全面协作\n\n传统EAM工具通常需要IT背景，因此对于没有计算机科学学位的人来说难以触及。然而，现代EAM工具面向各种用户设计，具有直观的界面，并让任何人都能理解数据模型。此外，这意味着企业架构师不会被孤立在象牙塔中，而是参与所有业务职能的日常活动。通过使现代EAM工具更易于使用，更广泛的用户可以访问它们，从而增加数据多样性。\n\
  \n以下是最重要的特征：\n\n- 将应用程序所有者和主题专家用作众包EA资源\n- 通过统一语言优化IT对业务成果的影响\n- 通过为个人利益相关者定制显示的信息，提供与业务需求相关的信息易于访问\n\
  \n然而，公司在EA工作中面临某些挑战。最大的挑战之一是最初定位并收集有意义的数据，并找到一种保持其最新状态的方法。\n\n## 自动化数据发现和报告生成\n\n\
  自动化同步和无缝集成已内置于EAM工具中。低代码集成能力使它们能够无缝集成到现代IT4IT生态系统中。由于SaaS应用程序和供应商的爆炸性增长，企业，特别是其IT部门依赖自动化的软件即服务（SaaS）发现以确保对所有应用程序的完全可见性，这一点毫不奇怪。为了优化使用、保持适当的授权、消除浪费并控制云成本，这种透明度至关重要。\n\
  \n此外，许多EAM供应商提供一个市场，在那里技术合作伙伴和用户可以交换定制报告。EAM工具在自动化和集成方面提供三个不同的优势，如下所示：\n\n- 低代码且无缝集成到IT4IT生态系统中的API集成\n\
  - 自动发现SaaS、**平台即服务 (PaaS)** 和 **基础设施即服务 (IaaS)**\n- 通过在线生态系统，EAM实现自动报告和图表\n\n##\
  \ 企业IT与产品IT的集成平台\n\n现代EAM工具构建了与其他产品的互补链接，使其作为集成平台运行并有助于在动态工作环境中提高可见性。因此，EAM工具不依赖于传统的EA系统，但与SaaS和价值流管理解决方案兼容；它们通过融合满足企业IT和产品IT的需求。\n\
  \nEAM工具可以在每个工具中以不同的方式查看，以帮助组织预测、规划和执行能够为公司带来竞争优势的转型计划。以下是EAM工具的三个最终特征：\n\n- 对IT架构当前状态的理解以及规划期望未来状态的能力\n\
  - 跨职能协作和重新利用IT资产\n- 灵活性以跟上新技术并保持控制\n\n## 采用企业资产管理工具的推荐步骤\n\n确保EA工具和EAM工具总体上成功集成并获得最大收益需要采取各种步骤。在此，我们概述了五项步骤，您和您的团队应在采用EA之前、期间和之后遵循：\n\
  \n- 1. **了解EAM工具的优势：** 除了减少云支出和敏感数据的潜在安全风险外，EAM工具还可以帮助查找并消除未管理的IT应用程序。一旦了解现代EAM工具提供的优势，您就可以找到适合EA战略的正确解决方案。\n\
  - 2. **根据您的EA计划选择EAM工具：** 您需要确保您选择的EAM工具有助于实现您的IT和业务目标。应用程序组合管理计划、技术风险管理计划或业务转型计划可能是这些工作的一部分。\n\
  - 3. **评估利益相关者的需求：** 您应评估EA如何弥合利益相关者之间的知识差距，因为您不想创建另一个IT孤岛。该工具旨在改进工作流程并促进跨部门协作。利益相关者应能够访问数据和独立分析。此外，质量保证机制将使数据更准确。\n\
  - 4. **审查潜在EAM工具的数据模型：** 您应检查潜在EAM工具的数据模型。将其调整以适应您当前的术语和属性并分配授权角色应很简单。\n- 5. **根据目标衡量入职流程：**\
  \ 在选择满足当前以及可预见需求的EAM解决方案后，可以开始入职。为了取得进展，请设定目标并在过程中衡量您的进展。\n\n此外，您可以使用这些工具通过所需方法衡量入职成功情况，并通过数据映射、导入、工作区审查和KPI跟踪进展。\n\
  \n## 在组织中启动和演进EA实践\n\n为了管理不断变化的复杂性并使组织朝着单一目标对齐，EA被广泛用作规划和治理技术。\n\n## EA面向企业，而不仅仅是架构师\n\
  \n说服业务领导者EA具有价值时，并没有大秘密。展示利益相关者决策如何受到数据可用性和质量提高的影响。在规划EA能力时，请考虑利益相关者的问题。\n\n## 从实际业务问题开始\n\
  \n传统EA有声誉太昂贵和技术性太强，导致普遍认为它阻碍业务增长。您的EA计划必须解决业务挑战才能成功。我们必须考虑如何以业务绩效为框架来阐述EA的价值。\n\n\
  ## 基于数据而非观点做出决策\n\n除了只有少数人能理解的传统复杂工具外，EA仍然依赖只有少数人能解读的传统工具。确保您的数据准确，然后确定哪些指标最重要，并开发数据可视化以帮助利益相关者理解它。\n\
  \n## 治理很重要，协作更好\n\n开放数据鼓励利益相关者之间的协作和对齐。由于开放数据，回顾性治理也可以减少。为了实现我们的EA战略目标，我们必须解决利益相关者参与的问题。\n\
  \n\n\n## 将数据转化为洞察再转化为行动\n\n数据洞察发挥着重要作用，但行动更为关键。你可以通过基于 EA 数据构建指标来理清分散的信息。因此可以做出明智的商业决策。要向前推进，需要回答这样一个问题：是否可以使用现有工具创建组织的数字孪生，或者需要考虑其他选项。\n\
