- '# 第 1 部分 – 企业架构基础与实施

  在本第一部分中，您将了解 **企业架构**（EA）的关键核心基础组件以及如何将其与 AWS 云相关联。本书的这一部分将帮助您通过构建正确的核心基础，将 EA 架构原则和域应用于
  AWS 云。


  如果您需要了解 EA 核心基础的基本概念或希望了解其重要性，关于核心基础的前三章将帮助您做出决策并实现业务价值。通过此，您将学习如何实现业务敏捷性。您将更好地解释架构的构建模块，以推导出由架构和解决方案构建模块共同驱动的解决方案。


  EA 基础和实施帮助您实现运营效率并帮助您定义核心基础的成功。


  组织通常难以跟上不断发展的技术。因此，创新和增长过程会放缓。向前发展的途径是通过实施 EA，使组织在业务流程中导航以实现期望的业务成果。因此，现在比以往任何时候都更需要一个结构良好且经过深思熟虑的业务敏捷模型。


  到这些章节结束时，您将能够通过构建核心基础来执行 EA 策略。您将更能够处理系统内持续进步带来的不断适应需求。此外，了解执行策略的核心基础背景也很有帮助。




  您将更深入了解企业架构领导力原则中的业务动态，以及如何建立正确的核心基础。


  本书的这一部分包含以下章节：


  -   *第1章，企业IT架构构建的核心基础*

  -   *第2章，定义核心基础以及如何正确实现*

  -   *第3章，将企业架构应用于AWS云*

  '
- "## 构建企业IT架构的核心基础\n\n许多旨在创建和维护理想的数字工作环境并实现顺畅无缝工作流程的努力都付诸东流。即使利益相关者同样参与其中，各部门行动保持一致，财务得到高效管理，研究团队也在关注行业最新趋势，除非执行工作得到成熟的企业架构（EA）支持。成熟的IT\
  \ EA通常基于坚实的基础，战略对齐，并根据业务需求量身定制。\n\n本章将介绍有助于建立有效执行基础的领域。因此，我们将涵盖以下主题：\n\n-   EA战略始于构建核心基础\n\
  -   执行战略的核心基础\n-   构建业务特定的核心基础\n-   EA域\n-   业务动态与企业和IT系统中的IT复杂性\n\n### EA战略始于构建核心基础\n\
  \nEA战略是将企业的愿景和战略转化为有效企业变革的过程，通过创建、传达和改进描述企业未来状态并使其能够演进的关键需求、原则和模型来实现。如果将EA与其战略进行比较，我们可以将EA识别为一种主动且整体地领导企业应对颠覆性力量的学科。它通过识别和分析向期望的业务愿景和成果推进的变革执行来实现这一点。\n\
  \n我们生活在一个数字化世界，一切都被自动化。拥有最新IT基础设施的需求比以往任何时候都更关键。现代生活的每个方面都以某种方式直接或间接地与技术的使用相关。为了让技术平稳运行，能够可靠地执行核心运营是首要任务。\n\
  \n业务架构从根本上讲是关于配置IT资源以支持公司的业务战略。它将某些方面结合起来，例如公司的战略目标、工作流程以及其创建的信息，以及支撑它的基础设施。作为其技术蓝图的一部分，EA不仅确定其当前拥有的技术，还确定未来技术升级如何用于补充或增强其当前技术。\n\
  \nEA帮助公司构建IT项目和政策以实现预期成果。它采用架构原则来跟上行业实践，通常称为EA规划。\n\n然而，除了为系统提供战略和业务背景外，EA战略还提供了一种更整体地审视它们的方法。它被描述为一种管理流程，有助于企业进行组织、资源分配和实施。组织以多种方式受益于EA战略。它允许他们全面审查其IT状况和IT目标：\n\
  \n-   通过标准化流程和应用程序，稳定性得到改善。简化流程使企业更高效并降低问题风险。\n-   正如组织期望EA所做的那样，它降低了系统的复杂性。合适的工具简化了系统管理和维护。\n\
  -   通过能够快速识别问题原因，组织得以防止更大问题。\n-   组织得益于EA而更具敏捷性。这使他们能够分析行业变化并及时做出响应。\n-   留意系统中的薄弱环节可以防止威胁进入系统。今天的网络安全漏洞正通过EA确定的系统化措施来解决。\n\
  \n在当今竞争激烈的市场中，创新主导着一切，尤其是在应用技术来现代化流程、产品和服务方面，创新机会几乎无穷无尽。戴尔、Capital One和沃尔玛等全球市场领导者已在巨大规模上主导了其行业。虽然这一发展对全球经济似乎令人鼓舞，但其他增长速度相对较慢的公司必须重新考虑其行动计划。\n\
  \n在对103家美国和欧洲公司的调查中，34%的公司拥有数字化的核心基础设施，并利用现代技术实现更高利润、更快的上市时间和更好的IT投资回报率。这样的核心基础设施最终带来25%的运营成本降低、更好的客户体验、系统故障和数据丢失风险降低，以及利益相关者对技术进步的更高满意度。\n\
  \n本章基于500家美国、欧洲和亚洲公司为有效执行基础而应用的统计数据、工具、战略和基本原则的见解。这些要素为大型、中型和小型企业提供了正确的基底，通过数字化使其运营走上正轨。我们将深入探讨他们的战略，并学习他们如何利用其执行基础来实现业务敏捷性，从而带来显著增长。\n\
  \n在未来几年中，从上到下自动化组织中的例行任务是前进的方式。这意味着最大程度地减少甚至消除人类在重复性手工工作中的参与，例如食品加工、供应和交付运营、发票生成和支付处理。构建有效的执行核心基础需要能够处理这种自动化和数字化的工作流程且不会出现任何错误的机会的基础设施。保持可靠网络和例行操作可预测性的组织使其与竞争对手区别开来。\n\
  \n我们喜欢信息触手可及，只需点击即可执行。鉴于此，食品加工行业需要在从客户订单到发货、维护库存以及交付产品和服务的整个过程中实现信息透明流动。\n\n7-ELEVEN日本是全球第八大零售商。在攀登成功的阶梯过程中，该公司团队利用其1万家商店的执行基础来有效管理所有库存。该公司使用7万台计算机在销售点收集数据的数字化流程使用户能够在线下单并与制造商直接有效沟通。这种自动化和集中的经营方式使公司每年都能开发新产品。\n\
  \n关于核心业务运营数字化的一个常见误解是组织必须将精力集中在竞争能力上。然而，成功在于战略，在那里，日常的平凡流程与复杂任务相结合。这从招聘、投资和电信等常见服务开始数字化进程，然后转向更定制的组件。拥有员工每天使用的系统顺畅无缝的工作流程，管理层可以自由地放弃低价值任务，专注于收入、创新和增长。\n\
  \n### 核心基础的要素\n\n无论目标是云计算、**机器人流程自动化（RPA）**还是**机器学习（ML）**，组织必须不断评估新技术以及它们可以或应该如何融入其业务战略。持续创新需要设计良好且有文档记录的EA，并有明确的流程来实现期望的业务成果。按定义，设计良好的EA是一种架构模型，以长期视角描绘整个组织的全局图景。该蓝图解释了业务流程、层级结构、信息系统和技术。它还允许采用现代创新。让我们来看看：\n\
  \n-   **架构管理**\n  设置和实施单一模型是一回事，而确保全方位的生产力是另一回事。团队必须跟踪组织内的每一步，以确保业务目标与IT基础设施保持一致。\n\
  -   **架构框架**\n  该框架为架构模型提供基础，同时提供基本指南和原则。这些实践在该框架下为所有利益相关者定义，以便他们能够将其工作伦理与系统保持一致。\n\
  -   **开发方法论的实施**\n  有方法可以在全方位顺利实施方法论，同时确保关键业务运营不受干扰。然而，确保无缝且有效的实施可能需要比预期更长的时间。\n\
  -   **有效治理**\n  这确保EA计划得到妥善管理，以产生真正代表组织目标和需求的工件和计划。EA治理还确保从启动到实施，业务和技术决策与EA保持一致。\n\
  -   **文档工件**\n  业务模型的核心要素之一是为将来参考记录每一步。在EA中，计划、战略、实施和工作流程均有记录并持续维护。\n\n\n\n- **架构库**\n\
  \  该库在实施过程中定义并记录了组织的资源能力。它还包含实现框架所定义目标所必需的工具。\n\n- **最佳实践**\n  一套最佳实践和指南用于指导稳健的工作流程并审查现有架构。这些实践确保透明度和生产力。这可能产生涓滴效应，有助于更好地理解增长和创新的驱动因素。\n\
  \n## 执行战略的核心基础\n\n敏捷业务模式的需求从未如此关键。尤其是 COVID-19 大流行期间，许多行业遭受了无法弥补的损失，只有通过更具适应性的业务战略和创新模式才能在未来恢复或避免。\n\
  \n> “在新数字产品和服务创新以及客户体验的巨大改善方面，需要快速的变革。”\n> \n> 分析机构 Forrester\n\n那些已经拥抱云基础设施和敏捷工作流程的公司比数字落后者更快地适应了疫情，后者在远程工作模式和保持客户满意度方面举步维艰。\n\
  \nEA 成熟度模型是评估功能域成熟度的一种方式。它们区分了组织依次推进的不同成熟度级别。因此，它们可作为功能域平衡增量改进的指导方针。\n\nEA 的全部意义在于为\
  \ IT 提供投资方向——即如何做出正确的技术选择以实现业务价值。在预测对业务价值和成果的影响方面，EA 管理工具为该过程提供了关键的指导要素。\n\n现在，让我们来看一些确保\
  \ EA 项目得到正确跟踪的典型举措。\n\n## 领导力与愿景\n\n公司的短期战术步骤和长期企业架构愿景必须保持一致。为了确保 EA 成功，领导层必须采取措施确保团队了解相关举措，专注于业务价值，并具备推动组织和流程朝着共同最终目标前进的能力。\n\
  \n## 早期认可\n\n在决策过程中让组织中涉及的每个个人尽早达成一致，对于快速实现共同最终目标尤其有帮助。整个业务的认可使得更容易避免未言明的担忧，发现潜在问题，或管理可能破坏\
  \ EA 项目的其他因素。\n\n## 治理\n\n强有力的领导与全方位到位合适的利益相关者相结合，对于确保任务、里程碑和绩效朝着正确的方向发展至关重要。将所有利益相关者的愿景和利益与精心设计的网络保持一致是一项巨大的挑战，需要流程来确保团队和流程按设计和预期运行。\n\
  \n## 以未来为先的设计\n\n朝着与领先技术进步保持同步的以未来为中心的方法发展是必不可少的。EA 应为组织准备好应对已知挑战，并具有足够的灵活性以利用新兴技术。在试图实现\
  \ EA 业务目标和价值时，沉溺于当前问题以及遗留系统与创新之间的斗争可能是毁灭性的。\n\n## CIO 与业务领导者的和谐\n\n利益相关者领导者必须共同努力，确保不同的观点能够得到和谐地听取和解决。当\
  \ EA 基础设施不够稳固时，多元的意见会使解决归结为技术与业务的问题变得棘手。\n\n## 平衡业务与技术\n\n有些人可能会让 EA 运营的技术方面占据整个业务环境。更平衡的方法更好，在这种方法中，业务和技术需求以及战略都会被考虑，并且信息会被共享以确保有效的运营流程。\n\
  \n## 平衡的团队\n\n外面的商业机会世界很大，但找到一个具备技能且有动力把握这一机会的合适团队可能是一场斗争。组织应努力组建一个反映多元化人才融合的团队，他们共同拥有深厚的业务敏锐度、技术理解以及对愿景的热情。\n\
  \n## 以目标为导向的愿景\n\n技术输入、业务流程和绩效衡量汇聚在一起，形成衡量 EA 效益的基础。领导者必须制定超越短期成就的关注目标，并为与 EA 愿景相关的每个关键绩效指标（KPI）争取持久的影响。\n\
  \n## 互操作性与集成\n\n在我们不断发展的数字世界中，团队适应新变化的能力至关重要。为了确保这一点，可持续且可信的 EA 必须尽可能面向未来，具有易于集成和运营灵活性，并在全公司范围内得到支持和执行。\n\
  \n## 坚实的沟通\n\n正确的沟通设计可以决定 EA 组织的成败，因此这项工作绝不能掉以轻心。每个利益相关者在战略上必须站在同一页面上，团队必须了解组织内部最新的\
  \ EA 进展。传达架构的布局、效益和范围很重要。\n\n## 以客户为中心\n\n内部流程很重要，但最重要的利益相关者是客户。最终的 EA 目标、业务计划和\
  \ KPI 应围绕客户需求展开。\n\n## 韧性——EA 的关键\n\n在大流行之前和期间，EA 专家需求旺盛，以协助业务应用程序向云的即时和未来迁移。他们还参与了转型的多个方面，具体取决于其业务路线图、风险评估、可行性、安全、预算、开发策略和其他因素。EA\
  \ 团队推动了转型及其相关流程的加速。\n\nEA 将公司战略转化为已识别的目标以实现业务能力。当执行良好时，EA 将业务目标转化为明确定义的转型举措，使分析师、投资组合负责人、IT\
  \ 解决方案架构师以及业务各领域的其他人员能够在各自的重点领域推进。\n\n在危机时期，EA 通过将资源集中在公司的关键能力上促进业务连续性，并在危机过去后加速恢复，充分利用新环境。EA\
  \ 支持韧性，这可以帮助企业不仅在危机中生存，而且在危机后蓬勃发展。\n\n下图显示了在企业中建立知识导向心态的过程，分析当前知识，并规划未来所需的知识。然而，战略层面描绘了识别现有知识以及如何在企业内有效高效地分配该知识。\n\
  \n运营层面是确保知识在日常实践中被需要访问正确知识的人所使用，在正确的时间、在正确的地点使用：\n\n![](img/16bfeb984938aba3d9334582c2cd6e69_28_0.png)\n\
