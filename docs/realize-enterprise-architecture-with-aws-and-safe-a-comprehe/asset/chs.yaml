  \ 使我们在公共云中比在私有数据中心更安全地运营业务变得容易得多。\n\n利用最先进的技术和实践，AWS 解决了与管理云基础设施和迁移到云相关的挑战。由于迁移到云不仅仅涉及技术，通过与亚马逊合作，我们可以帮助公司迁移到云并将其业务转变为数字企业。\n\
  \n## 云计算挑战\n\n公司在使用云计算时可能遇到的一些主要挑战可以通过适当的方法避免。以下是一些例子：\n\n- **迁移工作负载：** 数据、应用程序和服务器在云提供商之间的迁移应精确规划和执行。将本地工作负载转移到云中时适用的考虑因素与在云之间转移时相同。有时很难足够快地下载数据，导致费用增加。\n\
  - **停机时间：** 迁移到云会带来显著的停机风险。除了数据一致性、网络连接以及在内部应用程序期间为停机做准备外，迁移过程应保持一致地完成。\n- **学习如何适应云环境：**\
  \ 公司更有可能为特定云提供商构建自己的应用程序，而不是使用现有应用程序。迁移到另一个云提供商时可能会出现一些问题，因为自定义设置可能无法与新的云提供商配合使用。公司必须留出时间重新配置应用程序以利用新平台的优势。\n\
  - **预算和时间：** 这两个因素在从一个云迁移到另一个云或从一台服务器迁移到云时应予以考虑。在此阶段，企业应考虑投资迁移公司，因为他们可以确保以有竞争力的价格实现无缝迁移。\n\
  \n将应用程序从云重新迁移到本地数据中心称为云回迁。将应用程序从云重新迁移到本地数据中心称为逆向云迁移。云环境与本地环境的不同之处在于技术由用户拥有和管理。可以对本地和基于云的解决方案使用相同的技术。然而，它们的消费模式不同。另一方面，云服务用户必须使用通用工具，因为提供商通常不提供专用设备。\n\
  \n此外，一些政府强制要求对敏感信息进行现场存储和操作。政府、医疗和金融行业的公司无法使用云服务并确保遵守安全法规。另一方面，在多个大型分散网络中部署云基础设施提供了更高的冗余度，同时使企业能够访问比原本能够访问的更多计算能力。维护内部环境的成本和复杂性通常在开始时更高。\n\
  \n迁移回本地存储是由多种原因促成的。特别是，以下原因证明了回迁的合理性：\n\n- **成本：** 虽然公共云为短期激增提供高可扩展性和廉价计算能力，但它们并不总是适合长期部署的成本效益。\n\
  - **数据和安全控制：** 使用公共云服务涉及与分布式配置管理相关的安全风险。公共云服务涉及与分布式配置管理相关的高度安全风险。这是因为分布式配置管理影响公共云。安全漏洞经常是由配置错误的存储桶引起的。相比之下，本地解决方案往往提供更大的控制，以集中方式处理安全，并具有明确的安全边界。\n\
  - **性能：** 由于广域网带宽和云提供商的工作负载，公共云在数据进出云的速度方面差异很大。\n\n\n\n-   **供应商锁定：** 如果你被锁定，你可能会依赖你的云服务提供商。如果你的系统全部使用单一厂商的工具开发，更换厂商可能会很困难。\n\
  \n如果他们开始收取更高的价格，你的云服务提供商选择可能会受限。基于这些因素以及其他因素，回归本地存储迁移的基础已经奠定。史诗是一项有组织的工件集合，可以细分为称为\
  \ issue 的较小故事集合，Jira 用来指代这些较小的叙述。多个项目可以由多个团队协作处理，并且可以使用多个看板同时管理多个史诗。通常史诗前面会有一组冲刺。随着团队从开发和客户反馈中对史诗了解更多，用户故事将被添加和移除。\n\
  \n基于客户反馈和团队节奏，敏捷史诗具有灵活的范围并使用客户反馈。\n\n为了开发团队取得成功，史诗应该包含其所需的所有资源。在工作层级方面，它们处于顶层。除了为评估史诗提供上下文之外，了解每个史诗如何融入其他敏捷结构也很重要。\n\
  \n初学者可能会觉得将史诗拆分为更小的部分令人望而生畏，但它使理解更容易并保持势头。AWS 的快速增长可能会引发对其原因的疑问。\n\n通过利用最先进的技术和实践，AWS\
  \ 能够解决管理云基础设施和迁移到云的挑战。进入云不仅仅是技术问题，因此借助 Amazon，你可以通过云迁移来转型业务。重新托管比迁移和提升或传统托管方法更快，因为它所需时间更少。此外，实现起来耗时更少且需要最少的重构。然而，迁移和提升可能只会导致最少的更改，因此你可能无法获得与完全基于云的系统相同的益处。如果速度和便捷性是他们唯一考虑的因素，短期内你可能会为更彻底的迁移支付更多费用。\n\
  \n即使是没有完全云就绪、简单、低影响工作负载的组织也可以从迁移和提升中受益。只要你已经拥有许多 **虚拟机（VMs）**，这应该相当直接。你甚至可以购买提供迁移自动化的厂商的产品。甚至还有厂商提供承诺自动化迁移的产品。另一方面，手动执行迁移是一个极佳的学习体验。此外，如果你仓促做出迁移和提升的决定，一旦你的应用在云中运行，它们就可以轻松地重新设计和优化。除了转型技术之外，云计算还提供其他好处。**AWS\
  \ 云采用框架（AWS CAF）** 为云采用提供了全面的视角。此外，它连接了软件系统的六个最重要的特性——业务、人员、治理、平台、安全和运营。当企业尝试迁移时，使用如下提供的框架可能会有所帮助。尽管如此，它仍面临财务限制、数据库问题和各种其他因素等挑战。\n\
  \n成功迁移到云后，可以实现多项好处，包括高可扩展性、卓越的性能和卓越的数字体验。根据团队基础设施和组织，可以应用多种云迁移策略，例如重新购买，它有自己的一套驱动因素、限制和风险。\n\
  \n除了迁移到云带来的多重挑战之外，非结构化组织还将处理预算、适应新的云环境和停机时间。在将基于云的服务从云重新迁移到本地数据中心时，这些服务从云转移到本地服务器。当云应用从云重新迁移到本地服务器时，它们已从云中转移。将云应用从云迁移到本地服务器称为重新迁移，以将它们带回数据中心。去云化，也称为逆向云迁移，是一种从系统中移除公共云的过程。\n\
  \n组织的增长前景决定了其在数字化转型中的成功。特别是，大公司必须通过技术进步完成业务转型以保持竞争力和相关性。技术更娴熟的竞争对手会夺取市场份额和客户，但许多公司正在寻找数字增长的机会。企业架构师在转型中的作用不仅至关重要，因为他们对业务流程有透彻的理解，而且因为他们也理解\
  \ IT 格局对业务成果的影响。\n\n## 不断变化的业务影响 IT 格局\n\n企业必须轻松评估业务格局的变化如何影响 IT 格局，以及这些变化如何影响其运营、客户体验和增长能力。对这些影响的理解可以帮助推动转型进程向前发展。IT\
  \ 架构师在确保 IT 基础设施精简且敏捷以处理即将到来的业务转型项目方面发挥着至关重要的作用。\n\n组织的企业架构由其业务需求指导。他们负责定义信息、业务和技术在组织内部的流动方式等事项。为了保持竞争力，公司更加关注云计算、物联网和\
  \ **机器学习（ML）** 等新兴技术。\n\n人、数据和技术可以结合起来，为 IT 组织提供对其相互关系的全面理解。所有者、设计师和建设者在设计过程中对组织整体进行全面审视。它旨在从整体视角提供企业视图，而非依赖正式文档。\n\
  \n为了有效实施 EAP 策略，至关重要的是要考虑业务流程、组织结构和信息技术方面的最新变化。将讨论组织的各个方面，例如标准语言和最佳实践，以及如何集成或消除流程。拥有可靠、及时和高效的业务信息至关重要。\n\
  \n你可以确信的一件事是数据资产将呈指数级增长。可扩展的企业架构、流程和服务将变得越来越重要。需要回答的关键问题是我们的资产管理工具是否能随我们的资产自动扩展。\n\
  \n要在企业架构中取得成功，拥抱协作并突出你的努力的价值。让组织各部分的利益相关者参与你的工作至关重要——并确保他们也能从中受益。利益相关者应使用数据做出更有效的战略决策。为他们提供他们应期望的信息。在当今世界，企业架构师专注于优化和定制业务能力以实现目标或交付预期结果。通过将业务能力作为投资组合来处理，我们可以帮助组织投资于正确的能力。这种数字化转型促使组织想出新的方法来跟上数字曲线以保持竞争力。通过使用基于结果的架构，这些组织能够应对数字化转型的影响。利用这些新颖的方法，使得从传统到数字\
  \ EA 的转变成为可能。\n\n此外，似乎创建领域专家社区的趋势，而不是单一的 EA 团队，正在转变。为了使企业架构取得成功，必须能够让组织内的多个业务部门和\
  \ IT 团队协作、进行讨论并考虑不同的架构方法和观点。由于敏捷工作者的数量不断增加，EA 在治理方面也发挥了更重要的作用。它传统上仅用于项目团队和解决方案，并由企业架构委员会管理。采用灵活治理模型的企业架构促进协作，使企业架构能够融入公司的文化。在传统的\
  \ EA 交付物形式中，静态文档难以维护和更新，因为它不稳定。由于数字企业架构的演进，中央存储库可以随着时间的推移作为驱动企业敏捷性的事实来源而得到更新和维护。数字企业架构通过创新管理在培养组织的创新文化方面发挥着至关重要的作用。这里强调颠覆性或增量性变化。如果数字\
  \ EA 想要成为数字变革引擎，它必须拥有一个管理良好的创新流程。\n\n在当今的商业世界中，变化是持续的，企业必须评估这些变化对其 IT 格局的影响，以及这些变化将如何影响其运营、客户体验和增长能力。如果仔细审视问题，这可以帮助改善转型过程。架构师通过确保\
  \ IT 环境精简且敏捷来确保 IT 能够运行即将到来的业务转型项目。因此，我们在本章中讨论了 EA 赋能准备的重要性，以及组织可以采取的增强措施。在此过程中，我们还建立并确定了一个基础，以帮助理解建立\
  \ EA 实践的过程和流程。\n\n写一本书比我想象的更困难，但也同样令人充实。我希望这本书为你提供了启发和深入的知识。我对所有参与制作这本书的人——我的编辑、研究人员和出版团队——表示永恒的感激。\n\
