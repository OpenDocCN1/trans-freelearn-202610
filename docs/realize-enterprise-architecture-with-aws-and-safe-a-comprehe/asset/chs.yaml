  \n作为顶级架构师，**企业架构师** 负责企业架构设计。因此，他们的职责范围很广。在企业架构中，IT 资产和业务流程与一套指导原则一起映射，这些原则有助于推动关于业务战略及其如何通过\
  \ IT 表达的持续讨论。\n\n**解决方案架构师** 比专注于特定应用的 **应用架构师** 高一级。解决方案架构师关注解决方案，而企业架构师关注整个组织。**应用架构师**\
  \ 专注于一个功能。这些角色很少与客户互动，因此不需要太多业务经验。随着经验的积累，许多解决方案架构师会成长为企业架构师。\n\n一个基础扎实且与业务目标和技术战略高度一致的有效企业架构可以为组织带来巨大益处。以下是企业架构的一些更具体的目标：\n\
  - **业务运营：**\n  - 降低业务运营成本\n  - 更敏捷的组织和工作流程\n  - 可在整个组织中访问的共享业务能力\n  - 降低变更管理成本\n\
  \  - 提高业务生产力以确保更高效率\n- **数字化转型与 IT 运营：**\n  - 通过增强的数字能力扩展企业的覆盖范围\n  - 通过整合所有企业组件确保统一的环境\n\
  \  - 降低软件开发、支持和维护费用\n  - 提高应用的可移植性比例\n  - 便捷的系统和网络管理以及改进的互操作性\n  - 关于关键企业问题的更好沟通\n\
  \  - 轻松升级系统组件\n- **更好的 IT 投资：**\n  - 消除业务和 IT 中的复杂元素\n  - 当前业务和 IT 网络的更高 **投资回报率（ROI）**\n\
  \  - 更轻松地外包业务和 IT 解决方案\n  - 新的、风险更低的投资、问责制和更有效的成果\n- **更快、更简单、更便宜的采购：**\n  - 在连贯的计划中提供可访问的采购管理信息，以简化采购决策过程\n\
  \  - 更快的采购流程，在保持架构一致性的同时提升整体速度和灵活性\n  - 多供应商开放系统的能力\n  - 增强获取更经济、IT 和业务能力的机会\n\n\
  系统的价值在需求更高的地方更容易被认可。企业架构也是如此；它在为简化高度复杂的 IT 环境而努力的大型企业中发挥最有效的作用。缺乏多样化能力的业务模式产生了对有效企业架构的关键需求。\n\
  \n### 九个最常见的企业架构用例\n\n以下是企业架构作为解决挑战和利用机会的推荐解决方案的九个最常见用例。\n\n\n\n## 并购后管理\n\n多家企业可以在不同情况下合并或联合以整合其服务。小型公司被大型公司收购，财务困难的公司与更成功的组织合并，而成功的最佳实践公司则被寻求为其产品组合增加能力的公司收购。这些事件被称为\
  \ **并购（M&A）**。\n\n并购后阶段可能很复杂，所有相关方共同合作至关重要，因为这一整合阶段绝非易事。关于公司政策、资产、能力等的所有信息都必须共享并被理解。应用、服务器、业务能力、员工、流程以及其他制品必须仔细考虑它们在并购前后的提供内容。\n\
  \n平均而言，70-90%的收购会失败。为了确保在整个过程中实现平稳、无缝且成功的进展，加速增长和扩展运营的有效策略至关重要。\n\n尽管有许多因素导致并购不成功，其中之一是企业暂停运营以专注于整合。在成功的并购计划的整合阶段，企业架构（EA）使关键利益相关者，例如\
  \ **首席财务官（CFOs）** 和 **首席运营官（COOs）**，能够做出更快、更可信的决策。\n\n当相关公司未能成功整合或预见所需的协同效应时，并购会失败并消耗意外的资源。这些挑战从技术角度来看非常巨大。当涉及多家公司时，技术的统一和转型必须在不干扰日常业务的情况下进行。\n\
  \n在合并或收购期间，确保记录双方 IT 架构的初始状态至关重要。这正是企业架构（EA）在回答以下等基本结构性问题时特别有帮助的地方：\n\n-   在每家公司维护记录的基础设施是什么？\n\
  -   公司数据在需要时如何存储和检索？\n-   公司将其支持文档存储在哪里？\n\n企业架构师在考虑这些问题并找到答案后，基于具体数据提出最佳解决方案。\n\
  \n## 应用合理化\n\n企业通常更专注于推动经济增长，而非使 IT 架构保持一致。因此，不同的应用会根据不同部门传达的需求或请求在不同时间点部署。\n\n\
  业务领导者可能没有意识到，拥有一个庞大且充满重叠应用、生命周期各异和冗余技术的 IT 生态系统，往往会遇到多个集成问题和低效率，从而可能影响公司在企业层面的运营。除了使\
  \ IT 支出增加数亿美元外，复杂、僵化的 IT 生态系统还会直接降低 **服务质量（QoS）** 和客户满意度。\n\nEA 提供了审查业务中使用的应用、识别和解决集成失败、消除冗余应用并简化未来审查和选择应用流程的机会。\n\
  \n## 集成架构\n\n**集成架构（IA）** 对有价值的应用至关重要。有些应用是从零开始构建的，有些运行在预配置设置上，还有一些使用两者的组合。\n\n\
  集成是一项挑战，因为最有价值的应用是能够协同工作以创建无缝解决方案的应用，而每个企业的需求都不同。零售和电子商务应用需要与库存系统集成，**人力资源（HR）**\
  \ 应用需要与日历同步，营销应用需要与 **客户关系管理（CRM）** 程序协同工作，等等。\n\n集成由在不同位置的多个平台上运行的多个应用的复杂性和依赖性定义，这使得\
  \ *简单集成* 一词成为矛盾。统计数据显示，70%的集成项目都不成功。技术困难或软件问题很少是这些失败的原因。问题是由管理问题、不断变化的软件、模糊的标准以及责任不清造成的。\n\
  \nEA 为组织内的集成提供了基础和路线图。它还定义了必要的资源和流程，以确保集成能力得到考虑、管理并成功执行。\n\n## 技术风险管理\n\n风险管理需要建立组织的战略视角以了解可能面临的挑战。这需要对当前产品、流程、应用和基础设施有充分了解，以及对各自风险和安全方面的理解。\n\
  \n如果不知道主要风险是什么，C 级团队就无法履行其管理职责。理解这些关系的能力对于评估业务决策的影响至关重要。\n\n业务分析师可以使用这些工具分析与例如开发新产品和计划、外包业务流程或\
  \ IT 系统、或并购后吸收另一家组织相关的企业风险。这将使他们能够将企业的风险倾向与潜在后果相平衡。\n\n此外，高管和运营管理层理所当然地担心风险在组织内的蔓延。一个组织部分的风险可能会影响组织的其他部分。考虑系统故障、入侵、停电、欺诈或其他事故的例子。这些事件将如何影响关键业务流程、服务、客户、合作伙伴和市场？通过\
  \ EA 深入了解这些关系和依赖性，您能够在未来预防或减轻灾难。\n\n技术对所有行业组织成功至关重要。任何技术都存在一些固有的网络风险，其形式不计其数。导致数据泄露的最常见但可预防的情况是由\
  \ IT 中断、遗留应用及其支持的基础设施引起的。根据 IBM 的《2021 年数据泄露成本报告》（https://www.ibm.com/security/data-breach），全球安全漏洞的平均成本为\
  \ 424 万 **美元（USD）**。美国泄露的平均成本要高得多，每起事件为 905 万美元。对组织网络安全系统的攻击可能对其财务状况、客户保留和品牌声誉产生重大影响。\n\
  \n仅 20 家最大的技术供应商就可能提供超过一百万种不同的技术产品。其组件每天都在变化，随着生命周期信息的变化监控新版本的需求是 IT 管理的重要组成部分。过时的组件需要根据这些变化进行升级。\n\
  \n维护过时技术存在许多风险，包括以下内容：\n\n-   技术不支持业务\n-   复杂性更高\n-   安全漏洞\n-   合规问题\n-   缺乏供应商的技能和支持\n\
  -   IT 灵活性降低\n\n技术产品每天经历约 2,500 次信息变更。手动跟踪所有这些是不可能的。\n\n## 数据合规\n\n遵守数据隐私法律和法规是组织展示其遵循正式标准和程序以确保敏感数据免受丢失、盗窃、损坏和滥用侵害的方式。组织、管理和存储数据需要遵守法规，以避免对企业和/或其领导者处以财务、法律和其他处罚。\n\
  \n\n\nVarious industries, governments, states, countries, and even continents have\
  \ varying regulations regarding data compliance. The three elements an organization\
  \ must focus on when it comes to data compliance relate to data, actions, and penalties.\
  \ Regulations identify the type of data that should be protected and actions that\
  \ must be taken to protect that data. If an organization doesn’t comply with these\
  \ actions, regulations outline the consequences.\n\nThe cost of compliance is steep,\
  \ but the penalties for non-compliance are even higher. Under GDPR, for example,\
  \ any organization processing the personal information of EU citizens must comply\
  \ with GDPR regardless of where their business is located. As with many regulatory\
  \ mandates, GDPR offers many advantages, such as requirements for data standardization\
  \ that will benefit organizations and their transactions with other businesses.\
  \ For most organizations, data compliance has affected their approach to data management.\n\
  \n## Standards governance\n\nEAs and other architectures are managed and controlled\
  \ by architecture governance at an enterprise level. Architecture governance normally\
  \ operates within a hierarchy of governance structures and not in isolation. It\
  \ works in the larger enterprise, such as corporate governance, technology governance,\
  \ IT governance, and architecture governance, and can include all of the distinct\
  \ architectural domains with their own disciplines and processes.\n\nThe enterprise\
  \ may have multiple levels of governance—global, regional, and local—over its life\
  \ cycle. Large corporations can benefit from standardized IT: they can reduce training\
  \ time, cut maintenance and support costs, have better bargaining power with vendors,\
  \ and improve communication.\n\nIt is common to combine standardization with centralization,\
  \ a process by which an IT department gains more control over hardware and software\
  \ purchases, because every new piece of software equipment added to the IT arsenal\
  \ will require installation, maintenance, personnel training, repairs, patches,\
  \ upgrades, and so on. Standardization can be disadvantageous, as technologies change\
  \ very rapidly, and processes need to be updated when technology changes. Businesses\
  \ also use alternative concepts, such as radical agility, to prevent stifling innovation\
  \ across the enterprise.\n\n## Monoliths to microservices\n\nMany businesses are\
  \ being forced to rethink their architecture as digitalization accelerates rapidly.\
  \ Customers expect companies to make their products available on as many digital\
  \ channels as possible to meet their constantly increasing expectations. Multinational\
  \ corporations have grown to become monoliths over time, as they develop very complex\
  \ structures that make it difficult to perform swift or timely changes.\n\nIt is\
  \ not sufficient to apply scale to individual elements of an architecture; the entire\
  \ application must be prepared for scale. Introducing microservices architecture\
  \ into software development can reduce application throughput times. Since microservices\
  \ can be built and deployed independently, not only do they enhance productivity\
  \ and flexibility, but they also increase the resiliency of applications. Teams\
  \ can build microservices from the ground up or decompose legacy monolithic applications\
  \ into microservices. They enable cloud-native development, whether they're deployed\
  \ on-premises or in the cloud.\n\nA reputation for complexity surrounds microservices.\
  \ Furthermore, not every monolith is well suited for being converted to a set of\
  \ microservices. In order to determine when and where microservices are useful,\
  \ enterprise architects play a crucial role. Furthermore, they lay the groundwork\
  \ for a cultural shift that is required for microservices to succeed.\n\nWhen it\
  \ comes to legacy issues and missing information, companies that have adopted microservices\
  \ still face the same challenges as those that haven't adopted them. As a result\
  \ of microservices, monoliths can be broken down, enabling rapid changes, short\
  \ release times, and team autonomy. Software releases created with microservices\
  \ are deployed up to five times faster than those created without them.\n\n## Cloud\
  \ transformation\n\nThe process of moving data, applications, networks, and infrastructure\
  \ to a cloud environment is known as cloud transformation. Moreover, the cloud in\
  \ all its forms—including on-demand environments, smart development, and **artificial\
  \ intelligence (AI)**—is a technology to be harnessed. The cloud may seem like the\
  \ perfect solution if legacy technology, processes, and infrastructure are preventing\
  \ an organization from achieving a desired competitive advantage. There are many\
  \ big consulting firms that can help teams design their **cloud transformation strategy**.\
  \ Although many steps and guides are provided to help teams make the transition,\
  \ in the end, it's really all about moving applications to the virtual world.\n\n\
  Defining and analyzing changes executed toward the achievement of organizational\
  \ goals forms the basis of EA, so organizations applying an EA approach are likely\
  \ aligned with their goals.\n\nWith the availability of cloud computing, new service-driven\
  \ business models have been developed that drive product and service value. A number\
  \ of benefits are associated with cloud computing, such as cost savings, efficiency\
  \ improvements, shorter development cycle times, and faster TTM. In addition to\
  \ improving asset utilization, reducing operational expenses, and redefining the\
  \ relationship between IT staff and management, moving to the cloud can help companies\
  \ dramatically cut costs.\n\nAs business and IT strategies are increasingly influenced\
  \ by the cloud, a roadmap from legacy to cloud needs to be implemented by enterprise\
  \ architects. Achieving cloud transformation success is challenging due to complex\
  \ business environments and rapidly changing infrastructure. A successful transition\
  \ to the cloud requires a number of organizational, operational, and technical modifications.\
  \ Several factors influence cloud adoption along the way, including budget limitations,\
  \ the need for exponential scale, and increasing complexity in corporate policies\
  \ and regulations.\n\n## IoT architecture\n\nDigital transformation is driving an\
  \ increase in the need for enterprise architects to manage the growing complexity\
  \ of IT. Consumers find IoT-powered smart devices useful or convenient for their\
  \ lives. For example, a fuel monitor that dispatches a fuel truck when a propane\
  \ tank meter registers below a certain percentage can save time that would have\
  \ been spent monitoring the meter manually and calling the fuel company to schedule\
  \ a refill. Similarly, enterprise architects should consider how IoT can benefit\
  \ their organizations.\n\nEA can integrate IoT in three generic ways, as outlined\
  \ here:\n\n- In the first case, you can choose to rely on the services provided\
  \ by the device manufacturer. Exporting and importing files are the two main methods\
  \ of transferring data between existing corporate systems, while custom **application\
  \ programming interface** (**API**) connections can be used to transfer data automatically.\n\
  - In a second option, an IoT value chain can be built by implementing separate services\
  \ for data storage, data communication, data analytics, and data integration. While\
  \ this approach can be quite a challenge, many IoT applications will be handled\
  \ more successfully using this method.\n- A third option would be to connect IoT\
  \ devices directly to enterprise management systems, such as **Systems, Applications\
  \ and Products** (**SAP**), or build an in-house intermediate application to achieve\
  \ this goal.\n\nWith IoT, companies can launch products faster, get big data insights\
  \ in real time, create new services and business models, and reduce costs. However,\
  \ security and privacy risks, a lack of standard oversight, and the integration\
  \ of IoT devices all pose significant challenges.\n\n## EAFs and methodologies\n\
  \nEAFs provide guidelines for creating and using EAs that describe a model of a\
  \ system's architecture. Tools and approaches are provided to facilitate enterprise\
  \ architects' work to optimize different architecture domains across the enterprise.\
  \ They integrate disparate, fragmented manual and automated processes into an environment\
  \ that is responsive to change and supported by the implementation of business strategies.\n\
  \nEAFs determine how organizations can most effectively achieve their current and\
  \ future business goals. While EAFs have evolved over the last five decades, there\
  \ are a few that have been developed and improved over time and are still in use\
  \ today.\n\n\n\n## 开放群组架构框架\n\nTOGAF 的初始开发始于 1995 年。较新的版本或模型提供了改进的迭代和理论，这在当时企业架构领域是常见的。TOGAF\
  \ 受到了美国国防部（DoD）自己的企业架构框架 EAF 的很大影响，称为信息管理技术架构框架（TAFIM）。\n\nTAFIM 在 TOGAF 推出后几年内就被美国国防部放弃。今天，20\
  \ 多年后，它仍然是全球性的成功。跨部门组织 IT 工作，并将 IT 计划与业务目标保持一致是 TOGAF 的一部分，其他常见的 IT 管理框架也是如此。\n\n\
  在 EA 项目开始之前，TOGAF 帮助企业定义和组织需求，使项目高效推进且错误较少。该框架旨在通过以下四个目标帮助企业组织和解决所有关键的业务和战略需求，如下所述：\n\
  \n- 在用户之间使用通用语言，从关键利益相关者到团队成员。因此，每个人都将以相同的方式理解框架、内容和目标，沟通障碍可以得到解决或消除。\n- 通过避免专有解决方案实现\
  \ EA 自由——企业为获得竞争优势而开发或获取的工具、流程和独特能力的组合。只要用于内部而不是商业用途，TOGAF 就是免费的。\n- 通过更有效地利用资源节省时间和金钱。\n\
  - ROI 必须可衡量。\n\n常见的 EA 子集由四个域组成，如下所述，TOGAF 标准旨在支持所有这些域：\n\n- 业务架构定义了组织、治理和关键业务流程。\n\
  - 在组织的数据架构中，数据资产和数据管理资源在逻辑上和物理上进行描述。\n- 应用架构描述了应用程序将如何部署、其操作以及它们与组织核心业务流程的交互。\n\
  - 技术架构是一组用于部署业务、数据和应用服务的逻辑需求。它包括 IT 基础设施、中介软件、网络、通信、处理、标准等。\n\nTOGAF 提供了一种经过验证且可重复的架构开发方法（ADM）。架构师建立架构框架、开发架构内容、转换架构并指导其实现。这些活动在持续的架构定义和实现的迭代周期中执行，使组织能够以受控的方式转型业务，同时满足业务目标和机会。\n\
  \nADM 包括以下阶段：\n\n- 在初步阶段，在架构能力创建的准备和启动过程中，考虑诸如 TOGAF 定制和架构原则定义等活动：\n  A. 架构愿景是架构开发周期的第一阶段。在此阶段，组织确定关键利益相关者，详细说明架构愿景，并解释如何获得批准以推进架构开发。\n\
  \  B. 业务架构被开发以支持商定的架构愿景。\n  C. 信息系统架构被创建以描述这些架构将如何支持架构愿景。\n  D. 技术架构被设计以支持架构愿景。\n\
  \  E. 识别初始实施的机会和解决方案，并确定交付载体。\n  F. 详细实施和迁移计划最终确定。\n  G. 实施治理为项目建立执行计划和问责结构。\n \
  \ H. 建立管理新架构变更的程序。\n- 最终阶段也是持续进行的活动，用于检查需求在整个架构开发生命周期中如何被管理。\n\n实施 ADM 的架构师在其工作过程中会生成许多输出，包括\
  \ **流程图（PFDs）**、架构需求、项目计划和项目合规性评估。ADM 为根据 TOGAF 架构组织的主要工作产品的定义、结构和呈现提供框架。\n\n以下三个类别描述了架构内容框架使用上下文中架构工作产品的类型：\n\
  \n- **交付物** 是合同中指定的工作产品，进而由利益相关者审查、同意和批准。项目的交付物由在项目完成时归档或移入架构库作为参考模型、标准或特定时间架构景观快照的文件组成。\n\
  - **制品** 是描述架构某一方面的架构产品。一般来说，制品分为三类：*目录*（事物的列表）、*矩阵*（显示事物之间的关系）和*图表*（事物的图片）。用例图、业务交互矩阵和需求目录可作为示例。架构库将存储架构交付物的制品。\n\
  - 在企业能力中，**构建块** 代表企业能力的一部分，可与其他部分组合重复使用以构建架构和解决方案。构建块的详细程度可能取决于架构开发过程的阶段。早期，构建块可能仅由名称或大纲组成。将来，一个构建块可以分解为多个支持构建块以及详细规范。\n\
  \n架构和解决方案可以被视为构建块，如下所述：\n\n- 根据 **架构构建块（ABBs）**，企业可能需要客户服务能力，这可以由许多 **解决方案构建块（SBBs）**\
  \ 支持，例如流程、数据和应用软件。\n- 在 SBB 中，有实现所需能力的组件；例如，网络是一个制品，可以用互补制品描述，然后用于实施企业解决方案。\n\n\
  实施 ADM 的架构师会生成许多交付物，并将其保存在架构库中。ADM 为架构中主要工作产品的定义、结构和呈现提供框架。\n\n没有两个组织是相同的，因此能够定制方法以满足每个组织的具体需求非常重要。企业连续体允许企业架构师映射定制化方法。\n\
  \n## 企业连续体\n\n作为 TOGAF 标准的一部分，存在企业连续体的概念，它为架构师设定了更广泛的上下文，并解释了如何调整和定制通用解决方案以满足每个组织独特的<|message|>要求。\n\
  \n企业连续体是架构库的一部分，是将架构和解决方案制品从通用基础架构分类为组织特定架构的方法。企业连续体包括架构连续体和解决方案连续体的概念。\n\n使工作产品可供组织中的个人和团队使用是\
  \ EA 的关键方面，并确保 EA 团队的一致性。\n\n## 架构库\n\n通过使用架构库，TOGAF 标准通过在不同抽象级别存储由 ADM 创建的不同类型的架构输出来支持企业连续体。这样，不同级别的利益相关者和从业人员可以进行沟通和协作。在开发组织特定架构时，鼓励架构师利用企业连续体和架构库中可用的所有其他相关架构资源和资产。\n\
  \n\n\nA TOGAF architecture delivery model is an organization's process life cycle\
  \ based on a governance framework that operates on multiple levels within an organization\
  \ and produces outputs that reside in an architecture repository. Enterprise Continuum\
  \ models provide a useful context for analyzing architectural models. They depict\
  \ building blocks, their relationships, and the constraints and requirements associated\
  \ with the development cycle.\n\nTOGAF 架构交付模型是基于治理框架的组织流程生命周期，该框架在组织内部的多个层面上运行，并产生驻留在架构存储库中的输出。企业连续体模型为分析架构模型提供了有用的背景。它们描绘了构建块、它们之间的关系以及与开发周期相关的约束和要求。\n\
  \nHere are the major elements of an architecture repository:\n\n以下是架构存储库的主要元素：\n\
  \n- The architecture metamodel is a set of tools designed to tailor an architecture\
  \ framework and content for use within specific organizations.\n- 架构元模型是一组工具，旨在为特定组织定制架构框架和内容。\n\
  - Governance of the architecture repository is supported by the architecture capability\
  \ through parameters, structures, and processes.\n- 架构存储库的治理通过参数、结构和流程由架构能力提供支持。\n\
  - The architecture landscape represents assets deployed across the enterprise at\
  \ various levels of abstraction to satisfy the architecture objectives of the enterprise.\n\
  - 架构全景代表在不同抽象级别部署在整个企业中的资产，以满足企业的架构目标。\n- New architectures must comply with the\
  \ Standards Information Base (SIB). They may include industry standards, selected\
  \ products and services from suppliers, or service sharing already in place within\
  \ the organization.\n- 新架构必须符合标准信息库 (SIB)。它们可能包括行业标准、供应商选定的产品和服务，或组织内部已有的服务共享。\n\
  - To support the creation of new EAs, the reference library provides guidelines,\
  \ templates, patterns, and other forms of reference material.\n- 为了支持新 EA 的创建，参考库提供指南、模板、模式和其他形式的参考资料。\n\
  - An enterprise governance log records governance activity across the organization.\n\
  - 企业治理日志记录组织范围内的治理活动。\n- The repository of architecture requirements provides the\
  \ architecture board with a view of all authorized architecture requirements.\n\
  - 架构需求存储库为架构委员会提供所有授权架构需求的视图。\n- The solutions landscape represents architecturally\
  \ the SBBs that have been planned or deployed by an enterprise to support the architecture\
  \ landscape.\n- 解决方案全景从架构上表示企业为支持架构全景而规划或部署的 SBB。\n\nThe architecture repository\
  \ builds the capability for the organization to implement, support, and repeat new\
  \ EAs at scale.\n\n架构存储库为组织构建大规模实施、支持和重复新 EA 的能力。\n\n## Establishing and maintaining\
  \ an EA capability\n\n## 建立和维护 EA 能力\n\nFor architectural activities to be effective\
  \ within an organization, it is imperative to establish organizational structures,\
  \ roles, responsibilities, skills, and processes that promote architecture as a\
  \ business capability.\n\n为了使架构活动在组织内有效，至关重要的是建立组织结构、角色、职责、技能和流程，以促进架构作为业务能力。\n\n\
  When an EA process is operating at maturity, business capabilities and operations\
  \ are tracked, and the resource pool and professional development are aligned with\
  \ roles and responsibilities required under the architecture.\n\n当 EA 流程达到成熟度时，业务能力和运营得到跟踪，并且资源池和专业发展与架构下要求的角色和职责保持一致。\n\
  \nOne of the most effective frameworks that are widely used in EA is the Zachman\
  \ Framework, which is used for identifying and tracking critical elements of an\
  \ organization's people and processes that support EA.\n\n在 EA 中广泛使用的最有效框架之一是 Zachman\
  \ 框架，它用于识别和跟踪支持 EA 的组织人员和流程的关键要素。\n\n## Zachman Framework for EA\n\n## Zachman 框架用于\
  \ EA\n\nJohn Zachman introduced his framework for information systems architecture\
  \ in 1987. The Zachman Framework applies the understanding that the same complex\
  \ item can be described for different purposes in different ways, using different\
  \ kinds of descriptions.\n\nJohn Zachman 于 1987 年提出了他的信息系统架构框架。Zachman 框架应用了这样一种理解：同一复杂项目可以用不同方式描述以用于不同目的，使用不同类型的描述。\n\
  \nAn architectural artifact is organized using the Zachman Framework—a design document,\
  \ specification, or model addressing both the target audience of the artifact (for\
  \ example, business owners and system builders), as well as the specific issue being\
  \ addressed (for example, data and functionality).\n\n架构制品使用 Zachman 框架组织——设计文档、规范或模型，同时解决制品的目标受众（例如，业务所有者和系统构建者）以及所解决的具体问题（例如，数据和功能）。\n\
  \nThe Zachman Framework is based on a **two-dimensional (2D)** model used for arranging\
  \ artifacts in the architecture industry. In building architecture, the **first\
  \ dimension refers to the players involved**. Construction of physical buildings—for\
  \ instance—may involve several players or stakeholders, including the owner who\
  \ pays the bills, the contractor who manages the design, and a zoning board that\
  \ ensures building codes are followed.\n\nZachman 框架基于用于在架构行业中排列制品的 **二维 (2D)**\
  \ 模型。在建筑架构中，**第一维度指的是相关参与者**。例如，物理建筑的建设可能涉及多个参与者或利益相关者，包括支付账单的所有者、管理设计的承包商以及确保遵守建筑规范的分区委员会。\n\
  \nDifferent architectures are prepared for each player by the architect and comprehensive\
  \ information is demanded by all players, but what constitutes completeness varies\
  \ for each player. In addition to the building’s functionality and aesthetics, the\
  \ owner is interested in a detailed description.\n\n建筑师为每个参与者准备不同的架构，并且所有参与者都需要全面的信息，但完整性的构成因参与者而异。除了建筑的功能和美学之外，所有者还对详细描述感兴趣。\n\
  \nConstruction materials and the construction processes are of particular interest\
  \ to the builder. There is no concern over where the wall studs are placed, or which\
  \ nails or shingles are used. Certain practices are observed—for example, one practice\
  \ might be to build a house with bedroom windows aligned with the sun in the morning,\
  \ regardless of where the sun rises in the morning.\n\n建筑材料和施工过程对建造者特别感兴趣。墙体龙骨放置在哪里，或使用哪些钉子或屋瓦并不重要。某些做法被观察到——例如，一种做法可能是建造一栋房子，使卧室窗户与早晨的太阳对齐，无论太阳在早晨从哪里升起。\n\
  \nIn terms of a specific artifact organization, the second defining aspect is the\
  \ descriptive focus of that artifact: the *what, where, when, who,* and *why* of\
  \ the project. The second dimension exists independently of the first dimension.\
  \ Neither the builder nor the owner should be unaware of *what*, but what the owner\
  \ knows may differ from what the builder knows. Who asks the question will determine\
  \ the answer.\n\n就特定制品组织而言，第二个定义方面是该制品的描述焦点：项目的 *什么、在哪里、何时、谁，* 和 *为什么*。第二维度独立于第一维度存在。建造者和所有者都不应不知道\
  \ *什么*，但所有者所知可能与建造者所知不同。提问者将决定答案。\n\nThe Zachman Framework suggests that the same\
  \ complex item can be described for different purposes differently, using different\
  \ descriptions. Any complex object, such as manufactured goods, can be completely\
  \ described using Zachman’s 36 categories, made up of six columns and six rows and\
  \ taking the form of a 2D matrix.\n\nZachman 框架建议同一复杂项目可以用不同描述以不同目的描述。任何复杂对象，例如制造商品，都可以使用\
  \ Zachman 的 36 个类别完全描述，由六列和六行组成，形式为 2D 矩阵。\n\nIncluded in the Zachman Framework\
  \ are these perspectives of the system:\n\nZachman 框架中包含系统的以下视角：\n\n- **Planner’s\
  \ View (Scope Contexts)**: Describes the organization’s purpose and strategy and\
  \ provides a basis for the other views\n- **规划者视图（范围上下文）**：描述组织的宗旨和战略，并为其他视图提供基础\n\
  - **Owner’s View (Business Concepts)**: A view of the organization that shows where\
  \ automation can be applied\n- **所有者视图（业务概念）**：展示自动化可以应用的组织的视图\n- **Designer’s View\
  \ (System Logic)**: This view describes how the system will meet the information\
  \ needs of the organization\n- **设计者视图（系统逻辑）**：该视图描述系统将如何满足组织的信息需求\n- **Implementer’s\
  \ View (Technology Physics)**: How production constraints will be met as part of\
  \ the implementation of this system\n- **实施者视图（技术物理）**：作为该系统实施的一部分，如何满足生产约束\n- **Sub-Constructor’s\
  \ View (Component Assemblies)**: This view shows details specific to an implementation\
  \ of a specific system element\n- **子建造者视图（组件装配）**：该视图显示特定系统元素实现特定的细节\n- **User’s\
  \ View (Operations Classes)**: This view enables the user to observe the system’s\
  \ operation\n- **用户视图（操作类）**：该视图使用户能够观察系统的运行\n\nAnother EAF emerged in response\
  \ to US legislation designed to improve the way the federal government acquires,\
  \ uses, and disposes of IT.\n\n另一项 EAF 应美国立法而出现，该立法旨在改善联邦政府获取、使用和处置 IT 的方式。\n\n\
  ## Federal Enterprise Architecture Framework\n\n## 联邦企业架构框架\n\nIn response to the\
  \ *Clinger-Cohen Act of 1996*, **chief information officers (CIOs)** established\
  \ the **Federal Enterprise Architecture Framework (FEAF)** in 1999. The FEAF allows\
  \ federal agencies and other government agencies to share processes and information.\n\
  \n作为对 *1996 年克林格-科恩法案* 的回应，**首席信息官 (CIOs)** 于 1999 年建立了 **联邦企业架构框架 (FEAF)**。FEAF\
  \ 允许联邦机构和其他政府机构共享流程和信息。\n\nAn architecture can be categorized according to FEAF\
  \ categories of business, data, applications, and technology architectures, as explained\
  \ in more detail here:\n\n架构可以根据 FEAF 的业务、数据、应用和技术架构类别进行分类，如下所述：\n\n- Business architecture\
  \ defines what is done, who did it, how it was done, and when and why it was done\n\
  - 业务架构定义做了什么、谁做的、如何做的，以及何时和为什么做\n- Data architecture determines the information\
  \ used by the agency to do business\n- 数据架构确定机构开展业务所使用信息\n- Application architecture\
  \ is a collection of all IT resources, such as computers and software that process\
  \ the data according to business rules\n- 应用架构是所有 IT 资源（如计算机和软件）的集合，它们根据业务规则处理数据\n\
  - Technology architecture comprises the technology that facilitates the previously\
  \ mentioned phases\n- 技术架构包括促进上述阶段的技术\n\n**Federal EA (FEA)** is the method or the\
  \ architectural result of implementing that methodology for a specific enterprise.\
  \ In terms of how it can apply to companies in the private sector, FEA is viewed\
  \ from a methodology perspective.\n\n**联邦 EA (FEA)** 是为特定企业实施该方法学的方法或架构结果。就其如何适用于私营公司而言，FEA\
  \ 从方法学角度来看待。\n\nAlthough there is a lot more to FEA than its reference models, five\
  \ of them can be referred to as part of FEA, one representing each activity area—business,\
  \ service, components, technical, and data.\n\n尽管 FEA 不仅仅是其参考模型，但其中五个可以作为 FEA 的一部分引用，每个代表一个活动领域——业务、服务、组件、技术和数据。\n\
  \n### The FEA process\n\n### FEA 流程\n\nThe FEA process focuses on developing a segment\
  \ architecture for an overall enterprise subset, as follows:\n\nFEA 流程侧重于为整体企业子集开发细分架构，具体如下：\n\
  \n- Analyze the segment’s architecture to determine a simple but concise vision\
  \ that relates to the segment’s organizational structure\n- 分析细分架构以确定与细分组织结构相关的简单但简洁的愿景\n\
  - Establish an architecture target for the segment, define goals, develop design\
  \ alternatives, and set the EA for the segment that includes business, data, services,\
  \ and technology architectures\n- 为细分设定架构目标，定义目标，开发设计替代方案，并为细分设定包括业务、数据、服务和技术架构的\
  \ EA\n- Justify the investment and determine the ROI\n- 证明投资合理并确定投资回报率\n- Establish\
  \ milestones and performance measures for assessing the success of the project,\
  \ including a plan and task list\n- 建立评估项目成功的里程碑和绩效指标，包括计划和任务清单\n\nFEA integrates\
  \ strategic, business, and technology management as part of organization design\
  \ and performance improvement.\n\nFEA 将战略、业务和技术管理作为组织设计和绩效改进的一部分进行整合。\n\nYet another\
  \ EAF was developed by Gartner, a firm that provides analysis, research, and strategy\
  \ services for organizations.\n\n另一项 EAF 由 Gartner 开发，该公司为组织提供分析、研究和战略服务。\n\n##\
  \ Gartner’s EAF\n\n## Gartner 的 EAF\n\nAs organizations plan for the future, Gartner’s\
  \ EAF is designed to influence and support their decisions. It focuses on a constant\
  \ state of adaptation. This model is used to assess the enterprise’s present state,\
  \ identify appropriate investments in technology and procedures to achieve the desired\
  \ future state, manage the enterprise during the transition, and plan investments\
  \ for the future.\n\n随着组织规划未来，Gartner 的 EAF 旨在影响和支持其决策。它专注于持续的适应状态。该模型用于评估企业的当前状态，确定适当的技术和程序投资以实现期望的未来状态，在过渡期间管理企业，并规划未来的投资。\n\
  \nThis framework brings together three constituents: business owners, information\
  \ specialists, and technology implementers. Success depends on how well an organization\
  \ can unify these three groups behind a shared vision that drives business value.\
  \ The key to success is to drive profitability, not check off items on a process\
  \ matrix. According to Gartner, EA must focus on where an organization is going\
  \ rather than on where it is now.\n\n该框架汇集了三个组成部分：业务所有者、信息专家和技术实施者。成功取决于组织将这三组人团结在推动业务价值的共同愿景之下的能力。成功的关键是推动盈利能力，而不是在流程矩阵上勾选项目。根据\
  \ Gartner，EA 必须关注组织将要去向而非其现在所在的位置。\n\nAn organization has the opportunity to clearly\
  \ articulate the nature, scope, and impact of the EA changes being made by creating\
  \ an EA vision. A business, technical, information, and solutions architecture for\
  \ an enterprise can be considered as soon as the organization establishes this common\
  \ vision for the future.\n\n通过创建 EA 愿景，组织有机会明确阐述正在进行的 EA 变化的性质、范围和影响。一旦组织为未来建立这一共同愿景，就可以考虑企业的业务、技术、信息和解决方案架构。\n\
  \nThose changes must be prioritized according to the business value they will bring.\
  \ EA involves creating the best possible template or platform to maximize the use\
  \ of IT systems. There is no inherent antagonistic relationship between the four\
  \ frameworks analyzed here. Every one of them serves a different purpose and has\
  \ unique pros and cons.\n\n这些变化必须根据它们将带来的业务价值进行优先排序。EA 涉及创建最佳的模板或平台以最大化 IT 系统的使用。这里分析的四个框架之间没有固有的对抗关系。每一个都有不同的目的和独特的优缺点。\n\
  \n## Benefits of each EAF\n\n## 各 EAF 的优势\n\nThrough the Zachman Framework, classification\
  \ and organization are addressed. The TOGAF model is the best to employ if the process\
  \ is the problem. FEAF is a good framework for analyzing the most highly complex\
  \ and interconnected enterprises. The Gartner EAF is the most effective way to start\
  \ if vision is the main problem. To evaluate these frameworks based on how they\
  \ address an organization’s unique needs and circumstances, it is essential to possess\
  \ a thorough understanding of the organization.\n\n通过 Zachman 框架，分类和组织得以解决。如果流程是问题，TOGAF\
  \ 模型是最好的采用方法。FEAF 是分析最复杂且相互关联的企业的良好框架。如果愿景是主要问题，Gartner EAF 是最有效的开始方式。为了根据这些框架如何解决组织的独特需求和情况来评估它们，掌握对组织的透彻理解至关重要。\n\
  \nTOGAF is marketed as an EA methodology and framework, and it is distinct from\
  \ the Zachman Framework in that it provides implementation guidelines for creating\
  \ artifacts. It places a greater emphasis on methodology and process. The TOGAF\
  \ Certification Program has gained traction among enterprise architects, most of\
  \ whom strive to become TOGAF-accredited.\n\nTOGAF 被宣传为 EA 方法论和框架，并且与 Zachman 框架不同之处在于它为创建制品提供实施指南。它更强调方法论和流程。TOGAF\
  \ 认证计划在企业架构师中获得了认可，其中大多数人努力成为 TOGAF 认证。\n\n\n\nTOGAF 在定义通用语言方面有两个重要组成部分：内容框架描述了为支持架构而产生的关键制品集合，而技术参考模型（TRM）则为通用平台服务提供模型和分类法。\n\
  \n## 技术与风险管理\n\n风险管理计划的目标是识别预防和控制措施，以减轻与特定活动和有价值资产相关的风险。\n许多风险管理工作都过于狭窄、职能驱动且相互脱节。\n\
  因此，每个风险活动都使用自己的语言、指标和惯例，导致对风险的看法支离破碎。\n当风险之间没有联系且缺乏整体风险视角时，就无法预见、控制或管理相互依赖的风险。\n\
  为了应对风险管理中的互操作性和标准化挑战，本书提出了一种协调的方法，涉及风险管理、治理和 EA。\n它有助于将已识别的风险映射并追溯到 EA 中建模的企业制品，从而支持组织的战略优先事项。\n\
  顺便说一下，让我们对需要处理的两个风险层级做一些说明，如下所示：\n\n-   **风险初始层级：** 在确定和实施缓解措施之前，对风险进行分类\n-   **风险残余层级：**\
  \ 缓解后识别和分类风险\n\n## 风险管理步骤\n\n风险管理涉及多个关键步骤，我们现在可以介绍。\n\n## 风险分类\n\n任何 EA 活动都涉及风险，ADM\
  \ 也是如此。\n风险分类从管理角度来看很有用，以便能够尽快执行缓解措施。\n风险分类的方式之一是根据对组织的影响，这意味着具有特定影响的风险需要一定的治理层级。\n\
  除了时间（进度）、成本（预算）和范围风险外，还可能包括与客户关系、合同、技术、范围、复杂性和环境（企业）相关的风险。\n\n风险管理也可以通过识别架构域来委派。\n\
  虽然将风险分类为业务、信息、应用和技术是有用的，但企业 EA 部门应考虑采用或扩展组织特定的风险表达方式，而不是修改它们。\n归根结底，EA 风险就是企业风险，应以类似的方式甚至更严格的方式进行分类和适当管理。\n\
  \n## 风险识别\n\n成熟度评估和转型准备度评估将涉及大量风险。\n确定在转型期间应对风险的策略，然后识别风险。\n\n对于与架构交付相关的特定因素，可以使用\
  \ **能力成熟度模型（CMMs）** 首先识别基线状态和目标状态，然后识别实现目标状态所需的操作。\n如果未达到目标状态，则可以发现风险。\n作为风险管理计划的一部分，完成风险文档非常重要，某些项目管理方法论（如\
  \ **项目管理知识体系指南（PMBOK）** 和 **受控环境中的项目 2（PRINCE2）**）以及一些政府方法论中提供了模板。\n\n通常将其纳入这些方法论中，以执行应急计划、跟踪和评估风险水平、应对风险水平变化，并向利益相关者记录、报告和传达风险。\n\
  \n## 初始风险评估\n\n为了识别风险，有必要根据组织内部使用的量表按其频率和影响对其进行分类。\n制定初始风险评估将影响和频率结合起来。\n\n影响和频率的测量并没有硬性规定。\n\
  然而，指导方针基于现有的风险管理最佳实践。\n影响可使用以下示例标准进行评估：\n\n-   **灾难性** 意味着财务损失严重到足以导致组织失败。\n-  \
  \ **关键** 意味着 IT 系统生产力下降且无投资回报。它影响一个以上的 **业务线（LOB）**。\n-   **边际** 表示业务线出现小额财务损失，IT\
  \ 部门投资回报率较低。\n-   **可忽略** 意味着对组织提供服务或产品的能力产生相对较小的影响。\n\n频率可表示为 *频繁、可能、偶尔、很少或不太可能*。\n\
  一般而言，评估企业影响的潜在计划可包括以下风险类别：\n\n-   **极高风险（E）**：转型很可能失败且后果严重\n-   **高风险（H）**：转型工作的很大一部分很可能失败，导致无法实现某些目标\n\
  -   **中等风险（M）**：部分转型工作的失败将危及某些目标的成功\n-   **低风险（L）**：某些目标将无法完全实现\n\n组织可以使用通用的企业风险影响评估结构来评估这些风险的影响，如下所示：\n\
  \n企业风险影响评估\n\n| 影响 | 频繁 | 可能 | 偶尔 | 很少 | 不太可能 |\n|---|---|---|---|---|---|\n| 灾难性\
  \ | E | E | H | H | M |\n| 关键 | E | H | H | M | L |\n| 边际 | H | M | M | L | L |\n\
  | 可忽略 | M | L | L | L | L |\n\n图 4.1 – 在评估风险时，组织可以使用此评估图表来考虑和排序与其 EA 相关的风险\n\n组织可以使用多种风险缓解和评估方法，包括残余、监控和治理风险。\n\
  \n## 风险缓解与残余风险评估\n\n风险缓解策略包括识别、规划并采取行动将风险降低到可管理水平。\n它可能简单到监控、接受或承担风险，也可能复杂到需要完全冗余的业务连续性计划（BCP）（涉及所有相关的成本、范围和时间影响）。\n\
  \n风险评估必须系统且务实地进行。\n随着高影响风险按频率得到缓解，每个风险都必须单独处理。\n\n## 执行残余风险评估\n\n在为每个风险确定缓解措施后，重新评估其影响和频率，并重新计算影响，以确定缓解是否产生了显著差异。\n\
  资源密集型的缓解工作通常是必要的，花费大量资金却几乎没有或没有残余风险的做法应受到质疑。\n残余风险是指初始风险得到缓解后剩余的风险。\n\n## 风险监控与治理\n\
  \nIT 治理框架——以及可能企业治理——可能会批准残余风险，以及业务对残余风险的接受。\n为了确保企业解决的是残余风险而非初始风险，在接受残余风险后，必须仔细监控缓解措施的执行情况。\n\
  \n在 *G 阶段*，也称为实施治理，风险监控在此进行，风险识别和缓解评估工作表作为治理制品进行维护。\n通过实施治理，您将能够识别尚未得到缓解的关键风险。\n\
  对于这些问题，您可能需要重复一个 ADM 周期。\n\n实施 EA 时最后的考虑之一是如何理解、实施和管理协作和报告以跟踪变化的影响。\n\n业务所有者应评估其易受攻击性；这样，通过采取预防措施，可以防止因漏洞导致的数据泄露和\
  \ IT 中断。\n在过去几年中，一些最有前景的技术已经出现，包括云计算、AI、物联网和区块链。\n\n如果 EA 的运作方式不明确，利益相关者将不会支持它。\n\
  缺乏利益相关者参与的情况下，EA 项目往往以巨大失败告终。\n因此，管理层可能会质疑 EA 制品的价值，因为它们未在项目中使用。\n在启动 EA 项目之前，必须对所有利益相关者进行教育，使其了解\
  \ EA 的价值。\n\n*象牙塔* 企业架构师方法表明，您获得大多数利益相关者认可的机会极低。\n企业架构师不是向组织强加内容，而是领导 EA 流程。\n架构委员会代表架构中的关键利益相关者并管理其实施。\n\
  \n一位领导力不佳的首席架构师可能很好地理解 EA，但由于缺乏管理技能，即使组织结构良好、人员配置充足也无法克服关键问题。\n结果是缺乏进展或出现令人困惑的架构设计。\n\
  理想情况下，首席架构师的角色应由一位具备强大软技能——如热情、沟通和激情——并且受人尊敬且具有战略思维的人担任。\n\n早期未建立有效治理将对后期产生毁灭性影响。\n\
  所有与架构管理、合同和实施相关信息必须通过治理流程进行识别、管理、审计和传播。\n缺乏治理流程时，人们有风险形成自己的工作方式，且将没有指导架构设计的监控和审计工具。\n\
  企业架构师应抵制在更多架构内容可用后再设定治理流程的诱惑，而应同时开发治理和内容。\n\n沟通问题可能看起来不是大问题，但可能导致企业内部出现严重误解。\n项目的成功往往取决于对其价值和进展的良好且持续的沟通。\n\
  \n在某些组织中，EA 主要关注技术，其范围比技术架构窄得多。\n业务、信息和解决方案架构都包含在 EA 中。\n非技术人员做出技术决策是可能的，而当技术和业务目标不一致时，企业架构师变得过于被动和战术性。\n\
  \n\n\n先进行基线的 *当前状态* 架构。项目目标将决定这是否构成风险。当企业架构 (EA) 用于合并公司或创建新的企业愿景和战略目标时，不应使用此基线架构。规范性指导在\
  \ EA 中提供，但在当前状态架构中却缺失。因此，EA 的价值无法按时交付，且良好的未来状态架构也无法创建。\n\n## EA collaboration and\
  \ reporting\n\n通过 EA 工具，组织可以确定变革的需求和影响。集成建模捕捉了生态系统内部和之间合作伙伴、运营模式、能力、个人、流程、信息、应用和技术之间的关系和交互。这些系统充当中央存储库，用于捕获企业关注的制品及其相关流程的数据和元数据。\n\
  \n这些制品由模型表示，模型定义了它们之间的关系，并有助于描述和塑造企业的未来。EA 工具帮助 IT 部门和整个公司做出更好的投资决策。结合运营绩效数据，模型可以改善业务成果，并帮助更有效地构建和运营数字平台。\n\
  \n许多组织采取聘请 EA 服务专家协助的做法。其中一个组织是 **国际品牌有限公司 (IBL)** 集团，这是一家世界级 conglomerate，管理着涵盖消费零售、医疗保健、制药、分销和电子商务等多个领域的公司多元化投资组合。IBL\
  \ 集团的客户名单上的品牌包括强生、红牛、玛氏和家乐氏。\n\nIBL 正在进行一项关键任务的 SAP 数据迁移之旅。IBL 领导层希望使业务更具敏捷性，实现成本效益并改善利益相关者管理。停机导致交付延迟和收入损失。其与客户和供应链合作伙伴的关系面临风险。\n\
  \n该团队聘请了北湾解决方案公司，一家 **亚马逊网络服务 (AWS)** 首选合作伙伴，来指导其团队完成数据迁移。咨询团队分析了需求，创建了详细的路线图，并制定了分批迁移服务器组的计划。\n\
  \n与 NorthBay Solutions 的合作使 IBL 在迁移到 AWS 后实现了 30% 的性能提升，而 **总拥有成本 (TCO)** 并未增加。\n\
  \n## What are the features of EA software?\n\n时间线允许用户规划、制定策略并执行长期项目。它们还使用户更容易识别各个阶段并跟踪其进度。路线图以可视化方式展示策略——以及各种相关资源、部门和资产。此外，它们还可以帮助在项目实施过程中跟踪进度和监控标准。\n\
  \n除了分析功能外，用户还将获得分析生产力、资源使用情况和标准合规性的工具。利用这些信息可以改善对未来的规划和对相关任务和项目的策略制定。此外，协作是指在平台内对任务和项目进行协作。接下来是资产管理，它是指用于管理组织所有资产和资源的工具。\n\
  \n预算层级描述了预算结构各要素之间的关联方式。报告结构可以由管理员定义和管理，同时为每个报告设置访问权限。此外，业务系统的开发模型基于标准。\n\n管理工作区、支持同事、促进协作并在最复杂的项目中建立信心是\
  \ Sparx Systems 的方法。除了 TOGAF 和 Zachman，平台还支持用于 IT 软件和业务系统设计与实施的多个行业标准。作为附加优势，Sparx\
  \ Systems 的 Enterprise Architect 工具基于云，允许全球协作、模型仿真以及从需求到部署的完整可追溯性。\n\nSparx Systems\
  \ 以四种不同的版本提供其 Enterprise Architect 解决方案，这些版本针对不同的场景进行了定制。组织、团体和个人使用该软件来建模和管理复杂信息。可视化地连接结构和行为使组织能够构建对现状或未来状态的连贯、可验证的模型。\n\
  \n具体来说，Sparx 解决方案在 Enterprise Architect 中内置了工具，可帮助团队管理复杂性，如下所示：\n\n- 用于表示业务和战略概念的图表\n\
  - 可重用的模型模式和领域特定配置文件\n- 跟踪和版本管理\n- 基于角色的安全访问，以允许合适的人员参与\n\n组织可以正式地从设计到构建再到部署捕获和跟踪需求，并使用影响分析确定拟议的更改是否会影响初始需求，从而构建正确的系统。Sparx\
  \ Enterprise Architect 内置的需求管理功能可用于定义需求模型、跟踪系统需求、报告需求并分析拟议的更改。\n\n由于 Sparx Enterprise\
  \ Architect 精心打造的模式和可重用的模型结构，它将加快您的开发工作，并帮助您实现准确且出色的模型，这些模型利用了强大且经过验证的基础。您可以通过一次专注于一个建模挑战来减少噪音。在您专注于业务分析、战略或软件设计时，将其他技术和工具推到背景中。\n\
  \n## EA and digital transformation\n\n企业一直从战略规划中受益。然而，随着数字化转型的紧迫性和这些举措的复杂性，此类规划变得更加关键。这种复杂技术通过\
  \ EA 与业务背景相连接，以推动理想的业务成果。\n\n不同组织对数字化转型有不同的理解，其中包括技术趋势，如向云服务的转变、人工智能和 **机器学习 (ML)**\
  \ 的采用、先进的分析与大数据基础设施、物联网的兴起、**机器人流程自动化 (RPA)** 的兴起等。\n\n在企业和组织中，数字化转型被定义为能够以战略性和优先性的方式有效利用混合数字技术带来的挑战和机遇，以应对社会当前和未来的变化。通过转型，组织可以更快地对市场变化做出反应；这使它们能够尽可能灵活和动态。金融服务就是一个行业示例，在该行业中数字化转型已成为竞争的必要条件。\n\
  \n云为企业提供了以快速速度部署 **软件即服务 (SaaS)**、RPA 和 AI 的能力。因为许多项目需要在更快的速度下推进，数字化转型改变了企业架构师和\
  \ **企业项目管理办公室 (EPMOs)** 的一切。正如印刷机和互联网一样，这场数字革命可以与印刷术的发明相媲美。所有企业都在质疑商业模式，技术在过程中变得越来越重要，而在这一协作时代，企业在几乎每一次行动中都面临新的挑战。\n\
  \n## What does digital transformation mean for enterprises?\n\n每个人都受到数字革命的影响，因此公司必须找到新的协作方式以在这些时代取得成功。数字化转型有其自身节奏，不能将其视为一刀切的过程。企业拥有各自独特的\
  \ IT 遗留系统和流程，并受不同的外部监管要求和市场压力影响。成功企业将转型视为一个持续过程，因为行业成熟度会影响通往数字卓越的路径。在此过程中采用多种策略和节奏以满足业务需求。\n\
  \n对于各种规模的企业来说，随着商业模式受到质疑，技术的重要性日益增加。尽管技术从企业的边缘走向中心，但知识仍然分散。由于缺乏透明度，本地决策往往忽视了这些决策对整个组织的影响。当数字化转型由中央管理时更可能失败，这使得企业在全公司范围内共享分布式知识变得至关重要。\n\
  \n\n\n## 成功实施企业架构下的数字化转型\n\n作为一般规律，数字化转型极其复杂、个性化且成本很高。实施框架的第一步——这些框架往往会失败——是理解然后改进你的业务数据以及你的\
  \ IT 基础设施。在完成这一步后，你的 EA 就可以被确定并填入足够的数据。\n\n为了更好地理解对企业最重要的应用以及该应用相关的演进趋势，我们必须知道如何处理基础问题，找到业务中能够给出应用定义以及业务本身单独和共同的正确定义的人员。然后，以他们关于\
  \ IT 的回答作为起点，找到一个简单的模型来在此视角上创造透明度。\n\n在这种情况下管理应用组合极有帮助。在从业务角度了解 IT 应用的方式获得初步洞察后，你将能够开发用户组和业务能力的初步分类。将业务关键性报告的高层次评估与业务与应用的功能和技术契合度相结合可以证明是有效的。它成为业务和\
  \ IT 快速发现改进机会的宝贵工具。\n\n## 处理运营问题\n\n一旦你开始从事战略项目，运营问题就会分散你的注意力。EAs 深知保持最新操作系统、响应来自未知团队的紧急业务支持请求以及通过消除冗余来削减成本的挑战。主动识别这些问题以避免它们成为问题之前就分散注意力。你之所以分心，是因为你不知道哪些应用会受到操作系统或主要数据库更新的影响。当你知道你的顶级业务应用使用哪些主要技术——省略任何细节——时，你就可以做出主动的计算决策。\n\
  \n业务支持请求通常无缘无故而来；然而，在编制了你的应用组合全景图后，你将掌握主动权。具体来说，尝试评估业务认为哪些用户组和能力最重要，并专注于围绕这些组的难题。应用组合全景图包含你处理传统成本削减请求所需和使用的所有信息。你需要做的只是比竞争对手更快地抓住唾手可得的成果。一旦你列出了关键应用、最紧迫的改进措施并处理了任何运营问题，就该认真对待数据以及数据如何驱动你的业务了。通常，这是在两个不同的粒度级别完成的。在业务层面，驱动业务的关键数据对象是最重要的。除了利益相关者的需求应成为你的首要优先事项之外，无法再多说什么。专注于他们对公司的价值，他们将形成你迫切需要的联盟。\n\
  \n在创建了第一个业务价值之后，由于同行和管理层之间信任水平的提高，EAs 能够更进一步展望未来。为企业提供实施目标架构的方式是他们的责任。尽管如此，他们需要牢记，专注于创造业务价值和高品质数据对于避免谬误至关重要。\n\
  \n在本章结束时，我们得出结论，尽管 EA 经常被提出以帮助企业创新和转型，但它传统上更侧重于标准化流程和整合技术，而不是持续适应变化。新的数字环境需要更具适应性的\
  \ EA 概念化以实现预期影响。数字化转型对 EA 有影响，正如我们所探索的。现有的 EA 方法解决了组织内部的整合和一致性，但在与数字生态系统相关的复杂性方面往往力不从心。在数字环境中，我们认为需要超越动态能力概念的适应能力。\n\
  \n## 摘要\n\n企业架构师的角色是直面这些问题，通过提供管理并降低复杂性的路线图来应对，这直接有助于降低成本。企业架构师确保 IT 与业务目标和标准保持一致。\n\
  \n在 EA 中，主要目标是确保业务运营成本降低、组织和工作流程敏捷、组织内共享业务能力和访问权限等。鉴于这些目标，企业架构师最适合于并购、整合、风险评估、管理等多种使用场景。EA\
  \ 还包括治理原则，讨论业务战略如何通过 IT 实施得以实现。\n\n如果没有利益相关者的参与，EA 项目往往会以彻底失败告终。EA 往往只关注技术，其范围比企业架构窄得多。业务、信息和解决方案架构都包含在\
  \ EA 中。\n\n最后，数字化转型被定义为有效利用混合数字技术带来的挑战和机遇的能力。企业组织以战略性和优先的方式处理此事，以应对社会当前和未来的变化。\n\
  \n成功的企业将数字化转型视为一个持续的过程，因为行业成熟度会影响通往数字卓越的路径。总之，新的数字环境需要更具适应性的 EA 概念化以实现预期影响。数字化转型对\
  \ EA 有影响。\n\n在下一章中，我们将介绍 AWS 关于迁移到云的指导。我们将介绍如何为云迁移确定业务目标、评审框架、就绪评估阶段以及采用和交付框架。\n"
- "## AWS 指导性框架\n\n在向云过渡的过程中，包括 **信息技术 (IT)** 框架在内的多个部门和主要业务流程都会受到影响。提前规划对于成功迁移至关重要，但将业务目标转化为迁移计划需要时间。\n\
  \n本章详细讨论了规划和实施你的云愿景所涉及的步骤概览。\n\n本章将涵盖以下主题：\n\n- 了解云之旅的当前状态和目标业务成果\n- 为你的云迁移确定业务目标\n\
  - **亚马逊网络服务 (AWS)** Well-Architected 框架评审\n- AWS **迁移就绪评估 (MRA)** 阶段\n- **AWS 云采用框架\
  \ (AWS CAF)**\n- **AWS 参与交付框架 (AWS EDF)**\n\n## 了解云之旅的当前状态和目标业务成果\n\n无论你处于云之旅的哪个阶段，无论你刚刚起步还是处于中途，都还没有结束。无论组织处于云之旅的哪个阶段，都需要不断审查其战略，以确保其充分利用旨在提供的服务。由于技术和服务总是在变化，企业需要利用它们不断改进运营。改变旅程的路径是保持竞争力、发展业务并最终取得成功的关键。为了确保组织走在正确的道路上并提高其业务敏锐度，需要创建或审查云采用策略。\n\
  \n那些已经踏出第一步的人应审查与安全、可用性、自动化和成本管理相关的最佳实践，以确保其投资获得最佳回报。旅程已概述并制定了路线图后，下一步是勾勒解决方案并填补细节。\n\
  \n进入云不需要仓促，也不是 *云原生* 解决方案一定适合你的业务。以下是定义将为你的业务带来价值的云战略的一些关键考虑和步骤：\n\n- **阐明你的愿景**\n\
  \  在记录企业未来云使用愿景时，确保你的云战略考虑到组织的业务目标。考虑到你目标的长期视角以及云计算带来的相关好处，例如从专有解决方案转向 **软件即服务 (SaaS)**\
  \ 解决方案，将有助于业务内的决策并获得关键利益相关者的认可。\n\n- **制定战略和路线图**\n  公司认可愿景后，将其塑造成云战略的步骤就开始了。制定了一份全面的路线图，指导短期和长期工作。\n\
  \n- **了解你的资产全景**\n  在确定战略和评估效益时，了解业务中基础设施和软件资产的全面视图会有所帮助。维护和更换资产需要花费金钱，其预期使用寿命也应被考虑，以及定性方面，例如定制程度和迁移过程的复杂性。\n\
  \n- **着眼于改进运营模式**\n  组织在迁移到云时应考虑重塑其流程。无论流程是否在云中，即使技术更好，它仍然可能存在缺陷；仅靠技术无法使其变好。最好让广泛的利益相关者参与流程，以确定可在云中实现的改进。因此，可以避免抬升和转移系统，从而跳过稍后再次更改它们的需要。\n\
  \n  需要考虑的一个重要因素是在保留内部解决方案和定制功能与云原生方法之间的平衡。此外，还应考虑后端流程的简化，例如系统集成和 **业务连续性 (BC)**\
  \ 计划，以及员工和客户使用的流程。\n\n\n\n- **供应商选择**\n  建立云路线图始于选择合适的供应商。必须对供应商进行尽职调查，以确保他们提供最佳的解决方案、支持和成本模式。通过考虑供应商的韧性以及迁移流程的关键性，验证未来状态是否符合您的风险承受能力。随着云采用率的增加，监管机构可能会建议某些公司制定多云战略，以应对云故障的系统性风险。\n\
  \n- **资源管理**\n  云计算需要专业技能——例如项目管理、云架构、**用户体验 (UX)**、数据架构以及软件开发专业知识。投入运行后，新角色包括云安全专业人员和网络专家。为了满足资源需求，应注意在新员工入职和第三方支持与从已退役系统重新部署人员之间取得平衡。\n\
  \n- **收益与成本分析**\n  云计算具有许多优势，其中包括可扩展性、灵活性、复杂性降低和成本平滑。SaaS 部署到平台和基础设施的完全外包将带来不同的收益。无论情况如何，企业很可能会经历一些短期中断。为了提出完整的商业案例，了解短期和长期影响（包括数据转换和迁移需求）将非常重要。在考虑节省和预计成本时，请记住建模固有的挑战，特别是如果当前\
  \ IT 成本不够精细。\n\n- **云安全**\n  基于云的解决方案可能会增加组织的攻击面或入口点，并扩大其数字边界。在云环境中实施网络、数据和网络安全控制时，必须考虑它们在迁移前后如何部署。在境外存储或处理数据时，有必要考虑监管要求和第三方隐私问题，特别是与在国外持有或处理的数据有关。成功且安全的云部署还要求具备成熟的数据治理和数据泄漏控制流程。\n\
  \n- **云治理**\n  为确保云应用、数据、安全和控制措施获得足够的问责和所有权，IT 治理模型需要进行修改。重要的是减轻影子 IT 活动的风险，并确保云环境得到适当控制，例如许可管理和容量监控。\n\
  \n- **运营化**\n  新的工作方式需要通过培训和意识练习立即嵌入。在需要文化变革的情况下，例如实施敏捷项目管理实践，其重要性不容低估。在新环境中，应考虑持续的审计和监管要求——包括跨境数据共享。最后一步是对与核心业务领域相关的政策和程序进行审查和更新，例如备份和**灾难恢复\
  \ (DR)**、变更管理、服务交付和供应商关系管理。\n\n多个业务部门和关键业务流程将因变革而改变。因此，企业云之旅不仅仅涉及技术变革。\n\n## 云之旅的阶段\n\
  \n一个纳入业务目标的迁移计划耗时较长，但先进的规划对于成功迁移至关重要。本节将概述如何规划和交付您的云愿景。\n\n### 第 1 步 – 制定商业案例\n\n\
  踏上云之旅是一个重要的商业决策。在采用云基础设施之前，企业应评估其业务影响。云计算与传统 IT 设置不同，决策者应意识到这一点。评估收益、风险、合规性、安全性和数据控制对公司整体及其\
  \ IT 活动（尤其是）的影响至关重要。确定应首先迁移哪些系统和应用程序，以及云部署的预期成本和**总拥有成本 (TCO)**。\n\n### 第 2 步 –\
  \ 确定合适的应用程序\n\n每个应用程序的设计各不相同，因此云环境可能不适合每个应用程序。如果应用程序适合云，您可以简单地将其*迁移*和*转移*到云中。Lift-and-shift\
  \ 迁移是迄今为止最简单的迁移方式，因为无需修改代码，但有时应用程序在迁移到云之前只需要进行少量调整。当整个应用程序需要重写时，那就是最坏的情况。\n\n评估您的架构及其复杂性是确保效率的最佳且最具成本效益的方式。决定您是否可以完全迁移到云，还是最好只将少数应用程序迁移到云，同时保留其他应用程序在本地。\n\
  \n### 第 3 步 – 选择云服务提供商\n\n在分析和盘点完您的环境后，下一步是选择云环境。每个**云服务提供商 (CSP)** 都有自己的架构以及各自的特点、许可和支持能力。在评估云提供商时，您应提出以下问题：\n\
  \n- *您的工作负载是否与云的架构兼容？*\n  为了减少代码更改和开销，您可能更喜欢对应用程序修改较少的云环境。\n- *提供商如何实施云服务？*\n  大多数云厂商都有公共云和私有云产品。如果您计划实施多云或混合云架构，应检查供应商是否提供复杂云环境的能力。\n\
  - *是否可以使用您自己的现有许可证在云上？*\n  管理许可证可能复杂且昂贵。检查您现有的许可证是否与软件兼容，如果不兼容，请提前确定您需要哪种许可证以及其成本是多少。\n\
  - *在支持方面，迁移前后需要什么？*\n  有些云提供商提供工具但支持很少，而其他提供商则提供从开始到结束的帮助。\n\n除了安全、合规性和**服务等级协议\
  \ (SLAs)**之外，云迁移还有许多其他方面需要考虑，但您应首先考虑上述问题。\n\n### 第 4 步 – 初始采用\n\n为了迁移到云，大多数公司首先采用\
  \ SaaS。诸如**客户关系管理 (CRM)**、办公生产力工具（Office 365 和 Google Workspace）、会计、**人力资源 (HR)**\
  \ 以及 Slack、Asana 或 Trello 等协作工具等平台属于不太关键的应用程序。对公司成功至关重要的软件解决方案——例如仓储、生产和**企业资源规划\
  \ (ERP)**——通常与核心运营紧密集成。您可以通过实施**平台即服务 (PaaS)** 解决方案将整个基础设施迁移到云中。向基于云的解决方案的过渡通常需要试点和**概念验证\
  \ (POCs)**，这种方法称为*重新采购*。\n\n在初始阶段，**基础设施即服务 (IaaS)** 可用于非关键应用程序、测试和开发环境、批处理和数据归档。随着组织采用云解决方案，制定云治理策略。制定涵盖本地和云环境的业务流程，创建访问策略，并实施监控和安全工具。\n\
  \n\n\n### 第 5 步 – 完整迁移\n\n您的云迁移现在应该已完成并具备所有必要信息。然而，需要记住的是，执行过程中的很大一部分实际上是测试，而进行试点是实现这一目标的绝佳方式。需要持续运行的应用程序无法承受长时间的停机，尤其是关键任务型应用。为此，始终最好先测试您的计划，然后再推进。出现问题时，请制定恢复策略。\n\
  \n### 第 6 步 – 迁移后\n\n您的迁移已完成，但您的旅程尚未结束。我们现在可以开始比较迁移前后的性能。确保您将云性能与提供商的 SLA 以及您自己的性能目标保持一致。您应警惕新云环境中出现的问题，检测意外变化，并据此精细调整应用程序和基础设施。\n\
  \n## 云迁移挑战\n\n您在云迁移项目中很可能会遇到一些挑战，以下是一些克服这些挑战的建议：\n\n- **互操作性**\n  使现有应用程序能够与云环境交互可能需要重构或完全重写。应决定是按原样将应用程序的依赖项迁移到云中，还是过渡到基于云的对应产品。\n\
  - **可用性**\n  迁移过程中可能需要暂时关闭业务系统。迁移期间也可能发生意外停机。制定与云兼容的灾难恢复计划，以确保业务运营不会中断且客户不受影响。\n\
  - **数据安全和完整性**\n  除了数据丢失或损坏的风险外，迁移到云端还可能为黑客敞开大门。在迁移过程和目标云环境中，确定您可能面临的风险和合规问题，并相应调整安全策略。\n\
  - **云专业知识**\n  传统上，您的 IT 部门可能没有处理云环境的经验。数据中心专业知识和管理物理服务器的经验并不能直接转化为云环境。应招聘或聘请云专家来解决这些问题，例如培训团队并提供实验沙箱。\n\
  \n云迁移项目中每个阶段都会遇到挑战是不可避免的；然而，最重要的是您如何克服它们并变得比以前更强大。当您以优秀的资源和策略为迁移做好充分准备时，结果将极其有益。我们将在下一节更深入地探讨这一点。\n\
  \n## 云就绪的三种可能结果\n\n有效的战略规划以及现代工具和技术对于云迁移成功绝对至关重要。正确执行时，您将体验到以下积极成果：\n\n- 我们所称的 *采用阶段*\
  \ 的路径通常会被考虑大规模迁移到 AWS 的组织所遵循。重要的是在每个阶段评估您组织的就绪情况，并确定环境中哪些部分已足够成熟以进入下一阶段。\n\n  例如，项目阶段（或概念验证阶段）包括计划将首个工作负载迁移到云中的组织。在此阶段，不需要基础构建或统一的\
  \ AWS 账户。然而，在规划更大规模的迁移计划之前，必须正确执行标记。缺少此项，迁移可能会因基础问题而延迟。\n- 就绪评估的另一个主要成果是识别优势和劣势。基于优势，组织确定哪些团队和实践已准备好广泛采用。为了确保云迁移成功，这些领域不需要额外工作。劣势是需要解决的领域，以便能够进行云迁移。越早解决差距，迁移过程就越容易，项目延期的可能性就越小。\n\
  - 为了发展组织中的优势领域并缩小差距，您需要制定行动计划。为了使项目成功，应指定负责人并设定截止日期。为了推进您的云计划，我们建议聘请内部流程改进和组织变革团队。这些团队通常拥有分析当前能力、沟通和规划采纳的工具，这很有帮助。\n\
  \n评估组织的就绪情况、识别优势和劣势以及弥合团队之间的差距在成功的云迁移过程中发挥着重要作用。接下来，将讨论迁移的目标和目的。\n\n## 识别迁移到云的业务目标\n\
  \n只有在了解您为何迁移到云后，才能制定云迁移策略。以下是公司迁移到云的最常见原因：\n\n- 避免数据中心维护成本\n- 具有增强的可扩展性\n- 以更高能力提高弹性\n\
  - 增强团队之间的远程协作\n\n为了确保所有团队成员理解业务目的，获得对业务目标的一致认可也很重要。一旦了解切换背后的业务原因，确定迁移到云的内容将变得容易得多。迁移之旅涉及许多决策，包括规划迁移策略、选择\
  \ CSP、选择部署模型等等。沿途做出正确决策的唯一方法是拥有明确且切合实际的目标。\n\n就绪评估包括四个任务。让我们逐一查看它们。\n\n## 就绪评估会议\n\
  \n就绪评估始于安排会议并邀请所需与会者，例如以下人员：\n\n- **首席执行官** (**CEO**)\n- 首席架构师\n- **首席信息官** (**CIO**)\n\
  - **总经理** (**MD**)\n- **业务单元** (**BU**) 负责人\n- IT 财务\n- 安全负责人\n- 网络负责人\n- 应用开发负责人\n\
  - 基础设施负责人\n- 运营负责人\n- 应用负责人\n\n这些实体是组织中最大的利益相关者之一，他们为各团队的长期成功和效率做出贡献。\n\n## 进行利益相关者访谈\n\
  \n与执行团队进行一小时或两小时的访谈后，将进行与关键利益相关者或角色的访谈。启动会议是评估过程的关键部分，因为它启动了整个流程，您应努力做到以下几点：\n\n\
  - 在启动会议中，确定一套核心应用程序，这些应用程序将在未来两周内根据组织的业务优先事项进行评估。确保应用程序与这些优先事项保持一致。\n- 为了实现一致性并获得执行层对资源分配的承诺，举办为期两天的研讨会，让关键业务和技术领导者在优先事项上保持一致。\n\
  \n该研讨会将确定可通过现代化计划交付的最重要成果。为了实现既定目标，确定当前能力、架构和技能。建立云管理团队、云业务办公室和云平台工程团队作为运营模式中的关键参与者。\n\
  \n研讨会应由现代化项目经理以及数据专家、基础设施专家和现代化架构师主导。利益相关者在愿景研讨会结束时确定成功因素、方法论和典型成果。因此，组织将全面了解其在下一阶段的重点和承诺。\n\
  \n## 使用资源收集信息\n\n使用应用程序现代化问卷收集信息，分析收集到的信息，记录观察结果，并通过以下步骤确定下一阶段：\n\n1. 确定将进行再平台化、重构和替换的应用程序，并创建旅程指南，以便每个人都能理解生态系统。制定应进行现代化的工作负载的优先列表，然后为这些工作负载创建现代化蓝图。\n\
  2. 确保满足要求，因此在创建蓝图之前，完成所有先决条件。验证应用程序现代化的驱动因素包括测试其有效性、性能、集成和可服务性，并确定其应用采用路径。\n3. 执行准确的资产对齐。为支持优先工作负载，确定需要哪些拟议和现有资产。\n\
  4. 需要定义迭代和发布。需要确定现代化迭代的时间分配。在更改生产流程之前，决定执行哪些发布。\n\n\n\n- 5. 通过为每个领域识别适当的行动，确保您的组织已准备好进行现代化改造。对于您计划首先进行现代化的几个应用程序，您应确保迁移体验无缝。在此次首次尝试中，不要为所有应用程序提供行动计划。通过采用迭代方法，您将在保持质量和安全性的同时实现敏捷性和速度。\n\
  \n- 6. 设定截止日期并确定负责人。每个行动至少应提供一名负责人和截止日期。\n\n一旦需要重新平台化和替换的应用程序根据优先工作负载被识别并处理后，才会采取适当的行动。\n\
  \n## 进行复盘会议\n\n根据复盘会议中确定的发现和风险因素制定路线图，概述每个应用程序的业务计划和路径。以下是您可能分析的一些因素：\n\n- 对应用程序进行排序、排名和排序顺序\n\
  - 过渡期和目标运营模式\n- 与技术和法规相关的要求\n- 大量数据的迁移\n- 多种数据类型转换\n\n由此产生的观察和活动有助于为实现这些成果设定正确的基调。在复盘中，利益相关者应保持一致并就下一步达成一致，在此期间某些主题将深入探讨，然后进行实施和势头建设。\n\
  \n在评估应用程序就绪度的过程中，我们会产生以下内容：\n\n- 复盘演示文稿中观察结果和下一步的总结\n- 安排一次会议以审查输出并确定下一步\n- 估算并提出用例，包括\
  \ **工作说明书 (SOWs)** 和 **最小可行产品 (MVPs)**\n\n成功完成愿景研讨会后，扩展的现代化团队应启动为期 1 周的启动参与，其中包括以下内容：\n\
  \n- 使利益相关者群体保持一致\n- 确定实现业务目标的高层技术解决方案\n- 建立详细说明 MVP 开发里程碑和阶段的路线图\n- 利用 AWS Control\
  \ Tower 自动化，使用登陆区模板创建您的第一个云基础\n\n联合执行团队预计将与贵组织的高级业务和技术领导者沟通愿景并设定期望。尽管如此，大多数研讨会将针对现代化工作团队，其中应包括应用程序所有者、技术负责人、业务所有者和架构师。\n\
  \n借助 AWS，您的业务发展团队将能够获得技术现代化以及 **端到端 (E2E)** 支持，用于应用程序架构、设计、开发、移动能力、测试和协作解决方案。凭借合适的人员和合适的设置，您可以通过结合经过验证的流程、智能自动化、数据和模式以及开放标准来帮助现代化您的遗留应用程序。\n\
  \n## AWS Well-Architected 框架评审\n\n诸如 AWS 等云计算平台提供许多好处。您可以在不投资现场硬件的情况下以实惠的价格访问强大的\
  \ IT 基础设施。因此，您可以根据业务表现扩展 IT 运营和基础设施，并在低迷期间根据需要减少它们。\n\n您的企业将通过云计算节省时间和金钱，这将为组织内的其他计划释放更多资源。借助我们的\
  \ Well-Architected 框架，您可以充分利用 AWS 的云计算能力。AWS Well-Architected 框架评审可以帮助您判断是否正确遵循该框架，并以系统的方式审视您的云架构。AWS\
  \ Well-Architected 框架报告评估您是否遵循该框架以及可能改进的地方。\n\nAWS Well-Architected 框架提供建议，帮助优化组织在\
  \ AWS 上开发、维护和升级应用程序的方式。在 AWS 上构建系统时，您可以了解每个决策的利弊。以下是一些额外优势：\n\n- 通过应用 AWS 设计原则，随着时间的推移改进\
  \ AWS 工作负载\n- 为了确保性能和成本优化，规划未来工作负载至关重要，使其尽可能安全可靠，同时尽可能高效\n- 能够以云原生方式对架构做出明智决策，并了解设计决策如何影响您的产品或服务\n\
  - 您还可以使用 AWS 赞助的资金计划，通过利用每个已提交和获批工作负载的使用积分来增强您的 AWS 工作负载\n\nAWS 的 Well-Architected\
  \ 框架包含六个核心要素——运营卓越、安全、可靠性、性能效率、成本优化和可持续性，在此有更详细的描述：\n\n- **运营卓越**\n  以高性能方式支持工作负载的开发和运行，深入了解其运营。流程和程序的改进也能确保交付业务价值。\n\
  - **安全**\n  可以使用云技术通过云技术保护您的数据、系统和资产来改善整体安全态势。\n- **可靠性**\n  工作负载可靠性涉及工作负载在需要时能够正确且一致地执行其预期功能的能力。工作负载必须能够在其整个生命周期内进行操作和测试。有关实施可靠\
  \ AWS 工作负载的深入指南在此提供。\n- **性能效率**\n  随着需求和技术变化，效率是指有效利用计算资源的能力。\n- **成本优化**\n  在为业务提供最大价值的同时，以尽可能低的价格运行系统的能力。\n\
  - **可持续性**\n  随着时间的推移减少能源消耗并提高效率，以持续改善可持续性影响的能力。我们最大化预配资源的效益，同时最小化工作负载各组件所需的总资源。\n\
  \nAWS Well-Architected 框架中包含的六个核心要素在以下图表中呈现：\n\n![](img/16bfeb984938aba3d9334582c2cd6e69_145_0.png)\n\
  \n- 提高对架构最佳实践和设计原则的认识\n- 解决基础领域\n- 评估和评估架构的一致方法\n- 影响未来架构\n\n图 5.1 – 促进 AWS Well-Architected\
  \ 框架的因素\n\n架构团队应能够创建架构并遵循最佳实践。AWS 首席工程师的虚拟社区可以审查设计并帮助新团队了解 AWS 最佳实践。这将帮助新团队获得这些能力或现有团队提高标准。最佳实践由首席工程社区使其可见且可访问。午餐演讲是他们实现此目的的一种方式；例如，通过讨论最佳实践的真实案例。在演讲期间，新团队成员将能够观看演讲录像。\n\
  \n我们在 AWS 上运行互联网规模系统的经验导致了最佳实践的发展。最佳实践通常由数据决定，但 **主题专家 (SMEs)**——例如首席工程师——也至关重要。首席工程师确保团队随着社区工作的推进而遵循新兴的最佳实践。我们的内部评审流程将随着时间的推移纳入这些最佳实践，以及确保合规的机制。我们已将首席工程思维编纂到我们的\
  \ Well-Architected 框架中，它作为我们内部评审流程面向客户的实现。现场角色，例如解决方案架构师和内部工程团队，已被整合其中。通过使用 Well-Architected\
  \ 框架，您可以在可扩展的层面上利用这些学习成果。\n\n通过使用具有分布式所有权的首席工程社区的方法，可以根据客户需求形成一个架构良好的企业架构。**首席技术官\
  \ (CTOs)** 和其他技术领导者应在其整个投资组合中进行 Well-Architected 评审，以更好地了解风险。使用这种方法，您可以识别跨团队的主题，您的组织可以通过培训、午餐讨论或其他机制来解决这些主题，让首席工程师能够与其他团队分享他们对特定主题的想法。\n\
  \n\n\n## 通用设计原则\n\nWell-Architected Framework 识别出五项通用云设计原则。让我们逐一了解它们，如下所示：\n\n-\
  \ **停止猜测您的容量需求**\n  如果在部署工作负载时做出错误的容量选择，您可能会花费几乎所有时间在空闲资源上，或处理低容量带来的性能影响。这些问题可以通过云计算解决。您的容量可以根据需求自动向上或向下调整。\n\
  - **在生产规模下测试系统**\n  云使您能够快速设置生产规模的测试环境，成功测试，然后按需停用资源。虚拟测试环境的成本是本地测试成本的零头，因为您只在测试环境运行时付费。\n\
  - **自动化以便于架构实验**\n  您可以自动化工作负载以节省资金并避免人工操作，从而以低成本创建和复制它们。监控您的自动化将允许您审计所做的任何更改，并在必要时恢复到之前的参数。\n\
  - **允许演进式架构**\n  在传统环境中，架构决策通常在系统生命周期中作为静态的一次性事件实施，只有少数主要版本。企业及其背景做出的初始决策可能会阻碍系统随着企业发展而满足不断变化的业务需求的能力。具有自动化和按需测试的云解决方案最大限度地降低了设计更改影响最终产品的风险。企业可以将其用作随着时间的推移将创新纳入其系统的标准方式。\n\
  - **利用数据驱动架构**\n  您的架构选择可以在云中进行跟踪，以确定工作负载如何对架构选择做出反应。利用这些信息，您可以根据事实改进工作负载。您可以使用云基础设施中的代码做出明智的架构决策，并随着时间的推移不断改进它。\n\
  \nWell-Architected Framework 识别出的云设计原则在随着时间的推移提升架构决策方面发挥着重要作用。\n\n## 通过游戏日改进\n\n\
  定期安排生产模拟以检查您的架构和流程。结果，您将能够识别改进领域并获得处理组织内事件的经验。\n\n应始终如一地审查架构，不指责任何人，并鼓励深入挖掘。此过程中不应有审计；它应只是一次对话。其目的是在审查架构时识别关键问题和改进领域。审查将导致一系列旨在改善客户体验的行动。\n\
  \n承担团队架构的责任是每个人的工作。与其召开正式的评审会议，设计架构的团队成员应持续使用 Well-Architected Framework 审查其设计。当您的团队采用持续的方法时，随着功能的实施，架构可以得到更新，并在添加新功能时得到改进。\n\
  \n在 AWS 中，架构良好的系统和服务遵循 AWS 的内部评审流程。**根因分析 (RCA)** 专注于影响架构方法的设计原则；它还包括问题，以确保人们不会忽略\
  \ RCA 中经常出现的领域。我们在内部系统或服务出现重大问题时，或当客户联系我们时查看 RCA，以查看是否可以改进评审流程。在产品生命周期中，应在关键里程碑进行评审，设计阶段早期以避免单向门，并在服务首次发布前进行。添加新功能和实施新技术将在投入生产后继续增加您的工作负载。随着工作负载的增长，其结构会发生变化。为了使其架构特性在演进过程中不退化，遵循良好的卫生实践至关重要。如果您进行重大的架构更改，Well-Architected\
  \ 评审应成为流程的一部分。\n\n如果您将评审用作一次性快照或独立测量，则必须确保所有合适的人参与对话。评审时间通常是团队真正了解他们所做工作的第一个机会。当评审另一团队的工作负载时，有助于就另一团队的架构进行非正式对话，以获取大多数问题的答案。如果仍存在歧义或感知到的风险，您可以跟进一两次会议以获得清晰度或深入研究问题。经过审查问题后，您应根据业务背景制定优先事项清单。还需考虑这些问题对团队日常工作的影响。您可以更早地解决反复出现的问题，腾出时间用于创造业务价值。随着您解决问题的进展，评审将更新并观察架构如何改进。\n\
  \n在进行评审后，您将了解其价值，但您可能首先会遇到新团队的抵制。为了解决一些反对意见，您可以教育团队了解评审的好处。展望未来，我们将查看可能在后期影响评审的不同场景，如下所示：\n\
  \n*我们太忙了！（通常在大型发布前说）*\n\n以下是如何回应：\n\n- 如果您事先做好准备，大型产品的发布将顺利进行。通过评审，您可以发现是否遗漏了任何问题。\n\
  - 在产品生命周期的早期进行评审最重要，以便识别风险并制定缓解计划。\n\n> *没有时间采取行动来处理结果！（这通常在重大活动如超级碗之前说。）*\n\n以下是如何回应：\n\
  \n- 之前提到的事件无法改变。您是否愿意在不知道它们如何与您的架构相关联的情况下经历这些风险？即使您不解决所有问题，如果它们出现，您仍然需要处理它们的剧本。\n\
  \n> *我们不想让其他人了解我们是如何实施解决方案的！*\n\n以下是如何对此作出反应：\n\n- 如果您将团队指向 Well-Architected Framework，很明显框架中的任何问题都不会透露任何商业或技术专有信息。\n\
  \n由于与不同团队进行多次评审，您的组织可能会识别出主题性问题。如果您检查一组团队，您可能会发现他们在特定支柱或主题上存在问题。\n\n以下图表展示了 AWS\
  \ 云基础设施中的评审周期：\n\n![](img/16bfeb984938aba3d9334582c2cd6e69_148_0.png)\n\n图 5.2 –\
  \ AWS 评审周期\n\n作为您全面的评审的一部分，您需要识别任何可能有助于您解决这些主题性问题的机制、培训或首席工程谈话。\n\n## AWS MRA 阶段\n\
  \n与其仅仅描述您的工作负载，MRA 应记录您迁移到 AWS 的需求。它将帮助您预见风险、成本和必要的流程，以及潜在的迁移路径。执行 MRA 时，AWS 迁移就绪性得到增强，使您为每种情况做好准备并防止问题出现。\n\
  \n通过使用 MRA，您的公司可以做出明智的数据驱动迁移决策并解决您可能有的任何问题。在全面的 MRA 中，您应提出以下问题：\n\n- 我是否有充分的理由迁移到\
  \ AWS？在投入时间和金钱和精力进行迁移之前，先了解 AWS 是否可能不是您需求的正确解决方案。\n- 如果我将工作负载迁移到 AWS，我需要进行哪些重新架构？应为难以移植的应用程序的重新架构进行计划和预算。\n\
  - 在这种情况下，搬迁迁移是否有用？如果您的应用程序需要大量重新设计，请考虑采用不同的方法来使用 AWS。\n- 迁移到 AWS 的成本是多少？由于 AWS 仅提供计算资源和数据存储和传输的定价，您可能首先需要帮助估算迁移成本。\n\
  - AWS 迁移将如何帮助您的业务？AWS 的好处因您公司的计算需求而大不相同，因此您可能能够找到特定于您公司的好处。了解这些细节将使您更好地准备迁移。\n-\
  \ 成功迁移后，此工作负载的成本是多少？您需要考虑多个因素才能获得准确的成本估算。然而，为了正确预算，必须考虑这些因素。\n\n为了对云迁移做出明智决策，MRA\
  \ 至关重要。此外，回答这些问题需要一个涉及各种数据的复杂流程。\n\n来自组织不同部门的参与者将参与由经验丰富的架构师或顾问领导的互动研讨会。他们将收集有关\
  \ AWS 云采用框架的关键信息以指示云就绪性。研讨会后您将收到完整的简报和建议。您可以单独进行此评估，或将其与其他研讨会和迁移服务集成。\n\n## AWS\
  \ CAF\n\n要提供全面的数字化转型，您需要 AWS CAF。通过利用它，您将能够识别和优先考虑转型机会，评估和改进您的云就绪性，并在转型过程中迭代地发展您的路线图。让我们专注于数字化转型并强调数据和分析的使用。作为框架的一部分，确定了六个视角（业务、人员、治理、平台、安全和运营），共计\
  \ 47 项独立能力。\n\n\n\n成功实现数字化转型需要在四个关键领域保持一致：**技术**、**流程**、**组织**和**产品**。AWS 根据能力和转型领域推荐了四个迭代且增量的云转型阶段，具体如下：\n\
  \n- **Envision**：展示云将如何使您的业务受益。在此阶段，您将参与由引导员主导的互动研讨会，以确定转型机会。\n- **Align**：识别基础能力中的能力差距。此阶段也采用引导员主导的研讨会形式，并得出行动计划。\n\
  - **Launch**：通过生产环境中的试点项目展示增量的业务价值。\n- **Scale**：将试点项目扩展到期望的规模水平以实现业务收益。\n\n随着数字技术的\
  \ proliferate，变化发生得更快，许多行业的竞争也在加剧。随着维持竞争优势变得越来越困难，企业被迫每隔几年就重新发明自己。此外，公民的期望和行为正在推动政府机构改善数字服务的提供。在数字商业世界中使用数字技术有助于企业适应市场变化、取悦客户并加速其业务成果。\n\
  \nAWS 被数百万客户使用，包括初创企业、企业和政府，用于数字化并优化业务流程、迁移和现代化遗留工作负载，以及重新发明运营模式。他们的业务成果得到改善——包括成本降低、风险降低和运营效率提高——这是云驱动转型带来的结果。他们的敏捷性得到提升，并创造了新的收入来源，同时改善了员工士气和客户满意度。要有效地利用云进行数字化转型，您需要一套基础的组织能力（您的云就绪度）。如以下图所示，通过\
  \ AWS CAF，全球数千家组织通过识别这些能力并提供指导性建议，加速了其云转型之旅。在这里，您可以看到组织内产品转型的构成要素：\n\n![](img/16bfeb984938aba3d9334582c2cd6e69_151_0.png)\n\
