  - **管理系统** – 为在全生命周期管理数据实体的治理方面，企业应具备必要的管理系统和数据相关计划。\n\n\n\n- **人员** – 该维度识别企业在转型其基于数据的业务模式时所需的技能和角色。\n\
  \n重要的是企业要获得这些技能，并且如果缺乏此类资源和技能，则现有员工需通过明确的学习计划进行培训。\n\n## 架构存储库\n\n在本阶段，架构团队致力于理解组织架构存储库中与数据架构相关的现有资源。它特别关注针对组织行业部门的通用数据模型：\n\
  \n- Energistics® – 石油和天然气行业数据交换的标准\n- 国家信息交换模型（美国政府）\n\n来自零售技术标准协会的运营数据模型和数据仓库模型。\n\
  \n在本阶段，架构团队需要考虑架构存储库中哪些可用资源与应用架构相关。特别是与垂直行业相关的通用业务模型，以及常见的业务高层功能，例如电子商务、供应链管理等。请注意以下事项：\n\
  \n- **对象管理组（OMG）** 内设有多个垂直领域工作组，负责为特定垂直领域（如医疗保健、交通运输和金融）开发软件模型\n- 开放集团已为组织的 IT 部门开发了应用架构的详细参考模型\n\
  - 对于拥有 IT 部门的组织，开放集团已开发了应用架构的详细参考模型\n\n## Phase D – 技术架构\n\n寻求以新颖创新方式运营和改善业务的企业受新技术发展的驱动。在采用新技术时，技术架构有机会利用组织可获得的转型机遇。\n\
  \n## 新兴技术\n\n通过使 TOGAF ADM 具有灵活性，技术成为变革的资源和驱动力，而非 IT 部门。因此，技术架构可能成为交付业务能力和满足信息系统需求的驱动力。\n\
  \n## 架构存储库\n\n架构存储库被考虑用于识别相关的技术架构资源，特别是根据 IT 服务目录和已采用的技术参考模型而存在的 IT 服务。此外，与组织业务垂直领域相关的技术模型在市场上可用，例如\
  \ The TM Forum – 已开发出与电信行业相关的综合技术模型。\n\n## Phase E – 机遇与解决方案\n\n交付架构是 Phase E 的重点。目标架构与基线架构之间的所有差距都会被突出显示，任何变更都会根据需要分组到企业的投资组合中的工作包中。主要目标是确定一份符合利益相关者需求、企业业务转型准备度、现有机遇与解决方案以及可用实施约束的路线图。为了实现增量业务价值，我们必须专注于最终目标。\n\
  \n## Phase F – 迁移规划\n\nPhase F 包括与项目和投资组合经理协作制定实施和迁移计划。我们将在 Phase F 中完成不完整的路线图以及实施和迁移计划，并将其与剩余的变更活动集成。\n\
  \nPhase F 将制定最终的实施和迁移计划，该计划将基于架构路线图版本 0.1 包含投资组合和项目级细节。此时，应记录架构开发周期中的经验教训以促进持续改进。\n\
  \n## Phase G – 实施治理\n\n所有成功实施各种项目所需的信息都可以在这里找到。特定于您组织的流程的执行与 Phase G 并行进行，您在此执行实际开发。为了最大限度降低转型和迁移计划中的风险并实现业务价值和收益的早期实现，建议您将目标架构作为一系列过渡进行部署。除了推动组织实现其目标外，每次过渡本身都会产生业务收益。\n\
  \n## Phase H – 架构变更管理\n\n为架构增加业务价值是架构变更管理流程的目标。需要一个连贯的、经过架构设计的流程来管理对架构的变更。通常，此类流程用于持续监控治理请求、技术发展和业务环境变化。变更管理将在识别到变更时决定是否需要启动新的架构演进周期。\n\
  \n企业的架构治理流程与架构变更管理流程密切相关。此外，架构职能管理其与企业业务用户之间的合同。治理机构必须在 Phase H 中确定变更请求是否仅应作为架构更新处理，或是否需要启动新的架构开发方法周期。\n\
  \n## 需求管理\n\n灵活的方法对于应对不断变化的需求至关重要。架构本身就涉及不确定性和变化——利益相关者期望与可指定和规划的内容之间的灰色地带。因此，架构需求会随着时间的推移而不断变化。此外，架构还涵盖组织无法控制的许多驱动因素和约束（如市场条件变化和新立法），这会导致需求出现意外的变化。需求管理流程不处理、决定或优先排序需求。它们在\
  \ ADM 的相关阶段管理需求，即在整个 ADM 过程中管理需求。\n\n## 资源\n\n在需求工程领域，出现了大量用于管理需求的建议和流程。这些流程只是规定了成功的需求管理流程应实现的目标。TOGAF\
  \ 标准不强制规定任何特定流程或工具。为了发现和捕获业务需求，业务场景技术是一种有效且合适的工具。\n\n除了架构定义和实现之外，所有云架构开发活动都遵循迭代流程。组织采用这种逐步方法来将其架构与业务目标和机遇一起转型。\n\
  \n## 云架构开发方法\n\n在开发下一代云原生服务和应用的背景下，采用自上而下的方法最有意义，因为它们应从零开始设计、架构和构建。将 TOGAF 适配用于构建云架构包括特定步骤。\n\
  \n## 初步阶段\n\n*企业如何进行架构* 将在该初步阶段定义。确定要使用的框架并定义作为任何架构相关工作指南的架构原则非常重要。在企业内部重用架构资产是框架和架构原则不可或缺的一部分。已识别并建立了一种用于识别和建立架构原则的机制：\n\
  \n| Inputs | Outputs |\n|---|---|\n| - TOGAF<br>- 业务计划、原则和目标，以及业务和 IT 战略<br>- 治理和法律框架；架构能力<br>-\
  \ 合作伙伴关系和合同协议<br>- 现有的组织企业架构模型<br>- 企业架构框架可以包括以下内容：<br>&nbsp;&nbsp;o 架构方法<br>&nbsp;&nbsp;o\
  \ 架构内容<br>&nbsp;&nbsp;o 已配置和部署的工具<br>&nbsp;&nbsp;o 架构原则<br>&nbsp;&nbsp;o 架构存储库 |\
  \ - 企业架构<br>- 定制的架构框架，包括架构原则<br>- 初始架构存储库<br>- 业务原则、目标和驱动因素的重述<br>- 架构工作请求和架构治理框架\
  \ |\n\n为了建立架构治理，一旦确定了适当的方法论，架构原则就很重要。\n\n## A – 架构阶段\n\nPhase A 中将开发架构的高层次描述，以反映基于云的特征。将解决与数据安全、隐私、合规性、可扩展性、投资回报率和透明度相关的云特定问题：\n\
  \n| 输入 | 输出 |\n|---|---|\n| - 架构工作请求<br>- 业务原则、目标和驱动因素<br>- 企业架构组织模型<br>- 定制架构框架、方法、内容、原则和工具<br>-\
  \ 已填充的架构库；现有架构文档 | - 架构工作批准<br>- 精炼的业务原则、目标和驱动因素陈述<br>- 能力评估<br>- 定制架构框架<br>- 架构愿景，包括关键利益相关者需求<br>-\
  \ 架构定义文档，包括基线业务、数据、应用和技术架构。还包括目标业务、数据、应用和技术架构。<br>- 沟通计划 |\n\n## B – 业务架构\n\n云启用应用程序相关的业务目标没有变化。然而，在多租户场景中，业务用户本身是可变的。因此，这一视图可能需要调整以满足不同用户群体的需求。基于云的应用程序需要管理安全、隐私和其他质量属性，并且必须与企业资源同步。另一个需要考虑的重要方面是治理、可视性和可控性：\n\
  \n| 输入 | 输出 |\n|---|---|\n| - 架构工作请求<br>- 业务原则、目标和驱动因素<br>- 能力评估沟通计划<br>- 企业架构组织模型<br>-\
  \ 定制架构框架<br>- 已批准的架构工作说明<br>- 架构原则，包括已存在的业务原则<br>- 企业连续体架构库<br>- 架构愿景，包括精炼的关键高层利益相关者需求<br>-\
  \ 架构定义文档，包括基线业务、数据、应用和技术架构。还包括目标业务、数据、应用和技术架构。 | - 架构工作说明已更新<br>- 已验证的业务原则、目标和驱动因素<br>-\
  \ 细化的业务架构原则<br>- 包含内容更新的草案架构定义文档：<br>  - 基线业务架构<br>  - 目标业务架构<br>  - 解决关键问题的视角<br>-\
  \ 包含内容更新的草案架构需求规范：<br>  - 缺口分析结果<br>  - 技术需求<br>  - 更新的业务需求<br>- 架构路线图中的业务架构组件 |\n\
  \n## C – 信息系统架构\n\n云应用程序在实体关系建模方面可能与传统的本地企业对应物相似。尽管如此，逻辑数据模型的多租户方面将引入新的变化。本地应用程序的过程与数据安全视图的过程不同。除了数据集成之外，云计算可能会导致IT无法直接访问的信息孤岛问题。数据的分类和隐私也很重要，同样重要的是优先考虑数据迁移到云中以及数据保留在本地所带来的风险：\n\
  \n| 输入 | 输出 |\n|---|---|\n| - 架构能力评估沟通<br>- 企业架构组织模型<br>- 定制架构框架的数据原则<br>- 架构工作说明、架构愿景和架构库<br>-\
  \ 包含以下内容的草案架构定义文档：<br>  - 基线、目标业务和数据架构。<br>  - 缺口分析结果<br>  - 相关技术需求<br>- 架构路线图的业务架构组件\
  \ | - 架构工作说明<br>- 包含内容更新的草案架构定义文档：<br>  - 基线和目标数据架构视图<br>  - 包含内容更新的草案架构需求规范<br>\
  \  - 缺口分析结果<br>  - 数据互操作性<br>  - 相关技术需求<br>  - 更新的业务需求<br>  - 更新的应用需求<br>- 架构路线图的数据架构组件\
  \ |\n\n## D – 技术架构\n\n在评估当前能力并开发环境时，我们将使用TOGAF来指导我们的努力。应用架构视图中包含的几个传统组件将被**平台即服务\
  \ (PaaS)**抽象，从而使该视图与传统的企业应用不同。云架构将与本地架构不同：\n\n| 输入 | 输出 |\n|---|---|\n| - 架构工作评估沟通请求<br>-\
  \ 企业架构组织模型<br>- 定制架构框架技术原则<br>- 架构工作说明<br>- 架构愿景、架构库<br>- 包含以下内容的草案架构文档：<br>  -\
  \ 基线、目标和数据架构 – 详细和高层<br>- 包含以下内容的草案架构需求：<br>  - 缺口分析结果<br>  - 相关技术需求<br>- 业务、数据和应用架构组件。\
  \ | - 架构工作说明<br>- 已验证的技术原则<br>- 包含与所选视角相对应的基线、目标、技术架构视图的草案架构文档<br>- 包含以下内容的草案架构需求：<br>\
  \  - 缺口分析结果<br>  - B阶段和C阶段的输出<br>  - 技术需求<br>- 架构路线图的技术架构组件 |\n\n## E/F – 迁移规划\n\
  \n为了在云中部署服务，您需要了解云的可用资源。请记住，价值可以通过多种方式定义，它绝不意味着与总拥有成本和投资回报率相关的财务价值：\n\n| 输入 | 输出\
  \ |\n|---|---|\n| - 产品信息<br>- 架构工作能力评估请求<br>- 治理模型<br>- 架构框架说明<br>- 架构库<br>- 草案架构文档<br>-\
  \ 草案架构需求<br>- 现有项目和计划的变更请求<br>- B、C和D阶段的组件 | - 架构工作说明<br>- 架构愿景<br>- 包含过渡架构、数量和范围的草案架构文档<br>-\
  \ 合并的草案架构需求<br>- 能力评估：<br>  - 业务和IT能力<br>- 架构路线图<br>- 工作包组合<br>  - 过渡架构的识别<br> \
  \ - 影响分析<br>  - 推荐实施<br>- 实施/迁移计划 |\n\n## G – 实施治理\n\n请考虑在迁移期间纳入业务流程、应用程序、数据和数据库以及技术服务，以及安全和运营的实施。这在实施的G阶段发挥关键作用。各种实施项目在此管理，拥有成功所需的所有信息：\n\
  \n| 输入 | 输出 |\n|---|---|\n| - 架构工作评估请求<br>- 企业架构组织模型<br>- 定制架构框架说明<br>- 架构库架构文档<br>-\
  \ 架构需求<br>- 架构路线图<br>- 架构工作在E和F阶段识别请求<br>- 实施/迁移计划 | - 架构合同合规性评估<br>- 变更请求<br>-\
  \ 已部署的符合架构的解决方案，包含以下内容：<br>  - 符合架构的已实施系统<br>  - 架构库<br>  - 架构合规性建议<br>  - 服务交付建议<br>\
  \  - 性能指标建议<br>  - 服务等级协议 (SLAs)<br>  - 架构愿景<br>  - 更新的架构定义文档<br>  - 业务和IT运营模型 |\n\
  \n## H – 架构变更管理\n\n由于G阶段的结果，将建立新的企业架构基线，该基线将通过架构变更管理流程进行管理：\n\n| 输入 | 输出 |\n|---|---|\n\
  | - 架构工作请求<br>- 企业架构组织模型<br>- 定制架构框架<br>- 架构工作说明<br>- 架构愿景<br>- 架构库<br>- 架构定义文档<br>-\
  \ 架构需求<br>- 架构路线图<br>- 因IT和业务变更而产生的变更请求<br>- 治理模型实施<br>- 架构合同<br>- 合规性评估和实施/迁移计划\
  \ | - 架构更新<br>- 架构框架更新<br>- 架构工作请求<br>- 更新的架构工作说明<br>- 更新的架构合同<br>- 更新的合规性评估 |\n\
  \n\n\n因此，利用架构变更管理流程为企业架构设定新的基线。\n\n## 云生态系统参考模型\n该模型描述了如何通过至少一个新参与者或现有参与者的参与，在企业云生态系统中实现和促进架构能力。\n\
  \n## 云生态系统参考模型的业务支持服务和 ABBs\n本节的目的是讨论 IT 和业务分类法的互操作性。以下各节构成了一份全面的服务清单，这些服务将简化企业业务运营并降低复杂性。\n\
  \n### 会计和计费\n根据预定义的计费策略生成和管理云服务使用数据的账单。云服务提供商可能会允许消费者为多个订阅合并一张账单以符合批量折扣资格。程序还处理其他会计功能。\n\
  \n### 审计和报告\n审计和报告服务会保留一段商定时间内的所有活动记录，这将有助于未来的调查。这有助于降低破坏性业务流程和性能下降的风险。执行面向客户的业务运营活动的报告将被生成。\n\
  \n### 可用性和连续性\n该服务处理云服务提供商之间的冗余和工作负载迁移。主要目标是确保在云服务设计中选择高可用性实践和考虑因素。\n\n### 合规性和政策\n\
  企业治理和遵守适用法律法规是合规性和政策服务定义的一些活动。组织维护组织结构、流程、工具和业务政策以确保这些服务。\n\n### 消费者服务\n为了确保云服务消费者获得有效的关怀，并且有关他们与公司关系的信息得到妥善处理，消费者服务提供消费者信息的权威视图。\n\
  \n### 合同和协议\n关于合同生命周期和合同生命周期管理，合同和协议服务提供和管理云服务的各个方面。作为合同的一部分，云服务消费者会被告知使用云服务的适用政策和\
  \ SLA。\n\n### 计量服务\n云服务及其底层资源使用情况通过计量服务进行计费/收费。根据该计量系统提供的服务类型，适用一定程度的抽象。\n\n###\
  \ 订单服务\n云服务订单由订单服务管理。在这种情况下，云服务会被配置，服务生命周期服务会被编排，并提供计费和会计。\n\n### 服务需求\n根据过去的业务活动模式和未来的增长预测，该服务识别对云服务的需求。\n\
  \n### 订阅服务\n订阅服务为云服务提供商提供根据不同订阅模式收费的选项。订阅者可以选择固定费率、分层或按需付费订阅。提供商监控向其订阅者提供的云服务的分配、消耗和回收费。\n\
  \n## 运营支持服务\n企业云生态系统可以通过运营支持服务高效运行。\n\n### 容量和性能服务\n通过容量和性能服务优化云容量和性能。在云服务运行期间执行实时分析和自动工作负载调整。\n\
  \n### 事件和问题处理服务\n在该服务中，处理与服务相关的故障和事件并分析根本原因。数据存储在知识支持库中以供进一步分析。\n\n### 跨云连接服务\n\
  为了实现云服务之间的互操作性，跨云连接服务在不同环境之间充当无缝桥梁。连接云服务促进远程访问，允许用户跨越不同的网络边界并提高性能。\n\n### IT 资产和许可服务\n\
  IT 资产和许可服务控制与各个方面相关的云服务的许可协议。此外，一些提供商允许云服务消费者直接从软件/解决方案供应商处购买许可证，或根据需要租赁。\n\n###\
  \ 服务编排\n云服务编排允许以自动化方式管理云服务的容量和性能。这样，多云服务能够无缝协调。\n\n### 模板服务\n服务模板用于创建可重用实例。模板服务能够在云服务平台上自动部署和重新部署应用程序。\n\
  \n## 云安全服务\n存储在云中的数据、应用程序和基础设施由云安全技术、政策、控制措施和服务保护。\n\n### 数据保护\n尽管在当今世界，数据是无价资产，但如果不加以保护，大部分数据将毫无价值。我们需要在数据生命周期的每个阶段、所有数据类型以及数据生命周期的所有层面对数据进行保护。为了提供数据保护，必须实施各种控制措施，包括数据生命周期管理、数据泄露预防、知识产权保护、数字版权管理和加密服务。\n\
  \n### 企业数据管理\n为了在企业云生态系统之间安全共享信息，信息/数据是必须管理的关键企业资产。企业数据管理必须解决所有类别数据的生命周期所有阶段。数据治理、信息规划、IT\
  \ 架构、记录和归档配置以及隐私是企业数据管理的核心功能。\n\n### 治理风险和合规\n合规和治理涵盖、整合并协调各种公司治理、企业风险管理和监管合规活动。这些组成部分包括供应商管理、审计管理、IT\
  \ 风险管理、政策管理、技术意识和培训。\n\n### 基础设施保护服务\n数据安全是使用传统的纵深防御方法确保数据容器和管道安全的实践。通常，基础设施保护服务被视为预防性技术控制。大多数传统或非高级攻击可以相对有效地防御。\n\
  \n### 信息安全\n信息安全旨在实施适当的措施以消除与数据相关的威胁和漏洞。在国际企业中，由于不同国家的立法不同，数据传输和存储可能会有显著差异，从而影响通常与隐私和保密相关的信息安全问题。\n\
  \n### 政策和标准\n信息安全政策概述了应应用多少安全措施来保护业务。然而，通常技术解决方案不会在政策中提及，政策指定应做什么。为了使许多不同组件能够集成到系统中，安全标准是在组件级别的抽象。\n\
  \n### 权限服务\n作为身份和访问管理的一部分，权限服务确保用户拥有履行职责所需的访问权限。示例包括身份管理、身份验证服务、授权服务和权限使用管理。它允许在日益异构的技术中访问正确的资源并满足日益严格的合规要求。\n\
  \n### 威胁和漏洞服务\n威胁和漏洞管理涉及核心安全问题。企业必须跟踪和监控其资产，扫描已知漏洞，并通过修补软件采取行动。这称为漏洞管理。为了有效识别漏洞，还需要威胁建模和安全测试。\n\
  \n\n\n## 性能服务\n性能服务确保云服务的 SLA 得到遵守。它包括监控资源利用率、分析云计算环境中的资源性能，以及实时评估服务性能。\n\n### 资源健康监控\n\
  为了提供更好的性能、问责制和业务成果，资源健康监控生成云资源性能报告。该解决方案允许基于定义指标对 SLA 进行监控。\n\n### 服务健康监控\n服务健康监控允许用户查看其云服务的健康状况，创建云服务性能报告，并改善性能、问责制和成果。还支持\
  \ SLA 指标。\n\n### SLA 强制执行\n为了避免处罚，SLA 强制执行确保 SLA 得到严格执行。随着订阅续订流程的临近，与 SLA 相关的数据也可以被捕获并用于对合同和协议进行调整。\n\
  \n## 互操作性和可移植性服务\n云生态系统需要通过互操作性和可移植性服务与所有利益相关方实现有效集成。\n\n### 数据互操作性\n通过互操作性，云服务消费者可以无缝管理结构化和非结构化数据。语义一致的数据可以在多个企业之间共享。合适的语义标准可以基于云特定元数据，例如\
  \ Open Group 的通用数据元素框架 (UDEF) 或美国政府的国家信息交换模型 (NIEM)。云生态系统中的信息/数据可以被共享和重用。\n\n###\
  \ 服务互操作性\n通过云服务互操作性，数据和服务可以通过统一的管理界面在多个云服务提供商之间使用。\n\n云服务提供商能够使用 IaaS 互操作性无缝访问底层资源相关信息并配置工作负载。\n\
  \nPaaS 级别的互操作性围绕着无缝开发和部署平台服务以及对其进行许可。然而，SaaS 消费者期望其 SaaS 应用在多个渠道上支持关键功能。\n\n###\
  \ 数据可移植性\n数据迁移允许数据从一个云环境转移到另一个云环境，或从一台计算机转移到另一台计算机。另一方面，云生态系统内的数据同步是确保单个源数据集的所有重复目标数据存储之间一致性的机制。数据在一段时间内保持持续一致。\n\
  \n## 产品目录服务\n企业云服务被编目在云生态系统的产品目录中。\n\n### 变更和配置服务\n变更和配置服务确保云服务配置符合政策和合规性的变化。它们确保目录中提供的云服务配置正确。\n\
  \n### 服务目录\n云服务消费者可以订阅服务目录中列出的服务，并且目录信息可以轻松配置。云消费者可以通过使用自助云服务配置门户更轻松地描述和管理云服务。除了描述云服务提供商的能力外，服务目录还可以描述它们满足云性能评级的情况。\n\
  \n### 资源目录服务\n云生态系统通过资源目录服务管理底层云服务资源。\n\n### 变更和配置服务\n通过变更和配置服务，云服务根据不断变化的政策和合规要求进行配置。\n\
  \n### 资源目录\n资源目录管理有关支持云服务配置请求所需资源的信息。这些信息通过自助云服务管理进行捕获。\n\n在目录中，元数据表示资源特征，可供人类和机器进行进一步分析。\n\
  \n## 云生态系统的企业架构原则\n用于管理云服务生命周期的云生态系统参考模型中定义的架构构建块 (ABBs) 保持了企业在整个企业中使用 ABB 的企业架构原则。企业原则和在架构设计方面的共识应支撑这些原则。\n\
  \n### 自动配置的共享系统基础设施\n协作基础设施由共享和自动配置的计算资源支持。IaaS 云服务提供商的底层计算资源利用多租户环境以最大化利润。如果在 IaaS\
  \ 之间迁移工作负载做得正确，开销可以减少，并且可以满足 SLA。\n\n### 云解决方案旨在解决性能差异\n由于性能差异、延迟波动和网络故障，一些依赖公共网络和互联网协议\
  \ (IP) 的云解决方案是不安全的。云计算的特征是通过标准和公共互联网连接访问云服务的能力。云解决方案必须解决不可靠的 IP 服务和延迟差异至关重要。\n\n\
  云计算解决方案应提供无缝连接并满足与性能相关的 SLA。\n\n### 衡量和优化云解决方案的自动化方式\n云服务的衡量和优化可以通过使用计量和云服务解决方案实现自动化。\n\
  \n为了最大限度地减少对云服务的投资，云服务提供商和云服务消费者需要对云服务利用率的实时可见性。\n\n### 松耦合云服务\n云基础设施应在 SaaS、PaaS\
  \ 和 IaaS 之间松散耦合。动态和可扩展的云环境由云服务支持。提供多租户部署模型，并对云服务进行最少的定制。\n\n### 云服务抽象和控制\n提供云服务的抽象级别，使其能够在隐藏所有实现细节的同时安全地公开。服务敏捷性通过分离部署细节并在云服务内部隐藏实现细节来实现。\n\
  \n云服务的概念必须从实现细节中抽象出来。\n\n### 多租户\n多租户云必须支持租户和解决方案隔离。在每种情况下，无论存储介质如何，将每个客户端的资产与其它客户端的资产分开都至关重要。确保客户之间的资产安全隔离是云服务提供商的主要优先事项。他们的隔离控制机制似乎确实成功地控制了这一能力，尽管他们很难证明这一点。\n\
  \n## 摘要\n本章的全部内容就是了解 TOGAF 架构域并在 AWS 的背景下探索云生态系统。我们还回顾了参考架构和模型，并阐明了如何在 AWS 云转型中处理\
  \ TOGAF ADM 的每个阶段。目标是了解系统的非功能方面，包括安全性、可靠性、运营卓越、性能效率和成本优化。展望未来，我们将讨论并解释 WAR 与 TOGAF\
  \ 原则的对齐。\n\n本章还提到了 IT 和业务分类法的互操作性以及将简化企业业务运营并降低复杂性的全面服务列表。\n\n接下来，我们将找到以下问题的答案：在整个企业中如何选择\
  \ IT 计划，以及驱动 ABB 和解决方案构建块的策略是什么？通过对多个架构阶段和实现的深入研究，我们将讨论并解释基础设施实施策略，包括本地、云和混合。此外，我们将更深入地研究\
  \ SAFe，并了解更多关于如何将企业架构和 SAFe 对齐，以便为任何企业确定其如何满足 AWS 云客户的需求。\n\n\n"
- '# 第 3 部分 – SAFe 在企业架构与云中


  随着本书进入后半部分，重点主要在于学习 **规模化敏捷框架**（**SAFe**）的概念和术语，并理解 SAFe 原则如何应用于企业架构（EA）和云计算总体上，特别是
  AWS。云到云迁移也可能给结构松散的组织带来多重挑战，例如停机和适应新的云环境。将云应用程序带回本地数据中心涉及将其从云迁移到本地服务器。


  公司领导者和利益相关者往往在将 The Open Group Architecture Framework 付诸实施后发现难以推进。因此，在整个企业范围内选择
  IT 计划并决定推动架构构建块和解决方案构建块的策略至关重要。这些章节解释了基础设施的策略，包括本地、云和混合实施与应用。


  最困难的事情之一是以一种富有成效的方式开始旅程，从而带来创新和增长。本书的这一部分将确定云是否适合您。如果是，那么您应该从哪里开始？


  讨论 SAFe 方法、先决条件以及成功增值迁移成果的实现是这些章节的主要目标之一。一旦成功实施，云迁移的好处将非常明显，包括高可扩展性、更好的性能和出色的数字体验。


  总体而言，您应该期望了解更多关于云采用和迁移框架的知识。确保迁移成功在有效策略和生产力方面可以成为真正的游戏规则改变者。


  本书的这一部分包含以下章节：

  - *第 7 章，将敏捷框架与企业架构对齐并扩展*

  - *第 8 章，SAFe 在 AWS 云迁移中的实施*

  '
- '## 将敏捷框架与企业架构对齐并扩展


  为大型企业设计、如 SAFe 的敏捷框架，帮助公司应用精益和敏捷原则。根据 SAFe，适应性设计和工程实践是企业架构的关键组成部分。*这些实践帮助团队和项目在共享的技术愿景下协同工作。*
  架构师为这些新的敏捷组织提供战略指导、参考架构和技术标准。当它们结合起来时，有助于标准化团队的工作。通过将项目与公司标准对齐并打破信息孤岛，可以避免返工。


  您的企业架构是支持您组织的结构和流程的集合。它应具有灵活性，易于扩展，并能随着时间的推移而演进。企业架构的核心在于探索、识别和优化组织的架构生态系统。因此，企业架构师应具备合作和协作的能力，并与其它团队密切协作。随着大型组织采用
  SAFe，有意架构和涌现式设计，对其关键要素的更好理解的需求也在增长。随着企业架构师与开发团队的互动日益频繁，他们的角色和实践也可能发生变化。


  本章涵盖的主题如下：

  - 技术选择与使用

  - 架构策略

  - 体现精益敏捷架构

  - 为 DevOps 和按需发布进行架构设计

  - 将 SAFe 应用于企业架构和云


  ### 技术选择与使用


  Gartner 预测，60% 的组织将在 2023 年依赖 EA 来引领数字创新的业务战略。EA 在规划、设计和分析中的使用已被当今的企业广泛采用。通过 EA，公司可以扩展其业务组合，实现
  IT 与业务的融合。借助 EA 的数据管理，企业可以预测未来模式，从而提高盈利能力并降低成本。


  在过去十年中，行业开发了各种趋势、架构、语言和工具。正因如此，由于技术变化速度极快，今天出现了许多新兴的 JavaScript 框架。看起来，架构师选择技术变得比以往任何时候都更困难，无论是库、框架、编程语言还是厂商产品。


  当内部架构师无法达成共识时，企业聘请顾问架构师也很常见。拥有众多产品、项目或整个业务线的公司需要技术架构师。大多数时候，做出影响多个团队的决策会很具挑战性。它有被高度政治化的风险，尤其是在选择厂商产品时。在这种情况下，企业甚至可能需要发布请求建议书（RFP）以获取厂商的回应。在详尽的选型过程中，多方实体提供了在技术选择中需要考虑的要点。架构师对某些决策为何做出以及这些决策如何使工作受益的深刻理解至关重要。以下列表讨论了几个高层问题。不同组织对数字转型的定义不同。然而，它通常涉及以下内容：

  - 演进的技术趋势（即云服务）

  - **人工智能（AI）** 和 **机器学习（ML）**

  - 高级分析和大数据

  - **物联网（IoT）**

  - **机器人流程自动化（RPA）**


  有计划的战略行动历来对业务成功至关重要。随着我们进一步进入数字时代，为这一转型做计划变得比以往任何时候都更关键。通过实施转型，组织变得更加敏捷和动态，能够更快地响应市场变化。公司可以使用
  **软件即服务（SaaS）** 等基于云的服务以及实施 AI 和 RPA 来适应快速增长。由于大多数项目需要以更快的速度推进，数字转型为 EA 促进者提供了极大的帮助。


  将应用程序组件分配给技术架构代表了软件/硬件组件的关联。组装和配置后，它们构成了企业的大部分技术基础设施，该基础设施主要在市场上采购。通过检查技术架构，您可以看到各个应用程序组件将如何实现和部署。可以及早研究信息系统演进路径不同阶段之间可能出现的问题。技术架构的目的是解决与硬件和信息系统管理相关的后勤和位置问题。此外，设计良好的技术架构可确保交付的应用程序组件无缝集成。


  ### 在技术领域采用规模化敏捷


  在开发价值流中，软件、硬件、电气、电子和其他技术领域的专业团队推动运营价值流的开发。他们为内部和外部客户的解决方案的定义、开发、测试和部署做出贡献。通过以客户为中心和设计思维方法，可以为合适的客户创建合适的产品，而敏捷性则提供了快速应对市场变化和新兴机会的灵活性。


  软件行业拥抱敏捷有着悠久的传统。事实上，SAFe 为从业者提供了在任何企业规模级别部署它的灵活性。我们的高级兴趣或价值领域包括行为驱动开发（BDD）、测试驱动开发（TDD）、敏捷测试、重构和尖峰。规模化敏捷软件架构结合了价值观、实践和合作伙伴关系，专注于支持演进式设计和架构。DevOps
  体现了随着时间的推移不断更新系统架构的理念，同时支持其用户的需求。大规模前期设计（BUFD）和阶段门控流程涉及大量返工和重新设计，导致延迟。


  敏捷开发实践得到鼓励协作和设计简化的敏捷架构的支持。敏捷架构也能够实现测试、部署和发布能力，就像敏捷开发实践一样。


  ### 将 SAFe 应用于硬件


  未来十年或更长时间，网络物理系统构建者将由硬件创新定义，而那些不能快速开发硬件的人将处于竞争劣势。为了验证开发者的更改，必须考虑系统的更大背景。硬件开发过程中创建的物理部件具有高材料成本和长交货周期。在这种情况下，硬件验证通常在产品开发周期的后期进行。




  硬件开发的第一步是使用设计工具（例如电气和机械 CAD）开发模型。虚拟模型现在被许多组织用于分析和仿真，以便在更大的系统环境中提供早期反馈。在制造之前，工程师可以确保其设计与利益相关者兼容并与利益相关者一起验证它们。物理部件只能用于验证设计的某些方面。


  为了获得早期反馈，增材制造和 3D 打印已被广泛使用。除了用于生产零件外，在需要更高变更频率和更低产量时，它们也可用于创新。也可能通过降低质量和可靠性要求来加快制造时间。与可承受多年恶劣环境的生产零件相比，开发零件通常在受控环境中运行，并在下一次修订后被替换。


  系统设计的一个重要方面是将功能分配给各个元素。随着网络容量和成本的增长所实现的空中更新的出现，行为正迅速转向可编程组件。小更改在上下文中进行测试、集成和验证，然后使用持续集成交付。硬件功能的发展始于虚拟设计。由于自动化了持续集成活动，开发人员可以在这些环境中更快地获得更改的反馈。除了构建系统之外，开发人员还必须构建持续集成环境。


  ## Balance intentionality and emergence


  在架构的早期阶段，遵循传统方法，生成大量文档，并做出未经验证的决策。将意图性和涌现式设计结合起来是使架构与业务需求保持一致的另一种解决方案。开发人员创建一个系统，以便在架构出现之前看到什么有效。


  ## Intentional architecture


  这定义了一种旨在有目的且经过规划的架构策略和举措。它们为同步跨团队解决方案的设计和实施提供指导，同时提高性能和可用性。


  ## Emergent design


  这实现了一种完全增量和演进的策略。随着系统的构建和部署，开发人员和设计人员可以实时响应用户的需求。通过这种平衡，敏捷架构可以用精益敏捷方法解决企业解决方案的复杂性。除了支持当前用户外，系统还已演进以满足未来的需求。总体而言，涌现式设计和意图性为未来业务价值的生产提供了技术基础，这些生产不断构建和扩展架构跑道。


  组织的价值不可能通过其职能孤岛流动。大多数工作都是按照职能技能来组织的。例如，火箭喷嘴将具有由硬件、固件和软件组成的机械结构。根据传统方法，每个部分都是独立开发的。为了验证和确认，所有组件必须在最后集成在一起，这使得调整变得非常困难。敏捷开发组织跨职能团队以增加协作并最大限度地减少延迟：


  ![](img/16bfeb984938aba3d9334582c2cd6e69_191_0.png)


  图 7.1 – 团队结构


  前一张图片中的缩写如下：


  - HW – 硬件

  - SW – 软件

  - FW – 固件

  - ART – 敏捷发布列车


  前一幅图展示了三种同等可行的方案，以及它们最有用的情况。创造性环境可能不需要整个团队的协作，领域可以独立工作。然而，团队通过作为同一 ART 的一部分共同工作并通过管理依赖关系和实施
  SAFe 实践以频繁集成而保持一致。在其他环境中，可预测性更高。利用定义关键集成点的共同路线图，团队可以在其系统组件上独立工作。这些团队不一定在同一装配参考模板上，组织也可能随着时间的推移而演变。尽管如此，早期产品开发需要更全面的反馈。


  敏捷团队利用跨职能技能在每次迭代中最大化价值。机械工程师可以更新固件，或软件工程师可以修改 CAD 设计并重新运行分析测试。不幸的是，在许多组织中，深度职能技能得不到奖励。通过使用敏捷方法，构建创新产品所需的技能得到拓宽，同时不会牺牲专业知识。


  ## Architectural strategy


  企业架构涉及配置计算资源以服务于公司的业务目标。将公司的战略目标与其现有业务流程、其生成的数据和信息以及支持的基础设施保持一致，是该过程成功的关键组成部分。通过生成此类报告，可以记录公司的当前技术，以及未来技术将如何改变或融入当前技术。


  在大多数情况下，在数字化转型的时代，业务变化也是技术变化。企业架构师还发现，战略和变更规划过程本身也可以从企业架构师的工具箱中获益很大。企业架构师构建模型并使用这些模型生成可操作的见解的能力，可以在战略的制定和这些举措的执行中发挥关键作用。即使传统规划流程不包括这些模型，它们也迫使比传统流程更高的沟通水平。


  如果有幸被选为规划者，EA 必须了解其价值的来源至关重要。因此，您应该与业务战略团队和项目管理办公室（PMO）团队协同工作，而不是与他们竞争。将一个想法转变为全面的
  EA 战略需要时间和大量的对话。随着技术进步和优先事项的变化，EA 的旅程将随着时间的推移而演进和成熟。


  ## Solutions architecture strategy


  对于每个新的 IT 项目来说，拥有解决方案架构都非常重要，该架构使企业能够根据其 IT 战略实施技术解决方案，专注于特定的一组业务需求。解决方案架构师在考虑所有功能和非功能需求的同时，基于特定问题构想理想的解决方案。建立明确的指导方针可以改善技术团队的组织和管理。解决方案架构师不仅在与开发团队的协作中发挥关键作用，而且在更广泛的企业中也发挥关键作用。EA
  将战略愿景转化为可操作的解决方案，因此与他们合作至关重要：


  - 解决方案和 EA 专注于不同的任务，无论它们的相互依赖性和最终目标如何——即通过智能使用技术为企业创造更多价值。EA 顾名思义，提供了对企业的全面视图，包括所有业务实体及其与技术和应用程序的关系。应用程序生命周期和
  IT 战略的定义是 EA 的关键关注点。

  - 除了最大限度地降低成本、消除冗余技术和管理数字化重新设计的影响外，这些战略还旨在降低风险。要使目标架构成功，必须在整个组织的层面上理解它。公司的 EA 必须保持对组织的深入了解，因此他们的关注细节相对有限。因此，IT
  基础设施的技术方面对他们来说意义不大。

  - EA 通常处理技术问题，但解决方案架构师也执行特定任务。他们都无直接负责实施新的 IT 解决方案。他们的角色是确保技术架构师能够正确实施它们。解决方案架构师和
  EA 共享类似的责任。与 EA 相比，解决方案架构专注于详细设计。

  - 技术架构师和 EA 协同工作以创建成功的企业愿景。为了最大化公司通过技术使用产生价值的能力，这两个要素至关重要。尽管企业和解决方案架构师的职责存在重叠，但他们的职能不同，彼此依赖。


  基本上，EA 开发抽象战略，后续由解决方案架构师接手将其转变为实际解决方案。


  ## Infrastructure strategy


  在架构领域，基础设施是一个人们用来描述各种事物的术语。基础设施架构是促进企业范围内无边界沟通的定义性概念。随着向电子服务聚合的进展，电子服务的内容将扩展。


  对核心系统路线图上的任何系统的成功而言，彻底而战略性的 EA 审查至关重要。理想情况下，设计良好的企业基础设施战略将概述实现公司业务目标的关键系统并确定其成功。没有对现实的仔细考虑，您可能会沉迷于可能构建的东西的可能性。大多数
  IT 和基础设施战略都有所谓的象牙塔方法——当 EA 在架构评审中引入他们添加的一切时。从实际角度来看，它未能强调团队应该做的一切。审查关键路径应用系统的企业从采取更务实的方法中受益匪浅。


  此外，基础设施应用程序可能包括通用或共享的数据。业务架构还包括组织间共有的元素，例如业务原则、通用业务流程等。TOGAF 的架构开发方法（ADM）旨在解决与基础设施架构正交的架构域。基础设施架构在
  ADM 描述中没有明确标识。尽管如此，使用 ADM 这样的设置是完全可行的。以下是 ADM 如何用于创建基础设施架构的简要概述。




