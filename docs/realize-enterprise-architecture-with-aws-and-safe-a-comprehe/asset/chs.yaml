  越来越多的大型组织正在采用这一框架，该框架整合了诸如架构跑道、有意架构和涌现式设计等概念。EA 的角色将发生变化，以便更好地与开发团队沟通。此外，我们还将探讨
  EA 如何适应这些敏捷组织。


  ## SAFe 与业务架构

  价值流是一种满足客户需求的方法，被纳入业务架构中。组织可以根据以产品为中心的思路创建能够为客户创造价值的产品。根据 SAFe 的定义，运营价值流是指提供终端用户价值的价值流。


  识别所需或缺失的业务能力是通过将其与价值流的各个阶段关联起来确定的。公司的 EA 根据业务能力对客户的价值、其复杂性以及与战略目标的一致性来评估业务能力。通过将业务能力与用户故事关联起来，敏捷开发与战略目标的一致性也得以实现。


  ## SAFe 与架构跑道

  架构跑道是 SAFe 框架中的关键组成部分。在 SAFe 框架中，程序增量以 8 至 12 周为周期进行衡量。通过利用使能器，可以延长跑道以支持未来的业务功能。


  实施基础设施、遵守法规以及开发架构都是使能器。确保为下一个程序增量开发的业务功能能够正确落地是它们的职责。因此，“跑道”一词指的是飞机降落的跑道。EA 创建使能器史诗，其中包含有关应用架构、基础设施和技术建议的信息。我们将它们放在看板上，以便由开发团队实施。


  ## 有意架构与涌现式设计

  随着开发的快速推进，敏捷团队必须设计有助于实现其目标的架构，根据“最好的架构、需求和设计源于自组织团队”的说法。


  涌现式设计是自发工程解决方案的结果。模式、原则和权衡塑造了软件的演进。然而，EA 创建有意架构。高层次、基于计划的架构旨在协调跨团队角色。这就是基础使能器的作用。为了跟上开发过程中发生的变更，有意架构必须与涌现式设计进行协调。


  ## EA 角色的演变 – 确定与开发团队互动的最佳方式

  EA 应该是业务合作伙伴，在敏捷环境中协调和整合监管政策和监管约束。通过与开发团队密切合作，他们为敏捷开发构建架构基础。此外，他们还促进敏捷实践的采用，并确定何时涌现式设计或有意设计最为合适。


  ## 敏捷环境中 EA 实践的演变 – 赋予本地团队更多权力

  正如麦肯锡《敏捷组织的五大标志》文章所述，管理团队目标与敏捷团队目标之间的差距是从传统的自上而下组织转变为敏捷组织的關鍵。


  传统上，管理者通过告诉员工应该做什么来执行需要完成的工作。敏捷组织必须让客户感到愉悦。工作由自组织团队以迭代和自组织的方式完成，并且直接征求客户意见。透明度和持续改进被视为最重要的价值观。在这种新的
  EA 方法下，集中式管理将让位于分散式管理，本地团队将拥有更多控制权。企业治理团队在公司层面为整个组织提供方向。


  除了识别企业治理目标和监管约束外，企业治理团队还评估和规划未来的业务能力。这是为了提高安全性并实现规模经济。


  成功的敏捷架构师应采用以下策略和实践：


  - **Define the architectural vision:** 架构师与业务和战略目标合作以定义架构愿景。他们考虑的因素包括范围和预算，这些因素也会决定技术方向。会设计出适合企业的可测试且可适应的架构。实现这一目标要求架构师了解利益相关者的目标、约束以及需求。架构师应能够在与冲刺团队密切合作的同时，对架构和设计进行建模和文档化。

  - **Choose the right technologies and tools:** 敏捷使团队能够选择合适的工具和技术。除了协助团队有效利用它们外，架构师还可以提供护栏、建议、原则和约束。敏捷架构师应参与决策并在必要时做出贡献。

  - **Plan for change:** 无法应对变化的架构是脆弱的，而非敏捷。规划变化、有效管理变化以及了解相关成本是敏捷架构师的特征。


  不建议架构师对自己的想法进行防御。他们应拥抱变化并对反馈持开放态度。然而，在接受变更之前，设计师应考虑变更的影响和成本。如有必要，他们应提出替代解决方案。


  - **Socialize, collaborate, and motivate:** 与团队成员建立关系对敏捷架构师至关重要。敏捷架构师需要具备社交能力才能取得成功。因此，敏捷架构师需要能够在团队内部和跨团队进行沟通和协作。为了了解利益相关者的期望、需求和约束，敏捷架构师必须与他们进行沟通。团队的每个成员都需要了解架构，以便能够进行沟通。获得团队成员的尊重和信任的能力对于敏捷架构师的成功至关重要。协作和共享知识对敏捷团队的成功至关重要。


  成为敏捷架构师并不需要你成为问题解决者。敏捷架构师应指导、引导和激励人们，使他们能够自行解决问题，而不是替他们解决问题。架构师应与团队在设计决策上进行协作。通过与团队一起在产品待办事项列表上工作，设计思路将不断演进。


  - **Lead from the front:** 在选择工具和技术方面，敏捷架构师应充当布道者，影响团队、向团队传达设计和架构，并在为团队提供方向时发挥带头作用。敏捷方法比传统的瀑布模型更能处理不确定性、变化、利益相关者互动和风险管理问题。他们通常扮演多种角色，但对团队敏捷工作能力最为关键。


  在象牙塔中创建架构和设计规范的架构师无立足之地。架构师应密切参与敏捷流程，了解团队的目标、需求和约束，并从前线领导。作为敏捷架构师，你应能够为业务交付价值、最大化利益相关者价值并管理变化和复杂性。


  ## 为 DevOps 和按需发布而架构

  在持续部署的背景下，开发和运营正成为软件开发的有吸引力的方法。通过这种方法，两个团队之间的联系更加紧密。CD 的定义是将新版本快速投入生产。随着 DevOps/CD，架构师面临着新的挑战，这些挑战影响着他们的设计决策以及在组织内的职责。DevOps
  和 CD 的采用会对架构决策过程及其结果产生深远影响。为了了解如何做到这一点，进行充分的研究非常重要。


  根据客户的要求，按需发布会将新功能部署到生产环境并立即或分批发布给他们。按需发布由三个主要方面支持，以确保新功能在生产环境中持续准备并得到验证。对于企业来说，要实现敏捷的真正益处，在终端用户在其环境中运行解决方案时，在正确的时间发布正确的价值至关重要。时机和性质




  产品发布是至关重要的经济驱动因素，应予以审慎考虑。CD 的目标是在新功能开发完成后立即发布，以便用户能够立即利用新能力。实际发布往往是解耦的且按需进行，会在特定时间针对特定用户发生，当他们需要时或对公司而言有意义时。


  在确定发布系统的哪些要素以及联系哪些终端用户时，采用以客户为中心的方法。发布应基于市场节奏和事件，并与客户时间框架保持一致。此外，在发布这些要素时，应针对特定的客户细分群体推出新功能或整个系统。


  通过解耦发布，企业敏捷性得到进一步增强，尤其对于服务外部客户的价值流而言。促销活动可以针对市场的特定细分群体进行。此外，解决方案的时机和销售的功能也可以更有信心地进行结构化。


  按需发布的四个活动包括以下内容：


  - 发布是指将解决方案交付给终端用户的流程，可以一次性进行，也可以分阶段进行

  - 稳定和运营解决方案描述了确保项目的功能和非功能方面均正常工作的步骤

  - 衡量是确定新发布的功能是否满足预期目的的过程

  - 学习是根据收集到的信息决定采取何种行动的过程


  在解决方案投入生产并已验证为可操作后，现在是时候将其向客户开放了。价值发布的时机至关重要，因为过早或过晚在错误的时间发布都可能产生负面经济后果。我们将通过深入探讨面向客户的发布价值方法来进一步探索这一方面。


  ## Release value to customers


  产品管理流程包括规范产品开发流程执行的政策。这些政策范围从自动向客户发布合格代码到建立更正式的评审流程。如果系统复杂，则更有可能通过人工门控来确定之前问题的答案（谁、何时以及发布什么）。发布可以通过以下四种实践完成：


  - 暗发布可在不向终端用户提供功能的情况下将部署到生产环境

  - 为了促进暗发布，开发人员已实施功能开关，可在代码中在旧功能和新功能之间切换

  - 金丝雀发布允许将解决方案发布给特定客户细分群体并进行衡量，然后再进一步扩展并发布给更多客户

  - 解耦的发布要素是指发布要素已分别识别，以便可以独立进行单独发布


  为了使应用程序正常运行，开发和运营都是必不可少的。在部署期间，软件组件或框架的设计、开发和测试。


  运营一家软件公司包括行政任务、服务和支持。DevOps 架构通过将开发和运营结合起来，可以减少部署团队和运营团队之间的时间。这将改善软件交付。


  ## Architecture for DevOps


  虽然 DevOps 被视为构建计算系统的框架，但它并不是现代计算中的架构参考。DevOps 不是特定技术或方法，而是一种关注团队合作、沟通以及不断改进软件的哲学。它最终将以尽可能高效和快速的方式生产出更好的软件。DevOps
  鼓励整个组织定期、增量地参与改进其软件应用程序。


  敏捷也受 DevOps 影响。然而，新开发的方法在敏捷和瀑布开发之上都有改进。这是因为它不需要开发人员在将整个项目移交给运营进行生产测试之前完成整个项目。开发人员和运营专家之间曾经存在孤岛。为了在生产中运行代码，开发人员编写代码，而运营人员作为系统管理员运行代码。即使如此，由于沟通中断和协作不足，本应容易的事情可能会变得具有挑战性，例如将客户请求传达给开发人员以及向运营人员提供干净的代码。


  ## Build


  在未使用 DevOps 时，用于履行运营的资源总成本是基于固定硬件分配的估计计算得出的。为了使事情顺利进行，业务战略中定义了个人使用要求。DevOps 的一个关键特征是使用云以及共享资源。构建可以由用户控制，以确保资源得到适当利用。


  ## Code


  使用 Git 和许多其他良好实践可以使代码得到重用。它有助于编写满足业务需求的代码，跟踪更改，并告知实际发生的情况与预期发生情况之间的差异原因。在紧急情况下，代码可以恢复到原始状态。文件、文件夹等可以适当安排以保护代码。重用它们也是可能的。


  ## Test


  应用程序进入生产之前，测试将完成。使用手动测试时，手动测试和将代码从输入移动到输出所需的时间更长。自动化测试加快了部署过程，因为在代码部署到生产之前，自动化脚本将消除许多手动步骤。测试代码所需的时间将被减少，进而部署时间也会减少。


  ## Plan


  敏捷开发是 DevOps 的重要组成部分。由于开发和运营团队保持同步，因此更容易相应地进行规划，从而提高生产力。


  ## Monitor


  通过持续监控可以识别任何潜在故障。此外，它还有助于跟踪应用程序的整个过程，以使应用程序与现代升级保持最新并同步。使用 Splunk 等服务使监控日志数据变得更容易，其中多个第三方工具支持监控。


  ## Deploy


  许多系统可以通过调度程序实现自动化部署。云管理平台允许用户通过仪表板捕获准确的见解并分析趋势。它们允许他们查看优化场景和趋势分析。


  ## Operate


  与传统方法相比，DevOps 将开发和测试集成到一个工作流程中。团队成员以协作方式积极参与服务的整个生命周期。由于开发团队和运营团队之间的协作，创建了一个同时满足业务和
  IT 需求的监控计划。


  ## Release


  可以自动化将程序部署到环境中。然而，当部署到生产环境时，它们是手动触发的。为了最大限度地减少客户影响，发布管理有许多流程经常使用手动部署来部署到生产环境。


  DevOps 方法在使用适当的人员和工具在向用户发布之前严格测试软件更新。这是因为几个 DevOps 原则。云托管和大型分布式应用程序使用 DevOps 架构开发。使用敏捷开发允许集成和交付作为
  DevOps 架构的一部分无缝结合。当开发和运营独立工作时，开发、测试和部署产品所需的时间更长。如果交易条款不兼容，这可能会影响交付计划。因此，DevOps 简化了开发流程并使团队能够提高生产力。


  ## Applying SAFe to EA and the cloud


  业务架构说明了公司将如何运作。与 IT 架构师确定如何利用系统、数据、集成和资源来支持 IT 组织类似，业务架构定义了组织做什么以及业务如何提供价值、开展业务所需的信息以及涉及哪些组织。您还将找到有关业务如何开展工作的信息。


  企业可以通过在整个企业中实施规模化敏捷框架（SAFe: https://scaledagileframework.com/），与 Amazon Web Services（AWS）（https://press.aboutamazon.com/news-releases/news-release-details/cox-automotive-goes-all-aws）全面合作，并发展为你构建它，你运行它
  的环境，来对其人员、流程和技术进行转型。公司可以建立小型团队，使用 Scrum、Kanban 或其他敏捷方法，团队规模通常为 8-10 人，以推动所有权和自主性，非常类似于亚马逊的两披萨团队。实施协调的交付、运营和技术战略使公司能够通过在
  SAFe 的上层创建产品、工程、架构和业务领导者团队来统一 IT 和业务，从而形成更透明和协作的环境。此模型提供了优先级的连通性，并在团队寻求解决客户问题时为其提供背景。




  ## 使架构与业务价值保持一致


  技术是数字时代向客户提供价值的重要组成部分。每当业务战略发生变化时，用于交付这些战略的系统、应用程序和技术也必须进行调整。支持应用程序和系统的人员负责客户体验的任何变化。建筑师的责任是在与业务负责人和产品经理密切协调的同时，确保这些系统能够实现当前和未来的业务目标。产品组合愿景、产品组合画布和战略主题指导公司的架构。这些约束为技术投资设定了产品组合，提供方向以及整体背景。


  除了对架构的狭隘关注外，EAs 还应考虑更广泛的企业战略。本质上，端到端价值流包括所有导致为客户创造成果的活动，无论是最终客户还是内部客户。识别触发并参与业务架构价值流的利益相关者至关重要。在通往价值主张的路径上累积的额外增量项目也包含在内。本质上，它说明了所寻求和收到的价值——换句话说，客户与公司打交道的[content]

