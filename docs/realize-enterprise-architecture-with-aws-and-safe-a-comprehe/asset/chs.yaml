  ## 构建业务特定的核心基础\n\n符合 EA 原则的组织必须拥有 EA 领导者，他们能够提前思考流程中的某些要素，以保持工作流程顺畅无缝。团队规模、基础设施模型和组织结构位列首位。共同为一个项目、一个共同目标而工作的个人或团队可能采用不同的方法，但工作伦理和\
  \ EA 模型必须保持一致，以维持有效的工作流程并确保运营的敏捷性：\n\n### 了解 EA 利益相关者\n吸引并识别符合特定标准的利益相关者群体，包括客户，是组织希望[content]\n\
  ## 构建业务特定的核心基础\n\n符合 EA 原则的组织必须拥有 EA 领导者，他们能提前思考流程要素以保持工作流顺畅无缝。团队规模、基础设施模型和组织结构位列首位。共同为项目和共同目标工作的个人或团队方法可能不同，但工作伦理和\
  \ EA 模型必须一致，以维持有效工作流并确保运营敏捷性：\n\n### 了解 EA 利益相关者\n吸引并识别符合特定标准的利益相关者群体，包括客户，是组织转型\
  \ EA 模型的首要任务。每个利益相关者都处于特定职位，有可由可信 EA 结构满足的具体需求。例如，在为技术奠定业务价值基础时，CIO 可能会对应用路线图、投资和成本结构提出一系列问题。参考应用生命周期图、财务矩阵和成本热力图可帮助找到答案。\n\
  \n### 参与 EA 利益相关者\n获得合适团队并使其加入可能比保持所有人一致、提供持续支持和有效沟通更容易。利益相关者参与计划会根据组织结构和 EA 项目范围而变化，但通常涉及以下渐进层级：\n\
  - **制定策略**：规划方法，同时考虑到必须维持的持续流程，以保留关键利益相关者支持\n- **了解组织**：对组织历史、文化和关键利益相关者有坚实把握，更易评估和识别最佳机构实践\n\
  - **评估当前能力**：利用分析、组织洞察和数据来规划实现预期成果的步骤\n- **运营与演进**：根据组织指南建立 EA 运营，并在行业和组织发展中持续演进工作，以产生和维持利益相关者支持\n\
  \n### 选择运营模式\n建立能够巩固组织并能高效应对内部或外部问题的模式很重要。这是 EA 执行基础的第一步。\n每个模式都不同，基于组织的核心理念、目标和项目规模。以下是常见的\
  \ EA 运营模式：\n- **协调运营模式**：自主业务单元控制业务流程设计并适应其运营。\n- **统一运营模式**：采用矩阵方法整合全球业务流程集并进行集中管理。在此模式下，高层管理保持关注所有单元业务流程标准化。\n\
  - **多元化运营模式**：每个业务单元独特，拥有独立交易集。除最低限度业务流程标准化外，大多数 IT 决策和业务选择均由共享服务集独立做出。\n- **复制运营模式**：业务单元采用联邦方法进行整合和标准化。工作流集中管理，但数据本地拥有，并与企业进行部分汇总和共享。\n\
  \n### 定义 EA 团队结构\n如何构建 EA 团队有时是组织计划建立内部 EA 结构时不断回响的问题。开始时做出的任何决定都将产生长期影响，且在此阶段更容易获得组织认可。\n\
  尽管团队规模小、预算有限、决策权小，大多数企业架构师仍被期望实施强大的战略技术项目。EA 可以分布在组织各领导层中，以寻求更好的一致性和工作流。\n\n###\
  \ 构建 EA 生态系统\n通过从主要利益相关者获得认可不断扩大网络，最终将实现最大利益。核心 EA 团队应不断探索其与更广泛团队合作的方式并在过程中改进。\n\
  核心 EA 团队拥有整体 EA 结构、定义标准并制定业务对齐战略。根据 Gartner 研究副总裁 Marcus Blosch 的说法，与其关注标准、结构和控制，组织必须将战略拓宽至推动业务成果，并灵活创造性地工作以定义未来及实现路径。通过采用这些特质，EA\
  \ 团队可培养新人才以支持数字业务和数字化转型。他们将建立在制定业务战略、设计新服务和体验、推动创新、在组织内协调协作以及导航未来方面的能力。\n\n> “任何\
  \ EA 成功的关键在于架构师的战略配置。\n> 他们可以设在单一部门或分散在向不同经理汇报的各组中。\n> 因此，没有两个 EA 团队看起来相同。”\n>\n\
  > *Forrester*\n\n相反，更广泛的 EA 团队由解决方案、技术和业务架构师组成，是核心团队的延伸。他们与利益相关者在不断演变、混乱的环境中工作。核心团队与更广泛团队之间顺畅一致的信息流确保更稳健的基础设施和更好成果。\n\
  \n### 准确配置团队规模\n大型 EA 团队可能有 50+ 人专注于不同架构域或 EA 整体，中型团队由 15-50 人组成，小型团队少于 15 人。以下因素可帮助\
  \ EA 领导者确定团队适当规模：\n- 组织内的产品和服务数量\n- 收入和利润计算的时间\n- 组织内业务流程的成熟度\n- 账户和财务管理的效率\n- 组织资源和用于进阶的\
  \ IT 预算\n- 组织适应 EA 的速度\n\n总体而言，EA 团队的合适规模没有固定标准，因为它基于组织内的某些因素。\n\n## 构建核心基础的 EA\
  \ 域\n\n*Stephen Spewak's Enterprise Architecture Planning* 大大促进了当前将 EA 划分为四个域的流行。虽然其方法于\
  \ 1993 年发表，但至今仍被大多数 EA 项目团队使用。\n\n让我们看看 EA 工作的四个域。\n\n### 业务架构\n该域定义组织结构，同时解决谁参与以及他们在公司功能能力内做什么。让我们看看代表该域必须回答的一些示例问题。一般而言，业务架构包括业务流程、业务能力、服务、运营模式和价值流。业务愿景、战略和目标是什么？谁负责推动并实现预期目标？\n\
  \n### 应用架构\n该域考虑特定应用与组织核心业务流程之间的关系，同时提出问题：当前业务能力是如何实现的？根据不断变化的需求定制软件解决方案的过程在此阶段得到解决。当组织使用的软件无法满足客户需求时，功能更新至关重要。重新设计软件是最后的手段，但在无法适应现代进步的情况下是必要的。\n\
  \n### 数据架构\n该域涉及组织数据资产和资源的结构。业务分析的洞察使企业能够随着客户需求而演进。用户收集的数据存储在数据库中，以便将来参考时进行管理和维护。战略架构使处理复杂数据变得容易得多。\n\
  \n### 技术架构\n实施应用服务需要软件和硬件等资源。现代技术对于构建功能网络至关重要。这包括设备、路由器、软件和存储。适应变化是成功的关键，而这些变化将以动态市场和不断变化的用户行为的形式出现。\n\
  \n将数据和应用域合并为单一信息系统组件的常见做法对许多 EA 框架有效。此外，客户收集的所有数据可能占用大量空间。将其放在云中是最安全、最先进的方式，以保持顺畅运行。\n\
  \n## 核心基础在业务中扮演什么角色？\n\n每个企业都有内置的 EA 来帮助实现特定目标。在某些组织中，它经过深思熟虑设计，以支持高度专业团队，他们聚集在一起形成战略指南。基于这些指南，EA\
  \ 得到实施。对于其他组织，EA 可能只是设计、改进和维护 IT 网络的底层流程，而没有适当的[content]\n## 构建业务特定的核心基础\n\n符合 EA\
  \ 原则的组织必须拥有 EA 领导者，他们能提前思考流程要素以保持工作流顺畅无缝。团队规模、基础设施模型和组织结构位列首位。共同为项目和共同目标工作的个人或团队方法可能不同，但工作伦理和\
  \ EA 模型必须一致，以维持有效工作流并确保运营敏捷性：\n\n### 了解 EA 利益相关者\n吸引并识别符合特定标准的利益相关者群体，包括客户，是组织转型\
  \ EA 模型的首要任务。每个利益相关者都处于特定职位，有可由可信 EA 结构满足的具体需求。例如，在为技术奠定业务价值基础时，CIO 可能会对应用路线图、投资和成本结构提出一系列问题。参考应用生命周期图、财务矩阵和成本热力图可帮助找到答案。\n\
  \n### 参与 EA 利益相关者\n获得合适团队并使其加入可能比保持所有人一致、提供持续支持和有效沟通更容易。利益相关者参与计划会根据组织结构和 EA 项目范围而变化，但通常涉及以下渐进层级：\n\
  - **制定策略**：规划方法，同时考虑到必须维持的持续流程，以保留关键利益相关者支持\n- **了解组织**：对组织历史、文化和关键利益相关者有坚实把握，更易评估和识别最佳机构实践\n\
  - **评估当前能力**：利用分析、组织洞察和数据来规划实现预期成果的步骤\n- **运营与演进**：根据组织指南建立 EA 运营，并在行业和组织发展中持续演进工作，以产生和维持利益相关者支持\n\
  \n### 选择运营模式\n建立能够巩固组织并能高效应对内部或外部问题的模式很重要。这是 EA 执行基础的第一步。\n每个模式都不同，基于组织的核心理念、目标和项目规模。以下是常见的\
  \ EA 运营模式：\n- **协调运营模式**：自主业务单元控制业务流程设计并适应其运营。\n- **统一运营模式**：采用矩阵方法整合全球业务流程集并进行集中管理。在此模式下，高层管理保持关注所有单元业务流程标准化。\n\
  - **多元化运营模式**：每个业务单元独特，拥有独立交易集。除最低限度业务流程标准化外，大多数 IT 决策和业务选择均由共享服务集独立做出。\n- **复制运营模式**：业务单元采用联邦方法进行整合和标准化。工作流集中管理，但数据本地拥有，并与企业进行部分汇总和共享。\n\
  \n### 定义 EA 团队结构\n如何构建 EA 团队有时是组织计划建立内部 EA 结构时不断回响的问题。开始时做出的任何决定都将产生长期影响，且在此阶段更容易获得组织认可。\n\
  尽管团队规模小、预算有限、决策权小，大多数企业架构师仍被期望实施强大的战略技术项目。EA 可以分布在组织各领导层中，以寻求更好的一致性和工作流。\n\n###\
  \ 构建 EA 生态系统\n通过从主要利益相关者获得认可不断扩大网络，最终将实现最大利益。核心 EA 团队应不断探索其与更广泛团队合作的方式并在过程中改进。\n\
  核心 EA 团队拥有整体 EA 结构、定义标准并制定业务对齐战略。根据 Gartner 研究副总裁 Marcus Blosch 的说法，与其关注标准、结构和控制，组织必须将战略拓宽至推动业务成果，并灵活创造性地工作以定义未来及实现路径。通过采用这些特质，EA\
  \ 团队可培养新人才以支持数字业务和数字化转型。他们将建立在制定业务战略、设计新服务和体验、推动创新、在组织内协调协作以及导航未来方面的能力。\n\n> “任何\
  \ EA 成功的关键在于架构师的战略配置。\n> 他们可以设在单一部门或分散在向不同经理汇报的各组中。\n> 因此，没有两个 EA 团队看起来相同。”\n>\n\
  > *Forrester*\n\n相反，更广泛的 EA 团队由解决方案、技术和业务架构师组成，是核心团队的延伸。他们与利益相关者在不断演变、混乱的环境中工作。核心团队与更广泛团队之间顺畅一致的信息流确保更稳健的基础设施和更好成果。\n\
  \n### 准确配置团队规模\n大型 EA 团队可能有 50+ 人专注于不同架构域或 EA 整体，中型团队由 15-50 人组成，小型团队少于 15 人。以下因素可帮助\
  \ EA 领导者确定团队适当规模：\n- 组织内的产品和服务数量\n- 收入和利润计算的时间\n- 组织内业务流程的成熟度\n- 账户和财务管理的效率\n- 组织资源和用于进阶的\
  \ IT 预算\n- 组织适应 EA 的速度\n\n总体而言，EA 团队的合适规模没有固定标准，因为它基于组织内的某些因素。\n\n## 构建核心基础的 EA\
