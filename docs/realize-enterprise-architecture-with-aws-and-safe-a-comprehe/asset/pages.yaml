- pgno: 229
  md: '# Planning


    In order to migrate resources to AWS, you must figure out how you will migrate
    them, the tools you will use, and the operating model you will use to maintain,
    govern, and secure them. Prepare for the migration by following these best practices:


    +   - Identify the key assumptions for a comprehensive wave plan. The number,
    dependencies, and tools used in each sprint, along with the owner of each sprint,
    should be identified.

    +   - Integrate account structures, security, networking, automation, and pipelines.

    +   - Preparing the landing zone is essential.

    +   - The migration tools must be selected and obtained.

    +   - Define the processes for change management and impact assessment.

    +   - Decide how you will communicate.

    +   - Establish the production processes and operating models.

    +   - Resources, including partners, must be selected and committed.


    # Activities


    All sprint weeks should be planned in advance. Members of the team should be involved
    in every sprint week! Bear in mind the following:


    +   - To monitor progress and guide team members, create key metrics. Define what
    and how each objective should be measured.

    +   - Plan for risks by conducting a premortem.

    +   - Decide how everyone will be kept informed and set a schedule.

    +   - Identify and improve sprint activities by holding an inception retrospective.

    +   - The backlog of products should be reprioritized.

    +   - Plan how you will continue to practice each day.

    +   - Organize a retrospective to identify areas for improvement.

    +   - Stay on schedule at all times.


    The sprint, planning, and retrospective meetings should also be set up on a shorter
    cadence. A two- to three-week sprint offers rapid feedback, allows you to pivot,
    and creates urgency. The Wave 1 migrations consisted of developing blueprints
    and building blocks and testing specific migration patterns. Developing a migration
    factory process and expanding agile models for your entire application portfolio
    is now your next step as you build a team to support your initial wave of migrations.'
  merge: -1
  img_proc: true
- pgno: 230
  md: 'Migration factories enable large-scale moves to AWS by paving the way. An efficient
    migration workflow combines the technical, business, and human elements of cloud
    migration. Cloud migrations have been disappointing in several cases for their
    teams. Despite their failures, they stuck with it and improved their results with
    follow-up attempts. When you''re planning to migrate mission-critical applications
    to the cloud as part of your organization''s modernization, you can''t afford
    to repeat mistakes made by others. To maximize your chances of successful cloud
    migration, this post uses those learnings to craft a 10-step checklist of the
    most important factors you need to consider. The following sections are the components
    of the cloud migration checklist.


    # Step 1 – establishing the migration-architect role


    You should establish the role of the migration architect before you begin your
    cloud migration. Migrating architects play a pivotal role in planning, implementing,
    and closing out all aspects of migrations; their primary responsibilities include
    defining the refactoring strategies necessary to facilitate migration success,
    developing the migration strategies for data migration, defining the cloud-solution
    requirements, and determining the migration priorities and switchover mechanisms.


    When a migration project is large, there are many technical decisions to make,
    and the presence of a migration architect who can address all of the aspects of
    the project is essential to the success of the project.


    # Step 2 – choosing your level of cloud integration


    A shallow cloud integration or a deep cloud integration can be used when moving
    an application from a data center to the cloud. When you use shallow cloud integration,
    you move the on-premises application to the cloud without changing anything about
    the servers you use to run the application in the cloud. It just takes a few changes
    to make the application run in the new environment. The services are not unique
    to the cloud. Lift-and-shift is another term for this model, in which the application
    is transferred to the cloud intact.


    You modify your application to take advantage of key cloud capabilities during
    the migration process for deep cloud integration. A serverless computing capability
    such as AWS Lambda for portions of the application might be as sophisticated as
    auto-scaling and dynamic load balancing. Using a cloud-based data store such as
    Amazon S3 or DynamoDB might be another option.'
  merge: -1
  img_proc: true
- pgno: 231
  md: '# Step 3 – choosing a single cloud or going multi-cloud


    If you plan to migrate your application to the cloud, you should ask yourself
    the following question: are you planning to run your application on a single cloud
    provider, or are you planning to run it on multiple providers? Cloud provider-specific
    application optimization is relatively straightforward. You only have to learn
    one set of cloud APIs, and your application will be able to take advantage of
    all the features the cloud provider has to offer. This approach has the downside
    of vendor lock-in. Your application might require just as much effort to migrate
    to another cloud provider when you have already updated it to work with that one
    provider. Furthermore, you might not be able to negotiate key terms with your
    cloud providers, such as pricing and SLAs, if you have one cloud provider.


    A cloud contains one application, and another cloud contains another application.
    Using multiple clouds might seem straightforward at first; one set of applications
    runs in one provider and another set in another. The advantage of this method
    is that you can leverage multiple providers to increase business leverage and
    flexibility when it comes to where to put new applications. Additionally, the
    applications can be optimized for the provider on which they run. Using multiple
    cloud providers can help you scale your application. Several companies choose
    to run parts of their applications with one cloud provider but others with another.
    It allows you to take advantage of the key advantages that each provider offers.
    In this situation, your application might be impacted by either provider’s performance,
    and any issues with either provider could affect the customer experience.


    Cloud-agnostic development is crucial to your application’s success. Those who
    do not adopt cloud-agnostic development risk losing their customers. Your application
    could be run simultaneously across several providers, or the load could be shared
    among them. The model makes it easy for you to easily switch the load between
    different cloud providers, giving you the best flexibility when negotiating with
    vendors.


    # Step 4 – establishing cloud KPIs


    An application’s key performance indicators (KPIs) relate to how the application
    or service performs relative to the expectations you have for it. Your applications
    and services might have already been assigned KPIs, but are they still the right
    ones when they are cloud-based? KPIs are the most useful for understanding the
    progress of your cloud migration, highlighting any problems that you might not
    have noticed. A cloud migration KPI can determine when migration is complete and
    successful, which is perhaps the most important factor. Cloud migration KPIs can
    be divided into several categories:'
  merge: -1
  img_proc: true
- pgno: 232
  md: '| Category | Sample KPI |

    |---|---|

    | User experience | Page load time |

    |  | Lag |

    |  | Response time |

    |  | Session duration |

    | Application/component performance | Error rates |

    |  | Throughput |

    |  | Availability |

    |  | Apdex |

    | Infrastructure | CPU usage % |

    |  | Disk performance |

    |  | Memory usage |

    |  | Network throughput |

    | Business engagement | Cart adds |

    |  | Conversions and conversion % |

    |  | Engagement rates |


    Assess the importance of each category to your business and determine which metrics
    will be affected the most by the cloud migration. Using tools such as infrastructure
    monitoring, you can then track what is happening.


    # Step 5 – establishing performance baselines


    Baselining involves measuring the current performance of your service or application
    and determining if its future performance is acceptable. Based on your baselines,
    you can determine when your migration is complete and how much you can improve
    your performance post-migration. As you migrate to the cloud, you can also use
    baselines to diagnose any problems that occur.


    Each key performance indicator should have a baseline metric. Set the timeframe
    for collecting data to establish the baseline. Short baseline periods allow you
    to move more quickly, but they do not give you a representative sample of your
    performance. In terms of time, a longer baseline period results in more representative
    data, but it takes more time.'
  merge: -1
  img_proc: true
- pgno: 233
  md: 'Additionally, you should decide whether you will only collect average or representative
    baseline data, or if you will include data collected during critical or peak periods.
    Would you like to collect information over a day with a big news event if you''re
    a news site, or would you prefer to avoid such days? You should clearly define
    what types and duration of data you''re going to collect, regardless of which
    data-collection model is appropriate for your industry.


    # Step 6 – prioritizing migration components


    Aside from migrating your entire application to the cloud at once, you must also
    decide whether to migrate the application component by component or service by
    service. Determine which services are dependent upon which other services, and
    which services are connected to which others. Consider using an application performance
    monitoring tool that can create dependency diagrams from service maps for larger,
    more complex applications.


    Determining which components and in what order to migrate requires the use of
    the dependency diagram. Usually, the services with the fewest dependencies are
    the best to start with. As a result, you would migrate your innermost services
    first, and then the outermost, which are usually the ones your customers have
    access to. As an alternative, you might want to begin with the most critical outside
    services closest to your customers, so you can control any effect on them.


    # Step 7 – performing any necessary refactoring


    If you want your cloud-based applications and services to work as effectively
    and efficiently as possible, you might need to make some other changes to your
    applications and services beforehand. If so, you should refactor your application:


    +   - This allows you to dynamically scale your service using a variable number
    of running instances, potentially saving you money.

    +   - By doing so, you will be able to take greater advantage of cloud technologies,
    such as dynamic allocation and de-allocation of resources as needed, instead of
    static allocation in advance.

    +   - Consider moving to a service-oriented architecture before moving individual
    services to the cloud so that the migration is easier.


    # Step 8 – creating a data migration plan


    Cloud migration is notoriously complicated, especially when it comes to migrating
    data. It''s important to understand how data location impacts your application''s
    performance. Adding cloud-based data access when the primary access method is
    still on-premises can affect performance tremendously. Additionally, data can
    reside on-premises or in the cloud, depending on which service is accessed.'
  merge: -1
  img_proc: true
- pgno: 234
  md: 'You can migrate your data using the following options:


    +   - Integrating your on-premises and cloud databases with a bi-directional synchronization
    mechanism. The on-premises database should be removed after all consumers of the
    data have been moved to the cloud.

    +   - Implement one-way synchronization between an on-premises database and a
    cloud-based database and allow consumers to only access the on-premises version.
    Enable cloud-based consumers to access the new database when you are ready to
    disable access to the on-premises version.

    +   - Data migration services, such as AWS’, can be used to move data to the cloud.


    Plan your data migration well, and don’t underestimate its complexity. It is very
    easy to fail a cloud migration if you do not follow your data migration plan closely
    before you begin. In the data migration planning process, your migration architect
    should play a central role.


    # Step 9 – switching overproduction


    So, how do you move the old on-premises system over to the new cloud-based version,
    and when? Your answer will depend on the complexity and architecture of your application,
    as well as how your data and datastores are built.


    You can choose either of the following approaches:


    +   - **All at one time**: Ensure that the on-premises stack is running properly
    before switching traffic over to the cloud stack.

    +   - **Gradually migrate traffic**: Start with a few customers, test to make
    sure everything works, and then move a few more. Continue moving your clients
    to the cloud-based application until you have transferred all your customers.


    # Step 10 – reviewing application resource allocation


    There are a few things to consider after you’ve migrated everything to the cloud.
    Your top priority should be optimizing resources. In the cloud, resource allocation
    can be dynamic, so you shouldn’t allocate resources statically to utilize the
    cloud’s advantages. Prepare your teams for distributing resources to your application
    as you move to the cloud. Often, cloud vendors offer additional resources in virtually
    any quantity at a moment’s notice when extra resources are needed for an application
    in the cloud. Assuming your teams have the application architecture in place to
    accommodate dynamic scaling, you can usually rely on your ability to scale as
    needed to meet user demands.'
  merge: -1
  img_proc: true
- pgno: 235
  md: '# Other considerations for your cloud migration


    There are certainly other things to consider during a cloud migration besides
    the steps mentioned in this checklist. For example, an essential part of any cloud
    migration is ensuring that the environment is secure and safe. You can build and
    maintain a secure system using the tools and resources offered by most cloud providers.


    Two rules of thumb stand out when it comes to cloud pricing: cloud computing is
    cheaper than on-premises computing, and cloud computing is more expensive than
    on-premises computing. Depending on the situation, either rule could hold true.
    Indeed, cloud computing can increase your infrastructure bill in comparison to
    your physical data center if you start using it as opposed to using the former.
    This could be due to a few reasons.


    As noted earlier, all infrastructure systems have hidden costs, and you might
    not be considering all the expenses of running your own data center, whereas cloud
    providers clearly outline all expenses. There are times when you compare apples
    to oranges, making the cloud seem more expensive than on-premises.


    A cloud-based infrastructure is typically financed by **operating expenses (OpEx)**,
    whereas an on-premises infrastructure is primarily financed by **capital expenditures
    (CapEx)**. Capital expenditures may be easier to obtain than operating expenses,
    depending on how your business manages its books. Making sure that your financial
    models reflect the differences between cloud and on-premises infrastructure is
    key to being able to recognize cloud cost improvements.


    # Waterfall or agile – which route to take


    There have been significant changes in the industry throughout the years, and
    in particular, the industries have seen massive progress with endless resources
    that have been ineffective. A plethora of tools, methods, and experiences have
    been documented, but the needle hasn’t moved significantly. So, how is that possible?
    With all the tools and methodologies at our disposal, shouldn’t we be smarter
    about managing programs?


    # Changes ahead


    On paper and in principle, yes, but when it comes to large-scale projects, particularly
    data center migrations and consolidation programs, the outcome has barely changed
    despite the latest tools and methodologies.


