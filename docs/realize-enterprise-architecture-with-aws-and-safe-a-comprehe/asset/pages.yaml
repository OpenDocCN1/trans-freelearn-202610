- pgno: 153
  md: 'Once AWS CAF perspectives and foundational capabilities are identified, we
    move forward to diving deep into the journey of cloud transformation.


    # Cloud transformation journey


    Cloud-based business outcomes are demonstrated in the **Envision** phase. The
    process identifies and prioritizes transformation opportunities in line with your
    strategic business objectives across the four transformation domains. Here''s
    what you can do to obtain maximum value from this process:


    +   - The ability to demonstrate value as you progress through your transformation
    journey will be enhanced by relating key stakeholders and measurable business
    outcomes to your transformation initiatives.

    +   - *Phase A* of the alignment process examines gaps across AWS CAF perspectives,
    identifies dependencies across organizations, and surfaces stakeholder concerns
    and challenges. Developing cloud readiness strategies, ensuring stakeholder alignment,
    and facilitating organizational change management will help you become more cloud-ready.

    +   - During the launch phase, pilot initiatives are delivered in production,
    and incremental business value is demonstrated. In order to influence future directions,
    pilots need to be highly impactful. Learning from pilots will help you adjust
    your approach before scaling to full production.

    +   - As part of the scale phase, your cloud investments should be scalable, and
    your business value will be sustained as needed.


    Some foundational capabilities may not need to be addressed at once. Your cloud
    transformation journey will require you to develop foundational capabilities and
    improve your cloud readiness.


    # AWS EDF


    Migrations to the cloud are prepared and implemented using agile methodologies.
    The process involves the following:


    +   - To be able to respond to change, consider structuring your work as epics
    and stories

    +   - Prioritizing the backlog and producing it

    +   - Making a progress report

    +   - Ensuring that business needs are efficiently and effectively tied to technology
    initiatives through a migration roadmap


    Agile development involves starting small, iterating, evaluating, managing, and
    scaling huge stories. Discussed next are the steps involved in making the process
    seamless.'
  merge: -1
  img_proc: true
- pgno: 154
  md: '# Preparation


    Here are the steps involved in the migration preparation:


    +   1. Form two scrum teams with two pizzas each that are made up of internal
    resources defined in the readiness and planning phase. Teams should be divided
    into functional and technical roles. In addition to enabling migrations, these
    teams prepare the business to do enterprise-scale migrations:

    +      A. *2-Pizza Team 1* structure and resources—business case development,
    program governance, people skills, and **center of excellence (CoE)**

    +      B. *2-Pizza Team 2* structure and resources—application discovery, application
    migration, landing zone, security, and operations integration

    +   2. The migration readiness assessment results will be reviewed in a planning
    meeting with both scrum teams.

    +   3. *AWS Wave 1* will deal with 10 to 30 on-premises applications that should
    be migrated to AWS.

    +   4. Plan and prioritize all workstreams from existing migration patterns based
    on *pre-baked* epics.

    +   5. The migration of applications will be divided into eight 2-week sprints.

    +   6. Create a migration plan that includes resources, a backlog, risks and mitigations,
    and roles and responsibilities, such as **Responsible, Accountable, Consulted,
    Informed (RACI)**.


    Considering these pointers, you can identify which resources are responsible for
    managing risk that occurs during the project.


    # Implementation


    The following steps are involved in the migration implementation:


    +   1. Create sprint schedules and targets with both teams for each sprint.

    +   2. The epics should be reviewed, broken down into stories with acceptance
    criteria, and organized into sprints *1* through *8*.

    +   3. Each 2-pizza team needs to meet daily for cadence.

    +   4. Faster feedback and uninterrupted workflow are two important outcomes of
    this meeting. By creating daily scrums, the scrum leader communicates progress,
    resolves blockers, and reports on deliverables.

    +   5. Build an implementation oversight meeting plan for communications and reporting.
    Ensure teams are working well and are delivering value using agile metrics.'
  merge: -1
  img_proc: true
- pgno: 155
  md: '+   6. Focus on managing sprints with the following primary objectives:

    +      A. The ability to understand, enable, and mobilize a workforce is key to
    learning by doing.

    +      B. Build to full migration capacity by starting small and achieving early
    success.

    +   7. Build a list of outputs, best practices, and lessons learned that can be
    used in migrations at scale.

    +   8. Using Wave 1 as a guide, create blueprints for agile migrations. Lay the
    groundwork for the planning and readiness phases.


    Gaining experience and confidence as you work through these initial Wave 1 migrations
    is beneficial. As part of this process, you will select which migration patterns
    and tools work best for your organization. Testing operational and security processes
    is also included in the process. A list of application groupings based on common
    patterns is created to recognize patterns within the portfolio (for example, common
    architectures and technology stacks). The result is a standardized migration process
    for groups of applications.


    # Value-adding outcomes


    When you apply this agile model to operating at scale, you can accelerate your
    progress toward business outcomes. The agile approach results in the following
    value-adding business outcomes:


    +   1. The 7 Rs of migration should be applied to application selection.

    +   2. Planning movement waves with migration tools—develop priority lists of
    move groups with migration tools.

    +   3. Testing and deploying various components of your landing zone will validate
    its functionality.

    +   4. **Development operations (DevOps)**—Foster the continuous development of
    new features, fixes, and updates with the DevOps model.

    +   5. Automate the migration process using vendor tools.

    +   6. Use the AWS Prescriptive Guidance catalog to find migration patterns.

    +   7. The goal is to design target state architectures for the migration of servers,
    data, and applications.

    +   8. Resources will be trained on AWS services and will gain hands-on experience
    migrating.

    +   9. Running an AWS operation runbook enables you to verify the operating model.

    +   10. Migration management—handle migration scopes, schedules, resource plans,
    issues, and risks.


    By accelerating the process of improvement toward migration, these elements prove
    to be extremely effective and beneficial.'
  merge: -1
  img_proc: true
- pgno: 156
  md: '# Summary


    To stay competitive, grow a business, and succeed, you must change your path of
    travel. Cloud adoption strategies need to be created or reviewed to make sure
    that organizations are on the right path and are improving their business acumen.
    When defining your vision for how your organization will utilize the cloud in
    the future, ensure that your cloud strategy takes into account the business objectives
    of your company. Whether it’s for short-term or long-term initiatives, a comprehensive
    roadmap should be outlined, followed by a migration plan that incorporates business
    objectives, which is time-consuming.


    After understanding why you are migrating to the cloud, you can formulate a cloud
    migration strategy. Cloud computing is commonly used to avoid data center maintenance
    costs, enhance scalability, improve resilience, and enhance remote collaboration
    among teams. As a customer of AWS, your business development team has access to
    technology modernization as well as E2E support for application architecture,
    design, development, mobile capabilities, testing, and collaboration solutions.
    AWS’s Well-Architected Framework can help you optimize how you build, maintain,
    and upgrade applications on AWS.


    Your organization could address themes across teams through training sessions,
