- pgno: 129
  md: '# EA and digital transformation


    Businesses have always benefited from strategic planning. However, with the urgency
    of digital transformation and the complexity of these initiatives, such planning
    has become even more critical. This complex technology is connected with the business
    context through EA to drive desirable business outcomes.


    Different organizations have varied meanings of digital transformation that include
    technology trends such as the shift to cloud services, the adoption of AI and
    **machine learning (ML)**, advanced analytics and big data infrastructure, the
    emergence of IoT, the rise of **robotic process automation (RPA)**, and more.


    In business and organizations, digital transformation is defined as the ability
    to effectively leverage the challenges and opportunities of mixed digital technologies
    in a strategic and prioritized manner in response to current and future shifts
    in society. Organizations can react faster to market changes by transforming;
    this allows them to be as flexible and dynamic as possible. Financial services
    are an example of one industry where it has become a competitive necessity.


    The cloud offers businesses the ability to deploy **software-as-a-service (SaaS)**,
    RPA, and AI at a rapid pace. Because many projects need to move at a much faster
    pace, digital transformation changes everything for enterprise architects and
    **enterprise project management offices (EPMOs)**. As with the print press and
    the internet, this digital revolution can be compared to the invention of the
    printing press. All enterprises are questioning business models, technology has
    gained importance in the process, and enterprises are faced with new challenges
    on almost every next move in this era of collaboration.


    # What does digital transformation mean for enterprises?


    Everyone is affected by the digital revolution, hence companies must find new
    ways to collaborate to succeed in these times. Digital transformation happens
    at its own pace, and it cannot be viewed as a one-size-fits-all process. Enterprises
    maintain their own unique IT legacy systems and processes, and they are subject
    to different external regulatory requirements and market pressures. Successful
    enterprises treat the transformation as an ongoing process because industry maturity
    affects the path to digital excellence. A variety of strategies and paces are
    used in this process in order to address business needs.


    For enterprises of all sizes, technology is gaining importance as business models
    are being questioned. Despite the move from the periphery to the center of enterprises,
    knowledge is still dispersed. Because of a lack of transparency, local decisions
    are made disregarding the implications of those decisions for the organization
    as a whole. Digital transformation is more likely to fail when it is centrally
    managed, which makes it crucial for enterprises to make distributed knowledge
    available across the board.'
  merge: -1
  img_proc: true
- pgno: 130
  md: '# Successfully implementing digital transformation with EA


    As a general rule, digital transformation is extremely complex, individual, and
    very expensive. The first step to implementing frameworks—which often fail—is
    to understand and then improve your business data, as well as your IT infrastructure.
    Your EA can be determined and filled with sufficient data once you have completed
    this step.


    To better understand the application that matters most for a business and the
    evolving trend regarding this application, we must know to address the basics,
    finding the right people in the business who can give the right definition of
    an application and the business individually as well as together. Then, use their
    answers on IT as a beginning point and find a simple model to create transparency
    on this view.


    Managing application portfolios in such a situation is extremely helpful. You
    will be able to develop a first-shot classification of user groups and business
    capabilities after having gathered first sight into how IT applications are viewed
    from the business side. Combining a high-level assessment of the business criticality
    report and the functional and technical fit of the business with the application
    can prove effective. It becomes an invaluable tool for the business and IT to
    spot improvement opportunities quickly.


    # Dealing with operational issues


    As soon as you begin working on a strategic project, an operational question distracts
    you. EAs know all too well the challenges of staying current with the latest operating
    systems, responding to urgent requests for business support from unknown groups,
    and cutting costs by eliminating redundancies. Identify these issues proactively
    to avoid distractions before they become a problem. You are distracted because
    you don’t know which applications are affected by an operating system or major
    database update. When you know which major technology is used by your top business
    applications—omit any details—you can take proactively calculated decisions.


    Business support requests usually come from out of nowhere; however, having compiled
    your application portfolio landscape, you will be in the driver’s seat. Specifically,
    try to get an assessment of which user groups and capabilities your business deems
    most vital, and focus on the problems surrounding those groups. The application
    portfolio landscape contains all the information you need and use to deal with
    traditional requests for cost-cutting. All you need to do is pinpoint low-hanging
    fruit before your competitors do. As soon as you have penned down the key applications,
    the most pressing improvements, and taken care of any operational concerns, it
    is time to get serious about data and how it drives your business. Typically,
    this is accomplished at two different levels of granularity. The key data objects
    that drive the business are of primary importance at the business level. Nothing
    more can be said than that the needs of your stakeholders should be your top priority.
    Concentrate on their value to your company, and they will form the coalition you
    desperately need.'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'Following the creation of the first business value, EAs are able to look further
    into the future because of the level of trust between peers and management. Providing
    the enterprise with ways to implement target architectures is their responsibility.
    Nonetheless, they need to keep in mind that focusing on creating business value
    and high-quality data is imperative to avoid fallacy.


    At the end of this chapter, we conclude that despite the fact that EA has often
    been put forward to help businesses innovate and transform, it has traditionally
    been focused on standardizing processes and integrating technology rather than
    continuously adapting to change. The new digital environment requires more adaptive
    conceptualizations of EA in order to achieve the desired impact. Digital transformation
    has implications for EA, as we explored. Existing approaches to EA address integration
    and coherence within an organization, but they often fall short when it comes
    to the complexities associated with digital ecosystems. In a digital environment,
    we postulate that adaptive capabilities are needed that transcend the concept
    of dynamic capabilities.


    # Summary


    The role of enterprise architects is to take on these problems head-on by providing
    a roadmap to manage and reduce complexity, which contributes directly to reducing
    costs. Enterprise architects ensure that IT is aligned with business goals and
    standards.


    Within an EA, the primary objective is to ensure a reduced cost of business operation,
    an agile organization and workflow, shared business capabilities and access across
    the organization, and more. In the light of these goals, enterprise architects
    fit best in multiple use cases such as mergers, integrations, risk assessment,
    management, and so on. The EA also includes governing principles that discuss
    how business strategy can be realized through IT implementation.


    In the absence of stakeholder participation, EA programs often end up being a
    massive failure. EA often focuses only on technology, which has a much narrower
    scope than technical architecture. Business, information, and solutions architectures
    are all included in EA.


    Lastly, digital transformation is defined as the ability to effectively leverage
    the challenges and opportunities of mixed digital technologies. Business organizations
    handle this in a strategic and prioritized manner in response to current and future
    shifts in society.


    Successful enterprises treat digital transformation as an ongoing process because
    industry maturity affects the path to digital excellence. Conclusively, the new
    digital environment requires more adaptive conceptualizations of EA in order to
    achieve the desired impact. Digital transformation has implications for EA.


    In the next chapter, we will cover prescriptive guidance from AWS on migration
    to the cloud. We will cover how to identify business objectives for cloud migration,
    a review framework, readiness assessment phases, and adoption and delivery frameworks.'
