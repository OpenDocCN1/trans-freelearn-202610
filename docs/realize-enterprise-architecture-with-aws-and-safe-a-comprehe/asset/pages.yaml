- pgno: 222
  md: '# Planning your exit strategy


    To successfully exit the cloud, planning is essential. Your applications will
    be secure when they are transferred if you have an adequate plan in place. Make
    sure you are prepared in advance if you have to leave the room quickly. To build
    an exit strategy, the following list factors should be considered:


    +   - **Make an inventory**: Make a list of all the assets you own so you don’t
    forget anything. Determine how all the dependencies of your application are distributed
    within the cloud infrastructure, and where your data is located.

    +   - **Know your SLAs**: When de-clouding or switching vendors, you need to abide
    by your **service-level agreements (SLAs)**. Make sure you understand your obligations
    under the contract.

    +   - **Start small**: Move small applications first and then move onto whole
    systems.

    +   - **Testing**: The best way to choose your deployment model is to test and
    retest potential solutions. Perform tests prior to migrating to avoid disruptions.

    +   - **Reallocate resources**: Assess whether you require more resources, an
    allocation of assets, or a realignment of priorities. Ensure that potential solutions
    are operationally viable, secure, and long-lasting. In order to migrate to AWS
    at scale, organizations must travel a path along the stages of adoption. Projects,
    foundations, migrations, and reinventions are the four stages:

    +   - **Project**: This project evaluates whether or not the AWS cloud meets the
    organization’s specific needs and determines a course of action. It does not require
    any AWS experience.

    +   - **Foundation**: The organization extends its data centers to AWS. In particular,
    the organization implements AWS compliance and security models. It creates the
    initial landing zone framework with the help of AWS migration specialists. Employees
    receive AWS skills training and cloud-focused training. Applications are transferred
    to AWS from within the enterprise.

    +   - **Migration**: Organizations prepare for long-term cloud operations at this
    stage by defining roles in the IT department. Additionally, the CCoE creates a
    multi-disciplinary team within a company that helps drive cloud adoption efforts
    across the company and migrates data centers and production applications.

    +   - **Reinvention**: As a result, all projects are now using the cloud. New
    business models are explored in the cloud, and the organization becomes more comfortable
    with cloud operations than it is with on-premises operations.


    An assessment of the readiness of the organization to move onto the next stage
    of adoption is the purpose of a readiness assessment. Before you begin the preparation
    and planning phases of migration, you must complete the readiness assessment.
    You review your readiness assessment results to understand your current state
    as part of the agile program described in this guide.'
  merge: -1
  img_proc: true
- pgno: 223
  md: '# AWS cloud migration tools


    How does AWS support cloud migration? Well, the answer lies in the fact that AWS
    has a wide range of solutions that you can use for cloud migration – many of them
    free – to get you rolling. Some of the leading ones are mentioned next.


    # AWS Migration Hub


    AWS Migration Hub gives you the tools to accelerate and simplify your journey
    with AWS by bringing your cloud migration and modernization needs together under
    one roof. It might be that you’re developing a data-driven inventory of existing
    IT assets or making the case for the cloud within your organization. If so, maybe
    you’re migrating applications to AWS and managing them. Or perhaps you’re upgrading
    previous AWS applications. Migration Hub can assist you with all of these complex
    cloud transformation projects. With AWS Migration Hub, IT asset inventory data
    can be stored in one place while migrations to any AWS region can be tracked.
    If you have already migrated, use Migration Hub to accelerate the transformation
    of your applications to native AWS functionality. Utilizing Refactor Spaces, you
    are only charged for the resources you use. Migration Hub allows you to follow
    the migration progress across AWS solutions, selecting the right tools, tracking
    metrics, and more.


    # AWS Application Delivery Service


    Enterprise customers can plan migration projects using AWS Application Discovery
    Service, which gathers information about on-premises data centers. Often, it is
    necessary to consider thousands of workloads that are extremely interdependent
    when planning a data center migration. Initial steps in migration include gathering
    server utilization data and mapping dependencies. AWS Application Discovery Service
    provides you with information about your server configurations, usage, and behavior
    to help you better understand them.


    AWS Application Discovery Service stores collected data in an encrypted form.
    This data can be exported as a CSV file that can be used to estimate your Total
    Cost of Ownership (TCO) and plan your migration to AWS. Additionally, the discovered
    servers can be migrated to AWS Migration Hub from which you can track their progress
    as they migrate to AWS. Get AWS to review your data setup on-premises to plan
    your migration. All data collected through Migration Hub is encrypted.


    # AWS Server Migration Service


    Migrations to AWS should be done using AWS Application Migration Service. Application
    Migration Service is recommended for customers currently using Server Migration
    Service (SMS). Cloud migration is simplified and expedited by AWS Application
    Migration Service. By migrating applications without changes and with minimal
    downtime to the cloud, you can quickly achieve the benefits of cloud computing.
    When moving large-scale server migrations to AWS, this service will make the process
    as simple and quick as possible.'
  merge: -1
  img_proc: true
- pgno: 224
  md: '# AWS Database Migration Service


    Database migrations to AWS are made easy with AWS Database Migration Service (AWS
    DMS). In this way, applications that rely on the source database do not experience
    any downtime during migration. Data can be migrated from and to the most popular
    commercial and open source databases using AWS Database Migration Service.


    In addition to homogeneous migrations, which include MySQL to MySQL, AWS Database
    Migration Service also supports migrations between different databases such as
    Oracle and Microsoft SQL Server to Amazon Aurora. AWS Database Migration Service
    works with any supported source and any supported target to continually replicate
    your data with low latency. Amazon Simple Storage Service (Amazon S3) allows you
    to replicate data from multiple sources to build an agile data lake solution that
    is highly available and scalable. Data can be streamed into Amazon Redshift to
    create a petabyte-scale data warehouse. Transfer your databases safely and securely
    to AWS. There is no downtime during the migration, as the source database is functional
    throughout.


    # CloudEndure migration


    A 90-day free trial of this lifting and shifting solution is available. With CloudEndure
    Migration, your applications are rehosted on AWS using an agent-based tool. Lift-and-shift
    migrations can be done without disrupting the business with self-service capabilities
    and automated processes. The CloudEndure Agent should be installed on the source
    machine. Applications and data are replicated to AWS’s staging area by the Agent.
    The CloudEndure Agent performs asynchronous, block-level data replication of your
    source and target environments, so changes from your source environment to the
    target staging areas can be tracked and migrated without causing any downtime
    or performance issues.


    A self-service web-based console is available on CloudEndure’s website for configuring
    your target environment, checking for compatibility issues, and validating that
    your apps run smoothly on AWS before you move over. You can rewrite, re-architect,
    and restructure your applications after you host them on AWS and use the services.
    Other tools for migrating data include AWS Snowball, AWS Snowball Edge, AWS Snowmobile,
    AWS DataSync, and AWS Transfer for SFTP.


    # Adopting an agile approach with epics


    The concept of an epic refers to a large body of work that can be broken down
    into smaller stories, which Jira sometimes refers to as issues. Multiple teams
    can work together on multiple projects, and multiple boards can be used to track
    multiple epics at once. Usually, a set of sprints precedes an epic. The user stories
    of an epic will be added and removed as the team learns more about it through
    development and customer feedback. Essentially, agile epics adopt a flexible scope
    based on customer feedback and team cadence.'
  merge: -1
  img_proc: true
- pgno: 225
  md: 'A good epic should provide all the resources a development team needs to succeed.
    As far as their work hierarchy is concerned, it is the top tier. While understanding
    how an epic fits into other agile structures is critical for directing the daily
    developer work, it also provides important context for evaluating epics.


    The act of breaking down an epic into smaller pieces makes it easier to understand
    and maintain momentum, but for a novice, it might seem intimidating. There is
    no perfect way to create storylines from epics, but we can consider several options:


    +   - **User role or persona**: Every user persona should have its own story.
    New visitors will be able to log in more quickly, returning customers will be
    able to log in more quickly, and more.

    +   - **Ordered steps**: Define each step and provide a story behind it.

    +   - **Culture**: Let the team''s norms determine whether a story is quick to
    complete or takes a week to complete.

    +   - **Time**: Set realistic deadlines. Design stories that should be finished
    in one print.


    Neither a big story nor an epic has a universal definition. Generally, it is best
    to break down any work that is estimated to take weeks or even months, into smaller
    stories. A project''s initial epics are rarely determined by enterprises; however,
    their definition is necessary. Let us learn how to create your first epic by following
    these simple steps.


    Definitions of an epic should be outlined first. Epics are solution development
    initiatives in SAFe that measure potential return on investment (ROI) before launching.
    Additionally, each epic in SAFe can be outlined in an organization''s business
    case.


    A similar concept can be found in software projects and programs. To secure funding,
    both must be economically feasible and evaluated for ROI. A major difference between
    SAFe epics and other project-based methodologies is that the company creates a
    new team for a funded project. ART (Resource Tagging API) can handle epics, with
    a team of 50 to 125 dedicated to this task.


    # Portfolio epics and software epics


    Software or program epics are derived from portfolio epics, but this is a common
    misconception. Portfolio epics are actually composed of multiple agile releases
    (ARTs), whereas program epics are composed of a single ART. The complexity is
    compounded by the fact that both software epics and portfolio epics are typically
    collected in one repository called a portfolio. The portfolio management team
    is responsible for creating epics.


    Similar to the project conveyor, both kinds of epics go through a Kanban portfolio
    for flawless execution. According to the ART model, every software epic is an
    epic. However, only a few can be traced to portfolio epics.'
  merge: -1
  img_proc: true
- pgno: 226
  md: '# Business epics and architectural epics


    Epics in business and architecture are clearly different. Architectural epics
    add quality to your portfolio and accelerate its value delivery. Business epics
    improve your customers’ experience.


    # Defining your initial epic


    Some of the companies we’ve worked with did not have clear processes for advancing
    projects that were yet to be funded. Upon receiving funding, an idea or proposal
    becomes a project. The fastest proven method for designing an initial set of epics
    is by converting existing proposals, initiatives, projects, and programs into
    epics.


    In the same way, you can also determine possible ARTs based on this initial process.
    Rather than creating new teams, consider using existing ones. Your team already
    has a number of specialists who can serve as your primary resource at the outset
    of your program or project. In the next section, we will discuss how to apply
    agile principles to cloud migrations, including preparing, implementing, and tracking
    outcomes.


    # Approach


    The agile approach to epic management involves starting small: iterating, measuring,
    managing, and scaling. Large cloud migrations can be prepared and implemented
    using an agile methodology. This method includes the following:


    +   - Using epics and stories as a way to organize your work allows you to adapt
    quickly to changes.

    +   - Produce a backlog with clearly defined priorities.

    +   - Your progress should be reported.

    +   - Build a roadmap for connectivity between the stakeholder needs and the technology
    initiatives to improve efficiency and effectiveness.


    # Preparation


    Here are the steps involved in preparation for migration:


    +   1. Set up two scrum teams of two-pizza-team sizes each. As part of readiness
    and planning, these teams are comprised of internal resources from different workstreams.
    The teams are grouped according to their underlying functional/technical roles.
    The teams work together to drive adoption, enable initial migrations, and set
    up the organization for enterprise-scale migration:

    +      I. Two-pizza team 1 structure and resources: Business case analysis, program
    governance, people skills, and center of excellence (CoE)'
  merge: -1
  img_proc: true
