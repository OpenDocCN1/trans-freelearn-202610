    \ resources that the teams utilize for their day-to-day business affairs can help\
    \ evaluate the impact.\n\nOnce the strategic steps are nearly done on paper, sharing\
    \ them across functional areas to ensure everyone is on the same page is absolutely\
    \ essential. That way, every stakeholder can communicate their concerns, identify\
    \ any loopholes, and address issues that can be fixed before the process begins.\
    \ It makes sense to begin with practical matters and get started with the actions\
    \ to bring about the actual transformation.\n\nHere are essential steps for building\
    \ the right core foundation for the first time to ensure a successful EA:\n\n\
    +   - **Evaluate any current foundation driving execution**\n+   \n+   Often,\
    \ companies stick to outdated methods of articulating business strategies and\
    \ then aligning IT. These processes have worked great in the past, but today,\
    \ with so many innovations and digital advancements, companies might discover\
    \ that IT is a bottleneck rather than a strategic asset. Generally, any new initiative\
    \ in a company takes around 2 years to operationalize. Employees need time and\
    \ space to get used to a new system to establish a strong understanding of the\
    \ updated way of running operations. To implement a new system to support a strategic\
    \ initiative, teams can give it at least a couple of years before evaluating the\
    \ potential outcome. The problem with this infrastructure is that while the company\
    \ spends time getting used to it, there can be many new advancements in the industry.\n\
    +   \n+   Top IT and business management buy-in is ideal for an efficient management\
    \ EA initiative. The business functions and processes must be described using\
    \ relevant artifacts and should be in line with the scope. In other words, business\
    \ and IT must be on the same page to define the scope of the EA. To ensure the\
    \ maximum productivity of EA, the content needs to have certain characteristics\
    \ that are well in sync with modern industry trends."
  merge: -1
  img_proc: true
- pgno: 65
  md: '# Evaluate the operating model


    Every initiative needs a blueprint to define the direction that a particular project
    is going to take. For the team to follow guidelines and align to a plan, there
    must be proper documentation to put them on track. When it comes to the digital
    business world, this guideline is called an *operating model*. It is known to
    be the first layer in the foundation for execution in EA. This comprehensive model
    defines the business process of standardization and explains the need for an integration
    that enhances the value for a particular set of customers or other target audiences.


    Put simply, the operating model is a stepping stone of the business strategy as
    it indicates how the process takes its course, the ultimate goal, and the value
    that will be created, delivered, and captured by the business units at the end
    of it. Enterprise architects are capable of analyzing the business processes,
    system linkages, and data to support every aspect of the business model. There
    are certain elements in the business model that play a significant role in determining
    the operating model, including customer segments, key activities, resources, and
    partners.


    All of these elements come together to provide a map that helps identify the current
    potential and capabilities of an organization. This mapping is conducted over
    a course of time where stakeholders sit together and evaluate the process. Data
    and characteristics from the business model are provided to facilitate the mapping
    matrix. This mapping process and criteria work well to evaluate the enterprise’s
    particular business model and innovation parameters.


    # Define processes and goals for the EA


    Put simply, the primary objective of EA is to create a roadmap or blueprint to
    put the organization on the right track for a transformation process. A set of
    valuable information and company data that must be included are IT assets and
    business processes. Without the background knowledge of the company’s resources,
    determining a future can be pretty tough.


    Enterprise architects are well trained to analyze data from the past and design
    a strategic plan to exploit the current capabilities of an organization and bring
    change. Other common goals include promoting team alignment and standardization.
    The best way to do that is to ensure each and every stakeholder is aligned and
    the communication between and across the teams is smooth. Ensuring a unified environment
    across teams and organizations is crucial to this process.


    As part of the EA process, an organization’s structure, roles, and responsibilities
    are outlined. EA models offer an overview of an organization’s structure and provide
    a long-term perspective. Business processes, including information systems and
    technologies, are described. New technologies and processes are also adopted.'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'The enterprise architect is a guiding agent to help an organization plan its
    goals and work toward achieving them over time. The use of available resources
    and technology to fulfill these aims is also directed in the guidelines. The following
    is a list of the general goals of any EA:


    +   - **Effectiveness**

    +     Setting realistic yet highly motivating goals is what EA is all about. The
    core foundation establishes a workflow for essential and accurate processes by
    overseeing each and every aspect of the operations. Often, the blueprint and roadmaps
    define the guiding principles on how to achieve the ultimate goal and produce
    the deliverables set out by the business.

    +   - **Efficiency**

    +     A company has a certain set of resources that are exploited in the most
    productive way to keep the business operation going. The enterprise architect
    offers a plan and determines the ability to reuse these resources. By eliminating
    redundancies, they ensure the best contribution of each employee''s resourcefulness
    set out in the identified EA framework. Business process modeling and workflow
    mapping can produce greater collaboration.

    +   - **Agility**

    +     Multiple procedures being carried out to achieve a single goal can be a
    devastating approach. But the enterprise architect specializes in combining legacy
    technology with modern ones and facilitates the adoption process. In addition,
    their business model assesses any technology risks with the constant monitoring
    of metrics and analytics. This explains the need to identify when and how to evolve
    IT in alignment with business goals.

    +   - **Continuity**

    +     Consistency is the way to ensure great outcomes. Especially when it comes
    to big corporate organizations, every plan, strategy, or initiative is an ongoing
    process that takes years to turn into a fruitful decision. Maintaining mission-critical
    business operations is crucial for businesses because the risk of teams breaking
    down or management losing interest in an initiative is quite common. The enterprise
    architect helps ensure continuity through the standardization of business and
    IT processes.


    Moreover, to meet the business and IT needs of the organization, the EA development
    process integrates different viewpoints within an organization.


    # EA management process


    **Enterprise architecture management (EAM)** enables and drives business value
    using EA. It defines the direction that an organization needs to take for smooth
    and seamless implementation, strategy building that ensures optimal outcomes,
    and governance to plan and set the right roadmap for the company''s vision, goals,
    guidelines, policies, and principles.'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'The EAM process has multiple roles within an EA:


    +   - It defines the right path for activities related to EA. All of the stakeholders
    within an organization must take the direction set by EAM.

    +   - It works as a bridge between business strategy and EA when it comes to communication,
    collaboration, and maintaining the connection.

    +   - It leverages the core values of EA for the process of business transformation.


    Furthermore, communications, monitoring, control, and other activities that take
    place on a recurring basis are managed under the EAM process to ensure the development
    and deployment of EA support and the delivery business value.


    # EA governance process


    All the information related to the ongoing processes is required to be shared
    and evaluated across the board. This is where the EA governance process plays
    a vital role. Through this process, teams identify, manage, audit, and disseminate
    all of the information needed to manage the EA. Apart from managing and controlling,
    there are hundreds of processes going on within an organization that must be monitored,
    such as architecture principles, policies, decisions, recommendations, deliverables,
    contracts, and agreements. The EA governance process ensures that they are being
    executed correctly at the appropriate times.


    # Project engagement process


    The relationship between EA and the delivery of projects holds special importance
    in the EA process, as it provides direction to anticipate business changes. Additionally,
    new market trends that might emerge based on customer behavior within the next
    3- to 5-year period are predicted.


    The EA model is the primary source of information that sets the foundation for
    individual delivery projects. By the end of delivery projects, the solution architecture
    that has been crafted is linked back to the current EA.


    # EA compliance process


    Compliance with rules, laws, and regulations is assessed against the EA assessment
    criteria, standards, qualities, service-level agreements, and architecture requirements.
    This complex yet crucial process is conducted in multiple stages and the tasks
    that are performed are detailed next.'
  merge: -1
  img_proc: true
- pgno: 68
  md: '# Strategizing on priority


    In today’s constantly evolving digital world, businesses must stay ahead of innovation
    to keep their place in the race. EA leaders play a vital role in helping organizations
    catch up with the latest trends. They cannot rely on legacy architectural practices,
    as they are not relevant today. EA leaders apply their critical capabilities to
    define a new vision for EA for the companies and how it would be beneficial.


    Enterprise architects should focus their time and resources on prioritized elements
    within the architecture model. Usually, these priorities are based on both the
    scenarios and practices that are opted for globally. EA offers relevant business
    value based on current trends related to each business priority:


    | Key Business Priority | Enterprise Architecture Value |

    |---|---|

    | Business transformation | Assert business goals, redesign business models, assess
    impacts, design and communicate future, prioritize and plan changes, and accelerate
    requirements. |

    | Strategic planning | Provide a business and enterprise framework for objectively
    prioritizing investments within and across portfolios based on strategic alignment
    and rationalization. |

    | Customer experience | Provide root-cause analysis for experience results, inform
    experience decision making (e.g., priorities, available capabilities), assess
    impacts bidirectionally (i.e., experience and business/technology environment),
    and translate experience into action. |

    | Agile execution | Provide big-picture direction and common language, focus execution
    teams on the right enterprise priorities, and accelerate requirements. |

    | Resource optimization | Provide a business and enterprise lens for optimizing
    resources (e.g., processes, system applications) for cost/simplification reasons
    and assist efforts of related disciplines (e.g., business process management and
    operational excellence). |

    | Regulatory compliance and changes | Provide a business and enterprise framework
    for assessing, addressing, and communicating regulatory impacts and risks; demonstrate
    compliance with end-to-end traceability from policy to business and IT assets.
    |

    | Emerging technologies | Assert business goals, redesign business models, identify
    key applications for emerging technology, assess impacts, design and communicate
    future, prioritize and plan changes, and accelerate requirements. |

    | Cross-organization coordination | Provide a business and enterprise framework
    for assessing, designing, planning, and executing mergers, acquisitions, joint
    ventures, joint initiatives, and startups. |


    Figure 2.4 – Key business priorities and EA value'
  merge: -1
  img_proc: true
- pgno: 69
  md: '# IT engagement model architecture and implementation


    The defining principles of an EA model include the mission, goals, objectives,
    responsibilities, and resources within an organization. Taking everyone along
    on the journey of transformation is one way to ensure fruitful outcomes.


    Creating and sharing engagement models across the board helps all stakeholders
    understand the scope and ultimate EA objectives. A communication plan, followed
    by funding details and innovative ideas, is documented in the charter.


    Here are a variety of components of engagement models:


    +   - EA ensures collaboration among various teams in an organization. It''s essential
    to be in touch with the ground realities of business processes. That is why each
    model comes with an engagement purpose. It defines the reasons for interaction
    between EA teams and other groups.

    +   - Participants include all stakeholders that are a part of the process, including
    the EA team and the groups they interact with, to achieve the identified goals.

    +   - Artifacts are extracted from the data based on analytics, and then evaluated
    or modified by this engagement type to be used as future reference.

    +   - Communication approaches ensure that all participants are on the same page
    in terms of successes, failures, capabilities, and opportunities. It ensures that
    this type of engagement is the most effective.

    +   - The timing of an engagement defines the amount of time a certain task will
    take. It evaluates the total duration of the process related to the engagement
    purpose.


    For a better understanding of these engagement purposes, here are four common
    categories of EA engagements:


    +   - Engagements solely focused on creating support for EA along with strategy
    building, portfolio management, and governance.

    +   - Engagements focused on evaluating, recognizing, collecting, and drafting
    artifacts. These elements are responsible for defining the current situation of
    EA and how it will look in the future.

    +   - Engagements focused on making an impact on the current workflow to support
    the EA''s intermediate and future states.

    +   - Engagements that focus on influencing future outcomes and decisions that
    relate to the EA''s intermediate and future states.


    Developing a consistent mindset, strategies, and actions to understand engagement
    purposes can have additional purposes and approaches, but the major ones have
    been discussed already.'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# Testing the core foundation for business agility


    Some of the reasons EA is an important element in the enablement of enterprise
    architecture are outlined next.


    # Agile teams are focused on value creation


    EA allows organizations to reuse their valuable assets across delivery teams.
    When companies work on innovative projects, it is crucial to maintain the flow
    of ongoing processes. Therefore, when agile teams have high-quality assets available
    to reuse, they are able to focus on creating a new valuable solution.


    # Common guidance enables greater consistency


    Roadmaps and blueprints set by enterprise architects are capable of ensuring great
    outcomes. When teams follow these guidelines, their work results in greater quality.
    EA facilitates learning about new assets, getting accustomed to new processes,
    and gaining an understanding of how things operate in a new business environment
    infrastructure. Moving between teams is convenient and effective because it''s
    easier for team members to catch up on their progress and share their skills and
    learnings with other team members.


    # Agile architecture enables disaggregation


    The ability to allocate tasks to the teams with the most relevant and appropriate
    skill sets is a great talent on its own. When a business solution is based on
    highly cohesive components, spreading work among smaller teams gets easier. That
    way, the delivery time is reduced by reducing the risk of organizational complexity.


    # EA scales the agile methodology


    When carried out efficiently across an organization, agile strategies can offer
    extraordinary outcomes. Companies can experience a smooth workflow paired with
    a seamless transformation process.


    A disciplined, agile approach to EA enables organizations to scale agile strategies
    across the enterprise. Effective leadership and a defined set of principles play
    a major role in setting a solid foundation.


    # Leadership principles and how they relate to enterprise architects


    An organization’s culture, ultimate goals, mantra for innovation, team interactions,
    and what keeps team members focused and motivated all come together to define
    a company’s discipline. In order to ensure that EA has maximum impact on an organization’s
    infrastructure, the team must exercise strong organizational discipline to build
    and leverage a solid foundation for EA success.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# Committing and removing barriers


    Stakeholders must embrace the discipline of being a valuable asset to the team
    and a contributor to the operating model. When it comes to the implementation
    of standard processes, data, and technology, these stakeholders play a vital role.


    Not only do employees need to abide by the organization’s regulations, but management
    must embrace them, too. Rigor in these areas helps pursue strategic opportunities
    that leverage a company’s foundation by focusing on the opportunities that can
    make a measurable difference and are a great fit for the business. To build an
    effective foundation for execution, businesses shouldn’t base their strategies
    on customer demands and competitor initiatives. Instead, they should take a leading
    approach and come up with a strategy that is all about identifying opportunities
    to leverage existing capabilities.


    A company needs a driving force to be able to execute the plans it has set for
    itself. An enterprise architect is at the forefront when it comes to a company’s
    ability to execute its strategies. Although the roadmap is designed by EA, the
    need for the attention and dedication of senior management still holds great importance.
    With multiple board members and decision-makers, having everyone on the same page
    while taking important steps can be difficult.


    When an enterprise architect takes action based solely on what they think is right,
    it can lead to more harm than good. Therefore, senior management must keep an
    open mind, let go of ego, and be involved in the articulation of the EA. By taking
    responsibility for converting an architecture into a foundation for sustainable
    execution, management can make a big difference by reinforcing governance.


    # Emphasizing strategic planning


    If you’re looking to align your agile resources and get them well in sync with
    your company guidelines, organizational strategy is a great way to move forward.
    Often, enterprise architects get stuck with day-to-day matters instead of focusing
    on strategic planning. To avoid such distractions, communicating all aspects of
    the process with teams across the board is a powerful approach. Better outcomes
    can be ensured by working closely with business and IT, drafting roadmaps and
    target dates, and visualizing the end results.


    # Being the commander and leading the way


    A team performs better when they have a leader who leads by example. An organization
    needs skilled employees, but the leader is the one who encourages that team to
    put forward their best work. The commander provides details about the core direction
    and strategy to their staff with the understanding that things can change.


    They offer space for the team to settle down and get used to new developments
    while maintaining their managing intent. The journey matters, but what most people
    will remember is the end result. That’s what the goal should be: to deliver on
    the architect’s intent.'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# Displaying the value of business architecture


    Which is better: telling people how someone solved a problem or showing them the
    journey they took to solve it? Practical examples – sharing the journey – tends
    to be more effective. Company leaders must lead by example because actions speak
    louder than words.


    Often, organizations spend most of their time trying to sell the virtues and benefits
    of business architecture. But too often, in the process, they fail to implement
    these qualities in their business architecture. Once an EA team gets past introducing
    business architecture within the organization, the best and the only way to sell
    it is by fully implementing the plan.


    # Summary


    Market trends and technology are constantly changing, and organizations that don’t
    evolve with them struggle to stay relevant. Paying close attention to the customer’s
    behavior and understanding how they approach innovation and technology can offer
    a lot of insight into upcoming trends. Enterprise architects are the specialists
    who look into these elements and come up with innovative strategies. They anticipate
    and predict the changes that might happen in the market based on a variety of
    factors, and they help organizations to better equip themselves to deal with them.


    In the process of this analysis, data evaluation, and strategic operational planning,
    enterprise architects often come across many challenges. Sometimes, management
    is not as involved as they could or should be, teams are not well structured,
    or tasks are not appropriately allocated. In the wake of these challenges, communication
    and collaboration among different groups can fail.


    Redefining and designing the whole organizational structure can be a monumental
    task, but applying the right strategy and talent to approach each step can help
    facilitate the process. Some companies might not get it right the first time,
    which is not unusual. Teams and individuals need space and time to get in sync
    with one another and to get used to the transformation process. The role of leadership
    plays an important in EA. Nothing helps more than having a manager who motivates
    team members and sets the right example through their actions.


    The next chapter is about the Amazon Web Services (AWS) cloud. We will explore
    and shed light on this transformational technology and the guiding rules to ensure
    positive outcomes when applying it. With EA, cloud capabilities provide the freedom
    to explore and take risks with technological advancements. Additionally, we’ll
    address the principles that support the process.'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# Applying Enterprise Architecture to the AWS Cloud


    An **enterprise architecture (EA)** sets the foundation for a streamlined workflow.
    So, basically, when we talk about a team of technicians, developers, database,
    and network engineers, they all use the same framework for their day-to-day organizational
    operations. Creating a consistent and defined standard for business planning,
    design, and implementation of the workload in the cloud is facilitated by EA.
    To explore this further, we will discuss the following topics in this chapter:


    +   - Introduction to EA in **Amazon Web Services (AWS)**

    +   - AWS EA tenets and EA domains

    +   - AWS services that support EA activities

    +   - Working backward with AWS

    +   - Governance, auditability, and change management


    # Enterprise architecture in AWS


    A centralized workflow establishes a way for building a workload, determining
    a roadmap for current and future operations and the path that should be taken
    to reach the ultimate goals set by the stakeholders.


    Once an EA is agreed upon by every individual involved in the process, the same
    operational methods are followed across the board. It sure comes with multiple
    benefits, including better clarity in the workload, prevention of competitive
    interests within your organization, and better compliance. The primary objective
    of every business, apart from a valuable financial outcome, is to provide services
    that fulfill customers’ needs. For an organization to execute its customer-centric
    strategy, EA guides its business, information, process, and technology decisions.'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# Business architecture domain


    Every company has a set of guidelines and standard regulations that are followed
    across the board. These define a blueprint for each business growth initiative
    and implementation. To fulfill the roles of these innovations, the business architecture
    domain describes the functional capabilities that a company holds to achieve the
    ultimate goal. The What and Who of a business growth strategy is addressed in
    a way that contributes to establishing what is the organization’s vision and the
    objectives behind any new development. Apart from that, the teams, groups, or
    capable individuals who will be assigned to execute the defined services are also
    covered.


    # Application architecture domain


    The role of each and every application that a company’s operations rely on is
    determined in this step. Interactions and relationships between the applications
    and the core business processes within the organization are established here.
    In simple words, the How of a business strategy is determined by figuring out
    how the previously defined business services were implemented.


    # Data architecture domain


    Data is the most important asset of any business in the world and defines the
    past, present, and potential future of services. This step describes the data
    assets of an organization and the way it is being exploited to improve business
    and customer satisfaction. The analysis ultimately results in an evolved business
    process.


    # Technology architecture domain


    No company can have smooth and seamless operations without modern technological
    assets. Especially in today’s advanced digital universe, describing the software
    and hardware that’s required by an organization for business and application services
    is absolutely essential.


    # Cloud initiatives and traceability across the IT landscape


    Thriving businesses love nothing more than the ability to respond faster to customer
    needs and modern business requirements, and for that, the perfect resort is EA,
    which provides agility and ensures resilience among development teams. Moreover,
    with the cloud, the enterprise has all the freedom to take risks when it comes
    to new technological advancements. However, without full control over operations
    in a company, things may not be as productive and convenient. Better compliance,
    security, and workload management can be ensured by having the right control.'
  merge: -1
  img_proc: true
- pgno: 75
  md: 'Job descriptions and defined roles are a major part of the traditional **information
    technology** (**IT**) operating model. The stakeholders of these models are developers,
    engineers, and server administrators. Such models allow organizations to consume
    the cloud as an **end-to-end** (**E2E**) team that''s working in an aligned infrastructure.
    An IT organization adopting a cloud-first strategy means that all actors use a
    similar framework for their decision-making process and managing the system.


    Mixing up two different methods by adopting an EA model while operations still
    run through traditional silos can have a devastating impact. Without a standardized
    adoption, a company is likely to end up with no centralized management and compliance.
    A team that is working toward the same goal should take the same road toward the
    finish line. When the methods or approaches of an initiative are not aligned,
    competition within an organization cannot be avoided. There would be a lot of
    confusion among the IT department regarding critical matters such as workload
    being deployed, security vulnerabilities, integrations, crucial metrics, and so
    on. Without centralized management, companies can never be sure about their security
    standards as there is no control or audit trail.


    Creating a combination of scalable cloud applications and services reduces delays
    or issues that computers or network devices may encounter in infrastructure provisioning
    and device management. When we talk about AWS, we mean the market leaders of services
    to define **infrastructure as a service** (**IaaS**) and **platform as a service**
    (**PaaS**) in cloud environments. Setting the goals for an architecture regarding
    the outcome is the first step before implementing the EA in any of the AWS services.


    Before you incorporate architecture in the cloud, make sure that all the required
    assets are at your disposal and that the team is well aware of them. Cloud solutions
    set the guidelines for organizations regarding crucial elements, including profit
    maximization, the principles of work continuity, agility, scalability, flexibility,
    and network or data security.


    Properly embedding EA domains in a cloud architecture can avoid many issues by
    building a strategy and fulfilling business expectations. Having architects focus
    their energy on collaboration to make the most out of the business strategy can
    prove to be extremely beneficial.


    EA facilitates the standards for business planning and implementation of the workload
    in the cloud. Moreover, it enables businesses to improve their customer services
    for greater outcomes using a blend of scalable cloud applications.


    # AWS EA tenets and EA domains


    The quality and consistency of decision-making play a major role in the overall
    process and outcome of an initiative. To ensure the best possible infrastructure,
    certain AWS EA principles need to be considered. They are a set of guidelines
    to be followed as they describe the big picture of the enterprise, specifically
    the technological capabilities and their impact on the institution. The principles
    are well in sync with the business mission and goals, and each one of them has
    a unique definition and implementation process.'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'All information about the organization''s ultimate goal, set of agendas, and
    mission is defined by enterprise principles to ensure harmony among processes
    in a company. Within a **business unit (BU)** or **organizational unit (OU)**,
    IT, **human resources (HR)**, domestic operations, or overseas operations are
    important elements of any enterprise principle. Principles that are used to inform
    architecture development need to be well aligned with the architecture capability
    (stable building blocks that define what an organization does) defined by the
    organization itself.


    Establishing a sustainable architecture practice within an organization can be
    achieved by adhering to the same approach that is used to establish any other
    capability—such as a **business process management (BPM)** capability—within an
    organization.


    These principles ensure a level of collaboration and consensus across the enterprise
    that leads to better decision-making. Architecture principles set the foundation
    for an effective process by governing the architecture process, its maintenance,
    implications, and impacts. They often restate other enterprise guidance in a way
    that effectively guides architecture development. Deployment of all IT resources
    and assets across the enterprise are also monitored and defined by the architecture
    principles as they form a basis for making future IT decisions. Nonetheless, all
    aspects of the architecture principles are tightly knit with the business objectives
    driving forces behind it.


    # Components of architecture principles


    Each architecture principle should have associated rationale and implications
    statements. When deployed appropriately, they can effortlessly promote understanding
    and acceptance of the principles themselves collectively. The process ultimately
    helps in explaining and justifying the reasons behind adopting certain principles,
    and should include the following aspects:


    +   - **Name**: Should be easy to remember and should represent the essence of
    the rule. No specifications are necessary for this section, such as a specific
    technology platform. Ambiguous words such as *support*, *open*, and *consider*
    can create a bit of confusion. Always remember to avoid unnecessary adjectives
    and adverbs.

    +   - **Statement**: Should clearly communicate the fundamental rule by eliminating
    any ambiguity. Principle statements for managing information are similar for most
    organizations.

    +   - **Rationale**: Should highlight the business benefits of adhering to the
    principle, using corporate vocabulary. Point to the similarity between technology
    principles and the principles governing business operations. Mention the relationship
    with other principles and intentions regarding a balanced interpretation. Describe
    use-case scenarios of following guidelines set by these principles.

    +   - **Implications**: Should highlight business and IT requirements for carrying
    out the principle regarding resources, costs, and activities. Clearly state the
    impact on the business and the consequences of adopting a principle. Answer questions
    such as *How does this affect me?* Mention that some outcomes are speculative
    and potential, rather than fully analyzed.'
  merge: -1
  img_proc: true
- pgno: 77
  md: '# Developing architecture principles


    Key stakeholders within a system come together for the development of architecture
    principles. The principles are put together by enterprise architects and are implemented
    after the approval of the Architecture Board. One of the most important requisites
    includes clear traceability that leads to a comprehensive articulation to guide
    the decision-making process. The principles ensure that the architecture and implementation
    of the target architecture are well aligned with business strategies and objectives.
    Here are the elements that influence architecture principles:


    +   - The enterprise mission of the company justifies their planning at each step
    toward a certain goal of enterprise.

    +   - An enterprise''s **strengths, weaknesses, opportunities, and threats (SWOT)**
    influence the principles to a great extent. Moreover, current initiatives define
    a roadmap for future business strategies.

    +   - External elements that define market trends such as **time-to-market (TTM)**
    imperatives, customer behavior, and so on, along with existing and potential legislation.

    +   - The existing assets and infrastructure of an organization have a huge impact
    on architecture principles, such as information resources including systems documentation,
    equipment inventories, network configuration diagrams, policies, and procedures.

    +   - The latest technological and business trends—for example, predictions about
    economic, political, and market factors that influence the overall enterprise
    setup.


    # Qualities of principles


    It takes varied factors to determine whether a principle is good, great, or simply
    a waste of effort. A poor set of principles becomes redundant quite quickly and
    results in a lack of credibility. A combination of fancy words gathered on a piece
    of paper does not define a principle''s value or whether the decision-makers agree
    on it or not. Values that are rooted deep in a company''s foundation and followed
    unconsciously across the board are something we can safely call a good set of
    principles. They are defined in a language that is understandable by each stakeholder
    and is not complicated or unnecessarily lengthy. Principles that can be endorsed
    by the management provide a firm foundation for making architecture and planning
    decisions. They build policies around future strategies, procedures, and standards
    to support the resolution of contradictory situations. We have listed five criteria
    to help distinguish between a set of good and bad principles. According to this
    list, a good principle has the following attributes:


    +   - **Understandable:** Something that is too complicated to grasp can never
    make a deep and long-lasting impact. However, the underlying tenets that are easily
    understandable by individuals throughout the organization have made it to our
    list of good principles. Its purpose should be clear and unambiguous so that the
    risk of internal or external violations can be minimized.'
  merge: -1
  img_proc: true
- pgno: 78
  md: '+   - **Robust**: Principles should enable decision-makers to make valuable
    decisions about architecture followed by the implementation of policies. Each
    principle should be sufficiently definitive on its own and precise enough to support
    the ongoing decision-making process in unconventional situations.

    +   - **Complete**: A attribute of principles that not only governs the management
    of company information about the business but also covers every situation perceived
    regarding technology and other advancements.

    +   - **Consistent**: The kind of principle that is relevant to the overall process
    of business strategy and offers a balance in interpretations. Adhering to one
    principle shouldn''t violate the spirit of another. A consistent, scalable, and
    flexible interpretation of every word in the document is essential.

    +   - **Stable**: Businesses are constantly evolving as per customer behavior,
    and principles should be enduring enough to accommodate changes. There should
    be scope for adding, removing, or altering principles based on these changes.


    # Applying architecture principles


    The way an enterprise uses and deploys IT resources and assets within an organization
    is decided by stakeholders leveraging the architecture principles. They are used
    every step of the way to ensure a productively smooth process followed by maximum
    outcomes, as explained in more detail here:


    +   - Architecture principles guide the creation of a roadmap and facilitate the
    process whereby the enterprise makes conscious decisions about EA.

    +   - Architecture principles work as a guiding force that exerts an influence
    on the selection of products and solutions followed by establishing relevant evaluation
    criteria.

    +   - Architecture principles are, in a nutshell, drivers for defining requirements
    related to the business and technology of the architecture.

    +   - Architecture principles aid the process of evaluating existing implementations.
    This process helps in compliance with the defined architectures. Using analysis
    reports, valuable insights are utilized for transition activities to define and
    implement architecture goals.

    +   - The architecture principles’ implication statement provides valuable inputs
    for future transition initiatives and planning activities. Moreover, it sets the
    foundation for primary tasks, resources, and potential costs to the enterprise.

    +   - When it comes to architecture governance activities, architecture principles
    provide support for architecture compliance assessments. Also, they enable the
    system to initiate a dispensation request within the local operating procedure.
    This is accomplished by assessing the health of a system/application/solution
    to determine its conformance to a target reference architecture’s standards and
    guidelines, including detecting patterns and technology anomalies.'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'While applying architecture principles, choosing the right one as per the situation
    can be a difficult and complex job. The wrong pick can often lead to devastating
    outcomes. In order to avoid any confusion or finger-pointing in the future, the
    rationale for such decisions should always be documented. Companies or departments
    might not feel the need for continuous documentation at that particular point.
    However, it should be a common practice to bring everything on record by having
    it in written form. A principle often seems self-evident, but the guidance in
    a principle could be complicated and have multiple aspects to it. While being
    multidimensional, principles should be obvious as they help ensure decisions that
    lead to the desired outcome.


    Those who violate principles might take things lightly, and letting such matters
    go can set a wrong precedence. A declaration of principles may not contain specific
    penalties, but it can actually cause operational problems and affect the ability
    of the organization to fulfil its mission in the long run.


    # An example set of architecture principles


    Higher management reaching a mutual agreement on a number of principles can be
    a tough task as too many principles can reduce the flexibility of the architecture,
    and too few will not have the right level of impact. Some organizations document
    principles for each level within a department; others, however, prefer to define
    only high-level principles.


    Take the following diagram as a reference for both the typical content of a set
    of architecture principles and the recommended format for defining them:


    ![](img/16bfeb984938aba3d9334582c2cd6e69_79_0.png)


    Figure 3.1 – Architecture principles and format for defining them'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'Next, we move on to business principles with their rationale and limitations.
    Each principle is unique and defines a particular situation under which the users
    derive their own meanings and face certain constraints.


    # Business principles


    # Principle 1 – Primacy of principles


    **Statement:** All organizations within the enterprise must adhere to the following
    principles of information management.


    **Rationale:** In order to ensure that the information provided to the decision-makers
    is consistent and measurable, all organizations must align their infrastructures
    and abide by the principles.


    **Implications:**


    +   - This principle helps avoid exclusions, favoritism, and inconsistency. Otherwise,
    it is capable of undermining the management of information.

    +   - Information management initiatives are incapable of implication without
    being examined for compliance with principles.

    +   - Change the framework of the initiative to resolve conflict with a principle.


    # Principle 2 – Maximize benefits to the enterprise


    **Statement:** Maximum benefits to the enterprise are ensured by information management
    decisions as a whole.


    **Rationale:** Maximum **return on investment (ROI)** requires information management
    decisions to stick to enterprise-wide strategies. *Service above self* is what
    this principle is all about. Any decision or step that is taken with a broad-minded
    approach while keeping in mind the enterprise-wide perspective turns out to be
    more effective than ones that are made from any particular organizational perspective.
    No individual or a group will detach from the benefit of the whole enterprise.


    **Implications:**


    +   - Bigger goals require bigger risks and drastic decisions, therefore enterprise-wide
    massive benefits require changes in planning strategy. This step needs decision-makers
    to go beyond IT to bring about this change.

    +   - Letting go of the organization''s preferences might be required, or bringing
    them down in the priority list could be needed for the greater benefit of the
    entire enterprise.

    +   - The entire enterprise should be on board to decide on the application development
    priorities for the entire enterprise, and application components should be shared
    across the board.'
  merge: -1
  img_proc: true
- pgno: 81
  md: '+   - An enterprise plan must always set the foundation for conducting information
    management initiatives. Meanwhile, individual organizations pursue initiatives
    that are in accordance with blueprints established by the enterprise.

    +   - With the changing need of redefining principles based on special circumstances,
    priorities must be adjusted. For that purpose, a comprehensive enterprise representation
    forum should reach a decision.


    # Principle 3 – Information management is everybody’s business


    **Statement**: Information management decisions that are made for accomplishing
    business goals must be backed by all organizations in the enterprise.


    **Rationale**: All organizations in the enterprise must be fully involved in all
    aspects of the information environment. That is the only way to ensure that information
    management is aligned with the business. All information users play the role of
    key stakeholders in the implementation of technology that ultimately addresses
    a business need. Business experts from across the enterprise and technical staff
    come together as a team to take responsibility for developing and sustaining the
    information environment that defines the goals and objectives of IT.


    **Implications:**


    +   - Working toward a common goal as a team. Each stakeholder must take responsibility
    for developing the information environment.

    +   - Sufficient and sustainable resources required to implement this principle
    need to be provided consistently.


    # Principle 4 – Business continuity


    **Statement**: Enterprise operations are maintained despite any system interruptions.


    **Rationale**: Imagine a day at your workplace without desktops, laptops, the
    internet, or a communication platform such as Slack. How unproductive would that
    day be? This is all because we are greatly dependent on system operations. With
    them being more pervasive, enterprises must consider the reliability of such systems
    throughout their design and use to ensure the uninterrupted flow of information.
    Certain tools are essential for conducting day-to-day operations, thus business
    premises throughout the enterprise should be equipped with capable ones to continue
    business functions regardless of external events. Extra steps need to be taken
    to avoid any kind of disruption in case of hardware failure, natural disasters,
    and data corruption. An alternative information delivery mechanism must always
    be in place.


    **Implications:**


    +   - Natural disasters or system failures are a part of the process, hence a
    reliable alternative must be put in place in advance and managed.'
  merge: -1
  img_proc: true
- pgno: 82
  md: '+   - Periodic reviews, vulnerability testing, and designing of mission-critical
    services should ensure uninterrupted business function through alternative capabilities.

    +   - When the system is being put in place by enterprise architects, matters
    such as recoverability, redundancy, and maintainability should be addressed at
    that time.

    +   - The impact of applications must be assessed for the enterprise mission.
    This helps in coming up with a recovery plan.


    # Principle 5 – Common business applications


    **Statement:** Business processes and applications that are used across the enterprise
    for the execution of a process are better than having duplicative applications
    that are only provided to a particular organization.


    **Rationale:** Duplicative resources mean increased cost and proliferate conflicting
    data.


    **Implications:**


    +   - Organizations dependent on applications that only serve a particular organization
    instead of the whole enterprise must replace these with ones that are adaptable
    enterprise-wide. Establishment and adherence to a policy requiring this are crucial.

    +   - Similar/duplicative capabilities cannot be developed by organizations that
    are dedicated to them. Expenditure of scarce resources can be decreased by having
    a joint-application approach that will be more effective and cost-efficient.

    +   - Enterprise decision-making supported by data and information will be standardized
    to a much greater extent.

    +   - Organizational capabilities producing different data will be replaced by
    enterprise-wide capabilities.


    # Principle 6 – Service orientation


    **Statement:** The design of services that mirror real-world business activities
    creates an architecture along with business processes.


    **Rationale:** There are no boundaries when it comes to the flow of information,
    and the service orientation delivers enterprise agility.


    **Implications:**


    +   - Business descriptions are utilized by service representation to provide
    context such as business goal, process, policy, service interface, and so on,
    and services are implemented using service orchestration

    +   - Unique requirements are placed on the infrastructure, and open standards
    are used for implementations to realize location transparency'
  merge: -1
  img_proc: true
- pgno: 83
  md: '+   - Implementations are often constrained or enabled by context and must
    be described within that context

    +   - Strong governance of service representation and implementation is required


    # *Principle 7 – Compliance with the law*


    **Statement:** Enterprise information management processes stick to all relevant
    policies and regulations.


    **Rationale:** Adhering to laws, policies, and regulations in the enterprise policy
    will not preclude business process improvements leading to changes in regulations.


    **Implications:**


    +   - The enterprise complies with laws, regulations, and policies regarding the
    collection and management of data

    +   - Education and access to the rules are ensured by the enterprise

    +   - Updated laws and regulations may drive changes in processes or applications


    # *Principle 8 – Protection of intellectual property*


    **Statement:** Protection of an enterprise’s **intellectual property (IP)** is
    absolutely essential. It must be reflected in IT architecture, implementation,
    and governance processes.


    **Rationale:** A major part of an enterprise’s IP is hosted in the IT domain.


    **Implications:**


    +   - Actual protection of IP assets is implemented in the IT domain. Trust in
    non-IT processes can be managed by IT processes as well, such as email, mandatory
    notes, and so on.

    +   - A security policy for the governance of human and IT actors is required
    to improve the protection of IP. This eliminates compromises and reduces liabilities.


    # Data principles


    # *Principle 9 – Data is an asset*


    **Statement:** Data is of great value to the enterprise and is managed accordingly.


    **Rationale:** Real and measurable value of data can never be underestimated as
    it facilitates the decision-making process. Data is carefully managed just like
    all other company assets to set the foundation of a business strategy. The enterprise
    is well aware of where the data is, whether a team can rely upon its accuracy,
    and whether it can be extracted when needed.'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# Implications:


    +   - Three principles combine together to form this: data is an asset, shared,
    and accessible.

    +   - Ensure that all organizations within the enterprise understand the relationship
    between the value of data, sharing, and accessibility.

    +   - Teams must be authorized to manage data for which they are accountable.

    +   - Adopt the approach of *data stewardship* and let go of *data ownership*.

    +   - Don’t let obsolete or inconsistent data pass to enterprise personnel as
    this can adversely affect decisions across the enterprise.

    +   - A data steward who manages data ensures data quality as well.

    +   - Develop procedures to prevent, identify, and correct errors in the information.
    Fix processes that produce flawed information.

    +   - An enterprise-wide forum should decide on changes in the process suggested
    by the steward.

    +   - Data stewards accountable for who is responsible for properly managing data
    are assigned at the enterprise level.


    # Principle 10 – Data is shared


    **Statement:** Data that is essential for executing duties is accessible to the
    organization, hence this is shared across enterprise functions and organizations.


    **Rationale:** To improve the quality and efficiency of enterprise decision-making,
    it is essential to maintain timely, accurate data in one application and then
    share it, rather than maintaining duplicate data in multiple applications. There
    is a wealth of stored data in the enterprise, but it is organized in hundreds
    of stove pipe databases. The ability to share these islands of data across the
    enterprise will determine how fast it can collect, create, transfer, and assimilate
    data.


    When data is shared, we will be able to make better decisions as there are fewer
    sources of more accurately managed data to rely on. Data that is transferred via
    the network will be more efficient because data entities are reused without having
    to enter data again.


    # Implications:


    +   - Three principles combine together to form this: data is an asset, shared,
    and accessible.

    +   - Ensure that all organizations within the enterprise understand the relationship
    between value, sharing, and accessibility to data.

    +   - Abide by a common set of policies, procedures, and standards governing data
    management to ensure easy access short- and long-term.

    +   - Invest in software that is capable of migrating legacy system data into
    a shared data environment.'
  merge: -1
  img_proc: true
- pgno: 85
  md: '+   - Develop standard models and other metadata to create a repository system
    to make it accessible after efficiently storing it.

    +   - Adopt and enforce data access guidelines for new application developers
    when legacy systems are replaced. Ensure that data in new applications remains
    accessible and continues to be used by new applications.

    +   - Adopt common methods and tools to create, maintain, and access data shared
    across the enterprise.

    +   - Data sharing requires a significant cultural change.

    +   - In no circumstances will the principle of data sharing compromise confidential
    information.

    +   - All users will rely on data to execute their respective tasks. Ensure that
    the most accurate data is being relied upon for decision-making.


    # Principle 11 – Data is accessible


    Statement: Data is accessible for users to perform their functions.


    Rationale: Providing users with access to information enables them to make quick
    and effective decisions and to respond to requests for information and service
    in a timely manner. Using information must be considered from an enterprise perspective
    to allow wide access by a variety of users.


    Implications:


    +   - Three principles combine together to form this: data is an asset, shared,
    and accessible.

    +   - Ensure that all organizations within the enterprise understand the relationship
    between value, sharing, and accessibility to data.

    +   - Provide ease of accessibility with which users obtain information.

    +   - The information must be accessible and displayed in a way that can accommodate
    a wide range of enterprise users.

    +   - Understanding the data is essential. Individuals should not misinterpret
    information.

    +   - Access to data does not mean the user has access rights to modify or disclose
    the data.


    # Principle 12 – Data trustee


    Statement: A trustee is responsible for the quality of each data element.


    Rationale: When data is entered multiple times, its integrity may be compromised,
    so the data trustee will be solely responsible for eliminating redundant effort
    and data resources. It is one of the advantages of an architected environment
    to be able to share data within the enterprise. It becomes increasingly important
    that the single authority making decisions is the data trustee.'
  merge: -1
  img_proc: true
- pgno: 86
  md: '**Important note**

    In contrast to a steward, a trustee is responsible for data accuracy and currency,
    whereas a steward may also be responsible for standardization and definition.


    # Implications:


    +   - With a real trusteeship, data ownership issues are resolved, allowing all
    users to have access to the data. Therefore, a cultural shift from data *ownership*
    to data *trusteeship* may be necessary.

    +   - The data trustee is accountable for meeting quality requirements for the
    data.

    +   - The trustee should have the ability to provide user confidence in the data
    based on data sources.

    +   - Identify the true source of the data so that the data authority can be assigned
    the responsibility of a trustee. However, classified sources will be revealed.

    +   - Once information is captured electronically, it should be validated as close
    to the source as possible. To ensure the integrity of the data, **quality control
    (QC)** measures must be implemented.

    +   - Sharing data across organizations makes trustees accountable for the accuracy
    and currency of their data elements. Therefore, trustees must recognize the importance
    of their trusteeship role.


    # *Principle 13 – Common vocabulary and data definitions*


    **Statement:** The definitions of data are consistent across the enterprise, and
    users have easy access to the definitions.


    **Rationale:** To facilitate data sharing across headquarters, the data that will
    be used in developing applications must be defined in a common way. This will
    enhance communication and facilitate effective dialogue. The systems must also
    be interfaced, and data exchanged.


    # Implications:


    +   - We are led to believe that this issue is adequately addressed due to the
    existence of people with *data administration* job titles. This task requires
    a significant amount of additional energy and resources and improving the information
    environment relies heavily on it. A large community addresses the issue of data
    element definition, which is separate but sufficiently related, like a common
    vocabulary.

    +   - The enterprise must establish an initial common vocabulary for the business.

    +   - The definition effort will be reconciled with the corporate *glossary* when
    a new data definition is required.

    +   - Multiple parochial meanings of data must give way to enterprise-wide definitions
    to avoid ambiguity.'
  merge: -1
  img_proc: true
- pgno: 87
  md: '+   - Need for coordinated data standardization initiatives.

    +   - Responsibilities must be assigned for functional data administration.


    # Principle 14 – Data security


    **Statement:** Data protection against unauthorized use includes, but is not limited
    to, the protection of pre-decisional, sensitive, source selection-sensitive, and
    proprietary information. In addition, the typical features of national security
    classification apply.


    **Rationale:** The necessity to restrict access to secret, proprietary, and sensitive
    information must be weighed against the open sharing of information and the release
    of information via suitable legislation.


    To minimize undue conjecture, misunderstanding, and improper usage, **work-in-progress
    (WIP)** material must be preserved. Existing regulations demand that national
    security and data privacy be protected while allowing free and open access.


    # Implications:


    +   - Gathering information in any form will make a huge objective requiring a
    survey and de-characterization methodology to keep up with fitting control.

    +   - This review and declassification are handled by appropriate policy and procedures.
    Regular reviews of the information are important as access to information is based
    on a need-to-know policy.

    +   - Separate systems to contain different classifications should be revamped.

    +   - See if the current system or solution is too expensive to manage unclassified
    data on a classified system. Combine the two by placing unclassified data on the
    classified system, where it must remain.

    +   - Identify security needs to provide access to open information in a secure
    way.

    +   - Restrict access to *view only* or *never see* for security purposes.

    +   - Decide on the labeling of data for access to pre-decisional, decisional,
    classified, sensitive, or proprietary information.

    +   - Design security into data elements from the beginning.

    +   - Safeguard systems, data, and technologies against inadvertent or unauthorized
    alteration, sabotage, disaster, or disclosure.

    +   - Manage duration of protection for pre-decisional information using new policies
    in consideration of content freshness.'
  merge: -1
  img_proc: true
- pgno: 88
  md: '# Application principles


    # *Principle 15 – Technology independence*


    **Statement:** Applications are autonomous of explicit innovation decisions. This
    way, they can work on multiple innovation stages.


    **Rationale:** Technological independence allows applications to be developed,
    upgraded, and operated in the most cost-effective and timely way. However, the
    innovation that is dependent on external factors such as vendors becomes the driver
    rather than the user requirements themselves.


    Every IT-related decision makes us dependent on that technology. This principle
    ensures that application software is not dependent on specific hardware and operating
    systems software.


    **Implications:**


    +   - Standards supporting portability are essential.

    +   - Most applications for **commercial off-the-shelf (COTS)** and **government
    off-the-shelf (GOTS)** applications are technology- and platform-dependent.

    +   - Subsystem interfaces to enable legacy applications need to be developed.
    They interoperate with applications and operating environments within the EA.

    +   - Use middleware to decouple applications from specific software solutions.

    +   - Java and future Java-like protocols could be opted for as they give a high
    degree of priority to platform independence.


    # *Principle 16 – Ease of use*


    **Statement:** Applications are easy to use, along with a transparent underlying
    technology so that users can concentrate on tasks at hand.


    **Rationale:** Ease of use is a positive incentive for user adoption. The more
    a user has to understand the underlying technology, the less productive they are.
    Rather than developing independent systems to do the same task outside of an enterprise’s
    integrated information environment, the integrated information environment encourages
    users to work within it.


    Using a system should be as straightforward as driving a different car since most
    of the knowledge required to operate it will be similar to that required to operate
    other systems. Training will be kept to a minimum, and improper use of the system
    is extremely unlikely.


    **Implications:**


    +   - It will be necessary for all applications to have the same *look and feel*
    and support ergonomic requirements; hence, a common look-and-feel standard must
    be created, along with usability test criteria that can be applied to all applications'
  merge: -1
  img_proc: true
- pgno: 89
  md: '+   - An interface should not be constrained by narrow assumptions about the
    location, language, system training, or physical capabilities of the user

    +   - A variety of factors affect the ease of use of an application, including
    linguistics, physical attributes of the user (visual acuity, ability to use a
    keyboard and mouse), and skill in technology use

    +   - Technology principles


    # *Principle 17 – Requirements-based change*


    **Statement:** Changes to applications and technology are only made in response
    to business needs.


    **Rationale:** Through this principle, the information environment will change
    in response to the business''s needs, rather than the business adapting to IT
    changes.


    By changing technology, business needs may change and, therefore, unintended effects
    on business will be minimized.


    **Implications:**


    +   - An EA will be used to examine proposed changes prior to implementation.

    +   - Technical improvement and system development will not be funded without
    a documented business need.

    +   - We will develop and implement change management processes conforming to
    this principle. This principle may clash with the principle of responsive change.
    We must ensure that response to legitimate business needs is not hindered by requirements
    documentation.

    +   - Business needs should be kept in focus, not technical needs—managing change
    in a responsive manner also falls under this category.


    # *Principle 18 – Responsive change management*


    **Statement:** It is imperative that changes to the enterprise information environment
    are made in a timely manner.


    **Rationale:** The enterprise information environment must be able to accommodate
    the needs of people in order for them to be expected to work within it.


    **Implications:**


    +   - There must be ways to manage and implement change without creating delays.

    +   - A user who feels the need for change needs to speak with a *business expert*
    who can enlighten them and help implement it. Adopting this principle may require
    additional resources.

    +   - In order to implement changes, the architectures should be kept up to date.'
  merge: -1
  img_proc: true
- pgno: 90
  md: '+   - This will result in a conflict with other practices such as the maximization
    of enterprise-wide benefits and applications.


    # Principle 19 – Control technical diversity


    Statement: Maintaining expertise in and connectivity between multiple processing
    environments is not trivial due to technological diversity.


    Rationale: In order to support alternative technologies for computing environments,
    there is a real, non-trivial cost of infrastructure. There are further infrastructure
    costs associated with maintaining multiple processor architectures connected together.
    Keeping the number of supported components to a minimum simplifies maintenance
    and reduces costs.


    Standard packaging will simplify implementation; deployment impacts will be predictable;
    valuations and returns will be predictable; testing will be redefined. Technical
    administration is controlled better when limited resources focus on a shared set
    of technologies.


    Implications:


    +   - This principle directly ties policies and procedures that govern the acquisition
    of technology.

    +   - Technology choices are highly affected by available ones within the blueprint.

    +   - Technology that evolves with modern requirements will have to be developed
    and put in place.

    +   - The technology blueprint will be modified based on improvements in operational
    efficiency.


    # Principle 20 – Interoperability


    Statement: Data, applications, and technology should be interoperable using defined
    standards.


    Rationale: By providing consistency, standards make it easier to manage systems,
    increase user satisfaction, and protect existing IT investments, maximizing their
    return while reducing costs. Interoperability helps ensure support from multiple
    vendors for their products and facilitates supply chain integration.


    Implications:


    +   - The use of industry standards and interoperability standards will be followed
    unless there is a compelling business reason to implement a non-standard solution

    +   - A process for defining standards, reviewing and revising them periodically,
    and granting exceptions must be in place

    +   - Current IT resources must be identified and documented


    All the principles provide a stepping stone to set the right foundation for an
    effective workflow. Moreover, the need for AWS services that ensure efficient
    EA activities remains crucial.'
  merge: -1
