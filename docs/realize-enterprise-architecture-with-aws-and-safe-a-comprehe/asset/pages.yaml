- pgno: 157
  md: '# TOGAF Framework

    in Action with AWS


    In contrast to traditional waterfall processes, architecture can be developed
    in an iterative manner. Evidently, Agile-Scrum methodologies have proven to be
    successful because they emphasize iteration. In this process, documentation and
    proper planning do not have to be neglected. In fact, they should be encouraged.


    In this chapter, we will cover the following topics:


    +   - TOGAF – Architecture Development Method (ADM) phases and approaches

    +   - Cloud architecture development method

    +   - Cloud ecosystem reference models

    +   - Enterprise architecture principles of the cloud ecosystem


    # TOGAF – ADM phases and approaches


    Our goal is to develop an Information Systems architecture that functions efficiently
    and effectively. But remember, this is not to create endless and unnecessary artifacts.
    Generally, agile projects involve iteration during the requirements phase. Projects
    rarely have clearly defined and understood business requirements, without needing
    to elicit and clarify them beforehand.'
  merge: -1
  img_proc: true
- pgno: 158
  md: 'Listed in the following table are the ADM phases. Each phase covers a specific
    role and describes the essential aspects:


    | Phase | Description |

    |---|---|

    | Preliminary Phase | Creating an architecture capability requires preparation
    and initiation activities, such as customizing TOGAF, selecting tools, and defining
    architecture principles. |

    | Requirements Management | Business requirements should be incorporated within
    every step of the TOGAF project. An ADM phase handles, deals with, and prioritizes
    requirements based on their identification, storage, and input and output. |

    | Phase A: Architecture Vision | TOGAF projects should have a clear scope, requirements,
    and expectations. Establish an architecture vision and identify stakeholders.
    Establish a Statement of Architecture Work and validate the business context.
    Gain approvals for any changes. |

    | Phase B: Business Architecture

    Phase C: Information Systems Architectures

    Phase D: Technology Architecture | The following four domains are to be developed:

    1. Business

    2. Information Systems – application

    3. Information Systems – data

    4. Technology


    Build the baseline and target architectures for each case and assess the gaps.
    |

    | Phase E: Opportunities and Solutions | Identify the building blocks identified
    previously, and determine the vehicles that will deliver them. Identify the transition
    architectures required if an incremental approach is needed. |

    | Phase F: Migration Planning | Plan the implementation and migration of the baseline
    architecture to the target architecture by developing detailed plans. |

    | Phase G: Implementation Governance | Oversee implementation from an architectural
    perspective. Draft architecture contracts and issue them. Inspect project execution
    for conformance to the architecture. |

    | Phase H: Architecture Change Management | To ensure that the architecture meets
    the enterprise’s needs and maximizes its value, the architecture should be monitored
    continuously, and a change management process should be established. |


    # Preliminary phase


    In this first phase, the enterprise is defining when, where, what, why, whom,
    and how the architecture should be done in the enterprise. The main aspects are
    listed as follows:


    +   - Enterprise definition

    +   - Key drivers and elements in the organizational context identification

    +   - Requirements for the architecture

    +   - Development of architecture principles'
  merge: -1
  img_proc: true
- pgno: 159
  md: '+   - Definition of the architecture framework

    +   - Relations between management frameworks

    +   - Assessment of enterprise architecture maturity


    In order for executives, planners, architects, and engineers to coordinate, integrate,
    and conduct their activities effectively, the enterprise architecture provides
    a strategic, top-down view of the organization. Through the enterprise architecture
    framework, this team has a strategic framework that enables them to conduct their
    activities effectively. Therefore, enterprise architects must take into account
    the interoperability between their frameworks and those throughout the organization,
    so it is not possible to develop the enterprise architecture in a solitary manner.
    Aspirations and goals must be set at the strategic, interim, and tactical levels.


    # Enterprise


    Architecture faces a number of challenges related to the scope of an organization.
    Enterprise architecture capability will have the most impact on stakeholders based
    on the enterprise''s scope and whether it is federated. In order for the resultant
    activity to have resources and clear support from management, at this stage, it
    is imperative that a sponsor is appointed. There might be many organizations within
    the enterprise, and the sponsor is responsible for ensuring that all stakeholder
    groups are included in defining, establishing, and utilizing the architecture
    capability.


    # Organizational context


    An enterprise must understand the context surrounding the architecture framework
    it plans to use before it can make informed and effective decisions. The following
    list of specific areas should be considered:


    +   - When no commercial model or budget is available for enterprise architecture,
    it should be based on the preliminary phase

    +   - Identifying the key issues and concerns of enterprise stakeholders across
    the architecture life cycle

    +   - Describing the business principles and goals of the organization, as expressed
    in the directions, imperatives, and strategies set forth by the board of directors

    +   - Focusing on technology and information portfolio management processes and
    methods along with current systems design and development frameworks and methods

    +   - Based on the baseline architecture, describe how the landscape is currently
    portrayed in the documentation, along with the state of the enterprise

    +   - Organizations and enterprises adopting the framework must identify their
    skills and capabilities.'
  merge: -1
  img_proc: true
- pgno: 160
  md: '# Requirements for architecture work


    The requirements and performance metrics of enterprise architecture work are driven
    by business imperatives. It is essential that the business outcomes and resource
    requirements are sufficiently clear for this phase to define the scope of the
    enterprise architecture work to be done and define the outline of enterprise business
    information requirements and associated strategies. Some examples are listed here:


    +   - Business requirements

    +   - Cultural aspirations

    +   - Organizational intents

    +   - Strategic intent

    +   - Forecasting financial requirements


    It is important to articulate the key elements of each of these. As part of the
    process of defining and establishing an architecture capability, it is necessary
    for sponsors to identify all the relevant decision-makers and stakeholders.


    # Principles


    Prior to commencing any architecture work for enterprise approval, the preliminary
    phase defines the architectural principles. In order to develop an enterprise
    architecture, the architecture principles must be defined. In addition to architecture
    principles, business principles play a role in enterprise architecture. The business
    principles are also part of the architecture principles themselves. Normally,
    the architecture function is not responsible for defining business principles.
    These principles might be cross-referenced with other business principles, strategic
    business drivers, or business goals if they’re formulated and promulgated within
    the enterprise.


    # Management frameworks


    A TOGAF framework must coexist with other management frameworks, either formally
    or informally, that might exist within an organization. Most organizations develop
    solutions using a system, which in the majority of cases has an IT component.
    In business, systems are important because they include both people and processes.
    TOGAF is recommended to be coordinated with the following list of frameworks:


    +   - Business capability management includes the definition of **Return on Investment
    (ROI)** and the performance measures needed to determine the business capabilities
    required to deliver business value

    +   - The methods used to manage a company''s change initiatives depend on the
    project or portfolio'
  merge: -1
  img_proc: true
- pgno: 161
  md: '+   - Operations management describes how a business runs its day-to-day operations,
    including how it manages the IT of its business

    +   - The process of delivering business systems according to the architecture
    of the IT system in accordance with the methods of solution development


    # Relating the management frameworks


    To plan, create, and deliver the architectural components specified in the project
    charters, the portfolio management framework employs a solution development methodology.
    A new building, new skills, new equipment, hiring, marketing, and more are examples
    of deliverables, but they are not exclusive to IT. Business processes are supported
    by enterprise architecture, not just IT. For the benefit of the enterprise, the
    management frameworks need to complement one another and work together.


    At the strategy level, enterprise architecture is guided by business planning.
    Providing updated planning at an annual level is a method of providing a more
    fine-grained level of guidance. Another method popular with businesses is capability-based
    planning. Sometimes, enterprise architects are moved to strategic direction groups
    or work closely with them within some organizations. Enterprise architecture frameworks
    are developed using TOGAF. As displayed in the following diagram, capability planning
    is a complex cycle that requires an understanding of multiple aspects of the business:


    ![](img/16bfeb984938aba3d9334582c2cd6e69_161_0.png)


    Figure 6.1 – The cycle of business development and capability planning


    # Business change maturity evaluation


    Using capability maturity models, an organization can assess how well it can exercise
    its various capabilities. Typically, capability maturity models identify which
    factors must be present for the capability to be exercised. It is possible to
    identify sequential steps that will help improve a capability by measuring an
    organization’s ability to execute specific factors. Executives can use this as
    a tool to improve their capabilities pragmatically.'
  merge: -1
  img_proc: true
- pgno: 162
  md: "To develop and consume enterprise architecture, an enterprise architecture\
    \ maturity model must cover the features that are necessary. However, it is recommended\
    \ that organizations take existing maturity models, customize them, and then determine\
    \ which factors they should consider.\n\n# Phase A – the architecture vision\n\
    \nStarting with Phase A, the sponsoring organization sends the architecture organization\
    \ a Request for Architecture Work document. Additionally, it describes what is\
    \ included and what is not included in the architecture effort, along with the\
    \ constraints that must be addressed.\n\n# General\n\nADM cycle’s scope definition\
    \ for architecture activity will be defined within the preliminary phase and embodied\
    \ in the architecture framework for the architecture vision phase. The architecture\
    \ vision phase will only address the specific objectives of the ADM cycle. Consider\
    \ revisiting the preliminary phase and extending the enterprise architecture framework\
    \ when the architecture framework in place does not align with the proposed architecture\
    \ vision.\n\n# Creating the architecture vision\n\nIt is the sponsor’s job to\
    \ sell stakeholders and decision-makers in the enterprise the benefits of the\
    \ proposed capability through the architecture vision. By addressing stakeholders’\
    \ concerns, it meets the organization’s objectives while also addressing stakeholders\
    \ concerns. Adapting to emerging technologies and the impact they might have on\
    \ industries and enterprises is an integral part of the architecture vision, without\
    \ which many business opportunities might be missed.\n\nOne of the key parts of\
    \ this activity is clarifying and agreeing on the purpose, and the purpose needs\
    \ to be reflected clearly in what is created for the architecture effort. In a\
    \ broader business strategy or enterprise planning process, the enterprise mission,\
    \ vision, strategy, and goals are part of an organization’s architecture vision.\
    \ To build a bridge between the enterprise strategy and the goals and decisions\
    \ underlying the architecture, it is imperative to verify and understand the documented\
    \ business strategy and goals. Businesses model their benefits to customers and\
    \ stakeholders, which is an important strategy artifact.\n\nLet’s examine and\
    \ search for materials on fundamental business architecture concepts, such as\
    \ the following:\n\n+   - **Business capabilities:**\n+   \n+     These are specific\
    \ abilities or abilities that a business might have or exchange to help it achieve\
    \ a particular goal or objective. It is important that the architect determines\
    \ whether the organization has a framework for representing business capabilities."
  merge: -1
  img_proc: true
- pgno: 163
  md: '+   - **Value streams:**

    +     These are activities that contribute to an overall result for a customer,
    a stakeholder, or an end user.

    +   - **Organization maps:**

    +     They show the relationships between the primary components of an enterprise
    and its partners and stakeholders.


    Aside from enterprise architecture, the architecture vision also explores additional
    fields that are relevant to enterprise architecture. The stakeholder domains might
    consist of elements of the basic domains but also serve a distinct purpose. A
    few examples are listed as follows:


    +   - Information

    +   - Security

    +   - Digital network

    +   - Network management

    +   - Knowledge

    +   - Industry-specific domains

    +   - Services

    +   - Partnership

    +   - Cybersecurity


    Our baseline and target architectures can be described based on this architecture
    vision for the business, data, applications, and technology domains. Further development
    of this outline will follow.


    # Phase B – the business architecture


    Throughout this report, you will be presented with a holistic overview of capabilities,
    end-to-end value delivery, information, and organizational structure, along with
    the connections among those components, products, policies, and initiatives. Taking
    a domain-based approach, business architecture relates business elements to business
    objectives and other domain elements.


    # General


    Knowledge of business architecture is a prerequisite for all other architecture
    activities and should be the first step in the process, particularly when it isn''t
    addressed in other organizational processes. Furthermore, business architecture
    is often needed so that key stakeholders can be convinced of the business value
    of subsequent architecture work and are convinced of the benefits they will receive
    from supporting and participating in the subsequent work.'
  merge: -1
  img_proc: true
- pgno: 164
  md: 'Business strategy defines the business strategy and its objectives, although
    not necessarily how to achieve them. The scope of Phase B''s work is primarily
    determined by the architecture vision of Phase A. Phase B defines, in detail,
    the role of the business architecture. To the greatest extent possible, existing
    material should be reused. There might already be existing architecture definitions
    in more architecturally mature environments, which might have been maintained
    since the last architecture development cycle.


    # Developing the baseline description


    A baseline description should be based on existing architecture descriptions if
    an enterprise has them. A business capability map or a core set of value streams
    might have already been included in Phase A when developing the architecture vision.


    These materials should be updated if a new value stream has been implemented,
    a business capability is missing, or a change of organizational unit has occurred
    that wasn''t considered in the enterprise architecture project. Taking information
    and developing business architecture models should be carried out if architecture
    descriptions do not exist.


    # Applying business capabilities


    As part of the architecture vision phase, business capability maps are developed
    from the perspective of a separate business, independent of organizational structures,
    business processes, information systems, and other products or services included
    within the portfolio. A map of those business capabilities must be created within
    the scope of the enterprise architecture project, based on organizational units,
    value streams, and information systems. In this way, each of those domains is
    aligned and optimized more efficiently.


    # Applying value streams


    In the architecture vision phase, document the business''s initial value stream
    models. There might be a need for new value streams within the context of a specific
    enterprise architecture project if the scope of the project is sufficiently broad.
    Through heat mapping or by developing use cases around a complete definition of
    the value stream, a new or existing value stream can be analyzed within the scope
    of the project.'
  merge: -1
  img_proc: true
- pgno: 165
  md: '# Applying the organization map


    Organizing an enterprise ecosystem involves identifying the key organizational
    units, partners, and stakeholder groups that constitute it. Organization maps
    are based on the business unit concept. Unlike an organizational chart that only
    shows hierarchical reporting relationships, the map should also show the working
    relationships between those entities. This map depicts the interactions and relationships
    between various business entities and is, typically, represented as a network
    or web.


    # Applying modeling techniques


    Business capabilities, value streams, and organizational maps, as described in
    Phase B, are expanded and applied to the business in this phase through modeling
    and mapping techniques. In order to succeed in its goal, organizations must expand
    their operating models. The operating model is a representation of how an organization
    performs across various domains. There are many other modeling techniques that
    can be applied in addition to capability maps, value streams, and organization
    maps, such as the following:


    +   - **Activity models/business process models** – These describe the functions
    associated with the enterprise’s internal exchanges, such as business activities,
    the data, and/or information exchanged between activities.

    +   - **Use case models** – These are based on the purpose of the modeling effort;
    they describe either the business processes or systems functions.

    +   - **Class models** - These describe informational behaviors. Several types
    of granularity can also be modeled with them, as can many of the other models.


    The architecture repository will be explored by the architecture team during Phase
    B, specifically the following list:


    +   - Reference models for the industry for which the organization operates

    +   - Views specific to a business enterprise such as capability maps, value stream
    maps, and organization maps

    +   - Building blocks that are specific to your enterprises such as process components,
    business rules, and job descriptions

    +   - Applicable standards'
  merge: -1
  img_proc: true
- pgno: 166
  md: '# Phase C – key considerations for data architecture


    The enterprise must address data management issues when undertaking large-scale
    architectural transformation. The utilization of data to capitalize on its competitive
    advantages is made easier by a systematic and comprehensive approach to data management.


    # Data management


    Issues must be understood and addressed when an enterprise chooses to undergo
    a large-scale architectural transformation. The effective use of data can be achieved
    through a structured and comprehensive approach to data management. Data management
    considerations include the following list:


    +   - It should be determined which of the application components in the landscape
    will serve as the enterprise master data system or reference

    +   - See whether there are any enterprise-wide standards that all software packages
    and application components must adopt

    +   - Understand how data entities are used in business processes, functions,
    and services

    +   - Be able to clearly understand how, where, and for how long enterprise data
    entities are stored, transported, and reported

    +   - In order to support information exchange between applications, what level
    of data transformations are required?

    +   - In what ways will the software be required to support the integration of
    enterprise data with that of its customers and suppliers?


    # Data migration


    A new application must migrate data from an existing application when it is replaced.
    The data architecture should include the level of data transformation, weeding,
    and cleaning necessary to present data in a format that meets the requirements
    and constraints of the target application. Data quality is the goal when populating
    the target application. Additionally, a common data definition needs to be developed
    for the transformation to be successful.


    # Data governance


    To ensure the enterprise is able to successfully transform, data governance considerations
    will ensure the necessary foundation is in place, which includes the following:


    +   - **Structure** – The data entity aspects of change can be managed by an enterprise
    if it has the requisite organizational structure and standard bodies to do so.

    +   - **Management system** – In order to manage the governance aspects of data
    entities throughout their life cycle, enterprises should have the necessary management
    systems and data-related programs in place.'
  merge: -1
  img_proc: true
- pgno: 167
  md: '+   - **People** – This dimension identifies what skills and roles an enterprise
    needs to be successful in transforming its data-based business model.


    It is important that businesses acquire these skills, and that existing employees
    are trained through well-defined learning programs if such resources and skills
    are lacking.


    # Architecture repository


    Within this phase, the architecture team works on understanding the existing resources
    in the organization''s architecture repository when it comes to data architecture.
    It particularly focuses on generic data models specific to the organization''s
    industry sector:


    +   - Energistics® – The oil and gas industry''s standard for data exchange

    +   - National Information Exchange Model (the US government)


    A model for operational data and a model for a data warehouse from the Association
    for Retail Technology Standards.


    During this phase, the architecture team will need to consider which available
    resources in the architecture repository are relevant with respect to application
    architecture. In particular, the generic business models that are relevant to
    the vertical sector, along with common high-level business functions, such as
    electronic commerce, supply chain management, and more. Please note the following:


    +   - There are multiple vertical domain task forces within the **Object Management
    Group (OMG)** that develop software models for specific vertical domains, such
    as healthcare, transportation, and finance

    +   - A detailed reference model for application architecture has been developed
    by the Open Group for the IT segment of organizations

    +   - For organizations with IT segments, the Open Group has developed a detailed
    reference model for application architecture


    # Phase D – technology architecture


    Enterprises looking for new and innovative ways to operate and improve their business
    are driven by the evolution of new technologies. In adopting new technology, technology
    architecture has the opportunity to take advantage of transformational opportunities
    available to the organization.


    # Emerging technologies


    By enabling the TOGAF ADM to be flexible, technology becomes a resource and driver
    of change rather than the IT department. Therefore, the technology architecture
    might act as a driving force to deliver business capabilities and meet the information
    system requirements.'
  merge: -1
  img_proc: true
- pgno: 168
  md: '# Architecture repository


    The architecture repository is considered to identify relevant technology architecture
    resources, particularly the existing IT services as per the IT service catalog
    and the adopted technical reference model. Moreover, the technology models related
    to the business vertical of an organization are available in the market, for instance,
    The™ forum – a comprehensive technology model has been developed related to the
    telecommunication industry.


    # Phase E – opportunities and solutions


    Delivering the architecture is the focus of Phase E. All gaps between the target
    architecture and the baseline architecture are highlighted, and any changes are
    grouped into work packages within the enterprise’s portfolios as needed. The primary
    objective is to identify a roadmap that fits the needs of stakeholders, the business
    transformation readiness of the enterprise, the opportunities and solutions that
    exist, and the available implementation constraints. In order to realize incremental
    business value, we must focus on the final goal.


    # Phase F – migration planning


    Phase F consists of collaborating with the project and portfolio managers to develop
    an implementation and migration plan. We will complete the incomplete roadmap
    and implementation and migration plan in Phase F and integrate both with the rest
    of our change activities.


    Phase F will develop the final implementation and migration plan that will include
    portfolio and project-level details based on the architecture roadmap, version
    0.1. At that point, lessons learned from the architecture development cycle should
    be documented in order to promote continuous improvement.


    # Phase G – implementation governance


    All the information that is needed for the successful implementation of the various
    projects can be found here. The execution of a process specific to your organization
    runs parallel to Phase G, where you perform the actual development. In order to
    minimize risk in the transformation and migration program and to enable the early
    realization of business value and benefits, it is advisable that you deploy the
    target architecture as a series of transitions. In addition to advancing the organization
    toward its goal, each transition generates business benefits on its own.'
  merge: -1
