- pgno: 107
  md: '# Available Frameworks for an Enterprise Architecture


    In this chapter, we will explore common frameworks and use cases, and identify
    common potential risks and benefits of particular **enterprise architecture (EA)**
    approaches. We also will cover several types of risks and how to assess risk when
    implementing an EA.


    Finally, we will consider tools available to assist in the EA journey and share
    examples of tools and services that can ease the migration of an existing system
    to an EA-ready system.


    In this chapter, we will cover the following topics:


    +   - Use cases for EA and objectives

    +   - **EA frameworks (EAFs)** and methodologies

    +   - Technology and risk management

    +   - EA collaboration and reporting

    +   - EA and digital transformation


    # Use cases for Enterprise Architecture with objectives


    In the right hands, enterprise architects can assist their companies in navigating
    the digital transformation that could have substantial benefits for their organizations
    in the long run. This would enable their companies to ensure compliance with regulations.
    As an example, consider the **General Data Protection Regulation (GDPR)** of the
    **European Union (EU)**.'
  merge: -1
  img_proc: true
- pgno: 108
  md: 'A number of new rules have been imposed on the management of end users’ personal
    data by this regulation. A company that fails to comply with GDPR will be fined
    up to 20 million euros or 4% of its global annual turnover for the prior fiscal
    year. In order to demonstrate GDPR compliance, enterprise architects need to ensure
    that all relevant data is collected and presented in a clear and concise manner.


    Business architects have the ability to add value in three specific areas: enabling
    growth, ensuring compliance, and reducing complexity. Organizations must continually
    innovate to stay competitive. It is common for organizations to struggle with
    implementing key **information technology (IT)** trends—such as microservices,
    the **Internet of Things (IoT)**, and cloud migration—that carry the potential
    to increase their market share. In addition to accelerating **time to market (TTM)**,
    creating new revenue streams, reducing hardware costs, and reducing costly complexity,
    these trends can be extremely valuable to companies. In the future, enterprise
    architects will be in a position to support their companies’ digital transformations,
    which—if done correctly—could result in reduced costs and greater profits.


    The uninhibited growth of IT in the past few years has resulted in duplicated
    systems that bring along with them multiple drawbacks and overlapping capabilities.
    These systems generate inconsistent data that is overly complex. Enter enterprise
    architects. Their role is to tackle these problems head-on by providing a roadmap
    to manage and reduce complexity, which contributes directly to reducing costs.


    As a top-level architect, an **enterprise architect** is responsible for EA design.
    Consequently, they have a broad scope of responsibilities. In EA, IT assets and
    business processes are mapped along with a set of guiding principles that help
    drive a continuous discussion about business strategy and how it can be expressed
    through IT.


    A **solutions architect** is one level higher than an application architect, who
    is a specialist in a specific application. A solutions architect focuses on the
    solution, while an enterprise architect focuses on the organization as a whole.
    An **application architect** focuses on one function. These roles don’t interact
    with clients often, so they do not require much business experience. With experience,
    many solutions architects go on to become enterprise architects.


    An effective EA that has strong foundations and is well aligned with the business
    objectives and technical strategy can offer great benefits to an organization.
    Some of the more specific objectives of an EA are listed here:


    +   - **Business operations:**

    +     - Reduced cost of business operations

    +     - More agile organization and workflows

    +     - Shared business capabilities that can be accessed across the organization

    +     - Lower change management costs

    +     - Higher business productivity to ensure greater efficiency'
  merge: -1
  img_proc: true
