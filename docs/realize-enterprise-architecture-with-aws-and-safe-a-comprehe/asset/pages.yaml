    # Types of cloud migration strategies


    The three basic types or patterns of migration to the cloud are listed next. They
    are listed from the easiest and fastest, with some drawbacks, to the most difficult,
    with greater benefits:


    +   - Lift and shift

    +   - Move and improve

    +   - Rip and replace


    Now, let’s dive deeper into the types of cloud migration strategies, along with
    their pros and cons.


    # Lift and shift (rehosting)


    One advantage of lift and shift (rehosting) is that it takes less time than traditional
    hosting methods. It requires very little refactoring and takes less time to implement.
    Nevertheless, lifting and shifting could lead to a bare minimum number of changes,
    so you might not see the benefits you would see by going cloud-native. In the
    short term, speed and ease could cost you more than a more thorough migration
    – especially when compared to speed and ease in the short term.


    Those organizations that are still far from cloud maturity can take advantage
    of lift-and-shift strategies to power simple, low-impact workloads. You’ll find
    it relatively straightforward if you already have many VMs. It is even possible
    to purchase products from vendors that promise to automate your migration. On
    the other hand, performing the migration manually is a good learning experience.
    If you’ve made a lift-and-shift strategy hastily, the good news is that once your
    applications are running in the cloud, they’re easier to rework and optimize.'
  merge: -1
  img_proc: true
- pgno: 214
  md: '# Move and improve (re-platforming)


    While re-platforming, the application is shaped toward becoming cloud-native by
    making a few cloud optimizations. During migration, cloud load balancers can replace
    in-VM load balancers in order to simplify the migration process by reducing the
    number of VMs, configurations, and operating processes that need to be migrated
    without altering the application. Furthermore, this represents the first step
    toward cloud-native development for the application. For re-platforming, you need
    to know more about the cloud, the application, and what''s inside the VM. In other
    words, you do need to have an understanding of the application, but you do not
    necessarily have to be a programmer. You can probably re-platform if you know
    how to wire things up, such as a web app to a database – this is normal system
    administration stuff.


    In the case of re-platforming, one of the most common shaping activities is to
    only move your data to the cloud, not your database. Migrating using the move-and-improve
    or re-platforming approach involves updating your application to make it more
    modern, such as by introducing scaling or automating it without ripping it up
    completely. It might be tempting to assume that this happy-medium approach is
    the best option at first glance, but you will end up keeping all your technical
    debt and not benefiting from cloud-native architecture.


    # Rip and replace (refactoring)


    This approach is also known as refactoring or re-architecting, which involves
    completely reengineering your workload to be cloud-native. The maximum benefits
    available in the cloud are worth the investment in time and skills development,
    especially for retraining and upskilling existing talent – making refactoring
    a positive experience. This is why, most of the time, we recommend adopting the
    minimum viable refactoring approach. The practice is to make low-risk, low-cost,
    and high-value changes to an app prior to migration. It enables migration to occur
    more quickly while taking full advantage of the opportunity.


    Cloud-based testbeds can be used to accelerate these improvements before migrating
    your production apps. A development and test environment can be spun up in seconds,
    and the environment can be shut down just as easily. In addition, cloud computing
    allows for greater flexibility in terms of work. Through PaaS and **Software-as-a-Service
    (SaaS)** solutions, you can connect with powerful solutions with just a few lines
    of code.'
