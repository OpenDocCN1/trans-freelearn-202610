- pgno: 209
  md: '# SAFe Implementation for AWS Cloud Migrations


    In this chapter, cloud migration will be discussed in detail along with other
    aspects including how and where to start your journey. Also, we’ll be addressing
    whether the cloud is the right choice for you or not at certain points in your
    business. Additionally, we will shed some light on how adopting agile or SAFe
    helps in cloud transformation.


    In this chapter, we will cover the following important topics:


    +   - Reviewing the current cloud adoption and migration frameworks

    +   - Types of cloud migration strategies

    +   - Other cloud migration strategies

    +   - Cloud-to-cloud migration challenges

    +   - Migrating back from the cloud to on-premises

    +   - AWS cloud migration tools

    +   - Adopting an agile approach with epics

    +   - Guidelines for a successful migration

    +   - Waterfall or agile – which route to take


    # Things to consider for cloud migration


    AWS Cloud Adoption Framework (CAF) provides a framework to ensure a comprehensive
    view of the journey to the cloud. It connects the six most important aspects,
    namely business, people, governance, platform, security, and operations. When
    attempting a migration effort for enterprises, this framework can help you understand
    what areas need to be improved. You can move faster and innovate effectively if
    you combine this framework with agile practices and streamlined cloud migrations.
    When it comes to large-scale migrations to the cloud, we recommend adopting an
    agile approach, not just as a discrete activity.'
  merge: -1
  img_proc: true
- pgno: 210
  md: 'When considering cloud migration, the following three factors must be considered
    regardless of the type of cloud and service model you plan to use:


    +   - What is it you plan to migrate?

    +   - Why do you plan to migrate it?

    +   - Which methods will you use to move it?


    More specifically, what''s important is figuring out how the migration process
    will be conducted and giving enough attention to planning. No matter how effective
    or efficient the process is, regardless of the high skill set of a team working
    with dedication toward this migration, there are certain challenges you are likely
    to face. The best way to deal with them is to prepare for them beforehand. Your
    cloud migration strategy must include anticipating potential issues. The following
    sections describe some of the leading challenges that might cause issues during
    the cloud migration process.


    # Cost management


    Cost savings are offered by cloud computing; however, determining the exact cost
    can be challenging. Cloud computing expenses are more likely to be underestimated.
    Be sure to take into account not just the migration costs, but also migration
    services, potential bandwidth needs, and future recurring expenses. Efficient
    planning, long-term strategic decision-making, and optimal cloud costs make a
    world of difference.


    # Complexity


    If you begin to introduce hybrid cloud elements, the public cloud becomes more
    complex and difficult to manage. The team must comprise people who know their
    way around cloud migration and are capable enough to manage your cloud. Additionally,
    they must anticipate, foresee, and understand the efforts that are essential for
    a successful migration.


    # Dependencies


    Migrations are slowed down and get unnecessarily complicated when application
    dependencies are involved. However, you can ensure that you''re keeping an eye
    on all the providers by using provider discovery tools.


    # Legacy applications


    The migration of some applications to the cloud could be horrifying for many reasons,
