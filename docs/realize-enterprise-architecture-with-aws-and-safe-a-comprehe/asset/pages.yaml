    particular, the following reasons justify repatriation:


    +   - **Cost:** While they offer high scalability and cheap computation power
    for short-term surges, public clouds are not always cost-effective for long-term
    deployment.

    +   - **Control over data and security:** Using public cloud services involves
    a security risk associated with distributed configuration management. Public cloud
    services involve high levels of security risks related to distributed configuration
    management. This is because distributed configuration management affects public
    clouds. Security vulnerabilities are frequently caused by misconfigured buckets.
    In contrast, on-premises solutions tend to provide greater control, handle security
    in a consolidated manner, and have a clear security perimeter.

    +   - **Performance:** As a result of WAN bandwidth and cloud provider workloads,
    public clouds differ greatly in how quickly you can move data to and from the
    cloud.'
