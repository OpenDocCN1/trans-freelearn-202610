- pgno: 207
  md: '# Supporting CD through PI execution


    A developer’s responsibility for enablers is to own the technology and exploration
    work related to the essential and solution levels, and, as a result, guide the
    development progress of teams. Attending the sprint planning sessions and/or sprint
    demos of those teams will allow them to monitor progress, address issues, and
    adjust directions as needed. In addition, they provide coaching and mentoring
