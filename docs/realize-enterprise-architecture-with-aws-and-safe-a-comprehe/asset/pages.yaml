- pgno: 19
  md: '# Part 1 –

    Enterprise Architecture

    Foundation and Implementation


    In this first part, you will learn about the critical core foundation components
    of **enterprise architecture** (EA) and how to relate them to the AWS cloud. This
    part of the book will assist you in applying EA architecture principles and domains
    to the AWS cloud by building the right core foundation.


    If you need help with the basic concepts of the EA core foundation or are looking
    to learn more about its importance, the first three chapters about the core foundation
    will help you to make decisions and realize business values. With this, you will
    learn how to achieve business agility. You''ll be in a better place to explain
    the building blocks of architecture to derive solutions driven by both architecture
    and solution building blocks.


    The EA foundation and implementation help you to achieve operational efficiency
    and help you define the success of the core foundation.


    Organizations often struggle to keep up with ever-evolving technology. Hence,
    innovation and growth process slows down a notch. The way forward is by implementing
    EA that navigates an organization through business processes for desired business
    outcomes. Hence, a well-structured and thought-through business agility model
    is needed now more than ever.


    By the end of these chapters, you will be able to execute an EA strategy by building
    a core foundation. You will be more capable of handling the constant need to adapt
    to continuous advancements within a system. Plus, some background on the core
    foundation of an execution strategy comes in handy.'
  merge: -1
  img_proc: true
