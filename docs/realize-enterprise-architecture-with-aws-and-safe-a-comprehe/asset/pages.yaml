  md: '# Consumption-based procurement model


    Consumption-based procurement is the preferred model for technology consumers.
    As a result, they prefer monthly, no-obligation payment plans that effectively
    link their spending to their personal income rather than three-year capital expenditure
    contracts.


    # Retiring legacy “enterprise” software


    Enterprise software has lost its status as the gold standard of technology. Due
    to open source, innovation in software, and its rapid pace, enterprise software
    is now viewed as outdated, unattractive, and difficult to use. As a result, customers
    are changing their software stacks more frequently to stay competitive. Enterprises
    can refresh their application stack in a frictionless manner by purchasing software
    through cloud procurement frameworks such as AWS Marketplace, which is beneficial
    to enterprises. By eliminating lengthy, complicated, and expensive software procurement
    cycles, such as multistage requests for information (RFIs) and requests for proposals
    (RFPs), this process reduces costs.


    AWS Marketplace is an effective way to test software and turn it off if it doesn’t
    meet your needs. As a result of migration to AWS, organizations opt to prune down
    the number of self-designed, self-built, and self-operated applications to reduce
    costs and improve bottom-line net income.


    # Benefits of repurchasing


    Apart from a few that have already been mentioned earlier, we have jotted down
    a few more benefits of repurchasing that can transform the organization structure
    for good:


    +   - **Future-centric**: Modern appliances and cloud-based software should replace
    antiquated systems.

    +   - **Simplified procurement**: Through one procurement mechanism, customers
    can purchase appliances, **Bring-Your-Own-License (BYOL)** products, SaaS, and
    private offers.

    +   - **Reduced in-house skills requirements**: It is possible to purchase systems
    built by specialists with no need for you to hire them. In addition, SaaS applications
    are run by people you do not have to hire.

    +   - **Reduced effort/faster migration**: When less has to be migrated, the migration
    program will be cheaper, faster, and less risky.


    # The risks of repurchasing


    There are risks associated with repurchasing. By failing to consider and manage
    these risks, migrations can be made worse:


    +   - **Integrations and dependencies**: What clients and applications must you
    reconfigure to use the new cloud service if you replace your on-premises Active
    Directory system with a cloud version?'
