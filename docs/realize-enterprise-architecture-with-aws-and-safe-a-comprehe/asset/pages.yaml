    phase, you will participate in an interactive workshop led by a facilitator to
    identify transformation opportunities.

    +   - **Align**: Identification of capability gaps across foundational capabilities.
    This phase also takes the form of a facilitator-led workshop and results in an
    action plan.

    +   - **Launch**: Demonstrate incremental business value through pilot projects
    in production.

    +   - **Scale**: Extend pilot programs to the desired level of scale to achieve
    business benefits.


