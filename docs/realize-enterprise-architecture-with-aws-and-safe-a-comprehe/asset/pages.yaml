- pgno: 200
  md: 'product releases are essential economic drivers that should be carefully considered.
    The goal of CD is to release new functionality as soon as it is developed, allowing
    users to exploit new capabilities right away. The actual release tends to be decoupled
    and on demand, occurring for particular users at specific times, when they need
    it or when it makes sense for the company.


    A customer-centric approach is applied when determining which elements of the
    system to release and which end users to reach out to. Releases should be based
    on market rhythms and events and aligned with customer time frames. Moreover,
    specific customer segments should be targeted with new features or the entire
    system when releasing release elements.


    By decoupling releases, business agility is further enhanced, especially for value
    streams that serve external customers. Promotional activities can be targeted
    at specific segments of the market. Also, the timing of the solution and the functionality
    of the sale can be structured with greater confidence.


    The four activities of release on demand include the following:


    +   - The release refers to the processes involved in delivering the solution
    to end users, either all at once or in incremental steps

    +   - Stabilize and operate solutions describe the steps to ensure that both the
    functional and non-functional aspects of the project are working correctly

    +   - Measurement is the process to determine whether newly released functionality
    fulfills the intended purpose

    +   - As part of the CD pipeline, this learning module describes the steps involved
    in deciding what actions to take with the information collected


    It is now time to open up the solution to customers once it has been put into
    production and has been verified as operable. The timing of the release of value
    is critical, as releasing too early or too late at the wrong time can have negative
    economic consequences. We will further explore this aspect by digging deeper into
    the release value to customers approach.


    # Release value to customers


    The product management process includes policies for governing the execution of
    the product development process. These policies range from automatically releasing
    qualified code to customers to establishing a more formal review process. If the
    system is complex, there is a greater likelihood that a manual gate determines
    the answers to the previous questions (who, when, and what should be released).
    The release can be accomplished through the following four practices:


    +   - Dark launches enable deployments to production environments without providing
    end users with the functionality'
