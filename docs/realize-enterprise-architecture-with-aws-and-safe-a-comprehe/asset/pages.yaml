  md: '# Planning is everything, the plan is nothing


    Here is where things can easily start to go wrong. It becomes difficult for most
    organizations who wish to work in an agile format to develop a plan with enough
    detail that represents the actual tasks to be done. However, how can this dilemma
    be resolved? Creating a master plan, establishing a set of key milestones and
    deliverables as a governance framework, but letting sub-projects work agile within
    their scope, is the answer.


    # Practical application


    By the end of the year, the deal was out of control. Many migration plans of different
    quality levels were available, but no high-level plan matched them up. Essentially,
    there was no high-level plan, which meant that nothing was clearly understood
    about what needed to be done, the timeline for completing it, and the dependencies
    that existed around it.


    Our conclusion was that we needed to develop highly standardized migration template
    plans that cover the phases of preparation and the execution of migrations. Our
    kick-off session was held after each team was invited, and we explained the concept
    and determined binding delivery dates based on the template plan. More than 1,400+
    applications have been successfully migrated, and we have tracked their progress
    against the high-level migration plan. For simplicity’s sake, we haven’t paid
    attention to how teams track their individual progress; this is so that we can
    avoid unnecessary paperwork.


