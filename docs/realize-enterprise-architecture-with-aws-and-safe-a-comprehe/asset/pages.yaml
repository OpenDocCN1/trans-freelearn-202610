- pgno: 257
  md: '# Create a useful model


    This involves taking the requirements and formulating effective models of the
    solutions, augmenting the models as needed to address all of the circumstances,
    and communicating the ideas in multiple ways through the models.


    In terms of architecture, the architect is responsible for maintaining the vision
    of the offering and preserving architectural integrity. Additionally, the architect
    ensures that leverage opportunities are identified and that they are realized
    by leveraging building blocks as a liaison between the functional groups. Architects
    build and maintain these models to guide work within or outside the organization
    and to understand the domain of development work. An architect must understand
    all the business components to represent the organization’s architecture.


    # Validate, refine, and expand the model


    The model should be revised and further defined, using subject matter experts
    if needed, to increase flexibility and to ensure it is based closely on current
    and expected requirements. Architects should also consider the value of any enhancements
    that arise from fieldwork and include them in architecture models where appropriate.


    # Manage the architecture


    The models should be regularly updated to display changes, additions, and alterations
    as necessary. They must assist with discussions and decisions about the program’s
    architecture. Architects represent change as an agent for implementing the architecture.
    Through this process, the architect ensures that information about the customer,
    architecture, and technical aspects among organizations is shared continuously.


    # Characterization in terms of enterprise segmentation


    In certain scenarios, additional architects may be required to support the architecture
    effort due to the complexity of a solution. All categories of architects do the
    tasks outlined previously as well. An enterprise, enterprise solution, and solution
    architect team can come together to accomplish the task. Depending on the phases
    of the development process, each member may have a specific focus, if not a specific
    role and responsibility. If it is deemed necessary to organize an architectural
    team, a lead enterprise architect must be assigned to manage and lead the team,
    as follows:


    +   - The enterprise architect is responsible for applying architecture design
    and documentation to both the technical and landscape reference models. In most
    cases, the enterprise architect leads a team of segment architects and/or solutions
    architects to implement a particular program. The focus of the enterprise architect
    is on the enterprise-level business functions required.

    +   - The segment architect documents and designs specific business problems of
    organizations. They combine detailed technical solutions with the overall architectural
    landscape, relying on the output from all other architects. The segment architect
    is responsible for scoping enterprise-level business solutions across multiple
    domains, including finance, human resources, and sales.'
