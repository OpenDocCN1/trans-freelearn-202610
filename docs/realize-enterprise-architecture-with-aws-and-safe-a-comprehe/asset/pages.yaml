    strategy. To automate this activity, AWS Config is leveraged as it lets you assess,
    audit, and evaluate the configurations of your AWS resources. The process of reviewing
    changes is made easier, which leads to an effective evaluation of compliance against
    the configurations specified in your internal guidelines.'
