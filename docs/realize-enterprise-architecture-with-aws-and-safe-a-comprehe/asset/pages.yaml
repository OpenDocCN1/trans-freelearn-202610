- pgno: 228
  md: '+   4. Organize implementation oversight meetings by establishing communications
    and reporting protocols.

    +   5. Align, enable, and mobilize resources and teams during sprints. Start slowly,
    create early successes, and work up to your full migration capacity.

    +   6. Build your migration at scale around outputs, best practices, and lessons
    learned.

    +   7. Use Wave 1 to create agile blueprints for scaling migrations. This will
    provide a foundation to prepare for and plan migrations.


    As you work through Wave 1 migrations, you gain experience and confidence. Additionally,
    you must choose a migration plan based on your organization’s needs, along with
    the patterns and tools that will be used. This ensures that operational and security
    procedures are tested. A list of application groupings based on common patterns
    is also created, using patterns (such as architectures and technology stacks)
    within the portfolio. Group migrations are then handled in a standardized way.


    # Value-add outcomes


    You can accelerate operations at scale by using this agile model. This agile approach
    leads to the following value-added business outcomes:


    +   - **Application selection**: Evaluate applications using a 7 Rs migration
    analysis.

    +   - **Migration wave plan and migration tools**: Prioritize the move groups
    and determine which tools are available.

    +   - **Landing zone**: Test and deploy various landing zone components.

    +   - **DevOps**: Using DevOps, provide frequent features, fixes, and updates.

    +   - **Automation**: Implement migration tools offered by vendors.

    +   - **Migration patterns**: Refer to the Prescriptive Guidance catalog for the
