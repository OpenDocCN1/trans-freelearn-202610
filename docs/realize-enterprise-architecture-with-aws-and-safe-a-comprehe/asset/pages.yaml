- pgno: 146
  md: '# General design principles


    There are five general cloud design principles identified by the Well-Architected
    Framework. Let’s look into them one by one, as follows:


    +   - **Stop guessing your capacity needs**

    +     You might end up spending nearly all your time on idle resources or dealing
    with the performance implications of low capacity if you make a poor capacity
    choice when deploying a workload. These issues can be solved with cloud computing.
    Your capacity can be adjusted up or down automatically, based on your needs.

    +   - **Test systems at the production scale**

    +     The cloud enables you to quickly set up production-scale test environments,
    test successfully, and then decommission resources on-demand. The cost of a virtual
    test environment is fractional to the cost of testing on-premises since you only
    pay when the test environment is running.

    +   - **Automation for easier architectural experimentation**

    +     You can automate your workloads to save money and avoid manual effort, thus
    creating and replicating them at a low cost. Monitoring your automation will allow
    you to audit any changes that have been made and, if necessary, revert to previous
    parameters.

    +   - **Allow for evolutionary architectures**

    +     Architecture decisions are typically implemented as static, one-time events
    in a traditional environment during the life cycle of a system, with a few major
    versions. The initial decisions made by the business and its context may inhibit
    a system’s ability to meet changing business requirements as the business evolves.
    A cloud-based solution with automated and on-demand testing minimizes the risk
    of design changes affecting the end product. Businesses can use this as a standard
    way of incorporating innovations into their systems over time.

    +   - **Drive architectures using data**

    +     Your architectural choices can be tracked in the cloud to determine how
    your workload reacts to your architectural choices. Using this information, you
    can improve your workload based on facts. You can use the code in your cloud infrastructure
    to make informed architectural decisions, improving it over time.


    Cloud design principles identified by the Well-Architected Framework play a major
    role in enhancing architectural decision-making over time.


    # Improving through game days


    Regularly schedule production simulations to check your architecture and processes.
    As a result, you will be able to identify areas for improvement and gain experience
    dealing with events within an organization.'
  merge: -1
  img_proc: true
- pgno: 147
  md: 'Reviewing architectures should be done consistently, without blaming anyone,
    and encouraging digging deep. There should be no audit in this process; it should
    only be a conversation. It is intended to identify critical issues and areas for
    improvement when reviewing an architecture. The review will lead to a set of actions
    aimed at improving customer experiences.


    Taking responsibility for the architecture of the team is everyone’s job. Instead
    of holding a formal review meeting, team members who design architecture should
    continually review their design with the Well-Architected Framework. When your
    team utilizes a continuous approach, the architecture can be updated as the functionality
    is implemented, and improved as new features are added.


    In AWS, well-architected systems and services follow AWS’s internal review process.
    **Root cause analysis (RCA)** focuses on design principles that influence the
    architectural approach; it also includes questions to ensure that people don’t
    overlook areas that often feature in RCA. We look at RCA whenever there is a significant
    issue with an internal system or service, or when a customer contacts us, to see
    whether we can improve the review process. In the product life cycle, reviews
    should be conducted at key milestones, early on in the design phase so that one-way
    doors can be avoided, and before the initial launch of the service. Adding new
    features and implementing new technologies will continue to increase your workload
    after going into production. As a workload grows, its structure will change. For
    its architectural characteristics to not degrade as they evolve, it is imperative
    that you follow good hygiene practices. If you make significant architecture changes,
    a Well-Architected review should be part of the process.


    It is important to ensure that all the right people are engaged in the conversation
    if you are going to use the review as a one-time snapshot or independent measurement.
    Review times are often the first opportunity for a team to really grasp what they’ve
    done. It is helpful to have informal conversations about another team’s architecture
    to glean answers to most questions when reviewing the workload of another team.
    If an ambiguity or perceived risk remains, you can follow up with one or two meetings
    to gain clarity or dig deeper into the issue. Having reviewed the issues, you
    should have a list of priorities based on the business context. The impact of
    those issues on your team’s day-to-day work will also need to be considered. You
    could solve recurring problems earlier, freeing up time you could use to create
    business value. Your review will be updated as you address issues and see how
    the architecture improves.


    After a review has been conducted, you will understand its value, but you may
    first encounter resistance from a new team. To resolve some objections, you can
    educate the team on why a review is beneficial. Moving forward, we will look at
    different scenarios that might have an impact on the review at a later stage,
    as follows:


    *We are too busy! (Generally said just before a big launch)*'
  merge: -1
  img_proc: true
- pgno: 148
  md: 'Here’s how to respond:


    +   - The launch of a big product will go smoothly if you prepare it beforehand.
    Through a review, you can find out whether any problems were overlooked.

    +   - It is most important to conduct reviews early in the life cycle of your
