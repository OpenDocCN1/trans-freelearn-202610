    # Enterprise architecture practices with roles


    In architecture, architectural artifacts are documents that describe the state
    of an enterprise, a system, or a solution. System *environments* are the factors
    that determine all the external influences that have an impact on a system. The
    environmental factors that can affect a system include developmental, technological,
    economic, legal, governmental, ecological, and societal factors. A *system*, however,
    refers to a set of interconnected components that perform one or more predetermined
    functions.


    Architects define architecture as the fundamental concepts or characteristics
    of a system. Architectural descriptions are work products that are used to convey
    information about an architecture; they consist of views and models that, together,
    describe the architecture. *Stakeholders*, on the other hand, consist of individuals,
    teams, or organizations that have an interest in a given system.


    The term *concerns* refers to one or more stakeholders who are interested in a
    system. Any aspect of a system''s development, operation, or functioning, including
    performance, reliability, security, distribution, and evolvability, may be considered
    a concern or a determinant of its acceptability. Taking a *system architecture
    view* is like representing a system from the view of a specific set of concerns.
    A system architecture model represents what a system is like. *Architecture models*
    represent subjects of interest. As a simplified representation of a subject, a
    model presents the subject matter at a smaller scale.


    One or more architecture models may be created by an architect as part of capturing
    or representing the design of system architecture. As a result, an architecture
    view will consist of elements of one or more models, chosen in such a way as to
    demonstrate that the concerns of one or more stakeholders are being appropriately
    addressed in the design of the system architecture. Generally, an architecture
    view is an architecture specification of conventions for an architectural view
    to be implemented. This kind of architectural view can be referred to as a definition
    or schema. To address a particular concern (or set of concerns) about a *system
    of interest*, it establishes conventions for constructing, interpreting, and using
    an architecture view.'
  merge: -1
  img_proc: true
- pgno: 250
  md: '*Model kinds* establish a type of modeling convention. Models may be viewed
    through an architecture viewpoint; an architecture view may include several models.
    The Reference Library portion of the Architecture Repository contains a collection
    of specifications for architecture viewpoints:


    +   - Viewpoints that determine what you see, from what vantage point or perspective

    +   - An architecture view is always specific to the architecture that it depicts
    and can be stored in libraries for reuse; a viewpoint is generic and can be stored
    in libraries for reuse

    +   - It''s at least implicitly described by an architecture viewpoint associated
    with every architecture view


    Be aware that *concern* and *requirement* are not synonymous. They describe different
    things. Some stakeholders may have a concern/an interest in system reliability.
    Architecture viewpoints should be associated with concerns to ensure that these
    concerns will be addressed in some way by the architectural models. Architects
    who only select a structural architecture viewpoint, for example, are almost certainly
    not considering reliability issues, because a structural model cannot represent
    these problems. There may be many different stakeholder requirements within that
    concern; there may be different requirements of different classes of users in
    terms of the system''s capabilities.


    An Architecture Board overseeing the implementation of the strategy is essential
    to a successful Architecture Governance strategy. Typically, this group comprises
    executives responsible for reviewing and maintaining the overall architecture,
    as well as a representative of all the key stakeholders. The majority of architecture
    boards in larger organizations are made up of representatives at least two tiers
    deep – that is, local (domain experts'' line responsibility) and global (organization-wide
    responsibility). A board will be established in such situations with identifiable
    and articulated duties:


    +   - Responsibility and ability to make decisions

    +   - Limitations on authority and remit


    # Enterprise architecture practices with responsibilities


    The following goals are typically entrusted to the Architecture Board:


    +   - Establishing the basis for all architecture-related decisions

    +   - Maintaining consistency across sub-architectures

    +   - Setting targets for reusing components

    +   - Creating a flexible EA to leverage new technologies and meet changing business
    requirements

    +   - Ensuring that compliance with the architecture is enforced'
