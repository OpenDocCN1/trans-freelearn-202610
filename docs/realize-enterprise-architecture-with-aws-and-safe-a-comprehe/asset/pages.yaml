- pgno: 241
  md: '# Setting Up an Enterprise Architecture Practice


    The success of a company’s growth prospects depend on its digital transformation.
    To make themselves more competitive and relevant to their customers, large companies,
    in particular, must complete their business transformation through technological
    change. While more technology-savvy competitors seize market share and customers,
    they want to seize digital growth opportunities. An enterprise architect’s role
    in transformation is crucial since they have visibility into the entire business
    process and are aware of how the IT landscape affects business outcomes.


    As business changes constantly, enterprises need to easily assess the impact of
    these changes on the IT landscape, and how they will affect their operations,
    customer experiences, and their ability to grow. An overview of these issues can
    boost the transformation process. Enterprise architects ensure that IT is ready
    to run upcoming business transformational projects by maintaining a streamlined
    and agile IT landscape.


    This chapter will cover the following topics:


    +   - Enterprise architecture practice and the Center of Excellence

    +   - The enterprise architecture approach

    +   - The process and workflow within enterprise architecture practices

    +   - Goals of enterprise architecture

    +   - Benefits of enterprise architecture

    +   - Enterprise architect role

    +   - Enterprise architecture tools and software'
  merge: -1
  img_proc: true
- pgno: 242
  md: '+   - Enterprise architecture practices with roles

    +   - Enterprise architecture practices with responsibilities

    +   - Setting up the Architecture Board

    +   - Operation of the Architecture Board

    +   - Characterization in terms of enterprise segmentation

    +   - Architectural tools and modeling languages

    +   - Full collaboration between IT and business stakeholders

    +   - Recommended steps for adopting an Enterprise Architect Management tool

    +   - Initiating and evolving an **enterprise architectures** (EA) practice in
    organizations

    +   - Developing digital skills


    # Enterprise architecture practice and the Center of Excellence


    By creating an infrastructure used throughout the company, enterprise architects
    can map the current IT environment. Multiple perspectives can be used when performing
    the application inventory, such as the application life cycle, costs, deployments,
    exchange flows, and how they support the business. We add information to the inventory
    via the data collection and crowdsourcing process in addition to roles, processes,
    locations, and vendors. The outcome of these steps is capability maps that help
    fill operational gaps by reflecting the organization’s business capabilities.
    To conduct objective analysis, enterprise architects use the collected data, including
    **key performance indicators (KPIs)** such as life cycle, cost, risk, enabling
    technology, and vendor dependency.


    Additionally, they are going to perform subjective analyses by giving stakeholders
    automated questionnaires to determine whether the applications they use are efficient,
    effective, and meet their business needs. Based on importance and value, enterprise
    architects consolidate scores and cross-reference KPIs. Getting the most critical
    applications first is imperative to ensuring that the most important resources
    and investments are invested into those applications.'
  merge: -1
  img_proc: true
- pgno: 243
  md: '# The enterprise architecture approach


    IT portfolios can be standardized so that enterprise architects can avoid obsolescence
    by using technology architecture management. Technologies are inventoried with
    vendor and life cycle information (release date, end of life, and so on) that''s
    been obtained from existing Customer Managed Databases and cleansed. A normalization
    tool can streamline technology names when there are multiple sources of information.
    A technology life cycle database and technology inventory may also be compiled
    from external libraries.


    After that, they conduct the following procedures:


    +   - Pick the technologies that will be evaluated as standards, based on feedback
    from developers, architects, and risk managers.

    +   - Decide whether to rate the vendor based on its ability to support applications,
    its business capabilities, or its vendor dependency.

    +   - Throughout the various stages of a technology''s life cycle, its status
    can be updated:

    +     - **Envisioning**: Currently, potential applications for the technology
    are being assessed.

    +     - **Emerging**: The technology is still under development. The technology
    has not been widely deployed yet.

    +     - **Confirmed**: The organization understands the technology and has full
    access to it.

    +     - **Obsolete**: Obsolete technology may pose risks. Once the technology
    has been evaluated, we can determine whether it is compliant with the company''s
    standards and put it in one of two categories:

    +       - **Approved**: Technologies that meet company policy and are considered
    standard

    +       - **Permitted**: Technologies approved by the company

    +     - **Prohibited**: Technologies prohibited by the company.


    The first step to achieving business objectives is to establish clear goals. With
    support from business teams, enterprise architects can map current business capabilities
    and analyze how they may change. This helps you understand how a capability should
    develop in the future or whether it can address a new customer segment or align
    with the business strategy. Business architects use enterprise roadmaps and timetables
    to capture and measure current and future business needs. After that, the enterprise
    architects ensure that the future IT architecture supports business capabilities.
    By defining business capabilities based on a map of the current IT environment,
    they can develop a new IT architecture. When a company evolves to meet new challenges,
    capability maps identify what IT resources are required.'
  merge: -1
  img_proc: true
- pgno: 244
  md: 'The keys to successful data governance are to define standard data governance
    processes, share best practices, and document data usage throughout the entire
    business process chain. Data that’s been collected, processed, and managed by
    a business is clarified and made easier with EAs. Business glossaries and semantic
    representations of an organization are developed by data architects or data stewards
    through the EA process. It is possible to create a data dictionary and model existing
    databases logically. In this process, the consultants discover data from existing
    sources or data lakes and extract metadata from them to rationalize it. Data dictionaries
    are then able to connect with business data. Architects can use this information
    to analyze the impact of a potential change by automating the linkage of data,
    which allows for business data lineage. Having a consistent representation of
    their business and technical data helps the company anticipate and manage continuous
    market changes. Additionally, companies can increase compliance with the following
    revised regulations by consolidating **general data protection regulation (GDPR)**
    requirements with EA, such as the California Consumer Privacy Act:


    +   - EAs need to describe how personal data is processed in their applications
    so that GDPR impacts can be documented.

    +   - Reusing applications developed by EAs support GDPR compliance officers (Data
    Protection Office) in documenting GDPR processing activities more easily.

    +   - The DPO can access detailed information concerning existing GDPR processing
    activities by accessing business processes and applications. This information
    is often presented in the form of diagrams, flowcharts, or detailed descriptions.


    There is a common belief that enterprise architects live in an ivory tower and
    that they are disconnected from reality and are unable to demonstrate the business
    value produced by EA. Nonetheless, enterprise architects play an important role
    in facilitating digital business transformation in today’s highly disruptive and
    agile environments.


    # As a business partner


    The benefit of working with agile teams and being a true business partner is that
    the business partner can highlight trends and provide valuable insight for digital
    transformation. The enterprise architect makes strategic recommendations as a
    business partner. Assessing the potential of emerging technologies, assessing
    the impact of implementing business changes on IT systems, and setting up an entirely
    customized ecosystem are some of the tasks they perform. They demonstrate the
    value derived from the connections between people, processes, applications, and
    infrastructure in their role as a business partner.'
