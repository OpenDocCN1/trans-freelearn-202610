- pgno: 149
  md: '# AWS MRA phases


    Rather than merely describing your workload, an MRA should document what you need
    to migrate to AWS. It will assist you in anticipating risks, costs, and necessary
    processes, as well as potential migration paths. AWS migration readiness is enhanced
    when you perform an MRA, preparing you for every situation and preventing problems
    from arising.


    By working with an MRA, your company can make well-informed, data-driven migration
    decisions and address any questions you may have. In a comprehensive MRA, you
    should ask the following questions:


    +   - Do I have a good case for migrating to AWS? Find out whether AWS might not
    be the right solution for your needs before investing time, money, and effort
    in a migration.

    +   - If I move my workload to AWS, which re-architecture will I need? The re-architecture
    of applications that aren''t easily portable should be planned and budgeted for.

    +   - In this case, would a lift-and-shift migration be useful? Consider taking
    a different approach to AWS if your applications require extensive redesign.

    +   - What would be the cost of migrating to AWS? You may need help first estimating
    migration costs since AWS only offers pricing for computing resources and data
    storage and transfer.

    +   - How would an AWS migration assist your business? The benefits of AWS vary
    greatly depending on the computing needs of your firm, so you may be able to find
    benefits specific to your firm. By knowing these details, you will be better prepared
    to migrate.

    +   - After a successful migration, how much will this workload cost? You''ll
    need to take into account several factors to get an accurate cost estimate. However,
    to budget properly, these factors must be taken into account.


    To make informed decisions about cloud migration, MRAs are vital. In addition,
    answering these questions requires a complex process involving a variety of figures.


    Participants from different parts of the organization will participate in an interactive
    workshop led by an experienced architect or consultant. They will gather key information
    about AWS''s Cloud Adoption Framework to indicate cloud readiness. You''ll receive
    a full debrief along with recommendations following the workshop. You can conduct
    this assessment on its own or integrate it with other workshops and migration
    services.


    # AWS CAF


