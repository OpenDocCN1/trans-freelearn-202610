- pgno: 279
  md: '+   - **Vendor lock-in:** You may become dependent on your cloud provider if
    you become locked in. If your systems have all been developed using the tools
    of a single vendor, changing vendors may be difficult.


    If they begin charging higher prices, your cloud provider options could be limited.
    The foundation is set for migrating back to on-premises storage based on these
    factors, as well as any others. Epics are an organized body of work that can be
    divided into a collection of smaller stories called issues, which Jira uses to
    refer to these smaller narratives. Multiple projects can be handled by several
    teams working together, and multiple boards can be used to manage multiple epics
    simultaneously. Epics are usually preceded by a set of sprints. As the team learns
    more about an epic from development and customer feedback, the user stories will
    be added and removed.


    Based on customer feedback and team cadence, agile epics have a flexible scope
    and use customer feedback.


    For a development team to succeed, an epic should include all the resources it
    needs. When it comes to their work hierarchy, they are at the top. In addition
    to providing context for evaluating epics, it is also important to understand
    how each epic fits into other agile structures.


    A beginner may find it intimidating to break down an epic into smaller pieces,
    but it makes understanding easier and maintains momentum. AWS’ rapid growth may
    raise the question of whether there is a reason for it.


    By leveraging the most advanced technologies and practices, AWS has been able
    to solve the challenges of managing cloud infrastructure and migrating to the
    cloud. Getting to the cloud involves more than just technology, so with Amazon,
    you can transform your business via a cloud migration. Rehosting is a faster method
    than lift and shift or traditional hosting methods since it requires less time.
    In addition, it is less time-consuming to implement and requires minimal refactoring.
    Lifting and shifting, however, may only result in the bare minimum of changes,
    so you may not realize the same benefits as you would from having a fully cloud-based
    system. If speed and ease are the only factors they consider, you could end up
    paying more for a more thorough migration in the short term.


    Even organizations that do not have a fully cloud-ready, simple, low-impact workload
    can benefit from lift and shift. So long as you already have many **virtual machines
    (VMs)**, this should be fairly straightforward. You can even buy products from
    vendors who provide migration automation. There are even vendors who offer products
    that promise to automate your migration. Manually performing the migration, on
    the other hand, is an excellent learning experience. In addition, if you make
    a lift-and-shift decision hastily, once your apps are running in the cloud, they
    can be reworked and optimized easily. In addition to transforming technology,
    cloud computing offers other benefits. The **AWS Cloud Adoption Framework (AWS
    CAF)** offers a comprehensive perspective on cloud adoption. Furthermore, it connects
    six of the most important features of a software system – business, people, governance,
    platform, security, and operations. When an enterprise attempts to migrate, it
    can be helpful to use the framework provided as follows. Despite this, it faces
    challenges such as financial limitations, database issues, and a variety of other
    factors.'
  merge: -1
  img_proc: true
- pgno: 280
  md: 'After a successful migration to the cloud, several benefits can be realized,
    including high scalability, superior performance, and an exceptional digital experience.
    Several cloud migration strategies may be applied, depending on the team infrastructure
    and organization, such as repurchasing, which has its own set of driving factors,
    limitations, and risks.


    As well as multiple challenges posed by migrating to the cloud, unstructured organizations
    will deal with budgeting, adjusting to the new cloud environment, and downtime.
    In the repatriation of cloud-based services from the cloud to on-premises data
    centers, these services are transferred from the cloud to on-premises servers.
    When cloud applications are repatriated from a cloud to an on-premises server,
    they have been transferred from the cloud. Cloud applications that are moved from
    the cloud to on-premises servers are called to bring them back to the data center.
    De-clouding, also known as reverse cloud migration, is a process that removes
    the public cloud from a system.


    An organization’s growth prospects determine its success in digital transformation.
    In particular, large companies must complete business transformation through technological
    advancement to remain competitive and relevant. Competitors who are more technological
    savvy take market share and customers, but many companies are looking for opportunities
    for digital growth. An enterprise architect’s role in transformation is not only
    crucial since they have a thorough understanding of the business processes, but
    because they also understand the impact that the IT landscape has on business
    results.


    # Constant business changes impact the IT landscape


    Enterprises must easily assess how changes in the business landscape are affecting
    the IT landscape, and how these changes affect their operations, customer experiences,
    and the ability to grow. An understanding of these implications can help propel
    the transformation process forward. IT architects play a vital role in making
    sure IT infrastructure is streamlined and agile to handle upcoming business transformation
    projects.


    The organization’s enterprise architecture is guided by its business requirements.
    They are responsible for defining how information, business, and technology flow
    within the organization, among other things. To stay competitive, companies have
    become more focused on emerging technologies such as cloud computing, IoT, and
    **machine learning (ML)**.


    People, data, and technology can be combined to provide IT organizations with
    a comprehensive understanding of their interrelationships. Owners, designers,
    and builders take a comprehensive look at the organization as a whole during the
    design process. It is designed to provide an enterprise view from a holistic perspective,
    rather than rely on formal documentation.


    To effectively implement EAP strategies, it is crucial to take the most recent
    changes in business processes, organizational structures, and information technology
    into account. Various aspects of the organization will be discussed, such as standard
    language and best practices, as well as how to integrate or eliminate processes.
    It is crucial to have reliable, timely, and efficient business information.'
  merge: -1
  img_proc: true
- pgno: 281
  md: 'One thing you can rely on is that data estates will grow exponentially. Scalable
    enterprise architectures, processes, and services will become increasingly important.
    The key question to answer is whether or not our estate management tool automatically
    scales with our estate.


    To succeed in enterprise architecture, embrace collaboration and highlight the
    value of your efforts. Including stakeholders from every part of the organization
    in your efforts is vital – and ensuring that they benefit from them as well. The
    data should be used by stakeholders to make more effective strategic decisions.
    Provide them with information about what they should expect. EAs, in today’s world,
    concentrate on optimizing and customizing business capabilities to achieve a goal
    or deliver the desired result. By addressing business capabilities as a portfolio,
    we can assist organizations in investing in the right capabilities. This digital
    transformation has caused organizations to come up with new ways to keep up with
    the digital curve to remain competitive. By using an outcome-based architecture,
    these organizations have been able to address the effects of digital transformation.
    The shift from traditional to digital EA has been made possible by utilizing these
    novel approaches.


    Also, it appears that the trend of creating communities of domain experts, rather
    than one single EA team, is shifting. For enterprise architecture to succeed,
    it must be possible for several businesses and the IT team inside an organization
    to collaborate, have discussions, and consider different architectural approaches
    and views. Due to the growing number of Agile workers, EA has taken on a more
    significant role, even when it comes to governance. It has traditionally only
    been used for project teams and solutions, and it has been governed by an enterprise
    architecture board. An enterprise architecture that incorporates a flexible governance
    model promotes collaboration so that the enterprise architecture can be integrated
    into a company’s culture. In the traditional EA deliverables form, static documentation
    was difficult to maintain and update because it was unstable. As a result of the
    evolution of the digital enterprise architecture, a central repository can be
    updated and maintained over time as a point of truth that drives enterprise agility.
    The digital enterprise architecture plays a vital role in fostering an organization’s
    innovation culture through innovation management. Disruptive or incremental changes
    are emphasized here. If digital EA wants to become a digital change engine, it
    must have a well-managed innovation process.


    In today’s business world, changes are constant, and businesses must assess the
    impact of these changes on their IT landscapes, and how these changes will impact
    their operations, customer experiences, and ability to grow. This can help improve
    the transformation process if the issues are examined closely. Architects ensure
    that IT can run upcoming business transformation projects by ensuring that the
    IT environment is streamlined and agile. As such, we have discussed the importance
    of EA enablement readiness, and the steps organizations can take to enhance it
    in this chapter. During the process, we also establish and determine a foundation
    that assists in understanding the process and flow by which to establish the EA
    practice.


    Writing a book was harder than I could have imagined but equally rewarding as
    well. I am hopeful that this book offered you enlightenment and in-depth knowledge
    on the matter. I am eternally grateful to everyone who was involved in making
    this book what it is – my editors, researchers, and publishing team.'
