- pgno: 204
  md: '# Aligning architecture with business value


    Technology is an essential part of supplying value to customers in the digital
    age. Whenever business strategies change, the systems, applications, and technology
    that deliver those strategies must also adapt. Those who support applications
    and systems are responsible for any changes to the customer experience. It is
    the architects’ responsibility to ensure those systems are able to achieve current
    and future business goals in close coordination with business owners and product
    managers. A portfolio vision, a portfolio canvas, and a strategic theme guide
    the architecture of the company. Technical investments are set into a portfolio
    by these constraints, which provide direction, along with an overall context.


    In addition to a narrow focus on architecture, EAs should also consider the larger
    enterprise strategy. Essentially, an end-to-end value stream comprises all the
    activities that lead to the creation of a result for a client, be it the ultimate
    customer or an internal customer. It is crucial to identify the stakeholders who
    trigger and participate in the business architecture value stream. Additional
    incremental items that accrue as part of the path to reaching the value proposition
    are also included. Essentially, it illustrates the value sought and received –
    or, to put it another way, the purpose for which a customer deals with a company.


    The operational value stream, as illustrated by the SAFe framework, explains how
    goods and services are provided to customers. The operational value stream contains
    the people and systems that did the work, in addition to the systems, flow of
    information, and material that delivered value to the customer.


    In general, value streams align well with business architecture in SAFe. While
    there are a few semantic differences between the concepts of capability within
    the business architecture and SAFe, more consideration is necessary. Although
    SAFe and business architecture concepts may not be misaligned, the specific language
    used by the two frameworks requires practitioners of both to consider their shared
    vocabulary with care, especially when harnessing the power of both tools.


    # Developing solution vision, solution intent, and roadmaps


    Using SAFe’s solution intent, you can store, manage, and communicate information
    about the current and intended behaviors of your solutions. It provides a simple
    but elegant way to capture knowledge. Also, it offers a basic understanding of
    current and evolving requirements, designs, and intentions. This generally indicates
    that the solution’s primary purpose has been satisfied. Business goals are more
    likely to be achieved when architecture is aligned with business strategy. By
    translating strategy into solutions, architects help businesses meet their objectives.
    Solution vision, context, and intent are the three characteristics of those solutions.


    Solution intent is embedded storage of knowledge, providing a single point of
    truth for all content relevant to the architecture of the system, including requirements,
    design, structure, behavior, and other architectural concerns. The intent of the
    solution includes all the decisions, patterns, models, and other technical information
    required to meet minimal requirements. In addition to system constraints, the
    solution intent captures Non-Functional Requirements (NFRs). To ensure quality'
  merge: -1
