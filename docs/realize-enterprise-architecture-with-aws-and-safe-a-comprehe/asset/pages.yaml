- pgno: 144
  md: 'AWS’ Well-Architected Framework incorporates six core elements—operational
    excellence, security, reliability, performance efficiency, cost optimization,
    and sustainability, described in more detail here:


    +   - **Operational excellence**

    +     Supporting the development and running workloads in a high-performance manner,
    gaining insight into their operations. Improvement of processes and procedures
    to assure business value is also delivered.

    +   - **Security**

    +     Cloud technologies can be used to improve your overall security posture
    by protecting your data, systems, and assets with cloud technologies.

    +   - **Reliability**

    +     Workload reliability involves the ability for workloads to perform their
    intended functions correctly and consistently when they’re supposed to. Workloads
    must be capable of being operated and tested throughout their entire lifetime.
    An in-depth guide to implementing AWS workloads that are reliable is provided
    here.

    +   - **Performance efficiency**

    +     As demands and technologies change, efficiency refers to the ability to
    utilize computing resources efficiently.

    +   - **Cost optimization**

    +     The ability to run systems at the lowest possible price while delivering
    maximum value to the business.

    +   - **Sustainability**

    +     The ability to reduce energy consumption and increase efficiency over time
    to continuously improve sustainability impact. We maximize the benefits of provisioned
    resources while minimizing the total resources needed across all components of
    a workload.


    Six core elements incorporated by AWS’ Well-Architected Framework are presented
    in the following diagram:'
  merge: -1
  img_proc: true
- pgno: 145
  md: '![](img/16bfeb984938aba3d9334582c2cd6e69_145_0.png)


    +   - Increase awareness of architectural best practices and design principles

    +   - Addresses foundational areas

    +   - Consistent approach to evaluate and assess architectures

    +   - Influence future architectures


    Figure 5.1 – Factors that contribute to the AWS Well-Architected Framework


    The architecture team should be capable of creating architectures and following
    best practices. A virtual community of AWS principal engineers can review designs
    and help new teams understand AWS best practices. This will help new teams acquire
    these capabilities or existing teams raise their bar. Best practices are made
    visible and accessible by the principal engineering community. Lunchtime presentations
    are one way they do this; for example, by discussing real-life examples of best
    practices. During the talks, new team members will be able to view recordings
    of the talks.


    Our experience running internet-scale systems on AWS has led to the development
    of best practices. The best practice is usually determined by data, but **subject-matter
    experts (SMEs)**—such as principal engineers—are also crucial. Principal engineers
    ensure that teams follow best practices as new ones emerge through their community
    work. Our internal review processes will incorporate these best practices in time,
    as well as mechanisms to ensure compliance. We have codified our principal engineering
    thinking in our Well-Architected Framework, which serves as a customer-facing
    implementation of our internal review process. Field roles, such as solutions
    architect and internal engineering teams, have been integrated into it. By using
    the Well-Architected Framework, you can utilize these learnings on a scalable
    level.


    A well-architected enterprise architecture based on the needs of customers can
    emerge by using the method of a principal engineering community with distributed
    ownership. **Chief technology officers (CTOs)** and other technology leaders should
    conduct Well-Architected reviews across their entire portfolios to better understand
    the risks. Using this approach, you can identify themes across teams that your
    organization can address through training, lunchtime discussions, or other mechanisms
    that allow your principal engineers to share their thoughts with other teams on
    specific topics.'
