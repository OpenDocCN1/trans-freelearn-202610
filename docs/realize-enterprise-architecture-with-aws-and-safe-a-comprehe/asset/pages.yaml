- pgno: 43
  md: '# Defining Core Foundation and How to Get It Right


    To achieve strategic digital goals, Enterprise Architecture (EA) requires the
    involvement and integration of people, processes, and technology. Architectural
    flaws are exposed every time a negative interaction occurs with your application,
    website, phone call, or service provider. Without resolving these issues, great
    organizations can be destroyed. The issues, their solutions, and related aspects
    will be covered in this chapter, where we will be explaining the following aspects:


    +   - Owning EA and the manifestation of an effective Core Foundation framework

    +   - Business agility and IT value realization are complex

    +   - Steps for getting it right the first time – core foundation

    +   - Leadership principles and how they relate to enterprise architects


    # Owning EA and the manifestation of an effective core foundation framework


    Even financially thriving organizations have faced massive challenges because
    they did not pay close attention to customer dissatisfaction and negative feedback
    related to interactions with customer service.


    These architectural gaps have had a devastating impact on prominent companies
    in the past. One of the primary reasons for such inadequacies lies in the fact
    that their digital economic model is based on an integrated solution; however,
    most businesses operate around product verticals. Companies tend to define customer
    experience based on a certain product or service, not the overall experience with
    the business. These are effective approaches for creating an infrastructure that
    delivers a top-notch experience for target audiences:'
  merge: -1
  img_proc: true
- pgno: 44
  md: '# EA and the business must align


    After careful consideration, an EA team proposes changes within the business landscape.
    They conduct thorough research on how a particular implementation will affect
    the business and to what extent it will provide capabilities that can enhance
    the overall system and processing workflow. Another approach to make this system
    effective is to divide responsibilities among various business units. EA is the
    bridge between functional groups; therefore, a centralized EA is the preferred
    option.


    It is not recommended that you implement an independent EA department for every
    business unit. This approach is more likely to result in misalignment, inefficiencies,
    and potentially devastating outcomes. EA encourages organizations to engage with
    various stakeholders or EA that are not just technology-focused, such as application
    consultants or data specialists, but also business stakeholders, financial people,
    and risk people, and really try to involve them in the process model which would
    benefit the business and IT alignment far better.


    # Who is accountable for EA decisions?


    When plans work out well, everyone is ready to take the credit, but with a failed
    IT venture, everyone tends to pass the responsibility onto someone else. To avoid
    such a situation, where a disagreement turns into finger-pointing, companies must
    establish clear accountability for the issues related to business architecture.
    Accountability problems begin in a conference room filled with IT and strategy
    teams, finance departments, and software development groups. With every stakeholder
    on the table, differences of opinion are bound to surface. Transparency is important,
    but with an ineffective accountability system, things can get out of hand. In
    general, the EA Governance committee should be held responsible for any EA decisions
    across the organization, but keep in mind the collaborative efforts of architects
    from different lines of businesses and domains.


    # The collaboration of EA with the business and organization


    Communication is the key to success for any organization, and meaningful collaboration
    among various teams within a company ensures a positive outcome. Often, the EA
    department limits itself to creating comprehensive system maps with critical information
    that addresses all the requirements. However, with limited or no discussion with
    and among the departments affected by those plans, it is impossible for the business
    to interpret the EA’s recommendations.


    Across the EA effort, other teams are held responsible and accountable for their
    areas of expertise – for example, software developers are held responsible for
    designing complex technology frameworks. Typically, the EA team works with more
    conceptual tasks, such as business processes, the time and talent required for
    the delivery of software and services, the overall business objectives, and the
    scope of individual IT projects. To ensure the maximum productivity and advancement
    of target goals within an organization, close collaboration is imperative. To
    increase the likelihood that IT and other internal teams will embrace and support
    the new architecture, EA must guide team leaders across the business, interpret
    complex ideas, gather feedback, and involve other teams within the design process.'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# Keep strategy and operation tasks separate


    The EA team is responsible for conceptual tasks such as strategy, analysis, and
    facilitating the implementation of prescribed changes. However, in many organizations,
    their duties are not limited to just these tasks. Often, they are pulled in to
    manage or provide direction on key issues or initiatives. For example, building
    the business case for a large IT transformation project or assisting the IT team
    with a systems-migration project.


    The EA team’s extended knowledge of every department and ongoing projects, along
    with the problem-solving skills within an organization, are leveraged to make
    the right business decisions. Instead, the team’s primary focus should be on strategy
    building, lending a helping hand on other projects, and assisting with day-to-day
    business affairs as they relate to the work of the EA team. As long as operational
    and strategic tasks are managed efficiently without the duplication of work, the
    EA team will be most productive.


    # Approval rights for the EA team


    Organizations underestimate the power and capabilities of EA teams, and this can
    be seen when the leadership fails to understand how EA works or they do not give
    the EA team credit for achieving positive outcomes. Other departments, such as
    IT, marketing, and sales, tend to have bigger budgets at their disposal and are
    often provided room to take risks.


    When leadership provides equal opportunities for the EA team to be involved in
    decision-making, policy change, and other processes, EA can turn out to be the
    most valuable asset in an organization. They have visibility to issues across
    the organization and can think ahead to potential issues that the business might
    encounter in the future. They can attract high-potential management talent that
    can help the organization rethink tailored IT systems. Being recognized and acknowledged
    as a valuable stakeholder is meaningful and motivates EA leaders and team members
    to continue great work.


    # EA elements for accountability


    A centralized system for communication, collaboration, and accountability is absolutely
    essential for maintaining a seamless workflow. In an organization, if each group
    uniquely interprets a piece of information, communication issues are bound to
    occur. The EA team should have full control over all IT decision-making processes
    while also ceding responsibility for particular elements to other business units.
    Teams can avoid communication errors and ensure maximum productivity by assigning
    an individual on the team to be accountable for the work of the EA team.


    # Measure EA’s effects on the business


    The need to pursue an EA approach has never been greater. EA supports a digital-forward
    approach with a flatter leadership hierarchy. Minor glitches and operational issues
    can be addressed easier and faster with this Enterprise Architecture model.'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'Analyzing and measuring the overall impact an EA approach has on a business
    is a very complex task, due to the operational methodology behind EA''s day-to-day
    processes. The team''s everyday affairs are dependent on individual business units,
    external service providers, and many interdependencies. The nature of their tasks
    is conceptual, which makes it nearly impossible to measure an absolute impact.
    However, the best way to critically analyze it is to base judgments on a single
