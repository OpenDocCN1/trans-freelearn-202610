  md: '# High impact and low effort with AWS-offered refactoring


    The five most important minimum viable refactoring activities at AWS are listed
    next. Despite the differences between apps, these actions typically deliver big
    rewards with little risk.


    # Updating the operating system (OS)


    Do you receive security updates and patches for your **operating system** (OS)?
    Unless you do, you should consider upgrading as part of the migration process.
    As a result of upgrading on-premises, you must purchase new licenses, provision
    capacity through complex IT procurement processes, test the application, and then
    perform the migration. There are numerous steps, and the process can be both time-consuming
    and costly. Because of this, businesses often delay OS upgrades, especially when
    there are time-sensitive applications that must always run. Performance and security
    can both be compromised by running on a legacy OS.


    An ideal opportunity to upgrade is through cloud migration. It is easy to begin
    testing your application by spinning up a small instance quickly and cheaply.
    **Amazon Machine Images (AMIs)** come with many of the Linux and Windows Server
    OSes already preinstalled, along with dozens of other options. You can test it
    by connecting Amazon CloudWatch-managed monitoring services and uploading your
    code. Often, it is not necessary to change the app to move to a supported version.
    The system can be kept running and tested at a low cost before migration.


    With a small team and without a formal procurement process, most application owners
    can handle this themselves. By compressing the feedback loop, the upgrade process
    is made quicker and less expensive. There are times when this is not so easy.
    Usually, there are some applications in a large company that are running on an
    older platform. That long-running software can be obscure and fragile due to documentation
    gaps. Here, a cloud-based experimentation environment would be even more valuable.
    To get it to the cloud faster, you can run it in a container, and then you can
    continue improving it in a sandbox environment.


    # Upgrading your framework


    Usually, framework versions, such as .NET and Node.js, have an expiration date
    after which they are no longer supported, and patches are no longer available.
    This is for logical reasons, as companies need to maintain frameworks for a considerable
    length of time. Upgrading in-house often involves app surgery and is prohibitively
    expensive. Experimenting with framework updates is much easier in the cloud. The
    entire stack can be licensed and deployed without the need for additional data
    center capacity, as demonstrated in the OS scenario.'
