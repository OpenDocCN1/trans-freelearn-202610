    # Supporting new strategic themes and value streams


    Business requirements and opportunities demand that architecture evolves. The
    alternative is that technology becomes an obstacle to business success. Changing
    business strategies results in new or redesigned strategies that are applied to
    the portfolio canvas and result in original or modified solutions or value streams.
    Business architects assist and influence this process through their input, participation
    in Value Stream Mapping workshops, and by setting expectations regarding technical
    feasibility.


    Architects of systems and solutions collaborate with EAs to realize the new business
    direction once it is determined. They communicate how their new strategy changes
    the vision of the solution, its functionality, and its roadmap. In addition, EAs
    coordinate architecture activity across multiple business units to ensure alignment
    between products and processes. Technical consultants may also advise on the non-functional
    requirements (security, compliance, performance, and so on) of portfolio solutions
    in addition to provide technical guidance for the long-term evolution of technologies
    and platforms. In their role as enablers, these workers ensure major technological
    shifts are aligned with business strategy.


    # Leading the lean-agile transformation


    The development community often respects and holds architects in high regard due
    to their knowledge and experience. Thus, architects play an instrumental role
    in any SAFe implementation. Lean-agile architects have the role of leading by
    example, coaching, and encouraging developers to adopt leaner ways of thinking
    and operating. As a result, the development community is able to expand its knowledge
    base and skill set due to autonomy and mastery. By becoming SAFe architects, organizations
    can learn how to work in a lean-agile environment, participate in developing the
    organization’s roadmap that has been implemented, and accelerate adoption.'
