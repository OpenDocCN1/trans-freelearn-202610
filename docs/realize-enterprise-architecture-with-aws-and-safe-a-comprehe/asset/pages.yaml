- pgno: 169
  md: '# Phase H – architecture change management


    Added business value to architecture is the goal of an architecture change management
    process. A cohesive, architected process is required to manage changes to the
    architecture. Typically, processes such as these are used to continuously monitor
    governance requests, technological developments, and business environment changes.
    Change management will decide whether a new cycle of architecture evolution needs
    to be launched when changes are identified.


    An enterprise’s architecture governance process is very closely tied to the architecture
    change management process. Additionally, the architecture function manages contracts
    between itself and the enterprise’s business users. The governance body must determine
    in Phase H whether a change request should only be treated as an architecture
    update or whether a new architecture development method cycle needs to be started.


    # Requirements management


    A flexible approach is crucial to dealing with changing requirements. By its very
    nature, architecture involves uncertainty and change – the gray area between what
    stakeholders want and what can be specified and planned. As a result, requirements
    for architecture will always change over time. Additionally, architecture encompasses
    many drivers and constraints beyond the control of an organization (such as changes
    in market conditions and new legislation), which results in unexpected changes
    in requirements. Requirements management processes do not deal with, decide upon,
    or prioritize requirements. They manage them in the relevant phases of the ADM
    meaning, managing requirements throughout the entire process of the ADM.


    # Resources


    There are numerous recommendations and processes for managing requirements that
    are emerging in the world of requirements engineering. These processes simply
    stipulate what should be achieved by a successful requirements management process.
    The TOGAF standard does not mandate any particular processes or tools. To discover
    and capture business requirements, the business scenario technique is an effective
    and appropriate tool.


    In addition to architecture definition and realization, all cloud architecture
    development activities follow an iterative process. The organization takes this
    step-by-step approach to transform its architecture along with its business goals
    and opportunities.'
  merge: -1
  img_proc: true
