- pgno: 176
  md: 'As a result of this, an architecture change management process is leveraged
    to set a new baseline for the enterprise architecture.


    # Cloud ecosystem reference models


    This model describes how to realize and facilitate architectural capabilities
    in an enterprise cloud ecosystem through participation by at least one of the
    new or existing participants.


    # Business support services and ABBs of the cloud ecosystem reference model


    The purpose of this section is to discuss the interoperability of an IT and business
    taxonomy. The following sections make up a comprehensive list of services that
    will simplify enterprise business operations and reduce complexity.


    # Accounting and billing


    Bills for cloud services usage data are generated and managed based on predefined
    billing policies. The providers of cloud services might permit consumers to receive
    one bill for multiple subscriptions to qualify for volume discounts. Other accounting
    functions are also handled by the program.


    # Auditing and reporting


    The audit and reporting service keeps a record of all activities for an agreed
    period of time, which will assist with future investigations. This helps reduce
    the risk of disruptive business processes and performance degradation. Reports
    that perform client-facing business operations activities are generated.


    # Availability and continuity


    This service handles redundancy and workload mobility between cloud service providers.
    The primary objective is to ensure the selection of high availability practices
    and considerations in the design of cloud services.


    # Compliance and policies


    Corporate governance and compliance with applicable laws and regulations are some
    of the activities that the compliance and policies service defines. The organization
    maintains an organizational structure, processes, tools, and business policies
    to ensure these services.


    # Consumer service


    To ensure cloud service consumers receive effective care and that information
    about their relationships with the company is well handled, the consumer service
    provides an authoritative view of consumer information.'
  merge: -1
  img_proc: true
- pgno: 177
  md: '# Contract and agreement


    Various aspects of cloud services are offered and managed by the contract and
    agreement service with regard to the contract life cycle and contract life cycle
    management. As part of the contract, cloud service consumers are notified of applicable
    policies and SLAs for using cloud services.


    # Metering service


    Cloud services and their underlying resource usage are billed/charged using the
    metering service. A certain level of abstraction is applicable depending on the
    service type provided by this metering system.


    # Order service


    Cloud service orders are managed by the order service. In this case, cloud services
    are configured, service life cycle services are orchestrated, and billing and
    accounting are offered.


    # Service demand


    Based on past business activity patterns and future growth projections, this service
    identifies the business demand for cloud services.


    # Subscription service


    Subscription services provide cloud service providers with the option to charge
    for cloud services according to different subscription models. Subscribers can
    opt for fixed-rate, tier-based, or pay-as-you-go subscriptions. Providers monitor
    the allocation, consumption, and chargeback of cloud services to their subscribers.


    # Operational support services


    Enterprise cloud ecosystems can be operated efficiently by operational support
    services.


    # Capacity and performance service


    Cloud capacity and performance are optimized through the capacity and performance
    service. Real-time analysis and automatic workload adjustment are performed while
    cloud services are running.


    # Incident and problem handler service


    In this service, problems and incidents that are related to the service are handled
    and the root causes are analyzed. Data is stored in a knowledge support repository
    for further analysis.'
  merge: -1
  img_proc: true
- pgno: 178
  md: '# Inter-cloud connection service


    To enable interoperability between cloud services, the inter-cloud connection
    service serves as a seamless bridge between different environments. Connecting
    with the cloud service facilitates remote access, allows users to cross different
    network boundaries, and improves performance.


    # IT asset and license service


    License agreements for cloud services related to various aspects are controlled
    by the IT asset and license service. Additionally, some providers allow cloud
    service consumers to purchase licenses directly from software/solution vendors
    or to lease as and when needed.


    # Service orchestration


    Cloud service orchestration allows the management of capacity and performance
    for cloud services on an automated basis. In this way, multi-cloud services are
    coordinated seamlessly.


    # Template service


    Service templates are used to create reusable instances. The template service
    enables the automatic provisioning and redeploying of applications on cloud service
    platforms.


    # Cloud security services


    Data, applications, and infrastructure that are stored in the cloud are protected
    by cloud security technologies, policies, controls, and services.


    # Data protection


    Despite the fact that data, in today’s world, is an invaluable asset, most of
    it remains worthless if it isn’t protected. We need to protect data at every stage
    of the life cycle, for all data types, and at all levels of the data life cycle.
    To provide data protection, a variety of controls must be implemented, including
    data life cycle management, data leakage prevention, intellectual property protection,
    digital rights management, and cryptographic services.


    # Enterprise data management


    To securely share information among enterprise cloud ecosystems, information/data
    is a crucial enterprise asset that must be managed. All phases of the life cycle
    of all categories of data must be addressed by enterprise data management. Data
    governance, information planning, IT architecture, record and archive provisioning,
    and privacy are core enterprise data management functions.'
  merge: -1
  img_proc: true
- pgno: 179
  md: '# Governance risk and compliance


    Compliance and governance encompass, integrate, and align various corporate governance,
    enterprise risk management, and regulatory compliance activities. Among these
    components are vendor management, audit management, IT risk management, policy
    management, technical awareness, and training.


    # Infrastructure protection services


    Data security is the practice of making sure that containers and pipes of data
    are secure using a traditional defense-in-depth approach. Generally, infrastructure
    protection services are considered preventive technical controls. Most traditional
    or non-advanced attacks can be defended against relatively effectively.


    # Information security


    Information security aims for the implementation of appropriate measures to eliminate
    threats and vulnerabilities related to data. In international enterprises, data
    transit and storage might differ significantly as a result of different national
    legislation and consequently affect information security concerns often related
    to privacy and confidentiality.


    # Policy and standards


    An information security policy outlines how much security should be applied to
    protect the business. However, often, technical solutions are not mentioned in
    policies, which specify what should be done. In order for the many different components
    to be integrated into systems, security standards are an abstraction at the component
    level.


    # Privilege service


    As part of Identity and Access Management, the privilege service ensures that
    users have the access that is necessary to perform duties. Examples include identity
    management, authentication services, authorization services, and privilege usage
    management. It allows access to the right resources across increasingly heterogeneous
    technologies and meets increasingly stringent compliance requirements.


    # Threat and vulnerability service


    Threat and vulnerability management deals with core security matters. An enterprise
    must track and monitor its assets, scan for known vulnerabilities, and take action
    by patching the software. This is called vulnerability management. In order to
    identify the vulnerabilities effectively, threat modeling and security testing
    are also required.'
  merge: -1
  img_proc: true
- pgno: 180
  md: '# Performance services


    Performance services ensure SLAs are adhered to for the cloud services. It includes
    monitoring resource utilization, analyzing resource performance in a cloud computing
    environment, and assessing service performance in real time.


    # Resource health monitoring


    In order to provide better performance, accountability, and business results,
    resource health monitoring generates cloud resource performance reports. This
    solution allows the monitoring of SLAs based on defined metrics.


    # Service health monitoring


    Service health monitoring allows users to view the health of their cloud services,
    create reports on the performance of cloud services, and improve performance,
    accountability, and results. SLA metrics are also supported.


    # SLA enforcement


    In order to avoid penalties, SLA enforcement ensures the SLAs are strictly enforced.
    As the subscription renewal process approaches, data related to SLAs can also
    be captured and used to make adjustments to contracts and agreements.


    # Interoperability and portability services


    A cloud ecosystem requires effective integration with all its stakeholders through
    interoperability and portability services.


    # Data interoperability


    Cloud service consumers can seamlessly manage both structured and unstructured
    data through interoperability. Data that is semantically consistent can be shared
    across multiple enterprises. A suitable semantic standard could be based on cloud-specific
    metadata, for instance, Open Group''s Universal Data Element Framework (UDEF)
    or the US Government''s National Information Exchange Model (NIEM). The information/data
    in a cloud ecosystem can be shared and reused.


    # Service interoperability


    Data and services can be consumed across multiple cloud service providers with
    a unified management interface through cloud service interoperability.


    Cloud service providers are able to access information related to underlying resources
    and provision a workload seamlessly using IaaS interoperability.'
  merge: -1
  img_proc: true
- pgno: 181
  md: 'Interoperability at the PaaS level revolves around developing and deploying
    platform services, as well as licensing them, seamlessly. However, SaaS consumers
    expect their SaaS applications to have critical features supported across multiple
    channels.


    # Data portability


    Data migration allows data to be transferred from one cloud environment to another
    or from one computer to another. On the other hand, the synchronization of data
    within a cloud ecosystem is the mechanism to ensure consistency across all duplicated
    target data storage for a single set of source data. The data is kept continuously
    coherent over time.


    # Product catalog services


    An enterprise''s cloud services are cataloged in the cloud ecosystem''s product
    catalog.


    # Change and configuration services


    Cloud services configurations are kept compliant with changes in policies and
    compliance by the change and configuration services. They ensure that the cloud
    services that are offered in the catalog are configured correctly.


    # Service catalog


    Cloud service consumers can subscribe to services listed in the service catalog
    and the catalog information can be configured easily. Cloud consumers can describe
    and manage cloud services more easily by using a self-service cloud service provisioning
    portal. Alongside describing cloud service provider capabilities, the service
    catalog could describe how well they meet cloud performance ratings.


    # Resource catalog services


    Cloud ecosystems manage underlying cloud services resources through resource catalog
    services.


    # Change and configuration service


    Cloud services are configured in compliance with changing policies and compliance
    requirements through the change and configuration service.


    # Resource catalog


    A resource catalog manages information about the resources that are needed to
    support the provisioning requests of cloud services. These are captured through
    the self-service cloud service administration.


    In catalogs, metadata represents resource characteristics that can be analyzed
    by humans and machines for further analysis.'
  merge: -1
  img_proc: true
- pgno: 182
  md: '# Enterprise architecture principles of the cloud ecosystem


    Architectural Building Blocks (ABBs) defined in the cloud ecosystem reference
    model for managing the life cycle of cloud services maintain enterprise architecture
    principles for the use of the ABBs across the enterprise. Enterprise principles
    and a consensus, in terms of architectural design, should underpin these principles.


    # Auto-provisioned sharable system infrastructure


    A cooperative infrastructure is supported by shared and auto-provisioned computing
    resources. The underlying computing resources of the IaaS cloud service provider
    utilize a multi-tenant environment in order to maximize profit. If moving workloads
    across IaaS is done right, the overhead can be reduced, and the SLAs can be met.


    # Cloud solutions are designed to address performance variance


    Due to performance variances, latency fluctuations, and network failures, some
    cloud solutions that rely on public networks and the Internet Protocol (IP) are
    insecure. Cloud computing is characterized by the ability to access cloud services
    through standard and public internet connections. It is essential that cloud solutions
    address unreliable IP services and variances in latency.


    Solutions for cloud computing should provide seamless connectivity and meet performance-related
    SLAs.


    # Automated ways to measure and optimize cloud solutions


    The measurement and optimization of cloud services can be automated through the
    use of metering and cloud service solutions.


    The cloud service provider and the cloud service consumer need real-time visibility
    of cloud services’ utilization in order to minimize investment in cloud services.


    # Loosely-coupled cloud services


    The cloud infrastructure should be loosely coupled between SaaS, PaaS, and IaaS.
    Dynamic and scalable cloud environments are supported by cloud services. Provide
    a multi-tenant deployment model with minimal customization of cloud services.


    # Cloud service abstraction and control


    Provide a level of abstraction with cloud services that allows them to be securely
    exposed while hiding all of the implementation details. Providing service agility
    is achieved by separating the deployment details and hiding the implementation
    details within cloud services.'
  merge: -1
  img_proc: true
- pgno: 183
  md: 'The concept of cloud services must be abstracted from the implementation details.


    # Multi-tenancy


    Multi-tenant clouds must support tenant and solution isolation. In every case,
    it is critical to separate the assets of each client from the assets of other
    clients, regardless of the storage medium. Ensuring that their clients have secure
    isolation between assets is a major priority for cloud service providers. Their
    isolation control mechanisms do seem to succeed in controlling this capability,
    although they find it difficult to demonstrate.


    # Summary


    Understanding the TOGAF architecture domains and exploring cloud ecosystems in
    context to AWS is what this chapter is all about. We also reviewed the reference
    architectures and models and shed light on how to approach each phase of TOGAF
    ADM in AWS cloud transformation. The aim is to understand the non-functional aspects
    of the system including security, reliability, operational excellence, performance
    efficiency, and cost optimization. Moving forward, we will talk and explain WAR
    alignment with TOGAF principles.


    The interoperability of an IT and business taxonomy along with the comprehensive
    list of services that will simplify enterprise business operations and reduce
    complexity were also mentioned in this chapter.


    Next, we will find the answer to the following questions: how do you select the
    IT initiative across your enterprise, and what is the strategy that drives ABB
    s and solution building blocks? With a deep study of multiple architectural phases
    and implementations, we will discuss and explain strategies for infrastructure
    implementation, including on-premises, cloud, and hybrid. Furthermore, we will
    dig deeper into SAFe and learn more about aligning enterprise architecture and
    SAFe for any business to determine how it caters to AWS cloud customers.'
  merge: -1
  img_proc: true
