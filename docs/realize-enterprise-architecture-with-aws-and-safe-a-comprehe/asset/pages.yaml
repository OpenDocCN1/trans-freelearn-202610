- pgno: 93
  md: '# EA repository


    What is the ultimate goal that an organization is working toward? Which resources
    are being exploited to achieve that goal? What kinds of IT assets does a company
    have when it comes to internal and external operations? Well, all this information
    can be found in an EA repository. It reflects the organization''s technology,
    data, applications, and business artifacts and the relationships between these
    components. A while ago, companies used to spend millions of dollars on off-the-shelf
    products to meet their repository need. However, with cloud services, things have
    changed to a great extent, and AWS tagging and resource groups are now letting
    companies organize their AWS landscape by applying tags at different levels of
    granularity.


    They offer labeling, collecting, and organizing resources and components within
    the services. Another major benefit that comes with AWS services is that managing
    applications’ businesses and technical components of the target landscape globally
    are made possible. Together, AWS Config, tagging, and Resource Groups make it
    easier to detect a rogue server or shadow application in a target production landscape.


    Customer obsession is one of Amazon’s customer-centric guiding principles. The
    company’s approach begins with focusing on the customer and then builds products
    to delight that customer. AWS helps figure out customer needs to come up with
    innovation and improvements.


    # Working backward with AWS


    Working backward is a fundamental part of the AWS innovation process. AWS begins
    by determining what the customer needs and wants, and then makes improvements
    based on their requirements.


    The product team at Amazon thinks through all of the reasons why a certain product
    is developed and why anyone would be interested in it. A compelling news release
    is then drafted to announce the product and convince the target customer to opt
    for it. This announcement should take readers into an imaginary world where their
    lives would be incomplete without this product. That’s the only way to be impactful.


    Amazon services do not just represent a software structure but also an organizational
    structure. By working backward, a better offering can be created for your customers.
    Small teams are allocated to a certain product to work together for maximum productivity
    with a strong ownership model as if it were a start-up on its own. Individual
    and undivided attention is paid to aspects such as who the customers are and what
    they are looking for. Working backward is a process we employ to ensure service
    meets the needs of a customer by starting with the customer and working backward
    until you have the minimum set of technology requirements to reach your goals.'
  merge: -1
  img_proc: true
- pgno: 94
  md: 'The working backward product definition process sets the basis for what is
    going to be built. It typically has four steps, as outlined here:


    +   1. Writing a press release that describes everything about the product: why
    it''s important for you, what it does, what changes it will bring to your life,
    and why it exists. What are the features and benefits of this product and which
    problem in your life does it suggest a solution for? A press release is expected
    to be straightforward and crisp. A press release determines how people outside
    of the organization will see the product.

    +   2. Writing **frequently asked questions (FAQs)** that include queries people
    may have in their minds regarding the product after reading the press release.
    Add questions that define what the product is good for. Put yourself in the shoes
    of someone who is thinking about using the product or is already using it, and
    consider all the questions you would have as a customer.

    +   3. Defining the mighty customer experience. Jot down the customer experience
    based on different points of view a customer might have about the product. For
    products with a **user interface** (UI), build mock-ups of each screen that the
    customer uses. For web services, write use cases describing ways people could
    use the product. In a nutshell, tell stories of how the product solved issues
    that the customer had.

    +   4. Writing the user manual. Guideline step-by-step instructions about how
    the customer will use the product. Answer the *How to* and then tell the customer
    everything they need to know to use the product. If the product is to have different
    types of users, write a different manual for each type.


    By the end of this exercise, the team will be much clearer about what they are
    planning to build. The set of information in these documents will be readily available
    to smoothen the process. At this point, the whole team will have a shared vision
    of the product you are going to build.


    AWS keeps modifying the framework based on customer feedback. A while ago, they
