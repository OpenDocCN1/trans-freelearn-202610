- pgno: 252
  md: '# Setting up the Architecture Board


    The CIO (or another senior executive) is often the executive sponsor of the initial
    architecture effort in most companies. Sponsoring bodies have more influence,
    however, when it comes to garnering corporate support. An Architecture Board is
    the sponsoring body here, but the title isn’t important. The strategic architecture
    and all of its sub-architectures are reviewed and maintained by this executive-level
    group.


    # Triggers


    Typically, an Architecture Board is established in response to one or more of
    the following:


    +   - The new CIO

    +   - Acquisitions or mergers

    +   - Considering switching to a more advanced form of computing

    +   - Recognizing the lack of alignment of IT with the business

    +   - Technology as a means of achieving a competitive advantage

    +   - Implementation of the EA program

    +   - Rapid growth or significant business changes

    +   - Cross-functional requirements for complex solutions


    Within the enterprise, the Architecture Board sponsors the architecture, but the
    Architecture Board itself requires an executive sponsor at the highest levels
    of the corporation. Architecture projects must be committed to during the planning
    process and through maintenance. In some companies, architecture planning fails
    because executive participation and encouragement are lacking.


    In many cases, the Board of Directors of a company is overlooked as a potential
    source of Architecture Board members. Such individuals are often knowledgeable
    about a business’s operations and competitors. They are an important part of validating
    the alignment of IT strategies to business objectives since they influence the
    business vision and objectives.


    # Size of the Architecture Board


    We recommend that an Architecture Board includes four to five permanent members
    (10 at the most). It may be possible for the Architecture Board to rotate its
    membership over time, with decision-making privileges and responsibilities transferring
    from one senior manager to another, to keep the Architecture Board to a reasonable
    size. Some members of the Architecture Board may find that time constraints prevent
    them from participating actively for a prolonged period.'
  merge: -1
  img_proc: true
- pgno: 253
  md: 'The Architecture Board must, however, maintain continuity to prevent the corporate
    architecture from diverging from one idea to the next. Rotation can be ensured
    by setting a term for each member and having the term expire at different times.
    An Architecture Board may need to be re-chartered during the ongoing architecture
    effort following the initial effort. If needed, the architecture compliance review
    process is updated or changed by the executive sponsor after reviewing the work
    of the Architecture Board.


    # Board structure


    A generic organizational framework provided by the TOGAF Architecture Governance
    Framework positions the Architecture Board in the context of the broader enterprise
    governance structure. In addition to identifying the major organizational groups
    and responsibilities, it also outlines their relationships with each other. Adaptations
    of this model may be necessary, depending on the structure and form of the organization.


    Taking into account the size and form of the organization, as well as the IT function
    implementation, is essential. By taking the overall governance environment into
    account, you can form the basis of designing the Architecture Board structure.
    An important concept to consider is worldwide ownership and local implementation,
    and the integration of new technologies and concepts from various areas.


    As an organization, the Architecture Board should be structured according to its
    structure. There may be more complex architecture governance structures needed
    than the TOGAF Architecture Governance Framework outlines. An organization would
    need to put an IT governance process in place that combines the corporate structure
    and capabilities already in place. It typically includes a global governance board,
    local governance board, design authorities, and working parties.


    # Operation of the Architecture Board


    In this section, we will describe the Architecture Board primarily from the perspective
    of governance.


    # General


    Meetings regarding the Architecture Board need to have clear objectives, topics,
    and actions. The **Control Objectives for Information and Related Technologies
    (COBIT)** framework, as an example, explains best practices for board meetings.
    During these meetings, key decisions will be made regarding the following:


    +   - Producing quality governance materials and activities

    +   - Providing a formal mechanism for acceptance through consensus and authorization

    +   - Implementing a control mechanism that ensures the architectures are implemented
    successfully'
  merge: -1
  img_proc: true
- pgno: 254
  md: '+   - Linking architecture implementations with organizational strategy and
    objectives (business and IT) and maintaining this link

    +   - Dispensations or policy updates may be needed to realign with the contract
    in the event of divergence from it


    Moreover, the agenda of a meeting regarding the Architecture Board contains clearly
    defined topics and the required actions.


    # Preparation


    Each participant should be familiar with the contents of the agenda and all supporting
    paperwork, such as dispensation requests, performance management reports, and
    more. Individuals who have assigned actions are responsible for reporting on progress
    against those actions. Attendance and availability at Architecture Board meetings
    must be confirmed by each individual.


    # Agenda


    Agendas for Architecture Board meetings are outlined in this section. The items
    on the agenda are all described based on their contents.


    # Minutes of the previous meetings


    The minutes of previous Architecture Board meetings are a standard organizational
    protocol that provides details about past meetings.


    # Requests for change


    Change requests under this heading typically relate to architecture and principle
    amendments. The business control may also include blocking voice traffic to premium
    members, such as weather reports, and controlling access to certain websites.
    The Architecture Contract defines authority levels and parameters within which
    changes can be requested.


    # Dispensations


    As a mechanism for requesting changes to existing contracts, principles, and structures,
    dispensations are used. The agency also operates outside of normal operating parameters,
    such as having a subsidiary excluded from service provisioning, requesting unusual
    service levels for special business reasons, or deploying non-standard technology
    or products to support specific business initiatives.


    Dispensations are granted for a set period and must comply with certain operational
    criteria and a set of identified services. Compensations are not granted indefinitely
    but serve as an alternative way of ensuring that levels of service are met, as
    well as allowing for flexibility in the implementation and timing of payments.
    Time-bound dispensations will trigger architecture compliance because of their
    time-bound nature.'
  merge: -1
  img_proc: true
- pgno: 255
  md: '# Compliance assessments


    The organization assesses compliance against **service-level agreements (SLAs)**,
    **operational-level agreements (OLAs)**, and the required architecture refreshes.
    Based on the criteria specified in the TOGAF Architecture Governance Framework,
    the assessments will either be accepted or rejected. Assessment reports will contain
    detailed information about the architecture.


    # Dispute resolution


    In the Architectural Compliance assessments and dispensation, disputes that have
    not been resolved through Architecture Compliance and dispensation processes are
    documented.


    # Architecture strategy and direction documentation


    Only the global Architecture Board will formulate the architecture strategies,
    directions, and priorities. Standard architectural documentation should be produced.


    # Actions assigned


    An overview of actions assigned at previous Architecture Board meetings is provided
    in this report. During Architecture Board meetings, actions are assigned to a
    tracker, which is used to keep tabs on their status and document how they are
    progressing:


    +   - Reference

    +   - Priority

    +   - Action description

    +   - Action owner

    +   - Action details

    +   - Date raised

    +   - Due date

    +   - Status

    +   - Type

    +   - Resolution date


    # Contract documentation management


    The architecture documentation is formally accepted here for subsequent publication,
    updated, and changed.'
  merge: -1
