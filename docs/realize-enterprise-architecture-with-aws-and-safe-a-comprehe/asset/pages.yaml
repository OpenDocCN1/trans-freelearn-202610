- pgno: 47
  md: 'Business design influences business strategy. That’s why it’s important to
    take a clear stand on responsibilities and accountability and enable teams to
    engage in cross-communication to ensure smooth and effective processes.


    # Three principles for organizational redesign


    Three organizational design principles can be applied to ease the process of establishing
    an EA approach, support seamless implementation, and promote the achievement of
    maximum positive outcomes.


    The following sections describe the three principles of organizational redesign.


    # *Principle 1 – componentization – designating clear responsibilities and accountability*


    In light of today’s fast-paced technological advancements, every organization
    must be continually upgrading and revising the EA program. This is achieved by
    breaking down multiple elements of an organization into different components.
    For example, an organization might choose to focus particular attention on products,
    customer experience, and core enterprise processes.


    It’s critical to designate clear responsibilities and accountabilities among those
    groups. An organization’s ability to adapt to a given change is directly related
    to how well the EA team can map a quick and effective redesign of the EA process
    to incorporate the change.


    For example, typically, payment processing is built into many different products
    within a single organization. The resulting dependencies require building technology
    capabilities that transform payment processing into reusable methodologies. Payment
    processing is a good example of the kind of system that can be updated easily
    to incorporate modern advancements, which results in meeting or exceeding customer
    needs with minimum effort. Such an infrastructure might apply componentization
    (*breaking software down into identifiable pieces*) to leverage data strategically,
    and can drive additional opportunities for innovation.


    In the past, EA meant redesigning whole systems, strategies, and operational processes.
    IT specialists and enterprise architects helped management to set goals and map
    business processes. However, this approach is now obsolete, as it does not support
    componentization. Each new component that arises from the EA process adds value
    when it is implemented, and an incremental approach ensures steady, reliable progress
    toward organizational goals.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# Principle 2 – functional diversity – ensure team members reflect a wide range
    of perspectives


    At this stage, the role of leadership defines the overall business strategy. Leaders
    must assemble productive teams and provide skill-developing sessions that help
    each member set realistic individual performance goals that map appropriately
    to ensure the team, as a whole, will achieve the company’s goals. Along the same
    lines, one of the most important aspects of embracing people, process, and technology
    opportunities is to empower cross-functional teams along with their clear responsibilities
    and accountability measures.


    This approach might seem like a drastic and sudden shift from the traditional
    way of dealing with management matters, and initially, that might upset the smooth
    flow of operations. To mitigate the negative effects of such circumstances, leaders
    must allocate appropriate processes and technology within each component. Every
    individual on each team must feel empowered to speak up and be supported by leadership
    when it comes to processes and technology related to their functional areas of
    the business.


    Research shows that diverse teams perform better than homogenous teams. From data
    scientists and software engineers to lawyers and finance experts, every team member
    must bring unique skill sets. Diverse talent means more than cultural diversity;
    it can include worldview, educational background, family responsibility, neurodiversity,
    and more.


    Each member should stand out with diverse capabilities to boost creativity and
    ensure better critical thinking. Functional skills, such as product expertise,
    development capabilities, and user design experience, add great value to the team,
    too. When a diverse team of experts comes together to ensure excellent cross-functional
    operations within an organization, a maximum outcome is virtually guaranteed by
    the EA.


    # Principle 3 – user focus – creating a culture of continuous feedback and redesign


    EA can have a significant positive influence on the overall operational strategy
    of the organization. When teams are equipped with the right kind of information,
    resources, and technological capabilities, innovation and growth make their way
    into the company. Leaders play a major role in shuffling the existing teams or
    creating new ones to make the most out of their opportunities.


    In setting the foundation for EA, it’s imperative to identify new investments
    based on end user behavior and feedback. A redesign of the strategy is made possible
    based on the objectives and goals leveraging digital technologies, which advance
    quickly and may offer capabilities that were previously not possible.


    For example, the music-streaming, audio-streaming, and media services provider
    service Spotify took an unconventional step, given its own opportunity in the
    marketplace. Its leadership team decided to bet on employees by investing in teams
    rather than focusing their approach strictly on strategic initiatives.'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'Spotify embraced a people-driven, autonomous approach for scaling the agile
    methodology that emphasized the importance of culture and network. This approach
    helped the company increase innovation and productivity by providing team members
    with autonomy, communication, and accountability.


    The results far exceeded their expectations, and even those of industry analysts,
    and today, the company is an industry leader in entertainment.


    # Identifying the need for a foundation for execution


    Every company needs an efficient operational system from top to bottom, and EA
    must set the foundation for execution. For some organizations, the need is critically
    time-sensitive, while others are less pressed and can take things slow to plan
    for a smooth transition.


    Let’s dive into some of the risks that leaders must take, the reasons behind them,
    and metrics to assess the key factors in those situations. We will explore how
    to recognize the need to take quick and effective steps that will allow continued
    work on the foundation for execution.


    Here are nine risks to EA to avoid, identify, and resolve.


    # Risk 1 – single customer queries elicit different answers


    Think like a customer and imagine how frustrated you would be if individuals and
    departments gave you different answers to the same question. The same is true
    with EA. When an organization doesn’t have the infrastructure to share accurate
    information across functional areas, the result can be extremely damaging.


    The need for a foundation of execution is absolutely urgent if customer-related
    matters that should have been done in one project cycle are being attempted again
    and again. The higher the percentage of employees’ total time spent on rework,
    the greater the need for action.


    # Risk 2 – new regulations require a major effort


    The organization must comply with ever-evolving government regulations. Companies
    listed on the New York Stock Exchange underwent major processing and operational
    strategy upgrades in response to the Sarbanes-Oxley Act of 2002 (https://thehill.com/blogs/congress-blog/technology/531781-why-a-sarbanes-oxley-update-is-needed-to-protect-our-financial/),
    a US law that mandates financial reporting and record-keeping practices for corporations.


    The legislation was a trigger for many companies to implement the foundation for
    execution to streamline financial management. In 2005, large companies spent 15%
    of their IT budget on measures related to Sarbanes-Oxley compliance.'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'The cost of regulatory compliance can be reduced with an EA foundation for
    execution by creating a capability to access data on a recurring basis. A company
    is in urgent need of action if more than 15% of its IT budget has been allocated
    to fulfill regulations.


    # Risk 3 – agility challenges and unprofitable growth initiatives


    The operational processes within an organization have a certain workflow that
    is difficult to change after a merger. Developing new capabilities might take
    longer than expected when the team cannot leverage an existing business strategy.


    Using an outdated system instead of digitizing the infrastructure delays profitable
    outcomes. So, if an organization applies existing capabilities for a new strategic
    initiative and those initiatives are profitable, there’s no urgent need for action.


    # Risk 4 – IT is consistently a bottleneck


    Usually, companies follow the traditional method of implementing IT processes
    that are carried out through a two-step exercise:


    +   1. Communicating a business strategy

    +   2. Building the IT infrastructure accordingly


    In such environments, IT is a point of congestion, rather than a strategic asset,
    and the implementation of a new system to facilitate a strategic initiative can
    take up to 2 years. By that time, there would be dozens of new innovations within
    the same industry. Therefore, tasking IT with the entire EA initiative will, almost
    certainly, lead to unnecessary delays in implementation and challenges in keeping
    up with the modernization of IT infrastructure happening both within and outside
    the organization.


    Transportation and logistics company UPS creates new customer service updates
    using information and feedback from current stakeholders to ensure added value
    every 90 days. The need for urgent action in an organization is crucial if it
    takes longer than 12 months for projects to deliver in an efficient manner.


    # Risk 5 – different platforms for the same task


    Would you pay for 20 different platforms that perform the same function, or work
    toward enhancing the capabilities of a single platform that integrates with every
    other system? The latter approach is more realistic and practical, so it’s clearly
    the right way to proceed.


    Yet, there are hundreds of companies that operate on multiple order-entry systems,
    and still, others have more than 30 different ways to pay customer benefits. Not
    only are the operational costs huge in these situations, but the time and effort
    that goes into keeping these platforms going are not worth the outcome.'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'The high cost of redundant systems and the risk of inaccurate data for compliance
    regulation and reporting lead to damaging outcomes. The desire for a variety of
    systems simply doesn''t justify the expense that follows. So, if an organization
    is running multiple platforms to execute the same task, it doesn''t add value.
    In fact, it will undermine the foundation for execution, and at some point, there
    will be an urgent need for action.


    # Risk 6 – critical information for decision-making is unavailable


    No matter how big your warehouse is, or how extensive and comprehensive your data
    management system is, unless they are effective, they are useless. There are companies
    that have developed million-dollar software to streamline their everyday business
    affairs, but either the right information is unavailable or the facts and figures
    are not accurate.


    The role of the EA decision-maker is extremely important here, along with a strong
    foundation for execution. They can use the right data to make the appropriate
    decisions while leveraging standardized processes. Your case for action is urgent
    if the decision-makers within your organization are unable to make effective choices
    on the same set of data every day.


    # Risk 7 – employees move data from one system to another


    When a company pays a fortune to set up hardware and software to ensure maximum
    efficiency, what''s the point of it if employees are manually moving data between
    systems? After all, this is why organizations spend millions of dollars on technology
    and software.


    Above all, in such cases, the risk of error is extremely high, and employees’
    valuable time is wasted. Most leading companies have transitioned to artificial
    intelligence (AI), Internet of Things (IoT), and robotic process automation (RPA)
    systems that require little to no human interaction. These systems perform security
    measures, data compiling, storing and analyzing, inventory management, centralizing
    the whole purchasing process, and more.


    As an example, Hewlett-Packard printers can reorder cartridges automatically when
    the toner runs low. That process is IoT, and it doesn’t require human intervention
    at any level. Most digital-forward companies execute half of their sales electronically.
    An organization can compare its processing with the existing percentage to see
    whether its system might require action.


    # Risk 8 – senior management dreads discussing IT agenda items


    Almost all large, multi-department organizations have committees that look into
    issues related to their assigned area (e.g., finance, resource allocation, IT,
    hardware, and hiring).


    Risks can be spotted here when only the senior executive committee deals with
    IT governance, setting the foundation for principles and investment priorities.
    The problem here is a lack of understanding and interest among executives regarding
    IT matters. When this risk is in play, these meetings might appear to be boring
    to these leaders, and/or they might not understand the IT needs of an organization.
    Growth initiatives are at risk when these problems are present in an organization.'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'On the other hand, companies with effective CIOs who exhibit a dedicated commitment
    to these agendas thrive because they are focused on strategic matters. An organization
    is in urgent need of action when the senior committee responsible for IT-related
    decision-making is ineffective.


    # Risk 9 – uncertainty about positive outcomes from IT investments


    If you have to think about whether or not IT is offering good value, it''s likely
    the answer is no. While investing money, effort, and valuable resources in a project,
    leaders must make sure to set measurable goals. By the end of a quarter or a year,
    if they are unable to measure the outcome, the whole effort may have been a waste.


    It is important to devote attention to ongoing projects to ensure they are on
    track and are delivering positive outcomes and value for the business. Part of
    that effort to recognize value is being aware of all internal matters related
    to IT and finance.


    To cater to the previously mentioned risks and smooth flow of processes, clarity
    of the requirements and the consistent analysis of the results of architecture
    initiatives help ensure strategic value from IT. A company where senior-level
    management can describe the EA is in safe hands. However, an ineffective core
    foundation can lead to devastating consequences. In such circumstances, EA plays
    a major role in acting as a bridge between business groups. An organizational
    redesign could be an option, but a few principles should be considered, as mentioned
    previously. Before becoming invested in infrastructure, setting measurable goals
    and working toward them can generate a huge positive impact.


    # Complex business agility and IT value realization


    The need for business agility can never be overestimated, as agility makes it
    possible to respond to any type of enterprise change as quickly as it happens.
    Being able to adapt to market changes by opting for modern technology sets the
    right foundation for an agile organizational process.


    For some, this process can be slow and steady; however, other organizations believe
    in rapid transition. This adaptation is facilitated by modern tools and digital
    solutions that help decision-makers take the right steps. The accurate and readily
    available data is reported and analyzed so that it can be leveraged for the business
    agility process.


    Digitally mature companies are 23% more profitable than their less mature peers.
    Depending on the size of an organization, the ratio between the extent of digital
    transformation and the outcome could vary.'
  merge: -1
  img_proc: true
