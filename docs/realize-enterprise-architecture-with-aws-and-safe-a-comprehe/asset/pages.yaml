    # Applying SAFe to EA and the cloud


    A business architecture lays out how a company will function. In a similar way
    to an IT architect, who determines how systems, data, integrations, and resources
    should be utilized to support an IT organization, business architecture defines
    what the organization does as well as how the business provides value, what information
    is needed to conduct business, and what organizations are involved. You will also
    find information about how the business does its work.


    Enterprises can embark on a transformation of their people, processes, and technology
    by implementing a scaled agile framework (SAFe: https://scaledagileframework.com/)
    across the entire enterprise, going all-in with Amazon Web Services (AWS) (https://press.aboutamazon.com/news-releases/news-release-details/cox-automotive-goes-all-aws),
    and evolving to a you build it, you run it environment. Companies can build small
    teams that use scrum, kanban, or other agile methodologies, and teams can be typically
    8–10 people in size to drive ownership and autonomy, very similar to Amazon''s
    two-pizza teams. Implementing a coordinated delivery, operations, and technology
    strategy allows companies to unify IT and the business by creating a team of product,
    engineering, architecture, and business leaders at the upper levels of SAFe, resulting
    in a more transparent and collaborative environment. This model provides connectivity
    of priorities and gives teams the context as they look to solve customer problems.'
