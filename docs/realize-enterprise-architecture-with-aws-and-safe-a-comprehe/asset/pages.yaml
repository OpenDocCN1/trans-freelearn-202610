    Here''s a list of the full set of pillars:


    +   - **Security**: Protection of assets through risk assessments and mitigation
    strategies while maintaining delivery of business value.

    +   - **Reliability**: The system should be able to recover from service failures.
    In situations such as these, it should dynamically acquire computing resources
    to continue meeting demands and mitigate disruptions.

    +   - **Performance efficiency**: Use resources in an efficient way to meet system
    requirements. Technologies must evolve with changing needs.'
  merge: -1
