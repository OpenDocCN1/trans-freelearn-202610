    # Architecture for DevOps


    While DevOps is viewed as a framework for building computing systems, it is not
    an architecture reference in modern computing. Rather than a specific technique
    or methodology, DevOps is a philosophy that focuses on teamwork, communication,
    and constantly improving the software. It will ultimately lead to producing better
    software as efficiently and quickly as possible. DevOps encourages an entire organization
    to participate in improving their software applications routinely and incrementally.


    Agile is also influenced by DevOps. However, the newly developed approach is an
    improvement over both agile and waterfall development. This is because it requires
    developers to complete entire projects before handing them over to operations
    for testing in production. There used to be silos between developers and operations
    specialists. In order to run the code in production, developers write them while
    operators run the code as system administrators. Even so, due to breakdowns in
    communication and inadequate collaboration, things that are supposed to be easy
    can turn out to be challenging – the communication of customer requests to developers
    and the provision of clean code to operational personnel, for example.


    # Build


    The total cost of the resources used to fulfill the operations was calculated
    based on estimates for fixed hardware allocation when DevOps was not utilized.
    Individual usage requirements were defined in the business strategy to make things
    flow smoothly. A key feature of DevOps is the use of the cloud as well as the
    sharing of resources. Builds can be controlled by users to ensure resources are
    utilized appropriately.'
