  img_proc: true
- pgno: 245
  md: 'The role of enterprise architects today includes doing the following:


    +   - Often, organizations work in silos and lack an overall view as a result
    of organizational silos. They must bring a strategic vision to these organizations.

    +   - Participate in business discussions to refine its needs, giving examples
    of how a business capability should evolve over the next 3 years, or whether the
    company is capable of addressing new customer segments.

    +   - Contribute to a better IT roadmap that improves business effectiveness and
    efficiency while planning future IT investments in the enterprise.


    # As a technology trendspotter


    Investing heavily in emerging technologies is one of the key indicators of a company’s
    competitiveness. In 2017, Forrester surveyed 105 international technology executives
    online. According to the survey, 86% of leading companies saw technology as the
    most influential factor in business strategy. As companies attempt to understand
    and analyze the impact of emerging and strategic technologies, enterprise architects
    play a key role. Digital business platforms are defined as a way to deliver value
    to the modern enterprise by these leaders, who take a hands-on approach.


    Trendspotters are enterprise architects since they can see market trends and potential
    value in upcoming technologies. They primarily deal with new or emerging technologies
    or those that may disrupt the market. By using the technologies that will move
    their company ahead of competitors, they help business leaders and IT teams make
    better decisions. By combining IT capabilities and business strategies, enterprise
    architects also serve as pacesetters for business transformation.


    # As an active member of agile dev teams


    In agile environments, development happens quickly, and the eleventh principle
    of the Agile Manifesto empowers agile teams to design whatever architecture is
    needed. It is known as *emergent design* in the SAFe framework. In addition, some
    development teams do not have an understanding of organizational business objectives,
    technical standards, or other architectural projects that are in progress. Using
    architectures designed by development teams can drive reworks and affect time
    to market.


    An enterprise architect’s role as a member of an agile team includes doing the
    following:


    +   - Sharing the intentional architecture with the development teams and identifying
    its limitations. Developing teams can then assist in correcting the intentional
    architecture.

    +   - Using the SAFe framework, an *architectural runway* is created by combining
    emergent design and intentional architecture. As new epics are developed, enterprise
    architects must not only keep the architecture up to date but also support new
    epics.'
