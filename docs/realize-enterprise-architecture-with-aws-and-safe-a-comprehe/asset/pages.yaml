- pgno: 187
  md: '# Align and Scale Agile Framework with Enterprise Architecture


    Agile frameworks designed for large enterprises, such as SAFe, help companies
    apply lean and agile principles. Adaptive design and engineering practices are
    key components of enterprise architecture, according to SAFe. *These practices
    help teams and programs work together on a shared technical vision.* Architects
    provide strategic guidance, reference architectures, and technology standards
    to these new agile organizations. When they are combined, they facilitate the
    standardization of teams’ work. Reworks can be avoided by aligning projects to
    company standards and bridging silos.


    Your enterprise architecture is the collection of structures and processes that
    support your organization. It should be flexible, easily extended, and easily
    evolved over time. Enterprise architecture is all about exploring, identifying,
    and optimizing an organization’s architectural ecosystem. Because of this, enterprise
    architects should have the ability to work cooperatively and in a collaborative
    manner, as well as collaborate closely with other teams. With the adoption of
    SAFe by large organizations, intentional architecture, and emergent design, the
    need for a better understanding of its key elements is also growing. As enterprise
    architects interact more frequently with development teams, their roles and practices
    may change as well.


    The topics covered in this chapter are as follows:


    +   - Technology choices and usage

    +   - Architectural strategy

    +   - Exemplifying lean-agile architecture

    +   - Architecting for DevOps and release on demand

    +   - Applying SAFe to Enterprise Architecture and cloud'
  merge: -1
  img_proc: true
- pgno: 188
  md: '# Technology choices and usage


    Gartner predicts that 60 percent of organizations will rely on EA to spearhead
    business strategies for digital innovation in 2023. The use of EA in plan, design,
    and analytics is already widely adopted by businesses today. A company’s business
    portfolio can be expanded through EA, which enables IT and business to merge together.
    With EA’s data management, businesses can predict future models and, as a result,
    increase profitability while reducing costs.


    Over the past decade, the industry has developed various trends, architectures,
    languages, and tools. Because of that, there are many emerging JavaScript frameworks
    today because technology changes at such a rapid pace. It appears to be more difficult
    than ever for architects to choose a technology, whether it is a library, framework,
    programming language, or vendor product.


    It is also common for enterprises to hire consultant architects when internal
    architects cannot reach a consensus. Technical architects are needed by companies
    with many products, projects, or entire lines of business. Most of the time, making
    a decision that affects multiple teams will prove challenging. There is a risk
    that it could become highly politicized, especially when selecting vendor products.
    An enterprise may need to even issue a request for proposal (RFP) to get vendors
    to respond in such a scenario. Multiple entities provide points to be considered
    in the selection of technologies during an exhaustive selection process. A strong
    understanding of why certain decisions are made, as well as why those decisions
    will benefit the work, is crucial for architects. In the following list, several
    high-level issues are discussed. Different organizations have different definitions
    of digital transformation. However, it generally involves the following:


    +   - Evolving technology trends (i.e., cloud services)

    +   - **Artificial intelligence (AI)** and **machine learning (ML)**

    +   - Advanced analytics and big data

    +   - **Internet of things (IoT)**

    +   - **Robotic process automation (RPA)**


    Planned strategic action has always been essential to business success. As we
    move further into the digital era, it has become more critical than ever to plan
    for this transformation. By implementing transformation, organizations become
    more agile and dynamic, enabling them to respond to market changes more quickly.
    Companies can adapt to fast growth using cloud-based offerings such as **Software
    as a Service (SaaS)** and implementing AI and RPA. As most projects need to move
    at a much faster pace, digital transformation offers great help in this regard
    to the EA facilitators.'
  merge: -1
  img_proc: true
- pgno: 189
  md: 'Assigning application components to technology architecture represents the
    association of software/hardware components. Assembled and configured, they form
    the enterprise''s technological infrastructure, which is largely procured in the
    marketplace. By examining the technology architecture, you can see how individual
    application components will be realized and deployed. It is possible to study
    migration problems at an early stage that can develop between different stages
    of the Information Systems evolution path. The purpose of technology architecture
    is to solve logistical and location problems related to hardware and IS management.
    Also, a well-designed technology architecture ensures that components of the delivered
    application integrate seamlessly.


    # Adopting scaled agile in technology domains


    In development value streams, specialized teams in software, hardware, electrical,
    electronics, and other technology areas drive the development of operational value
    streams. They contribute to the definition, development, testing, and deployment
    of solutions to internal and external customers. The right products for the right
    customers are created by using customer-centricity and a design thinking approach,
    and agility provides the flexibility to address market changes and emerging opportunities
    rapidly.


    There is a long tradition of embracing agility in the software industry. In fact,
    SAFe offers practitioners the flexibility to deploy it at any level of enterprise
    scalability. Our advanced interests or value areas include behavior-driven development
    (BDD), test-driven development (TDD), agile testing, refactoring, and spikes.
    Scaled agile software architecture combines values, practices, and partnerships
    focused on supporting evolutionary design and architecture. DevOps embraces the
    philosophy of continuously updating a system''s architecture over time, while
    simultaneously supporting the needs of its users. The Big Up-Front Design (BUFD)
    and phase-gate processes entail a high amount of rework and redesign, which results
    in delays.


    Agile development practices are supported by an agile architecture that encourages
    collaboration and design simplicity. Agile architectures also enable testing,
    deploying, and releasing capabilities, just as Agile development practices do.


    # Applying SAFe to hardware


    Cyber-physical system builders will be defined by hardware innovation for the
    next decade or more, and those who don’t develop hardware quickly are at a competitive
    disadvantage. In order for developer changes to be verified, the larger context
    of the system must be taken into account. Physical parts created during hardware
    development have high material costs and long lead times. In this case, hardware
    verification often takes place later in the product development cycle.'
  merge: -1
  img_proc: true
- pgno: 190
  md: 'The first step in hardware development is to develop models using design tools
    (e.g., electrical and mechanical CAD). Virtual models are now being used by many
    organizations for analysis and simulation to provide early feedback in a bigger
    system context. Prior to manufacturing, engineers can ensure their designs are
    compatible with stakeholders and validate them with stakeholders. Physical parts
    can only be used to verify some aspects of a design.


    For early feedback, additive manufacturing and 3D printing are already widely
    used. As well as being used for production parts, they can be used for innovation
    when higher change frequencies are required and lower volume is necessary. It
    may also be possible to accelerate manufacturing times by reducing quality and
    reliability constraints. In contrast to production parts that withstand a harsh
    environment for years, development parts often operate in a controlled environment
    and are replaced after the next revision.


    A vital aspect of system design is allocating functionality to various elements.
    With the advent of over-the-air updates enabled by growing network capacities
    and costs, behavior is rapidly shifting to programmable components. Small changes
    are tested, integrated, and validated in a context before being delivered using
    continuous integration. The development of hardware functions begins with virtual
    designs. As a result of automating continuous integration activities, developers
    get faster feedback on changes in these environments. In addition to building
    the system, developers must build a continuous integration environment.


    # Balance intentionality and emergence


    In the early days of architecture, traditional approaches were followed, lots
    of documentation was generated, and unvalidated decisions were made. Combining
    intentionality and emergent design is another solution for aligning architecture
    with business needs. Developers create a system so that they can see what works
    before the architecture emerges.


    # Intentional architecture


    This defines an architectural strategy and initiative that are meant to be purposeful
    and planned. They provide guidance for synchronizing the design and implementation
    of inter-team solutions, as well as improving performance and usability.


    # Emergent design


    This implements a fully incremental and evolutionary strategy. As a system is
    built and deployed, developers and designers can respond to the needs of users
    in real time. With this balance, agile architecture can address enterprise solution
    complexity with a lean-agile approach. As well as supporting current users, the
    system has evolved to address future needs. Collectively, emergent design and
    intentionality provide the technical foundation for future productions of business
    value that continually build and extend the architectural runway.'
  merge: -1
  img_proc: true
- pgno: 191
  md: 'It is impossible for an organization''s value to flow through its functional
    silos. Most work has been structured according to functional skills. A rocket
    nozzle, for example, would have a mechanical structure that is made up of hardware,
    firmware, and software. According to the traditional method, each would be independently
    developed. In order to verify and validate, all components must be integrated
    together at the end, making adjustments very difficult. Agile development organizes
    cross-functional teams to increase collaboration and minimize delays:


    ![](img/16bfeb984938aba3d9334582c2cd6e69_191_0.png)


    Figure 7.1 – Team structure


    The acronyms in the preceding image are as follows:


    +   - HW – Hardware

    +   - SW – Software

    +   - FW – Firmware

    +   - ART – Agile Release Train


    Three equally viable approaches are shown in the preceding figure, as well as
    the circumstances in which they are most useful. A creative environment may not
    require the collaboration of an entire team, and the domains may work independently.
    However, the teams are aligned by working together as part of the same ART and
    by managing dependencies and implementing SAFe practices to integrate frequently.
    Predictability is higher in other environments. Using a common roadmap that defines
    key integration points, the teams can work independently on their system components.
    These teams are not necessarily on the same assembly reference template, and the
    organization may evolve over time. Nonetheless, early product development requires
    more comprehensive feedback.'
  merge: -1
  img_proc: true
- pgno: 192
  md: 'Agile teams utilize cross-functional skills to maximize value at every iteration.
    Mechanical engineers can update firmware, or software engineers can modify CAD
    designs and rerun analysis tests. Deep functional skills are unfortunately not
    rewarded in many organizations. By using Agile methods, the skills required to
    build innovative products are broadened while not sacrificing expertise.


    # Architectural strategy


    Enterprise architecture involves configuring computing resources to serve a company''s
    business objectives. Aligning the company''s strategic goals with its existing
    business processes, the data and information it generates, and the supporting
    infrastructure are key components of the success of this process. By producing
    such a report, a company''s current technology is noted, along with how future
    technologies will change or fit into the current technology.


    In most cases, business changes are also technology changes in the age of digital
    transformation. Enterprise architects are also finding that the strategy and change
    planning process itself has a lot to gain from the enterprise architect''s toolbox.
    A key role in the development of strategy and execution of those initiatives can
    be played by the enterprise architect''s capability to build models and use those
    models to generate actionable insights. Even though conventional planning processes
    do not include those models, they force much greater levels of communication than
    conventional processes.


    It’s imperative for EAs to understand the source of their value if they are fortunate
    enough to be selected as a planner. Therefore, you should work in conjunction
    with the business strategy teams and the Project Management Office (PMO) teams
    rather than competing with them. Turning an idea into a comprehensive EA strategy
    takes time and a lot of conversations. As technology progresses and priorities
    change, the journey of the EA will evolve and mature over time.


    # Solutions architecture strategy


    It is important for each new IT project to have a solution architecture that enables
    the business to implement technical solutions in line with its IT strategy, focusing
    on a specific set of business needs. Solution architects conceptualize the ideal
    solution based on a particular problem while considering all functional and non-functional
    requirements. Organizing and managing technical teams can be improved by establishing
    clear guidelines. Solution architects play a crucial role not only in collaboration
    with development teams but also in the broader enterprise. The EA transforms strategic
    visions into actionable solutions, so working with them is vital:


    +   - Solution and EA focus on different tasks, regardless of their interdependence
    and ultimate goal – that is, to create more value for a business through the intelligent
    use of technology. EA, as its name implies, presents a comprehensive view of the
    enterprise, including all business entities and their relationships with technology
    and applications. Applications life cycles and the definition of IT strategies
    are key concerns for EA.'
  merge: -1
  img_proc: true
- pgno: 193
  md: '+   - In addition to minimizing costs, eliminating redundant technology, and
    managing the impact of a digital redesign, these strategies are designed to reduce
    risks as well. For a target architecture to be successful, it must be understood
    at the level of an entire organization. A company''s EAs must keep an in-depth
    view of the organization, so their attention to detail is rather limited. The
    technical side of IT infrastructure is thus less significant to them.

    +   - The EA usually handles technical questions, but the solution architect performs
    specific tasks as well. Neither of them is directly responsible for implementing
    new IT solutions. Their role is to ensure that the technical architects can properly
    implement them. Both solution architects and EAs share similar responsibilities.
    In contrast to EA, solution architecture focuses on detailed designs.

    +   - Technical architects and EAs work together in synergy to create a successful
    enterprise vision. In order to maximize a company''s ability to generate value
    through its use of technology, these two elements are essential. Despite the fact
    that enterprise and solution architects have overlapping responsibilities, their
    functions differ, and they rely on each other.


    Basically, EAs develop abstract strategies that are later taken over by solution
    architects to be turned into actual solutions.


    # Infrastructure strategy


    In the architecture field, infrastructure is a term that people use to describe
    a wide variety of things. Infrastructure architecture is a defining concept for
    facilitating boundaryless communication across an enterprise''s scope. The content
    of e-services will expand with the progress toward e-service aggregation.


    A thorough and strategic EA review is vital to the success of any system on the
    roadmap for core systems. Ideally, a well-designed enterprise infrastructure strategy
    will outline the key systems to achieve the company''s business objectives and
    determine its success. Without careful consideration of the reality, you can get
    swept up in the possibilities of what could be built. Most IT and infrastructure
    strategies have what is called the ivory tower approach – when the EA introduces
    everything they add to the architecture review. From a practical standpoint, it
    fails to emphasize everything that teams should do. Enterprises reviewing systems
    for critical path applications benefit greatly from taking a far more pragmatic
    approach.


    Additionally, infrastructure applications may include data that is common or shared.
    Business architecture also includes elements that are common across organizations,
    such as business principles, common business processes, and so on. TOGAF''s Architecture
    Development Method (ADM) is meant to address architecture domains that are orthogonal
    to infrastructure architecture. Infrastructure architecture is not explicitly
    identified in the ADM description. Still, such a setup is perfectly viable with
    the ADM. Here is a brief overview of how the ADM was used to create an infrastructure
    architecture.'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# Implementation strategy


    In order to achieve the business goals and objectives set by the EA program, the
    architectures created and maintained by the program must be implemented. Regardless
    of whether the solution is being purchased or internally developed, these architectures
    will be an invaluable tool for implementation teams. Both the business and technical
    components are involved in the implementation, and the architecture acts as a
    guideline to ensure that the implementations align with enterprise-wide initiatives.
    In addition to formal guidance, regular meetings through the PMO will likely be
    a regular part of the process.


    A centralized repository for architecture and implementation models enables traceability
    between the two disciplines. It makes EA ideally positioned to provide guidance
    and governance. There can be an application of principles at an implementation
    level, demonstrating the importance and applicability of the principle. To implement
    the target architecture aligned with the plans and schedules defined in these
    offices, the architecture program must work closely with the project management
    offices. In addition to the oversight of implementation projects, the architectural
    office coordinates plans with the PM offices to schedule and carry out their architectures.


    Executive support is essential for a successful EA program. In order to do so,
    they must understand the strategic importance of the project. A program like this
    can provide a lot of value to an organization. EA must have access to all divisions
    and the entire organization if these programs are to be effective. Creating and
    managing EAs can be done using an architecture framework. The architecture repository
    stores the content, and the architectural team is organized, including guidance
    on creating architectural design and governance over the construction.


    EA is a powerful platform that provides all the features necessary for creating
    and managing architectural frameworks. A repository for architectural content
    is incorporated into EA and used to store architectures at multiple levels across
    the business domains. As a tool with powerful features designed by practitioners,
    it provides executives, managers, and operations managers with content and views
    they will appreciate. As a result, EAs can imbed content from a variety of sources,
    allowing architects to reuse content from other tools.


    Architectures are developed according to a process or method. Many frameworks
    do not provide a predefined process. Organizations are responsible for creating
    and configuring their own processes. Through EA, processes can be specified at
    any level; hence, more granular aspects of the process are discussed. Input and
    output critical to architecture are stored in the architecture repository. Architectures,
    their components, standards, references, principles, governance registers, and
    so on are included in this activity. EA is a fully featured architecture repository
    regardless of the Architecture framework that is being used. Its powerful features
    offer a number of options for creating a program efficiently, importing content,
    defining viewpoints, generating publications, and so on.'
  merge: -1
  img_proc: true
- pgno: 195
  md: '# Common challenges when establishing an EA strategy


    Creating an EA strategy comes with a variety of risks and challenges. Technology
    changes so fast that even entire methodologies, systems, and applications can
    become obsolete in a short period of time due to how quickly technology develops.
    In combination with a tendency to follow the latest trends, the EA model is particularly
    prone to becoming outdated. This is especially true when a standard version is
    in place.


    The EAs in this situation are constantly playing catch-up, and the strategy never
    delivers its full benefits. It is not uncommon for architects to be considered
    people out of touch with reality, as business teams often are. Developers are
    often not convinced that documentation is necessary. EA plays a critical role
    in achieving both short- and long-term business goals, so technology executives
    must continually promote its strategic importance. Furthermore, ensuring that
    documentation is operationally accountable is key.


    # Operationalizing the EA strategy


    As a company grows, its EA strategy must translate business vision and strategy
    into effective business changes. To achieve this goal, we need to develop, communicate,
    and improve the primary requirements and the strategies that are set out for the
    enterprise''s evolution. During the process of strategic planning, an organization
    defines its strategy, or direction, and then decides how to allocate capital and
    people to pursue that strategy. In order to accomplish goals, EA planning must
    be linked to strategic planning. Without strategic planning, neither will be successful.
    By using roadmaps, business architecture strategies address any barriers that
    are in the way of achieving the desired state. To implement any transformational
    change at any level of your organization, you need an EA strategy and business
    architecture strategy.


    # Exemplifying lean-agile architecture


    Business needs and opportunities require architecture to evolve. The technology-centric
    approach to business execution otherwise becomes a bottleneck. As a result of
    changing business strategies, modified strategic themes are translated into new
    solutions and value streams. This process is supported by EAs who provide input
    and set expectations on technical feasibility. Architects collaborate with solution
    and systems architects to meet the new business goals once the new direction is
    decided. The updated strategy outlines how vision, intent, and roadmaps are changed.
    Additionally, EAs ensure that solutions and values streams align across the portfolio.
    Their role is to provide long-term guidance for the development of the portfolio
    solutions set''s technologies and platforms. To ensure that the large shifts in
    technology remain aligned with business strategy, they often function as epic
    owners for portfolio-level enablers.'
  merge: -1
  img_proc: true
- pgno: 196
  md: 'An agile architecture supports cooperative, active design and evolution of
    a system with a set of practices, values, and collaborations. As a result of this
    approach, a system''s architecture can evolve continuously over time while meeting
    current requirements, embracing the DevOps mindset. Phase-gate processes and BUFD
    avoid the overhead, delays, and large-scale redesign associated with start-stop-start
    methodologies. In agile architecture, the design process is collaborative, emergent,
    and intentional, and design is streamlined. Design for testability, deployability,
    and release ability is an integral part of agile architecture, much like agile
    development practices. Decentralized innovation, rapid prototyping, and domain
    modeling accompany this principle.


    Architecture influences the organization''s ability to meet its objectives through
    frequent, independent releases. The architecture is optimized to enable a seamless
    end-to-end value stream by agile architects. Consequently, the company can continuously
    deliver value within the shortest possible time frame. The agile architect is
    motivated to ensure that the architectural runway is just enough to support a
    growing business. Legacy modernization initiatives are continually developed and
    know where to refactor to get rid of bottlenecks. Business requirements are clearly
    communicated through these initiatives.


    # Balance intentionality and emergence


    Early architecture was heavily influenced by traditional architectural approaches.
    As a result, there was a significant amount of documentation and unsubstantiated
    decisions. In order to design architecture that is aligned with the business needs,
    architecture is created as developers experiment with the system. A balanced approach
    to agile architecture is as follows.


    # Intentional architecture


    The architect defines the strategy and initiatives that are to be implemented
    in a planned, purposeful manner. They are instrumental in optimizing performance,
    usability, and design. Also provided are guidelines for synchronizing team designs
    and implementations.


    # Emergent design


    Contains all of the technical bases for an evolutionary and incremental implementation
    approach. As systems are built and deployed, designers and developers are able
    to respond to immediate user needs. Agile architecture addresses the complexity
    of building enterprise solutions with a lean-agile approach, combining these two
    approaches. As a result, the system meets both current and future user needs with
    ease. Combined, emergent design and intentionality build the architectural runway,
    enabling future business value to be created.


    SAFe, for example, provides a scalable agile framework for applying lean and agile
    principles to large organizations. EA is an element in SAFe that fosters adaptive
    design and engineering practices, as well as driving programs to rally around
    shared visions. It is the EA''s job to provide technology standards, recommendations,
    and strategic guidance to ensure standardized development practices. In this manner,
    reworks can be avoided that may result from mismatches with company standards,
    and silos can be broken down.'
  merge: -1
  img_proc: true
- pgno: 197
  md: 'A growing number of large organizations are embracing this framework, which
    integrates concepts such as an architectural runway, intentional architecture,
    and emergent design. The role of the EA will change to be able to communicate
    better with development teams. Further, we will look at how EA can adapt to these
    agile organizations.


    # SAFe and business architecture


    A value stream is a method for satisfying customers that are incorporated into
    the business architecture. Organizations can create products that will generate
    value for customers based on a product-centric approach. As defined by SAFe, operational
    value streams are those that provide end-user value.


    Identifying the required or missing business capabilities is determined by linking
    them to the stages of the value streams. A company’s EAs assess business capabilities
    based on their value to customers, their complexity, and their alignment with
    strategic goals. The alignment of agile development with strategic goals is also
    made possible by linking business capabilities to user stories.


    # SAFe and the architectural runway


    Architectural runways are a key component of the SAFe framework. Program increments
    are measured in the SAFe framework over 8 to 12 weeks. A runway can be extended
    by utilizing enablers in order to support future business functionalities.


    Implementing infrastructure, complying with regulations, and developing architecture
    are enablers. Ensuring that the business features developed for the next program
    increment land correctly is their responsibility. Thus, the term “runway” refers
    to the runway on which a plane lands. An EA creates enabler epics that contain
    information on the application architecture, infrastructure, and technology recommendations.
    We put them on a kanban board so that they will be implemented by the development
    teams.


    # Intentional architecture versus emergent design


    As development moves quickly, agile teams must design the architecture that will
    help them achieve their goals, according to “the best architectures, requirements,
    and designs emerging from self-organizing teams.”


    Emergent design is a result of spontaneous engineering solutions. Patterns, principles,
    and trade-offs shape the evolution of software. EAs, however, create intentional
    architectures. A high-level, plan-based architecture is intended to align cross-team
    roles. That is what a foundational enabler is. To follow the changes that occurred
    during the development process, the intentional architecture must be reconciled
    with the emergent design.'
