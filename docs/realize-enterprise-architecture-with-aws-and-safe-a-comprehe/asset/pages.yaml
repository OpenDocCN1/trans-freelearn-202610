- pgno: 140
  md: '# Identifying business objectives for your migration to the cloud


    Cloud migration strategies can only be devised once you understand why you are
    moving to the cloud. Here are some of the most common reasons companies move to
    the cloud:


    +   - To avoid maintenance costs of data centers

    +   - To have enhanced scalability

    +   - To improve resilience with higher capabilities

    +   - To enhance remote collaboration among teams


    To ensure that all team members understand the purpose of the business, it is
    also important to gain agreement on the business objectives. Identifying what
    to move to the cloud will be much easier once you understand the business rationale
    behind switching. A migration journey involves lots of decisions, including planning
    a migration strategy, choosing a CSP selecting a deployment model, and so forth.
    The only way to make the right decisions along the way is to have well-defined
    and realistic goals.


    A readiness assessment consists of four tasks. Let’s have a look at each of them.


    # Readiness assessment meeting


    An assessment of readiness begins with scheduling the meeting and inviting the
    required attendees, such as the following:


    +   - The **chief executive officer** (**CEO**)

    +   - The chief architect

    +   - The **chief information officer** (**CIO**)

    +   - The **managing director** (**MD**)

    +   - The **business unit** (**BU**) owners

    +   - IT finance

    +   - The security leader

    +   - The network leader

    +   - The application development leader

    +   - Infrastructure leader

    +   - The operations leader

    +   - The application owners'
  merge: -1
  img_proc: true
- pgno: 141
  md: 'These entities are some of the biggest stakeholders in an organization who
    contribute toward the long-term success and efficiency of teams across the board.


    # Conducting stakeholder interviews


    An hour or 2-hour-long interview with the executive team is followed by interviews
    with key stakeholders or personas. A kick-off meeting is a crucial part of the
    assessment process since it starts the entire process, and this is what you should
    aim to do:


    +   - In the kick-off meeting, determine a set of core applications that will
    be assessed over the next 2 weeks in relation to the organization’s business priorities.
    Make sure the applications are aligned with these priorities.

    +   - To create alignment and executive commitment to resource allocation, host
    a 2-day workshop where key business and technology leaders are aligned with respect
    to priorities.


    This workshop will determine the most important results that can be delivered
    through a modernization initiative. In order to achieve the defined outcomes,
    determine current capabilities, architectures, and skills. Establish a cloud management
    team, cloud business office, and cloud platform engineering team as key participants
    in the operation model.


    The workshop should be led by a modernization program manager and data specialists,
    infrastructure specialists, and modernization architects. Stakeholders decide
    upon success factors, a methodology, and typical outcomes at the end of the vision
    workshop. As a result, the organization will have a full understanding of its
    focus and commitment during the next phase.


    # Gathering information using resources


    Gather information by using an application modernization questionnaire, analyze
    the gathered information, document observations, and determine the next stages
    through the following steps:


    +   1. Identify applications that will be replatformed, refactored, and replaced,
    and create a journey guide so that everyone can understand the ecosystem. Make
    a prioritized list of workloads that should be modernized, and then create a modernization
    blueprint for those workloads.

    +   2. Make sure you meet the requirements, so before you create a blueprint,
    complete all prerequisites. Verifying the drivers of application modernization
    includes testing their effectiveness, performance, integration, and serviceability,
    and determining their application adoption path.

    +   3. Perform accurate asset alignment. To support prioritized workloads, identify
    which proposed and existing assets are needed.

    +   4. Iterations and releases need to be defined. The allocation of time for
    modernization iterations needs to be determined. Before you change production
    processes, decide which releases to perform.'
  merge: -1
  img_proc: true
- pgno: 142
  md: "+   5. Make sure your organization is ready for modernization by identifying\
    \ appropriate actions for each area. For the first few applications you’re planning\
