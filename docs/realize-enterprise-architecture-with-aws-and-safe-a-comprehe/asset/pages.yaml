- pgno: 264
  md: 'Static documentation in the traditional form of EA deliverables was difficult
    to maintain and update due to its instability. Digital EA has evolved to become
    a live repository that can be updated and maintained over time as a central point
    of truth that can lead to enterprise agility. Innovation management also plays
    a crucial role in fostering an organization’s innovation culture through digital
    EA. The focus here is on changes that are disruptive or iterative. Digital EA
    must have a well-managed innovation process for it to become a digital change
    driver.


    # Developing digital skills


    According to organizations, the development of the digital skills of employees
    is one of the most pressing issues of the current era. When organizations decide
    to implement EA, they typically just relocate their people from one area to another
    without understanding that not everyone can act and think like an architect. EA
    is social by nature, not merely an intellectual endeavor. Architectures are difficult
    to understand from a purely abstract perspective. Even though EA is not new and
    is in its nascent stage, it still brings several concepts that are difficult for
    stakeholders to comprehend. Toward achieving trust, the EA effort must be understood
    by both organizations. People will doubt the value of EA if they have become tech-savvy
    because their ability to deliver value is already limited.


    Poor communication in traditional EA today can also lead to strong resistance
    to new initiatives in an organization. The EA message must be communicated clearly
    and concisely for all stakeholders to understand and eventually expand the discussion.
    To manage the artifact life cycle and relationships among all entities within
    an organization, organizations approaching digital EA adoption should consider
    investing in digital EA tools and repositories. EA through a digital EA acknowledges
    the impact of digital transformation and strives to maintain the organization
    at the forefront of the digital era. In addition to differences in technology,
    digital teams differ fundamentally from traditional teams in terms of culture,
    practices, platforms, and domains.


    # Summary


    Business is constantly evolving, and businesses must be able to assess the impact
    of these changes on the IT landscape, as well as how these changes will impact
    their operations, customer experiences, and ability to grow. Taking a closer look
    at these issues can help improve the transformation process. Additionally, enterprise
    architects keep a streamlined and agile IT environment so that IT can run upcoming
    business transformation projects. In light of that, this chapter shed light on
    how crucial EA enablement readiness is and what steps organizations can take to
    facilitate it. Along the way, we also determined and provided a base that helps
    us understand the process and flow of establishing EA practice. Identifying owners
    and the workflow for each of the owners, along with roles and responsibilities,
    were covered in this chapter. Our primary focus remains on explaining EA modeling
    languages in more detail.


    In the next chapter, we will review and summarize all nine chapters of this book
    and provide use cases as well.'
