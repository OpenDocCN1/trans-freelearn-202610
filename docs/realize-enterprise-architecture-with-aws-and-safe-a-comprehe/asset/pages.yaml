- pgno: 205
  md: 'and compliance, NFRs are regularly tested via automated tests, just like all
    other requirements. In addition, a roadmap outlines the steps in the implementation
    of the project. Architects and teams explore technical options while building
    the architecture runway by collaboratively defining enablers in the roadmap. They
    provide insight into what they can achieve early in the process. Intentionality
    and emergence are balanced as teams implement features over the top of the architecture.
    Each ART is defined by its backlog, which consists of all the work to be done.
    Product managers and architects work together to prioritize and balance new features
    with technical work. In addition to predicting technical debt issues, they prioritize
    architectural runway needs.


    Ultimately, the solution roadmap determines the backlog items to be executed and
    the solution intent. Solution vision defines the purpose and key capabilities
    of a solution, as well as its non-functional requirements. As teams create backlogs
    and plan their work using this knowledge and the emerging roadmap, they establish
    critical milestones and releases.


    # Preparing architecture for PI planning


    The **Program Increment (PI)** planning sessions are regularly scheduled meetings
    that take place throughout the year. A shared vision and roadmap are discussed,
    and cross-team dependencies are identified for the ART.


    PI planning includes the following essential elements:


    +   - You will be required to attend two full-day events every 8 to 12 weeks (depending
    on how long your increments are)

    +   - Prioritizing the planned features in advance is the role of the product
    manager

    +   - Development teams are in charge of developing user stories and estimating
    their length

    +   - **User Experience (UX)** and engineering teams validate the planning by
    testing it in the target environment

    +   - It’s all about aligning the teams with each other and the mission

    +   - All team members should attend in person if possible

    +   - Remote participation can be made possible through technology if required


    We can never revert to the way we worked before COVID-19. It used to be standard
    practice to conduct PI planning in person. However, it is now evident that it
    may not always be feasible to group teams together. It is imperative to make sure
    that the teams who are doing the work are present during planning, instead of
    being in the same room. It is, therefore, more critical for teams to be able to
    plan in real time rather than face to face. PI planning may need to be adjusted
    in some ways: the schedule, the timing, and, of course, the technological support
    that is required to support this ceremony. SAFe users who are newly introduced
    to it should almost certainly begin by implementing PI planning. Due to its foundation,
    the **Scaled Agile Framework (SAFe)** is built upon it.'
  merge: -1
  img_proc: true
- pgno: 206
  md: 'Teams develop features and enablers as part of each increment. This list of
    near-term work items is defined and prioritized by architects in collaboration
    with product management. Through their in-depth data, current features are able
    to be outlined and sized and their acceptance criteria defined. In addition to
    the current features, enablers are defined in the backlog for these future features
    to be explored and gives knowledge, which will ensure their viability. Technical
    dependencies outside an ART are also taken into account by architects, whether
    from a solution train or the enterprise, helping to coordinate these activities.


    By collaborating with teams during PI planning, it helps reduce the number of
    discoveries and ensure teams are able to make effective decisions. The process
    of PI planning can greatly improve the efficiency of large, agile organizations.
    It is worthwhile to examine some numbers in order to better comprehend the implications.
    Depending on the size of an organization, there may be between 200 and 300 development
    teams. Prior to the change in work style, these teams would not have ever spoken
    to each other (until a critical problem forced them to share information). At
    first, the alignment would be at the leadership level, and then the information
    would be passed down by multiple levels of managers, but the team members would
    not communicate with one another. A constant competition would take place for
    the best resources, budgets, and opportunities. During this time, there have been
    a number of projects that clashed – one team would release something, but it would
    break something in another team. Most of these big businesses have never gathered
    their teams together to talk to one another on a call or in person before PI planning.
    In addition to the chance to discuss what’s being done, they get a chance to discuss
    who is working on what. This might be important in a number of situations or circumstances:


    +   - It is extremely crucial to consider how your changes will affect other teams
    when you touch a system or code repository

    +   - If you need to work on another team’s feature first or the other way round,
    you might have to do some work to facilitate their work


    Planning PI enables you to have effective communication among and across the teams.
    It puts you in a better position to see the bigger picture and has visibility
    across the board regarding a project or a task. Collaboration comes with the package
    as well. This allows teams to accomplish tasks more efficiently, deliver more
    features within less time, and stay within budget.


    # Coordinating architecture through PI planning


    A plan for the next increment is created by the teams during PI planning. As part
    of the planning agenda, the teams present the architectural briefing. While teams
    develop their plans during breakout sessions, architects manage the room to make
    sure the technical work is being planned properly. In addition, they make sure
    that the enabler work is being accounted for. Any questions or concerns can then
    be addressed. Architectural and technical issues regarding potential modifications
    are addressed by architects during the management review. Also, they participate
    in assigning value to PI objectives together with business owners. Those who support
    the use of enablers explain, in business terms, how they support the overall goals
    of their organizations and champion their importance.'
