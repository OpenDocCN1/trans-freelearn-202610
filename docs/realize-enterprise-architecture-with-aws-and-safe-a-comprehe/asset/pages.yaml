    # Governance, auditability, and change management


    The governance, auditability, and change management of an organization’s architecture
    are key factors in effective IT/business integration, tracking the outcome, and
    management of workflow, which is why they have increasingly become a board role.


    # Governance


    The purpose of this section is to shed light on IT and architecture governance
    so that business responsibilities for the activities and artifacts of architecture
    can be explained.


    # *Architecture governance characteristics*


    EA and other architectures are managed via architecture governance at an enterprise-wide
    level. It includes the following characteristics:


    +   - To ensure the effective introduction, implementation, and evolution of architectures
    across the organization, a system of controls must be implemented for overall
    architectural components and activities

    +   - Developing and implementing a system to ensure compliance with internal
    and external standards and regulations

    +   - The establishment of processes that allow the preceding processes to be
    managed effectively within agreed parameters

    +   - Establishing practices to ensure accountability both inside and outside
    the organization, in line with clearly identified stakeholders'
  merge: -1
  img_proc: true
- pgno: 96
  md: '# Levels of governance within the enterprise


    Architectural governance usually operates as part of a hierarchy of governance
    structures, which—particularly in large enterprises—may include multiple domains
    such as corporate governance, technology governance, IT governance, and architecture
    governance, with distinct disciplines and processes. Within the overall enterprise,
    each of these domains of governance may exist at various geographic levels—global,
    regional, and local.


    # Nature of governance


    Strategic planning is less about strict adherence to rules and more about providing
    guidance, as well as ensuring a fair and equitable distribution of resources to
    ensure the sustainability of a company’s goals. In essence, governance refers
    to ensuring that business is conducted properly.


    Here, we enumerate the basic principles of corporate governance as identified
    by the Organisation for Economic Cooperation and Development (OECD):


    +   - A discussion of shareholders’ rights, roles, and equitable treatment

    +   - A discussion of disclosure and transparency and board responsibilities

    +   - Ensures strategic guidance of the organization

    +   - Ensures efficient monitoring of board management

    +   - Ensures accountability of the board for the company

    +   - Board reviews and guides the corporate strategy

    +   - Board monitors management performance aligned with the business objectives


    In corporate governance, separate rights and responsibilities are assigned to
    the board, managers, shareholders, and other stakeholders, along with rules and
    procedures for making decisions on corporate affairs. Furthermore, it provides
    a framework by which company objectives are set, as well as a way to monitor progress
    toward those objectives.


    EA governance capabilities and its elements consist of multiple factors that need
    to be addressed for smooth operations. Their benefits are highlighted in the following
    screenshot as well:'
  merge: -1
  img_proc: true
- pgno: 97
  md: '![](img/16bfeb984938aba3d9334582c2cd6e69_97_0.png)


    Figure 3.3 – EA governance capabilities and elements


    # Characteristics of governance


    The following characteristics highlight the value and necessity of governance.
    Organizations should adopt this approach while dealing with all involved parties:


    +   - **Discipline**: All stakeholders must adhere to procedures, processes, and
    authority structures put in place by the organization.

    +   - **Transparency**: All decisions that may or may not affect IT/business will
    be made available for inspection by an authorized organization.'
  merge: -1
  img_proc: true
- pgno: 98
  md: '+   - **Independence**: Potential conflicts of interest may occur, hence a
    decision-making process and other mechanisms will be established.

    +   - **Accountability**: Governance boards are responsible for actions or making
    decisions, hence are authorized and accountable for their actions.

    +   - **Responsibility**: Each stakeholder or investor must abide by laws and
    responsibilities toward the organization.

    +   - **Fairness**: Unbiased decisions, processes, and implementation will be
    ensured. They will not be allowed to create unfair advantages for any one particular
    party.


    # Technology governance


    As technology permeates every aspect of an organization, technology governance
    is a critical capability, requirement, and resource for it. The use of technology
    for the purpose of research, development, and production of its goods and services
    is carried out and monitored during this stage. Its scope is broader than just
    IT governance activities.


    Many organizations have a balance that favors intangibles over tangibles that
    require management, according to recent studies. Considering that virtually all
    these intangibles are informational and digital assets, it is readily apparent
    that businesses are relying more on IT and IT governance. It is therefore becoming
    increasingly important for IT governance to be as effective as possible.


    Moreover, they indicate that businesses are increasingly dependent not just on
    information but on the processes, systems, and structures by which it is created,
    delivered, and consumed. Many industries are moving to add value through intangibles,
    so risk management must be considered key to understanding and navigating new
    challenges, threats, and opportunities. Increasingly, businesses rely on IT not
    only to run smoothly and profitably, but also to build their reputation, brand,
    and—ultimately—their values.


    # IT governance


    IT governance institutionalizes best practices for planning, acquiring, implementing,
    and monitoring IT performance to ensure the enterprise’s IT assets support its
    business objectives. In order to link IT resources and information to corporate
    goals and strategies, IT governance provides a framework and structure.


    Over the last few years, IT governance has become an essential component of an
    enterprise’s governance. Business functions and processes are increasingly dependent
    on IT, and to gain a competitive advantage, businesses must manage the complex
    technology that is scattered throughout the organization in order to respond quickly
    and safely to needs. As a result of increasing reports of information system disasters
    and electronic fraud, regulatory environments around the world are increasingly
    demanding tighter enterprise control of information.'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'Now, the management of IT-related risks is widely recognized as an important
    pillar of enterprise governance. In conclusion, top management must endorse an
    IT governance strategy and establish an appropriate organization for implementing
    it, clarifying who is ultimately responsible for their enterprise-wide integration
    and who owns the enterprise''s IT resources.


    # AWS architecture governance


    AWS enables customers to provision and operate their environment for business
    agility and governance control. AWS Management and Governance services, along
    with cloud centers of excellence (CCoEs), provide resources to builders that reduce
    vulnerabilities and maintain compliance across the organization by defining preventive
    and detective controls.


    Cloud governance is a combination of processes, people, and technology that drives
    cloud adoption and improves an organization''s agility without compromising security.
    The concept of safety is important as cloud governance encompasses more than just
    cyber security.


    With decentralized governance, safety standards and costs can be controlled. This
    also ensures much better responsiveness and agility. In order to deploy the appropriate
    resources and define best practices, it''s important to develop a critical mass
    of AWS experience, establish operational processes, and build a CCoE. This gives
    the following benefits as well:


    +   - **Scale**: Highly dynamic cloud resources are managed at a massive scale
    through AWS Management and Governance services.

    +   - **Simplicity**: A single AWS control plane reduces complexity for customers
    as they can manage and govern their resources on AWS and on-premises.

    +   - **Third-party solutions**: Management and governance system extensions are
    a huge part of AWS. It offers a broad partner ecosystem for customers.

    +   - **Cost savings**: AWS Management and Governance services let customers assess
    their resource utilization and identify efficient and less costly ways of working.


    # Auditability


    Having well-defined and functioning EA principles and processes in place is what
    this section determines: an infrastructure that meets current business needs and
    prepares for future requirements. These requirements are aligned with the overall
    enterprise approach. Here''s a list of some of the audit''s specific roles to
    assess:


    +   - Transparent planning and decision-making related to EA are ensured through
    sufficient governance.

    +   - There is adequate alignment between the IT and business-effective EA via
    development and implementation processes.'
  merge: -1
  img_proc: true
- pgno: 100
  md: '+   - Performance measurement and monitoring should be done by EA to ensure
    maximum outcomes and achieve key benefits.


    As documented by the **Center for Internet Security (CIS)** Cloud Platform Foundations
    Benchmarks, the **General Data Protection Regulation (GDPR)**, and the **Payment
    Card Industry Data Security Standard (PCI DSS)**, AWS Audit Manager''s prebuilt
    frameworks help translate evidence from cloud services into auditor-friendly reports.


    AWS Audit Manager simplifies assessing risk and compliance with regulations and
    industry standards by automating continuous audits of your AWS usage. In addition
    to automating evidence collection, Audit Manager allows you to scale audit capability
    on-demand as your business grows and reduces the *all-hands-on-deck* manual effort
    often associated with audits. It is simple to evaluate if your policies, procedures,
    and activities—referred to as controls—are effective with an audit manager. As
    an audit approaches, AWS Audit Manager can help you manage stakeholder reviews
    of your controls and build audit-ready reports with a great deal less manual effort.


    The AWS Management Console allows you to start using Audit Manager immediately.
    You can tailor a framework and its controls to meet your company''s specific needs.
    Audit Manager collects and organizes relevant evidence—such as snapshots of resource
    configuration, user activity, and results from compliance checks—based on the
    framework you select. Therefore, to begin your assessment, simply select a prebuilt
    framework, and evidence will be collected and analyzed automatically.


    The AWS CloudTrail service, enabled by default, helps you enable governance, compliance,
    and operational and risk auditing of your AWS account. All activities are recorded
    in a CloudTrail event. You can view recent events in the CloudTrail console by
    going to **Event history**.


    # Change management


    This section aims to establish an architecture change management process for the
    new EA baseline that is achieved with the completion of the preceding activities.
    The process typically provides guidelines for the continual monitoring of new
    developments in technology and changes in the business environment. Furthermore,
    it also initiates a new architecture evolution cycle.


    # *Change management approach*


    A change management process is designed to ensure that architecture changes are
    managed in a cohesive and architectural manner. They also ensure that the implemented
    EA is dynamic—that is, capable of growing rapidly in response to changes in business
    and technology environments.


    The change management process determines the circumstances in which the EA is
    allowed to change after implementation, the process by which that will happen,
    and when the development cycle will initiate again for a new architecture. Within
    an enterprise, the architecture change management and the architecture governance
    processes are closely related.'
  merge: -1
  img_proc: true
- pgno: 101
  md: 'The governance body establishes criteria to judge whether a change request
    warrants just an architecture update or whether it warrants starting a new cycle
    of the **Architecture Development Method (ADM)**. To avoid any unpleasant outcome,
    the governance body must continue with changes that are directly related to business
    value. It is difficult to prescribe guidelines for establishing these criteria
    because companies perceive risk differently. However, with the ADM, the criteria
    become clear for specific needs as the maturity of the governance body improves.


    # Drivers for change


    Multiple technology-related drivers set the foundation for architecture change.
    Top of the list is new technology reports, asset management cost reductions, technology
    withdrawal, and standards initiatives. These requests are managed through an enterprise''s
    change management and architecture governance processes. Moreover, these architecture
    changes are facilitated and motivated by certain business drivers, as outlined
    here:


    +   - Business-as-usual developments

    +   - Business exceptions

    +   - Business innovations

    +   - Business technology innovations

    +   - Strategic change


    These requests often result in a total redesign and development of the EA, in
    many cases.


    # The change management process


    Project management methods are an example of management techniques and methodologies
    that are used for managing change. Change management processes in other fields
    such as systems development or project management can be adapted for use in architecture
    by enterprises that already have one in place.


    Identifying how changes will be managed, which processes will be followed, and
    which methodologies will be used is a critical step in change management. In addition
    to a filtering function, the process must determine which phases of the architecture
    development process are impacted by requirements. If only migration is affected
    by changes, the architecture development phase will not be concerned with these
    changes.


    This section outlines an approach to change management focused on supporting a
    dynamic EA that may be considered for use in the absence of a similar process
    today.'
  merge: -1
  img_proc: true
- pgno: 102
  md: 'The change management process approach is based on architectural changes classified
    into one of the following categories:


    +   1. A simplification change is handled via change management techniques.

    +   2. An incremental change is capable of being handled via change management
    techniques as well. Partial re-architecting might be required, depending on the
    nature of the change.

    +   3. The re-architecting change puts the whole architecture through the architecture
    development cycle all over again.


    These three choices can also be described as simplification, incremental change,
    and re-architecting. A simplification change is often motivated by a desire to
    reduce investment, an incremental change by a desire to maximize existing investment,
    and a re-architecting change by the need to increase investment to find new opportunities
    to exploit.


    The following activities are undertaken to determine whether a change is simplification,
    incremental, or re-architecting:


    +   1. Registration of all events that may impact the architecture

    +   2. Resource allocation and management for architecture tasks

    +   3. The process responsible for architecture resources assessing what should
    be done


    The key is to always remember that all changes should add value to the business.
    Change management should be based on minimizing business risk while increasing
    productivity and minimizing wasteful effort or cost. In addition to providing
    predictable, testable outcomes to changes, it should also eliminate the need for
    submitting changes to scale infrastructure to meet business demands, as well as
    automatically recovering from failures and rolling back failed changes. Ultimately,
    automation can deliver more business value, which is what change is about, by
    reducing change-related risks and increasing business agility.


    Cloud automation, integration, and deployment tools make it possible for the business
    to make small, frequent changes that reduce risk and increase business value.
    Processes need to be adapted to reflect what is actually being changed, such as
    increased change and decreased risk. On a concluding note, considering the risk
    of not implementing a change or experiencing delays is always better than avoiding
    it all the way. Not to forget, the primary aim of managing change is to streamline
    business risk.


    AWS Change Manager simplifies the way you can request, approve, implement, and
    report on operational changes to your application configuration and infrastructure
    on AWS and on-premises.'
  merge: -1
  img_proc: true
