    \ here are some positive outcomes that you will experience:\n\n+   - The path\
    \ of what we call the *stages of adoption* is generally followed by organizations\
    \ considering large-scale migration to AWS. It is important to assess your organization’s\
    \ readiness at each stage and to determine which parts of the environment are\
    \ sufficiently mature to move to the next stage.\n+   \n+     The project phase\
    \ (or POC phase), for example, includes organizations planning their first workload\
