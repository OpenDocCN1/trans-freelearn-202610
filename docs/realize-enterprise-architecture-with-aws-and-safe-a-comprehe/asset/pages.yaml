  md: '+   - In order to facilitate dark launches, developers have implemented feature
    toggles, which allow switching between old and new functionality in code

    +   - Canary releases allow the solution to be released to a specific customer
    segment and measured before it is further expanded and released to more customers

    +   - A decoupled release element is one in which the release elements have each
