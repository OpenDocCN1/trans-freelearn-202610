- pgno: 133
  md: '# AWS Prescriptive Guidance Frameworks


    Several departments and major business processes are impacted, including the **information
    technology (IT)** framework, in the process of transitioning to the cloud. Planning
    ahead is crucial for a successful migration but translating business goals into
    a migration plan takes time.


    An overview of the steps involved in planning and implementing your cloud vision
    is discussed in detail in this chapter.


    We will cover the following topics in this chapter:


    +   - Understanding the current state of the cloud journey and target business
    outcomes

    +   - Identifying business objectives for your migration to the cloud

    +   - **Amazon Web Services (AWS)** Well-Architected Framework review

    +   - AWS **migration readiness assessment (MRA)** phases

    +   - **AWS Cloud Adoption Framework (AWS CAF)**

    +   - **AWS Engagement Delivery Framework (AWS EDF)**


    # Understanding the current state of the cloud journey and target business outcomes


    No matter where you are on the cloud journey, whether you’re just getting started
    or you’re at the halfway point, it isn’t over. The organization is required to
    constantly review its strategy, no matter where it is in its cloud journey, to
    ensure that it is getting the most out of the services it aims to offer. Since
    technology and services are always changing, businesses need to use them to continually
    improve their operations. Changing the path of the journey is key to staying competitive,
    growing the business, and ultimately succeeding. In order to ensure that organizations
    are on the right path and have improved their business acumen, cloud adoption
    strategies need to be created or reviewed.'
  merge: -1
  img_proc: true
- pgno: 134
  md: "Those who have already taken the plunge should review best practices related\
    \ to security, availability, automation, and cost management to make sure their\
    \ investment is getting the best return. The next step is to outline a solution\
    \ and fill in the details after the journey has been outlined and a roadmap has\
    \ been drawn up.\n\nIt is not necessary to rush into the cloud, nor is it necessarily\
    \ a *cloud-native* solution that is the right fit for your business. Here are\
    \ some key considerations and steps to defining a cloud strategy that will deliver\
    \ value to your business:\n\n+   - **Articulate your vision**\n+     Ensure that\
    \ your cloud strategy takes into account the business objectives of your organization\
    \ when documenting your vision for the enterprise's future use of the cloud. Considering\
    \ a long-term view of your objectives and the associated benefits of cloud computing,\
    \ such as moving from proprietary solutions to **software-as-a-service (SaaS)**\
    \ solutions, will help in decision-making within the business and gain buy-in\
    \ from key stakeholders.\n+   \n+   - **Present a strategy and roadmap**\n+  \
    \   After the vision has been bought into by the company, steps are taken to get\
    \ it molded into a cloud strategy. A comprehensive roadmap is laid out that guides\
    \ both short- and long-term undertakings.\n+   \n+   - **Understand your asset\
    \ landscape**\n+     When determining your strategy and assessing benefits, it\
    \ will be helpful to have a comprehensive view of the infrastructure and software\
    \ assets in your business. Maintaining and replacing assets cost money, and their\
    \ expected useful lives should also be considered, as well as qualitative aspects,\
    \ such as the degree of customization and the complexity of the migration process.\n\
    +   \n+   - **Look to improve the operating model**\n+     Organizations should\
    \ consider reshaping their processes when they move to the cloud. Regardless of\
    \ whether the process is in the cloud or not, even with better technology, it\
    \ can still be flawed; technology alone won't make it better. It is best to involve\
    \ a wide range of stakeholders in the process to identify improvements that can\
    \ be accomplished in the cloud. Thus, lifting-and-shifting systems can be avoided,\
    \ skipping the need to change them again later on.\n+   \n+     An important factor\
    \ to consider will be the balance between retaining in-house solutions and custom\
    \ functionality and a cloud-native approach. Additionally, consider streamlined\
    \ processes for the back office, such as system integration and **business continuity\
    \ (BC)** plans, as well as those processes used by employees and customers."
  merge: -1
  img_proc: true
- pgno: 135
  md: "+   - **Vendor selection**\n+     Establishing a cloud roadmap begins with\
    \ choosing the right vendors. It is imperative that you conduct due diligence\
    \ on your vendors in order to be sure they provide the best possible solutions,\
    \ support, and cost model. Verify that the future state meets your risk appetite\
    \ by considering both the resilience of the vendor and the criticality of the\
    \ processes being migrated. In light of increasing cloud adoption, regulators\
    \ could recommend that certain companies develop a multi-cloud strategy in light\
    \ of the systemic risk of cloud failure.\n+   \n+   - **Resource management**\n\
    +     Cloud computing requires specialized skills—for example, project management,\
    \ cloud architecture, **user experience (UX)**, data architecture, and expertise\
    \ in software development. New roles include cloud security professionals and\
    \ network specialists after go-live. To meet resource requirements, care should\
    \ be taken to balance the onboarding of new staff and third-party support with\
    \ the redeployment of headcount from retired systems.\n+   \n+   - **Benefit and\
    \ cost analysis**\n+     Cloud computing features many benefits, among them scalability,\
    \ flexibility, reduced complexity, and cost smoothing. SaaS deployments to complete\
    \ outsourcing of platforms and infrastructure will result in different benefits.\
    \ It is likely that the business will experience some short-term disruption, regardless\
    \ of the circumstances. To present a complete business case, it will be important\
    \ to understand both the short- and long-term impacts, including data transformation\
    \ and migration requirements. As you consider savings and projected costs, keep\
    \ in mind the challenges inherent to modeling, particularly if current IT costs\
    \ are not sufficiently granular.\n+   \n+   - **Security in the cloud**\n+   \
    \  A cloud-based solution may increase the attack surface or points of entry of\
    \ the organization and expand its digital perimeter. When implementing network,\
    \ data, and cybersecurity controls within a cloud environment, it is essential\
    \ to think about how they will be deployed, both before and after the migration.\
    \ It will be necessary to consider both regulatory requirements and third-party\
    \ privacy concerns when storing or processing data overseas, especially as it\
    \ relates to data held or processed abroad. Successful, secure cloud deployment\
    \ also requires mature processes for data governance and data leakage control.\n\
    +   \n+   - **Cloud governance**\n+     To ensure that cloud applications, data,\
    \ security, and controls receive adequate accountability and ownership, the IT\
    \ governance model will need to be amended. It is important to mitigate the risk\
    \ of shadow IT activity and ensure that the cloud environment is properly controlled,\
    \ such as licensing management and capacity monitoring."
  merge: -1
  img_proc: true
- pgno: 136
  md: "+   - **Operationalizing**\n+   \n+   New ways of working need to be embedded\
    \ immediately through training and awareness exercises. In cases where cultural\
    \ changes are needed, such as implementing agile project management practices,\
    \ they cannot be underestimated. Within the new environment, ongoing audits and\
    \ regulatory requirements—including cross-border data sharing—should be considered.\
    \ The final step would be to review and update policies and procedures pertaining\
    \ to core business areas such as backup and **disaster recovery (DR)**, change\
    \ management, service delivery, and vendor relationship management.\n\nMultiple\
    \ business departments and critical business processes will be altered as a result\
    \ of the change. Hence, an enterprise cloud journey entails more than just technical\
    \ changes.\n\n# Stages of a cloud journey\n\nA migration plan that incorporates\
    \ business objectives is time-consuming, but advanced planning is essential to\
    \ a successful migration. An overview of how to plan and deliver your cloud vision\
    \ will be covered in this section.\n\n# Step 1 – Making the business case\n\n\
    It is an important business decision to embark on a cloud journey. Before adopting\
    \ a cloud infrastructure, businesses should evaluate its business implications.\
    \ Cloud computing differs from traditional IT setups, and decision-makers should\
    \ be aware of this. Assessing the implications of benefits, risks, compliance,\
    \ security, and data control for the company as a whole and its IT activities—in\
    \ particular—is essential. Identify which systems and applications should be migrated\
    \ first, and what the expected costs and **total cost of ownership (TCO)** of\
    \ the cloud deployment are.\n\n# Step 2 – Identifying the right applications\n\
    \nThe design of every application varies, so cloud environments might not be suitable\
    \ for every application. In the event that the application is cloud-friendly,\
    \ you can simply *lift* and *shift* it over to the cloud. Lift-and-shift migration\
    \ is by far the easiest migration to make since there is no code modification\
    \ required, but there may be times when the application only needs a few tweaks\
    \ before being migrated to the cloud. When the whole application needs to be rewritten,\
    \ that is the worst-case scenario.\n\nAssessing your architecture and its complexity\
    \ is the best and most cost-effective way to ensure efficiency. Decide whether\
    \ you can completely migrate to the cloud or whether it’s better to shift only\
    \ a few applications to the cloud while keeping the others on-premises."
  merge: -1
  img_proc: true
- pgno: 137
  md: '# Step 3 – Selecting a cloud service provider


    The next step is to choose a cloud environment after you have analyzed and inventoried
    your environment. Each **cloud service provider (CSP)** has its own architecture
    and its own set of characteristics, licensing, and support capabilities. When
    assessing a cloud provider, you should ask the following questions:


    +   - *Are your workloads compatible with the cloud''s architecture?*

    +     In order to reduce code changes and overhead, you might prefer a cloud environment
    requiring fewer modifications to applications.

    +   - *How does the provider implement cloud services?*

    +     There are public and private cloud offerings from most cloud vendors. You
    should check whether the vendor provides capabilities for complex cloud environments
    if you plan to implement a multi-cloud or hybrid cloud architecture.

    +   - *Would it be possible to use your own existing licenses on the cloud?*

    +     Managing licenses can be complicated and costly. Check whether your existing
    license is compatible with the software and, if not, determine ahead of time which
    license you need and what its costs are.

    +   - *In terms of support, what is needed before, during, and after migration?*

    +     There are cloud providers that provide tools and little support, while others
    offer assistance from start to finish.


    In addition to security, compliance, and **service-level agreements (SLAs)**,
    there are many more aspects of cloud migration to consider, but you should begin
    by considering the preceding questions.


    # Step 4 – Initial adoption


    In order to move to the cloud, most companies adopt SaaS first. Platforms such
    as **customer relationship management (CRM)**, office productivity tools (Office
    365 and Google Workspace), accounting, **human resources (HR)**, and collaborative
    tools such as Slack, Asana, or Trello are among the less critical applications.
    Software solutions that are critical to a company''s success—such as warehousing,
    production, and **enterprise resource planning (ERP)**—are normally tightly integrated
    with core operations. You can move an entire infrastructure to the cloud by implementing
    **platform-as-a-service (PaaS)** solutions. A transition to a cloud-based solution
    will often require pilots and **proofs of concept (POCs)**, an approach known
    as *repurchasing.*


    In the initial stages, **infrastructure as a service (IaaS)** can be used for
    non-critical applications, test and development environments, batch processing,
    and data archiving. Develop a cloud governance strategy as your organization adopts
    cloud solutions. Develop business processes that cover both on-premises and cloud
    environments, create access policies, and implement monitoring and security tools.'
  merge: -1
  img_proc: true
- pgno: 138
  md: '# Step 5 – Full migration


    Your cloud migration should now be complete with all the necessary information.
    However, it is important to keep in mind that much of the execution process is
    actually testing, and performing a pilot is an excellent way to accomplish this.
    Applications that require ongoing operation cannot sustain a long period of downtime,
    especially mission-critical ones. To verify this, it is always better to test
    your plan, and then move forward with it. Put a recovery strategy in place, in
    case of an issue.


    # Step 6 – Post-migration


    Your migration is complete, but your journey has not been completed. We can now
    begin comparing performance before and after migration. Be sure that you are aligning
    cloud performance with SLAs from your provider and your own performance goals.
    You should be vigilant for issues that come up in the new cloud environment, detect
    unexpected changes, and fine-tune applications and infrastructure accordingly.


    # Cloud migration challenges


    You will probably face some challenges during your cloud migration project, and
    here are some tips for overcoming them:


    +   - **Interoperability**

    +     Adapting existing applications to interact with cloud environments may require
    refactoring or complete rewrites. A decision should be made whether to move the
    dependency of the application to the cloud as-is or transition to a cloud-based
    counterpart.

    +   - **Availability**

    +     It may be necessary to temporarily shut down business systems during the
    migration process. Unexpected downtime may also occur during migrations. Establish
    a DR plan that is compatible with the cloud, to ensure business operations are
    not interrupted and customers are not inconvenienced.

    +   - **Data security and integrity**

    +     As well as the risk of data loss or corruption, migrations to the cloud
    can also open the door to hackers. During the migration process and in the target
    cloud environment, determine the risks and compliance issues you may face, and
    adjust your security strategy accordingly.

    +   - **Cloud expertise**

    +     Traditionally, your IT department might not have the experience to handle
    cloud environments. Data center expertise and experience managing physical servers
    do not directly translate to the cloud. Cloud experts should be recruited or contracted
    to provide solutions to these issues, such as training teams and providing sandboxes
    for experimentation.'
  merge: -1
  img_proc: true
- pgno: 139
  md: "Challenges at every step of the way during your cloud migration project are\
