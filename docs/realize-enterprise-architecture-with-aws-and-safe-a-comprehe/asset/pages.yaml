- pgno: 208
  md: '# Summary


    SAFe is among the scaled agile frameworks discussed in this chapter. These frameworks
    help large enterprises implement the principles of lean and agile. According to
    SAFe, EA fosters adaptability and engineering practices, and improves program
    and team coordination. EAs are instrumental in assisting developer teams to work
    according to standardized standards, providing strategic guidance, reference architectures,
    and technology standards. Rework may be avoided if the standards of the company
    are aligned. This also breaks down silos in the organization.


    Moreover, adapting computing resources to a company’s business needs is an important
    part of EA. It is essential to align the strategic goals of the company with its
    existing business processes, the information generated, and the supporting infrastructure
    to make this successful. Organizations achieve their objectives through frequent
    releases that are independent of one another. Agile architects use a customized
    architecture to enable seamless end-to-end value streams.


    The next chapter is about cloud migration, where we will explore the journey from
    start to end. We will also focus on whether it is the right choice for your business
