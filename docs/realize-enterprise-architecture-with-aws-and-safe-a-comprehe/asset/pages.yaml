- pgno: 91
  md: '# AWS services that support EA activities


    Organizations are often packed with talent, software, hardware, and so on, but
    knowing which ones to utilize for a particular project or task is necessary. Out
    of an extensive AWS catalog, companies find the most effective ones to support
    activities in the corporate architectures, such as AWS Organizations, Identity
    and Access Management (IAM), CloudTrail, Service Catalog, CloudWatch, and so on.


    There are certain stakeholders of AWS services that support EA activities defining
    who, why, what, where, and how aspects of the infrastructure, as illustrated in
    the following diagram:


    ![](img/16bfeb984938aba3d9334582c2cd6e69_91_0.png)


    Figure 3.2 – Different aspects of an infrastructure that supports EA activities


    Within infrastructure, the business architecture domain defines actors, software,
    and other tools, compliance with governance bodies, change management, and an
    EA repository.


    # Roles and actors


    Actors include an organization, a person, or the system executing business activities.
    Being well aware of each and every aspect of the business and understanding the
    role of each actor can enable you to create definitive listings. Organizations
    evolve with time and that is how they stay relevant. In order to facilitate the
    smooth transitional process, the relationship between each actor and their role
    needs to be well defined. Any enterprise can model actors and roles in two stages.
    Usually, organizations have a corporate directory with all the information in
    it. Other than that, some companies reinforce these elements with AWS IAM solutions.'
  merge: -1
  img_proc: true
- pgno: 92
  md: '# Application portfolio


    Any software plays a significant role in attaining a company’s objective, whether
    they are in-house or external, long-term, or short-term. Application portfolio
    management is detailed information about which applications a company uses. It
    is an essential part of the application architecture domain in EA. Through this
    biodata of applications and other software, the company sets the standard for
    the utilization of applications. AWS can help streamline the management of commonly
    deployed applications while providing consistent governance and meeting compliance
    requirements. Audits and compliance with regulations are efficient and hassle-free
    when AWS provides a single location where organizations can centrally manage these
    applications. Keep in mind this only applies to AWS-related services, and organizations
    may have other environments, architecture, or services within the enterprise.
    Offering a particular version to users, configuring the services, and controlling
    access can all be easily managed with the AWS cloud.


    # Governance and auditability


    Compliance with internal and external services to your organization is crucial
    to ensure that every operation is streamlined as per the requirements and regulations.
    This is where CloudTrail helps by giving your organization transparency across
