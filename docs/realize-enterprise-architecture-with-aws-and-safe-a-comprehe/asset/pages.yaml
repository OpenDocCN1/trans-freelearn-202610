    +   - **Design architectures**: Plan, design, and create migration targets for
    the servers, data, and applications.

    +   - **Training tools**: Provide resources with hands-on training on AWS.

    +   - **Operational runbook**: If you’re running applications on AWS, monitor
    and report on them.


    Lastly, establishing plans and schedules for migrations are essential along with
    coordination and resource allocation, identifying issues and risks, and communicating
    them.


    # Guidelines for a successful migration


    In this section, there are guidelines that are divided into multiple parts to
    help you plan your migration and to conduct migration sprints.'
