- pgno: 265
  md: '# Conclusion


    As your organization’s systems become more interconnected, enterprise architecture
    promotes consistency across them by allowing development teams to work with a
    standard set of clear, proven approaches, and even product lines, for their application
    architectures. The common mechanisms and compatible semantics across systems enable
    reuse, as well as system integration. By looking beyond the current technology
    needs and laying the groundwork for future initiatives, these teams can go beyond
    single applications and assess architectural impacts on the entire enterprise.


    The task of formulating, verifying, and then supporting architectural frameworks
    falls in the enterprise architects’ bucket. Data, security, networking, and hardware
    infrastructure are built out by your enterprise administrators. Also, your application
    project teams will be in charge of implementing your enterprise architecture.
    This is an effort that your enterprise architects should actively participate
    in, as well as support.


    It is the scope of enterprise architecture that distinguishes it from application
    architecture. Enterprise architects guide application architects to understand
    and apply enterprise architecture, just as application architects guide application
    designers and implementers on their way to understanding and applying application
    architecture. In a similar manner to application architects, enterprise architects
    take a much broader, but generally shallower, view than designers and implementers
    of systems. Your application development teams and enterprise administrators are
    responsible for actually implementing your enterprise architecture, even though
    it is established by your enterprise architect.


    # Architecture governance


    To maintain a smooth and seamless workflow, enterprise architecture leaders must
    be ahead of certain elements of the organization. At the top of the list is the
    size of the team, the infrastructure, and the organizational structure. Nevertheless,
    digital industry leaders must consider the challenges and complications that come
    along with this transformation. Only a well-structured and thoughtful business
    agility model is capable of adapting to continuous advancements within a system.
    Choosing to change constantly comes with a great deal of risk and unpredictability,
    which can be exhausting for some stakeholders.'
  merge: -1
  img_proc: true
- pgno: 266
  md: '# Levels of governance within the enterprise


    It is not uncommon for architecture governance to operate within a hierarchy of
    governance structures, which, for large enterprises in particular, may include
    all of the following distinct domains with their disciplines and processes:


    +   - Corporate governance

    +   - Technology governance

    +   - IT governance

    +   - Architecture governance


    Within the enterprise, these governance domains can occur at multiple geographical
    levels, such as global, regional, and local. An enterprise architecture framework
    such as **The Open Group Architecture Framework (TOGAF)** does not cover the entire
    topic of corporate governance. As explained previously, this section and the related
    subsections describe architecture governance from the standpoint of enterprise-wide
    governance due to the hierarchical structure within which it typically operates.


    # The nature of governance


    It is the responsibility of the government to ensure that business is properly
