- pgno: 232
  md: '3. The options are fairly self-explanatory, but to force everyone to always
    receive an e-mail every time someone makes a post, choose **Forced subscription**.
    If you want to allow your students to unsubscribe (they may complain about getting
    too many e-mails) then select **Auto subscription**. Make your subscription selection
    from the list, scroll down the page and press the **Save and return to course**
    button.


    4. That''s it. You''re done!


    # What just happened?


    We''ve just configured our forum so that students will receive an e-mail every
    time a new discussion thread is started. I''ve forced this so that there should
    be no excuse from my students for missing an important discussion taking place
    in the forum. At the start of your course you could force users to be subscribed
    to a News forum. If it is coming up to exam time you could force users to be subscribed
    to a dedicated "Exams FAQ" forum (note that this will only work if your students
    have an active e-mail address enabled in Moodle).


    Before we move on to the next section I''ll just make a quick point about terminology.
    "Subscribing" students to a forum doesn''t mean that you are making everybody
    join the forum, they are already members of the forum by virtue of being on your
    course. Subscribing users to a forum means they will receive e-mails every time
    there is new activity.


    Our next task is to encourage students to start posting, and if we are going to
    encourage and manage debate then we need to take on the role of moderator, or
    chairperson, a "forum moderator" in Moodle-speak. In the next section we take
    a look at what is involved.


    # Moderating a forum


    The forum moderator needs to:


    +   - Get a discussion started

    +   - Ensure discussions stay focused

    +   - Make sure that discussions are easy to follow


    Let''s look at each of these aspects now.


    # Getting a discussion started


    The easiest way to start a conversation is to ask a question. I''m going to make
    an initial post to my forum asking students to comment on the colors used in the
    example poster that I''ve uploaded:'
  merge: -1
  img_proc: true
- pgno: 233
  md: '# Time for action – starting a discussion


    +   1. Press the **Add a new discussion topic** button:


    ![](img/1529021fde33ef551603bbc71587313e_233_0.png)


    +   2. You''re now taken to the **Add a new discussion topic** page. Your new
    forum post needs a subject line and there is a box for you to create your message.
    Here''s mine:


    ![](img/1529021fde33ef551603bbc71587313e_233_1.png)'
