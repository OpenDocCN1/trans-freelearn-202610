    # What just happened?


    We''ve just seen how easy it is to add a quiz to our course and to include questions
    in it from the course question bank. If your admin has allowed you access to your
    colleague''s questions, then you can easily add their questions to your quiz,
    too.


    If you want to view the results of a quiz, then click the Results link in your
    Navigation block. You''ll see all of the attempts listed there.


    # Lesson activity


    Teachers often assume this activity is some kind of lesson planning tool. A Moodle
    lesson is actually a tool for creating action mazes: the ideal device for exploring
    scenarios and decision trees, posing quandaries, and for interactive case studies.


    Think of a lesson rather like a text-based adventure game, or the Choose Your
    Own Adventure books popular in the 1980s and 90s, where you find yourself in a
    certain situation and you need to decide what to do next: You are in a dark dungeon.
    Do you go through the door on the left? Do you pick up the bloodied axe? Do you
    take the bag of gold coins from the sleeping troll?'
  merge: -1
  img_proc: true
- pgno: 272
  md: '# Enhancing your Teaching


    You''ll often find these kinds of scenarios in health and safety training. Imagine
    you are shown a video of someone working in a storeroom and her colleague knocks
    a box on her head, knocking her out cold. Then, you are asked: who is responsible
    for this accident—the employee or employer? Your choice then leads you on to,
    perhaps, another video and another set of decisions or questions. As a user, I
    can take one of many paths, or "branches"/"answers" in Moodle-speak, as I explore
    the scenario.


    # Structuring Moodle lessons


    Moodle lessons are basically made up of a series of web pages. At the bottom of
    each page, you can have either buttons or a question. Depending on the button
    pressed, or how you answer the question, you are taken to another web page.


    ![](img/1529021fde33ef551603bbc71587313e_272_0.png)


    > We''ve been learning how we can use graphics and multimedia to make content
    engaging and entertaining for students. There is nothing stopping us using these
    skills in the pages of a Moodle lesson.


    # Why include a lesson


    There are many ways that lessons have been used successfully in the classroom.
    Here are just a few examples that I''ve come across of classroom activities that
    have successfully been converted to Moodle lessons:


    +   - "Guess Who?" games. Ask your students to choose one from a number of characters
    from a story. The computer poses a series of questions to determine who that character
    must be.

    +   - Exploring scenarios. As we have already described, lessons are the ideal
    way to explore specific scenarios: legal, scientific, health and safety, and more.

    +   - Role-play. You are Charles I and the period of personal rule has begun.
    Gentlemen are writing pamphlets speaking out against your choice for Archbishop
    of Canterbury. Do you a) Give in to their demands and change the Archbishop? b)
    Get really annoyed and cut their ears off? c) Ignore them because you''re in charge
    so it doesn''t matter? (In fact, Charles cut their ears off).

    +   - Medical diagnosis. Given a set of symptoms, can you diagnose an illness
    correctly? As a practitioner, can you ask the right questions?

    +   - Virtual tours. Together with your students, create a virtual tour of a battlefield
    or a medieval village. Working together with the class to create Moodle lessons
    shares the effort required to put them together.'
  merge: -1
  img_proc: true
- pgno: 273
  md: '# # Supporting classroom-based teaching with lessons


    Unless you get the class to help you (see the virtual tour example given previously),
    a meaningful lesson activity can take a while to set up. If you''ve spent your
    evening constructing a detailed scenario, it can be a little disheartening when
    you see your charges rattle through it in a couple of minutes.


    However, think about using a lesson to explore ideas with a class as a group activity.
    If you''ve a projector or an interactive white board in your class, work through
    the lesson together with your students. It is one of the easier ways to ensure
    that no learning goal is missed.


    # # Including a lesson in your course


    Don''t think of lessons as purely a teaching tool. I''m sure you''ve got lots
    of great ideas for lesson activities. For me, I need my students to work their
    way through a series of health and safety notices and agree to certain "Terms
    and Conditions" before they are allowed to join me on my course. For the rest
    of this section, I''m going to convert this paperwork over to Moodle.


    # # Configuring a lesson


    I''m going to start by adding a lesson to the course front page and configuring
    the basic settings:


    # ## Time for action – configuring a lesson


    +   1. Return to your course front page, choose a topic you want to add the lesson
    to, click on **Add an activity...** and select **Lesson** from the list.

    +   2. Give your new lesson a name.

    +   3. Scrolling down, you can see there are lots of options to choose from. I''m
    not going to worry about these now, and instead I''m going to scroll down and
    press the **Save and return to course** button.

    +   4. That''s it. We''re done!


    # # What just happened?


    We''ve just configured a new lesson (which was pretty easy because the default
    options are more than enough to get us started). But now I have an empty lesson
    that I need to fill.'
  merge: -1
  img_proc: true
