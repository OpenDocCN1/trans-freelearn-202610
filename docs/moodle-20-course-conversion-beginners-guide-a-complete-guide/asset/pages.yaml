- pgno: 173
  md: '# Hypnotic HTML: Finessing your web pages and descriptions


    You can see that my **Getting Things Flying** topic is still mostly words. The
    only pictures I have in there are the Moodle icons, used to indicate the resource
    or activity type. I really want to liven it up with pictures and animations, but
    where can I get the graphics from and what''s the best way of including them?


    # Finding decorative images


    The Internet has some fantastic resources for free images to include in our courses.
    Here are just a few of the more popular ones.


    # Google image search


    It is great for finding a picture on just about anything. Be careful about copyright
    (more on that later). The pictures are of mixed quality and you have to be prepared
    to hunt around. But they are good fun and wonderful for livening up an otherwise
    dry course.


    Visit http://images.google.com/ for the Google image search main page.


    I''m going to look for a picture of a do-it-yourself rocket. I type in the words
    "DIY Rocket" into the search box and hit the **Search Images** button. I''m presented
    with a page full of miniature versions of the original pictures Google has found:


    ![](img/1529021fde33ef551603bbc71587313e_173_0.png)'
  merge: -1
  img_proc: true
- pgno: 174
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 175
  md: '# # Microsoft Office clip art library


    Microsoft has packed a fantastic range of clip art images into Office. So in Word
    2003, for example, click on **Insert** in the main menu, slide down to **Picture**
    and then slide across to **Clip Art...** to open the **Clip Art** side bar. My
    search in there for "rocket" found me a myriad of clip art images, actual pictures,
    and animations. You can limit your search to specific types of media. To add the
    clip art to your document simply double-click on the thumbnail. This way we can
    put together a single document just containing the clip art images we need for
    our course.


    Now we''ve got our clip art gathered together in a Word document, what''s the
    best way of grabbing the images? You''ve got the same problem if you already have
    a document, or a PowerPoint presentation, that contains an image (including animated
    pictures) you want to grab.


    # # Time for action – grabbing an image from a Word document


    In *Chapter 4, Handing in Work through Moodle*, we learned how to convert Microsoft
    Word and PowerPoint presentations to web pages as a way of overcoming the problem
    that your students might not have Office installed on their computers at home,
    and so might not be able to view your document. If you save a document as a web
    page, grabbing an image is easy:


    +   1. In Word 2003, select **File** from the main menu and slide down to **Save
    As...** The **Save As** dialog is displayed.

    +   2. At the bottom of the **Save As** dialog, click on the **Save as type**
    drop-down list. Select **Web Page, Filtered (*.htm; *.html)**.

    +   3. Make sure you are happy that Word is about to save your document to the
    right folder and that you are happy with the name. Press the **Save** button.

    +   4. Don''t worry about what the next dialog says. Click **Yes**.

    +   5. Go to the folder you just saved your document to. In there you should find
    a folder ending with "_files". In there will be your images:


    ![](img/1529021fde33ef551603bbc71587313e_175_0.png)'
  merge: -1
  img_proc: true
- pgno: 176
  md: '# Moodle Makeover


    # What just happened?


    Often you''ll already have a Word document or a PowerPoint presentation containing
    an image that you want to include in your course. We''ve just created a new Word
    document, collected images from the Office clip art library, and then we''ve seen
    how easy it is to grab images by saving the document as a web page. You can easily
    do the same for PowerPoint presentations.


    # Copyright caution


    We have already encountered a problem with copyright in the previous chapter (*Is
    it legal to extract videos from YouTube or TeacherTube?*). Let''s take another
    look at the issues.


    Because we are working in the education sector, and as long as we aren''t planning
    on making money out of someone else''s pictures, copyright shouldn''t be that
    much of a problem. In fact I''ve never had a problem with copyright; if it isn''t
    obvious what you can and can''t copy off a website then all you have to do is
    ask the copyright holder. In my experience, asking for images from the larger
    corporations often prompts them to send you even more images. If you still aren''t
    sure, and are fortunate enough to have a librarian working in your establishment,
    then they should be aware of what you can and can''t copy and how it can be used.


    Another issue to think about is that of including photographs of staff and students
    (or just people generally). Will you need their permission to include their likeness
    in your course?


    # HTML Editor tips and tricks: Smilies and other gimmicks


    If you really want to set your course apart from the crowd and you are looking
    for the right tool to do it then look no further than the HTML Editor we have
    been using all along. The Editor does a good job of making it very easy for us
    to improve the look and feel of our courses, and in helping us to create engaging
    Moodle pages. Let''s spend the rest of this section spending a little time exploring
    some new ideas.


    # Smilies


    Have you checked out the **Insert Smiley** button yet? It''s a really simple way
    of putting a little bit of expression in your text. Want to be sarcastic but you
    don''t want students to get the wrong end of the stick? Add a:


    ![](img/1529021fde33ef551603bbc71587313e_176_0.png)


    Want to show how happy you are? Insert a:


    ![](img/1529021fde33ef551603bbc71587313e_176_1.png)'
  merge: -1
  img_proc: true
- pgno: 177
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 178
  md: '# Arranging your HTML


    While I''ve been busy sorting and arranging, the thought struck me that up to
    now I haven''t given much thought as to how text and pictures are arranged on
    a page (although that thought may well have struck you). At the moment I''ve got
    text then pictures, text then pictures, one under the other. It doesn''t have
    to be so, because I can also arrange my pictures side by side using borderless
    tables:


    ![](img/1529021fde33ef551603bbc71587313e_178_0.png)


    # Time for action – displaying things side by side


    Let''s try this by adding a new web page to a topic. Make sure you''ve got a couple
    of images that you can display side by side:


    +   1. After you have created a new web page, we first need to insert a table.
    Click on the Insert Table button to display the Insert Table dialog:


    ![](img/1529021fde33ef551603bbc71587313e_178_1.png)'
  merge: -1
  img_proc: true
- pgno: 179
  md: '2. You can now specify the number of columns and rows your table will have.
    Don''t worry if you aren''t exactly sure how many you will need as you can always
    change things later on. I''m going to have two pictures side by side, each with
    a fragment of text underneath. That means two rows and two columns. When you first
    insert a table, the border has a thickness of 1. If you want a borderless table
    then you must set the border to be 0.


    3. Insert an image into each of the two cells in the top row of the new table:


    ![](img/1529021fde33ef551603bbc71587313e_179_0.png)


    4. If you want a full view of the page so that you can position the images then
    remember you can drag on the bottom right-hand corner of the Editor or, alternatively,
    click on the Toggle fullscreen view button to open the fullscreen view:


    ![](img/1529021fde33ef551603bbc71587313e_179_1.png)'
  merge: -1
  img_proc: true
- pgno: 180
  md: '5. I''m then going to enter some text into the cells underneath each picture,
    give the page a title, and that''s it! I''m done:


    ![](img/1529021fde33ef551603bbc71587313e_180_0.png)


    # What just happened?


    By using borderless tables to arrange our HTML we can vastly improve the visual
    appeal of our web pages. Rather than having text, then a picture, then text, then
    a picture repeated down the page, we can arrange items in cells in a table which,
    as we have seen, is very easy to add in. It''s also easy to reconfigure the table
    later on if you find that your content needs to change.


    Remember: if you want a borderless table then you must set the border to be 0.


    # Getting animated: Add a talking character


    Multimedia these days isn''t just limited to audio and video. How about having
    your own custom-designed animated character included in your course? Not for everyone
    but a good deal of fun is the free online service Voki (at time of writing there
    is now a special "Voki for Education" area in the Voki website)


    Voki characters are animated, onscreen avatars that can talk either using computer
    generated speech, or from a recording or uploaded file. Check out http://voki.com
    for more information.'
  merge: -1
  img_proc: true
- pgno: 181
  md: 'You will ultimately need to create a Voki.com account, but if you visit Voki.com
    you can start creating an animated character straight away. Remember when we were
    embedding multimedia content in Chapter 4, Sound and Vision—Including Multimedia
    Content. Again, Voki provides you with a fragment of web page code, and we can
    embed that code into any HTML we add to our course.


    Showing you how to create a Voki character is beyond the scope of this book, but
    the Voki website contains lots of guidance on how to do this.


    In the following screenshot I''ve edited the course summary and added in a Voki
    of me (kind of!) giving out an important safety warning:


    ![](img/1529021fde33ef551603bbc71587313e_181_0.png)


    # HTML blocks: A bit on the side


    We''ve come a long way since we first looked at all the components that make up
    a Moodle page back in Chapter 2, Setting up your Courses. Remember at the beginning
    we talked about blocks, those small boxes down the left and right-hand sides of
    the page? I mentioned you could add your own blocks and position them how you
    wanted. Let''s take a look at doing that now, because one of the blocks you can
    add is an HTML block.


    Let''s use an HTML block to create a welcome message for our students.'
  merge: -1
  img_proc: true
- pgno: 182
  md: '# Time for action – adding a welcome message


