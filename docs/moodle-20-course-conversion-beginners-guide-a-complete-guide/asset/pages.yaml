- pgno: 327
  md: '# # Pop quiz—using labels


    Remember how we discussed using labels in *Chapter 5, Moodle Makeover*? We saw
    that labels are the glue that hold courses together. Can you tell where I''ve
    used labels in my Summary of General?


    # # Using multimedia sharing services


    I used `slide.com` in the previous example but there are, of course, many other
    online sharing sites for sharing all manner and types of multimedia content. Think
    about the possibilities of using Google Picasa, Flickr, and YouTube, for instance.
    Remember to ensure that the service you choose is actually available to your students.
    For instance, students are often blocked from accessing YouTube, even if members
    of staff are allowed access. Check out *Chapter 4, Sound and Vision—Including
    Multimedia Content* for more advice on including multimedia in your courses.


    # # Arranging activities


    Let''s look at how I''m going to arrange Week 1 (I''m going to arrange Week 2
    in much the same way). Let''s start the online activities by asking the students
    a simple question to test their understanding, let''s give them a choice. We saw
    how to include and configure a choice activity in *Chapter 8, Enhancing Your Teaching*.
    My question is: "Does a liquid have to be highly flammable to be explosive?".
    Here is the choice activity I''ve created:


    ![](img/1529021fde33ef551603bbc71587313e_327_0.png)'
