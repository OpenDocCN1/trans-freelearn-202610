- pgno: 259
  md: '![](img/1529021fde33ef551603bbc71587313e_259_0.png)


    # Summary


    We learned a lot in this chapter about communicating online. If we are going to
    convert our courses to Moodle then communication and communicating well is more
    vital than ever. You wont be able to use the kinds of gestures, expressions, and
    verbal clues that you would normally use to talk to people in the real world.
    We saw how you could use forums and chat rooms as teaching tools, and Moodle messages
    as a course administration tool.


    Specifically, we covered:


    +   - How to add a chat room to a Moodle course using Moodle''s very own built-in
    instant messaging system (such as MSN). A Moodle chat room allows students to
    talk in real time when they (or we) are out of the classroom. We explored the
    pros and the cons of using this activity.

    +   - You can announce when you are going to be available for a chat, and we learned
    how to add a mini-calendar onto our course front pages to make it easy for students
    to see what course-related events are about to happen.

    +   - How debates and discussions could be had online using a forum. We saw that
    there were four different kinds of forum and how each could be used to support
    different kinds of discussion.

    +   - How to convert the staff and student pigeonholes over to Moodle using Moodle
    messaging, and how to send out a welcome message to our students.


    We also discussed how to make yourself more easily understood, looking specifically
    at how you can use emoticons to show how you mean what you type.


    Now that we''ve learned about communication we''re ready to look closely at enhancing
    our teaching using other Moodle activities, such as quizzes and wikis. We''ll
    cover these and more in the next chapter.'
  merge: -1
  img_proc: true
