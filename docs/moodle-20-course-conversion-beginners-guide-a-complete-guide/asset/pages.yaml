    \ time in school then they could well bring the computer that Moodle is running\
    \ off—and/or the network supplying the IT suite—to a grinding halt. If space on\
    \ the computer running Moodle (the 'Moodle server') is an issue then uploading\
    \ them to YouTube or TeacherTube is worthwhile.\n\n> Remember: you may not have\
    \ consent to upload images and videos of students onto third-party computer systems.\
    \ Check your institution's policy on the use of images and videos of students.\n\
    \nBoth YouTube and TeacherTube allow you to embed a special video player into\
    \ your web pages that plays the video directly from their respective websites.\
    \ If we embed a video from YouTube and we have the entire class each with a computer\
    \ attempt to play the video at the same time, then it is YouTube that has to take\
    \ the strain, not the Moodle machine."
