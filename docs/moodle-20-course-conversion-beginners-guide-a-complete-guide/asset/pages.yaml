- pgno: 343
  md: '9. Select the group you want to add into the grouping from the Potential members
    list. Then press the Add button:


    ![](img/1529021fde33ef551603bbc71587313e_343_0.png)


    10. When you are done press the Back to groupings button.


    Now I''m going to return to the forum I just created and press the Update this
    forum button to go back to the Editing forum page.


    11. Once you are back to the Editing forum page, scroll down the page to the Common
    module settings box. Click on the Show Advanced button in the top-right corner
    of the box:


