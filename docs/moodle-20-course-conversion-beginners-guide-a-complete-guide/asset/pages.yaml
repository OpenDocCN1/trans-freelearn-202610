    # Planning your Moodle lessons carefully


    A final word on lessons: I''m sure you can see that a good Moodle lesson is always
    one that was developed from a good plan. Always start by sketching out your lesson
    first, and don''t try and develop a lesson organically. I''ve seen many try, only
    to fail and then conclude that Moodle lessons are too complicated to use when
    converting to teaching online. Plan well, try not to over-complicate, and ensure
    you keep the course learning goals in mind.


    # Workshop – Peer review and assessment


    The workshop activity isn''t new to Moodle—in versions prior to Moodle 2.x it
    was disabled by default. That said, if you are familiar with previous incarnations
    of the Moodle workshop then you''ll notice quite a few enhancements to the look-and-feel.
    Let''s spend this section taking a brief look.


    What is a workshop? A Moodle workshop is a peer review activity. For example,
    I could have students submit their project work for peer review through Moodle
    and use Moodle to record all of the comments and suggestions class members make
    about each other''s work. I could, if I wish, upload an exemplar and have the
    class comment on just that instead. I can upload examiner''s comments on a project
    and students can then compare their review with those comments. As you can gather,
    it''s a very powerful tool.


    As we will see shortly, the Moodle workshop activity supports three types of review:


    +   ♦ Reviewing uploaded exemplars: Students can review the exemplar and compare
    their review with a reference review (for example, examiner''s comments)'
  merge: -1
  img_proc: true
- pgno: 283
  md: '+   - **Peer review:** Students review each other''s work. Note that students
    can be graded on the quality of their review as well as receiving a grade for
    the work they handed in

    +   - **Self- assessment:** A user can review their own work and receive a grade
    for the quality of that review


    > Note that these types of review aren''t mutually exclusive. You can enable combinations
    (or all) of these options.


    I am a big fan of students commenting on each other''s work. It isn''t part of
    the syllabus just yet, but peer review is becoming an important part of my teaching,
    generally—which, up to now, I''ve been supporting with forums.


    # Time for action – adding a workshop


    +   1. Ensure you have editing turned on and, in the relevant section of your
    course, click on the **Add an activity...** drop-down menu and select **Workshop**
    from the list.

    +   2. Give the activity a name and, if required, provide an introduction:


