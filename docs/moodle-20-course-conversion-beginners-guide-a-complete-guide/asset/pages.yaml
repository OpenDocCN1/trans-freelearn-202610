- pgno: 96
  md: '# Time for action – putting files where we want them


    Moving files is a two-stage process. Firstly, we need to select the files we want
    to move. Then, we need to choose the place we want to move them to. Press the
    **Manage my private files** button to start the process:


    +   1. Select the files you want to move by clicking on the context menu icon
    next to the file''s name, then select **Move...** from the menu:


    ![](img/1529021fde33ef551603bbc71587313e_96_0.png)


    +   2. The **Moving** dialog is displayed. Select the folder you are moving your
    file to by clicking on it, in my case **Handouts**. Make sure you double-click
    the folder to select it:


    ![](img/1529021fde33ef551603bbc71587313e_96_1.png)'
  merge: -1
  img_proc: true
- pgno: 97
  md: '3. Press the **Move** button. You''ve now moved the files to the right place!


    ![](img/1529021fde33ef551603bbc71587313e_97_0.png)


    # What just happened?


    Not only do we know how to get a file uploaded onto the system but we know how
    to get things arranged so that we can easily find files. Of course, it makes more
    sense to create the folder first and then upload directly into that—rather than
    uploading your resources and then attempting to get everything arranged.


    Even though I''m uploading the files to My private files area and our teaching
    colleagues don''t have direct access to this, it''s worth noting that our colleagues
    can get access to copies of these files (we''ll be learning how later in this
    chapter).


    Let''s end this section by looking briefly at how you could organize your private
    files and what might be considered appropriate naming conventions for folders
    and files. Firstly, I''ve created folders for the courses I teach on. Within the
    Backyard Ballistics folder I''ve chosen to put all of my handouts in a Handouts
    folder:


    ![](img/1529021fde33ef551603bbc71587313e_97_1.png)'
  merge: -1
  img_proc: true
- pgno: 98
  md: 'Instead, you might want to organize your files into folders named ''Week 1'',
    ''Week 2'' or ''Topic 1'', ''Topic 2'', and so on, depending on whether your course
    is set to weekly or topics format. That way you can quickly identify which files
    need to be placed in which topics/weeks. Creating a handouts folder would be good
    if you are re-using the same resources in different weeks/topics. Again, it depends
    on how many files people have to upload.


    # # Dishing out the work


    I''ve now uploaded my files, got My private files area organized, and now I want
    to give them out to my students. No one else has direct access to My private files
    area, so I have to provide links to files from the course main page.


    > > Remember that making resources available to Moodle users is a two-stage process.
    First of all, files are uploaded to Moodle (as I''ve been demonstrating, to My
    private files area). Then, links to those files are added to the course front
    page.


    So let''s return there now and add a link in our course to one of the files I''ve
    just uploaded.


    # # Time for action – giving students individual files


    +   1. Go to your course page and choose the topic you want to add the file to.
    I''m going to add my handout to Topic 1 (**Getting Things Flying...**).

    +   2. Are the **Add a resource...** and **Add an activity...** options visible
    on your course main page?


    ![](img/1529021fde33ef551603bbc71587313e_98_0.png)'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'If not then you need to turn editing on (press the **Turn editing on** button—usually
    in the top right-hand corner of the page).


    +   3. Click on **Add a resource** and choose **File**. This displays the **Adding
    a new File...** page:


    ![](img/1529021fde33ef551603bbc71587313e_99_0.png)


    +   4. In the General box, I''m going to call this resource **Sources of Energy**
    (that''s what the handout is about). You''ll also need to type in a description
    (note this can be as short or long as you like):


    ![](img/1529021fde33ef551603bbc71587313e_99_1.png)'
  merge: -1
  img_proc: true
- pgno: 100
  md: '# Adding Documents and Handouts


    5. In the Content box press the Add... button:


    ![](img/1529021fde33ef551603bbc71587313e_100_0.png)


    6. The File picker dialog window is displayed. Click on the Private files link
    on the left of the dialog:


    ![](img/1529021fde33ef551603bbc71587313e_100_1.png)'
