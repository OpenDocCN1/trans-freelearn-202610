    +   3. Press the **Show Advanced** button. You will see a few extra settings appear.
    I''m not going to worry about them now, but feel free to investigate. Remember:
    you won''t break anything and you can always refer to Moodle Docs for guidance.

    +   4. When you are done press the **Save changes** button.

    +   5. I''m now going to repeat the process and create a category called "Marks
    for Moodle activities". My tree of categories and items now looks like this:


    ![](img/1529021fde33ef551603bbc71587313e_347_0.png)


    +   6. Using the move icon (or by clicking and dragging, depending on how your
    site is set up) I can then move the Moodle activities under the "Marks for Moodle
    activities" category in just the same way as we can shuffle activities and resources
    about in a Moodle course. Here''s how my tree looks now:


