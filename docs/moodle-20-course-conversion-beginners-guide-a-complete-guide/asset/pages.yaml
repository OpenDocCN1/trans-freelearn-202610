    3. To configure the new HTML block, click on the configuration icon:


    ![](img/1529021fde33ef551603bbc71587313e_182_2.png)


    4. And you''re taken to the Configuring a (new HTML block) block page. Give your
    new block a title and then add in your content. When you''re done, press the Save
    changes button, Here''s my new welcome message (including an animated GIF):'
