    # What just happened?


    We have just seen how easy it is to take the code provided by YouTube and embed
    a special YouTube video player into a Moodle web page. That''s great, because
    if we want all students to watch the video at the same time then YouTube is geared
    to handle lots of people viewing the same video simultaneously. The problem is
