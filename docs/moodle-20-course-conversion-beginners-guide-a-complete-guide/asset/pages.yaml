    ![](img/1529021fde33ef551603bbc71587313e_292_0.png)


    In the **Grades given** column, I can study the reviews each student has given
    (review the reviews, as it were) and, if I think they are comparable and fair,
    I can click on the **Re-calculate grades** button to complete the grading process:'
  merge: -1
  img_proc: true
- pgno: 293
  md: '![](img/1529021fde33ef551603bbc71587313e_293_0.png)


    The final step—to indicate to all that the workshop is complete—is to click on
    the Switch phase icon just beneath the Closed column heading in the planner.


    > You can switch from one phase to another at any time (including switching back
    to previous phases) by clicking on the relevant Switch phase icon in the workshop
    planner.


    This section has given the briefest of overviews of a very powerful teaching tool.
    For more information on the Moodle workshop activity, please refer to the Moodle
    docs at `http://docs.moodle.org/20/en/Workshop_module`.'
