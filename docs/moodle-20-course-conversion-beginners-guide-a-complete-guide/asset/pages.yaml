- pgno: 165
  md: '# # Moodle Makeover


    We have come a long way over the first five chapters. We''ve got all of our resources
    uploaded into Moodle, and in the previous chapter we saw just how easy it is to
    move from static, text, and image-based resources to turning our courses into
    a complete multimedia experience. In fact, you could almost invite students in
    now and I''m sure they would be impressed with the results of our work so far.


    Because we''ve been working so hard, and before we move on to the second half
    of the book and look at converting our quizzes and student projects, let''s take
    a break to look at techniques that build on what we have learned and achieved
    so far, techniques to make a Moodle course even more absorbing and fun. Reworking
    and rearranging the resources and improving the presentation will definitely improve
    the functionality and ease of use. In this chapter we shall:


    +   - Do more than make each topic a long list of resources. Use the label resource
    and Moodle''s indenting tool to change this:


    ![](img/1529021fde33ef551603bbc71587313e_165_0.png)'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'to this:


    ![](img/1529021fde33ef551603bbc71587313e_166_0.png)


    +   - Find out where we can get lots of free images for our courses

    +   - Explore different ways to use HTML to make our courses even more engaging

    +   - Include a talking character, an animated avatar, using Voki.com:


    ![](img/1529021fde33ef551603bbc71587313e_166_1.png)


    +   - Back up all of the work we have done so far. There would be nothing worse
    than to lose all of our hard work to a computer glitch!


    In Chapter 3, Adding Documents and Handouts, we imported our documents and handouts
    to our Private files area, and saw how easy it was to sort and organize them.
    And so far I''ve been adding links to resources on the course main page without
    much thought as to how the links themselves are organized on the page. Let''s
    get that sorted now!'
  merge: -1
  img_proc: true
- pgno: 167
  md: '# Arranging your resources


    Why is it important to spend a little time arranging resources in a topic? Isn''t
    it all eye candy? Let''s take a look at my Topic 1:


    ![](img/1529021fde33ef551603bbc71587313e_167_0.png)


    I''ve got a nice colorful title, some text to introduce the topic, and then a
    long list of resources which, quite honestly, looks just like the list of files
    in the shared drive I already use to distribute my documents and handouts to students.
    What if the topic looked like the following screenshot:


    ![](img/1529021fde33ef551603bbc71587313e_167_1.png)'
