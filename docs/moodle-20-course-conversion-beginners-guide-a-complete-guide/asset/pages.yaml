- pgno: 128
  md: '# # Summary


    I think you''ll agree that we are getting on great guns with our Moodle courses.
    Just in this single chapter we:


    +   - Uploaded files to Moodle and organized them effectively

    +   - Learned how to present documents and handouts to students

    +   - Uploaded images and included them in text

    +   - Included PowerPoint presentations, and learned what to do if students had
    problems viewing them

    +   - Learned how to work with a wiki

    +   - Now know which types of files are best to include in a course, and how to
    create them


    We''ve now got our courses populated with static content. At this stage, you might
    even want to introduce students onto your course. They won''t fail to be impressed
    with the work you have done so far! Remember, if you have set an enrolment key,
    you will need to give this out to your students.


    In the next chapter we will be learning how to make our courses more engaging
    and entertaining with sound, video, and multimedia.'
  merge: -1
  img_proc: true
- pgno: 129
  md: '# 4


    # Sound and Vision—Including Multimedia Content


    > In the previous chapters, we saw how easy it is to hand out work through Moodle.
    That''s great for a start, but I want to make my course as much entertaining as
    it is practical. I''ve also got lots of multimedia content I want to include:
    for instance, I''ve got lots of audio and video files—many of them on file sharing
    websites such as YouTube.


    Let''s build on what we learned in Chapter 3, Adding Documents and Handouts with,
    in this chapter, learning the best ways of importing sound and vision into our
    courses. In this chapter you will learn how to:


    +   - Import audio and video into your course

    +   - Experience the different ways Moodle plays your multimedia files, and appreciate
    the pros and cons of each

    +   - Embed videos from other websites, such as YouTube, TeacherTube, and Vimeo

    +   - Create a photo montage using Slide.com


    Recall that in Chapter 3, Adding Documents and Handouts we uploaded our documents
    and handouts to our own, personal ''My private files'' area and inserted links
    to those files on our course pages. We also learned how to include files from
    other repositories—remember that what repositories we have available to us will
    depend on how our Moodle have been configured.'
  merge: -1
  img_proc: true
- pgno: 130
  md: '# Sound and Vision—Including Multimedia Content


    We start this chapter by creating links from our course main page directly to
    external websites. You might be forgiven for thinking that I should have covered
    creating links to external websites on the course front page in previous chapters.
    I''ve delayed the discussion to this chapter because it forms the basis of the
    work we are now going to carry out. It is worth mentioning, before we begin, that
    directly linking to external websites is an easy way for us to use Moodle to create
    engaging multimedia courses—and it is the first step to moving away from using
    Moodle as a simple resource repository.


    # Linking to other websites


    If you are anything like me then you''ve got a list of websites that include lots
    of exciting content, which you want to include in your course. I''ve got all of
    mine saved in a Word document, but let''s look at getting these transferred over
    to Moodle. Here are my options:


    +   - Simply upload the Word document. We learned how to do this in *Chapter 3,
    Adding Documents and Handouts*.

    +   - Make a list of links in the course main page.

    +   - Create a Moodle web page and include the links in that.


    We''ve already looked at the problems of uploading a Word document in the previous
    chapter, and although convenient, it would be far better to have my list of links
    in Moodle, rather than in a file that is, technically, outside of Moodle. Here''s
    why:


    +   - Students may not have the correct file viewer installed on their computer
    (an important issue we covered in previous chapters)

    +   - We make it easier for students to find the links

    +   - I can mix links to external websites and links to files I''ve uploaded,
    and do so seamlessly

    +   - If we link to external websites from Moodle, we can monitor which students
    have visited which websites


    Instead, let''s start by including the links directly on the course main page.


    # Adding a link to the course main page


    It''s time for action. Let''s see how easy it is to add links to external websites
    on the course main page.'
  merge: -1
  img_proc: true
- pgno: 131
  md: <!-- no content -->
  merge: -1
  img_proc: true
