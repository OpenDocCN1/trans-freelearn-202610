- pgno: 294
  md: '# Wiki


    I first showed you the Moodle wiki in Chapter 3, Adding Documents and Handouts
    when we saw that you could convert departmental documentation over to Moodle.
    Wiki is Hawaiian for "quick". People often hear the word wiki and think that a
    wiki has to be an online encyclopedia (for that, Wikipedia has a lot to answer
    for). But that simply isn''t the case. Wikis were designed to:


    +   - Allow users to work on web pages collaboratively

    +     and

    +   - Create web pages quickly (hence the name)


    If you are going to collaborate with others on a web page then there must be some
    sort of audit trail, so you can tell who made what change and when. That''s no
    problem: a system for doing so is already built into Moodle''s wiki system. To
    allow you to create web pages quickly, Moodle''s wiki system has it''s own built-in
    formatting language for you to use. But don''t let the thought of that put you
    off. As you''ll see in this section, the formatting is very simple.


    # What are my wiki options


    Even though there is one wiki system built into Moodle, you can use it in two
    different ways:


    +   1. Collaborative wiki. You have just one wiki with all of you (teachers and
    students) working on it together.

    +   2. Individual wiki. Each student has their own wiki that only they and you
    as a teacher can view and edit. Students can neither view nor edit each other''s
    wikis.


    # What can you use a wiki for


    Here are just a few examples of using wikis in a course:


    +   - Collaborative project plans and project write-ups, using a Collaborative
    wiki.

    +   - Student diaries, using an Individual wiki.

    +   - Project write-ups, either using a Collaborative or Individual wiki.

    +   - Lists of web links. Rather than having to maintain a text document (which
    would need uploading every time you made a change), have your list of web links
    kept in a wiki instead.

    +   - Characters from a novel, a Group wiki developed by students in the class.'
  merge: -1
  img_proc: true
- pgno: 295
  md: 'As far as managing a wiki is concerned, aside from making sure the content
    is suitable and students don’t start making silly entries, the only issue we need
    to be aware of is the possibility of a tug of war ensuing between two students
    trying to edit a wiki page. It may happen that one student makes a change that
    the other doesn’t like, and they repeatedly try to alter each other’s work, back
    and forth. It sounds strange but it often happens.


    On my course, when it comes to the final practical assignment, all of the students
    on my course have to complete their projects within two weeks and as they do so
    they need to fill out a student record. Handling that paperwork is awkward: unfortunately
    students often lose it, and if they don’t manage to lose it then by the time they
    hand it in, the record sheets look like they have been savaged by wild dogs. I’m
    going to use a Student wiki to convert this component of my course over to Moodle.
    Let’s spend the rest of this section learning how.


    # Adding a wiki


    The first task is to add a wiki to our courses. Because I want each one of my
    pupils to have their own wiki (each has their own record card), I also know that
    this is going to be an Individual wiki:


    # Time for action – adding a wiki


    +   1. Choose the topic you want to add your new wiki to, click on **Add an activity...**
    and select **Wiki** from the list.

    +   2. The name of my new wiki is going to be "Student Diary". Enter a name for
    your wiki.

    +   3. Write a brief summary of the wiki. This is shown above every page. Try
    to keep it short and descriptive.

    +   4. I’m going to click on the **Type** option and select **Individual** from
    the list. Choose the type of wiki that best suits your needs.'
  merge: -1
  img_proc: true
- pgno: 296
  md: '5. Scroll to the bottom of the page and press the Save and return to course
    button. You''ll see your new wiki listed on the course front page:


    ![](img/1529021fde33ef551603bbc71587313e_296_0.png)


    # What just happened?


    I now have a new wiki. If I click on the link to the wiki on the course front
    page, I am presented with an option to create a new empty page and give it a name:


    ![](img/1529021fde33ef551603bbc71587313e_296_1.png)'
  merge: -1
  img_proc: true
- pgno: 297
  md: 'I''m going to call my new page "Student Diary Introduction" (rather than "First
    page name"), leave the Format as the default HTML format, and press the Create
    page button.


    So how do you actually start editing a wiki?


    # Editing a wiki page


    The page we have been presented with is basically the first page of the wiki.
    All pages will be linked from this "front page", as it were. Therefore, it is
    sometimes best to think of this initial page as a contents page, and perhaps even
    structure it as such. How do you edit it? Simply type in the text you want using
    the Editor in the usual way.


    > Remember that because we are using the Moodle Editor to edit wiki pages, you
    can make wiki pages engaging and entertaining by using the skills and experience
    you have gained as you have been working through this book.


    # Creating a new page


    Creating a new wiki page is easy—if you know how. Have you got a fragment of text
    that you want to turn into a link to a new page? Simply surround the word or text
    with double square brackets [[ ]], like so:


    ![](img/1529021fde33ef551603bbc71587313e_297_0.png)'
  merge: -1
  img_proc: true
- pgno: 298
  md: 'Then, click the **Save** button immediately below the editor:


    ![](img/1529021fde33ef551603bbc71587313e_298_0.png)


    You can see that the phrase I surrounded in square brackets is now highlighted.
    That highlight is in fact a link (hover the mouse pointer over it to see what
    I mean). Click on that link now. You''ll see that immediately a new page is about
    to be created. Press the **Create page** button and you are ready to start adding
    new content to it:


    ![](img/1529021fde33ef551603bbc71587313e_298_1.png)


    And that''s how easy it is to create a new wiki page.'
  merge: -1
  img_proc: true
- pgno: 299
  md: '# Viewing a page''s history


    If wiki pages are easy to change and we are brave enough to let our students start
    editing them, then we certainly want to know who has been changing them and when.
    Luckily that''s no problem with the Moodle wiki system: simply click on the History
    tab at the top of the page to see a complete audit trail.


    In the history page, you can:


    +   - See at a glance who has been making changes to a page—and when they made
    them

    +   - Compare different versions of a page (to see what has been changed)

    +   - Revert back to a specific version


    We''ve learned how easy it is to use a wiki, and that''s great, but I still have
    to convert my student record sheets over to Moodle and to do that I need to specify
    a template that my students can fill in using a Moodle wiki. I''ve got the original
    document in Word format, so let''s convert that to a Moodle wiki template now.


    # Have a go hero – there''s more to a wiki than just teaching


    See Chapter 3, Adding Document and Handouts, for another wiki idea. At the end
    of that chapter, we saw how you could convert your departmental documentation
    into a Moodle wiki. By doing so, not only is it far easier to make the document
    available to staff when it is online, being a wiki makes it easier to modify the
    document. And when you do modify the document each page has its own audit trail,
    so you can easily see who modified the document and when.


    # Glossary activity


    I''ve got a glossary of ballistics-related terms that I currently give to students
    as part of their welcome pack. It''s basically a sheet of paper I hand out to
    my students that I wrote in Microsoft Word years ago. Luckily, I can easily convert
    this over to Moodle. What''s great about converting a glossary over to Moodle
    is that:


    +   - A glossary entry can be much more than just text: you can use the skills
    and experience you have learned as you have worked through this book to include
    graphics and embed multimedia.

    +   - Students can add entries to the glossary. By converting to Moodle, I can
    make creating and enhancing my glossary a class activity. Moodle further supports
    this by allowing me to grade glossary entries.'
  merge: -1
  img_proc: true
- pgno: 300
  md: '+   - Moodle can be configured so that wherever a word or phrase appears on
    my course that is included in the glossary, then that text is highlighted, I can
    click on it, and the glossary entry is displayed. It''s called glossary auto-linking,
    and we''ll be looking at setting this up later in this section.

    +   - Glossaries can be imported and exported, meaning they are easy to share
    and develop with colleagues.


    A glossary doesn''t have to be just a dictionary of course-related technical terms.
    Here are some examples of good Moodle glossary use:


    +   - Language dictionaries. For example, use auto-linking to highlight words
    and phrases in English and populate a glossary with the Spanish translations.
    The glossary entry could include an embedded audio file of the word translated,
    perhaps then followed by a sentence containing the word in context.

    +   - Glossary of favorite websites. Another alternative to the uploaded Word
    document or the wiki is a glossary of web links.

    +   - Quiz questions. Have your students add glossary entries containing quiz
    questions they have written. Here''s the clever part: you can export the glossary
    and then, with a little adjustment to the exported file, import the questions
    back into your quiz question bank.

    +   - Glossary explaining the meaning of terms students need to understand when
    they are writing assignments—for example, the meaning of "interpret" or "demonstrate
    your understanding" in the context of writing up their reports.


    Let''s start converting my glossary to Moodle right now.


    # Adding a glossary


    Adding a glossary is easy. Configuration is a little more subtle, but I''ll explain
    things as we are going along. I''ll start by mentioning that there are two types
    of glossary that you can include in a course:


    +   - **Main glossary**: You are only allowed one per course and students aren''t
    allowed to edit it, only teachers.

    +   - **Secondary glossary**: You can have as many as you like and anyone can
    edit them.


    Why have Secondary and Main glossaries? That''s so that students can add to Secondary
    glossaries and then teachers can take the best entries from them and include those
    entries in the Main glossary. You don''t have to use glossaries in this fashion:
    if you just want a basic glossary then stick to Secondary glossaries.


    With that explained, let''s now get on and add a Secondary glossary into our course—a
    glossary that anyone can edit.'
  merge: -1
  img_proc: true
- pgno: 301
  md: "# # Time for action – including a glossary\n\n+   1. Ensuring that editing\
    \ is turned on, choose the topic you want to add your glossary to, click on **Add\
    \ an activity...** and select **Glossary** from the list.\n+   \n+   2. You need\
    \ to give your glossary a name and describe its purpose. Mine is a glossary of\
    \ ballistics-related terms to help you as you work through the course. In the\
    \ description, I'm also going to mention that anyone can add to this glossary.\n\
    +   \n+   3. We can leave the rest of the glossary configuration settings set\
    \ to the default, but if you want to experiment with them, remember that you won't\
    \ break anything. When you are happy with the settings, press the **Save and display**\
    \ button. Your new glossary is now ready to have entries added to it:\n\n![](img/1529021fde33ef551603bbc71587313e_301_0.png)\n\
    \n# ## What just happened?\n\nWe've just completed adding a glossary to our course—a\
    \ Secondary glossary that everyone can add entries too, and I've also configured\
    \ it so that entries can be rated by everyone.\n\nHow do you add entries into\
    \ the glossary?"
  merge: -1
  img_proc: true
- pgno: 302
  md: '# Time for action – adding a glossary entry


    +   1. Press the **Add a new entry** button.

    +   2. The concept is the word or phrase that you want to explain.

    +   3. Use the **Definition box** to give your explanation. Remember that you
    can use the skills you have learned so far to make a simple glossary entry a truly
    multimedia experience.

    +   4. Do you want this particular glossary entry auto-linked, so that wherever
    it appears in your course a student can click on it to display your explanation?
    If so, then make sure **This entry should be automatically linked** is ticked.

    +   5. When you are ready, scroll down to the bottom of the page and press the
    **Save changes** button. You now have a new entry added to your glossary:


    ![](img/1529021fde33ef551603bbc71587313e_302_0.png)


    # What just happened?


    We''ve just seen how easy it is to add an entry to the glossary. Try to keep glossary
    entries concise. If your glossary entries start to become more complex than just
    a few sentences, an image or two, and perhaps a little embedded multimedia, then
    think about using a wiki instead.'
  merge: -1
  img_proc: true
- pgno: 303
  md: '# # Glossary auto-linking


    When you added your first glossary entry, did you enable auto-linking for that
    entry? If everything worked as it should then whenever the concept (the word or
    phrase that represents your glossary entry) appears in your course, then it is
    highlighted (by default) with a subtle gray background:


    > > As the ball flies up into the air kinetic energy (KE) is tranferred into gravitational
    potential energy (GPE). When all of the KE is converted to GPE the ball stops
    momentarily in mid-air.


    Click on the highlighted text and the glossary entry will be displayed in a pop-up
    window.


    But there are situations when auto-linking doesn''t work:


    +   *   When the administrator hasn''t yet enabled glossary auto-linking for your
    site. Check out the *Ask the admin* section at the end of this chapter if this
    is happening to you.

    +   *   Auto-linking doesn''t work on texts on external websites and on texts
    in uploaded documents. Moodle doesn''t know what is actually inside those documents
    so it can''t link your glossary to them.


    # # Glossary block


    If you return to your course front page and, with editing turned on, you can add
    a new **Random glossary entry block** to the course front page. This block does
    as its name suggests and chooses an entry from the glossary you specify at random
    and displays it. If your glossary contains inspirational quotes, the biographies
    of characters from a book your class is studying, or an illustrated vocabulary,
    then the random glossary entry block is an engaging and entertaining tool.


    # # Have a go hero - allowing students to rate entries


    Because students are adding entries to this glossary, I''m going to allow all
    entries to be rated by them (I need to be vigilant and ensure that there is no
    favoritism or special deals going on), with a maximum "grade" being a mark out
    of 5.


    Click on **Edit settings**, under **Glossary administration** in the **Settings**
    block. In the **Ratings** box, select an aggregate type and then ensure the **Scale**
    is out of 5.'
  merge: -1
  img_proc: true
- pgno: 304
  md: 'To allow students to rate entries, click on Permissions in the Settings block,
    scroll down to the Rate entries capability (listed under "Activities: Glossary")
    and press the Allow icon:


    ![](img/1529021fde33ef551603bbc71587313e_304_0.png)


    On the next page, ensure Student is selected in the Select role drop-down menu
    and press the Allow button.


    # Choice


    A simple, powerful, but often overlooked activity: the choice activity.


    I often use straw polls in my class to stimulate thinking. For example: If I light
    a candle in space what shape will the flame take? It then display a list of choices
    on the interactive white board. Take a vote on each choice, and spend time discussing
    each answer.


    What are the benefits of converting such a simple activity over to Moodle? Here
    are just a few:


    +   ♦ It makes it easier to record which student makes which choice: voting in
    straw polls can be either anonymous or named

    +   ♦ Choices can be updated, allowing students to change their mind if they are
    given a little time to think about their answer

    +   ♦ It is easy to see which students didn''t answer the question at all


    So how do I go about converting my candle question over to Moodle?


    # Time for action – adding a choice activity


    +   1. With editing turned on, choose a topic, then click on Add an activity...
    and select Choice from the list.

    +   2. Give the new activity a name.

    +   3. Type a question into the Choice text box.'
  merge: -1
  img_proc: true
- pgno: 305
  md: '4. Use the **Choice** boxes to specify the possible answers you want your students
    to choose from.


    5. In the **Miscellaneous Settings** box, you can configure how results are displayed,
    if results are to be displayed to students, and—if they are given to students—you
    can specify whether the results are to be anonymous:


    ![](img/1529021fde33ef551603bbc71587313e_305_0.png)


    6. When you are finished, press the **Save changes** button at the bottom of the
    page.


    # What just happened?


    We''ve just added a poll to our course using a choice activity. I use straw polls
    to stimulates** link in the top right-hand corner of the page:


    ![](img/1529021fde33ef551603bbc71587313e_305_1.png)'
  merge: -1
  img_proc: true
- pgno: 306
  md: '# A learning journey


    There is nothing at all wrong with a Moodle course starting as a list of links
    to other resources, for example resources uploaded to Moodle or those that exist
    already somewhere on the Internet—indeed, that''s how we began this book. As we
    want to include a quiz, or a forum, or a peer review workshop, then it becomes
    more critical that, rather than our students dipping in to a basin of knowledge
    and spooning out what they fancy, we would want to be careful that they make more
    of a formal "learning journey". How do we know that students have viewed a resource
    or attempted a particular activity? That''s the purpose of the completion tracking
    feature. How do we guide our learners on their learning journey? That''s the purpose
    of conditional activities. Completion tracking and conditional activities are
    described in the next two sections.


    # Completion tracking


    There are two parts to completion tracking:


    +   1. Completing a resource or activity

    +   2. Completing the course


    Let''s configure our Moodle course so that when students themselves consider that
    they are ready to move on from a resource or activity, they can mark it as "completed".


    > At the time of writing, the completion tracking feature is disabled by default.
    You’ll need to ask your Moodle administrator to enable this functionality for
    you. See the *Ask the admin* section at the end of this chapter.


    Return to your Moodle course main page and in the **Settings** block, under **Course
    administration**, click on **Edit settings**. Scroll down to the Student progress
    section. Click on the **Completion tracking** drop-down menu and select **Enabled,
    control via completion and activity settings** from the list:


    ![](img/1529021fde33ef551603bbc71587313e_306_0.png)'
  merge: -1
  img_proc: true
- pgno: 307
  md: 'I''m not going to enforce course (rather than activity—we''ll come on to that
    shortly) completion tracking on my course, put simply; mine isn''t that kind of
    course. There are, however, good examples of where you would want course completion
    tracking enabled by default: one is any Moodle course in work-based learning (rather
    than in a school). Imagine my course was on manual handling—a mandatory course
    that all new employees had to sit through... and pass. That our students had completed
    every activity and had indicated that they had read and digested every static
    resource (through the completion tracking feature) then becomes an important part
    of their employee record.


    Scroll down to the bottom of the Edit course settings page and press the Save
    changes button.


    In the Settings block, under Course administration a new link has been added:
    Completion tracking. Click on that now to display the Edit course completion settings
    page.


    Because I''m not going to force the completion tracking feature on my students
    from the moment they enroll, I''m going to enable the Manual self completion feature:


    ![](img/1529021fde33ef551603bbc71587313e_307_0.png)


    and that''s it for this screen. For more information on the many other settings
    on this page, remember to check out the Moodle docs at http://docs.moodle.org/20/en/course/completion.
    I''m going to scroll down to the bottom of the page and press the Save changes
    button.


    The final step is to add the Self completion block onto the course page, because
    without it course completion tracking isn''t fully enabled the way I want it.
    Ensure you have editing turned on and from the Add a block select Self completion
    from the drop-down list:


    ![](img/1529021fde33ef551603bbc71587313e_307_1.png)'
  merge: -1
  img_proc: true
- pgno: 308
  md: '# Enhancing your Teaching


    Once added, I''m going to move the Completion tracking block to the left of the
    page, just under the Navigation block:


    ![](img/1529021fde33ef551603bbc71587313e_308_0.png)


    That now allows students to state (in Moodle) when they consider that they have
    finished the course. We''ll come back to this block later in this chapter. But
    what about individual activities? That needs to be configured on a per activity
    basis. For example, how do I allow students to mark that they have read the Sources
    of Energy handout?


    # Time for action – enabling completion tracking on an activity


    +   1. With editing turned on, click on the Update icon next to the Sources of
    Energy link.

    +   2. Now that we have completion tracking enabled on our course, we can now
    scroll down to the **Activity completion** section:


    ![](img/1529021fde33ef551603bbc71587313e_308_1.png)'
  merge: -1
  img_proc: true
- pgno: 309
  md: '3. From the Completion tracking drop-down menu, I''m going to select Students
    can manually mark the activity as completed:


    ![](img/1529021fde33ef551603bbc71587313e_309_0.png)


    4. Scroll down to the bottom of the page and press the Save and return to course
    button.


    5. That''s it! We''re done.


    # What just happened?


    Now we''ve returned to the course page, track across to the right of the Sources
    of Energy resource and you''ll see a little gray check mark:


    ![](img/1529021fde33ef551603bbc71587313e_309_1.png)


    This is what completion tracking looks like from a student''s point of view. For
    example, once he considers it read, John Smith can click on the checkbox:


    ![](img/1529021fde33ef551603bbc71587313e_309_2.png)'
  merge: -1
  img_proc: true
- pgno: 310
  md: 'And I can track which students have indicated they have read the Sources of
    Energy handout through course reports. In the Navigation block, under My courses,
    click on the short name for your course and select Reports. Then, click on Activity
    completion:


    ![](img/1529021fde33ef551603bbc71587313e_310_0.png)


    You''ll see a list of your enrolled students and an indication of who has completed
    which activity:


    ![](img/1529021fde33ef551603bbc71587313e_310_1.png)'
  merge: -1
  img_proc: true
- pgno: 311
  md: 'Check out the activity completion report download options (see previous screenshot).
    These are really useful if you need to analyse activity completion data in more
    detail, for example in Excel.


    # Automatic activity completion


    In my course, I''m happy for my students to indicate that they have completed
    an activity. The dynamic in my group of students is such that it quickly becomes
    obvious when someone hasn''t done their homework (mainly due to the fact that
    it''s a small group). What about having Moodle mark an activity as complete? Moodle
    can automatically mark an activity as complete but, obviously, what you define
    as "complete" depends on the activity. For example, for my Sources of Energy handout,
    Moodle can record the activity as complete when a student has viewed the handout:


    ![](img/1529021fde33ef551603bbc71587313e_311_0.png)


    However, for a forum activity we can specify the number of posts a student must
    make in order to "complete" the task. We can also distinguish between starting
    new discussions and replying to other posts:


    ![](img/1529021fde33ef551603bbc71587313e_311_1.png)'
  merge: -1
  img_proc: true
- pgno: 312
  md: 'Note that we can also specify a completion deadline to really keep our students
    on their toes.


    Rather than attempting to describe the raft of different completion options for
    all of the resources and activities available in Moodle, I''m going to direct
    you to the Moodle docs at http://docs.moodle.org/20/en/Teacher_documentation.


    # More on course completion


    I have my course configured so that students can indicate when they think they
    have completed it—by clicking on **Complete course** in the **Self completion**
    block:


    ![](img/1529021fde33ef551603bbc71587313e_312_0.png)


    Clicking on the link allows the student to specify whether they have completed
    the course (two buttons are displayed, "Yes" and "No"). But now that I have started
    to configure activity completion on individual tasks in my course (for example,
    reading the Sources of Energy handout and posting to a forum), now I can, if I
    wish, configure automatic course completion. In the **Settings** block, under
    **Course administration**, click on **Completion tracking**. Scroll down to the
    **Activities completed** and you will see listed those tasks that have activity
    completion enabled:


    ![](img/1529021fde33ef551603bbc71587313e_312_1.png)


    Note that students can still record that they have completed the course if you
    leave the Self completion block on your course page.'
  merge: -1
  img_proc: true
- pgno: 313
  md: '# Conditional activities


    Of course, guided learning isn''t just about us insisting that our learners have
    to understand one concept before being allowed to attempt an activity (for example,
    there''s no point trying to learn about calculus if you don''t understand rates
    of change). In much the same way that in the classroom we guide our students to
    other activities they might find interesting—or will enrich their current understanding—we
    can do the same in Moodle. Also, don''t necessarily think of conditional activities
    as being a replacement for the lesson activity. Lessons are primary for exploring
    scenarios. Conditional activities are for learning journeys.


    So, how do we configure access to one activity being conditional on completing
    another? Firstly, you have to ensure that conditional activities is enabled on
    your Moodle. Check out the Ask the admin section at the end of this chapter. Let''s
    assume I want to ensure students have read the Sources of Energy handout before
    they get access to the Firing a bullet from a gun link:


    ![](img/1529021fde33ef551603bbc71587313e_313_0.png)


    We can control access to tasks based on grade, date, or completion. I want to
    ensure that the Sources on Energy handout has (at the very least) been clicked
    on to view so I''m going to configure access to Firing a bullet from a gun based
    on the student having viewed Sources of Energy. Note that I''ll need Activity
