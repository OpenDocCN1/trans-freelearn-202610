- pgno: 315
  md: '5. We can see that access to the Firing a bullet from a gun resource is now
    restricted:


    ![](img/1529021fde33ef551603bbc71587313e_315_0.png)


    # ## What just happened?


    I''ve just configured access to a resource to be conditional on having viewed
    another resource. As you can imagine, there are a myriad of ways of configuring
    conditional activities so I thought it best to show you the simplest kind of controlling
    access—meaning you can''t do A without attempting B.


    Notice that you can configure more than one condition – meaning you can''t access
    A without having attempted X, Y, and Z. Or the grade condition of A must be above
    a certain level and you have attempted to access B.


    Like all journeys, the recommendation is that you plan your student''s learning
    journey before you begin configuring it in Moodle.


    # ## Have a go hero – only allowing access to resources and activities when learners
    have agreed with the rules


    It makes sense to prevent your learners from accessing resources and activities
    until they''ve agreed to the class rules. Have a go at configuring your course
    to implement this restriction.


    # ## Ask the admin


    In this section, you''ll find guidance on what to ask your administrator if you
    need to allow teachers to access questions in question banks outside of their
    Moodle course, turn on support for glossary auto-linking, and have completion
    tracking and/or conditional activities enabled in order to present your Moodle
    course.'
  merge: -1
  img_proc: true
- pgno: 316
  md: '# # Allowing teachers access to questions outside of their courses


    Your admin needs to give you the role of teacher at the course category level.
    Your admin will need to:


    +   1. Return to the Settings block and under **Site administration** click on
    **Users | Permissions | Define roles**.

    +   2. Press the **Add a new role** button.

    +   3. Create a new role called **Shared question user**, which can be assigned
    at the Category context:


    ![](img/1529021fde33ef551603bbc71587313e_316_0.png)


    +   4. Scroll down the list of capabilities and Allow:

    +       - moodle/question:add

    +       - moodle/question:useall

    +       - moodle/question:usemine

    +       - moodle/question:editall

    +       - moodle/question:editmine

    +       - moodle/question:viewall

    +       - moodle/question:viewmine

    +       - moodle/question:moveall

    +       - moodle/question:movemine

    +       - moodle/question:managecategory'
