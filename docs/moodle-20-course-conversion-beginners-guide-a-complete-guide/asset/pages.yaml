  md: '![](img/1529021fde33ef551603bbc71587313e_223_0.png)


    # Ask the admin


    Before we can specify core competencies, we need to make sure Moodle Outcomes
    are enabled—and this is a job only our Moodle administrator can do. The setting
    we need is accessed via the **Settings** block under **Site administration**,
    then click on **Advanced features**. Your admin needs to ensure that the **Enable
    outcomes** option is ticked.


    # Summary


    We learned a lot in this chapter about managing student work in Moodle.


    Specifically, we covered:


    +   - How to structure converted projects and assignments online using Moodle.
    We discussed how to add a new topic to a course, and how doing so allows us to
    hide an assignment, and its supporting reference materials, until students are
    ready to begin their project work.

    +   - Matching one of the four Moodle assignment activities to your course assignment
    or project. We discussed how each activity can be used to move homework tasks
    online, as well as more substantial projects.

    +   - How an assignment looks from the student''s point of view. We discussed
    the importance of knowing how students submit assignments, so that you are ready
    to give help and guidance as students begin to work online.

    +   - How to mark assignments online. We saw how easy it is to manage project
    grades in Moodle.


    We also discussed how Moodle can be used to grade core competencies—showing how
    this can be configured on a perassignment basis.


    Now that we''ve learned about managing student work, we''re ready to move on to
    learning how to discuss work with students online—which is the topic of the next
    chapter.'
