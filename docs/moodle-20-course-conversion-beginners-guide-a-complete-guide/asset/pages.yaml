- pgno: 103
  md: '![](img/1529021fde33ef551603bbc71587313e_103_0.png)


    13. Click on the link to the resource and the document should load in a new window.


    # What just happened?


    We''ve learned how to upload a file and how to include it in our course. Note
    that, although students can download a file from My private files area, as the
    name suggests, they can''t upload one. You don''t have to worry about students
    changing your files (if you want to upload a document for students to modify then
    we''ll be looking at this task later in the book).


    # Accessing collections of files


    Imagine you''ve got lots of files you want to provide (say photographs of a school
    trip). I''ve got quite a few photographs of experiments from previous years that
    I''ve carried out with my students that I want to make available. I''ve got those
    images stored in directories—one for each year on my laptop:


    ![](img/1529021fde33ef551603bbc71587313e_103_1.png)'
  merge: -1
  img_proc: true
- pgno: 104
  md: '# Adding Documents and Handouts


    ...and I''ve uploaded them to My private files using the techniques we have learned
    so far:


    ![](img/1529021fde33ef551603bbc71587313e_104_0.png)


    Now I am going to display a link to these files from the course front page. Here''s
    how:


    # Time for action – displaying a folder


    +   1. Choose a topic in your course (I''m going to choose "Basic Rocketry") and
    click on **Add a resource...** (if you don''t see this option then check to see
    whether you have editing turned on).

    +   2. Select **Folder** from the list.

    +   3. Give this new link a name. I''m going to call the link **Jam Jar Jet Practical
    (2010)**. Enter a short description.

    +   4. In the **Content** box, click on the **Add...** button. In the File picker
    dialog click on the **Private files** repository from the list of available repositories
    on the left. Select the files you wish to display. Notice that you''ll need to
    add files one at a time (if you''re an old-time Moodle user then you''ll be used
    to simply choosing a folder in your course files area but you can see that Moodle
    no longer works in this way):'
  merge: -1
  img_proc: true
- pgno: 105
  md: '![](img/1529021fde33ef551603bbc71587313e_105_0.png)


    5. The files to be displayed in the folder will be listed on the Adding a new
    Folder page:


    ![](img/1529021fde33ef551603bbc71587313e_105_1.png)'
  merge: -1
  img_proc: true
- pgno: 106
  md: '6. Click on the Save and return to course button. A new folder will be added
    to your course:


    ![](img/1529021fde33ef551603bbc71587313e_106_0.png)


    7. If I click on my new Jam Jar Jet Practical (2010) link I see this:


    ![](img/1529021fde33ef551603bbc71587313e_106_1.png)


    # What just happened?


    Not only can we provide links to individual files from the course main page, we
    can also gather files into folders. I uploaded all of the images for handing out
    into a single folder in My private files area. Note that the folder I added to
    my course page could have contained files from various folders in My private files.
    There are advantages and disadvantages to doing this. For example, I can now make
    all of my photographs from the 2010 Jam Jar Jet experiments available to students
    without me having to make a link for each one. But, when I open the folder, I
    get a list of files with pretty meaningless names. However, another advantage
    is that students only have read-only access to the files—they can’t upload or
    remove them.'
  merge: -1
  img_proc: true
- pgno: 107
  md: 'A default Moodle installation doesn''t support thumbnails, which can be a problem
    if you''ve just given access to a directory full of images. But don''t worry:
    speak to your Moodle administrator about this and they will be able to install
    one of many image slideshow plugins available from Moodle.org.


    # Repositories


    Moodle is designed to be a virtual learning environment/course management system.
    But there''s nothing wrong with simply using Moodle as a repository to store files:
    one clear advantage is that you can easily control who has access to the files
    and the access can be anytime and anywhere (unlike a shared drive in your school
    or workplace, for instance). Moodle can act like a file repository but, cleverer
    still, Moodle can connect to specially designed file repositories. What do I mean
    by that? Have you ever used YouTube? That''s a repository for video files. Have
    you ever uploaded a picture to Flickr? That''s a repository for images. To understand
    how Moodle can connect to external repositories, let''s take another look at the
    File picker dialog. Recall that the links down the left-hand side of the File
    picker are links to repositories:


    ![](img/1529021fde33ef551603bbc71587313e_107_0.png)'
  merge: -1
  img_proc: true
- pgno: 108
  md: '# Adding Documents and Handouts


    You might well see more links to "repositories" in your File picker. For instance,
    the photo-sharing website Flickr (http://www.flickr.com) can be configured as
    a repository. Do you use Dropbox (http://www.dropbox.com) to share files between
    home and work? Our school admin set one up for us so that staff in our department
    can share files—and access them easily from home, too. If you''ve something similar
    then Dropbox can be added as a repository, too. If I ask my Moodle admin to enable
    the Flickr and Dropbox repositories in Moodle, then my File picker now looks like
    this:


    ![](img/1529021fde33ef551603bbc71587313e_108_0.png)


    I could now, if I want, include files from Flickr in the folder I created in the
    previous Time for action section:


    ![](img/1529021fde33ef551603bbc71587313e_108_1.png)


    I''ve added into the folder the picture of hot air balloons from the Flickr repository.
    It''s worth noting that Moodle has made it''s own "internal" copy of the picture
    and added this copy into the folder (and no, unfortunately we didn''t all get
    to go up in a hot air balloon as part of the Jam Jar Jet experiment).'
  merge: -1
  img_proc: true
- pgno: 109
  md: '# Pop quiz


    Do your students have direct access to your Private files area? How do you provide
    a link to a file in your Private files area?


    # Documents and handouts: Which format


    You could get all of your files uploaded now, provide links in your course main
    page and start letting students in right now if you wanted to. But wait for a
    moment. We haven’t really thought about the kinds of files we should upload.


    Some bits of the following section are, by necessity, a little technical. If there
    is anything you are unsure about then speak to your administrator, technician,
    or IT help desk, if you have one.


    Do you use Microsoft Word to create your documents? Here’s why distributing Microsoft
    Word documents might be a bad idea:


    +   ♦ It’s wrong to assume that students are going to have Word installed on their
    PC.

    +   ♦ If students have an older version of Word than yours installed on their
    PC then they probably won’t be able to open it. This is especially true if the
    document filename ends in .docx. That’s the new(ish) Microsoft Word 2007 format
    which isn’t compatible with previous versions of Word. There is free compatibility
    software available from Microsoft (http://office.microsoft.com/en-us/word/HA100444731033.aspx)
    but you can’t assume that your users will all have that installed—and know how
    to install it if they don’t.


    The solution is to convert your Word document to a format that everyone can open.
    And that’s just some of the issues with Word. Let’s look at the most popular document
    types and investigate how we can convert them into a format that’s just right
    for Moodle.


    # Microsoft Word


    You can see that I’ve potentially done something that might cause me problems
    when one of the first files I uploaded to my course was a Word document. If you
    find you have this problem then one solution is to convert Word documents to Portable
    Document Format (PDF). In the past it’s been quite difficult to create PDF documents
    (basically you had to buy Adobe Acrobat, buy PDF printer software, or try to find
    a decent open source PDF printer).'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'However, today creating PDF documents is becoming easier. If you have Microsoft
    Word 2007 or above, you can install the Save as PDF Add-In, available directly
    from the Microsoft website. OpenOffice, the free alternative to Microsoft Office,
    has a word processor called Writer and this has a built-in option to create PDF
    files (simply select **File | Export As PDF...** from the main menu). If you do
    convert to PDF then it is worth checking the document before you upload it as
    the conversion process can often change the format of the document. Also, if you
    want to create a PDF form then you might need to consider purchasing a dedicated
    PDF creation tool.


    If your student doesn''t have a PDF reader installed on their computer (which
    is highly unlikely) they will be asked by their PC to install one when they try
    to open your PDF document.


    > The Adobe PDF reader can be downloaded from http://get.adobe.com/reader


    If you don''t have access to any sort of PDF creation tool then opt for Rich Text
    Format (RTF). From Word, select **File | Save As...** and from the **File Type**
    menu in the **Save As** dialog, select **Rich Text Format (*.rtf)**. However,
    be aware that document formatting is much more limited if you convert your file
    to RTF. For example, you can''t create RTF forms in the same way as you can with
    PDF documents.


    We''ll be looking at further options for converting Word documents to more Moodle-friendly
    formats later in this chapter.


    # **Images**


    Although there are many image file formats to choose from, the three that really
    only need concern us are JPEG (pronounced "jay-peg"), PNG (pronounced "ping"),
    and GIF (which was meant to be pronounced with a hard "g", as in George, but is
    often spoken with a soft "g" as in Graphics). PNG files are great on the Web for
    line drawings and clip art. If you have any images that include text in them then
    choose PNG (if you save as a JPEG then the text can look all blurred). JPEGs are
    excellent for photographs (the PEG in JPEG stands for Photographic Experts Group,
    so they should know what they are doing when it comes to photographs). GIF was
    one of the first image formats used on the Internet so a web search for images
    will no doubt turn up lots of GIF files—especially animated GIFs.'
  merge: -1
  img_proc: true
- pgno: 111
  md: '> You might also come across the PNG-24 image format.

    > This format is also good for photographs.


    There are so many tools available for converting between different image formats
    I''m simply going to send you in the direction of your administrator, help desk,
    or technician if you aren''t sure which tool to use for converting (if you ask
    there is usually a standard tool that your establishment will expect you to use).


    You don''t have to just provide a link to images from your course front page.
    You can also include them in your text, just like you would in a document. I''ve
    got quite a few images I''ve gathered as part of my Backyard Ballistics course,
    so I''m going to upload those now. Not only that, but I want to include one of
    my images in the "Summary of General" (the unnumbered topic) at the top of the
    page, to make my course front page (hopefully) even more enticing for my students.


    # Time for action – uploading an image and including it in a summary


    +   1. Ensure your image file is in the correct repository (for example, My private
    files or Flickr).

    +   2. Return to your course front page and click on the Summary of General edit
    summary icon.

    +   3. In the editor, open up the Insert Image dialog by clicking on the Insert/edit
    Image button. That''s the button containing the little tree:


    ![](img/1529021fde33ef551603bbc71587313e_111_0.png)'
  merge: -1
  img_proc: true
- pgno: 112
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 113
  md: '![](img/1529021fde33ef551603bbc71587313e_113_0.png)


    # What just happened?


    We''ve just seen how easy it is to include a picture with any text in Moodle.
    We''ll be looking in more detail at how to arrange images in Chapter 5, Moodle
    Makeover. For now, you could try returning to the Insert/edit image dialog and
    taking a look at the settings in the Appearance tab. Have a play with the settings
    and remember: you won''t break anything!


    # Have a go hero – having fun with images


    Return to the Insert/edit image dialog and click on the Advanced tab. You can
    use the Advanced settings to change the image when the mouse pointer moves over
    it and change it again when the mouse pointer moves off it. For example, you could
    reveal the names of characters from a film or play by your students moving the
    mouse pointer over their picture.'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'PowerPoint has become almost the de facto format for teaching materials. The
    big problem is that PowerPoint presentations are big. Often their size more than
    breaks that default 2 MB upload size. The other is that you can''t assume that
    your students can actually open a PowerPoint file and view it (they might not
    have the correct software installed at home).


    Let''s run through the options you have for uploading presentations.


    # # Uploading as-is


    Don''t worry about converting the file to any other format. Just upload the PPT
    file as it is and create a link to it on your course front page. You could also
    save the file as a PowerPoint show (PPS) and upload that as-is. Your students
    will still need a compatible viewer (certainly Microsoft has free viewers available
    for download).


    But what if you find that your presentation is far too big and your students are
    complaining that it is taking an age to download?


    # # Preparing your PowerPoint for Moodle


    Does your presentation contain lots of images? If so, we can use PowerPoint to
    help us keep file sizes small. Let''s see how to achieve this in PowerPoint 2007:


    # # Time for action – compressing images


    +   1. Look through your presentation and find an image (any image will do). Once
    you have found one, click on it. The **Picture Tools** toolbar in the ribbon will
    be indicated in the title bar:


    ![](img/1529021fde33ef551603bbc71587313e_114_0.png)'
  merge: -1
  img_proc: true
- pgno: 115
  md: '2. Click on Picture Tools to display the Format toolbar in the ribbon:


    ![](img/1529021fde33ef551603bbc71587313e_115_0.png)


    3. In the Format toolbar, press the Compress Pictures button:


    ![](img/1529021fde33ef551603bbc71587313e_115_1.png)


    4. The Compress Pictures dialog is displayed. We want to compress and crop all
    the images in the presentation. Ensure that the Apply to selected pictures only
    checkbox is unchecked (because we want to compress all of them) and press the
    Options... button. Ensure you have Automatically perform basic compression on
    save and Delete cropped areas of pictures selected. For maximum image compression
    without any appreciable degrading of image quality, change the resolution to Screen
    (150 ppi):


    ![](img/1529021fde33ef551603bbc71587313e_115_2.png)'
  merge: -1
  img_proc: true
- pgno: 116
  md: '+   5. Press the **OK** button. Press the **OK** button again.

    +   6. That''s it. We''re done!


    # What just happened?


    If oversized, uncompressed images are making your PowerPoint presentations very
    large then we can easily crop and compress images before we hand them out to our
    students.


    If you are still having problems with file size (maybe your presentation doesn''t
    contain large images) then it may be time to think about converting the presentation
    to a different file format before we upload them to Moodle.


    # Converting into documents


    If you use Microsoft Office 2007 or later, or OpenOffice, then export your presentation
    as a PDF file. A good attempt will be made at preserving layout and formatting,
    although you may well lose those pretty animations and effects because we are
    converting to a static format (the technology is changing all the time and it
    is always best to try the conversion to see what the results are).


    For OpenOffice users, select **File | Export As PDF...** from the main menu. In
    Microsoft Office 2007, click on the **Office** button at the top-left corner of
    the screen. Hover the mouse over the **Save As...** option and select **PDF**.
    Note that the special PDF add-in for Office may need to be installed first. If
    it isn''t then follow the on-screen instructions.


    If you want to try converting your PowerPoint to a PDF but you aren''t an OpenOffice
    or Office 2007 user then you could try one of the many PDF printers that are available
    (as freeware, so they won''t cost you anything). A PDF printer works by you selecting
    **File | Print** and then instead of choosing your normal printer you choose the
    PDF printer instead. Rather than producing a hard copy of your presentation this
    "printer" produces a PDF file. If you think this approach is worthy of further
    investigation then it may be worth speaking to your admin.


    If you have an earlier version of Microsoft Office, select **File | Save As...**
    from the main menu to display the **Save As** dialog. Click on the **Save as type
    list** at the bottom of this dialog. You''ll see lots of different options listed.
    To save as a document select **Outline/RTF**. Note that when it says outline it
    means outline. Not only will you lose all of your pretty animations and effects
    but you''ll also lose all of your formatting and images, basically leaving you
    with raw text (and you may also lose your raw text, depending on how the text
    was placed on the page). Treat saving your document as an RTF file as the option
    of last resort.'
  merge: -1
  img_proc: true
- pgno: 117
  md: '# Converting into images


    This is a useful option if you don''t want your students to be able to copy and
    paste text easily.


    In all versions of Microsoft Office, check out the Save as type options in the
    Save As dialog.


    In OpenOffice, select File | Export... from the main menu. Click on the File format
    list to display the different image options.


    In both OpenOffice and Microsoft Office, if you are saving as an image then remember
    to chose between PNG and JPEG (see the earlier discussion on images on why these
    are the best types out of all of your options to choose, and how to choose between
    them).


    # Pop quiz


    The size of PowerPoint files can be greatly reduced by cropping and compressing
    any images contained in the presentation. Can you remember the steps to compress
    images?


    # Converting into web pages


    This option is a little more technical, but can be worth it. Saving as web pages
    in both Microsoft Office and OpenOffice is easy. In Microsoft Office ensure you
    have Web Page selected in the Save as type list (don''t choose Single File Web
    Page). In OpenOffice you need to choose File | Export... from the main menu. Select
    HTML Document in the File format list.


    Using either tool will create a set of web pages and their associated files (images,
    and so on) all stored in a specific folder structure (depending on the tool you
    use, but that we don''t need to know about). We need to upload all the files and
    folders to Moodle. If you aren''t feeling confident in your own abilities to upload
    the files then speak to your Moodle administrator, help desk, or technician. Once
    the files have been uploaded (making sure you preserve the folder structure),
    then you need to create a link to the file ending in .htm that has the same name
    as the original PowerPoint presentation.


    # Becoming a cut and paste fiend with a Moodle "page"


    If you have documents that you have to change fairly often, then you will find
    that you have to download the document, edit it, and then re-upload it over and
    over again. The way around this problem is to copy the document into a Moodle
    "page". Note that this is different from the web page conversion outlined previously.
    A Moodle "web page"—simply called a "page"—is a web page we can create using Moodle''s
    built-in HTML editor. I keep a list of suppliers of equipment for the hydrogen
    balloon experiment (the students are expected to bring in their own). Rather than
    just uploading the document I''m going to convert this into a web page.'
  merge: -1
  img_proc: true
- pgno: 118
  md: "# Time for action – creating a web page\n\n+   1. Return to your course front\
    \ page and make sure you have editing turned on.\n+   2. In the topic you want\
    \ to add your new web page into, click on **Add a resource...** and select **Page**\
    \ from the list.\n+   3. Give the new web page a name and specify a description.\n\
    +   4. Copy and paste the text from the original document into the new web page\
    \ (the \"Page content\" area).\n+   5. At the bottom of the page, press the **Save\
    \ and display** button.\n\n# What just happened?\n\nWe can convert documents into\
    \ a web page. This only really works for smaller documents, and is very useful\
    \ if documents change quite frequently as it saves you having to download it,\
    \ change it, save it, and then upload it again. The other obvious benefit is that\
    \ students will be able to read it without having to install any additional software.\n\
    \n![](img/1529021fde33ef551603bbc71587313e_118_0.png)\n\n> **Don't make this mistake:\
    \ cutting and pasting images doesn't work**\n> \n> Remember that images must be\
    \ uploaded to Moodle (to My private files or via a repository) and then included\
    \ in your web page using the Insert/edit image button. You can't cut and paste\
    \ them.\n\n# Cleanup messy code\n\nA Moodle page is basically a web page (remember\
    \ you are pasting text into an HTML editor). If you are cutting and pasting from\
    \ Microsoft Word into a web page then Word tries to be clever and attempts to\
    \ convert your text into web code (it does this so that any formatting applied\
    \ to the text stays intact). The problem is that this web code can be very Microsoft-specific\
    \ (containing lots of Microsoft-specific formatting information) which then breaks\
    \ Moodle's built-in editor. (Note that this isn't just a problem with Moodle,\
    \ lots of different software applications use the same text editor Moodle employs.\
    \ You might even recognize Moodle's editor from another software tool you use).\
    \ If you are pasting from Word then try using the Paste from Word button. If you're\
    \ pasting from another application then it's worthwhile pressing the **Cleanup\
    \ messy code** button after you do so:"
  merge: -1
  img_proc: true
- pgno: 119
  md: '![](img/1529021fde33ef551603bbc71587313e_119_0.png)


    # Turning large documents into a wiki


    My physics department has a departmental handbook, which describes how the department
    is organized, what its aims are, details of the department''s policies and practices,
    and so on. Maintaining the handbook presents a lot of problems. We try to ensure
    different members of the department complete different parts, but it is very difficult
    to collate these when they have been written. How can we make ownership of this
    document truly collective? The task of putting together our handbook, as well
    as all the other documentation we need, often detracts us from doing our actual
    job (teaching!—but that''s sometimes difficult to remember given all the other
    things we are expected to do). How do we show the subject inspector that we are
    really working together as a team creating our departmental documentation?


    An elegant solution is to turn departmental documentation into a wiki. "Wiki"
    is Hawaiian for quick (see http://en.wikipedia.org/wiki/Wiki), and a wiki is a
    quick way of creating web pages and linking them together. Not only that but you
    can work on the web pages with your colleagues collaboratively (allowing colleagues
    to contribute or modify content)—and that will really impress the inspectors.
    Also, built into the system is an audit trail. This means you can see who modified
    what and when. It also means you can revert to previous versions and easily compare
    one version to another.


    To show you how easy it is to create a wiki, I''m going to use one instead of
    uploading the teacher notes I have for my Backyard Ballistics course.'
  merge: -1
  img_proc: true
- pgno: 120
  md: '> So far, all the static content added to our course has been converted to
    Moodle using a Moodle resource. A wiki is an activity because you are expecting
    users to work together on the contents of the wiki. This is one instance where
    the boundaries between what constitutes a resource and what would be best described
    as an activity can become blurred.


    Firstly, I''m going to add a new topic called "TEACHER DOCUMENTATION" on the end
    of my course for teacher documentation. I''m going to keep this topic and its
    contents hidden from my students.


    # Time for action – adding a hidden topic


    +   1. Return to the course front page. Click on the Edit settings link under
    Course administration in the Settings block.

    +   2. Click on Number of weeks/topics list and add another topic.

    +   3. Scroll down to the bottom of the page and press the Save changes button.

    +   4. Edit the new topic''s summary to tell your colleagues (and the inspector)
    that this topic is specifically for teacher documentation and nothing else.

    +   5. Hide the topic from your students by clicking on the open eye on the right-hand
    side. The eye closes to indicate that the topic is hidden:


    ![](img/1529021fde33ef551603bbc71587313e_120_0.png)


    6. You''re done!'
  merge: -1
  img_proc: true
