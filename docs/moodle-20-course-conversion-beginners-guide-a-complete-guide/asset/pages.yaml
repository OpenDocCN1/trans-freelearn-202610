- pgno: 325
  md: '+   9. Scroll down to the bottom of the page and press the **Save changes**
    button.

    +   10. That''s it. we''re done!


    # What just happened?


    I''ve just set up my new course ready for me to start uploading resources. I''ve
    given my course a brief summary, kept it as a weekly format but cut it down to
    two weeks. I''ve also specified an enrollment key so that new students can''t
    get in. I haven''t hidden this course from my students: I could have done, but
    I wanted to let students know it''s there (what''s stopping them from getting
    in is their not knowing the enrollment key). I want to get my students interested
    in this course.


    # Introducing your course


    We saw in *Chapter 2, Setting up your Courses* that it is a good idea to make
    "**Summary of General**" (which is how Moodle refers to the section at the very
    top of the course page) a place where students can find out about the course and
    also find out about each other.


    Check out *Chapter 4, Sound and Vision—Including Multimedia Content* where we
    created a photo montage using `Slide.com` (see Picture Shows Using `Slide.com`).
    I''ve got lots of photographs from when I''ve run this project in previous years.
    I''ve uploaded these to `Slide.com` and I''m going to include a `Slide.com` slide
    show in Summary of General, so my new students can know what they are letting
    themselves in for:


    ![](img/1529021fde33ef551603bbc71587313e_325_0.png)'
