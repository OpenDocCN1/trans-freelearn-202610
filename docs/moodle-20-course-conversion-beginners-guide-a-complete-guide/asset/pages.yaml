- pgno: 162
  md: '# What just happened?


    I wanted to include a photo montage in my instructions on how to make a match
    rocket. I''ve done this using Slide.com, a free online service that allows me
    to upload photographs, including captions, and create a slideshow. Using Slide.com,
    we can employ lots of engaging visual effects to dissolve from one photograph
    to another. Slide.com also allows you to play music while your photo montage is
    displayed.


    > Don''t want advertisements at the bottom of your slidecast?

    > Select the images in the editor and press the Delete key.


    # Ask the Admin


    In this chapter, we included multimedia files in our course and it is very important
    that Moodle has been set up to handle multimedia properly. The next few sentences
    probably won''t mean a lot to you, but if Moodle didn''t play your audio or video
    for you then you need to speak to your administrator about enabling what is called
    the ''Multimedia Plugins'' filter, and ensuring that everything—including playing
    Flash animations (again, just repeat this to your administrator even if you aren''t
    sure what it means)—is enabled. There isn''t any good reason why it shouldn''t—that''s
    just how it comes out of the box.


    # What happens if you don''t enable multimedia plugins


    You can certainly include multimedia files in your course by simply uploading
    them, just as we did in Chapter 3, Adding Documents and Handouts and then including
    links to them on the course front page—as we did later on in that Chapter. The
    problem is that there needs to be a media player installed on the student''s PC
    in order for them to see or hear what, exactly, is in the file. That could be
    Windows Media Player, RealPlayer, or Apple QuickTime, or a whole host of other
    media players out there in multimedia-land that your students, their parents,
    or your school''s technician may have installed.


    Don''t allow Moodle to play your files and you will get bombarded with issues
    regarding whatever player a student is trying to use. And that''s nothing to do
    with Moodle. Convincing your Moodle admin to enable multimedia plugins means Moodle
    will handle the media player for us. Not only that, but the actual video or audio
    is embedded into the web page, rather than playing in a separate player. That
    means we don''t get lots of students not knowing how to use the media player they
    happen to have installed on their computer. Currently, Moodle ships with multimedia
    plugins for the following types of files (use this list as a guide for the types
    of files you can upload to Moodle):


    +   - MP3 (audio files)

    +   - SWF (Flash animations)

    +   - MOV (movie files)'
  merge: -1
  img_proc: true
- pgno: 163
  md: '+   - WMV (Windows movie files)

    +   - MPG (mpeg video files)

    +   - AVI (video files)

    +   - FLV (Flash videos)

    +   - RAM (real audio clips or sequence of clips)

    +   - RPM (audio files)

    +   - RM (audio files)

    +   - YouTube links (Moodle can recognise a link to a YouTube page and automatically
    embed the video)

    +   - OGG (audio files)

    +   - OGV (video files)

    +   - Enables auto-embedding of linked images (Moodle recognises a link to an
    image and embeds the image automatically)


    # Summary


    In this chapter, we turned our courses into a truly multimedia experience:


    +   - It was easy to include multimedia in our courses. Moodle can even embed
    audio and video into web pages for us, as long as our Admin has got that set properly.

    +   - Embedding videos from YouTube and TeacherTube was simple, using the fragments
    of web page code they provide you’ll have to make sure that your students will
    also have access to any websites that you embed videos from, though.

    +   - Multimedia doesn’t just stop at videos and audio. We ended the chapter by
    including a fantastic free photo montage in the course using Slide.com. I even
    had music playing in the background as my montage played—but you’ll have to take
    my word for that!


    There has been a lot of discussion in this chapter about teachers using the Internet
    to store content. It is worthwhile mentioning that there are pros and cons to
    doing this. You will need to keep track of where you put your resources on the
    Internet. You may find it better to place as much as possible inside Moodle, where
    you can ensure students will be able to get access and view content and that the
    content they are viewing is safe.


    If you upload audio or video to Moodle then students can download the files from
    Moodle if they want to. This might help you determine how you place video/audio
    into Moodle.


    Now we’ve reached the half-way stage for this book and I think you’ll agree that
    our courses are looking pretty good. In Chapter 5, Moodle Makeover we’ll be taking
    a look at tips and techniques that’ll take our courses from looking good to looking
    great.'
  merge: -1
  img_proc: true
