- pgno: 251
  md: '# # Chat room tips and tricks


    Before we leave chat rooms, here are some ideas for using chat rooms on your courses:


    +   - Let students join the chat room to allow them to get to know each other
    and you before they meet.

    +   - Hold meetings with colleagues about your course using a hidden chat room.

    +   - Invite guests into your chat room, perhaps specialists from your local college
    or university.

    +   - Is your school "twinned"? That is, does it have a special link with another
    school (perhaps even one in another country)? Hold chats with the twinned school
    using Moodle. We''ve used chats to share Backyard Ballistics anecdotes!


    We''ll spend the rest of this chapter looking at Moodle messaging, Moodle''s own
    built-in e-mail system.


    # # Moodle messaging


    Forums and chats are primarily a teaching tool. Moodle messages, on the other
    hand, are the ideal course admin tool when you want to send out messages to your
    students. As we will find as we work through this section, students can also message
    each other, further supporting collaborative working, especially as we continue
    converting our courses to run online.


    Note that I''ve left discussion of this topic to the end of this chapter because
    often Moodle messaging is turned off. Before reading on, it''s certainly worth
    checking that messaging is enabled in your Moodle.


    # # Sending a welcome message


    I figured it would be good to send all of my new students a welcome message, thanking
    them for joining me on the Backyard Ballistics course. Let''s see how easy that
    is now:'
  merge: -1
  img_proc: true
