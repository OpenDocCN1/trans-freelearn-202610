- pgno: 187
  md: '![](img/1529021fde33ef551603bbc71587313e_187_0.png)


    You can see that Moodle has backed up your entire course into a single file and
    put it in your private backup files area. That''s fine, but if something goes
    wrong with the computer Moodle is running on, that isn''t much help. Click on
    the **Download** link. You are given the option to either open it or save it.
    Click **Save** and save the file to your computer, USB memory stick, or portable
