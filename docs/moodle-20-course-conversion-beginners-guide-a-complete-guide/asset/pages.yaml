- pgno: 247
  md: '# Have a go hero – doing more with chats and forums


    If an important point is made in a chat that needs elaborating, perhaps vital
    to a particular learning goal, then use a forum to discuss the issue further.
    You could even copy the chat from the past chat session to a forum post. You can
    edit out the names to protect the innocent!


    # Letting students know when you are available


    Chat rooms are always open, but you can indicate when you are going to be around
    to talk to your students, as you''ve probably guessed and as I did previously,
    using the Next chat time settings. Let''s update our chat room now.


    # Time for action – telling students when we''re around


    +   1. If you are on the course front page then click on the update icon next
    to your chat room. If you are on the chat room page then select Edit settings
    under Chat administration in the Settings block.

    +   2. Scroll down the Editing chat page until you see the chat time settings
    (in the General box):

    +   3. I initially configured the chat room to publish chat times (you can see
    the effect in previous screenshots). I want to have the same chat time every Monday
    at lunchtime, so:

    +   4. Scroll down to the bottom of the page and press the Save and return to
    course button. And that''s it. We''re done.


    ![](img/1529021fde33ef551603bbc71587313e_247_0.png)


    ![](img/1529021fde33ef551603bbc71587313e_247_1.png)'
  merge: -1
  img_proc: true
- pgno: 248
  md: '# What just happened?


    We''ve just specified when we are going to be around for a chat, but how are students
    going to know? One way is to check out the Upcoming events block on the course
    front page (usually on the right-hand side of the course main page):


    ![](img/1529021fde33ef551603bbc71587313e_248_0.png)


    Try clicking on the Go to calendar... link in the block. The course calendar is
    displayed:


    ![](img/1529021fde33ef551603bbc71587313e_248_1.png)


    You can see what a great tool the course calendar is. You can add new events,
    either reminders to yourself or course events, where you can let students know
    about upcoming exams. For the truly adventurous, the calendar can be exported
    and uploaded to your mobile phone, iPad, or PDA/tablet device of choice.


    You can even display a mini-calendar on your course front page. I appreciate this
    chapter is about communication, but because I want to let my students know when
    I am going to be available for a chat, now is the time I want to include an events
    calendar in my course. Let''s see how to do that now.'
