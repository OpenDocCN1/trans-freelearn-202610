- pgno: 83
  md: '# 3


    # Adding Documents and Handouts


    Your new Moodle course is configured and ready to have your teaching materials
    uploaded onto it. Now let''s make a start! In this chapter, we will cover:


    +   - Uploading files to Moodle and how to organize them effectively

    +   - How to present documents and handouts to students

    +   - Uploading images and how to include them in any text

    +   - Understanding which types of file are best to include in a course, and how
    to create them. We will also be learning how to convert departmental documentation
    into a wiki, which you and your colleagues can work on collaboratively.


    By the end of this chapter, you will have populated your course with static content
    ready for your students to access. Clearly, our aim is to create more appealing
    and interactive courses and my describing resources as "static content" may not
    sound that inspiring but, as you''ll see in this and subsequent chapters, there''s
    plenty we can do with our "static" resources to make them engaging and entertaining
    when we convert to Moodle.


    # Uploading files


    As always, I want to show you the easy way first, and the easiest way to get your
    existing course material into Moodle is to simply put the files in as they are.'
  merge: -1
  img_proc: true
- pgno: 84
  md: 'However, remember that your students might not have all the software necessary
    to read the files that you want to upload to Moodle. In this chapter, I will be
    mainly working with Microsoft Word documents and PowerPoint presentations, but
    the processes I will be outlining and we will be working through together could
    equally apply to any type of file. Later in the chapter, we will see how to make
    sure your documents are in a format that any student with any computer can download
    and use.


    For now, though, let''s look at how to upload any file into Moodle.


    > Uploading means taking a file from your computer and putting it onto a server.
    Students and other staff can then download the file to their own computer and
    view it.


    If you''re like me, you''ve got all of your teaching resources stored on a memory
    stick, a portable hard drive—or perhaps you keep them on your school or college
    server. We now need to upload them to Moodle, ready for us to include them on
    the front page of our course.


    Each of us has our own My private files area in Moodle that other users (both
    students and colleagues) don''t get access to. We can upload a file to our My
    Private files area and then provide a read-only link to that file from any course
    we teach on. For example, I''m about to show you how to upload an "energy sources"
    handout—a Word document (a DOC file)—that I use when I teach Backyard Ballistics.
    In fact, I use this handout in another course I teach in Moodle but having the
    file in My private files means I can easily create a link to it from the other
    course.


    > Although you are creating links to files in your My private files area, Moodle
    is, at the time of writing, making copies of the file to put in your course. That
    means if you modify the file in My private files you won''t see those changes
    when you click on a link to the file from a course. For more information check
    out the discussion here: http://moodle.org/mod/forum/discuss.php?d=168495#p739240.


    Note also that in the following example I could have used any type of file—we''ll
    talk much more about file formats later in this chapter.


    # Time for action – uploading a file


    +   1. Choose the file you want to upload and make a note of where it is currently
    stored.

    +   2. Return to your site front page and select My profile | My private files
    from the Navigation block:'
  merge: -1
  img_proc: true
- pgno: 85
  md: '3. You are now in your My private files area. Remember: this area is only accessible
    by you but you can provide links to files uploaded to here from any course you
    teach on. Click on the Manage my private files button:


    ![](img/1529021fde33ef551603bbc71587313e_85_0.png)


    ![](img/1529021fde33ef551603bbc71587313e_85_1.png)'
  merge: -1
