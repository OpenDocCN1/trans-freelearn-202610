- pgno: 344
  md: '# Putting it All Together


    **12.** The **Grouping** settings will now be revealed. To ensure that my forum
    is only available to students in a particular grouping then select the grouping
    from the drop-down list and ensure the **Available for group members only** setting
    is ticked:


    ![](img/1529021fde33ef551603bbc71587313e_344_0.png)


    **13.** That''s it! This forum is now only available to students in the groups
    that are contained in the Tasks for the Turbo group grouping.


    # What just happened?


    We''ve just converted a vital part of face-to-face group teaching, handing out
    different work to different groups, to Moodle.


    # Checking student progress


    Even if you aren''t converting courses to be run completely online there may still
    be instances when you want to monitor student activity. For example, if you are
    keen to develop your course as students are using it you may want to monitor how
    many students are accessing a particular resource. So how do you tell where students
    have been and how long they spent there?


    # Monitoring student participation


    Return to your course front page and look for the **People** block (it''s usually
    at the top-left corner of the course front page). Click on the **Participants**
    link in the **People** block. Select a name from the list of participants and
    then click on the **Activity reports** tab. The **Outline** report shows you when
    a student last accessed a particular resource or activity. Clicking on the **All
    logs** tab shows you not only when a student accessed a particular resource, but
    also the ID (called the IP address) of the computer or Internet connection they
    accessed it from. The **Grade** tab shows an outline report of the grades a student
    has attained for the gradable activities in your course. Rather than having to
    check the grades of each student in turn, you can obtain an overview of the grades
    achieved by students on your course using the Moodle gradebook.'
  merge: -1
  img_proc: true
- pgno: 345
  md: '# # Using the Moodle gradebook


    Let''s take another visit to the gradebook we first encountered in *Chapter 6,
    Managing Student Work*. The gradebook is a very powerful feature of Moodle, and
    if you are going to be converting your course to be fully online then you will
    want to know how to use it well. That said, most of the gradebook is self-explanatory.
    As you add activities to your course you will see them added to the grader report
    and see student results displayed there. Most educators are more than happy to
    use the gradebook as it is. However, you can insert custom grade items into your
    gradebook (you aren''t just limited to activities you''ve added into your course),
    you can change the way grades are calculated, and you can categorize grades (grouping
    grades and even calculating an overall grade for that category).


    To access the gradebook for your course you will need to return to the course
    front page and select **Grades** from the **Settings** block, under **Course administration**.


    Once on the **Grader report** page, click on the **Grader report...** drop-down
    menu to see the kind of options that are available to you:


    ![](img/1529021fde33ef551603bbc71587313e_345_0.png)'
  merge: -1
  img_proc: true
- pgno: 346
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 347
