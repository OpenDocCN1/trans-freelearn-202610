- pgno: 234
  md: '**3.** At the bottom of the page you''ll see that there is an option to include
    an attachment with your post. This is very useful: students can scan in work they
    are stuck on and attach the scanned image to a post. While we are experimenting
    with forum posts, you could try attaching a file (anything will do, Moodle isn''t
    fussy). Remember, you won''t break anything.


    **4.** Once you''re happy with what you are about to post, press the **Post to
    forum** button. After the confirmation message (reminding you that you have only
    a short time frame in which to change your mind about what you''ve just written),
    you''re taken back to the forum where your new post is listed:


    ![](img/1529021fde33ef551603bbc71587313e_234_0.png)


    # ## What just happened?


    Getting a conversation started can often be difficult in the classroom and sometimes
    you''ve the same problem when you convert to teaching online. It''s a sure bet
    that a forum that starts empty will stay empty, so I always start the ball rolling
    with a question (or sometimes a contentious statement!) that I know will get my
    students responding back.


    Once you''ve got the discussion started, you often find that there will be an
    initial flurry of posts that quickly dies away as everyone decides that they have
    said all that they''ve got to say. If students can see that it has been a while
    since the last post then they will be less inclined to post themselves. Also,
    as forums grow, discussions can sometimes venture off-topic. Let''s look at a
    few techniques to keep discussions focused.'
  merge: -1
  img_proc: true
- pgno: 235
  md: '# Keeping discussions focused – Managing the discussion


    Moderating a forum takes much less effort than you would at first imagine. Here
    are some tips and tricks to help you tackle some of the issues you might encounter:


    +   - The frequency of posts can fall away if students think that no one is going
    to respond to them. It is a good idea to state how often you visit the forum and
    when you intend answering posts, especially if you''ve added a forum to support
    work that is being done over a weekend or a holiday.

    +   - Respond to posts with positive feedback. Thank your students for posting,
    it encourages them to post some more.


    When it comes to moderation you need to decide how much you are going to exercise.
    As a teacher you can edit or even remove posts but too much moderation might stifle
    debate and alienate students who are familiar with forums. Too little might allow
    certain students to dominate and alienate those students who aren''t familiar
    with forums. There is always the option to set a post threshold to limit your
    more enthusiastic students. Perhaps you want students to take some level of ownership
    of the forum much as you want them to take ownership of their own work. In that
    case, too much moderation might be seen as interfering.


    # Coping with the rude and unruly


    It is rarely a problem, but some students can say things on a forum that they
    would never think of saying in person. If you''ve a fear that your forum may get
    out of hand then lay down a set of rules before you start. Make the rules for
    student conduct clear in your course. Use rating scales, these can moderate student
    behavior, especially if their final grade depends on getting good ratings from
    teachers or other students.


    > If you decide you would rather check the suitability of messages before they
    are posted then take a look at Moodle.org and search for "approve forum post"
    or similar. There are a variety of solutions available, although you will have
    to speak to your Moodle admin about implementing them.


    One out of the box solution is to rate a post. If it is totally unsuitable then
    obviously you will need to delete it completely.'
  merge: -1
  img_proc: true
- pgno: 236
  md: '# Communicating Online


    # Time for action – rating forum posts


    +   1. We need to reconfigure our forum to allow us to rate posts. If you have
    returned to the course front page then click on the update icon next to your new
    forum:


    ![](img/1529021fde33ef551603bbc71587313e_236_0.png)


    +   2. If you haven''t left your forum main page then, in the **Settings** block,
    click on **Edit settings** under **Forum administration**:


    ![](img/1529021fde33ef551603bbc71587313e_236_1.png)


    +   3. On the **Editing forum** page, scroll down to the **Grade** box. Select
    how you want posts to be graded from the aggregate type list. Grades given to
    posts are used to give students an overall grade for the forum activity. The options
    should be self-explanatory.


    +   4. Select the grading scale you want to use. You can use a custom grading
    method if you want to (see the *Time for action – create a custom grade scale*
    section in *Chapter 6, Managing Student Work*). I''m going to allow a rating out
    of 10.'
  merge: -1
  img_proc: true
- pgno: 237
  md: '5. Finally, if you want to keep students focused on the particular posts, you
    can restrict grading to a certain date range. You''ll find these settings at the
    bottom of the Grade box.


    6. And that''s it. We''re done! Now, depending on the date range you restricted
    grading to, you are given the option to grade posts:


    ![](img/1529021fde33ef551603bbc71587313e_237_0.png)


    # What just happened?


    The great thing about converting our courses to Moodle is that you can grade student''s
    input into the discussion much more easily than you can in a classroom or lecture
    theater. Knowing that their posts are likely to be rated prevents discussions
    getting out of hand. But what if a discussion ventures off onto another topic
    but the new topic is still one that needs to be discussed? We''ll look at this
    issue in the next section.'
  merge: -1
  img_proc: true
- pgno: 238
  md: '# # Ensuring discussions are easy to follow


    I''ve already promoted forums as a great way of discussing topics because with
    a forum it is easy to look back on a discussion to find a point well argued or
    a case well made. But that only works if threads of discussion are kept organized.
    It''s something that happens often in forums. For example, one of the discussions
    in my poster forum changed from being about colors to nuclear power:


    ![](img/1529021fde33ef551603bbc71587313e_238_0.png)


    # # Time for action — splitting a discussion


    1. Choose the topic you want to split the discussion at and click on **Split**:


    ![](img/1529021fde33ef551603bbc71587313e_238_1.png)'
  merge: -1
  img_proc: true
- pgno: 239
  md: '2. Choose a new name for the discussion thread; I''m going to call mine "Nuclear
    power: Is the poster balanced?". When you''ve chosen a new title press the Split
    button.


    3. You''ve now created a new discussion thread, and both discussions are now much
    easier to follow:


    ![](img/1529021fde33ef551603bbc71587313e_239_0.png)


    # What just happened?


    Managing forums in Moodle is all about making discussions easy to follow, and
    easy to refer back to later on. But we''ve just seen how managing discussions
    is very easy. It''s one of the advantages of moving your courses online.


    Now we''ve learned pretty much all there is to know about Moodle''s Standard forum
    for general use. But that kind of forum doesn''t fit every kind of discussion
    or debate you might want to hold online. But that''s no problem because Moodle
    provides four different flavors of forum.


    # Types of forum


    So far we''ve been using a Standard forum for general use, and most of the time
    that will suit your needs. But there are four other types to choose from:


    +   - A single simple discussion, where only one discussion thread is allowed.
    If you want to keep the discussion brief and to the point, then this is the type
    of forum to choose.

    +   - Each person posts one discussion, where each student is only allowed to
    start one discussion each but can reply as freely as they like in any other discussions.
    It is used when students are only allowed to make a single statement or comment,
    for example online debates.'
  merge: -1
  img_proc: true
- pgno: 240
  md: '+   - Standard forum displayed in a blog-like format, which displays a discussion
    thread as you would see the comments at the bottom of a blog, or possibly more
    familiar to your students, on a Facebook wall.

    +   - Q and A forum, where students are prevented from seeing other posts until
    they themselves have posted something. Used often in situations where you don''t
    want students copying each other''s work (language teaching), or thoughts and
    ideas. It can also be used in the online equivalent of a "round robin" teaching
    exercise, where I ask a question that the first student answers. They then ask
    a question that the next student answers. And so on.


    When we first added a forum to the course at the very start of this chapter (*Time
    for action – Adding a forum to your course section*), I said to leave the **Forum
    type** setting as **Standard forum for general use**. It''s this setting (on the
    forum configuration page) that allows you to specify the forum type.


    As you can see, converting to Moodle opens up new possibilities for discussion,
    and remember that Moodle easily allows you to carry the discussion on beyond the
    classroom.


    What about different ways you can use forums to support your teaching? Let''s
    take a look at a few forum tips and tricks in the next section.


    # # Forum tips and tricks


    Forums are a great way of managing discussion and debate. Here are just a few
    ideas on how you can use a Moodle forum in your teaching:


    +   - Do you have project work that needs to be carried out over the weekend or
    a holiday period? Use forums to support your students outside of the classroom
    or lecture theater.

    +   - If your students spend very little time together as a group then create
    a social forum, allowing your students to get to know each other better online.

    +   - Remember that there are many different types of course format to choose
    from. If you choose the Social format then your course is simply one big forum.
    For more information on specifying course formats see the *Time for action – setting
    up the course format section in Chapter 2, Setting up your Courses*.

    +   - If you are teaching a foreign language and you don''t want students to copy
    each other''s posts then try using a Q and A forum; they can''t see other posts
    until they have made a post themselves.

    +   - For short, focused group work create a forum and display posts on the interactive
    white board. Use these posts to support verbal discussions in the classroom or
    lecture theater.'
  merge: -1
  img_proc: true
- pgno: 241
  md: 'To make discussion threads easier to follow you can change the way they are
    displayed on the screen using the display replies drop-down menu. Note that this
    is a personal setting rather than something that can be changed for others:


    ![](img/1529021fde33ef551603bbc71587313e_241_0.png)


    +   - Create a Frequently Asked Questions forum to support major project work.
    Save this forum for subsequent years. You''ll be able to see the areas students
    struggle with more easily.

    +   - Students working in groups can have their own discussion forum so they can
    communicate and collaborate together (there''s more on setting up student groups
    later in this book).

    +   - Prevent over-keen students from making too many posts by using the Post
    threshold for blocking settings on the Editing Forum page.

    +   - Remember that forum posts are time and date stamped. Students will get to
    know your sleeping habits if they see you posting to forums at 4.00am. Likewise,
    you''ll get to know your student''s work habits if they do the same!


    # Have a go hero – creating a school leavers book


    Create a forum for school leavers to post their farewell messages and photographs.
    These forums always prove very popular. Some schools even copy the messages and
    photographs and have them printed for students to take away with them when they
    leave.'
  merge: -1
  img_proc: true
- pgno: 242
  md: '# The News forum is not really a forum


    Every course has a News forum, but that name is misleading. The News forum is
    actually a notice board for teachers, a place for you to post the latest course
    news. The important point is that only teachers can post to it, so don’t expect
    students to respond to you in there. Any posts you post to the News forum appear
    in the Latest News block, so you can use the News forum to announce changes to
    the course, project deadlines, exam dates.


    Forums are a great tool to support discussion and debate. However, there are times
    when you need to provide a real-time chat environment for your students. In the
    next section we look at Moodle chat.


    # Online chat rooms


    If you need to support learners who aren’t in the classroom then chat rooms are
    the ideal way of doing so:


    +   - Create an exam revision chat room and spend an hour with your students the
    night or morning before an exam.

    +   - Support learners who are away ill. If they have access to a computer they
    can still join in with class discussions.

    +   - Support project work over the weekend or holiday period with chat sessions.
    They will cut down on the amount of catch-up work you have to do when you return
    to work on Monday morning.

    +   - Hold online tutorial sessions if you and your students are finding it difficult
    to arrange a time and a place when you can all be together in person.

    +   - Invite a guest speaker into your chat room. By inviting them to join your
    class online you can dramatically cut your expenses bill!

    +   - Moodle chat rooms are safe and only open to those enrolled in your course.


    And using a chat room within Moodle means that users don’t have to learn how to
    use yet another "chat client", as they are called.


    But chat rooms have their downsides:


    +   - Because chatting online lacks hand gestures and verbal cues, it is very
    easy for misunderstandings to take place. Using emoticons (or smileys) can help
    prevent this problem.

    +   - Chat rooms are always open, 24/7. Misbehavior may take place without you
    being aware of it.'
  merge: -1
  img_proc: true
- pgno: 243
  md: 'Young learners can be very used to chat, and can often start trite conversations
    along the lines of "sup? who u lovin?". Chat sessions are recorded and can be
    displayed to the class on the interactive white board if necessary. As with forums,
    it''s best to set the rules for good behavior before you let the rabble in.


    The other feature of chat rooms is that hiding a chat room renders it closed.


    We''ll look at all of these issues as we learn more about Moodle chat. Let''s
    start by spending the next section learning how to add a chat room to your course.


    # Adding a chat room to your course


    Adding a chat room to your course is easy. All you need to do is choose the topic
    you want to add the chat room to, click on Add an activity... and choose Chat.


    I want to include a chat room to allow students to discuss the presentation they
    have to make. It is something they all get quite worried about, and it is good
    when they work together to overcome any difficulties they might be having. Rather
    than using a forum for this, students have said that forums can seem quite isolating
    when they are waiting for a response to be posted, I am going to use a Moodle
    chat.


    # Time for action – adding a Moodle chat


    +   1. Decide on the topic in which you want to include a chat room. With editing
    turned on click on Add an activity and choose Chat.


    +   2. Give the chat room a name and provide a short piece of introductory text:


    ![](img/1529021fde33ef551603bbc71587313e_243_0.png)'
  merge: -1
  img_proc: true
- pgno: 244
  md: '3. For now the default settings will do. Simply scroll down to the bottom of
    the page and press the Save and display button:


    ![](img/1529021fde33ef551603bbc71587313e_244_0.png)


    # What just happened?


    We''ve just added a chat room to our course! It was very easy, just a few clicks
    and we''re done. To enter the chat room simply click on the Click here to enter
    the chat now link. Ask a student or colleague to join you. You can see whether
    there''s anyone else with you in the chat room on the right-hand side of the screen:


    ![](img/1529021fde33ef551603bbc71587313e_244_1.png)'
  merge: -1
  img_proc: true
- pgno: 245
  md: '# # Being understood – Using emoticons


    As we have already mentioned, without visual cues, facial, and hand gestures,
    it is very easy to be misunderstood in a chat room. For that reason emoticons,
    or smileys, were invented. Have you tried inserting smileys using the HTML editor:


    ![](img/1529021fde33ef551603bbc71587313e_245_0.png)'
