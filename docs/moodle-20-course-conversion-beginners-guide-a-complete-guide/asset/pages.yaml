- pgno: 156
  md: '# Sound and Vision—Including Multimedia Content


    # What just happened?


    Embedding a video from TeacherTube is very simple—and pretty much the same process
    we used to embed a video from YouTube. The advantage with using TeacherTube is
    that students, more often than not, can''t get access to YouTube.


    If YouTube is blocked then one of the options open to us is to extract the video
    from YouTube and then upload it to TeacherTube or Vimeo (a site dedicated to collaboration
    and sharing). This is ideal if we don''t want to keep the computer running Moodle
    under any strain, especially if we want to have our students all view the video
    on their own computers at the same time. It is also a good solution if you don''t
    have that much space on the computer running Moodle (your Moodle admin might start
    complaining if you fill up the Moodle server with videos). Before you start uploading
    videos to TeacherTube, you will need to get yourself a TeacherTube account.


    # Pop quiz


    Can you outline the advantages and disadvantages of having all your videos stored
    on a file sharing site on the Internet (for example, YouTube)?


    # Playing audio


    There are three ways to include audio in Moodle, just as there are three ways
    to include video:


    +   1. Include a link to the audio file in your course front page.

    +   2. Embed the audio file in a Moodle web page—which, just as with video, requires
    multimedia filters to be enabled by your administrator.

    +   3. Upload the audio to an audio sharing website and stream the file from there.


    ![](img/1529021fde33ef551603bbc71587313e_156_0.png)


    > You have possibly found, as you experimented with including videos in your course,
    that not all school and college computers, for understandable reasons, have got
    audio enabled (some schools even go so far as to snip the wires to the headphone
    socket). As you work through the following guide to embedding audio, remember
    that if there isn''t any sound coming out of the speaker holes or the headphone
    socket speak to your technician or help desk. That your computer is silent may
    well be intentional.'
  merge: -1
  img_proc: true
- pgno: 157
  md: '# Choosing an audio file format


    Always convert to one of the common audio file formats. As with video file formats
    (see the discussion *Choosing a video file format*) these formats are distinguishable
    by their file extensions. However, when it comes to audio choose MP3 or, at a
    push, OGG. If you choose MP3, then:


    +   - Moodle will recognize the file and give it an appropriate icon when you
    upload it to your course files area. As with videos, this may not be particularly
    important at the moment, but it is if you have lots of files in there and you
    want to find particular types of files at a glance.

    +   - The file will play on most modern computers, phones, and portable players
    without any special effort.

    +   - As with videos, Moodle will allow you to embed files of this type into Moodle
    web pages, as we shall soon see in the following sections.


    If your audio file isn''t in MP3 format then try out one of the free online file
    conversion tools, for example zamzar.com, Audacity, or even iTunes, if you use
    it.


    # Letting Moodle handle your sounds


    Many of the processes used to embed audio, either by uploading an audio file,
    or by using an audio sharing website, are very similar to those used to include
    videos, so this section is much shorter than the last simply because a lot of
    the techniques are the same. Let''s start by seeing how Moodle can embed its own
    audio player into a Moodle web page.


    # Time for action – embedding an audio clip


    +   1. Choose a topic you want to add your audio file to and from the **Add a
    resource...** list choose Page.

    +   2. I''ve got an audio file all about the history of rockets that I''d like
    to include. Firstly, I''m going to add a short piece of introductory text "Listen
    to this program all about rockets...".

    +   3. Then, I''m going to use the **Moodle Media** button to insert my audio
    file. See *Time For Action – Embed a video into a Moodle Page* for details on
    how to use the Insert/edit embedded media dialog. I''m going to use the File picker
    to upload my audio file and then select it. When you are done. click on the **Insert**
    button.

    +   4. Scroll down to the bottom of the Editing Resource page and press the **Save
    and return to course** button.'
  merge: -1
  img_proc: true
- pgno: 158
  md: '5. Click on the link to the new Moodle web page from your course front page.
    Moodle will have embedded an audio player into your web page:


    ![](img/1529021fde33ef551603bbc71587313e_158_0.png)


    # What Just happened?


    Embedding an audio file is much the same as embedding a video file. Again, as
    with video, having Moodle embed an audio player means you don''t have to worry
    about your students knowing how to use the audio player they have installed.


    # Troubleshooting audio—what if Moodle doesn''t embed a player


    What if you just saw the link to your audio, instead of the link and the little
    player? Then, you need to speak to your administrator about reconfiguring Moodle.
    Check out the Ask the Admin section at the end of this chapter for details.


    # Embedding audio from an audio sharing website


    Why use an audio sharing website? Here are some good reasons...


    +   - If the audio file is large then you might well be putting your Moodle computer
    under a lot of strain if more than a few students are trying to listen to it at
    the same time

    +   - You might be limited with space in your course (this issue applies to videos,
    too)

    +   - Your admin doesn''t want to enable multimedia plugins


    Audio sharing sites worth looking at include SoundCloud (http://www.soundcloud.com),
    Soundboard (http://www.soundboard.com/), and FindSounds (http://www.findsounds.com/).
    Certainly, Soundboard provides an embeddable audio player that you can include
    in your Moodle pages. For more information on using SoundCloud, Soundboard, and
    FindSounds check out YouTube. You''ll find plenty of instructional videos on there.


    > If you choose to use an audio sharing website, remember to check that students
    can access it on your institution''s computers. Often, they can be blocked.'
  merge: -1
  img_proc: true
- pgno: 159
  md: "# # Have a go hero – start a podcast\n\nThere are many sites on the Internet\
    \ that let you create podcasts, for example Huffduffer (http://huffduffer.com/).\
    \ You could record your lessons or lectures as you give them and create a dedicated\
    \ lesson podcast. Remember, as with video, you might need to check whether you\
    \ have consent to upload any audio where your students can be distinctly heard.\
    \ If you are particularly keen on experimenting with podcasts then there are special\
    \ podcast modules that your Admin can install into your Moodle.\n\n# # More on\
    \ embedding\n\nIn this chapter, we have been investigating embedding video and\
    \ audio. When it comes to multimedia, we can certainly upload PowerPoints or Photostory\
    \ (www.microsoft.com/windowsxp/using/digitalphotography/PhotoStory/default.mspx)\
    \ files. But these are Microsoft-specific, and Moodle users need the correct viewers\
    \ installed on their computers. To overcome this problem, there are plenty of\
    \ video and audio sharing websites to choose from—but remember to check that they\
    \ are available to your students (and haven't been filtered out as being 'unsuitable'\
    \ by your institution's web filtering software). A popular photo sharing website\
    \ (and alternative to Photostory) is Slide.com, which you can use to create an\
    \ embeddable photo montage from uploaded images. Let's take a look at doing that\
    \ now.\n\n# # Picture shows using Slide.com\n\n![](img/1529021fde33ef551603bbc71587313e_159_0.png)\n\
    \n> **Multimedia everywhere!**\n> \n> So far we have embedded multimedia in 'page'\
    \ resources only. As you may have guessed, you can embed multimedia anywhere that\
    \ uses the HTML editor—including topic summaries.\n\nI'm going to take another\
    \ look at my instructions for making a match rocket. At the top of the page I\
    \ want to include a photo montage—a sequence of photographs with a caption underneath\
    \ showing the actual process of making a rocket—a bit like a PowerPoint presentation\
    \ but centered solely on images.\n\nSlide.com is a photo-sharing service that\
    \ will allow me to create a photographic slideshow of the flavor I would like.\
    \ There are many designs of montage to choose from (and I can include music as\
    \ well, if I wanted to!). Once I've created the show the service provides, just\
    \ like many of the services we looked at in this chapter, a small fragment of\
    \ web page code that we can embed into our Moodle pages. And, as with all the\
    \ other sharing services we have investigated, you don't have to make your photo\
    \ montage public if you don't want to. Let's look at including a slide show using\
    \ Slide.com..."
  merge: -1
  img_proc: true
