- pgno: 91
  md: '![](img/1529021fde33ef551603bbc71587313e_91_0.png)


    # # What just happened?


    We uploaded a ZIP file containing lots of resource files, and then unzipped it
    on the Moodle server.


    ZIP files are a special kind of file that can contain many other files within
    them. This means that we can use them to move lots of files into Moodle without
    uploading them one at a time. And it''s not just files you can pack into a ZIP.
    You can ZIP up entire folder structures, too.


    Moodle has the ability to turn that ZIP file back into a set of separate files.
    When we click on **unzip**, Moodle takes all of the files out of the ZIP file,
    and adds them to the current folder.


    # # Dealing with oversize zip files


    We''ve seen how we can pack all the files we need into a single file (and if we
    are lucky, a helpful administrator will do it for us) and this allows us to upload
    lots of files all in one go.


    We still need to watch out for the limits on file sizes, and if the maximum file
    upload size is too small for the ZIP file you''ve just created then you could:


    +   - Create more than one ZIP file.

    +   - Seek advice from your administrator (who may well have to upload the file
    for you). If everything is packed into one ZIP file that your admin can upload
    in one go, they probably won''t mind so much. In fact there are many ways of getting
    lots of files uploaded to Moodle and your admin might need to think about implementing
    one of them (for example, WebDAV) if this is a frequent problem.'
  merge: -1
  img_proc: true
- pgno: 92
  md: '> If Moodle is trying to unpack/decompress particularly large files (but they
    are smaller than Moodle''s file upload limit) then unpacking the files might time
    out. The solution is to pack the files into the ZIP without compressing them.
    This will require a compression utility capable of doing this, for example WinZip.
    If you are experiencing problems and are unsure of what you can do to solve them,
    speak to your Moodle admin.


    # Zipping folders


    As mentioned previously, zips can also contain folders and subfolders, so you
    could assemble all your course material into neat subfolders on your own computer,
    all within one "resources" folder, and zip up the whole thing. When you unzip
    it, Moodle will recreate your folder structure for you.


    Now we''ve got our files uploaded let''s get our course files area organized.


    # Removing the ZIP file when you have unpacked it


    ZIP files aren''t automatically deleted when you unpack them, even though we have
    finished with them. We need to manually remove them, which we cover in the next
    section.


    # Removing files


    There will obviously come a time, aside from deleting a redundant ZIP file, when
    you need to remove a file from your course files area (perhaps you''ve just uploaded
    one you didn''t mean to). Deleting files from the course files area is easy. In
    fact, remember when I uploaded a bunch of files all in one go and I mentioned
    that I needed to delete the ZIP file after I had finished with it? Let''s do that
    now.


    # Time for action – removing files


    I''m going to remove ballistics.zip because all the files have been unpacked from
    it and it''s now just taking up space:


    ![](img/1529021fde33ef551603bbc71587313e_92_0.png)'
  merge: -1
  img_proc: true
