- pgno: 333
  md: 'I also want us all to work together on a pulse jet Wiki, which can then form
    a part of the student''s e-Portfolios. I''ve already got a document structure
    that they can follow, so I''m going to follow the instructions in *Chapter 8,
    Enhancing Your Teaching*, to this time create a Group wiki, but also specify a
    start page so the students have a structure to follow (important for their ePortfolio).


    Finally, and because this is a fairly practical course that I''m supporting with
    Moodle, I want to give the students an opportunity to upload their photographs.
    At the moment they hand me USB memory sticks, the memory cards from digital cameras
    or, if we are feeling particularly adventurous, they attempt to bluetooth the
    image files to me. Let''s convert this to Moodle using an assignment. In fact,
    let''s use the Advanced uploading of files assignment we first encountered in
    *Chapter 6, Managing Student Work*. The advantages are:


    +   - If the students have got any photographs they want to give me they can upload
    them straight to Moodle themselves

    +   - I can manage how many photographs come from each student, and easily check
    to see who hasn''t managed to upload any


    But, most importantly:


    +   - I don''t have to try and work out how to use their mobile phones


    At the moment those are the only aspects of my Jet Engine course that I want to
    convert to Moodle, so let''s stop there and take a look at my Week 1 so far:


    ![](img/1529021fde33ef551603bbc71587313e_333_0.png)'
  merge: -1
  img_proc: true
- pgno: 334
  md: '# Putting it All Together


    What are lacking here are a summary and some kind of indication to the students
    of how these activities fit together. Let''s use some labels and a few of the
    tips and tricks from Chapter 5, Moodle Makeover to finesse our HTML:


    ![](img/1529021fde33ef551603bbc71587313e_334_0.png)


    The Moodle philosophy suggests that learners can meander (or "moodle") their way
    through the resources and activities any way they choose. However, I want to manage
    how my students work their way through the first week of my course. The easiest
    way to do that is to hide everything and then show things as I want my students
    to do them. But remember, that in Moodle I can make access to activities conditional
    on other activities having been completed, although that may be an overcomplication.
    This approach may also contradict the basic Moodle pedagogy, but there are three
    important reasons I have come across to explain why you would want to control
    access to work:


    +   - to prevent your students from getting worried about what they see as difficult
    work coming up in the future

    +   - to avoid being asked questions on topics that you haven''t covered yet

    +   - to avoid being asked questions by parents who are checking to see what their
    children will be doing when they take the course (sounds bizarre, but I''ve come
    across this problem many times)'
  merge: -1
  img_proc: true
- pgno: 335
  md: 'You can see from the previous screenshot that in fact I''m not doing that.
    I''m giving all of the tasks in my Moodle course a number (1.1, 1.2, and so on),
    which I can then refer to as I''m working with the students.


    All of the work you can see in this section of this chapter took just over an
    hour. It really doesn''t take long to start to convert to Moodle. I needn''t have
    used Moodle for any of this work (I didn''t up until now). But, hopefully you
    can see that by converting just a few aspects of my course to Moodle, how I can
    both make my life easier and the student''s experience more entertaining. There''s
    more advice on converting to Moodle at the end of this chapter.


    # Converting to fully online courses


    Up to now we have been discussing converting to Moodle but we have always assumed
    that there will be at least some face-to-face elements to your teaching. However,
    at this stage there is really nothing stopping us from thinking about moving our
    courses entirely online. There are two further issues we need to address before
    we are completely electric:


    +   - How to group students and manage them online

    +   - How to manage and organize grades


    Let''s look at the first of these issues in the next section.


    # Managing groups of students


    If I''ve got a group of students (especially if they are of mixed ability) then
    I like to split them into groups. Not only does this make them easier to manage
    from my point of view, but I also put students into groups if they don''t know
    each other that well (a way of getting them to mix socially). Whether or not you
    are moving fully online, being able to group students, and then to hand out work
    depending on what group they are in, is something that you will very likely want
    to do; in this section we learn how.


    # Creating Groups


    I''m going to divide the students on my Jet Engine course into two groups, the
    Turbo group and the Pulse Group:'
  merge: -1
  img_proc: true
- pgno: 336
  md: '# Time for action – creating student groups


    1. Return to the course front page. Click on the Groups link in the Settings block
    under Course administration, then Users:


    ![](img/1529021fde33ef551603bbc71587313e_336_0.png)


    2. Press the Create group button:


    ![](img/1529021fde33ef551603bbc71587313e_336_1.png)'
  merge: -1
  img_proc: true
- pgno: 337
  md: '+   3. Give your group a name and, optionally a description (more on this shortly).

    +   4. You can optionally specify a picture to represent the group (again, more
    on this in a moment).

    +   5. When you are done press the **Save changes** button. Your new group is
    now added to the list of available groups (the number in brackets after the group
    name indicates how many users are in it):


    ![](img/1529021fde33ef551603bbc71587313e_337_0.png)


    # What just happened?


    We''ve just created a new group, albeit so far with no one in it. As with most
    things in Moodle you aren''t committing yourself when you specify configuration
    settings. When configuring groups there are usually two settings that I return
    to once the group has some members:


    +   - I start leaving the group description blank and then ask the group, when
    they first get together, how they would like to describe themselves. If the course
    is converted to be entirely online then we''ll either have a chat or (more usually)
    I''ll start a forum discussion.

    +   - Likewise with the group picture, either I will take a group picture, or
    the group can choose a mascot for themselves, which I can then specify with the
    **New picture** setting.


    I''m going to repeat the previous process to create the Turbo group, and then
    I''m going to start adding students into my groups (the topic of the next section).'
  merge: -1
  img_proc: true
- pgno: 338
  md: '# Adding students to groups


    This can be achieved in two ways:


    +   - I manually add students to the group

    +   - The students enroll on the course and automatically join their group


    Let''s look at the first of these now.


    # Time for action – manually adding students to a group


    +   1. Return to the course front page and select Groups from the Administration
    block.

    +   2. Click on the name of the group you want to add members to and press the
    Show members for group button.

    +   3. Press the Add/remove users button.

    +   4. Select the users you want to add into the group (you can select more than
    one at a time) and press the Add button:


    ![](img/1529021fde33ef551603bbc71587313e_338_0.png)'
  merge: -1
  img_proc: true
- pgno: 339
  md: '5. Note that the users are immediately added to the group. If you then press
    the Back to groups button you will see the brackets after the group name now tells
    you how many users are in the group. If I click on the name then the members are
    listed in the Members of list:


    ![](img/1529021fde33ef551603bbc71587313e_339_0.png)


    6. That''s it. We''re done!


    # What just happened?


    We''ve just seen how easy it is to manually add a student to a group and removing
    a student from a group is as easy (did you spot the Remove button as you were
    adding users?).


    If you''ve a lot of students then that method can become cumbersome. The more
    typical way of grouping students is via the group enrollment key. Let''s see how
    to make that work now.


    # Time for action – specifying a group enrollment key


    +   1. Return to your course front page and click on Groups, under Course Administration
    then Users in the Settings block.


    +   2. Select the group you want to edit and press the Edit group settings button.'
  merge: -1
  img_proc: true
- pgno: 340
  md: '# What just happened?


    We''ve just specified an enrollment key for the group. This means that I can give
    a student the group enrollment key and when they come to enroll they use the group
    key (rather than the course key) to get on the course. This not only registers
    them on the course but also automatically adds them to the right group.


    Different groups can have different keys, and if I don''t want particular students
    added to any group at all then I just give them the course enrollment key.


    But once students are grouped, how do I manage their work? Let''s look at how
    you would make an activity a group activity.


    # Collaborating in groups


    To show how we can manage group work in Moodle we need to look at a collaborative
    activity. The process we''re about to run through applies to any collaborative
    activity, but let''s take a forum as an example:


    # Time for action – group work in a forum


    +   1. Choose a topic or week in your course, and with editing turned on click
    on Add an activity... and select Forum from the list.

    +   2. Give the forum a name and an introduction.

    +   3. Scroll down to the bottom of the page to the Common module settings box.
    The Group mode settings gives you three options:


    +   - No groups: This is the default. Student''s can see everyone''s work, regardless
    of which group they are in.

    +   - Separate groups: Students can only see the work of students in their group.
    As far as they are concerned they have their own forum.

    +   - Visible groups: Students can see the work of students in the other groups
    but they can only interact with students in their own group. It''s rather like
    splitting a class in two where both groups can see what the other is doing but
    they can''t interfere with their work.


    3. Specify a group enrollment key. This can be anything you like. To reveal the
    key you have just typed (so you can read it) ensure the Unmask setting is ticked.
    It''s useful in a school situation to have this as the name of the class for any
    course, for example, 9A, 9B, and so on.


    4. Press the Save changes button and you''re done.'
  merge: -1
  img_proc: true
