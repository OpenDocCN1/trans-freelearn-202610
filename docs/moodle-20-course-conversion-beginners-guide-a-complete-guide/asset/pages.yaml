- pgno: 139
  md: '# # Importing videos


    Including a video in your course (e.g. a AVI, MOV, FLV, or WMV file) is as easy
    as uploading the file to your course files area and creating a link to it on your
    course main page, following the instructions in *Chapter 3, Adding documents and
    handouts*.


    I''m going to talk about video file formats later in this section. For now, let''s
    get straight on to including a video file in our courses...


    # # Time for action – including a video on your course front page


    The method for including a video on your course front page is exactly the same
    as the method for including documents and handouts that we worked through in *Chapter
    3, Adding Documents and Handouts*. Let''s just run through the procedure again
    to remind ourselves:


    +   1. Upload the video to your private files area (see *Uploading Files* section
    in *Chapter 3, Adding Documents and Handouts* for more details). Remember that
    video files can be very big so it''s worth checking the upload limit.

    +   2. Select a topic and click on **Add a resource...** and choose **File** to
    display the **Adding a new File...** page.

    +   3. Specify a name (which is the link your students will click on to watch
    the video) and a brief description.

    +   4. Scroll down to the Content section and press the **Add...** button and
    the File picker is displayed. From the list of repositories on the left of the
    File picker, click **Upload a file**. Next to the Attachment box, press the **Browse...**
    button.

    +   5. Once you''ve found the file, or selected the file you want, press the File
    picker''s **Upload this file** button. The file will be listed in the **Content**
    section:


    ![](img/1529021fde33ef551603bbc71587313e_139_0.png)'
  merge: -1
  img_proc: true
- pgno: 140
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 141
  md: 'I can also keep students on Moodle and focus on learning (rather than sending
    them to YouTube where they will be tempted to watch other videos). They can also
    read the supporting text and watch the video at the same time. By having Moodle
    handle video playback I can avoid the problem of the student not knowing how to
    use the video player they have installed on their computer (which could be one
    of many).


    Before I begin there are two things I need to do with my video:


    +   1. Ensure the file is in the correct format (see *Choosing a video file format*
    later in this chapter).

    +   2. Upload the video, following the instructions in *Chapter 3, Adding Documents
    and Handouts*. I''ve created a separate Videos folder in my own My private files
    area to store all my videos in.


    # Time for action – embedding a video into a Moodle Page


    +   1. Create a new Page resource and give it a name and a brief description.
    I''m going to call mine Instructions For Making Hydrogen.

    +   2. I''ve started to add some text and an image to my instructions, and I am
