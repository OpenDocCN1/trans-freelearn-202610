- pgno: 318
  md: '# Summary


    We learned a lot in this chapter about enhancing our teaching using some of the
    more advanced Moodle modules.


    Specifically, we covered:


    +   - How to convert a test to a Moodle quiz using the quiz activity. We learned
    how each course has its own question bank, and that including a quiz on our course
    involves adding questions to the question bank and then adding questions from
    the question bank into our quiz. That way we can reuse questions easily—and easily
    share questions with our colleagues.

    +   - How to convert role-playing games, quandaries, and scenarios over to Moodle
    using the lesson activity. Lessons can take some time to set up, so it is often
    best to use them to support classroom-based teaching.

    +   - Allowing students to collaborate online with project work using the wiki
    activity. We saw how the wiki system makes creating new pages fast and easy. We
    also learned that you can specify a template: useful if there are forms for students
    to fill in and you want to provide a guide.

    +   - Setting up an online multimedia dictionary using the glossary activity.
    We saw that not only could I convert my handout of ballistics-related terms to
    something a little more engaging, but students can also work together on a Moodle
    glossary, allowing me to turn this into a teaching activity.

    +   - How straw polls can be converted to Moodle using the choice activity. By
    converting to Moodle I can better monitor which students are actively getting
    involved in the class and which students might need a little more encouragement.


    Along the way, we discussed how to use our newly honed skills in making online
    content engaging and entertaining—especially when it came to configuring the activities
    we have been learning about in this chapter.


    Now that we''ve learned about Moodle''s more advanced activities, we''re ready
    to start putting it all together—which is the topic of the next chapter.'
  merge: -1
  img_proc: true
- pgno: 319
  md: '# # 9


    # # Putting it All Together


    *Just think about all that we''ve covered together in previous chapters.*


    *We started, in Chapter 2, Setting up your Courses by learning how to configure
    a Moodle course and how to make it ready for our teaching materials.*


    *In Chapter 3, Adding Documents and Handouts we began the process of converting
    our teaching materials over to Moodle, and learned how, by doing so we could not
    only store and manage those materials more easily, but we also saw how easy it
    was to hand out resources to students from the course front page.*


    *After learning how to hand out work in Moodle we looked, in the bonus chapter,
    Handing in Work through Moodle at how easily we can have our students hand in
    their work via Moodle, a topic we returned to in detail in Chapter 6, Managing
    Student Work.*


    *In Chapter 4, Sound and Vision—Including Multimedia Content and Chapter 5, Moodle
    Makeover we saw how we could use graphics, video, and audio to make our Moodle
    courses much more engaging and entertaining.*


    *Not only can we convert our resources to Moodle, we learned in Chapter 6, Managing
    Student Work that we can manage student work online, too.*


    *We can also convert classroom discussions over to Moodle using forums and chats,
    and we explored just a few of the benefits of doing so in Chapter 7, Communicating
    Online.*'
  merge: -1
  img_proc: true
- pgno: 320
  md: 'In the previous chapter we looked at just five of the many Activity modules
    Moodle provides. We looked on these as a great ways of enhancing your online teaching:


    +   - Quizzes

    +   - Moodle lessons for exploring scenarios

    +   - Workshops for peer review

    +   - Wikis for collaborative working

    +   - Glossaries

    +   - Choices


    In this chapter we are going to bring all of this together and look at possible
    ways of structuring a course that has been converted to Moodle.


    In this chapter we shall be answering the vital question: where do I go from here?
    We will look at:


    +   - Structuring an online course to support face-to-face teaching (so-called
    "blended learning")

    +   - Converting group working to Moodle, how to manage groups online

    +   - How to check student progress

    +   - To make sure we don''t lose all of our hard work

    +   - How to back up and restore courses.


    There''s a lot to cover, so let''s make a start by looking at how you can use
    Moodle to support face-to-face learning.


    # Blended learning with Moodle


    Blended learning is when you support your face-to-face teaching with online resources
    and activities. In this section we will learn how we can achieve this using the
    skills and techniques we have learned so far.


    # Why blended learning


    In this book we''ve been working together as I''ve been converting my Backyard
    Ballistics course over to Moodle. Yet another course I run with my students is
    a two-week project on jet engines, culminating with us building working pulse
    jets and maintaining/developing a bench-size turbo jet engine.'
  merge: -1
  img_proc: true
- pgno: 321
  md: 'How might I want to support that project with Moodle? Well, by converting to
    Moodle I can:


    +   Manage all of my teaching resources in one place and have full control over
    how they are presented to students (Chapter 3, Adding Documents and Handouts,
    Chapter 4, Sound and Vision—Including Multimedia Content, and Chapter 5, Moodle
    Makeover)


    +   Encourage discussion and debate using the online communication skills we experienced
    in Chapter 7, Communicating Online


    The students on my Jet Engine course don''t know each other before the course
    starts. Moodle provides the ideal way to make introductions (I can register them
    on Moodle when they sign up for the course), and a great way for them to communicate
    after the face-to-face sessions have ended.


    Because our time together is so short, they can get guidance and support with
    the project work they have to carry out to gain their final certificate using
    both Chapter 7, Communicating Online (forums and chats) and in the bonus chapter,
    Handing in Work through Moodle and Chapter 6, Managing Student Work (where we
    learned how to manage student work).


    I''ve spoken to my Moodle administrator about creating a new course for me; she''s
    done this and now I''m ready to start converting.


    # Structuring your course – Modifying the course settings


    The first task is to alter the course settings to fit the course we are about
    to give. My admin has basically just added the new course to the Faculty of Science
    category and made me a teacher. This means I''ve got a little bit of setting up
    to do before I start uploading my resources.


    # Time for action – new course quick configuration


    +   1. Go to your course front page. In the course Settings block, under Administration
    block click on Edit settings.


    +   2. Give your new course a name and a short name. Remember that the short name
    must be unique.


    ![](img/1529021fde33ef551603bbc71587313e_321_0.png)


    > Have you discussed with your colleges a naming convention for course short names?
    If you haven''t then this might be a good idea. Having a convention will make
    it easier for students to navigate around your Moodle site. It will also make
    it easier if your admin ever wants to have students enrolled on courses automatically.'
  merge: -1
  img_proc: true
- pgno: 322
  md: '3. Think of a description for your new course. Try to make it inviting, it''s
    the first thing students will see before they are actually enrolled on your course.
    Try not to make it too elaborate, you know how to use the Moodle Editor and you
    know how to include graphics, audio, and video in your course summary if you wanted
    to. Try to resist going overboard using these techniques in the course summary,
    it will put students off when they are trying to look through the list of courses
    in our course category. I''ve included an animated GIF, but I''ve arranged the
    layout so that it is over on the right-hand side of the summary:


    ![](img/1529021fde33ef551603bbc71587313e_322_0.png)


    When my course appears in the list of courses in this category, having the image
    over on the right-hand side makes the list of courses easier to read through.


    4. Set the course format. Mine''s a two-week course starting in August. I''m going
    to set the configuration accordingly:'
  merge: -1
  img_proc: true
