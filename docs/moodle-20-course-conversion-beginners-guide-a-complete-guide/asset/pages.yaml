- pgno: 185
  md: '![](img/1529021fde33ef551603bbc71587313e_185_0.png)


    +   Have you added a Voki to your course? Move your Voki character into an HTML
    block. Students can hide the character by clicking on the hide icon in the corner
    of the block:


    ![](img/1529021fde33ef551603bbc71587313e_185_1.png)


    +   If you don''t see a hide icon speak to your Moodle administrator. Your Moodle
