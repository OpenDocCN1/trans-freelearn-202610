- pgno: 23
  md: '# 1


    # Going Electric


    > Imagine a world where you could set your students tests and they would come
    in already marked. Imagine a time when pupils could submit their coursework and
    projects digitally instead of on paper. Not only would we save an awful lot of
    trees, but there would be no more "the printer ran out of ink" type excuses for
    not handing in homework on time. If only there was a system that allowed students
    and teachers to exchange work through a carefully administered, fully automatic
    digital framework, you would never have to worry about a student''s work ever
    going missing again.


    These systems do exist and they''re called Virtual Learning Environments (VLEs)
    or Course Management Systems (CMSs) depending on who you ask. Moodle is one of
    many, but it''s certainly the one that''s become by far the most popular in all
    tiers of education, including work-based learning, too.


    Advances in technology are driving the use of Moodle. There is the rise of the
    low-cost mini laptop (for example, the Dell Latitude or Asus EEE PC) which makes
    having a portable, Internet-enabled device for every pupil a practical reality
    in many schools. Add to this the simple fact that young people now find IT much
    more engaging as a learning tool.


    No doubt these are just a few of the reasons why you find yourself wondering how
    to start converting your teaching over to Moodle. Maybe you are wondering how
    to advocate using Moodle in your school. Perhaps your school is converting to
    Moodle and you are worried about being left behind.


    Are you currently only teaching face-to-face in a classroom or lecture theatre?
    Maybe you''re using another managed learning environment (if you are then you
    don''t know what you''re missing!) and need to convert. The question is: how do
    I convert to Moodle? That''s the question we''ll be answering in this book.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# *Going Electric*


    To help us get an appreciation of the tool we are about to use, we begin by looking
    at a little of the Moodle back story. But as soon as we can, let''s log on, have
    a walk around the system, and then let everyone know we''ve arrived.


    In this chapter we shall:


    +   - Learn why Moodle was created and how it was developed

    +   - Learn how to log on and log out

    +   - Explore the Moodle interface and start learning some Moodle terminology

    +   - Configure our user profiles


    So let''s make a start.


    # What can Moodle do for me


    Moodle provides you with the tools to store and present music, speech, video,
    have online group chats, quizzes and, as we have mentioned, manage assignment
    submission. Let''s take a look at just a few of the advantages of converting to
    Moodle.


    Most of us have shared online areas where we can distribute worksheets and handouts
    to students. However, often those shared areas can''t be accessed from home. Moodle
    solves this problem. Shared areas can also become disordered. With Moodle you
    can manage and organize the sharing of resources easily. Also you can make the
    way you hand out work much more visually appealing; the process is made far friendlier
    to cautious students.


    Third-party content providers have wised up to the idea of learning platforms
    and more of the resources they provide are specifically designed for environments
    such as Moodle.


    But Moodle isn''t just another resource repository. The ''M'' in Moodle stands
    for ''modular'', and there are Moodle modules that allow you to set assignments
    and mark them fully online (with Moodle managing the marks for you), and modules
    to allow you to set tests and have them marked automatically. In fact, if there
    is something you want Moodle to do and an "out of the box" installation doesn''t
    support it, then chances are there is a module you can enable or install that
    will provide the functionality you need. For example, when my administrator enabled
    mathematical notation support in our school''s Moodle, a new button appeared in
    the text editor that enabled me to easily create math symbols:'
  merge: -1
  img_proc: true
- pgno: 25
  md: '![](img/1529021fde33ef551603bbc71587313e_25_0.png)


    Because Moodle is available wherever there is Internet access, Moodle can be used
    to support students who can''t make it to the classroom, for whatever reason.
    Perhaps they are ill, perhaps they are taking a course that requires them to be
    at a different college, or maybe they are on work-based training and you need
    to carry on with your teaching while they are there.


    Moodle is another tool in your teacher''s toolkit. I wouldn''t want you to think
    that migrating to Moodle means more work for you. That''s where this book comes
    in. I''ll show you how to get your existing teaching material online quickly and
    easily. At the end of the book, if you are developing new learning resources then,
    rather than creating handouts in Word or a presentation in PowerPoint, think about
    the myriad of features in Moodle (just a few of which I''m going to introduce
    to you) and how you could use these in your teaching.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# Going Electric


    # Advantages for the student


    Moodle provides a consistent "user interface". What do I mean by that? Well, although
    generations younger than me are very familiar with computers, they tend to know
    how to use certain programs and applications (instant messaging and social networking
    are the favorites) but have no idea how to work with anything else. Moodle contains
    lots of different learning tools but, because they all have a consistent user
    interface, if you learn how to use one then it doesn''t take much more effort
    and understanding to start using the others. I have up to this point never had
    to show a student how to use Moodle.


    Being always available means Moodle can support students beyond the dismissal
    bell. If work needs to be carried on over the weekend, or during a holiday, or
    when pupils are on exam leave, then Moodle can provide that support. Students
    who are reticent about making a contribution in class are often more than happy
    to make an input online.


    Because Moodle can mark tests as soon as the student takes them, they can gain
    immediate feedback on their work.


    # The advantage of open source


    Moodle is open source, that is, it''s basically free. But don''t let the fact
    that it''s free put you off. This is very much a positive. Moodle is supported
    by a close network of developers working hard to ensure that Moodle is secure,
    safe, and robust. For more information on how Moodle development takes place see
    http://docs.moodle.org/en/Development:Overview. We''ve already learnt how the
    ''M'' in Moodle stands for modular. If you are comfortable with web development
    then there''s always the opportunity to create your own Moodle modules. As you
    can tell, I''m a big fan of open source software. If you''re of a technical persuasion
    then you can experiment with Moodle without ever having to worry about software
    licensing costs. Many teachers have downloaded their own free copy of Moodle to
    try out new teaching ideas (see http://docs.moodle.org/20/en/Windows_installation_using_XAMPP).
    Many schools have a second copy of Moodle for development purposes.


    For more information on developing your own custom Moodle plugins check out *"Moodle
    1.9 Extension Development", Jonathan Moore and Michael Churchward, Packt Publishing.*


    # Who is this book for


    This book is aimed at educators. We assume that it''s your job to teach, not to
    have to set up a Moodle site (we assume that this has already been done for you).
    We are also assuming that if there''s any admin task that needs to be performed
    (a setting that needs tweaking or a switch that needs to be turned on), then your
    Moodle admin will do it for you. If you do need support in setting up and configuring
    your site check out *"Moodle Administration", Alex Büchner, Packt Publishing.*'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# # What will we be doing together


    In this chapter we are going to be looking at the history of Moodle – where it
    came from, and what factors influenced its development. This is important because
    Moodle is simply a tool to do a job. If we can understand why Moodle is designed
    the way it is, then if we come to try and use Moodle in a way it really wasn''t
    intended to be used, we''ll know why our approach might not work. Then we look
    at logging in and out of Moodle, how to change our user profiles and, importantly,
    how to change our passwords if we need to. We''ll also be exploring the Moodle
    user interface – the names of the elements that make up a Moodle page (then you''ll
    know what everyone is talking about when they refer to "breadcrumbs" and "blocks").


    The rest of the book is broken up into two parts.


    # ## Moodle course conversion: Part 1


    In Part 1, we learn how to convert documents and handouts over to Moodle.


    Our first task is to set up and configure a Moodle "course". This is where we''re
    going to put our documents and handouts, and where we will be setting quizzes
    and so on. This we''ll be covering in *Chapter 2, Setting up your Courses*.


    In *Chapter 3, Adding Documents and Handouts*, we''ll be learning how to import
    documents to Moodle and how to give students access to them. Not all students
    will be able to open our documents (as that will depend on the software they have
    installed on their computers), so we''ll be looking at tips and tricks we can
    use to make sure our resources are accessible to everyone, regardless of the software
    they have installed.


    Once we''ve handed out the work online we''ll need to provide a way for our pupils
    to hand in their completed work. In the bonus chapter, *Handing in Work through
    Moodle*, we''ll see how even very young pupils can quickly and easily upload their
    homework via Moodle. Doing so means we can even manage their grades online, too.
    The bonus chapter provides the groundwork for *Chapter 6, Managing Student Work*,
    will cover converting whole projects and assignments over to Moodle (see Part
    two).


    Converting to Moodle means that we can easily include video and audio. In *Chapter
    4, Sound and Vision—Including Multimedia Content*, we learn how to use sound and
    vision to make our teaching materials more appealing to students.


    In *Chapter 5, Moodle Makeover*, we spend time reviewing and experimenting with
    what we have learned so far. We cover how we can finesse our courses.'
  merge: -1
  img_proc: true
