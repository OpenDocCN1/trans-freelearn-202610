- pgno: 188
  md: '# What just happened?


    I think I would probably burst into tears if I''d have lost all of the work that
    I''ve done so far. Thank goodness that backing up my course is easy. I simply
    select **Backup** from the course **Settings** block and follow the instructions.
    There are lots of settings allowing me to choose what I actually back up, but
    at the moment I''m just wanting to back up everything, there really isn''t any
    harm in doing that. Remember: we''ll be looking again at what you can do with
    backup and restore later in this book.


    # Summary


    We have spent the first half of this book learning about Moodle and seeing how
    we can take the resources we''ve been using and importing them into our Moodle
    course. We''ve come across many different techniques we can use to achieve this,
    and we''ve used this chapter to spend a little extra time practicing and reinforcing
    the ideas we have learned in this book so far.


    Specifically, we covered:


    +   - Arranging resources within topics to make topics look more visually appealing.
    We used the Label resource as the glue to hold resources together.

    +   - We took a comprehensive look at tips and tricks we can use to make our courses
    more engaging for students.

    +   - We included an animated character using Voki.com, and gained more practice
    at using embeddable code. Other free, animated characters are available (for example,
    http://digimi.com).

    +   - We used an HTML block to provide a welcome message to our students.


    We''ve covered converting the so called "static" elements of a taught course from
    the classroom to the computer. But my teaching isn''t just about giving PowerPoint
    presentations and handing out information sheets. I set my students projects and
    assignments. I give them little quizzes as we are working through the course.
    We''ll learn all about managing student work online in the next chapter.'
  merge: -1
  img_proc: true
- pgno: 189
  md: '# # 6

    # Managing Student Work


    _I think you''ll agree that we''ve come a long way in the first half of this book.
    We''ve got all of our documents, handouts, videos, and sound files uploaded. In
    the previous chapter, we investigated lots of ways we can make our courses more
    engaging and entertaining for students. Have you checked out the free Moodle 2.0
    Course Conversion sample chapter download on the Packt Publishing website? This
    sample chapter looks very briefly at how students can hand in their work through
    Moodle. In this chapter we expand on that theme to learn how to fully manage online
    work that students need to hand in to me._


    Currently, in my Backyard Ballistics course, I set two major end-of-course projects:


    +   - A poster on energy sources

    +   - A PowerPoint presentation to the group on how energy is transferred when
    objects are sent flying through the air


    Both tasks are graded separately.


    There are a number of headaches associated with assignment submissions: files
    (such as PowerPoint presentations) go missing. Students claim they have e-mailed
    files that never reach you. The school technician is wary of students bringing
    in work on memory sticks because of the threat of viruses. There''s no quick way
    of knowing which students have yet to hand in their work. Marking might involve
    having to make notes on paper, and having a system to associate those notes with
    digital photographs of work stored elsewhere. We need a system that allows us
    to manage student submissions in one self-contained tool—one that can be used
    to exchange files between our students and us without having to resort to other,
    far less reliable, means. As well, wouldn''t it be good to have a tool that allows
    us to comment (and include photographs, videos—in fact, any digital file we liked)
    and grade work all under one umbrella?'
  merge: -1
  img_proc: true
- pgno: 190
  md: 'Added to that, you might be required to grade students on key skills: numeracy,
    literacy, and the use of ICT. And that''s not something you might specifically
    set a project for. In that case, we would need a way of grading students on those
    aspects of their work separately from any specific project. That''s yet another
    headache!


    By converting to Moodle we can easily find answers to all of these issues, and
    more.


    In this chapter, we shall:


    +   - Demonstrate how to manage projects and assignments online

    +   - Learn how to mark student projects online, including specifying your own
    custom grades

    +   - Learn how to manage student grades, including grading them on their key
    skills

    +   - Show how work can be passed between students and teachers online without
    resorting to e-mail, burning CDs/DVDs, or students having to bring in work on
    a memory stick


    So let''s get on with it, and make a start with converting my poster project and
    PowerPoint assignments to Moodle...


    # Converting projects and assignments


    Earlier in this book, I introduced you to the four ways an out-of-the-box Moodle
    provides for managing student work online. Recall that there are four types of
    assignment activity, and they will match any kind of project that you are likely
    to set your students. As we did in that Chapter 5, Moodle Makeover, turn editing
    on, go to any topic and click on the Add an activity list. In this list, you will
    see the four different assignment types Moodle supports. They are:


    +   - **Offline activity**: If your student projects can''t be uploaded into Moodle
    because the student submission isn''t electronic (just like my poster project)
    then you can manage grades and your notes on the students'' work using this kind
    of assignment type.

    +   - **Online text**: Students are going to be creating the assignment submission
    using the text editor built into Moodle. That''s the one we''ve been using to
    create our course so far.

    +   - **Upload a single file**: Students can only upload one file. That''s the
    activity we used to allow our students to hand in their homework to us earlier
    in this book.'
  merge: -1
  img_proc: true
- pgno: 191
  md: '+   - **Advanced uploading of files:** Students can upload more than one file.
    As a teacher, you can also use Moodle as a mechanism for exchanging files between
    students, instead of using e-mail (unreliable), or a memory stick (virus risk).


    Take a look at these assignment types now. With editing turned on, click on **Add
    an activity...** and select any of the assignment types. That way you can get
    a feel for the kinds of settings we''ll be dealing with before we start.


    > Remember: if, while you are trying out different assignment types, you mistakenly
    add an assignment to your course, you can easily delete it by clicking on the
    delete icon next to the assignment name.


    # ## Structuring converted projects and assignments online


    For larger projects or assignments, it is often preferable to have a self-contained
    topic containing the actual assignment itself, together with any supporting materials.
    You could include exemplars (for example, examples of work from previous years)
    and give students the opportunity to discuss them together. There''s more on using
    Moodle to discuss exemplars online later in this book. By having the assignment,
    and all of the supporting materials, in a single topic means I can hide the assignment
    from students until it is time for them to attempt it.


    To demonstrate how this would be done, firstly we need to add a new topic to our
    course, and then we can add in an assignment activity.


    # ## Adding a new topic to a course


    I''m going to add a new topic to my course specifically for my student projects.
    Then I''m going to hide that topic until we have covered the course. Remember
    how we hid a "teacher''s only" topic in the course earlier in this book? I''m
    going to do the same with my projects and the support materials associated with
    them. You don''t have to treat assignments in this way: as you work through the
    settings for a Moodle assignment you''ll notice that you can specify a time period
    that those assignments are available for (it''s a setting we''ll talk about shortly).
    I''ve decided that I want to ensure that my students focus on the preliminary
    work before they start attempting any assignments so I will completely hide this
    element from them.'
  merge: -1
  img_proc: true
- pgno: 192
  md: '# Time for action – adding a topic and hiding it


    +   1. Return to your course front page and choose Edit settings from the Settings
    block.

    +   2. Scroll down to the number of weeks/topics setting and change the number
    in the drop-down list to add another topic to your course:

    +   3. At the bottom of the page, press the Save changes button. That''s it, we''re
    done—and now there''s a new empty topic at the end of your course.

    +   4. For the moment, I want to hide this topic from students. Click on the eye
    icon on the right-hand side to hide the topic:

    +   5. It depends on your theme but, to show that a topic is hidden, two gray
    bars are shown on the left- and right-hand side of the topic:


    ![](img/1529021fde33ef551603bbc71587313e_192_0.png)


    ![](img/1529021fde33ef551603bbc71587313e_192_1.png)


    ![](img/1529021fde33ef551603bbc71587313e_192_2.png)


    # What just happened?


    We''ve now got a new, empty topic added to our course. I don''t want students
    to be able to view the assignment until we are all ready, so I''ve hidden this
    topic from them for now.'
  merge: -1
  img_proc: true
- pgno: 193
  md: '# Which assignment type


    For the purpose of my project, I''m only going to be looking at two different
    assignment activity types—but by looking at those two now and from having looked
    at the Single File assignment earlier on in this book, we''ll gain the skills
    and confidence to be able to use all the available types quite happily. It''s
    worth noting that because Moodle is modular, software authors have provided other
    assignment types: a popular addition (especially among language teachers) to any
    Moodle is the Nanogong assignment (http://gong.ust.hk/nanogong/index.html). Again,
    with the experience gained here you''ll soon be able to get to grips with any
    custom assignment module you find installed in your Moodle.


    # Converting a project to Moodle using an Offline assignment


    The first project—the poster project—is going to be converted to use the Offline
    activity assignment type. I''m going to use Moodle to manage student grades and
    to organize my notes and comments on their work. Let''s see how easy it is to
    add an Offline activity.


    # Time for action – adding an Offline activity assignment


    +   1. Make sure you still have editing turned on. In the topic you want to add
    your new assignment to (in my case my new, hidden topic) click on Add an activity...
    and choose Offline activity from the list. You''re now taken to the Editing assignment
    page.

    +   2. Give your assignment a name. Enter in a brief description of the task in
    the Description box. Don''t worry if the box looks a bit small. We can include
    all of the supporting materials in the topic together with the assignment activity
    itself on the course front page:


    ![](img/1529021fde33ef551603bbc71587313e_193_0.png)'
  merge: -1
  img_proc: true
- pgno: 194
  md: '3. Use the Grade setting to specify the maximum grade you are going to give
    for this assignment. I''m going to leave the Grade setting at 100 (meaning I can
    grade this assignment out of 100). Maybe your assignment forms part of an overall
    mark and you need to mark it out of less. You could choose to mark your assignment.
    You can even choose to create your own custom grades (for example, A, B, C, D,
    E, or F), which we learn how to do later on in this chapter.


    4. Choose when you want the assignment to be available. I want to hide both the
    assignment and the supporting resources and materials, so this option is redundant.
    I do have the option of disabling this setting so this is what I''m going to do,
    in this instance. If you aren''t hiding the assignment, the Available from and
    Due date settings are a useful way of preventing students handing work to you
    before you are ready:


    ![](img/1529021fde33ef551603bbc71587313e_194_0.png)


    5. That''s it! We''re done. Press the Save and return to course button. A new
    assignment has just been added to the course:


    ![](img/1529021fde33ef551603bbc71587313e_194_1.png)


    # What just happened?


    Converting my poster project to Moodle was as easy as adding an Offline assignment
    activity to my Backyard Ballistics course. Click on the assignment now to see
    what happens. You''ll see a screen displaying the task you''ve just set, and in
    the top right-hand corner you''ll see a No attempts have been made on this assignment
    link:'
  merge: -1
  img_proc: true
- pgno: 195
  md: '![](img/1529021fde33ef551603bbc71587313e_195_0.png)


    Click on that link now. You''ll be taken to a list of students who are enrolled
    on your course. If you don''t have any students enrolled on your course then this
    is what you will see:


    ![](img/1529021fde33ef551603bbc71587313e_195_1.png)


    I''m the only person "enrolled" on my course (as teacher). I don''t yet want students
    enrolled on my course until I know it is set up to be how I want it. In the free
    bonus chapter from the Packt Publishing website I demonstrate how to introduce
    a ''control student'' on a Moodle course. I''m going to do the same again to test
    out my new included assignments. But before we do that, I''m going to think about
    the second assignment I need to convert—where students are required to produce
    a PowerPoint presentation.


    # Converting a project to Moodle using an Advanced uploading of files assignment


    I''m going to get students to submit their PowerPoint file using an Advanced uploading
    of files assignment type. Why not upload a single file? Here are the advantages
    of using an advanced uploading of files assignment:


    +   Students can upload more than one file (the total number is controlled by
    me)'
  merge: -1
  img_proc: true
- pgno: 196
  md: '+   ◆ My students and I can exchange work online, without us having to resort
    to memory sticks and e-mail


    Let''s run through the process of adding an Advanced uploading of files assignment
    now...


    # Time for action – adding an Advanced uploading of files assignment


    With editing turned on, in the topic you want to add your new assignment to, click
    on **Add an activity** and choose **Advanced uploading of files**. Now you are
    at the **Editing assignment** page. There are many more configuration options
    for this activity compared to an Offline assignment, but for now I''m just going
    to worry about the important ones. Remember, for more information on specific
    settings, check out the Moodle docs for this page link at the bottom of the page—and
    you can always come back and change settings later on if you need to.


    +   1. Give your assignment a name and fill out the description.

    +   2. Use the **Grade** setting to specify the maximum grade you are going to
    give for this assignment. I''m going to leave the Grade setting at 100 (meaning
    I can grade this assignment out of 100). Maybe your assignment forms part of an
    overall mark and you need to mark it out of less. You can even choose to create
    your own custom grades (for example, A, B, C, D, E or F), which we learn how to
    do later on in this chapter.

    +   3. Scroll down to the **Advanced uploading of files** options box:


    ![](img/1529021fde33ef551603bbc71587313e_196_0.png)'
  merge: -1
  img_proc: true
- pgno: 197
  md: '4. Because it is a PowerPoint presentation, I''m expecting students to upload
    it. I''m going to set the maximum file size accordingly. And I''m going to allow
    students to delete what they have uploaded (in case they accidentally upload the
    wrong thing).


    5. If you want to allow students to include a short note with their submission
    then make sure Allow notes is set to Yes:


    ![](img/1529021fde33ef551603bbc71587313e_197_0.png)


    6. Because I''m hiding both of these projects until I''m ready, I can leave the
    Hide description before available date as No. If, instead of hiding the entire
    assignment as I am, you are employing the Available from and Due date settings
    then set Hide description to Yes. Students will know they''ve got an assignment
    coming but the description is only revealed when the Available from date is reached.


    7. Set Email alerts to teachers to Yes so that you know when a student has submitted
    their work. Use this setting with caution: if you are a teacher on a course who
    isn''t interested in the submission of pieces of work then receiving dozens of
    e-mails saying student work has been submitted will become tiresome (as well as
    annoying).'
  merge: -1
  img_proc: true
- pgno: 198
  md: '8. Scroll down to the bottom of the page and press Save and display. Your new
    assignment is now configured:


    ![](img/1529021fde33ef551603bbc71587313e_198_0.png)


    # What just happened?


    We''ve just completed adding two types of assignment, an Offline activity and
    an Advanced uploading of files assignment. We haven''t covered the Online text
    assignment type but with the skills and experience you''ve gained so far you will
    be able to use those types with ease. Before we learn how assignments are marked
    in Moodle, why not spend a little time having a look at the Online text assignment
    now?


    # Introducing a student on your course


    You''ve seen how easy it is for us to add assignments and project work to our
    courses. However, we do need to have a feel for how it is to be a student using
    Moodle to hand in work using assignments—and check our grades and teacher feedback
    after we have handed our work in. As with earlier in this book, what we need at
    this stage isn''t one of our actual students. We need a ''control student'' and,
    luckily, my Moodle admin has already created one for me (see the Moodle 2.0 Course
    Conversion free bonus chapter download on the Packt Publishing website). This
    lets me log in as a test student.'
  merge: -1
  img_proc: true
- pgno: 199
  md: '# Enrolling a student


    My Moodle admin has created a test student for me and previously enrolled that
    student on my course. Assuming you have permission to enroll students (you can
    check with your Moodle admin if you''re not sure), here''s how to enroll your
    own students:


    # Time for action – enrolling a student on your course


    +   1. In the **Settings** block, under **Course administration**, look for the
    **Users** link and click on it—then click on **Enrolled users**:


    ![](img/1529021fde33ef551603bbc71587313e_199_0.png)


    +   2. The Enrolled users screen is displayed. To enroll a new user, click on
    either of the **Enrol users** buttons:


    ![](img/1529021fde33ef551603bbc71587313e_199_1.png)'
  merge: -1
  img_proc: true
- pgno: 200
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 201
  md: '5. Press the **Enrol** button to the right of the student''s name to enroll
    the user as a student. Their name is then indented and the **Enrol** button disappears:


    ![](img/1529021fde33ef551603bbc71587313e_201_0.png)


    6. Click on the close icon in the top right-hand corner of the popup to both close
    the dialog and to actually enroll the student. You''ll then see the student listed
    on the **Enrolled users** page:


    ![](img/1529021fde33ef551603bbc71587313e_201_1.png)


    7. That''s it! We''re done.'
  merge: -1
  img_proc: true
- pgno: 202
  md: '# What just happened?


    Rather than bothering my Moodle admin to enroll the test student on my course,
    I''ve enrolled the user as a student myself. Armed with this knowledge, I could
    enroll my entire class on to my course if I wanted to. But there are various ways
    of managing enrollment (including having my students enroll themselves using a
    password selected by me), which we will be investigating in later chapters.


    Remember: before I log in as a student, I need to reveal the assignment topic.
    If I don''t and I''m a student, then I''ll see this:


    ![](img/1529021fde33ef551603bbc71587313e_202_0.png)


    The topic isn''t available. Make sure you click on the closed eye icon to open
    the eye and reveal the topic before you log out.


    # How assignments look to a student


    I''ve logged out and then logged back in as student John Smith. As far as Offline
    assignments are concerned, they are carried out in the real world. In that instance,
    Moodle is used to manage grades and notes. If I click on my Offline assignment,
    I just see a description of the assignment:'
  merge: -1
  img_proc: true
- pgno: 203
  md: '![](img/1529021fde33ef551603bbc71587313e_203_0.png)


    My second assignment requires students to upload a file. In the next section,
    we experience a little of what life is like as a Moodle student when we try uploading
    a project submission to Moodle.


    # Taking the Student''s point of view – Uploading a project file


    It is a very good idea to see what we are expecting our students to do when we
    ask them to upload their project work to us online. At the very least, when we
    ask students to upload their project work to Moodle, we need to know what we are
    talking about in case they have any questions. If you don''t have a student login
    or you are still logged in as yourself and have asked a colleague to check that
    your assignment is working correctly, it''s a good idea to take a good look over
    their shoulder while they are running through the following steps. Together, let''s
    run though what a student must do to upload a file to us.'
  merge: -1
  img_proc: true
- pgno: 204
  md: '# Time for action – uploading a file to an assignment


    I only have one computer to work from, so the first thing to do is for me to log
    out and log back in as my pretend student "John Smith". If you have the luxury
    of having two computers next to each other then you can log in as yourself on
    one and your pretend student on the other at the same time. You might have two
    different browsers (for example, Firefox and Internet Explorer) installed on the
    same computer. If so, you can log into one as a teacher and the other as a student.
    Don''t try to log in as two different people on the same computer using the same
    browser—it doesn''t work. Now that you are logged in as a student.


    +   1. Return to the course main page and click on the Advanced uploading of files
    assignment you added earlier. You will be presented with the following page:


    ![](img/1529021fde33ef551603bbc71587313e_204_0.png)


    The top half of the page is our description of the assignment. The second half
    allows us to upload a file and, because I configured the activity such that students
    could include comments with their submission, an area allowing us to add a note.
    Students can browse for files and upload them in exactly the same way as we upload
    our teaching materials to the course files area. If they want to add a note then
    they need to press on the Edit button (at the bottom of the previous screenshot).'
  merge: -1
  img_proc: true
- pgno: 205
  md: '2. Click on the **Upload files** button now. On the following screen, press
    the **Add..** button to display the File picker dialog. This allows us to select
    a file to upload. You can choose any for now, just to prove the point. I''ve quickly
    created a text file using Notepad called `example_submission.txt`. Select the
    file you want to upload using the File picker (via the **Upload a file** link
    on the left-hand side):


    ![](img/1529021fde33ef551603bbc71587313e_205_0.png)


    3. Press the **Upload this file** button. Then, press the **Save changes** button.
    You will now see the file listed in the **Submission draft** box:


    ![](img/1529021fde33ef551603bbc71587313e_205_1.png)'
  merge: -1
  img_proc: true
- pgno: 206
  md: 'As you may have spotted, you can use the File picker to upload more than one
    file if you need to.


    4. To add a note to go along with the submission, I can press the Edit button
    towards the bottom of the page. Try leaving a note now. (If your assignment has
    been configured so that students are prevented from leaving a note, you won''t
    have this option).


    5. If I am happy that this is the final version of the project and I want to send
    it for marking then I can press the Send for marking button at the bottom of the
    page. Pressing this stops me from uploading any more files:


    ![](img/1529021fde33ef551603bbc71587313e_206_0.png)


    6. That''s it. We''re done:


    ![](img/1529021fde33ef551603bbc71587313e_206_1.png)'
  merge: -1
  img_proc: true
- pgno: 207
  md: '# What just happened?


    It was easy for us to convert our assignments to Moodle. Now we''ve seen how easy
    it is for students to convert to using Moodle to hand in their assignment submissions.
    We''ve also actually got a piece of work to mark (albeit a pretend piece) and
    I am ready to start marking.


    Before moving on to the next section, make sure you are logged in as yourself
    rather than as a student.


    # Marking assignments


    Managing student grades and the paperwork associated with student submissions
    is one of my biggest headaches. By converting to Moodle I can avoid all of these
    problems. Let''s see how easy it is to mark assignments in Moodle.


    # Marking Offline assignments


    My Offline assignment, the poster project, is being carried out in the real world.
    Currently, I take a digital photograph of the poster and record my comments and
    grades on separate pieces of paper. Let''s see how I can convert this to Moodle...


    # Time for action – marking an Offline assignment


    +   1. From the course front page, click on your **Offline assignment**.

    +   2. Click on the **No attempts have been made on this assignment/View 0 submitted
    assignments** link in the top right-hand corner of the page. You are now taken
    to the Submissions page. I''ve only got one student enrolled on my course—the
    pretend student my admin created and I enrolled on my course for me—so this is
    what I see:


    ![](img/1529021fde33ef551603bbc71587313e_207_0.png)'
  merge: -1
  img_proc: true
- pgno: 208
  md: '3. To grade John Smith''s work I need to click on the Grade link, found in
    the Status column. The Feedback page is displayed:


    ![](img/1529021fde33ef551603bbc71587313e_208_0.png)


    4. I can use this screen to comment on the student''s work. At this point I can
    include a photograph of the poster in the comment, if I wanted to (or I could
    get the students to take photographs of their posters and get them to upload the
    images as part of an online submission).


    5. If the work is complete and ready for marking I can specify a mark (in my case
    out of 100) using the drop-down list in the Grades section:


    ![](img/1529021fde33ef551603bbc71587313e_208_1.png)'
  merge: -1
  img_proc: true
- pgno: 209
  md: '6. When you have finished commenting and/or grading, press the **Save changes**
    button. The Submissions table is updated accordingly:


    ![](img/1529021fde33ef551603bbc71587313e_209_0.png)


    What happens after you press **Save changes**? From the teacher''s point of view,
    the **No attempts have been made on this assignment** link changes to **View 1
    submitted assignments**. If you are a student then you may have been sent an e-mail
    advising you that you have received feedback on your assignment (depending on
    how your Moodle has been set up).


    # What just happened?


    We have seen how easy it is to convert to using Moodle to manage student grades
    and my comments on student work for my "Offline" poster project. Remember that,
    as with anything else in Moodle, if you need to change a comment or even a grade
    later on then you can come back and make the relevant changes very easily.


    Let''s move on now to looking at our Advanced uploading of files assignment. The
    first issue to understand is how to handle student submissions from a teacher''s
    point of view.


    # Handling student submissions


    Return to your course front page and click on your **Advanced uploading of files
    assignment**. When enrolled as a student, I submitted an assignment to this activity.
    Now look for the link in the top right-hand corner of the page:


    ![](img/1529021fde33ef551603bbc71587313e_209_1.png)'
  merge: -1
  img_proc: true
- pgno: 210
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 211
  md: '![](img/1529021fde33ef551603bbc71587313e_211_0.png)


    2. At the top of the page will be a list of the files the student has uploaded
    (in this instance, just the one). Recall that when I was logged in as a student
    I pressed the **Send for marking** button. This was to confirm that I thought
    I had finished the assignment, and it also prevented me from uploading or modifying
    files. Because I don''t think this particular student has actually finished I
    can press the **Revert to draft** button to allow the student to modify and submit
    files again. If it is displayed, press the **Revert to draft** button:


    ![](img/1529021fde33ef551603bbc71587313e_211_1.png)'
  merge: -1
  img_proc: true
- pgno: 212
  md: '3. In the bottom half of the Feedback screen is an area allowing me to provide
    feedback (in the form of Response files) to the student:


    ![](img/1529021fde33ef551603bbc71587313e_212_0.png)


    4. Next to Response files: click on the Add... button. Use the File picker dialog
    to select example_submission_v2.txt. Once the file is selected (via the Upload
    a file link on the left of the File picker), the file is now uploaded to Moodle:


    ![](img/1529021fde33ef551603bbc71587313e_212_1.png)


    5. Enter your comments on this work in the editor. When you are finished, press
    the Save changes button (at the bottom of the page).'
  merge: -1
  img_proc: true
- pgno: 213
  md: '6. The Submissions page is updated accordingly and we''re done:


    ![](img/1529021fde33ef551603bbc71587313e_213_0.png)


    # What just happened?


    Providing feedback on student submissions is easy when you convert to Moodle for
    course assignments. We don''t have to worry about sending out e-mails (depending
    on how Moodle is set up, students are sent an e-mail advising them that you have
    provided some feedback) or worry about spreading viruses by using memory sticks.
    Everything is kept contained online within Moodle. But what does it look like
    for students when we provide feedback to them?


    # Confirming that our feedback has been received


    It is a good idea at this stage to log in as a student again, so we can experience
    what it is like to be a student receiving teacher feedback.


    Logging back on to Moodle as a student and clicking on my Advanced uploading of
    files assignment I see the following page:


    ![](img/1529021fde33ef551603bbc71587313e_213_1.png)


    My note is displayed, and the student has the opportunity to download the corrected
    file I uploaded.'
  merge: -1
  img_proc: true
- pgno: 214
  md: '# Marking student submissions


    The process of marking student submissions to an Advanced uploading of files activity
    is much the same as that for marking Offline activities. From the submissions
    page, click on the Grade link along from the student''s name. The Feedback dialog
    is displayed. For more details on setting the final grade, follow the instructions
    in Time for action – Marking an Offline assignment.


    # Specifying custom grades


    Currently, I''m marking my projects out of 100 but, as I mentioned previously,
    that''s not how they are graded. According to the syllabus, I can only give students
    one of four grades: Distinction, Merit, Pass, and Referral. So how do you specify
    your own grades? Let''s learn how to do that now.


    # Time for action – creating a custom grade scale


    Return to your course front page and look for Grades in the Settings block:


    ![](img/1529021fde33ef551603bbc71587313e_214_0.png)


    Click on Grades and you''ll be taken to the Grader report page. We are now in
    the Moodle grade book. I''m not going to worry too much about all of the features
    in the grade book for the moment—but while you are there you might like to spend
    a little time having a look. As with anything else in Moodle, you can''t do any
    damage by doing something by mistake.'
  merge: -1
  img_proc: true
- pgno: 215
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 216
  md: 'Although I''ve specified one, you don''t have to worry about a description
    if you don''t want to—it''s optional. Are the grades you are specifying here used
    for grading in other courses? If you tick the Standard scale box then your scale
    will be made available to teachers on all courses.


    When you are done, press the Save changes button. Your new scale is listed on
    the scales page. Because I didn''t make my new scale a standard scale, it''s listed
    as a custom scale:


    ![](img/1529021fde33ef551603bbc71587313e_216_0.png)


    # What just happened?


    I don''t give students a numerical grade for the Backyard Ballistics projects.
    The syllabus requires a qualitative grade, but luckily the system makes it easy
    to create my own custom grade scales. All I need to do now is modify my two assignment
    activities to use the new scale. That only involves a few clicks, so let''s do
    that now...


    # Time for action – grading using a custom scale


    +   1. Return to your course front page and click on the update icon next to the
    assignment you want to change to use your new custom scale. The Editing assignment
    page is displayed.

    +   2. Scroll down to the Grade drop-down list. Click on the list. Scroll up if
    you need to, because the custom scale we want to use will be towards the very
    top:'
  merge: -1
  img_proc: true
- pgno: 217
  md: '![](img/1529021fde33ef551603bbc71587313e_217_0.png)


    +   3.  With the new grading scale selected, scroll down to the bottom of the
    page and press the **Save and return to course** button.

    +   4.  That''s it. You will now be able to grade your project using your new
    scale.


    # **What just happened?**


    We''ve just modified the assignment to use our new grading scale. All that remains
    now is to demonstrate how you use it. Now that we are back at the course front
    page, click on the link to the assignment itself to display the assignment''s
    main page (displaying the description of the task we''ve set). Click on the **View
    submitted assignments** link in the top right-hand corner of the page to take
    you to the Submissions page.'
  merge: -1
  img_proc: true
- pgno: 218
  md: 'Managing Student Work


    Choose a student and, down in the Status column, click on the **Grade** link.
    If you''ve already marked that student then the link will say **Update**:


    ![](img/1529021fde33ef551603bbc71587313e_218_0.png)


    Click on the link to open the **Feedback** page. Click on the **Grade**: drop-down
    list in the **Grades** section to display the grades you can give to this piece
    of work. The grades listed are the ones from our new custom grade scale:


    ![](img/1529021fde33ef551603bbc71587313e_218_1.png)


    # # More uses for Moodle assignments


    We aren''t limited to using the four assignment activities just for major projects.
    Here are some more ideas on using the assignment activity to convert your current
    teaching over to Moodle.


    +   1. Include an online text assignment to support tasks for which students can
    use Moodle''s text editor to write their submissions, for example writing a short
    story or for short essay homework tasks

    +   2. If you''re able to display the Submissions page of a single file assignment
    to the class during teaching time, keep refreshing the page as homework is submitted.
    You''ll quickly find that there''ll be a race on to be the first to hand their
    homework in. You could easily turn that into a game for younger students.

    +   3. Use an Offline activity to manage the grades of any task you set your students—homework
    handed in on paper, for example. You don''t have to confine yourself to just projects.'
  merge: -1
  img_proc: true
- pgno: 219
  md: 'On that last point, there is another way of managing grades directly. We''ve
    already been briefly into the Moodle grader report when we set up our custom scale.
    Let''s revisit that page to see how we can set up custom grading items.


    # Grading students on core competencies


    Often as educators we need to grade assignments on core competencies, otherwise
    known as key skills or goals. That certainly applies to my syllabus: a percentage
    of the final grade for my course includes marks for numeracy, literacy, and the
    use of ICT. Because we are converting to Moodle, and in Moodle-speak the competencies
    that I am grading are called "outcomes", in this final section we learn how to
    specify the core competencies we need to grade, and how we can then grade students
    on them. There are pros and cons of converting to Moodle, specifically: I can
