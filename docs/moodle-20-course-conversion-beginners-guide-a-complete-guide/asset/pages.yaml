- pgno: 102
  md: '9. The file is now selected in the Content box:


    ![](img/1529021fde33ef551603bbc71587313e_102_0.png)


    10. In the Options box, select how you want the file to display using the Display
    drop-down menu. I tend to choose In pop-up (there''s more on different display
    types later in this section):


    ![](img/1529021fde33ef551603bbc71587313e_102_1.png)


    11. Press the Save and return to course button (if you press Save and display
    and you have a pop-up blocker installed on your computer then your file won''t
