- pgno: 349
  md: '# What just happened?


    I''ve just restructured my course gradebook to include two categories, "Marks
    for practical" and "Marks for Moodle Activities". You''ve also seen how I can
    add in my own custom grades, which means my gradebook doesn''t just have to contain
    the grades for Moodle activities. You can add in your own grades if you want to.


    # Have a go hero – including custom outcomes


    Not only can you add in custom grades but you can also include custom outcomes;
    vital if you are converting a course that judges student achievement using attainment
    targets or learning descriptors.


    > Hint on including custom outcomes

    > Before you start specifying attainment targets in your gradebook you will need
    to create custom scales. Check out Chapter 6, Managing Student Work for details.


    Return to the Edit categories and items page. Press the Add outcome item button.
    See if you can add a custom outcome to your gradebook. Remember that you will
    need to create and configure a custom outcome before you start.


    # Backup and Restore


    We are nearly at the end of our journey together and the very last thing I want
    to happen now is that you lose all of your work (and mine!). Return to your course
    front page and look down the options in the Settings block under Course administration.
    Two options listed are Backup and Restore. Choose Backup (we''ll look at restoring
    shortly) and let''s get all the hard work we''ve done so far backed up; it''s
    better to be safe than sorry.


    # Backing up your course


    You''ll find many, many options you can choose as we run through the backup procedure.
    At this stage it''s best just to stick with the defaults and back up everything.
    Let''s run through the process now:


    # Time for action – back up your course


    +   1. Once you''ve selected Backup from the Settings block you are taken to the
    first page of the Backup wizard ("Initial settings"). Simply leave the defaults
    as they are, scroll down to the bottom of the page and press Next.'
  merge: -1
  img_proc: true
- pgno: 350
  md: '2. The next page ("Schema settings") allows you to choose what you want to
    back up. Again, scroll down to the bottom of the page and click Next.


    3. The "Confirmation and review" page allows you to check your choices and also
    to change the name of the backup file Moodle is about to create. If all is well,
    press the Perform backup button at the bottom of the page. Once the backup has
    been performed, press the Continue button and Moodle now displays your backup
    files. You can see that I have backed up both my Backyard Ballistics and my Jet
    in a Jam Jar courses:


    ![](img/1529021fde33ef551603bbc71587313e_350_0.png)


    4. You can see that Moodle has backed up your entire course into a single file
    and put it in your User private backup area. That''s fine, but if something goes
    wrong with the computer Moodle is running on that isn''t much help. Click on the
    Download link along from the name of the file. You are given the option to either
    open it or save it. Choose Save and save the file to your computer, USB memory
    stick, or portable hard drive. Keep it safe:'
  merge: -1
  img_proc: true
