- pgno: 168
  md: '# Putting your resources in order


    This is much more the effect we need. I''ve reordered my resources and included
    some labels, so that it is much easier for students to find a resource. In this
    section we''re going to learn how to bring some order into our topics.


    One obvious difference between a shared drive and Moodle is that in Moodle you
    can put the resources in the order you want, not the order the computer insists
    on (usually numerical/alphabetical). However, in Moodle any new resources you
    add are simply queued on to the end of the topic. This has meant that resources
    in my **Getting Things Flying** topic aren''t exactly ordered in a sensible way,
    just the way I added them. I''m going to take action to remedy that now.


    # Time for action – arranging your resources


    +   1. Remember that you need editing turned on before you start.

    +   2. Choose the resource you want to move. I''m going to move my Backyard Ballistics
    links resource to the end of the topic. To start the process I need to "pick up"
    the resource. I click on the move icon:


    ![](img/1529021fde33ef551603bbc71587313e_168_0.png)


    +   3. This causes two things to happen. Firstly, the resource I want to move
    disappears. Don''t worry, imagine you have it in your hand and you are ready to
    place it back into your course. Secondly, the boxes that have now appeared represent
    all the places you can move the resource you are holding to:


    ![](img/1529021fde33ef551603bbc71587313e_168_1.png)'
  merge: -1
  img_proc: true
- pgno: 169
  md: '4. Choose where you want to move the resource to. I want my list of links at
    the end so I''m going to click on the box at the bottom. The boxes disappear and
    my resources have been shuffled:


    ![](img/1529021fde33ef551603bbc71587313e_169_0.png)


    # What just happened?


    A list of resources in Moodle isn''t simply a list of files, such as you would
    find on a shared drive. One obvious difference is that in Moodle you can arrange
    your resources to be listed in the order you want, and we''ve just seen how easy
    it is to achieve this.


    > You can''t find the move icon?

    > Your site may be configured so that you can drag and drop resources. In that
    case, instead of the move icon you will see crosshairs next to your resource.
    To move the resource, click on the crosshairs and, keeping your finger pressed
    down on the left mouse button, drag the resource to its new location. Look for
    the line in the background, this tells you where your resource is going to be
    dropped into, then let go of the mouse button when you have found the spot.


    Now I''ve got my resources in the order I wanted, I have to say that my topic
    looks like just another resource dump which is what I am trying to avoid.


    Remember the screenshots in the *Arrange your resources* section? My resources
    would be much easier to use if I could introduce each of them with a short piece
    of text:


    ![](img/1529021fde33ef551603bbc71587313e_169_1.png)


    Introducing a resource with a short introduction is a great way of improving the
    visual appeal of your course. The tool to achieve this is called a Label resource,
    and here''s how to use it.'
  merge: -1
  img_proc: true
- pgno: 170
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 171
  md: '**5.** Click on the relevant box to place your label. You''re done!


    ![](img/1529021fde33ef551603bbc71587313e_171_0.png)


    > If you don''t have a move icon you''ll have crosshairs next to the label that
    you can click on to drag it to the right place.


    # **What just happened?**


    After all the experience we have had with Moodle so far, using the label resource
    will be fairly straightforward. Judicious use of labels means our course topics
    don''t have to be simply a long list of resources. Remember to treat labels as
    a way of leading the student towards and into a resource. Labels are not designed
    for content, so try to keep labels short, perhaps two or three sentences at the
    most. Labels are like the glue that holds topics together. You don''t want your
    glue to be too thick.


    It''s looking better, but my topic is still looking a little flat. You can indent
    your resources by clicking on the move right icon next to the resource:


    ![](img/1529021fde33ef551603bbc71587313e_171_1.png)'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'The following screenshot shows how things now look with a little indenting:


    ![](img/1529021fde33ef551603bbc71587313e_172_0.png)


    **Seeing the course from a student''s point of view**


    As a teacher, you will see a lot of options on the screen that your students won''t.
    To get a clear idea of how a student will see the course, use the **Switch role
    to...** option from the course **Settings** block. Choose **Student** from this
    list, and you will see the course as students see it.


    When you''re done, click **Return to my normal role** and you''ll get your normal
    view back. You will also need to turn editing on to get the edit controls back.'
