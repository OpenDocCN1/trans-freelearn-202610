- pgno: 46
  md: '# Summary


    Now our journey with Moodle has begun and already we''ve learned a lot about the
    system.


    Specifically, we covered:


    +   - **The origins of Moodle**: We learned that Moodle was the brainchild of
    someone who was home schooled. Martin Dougiamas designed a system to support collaboration
    and learning by sharing knowledge. Although that''s the underlying pedagogy, we
    learned that Moodle can support many different learning styles.

    +   - **How to log on to Moodle**: We learned how to change our passwords and
    covered what you need to do in the event that you forget it. We also covered how
    to make sure you''ve logged off. We don''t want students being able to get onto
    the system pretending they are you.

    +   - **Modifying our user profiles**: We saw that Moodle administrators can "lock"
    certain aspects of our user profiles (mine had my **First name**, **Surname**,
    and **Email** fields locked). But I could still modify my description and we saw
    how to do this.

    +   - **Roles and capabilities**: We saw how different roles have different capabilities,
    and that your role depends on the context. For example, I''m a teacher in the
    courses I teach in, but in the courses I''m enrolled on I''m a student.

    +   - **Moodle look-and-feel**: Together we learned about the different elements
    that make up a Moodle page.


    We also briefly discussed what we''re going to cover in the rest of this book.


    Now that we''ve got a feel for Moodle we''re ready to configure a Moodle course
    which is the topic of the next chapter.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# # 2

    Setting up your Courses


    In the previous chapter we started our Moodle journey. In this chapter we''re
    going to see how to lay the foundations for moving your department''s courses
    into Moodle. In this chapter we will:


    +   - Learn how to map your academic curriculum to a number of Moodle courses

    +   - Create a new Moodle course and give it a name and description

    +   - Set up an appropriate structure for the course

    +   - Assign teaching staff to the course

    +   - Set up an enrollment method for your course


    By the end of the chapter your course will be set up and ready for you to start
    populating it with content.


    # ## From curriculum to courses: What counts as a Moodle course


    Let''s start this section with me describing the course I''m going to be converting
    to Moodle as we work together through this book. The course is called "Backyard
    Ballistics" and it''s a science course that forms part of an applied physics qualification.
    The course is all about the art of firing weird objects through the air with chemicals
    and equipment that you will find in your average domestic kitchen and garden shed.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# Setting up your Courses


    There are certain aspects of this course that I can''t convert to Moodle. I want
    my students to get an appreciation of energy and dynamics by "doing" (kinesthetic
    learning) the science using everyday items you''ll find around your house. But
    there is a good deal of support material, handouts, diagrams, and quizzes, that
    currently I try and distribute electronically using a "shared drive" on the college
    server. However, my students can never find the materials I tell them to go and
    look for. At least, that''s their excuse. But I''ve got to admit that after a
    few years of use our shared drive is starting to look a bit of a mess. As you
    will see in the next couple of chapters, moving these resources over to Moodle
    will definitely solve this problem.


    But where do I put these resources in Moodle? The answer is that you put them
    into a Moodle course. And here is a screenshot of just a fragment of a Moodle
    course:


    ![](img/1529021fde33ef551603bbc71587313e_48_0.png)


    I''ve divided my course into six topics:


    +   - Getting Things Flying

    +   - Lighter Than Air: Hydrogen Filled Balloons'
  merge: -1
  img_proc: true
- pgno: 49
  md: '+   - Fire Kites

    +   - Basic Rocketry: The Match Rocket

    +   - The World Famous Tennis Ball Mortar!

    +   - Backyard Ballistics: End of Course Project


    The reason why I''ve chosen to convert Backyard Ballistics into topics is partly
    because that''s how I teach it and partly because I am happy for the students
    to "dip into" the resources and activities I have converted to Moodle. I''ll be
    talking about how to break up the contents of a course into topics later in this
    chapter (that''s not the only way you can break up a course: you can break it
    up into weeks, too). Before we look at how we can get a course and start adding
    content to it we really need to understand what Moodle considers to be a course
    and how Moodle organizes them.


    # What is a Moodle course


    You can clearly see now that, at its most basic, a Moodle course is a placeholder
    for resources and activities. Obviously it''s much more than this, as you''ll
    be learning as you work through this book. One obvious advantage Moodle has over
    a shared drive is that links to resources and activities can be interspersed with
    text and graphics to make the experience more visually appealing and engaging,
    and the resources I upload easy to find (I don''t accept any excuses these days).


    # How Moodle organizes its courses


    Let''s take a quick look at how you can organize courses in Moodle.


    To help organize courses, Moodle has the idea of categories and subcategories:


    ![](img/1529021fde33ef551603bbc71587313e_49_0.png)'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'Remember that you''ll only find resources and activities in a Moodle course.
    Categories and subcategories are only there to help you organize and manage the
    organization of courses.


    So how does that work in practice? For example, I work in the **Physics** department,
    part of the **Faculty of Science**. My **Backyard Ballistics** course supports
    the **Applied Physics** qualification. Here''s how we''ve got our categories and
    subcategories arranged:


    ![](img/1529021fde33ef551603bbc71587313e_50_0.png)


    I''m sure you could think of examples for your subject area. You could have a
    category called English that contained two subcategories, Literature and Language.
    Within literature you could have short courses on particular aspects of the set
    text you are teaching. You could have a category 20th Century History containing
    subcategories for Britain, Germany, France, Italy, and USA. Each country subcategory
    can contain further subcategories called Politics, Society, and so on.


    Because this is such a key issue when you first start using Moodle, let''s spend
    a little time investigating the more common approaches taken when converting face-to-face
    teaching to Moodle.


    # Breaking up is hard to do


    How you break up a face-to-face, traditionally taught course, depends on the age
    group and the subject area you are working in, so let''s study some examples.


    Often younger children will have the same teacher for all of their subjects. Schools
    in this situation usually categorize Moodle courses based on year groups, and
    within the year group each teacher will have their own subcategory in which they
    are free to create and delete courses as they wish:'
  merge: -1
  img_proc: true
- pgno: 51
  md: '![](img/1529021fde33ef551603bbc71587313e_51_0.png)


    Each teacher having their own Moodle course means it is much easier for the children
    to find the resources that have been uploaded and activities created for them.


    As the children get older you can start running different Moodle courses for different
    subjects depending on that child''s age and ability. Now I could have a category
    for each year group, and within them categories for each subject area:


    ![](img/1529021fde33ef551603bbc71587313e_51_1.png)


    Instead of a mathematics teacher having just one course they may instead have
    a course in Year 9, two in Year 10 and another one in Year 12. As the subject
    areas begin to broaden and the amount of material you need to get through increases,
    you might need to think about having Moodle courses for particular subject areas,
    especially those areas that students tend to struggle with.


    As students become older, things tend to become easier, because qualifications
    examined by external examination bodies will have their own syllabus. Read the
    syllabus carefully and you will often be able to see immediately how to break
    the subject down into Moodle courses. Mathematics, for example, naturally falls
    into categories, namely:


    +   - Number

    +   - Algebra'
  merge: -1
  img_proc: true
- pgno: 52
  md: '+   - Geometry (shape, space, and measure)

    +   - Data handling and statistics


    Within each category there is then a natural divide between subject areas. See
    whether you can spot a similar pattern in your subject area.


    For students who are older still (that is, college or university age), subjects
    are most often taught in units anyway. A short 10-week unit, for example, is an
    ideal candidate for a Moodle course.


    To close this section, I will leave you with just a few more thoughts. One is
    that Moodle courses can also be created to develop a student''s key skills. Examples
    of key skills could be:


    +   - Communication

    +   - Application of number

    +   - Information and communication technology

    +   - Problem solving

    +   - Collaboration


    Another is that Moodle courses are not set in stone; once they are created they
    can be changed as you require. You will also see later in this book that responsibility
    for different aspects of your Moodle course can be delegated down to your students,
    enabling you all to work together developing your page.


    # Have a go hero – developing key skills


    Try identifying courses that support developing one of the key skills. If key
    skills are a priority in your school or college, then no doubt you will have lots
    of skills-based teaching materials already to hand that you can convert into Moodle
    courses.


    # If in doubt, hold a meeting


    In this section we''ve been investigating how we could break up traditionally
    taught, face-to-face courses and identifying what might be converted into Moodle
    courses. You can do this along traditional lines, or you can approach the problem
    by looking at key skills or learning styles. It is an extremely complicated issue
    and will undoubtedly involve discussions with your department colleagues. I strongly
    suggest you hold a Moodle meeting to discuss which courses are going to be created,
    initially. Use the opportunity to discuss who is going to teach them, and what
    categories they are going to fit into. Plan as much as you can before you start
    doing anything in Moodle.


    Remember to involve your Moodle administrator in those meetings, especially if
    they are the one responsible for creating your categories and courses.'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'Now that we know what Moodle categories and courses we''re going to need, we
    can focus on creating and running those courses.


    # Let''s get started: Setting up the course


    The remainder of the book will focus on just one course. If you''re putting your
    whole department into Moodle then you''ll have lots of courses to work through.
    That''s why it''s so useful to assign other teaching staff to course creation,
    and let them share the work. We''ll show you how to do that too.


    # Creating your course


    Before you start building your course, it needs to be "created" in Moodle. If
    you''re working in a school or university, then there are three ways this might
    happen:


    +   - An administrator has already created it: Sometimes, administrators create
    empty courses for all the official courses taught by an institution.

    +   - Put in a request: In other situations, the administrators require that teachers
    request new courses; the administrator then approves the course, and it''s created.

    +   - Create it yourself: In other circumstances you might have permission to
    create courses yourself. If it was you that installed your Moodle then you will
    definitely have permission to create courses.


    How is it that you cannot create courses but your colleagues can? Let''s look
    at this in the next section.


    # Do you need to create your course yourself


    You might be lucky, your administrator may have made you a manager or a course
    creator, meaning you get to create your own courses. Note that managers have slightly
    more power than course creators. For example, managers can create courses and
    delete them. Course creators can only create them. It is easy to spot if you are
    a course creator or manager because only then will you have an **Add a new course**
    button when you look in Moodle categories, or if you click on the **All courses**
    button to display all the courses in your Moodle. Once you have found the **Add
    a new course** button you only need to press it to create your new course. You
    are immediately taken to the new course''s setting page.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# Setting up your Courses


    # What to do if your course has been created for you


    The immediate problem is finding it. Return to your site front page. Can you see
    the **Navigation** block? (By default the navigation block is at the top-left
    of the page). Click on the **My courses** link and a list of your courses will
    be revealed:


    ![](img/1529021fde33ef551603bbc71587313e_54_0.png)


    If you don''t have a **Navigation** block on your site''s front page then the
    easiest way is to click on your name (you can usually find this towards the top,
    right-hand side of the page) which then displays your user profile. Listed in
    your profile are the courses you are participating in:


    ![](img/1529021fde33ef551603bbc71587313e_54_1.png)'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'The course name **Backyard Ballistics** is a link, which I then click on to
    see what my role in the course is. You can see in the following screenshot that
    my head of department has made me a teacher on **Backyard Ballistics**:


    ![](img/1529021fde33ef551603bbc71587313e_55_0.png)


    In my case I can click on the **MCC-BC** link, under **My courses** in the **Navigation**
    block. If I didn''t have a **Navigation** block then I could also click on the
    breadcrumbs across the navigation bar at the top of the screen:


    ![](img/1529021fde33ef551603bbc71587313e_55_1.png)'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# Setting up your Courses


    I am now at my course page. It''s an empty course based on a 10-week structure
    and it''s ready for me to start configuring:


    ![](img/1529021fde33ef551603bbc71587313e_56_0.png)


    # Pop quiz


    What is the difference between a course creator and a manager?


    # Configuring your course


    Now let''s configure a topics-based course called Backyard Ballistics. In the
    Settings block under Course administration, click on Edit settings. This will
    take you to the Course settings page:'
  merge: -1
  img_proc: true
- pgno: 57
  md: '![](img/1529021fde33ef551603bbc71587313e_57_0.png)


    # Time for action – configuring the Backyard Ballistics course


    Let''s start by creating my Backyard Ballistics course. I''m not too worried about
    fine tuning it now. I just want to get it started, we will fine tune the course
    later, once we''ve got the basics up and running:


    +   1. Type the course title next to Course full name, Backyard Ballistics.

    +   2. Enter the short name. This has to be completely unique (if there''s another
    course with the same short name, Moodle will complain). I''m going to specify
    MCC-BC.

    +   3. Enter a summary using the WYSIWYG (What You See Is What You Get) HTML editor.
    See how we can use formatting for the description, as you would with a word processor:


    ![](img/1529021fde33ef551603bbc71587313e_57_1.png)'
  merge: -1
  img_proc: true
- pgno: 58
  md: "+   4. Look for the **Format** setting (almost immediately under the **Course\
    \ summary** editor). Click on the drop-down menu and select **Topics format**.\n\
    +   \n+   5. Because we're just setting up the course, we don't want students\
    \ enrolling yet so scroll down to the availability options. Click on the **Availability**\
    \ drop-down list and select **This course is not available to students**.\n+ \
    \  \n+   6. That's all we need to set up a basic course. So scroll to the bottom\
    \ and click **Save Changes**.\n\nIf you've created this course from new you're\
    \ now taken to the **Enrolled users** screen. We're not going to look at roles\
    \ just yet, so for now go to your course's home page by clicking the button at\
    \ the bottom of the screen containing your course's short name (now **MCC-BC**).\
    \ If you were configuring an existing course, you'll be taken straight back to\
    \ your course page anyway.\n\n# What just happened?\n\nWe created a new course\
    \ and gave it a full name, short name, and summary. We also configured the course\
    \ so that it is broken up into topics (the default on a new Moodle installation\
    \ is weekly). We left everything else as the default so we can edit it later.\
    \ You now have a course divided into 10 \"topics\" ready for you to add content.\n\
    \nHowever, not every course will neatly divide into 10 topics. So the next task\
    \ is to make sure our course is structured correctly. We will do that in the next\
    \ section.\n\nBut first, there are a few more things you should know about creating\
    \ courses:\n\n+   - Choosing an effective description for the course summary\n\
    +   - Using the editor\n+   - Getting help on Moodle settings\n+   - Getting back\
    \ to the Course settings screen\n\nLet's look at these now.\n\n# Choosing an effective\
    \ description for the course summary\n\nThe summary is displayed whenever your\
    \ course is listed with other courses, so if you want your course to stand out,\
    \ try to describe it in as brief and direct a way as possible. The summary is\
    \ usually the first bit of your course that students come across before they enroll,\
    \ so you want to use the summary to make your course as inviting as possible.\
    \ Also, remember your target audience: if you are going to be using your Moodle\
    \ course simply to support your classroom teaching then the summary is much less\
    \ important than if you are wanting to attract the attention of prospective students\
    \ or their parents."
  merge: -1
  img_proc: true
- pgno: 59
  md: '# # Using the editor


    It''s important that we get used to using the editor because we are going to use
    it a lot. Most of the buttons are the same as you would find on any word processor,
    and as I''m assuming that you are fairly competent with a word processor, I''m
    not going to go through all of the "standard" formatting buttons (including inserting
    symbols and spell checking). Four of the "non-standard" buttons you will find
    useful are:


    | Icon | Function | Use |

    |---|---|---|

    | [smiley icon] | Insert smiley | Sometimes it is difficult for students to spot
    whether you have written something cheeky or sarcastic. Use a smiley to stress
    how serious you are being: if you are being cheeky insert a winking face, or being
    sarcastic insert a cheesy grin. |

    | [paste from Word icon] | Paste from Word | If you paste from Word then you can
    often never get the text to format properly. The Paste from Word button might
    remedy this problem. |

    | [cleanup messy code icon] | Cleanup messy code | If it''s not Word you are pasting
    from but another application, say PowerPoint or from a web page, again getting
    the pasted text to format properly can be a problem. Paste your text and then
    press the Cleanup messy code button to correct this. |

    | [paste as plain text icon] | Paste as Plain Text | If you are still having problems
    editing pasted text then try pasting into the editor using this button. It just
    pastes the text you have copied without any formatting included (so you will have
    to reformat your text once it''s pasted into the editor). |


    Another useful control (rather than button) is the resize editor control, found
    at the bottom-right corner of the editor:


    ![](img/1529021fde33ef551603bbc71587313e_59_0.png)


    Click on the corner of the editor with the mouse cursor and drag it to make the
    editor bigger or smaller.'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'Remember: you can only cut and paste text from other software programs into
    the editor. Don''t try to cut and paste images. Images need to be copied to the
    computer that your Moodle is running on. We will be looking at uploading images
    in *Chapter 4, Sound and Vision—Including Multimedia Content.*


    We will be looking at the rest of the "non-standard" buttons as and when we need
    them.


    # Getting help on Moodle settings


    I deliberately skipped over a lot of options in the Course settings page, and
    will continue to do so as we work on setting up our courses. However, Moodle does
    a good job of helping you understand each individual setting. You can get help
    on any Moodle feature by clicking the question-mark icon nearby.


    For example, here''s what you would have seen if you''d clicked the ? next to
    **Course short name**:


    ![](img/1529021fde33ef551603bbc71587313e_60_0.png)


    # Further documentation


    If that help isn''t enough, you can get help for the whole page on most sections
    of Moodle. Just scroll to the bottom of the page, and click **Moodle Docs for
    this Page**. This will take you to the documentation section of the Moodle website,
    with up-to-date and ever-expanding documentation:'
  merge: -1
  img_proc: true
- pgno: 61
  md: '![](img/1529021fde33ef551603bbc71587313e_61_0.png)


    # Getting back to the Course settings screen


    Remember nothing in Moodle is carved in stone. If you want to change settings
    for a course that''s already created, you can return to it at any time. In the
    Course settings block on the left-hand side of the screen, while looking at the
    course, click on Edit settings. You''ll then get back to the Course settings screen
    where you can change the title, description, and other settings.


    # Course structure and format


    Courses are divided into sections. What constitutes a section depends on the course''s
    format. If you''re new to Moodle then there are two main, important formats:


    +   - Weekly format: Each section represents one week of study

    +   - Topics format: Each section represents a particular topic or aspect of the
    course


    For your first few courses, especially courses based on existing non-e-learning
    material, these are likely to be the only two you use. However, there are others:


    +   - SCORM: Third-party e-learning materials are likely going to be supplied
    to you in SCORM format (SCORM is an educational resource "standard" format, in
    much the same way that documents are supplied in ".DOC" format). If you know what
    they are then this is a useful course format type. If you''ve never heard of SCORM
    then don''t worry.'
  merge: -1
  img_proc: true
- pgno: 62
  md: '+   - **Social format**: The whole course is built around a single forum. This
    is useful for using Moodle to manage things that are not strictly courses. You
    could use it to set up a departmental notice board, or a discussion forum for
    an after-school club, for revision, or (as in one school I worked in) to help
    organize the Year 11 prom.


    To put your course into Moodle, you will need to select a format appropriate for
    your course structure and material.


    # # Which format should we use: Weekly or topic format


    First, here are the main differences between weekly and topic formats.


    Topic formats:


    +   - Consist of named sections that can be of any length

    +   - You could have one topic, three topics, or 20 topics

    +   - Each topic can contain any amount of information

    +   - A maximum of 52 topics per course


    Weekly formats:


    +   - Consist of a fixed number of weeks – each section is exactly one-week long

    +   - Has a definite start date – each week is given a precise set of dates, not
    "Week 1", "Week 2", and so on, but "March 3 – 10"

    +   - A maximum of 52 weeks per course

    +   - Remember to include term breaks if you have a course that covers two terms


    So, when should you use each one?


    Topic formats are usually best when:


    +   - Students learn at their own pace or are self-directed in their learning
    – they will pick and choose resources from across the course, without any particular
    order being imposed

    +   - The course is broken up into topics that come one after the other, but don''t
    each last one week

    +   - There are optional topics that not all students will study, or will be studied
    at different times

    +   - Different groups of students will be using the course at different times'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'Weekly formats are usually best when:


    +   - There is a clearly defined schedule

    +   - The course has a defined start date

    +   - You want to reinforce particular deadlines with the students (although in
    a weekly format course you can still access all of the materials and activities
    any time you like)


    If you are new to Moodle then, at least to start with, I would stick with a topics
    format course. When I first started teaching I used to try and plan what I was
    going to teach that term, but it all went rapidly out of the window as I had to
    judge what subject areas I was going to move on to next, all depending on how
    the class were getting on with what we had covered so far. The same is true with
    Moodle and that''s certainly why it''s rare to find a Moodle course using the
    weekly format in a school or college.


    Weekly format is ideal if are converting a course in which your students need
    their time planned out for them and you, as their teacher, know what is going
    to be coming up in the course and when. With a weekly course, your students have
    the chance to look on ahead and they''ll know when to brace themselves for difficult/extra
    work if needs be. Also, if you are converting courses to support apprenticeships
    or students on work placement, have a think about whether a weekly format course
    would be the better option.


    # Pop quiz


    How do you change the format of your course from topics to weekly?


    # Breaking your course up into topics


    You''ve now decided on a course, but you need to break the course up into Moodle
    topics. The most common ways of achieving this are:


    +   - **By sequence**: Some kind of narrative order. Basically, follows the order
    in which the reader should learn

    +   - **By resource type**: Worksheets, handouts, web resources

    +   - **By "true topic"**: Each section collects resources on one topic within
    the course, even though the course doesn''t necessarily progress through those
    topics in order


    Each has pros and cons. Each has situations where they are ideal.


    You can even combine them, say, have a bunch of topics that map to an ordered
    set of units, with some non-ordered units at the end that cover, for example,
    resources relating to a private study project that runs throughout the course.'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'I''ve broken up my Backyard Ballistics course into five topics because that''s
    how it is structured before I''ve converted it to Moodle, and five topics was
    a natural fit.


    If you are worried about how you should structure your courses when you convert
    to Moodle then remember that you can always come back and change things later
    on. Often it is easier to start getting courses converted to Moodle and the very
    act of doing so will help you see how things should be organized.


    # Setting the format for your course


    As you have already seen, my Backyard Ballistics course is built around six topics.
    Let''s see how to set up such a course structure using Moodle.


    # Time for action – setting up the course format


    +   1. Return to the Course settings screen.

    +   2. From the Format options, choose Topics format or Weekly format. For mine,
    I''m going to choose Topics format:


    ![](img/1529021fde33ef551603bbc71587313e_64_0.png)


    +   3. Choose the number of topics / weeks. I''ve planned for six topics in my
    course.

    +   4. For weekly courses, make sure you set a start date.

    +   5. Now scroll to the bottom of the page and press the Save changes button
    to return to your course page:'
  merge: -1
  img_proc: true
- pgno: 65
  md: '![](img/1529021fde33ef551603bbc71587313e_65_0.png)


    # What just happened?


    I''ve just broken up my Backyard Ballistics course into five "topics", that is,
    five numbered boxes because that''s how my course is structured in the real world.
    Again, five topics is a natural fit.


    You can still adjust the number of topics / weeks in your course once your course
    is populated with content. However, if you reduce the number then later topics
    will disappear. So if you have 10 topics, and later reduce it to eight, anything
    that you had added to topics nine and 10 will vanish from view but are still there
    (and are still accessible if people bookmarked them). This is a technique you
    can use to reveal teaching materials and activities as your face-to-face teaching
    progresses (so you don''t get lots of questions from your students on topics you
    haven''t yet taught).


    You can also switch from weekly to topic view any time you like.'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# Defining each topic/week


    Moodle now gives you the right number of sections or "slots" to fill up with course
    content. But each topic is blank, it lacks any kind of title or description, let
    alone educational content.


    Let''s add descriptions for each section in our course.


    # Time for action – defining each week/topic


    +   1. Return to your course page. Make sure you have editing turned on, by either
    pressing the Turn editing on button in the top-right corner of the screen or by
    clicking on the Turn editing on link in the Settings block:


    ![](img/1529021fde33ef551603bbc71587313e_66_0.png)


    +   2. Click the hand and pen icon next to the topic number you want to edit (hovering
    the mouse over the icon displays a helpful "Edit summary" tip):'
  merge: -1
  img_proc: true
- pgno: 67
  md: '![](img/1529021fde33ef551603bbc71587313e_67_0.png)


    3. Now enter a short summary of the topic. This summary also has to serve as the
    topic title. You might want to use rich formatting to differentiate the title
    from the rest of the text:


    ![](img/1529021fde33ef551603bbc71587313e_67_1.png)


    4. When you''re done, press the Save changes button and you''ll go back to your
    course with the new summary in place. If you want to cancel the change, just press
    the Cancel button.'
  merge: -1
  img_proc: true
- pgno: 68
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 69
  md: 'This will now appear at the top of the course:


    ![](img/1529021fde33ef551603bbc71587313e_69_0.png)


    # More settings for topics/weeks


    Aside from adding a summary, there are other things we can do with each topic
    when you''re on the home page and in edit mode:


    | Icon | Function | Use |

    |---|---|---|

    | ↑ ↓ | Change the order of topics | Click on the up and down arrows to reorder
    your topics.


    Note that for weekly courses, the topic will move but the dates associated with
    the topic will not change immediately. Reloading the course page will ensure all
    weeks are ''renumbered'' correctly. |

    | □ | Display all topics or just one at a time | This button lets you choose whether
    to display the whole course in one page, or just one topic at a time. Displaying
    one topic at a time might be useful when each topic starts to contain lots of
    resources and activities.


    Students can also use this button, and it works even when you''re not in edit
    mode. If you''re panicking that you''ve deleted all but one of your topics by
    accident, the chances are you clicked this button. Click it again and all should
    be well. |'
  merge: -1
  img_proc: true
- pgno: 70
  md: '| Icon | Function | Use |

    |---|---|---|

    |  | Hide topics | Click on an open eye to make a particular topic invisible.
    The topic will appear either as "not available" to students and they won''t be
    able to see any information about it, or any of its resources, or will be hidden
    completely, dependent on the **Hidden sections** option in the **Course settings**
    page. |


    Finally, and most importantly, we can add resources and activities to our courses.
    In later chapters, we will see how to turn our existing course material into Moodle
    resources and make them available through our course.


    # Assigning teaching staff


    If you are teaching on your own in your own Moodle, you won''t have to worry about
    working with fellow colleagues. Each member of staff in Moodle will usually fall
    into one of the following categories:


    +   - **Administrator**: Has complete control over a Moodle. Equivalent to a chief
    executive or a school principal.

    +   - **Manager**: Can create and delete courses. They do have the option of coming
    into your course and doing your job but, if they are traditional managers, they
    probably wouldn''t know how to.

    +   - **Course creator**: Can create new courses and edit them. By default, course
    creators can''t actually delete courses.

    +   - **Teacher**: Can edit and work with existing courses, but cannot create
    new ones. This role can add new resources and activities, change topics, and settings.

    +   - **Non-editing teacher**: Can grade work and teach, but can''t edit courses.
    This role will only become relevant when we get to interactive course content
    in later chapters.


    It depends on the management structure in your school or college but, in my experience,
    the approach that has worked best is to have a head of department/faculty leader/team
    leader/Moodle champion, delete as appropriate, as the Moodle manager in their
    Moodle category. They then create courses for their teaching staff. If you are
    a Course creator then it doesn''t need me to tell you not to simply drop a Moodle
    course onto one of your unsuspecting colleagues without discussing it with them
    first. I''ve known this happen and it caused nothing but a great deal of animosity
    and a fair amount of anti-Moodle feeling.'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'Let''s take an example. For the rest of this book we will look at converting
    the Backyard Ballistics course to Moodle. However, there are other courses in
    the physics syllabus that need converting, including "Jet in a Jam Jar". As a
    course creator, you can create a course, and then assign it to another teacher
    who can "develop" the course from then on.


    I am going to create a new course and then assign it to Mr. Wild as the editing
    teacher.


    # Time for action – assigning roles


    +   1. Add a new course to your Moodle using the process described previously.

    +   2. From the Settings block on your new course page, click on Users and then
    Enrolled users:


    ![](img/1529021fde33ef551603bbc71587313e_71_0.png)'
