- pgno: 133
  md: '+   6. Scroll to the bottom of the page and press the **Save and return to
    course** button.

    +   7. That''s it! You''re done.


    You''ve now added a link to a web page to the course front page:


    ![](img/1529021fde33ef551603bbc71587313e_133_0.png)


    # What just happened?


    In just the same way we added a link to a document or handout in previous chapters,
    we''ve just added a link to an external website. But imagine if you wanted to
    share lots of links in this way? Before long the course home page would soon become
    unwieldy—with a topic containing nothing more than a long list of links. Fortunately,
    we can get around this by including links in a Moodle web page, which is the subject
    covered in the next section.


    # Turning text into a web link


    Another alternative to uploading a file (a Word file, say) containing a long list
    of links is to create a Moodle web page and include our links in that (remember
    we looked at converting documents to Moodle web pages in *Chapter 3, Adding Documents
    and Handouts – Become a cut and paste fiend*). Rather than having that page being
    simply a long list of links, I can make things look much more appealing by including
    pictures, and by having more scope to arrange the layout of the page to make the
    links easier to find. What''s more, to make the conversion easier, I can copy
    and paste from the original document. Let''s look at doing this now.'
  merge: -1
  img_proc: true
- pgno: 134
  md: '# # Time for action – putting links in a Moodle web page


    To aid the conversion, try arranging your desktop so that you have a Word document
    and a browser with Moodle in side by side. This will save you from repeatedly
    toggling between Moodle and your original document.


    +   1. Return to your course front page and make sure that you have editing turned
    on.

    +   2. Choose the topic you want to include the links in and click on **Add a
    resource...** and then choose **Page** from the list.

    +   3. Type in a name for the new page.

    +   4. Enter a brief description. This is required but can be as long or short
    as you wish.

    +   5. We are now ready to copy over the information from your Word document.
    Return to your original document and select and copy the links you need.

    +   6. Return to Moodle and paste the text you just copied into the Page content
    editing area:


    ![](img/1529021fde33ef551603bbc71587313e_134_0.png)'
  merge: -1
  img_proc: true
- pgno: 135
  md: '+   7. Press the **Cleanup messy code** button (the button with the brush icon),
    to make sure that we don''t include any special word processing formatting—which
    we don''t need now we are going to display the text in a browser.

    +   8. Scroll down to the bottom of the page and press the **Save and return to
    course** button.

    +   9. Check out your new web page by clicking on the link from the course front
    page:


    ![](img/1529021fde33ef551603bbc71587313e_135_0.png)


    # What just happened?


    We''ve just created a Moodle web page containing links I''ve previously been noting
    down in a Word document. Rather than simply uploading the original document—which
    can introduce the problems we looked at in the bonus chapter, *Handing in Work
    through Moodle*—we''ve converted it into a Moodle web page. Open the new page
    now. Try clicking on a link and you will be navigated to the external website.'
  merge: -1
  img_proc: true
- pgno: 136
  md: '# # Manually adding links to Moodle web pages


    Modern word processors are very kind to you when it comes to links. If you include
    what looks like a link in your document, the word processor will usually interpret
    it as a link and format it accordingly. This means that when you copy the text
    over to Moodle then it will take the formatting put in by the word processor and
    Moodle will still recognize the text as a link. This works in Moodle, too: if
    I type a link directly into the Moodle HTML editor then Moodle will recognize
    the text as a web link and automatically turn it into a link. What happens if,
    rather than having the student click on the actual web address, as in:


    ![](img/1529021fde33ef551603bbc71587313e_136_0.png)


    ...we want the student to click on a piece of descriptive text, as in:


    ![](img/1529021fde33ef551603bbc71587313e_136_1.png)


    Next to the name of the Moodle web page you just created, click on the Update
    icon to open the resource configuration page. Let''s see how we can select a word
    or fragment of text and turn this into a link.


    # # Time for action – making a link out of text


    The first link I''ve got listed is a link to the Wikipedia entry on Ballistics.
    I want the student to click on the phrase "Click here to look at what Wikipedia
    has to say on Ballistics", and for that to take them to the right page. I also
    want the new page to be displayed in a different window, to "stop Wikipedia from
    making Moodle disappear", to quote one of my students.


    +   1. Enter the text you want to turn into a link and make sure you have it selected.

    +   2. Press the **Insert/edit** link (it looks like three links of a chain) button.
    The Insert Web Link dialog will appear. Note that you can''t press the button
    until you''ve selected something in the editor:'
  merge: -1
  img_proc: true
- pgno: 137
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 138
  md: '# What just happened?


    We''ve just turned some text into a link, but you won''t be able to click on your
    new link until you''ve scrolled down to the bottom of the page and pressed the
    Save and return to course button. Open the web page and click on the link just
    to satisfy yourself that it works.


    When you turned the text into a link, you pressed the Insert/edit link button
    to display the Insert/edit link dialog. Did you spot the Browse... button:


    ![](img/1529021fde33ef551603bbc71587313e_138_0.png)


    This button allows you to turn a bit of text into a link to a file in your My
    private files area, or another repository. This lets you mix links to external
    websites and links to files you''ve uploaded to Moodle from a single page.


    # Have a go hero – doing more with your links


    You can use links from Moodle web pages to link to other documents in your course.
    Try creating a documents index. Make this index more appealing by including images
    (see Chapter 5, Moodle Makeover, for tips and tricks on making Moodle web pages
    more visually appealing).'
  merge: -1
