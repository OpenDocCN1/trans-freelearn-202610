- pgno: 261
  md: '# # 8


    # Enhancing your Teaching


    > > At this stage, I''m sure you''re itching to experiment with some of the more
    advanced Moodle activities, and in this chapter that''s just what we''re going
    to do.


    In this chapter, we shall:


    +   - Learn how to create a Moodle quiz. Convert your tests to Moodle and have
    them returned to you already marked!

    +   - Convert role-play and scenarios into a Moodle lesson.

    +   - Encourage peer review and help develop skills in providing constructive
    criticism using the workshop activity.

    +   - Have students collaborate on project work online using a Moodle wiki.

    +   - Create an online multimedia dictionary using a Moodle glossary.

    +   - Convert quick-fire quizzes and straw polls to Moodle using the choice activity.


    Do you want to prevent your students from accessing an activity or resource until
    they''ve completed some prior task? For example, I need all of my students to
    agree to a health and safety disclaimer (to keep my insurance company happy) before
    they can start the course proper. We can achieve this using Moodle''s "conditional
    activities" feature and in this chapter we''ll learn how.


    We''ve got some exciting and interesting work to do in this chapter. We''ll come
    across lots of configurations settings we can play with—remember: if you aren''t
    sure what a setting does then click on the yellow circle with the question mark
    in it next to that setting. If you are feeling doubtful about pressing a button
    or choosing an option, remember: you can''t break anything. Go ahead and see what
    happens!


    Let''s get straight on with learning all about Moodle quizzes...'
  merge: -1
  img_proc: true
- pgno: 262
  md: '# Quiz


    When I''m teaching my Backyard Ballistics course, I often bombard students with
    questions as I am going along—to gauge understanding, to re-enforce topics specific
    to particular learning goals, or simply as entertainment. Then I set a final test,
    to ensure that what I have been teaching has sunk in.


    So why should I convert my quick-fire quizzes and final tests to Moodle? Because
    by doing so I can address two problems:


    +   - Managing my questions:

    +     I keep a bank of questions I''ve thought of in Word documents, one for each
    subject I teach. I also have other documents containing questions my students
    have written themselves for my class competitions: I often split the class into
    two teams and get each team to quiz the other—and often student''s questions are
    much more challenging and incisive than mine!

    +   - Marking tests: marking quizzes and tests takes up a lot of my valuable time.


    Converting quizzes to Moodle is a two-step process. The first task is to upload
    my questions to Moodle. Then, once questions are in the question bank, you need
    to add questions from the question bank to your quiz.


    # Using Moodle''s built-in question editors


    Why does including a quiz take two steps? There are many advantages to having
    the questions kept in a separate question bank:


    +   - Reusing questions is easy. Choosing questions from a question bank means
    I can repeat a question throughout my course if there are questions I want to
    ask in order to reinforce a particular point.

    +   - Having a bank of questions makes it far easier to share questions with my
    colleagues.


    Let''s start by adding a simple question to the course question Bank. The very
    simplest is a True/False question...


    # Time for action – adding a question to the question bank


    +   1. On the course front page, click on Question bank in the Settings block.
    Your course Question bank is displayed.

    +   2. Click on the Create a new question button and on the Choose a question
    type to add dialog select True/False and press Next.'
  merge: -1
  img_proc: true
- pgno: 263
  md: '3. Give the question a name.


    Be careful naming your question...

    This question is going into a question bank. Don''t call it ''1'', or ''a'' because
    we aren''t adding this question to a quiz just yet, and we don''t know where in
    the quiz it will be. We need to give the question a name that''s meaningful to
    us—and to our colleagues if we choose to share our questions later on.


    4. In the Question textbox, you need to write the question you are going to ask.
    See that we are using the HTML editor to edit the question. That means that we
    can include all of the ideas and techniques that we''ve learned so far to make
    the text of a question just that little bit more interesting:


    ![](img/1529021fde33ef551603bbc71587313e_263_0.png)


    5. Scroll down to the Correct answer setting and specify whether the correct answer
    to your question is true or false.


    That is enough to configure a True/False question. We could ignore the rest of
    the settings on this page, scroll down to the bottom and press the Save changes
    button. But I probably won''t be there when my students are answering this question
    so I want to give them encouragement and guidance, depending on how well they
    did answering the question. Let''s add in some feedback.'
  merge: -1
  img_proc: true
- pgno: 264
  md: '# Enhancing your Teaching


    +   6. Scroll back to the **General feedback** box. If there is a learning goal
    or a particular point you need to stress regardless of whether the student got
    the answer right or wrong, then state it in here:


    ![](img/1529021fde33ef551603bbc71587313e_264_0.png)


    +   7. You can also specify feedback for a correct or an incorrect answer.


    +   8. Once you''re happy with your feedback, scroll down to the bottom of the
    page and press the **Save changes** button. Your new question will now be listed
    in the question bank.


    # What just happened?


    We''ve just seen how easy it is to add questions to the question bank. However,
    you can imagine that adding lots of questions to your question bank could take
    some time.


    Let''s have a look now at the other types of questions you can add to your question
    bank. A True/False question is the possibly the most straightforward (in terms
    of settings) you can ask a student. You also have available:


    +   - **Multiple Choice**: Students select their answer from one of a number of
    options. There are, in fact, two types of multiple choice questions—single answer
    and multiple answer (see `http://docs.moodle.org/en/question/type/multichoice`).

    +   - **Short Answer**: Students respond with a word or phrase. You will need
    to specify the correct answers using wildcards, so that Moodle can pick the correct
    answers out of the responses students have typed. Take a look at Moodle docs for
    more information (`http://docs.moodle.org/en/question/type/shortanswer`).

    +   - **Numerical**: If you are asking a question that expects a number as a response
    (even including units) then choose this question type. You can also specify an
    acceptable error in that number. There''s more information at `http://docs.moodle.org/en/question/type/numerical`.'
  merge: -1
  img_proc: true
- pgno: 265
  md: '+   - **Description**: Not actually a question but a way of breaking up questions—perhaps
    providing some text/graphics or maybe a video presentation before a student attempts
    a set of questions.

    +   - **Calculated** (including Calculated Multichoice and Calculated Simple):
    Calculated questions use wildcards that Moodle replaces with "random" numbers
    (although you will need to specify the numbers that Moodle chooses from). More
    details can be found at http://docs.moodle.org/en/question/type/calculated.

    +   - **Essay**: The student''s answer is in essay format. If you are setting
    your students an assignment, then (obviously) use the assignment activity—see
    *Chapter 5, Managing student work*. Note that answers to these questions will
    need to be manually graded. For more information on assignments, see http://docs.moodle.org/en/question/type/essay.

    +   - **Matching**: The student is presented with questions, each of which has
    a drop-down list of possible answers. The student must match the correct answers
    to each question. For more details see http://docs.moodle.org/20/en/Matching_question_type.

    +   - **Random Short-Answer Matching**: You choose how many "sub-questions" are
    chosen (randomly) from the short answer questions that are available. See http://docs.moodle.org/en/question/type/randomsamatch
    for details.

    +   - **Embedded Answers (Cloze)**: This is a fill-the-gaps exercise, but greatly
    enhanced by virtue of being "computerized". Moodle presents the user with a passage
    of text that has questions embedded in it. The learner completes the text with
    their answers (see http://docs.moodle.org/en/question/type/multianswer for details).


    Since this is a beginner''s guide, I haven''t included all the configurations.
    However, more details are given in Moodle docs (check out the links previously
    provided and at http://docs.moodle.org/20/en/Question_types). A YouTube search
    also yields lots of instructional videos demonstrating how to configure Moodle
    questions. It is far better to experiment with the question types you think might
    be useful.


    If you have a lot of questions you need to convert to Moodle, then there are ways
    to help along the conversion:


    +   - **Import questions**: these could be questions that someone else has created
    for you, or questions that you have created using other tools that you are more
    used to.

    +   - **Sharing questions**: again using questions written by someone else, but
    shared from other parts of your Moodle site.


    Let''s spend the rest of this sub-section looking at these alternatives.'
  merge: -1
  img_proc: true
- pgno: 266
  md: '# # Importing questions


    Entering one question at a time into the question bank can be a slow process.
    Luckily, we can import questions from other sources.


    How do we know which types of files can be imported? The answer is to click on
    the **Import** link under **Question bank** in the **Settings** block.


    On the Import page, you can immediately see a variety of sources of questions
    you can convert to Moodle:


    ![](img/1529021fde33ef551603bbc71587313e_266_0.png)


    You can see from the list that if you want to convert questions from another learning
    management system (for example, Blackboard or WebCT) you can do so using the Import
    function. See <http://docs.moodle.org/en/question/import> in the Moodle docs for
    more details.


    # # Managing questions


    Now, we''ve started to convert our questions to Moodle then we need to mention
    briefly how to manage them. Moodle allows you to categorize questions. What is
    the benefit of this? There are questions that my science colleagues are writing
    on chemical reactions and energy transformations that I would love to use on my
    course. The mathematics department have a collection of questions on trajectories
    that I don''t want to reinvent. Likewise, the mathematics and science departments
    want to use my questions in their courses. Now, we are all converting to Moodle,
    we can all share our questions very easily, and that''s the benefit of categorizing
    questions. Let''s see how easy this is:'
  merge: -1
  img_proc: true
- pgno: 267
  md: '# Time for action – categorizing questions


    First task is to create a new category:


    +   1. Return to your course Settings block and under **Question bank** click
    on the **Categories** link.

    +   2. Let''s create a new category for questions related to burning fossil fuels—I
    know the science department is interested in those. Give your new category a name.

    +   3. Select the **Parent** category (you might not need to worry about this
    just yet). For example, energy questions might be categorized under Physics, which
    in turn is under Science.

    +   4. Although you don''t have to, give your category a meaningful description.
    It will make your new category friendlier to your colleagues if you decide to
    share it with them.

    +   5. When you are happy with the settings of your new category, press the **Add
    category** button. The **Edit categories** page will be updated to show your new
    category, and how it fits into the hierarchy of other categories. For example,
    the parent of my new category is my course, basically:

    +   6. The numbers in brackets indicate how many questions are in that category.

    +   7. Click on the **Questions** link under **Question bank** in the course **Settings**
    block to return to the question bank. To move a question into a category, you
    first need to select the category containing the question from the **Category**
    drop-down list.

    +   8. Click on the tick box next to the question you want to move to select it.


    ![](img/1529021fde33ef551603bbc71587313e_267_0.png)'
  merge: -1
  img_proc: true
- pgno: 268
  md: '**9.** With the selected question, we want to move to the new category. Select
    the category you want to move the question to from the **Move to** drop-down list:


    ![](img/1529021fde33ef551603bbc71587313e_268_0.png)


    **10.** Press the **Move to >>** button to move the selected question (or questions)
    to the chosen category.


    # **What just happened?**


    We''ve just seen how to manage questions in your question bank. You can organize
    your question bank using categories. But how do you share categories with other
    courses?


    By default, teachers can only see questions from the question bank in their course.
    They can''t see the question banks from other courses, and they can''t share questions
    between courses, either. If that''s what you want to do then you first need to
    speak to your admin and ask them for question categories shared outside a course.
    For more information see the *Ask the admin* section at the end of this chapter.


    Here is where the Backyard Ballistics course is, in relation to the structure
    of courses and course categories on my Moodle site:


    ![](img/1529021fde33ef551603bbc71587313e_268_1.png)


    Here are the categories available to me before my admin makes the change:


    ![](img/1529021fde33ef551603bbc71587313e_268_2.png)'
  merge: -1
  img_proc: true
- pgno: 269
  md: 'And here''s what it looks like after:


    ![](img/1529021fde33ef551603bbc71587313e_269_0.png)


    You can see that I can now get access to questions from the entire faculty of
    science.


    Now, we''ve added questions to the question bank we can now include a Moodle quiz
    in our course and start setting students online tests.


    # Setting a test


    Once you''ve got a question or two in your question bank, or perhaps you can get
    access to questions written by one of your colleagues, then setting a test is
    easy. Here''s how:


    # Time for action – adding a quiz to the course


    +   1. Choose the topic you want to add a new quiz to. Making sure editing is
    turned on, click on **Add an activity…** and select **Quiz** from the list.

    +   2. Give your quiz a name and, if you want to, you can write a brief introduction.

    +   3. If you want a timed quiz, then check the **Time limit** setting in the
    **General** box. If you are interested in setting a timed quiz but you are unsure
    about any setting then remember that you can click on the yellow circle with a
    question mark in it if you need extra help.

    +   4. Press the **Editing quiz** button.

    +   5. There are a lot of settings we could investigate. To get us started, scroll
    down to the bottom of the page and press the **Save and display** button.'
  merge: -1
  img_proc: true
