- pgno: 225
  md: '# 7

    Communicating Online


    In the previous chapter we saw how to convert projects and assignments to Moodle,
    but that''s only part of the story. When we set an assignment it''s rare that
    we just hand out the work and tell our students to get on with it. Assignment
    work is supported by discussions, both discussions with us as teachers and constructive
    (we hope) talk among the students themselves. If we are going to move project
    work online then not only does it make sense to move those kinds of discussions
    online, but there are distinct advantages to doing so. In this chapter we will
    cover:


    +   - Forums

    +   - Online chat rooms

    +   - Moodle messaging'
  merge: -1
  img_proc: true
- pgno: 226
  md: '# # Communicating in Moodle


    Two-way communication in Moodle comes in three flavors:


    +   - **Real-time, synchronous chat**: Moodle''s very own built-in instant messaging
    system (such as MSN), allowing us to talk to students when they (or we) are out
    of the classroom:


    ![](img/1529021fde33ef551603bbc71587313e_226_0.png)


    +   - **Forums**: Just like old-fashioned message boards. You post a question
    or comment and later on someone posts a response:


    ![](img/1529021fde33ef551603bbc71587313e_226_1.png)'
  merge: -1
  img_proc: true
- pgno: 227
  md: 'Messaging: Don''t be confused by the name; the Moodle messaging service allows
    you to send a message to any other Moodle user. This is different from chat in
    that it''s more like e-mail messaging, rather than being instant messaging. The
    Moodle messaging system is the online replacement for your staff and student pigeonholes:


    ![](img/1529021fde33ef551603bbc71587313e_227_0.png)


    In this chapter we will not only learn how to set them up, but also the best practice
    for each in a teaching context. Specifically, in this chapter you will:


    +   - Create a Moodle forum and explore the various ways it can be used.

    +   - Open a chat room, allowing students to talk online in real time. We''ll
    explore the pros and cons of this tool.

    +   - Learn how to push a Moodle message into your students'' pigeonholes.

    +   - See that all student comments are fully recorded and traceable to the students
    who make them. Moodle provides all the tools necessary to support your establishment''s
    Data Protection or e-Safety policy.


    In the previous chapter we converted our assignments to Moodle, so let''s build
    on that by seeing how a forum can support and encourage students to do well in
    their project work.'
  merge: -1
  img_proc: true
- pgno: 228
  md: '# Forums


    In Chapter 6, Managing Student Work you worked with me in creating a new, hidden
    topic for my course project work. I thought it would be great to upload to Moodle
    a project exemplar and allow students to discuss what they thought were the strengths
    in that work. It''s something I already do in the class, but doing this online
    means:


    +   - Students can take their time to study the example work and formulate an
    answer without the pressure of being sat in a classroom. Students who can be shy
    in the classroom don''t always feel the same social pressure online.

    +   - Forum posts can be kept as long as you wish (even when the student who posted
    has left) so student responses are always available for reference. A good argument
    or idea is kept online for students to refer back to.

    +   - We can hold more than one discussion at a time online. When we are online
    we can cover more topics more easily.

    +   - Forum posts can be edited or deleted for only a relatively short period
    after they are made (which is somewhat different from typical online forums),
    which reinforces the idea of engaging in a Moodle forum being similar to an online
    conversation.


    After a short time you''ll find that when a student posts a problem it is other
    students that are helping them out. That''s certainly been my experience.


    # Adding a forum to your course


    Let''s see how easy it is to create a forum in a Moodle course. There are actually
    four different types of forum supported by Moodle, but I''ll talk about those
    later. Let''s get a forum added to our course. To add a simple forum there are
    only a couple of settings we need to worry about.


    The first thing I did was upload the exemplar, following the instructions in the
    Time for action – uploading a file section in Chapter 3, Adding Documents and
    Handouts. Then I provided a brief introduction using both the topic summary (Time
    for action – defining each week / topic section in Chapter 2, Setting up your
    Courses) and a label (Time for action – inserting a label section in Chapter 5,
    Moodle Makeover). So, here is my starting point:'
  merge: -1
  img_proc: true
