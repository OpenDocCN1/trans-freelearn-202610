- pgno: 326
  md: '# Putting it All Together


    I''m also going to include an Introductions forum (see *Chapter 7, Communicating
    Online*), so that before they meet for the first time all the members of the group
    have a chance to get to know one another (and me). After only thirty minutes (I
    know because I timed it), using all the techniques we have learned in this book
