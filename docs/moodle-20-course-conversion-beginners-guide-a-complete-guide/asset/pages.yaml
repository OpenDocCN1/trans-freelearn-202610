    # **What just happened?**


    We''ve just included an uploaded video into a Moodle web page. The advantage of
    this, over simply providing a link from the course front page, is that we can:


    +   * Compliment the video with explanatory text and supporting images

    +   * Avoid the problem of the student not knowing how to use the video player
    they have installed on their computer (which could be one of many)'
  merge: -1
