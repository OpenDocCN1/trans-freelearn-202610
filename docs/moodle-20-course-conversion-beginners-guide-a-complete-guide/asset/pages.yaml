- pgno: 74
  md: '# Setting up your Courses


    7. To enroll your colleague press the **Enrol** button to the right of their name:


    ![](img/1529021fde33ef551603bbc71587313e_74_0.png)


    8. Once you have finished making your changes, click on the close button in the
    top right-hand corner of the Enrol users dialog window. Your colleague will now
    be listed as a teacher on the course:


    ![](img/1529021fde33ef551603bbc71587313e_74_1.png)


    9. Will there be any teaching assistants or learning coaches working with the
    students on this new course? You might want to add them to the list of so-called
    non-editing teachers. You can assign users to different roles in exactly the same
    way.


    Don''t worry about having to assign students on your course just yet. We''ll be
