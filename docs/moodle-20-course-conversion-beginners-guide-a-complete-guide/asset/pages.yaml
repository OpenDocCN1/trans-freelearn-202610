- pgno: 342
  md: '# Putting it All Together


    2. Do you see a **Groupings** tab at the top of the **Groups** page?


    ![](img/1529021fde33ef551603bbc71587313e_342_0.png)


    3. If not then you need to speak to your Moodle administrator (refer to the *Ask
    the admin* section following on from this one). If you do then click on it.


    4. Press the **Create grouping** button.


    5. Give the grouping a name and, optionally, a description.


    6. Press the **Save changes** button.


    7. We have now created a grouping, but there aren''t yet any groups in it:


    | Grouping | Groups | Activities | Edit |

    |---|---|---|---|

    | Tasks for the Turbo group | None | 0 |  |


    8. Click on the show groups in grouping icon:


    ![](img/1529021fde33ef551603bbc71587313e_342_1.png)'
