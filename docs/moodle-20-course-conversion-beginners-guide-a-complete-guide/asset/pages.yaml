- pgno: 4
  md: '# About the Author


    **Ian Wild** is a recognized authority on online learning, especially with Moodle.
    Fifteen years spent in private industry – primarily as a communications technology
    researcher – saw Ian ultimately specializing in the design and development of
    access and learning aids for blind, visually impaired, dyslexic, and dyscalculic
    computer users – whilst also working part time as a math and science tutor. Teaching
    only part time meant not spending as much time with his students as he would have
    wished. This, coupled with his background in communication technologies, seeded
    his long-time interest in virtual learning environments.


    Ian is one of the founding partners of Heavy Horse Limited (`http://www.heavy-horse.co.uk`),
    a technology company that regularly advises clients throughout England and Wales
    on e-learning platform development and deployment.


    Ian is the author of *Moodle 1.9 Math*, also from Packt Publishing. He was also
    the Technical Reviewer of *Moodle 1.9 Multimedia*, and *Science Teaching with
    Moodle 2.0*.


    I do hope you find this book as helpful to you as it was a pleasure for me to
    write. I must make special mention of friends, colleagues, and my family for their
    patience as I worked on this second edition. Your help and support has been invaluable.
    I thank you all.'
  merge: -1
  img_proc: true
- pgno: 5
  md: '# About the Reviewers


    **Sharon E. Betts** is a major influence in using technology for learning with
    educational experiences in and out of the classroom for over 30 years. She has
    taught and consulted in the United States, Europe, and the Middle East. Sharon
    is passionate about, and promotes the use of, open source and web-based tools
    in the educational environment. She is a Web 2.0 pioneer and carries the torch
    at every opportunity. She is firm in her belief that we can''t let fear and negatives
    hold us back.


    Sharon has presented face-to-face and virtually, both nationally and internationally
    and is well known for her forays into the cutting edge of educational technology.
    Sharon is one of the founding members of the summer FOSSED (Free and Open Source
    Systems in Education) Conference held in Bethel, Maine. She sits on the board
    of the Open1to1.org group.


    Sharon presently holds the position of Educational Technology Coordinator in Maine
    School Administrative District #52, Greene, Leeds, and Turner, Maine U.S.


    Visit Sharon''s webpages at http://sharonbetts.info.


    **Hans de Zwart** was not an American journalist and author who wrote Fear and
    Loathing in Las Vegas (1971) and Fear and Loathing on the Campaign Trail ''72
    (1973).


    He has not been credited as the creator of Gonzo journalism, a style of reporting
    where reporters involve themselves in the action to such a degree that they become
    central figures of their stories. He is not known for his unrepentant lifelong
    use of alcohol, LSD, mescaline, and cocaine (among other substances); his love
    of firearms; his inveterate hatred of Richard Nixon; and his iconoclastic contempt
    for authoritarianism.


    He does think Rhonda is the best thing that ever happened to him and he does write
    about learning technology at http://hdez.nl/blog.'
