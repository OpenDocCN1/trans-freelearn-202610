- pgno: 352
  md: '# Time for action – restore a course


    +   1. Clicking on **Restore** under **Course administration** in the **Settings**
    block takes you to the **Import a backup file** page.

    +   2. Import your backup file if you need to. The procedure for uploading this
    file is exactly the same as uploading a resource:


    ![](img/1529021fde33ef551603bbc71587313e_352_0.png)


    +   3. Once your file is uploaded press the **Restore** button.

    +   4. You are taken to the first page of the Restore wizard ("**Confirm**").
    The contents of the backup file are displayed. If you are happy then scroll down
    to the bottom of the page and press the **Continue** button.

    +   5. The next page allows you to specify the destination. Importantly, you are
    also asked if you want to:

    +      - Merge the contents of the backup into the course

    +      - Delete the contents of a course and replace it with the contents of the
    backup

    +   and, if you have course creator privileges:

    +      - Create a brand new course

    +   You will need to make sure the correct option is chosen. Then scroll down
    to the bottom of the page and press the appropriate **Continue** button:'
  merge: -1
  img_proc: true
- pgno: 353
  md: '![](img/1529021fde33ef551603bbc71587313e_353_0.png)


    +   6. Confirm the settings and press the Next button.


    +   7. The "Schema" page allows you to confirm (or alter) the course name and
    short name (remember short names must be unique), and also allows you to choose
    what resources and activities will be restored out of the backup file. Scroll
    down to the bottom of the page and press the Next button.


    +   8. Review your choices before pressing the Perform restore button at the bottom
    of the page.


    +   9. When the restore is complete press the Continue button. You are now returned
    to the course front page. And that''s it, you''re done!


    # What just happened?


    If the worst happens and I need to restore my course then luckily the process
    is easy. Simply click on Restore under Course administration in the Settings block,
    upload the backup file, click on Restore, follow the instruction and Moodle does
    the rest.


    The great thing about Backup and Restore is that it can be used to share Moodle
    courses. If ever you are given a Moodle course by a colleague and you are wondering
    how to get that course on to your Moodle then it''s highly likely that what your
    colleague has given you is a course backup.'
  merge: -1
  img_proc: true
- pgno: 354
  md: '> **Copying activities from one course to another**

    > To quickly copy activities from one course to another it is better to use **Import**,
    also available under **Course administration** from the **Settings** block.


    # Summary


    We learned a lot in this chapter about how converting to Moodle can help support
    face-to-face learning. Specifically, we covered:


    +   - How quickly a new course can be configured so that it is ready for content

    +   - How to structure a course, including specifically how to structure an introduction
    and how to arrange activities

    +   - How quickly courses can start to take shape


    We also saw how we could convert to fully online courses, with particular emphasis
    on learning about how we can convert group, or team working over to Moodle, specifically:


    +   - How to manage groups of students online

    +   - How to create groups and how to add students to them

    +   - How to hand out group specific work (using Groupings)


    We saw how we can monitor student progress, and how we can see where students
    have been on our course (and even from which computer). That led us on to a discussion
    about the Moodle gradebook. We barely scratched the surface of this tool, but
    we did see how you can categorize grades and even add in your own grading items
    (so that you are not limited to only grades from course activities).


    Finally, we learned how to back up and restore courses, meaning we can preserve
    all of the hard work you have done so far!'
  merge: -1
  img_proc: true
- pgno: 355
  md: '# # Pop Quiz Answers


    # ## Chapter 1, Going Electric


    +   - Moodle is an acronym but what does it stand for? When thinking about your
    Moodle doing what you need it to do to support your teaching, why is the ''M''
    in Moodle so important?

    +       - **Answer:** Modular Object Oriented Dynamic Learning Environment. That
    Moodle is ''M''odular means if Moodle doesn''t do something you need it to then,
    chances are, there is a module available that will let you do it.

    +   - I''ve just clicked on a category to view the courses in it. I see that there
    is a button marked **Add a new course**. What''s my role in this context?

    +       - **Answer:** Course creator


    # ## Chapter 2, Setting up your Courses


    +   - What is the difference between a course creator and a manager?

    +       - **Answer:** A course creator has fewer permissions than a manager. For
    example, a course creator can create new courses but a manager can delete them,
    too!

    +   - How do you change the format of your course from topics to weekly?

    +       - **Answer:** By going to your **Course settings** page (via the **Settings**
    block by clicking on **Edit settings**) and selecting the desired type from the
    **Format** drop-down list.'
  merge: -1
  img_proc: true
- pgno: 356
  md: '# Chapter 3, Adding Documents and Handouts


    +   - Do your students have direct access to your Private files area? How do you
    provide a link to a file in your Private files area?

    +     - **Answer:** Students do not have access to your Private files area. Select
    the file you wish to hand out using the file picker.

    +   - The size of PowerPoint files can be greatly reduced by cropping and compressing
    any images contained in the presentation. Can you remember the steps to compress
    images?

    +     - **Answer:** Look back through this chapter to check your knowledge.

    +   - If you''ve just cut and pasted text from a Word document then there''s a
    special button in the HTML editor that is worthwhile pressing before you go any
    further. What''s the name of that button?

    +     - **Answer:** You can use the **Cleanup messy code** button.'
  merge: -1
  img_proc: true
