- pgno: 146
  md: '+   - It keeps the student inside the course and focused on learning (rather
    than being tempted to start watching other videos)

    +   - ...And they can read and watch at the same time


    Did the video play correctly? Did the video player give you just a black box,
    rather than playing you your video? Computers can be a bit fussy over video file
    formats and to that end some formats are sometimes better to use than others.
    In the next section, we investigate video file format options.


    # Choosing a video file format


    It''s best to convert your videos in to one of the common video file formats—formats
    that are usually distinguishable by their file extensions. Those are the three
    letters that appear after the period in the file name. If you choose one of these
    common types then:


    +   - Moodle will recognize the file and give it an appropriate icon when you
    upload it to your My private files area. This may not be particularly important
    at the moment, but it is if you have lots of files in there and you want to find
    particular types of files at a glance.

    +   - The video will play on most modern computers without any special effort.

    +   - Moodle will allow you to embed files of this type into Moodle web pages,
    as we shall soon see in the following sections.


    If your video file isn''t in one of these formats (for example they could be in
    MP4) then try out one of the free online file conversion tools, for example zamzar.com.


    # Moodle video troubleshooting


    Are you seeing a link to your video but no video player? You might be seeing this:


    ![](img/1529021fde33ef551603bbc71587313e_146_0.png)'
  merge: -1
  img_proc: true
