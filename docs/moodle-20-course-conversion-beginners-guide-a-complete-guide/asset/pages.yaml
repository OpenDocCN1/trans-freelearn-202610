- pgno: 154
  md: '# Extracting a video from YouTube


    There are a number of websites dedicated to extracting videos from YouTube—`zamzar.com`
    and `keepvid.com` are two good examples. Rather than explain in detail how to
    use these websites, a better idea is to direct you back to YouTube and to carry
    out a search for videos on zamzar and keepvid. You''ll quickly find lots of instruction
    videos (often by the actual developers of the tools) showing you how to extract
    videos from YouTube.


    Once you have extracted your video, simply follow the instructions on embedding
    a video (see *Time for Action – embedding a video into a Moodle Page*).


    # Including videos from TeacherTube


    Both Vimeo and TeacherTube provide a special code to allow you to embed their
    own respective video players and the process is exactly the same. As it''s dedicated
    to education, let''s quickly run through the process of embedding a video from
    TeacherTube.


    # Time for action – embedding a video from TeacherTube


    It is easier to have both Moodle and TeacherTube open at the same time, just as
    we did when working with YouTube. Have a look for a video that takes your fancy.
    Here''s the match rocket test launch video again:


    ![](img/1529021fde33ef551603bbc71587313e_154_0.png)'
