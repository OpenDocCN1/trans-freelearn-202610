- pgno: 149
  md: '> > Remember: before you think about embedding a video from YouTube or TeacherTube
    in your course, ensure that students can access these websites from within your
    institution. They could be filtered out. Also remember that YouTube videos can
    be taken down at any time. If they are then your link won''t work.


    Let''s start by looking at how we can include videos from YouTube.


    # Including videos from YouTube


    We''ve basically got four options if we want to include videos from YouTube in
    our courses:


    +   - Embed the video directly from YouTube, using YouTube''s special player.

    +   - If YouTube is blocked, then extract the video from YouTube and upload it
    to our course, then embed the video just as we did in the previous section (remember
    that you should contact the author of the video before doing this).

    +   - If we don''t want to put too much strain on the computer running Moodle
    then we can extract the video from YouTube and then upload it to TeacherTube.
    But you''ll need to create a TeacherTube account for yourself in order to do this
    (again, remember to check with the creator of the original video before doing
    this—unless, of course, that''s you).

    +   - Type in the direct link to the YouTube video and let Moodle''s multimedia
    filter turn the link into an embedded player (which means you must make sure your
    admin has Multimedia filters turned on and configured correctly).


    Let''s look at embedding the YouTube video player into our course. Why explain
    a process in detail that may not work? Because the process of embedding a video
    from TeacherTube is exactly the same.


    # Time for action – embedding the YouTube player into your course


    The first task is to search for a video that you want to include. A good idea
    here is to have Moodle and YouTube open at the same time. If your web browser
    supports tabs then you can tab between them. If not, then have Moodle open in
    one browser and open YouTube in a second browser.'
  merge: -1
  img_proc: true
- pgno: 150
