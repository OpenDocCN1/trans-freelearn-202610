- pgno: 95
  md: '+   3. Press the **Save changes** button:


    ![](img/1529021fde33ef551603bbc71587313e_95_0.png)


    +   4. That''s it. You''re done! The new folder is now listed in the **My private
    files** area:


    ![](img/1529021fde33ef551603bbc71587313e_95_1.png)


    # What just happened?


    We''ve just created a new folder in our course Files area, ready for us to put
    some files in. Just click on the plus in front of the folder name to have a look
    inside it (if you are in the process of actually managing your files, then you
    can click on the name of the folder itself). Of course, at the moment it''s empty.
