  md: '# # Time for action – heading


    +   1. Action 1

    +   2. Action 2

    +   3. Action 3


    Instructions often need some extra explanation so that they make sense, so they
    are followed with:


    # ## What just happened?


    This heading explains the working of tasks or instructions that you have just
    completed.


    You will also find some other learning aids in the book, including:


    # # Pop quiz – heading


    These are short multiple choice questions intended to help you test your own understanding.


    # # Have a go hero – heading


    These set practical challenges and give you ideas for experimenting with what
    you have learned.


    You will also find a number of styles of text that distinguish between different
    kinds of information. Here are some examples of these styles, and an explanation
    of their meaning.


    Code words in text are shown as follows: "I''m going to specify MCC–BC."


    **New terms** and **important words** are shown in bold. Words that you see on
    the screen, in menus or dialog boxes for example, appear in the text like this:
    "Scroll down to the bottom of the page and press the **Save changes** button".


