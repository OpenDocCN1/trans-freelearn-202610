  # 关于作者


  **Ian Wild** 是在线学习领域公认的权威，尤其在 Moodle 方面。在私营行业工作的十五年里——主要担任通信技术研究员——Ian 最终专注于为盲人、视障、诵读困难和计算障碍的计算机用户设计和开发无障碍辅助与学习辅助工具，同时兼职担任数学和科学辅导老师。由于只是兼职教学，他与学生相处的时间无法达到自己所希望的程度。这一点，再加上他在通信技术方面的背景，激发了他对虚拟学习环境的长期兴趣。


  Ian 是 Heavy Horse Limited（`http://www.heavy-horse.co.uk`）的创始合伙人之一，这家技术公司定期为英格兰和威尔士各地的客户提供电子学习平台开发和部署方面的咨询。


  Ian 是同样由 Packt Publishing 出版的《*Moodle 1.9 数学*》一书的作者。他还担任过《*Moodle 1.9 多媒体*》和《*使用
  Moodle 2.0 进行科学教学*》的技术审校。


  我衷心希望这本书对您有所帮助，就像我撰写它时一样乐在其中。我必须特别感谢我的朋友、同事和家人在我编写这第二版期间所给予的耐心。你们的帮助和支持弥足珍贵。感谢大家。


  # 关于审校人员


  **Sharon E. Betts** 在利用技术促进学习方面具有重要影响力，拥有超过30年的课堂内外教育经验。她曾在美国、欧洲和中东地区任教并提供咨询。Sharon
  热衷于在教育环境中推广使用开源和基于网络的工具。她是 Web 2.0 的先驱，一有机会就会传递这把火炬。她坚信我们不能让恐惧和消极因素阻碍我们前进。


  Sharon 曾在国内和国际上进行过面对面和线上演讲，并以其在教育技术前沿领域的探索而闻名。Sharon 是在缅因州贝塞尔举办的夏季 FOSSED（教育中的自由与开源系统）会议的创始成员之一。她是
  Open1to1.org 团体的董事会成员。


  Sharon 目前担任美国缅因州第52学区（Maine School Administrative District #52，服务格林、利兹和特纳）的教育技术协调员。


  请访问 Sharon 的网页：http://sharonbetts.info。


  **Hans de Zwart** 并不是那位撰写了《拉斯维加斯的恐惧与厌恶》（1971）和《''72年竞选途中的恐惧与厌恶》（1973）的美国记者和作家。


  他并未被认定为刚左（Gonzo）新闻业的开创者——这种报道风格中，记者深入事件的程度如此之深，以至于自己成为故事的核心人物。他并不以终身无悔地使用酒精、LSD、麦斯卡林和可卡因（以及其他物质）而闻名；也不以热爱枪支、对理查德·尼克松根深蒂固的憎恨，以及以打破偶像的姿态蔑视威权主义而著称。


  他确实认为 Rhonda 是发生在他身上最美好的事情，而且他确实在 http://hdez.nl/blog 上撰写关于学习技术的文章。


  ## 前言


  世界各地的学校、学院和大学都在安装Moodle，但许多教育工作者并没有充分利用它。由于功能众多，学习起来可能很麻烦——而且教师们日常压力很大，无法投入大量时间从头重建所有课程。


  本书为教师和培训师提供了上手Moodle的最快途径，将他们熟悉的教材转变为Moodle电子学习课程。


  本书展示了如何快速轻松地将你现有的笔记、工作表、资源和教案引入Moodle。本书不是探索Moodle的每一个功能，而是专注于让你立即上手——你将从一开始就把现有材料变成Moodle课程。


  本书首先展示如何将你的教学日程转变为Moodle课程，包含正确数量的主题和周次。然后你将看到如何将你的资源——文档、幻灯片和工作表——转换为Moodle。你将学习如何以学生能阅读的方式格式化它们，并沿途使用大量快捷方式加快这一过程。


  到*第3章，添加文档和讲义*结束时，你已经拥有一个以美观方式包含学习资源的Moodle课程。但本书并未止步于此——你还将了解如何使用Moodle接收和评估课程作业提交、与学生在线讨论作业，以及发布测验、测试和视频。


  贯穿全书，重点是快速取得成果——将教学材料迁移到网上，使课程对学生更有效，也为你减少工作量。


  ## 本书涵盖内容


  第1章“电子化”，涵盖Moodle为何被创建以及如何被开发，如何登录和退出Moodle，探索Moodle界面并学习一些Moodle术语，以及配置你的用户个人资料。


  第2章“设置课程”，涵盖配置你的Moodle课程。


  第3章“添加文档和讲义”，涵盖将你的内容放上网，并让学生准备好开始使用。


  第4章“声音与视觉——包含多媒体内容”，涵盖如何通过声音、视频和多媒体让你的课程更具吸引力和娱乐性。


  第5章“Moodle大变身”，将介绍一些技巧和方法，让你的课程从看起来不错变成看起来很棒。


  第6章“管理学生作业”，涵盖在线管理学生作业。


  第7章“在线交流”，涵盖如何与学生在线讨论作业。


  第8章“提升你的教学”，涵盖如何使用其他Moodle活动（如测验和Wiki）来提升教学。


  第9章“整合在一起”，将所有内容整合在一起，并探讨如何构建已转换为Moodle的课程的可能方式。


  ## 本书适合谁阅读


  本书面向已经拥有大量教学材料，并希望使用Moodle来增强现有课程而非开发全新课程的教师、辅导老师和讲师。你不需要有Moodle的使用经验，但需要有教师权限访问一个已安装好的Moodle站点。


  有一定Moodle使用经验、并希望专注于整合现有课程材料的教师也会发现本书非常有用。


