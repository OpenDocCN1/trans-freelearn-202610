  \n## 查看过去的聊天会话\n\n聊天可以以光速进行。然而，默认情况下它们始终会被记录，所以如果讨论中有什么内容需要回头参考，只需点击 查看过去的聊天会话 即可查看聊天记录：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_246_2.png)\n\n作为教师，你现在可以选择查看过去的会话或在不再相关时删除它们：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_246_3.png)\n\n点击 查看此会话 以查看聊天。\n\n## Have\
