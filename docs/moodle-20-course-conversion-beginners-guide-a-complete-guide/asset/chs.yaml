  \n## Time for action – 告知学生我们何时在场\n\n- 1. 如果你在课程首页上，则点击聊天室旁边的更新图标。如果你是在聊天室页面上，则在设置区块的\
  \ Chat administration 下选择 编辑设置。\n- 2. 向下滚动 编辑聊天 页面，直到看到聊天时间设置（在 General 框中）：\n-\
  \ 3. 我最初将聊天室配置为发布聊天时间（你可以在之前的截图中看到效果）。我希望每周一午餐时间都有相同的聊天时间，所以：\n- 4. 滚动到页面底部并按下 保存并返回课程\
  \ 按钮。就这样。完成了。\n\n![](img/1529021fde33ef551603bbc71587313e_247_0.png)\n\n![](img/1529021fde33ef551603bbc71587313e_247_1.png)\n\
  \n## What just happened?\n\n我们刚刚指定了我们将要进行聊天的时段，但学生们怎么会知道呢？一种方法是查看课程首页上的 即将发生的事件\
  \ 区块（通常位于课程主页面右侧）：\n\n![](img/1529021fde33ef551603bbc71587313e_248_0.png)\n\n试着点击区块中的\
  \ Go to calendar... 链接。课程日历将被显示：\n\n![](img/1529021fde33ef551603bbc71587313e_248_1.png)\n\
  \n你可以看到课程日历是一个多么强大的工具。你可以添加新的事件，无论是提醒自己还是课程事件，在其中你可以让学生知道即将到来的考试。对于真正喜欢冒险的人，日历可以导出并上传到你的手机、iPad\
  \ 或你选择的 PDA/平板设备。\n\n你甚至可以在课程首页上显示一个迷你日历。我知道本章是关于沟通的，但因为我想让我的学生知道我何时会为聊天提供服务，现在是我想在我的课程中加入一个事件日历的时候了。让我们看看如何做到这一点。\n\
  \n## 在课程首页添加日历\n\n将日历添加到你的课程首页完全是添加 Calendar 区块的问题：\n\n## Time for action – 添加日历\n\
  \n- 1. 返回你的课程首页并在编辑模式下打开，点击 Blocks 区块中的 Add...。然后选择 Calendar：\n\n![](img/1529021fde33ef551603bbc71587313e_249_0.png)\n\
  \n- 2. 日历现在已添加到你的课程首页。你可以通过使用移动图标来重新定位它：\n\n![](img/1529021fde33ef551603bbc71587313e_249_1.png)\n\
  \n或者，如果你看到的不是箭头而是十字准线，则可以通过点击区块并拖动它。\n\n- 3. 一旦你将日历放在想要的位置（我喜欢将 **Calendar** 区块和\
  \ **Upcoming events** 区块放在彼此旁边）那么你就完成了。\n\n### What just happened?\n\n日历是让学生知道课程上即将发生什么事情的绝佳工具，我们刚刚学习了如何将迷你日历添加到我们的课程首页。\n\
  \n日历上之前显示的课程事件（我能判断它是课程事件因为背景是粉红色的）是为了表明我将在下午 1:00 在海报展示聊天室。如果我将鼠标指针悬停在 7 月 7 日上，我会看到这个：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_250_0.png)\n\n## Have a go hero – 日历事件\n\
  \n在 *Chapter 5, Moodle Makeover* 中，我们看到了如何将我们的项目和作业转换为 Moodle。记住你也可以指定 Moodle 作业的可用时间。配置\
  \ Available from 和 Due date。作业将被添加到你的日历中。\n\n## 聊天室技巧和窍门\n\n在我们离开聊天室之前，这里有一些在课程中使用聊天室的想法：\n\
  \n- 让学生加入聊天室，以便他们在见面之前互相认识并认识你。\n- 使用隐藏的聊天室与同事举行关于课程的会议。\n- 邀请嘉宾进入你的聊天室，也许是来自你当地学院或大学的专家。\n\
  - 你的学校“结对”了吗？也就是说，它是否与另一所学校（甚至可能是另一个国家的学校）有特殊联系？使用 Moodle 与结对学校进行聊天。我们曾使用聊天来分享 Backyard\
  \ Ballistics 轶事！\n\n我们将在本章剩余部分研究 Moodle 消息传递，Moodle 自带的消息系统。\n\n## Moodle 消息传递\n\
  \n论坛和聊天主要是教学工具。另一方面，Moodle 消息是当你想要向学生发送消息时理想的课程管理工具。随着我们继续将课程转换为在线运行，我们在处理本节时将会发现，学生也可以相互发送消息，进一步支持协作工作。\n\
  \n请注意，我把这个主题的讨论留到本章末尾，因为通常 Moodle 消息传递是关闭的。在继续阅读之前，确实值得检查一下你的 Moodle 中是否启用了消息传递。\n\
  \n## 发送欢迎消息\n\n我认为给所有新学生发送一条欢迎消息，感谢他们加入我的 Backyard Ballistics 课程是个好主意。让我们看看现在有多容易：\n\
  \n## Communicating Online\n\n## Time for action – 向学生发送消息\n\n- 1. 在 **Navigation**\
  \ 区块中，在你的课程下，点击 **Participants**：\n- 2. 在参与者列表下，按下 **Select All** 按钮。\n- 3. 点击 **With\
  \ selected users...** 下拉菜单并从列表中选择 **Send a message**：\n\n![](img/1529021fde33ef551603bbc71587313e_252_0.png)\n\
  \n![](img/1529021fde33ef551603bbc71587313e_252_1.png)\n\n- 4. 在消息框中输入你的消息：\n\n![](img/1529021fde33ef551603bbc71587313e_253_0.png)\n\
  \n- 5. 查看页面底部的当前选定用户列表。你可以通过按下他们姓名旁边的 **Remove** 按钮来移除在上一屏幕中意外选择的用户。请注意，我故意将消息发送给自己。如果我的学生声称他们没有收到消息而我收到了，那么我知道这不是\
  \ Moodle 的问题。\n- 6. 当你对消息满意时，按下 **Preview** 按钮。\n- 7. 如果你想做更改，请按下 **Update** 按钮。如果满意则按下\
  \ **Send**。\n- 8. 就这样。完成了！\n\n## Communicating Online\n\n## What just happened?\n\
  \n我们刚刚向所有学生发送了一条欢迎他们加入我们课程的消息。向学生发送消息很容易，你只需从课程参与者列表中选择你想要发送消息的学生。\n\n## Are you\
  \ getting the message\n\n我怎么知道我有消息？如果有人给我发送消息，则在第一次登录时或，如果我已经登录，则每当收到新消息时都会出现弹出消息对话框：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_254_0.png)\n\n如果你可以，请在继续阅读前请同事或你的学生之一给你发送消息。\n\
  \n> **收到消息但看不到消息对话框？**\n> \n> 那么很可能是弹出窗口被阻止了。请联系你的 IT 帮助台或技术人员寻求帮助。\n\n我刚刚收到 Jill\
  \ Brown 的消息。如果我点击 **Go to messages** 链接，我可以在 **Messages** 屏幕中看到我有一个传入联系人。我将点击 **Incoming\
  \ contacts** 列表中的 Jill 的名字：\n\n![](img/1529021fde33ef551603bbc71587313e_254_1.png)\n\
  \n\n\n在下一个屏幕上，有一个框供我给吉尔回复消息：\n\n![](img/1529021fde33ef551603bbc71587313e_255_0.png)\n\
  \n如果你在退出登录时收到消息，那么你也可能会收到一封电子邮件。默认设置是：如果你离线超过10分钟，Moodle 会向你发送一封电子邮件。你可以通过单击“设置”区块中的“消息”来更改此行为。下次你收到消息或使用消息功能时，可以查看一下设置，了解消息功能是如何配置的。你会看到你还可以：\n\
  \n-   输入一个专门用于 Moodle 消息的电子邮件地址。\n-   使用 Jabber 聊天客户端接收消息，例如，在手机上接收消息时，你需要安装 Jabber（现在已更名为\
  \ XMPP）服务器，并将你的 Moodle 配置为与之通信，因此你可能还需要与你的 Moodle 管理员沟通。请让他们查看 Prosody IM（详情请参见\
  \ http://prosody.im），因为它是最紧凑且最容易安装的。\n-   阻止不在你联系人列表中的用户发送的消息，以及除此之外的许多其他设置。\n\n\
  让参与者之间的消息传递更简单的一种方法是将“消息”区块添加到课程首页。让我们来看看具体怎么做：\n\n## 刚才发生了什么？\n\n我们刚刚将**消息**区块添加到课程首页，以使参与者之间的消息传递更加简便。学生可能不想在论坛上发帖或加入聊天室，但既然我们现在正将课程转换到\
  \ Moodle，我们希望学习者之间的沟通尽可能直接。\n\n## 管理你的联系人\n\n在最后这一部分中，我们将看看如何管理你的联系人，尤其是当你已将消息功能配置为阻止不在联系人列表中的用户发送的消息时。如果你已将**消息**区块添加到课程首页，那么现在请单击**消息...**。\n\
  \n## 操作时间 – 添加联系人\n\n1.  在**导航**区块中，单击**个人资料**下的**消息**链接：\n\n![](img/1529021fde33ef551603bbc71587313e_257_0.png)\n\
  \n2.  你可以搜索用户，也可以列出你所注册课程中的参与者。我将使用**搜索人员和消息**选项，输入我想添加到联系人列表中的人的名字：\n\n![](img/1529021fde33ef551603bbc71587313e_257_1.png)\n\
  \n如需更多搜索选项，请单击“高级”链接。\n\n3.  按下“搜索人员和消息”按钮。如果找到用户，他们将被列出。要将该用户添加到你的联系人列表，请单击“添加联系人”图标：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_258_0.png)\n\n4.  现在，你的联系人列表中已经添加了一个新联系人：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_258_1.png)\n\n## 刚才发生了什么？\n\n添加联系人很简单，只需搜索用户并单击“添加联系人”图标即可。你也可以通过单击“阻止联系人”图标来阻止联系人：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_259_0.png)\n\n## 总结\n\n在本章中，我们学到了很多关于在线交流的知识。如果我们要将课程转换到\
  \ Moodle，那么沟通和良好的沟通比以往任何时候都更加重要。你将无法使用在现实世界中与人交谈时通常使用的手势、表情和口头暗示。我们了解了如何将论坛和聊天室用作教学工具，以及将\
  \ Moodle 消息用作课程管理工具。\n\n具体来说，我们涵盖了：\n\n-   如何使用 Moodle 自带的即时消息系统（如 MSN）向 Moodle\
  \ 课程添加聊天室。Moodle 聊天室允许学生在他们（或我们）不在教室时进行实时交谈。我们探讨了使用此活动的优缺点。\n-   你可以宣布何时有空进行聊天，我们还学习了如何在课程首页添加迷你日历，以便学生轻松查看即将发生的课程相关事件。\n\
  -   如何使用论坛在网上进行辩论和讨论。我们了解到有四种不同类型的论坛，以及每种论坛如何支持不同类型的讨论。\n-   如何将教职员工和学生的“信箱”转换为使用\
  \ Moodle 消息功能，以及如何向学生发送欢迎消息。\n\n我们还讨论了如何让自己更容易被理解，特别研究了如何使用表情符号来表明你的真实意图。\n\n现在我们已经了解了沟通，接下来准备深入研究如何利用其他\
  \ Moodle 活动（如测验和 wiki）来增强教学。我们将在下一章中介绍这些内容以及更多内容。\n"
- "## 8 增强你的教学\n\n# \n\n> 在这个阶段，我相信你已经迫不及待地想尝试一些更高级的 Moodle 活动，而这正是我们将在本章中要做的事情。\n\
  \n在本章中，我们将：\n\n-   学习如何创建 Moodle 测验。将你的测试转换到 Moodle，并让它们自动批改后返回给你！\n-   将角色扮演和情景模拟转换为\
  \ Moodle 课程（Lesson）。\n-   使用 workshop（互评）活动鼓励同伴评审，并帮助培养提供建设性批评的技能。\n-   让学生使用 Moodle\
  \ wiki 在线协作完成项目工作。\n-   使用 Moodle 术语表创建在线多媒体词典。\n-   使用 choice（投票/选择）活动将快问快答和快速民意调查转换到\
  \ Moodle。\n\n你是否希望阻止学生访问某个活动或资源，直到他们完成某项前置任务？例如，我需要所有学生先同意一项健康与安全免责声明（以让我的保险公司满意），然后他们才能正式开始课程。我们可以通过\
  \ Moodle 的“条件活动”功能来实现这一点，在本章中我们将学习如何操作。\n\n在本章中，我们有一些令人兴奋且有趣的工作要做。我们会遇到许多可以调整的配置设置——请记住：如果你不确定某个设置的作用，请单击该设置旁边的带问号的黄色圆圈。如果你对按下某个按钮或选择某个选项感到犹豫，请记住：你不会弄坏任何东西。尽管试试，看看会发生什么！\n\
  \n让我们直接开始全面了解 Moodle 测验...\n\n## 测验\n\n在我教授“后院弹道学”课程时，我经常一边上课一边向学生提问——以衡量他们的理解程度、强化特定学习目标相关的主题，或者仅仅是为了娱乐。然后我会安排一次最终测试，以确保我所教的内容已经被学生消化吸收。\n\
  \n那么，我为什么要把我的快问快答和最终测试转换到 Moodle 呢？因为这样做可以解决两个问题：\n\n-   管理我的问题：\n    我在 Word 文档中保存了一个问题库，每个我教授的科目都有一个。我还有其他的文档，其中包含学生为了我的课堂比赛而自己编写的问题：我经常把全班分成两个小组，让每个小组向另一个小组提问——而且学生的问题往往比我的问题更具挑战性和尖锐性！\n\
  -   批改测试：批改测验和测试占用了我的大量宝贵时间。\n\n将测验转换到 Moodle 是一个两步过程。第一步是将我的问题上传到 Moodle。然后，一旦问题进入问题库，你就需要从问题库中将问题添加到你的测验中。\n\
  \n## 使用 Moodle 内置的问题编辑器\n\n为什么包含测验需要两步？将问题保存在单独的问题库中有许多优点：\n\n-   重复使用问题很容易。从问题库中选择问题意味着，如果我想提出某些问题以强化某个特定知识点，我可以在整个课程中重复使用同一个问题。\n\
  -   拥有问题库使与同事分享问题变得更加容易。\n\n让我们先从向课程问题库添加一个简单的问题开始。最简单的是判断题（True/False）问题...\n\n\
  ## 操作时间 – 向问题库添加问题\n\n1.  在课程首页上，单击“设置”区块中的“问题库”。将显示你课程的问题库。\n2.  单击“创建新问题”按钮，在“选择要添加的问题类型”对话框中，选择“判断题（True/False）”并按下“下一步”。\n\
  \n\n\n\n3. 给问题命名。\n\n命名问题时要小心……\n这个问题将存入题库。不要将它命名为“1”或“a”，因为我们现在还不会将此问题添加到测验中，也不知道它会出现在测验的哪个位置。我们需要给这个问题起一个对我们有意义的名称——如果我们日后选择共享问题，对同事也有意义。\n\
  \n4. 在“问题”文本框中，你需要写出要提出的问题。请注意我们正在使用 HTML 编辑器来编辑问题。这意味着我们可以运用到目前为止学到的所有思路和技巧，使问题文本更加有趣一些：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_263_0.png)\n\n5. 向下滚动到“正确答案”设置，并指定你的问题的正确答案是对还是错。\n\
  \n这样足以配置一个判断题。我们可以忽略此页面上的其他设置，直接滚动到页面底部并点击“保存更改”按钮。但当我的学生回答这个问题时，我可能不在场，因此我想根据他们的答题表现给他们一些鼓励和指导。让我们添加一些反馈。\n\
  \n## 提升你的教学\n\n+ 6. 向上滚动到**常规反馈**框。如果有一个学习目标或某个特定要点，无论学生答对还是答错，你都需要强调，那么就将其写在这里：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_264_0.png)\n\n+ 7. 你也可以为正确或错误的答案指定反馈。\n\
  \n+ 8. 当你对反馈内容满意后，向下滚动到页面底部并点击**保存更改**按钮。你的新问题现在将出现在题库中。\n\n## 刚才发生了什么？\n\n我们刚刚看到了向题库添加问题是多么容易。然而，你可以想象，向题库添加大量问题可能会花费一些时间。\n\
  \n现在让我们看看可以添加到题库的其他类型的问题。判断题可能是你可以向学生提出的（在设置方面）最直接的问题。你还可以使用：\n\n+ - **选择题**：学生从多个选项中选择一个答案。实际上，选择题有两种类型——单项选择和多项选择（参见\
  \ `http://docs.moodle.org/en/question/type/multichoice`）。\n+ - **简答题**：学生用一个单词或短语作答。你需要使用通配符指定正确答案，以便\
  \ Moodle 能从学生键入的答案中识别出正确答案。更多信息请参阅 Moodle 文档（`http://docs.moodle.org/en/question/type/shortanswer`）。\n\
  + - **数值题**：如果你提出的问题期望以数字作为答案（甚至包含单位），请选择此题型。你还可以指定该数字可接受的误差范围。更多信息请参见 `http://docs.moodle.org/en/question/type/numerical`。\n\
  \n+ - **描述**：实际上不是问题，而是一种分隔问题的方式——可能是在学生尝试一组问题之前提供一些文本/图形或视频演示。\n+ - **计算题**（包括计算选择题和简单计算题）：计算题使用通配符，Moodle\
  \ 会用“随机”数字替换这些通配符（不过你需要指定 Moodle 可从中选择的数字）。更多详情请访问 http://docs.moodle.org/en/question/type/calculated。\n\
  + - **论述题**：学生的答案以文章格式呈现。如果你要给学生布置作业，那么（显然）应使用作业活动——参见*第 5 章，管理学生作业*。请注意，这些问题的答案需要手动评分。有关作业的更多信息，请参阅\
  \ http://docs.moodle.org/en/question/type/essay。\n+ - **匹配题**：向学生展示若干问题，每个问题都有一个可能答案的下拉列表。学生必须为每个问题匹配正确的答案。更多详情请参阅\
  \ http://docs.moodle.org/20/en/Matching_question_type。\n+ - **随机简答匹配题**：你可以从可用的简答题中（随机）选择多少道“子问题”。详情请参阅\
  \ http://docs.moodle.org/en/question/type/randomsamatch。\n+ - **内嵌答案（完形填空）**：这是一种填空练习，但通过“计算机化”而得到了极大增强。Moodle\
  \ 向用户显示一段包含内嵌问题的文本，学习者用他们的答案补全文本（详情请参阅 http://docs.moodle.org/en/question/type/multianswer）。\n\
  \n由于这是一本入门指南，我并未涵盖所有配置。不过，Moodle 文档中提供了更多细节（请查看之前提供的链接以及 http://docs.moodle.org/20/en/Question_types）。在\
  \ YouTube 上搜索也能找到大量演示如何配置 Moodle 问题的教学视频。最好自己尝试那些你认为可能有用的题型。\n\n如果你有大量问题需要转换为 Moodle，那么有一些方法可以帮助完成转换：\n\
  \n+ - **导入问题**：这些可以是其他人为你创建的问题，或者你使用自己更熟悉的其他工具创建的问题。\n+ - **共享问题**：同样是使用其他人编写的问题，但从你的\
  \ Moodle 站点其他部分共享而来。\n\n让我们用本小节的剩余部分来看看这些替代方案。\n\n## 导入问题\n\n一次一个问题地输入题库可能是一个缓慢的过程。幸运的是，我们可以从其他来源导入问题。\n\
  \n我们如何知道哪些类型的文件可以导入？答案是点击“设置”版块中“题库”下的**导入**链接。\n\n在“导入”页面上，你立即可以看到多种可以转换为 Moodle\
  \ 的问题来源：\n\n![](img/1529021fde33ef551603bbc71587313e_266_0.png)\n\n从列表中可以看到，如果你想从其他学习管理系统（例如\
  \ Blackboard 或 WebCT）转换问题，可以使用导入功能来完成。更多详情请参阅 Moodle 文档中的 <http://docs.moodle.org/en/question/import>。\n\
  \n## 管理问题\n\n现在，我们已经开始将问题转换到 Moodle，那么我们需要简要提一下如何管理它们。Moodle 允许你对问题进行分类。这样做有什么好处？我的科学课同事正在编写关于化学反应和能量转化的问题，我很想在我的课程中使用。数学系有一批关于轨迹的问题，我可不想重新编写。同样，数学系和科学系也想在我的课程中使用我的问题。现在，我们都在转换到\
  \ Moodle，我们可以非常轻松地共享问题，这就是对问题进行分类的好处。让我们看看这有多简单：\n\n## 动手实践 – 对问题进行分类\n\n第一个任务是创建一个新类别：\n\
  \n+ 1. 返回课程“设置”版块，在**题库**下点击**类别**链接。\n+ 2. 让我们为与燃烧化石燃料相关的问题创建一个新类别——我知道科学系对这些问题感兴趣。为你的新类别命名。\n\
  + 3. 选择**父级**类别（你可能暂时还不需要担心这个）。例如，能量问题可能归类在“物理”下，而“物理”又归类在“科学”下。\n+ 4. 虽然不是必须的，但请为你的类别提供一个有意义的描述。如果你决定与同事共享，这会使你的新类别对他们更友好。\n\
  + 5. 当你对新类别的设置感到满意时，点击**添加类别**按钮。**编辑类别**页面将更新，以显示你的新类别及其在其他类别层级中的位置。例如，我的新类别的父级基本上是我的课程：\n\
  + 6. 括号中的数字表示该类别中有多少问题。\n+ 7. 点击课程“设置”版块中**题库**下的**问题**链接，以返回题库。要将问题移动到某个类别，你首先需要从**类别**下拉列表中选择包含该问题的类别。\n\
  + 8. 点击要移动的问题旁边的复选框以选中它。\n\n![](img/1529021fde33ef551603bbc71587313e_267_0.png)\n\
  \n\n\n\n**9.** 选中问题后，我们想将其移动到新类别。从**移动到**下拉列表中选择您想要将问题移动到的类别：\n\n![](img/1529021fde33ef551603bbc71587313e_268_0.png)\n\
  \n**10.** 按下**移动到 >>**按钮，将选中的问题（或问题组）移动到所选类别。\n\n## 刚才发生了什么？\n\n我们刚刚看到了如何管理题库中的问题。您可以使用类别来组织题库。但如何与其他课程共享类别呢？\n\
  \n默认情况下，教师只能看到自己课程题库中的问题。他们无法看到其他课程的题库，也无法在课程之间共享问题。如果您确实需要这样做，那么首先要与管理员沟通，请求他们提供课程外部共享的问题类别。更多信息请参阅本章末尾的*咨询管理员*部分。\n\
  \n以下是在我的 Moodle 站点上，Backyard Ballistics 课程在课程和课程类别结构中的位置：\n\n![](img/1529021fde33ef551603bbc71587313e_268_1.png)\n\
  \n以下是我的管理员进行更改之前，我可用的类别：\n\n![](img/1529021fde33ef551603bbc71587313e_268_2.png)\n\
  \n这是更改后的样子：\n\n![](img/1529021fde33ef551603bbc71587313e_269_0.png)\n\n您可以看到，我现在可以访问整个理学院的题目了。\n\
  \n现在，我们已经向题库添加了题目，接下来可以在课程中引入一个 Moodle 测验，并开始为学生设置在线测试。\n\n## 设置测试\n\n一旦题库中有了一个或两个题目，或者您能够访问同事编写的题目，那么设置测试就很简单了。具体方法如下：\n\
  \n## 动手实践——向课程添加测验\n\n- 1. 选择您要添加新测验的主题。确保已开启编辑模式，点击**添加活动…**并从列表中选择**测验**。\n- 2.\
  \ 为您的测验命名，如果需要，还可以编写简短的介绍。\n- 3. 如果您想要一个限时测验，请勾选**常规**框中的**时间限制**设置。如果您有兴趣设置限时测验，但不确定任何设置，请记住，如果需要额外帮助，可以点击带有问号的黄色圆圈。\n\
  - 4. 按下**编辑测验**按钮。\n- 5. 我们本可以研究很多设置。现在让我们开始操作，滚动到页面底部并按下**保存并显示**按钮。\n\n- 6. 现在您会看到一个分屏视图：左侧是（空的）测验，右上角是课程题库的链接。\n\
  \n- 7. 点击“题库内容”旁边的[显示]链接。题库将显示出来：\n\n![](img/1529021fde33ef551603bbc71587313e_270_0.png)\n\
  \n- 8. 从“选择类别”下拉列表中选择包含您想添加题目的类别。\n\n- 9. 通过勾选来选择您要添加到测验中的题目，然后点击“添加到测验”按钮：\n\n\
  ![](img/1529021fde33ef551603bbc71587313e_270_1.png)\n\n10. 您将看到该题目现在已包含在测验中，显示在页面左侧：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_271_0.png)\n\n11. 向测验添加题目后，您可以使用设置区块中“测验管理”下的“预览”链接进行预览。\n\
  \n12. 就这样，完成了！\n\n## 刚才发生了什么？\n\n我们刚刚看到，向课程添加测验并从课程题库中引入题目是多么简单。如果管理员允许您访问同事的题目，您也可以轻松地将他们的题目添加到自己的测验中。\n\
  \n如果您想查看测验结果，请点击导航区块中的“结果”链接。您将看到所有提交记录的列表。\n\n## 课件活动\n\n教师通常认为这个活动是某种课程规划工具。实际上，Moodle\
  \ 课件是一个用于创建“行动迷宫”的工具：它是探索场景和决策树、提出难题以及进行交互式案例研究的理想工具。\n\n可以把课件想象成一种基于文本的冒险游戏，或者类似于上世纪80、90年代流行的《选择你的冒险之旅》丛书：你发现自己身处某个情境，需要决定下一步做什么——你在一个黑暗的地牢里。你是走左边的门吗？你要捡起那把血迹斑斑的斧头吗？你要从睡着的巨魔那里拿走那袋金币吗？\n\
  \n## 提升你的教学\n\n这类场景通常出现在健康与安全培训中。想象一下，你看到一段视频：有人正在仓库里工作，她的同事把一个箱子撞到了她头上，把她打昏了。然后问你：这起事故谁负责——员工还是雇主？你的选择可能会引导你进入另一个视频，以及另一组决策或问题。作为用户，在探索场景时，我可以走多条路径之一，用Moodle的话说就是“分支”/“答案”。\n\
  \n## 构建 Moodle 课件\n\nMoodle 课件基本上由一系列网页组成。在每个页面底部，你可以设置按钮或一个问题。根据按下的按钮，或你对问题的回答，你会被带到另一个网页。\n\
  \n![](img/1529021fde33ef551603bbc71587313e_272_0.png)\n\n> 我们一直在学习如何运用图形和多媒体使内容对学生更具吸引力和趣味性。我们完全可以在\
  \ Moodle 课件的页面中运用这些技巧。\n\n## 为什么要包含课件\n\n课件在课堂上的成功应用方式有很多。以下是我遇到过的几个成功转换为 Moodle\
  \ 课件的课堂活动示例：\n\n- “猜猜是谁？”游戏。让学生从故事中的多个角色里选择一个。计算机提出一系列问题来确定那个角色是谁。\n- 探索场景。正如我们已描述的，课件是探索特定场景的理想方式：法律、科学、健康与安全等。\n\
  - 角色扮演。你是查理一世，个人统治时期已经开始。绅士们正在撰写小册子，反对你对坎特伯雷大主教的任命。你会：a) 屈服于他们的要求，更换大主教？b) 非常恼火，把他们的耳朵割掉？c)\
  \ 无视他们，因为你是掌权者，所以无所谓？（事实上，查理割了他们的耳朵）。\n- 医学诊断。给定一组症状，你能正确诊断疾病吗？作为医生，你能提出正确的问题吗？\n\
  - 虚拟游览。与你的学生一起创建战场或中世纪村庄的虚拟游览。全班共同创建 Moodle 课件可以分担制作所需的努力。\n\n## 用课件支持课堂教学\n\n除非你让全班同学帮忙（见前面提到的虚拟游览示例），否则一个有意义的课件活动可能需要花些时间来搭建。如果你花了一晚上精心构建一个详细的场景，然后看着学生几分钟就草草完成，确实会有点令人沮丧。\n\
  \n不过，可以考虑将课件作为集体活动，与全班一起探索想法。如果课堂上有投影仪或交互式白板，可以与学生们一起完成课件。这是确保不遗漏任何学习目标的比较简单的方法之一。\n\
  \n## 在课程中引入课件\n\n不要将课件仅仅视为教学工具。我相信你们对课件活动有很多好主意。对我来说，我需要我的学生在加入我的课程之前，先阅读一系列健康与安全通知，并同意某些“条款与条件”。在本节的剩余部分，我将把这些书面材料转换到\
  \ Moodle 中。\n\n## 配置课件\n\n我将首先向课程首页添加一个课件，并配置基本设置：\n\n### 动手实践——配置课件\n\n- 1. 返回课程首页，选择一个要添加课件的主题，点击**添加活动...**并从列表中选择**课件**。\n\
  - 2. 为你的新课件命名。\n- 3. 向下滚动，你会看到有很多可选选项。我现在不打算关注这些，而是直接向下滚动并按下**保存并返回课程**按钮。\n- 4.\
  \ 就这样。完成了！\n\n## 刚才发生了什么？\n\n我们刚刚配置了一个新课件（这相当简单，因为默认选项完全足以让我们入门）。但现在我有一个空的课件需要填充内容。\n\
  \n\n\n\n\n## 提升你的教学\n\n## 添加内容页 – 页面底部带按钮的网页\n\n我健康与安全通知的第一部分是三页，概述了我对学生的行为期望。让我们从一开始就把第一页转换过来。\n\
  \n## 行动时间 – 添加内容目录\n\n1. 从课程首页点击你新课程的名称（不要点击更新图标，因为这会带你回到课程配置页面）。Moodle 现在询问我下一步想做什么。五个选择是：\n\
  \   \n   - **导入问题：** 这是将问题导入课程，而不是导入课程题库。两者是分开的。\n   - **导入 PowerPoint：** 此时，教师会很兴奋。然而，导入\
  \ PowerPoint 演示文稿是一个繁琐的过程：将你的演示文稿转换为一组网页，将它们压缩成 ZIP 文件，上传到 Moodle，然后为你创建课程。随后，你会发现所有令人印象深刻的过渡和效果都丢失了。非常适合将简单的幻灯片集转换为\
  \ Moodle 课程，但并不那么高级。\n   - **添加内容页：** 另一个命名不当的选项。实际上是添加一个网页，底部带按钮，让你选择下一步去哪个页面。\n\
  \   - **添加集群：** Moodle 会从一组页面中随机选择——这是一种确保你的课程每次学生探索时都有趣且不同的好方法。\n   - **添加问题页：**\
  \ 这正是它所说的那样。你添加一个网页，并在底部配置一个问题。\n\n我的健康与安全通知目前是一个 Word 文档。它以介绍页开始，我在那里设定基调。现在让我们把它转换到\
  \ Moodle：\n\n2. 点击 **Add a content page**。\n\n3. 为你的新页面指定一个标题并撰写页面内容。我将从原始 Word\
  \ 文档中复制粘贴。我是通过 **Paste from Word** 按钮粘贴的。请记住，你可以轻松地在页面中包含图形和多媒体。\n\n4. 这就是底部带按钮的页面类型，我现在需要指定按钮。向下滚动页面，直到到达\
  \ **Content** 框列表（在 **Add a content page** 框下方）。在这里，我们指定页面底部想要哪些按钮。这里又有另一个略显误导的配置选项：如果你在\
  \ **Content 1** 框中指定 **Description**，这实际上就变成了页面底部第一个按钮上的文字。所以：\n\n![](img/1529021fde33ef551603bbc71587313e_275_0.png)\n\
  \n变成：\n\n![](img/1529021fde33ef551603bbc71587313e_275_1.png)\n\n5. 不用担心指定按钮跳转到哪个页面（“Jump”设置）。最好先添加所有页面，然后再将它们连接起来。\n\
  \n6. 当你指定了所需的所有按钮后，按页面底部的 **Add a content page** 按钮。\n\n7. 你的新内容页（即底部带按钮的网页）现在已添加到你的课程中。\n\
  \n## 提升你的教学\n\n## 刚才发生了什么？\n\n我刚刚添加了一个内容页——Moodle 所称的底部带按钮的网页。我将健康与安全通知的第一页转换到了\
  \ Moodle。要添加另一页，只需点击 **Add a page...** 下拉菜单并从列表中选择 **Add a content page**。转换了另外两页后，我的课程大纲如下：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_276_0.png)\n\n## 添加问题页\n\n我纸质文件中的最后一页是学生必须同意规则的地方。对于这一页，我将添加一个问题页。过程大同小异，现在就做吧。\n\
  \n## 行动时间 — 插入问题页\n\n1. 点击 **Add a page...**，这次在列表底部选择 **Question**。\n   \n2. 通过从下拉列表中选择来选择你想要添加的问题类型。我想添加一个\
  \ **True/false** 问题，所以：\n\n![](img/1529021fde33ef551603bbc71587313e_276_1.png)\n\
  \n3. 无论问题类型如何，我们都需要为页面指定一个标题并提供一些内容。\n\n4. 完成之后，我们需要配置页面底部出现的问题。对于我的 **True/False**\
  \ 问题，这意味着提供两组答案和响应。请注意，我给“同意”响应分配了 1 分。你大概能猜到这稍后会很重要：\n\n![](img/1529021fde33ef551603bbc71587313e_277_0.png)\n\
  \n5. 就这样。你可以看到可以根据问题的回答跳转到不同的页面，但同样，我现在还不想担心这个问题。所以现在就到此为止。按页面底部的 **Save page**\
  \ 按钮。\n\n## 刚才发生了什么？\n\n我刚刚向我的课程添加了一个简单的问题页，一个我要求学生确认他们同意遵守课堂规则的真/假问题。\n\n到目前为止，我忽略了将页面连接起来。让我们现在学习如何做到这一点。\n\
  \n## 整合 – 链接课程页面\n\n让我们返回课程编辑页面：\n\n![](img/1529021fde33ef551603bbc71587313e_278_0.png)\n\
  \n你可以在表格中看到我课程中包含的页面类型（**Page Type** 列）和它们链接到的页面（**Jumps** 列）。我希望我的课程安排如下：\n\n![](img/1529021fde33ef551603bbc71587313e_278_1.png)\n\
  \n一个基本的线性安排，你可以在课程页面之间双向移动。在《课堂规则》页按 **Next** 会带你到《奖励与后果》。但点击 **Previous** 会带你回到《介绍》。只有当你到达《学生协议》时，我才希望你最终对我的课程做出承诺（或不承诺）。现在让我们让这些按钮跳转。\n\
  \n## 行动时间 – 配置页面跳转\n\n1. 返回课程 **Edit** 选项卡。点击第一个页面的更新图标：\n\n![](img/1529021fde33ef551603bbc71587313e_279_0.png)\n\
  \n2. 向下滚动页面到 **Content** 框。我需要配置 **Next>** 按钮跳转到 **Class Rules** 页面。我点击 **Jump**\
  \ 下拉菜单并从列表中选择 **Class Rules**：\n\n![](img/1529021fde33ef551603bbc71587313e_279_1.png)\n\
  \n3. 向下滚动到页面底部并按 **Save page** 按钮。\n\n## 提升你的教学\n\n4. 课程已成功更新：\n\n![](img/1529021fde33ef551603bbc71587313e_280_0.png)\n\
  \n5. 我需要对 **Class Rules** 页面和 **Rewards and Consequences** 页面重复该过程。\n\n6. 我不需要最后的\
  \ **Student Agreement** 页面再跳转到任何地方。从 **Jump** 页面列表中选择 **End of lesson** 选项：\n\n\
  ![](img/1529021fde33ef551603bbc71587313e_280_1.png)\n\n7. 就这样。我的所有页面跳转现在都已完全配置：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_281_0.png)\n\n## 刚才发生了什么？\n\n我刚刚配置了所有页面跳转，让学生能够在新转换的学生协议中导航。这就是全部：我已完成将健康与安全协议转换到\
  \ Moodle，并准备让学生逐步完成并同意遵守规则（我希望如此）。\n\n> 如果你想测试你的课程是否配置正确，点击课程配置页面顶部的预览选项卡。\n\n但我如何知道学生是否已阅读这份文件并做出了最终协议？让我们接下来看看这一点。\n\
  \n## 监控学生通过课程的进度\n\n将我的纸质文件转换到 Moodle 意味着我可以非常轻松地检查学生是否同意了我制定的规则。从课程首页点击你课程的链接。点击报告选项卡。\n\
  \n你会看到课程尝试情况的细分。立刻，我就能看到学生是否同意遵守我的课程规则（他们在课程中得分为 100%）：\n\n![](img/1529021fde33ef551603bbc71587313e_282_0.png)\n\
  \n## 仔细规划你的 Moodle 课程\n\n关于课程的最后一点：我相信你能看出，一个好的 Moodle 课程始终是基于一个好的计划而开发的。始终先草拟你的课程，不要试图有机地开发课程。我见过很多人尝试过，最终失败，然后得出结论\
  \ Moodle 课程太复杂而无法用于在线教学。计划要周全，不要过度复杂化，并确保始终牢记课程学习目标。\n\n## 研讨会 – 同行评审和评估\n\n研讨会活动对\
  \ Moodle 来说并不新鲜——在 Moodle 2.x 之前的版本中它默认是禁用的。话虽如此，如果你熟悉之前版本的 Moodle 研讨会，那么你会注意到外观和感觉上有不少改进。让我们花点时间简要了解一下。\n\
  \n什么是研讨会？Moodle 研讨会是一种同行评审活动。例如，我可以让学生通过 Moodle 提交项目作业以供同行评审，并使用 Moodle 记录班级成员对彼此作业的评论和建议。如果我愿意，我可以上传一个范例，让班级仅对该范例发表评论。我可以上传项目评审员的评论，然后学生可以将自己的评审与这些评论进行比较。正如你所能推断的，这是一个非常强大的工具。\n\
  \n正如我们很快会看到的，Moodle 研讨会活动支持三种评审类型：\n\n- ♦ 评审上传的范例：学生可以评审范例并将其评审与参考评审（例如评审员的评论）进行比较\n\
  \n\n\n\n\n## 提升你的教学\n\n- **同伴互评：** 学生互相评审彼此的作业。请注意，学生既可以根据其评审的质量获得评分，也会为其提交的作业获得评分\n\
  - **自我评估：** 用户可以评审自己的作业，并根据该评审的质量获得评分\n\n> 请注意，这些类型的评审并非互斥。你可以启用这些选项的组合（或全部）。\n\n\
  我非常喜欢学生互相评论彼此作业的做法。这目前还不是教学大纲的一部分，但同伴互评正成为我教学中的重要组成部分——迄今为止，我一直通过论坛来支持这一做法。\n\n\
  ### 行动时间 – 添加工作坊\n\n1. 确保已开启编辑，并在课程的相关部分中，点击 **添加活动...** 下拉菜单并从列表中选择 **工作坊**。\n\
  2. 为活动命名，并在需要时提供介绍：\n\n   ![](img/1529021fde33ef551603bbc71587313e_283_0.png)\n\n\
  3. 在 **工作坊设置** 框中，你可以启用相关的同伴互评功能。我希望我的学生互相评审彼此的作业，因此我只会勾选 **学生可以评估他人的作业** 选项：\n\n\
  \   ![](img/1529021fde33ef551603bbc71587313e_284_0.png)\n\n4. 我现在需要配置提交和评估选项。这就是我指定在学生上传作业供评审时以及他们进行评审时所给出的说明的地方：\n\
  \n   ![](img/1529021fde33ef551603bbc71587313e_284_1.png)\n\n5. 滚动到页面底部并按下 **保存并显示**\
  \ 按钮。**项目计划评审**（这就是我给它的名字）工作坊规划器将被显示：\n\n### 发生了什么？\n\n我们刚刚为同伴互评配置了一个 Moodle 工作坊。我忽略了相当多的设置，但它们都很容易理解，例如成绩设置——你可以在其中指定评审质量所获分数与上传作业所获分数之间的分配——以及访问控制选项——我们在其中配置可以上传作业的时间窗口、评审必须进行的时间等。\n\
  \n现在工作坊规划器已显示在屏幕上，你可以看到我已完成的任务以及仍需完成的任务。例如，我尚未完成设置阶段，因为我需要编辑评估表：\n\n![](img/1529021fde33ef551603bbc71587313e_285_0.png)\n\
  \n![](img/1529021fde33ef551603bbc71587313e_285_1.png)\n\n**编辑评估表** 这一文字是一个链接。点击该链接。现在我可以创建一个学生在评审彼此作业时填写的表单。创建后，可以预览此页面：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_286_0.png)\n\n当你返回工作坊规划器页面时，你会发现编辑提交表单任务现在已被勾选：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_287_0.png)\n\n这意味着设置阶段现已完成。\n\n现在我们准备进入提交阶段。我们需要在提交阶段列顶部的阶段切换图标上点击：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_287_1.png)\n\n我们会被警告即将进入下一阶段——这正是我们想要的，因此点击继续按钮。你将被返回到工作坊规划器页面，其中提交阶段列现在已被高亮显示：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_288_0.png)\n\n工作坊规划器不仅允许我们从一个阶段移动到另一个阶段，规划器对于快速查看哪些步骤已完成、哪些尚未完成也非常有用。例如，一旦学生开始上传作业，我就可以分配提交作业。这就是学生在上传提交作业时所看到的内容：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_288_1.png)\n\n一旦作业已上传，我就可以将其分发以供评审。你需要在工作坊规划器中点击分配提交作业链接：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_289_0.png)\n\n**提交说明**\n\n在此处上传你的产品评审。确保它是最新版本的文档\n\
  \n**所有提交**\n\nJill Brown 的项目背景\n于 2011 年 6 月 22 日星期三，上午 11:34 提交\n\nJohn Smith 对推进方法的我的评审\n\
  于 2011 年 6 月 22 日星期三，上午 11:32 提交\n\n作业分配可以是手动的也可以是随机的。你只需点击相关标签即可。\n\n学生如何评审一份提交作业？他们需要点击\
  \ **工作坊活动** 的链接，然后他们将被呈现评估页面，其中包含他们需要评估的提交作业列表：\n\n![](img/1529021fde33ef551603bbc71587313e_291_0.png)\n\
  \n按下 **评估** 按钮后，他们就可以使用在设置阶段指定的标准（“方面”）进行评估。\n\n一旦评估完成，我们就可以进入成绩评估阶段（请记住，你需要在工作坊规划器中点击\
  \ **成绩评估阶段** 列顶部的阶段切换图标）：\n\n![](img/1529021fde33ef551603bbc71587313e_292_0.png)\n\
  \n在 **已给出的成绩** 列中，我可以研究每个学生所给出的评审（可以说是评审的评审），如果我认为它们具有可比性和公平性，我可以点击 **重新计算成绩** 按钮来完成评分过程：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_293_0.png)\n\n最后一步——表明工作坊已完成——是在规划器中点击已关闭列标题下方的阶段切换图标。\n\
  \n> 你可以通过点击工作坊规划器中的相关阶段切换图标随时在各个阶段之间切换（包括切换回之前的阶段）。\n\n本节仅对这一功能强大的教学工具进行了最简要的概述。有关\
  \ Moodle 工作坊活动的更多信息，请参阅 Moodle 文档中的 `http://docs.moodle.org/20/en/Workshop_module`。\n\
  \n## Wiki\n\n我在第 3 章《添加文档和讲义》中首次向你展示了 Moodle Wiki，当时我们看到你可以将部门文档转换为 Moodle。Wiki\
  \ 是夏威夷语中“快速”的意思。人们经常听到 Wiki 这个词就认为 Wiki 必须是在线百科全书（对于这一点，维基百科要负很大责任）。但事实并非如此。Wiki\
  \ 的设计目的是：\n\n- 允许用户协作地在网页上工作，以及\n- 快速创建网页（因此得名）\n\n如果你要与其他人协作一个网页，那么必须有某种审计跟踪，以便你可以知道谁在何时做了什么更改。这不是问题：这样一个系统已经内置于\
  \ Moodle 的 Wiki 系统中。为了让你能够快速创建网页，Moodle 的 Wiki 系统为你提供了一种内置的格式语言。但不要因此而却步。正如本节所示，格式非常简单。\n\
  \n### 我的 Wiki 选项有哪些\n\n即使 Moodle 内置了单一的 Wiki 系统，你也可以以两种不同的方式使用它：\n\n1. 协作 Wiki。你只有一个\
  \ Wiki，所有人（教师和学生）一起在上面工作。\n2. 个人 Wiki。每个学生都有自己的 Wiki，只有他们自己和教师可以查看和编辑。学生既不能查看也不能编辑彼此的\
  \ Wiki。\n\n### Wiki 可以用来做什么\n\n以下是 Wiki 在课程中使用的几个示例：\n\n- 使用协作 Wiki 进行协作项目计划和项目撰写。\n\
  - 使用个人 Wiki 进行学生日记。\n- 项目撰写，可使用协作或个人 Wiki。\n- 网页链接列表。与其维护一个文本文档（每次更改都需要重新上传），不如将你的网页链接列表保存在\
  \ Wiki 中。\n- 小说中的人物，由班级学生开发的群组 Wiki。\n\n\n\n\n\n就管理维基而言，除了确保内容合适并且学生不会开始创建愚蠢的条目外，我们唯一需要注意的问题就是可能出现两名学生试图编辑同一篇维基页面而产生的拉锯战。可能会发生一名学生做出另一名学生不喜欢的更改，然后他们反复互相修改对方的工作，反复来回。这听起来很奇怪，但这种情况经常发生。\n\
  \n在我的课程中，到了最终的实践作业时，我班上的所有学生都必须在两周内完成他们的项目，并且在完成过程中需要填写一份学生记录。处理这些文书工作很尴尬：不幸的是，学生经常会弄丢它，而且如果他们没有弄丢，那么等到交上来时，记录表看起来就像被野狗撕咬过一样。我将使用一个学生维基将我课程的这一部分转换为\
  \ Moodle。让我们在这一节的剩余部分学习如何操作。\n\n## 添加维基\n\n第一个任务是向我们的课程中添加一个维基。因为我希望我的每个学生都有自己的维基（每个人都有自己的记录卡），所以我也知道这将是一个个人维基：\n\
  \n## 动手时间 – 添加维基\n\n- 1. 选择你想要添加新维基的主题，点击 **Add an activity...** 并从列表中选择 **Wiki**。\n\
  - 2. 我新维基的名称将是 \"Student Diary\"。输入你的维基名称。\n- 3. 写下维基的简要摘要。这会显示在每页上方。尽量保持简短且描述性。\n\
  - 4. 我将点击 **Type** 选项并从列表中选择 **Individual**。选择最适合你需求的维基类型。\n- 5. 滚动到页面底部并按下 Save\
  \ and return to course 按钮。你会在课程首页看到你的新维基：\n\n![](img/1529021fde33ef551603bbc71587313e_296_0.png)\n\
  \n## 刚才发生了什么？\n\n我现在有一个新的维基。如果我点击课程首页上的维基链接，我会看到一个创建新空白页面并为其命名的选项：\n\n![](img/1529021fde33ef551603bbc71587313e_296_1.png)\n\
  \n我将我的新页面命名为 \"Student Diary Introduction\"（而不是 \"First page name\"），将格式保留为默认的 HTML\
  \ 格式，然后按下 Create page 按钮。\n\n那么你如何开始编辑维基呢？\n\n## 编辑维基页面\n\n我们看到的页面基本上是维基的第一页。所有页面都将从这个“首页”链接。因此，有时最好将此初始页面视为目录页，并可能按此方式结构化。如何编辑它？只需像平常一样使用编辑器输入你想要的文本即可。\n\
  \n> 请记住，因为我们使用的是 Moodle 编辑器来编辑维基页面，所以你可以通过在本书中学习过程中获得的技能和经验，让维基页面变得引人入胜且有趣。\n\n\
  ## 创建新页面\n\n创建新的维基页面很容易——如果你知道方法的话。你是否有一段想要变成新页面链接的文本？只需用双方括号 [[ ]] 包围该词或文本，如下所示：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_297_0.png)\n\n然后，点击编辑器正下方的 **Save** 按钮：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_298_0.png)\n\n你可以看到我用方括号包围的短语现在被高亮显示了。这个高亮实际上是一个链接（将鼠标指针悬停在上面即可看到我的意思）。现在点击该链接。你会看到一个新页面即将创建。按下\
  \ **Create page** 按钮，你就可以开始向其中添加新内容了：\n\n![](img/1529021fde33ef551603bbc71587313e_298_1.png)\n\
  \n这就是创建新维基页面的简单方法。\n\n## 查看页面的历史记录\n\n如果维基页面很容易更改，并且我们足够勇敢让学生开始编辑它们，那么我们肯定想知道谁在更改它们以及何时更改。幸运的是，在\
  \ Moodle 维基系统中这不是问题：只需点击页面顶部的 History 选项卡即可查看完整的审计跟踪。\n\n在历史页面中，你可以：\n\n- 一目了然地看到谁在更改页面——以及他们何时进行更改\n\
  - 比较不同版本的页面（以查看发生了什么更改）\n- 回滚到特定版本\n\n我们已经了解到使用维基是多么容易，这很棒，但我仍然需要将我的学生记录表转换为 Moodle，为此我需要指定一个模板，让我的学生可以使用\
  \ Moodle 维基填写。我手头有原始文档的 Word 格式，所以现在让我们将其转换为 Moodle 维基模板。\n\n## Have a go hero –\
  \ 维基不仅仅是教学\n\n请参阅第 3 章 Adding Document and Handouts，了解另一个维基创意。在该章节的结尾，我们看到了如何将部门文档转换为\
  \ Moodle 维基。通过这样做，不仅在线上使文档更容易供员工使用，作为维基也更容易修改文档。而且当你修改文档时，每页都有自己的审计跟踪，因此你可以轻松看到谁修改了文档以及何时修改。\n\
  \n## 术语表活动\n\n我有一份与弹道学相关的术语表，我目前作为欢迎包的一部分提供给学生。这基本上是我多年前用 Microsoft Word 编写的、发给学生的纸张。幸运的是，我可以轻松将其转换为\
  \ Moodle。将术语表转换为 Moodle 的好处在于：\n\n- 术语表条目可以远不止文本：你可以使用在本书中学习过程中获得的技能和经验来包含图形和嵌入多媒体。\n\
  - 学生可以向术语表添加条目。通过转换为 Moodle，我可以让创建和完善我的术语表成为一项班级活动。Moodle 通过允许我对术语表条目进行评分来进一步支持这一点。\n\
  - Moodle 可以配置为，只要我的课程中出现术语表中包含的任何单词或短语，该文本就会被高亮显示，我可以点击它，术语表条目就会显示出来。这称为术语表自动链接，我们将在本节后面查看如何设置它。\n\
  - 术语表可以导入和导出，这意味着它们易于与同事共享和开发。\n\n术语表不一定只是课程相关技术术语的词典。以下是一些良好的 Moodle 术语表使用示例：\n\
  \n- 语言词典。例如，使用自动链接来高亮英语中的单词和短语，并用西班牙语翻译填充术语表。术语表条目可以包含该词翻译的嵌入式音频文件，然后可能跟上包含该词的上下文句子。\n\
  - 收藏网站术语表。另一种替代上传的 Word 文档或维基的方法是建立一个网站链接术语表。\n- 测验问题。让你的学生添加包含他们编写的测验问题的术语表条目。这里的巧妙之处在于：你可以导出术语表，然后通过对导出的文件进行少量调整，将问题重新导入你的测验题库。\n\
  - 术语表解释学生在撰写作业时需要理解的术语的含义——例如，在撰写报告的上下文中，“interpret” 或 “demonstrate your understanding”\
  \ 的含义。\n\n让我们现在就开始将我的术语表转换为 Moodle。\n\n## 添加术语表\n\n添加术语表很容易。配置稍微微妙一些，但我会在过程中解释一切。我先提一下，你可以在课程中包含两种类型的术语表：\n\
  \n- **Main glossary**：每个课程只允许一个，学生不允许编辑它，只有教师可以编辑。\n- **Secondary glossary**：你可以拥有任意多个，任何人都可以编辑它们。\n\
  \n为什么要有二级和主术语表？这样学生就可以向二级术语表添加内容，然后教师可以从中挑选最佳条目并将其包含在主术语表中。你不必以这种方式使用术语表：如果只想要一个基本术语表，那就坚持使用二级术语表。\n\
  \n解释完这些后，让我们现在在课程中添加一个二级术语表——一个任何人都可以编辑的术语表。\n\n\n\n\n\n## 操作时间 – 包含术语表\n\n1. 确保已开启编辑功能，选择要添加术语表的话题，点击“**添加活动...**”，然后从列表中选择“**术语表**”。\n\
  \n2. 你需要为术语表命名并描述其用途。我的术语表收录与弹道学相关的术语，帮助你在学习本课程时参考。在描述中，我还会提到所有人都可以向此术语表添加内容。\n\n\
  3. 其余术语表配置设置可以保留默认值，但如果你想尝试修改，请记住你不会破坏任何东西。对设置满意后，点击“**保存并显示**”按钮。你的新术语表现在就可以添加词条了：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_301_0.png)\n\n### 刚才发生了什么？\n\n我们刚刚为课程添加了一个术语表——这是一个次级术语表，所有人都可以向其中添加词条，我还进行了配置，使所有人都可以对词条进行评分。\n\
  \n如何向术语表中添加词条？\n\n## 操作时间 – 添加术语表词条\n\n1. 点击“**添加新词条**”按钮。\n\n2. 概念（Concept）是你想要解释的单词或短语。\n\
  \n3. 使用“**定义框**”给出你的解释。记住，你可以运用目前已学到的技能，将一个简单的术语表词条变成真正的多媒体体验。\n\n4. 你是否希望这个特定词条自动链接，以便学生在课程中任何地方看到它时都可以点击并显示你的解释？如果是，请确保勾选“**此词条应自动链接**”。\n\
  \n5. 准备就绪后，滚动到页面底部，点击“**保存更改**”按钮。现在你的术语表中已经添加了一个新词条：\n\n![](img/1529021fde33ef551603bbc71587313e_302_0.png)\n\
  \n### 刚才发生了什么？\n\n我们刚刚看到向术语表添加词条是多么容易。尽量保持术语表词条简明扼要。如果你的术语表词条开始变得复杂，超过几句话、一两张图片，或许还有一些嵌入式多媒体内容，那么建议改用\
  \ wiki。\n\n## 术语表自动链接\n\n当你添加第一个术语表词条时，是否为该词条启用了自动链接？如果一切正常，那么每当概念（代表术语表词条的单词或短语）出现在课程中时，它就会（默认）以浅灰色背景高亮显示：\n\
  \n> 当球飞向空中时，动能（KE）转化为重力势能（GPE）。当所有动能都转化为重力势能时，球在半空中短暂停留。\n\n点击高亮文本，术语表词条将显示在弹出窗口中。\n\
  \n但在某些情况下，自动链接无法正常工作：\n\n- 管理员尚未为你的站点启用术语表自动链接。如果遇到这种情况，请查看本章末尾的“*询问管理员*”部分。\n-\
  \ 自动链接不适用于外部网站上的文本以及上传文档中的文本。Moodle 并不了解这些文档内部的实际内容，因此无法将你的术语表与之链接。\n\n## 术语表版块\n\
  \n如果你返回课程首页，并在开启编辑功能后，可以向课程首页添加一个新的“**随机术语表词条版块**”。该版块顾名思义，会从你指定的术语表中随机选择一个词条并显示出来。如果你的术语表包含励志名言、班级正在阅读的书中人物传记或图文词汇表，那么随机术语表词条版块会是一个有趣且富有吸引力的工具。\n\
  \n## 动手实践 – 允许学生评分词条\n\n由于学生正在向此术语表添加词条，我打算允许他们对所有词条进行评分（我需要保持警惕，确保没有偏袒或特殊交易），最高“评分”为5分。\n\
  \n在“**设置**”版块的“**术语表管理**”下，点击“**编辑设置**”。在“**评分**”框中，选择一种聚合类型，然后确保“**量表**”为5分制。\n\
  \n要允许学生对词条评分，请点击“设置”版块中的“权限”，向下滚动到“评分词条”能力（列在“活动：术语表”下），然后点击“允许”图标：\n\n![](img/1529021fde33ef551603bbc71587313e_304_0.png)\n\
  \n在下一页中，确保在“选择角色”下拉菜单中选择“学生”，然后点击“允许”按钮。\n\n## 投票\n\n一个简单、强大但经常被忽视的活动：投票活动。\n\n\
  我经常在课堂上使用民意测验来激发思考。例如：如果我在太空中点燃一支蜡烛，火焰会是什么形状？然后我在交互式白板上显示一系列选项。对每个选项进行投票，并花时间讨论每个答案。\n\
  \n将这样一个简单的活动转换到 Moodle 有什么好处？以下仅列举几点：\n\n- 更容易记录哪个学生做出了哪个选择：民意测验中的投票可以是匿名的，也可以是记名的。\n\
  - 选项可以更新，允许学生在获得一点时间思考答案后改变主意。\n- 很容易看出哪些学生完全没有回答这个问题。\n\n那么我该如何将我的蜡烛问题转换到 Moodle\
  \ 中呢？\n\n## 操作时间 – 添加投票活动\n\n1. 开启编辑功能后，选择一个话题，然后点击“添加活动...”并从列表中选择“投票”。\n\n2. 给新活动命名。\n\
  \n3. 在“投票文本”框中输入问题。\n\n4. 使用“**选项**”框指定你希望学生选择的可能答案。\n\n5. 在“**杂项设置**”框中，你可以配置结果的显示方式、是否向学生显示结果，以及——如果向学生显示——是否匿名显示结果：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_305_0.png)\n\n6. 完成后，点击页面底部的“**保存更改**”按钮。\n\
  \n### 刚才发生了什么？\n\n我们刚刚通过投票活动向课程中添加了一个民意测验。我使用民意测验来激发思考。点击“**页面右上角的链接**”：\n\n![](img/1529021fde33ef551603bbc71587313e_305_1.png)\n\
  \n## 学习旅程\n\n一门 Moodle 课程以指向其他资源的链接列表开头完全没问题，例如上传到 Moodle 的资源或互联网上已有的资源——事实上，我们这本书就是这样开始的。当我们想要加入测验、论坛或同伴互评工作坊时，就变得更为关键的是，我们要注意让学生形成一种更正式的“学习旅程”，而不是让学生随意从知识池中舀取自己喜欢的东西。我们如何知道学生已经查看了某个资源或尝试了某项活动？这就是完成跟踪功能的目的。我们如何引导学习者踏上他们的学习旅程？这就是条件活动的目的。完成跟踪和条件活动将在接下来的两个部分中描述。\n\
  \n## 完成跟踪\n\n完成跟踪包含两个部分：\n\n1. 完成一个资源或活动\n2. 完成课程\n\n让我们配置 Moodle 课程，使学生在认为自己已准备好继续学习下一个资源或活动时，可以将其标记为“已完成”。\n\
  \n> 在撰写本文时，完成跟踪功能默认是禁用的。你需要请求 Moodle 管理员为你启用此功能。请参阅本章末尾的“*询问管理员*”部分。\n\n返回你的 Moodle\
  \ 课程主页，在“**设置**”版块的“**课程管理**”下，点击“**编辑设置**”。向下滚动到“学生进度”部分。点击“**完成跟踪**”下拉菜单，从列表中选择“**启用，通过完成和活动设置控制**”：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_306_0.png)\n\n\n\n\n\n## 提升你的教学\n\n我不会在我的课程中强制执行课程（而非活动——我们稍后会讲到）完成跟踪，简单来说；我的课程不是那种类型的课程。然而，确实有一些很好的例子说明你希望默认启用课程完成跟踪：其中一个就是工作场所学习（而非学校）中的任何\
  \ Moodle 课程。想象一下我的课程是关于手动搬运的——所有新员工都必须参加并通过的强制性课程……如果我们的学生已完成每个活动并通过完成跟踪功能表明他们已阅读并消化了每个静态资源，那么这就成为他们员工记录的重要组成部分。\n\
  \n滚动到《编辑课程设置》页面的底部并按下“保存更改”按钮。\n\n在“设置”区块下，在“课程管理”中新增了一个链接：完成跟踪。现在点击它以显示《编辑课程完成设置》页面。\n\
  \n因为我不会从学生注册的那一刻起就强制他们使用完成跟踪功能，所以我将启用“手动自完成”功能：\n\n![](img/1529021fde33ef551603bbc71587313e_307_0.png)\n\
  \n就此页面的内容到此为止。有关此页面上众多其他设置的更多信息，请记得查看 Moodle 文档 http://docs.moodle.org/20/en/course/completion。我将滚动到页面底部并按下“保存更改”按钮。\n\
  \n最后一步是在课程页面上添加“自完成”区块，因为如果没有它，课程完成跟踪就无法按我想要的方式完全启用。确保已打开编辑模式，然后从“添加一个区块”中从下拉列表中选择“自完成”：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_307_1.png)\n\n添加后，我将把“完成跟踪”区块移动到页面的左侧，位于“导航”区块正下方：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_308_0.png)\n\n这样学生就可以在 Moodle 中声明他们认为已完成课程。我们将在本章后面再次回到这个区块。但关于单个活动呢？这需要在每个活动的基础上进行配置。例如，我如何允许学生标记他们已阅读《能源来源》讲义？\n\
  \n### 动手时间 – 在活动上启用完成跟踪\n\n1. 打开编辑模式后，点击《能源来源》链接旁边的“更新”图标。\n2. 现在我们已在课程上启用了完成跟踪，可以滚动到\
  \ **活动完成** 部分：\n\n   ![](img/1529021fde33ef551603bbc71587313e_308_1.png)\n\n3. 从“完成跟踪”下拉菜单中，我将选择\
  \ **学生可以手动将活动标记为已完成**：\n\n   ![](img/1529021fde33ef551603bbc71587313e_309_0.png)\n\
  \n4. 滚动到页面底部并按下“保存并返回课程”按钮。\n\n5. 就这样！我们完成了。\n\n### 刚才发生了什么？\n\n现在我们已返回课程页面，将光标移至《能源来源》资源右侧，你会看到一个小灰色复选标记：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_309_1.png)\n\n这就是从学生角度来看的完成跟踪。例如，一旦他认为已阅读，John\
  \ Smith 就可以点击复选框：\n\n![](img/1529021fde33ef551603bbc71587313e_309_2.png)\n\n我可以通过课程报告跟踪哪些学生已表明他们已阅读《能源来源》讲义。在“导航”区块下，在“我的课程”中，点击你的课程的简称并选择“报告”。然后，点击“活动完成”：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_310_0.png)\n\n你会看到已注册学生的列表以及谁完成了哪个活动的指示：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_310_1.png)\n\n查看活动完成报告下载选项（见上一个截图）。如果需要更详细地分析活动完成数据，例如在\
  \ Excel 中，这些选项非常有用。\n\n### 自动活动完成\n\n在我的课程中，我很乐意让学生自行表明他们已完成一个活动。我所在的学生群体动态是这样的，很快就会很明显有人没有做作业（主要是因为人数少）。那\
  \ Moodle 能否自动将活动标记为已完成呢？Moodle 可以自动将活动标记为已完成，但显然，你所定义的“完成”取决于活动。例如，对于我的《能源来源》讲义，Moodle\
  \ 可以在学生查看过讲义时将活动记录为已完成：\n\n![](img/1529021fde33ef551603bbc71587313e_311_0.png)\n\
  \n然而，对于论坛活动，我们可以指定学生必须发帖的数量才能“完成”任务。我们还可以区分发起新讨论和回复其他帖子：\n\n![](img/1529021fde33ef551603bbc71587313e_311_1.png)\n\
  \n请注意，我们还可以指定完成截止日期，以真正让学生保持警惕。\n\n与其尝试描述 Moodle 中所有可用资源和活动的大量不同完成选项，我将引导你查阅 Moodle\
  \ 文档 http://docs.moodle.org/20/en/Teacher_documentation。\n\n### 更多关于课程完成的信息\n\n\
  我已将课程配置为学生可以通过在 **自完成** 区块中点击 **完成课程** 来表明他们认为已完成课程：\n\n![](img/1529021fde33ef551603bbc71587313e_312_0.png)\n\
  \n点击该链接允许学生指定他们是否已完成课程（显示两个按钮，“是”和“否”）。但现在我开始在课程中的单个任务上配置活动完成（例如，阅读《能源来源》讲义和在论坛发帖），现在我可以根据需要配置自动课程完成。在\
  \ **设置** 区块下，在 **课程管理** 中，点击 **完成跟踪**。滚动到 **已完成的活动**，你将看到已启用活动完成的任务列表：\n\n![](img/1529021fde33ef551603bbc71587313e_312_1.png)\n\
  \n请注意，如果你在课程页面上保留“自完成”区块，学生仍可以记录他们已完成课程。\n\n### 条件活动\n\n当然，有指导的学习不仅仅是我们坚持要求学习者在尝试活动之前必须理解一个概念（例如，如果你不理解变化率，就没有必要学习微积分）。与我们在课堂上引导学生去做他们可能感兴趣的其他活动——或丰富他们当前理解的方式一样，我们也可以在\
  \ Moodle 中做到这一点。此外，不要一定把条件活动看作是课程活动的替代品。课程主要用于探索场景。条件活动是用于学习之旅。\n\n那么，我们如何配置一个活动的访问以取决于完成另一个活动呢？首先，你必须确保你的\
  \ Moodle 已启用条件活动。查看本章末尾的“询问管理员”部分。假设我想确保学生在获得《从枪中发射子弹》链接的访问权限之前已阅读《能源来源》讲义：\n\n\
  ![](img/1529021fde33ef551603bbc71587313e_313_0.png)\n\n我们可以基于成绩、日期或完成情况来控制对任务的访问。我希望确保《能源来源》讲义至少已被点击查看，因此我将基于学生已查看《能源来源》的情况来配置对《从枪中发射子弹》的访问。请注意，我需要在《能源来源》讲义上启用活动完成，才能执行下一步动手时间中概述的步骤。\n\
  \n### 动手时间 – 配置条件活动\n\n1. 打开编辑模式后，点击《从枪中发射子弹》资源旁边的“更新”图标。\n\n\n\n\n\n2. 向下滚动到**限制访问**部分（请注意，仅当您的\
  \ Moodle 中开启了条件活动功能时，此部分才可用）：\n\n![](img/1529021fde33ef551603bbc71587313e_314_0.png)\n\
  \n3. 从**活动完成条件**下拉菜单中，我将选择“能源来源”，其状态为“必须标记为完成”：\n\n![](img/1529021fde33ef551603bbc71587313e_314_1.png)\n\
  \n4. 滚动到页面底部，然后按**保存并返回课程**按钮。\n\n5. 我们可以看到，对“从枪中发射子弹”资源的访问现在已受到限制：\n\n![](img/1529021fde33ef551603bbc71587313e_315_0.png)\n\
  \n## 刚刚发生了什么？\n\n我刚刚将某个资源的访问权限配置为以查看另一个资源为条件。可以想象，配置条件活动的方式有无数种，所以我认为最好向您展示最简单的访问控制方式——也就是说，如果不尝试\
  \ B，就不能执行 A。\n\n请注意，您可以配置多个条件——这意味着如果不尝试 X、Y 和 Z，就不能访问 A；或者 A 的成绩条件必须高于某个水平，并且您已尝试访问\
  \ B。\n\n与所有旅程一样，建议您在开始在 Moodle 中配置学生的学习旅程之前，先规划好它。\n\n## 动手实践英雄——仅在学习者同意规则后才允许访问资源和活动\n\
  \n阻止学习者访问资源和活动，直到他们同意班级规则，这是合理的。请尝试配置您的课程以实施这一限制。\n\n## 询问管理员\n\n在本节中，您将找到相关指导，了解在需要允许教师访问其\
  \ Moodle 课程之外题库中的问题、开启对词汇表自动链接的支持，以及启用完成跟踪和/或条件活动以呈现您的 Moodle 课程时，应向管理员询问什么。\n\n\
  ## 允许教师访问其课程之外的问题\n\n您的管理员需要在课程类别级别授予您教师角色。您的管理员需要：\n\n+   1. 返回设置区块，在**站点管理**下点击**用户\
  \ | 权限 | 定义角色**。\n+   2. 按**添加新角色**按钮。\n+   3. 创建一个名为**共享问题用户**的新角色，该角色可在类别上下文中分配：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_316_0.png)\n\n+   4. 向下滚动能力列表并允许：\n+\
  \       - moodle/question:add\n+       - moodle/question:useall\n+       - moodle/question:usemine\n\
  +       - moodle/question:editall\n+       - moodle/question:editmine\n+       -\
  \ moodle/question:viewall\n+       - moodle/question:viewmine\n+       - moodle/question:moveall\n\
  +       - moodle/question:movemine\n+       - moodle/question:managecategory\n\n\
  ## 总结\n\n在本章中，我们学到了很多关于使用一些更高级的 Moodle 模块来增强教学的知识。\n\n具体来说，我们涵盖了：\n\n+   - 如何使用测验活动将测试转换为\
  \ Moodle 测验。我们了解到每门课程都有自己的题库，并且在课程中包含测验涉及将问题添加到题库，然后将题库中的问题添加到测验中。这样我们可以轻松复用问题——也可以轻松地与同事共享问题。\n\
  +   - 如何使用课程活动将角色扮演游戏、难题和情景转换为 Moodle。课程设置可能需要一些时间，因此通常最好使用它们来支持课堂教学。\n+   - 允许学生使用\
  \ wiki 活动在线协作完成项目工作。我们看到了 wiki 系统如何使创建新页面变得快速而简单。我们还了解到您可以指定模板：如果学生需要填写表格并且您想提供指南，这会很有用。\n\
  +   - 使用词汇表活动设置在线多媒体词典。我们看到，我不仅可以将弹道学术语讲义转换为更有吸引力的内容，学生还可以在 Moodle 词汇表上共同协作，使我能够将其转变为一项教学活动。\n\
  +   - 如何使用选择活动将民意调查转换为 Moodle。通过转换为 Moodle，我可以更好地监控哪些学生积极参与课堂，以及哪些学生可能需要更多鼓励。\n\n\
  在此过程中，我们讨论了如何使用新磨练的技能使在线内容具有吸引力和趣味性——尤其是在配置本章中我们一直在学习的活动时。\n\n既然我们已经了解了 Moodle 的更高级活动，我们就可以开始将它们整合起来——这是下一章的主题。\n"
- "## 9 整合起来\n\n# \n\n*想想我们在前几章中一起涵盖的所有内容。*\n\n*我们从第 2 章“设置课程”开始，学习如何配置 Moodle 课程以及如何为我们的教学材料做好准备。*\n\
  \n*在第 3 章“添加文档和讲义”中，我们开始了将教学材料转换为 Moodle 的过程，并了解到通过这样做，我们不仅可以更轻松地存储和管理这些材料，还看到了从课程首页向学生分发资源是多么容易。*\n\
  \n*在学习了如何在 Moodle 中分发作业之后，我们在附赠章节“通过 Moodle 提交作业”中了解了如何让学生通过 Moodle 轻松提交作业，这个主题我们在第\
  \ 6 章“管理学生作业”中详细回归。*\n\n*在第 4 章“声音与视觉——包含多媒体内容”和第 5 章“Moodle 改造”中，我们看到了如何使用图形、视频和音频使我们的\
  \ Moodle 课程更具吸引力和趣味性。*\n\n*我们不仅可以将资源转换为 Moodle，还在第 6 章“管理学生作业”中了解到我们也可以在线管理学生作业。*\n\
  \n*我们还可以使用论坛和聊天将课堂讨论转换为 Moodle，并在第 7 章“在线交流”中探讨了这样做的一些好处。*\n\n在上一章中，我们只看了 Moodle\
  \ 提供的众多活动模块中的五个。我们将它们视为增强在线教学的好方法：\n\n+   - 测验\n+   - 用于探索情景的 Moodle 课程\n+   - 用于同行评审的工作坊\n\
  +   - 用于协作工作的 Wiki\n+   - 词汇表\n+   - 选择\n\n在本章中，我们将把所有这些整合起来，并研究构建已转换为 Moodle 的课程的可能方式。\n\
  \n在本章中，我们将回答一个关键问题：我接下来该往哪里去？我们将关注：\n\n+   - 构建在线课程以支持面对面教学（所谓的“混合学习”）\n+   - 将小组工作转换为\
  \ Moodle，如何在线管理小组\n+   - 如何检查学生进度\n+   - 确保我们不会丢失所有辛勤工作\n+   - 如何备份和恢复课程。\n\n有很多内容要涵盖，所以让我们先看看如何使用\
  \ Moodle 支持面对面学习。\n\n## 使用 Moodle 进行混合学习\n\n混合学习是指您使用在线资源和活动来支持面对面教学。在本节中，我们将学习如何使用到目前为止所学的技能和技术来实现这一点。\n\
  \n## 为什么采用混合学习\n\n在这本书中，我们一直在一起合作，因为我一直在将我的“后院弹道学”课程转换为 Moodle。我另一个与学生一起开设的课程是为期两周的喷气发动机项目，最终以我们建造可工作的脉冲喷气发动机并维护/开发台式涡轮喷气发动机而告终。\n\
  \n我可能希望如何用 Moodle 支持该项目？嗯，通过转换为 Moodle，我可以：\n\n+   在一个地方管理我所有的教学资源，并完全控制它们如何呈现给学生（第\
  \ 3 章“添加文档和讲义”、第 4 章“声音与视觉——包含多媒体内容”和第 5 章“Moodle 改造”）\n\n+   使用我们在第 7 章“在线交流”中体验过的在线交流技能鼓励讨论和辩论\n\
  \n我的喷气发动机课程的学生在课程开始前彼此不认识。Moodle 提供了理想的介绍方式（我可以在他们报名参加课程时在 Moodle 上注册他们），也是他们在面对面课程结束后进行交流的好方法。\n\
  \n因为我们在一起的时间很短，他们可以使用第 7 章“在线交流”（论坛和聊天）以及附赠章节“通过 Moodle 提交作业”和第 6 章“管理学生作业”（我们学习了如何管理学生作业）来获得关于他们为获得最终证书而必须开展的项目工作的指导和支持。\n\
  \n我已经和我的 Moodle 管理员谈过为我创建一个新课程；她已经完成了这件事，现在我可以开始转换了。\n\n## 构建您的课程——修改课程设置\n\n第一项任务是调整课程设置，以适应我们即将开设的课程。我的管理员基本上只是将新课程添加到科学学院类别中，并让我成为教师。这意味着在我开始上传资源之前，还有一些设置工作要做。\n\
  \n## 行动时间——新课程快速配置\n\n+   1. 转到您的课程首页。在课程设置区块中，在管理区块下点击编辑设置。\n\n+   2. 为您的新课程设置一个名称和一个简称。请记住简称必须是唯一的。\n\
  \n![](img/1529021fde33ef551603bbc71587313e_321_0.png)\n\n> 您是否与同事讨论过课程简称的命名约定？如果没有，那么这可能是个好主意。有约定将使学生在您的\
  \ Moodle 站点中导航更容易。如果您的管理员将来希望自动将学生选入课程，这也会更容易。\n\n\n\n\n\n### 3. 为新课程撰写一段简介。尽量让它吸引人，这是学生在正式选课之前最先看到的内容。不要写得过于花哨，你知道如何使用\
  \ Moodle 编辑器，也知道如果愿意，可以在课程摘要中加入图形、音频和视频。尽量克制不要在课程摘要中过度使用这些技术，否则学生在浏览我们课程分类中的课程列表时会感到厌烦。我加入了一个动画\
  \ GIF，但我调整了布局，让它显示在摘要的右侧：\n\n![](img/1529021fde33ef551603bbc71587313e_322_0.png)\n\
  \n当我的课程出现在该分类的课程列表中时，图片位于右侧可以使课程列表更容易阅读。\n\n4. 设置课程格式。我的课程是一个为期两周的课程，从八月开始。我将按此进行相应配置：\n\
  \n**注意：** 注册截止日期是7月31日！\n\n![](img/1529021fde33ef551603bbc71587313e_323_0.png)\n\
  \n5. 滚动到页面底部，点击**保存更改**按钮。这样课程就按我的需求设置好了，以下是我的新课程与其它课程一起在网站首页上的显示方式：\n\n![](img/1529021fde33ef551603bbc71587313e_323_1.png)\n\
  \n6. 接下来，我需要指定一个选课密钥。返回课程，在“课程管理”下的“设置”板块中，点击“用户”，然后点击“选课方法”：\n\n![](img/1529021fde33ef551603bbc71587313e_324_0.png)\n\
  \n7. 确保“自助选课（学生）”已启用（点击它），然后点击编辑图标：\n\n![](img/1529021fde33ef551603bbc71587313e_324_1.png)\n\
  \n8. 指定一个选课密钥：\n\n![](img/1529021fde33ef551603bbc71587313e_324_2.png)\n\n9. 滚动到页面底部，点击**保存更改**按钮。\n\
  \n10. 完成了！搞定！\n\n## 刚才发生了什么？\n\n我已经设置好了我的新课程，准备开始上传资源。我为课程添加了一段简短摘要，保留了每周格式，但将其缩短为两周。我还指定了一个选课密钥，这样新学生就无法进入。我没有对学生隐藏这门课程：我本可以这样做，但我想让学生知道课程已经存在（阻止他们进入的是他们不知道选课密钥）。我想让学生对这门课程产生兴趣。\n\
  \n## 介绍你的课程\n\n我们在*第2章 设置你的课程*中看到，将“**常规摘要**”（Moodle 对课程页面最顶部区域的称呼）打造成一个学生可以了解课程以及相互了解的地方是一个好主意。\n\
  \n请参阅*第4章 声音与视觉——包含多媒体内容*，我们在其中使用`Slide.com`创建了一个照片蒙太奇（参见使用`Slide.com`的幻灯片展示）。我有很多往年运行这个项目时拍摄的照片。我已将这些照片上传到`Slide.com`，并打算在“常规摘要”中包含一个`Slide.com`幻灯片展示，这样我的新学生就能知道他们将参与什么：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_325_0.png)\n\n## 整合在一起\n\n我还打算添加一个“介绍”论坛（参见*第7章\
  \ 在线交流*），这样在成员们第一次见面之前，小组的所有成员都有机会相互了解（也了解我）。仅仅三十分钟后（我知道，因为我计时了），使用我们在本书中学到的所有技巧来创建我的“常规摘要”，我的课程现在（对学生而言）是这样的：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_326_0.png)\n\n## 快速测验——使用标签\n\n还记得我们在*第5章\
  \ Moodle 改造*中讨论过如何使用标签吗？我们看到标签是将课程粘合在一起的胶水。你能看出我在“常规摘要”中哪里使用了标签吗？\n\n## 使用多媒体分享服务\n\
  \n我在前面的示例中使用了`slide.com`，但当然，还有许多其它在线分享网站可以分享各种类型和形式的多媒体内容。想一想使用 Google Picasa、Flickr\
  \ 和 YouTube 等服务的可能性。请记住，要确保你选择的服务实际上可供你的学生使用。例如，学生通常被禁止访问 YouTube，即使教职员工可以访问。请参阅*第4章\
  \ 声音与视觉——包含多媒体内容*，获取有关在课程中包含多媒体的更多建议。\n\n## 安排活动\n\n让我们看看我如何安排第1周（我将以大致相同的方式安排第2周）。让我们从在线活动开始，先向学生提一个简单的问题来测试他们的理解，给他们一个选择。我们在*第8章\
  \ 提升你的教学*中看到了如何包含和配置“选择”活动。我的问题是：“液体必须高度易燃才能爆炸吗？”以下是我创建的“选择”活动：\n\n![](img/1529021fde33ef551603bbc71587313e_327_0.png)\n\
  \n## 动手实践——将填字游戏转换为 Moodle\n\n1. 首先，使用 JCross 创建你的填字游戏：\n\n![](img/1529021fde33ef551603bbc71587313e_329_0.png)\n\
  \n2. 接下来，我们需要将填字游戏导出为 SCORM 活动。从 JCross 主菜单中选择“文件”，然后向下滑动到“创建 Scorm 1.2 包”。\n\n\
  3. 回到你的 Moodle 课程中，在正确的周次，我需要点击“添加活动...”下拉菜单，然后选择“SCORM 包”。\n\n4. 在**常规**框中，为活动指定名称和描述，然后选择我们刚刚创建的\
  \ SCORM 包文件：\n\n![](img/1529021fde33ef551603bbc71587313e_330_0.png)\n\n5. 滚动到**其它设置**，然后点击**显示高级**按钮。我将在一个新窗口中显示填字游戏，并允许调整该窗口的大小。\n\
  \n6. 滚动到页面底部，点击**保存并显示**按钮。\n\n7. 以下是我的填字游戏转换为 Moodle 后的样子：\n\n![](img/1529021fde33ef551603bbc71587313e_331_0.png)\n\
  \n### 刚才发生了什么？\n\n我们刚刚跟随了我将我的“喷气发动机填字游戏”转换为 Moodle 的过程。这样做的好处如下：\n\n- 我不必担心收集纸张、保管它们、批改它们，然后再把它们发还回去\n\
  - 填字游戏会自动评分\n- 通过课程管理板块中的**成绩**，我可以一目了然地看到谁尝试了填字游戏以及他们表现如何（本章后半部分有更多关于课程成绩册的内容）\n\
  \n## 整合在一起\n\n现在我的学生已经开始思考与喷气发动机相关的技术术语（如果你以前没接触过，很多术语相当复杂），他们可以一起创建一个在线词汇表。让我们添加一个次级词汇表，我将允许对词汇表条目进行评论，并允许学生对条目进行评分（满分5分）：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_332_0.png)\n\n请注意，我通过“词汇表管理”下的“设置”板块中的“权限”屏幕，允许学生对词汇表中的条目进行评分。\n\
  \n我们将从空词汇表开始，这样我们可以在第1周一起进行时逐步填充它。\n\n我还希望我们一起制作一个脉冲喷气发动机 Wiki，这可以作为学生电子档案袋的一部分。我已经有了一个他们可以遵循的文档结构，所以我将按照*第8章\
  \ 提升你的教学*中的说明，这次创建一个“小组 Wiki”，同时指定一个起始页面，以便学生有结构可循（这对他们的电子档案袋很重要）。\n\n最后，由于这是一门我使用\
  \ Moodle 支持的相当实践性的课程，我想给学生一个上传照片的机会。目前他们把 USB 记忆棒、数码相机的存储卡交给我，或者，如果我们特别有冒险精神，他们会尝试通过蓝牙把图像文件发给我。让我们用“作业”把这件事转换成\
  \ Moodle。实际上，让我们使用我们在*第6章 管理学生作业*中第一次遇到的“高级文件上传”作业。其优点是：\n\n- 如果学生有任何想给我的照片，他们可以直接上传到\
  \ Moodle\n- 我可以管理每个学生上传了多少张照片，并轻松检查谁没有上传任何照片\n\n但最重要的是：\n\n- 我不必费心去弄明白如何使用他们的手机\n\
  \n目前，这就是我的“喷气发动机”课程中我想转换为 Moodle 的全部内容，所以我们先到这里，看看目前我的第1周的样子：\n\n![](img/1529021fde33ef551603bbc71587313e_333_0.png)\n\
  \n\n\n\n\n## 综合应用\n\n这里缺少的是一个总结，以及向学生说明这些活动如何组合在一起的某种指示。让我们使用第5章《Moodle 改造》中的一些标签和技巧来优化我们的\
  \ HTML：\n\n![](img/1529021fde33ef551603bbc71587313e_334_0.png)\n\nMoodle 的理念表明，学习者可以按照自己的选择在任何资源与活动之间自由漫步（或“moodle”）。然而，我想管理我的学生如何完成课程第一周的学习。最简单的方法是隐藏所有内容，然后按照我希望学生去做的顺序来展示。但请记住，在Moodle中，我可以让活动的访问取决于其他活动是否已完成，尽管这可能过于复杂。这种方法也可能与Moodle的基本教学法相矛盾，但我遇到了三个重要的理由来解释为什么你需要控制对作业的访问：\n\
  \n- 防止学生因看到未来将要学习的困难内容而感到焦虑\n- 避免被问到尚未讲授过的话题\n- 避免解答家长的疑问，他们查看课程是为了了解自己的孩子将要学习什么（听起来很奇怪，但我多次遇到过这个问题）\n\
  \n从上面的截图可以看出，实际上我并没有这样做。我给自己Moodle课程中的所有任务都编了号（1.1、1.2，等等），这样在与学生互动时就可以引用这些编号。\n\
  \n在本章的这一部分中，你看到的全部工作只花了一个多小时。开始转换到Moodle并不需要很长时间。这些工作我本来都不必使用Moodle（到目前为止我也没使用过）。但是，希望你能够看到，只需将课程中的几个方面转换到Moodle，我就能让自己的生活更轻松，同时让学生的学习体验更有趣。本章末尾还有更多关于转换到Moodle的建议。\n\
  \n## 转换为全在线课程\n\n到目前为止，我们一直在讨论转换到Moodle，但始终假设教学中至少会保留一些面对面环节。然而，在现阶段，我们完全可以考虑将课程完全转为在线教学。在完全电子化之前，我们还需要解决两个进一步的问题：\n\
  \n- 如何对学生进行分组并在线管理\n- 如何管理和组织成绩\n\n让我们在下一节中来看第一个问题。\n\n### 管理学生分组\n\n如果我有一组学生（尤其是能力参差不齐的学生），我会倾向于把他们分成小组。这不仅仅是为了让我管理起来更方便，而且如果学生彼此还不太熟悉，我也会把他们分组（以此促进他们的社交融合）。无论你是否要全面转到在线教学，能够对学生分组，然后根据他们所在的小组分配作业，都是你很可能想要做的事情；在本节中我们将学习如何操作。\n\
  \n### 创建小组\n\n我将把我“喷气发动机”课程的学生分成两组：“Turbo”组和“Pulse”组：\n\n### 动手实践 – 创建学生小组\n\n1.\
  \ 返回课程首页。在“设置”面板的“课程管理”下，点击“用户”中的“分组”链接：\n\n![](img/1529021fde33ef551603bbc71587313e_336_0.png)\n\
  \n2. 点击“创建小组”按钮：\n\n![](img/1529021fde33ef551603bbc71587313e_336_1.png)\n\n3. 为你的小组命名，并可选择添加描述（稍后会详细介绍）。\n\
  \n4. 你还可以指定一张图片作为小组的代表（同样，稍后会详细说明）。\n\n5. 完成后点击**保存更改**按钮。你的新小组随即被添加到可用小组列表中（小组名称后括号中的数字表示小组内的用户数）：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_337_0.png)\n\n### 刚才发生了什么？\n\n我们刚刚创建了一个新小组，尽管目前里面还没有成员。与Moodle中的大多数操作一样，配置设置时你不必立即做出最终决定。配置小组时，一旦小组有了成员，我通常会重新查看两个设置：\n\
  \n- 我一开始会将小组描述留空，然后在小组成员第一次集合时，询问他们希望如何描述自己。如果课程已转为完全在线，那么我们会进行聊天，或者（更常见的是）我会发起一个论坛讨论。\n\
  - 同样，对于小组图片，我可能拍摄一张小组照片，或者小组可以为自己选择一个吉祥物，然后我可以通过**新图片**设置来指定。\n\n我将重复上述过程来创建“Turbo”小组，然后开始将学生添加到我的小组中（这是下一节的主题）。\n\
  \n### 向小组添加学生\n\n可以通过两种方式实现：\n\n- 我手动将学生添加到小组中\n- 学生选课并自动加入对应的小组\n\n现在让我们来看第一种方式。\n\
  \n### 动手实践 – 手动将学生添加到小组\n\n1. 返回课程首页，从“管理”面板中选择“分组”。\n\n2. 点击你想要添加成员的小组名称，然后按下“显示小组成员”按钮。\n\
  \n3. 点击“添加/移除用户”按钮。\n\n4. 选择你想要添加到小组中的用户（可以一次选择多个），然后点击“添加”按钮：\n\n![](img/1529021fde33ef551603bbc71587313e_338_0.png)\n\
  \n5. 请注意，用户立即被添加到小组中。如果你随后点击“返回小组”按钮，你会看到小组名称后的括号现在显示了小组中的用户数。如果我点击小组名称，则成员会列在“成员列表”中：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_339_0.png)\n\n6. 就这样。我们完成了！\n\n### 刚才发生了什么？\n\
  \n我们刚刚看到手动将学生添加到小组是多么容易，而将学生从小组中移除也同样容易（你在添加用户时注意到“移除”按钮了吗？）。\n\n如果你有很多学生，那么这种方法可能会变得繁琐。更典型的分组方式是通过小组选课密钥。让我们现在来看如何实现。\n\
  \n### 动手实践 – 指定小组选课密钥\n\n1. 返回课程首页，在“设置”面板的“课程管理”下，点击“用户”中的“分组”。\n\n2. 选择你想要编辑的小组，并点击“编辑小组设置”按钮。\n\
  \n### 刚才发生了什么？\n\n我们刚刚为小组指定了选课密钥。这意味着我可以将小组选课密钥交给学生，他们在选课时使用小组密钥（而不是课程密钥）来加入课程。这不仅会让他们完成课程注册，还会自动将他们添加到正确的小组中。\n\
  \n不同小组可以有不同的密钥，如果我不想让某些学生加入任何小组，那么我只给他们课程选课密钥即可。\n\n但学生分组之后，我如何管理他们的作业呢？让我们看看如何将某个活动设置为分组活动。\n\
  \n### 小组协作\n\n为了展示我们如何在Moodle中管理小组作业，我们需要查看一种协作活动。我们即将演示的过程适用于任何协作活动，但让我们以论坛为例：\n\
  \n### 动手实践 – 在论坛中进行小组协作\n\n1. 在课程中选择一个主题或周次，在开启编辑模式后，点击“添加活动...”，并从列表中选择“论坛”。\n\n\
  2. 为论坛命名并添加简介。\n\n3. 向下滚动到页面底部的“常用模块设置”区域。“小组模式”设置提供了三个选项：\n\n- 不分组：这是默认设置。无论学生在哪个小组，都可以看到所有人的作业。\n\
  - 分隔小组：学生只能看到自己小组内学生的作业。对他们而言，他们拥有自己的论坛。\n- 可见小组：学生可以看到其他小组学生的作业，但只能与自己小组的学生互动。这就像把一个班级一分为二，两个小组都能看到对方在做什么，但不能干扰对方的工作。\n\
  \n4. 指定一个小组选课密钥。可以是任意你喜欢的值。要显示你刚刚输入的密钥（以便你能看到），请确保勾选“Unmask”设置。在学校环境中，将其设为班级名称（例如9A、9B等）对任何课程都很有用。\n\
  \n5. 点击**保存更改**按钮，就完成了。\n\n\n\n\n\n## 整合起来\n\n- 2. 在**小组**页面顶部是否看到了一个**分组**选项卡？\n\
  \n  ![](img/1529021fde33ef551603bbc71587313e_342_0.png)\n\n- 3. 如果没有，你需要联系你的 Moodle\
  \ 管理员（请参阅紧随其后的*询问管理员*部分）。如果有，请点击它。\n\n- 4. 按下**创建分组**按钮。\n\n- 5. 为该分组命名，并可选择添加描述。\n\
  \n- 6. 按下**保存更改**按钮。\n\n- 7. 现在，我们已经创建了一个分组，但其中还没有任何小组：\n\n| 分组 | 小组 | 活动 | 编辑 |\n\
  |---|---|---|---|\n| Turbo 小组的任务 | 无 | 0 |  |\n\n- 8. 点击“在分组中显示小组”图标：\n\n  ![](img/1529021fde33ef551603bbc71587313e_342_1.png)\n\
  \n- 9. 在“潜在成员”列表中选择要添加到分组中的小组，然后按下“添加”按钮：\n\n  ![](img/1529021fde33ef551603bbc71587313e_343_0.png)\n\
  \n- 10. 完成后，按下“返回分组”按钮。\n\n现在，我将返回刚刚创建的论坛，并按下“更新此论坛”按钮，回到“编辑论坛”页面。\n\n- 11. 回到“编辑论坛”页面后，向下滚动到“通用模块设置”框，然后点击该框右上角的“显示高级”按钮：\n\
  \n  ![](img/1529021fde33ef551603bbc71587313e_343_1.png)\n\n- **12.** 此时将显示**分组**设置。为了确保我的论坛只对特定分组中的学生可用，请从下拉列表中选择该分组，并确保勾选**仅对小组成员可用**：\n\
  \n  ![](img/1529021fde33ef551603bbc71587313e_344_0.png)\n\n- **13.** 就这样！现在，这个论坛只对“Turbo\
  \ 小组的任务”分组内各小组的学生开放。\n\n### 刚才发生了什么？\n\n我们刚刚将面对面小组教学中的一个重要环节——向不同小组分发不同任务——迁移到了\
  \ Moodle 中。\n\n### 检查学生进度\n\n即使你不打算将课程完全转为在线运行，在某些情况下你可能仍希望监控学生的活动。例如，如果你想在学生使用课程时不断改进课程，你可能会希望监控有多少学生在访问某个特定资源。那么，如何知道学生去过哪些地方，以及在那里停留了多长时间？\n\
  \n### 监控学生参与情况\n\n返回课程首页，找到**人员**版块（它通常位于课程首页的左上角）。点击**人员**版块中的**参与者**链接。从参与者列表中选择一个名字，然后点击**活动报告**选项卡。**概要**报告会显示学生上次访问某个特定资源或活动的时间。点击**所有日志**选项卡，不仅可以显示学生访问特定资源的时间，还可以显示他们访问时所用计算机或互联网连接的\
  \ ID（称为 IP 地址）。**成绩**选项卡显示学生对课程中可评分活动所获成绩的概要报告。与其逐一检查每个学生的成绩，你可以使用 Moodle 成绩册查看课程中所有学生所得成绩的概况。\n\
  \n### 使用 Moodle 成绩册\n\n让我们再次访问在 *第6章：管理学生作业* 中首次遇到过的成绩册。成绩册是 Moodle 的一个非常强大的功能；如果你打算将课程完全转为在线运行，就需要熟练掌握它的用法。话虽如此，成绩册的大部分功能都是一目了然的。当你向课程添加活动时，你会看到它们被添加到评分报告中，并看到学生的成绩显示在那里。大多数教育工作者都会乐于直接使用成绩册。不过，你也可以在成绩册中插入自定义成绩项（不仅限于已添加到课程中的活动），可以更改成绩的计算方式，还可以对成绩进行分类（将成绩分组，甚至计算该分类的总成绩）。\n\
  \n要访问课程的成绩册，你需要返回课程首页，然后在**设置**版块的**课程管理**下选择**成绩**。\n\n进入**评分报告**页面后，点击**评分报告...**下拉菜单，查看可用的选项类型：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_345_0.png)\n\n- 2. 为你的类别命名。我打算把它命名为“实践课分数”。\n\
  \n- 3. 按下**显示高级**按钮。你会看到一些额外设置出现。我现在不打算去管它们，但你可以随意研究。记住：你不会弄坏任何东西，而且你随时可以查阅 Moodle\
  \ 文档获取指导。\n\n- 4. 完成后，按下**保存更改**按钮。\n\n- 5. 现在，我将重复这个过程，创建一个名为“Moodle 活动分数”的类别。我的类别和项目树现在如下图所示：\n\
  \n  ![](img/1529021fde33ef551603bbc71587313e_347_0.png)\n\n- 6. 使用移动图标（或单击并拖动，具体取决于你的站点设置方式），我可以将\
  \ Moodle 活动移到“Moodle 活动分数”类别下，这与我们在 Moodle 课程中拖放活动和资源的方式完全相同。这是我现在这棵树的样子：\n\n  ![](img/1529021fde33ef551603bbc71587313e_347_1.png)\n\
  \n现在，我可以开始为学生将要完成的实践工作添加成绩项了。\n\n- 7. 按下**添加成绩项**按钮。\n\n- 8. 为成绩项命名，例如“规划与设计”。\n\
  \n- 9. 指定成绩类型。如果需要，你也可以使用自定义量表（参见*第6章：管理学生作业*）。\n\n- 10. 使用“上级类别”下拉列表，指定你的成绩项要归入的类别。\n\
  \n- 11. 按下**保存更改**按钮。我的新成绩项现已添加到树中：\n\n  ![](img/1529021fde33ef551603bbc71587313e_348_0.png)\n\
  \n- 12. 如果随后我点击左上角的**选择一个操作...**下拉菜单，并选择**评分报告**（位于“视图”标题下），你就会看到我们是如何重新构建成绩册的：\n\
  \n  ![](img/1529021fde33ef551603bbc71587313e_348_1.png)\n\n### 刚才发生了什么？\n\n我刚才重新构建了课程成绩册，加入了“实践课分数”和“Moodle\
  \ 活动分数”两个类别。你还看到了我如何添加自己的自定义成绩，这意味着我的成绩册不必只包含 Moodle 活动的成绩。如果你愿意，也可以添加自己的成绩。\n\n\
  ### 高手挑战——加入自定义成果\n\n你不仅可以添加自定义成绩，还可以加入自定义成果；如果你正在转换一门使用达标目标或学习描述符来评判学生成就的课程，这一点至关重要。\n\
  \n> 关于加入自定义成果的提示\n> 在开始在成绩册中指定达标目标之前，你需要先创建自定义量表。详情请参阅第6章：管理学生作业。\n\n返回“编辑类别和项目”页面。按下“添加成果项”按钮。看看你是否可以向成绩册添加一个自定义成果。记住，你需要先创建并配置自定义成果，然后才能开始。\n\
  \n### 备份与还原\n\n我们一起的旅程已接近尾声，我现在最不希望发生的就是你丢失自己的所有成果（也包括我的！）。返回课程首页，查看“课程管理”下“设置”版块中的选项。列出的两个选项是“备份”和“还原”。选择“备份”（我们稍后会介绍还原），让我们把到目前为止完成的所有辛苦工作都备份起来；有备无患，总比事后后悔好。\n\
  \n### 备份课程\n\n在执行备份过程时，你会发现有许多许多选项可以选择。在这个阶段，最好只是保留默认设置并备份所有内容。现在，让我们逐步完成这一过程：\n\
  \n### 动手实践——备份你的课程\n\n- 1. 从“设置”版块选择“备份”后，你会进入备份向导的第一页（“初始设置”）。保持默认设置不变，滚动到页面底部，然后按下“下一步”。\n\
  \n\n\n\n2. 下一页（“Schema 设置”）允许你选择要备份的内容。同样，滚动到页面底部并单击“下一步”。\n\n3. “确认和检查”页面允许你检查你的选择，也可以更改\
  \ Moodle 即将创建的备份文件的名称。如果一切正常，请按页面底部的“执行备份”按钮。备份完成后，按“继续”按钮，Moodle 现在会显示你的备份文件。你可以看到我已经备份了“Backyard\
  \ Ballistics”和“Jet in a Jam Jar”两门课程：\n\n![](img/1529021fde33ef551603bbc71587313e_350_0.png)\n\
  \n4. 你可以看到 Moodle 已将你的整个课程备份到单个文件中，并将其放入你的用户私有备份区域。这很好，但如果运行 Moodle 的计算机出现问题，那帮助不大。点击文件名旁边的“下载”链接。你可以在打开或保存之间进行选择。选择“保存”，将文件保存到你的计算机、U\
  \ 盘或便携式硬盘上。妥善保管：\n\n## 操作时间 – 恢复课程\n\n1. 点击**设置**区块中**课程管理**下的**恢复**，将带你进入**导入备份文件**页面。\n\
  \n2. 如果需要，导入你的备份文件。上传此文件的过程与上传资源完全相同：\n\n![](img/1529021fde33ef551603bbc71587313e_352_0.png)\n\
  \n3. 文件上传后，按下**恢复**按钮。\n\n4. 你将进入恢复向导的第一页（“**确认**”）。备份文件的内容会显示出来。如果你满意，滚动到页面底部并按下**继续**按钮。\n\
  \n5. 下一页允许你指定目标位置。重要的是，还会询问你是否想要：\n   - 将备份的内容合并到课程中\n   - 删除课程内容并用备份内容替换\n\n  \
  \ 并且，如果你拥有课程创建者权限：\n\n   - 创建一门全新的课程\n\n   你需要确保选择了正确的选项。然后滚动到页面底部并按下相应的**继续**按钮：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_353_0.png)\n\n6. 确认设置并按下**下一步**按钮。\n\n\
  7. “Schema”页面允许你确认（或修改）课程名称和短名称（记住短名称必须唯一），还允许你选择将备份文件中的哪些资源和活动恢复到课程中。滚动到页面底部并按下**下一步**按钮。\n\
  \n8. 在按下页面底部的**执行恢复**按钮之前，检查你的选择。\n\n9. 恢复完成后，按下**继续**按钮。此时你已返回课程首页。就这样，你完成了！\n\n\
  ## 刚才发生了什么？\n\n即使最糟糕的情况发生，我需要恢复课程，幸运的是这个过程很简单。只需点击**设置**区块中**课程管理**下的**恢复**，上传备份文件，点击**恢复**，按照说明操作，剩下的交给\
  \ Moodle 来完成。\n\n备份和恢复的一大优点是它可以用来共享 Moodle 课程。如果同事给了你一个 Moodle 课程，而你想知道如何将该课程放到你的\
  \ Moodle 上，那么很可能你的同事给你的就是一个课程备份。\n\n> **将活动从一个课程复制到另一个课程**\n> 要快速将活动从一个课程复制到另一个课程，最好使用**导入**，它也可以在**设置**区块的**课程管理**下找到。\n\
  \n## 总结\n\n在本章中，我们学到了很多关于如何通过转换到 Moodle 来支持面对面学习的内容。具体来说，我们涵盖了：\n\n- 如何快速配置新课程，使其可以添加内容\n\
  - 如何构建课程，包括如何组织课程介绍以及如何安排活动\n- 课程如何能迅速初具规模\n\n我们还了解了如何转换为完全在线的课程，特别着重学习了如何将小组或团队协作转换到\
  \ Moodle 中，具体包括：\n\n- 如何在线管理学生小组\n- 如何创建小组以及如何将学生添加到小组中\n- 如何分发小组特定任务（使用分组）\n\n\
  我们了解了如何监控学生的进度，以及如何查看学生在课程中的活动轨迹（甚至可以查看他们使用哪台计算机）。这引导我们讨论了 Moodle 的评分册。我们对这个工具的探索只是触及皮毛，但我们确实了解了如何对成绩进行分类，甚至可以添加自己的评分项（这样你就不仅限于课程活动的成绩）。\n\
  \n最后，我们学习了如何备份和恢复课程，这意味着你可以保留到目前为止所完成的所有辛勤工作！\n\n## 随堂测验答案\n\n### 第 1 章，走向电子化\n\n\
  - Moodle 是一个缩写，但它代表什么？当考虑你的 Moodle 能否满足你教学所需时，为什么 Moodle 中的“M”如此重要？\n    - **答案：**模块化面向对象动态学习环境。Moodle\
  \ 是“模”块化的，这意味着如果 Moodle 没有实现你需要的某个功能，那么很可能有一个可用的模块可以让你实现它。\n\n- 我刚刚点击了一个类别来查看其中的课程。我看到有一个标记为**添加新课程**的按钮。在这种情况下，我的角色是什么？\n\
  \    - **答案：**课程创建者\n\n### 第 2 章，设置你的课程\n\n- 课程创建者和管理者之间有什么区别？\n    - **答案：**课程创建者的权限比管理者少。例如，课程创建者可以创建新课程，但管理者也可以删除它们！\n\
  \n- 如何将课程格式从“主题”更改为“每周”？\n    - **答案：**转到**课程设置**页面（通过**设置**区块中的“**编辑设置**”）并从**格式**下拉列表中选择所需的类型。\n\
  \n### 第 3 章，添加文档和讲义\n\n- 你的学生可以直接访问你的私有文件区域吗？你如何提供私有文件区域中文件的链接？\n    - **答案：**学生无法访问你的私有文件区域。使用文件选择器选择你想要分发的文件。\n\
  \n- 通过裁剪和压缩演示文稿中包含的任何图像，可以大大减小 PowerPoint 文件的大小。你还记得压缩图像的步骤吗？\n    - **答案：**回顾本章以检查你的知识。\n\
  \n- 如果你刚刚从 Word 文档中剪切并粘贴了文本，那么 HTML 编辑器中有一个特殊按钮值得你继续操作之前按下。这个按钮叫什么名字？\n    - **答案：**你可以使用**清理杂乱代码**按钮。\n"
