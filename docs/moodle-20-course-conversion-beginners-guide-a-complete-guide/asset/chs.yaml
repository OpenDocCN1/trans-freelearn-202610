- "# 1 走向电子化\n\n> 想象一个世界，你可以给学生布置测验，而测验交回来时已经批改好了。想象一个时代，学生可以以数字方式提交课程作业和项目，而不是纸质方式。我们不仅能拯救大量树木，而且还不会再有“打印机没墨了”之类不按时交作业的借口。要是有一个系统，能让学生和教师通过一个精心管理、完全自动化的数字框架来交换作业，你就再也不用担心学生的作业会弄丢了。\n\
  \n这些系统确实存在，它们被称为虚拟学习环境（VLEs）或课程管理系统（CMSs），取决于你问谁。Moodle 是众多系统之一，但毫无疑问，它是目前在各级教育（包括基于工作的学习）中最受欢迎的系统。\n\
  \n技术的进步正在推动 Moodle 的使用。低成本迷你笔记本电脑（例如 Dell Latitude 或 Asus EEE PC）的兴起，使得为每个学生配备一台便携式可上网设备在许多学校成为切实可行的现实。再加上这样一个简单的事实：如今的年轻人发现\
  \ IT 作为一种学习工具更具吸引力。\n\n毫无疑问，这些只是你发现自己想知道如何开始将教学转换到 Moodle 的部分原因。也许你想知道如何在你的学校倡导使用\
  \ Moodle。也许你的学校正在转换到 Moodle，而你担心自己会落后。\n\n你目前是否只在教室或讲堂进行面对面教学？也许你正在使用另一个受管学习环境（如果是这样，那你真不知道自己错过了什么！）并且需要转换。问题是：我如何转换到\
  \ Moodle？这正是本书要回答的问题。\n\n为了帮助我们了解即将使用的工具，我们首先来看一些 Moodle 的背景故事。但我们会尽快登录系统，四处转一转，然后让所有人知道我们已经来了。\n\
  \n在本章中，我们将：\n\n- 了解 Moodle 为何被创建以及它是如何开发的\n- 学习如何登录和退出\n- 探索 Moodle 界面并开始学习一些 Moodle\
  \ 术语\n- 配置我们的用户配置文件\n\n那么让我们开始吧。\n\n### Moodle 能为我做些什么\n\nMoodle 为你提供了存储和呈现音乐、演讲、视频，进行在线群聊、测验，以及（如前所述）管理作业提交的工具。让我们来看看转换到\
  \ Moodle 的几个优势。\n\n我们大多数人都有共享的在线区域，可以在那里向学生分发工作表和讲义。然而，这些共享区域通常无法从家里访问。Moodle 解决了这个问题。共享区域也可能会变得杂乱无章。使用\
  \ Moodle，你可以轻松地管理和组织资源共享。你还可以让分发作业的方式在视觉上更具吸引力；这个过程对谨慎的学生来说也变得更加友好。\n\n第三方内容提供商已经意识到了学习平台的理念，他们提供的更多资源是专门为\
  \ Moodle 这类环境设计的。\n\n但 Moodle 不仅仅是一个资源库。Moodle 中的“M”代表“模块化”，有一些 Moodle 模块允许你布置作业并完全在线评分（由\
  \ Moodle 为你管理分数），还有一些模块允许你设置测试并自动评分。事实上，如果你想让 Moodle 做某事，而“开箱即用”的安装并不支持，那么很可能有一个模块可以启用或安装，提供你所需的功能。例如，当我的管理员在我们学校的\
  \ Moodle 中启用数学符号支持时，文本编辑器中出现了一个新按钮，让我可以轻松创建数学符号：\n\n![](img/1529021fde33ef551603bbc71587313e_25_0.png)\n\
  \n由于 Moodle 在有互联网接入的任何地方都可用，因此 Moodle 可以用来支持因任何原因无法来到教室的学生。也许他们生病了，也许他们在另一所学院上课，或者他们正在进行基于工作的培训，而你需要在他们培训期间继续你的教学。\n\
  \nMoodle 是你教师工具箱中的另一个工具。我不希望你认为迁移到 Moodle 会给你带来更多工作。这正是本书的价值所在。我将向你展示如何快速轻松地将你现有的教学材料放到网上。在书的结尾，如果你正在开发新的学习资源，那么与其在\
  \ Word 中创建讲义或在 PowerPoint 中创建演示文稿，不如想想 Moodle 中无数的功能（我将向你介绍其中的一小部分），以及你如何在教学中使用这些功能。\n\
  \n### 对学生的好处\n\nMoodle 提供了一致的“用户界面”。我这么说是什么意思？嗯，虽然比我年轻的几代人非常熟悉计算机，但他们往往只知道如何使用某些程序和应用程序（即时通讯和社交网络是最受欢迎的），却不知道如何使用其他任何东西。Moodle\
  \ 包含许多不同的学习工具，但由于它们都有一致的用户界面，如果你学会了如何使用其中一个，那么开始使用其他工具并不需要花费太多额外的努力和理解。到目前为止，我从未需要向学生演示如何使用\
  \ Moodle。\n\n始终可用意味着 Moodle 可以在放学铃响之后继续支持学生。如果需要在周末、假期或学生考试假期间继续学习，那么 Moodle 可以提供这种支持。那些在课堂上不愿发言的学生，往往非常乐意在网上发表意见。\n\
  \n因为 Moodle 可以在学生参加测试后立即评分，所以他们可以即时获得关于自己作业的反馈。\n\n### 开源的优势\n\nMoodle 是开源的，也就是说，它基本上是免费的。但不要因为它是免费的就望而却步。这绝对是一个优势。Moodle\
  \ 有一个紧密的开发者网络支持，他们努力确保 Moodle 安全、可靠和稳健。有关 Moodle 开发如何进行的更多信息，请参见 http://docs.moodle.org/en/Development:Overview。我们已经了解了\
  \ Moodle 中的“M”代表模块化。如果你熟悉 Web 开发，那么你总有机会创建自己的 Moodle 模块。你一眼就能看出，我是开源软件的忠实粉丝。如果你具有技术背景，那么你可以试验\
  \ Moodle，而完全不必担心软件许可费用。许多教师下载了自己的免费 Moodle 副本，尝试新的教学想法（参见 http://docs.moodle.org/20/en/Windows_installation_using_XAMPP）。许多学校还会保留一份用于开发目的的\
  \ Moodle 副本。\n\n有关开发自己的自定义 Moodle 插件的更多信息，请参阅 *Moodle 1.9 扩展开发*，Jonathan Moore 和\
  \ Michael Churchward，Packt Publishing。\n\n### 这本书是写给谁的\n\n本书面向教育工作者。我们假设你的工作是教学，而不需要搭建\
  \ Moodle 站点（我们假设这已经为你完成了）。我们还假设，如果有任何需要执行的管理任务（需要调整的设置或需要打开的开关），你的 Moodle 管理员会为你完成。如果你确实需要在设置和配置站点方面获得支持，请参阅\
  \ *Moodle 管理*，Alex Büchner，Packt Publishing。\n\n\n\n\n## 我们将一起做些什么\n\n在本章中，我们将一起了解\
  \ Moodle 的历史——它从哪里来，以及哪些因素影响了它的发展。这一点之所以重要，是因为 Moodle 只是一个完成工作的工具。如果我们能理解 Moodle\
  \ 为何这样设计，那么当我们试图以它并不适用的方式使用它时，我们就会知道自己的方法为什么可能行不通。然后，我们会了解如何登录和退出 Moodle、如何修改用户资料，以及（重要的是）在需要时如何修改密码。我们还将探索\
  \ Moodle 的用户界面——构成一个 Moodle 页面各元素的名称（这样当人们提到“面包屑导航”和“版块”时，你就知道他们在说什么了）。\n\n本书的其余部分分为两部分。\n\
  \n### Moodle 课程转换：第 1 部分\n\n在第 1 部分中，我们将学习如何把文档和讲义转换到 Moodle。\n\n我们的第一个任务是建立并配置一个\
  \ Moodle“课程”。我们要把自己的文档和讲义放在这里，同时也要在这里设置测验等。这些内容将在*第 2 章，设置你的课程*中介绍。\n\n在*第 3 章，添加文档和讲义*中，我们将学习如何将文档导入\
  \ Moodle，以及如何让学生访问这些文档。并非所有学生都能打开我们的文档（这取决于他们计算机上安装的软件），因此我们将介绍一些技巧和方法，确保无论学生安装了何种软件，我们的资源都能被所有人访问。\n\
  \n一旦我们在网上布置了作业，就需要为学生提供一种提交已完成作业的途径。在附加章节*通过 Moodle 提交作业*中，我们将看到即使是年龄很小的学生也能通过 Moodle\
  \ 快速轻松地上传作业。这样一来，我们也可以在线管理他们的成绩。这个附加章节为*第 6 章，管理学生作业*奠定了基础，该章将介绍如何将整个项目和作业转换到 Moodle（见第二部分）。\n\
  \n转换到 Moodle 意味着我们可以轻松地加入视频和音频。在*第 4 章，声音与影像——加入多媒体内容*中，我们将学习如何利用声音和影像，使教学材料对学生更具吸引力。\n\
  \n在*第 5 章，Moodle 大变身*中，我们会花时间回顾并实践目前为止所学的内容，了解如何让课程更加精致。\n\n道吉亚马斯的成长背景对 Moodle 有着重要的影响。马丁在西澳大利亚的沙漠中长大。他就读的小学是“空中学校”（School\
  \ of the Air），这是一所函授学校，课程由一千公里外的一所学校通过业余（短波）电台讲授。马丁的班级每年只聚一次（参加学校嘉年华），他的学习材料由一架四座塞斯纳飞机每两周投递到他家，同时收走作业。如果你想了解更多，可以观看迈克尔·费尔德斯坦（Michael\
  \ Feldstein）对马丁的采访：http://mfeldstein.com/interview-with-martin-dougiamas/。\n\n##\
  \ 一种新的学习教学法\n\nMoodle 与其他虚拟学习环境（VLE）最大的不同，在于它所支持的学习方式。该系统（正如其博士论文标题所揭示的）被设计用来支持“社会建构主义认识论”。换句话说，学生通过分享知识来共同学习。这就是为什么你在\
  \ Moodle 中会看到这些工具：\n\n- **鼓励讨论**：论坛和聊天\n- **支持协作**：维基\n- **管理同伴评审与评估**：工作坊\n\n尽管你会发现大量文献鼓励你以某种特定方式使用\
  \ Moodle（即支持社会建构主义教学法），但绝没有阻止你使用 Moodle 来支持其他学习风格。Moodle 非常适合远程学习者（例如，英国开放大学现在正在使用\
  \ Moodle 支持其 25 万名远程学习者），而且它的结构确实围绕某种特定教学法而设计，但正如我们将在本指南中看到的，Moodle 内置了出色的功能和工具，能够支持各种教学风格。有关\
  \ Moodle 如何支持不同学习风格的更多信息，请参阅《Moodle 教学技巧：使用 Moodle 构建在线学习解决方案的创造性方法》（William Rice\
  \ 著，Packt Publishing 出版）。\n\n## 发展与支持\n\n自 1999 年以来，Moodle 的使用量急剧增长（相关数据见 http://moodle.org/stats/）。因此，将你的课程转换到\
  \ Moodle，你会成为这个庞大群体中的一员。要加入日益壮大的全球“Moodler”社区——讨论你的工作、寻求帮助、学习更多最佳实践——请访问 http://moodle.org。我的背景是数学和科学，你经常能在数学工具论坛上找到我。\n\
  \n事实上（也许并不令人意外），Moodle.org 本身就是一个 Moodle。这意味着，如果你对 Moodle 还不熟悉，Moodle.org 可能会让你有点望而生畏。如果你是\
  \ Moodle 新手，我建议你先对这个系统多积累一些经验，然后再访问 Moodle.org。\n\n## 走向电子化\n\n## 随堂测验\n\nMoodle\
  \ 是一个首字母缩略词，但它代表什么？当你希望 Moodle 能满足你的教学需求时，为什么 Moodle 中的“M”如此重要？\n\n## 开始登录\n\n理论部分大概已经足够了，让我们开始使用\
  \ Moodle 吧。\n\n## 登录\n\n我假设你的 Moodle 管理员已经给了你用户名和密码。也许它就是你用来访问所在机构其他服务的同一个用户名和密码。根据你的网络环境，你可能会自动登录\
  \ Moodle。现在我们假设你需要登录。\n\n## 操作时间——登录 Moodle\n\n- 1. 进入 Moodle 网站首页，寻找一个写着**登录**的链接。这取决于你的\
  \ Moodle 网站所使用的“主题”，但可以查看页面中下方或右上角（如果你实在找不到这个链接，请联系你的 Moodle 管理员）。点击**登录**链接，打开登录页面：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_30_0.png)\n\n## 刚才发生了什么？\n\n你刚刚登录了 Moodle。如果这是你第一次登录，系统可能会要求你修改密码：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_32_0.png)\n\n只需按照屏幕上的说明操作即可（我们将在本章后面介绍如何修改密码）。\n\
  \n每个用户都有一个个人资料，你可以在其中向大家介绍自己。在下一节中，我们将学习如何修改个人资料。\n\n## 操作时间——编辑个人资料\n\n- 1. 找到**设置**版块，在上面的截图中，它是左侧底部的一个方框。点击**编辑个人资料**链接。此时会显示**编辑个人资料**页面：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_34_0.png)\n\n- 2. 请注意，我的管理员已将 Moodle\
  \ 配置为禁止我修改**名字**、**姓氏**和**电子邮件地址**。这没什么问题，而且在我使用过的大多数 Moodle 网站上都很常见。你也许可以修改这些信息。基本上，如果你的个人资料页面和我的不完全一样，不用担心。\n\
  \n- 3. 下面来修改我们的个人资料描述。向下滚动到**描述**框（**描述**这个词是红色的，旁边有一个红色小星号），然后输入一段关于你自己的描述：\n\n\
  ![](img/1529021fde33ef551603bbc71587313e_35_0.png)\n\n- 4. 如果你习惯使用文字处理软件，那么编辑器顶部的这些按钮对你来说（大部分）会比较熟悉。在阅读本书的过程中，我们会逐步了解这些按钮的功能。\n\
  \n- 5. 当你对个人资料设置满意后，向下滚动到页面底部，按下**更新个人资料**按钮。不必担心在个人资料页面中修改设置，你随时可以回来再次更改。\n\n-\
  \ 6. 就这样，完成了！\n\n### 刚才发生了什么？\n\n将课程转换到 Moodle，意味着我们将拥有一个“Moodle 身份”，也就是我们的 Moodle\
  \ 个人资料。我们刚刚修改了个人资料页面，通过**描述**设置，让我们的 Moodle 同伴对我们有更多了解。\n\n\n\n\n\n## 动手实践\n\n你的\
  \ Moodle 管理员是否允许你上传自己的照片？返回你的**编辑个人资料**页面，找到**用户图片**框：\n\n![](img/1529021fde33ef551603bbc71587313e_36_0.png)\n\
  \n点击**浏览**按钮，在电脑上寻找合适的图片。不用担心尺寸（最好是100x100像素），如果图片太大，会被裁剪。\n\n> **找不到“用户图片”设置？**\n\
  > \n> 我遇到过很多学生要么“发挥创意”（我该这么说吗）地使用从 Moodle 获取的头像，要么上传不太适合自己个人资料的照片。所以，如果这个设置被关闭了，不用太担心；而且如果你觉得学生们可能会决定开始美化你的照片，那么你的个人资料最好不要选自己的照片！\n\
  \n## 修改密码\n\n假设你的 Moodle 管理员允许你修改密码，如果你需要更改密码，只需返回你的个人资料页面（记住，无论在哪里看到你的名字，点击它就会显示你的个人资料页面）。在你的个人资料页面上，你会看到**修改密码**链接（在**设置**区块中）：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_36_1.png)\n\n## 做好你的工作 – 你的角色\n\n本书面向教育工作者。Moodle\
  \ 用“教师”一词来描述布置作业并评分的人。但就 Moodle 而言，只有当你身处一门需要布置作业和评分的课程中时，你才是一名“教师”。用 Moodle 的话说，你扮演的是“教师”这个角色。如果你认为仅仅因为自己是教师（也就是说，这是你的工作）就会在登录\
  \ Moodle 后成为任何 Moodle 课程中的教师，那就大错特错了。这就像说你可以走进某位同事的教室，开始上他们的课。你不会那样做，Moodle 里的道理也是一样的。\n\
  \n## 谁决定课程由谁授课\n\n通常来说，在 Moodle 课程中让你成为教师的人就是创建该课程的人，通常是你的部门负责人或 Moodle 管理员。也许你被赋予了创建课程的任务，这就是\
  \ Moodle “课程创建者”的角色。他们可以创建课程并分配角色。有趣的是，他们不能删除课程，他们没有这个权限。角色的概念与权限的概念密切相关。让我们在下一节看看权限。\n\
  \n## 权限\n\nMoodle 在“责任划分”原则上非常严格，不同的角色拥有不同的权限：\n\n- **管理员**：对 Moodle 安装拥有完全的、神一般的权力。可以说，能做任何事情。但如果你请求他做某事，他大概不会做。\n\
  - **经理**：比管理员的权力稍小。这个角色相当于副校长或校长助理。可以创建和删除课程，并将用户分配到课程中。有些事情他们不能做，例如更改 Moodle 的站点配置设置。\n\
  - **课程创建者**：可以创建新课程并编辑它们。有趣的是，他们没有删除课程的能力。\n- **教师**：可以编辑和使用现有课程，但不能创建新课程。他们可以给学生提交的作业评分。\n\
  - **无编辑权限教师**：可以评分和教学，但不能编辑课程。\n- **学生**：可以提交作业、参加测验，可以在论坛和聊天中与其他课程成员互动。学生不能编辑课程、布置或批改作业。\n\
  \n你的角色取决于你在哪里。例如，我白天是一名教师，但晚上我在夜校是一名学生。我的角色取决于“情境”（在一个地方是教师，在另一个地方是学生）。Moodle 也是如此，确保你不要把自己的职务头衔与特定情境中的角色混淆。我以用户身份登录\
  \ Moodle，而不是以教师身份。让我们在下一节看看情境。\n\n## 情境\n\nMoodle 中有哪些不同的情境？以下是基本场景：\n\n- ♦ 我刚登录\
  \ Moodle。在这种情况下，我是一个已认证用户。\n- ♦ 我刚选了一门课。我不得不选课这一事实表明，在这种情境下我是学生。如果我的 Moodle 管理员让我在这门课上担任教师，那么在这种情境下我就是一名教师。\n\
  - ♦ 课程可以包含在类别中。类别是分组 Moodle 课程的一种方式。当我查看一个类别时，我发现自己可以创建课程。在课程类别情境中，我是课程创建者。请注意，我不能创建类别，我没有这种权限。如果你需要创建类别却发现自己不能，你需要找的第一位联系人就是你的\
  \ Moodle 管理员。\n\n你的 Moodle 管理员或经理（从现在开始，我将用“管理员”一词来指代这两种角色）可以在特定情境中授予你特定角色。仅仅因为你在一种情境中是课程创建者，并不意味着你在另一种情境中也是课程创建者。\n\
  \n## 小测验 – 我的角色是什么？\n\n我刚刚点击了一个类别来查看其中的课程。我看到有一个标有“添加新课程”的按钮。在这种情境下，我的角色是什么？\n\n\
  - ♦ 教师\n- ♦ 访客\n- ♦ 课程创建者\n- ♦ 学生\n\n## 我为什么提到这一切\n\n嗯，你可以看到，运营一个 Moodle 站点有很多不同的方式，所以我们在写这本书时不得不做一些假设。这本书的目标读者是希望（或需要）将课程迁移到\
  \ Moodle 的教育工作者。因为你是这样的角色，我假设如果有任何需要执行的管理任务，你的 Moodle 管理员会代你执行；我假设 Moodle 管理不是你的工作。这就是为什么在某些章节末尾，你会看到一个名为“问问管理员”的特殊部分。\n\
  \n不仅仅是角色和权限会随着你的 Moodle 站点而改变。站点的外观和感觉也可能不同。让我们花点时间看看 Moodle 的用户界面。\n\n## Moodle\
  \ 外观与感觉\n\n正如我们已经讨论过的，Moodle 的一大优点是其一致的用户界面。我这么说是什么意思呢？一种理解 Moodle 的方式是把它看作一套教学工具：一个论坛、一个维基、一个聊天工具等等。因为用户界面是一致的，你学会如何使用一个工具后，就能轻松掌握其他工具的使用方法。你会发现所有\
  \ Moodle 站点都有一种熟悉的感觉：它们看起来不同，但使用方式都一样。那如何让它们看起来不同呢？\n\n## Moodle 主题\n\n你可以为 Moodle\
  \ 设置主题，这意味着你可以应用自定义颜色和页面设计（几乎就像换了一层新皮肤）。你可以在页面顶部指定自己的横幅，在底部指定自己的页脚。你可以重新排列页面上的项目。但你无法改变\
  \ Moodle 站点的行为方式。Moodle 的行为方式始终如一，当你看到一个 Moodle 站点时，你会认出它来。\n\n本书图片中你会看到的 Moodle\
  \ 主题（我的 Moodle 的主题）叫做“标准”。你的管理员很可能在使用不同的主题。别让这影响你。请记住，主题只是改变了 Moodle 的外观，而非其行为方式。\n\
  \n所有 Moodle 页面，无论主题如何，都包含某些“标准”元素。在下一节中，我们将全面了解它们。\n\n## 一个 Moodle 页面\n\n构成 Moodle\
  \ 页面的部分有哪些？让我们从页面顶部开始，一直往下看。\n\n## 面包屑导航\n\n在页面顶部，你会看到一串链接，告诉你当前在 Moodle 站点中的位置：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_41_0.png)\n\n它被称为面包屑导航（也称为“导航栏”），是返回已知位置的便捷方式。例如，如果我点击面包屑导航中的**查看个人资料**，就会进入我的**个人资料**页面。如果我点击面包屑导航中的**首页**，就会返回站点首页。\n\
  \n## 区块\n\n让我们看看 Moodle 课程首页：\n\n![](img/1529021fde33ef551603bbc71587313e_41_1.png)\n\
  \n\n\n\n\n## 走向电子化\n\n在页面的左侧和右侧你可以看到区块，例如右上角的 **Calendar** 区块。你可以在课程首页上包含若干标准区块。管理员也可以安装自定义区块。在\
  \ Moodle 中你会经常看到使用的区块是 HTML 区块。这种类型的区块允许我们在页面的左侧和/或右侧包含我们自己的基于网络的内容。上一张截图中的 **Welcome**\
  \ 和 **Useful Links** 区块就是 HTML 区块。\n\n中间是主要的课程区域，这里是你会找到主要资源和活动的地方（区块通常用于补充信息或支持）。\n\
  \n如果你使用的是笔记本或屏幕较小的笔记本电脑，那么你可能会觉得课程页面有点拥挤。每个区块都有一个隐藏图标：\n\n![](img/1529021fde33ef551603bbc71587313e_42_0.png)\n\
  \n例如，点击隐藏 Navigation 区块图标会折叠该区块：\n\n![](img/1529021fde33ef551603bbc71587313e_42_1.png)\n\
  \n在每个隐藏图标旁边是移动到停靠栏的图标：\n\n![](img/1529021fde33ef551603bbc71587313e_43_0.png)\n\n\
  停靠栏非常适合屏幕较小的笔记本或笔记本电脑，因为它会将侧边区块移开，而不会完全隐藏它们：\n\n![](img/1529021fde33ef551603bbc71587313e_43_1.png)\n\
  \n将鼠标悬停在停靠栏中列出的区块名称上，该区块就会显示出来（同时也会显示取消停靠此项和删除图标）：\n\n![](img/1529021fde33ef551603bbc71587313e_44_0.png)\n\
  \n## Footer\n\n页面的底部是页脚：\n\n![](img/1529021fde33ef551603bbc71587313e_44_1.png)\n\
  \n## Summary\n\n现在我们与 Moodle 的旅程已经开始，我们已经对该系统有了很多了解。\n\n具体来说，我们涵盖了：\n\n- **The origins\
  \ of Moodle**：我们了解到 Moodle 是由一位在家上学的人构想出来的。Martin Dougiamas 设计了一个系统，通过分享知识来支持协作和学习。虽然这是其底层教学法，但我们了解到\
  \ Moodle 可以支持许多不同的学习风格。\n- **How to log on to Moodle**：我们学习了如何更改密码，并介绍了在忘记密码时需要做什么。我们还介绍了如何确保你已注销。我们不希望学生能够冒充你进入系统。\n\
  - **Modifying our user profiles**：我们看到 Moodle 管理员可以“锁定”我们用户资料的某些方面（我的 **First name**、**Surname**\
  \ 和 **Email** 字段已被锁定）。但我仍然可以修改我的描述，我们也看到了如何做到这一点。\n- **Roles and capabilities**：我们看到不同角色具有不同的能力，并且你的角色取决于上下文。例如，我在自己教授的课程中是教师，但在我注册的课程中我是学生。\n\
  - **Moodle look-and-feel**：我们一起了解了构成 Moodle 页面不同元素的知识。\n\n我们还简要讨论了我们将在本书其余部分涵盖的内容。\n\
  \n现在我们对 Moodle 有了感觉，我们准备配置一个 Moodle 课程，这是下一章的主题。\n"
- "# 2 设置你的课程\n\n在上一章中我们开始了 Moodle 之旅。在本章中，我们将了解如何为将部门的课程迁移到 Moodle 奠定基础。本章中我们将：\n\
  \n- 学习如何将学术课程大纲映射到若干 Moodle 课程\n- 创建一个新的 Moodle 课程并为其命名和描述\n- 为课程设置合适的结构\n- 为课程分配教学人员\n\
  - 为课程设置注册方法\n\n到本章结束时，你的课程将被设置好，并准备好开始填充内容。\n\n### From curriculum to courses: What\
  \ counts as a Moodle course\n\n让我们从我描述我将与大家一起在本書中转换到 Moodle 的课程开始。该课程名为“Backyard\
  \ Ballistics”，它是一门科学课程，是应用物理资格认证的一部分。该课程全部关于用你能在普通家庭厨房和花园棚中找到的化学品和设备，将奇怪的物体通过空气发射的艺术。\n\
  \n## Setting up your Courses\n\n我无法将该课程的某些方面转换到 Moodle。我希望我的学生通过使用家中随处可见的日常用品“动手做”科学，来领略能量和动力学的精髓，这是一种动觉学习。但目前我尝试使用学院服务器上的“共享驱动器”以电子方式分发大量支持材料、手册、图表和测验。然而，我的学生永远找不到我告诉他们去寻找的材料。至少，这是他们的借口。但我必须承认，经过几年的使用，我们的共享驱动器开始变得有点乱糟糟。正如你在接下来的几章中会看到的，将这些资源迁移到\
  \ Moodle 绝对会解决这个问题。\n\n但我把这些资源放在 Moodle 的哪里？答案是，你把它们放到一个 Moodle 课程中。以下是 Moodle 课程的一个片段的截图：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_48_0.png)\n\n我将我的课程分为六个主题：\n\n- Getting\
  \ Things Flying\n- Lighter Than Air: Hydrogen Filled Balloons\n- Fire Kites\n- Basic\
  \ Rocketry: The Match Rocket\n- The World Famous Tennis Ball Mortar!\n- Backyard\
  \ Ballistics: End of Course Project\n\n我选择将 Backyard Ballistics 转换为主题的原因部分是因为我就是这样教授它的，部分是因为我很乐意让学生“深入”我已转换到\
  \ Moodle 的资源和活动。我将在本章后面谈论如何将课程内容分解为主题（这不是唯一的方式：你也可以按周来分解课程）。在我们查看如何获取课程并开始添加内容之前，我们确实需要了解\
  \ Moodle 认为课程是什么以及 Moodle 如何组织它们。\n\n## What is a Moodle course\n\n你现在可以清楚地看到，最基本地说，Moodle\
  \ 课程是资源和活动的占位符。显然它远不止于此，正如你在阅读本书时会学到的。Moodle 相对于共享驱动器的一个明显优势是，资源和活动的链接可以与文本和图形交织在一起，使体验更具视觉吸引力和吸引力，并且我上传的资源易于查找（我现在不再接受任何借口）。\n\
  \n## How Moodle organizes its courses\n\n让我们快速看看如何在 Moodle 中组织课程。\n\n为了帮助组织课程，Moodle\
  \ 有类别和子类别的概念：\n\n![](img/1529021fde33ef551603bbc71587313e_49_0.png)\n\n请记住，你只会在\
  \ Moodle 课程中找到资源和活动。类别和子类别仅用于帮助你组织和管理课程的组织。\n\n那么在实践中是如何运作的呢？例如，我在 **Physics** 部门工作，属于\
  \ **Faculty of Science**。我的 **Backyard Ballistics** 课程支持 **Applied Physics** 资格认证。这就是我们如何安排类别和子类别的：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_50_0.png)\n\n我相信你能为你的学科领域想到例子。你可以有一个名为\
  \ English 的类别，其中包含两个子类别 Literature 和 Language。在文学中，你可以对所教授的指定文本的特定方面开设短期课程。你可以有一个\
  \ 20th Century History 类别，其中包含 Britain、Germany、France、Italy 和 USA 的子类别。每个国家子类别可以包含进一步的子类别，如\
  \ Politics、Society 等等。\n\n由于这是在你首次开始使用 Moodle 时的关键问题，让我们花点时间研究一下在将面对面教学转换为 Moodle\
  \ 时常见的几种方法。\n\n## Breaking up is hard to do\n\n你如何拆分面对面、传统教授的课程，取决于你工作的年龄组和学科领域，所以让我们研究一些例子。\n\
  \n较年幼的孩子通常对所有科目都有同一位老师。在这种情况下的学校通常会根据年级对 Moodle 课程进行分类，而在年级内，每位教师都会拥有自己的子类别，在该子类别中他们可以自由创建和删除课程：\n\
  \n\n![](img/1529021fde33ef551603bbc71587313e_51_0.png)\n\n每位教师都有自己的 Moodle 课程，这样孩子们更容易找到已上传的资源和为他们创建的活动。\n\
  \n随着孩子们年龄的增长，你可以根据孩子的年龄和能力，为不同科目开设不同的 Moodle 课程。现在，我可以为每个年级建立一个类别，并在其中为每个学科领域建立子类别：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_51_1.png)\n\n数学教师不必只教一门课程，而是可以在九年级教一门，十年级教两门，十二年级再教一门。随着学科领域的扩展和需要讲授的内容不断增加，你可能需要考虑为特定学科领域（尤其是学生容易遇到困难的领域）建立\
  \ Moodle 课程。\n\n随着学生年龄的增长，事情往往会变得更容易，因为由外部考试机构考核的资格证书会有自己的教学大纲。仔细阅读教学大纲，你通常能立刻看出如何将学科分解为若干门\
  \ Moodle 课程。例如，数学自然可分为以下几类：\n\n- 数\n- 代数\n- 几何（形状、空间和度量）\n- 数据处理与统计\n\n在每个类别中，学科领域之间也会自然地形成划分。看看你是否能在自己的学科领域中发现类似的模式。\n\
  \n对于年龄更大的学生（即大学或学院年龄段的学生），科目通常已经按单元进行教学。例如，一个为期 10 周的短期单元就是 Moodle 课程的理想候选。\n\n\
  在结束本节之前，我再给你几点想法。其一，Moodle 课程也可以用于培养学生的关键技能。关键技能的例子包括：\n\n- 沟通交流\n- 数字应用\n- 信息与通信技术\n\
  - 问题解决\n- 协作\n\n其二，Moodle 课程并非一成不变；一旦创建，你可以根据需要随时修改。稍后你还会在本书中看到，Moodle 课程不同方面的职责可以下放给你的学生，让所有人共同协作来完善你的课程页面。\n\
  \n## 动手实践——培养关键技能\n\n尝试找出支持培养某一关键技能的课程。如果关键技能是你所在学校或学院的重点，那么你手头肯定已经有很多基于技能的教学材料，可以将它们转化为\
  \ Moodle 课程。\n\n## 如有疑问，召开会议\n\n在本节中，我们一直在探讨如何拆分传统面授课程，以及找出哪些内容可以转化为 Moodle 课程。你可以按照传统思路进行拆分，也可以从关键技能或学习风格的角度来解决问题。这是一个极其复杂的问题，无疑需要与系里的同事讨论。我强烈建议你召开一次\
  \ Moodle 会议，首先讨论要创建哪些课程。利用这个机会讨论由谁教授这些课程，以及它们应该归入哪些类别。在你开始在 Moodle 中进行任何操作之前，尽量做好规划。\n\
  \n记得让 Moodle 管理员也参加这些会议，特别是当管理员负责创建类别和课程时。\n\n既然我们已经知道了需要哪些 Moodle 类别和课程，就可以专注于创建和运行这些课程了。\n\
  \n## 让我们开始：设置课程\n\n本书的其余部分将只专注于一门课程。如果你要把整个系都放到 Moodle 中，那么你将有很多课程需要处理。这就是为什么将课程创建工作分配给其他教学人员、让他们分担工作会如此有用。我们也会向你展示如何做到这一点。\n\
  \n## 创建你的课程\n\n在开始构建课程之前，需要先在 Moodle 中“创建”课程。如果你在学校或大学工作，可能的创建方式有三种：\n\n- 管理员已经创建：有时，管理员会为一所学校开设的所有正式课程创建空白课程。\n\
  - 提交请求：在其他情况下，管理员要求教师申请新课程；管理员批准后，课程即被创建。\n- 自己创建：在其他情况下，你可能拥有自行创建课程的权限。如果是你自己安装的\
  \ Moodle，那么你肯定有创建课程的权限。\n\n为什么你不能创建课程，而你的同事却可以？我们将在下一节中讨论这个问题。\n\n## 你需要自己创建课程吗\n\
  \n你可能会很幸运，管理员可能已经把你设为经理或课程创建者，这意味着你可以创建自己的课程。请注意，经理比课程创建者拥有稍多的权限。例如，经理可以创建和删除课程，而课程创建者只能创建课程。要判断自己是否是课程创建者或经理很容易：只有当你查看\
  \ Moodle 类别，或点击**所有课程**按钮来显示 Moodle 中的全部课程时，你才会看到**添加新课程**按钮。一旦找到**添加新课程**按钮，只需按下它即可创建新课程，你会立刻进入新课程的设置页面。\n\
  \n## 设置你的课程\n\n## 如果已经有人为你创建了课程\n\n眼前的问题是如何找到它。回到你的网站首页。你能看到**导航**版块吗？（默认情况下，导航版块位于页面左上角）。点击**我的课程**链接，就会显示出你的课程列表：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_54_0.png)\n\n如果你的网站首页没有**导航**版块，最简单的办法是点击你的姓名（通常可以在页面顶部的右侧找到），随后会显示你的用户资料。你的资料中会列出你参与的课程：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_54_1.png)\n\n课程名称**Backyard Ballistics**是一个链接，我点击它来查看我在课程中的角色。从下面的截图可以看到，我的系主任已让我担任**Backyard\
  \ Ballistics**课程的教师：\n\n![](img/1529021fde33ef551603bbc71587313e_55_0.png)\n\n就我而言，我可以点击**导航**版块中**我的课程**下的**MCC-BC**链接。如果没有**导航**版块，我也可以点击屏幕顶部导航栏中的面包屑导航：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_55_1.png)\n\n## 设置你的课程\n\n我现在来到了我的课程页面。这是一个基于\
  \ 10 周结构的空白课程，已经可以开始配置了：\n\n![](img/1529021fde33ef551603bbc71587313e_56_0.png)\n\
  \n## 小测验\n\n课程创建者和经理之间有什么区别？\n\n## 配置你的课程\n\n现在让我们来配置一个名为 Backyard Ballistics 的基于主题的课程。在“课程管理”下的“设置”版块中，点击“编辑设置”。这会带你进入课程设置页面：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_57_0.png)\n\n## 实际操作——配置 Backyard Ballistics\
  \ 课程\n\n让我们从创建我的 Backyard Ballistics 课程开始。我现在并不太担心微调问题，只想让它先运行起来；等基础功能就绪后，我们再进行微调：\n\
  \n1. 在“课程全称”旁输入课程标题：Backyard Ballistics。\n2. 输入课程简称。该简称必须完全唯一（如果另一个课程使用了相同简称，Moodle\
  \ 会报错）。我将指定为 MCC-BC。\n3. 使用 WYSIWYG（所见即所得）HTML 编辑器输入课程摘要。可以看到，我们可以像使用文字处理器一样对描述进行格式化：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_57_1.png)\n\n+   4. 找到**格式**设置（几乎就在**课程摘要**编辑器正下方）。点击下拉菜单并选择**主题格式**。\n\
  +   \n+   5. 因为我们刚刚创建课程，暂不希望学生选课，所以向下滚动到可用性选项。点击**可用性**下拉列表，选择**本课程对学生不可用**。\n+\
  \   \n+   6. 设置基础课程所需做的就这些。滚动到底部并点击**保存更改**。\n\n如果你是从零创建这门课程，现在会进入**已选课用户**界面。我们暂时不讨论角色，因此现在请点击屏幕底部包含课程短名称（现在是\
  \ **MCC-BC**）的按钮，前往课程主页。如果你是在配置已有课程，无论如何你都会直接返回课程页面。\n\n## 刚才发生了什么？\n\n我们创建了一门新课程，并为其设置了全称、简称和摘要。我们还配置了课程，使其按主题来划分（新安装\
  \ Moodle 的默认格式是每周）。其他所有设置保持默认，以便稍后修改。现在你已经有了一门分为 10 个“主题”的课程，可以随时添加内容。\n\n然而，并非每门课程都能正好划分为\
  \ 10 个主题。所以下一项任务是确保我们的课程结构正确。我们将在下一节来做这件事。\n\n但在那之前，关于创建课程，你还需要了解几点：\n\n- 为课程摘要选择有效的描述\n\
  - 使用编辑器\n- 获取 Moodle 设置方面的帮助\n- 返回课程设置界面\n\n现在让我们来看这些内容。\n\n## 为课程摘要选择有效的描述\n\n\
  每当你的课程与其他课程一同列出时，摘要都会显示，因此如果你希望课程脱颖而出，请尽量用简短直接的方式描述它。摘要通常是学生在选课前最先接触到的课程内容，所以你应该利用摘要让课程尽可能有吸引力。另外，要记住你的目标受众：如果你使用\
  \ Moodle 课程仅仅是为了辅助课堂教学，那么摘要的重要性远不如你想吸引潜在学生或其家长关注时那么高。\n\n## 使用编辑器\n\n习惯使用编辑器很重要，因为我们以后会经常用到它。大多数按钮与你在任何文字处理器中看到的相同，而且我假设你已经相当熟悉文字处理器，所以不会逐一介绍所有“标准”格式化按钮（包括插入符号和拼写检查）。以下四个“非标准”按钮会很有用：\n\
  \n| 图标 | 功能 | 用途 |\n|---|---|---|\n| [笑脸图标] | 插入笑脸 | 有时学生很难判断你写的话是玩笑还是讽刺。使用笑脸可以强调你的认真程度：如果是开玩笑，就插入一个眨眼表情；如果是讽刺，就插入一个咧嘴笑的表情。\
  \ |\n| [从 Word 粘贴图标] | 从 Word 粘贴 | 如果你从 Word 粘贴，往往无法让文本正确格式化。“从 Word 粘贴”按钮可能会解决这个问题。\
  \ |\n| [清理杂乱代码图标] | 清理杂乱代码 | 如果你不是从 Word 而是从其他应用程序（比如 PowerPoint 或网页）粘贴，同样可能遇到粘贴文本无法正确格式化的问题。粘贴文本后，点击“清理杂乱代码”按钮即可修正。\
  \ |\n| [粘贴为纯文本图标] | 粘贴为纯文本 | 如果你在编辑粘贴后的文本时仍有问题，可以尝试用此按钮粘贴到编辑器中。它只粘贴你复制的文本，不包含任何格式（因此在粘贴到编辑器后，你需要重新排版）。\
  \ |\n\n另一个有用的控件（而不是按钮）是编辑器右下角的调整大小控件：\n\n![](img/1529021fde33ef551603bbc71587313e_59_0.png)\n\
  \n用鼠标光标单击编辑器一角并拖动，即可放大或缩小编辑器。\n\n记住：你只能将其他软件程序中的文本剪切并粘贴到编辑器中。不要尝试剪切和粘贴图片。图片需要复制到运行\
  \ Moodle 的计算机上。我们将在*第 4 章“声音与视觉——包含多媒体内容”*中讨论上传图片。\n\n我们会在需要时逐一介绍其余“非标准”按钮。\n\n\
  ## 获取 Moodle 设置方面的帮助\n\n我在课程设置页面中故意跳过很多选项，并且在设置课程的过程中也会继续这样做。不过，Moodle 在帮助您理解每个单独设置方面做得很好。你可以点击附近的问号图标获取任何\
  \ Moodle 功能的帮助。\n\n例如，如果你点击了**课程简称**旁边的 ?，你会看到如下内容：\n\n![](img/1529021fde33ef551603bbc71587313e_60_0.png)\n\
  \n## 更多文档\n\n如果这些帮助还不够，你可以在 Moodle 的大多数页面底部获取整页帮助。只需滚动到页面底部，点击**本页的 Moodle 文档**。这会带你进入\
  \ Moodle 网站的文档部分，那里有最新且不断扩充的文档：\n\n![](img/1529021fde33ef551603bbc71587313e_61_0.png)\n\
  \n## 返回课程设置界面\n\n请记住，Moodle 中没有什么是不可更改的。如果你想修改已创建课程的设置，可以随时返回。在查看课程时，点击屏幕左侧“课程设置”版块中的“编辑设置”。然后你就会回到课程设置界面，在那里可以更改标题、描述和其他设置。\n\
  \n## 课程结构与格式\n\n课程分为多个部分。一个部分的具体含义取决于课程的格式。如果你是 Moodle 新手，有两个重要的主要格式：\n\n- 每周格式：每个部分代表一周的学习内容\n\
  - 主题格式：每个部分代表一个特定主题或课程的一个方面\n\n对于你的前几门课程，尤其是基于现有非电子学习材料的课程，你可能只会用到这两种。不过还有其他格式：\n\
  \n- SCORM：第三方电子学习材料很可能会以 SCORM 格式提供给你（SCORM 是一种教育资源“标准”格式，就像文档以“.DOC”格式提供一样）。如果你知道\
  \ SCORM 是什么，那么这是一种有用的课程格式类型。如果你从未听说过 SCORM，也不必担心。\n\n- **社交格式**：整个课程围绕一个论坛展开。这在用\
  \ Moodle 管理并非严格意义上的课程时很有用。你可以用它来建立系部公告栏，或者为课后俱乐部、复习活动建立讨论论坛，或者（正如我曾就职的一所学校那样）用来帮助组织\
  \ 11 年级的毕业舞会。\n\n要将课程放入 Moodle，你需要选择适合课程结构和材料的格式。\n\n## 我们应该使用哪种格式：每周格式还是主题格式\n\n\
  首先，以下是每周格式和主题格式的主要区别。\n\n主题格式：\n\n- 由可以任意长度的已命名部分组成\n- 可以有一个主题、三个主题或 20 个主题\n- 每个主题可以包含任意数量的信息\n\
  - 每门课程最多可有 52 个主题\n\n每周格式：\n\n- 由固定数量的周组成——每个部分正好持续一周\n- 有明确的开始日期——每周对应一组精确日期，不是“第\
  \ 1 周”“第 2 周”等，而是“3 月 3 日–10 日”\n- 每门课程最多可有 52 周\n- 如果课程跨越两个学期，请记得把学期休息时间也包含在内。\n\
  \n那么，每种格式分别适合什么时候使用呢？\n\n主题格式通常在以下情况下最合适：\n\n- 学生按自己的节奏学习，或在学习中自我指导——他们会从整个课程中挑选资源，而不受任何特定顺序的约束\n\
  - 课程被划分为一个接一个的主题，但每个主题并不都持续一周\n- 有些主题是可选的，不是所有学生都会学习，或者会在不同时间学习\n- 不同的学生群体会在不同时间使用该课程\n\
  \n\n\n\n每周格式通常在以下情况下最佳：\n\n- 有一个明确定义的时间表\n- 课程有明确的开始日期\n- 你想用特定的截止日期来强化学生的学习（尽管在每周格式的课程中，你仍然可以随时访问所有材料和活动）\n\
  \n如果你是 Moodle 的新手，那么至少起初，我建议你坚持使用主题格式课程。我第一次开始教学时，我会尝试计划该学期要教授的内容，但很快就全部脱离轨道了，因为我必须判断接下来要进入哪些主题，这完全取决于班级对我们迄今为止所学内容的掌握情况。Moodle\
  \ 也是如此，这也是为什么在学校或学院中很少能找到使用每周格式的 Moodle 课程。\n\n每周格式非常适合你将一门需要学生为自己安排时间的课程转换过来，并且你作为教师，知道课程中接下来会有什么内容以及何时出现。有了每周课程，你的学生有机会提前查看，他们会知道何时需要为困难/额外的工作做好准备。同样，如果你正在将课程转换为支持学徒制或在职实习的学生，请考虑每周格式课程是否会是更好的选择。\n\
  \n## 快速测验\n\n如何将你的课程格式从主题更改为每周？\n\n## 将课程拆分为主题\n\n你现在已经确定了课程，但需要将课程拆分为 Moodle 主题。实现此目的最常见的方法有：\n\
  \n- **按顺序**：某种叙述性顺序。基本上，遵循读者应学习的顺序\n- **按资源类型**：练习表、手册、网络资源\n- **按“真实主题”**：每个部分收集课程中一个主题的资源，即使课程不一定按这些主题的顺序进行\n\
  \n每种方法都有利有弊。每种方法在特定情况下都是理想的。\n\n你甚至可以组合它们，例如，建立一组映射到有序单元集的主题，并在末尾添加一些无序单元，涵盖例如贯穿整个课程的个人研究项目相关的资源。\n\
  \n我将我的《后院弹道学》课程拆分为五个主题，因为在转换为 Moodle 之前它就是这样构建的，五个主题是自然的契合。\n\n如果你担心在转换为 Moodle\
  \ 时应如何构建课程，请记住你随时可以回来更改。经常更容易开始将课程转换为 Moodle，而这样做的过程本身会帮助你看到事物应如何组织。\n\n## 设置课程格式\n\
  \n正如你已经看到的，我的《后院弹道学》课程围绕六个主题构建。让我们看看如何使用 Moodle 设置这种课程结构。\n\n### 行动时间 – 设置课程格式\n\
  \n1. 返回课程设置屏幕。\n2. 从格式选项中，选择主题格式或每周格式。对我来说，我将选择主题格式：\n\n![](img/1529021fde33ef551603bbc71587313e_64_0.png)\n\
  \n3. 选择主题/周数。我已为我的课程计划了六个主题。\n4. 对于每周课程，请确保设置开始日期。\n5. 现在滚动到页面底部并按下保存更改按钮以返回课程页面：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_65_0.png)\n\n### 刚才发生了什么？\n\n我刚刚将我的《后院弹道学》课程拆分为五个“主题”，即五个编号的框，因为这就是现实世界中我的课程结构。同样，五个主题是自然的契合。\n\
  \n在课程填充内容后，你仍然可以调整课程中主题/周数。然而，如果你减少数量，则后面的主题将消失。因此，如果你有 10 个主题，后来减少到 8 个，你添加到第 9\
  \ 和第 10 个主题中的任何内容都将从视图中消失，但仍然存在（并且如果有人为其添加了书签，仍然可以访问）。这是一种技术，你可以用它在面对面教学进展时揭示教学材料和活动（这样你的学生就不会在你尚未教授的主题上提出大量问题）。\n\
  \n你也可以随时在每周和主题视图之间切换。\n\n## 定义每个主题/周\n\nMoodle 现在为你提供了正确数量的部分或“插槽”来填充课程内容。但每个主题都是空白的，它缺乏任何标题或描述，更不用说教育内容了。\n\
  \n让我们为课程中的每个部分添加描述。\n\n### 行动时间 – 定义每个周/主题\n\n1. 返回你的课程页面。确保你已打开编辑模式，通过点击屏幕右上角的打开编辑按钮或点击设置块中的打开编辑链接：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_66_0.png)\n\n2. 点击你想要编辑的主题编号旁边的手和笔图标（将鼠标悬停在图标上会显示有用的“编辑摘要”提示）：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_67_0.png)\n\n3. 现在输入主题的简短摘要。此摘要也必须用作主题标题。你可能想使用富文本格式来区分标题和其余文本：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_67_1.png)\n\n4. 完成后，按下保存更改按钮，你将返回课程，新的摘要已就位。如果你想取消更改，只需按下取消按钮即可。\n\
  \n这将现在出现在课程顶部：\n\n![](img/1529021fde33ef551603bbc71587313e_69_0.png)\n\n### 主题/周的更多设置\n\
  \n除了添加摘要外，当你在主页上且处于编辑模式时，我们还可以对每个主题做其他事情：\n\n| 图标 | 功能 | 用途 |\n| --- | --- | ---\
  \ |\n| ↑ ↓ | 更改主题顺序 | 点击上下箭头重新排序你的主题。<br><br>请注意，对于每周课程，主题会移动，但与主题关联的日期不会立即更改。重新加载课程页面将确保所有周都被正确“重新编号”。\
  \ |\n| □ | 显示所有主题或一次只显示一个 | 此按钮让你选择是整页显示整个课程，还是一次只显示一个主题。当每个主题开始包含大量资源和活动时，一次只显示一个主题可能很有用。<br><br>学生也可以使用此按钮，并且即使你不在编辑模式下也能工作。如果你惊慌失措，担心自己不小心删除了除一个之外的所有主题，很可能你点击了此按钮。再次点击它，一切应该都会恢复正常。\
  \ |\n|  | 隐藏主题 | 点击一个睁开的眼睛使特定主题不可见。主题将显示为对学生“不可用”，他们无法看到其任何信息或资源，或完全隐藏，这取决于课程设置页面中的**隐藏部分**选项。\
  \ |\n\n最后，也是最重要的，我们可以向我们的课程添加资源和活动。在后面的章节中，我们将看到如何将现有的课程材料转变为 Moodle 资源并通过我们的课程提供它们。\n\
  \n## 分配教学人员\n\n如果你独自在自己的 Moodle 上教学，就不必担心与同事合作。Moodle 中的每位员工通常会落入以下类别之一：\n\n- **管理员**：对\
  \ Moodle 有完全控制权。相当于首席执行官或学校校长。\n- **经理**：可以创建和删除课程。他们有进入你的课程并做你的工作的选项，但如果他们是传统的经理，他们可能不知道怎么做。\n\
  - **课程创建者**：可以创建新课程并编辑它们。默认情况下，课程创建者实际上不能删除课程。\n- **教师**：可以编辑和处理现有课程，但不能创建新课程。此角色可以添加新资源和活动，更改主题和设置。\n\
  - **非编辑教师**：可以评分作业和教学，但不能编辑课程。此角色只有在我们进入后面的章节中的交互式课程内容时才会变得相关。\n\n这取决于你在学校或学院的管理结构，但根据我的经验，最有效的方法是让系主任/院系负责人/团队负责人/Moodle\
  \ 倡导者，根据需要删除，担任其 Moodle 类别中的 Moodle 经理。然后他们为教学人员创建课程。如果你是课程创建者，那么我不需要告诉你不要在未经他们事先讨论的情况下将\
  \ Moodle 课程简单地丢给你的同事。我知道这种情况发生过，它只会引起大量敌意和相当多的反 Moodle 情绪。\n\n\n\n\n我们来看一个例子。在本书的其余部分，我们将研究如何将《Backyard\
  \ Ballistics》课程转换到 Moodle 中。不过，物理教学大纲中还有其他课程需要转换，包括《Jet in a Jam Jar》。作为课程创建者，你可以创建一个课程，然后将其分配给另一位教师，由该教师从那时起“开发”这个课程。\n\
  \n我打算创建一个新课程，然后将其分配给 Wild 先生作为编辑教师。\n\n## 动手操作——分配角色\n\n- 1. 使用之前描述的过程，在你的 Moodle\
  \ 中添加一门新课程。\n- 2. 在新课程页面的“设置”版块中，点击“用户”，然后点击“已选课用户”：\n\n![](img/1529021fde33ef551603bbc71587313e_71_0.png)\n\
  \n5. 你需要从潜在教师列表中选择你希望成为课程编辑教师的用户。如果你没有立刻在列表中找到你的同事，可以尝试使用对话框底部的搜索框：\n\n![](img/1529021fde33ef551603bbc71587313e_73_0.png)\n\
  \n6. 如果你需要的教职员工没有列出，那么他们需要一个登录账号（如果你的 Moodle 较新或尚未使用，这可以实现）。这是 Moodle 管理员的职责（不在本书讨论范围内）。\n\
  \n## 设置课程\n\n7. 要为你的同事选课，请按下其姓名右侧的 **选课** 按钮：\n\n![](img/1529021fde33ef551603bbc71587313e_74_0.png)\n\
  \n8. 完成更改后，点击“选课用户”对话框窗口右上角的关闭按钮。你的同事现在将作为教师列在课程中：\n\n![](img/1529021fde33ef551603bbc71587313e_74_1.png)\n\
  \n9. 在这门新课程中，是否有助教或学习辅导员与学生一起工作？你也许想将他们添加到所谓的“非编辑教师”列表中。你可以用完全相同的方式将用户分配到不同角色。\n\
  \n暂时不用担心在课程中分配学生。我们将在下一节讨论这个主题。\n\n## 刚才发生了什么？\n\n如果你不是唯一参与课程的教职员工，那么你会希望将同事分配为教师（既可以像你一样编辑课程，也可以是所谓的“非编辑”教师）、学习辅导员或课堂助理。我们探讨了如何通过课程“设置”版块中可用的“已选课用户”选项来实现这一点。\n\
  \n到目前为止，我们已经配置了课程结构并分配了教学人员。在下一节，我们将讨论如何让学生在课程中选课。\n\n## 放学生进来：让学生在课程中选课\n\n你的课程是由管理员为你创建的吗？你甚至可能已经进入“已选课用户”页面，发现你的课程中已有学生选课。如果没有关于让学生在\
  \ Moodle 课程中注册的通用策略，那么你有多种选择。让我们来看看。\n\n## 使用选课密钥选课\n\n让一个班级选课到课程上的最简单方法是设置一个选课密钥。这就像课程密码。然后每个学生尝试注册课程时，会被要求输入密钥。他们输入密钥后，嘿，转眼间就选课成功了。\n\
  \n## 动手操作——指定课程选课密钥\n\n- 1. 在你的课程“设置”版块中点击“用户”，然后点击“选课方法”：\n\n![](img/1529021fde33ef551603bbc71587313e_75_0.png)\n\
  \n**2.** 点击眼睛图标来启用 **自助选课（学生）** 方法（确保眼睛处于睁开状态）：\n\n![](img/1529021fde33ef551603bbc71587313e_76_0.png)\n\
  \n**3.** 点击 **自助选课（学生）** 的编辑图标（拿着铅笔的手）以打开 **自助选课** 配置页面：\n\n![](img/1529021fde33ef551603bbc71587313e_76_1.png)\n\
  \n4. 此页面上的大多数设置不言自明（你还记得如何查找特定设置的帮助吗？）但务必确保你已将 **允许自助选课** 设置为 **是**，并指定了选课密码。你可以根据需要将密码设置得简单或复杂：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_77_0.png)\n\n5. 完成后，滚动到页面底部并按下 **保存更改**\
  \ 按钮。\n\n6. 就这样，完成了！\n\n## 刚才发生了什么？\n\n我们刚刚为课程指定了一个选课密钥。如何把密钥告诉学生完全由你决定。当需要让学生选课时，我通常会把密钥写在白板上。大约一周后，我会回到课程设置并更改密钥（我通常只是在该密钥前加上字母“X”；如果我的学生中有人读到这本书，我以后不会再这样做了）。显然，更改密钥可以防止其他学生选课（尽管我努力尝试，但从未成功阻止学生互相传递密钥，而且如果我特别告诉他们不要传，他们似乎更愿意传）。\n\
  \n## 动手挑战——用密码让教师选课\n\n不仅学生可以使用密码自助选课。你是否注意到 **自助选课** 配置页面中的 **分配角色** 设置？也许你课程的所有成员都需要教师权限。这并不罕见，我最近遇到的两个例子是：一个供讲师使用的“教师休息室”课程，所有讲师都希望在该课程上拥有教师权限；另一个是为当地医院医务人员提供的支持课程。我们将在本书后面学习如何做到这一点。\n\
  \n## 其他选课选项\n\n到目前为止，我们已将课程配置为允许学生自动选课。但这并不是让学生选课的唯一选择。让我们看看其他选项。\n\n## 教师手动为学生选课\n\
  \n与其让学生自己选课（通常使用密钥），我们可能需要在课程中手动添加学生（如果不管出于什么原因，他们来晚了）。过程与我们分配教师时完全相同，因此我在这里简略介绍一下。在“设置”版块中点击“用户”，然后点击“已选课用户”以显示“已选课用户”页面。按下任一“选课用户”按钮以显示“选课用户”对话框。在对话框顶部的下拉菜单中选择你要分配的角色（例如，学生或教师），然后按下你希望分配该角色的用户姓名旁的“选课”按钮。\n\
  \n这往往是说起来容易做起来难。首先，你必须从列表中找到正确的学生。然后，你必须对课程中想要的每个学生都执行此操作。这可能需要很长时间。我不会推荐这个选项。如果注册不是自动的，让学生自己选课要好得多。\n\
  \n## 小组与小组选课\n\n你有没有和学生一起开展小组活动？在 Moodle 中你也可以这样做。我们将在第9章“整合在一起”中学习如何对学生进行分组，包括如何向不同小组分配不同任务的信息。\n\
  \n## 自由注册：让任何人选课\n\n如果你不指定密钥，那么任何注册用户都可以选课。这不是我推荐的选项，除非你的课程是你很乐意让任何人加入的课程，或者你的课程是每个注册用户都必须完成的必修课程。例如，你可以开设关于学校计算机使用政策的课程，或者开设强制性的健康与安全培训课程。\n\
  \n如果你的课程并非所有用户都必须修读，那么我强烈建议使用课程或小组选课密钥。你会发现，有些学生会把选课密钥传给朋友，或者（这往往更常见）传给家长，然后他们选课进来只是为了随便看看。这可能很麻烦，因为你会发现自己需要定期检查课程参与者名单，将那些不应该在那里的学生取消选课。解决这个问题的方法是，在课程开始大约一周后禁用选课。你还可以考虑制定不允许把密钥传给其他学生的规则，尽管制定这类规则往往会鼓励学生尝试去打破它们。\n\
  \n\n\n\n## 添加一个群组\n\n也许你的Moodle管理员已经将学生放入了一个群组。群组是一个全站范围的学生组。我们需要将课程配置为与一个或多个群组“同步”，这意味着如果学生属于正确的群组，他们就会自动注册到我们的课程中。同样，当他们被移出群组时，也会自动从我们的课程中取消注册。如果你的\
  \ Moodle 启用了群组（这必须由你的 Moodle 管理员完成），那么你会看到**群组同步**出现在**注册方法**列表中（在**课程管理 | 用户 |\
  \ 注册方法**下的**设置**块中）：\n\n![](img/1529021fde33ef551603bbc71587313e_79_0.png)\n\n再说一次，管理群组并不是我们教师需要过多操心的事情；我们可能需要了解它们，但那些对Moodle管理负有更大责任的人（例如经理或管理员）需要创建群组并将其分配到课程中。\n\
  \n有关管理群组的更多信息，请参阅《*Moodle 2.0 First Look*》，*Mary Cooch* 著，*Packt Publishing* 出版（详见\
  \ https://www.packtpub.com/moodle-2-0-first-look/book）。\n\n## 设置你的课程\n\n### 从学校的教务管理系统（MIS）自动注册\n\
  \n你的Moodle可能已配置为根据学校或学院的教务管理系统中指定的时间表自动创建课程（在英国，主要是Capita SIMS.net或Serco CMIS Facility）。并非所有这些系统都能做到，但此类系统确实会将正确的用户分配到正确的课程并赋予适当的权限。在我工作过或设计过的系统中，我使用过三个此类系统：\n\
  \n-   **用户管理资源管理员（UMRA）**，来自Tools4ever（`http://www.tools4ever.com`），它不仅可以自动创建课程并将正确的用户分配到正确的课程并赋予正确的权限，还可以为家长创建账户并将孩子与其家长关联起来。\n\
  -   **Groupcall Xporter**（`http://www.groupcall.com`），在英国经常被地方教育当局用来从学校的MIS中提取学生出勤数据，英格兰最大的教育当局伯明翰就是如此。\n\
  -   **ZiLink**，来自SchoolsICT（构建于Groupcall Xporter之上）。更多信息请访问 `http://schoolsict.net`。\n\
  \n如果你喜欢冷知识，或者你是一位有一定年纪（咳咳）且还记得1985年Live Aid演唱会的读者，你可能会感兴趣地得知，Groupcall的原始投资者之一是诺贝尔和平奖得主鲍勃·格尔多夫爵士（我的出版商不必担心：我在上述任何公司中都没有股份）。\n\
  \n### 允许访客访问\n\n如果你希望所有人（不仅仅是注册的Moodle用户）都能查看你的课程，那么请允许访客访问。从课程**设置**块中点击**编辑设置**，向下滚动到课程的**访客访问**选项。在那里你会看到**允许访客访问**选项。点击下拉列表并选择**是**。同样，在某些情况下你会需要这样做，例如作为学校或学院VLE的广告。然而，访客在课程中能做的操作是有限的。\n\
  \n现在我们知道如何让学生注册到你的课程了。在撰写本文时，最流行的方法是发放注册密钥——可以是课程注册密钥，或者更常见的是小组注册密钥。如果你乐意让任何人加入你的课程，那就不必担心设置密钥。问题是，你的课程中可能注册了很多学生，但你却不知道他们是谁。你随时可以通过**已注册用户**页面仔细查看谁注册了你的课程。\n\
  \n## 总结\n\n你在本章中已经取得了不少成就。这才仅仅是*第2章*，而你已经：\n\n-   创建了一门课程，并配置了正确的简称、全称、描述和格式\n-\
  \   组织好了你的课程，创建了一组单独的主题（或周），并附有描述，也许还加上了一条欢迎消息\n-   指派了其他教学人员来帮助你管理课程\n\n设置了一个注册密钥，你可以在适当时机交给学生。\n\
  \n当然，现在注册到你的Moodle课程的学生还学不到太多东西，但这种状况即将改变。所以暂时请对注册密钥保密。到*第3章“添加文档和讲义”*结束时，你将拥有在线内容，并可能准备好让学生开始使用它。\n"
- "# 3 添加文档和讲义\n\n你的新Moodle课程已经配置好，可以上传教学材料了。现在让我们开始吧！在本章中，我们将涵盖：\n\n-   将文件上传到Moodle以及如何有效地组织它们\n\
  -   如何向学生展示文档和讲义\n-   上传图片以及如何将它们包含在任何文本中\n-   了解哪些类型的文件最适合放入课程，以及如何创建它们。我们还将学习如何将部门文档转换为wiki，以便你和同事可以协作处理。\n\
  \n到本章结束时，你将用静态内容填充课程，供学生访问。显然，我们的目标是创建更有吸引力和交互性的课程，我将资源描述为“静态内容”可能听起来不那么鼓舞人心，但正如你将在本章及后续章节中看到的那样，当我们转换为Moodle时，我们可以对我们的“静态”资源做很多事情，使它们变得引人入胜且有趣。\n\
  \n### 上传文件\n\n一如既往，我想先向你展示简单的方法，将现有课程材料放入Moodle的最简单方法就是直接按原样上传文件。\n\n但是，请记住，你的学生可能没有读取你想上传到Moodle的文件所需的所有软件。在本章中，我将主要使用Microsoft\
  \ Word文档和PowerPoint演示文稿，但我将概述并我们一起实践的过程同样适用于任何类型的文件。在本章后面，我们将了解如何确保你的文档采用任何学生使用任何电脑都能下载和使用的格式。\n\
  \n不过现在，让我们看看如何将任意文件上传到Moodle。\n\n> 上传意味着将文件从你的计算机放到服务器上。学生和其他员工随后可以将文件下载到他们自己的计算机上查看。\n\
  \n如果你和我一样，你的所有教学资源都存储在U盘、移动硬盘上——或者你可能将它们保存在学校或学院服务器上。我们现在需要将它们上传到Moodle，以便将资源包含在课程首页上。\n\
  \n我们每个人在Moodle中都有自己的“我的私有文件”区域，其他用户（学生和同事）无法访问。我们可以将文件上传到“我的私有文件”区域，然后从我们讲授的任何课程提供指向该文件的只读链接。例如，我将向你展示如何上传一份“能源来源”讲义——一个Word文档（DOC文件）——这是我在教“Backyard\
  \ Ballistics”时使用的。实际上，我在Moodle教的另一门课中也使用这份讲义，但将文件放在“我的私有文件”中意味着我可以轻松地从另一门课程创建指向它的链接。\n\
  \n> 尽管你是在“我的私有文件”区域中创建指向文件的链接，但在撰写本文时，Moodle会复制文件放入你的课程中。这意味着如果你修改了“我的私有文件”中的文件，当你从课程中点击指向该文件的链接时，你不会看到这些更改。更多信息请参阅这里的讨论：http://moodle.org/mod/forum/discuss.php?d=168495#p739240。\n\
  \n还要注意，在下面的示例中，我本可以使用任何类型的文件——我们将在本章后面更详细地讨论文件格式。\n\n### 动手实践——上传文件\n\n1.  选择要上传的文件，并记下它当前存储的位置。\n\
  2.  返回网站首页，在导航块中选择“我的个人资料 | 我的私有文件”：\n\n\n\n\n\n- 3. 现在你位于“我的私人文件”区域。请记住：此区域只有你自己可以访问，但你可以将上传到这里的文件链接提供给你所教的任何课程。点击“管理我的私人文件”按钮：\n\
  \n    ![](img/1529021fde33ef551603bbc71587313e_85_0.png)\n\n    ![](img/1529021fde33ef551603bbc71587313e_85_1.png)\n\
  \n## 添加文档和讲义\n\n- 4. 此时会显示一个新页面，允许我们管理“我的私人文件”区域中的文件。请注意，此屏幕上会显示你可以上传的文件大小上限（本章后面还会详细讨论最大文件大小）。点击“添加”按钮以打开“文件选择器”对话框：\n\
  \n    ![](img/1529021fde33ef551603bbc71587313e_86_0.png)\n\n- 5. 确保你点击了“文件选择器”左侧的“上传文件”。\n\
  \n- 6. 按下“浏览”按钮（或“选择文件”，具体取决于你的浏览器），我们就可以选择在第 1 步中选定的文件。点击“浏览”按钮打开“选择要上传的文件”对话框。选择你要上传的文件，然后按“打开”按钮：\n\
  \n    ![](img/1529021fde33ef551603bbc71587313e_86_1.png)\n\n- 7. 选择文件后，按下**上传此文件**按钮以关闭“文件选择器”对话框。此时你会返回到“我的私人文件”页面，并看到刚刚上传的文件已列在列表中：\n\
  \n    ![](img/1529021fde33ef551603bbc71587313e_87_0.png)\n\n- 8. 按下**保存更改**按钮进行提交。“我的私人文件”区域现在看起来像这样：\n\
  \n    ![](img/1529021fde33ef551603bbc71587313e_87_1.png)\n\n- 9. 就这样，完成了！你的文件现在已存储在你的“我的私人文件”区域中，随时可以被包含到你的任何课程中。\n\
  \n## 刚才发生了什么？\n\n我们刚刚学习了如何获取教学资源并将其上传到 Moodle。但我们还没有让学生可以使用它。在此之前，我们先来谈谈几乎所有教师在开始转换课程时都会遇到的一个问题，尤其是在全新安装的\
  \ Moodle 上——文件大小问题。\n\n## 你的文件有多大？\n\n你可能遇到的一个主要问题（而且如果你遇到了，你并不孤单）是 Moodle 中的最大文件上传大小设置得太小。事实上，这通常不一定直接是\
  \ Moodle 的问题，还与 Moodle 的安装方式以及 Moodle 所依赖的软件有关。新服务器上运行的全新 Moodle 的默认大小为 2 MB。坦白说，这太小了（我见过比这个大小大\
  \ 25 倍的 PowerPoint 演示文稿，不过我现在要提一下，有一些技术可以在不影响质量的情况下大幅缩小大型 PowerPoint 文件，我们将在本章后面的部分中看到）。如果你要上传的文件太大（而你不是\
  \ Moodle 管理员），那么你基本上有三个选择：\n\n-   请管理员增加最大文件上传大小。\n-   请管理员为你上传文件。因为增加上传限制可能存在潜在问题（除非你的\
  \ Moodle 运行在合适的硬件上，并且 Moodle 依赖的上传文件软件配置正确）。根据我的经验，大多数管理员不愿意将最大限制提高到大约 32 MB 以上。事实上，你的管理员可能会（在你提出要求之前）建议由他们为你上传文件。如果是这样，不要反对。\n\
  -   在上传之前压缩文件（我们将在下一节中花时间研究压缩文件）。\n\n值得一提的是，你为什么会开始收到关于上传大量大文件的抱怨：如果你的 Moodle 运行在你所在学校或学院租用的服务器上，那么需要的存储空间越大，租赁成本就越高。即使你的学校运行自己的服务器，显然也需要承担你计划占用的所有空间的成本。\n\
  \n## 一次上传大量文档\n\n如果你和我一样，有很多文档需要上传，而且不想花大量时间逐个上传。更好的选择是将所有文档打包成一个文件，把这个单一文件上传到 Moodle，然后在另一端再解包这些文档。你几乎可以把任何文件打包进\
  \ ZIP 文件（包括其他 ZIP 文件）。如果你有一个太大而无法上传的文件（例如那些大型 PowerPoint 演示文稿之一），那么你可以只把那个单一文件压缩成\
  \ ZIP 文件（这是我们上一节末尾提到的克服最大文件上传大小问题的三个选项中的第三个）。\n\n- 3. 由于 ZIP 文件是打包了其他文件的特殊文件，我可以用“解压缩”选项（即，解包其中的所有文档）。在上下文菜单中选择“解压缩”：\n\
  \n    ![](img/1529021fde33ef551603bbc71587313e_90_0.png)\n\n- 4. Moodle 会显示它从 ballistics.zip\
  \ 中解包出来的文件和/或文件夹：\n\n    ![](img/1529021fde33ef551603bbc71587313e_90_1.png)\n\n\
  - 5. 按下“保存更改”按钮。\n\n- 6. 就这样，我们完成了！已创建两个新文件夹：Videos 和 Handouts，其中包含我所有的文件：\n\n \
  \   ![](img/1529021fde33ef551603bbc71587313e_91_0.png)\n\n### 刚才发生了什么？\n\n我们上传了一个包含大量资源文件的\
  \ ZIP 文件，然后在 Moodle 服务器上解压缩了它。\n\nZIP 文件是一种特殊类型的文件，其中可以包含许多其他文件。这意味着我们可以利用它将大量文件移入\
  \ Moodle，而无需一次上传一个。而且不仅仅是文件可以打包进 ZIP。你也可以将整个文件夹结构压缩成 ZIP。\n\nMoodle 能够将该 ZIP 文件重新转换为一组单独的文件。当我们点击**解压缩**时，Moodle\
  \ 会将所有文件从 ZIP 文件中取出，并将它们添加到当前文件夹中。\n\n### 处理过大的 ZIP 文件\n\n我们已经了解了如何将所有需要的文件打包到一个单一文件中（如果我们幸运的话，热心的管理员会替我们做这件事），这样我们就可以一次性上传大量文件。\n\
  \n我们仍然需要注意文件大小的限制，如果最大文件上传大小对你刚刚创建的 ZIP 文件来说太小，那么你可以：\n\n-   创建多个 ZIP 文件。\n-   向管理员寻求建议（管理员很可能必须为你上传文件）。如果所有内容都打包在一个\
  \ ZIP 文件中，而你的管理员可以一次性上传，他们可能不会太介意。事实上，有许多方法可以将大量文件上传到 Moodle，如果这是一个频繁出现的问题，你的管理员可能需要考虑实施其中一种方法（例如\
  \ WebDAV）。\n\n> 如果 Moodle 试图解包/解压特别大的文件（但这些文件小于 Moodle 的文件上传限制），那么解包文件可能会超时。解决办法是将文件打包进\
  \ ZIP 时不要压缩它们。这需要使用能够做到这一点的压缩工具，例如 WinZip。如果你遇到了问题，并且不确定自己能做些什么来解决，请与你的 Moodle 管理员沟通。\n\
  \n## 压缩文件夹\n\n如前所述，ZIP 也可以包含文件夹和子文件夹，因此你可以在自己的计算机上将所有课程材料整理到整齐的子文件夹中，全部放在一个“resources”文件夹内，然后将整个内容压缩成\
  \ ZIP。当你解压缩时，Moodle 会为你重新创建文件夹结构。\n\n现在我们已经上传了文件，让我们整理一下课程文件区域。\n\n## 解包后删除 ZIP\
  \ 文件\n\nZIP 文件在解包时不会自动删除，即使我们已经不再需要它们。我们需要手动删除它们，这将在下一节中介绍。\n\n## 删除文件\n\n除了删除多余的\
  \ ZIP 文件之外，显然总有一天你需要从课程文件区域中删除某个文件（也许你刚刚上传了一个你并不想上传的文件）。从课程文件区域中删除文件很容易。事实上，还记得我一次性上传了一堆文件时提到过，用完后需要删除\
  \ ZIP 文件吗？我们现在就来这样做。\n\n## 操作时间——删除文件\n\n我要删除 ballistics.zip，因为所有文件都已从中解包，它现在只是占用空间：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_92_0.png)\n\n\n\n\n+   3. 点击**保存更改**按钮：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_95_0.png)\n\n+   4. 就这样，完成了！新文件夹现在列在**我的私人文件**区域中：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_95_1.png)\n\n## 刚才发生了什么？\n\n我们刚刚在课程的文件区域中创建了一个新文件夹，准备放入一些文件。只需点击文件夹名称前面的加号即可查看其内部（如果你正在实际管理文件，那么可以点击文件夹名称本身）。当然，目前它是空的。点击“父文件夹”返回你刚刚所在的文件夹，这样你就能再次看到“讲义”文件夹。\n\
  \n现在，让我们往里放一个文件。\n\n## 动手实践——把文件放到我们想要的位置\n\n移动文件分两个阶段。首先，我们需要选择要移动的文件。然后，我们需要选择要移动到的位置。点击**管理我的私人文件**按钮开始操作：\n\
  \n+   1. 点击文件名旁边的上下文菜单图标选择要移动的文件，然后从菜单中选择**移动...**：\n\n![](img/1529021fde33ef551603bbc71587313e_96_0.png)\n\
  \n+   2. 此时会显示**移动**对话框。点击目标文件夹将其选中，在我的例子中是**讲义**。确保双击该文件夹以选中它：\n\n![](img/1529021fde33ef551603bbc71587313e_96_1.png)\n\
  \n3. 点击**移动**按钮。现在你已经把文件移到了正确的位置！\n\n![](img/1529021fde33ef551603bbc71587313e_97_0.png)\n\
  \n## 刚才发生了什么？\n\n我们不仅知道如何将文件上传到系统，还知道如何整理文件以便轻松查找。当然，先创建文件夹再直接上传到其中更有意义——而不是先上传资源再试图整理一切。\n\
  \n尽管我将文件上传到“我的私人文件”区域，而且我们的教学同事无法直接访问该区域，但值得注意的是，我们的同事可以获取这些文件的副本（我们将在本章后面学习如何操作）。\n\
  \n在本节结束时，我们简要看看如何整理私人文件，以及文件夹和文件的命名约定。首先，我为所教授的课程创建了文件夹。在“Backyard Ballistics”文件夹中，我选择将所有讲义放在一个“讲义”文件夹中：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_97_1.png)\n\n你也可以根据自己的课程设置为每周格式或主题格式，将文件组织到名为“第1周”、“第2周”或“主题1”、“主题2”等文件夹中。这样你就可以快速确定哪些文件需要放在哪些主题/周中。如果你在不同的周/主题中重复使用相同的资源，那么创建一个讲义文件夹会很好。当然，这取决于需要上传多少文件。\n\
  \n## 分发资料\n\n现在我已经上传了文件，整理好了“我的私人文件”区域，接下来我想把它们分发给学生。没有其他人可以直接访问“我的私人文件”区域，所以我必须从课程主页提供文件链接。\n\
  \n> > 请记住，向 Moodle 用户提供资源是一个两阶段的过程。首先，文件上传到 Moodle（正如我所演示的，上传到“我的私人文件”区域）。然后，将这些文件的链接添加到课程首页。\n\
  \n那么现在让我们回到那里，在课程中添加一个我刚上传的文件的链接。\n\n## 动手实践——向学生提供单个文件\n\n+   1. 转到课程页面，选择要添加文件的主题。我将把讲义添加到主题1（**让东西飞起来...**）。\n\
  +   2. 在课程主页上能看到**添加资源...**和**添加活动...**选项吗？\n\n![](img/1529021fde33ef551603bbc71587313e_98_0.png)\n\
  \n如果没有，你需要开启编辑模式（点击**开启编辑**按钮——通常位于页面右上角）。\n\n+   3. 点击**添加资源**并选择**文件**。这将显示**添加新文件...**页面：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_99_0.png)\n\n+   4. 在“常规”框中，我将此资源命名为**能源来源**（这就是讲义的內容）。你还需要输入描述（注意：描述可长可短，随意即可）：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_99_1.png)\n\n## 添加文档和讲义\n\n5. 在“内容”框中点击**添加...**按钮：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_100_0.png)\n\n6. 此时会显示文件选择器对话框。点击对话框左侧的“私人文件”链接：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_100_1.png)\n\n9. 文件现在已选入“内容”框中：\n\n![](img/1529021fde33ef551603bbc71587313e_102_0.png)\n\
  \n10. 在“选项”框中，使用“显示”下拉菜单选择文件的显示方式。我倾向于选择“弹出窗口”（本节稍后会详细介绍不同的显示类型）：\n\n![](img/1529021fde33ef551603bbc71587313e_102_1.png)\n\
  \n11. 点击**保存并返回课程**按钮（如果你点击“保存并显示”且电脑上安装了弹出窗口阻止程序，文件将不会显示）。\n\n12. 现在你已经回到课程主页。应该会有一个\
  \ Word 图标（如果你上传的是 Word 文档），以及紧挨在“主题1”描述下方的资源名称：\n\n![](img/1529021fde33ef551603bbc71587313e_103_0.png)\n\
  \n13. 点击资源链接，文档应该会在新窗口中加载。\n\n## 刚才发生了什么？\n\n我们学习了如何上传文件以及如何将其包含在课程中。请注意，虽然学生可以从“我的私人文件”区域下载文件（正如其名称所示），但他们不能上传。你不必担心学生修改你的文件（如果你想上传一份供学生修改的文档，我们将在本书后面讨论这项任务）。\n\
  \n## 访问文件集合\n\n假设你有很多文件要提供（比如学校旅行的照片）。我有一些往年与学生一起进行的实验照片，希望分享出去。这些图片保存在我的笔记本电脑上的目录中——每年一个目录：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_103_1.png)\n\n## 添加文档和讲义\n\n……我已经使用目前学到的技巧将它们上传到“我的私人文件”：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_104_0.png)\n\n现在我将从课程主页显示指向这些文件的链接。方法如下：\n\
  \n## 动手实践——显示文件夹\n\n+   1. 在课程中选择一个主题（我将选择“基础火箭技术”），然后点击**添加资源...**（如果看不到此选项，请检查是否已开启编辑）。\n\
  +   2. 从列表中选择**文件夹**。\n+   3. 为这个新链接命名。我将把链接命名为**果酱罐喷气发动机实践（2010）**。输入简短描述。\n+ \
  \  4. 在**内容**框中，点击**添加...**按钮。在文件选择器对话框中，从左侧可用存储库列表中点击**私人文件**存储库。选择要显示的文件。注意，你需要一次添加一个文件（如果你是老版\
  \ Moodle 用户，你可能习惯于直接在课程文件区域选择一个文件夹，但你会看到 Moodle 不再是这样操作了）：\n\n![](img/1529021fde33ef551603bbc71587313e_105_0.png)\n\
  \n5. 将要在文件夹中显示的文件会列在“添加新文件夹”页面上：\n\n![](img/1529021fde33ef551603bbc71587313e_105_1.png)\n\
  \n6. 点击**保存并返回课程**按钮。一个新文件夹将被添加到你的课程中：\n\n![](img/1529021fde33ef551603bbc71587313e_106_0.png)\n\
  \n7. 如果我点击新的“果酱罐喷气发动机实践（2010）”链接，会看到如下内容：\n\n![](img/1529021fde33ef551603bbc71587313e_106_1.png)\n\
  \n## 刚才发生了什么？\n\n我们不仅可以从课程主页提供单个文件的链接，还可以将文件收集到文件夹中。我将所有要分发的图片上传到了“我的私人文件”区域的一个文件夹中。请注意，我添加到课程页面的文件夹可能包含来自“我的私人文件”中不同文件夹的文件。这样做有利有弊。例如，我现在可以将\
  \ 2010 年果酱罐喷气发动机实验的所有照片提供给学生，而不必为每个照片单独创建链接。但是，当我打开文件夹时，看到的是一个文件名列表，名称毫无意义。然而，另一个优点是学生只能对文件进行只读访问——他们不能上传或删除文件。\n\
  \n\n\n\n默认的 Moodle 安装不支持缩略图，如果你刚给一个装满图片的目录授予了访问权限，这可能会成为一个问题。但不用担心：请联系你的 Moodle\
  \ 管理员，他们能够从 Moodle.org 安装众多图片幻灯片插件中的一个。\n\n## 仓库\n\nMoodle 设计为虚拟学习环境/课程管理系统。但仅仅把\
  \ Moodle 用作存储文件的仓库也没什么问题：一个明显的优势是你能轻松控制谁有权访问文件，并且访问可以在任何时间、任何地点进行（不像你学校或工作场所的共享驱动器）。Moodle\
  \ 可以像文件仓库一样工作，但更巧妙的是，Moodle 还可以连接到专门设计的文件仓库。我是什么意思呢？你用过 YouTube 吗？那就是视频文件的仓库。你有没有把图片上传到\
  \ Flickr？那就是图片的仓库。要理解 Moodle 如何连接到外部仓库，让我们再看一下文件选择器对话框。回想一下，文件选择器左侧的链接就是指向仓库的链接：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_107_0.png)\n\n## 添加文档和讲义\n\n你可能会在文件选择器中看到更多指向“仓库”的链接。例如，照片分享网站\
  \ Flickr（http://www.flickr.com）可以配置为仓库。你使用 Dropbox（http://www.dropbox.com）在家和工作之间共享文件吗？我们学校的管理员为我们设置了一个，以便我们部门的员工可以共享文件——并且也能轻松地在家访问。如果你的情况类似，那么\
  \ Dropbox 也可以添加为仓库。如果我请我的 Moodle 管理员在 Moodle 中启用 Flickr 和 Dropbox 仓库，那么我的文件选择器现在看起来是这样的：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_108_0.png)\n\n如果我愿意，我现在就可以在上一节《动手时间》创建的文件夹中包含来自\
  \ Flickr 的文件：\n\n![](img/1529021fde33ef551603bbc71587313e_108_1.png)\n\n我已将来自 Flickr\
  \ 仓库的热气球图片添加到文件夹中。值得注意的是，Moodle 已为该图片制作了自己的“内部”副本并将其添加到文件夹中（而且不幸的是，我们并没有因为 Jam Jar\
  \ Jet 实验而一起坐上热气球）。\n\n## 快速测验\n\n你的学生可以直接访问你的私人文件区域吗？你如何为私人文件区域中的文件提供链接？\n\n## 文档和讲义：哪种格式\n\
  \n你现在就可以把所有文件上传，提供课程主页中的链接并立即让学生进入课程。如果你愿意的话。但先等等。我们还没有真正考虑过应该上传哪种类型的文件。\n\n以下部分的一些内容出于必要，技术性稍强。如果你对任何内容不确定，请咨询你的管理员、技术人员或\
  \ IT 帮助台（如果你有的话）。\n\n你使用 Microsoft Word 创建文档吗？以下是分发 Microsoft Word 文档可能是一个坏主意的几个原因：\n\
  \n- 错误地假设学生会在他们的电脑上安装 Word。\n- 如果学生安装的 Word 版本比你的旧，那么他们可能无法打开它。这在文档文件名以 .docx 结尾时尤其如此。那是较新的\
  \ Microsoft Word 2007 格式，与以前版本的 Word 不兼容。微软提供了免费的兼容性软件（http://office.microsoft.com/en-us/word/HA100444731033.aspx），但你不能假设所有用户都已安装——并且在没有安装的情况下知道如何安装。\n\
  \n解决方案是将 Word 文档转换为每个人都能打开的格式。而且这只是 Word 的一些问题。让我们来看看最受欢迎的文档类型，并研究如何将它们转换为最适合 Moodle\
  \ 的格式。\n\n### Microsoft Word\n\n你可以看到，我在上传到课程的第一个文件之一就是 Word 文档，这可能给我带来问题。如果你发现自己有这个问题，那么一个解决方案是将\
  \ Word 文档转换为便携式文档格式（PDF）。过去创建 PDF 文档相当困难（基本上你必须购买 Adobe Acrobat、购买 PDF 打印机软件，或尝试找到一个不错的开源\
  \ PDF 打印机）。\n\n然而，今天创建 PDF 文档变得更容易了。如果你有 Microsoft Word 2007 或更高版本，你可以安装 Save as\
  \ PDF Add-In，直接从 Microsoft 网站获取。OpenOffice，Microsoft Office 的免费替代品，有一个名为 Writer\
  \ 的文字处理器，它内置了创建 PDF 文件的选项（只需从主菜单中选择 **File | Export As PDF...**）。如果你确实转换为 PDF，那么在上传之前检查文档是值得的，因为转换过程通常会改变文档的格式。此外，如果你想创建\
  \ PDF 表单，那么你可能需要考虑购买专门的 PDF 创建工具。\n\n如果你的学生电脑上没有安装 PDF 阅读器（这种情况极不可能），当他们尝试打开你的 PDF\
  \ 文档时，电脑会提示他们安装一个。\n\n> Adobe PDF 阅读器可以从 http://get.adobe.com/reader 下载\n\n如果你无法使用任何\
  \ PDF 创建工具，请选择富文本格式（RTF）。在 Word 中，选择 **File | Save As...** 并在 **Save As** 对话框的 **File\
  \ Type** 菜单中选择 **Rich Text Format (*.rtf)**。但是，请注意，如果你将文件转换为 RTF，文档格式会受到很大限制。例如，你不能像使用\
  \ PDF 文档那样创建 RTF 表单。\n\n我们将在本章后面进一步探讨将 Word 文档转换为更适合 Moodle 的格式的其他选项。\n\n### 图片\n\
  \n虽然可以选择的图像文件格式很多，但真正需要我们关注的只有三种：JPEG（读作“jay-peg”）、PNG（读作“ping”）和 GIF（本意是用硬 g 发音，如\
  \ George，但常被用软 g 如 Graphics 发音）。PNG 文件在网页上用于线条图和剪贴画非常好。如果你有包含文字的图片，请选择 PNG（如果保存为\
  \ JPEG，文字可能会变得模糊）。JPEG 对于照片非常出色（JPEG 中的 PEG 代表摄影专家组，所以他们在照片方面应该知道自己在做什么）。GIF 是互联网上最早使用的图像格式之一，因此在网上搜索图片很可能会找到很多\
  \ GIF 文件——尤其是动画 GIF。\n\n> 你也可能会遇到 PNG-24 图像格式。\n> 这种格式对于照片也很不错。\n\n有太多工具可用于在不同图像格式之间转换，我就直接把你指给管理员、帮助台或技术人员，如果你不确定使用哪个转换工具（如果你询问，通常会有你所在机构期望你使用的标准工具）。\n\
  \n你不必只在课程首页提供图片链接。你也可以将它们包含在文本中，就像在文档中一样。我收集了不少作为我的 Backyard Ballistics 课程一部分的图片，所以我现在要上传这些图片。不仅如此，我还想在页面顶部的“General\
  \ 概要”（未编号主题）中包含其中一张图片，以使我的课程首页对学生更具吸引力。\n\n### 动手时间 – 上传图片并将其包含在概要中\n\n1. 确保你的图片文件在正确的仓库中（例如，我的私人文件或\
  \ Flickr）。\n2. 返回课程首页并点击 Summary of General 编辑概要图标。\n3. 在编辑器中，通过点击插入/编辑图片按钮打开插入图片对话框。那就是包含小树的按钮：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_111_0.png)\n\n\n\n![](img/1529021fde33ef551603bbc71587313e_113_0.png)\n\
  \n## 刚才发生了什么？\n\n我们刚刚看到，在 Moodle 中为任何文本添加图片是多么简单。我们将在第 5 章“Moodle 大变身”中更详细地探讨如何排列图片。现在，你可以试着返回“插入/编辑图片”对话框，查看“外观”（Appearance）选项卡中的设置。随意摆弄一下这些设置吧，请记住：你不会搞坏任何东西的！\n\
  \n## 动手实践——玩转图片\n\n返回“插入/编辑图片”对话框，然后点击“高级”（Advanced）选项卡。利用高级设置，你可以让图片在鼠标指针移过时发生改变，再在鼠标指针移开时变回原样。例如，你可以让学生将鼠标指针移到人物照片上，从而揭示电影或戏剧中角色的名字。\n\
  \nPowerPoint 几乎已经成为教学材料的默认格式。但一个大问题是，PowerPoint 演示文稿往往体积很大，经常会超过默认的 2 MB 上传大小限制。另一个问题是，你无法假定所有学生都能打开\
  \ PowerPoint 文件并查看（他们家中可能没有安装正确的软件）。\n\n接下来，我们看看上传演示文稿时你有哪几种选择。\n\n## 原样上传\n\n不必担心把文件转换成其他格式。直接把\
  \ PPT 文件原样上传，然后在课程首页创建一个链接指向它。你也可以将文件另存为 PowerPoint 放映（PPS）格式并原样上传。即便如此，学生仍然需要一个兼容的查看器（微软当然提供了免费的查看器可供下载）。\n\
  \n但如果你发现演示文稿实在太大了，学生抱怨下载要花上很长时间，该怎么办呢？\n\n## 为 Moodle 准备你的 PowerPoint\n\n你的演示文稿里是不是包含大量图片？如果是的话，我们可以借助\
  \ PowerPoint 来保持较小的文件体积。让我们看看如何在 PowerPoint 2007 中做到这一点：\n\n## 动手操作——压缩图片\n\n- 1.\
  \ 浏览你的演示文稿，找到一张图片（任意图片即可）。找到后，点击它。功能区中会出现**图片工具**（Picture Tools）工具栏，并显示在标题栏中：\n\n\
  ![](img/1529021fde33ef551603bbc71587313e_114_0.png)\n\n2. 点击“图片工具”，在功能区中显示“格式”工具栏：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_115_0.png)\n\n3. 在“格式”工具栏中，按下“压缩图片”按钮：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_115_1.png)\n\n4. 系统会显示“压缩图片”对话框。我们想要压缩并裁剪演示文稿中的所有图片。确保“仅应用于所选图片”复选框未被勾选（因为我们想压缩所有图片），然后按下“选项…”按钮。确保选中“保存时自动执行基本压缩”和“删除图片的裁剪区域”。为了在图像质量无明显下降的情况下获得最大限度的压缩，请将分辨率更改为“屏幕（150\
  \ ppi）”：\n\n![](img/1529021fde33ef551603bbc71587313e_115_2.png)\n\n- 5. 按下**确定**按钮。再次按下**确定**按钮。\n\
  - 6. 就这样，完成了！\n\n## 刚才发生了什么？\n\n如果超大、未压缩的图片让你的 PowerPoint 演示文稿变得非常臃肿，那么我们可以轻松地在把资料分发给学生之前，先对图片进行裁剪和压缩。\n\
  \n如果你上传文件时仍然遇到体积问题（也许你的演示文稿中并没有大尺寸图片），那么也许是时候考虑在上传到 Moodle 之前，把演示文稿转换成另一种文件格式了。\n\
  \n## 转换为文档\n\n如果你使用的是 Microsoft Office 2007 或更高版本，或者 OpenOffice，那么可以将演示文稿导出为 PDF\
  \ 文件。这样做通常会尽量保留布局和格式，不过你可能会丢失那些漂亮的动画和效果，因为我们转换成了静态格式（技术一直在变化，所以最好亲自尝试一下转换，看看效果如何）。\n\
  \n对于 OpenOffice 用户，请从主菜单中选择**文件 | 导出为 PDF...**。在 Microsoft Office 2007 中，点击屏幕左上角的\
  \ **Office** 按钮，将鼠标悬停在 **另存为...** 选项上，然后选择 **PDF**。请注意，可能需要先安装 Office 的 PDF 专用插件。如果没有安装，请按照屏幕上的说明操作。\n\
  \n如果你想尝试将 PowerPoint 转换为 PDF，但又不是 OpenOffice 或 Office 2007 用户，那么你可以试试众多 PDF 打印机中的一款（以免费软件形式提供，不会花费你任何费用）。PDF\
  \ 打印机的工作原理是：你选择**文件 | 打印**，然后不选择普通打印机，而是选择 PDF 打印机。这个“打印机”并不会打印出演示文稿的纸质版，而是生成一个\
  \ PDF 文件。如果你认为这种方法值得进一步研究，那么也许可以和你的管理员商量一下。\n\n如果你使用的是较早版本的 Microsoft Office，请从主菜单中选择**文件\
  \ | 另存为...**，显示**另存为**对话框。点击该对话框底部的**保存类型**列表。你会看到很多不同的选项。要将文件保存为文档，请选择**大纲/RTF**。请注意，这里说“大纲”就真的是大纲。你不仅会丢失所有漂亮的动画和效果，还会丢失所有格式和图片，基本上只剩下纯文本（甚至可能连纯文本也会丢失，这取决于文本在页面上的放置方式）。将文档保存为\
  \ RTF 文件应当是万不得已的选择。\n\n## 转换为图片\n\n如果你不希望学生轻易地复制和粘贴文本，这是一个很有用的选项。\n\n在所有版本的 Microsoft\
  \ Office 中，都可以在“另存为”对话框中查看“保存类型”选项。\n\n在 OpenOffice 中，从主菜单中选择“文件 | 导出...”，点击“文件格式”列表以显示不同的图像选项。\n\
  \n在 OpenOffice 和 Microsoft Office 中，如果保存为图像，请记得在 PNG 和 JPEG 之间做出选择（请参阅前面关于图像的讨论，了解为什么这两种类型是所有可选类型中最好的，以及如何在它们之间进行选择）。\n\
  \n## 随堂测验\n\nPowerPoint 文件的大小可以通过裁剪和压缩演示文稿中的图片来大幅减小。你还记得压缩图片的步骤吗？\n\n## 转换为网页\n\n\
  这个选项有一点技术含量，但也许值得一试。在 Microsoft Office 和 OpenOffice 中将文件另存为网页都很简单。在 Microsoft Office\
  \ 中，请确保在“保存类型”列表中选择“网页”（不要选择“单个文件网页”）。在 OpenOffice 中，你需要从主菜单中选择“文件 | 导出...”，然后在“文件格式”列表中选择“HTML\
  \ 文档”。\n\n使用这两种工具中的任何一种，都会生成一组网页及其相关文件（图片等），并全部存储在特定的文件夹结构中（具体取决于你使用的工具，但我们不需要了解这一点）。我们需要将所有这些文件和文件夹上传到\
  \ Moodle。如果你对自己上传文件的能力没有信心，请联系你的 Moodle 管理员、帮助台或技术人员。文件上传完成后（务必保持文件夹结构），你需要创建指向那个以\
  \ .htm 结尾的文件的链接，该文件名应与原始 PowerPoint 演示文稿同名。\n\n## 借助 Moodle“页面”成为复制粘贴达人\n\n如果你有一些需要经常修改的文档，你会发现必须反复下载文档、编辑，然后重新上传。解决这个问题的办法是：将文档复制到一个\
  \ Moodle“页面”中。请注意，这不同于之前所述的网页转换。Moodle 的“网页”——简称为“页面”——是我们可以用 Moodle 内置的 HTML 编辑器创建的网页。我保存了一份氢气球实验设备供应商名单（学生需要自带设备）。我不仅仅上传文档，而是打算把这份名单转换成一个网页。\n\
  \n\n\n\n\n## 行动时间 – 创建网页\n\n1. 返回课程首页并确保已打开编辑模式。\n2. 在要添加新网页的主题中，点击 **Add a resource...**\
  \ 并从列表中选择 **Page**。\n3. 为新网页命名并指定描述。\n4. 将原始文档中的文本复制并粘贴到新网页中（“Page content”区域）。\n\
  5. 在页面底部，按下 **Save and display** 按钮。\n\n## 发生了什么？\n\n我们可以将文档转换为网页。这仅适用于较小的文档，如果文档经常更改则非常有用，因为它可以节省你下载、更改、保存然后再次上传的步骤。另一个明显的好处是，学生无需安装任何额外软件即可阅读。\n\
  \n![](img/1529021fde33ef551603bbc71587313e_118_0.png)\n\n> **不要犯这个错误：剪切粘贴图片不起作用**\n\
  > \n> 请记住，图片必须上传到 Moodle（到我的私人文件或通过存储库），然后使用插入/编辑图片按钮将其包含在网页中。你不能剪切粘贴它们。\n\n## 清理混乱的代码\n\
  \nMoodle 页面基本上是一个网页（请记住你正在将文本粘贴到 HTML 编辑器中）。如果你从 Microsoft Word 剪切粘贴到网页中，Word 会试图变得聪明并尝试将你的文本转换为网页代码（它这样做是为了让文本上应用的任何格式保持不变）。问题是这种网页代码可能非常特定于\
  \ Microsoft（包含大量 Microsoft 特定的格式信息），这会破坏 Moodle 的内置编辑器。（请注意，这不仅仅是 Moodle 的问题，许多不同的软件应用程序都使用\
  \ Moodle 使用的相同文本编辑器。你甚至可能从你使用的其他软件工具中认出 Moodle 的编辑器）。如果你从 Word 粘贴，请尝试使用“从 Word 粘贴”按钮。如果你从其他应用程序粘贴，那么在这样做之后按\
  \ **Cleanup messy code** 按钮是值得的：\n\n![](img/1529021fde33ef551603bbc71587313e_119_0.png)\n\
  \n## 将大型文档转换为 wiki\n\n我的物理系有一个系部手册，其中描述了系部的组织结构、其目标、系部政策和实践的细节等等。维护手册存在很多问题。我们试图确保系部的不同成员完成不同的部分，但当它们被写成后，将它们汇编起来非常困难。我们如何才能真正实现对该文档的集体所有权？整理我们的手册以及我们需要的其他所有文档的任务，往往会让我们分心于真正的工作（教学！——但鉴于我们被期望做的事情太多，有时很难记住这一点）。我们如何向学科检查员展示我们作为一个团队真正共同创建系部文档？\n\
  \n一个优雅的解决方案是将系部文档转换为 wiki。“Wiki”是夏威夷语中快速的意思（参见 http://en.wikipedia.org/wiki/Wiki），wiki\
  \ 是创建网页并将它们链接起来的快速方法。不仅如此，你还可以与同事协作在网页上工作（允许同事贡献或修改内容）——这将真正给检查员留下深刻印象。此外，系统内置了审计跟踪。这意味着你可以查看谁在何时修改了什么。它还意味着你可以恢复到以前的版本并轻松比较一个版本与另一个版本。\n\
  \n为了向你展示创建 wiki 是多么容易，我将使用它而不是上传我为我的 Backyard Ballistics 课程准备的教师笔记。\n\n> 到目前为止，我们添加到课程中的所有静态内容都已使用\
  \ Moodle 资源转换为 Moodle。wiki 是一个活动，因为你期望用户一起在 wiki 内容上工作。这是资源和最好描述为活动的边界变得模糊的一个实例。\n\
  \n首先，我将在我的课程末尾添加一个名为“TEACHER DOCUMENTATION”的新主题，用于教师文档。我将把这个主题及其内容对学生隐藏。\n\n## 行动时间\
  \ – 添加隐藏主题\n\n1. 返回课程首页。在设置块中的课程管理下点击编辑设置链接。\n2. 点击周数/主题列表并添加另一个主题。\n3. 滚动到页面底部并按下保存更改按钮。\n\
  4. 编辑新主题的摘要，告诉你的同事（和检查员）该主题专门用于教师文档，不用于其他用途。\n5. 通过点击右侧的睁开眼睛来隐藏主题对学生可见。眼睛关闭表示主题已隐藏：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_120_0.png)\n\n6. 完成！\n\n## 发生了什么？\n\n\
  我刚刚在我的 Backyard Ballistics 课程中添加了一个新主题，我将在其中放置教师文档。我只希望我的同事查看此信息，所以我已将主题对学生隐藏。\n\
  \n## 行动时间 – 添加 wiki\n\n1. 在教师文档主题中，点击 Add an activity... 并从列表中选择 Wiki。\n2. 我新 wiki\
  \ 的名称将是 Backyard Ballistics Guidelines。输入你的 wiki 名称。\n3. 写下 wiki 的简要摘要。这显示在每个页面上方。保持简短且描述性。\n\
  4. 为 wiki 的第一页选择一个名称（我的第一页将是目录）。\n5. 确保 Wiki 模式设置为 **Collaborative wiki**（意味着每个人都有平等的编辑权限，但请记住我们已隐藏了它所在的主题）：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_121_0.png)\n\n6. 滚动到页面底部并按下 **Save and\
  \ return to course** 按钮。\n\n## 发生了什么？\n\n你现在已从课程到一个新、空的 wiki 的链接——但你仍然需要将文档放入其中。\n\
  \n点击课程首页上新 wiki 的链接。我们现在准备在 wiki 中创建第一页。确保已选择 HTML 格式并按下创建页面按钮：\n\n![](img/1529021fde33ef551603bbc71587313e_122_0.png)\n\
  \n让我们通过创建目录页开始开发 wiki。\n\n## 行动时间 – 创建 wiki 目录页\n\n1. 我最初将教师指南写成 Word 文档。我将把这些文档的目录页剪切粘贴到\
  \ wiki 的目录页中：\n\n   > ### Contents\n   > \n   > Editing this page 'Contents'\n \
  \  > \n   > ### Practical Activities\n   > \n   > 1. [[Hydrogen Filled Balloons]]\n\
  \   > 2. Fire Kites\n   > 3. Match Rockets\n   > 4. Tennis Ball Mortar\n   > \n\
  \   > ### Health and Safety\n   > \n   > 1. Parent Consent Form\n\n2. 如果你从其他应用程序剪切粘贴（不一定只是\
  \ Word），请记住按下清理混乱代码按钮。另请注意，我已为标题“Practical Activities”和“Health and Safety”使用了标题\
  \ 1 样式。这样做意味着 wiki 系统会将它们识别为章节标题，并在该页面的“目录”框中包含指向它们的链接（你很快就会看到）。\n\n3. 你可以指定标签——这些是与\
  \ wiki 页面关联的词，可以稍后用于帮助查找信息（而不是在文本中搜索某个词）。由于这是我的 wiki 的目录页，我不会担心为其添加标签。\n\n4. 点击保存。\n\
  \n5. 就这样。完成！\n\n## 添加文档和讲义\n\n## 发生了什么？\n\n我刚刚创建了一个 wiki 目录页：\n\n![](img/1529021fde33ef551603bbc71587313e_124_0.png)\n\
  \n然而，我不想简单地将整个文档复制粘贴到单个 wiki 页面中。相反，我希望能够将目录中的每个项目变成一个链接，然后带我到相关页面。页面创建后，我只需从原始文档中剪切粘贴页面。聪明的部分是：一旦我告诉\
  \ wiki 我想要一个指向新页面的链接，wiki 就会为我创建它。我只需要复制我的文本。方法如下...\n\n## 行动时间 – 添加新的 wiki 页面\n\
  \n1. 点击页面顶部的编辑选项卡：\n\n![](img/1529021fde33ef551603bbc71587313e_124_1.png)\n\n\n\n\
  \n2. 我想将“氢气球”条目变成指向新页面的链接。为此，我将用双方括号把这几个词括起来：\n\n![](img/1529021fde33ef551603bbc71587313e_125_0.png)\n\
  \n3. 按下“保存”按钮。\n\n4. 在继续之前，看看我们括在方括号里的这些词。它们现在变成了红色斜体：\n\n![](img/1529021fde33ef551603bbc71587313e_125_1.png)\n\
  \n5. “氢气球”现在是一个链接。点击该链接，wiki会自动询问你是否要创建新页面（你需要再次按下“创建页面”按钮）——这就是“快速”之处。我将把“氢气球”实验的教师笔记内容复制到该页面中（重复之前使用的过程）。\n\
  \n6. 创建完新页面后，按下“保存”按钮。\n\n7. 就这样。新页面已经创建好了。要试用新wiki并测试你的新链接是否有效，请返回课程主页面，点击wiki，就会显示wiki的内容页面：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_126_0.png)\n\n8. “氢气球”现在是一个链接，我可以点击它跳转到教师笔记中的那个页面。\n\
  \n### 刚才发生了什么？\n\n我们已经看到，使用wiki创建相互链接的页面是多么容易。对于冗长的课程甚至部门文档来说，这是一个理想的解决方案。\n\n你注意到每个页面上方出现的“历史记录”标签了吗？它显示页面的审计跟踪。我们来看看wiki内容页面的审计跟踪：\n\
  \n### 小结\n\n我想你会同意，我们在Moodle课程上进展神速。仅仅是这一章，我们就：\n\n- 向Moodle上传文件并有效地组织它们\n- 学会了如何向学生展示文档和讲义\n\
  - 上传图片并将其包含在文本中\n- 包含PowerPoint演示文稿，并学会处理学生无法查看时该怎么做\n- 学会了如何使用wiki\n- 现在知道了哪些类型的文件最适合包含在课程中，以及如何创建它们\n\
  \n现在，我们的课程已经填充了静态内容。在这个阶段，你甚至可能想让学生进入你的课程。他们一定会对你目前所做的工作留下深刻印象！记住，如果你设置了选课密钥，你需要将其发给学生。\n\
  \n在下一章中，我们将学习如何通过声音、视频和多媒体让课程更具吸引力和趣味性。\n"
- "# 4 声音与视觉——包含多媒体内容\n\n> 在前几章中，我们看到了通过Moodle发布作业是多么容易。这是一个不错的开端，但我想让我的课程既实用又有趣。我还有很多多媒体内容想要加入：例如，我有大量音频和视频文件——其中许多存放在YouTube等文件共享网站上。\n\
  \n让我们在第三章“添加文档和讲义”的基础上，学习在本章中将声音和视觉内容导入课程的最佳方式。在本章中，你将学习如何：\n\n- 将音频和视频导入课程\n- 体验Moodle播放多媒体文件的不同方式，并体会每种方式的优缺点\n\
  - 嵌入来自其他网站（如YouTube、TeacherTube和Vimeo）的视频\n- 使用Slide.com创建照片蒙太奇\n\n回顾第三章“添加文档和讲义”，我们将文档和讲义上传到自己的个人“我的私人文件”区域，并在课程页面上插入指向这些文件的链接。我们还学习了如何包含来自其他资源库的文件——请记住，我们可用的资源库取决于Moodle的配置方式。\n\
  \n本章开始时，我们直接从课程主页创建指向外部网站的链接。你可能认为我应该在前几章就介绍如何创建指向课程首页外部网站的链接。我把这个讨论推迟到本章，因为它是我们接下来要开展的工作的基础。在开始之前，值得指出的是，直接链接外部网站是我们利用Moodle创建引人入胜的多媒体课程的一种简便方式——这也是摆脱将Moodle仅用作简单资源库的第一步。\n\
  \n### 链接到其他网站\n\n如果你和我一样，那么你会有一堆包含大量精彩内容的网站列表，并想把它们加入课程中。我把所有网址都保存到了一个Word文档中，但让我们看看如何将它们转移到Moodle中。我的选择如下：\n\
  \n- 直接上传Word文档。我们已经在*第三章“添加文档和讲义”*中学习过如何操作。\n- 在课程主页上制作一个链接列表。\n- 创建一个Moodle网页并把链接包含在其中。\n\
  \n我们已经在上一章中讨论过上传Word文档的问题，尽管很方便，但将我的链接列表放在Moodle中远比放在一个技术上位于Moodle之外的文件中要好。原因如下：\n\
  \n- 学生可能没有安装正确的文件查看器（这是我们在前几章中讨论过的一个重要问题）\n- 我们更方便学生找到链接\n- 我可以将外部网站的链接与上传文件的链接无缝混合\n\
  - 如果我们从Moodle链接到外部网站，我们可以监控哪些学生访问了哪些网站\n\n相反，我们先把链接直接放到课程主页上。\n\n### 在课程主页中添加链接\n\
  \n是时候行动了。让我们看看在课程主页上添加外部网站链接是多么简单。\n\n4. 或者，你也可以通过按下“选择链接...”按钮来查找“链接”。这会打开文件选择器，但只显示外部网站上文件存储库。还记得在第三章“添加文档和讲义”中，我请Moodle管理员配置了YouTube和Flickr存储库吗？由于这些是外部网站，这些存储库会显示在我的文件选择器中：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_132_0.png)\n\n5. 记得在“选项”配置框中指定“弹出窗口中显示”。只需点击“显示”下拉菜单并选择“弹出窗口中显示”：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_132_1.png)\n\n6. 滚动到页面底部，按下**保存并返回课程**按钮。\n\
  \n7. 就这样！完成了。\n\n你现在已经在课程首页添加了一个指向网页的链接：\n\n![](img/1529021fde33ef551603bbc71587313e_133_0.png)\n\
  \n### 刚才发生了什么？\n\n与我们前几章中添加指向文档或讲义的链接的方式一样，我们刚刚添加了一个指向外部网站的链接。但想象一下，如果你想用这种方式共享大量链接会怎样？用不了多久，课程主页就会变得笨拙——一个主题中除了长长的一列链接外什么也没有。幸运的是，我们可以通过将链接包含在Moodle网页中来绕过这个问题，这正是下一节要讨论的主题。\n\
  \n### 将文本转换为网页链接\n\n另一种替代上传包含一长串链接的文件（例如Word文件）的方法，是创建一个Moodle网页并将链接包含在其中（还记得我们在*第三章“添加文档和讲义——成为剪贴粘贴高手”*中讨论过将文档转换为Moodle网页）。与其让页面仅仅成为一个长链接列表，我可以通过插入图片，并利用更大的空间来布置页面布局，使链接更易于查找，从而让页面更吸引人。而且，为了便于转换，我可以从原始文档中复制粘贴。现在让我们来做这件事。\n\
  \n### 操作时间——在Moodle网页中放置链接\n\n为方便转换，试着安排你的桌面，让Word文档和带有Moodle的浏览器并排显示。这样你就不用在Moodle和原始文档之间反复切换了。\n\
  \n1. 返回课程首页，并确保已打开编辑功能。\n2. 选择要包含链接的主题，点击**添加资源...**，然后从列表中选择**页面**。\n3. 输入新页面的名称。\n\
  4. 输入简短描述。这是必填项，但长度随你意愿。\n5. 我们现在准备复制Word文档中的信息。返回原始文档，选择并复制需要的链接。\n6. 返回Moodle，将刚复制的文本粘贴到“页面内容”编辑区域：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_134_0.png)\n\n\n\n\n7. 按下 **Cleanup messy\
  \ code** 按钮（带刷子图标的按钮），以确保我们不会包含任何特殊的文字处理格式——现在我们要在浏览器中显示文本，这些格式是不需要的。\n8. 滚动到页面底部并按下\
  \ **Save and return to course** 按钮。\n9. 通过课程首页的链接查看你的新网页：\n\n![](img/1529021fde33ef551603bbc71587313e_135_0.png)\n\
  \n### What just happened?\n\n我们刚刚创建了一个包含我之前在 Word 文档中记录的链接的 Moodle 网页。与其直接上传原始文档——这可能会引入我们在奖励章节\
  \ *Handing in Work through Moodle* 中讨论的问题——我们将其转换成了 Moodle 网页。立即打开新页面。尝试点击一个链接，你将被导航到外部网站。\n\
  \n## Manually adding links to Moodle web pages\n\n现代文字处理器在处理链接时对你非常友好。如果你文档中包含看起来像链接的内容，文字处理器通常会将其解释为链接并相应地格式化。这意味着当你将文本复制到\
  \ Moodle 时，它会保留文字处理器添加的格式，Moodle 仍会将文本识别为链接。这在 Moodle 中也适用：如果我直接在 Moodle HTML 编辑器中输入链接，Moodle\
  \ 会将文本识别为网页链接并自动将其转为链接。如果我们不想让学生点击实际的网址，如：\n\n![](img/1529021fde33ef551603bbc71587313e_136_0.png)\n\
  \n...而是想让学生点击一段描述性文字，如：\n\n![](img/1529021fde33ef551603bbc71587313e_136_1.png)\n\
  \n在你刚刚创建的 Moodle 网页名称旁边，点击 Update 图标以打开资源配置页面。让我们看看如何选择一个词或文本片段并将其转为链接。\n\n### Time\
  \ for action – making a link out of text\n\n我列出的第一个链接是通往 Ballistics 在 Wikipedia\
  \ 词条的链接。我希望学生点击短语 \"Click here to look at what Wikipedia has to say on Ballistics\"\
  ，并让其跳转到正确的页面。我还希望新页面在不同的窗口中显示，以“阻止 Wikipedia 让 Moodle 消失”，这是我的一名学生的话。\n\n1. 输入你想要转为链接的文本并确保已选中它。\n\
  2. 按下 **Insert/edit** link（看起来像三条链环）按钮。Insert Web Link 对话框将会出现。请注意，在编辑器中选中内容之前你无法按下该按钮：\n\
  \n### What just happened?\n\n我们刚刚将一段文本转为链接，但你无法在滚动到页面底部并按下 Save and return to course\
  \ 按钮之前点击新链接。打开网页并点击该链接以确认其有效。当你将文本转为链接时，你按下了 Insert/edit link 按钮以显示 Insert/edit\
  \ link 对话框。你是否注意到 Browse... 按钮：\n\n![](img/1529021fde33ef551603bbc71587313e_138_0.png)\n\
  \n此按钮允许你将一段文本转为指向你 My private files 区域或其它存储库中文件的链接。这让你能够在一个页面中混合外部网站链接和上传到 Moodle\
  \ 的文件链接。\n\n### Have a go hero – doing more with your links\n\n你可以使用 Moodle 网页中的链接链接到课程中的其它文档。尝试创建一个文档索引。通过包含图片使该索引更具吸引力（参见第\
  \ 5 章 Moodle Makeover，获取让 Moodle 网页更具视觉吸引力的技巧）。\n\n## Importing videos\n\n在课程中包含视频（例如\
  \ AVI、MOV、FLV 或 WMV 文件）与将文件上传到课程文件区域并在课程主页面创建指向它的链接一样简单，请遵循 *Chapter 3, Adding documents\
  \ and handouts* 中的说明。\n\n我将在本节后面讨论视频文件格式。现在，让我们直接开始在课程中包含视频文件...\n\n### Time for\
  \ action – including a video on your course front page\n\n在课程首页包含视频的方法与我们在 *Chapter\
  \ 3, Adding Documents and Handouts* 中练习的包含文档和讲义的方法完全相同。让我们再次回顾一下该流程以提醒自己：\n\n1.\
  \ 将视频上传到你的私有文件区域（有关更多详情，请参阅 *Chapter 3, Adding Documents and Handouts* 中的 *Uploading\
  \ Files* 部分）。请记住视频文件可能非常大，因此值得检查上传限制。\n2. 选择一个主题并点击 **Add a resource...** 然后选择 **File**\
  \ 以显示 **Adding a new File...** 页面。\n3. 指定一个名称（学生点击以观看视频的链接）和简短描述。\n4. 滚动到 Content\
  \ 部分并按下 **Add...** 按钮，File picker 将显示。从 File picker 左侧的存储库列表中，点击 **Upload a file**。在\
  \ Attachment 框旁边，按下 **Browse...** 按钮。\n5. 找到文件或选择所需文件后，按下 File picker 的 **Upload\
  \ this file** 按钮。文件将列在 **Content** 部分：\n\n![](img/1529021fde33ef551603bbc71587313e_139_0.png)\n\
  \n我还可以让学生留在 Moodle 上并专注于学习（而不是发送他们到 YouTube，在那里他们会被诱惑观看其他视频）。他们还可以同时阅读支持文本并观看视频。通过让\
  \ Moodle 处理视频播放，我可以避免学生不知道如何使用其计算机上安装的视频播放器的问题（可能是众多播放器之一）。\n\n在我开始之前，有两件事我需要对我的视频做：\n\
  \n1. 确保文件格式正确（参见本章后面的 *Choosing a video file format*）。\n2. 按照 *Chapter 3, Adding\
  \ Documents and Handouts* 中的说明上传视频。我已在我的 My private files 区域中创建了一个单独的 Videos 文件夹来存储所有视频。\n\
  \n### Time for action – embedding a video into a Moodle Page\n\n1. 创建一个新的 Page 资源并为其命名并添加简短描述。我将我的命名为\
  \ Instructions For Making Hydrogen。\n2. 我已开始向我的说明中添加一些文本和图片，现在我希望在此处包含一个视频：\n\n\
  ![](img/1529021fde33ef551603bbc71587313e_141_0.png)\n\n3. 让我们插入我刚刚上传的视频文件。为此，我将把光标定位在编辑框底部，然后按下\
  \ **Moodle Media** 按钮以显示 **Insert/edit embedded media** 对话框：\n\n![](img/1529021fde33ef551603bbc71587313e_142_0.png)\n\
  \n6. 如果一切正常，则会显示你的视频文件的预览：\n\n![](img/1529021fde33ef551603bbc71587313e_144_0.png)\n\
  \n7. 点击 Insert 按钮。视频的链接现在已添加到你的文本中：\n\n![](img/1529021fde33ef551603bbc71587313e_144_1.png)\n\
  \n8. 滚动到页面底部并按下 **Save and return to course** 按钮。点击页面链接并检查视频是否正确显示：\n\n![](img/1529021fde33ef551603bbc71587313e_145_0.png)\n\
  \n9. 在之前的屏幕截图中，你可以看到链接和 Moodle 的嵌入式视频播放器。如果只看到链接，则说明多媒体插件未打开。要启用它们，你需要联系管理员（你将在本章后面了解更多）。\n\
  \n### What just happened?\n\n我们刚刚将上传的视频包含到 Moodle 网页中。其优点在于，与仅从课程首页提供链接相比，我们可以：\n\
  \n- 用解释性文本和支持图片补充视频\n- 避免学生不知道如何使用其计算机上安装的视频播放器的问题（可能是众多播放器之一）\n\n\n\n\n- 它让学生留在课程中并专注于学习（而不是被诱惑去开始观看其他视频）\n\
  - ...并且他们可以同时阅读和观看\n\n视频是否正常播放？视频播放器是否只给你一个黑框，而不是播放你的视频？计算机对视频文件格式可能会有点挑剔，因此有些格式有时比其他格式更好用。在下一节中，我们将研究视频文件格式的选项。\n\
  \n## 选择视频文件格式\n\n最好将视频转换为常见的视频文件格式之一——这些格式通常可以通过其文件扩展名来区分。扩展名是文件名中句点后的三个字母。如果你选择这些常见类型之一，那么：\n\
  \n- 当您将文件上传到“我的私人文件”区域时，Moodle 会识别该文件并为其提供合适的图标。目前这可能不是特别重要，但如果那里有很多文件并且您想一眼找到特定类型的文件，这就很重要了。\n\
  - 该视频可以在大多数现代计算机上播放，无需任何特殊操作。\n- 正如我们将在接下来的章节中很快看到的，Moodle 将允许您将此类型的文件嵌入到 Moodle\
  \ 网页中。\n\n如果你的视频文件不属于这些格式之一（例如它们可能是 MP4），那么可以试试免费在线文件转换工具，例如 zamzar.com。\n\n## Moodle\
  \ 视频故障排除\n\n你是否看到视频链接却没有视频播放器？你可能会看到这样：\n\n![](img/1529021fde33ef551603bbc71587313e_146_0.png)\n\
  \n也就是说，只有链接而没有播放器，而你想要看到的是这样：\n\n![](img/1529021fde33ef551603bbc71587313e_147_0.png)\n\
  \n让我们逐一进行故障排除步骤。每完成一步，就在旁边打个勾。\n\n### 动手实践 – 让视频在 Moodle 中播放\n\n1. 确保你使用的是常见的视频文件格式之一（见前面的讨论）。\n\
  2. 确保你的链接设置正确。尝试点击链接，确保你的计算机视频播放器能播放你的视频。编辑文本时链接可能会意外断开，所以我们可以尝试重新链接视频。在重新开始之前，要断开链接，请按编辑器的“移除链接”按钮：\n\
  \    ![](img/1529021fde33ef551603bbc71587313e_147_1.png)\n3. 旧链接被移除后（文本将恢复默认颜色和格式）；按照\
  \ *将文本转换为网页链接* 中概述的步骤将链接重新放回。\n4. 如果你已经走到最后一步，视频播放器仍然没有显示，那么看起来 Moodle 的配置不符合我们的需要。请查看本章末尾的\
  \ *询问管理员* 部分。\n\n### 试试身手 – 用视频做更多事\n\n你显然可以有一个只包含视频的 Moodle 网页，但这并不是很有趣。在前面的示例中，我把视频作为说明页面的一部分。我还加入了一些图片，试图让页面更生动一些。现在，我们的课程正开始成为真正的多媒体体验——让学生们感到更加兴奋。\n\
  \n## 从视频分享网站嵌入视频\n\n这并不是将视频嵌入课程的唯一方法。和我一样，你可能在 YouTube 上找到了想用于教学并希望包含在课程中的视频。或者，如果你想嵌入视频，但无法说服管理员开启多媒体过滤器（或提高最大文件大小），那么\
  \ TeacherTube 可以解决问题。TeacherTube 的运作方式很像 YouTube，但完全专注于教育内容。因此，你通常可以在学校内访问它——这是放置教学视频的好地方。为什么要把视频上传到\
  \ YouTube 或 TeacherTube？如果很多学生同时在学校观看同一视频，他们很可能会让运行 Moodle 的计算机——以及/或者为 IT 机房提供网络的设备——陷入瘫痪。如果运行\
  \ Moodle 的计算机（“Moodle 服务器”）的空间是个问题，那么将它们上传到 YouTube 或 TeacherTube 是值得的。\n\n> 记住：你可能没有权限将学生的图片和视频上传到第三方计算机系统。请查看你所在机构关于学生图片和视频使用的政策。\n\
  \nYouTube 和 TeacherTube 都允许你将特殊的视频播放器嵌入到网页中，直接从它们各自的网站播放视频。如果我们嵌入来自 YouTube 的视频，并且全班每人一台电脑同时尝试播放该视频，那么承受压力的是\
  \ YouTube，而不是 Moodle 机器。\n\n> 记住：在你考虑将 YouTube 或 TeacherTube 的视频嵌入课程之前，请确保学生可以在你的机构内访问这些网站。它们可能会被过滤屏蔽。还要记住，YouTube\
  \ 视频可能随时被下架。如果被下架，那么你的链接将无法使用。\n\n让我们先看看如何包含来自 YouTube 的视频。\n\n### 从 YouTube 包含视频\n\
  \n如果我们要在课程中包含来自 YouTube 的视频，基本上有四个选项：\n\n- 使用 YouTube 的特殊播放器，直接从 YouTube 嵌入视频。\n\
  - 如果 YouTube 被屏蔽，那么从 YouTube 提取视频并上传到我们的课程，然后像上一节那样嵌入视频（记住，在做这件事之前，你应该联系视频作者）。\n\
  - 如果我们不想给运行 Moodle 的计算机带来太大压力，我们可以从 YouTube 提取视频，然后上传到 TeacherTube。但你需要为自己创建一个 TeacherTube\
  \ 账户才能这样做（同样，在做这件事之前，请记得与原始视频的创建者确认——当然，除非你就是创建者）。\n- 输入 YouTube 视频的直接链接，让 Moodle\
  \ 的多媒体过滤器将链接转换为嵌入播放器（这意味着你必须确保管理员已开启多媒体过滤器并正确配置）。\n\n让我们看看如何将 YouTube 视频播放器嵌入到我们的课程中。为什么要详细解释一个可能行不通的过程？因为从\
  \ TeacherTube 嵌入视频的过程完全相同。\n\n### 动手实践 – 将 YouTube 播放器嵌入你的课程\n\n第一项任务是搜索你想包含的视频。一个不错的做法是同时打开\
  \ Moodle 和 YouTube。如果你的网络浏览器支持标签页，你可以在它们之间切换。如果不支持，那么在一个浏览器中打开 Moodle，在另一个浏览器中打开\
  \ YouTube。\n\n这是我在 YouTube 上找到的一个关于发射火柴火箭的视频：\n\n![](img/1529021fde33ef551603bbc71587313e_150_0.png)\n\
  \n以下是你需要将其嵌入 Moodle 网页的步骤。\n\n1. 选择你想包含视频的主题，点击“添加一个资源...”并选择“页面”。\n2. 添加一小段介绍性文字。我打算写“从\
  \ YouTube 观看这段视频，展示火柴火箭试射”。\n3. 然后，点击编辑器的特殊 **编辑 HTML 源代码** 按钮：\n    ![](img/1529021fde33ef551603bbc71587313e_151_0.png)\n\
  4. 网页是用一种名为 HTML 的特殊代码编写的，这个按钮允许你在页面代码（编辑器为我们创建的）和页面的实际外观（所见即所得——简称 WYSIWYG）之间切换。此时会显示一个\
  \ HTML 源代码编辑器：\n    ![](img/1529021fde33ef551603bbc71587313e_151_1.png)\n5. 现在切换到\
  \ YouTube 和你想要包含的视频。在页面上查找“嵌入”一词。点击它，你需要复制到 Moodle 的文本会被高亮显示。正如你所看到的，这段文本几乎无法理解。实际上，它是一段网页代码片段。别担心：我们不需要操心它看起来什么样或有什么用。右键单击这段代码，选择“复制”：\n\
  \    ![](img/1529021fde33ef551603bbc71587313e_152_0.png)\n6. 切换回 Moodle。右键单击 HTML\
  \ 源代码编辑器，选择“粘贴”。来自 YouTube 的特殊代码现在已复制到编辑器中。我们刚刚复制的代码看起来很难看，但同样，在这个阶段我们不需要担心它长什么样：\n\
  \    ![](img/1529021fde33ef551603bbc71587313e_152_1.png)\n\n\n\n\n7. 现在按下HTML源代码编辑器上的“更新”按钮，切换回网页实际显示的样子，而不是其编写代码。此时你会看到YouTube视频已嵌入到你的Moodle网页中：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_153_0.png)\n\n## 刚才发生了什么？\n\n我们刚刚看到，利用YouTube提供的代码，将特殊的YouTube视频播放器嵌入到Moodle网页中是如此简单。这很棒，因为如果我们希望所有学生同时观看视频，YouTube能够应对大量用户同时观看同一个视频。问题是，YouTube经常被屏蔽，学生无法访问。\n\
  \n让我们通过从YouTube提取视频来解决这个问题。请注意，在执行此操作之前，你可能需要获得视频作者的许可。\n\n## 从YouTube提取视频\n\n有许多专门从YouTube提取视频的网站——`zamzar.com`\
  \ 和 `keepvid.com` 是两个很好的例子。与其详细解释如何使用这些网站，不如让您回到YouTube，搜索有关zamzar和keepvid的视频。您很快会找到大量教学视频（通常由工具的实际开发者制作），演示如何从YouTube提取视频。\n\
  \n提取视频后，只需按照嵌入视频的说明操作（参见*动手实践——将视频嵌入Moodle页面*）。\n\n## 包含来自TeacherTube的视频\n\nVimeo和TeacherTube都提供特殊代码，允许你嵌入它们各自的视频播放器，过程完全相同。由于TeacherTube专注于教育，让我们快速浏览一下从TeacherTube嵌入视频的过程。\n\
  \n## 动手实践——从TeacherTube嵌入视频\n\n同时打开Moodle和TeacherTube会更容易，就像我们处理YouTube时那样。找一个你喜欢的视频。这里再次出现了火柴火箭测试发射视频：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_154_0.png)\n\n- 1. 在Moodle中，返回课程首页，点击**添加资源...**并选择**页面**。\n\
  - 2. 输入一些介绍性文字，向学生介绍你的视频，然后按下**编辑HTML源代码**按钮。\n- 3. 切换到TeacherTube，查找**可嵌入播放器**：\n\
  - 4. 右键点击网页代码（就像我们对YouTube所做的那样），然后点击**复制**。\n- 5. 现在返回Moodle，确保编辑HTML源代码编辑器仍处于打开状态，然后粘贴我们刚刚从TeacherTube复制的代码：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_155_0.png)\n\n![](img/1529021fde33ef551603bbc71587313e_155_1.png)\n\
  \n现在，我们的课程中包含了相同的视频，但这次是从TeacherTube播放的。\n\n## 声音与视觉——包含多媒体内容\n\n## 刚才发生了什么？\n\n\
  从TeacherTube嵌入视频非常简单——与我们用于从YouTube嵌入视频的过程几乎相同。使用TeacherTube的好处是，学生通常无法访问YouTube。\n\
  \n如果YouTube被屏蔽，我们可以选择的一个办法是从YouTube提取视频，然后将其上传到TeacherTube或Vimeo（一个致力于协作和分享的网站）。如果我们不想让运行Moodle的计算机承受任何压力，尤其是如果我们希望所有学生同时在各自的计算机上观看视频，这是理想的选择。如果你在运行Moodle的计算机上没有太多空间（如果你用视频塞满Moodle服务器，Moodle管理员可能会开始抱怨），这也是一个很好的解决方案。在开始将视频上传到TeacherTube之前，你需要先注册一个TeacherTube账户。\n\
  \n## 小测验\n\n你能概述将所有视频存储在互联网上的文件共享网站（例如YouTube）上的优缺点吗？\n\n## 播放音频\n\n在Moodle中，包含音频的方式有三种，正如包含视频的方式也有三种：\n\
  \n- 1. 在课程首页添加音频文件的链接。\n- 2. 将音频文件嵌入到Moodle网页中——与视频一样，这需要管理员启用多媒体过滤器。\n- 3. 将音频上传到音频分享网站，并从那里流式播放该文件。\n\
  \n![](img/1529021fde33ef551603bbc71587313e_156_0.png)\n\n> 当你在课程中尝试包含视频时，你可能已经发现，并非所有学校和大学的计算机都出于可理解的原因启用了音频（有些学校甚至剪断了耳机插孔的线）。在你阅读以下关于嵌入音频的指南时，请记住，如果扬声器孔或耳机插孔没有声音传出，请告诉你的技术人员或帮助台。你的电脑没有声音很可能是故意设置的。\n\
  \n## 选择音频文件格式\n\n始终转换为常见的音频文件格式之一。与视频文件格式一样（参见*选择视频文件格式*的讨论），这些格式可以通过其文件扩展名来区分。但是，对于音频，请选择MP3，或者退而求其次，选择OGG。如果你选择MP3，那么：\n\
  \n- 当你将文件上传到课程文件区域时，Moodle会识别该文件并为其添加适当的图标。与视频一样，目前这可能不是特别重要，但如果那里有很多文件，并且你想一眼找到特定类型的文件，这就很重要了。\n\
  - 该文件可以在大多数现代计算机、手机和便携式播放器上轻松播放，无需任何特殊操作。\n- 与视频一样，Moodle允许你将此类文件嵌入到Moodle网页中，我们将在接下来的部分中很快看到。\n\
  \n如果你的音频文件不是MP3格式，可以尝试使用免费的在线文件转换工具，例如 zamzar.com、Audacity，或者如果你使用iTunes，也可以使用它。\n\
  \n## 让Moodle处理你的声音\n\n用于嵌入音频的许多过程，无论是通过上传音频文件，还是通过使用音频分享网站，都与用于包含视频的过程非常相似，所以本节比上一节短得多，只是因为很多技术是相同的。让我们首先看看Moodle如何将其自己的音频播放器嵌入到Moodle网页中。\n\
  \n## 动手实践——嵌入音频片段\n\n- 1. 选择一个你想要添加音频文件的主题，并从**添加资源...**列表中选择“页面”。\n- 2. 我有一个关于火箭历史的音频文件想要添加。首先，我要添加一段简短的介绍文字：“收听这个关于火箭的节目...”。\n\
  - 3. 然后，我将使用**Moodle媒体**按钮插入我的音频文件。有关如何使用“插入/编辑嵌入媒体”对话框的详细信息，请参阅*动手实践——将视频嵌入Moodle页面*。我将使用文件选择器上传我的音频文件，然后选择它。完成后，点击**插入**按钮。\n\
  - 4. 向下滚动到“编辑资源”页面底部，然后按下**保存并返回课程**按钮。\n- 5. 从课程首页点击新Moodle网页的链接。Moodle会将音频播放器嵌入到你的网页中：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_158_0.png)\n\n## 刚才发生了什么？\n\n嵌入音频文件与嵌入视频文件非常相似。再次强调，与视频一样，让Moodle嵌入音频播放器意味着你无需担心学生是否知道如何使用他们已安装的音频播放器。\n\
  \n## 音频故障排除——如果Moodle没有嵌入播放器怎么办\n\n如果你只看到音频链接，而没有链接和那个小播放器，该怎么办？那么，你需要与管理员讨论重新配置Moodle。有关详细信息，请参阅本章末尾的“询问管理员”部分。\n\
  \n## 从音频分享网站嵌入音频\n\n为什么要使用音频分享网站？这里有一些很好的理由……\n\n- 如果音频文件很大，那么如果有几个学生同时尝试收听，你可能会给Moodle计算机带来很大压力\n\
  - 你的课程空间可能有限（这个问题也适用于视频）\n- 你的管理员不想启用多媒体插件\n\n值得关注的音频分享网站包括SoundCloud (http://www.soundcloud.com)、Soundboard\
  \ (http://www.soundboard.com/) 和 FindSounds (http://www.findsounds.com/)。当然，Soundboard提供了一个可嵌入的音频播放器，你可以将其包含在Moodle页面中。有关使用SoundCloud、Soundboard和FindSounds的更多信息，请查看YouTube。你会找到大量教学视频。\n\
  \n> 如果你选择使用音频分享网站，请记得检查学生是否可以在你所在机构的计算机上访问它。通常，这些网站也可能被屏蔽。\n\n\n\n\n\n## 动手实践——创建播客\n\
  \n互联网上有很多网站可以让你创建播客，比如 Huffduffer（http://huffduffer.com/）。你可以在授课或讲课时录音，然后创建一个专门的课程播客。请记住，与视频一样，如果学生的声音能被清晰听到，你可能需要确认是否已获得上传这些音频的许可。如果你特别热衷于尝试播客，那么你的管理员可以在\
  \ Moodle 中安装专门的播客模块。\n\n## 更多嵌入相关内容\n\n在本章中，我们一直在研究嵌入视频和音频。说到多媒体，我们当然可以上传 PowerPoint\
  \ 或 Photostory（www.microsoft.com/windowsxp/using/digitalphotography/PhotoStory/default.mspx）文件。但这些都是微软专用的，Moodle\
  \ 用户需要在其计算机上安装相应的查看器才能使用。为了克服这个问题，有很多视频和音频分享网站可供选择——但请记住，要确认你的学生能够访问这些网站（并且没有被你所在机构的网页过滤软件当作“不合适”内容过滤掉）。一个流行的照片分享网站（也是\
  \ Photostory 的替代方案）是 Slide.com，你可以用它把上传的图片制作成可嵌入的相册视频。现在我们来看看具体怎么做。\n\n### 使用 Slide.com\
  \ 进行图片展示\n\n![](img/1529021fde33ef551603bbc71587313e_159_0.png)\n\n> **多媒体无处不在！**\n\
  >\n> 到目前为止，我们只在“网页”资源中嵌入多媒体。你可能已经猜到了，你可以在任何使用 HTML 编辑器的地方嵌入多媒体——包括主题摘要。\n\n我打算重新看一下我关于制作火柴火箭的说明。我想在页面顶部加入一个相册视频——一系列照片，下方配有说明文字，展示制作火箭的实际过程——有点像\
  \ PowerPoint 演示文稿，但完全以图片为中心。\n\nSlide.com 是一项照片分享服务，我可以利用它创建我想要风格的摄影幻灯片。有很多相册设计可供选择（如果我想的话，还可以加入音乐！）。创建好演示后，该服务会提供一小段网页代码，就像我们在本章中看到的许多服务一样，我们可以将其嵌入到\
  \ Moodle 页面中。而且，与我们研究过的所有其他分享服务一样，如果你不想，完全可以不公开你的相册视频。现在让我们看看如何使用 Slide.com 添加幻灯片……\n\
  \n### 动手实践——添加幻灯片\n\n如果你打算使用 Slide.com，那么你需要一个 Slide.com 账户（请注意，这类网站有很多，但只要你用过其中一个，就能轻松使用其他同类网站）。注册是免费的，而且该服务提供全面的在线帮助。正如我们之前发现的，执行以下操作时，最好打开两个浏览器窗口，或者，如果你的浏览器支持标签页，可以在一个标签页中打开你的\
  \ Moodle 课程，在另一个标签页中打开 Slide.com。\n\n1. 在 Slide.com 中创建你的相册视频。只需按照 Slide.com 在线帮助中的说明操作即可。\n\
  2. 你的幻灯片会附带自己的可嵌入代码：\n\n   ![](img/1529021fde33ef551603bbc71587313e_160_0.png)\n\
  \n3. 右键单击代码，然后点击“全选”。再次右键单击并选择“复制”。\n4. 返回你的 Moodle 课程，找到你想加入相册视频的位置。我想把它放在包含火柴火箭制作说明的\
  \ Moodle 网页顶部。我想更新这个资源，所以需要点击“更新”图标：\n\n   ![](img/1529021fde33ef551603bbc71587313e_161_0.png)\n\
  \n5. 点击 **编辑 HTML 源代码** 按钮，打开 HTML 源代码编辑器。\n6. 右键单击编辑器，然后点击“粘贴”，将 Slide.com 提供的代码粘贴进去。\n\
  7. 点击 **更新** 按钮，关闭 HTML 源代码编辑器，返回正常浏览模式，相册视频现在已嵌入到你的 Moodle 页面中：\n\n   ![](img/1529021fde33ef551603bbc71587313e_161_1.png)\n\
  \n### 刚才发生了什么？\n\n我想在火柴火箭制作说明中加入一个相册视频。我使用 Slide.com 完成了这项工作，这是一项免费的在线服务，允许我上传照片（包括说明文字）并创建幻灯片。使用\
  \ Slide.com，我们可以运用大量引人入胜的视觉效果，实现从一张照片到另一张照片的淡入淡出过渡。Slide.com 还允许你在相册视频显示时播放音乐。\n\
  \n> 不希望你的幻灯播客底部出现广告？\n> 在编辑器中选择这些图片，然后按 Delete 键。\n\n### 询问管理员\n\n在本章中，我们在课程中加入了多媒体文件，而让\
  \ Moodle 正确设置为处理多媒体非常重要。接下来的几句话你可能不太明白，但如果 Moodle 无法为你播放音频或视频，那么你需要与管理员协商，启用所谓的“多媒体插件”过滤器，并确保所有功能（包括播放\
  \ Flash 动画——同样，即使你不确定这是什么意思，也要向管理员重复说明）都已启用。没有理由不应该启用这些功能——这就是 Moodle 的默认工作方式。\n\
  \n### 如果不启用多媒体插件会发生什么\n\n当然，你可以在课程中加入多媒体文件，只需像我们在第 3 章“添加文档和讲义”中所做的那样直接上传，然后在课程首页添加指向这些文件的链接——就像我们在那一章后面所做的那样。问题在于，学生电脑上需要安装媒体播放器，他们才能看到或听到文件中的具体内容。这个播放器可能是\
  \ Windows Media Player、RealPlayer、Apple QuickTime，或者学生、家长或学校技术员可能安装了其他各种多媒体播放器。\n\
  \n如果你不让 Moodle 播放你的文件，那么学生尝试使用任何播放器时都会给你带来铺天盖地的问题。而这与 Moodle 无关。说服你的 Moodle 管理员启用多媒体插件，意味着\
  \ Moodle 会替我们处理媒体播放器。不仅如此，实际的视频或音频会被嵌入到网页中，而不是在单独的播放器中播放。这样就不会出现很多学生不知道如何使用他们电脑上恰好安装的媒体播放器的情况。目前，Moodle\
  \ 自带以下文件类型的多媒体插件（你可以将此列表作为可上传到 Moodle 的文件类型参考）：\n\n- MP3（音频文件）\n- SWF（Flash 动画）\n\
  - MOV（电影文件）\n- WMV（Windows 电影文件）\n- MPG（MPEG 视频文件）\n- AVI（视频文件）\n- FLV（Flash 视频）\n\
  - RAM（RealAudio 音频片段或片段序列）\n- RPM（音频文件）\n- RM（音频文件）\n- YouTube 链接（Moodle 可以识别 YouTube\
  \ 页面的链接并自动嵌入视频）\n- OGG（音频文件）\n- OGV（视频文件）\n- 支持自动嵌入链接的图片（Moodle 识别图片链接并自动嵌入图片）\n\
  \n## 小结\n\n在本章中，我们让课程变成了真正的多媒体体验：\n\n- 在课程中加入多媒体非常简单。只要管理员设置得当，Moodle 甚至可以为我们把音频和视频嵌入到网页中。\n\
  - 从 YouTube 和 TeacherTube 嵌入视频很简单，使用它们提供的网页代码片段即可；不过，你必须确保你的学生也能访问你嵌入视频的任何网站。\n\
  - 多媒体不仅仅局限于视频和音频。在本章最后，我们使用 Slide.com 在课程中加入了一个很棒的免费相册视频。我甚至在相册播放时配了背景音乐——但这只能由你亲自尝试才能体会！\n\
  \n本章中我们讨论了很多关于教师使用互联网存储内容的内容。有必要提一下，这样做有利也有弊。你需要记录自己在互联网上放置资源的位置。你可能会发现，最好尽可能多地把内容放在\
  \ Moodle 中，这样你可以确保学生能够访问并查看内容，而且他们看到的内容是安全的。\n\n如果你将音频或视频上传到 Moodle，学生可以根据需要从 Moodle\
  \ 下载这些文件。这可能有助于你决定如何将视频/音频放入 Moodle。\n\n现在我们已经到了这本书的中途，我想你也会同意，我们的课程看起来已经相当不错了。在第\
  \ 5 章“Moodle 大变身”中，我们将了解一些技巧和方法，让我们的课程从“看起来不错”变成“看起来很棒”。\n\n\n\n\n\n## Moodle 改造\n\
  \n我们已经在前五章中走了很长一段路。我们已经把所有资源都上传到了 Moodle，并且在上一章中我们看到了从静态的、基于文本和图像的资源转变为将课程变成完整的多媒体体验是多么容易。事实上，你现在几乎可以邀请学生进来，我相信他们会对我们迄今为止的工作成果印象深刻。\n\
  \n由于我们一直在努力工作，并且在进入本书的后半部分并查看如何转换测验和学生项目之前，让我们休息一下，看看一些建立在我们迄今为止所学和所取得成就之上的技术，这些技术可以让\
  \ Moodle 课程更具吸引力和趣味性。重新整理和重新排列资源并改进呈现方式肯定会提高功能性和易用性。在本章中我们将：\n\n- 不仅仅让每个主题都成为一份冗长的资源列表。使用标签资源和\
  \ Moodle 的缩进工具来改变这一点：\n\n  ![](img/1529021fde33ef551603bbc71587313e_165_0.png)\n\
  \n  变为这样：\n\n  ![](img/1529021fde33ef551603bbc71587313e_166_0.png)\n\n- 找到可以为我们的课程获取大量免费图片的地方\n\
  - 探索使用 HTML 使我们的课程更具吸引力的不同方法\n- 包含一个会说话的角色，一个使用 Voki.com 的动画头像：\n\n  ![](img/1529021fde33ef551603bbc71587313e_166_1.png)\n\
  \n- 备份我们迄今为止所做的一切工作！如果因为电脑故障而丢失所有辛苦的工作，那就太糟糕了！\n\n在第 3 章《添加文档和讲义》中，我们将文档和讲义导入到我们的私有文件区域，并看到了对它们进行排序和组织是多么容易。到目前为止，我一直在课程主页面上添加资源链接，而没有太多考虑链接本身在页面上的组织方式。现在让我们把这个问题解决一下！\n\
  \n### 安排你的资源\n\n为什么要花一点时间安排主题中的资源很重要？这不只是视觉效果吗？让我们来看看我的主题 1：\n\n![](img/1529021fde33ef551603bbc71587313e_167_0.png)\n\
  \n我有一个漂亮的彩色标题，有一些介绍主题的文字，然后是一长串资源，坦白说，看起来就像我在共享驱动器上用来向学生分发文档和讲义的文件列表。如果主题看起来像下面的截图会怎样：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_167_1.png)\n\n### 将你的资源排序\n\n这正是我们需要的效果。我重新排列了我的资源并加入了一些标签，这样学生更容易找到资源。在本节中，我们将学习如何为主题带来一些秩序。\n\
  \n共享驱动器和 Moodle 之间一个明显的差异是，在 Moodle 中你可以按你想要的顺序放置资源，而不是按电脑坚持的顺序（通常是数字/字母顺序）。然而，在\
  \ Moodle 中，任何新添加的资源都只是排在主题的末尾。这意味着我的 **Getting Things Flying** 主题中的资源并不完全按合理的顺序排列，只是按我添加它们的顺序排列。我现在要采取行动来纠正这个问题。\n\
  \n### 行动时间 – 安排你的资源\n\n1. 请记住，在开始之前你需要打开编辑模式。\n2. 选择你想要移动的资源。我要把我的 Backyard Ballistics\
  \ 链接资源移动到主题末尾。为了开始这个过程，我需要“拿起”该资源。我点击移动图标：\n\n   ![](img/1529021fde33ef551603bbc71587313e_168_0.png)\n\
  \n3. 这会导致两件事发生。首先，我想要移动的资源消失了。别担心，想象你已经把它拿在手里，准备放回课程中。其次，现在出现的方框代表了你可以把手中的资源移动到的所有位置：\n\
  \n   ![](img/1529021fde33ef551603bbc71587313e_168_1.png)\n\n4. 选择你想要移动资源的位置。我希望我的链接列表在最后，所以我要点击底部的方框。方框消失了，我的资源已被重新排列：\n\
  \n   ![](img/1529021fde33ef551603bbc71587313e_169_0.png)\n\n### 刚才发生了什么？\n\nMoodle\
  \ 中的资源列表不仅仅是像共享驱动器上那样的一份文件列表。一个明显的差异是，在 Moodle 中你可以按你想要的顺序排列资源，我们刚刚看到了实现这一点是多么容易。\n\
  \n> 找不到移动图标？\n>\n> 你的站点可能配置为可以拖放资源。在这种情况下，移动图标旁边你会看到十字准星。要移动资源，请点击十字准星并保持左鼠标按钮按下，将资源拖到新位置。寻找背景中的线条，这告诉你资源将被放置的位置，然后在找到位置后松开鼠标按钮。\n\
  \n现在我已经把资源按我想要的顺序排列了，我必须说我的主题看起来就像另一个资源堆，这正是我想要避免的。\n\n还记得 *Arrange your resources*\
  \ 部分中的截图吗？如果我能用一段简短的文字为每个资源做介绍，资源会更容易使用：\n\n![](img/1529021fde33ef551603bbc71587313e_169_1.png)\n\
  \n用简短的介绍来介绍资源是改善课程视觉吸引力的好方法。实现这一点的工具称为标签资源，使用方法如下。\n\n5. 点击相关方框放置你的标签。完成！\n\n  \
  \ ![](img/1529021fde33ef551603bbc71587313e_171_0.png)\n\n> 如果你没有移动图标，你会在标签旁边看到十字准星，可以点击它将标签拖到正确位置。\n\
  \n### 刚才发生了什么？\n\n在我们迄今为止使用 Moodle 的经验之后，使用标签资源会相当直接。明智地使用标签意味着我们的课程主题不必仅仅是一长串资源。请记住将标签视为引导学生进入资源的手段。标签不是为内容设计的，所以尽量保持标签简短，最好最多两到三句话。标签就像粘合主题的胶水。你不希望胶水太厚。\n\
  \n看起来更好了，但我的主题仍然显得有点平淡。你可以通过点击资源旁边的向右移动图标来缩进你的资源：\n\n![](img/1529021fde33ef551603bbc71587313e_171_1.png)\n\
  \n下面的截图显示了在稍作缩进后事物的外观：\n\n![](img/1529021fde33ef551603bbc71587313e_172_0.png)\n\n\
  ### 从学生的角度看课程\n\n作为教师，你会在屏幕上看到很多学生看不到的选项。为了清楚地了解学生会如何看到课程，请使用课程 **Settings** 块中的\
  \ **Switch role to...** 选项。从此列表中选择 **Student**，你就会像学生一样看到课程。\n\n完成后，点击 **Return\
  \ to my normal role** 即可恢复正常视图。你还需要打开编辑模式以恢复编辑控件。\n\n### 催眠般的 HTML：润色你的网页和描述\n\n\
  你可以看到我的 **Getting Things Flying** 主题仍然主要是文字。我里面唯一的图片就是 Moodle 图标，用来表示资源或活动类型。我真的想用图片和动画让它变得生动起来，但我可以在哪里获取图形，以及最好的包含方式是什么？\n\
  \n### 寻找装饰性图片\n\n互联网上有一些获取免费图片以包含在课程中的精彩资源。以下是其中一些更受欢迎的资源。\n\n### Google 图片搜索\n\n\
  它非常适合查找几乎任何东西的图片。请注意版权问题（稍后会详细介绍）。图片质量参差不齐，你必须准备好四处寻找。但它们很有趣，非常适合让原本枯燥的课程变得生动起来。\n\
  \n访问 http://images.google.com/ 进入 Google 图片搜索主页面。\n\n我要找一张自制火箭的图片。我在搜索框中输入“DIY Rocket”并点击\
  \ **Search Images** 按钮。我看到一个页面，上面满是 Google 找到的原始图片的微缩版本：\n\n![](img/1529021fde33ef551603bbc71587313e_173_0.png)\n\
  \n\n\n\n\n## Microsoft Office 剪贴画库\n\nMicrosoft 在 Office 中内置了大量精彩的剪贴画图片。例如，在 Word\
  \ 2003 中，单击主菜单中的**插入**，向下滑动到**图片**，再横向滑动到**剪贴画...**，即可打开**剪贴画**侧边栏。我在其中搜索“rocket”，找到了无数的剪贴画图片、真实照片和动画。你可以将搜索范围限定为特定媒体类型。若要向文档添加剪贴画，只需双击缩略图即可。这样，我们就可以整理出一份仅包含课程所需剪贴画图片的单独文档。\n\
  \n现在，我们已经把剪贴画收集到了一个 Word 文档中，那么抓取这些图片的最佳方法是什么？如果你已有一个文档或 PowerPoint 演示文稿，其中包含你想要抓取的图片（包括动画图片），你也会遇到同样的问题。\n\
  \n### 动手实践——从 Word 文档中抓取图片\n\n在*第 4 章，通过 Moodle 提交作业*中，我们学习了如何将 Microsoft Word 和\
  \ PowerPoint 演示文稿转换为网页，以解决学生家中电脑可能未安装 Office 而无法查看文档的问题。如果你将文档另存为网页，抓取图片就非常容易：\n\
  \n- 在 Word 2003 中，从主菜单选择**文件**，向下滑动到**另存为...**。此时会显示**另存为**对话框。\n- 在**另存为**对话框底部，单击**保存类型**下拉列表。选择**网页，仅筛选\
  \ (\\*.htm; \\*.html)**。\n- 确保你确认 Word 即将把文档保存到正确的文件夹，并且文件名也令你满意。单击**保存**按钮。\n-\
  \ 不要理会下一个对话框中的内容。单击**是**。\n- 转到你刚刚保存文档的文件夹。在那里，你应该会找到一个以“_files”结尾的文件夹。你的图片就在里面：\n\
  \n  ![](img/1529021fde33ef551603bbc71587313e_175_0.png)\n\n### 刚才发生了什么？\n\n通常情况下，你可能已经有一个包含所需图片的\
  \ Word 文档或 PowerPoint 演示文稿，希望将其加入课程。我们刚刚创建了一个新的 Word 文档，从 Office 剪贴画库中收集图片，然后看到通过将文档保存为网页来抓取图片是多么容易。对于\
  \ PowerPoint 演示文稿，你也可以轻松地执行同样的操作。\n\n### 版权注意事项\n\n在上一章（*从 YouTube 或 TeacherTube\
  \ 提取视频是否合法？*）中，我们已经遇到过版权问题。现在让我们重新审视这些问题。\n\n由于我们身处教育领域，并且只要我们不打算利用别人的图片赚钱，版权问题就不会太严重。事实上，我从未遇到过版权问题；如果你不清楚网站上哪些内容可以复制、哪些不可以，那么你只需询问版权所有者即可。根据我的经验，向大型企业索取图片时，他们往往会给你发送更多图片。如果你仍然不确定，而且很幸运地有图书馆管理员在你所在机构工作，那么他们应该清楚什么能复制、什么不能复制，以及这些内容如何使用。\n\
  \n另一个需要考虑的问题是在课程中放入教职员工和学生的照片（或一般人的照片）。在课程中使用他们的肖像是否需要获得他们的许可？\n\n## HTML 编辑器技巧与诀窍：表情符号和其他花招\n\
  \n如果你真的想让自己的课程脱颖而出，并且在寻找合适的工具，那么你不需要再找别的，我们一直使用的 HTML 编辑器就是最好的工具。这款编辑器能帮助我们轻松改进课程的外观和感觉，并帮助我们创建引人入胜的\
  \ Moodle 页面。让我们用本节的剩余时间，花一点时间探索一些新思路。\n\n### 表情符号\n\n你试过**插入表情符号**按钮了吗？这是为文本增添一点表现力的非常简单的方法。想表达讽刺，但又不希望学生误解？那就添加一个：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_176_0.png)\n\n想表达你有多开心？插入一个：\n\n![](img/1529021fde33ef551603bbc71587313e_176_1.png)\n\
  \n## 编排你的 HTML\n\n在我忙于整理和编排时，我突然想到，到目前为止我并没有过多考虑页面上的文本和图片如何排列（尽管你可能早就想到了）。目前我的形式是文本然后图片、文本然后图片，依次上下排列。其实不必如此，因为我还可以使用无边框表格并排排列图片：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_178_0.png)\n\n### 动手实践——并排显示内容\n\n让我们尝试在主题中添加一个新网页。确保你有一些可以并排显示的图片：\n\
  \n- 创建新网页后，我们首先需要插入一个表格。单击“插入表格”按钮，显示“插入表格”对话框：\n\n  ![](img/1529021fde33ef551603bbc71587313e_178_1.png)\n\
  \n- 现在你可以指定表格所需的列数和行数。如果你不确定需要多少，不必担心，因为你以后随时可以更改。我打算并排放置两张图片，每张图片下方都有一段文本。这意味着两行两列。当你首次插入表格时，边框厚度为\
  \ 1。如果你想要无边框表格，则必须将边框设置为 0。\n- 在新表格顶行的两个单元格中各插入一张图片：\n\n  ![](img/1529021fde33ef551603bbc71587313e_179_0.png)\n\
  \n- 如果你想查看页面完整视图以便定位图片，请记住你可以拖动编辑器右下角，或者单击“切换全屏视图”按钮打开全屏视图：\n\n  ![](img/1529021fde33ef551603bbc71587313e_179_1.png)\n\
  \n- 然后，我将在每张图片下方的单元格中输入一些文本，给页面加上标题，就这样！我完成了：\n\n  ![](img/1529021fde33ef551603bbc71587313e_180_0.png)\n\
  \n### 刚才发生了什么？\n\n通过使用无边框表格来编排 HTML，我们可以极大地提高网页的视觉吸引力。我们可以将项目排列在表格的单元格中，而不是让文本、图片、文本、图片在页面上依次重复。正如我们所见，添加表格非常容易，如果你发现内容需要更改，以后重新配置表格也很简单。\n\
  \n记住：如果你想要无边框表格，则必须将边框设置为 0。\n\n## 动起来：添加一个会说话的动画角色\n\n如今，多媒体并不仅限于音频和视频。在课程中加入自己定制的动画角色怎么样？免费在线服务\
  \ Voki 可能并不适合所有人，但能带来很多乐趣（在撰写本文时，Voki 网站上现在有一个专门的“Voki for Education”专区）。\n\nVoki\
  \ 角色是屏幕上可说话动画头像，既可以使用计算机生成的语音，也可以使用录音或上传的文件。更多信息请访问 http://voki.com。\n\n你最终需要创建一个\
  \ Voki.com 帐户，但只要你访问 Voki.com，就可以立即开始创建动画角色。还记得我们在第 4 章“声音与视觉——包含多媒体内容”中嵌入多媒体内容的情形吗？同样，Voki\
  \ 会为你提供一段网页代码，我们可以将这段代码嵌入到添加到课程中的任何 HTML 中。\n\n如何创建 Voki 角色超出了本书的范围，但 Voki 网站包含大量相关指导。\n\
  \n在下面的截图中，我编辑了课程摘要，并添加了一个 Voki 版本的我（算是吧！）在发出重要的安全警告：\n\n![](img/1529021fde33ef551603bbc71587313e_181_0.png)\n\
  \n## HTML 块：侧边栏的一点内容\n\n自从我们在第 2 章“设置你的课程”中首次查看构成 Moodle 页面的所有组件以来，我们已经走了很长的路。还记得我们开始时讨论的块（blocks）吗？就是页面左右两侧那些小方框。我提到过你可以添加自己的块，并按你的意愿放置它们。现在让我们来看看具体操作，因为你可以添加的块之一就是\
  \ HTML 块。\n\n让我们使用 HTML 块为学生创建一条欢迎消息。\n\n\n\n\n## 操作时间 – 添加欢迎信息\n\n1. 确保已开启编辑功能，滚动课程主页，找到“添加一个版块”版块，通常位于页面右侧最后一个版块下方：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_182_0.png)\n\n2. 点击“添加...”并从列表中选择“HTML”。Moodle\
  \ 将向页面添加一个新的 HTML 版块：\n\n![](img/1529021fde33ef551603bbc71587313e_182_1.png)\n\n\
  3. 要配置新的 HTML 版块，请点击配置图标：\n\n![](img/1529021fde33ef551603bbc71587313e_182_2.png)\n\
  \n4. 然后你会进入“配置（新的 HTML 版块）版块”页面。为你新加的版块设置一个标题，然后添加内容。完成后，按下“保存更改”按钮。下面是我的新欢迎消息（包括一个动态\
  \ GIF）：\n\n![](img/1529021fde33ef551603bbc71587313e_183_0.png)\n\n5. 但欢迎消息藏在课程主页的右下角可不太好。再次点击配置图标，向下滚动到“此页面上的位置”区域。要将欢迎消息放在页面左上角，我需要将区域指定为左侧，并设置权重为\
  \ -10（也就是说，轻如鸿毛，而不是像大象般沉重的 +10）：\n\n![](img/1529021fde33ef551603bbc71587313e_183_1.png)\n\
  \n6. 现在，我可以把消息放到我想要的位置了：\n\n![](img/1529021fde33ef551603bbc71587313e_184_0.png)\n\
  \n## 刚才发生了什么？\n\n我们向课程主页添加了一个新的 HTML 版块，用于向学生显示欢迎消息。你可以在其中添加任何 HTML。很棒的一点是，你可以在课程首页上添加任意数量的\
  \ HTML 版块。\n\n## 动手实践 – 用 HTML 块做更多事\n\n如果你已经熟悉 HTML 版块，那么这里还有一些想法可以尝试：\n\n- 把你收藏的有用链接列表移动到一个\
  \ HTML 版块中，这样学生更容易找到它们：\n\n![](img/1529021fde33ef551603bbc71587313e_185_0.png)\n\
  \n- 你有没有在课程中添加过 Voki？把你的 Voki 角色放入一个 HTML 版块中。学生可以通过点击版块角落的隐藏图标来隐藏该角色：\n\n![](img/1529021fde33ef551603bbc71587313e_185_1.png)\n\
  \n- 如果你没有看到隐藏图标，请联系你的 Moodle 管理员。你的 Moodle 可能不支持隐藏图标。\n\n- 如果你的学生是在小屏幕笔记本上查看你的课程，他们可以将版块停靠到停靠栏中：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_185_2.png)\n\n![](img/1529021fde33ef551603bbc71587313e_187_0.png)\n\
  \n你可以看到 Moodle 已将你的整个课程备份到一个单独文件中，并放在你的私有备份文件区域。这当然很好，但如果运行 Moodle 的计算机出了问题，这种备份就没什么用了。点击\
  \ **下载** 链接。你可以选择打开文件或保存文件。点击 **保存** 并将文件保存到你的电脑、U盘或便携式硬盘上。请妥善保管：\n\n![](img/1529021fde33ef551603bbc71587313e_187_1.png)\n\
  \n## 刚才发生了什么？\n\n我想，如果到目前为止我所做的所有工作都丢失了，我可能会放声大哭。谢天谢地，备份我的课程很简单。我只需从课程的 **设置** 版块中选择\
  \ **备份**，然后按照说明操作即可。有很多设置可以让我选择实际备份的内容，但目前我只想备份所有内容，这样做真的没有任何坏处。记住：我们会在本书后面再次讨论备份和恢复的用法。\n\
  \n## 总结\n\n在本书的前半部分中，我们学习了 Moodle 的基础知识，并了解了如何把我们一直在使用的资源导入到 Moodle 课程中。我们遇到了许多可以用来实现这一目标的不同技巧，并且我们利用这一章额外花了一些时间来练习和巩固我们到目前为止在本书中学到的想法。\n\
  \n具体来说，我们涵盖了：\n\n- 在主题内安排资源，使主题在视觉上更具吸引力。我们使用“标签”资源作为粘合剂将资源聚合在一起。\n- 我们全面了解了可以用来让课程对学生更有吸引力的技巧和诀窍。\n\
  - 我们使用 Voki.com 添加了一个动画角色，并获得了更多使用嵌入代码的练习。还有其他免费的动画角色可用（例如 http://digimi.com）。\n\
  - 我们使用一个 HTML 版块向学生提供欢迎消息。\n\n我们已经涵盖了将授课课程中所谓的“静态”元素从教室搬到计算机上的内容。但我的教学不仅仅是制作 PowerPoint\
  \ 演示文稿和分发信息表。我会给学生布置项目和作业。在课程进行过程中，我会给他们一些小测验。下一章中，我们将学习如何完全在线管理学生作业。\n"
- "## 6 管理学生作业\n# \n\n_我想你会同意，在本书的前半部分我们已经取得了很大的进展。我们上传了所有的文档、讲义、视频和音频文件。在上一章中，我们探讨了许多让课程对学生更有吸引力和趣味性的方法。你查看过\
  \ Packt Publishing 网站上免费下载的《Moodle 2.0 课程转换》样章吗？这个样章简要介绍了学生如何通过 Moodle 提交作业。在本章中，我们将扩展这个主题，学习如何全面管理学生需要交给我的在线作业。_\n\
  \n目前，在我的“Backyard Ballistics”课程中，我布置了两个大型期末项目：\n\n- 一张关于能源的海报\n- 一个关于物体在空中飞行时能量如何传递的\
  \ PowerPoint 演示文稿\n\n这两个任务分别评分。\n\n作业提交存在许多令人头疼的问题：文件（如 PowerPoint 演示文稿）会丢失。学生声称已经通过电子邮件发送了文件，但你从未收到。学校技术员担心学生用\
  \ U 盘带作业会带来病毒威胁。我们没有快速的方法知道哪些学生还没有交作业。评分可能需要在纸上做笔记，并需要一套系统将这些笔记与存储在其他地方的作业数字照片关联起来。我们需要一个系统，让我们能够在一个自包含的工具中管理学生提交的作业——一个可以在师生之间交换文件、而无需借助其他远不那么可靠的工具的系统。此外，如果能有一个工具让我们在同一个平台下进行评论（包括图片、视频——实际上任何我们喜欢的数字文件）和评分，那岂不是很好？\n\
  \n除此之外，你可能还需要根据关键技能（计算能力、读写能力和信息技术应用）对学生进行评分。而这些技能不一定是你专门为某个项目设置的。在这种情况下，我们需要一种方法，将这些方面的评分与任何具体项目的评分分开进行。这又是一个令人头疼的问题！\n\
  \n通过转换到 Moodle，我们可以轻松找到所有这些问题及更多问题的答案。\n\n在本章中，我们将：\n\n- 演示如何在线管理项目和作业\n- 学习如何在线批改学生项目，包括指定你自己的自定义成绩\n\
  - 学习如何管理学生成绩，包括根据他们的关键技能进行评分\n- 展示如何在线在师生之间传递作业，而无需借助电子邮件、刻录光盘/ DVD，或让学生用 U 盘带作业\n\
  \n那么让我们开始吧，把我的海报项目和 PowerPoint 作业转换到 Moodle 中……\n\n## 转换项目和作业\n\n在本书前面，我向你介绍了开箱即用的\
  \ Moodle 提供的四种在线管理学生作业的方式。回想一下，有四种类型的作业活动，它们可以匹配你为学生布置的任何类型的项目。像我们在第5章“Moodle 改版”中所做的那样，开启编辑功能，进入任何主题并点击“添加一个活动”列表。在这个列表中，你会看到\
  \ Moodle 支持的四种不同类型的作业。它们是：\n\n- **离线活动**：如果你的学生项目无法上传到 Moodle，因为学生的提交不是电子形式的（就像我的海报项目），那么你可以使用这种作业类型来管理成绩和学生的作业笔记。\n\
  - **在线文本**：学生将使用 Moodle 内置的文本编辑器创建作业提交内容。这就是我们到目前为止用来创建课程的编辑器。\n- **上传单个文件**：学生只能上传一个文件。这就是我们在本书前面用来让学生把家庭作业交给我们的活动。\n\
  \n\n\n\n- **高级文件上传：** 学生可以上传多个文件。作为教师，你也可以使用Moodle作为一种在学生之间交换文件的机制，而不是使用电子邮件（不可靠）或U盘（有病毒风险）。\n\
  \n现在来看看这些作业类型。在开启编辑功能后，点击**添加活动...**并选择任意一种作业类型。这样，在我们开始之前，你就能对将要处理的设置类型有所了解。\n\n\
  > 记住：如果在尝试不同作业类型时，你不小心向课程中添加了一个作业，只需点击作业名称旁边的删除图标，即可轻松删除。\n\n## 在线组织转换后的项目和作业\n\n\
  对于较大的项目或作业，通常最好有一个自包含的主题，其中包含实际作业本身以及所有支持材料。你可以加入范例（例如，前几年的作品示例），并让学生有机会一起讨论。本书后面还会介绍更多使用Moodle在线讨论范例的内容。将作业及其所有支持材料放在同一个主题中，意味着我可以先将作业对学生隐藏，直到他们该尝试完成作业的时候。\n\
  \n为了演示如何进行，首先我们需要向课程添加一个新主题，然后添加一个作业活动。\n\n### 向课程添加新主题\n\n我打算在课程中专门为学生项目添加一个新主题。然后我会将该主题隐藏，直到我们完成课程。还记得我们之前在这本书中是如何隐藏“仅供教师”的主题的吗？我将对我的项目及其相关支持材料采取同样的做法。你不必以这种方式处理作业：在浏览Moodle作业的设置时，你会注意到你可以指定这些作业可用的时间段（这是我们稍后将讨论的一个设置）。我决定要确保学生在开始尝试完成任何作业之前专注于前期工作，因此我将完全向他们隐藏这一部分。\n\
  \n### 操作时间 – 添加主题并隐藏它\n\n1. 返回课程首页，然后从“设置”区块中选择“编辑设置”。\n2. 向下滚动到“每周/主题数”设置，然后更改下拉列表中的数字，为课程添加另一个主题：\n\
  3. 在页面底部，按“保存更改”按钮。就这样，我们完成了——现在在课程末尾会有一个新的空主题。\n4. 目前，我想向学生隐藏该主题。点击右侧的眼睛图标以隐藏该主题：\n\
  5. 这取决于你所用的主题（theme），但为了表示某个主题（topic）已隐藏，会在该主题的左右两侧显示两个灰色的条：\n\n![](img/1529021fde33ef551603bbc71587313e_192_0.png)\n\
  \n![](img/1529021fde33ef551603bbc71587313e_192_1.png)\n\n![](img/1529021fde33ef551603bbc71587313e_192_2.png)\n\
  \n### 刚才发生了什么？\n\n现在我们的课程中新增了一个空主题。我不希望学生在一切准备就绪之前看到作业，所以暂时对他们隐藏了这个主题。\n\n### 哪种作业类型\n\
  \n为了我的项目，我将只研究两种不同的作业活动类型——但通过现在查看这两种类型，以及本书前面已经学习过的“单文件作业”，我们将获得技能和信心来轻松使用所有可用的类型。值得注意的是，因为Moodle是模块化的，软件作者提供了其他作业类型：在任何Moodle中，一个受欢迎的附加组件（尤其是在语言教师中）是Nanogong作业（http://gong.ust.hk/nanogong/index.html）。同样，凭借在这里获得的经验，你很快就能熟练掌握在Moodle中发现的任何自定义作业模块。\n\
  \n### 使用离线作业将项目转换为Moodle\n\n第一个项目——海报项目——将转换为使用“离线活动”作业类型。我将使用Moodle来管理学生成绩，并整理我对他们作品的笔记和评论。让我们看看添加离线活动是多么简单。\n\
  \n### 操作时间 – 添加离线活动作业\n\n1. 请确保你仍然开启编辑功能。在你要添加新作业的主题中（在我的例子中是我新隐藏的主题），点击“添加活动...”并从列表中选择“离线活动”。现在你会进入“编辑作业”页面。\n\
  2. 为你的作业命名。在“描述”框中输入任务的简短描述。如果框看起来有点小，不用担心。我们可以将所有支持材料连同作业活动本身一起放在课程首页的主题中：\n\n\
  ![](img/1529021fde33ef551603bbc71587313e_193_0.png)\n\n3. 使用“成绩”设置指定此作业的最高分。我将把“成绩”设置保留为100（意味着我可以在100分中为这个作业评分）。也许你的作业是总成绩的一部分，你需要用较少的分数来评分。你可以选择如何给作业评分。你甚至可以选择创建自己的自定义成绩（例如A、B、C、D、E或F），这将在本章后面学习。\n\
  4. 选择你希望作业何时可用。我想同时隐藏作业以及支持资源和材料，所以这个选项是多余的。我可以选择禁用此设置，所以在这种情况下我会这样做。如果你没有隐藏作业，“可用开始时间”和“截止日期”设置是防止学生在你就绪之前向你提交作业的有用方法：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_194_0.png)\n\n5. 就这样！我们完成了。按下“保存并返回课程”按钮。刚刚向课程中添加了一个新作业：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_194_1.png)\n\n### 刚才发生了什么？\n\n将我的海报项目转换为Moodle，就像向我的Backyard\
  \ Ballistics课程添加离线活动作业一样简单。现在点击该作业，看看会发生什么。你会看到一个屏幕，显示你刚刚设置的任务，并且在右上角你会看到一个“还没有人尝试过此作业”的链接：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_195_0.png)\n\n现在点击该链接。你将看到一个已注册你的课程的学生列表。如果你的课程没有注册任何学生，那么你将看到以下内容：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_195_1.png)\n\n我是我的课程中唯一“注册”的人（作为教师）。在我确定课程已按我期望的方式设置好之前，我还不想让学生注册到我的课程中。在Packt\
  \ Publishing网站提供的免费附加章节中，我演示了如何在Moodle课程中引入一个“对照学生”。我将再次这样做，以测试我新加入的作业。但在那之前，我需要考虑需要转换的第二个作业——学生需要制作一个PowerPoint演示文稿。\n\
  \n### 使用高级文件上传作业将项目转换为Moodle\n\n我将让学生使用“高级文件上传”作业类型提交他们的PowerPoint文件。为什么不使用单个文件上传？使用高级文件上传作业有以下优点：\n\
  \n- 学生可以上传多个文件（总数量由我控制）\n- 我的学生和我可以在线交换作业，而不必求助于U盘和电子邮件\n\n现在让我们快速了解添加高级文件上传作业的过程...\n\
  \n### 操作时间 – 添加高级文件上传作业\n\n在开启编辑功能后，在你要添加新作业的主题中，点击**添加活动**并选择**高级文件上传**。现在你位于**编辑作业**页面。与离线作业相比，此活动有更多的配置选项，但目前我只关心重要的选项。请记住，如果有关于特定设置的更多信息，请查看页面底部的针对此页面的Moodle文档链接——如果需要，你随时可以返回并在以后更改设置。\n\
  \n1. 为你的作业命名并填写描述。\n2. 使用**成绩**设置指定此作业的最高分。我将把成绩设置保留为100（意味着我可以在100分中为这个作业评分）。也许你的作业是总成绩的一部分，你需要用较少的分数来评分。你甚至可以选择创建自己的自定义成绩（例如A、B、C、D、E或F），这将在本章后面学习。\n\
  3. 向下滚动到**高级文件上传**选项框：\n\n![](img/1529021fde33ef551603bbc71587313e_196_0.png)\n\n\
  \n\n\n\n- 4. 由于这是一个 PowerPoint 演示文稿，我期望学生上传它。我会据此设置最大文件大小。并且我会允许学生删除他们已上传的内容（以防他们不小心传错了文件）。\n\
  \n- 5. 如果你希望允许学生在提交时附带简短说明，请确保将 **允许备注** 设置为 **是**：\n\n  ![](img/1529021fde33ef551603bbc71587313e_197_0.png)\n\
  \n- 6. 因为我打算在准备好之前隐藏这两个项目，所以我可以将 **在可用日期之前隐藏描述** 设置为 **否**。如果你没有像我这样隐藏整个作业，而是使用\
  \ **可用起始时间** 和 **截止日期** 设置，那么请将 **隐藏描述** 设置为 **是**。这样学生会知道他们有一个作业要交，但描述只有在到达 **可用起始时间**\
  \ 时才会显示。\n\n- 7. 将 **向教师发送电子邮件提醒** 设置为 **是**，以便在学生提交作业时及时得知。请谨慎使用此设置：如果你是一位教师，但对该课程中提交的作业并不感兴趣，那么收到数十封告知学生作业已提交的邮件会让人厌烦（甚至令人恼火）。\n\
  \n- 8. 滚动到页面底部，点击 **保存并显示**。你的新作业现在就配置好了：\n\n  ![](img/1529021fde33ef551603bbc71587313e_198_0.png)\n\
  \n## 刚才发生了什么？\n\n我们刚刚完成了两种作业类型的添加：**离线活动** 和 **高级文件上传** 作业。我们还没有涉及 **在线文本** 作业类型，但凭借你目前已掌握的技巧和经验，你也能轻松使用这些类型。在我们学习如何在\
  \ Moodle 中批改作业之前，为什么不花点时间现在看看 **在线文本** 作业呢？\n\n## 在你的课程中引入一名学生\n\n你已经看到了我们向课程中添加作业和项目工作是多么简单。然而，我们确实需要体会一下学生使用\
  \ Moodle 提交作业、并在提交后查看成绩和教师反馈的感受。与本书前面部分一样，此阶段我们需要的并非真实学生。我们需要一个“测试学生”，幸运的是，我的 Moodle\
  \ 管理员已经为我创建了一个（参见 Packt Publishing 网站上提供的 Moodle 2.0 Course Conversion 免费附加章节下载）。这让我可以以测试学生身份登录。\n\
  \n## 注册学生\n\n我的 Moodle 管理员为我创建了一个测试学生，并提前将该学生注册到了我的课程中。假设你有权限注册学生（如果不确定，可以咨询你的 Moodle\
  \ 管理员），以下是如何注册你自己的学生：\n\n### 操作时间 – 在你的课程中注册一名学生\n\n- 1. 在 **设置** 板块中，找到 **课程管理**\
  \ 下的 **用户** 链接并点击它——然后点击 **已注册用户**：\n\n  ![](img/1529021fde33ef551603bbc71587313e_199_0.png)\n\
  \n- 2. 此时会显示 **已注册用户** 屏幕。要注册新用户，请点击任意一个 **注册用户** 按钮：\n\n  ![](img/1529021fde33ef551603bbc71587313e_199_1.png)\n\
  \n- 5. 点击学生姓名右侧的 **注册** 按钮，将该用户注册为学生。他们的姓名会缩进显示，并且 **注册** 按钮会消失：\n\n  ![](img/1529021fde33ef551603bbc71587313e_201_0.png)\n\
  \n- 6. 点击弹出窗口右上角的关闭图标，即可关闭对话框并实际完成学生注册。随后你会看到该学生显示在 **已注册用户** 页面中：\n\n  ![](img/1529021fde33ef551603bbc71587313e_201_1.png)\n\
  \n- 7. 就这样！我们完成了。\n\n## 刚才发生了什么？\n\n我没有去麻烦 Moodle 管理员为我的课程注册测试学生，而是自己将该用户注册为学生。掌握了这个知识后，如果我想的话，就可以将整个班级注册到我的课程中。但管理注册的方式多种多样（包括让学生使用我设定的密码自行注册），我们将在后续章节中探讨。\n\
  \n记住：在以学生身份登录之前，我需要先显示作业主题。如果我没有显示，而我是学生，那么我会看到以下内容：\n\n![](img/1529021fde33ef551603bbc71587313e_202_0.png)\n\
  \n主题不可用。请确保在退出登录之前，点击闭合的眼睛图标以睁开眼睛并显示主题。\n\n## 作业在学生眼中的样子\n\n我已退出登录，然后以学生 John Smith\
  \ 的身份重新登录。对于离线活动而言，它们是在现实世界中完成的。在这种情况下，Moodle 用于管理成绩和备注。如果我点击我的离线活动，我只会看到作业的描述：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_203_0.png)\n\n我的第二个作业要求学生上传文件。在下一节中，我们将体验一下作为\
  \ Moodle 学生尝试将项目文件提交到 Moodle 时的感受。\n\n## 站在学生的角度 – 上传项目文件\n\n当我们要求学生在线向我们提交项目作品时，非常有必要了解我们期望他们做什么。至少，当我们要求学生将项目作品上传到\
  \ Moodle 时，我们需要知道自己在说什么，以防他们有任何疑问。如果你没有学生登录账号，或者你仍以自己身份登录并请同事检查你的作业是否设置正确，那么在他们执行以下步骤时，你最好在一旁仔细观察。让我们一起看看学生必须如何向我们上传文件。\n\
  \n### 操作时间 – 上传文件到作业\n\n我只有一台电脑可用，所以首先要做的是退出登录，然后以我的模拟学生“John Smith”身份重新登录。如果你有幸拥有两台相邻的电脑，那么你可以在其中一台以自己身份登录，同时在另一台以模拟学生身份登录。你也可以在同一台电脑上安装两个不同的浏览器（例如\
  \ Firefox 和 Internet Explorer）。如果是这样，你可以一个浏览器以教师身份登录，另一个以学生身份登录。不要尝试在同一台电脑上使用同一个浏览器以两个不同身份登录——这是行不通的。现在，你已经以学生身份登录了。\n\
  \n- 1. 返回课程主页面，点击你之前添加的 **高级文件上传** 作业。你会看到以下页面：\n\n  ![](img/1529021fde33ef551603bbc71587313e_204_0.png)\n\
  \n  页面上半部分是我们在作业中的描述。下半部分允许我们上传文件，并且因为我将活动配置为允许学生在提交时附上评论，所以还有一个填写备注的区域。学生可以像我们向课程文件区域上传教学材料一样，浏览并上传文件。如果他们想要添加备注，则需要点击\
  \ **编辑** 按钮（见上一张截图底部）。\n\n- 2. 现在点击 **上传文件** 按钮。在接下来的屏幕上，点击 **添加...** 按钮以显示文件选择器对话框。这允许我们选择要上传的文件。现在你可以随便选一个文件，只是为了证明这一点。我快速用记事本创建了一个名为\
  \ `example_submission.txt` 的文本文件。使用文件选择器（通过左侧的 **上传文件** 链接）选择你要上传的文件：\n\n  ![](img/1529021fde33ef551603bbc71587313e_205_0.png)\n\
  \n- 3. 点击 **上传该文件** 按钮。然后点击 **保存更改** 按钮。现在你会看到该文件显示在 **提交草稿** 框中：\n\n  ![](img/1529021fde33ef551603bbc71587313e_205_1.png)\n\
  \n  你可能已经注意到，如果需要，你可以使用文件选择器上传多个文件。\n\n- 4. 要为提交内容添加备注，我可以点击页面底部的 **编辑** 按钮。现在就试试留下一条备注吧。（如果你的作业配置为禁止学生留下备注，你就不会有这个选项。）\n\
  \n- 5. 如果我觉得这是项目的最终版本，并希望将其送去批改，那么我可以点击页面底部的 **发送以批改** 按钮。点击此按钮后，我将无法再上传更多文件：\n\n\
  \  ![](img/1529021fde33ef551603bbc71587313e_206_0.png)\n\n- 6. 就这样。我们完成了：\n\n  ![](img/1529021fde33ef551603bbc71587313e_206_1.png)\n\
  \n\n\n\n\n## 刚刚发生了什么？\n\n我们很容易将作业转换为 Moodle。现在我们已经看到学生将作业提交转换为使用 Moodle 是多么容易。我们实际上也有一份作业需要批改（尽管是假的），我已准备好开始批改。\n\
  \n在继续下一部分之前，请确保你是以自己的身份登录，而不是以学生的身份登录。\n\n## 批改作业\n\n管理学生成绩以及与学生提交作业相关的文书工作是我最大的头疼问题之一。通过转换为\
  \ Moodle，我可以避免所有这些问题。让我们看看在 Moodle 中批改作业是多么容易。\n\n### 批改离线作业\n\n我的离线作业，海报项目，是在现实世界中进行的。目前，我拍摄海报的数码照片，并在单独的纸张上记录我的评论和成绩。让我们看看我如何将其转换为\
  \ Moodle...\n\n### 动手时间 – 批改一份离线作业\n\n1. 从课程首页，点击你的 **Offline assignment**。\n2.\
  \ 点击页面右上角的 **No attempts have been made on this assignment/View 0 submitted assignments**\
  \ 链接。你现在将被带到提交页面。我课程中只注册了一名学生——我的管理员为我创建的假学生并注册到我的课程——所以我看到的是：\n\n![](img/1529021fde33ef551603bbc71587313e_207_0.png)\n\
  \n3. 要给 John Smith 的作业评分，我需要在状态列中点击 Grade 链接。反馈页面显示：\n\n![](img/1529021fde33ef551603bbc71587313e_208_0.png)\n\
  \n4. 我可以使用此屏幕对学生的作业进行评论。此时，如果我想的话，我可以在评论中包含海报的照片（或者我可以让学生拍摄他们海报的照片并将其作为在线提交的一部分上传）。\n\
  \n5. 如果作业已完成并准备好批改，我可以使用成绩部分中的下拉列表指定成绩（在我这里是满分 100 分）：\n\n![](img/1529021fde33ef551603bbc71587313e_208_1.png)\n\
  \n6. 当你完成评论和/或评分后，按下 **Save changes** 按钮。提交表会相应更新：\n\n![](img/1529021fde33ef551603bbc71587313e_209_0.png)\n\
  \n按下 **Save changes** 后会发生什么？从教师的角度来看，**No attempts have been made on this assignment**\
  \ 链接会变为 **View 1 submitted assignments**。如果你是学生，那么你可能会收到一封电子邮件，通知你已收到作业反馈（取决于你的\
  \ Moodle 设置方式）。\n\n### 刚刚发生了什么？\n\n我们已经看到将 Moodle 用于管理学生成绩和我对“离线”海报项目的学生作业评论是多么容易。请记住，与\
  \ Moodle 中的其他任何事物一样，如果你以后需要更改评论甚至成绩，你可以回来并非常轻松地进行相关更改。\n\n现在让我们继续查看我们的高级文件上传作业。首先要了解的问题是如何从教师的角度处理学生提交的作业。\n\
  \n### 处理学生提交的作业\n\n返回你的课程首页并点击你的 **Advanced uploading of files assignment**。以学生身份注册时，我已向此活动提交了作业。现在查找页面右上角的链接：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_209_1.png)\n\n![](img/1529021fde33ef551603bbc71587313e_211_0.png)\n\
  \n2. 页面顶部将列出学生上传的文件（在本例中，只有一个）。请回忆，当我以学生身份登录时，我按下了 **Send for marking** 按钮。这是为了确认我认为我已完成作业，并且还阻止我上传或修改文件。因为我不认为这个学生实际上已经完成，所以我可以按下\
  \ **Revert to draft** 按钮以允许学生再次修改和提交文件。如果显示，请按下 **Revert to draft** 按钮：\n\n![](img/1529021fde33ef551603bbc71587313e_211_1.png)\n\
  \n3. 反馈屏幕的下半部分有一个区域，允许我以响应文件（Response files）的形式向学生提供反馈：\n\n![](img/1529021fde33ef551603bbc71587313e_212_0.png)\n\
  \n4. 在 Response files 旁边：点击 Add... 按钮。使用文件选择器对话框选择 example_submission_v2.txt。一旦文件被选中（通过文件选择器左侧的\
  \ Upload a file 链接），文件现在已上传到 Moodle：\n\n![](img/1529021fde33ef551603bbc71587313e_212_1.png)\n\
  \n5. 在编辑器中输入你对这项工作的评论。完成后，按下页面底部的 Save changes 按钮。\n\n6. 提交页面会相应更新，我们就完成了：\n\n![](img/1529021fde33ef551603bbc71587313e_213_0.png)\n\
  \n### 刚刚发生了什么？\n\n当我们将 Moodle 用于课程作业时，对学生提交的作业提供反馈很容易。我们不必担心发送电子邮件（取决于 Moodle 的设置方式，学生会被发送电子邮件通知你已提供反馈）或担心通过使用存储棒传播病毒。所有内容都在线保存在\
  \ Moodle 中。但当我们向他们提供反馈时，学生看到的是什么呢？\n\n### 确认我们的反馈已被接收\n\n此时再次以学生身份登录是个好主意，这样我们可以体验一下作为接收教师反馈的学生是什么感觉。\n\
  \n再次以学生身份登录 Moodle 并点击我的高级文件上传作业，我看到以下页面：\n\n![](img/1529021fde33ef551603bbc71587313e_213_1.png)\n\
  \n我的备注显示出来，学生有机会下载我上传的已更正文件。\n\n### 批改学生提交的作业\n\n批改高级文件上传活动中的学生提交作业的过程与批改离线活动基本相同。从提交页面，点击学生姓名旁边的\
  \ Grade 链接。反馈对话框显示。要了解有关设置最终成绩的更多详细信息，请按照动手时间 – 批改一份离线作业中的说明进行操作。\n\n### 指定自定义成绩\n\
  \n目前，我的项目是按 100 分制评分，但正如我之前提到的，这并不是他们被评分的方式。根据教学大纲，我只能给学生四种成绩之一：Distinction、Merit、Pass\
  \ 和 Referral。那么你如何指定自己的成绩呢？让我们现在学习如何做到这一点。\n\n### 动手时间 – 创建自定义成绩等级\n\n返回你的课程首页并在设置块中查找\
  \ Grades：\n\n![](img/1529021fde33ef551603bbc71587313e_214_0.png)\n\n点击 Grades，你将被带到\
  \ Grader report 页面。我们现在进入了 Moodle 成绩簿。我现在不会太担心成绩簿中的所有功能——但在那里时，你可能想花一点时间看看。就像 Moodle\
  \ 中的其他任何事物一样，你不会因为不小心做错什么而造成任何损害。\n\n尽管我指定了一个，但如果你不想的话，你不必担心描述——它是可选的。你在此处指定的成绩是否用于其他课程的评分？如果勾选\
  \ Standard scale 框，则你的等级将提供给所有课程的教师。\n\n完成后，按下 Save changes 按钮。你的新等级列在等级页面上。因为我没有将我的新等级设为标准等级，所以它被列为自定义等级：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_216_0.png)\n\n### 刚刚发生了什么？\n\n我不会给 Backyard\
  \ Ballistics 项目的学生一个数值成绩。教学大纲要求的是定性成绩，但幸运的是系统使创建我自己的自定义成绩等级变得很容易。现在我需要做的就是修改我的两个作业活动以使用新的等级。这只需要几次点击，让我们现在就做...\n\
  \n### 动手时间 – 使用自定义等级进行评分\n\n1. 返回你的课程首页并点击你想要更改为使用新自定义等级的作业旁边的更新图标。编辑作业页面显示。\n2.\
  \ 滚动到 Grade 下拉列表。点击该列表。如果需要，向上滚动，因为我们想要使用的自定义等级将在最顶部附近。\n\n\n\n\n\n![](img/1529021fde33ef551603bbc71587313e_217_0.png)\n\
  \n+   3.  选择新的评分量表后，向下滚动到页面底部，然后按**保存并返回课程**按钮。\n+   4.  就这样。您现在可以使用新的评分量表为您的项目评分了。\n\
  \n## 刚刚发生了什么？\n\n我们刚刚修改了作业，使其使用我们的新评分量表。现在剩下的就是演示如何使用它了。既然我们已经回到了课程首页，请点击作业本身的链接以显示作业的主页面（显示我们设置的任务描述）。点击页面右上角的**查看已提交的作业**链接，进入提交页面。\n\
  \n管理学生作业\n\n选择一名学生，然后在“状态”列中点击**评分**链接。如果您已经为该学生评分，那么该链接将显示为**更新**：\n\n![](img/1529021fde33ef551603bbc71587313e_218_0.png)\n\
  \n点击该链接打开**反馈**页面。在**成绩**部分点击**评分**：下拉列表，以显示您可以为此项作业给出的成绩。列表中显示的成绩来自我们新的自定义评分量表：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_218_1.png)\n\n## Moodle 作业的更多用途\n\n我们不必将四种作业活动仅限于用于大型项目。以下是一些更多关于使用作业活动将您当前的教学转换为\
  \ Moodle 的想法。\n\n+   1. 包含一个在线文本作业，以支持学生可以使用 Moodle 的文本编辑器撰写提交内容的任务，例如写短篇故事或简短的论文作业任务。\n\
  +   2. 如果您能够在教学时间向全班展示单文件作业的提交页面，请在学生提交作业时不断刷新页面。您很快就会发现，学生们会争相第一个交作业。您可以轻松地将其变成年幼学生的游戏。\n\
  +   3. 使用离线活动来管理您为学生设置的任何任务的成绩——例如，以纸质形式提交的作业。您不必仅限于项目。\n\n关于最后一点，还有另一种直接管理成绩的方法。我们在设置自定义评分量表时已经简要介绍了\
  \ Moodle 成绩报表。让我们重新访问该页面，看看如何设置自定义评分项目。\n\n## 基于核心能力为学生评分\n\n作为教育工作者，我们经常需要根据核心能力（也称为关键技能或目标）来评定作业。这当然适用于我的教学大纲：我课程最终成绩的一部分包括计算能力、读写能力和信息通信技术使用能力的分数。因为我们正在转换为\
  \ Moodle，而在 Moodle 的术语中，我正在评分的这些能力被称为“成果”，所以在最后一节中，我们将学习如何指定我们需要评分的核心能力，以及如何据此为学生评分。转换为\
  \ Moodle 有利有弊，具体来说：我可以选择在每项作业的基础上启用成果，但您不能使用默认的数字评分量表来评定成果，只能使用标准和自定义评分量表（例如我在*行动时间——创建自定义评分量表*中创建的自定义\
  \ Backyard Ballistics 量表）。\n\n## 配置成果\n\n让我们先看看为作业指定学习成果有多么容易。\n\n## 行动时间——在成绩报表中创建自定义评分项目\n\
  \n+   1. 返回您的课程首页，然后点击**设置**区块中的**成果**链接：\n\n![](img/1529021fde33ef551603bbc71587313e_219_0.png)\n\
  \n## 看不到“成果”链接？\n\n如果您看不到“成果”链接，那么您需要与您的管理员联系以启用此功能。请查看本章末尾的“询问管理员”部分。\n\n2. 您现在被带到课程中使用的成果页面。如果您需要评分的成果未列在“标准成果”框中，那么我们需要添加它们。假设情况如此，请点击“课程中使用的成果”下拉列表并选择“编辑成果”：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_220_0.png)\n\n3. 按“添加新成果”按钮。为您的成果指定一个名称、一个简称，并选择您想用来评定此成果的量表。请记住：如果需要，您可以创建自己的自定义量表来评判成果。完成后，按页面底部的“保存更改”按钮，随着您添加更多成果，您将开始建立一个成果列表：\n\
  \n## 自定义成果\n\n| 全名 | 简称 | 量表 | 项目 | 编辑 |\n|---|---|---|---|---|\n| 计算能力 | 计算能力 |\
  \ Backyard Ballistics 量表 | 0 | ✖ |\n| 读写能力 | 读写能力 | Backyard Ballistics 量表 | 0 |\
  \ ✖ |\n| 信息通信技术使用 | 信息通信技术使用 | Backyard Ballistics 量表 | 0 | ✖ |\n\n添加新成果\n导出所有成果\n\
  \n4. 完成后，点击“编辑成果”下拉列表并选择“课程中使用的成果”，您将看到您的新成果已列出：\n\n# 成果：课程中使用的成果\n\nC-BC ▶ 成绩管理\
  \ ▶ 成果\n\n课程中使用的成果\n\n课程中使用的成果\n自定义使用（不可移除）\n计算能力\n读写能力\n信息通信技术使用\n\n可用的标准成果\n\n\
  ◀ 添加\n▶ 移除\n\n编辑成果\n\n## 刚刚发生了什么？\n\n我们刚刚看到了为课程定义成果（核心能力）有多么容易。现在成果已经定义好了，我们需要在每项作业的基础上指定我们要评定哪些成果。\n\
  \n我将修改我的海报项目作业。这是一个离线作业活动，但这可以是任何类型的作业活动……\n\n## 行动时间——在作业中评定核心能力\n\n+   1. 返回您的课程首页，然后点击您想要更改的作业旁边的更新图标，打开“编辑作业”页面。\n\
  \n+   2. 向下滚动页面并寻找“成果”框。如果您需要请管理员为您启用成果，那么这个框是“编辑作业”页面的新增内容：\n\n![](img/1529021fde33ef551603bbc71587313e_222_0.png)\n\
  \n+   3. 我已经勾选了我想要为学生评定的能力（仅“信息通信技术使用”）。向下滚动到页面底部，然后按“保存并显示”按钮。\n\n## 刚刚发生了什么？\n\
  \n我已经配置了我的离线作业，现在我可以根据计算能力、读写能力和信息通信技术这三项核心能力为学生评分了。\n\n那么，我们如何为学生评分呢？如果您按了“保存并显示”按钮，您现在应该位于作业主页面。如果您已返回课程首页，请现在点击您刚刚重新配置的作业。点击页面右上角的“查看已提交的作业”链接。\n\
  \n显示学生提交内容的表格现在包含一个新列：“成果”。如果您为学生评分，您将在“成绩”部分看到新的选项，用于对您已勾选的成果进行评分。现在就来看看这些新选项，例如：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_223_0.png)\n\n## 询问管理员\n\n在我们可以指定核心能力之前，我们需要确保\
  \ Moodle 成果已启用——这是只有我们的 Moodle 管理员才能完成的工作。我们需要的设置可以通过**设置**区块下的**站点管理**访问，然后点击**高级功能**。您的管理员需要确保**启用成果**选项已被勾选。\n\
  \n## 总结\n\n在本章中，我们学到了很多关于在 Moodle 中管理学生作业的知识。\n\n具体来说，我们涵盖了：\n\n+   - 如何使用 Moodle\
  \ 在线组织转换后的项目和作业。我们讨论了如何向课程添加新主题，以及这样做如何允许我们隐藏作业及其辅助参考材料，直到学生准备好开始他们的项目工作。\n+   -\
  \ 将四种 Moodle 作业活动之一与您的课程作业或项目相匹配。我们讨论了如何使用每种活动将家庭作业任务以及更大型的项目转移到线上。\n+   - 从学生的角度看作业是什么样子。我们讨论了了解学生如何提交作业的重要性，以便在学生开始在线学习时您准备好提供帮助和指导。\n\
  +   - 如何在线批改作业。我们看到了在 Moodle 中管理项目成绩有多么容易。\n\n我们还讨论了如何使用 Moodle 来评定核心能力——展示了如何在每项作业的基础上进行配置。\n\
  \n现在我们已经学习了如何管理学生作业，我们准备继续学习如何在线与学生讨论作业——这是下一章的主题。\n\n\n\n\n"
- "# 7 在线沟通\n\n在上一章中我们看到了如何将项目和作业转换为 Moodle，但这只是故事的一部分。当我们布置作业时，很少只是把作业发给学生就让他们去做。作业工作会得到讨论的支持，既有我们作为教师的讨论，也有学生之间建设性的（我们希望如此）交流。如果我们要将项目工作搬到线上，那么不仅将这些类型的讨论搬到线上是有意义的，而且这样做还有明显的优势。本章我们将介绍：\n\
  \n- 论坛\n- 在线聊天室\n- Moodle 消息\n\n### 在 Moodle 中沟通\n\nMoodle 中的双向沟通有三种形式：\n\n- **实时、同步聊天**：Moodle\
  \ 自带即时消息系统（例如 MSN），允许我们在学生（或我们）不在教室时与学生交谈：\n\n![](img/1529021fde33ef551603bbc71587313e_226_0.png)\n\
  \n- **论坛**：就像老式的留言板。你发布一个问题或评论，后来有人发布回复：\n\n![](img/1529021fde33ef551603bbc71587313e_226_1.png)\n\
  \n- **消息**：不要被名字混淆；Moodle 消息服务允许你向任何其他 Moodle 用户发送消息。这与聊天不同，因为它更像电子邮件消息，而不是即时消息。Moodle\
  \ 消息系统是你员工和学生信箱的在线替代品：\n\n![](img/1529021fde33ef551603bbc71587313e_227_0.png)\n\n\
  在本章中，我们不仅将学习如何设置它们，还将学习在教学环境中每种工具的最佳实践。具体来说，在本章中你将：\n\n- 创建一个 Moodle 论坛并探索它可以使用的各种方式。\n\
  - 开启一个聊天室，允许学生在实时在线交谈。我们将探讨这种工具的利弊。\n- 学习如何将 Moodle 消息推送到学生的信箱中。\n- 看到所有学生评论都被完整记录并可追溯到发表评论的学生。Moodle\
  \ 提供了支持你机构数据保护或电子安全政策所需的所有工具。\n\n在上一章中我们将作业转换为 Moodle，所以让我们在此基础上，通过了解论坛如何支持和鼓励学生在项目工作中取得好成绩。\n\
  \n### 论坛\n\n在第 6 章《管理学生作业》中，你与我一起为我的课程项目工作创建了一个新的隐藏主题。我认为将一个项目范例上传到 Moodle 并让学生讨论他们认为该作品的优点会很棒。这是我在课堂上已经做的事情，但在线进行意味着：\n\
  \n- 学生可以花时间研究示例作品并在没有坐在教室里的压力的情况下形成答案。在课堂上害羞的学生在网上并不总是感受到同样的社交压力。\n- 论坛帖子可以保留你想要的任意长时间（即使发布帖子的学生已经离开），因此学生回复始终可供参考。好的论点或想法会保留在网上供学生回溯参考。\n\
  - 我们可以同时在线进行多个讨论。在线时我们可以更轻松地涵盖更多主题。\n- 论坛帖子在发布后只有相对较短的时间内可以被编辑或删除（这与典型的在线论坛有所不同），这强化了参与\
  \ Moodle 论坛类似于在线对话的理念。\n\n过不了多久你会发现，当学生发布问题时，是其他学生在帮助他们。这确实是我自己的经验。\n\n### 在你的课程中添加论坛\n\
  \n让我们看看在 Moodle 课程中创建论坛有多容易。实际上 Moodle 支持四种不同类型的论坛，但我稍后会谈到这些。让我们在课程中添加一个论坛。要添加一个简单的论坛，我们只需要担心几个设置。\n\
  \n我做的第一件事是上传范例，按照第 3 章《添加文档和讲义》中“Time for action – uploading a file”部分中的说明进行。然后我使用主题摘要（第\
  \ 2 章《设置你的课程》中“Time for action – defining each week / topic”部分）和标签（第 5 章《Moodle\
  \ Makeover》中“Time for action – inserting a label”部分）提供了简要介绍。所以，这是我的起点：\n\n### Backyard\
  \ Ballistics - 课程结束项目\n\n进入 21 世纪，我们需要比以往任何时候都更仔细地思考能源来源以及我们如何使用能源。现在你已经了解了所有关于能量及其如何被利用的知识，在本主题中我们将进行两个主要的能源相关项目——制作一个能源来源海报并向全年级做一次关于能量如何转移的演讲。\n\
  \n为了给你一些关于你的海报可能是什么样子的想法，点击下面的链接打开去年获奖能源海报的图片...\n\n- [2010 Energy Poster Winner]\n\
  - [Energy Sources Poster Project]\n- [Making objects fly - an energy conversion\
  \ presentation]\n\n点击下面的链接了解更多关于你被布置任务的信息：\n\n现在，为了让学生讨论去年的海报获奖者，让我们添加一个论坛。\n\n\
  ### Time for action – 添加一个论坛\n\n1. 在你想要添加论坛的主题中，点击 **Add an activity...** 列表（如果看不到此选项，请检查是否已打开编辑）。从列表中选择\
  \ **Forum**：\n\n![](img/1529021fde33ef551603bbc71587313e_229_0.png)\n\n2. 将论坛类型保留为\
  \ Standard forum for general use。有关不同类型论坛的更多信息将在本章后面介绍。\n\n3. 为你的新论坛命名并提供简要介绍：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_230_0.png)\n\n4. 滚动到页面底部并按下 Save and\
  \ display 按钮。就这样，我们完成了：\n\n![](img/1529021fde33ef551603bbc71587313e_230_1.png)\n\
  \n3. 选项相当自解释，但要强制每个人每次有人发帖时都收到电子邮件，请选择 **Forced subscription**。如果你想允许学生取消订阅（他们可能会抱怨收到太多电子邮件），则选择\
  \ **Auto subscription**。从列表中选择你的订阅选项，滚动页面并按下 **Save and return to course** 按钮。\n\
  \n4. 就这样。你完成了！\n\n### 刚刚发生了什么？\n\n我们刚刚配置了论坛，以便学生每次开始新的讨论线程时都会收到电子邮件。我强制订阅，这样我的学生就没有任何借口错过论坛中正在进行的讨论。在课程开始时，你可以强制用户订阅新闻论坛。如果临近考试时间，你可以强制用户订阅专门的“Exams\
  \ FAQ”论坛（请注意，这只有在你的学生已在 Moodle 中启用活动电子邮件地址时才有效）。\n\n在进入下一部分之前，我快速说明一下术语问题。将学生“订阅”到论坛并不意味着你让每个人加入论坛，他们通过在你的课程中就已经是论坛成员。将用户订阅到论坛意味着他们每次有新活动时都会收到电子邮件。\n\
  \n我们的下一个任务是鼓励学生开始发帖，而如果我们要鼓励和管理辩论，我们就需要承担版主或主席的角色，即 Moodle 用语中的“forum moderator”。在下一部分我们来看看这涉及什么。\n\
  \n### 版主论坛\n\n论坛版主需要：\n\n- 开始讨论\n- 确保讨论保持聚焦\n- 确保讨论易于跟进\n\n让我们现在逐一查看这些方面。\n\n###\
  \ 开始讨论\n\n开始对话最简单的方法是提问。我将在我的论坛中发布初始帖子，询问学生对我上传的示例海报中使用的颜色发表评论：\n\n\n\n# 行动时间 –\
  \ 开始一个讨论\n\n+   1. 按下 **Add a new discussion topic** 按钮：\n\n![](img/1529021fde33ef551603bbc71587313e_233_0.png)\n\
  \n+   2. 你现在会被带到 **Add a new discussion topic** 页面。你的新论坛帖子需要一个主题行，并且有一个框供你创建你的信息。这是我的：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_233_1.png)\n\n**3.** 在页面的底部你会看到有一个选项可以为你的帖子添加附件。这非常有用：学生可以扫描他们卡住的工作并将扫描的图像附加到帖子上。在我们尝试论坛帖子时，你可以尝试附加一个文件（任何东西都可以，Moodle\
  \ 不挑剔）。记住，你不会破坏任何东西。\n\n**4.** 一旦你对即将发布的内容感到满意，请按下 **Post to forum** 按钮。在确认信息之后（提醒你只有很短的时间可以改变你刚刚写的内容的主意），你会被带回论坛，你的新帖子会被列出：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_234_0.png)\n\n## 发生了什么？\n\n在课堂上开始对话通常很困难，有时当你转为在线教学时你会有同样的问题。可以肯定的是，一个开始为空的论坛会保持为空，所以我总是用一个问题（或有时是一个有争议的陈述！）来引球滚动，我知道这会让我的学生做出回应。\n\
  \n一旦你开始了讨论，你经常会发现会有最初的帖子热潮，然后迅速消退，因为每个人都决定他们已经说了他们要说的一切。如果学生可以看到距离上一次帖子已经有一段时间了，那么他们就不太愿意自己发帖。此外，随着论坛的增长，讨论有时会偏离主题。让我们看看一些保持讨论集中的技巧。\n\
  \n## 保持讨论集中 – 管理讨论\n\n管理论坛所需的努力比你最初想象的要少得多。以下是一些提示和技巧，帮助你应对可能遇到的一些问题：\n\n- 如果学生认为没有人会回应他们，发帖的频率可能会下降。最好说明你多久访问一次论坛以及你打算何时回答帖子，特别是如果你添加了一个论坛来支持在周末或假期进行的工作。\n\
  - 对帖子做出积极的反馈。感谢你的学生发帖，这会鼓励他们再发帖。\n\n当谈到管理时，你需要决定要行使多少管理权。作为教师，你可以编辑甚至删除帖子，但过多的管理可能会扼杀辩论并疏远熟悉论坛的学生。太少可能会让某些学生主导并疏远那些不熟悉论坛的学生。总是可以选择设置发帖阈值来限制你更热情的学生。也许你希望学生对论坛承担一定的责任，就像你希望他们对自己的工作承担责任一样。在这种情况下，过多的管理可能会被视为干涉。\n\
  \n## 应对粗鲁和不守规矩的行为\n\n这很少是个问题，但有些学生在论坛上会说出他们在现实中永远不会说的话。如果你担心你的论坛可能会失控，那么在开始之前制定一套规则。让学生在你的课程中清楚地了解行为准则。使用评分量表，这些可以规范学生的行为，特别是如果他们的最终成绩取决于从教师或其他学生那里获得良好的评分。\n\
  \n> 如果你决定宁愿在消息发布前检查其适用性，那么请查看 Moodle.org 并搜索 \"approve forum post\" 或类似内容。有各种解决方案可用，尽管你需要与你的\
  \ Moodle 管理员讨论实施问题。\n\n一种开箱即用的解决方案是给帖子评分。如果它完全不合适，那么显然你需要完全删除它。\n\n## 在线沟通\n\n##\
  \ 行动时间 – 评分论坛帖子\n\n+   1. 我们需要重新配置我们的论坛以允许我们评分帖子。如果你已返回到课程首页，请点击新论坛旁边的更新图标：\n\n\
  ![](img/1529021fde33ef551603bbc71587313e_236_0.png)\n\n+   2. 如果你没有离开你的论坛主页面，则在\
  \ **Settings** 块中，点击 **Forum administration** 下的 **Edit settings**：\n\n![](img/1529021fde33ef551603bbc71587313e_236_1.png)\n\
  \n+   3. 在 **Editing forum** 页面上，滚动到 **Grade** 框。从聚合类型列表中选择你希望如何对帖子进行评分。对帖子给出的成绩用于为学生提供论坛活动的总体成绩。选项应该是自解释的。\n\
  \n+   4. 选择你想要使用的评分量表。你可以使用自定义评分方法（如果需要的话，参见 *第 6 章，管理学生作业* 中的 *行动时间 – 创建自定义评分量表*\
  \ 部分）。我将允许 10 分制的评分。\n\n5. 最后，如果你想让学生专注于特定帖子，你可以限制评分的日期范围。你会在 Grade 框的底部找到这些设置。\n\
  \n6. 就这样。我们完成了！现在，根据你限制评分的日期范围，你会得到对帖子进行评分的选项：\n\n![](img/1529021fde33ef551603bbc71587313e_237_0.png)\n\
  \n## 发生了什么？\n\n将我们的课程转换为 Moodle 的好处是，你可以比在教室或讲堂中更轻松地对学生对讨论的投入进行评分。知道他们的帖子很可能会被评分可以防止讨论失控。但如果讨论偏离到另一个主题，但新主题仍然是需要讨论的主题怎么办？我们将在下一节中讨论这个问题。\n\
  \n## 确保讨论易于跟进\n\n我已经推广论坛作为讨论主题的绝佳方式，因为有了论坛，很容易回顾讨论以找到论证充分的观点或论证充分的案例。但这只有在讨论线程保持有序时才有效。这是论坛中经常发生的事情。例如，我的海报论坛中的一个讨论从关于颜色变成了核能：\n\
  \n![](img/1529021fde33ef551603bbc71587313e_238_0.png)\n\n## 行动时间 — 分割一个讨论\n\n1.\
  \ 选择你想要分割讨论的主题并点击 **Split**：\n\n![](img/1529021fde33ef551603bbc71587313e_238_1.png)\n\
  \n2. 为讨论线程选择一个新名称；我将我的命名为 \"Nuclear power: Is the poster balanced?\"。选择新标题后按下 Split\
  \ 按钮。\n\n3. 你现在创建了一个新的讨论线程，并且两个讨论现在都更容易跟进：\n\n![](img/1529021fde33ef551603bbc71587313e_239_0.png)\n\
  \n## 发生了什么？\n\n在 Moodle 中管理论坛就是让讨论易于跟进，并且以后易于参考。但我们刚刚看到管理讨论非常容易。这是将你的课程搬到线上的优势之一。\n\
  \n现在我们已经基本了解了 Moodle 的标准论坛用于一般用途的所有知识。但那种论坛并不适合你可能想要在线进行的每种讨论或辩论。但这不是问题，因为 Moodle\
  \ 提供了四种不同的论坛类型。\n\n## 论坛类型\n\n到目前为止，我们一直在使用标准论坛用于一般用途，大多数时候这将满足你的需求。但还有另外四种类型可供选择：\n\
  \n- 一个简单的单一讨论，只允许一个讨论线程。如果你想让讨论简短而切中要害，那么这就是你应该选择的论坛类型。\n- 每人发布一个讨论，每个学生只允许开始一个讨论，但可以在任何其他讨论中自由回复。它用于学生只允许发表单一陈述或评论的情况，例如在线辩论。\n\
  \n\n\n\n\n- 标准论坛以博客式格式显示，将讨论线程显示为你在博客底部看到的评论，或可能更熟悉你的学生，就像在 Facebook 墙上一样。\n- 问答论坛，学生自己发帖之前无法看到其他帖子。常用于你不希望学生互相抄袭作业（语言教学）或思想观点的情况。它也可以用于在线版的“传阅”教学练习，我提出一个问题，由第一个学生回答。然后他们提出一个问题，由下一个学生回答。如此往复。\n\
  \n当我们在本章的开头首次向课程添加论坛时（*Time for action – Adding a forum to your course section*），我建议将\
  \ **Forum type** 设置保持为 **Standard forum for general use**。正是这个设置（在论坛配置页面上）允许你指定论坛类型。\n\
  \n正如你所见，转换为 Moodle 为讨论打开了新的可能性，并且请记住 Moodle 很容易让你将讨论延续到课堂之外。\n\n关于你可以用论坛以不同方式支持教学，有什么想法呢？让我们在下一节中看一些论坛技巧和窍门。\n\
  \n## Forum tips and tricks\n\n论坛是管理讨论和辩论的好方法。以下是你可以在教学中使用 Moodle 论坛的几个想法：\n\n- 你有需要在周末或假期期间完成的项目作业吗？使用论坛在课堂或讲堂之外支持你的学生。\n\
  - 如果你的学生作为一个群体在一起相处的时间很少，那么创建一个社交论坛，让你的学生在线上更好地互相了解。\n- 请记住，有很多不同的课程格式可供选择。如果你选择\
  \ Social 格式，那么你的课程就只是一个大论坛。有关指定课程格式的更多信息，请参阅第 2 章 *Setting up your Courses* 中的 *Time\
  \ for action – setting up the course format section*。\n- 如果你教授外语，并且不希望学生复制彼此的帖子，那么试试使用\
  \ Q and A 论坛；他们在自己发帖之前无法看到其他帖子。\n- 对于简短、有针对性的小组作业，创建一个论坛并在交互式白板上显示帖子。利用这些帖子在课堂或讲堂中支持口头讨论。\n\
  \n为了让讨论线程更容易跟随，你可以使用显示回复下拉菜单更改它们在屏幕上的显示方式。请注意，这是一个个人设置，而不是可以为他人更改的东西：\n\n![](img/1529021fde33ef551603bbc71587313e_241_0.png)\n\
  \n- 创建一个常见问题论坛来支持大型项目作业。保存此论坛供以后年份使用。你将更容易看到学生遇到困难的领域。\n- 小组工作的学生可以拥有自己的讨论论坛，以便他们可以一起沟通和协作（本书后面会详细介绍如何设置学生小组）。\n\
  - 通过在编辑论坛页面上使用 Post threshold for blocking 设置，防止过于热心的学生发布太多帖子。\n- 请记住，论坛帖子都有时间戳和日期戳。如果他们看到你在凌晨\
  \ 4.00 发帖到论坛，学生就会知道你的睡眠习惯。同样，如果他们也这样做，你就会知道你的学生的学习习惯！\n\n### Have a go hero – creating\
  \ a school leavers book\n\n为即将毕业的学生创建一个论坛，让他们发布告别留言和照片。这些论坛总是非常受欢迎。有些学校甚至会复制留言和照片并打印出来，让学生在离开时带走。\n\
  \n## The News forum is not really a forum\n\n每个课程都有一个 News 论坛，但这个名字具有误导性。News 论坛实际上是教师的公告板，是你发布最新课程新闻的地方。重要的是，只有教师可以发帖，所以不要期望学生在那里回应你。你发布到\
  \ News 论坛的任何帖子都会出现在 Latest News 块中，因此你可以使用 News 论坛来宣布课程变更、项目截止日期、考试日期。\n\n论坛是支持讨论和辩论的绝佳工具。然而，有时你需要为学生提供实时聊天环境。在下一节中我们将介绍\
  \ Moodle 聊天。\n\n## Online chat rooms\n\n如果你需要支持不在课堂上的学习者，那么聊天室是理想的方式：\n\n- 创建一个考试复习聊天室，在考试前夜或早晨花一个小时与你的学生一起。\n\
  - 支持生病的学习者。如果他们可以访问电脑，他们仍然可以参与课堂讨论。\n- 通过聊天会话支持周末或假期期间的项目工作。这将减少你周一早上返回工作时需要补做的作业量。\n\
  - 如果你和你的学生发现安排一个大家可以面对面在一起的时间和地点很困难，可以举行在线辅导课程。\n- 邀请嘉宾演讲者进入你的聊天室。通过邀请他们在线加入你的班级，你可以大幅削减你的费用账单！\n\
  - Moodle 聊天室是安全的，只有注册你的课程的人才能进入。\n\n并且在 Moodle 中使用聊天室意味着用户不必学习如何使用又一个“聊天客户端”，它们被称为这样。\n\
  \n但聊天室也有其缺点：\n\n- 因为在线聊天缺乏手势和语言线索，很容易产生误解。使用表情符号（或笑脸）可以帮助防止这个问题。\n- 聊天室总是开放的，24/7。可能在你不知情的情况下发生不当行为。\n\
  \n年轻学习者可能非常习惯聊天，并且经常会开始“sup? who u lovin?”之类的无聊对话。聊天会话会被记录下来，如果必要的话可以显示在交互式白板上供全班查看。与论坛一样，最好在让暴民进入之前先设定好行为规则。\n\
  \n聊天室的另一个特点是隐藏聊天室会使其关闭。\n\n当我们了解更多关于 Moodle 聊天时，我们将研究所有这些问题。让我们从学习如何向你的课程添加聊天室的下一节开始。\n\
  \n## Adding a chat room to your course\n\n向你的课程添加聊天室很容易。你需要做的只是选择你想要添加聊天室的话题，点击\
  \ Add an activity... 并选择 Chat。\n\n我想加入一个聊天室，让学生讨论他们必须做的演示。这对他们来说都是一个相当令人担忧的事情，当他们一起工作来克服可能遇到的任何困难时是很好的。与其使用论坛，学生说过论坛在等待回复发布时似乎相当孤立，我将使用\
  \ Moodle 聊天。\n\n### Time for action – adding a Moodle chat\n\n1. 决定你想要包含聊天室的话题。开启编辑后点击\
  \ Add an activity 并选择 Chat。\n\n2. 为聊天室命名并提供一段简短的介绍文字：\n\n![](img/1529021fde33ef551603bbc71587313e_243_0.png)\n\
  \n3. 目前默认设置就足够了。只需滚动到页面底部并按下 Save and display 按钮：\n\n![](img/1529021fde33ef551603bbc71587313e_244_0.png)\n\
  \n### What just happened?\n\n我们刚刚向课程添加了一个聊天室！非常容易，只需几次点击就完成了。要进入聊天室，只需点击 Click here\
  \ to enter the chat now 链接。邀请一名学生或同事加入你。你可以在屏幕右侧看到是否还有其他人与你同在聊天室：\n\n![](img/1529021fde33ef551603bbc71587313e_244_1.png)\n\
