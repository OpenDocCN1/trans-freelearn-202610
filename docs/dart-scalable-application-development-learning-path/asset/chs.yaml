  \ 中使用其第二个可选的 `test` 参数来测试何时发生特定异常，在其中测试异常的类型。这在变体 3 中展示；请务必将对一般异常的测试作为最后一条子句。如果可能发生多种不同的异常并且我们希望对每种异常进行特定处理，此场景肯定会很有用。\n\
