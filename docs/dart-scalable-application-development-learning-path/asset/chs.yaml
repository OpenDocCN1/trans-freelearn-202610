  \ ComplexNumber(this.real - x.real, this.imag - x.imag);\n        } else if (x is\
  \ num) {\n            _real -= x;\n            return this;\n        }\n       \
  \ throw 'Not a number';\n    }\n\n    ComplexNumber operator *(var x) {\n      \
  \  if (x is ComplexNumber) {\n            num realAux = (this.real * x.real - this.imag\
  \ * x.imag);\n            num imagAux = (this.imag * x.real + this.real * x.imag);\n\
  \n            return new ComplexNumber(realAux, imagAux);\n        } else if (x\
  \ is num) {\n            return new ComplexNumber(this.real * x, this.imag * x);\n\
  \        }\n        throw 'Not a number';\n    }\n\n    ComplexNumber operator /(var\
  \ x) {\n        if (x is ComplexNumber) {\n            num realAux = (this.real\
  \ * x.real + this.imag * x.imag) / (x.real *\n            x.real + x.imag * x.imag);\n\
  \            num imagAux = (this.imag * x.real - this.real * x.imag) / (x.real +\n\
  \            x.real + x.imag * x.imag);\n            return new ComplexNumber(realAux,\
  \ imagAux);\n        } else if (x is num) {\n            return new ComplexNumber(this.real\
  \ / x, this.imag / x);\n        }\n        throw 'Not a number';\n    }\n\n// 4-\
  \ Here we define the same operations as methods:\n    static ComplexNumber add(ComplexNumber\
  \ c1, ComplexNumber c2)    {\n```\n\n```\nnum rr = c1.real + c2.real;\n    num ii\
  \ = c1.imag + c2.imag;\n    return new ComplexNumber(rr, ii);\n}\n\nstatic ComplexNumber\
  \ subtract(ComplexNumber c1, ComplexNumber c2)\n{\n    num rr = c1.real - c2.real;\n\
  \    num ii = c1.imag - c2.imag;\n    return new ComplexNumber(rr, ii);\n}\n\nstatic\
  \ ComplexNumber multiply(ComplexNumber c1, ComplexNumber c2)\n{\n    num rr = c1.real\
  \ * c2.real - c1.imag * c2.imag;\n    num ii = c1.real * c2.imag + c1.imag * c2.real;\n\
  \    return new ComplexNumber(rr, ii);\n}\n\nstatic ComplexNumber divide(ComplexNumber\
  \ c1, ComplexNumber c2)\n{\nnum real = (c1.real * c2.real + c1.imag * c2.imag) /\
  \ (c2.real *\nc2.real + c2.imag * c2.imag);\nnum imag = (c1.imag * c2.real - c1.real\
  \ * c2.imag) /  (c2.real *\nc2.real + c2.imag * c2.imag);\n    return new ComplexNumber(real,\
  \ imag);\n}\n}\n```\n\n## 它是如何工作的...\n\n`ComplexNumber` 类是使用标准 Dart 功能构建的：\n\n-\
  \ 私有 getter 用于实部和虚部以返回其值，以及用于更改它们的 setter\n- 具有两个可选参数的构造函数和两个命名构造函数，分别用于没有实部或虚部的复数\n\
  - 一些实用方法，例如 `toString()` 和 `==` 的重载\n- 对 +, -, *, / 的运算符重载\n- 作为静态方法实现的相同运算，接受两个复数\n\
  \n\n\n\n\n# 处理数据类型\n\n## 还有更多...\n\n请关注 Frederik Leonhardt 的 pub 包 `math-expressions`，因为使用复数求值表达式是其目标之一。\n\
  \n## 创建枚举\n\nDart 中没有内置类型的枚举。枚举提供额外的类型检查，从而有助于增强代码可维护性。那么我们有什么替代方案呢？请查看项目 enum 中的代码，我们希望区分向我们报告的问题的严重程度（我们区分以下级别：TRIVIAL、REGULAR、IMPORTANT\
  \ 和 CRITICAL）。\n\n### 如何做...\n\n实现创建枚举功能的第一种方式显示在 `enum1.dart` 中：\n\n```\nclass\
  \ IssueDegree {\n  final _value;\n  const IssueDegree(this._value);\n  toString()\
  \ => 'Enum: $_value';\n\n  static const TRIVIAL = const IssueDegree('TRIVIAL');\n\
  \  static const REGULAR = const IssueDegree('REGULAR');\n  static const IMPORTANT\
  \ = const IssueDegree('IMPORTANT');\n  static const CRITICAL = const IssueDegree('CRITICAL');\n\
  }\n\nvoid main() {\n  var issueLevel = IssueDegree.IMPORTANT;\n  // Warning and\
  \ NoSuchMethodError for IssueLevel2:\n  // There is no such getter ALARM in IssueDegree\n\
  \  // var issueLevel2 = IssueDegree.ALARM;\n\n  switch (issueLevel) {\n    case\
  \ IssueDegree.TRIVIAL:\n      print(\"Ok, I'll sort it out during lunch\");\n  \
  \    break;\n    case IssueDegree.REGULAR:\n      print(\"We'll assign it to Ellen,\
  \ our programmer\");\n      break;\n    case IssueDegree.IMPORTANT:\n```\n\n## 还有更多...\n\
  \nEcma TC52 Dart 标准委员会已调查了将在 2014 年 9 月讨论的枚举提案（请参阅 http://www.infoq.com/news/2014/07/ecma-dart-google），因此为枚举提供内置支持可能将在未来的\
  \ Dart 版本中实现。\n\n## 展平列表\n\n列表可以包含其他列表作为元素。这有效地是一个二维列表或数组。展平意味着创建一个包含所有子列表项的单个列表。请查看\
  \ flatten_list.dart 中的不同可能性。\n\n### 如何做...\n\n我们在以下代码中展示了三种展平列表的方法：\n\n```\nList\
  \ lst = [[1.5, 3.14, 45.3], ['m', 'pi', '7'], [true, false, true]];\n// flattening\
  \ lst must give the following resulting List flat:\n// [1.5, 3.14, 45.3, m, pi,\
  \ 7, true, false, true]\n\nvoid main() {\n  // 1- using forEach and addAll:\n  var\
  \ flat = [];\n  lst.forEach((e) => flat.addAll(e));\n  print(flat);\n  // 2- using\
  \ Iterable.expand:\n  flat = lst.expand((i) => i).toList();\n  // 3- more nesting\
  \ levels, work recursively:\n  lst = [[1.5, 3.14, 45.3], ['m', 'pi', '7'], \"Dart\"\
  , [true, false, true]];\n  print(flatten(lst));\n}\n```\n\n### 它是如何工作的...\n\n最简单的方法使用\
  \ forEach 和 addAll 的组合。第二种方法利用了 List 实现 Iterable，因此具有 expand 方法。这里 expand 方法使用其参数作为恒等函数；每个元素都按原样返回，而不应用函数。\n\
  \n如果列表包含作为单个列表元素的 int（或 String、double 等），或存在多级嵌套，则使用 expand 不起作用。在这种情况下，我们必须递归工作，如\
  \ flatten 方法中实现的：\n\n```\nIterable flatten(Iterable iterable)\n  => iterable.expand((e)\
  \ => e is List ? flatten(e) : [e]);\n```\n\n## 还有更多...\n\n为什么要展平列表的列表？可能有应用需求要这样做，例如，当你在游戏逻辑中使用二维列表或矩阵时，但一个明显的原因是，与列表的列表相比，使用列表的列表在性能上要昂贵得多。\n\
  \n## 在范围内生成随机数\n\n你可能经常想知道如何从某个范围内生成随机数。这正是我们在本配方中要看的内容；我们将获得一个位于最小值 min 和最大值 max\
  \ 之间的区间内的随机数。\n\n### 如何做...\n\n这很简单；请查看 random_range.dart 中的实现方式：\n\n```\nimport\
  \ 'dart:math';\n\nvar now = new DateTime.now();\nRandom rnd = new Random();\nRandom\
  \ rnd2 = new Random(now.millisecondsSinceEpoch);\n\nvoid main() {\n  int min = 13,\
  \ max = 42;\n  int r = min + rnd.nextInt(max - min);\n  print(\"$r is in the range\
  \ of $min and $max\"); // e.g. 31\n  // used as a function nextInter:\n  print(\"\
  ${nextInter(min, max)}\"); // for example: 17\n\n  int r2 = min + rnd2.nextInt(max\
  \ - min);\n  print(\"$r2 is in the range of $min and $max\"); // e.g. 33\n}\n```\n\
  \n## 另请参阅\n\n- 咨询前一个配方以获取有关 Random 用法的更多信息\n\n## 处理日期和时间\n\n几乎在每个数据上下文中都需要适当的日期时间处理。Dart\
  \ 为我们提供了哪些便利来处理日期和时间？Dart 在 dart:core 中具有出色的内置类 DateTime 和 Duration。作为其众多用途中的几个，你可以执行以下操作：\n\
  \n- 比较和计算日期时间\n- 获取日期时间的每个部分\n- 使用不同的时区\n- 使用 Stopwatch 测量时间段\n\n然而，DateTime 类不提供国际化；为此目的，你需要使用\
  \ Dart 团队的 intl 包。\n\n### 如何做...\n\n以下是一些有用的技术（在 date_time.dart 中尝试它们）：\n\n- 将日期格式化（从\
  \ DateTime 到字符串）为标准格式，但也可以使用 intl 包格式化为任何格式，如以下代码所示：\n\n```\nimport 'package:intl/intl.dart';\n\
  import 'package:intl/date_symbol_data_local.dart';\n\n    print(now.toIso8601String());\
  \ // 2014-05-08T14:03:21.238\n    print(now.toLocal());           // 2014-05-08\
  \ 14:03:21.238\n    print(now.toString());          // 2014-05-08 14:03:21.238\n\
  \    print(now.toUtc());             // 2014-05-08 12:03:21.238Z\n    // using intl\
  \ to format:\n    var formatter = new DateFormat('yyyy-MM-dd');\n    String formatted\
  \ = formatter.format(now);\n    print(formatted); // 2014-05-08\n    print(new DateFormat(\"\
  EEEEEE\").format(now)); // Thursday\n    print(new DateFormat(\"yMMMMEEEEd\").format(now));\
  \ // Thursday, May 8, 2014\n    print(new DateFormat(\"y-MM-E-d\").format(now));\
  \ // 2014-05-Thu-8\n    print(new DateFormat(\"jms\").format(now)); // 2:19:08 PM\n\
  ```\n\n```\nprint(new DateFormat('dd/MMM/y HH:mm:ss').format(now));   // 08/May/2014\
  \ 14:39:07\n// locale data:\ninitializeDateFormatting(\"fr_FR\", null).then(formatDates);\n\
  // ...\n}\n```\n\n```\nformatDates (var d) {\n    print(new DateFormat(\"EEEE\"\
  , 'fr_FR').format(now));   // jeudi\n    print(new DateFormat(\"yMMMEEEEd\", 'fr_FR').format(now));\
  \ // jeudi 8 mai 2014\n    print(new DateFormat(\"y-MM-E-d\", 'fr_FR').format(now));\
  \   // 2014-05-jeu.-8\n}\n```\n\n解析日期（从字符串到 DateTime），当给定的字符串不在可接受的日期格式之一时；抛出异常并在以下代码中捕获：\n\
  \n```\ntry {\n    DateTime dt = DateTime.parse(\"2014-05-08T15+02:00\");\n} on FormatException\
  \ catch(e) {\n    print('FormatException: $e');\n}\n```\n\n使用时区信息工作：\n\n```\nprint(now.toLocal());//\
  \ time in local timezone\nprint(now.toUtc()); // time in Coordinated Universal Time\n\
  print(now.timeZoneName);   // Romance (zomertijd)\nprint(now.timeZoneOffset); //\
  \ 2:00:00.000000\n```\n\n可以按如下方式找到月份的最后一天：\n\n```\nvar date = new DateTime(2014,6,0);\n\
  print(date.day); // 31\n// more general:\nvar lastDayDateTime = (now.month < 12)\
  \ ? new DateTime(now.year, now.month + 1, 0) : new DateTime(now.year + 1, 1, 0);\n\
  print(lastDayDateTime.day); // 31\n```\n\n## 处理数据类型\n\n### 它是如何工作的...\n\n格式化 `DateTime`\
  \ 实例可以使用来自 `dart:core` 的几个 to... 方法来完成，例如 `toLocal()` 来获取本地时区（由你的机器定义）中的时间。然而，`intl`\
  \ 为你提供了更大的灵活性；使用特定的格式字符串作为参数创建一个 `DateFormat` 对象，然后调用 `format` 方法以获取格式化的字符串。\n\n\
  例如，`d` 给出天数，`E` 给出缩写的星期几，`EE` 给出完整的星期几名称，`M` 给出月份数字，`y` 给出年份，`H` 给出小时（0-24），`j`\
  \ 给出小时（0-12）带 AM 或 PM，`m` 给出分钟，等等。许多格式组合是可能的（你也可以构建自己的）。\n\n> 要获得格式组合的完整概述，请参阅\n\
  > https://api.dartlang.org/apidocs/channels/stable/dartdoc-viewer/intl/intl.DateFormat。\n\
  \n如果你想要特定语言环境的格式化（例如 `be_NL`、`cs_CZ`、`de_DE` 等），你必须先通过导入 `date_symbol_data_local.dart`\
  \ 然后调用 `initializeDateFormatting` 来加载特定语言环境数据。第一个参数是特定语言环境。如果你将其值设为 `null`，将加载所有可用的语言环境数据，如以下代码所示：\n\
  \n```\ninitializeDateFormatting(\"fr_FR\", null).then(formatDates);\n```\n\n接下来，在构造\
  \ `DateFormat` 对象时，语言环境（例如 `'fr_FR'`）必须作为第二个参数给出：\n\n```\nnew DateFormat(\"yMMMMEEEEd\"\
  , 'fr_FR')\n```\n\n`formatDates` 方法展示了以下代码的运行情况：\n\n```\nformatDates (var d) {\n\
  \    print(new DateFormat(\"EEEEE\", 'fr_FR').format(now)); // jeudi\n    print(new\
  \ DateFormat(\"yMMMMEEEEd\", 'fr_FR').format(now)); // jeudi 8 mai 2014\n    print(new\
  \ DateFormat(\"y-MM-E-d\", 'fr_FR').format(now)); // 2014-05-jeu.-8\n}\n```\n\n\
  将格式良好的字符串解析为 `DateTime` 字符串是通过静态 `DateTime.parse` 方法完成的，该方法接受字符串并生成 `DateTime`。输入格式必须符合\
  \ ISO 8601 格式。如果输入格式无法解析，将抛出 `FormatException`，因此使用 try/catch 来处理此问题。\n\n\n\n\n\
  `toUTC` 选项为你提供**协调世界时（UTC）**格式的时间，这在所有实际用途上都与**格林尼治标准时间（GMT）**相同。使用 `timeZoneName`\
  \ 获取 `DateTime` 对象的时区缩写名称。UTC 与 `DateTime` 对象时区之间的差异通过调用 `timeZoneOffset` 计算。\n\n\
  要查找一个月的最后一天，为下一个月传入日期值 0，将返回上个月的最后一天。\n\n## 更多内容...\n\n请注意，`DateTime` 对象始终处于本地时区，除非使用\
  \ `DateTime.utc` 构造函数显式地在 UTC 时区创建；可以如下操作：\n\n```\nDateTime moonLanding = new DateTime.utc(1969,\
  \ DateTime.JULY, 20);\n```\n\n在此构造函数中，只有年份是必需的，所有其他日期和时间部分都是可选的。\n\n如果你有其他 `Datetime`\
  \ 问题，请查阅 API 文档：`https://api.dartlang.org/apidocs/channels/stable/dartdoc-viewer/dart-core.DateTime`。\n\
  \n## 提高数值计算的性能\n\n与 Java 和 C# 不同，它们拥有专门的 8、16、32 和 64 位有符号和无符号整数类型，以及 32 位和 64 位浮点数，而\
  \ Dart 没有有界整数类型或 32 位浮点数类型；它只有两种数值类型：`int`（任意大小的整数）和 `double`（符合 IEEE-754 规范），以及它们的超类型\
  \ `num`。这样做是为了让语言更具动态性，更容易学习和使用。然而，Dart VM 在推断整数范围方面做得很好，并尽可能进行优化。在这里，我们提供一些讨论和技巧，让你的代码在涉及数值计算时获得尽可能高的性能。\n\
  \n## 如何做到...\n\nVM 内部使用三种整数类型，并在数字大小增大或缩小时在后台自动切换。它们如下：\n\n- `smi`（小整数）：你可以认为这种整数类型在\
  \ 32 位机器上是 32 位，在 64 位机器上是 64 位\n- `mint`（中整数）：这种整数类型始终是 64 位\n- `bigint`（大整数）：机器\
  \ RAM 是这种整数类型的限制\n\n## 处理数据类型\n\n你不能在 Dart 代码中使用这些类；VM 会自动将整数从 smi 提升为 mint，并在必要时提升为\
  \ bigint。然而，如果你确保整数值保持在较小的范围内，可以获得更好的性能。例如，请参考 integer_promotion.dart 文件：\n\n```\n\
  import 'dart:math';\n\nvoid main() {\n  int points = 42; // starts as a smi\n  print(points);\
  \  // 42\n  points = pow(points, 10); // becomes a mint\n  print(points); // 17080198121677824\n\
  \  points = pow(points, 3); // becomes a bigint\n  print(points);  // 49828603059827911309997192674768286219621357322\n\
  }\n```\n\n> 除非确实有必要，否则不要使用 bigint 范围，因为这会导致性能下降。如果可能，请保持在 smi 范围内；如果不行，则使用 mint\
  \ 范围。\n\n对于数字列表，数字可以存储在对象 List() 中，或者存储在泛型类型 List<int> 或 List<double> 中。虽然后者比前者好，但最好使用\
  \ Dart 类型化列表，它可以在 dart:typed_data 包中获得，例如 Uint8List、Int64List 或 Float32List。因此，不要使用总是较慢的\
  \ List<double>，而应使用 Float32List 或 Float64List。在使用 Web 应用时要小心；并非所有浏览器都支持 typed_data。例如，Internet\
  \ Explorer 10 支持它，但版本 9 不支持。\n\n> 计算时使用类型化列表；计算将运行得更高效。\n\n考虑到这些因素，建议对你的应用进行基准测试，使用不同数量的类型用法（例如，比较\
  \ Float32List 与 Float64List，甚至与普通列表进行比较），以查看在你的应用的特定上下文中哪一个性能最佳。\n\n## 工作原理...\n\
  \n这些建议主要源于 Dart VM 优化处理不同数值类型的方式。由于 JavaScript 无法使用完全相同的优化，dart2js 有时会表现出不同的行为；请参阅下一节以获取针对这种情况的特别建议。\n\
  \n小型机器整数（smi）可以放入寄存器，并且可以直接加载和存储到字段中，而无需从内存中获取，因为它们永远不需要内存分配。这就是它们速度快的原因。然而，它们的范围取决于\
  \ CPU 架构，因此除非你需要更多位数，否则可以假定为 31 位范围。VM 无法优化 bigint 的运算。处理 double 非常高效，因为它们是未装箱的，即不需要放入堆中。\n\
  \nDart 类型化列表只能存储数字，不能存储 null 值。它们表现得像一个有界整数和浮点值数组，每个条目包含其值，VM 会优化它们的使用。类型化列表在大多数时候更加紧凑，提供更好的内存和\
  \ CPU 缓存使用；例如，如果你只需要 8 位精度，请使用 Int8List。当发生垃圾回收（GC）时，它们也处理得更快，因为它们从不存储对象引用，因此 GC\
  \ 不必扫描它们。\n\n## 更多内容...\n\n从语言设计的角度来看，使用 int 和 num 类型是最好的；Dart VM 专家可能希望我们只使用 double，因为那是大多数优化可以发挥作用的地方。\n\
  \n## 使用 JavaScript\n\n在 JavaScript 中，每个数字都以 double 表示（它只知道 IEEE-754 类型）。\n\n![](img/52c05b53a56abd53584e4fed738ed509_619_0.png)\n\
  \n> 如果你的应用将以编译后的 JavaScript 形式使用，最好只使用 num 类型。另外，使用 is num 而不是测试 is int 或 is double，因为\
  \ Dart VM 和 dart2js 在这里也有不同的行为。如果你坚持使用 int 类型，请保持在 smi 范围内。\n> 在任何情况下，都使用 Dart 类型化列表，因为它们可以简单地映射到\
  \ JavaScript 类型化数组。但是，请避免使用 Int64List 或 Uint64List，因为由于 Internet Explorer 9 不支持类型化数据，dart2js\
  \ 不支持 64 位整数（如果使用会导致运行时异常）。\n\n## 解析数字\n\n避免大量使用 double.parse(String s) 甚至 int.parse(String\
  \ s)，因为在撰写本文时，它们的性能尚未优化。\n\n## 另请参阅\n\n- 请参阅 http://dartogreniyorun.blogspot.be/2013/05/performance-optimization-and-dart.html，其中使用类型化数据可使性能提升两倍\n\
  - 你可能还想参阅第 2 章 *结构化、测试和部署应用* 中的 *对你的应用进行基准测试* 方法\n\n## 使用 SIMD 提升性能\n\n许多现代 CPU\
  \ 和 GPU 提供**单指令多数据（SIMD）**支持。借助 128 位特殊寄存器，可以并行处理四个 32 位数据值（整数或浮点数）。这为图像处理、3D 图形、音频处理和其他数值计算算法提供了潜在\
  \ 400% 的加速。此外，使用**高斯混合模型（GMM）**的机器学习算法（例如用于自动语音识别）也能从 SIMD 中受益。\n\n## 如何做到...\n\n\
  Dart 允许你使用 `typed_data` 库中的特殊 SIMD x 类型来处理这一特性。它提供以下四种类型：\n\n- `Int32x4`，表示四个 32\
  \ 位整数值\n- `Float32x4`，表示四个单精度浮点值\n- 用于包含 32 位整数值的列表结构，例如 `Int32x4List`\n- `Float32x4List`，用于包含\
  \ 32 位浮点值的列表结构\n\n让我们看看 simd.dart 中 SIMD 操作的一些示例；以下代码片段中突出显示了不同的类型：\n\n```\nimport\
  \ 'dart:typed_data';\n\nvoid main() {\n  var a = new Float32x4(14.1, 6.7, 56.3,\
  \ 78.41);\n  var b = new Float32x4(12.3, 5.4, 81.7, 13.43);\n  Float32x4 sum = new\
  \ Float32x4.zero(); //\n  print(sum); // [0.000000, 0.000000, 0.000000, 0.000000]\n\
  \  sum = a + b;\n  print(sum); // [26.400002, 12.100000, 138.000000, 91.840004]\n\
  \  print(sum.z); // 138.0\n  // b.y = 3.14;  // --> NoSuchMethodError\n  b = b.withY(3.14);\n\
  \  print(b); // [12.300000, 3.140000, 81.699997, 13.430000]\n  b = b.shuffle(Float32x4.WYXZ);\n\
  \  print(b); // [13.430000, 3.140000, 12.300000, 81.699997]\n  // a < b; // There\
  \ is no such operator in Float32x4\n  Int32x4 mask = a.greaterThan(b);  // Create\
  \ selection mask.\n  Float32x4 c = mask.select(a, b);   // Select.\n  print(c);\
  \ // [14.100000, 6.700000, 56.299999, 81.699997]\n  // selectively applying an operation:\n\
  \  Float32x4 v = new Float32x4(22.0, 33.0, 44.0, 55.0);\n  // mask = [0xFFFFFFFF,\
  \ 0xFFFFFFFF, 0xFFFFFFFF, 0x0]\n  mask = new Int32x4.bool(true, true, false, true);\n\
  \  // r = [4.0, 9.0, 16.0, 25.0].\n  Float32x4 r = v - v;\n  v = mask.select(r,\
  \ v);\n  print(v); // [0.000000, 0.000000, 44.000000, 0.000000]\n}\n```\n\n如果你的应用需要\
  \ Float32 对象列表，并且可以将它们部署到 SIMD 平台上，那么务必使用 Float32x4List 而不是 List<Float32x4> 以获得更好的性能。\n\
  \n\n\n\n### 工作原理...\n\n`Float32x4` 对象提供了一整套标准算术运算及更多功能。实际上，`Float32x4` 对象是一个不可变对象，其操作会创建新的不可变\
  \ `Float32x4` 对象。`Int32x4` 对象的功能较为有限，主要用于比较、分支和选择。在针对这些类型优化的代码中，值会被直接映射到 SIMD 寄存器，对它们的操作会编译成单条\
  \ SIMD 指令，零开销。你可以把 SIMD 值想象成一个被细分为四个通道的水平隔间，分别称为 **x**、**y**、**z** 和 **w**，如下图所示：\n\
  \n![](img/52c05b53a56abd53584e4fed738ed509_622_0.png)\n\n对两个 SIMD 值的操作会同时作用于所有通道。通过\
  \ `.x` 和其他值，你可以读取各个通道的值，但请注意，这样做速度较慢。由于 SIMD 值是不可变的，`b.y = value` 这样的语句是非法的。不过，`withX`\
  \ 方法可以让你做到这一点，但同样地，这也是慢速操作。对单个 SIMD 中的值进行重新排序是通过多个 `shuffle` 方法完成的，其中通道顺序（WXYZ）表示新顺序。一个\
  \ SIMD 实例包含四个数字，因此无法定义 `<` 或 `>=` 这类比较操作。如果你想将 `c` 设为 `a` 和 `b` 中较大的值，你必须先用 `greaterThan`\
  \ 操作创建一个掩码，然后对它执行 `select` 操作。如果你只想对部分通道执行操作，也会使用类似的掩码技术。\n\n目前，你可以在所有 IA32/X64\
  \ 平台上获得这种性能加速，而在 ARM 上，只有当处理器支持 NEON 技术时才能实现，并且它的 JavaScript 实现仍在推进中。得益于 John McCutchan\
  \ 的工作，Dart 成为第一个使用 SIMD 处理技术的 Web 技术。\n\n### 另请参阅\n\n- 有关 SIMD 的更多信息，请参阅 `http://en.wikipedia.org/wiki/SIMD`\n\
  - Dart 在使用 SIMD 时甚至能超越 Java VM；更多信息请参阅 `http://dartogreniyor.blogspot.be/2013/05/dart-beats-java-in-numerical-computing.html`\n"
- "## 4 面向对象\n\n在本章中，我们将介绍以下内容：\n\n- 测试和转换类型\n- 比较两个对象\n- 使用工厂构造函数\n- 构建单例\n- 使用反射\n\
  - 使用 mixins\n- 使用注解\n- 使用 call 方法\n- 使用 noSuchMethod\n- 在你的类中创建 toJSON 和 fromJSON\
  \ 方法\n- 为客户端和服务端应用创建公共类\n\n### 引言\n\nDart 虽然是可选类型，但它和 Ruby 一样是一种面向对象语言，因此一切都是对象。这与\
  \ JavaScript 形成对比，在 JavaScript 中，面向对象并非语言固有的特性，而是在后来以各种临时方式添加进来的。我们可以预期，使用真正的面向对象语言来构建客户端\
  \ Web 应用会带来巨大的好处。那么，让我们更深入地探究 Dart 的面向对象本质，并发现一些新的技巧和见解。\n\n- 要将 `double` 转换为 `int`，请使用\
  \ `toInt()`，但会发生小数部分的截断\n- 要将字符串转换为 `DateTime`，请使用带 `try / catch` 的 `DateTime.parse(str)`\n\
  - 当 `str` 不是可识别的日期和时间格式时，处理可能的 `FormatException`\n- 要将 `DateTime` 转换为字符串，请使用 `toLocal()`、`toUtc()`\
  \ 或 `DateFormat` 对象（请参阅 *第 3 章，使用数据类型* 中的 *处理日期和时间* 一节）\n- 要将 `bool` 转换为 `int`，请使用\
  \ `int toInt(bool val) => val ? 1 : 0;` 函数\n\n### 工作原理...\n\n要测试对象 p 是否属于某个类型，请使用\
  \ `is`（或其否定形式 `is!`）运算符。由于 Dart 中的类型是可选的，你只能查询对象的 `runtimeType`，其类型为 `Type`。`p is\
  \ Object` 的测试始终为真，而 `null is T`（其中 T 为某个类型）仅在 `T == null` 时才为真。\n\n`toString()`\
  \ 方法是 `Object` 的一个方法，默认返回 **Instance of Type**，其中 **Type** 是对象的类名。在你的类中重写此方法可以获得更具体的行为。在\
  \ Dart 中，`bool` 和 `int` 是两种不同的类型，但你可以通过在 `toInt(bool)` 中使用三元运算符来模拟类 C 的行为。\n\n>\
  \ 类型之间的转换并不总是安全的；如果发生 `FormatException`，请使用 `try/catch`。\n\n### 扩展...\n\n还有一个更简短的版本：`if\
  \ (p is Person) { p.name = 'Bob'; }` 测试可以缩写为 `(p as Person).firstName = 'Bob';`，这里使用了\
  \ `as` 运算符，将 `p` 强制转换为 `Person`。但是，只有在你确定 `p` 可能是该类型时，才能使用这种形式；当 `p` 为 null 或不是\
  \ `Person` 时，Dart 会抛出异常。\n\n### 另请参阅\n\n- 有关日期和时间转换，请参阅 *第 3 章，使用数据类型* 中的 *处理日期和时间*\
  \ 一节\n\n```dart\nString ssn; // 社会安全号码\nDateTime birthdate;\n\nPerson(this.name,\
  \ this.ssn, this.birthdate);\ntoString() => 'I am $name, born on $birthdate';\n\
  operator ==(Person other) => this.ssn == other.ssn;\nint get hashCode => birthdate.millisecondsSinceEpoch;\n\
  }\n```\n\n### 工作原理...\n\nObject 超类有一个定义对象相等性的 `==(other)` bool 方法。只有当 `this` 和 `other`\
  \ 是同一个对象时（即它们引用（堆）内存中的同一个对象），该方法才返回 true。除非你在自己的类中重写它，否则这是默认行为。`!=` 运算符是该方法的否定。另一种测试方式是\
  \ `dart:core` 中顶层的 `identical` 函数：`bool identical(Object a, Object b)`。\n\n每个对象都有一个由\
  \ getter `int get hashCode` 返回的整数哈希码。相等的两个对象具有相同的哈希码，但这在程序的两次运行之间可能有所不同。任何子类都可以有自己的版本来定义其对象之间的相等性。\n\
  \n![](img/52c05b53a56abd53584e4fed738ed509_629_0.png)\n\n### 扩展...\n\n如果你想将类的实例用作映射中的键，那么你必须重载\
  \ `==` 运算符和 `hashCode` 方法。\n\n### 另请参阅\n\n- 有关日期和时间转换，请参阅 *第 3 章，使用数据类型* 中的 *处理日期和时间*\
  \ 一节\n\n## 使用工厂构造函数\n\nDart 通过构造函数为我们提供了许多灵活而简洁的构建对象方式：\n\n- 使用可选参数，例如在 Person 构造函数中，salary\
  \ 是可选的：\n\n```dart\nclass Person {\n  String name;\n  num salary;\n  Person(this.name,\
  \ {this.salary});\n}\n```\n\n- 使用命名构造函数（可读性强的自文档化代码的一大优势），例如，为与 acc 相同所有者的 BankAccount\
  \ 创建实例：\n\n```dart\nBankAccount.sameOwner(BankAccount acc): owner = acc.owner;\n\
  ```\n\n- 使用 const 构造函数，如下面的代码所示：\n\n```dart\nclass ImmutableSquare {\n  final num\
  \ length;\n  static final ImmutableSquare ONE = const ImmutableSquare(1);\n  const\
  \ ImmutableSquare(this.length);\n}\n```\n\n然而，现代模块化软件应用需要更灵活的方式来构建和返回对象，通常需要引入工厂设计模式（更多信息请参阅\
  \ http://en.wikipedia.org/wiki/Factory_(object-oriented_programming)）。Dart 通过工厂构造函数直接将这种模式内建到了语言中。\n\
  \n### 具体操作...\n\n在工厂程序中，我们来探索一些使用示例，如下所示：\n\n1. 从缓存中返回对象，如下面的代码所示：\n\n```dart\n\
  main() {\n  var sv = new Service('Credit Card Validation');\n  sv.serve('Validate\
  \ card number');\n  Person p = new Person(\"S. Hawking\");\n  print(p); // S. Hawking\n\
  }\n```\n\n```dart\nclass Service {\n  final String name;\n  bool mute = false;\n\
  \n  // _cache 是库私有的，这得益于其名称前的 _。\n  static final Map<String, Service> _cache = <String,\
  \ Service>{};\n\n  Service._internal(this.name);\n\n  factory Service(String name)\
  \ {\n    if (_cache.containsKey(name)) {\n      return _cache[name];\n    } else\
  \ {\n      final serv = new Service._internal(name);\n      _cache[name] = serv;\n\
  \      return serv;\n    }\n  }\n\n  void serve(String msg) {\n    if (!mute) {\n\
  \      print(msg); // Validate card number\n    }\n  }\n}\n```\n\n2. 从子类型创建对象，如下面的代码所示：\n\
  \n```dart\nclass Person {\n  factory Person(name) => new Teacher(name);\n}\n\nclass\
  \ Teacher implements Person {\n  String name;\n  Teacher(this.name);\n  toString()\
  \ => name;\n}\n```\n\n使用抽象类，abstract_factory1-3 展示了如何将工厂构造函数与抽象类一起使用：\n\n- 工厂构造函数可以与抽象类一起使用，如下面的代码所示：\n\
  \n```dart\nvoid main() {\n  // 工厂作为抽象类的默认实现：\n  Cat cat = new Animal();\n  var catSound\
  \ = cat.makeNoise();\n}\n```\n\n\n\n```dart\nprint(catSound); // Meow\n}\n\nabstract\
  \ class Animal {\n  String makeNoise();\n  factory Animal() => new Cat();\n}\n\n\
  class Cat implements Animal { String makeNoise() => 'Meow'; }\nclass Dog implements\
  \ Animal { String makeNoise() => 'Woof';}\n```\n\n使用工厂构造函数与抽象类结合的另一个示例在以下代码中展示：\n\
  \n```dart\nimport 'dart:math';\n\nvoid main() {\n  Cat an = new Animal();\n  print(an.makeNoise());\n\
  }\n\nabstract class Animal {\n  // simulates computation:\n  factory Animal() {\n\
  \    var random = new Random();\n    if (random.nextBool())\n      return new Cat();\n\
  \    else\n      return new Dog();\n  }\n}\n\nclass Cat implements Animal { String\
  \ makeNoise() => 'Meow'; }\nclass Dog implements Animal { String makeNoise() =>\
  \ 'Woof'; }\n```\n\n下一个示例也说明了如何使用工厂构造函数与抽象类：\n\n```dart\nvoid main() {\n  Cat cat\
  \ = new Animal(\"cat\");\n  Dog dog = new Animal(\"dog\");\n  print(cat.makeNoise());\n\
  }\n\nabstract class Animal {\n  String makeNoise();\n  factory Animal(String type)\
  \ {\n    switch(type) {\n      case \"Cat\":\n        return new Cat();\n      case\
  \ \"Dog\":\n        return new Dog();\n      default:\n        throw \"The '$type'\
  \ is not an animal\";\n    }\n  }\n}\n\nclass Cat implements Animal { String makeNoise()\
  \ => 'Meow'; }\nclass Dog implements Animal { String makeNoise() => 'Woof'; }\n\
  ```\n\n### How it works...\n\n在第一个示例中，我们有一组收集在 _cache 中的服务，但每个服务只能通过私有的 _internal\
  \ 构造函数创建一次；每个命名服务都是唯一的。\n\n在第二个示例中，我们展示了具有工厂构造函数的类不能直接被扩展；相反，子类型必须实现该类。在第三个示例中，我们展示了使用抽象类与工厂构造函数的三种变体。\n\
  \n为什么以及何时想要使用工厂构造函数？有时，我们不希望构造函数总是创建它所在类的新对象。以下是工厂构造函数的一些用例；代码示例向您展示了所有这些的用法示例：\n\
  \n- 为了从缓存中返回对象以便重用它\n- 为了从构造函数所在类的子类型创建对象\n- 为了将实例限制为一个唯一对象（单例模式）\n- 即使是抽象类也可以包含工厂构造函数来返回具体类的默认实现（这是抽象类可以拥有构造函数的唯一方式）\n\
  \n工厂构造函数与任何其他构造函数一样通过 new 调用。类的使用者不知道构造函数实际上是一个工厂，因此您可以将常规构造函数重构为工厂构造函数以增强灵活性，而无需强制客户端更改其代码。工厂还可能涉及更多准备和计算，而类的使用者可能并不知情；使用者可能只是创建一个新实例。通过工厂调用私有构造函数也是一个常见模式，正如我们在第一个示例中所看到的。\n\
  \n### How it works...\n\n`Immortal` 类包含其自身类型的一个对象，该对象通过调用私有 `_internal` 构造函数自行实例化。因为它将是唯一的，我们将其声明为\
  \ static。工厂构造函数始终返回此实例；执行隔离区中永远只能存在一个 `Singleton` 类的实例（此处命名为 `Immortal`）。它必须是一个工厂构造函数，因为只有这种类型可以返回值。代码甚至可以缩短，如下所示：\n\
  \n```dart\nclass Singleton {\n  factory Singleton() => const Singleton._internal();\n\
  \  const Singleton._internal();\n}\n```\n\n## Using reflection\n\nDart 基于镜像的反射 API（包含在\
  \ `dart:mirrors` 库中）提供了一套强大的工具来反射代码。这意味着可以检查程序的完整结构并发现所有对象的全部属性。通过这种方式，可以反射性地调用方法。它甚至将能够动态评估尚未在源代码中字面指定的代码。一个例子是调用方法名作为参数提供的方法，因为它在数据库表中查找。\n\
  \n### Getting ready\n\n使用反射的代码部分应具有以下导入代码：\n\n```dart\nimport 'dart:mirrors';\n\
  ```\n\n### How to do it...\n\n为了执行反射，我们执行以下操作：\n\n- 在 `reflection` 项目中，我们使用类 `Embrace`\
  \ 来进行反射：\n\n  ```dart\n  void main() {\n    var embr = new Embrace(5);\n    print(embr);\
  \  // Embraceometer reads 5\n    embr.strength += 5;\n    print(embr.toJson());\
  \ // {strength: 10}\n    var embr2 = new Embrace(10);\n    var bigHug = embr + embr2;\n\
  \    // Start reflection code:\n  ```\n\n- 使用 MirrorSystem，如以下代码所示：\n\n  ```dart\n\
  \  final MirrorSystem ms = currentMirrorSystem();\n  // Iterating through libraries\n\
  \  ms\n    .libraries\n    .forEach((Uri name, LibraryMirror libMirror){\n     \
  \ print('$name $libMirror');\n    });\n  ```\n\n- 使用 InstanceMirror 和 ClassMirror，如以下代码所示：\n\
  \n  ```dart\n  InstanceMirror im = reflect(embr);\n  InstanceMirror im2 = im.invoke(#toJson,\
  \ []);\n  print(im2.reflectee); // {strength: 10}\n  ClassMirror cm = reflectClass(Embrace);\n\
  \  ClassMirror cm2 = im.type;\n  printAllDeclarationsOf(cm);\n  InstanceMirror im3\
  \ = cm.newInstance(#light, []);\n  print(im3.reflectee.strength);\n  im3.reflectee.withAffection();\n\
  \  }\n\n  printAllDeclarationsOf(ClassMirror cm) {\n    for (var k in cm.declarations.keys)\
  \  print(MirrorSystem.\n  getName(k));\n    print(MirrorSystem.getName(m.simpleName));\n\
  \  }\n\n  class Embrace {\n    num _strength;\n    num get strength => _strength;\n\
  \    set strength(num value) => _strength=value;\n    Embrace(this._strength);\n\
  \    Embrace.light(): _strength=3;\n    Embrace.strangle(): _strength=100;\n   \
  \ Embrace operator +(Embrace other) =>\n        Embrace(strength + other.strength);\n\
  \    String toString() => \"Embraceometer reads $strength\";\n    Map toJson() =>\
  \ {'strength': '$_strength'};\n\n    withAffection() {\n      for (var no=0; no\
  \ <= 3; no++) {\n        for (var s=0; s <=5; s++) { strength = s; }\n      }\n\
  \    }\n  }\n  ```\n\n运行前面的程序会产生以下输出：\n\n```text\nEmbraceometer reads 5\n{strength:\
  \ 10}\ndart:core LibraryMirror on 'dart.core'\ndart:mirrors LibraryMirror on 'dart.mirrors'\n\
  dart:nativewrappers LibraryMirror on \"\"\ndart:typed_data LibraryMirror on 'dart.typed_data'\n\
  dart:async LibraryMirror on 'dart.async'\ndart:convert LibraryMirror on 'dart.convert'\n\
  dart:collection LibraryMirror on 'dart.collection'\ndart:_internal LibraryMirror\
  \ on 'dart._internal@0x1f109d24'\ndart:isolate LibraryMirror on 'dart.isolate'\n\
  dart:math LibraryMirror on 'dart.math'\ndart:builtin LibraryMirror on 'builtin'\n\
  dart:io LibraryMirror on 'dart.io'\nfile:///F:/Dartiverse/ADartCookbook/book/Chapter\
  \ 4 - Object orientation/code/reflection/bin/reflection.dart LibraryMirror on \"\
  \"\n{strength: 10}\n_strength\nstrength\nstrength=\n+\ntoString\ntoJson\nwithAffection\n\
  Embrace\nEmbrace.light\nEmbrace.strangle\n3\n```\n\n### How it works...\n\ncurrentMirrorSystem\
  \ 类返回当前隔离区上的 MirrorSystem 对象；libraries getter 为您提供当前代码范围内库的列表。\n\nInstanceMirror\
  \ 子类是对象实例的表示，ClassMirror 是类定义的表示。\n\n使用顶层 reflect 方法对对象进行操作以获取 InstanceMirror。这允许您动态地在对象上调用代码产生另一个\
  \ InstanceMirror；使用其 reflectee 属性可以访问实际实例。\n\n请注意，invoke 方法的第一个参数是方法名的符号（可从其 # 前缀识别）。符号是在\
  \ Dart 中引入的，因为它们在压缩后仍然存在。\n\n顶层 reflectClass 方法对类进行操作会产生 ClassMirror；通过对该类的 InstanceMirror\
  \ 调用 type 也会给出相同类型的对象。ClassMirror 类具有 declarations getter，它返回从声明名称到其镜像的映射。可以在 ClassMirror\
  \ 上调用静态方法。\n\n对于 Dart 中的每种对象类型，都存在一个对应的镜像对象。因此我们有 VariableMirror、MethodMirror、ClassMirror、LibraryMirror\
  \ 等。在 ClassMirror 类上使用构造函数名称作为符号调用 newInstance 会产生 InstanceMirror；然后您可以通过 reflectee\
  \ 在真实对象上调用方法。\n\n### There's more...\n\n在使用反射时，我们应该注意一些事情：\n\n- 镜像 API 仍在演进中，因此请期待未来的一些增添和调整。实现在\
  \ Dart VM 中运行的代码时最为完整。\n- dart2js 中的镜像功能稍显滞后。dart2js 对您的应用执行的压缩和树摇过程通常无法检测到反射代码。因此，运行时使用反射可能会失败，导致\
  \ noSuchMethod() 错误。为了防止这种情况发生，请使用 Mirrors 注解，如以下代码所示，这有助于 dart2js 编译器生成更小的代码：\n\
  \n  ```dart\n  @MirrorsUsed(override: '*')\n  import 'dart:mirrors';\n  ```\n\n\
  - 其中一个限制是跨隔离区的反射。在撰写本书时，反射仅在反射代码和被反射对象在同一隔离区运行时才有效。\n\n```dart\n@MirrorsUsed(override:\
  \ '*')\nimport 'dart:mirrors';\n```\n\n假设你有一个未记录的方法，它返回一个 Future 值，而你想在不深入查看源代码的情况下知道该对象的属性和方法。请运行以下代码片段：\n\
  \n```\nimport 'dart:mirrors';\n\nundocumentedMethod().then((unknown){\n    var r\
  \ = reflect(unknown).type;  // ClassMirror\n    var m = r.declarations;\n    for\
  \ (var k in m.declarations.keys) print(MirrorSystem.getName(k));\n});\n```\n\n##\
  \ 另请参阅\n\n- 当你希望在代码中使用反射，而这些代码必须经过压缩和 tree shaking 时，请阅读*第1章，使用Dart工具*中的*缩小应用体积*一节。\n\
  \n## 使用 mixin\n\n在 Dart 中，就像在 Ruby 中一样，你的类可以使用 mixin 来为你的类分配特定行为。假设一个对象必须能够保存自身，那么它的类可以混入一个名为\
  \ `Persistable` 的类，该类定义了 `save()` 和 `load()` 方法。从那时起，原始类就可以自由使用这些混入的方法。这种机制不用于特化子类或“is-a”关系，因此它不使用继承。这很好，因为\
  \ Dart 使用单一继承，所以你需要谨慎选择唯一的直接超类。\n\n## 如何做...\n\n- 查看 `mixins` 项目；上一个配方中的 Embrace\
  \ 类需要持久化自身，因此它混入抽象类 `Persistable`，从而注入保存和加载行为。然后，我们可以对 `embr` 对象应用 `save()` 方法，从而执行\
  \ mixin 的代码，如下所示：\n\n```\nvoid main() {\n    var embr = new Embrace(5);\n```\n\n\
  - 使用 mixin 的方法，如下代码所示：\n\n```\nprint(embr.save(embr.strength));\nprint(embr is Movement);\
  \  // true\nprint(embr is Persistable); // true\n}\n```\n\n- 混入 Persistable，如下代码所示：\n\
  \n```\nclass Embrace extends Movement with Persistable {\n    // code omitted, see\
  \ previous recipe\n}\n\nclass Movement {\n    String name;\n    Movement();\n}\n\
  ```\n\n- 定义 Persistable，如下代码所示：\n\n```\nabstract class Persistable {\n    save(var\
  \ s) {\n        // saving in data store\n        return \"You are saved with strength\
  \ $s!\";\n    }\n    load() => \"You are loaded!\";\n}\n```\n\n上述程序产生输出 **你已保存，强度为\
  \ 5！**\n\n## 工作原理\n\n抽象类 Persistable 使用关键字 with 混入。类 Embrace 是类 Movement 的子类，即 Embrace\
  \ is Movement；如果你没有直接超类，如下代码所示：\n\n```\nclass Embrace extends Object with Persistable\n\
  ```\n\n所以这意味着，为了使用 mixin，你总是需要继承一个类。类 Embrace 的对象同时也是混入类型 Persistable 的实例。\n\n##\
  \ 更多...\n\n被混入的类通常是抽象类，但并非必须如此。你也可以混入多个类，以体验多重继承，如下代码所示：\n\n```\nclass Developer\
  \ extends Person with Intellectual, Addicted\n```\n\n混入的类必须遵守以下限制：\n\n- 它不能声明构造函数\n\
  - 它的超类是 Object\n- 它不能包含对超类的调用\n\nmixin 概念非常类似于许多其他语言中存在的接口机制的实现。然而，它更加强大，因为混入的类可以包含可执行的实际代码，而接口不能包含代码，只能包含方法的定义。这就是为什么使用\
  \ mixin 是一种良好实践。\n\n> 始终检查你的继承关系，看看用 mixin 是否比用超类更能描述它。\n\n在 Dart 中，你还可以使用 implements\
  \ 关键字；一个类可以实现一个或多个其他类。实现和混入有什么区别？实现意味着该类为其实现的类中的公共方法提供自己的代码，而混入意味着该类可以使用 mixin 类本身的代码。\n\
  \n## 使用注解\n\nDart 与 Java 和 C# 等其他语言一样，能够为变量、类、函数、方法以及其他 Dart 程序结构附加（或注解）以 @ 符号开头的元数据词。这样做是为了提供有关该结构的更多信息，或表明它具有特殊特征或行为。例如\
  \ @override、@deprecated 和 @observable（用于 Polymer），Dart 团队大量使用它们。此外，Angular.dart\
  \ 也大量使用它们。而且，你还可以定义自己的注解。\n\n## 如何做...\n\n在 annotations 项目中，我们为 Embrace 类添加了元数据\
  \ @ToFix。strangle 方法用 @deprecated 标记，我们在 Embrace 中用 @override 表示要覆盖从 Movement 继承的\
  \ consumedCalories 方法，如下代码所示：\n\n```\nconst Anno = \"Meta\";\n\nvoid main() {\n\
  \  var embr = new Embrace(5);\n  print(embr);\n  var str = new Embrace.strangle();\n\
  }\n\n@Anno\n@ToFix(\"Improve the algorithms\", \"Bill Gates\")\nclass Embrace {\n\
  // code ommitted, see previous recipes\n```\n\n```\n@deprecated\n  Embrace.strangle():\
  \ _strength = 100;\n\n@override consumedCalories() { } //      warning!\n}\n\nclass\
  \ Movement {\n  String Name;\n  Movement();\n  consumedCalories() {\n    // calculation\
  \ of calories\n  }\n}\n\nclass ToFix {\n  final String note, author, date;\n  const\
  \ ToFix(this.note, this.author, {this.date});\n}\n```\n\n## 工作原理\n\n@deprecated\
  \ 实例用于表示你不再希望库的用户使用的东西，并且它可能会在未来的版本中停止工作。当 Dart Editor 中的分析器看到这个注解时，它会在后面的代码组件（以及使用它的任何地方）上画一条删除线。此外，它还会给出警告：'...'\
  \ 已弃用。@override 实例也是一个很好的（但不是必需的）指示，表明你想覆盖继承的行为。在这里，编辑器也会使用这个实例来指出可能的 bug；如果你写了\
  \ @override consumedcalories()，那么你会得到警告：方法未覆盖继承的方法；因此可以消除拼写错误。\n\n要创建自己的注解，必须确保它被定义为一个以标识符开头的常量表达式，例如示例中的\
  \ const Anno，可以用作 @Anno。更具体地说，它必须是对编译时常量变量的引用，或对常量构造函数的调用。我们使用 ToFix 类为我们的类添加注解\
  \ @ToFix(\"Improve the algorithms\")。\n\n## 更多...\n\n在 Dart 中，注解通过 analyzer 库中的\
  \ Annotation 类定义。借助反射镜像库（参见“使用反射”一节），可以在运行时提取元数据，并使用其值来影响程序执行。\n\n## 另请参阅\n\n- 参见*第11章，Angular\
  \ Dart 实战*中 `Angular.dart` 使用的注解。\n\n## 使用 call 方法\n\n这是 Dart 中一个隐藏的瑰宝。它允许你向对象传递一个参数，从而调用对象类中的\
  \ `call` 方法。\n\n## 如何做...\n\n在 `call` 项目中查看它的用法，如下代码所示：\n\n```\nvar u = \"Julia\"\
  ;\n\nvoid main() {\n  var embr = new Embrace(5);\n```\n\nThe call method can be\
  \ used in the following ways:\n\n- 1. 调用 `call`，如下代码所示：\n\n```\nembr(u); // callable\
  \ method!\nvar m = new Mult();\nprint(m(3, 4));\n}\n\nclass Embrace {\n  // see\
  \ code in recipe: Using reflection\n```\n\n- 2. 定义 `call` 方法，如下代码所示：\n\n```\ncall(var\
  \ user) { print(\"$user is called, and hugged with\nstrength $strength!\"); }\n\
  }\n\nclass Mult{\n  call(int a, int b) => a * b;\n}\n```\n\n我们在屏幕上得到以下输出：\n\n```\n\
  Julia is called, and hugged with strength 5!\n\n12\n```\n\n## 工作原理\n\n我们在 embr(u)\
  \ 调用中将值 u 传递给 embr 对象，这会调用 call 方法。该方法定义了你的类的实例在通过 () 语法作为函数调用时的行为。在普通类中使用它的优势可能并不那么明显。当创建一个实际上想要模拟函数的类（例如\
  \ Mult 类）时，它更有用。这种调用对象可以接收两个整数并返回它们的乘积。这个示例很简单，不值得为它专门写一个类，但在某些情况下，这种能力是可以利用的。\n\
  \n## 更多...\n\nMult 类只包含一个函数。我们也可以将它写成一个 Multi 函数，如下代码所示：\n\n```\nint Multi(int a,\
  \ int b) => a * b;\n```\n\n我们甚至可以用 print(Multi(3, 4)); // 12 来调用它。\n\nDart 中的所有函数都是\
  \ Function 类型，但我们可以通过定义 typedef 来指定得更具体。typedef 是一种为函数签名命名的方式，即其参数类型和返回类型。typedef\
  \ IntOp 概括了 Multi 的类型，如下代码所示：\n\n```\ntypedef int IntOp(int a, int b);\n```\n\n\
  然后，例如当 f 被定义为 Function 时，我们可以这样写：\n\n```\nassert(Multi is IntOp);\nf = Multi;\n\
  print(f(3, 4)); // 12\nassert(f is IntOp);\n```\n\n## 使用 noSuchMethod\n\n当在一个对象上调用某个方法，而该方法不存在于其类或其继承树中的任何超类时，就会调用\
  \ Object 的 noSuchMethod()。noSuchMethod 的默认行为是抛出 NoSuchMethodError，提示找不到方法：'methodname'。然而，Dart\
  \ 可以做得更多；与其他一些动态语言一样，每个类都可以实现 noSuchMethod，使其行为更具适应性和灵活性。这是因为 Dart 是动态类型的，所以有可能调用一个在动态变量中不存在的方法。在\
  \ Java 中，这会导致编译时错误。在 Dart 中也会抛出错误，但发生在运行时。通过使用 noSuchMethod()，我们可以避开这个问题并加以利用。\n\
  \n\n\n\n## 如何操作...\n\n在 nosuchmethod 项目中查看 noSuchMethod 的实际效果：\n\n```\nvoid main()\
  \ {\n  var embr = new Embrace(5);\n  print(embr.missing(\"42\", \"Julia\")); //\
  \ is a missing method!\n}\n\n@proxy\nclass Embrace {\n  // see code in previous\
  \ recipes\n  @override\n  noSuchMethod(Invocation msg) => \"got ${msg.memberName}\
  \ \"\n      \"with arguments ${msg.positionalArguments}\";\n}\n```\n\n此脚本的输出为 **got\
  \ Symbol(\"missing\") with arguments [42, Julia]**。\n\n## 其工作原理...\n\n当 missing\
  \ 被调用且未找到时，noSuchMethod 会被找到并执行。方法的确切签名是 noSuchMethod(Invocation msg)。当它被调用时，一个类型为\
  \ Invocation 的对象 msg 会被传递给它，其中包含方法名称及其参数。如果 noSuchMethod 返回一个值，该值将成为原始 Invocation\
  \ 的结果。Invocation 还具有布尔型 getter isMethod、isAccessor、isGetter 和 isSetter，用于判断被调用的方法是普通方法、getter\
  \ 还是 setter。有了这些传递的信息，我们可以做比仅仅打印它更有用的事情，如以下代码所示：\n\n```\nnoSuchMethod(Invocation\
  \ msg) =>\n  msg.memberName == #meth1 ? Function.apply(meth2,\n                \
  \              msg.positionalArguments,\n                              msg.namedArguments)\n\
  \                          : super.noSuchMethod(msg);\n```\n\n这里，我们检查被调用的方法是否为 meth1（注意\
  \ memberName 的类型为 Symbol），如果是，我们通过传递提供的参数调用 meth2 方法。调用 meth2 是通过 Function 类中的静态方法\
  \ apply() 完成的，该方法允许以通用方式调用函数。使用 @override 注解来表示你是有意覆盖一个成员。在类头本身上使用 @proxy 注解，以避免在使用\
  \ noSuchMethod() 为类实现所有可能的 getter、setter 和方法时出现分析器警告。\n\n## 还有更多...\n\n使用 noSuchMethod\
  \ 的另一个好理由是在编写大量相似方法时减少样板代码。为了确保代码补全仍然有效，请使用以下结构：\n\n```\nabstract class Class1Api\
  \ {\n  method1();\n  method2();\n  //...\n}\n```\n\n```\nclass Class1 implements\
  \ Class1Api {\n  noSuchMethod(Invocation inv) {\n    //...\n  }\n}\n```\n\n```\n\
  main() {\n  Class1 cl = new Class1();\n  // cl.  // remove comment and type cl.\
  \ to see method1()\n          // and so on in code completion\n}\n```\n\n所有将在 noSuchMethod\
  \ 中实现的方法都汇总在抽象类 Class1Api 中，然后代码补全列表会呈现它们。参见 boilerplate.dart 文件中的代码和以下截图：\n\n![](img/52c05b53a56abd53584e4fed738ed509_646_0.png)\n\
  \n## 如何操作...\n\n- 以下代码为我们的类提供 JSON 功能：\n```\nimport 'dart:convert';\n\nclass Job\
  \ {\n    String type;\n    int salary;\n    String company;\n    Job(this.type,\
  \ this.salary, this.company);\n```\n- 以下代码用于编码或序列化数据：\n```\nString toJson() {\n\
  \    var jsm = new Map<String, Object>();\n    jsm[\"type\"] = type;\n    jsm[\"\
  salary\"] = salary;\n    jsm[\"company\"] = company;\n    var jss = JSON.encode(jsm);\n\
  \    return jss;\n}\n```\n- 以下代码用于解码或反序列化数据：\n```\nJob.fromJson(String jsonStr)\
  \ {\n    Map jsm = JSON.decode(jsonStr);\n    this.type = jsm[\"type\"];\n    this.salary\
  \ = jsm[\"salary\"];\n    this.company = jsm[\"company\"];\n}\n```\n\n```\nvoid\
  \ main() {\n    var job = new Job(\"Software Developer\", 7500, \"Julia Computing\
  \ LLC\");\n    var jsonStr = job.toJson();\n    print(jsonStr);\n    var job2 =\
  \ new Job.fromJson(jsonStr);\n    assert(job2 is Job);\n    assert(job2.toJson()\
  \ == jsonStr);\n}\n```\n\njsonStr 的输出为 {\"type\":\"Software Developer\",\"salary\"\
  :7500,\"company\":\"Julia Computing LLC\"}。\n\n断言语句确认解码后的对象是 Job 类型并且等于我们开始时的 JSON\
  \ 字符串。\n\n## 其工作原理...\n\nJSON 字符串可以存储在文件或数据库中，或通过网络发送到服务器。因此我们的类需要能够：\n\n- 以 JSON\
  \ 格式写出其对象，这也称为序列化或编码；我们方便地将此方法称为 `toJson()`\n- 读取 JSON 字符串并从中构造对象（或多个对象）；这称为反序列化或解码，我们将制作一个方法\
  \ `fromJson()` 来执行此操作\n\n部分工作由导入的 `dart:convert` 库中的函数完成，该库分别生成和消费 JSON 数据：\n\n\
  - `JSON.encode()`：将 Dart 对象序列化为 JSON 字符串，准备存储或通过网络发送\n- `JSON.decode()`：从包含 JSON\
  \ 数据的字符串构建 Dart 对象，该字符串刚从存储中读取或通过网络接收\n\n这些 JSON 上的函数（它是 `JSONCodec` 类的对象）可以自动处理\
  \ `null`、`num`、`bool`、`String`、`List` 和 `Map` 类型的数据，以及这些类型的组合（map 的键需要是字符串）。在我们的\
  \ `Job` 类中，数据按以下几点处理：\n\n- `toJson()` 从对象创建 map，然后对其调用 `JSON.encode()` 以返回 JSON\
  \ 字符串\n- `fromJson()`（方便地实现为命名构造函数）接收 JSON 字符串，调用 `JSON.decode()` 返回 map，并构建对象\n\
  \n## 还有更多...\n\n如果你的数据不那么复杂，你可以在代码中自己构建 JSON 字符串，可能作为 getter，如以下片段所示：\n\n```\nString\
  \ get toJson => '{\"type\": \"$type\", \"salary\": \"$salary\", \"company\": \"\
  $company\" }';\n```\n\n> 如果你必须在代码中逐字构造 JSON 字符串，请确保始终使用双引号来表示字符串；Dart 单引号在此处不能使用。\n\
  \n当一个对象包含其他对象（组合或关联，例如包含所有者 `Person` 对象的 `BankAccount` 对象）时，外层对象的 `fromJson()` 和\
  \ `toJson()` 方法将对所有包含的对象调用同名对应方法。\n\n如果你想要一个更复杂的解决方案来支持任意对象的编码和解码，请在 pub 上查找由 Man\
  \ Hoang 提供的 jsonx 包。此库可以将 JSON 字符串解码为强类型对象，从而获得类型检查和代码补全支持，或将任意对象编码为 JSON 字符串。在处理\
  \ JSON 时，首选对其进行验证；这可以在 http://jsonlint.com/ 在线完成。\n\n## 为客户端和服务器应用创建通用类\n\n在客户端-服务器模式等分布式应用中，你通常希望在两端使用相同的模型类。为什么？因为客户端输入需要在客户端进行验证，为此我们需要在客户端应用中使用模型。数据在存储前必须经过模型，因此如果我们希望将数据同时存储在客户端数据库（indexed_db）以及服务器数据存储中，我们需要在两边都使用模型。\n\
  \n## 如何操作...\n\n你可以在 client_server_db 应用中看到如何为客户端和服务器应用创建通用类。这是一个待办事项应用；客户端从 web/app.html\
  \ 启动，服务器从 bin/server.dart 启动。客户端将待办数据存储在 indexed_db 中，而服务器将数据存储在内存中。客户端和服务器都需要模型类。\n\
  \n项目的结构如以下截图所示：\n\n![](img/52c05b53a56abd53584e4fed738ed509_650_0.png)\n\n通用库\n\n\
  ## 其工作原理...\n\n如果你希望能够从另一个包导入你的通用模型库，文件必须位于 `lib` 目录下。在此示例中，我们从 `pubspec.yaml` 看到应用的名称是\
  \ `client_server`。模型（包含 Task 和 Tasks 类）有自己的文件夹 `lib/model`，其中在 `lib/shared_model.dart`\
  \ 内的 `shared_model` 库中定义了模型类。客户端应用 web/app.dart 使用 `indexed_db`；因此它导入一个库 `idb_client`\
  \ 来操作 indexed_db，如以下代码所示：\n\n```\nimport 'package:client_server/idb_client.dart';\n\
  ```\n\n`idb_client` 库在 `lib/idb_client.dart` 中定义，它导入了 `shared_model` 库，如以下代码所示：\n\
  \n```\nlibrary idb_client;\n\nimport 'package:client_server/shared_model.dart';\n\
  import 'dart:async';\nimport 'dart:html';\nimport 'dart:indexed_db';\nimport 'dart:convert';\n\
  \npart 'idb/idb.dart';\npart 'view/view.dart';\n```\n\n这样，客户端应用就知道了模型。服务器应用也通过导入它来了解模型（参见\
  \ `bin/server.dart`）：\n\n```\nimport 'dart:io';\nimport 'dart:convert';\nimport\
  \ 'package:client_server/shared_model.dart';\n// rest of code\n```\n\n\n\n\n\n##\
  \ 面向对象\n\n### 还有更多...\n\n以下是共享模型的一个常见用例；假设该类有一个执行 HTTP 请求的方法；在客户端，你将使用 `dart:html`\
  \ 库中的 `HttpRequest`，而在服务器端，你将使用 `dart:io` 中的那个。 出于安全原因，`dart:io` 和 `dart:html` 不能在同一个库中导入，因此常见的做法是将共享类定义为抽象类，然后将\
  \ `HttpRequest` 方法的具体实现委托给同时扩展共享抽象类的客户端和服务器类。\n\n### 另请参阅\n\n- 请参阅 *第 2 章，Structuring,\
  \ Testing, and Deploying an Application* 中关于你的应用的 *Structuring an application* 和\
  \ *Making and using a library* 配方\n"
- "## 5 处理 Web 应用\n\n在本章中，我们将介绍以下配方：\n\n- 响应式设计\n- 清理 HTML\n- 使用浏览器的本地存储\n- 使用应用程序缓存以离线工作\n\
  - 防止 onSubmit 事件重新加载页面\n- 在 HTML 表格中动态插入行\n- 使用 CORS 头\n- 使用键盘事件\n- 启用拖放\n- 启用触摸事件\n\
  - 创建 Chrome 应用\n- 构建游戏项目\n- 在你的应用中使用 WebGL\n- 授权 OAuth2 访问 Google 服务\n- 与 JavaScript\
  \ 通信\n- 使用 JavaScript 库\n\n### 引言\n\nWeb 应用正是 Dart 所打造的，因此毫不奇怪，我们在这一领域有很多问题需要处理。\
  \ Dart 作为客户端语言，呈现为 JavaScript 的替代品（它会编译为 JavaScript），同时也是 CoffeeScript 和 TypeScript\
  \ 的替代品。 由于该语言是更高层次且更稳健的语言，Dart 使开发人员能够达到更高的生产率。 其结构和工具使得能够使用大型团队构建复杂的软件系统。 在其虚拟机中运行，Dart\
  \ 提供非常缩短的应用启动时间，并在执行期间提供更高的性能。 所有这些增强使 Dart 成为开发浏览器应用的首选。 你将在本章找到涉及安全、浏览器存储、各种交互事件、WebGL\
  \ 以及当然与 JavaScript 协同工作的主题。\n\n### 响应式设计\n\n如今，用户必须与各种尺寸的计算机屏幕交互，从智能手机和平板电脑到笔记本电脑、台式显示器和电视。\
  \ 以一种使页面布局能够智能地适应用户屏幕宽度分辨率的方式设计 Web 应用称为响应式设计；例如，一个 1292 像素宽的高级四列布局，在 1025 像素宽的屏幕上，查看平板电脑或智能手机时会自动简化为两列。\
  \ 其意义现在已扩展到涵盖能够智能响应用户环境的 Web 应用，同时也使 Web 应用适应用户的行为。 如果你只做一件事来使你的应用的响应式设计感知，请应用你在本主题中阅读的内容。\n\
  \n### 如何做...\n\n在你的 HTML 页面的 <head> 部分添加以下 <meta> 标签（所谓的视口标签）：\n\n```\n<meta name=\"\
  viewport\"\n    content=\"width=device-width, initial-scale=1.0\">\n```\n\n### 它是如何工作的...\n\
  \n这将为你提供跨设备布局的安心。 `viewport` 是屏幕宽度的另一个词，这个标签最初是由 Apple 设计的。 将 content 设置为 `\"width=device-width\"\
  ` 将查询你的设备以获取其标准宽度并相应地设置你的布局宽度。 为了更确信你的布局将按你的意图显示，你也可以使用 `content=\"initial-scale=1\"\
  ` 设置缩放级别。 这将确保在打开页面时，你的布局将以 1:1 的比例正确显示；不会应用缩放。 你甚至可以通过添加第三个属性值 `\"maximum-scale=1\"\
  ` 来防止任何缩放。 然而，你必须确保一切对每个人都是可读的；使用它可能会妨碍视力有问题的人。\n\n### 另请参阅\n\n- 如果你想开始了解更多关于响应式设计的内容，一个不错的教程可在\
  \ `http://www.adamkaplan.me/grid/` 获取\n\n### 清理 HTML\n\n我们都听说过（或也许经历过）**跨站脚本 (XSS)**\
  \ 攻击，其中恶意的攻击者试图将客户端脚本或 SQL 语句注入 Web 页面。 这可能是为了获取会话 cookie 或数据库数据，或获取对敏感页面内容的提升访问权限。\
  \ 验证 HTML 文档并生成一个仅保留被指定为安全的标签的新 HTML 文档称为清理 HTML。\n\n### 如何做...\n\n查看 Web 项目 `sanitization`。\
  \ 运行以下脚本并查看文本内容和默认清理是如何工作的：\n\n1. 使用以下代码查看默认清理是如何工作的：\n\n```\nvar elem1 = new Element.html('<div\
  \ class=\"foo\">content</div>');\ndocument.body.children.add(elem1);\nvar elem2\
  \ = new Element.html('<script class=\"foo\">evil content</script><p>ok?</p>');\n\
  document.body.children.add(elem2);\n```\n\nelem1 和 elem2 的文本内容和 ok? 被显示，但控制台给出消息\
  \ **Removing disallowed element <SCRIPT>**。 因此脚本在造成危害之前被移除。\n\n2. 使用 HtmlEscape\
  \ 进行清理，主要用于用户生成的内容：\n\n```\nimport 'dart:convert' show HtmlEscape;\n```\n\n在 main()\
  \ 中，使用以下代码：\n\n```\nvar unsafe = '<script class=\"foo\">evil  content</script><p>ok?</p>';\n\
  var sanitizer = const HtmlEscape();\nprint(sanitizer.convert(unsafe));\n```\n\n\
  这会在控制台打印以下输出：\n\n```\n&lt;script class=&quot;foo&quot;&gt;evil  content&lt;&#x2F;script&gt;&lt;p&gt;ok?&lt;&#x2F;p&gt;\n\
  ```\n\n3. 使用节点验证进行清理。 以下代码禁止在 node1 中使用 <p> 标签；只允许 <a> 标签：\n\n```\nvar html_string\
  \ = '<p class=\"note\">a note aside</p>';\nvar node1 = new Element.html(\n    html_string,\n\
  \    validator: new NodeValidatorBuilder()\n      ..allowElement('a', attributes:\
  \ ['href'])\n);\n```\n\n控制台打印以下输出：\n\nRemoving disallowed element <p>\n\nBreaking\
  \ on exception: Bad state: No elements\n\n4. 用于无验证的 NullTreeSanitizer 如下使用：\n\n\
  ```\nfinal allHtml = const NullTreeSanitizer();\nclass NullTreeSanitizer implements\
  \ NodeTreeSanitizer {\n    const NullTreeSanitizer();\n    void sanitizeTree(Node\
  \ node) {}\n}\n```\n\n它也可以如下使用：\n\n```\nvar elem3 = new Element.html('<p>a text</p>');\n\
  elem3.setInnerHtml(html_string, treeSanitizer: allHtml);\n```\n\n### 使用浏览器的本地存储\n\
  \n### 如何做...\n\n查看以下示例，local_storage.dart 文件：\n\n```\nimport 'dart:html';\n\nStorage\
  \ local = window.localStorage;\n\nvoid main() {\n  var job1 = new Job(1, \"Web Developer\"\
  , 6500, \"Dart Unlimited\");\n\n```\n\n执行以下步骤以使用浏览器的本地存储：\n\n1. 使用以下代码使用键 Job:1\
  \ 写入本地存储：\n\n```\nlocal[\"Job:${job1.id}\"] = job1.toJson;\nButtonElement bel =\
  \ querySelector('#readls');\nbel.onClick.listen(readShowData);\n```\n\n2. 单击按钮会检查本地存储中是否可以找到键\
  \ Job:1，如果可以，则读取数据。 然后在 data <div> 中显示：\n\n```\nreadShowData(Event e) {\n  var key\
  \ = 'Job:1';\n  if(local.containsKey(key)) {\n    // read data from local storage:\n\
  \    String job = local[key];\n    querySelector('#data').appendText(job);\n  }\n\
  }\n\nclass Job {\n  int id;\n  String type;\n  int salary;\n  String company;\n\
  \  Job(this.id, this.type, this.salary, this.company);\n  String get toJson => '{\
  \ \"type\": \"$type\", \"salary\": \"$salary\", \"company\": \"$company\" } ';\n\
  }\n```\n\n以下截图描述了数据如何存储在本地存储中以及如何从中检索：\n\n![](img/52c05b53a56abd53584e4fed738ed509_659_0.png)\n\
  \n### 它是如何工作的...\n\n你可以使用以下方式使用 Window 类将数据存储在本地存储中，使用特定键\n\n```text\nwindow.localStorage[key]\
  \ = data;  (both key and data are Strings).\n```\n\n你可以使用以下方式检索它\n\n```text\nvar\
  \ data = window.localStorage[key];\n```\n\n在我们的代码中，我们使用了缩写\n\n```text\nStorage local\
  \ = window.localStorage;\n```\n\n因为 local 是一个 map。 你可以使用 containsKey(key) 检查这段数据是否存在于本地存储中；在\
  \ Chrome（也在其他浏览器中通过 **Developer Tools**）。 你可以通过导航到 **Extra | Tools | Resources |\
  \ Local Storage**（如前一截图所示）来验证这一点。 window.localStorage 还有一个 length 属性；你可以使用 isEmpty\
  \ 查询它是否包含内容，并且你可以使用以下代码遍历所有存储的值：\n\n```text\nfor(var key in window.localStorage.keys)\
  \ {\n  String value = window.localStorage[key];\n  // more code\n}\n```\n\n\n\n\
  ### 还有更多...\n\n本地存储可能会被禁用（由用户操作，或通过已安装的插件或扩展程序），因此当需要启用时，我们必须提醒用户；我们可以通过捕获此情况下发生的异常来实现：\n\
  \n```dart\ntry {\n    window.localStorage[key] = data;\n} on Exception catch (ex)\
  \ {\n    window.alert(\"Data not stored: Local storage is disabled!\");\n}\n```\n\
  \n本地存储是一个简单的键值存储，并且具有良好的跨浏览器覆盖率。然而，它只能存储字符串，并且是阻塞的（同步）API；这意味着在它执行存储或读取大量数据（如图像）的工作时，它可能会暂时使你的网页停止响应。此外，它有\
  \ 5 MB 的空间限制（因浏览器而异）；你无法检测何时接近此限制，也无法申请更多空间。当达到限制时，会发生错误，以便用户可以得到通知。\n\n> 这些属性使得本地存储仅作为临时数据存储工具有用；这意味着它比\
  \ cookie 更好，但不适合可靠的、数据库类型存储。\n\nWeb 存储还有另一种存储数据的方式，称为 sessionStorage，使用方式相同，但它将数据的持久性限制为仅当前浏览器会话。因此，当浏览器关闭或在同一浏览器窗口中启动另一个应用程序时，数据会丢失。\n\
  \n### 另请参阅\n\n- 有关 JSON 格式的更多信息，请参阅第 4 章《面向对象编程》中你的类中的 Making toJSON and fromJSON\
  \ methods 配方\n- 比简单本地存储更好的替代方案是 IndexedDB；请参阅第 9 章《使用数据库》中 Storing data locally\
  \ in IndexedDB 配方\n\n## 使用应用程序缓存离线工作\n\n当由于某种原因，我们的用户无法访问网络或网站因维护（甚至损坏）而无法使用时，我们基于\
  \ Web 的应用程序也应离线工作。浏览器缓存不足以做到这一点，因此 HTML5 为我们提供了 ApplicationCache 机制。此缓存告诉浏览器应使哪些文件可离线使用。其效果是，即使用户离线，应用程序也能加载并正常工作。要保存在缓存中的文件在清单文件中指定，该文件具有\
  \ `.mf` 或 `.appcache` 扩展名。\n\n### 如何做...\n\n查看 appcache 应用程序；它有一个名为 `appcache.mf`\
  \ 的清单文件。\n\n1. 清单文件可以在每个需要缓存的网页中指定。这是通过 `<html>` 标签的 manifest 属性完成的：\n\n   ```html\n\
  \   <html manifest=\"appcache.mf\">\n   ```\n\n   如果一个页面需要被缓存但没有 manifest 属性，则必须在清单文件的\
  \ CACHE 部分中指定。清单文件具有以下（最小）内容：\n\n   ```text\n   CACHE MANIFEST\n   # 2012-09-28:v3\n\
  \n   CACHE:\n   Cached1.html\n   appcache.css\n   appcache.dart\n   http://dart.googlecode.com/svn/branches/bleeding_edge/dart/client/dart.js\n\
  \n   NETWORK:\n   *\n\n   FALLBACK:\n   / offline.html\n   ```\n\n2. 运行 cached1.html。这会显示\
  \ **This page is cached, and works offline!** 文本。将文本更改为 This page has been changed!\
  \ 并重新加载浏览器。你看不到更改后的文本，因为页面是从应用程序缓存创建的。\n\n3. 当清单文件被更改（将版本 v1 更改为 v2）时，缓存变得无效，并且带有\
  \ **This page has been changed!** 文本的新版本页面将被加载。\n\n4. 页面的 Dart 脚本 `appcache.dart`\
  \ 应包含以下最小代码以访问缓存。\n\n   ```dart\n   main() {\n     new AppCache(window.applicationCache);\n\
  \   }\n\n   class AppCache {\n     ApplicationCache appCache;\n\n     AppCache(this.appCache)\
  \ {\n       appCache.onUpdateReady.listen((e) => updateReady());\n       appCache.onError.listen(onCacheError);\n\
  \     }\n   }\n\n   void updateReady() {\n       if (appCache.status == ApplicationCache.UPDATEREADY)\
  \ {\n           // The browser downloaded a new app cache. Alert the user:\n   \
  \        appCache.swapCache();\n           window.alert('A new version of this site\
  \ is available. Please reload.');\n       }\n   }\n\n   void onCacheError(Event\
  \ e) {\n       print('Cache error: ${e}');\n       // Implement more complete error\
  \ reporting to developers\n   }\n   ```\n\n### 它是如何工作的...\n\n清单文件中的 CACHE 部分枚举了所有需要缓存的条目。`NETWORK:`\
  \ 和 `*` 选项意味着要使用所有其他资源，用户必须在线。FALLBACK 指定如果用户离线且资源无法访问，则会显示 offline.html。一个页面在以下任一条件为真时会被缓存：\n\
  \n- 它的 HTML 标签具有指向清单文件的 manifest 属性\n- 页面在清单文件的 CACHE 部分中指定\n\n当清单文件被更改时，浏览器会收到通知，并且用户将被强制刷新其缓存资源。添加时间戳和/或版本号如\
  \ `# 2014-05-18:v1` 效果很好。更改日期或版本号会使缓存失效，并且更新的页面将再次从服务器加载。\n\n要从代码中访问浏览器的应用缓存，请使用\
  \ window.applicationCache 对象。创建一个 AppCache 类的对象，并在应用程序缓存变得无效时（状态为 UPDATEREADY）提醒用户，通过定义\
  \ onUpdateReady 监听器。\n\n### 还有更多...\n\n应用程序缓存的其他已知状态是 UNCACHED、IDLE、CHECKING、DOWNLOADING\
  \ 和 OBSOLETE。要记录所有这些缓存事件，你可以在 appCache 构造函数中添加以下监听器：\n\n```dart\nappCache.onCached.listen(onCacheEvent);\n\
  appCache.onChecking.listen(onCacheEvent);\nappCache.onDownloading.listen(onCacheEvent);\n\
  appCache.onNoUpdate.listen(onCacheEvent);\nappCache.onObsolete.listen(onCacheEvent);\n\
  appCache.onProgress.listen(onCacheEvent);\n```\n\n使用以下代码提供一个 onCacheEvent 处理程序：\n\
  \n```dart\nvoid onCacheEvent(Event e) {\n    print('Cache event: ${e}');\n}\n```\n\
  \n## 防止 onSubmit 事件重新加载页面\n\n网页上包含 HTML 表单的提交按钮的默认操作是将所有表单数据发布到应用程序运行的服务器上。如果我们不希望发生这种情况怎么办？\n\
  \n### 如何做...\n\n通过执行以下步骤来尝试 submit 应用程序：\n\n1. 我们的网页 `submit.html` 包含以下代码：\n\n \
  \  ```html\n   <form id=\"form1\" action=\"http://www.dartlang.org\" method=\"POST\"\
  >\n     <label>Job:<input type=\"text\" name=\"Job\" size=\"75\"></input>\n    \
  \ </label>\n     <input type=\"submit\" value=\"Job Search\">\n   </form>\n   ```\n\
  \n   注释掉 `submit.dart` 中的所有代码。运行应用程序，输入一个工作名称，然后单击 Job Search 提交按钮；Dart 网站会出现。\n\
  \n2. 当以下代码添加到 `submit.dart` 时，单击提交按钮不再使 Dart 网站出现：\n\n   ```dart\n   import 'dart:html';\n\
  \n   void main() {\n     querySelector('#form1').onSubmit.listen(submit);\n   }\n\
  \n   submit(Event e) {\n     e.preventDefault();\n     // code to be executed when\
  \ button is clicked\n   }\n   ```\n\n### 它是如何工作的...\n\n在第一步中，当按下提交按钮时，浏览器会看到方法为\
  \ POST。此方法收集输入字段中的数据和名称并将其发送到 action 中指定的 URL 以执行，在我们的例子中它只显示 Dart 网站。\n\n为了防止表单发布数据，为表单的\
  \ onSubmit 事件制作一个事件处理程序。在此处理程序代码中，`e.preventDefault();` 作为第一条语句将取消默认的提交操作。然而，提交事件处理程序的其余部分（甚至父控件的相同处理程序，如果存在的话）仍将在客户端执行。\n\
  \n## 动态在 HTML 表格中插入行\n\n当显示来自数据库的数据时，你通常不知道会有多少数据记录。我们的网页及其中的 HTML 表格必须动态适应。以下配方描述了如何做到这一点。\n\
  \n### 如何做...\n\n查看 html_table 应用程序。网页包含两个 `<table>` 标签：\n\n```html\n<table id=\"\
  data\"></table>\n<table id=\"jobdata\"></table>\n```\n\n\n\n\n+   4. 在索引 0 处插入一个单元格，将该单元格赋给一个变量，并为其提供内容，代码如下所示：\n\
  \n```\ncell = row.insertCell(0);\ncell.text = 'cell 0-0';\n```\n\n+   5. 使用消息级联方式插入更多单元格，并使用以下代码为它们设置样式：\n\
  \n```\nrow.insertCell(1)\n  ..text = 'cell 0-1'\n  ..style.background = 'lime';\n\
  row.insertCell(2)\n  ..text = 'cell 0-2'\n  ..style.background = 'red';\n```\n\n\
  +   6. 在表格末尾插入一个新行：\n\n```\nrow = table.insertRow(-1);\n    row.insertCell(0).text\
  \ = 'cell 1-0';\n```\n\n以下是使用与上述相同方法显示 List 数据的代码：\n\n```\nvar job1 = new Job(\"\
  Software Developer\", 7500, \"Julia Computing LLC\") ;\nvar job2 = new Job(\"Web\
  \ Developer\", 6500, \"Dart Unlimited\") ;\nvar job3 = new Job(\"Project Manager\"\
  , 10500, \"Project Consulting Inc.\") ;\njobs = new List<Job>();\njobs\n  ..add(job1)\n\
  \  ..add(job2)\n  ..add(job3);\ntable = querySelector('#jobdata');\n// insert table\
  \ headers:\nInsertHeaders();\n// inserting data:\nInsertData();\n```\n\n```\nInsertHeaders()\
  \ {\n    row = table.insertRow(-1);\n    cell = row.insertCell(0);\n    cell.text\
  \ = \"Jobtype\";\n    cell.style.background = 'lightblue';\n```\n\n```\n```dart\n\
  cell = row.insertCell(1);\ncell.text = \"Salary\";\ncell = row.insertCell(2);\n\
  cell.text = \"Company\";\ncell.style.background = 'lightblue';\n}\n\nInsertData()\
  \ {\n  for (var job in jobs) {\n    row = table.insertRow(-1);\n    cell = row.insertCell(0);\n\
  \    cell.text = job.type;\n    cell = row.insertCell(1);\n    cell.text = (job.salary).toString();\n\
  \    cell = row.insertCell(2);\n    cell.text = job.company;\n  }\n}\n```\n```\n\
  \n+   7. 上述代码从指定单元格获取内容：\n+   \n+      `print(table.rows[1].cells[1].text); // prints\
  \ 7500`\n\n## 工作原理\n\n我们分别使用 `TableElement` 和 `TableRowElement` 的 `insertRow()`\
  \ 和 `insertCell()` 方法，以及 `TableCellElement` 的属性。行和列从 0 开始编号。如代码最后一行所示，可以通过在特定行和单元格上使用索引器\
  \ `[]` 来检索特定单元格的内容。\n\n## 另请参阅\n\n+   - 位于 <https://api.dartlang.org/apidocs/channels/stable/dartdoc-viewer/dart-dom-html.TableElement>\
  \ 的 API 文档将向您展示更多有用的方法\n\n## 使用 CORS 头\n\n在 Web 应用程序安全模型中，同源策略是一个重要概念。其基本原则是，来自无关网站的内容必须在客户端严格分离；否则，机密性或数据完整性可能会受到损害，也许是通过跨站脚本攻击。换句话说，网页或页面上运行的脚本只能访问与其来源相同域名的脚本或页面；不允许访问其他站点。例如，`http://www.example.com/dir/page2.html`\
  \ 不能访问 `http://en.example.com/dir/other.html`。然而，在许多情况下，这过于严格，例如在使用 `HttpRequest`\
  \ 进行 AJAX 调用时，我们必须从另一台服务器加载数据（参见*第 7 章，使用 Web 服务器*）。为了实现这一点，开发了 CORS 机制（跨源资源共享），大多数现代\
  \ Web 浏览器都支持该机制。本教程将通过以下步骤使您轻松实现这一点。\n\n### 操作步骤\n\n以下步骤展示了如何配置您的 Web 服务器以添加 CORS\
  \ 头：\n\n+   1. 当 Web 服务器在响应中发回 CORS 头时，客户端也被允许向其他域名的服务器发送请求。因此，在每个请求处理代码中，我们必须添加对诸如\
  \ `addCorsHeaders` 之类方法的调用，如下面的代码所示：\n\n```\nvoid handleGet(HttpRequest request)\
  \ {\n    HttpResponse res = request.response;\n    addCorsHeaders(res);\n    //\
  \ other code to prepare the response\n    // ...\n    res.write(content);\n    res.close();\n\
  }\n```\n\n+   2. 现在我们需要定义 `addCorsHeaders` 方法；它包含以下代码：\n\n```\nvoid addCorsHeaders(HttpResponse\
  \ response) {\n    response.headers.add('Access-Control-Allow-Origin', '*');\n \
  \   response.headers.add('Access-Control-Allow-Methods', 'POST, OPTIONS');\n   \
  \ response.headers.add('Access-Control-Allow-Headers', 'Origin, X-Requested-With,\
  \ Content-Type, Accept');\n}\n```\n\n### 工作原理\n\n所有与 CORS 相关的头都以 `Access-Control-`\
  \ 为前缀。`Access-Control-Allow-Origin` 选项必须包含在所有有效的 CORS 响应中。值 `*` 表示允许来自所有域名的访问。在开发中，这很有用，因为您可以运行来自\
  \ Dart Editor 的应用程序，其内部服务器默认使用 3030 端口。然而，对于生产环境应用程序，您应该汇总允许的来源，如下所示：\n\n+   - `Access-Control-Allow-Origin`\
  \ 位于 `http://www.example-social-network.com`\n+   - `Access-Control-Allow-Origin`\
  \ 位于 `http://www.snapshot.com`\n\n因此，实际上，我们列出了所有允许访问的网站。在我们的代码中，允许来自任何来源的 `POST`\
  \ 和 `OPTIONS` 请求。当客户端从不同来源运行时，会发送 `OPTIONS` 请求以获取服务器发布数据的权限。因此，在 `POST` 请求之前，会发送一个所谓的预检\
  \ `OPTIONS` 请求，以确定实际请求是否被允许。\n\n> 一般来说，使用 CORS 头并不安全，应该汇总允许的来源。然而，出于开发目的，允许它们是很有用的。\n\
  \n### 更多内容\n\n有关在不同平台上使用 CORS 的更详细信息，请参阅 `http://enable-cors.org/server.html`。\n\
  \n## 使用键盘事件\n\n在普通 Web 应用程序中处理键盘事件并不常见。然而，如果您正在编写 Web 游戏，您几乎肯定想要捕获箭头键输入等。本教程向我们展示了如何处理这些事件。\n\
  \n### 操作步骤\n\n查看 keyboard 项目。网页是 *防止 onSubmit 事件* 教程中使用的页面的副本，但现在提交保持启用状态。假设我们还希望确保按\
  \ *Enter* 键触发 `submit`，就像单击 **submit** 按钮一样。\n\n+   1. 为此，我们在 `main()` 中添加以下事件监听器：\n\
  +      ```\n+      document.onKeyPress.listen(_onKeyPress);\n+      ```\n\n2. `_onKeyPress`\
  \ 方法如下：\n\n```\n```dart\n_onKeyPress(KeyboardEvent e) {\n  if (e.keyCode == KeyCode.ENTER)\
  \ submit(e);\n}\n```\n```\n\n现在，按 *Enter* 将导致表单被提交。\n\n### 工作原理\n\n来自 `dart:html`\
  \ 的 document 对象有三个用于处理键盘输入的事件：`onKeyPress`、`onKeyDown` 和 `onKeyUp`。它们都会生成一个 `KeyboardEvent`\
  \ 对象流，捕获用户与键盘的交互。然而，这些事件也定义在 `window`（document 的父对象）以及页面上的任何 `Element` 上，因此您可以在特定的\
  \ `InputElement` 或 `<div>` 区域上非常具体地使用它们。\n\n事件的 `keyCode` 是一个来自常量列表的整数，它为每个键指定一个值，例如\
  \ `KeyCode.A`、`KeyCode.SPACE`，以及用于左箭头键的 `KeyCode.LEFT` 等等。这非常容易用于 `switch/case`\
  \ 结构，如下所示：\n\n```\n```dart\n_onKeyPress(KeyboardEvent e) {\n  e.preventDefault();\n\
  \  print('The charCode is ${e.charCode}');\n  if (e.keyCode == KeyCode.ENTER) submit(e);\n\
  \  if (e.ctrlKey) return;\n\n  switch(e.keyCode) {\n    case KeyCode.DOWN:\n   \
  \   // move sprite down\n      break;\n    case KeyCode.UP:\n      // move sprite\
  \ up\n      break;\n    case KeyCode.F1:\n      // show help\n      break;\n  }\n\
  }\n```\n```\n\n该事件还有一个名为 `charCode` 的整数字符代码 getter。如果按键是特殊键，还可以使用 `e.ctrlKey`、`e.altKey`、`e.metaKey`、`e.ShiftKey`\
  \ 和 `e.altGraphKey` 进行测试：\n\n```\n```dart\nif (e.ctrlKey) return;\n```\n```\n\n\
  ### 更多内容\n\n用于键盘处理的 Dart 类试图最小化跨浏览器差异（通常与特殊键有关），并尽可能多地支持国际键盘布局。\n\n## 启用拖放\n\n想象一下开发一个棋盘游戏，玩家必须使用键盘移动棋子；这已经不可接受了。在\
  \ HTML5 之前，使用鼠标进行拖放是一项必须通过外部库（如 Dojo 或 jQuery）实现的功能。然而，HTML5 提供了原生浏览器支持，使网页上几乎每个元素都可拖动，从而允许更友好的\
  \ Web 应用程序。本教程向您展示如何使用 Dart 实现拖放（缩写为 DnD）。\n\n### 操作步骤\n\n运行 `drag_drop` 项目。结果是一个图像面板，如下面的截图所示，其中图像是可拖动的，您可以将一个图像与任何其他图像交换，如下面的截图所示：\n\
  \n![](img/52c05b53a56abd53584e4fed738ed509_671_0.png)\n\n拖放图像\n\n\n\n\n\n# 处理 Web\
  \ 应用程序\n\n执行以下步骤以启用拖放\n\n+   1. 我们想要拖放的元素必须在 HTML 中获得 `draggable` 属性，因此在 `drag_drop.html`\
  \ 中，我们对棋盘的 `<div>` 元素进行了如下指示：\n+   \n+   ```html\n+   <div id=\"tiles\">\n+    \
  \   <div id=\"tile1\" class=\"pict\" draggable=\"true\"></div>\n+           <div\
  \ id=\"tile2\" class=\"pict\" draggable=\"true\"></div>\n+           ...\n+    \
  \   </div>\n+   ```\n\n+   2. 在配套脚本 `drag_drop.dart` 中，我们创建一个类 `Drag nDrop`，以整合所有拖放事件处理。我们的所有\
  \ `<div>` 瓷砖都有 CSS 类 `pict`，因此被捕获在 `cols` 集合中。`main()` 函数创建一个对象 `dnd`，并在其上调用 `init()`\
  \ 方法：\n+   \n+   ```dart\n+   void main() {\n+       var dnd = new Drag nDrop();\n\
  +       dnd.init();\n+   }\n+   \n+   class Drag nDrop {\n+       Element dragSource;\n\
  +       Map tiles;\n+       var rand = new Random();\n+       var cols = document.querySelectorAll('.pict');\n\
  +       // ...\n+   }\n+   ```\n\n+   3. `init()` 函数在 `generateMap()` 中构造一个包含 img\
  \ 文件夹中图像的映射。它为我们的瓷砖设置所有 Dnd 事件的监听器，并且通过调用 `getRandomTile()`，图像通过 `style.setProperty`\
  \ 设置为瓷砖的背景图像：\n+   \n+   ```dart\n+   void init() {\n+       generateMap();\n+ \
  \      for (var col in cols) {\n+           col\n+               ..onDragStart.listen(_onDragStart)\n\
  +               ..onDragEnd.listen(_onDragEnd)\n+               ..onDragEnter.listen(_onDragEnter)\n\
  +               ..onDragOver.listen(_onDragOver)\n+               ..onDragLeave.listen(_onDragLeave)\n\
  +               ..onDrop.listen(_onDrop)\n+               ..style.setProperty(\"\
  background-image\", getRandomTile(),\n+                   \"\")\n+   ```\n\n```\n\
  ..style.setProperty(\"background-repeat\", \"no-repeat\", \"\")\n..style.setProperty(\"\
  background-position\", \"center\", \"\");\n}\n}\n\nvoid generateMap() {\n    tiles\
  \ = new Map();\n\n    for (var i = 1; i <= 9; i++) {\n        tiles[i] = \"url(img/tiles_0$i.jpg)\"\
  ;\n    }\n}\n\nString getRandomTile() {\n    var num = rand.nextInt(10);\n    var\
  \ imgUrl = tiles[num];\n    while (imgUrl == null) {\n        num = rand.nextInt(10);\n\
  \        imgUrl = tiles[num];\n    }\n    tiles.remove(num);\n    return imgUrl;\n\
  }\n```\n\n4. 每个 Dnd 事件处理程序的代码如下：\n\n```\nvoid _onDragStart(MouseEvent event) {\n\
  \    Element dragTarget = event.target;\n    dragTarget.classes.add('moving');\n\
  \    dragSource = dragTarget;\n    event.dataTransfer.effectAllowed = 'move';\n\
  \    // event.dataTransfer.setData('text/html', dragTarget.innerHtml);\n}\n\nvoid\
  \ _onDragEnd(MouseEvent event) {\n    Element dragTarget = event.target;\n    dragTarget.classes.remove('moving');\n\
  \    for (var col in cols) {\n        col.classes.remove('over');\n    }\n}\n\n\
  void _onDragEnter(MouseEvent event) {\n```\n\n+   - 数据负载是我们试图放置的内容\n+   - 目标元素是用于捕获放置或放置区域的区域，它接受用户试图放置的数据\n\
  \n几乎所有东西都可以启用拖动，包括图像、文件、链接或其他 DOM 节点。然而，并非所有元素都可以作为目标，例如图像，但我们的示例表明，很容易绕过这一点。\n\n\
  伴随拖放的视觉效果是通过 CSS 实现的。每个瓷砖都有 CSS 类 `pict`，其中包含属性 `cursor: move`，这为用户提供了视觉提示，表明某些东西可以移动。\n\
  \n当拖动操作开始时，会执行 `_onDragStart`，为我们的瓷砖添加 CSS 类 `moving`。该类可以在 `drag_drop.css` 中找到：\n\
  \n```\n.pict.moving {\n  opacity: 0.25;\n  -webkit-transform: scale(0.8);\n  -moz-transform:\
  \ scale(0.8);\n  -ms-transform: scale(0.8);\n  transform: scale(0.8);\n}\n```\n\n\
  我们看到不透明度降低到 0.25，大小按 0.8 的因子缩放，这正是我们在拖动操作开始时看到的效果。在本示例中我们不需要它，但如果拖动涉及 HTML 文本，`_onDragStart`\
  \ 应包含以下代码行：\n\n```\nevent.dataTransfer.setData('text/html', dragTarget.innerHtml);\n\
  ```\n\n前面的代码指示在拖放过程中将传输哪些数据。`dataTransfer` 属性是所有操作发生的地方；它存储在拖动操作中发送的数据片段。`dataTransfer`\
  \ 选项在 `DragStart` 事件中设置，并在 `Drop` 事件中读取/处理。调用 `e.dataTransfer.setData(format, data)`\
  \ 将设置对象的 MIME 类型内容，并将数据负载作为参数传递。\n\n当我们悬停在另一块瓷砖上时，会执行 `_onDragEnter` 函数；这会添加 CSS\
  \ 类 `over`，使边框线变为虚线：\n\n```\n.column.over {\n  border: 2px dashed #000;\n}\n```\n\
  \n最后，`_onDrop` 事件交换瓷砖图像。如果需要交换 HTML 文本，应添加以下行：\n\n```\ndragSource.innerHtml = dropTarget.innerHtml;\n\
  dropTarget.innerHtml = event.dataTransfer.getData('text/html');\n```\n\nEric Bidelman\
  \ 在 http://www.html5rocks.com/en/tutorials/dnd/basics/ 的文章是一个很好的资源，但它使用 JavaScript\
  \ 来解释 DnD 事件模型。为了更轻松地在 Dart 中使用 DnD，Marco Jakob 开发了可在 pub 上获取的库 dart-html5-dnd。有关这个不错的包的更多信息，请参阅\
  \ http://code.makery.ch/dart/html5-drag-and-drop/。DnD 功能也在 dart:svg 库中实现。\n\n##\
  \ 另请参阅\n\n+   - 请参阅本章中 *启用触摸事件* 的配方，了解如何使用触摸实现拖放\n\n## 启用触摸事件\n\n在没有连接鼠标的移动设备上，拖放非常方便；我们只有手指与屏幕交互。本配方将向您展示如何通过触摸事件为您的\
  \ Web 应用添加交互性。实现方法与上一配方非常相似。我们将重用拖放示例。\n\n### 如何操作...\n\n让我们按照以下步骤查看触摸项目：\n\n+ \
  \  1. 使用 touch.html 中的以下 <meta> 标签防止缩放：\n\n```\n<meta name=\"viewport\"\ncontent=\"\
  width=device-width, initial-scale=1.0, user-scalable=no\">\n```\n\n我们使用相同的 <div>\
  \ 结构，每个都具有 class = \"draggable\"，如上一配方所示。\n\n+   2. 在 touch.dart 中，我们创建一个类 Touch，用于包含特定于触摸事件的代码。创建一个对象\
  \ touch 并调用 init() 方法，该方法准备棋盘（每个瓷砖获得不同的背景图像）并将触摸事件绑定到事件处理程序：\n\n```\nvoid main()\
  \ {\n  var touch = new Touch();\n  touch.init();\n}\n\nclass Touch {\n```\n\n```\n\
  Element dragSource;\nMap tiles;\nvar rand = new Random();\nvar cols = document.querySelectorAll('.pict');\n\
