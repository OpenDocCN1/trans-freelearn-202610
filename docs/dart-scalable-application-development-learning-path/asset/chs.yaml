  \n## Scheduling tasks using Futures\n\nDart VM 是单线程的，因此应用程序的所有代码都在一个线程中运行，也称为主 isolate。这是因为\
  \ `main()` 是 Dart 代码开始执行 isolate 的函数，因为 Dart 的并发模型基于作为独立进程的 isolate 之间交换消息。我们将在接下来的配方中深入讨论\
  \ isolate，但如果你的代码没有启动新的 isolate，则所有代码都在一个 isolate 中运行。但是，在这个 isolate 中，你可以同时运行大量异步代码片段（我们称之为任务）；它们以什么顺序执行，我们能否影响该顺序？事实证明，更好地理解\
  \ Dart 的事件循环和任务排队机制使我们能够做到这一点。本配方将阐明 Dart 的调度机制，并为任务的有序执行提供提示和建议。\n\n### How to\
  \ do it...\n\n查看程序 `tasks_scheduling.dart`（任务按连续编号并按启动顺序编号）：\n\n```dart\nimport\
  \ 'dart:async';\n\nmain() {\n  print('1) main task #1');\n  scheduleMicrotask(()\
  \ => print('2) microtask #1'));\n  new Future.delayed(new Duration(seconds: 1),\n\
  \      () => print('3) future #1 (delayed)'));\n  new Future(() => print('4) future\
  \ #2'));\n  print('5) main task #2');\n  scheduleMicrotask(() => print('6) microtask\
  \ #2'));\n  new Future(() => print('7) future #3'))\n    .then((_) => print('8)\
  \ future #4'))\n    .then((_) => print('9) future #5'))\n    .whenComplete(cleanup);\n\
  \  scheduleMicrotask(() => print('11) microtask #3'));\n  print('12) main task #3');\n\
  }\n\ncleanup() {\n  print('10) whenComplete #6');\n}\n```\n\n以下屏幕截图显示了程序的输出，其顺序在下一节中解释：\n\
  \n```text\n1) main task #1\n5) main task #2\n12) main task #3\n2) microtask #1\n\
  6) microtask #2\n11) microtask #3\n4) future #2\n7) future #3\n8) future #4\n9)\
  \ future #5\n10) whenComplete #6\n3) future #1 (delayed)\n```\n\n### How it works...\n\
  \n主 isolate 按如下方式进行：\n\n1. 首先按行逐行同步执行 `main()` 中的代码。\n2. 然后事件循环机制启动，它按以下顺序查看系统中的两个队列：\n\
  \   - 首先，它查看微任务队列。此队列用于需要在事件队列之前执行的所有任务，例如在 DOM 开始渲染修改后的屏幕之前必须内部完成的变化。此队列中的所有任务在进入下一步之前都会被执行。\n\
  \   - 然后，处理事件队列。这里安排了所有外部事件的任务，例如鼠标事件、绘制事件、I/O、Dart isolate 之间的消息等。当然，在每个队列中，任务都按先进先出顺序逐一处理。\n\
  \n> 在事件循环处理微任务队列时，事件队列不会被处理，因此应用程序无法绘制或响应用户事件，看起来实际上被阻塞了。因此，请尽可能保持微任务队列尽可能短。最好将你的任务放在事件队列上。\n\
  \n原则上，当两个队列都为空时，应用程序可以退出。任务（这些是要稍后异步运行的代码片段）可以使用来自 `dart:async` 的以下类和方法进行调度：\n\n\
  1. 使用函数创建一个新的 `Future` 对象以执行；这会附加到事件队列。\n2. 使用 `Future.delayed`，你可以指定在特定持续时间后执行函数；这也进入事件队列。\n\
  3. 调用顶级 `scheduleMicrotask()` 函数，该函数将项目附加到微任务队列。\n\n> 不要使用 `Timer` 类来调度任务；此类没有捕获异常的设施，因此计时器任务中的错误会使你的应用程序崩溃。\n\
  \n在 `then` 语句系列中链接 Futures 有效地确保它们按该顺序执行（参见上一配方步骤 1）。此外，`whenComplete` 子句将在所有之前的\
  \ `then` 语句之后立即执行。\n\n因此执行顺序是：`main()`，然后是微任务队列，然后是事件队列，然后是延迟任务。\n\n> 作为一般最佳实践，不要将计算密集型任务放在任一队列上，而是在单独的\
  \ isolate 中创建该任务（或 Web 应用程序的工作线程）。\n\n### See also\n\n- 查看本章中关于 isolate 的后续配方，例如\
  \ *Using isolates in web apps* 和 *Using multiple cores with isolates*\n\n## Running\
  \ a recurring function\n\n假设你的代码需要以一定的间隔定期运行某个函数。本配方展示了如何非常轻松地做到这一点。\n\n### How\
  \ to do it...\n\n查看以下 `recurring_function.dart` 的代码：\n\n```dart\nimport 'dart:async';\n\
  var count = 0;\n```\n\n\n\n\n```\nconst TIMEOUT = const Duration(seconds: 5);\n\
  const MS = const Duration(milliseconds: 1);\n\nvoid main() {\n  // 1. Running a\
  \ function repeatedly:\n  const PERIOD = const Duration(seconds:2);\n  newTimer.periodic(PERIOD,\
  \ repeatMe);\n  // 3. Running a function once after some time:\n  const AFTER70MS\
  \ = const Duration(milliseconds:70);\n  new Timer(AFTER70MS, () => print('this was\
  \ quick!'));\n  // 4. Running a function asap:\n  Timer.run(() => print('I ran asap!'));\n\
  \  // 5. Calculating a period and provoking a timeout:\n  startTimeout(500);\n}\n\
  \nrepeatMe(Timer t) {\n  print(\"I have a repetetive job, and I'm active is ${t.isActive}!\"\
  );\n  count++;\n  // 2. Stop the repetition:\n  if (count==4 &&t.isActive) {\n \
  \   t.cancel();\n    print(\"I'm active is ${t.isActive} now\");\n  }\n}\n\nstartTimeout([int\
  \ variableMS ]) {\n  var duration = variableMS == null ? TIMEOUT : MS * variableMS;\n\
  \  return new Timer(duration, handleTimeout);\n}\n\nhandleTimeout() {\n  print('I\
  \ was timed out!');\n}\n```\n\nThe following is the output from this code; if you\
  \ need help figuring out the order, read the next section:\n\n**I ran asap!**\n\n\
  **this was quick!**\n\n**I was timed out!**\n\n**I have a repetetive job, and I'm\
  \ active is true!**\n\nI have a repetitive job, and I'm active is true!\n\nI have\
  \ a repetitive job, and I'm active is true!\n\nI have a repetitive job, and I'm\
  \ active is true!\n\nI'm active is false now\n\n## How it works...\n\nThe `Timer`\
  \ class from `dart:async` gives us this functionality through the `periodic` named\
  \ constructor as shown in comment 1. This takes two arguments, a `Duration` object\
  \ and a function (here `repeatMe`) to run, which has the timer as the single parameter.\
  \ This comes in handy to stop the repetition, which is shown in comment 2 with the\
  \ `cancel()` method after 4 repetitions. The `isActive` property can be used to\
  \ test whether the repetition is still going on. Comment 3 shows how to run a function\
  \ only once after a time interval; just use the normal `Timer` constructor with\
  \ the same arguments, but the callback doesn't have a `Timer` parameter. To run\
  \ a function as soon as the event-loop mechanism permits, use the static `run` method\
  \ as shown in comment 4. A negative or zero duration is equivalent to calling `run`.\
  \ Comment 5 shows that a `Timer` class can also be useful to stop a running function\
  \ or even the entire app.\n\n## There's more...\n\nThe durations or periods don't\
  \ have to be constant from the start; they can be calculated before starting the\
  \ `Timer`. Timers can also be used in web applications, but for drawing purposes,\
  \ use `window.animationFrame`. When your app is compiled to JavaScript, the finest\
  \ time granularity that the browser can give you is 4 milliseconds.\n\n## See also\n\
  \n- Refer to the *Writing a game-loop* recipe in this chapter for more information\
  \ on `window.animationFrame`\n- Refer to the *Exiting from an app* recipe in *Chapter\
  \ 2, Structuring, Testing, and Deploying an Application*, for other alternatives\
  \ to stop a running app\n\n## Using isolates in the Dart VM\n\nDart code runs in\
  \ a single thread, in what is called a single process or isolate. In the standalone\
  \ Dart VM, all code starts from `main()` and is executed in the so-called `root`\
  \ isolate. To make an app more responsive or to increase its performance, you can\
  \ assign parts of the code to other isolates. Moreover, because there are no shared\
  \ resources between isolates, isolating third-party code increases the application's\
  \ overall security. A Dart server app or command-line app can run part of its code\
  \ concurrently by creating multiple isolates. If the app runs on a machine with\
  \ more than one core or processor, it means these isolates can run truly in parallel.\
  \ When the root isolate terminates the Dart VM exits and, with it, all isolates\
  \ that are still running. Dart web apps currently can't create additional isolates,\
  \ but they can create workers by adding instances of the `dart:html Worker` class,\
  \ thereby adding JavaScript Web workers to the web app. In this recipe, we show\
  \ you how to start up a new isolate from the main isolate and how to communicate\
  \ with it using ports.\n\n## How to do it...\n\nExamine the code in `using_spawn.dart`\
  \ to create isolates with `spawn`, as shown in the following code:\n\n```\nimport\
  \ 'dart:async';\nimport 'dart:isolate';\n\nmain() {\n  // 1- make a ReceivePort\
  \ for the main isolate:\n  var recv = new ReceivePort();\n  // 2- spawn a new isolate\
  \ that runs the code from the echo\n  // function\n  // and pass it a sendPort to\
  \ send messages to the main isolate\n  Future<Isolate> remote = Isolate.spawn(echo,\
  \ recv.sendPort);\n  // 3- when the isolate is spawned (then), take the first message\n\
  \  remote.then((_) => recv.first).then((sendPort) {\n    // 4- send a message to\
  \ the isolate:\n    sendReceive(sendPort, \"Do you hear me?\").then((msg) {\n  \
  \    // 5- listen and print the answer from the isolate\n      print(\"MAIN: received\
  \ $msg\");\n      // 6- send signal to end isolate:\n      return sendReceive(sendPort,\
  \ \"END\");\n    }).catchError((e) => print('Error in spawning isolate $e'));\n\
  \  });\n}\n\n// the spawned isolate:\n```\n\n```\n```dart\nvoid echo(sender) {\n\
  \  // 7- make a ReceivePort for the 2nd isolate:\n  var port = new ReceivePort();\n\
  \  // 8- send its sendPort to main isolate:\n  sender.send(port.sendPort);\n  //\
  \ 9- listen to messages\n  port.listen((msg) {\n    var data = msg[0];\n    print(\"\
  ISOL: received $msg\");\n    SendPort replyTo = msg[1];\n    replyTo.send('Yes I\
  \ hear you: $msg, echoed from spawned isolate');\n    // 10- received END signal,\
  \ close the ReceivePort to save\n    // resources:\n    if (data == \"END\") {\n\
  \      print('ISOL: my receivePort will be closed');\n      port.close();\n    }\n\
  \  });\n}\n\nFuture sendReceive(SendPort port, msg) {\n  ReceivePort recv = new\
  \ ReceivePort();\n  port.send([msg, recv.sendPort]);\n  return recv.first;\n}\n\
  ```\n```\n\nThis script produces the following output:\n\n**ISOL: received [Do you\
  \ hear me?,SendPort]**\n\n**MAIN: received Yes I hear you: [Do you hear me?,SendPort],\
  \ echoed from spawned isolate**\n\n**ISOL: received [END, SendPort]**\n\n**ISOL:\
  \ my receivePort will be closed**\n\nFrom the output, we see that the main isolate\
  \ receives its message echoed back from the second isolate. Examine the code in\
  \ `using_spawnuri.dart` to create isolates with `spawnUri`:\n\n```\n```dart\nimport\
  \ 'dart:async';\nimport 'dart:isolate';\n\nmain() {\n  var recv = new ReceivePort();\n\
  \  Future<Isolate> remote =\n```\n\n```\nIsolate.spawnUri(Uri.parse(\"echo.dart\"\
  ),\n[\"Do you hear me?\"], recv.sendPort);\nremote.then((_) =>recv.first).then((msg)\
  \ {\nprint(\"MAIN: received $msg\");\n});\n}\n```\n\nThe following is the code from\
  \ echo.dart:\n\n```\nimport 'dart:isolate';\n\nvoid main(List<String>args, SendPort\
  \ replyTo) {\n  replyTo.send(args[0]);\n}\n```\n\nThe following is the output:\n\
  \n**MAIN: received Do you hear me?**\n\n## How it works...\n\nIsolates are defined\
  \ in their own library called dart:isolate. They conform to the well-known actor-model:\
  \ they are like separate little applications that only communicate with each other\
  \ by passing asynchronous messages back and forth; in no way can they share variables\
  \ in memory. The messages get received in the order in which you send them. Each\
  \ isolate has its own heap, which means that all values in memory, including global\
  \ variables, are available only to that isolate. Sending messages, which comes down\
  \ to serializing objects across isolates, has to obey certain restrictions. The\
  \ messages can contain only the following things:\n\n- Primitive values (null, bool,\
  \ num, double, and String)\n- Instances of SendPort\n- Lists and maps whose elements\
  \ are any of these\n\nWhen isolates are created via spawn, they are running in the\
  \ same process, and then it is also possible to send objects that are copied (currently\
  \ only in the Dart VM).\n\nAn isolate has one ReceivePort to receive messages (containing\
  \ data) on; it can listen to messages. Calling the sendport getter on this port\
  \ returns SendPort. All messages sent through SendPort are delivered to the ReceivePort\
  \ they were created from. On SendPort, you use the send method to send messages;\
  \ a ReceivePort uses the listen method to capture these messages.\n\nFor each ReceivePort\
  \ port there can be many SendPort. A ReceivePort is meant to live for as long as\
  \ there is communication, don't create a new one for every message. Because Dart\
  \ does not have cross-isolate garbage collection, ReceivePort is not automatically\
  \ garbage-collected when nobody sends messages to them anymore.\n\n\n\n\n\nIsolates\
  \ 开始时通过交换 SendPort 来实现通信。两种方法都返回一个包含 isolate 的 Future，或者类型为 IsolateSpawnException\
  \ 的错误，必须捕获。这可以通过链式调用 catchError 子句或使用 spawn 的可选 onError 参数来完成。然而，在已启动的 isolate 中发生的错误无法被主\
  \ isolate 捕获，这很合理，因为两者都是独立执行的代码集。你可以通过运行 isolates_errors.dart 来自行验证。使用 spawn 和 spawnUri\
  \ 时请注意以下限制：\n\n- Spawn 在服务器应用中有效，但在 Dart Web 应用中无效。浏览器的主 isolate，DOM isolate，不允许这样做。这是为了防止对\
  \ DOM 的并发访问。\n- 然而，spawnUri 在 Dart Web 应用和服务器应用中都有效，并且由此产生的 isolate 本身也可以启动其他 isolate。Dart\
  \ VM 将这些 isolate 转换为 Web Worker（请参阅 http://www.html5rocks.com/en/tutorials/workers/basics/）。\n\
  \n### There's more....\n\n因此，如果你需要在应用内运行一个计算密集型任务，为了保持应用的响应性，你应该将该任务放入自己的 isolate\
  \ 或 worker 中。如果有许多此类任务，那么应该部署多少个 isolate？一般来说，当任务是计算密集型时，你应该使用与预期可用的核心或处理器数量一样多的\
  \ isolate。纯计算的额外 isolate 是冗余的。但如果其中一些还执行异步调用（例如 I/O），那么它们不会使用太多处理器时间。在这种情况下，拥有比处理器更多的\
  \ isolate 是有意义的；一切都取决于你的应用架构。在极端情况下，你可以为每个功能使用一个单独的 isolate，或确保数据不被共享。\n\n![](img/52c05b53a56abd53584e4fed738ed509_770_0.png)\n\
  \n> 始终对你的应用进行基准测试，以检查 isolate 数量是否已针对任务进行了优化。你可以按如下方式进行：在 Run Manage Launches 工具中，勾选\
  \ VM 设置中的选项，pause isolate on start，以及 pause isolate on exit。然后，通过 Dart Editor 左侧的图像按钮打开\
  \ observatory 工具到终止的红色方块，在那里你可以找到有关分配和性能的有趣信息。\n\n![](img/52c05b53a56abd53584e4fed738ed509_771_0.png)\n\
  \n如第二个示例所示，`spawnUri` 提供了一种在运行时动态加载和执行代码（甚至可能是整个库）的方法。不要混淆 Futures 和 isolates；它们是不同的，并且应用方式也不同。\n\
  \n- Isolate 用于你希望某些代码真正并行运行的情况，例如一个迷你程序与你的主程序分开运行。你向 isolate 发送消息，并且可以从 isolate\
  \ 接收消息。每个 isolate 都有自己的事件循环。\n- Future 用于你希望在事件循环中稍后某个值可用时得到通知的情况。仅仅要求 Future 运行一个函数并不会使该函数并行运行。它只是将函数安排到事件循环中以便在稍后时间运行。\n\
  \n目前，isolates 在 Erlang 进程的意义上并不非常轻量级，在 Erlang 中，每个进程仅消耗少量内存（数量级为 Kb）。将 isolates\
  \ 演进到这一理想状态是 Dart 团队的长期目标。此外，isolates 内的异常处理和调试有点粗糙或困难；预计这种情况会改变。isolates 如何映射到操作系统实体（如线程或进程）也没有指定；这可能取决于环境和平台。isolates\
  \ 尚未扩展到跨 VM 通信。\n\n> 当服务器上运行两个 Dart VM 时，最好使用 TCP sockets 进行通信。你可以启动 ServerSocket\
  \ 来监听传入请求，并使用 Socket 连接到另一台服务器。\n\n### See also\n\n- 请参阅 *Using isolates in web\
  \ apps* 配方，了解另一个使用 `spawnUri` 的示例。在 *Using multiple cores with isolates* 配方中可以找到另一个\
  \ isolates 的示例。\n- 请参阅下一章的 *Using Sockets* 配方，了解有关 `Sockets` 和 `ServerSockets` 的更多信息。\n\
  - 请参阅 *Chapter 2, Structuring, Testing, and Deploying an Application* 中的 *Profiling\
  \ and benchmarking your app* 配方，了解有关基准测试的更多信息。\n\n## Using isolates in web apps\n\
  \n在本配方中，你将学习如何在项目 `using_web_isolates` 的 Web 应用中使用 isolates。此示例在嵌入浏览器的 Dart VM 中运行，以及编译为\
  \ JavaScript。在后一种情况下，它使用 HTML5 Web workers，在后台独立于其他脚本运行，而不影响页面的性能。\n\n### How to\
  \ do it...\n\n`using_web_isolates.dart` 中的主 isolate 运行以下代码：\n\n```dart\nimport 'dart:isolate';\n\
  import 'dart:html';\nimport 'dart:async';\n\nmain() {\n  Element output = querySelector('#output');\n\
  \  SendPort sendPort;\n  ReceivePort receivePort = new ReceivePort();\n  receivePort.listen((msg)\
  \ {\n    if (sendPort == null) {\n      sendPort = msg;\n    } else {\n      output.text\
  \ += 'Received from isolate: $msg\\n';\n    }\n  });\n\n  String workerUri = 'worker.dart';\n\
  \  int counter = 0;\n  // start 3 isolates:\n  for (int i = 1; i <= 3; i++) {\n\
  \    Isolate.spawnUri(Uri.parse(workerUri), [], receivePort.sendPort).\n      then((isolate)\
  \ {\n        print('isolate spawned');\n        new Timer.periodic(const Duration(seconds:\
  \ 1), (t) {\n          sendPort.send('From main app: ${counter++}');\n         \
  \ if (counter == 10) {\n            sendPort.send('END');\n            t.cancel();\n\
  \          }\n        });\n      });\n  }\n}\n```\n\n以下是 isolate worker.dart 的代码：\n\
  \n```dart\nimport 'dart:isolate';\n\nmain(List<String> args, SendPort sendPort)\
  \ {\n  ReceivePort receivePort = new ReceivePort();\n  sendPort.send(receivePort.sendPort);\n\
  \n  receivePort.listen((msg) {\n    if (msg == 'END') receivePort.close();\n   \
  \ sendPort.send('ECHO: $msg');\n  });\n}\n```\n\n以下是 Web 页面上显示的输出：\n\n![](img/52c05b53a56abd53584e4fed738ed509_774_0.png)\n\
  \nIsolates in a web app\n\n我们看到来自三个 isolates 的消息传入。在计数到 10 时，计时器停止，并且 isolates 收到关闭消息。\n\
  \n### How it works...\n\n主 isolate 首先设置一个 ReceivePort 和对 isolates 的监听器。此监听器首先捕获\
  \ isolate 的 sendPort，然后将每条消息附加到 Web 页面上。Web 应用中的 isolate 必须使用 spawnUri 启动；代码位于脚本\
  \ worker.dart 中。然后根 isolate 启动一个计时器，并每秒发送已过去的秒数。10 秒后，计时器被取消，并发送 END 消息。\n\n我们启动了三个\
  \ isolate，每个都执行相同的代码。isolates 代码中的 main 方法将其第一个参数接收为 List<String> args。这来自 spawnUri\
  \ 的第二个参数；这是主 isolate 向 isolate 发送初始数据的一种方式，但这里它是空列表。每个 isolate 首先设置其 ReceivePort，并将其\
  \ sendPort 发送给主 isolate，以便建立通信线路。然后，它开始监听并回显收到的内容。isolate 在收到 END 消息时退出。使用 dart2js\
  \ 编译为 JavaScript 时，.js 会自动添加到脚本名称 worker.dart 的末尾。\n\n### See also\n\n- 请参阅 Using\
  \ isolates in the Dart VM 配方，了解有关 isolates 的一般解释。\n\n## Using multiple cores with\
  \ isolates\n\n在本配方中，我们向你展示 Dart VM 在无需向 VM 指定任何内容的情况下使用处理器上的多个核心。这比 Dart 应用只能使用一个处理器时能提供更好的性能和吞吐量。\n\
  \n### How to do it...\n\n查看以下项目 using_isolates 中 many_cores.dart 的代码：\n\n```dart\n\
  import 'dart:isolate';\n\nmain() {\n  int counter = 0;\n  ReceivePort receivePort\
  \ = new ReceivePort();\n  receivePort.listen((msg) {\n    if (msg is SendPort) {\n\
  \      msg.send(counter++);\n    } else {\n      print(msg);\n    }\n  });\n\n \
  \ // starting isolates:\n  for (var i = 0; i < 5; i++) {\n    Isolate.spawn(runInIsolate,\
  \ receivePort.sendPort);\n  }\n}\n\n// code to run isolates\nrunInIsolate(SendPort\
  \ sendPort) {\n  ReceivePort receivePort = new ReceivePort();\n  // send own sendPort\
  \ to main isolate:\n  sendPort.send(receivePort.sendPort);\n\n  receivePort.listen((msg)\
  \ {\n    var k = 0;\n    var max = (5 - msg) * 50000000;\n    for (var i = 0; i\
  \ < max; ++i) {\n      i = ++i - 1;\n      k = i;\n    }\n  }\n}\n```\n\n\n\n\n\
  ## 使用 Future、任务与 Isolate\n\n```\nsendPort.send(\"I received: $msg and calculated\
  \ $k\");\n});\n}\n```\n\n过了一段时间后，计算结果如下所示：\n\n**我收到：4 并计算出 499999999**\n\n**我收到：3\
  \ 并计算出 999999999**\n\n**我收到：2 并计算出 1499999999**\n\n**我收到：1 并计算出 1999999999**\n\n\
  **我收到：0 并计算出 2499999999**\n\n以下是在一台八核机器上 CPU 活动情况的截图。可以清楚地看到，有四个核心正忙于运行与前文 for 循环中派生的四个\
  \ isolate 对应的 isolate：\n\n![](img/52c05b53a56abd53584e4fed738ed509_776_0.png)\n\n\
  使用 isolate 进行多核处理\n\n### 工作原理...\n\n主 isolate 和其他 isolate 做的第一件事是创建自己的 ReceivePort。这些\
  \ isolate 运行 runInIsolate 中的代码，并获取用于发送结果的端口。请看以下命令：\n\n```\nIsolate.spawn(runInIsolate,\
  \ receivePort.sendPort);\n```\n\n这些 isolate 将自己`sendPort`发送给`main`。主 isolate 在其端口上监听；当它收到`sendPort`时，它向该\
  \ isolate 发送一个整数计数器：\n\n```\nif (msg is SendPort) {\n  msg.send(counter++);\n  //\
  \ other code\n}\n```\n\n这些 isolate 会持续监听，直到收到计数器值，然后开始长时间运行的计算。计算完成后，结果被发送到根 isolate\
  \ 并显示出来。程序永远不会停止，因为 `main` 中的 `ReceivePort` 从未被关闭。\n\n## 使用 Worker Task 框架\n\n`isolate`\
  \ 库只为我们提供了底层的基本构建模块，因此在真实的应用环境中使用 isolate 可能会很有挑战性。正是为此目的，Diego Rocha 开发了 worker\
  \ 并发任务执行器框架，可通过 pub 包管理器获取。它旨在抽象所有 isolate 管理和消息传递，使 Dart 中的并发尽可能简单。Worker 还内置了错误处理，因此你也无需担心这方面。本小节将展示如何使用此框架，以便你可以专注于更高级别的应用程序细节。\n\
  \n### 操作步骤...\n\n在项目 `using_worker` 中，你可以找到多个程序（`using_worker1` 到 `using_worker4`），它们演示了此框架的用法。脚本\
  \ `using_worker.dart` 演示了主要步骤，即创建任务、创建 worker、将任务交给 worker 并处理结果：\n\n```\nimport\
  \ 'package:worker/worker.dart';\n\nWorker worker;\n\nvoid main() {\n  // 1- Make\
  \ a Task object:\n  Task task = new HeavyTask();\n  // 2- Construct a Worker object:\n\
  \  worker = new Worker();\n  // specifying poolSize and spawning lazy isolates or\
  \ not:\n  // worker = new Worker(poolSize: noIsol, spawnLazily: false);\n  // 3-\
  \ Give a task to the worker\n  // 4- when the results return, process them\n  worker.handle(task).then(processResult);\n\
  }\n\n// 5- Task custom class must implement Task interface\nclass HeavyTask implements\
  \ Task {\n  execute() {\n    return longRunningComputation();\n  }\n\n  bool longRunningComputation()\
  \ {\n    var stopWatch = new Stopwatch();\n    stopWatch.start();\n    while (stopWatch.elapsedMilliseconds\
  \ < 1000);\n    stopWatch.stop();\n    return true;\n  }\n}\n\nprocessResult(result)\
  \ {\n  print(result);\n  // process result\n  // 4- Close the worker object(s)\n\
  \  worker.close();\n}\n```\n\n### 工作原理...\n\n首先，将包 `worker` 添加到 `pubspec.yaml`，并在代码中导入它。任务（Task）是需要执行的事情。它是库中的一个抽象类，为任务提供接口，并规定你的自定义\
  \ Task 类必须实现 `execute` 方法，该方法返回一个结果。在我们的脚本中，自定义 Task 是 `HeavyTask`，`execute` 使用\
  \ `Stopwatch` 类模拟长时间运行的计算。\n\nworker 对象会创建并管理一个包含若干（`poolSize` 个）isolate 的池子，为你提供一种并发执行阻塞任务的简便方式。它会在需要执行任务时惰性派生\
  \ isolate；这些派生出的 isolate 存在于名为 `isolates` 的队列中。当前活跃的 isolate 存储在名为 `workingIsolates`\
  \ 的可迭代对象中，而空闲的 isolate 可以从名为 `availableIsolates` 的可迭代对象中获取。\n\n用 isolate 的语言来说，会发生以下情况：当创建一个\
  \ `Worker` 实例时，它会开始监听当前 isolate 的 `ReceivePort`，并创建一个 isolate 池。该池中的 isolate 用于处理交给\
  \ worker 的任何任务。当任务被交给 worker 处理时，它会返回一个 `Future`。这个 `Future` 只有在任务执行完成或执行失败时才会完成。\n"
- "## 9 使用数据库\n\n在本章中，我们将介绍以下小节：\n\n- 使用 IndexedDB 在本地存储数据\n- 使用 Lawndart 编写离线 Web\
  \ 应用\n- 在 MySQL 中存储数据\n- 在 PostgreSQL 中存储数据\n- 在 Oracle 中存储数据\n- 在 MongoDB 中存储数据\n\
  - 在 RethinkDB 中存储数据\n\n### 简介\n\n数据之于应用，就像食物之于人；没有数据，应用就毫无意义。此外，数据必须持久化；数据可以存储在客户端、服务器端，或两端都存。在客户端，我们介绍\
  \ IndexedDB 和 Lawndart 数据管理器，它们提供离线数据存储，无需担心 IndexedDB 是否受支持。然后，我们研究如何将数据存储在服务器端的\
  \ SQL 和 NoSQL 数据库系统中。到本章结束时，你将拥有一系列广泛的选择，来决定将应用数据存储到哪个数据库。\n\n### 使用 IndexedDB 在本地存储数据\n\
  \n```\nimport 'dart:indexed_db';\nimport 'job.dart';\n\nclass JobStore {\n  static\
  \ const String JOB_STORE = 'jobStore';\n  static const String TYPE_INDEX = 'type_index';\n\
  \  Database _db;\n  final List<Job> jobs = new List();\n\n  Future openDB() {\n\
  \    return window.indexedDB\n      .open('JobDB', version: 1, onUpgradeNeeded:\
  \ _initDb)\n      .then(_loadDB)\n      .catchError(print);\n  }\n\n  void _initDb(VersionChangeEvent\
  \ e) {\n    _db = (e.target as Request).result;\n    var store = _db.createObjectStore(JOB_STORE,\
  \ autoIncrement: true);\n    store.createIndex(TYPE_INDEX, 'type', unique: false);\n\
  \  }\n\n  Future add(Job job) {\n    // create transaction and get object store:\n\
  \    var trans = _db.transaction(JOB_STORE, 'readwrite');\n    var store = trans.objectStore(JOB_STORE);\n\
  \    store.add(job.toMap())\n    // called when add completes\n    .then((addedKey)\
  \ {\n      print(addedKey);\n      job.dbKey = addedKey;\n    });\n    return trans.completed.then((_)\
  \ {\n      // called when transaction completes\n      jobs.add(job);\n      return\
  \ job;\n    });\n  }\n\n  Future _loadDB(Database db) {\n    _db = db;\n    var\
  \ trans = db.transaction(JOB_STORE, 'readonly');\n    var store = trans.objectStore(JOB_STORE);\n\
  ```\n\n以下是截图以及 Chrome 开发者工具中 IndexedDB 数据库的视图：\n\n![](img/52c05b53a56abd53584e4fed738ed509_785_0.png)\n\
  \n### 工作原理...\n\n与 IndexedDB 的交互是在 `dart:indexed_db` 库中实现的，因此我们需要在任何需要的地方导入它。测试浏览器是否能在\
  \ IndexedDB 中存储数据总是个好主意。要判断是否支持 IndexedDB，可以使用 `IdbFactory` 类的 `supported` getter。与\
  \ IndexedDB 的所有交互都是异步的，并返回 `Future`。\n\n如第二个注释所示，调用了 `openDB()`。`window.indexedDB.open`\
  \ 方法用于打开或创建新数据库。如果给定的数据库名称和版本已存在，则会打开该数据库。对于新的数据库名称或更高的版本号，会触发 `upgrade needed`\
  \ 事件。在其事件处理器中，会在 `JobDB` 数据库内为 `Job` 类型创建一个对象存储（object store），记录会自动递增键。我们还展示了如何使用\
  \ `createIndex` 方法在对象存储中基于 `Job` 类的 `type` 字段创建索引。IndexedDB 数据库可以包含多个对象存储，每个存储可以有多个索引。使用\
  \ `.catchError` 处理打开数据库时可能出现的错误非常重要。我们还保留了一个核心的 `Database` 对象 `_db`，供数据库方法使用。\n\n\
  \n\n\n\n一个常见的场景是，将某个存储中的所有记录都读入应用，以便在打开数据库后显示它们。这是在 _loadDB 中完成的。如果我们查看其他方法（add、update、remove\
  \ 和 clear），我们会看到一个共同的模式，即所有数据库操作都必须在 Transaction 对象内执行。它以 object store 名称 JOB_STORE\
  \ 和某种模式（如 readonly 或 readwrite）作为参数进行检索。读取多条记录，例如在 _loadDB 中，是通过打开游标然后监听它（使用 listen）来实现的。每次\
  \ listen 事件都通过 cursor.value 读取一条新记录，该记录被转换为 Job 对象并添加到列表中。\n\n要存储的对象必须以 map 格式提供给存储的\
  \ add 方法。当为此存储将 autoincrement 设置为 true 时，生成的键号将作为 addedKey 返回。当事务完成（trans.completed.then）时，我们将新创建的\
  \ job 添加到我们的列表中。update、remove 和 clear 方法遵循相同的模式，它们分别在 object store 中调用 put、delete\
  \ 和 clear 方法。\n\n## See also\n\n- 如果你想将本地存储与 IndexedDB 进行比较，请参阅第 5 章 Handling Web\
  \ Applications 中的 Using Browser Local Storage 配方\n\n## Using Lawndart to write offline\
  \ web apps\n\n如果主要要求是你的应用可以脱机工作，提供通用的离线键值存储，无论客户端浏览器是否支持 IndexedDB 还是不支持？那么，Lawndart\
  \ 就来救援了。\n\nLawndart（https://github.com/sethladd/lawndart, 但可通过 pub 包获取）并不是一个新数据库，而是一个管理器，它会自动选择客户端上可用的最佳本地存储机制。它由\
  \ Seth Ladd 开发，是 Lawnchair（http://brian.io/lawnchair/）的 Dart 重写版。你可以在项目 using_lawndart\
  \ 中看到它的实际效果。\n\n## How to do it...\n\n通过在 pubspec.yaml 文件中添加 lawndart:any 来导入 Lawndart\
  \ 包。以下内容来自启动脚本 using_lawndart.dart 的相关代码：\n\n```\nvoid main() {\n  js = new JobStore();\n\
  \  // 1- creating and opening the database:\n```\n```\n```dart\njs.open();\nquerySelector(\"\
  #store\").onClick.listen(storeData);\n}\n\nstoreData(Event e) {\n  var job = _jobData();\n\
  \  // 2- writing data to storage\n  js.add(job);\n}\n```\n```\n\n数据库特定的代码被隔离在 jobstore_lawndart.dart\
  \ 中：\n\n```\n```dart\nlibrary store;\n\nimport 'dart:async';\nimport 'package:lawndart/lawndart.dart';\n\
  import 'job.dart';\n\nclass JobStore {\n  static const String JOB_DB = 'jobDb';\n\
  \  static const String JOB_STORE = 'jobStore';\n  final List<Job> jobs = new List();\n\
  \  // 3- making a Store object:\n  var _store = new Store(JOB_DB, JOB_STORE);\n\n\
  \  Future open() {\n    // 4- opening storage and retrieving all records:\n    return\
  \ _store.open().then(_loadDB).catchError(print);\n  }\n\n  _loadDB(_) {\n    Stream\
  \ dataStream = _store.all();\n    return dataStream.forEach((dbjob) {\n      var\
  \ job = new Job.fromJson(dbjob);\n      jobs.add(job);\n    });\n  }\n\n  add(Job\
  \ job) {\n    // 5- storing data:\n    _store.save(job.toMap(), job.dbKey.toString()).then((addedKey)\
  \ {\n      jobs.add(job);\n    });\n  }\n}\n```\n```\n\n```\nFuture update(Job job)\
  \ {\n  return _store.save(job.toMap(), job.dbKey.toString());\n}\n\nFuture remove(Job\
  \ job) {\nreturn _store.removeByKey(job.dbKey.toString());\n}\n\nclear() {\n  _store.nuke().then((_)\
  \ {\n    jobs.clear();\n  });\n}\n```\n\n## How it works...\n\nLawndart 为本地存储、IndexedDB\
  \ 和 Web SQL 提供异步但一致的接口。你的应用只需使用 Store 类的实例工作，工厂构造函数将尝试 IndexedDB、Web SQL，最后是本地存储。这在第三条注释中显示，其中创建了\
  \ Store 类的对象；该对象还构建了所需的本地数据库。在第一条注释中，JobStore 对象中的 open 方法触发 Store 对象上的 open 方法（第四条注释）。_loadDB\
  \ 选项随后读取整个存储；这是通过 all 方法实现的，该方法返回 Stream of values。添加和更新数据是通过在存储对象上调用 save 方法完成的（第五条\
  \ 5）。删除记录是通过 removeByKey 完成的；清除整个数据库需要 nuke 方法。请注意，使用 Lawndart 的代码比上一配方中显示的 IndexedDB\
  \ 要干净得多。\n\n## See also\n\n- Cargo 是 Joris Hermans 开发的另一个 pub 包，实现了类似的目标。它是一个存储包，抽象了客户端上的本地存储、客户端以及服务器上的存储，并在磁盘上存储\
  \ JSON 文件。有关更多信息，请参阅 https://pub.dartlang.org/packages/cargo。\n- 完整的 API 文档可以在 http://www.dartdocs.org/documentation/lawndart/\
  \ 找到。\n\n## Storing data in MySQL\n\nMySQL 无可否认是最受欢迎的开源 SQL 数据库。Dart 可以使用 James\
  \ Ots 的 pub 包 `sqljocky`（https://github.com/jamesots/sqljocky）与 MySQL 通信。在本节中，我们将逐步演示如何使用此驱动程序。你可以在\
  \ `using_mysql` 项目中看到它的实际效果。\n\n### Getting ready\n\n- 要获取数据库软件，请从 http://dev.mysql.com/downloads/mysql/\
  \ 下载并安装 MySQL Community Server 安装程序。这很简单。但是，如果你需要安装帮助，请访问 http://dev.mysql.com/doc/refman/5.7/en/installing.html。\n\
  - 通过从 MySQL 安装的 bin 文件夹中的命令提示符启动 `mysqld` 来运行 MySQL 数据库系统。我们需要创建一个数据库和表来存储数据。最简单的方法是启动\
  \ MySQL Workbench 程序，建立连接，然后单击按钮 **Create a new schema in the connected server**，将其命名为\
  \ `jobsdb`，然后单击 **apply**。\n- 通过双击它选择架构，然后单击右侧的按钮到之前的按钮 **Create a new table in\
  \ the active schema**。将表命名为 `jobs`，并创建 `dbKey`、`type`、`salary`、`company`、`posted`\
  \ 和 `open` 列；`dbKey` 是主键。要将驱动程序导入到你的应用程序，请将 `sqljocky` 添加到 `pubspec.yaml` 并保存它。然后会自动执行\
  \ `pub get` 命令。\n\n## How to do it...\n\n应用程序从 `using_mysql.dart` 开始，其中创建了 JobStore\
  \ 对象，打开数据库，将记录写入 jobs 表，然后检索这些记录，如以下代码所示：\n\n```\n```dart\nimport 'job.dart';\n\
  import 'jobstore_mysql.dart';\n\nJob job;\nJobStore js;\n\nvoid main() {\n  js =\
  \ new JobStore();\n  // 1- create some jobs:\n  job = new Job(\"Web Developer\"\
  , 7500, \"Google\", new DateTime.now());\n  js.jobs.add(job);\n  job = new Job(\"\
  Software Engineer\", 5500, \"Microsoft\",\n    new DateTime.now());\n```\n```\n\n\
  ## Working with Databases\n\n```\n```java\njs.jobs.add(job);\njob = new Job(\"Tester\"\
  , 4500, \"Mozilla\", new DateTime.now());\njs.jobs.add(job);\n// 2- opening the\
  \ database:\njs.open();\n// 3- storing data in database:\njs.storeData();\n// 4-\
  \ retrieving and displaying data from database:\njs.readData();\n}\n```\n```\n\n\
  运行上述代码后，我们可以在 MySQL Workbench 中的 `jobs` 表中验证插入是否成功：\n\n![](img/52c05b53a56abd53584e4fed738ed509_790_0.png)\n\
  \nreadData 方法从 **jobs** 表读取数据并将其打印到控制台：\n\n**dbKey: 1, type : Web Developer, salary:\
  \ 7500, company: Google, posted: 2014-07-02 14:34:12.000, open: 1**\n\n**dbKey:\
  \ 2, type : Software Engineer, salary: 5500, company: Microsoft, posted: 2014-07-02\
  \ 14:34:12.000, open: 1**\n\n**dbKey: 3, type : Tester, salary: 4500, company: Mozilla,\
  \ posted: 2014-07-02 14:34:12.000, open: 1**\n\n第一次运行后，readData 不会显示任何输出，因为它在数据库中的插入完成之前就被执行了；请通过第二次运行验证输出。\n\
  \n通过 jobstore_mysql.dart 中的 JobStore 类进行与 MySQL 的交互：\n\n```\nimport 'package:sqljockey/sqljockey.dart';\n\
  import 'package:options_file/options_file.dart';\nimport 'job.dart';\n\nConnectionPool\
  \ pool;\n\nclass JobStore {\n  final List<Job> jobs = new List();\n  Job job;\n\n\
  \  // 5- opening a connection to the database:\n  open() {\n    pool = getPool(new\
  \ OptionsFile('connection.options'));\n  }\n\n  ConnectionPool getPool(OptionsFile\
  \ options) {\n    String user = options.getString('user');\n    String password\
  \ = options.getString('password');\n    int port = options.getInt('port', 3306);\n\
  \    String db = options.getString('db');\n    String host = options.getString('host',\
  \ 'localhost');\n    return new ConnectionPool(host: host, port: port, user: user,\
  \ password: password, db: db);\n  }\n\n  storeData() {\n    for (job in jobs) {\n\
  \      insert(job);\n    }\n  }\n\n  // 6- inserting a record in a table:\n  insert(Job\
  \ job) {\n    var jobMap = job.toMap();\n    pool.prepare('insert into jobs (dbKey,\
  \ type, salary, company, posted, open) values (?, ?, ?, ?, ?, ?') .then((query)\
  \ {\n      var params = new List();\n      params.add(job.dbKey);\n```\n\n\n\n\n\
  \n```\npool.prepare('delete from jobs where dbKey = ?').then((query) {\n  var params\
  \ = new List();\n  params.add(job.dbKey);\n  return query.execute(params);\n}).then((_)\
  \ {\n}).catchError(print);\n}\n```\n\n## 工作原理...\n\n数据库的连接信息存储在 `connection.options`\
  \ 文件中。在第五个注释中，通过调用 `getPool` 打开到数据库的连接，它返回一个 `ConnectionPool` 对象，该对象维护一个数据库连接池。`getPool`\
  \ 选项接受来自 `options_file` 包的 `OptionsFile` 对象作为参数，并读取 `connection.options` 中的信息：\n\
  \n```\n# connection.options to define how to connect to a mysql db\nuser=root\n\
  password=?????  # substitute your password here\n# port defaults to 3306\nport=3306\n\
  db=jobsdb\n# host defaults to localhost\nhost=localhost\n```\n\n所有与数据库的交互都通过查询进行。当执行查询时，如果\
  \ `ConnectionPool` 中有空闲连接，将使用该连接；否则，查询会排队，直到有空闲连接。正如我们在 `readData` 中看到的，select 查询通过\
  \ `pool.query(selectStr)` 进行。这会返回一个 `Future` 对象，因此结果的处理发生在 then 部分。可以使用以下代码完成：\n\
  \n```\nresults.forEach((row) {\n  print('dbKey: ${row.dbKey}, type : ${row.type},\
  \ …');\n```\n\n前面的代码行也可以写成如下形式：\n\n```\nresults.forEach((row) {\n  print('dbKey:\
  \ ${row[0]}, type : ${row[1]}, …');\n```\n\n## 数据库操作\n\n插入、更新和删除查询（在同名方法中编码）必须首先经历准备阶段，然后执行阶段。让我们看几个示例。对于插入，该查询如下所示（参考第六个注释）：\n\
  \n```\npool.prepare('insert into jobs (dbKey, type, salary, company,\\n  posted,\
  \ open) values (?, ?, ?, ?, ?, ?)').then((query) {})\n```\n\n对包含自增字段的表执行插入查询时，将在\
  \ ${result.insertId} 中返回该字段的值。对于更新，该查询如下所示（参考第七个注释）：\n\n```\npool.prepare('update\
  \ jobs set type = ?, salary = ?, company = ?,\\n  posted = ?, open = ? where dbKey\
  \ = ?').then((query) {})\n```\n\n删除查询如下所示（参考注释 8）：\n\n```\npool.prepare('delete\
  \ from jobs where dbKey = ?').then((query) {})\n```\n\n? 字符表示要在 SQL 字符串中替换的值。这些值按指定顺序放在\
  \ params 列表中，该列表作为参数传递给 query.execute。具有多个参数集的查询可以使用 query.executeMulti() 执行。如果需要将多个查询作为一个整体执行（全部成功或全部失败），请使用\
  \ sqljockey 中的 Transaction 类，格式如下：\n\n```\npool.startTransaction().then((trans)\
  \ {\\n  trans.query('...').then((result) {\\n    trans.commit().then(() {...});\\\
  n  });\\n});\n```\n\n## 更多内容...\n\n完整的 API 文档可在 http://jamesots.github.io/sqljockey/docs/\
  \ 找到。\n\n## 在 PostgreSQL 中存储数据\n\nPostgreSQL 是另一个流行的开源 SQL 数据库。Dart 可以通过 Greg Lowe\
  \ 提供的 pub 包 postgresql (https://github.com/xxgreg/postgresql) 与 PostgreSQL 通信。在本节中，我们将逐步演示如何使用该驱动。你可以在\
  \ using_postgresql 项目中看到它的实际应用。\n\n## 准备工作\n\n要获取数据库软件，请从 http://www.postgresql.org/download/\
  \ 下载并安装 PostgreSQL Server 安装程序，步骤如下：\n\n- 1. 数据库服务器配置为自动启动。我们需要创建一个数据库和表来存储数据。最简单的方法是启动\
  \ pgAdmin 程序，新建一个连接，然后从菜单中选择 Edit、New Object 和 New Database，将其命名为 jobsdb，然后点击 OK。\n\
  - 2. 选择 public 模式，再次选择 Edit、New Object，然后选择 New Table。\n- 3. 将该表命名为 jobs，并创建 dbKey、type、salary、company、posted\
  \ 和 open 作为列；dbKey 是主键。\n- 4. 要将驱动导入到应用程序中，请将 postgresql 添加到 pubspec.yaml 文件并保存。然后会自动执行\
  \ pub get 命令。\n\n## 如何实现...\n\n应用程序从 using_postgresql.dart 开始，在其中创建一个 JobStore 对象，打开数据库，将记录写入\
  \ jobs 表，然后检索这些记录：\n\n```\nimport 'job.dart';\nimport 'jobstore_postgresql.dart';\n\
  \nJob job;\nJobStore js;\n\nvoid main() {\n    js = new JobStore();\n    // 1- create\
  \ some jobs:\n    job = new Job(\"Web Developer\", 7500, \"Google\", new DateTime.now());\n\
  \    js.jobs.add(job);\n    job = new Job(\"Software Engineer\", 5500, \"Microsoft\"\
  ,\n        new DateTime.now());\n    js.jobs.add(job);\n    job = new Job(\"Tester\"\
  , 4500, \"Mozilla\", new DateTime.now());\n    js.jobs.add(job);\n    // 2- storing\
  \ data in database:\n    js.openAndStore();\n    // 3- retrieving and displaying\
  \ data from database:\n    js.openAndRead();\n}\n```\n\n## 数据库操作\n\n运行上述代码后，我们可以通过\
  \ pgAdmin 在 jobs 表中验证插入是否成功，如下图所示：\n\n![](img/52c05b53a56abd53584e4fed738ed509_796_0.png)\n\
  \nPostgreSQL 中的数据\n\nreadData 方法从 jobs 表中读取数据并将其打印到控制台：\n\n1 - Web Developer - 7500\
  \ - Google - 2014-07-03 00:00:00.000 true\n\n2 - Software Engineer - 5500 - Microsoft\
  \ - 2014-07-03 00:00:00.000 true\n\n3 - Tester - 4500 - Mozilla - 2014-07-03 00:00:00.000\
  \ true\n\n通过驱动与 PostgreSQL 的交互发生在 jobstore_postgresql.dart 的 JobStore 类中：\n\n```\n\
  library store;\n\nimport 'package:postgresql/postgresql.dart';\nimport 'job.dart';\n\
  \nclass JobStore {\n  final List<Job> jobs = new List();\n  Job job;\n  Connection\
  \ conn;\n  var uri = 'postgres://username:passwd@localhost:5432/jobsdb';\n\n  //\
  \ 5- opening a connection to the database:\n  openAndStore() {\n    connect(uri).then((_conn)\
  \ {\n      conn = _conn;\n      storeData();\n    })\n    .catchError(print);\n\
  \  }\n```\n\n```\nstoreData() {\n    for (job in jobs) {\n        insert(job);\n\
  \    }\n    // 6- close the database connection:\n    close();\n}\n\n// 7- inserting\
  \ a record in a table:\ninsert(Job job) {\n    var jobMap = job.toMap();\n    conn.execute('insert\
  \ into jobs values (@dbKey, @type, @salary, @company, @posted, @open)',\n      \
  \  jobMap)\n    .then((_) { print('inserted'); })\n    .catchError(print);\n}\n\n\
  openAndRead() {\n    connect(uri).then((_conn) {\n        conn = _conn;\n      \
  \  readData();\n    })\n    .catchError(print);\n}\n\n// 8- reading records from\
  \ a table:\nreadData() {\n    conn.query('select * from jobs').toList().then((results)\
  \ {\n        processJob(results);\n        close();\n    });\n}\n\n// 9- working\
  \ with record data:\nprocessJob(results) {\n    for (var row in results) {\n   \
  \     // Refer to columns by nam:\n        print('${row.dbKey} - ${row.type} - ${row.salary}\
  \ - ${row.company} - ${row.posted} ${row.open}');\n        // print(row[0]);   \
  \ // Or by column index.\n    }\n}\n```\n\n结果的处理在回调处理器中完成：\n\n```\nfor (var row\
  \ in results) {\n    print('${row.type} - ${row.salary}');\n    print(row[1]);\n\
  ```\n\n字段可以通过名称或索引检索。与往常一样，我们使用 catchError 捕获错误，这至少会将错误打印到控制台。与 MySQL 类似，可以使用连接\
  \ Pool 对象来避免为每个请求获取连接的开销：\n\n```\nvar pool = new Pool(uri, min: 2, max: 5);\npool.start().then((_)\
  \ {\nprint('min amount connections established.');\npool.connect().then((conn) {\
