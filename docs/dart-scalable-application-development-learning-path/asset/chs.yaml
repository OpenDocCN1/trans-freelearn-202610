  #maleLbl\").text = maleLbl();\n    querySelector(\"#femaleLbl\").text = femaleLbl();\n\
  \    (querySelector(\"#registerBtn\") as InputElement)\n      .value = registerBtn();\n\
  \    BidiFormatter bidiFormatter = new BidiFormatter.UNKNOWN();\n    querySelector(\"\
  #copyrightLbl\").text =\n      bidiFormatter.wrapWithUnicode(copyrightLbl());\n\
  \  });\n}\n```\n\n在前面的代码中，我们在初始化消息时指定了德语区域设置作为默认值。现在，打开浏览器中的 `index.html` 文件以查看表单在德语区域设置中的正确翻译：\n\
  \n![](img/52c05b53a56abd53584e4fed738ed509_433_0.png)\n\n## 总结\n\n在本章中，我们讨论了基于 Dart\
  \ 语言的项目国际化和本地化的一些重要方面。全球化软件的开发包括国际化，涵盖设计和开发 Web 应用程序，以及本地化，包括为特定区域设置翻译和定制 Web 应用程序。\n\
  \npub 管理器中的 `intl` 包帮助你以相当直接的方式为服务器端和客户端设计和开发应用程序。所有可执行代码必须与实现 UI 的编程代码分离。你必须避免直接将数字和日期转换为字符串，因为不同文化对数字和日期的呈现方式不同。\n\
  \n`NumberFormat` 类包含特殊构造函数，可快速创建常用的模式，这对于测量单位和货币非常有用。`BidiFormatter` 类帮助管理包含双向文本的消息，具有\
  \ BiDi 包装、自动方向性估计和字符转义。`DateFormat` 类有一套巨大的命名模式，有助于避免错误并以正确格式显示数据。消息的国际化基于通过命名本地化版本的消息进行查找，并返回翻译后的消息，可能与指定的参数列表插值。\n\
  \n`Intl` 类的 `plural` 方法可以帮助使用括号将单数和复数形式组合成一个字符串。`Intl` 类的 `gender` 方法为基于性别的选择提供开箱即用的支持。`Intl`\
  \ 类的 `select` 方法帮助根据可用选择以不同方式格式化消息。`Intl` 类的 `message` 方法可以将消息表示为简单的表达式，并具有使用属性插值的可能性。\n\
  \n在下一章中，我们将向你展示如何正确组织客户端到服务器的通信。你将找到关于使用客户端到服务器通信选择 Dart 类的可能重要问题的答案。\n\n\n\n\n"
- "## 客户端到服务器的通信\n\n在本章中，我们将讨论如何组织客户端到服务器的通信。我们将为一些可能重要的问题找到答案，例如如何正确选择用于客户端到服务器通信的\
  \ Dart 类。在本章中，我们将涵盖以下主题：\n\n- 通信概览\n- 超文本传输协议\n- AJAX 轮询请求\n- AJAX 长轮询请求\n- 服务器发送事件\n\
  - WebSocket\n\n### 通信概览\n\n我们中的一些人无法想象没有互联网、手机或计算机的现代世界。每台连接到互联网的设备既可以是客户端，也可以是服务器，或者同时扮演这两种角色。客户端与服务器之间的通信是现代数字世界的基础。基于一套特殊规则和消息格式的通信被称为通信协议，它使客户端和服务器之间能够进行数据交换。\n\
  \n### 互联网协议栈\n\n任何连接到互联网的设备都有一个**互联网协议（IP）**地址。IP 地址可以是永久的，也可以是从**动态主机配置协议（DHCP）**服务器获取的临时地址。无论如何，任何连接到互联网的设备都有一个唯一的\
  \ IP 地址。在同一个唯一 IP 地址范围内运行的许多程序使用不同的端口号来同时访问互联网。一条消息通过互联网从一台设备传输到另一台设备时，会沿着一条长路径穿过协议栈，该协议栈被表示为一组相互叠加的层，如下图所示：\n\
  \n![](img/52c05b53a56abd53584e4fed738ed509_436_0.png)\n\n让我们看看消息实际发生了什么：\n\n- 1.\
  \ 消息到达协议栈顶部的应用协议层，然后向下移动。通常，应用层会以适用于 HTTP、SMTP、FTP 或其他应用的标准方式之一格式化消息。\n- 2. 格式化后的消息随后被转发到**传输控制协议（TCP）**层。该层将消息拆分为称为数据包的小型、可管理的数据块，并为每个数据块分配一个编号。该编号指定了数据包的顺序，并允许接收方的\
  \ TCP 层从这些数据包中重建原始消息。它会根据应用层所使用的协议，为每个数据包分配一个端口号。\n- 3. 然后，这些数据包进入 IP 层。它会在每个数据包上附加发送方和接收方的\
  \ IP 地址。IP 地址和端口号的组合称为套接字地址。\n- 4. 最后，硬件层会在数据包上附加发送方和接收方的**媒体访问控制（MAC）**地址。它使数据包能够被引导到目标设备\
  \ IP 地址上的特定网络接口。在硬件层，所有数据包被逐一转换为电子信号，通过线缆传输，并连接到**互联网服务提供商（ISP）**的调制解调器。\n- 5. 从这里开始，将消息数据包通过路由器和\
  \ ISP 主干网传送到互联网上指定的 IP 地址，是 ISP 的任务。\n- 6. ISP 传送来的数据包从目标设备协议栈的底部开始。从数据包中剥离的任何额外信息都会向上传递。\n\
  - 7. 最终，数据到达协议栈顶部，在那里被解码为原始消息。\n\n### 超文本传输协议\n\n万维网（WWW）是互联网上最常用的服务之一。超文本传输协议（HTTP）是一种基于文本的应用层协议，它使万维网得以运作。所有\
  \ Web 浏览器和 Web 服务应用程序都使用 HTTP 通过互联网相互通信。Web 浏览器或独立应用程序会打开一个连接并向 Web 服务器发送请求。Web\
  \ 服务器处理请求，然后关闭与 Web 客户端的连接。\n\n> HTTP 是一种无状态协议。\n\n在 HTTP 1.0 规范中，你找不到任何关于持久连接的信息。然而，实际上，它通过向请求中添加以下额外的头部，被非正式地加入到了现有协议中：\n\
  \n```\nConnection: Keep-Alive\n```\n\n因此，如果客户端支持 Keep-Alive，它就会在请求中添加上述头部。服务器收到这个请求后，生成的响应也会包含这个头部。\n\
  \n从 HTTP 1.1 开始，除非另有声明，否则所有连接都被视为持久连接。HTTP 持久连接不使用外部的 Keep-Alive 消息。可以通过一个已打开的连接发送多个请求。\n\
  \n我们可以通过以下不同的库使用 HTTP 协议进行通信：\n\n- Dart SDK 中的 dart:io 库包含 HttpClient 类，它通过 HTTP\
  \ 协议与服务器通信。\n- Dart SDK 中的 dart:html 库具有 HttpRequest 类，它使用客户端 XMLHttpRequest 从 URL\
  \ 获取数据。它还有助于从 HTTP 或 FTP 获取数据，或通过 AJAX 更新页面内容。\n\n## 客户端到服务器的通信\n\n由 Google 开发团队编写的、来自\
  \ pub 服务器的 http 包包含一个基于 Future 的库，用于创建 HTTP 请求。它是平台无关的，因此我们可以使用 `http.dart` 库从独立应用程序生成\
  \ HTTP 请求，或者使用 `browser_client.dart` 库用于基于 Web 浏览器的应用程序。\n\n让我们看看如何组织 Web 浏览器或独立应用程序与\
  \ Web 服务器之间的通信。\n\n### Web 服务器\n\n在本章中，我们将创建一个简单的 Web 服务器，可用于所有示例，如下所示：\n\n```\n\
  import 'dart:io';\nimport 'package:route/server.dart';\n\nimport 'urls.dart' as\
  \ urls;\nimport 'files.dart';\nmain() {\n  final allUrls = new RegExp('/(.*)');\n\
  \n  HttpServer.bind(urls.serverAddress, urls.serverPort)\n    .then((server) {\n\
  \      print(\"Server runs on ${server.address.host}:${server.port}\");\n      new\
  \ Router(server)\n        ..serve(urls.dataUrl, method:'GET').listen(processParams)\n\
  \        ..serve(urls.dataUrl, method:'DELETE').listen(processParams)\n        ..serve(urls.dataUrl,\
  \ method:'POST').listen(processBody)\n        ..serve(urls.dataUrl, method:'PUT').listen(processBody)\n\
  \        ..serve(allUrls).listen(serveDirectory('', as: '/'))\n        ..defaultStream.listen(send404);\n\
  \    });\n}\n```\n\n在前面的代码中，我们特意使用了来自 pub 服务器的 route 包，以减少围绕主要功能的代码包装。我们的代码处理客户端请求以匹配\
  \ `dataUrl`。根据请求方法的不同，代码会调用 `processParams` 或 `processBody` 函数。我们将 `serverAddress`、`serverPort`\
  \ 和 `dataUrl` 放在 `urls.dart` 文件中。我们特意将它们移到外部文件中，以便与客户端代码共享这些数据。我们在 `setHeaders`\
  \ 方法中设置共享的头部，如以下代码所示：\n\n```\nsetHeaders(HttpRequest request) {\n  request.response.headers.contentType\
  \ =\n    new ContentType(\"text\", \"plain\", charset: \"utf-8\");\n}\n```\n\n##\
  \ 客户端到服务器的通信\n\n我们的服务器并没有做什么特殊的事情。它响应每个请求，返回请求方法的名称、查询参数或消息体（以字符串表示）。服务器必须始终在线才能处理我们的请求。Dart\
  \ Editor 可以同时运行不同的 Dart 程序。要做到这一点，只需右键单击 `server.dart` 文件并运行它，如下面的截图所示：\n\n![](img/52c05b53a56abd53584e4fed738ed509_440_0.png)\n\
  \n### 通过 dart:io 库进行独立 HTTP 通信\n\n让我们从标准的 `dart:io` 库和 `HttpClient` 类开始，组织从独立客户端到\
  \ Web 服务器的通信。`HttpClient` 类中任何用于通信的方法都是一个两步过程。第一次调用原始方法时，它返回带有 `HttpClientRequest`\
  \ 的 `Future`。此时，底层网络通信已经打开，但尚未发送任何数据。你可以在请求上设置 HTTP 头部或消息体，最后返回请求的 `close` 方法的结果。请看以下基于\
  \ `dart:io` 库中 `HttpClient` 类的代码：\n\n```\n```dart\nimport 'dart:io';\nimport 'dart:convert';\n\
  import 'urls.dart' as urls;\n\nvar url = \"http://${urls.serverAddress}:${urls.serverPort}${urls.dataUri}\"\
  ;\nvar name = \"HttpClient Standalone\";\n// The following method processes all\
  \ responses:\nresponseHandler(response) {\n```\n```\n\n\n\n\n\n```dart\nif (response\
  \ is HttpClientResponse) {\n  response.transform(UTF8.decoder).listen((contents)\
  \ {\n    print(\"${response.statusCode}: ${contents}\");\n  });\n} else {\n  print(\"\
  Readed: \" + response.toString());\n}\n}\n\n// We send data to a server via this\
  \ method:\nsendData(HttpClientRequest request, data) {\n  request.headers.contentType\
  \ =\n      new ContentType(\"application\", \"json\", charset: \"utf-8\");\n  List<int>\
  \ buffer = JSON.encode(data).codeUnits;\n  request.contentLength = buffer.length;\n\
  \  request.add(buffer);\n}\n\nmain() {\n  // We need to encode name before sending\
  \ it:\n  String query = \"name=\" + Uri.encodeQueryComponent(name);\n  // We create\
  \ the client instance to send multiple requests:\n  HttpClient client = new HttpClient();\n\
  \  // Make a GET request with query:\n  client.getUrl(Uri.parse(\"$url?$query\"\
  ))\n    .then((HttpClientRequest request) {\n      return request.close();\n   \
  \ }).then(responseHandler);\n  // Here we send a map with data via the POST request:\n\
  \  client.postUrl(Uri.parse(url))\n    .then((HttpClientRequest request) {\n   \
  \   sendData(request, {'post name': name});\n      return request.close();\n   \
  \ }).then(responseHandler);\n  // The PUT request is very similar to the POST one:\n\
  \  client.putUrl(Uri.parse(url))\n    .then((HttpClientRequest request) {\n    \
  \  sendData(request, {'put name': name});\n      return request.close();\n    }).then(responseHandler);\n\
  \  // Here is the DELETE request:\n  client.deleteUrl(Uri.parse(\"$url?$query\"\
  ))\n    .then((HttpClientRequest request) {\n      return request.close();\n   \
  \ }).then(responseHandler);\n}\n```\n\n按 *Web server* 小节中说明的方式运行服务器代码，然后通过上下文菜单运行\
  \ `standalone_dart_io.dart` 中的代码。参考以下客户端输出：\n\n```\n200: GET: /data, Params:{name:\
  \ HttpClient Standalone}\n200: DELETE: /data, Params:{name: HttpClient Standalone}\n\
  200: POST: /data, Data:{\"post name\":\"HttpClient Standalone\"}\n200: PUT: /data,\
  \ Data:{\"put name\":\"HttpClient Standalone\"}\n```\n\nHttpClient 类提供了一组创建 HTTP\
  \ 请求的方法，但这种两步过程是一个真正的劣势。\n\n## 通过 http 包进行独立 HTTP 通信\n\n让我们看看 http 包中的 http 库如何能改善客户端开发体验。在使用\
  \ http 库之前，我们应该在项目 pubspec.yaml 文件的 dependencies 组中添加 http 包。我们借助以下代码创建 standalone_http.dart\
  \ 文件：\n\n```dart\nimport 'package:http/http.dart' as http;\nimport 'dart:async';\n\
  import 'urls.dart' as urls;\n\nvar url = \"http://${urls.serverAddress}:${urls.serverPort}${urls.dataUrl}\"\
  ;\nvar name = \"Http Standalone\";\n// We process all responses in this method:\n\
  responseHandler(response) {\n  if (response is http.Response) {\n    print(\"${response.statusCode}:\
  \ ${response.body}\");\n  } else {\n    print(\"Readed: \" + response.toString());\n\
  \  }\n}\n\nmain() {\n  // We need to encode name before sending it:\n  String query\
  \ = \"name=\" + Uri.encodeQueryComponent(name);\n  // Static functions such as GET,\
  \ POST, and so on create new\n  // instances of the Client interface per request.\n\
  \  // All static functions such as get from the http library always create\n  //\
  \ new instance of the Client class.\n  http.get(\"$url?$query\").then(responseHandler);\n\
  \n  var client = new http.Client();\n  Future.wait([\n    client.get(\"$url?$query\"\
  ).then(responseHandler),\n    client.post(url, body: {\"name\": name}).then(responseHandler),\n\
  \    client.put(url, body: {\"name\": name}).then(responseHandler),\n    client.delete(\"\
  $url?$query\").then(responseHandler)])\n  .then((list) {\n    client.close();\n\
  \  });\n}\n```\n\n使用 http 库中的 client 类相比 dart:io 库中的 HttpClient 的巨大优势在于代码更简洁，结果相似：\n\
  \n```\n200: GET: /data, Params:{name: Http Standalone}\n200: GET: /data, Params:{name:\
  \ Http Standalone}\n200: POST: /data, Data:name=Http+Standalone\n200: PUT: /data,\
  \ Data:name=Http+Standalone\n200: DELETE: /data, Params:{name: Http Standalone}\n\
  ```\n\n## 通过 dart:html 库进行 Web 浏览器 HTTP 通信\n\n你不能使用 dart:io 库来编写基于 Web 浏览器的应用程序，因为该库是专门为独立和服务器应用程序编写的。相反，我们将使用\
  \ dart:html 库中的 HttpRequest 类来实现相同的结果。此类可用于通过 HTTP 或 FTP 应用程序协议获取数据，以及 AJAX 轮询请求，如以下代码所示：\n\
  \n```dart\nimport 'dart:html';\nimport 'dart:convert';\nimport 'urls.dart' as urls;\n\
  \nvar url = \"http://${urls.serverAddress}:${urls.serverPort}${urls.dataUrl}\";\n\
  var name = \"HttpClient Browser\";\n// We save the response text in a DIV element\
  \ and append it to the\n// DIV container:\nresponseHandler(DivElement log, responseText)\
  \ {\n  DivElement item = new DivElement()\n    ..text = responseText.toString();\n\
  \  log.append(item);\n}\n\nvoid main() {\n  DivElement log = querySelector(\"#log\"\
  );\n  // Here we prepare query to send:\n  String query = \"name=\" + Uri.encodeQueryComponent(name);\n\
  \  String data = JSON.encode({\"name\": name});\n\n  request = new Request(\"PUT\"\
  , Uri.parse(url));\n  request.body = data;\n  client.send(request).then((StreamedResponse\
  \ response)\n      => responseHandler(log, response));\n\n  request = new Request(\"\
  DELETE\", Uri.parse(\"$url?$query\"));\n  client.send(request).then((StreamedResponse\
  \ response)\n      => responseHandler(log, response));\n}\n```\n\n创建 Dartium 启动配置并在\
  \ Web 浏览器中打开 `index.html` 文件。运行服务器并启动新配置以查看以下预期结果：\n\n```\nGET: /data, Params:{name:\
  \ HttpClient Browser}\nPOST: /data, Data:{\"name\":\"HttpClient Browser\"}\nDELETE:\
  \ /data, Params:{name: HttpClient Browser}\nPUT: /data, Data:{\"name\":\"HttpClient\
  \ Browser\"}\n```\n\n你现在知道如何通过 http 和 html 包中的 `BrowserClient` 和 `Request` 类轻松创建客户端到服务器的通信。\n\
  \n## AJAX 轮询请求\n\n通常，Web 浏览器发送请求并立即接收响应。每次从服务器请求新数据部分时，整个网页都会重新加载。**异步 JavaScript\
  \ 和 XML (AJAX)** 是一种技术，允许客户端 JavaScript 代码在无需重新加载 Web 浏览器中当前页面的情况下从服务器请求数据。与传统网页流程相比，使用\
  \ AJAX 的一个重要优势是它能够将桌面应用程序的可用性和行为带入 Web 应用程序。`HttpRequest` 是获取 URL 数据的客户端 XHR 请求，正式名称为\
  \ `XMLHttpRequest`，在 AJAX Web 开发技术中发挥着重要作用。\n\n> `HttpRequest` 内部创建的所有请求必须与请求的资源来自同一源的服务器中。\n\
  \n许多 Web 应用程序的状态本质上是易变的。变化可能来自众多来源，例如其他用户、外部新闻和数据、复杂计算的结果，以及基于当前时间和日期的触发器。解决方案是定期发出请求以获取新信息。为此，我们可以使用\
  \ AJAX 轮询请求技术。让我们看看我们 Web 应用程序的客户端：\n\n```dart\nimport 'dart:html';\nimport 'dart:async';\n\
  import 'urls.dart' as urls;\n\nvar url = \"http://${urls.serverAddress}:${urls.serverPort}${urls.dataUrl}\"\
  ;\n```\n\n要打印时间戳，请使用以下代码：\n\n```dart\ntimeStamp() {\n  DateTime dt = new DateTime.now();\n\
  \  return \" (${dt.minute}:${dt.second})\";\n}\n```\n\n响应按如下方式保留请求编号：\n\n```dart\n\
  responseHandler(DivElement log, responseText) {\n  DivElement item = new DivElement()\n\
  \    ..text = responseText.toString() + timeStamp();\n  // We insert a new element\
  \ at the top of the log:\n  log.insertAdjacentElement('beforebegin', item);\n}\n\
  ```\n\n```dart\nvoid main() {\n  DivElement log = querySelector(\"#log\");\n  int\
  \ num = 0;\n  // A timer in 2 seconds interval calls the callback function:\n  new\
  \ Timer.periodic(new Duration(seconds: 2), (Timer timer) {\n    // We generate the\
  \ query parameter with number:\n    String query = \"number=${num++}\";\n    HttpRequest.getString(\"\
  $url?$query\")\n      .then((response) => responseHandler(log, response));\n  });\n\
  }\n```\n\n\n\n\n\n创建 Dartium 启动配置并在 Web 浏览器中打开 index.html 文件。运行服务器并启动新的配置以查看以下结果：\n\
  \n```\nGET: /data, Data:4, Params:{number: 0} (31:28)\nGET: /data, Data:26, Params:{number:\
  \ 1} (31:30)\nGET: /data, Data: , Params:{number: 2} (31:32)\nGET: /data, Data:\
  \ , Params:{number: 3} (31:34)\nGET: /data, Data:47, Params:{number: 4} (31:36)\n\
  GET: /data, Data:69, Params:{number: 5} (31:38)\nGET: /data, Data: , Params:{number:\
  \ 6} (31:40)\nGET: /data, Data: , Params:{number: 7} (31:42)\nGET: /data, Data:98,\
  \ Params:{number: 8} (31:44)\n```\n\n轮询请求存在以下缺点：\n\n- 周期性请求消耗带宽和服务器资源\n- 服务器必须始终有数据或无数据时都做出响应；因此，客户端会收到大量空字符串\n\
  \n让我们尝试使用 AJAX 长轮询请求来修复它们。\n\n## AJAX 长轮询请求\n\n从客户端角度来看，AJAX 长轮询请求看起来与普通请求相似。它们在服务器端的一个重要区别是，如果服务器没有可供客户端的信息，它会保持请求并等待信息变得可用或等待合适的超时时间，之后再向客户端发送完成的响应。长轮询请求减少了需要发送的数据量，因为服务器只在数据真正可用时才发送数据。\n\
  \n长轮询请求在以下情况下很有用：\n\n- 你的解决方案必须在旧版 Web 浏览器中工作\n- 客户端与服务器之间的数据流量很低\n- 实现非常简单\n\n\
  使用长轮询请求的优点如下：\n\n- 它适用于所有浏览器\n- 它易于开发，并且可以完美地融入遗留代码中而无需重大更改和努力\n- 它可以快速检测连接故障并恢复会话以避免数据丢失\n\
  - 它对 IP 地址变化具有很强的免疫力，因为请求是短暂的并且其状态是独立存储的\n- 它对大多数实时应用程序性能良好，并减少了带宽消耗和服务器资源利用率\n\n\
  使用此请求的缺点如下：\n\n- 客户端必须不断建立连接；如果服务器将信息发送回客户端并且连接被关闭，它必须等待客户端发送下一个请求以打开新连接\n- 客户端需要创建额外的连接来向服务器发送数据\n\
  - 并行请求存在问题\n- 数据量可能会使服务器的下一次更新变得相当过量，如果数据在服务器上到来之前它等待来自客户端的新连接\n\n以下浏览器受长轮询请求支持：\n\
  \n- Chrome 1.0+\n- Firefox 0.6+\n- Opera 8.0+\n- Safari 1.2+\n- Internet Explorer\
  \ 5.0+\n\n要实现持久的 HTTP 连接，你需要在客户端和服务器端进行更改。我们引入 longLasting 方法来管理请求并将其注册，而不是使用 processParams：\n\
  \n```\n//...\nmain() {\n    final allUrls = new RegExp('(/.*)');\n\n    HttpServer.bind(urls.serverAddress,\
  \ urls.serverPort)\n    .then((server) {\n        print(\"Server runs on ${server.address.host}:${server.port}\"\
  );\n        new Router(server)\n            .serve(urls.dataUrl, method: 'GET').listen(longLasting)\n\
  \            .serve(allUrls).listen(serveDirectory('', as: '/'))\n            .defaultStream.listen(send404);\n\
  \    });\n}\n```\n\n```\n// Next function was changed to return data only:\nString\
  \ fetchData() {\n    return dataGenerator.nextInt(100).toString();\n}\n```\n\n新的\
  \ longLasting 函数显示在以下代码中。它运行两个周期性计时器。第一个模拟基于请求超时的处理。如果每 30 秒没有收集到数据，它会重置第二个计时器并响应空字符串。第二个管理数据的可用性。如果数据在一秒间隔内可用，它会重置第一个计时器并响应收集到的数据：\n\
  \n```\nlongLasting(HttpRequest request) {\n    Timer reqTimer, dataReadyTimer;\n\
  \n    reqTimer = new Timer.periodic(\n        new Duration(seconds:30), (Timer t)\
  \ {\n        dataReadyTimer.cancel();\n        processParams(request);\n    });\n\
  \n    dataReadyTimer = new Timer.periodic(\n        new Duration(seconds:1), (Timer\
  \ t) {\n        if (ready.nextBool()) {\n            reqTimer.cancel();\n      \
  \      processQueryParams(request, ready:true);\n        }\n    });\n}\n```\n\n\
  processQueryParams 函数的更新版本在以下代码中说明。此函数根据 ready 属性的值返回来自 fetchData 的数据或返回空字符串。代码如下：\n\
  \n```\nprocessQueryParams(HttpRequest request, {bool ready:false}) {\n    request.response.write(\n\
  \        \"${request.method}: ${request.uri.path}\");\n    if (ready) {\n      \
  \  request.response.write(\", Data:\" + fetchData());\n    } else {\n        request.response.write(\"\
  , Data:\");\n    }\n    if (request.uri.queryParameters.length > 0) {\nrequest.response.write(\"\
  , Params:\" +\n    request.uri.queryParameters.toString());\n}\nrequest.response.close();\n\
  }\n```\n\n让我们看看如何更改 AJAX 轮询请求示例以在客户端组织长轮询请求。你可以通过调用 longPolling 函数按如下方式启动长轮询请求：\n\
  \n```\nvoid main() {\n  DivElement log = querySelector(\"#log\");\n  int num = 0;\n\
  \  longPolling(log, num);\n}\n```\n\n在此函数中，我们发送 AJAX 请求并等待服务器的响应。当响应可用时，我们调用 responseHandler\
  \ 函数并立即启动新的请求：\n\n```\nlongPolling(DivElement log, int num) {\n  String query =\
  \ \"number=${num++}\";\n  HttpRequest.getString(\"$url?$query\")\n    .then((response)\
  \ {\n      responseHandler(log, response);\n      longPolling(log, num);\n    });\n\
  }\n```\n\n创建 Dartium 启动配置，运行服务器，并在 Web 浏览器中打开 index.html 文件以查看以下结果：\n\n```\nGET:\
  \ /data, Data:12, Params:{number: 0} (51:0)\nGET: /data, Data:9, Params:{number:\
  \ 1} (51:2)\nGET: /data, Data:60, Params:{number: 2} (51:3)\nGET: /data, Data:41,\
  \ Params:{number: 3} (51:5)\nGET: /data, Data:15, Params:{number: 4} (51:7)\nGET:\
  \ /data, Data:0, Params:{number: 5} (51:8)\n```\n\n现在，我们减少了带宽消耗和服务器利用率；因此，客户端将主要只接收有效数据。\n\
  \n## Server-Sent Events\n\n另一种基于 AJAX 的技术是 **Server-Sent Events (SSE)**，也称为 **Server\
  \ Push** 或 **HTTP Streaming**。在这种情况下，客户端通过初始 HTTP 请求向服务器打开连接，并且当有新信息可用时，服务器向客户端发送事件。因此，如果你的客户端的常规功能类似于股票行情或新闻推送，并且它们需要随着时间的推移从服务器获取更新，那么\
  \ SSE 技术就是理想的解决方案了。顺便说一下，如果客户端有新信息要发送给服务器，它可以通过新的 HTTP 请求发送。\n\nSSE 在以下情况下很有用：\n\
  \n- 客户端面向接收大量数据\n- 解决方案必须在旧版 Web 浏览器中工作\n\nSSE 的优点如下：\n\n- 服务器实现足够简单\n- Web 浏览器可以自动重新连接到服务器\n\
  - 消息交换的格式足够灵活\n- 解决方案基于到服务器的一个永久连接\n- 解决方案足够适用于实时应用程序\n- 客户端不需要在每次响应后建立新连接\n- 服务器解决方案可以基于事件循环\n\
  \nSSE 的缺点如下：\n\n- 它仅从服务器到客户端工作\n- Internet Explorer 不支持它\n- 它可能被代理服务器阻止\n- 不可能从另一个域连接到服务器\n\
  \n以下浏览器受支持：\n\n- Chrome 6.0+\n- Firefox 6.0+\n- Opera 9.0+\n- Safari 5.0+\n\n\n\n\
  \n\nEventSource 类用于接收 SSE。该类通过指定的 URL 经 HTTP 连接到服务器，并在不关闭连接的情况下接收服务器事件。事件以 text/event-stream\
  \ 格式传入。要打开到服务器的连接并开始接收事件，我们通过工厂构造函数创建 EventSource 类的新实例，并将生成事件的资源的 URL 传递给它。连接建立后，我们便等待消息。\n\
  \n> 生成事件的资源的 URL 必须与调用页面的来源（origin）匹配。\n\n在服务器端，每条消息都以一个文本块的形式发送，并以两个换行符结尾。文本数据使用\
  \ UTF-8 编码。每条消息由一行或多行文本组成，列出该消息的字段。每个字段由字段名、冒号和该字段值的文本数据表示。以下是一个仅包含数据的消息示例：\n\n\
  ```\n; this is a comment\ndata: some text\n\ndata: another text\n```\n\n在前面的代码中，第一行只是一个注释。所有以冒号字符开头的文本消息都是注释。如果消息不是定期发送的，注释可作为\
  \ Keep-Alive（保持连接）机制使用。第二行和第三行仅包含一个带有文本值的数据字段。第三行包含一个额外的换行符，用于终止消息。通过一条消息可以发送多个事件。每个事件都有一个在\
  \ event 字段中指定的名称，以及一个值可以是任意字符串的 data 字段。数据也可以是 JSON 格式，如下面的代码所示：\n\n```\nevent:\
  \ userLogon\ndata: {\"username\": \"John\", \"time\": \"01:22:45\", \"text\": \"\
  Hello World\"}\n\nevent: userMessage\ndata: \"Any data\"\n```\n\n你可以在消息中使用不带 event\
  \ 字段的未命名事件。SSE 实现使用 message 作为未命名事件的名称。每个事件可能有一个 id。在这种情况下，数据可以按如下方式组合：\n\n```\n\
  id: 123\ndata: some text\ndata: {\"text\": \"Another text}\n```\n\n## 客户端到服务器端的通信\n\
  \n让我们看一下示例的服务器端：\n\n```java\n//...\nmain() {\n    final allUrls = new RegExp('/(.*)');\n\
  \n    HttpServer.bind(urls.serverAddress, urls.serverPort)\n      .then((server)\
  \ {\n        print(\"Server runs on ${server.address.host}:${server.port}\");\n\
  \        new Router(server)\n            ..serve(urls.dataUrl, method: 'GET').listen(processSSE)\n\
  \            ..serve(allUrls).listen(serveDirectory('', as: '/'))\n            ..defaultStream.listen(send404);\n\
  \      });\n}\n\nString fetchData() {\n    return dataGenerator.nextInt(100).toString();\n\
  }\n```\n\n客户端创建的 EventSource 类实例会打开一个连接，该连接在 accept 标头中提交包含 text/event-stream 值的\
  \ HTTP 请求。这是服务器开始 SSE 通信的信号。在我们的示例中，我们先发送 logon 事件。服务器与客户端之间的连接保持打开状态，因此我们可以定期发送\
  \ message 事件，如下面的代码所示：\n\n```java\nprocessSSE(HttpRequest request) {\n    if (request.headers.value(HttpHeaders.ACCEPT)\
  \ == EVENT_STREAM) {\n        writeHead(request.response);\n        int num = 0;\n\
  \n        new Timer.periodic(new Duration(seconds: 5), (Timer t) {\n           \
  \ sendMessageEvent(request.response, num++);\n        });\n\n        sendLogonEvent(request.response);\n\
  \    }\n}\n```\n\n为了允许你发送推送事件，必须禁用 `HttpResponse` 中的输出缓冲。除此之外，你还需要通过标头属性指定内容类型、缓存控制和连接类型，如下所示：\n\
  \n```\nwriteHead(HttpResponse response) {\n    response.bufferOutput = false;\n\
  \    response.headers.set(HttpHeaders.CONTENT_TYPE, EVENT_STREAM);\n    response.headers.set(HttpHeaders.CACHE_CONTROL,\
  \ 'no-cache');\n    response.headers.set(HttpHeaders.CONNECTION, \"keep-alive\"\
  );\n}\n```\n\n要发送消息，你可以使用 response 的 `writeln` 方法。它会自动为每个字符串附加一个换行符，因此你只需在事件末尾添加一个换行符。最后，response\
  \ 的 `flush` 方法会将事件推送到客户端，如下所示：\n\n```\nsendMessageEvent(HttpResponse response, int\
  \ num) {\n    print(\"Send Message event\");\n    response.writeln('id: 123');\n\
  \    response.writeln('data: {\"msg\": \"hello world\", \"num\": $num, \"value\"\
  : ${fetchData()} }\\n');\n    response.flush();\n}\n```\n\n对于 logon 消息，我们创建一个自定义的\
  \ userLogon 事件类型。如果通过 EventSource 打开的连接终止，Web 浏览器将自动在约三秒后重新建立到服务器的连接。你可以通过事件的 `retry`\
  \ 属性更改此值。该值必须是一个整数，指定以毫秒为单位的重新连接时间：\n\n```\nsendLogonEvent(HttpResponse response)\
  \ {\n    print(\"Send Logon event\");\n    response.writeln('event: userlogon');\n\
  \    response.writeln('retry: 15000');\n    response.writeln('id: 123');\n    response.writeln('data:\
  \ {\"username\": \"John\", \"role\":\n        \"admin\"}\\n');\n    response.flush();\n\
  }\n```\n\n## 客户端到服务器端的通信\n\n客户端侧的 SSE 代码实现如下：\n\n```\nimport 'dart:html';\nimport\
  \ 'urls.dart' as urls;\n\nvar url = \"http://${urls.serverAddress}:${urls.serverPort}${urls.dataUrl}\"\
  ;\nString get timeStamp {\n  DateTime dt = new DateTime.now();\n  return \"(${dt.minute}:${dt.second})\"\
  ;\n}\n\nresponseHandler(DivElement log, String data) {\n  DivElement item = new\
  \ DivElement();\n  item.text = data + timeStamp;\n  log.insertAdjacentElement('beforebegin',\
  \ item);\n}\n```\n\n在前面的代码中，我们使用指定的 URL 创建了一个 EventSource 实例。从现在开始，我们将开始监听来自服务器的事件。我们添加了\
  \ open 和 error 事件监听器。EventSource 类通过 readyState 属性的变化向代码通知服务器侧的连接已关闭。message 监听器处理所有未知事件。一个专门用于\
  \ userlogon 事件的事件监听器处理可以通过 EventSource 类的 addEventListener 方法添加的这类事件。事件在 data 属性中保存消息信息。服务器端分配的事件标识符可通过\
  \ lastEventId 属性获取，如下面的代码所示：\n\n```\nmain() {\n  DivElement log = querySelector(\"\
  #log\");\n  EventSource sse = new EventSource(url);\n  sse.onOpen.listen((Event\
  \ e) {\n    responseHandler(log, \"Connected to server: ${url}\");\n  });\n\n  sse.onError.listen((Event\
  \ e) {\n    if (sse.readyState == EventSource.CLOSED) {\n      responseHandler(log,\
  \ \"Connection closed\");\n    } else {\n      responseHandler(log, \"Error: ${e}\"\
  );\n    }\n  });\n  sse.onMessage.listen((MessageEvent e) {\n    responseHandler(log,\n\
  \      \"Event ${e.lastEventId}: ${e.data}\");\n```\n\n```\n});\n    sse.addEventListener(\"\
  userlogon\", (Event e) {\n        responseHandler(log,\n            \"User Logon:\
  \ ${(e as MessageEvent).data}\");\n    }, false);\n}\n```\n\n现在，创建一个 Dartium 启动器，运行服务器，并在\
  \ Web 浏览器中打开 index.html，即可看到以下结果：\n\n```\nConnected to server: http://localhost:8080/data\
  \ (43:33)\nUser Logon: {\"username\": \"John\", \"role\": \"admin\"} (43:33)\nEvent\
  \ 123: {\"msg\": \"hello world\", \"num\": 0, \"value\": 45} (43:38)\nEvent 123:\
  \ {\"msg\": \"hello world\", \"num\": 1, \"value\": 1} (43:43)\nEvent 123: {\"msg\"\
  : \"hello world\", \"num\": 2, \"value\": 65} (43:48)\nEvent 123: {\"msg\": \"hello\
  \ world\", \"num\": 3, \"value\": 10} (43:53)\n//...\n```\n\n让我们看一下服务器日志，了解服务器生成的消息：\n\
  \n```\nServer runs on 127.0.0.1:8080\nSend Logon event\nSend Message event 0\nSend\
  \ Message event 1\nSend Message event 2\nSend Message event 3\n//...\n```\n\n##\
  \ WebSocket\n\nWebSocket 是客户端和服务器之间一种双向、面向消息的流式传输。它构建于 TCP 之上，并使用 HTTP 升级握手。WebSocket\
  \ 是一种基于消息的传输。其简单而极简的 API 抽象了所有复杂性，并免费提供以下额外服务：\n\n- 同源策略强制\n- 与现有 HTTP 基础设施的互操作性\n\
  - 面向消息的通信\n- 子协议协商的可用性\n- 低成本的扩展性\n\n\n\n\n\n## 客户端到服务器通信\n\nWebSocket 是浏览器中最灵活的传输方式之一。API\
  \ 实现了该层，并在客户端与服务器之间以流式方式传递任意应用协议，并且可以在任一端随时发起。\n\n> WebSocket 是一组多个标准：WebSocket\
  \ API 和 WebSocket 协议及其扩展。\n\nWebSocket 可用于以下情况：\n- 当数据的相关性非常关键时\n- 当解决方案非常经常基于海量数据或数据传输时\n\
  \nWebSocket 的优点如下：\n- 它是一个全双工、双向通信通道，通过单个套接字运行\n- 它基于套接字协议提供快速的文件交换\n- 它支持二进制格式\n\
  \nWebSocket 的缺点如下：\n- 它不是 HTTP，可能会被代理服务器阻止\n- 调试比较复杂\n- 它仅被所有浏览器的现代版本支持\n\n以下浏览器受支持：\n\
  - Chrome 14.0+\n- Firefox 11.0+\n- Opera 8.0+\n- Safari 6.0+\n- Internet Explorer\
  \ 10.0+\n\n请记住，WebSocket 使用自定义的 WS 协议而不是 HTTP。\nWebSocket 协议的用例是为在浏览器中运行的应用与服务器之间提供优化的、双向通信通道，而使用\
  \ HTTP 协议是显而易见的。WebSocket 使用自定义 URL 方案，因为 WebSocket 线路协议可以在浏览器之外使用，并且可以通过非 HTTP\
  \ 交换建立，而双向或服务器发起的 HTTP（HyBi）工作组选择采用自定义 URL 方案。让我们来看一下我们示例的客户端代码：\n\n```\nimport\
  \ 'dart:html';\nimport 'dart:convert';\nimport 'dart:typed_data';\nimport 'urls.dart'\
  \ as urls;\n\nvar url = \"ws://${urls.serverAddress}:${urls.serverPort}${urls.dataUrl}\"\
  ;\n\nString get timeStamp {\n  DateTime dt = new DateTime.now();\n  return \" (${dt.minute}:${dt.second})\"\
  ;\n}\n\nresponseHandler(DivElement log, String data) {\n  DivElement item = new\
  \ DivElement();\n  item.text = data + timeStamp;\n  log.insertAdjacentElement('beforebegin',\
  \ item);\n}\n```\n\n首先，我们创建一个 WebSocket 类实例以使用指定的 URL 发起新的连接。然后，我们为 open、error、close\
  \ 和 message 事件创建监听器。正如你所见，API 看起来与我们在上一主题中看到的 EventSource API 非常相似。这是故意的，因为 WebSocket\
  \ 提供类似的功能，并且可以帮助快速从 SSE 解决方案过渡。\n当连接建立后，我们可以向服务器发送数据。由于 WebSocket 对应用负载没有任何假设和约束，我们可以发送任何数据类型，例如\
  \ Map、String 和 Typed：\n\n```\nvoid main() {\n  DivElement log = querySelector(\"\
  #log\");\n  var webSocket = new WebSocket(url);\n  if (webSocket != null) {\n```\n\
  \n```\nresponseHandler(log, \"Connected to server: ${url}\");\nsendData(webSocket);\n\
  });\nwebSocket.onError.listen((Event e)\n    => responseHandler(log, \"Error: ${e}\"\
  ) );\nwebSocket.onClose.listen((CloseEvent e)\n    => responseHandler(log, \"Disconnected\
  \ from server\"));\nwebSocket.onMessage.listen((MessageEvent e)\n    => responseHandler(log,\
  \ \"Event ${e.type}: ${e.data}\"));\n}\n}\nsendData(WebSocket webSocket) {\n  webSocket.send(JSON.encode({'name':'John',\
  \ 'id':1234}));\n  webSocket.sendString(\"Hello World\");\n  webSocket.sendTypedData(new\
  \ Int16List.fromList([1, 2, 3]));\n}\n```\n\n浏览器会自动将接收到的基于文本的数据转换为 DOMString 对象，并将二进制数据转换为\
  \ Blob 对象，然后直接传递给应用。我们可以通过 WebSocket 类的 binaryType 属性强制进行 arrayBuffer 转换，当接收到二进制消息时：\n\
  \n```\nwebSocket.binaryType = \"arraybuffer\";\n```\n\n这是向用户代理提示如何根据 binaryType\
  \ 中的值处理传入二进制数据的完美提示：\n- 如果它等于 `Blob`，则保存到磁盘\n- 如果它等于 `arrayBuffer`，则保留在内存中\n\nBlob\
  \ 对象中的数据是不可变的，表示原始数据。它可能是保存从服务器下载的图像的最佳格式。我们可以直接将该数据传递给图像标签。另一方面，arrayBuffer 对象更适合对二进制数据进行额外处理。在我们的示例中，我们使用了\
  \ UTF-8 编码的文本消息、UTF-8 编码的 JSON 有效负载以及二进制有效负载的 arrayBuffer 对象。WebSocket 类的所有发送方法都是异步的，但它们以客户端排队的确切顺序传递。因此，队列中大量消息的传递会被延迟。为了解决这个问题，应用可以将大消息拆分为小块，并通过\
  \ WebSocket 类的 bufferingAmount 属性监控发送数据，如下所示：\n\n```\nif (webSocket.bufferingAmount\
  \ == 0) {\n  ws.send(nextData);\n}\n```\n\n## 总结\n\n为了总结到目前为止所讨论的内容，我想强调客户端到服务器通信的一些重要方面。基于消息交换数据以使客户端和服务器之间进行数据交换的特殊规则和格式的系统称为通信协议。连接到互联网的任何设备都有唯一的\
  \ IP 地址。从一台设备传输到另一台设备通过互联网的消息会遵循长路由通过协议栈传递。HTTP 是一种基于文本的应用协议，使网络工作。Web 浏览器或独立应用发送请求并打开到\
  \ Web 服务器的连接。Web 服务器遵守请求并关闭到 Web 客户端的连接。\n\nAJAX 是一种技术，允许客户端 JavaScript 代码在不重新加载\
  \ Web 浏览器中当前页面的情况下从服务器请求数据。`HttpRequest`（以前称为 `XMLHttpRequest`）在 AJAX Web 开发技术中起着重要作用。AJAX\
  \ 轮询请求会定期发出请求以获取新信息。长轮询请求始终保持与服务器的打开连接。该连接保持活动状态，直到服务器决定将信息提交回客户端，其中有更改，然后关闭连接。客户端将再次打开与服务器的连接以开始新的长轮询请求。\n\
  \n在 SSE 中，客户端通过初始 HTTP 请求打开与服务器的连接，并且当有新信息可用时，服务器向客户端发送事件。通过 SSE 发送回的响应是使用 `text/event-stream`\
  \ 内容类型提供的纯文本。它包含一个或多个以 `data:` 字符串开头并以换行符结束的字符串行。最后，整个消息以额外的换行符结束。\n\nWebSocket\
  \ 是客户端与服务器之间的双向、面向消息的流式传输。它建立在 TCP 之上，使用 HTTP 升级握手。API 实现了该层，并在客户端与服务器之间以流式方式传递任意应用协议，并且可以在任一端随时发起。\n\
  \n在下一章中，我们将讨论在客户端本地存储数据并突破 Web 应用中 cookie 存储限制的能力。我们还将演示如何使用 Web Storage 并探索更强大、更有用的\
  \ IndexedDB 以在用户的 Web 浏览器中存储大量数据。\n"
- "## 高级存储\n\nCookie 由 Web 浏览器透明处理。如果其 URL 匹配域并且 cookie 中指定的路径匹配，则它们会添加到每个 HTTP 请求的标头中。Cookie\
  \ 可通过 `document.cookie` 属性访问。请记住，当你创建 cookie 时，你以特殊文本格式指定 cookie 的名称、值、到期日期，以及可选的路径和域。你只能按名称查找\
  \ cookie 并获取值，因为在创建 cookie 时指定的所有其他信息都由 Web 浏览器使用，对你不可用。我们创建了 `cookies.dart` 文件以保留原始\
  \ cookie API 的小型库包装器，以避免样板代码和代码重复，这允许你轻松地从任何应用中设置、获取和删除 cookie。Cookie 使用源自 RFC 1123\
  \ 国际格式的日期格式，即 Wdy, DD Mon YYYY HH:MM:SS GMT。让我们更详细地看一下：\n- **Wdy**：这是代表星期几的三个字母缩写，后跟一个逗号\n\
  - **DD**：这是代表月份中某一天的两个数字\n- **Mon**：这是代表月份名称的三个字母\n- **YYYY**：这是代表年份的四个数字\n- **HH**：这是代表小时的两个数字\n\
  - **MM**：这是代表分钟的两个数字\n- **SS**：这是代表秒的两个数字\n\n你可以在此示例中看到日期：Thu, 09 Oct 2014 17:16:29\
  \ GMT。\n\n让我们通过以下代码并看看 Dart 如何访问 cookie。我们特别导入 `dart:html` 包以使 `document.cookies`\
  \ 在我们的代码中可用。`intl.dart` 包是因 `toUTCString` 函数中使用 DateFormat 而导入，用于根据 days 属性中的值计算\
  \ cookie 的 UTC 格式到期日期并将其转换为字符串。如果 days 的值小于一，则 toUTCString 函数返回空字符串。要使用 setCookie\
  \ 函数创建 cookie，我们需要指定 cookie 的名称、值和到期天数。我们也可以提供可选的路径和域信息。在实践中，你根本不能在 cookie 中使用非\
  \ ASCII 字符。要使用 Unicode、控制代码或其他任意字节序列，你必须使用最流行的 UTF-8-inside-URL 编码，该编码由 Uri 类的不同编码方法生成。要通过\
  \ getCookie 返回 cookie，我们只需要 cookie 的名称。最后，你会找到 removeCookie 函数。\n\n```\nlibrary\
  \ cookie;\n\nimport 'dart:html';\nimport 'package:intl/intl.dart';\n```\n\n// Number\
  \ milliseconds in one day\nvar theDay = 24*60*60*1000;\n\nDateFormat get cookieFormat\
  \ =>\n    new DateFormat(\"EEE, dd MMM yyyy HH:mm:ss\");\n\nString toUTCString(int\
  \ days) {\n    if (days > 0) {\n        var date = new DateTime.now();\n       \
  \ date = new DateTime.fromMillisecondsSinceEpoch(\n            date.millisecondsSinceEpoch\
  \ + days*24*60*60*1000);\n        return \" expires=${cookieFormat.format(date)}\
  \ GMT\";\n    } else {\n        return \" \";\n    }\n}\n\nvoid setCookie(String\
  \ name, String value, int days,\n                {String path:'/', String domain:null})\
  \ {\n    StringBuffer sb = new StringBuffer(\n        \"${Uri.encodeQueryComponent(name)}=\"\
  \ +\n        \"${Uri.encodeQueryComponent(value)};\");\n    sb.write(toUTCString(days));\n\
  \    sb.write(\"path=${Uri.encodeFull(path)}; \");\n    if (domain != null) {\n\
  \        sb.write(\"domain=${Uri.encodeFull(domain)}; \");\n    }\n    document.cookie\
  \ = sb.toString();\n}\n\nString getCookie(String name) {\n    var cName = name +\
  \ \"=\";\n    document.cookie.split(\"; \").forEach((String cookie) {\n        if\
  \ (cookie.startsWith(cName)) {\n            return cookie.substring(cName.length);\n\
  \        }\n    });\n    return null;\n}\n\nvoid removeCookie(String name) {\n \
  \   setCookie(name, '', -1);\n}\n\n## Advanced Storage\n\nCookie 的域告诉浏览器 cookie\
  \ 应该发送到的域，如果没有指定，则 cookie 的域变为页面的域。它允许 cookie 跨子域，但不允许 cookie 跨域。域的路径是 cookie 在其中活动的位于域根目录下的目录。\n\
  \n为了更好地理解 cookie 在现实世界中的使用，你可以查看 `shopping_cart_cookie` 项目。该项目非常庞大，因此我将向你展示一些小的代码片段并为你指明正确的方向。该项目包含以下主要类：\n\
  \n- `Product`：此类描述购物车中的商品，具有 ID、描述和价格。用户可以指定想要购买的商品数量，因此金额可以通过将数量乘以价格来计算。\n- `ShoppingModel`：此类帮助你从\
  \ `product.json` 文件中获取商品并返回包含商品列表的 `Future` 实例。\n- `ShoppingController`：此类渲染商品网格并更新每个商品的金额以及总金额。我们可以在表格主体中发送引用。该引用在元素上保存总金额以及通过构造函数注入的\
  \ `ShoppingModel` 和 `StorageManager` 类的实例。\n\n我们将在构造函数中特别调用模型中的 `getProducts`，以便从服务器返回数据，并在数据准备好时调用\
  \ `_init` 方法来初始化我们的应用程序。`readQuantity` 方法首次被调用以检查并返回保存在 cookie 中的商品数量。稍后在代码中，我们将根据数量和价格调用商品的\
  \ `calculateAmount`，如下所示的代码：\n\n```\nShoppingController(this.tBody, this.totalAmount,\
  \ this.service,\n    this.storage) {\n    model.getProducts().then((List<Product>\
  \ products) {\n        _products = products;\n        _init();\n    });\n}\n\n_init()\
  \ {\n    update().then((value) {\n        draw();\n        drawTotal();\n    });\n\
  }\n```\n\n```\nFuture update() {\n    return Future.forEach(_products, (Product\
  \ product) {\n        // Read quantity of product from cookie\n        return readQuantity(product);\n\
  \    });\n}\n\nFuture readQuantity(Product product) {\n    return storage.getItem(Product.toCookieName(product))\n\
  \    .then((String quantity) {\n        if (quantity != null && quantity.length\
  \ > 0) {\n            product.quantity = int.parse(quantity);\n        } else {\n\
  \            product.quantity = 0;\n        }\n    });\n}\n//...\n```\n\nProduct.toCookieName\
  \ 方法使用 Product.NAME 和 product.id 的组合创建一个唯一的字符串标识符。现在启动应用程序并在 Dartium Web 浏览器中打开\
  \ index.html 文件以查看商品列表。\n\n![](img/52c05b53a56abd53584e4fed738ed509_469_0.png)\n\
  \n## Advanced Storage\n\n我们可以在 Web 浏览器中检查 cookie 的存在。在 Dartium 中，从 Tools 菜单项打开开发者工具并选择\
  \ Resources 选项卡，如以下屏幕截图所示：\n\n![](img/52c05b53a56abd53584e4fed738ed509_470_0.png)\n\
  \n选择 Cookies 并选择 localhost，以确保没有 cookie 与我们的 Web 服务器关联。\n\n![](img/52c05b53a56abd53584e4fed738ed509_470_1.png)\n\
  \n如果用户通过文本输入字段更改任何商品的数量，则商品数量和所选商品的总数量将被重新计算。同时，我们的代码会调用 ShoppingController 类的 saveQuantity\
  \ 方法，如下所示：\n\n```\nsaveQuantity(Product product) {\n    if (product.quantity ==\
  \ 0) {\n        storage.removeItem(Product.toCookieName(product));\n    } else {\n\
  \        storage.setItem(Product.toCookieName(product),\n            product.quantity.toString());\n\
  \    }\n}\n```\n\n如果数量字段中的数字等于零，则商品将从 cookie 中移除。在其他情况下，我们将在 cookie 中创建或更新数量值。\n\
  \n![](img/52c05b53a56abd53584e4fed738ed509_471_0.png)\n\n让我们检查前面的信息。返回 Resources\
  \ 选项卡并导航到 localhost 树项。单击窗口底部的刷新图标以查看与我们的服务器关联的 cookie 列表。\n\n![](img/52c05b53a56abd53584e4fed738ed509_471_1.png)\n\
  \n现在，关闭 index.html 页面并再次打开它。有关所选商品及其指定数量和数量的信息将在这里可用。单击 Check Out 按钮以调用 cart.checkOut\
  \ 方法来显示已付款商品的消息并从中移除 cookie。代码如下：\n\n```\ncheckOut.onClick.listen((Event event)\
  \ {\n  cart.checkOut();\n});\n```\n\n以下屏幕截图显示了 resulting 消息：\n\n![](img/52c05b53a56abd53584e4fed738ed509_472_0.png)\n\
  \nCookie 是一种通用机制，有助于在 Web 浏览器中持久保存用户特定数据。在尝试以下角色时，它们可能非常有用：\n\n- 跟踪 cookie 有助于编译浏览历史的长期记录。\n\
  - Web 服务器使用的身份验证 cookie 有助于你知道用户是否已登录。\n- 会话 cookie 在用户导航到网站时存在，并在指定间隔后过期，或如果用户通过服务器逻辑再次登录。\n\
  - 持久 cookie 比会话 cookie 存在时间更长，可能用于保存有关用户的关键信息，例如姓名、姓氏等。\n- 安全 cookie 仅通过启用安全属性的\
  \ HTTPS 使用，以确保客户端和服务器之间 cookie 传输始终安全。\n- 第三方 cookie 与第一方 cookie 相反，它们不属于 Web 浏览器中显示的同一域。从第三方域呈现的网页上的不同内容可能包含脚本，有助于跟踪用户的浏览器历史记录以进行有效广告。\n\
  \n你可以将不同的角色组合起来以满足业务逻辑的特定要求。以下是拥有 cookie 的好处：\n\n- **便利性：** Cookie 可以记住你访问过的所有网站，以及表单中的信息，如住宅或商业地址、电子邮件地址、用户名等\n\
  - **个性化：** Cookie 可以存储偏好设置，有助于每个用户个性化网站内容\n- **有效广告：** Cookie 可以帮助运行营销活动，为特定用户提供相关产品或服务\n\
  - **控制便捷：** Cookie 可以通过客户端 Web 浏览器清除或禁用\n\n以下是 cookie 的缺点：\n\n- **隐私：** Cookie 会跟踪你访问过的所有网站\n\
  - **安全：** 在不同 Web 浏览器上实现 cookie 会伴随各种安全漏洞的检测\n- **限制：** Cookie 每个 cookie 限制为 4095\
  \ 字节\n- **数据：** Cookie 可能会为每个请求带来过多的额外数据开销\n\n因此，cookie 的主要目的是使客户端到服务器的通信具有状态性。如果你只需要仅在客户端保存数据或离线工作，你可以使用其他技术，其中之一是\
  \ Web Storage。\n\n## Web Storage\n\n**Web Storage**（或 DOM 存储）代表了一种比 cookie 更优且更安全的方式在客户端持久保存数据。Web\
  \ Storage 在以下情况下更好：\n\n- 当你需要更大的存储容量时（它可以保留每个可用存储 5 - 10 MB，具体取决于 Web 浏览器）\n- 当你不需要与服务器通信来管理客户端数据时\n\
  - 当你不希望存储的数据过期时\n- 当存储的数据跨同一浏览器的不同标签页或窗口时\n\n有两个 Web Storage 对象（`Session` 和 `Local`）可用于在\
  \ Web 浏览器中持久保存用户数据，持续时间为会话长度和无限期。它们都具有通过 Storage 接口声明的相似简单 API。Web Storage 具有事件驱动的实现。每当存储区域发生变化时，就会触发\
  \ storage 事件。\n\n\n\n\n\n## Session 存储\n\nSession 存储可通过 `window.sessionStorage`\
  \ 属性访问。它旨在在同一标签页或窗口中保存短暂数据，并且仅在同一域的页面之间共享。浏览器每次用户打开新标签页或窗口时都会创建一个新的 session storage\
  \ 数据库。\n\n## Local 存储\n\n与 Session 存储相反，Local 存储可通过 `window.localStorage` 属性访问，允许你保存比单个会话更长的数据。Local\
  \ 存储将所有数据保存在一个特殊的本地存储区域中，不受标签页或窗口生命周期的限制。本地存储区域在不同的标签页和窗口之间共享，在多事务场景中非常方便。\n\n让我们看看如何将上一节\
  \ Cookies 部分的示例更改为在 Web Storage 中使用。我们不会完全删除 cookie，以便有机会比较不同的持久化技术。打开 shopping_cart_web_storage\
  \ 项目。在以下代码中，我们添加业务逻辑以使用 StorageManager 类检查 Web Storage 是否得到 Web 浏览器支持：\n\n```dart\n\
  abstract class StorageManager {\n  factory StorageManager() {\n    if (WebStorageManager.supported)\
  \ {\n      return new WebStorageManager();\n    } else {\n      return new CookieStorageManager();\n\
  \    }\n  }\n\n  Future<String> getItem(key);\n  Future setItem(key, value);\n \
  \ Future removeItem(key);\n}\n```\n\n在前面的代码中，你可以看到新的 WebStorageManager 类。很难确定 Web\
  \ 浏览器是否支持 Web Storage。你可以在以下使用 `supported` getter 方法的代码中找到一种可能的解决方案。`getItem` 函数返回与给定键关联的值。`setItem`\
  \ 函数在此方法中设置键值对，最后一个方法删除指定键的项目。代码如下：\n\n```dart\nclass WebStorageManager implements\
  \ StorageManager {\n  static bool get supported {\n    if (window.localStorage !=\
  \ null) {\n      try {\n        window.localStorage[\"__name__\"] = \"__test__\"\
  ;\n        window.localStorage.remove(\"__name__\");\n        return true;\n   \
  \   } catch(e) {\n        return false;\n      }\n    } else {\n      return false;\n\
  \    }\n  }\n\n  Future<String> getItem(key) {\n    return new Future.sync(() {\n\
  \      return window.localStorage[key];\n    });\n  }\n\n  Future setItem(key, value)\
  \ {\n    return new Future.sync(() {\n      window.localStorage[key] = value;\n\
  \    });\n  }\n\n  Future removeItem(key) {\n    return new Future.sync(() {\n \
  \     window.localStorage.remove(key);\n    });\n  }\n}\n```\n\n以下屏幕截图显示了执行程序的结果：\n\
  \n![](img/52c05b53a56abd53584e4fed738ed509_475_0.png)\n\n你可以在我们看到 cookie 的同一位置找到有关本地存储状态的信息。展开\
  \ Local Storage 树项并选择 localhost 选项以查看本地存储数据：\n\n![](img/52c05b53a56abd53584e4fed738ed509_476_0.png)\n\
  \n现在，我们可以使用 Web Storage 和 cookie 为客户端存储数据。我们将继续穿越高级存储之旅，下一个目标是 Web SQL。\n\n## Web\
  \ SQL\n\nWeb SQL 由 Apple 引入，基于免费数据库 SQLite。它很快将被淘汰，我只在这里添加它以向你展示它如何被使用，以及我们如何在不出现故障的情况下迁移到其他高级技术。在以下代码中，我们创建了一个新的\
  \ shopping_cart_web_sql 项目，作为 Web Storage 部分项目的副本，并在 StorageManager 类中添加了 WebSQLStorageManager：\n\
  \n```dart\nabstract class StorageManager {\n    factory StorageManager() {\n   \
  \     if (WebSQLStorageManager.supported) {\n            return new WebSQLStorageManager();\n\
  \        } else if (WebStorageManager.supported) {\n            return new WebStorageManager();\n\
  \        } else {\n            return new CookieStorageManager();\n        }\n \
  \   }\n\n    Future<String> getItem(key);\n    Future setItem(key, value);\n   \
  \ Future removeItem(key);\n}\n```\n\n首先，检查 Web 浏览器是否支持 Web SQL，并在成功时实例化它。你应该指定要使用的数据库的版本和初始大小。Web\
  \ 浏览器对 Web SQL 的支持可以通过 `SqlDatabase` 类的 `supported` 属性快速检查。Web SQL 在使用前需要一些准备。首先，我们需要打开数据库。数据库打开后，我们可以创建表（如果不存在）。Web\
  \ SQL 的 API 比 cookie 和 Web Storage 更复杂，每个方法的大小呈指数级增长。至关重要的是，所有方法都必须执行非常具体的 SQL 语句。WebSQL\
  \ 还支持读写事务。当事务开始时，你需要指定将分配给 SQL 参数的键。`SqlResultSet` 的实例跟踪事务。`SqlResultSet` 的 `rows.isEmpty`\
  \ 属性是一个重要的属性，它告诉我们确切返回了多少行，如以下代码所示：\n\n```dart\nclass WebSQLStorageManager implements\
  \ StorageManager {\n\n  static const SHOPPING = \"SHOPPING\";\n  static const PRODUCT\
  \ = \"PRODUCT\";\n  static const TRANS_MODE = \"readwrite\";\n  static final String\
  \ VERSION = \"1\";\n  static const int SIZE = 1048576;\n\n  SqlDatabase _database;\n\
  \  static bool get supported => SqlDatabase.supported;\n  Future<SqlDatabase> _getDatabase(\n\
  \    String dbName, String storeName) {\n    if (_database == null) {\n      _database\
  \ = window.openDatabase(dbName, VERSION,\n        dbName, SIZE);\n      var sql\
  \ = 'CREATE TABLE IF NOT EXISTS ' +\n        storeName +\n        ' (id NVARCHAR(32)\
  \ UNIQUE PRIMARY KEY, value TEXT)';\n      var completer = new Completer();\n  \
  \    _database.transaction((SqlTransaction tx) {\n        tx.executeSql(sql, [],\n\
  \          (SqlTransaction txn, SqlResultSet result) {\n            completer.complete(_database);\n\
  \          }, (SqlTransaction transaction, SqlError error) {\n            completer.completeError(error);\n\
  \          });\n      }, (error) => completer.completeError(error));\n      return\
  \ completer.future;\n    } else {\n      return new Future.sync(() => _database);\n\
  \    }\n  }\n\n  Future<String> getItem(key) {\n    var sql = 'SELECT value FROM\
  \ $PRODUCT WHERE id = ?';\n    var completer = new Completer();\n    _getDatabase(SHOPPING,\
  \ PRODUCT).then((SqlDatabase database) {\n      database.readTransaction((SqlTransaction\
  \ tx) {\n        tx.executeSql(sql, [key],\n          (SqlTransaction txn, SqlResultSet\
  \ result) {\n            if (result.rows.isEmpty) {\n              return completer.complete(null);\n\
  \            } else {\n              Map row = result.rows.first;\n            \
  \  return completer.complete(row['value']);\n            }\n          }, (SqlTransaction\
  \ transaction, SqlError error) {\n            completer.completeError(error);\n\
  \          });\n      });\n    });\n    return completer.future;\n  }\n}\n```\n\n\
  对于创建和更新操作，我们使用以下事务并指定特殊的 SQL 语句，并且我们还需要指定 SQL 参数 key 和 value：\n\n```dart\nFuture\
  \ setItem(key, value) {\n  var sql = 'INSERT OR REPLACE INTO $PRODUCT (id, value)\
  \ ' +\n      'VALUES (?, ?)';\n  var completer = new Completer();\n  _getDatabase(SHOPPING,\
  \ PRODUCT).then((SqlDatabase database) {\n    database.transaction((SqlTransaction\
  \ tx) {\n      tx.executeSql(sql, [key, value],\n        (SqlTransaction txn, SqlResultSet\
  \ result) {\n          return completer.complete(value);\n        }, (SqlTransaction\
  \ transaction, SqlError error) {\n          completer.completeError(error);\n  \
  \      });\n    }, (error) => completer.completeError(error));\n  });\n  return\
  \ completer.future;\n}\n```\n\n要删除项目，我们使用以下事务并指定将分配给 SQL 参数的 key 参数：\n\n```dart\n\
  Future removeItem(key) {\n  var sql = 'DELETE FROM $PRODUCT WHERE id = ?';\n  var\
  \ completer = new Completer();\n  _getDatabase(SHOPPING, PRODUCT).then((SqlDatabase\
  \ database) {\n    database.transaction((SqlTransaction tx) {\n      tx.executeSql(sql,\
  \ [key],\n        (SqlTransaction txn, SqlResultSet result) {\n          return\
  \ completer.complete();\n        }, (SqlTransaction transaction, SqlError error)\
  \ {\n          completer.completeError(error);\n        });\n    }, (error) => completer.completeError(error));\n\
  \  });\n  return completer.future;\n}\n```\n\n启动我们的应用程序并更改产品数量。从 **Resources** 选项卡展开\
  \ **Web SQL** 树项以查看 Web SQL 存储数据。以下屏幕截图显示了 **SHOPPING** 数据库和包含存储数据的 **PRODUCT**\
  \ 表：\n\n![](img/52c05b53a56abd53584e4fed738ed509_479_0.png)\n\nWeb SQL 数据库 API 实际上并不是\
  \ HTML5 规范的一部分。因此，如果你有使用 Web SQL 的代码，是时候迁移到 IndexedDB 了。\n\n\n\n\n\n## IndexedDB\n\
  \n**IndexedDB** 由 Oracle 推出，并迅速流行起来。它是一种 Not Only SQL（NoSQL）数据库。IndexedDB API 是一个功能更强大、也复杂得多的\
  \ API。IndexedDB 具有以下显著优势：\n\n- 它通过最大限度地减少 HTTP 请求数量，提高了 Web 程序的响应速度和运行速度。\n- 它提供了更大的数据存储空间，不受\
  \ Web Storage 的限制。\n- 它支持离线工作。\n- NoSQL 数据库可帮助您直接处理 Dart 和 JavaScript 对象。\n- 它支持快速索引、对象搜索，以及每个事务的细粒度锁定。\n\
  - 它支持同步和异步 API。\n\n其中一个主要缺点是，如果你来自关系型数据库领域，可能很难理解它。在 IndexedDB 中，我们可以存储大量结构化数据、图像、数组和整个对象；你只需用键为它们建立索引。它遵循同源策略，因此我们无法跨不同域访问数据。如果你仍在使用\
  \ Web SQL 数据库，那么是时候迁移到 IndexedDB 了，因为 Web SQL 数据库已于 2010 年 11 月被**万维网联盟（W3C）**弃用。\n\
  \n> IndexedDB 是一个索引表系统。\n\nIndexedDB 对单个数据库条目的大小没有任何限制，但可能对每个数据库的条目总数施加限制。我们将使用异步\
  \ API，因为它适用于大多数场景，包括 Web Workers。IndexedDB 是一个真正的数据库；因此，在使用它之前，我们需要指定数据库模式、打开连接，并在事务中开始使用它来检索和更新数据。在这种情况下，它与\
  \ Web SQL 解决方案非常接近，但简单得多。让我们看看如何在我们的示例中使用 IndexedDB。我们将使用 Dart SDK 中的 `dart:indexed_db`\
  \ 包来处理 IndexedDB。你可以从 *Web SQL* 部分复制一份项目，将其重命名为 `shopping_cart_indexed_db`，并使用 `IndexedDBStorageManager`\
  \ 代替 `WebSQLStorageManager`。代码如下：\n\n```dart\nabstract class StorageManager {\n\
  \    factory StorageManager() {\n        if (IndexedDBStorageManager.supported)\
  \ {\n            return new IndexedDBStorageManager();\n        } else if (WebStorageManager.supported)\
  \ {\n            return new WebStorageManager();\n        } else {\n           \
  \ return new CookieStorageManager();\n        }\n    }\n\n    Future<String> getItem(key);\n\
  \    Future setItem(key, value);\n    Future removeItem(key);\n}\n```\n\n上述代码展示了\
  \ `IndexedDBStorageManager` 类。我们构建了一个特殊的 `_getDatabase` 方法来获取 `Database` 类的实例。如前所述，在使用\
  \ IndexedDB 之前，我们需要打开 IndexedDB 数据库。在下面的代码中，我们使用 `window.indexedDB.open` 方法来打开数据库。接下来，我们需要检查存储对象是否存在于数据库的\
  \ `objectStoreNames` 数组中。如果不存在，我们必须关闭数据库，并使用更高的版本号重新打开。由于这个过程是异步的，我们在 `onUpgradeNeeded`\
  \ 监听器中创建存储对象的新实例。对数据库对象的每次操作都发生在事务内部。因此，我们每次都会创建一个新事务，并在 `startTransaction` 方法中返回\
  \ `ObjectStore` 实例。我们将通过 `getObject` 方法返回 `ObjectStore` 的值。要在数据库中设置条目，我们使用 `ObjectStore`\
  \ 的 `put` 方法。要从存储中移除对象，只需调用 `delete` 方法，如下代码所示：\n\n```dart\nclass IndexedDBStorageManager\
  \ implements StorageManager {\n\n  Database _database;\n\n  static const SHOPPING\
  \ = \"SHOPPING\";\n  static const PRODUCT = \"PRODUCT\";\n  static const TRANS_MODE\
  \ = \"readwrite\";\n  Future _getDatabase(String dbName, String storeName) {\n \
  \   if (_database == null) {\n\n      return window.indexedDB.open(dbName).then((Database\
  \ d) {\n        _database = d;\n        if (!_database.objectStoreNames.contains(storeName))\
  \ {\n          _database.close();\n          return window.indexedDB.open(dbName,\n\
  \              version: (d.version as int) + 1,\n              onUpgradeNeeded:\
  \ (e) {\n                Database d = e.target.result;\n                d.createObjectStore(storeName);\n\
  \              }).then((Database d) {\n            _database = d;\n            return\
  \ _database;\n          });\n        }\n        return _database;\n      });\n \
  \   } else {\n      return new Future.sync(() => _database);\n    }\n  }\n  Future<ObjectStore>\
  \ startTransaction(String storeName) {\n    return _getDatabase(SHOPPING, PRODUCT)\n\
  \        .then((Database database) {\n            Transaction transaction =\n  \
  \              _database.transactionStore(storeName, TRANS_MODE);\n            return\
  \ transaction.objectStore(storeName);\n        });\n  }\n  Future<String> getItem(key)\
  \ {\n    return new Future.sync(() {\n        return startTransaction(PRODUCT).then((ObjectStore\
  \ store) {\n            return store.getObject(key);\n        });\n    });\n  }\n\
  \  Future setItem(key, value) {\n    return new Future.sync(() {\n        return\
  \ startTransaction(PRODUCT).then((ObjectStore store) {\n            return store.put(value,\
  \ key);\n        });\n    });\n  }\n  Future removeItem(key) {\n    return new Future.sync(()\
  \ {\n        return startTransaction(PRODUCT).then((ObjectStore store) {\n     \
  \       return store.delete(key);\n        });\n    });\n  }\n}\n```\n\n就这样。我们可以对\
  \ `ObjectStore` 中的数据进行所有操作。`ObjectStore` 类实例通过 `Transaction` 类返回这一事实表明，原始实例中的所有步骤都将被事务包围。让我们展开\
  \ Resources 选项卡中的 IndexedDB 树项，查看 `SHOPPING` 数据库。\n\n![](img/52c05b53a56abd53584e4fed738ed509_483_0.png)\n\
  \n数据库的版本号为 2。现在，选择 `PRODUCT` 树项，你会看到同名包含我们的数据。\n\n![](img/52c05b53a56abd53584e4fed738ed509_483_1.png)\n\
  \n与 Web SQL 相比，IndexedDB 更简单、更灵活。它使用索引在事务中访问数据库中的对象。\n\n## 总结\n\n总而言之，我们将重点介绍有关高级存储空间的一些重要事实。\n\
  \nCookie 的概念首次引入于 Netscape 浏览器，后来迁移到 Internet Explorer。它至今仍然很重要。为了实现有状态通信，Web 浏览器在其子目录中提供了一个区域，用于存储和访问状态信息。该区域以及存储在该区域中的信息称为\
  \ cookie。Cookie 的域告诉浏览器应将 Cookie 发送到哪个域。它允许 Cookie 跨子域，但不允许跨域。路径是 Cookie 生效的域根目录中的目录。Cookie\
  \ 是帮助在 Web 浏览器中持久化用户特定数据的通用机制。\n\nWeb Storage 代表了一种比 Cookie 更好、更安全的客户端数据持久化机制。有两个\
  \ Web Storage 对象（Session 和 Local），可用于在 Web 浏览器中将会话长度的用户数据持久化，也可以无限期持久化。两者都通过 Storage\
  \ 接口声明了类似的简单 API。\n\nWeb SQL 由 Apple 推出，基于免费数据库 SQLite。它很快就会被停止使用，我们在这里使用它只是为了了解它的用法，以及如何轻松迁移到其他先进技术。\n\
  \n在 IndexedDB 中，我们可以存储大量结构化数据、图像、数组和整个对象，只需用键为它们建立索引。IndexedDB 对单个数据库条目的大小没有任何限制，但可能对每个数据库的条目总数施加限制。\n\
  \n在下一章中，我们将演示如何在 Dart 中使用不同的 HTML5 功能。\n"
- "# 11 支持其他 HTML5 功能\n\nHTML5 旨在提供丰富的跨平台内容，而无需使用额外的插件。在本章中，我们将学习如何在 Dart 中使用不同的 HTML5\
  \ 功能。我们将涵盖以下主题：\n\n- 通知 API。\n- 原生拖放 API。\n- 地理定位 API。\n- Canvas。\n\n## 通知 API\n\
  \nWeb 应用程序中发生的过程是异步的，随着时间的推移，它们会生成事件消息，以提醒最终用户进程执行的开始、结束或进度。Web 通知 API 允许你在网页上下文之外显示通知。用户代理会决定通知的最佳呈现方式。这方面取决于其运行所在的设备。通常，它可以在以下区域显示通知：\n\
  \n- 在显示器的一个角落。\n- 在用户代理内的某个区域。\n- 在移动设备的主屏幕上。\n\n\n\n\n\n```\nNotification notification\
  \ =\n    new Notification('My Notification', body: \"Hello World\");\n}\n});\n}\n\
  ```\n\n在你向用户发送任何通知之前，网站必须拥有权限。你可以让网站自动发送通知，也可以先通过权限请求来发送。当API试图与web上下文之外的内容交互时，这是一个常见需求，尤其是为了避免向用户发送无用的通知。要查看通知设置，请按照以下步骤操作：\n\
  \n1. 在Dartium中打开**设置**选项，并在搜索字段中输入`notifications`，如下面的截图所示：\n\n    ![](img/52c05b53a56abd53584e4fed738ed509_487_0.png)\n\
  \n2. 通过点击同名按钮打开**内容**设置弹出对话框，然后向下滚动找到**通知**设置：\n\n    ![](img/52c05b53a56abd53584e4fed738ed509_487_1.png)\n\
  \n3. 选择推荐选项，然后点击**管理例外**按钮打开**通知例外**对话框。目前，其中不会包含我们的网站，如下面的截图所示：\n\n    ![](img/52c05b53a56abd53584e4fed738ed509_488_0.png)\n\
  \n4. 现在，运行应用程序并点击**通知**按钮。如下面的截图所示，**Notification**类的`requestPermission`静态方法请求权限以允许`localhost`的桌面通知：\n\
  \n    ![](img/52c05b53a56abd53584e4fed738ed509_488_1.png)\n\n5. 你可以允许或拒绝该网站的通知。你的选择将以所选权限的值来完成未来的权限请求。被允许的桌面通知会被添加到**通知例外**列表中。现在，再次打开**通知例外**对话框查看你的网站，如下面的截图所示：\n\
  \n    ![](img/52c05b53a56abd53584e4fed738ed509_489_0.png)\n\n6. 下一步是创建通知。只需指定通知的标题即可创建一个原始通知。`Notification`类的构造函数具有可选属性，可以帮助我们创建带有正文和图标的通知。实例化后的通知会尽快显示，如下面的截图所示：\n\
  \n    ![](img/52c05b53a56abd53584e4fed738ed509_489_1.png)\n\n通知会触发以下四个事件，用于跟踪通知的当前状态：\n\
  \n- `show`：当通知显示时触发该事件\n- `click`：当用户点击通知时触发该事件\n- `close`：当通知关闭时触发该事件\n- `error`：当显示通知时出现错误时触发该事件\n\
  \n## 支持其他HTML5功能\n\n通知在用户关闭之前会一直保持打开状态，但你可以使用`Notification`类的`close`方法通过程序关闭它们，如下面的代码所示：\n\
  \n```\nvoid sendNotification() {\n    Notification.requestPermission().then((String\
  \ permission) {\n        if (permission == \"granted\") {\n            Notification\
  \ notification =\n                new Notification('My Notification', body: \"Hello\
  \ World\");\n            notification.onShow.listen((Event event) {\n          \
  \      new Timer(new Duration(seconds:2), () {\n                    notification.close();\n\
  \                });\n            });\n        }\n    });\n}\n```\n\n## 防止重复通知\n\
  \n每次单击应用程序中的“通知”按钮时，web通知API都会生成新通知，并将其放在前一个通知之上。类似的通知可以使用以下tag属性进行标记，以防止用户桌面上堆满数百个类似的通知：\n\
  \n```\nvoid sendNotification() {\n    Notification.requestPermission().then((String\
  \ permission) {\n        if (permission == \"granted\") {\n            Notification\
  \ notification =\n                new Notification('My Notification', body: \"Hello\
  \ World\",\n                    tag: \"myNotification\");\n            notification.onShow.listen((Event\
  \ event) {\n                new Timer(new Duration(seconds:2), () {\n          \
  \          notification.close();\n                });\n            });\n       \
  \ }\n    });\n}\n```\n\n现在，当你使用相同的`tag`生成通知时，web通知API会移除前一个通知并添加新通知。Web通知规范尚不稳定，并且仅受Chrome、Firefox、Safari和Opera等最新版本的web浏览器支持。\n\
  \n## 原生拖放API\n\n**拖放**是一种将指针设备的移动和点击转换为软件可识别的特殊命令的方式，以便快速访问程序的常用功能。用户抓取一个虚拟对象，将其拖到另一个位置或其他虚拟对象上，然后放到那里。原生浏览器对拖放的支持意味着更快速、响应更灵敏、更直观的web应用程序。在使用拖放功能之前，请确保你有可拖拽的内容。\n\
  \n## 可拖拽内容\n\n抽象`Element`类有一个`draggable`属性，用于指示元素是否可以被拖放。由于所有DOM元素都源自`Element`抽象类，这意味着它们都默认支持拖放操作。要使元素可拖拽，我们需要将其`draggable`属性设置为`true`。可以使用以下代码完成：\n\
  \n```\nvar dragSource = querySelector(\"#sample_drag_id\");\ndragSource.draggable\
  \ = true;\n```\n\n或者，你可以使用以下HTML标记来完成：\n\n```\n<p id=\"sample_dnd_id\" draggable=\"\
  true\">Drag me!</p>\n```\n\n如果你想防止可拖拽元素的文本内容被选中，你可以对该元素进行样式设置，如下面的代码所示：\n\n```\n\
  [draggable] {\n  -moz-user-select: none;\n  -khtml-user-select: none;\n  -webkit-user-select:\
  \ none;\n  user-select: none;\n  -khtml-user-drag: element;\n  -webkit-user-drag:\
  \ element;\n}\n```\n\n让我们打开`drag_and_drop`项目并运行它。在下面的截图中，你会看到你可以在浏览器窗口内拖动文本元素，但无法放置它：\n\
  \n![](img/52c05b53a56abd53584e4fed738ed509_492_0.png)\n\n> 在拖拽操作期间，原生拖放API仅由拖拽事件触发，而非鼠标事件。\n\
  \n## 拖放事件\n\n原生拖放API触发以下事件：\n\n- `dragstart`：当拖拽开始时，在该元素上触发该事件。可在侦听器中设置拖拽数据和要与拖拽操作关联的图像等信息。\n\
  - `dragenter`：当拖拽开始后光标首次悬停在一个元素上时触发该事件。默认不允许放置操作。有一个或多个侦听器执行拖放操作。通常，侦听器会高亮或标记可以放置的放置元素。\n\
  - `dragover`：当光标悬停在一个元素上且拖拽正在进行时触发该事件。\n- `dragleave`：当拖拽过程中光标离开一个元素时触发该事件。侦听器会从可以放置的元素上移除高亮或标记。\n\
  - `drag`：在触发`dragstart`事件的元素上触发该事件。\n- **drop**：在发生放置的元素上触发该事件。仅当允许放置时才会触发。用户可以通过按*Esc*键或在无效放置区域释放鼠标按钮来取消放置操作。\n\
  - **dragend**：在开始拖拽的元素上触发该事件，以告知拖拽操作已完成，无论是否成功。\n\n我们将继续从我们的示例中使元素可拖拽。我们需要为`dragstart`事件添加一个侦听器，并在侦听器中设置拖拽数据，如下所示：\n\
  \n```\nvar dragSource = querySelector(\"#sample_drag_id\")\n..draggable = true\n\
  ..onDragStart.listen((MouseEvent event) {\n  //...\n});\n```\n\n如果元素被设置为可拖拽，你将无法通过鼠标点击并拖拽来选择文本。\n\
  \n![](img/52c05b53a56abd53584e4fed738ed509_493_0.png)\n\n> 用户必须按住Alt键才能用鼠标选择文本。\n\
  \n## 拖动数据\n\n每个拖拽事件都有一个`dataTransfer`属性，用于保存与拖拽操作关联的数据。如果你拖拽选中的文本，则关联数据就是文本。如果你拖拽图像，则关联数据就是图像本身。拖拽数据结合了数据格式的字符串表示和数据值。我们将在`dragenter`和`dragover`事件的侦听器中使用数据格式来检查是否允许放置操作。你可以通过多次使用不同格式调用`setData`方法来设置多个拖拽数据。要删除它们，请调用`dataTransfer`属性的`clearData`方法，如下面的代码所示：\n\
  \n```\nvar dragSource = querySelector(\"#sample_dnd_id\")\n..draggable = true\n\
  ..onDragStart.listen((MouseEvent event) {\n  event.dataTransfer.setData(\"text/plain\"\
  , \"I'm draggable\");\n  event.dataTransfer.setData(\"text/data\", \"1234\");\n\
  });\n```\n\n\n\n## 拖动反馈图像\n\n通常，原生的拖放 API 会自动创建半透明图像，该图像由 `dragstart` 事件的拖动目标生成，并在拖动操作期间跟随鼠标指针。你可以使用\
  \ `dataTransfer` 属性的 `setDragImage` 方法来指定自定义拖动图像。此函数的第一个参数是自定义拖动图像，可以是对真实图像、画布或其他元素的引用。第二个和第三个参数是图像相对于鼠标指针出现时的偏移量。代码如下：\n\
  \n```\nvar dragSource = querySelector(\"#sample_drag_id\")\n  ..draggable = true\n\
  \  ..onDragStart.listen((MouseEvent event) {\n    event.dataTransfer.setData(\"\
  text/plain\", \"I'm draggable\");\n    event.dataTransfer.setDragImage(new\n   \
  \     ImageElement(src:'notification.png'), 0, 0);\n  });\n```\n\n以下反馈图像将代替标准的半透明图像出现：\n\
  \n![](img/52c05b53a56abd53584e4fed738ed509_494_0.png)\n\n## 拖动效果\n\n拖放 API 支持对可拖动数据执行复制、移动、链接及其组合等操作。我们可以使用复制操作来表示被拖动的数据将从当前位置复制到放置位置。类似地，你可以使用移动操作来表示被拖动的数据将被移动，而链接操作表示将在源位置和放置位置之间创建连接。你应该通过在监听器中设置\
  \ `dragstart` 事件的 `effectAllowed` 属性来指定允许并执行的某个操作或组合，如以下代码所示：\n\n```\nvar dragSource\
  \ = querySelector(\"#sample_drag_id\")\n  ..draggable = true\n  ..onDragStart.listen((MouseEvent\
  \ event) {\n    event.dataTransfer.setData(\"text/plain\", \"I'm draggable\");\n\
  \    event.dataTransfer.setDragImage(new\n        ImageElement(src:'notification.png'),\
  \ 0, 0);\n    event.dataTransfer.effectAllowed = 'copy';\n  });\n```\n\n在前面的示例中，我们只允许复制操作。让我们看看我们可以将哪些值用作操作的名称：\n\
  \n- none: 此操作表示不允许任何操作\n- copy: 此操作表示拖动数据只能从源复制到放置位置\n- move: 此操作表示拖动数据只能从源移动到放置位置\n\
  - link: 此操作表示拖动数据只能从源链接到放置位置\n- copyMove: 此操作表示拖动数据可以从源复制或移动到放置位置\n- copyLink: 此操作表示拖动数据可以从源复制或链接到放置位置\n\
  - all: 此操作表示拖动数据可以从源复制、移动或链接到放置位置\n\n默认情况下，`effectAllowed` 属性允许全部三种操作。允许的操作可以在 `dragenter`\
  \ 或 `dragover` 事件的监听器中通过 `effectAllowed` 属性进行检查，并且应该在相关的 `dropEffect` 属性中设置，以指定应执行哪个单一操作。`dropEffect`\
  \ 属性的有效操作仅为 none、move 或 link，只有这三种，任何其他组合都被禁止。期望的操作会改变鼠标指针，因此对于复制操作，光标可能会出现加号。期望的效果可以通过用户按下修饰键来修改。具体键因平台而异。在\
  \ Windows 操作系统中，用户通常使用 Shift 和 Ctrl 键在复制、移动和链接操作之间切换。在 `dragenter` 和 `dragover`\
  \ 事件期间，我们可以修改 `effectAllowed` 和 `dropEffect` 属性，以指定放置目标支持的操作。`dropEffect` 中指定的效果必须是\
  \ `effectAllowed` 属性中列出的其中一个。`dropEffect` 属性的值可以告诉我们拖动操作的确切结果。如果 `dropEffect` 属性的值为\
  \ none，则拖动已取消；否则，指定的效果即为已执行的操作。拖放操作在 `dragend` 事件结束之后被视为完成。\n\n> `none` 值可用于任一属性，以表示在目标位置不允许放置操作。\n\
  \n### 放置目标\n\n放置目标是拖动项可能被放置的位置。放置目标非常重要，因为网页的大多数区域不允许放置。`dragenter` 和 `dragover`\
  \ 事件的事件监听器用于通过取消事件来阻止默认处理，从而指示有效的放置目标，如以下代码所示：\n\n```\nvar dropTarget = querySelector(\"\
  #sample_drop_id\")\n    .onDragOver.listen((MouseEvent event) {\n        if (checkTarget(event.target))\
  \ {\n            event.preventDefault();\n            event.dataTransfer.dropEffect\
  \ = 'copy';\n        }\n    });\n```\n\n在前面的代码中，我们调用 `checkTarget` 方法以确保目标位于可放置的正确位置。在我们的例子中，放置目标必须具有\
  \ `droppable` 属性，如以下代码所示：\n\n```\nbool checkTarget(Element target) {\n    return\
  \ target.attributes.containsKey('droppable');\n}\n```\n\n然而，通常放置是否被接受或拒绝取决于 `dataTransfer`\
  \ 属性中的拖动数据类型。在这种情况下，我们应该检查 `dataTransfer` 属性的类型，以决定是否可以接受数据放置。代码如下：\n\n```\nvar\
  \ dropTarget = querySelector(\"#sample_drop_id\")\n    .onDragOver.listen((MouseEvent\
  \ event) {\n        if (checkTarget(event.target) &&\n            checkTypes(event.dataTransfer.types))\
  \ {\n            event.preventDefault();\n            event.dataTransfer.dropEffect\
  \ = 'copy';\n        }\n    });\n```\n\n在以下代码中，`checkTypes` 函数仅接受通过 `dragstart`\
  \ 事件监听器内部 `dataTransfer` 的 `setData` 方法指定的 `text/plain` 类型：\n\n```\nbool checkTypes(List<String>\
  \ types) {\n    return types.contains(\"text/plain\");\n}\n```\n\n你现在可以运行 Web 应用程序，将带有\
  \ `Drag me!` 文本的框拖动，并将其放置在带有 `Drop here` 文本的框内。让我们完善我们的应用程序并更改放置区域的文本。\n\n## 完成放置\n\
  \n当用户释放鼠标时，拖放操作结束。如果这发生在被识别为有效放置目标的元素上，拖放 API 将在目标上触发 `drop` 事件。`drop` 事件的 `dataTransfer`\
  \ 属性保存正在拖动的数据。为了检索拖动数据，我们将使用 `dataTransfer` 属性的 `getData` 方法，如下所示：\n\n```\nvar dropTarget\
  \ = querySelector(\"#sample_drop_id\")\n  ..onDragOver.listen((MouseEvent event)\
  \ {\n    if (checkTarget(event.target) &&\n        checkTypes(event.dataTransfer.types))\
  \ {\n      event.preventDefault();\n      event.dataTransfer.dropEffect = 'copy';\n\
  \    }\n  })\n  ..onDrop.listen((MouseEvent event) {\n    Element dropTarget = event.target;\n\
  \    dropTarget.innerHtml = event.dataTransfer.getData('text/plain');\n    event.preventDefault();\n\
  \  });\n```\n\n`getData` 方法将检索在调用 `setData` 方法时设置的字符串值。当从 `getData` 返回空字符串时，这意味着指定类型的数据不存在。在\
  \ `getData` 方法结束时，如果你已接受放置，则需要调用事件的 `preventDefault` 方法。以下是拖放操作的结果：\n\n![](img/52c05b53a56abd53584e4fed738ed509_498_0.png)\n\
  \n## 完成拖动\n\n最后，当拖动操作完成后，拖放 API 会在接收到 `dragstart` 事件的源元素上生成 `dragend` 事件。无论拖放操作的结果如何，API\
  \ 都会生成该事件。`dropEffect` 属性的值可以告诉我们拖动操作的确切结果。如果 `dropEffect` 属性的值为 `none`，则拖动已取消；否则，指定的效果即为已执行的操作。拖放操作在\
  \ `dragend` 事件结束之后被视为完成。\n\n## 地理位置 API\n\n**地理位置** API 是一个用于定位信息的高级接口。它让你能够获知用户所在位置，并在用户移动时跟踪其位置。地理位置\
  \ API 与底层位置源无关，并且不关心 Web 浏览器如何确定位置。以下是常见的定位来源：\n\n- GPS\n- 网络 IP 地址\n- RFID\n- Wi-Fi\n\
  - 蓝牙 MAC 地址\n- GSM/CDMA 基站 ID\n- 用户输入\n\n\n\nAPI 使用纬度和经度坐标来表示位置。\n\n> 地理定位 API 不保证返回设备的真实位置。\n\
  \n地理定位 API 包含以下类：\n\n- `Geolocation`：此类用于确定与宿主设备关联的位置信息\n- `Geoposition`：此类用于存储坐标和时间戳\n\
  - `Coordinates`：此类用于存储设备的位置信息和速度\n\n## 确定当前位置\n\n让我们看看如何使用地理定位 API 获取当前位置的信息：\n\n\
  ```\nimport 'dart:html';\n\nvoid main() {\n  window.navigator.geolocation.getCurrentPosition()\n\
  \    .then((Geoposition geoposition) {\n      querySelector(\"#latitude\").text\
  \ = geoposition.coords.latitude.toStringAsFixed(6);\n      querySelector(\"#longitude\"\
  ).text = geoposition.coords.longitude.toStringAsFixed(6);\n    }, onError: (PositionError\
  \ error) {\n      print(error.message);\n    });\n}\n```\n\n我们可以从 `window` 对象的 `navigator`\
  \ 属性中获取 `geolocation` 实例。`geolocation` 的 `getCurrentPosition` 方法在 `Future` 对象中返回\
  \ `Geoposition`。当 Future 被解析时，我们将把 `geoposition` 的坐标赋值给纬度和经度的 HTML 字段。\n\n> Dartium\
  \ 不支持地理定位，因此请运行 pub serve 并使用 Chrome 浏览器进行测试。\n\n- 3. 选择**推荐**选项，并通过点击**管理例外**按钮打开**地理位置例外**对话框。目前，该对话框中不会包含我们的网站，如以下截图所示：\n\
  \n![](img/52c05b53a56abd53584e4fed738ed509_501_0.png)\n\n- 4. 运行地理定位应用。Chrome 浏览器会询问你是否允许使用你的位置信息，如以下截图所示：\n\
  \n![](img/52c05b53a56abd53584e4fed738ed509_501_1.png)\n\n5. 你可以允许或拒绝该网站的位置请求。你的选择将决定后续权限请求如何处理\
  \ `geoposition` 的值。网站随后会被添加到**地理位置例外**列表中。请再次打开**地理位置例外**对话框以查看你的网站：\n\n![](img/52c05b53a56abd53584e4fed738ed509_502_0.png)\n\
  \n`geolocation` 服务中发生的任何错误都会被打印出来：\n\n```\nNetwork location provider at 'https://www.googleapis.com/'\n\
  : Returned error code 400.\n```\n\n6. 现在，我们将从项目的根目录运行 `pub serve`：\n\n```\nLoading\
  \ source assets...\nServing geolocation web on http://localhost:8080\nBuild completed\
  \ successfully\n[web] GET /geolocation.html => geolocation|web/geolocation.html\n\
  [web] GET /geolocation.css => geolocation|web/geolocation.css\n[web] GET /packages/browser/dart.js\
  \ => browser|lib/dart.js\n[Info from Dart2JS]:\nCompiling geolocation|web/geolocation.dart...\n\
  [Info from Dart2JS]:\nTook 0:00:27.723586 to compile geolocation|web/geolocation.dart.\n\
  Build completed successfully\n[web] GET /geolocation.dart.js => geolocation|web/geolocation.dart.js\n\
  [web] GET /geolocation.dart.js.map => geolocation|web/geolocation.dart.js.map\n\
  ```\n\n- 7. 接着，在 Chrome 浏览器中打开该 Web 应用，会得到以下结果：\n\n![](img/52c05b53a56abd53584e4fed738ed509_503_0.png)\n\
  \n如果加入 Google Maps 在真实地图上显示你的当前位置，这个示例会更有趣。\n\n## 地图上的地理定位\n\n将 google_maps 包添加到你的项目中，并对代码进行以下修改：\n\
  \n```\nimport 'dart:html';\nimport 'package:google_maps/google_maps.dart';\n\nvoid\
  \ main() {\n  final mapOptions = new MapOptions()\n    ..zoom = 15\n    ..mapTypeId\
  \ = MapTypeId.ROADMAP;\n  final map = new GMap(querySelector(\"#map_canvas\"), mapOptions);\n\
  \n  window.navigator.geolocation.getCurrentPosition()\n    .then((Geoposition geoposition)\
  \ {\n      Coordinates coords = geoposition.coords;\n      querySelector(\"#latitude\"\
  ).text = coords.latitude.toStringAsPrecision(6);\n      querySelector(\"#longitude\"\
  ).text = coords.longitude.toStringAsPrecision(6);\n      //\n      map.center =\
  \ new LatLng(coords.latitude, coords.longitude);\n    }, onError: (PositionError\
  \ error){\n      print(error.message);\n    });\n}\n```\n\n## 支持其他 HTML5 特性\n\n\
  在 mapOptions 中，我们指定了缩放级别和视图类型。地图可以以卫星、地形或混合视图呈现。使用 Google Maps API 非常简单。只需在 HTML\
  \ 页面中添加带有指定 ID 的 div 元素，然后执行 pub serve 命令来编译代码并运行服务器。当你在 Chrome 浏览器中打开**地理位置**页面时，将得到以下结果：\n\
  \n![](img/52c05b53a56abd53584e4fed738ed509_504_0.png)\n\n## 跟踪当前位置\n\n地理定位 API 可以使用\
  \ watchPosition 方法监控设备的当前位置。通过 enableHighAccuracy 参数，地理定位 API 会开始使用设备上可用的更精确的硬件。该方法返回一个\
  \ geoposition 坐标流。你只需监听事件即可跟踪当前位置的变化。代码如下：\n\n```\nimport 'dart:html';\nimport 'package:google_maps/google_maps.dart';\n\
  ```\n\n```\nvoid main() {\n    final mapOptions = new MapOptions()\n    ..zoom =\
  \ 25\n    ..mapTypeId = MapTypeId.ROADMAP;\n    final map = new GMap(querySelector(\"\
  #map_canvas\"), mapOptions);\n\n    window.navigator.geolocation\n    .watchPosition(enableHighAccuracy:true)\n\
  \    .listen((Geoposition geoposition) {\n        Coordinates coords = geoposition.coords;\n\
  \        map.center = new LatLng(coords.latitude, coords.longitude);\n        //\n\
  \        querySelector(\"#location_tracker\").append(new DivElement()\n        ..text\
  \ = coords.latitude.toStringAsPrecision(6) + \" x \" +\n        coords.longitude.toStringAsPrecision(6));\n\
  \    }, onError: (PositionError error){\n        print(error.message);\n    });\n\
  }\n```\n\n当你运行该 Web 应用时，会得到以下结果：\n\n![](img/52c05b53a56abd53584e4fed738ed509_505_0.png)\n\
  \n## Canvas\n\nHTML5 canvas 是一个非常出色的功能，它允许你通过代码进行编程式绘图操作。它之所以变得非常流行，是因为它允许你在网页中直接创建和处理图像。canvas\
  \ 是 HTML5 新特性中最灵活的标签之一。这个标签就像一块空白的画板。它定义了一个上下文对象，用户可以在其中绘制图形。实际的绘制操作可以分为以下几种方式：\n\
  \n- 绘制 2D 上下文\n- 绘制 3D 上下文（正式名称为 WebGL）\n\n所有现代网络浏览器都支持 2D 上下文。它更为成熟和稳定，而 3D 上下文仍处于早期的定义阶段。由于\
  \ 2D 上下文得到更广泛的支持，我们来讨论一下它。\n\ncanvas API 既简单又强大。你只能通过脚本在 2D 位图表面上绘制。在绘制过程中，你所绘制的形状不会对应任何\
  \ DOM 节点。你生成的只是像素，因此即使图形复杂度增加，也无需担心性能下降。\n\n在 canvas 上绘图，本质上就是在屏幕上的适当坐标处添加像素。通常，屏幕上像素的坐标与\
  \ canvas 中用网格表示的点一一对应，但当我们放大或缩小屏幕，或通过 CSS 调整 canvas 的大小时，这些坐标可能会发生变化。网格的关键点是位于 canvas\
  \ 左上角的原点，其坐标为 (0, 0)。绘制在 canvas 上的每个形状都有一个 x 轴和 y 轴的偏移量，以及宽度和高度属性。\n\n## 示例 —— canvas\
  \ 编辑器\n\ncanvas API 允许你执行以下操作：\n\n- 绘制矩形、椭圆、线条等形状\n- 渲染文本\n- 像素操作\n- 在区域、形状或文本中填充颜色\n\
  - 创建渐变和图案以填充区域、形状或文本\n- 复制图像、其他 canvas 或视频帧\n- 将 canvas 内容导出到文件\n\n\n\n\n\n## 支持其他HTML5特性\n\
  \n```\n<link rel=\"stylesheet\" href=\"https://maxcdn.bootstrapcdn.com/bootstrap/3.2.0/css/bootstrap.min.css\"\
  >\n<link rel=\"stylesheet\" href=\"https://maxcdn.bootstrapcdn.com/bootstrap/3.2.0/css/bootstrap-theme.min.css\"\
  >\n\n<link rel=\"stylesheet\" type=\"text/css\" href=\"css/bootstrap-colorselector.css\"\
  \ />\n<link rel=\"stylesheet\" type=\"text/css\" href=\"css/index.css\">\n\n<!--\
  \ HTML5 Shim and Respond.js IE8 support of HTML5 elements and media queries -->\n\
  <!-- WARNING: Respond.js doesn't work if you view the page via file:// -->\n<!--[if\
  \ lt IE 9]>\n<script src=\"https://oss.maxcdn.com/html5shiv/3.7.2/html5shiv.min.js\"\
  ></script>\n<script src=\"https://oss.maxcdn.com/respond/1.4.2/respond.min.js\"\
  ></script>\n<![endif]-->\n\n<!-- jQuery (necessary for Bootstrap's JavaScript plugins)\
  \ -->\n<script src=\"https://ajax.googleapis.com/ajax/libs/jquery/1.11.1/jquery.min.js\"\
  ></script>\n<script src=\"https://maxcdn.bootstrapcdn.com/bootstrap/3.2.0/js/bootstrap.min.js\"\
  ></script>\n\n<script async type=\"application/dart\" src=\"index.dart\"></script>\n\
  <script async src=\"packages/browser/dart.js\"></script>\n```\n\nHTML页面中包含的所有Bootstrap样式表和JavaScript代码均从免费公共内容分发网络（CDN）下载。html5shiv和respond库有助于在IE\
  \ 8或更高版本上运行HTML5特性。\n\n网页的主体分为两部分。第一部分是响应式导航栏组件，用作我们应用程序的导航标题。它在移动视图中折叠并切换，如果可用宽度空间增加则变为水平。我们将导航栏分为两个子部分。第一个子部分是主工具栏，包含所有与画布直接操作相关的组件。另一个是辅助工具栏，包含在应用程序中起辅助作用的组件。\n\
  \n这组组件中的最后一个是“清除”按钮。用户可以单击此按钮清除画布的内容，如下代码所示：\n\n```\n<div class=\"form-group\">\n\
  <button type=\"button\"\nclass=\"btn btn-default clear-btn\">Clear</button>\n</div>\n\
  ```\n\n辅助工具栏右对齐。它只有一个“预览”按钮组件，如下代码所示：\n\n```\n<ul class=\"nav navbar-nav navbar-right\"\
  >\n<li><a href=\"#\" class=\"previewBtn\">Preview</a></li>\n</ul>\n```\n\n现在，让我们看看我们的画布组件：\n\
  \n```\n<div class=\"col-lg-12 text-center canvas-container\">\n<canvas class=\"\
  canvas view-canvas\" width=\"600px\"\nheight=\"400px\">\n<p>Unfortunately, your\
  \ browser is currently unsupported by\nour web application.</p>\n</canvas>\n<canvas\
  \ class=\"canvas draw-canvas\" width=\"600px\"\nheight=\"400px\">\n<p>Unfortunately,\
  \ your browser is currently unsupported by\nour web application.</p>\n</canvas>\n\
  </div>\n```\n\n我们在应用程序中使用两个画布。第一个标记有view-canvas类。它仅用于呈现数据，与第二个标记有draw-canvas类的画布相对。第二个画布的用途是所有工具都必须在此绘制。当它们的绘制操作结束时，它们生成的像素随后被移动到第一个画布中。\n\
  \n## 进入主函数\n\n我们应用程序的基础是分为两类的组件：小部件（widgets）和工具（tools）。小部件是处理HTML元素并包含额外行为的组件。所有工具组件都基于Tool类。我们使用基于工具的组件在画布中绘制。以下是我们应用程序的主函数：\n\
  \n```\n// Calculate absolute value of number\nnum abs(num value) => value < 0 ?\
  \ -value : value;\n```\n\n## CanvasWidget 组件\n\n如前所述，应用程序使用两个画布组件——一个叠在另一个之上。两者都可以通过选择器获取。当我们创建CanvasWidget组件的实例时，我们将这些选择器作为构造函数的参数传递。该组件引用用于绘制的Tool组件。代码如下：\n\
  \n```\n```dart\n/**\n * Canvas widget listens for mouse events from [CanvasElement]\
  \ to draw\n * with selected tool.\n */\nclass CanvasWidget implements StreamConsumer\
  \ {\n\n  CanvasElement _viewCanvas, _drawCanvas;\n\n  CanvasElement get viewCanvas\
  \ => _viewCanvas;\n  CanvasElement get drawCanvas => _drawCanvas;\n  CanvasRenderingContext2D\
  \ get context => _viewCanvas.context2D;\n  CanvasRenderingContext2D get drawContext\
  \ => _drawCanvas.context2D;\n\n  Tool _tool;\n\n  /**\n   * Create an instance of\
  \ CanvasWidget. The [viewCanvasSelector] and\n   * [drawCanvasSelector] need to\
  \ find CanvasElements.\n   */\n  CanvasWidget(String viewCanvasSelector, String\
  \ drawCanvasSelector) {\n    // Find canvas elements\n    _viewCanvas = querySelector(viewCanvasSelector);\n\
  \    _drawCanvas = querySelector(drawCanvasSelector);\n    // Add mouse event listeners\n\
  \    _drawCanvas.onMouseDown.listen((evt) =>\n      _tool.beginDraw(drawContext,\
  \ offset(evt)));\n    _drawCanvas.onMouseMove.listen((evt) =>\n      _tool.drawing(drawContext,\
  \ offset(evt)));\n\n    var _finishDraw = (evt) {\n      _tool.finishDraw(drawContext,\
  \ offset(evt));\n      copyContext();\n    };\n\n    _drawCanvas.onMouseUp.listen(_finishDraw);\n\
  \    _drawCanvas.onMouseLeave.listen(_finishDraw);\n  }\n}\n```\n```\n\n用户开始绘制时按下鼠标按钮。因此，onMouseDown监听器调用Tool类的beginDraw方法。drawContext方法和鼠标坐标的偏移量作为该方法的参数传递。每次移动鼠标时都会调用Tool类的drawing方法。最后，当用户释放鼠标按钮时调用finishDraw方法，并调用本地copyContext方法将draw画布的内容复制到view画布。CanvasWidget组件通过addStream方法实现StreamConsumer接口，以监听两类事件，即来自ColorSelectorWidget的ColorSelectedEvent和来自ToolSelectorWidget的ToolSelectedEvent。addStream方法处理传入的事件，如下代码所示：\n\
  \n```\n/**\n * Copy drawn image from draw canvas into view context.\n * After all\
  \ it clears the draw canvas.\n */\ncopyContext() {\n    context.drawImage(_drawCanvas,\
  \ 0, 0);\n    _drawCanvas.context2D.clearRect(0, 0,\n        _drawCanvas.width,\
  \ _drawCanvas.height);\n}\n\n/**\n * Clear the view canvas\n */\nclear() {\n   \
  \ context.clearRect(0, 0, _viewCanvas.width, _viewCanvas.height);\n}\n\n/**\n *\
  \ Consumes the elements of [stream].\n * Listens on [stream] and does something\
  \ for each event.\n */\nFuture addStream(Stream stream) {\n    return stream.listen((event)\
  \ {\n        if (event is ColorSelectedEvent) {\n            if (event.type == ColorSelectedEvent.STROKE_COLOR)\
  \ {\n                drawContext.strokeStyle = event.value;\n            } else\
  \ {\n                drawContext.fillStyle = event.value;\n            }\n     \
  \   } else if (event is ToolSelectedEvent) {\n\n```\n\n}\nthrow new Exception(\"\
  Brush with $name not found\");\n}\n\nselectTool(String name) {\n  _selectedTool\
  \ = getTool(name);\n  _toolSelectedController.add(new ToolSelectedEvent(selectedTool));\n\
  \  _selectElement.value = selectedTool.name;\n}\n}\n```\n\n当用户选择新工具时，该组件会生成一个 `ToolSelectedEvent`\
  \ 方法，并将选定的工具实例作为参数。`StreamController` 方法用于将 `ToolSelectedEvent` 广播给任何监听器，即 `CanvasWidget`。\n\
  \n## ColorSelector 小部件\n\n这个小部件是 bootstrap-colorselector 到 Dart 的移植。该组件仅从预定义的颜色集合中创建一个下拉调色板。我们已通过HTML标记设置了预定义颜色。每次用户选择新颜色时，`StreamController`\
  \ 方法都会向 `CanvasWidget` 类广播一个 `ColorSelectedEvent` 事件。\n\n## Tool 类\n\n我们的应用程序有一个抽象的\
  \ `Tool` 类，用于抽象所有基于工具的组件的共同行为和属性，如下代码所示：\n\n```\n/**\n * Abstract class defines\
  \ common behavior and properties\n * for all tools.\n */\nabstract class Tool {\n\
  \  bool isDrawing = false;\n  Point startPoint;\n\n  String get name;\n\n  void\
  \ beginDraw(CanvasRenderingContext2D context, Point point) {\n    isDrawing = true;\n\
  \    startPoint = point;\n  }\n}\n```\n\n\n\n\n\n```void drawing(CanvasRenderingContext2D\
  \ context, Point point);\n\nvoid finishDraw(CanvasRenderingContext2D context, Point\
  \ point) {\n    if (isDrawing) {\n        drawing(context, point);\n        isDrawing\
  \ = false;\n    }\n}\n```\n\nThe isDrawing property reflects the status of the drawing\
  \ operation. The startPoint property simply holds the cursor coordinates relative\
  \ to the canvas when the user starts drawing on the canvas. The read-only property\
  \ name returns the name of the tool. This name is used when the tool is added to\
  \ ToolSelectorWidget. Each tool has three methods, and the whole drawing process\
  \ is split into the following three phases:\n\n- **Start the drawing phase**: The\
  \ program calls the beginDraw method when a user starts holding down the mouse button.\
  \ We always switch on the isDrawing property and remember the cursor coordinates\
  \ in startPoint.\n- **Drawing phase**: The drawing method is called every time the\
  \ user moves the cursor. Implementation of this method strongly depends on the tool,\
  \ so we do not implement it in the abstract class Tool.\n- **End the drawing phase**:\
  \ The program invokes the finishDraw method when the user releases the mouse button.\
  \ In this method, we need to call the drawing method for the last time and switch\
  \ off isDrawing only if the drawing process has happened.\n\nNow, it's time to look\
  \ at our tools implementation in detail.\n\n## The Pen tool\n\nAs the canvas element\
  \ doesn't directly support drawing a single point, we use lines instead. Drawing\
  \ in a canvas is similar to using a virtual pen. At the beginning, we must call\
  \ beginPath of context where we begin drawing. This method creates a new drawing\
  \ path, so future drawing commands will be directed to the path and will be used\
  \ to build the path. We start our path by moving to the startPoint coordinates with\
  \ the moveTo method of context, as shown in the following code:\n\n```\n/**\n *\
  \ Simple pen tool\n */\nclass Pen extends Tool {\n```\n\n```\nString get name =>\
  \ \"Pen\";\n\n@override\nvoid beginDraw(CanvasRenderingContext2D context, Point\
  \ point) {\n    super.beginDraw(context, point);\n    context.beginPath();\n   \
  \ context.moveTo(startPoint.x, startPoint.y);\n}\n\n@override\nvoid drawing(CanvasRenderingContext2D\
  \ context, Point point) {\n    if (isDrawing) {\n        context.lineTo(point.x,\
  \ point.y);\n        context.stroke();\n    }\n}\n```\n\nEvery time a user moves\
  \ the mouse, the program calls the drawing method to connect our drawn path to next\
  \ line's point with the lineTo method of context. Finally, it calls the stroke method\
  \ to draw the shape by stroking its outline.\n\n## The Line tool\n\nThe behavior\
  \ of the Line tool is similar to that of the Pen tool, but with a different drawing\
  \ logic. We only implement the drawing method of the Tool class to draw our shape\
  \ in a path. A path is a list of subpaths, and each of them is a list of points\
  \ that are connected by straight or curved lines. Each one also contains a flag\
  \ that indicates whether it is closed, so the last point of the closed subpath is\
  \ connected to the first point by a straight line, as illustrated by the following\
  \ code:\n\n```\n/**\n * Line tool is used to create lines.\n */\nclass Line extends\
  \ Tool {\n\n    String get name => \"Line\";\n\n    @override\n    void drawing(CanvasRenderingContext2D\
  \ context, Point point) {\n        if (isDrawing) {\n            context.clearRect(0,\
  \ 0,\n                context.canvas.width, context.canvas.height);\n          \
  \  context.beginPath();\n```\n\n```\ncontext.moveTo(startPoint.x, startPoint.y);\n\
  context.lineTo(point.x, point.y);\n\ncontext.stroke();\ncontext.closePath();\n}\n\
  }\n```\n\nWe must always clear the whole drawing canvas and start a new path via\
  \ the `beginPath` method of context. We move the first point to the `startPoint`\
  \ position and draw the line within the current cursor coordinates. Finally, we\
  \ draw the line shape by stroking its outline and close the drawing path.\n\n##\
  \ The Rectangle tool\n\nWe can draw a rectangle with individual lines, but the **Rectangle**\
  \ tool makes the task much easier. The context object has the following methods\
  \ to draw rectangles:\n\n- `strokeRect`: This method uses the current stroke style\
  \ to draw the box that outlines the given rectangle onto the canvas\n- `fillRect`:\
  \ This method uses the current fill style to draw the given rectangle onto the canvas\n\
  - `clearRect`: This method clears all the pixels on the canvas in the given rectangle\
  \ to transparent black\n\nThe easiest way to draw a rectangle on the canvas is use\
  \ the `fillRect` method of context. The `fillRect` method uses color from the `fillStyle`\
  \ property, black by default. The Rectangle class, as shown in the following code:\n\
  \n```\n/*\n * Rectangle tool\n */\nclass Rectangle extends Tool {\n\n    String\
  \ get name => \"Rectangle\";\n\n    @override\n    void drawing(CanvasRenderingContext2D\
  \ context, Point point) {\n        if (isDrawing) {\n            context.clearRect(0,\
  \ 0,\n                context.canvas.width, context.canvas.height);\n\n        \
  \    int x = min(point.x, startPoint.x).round(),\n```\n\n```\ny = min(point.y, startPoint.y).round(),\n\
  \ w = abs(point.x - startPoint.x).round(),\n h = abs(point.y - startPoint.y).round();\n\
  \n context.fillRect(x, y, w, h);\n context.strokeRect(x, y, w, h);\n }\n }\n }\n\
  ```\n\nIn the preceding code, we drew a rectangle with fillRect and finally called\
  \ strokeRect to draw the border line shape by stroking its outline.\n\n## The Oval\
  \ tool\n\nDrawing ovals is a breeze too. The easiest way to draw ovals is using\
  \ the arc method of context. The arc method takes the following five parameters:\n\
  \n```\narc(x, y, radius, startAngle, endAngle, anticlockwise)\n```\n\nThe x and\
  \ y parameters are the coordinates of the center of the oval on which the arc should\
  \ be drawn. The radius parameter is the radius of the oval. The startAngle and endAngle\
  \ parameters define the start and end coordinates of the arc in radians, measured\
  \ from the x axis along with the curve of the oval. Finally, the last parameter\
  \ is anticlockwise, which tells the canvas to draw the arc anticlockwise. The code\
  \ is as follows:\n\n```\n/**\n * This tool transforms a drawing context into a rectangle\n\
  \ * enclosing the oval and uses the arc method to draw it.\n */\nclass Oval extends\
  \ Tool {\n\n String get name => \"Oval\";\n\n @override\n void drawing(CanvasRenderingContext2D\
  \ context, Point point) {\n  if (isDrawing) {\n   context.save();\n   context.clearRect(0,\
  \ 0,\n    context.canvas.width, context.canvas.height);\n   context.beginPath();\n\
  \n   var rx = (point.x - startPoint.x) / 2;\n   var ry = (point.y - startPoint.y)\
  \ / 2;\n```\n\n## How to preview the context\n\nIf you need to preview the result\
  \ of what you've done in the view canvas, you can open a new window with the content\
  \ of the view canvas as shown here:\n\n```\n// Register a preview button listener\n\
  querySelector(\".preview-btn\").onClick\n.listen((MouseEvent event) {\n    event.preventDefault();\n\
  \    window.open(canvas.viewCanvas.toDataUrl(\"image/png\"),\n    \"Image Preview\"\
  );\n});\n```\n\nNow if you click on the Preview link, you will see the next result\
  \ in a new window in your web browser, as shown in the following screenshot:\n\n\
  ![](img/52c05b53a56abd53584e4fed738ed509_521_0.png)\n\nHere, we opened a new browser\
  \ window with the image data URI directly and we could save it in the represented\
  \ format. The data URI format shown in the address of the web browser is as follows:\n\
  \n```\ndata:[<MIME-type>][;charset=<encoding>][;base64],<data>\n```\n\nThe toDataUrl\
  \ method has an optional second parameter, `quality`. It represents the image quality\
  \ in the range of 0.0 to 1.0 when the requesting type is `image/jpeg` or `image/webp`.\n\
  \n## Summary\n\nTo summarize, we will discuss the important facts about how to support\
  \ other HTML5 features in Dart.\n\nThe web notification API allows you to display\
  \ notifications outside the context of the web page. The user agent defines the\
  \ best presentation of notifications, which depends on the location of the device.\
  \ The web notification API is available as a part of the `dart:html` package and\
  \ allows you to send information to a user even if the application is idle. When\
  \ you build web applications, you can use the notification API in event handlers\
  \ or polling functions to notify users.\n\nBefore you send any notifications to\
  \ the user, the website must have permissions. Users can let websites send notifications\
  \ automatically or with the permission request first. All the websites that request\
  \ access to the notification API are added to the list of the notification exceptions.\
  \ The constructor of the `Notification` class has optional properties that help\
  \ you create notifications with the body and icon.\n\nDragging-and-dropping is a\
  \ way to convert pointing device movements and clicks to special commands that are\
  \ recognized by software to provide quick access to common functions of a program.\
  \ Native drag-and-drop support in a browser means faster and more responsive web\
  \ applications. Each drag event has a `dataTransfer` property that is used to hold\
  \ data associated with a drag operation. The drop target is very important because\
  \ most areas of the web page are not permitted to drop.\n\nThe geolocation API is\
  \ a high-level interface used for location information. The API is device-agnostic\
  \ of the underlying location source and is not affected by how the web browser determines\
  \ a location. Using the Google Maps API with the geolocation API is very simple.\n\
  \nThe HTML5 canvas is a fantastic feature that allows you to code programmatic drawing\
  \ operations. It has become very popular because it allows you to create and manipulate\
  \ imagery directly within web pages. It defines a `context` object that users can\
  \ draw inside.\n\nIn the next chapter, we will discuss the different aspects of\
  \ security. As a best practice, we will focus on validation input and escape and\
  \ filter output data in our web applications.\n\n\n\n\n"
- "## 12 个安全方面\n\n在本章中，我们将讨论安全的不同方面。你将了解用户数据输入的验证以及我们 Web 应用程序中的安全最佳实践。本章涵盖以下主题：\n\
  \n- Web 安全\n- 保护服务器安全\n- 保护客户端安全\n- 安全最佳实践\n\n### Web 安全\n\n犯罪是一种困扰许多人心灵的疾病。黑客对从个人邮箱凭据到银行账户详情的一切都感兴趣。维护安全的责任在于\
  \ Web 开发人员。开发人员应使用 HTTPS 来访问包含敏感数据的网页和资源。\n\n### 传输层安全与安全套接字层概览\n\n安全套接字层（SSL）是当今互联网上最常用的协议之一。SSL\
  \ 能够保护任何基于 TCP 的传输。传输层安全（TLS）协议是 SSL 的后继者，基于较旧的 SSL 规范。TLS 1.0 版于 1999 年 1 月首次被定义为\
  \ SSL 3.0 版的升级版。两者都基于非对称密钥来加密数据，并通过数字证书在不受信任的第三方中进行身份验证。我们在客户端-服务器模型中使用 TLS，但客户端通常不提供证书。相反，服务器负责通过签名证书进行自身身份验证，并通过公钥和私钥进行加密。\n\
  \n用于网页浏览、电子邮件、互联网传真、即时消息和互联网语音传输（VoIP）的协议有多个版本。TLS 具有以下优点：\n\n- 它加密信息\n- 它提供身份验证\n\
  - 它支持网站上的信用卡支付\n- 它防范网络钓鱼\n- 它增强品牌力量并提升客户信任\n\n在互联网上提交的信息在到达最终目的地之前会经过网络中的多个节点，因此可能被第三方获取。TLS\
  \ 证书会将随机字符插入原始信息中，使其变得面目全非，只有正确的加密密钥才能帮助解密。服务器证书是另一种保护类型，当服务器所有者获得 TLS 证书后就会颁发。该证书可供客户端验证\
  \ TLS 证书是否是最新的，以及客户端的信息是否被发送到正确的位置。使用信用卡支付的在线企业必须符合支付卡行业标准。这意味着服务器需要具备至少 128 位加密强度的\
  \ TLS 证书。在线企业通常提供站点徽章和其他品牌标识，以表明正在使用受信任的加密。这些信息给客户带来额外的保障，并在客户与企业之间建立信任。\n\n###\
  \ TLS 证书\n\n要在 TCP/IP 协议栈中确定在哪个层级处理 TLS 协议确实非常复杂。TLS 安全协议描述了应如何使用算法以及 TLS 证书如何建立安全连接。要获得证书，你必须在服务器上创建证书签名请求（CSR）。此过程会在服务器上生成一对私钥和公钥。然后，你必须将包含公钥的\
  \ CSR 数据文件发送给证书颁发机构（CA），以获取 TLS 证书。CA 会根据 CSR 文件创建一个数据结构，以便将来与私钥匹配。CA 永远不会看到私钥，因此它不会被泄露。一旦收到\
  \ TLS 证书，你就可以将其安装到服务器上。Dart 使用 Mozilla 的网络安全服务（NSS）库来处理 TLS。我们需要使用 NSS 安全工具中的证书数据库工具\
  \ `certutil` 来操作证书数据库。你可以获取源代码并为你的平台快速构建 `certutil`，但我在我的 Ubuntu 工作站上安装了以下预构建版本的程序：\n\
  \n```\nsudo apt-get install libnss3-tools\n```\n\n`-S` 命令选项会创建单个证书并将其添加到证书数据库中。`-s`\
  \ 选项后面的文本提供了标识证书所有者的主题。`-x` 选项告诉 `certutil` 命令所创建的证书是自签名的。`-v` 选项设置新证书的有效月数。`-m`\
  \ 选项为正在创建的证书设置唯一的序列号。当我们运行 `certutil` 命令时，它会要求我们在键盘上按键以生成随机种子，该种子将用于生成我们的密钥。\n\n\
  3. 我们现在有了 CA 证书，并且需要生成密钥和证书签名请求。让我们使用以下命令来完成：\n\n```\ncertutil -R -s \"CN=localhost,\
  \ O=Mastering Dart, L=Cape Town, ST=WC, C=CA\" -p \"+27 21 1234567\" -o mycert.req\
  \ -d sql:/home/akserg/Project/server/bin/pkcert\n```\n\n`-R` 命令选项会创建一个证书请求文件，该文件可以提交给\
  \ CA 以处理成最终证书。我们指定主题来标识证书所有者；在本例中，所有者是我。其他信息（如你的电话号码）也可以作为输入。输出默认为标有 `-o` 选项的输出文件。当我们运行\
  \ `certutil` 命令时，它会要求输入密码，我们可以再次使用随机种子生成密钥。\n\n4. 现在，我们可以使用以下命令查看数据库中的密钥列表：\n\n\
  ```\ncertutil -K -d sql:/home/akserg/Project/server/bin/pkcert\n```\n\n结果如下：\n\n\
  ```\n< 0> rsa e22c881d9eb382ea69257410cf464dfedcd49354   NSS Certificate DB:CACert\n\
  < 1> rsa b909266e0d5a14523158bfc7903ea9460fad2da6   (orphan)\n```\n\n5. 我们需要使用以下命令对密钥进行签名：\n\
  \n```\ncertutil -C -m 2345 -i mycert.req -o mycert.crt -c CACert -d sql:/home/akserg/Project/server/bin/pkcert\n\
  ```\n\n6. 最后，是时候使用以下命令将证书添加到数据库中了：\n\n```\ncertutil -A -n localhost_cert -t \"p,p,p\"\
  \ -i mycert.crt -d sql:/home/akserg/Project/server/bin/pkcert\n```\n\n在 `-n` 选项之后，我们的证书名称是\
  \ `localhost_cert`。\n\n7. 你可以使用以下命令查看特定证书的信息：\n\n```\ncertutil -L -n localhost_cert\
  \ -d sql:/home/akserg/Project/server/bin/pkcert\n```\n\n结果如下：\n\n```\nCertificate:\n\
  \    Data:\n        Version: 3 (0x2)\n        Serial Number: 2345 (0x929)\n    \
  \    Signature Algorithm: PKCS #1 SHA-1 With RSA Encryption\n        Issuer: \"\
  CN=CA Issuer\"\n        Validity:\n            Not Before: Thu Aug 21 17:15:05 2014\n\
  \            Not After : Fri Nov 21 17:15:05 2014\n        Subject: \"CN=Sergey\
  \ Akopkokhyants,O=Mastering Dart,L=Cape Town,ST=WC, C=CA\"\n        Subject Public\
  \ Key Info:\n            Public Key Algorithm: PKCS #1 RSA Encryption\n...\n```\n\
  \n8. 或者，你可以使用以下命令验证特定证书：\n\n```\ncertutil -V -n localhost_cert -b 9803201212Z -u\
  \ SR -e -1 -d sql:/home/akserg/Project/server/bin/pkcert\n```\n\n结果如下：\n\n```\n\
  localhost_cert : Peer’s Certificate has expired.\nlocalhost_cert : Peer’s certificate\
  \ has been marked as not trusted by the user.\n```\n\n既然我们已经完成了自签名证书的创建，是时候回到服务器代码并对其进行安全保护了。\n\
  \n### 保护服务器安全\n\n打开 `server.dart` 文件并输入以下代码：\n\n```\nimport 'dart:io';\n\nmain()\
  \ {\n  var pkcertDB = Platform.script.resolve('pkcert').toFilePath();\n  SecureSocket.initialize(database:\
  \ pkcertDB,\n    password: 'changeit');\n\n  HttpServer\n    .bindSecure(InternetAddress.ANY_IP_V6,\
  \ 8443,\n      certificateName: 'localhost_cert')\n    .then((server) {\n      server.listen((HttpRequest\
  \ request) {\n        request.response.write('Hello, world!');\n        request.response.close();\n\
  \      });\n    });\n}\n```\n\n这是著名的“Hello, World!”示例的实现。我仅在演示目的下把证书密码写在代码中。请将你的密码保存在外部加密文件中。服务器代码非常简单。唯一的小区别是引用了\
  \ `SecureSocket` 而不是 `Socket` 类。通过调用该类的静态 `initialize` 方法，我们初始化了 NSS 库。现在，我们应该通过\
  \ `HttpServer` 的静态 `bindSecure` 方法来组织绑定，以创建 HTTPS 服务器。让我们运行它并在 Dartium 浏览器中打开以下\
  \ URL：\n\n```\nhttps://localhost:8443/index.html\n```\n\n所有魔法，如 TLS 握手、密钥和消息交换，都在幕后发生。由于我们服务器的证书是自签名的，Web\
  \ 浏览器会告知我们这一事实，如以下屏幕截图所示：\n\n![](img/52c05b53a56abd53584e4fed738ed509_528_0.png)\n\
  \n\n\n\n点击**证书**信息链接可查看完整的证书信息，如下面的截图所示：\n\n![](img/52c05b53a56abd53584e4fed738ed509_529_0.png)\n\
  \n现在，关闭警告消息并点击**仍然继续**按钮，查看 HTTP 请求的结果：\n\n![](img/52c05b53a56abd53584e4fed738ed509_529_1.png)\n\
  \n我们成功实现了以下目标：\n\n- 我们生成了自签名证书，并将其注册到 CA 数据库中\n- Dart 的 `HttpServer` 接受自签名证书并正常工作\n\
  - 网络浏览器显示自签名证书信息\n- 允许客户端与服务器之间的通信\n\n## 保护客户端\n\n我们已经准备好服务器端来保护通信安全，现在来讨论 Web 应用客户端的安全性。对于我们的所有内容，我们将开始使用\
  \ TLS 安全通信，并开始使用 cookie 更新客户端。\n\n## Cookie 的属性\n\nCookie 有两个特殊属性：`Secure` 和 `HttpOnly`。Cookie\
  \ 的 `Secure` 属性允许它仅通过 TLS 连接发送。另一个属性 `HttpOnly` 将 cookie 标记为只能通过 HTTP 或 HTTPS 连接访问。将这两个属性都标记为\
  \ `true`，这一小小的改进可以防止网络浏览器通过不安全的连接发送 cookie。每次发送请求时，cookie 都会随请求头一起发送到服务器。让我们看看还可以改进其他哪些头部信息。\n\
  \n## HTTP 严格传输安全（HSTS）\n\n众所周知的 SSL 中间人攻击可以通过服务器在 HTTP 响应头中发送的 **HTTP 严格传输安全（HSTS）**\
  \ 头来安全修复，该头强制网络浏览器通过安全的 HTTPS 连接与服务器交互。代码如下：\n\n```\nStrict-Transport-Security:\
  \ max-age=31536000; includeSubDomains\n```\n\n服务器必须以秒为单位指定 `max-age` 选项；这是页面应通过\
  \ HTTPS 提供服务的时间。在我们的示例中，该值等于 365 天。`includeSubDomains` 选项是可选的，它告诉网络浏览器所有子域也必须通过安全连接提供服务。以下浏览器支持此头部：\n\
  \n- Firefox 4\n- Chromium 和 Google Chrome 4.0.211.0\n- Safari 7\n- Opera 12\n- IE\
  \ 11 之后的下一个主要版本的 Internet Explorer\n\n## 内容安全策略（CSP）\n\nWeb 应用安全模型基于同源策略原则。源是协议、主机名和端口号的组合。该策略允许我们下载并运行来自同一源的脚本。时间证明，这种策略很容易被**跨站脚本（XSS）**或数据注入攻击破坏。**内容安全策略（CSP）**\
  \ 是一个额外的安全层。它允许 Web 服务器通过保护网站来定义每个资源的来源，并缓解和报告 XSS 攻击。阻止所有内联脚本和样式可以防止执行注入到评论或帖子中的代码。CSP\
  \ 向后兼容，因此不支持它的网络浏览器仍然可以使用标准的同源策略工作。\n\n如果没有设置指令，网络浏览器会假定所有源都允许。CSP 可以通过服务器上的 HTTP\
  \ 响应头或网页上的 HTML meta 标签设置，如下面的代码所示：\n\n```\nContent-Security-Policy: policy\n```\n\
  \n策略字符串包含描述 CSP 的策略指令，指令以分号分隔，作为白名单的来源。\n\n> 并非所有网络浏览器都支持使用 HTML meta 元素来配置策略。\n\
  \n策略应包含 `default-src` 或 `script-src` 指令。这具有以下优点：\n\n- 限制内联脚本运行\n- 阻止使用 `eval` 函数\n\
  - 限制从样式元素或元素的样式属性应用内联样式\n\n内联 JavaScript 代码包含 `eval` 函数；因此，JavaScript URL 将不会被执行。你需要稍微改变关于使用\
  \ CSP 进行开发的观念。以下是一个示例，限制所有内容仅来自网站自身域名和子域名：\n\n```\nContent-Security-Policy: default-src\
  \ 'self' *.mydomain.com\n```\n\n以下示例展示了如何限制所有内容只能通过安全连接加载：\n\n```\nContent-Security-Policy:\
  \ default-src https://ibank.mydomain.com\n```\n\n在以下示例中，我们将允许所有资源从我们的网站加载，脚本从 Google\
  \ API 服务器加载：\n\n```\nContent-Security-Policy: default-src: 'self'; script-src: https://apis.google.com;\n\
  ```\n\n我们创建了 csp 项目来查看 CSP 的工作原理。服务器端代码是上一主题中服务器代码的略微修改版本，并包含路由库，如下面的代码所示：\n\n```\n\
  import 'dart:io';\nimport 'dart:async';\nimport 'package:route/server.dart';\nimport\
  \ 'urls.dart';\n```\n\n```\nimport 'files.dart';\n\nmain() {\n    var pkcertDB =\
  \ Platform.script.resolve('pkcert').toFilePath();\n    SecureSocket\n    .initialize(database:\
  \ pkcertDB, password: 'changeit');\n\n    HttpServer\n    .bindSecure(InternetAddress.ANY_IP_V6,\
  \ 8443,\n        certificateName: 'localhost_cert')\n    .then((server) {\n    \
  \    new Router(server)\n        ..filter(allUrls, filter)\n        ..serve(allUrls).listen(serveDirectory('',\
  \ as: '/'))\n        ..defaultStream.listen(send404);\n    });\n}\n\nFuture<bool>\
  \ filter(HttpRequest request) {\n    HttpResponse response = request.response;\n\
  \    response.headers.add(\"Content-Security-Policy\",\n    \"default-src 'self';\
  \ style-src 'self'\");\n    return new Future.value(true);\n}\n```\n\n我们现在使用 Route\
  \ 类的 filter 方法来拦截每个请求，并在响应中注入 Content-Security-Policy 头部，如下面的截图所示：\n\n![](img/52c05b53a56abd53584e4fed738ed509_532_0.png)\n\
  \n从我们的头部内容可以清楚地看出，来自我们网站的所有脚本和样式都是允许的。让我们想象一个用例：你需要在 Web 应用中添加一个 Google +1 按钮，让用户向他们的圈子推荐内容并为你的网站带来流量，因此只需通过\
  \ JavaScript 资源在网页中包含一个 +1 按钮，并添加一个 +1 按钮标签。必须使用 HTTPS 协议加载该脚本。以下是更改后的网页代码：\n\n\
  ```\n<!DOCTYPE html>\n<html>\n```\n\n## 安全方面\n\nCSP 在使用得当的情况下非常灵活且实用。以下浏览器支持此头部：\n\
  \n- Chrome 25（从 v14 开始，使用前缀 `webkit`）\n- Firefox 23（从 v4 开始，使用前缀 `moz`）\n- Safari\
  \ 7（从 v5 开始，使用前缀 `webkit`）\n- Opera 15\n- Internet Explorer 10 仅支持带前缀 `ms` 的 sandbox\
  \ 指令\n\n## 跨源资源共享与 JSON with padding\n\n**填充式 JSON（JSONP）** 是一种客户端技术，用于从不同域名的服务器请求数据。这是可能的，因为网络浏览器不会对\
  \ HTML `script` 标签强制执行同源策略。JSONP 请求的参数作为参数传递给脚本。JSONP 结果的格式与 JSON 的格式不同，因此服务器必须知道如何响应它。JSONP\
  \ 仅支持 `GET` 请求方法，并接受回调函数作为数据的接收者，如下面的代码所示：\n\n```\n```html\n<script src=\"http://my.com/data?format=jsonp&callback=cb\"\
  ></script>\n```\n```\n\n网络浏览器会在请求结束时调用一个函数。通过此脚本，我们将获得 JavaScript 代码，网络浏览器会将其作为普通脚本文件运行。这可能是一个很大的风险，因为提供此脚本的服务器可能已被入侵，并且容易引发\
  \ XSS 攻击。**跨源资源共享（CORS）** 可以作为 JSONP 的现代替代方案，它允许网络浏览器进行跨域通信。与 JSONP 不同，CORS 支持所有\
  \ HTTP 方法，并允许你执行以下任务：\n\n- 以跨站点方式发起 AJAX 请求\n- 加载 Web 字体以在 CSS 中的 `@font-face` 中使用\n\
  - 加载 WebGL 纹理\n- 借助 `drawImage` 方法加载绘制在画布上的图像\n\n\n\n\n\nCORS 头必须在请求的 Web 服务器的头部中返回。为了发起跨域请求，我们需要添加新的\
  \ HTTP 头，允许 Web 浏览器自由地与另一个域上的 API 通信。\n\ncors 项目包含两个服务器。第一个位于 server.dart 文件中，是一个\
  \ Web 服务器，监听我们之前主题中端口 8443 上的安全连接，如以下代码所示：\n\n```\nimport 'dart:io';\nimport 'dart:async';\n\
  \nimport 'package:route/server.dart';\n\nimport 'urls.dart';\nimport 'files.dart';\n\
  \nmain() {\n  var pkcertDB = Platform.script.resolve('pkcert').toFilePath();\n \
  \ SecureSocket\n    .initialize(database: pkcertDB, password: 'changeit');\n\n \
  \ HttpServer\n    .bindSecure(InternetAddress.ANY_IP_V6, 8443,\n        certificateName:\
  \ 'localhost_cert')\n    .then((server) {\n      new Router(server)\n        ..filter(allUrls,\
  \ filter)\n        ..serve(allUrls).listen(serveDirectory('', as: '/'))\n      \
  \  ..defaultStream.listen(send404);\n    });\n}\n\nFuture<bool> filter(HttpRequest\
  \ request) {\n  HttpResponse response = request.response;\n  response.headers.add(\"\
  Content-Security-Policy\",\n    \"default-src 'self';\" +\n    \"style-src 'self'\
  \ 'unsafe-inline';\" +\n    \"script-src 'self' https://apis.google.com;\" +\n \
  \   \"frame-src https://*.google.com;\" +\n    \"img-src https://*.gstatic.com;\"\
  \n  );\n  return new Future.value(true);\n}\n```\n\n第二个服务器位于 cors_server.dart 中，是监听端口\
  \ 8080 且不使用 HTTPS 的 CORS Web 服务器，如以下代码所示：\n\n```\nimport 'dart:io';\nimport 'dart:async';\n\
  \nimport 'package:route/server.dart';\n\nimport 'files.dart';\n\nfinal allUrls =\
  \ new RegExp('/(.*)');\nfinal productUrl = new UrlPattern('/product');\n\nmain()\
  \ {\n  HttpServer\n    .bind(InternetAddress.ANY_IP_V6, 8080)\n    .then((server)\
  \ {\n      new Router(server)\n        ..filter(allUrls, filter)\n        ..serve(productUrl).listen(serverProduct)\n\
  \        ..defaultStream.listen(send404);\n    });\n}\n\nFuture<bool> filter(HttpRequest\
  \ request) {\n  return new Future.value(true);\n}\n\nserverProduct(HttpRequest request)\
  \ {\n  return serveFile('products.json')(request);\n}\n```\n\n第二个 Web 服务器中的 filter\
  \ 函数意图设置 CORS 头并允许任何客户端向此服务器发起跨域请求。我们的客户端现在看起来像以下代码：\n\n```\nimport 'dart:html';\n\
  import 'dart:convert';\n\nvoid main() {\n  onloadHandler();\n}\n\nonloadHandler()\
  \ {\n  var xhr = new HttpRequest();\n  xhr.open('GET', 'http://localhost:8080/product',\
  \ async: true);\n  xhr.onLoad.listen((e) {\n      Map repos = JSON.decode(xhr.response);\n\
  \      var reposHTML = \"\";\n      for (int i = 0; i < repos[\"repositories\"].length;\
  \ i++) {\n          reposHTML += \"<p>\" +\n              repos[\"repositories\"\
  ][i][\"name\"] + \"<br>\" +\n              repos[\"repositories\"][i][\"description\"\
  ] + \"</p>\";\n      }\n      document.getElementById(\"allRepos\").setInnerHtml(reposHTML);\n\
  \  }).onError((e) {\n      print('error making the request. ${e.toString()}');\n\
  \  });\n  xhr.send();\n}\n```\n\n客户端代码发起跨域请求并打印带有结果的标记。让我们同时运行两个服务器并在地址 https://localhost:8443/index.html\
  \ 上用 Dartium 打开我们的网页。它立即出现跨域违规异常，如以下屏幕截图所示：\n\n> Refused to connect to 'http://localhost:8080/product'\
  \ because it violates the following Content Security Policy directive: \"default-src\
  \ 'self'\". Note that 'connect-src' was not explicitly set, so 'default-src' is\
  \ used as a fallback. index.html:1\n\n让我们在以下服务器代码中添加 connect-src 以快速修复：\n\n```\n\
  Future<bool> filter(HttpRequest request) {\n  HttpResponse response = request.response;\n\
  \  response.headers.add(\"Content-Security-Policy\",\n      \"default-src 'self';\"\
  \ +\n      \"style-src 'self' 'unsafe-inline';\" +\n      \"script-src 'self' https://apis.google.com;\"\
  \ +\n      \"frame-src https://*.google.com;\" +\n      \"img-src https://*.gstatic.com;\"\
  \ +\n      \"connect-src http://localhost:8080/product\"\n  );\n  return new Future.value(true);\n\
  }\n```\n\n重启服务器并刷新网页，你将得到以下异常：\n\n> XMLHttpRequest cannot load http://localhost:8080/product.\
  \ No 'Access-Control-Allow-Origin' header is present on the requested resource.\
  \ Origin 'https://localhost:8443' is therefore not allowed access. index.html:1\n\
  \n我们的请求无法通过源的边界，所以我们将更改 CORS Web 服务器中的 filter 方法，如下所示：\n\n```\nFuture<bool> filter(HttpRequest\
  \ request) {\n  HttpResponse response = request.response;\n  response.headers.add(\"\
  Access-Control-Allow-Origin\", \"*\");\n  return new Future.value(true);\n}\n```\n\
  \n前述代码将给出以下结果：\n\n![](img/52c05b53a56abd53584e4fed738ed509_538_0.png)\n\n这是一个简单的演示，说明我们如何在使用\
  \ CORS 的情况下使用 Web 服务器提供的数据。Dartium 向 CORS 服务器发送初始请求，其中包含与我们的网页源匹配的 Origin HTTP 头，如以下屏幕截图所示：\n\
  \n![](img/52c05b53a56abd53584e4fed738ed509_538_1.png)\n\n我们意图在 CORS 服务器中指定 Access-Control-Allow-Origin\
  \ 以允许所有域，并使用星号符号 (*) 发送服务器响应，如以下屏幕截图所示：\n\n![](img/52c05b53a56abd53584e4fed738ed509_538_2.png)\n\
  \n如果需要访问其他头，你必须通过 Access-Control-Expose-Headers 头将其公开，如下所示：\n\n```\nFuture<bool>\
  \ filter(HttpRequest request) {\n  HttpResponse response = request.response;\n \
  \ response.headers.add(\"Access-Control-Allow-Origin\", \"*\");\n  response.headers.add(\"\
  Access-Control-Expose-Headers\",\n      \"session-id\");\n  response.headers.add(\"\
  session-id\", \"123456\");\n  return new Future.value(true);\n}\n```\n\n我们按如下方式在网页中添加了一个\
  \ sessionId span 元素：\n\n```\n<p>This is a test page for CORS. <g:plusone></g:plusone></p>\n\
  Session ID: <span id=\"sessionId\"></span>\n<div id=\"allRepos\"></div>\n```\n\n\
  以下网页源代码也被更新了：\n\n```\nvar xhr = new HttpRequest();\nxhr.open('GET', 'http://localhost:8080/product');\n\
  xhr.onLoad.listen((e) {\n    var sessionId = xhr.getResponseHeader(\"session-id\"\
  );\n    document.getElementById(\"sessionId\").text = sessionId;\n```\n\n现在，重启 CORS\
  \ 服务器并重新加载网页以获得以下结果：\n\n![](img/52c05b53a56abd53584e4fed738ed509_540_0.png)\n\n\
  CORS 在以下知名 Web 浏览器中得到支持：\n\n- Chrome 3\n- Firefox 3.5\n- Opera 12\n- Safari 4\n\
  - Internet Explorer 8\n\n3. 点击 CREATE 按钮创建新的 API 密钥。服务器将你移动到你的域列表，如以下屏幕截图所示：\n\n\
  ![](img/52c05b53a56abd53584e4fed738ed509_542_0.png)\n\n4. 选择你的域以查看以下详细信息：\n\n![](img/52c05b53a56abd53584e4fed738ed509_542_1.png)\n\
  \n有我们将在解决方案中使用的公钥和私钥。为了在 captcha 项目中集成 reCAPTCHA 解决方案，我们使用了我创建的并且可在 https://pub.dartlang.org/\
  \ 服务器上获得的小型库 recaptcha。因此，我们可以在 pubspec.yaml 文件的 dependencies 包下添加它。打开 Dart Editor\
  \ 中的 captcha 项目并导航到 index.html，其显示在以下代码中：\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n\
  <title>Registration</title>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\"\n\
  content=\"width=device-width, initial-scale=1\">\n<link type=\"text/css\" href=\"\
  index.css\">\n</head>\n<body>\n    <H1>Registration form with CAPTCHA</H1>\n   \
  \ <form name=\"captcha_form\" method=\"post\" action=\"/register\">\n        <label\
  \ for=\"username\">Username:</label>\n        <input type=\"text\" name=\"username\"\
  ><br>\n        <label for=\"password\">Password:</label>\n        <input type=\"\
  password\" name=\"password\">\n        <script type=\"text/javascript\"\n      \
  \      src=\"http://www.google.com/recaptcha/api/challenge?k=6Lc8a_kSAAAAABk-6joEQu_wurhopTGt4xCPndnX\"\
  >\n        </script>\n        <noscript>\n            <iframe src=\"http://www.google.com/recaptcha/api/noscript?k=6Lc8a_kSAAAAABk-6joEQu_wurhopTGt4xCPndnX\"\
  \n                height=\"300\" width=\"500\" frameborder=\"0\"></iframe><br>\n\
  \            <textarea name=\"recaptcha_challenge_field\" rows=\"3\"\n         \
  \       cols=\"40\"></textarea>\n            <input type=\"hidden\" name=\"recaptcha_response_field\"\
  \n                value=\"manual_challenge\">\n        </noscript>\n        <button\
  \ type=\"submit\" value=\"Submit\">Submit</button>\n    </form>\n</body>\n</html>\n\
  ```\n\n将 reCAPTCHA 上注册的域的公钥复制并粘贴为 JavaScript 的参数以及 iframe 标签源的参数。你需要为你的公钥更改这些值。现在，让我们打开\
  \ server.dart 文件并移动到第 10 行，在那里我们创建了 ReCaptcha 类的实例。再次，将你域的一对私钥和公钥复制并粘贴到此处，以便类实例可以通过免费服务\
  \ reCAPTCHA 在 Google 上将它们传递，以确保发送者正确并且拥有注册的域，如以下代码所示：\n\n```\n...\n    final ReCaptcha\
