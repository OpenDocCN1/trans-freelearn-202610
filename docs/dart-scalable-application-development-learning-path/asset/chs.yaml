  \ after the CAPTCHA timed out',\n    'recaptcha-not-reachable':'Unknown error in\
  \ CAPTCHA'};\n```\n\n然后，在 serverRegister 函数中读取 POST 方法参数，并将其转换为映射，以便稍后轻松访问。所有参数都通过\
  \ Recaptcha 的 checkAnswer 方法遵循 reCAPTCHA 验证，如下面的代码所示：\n\n```\nserveRegister(HttpRequest\
  \ request) {\n    HttpResponse response = request.response;\n    request.listen((List<int>\
  \ buffer) {\n      String strBuffer = new String.fromCharCodes(buffer);\n      Map\
  \ data = postToMap(strBuffer);\n      //\n      String userName = data.containsKey('username')\
  \ ?\n          data['username'] : '';\n      String password = data.containsKey('password')\
  \ ?\n          data['password'] : '';\n      String cptChallenge =\n          data.containsKey('recaptcha_challenge_field')\
  \ ?\n          data['recaptcha_challenge_field'] : '';\n      String cptResponse\
  \ =\n          data.containsKey('recaptcha_response_field') ?\n          data['recaptcha_response_field']\
  \ : '';\n      reCaptcha.checkAnswer(request.uri.host, cptChallenge,\n      cptResponse).then((ReCaptchaResponse\
  \ cptResponse) {\n        response.statusCode = HttpStatus.OK;\n        setCORSHeader(response);\n\
  \        if (cptResponse.valid) {\n          response.write(\"Registration success.\"\
  );\n        } else {\n          response.write(MESSAGES[cptResponse.errorCode]);\n\
  \        }\n        response.close();\n      });\n    });\n  }\n```\n\n让我们快速返回并输入正确的\
  \ CAPTCHA 答案。提交后，您将看到以下成功消息：\n\n![](img/52c05b53a56abd53584e4fed738ed509_546_0.png)\n\
  \n### 安全最佳实践\n\n现在该讨论最佳安全实践了，没有它们，这个故事就不完整：\n\n- **不要保留密码**：HTTP 基本认证已被弃用，因此请使用\
  \ OAuth 等其他技术，按照标准构建更安全的应用程序。使用安全的 OAuth 令牌代替密码。\n- **执行输入验证**：您应始终净化所有输入数据。您需要检查字符串长度、验证文件类型，并检查最小值和最大值，以确保通过\
  \ POST 请求发送到服务器的所有数据都具有正确的格式和长度。\n- **过滤输入并净化输出**：您应始终过滤从客户端到 Web 服务器的所有数据，并净化返回给客户端的所有数据。\n\
  - **使用安全连接**：使用 TLS 证书在 Web 浏览器和服务器之间建立安全连接，以通过 TLS 提供所有 REST API 或 AJAX 请求。TLS\
  \ 与 OAuth 结合是一种安全且推荐的解决方案。\n- **不要暴露调试信息**：不要忘记关闭调试日志，因为它们可能包含敏感信息。\n- **测试边界**：您的测试必须检查所有可能的正面和负面情况及场景。\n\
  - **隐藏服务器信息**：不要在任何服务器生成的文档上显示服务器信息，因为这会使黑客能够从网页上免费获得或由黑客自己开发的攻击手段中选择合适的攻击方式。\n\n\
  ### 总结\n\n在本章中，您学习了如何使用 NSS 工具创建 TLS 证书。您还看到，无需开发人员额外努力，就可以快速将证书嵌入 Dart Web 服务器。\n\
  \n我们发现了如何使用 cookie 的 `Secure` 和 `HttpOnly` 特殊属性来保护客户端，防止 Web 浏览器通过不安全的连接发送 cookie。\n\
  \n我们使用 HSTS 来防止 SSL 中间人攻击。我们应用 CSP 来确保 Web 浏览器只能加载和使用允许的内容。我们还使用 CORS 来指定可以从我们的\
  \ Web 服务器共享哪些资源，以及为什么该解决方案比 JSONP 好得多。最后，我们在项目中嵌入了基于 Google 免费服务 reCAPTCHA 的 CAPTCHA\
  \ 解决方案。\n"
