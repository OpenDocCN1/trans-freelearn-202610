  \ (e) => e is Exception);\n  ```\n\n- 通常，你希望在异步处理无论成功还是出错后都执行一个清理方法。在这种情况下，使用 `whenComplete`：\n\
  \n  ```dart\n  firstStep()\n      .then((_) => secondStep())\n      .catchError(handleError)\n\
  \      .whenComplete(cleanup);\n  ```\n\n关于同步和异步错误的处理，假设我们想要调用一个函数 `mixedFunction`，其中包含对可能抛出异常的同步调用\
