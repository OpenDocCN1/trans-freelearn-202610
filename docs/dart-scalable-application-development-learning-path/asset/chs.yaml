  \ event.touches[0].page.y);\n    // If the finger is over an element indicate that\
  \ in the UI\n    if (dropTarget != null) {\n        dropTarget.classes.add('over');\n\
  \    }\n}\n```\n\n\n\n\n## 处理 Web 应用程序\n### 操作步骤...\n\n执行以下步骤来创建一个 Chrome 应用。本操作指南的代码可以在项目\
