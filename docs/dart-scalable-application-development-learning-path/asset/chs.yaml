  \n### 配置 Dart 环境\n\n本方案将帮助根据我们的需求定制 Dart 环境。在这里，我们配置以下内容：\n\n- 定义 `DART_SDK` 环境变量\n\
  - 使 `dart-sdk\\bin` 可用于执行 Dart 命令行工具\n\n#### 准备工作\n\n我们假设您的机器上已安装了可工作的 Dart 环境。如果没有，请访问\
