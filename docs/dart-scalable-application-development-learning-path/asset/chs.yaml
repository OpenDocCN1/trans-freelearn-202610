  \n- 3. 通过运行 `bin\\socket_client.dart` 启动一个（或多个）客户端。\n\n以下是服务器控制台的输出：\n\n**serversocket\
  \ is ready**\n\n**Connection from: ::200:0:8017:7b01%211558873:6564**\n\n**Hello,\
  \ World from a client!**\n\n以下是客户端控制台的输出：\n\n**_Socket**\n\n**Hello from Simple\
  \ Socket Server!**\n\n**Connected to: 74.125.136.139:80**\n\n我们可以看到存在双向通信。\n\n###\
  \ How it works...\n\n在步骤 1 中，通过将 `ServerSocket` 绑定到它将监听的特定 TCP 端口，创建了一个用于处理客户端套接字连接的服务器。此绑定方法返回一个\
  \ `Future<ServerSocket>`。同样，我们将使用 `Future.then` 方法来注册我们的回调，以便我们知道套接字何时已绑定到端口。然后，服务器开始监听并为每个传入连接调用\
  \ `handleClient`。此回调打印来自客户端的远程地址，打印客户端发送的数据，向客户端写入消息，然后关闭连接。\n\n在步骤 2 中，客户端首先连接到\
  \ www.google.com 的端口 80（提供网页的端口）。套接字连接到服务器后，IP地址和端口会打印到屏幕上。然后，使用 socket.destroy\
  \ 关闭套接字。在此步骤的第二部分中，我们连接到本地套接字服务器，使用 socket.write 向其写入消息，并使用 socket.listen 开始监听服务器。我们将作为整数列表传入的数据转换为打印出来的字符串。\n\
  \n### There's more...\n\n套接字通信通常会被防火墙阻止；如果这是问题，请查看以下配方中的 WebSockets。\n\nDart 也支持\
  \ UDP 套接字编程；James Slocum 的文章提供了详细的讨论，网址为 http://jamesslocum.com/post/77759061182。\n\
  \n## Using WebSockets\n\n本配方将向您展示如何在客户端-服务器应用程序（包括 Web 和命令行客户端）中使用 WebSockets，以及它的优势。您可以在项目\
  \ websockets 中找到代码。\n\n### Getting ready\n\nHTTP 是一种简单的基于请求-响应的协议，然后从应用程序的角度来看，连接会在下一次请求之前断开。在现代\
  \ Web 应用程序中（例如在线多人游戏中），客户端和服务器同等重要；应用程序状态的更改可以在双方发生。因此，我们需要在客户端和服务器之间建立一个双向通信通道，允许双向实时更新和更多交互；这正是\
  \ WebSockets 所提供的。浏览器和服务器之间的 WebSocket 连接是通过握手请求建立的。这是一个带有头部中升级标志的常规 HTTP 客户端请求，还包含一个\
  \ Sec-WebSocket-Key，这是一个经过 base64 编码的随机值。为了完成握手，服务器会响应 Sec-WebSocket-Accept。\n\n\
  WebSockets 已在所有现代浏览器中实现（Internet Explorer v10 及以上版本），也可以在非 Web 应用程序中使用。通信通过 TCP\
  \ 端口 80 进行，因此可以不受阻碍地通过防火墙。\n\n### How to do it...\n\n执行以下步骤使 WebSockets 服务器工作：\n\
  \n- 1. 使用以下代码设置 WebSockets 服务器（参见 `websocket_server.dart`）：\n\n```dart\nimport 'dart:io';\n\
  import 'dart:async';\n\nInternetAddress HOST = InternetAddress.ANY_IP_V6;\nconst\
  \ PORT = 8080;\n\nmain() {\n  runZoned(startWSServer, onError: handleError);\n}\n\
  \nstartWSServer() {\n  HttpServer.bind(HOST, PORT)\n    .then((server) {\n     \
  \ print('Http server started on $HOST $PORT');\n      server.listen(handleRequest);\n\
  \    });\n}\n\nhandleError(e, stackTrace) {\n  print('An error occurred: $e $stackTrace');\n\
  }\n\nhandleRequest(HttpRequest req) {\n  if ((req.uri.path == '/ws') // command-line\
  \ client\n      || WebSocketTransformer.isUpgradeRequest(req) // web-client\n  \
  \   ) {\n    // Upgrade a HttpRequest to a WebSocket connection.\n    WebSocketTransformer.upgrade(req).then(handleWebSocket);\n\
  \  }\n  else {\n    print(\"Regular ${req.method} request for: ${req.uri.path}\"\
  );\n    serveNonWSRequest(req);\n  }\n}\n\nhandleWebSocket(WebSocket socket) {\n\
  \  print('Client connected!');\n  socket.listen((String msg) {\n    print('Message\
  \ received: $msg');\n});\n\nws.onError.first.then((_) {\n    print(\"Failed to connect\
  \ to ${ws.url}. \"\n    \"Please rerun bin/websocket_server.dart and try again.\"\
  );\n});\n}\n\nvoid outputMessage(Element e, String message){\n    print(message);\n\
  \    e.appendText(message);\n    e.appendHtml('<br/>');\n    //Make sure we 'autoscroll'\
  \ the new messages\n    e.scrollTop = e.scrollHeight;\n}\n```\n\n服务器运行时，通过打开 websocket_webclient.html\
  \ 启动 Web 客户端，并输入一些文本。Web 服务器接收到的文本会被回显，并在页面和编辑器控制台中显示如下：\n\n![](img/52c05b53a56abd53584e4fed738ed509_744_0.png)\n\
  \n一个 WebSocket Web 客户端\n\n### How it works...\n\n在步骤 1 中，服务器在 runZoned() 子句中运行，以添加额外的异常处理功能（参见\
  \ Serving files with http_server 配方）。我们像往常一样启动 Web 服务器。在 handleRequest 中，我们检查请求的路径是否以\
  \ /ws 结尾。如果是，则表示命令行客户端发出 WebSocket 请求。Web 客户端发出 WebSocket 请求时会将升级标志添加到头部。对于此，我们可以使用\
  \ WebSocketTransformer 类的 isUpgradeRequest 方法进行测试。如果是这种情况，我们在同一类上调用 upgrade 方法，并在完成后调用\
  \ handleWebSocket 方法。这开始监听客户端连接，在服务器控制台中打印任何客户端消息，并将此回显给客户端。如果消息是 JSON 字符串，我们可以在开始监听客户端连接之前使用\
  \ socket.map((string)=> JSON.decode(string)) 对其进行解码。\n\n对于普通 HTTP 请求，使用 serveNonWSRequest\
  \ 来阻止它，但当然，我们也可以进行正常的 Web 请求处理。\n\n步骤 2 中的命令行客户端使用来自 dart:io 的 WebSocket 类。它使用 ws://\
  \ URL 作为 connect 方法的参数连接到 WebSocket 服务器。然后，它可以使用 add 向套接字写入并使用 listen 在套接字上接收消息。\n\
  \n步骤 3 中的 Web 客户端使用来自 dart:html 的 WebSocket 类。使用其构造函数并传入服务器的 URI 打开 Web 套接字连接。对此实例调用的\
  \ send 方法将客户端数据（此处为输入字段的文本）发送到服务器。当可以从套接字读取服务器的响应时，会触发 onMessage 事件并显示响应。WebSocket\
  \ 实例的其他有用事件有：\n\n- onOpen: 连接建立时调用\n- onClose: 当套接字不再可用时调用（因为服务器已关闭或网络连接失败）\n- onError:\
  \ 客户端-服务器对话期间发生错误时调用\n\n### There's more...\n\npub 包 route 可用于将回调与 URL 模式关联。在本配方中，我们可以改用\
  \ route 包中的 Router 来测试 /ws 模式。我们导入此包，然后 startWSServer 将包含以下代码：\n\n```dart\nimport\
  \ 'package:route/server.dart' show Router;\n\nstartWSServer() {\n  HttpServer.bind(HOST,\
  \ PORT).then((server) {\n  print('Http server started on $HOST $PORT');\n  Router\
  \ router = new Router(server);\n```\n\n\n\n\n```\nrouter.serve('/ws').transform(new\
  \ WebSocketTransformer()).\n    listen(handleWebSocket);\n});\n}\n```\n\n作为路由如何有用的一个更一般的例子，考虑以下示例。假设我们的客户端搜索以\
  \ /stocks 和 /stocks/GOOG 结尾的 URL 的股票数据。然后，我们可以将 pattern1 和 pattern2 定义为 UrlPattern\
  \ 类的实例，其正则表达式包含以下模式：\n\n```\n// Pattern for all stocks(plural).\nfinal stocksUrl\
  \ = new UrlPattern(r'/stocks\\/?');\n// Pattern for a single stock('/stock/GOOG',\
  \ for example).\nfinal stockUrl = new UrlPattern(r'/stock/(\\d+)\\/?');\n```\n\n\
  然后，我们的路由器实例将通过 serve 方法将回调函数 serveStocks 和 serveStock 绑定到这些模式：\n\n```\nvar router\
  \ = new Router(server)\n..serve(stocksUrl, method: 'GET').listen(serveStocks)\n\
  ..serve(stockUrl, method: 'GET').listen(serveStock)\n    // all other possible patterns\
  \ and method combinations\n..defaultStream.listen(serveNotFound);\n```\n\n如第一个示例所示，模式也可以是简单的字符串，如\
  \ /stockdata。\n\n## 另请参阅\n\n- 有关 runZoned 的更多信息，请参阅使用 http_server 的“提供文件服务”指南。\n\
  - Dart 网站提供了一个关于使用 WebSockets 和 Dartiverse Search 实现的搜索应用的非常好的教程，网址为 https://www.dartlang.org/docs/dart-up-and-running/contents/ch05.html\n\
  \n## 使用安全套接字和服务器\n\n在本指南中，我们将介绍如何使您的 Web 服务器使用 HTTPS 协议上的安全套接字层（SSL）加密与客户端的通信。\n\
  \n## 准备工作\n\nDart 使用 SSL/TLS 安全机制；它依赖 X.509 证书来验证服务器和（可选）客户端。服务器提供一个证书，向客户端证明自己是受信任的服务器。当客户端接受该证书时，将交换对称会话密钥，用于加密服务器与客户端之间的通信。因此，为了让您的服务器提供安全连接，它必须安装由证书颁发机构（CA）提供的安全证书。\n\
  \nDart 使用网络安全服务（NSS）数据库来存储服务器的私钥和证书。在我们的示例中，我们将使用子文件夹 pkcert 中的测试证书数据库，该数据库也作为示例在\
  \ https://www.dartlang.org/docs/tutorials/httpserver/ 的教程中提供。\n\n您可以自行设置 NSS 密钥数据库来创建用于测试目的的证书。James\
  \ Locum 在 http://jamesslocum.com/post/70003236123 提供了如何执行此操作的详细说明。\n\n## 操作步骤...\n\
  \n程序 secure_server.dart 向我们展示了启动安全服务器所需的代码；执行以下步骤以使用安全套接字和服务：\n\n+   1. 导入 dart:io\
  \ 包，如下所示：\n\n```\nimport 'dart:io';\n\nInternetAddress HOST = InternetAddress.LOOPBACK_IP_V6;\n\
  const int PORT = 8080;\n\nmain() {\n```\n\n+   2. 使用以下代码读取证书：\n\n```\nvar testcertDb\
  \ =\n  Platform.script.resolve('pkcert').toFilePath();\nSecureSocket.initialize(database:\
  \ testcertDb, password:\n  'dartdart');\n```\n\n+   3. 使用以下代码使用证书启动 HTTP 服务器：\n\n\
  ```\nHttpServer.bindSecure(HOST, PORT, certificateName:\n  'localhost_cert').then((server)\
  \ {\n  print('Secure Server listening');\n  server.listen((HttpRequest req) {\n\
  \    print('Request for ${req.uri.path}');\n    var resp = req.response;\n    resp.write(\"\
  Don't worry: I encrypt your messages!\");\n```\n\n```\nresp.close();\n    });\n\
  \  });\n}\n```\n\n4. 如果我们现在在浏览器中使用 URL https://localhost:8080，首先会看到一个警告屏幕，提示此连接不受信任（因为这只是测试证书）。如果我们继续，我们会在浏览器屏幕上看到服务器的响应，如下面的截图所示：\n\
  \n![](img/52c05b53a56abd53584e4fed738ed509_748_0.png)\n\n以下是安全命令行客户端（secure_client.dart）的代码：\n\
  \n```\nimport 'dart:io';\n\nInternetAddress HOST = InternetAddress.LOOPBACK_IP_V6;\n\
  const int PORT = 4777;\nSecureSocket socket;\n\nvoid main() {\n  SecureSocket.connect(HOST,\
  \ PORT, onBadCertificate:\n      (X509Certificate c) {\n    print(\"Certificate\
  \ WARNING: ${c.issuer}:${c.subject}\");\n    return true;\n  }).then(handleSecureSocket);\n\
  }\n\nhandleSecureSocket(SecureSocket ss) {\n  // send to server:\n  ss.write(\"\
  From client: can you encrypt me server?\");\n  // read from server:\n  ss.listen((List\
  \ data) {\n    String msg = new String.fromCharCodes(data).trim();\n    print(msg);\n\
  \  });\n}\n```\n\n客户端控制台给出以下输出：\n\n**证书警告：CN=myauthority:CN=localhost**\n\n## 工作原理...\n\
  \n在步骤 1 中，我们读取证书。带有 `Platform.script` 的第一行找到文件夹 `pkcert` 的路径，证书数据库位于该文件夹中。然后我们在\
  \ `SecureSocket` 类上调用 `initialize` 方法，提供证书。在步骤 2 中，通过绑定到主机和端口并提供证书名称来启动安全服务器。步骤\
  \ 3 向我们展示了浏览器连接到安全服务器。\n\n在步骤 4 中，我们看到了命令行客户端如何通过调用 `SecureSocket.connect()` 连接到安全服务器。这需要一个\
  \ `onBadCertificate` 回调，该回调必须返回一个布尔值，指示是接受还是拒绝无效证书。测试证书将触发此回调，因此我们需要返回 `true` 才能使用此证书。对于\
  \ `SecureSocket` 的 `write` 和 `listen` 方法，让我们向安全服务器写入和读取。\n\n## 另请参阅\n\n- 有关 `Platform`\
  \ 类的更多详细信息，请参阅第 1 章 *使用 Dart 工具* 中的 *从操作系统获取信息* 指南。\n- 有关证书及其创建的更多信息，请参阅 https://help.ubuntu.com/12.04/serverguide/certificates-and-security.html\n\
  \n## 使用 JSON Web 服务\n\n在本指南中，我们让一个浏览器应用以 JSON 格式从 Web 服务（Yahoo 股票数据）请求数据，解码该数据，并动态构建显示数据的网页。\n\
  \n## 准备工作\n\n我们将使用的 URL 如下所示：http://query.yahooapis.com/v1/public/yql?q=SELECT。\n\
