  \ function* 配方以了解有关 `Timer` 类的更多信息\n\n## 使用 Futures 进行错误处理\n\n本配方向您展示了在处理 Futures\
  \ 时如何全面处理错误。随附的代码 `future_errors.dart`（位于 `future_errors` 项目的 bin map 内）说明了不同的可能性；然而，这不是一个真正的项目，因此不打算按原样运行。\n\
  \n## 准备工作\n\n当返回 `Future` 值的函数成功完成（在代码中由 `then` 信号表示回调）时，会执行回调函数 `handleValue`，它接收返回的值。如果发生错误条件，则回调\
  \ `handleError` 会处理它。假设此函数是 `getFuture()`，其结果为 `Future`，返回值为类型 `T`，那么这等同于以下代码：\n\
  \n```\nFuture<T> future = getFuture();\nfuture.then(handleValue)\n.catchError(handleError);\n\
  \nhandleValue(val) {\n    // processing the value\n}\n\nhandleError(err) {\n   \
  \ // handling the error\n}\n```\n\n有时高亮的代码也会写成如下形式，只是为了使返回值明确：\n\n```\nfuture.then(\
