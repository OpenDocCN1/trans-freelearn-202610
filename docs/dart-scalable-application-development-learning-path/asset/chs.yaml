  bin\\test_checked_mode.dart`），如下面的代码所示：\n\n```\nmain() {\n    isCheckedMode();\n\
  \    // your code starts here\n}\n\nvoid isCheckedMode() {\n    try {\n        int\
  \ n = '';\n        throw new Exception(\"Checked Mode is disabled!\");\n    } on\
  \ TypeError {\n```\n\n```\n```dart\nprint(\"Checked Mode is enabled!\");\n}\n}\n\
  ```\n```\n\n## 下载示例代码\n\n你可以从你的账户 http://www.packtpub.com 下载你所购买的所有 Packt 图书的示例代码文件。如果你在其他地方购买了本书，可以访问\
