- '# Dart：可扩展应用开发（学习路径）






  '
- "## 前言\n\nGoogle 的 Dart 专为创建下一代应用而设计，提供了一个更强大的框架，并在多个方面超越了 JavaScript。熟悉却创新，紧凑却可扩展，它打破了\
  \ JavaScript 长期积累的局限性。Dart 专为出色的工具支持和开发者生产力而设计，让你能够比以往更快地创建更好的应用。Google 将其用于其价值数十亿美元的广告业务，你也可以将其强大功能用于你的项目。\n\
  \n## 本学习路径涵盖的内容\n\n模块 1，Dart By Example，\n\n本书将从 Dart 的构想到其当前形态，以及它将走向何方，通过引人入胜的实质性实践项目向你介绍\
  \ Dart 语言。你将通过构建典型应用并探索 HTML5 的令人兴奋的新技术来学习。\n\n通过诸如实时数据监控和查看系统、博客系统、幻灯片演示应用等示例代码项目，本书将一步步指导你轻松快速地构建数据驱动的\
  \ Web 应用。\n\n模块 2，Mastering Dart，\n\n从讨论 Dart 的基本特性开始，我们将深入到更复杂的概念，如泛型、带反射的注解、错误和异常，这将帮助我们改进代码。继续下去，你将学习何时以及如何创建对象，以及执行异步代码的高级技术。你还将学习集合框架以及如何使用\
  \ Dart 与用 JavaScript 编写的不同程序进行通信。\n\n本模块将向你展示如何在 Web 应用中添加国际化支持，以及如何将 i18n 和 i10n\
  \ 访问嵌入到你的代码中，以设计可轻松本地化的应用。你将学习如何组织客户端到服务器的通信，以及如何在 Dart 中使用不同的 HTML5 功能。最后，本书将向你展示如何本地存储数据、突破存储限制并防止\
  \ Web 应用中的安全问题。\n\n模块 3，Dart Cookbook，\n\n本模块是一本实用指南，将提高你编写各种应用的专业知识，包括 Web 应用、脚本和服务器端应用。它提供了丰富的信息，说明如何扩展你的\
  \ Dart 编程技能。\n\n## 本学习路径所需条件\n\n一台运行 Windows、Linux 或 Mac OS 的现代计算机足以运行本书中的工具和程序。\n\
  \n以下内容的细节以及 WebStorm 的替代方案在模块 1，第 1 章中讨论，\n\n启动文本编辑器：\n\n- Dart SDK 和 Dartium (http://www.dartlang.org)\n\
  - WebStorm (https://www.jetbrains.com/webstorm/)\n- Java (https://java.com/en/download)\n\
  - wrk——一个 HTTP 基准测试工具 (https://github.com/wg/wrk)\n\n对于数据库项目，我们使用 PostgreSQL 和 pgAdmin：\n\
  \n- PostgreSQL (http://www.postgresql.org/)\n- pgAdmin (http://www.pgadmin.org/)\n\
  \n要使用本模块 3 的代码，你需要 Dart SDK 和 Dart Editor，可以从 www.dartlang.org 下载。只需解压下载的文件即可开始使用。由于\
  \ Dart Editor 基于 Eclipse，你还需要一个 Java 运行时 (http://www.oracle.com/technetwork/java/javase/downloads/jre8-downloads-2133155.html)。选择适合你系统的版本（32\
  \ 位或 64 位）；下载后，双击 .exe 文件进行安装。\n\n## 本学习路径适合谁\n\n如果你熟悉 Web 开发，并且希望学习或只是评估 Dart 作为多用途语言，本学习路径适合你。不假设对\
  \ Dart 语言有任何熟悉。对于初学者，它将作为指南，迅速从初级水平加速到大师水平；对于中级到高级开发者，它将快速填补 Dart 的空白，并可以以实用方式探索各种应用类型和强大的包。\n\
  \n## 读者反馈\n\n我们始终欢迎读者的反馈。请告诉我们你对本课程的看法——你喜欢或不喜欢什么。读者反馈对我们很重要，因为它帮助我们开发出你能真正从中获益的书目。\n\
  \n如需发送一般反馈，只需发送电子邮件至 feedback@packtpub.com，并在邮件主题中提及课程标题即可。\n\n如果你在某个主题方面有专业知识，并且有兴趣撰写或为书籍做出贡献，请参阅我们的作者指南\
  \ www.packtpub.com/authors。\n\n## 客户支持\n\n现在你已成为 Packt 课程的自豪拥有者，我们有一系列资源帮助你充分利用你的购买。\n\
  \n## 下载示例代码\n\n你可以从 http://www.packtpub.com 在你的账户中下载本课程的示例代码文件。如果你是在其他地方购买本课程的，可以访问\
  \ http://www.packtpub.com/support 并注册以便将文件直接发送到你的电子邮件。\n\n你可以通过以下步骤下载代码文件：\n\n1.\
  \ 使用你的电子邮件地址和密码登录或注册我们的网站。\n2. 将鼠标悬停在顶部的 **SUPPORT** 选项卡上。\n3. 点击 **Code Downloads\
  \ & Errata**。\n4. 在 **Search** 框中输入课程名称。\n5. 选择你想要下载代码文件的课程。\n6. 从下拉菜单中选择你购买本课程的地点。\n\
  7. 点击 **Code Download。**\n\n你也可以通过在 Packt Publishing 网站的课程网页上点击 **Code Files** 按钮来下载代码文件。此页面可以通过在\
  \ **Search** 框中输入课程名称来访问。请注意，你需要登录你的 Packt 账户。\n\n下载文件后，请确保使用最新版本的以下工具解压或提取文件夹：\n\
  \n- WinRAR / 7-Zip for Windows\n- Zipeg / iZip / UnRarX for Mac\n- 7-Zip / PeaZip\
  \ for Linux\n\n本课程的代码包也托管在 GitHub 上，地址为 `https://github.com/PacktPublishing/Dart-Scalable-Application-Development`。我们还在\
  \ `https://github.com/PacktPublishing/` 上托管了来自我们丰富的书籍、视频和课程目录的其他代码包。快去看看吧！\n\n##\
  \ 勘误\n\n尽管我们已尽一切努力确保内容的准确性，但错误难免。如果你发现本课程中的任何错误——可能是文本或代码中的错误——我们将非常感激你向我们报告。通过这样做，你可以为其他读者节省挫败感，并帮助我们改进后续版本的课程。如果你发现任何勘误，请访问\
  \ `http://www.packtpub.com/submit-errata`，选择你的课程，点击 **Errata Submission Form** 链接并输入勘误详情。一旦你的勘误得到验证，你的提交将被接受，勘误将被上传到我们的网站或添加到该标题现有勘误列表的\
  \ **Errata** 部分。\n\n要查看之前提交的勘误，请访问 `https://www.packtpub.com/books/content/support`\
  \ 并在搜索字段中输入课程名称。所需信息将出现在 **Errata** 部分下。\n\n\n\n\n\n## 启动文本编辑器\n\n> 梯子的横档从来不是为了让人休息，而只是让人的脚踩稳片刻，以便他能把另一只脚抬得更高一些。\n\
  >\n> ——托马斯·赫胥黎\n\n## 定义 Dart\n\nDart 是一种用于现代 Web 应用的语言和平台，既可以运行在 Web 浏览器中，也可以运行在服务器上。Dart\
  \ 语言、工具和 API 使创新、高效、开明且才华横溢的开发人员（就是你！）能够编写充分利用现代 Web 的可扩展 Web 应用。\n\n借助 Dart，你可以在\
  \ Web 开发和工具方面实现飞跃。它拥有干净、现代而熟悉的语言语法，运行在由世界顶尖虚拟机专家打造的平台之上。\n\nDart 作为一个开源项目运行，并设有明确的增强提案流程。它拥有灵活的库，支持常见的文档打包、单元测试和依赖解析。该语言于\
  \ 2014 年 7 月成为 ECMA 标准，由于可编译为 JavaScript，因此最终用户无需任何插件即可运行。\n\n如果这还不够，你还可以将现有的 HTML、CSS、JavaScript\
  \ 技能甚至代码一并带进来——Dart 与其它技术协作得很好！\n\n## Web 脚本的历史\n\n当前网页高度复杂，具有动画、动态内容、淡入淡出、3D 效果、响应式设计和精巧的导航，这让我们很容易忘记早期\
  \ Web 大多是文本页面、简陋表单和常常需要长时间加载的图片。然后，JavaScript 以内置于浏览器的脚本解释器形式出现，提供表单数据验证、新闻滚动条、移动显示、动画和游戏。对于小型项目，它成功地为静态网站增添了生气，而无需服务器端\
  \ CGI 脚本。\n\n开发人员享受近乎即时的编辑和刷新循环——修改一行代码，然后在浏览器中按 F5（刷新）即可查看结果。JavaScript 并没有停留在浏览器中，很快出现在\
  \ Web 应用的服务器端。它也成为浏览器之外使用的通用脚本。\n\n> 有趣的事实：**JavaScript** 是由 Brendan Eich 在短短十天内为\
  \ Netscape 浏览器编写的，最初被称为 **LiveScript**。Dart 也被改名过——最初它被称为 Dash。\n\n![](img/52c05b53a56abd53584e4fed738ed509_24_0.png)\n\
  \n考虑到它编写时的时间跨度，JavaScript 是一项伟大的技术成就，但在 20 年里它并没有进步太多，而 Web 应用却在飞速发展。Web 应用可能包含数千行\
  \ JavaScript 代码。除了非常简单的页面之外，纯 JavaScript 已经不够用了，大量涌现的辅助开发工具和库就是明证。\n\n这些解决方案中有许多都是为了解决\
  \ JavaScript 的问题而创建的，涵盖从语法和特性到设计和生产力各个方面。这种语言当初根本就不是为现代 Web 所需类型的 Web 应用而设计的。\n\n\
  JavaScript 引擎近年来的进步带来了性能上的巨大飞跃。为 Chrome 浏览器和 Node.js 提供动力的 V8 引擎在使新型应用成为可能方面表现出巨大改进。然而，JavaScript\
  \ 虚拟机优化带来的回报正随着时间的推移而递减。\n\n## Dart 的起源\n\nGoogle 在大型 Web 应用和编写 Web 浏览器方面都拥有丰富的经验。他们显然对更好的\
  \ Web 平台（让人们更多地搜索）和提高开发人员生产力（以保持竞争优势）有着强烈的自身利益。在 Google 的演示中提到，他们的 Gmail Web 应用中的一次代码更改需要大约\
  \ 20 分钟来重建站点，以供开发人员测试。\n\n这让人回想起几十年前的软件构建时间。为解决此问题而启动的项目开始了，Google 希望以开源项目的形式与开发社区分享和合作。\n\
  \n![](img/52c05b53a56abd53584e4fed738ed509_25_0.png)\n\n2011 年，在 GOTO 大会上，Dart 语言和虚拟机向全世界亮相。Dart\
  \ 被设计成一个“开箱即用”的项目——一个用于编写、编译、测试、文档化和部署 Web 应用的完整技术栈。\n\n该项目由 Chrome 团队开发，由 Lars\
  \ Bak（Java HotSpot VM 和 JavaScript V8 引擎的开发者）和 Kasper Lund（一位 V8 开发者）创立。其目标既是通过为高性能客户端\
  \ Web 应用开辟新途径来改善开放 Web 平台，也是为了提升开发人员的生产力。\n\n这种新兴语言被设计为具有类似 Java、C# 和 JavaScript\
  \ 的熟悉的“花括号”语法，可在客户端和服务器上运行，并且通过能够编译为常规 JavaScript 来支持所有现代 Web 浏览器。只有能够令人满意地编译为 JavaScript\
  \ 的新语言特性才会被添加到 Dart 中。\n\nDart 通常被称为 **DartLang**，以避免与其他“darts”混淆。在网络上搜索以获得更好结果时，请记住这一点。与\
  \ JavaScript 一样，Dart 语言不仅用于 Web 浏览器；它也适用于服务器应用和命令行应用。未来的目标是 iOS 和 Android 上的移动应用。\n\
  \n这就是世界上最大的互联网公司的历史、挑战和反应。那么，Dart 到底是什么？本章的其余部分将对 Dart 和 JavaScript 进行比较和对比，并带你构建第一个\
  \ Dart 应用，让你亲眼见证。\n\n本书的其余部分将通过一系列有趣的项目带你游历 Dart，探索 Dart 的所有栖息地。我们将立即着手构建有用的应用，并使用越来越强大的功能。\n\
  \n## 下载工具\n\n让我们从在计算机上安装完整的 Dart 开发环境开始。Dart 在互联网上的主页是 https://www.dartlang.org，其中包含软件、大量文档以及在线\
  \ Dart 社区的链接。\n\n我强烈建议你注册该网站上的邮件列表以随时了解 Dart，并加入 Dartisans Google+ 社区（http://g.co/dartisans）。每天的邮件数量一开始可能会让人应接不暇，但其中有一些精彩的讨论和信息分享。这也是与\
  \ Dart 创作者互动的绝佳机会。\n\n> 建议你使用 Stable（稳定）频道。该版本通过内置的更新工具大约每隔几个月更新一次。此外还有一个 Dev（开发）频道，每周更新一到两次，包含来自\
  \ Dart 开发者的最新代码。这非常适合及早了解新功能，但不如 Stable 版本完善或可靠。\n\n所有受支持平台（Linux、Mac 和 Windows）的下载均可从\
  \ https://www.dartlang.org/tools/download.html 获取。同一位置还提供从源代码构建的信息。请确保同时下载 SDK 和\
  \ Dartium（一种专门的浏览器）。\n\n建议 Mac 用户使用 Homebrew 系统来管理 Dart 的安装和更新。Linux 用户如果其发行版支持\
  \ .deb 格式，可以使用 .deb，ZIP 压缩包是替代方案。Windows 版本也以 ZIP 压缩包形式提供。\n\nWindows 用户可以使用基于 NuGet\
  \ 和 PowerShell 构建的 Chocolatey 安装系统下载、安装和更新 SDK 和 Dartium。\n\n> 更多信息请参阅 `http://chocolatey.org`。\n\
  \nDart 软件包名为 `dart-sdk` 和 `dartium`。\n\n## WebStorm IDE 简介\n\nWebStorm 是 Dart 的首选开发环境，由\
  \ JetBrains 创建，JetBrains 还发布了用于 Java 的 IntelliJ IDEA 和用于 .NET 的 ReSharper。\n\nWebStorm\
  \ 是一款商业软件包，可在 `https://www.jetbrains.com/` 获取。许多人可以获得免费许可证，个人用户还可享受大幅折扣。它支持多种语言和开发平台，并通过插件提供\
  \ Dart 支持。该插件随 IDE 预装。\n\n下载安装文件，然后按照屏幕上的安装步骤操作：\n\n![](img/52c05b53a56abd53584e4fed738ed509_27_0.png)\n\
  \n\n\nWebStorm 拥有许多强大的功能，可帮助我们编写 Web 应用程序：\n\n-   代码自动补全：在键入时列出属性和方法\n-   静态分析器：在键入时扫描可能存在的问题\n\
  -   重构工具：帮助重命名实体和提取方法\n-   快速修复：轻松纠正常见错误\n-   通过代码树导航并查找函数用法\n-   代码格式化程序：保持源代码整洁\n\
  -   强大的调试器\n\n## 替代开发环境\n\n如果你希望使用其他 IDE，IntelliJ IDEA 和 Eclipse 都有相应插件。如果你更喜欢简单的文本编辑器，Sublime、Emacs\
  \ 和 Vim 也有插件。这些都可以在 DartLang 下载页面上找到。\n\n如果你是 Visual Studio 的忠实用户，目前有一个社区项目正在将 Dart\
  \ 引入该环境。DartVS 可以从 Visual Studio Gallery 下载。它直接使用 SDK 中的 DartAnalyzer 在 IDE 内报告错误、警告和提示。IntelliSense\
  \ 和其他功能的支持也正在进行中。\n\n对于喜欢轻量级编辑器而非完整开发环境的人来说，Atom 编辑器（https://atom.io/）是一个选择。名为 dartlang（https://atom.io/packages/dartlang）的插件提供了代码补全、语法高亮以及访问一些\
  \ pub 命令的功能。\n\n## 帮助启动项目\n\n为了帮助你创建新项目，Dart 提供了一个名为 Stagehand 的工具，它可以根据你选择的高质量项目模板创建脚手架。它处理常见任务，如文件夹结构、公共库和样式表。它甚至有自己的网站（http://stagehand.pub/）。\n\
  \n在 WebStorm 中，创建新项目时会提供一系列强大的选项，允许你设置 Dart SDK 的位置，并为示例内容选择项目类型。项目类型提供一系列骨架应用，由\
  \ SDK 自带的 Stagehand 应用驱动：\n\n![](img/52c05b53a56abd53584e4fed738ed509_29_0.png)\n\
  \nStagehand 也可以在命令行中运行，第一步是将其安装为命令：\n\n```\npub global activate stagehand\n```\n\
  \n此步骤从 stagehand 包中安装 stagehand 命令：\n\n```\nmkdir aproject\ncd aproject\nstagehand\
  \ web-full\n```\n\n这将基于 web-full 模板创建一个包含示例内容的文件夹。\n\n> 有关当前模板的完整详细信息，请参阅\n>\n>\
  \ https://pub.dartlang.org/packages/stagehand.\n\n## SDK 中的其他内容\n\n下载内容还包括一组命令行工具，位于\
  \ dart-sdk/bin 路径下。\n\n| 工具 | 描述 |\n|---|---|\n| dart | 独立的 Dart 虚拟机本身。 |\n| dart2js\
  \ | 将 Dart 转换为 JavaScript 以便在任何现代浏览器上运行的工具。 |\n| Dartanalyzer | 分析 Dart 源代码中的错误和建议。开发环境也使用它向用户提供反馈。\
  \ |\n| Dartdocgen | 直接对 Dart 代码工作的文档生成器。 |\n| Dartfmt | 智能代码格式化程序，让你的代码整洁一致。 |\n\
  | pub | 包管理和应用程序部署工具。 |\n\n> 你可能希望将这些工具添加到系统 PATH 中，以便可以从命令行的任何位置调用它们。这是可选的，因为 WebStorm\
  \ 为这些工具提供了简单的界面；然而，许多开发者认为这对良好的工作流程至关重要。\n>\n> 有关 pub 的安装和配置的更多详细信息，请参阅 https://www.dartlang.org/tools/pub/installing.html\n\
  \n此位置还有一个 snapshots 文件夹。大多数工具本身是用 Dart 编写的；当它们启动并初始化时，可以将初始化状态的二进制映像存储起来，用于将来的程序执行。\n\
  \n这些快照是使用 Dart 可执行文件生成的，主要面向部署中经常使用的命令行应用程序。\n\n## 构建你的第一个应用程序\n\n从简单开始是个好主意，但我们也希望从一些有用的东西开始，随着我们探索\
  \ Dart 可以扩展。\n\n在日常软件开发中，文本编辑器往往是巨大、改变世界的软件的起点。我们将构建一个基于 Web 的多用途文本编辑器，用作代码片段、待办事项列表或去除复制文本格式的便签——非常方便。为了增加真实感，过程中还会有一个虚构的客户要求新功能。\n\
  \n在下一章中，我们将以此为基础，构建一些更华丽的功能和图形显示。\n\n> **下载示例代码**\n>\n> 你可以从你的账户下载所有已购买的 Packt 图书的示例代码文件，网址为\
  \ `http://www.packtpub.com`。如果你在其他地方购买了这本书，可以访问 `http://www.packtpub.com/support`\
  \ 并注册，以便将文件直接通过电子邮件发送给你。\n\n### 探索 Web 项目结构\n\n进入 WebStorm 欢迎页面，点击 **打开**。选择你解压示例代码的文件夹，然后选择\
  \ `Chapter One` 文件夹，再选择名为 `Start` 的子文件夹。\n\n打开任何 Dart 项目时，一个好的第一步是确保所有依赖项都存在且是最新的。为此，选择\
  \ `pubspec.yaml` 并右键单击以显示上下文菜单。点击 `Pub: Get Dependencies` 项。然后，依赖项将被解析并在需要时获取。\n\
  \n| 文件/文件夹 | 描述 |\n|---|---|\n| `packages` | 指向此项目正在使用的包（或库）的链接。在这种情况下，你会看到“browser”包。\
  \ |\n| `pubspec.lock` | 控制正在使用的包的特定版本。 |\n| `pubspec.yaml` | 我们项目的元信息（名称、描述等）以及正在使用的包列表。\
  \ |\n| `web/styles/main.css` | 标准级联样式表文件。 |\n| `web/index.html` | 我们 Web 应用程序的入口点。\
  \ |\n| `main.dart` | 最后但同样重要的是，一个 Dart 文件！ |\n\n### 解析包\n\n从前面的列表可以看出，即使是一个简单的 Dart\
  \ 项目，也有大量的包结构和元文件。该语言的哲学是库小而专注，并且可能来自不同的来源。它们数量众多，并且按不同的时间表更新，因此版本控制很重要——依赖项是贪婪的，必须满足它们。\n\
  \n### 启动文本编辑器\n\n你希望你的团队成员能够毫无依赖噩梦地构建和使用你的新 Uber 包！同样，你希望从互联网上下载的包能够“直接运行”，并减少编写应用程序所需的工作量。\n\
  \n为了管理所有这些包，Dart 有一个名为 pub 的工具。这是一个瑞士军刀式的工具，帮助创建、管理和部署你的程序和包。Dart 包的主要家园是网站 https://pub.dartlang.org，那里发布了许多开源库。\n\
  \n> \U0001F4A1 如果你好奇这个名字的起源，“pub”是英国俚语，指人们喝酒和玩飞镖游戏的酒吧。\n\n### 了解 Pubspec\n\n`pubspec.yaml`\
  \ 有一个奇怪的文件扩展名——YAML 代表**另一种标记语言**。\n\n```\nname: 'TextEditor'\nversion: 0.0.1\n\
  description: A web based text editor.\nenvironment:\n  sdk: '>=1.0.0 <2.0.0'\ndependencies:\n\
  \  browser: any\n```\n\n由此可见，pubspec.yaml 相当于 Dart 的项目文件或解决方案文件。它包含典型的依赖项详细信息和元信息。Pubspec\
  \ 文件的完整详细信息位于 https://www.dartlang.org/tools/pub/pubspec.html。虽然它是一个功能强大且内容丰富的文件，但你与它的主要交互可能只是添加新依赖项。\n\
  \n### 将 Dart 放入网页\n\n文件 `index.html` 是一个普通的网页。文件的其余部分由几个简单的 `<div>` 元素组成，并且正如你可能期望的那样，还有一个\
  \ `<textarea>` 标签：\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n    <title>TextEditor</title>\n\
  \    <link rel=\"stylesheet\" href=\"styles/main.css\">\n</head>\n```\n\n\n\n\n\n\
  ## 编写事件处理器\n\n编辑器的 `TextArea KeyUp` 事件已连接到此简短的处理器函数：\n\n```\nvoid handleKeyPress(KeyboardEvent\
  \ event) {\n  saveDocument();\n}\n```\n\n与 JavaScript 不同，这里没有 `function` 关键字，我们在函数前使用了\
  \ `void`。`void` 关键字只是表示此函数在执行完毕时不返回任何内容；它可以是任何类或类型。由于 Dart 是可选类型的，我们完全可以省略 `void`。\n\
  \n等等一下！我们要把这段文本存储到哪里呢？毕竟，我们只编写了一个单一的 HTML 页面，并没有数据库连接或 Web 服务来处理持久化。幸运的是，HTML5 提供了一个简单基于键/值的内置存储功能，称为\
  \ Local Storage，并且得到现代 Web 浏览器的良好支持。它以与字典（有时称为 map）数据结构类似的方式运行。\n\n在接下来的两个函数中，我们将查看如何从\
  \ `localStorage` 中加载和保存。\n\n> HTML5 功能 `window.localStorage` 会持久地将数据存储在客户端浏览器中。与存储在\
  \ cookie 中的数据不同，它不会基于日期过期。关闭浏览器窗口或关闭计算机时，数据也不会丢失。\n>\n> 存储量因浏览器和用户设置而异，但典型的默认值是\
  \ 5 MB。对于我们的文本编辑器和其他许多类型的应用程序来说，这已经足够了。\n\n![](img/52c05b53a56abd53584e4fed738ed509_35_0.png)\n\
  \n## 加载已保存的文本\n\n`loadDocument` 函数让世界知道它将返回一个 `String` 对象：\n\n```\nString loadDocument()\
  \ {\n  String readings = \"\";\n  String jsonString = window.localStorage[\"MyTextEditor\"\
  ];\n  if (jsonString != null && jsonString.length > 0)\n    readings = JSON.decode(jsonString);\n\
  \  return readings;\n}\n```\n\n我们将使用键 MyTextEditor 来存储文本。用户第一次加载此页面时，我们的网页在本地存储中将没有任何内容，因此我们会在将其值放入\
  \ readings 字符串变量之前检查它是否为空或 null。\n\n> JSON（JavaScript Object Notation）是一种基于 JavaScript\
  \ 子集的 ECMA 标准数据格式，是 XML 的替代方案。\n> 例如：\n> ```\n> {\n>   \"Name\": \"Davy Mitchell\"\
  ,\n>   \"LuckyNumber\": 123,\n>   \"CarModel\": null,\n>   \"Language\": \"English\"\
  \n> }\n> ```\n\n## 保存文本\n\n我们用于保存文本的格式是 JSON — JavaScript Object Notation — 这是网页中的常见标准。包\
  \ `dart:convert` 为我们提供了 encode 和 decode 函数：\n\n```\nvoid saveDocument() {\n  window.localStorage[\"\
  MyTextEditor\"] = JSON.encode(theEditor.value);\n}\n```\n\n最后，已保存的文档使用本地存储来安全保存我们的文本。这次，我们将数据编码为\
  \ JSON 格式。\n\n## 在浏览器中运行\n\n我们现在终于准备好在目标环境中实际运行文本编辑器了。浏览器将如何执行一个 .dart 文件？Internet\
  \ Explorer、Chrome 和 Firefox 都不懂 Dart。\n\n![](img/52c05b53a56abd53584e4fed738ed509_37_0.png)\n\
  \nDartium 是 Chromium 浏览器（Google Chrome 浏览器背后的开源项目）的特殊构建，其中包含 Dart 虚拟机。虽然不推荐用于日常浏览，但它是一个功能强大的现代浏览器，可在开发\
  \ Dart 应用程序时使用。如截图所示，它看起来就像（一个非常简洁的）Google Chrome。\n\n> 如果你在 Ubuntu 上运行并收到提到 libudev.so.0\
  \ 的启动错误，请在终端中运行以下命令来解决它：\n>\n> `sudo ln -s /lib/x86_64-linux-gnu/libudev.so.1 /lib/x86_64-linux-gnu/libudev.so.0`\n\
  >\n> 有关更多信息，请参阅 https://github.com/dart-lang/sdk/issues/12325\n\n在 WebStorm 中，右键单击\
  \ `index.html` 文件以调出上下文菜单并选择 **Run index.html**。这将为你的应用程序启动一个本地 HTTP 服务器。\n\n##\
  \ 启动文本编辑器\n\n应用程序运行后，在编辑器中输入一些文本，然后关闭浏览器窗口。然后再次运行程序，页面加载后你应该会看到你的文本重新出现。\n\n## 编辑和重新加载\n\
  \n我们的客户提出了新的需求。应用程序的标题“TextOnTheWeb”他们不喜欢，所以我们必须更改它。\n\n到目前为止，如果你编写过 JavaScript，Dart\
  \ 应该看起来更熟悉了。工作流程也很相似。让我们对正在执行的代码进行更改，以便我们可以看到编辑和重新加载循环的效果。\n\n这将在 main 函数中实现，因此在保持\
  \ Dartium 打开的同时，在 WebStorm 中再次打开 `main.dart` 文件，并找到 `main` 函数。\n\n将以下代码片段添加到函数的开头：\n\
  \n```\nDivElement apptitle = querySelector(\"#toolbar\");\napptitle.text = \"TextEditor\"\
  ;\n```\n\n做出更改后，保存文件并切换回 Dartium。刷新页面，新的 main 函数版本将运行，新的标题将被显示。\n\n## 扩展界面\n\n我们的客户要求添加一个按钮来清除编辑区域。这是一个合理的请求，并且借助\
  \ Dart 的生产力，实现起来不会太久。\n\n首先，我们将打开 `index.html` 并在 TextArea 控件下方添加一个输入按钮到页面中：\n\n\
  ```\n<input type=\"button\" id=\"btnClearText\" value=\"Clear\" />\n```\n\n打开 `main.dart`\
  \ 并在 main 函数中连接事件处理器：\n\n```\nButtonInputElement btnClear = querySelector(\"#btnClearText\"\
  );\nbtnClear.onClick.listen(clearEditor);\n```\n\n与 JavaScript 一样，将函数作为参数传递非常容易。将光标移到文本\
  \ `clearEditor` 上，会出现一个灯泡。这提供了 Alt 和 Enter/Return 键的键盘快捷方式，或者你可以单击灯泡图标。\n\n![](img/52c05b53a56abd53584e4fed738ed509_39_0.png)\n\
  \n该函数的实现很简单。请注意，我们收到了一个正确类型的 MouseEvent 对象作为事件的一部分：\n\n```\nvoid clearEditor(MouseEvent\
  \ event) {\n    theEditor.text = \"\";\n    saveDocument();\n}\n```\n\n刷新页面并单击按钮以清除现有文本。一个满意的客户，而我们几乎没有费力！\n\
  \nWebStorm Dart 插件有许多快速修复功能，可提高你的生产力并帮助首先避免编码错误。它们还鼓励良好的设计并遵守 Dart 惯例。\n\n### 使用\
  \ CSS 编辑器\n\n暂时保持文本编辑器运行并切换回 WebStorm。转到 **Project** 选项卡，在 TextEditor 文件夹中打开 `web/styles/main.css`\
  \ 文件。\n\n这也是你的编辑器，所以它必须是你的最爱颜色——也许你想要更细的边框，或者不喜欢我选择的灰色调。\n\n对颜色类进行一些更改并保存文件。\n\n\
  WebStorm CSS 编辑器功能强大，并显示颜色预览。如果你切换回 Dartium 并单击重新加载，文本编辑器现在应该反映你的色彩偏好。\n\n## 调试\
  \ Dart 应用程序\n\n一个好的调试器是高效开发系统的关键部分。让我们逐步执行我们的代码，以便仔细查看正在发生的事情。\n\n要从 WebStorm 调试在\
  \ Dartium 中运行的应用程序，我们需要安装一个小型浏览器扩展来充当两个应用程序之间的桥梁。\n\n> 请按照 JetBrains 在以下网页上的指南进行操作：\n\
  > https://www.jetbrains.com/webstorm/help/using-jetbrains-chrome-extension.html\n\
  \n需要关注的主要部分是“安装 JetBrains Chrome 扩展”部分。这只需要做一次。\n\n- **1.** 单击 `loadDocument` 函数的第一行。\n\
  - **2.** 接下来，打开 **Run** 菜单并选择 **Toggle Line Breakpoint**。该行的右侧会出现一个红色圆圈：\n\n  ![](img/52c05b53a56abd53584e4fed738ed509_40_0.png)\n\
  \n- **3.** 在 **Project** 选项卡中选择 `index.html`，然后打开 **Run** 菜单并选择 **Debug index.html**。\n\
  - **4.** Dartium 打开后，`loadDocument` 函数应该运行并且断点会被命中。WebStorm 中会出现 **Debugger** 选项卡。\n\
  - **5.** **Debugger** 选项卡显示调用堆栈和当前变量的值。在 **Run** 菜单和工具栏上，可以使用通常的调试操作 **Step Into**、**Step\
  \ Over** 和 **Step Out**。\n- **6.** 在我们执行任何步骤之前，将指针悬停在 `return` 语句行上。会出现一个工具提示，显示字符串变量\
  \ `readings` 当前设置为 null。\n\n\n\n\ncallMethod 方法可用于调用页面作用域内可用的任何 JavaScript 函数——不仅仅是内置对象。在这种情况下，第一个参数是我们希望调用的函数的名称，第二个参数是该方法的参数列表。\n\
  \n### 在代码中添加注释\n\n目前我们的文本编辑器基础看起来已经完整，但 main.dart 文件中还缺少一个重要元素——代码注释。\n\nDart 使用以下几种常见的注释语法：\n\
  \n| 注释语法 | 描述 |\n|---|---|\n| `// Your comment here.` | 单行注释 |\n| <code>/**<br>Your\
  \ comment here.<br>*/</code> | 多行注释 |\n| `/// Your comment here.` | 文档注释（首选方法，因为它更紧凑）\
  \ |\n\n当提到标识符时，请在名称周围加上方括号。例如：\n\n```\n/// Returns double of [a] input.\nint doubleANumber(int\
  \ a){\n    // Assumes parameter valid.\n    return a * 2;\n}\n```\n\n花点时间用上述风格为每个函数添加注释。使用句子格式和标点符号。\n\
  \n> 有关注释风格和其他编码约定的更多信息，请参阅文档注释指南：\n> https://www.dartlang.org/articles/doc-comment-guidelines/\
  \ 以及 Dart 编码风格指南：https://www.dartlang.org/articles/style-guide/\n\n### 总结\n\n本章的重点是向你介绍\
  \ Dart 的背景故事，并让你开始使用 SDK 来构建一个实用的应用程序。\n\n我们已经了解到 JavaScript 语言及其开发限制如何促成了 Dart\
  \ 开源项目的创建（以 https://www.dartlang.org 网站为中心）。该项目正在作为 ECMA 标准进行开发，可用于编写从客户端到服务器再到命令行的各种应用程序类型。\n\
  \n我们已经看到，Dart 拥有熟悉的语法和一个名为 pub 的强大包管理工具。WebStorm 可用于创建、启动和调试不同类型的应用程序，其他 IDE 和文本编辑器也支持\
  \ Dart 语言。\n\n我们完成了 Dart 开发环境的搭建，并使用 HTML5 特性编写了第一个应用程序。我们了解了如何浏览客户端 Web 项目的结构，以及如何进行调试和开发。\n\
  \n我相信，我们创建的简易文本编辑器已经在你的脑海中激发了许多后续想法！在下一章中，我们将继续研究客户端 Dart，并为文本编辑器添加更多功能，其中一些功能将帮助我们编写更多、更好的\
  \ Dart 代码。\n"
- "## 推进编辑器\n\n> 我们把屏幕上的按钮做得如此精美，以至于你想去舔它们。\n> ——史蒂夫·乔布斯\n\n现代 Web 浏览器能够实现更炫丽的网页设计和更流畅的动画布局，这些技术可能性让\
  \ Web 应用开发者在平衡功能与美观呈现方面面临更大的挑战。\n\n功能性和非功能性需求（如界面设计和性能）往往是相互冲突的优先级。任何项目的时间都是有限的。一个好的策略（有时！）是专注于那些能同时满足两者的需求，而且在不断扩展的\
  \ HTML 标准中有许多新的可能性。\n\n一旦所有需求都确定下来并完成应用程序的构建，顺利将应用程序部署到生产环境是关键。在我们的目标系统（如各种 Web\
  \ 浏览器）上进行测试至关重要，这正是本章将要讨论的内容。\n\n### 文本编辑器的后续步骤\n\n到目前为止，我们收到了一些关于文本编辑器的反馈。用户喜欢它，并希望有更多按钮，其中最高优先级是添加一个字数统计功能，能够显示包含当前字数的对话框。客户表示，他们希望在编辑器窗格上方有一个功能强大的工具栏，以支持一系列功能。他们喜欢弹出式对话框的风格，但表示当前的对话框与应用程序的外观不太协调。\n\
  \n构造函数使用与类相同的名称声明，并且我们只有一个参数。Dart 构造函数有一个便捷特性，可以直接从参数声明中设置成员变量。这样就无需单独使用一个仅用于赋值给成员变量的参数。如果不使用这种简写特性，代码将如下所示：\n\
  \n```\nclass TextEditor {\n  final TextAreaElement theEditor;\n  ...\n  TextEditor(TextAreaElement\
  \ theEditor) {\n    this.theEditor = theEditor;\n  }\n  ...\n}\n```\n\n字段 `theEditor`\
  \ 被声明为 final；这意味着它在应用程序的生命周期中只能被赋值一次。\n\n### 构建项目结构\n\n我们的新需求需要两个弹出式对话框，而且听起来我们可能还需要更多。我们需要构建一个\
  \ HTML 界面库来满足这些需求。它是通用型的，因此可以用于多种类型的应用程序。应用程序的其余部分可以放在 `TextEditor` 项目中。\n\n###\
  \ 构建对话框包\n\n`pub` 打包系统是在线分享已完成包的绝佳资源。如果我们希望将包保持本地和私有，我们可以在本地创建它并以大致相同的方式使用。\n\n\
  ### 包项目结构\n\n包项目的结构与 Web 应用项目类似，`pubspec.yaml` 文件是主要的项目文件。项目中没有 web 文件夹，而是有一个 `lib`\
  \ 文件夹，其中包含 `simple_dialog.dart` 文件，该文件声明了我们的库，并定义了对外暴露的内容：\n\n![](img/52c05b53a56abd53584e4fed738ed509_48_0.png)\n\
  \n该文件包含任何类、函数以及对其他文件的引用——在本例中，指的是 `src` 文件夹中的两个文件。`simple_dialog.dart` 中以 `library`\
  \ 关键字开头的一行说明了名称，并声明这是一个库。请注意，它没有被任何引号包围：\n\n```\nlibrary simple_dialog;\nimport\
  \ 'dart:html';\npart 'src/dialog_base.dart';\npart 'src/prefabs.dart';\n```\n\n\
  接下来的部分包含了 part 声明中该包声明所暴露的所有文件所需的导入。打开 `src` 文件夹中的任意一个文件，你会看到第一行声明了 `part of simple_dialog`。\n\
  \n### 添加本地包引用\n\n要引用该库，请转到 TextEditor 项目的 pubspec.yaml，并在编辑器中打开它。点击 source 选项卡查看纯\
  \ yaml 文本文件。目前没有用于本地引用的图形界面，因此必须手动添加：\n\n```\ndependencies:\nbrowser: any\nintl:\
  \ any\nsimple_dialog:\n  path: ..\\simple_dialog\n```\n\n该路径相对于项目根目录。由于这是本地文件系统引用，路径分隔符必须与操作系统匹配，因此我们在\
  \ Windows 上使用 `\\`（反斜杠），在 Linux 和 Mac 上使用 `/`（正斜杠）。\n\n然后在 editor.dart 中使用包前缀引用该包：\n\
  \n```\nimport 'dart:convert';\nimport 'dart:html';\nimport 'package:simple_dialog/simple_dialog.dart';\n\
  ```\n\n它的工作方式与远程安装的包完全相同，额外优势是如果做了更改，它会自动刷新。\n\n![](img/52c05b53a56abd53584e4fed738ed509_49_0.png)\n\
  \n> 为了避免相对路径带来的任何问题（这让很多人头疼！），如果可能的话，将项目保存在同一目录中，这样相对路径始终相同。或者，也可以使用完整路径，尽管当代码位于不同计算机上时这可能会引入问题。\n\
  > 要验证路径是否正确，请在 Project 选项卡中展开 Packages 文件夹，该包应该会连同其来源一起列出。\n> 路径依赖对于本地开发很有用，但在与更广泛的世界共享项目时无法使用。\n\
  \n### 理解包的作用域\n\nDart 在库作用域系统下运行。包中的所有项目在整个包内都是可用的——在这一级别没有私有或受保护的资产。然而，库内部的项目可以对外部代码保持私有。\n\
  \n要实现等价于私有字段的效果，类的字段如果带有 _（下划线）前缀，则可以标记为私有。引用该库的任何项目都只能使用该包已暴露的资产。\n\n例如，TextEditor\
  \ 项目可以使用默认公开的 Dialog 类并访问 content 字段，但不能访问 _visible 字段。\n\n### 定义基础对话框\n\n对话框核心定义在\
  \ dialog_base.dart 文件中的 Dialog 类中。这将包含所有基础功能，例如对话框框架以及 OK 和 CANCEL 按钮。更专门的对话框将继承（扩展）这个类，并针对其用途进行修改。\n\
  \n该包将包含以下常见对话框：\n\n- 简单的警告对话框\n- 应用“关于”对话框\n- 用户确认对话框\n\n### 警告对话框\n\n这是所有对话框中最简单的一种。它将显示一行文本，并允许用户按下\
  \ OK 按钮以关闭对话框：\n\n```\nvoid alert(String dlgTitle, String prompt, int width, int\
  \ height) {\n  Dialog dlg = new Dialog(dlgTitle, prompt, width, height, true,\n\
  \  false);\n  dlg.show();\n}\n```\n\n该对话框不返回任何值，为了尽可能方便用户，它只需一次函数调用。这将用于显示字数统计功能的结果。\n\
  \n\n\n\n## 关于对话框\n\n应用程序的标准关于框包含少量信息和一个指向网站的链接。此对话框在视觉上与警报框完全相同，只是增加了超链接，并且由于这涉及更改对话框界面元素，因此将在名为\
  \ AboutDialog 的新类中实现：\n\n![](img/52c05b53a56abd53584e4fed738ed509_51_0.png)\n\n\
  这是通过 TextEditor 对象的 showAbout 方法创建的：\n\n```dart\nvoid showAbout(MouseEvent event)\
  \ {\n    AboutDialog textEditorAbout = new AboutDialog(AppTitle,\n    \"TextEditor\
  \ for the Web\", \"http://www.packtpub.com\", \"Homepage\",\n    300, 200);\n  \
  \  textEditorAbout.show();\n}\n```\n\nAboutDialog 框继承自 Dialog 类并通过 super 调用 Dialog\
  \ 类的构造函数，该构造函数调用构造函数以形成对象的[content]\n\n## The About dialog box\n\nThe standard About\
  \ box for an application contains a small amount of information and a link to a\
  \ website. This dialog is visually identical to the Alert box apart from the addition\
  \ of the hyperlink, and as this involves changing the dialog interface elements,\
  \ this will be implemented in a new class called AboutDialog:\n\n![](img/52c05b53a56abd53584e4fed738ed509_51_0.png)\n\
  \nThis is created from the showAbout method of the TextEditor object:\n\n```dart\n\
  void showAbout(MouseEvent event) {\n    AboutDialog textEditorAbout = new AboutDialog(AppTitle,\n\
  \    \"TextEditor for the Web\", \"http://www.packtpub.com\", \"Homepage\",\n  \
  \  300, 200);\n    textEditorAbout.show();\n}\n```\n\nThe AboutDialog box inherits\
  \ from the Dialog class and calls the constructor of the Dialog class via super,\
  \ which calls the constructor to form the foundation of the object:\n\n```dart\n\
  AboutDialog(String titleText, String bodyText, this.linkUrl, this.linkText, int\
  \ width, int height)\n    : super(titleText, bodyText, width, height, true, false)\
  \ {\n```\n\nThe elements for the box are created and added to the nodes member of\
  \ the content DivElement:\n\n```dart\ncontent..nodes.insert(0, new BRElement())\n\
  \  ..nodes.insert(0, new BRElement())\n  ..append(new BRElement())\n  ..append(new\
  \ BRElement())\n  ..append(link)\n  ..style.textAlign = \"center\";\n```\n\nThe\
  \ cascade operator keeps the code compact and focused on setting up the different\
  \ components of the dialog.\n\n## Using the confirmation dialog box\n\nThis dialog\
  \ presents OK and CANCEL options, and calls a specified function if the former option\
  \ is clicked. This is used in the TextEditor class clearEditor method:\n\n![](img/52c05b53a56abd53584e4fed738ed509_52_0.png)\n\
  \nThis is implemented by using the base Dialog class directly:\n\n```dart\nvoid\
  \ confirm(String dlgTitle, String prompt, int w, int h, Function action) {\n   \
  \ Dialog dlg = new Dialog(dlgTitle, prompt, w, h);\n    dlg.show(action);\n}\n```\n\
  \nThe application can configure and display this dialog with a single line:\n\n\
  ```dart\nconfirm(AppTitle, \"Are you sure you want to clear the text?\",\n400, 120,\n\
  performClear);\n```\n\nA function is passed to the show method that is performed\
  \ if the user presses the OK button.\n\n## Counting words using a list\n\nWord count\
  \ is an important feature for students, technical writers, and competition entrants.\
  \ Our customers see this as a required feature, too.\n\nIn the event handler, we\
  \ want to calculate the word count and throw the dialog on screen for the user to\
  \ see. This is a simple, short-running task, so the implementation can exist directly\
  \ in the event handler. As the output is simple, the alert dialog can be used.\n\
  \nTo determine the word count, Dart's List data structure and String classes can\
  \ be used. The first step is to remove any punctuation characters that may affect\
  \ our count. This is declared in custom_dialogs.dart as an unmodifiable const string\
  \ as it can be used for other word-based features:\n\n```dart\nconst String punctuation\
  \ = \",.-!\\\"\";\n```\n\nThis is used in the showWordCount method of the TextEditor\
  \ class.\n\nOnce the punctuation is removed, the string can be split into a List.\
  \ Dart supports generics, so the types of generic data structure can be optionally\
  \ specified, in this case with <String>. The list of words is then filtered to clean\
  \ out any non-word entries remaining.\n\nOnce we have obtained the list of words,\
  \ the final word count can be obtained by using the length property of the list.\n\
  \n## The Word Frequency feature\n\nOur customers would like a feature to help with\
  \ writing quality. Overuse of particular words can make a text repetitive and hard\
  \ to read. To determine the frequency of word usage, Dart's Map (sometimes called\
  \ an associative array or dictionary) data structure class, and String features\
  \ can be used:\n\n![](img/52c05b53a56abd53584e4fed738ed509_54_0.png)\n\nDepending\
  \ on the number of different words used, the content areas may be allowed to scroll,\
  \ as the dialog cannot grow to the size of any data.\n\nGenerics are used again\
  \ to specify the types for the key and value; in this case, String for the key and\
  \ int for the value:\n\n```dart\nMap<String, int> wordFreqCounts = {};\nString out\
  \ = \"\";\n\nfor (var character in punctuation.split(''))\n    text = text.replaceAll(character,\
  \ \" \");\ntext = text.toLowerCase();\n\nList<String> words = text.split(\" \");\n\
  words\n  ..removeWhere((word) => word == \" \")\n  ..removeWhere((word) => word.length\
  \ == 0)\n  ..forEach((word) {\n    if (wordFreqCounts.containsKey(word))\n     \
  \ wordFreqCounts[word] = wordFreqCounts[word] + 1;\n    else wordFreqCounts[word]\
  \ = 1;\n  });\n\nwordFreqCounts\n  .forEach((k, v) => out += (\"<tr><td>$k</td><td>$v</td></tr>\"\
  ));\n```\n\nThe processing of the text is similar to the word count, where a list\
  \ of individual words is built up. Once the list is filtered, forEach is used to\
  \ iterate through the list and count the occurrences of each word. The forEach method\
  \ is used again to build the output HTML, with the map's key and value parameters\
  \ being passed to the function.\n\n## Understanding the typing of Dart code\n\n\
  The types used so far for the Map and List help the design-time tools, such as the\
  \ Dart Analyzer and WebStorm, which allow us to write code by providing the code\
  \ completion and validating assignments.\n\nWhen run in Dartium with the checked\
  \ mode enabled (the default setting), types are checked at runtime. In the final\
  \ environment, most likely a web browser such as Firefox or Internet Explorer, the\
  \ typing information is not used and does not affect the execution speed of the\
  \ application.\n\nDart coding recommendations advise using types on all public-facing\
  \ code. For example, a class in a package can use private var variables, but methods\
  \ require and return typed data. This aids developers calling the code in understanding\
  \ what is required, and helps create better documentation.\n\n## The file download\
  \ feature\n\nIt can be very useful to have an actual file, so we will add a feature\
  \ to let the user download and save the contents of the editor to their local device.\
  \ This is possible with the custom data attributes feature in HTML5, which supports\
  \ text as one of the formats:\n\n```dart\nvoid downloadFileToClient(String filename,\
  \ String text) {\n  AnchorElement tempLink = document.createElement('a');\n  tempLink\n\
  \    ..attributes['href'] =\n    'data:text/plain;charset=utf-8,' + Uri.encodeComponent(text)\n\
  \    ..attributes['download'] = filename\n    ..click();\n}\n```\n\nThe process\
  \ is straightforward: an anchor element is created and its target is set as the\
  \ encoded text data. The click event is then fired and the download proceeds as\
  \ if it were being downloaded from a web server.\n\n## The clock feature\n\nEveryone\
  \ has deadlines, so keeping an eye on the clock is important. The dart:async package\
  \ can help with this task by using a Timer class to trigger and update. This can\
  \ be carried out in one line in main.dart file of the TextEditor project:\n\n```dart\n\
  new Timer.periodic(new Duration(seconds: 1),\n    (timer) => querySelector(\"#clock\"\
  ).text =\n        (new DateFormat('HH:mm')).format(new DateTime.now())\n);\n```\n\
  \nThe Timer constructor being called here (Timer.periodic) is a specially named\
  \ constructor; in this case, the periodic version is being used. There are numerous\
  \ variations of Timer objects. Named constructors allow the classes to have instances\
  \ easily created for a particular purpose as they do not require additional initialization\
  \ configuration before they are ready to use.\n\nA periodic Timer will fire an event\
  \ every duration period; in this case, one second. The remainder of the line declares\
  \ the function that is called. Dart has a shorthand of => for functions that are\
  \ a single line (which are named arrow functions), thus avoiding the use of curly\
  \ brackets. The querySelector function is used to get a reference to the element\
  \ on the web page with an ID of clock where the time will be displayed.\n\nThe current\
  \ time is obtained and formatted into hours and minutes for display. As the clock\
  \ will run for the lifetime of the application and does not require any interaction,\
  \ no variable is required to store a reference to the object.\n\nThat was a busy\
  \ line of code, and very powerful, but we are not finished examining it yet! There\
  \ has been no extra thread or process created. This is not a user-initiated event.\
  \ We will take a look at the what and when of the Dart task queue.\n\n## Executing\
  \ Dart code\n\nThe internal architecture of the Dart VM has a single-threaded execution\
  \ model that is event-driven. In Dart terminology, this is called an isolate. The\
  \ execution of a Dart program places each event (for example, a function call) into\
  \ one of two queues. The VM then takes the next event and executes it.\n\nThe first\
  \ queue is the main event queue, and the second is called the microtask queue. This\
  \ second queue is a higher priority, but is reserved, as the name implies, for short,\
  \ small tasks, such as creating a new event or setting a value:\n\n![](img/52c05b53a56abd53584e4fed738ed509_57_0.png)\n\
  \nThis execution detail is hidden from the Dart developer for the most part. However,\
  \ it is important to understand that execution of Dart code is highly asynchronous.\
  \ The aim of this is to allow applications to continue to be responsive, while still\
  \ performing longer tasks such as calculations or accessing remote resources.\n\n\
  \n\n\n\n这种架构的优势在于程序执行期间完全不需要任何锁定或同步。其他虚拟机必须执行此操作，这极大地影响了复杂性和性能。例如，Python 的 **GIL\
  \ (Global Interpreter Lock)** 已被争论多年，有许多替代方案被提出并进行了实验性实现。\n\n## 多进程 VM\n\nDart VM\
  \ 的设计允许多个 isolate 同时运行，这些 isolate 可以在不同的线程、CPU 核心上运行，在 Web 浏览器中则运行在 web worker 中。它们不共享任何资源，例如内存，它们唯一的通信方式是通过消息系统。\n\
  \n## 类设计器\n\n客户想要一个能吸引程序员的功能。他们希望用户能够快速草拟类的想法，包括类名、字段和方法等细节。\n\n## 构建更复杂的对话框\n\n\
  为处理此功能，需要一个自定义对话框——`GenClassDialog` 在 `custom_dialogs.dart` 中。它将继承（扩展）Dialog 类，并自行处理\
  \ OK 按钮点击事件。与应用程序中迄今为止的其他对话框不同，此对话框必须将数据返回给文本编辑器：\n\n![](img/52c05b53a56abd53584e4fed738ed509_58_0.png)\n\
  \n输入控件是一个 TextInputElement 和两个 TextAreaElements。占位符属性在现代 Web 浏览器中可用，将用于指导用户输入内容，并且作为奖励，它们是方便的节省空间的方法，因为我们不需要添加额外的元素来标记输入：\n\
  \n```\nString className = name.value;\nString fieldsSrc = \"\";\nString methodsSrc\
  \ = \"\";\n\nList<String> classFields = fields.value.split(\"\\n\");\nList<String>\
  \ classMethods = methods.value.split(\"\\n\");\n\nclassFields.forEach((field) =>\
  \ fieldsSrc += \"    var $field;\\n\");\nclassMethods.forEach((method) => methodsSrc\
  \ += \"    $method() {};\\n\");\n```\n\n文本从控件中检索并按行拆分为列表。然后使用 forEach 方法遍历列表并构建源代码。\n\
  \n## 构造类\n\nGenClassDialog 的 makeClass 方法中简单类的模板为生成的字段和方法的源代码提供了占位符。此类代码模板被声明为使用三个双引号的多行字符串。Dart\
  \ 支持字符串插值，这有助于将变量值放入字符串中：\n\n```\nresult = \"\"\"  // The $className class.\nclass\
  \ $className {\n\n$fieldsSrc\n\n    $className() {}\n\n$methodsSrc\n}\n\"\"\";\n\
  ```\n\n变量可以嵌入到以 $ 符号为前缀的字符串中。然后在字符串使用时将其替换为变量的实际值。\n\n也可以插入更复杂的代码，例如对象的属性，“The word\
  \ is ${text.length} characters long”。注意在被求值的表达式周围使用大括号。\n\n## 命令行项目结构\n\n打开 WebStorm，点击\
  \ Create New Project，并从 Project Templates 列表中选择 Console application。为你的项目选择一个位置并将其命名为\
  \ dart_stats。\n\n应用程序的结构有一个包含 main.dart 的 bin 文件夹，这是应用程序的入口点。main 函数位于此处。项目模板包含其他几项。对于此工具，重点将放在\
  \ main 函数上。\n\n> Dart 是跨平台的，并且操作系统平台使用的绝大多数文件系统都是区分大小写的。强烈建议的约定是所有文件名都为小写。\n\n将源代码文件\
  \ sourcescan.dart 添加到项目中。它包含用于扫描文本并统计类、代码、注释、导入和空白行的代码。\n\n## 处理源代码\n\nSourceCodeScanner\
  \ 类包含五个整数字段来存储计数和一个执行分析的单一方法：\n\n```\nvoid scan(List<String> lines) {\n    totalLines\
  \ = lines.length;\n    lines.forEach((line) {\n        line = line.trim();\n   \
  \     if (line.startsWith(\"class\")) classes++;\n        else if (line.startsWith(\"\
  import\")) imports++;\n        else if (line.startsWith(\"//\")) comments++;\n \
  \       else if (line.length == 0) whitespace++;\n    });\n}\n```\n\n遍历行列表并使用 trim\
  \ 方法删除行中的多余空白，以帮助匹配触发并增加计数的关键字。startsWith 方法确保关键字不会在另一上下文中出现在行中间。\n\n### 使用 dart:io\
  \ 包进行文件处理\n\n应用程序将接收一个命令行参数，即 Dart 源代码文件的完整文件路径。命令行参数可以从 main.dart 中 main 函数传递的参数中读取。\n\
  \n我们不必在浏览器中处理的一个方面是从文本文件加载源代码。由于安全原因，不可用于 Dart Web 浏览器的一个包是 io 包，它包含直接的文件处理功能：\n\
  \n```dart\nimport 'sourcescan.dart';\nimport 'dart:io';\n\nmain(List<String> arguments)\
  \ {\n  print(arguments[0]);\n  SourceCodeScanner codeScan = new SourceCodeScanner();\n\
  \  File myFile = new File(arguments[0]);\n  myFile.readAsLines().then((List<String>\
  \ lines) {\n    codeScan.scan(lines);\n    print(\"${codeScan.totalLines}\");\n\
  \    print(\"${codeScan.classes}\");\n    print(\"${codeScan.comments}\");\n   \
  \ print(\"${codeScan.imports}\");\n    print(\"${codeScan.whitespace}\");\n  });\n\
  }\n```\n\n一旦文本文件在字符串中，它就可以像在 Web 文本编辑器中一样进行处理。\n\n程序可以从命令行运行，如下所示在 Linux 上：\n\n\
  ```text\n$ dart bin/main.dart   lib/dartstats.dart\nlib/dartstats.dart\n9\n0\n3\n\
  0\n2\n```\n\n程序可以检查它自己的源代码！\n\n有关更高级的命令行参数处理，请参阅 pub 上的非常强大的 args 包 https://pub.dartlang.org/packages/args。\n\
  \nreadAsLines 是一个异步函数，立即返回一个 Future 对象。函数被传递到 future 对象的 then 方法中。此函数的执行时间对开发者来说是未知的。程序的流程会立即继续。当文件读取操作运行并完成后，传递给\
  \ then 方法的函数会在 Dart VM 调度时执行。\n\n要亲眼看到这一点，将 print 语句移出 then 函数，如下所示，然后再次运行程序：\n\n\
  ```\nmyFile.readAsLines().then((List<String> lines) {\n    codeScan.scan(lines);\n\
  });\nprint(\"${codeScan.totalLines}\");\nprint(\"${codeScan.classes}\");\nprint(\"\
  ${codeScan.comments}\");\nprint(\"${codeScan.imports}\");\nprint(\"${codeScan.whitespace}\"\
  );\n```\n\n可能的输出全部为零，因为代码行尚未被扫描；这是因为 print 函数被首先调用。\n\n程序也可能像之前一样运行。关键点是整体程序执行会继续前进，即使代码被要求执行可能耗时的任务，也允许其他任务继续并保持应用程序响应。\n\
  \n## 调试命令行程序\n\n如果你在 WebStorm 中使用 Run 启动程序，它将打开调试器并出现 RangeError 异常。这是因为程序假设已传递命令行参数，而程序是在没有任何输入的情况下运行的。\n\
  \n## 推进编辑器\n\n在 WebStorm 中，可以配置程序的调试启动，包括设置命令行参数的功能。在这种情况下，应在 **Program arguments**\
  \ 字段中输入 Dart 源文件的完整文件路径。请注意，默认情况下不会传递任何命令行参数。也可以设置多个具有不同命令行选项集的启动：\n\n![](img/52c05b53a56abd53584e4fed738ed509_64_0.png)\n\
  \n要配置启动，请从 **Run** 菜单中选择 **Edit Configurations** 选项。从列表中选择 `main.dart` 并输入任何 Dart\
  \ 源代码文件的完整文件路径，例如本书的示例代码或来自 Dart SDK 的代码。\n\n一旦程序运行，结果将使用 `print` 函数打印到标准输出。\n\n\
  \n\n\n## 整合统计信息\n\n可以通过将 `sourcescan.dart` 文件添加到 bin 文件夹，并将其作为直接导入来引用，从而将 `SourceStats`\
  \ 类添加到文本编辑器项目中。扫描将在 `CodeStatsDialog` 的 `scanCode` 方法中对编辑器内容执行，并提取数据用于绘制饼图。\n\n\
  ## HTML5 与 canvas\n\n自苹果在 WebKit 版本中引入 canvas HTML 元素以来，它已经存在了大约 10 年，但它仍被视为一项新功能，这似乎有些奇怪！多年来，主流和小型浏览器都已广泛支持它。\n\
  \ncanvas 元素提供了一个高性能的基于 2D 栅格的图形位图，可以动态脚本化。与 SVG 不同，它没有场景图或可选中对象，只有一幅图形图像。它为客户端应用（如图表、动画和游戏）提供了一种简单易用且强大的动态图像显示方式：\n\
  \n![](img/52c05b53a56abd53584e4fed738ed509_65_0.png)\n\n每个计数都通过一个正方形 Rect 来显示颜色，并绘制标签，文本则绘制在旁边。\n\
  \n> canvas 是一个多才多艺的功能，但当它上面什么都没有出现时，可能会令人沮丧。这通常发生在使用 beginPath 且路径未曾用 closePath\
  \ 闭合时。\n\n## 使用 Dart 构建 Web 界面\n\ndart:html 包并不是使用 Dart 构建 Web 界面的唯一选择。主要的竞争者包括\
  \ Polymer 和 Angular：\n\n- Polymer (https://www.polymer-project.org/) 是一个用于创建可重用\
  \ Web 组件（使用 Web 组件标准）的 JavaScript 框架，这些组件是封装的且可互操作的。它们以自定义 HTML 元素的形式存在。例如，本章中的对话框可以制作成\
  \ Web 组件。要在页面中使用它们，我们可以使用 <DialogConfirm> 和 <DialogWordCount> 标签，这样可以避免一组嵌套的 div\
  \ 元素。Polymer.dart 是该框架的 Dart 版本，可从 pub 获取。\n- Angular (https://angularjs.org/) 是一个用于动态数据视图的框架，也是\
  \ JavaScript 领域的巨头。同样，也有一个 Dart 版本，名为 Angular.dart。即将推出的 Angular 2 将用 TypeScript\
  \ 编写，并将同时支持 JavaScript 和 Dart。\n\n无论选择哪个框架或包，它都有可能在某些时候使用 dart:html 类，因此熟悉它们是值得的。并非每个开发人员或应用程序都需要框架，所以要保持务实！\n\
  \n## 编译为 JavaScript\n\n我们的增强型文本编辑器应用能在 Dartium 中运行，这很棒，但大多数 Web 用户安装的并不是 Dartium。如果我想在日常使用的\
  \ Web 浏览器（例如 Firefox 或 Internet Explorer）中使用它，该怎么办？\n\n为了能在整个现代 Web 上运行，Dart 代码可以通过一个名为\
  \ dart2js（用 Dart 编写）的工具编译成高质量、高性能的 JavaScript。这可以作为 pub 命令运行：\n\n```\npub build\
  \ --mode=release\n```\n\n## 增强编辑器\n\n我们在上一章浏览 SDK 命令行工具时首次遇到了这个工具。为了在开发过程中方便使用，可以从\
  \ WebStorm 中访问它。\n\n在 WebStorm 的 **Project** 选项卡中，右键单击 `pubspec.yaml` 文件，然后选择 **Pub:\
  \ Build ...**。随后会呈现 **mode** 选项，可选择 **Release** 或 **Debug**——对于生产环境，请选择 **Release**。这会在名为\
  \ `build` 的文件夹中创建程序的 JavaScript 版本。该版本可以由任何 Web 服务器提供，并可在任何现代浏览器中使用：\n\n![](img/52c05b53a56abd53584e4fed738ed509_68_0.png)\n\
  \n令人惊讶的是，如果在 Dartium 版本中输入了文本，从常规浏览器运行时编辑器却是空白的。使用本地存储的一个缺点是，每种 Web 浏览器都有自己的独立存储，即使用户在同一个计算机上，如果切换浏览器，也必须重新输入数据。\n\
  \n### JavaScript 输出的压缩\n\n如果某些高级 Dart 特性参与其中，例如用于反射（有时称为内省）的 mirrors，dart2js 编译器输出的文件可能会变得相当大。\n\
  \n幸运的是，Dart 编辑器的默认设置是生成压缩后的输出。JavaScript 中的 Dart 运行时开销总是存在的，对于小型应用来说，这种开销显得不成比例地大。由于\
  \ Dart 在运行时之前拥有所有源代码以及对整个应用的了解，它可以编译所有代码（包括包），确定哪些包不需要，然后在所使用的包中，移除任何未使用的部分。\n\n\
  这种复杂的技术称为树摇（tree shaking）。任何未使用的代码都会被摇掉，不会包含在交付给最终用户的最终应用中，从而使其加载和执行更快。与 JavaScript\
  \ 相比，如果引用了一个库，那么整个库都会发送到客户端进行解释。\n\n### 小结\n\n文本编辑器应用现在有了更多有用的功能，可以用于多种目的。你可能在想，还可以为它添加更多个性化的小功能，以帮助日常计算。我们想象中的客户此时已经离开，所以现在由你来负责了！我不确定这些按钮是否让我想舔一舔，但我一定会为了有用的功能而去点击它们。\n\
  \n我们开发了一个可重用的库，用于创建适合我们应用的对话框。Dart 的数据结构、泛型以及字符串处理，都从多个角度进行了讨论。\n\n我们还通过 HTML5 canvas\
  \ 上的可视化实现了数据的有效呈现，使用了异步特性，并深入研究了 Dart 虚拟机的内部机制。最后，我们借助 dart2js 将应用从受控的开发环境中带出来，并使其能够在任何浏览器中使用。\n\
  \n文本非常强大，但有点静态，而且在大会议室中很难看清。在 Dart 之旅中，下一步是探索动画、演示，并制造一些动静。\n"
- "## 3 幻灯片演示\n\n> 准备一次精彩的即兴演讲通常需要我花费三周以上的时间。\n> \n> – 马克·吐温\n\n演示让一些人感到恐惧，但若使用得当，它们无疑是信息共享的实用工具。内容必须出色，而一些视觉上的点缀可以使其脱颖而出。\n\
  \n幻灯片太多会让最包容的观众打哈欠，因此让演示者专注于内容，并自动处理视觉效果（让创建者免于摆弄不同的动画和字体大小），有助于改进演示。引人注目的内容仍然需要人的参与。\n\
  \n## 构建演示应用\n\nWeb 浏览器本身已是一种多媒体演示应用，因此随着我们更深入地探索 Dart 语言，编写一个高质量的演示程序是可行的。希望它能帮助我们向下一位客户推介另一个\
  \ Dart 应用。\n\n基于我们的第一个应用，我们将使用基于文本的编辑器来创建演示内容。我非常惊讶地发现，使用基于文本的编辑器制作演示要快得多，也更有趣。希望您也能体验到这种生产力的提升！\n\
  \n## 布局应用\n\n该应用将有两种模式：编辑模式和演示模式。在编辑模式下，屏幕将分为两个窗格。顶部窗格显示幻灯片，底部窗格包含编辑器和其他界面元素。\n\n\
  本章将重点介绍演示的核心创建方面，下一章将重点介绍演示模式并改进界面。该应用将是一个独立的 Dart 项目。\n\n![](img/52c05b53a56abd53584e4fed738ed509_72_0.png)\n\
  \n## 定义演示格式\n\n演示将以 Markdown 格式的一个小子集来编写，Markdown 是一种功能强大且简单易读的基于文本文件的格式（比 HTML\
  \ 更容易阅读、输入和理解）。\n\n> 2004 年，John Gruber 和已故的 Aaron Swartz 创建了 Markdown 语言，其目标是让人们能够使用一种易读易写的纯文本格式进行书写。\n\
  > \n> 它在 GitHub.com 和 StackOverflow.com 等主要网站上使用。作为纯文本，Markdown 文件可以保留在版本控制中并进行比较。\n\
  > \n> 有关 Markdown 的更多详细信息和背景，请参阅 https://en.wikipedia.org/wiki/Markdown\n\n\n\n\n\
  \n一个带标题和项目符号的简单幻灯片可以这样定义：\n\n```text\n#Dart Language\n+Created By Google\n+Modern\
  \ language with a familiar syntax\n+Structured Web Applications\n+It is Awesomely\
  \ productive!\n```\n\n我相信你只需读一遍就能理解！它会转换为以下 HTML：\n\n```html\n<h1>Dart Language</h1>\n\
  <li>Created By Google</li>\n<li>Modern language with a familiar syntax</li>\n<li>Structured\
  \ Web Applications</li>\n<li>It is Awesomely productive!</li>\n```\n\nMarkdown 解析起来非常轻松且快速，这或许解释了它在\
  \ Web 上日益流行的原因。它可以被转换成许多其他格式。\n\n## 解析演示文稿\n\n`TextAreaHtml` 元素的内容会被拆分为一个由独立行组成的列表，并使用\
  \ `forEach` 遍历该列表，其处理方式与文本编辑器应用中的某些功能类似。任何通过 `trim` 方法去除空白后为空的行都会被忽略：\n\n```text\n\
  #A New Slide Title\n+The first bullet point\n+The second bullet point\n\n#The Second\
  \ Slide Title\n+More bullet points\n!http://localhost/img/logo.png\n#Final Slide\n\
  +Any questions?\n```\n\n对于以 `#` 符号开头的每一行，都会创建一个新的幻灯片对象。\n\n对于以 `+` 符号开头的每一行，其内容会被添加到该幻灯片的项目符号列表中。\n\
  \n对于检测到以 `!` 符号开头的每一行，会设置该幻灯片的图片（每张幻灯片限一张）。\n\n此过程会一直持续到到达演示文稿源的末尾。\n\n## 示例演示文稿\n\
  \n为了让新用户快速上手，我们会提供一个示例演示文稿，它既可以用来演示，也可以用来测试应用的各个部分。我选择了最近一次在家庭晚餐时聊到的话题——椰子，如下面的代码片段所示：\n\
  \n```text\n#Coconut\n+Member of Arecaceae family.\n+A drupe - not a nut.\n+Part\
  \ of daily diets.\n#Tree\n+Fibrous root system.\n+Mostly surface level.\n+A few\
  \ deep roots for stability.\n#Yield\n+75 fruits on fertile land\n+30 typically\n\
  +Fibre has traditional uses\n#Finally\n!coconut.png\n#Any Questions?\n```\n\n##\
  \ 演示程序项目结构\n\n该项目是一个标准的 Dart Web 应用，以 `index.html` 作为入口。应用由 `main.dart` 启动，`main.dart`\
  \ 在 `index.html` 中被链接，应用功能则存储在 `lib` 文件夹中。\n\n| 源文件 | 说明 |\n|---|---|\n| `sampleshows.dart`\
  \ | 幻灯片应用的文本内容 |\n| `lifecyclemixin.dart` | mixin 的类 |\n| `slideshow.dart` | 用于存储演示文稿的数据结构\
  \ |\n| `slideshowapp.dart` | 应用对象 |\n\n## 启动应用\n\n`main` 函数的实现非常简短：\n\n```dart\n\
  void main() {\n  new SlideShowApp();\n}\n```\n\n### 访问私有字段\n\n在 Dart 中，正如我们在讨论包时所说的，隐私性是在库级别上体现的；不过，即使\
  \ Dart 没有 `public`、`protected` 和 `private` 关键字，仍然可以在类中拥有私有字段。可以通过一个单行函数简单地返回私有字段的值：\n\
  \n```dart\nString getFirstName() => _name;\n```\n\n要获取这个值，需要调用函数，例如 `Person.getFirstName()`；然而，可能更倾向于使用\
  \ `Person.firstName` 这样的属性语法。通过 `get` 和 `set` 关键字，可以在拥有私有字段的同时保留这种属性语法。\n\n### 使用真正的\
  \ getter 和 setter\n\nDart 的语法也通过关键字支持 `get` 和 `set`：\n\n```dart\nint get score =>\
  \ _score + bonus;\nset score(int increase) => _score += increase * level;\n```\n\
  \n使用 `get`/`set` 还是简单字段，完全取决于个人偏好。完全可以先使用简单字段，然后在需要更多验证或处理时再升级到 getter 和 setter。\n\
  \n在库中使用 `get` 和 `set` 关键字的好处是，包的消费者能非常清楚地看到预期接口。此外，它还能明确哪些方法会改变对象的状态，哪些只是报告当前值。\n\
  \n### 混入（Mixin）一下\n\n在面向对象语言中，在一个类的基础上构建一个更专业化的相关类是非常有用的。例如，在文本编辑器中，基础对话框类被扩展，以创建警告弹窗和确认弹窗。如果我们想共享一些功能，但不希望类之间发生继承，那该怎么办呢？\n\
  \n聚合可以在一定程度上解决这个问题：\n\n```dart\nclass A {\n  ClassB usefulObject;\n}\n```\n\n缺点是使用起来需要更长的引用：\n\
  \n```dart\nnew A().usefulObject.handyMethod();\n```\n\n对于 `Slide` 和 `SlideShow`\
  \ 类，我们将使用来自源文件 `lifecyclemixin.dart` 的 mixin，以记录创建时间戳和编辑时间戳：\n\n```dart\nabstract\
  \ class LifecycleTracker {\n  DateTime _created;\n  DateTime _edited;\n  recordCreateTimestamp()\
  \ => _created = new DateTime.now();\n  updateEditTimestamp() => _edited = new DateTime.now();\n\
  \  DateTime get created => _created;\n  DateTime get lastEdited => _edited;\n}\n\
  ```\n\n要使用该 mixin，可以在构造函数中调用 `recordCreateTimestamp` 方法，在主编辑方法中调用 `updateEditTimestamp`\
  \ 方法。对于幻灯片，只记录创建时间即可；对于 `SlideShow` 类，创建和更新时间都会被跟踪。\n\n## 定义核心类\n\n`SlideShow` 类主要是一个容器对象，用于存放\
  \ `Slide` 对象列表，并使用 `LifecycleTracker` mixin：\n\n```dart\nclass SlideShow extends\
  \ Object with LifecycleTracker {\n  List<Slide> _slides;\n  List<Slide> get slides\
  \ => _slides;\n  ...\n```\n\n`Slide` 类存储标题字符串和项目符号字符串列表。任意图片的 URL 也以字符串形式存储：\n\n\
  ```dart\nclass Slide extends Object with LifecycleTracker {\n  String titleText\
  \ = \"\";\n  List<String> bulletPoints;\n  String imageUrl = \"\";\n  ...\n```\n\
  \n一个简单的构造函数将 `titleText` 作为参数，并初始化 `bulletPoints` 列表。\n\n那么，区别到底是什么呢？`appendHtml`\
  \ 方法会解析所提供的 HTML，并将生成的对象节点添加到父元素的节点中，随后像往常一样在浏览器中渲染。`appendText` 方法很有用，例如，可以防止用户提供的内容影响页面格式，并防止恶意代码被注入到网页中。\n\
  \n## 编辑演示文稿\n\n当源内容更新时，演示文稿会通过 `onKeyUp` 事件更新。文本编辑器项目中曾使用该事件来触发保存到本地存储。\n\n这一操作在\
  \ `SlideShow` 类的 `build` 方法中执行，并遵循我们在解析演示文稿时讨论过的模式：\n\n```dart\nbuild(String src)\
  \ {\n  updateEditTimestamp();\n  _slides = new List<Slide>();\n  Slide nextSlide;\n\
  \n  src.split(\"\\n\").forEach((String line) {\n    if (line.trim().length > 0)\
  \ {\n\n      // Title - also marks start of the next slide.\n      if (line.startsWith(\"\
  #\")) {\n        nextSlide = new Slide(line.substring(1));\n        _slides.add(nextSlide);\n\
  \      }\n      if (nextSlide != null) {\n        if (line.startsWith(\"+\")) {\n\
  \          nextSlide.bulletPoints.add(line.substring(1));\n        } else if (line.startsWith(\"\
  !\")) {\n          nextSlide.imageUrl = line.substring(1);\n        }\n      }\n\
  \    }\n  });\n}\n```\n\n作为 `startsWith` 方法的一种替代方案，可以使用方括号 `[]` 运算符，即 `line[0]`，来获取第一个字符。`startsWith`\
  \ 方法还可以接受正则表达式或字符串进行匹配，也可以传入起始索引。更多信息请参阅 `dart:core` 文档。就解析演示文稿而言，`startsWith` 方法更具可读性。\n\
  \n## 显示当前幻灯片\n\n幻灯片通过 `slideShowApp.dart` 中的 `showSlide` 方法显示。为了预览当前幻灯片，使用存储在字段\
  \ `currentSlideIndex` 中的当前索引来获取所需的幻灯片对象，并调用 `div` 渲染方法：\n\n```dart\nshowSlide(int\
  \ slideNumber) {\n  if (currentSlideShow.slides.length == 0) return;\n\n  slideScreen.style.visibility\
  \ = \"hidden\";\n  slideScreen\n    ..nodes.clear()\n    ..nodes.add(currentSlideShow.slides[slideNumber].getSlideContents());\n\
  \n  rangeSlidePos.value = slideNumber.toString();\n  slideScreen.style.visibility\
  \ = \"visible\";\n}\n```\n\n`slideScreen` 是一个 `DivElement`，通过将 `visibility` 样式属性设置为\
  \ `hidden`，在屏幕外进行更新。调用 `nodes.clear()` 清空 `DivElement` 的现有内容，再通过 `nodes.add` 添加幻灯片内容。设置范围滑块的位置，最后再将\
  \ `DivElement` 设置为 `visible`。\n\n## 浏览演示文稿\n\n一组常见的“第一张、上一张、下一张、最后一张”幻灯片按钮，让用户可以在演示文稿的预览中跳转。这是通过在幻灯片列表中内置一个索引，并将其存储在\
  \ `SlideShowApp` 类的 `slide` 字段中来实现的。\n\n## 处理按钮按键事件\n\n在 `SlideShowApp` 对象的构造函数中，需要以相同的模式设置导航按钮。首先，使用\
  \ `id`（元素的 `id` 属性）获取对象引用，然后为 `click` 事件附加处理程序。与其重复这段代码，不如用一个简单的函数来处理该过程：\n\n```dart\n\
  setButton(String id, Function clickHandler) {\n  ButtonElement btn = querySelector(id);\n\
  \  btn.onClick.listen(clickHandler);\n}\n```\n\n\n\n\n\n因为 Function 在 Dart 中是一个类型，所以函数可以很容易地作为参数传递。让我们来看一下带我们进入第一张幻灯片的按钮：\n\
  \n```\nsetButton(\"#btnFirst\", startSlideShow);\n\nvoid startSlideShow(MouseEvent\
  \ event) {\n  showFirstSlide();\n}\n\nvoid showFirstSlide() {\n  showSlide(0);\n\
  }\n```\n\n事件处理程序不会直接更改幻灯片；这些操作由其他方法执行，而这些方法也可能由键盘等其他输入触发。\n\n## 使用 Function 类型\n\
  \nSlideShowApp 构造函数使用了此功能：\n\n```\nFunction qs = querySelector;\nvar controls =\
  \ qs(\"#controls\");\n```\n\n我觉得 querySelector 方法打起来有点长（尽管它描述了它的作用）。由于 Function\
  \ 由类型组成，我们可以轻松创建一个简写版本。\n\n构造函数花费了大量时间选择并将 HTML 元素分配给类的成员字段。这种方法的一个优点是，页面的 DOM 只会被查询一次，并且引用会被存储并重复使用。这对应用程序的性能很有好处，因为一旦应用程序运行起来，查询\
  \ DOM 可能需要更长的时间。\n\n## 保持在边界内\n\n使用 dart:math 包中的 min 和 max 函数，可以将索引保持在当前列表的范围内：\n\
  \n```\nvoid showLastSlide() {\n  currentSlideIndex = max(0, currentSlideShow.slides.length\
  \ - 1);\n  showSlide(currentSlideIndex);\n}\nvoid showNextSlide() {\n```\n\n```\n\
  currentSlideIndex =\nmin(currentSlideShow.slides.length - 1, ++currentSlideIndex);\n\
  showSlide(currentSlideIndex);\n}\n```\n\n这些方便的函数可以节省大量 if 和 else if 比较，并使代码可读性提高很多。\n\
  \n## 使用滑块控件\n\n滑块控件是 HTML5 标准中的另一个新控件。这将允许用户在演示文稿中滚动浏览幻灯片。\n\n![](img/52c05b53a56abd53584e4fed738ed509_83_0.png)\n\
  \n这个控件是我个人最喜欢的控件之一，因为它非常直观，可以为用户提供非常交互式的反馈。在早期一代网络浏览器的原始表单控件中，似乎遗漏了它。即使是清晰且被广泛接受的功能，HTML\
  \ 规范也可能需要很长时间才能通过委员会并进入日常浏览器！\n\n```\n<input type=\"range\" id=\"rngSlides\" value=\"\
  0\"/>\n```\n\n该控件有一个 onChange 事件，在 SlideShowApp 构造函数中为其添加了监听器：\n\n```\nrangeSlidepos.onChange.listen(moveToSlide);rangeSlidepos.onChange\n\
  .listen(moveToSlide);\n```\n\n该控件通过简单的字符串值提供其数据，该值可以通过 int.parse 方法转换为整数，以便用作演示文稿幻灯片列表中的索引：\n\
  \n```\nvoid moveToSlide(Event event) {\n  currentSlideIndex = int.parse(rangeSlidePos.value);\n\
  \  showSlide(currentSlideIndex);\n}\n```\n\n滑块控件必须与幻灯片显示的任何其他更改、导航的使用或幻灯片数量的更改保持同步。例如，用户可以使用滑块到达演示文稿的一般区域，然后使用“上一个”和“下一个”按钮进行调整：\n\
  \n```\nvoid updateRangeControl() {\n  rangeSlidepos\n  ..min = \"0\"\n  ..max =\
  \ (currentSlideShow.slides.length - 1).toString();\n}\n```\n\n此方法在幻灯片数量更改时调用，并且与处理大多数\
  \ HTML 元素一样，需要将要设置的值转换为字符串。\n\n## 响应键盘事件\n\n使用键盘，特别是箭头（光标）键，是在预览模式下浏览演示文稿幻灯片的自然方式。这是在\
  \ SlideShowApp 构造函数中完成的。\n\n> 在 Dart Web 应用程序中，dart:html 包允许从任何类或函数直接访问全局 window\
  \ 对象。\n\n用于输入演示文稿源的 Textarea 也会响应箭头键，因此需要检查它当前是否正在使用。document 上的 activeElement 属性将给出具有焦点的控件的引用。此引用可以与存储在\
  \ presEditor 字段中的 Textarea 进行比较，以便决定是否对按键做出反应。\n\n| 键 | 事件代码 | 操作 |\n|---|---|---|\n\
  | 左箭头 | 37 | 后退一页幻灯片 |\n| 上箭头 | 38 | 转到第一张幻灯片 |\n| 右箭头 | 39 | 转到下一张幻灯片 |\n| 下箭头\
  \ | 40 | 转到最后一张幻灯片 |\n\n## 两次监听事件流\n\nDart 中的事件系统实现为流。其优点之一是事件可以很容易地让多个实体监听该类。\n\
  \n例如，在 Web 应用程序中，这很有用，因为某些键盘按下在一种上下文中有效，而在另一种上下文中无效。listen 方法是一个添加操作（累积的），因此帮助的按键可以单独实现。这允许模块化方法，有助于重用，因为处理程序可以专门化并根据需要添加：\n\
  \n```\nwindow.onKeyUp.listen((KeyboardEvent e) {\n  print(e);\n\n  //Check the editor\
  \ does not have focus.\n  if (presEditor != document.activeElement) {\n    DivElement\
  \ helpBox = qs(\"#helpKeyboardShortcuts\");\n    if (e.keyCode == 191) {\n     \
  \ if (helpBox.style.visibility == \"visible\") {\n        helpBox.style.visibility\
  \ = \"hidden\";\n      } else {\n        helpBox.style.visibility = \"visible\"\
  ;\n      }\n    }\n  }\n});\n```\n\n例如，在游戏中，一组常见的事件处理可能适用于标题和介绍屏幕，而实际游戏屏幕可以包含作为超集的额外事件处理。这可以通过向相关事件流添加和删除处理程序来实现。\n\
  \n## 更改颜色\n\nHTML5 为浏览器提供了功能齐全的颜色选择器（通常，浏览器使用操作系统的本机颜色选择器）。这将用于允许用户设置编辑器应用程序本身的背景颜色：\n\
  \n默认值为 `index.html` 页面中设置如下：\n\n![](img/52c05b53a56abd53584e4fed738ed509_88_0.png)\n\
  \n`DateInputElement` 类的 `valueAsDate` 属性提供 `Date` 对象，可以将其添加到文本区域：\n\n```\n```javascript\n\
  void insertDate(Event event) {\n    DateInputElement datePicker = querySelector(\"\
  #selDate\");\n    if (datePicker.valueAsDate != null) presEditor.value =\n    presEditor.value\
  \ +\n    datePicker.valueAsDate.toLocal().toString();\n}\n```\n```\n\n在这种情况下，使用\
  \ `toLocal` 方法来获取格式化为月、日和年格式的字符串。\n\n## 计时演示\n\n演讲者希望遵守其分配的时间段。我们将在编辑器中包含一个计时器以帮助排练。\n\
  \n## 介绍 Stopwatch 类\n\nStopwatch 类（来自 `dart:core`）提供了此功能所需的大部分功能，如以下小型命令行应用程序所示：\n\
  \n```\n```dart\nmain() {\n    Stopwatch sw = new Stopwatch();\n    sw.start();\n\
  \    print(sw.elapsed);\n    sw.stop();\n    print(sw.elapsed);\n}\n```\n```\n\n\
  elapsed 属性可以在任何时候检查以给出当前持续时间。这是一个非常有用的类，例如，它可用于比较不同的函数以查看哪个最快。\n\n## 实现演示计时器\n\n\
  时钟将通过 `toggleTimer` 方法处理的单个按钮停止和启动。重复计时器将更新屏幕上的持续时间文本，如下所示：\n\n![](img/52c05b53a56abd53584e4fed738ed509_89_0.png)\n\
  \n如果计时器正在运行，则更新 `Timer` 和字段 `slidesTime` 中的 `Stopwatch` 将被停止。无需更新显示，因为用户需要看到最终时间：\n\
  \n```\n```dart\nvoid toggleTimer(Event event) {\n  if (slidesTime.isRunning) {\n\
  \    slidesTime.stop();\n    updateTimer.cancel();\n  } else {\n    updateTimer\
  \ = new Timer.periodic(new Duration(seconds: 1),\n      (timer) {\n        String\
  \ seconds = (slidesTime.elapsed.inSeconds %\n        60).toString();\n        seconds\
  \ = seconds.padLeft(2, \"0\");\n        timerDisplay.text =\n          \"${slidesTime.elapsed.inMinutes}:$seconds\"\
  ;\n      });\n\n    slidesTime\n      ..reset()\n      ..start();\n  }\n}\n```\n\
  ```\n\nStopwatch 类提供了以分钟和秒检索经过时间的属性。为了将其格式化为分钟和秒，秒部分是使用模除运算符 % 确定的，并使用字符串函数 `padLeft`\
  \ 进行填充。\n\nDart 的字符串插值功能用于构建最终字符串，并且由于正在访问 elapsed 和 `inMinutes` 属性，因此需要 `{}` 括号，以便返回单个值。\n\
  \n\n\n\n\n## 幻灯片概览\n\n这为用户提供了幻灯片的视觉概览，如以下截图所示：\n\n![](img/52c05b53a56abd53584e4fed738ed509_90_0.png)\n\
  \n演示幻灯片将在新的全屏 Div 元素中重新创建。其样式使用位于 `SlideShowApp` 构造函数中的 CSS 样式表中的 `fullScreen` 类进行设置：\n\
  \n```\noverviewScreen = new DivElement();\noverviewScreen.classes.toggle(\"fullScreen\"\
  );\noverviewScreen.onClick.listen((e) => overviewScreen.remove());\n```\n\n幻灯片的\
  \ HTML 将完全相同。为了缩小幻灯片，需要遍历幻灯片列表，获取 HTML 元素对象，并设置幻灯片的 CSS 类：\n\n```\ncurrentSlideShow.slides.forEach((s)\
  \ {\n  aSlide = s.getSlideContents();\n  aSlide.classes.toggle(\"slideOverview\"\
  );\n  aSlide.classes.toggle(\"shrink\");\n  ...\n```\n\n当鼠标进入时，CSS 悬停类用于缩放幻灯片，以便可以聚焦查看幻灯片。这些类使用\
  \ `toggle` 方法设置，该方法在类不存在时添加，如果存在则移除。该方法有一个可选参数：\n\n```\naSlide.classes.toggle('className',\
  \ condition);\n```\n\n第二个参数名为 `shouldAdd`，如果始终添加类则为 `true`，如果始终移除类则为 `false`。\n\n\
  ## 讲义备注\n\n没有什么比给与会者一份实体讲义更好的了。这可以通过概览显示的一种变体来实现：\n\n![](img/52c05b53a56abd53584e4fed738ed509_91_0.png)\n\
  \n与其复制概览代码，不如在方法声明中使用可选参数对该函数进行参数化。使用方括号 `[]` 将声明括起来，并指定默认值，如果未指定参数则使用默认值：\n\n```\n\
  void buildOverview([bool addNotes = false])\n```\n\n演示概览显示调用它时不需要任何参数：\n\n```\n\
  buildOverview();\n```\n\n讲义显示调用它时不需要任何参数：\n\n```\nbuildOverview(true);\n```\n\n\
  如果设置了此参数，则会为“备注”区域添加一个额外的 Div 元素，并调整 CSS 以利于打印布局。\n\n## 比较可选位置参数和命名参数\n\n`addNotes`\
  \ 参数声明为可选位置参数，因此无需命名参数即可指定可选值。第一个参数与提供的值匹配。\n\n为了提供更大的灵活性，Dart 允许可选参数被命名。考虑两个函数——第一个使用命名可选参数，第二个使用位置可选参数：\n\
  \n```\ngetRecords1(String query,{int limit: 25, int timeOut: 30}) {\n}\n```\n\n\
  ```\ngetRecords2(String query,[int limit = 80, int timeOut = 99]) {\n}\n```\n\n\
  第一个函数可以通过更多方式调用：\n\n```\ngetRecords1(\"\");\ngetRecords1(\"\", limit:50, timeOut:40);\n\
  getRecords1(\"\", timeOut:40, limit:65);\ngetRecords1(\"\", limit:50);\ngetRecords1(\"\
  \", timeOut:40);\n```\n\n```\ngetRecords2(\"\");\ngetRecords2(\"\", 90);\ngetRecords2(\"\
  \", 90, 50);\n```\n\n使用命名可选参数时，它们的提供顺序并不重要，并且优点是调用代码更清楚地表明所传递参数的用途。\n"
- "## 4\n语言、动作与声音\n\n> *电影中 50% 的娱乐效果来自声音和音乐。*\n> \n> – 乔治·卢卡斯\n\n用幻灯片演示应用来创作电影并不是一个好选择，但即使面对较少的观众，那些精通银幕的人的经验也值得我们学习。\n\
  \n用户界面中的简单动画赏心悦目，并能增强整体体验。\n\n网络浏览器中的声音已经存在了一段时间，主要依赖插件。大多数用户会庆幸自动播放 MIDI 文件的时代早已过去，大多数开发者也会高兴终于有了播放声音文件的标准方法。\n\
  \n## 进入全屏\n\n到目前为止，幻灯片一直处于小屏幕模式，需要将其切换到 Web 浏览器中的 **IMAX** 等效模式——全屏模式。观众不想看到幻灯片编辑器或桌面——只想看到幻灯片。\n\
  \n要打开本章的示例代码项目，请在 WebStorm 中打开 `Presenter` 文件夹，然后打开 `slideshowapp.dart` 文件。\n\n\
  ## 请求全屏\n\n尽管 Web 浏览器的趋势是逐渐缩小屏幕控件的大小——这一趋势因 Chrome 浏览器而加速——但全屏 Web 应用仍被用户接受，并且各浏览器之间已经确定了标准。让我们看看下面的截图：\n\
  \n出于安全考虑，Web 浏览器会提示用户允许网站进入全屏模式，该模式会隐藏屏幕外的工具栏和状态栏。\n\n![](img/52c05b53a56abd53584e4fed738ed509_96_0.png)\n\
  \n一旦进入全屏模式，用户会收到接管整个屏幕的域名的通知。Web 浏览器还将 Escape (Esc) 键设置为用户退出全屏模式的方式。几秒钟后，该通知会浮动离开屏幕，将指针移回屏幕顶部即可再次显示。\n\
  \n具体行为和位置可能因 Web 浏览器和操作系统而异。例如，Internet Explorer 往往会在页面底部显示通知。\n\n![](img/52c05b53a56abd53584e4fed738ed509_96_1.png)\n\
  \n`requestFullscreen` 方法可用于大多数页面元素，但通常使用 div 作为容器。演示应用从 `SlideShowApp` 对象的构造函数中调用\
  \ `setupFullScreen` 方法。使用一个布尔标志来跟踪显示模式：\n\n```\nqs(\"#btnStartShow\").onClick.listen((e)\
  \ {\n    isFullScreen = true;\n    liveFullScreen\n        .requestFullscreen()\n\
  \        .focus()\n        .classes.toggle(\"fullScreenShow\")\n        .style.visibility\
  \ = \"visible\";\n});\n```\n\n```\nliveSlideID = 0;\nupdateLiveSlide();\n}};\n```\n\
  \n可以监听 `onFullscreenChange` 事件，以便单个元素能够监听状态变化。例如，当应用处于全屏模式时，工具栏可能不会出现。\n\n当你点击 div\
  \ 时，`isFullScreen` 标志被设置，请求全屏，并将输入焦点设置到 `liveFullScreen` 对象上。接下来，将 .css 文件设置在 div\
  \ 上，并使其在屏幕上可见。最后，将 `liveSlideID` 设置为演示文稿的起点，并用幻灯片的内容更新显示。\n\n## 为全屏更新界面\n\n编辑器屏幕需要一个按钮来以全屏模式启动幻灯片。显示将是一个全新的元素，而不仅仅是编辑器预览的放大。\n\
  \n全屏将是一个 div 元素，填满整个窗口，并包含用于背景的子 div 元素，配有背景图像，以及当前正在显示的幻灯片。\n\n## 为全屏更新键盘控制\n\n\
  这里需要一个与上一章为编辑器屏幕实现的事件监听器类似的事件监听器。键盘控制在 `SlideShowApp` 类的 `setupKeyboardNavigation`\
  \ 方法中设置：\n\n```\nvoid setupKeyboardNavigation() {\n    //Keyboard navigation.\n\
  \    window.onKeyUp.listen((KeyboardEvent e) {\n        if (isFullScreen) {\n  \
  \          if (e.keyCode == 39) {\n                liveSlideID++;\n            \
  \    updateLiveSlide();\n            } else if (e.keyCode == 37) {\n           \
  \     liveSlideID--;\n                updateLiveSlide();\n            }\n      \
  \  } else {\n            //Check the editor does not have focus.\n            if\
  \ (presEditor != document.activeElement) {\n                if (e.keyCode == 39)\
  \ showNextSlide();\n                else if (e.keyCode == 37) showPrevSlide();\n\
  ```\n\n```\nelse if (e.keyCode == 38) showFirstSlide();\nelse if (e.keyCode == 40)\
  \ showLastSlide();\n}\n}\n});\n```\n\n`isFullscreen` 标志用于确定演示应用处于哪种模式。在全屏模式下，根据按下的键和当前更新的显示幻灯片，`liveSlideID`\
  \ 会递增或递减。\n\n## 添加鼠标控制\n\n点击鼠标按钮推进演示是一个相当常见的功能，我们的应用也应该支持这一点。这在 `setupFullscreen`\
  \ 方法中实现：\n\n```\nliveFullscreen = qs(\"#presentationSlideshow\");\nliveFullscreen.onClick.listen((e)\
  \ {\n  liveSlideID++;\n  updateLiveSlide();\n});\n```\n\n在 fullscreen div 元素上监听\
  \ `onClick` 事件，当收到此请求时，幻灯片前进到下一张。让我们看看下面的截图：\n\n![](img/52c05b53a56abd53584e4fed738ed509_98_0.png)\n\
  \n\n\n\n\n## 添加元数据\n\n在撰写本文时，部分全屏 API 在 Dart API 文档中被标记为实验性，并且文档中也明确说明了这一点。到你阅读本文时，全屏\
  \ API 应该已经稳定并完全可用了。\n\n这是新 Web 浏览器功能的标准流程，最终会变得稳定。添加实验性 API 很可能是一个持续的过程——浏览器永远达到\
  \ 100% 完整似乎非常不可能！`onFullscreenChange` Dart API 文档写道：\n\n```\nExperimental\nElementStream<Event>\
  \ get onFullscreenChange\nStream of fullscreenchange events handled by this Element.\n\
  ```\n\ndart:html 包此部分的源代码包含多个注解，其中包括 @experimental 标记：\n\n```\n/// Stream of `fullscreenchange`\
  \ events handled by this [Element].\n@DomName('Element.onwebkitfullscreenchange')\n\
  @DocsEditable()\n// https://dvcs.w3.org/hg/fullscreen/raw-file/tip/Overview.html\n\
  @Experimental()\nElementStream<Event> get onFullscreenChange =>\n  fullscreenChangeEvent.forElement(this);\n\
  ```\n\nDart 拥有非常灵活的注解系统，可以创建新系统为 Dart 中的大多数组件添加元数据，例如类、函数和库。模式，如你可能已经注意到的，是以 @ 符号开头，后跟对\
  \ const 构造函数的调用或对编译时常量变量的引用。\n\n### 创建自定义注解\n\n让我们创建自己的 Temporary 注解，它将标记类为应用程序设计的临时部分，并允许一个标签记录临时类计划在哪个构建中被移除：\n\
  \n```\nimport 'dart:mirrors';\n\nclass Temporary {\n  final String removalBuildLabel;\n\
  \  const Temporary(this.removalBuildLabel);\n}\n```\n\n```\n```dart\nString toString()\
  \ => removalBuildLabel;\n}\n\n@Temporary('Build1')\nclass TempWidgetTxt {}\n\n@Temporary('Build2')\n\
  class TempWidgetWithGFX {}\n\nvoid main() {\n  ClassMirror classMirror1 = reflectClass(TempWidgetTxt);\n\
  \  ClassMirror classMirror2 = reflectClass(TempWidgetWithGFX);\n\n  List<InstanceMirror>\
  \ metadata1 = classMirror1.metadata;\n  print(metadata1.first.reflectee);\n\n  List<InstanceMirror>\
  \ metadata2 = classMirror2.metadata;\n  print(metadata2.first.reflectee);\n}\n```\n\
  ```\n\nTemporary 构造函数允许设置一个标签。如果要将此类用作注解，则该字段必须是 final（单次赋值变量或字段）。main 函数调用 `reflectClass`\
  \ 来获取类的详细信息，然后访问此元数据并将其存储在列表中。toString 方法允许通过 `print` 输出元数据：\n\nBuild1\nBuild2\n\
  \n注解在核心 Dart API 中被广泛使用，在包中，它们被用作框架的基础，例如 Web 应用程序。它们并不是核心 SDK 的晦涩特性。\n\n## 翻译用户界面文本\n\
  \n我职业生涯中发布的第一个软件并不涉及任何代码创建。它是一个现有包的语言更新发布，将 CD-ROM 寄出（这是很久以前的事了！）和从头编写的东西一样令人满意。值得庆幸的是，这让我在挪威出了名！\n\
  \n软件应用程序的翻译对于其在某些市场的接受度至关重要。在 Web 应用程序的世界中，这一点更为重要。Dart 有一个名为 `intl` 的包，可用于帮助将你的应用程序带给全球受众。\n\
  \n演示者界面需要更新，以便以法语和西班牙语显示编辑器。这将涉及提取我们希望使用的字符串，获取翻译，并将其整合回项目中。\n\n语言将由用户在运行时选择。当前操作系统的界面语言可能不是用户希望使用应用程序的语言。\n\
  \n### 探索 intl 包\n\nintl 包为 Dart 应用程序的国际化和本地化提供功能。这不仅包括将界面文本翻译成其他语言这一重要方面，还包括文本（并非所有语言都是从左到右格式化的）、日期和数字的格式化。\n\
  \n### 定位要翻译的字符串\n\n应用程序的界面主要由按钮组成，还有一些其他标签和控件。可以使用 Intl.message 创建应用程序界面语言的词典，并将其存储为\
  \ PhraseBook 类中的静态函数，该类可在 interfacetrans.dart 文件中找到。这将组织所有要在运行时使用 value 或 text 属性设置在界面元素上的字符串：\n\
  \n```\nclass PhraseBook {\n    // Navigation controls.\n    static String btnFirstSlide()\
  \ => Intl.message(\"First\",\n        name: \"btnFirstSlide\", desc: \"Button label\
  \ - go to the first\nslide.\");\n\n    static String btnPrevSlide() => Intl.message(\"\
  Prev\",\n        name: \"btnPrevSlide\", desc: \"Button label - go to the previous\n\
  slide.\");\n    ...\n```\n\n这些函数是静态的，因此无需类的实例即可调用函数，例如 PhraseBook.btnFirstSlide()\
  \ 将返回第一张幻灯片的字符串。Intl.message 具有一系列命名参数。name 参数需要与函数名称匹配，以便于字符串提取工具，这些工具将在下一节中介绍。desc（描述）字段提供了字符串在程序中使用的上下文。当翻译者无法访问软件时，这很有用，甚至软件可能尚未编写。\n\
  \nIntl.message 具有广泛的功能，例如根据复数或指代不同性别而修改短语。此外，它还可以存储更多元信息，例如字符串的示例用法，以为翻译者提供更多上下文。请参阅\
  \ SDK 文档了解更多详细信息。\n\n### 提取字符串\n\n应用程序的英文字符串现在已组织在一个类文件中。接下来，我们需要提取字符串，以便将其发送出去进行翻译。`intl`\
  \ 包包含一个可以从命令行运行的提取工具。\n\n> 本章下一节将介绍从命令行运行工具的任务。确保 Dart SDK bin 文件夹位于系统的可执行路径中，以便\
  \ pub 和其他 Dart 工具可以从命令行上的任何位置执行。\n\n### 使用 Dart pub 运行命令\n\nPub 是一个在 Dart 中用途广泛的工具，其一个有趣的功能是运行属于\
  \ Dart 包的命令行工具：\n\n```\npub run packagename:programname\n```\n\n发出此命令时，pub 将在包的\
  \ bin 文件夹中查找 `programname.dart`：\n\n```\npub run intl:extract_to_arb --output-dir=c:\\\
  transarb web\\lib\\\ninterfacetrans.dart\n```\n\n> 有关包结构的更多信息，请参阅 https://www.dartlang.org/tools/pub/package-layout.html。\n\
  \n确保目标目录已存在。最后一个参数是包含翻译字符串函数的源文件。\n\n> **应用程序资源包（ARB）** 是一种基于 JSON 的格式，可扩展且可直接被应用程序使用。\n\
  你可以在 https://code.google.com/p/arb/ 了解有关项目格式的更多信息。\n\nJSON 格式的 ARB 文件包含 Phrasebook\
  \ 类的大部分信息，已转换为字典声明：\n\n```\n```json\n{\n  \"btnFirstSlide\": \"First\",\n  \"@btnFirstSlide\"\
  : {\n    \"description\": \"Button label - go to the first slide.\",\n    \"type\"\
  : \"text\",\n    ...\n  }\n}\n```\n```\n\n这种易于阅读且可移植的文件格式可被一系列应用程序使用以生成可用翻译。\n\n\
  ### 获取翻译\n\nGoogle Translator Toolkit（https://translate.google.com/toolkit/）是一个功能强大的在线工具，可接受\
  \ .arb 文件等多种格式。此工具免费使用，需要 Google 账户登录。\n\n![](img/52c05b53a56abd53584e4fed738ed509_103_0.png)\n\
  \nToolkit 的一个有用功能是它与 Google Translate 绑定，因此文本的计算机翻译会被提供出来。这就是用于演示字符串资源的方法——它不会给出完美的翻译，但对于初始测试和界面布局很有用。\n\
  \n\n\n\n\n## 语言、运动与声音\n\n> 即使是一个小项目，管理翻译也是一项相当大的工作量。每新增一个按钮，就意味着新的字符串、新的翻译和更多的测试！\n\
  > \n> Google Translator Toolkit 的一个替代方案是开源项目 Pootle，可以在 `http://pootle.translatehouse.org/`\
  \ 找到。\n> \n> 根据我的经验，译者背景各异，不一定都具备技术思维，而且你必须处理显著的时差问题。这时候就该运用那些重要的以人为本的软技能了！\n\n\
  每种语言都可以单独翻译，该工具允许跟踪翻译过程的进度。翻译文件可以与其他用户共享，如果需要，还可以众包翻译。\n\n一旦某种语言的翻译完成，就可以将它们下载为\
  \ `.arb` 文件。我们来看下面的截图：\n\n![](img/52c05b53a56abd53584e4fed738ed509_104_0.png)\n\n\
  ## 集成翻译文本\n\n现在翻译已安全地存储为字符串，是时候通过将这些文件转换为 Dart 源代码文件，把它们带回 Dart 项目中了。\n\n注意 ARB\
  \ 文件的命名带有 _es 和 _fr，这使 intl:generate_from_arb 工具能够确定正在处理的是哪种语言。在本例中，Dart 文件被直接放入项目的\
  \ lib 文件夹中：\n\n```\npub run intl:generate_from_arb\n--output-dir=web/lib\nweb/lib/interfacetrans.dart\n\
  web/lang/messages_es.arb web/lang/messages_fr.arb\n```\n\n所创建的文件包括核心的 messages_all.dart\
  \ 消息文件，它是主要的 Dart 导入文件。此外，还为所使用的每种语言创建了一个支持文件，即 messages_es.dart 和 messages_fr.dart。\n\
  \n## 更改用户界面的语言\n\n要使用这些翻译，需要在 interfacetrans.dart 中导入 messages_all.dart 文件。必须告诉\
  \ intl 包我们要使用哪种语言，它会在后台负责加载正确的资源。interfacetrans.dart 中的 setInterfaceLang 函数执行此任务，并由\
  \ SlideShowApp 构造函数调用：\n\n```\nsetInterfaceLang(String langID){\n  initializeMessages(langID).then((_){\
  \ \n    Intl.defaultLocale = langID;\n    addInterfaceText();\n  });\n}\n```\n\n\
  最棒的是，无论添加多少种新语言，addInterfaceText 方法都无需更改。\n\n## 添加语言下拉框\n\n对用户和开发者而言，随时更改界面语言非常有用。我们将添加一个带有\
  \ onChange 事件处理程序的下拉框，让用户可以从列表中选择语言：\n\n```\n<select id=\"interfaceLang\">\n<option>en</option>\n\
  <option>fr</option>\n<option>es</option>\n</select>\n```\n\n界面的所有初始化都已封装在 setInterfaceLang\
  \ 方法中，因此唯一需要传入的参数就是来自下拉框（SelectElement）的值：\n\n```\nsetInterfaceLang(\"en\");\nqs(\"\
  #interfaceLang\").onChange.listen((e) {\nvar lang = qs(\"#interfaceLang\").value;\n\
  setInterfaceLang(lang);\nlangInterface = lang;\n...\n```\n\n这是在 SlideShowApp 构造函数中与其他监听器一起设置的，并会触发用户所请求的界面更改。运行时，只需单击一下即可将语言切换为法语用户界面，而且更改几乎立即生效。\n\
  \n![](img/52c05b53a56abd53584e4fed738ed509_106_0.png)\n\n字符串的长度在不同语言之间可能有很大差异——按钮布局预留了扩展空间。请注意西班牙语和法语翻译中按钮的差异。\n\
  \n在设计多语言应用的界面布局时，这是一个需要考虑的因素。最好假设其他语言会更长，并为扩展留出一些空间。\n\n![](img/52c05b53a56abd53584e4fed738ed509_107_0.png)\n\
  \n尽管这个应用已经相当先进，但恐怕演示用的 coconut 演示文稿材料仍需用户自己去翻译！\n\n## 处理日期\n\nISO 8601 日期标准是“年 月\
  \ 日”，自然，世界上没有任何国家在日常生活中使用这种标准！典型的变体是先写月或日，然后使用分隔符连接简写形式的数字。\n\nintl 包可以帮助提供适合每种语言的格式和翻译。由于可能需要显示星期或月份的名称，因此也需要翻译字符串。\n\
  \n日期处理在 SlideShowApp 类中实现：\n\n```\nimport 'package:intl/date_symbol_data_local.dart';\n\
  ```\n\n使用一个字段来保存对活动 DateFormat 对象的引用：\n\n```\nDateFormat slideDateFormatter;\n```\n\
  \n我们将考虑如何初始化此格式化器，并根据用户语言的变化使其保持最新。\n\n## 针对区域设置进行格式化\n\n每当界面语言更改时，日期格式化器的区域设置也需要更新：\n\
  \n```\nqs(\"#interfaceLang\").onChange.listen((e) {\n  var lang = qs(\"#interfaceLang\"\
  ).value;\n  setInterfaceLang(lang);\n  langInterface = lang;\n  initDefaultDate();\n\
  });\n```\n\n当请求某个区域设置时，需要创建相应的 DateFormat 对象：\n\n```\ninitDefaultDate() {\n  initializeDateFormatting(langInterface,\
  \ null).then((d) {\n    slideDateFormatter = new DateFormat.yMMMMEEEEd(langInterface);\n\
  \  });\n}\n```\n\n一旦完成这些设置，就可以使用下拉框更改界面语言，并获得格式和语言都正确的日期。\n\n![](img/52c05b53a56abd53584e4fed738ed509_108_0.png)\n\
  \n关于这个话题的最后一句话：大多数 Web 应用在语言选择上远没有这么动态。通常，界面语言选择是每个用户的配置选项，在用户登录时为每个会话设置。\n\n##\
  \ 制作幻灯片动画\n\n全屏显示在任何时候都只展示一张幻灯片。*新*幻灯片最初会放置在屏幕顶部，然后缓缓降落到视野中。*旧*幻灯片从演示查看者的角度来看会立即消失。\n\
  \n![](img/52c05b53a56abd53584e4fed738ed509_109_0.png)\n\n## 使用定时器\n\nDart 中的周期性定时器对你来说应该已经是老朋友了。它用于检查幻灯片是否已到达最终位置。如果尚未到达，则更新位置：\n\
  \n```\nnew Timer.periodic(new Duration(milliseconds: 50), (timer) {\n  if (isFullScreen\
  \ && liveSlideY < 0) {\n    liveSlide.style.top = liveSlideY.toString() + \"px\"\
  ;\n    liveSlideY += 50;\n  }\n});\n```\n\n你可能会担心 Timer 对象会一直运行，即使演示未在全屏模式下也是如此。实际上，它们非常轻量，动画执行的工作量极小，影响可以忽略不计。\n\
  \n## 在浏览器中播放声音\n\n这个特性故意留到最后讲，因为不断听同一个音效可能会变得相当烦人！MP3 可能是各种 Web 浏览器支持最好的格式，但有一个例外——Dartium。\n\
  \n> Dartium 是基于开源项目 Chromium 构建的。该项目不包含包括 MP3 在内的任何专有编解码器。创建项目时，有时可以直接使用 MP3，并在另一个浏览器中测试应用的音频部分。\n\
  \n对于这个项目，提供了同一个声音文件的三种格式。OGG 格式可在 Dartium 和大多数浏览器中运行。如果遇到问题，请尝试其他格式。\n\n## 制作音效\n\
  \n要创建幻灯片切换时播放的音效，可以使用 Bfxr 之类的工具。可以在 http://www.bfxr.net/ 上找到它（那里也有独立版本的下载链接），它是一个强大的音频创建工具。\n\
  \n由于它是为游戏黑客松（限时游戏编程竞赛）期间使用而创建的，所以易于上手且使用快速。我们来看下面的截图：\n\n![](img/52c05b53a56abd53584e4fed738ed509_111_0.png)\n\
  \n## 创建声音文件\n\nAudacity（http://web.audacityteam.org/）是一个流行且稳定的音频编辑和录制软件包。它是一个开源桌面应用，可用于所有主流操作系统平台。我们来看下面的截图：\n\
  \n![](img/52c05b53a56abd53584e4fed738ed509_111_1.png)\n\n\n\n\n\n你可以在最后对声音进行一些微调并将其导出（File\
  \ | Export...）为多种格式（如 MP3、Ogg 和 WAV）。在某些系统上，你可能需要下载 MP3 编解码器。\n\n> 不过要注意文件大小和时长！理想情况下，声音长度应约为\
  \ 200ms。\n\n### Loading sounds\n\n声音是在从 SlideShowApp 对象的构造函数中调用的方法中加载的，并且正如你在 Dart\
  \ 中所期望的那样，这是一个异步操作：\n\n```\nList loadAudio() {\n  slideChange = new AudioElement(\"\
  snd/slidechange.ogg\");\n  slideChange.preload = \"auto\";\n  return [slideChange.onLoad.first];\n\
  }\n```\n\n```\nplaySnd() {\n  slideChange\n    .play()\n    .onEnded.listen(done);\n\
  }\n```\n\n```\ndone(e) {\n  slideChange.load();\n}\n```\n\nAudioElement 的 onLoad\
  \ 属性是该对象的加载事件流（音频和其他媒体元素可能加载多个文件）。\n\n该流的 first 属性等待第一个加载事件，然后停止监听流。这是一种确保所有媒体，例如游戏中的图像和声音，在使用前已全部加载的有用方法。\n\
  \n### Playing back sounds\n\n完成所有设置后，实际播放音频只是调用 playSnd 方法并确保扬声器已插入的问题！会监听 onEnded\
  \ 事件并提供回调。这处理了一个浏览器的怪癖，即在重新播放之前需要重新加载文件。\n\n这个怪癖提醒我们，尽管浏览器中的音频支持已大幅改善，但它主要面向大型媒体播放，而播放短音效的工作量可能比应有的要多一些。\n\
  \n> 这里有一个网站，你可以用它来通过错误报告或功能建议为 Dart 开发做出贡献：\n>\n> `http://dartbug.com`\n>\n> 这会将你重定向（截至撰写时）到一个\
  \ Google Code 项目。Google Code 服务正在逐步淘汰，但为了 Chromium 项目仍会保留一段时间。由于 Dart 团队是 Google\
  \ Chrome 团队的一部分，因此项目的一部分可能同时存在于 Google Code 和 GitHub 上。\n>\n> 如果你有想法或认为发现了错误，在提出该问题之前，先搜索现有问题或在\
  \ **Google+** (`http://g.co/dartisans`) 或邮件列表上讨论它是个好主意。\n\n### Summary\n\n演示应用程序现在已具备足够的功能，使最终幻灯片对接收者的眼睛和耳朵都令人愉悦。\n\
  \n在幕后，该界面可供不讲英语的人使用。此外，软件只需做最少的代码更改即可轻松翻译成更多语言。\n\n我们研究了 Dart 强大的元数据功能，并看到了它们在 SDK\
  \ 和用户应用程序中的使用方式。我们看到了 pub 工具如何让我们使用 Dart 包中的工具。\n\n有了文本编辑器和演示应用程序，Dart 的客户端故事已被充分探索；将其带到服务器端将让我们看到\
  \ Dart 在另一个环境中的表现！\n"
- "## 5 A Blog Server\n\n> 忘掉某人的简历或他们在聚会上的表现吧。他们会写博客吗？博客不会说谎。\n>\n> – Nick Denton\n\
  \n我希望我能记得我在网上读到的第一篇博客，但我确实记得在“博客”一词被发明之前很久，就在主页上阅读过（并拥有过）日记部分。尽管各种社交媒体平台 meteoric\
  \ 上升，博客仍然保持了其地位。\n\n是时候让我们探索 Dart 故事的服务器端了，而博客为我们提供了探索这种语言不同方面的绝佳机会。在服务器端，由于上下文在\
  \ Web 浏览器之外，因此提供了新的功能。\n\n### The Hello World server example\n\n在 Dart 中创建最小的 Hello\
  \ World 服务器非常简单。打开本章的示例 HelloWorld 文件在 Dart 编辑器中。该项目是一个命令行项目，因此 main.dart 文件放在 bin\
  \ 文件夹中：\n\n```\nimport 'dart:io';\nvoid main() {\n  HttpServer.bind('127.0.0.1',\
  \ 8080).then(\n    (server) {\n      server.listen((HttpRequest request) {\n   \
  \     request.response\n          ..write('Hello Dart World')\n          ..close();\n\
  \      });\n    });\n}\n```\n\n输出显示在以下屏幕截图中：\n\n![](img/52c05b53a56abd53584e4fed738ed509_116_0.png)\n\
  \ndart:io 包对于服务器端非常重要。它允许我们访问在 Web 浏览器上下文中由于安全原因而无法使用的功能，例如文件系统和网络。\n\n启动服务器程序不会像我们之前的应用程序那样打开\
  \ Web 浏览器。你必须手动打开浏览器，然后转到你绑定的地址和端口。此外，如果在服务器代码中进行了更改，则必须停止并重新启动应用程序才能看到更改。\n\nHttpServer.bind\
  \ 方法接受两个参数——IP地址和端口号。然后尝试将服务器绑定到此网络配置，如果成功（通常只有在绑定已被使用时才会失败），则执行该函数。\n\n> 网络设置因计算机而异。本章的示例代码使用了通常可用的端口和\
  \ IP 号；然而，你可能需要为你的系统调整这些——如果你有一个繁忙的开发系统，这很可能！\n\n返回的服务器对象被设置为在该端口上监听 HTTP 请求。如果收到任何请求，消息\
  \ Hello Dart World 将传递给请求对象的 response 方法，然后，非常重要的是，响应将被关闭。\n\n这个简单示例展示了所有基于 HTTP\
  \ 的服务器应用程序的结构——绑定到网络然后处理请求。当然，处理请求并产生高质量输出通常要复杂得多。\n\n如果你对网络不太熟悉，这里有一个快速回顾！IP（Internet\
  \ Protocol）地址帮助我们识别网络上的机器（通常），由 4 个数字组成，用句点分隔，例如 192.168.0.1。\n\n大多数计算机都有一个特殊的 IP\
  \ 127.0.0.1，仅用于该机器上的网络通信。这是用于与自身建立连接的计算机的网络地址，不能被远程机器使用。除了这个区别外，它与其他任何 IP 地址一样操作。\n\
  \n端口有助于识别连接附加到的应用程序或服务。打个比方，IP 是人们的名字，端口是对话的话题。为了获得正确的信息，你需要两者都正确！\n\n![](img/52c05b53a56abd53584e4fed738ed509_117_0.png)\n\
  \n在应用程序仍在运行时，转到 main.dart 并通过在行尾添加 ! 来更改消息，即输出。刷新浏览器页面，你会发现没有任何变化。Dart 代码在服务器上运行，不再在浏览器中执行，因此简单的刷新功能来查看更改现在很遗憾地消失了。\n\
  \n好消息是，启动和停止服务器应用程序非常容易，我们可以使用任何 Web 浏览器来测试应用程序。仍然可以在代码中放置断点，并在页面提供服务时触发。\n\n###\
  \ A blog server\n\n博客服务器需要以与任何其他 Web 服务器相同的方式响应网络请求，以便可以被现有客户端使用。服务器的主要客户端将是 Web\
  \ 浏览器，例如 Google Chrome 和 Internet Explorer。\n\n博客服务器需要在不同的操作系统上作为可靠的应用程序运行。本章后面，我们将看看\
  \ Dart 应用程序如何部署——需要辅助应用程序和依赖项来实现这一点。\n\n### Introducing the HTTP protocol\n\nHTTP\
  \ 协议简单而轻量。一般来说，服务器用一组标头响应请求，说明请求是否成功或不成功。然后它发送将要发送内容的详细信息，以及内容本身，然后关闭连接。\n\nHTTP\
  \ 协议要求所有标头必须在任何内容之前发送。Dart 有助于强制执行此操作，如果你尝试在发送了一些内容后修改标头，将抛出 HttpException。\n\n\n\
  \n\n\n## 启动服务器\n\n博客服务器的 main.dart 入口点与 Hello World 示例类似。提供内容的实际功能由 BlogServerApp\
  \ 类处理，其中初始化了一个实例：\n\n```\nimport 'dart:io';\nimport 'package:blogserver/blogserver.dart';\n\
  \nmain() {\n  print(\"starting\");\n  var blogServer = new BlogServerApp();\n  print(\"\
  Starting blog server...\");\n\n  HttpServer.bind('127.0.0.1', 8080).then((server)\
  \ {\n    server.listen(blogServer.handleRequest);\n  });\n}\n```\n\n服务器启动时向用户提供一些反馈是良好的实践。此服务器为单线程，所有请求都由一个进程以串行方式处理。\n\
  \n## 博客文章的存储格式\n\n博客文章保存在一种简单的文本文件格式中，文件名即为博客文章 ID，并带有 txt 文件扩展名：\n\n```\n1st Line\
  \ - Date\n2nd Line - Title\n3rd Line until end of file - Post Body\n```\n\n1.txt\
  \ 中的一篇博客文章如下所示：\n\n```\n01/05/2015\nGiraffe Facts\n<p>\nLorem ipsum dolor sit amet,\
  \ consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore\
  \ magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris\
  \ nisi ut aliquip ex ea commodo consequat. Duis aute irure dolor in reprehenderit\
  \ in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint\
  \ occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim\
  \ id est laborum.\n</p>\n```\n\n内容是标准的 Lorem ipsum 文本，排版者几个世纪以来一直在使用它。\n\n## 读取文本文件\n\
  \n现在我们已在浏览器之外工作，可以更直接地使用文件系统。让我们看看如何读取文本文件并将每一行打印到标准输出：\n\n```\nvoid main() {\n\
  \    File myfile = new File(\"readme.txt\");\n    myfile.readAsLines().then(\n \
  \       (List<String> lines)\n        {lines.forEach( (line) => print(line) ); }\n\
  \    );\n}\n```\n\n要按我们定义的格式读取博客文章，行列表需要进行一些额外处理。这是在 blog.dart 源文件中 BlogPost 构造函数中调用的\
  \ process 方法中实现的：\n\n```\nBlogPost(String filename, this._id) {\n    File postFile\
  \ = new File(filename);\n    _source = postFile.readAsLinesSync();\n    process();\n\
  }\n```\n\n文件使用 readAsLines 的同步版本读取，因此 process 调用无需像前一个示例那样放在 then 处理程序中：\n\n```\n\
  process() {\n    _html = \"\";\n    _date = _source[0];\n    _title = _source[1];\n\
  \    _html = \"<h2>$_title</h2><b>$_date</b><br/>\";\n    _html += \"<img src=\\\
  \"$_id.png\\\" align=\\\"left\\\">\";\n    _source.sublist(2).forEach((line) =>\
  \ _html += line);\n    _html += \"<br/><a href=\\\"post$_id.html\\\">Permalink</a>\"\
  ;\n}\n```\n\n前两行使用 [] 方法选择。剩余的行从列表中拆分为子列表，并直接用于构建将作为输出的 HTML 文件。内容被假定为有效的 HTML。\n\
  \n## 读取文件文件夹\n\n在项目中，content 文件夹的 posts 子文件夹包含所有博客内容。要获取要加载的所有文件的列表，可以使用 `Directory`\
  \ 对象获取列表，然后使用 `forEach` 进行处理：\n\n```\nvoid _loadPostList() {\n    Directory blogContent\
  \ = new Directory(_pathPosts);\n    blogContent.list().forEach((File f) {\n    \
  \    String postFilename =\n            path.basename(f.path).replaceAll(\".txt\"\
  , \"\");\n        int id = int.parse(postFilename);\n        IDs.add(id);\n    \
  \    postPaths[id] = f.path;\n    }).then((v) {\n        IDs.sort();\n        IDs\
  \ = IDs.reversed.toList();\n    });\n}\n```\n\n博客文章的文件路径存储在 `Map` 中，以便可以通过 `id`\
  \ 值检索。`IDs` 存储在列表中，然后可以排序（文件系统无法保证按任何特定顺序提供文件名列表），并且我们可以轻松检索帖子，最近发布的帖子排在最前面。\n\n\
  ## 请求处理\n\n传入的 `HttpRequest` 对象包含有关客户端的大量信息——所做的请求和到服务器的网络连接：\n\n```\nhandleRequest(HttpRequest\
  \ request) {\n\n    if (request.uri.path.endsWith(\".html\")) {\n        _serveTextFile(request);\n\
  \    }\n    else if (request.uri.path.endsWith(\".png\")) {\n        _servePngFile(request);\n\
  \    }\n    else if (request.uri.path == \"/robots.txt\") {\n        _serveRobotsFile(request);\n\
  \    }\n    else {\n        _serve404(request);\n    }\n}\n```\n\n在博客服务器的上下文中，我们最感兴趣的是\
  \ `request` 对象的 **Uri（统一资源标识符）** 属性，更 commonly 称为 URL，它给出所请求资源的路径。\n\n例如，如果发送到服务器的请求是\
  \ `http://127.0.0.1:8080/post6.html?test=false`（查询字符串不被博客服务器使用），则 `request.uri`\
  \ 的值将为 `/post6.html?test=false`，而 `request.uri.path` 的值将为 `/post6.html`。\n\n对于正在请求的页面、图像或文件，`request.uri.path`\
  \ 属性提供了所需详细信息。对 `robots.txt` 文件的请求与博客文章和图像的处理方式不同，这将在后面的章节中详细介绍。\n\n## 提供文本\n\n\
  如果请求页面，我们需要向发出请求的客户端提供反馈。我们的响应首先是告诉客户端我们将响应的数据类型格式（内容类型），也称为 MIME 类型。其次，我们希望让客户端知道我们已理解请求（`HttpStatus.OK`），并即将发送请求的内容：\n\
  \n```\nvoid _serveTextFile(HttpRequest request) {\n    String content = _getContent(request.uri.path.toString());\n\
  \n    request.response\n        .headers.set('Content-Type', 'text/html')\n    \
  \    .statusCode = HttpStatus.OK\n        .write(\"\"\"<html>\n<head><title>$BlogTitle</title></head>\n\
  <body>\n$content\n</body>\n</html>\"\"\")\n        .close();\n}\n```\n\n设置这些项目后，可以使用请求对象的\
  \ `response` 属性将页面内容提供给请求客户端。最后调用 `close()` 方法，以便客户端知道服务器已完成发送内容。\n\nMIME 代表 Multipurpose\
  \ Internet Mail Extensions。它是 IETF 标准，用于指示文件包含的数据类型。随着在线共享的更多数据类型，此列表不断增长。有关更多详细信息，请参阅\
  \ http://www.iana.org/assignments/media-types/media-types.xhtml。\n\n## Robots.txt\n\
  \n使用网络浏览器的用户只是网络用户的一种类型。实时互联网上有许多机器人和蜘蛛。为了给非人类访客提供一些指导，robots.txt 标准告诉机器人是否受欢迎，如果是搜索引擎，则如何索引它。对于博客服务器的目的，我们希望欢迎搜索引擎索引内容以带来更多读者。\n\
  \n此响应的文本内容为：\n\n```\nUser-agent: *\nDisallow:\n```\n\nrobots.txt 请求需要以与普通文本页面相同的方式处理和提供服务：\n\
  \n```\nvoid _serveRobotsFile(HttpRequest request) {\n    request.response\n    ..statusCode\
  \ = HttpStatus.OK\n    ..headers.set('Content-Type', 'text/html')\n    ..write(RobotsTxt)\n\
  \    ..close();\n}\n```\n\n页面以正面的 OK HTTP 状态提供服务。\n\n## 渲染单篇博客文章\n\n博客文章将通过永久链接的\
  \ URI 在单个页面上提供，例如 http://127.0.0.1:8080/post6.html，并且 _getContent 方法解析 Uri 路径以获取帖子的\
  \ ID 号：\n\n```\nif (path.startsWith(\"/post\")) {\n    String idfromUrl =\n    \
  \    path.replaceFirst(\"/post\", \"\").replaceFirst(\".html\", \"\");\n    int\
  \ id = int.parse(idfromUrl);\n    return hostedBlog.getBlogPost(id).HTML;\n}\n```\n\
  \n\n## 定位文件\n\nBlog 类的 `getBlogImage` 方法返回用于在博客文章中显示的 PNG 文件。当构造函数中调用 `_loadImgList`\
  \ 时，Blog 类会构建一个图像文件名列表。这与之前描述的 `_loadPostList` 函数的方式相同：\n\n```dart\nFile getBlogImage(int\
  \ index) {\n    return new File(imgPaths[index]);\n}\n```\n\n该 ID 被用作从映射中获取值的键，并返回完整的文件路径。Web\
  \ 服务器指向文件的 Uri 与文件系统的位置完全无关，由应用程序的逻辑决定将哪个文件传送给客户端。\n\n## 提供单个图像文件\n\n服务器并不知道为 index.html\
  \ 提供的网页（HTML 和图像）的完整结构。它只是以单一的方式返回对 Web 浏览器 HTTP 请求的响应：\n\n![](img/52c05b53a56abd53584e4fed738ed509_125_0.png)\n\
  \n单个图像可以在 HTML 页面之外直接请求。\n\n## 提供 404 错误\n\n即使是非技术性的 Web 用户也熟悉 404 错误，它表示网站上的页面无法找到：\n\
  \n```dart\nvoid _serve404(HttpRequest request) {\n  request.response\n    ..statusCode\
  \ = HttpStatus.NOT_FOUND\n    ..headers.set('Content-Type', 'text/html')\n    ..write(page404)\n\
  \    ..close();\n}\n```\n\n此页面是一个普通文本页面（常量字符串 page404 包含内容），并通过将状态码设置为 NOT_FOUND\
  \ 进一步告知客户端 404 状态，如下面的截图所示：\n\n![](img/52c05b53a56abd53584e4fed738ed509_126_0.png)\n\
  \n希望博客服务器不需要提供太多这样的页面！\n\n## 介绍 Dart 的服务器框架\n\n本项目中的博客服务器直接基于 dart:io 编写，因此你可以了解其内部工作原理。正如你所期望的，Dart\
  \ 有许多框架可以帮助编写服务器应用程序，这样基本任务（如提供文本文件）就不必为每个应用程序从头实现。\n\n这些都可以在 pub 包库中找到。\n\n###\
  \ Redstone\n\nRedstone 被描述为“Dart 平台的服务端微框架”。它使用简单的代码注解将 Dart 函数暴露给 Web。Redstone\
  \ 的 Hello World 示例非常清晰，展示了注解如何向开发者隐藏复杂性，使他们能够专注于应用程序逻辑：\n\n```dart\nimport 'package:redstone/server.dart'\
  \ as app;\n\n@app.Route(\"/\")\nhelloWorld() => \"Hello, World!\";\n\nmain() {\n\
  \  app.setupConsoleLog();\n  app.start();\n}\n```\n\n> 你可以在 http://redstonedart.org/\
  \ 了解更多关于 Redstone 的信息。\n\n### Rikulo\n\nRikulo 谦虚地将自己描述为一个轻量级的 Dart Web 服务器。它拥有一系列有趣的功能，包括请求路由、模板引擎和\
  \ MVC（模型-视图-控制器）设计模式。Rikulo Stream 是服务器端的解决方案，其提供静态内容的 Hello World 示例只有一行：\n\n```dart\n\
  import \"package:stream/stream.dart\";\nvoid main() {\n  new StreamServer().start();\n\
  }\n```\n\n> 你可以在 http://rikulo.org/ 了解更多关于 Rikulo 的信息，那里列出了几个项目。\n\n### Shelf\n\n\
  Shelf 声称它可以轻松创建和组合 Web 服务器以及 Web 服务器的各个部分。其基于管道的模型允许添加中间件（例如其 Hello World 示例中的请求记录器）：\n\
  \n```dart\nimport 'package:shelf/shelf.dart' as shelf;\nimport 'package:shelf/shelf_io.dart'\
  \ as io;\n\nvoid main() {\n  var handler = const shelf.Pipeline().addMiddleware(shelf.logRequests())\n\
  \    .addHandler(_echoRequest);\n\n  io.serve(handler, 'localhost', 8080).then((server)\
  \ {\n    print('Serving at http://${server.address.host}:${server.port}');\n  });\n\
  }\n\nshelf.Response _echoRequest(shelf.Request request) {\n  return new shelf.Response.ok('Request\
  \ for \"${request.url}\"');\n}\n```\n\n> 在 https://github.com/dart-lang/shelf 了解更多关于\
  \ Shelf 的信息，正如这个 URL 所暗示的，这个包来自 Dart 团队。\n\n## 部署\n\n在一个漫长而艰难的软件开发项目之后，如果最后一刻出现意外，要让最终产品在正式系统上运行可能会带来极大的压力。最好在开发过程的早期就考虑部署，以便应用程序适合目标环境。\n\
  \n我们将了解如何在两种常见环境中部署 Dart——Windows 和 Unix。当然，每个具体系统在细节上可能有所不同，因此你可能需要检查系统上等效的设置或程序，并考虑到任何当前正在运行的应用程序，例如\
  \ Web 服务器。\n\n### 依赖项\n\nDart SDK 本身是任何 Dart 服务器应用程序的关键依赖。应用程序通过 dart 命令行应用程序运行，并将\
  \ main.dart 脚本作为参数传递。\n\n对于交互式会话来说，这很简单；然而，对于服务器应用程序，我们需要在没有用户登录到机器时运行该应用程序。\n\n\
  > Dart SDK 可作为单独下载（不包括开发人员工具），网址为 https://www.dartlang.org/downloads/。\n\n### 在\
  \ Unix 上部署\n\n在 Linux 或其他类 Unix 系统上，Web 应用程序可以在名为 screen（小写 s）的控制台应用程序中启动。screen\
  \ 命令允许创建其他控制台会话，一旦主会话结束，这些会话可以在后台继续运行。\n\n可以创建一个 screen 应用程序——应用程序启动后，screen 被分离，主会话结束。然后\
  \ Web 应用程序继续运行。如果需要进行更改，可以重新连接已分离的 screen（这可能是在几个月或几年之后！）进行任何调整；例如，安装新版本或更改配置。\n\
  \n这可以用于允许直接在服务器上进行 shell 访问（通常是 SSH）的托管系统。\n\n### 使用 screen 命令\n\n以适当的用户身份登录系统上的交互式\
  \ shell。要检查是否安装了 screen，请运行以下命令以获取版本和描述：\n\n```\nScreen\nScreen version 4.01.00devel\
  \ (GNU) 2-May-06\n\nCopyright (c) 2010 Juergen Weigert, Sadrul Habib Chowdhury\n\
  Copyright (c) 2008, 2009 Juergen Weigert, Michael Schroeder\n...\n```\n\n如果程序未安装，请使用你的包管理器安装该包，它简单地称为\
  \ screen。\n\n### 启动 screen\n\n一旦 screen 应用程序运行，按 Enter 键，你将再次进入命令提示符。按 Ctrl+a，将显示版本屏幕，表明我们不在正常的\
  \ shell 中。\n\n使用 cd 进入 BlogServer 文件夹，并启动 Dart 博客服务器：\n\n```\ndart bin/main.dart\n\
  ```\n\n接下来，按 Ctrl+a、Ctrl+d，你将看到类似以下的消息：\n\n```\n[detached from 398.pts-2.localhost]\n\
  ```\n\n现在你应该回到常规终端了。运行 top 命令（或任何其他列出系统上正在运行的进程的程序）来获取进程列表，你会看到 Dart 在后台运行。\n\n\
  运行 Web 浏览器并导航到 index.html 页面。博客将从编辑器调试会话中提供。\n\n要重新连接到这个 screen，使用命令 screen -r，你将回到该会话中。\n\
  \n> screen 命令是一个强大的工具，但要记住哪个 screen 正在使用可能会有点令人困惑。建议你将键盘快捷键牢记于心，以便于导航。\n\n### 在\
  \ Windows 上部署\n\n在 Windows 上，服务器应用程序通常作为 Windows 服务运行，对于 .NET 应用程序，则通过 Internet\
  \ Information Services 托管。\n\n将 Dart bin/main.dart 命令放入批处理文件中是一项相对简单的操作，这样它可以在交互式会话中双击运行。如果机器意外重启或应用程序崩溃，最好消除需要用户登录的要求。\n\
  \n### 使用 NSSM 工具\n\n免费工具 NSSM（Non-Sucking Service Manager）（可在 http://nssm.cc/ 获取）具有一系列管理服务的功能。其中之一是将任何应用程序安装为服务，如下面的截图所示：\n\
  \n![](img/52c05b53a56abd53584e4fed738ed509_131_0.png)\n\nDartBlog 服务已安装并设置为自动启动，并在\
  \ Local System 账户下运行：\n\n![](img/52c05b53a56abd53584e4fed738ed509_131_1.png)\n\n\
  请注意，服务在首次安装时处于停止状态。根据应用程序的功能，服务将需要在适当的用户账户下运行，例如写入文件或执行其他操作。\n\n\n\n\n### 使用 Microsoft\
  \ 解决方案\n\n一些系统管理员如果使用更官方的基于 Microsoft 的解决方案，可能会更满意。\n\n作为替代方案，Microsoft 提供了一个名为\
  \ srvany 的工具，它是一个用于启动其他应用程序的服务。这是一个较老的工具（可追溯到 NT4 Resource Kit），但常用于此目的。有关更多信息，请参阅\
  \ https://support.microsoft.com/en-us/kb/137890。\n\n### 负载测试\n\n在达到应用程序的极限之前很久就了解其极限是很好的。HttpClientRequest\
  \ 函数可用于创建对博客服务器的请求，HttpClientResponse 函数可用于接收来自博客服务器的传入数据。\n\n将检查 statusCode 属性，以确保页面请求已由服务器成功处理。\n\
  \n### 构建一个简单的负载工具\n\n博客服务器的一个简单基准是提供 1000 个文件所需的时间。getUrl 方法通过第一个 then 子句触发实际请求，关闭对服务器的请求。接下来的\
  \ then 子句处理来自服务器的实际响应。\n\n此方法可用于监控实时网站，如果收到 HttpStatus.OK 以外的状态，或许可以触发通知：\n\n```\n\
  import 'dart:io';\n\nmain() {\n    print(\"Starting...\");\n\n    var url = \"http://127.0.0.1:8080/index.html\"\
  ;\n    var hc = new HttpClient();\n    var watch = new Stopwatch();\n    int attemptedRequests\
  \ = 1000;\n\n    print(\"Starting testing...\");\n    watch.start();\n\n    for\
  \ (int i=0;i<attemptedRequests;i++)\n    {\n        hc.getUrl(Uri.parse(url))\n\
  \            .then((HttpClientRequest request) => request.close())\n           \
  \ .then((HttpClientResponse response) {\n                if (response.statusCode==HttpStatus.OK)\n\
  \                    print(\"$i, ${response.statusCode}, ${watch.elapsed.inMilliseconds}\"\
  );\n            });\n    }\n}\n```\n\nStopwatch 类可用于测量所花费的时间，并通过 print 语句报告到标准输出。由于响应是异步到达的，因此在每个响应之后打印状态。请求编号、状态码和经过的时间以逗号分隔打印，以便数据可以轻松地在电子表格应用程序中处理。\n\
  \n尝试在循环结束后直接放置一个 print 语句，您会看到在收到服务器的第一个响应之前（或之后不久）打印运行。\n\n在我普通的 Linux 笔记本电脑上，服务器能够在\
  \ 3.8 秒内提供 index.html 2000 次——还不错！尝试试验请求数量；但是，您很可能会遇到打开文件的限制，因为这个简单的基准测试会同时发出许多请求。\n\
  \n### 总结\n\n我们看到了 dart:io 包如何帮助非常快速地构建 HTTP 服务器，以及框架如何使这变得更加容易。通过对请求字符串进行一些简单的处理，我们可以做的不仅仅是从文件系统平面地提供文件，例如在首页上提供最近的条目。\n\
  \n脱离浏览器的自由允许操作文件系统。尽管不在 Web 上，但仍然对 HTTP 操作提供了良好的支持，我们用它来测试服务器的性能。Dart 服务器应用程序可以很容易地以标准方式安装在行业标准的主机操作系统上。\n\
  \n我们的博客服务器有了一个良好的开端。为了进步，它需要为作者、读者以及互联网上越来越多的智能网络爬虫和机器人做更多的事情。我们将提供一个编辑器来创建帖子，缓存请求以更快地提供页面，并以其他数据格式公开帖子。\n"
- "## 6 博客服务器高级\n\n> 我鼓励人们写博客的一个原因是，写作行为会扩展你可用的词汇量，并磨练出新的声音。\n>\n> - 赛斯·戈丁\n\n博客（“web\
  \ logs”一词的缩写形式）从简单的个人主页发展而来，使休闲用户能够更快地将内容上线。它们还处理了一些元信息和发布工作，使内容能够在互联网上传播，并被机器和人类消费者找到。\n\
  \n在服务器端，Dart 对文件系统有更大的访问权限，并且不受浏览器功能的限制。本章在向博客服务器添加更多功能时进一步探讨了这些特性。\n\n### 日志记录\n\
  \nApache 和 IIS 等 Web 服务器会跟踪访问者的 Web 浏览器使用情况，这有助于网站管理员了解访问者如何使用他们的网站以及有多少人查看页面。这种良好做法还有助于\
  \ Web 开发人员发现其网站中的问题，并帮助 Web 服务器软件的开发人员诊断问题。\n\n对于 Dart 应用程序中的通用日志记录，请查看 logging\
  \ 包，该包由 Dart 团队编写，可在 https://pub.dartlang.org/packages/logging 获取。\n\n### 写入文本文件\n\
  \n使用 dart:io，我们已经从文件系统读取文件，写入操作以类似的方式运行，如下所示：\n\n```\nimport 'dart:io';\n\nvoid\
  \ main() {\n  File myfile = new File(\"example.txt\");\n  myfile.writeAsStringSync(\"\
  Hello World!\");\n}\n```\n\n这演示了该函数的同步版本，writeAsString 是异步版本。\n\n打开本章项目中的 log.dart\
  \ 文件。为此，请查看以下代码片段：\n\n```\nvoid log(HttpRequest request) {\n  String entry = getLogEntry(request);\n\
  \  File logstore = new File(\"accesslog.txt\");\n  logstore.writeAsStringSync(entry,\
  \ mode: FileMode.APPEND);\n}\n```\n\n为了将 Web 访问请求记录到磁盘，日志条目必须是累积的，以便以命名参数的形式传递 APPEND\
  \ 模式来写入条目。\n\n### 提取请求信息\n\nHttpRequest 对象和 headers 属性向客户端公开请求的元数据。例如，headers 属性可以提供主机和端口号。user-agent\
  \ 标识发出请求时使用的程序或 Web 浏览器，如以下代码片段所示：\n\n```\nString getLogEntry(HttpRequest request)\
  \ {\n\n  //USER_AGENT\n  HttpHeaders headers = request.headers;\n  String reqUri\
  \ = \"${headers.host},${headers.port}${request.uri.toString()}\";\n  String entry\
  \ = \"  ${request.connectionInfo.remoteAddress.address}, $reqUri, ${headers[HttpHeaders.USER_AGENT]}\\\
  r\\n\";\n\n  return (new DateTime.now()).toString() + entry;\n}\n```\n\nremoteAddress\
  \ getter（IP 地址）可用于跟踪谁在浏览以及来自世界哪个地区。请求 index.html 博客的日志条目如下所示：\n\n```\n2015-05-17\
  \ 17:03:48.496 127.0.0.1, 127.0.0.1,8080/index.html, [Mozilla/5.0 (X11; CrOS x86_64\
  \ 6812.88.0) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/42.0.2311.153 Safari/537.36]\n\
  2015-05-17 17:03:49.177 127.0.0.1, 127.0.0.1,8080/6.png, [Mozilla/5.0 (X11; CrOS\
  \ x86_64 6812.88.0) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/42.0.2311.153\
  \ Safari/537.36]\n2015-05-14 18:52:45.690 127.0.0.1, 127.0.0.1,8080/favicon.ico,\
  \ [NetSurf/2.9 (Linux; x86_64)]\n```\n\n浏览器会请求用户浏览的页面以及其他资源，例如 favicon.ico（通常显示在\
  \ Web 浏览器 URL 栏或书签中的小方形图形）。\n\n### 博客编辑器\n\n博客将有一个管理部分，允许我们使用 Web 更新博客。这将通过地址 http://localhost:8080/admin\
  \ 访问，使用 admin 登录作为用户名，Password1 作为密码（两者都区分大小写）。\n\n> 永远永远不要在真实应用程序中使用如此简单的登录！\n\n\
  博客网站的管理部分将由 Web 表单组成。表单将使用 post 方法，因此博客服务器必须在 BlogServerApp 类的 _handleRequest 方法中正确检测到这一点以处理请求。这由请求对象的\
  \ method 属性公开，如以下代码片段所示：\n\n```\nif (request.method == 'POST') {\n    _handleFormPost(request);\n\
  }\n```\n\nPOST 请求仍然具有与之关联的 URI，允许决定如何处理输入。有关详细信息，让我们看一下以下代码片段：\n\n```\nvoid _handleFormPost(HttpRequest\
  \ request) {\n    if (request.uri.path == \"/login\") _performLogin(request);\n\
  \    if (request.uri.path == \"/add\") _performNewPost(request);\n}\n```\n\n登录过程和新博客文章的处理方式相当不同。\n\
  \n\n\n\n\n## 密码保护\n\n`/admin` 路径提供了一个 Web 表单，用于输入访问管理功能所需的用户名和密码，如下图所示：\n\n![](img/52c05b53a56abd53584e4fed738ed509_138_0.png)\n\
  \n系统会对用户名和密码进行验证，如果正确，将显示用于添加博客文章的表单。让我们看看下面的代码片段：\n\n```\nvoid _performLogin(HttpRequest\
  \ request) {\n    request.listen((List<int> buffer) {\n        String page = _checkAdminLogin(buffer);\n\
  \n        request.response\n            .statusCode = HttpStatus.OK\n          \
  \  .headers.set('Content-Type', 'text/html')\n            .write(page)\n       \
  \     .close();\n    }, onDone: () => request.response.close());\n}\n```\n\n`checkAdminLogin`\
  \ 方法负责检查登录信息，并返回 Web 表单或提示登录失败的消息。\n\n## 加密\n\n安全性是 Web 应用程序任意管理功能的重要特性。我们不希望将密码以明文形式存储在站点上！一种典型的密码存储方式是单向哈希，即使攻击者获得了哈希值，也很难破解密码。\n\
  \n`crypto` 包提供了一系列加密选项。博客将使用 SHA 算法来实现这一目的，如下所示：\n\n```\nString _checkAdminLogin(List<int>\
  \ buffer) {\n    var sha = new SHA256();\n    sha.add(buffer);\n    var digest =\
  \ sha.close();\n    String hex = CryptoUtils.bytesToHex(digest);\n    String page\
  \ = \"\";\n\n    if (hex != expectedHash) {\n        page = wrongPassword;\n   \
  \ } else {\n        page = addForm;\n    }\n\n    return page;\n}\n```\n\n方便的是，哈希输入是一个\
  \ `List<int>` 列表，而这正是从 Web 表单输入到请求的 `listen` 处理器中接收到的内容。SHA256 算法只需接收一段数据，然后调用 `close`\
  \ 方法返回计算出的哈希值。\n\n> SHA 代表安全哈希算法（Secure Hash Algorithm）。256 指的是字长。如果你曾在 Linux 系统上安装过软件包，那么你已经使用过\
  \ **SHA-256**。加密货币比特币的某些操作也使用 SHA。\n\n由于用户名和密码都必须正确，因此可以将表单的整个输入进行哈希，并与事先计算的值进行比较。为了便于存储，哈希值被转换为十六进制字符串，如下所示：\n\
  \n```\nconst String expectedHash = \"bdf252c8385e7c4ae76bca280acd8d44f85d7fdb561fbfb44f5749ff549ba2f6\"\
  ;\n```\n\n它作为常量存储在 `content.dart` 中。\n\n```\npieces\n    .forEach((dateItem) =>\n\
  \        data.add(dateItem.substring(dateItem.indexOf(\"=\") + 1));\n\n    data.forEach(\n\
  \        (encodedItem) => finalData.add(Uri.decodeQueryComponent(encodedItem)));\n\
  \n    return finalData;\n}\n```\n\n数据首先被拆分为来自每个控件的数据，然后使用 `Uri.decodeQueryComponent`\
  \ 组件将数据解码为原始数据，再返回给调用方。\n\n## 将数据保存到磁盘\n\n数据已被处理成可管理的列表，现在我们只需要构建一篇博客文章并将其保存到文件系统。这由\
  \ `BlogServerApp` 类的 `_performNewPost` 方法完成。让我们看看下面的代码片段：\n\n```\nList formData\
  \ = _getFormData(buffer);\nString newID = hostedBlog.getNextPostID();\nString filename\
  \ = \"$newID.txt\";\nvar p = path.join(\"content\", \"posts\");\np = path.join(p,\
  \ filename);\n\nFile postFile = new File(p);\nString post = BlogPost.createBlogPost(formData[0],\
  \ formData[1]);\npostFile.writeAsStringSync(post);\n```\n\n博客对象返回下一个可用的 PostId，用于文件名，并使用\
  \ `path` 包中的 `path.join` 构建完整路径。`BlogPost` 类上的 `createBlogPost` 静态方法用于按照定义好的格式添加附加数据。然后使用同步写入函数将其写入构建好的路径。\n\
  \n## 提供默认图片\n\n这个版本的添加表单不允许用户设置图形文件，而每篇文章都需要一个图形文件。如果博客文章 ID 是 8，那么会请求 `8.png`。为了不加载空文件，将加载默认图片（`default.png`）。让我们看看下面的截图：\n\
  \n![](img/52c05b53a56abd53584e4fed738ed509_142_0.png)\n\n如果在文件系统中找不到该文件（例如虚构的 `1234.png`\
  \ 图片！），则会加载并提供 `6.png` 作为替代，如下面的代码片段所示：\n\n```\nFile getBlogImage(int index) {\n\
  \    String path;\n    if (imgPaths.containsKey(index)) {\n        path = imgPaths[index];\n\
  \    } else {\n        path = _pathDefaultImg;\n    }\n\n    return new File(path);\n\
  }\n```\n\n这是通过检查 `imgPaths` 映射中是否存在请求的索引变量来实现的。如果键不在 `imgPaths` 映射中，则使用默认图片路径。\n\
  \n## 刷新博客\n\n博客服务器启动时会读取博客内容。由于新增博客文章后内容已经改变，必须使用名为 `initBlog` 的 `BlogServerApp`\
  \ 方法刷新此列表，如下所示：\n\n```csharp\ninitBlog() async {\n    _cache = {};\n    IDs = new\
  \ List<int>();\n    postPaths = new Map<int, String>();\n    imgPaths = new Map<int,\
  \ String>();\n    await _loadPostList();\n    _loadImgList();\n}\n```\n\n`BlogServerApp`\
  \ 和 `_performNewPost` 方法会在提供新文章之前调用 `initBlog`，如下所示：\n\n```csharp\nhostedBlog.initBlog();\n\
  \nreq.response\n  ..statusCode = HttpStatus.OK\n  ..headers.set('Content-Type',\
  \ 'text/html')\n  ..redirect(new Uri(path: \"post$newID.html\"))\n  ..close();\n\
  ```\n\n博客重新初始化后，应用程序会将新的博客文章作为单个页面提供给用户。\n\n## 缓存\n\n第一版 Web 服务器提供内容的方式效率相当低——我希望你已经注意到了！每次\
  \ GET 请求都会从磁盘读取博客源文件并进行处理。为了提高效率，我们可以在 `Blog` 类中添加一个 Map 字段。让我们看看下面的代码片段以了解更多信息：\n\
  \n```csharp\nBlogPost getBlogPost(int index) {\n  if (!_cache.containsKey(index))\
  \ {\n    _cache[index] = new BlogPost(postPaths[index], index);\n  }\n  return _cache[index];\n\
  }\n```\n\n该 Map 对象以博客索引为键，以生成的博客文章为值。此缓存保存在内存中，因此如果博客服务器应用程序停止并重新启动，新的请求不会一开始就从缓存中获取。\n\
  \n## 鸡的事实\n\n17/05/2015\n\nLorem ipsum dolor sit amet, consectetur adipiscing elit,\
  \ sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad\
  \ minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea\
  \ commodo consequat. Duis aute irure dolor in reprehenderit in voluptate velit esse\
  \ cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non\
  \ proident, sunt in culpa qui officia deserunt mollit anim id est laborum.\n\n永久链接\n\
  \n返回文件夹并将 `7.txt` 文件移出 `posts` 文件夹。再次刷新 Web 浏览器，关于鸡的事实的最新文章将会消失。\n\n## 生成 XML feed\n\
  \n为了便于博客读者搜索和聚合，博客需要生成 RSS feed。RSS 是一种 XML 规范，它以指定格式将博客文章列为独立的条目，便于处理。\n\n> 20\
  \ 世纪 90 年代末，人们曾多次尝试创建 Web 聚合格式。来自 Netscape 的 Dan Libby 和 Ramanathan V. Guha 于 1999\
  \ 年创建了 RDF 站点摘要格式，用于 My.Netscape.Com 门户。RDF 规范经过不断完善，最终演变为 RSS。\n> 与之竞争的（在我看来更优越的！）feed\
  \ 格式是 Atom。Atom 是为了修复 RSS 的缺陷而开发的，但并未在简单的 RSS 和用于更高级应用的 Web 服务中获得太多关注。\n> 除了博客和新闻出版物，RSS\
  \ 也已成为播客及其支持的客户端和工具的标准格式。\n> 完整规范见 https://validator.w3.org/feed/docs/rss2.html。\n\
  \n\n\n\n## 博客服务器高级功能\n\n为了生成博客的提要，我们可以轻松遍历帖子，因为我们已经有了一个 ID 列表。为了生成有效的 XML 提要，将使用\
  \ `xml` 包。该包不属于 SDK，而是一个开源库，它已成为 Dart 中用于 XML 创建和处理的热门选择。SDK 曾经包含一个 XML 处理包，但 `xml`\
  \ 包改进得如此之快，以至于将其作为标准包更有意义。让我们看看下面的代码片段以了解更多信息：\n\n```dart\nString getRSSFeed() {\n\
  \  var RssXb = new XmlBuilder();\n  RssXb.processing('xml', version: '1.0');\n\n\
  \  RssXb.element('rss', attributes: {'version': '1.0'}, nest: () {\n    RssXb.element('channel',\
  \ nest: () {\n      IDs.forEach((int postID) {\n        BlogPost post = getBlogPost(postID);\n\
  \        RssXb.element('item', nest: () {\n          RssXb.element('pubDate', nest:\
  \ () {\n            RssXb.text(post._date);\n          });\n          RssXb.element('title',\
  \ nest: () {\n            RssXb.text(post._title);\n          });\n          RssXb.element('link',\
  \ nest: () {\n            RssXb.text(\"http://127.0.0.1:8080/post${post._id}.html\"\
  );\n          });\n        }); //item\n      });\n    }); //channel\n  }); //rss\n\
  \n  var xml = RssXb.build();\n  return xml.toXmlString(pretty: true);\n}\n```\n\n\
  这里元素以嵌套方式添加，这反映了 RSS 的结构。一旦数据结构组装完成，`build` 方法会构建 XML 结构，最后将其转换为字符串。\n\n对于简单的 XML，直接拼接字符串很有诱惑力。然而，XML\
  \ 库可以提供诸如字符编码、验证和格式化等功能，这些功能使得稍微冗长的代码在较小的用例中也是值得的。\n\n由于 XML 既会被人类查看，也会被计算机查看，可选命名参数\
  \ `pretty` 被设置为 `true`，以输出格式规整的内容，如下例所示：\n\n```\n<?xml version=\"1.0\"?>\n<rss version=\"\
  1.0\">\n    <channel>\n        <item>\n            <pubDate>02/05/2015</pubDate>\n\
  \            <title>Lemur Facts</title>\n            <link>http://127.0.0.1:8080/post6.html</link>\n\
  \        </item>\n    ...\n```\n\nRSS 提要提供给 http://127.0.0.1:8080/feed.xml，并且可以在大多数\
  \ Web 浏览器中直接查看。\n\n## 提供 RSS 服务\n\nRSS 提要可以像任何其他文本文件一样提供，但需要设置响应头以帮助客户端应用程序。让我们看看下面的代码片段以了解更多信息：\n\
  \n```\nvoid _serveRSSFeed(HttpRequest request) {\n    request.response\n       \
  \ ..statusCode = HttpStatus.OK\n        ..headers.set('Content-Type', 'application/rss+xml')\n\
  \        ..write(hostedBlog.getRSSFeed())\n        ..close();\n}\n```\n\n内容类型设置为\
  \ `application/rss+xml`，这会触发浏览器中的 XML 显示。否则，浏览器可能会尝试将内容显示为 HTML。\n\n## JSON 提要的生成\n\
  \n提供 JSON（JavaScript 对象表示法）提要是一种比 XML 更有用的替代方案，因为它需要传输更少的数据，并且通常比处理 XPath 更简单、更快速。`getJSONFeed`\
  \ 方法是 `Blog` 类的一部分，如下所示：\n\n```\nString getJSONFeed() {\n    List posts = new List();\n\
  \    IDs.forEach((int postID) {\n        BlogPost post = getBlogPost(postID);\n\
  \        Map jsonPost = {};\n        jsonPost[\"id\"] = post._id;\n        jsonPost[\"\
  date\"] = post._date;\n        jsonPost[\"title\"] = post._title;\n        jsonPost[\"\
  url\"] = \"http://127.0.0.1:8080/post${post._id}.html\";\n        posts.add(jsonPost);\n\
  \    });\n    return JSON.encode(posts);\n}\n```\n\n此方法与 RSS 采取相同的方法，只是这次主要数据结构是一个列表，条目是该列表中的元素。可以使用\
  \ `dart:convert` 中的 `JSON.encode` 方法将列表转换为 JSON：\n\n```\n[\n  ...\n  {\"id\" : 6,\n\
  \    \"date\" : \"02/05/2015\",\n    \"title\" : \"Lemur Facts\",\n    \"url\" :\
  \ \"http://127.0.0.1:8080/post6.html\"},\n  ...\n]\n```\n\n> JSON 提要提供给 http://127.0.0.1:8080/feed.json，并且可以在大多数\
  \ Web 浏览器中直接查看。\n\n## 提供 JSON 服务\n\n提供 JSON 服务不仅需要指定正确的类型，还需要处理从另一个 Web 域消费此数据提要时的安全问题：\n\
  \n```\nvoid _serveJsonFile(HttpRequest request) {\n  request.response\n    ..statusCode\
  \ = HttpStatus.OK\n    ..headers.set('Content-Type', 'application/json')\n    ..headers.add(\"\
  Access-Control-Allow-Origin\", \"*\")\n    ..headers.add(\n      \"Access-Control-Allow-Methods\"\
  ,\n      \"POST,GET,DELETE,PUT,OPTIONS\")\n    ..write(hostedBlog.getJSONFeed())\n\
  \    ..close();\n}\n```\n\n内容类型设置为 `application/json`，这会触发浏览器中的 JSON 显示。访问控制（CORS）被设置为允许任何来源以及一组\
  \ HTTP 动词。\n\n> 跨源资源共享（CORS）是一种允许从其他 Web 域请求受限资源（如脚本）的技术。例如，新闻网站希望以 JSON 格式请求博客的头条新闻以进行显示。\n\
  > 默认情况下，资源只能从同一域加载。CORS 允许共享特定资源以及这些资源上的操作（HTTP 动词），如 GET、POST 等。因此，我们可能乐意共享头条新闻，但不乐意共享登录验证脚本。\n\
  \n## 消费 JSON 提要\n\nJSON 无疑已经成为现代 Web 数据格式，无论是生成还是消费都非常轻量。为了全面探索 JSON 功能，我们将暂时从服务器端转到客户端\
  \ Dart，以使用博客的 JSON 数据提要。为此，请查看以下代码片段：\n\n打开本章的示例项目 `BlogJsonClient`。这是一个简单的 Web\
  \ 项目，充当博客服务器 JSON 提要的客户端。要让此客户端运行，博客服务器也必须正在运行。\n\n```\nvoid main() {\n  var jsonSrc\
  \ = \"http://127.0.0.1:8080/feed.json\";\n  HttpRequest.getString(jsonSrc).then((String\
  \ data) {\n    List decoded = JSON.decode(data);\n    decoded.forEach((post) {\n\
  \      querySelector('#output').children.add(new LIElement()\n        ..append(new\
  \ AnchorElement()\n          ..href = post['url']\n          ..text = \"${post['date']}\
  \ ${post['title']}\");\n    }); //for\n  }); //then\n}\n```\n\n这里，`HttpRequest`\
  \ 类有一个静态方法，可以将远程资源作为 `Future<String>` 返回，并在 `then` 子句中异步处理。\n\n然后对 JSON 进行迭代，并将\
  \ `LI` 元素（列表项）添加到网页的 DOM 结构中。\n\n## 静态生成\n\nWeb 托管设施因提供商而异。运行程序和安装软件的能力并非普遍可用。随着在云上运行小型简单虚拟机的普及，网站的静态生成变得越来越流行。\n\
  \n其优势非常明显：无需维护软件或数据库，使系统非常安全，同时服务速度也非常快。不过，它并不适用于所有应用。博客是静态生成可能合理的场景之一。\n\n## 冻结网站\n\
  \n在本章的项目中，`bin` 文件夹里有一个 `staticgen.dart` 文件。这是一个独立程序，用于生成博客首页的静态 HTML 文件。请注意，`main`\
  \ 函数用 `async` 关键字标记，并且缺少 `void` 关键字。\n\n## 介绍 await 和 async 关键字\n\n`await` 和 `async`\
  \ 关键字是在 Dart 1.9.4 中引入的，目的是简化异步操作。考虑以下对返回 `Future` 的方法的调用：\n\n```\nobj.method().then(handlerFunction)\n\
  ```\n\n这在大多数情况下没问题，但如果事情变得更复杂，并且 `handlerFunction` 也返回一个 future 呢？\n\n```\nobj.method().then(handlerFunction).then(handlerFunction2);\n\
  ```\n\n事情已经开始变得复杂——调试不再简单直观。理想情况下，我们希望一次只处理链条的一部分，并在所需操作完成之前暂停语句的执行。这就是 `await`\
  \ 所允许的：\n\n```\nvar f1 = await obj.aMethod();\nvar result = await f1.aMethod();\n\
  ```\n\n使用 `await` 调用的函数和方法返回 `Future`。它们还必须在方法头中声明为 `async`，使用 `await` 调用的函数也是如此：\n\
  \n```\nclass Foo{\n  Future<int> aMethod() async {\n    return await aFunction();\n\
  \  }\n}\n```\n\n\nasync 和 await 关键字简化了代码，尤其是在使用内联函数时，它们也让异步代码更加可读。\n\n## 连接文件路径\n\
  \n大多数计算机用户都遇到过 Unix 风格路径（/home/davymitchell/）和 Windows 操作系统路径（c:\\users\\davymitchell\\\
  ）中使用正斜杠和反斜杠的问题：\n\n```\nvar contPath = path.join( Directory.current.path, \"content\"\
  \ );\nvar srcPath = path.join(contPath, \"posts\");\nvar imgPath = path.join(contPath,\
  \ \"img\");\n```\n\npath 包提供了一个跨平台方法 join，用于连接文件夹和文件名。\n\n## 创建输出文件夹\n\n输出文件将放在当前路径下名为\
  \ staticoutput 的文件夹中。会检查该文件夹是否存在，如果不存在，则创建它。让我们看看下面的代码片段：\n\n```\nmain() async {\n\
  \    var contPath = path.join( Directory.current.path, \"content\" );\n    var srcPath\
  \ = path.join(contPath, \"posts\");\n    var imgPath = path.join(contPath, \"img\"\
  );\n\n    Blog staticBlog = new Blog(srcPath, imgPath);\n    await staticBlog.initBlog();\n\
  \    print(Directory.current);\n\n    // Create output directory if it does not\
  \ exist.\n    var outDir = new Directory('staticoutput');\n    var staticPath =\
  \ path.join(Directory.current.path, 'staticoutput');\n    if (!await outDir.exists())\
  \ {\n        outDir.create();\n    }\n\n    // Write out main page.\n    var outPath\
  \ = path.join(staticPath, \"index.html\");\n    var pageContent = staticBlog.getFrontPage();\n\
  \    File indexPage = new File(outPath);\n    await indexPage.writeAsString(pageContent,\
  \ mode: FileMode.WRITE);\n\n    // Return success exit code.\n    exit(0);\n}\n\
  ```\n\n在程序继续执行之前，会等待异步方法的结果。\n\n## 生成首页\n\n在第 5 章“博客服务器”中，有一个从构造函数调用的 Blog Server\
  \ 版本 initBlog。它已移动到文章对象创建的初始化调用中，以便可以使用 await。标记为 async 的方法和函数不能从构造函数调用。使用 async\
  \ 简化了 _loadPostList 方法，因为嵌套大大减少，如下面的代码片段所示：\n\n```\n_loadPostList() async {\n  print(\"\
  Loading from $_pathPosts\");\n  Directory blogContent = new Directory(_pathPosts);\n\
  \n  var postsSrc = await blogContent.list();\n\n  await postsSrc.forEach((File f)\
  \ {\n    String postFilename = path.basenameWithoutExtension(f.path);\n    int id\
  \ = int.parse(postFilename);\n    IDs.add(id);\n    postPaths[id] = f.path;\n  });\n\
  \n  IDs.sort();\n  IDs = IDs.reversed.toList();\n}\n```\n\n以前，文章是异步加载和设置博客的。\n\n\
  > 如果你在寻找有关 Dart 编程的好博客，可以从 http://www.dartosphere.org/ 开始，这是一个博客聚合器或行星风格网站，提供来自各种来源的新闻和资源。\n\
  \n## 编写静态版本\n\n既然页面内容可以在确定的时间获取，就可以使用 writeAsString 方法将其写入磁盘。FileMode.WRITE 权限将覆盖任何现有文件，因此适合更新。让我们看看下面的代码片段：\n\
  \n```\nvar outPath = path.join(staticPath, \"index.html\");\nvar pageContent = staticBlog.getFrontPage();\n\
  File indexPage = new File(outPath);\nindexPage.writeAsStringSync(pageContent, mode:FileMode.WRITE);\n\
  \nexit(0);\n```\n\n最后一行在程序完成时向操作系统返回退出代码，0 表示成功的约定。此函数不会等待任何挂起的操作，会立即关闭程序。\n\n##\
  \ 重新审视负载测试\n\n最初的负载测试应用程序相当有限，虽然有用，但它不能给出真实的全貌，因为这么多请求同时抛向服务器应用程序，而没有等待响应。\n\n###\
  \ 更新负载测试器\n\n负载测试应用程序的新版本将进行一次 HTTP 调用并等待结果，然后再进行下一次调用。这发生在 main.dart 源文件中。请注意，main\
  \ 函数本身现在被标记为 async。await 命令用于 main 函数的调用循环中，如下所示：\n\n```\nmain() async {\n  print(\"\
  Starting...\");\n\n  var url = \"http://127.0.0.1:8080/index.html\";\n  var hc =\
  \ new HttpClient();\n  var watch = new Stopwatch();\n  int attemptedRequests = 200;\n\
  \n  print(\"Starting testing...\");\n  watch.start();\n\n  for (int i = 0; i < attemptedRequests;\
  \ i++) {\n    await callWebPage(hc, url, i, watch);\n  }\n\n  watch.stop();\n  print(\"\
  ${watch.elapsed.inMilliseconds}\");\n}\n```\n\ncallWebPage 方法也需要标记为 async，因为将使用两次\
  \ await：\n\n```\ncallWebPage(HttpClient webClient, String targetURL, int requestNumber,\n\
  \    Stopwatch watch) async {\n  HttpClientRequest request;\n  HttpClientResponse\
  \ response;\n  request = await webClient.getUrl(Uri.parse(targetURL));\n  response\
  \ = await request.close();\n  print(\"${requestNumber}, ${response.statusCode},\
  \ ${watch.elapsed.inMilliseconds}\");\n}\n```\n\n在将输出处理到屏幕之前，会等待这两个持续时间未知的操作：URL\
  \ 获取和响应关闭。\n\n## 总结\n\n服务器端开放了文件系统的许多功能，可以直接从应用程序保存内容，为 Web 服务器提供内容以及元数据（例如日志文件）。\n\
  \nDart 具备在 Web 客户端和服务器上创建、提供和消费现代 Web 格式的功能。我们看到了如何快速构建一个专门的 Web 服务器。你现在非常熟悉如何使用核心\
  \ SDK 之外的 Dart 包来实现重要的应用功能。\n\n异步设施允许编写响应式应用程序，await/async 帮助我们编写清晰的代码，并将异步任务组合在一起，以便我们以同步方式操作它们。\n\
  \n我们的下一个也是最大的项目将是端到端的 Dart。在本章中，我们探讨了如何在服务器方面进行构建。我们将不再使用本地文件系统，而是连接数据库和 Web 服务来构建实时显示。\n"
- "## 实时数据收集\n\n> “没有数据就进行理论推导是一个重大错误。”\n> \n> —— 夏洛克·福尔摩斯\n\nIT 界的大多数人都熟悉**垃圾进，垃圾出（GIGO）**这个说法。如果错误的数据进入系统，输出也将是错误的。应该始终使用好的数据源，并且系统需要足够健壮，以处理用户或其他系统的“垃圾”。规范和标准可以提供帮助，但总会有例外和灰色地带。\n\
  \n在我的职业生涯中，听过最令人困惑的话之一来自一位遇到软件数据输入问题的客户：“我们有我们自己的 ISO 标准”！\n\n### 启动地震监测系统\n\n本书接下来的系列章节将围绕一个单一项目，从多个不同角度展开。我们将跟踪、记录和展示一个包含我们居住星球地震信息的真实世界数据源。\n\
  \n这个项目相当宏大，过程中会涉及大量 Dart 代码。令人惊讶的是，地壳中有如此多的活动——也许你可以利用我们迄今为止项目的输出，写一篇关于地震学的博客或演示文稿！\n\
  \n本节的项目名为 `QuakeMonitorFS`——请确保选择名称以 FS 结尾而不是 DB 的项目。FS 版本保存到文件系统，而 DB 版本保存到数据库。我们将首先查看文件系统存储版本，然后再看数据库版本。\n\
  \n### 介绍数据源\n\n该应用程序的数据源是由美国地质调查局（USGS）地震灾害计划提供的 Web 服务。他们的网站 http://earthquake.usgs.gov/\
  \ 上有大量信息，包括来自世界各地持续更新的数据源。\n\n对 Dart 程序员最感兴趣的数据源采用一种特定的 JSON 格式。\n\n### 探索 GeoJSON\
  \ 格式\n\nGeoJSON 是一种用于记录地理数据结构的格式，它支持几何定义，例如点和多边形。例如，地震震中的位置（点）和受影响区域（多边形）。GeoJSON\
  \ 的一部分如下所示：\n\n```\n{\n  \"type\":\"Point\",\n  \"coordinates\":[122.3818333,45.0686667,12.9]\n\
  },\n\"id\":\"uw61022191\"\n```\n\n> 前面的示例是报告过去一小时所有地震的数据源（http://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_hour.geojson）中的一小段摘录。花点时间查看此数据源，感受一下这种格式包含的数据类型。\n\
  \n为了启动这个项目，我们将创建一个数据监控应用程序，用于记录来自此数据源的信息。由于该程序将长时间运行，我们需要添加日志记录功能，以确保其平稳运行。\n\n\
  ### 获取并记录数据\n\nbin/main.dart 中的 main 函数将使用 DataMonitor 类的实例提示每分钟下载数据。一天有 1440 分钟，数据文件平均大小约为\
  \ 2k，因此每天 3 兆字节的磁盘空间是可行的：\n\n```\nmain() async {\n  setupLogging();\n\n  DataMonitor\
  \ quakeMon = new DataMonitor();\n```\n\n\n```dart\nDuration updateInterval = new\
  \ Duration(seconds: 60);\n\n    new Timer.periodic(updateInterval, quakeMon.fetchData);\n\
  }\n```\n\n主函数被标记为 async，这表明实现将使用 await 特性。对 setupLogging 的调用将在本章下一节中介绍。\n\nDataMonitor\
  \ 的实现在 lib/quakemonitorfs.dart 中，其中包含关键方法 fetchData：\n\n```dart\nfetchData(Timer\
  \ timerFetch) async {\n    try {\n        var outDir = new Directory('data');\n\
  \        if (!await outDir.exists()) {\n            await outDir.create();\n   \
  \     }\n\n        log.info(\"Calling web service...\");\n        HttpClientRequest\
  \ req = await geoClient.getUrl(Uri.parse(dataUrl));\n        HttpClientResponse\
  \ resp = await req.close();\n        String latestFilePath = path.join('data', latestFilename);\n\
  \        await resp.pipe(new File(latestFilePath).openWrite());\n        String\
  \ fileContents = await new File(latestFilePath).readAsString();\n\n        var dataset\
  \ = await JSON.decode(fileContents);\n\n        int newId = int.parse(dataset['metadata']['generated'].toString());\n\
  \n        if (idPreviousFetch != newId) {\n            idPreviousFetch = newId;\n\
  \            var f = new File(path.join('data', '${newId}.txt'));\n            await\
  \ f.writeAsString(dataset.toString());\n            log.fine(\"Saved $newId - ${dataset.toString()}\"\
  );\n        }\n    } catch (exception, stacktrace) {\n        log.severe(\"Exception\
  \ fetching JSON.\", exception, stacktrace);\n    }\n}\n```\n\n几乎每一行都有一个 await！程序只需要每隔一分钟左右处理一次信息，因此它不需要响应式结构，更线性的方式就足够了，尽管代码仍然是异步的。\n\
  \n远程资源首先被处理，然后响应被关闭。返回的 JSON 字符串可以直接写入文件。完成后，fileContents 变量会填充来自文件的数据，然后由 JSON\
  \ 解析以将对象返回到 dataset。\n\n检查响应的 id 以防止重复保存相同的响应。请注意，生成的 id 可能不同，而内容相同。该 feed 更像是一个快照，而不是一个稳定的流。\n\
  \n数据使用获取的 id 作为文本（.txt）文件保存到 data 文件夹中。为了提供一些反馈，id 和 JSON 会通过对 log.fine 的调用写入日志文件。\n\
  \n## Logging\n\n我在早期软件项目中遇到了许多困难点，唯一能做的就是求助于日志记录，以弄清楚发生了什么。不久后我开始喜欢上日志记录，并在开始新项目时将其作为重点。它是帮助你测试的另一双眼睛——尤其是在你不查看时，例如在持续运行数据收集器时。\n\
  \nDart 包 logging 提供了日志记录功能，但它对输出没有做任何有用的事情，或者换句话说，日志存储的处理完全由应用程序负责。\n\n### A simple\
  \ example of logging\n\n打开本章的 Logging 文件夹，它是一个独立的示例，包含各种日志记录：\n\n```dart\nLogger\
  \ log = new Logger('DataMonitor');\n\nLogger.root.level = Level.ALL;\nLogger.root.onRecord.listen((LogRecord\
  \ rec) {\n  String logMessage = '${rec.level.name}\\t${rec.time}\\t${rec.message}';\n\
  \  String exceptionMessage = '';\n  if (rec.error != null) {\n    print(\"$logMessage\
  \ \\t${rec.error.message}\");\n    print(exceptionMessage);\n  }\n});\n```\n\n```dart\n\
  log = new Logger('DataMonitor');\nLogger.root.level = Level.ALL;\nLogger.root.onRecord.listen((LogRecord\
  \ rec) {\n  var entry = '${rec.level.name}\\t${rec.time}\\t\\t${rec.message}\\n';\n\
  \  File logStore = new File(\"datamonlog.txt\");\n  logStore.writeAsStringSync(entry,\
  \ mode: FileMode.APPEND);\n});\nlog.info('Earthquake Monitor - Data fetcher. Starting...');\n\
  }\n```\n\n日志记录在 bin/main.dart 中设置，输出附加到文本文件。请注意，这不会保存到 data 子文件夹中，因为它可能会与所有数据文件一起丢失。\n\
  \n在 DataMonitor 类的 fetchData 方法中，Logger 对象在构造函数中设置，关键事件将被记录。使用不同的日志级别（info、fine、severe\
  \ 等），这将允许程序的操作员将日志级别调整到所需级别。\n\n## Saving to the database\n\n数据收集应用程序目前写入文件系统。虽然这对于归档很有用，但它使得访问和查询任何类型的分析或显示变得困难且缓慢。\n\
  \n![](img/52c05b53a56abd53584e4fed738ed509_162_0.png)\n\n> 如果你对数据库不熟悉，这里有一个非常快速的介绍！数据库是以结构化形式存储的数据集合。这些数据通过数据库管理系统进行访问和管理。你可能听说过\
  \ SQL Server、MySQL、Hadoop 或 Oracle。\n>\n> 数据库通常使用一种称为 SQL 的语言进行访问，以从数据库读取和写入记录。数据通常组织成表，每个表由记录组成。每个表有一组定义为数据类型的列——这类似于编程语言中的变量。SQL\
  \ 在排序、分组和处理数据集方面很强。\n>\n> SQL 可以以多种形式存储在数据库中，最常见的是存储过程，可以添加/删除和更新数据，并执行一些处理。\n>\n\
  > 连接到数据库几乎总是需要登录，并且可能在远程计算机上。这有时被称为连接字符串。它类似于网络连接。\n\n### Installing a database\
  \ system\n\n有许多数据库系统可用，你可能已经有自己喜欢的了！就本书而言，所使用的数据库将是 PostgreSQL，因为它是免费的、开源的，并且适用于所有主要操作系统。而且它是最容易安装的数据库之一，因此我们可以花更多时间编写\
  \ Dart。\n\nPostgreSQL 是一个功能强大的开源对象关系数据库系统，拥有 15 年的历史。\n\n它是一款一流的产品，被 Yahoo 和联合国等行业和政府的大公司使用。它严格遵守\
  \ SQL 语言标准，可以处理最大尺寸达 32 TB 的数据库表。\n\nPostgreSQL 可以从 http://www.postgresql.org/ 下载，适用于\
  \ Mac、Linux 和 Windows，并且可通过大多数 Linux 发行版的软件包管理器获得。此外，在 PostgreSQL 下载页面上，还有许多虚拟机镜像可供下载并直接使用。\n\
  \n本书的示例假设数据库安装与运行软件的机器相同。调整连接字符串将允许连接到远程机器。\n\n### Using PostgreSQL from Dart\n\n\
  包 postgresql 提供了非常强大的 PostgreSQL 数据库驱动程序，可从 Dart 程序中使用。它是一个备受推崇的第三方包，并得到了 Dart 团队的贡献。\n\
  \n本节的项目称为 QuakeMonitorDB，其获取方式与文件系统版本相同。\n\n**File** 菜单有 **Add Server...** 选项，可在其中建立到数据库服务器的连接。\n\
  \n![](img/52c05b53a56abd53584e4fed738ed509_165_0.png)\n\n## Live Data Collection\n\
  \n一旦连接可用，就可以在左侧窗格中的树中选择它。要向数据库发出命令，请从该服务器的数据库列表中选择它，并从 Tools 菜单中选择 Query tool...。\n\
  \n![](img/52c05b53a56abd53584e4fed738ed509_166_0.png)\n\n查询工具允许对已连接的数据库运行 SQL 查询，并显示输出和结果。输入查询，例如\
  \ select 'Dart is awesome!'; 然后点击 Query 菜单中的 Execute。\n\n如果你愿意，PostgreSQL 还有一个功能强大的内置命令行客户端，称为\
  \ psql。\n\n\n\n\n\n## 创建数据库和登录\n\n应用程序的数据库将被称为 `quakedata`。使用的登录名为 `webquakeuser`，密码为\
  \ `Coco99nut`（区分大小写且不带引号）：\n\n```\nCREATE DATABASE quakedata\n    WITH OWNER = postgres\n\
  \        ENCODING = 'UTF8'\n        TABLESPACE = pg_default\n        LC_COLLATE\
  \ = 'en_GB.UTF-8'\n        LC_CTYPE = 'en_GB.UTF-8'\n        CONNECTION LIMIT =\
  \ -1;\n```\n\n创建数据库的 SQL 脚本名为 `CreateDatabase.sql`，可在本章示例代码的 SQL 子文件夹中找到：\n\n```\n\
  CREATE ROLE webquakeuser LOGIN\n    ENCRYPTED PASSWORD 'md504a29d543c1492922e76af320cae3190'\n\
  \    SUPERUSER INHERIT CREATEDB NOCREATEROLE NOREPLICATION;\n```\n\n创建用户的 SQL 脚本名为\
  \ `CreateUser.sql`。\n\n## 定义表\n\n主表将是对 JSON 字段的简单存储，加上两个元数据字段，其创建 SQL 可在 `CreateTable.sql`\
  \ 中找到：\n\n```\nCREATE TABLE dm_quakefeed (\n    quake_id serial PRIMARY KEY,\n \
  \   geojson text NOT NULL,\n    modified_date TIMESTAMP default CURRENT_TIMESTAMP\n\
  );\n```\n\n## 实时数据采集\n\n此 SQL 定义了一个包含三个字段的表。`quake_id` 字段将作为每条记录的唯一标识符，`geojson`\
  \ 将存储从服务检索到的数据，而 `modified_date` 将记录插入数据库的时间。让我们看一下以下截图：\n\n![](img/52c05b53a56abd53584e4fed738ed509_168_0.png)\n\
  \n空数据库现已配置完成，准备连接到 Dart 以保存数据。表可在左侧面板的树形结构中找到 **quakedata | Schemas | public | Tables。**\n\
  \n## 插入数据\n\n第一步是创建连接字符串以连接到 PostgreSQL 服务器。类 `DaoQuake` 在 `lib/quakedao.dart` 中处理数据库访问。这由修订后的\
  \ `DataMonitor` 类的 `fetchData` 方法调用，如下所示：\n\n```\nif (idPreviousFetch != newId)\
  \ {\n    idPreviousFetch = newId;\n\n    //Save to database.\n    await daoGeoJson.storeJson(dataset.toString());\n\
  \n    log.fine(\"Saved to db $newId - ${dataset.toString()}\");\n}\n```\n\ndaoGeoJson\
  \ 实例处理数据库交互。其余的数据获取，例如访问 Web 服务，与基于文件版本相同：\n\n```\nstoreJson(String jsonString)\
  \ async {\nvar dbConn;\ntry {\n    dbConn = await connect(uri);\n    await dbConn.execute(\n\
  \        'insert into dm_quakefeed (geojson) values (@geojson)', {\n        'geojson':\
  \ jsonString\n    });\n} catch (exception, stacktrace) {\n    log.severe(\"Exception\
  \ storing JSON.\", exception, stacktrace);\n    print(exception);\n    print(stacktrace);\n\
  } finally {\n    dbConn.close();\n}\n}\n```\n\n首先需要注意的是，实现被包裹在 try{}、catch{} 和 finally{}\
  \ 中。这是因为我们希望即使在错误条件下也能获得稳健的解决方案。数据库会失败，连接也会失败，因此插入可能不会进行，所以我们捕获异常。一旦 dbConn 对象连接到数据库服务器，它就会运行\
  \ SQL 语句来存储 jsonString。\n\n应用程序还需要管理系统资源，因此我们始终希望关闭数据库连接，就像内存和磁盘空间一样，它们是有限资源。finally\
  \ 子句总是在 try、catch 和 except 块完成后执行：\n\n```\nString uri = 'postgres://webquakeuser:Coco99nut@localhost:5432/quakedata';\n\
  ```\n\n数据库连接在 uri 连接字符串中定义，它标识服务器、用户名、密码和数据库。通常这会存储在配置文件中。\n\n## 运行程序\n\n程序运行几分钟后，数据将开始在数据库中累积。这可以在\
  \ pgAdmin 的 SQL 编辑器中查看，可通过单击工具栏上的 SQL 图标运行：\n\n```\nselect * from dm_quakefeed;\n\
  ```\n\n## 实时数据采集\n\n此简单的 `select` 语句将显示表内容：\n\n![](img/52c05b53a56abd53584e4fed738ed509_170_0.png)\n\
  \n## 维护数据库\n\n设置数据库并编写相应的应用程序只是运行数据库的一小部分。就像花园一样，它们需要照料和修剪才能获得最佳效果。\n\n我们将研究为数据监控应用程序编写维护脚本，以报告数据并清除数据。\n\
  \n在编辑器中打开 `bin/maintenance.dart` 文件。\n\n## 管理命令行参数\n\n为了在这些任务之间切换，将使用命令行参数。Dart\
  \ `main` 函数接收其参数的字符串列表：\n\n```\n```dart\nimport 'package:QuakeMonitorDB/quakedao.dart';\n\
  \nmain(List<String> arguments) {\n  if (arguments.length == 0 || arguments.length\
  \ > 1) {\n    print(\"Please use either -info or -delete.\");\n    return 0;\n \
  \ }\n\n  if (arguments[0] == \"-info\") {\n    var daoGeoJson = new DaoQuake();\n\
  \    daoGeoJson.displayInfo();\n  } else if (arguments[0] == \"-delete\") {\n  \
  \  var daoGeoJson = new DaoQuake();\n    daoGeoJson.deleteRecords();\n  }\n}\n```\n\
  ```\n\n结果集从 PostgreSQL 返回并转换为列表。返回的每条记录都是该记录列值的列表：\n\n```\nCount  : 269\nMinDate\
  \ : 2015-05-26 00:00:00.000\nMaxDate : 2015-05-27 00:00:00.000\n```\n\n在此实例中，我们返回了一条记录（result[0]），其中包含三个列（通过索引访问）的列表，其中包含我们需要的信息。\n\
  \n## 删除数据\n\n此非常严重但有用的操作实现起来相当简单：\n\n```\ndeleteRecords() async {\n  var dbConn;\n\
  \  try {\n    dbConn = await connect(uri);\n\n    var query = \"delete from dm_quakefeed\"\
  ;\n    await dbConn.execute(query);\n  } catch (exception, stacktrace) {\n    log.severe(\"\
  Exception getting info.\", exception, stacktrace);\n    print(exception);\n  } finally\
  \ {\n    dbConn.close();\n  }\n}\n```\n\n如果在此运行后使用 -info 选项重新运行维护程序，结果如下所示，其中 null\
  \ 表示没有可用数据：\n\n```\nCount  : 0\nMinDate : null\nMaxDate : null\n```\n\n请务必非常、非常小心地使用它！\n\
  \n## 观察 Dart VM 内部\n\n如果你在启动 Dart 项目时密切关注输出窗口，你会注意到对 Observatory 的引用。此工具（是 Dart\
  \ SDK 的一部分）允许开发人员查看正在运行的 Dart 虚拟机内部，并分析正在进行的活动。这对于了解应用程序正在做什么以及瓶颈所在非常有用。\n\n![](img/52c05b53a56abd53584e4fed738ed509_173_0.png)\n\
  \nObservatory 支持命令行应用程序和 Web 应用程序（Dart 版本，而不是编译为 JavaScript 的输出）在 Dartium 中运行。要启用它，只需传递众多\
  \ Observatory 命令行参数之一 — 请参阅 SDK 文档（https://www.dartlang.org/tools/dart-vm/）获取完整列表：\n\
  \n```\ndart --enable-vm-service bin/main.dart\n```\n\n使用 Observatory 启动 main.dart\
  \ 程序，并浏览地址 localhost:8181（请注意，此端口号可能会更改，但可以在启动命令参数 --enable-vm-service=<port>/<IP\
  \ address> 中指定）：\n\n```\nchromium.exe index.html\n```\n\n使用 Observatory 启动 index.html。将要输入到\
  \ Web 浏览器的地址将会显示：\n\n```\nObservatory listening on http://127.0.0.1:34935\n```\n\
  \nURL 可以在任何 Web 浏览器中打开，最重要的功能是刷新按钮，它会重新采样正在显示的数据。\n\n在等待数据监控收集数据时，花点时间探索 Dart VM\
  \ 在运行代码时的内部工作原理。\n\n## 单元测试\n\n如果你是测试驱动开发的倡导者，你可能有点担心我们到目前为止还没有编写任何单元测试。情况即将改变，因为我们将介绍\
  \ Dart 单元测试包，其名称简单地称为 test（你可能会在网上看到使用旧的 unittest 包的旧示例代码）。\n\n在本章的示例代码中，有一个名为 Unittest\
  \ 的子文件夹，其中包含 bin/main.dart 中的单元测试：\n\n```\nlibrary Unittestdemo.test;\n\nimport\
  \ 'package:test/test.dart';\n\nvoid main() {\n\n  test('HelloWorldTest', () {\n\
  \    expect(1+1, 2);\n  });\n\n}\n```\n\n这定义了一个名为 HelloWorldTest 的新测试，实际测试可以通过过去在函数中进行。测试结果可以使用\
  \ expect 方法进行验证。库包含大量匹配器来检查结果，例如 isResult、isList、isNull、isTrue 和 isNonPositive。\n\
  \n\n\n\n单元测试侧重于一次测试应用程序的一小部分。测试在代码中定义，以便可以轻松快速地运行。为了确保它们快速运行，真正的单元测试不应使用外部资源（如网络或文件）。\n\
  \n要使应用程序背后的代码易于进行单元测试，设计必须允许对象被隔离测试。例如，所有 IO 都可以包装到一个简单的类中，这样就可以编写一个使用 IO 类的假（或模拟）版本的单元测试。\n\
  \n这会影响设计，但确保代码在整个开发过程中都经过测试。测试甚至可以在开发开始之前编写。\n\n## 运行单元测试\n\n单元测试的运行方式与任何其他 Dart\
  \ 命令行程序一样，可以从您选择的 IDE/编辑器或从命令行运行。例如，从 Unittest 文件夹中，可以通过 `dart bin/main.dart` 运行测试：\n\
  \n```\n00:00 +0: HelloWorldTest\n00:00 +1: All tests passed!\n```\n\n测试运行器的默认输出包含颜色字符（您的\
  \ IDE 或 shell 可能不支持）：\n\n![](img/52c05b53a56abd53584e4fed738ed509_175_0.png)\n\n\
  ## 实时数据收集\n\n```dart\n  o = new GeoUpdate(sampleJson);\n});\ntest('Test 1', () =>\
  \ expect(o.features.length, equals(5)));\ntest('Test 2', () => expect(1, equals(1)));\n\
  });\n```\n\n在项目开发过程中，开发测试和实现通常是一个迭代的过程。如这组中的第二个测试所示，很容易放入一个占位测试。测试有助于确保代码的最终实现具有预先设计、松耦合，并且在更改时提供一种简单的方法来自动重新测试一系列功能。\n\
  \n对比一下：运行一组单元测试只需几秒钟即可覆盖许多测试用例，而运行一个完整的 Web 应用程序则需要几分钟，浏览页面、输入数据、检查结果，而且只覆盖了一个测试用例。\n\
  \n## 检查测试结果\n\n运行单元测试产生的结果显示所有测试都失败。这是预期的，因为我们还没有编写实现。\n\n我们不会以令人沮丧的方式结束本章！我们所做的是考虑设计，为对象定义了一些需求，并创建了一个测试套件来在我们创建解决方案时验证它。\n\
  \n## 小结\n\n严肃的应用程序需要健壮性，现在您将掌握 Dart 中的单元测试，以帮助快速生产高质量软件。我们还介绍了如何记录关键操作细节，并将其归类到正确的级别，以便长期监控系统。\n\
  \n将 Dart 连接到严肃的数据库对许多应用程序至关重要，您现在可以使用工业级数据库系统来实现这一点。您现在已经具备了连接到远程 Web 服务以收集真实数据的技能。\n\
  \n在下一章中，我们将探索数据库系统，包括将数据提取到我们的应用程序中，我们将挖掘这个不断更新的数据存储库，以填充传入数据的丰富数据网格视图，该视图将实时更新。\n"
- "## 实时数据与 Web 服务\n\n> > 数据是宝贵的东西，其寿命比系统本身更长久。\n> >\n> > ——蒂姆·伯纳斯-李\n\n如今，许多人很难想象，曾几何时，大多数个人和工作计算机并未连接到更广泛的网络。就在不久前，向口袋中的设备自发传输即时通知的网络流是不可想象的。\n\
  \n新闻源、流和更新是当今 Web 应用程序的标准。数据仅仅可访问或可发现是不够的。它必须触达用户，最好甚至在他们知道自己需要之前。\n\n### 释放数据\n\
  \n数据监视器收集的数据相当受困在数据库中，虽然 PostgreSQL 数据库系统在 pgAdmin 的 GUI 中有合理的显示，但网页会更美观，也更容易被更广泛的受众查看。\n\
  \n共享数据供客户端使用？我希望 JSON 能立即浮现在您的脑海中！项目这一阶段的最终目标是一个网页，我们可以访问该网页以友好地查看地震信息。页面应该平滑地自我更新，并且数据应以可消费的方式提供，以支持未来的扩展。\n\
  \n在本章示例代码的 QuakeMonitorDB 文件夹中打开项目。\n\n### 改造数据收集器\n\n上一章中的 GeoJSON 数据收集器的迭代只是将数据直接捕获到数据库中。为了使数据更容易被其他应用程序处理，程序将改进为生成一个列出各个要素的表。\n\
  \n### 添加新数据表\n\n数据库中的分离要素将存储在一个名为 `dm_quakefeatures` 的新表中，如下所示：\n\n```\nCREATE TABLE\
  \ dm_quakefeatures\n(\n    qufeat_id text NOT NULL,\n    geojson text NOT NULL,\n\
  \    modified_date timestamp without time zone DEFAULT now(),\n    CONSTRAINT dm_qufeat_pkey\
  \ PRIMARY KEY (qufeat_id)\n)\nWITH (\n    OIDS=FALSE\n);\nALTER TABLE dm_quakefeatures\n\
  \    OWNER TO webquakeuser;\n```\n\n用于创建数据库的 SQL 语句位于示例代码的 SQL 文件夹中。\n\n### 过滤数据\n\
  \n文件 quakemonitordb.dart 中的 DataMonitor 类有一个更新后的 fetchData 方法，它在将原始 JSON 存储到数据库后，会单独存储底层要素：\n\
  \n```\nGeoUpdate update = new GeoUpdate(JSON.encode(dataset));\n\nlog.fine(\"Features\
  \ to process ${update.features.length}\");\n\nfor (int i = 0; i < update.features.length;\
  \ i++) {\n    GeoFeature feature = update.features[i];\n\n    await daoGeoJson.storeFeature(feature.id,\
  \ feature.toJson());\n}\n```\n\n正如前面的摘录所示，这并不是一个将数据排列到方便字段中的复杂对象。\n\n### 将要素转换为\
  \ JSON\n\n为了将对象转换回 JSON，将添加一个名为 `toJson` 的特定方法，如以下代码片段所示：\n\n```\nString toJson()\
  \ {\n    Map out = {};\n    out[\"properties\"] = properties;\n    out[\"geometry\"\
  ] = geometry;\n    return JSON.encode(out);\n}\n```\n\nproperties 和 geometry 的关键字段在传递给编码函数并返回给调用者之前会添加到\
  \ Map 中。\n\n### 改进数据维护\n\n由于数据库中有一个新表，我们将需要更新维护程序 `maintenance.dart` 以清除两个表，如以下代码片段所示：\n\
  \n```\ndeleteRecords() async {\n    var dbConn;\n    try {\n        dbConn = await\
  \ connect(uri);\n\n        var query = \"delete from dm_quakefeed\";\n        await\
  \ dbConn.execute(query);\n\n        query = \"delete from dm_quakefeatures\";\n\
  \        await dbConn.execute(query);\n    } catch (exception, stacktrace) {\n \
  \       log.severe(\"Exception getting info.\", exception, stacktrace);\n      \
  \  print(exception);\n    } finally {\n        dbConn.close();\n    }\n}\n```\n\n\
  这是通过使用另一个 `delete` SQL 语句完成的，并复用了与数据库的现有连接。\n\n### 存储单个要素\n\n要素的存储将采用两个独立的查询。第一个查询将使用\
  \ ID 字段检查它当前是否在表中。如果是，则函数将退出而不存储 JSON 字符串。让我们看一下以下代码片段：\n\n```\nstoreFeature(String\
  \ featureID, String json) async {\n    var dbConn;\n    try {\n        dbConn =\
  \ await connect(uri);\n\n        var query = \"\"\"select count(*) as Count\n  \
  \          from dm_quakefeatures where qufeat_id ='$featureID'\n        \"\"\";\n\
  \        var results = await dbConn.query(query).toList();\n\n        if (results[0][0]\
  \ != 0) return;\n\n        await dbConn.execute(\n            'insert into dm_quakefeatures\
  \ (qufeat_id, geojson) values (@\n            qufeat_id, @geojson)',\n         \
  \   {'qufeat_id': featureID, 'geojson': json});\n    } catch (exception, stacktrace)\
  \ {\n        log.severe(\"Exception storing Feature.\", exception, stacktrace);\n\
  \        print(exception);\n        print(stacktrace);\n    } finally {\n      \
  \  dbConn.close();\n    }\n}\n```\n\n第一个查询返回匹配 ID 的记录数。返回的结果被转换为列表格式，并通过 [0][0]\
  \ 访问该值——第一条记录和第一个字段。如果结果不为零，则方法返回而不采取进一步操作。\n\n第二个 SQL 操作通过使用 insert 语句将要素存储在数据库中。\n\
  \n\n\n\n\n## 运行数据应用程序\n\n该应用程序可以像往常一样从命令行运行。您可能希望这样运行数据收集器，以避免长时间打开多个 IDE。让我们看看下面的代码片段：\n\
  \n```bash\n$ cd QuakeMonitorDB/\nQuakeMonitorDB$ dart bin/main.dart\nStarting QuakeMonitor\
  \ DB version...\n```\n\n这展示了在终端中启动 QuakeMonitor 程序的过程。如果仔细观察系统上运行的进程，可以看到 Dart VM\
  \ 所使用的资源，如下面的截图所示：\n\n![](img/52c05b53a56abd53584e4fed738ed509_184_0.png)\n\n为 QuakeMonitor\
  \ 启动的 Dart 进程大约仅占用 64 兆字节，并且几乎可以立即启动。\n\n## 创建 Web 服务\n\n现在数据收集和存储已经重构完毕，是时候构建一个\
  \ Web 服务了。在某些方面，这与我们之前创建的博客服务器类似。然而，我们希望有更远大的目标，因此将开始为我们的数据构建一个 Web API，为未来的发展做好规划。\n\
  \nREST 架构风格非常流行，因为它非常适合 JSON，并且适合客户端 Web 应用程序使用。REST 是一种 Web 服务架构风格，作为 WSDL 和 SOAP\
  \ 的一种更简单的替代方案，已被广泛接受。\n\nREST 基于 HTTP，使用 GET、POST、PUT 和 DELETE 等请求动词。它可以使用任何 Internet\
  \ 格式作为数据类型（XML、图像等），但通常使用 JSON。\n\nRESTful Web API 没有统一的标准，因为它是一种风格而非协议。这意味着它非常灵活，但也可能难以回答诸如“这是正确的做法吗？”之类的问题。通常的建议是务实一点，在合理的情况下遵循\
  \ REST。\n\n有关更多信息，请参阅 http://www.restapitutorial.com/。\n\n### 使用 rpc 包\n\nRESTful\
  \ API 有许多约定和预期。幸运的是，有一个由 Dart 开发团队编写的现有 Dart 包，涵盖了大部分实现细节。\n\nrpc 包可从 Pub 获取：https://pub.dartlang.org/packages/rpc。\n\
  源代码可从 GitHub 获取：https://github.com/dart-lang/rpc。\n\n额外的好处是，rpc 包还包含可发现性功能（通过 Google\
  \ 的发现文档，https://developers.google.com/discovery/v1/reference/apis），这允许轻松创建任何支持语言的客户端代码。\n\
  \n### 启动 API 服务器\n\n在 main.dart 文件中，服务器被设置并配置为在本地机器上使用端口 8080 提供服务，如下面的代码片段所示：\n\
  \n```dart\nlibrary io_rpc_sample;\n\nimport 'dart:io';\nimport 'package:georestwebservice/georestwebservice.dart';\n\
  import 'package:rpc/rpc.dart';\n\nfinal ApiServer _apiServer = new ApiServer(apiPrefix:\
  \ '/api', prettyPrint: true);\n\nmain() async {\n  _apiServer.addApi(new Quake());\n\
  \  _apiServer.enableDiscoveryApi();\n\n  HttpServer server = await HttpServer.bind(InternetAddress.ANY_IP_V4,\n\
  \  8080);\n  server.listen(_apiServer.httpRequestHandler);\n}\n```\n\n_apiServer\
  \ 实例的创建使用了两个参数。第一个参数为 API 设置了一个预期前缀，这样有效的 URL 将以 `http://127.0.0.1:8080/api` 的形式开头。第二个参数\
  \ prettyPrint 对 JSON 进行格式化，便于在浏览器或其他可能包含调试器的消费应用程序中查看。当 JSON 嵌套层级较深时，这尤其有用。\n\n\
  然后，_apiServer 实例被配置为一个 Quake 对象。该对象包含 API 方法的实现。Quake 类的定义位于文件 `georestwebservice.dart`\
  \ 中，并且带有大量注解。让我们看看下面的代码片段：\n\n```dart\n@ApiClass(\n    name: 'quake',\n    version:\
  \ 'v1',\n    description: 'Rest API for Earthquake feature data.')\nclass Quake\
  \ {\n  ...\n}\n```\n\n@ApiClass 注解将这个类作为 rpc 服务器上的一个 API 暴露出来。这允许单独的类分别处理每个 API\
  \ 名称和版本的实现。可以通过更改向服务器请求的 URL 中的版本或名称来访问不同的版本。\n\n### 暴露方法\n\n最简单的方法是经典的 Hello World\
  \ 示例：\n\n```dart\n@ApiMethod(path: 'hello')\nQuakeResponse hello() {\n  return new\
  \ QuakeResponse()..result = 'Hello world.';\n}\n```\n\n这个注定会失败的方法将产生一个客户端应用程序可以处理的有效\
  \ JSON 响应：\n\n![](img/52c05b53a56abd53584e4fed738ed509_188_0.png)\n\n### 提供最新信息\n\
  \n对于网格视图数据展示，Web API 最重要的 URL 将是 http://127.0.0.1:8080/api/quake/v1/latest：\n\n\
  ```dart\n@ApiMethod(path: 'latest')\nList<String> latest() {\n  DaoQuakeAPI qa =\
  \ new DaoQuakeAPI();\n  return qa.fetchTopTenLatest();\n}\n```\n\nrpc 包处理了几种常见返回类型到\
  \ JSON 的转换。List<String> 可能是最常见的集合。\n\n### 提供数据\n\nDaoQuakeAPI 类在文件 daoapi.dart 中实现，并从数据库中检索要素列表，如下面的代码片段所示：\n\
  \n```dart\nFuture<List<String>> fetchTopTenLatest() async {\n  var dbConn;\n  try\
  \ {\n    dbConn = await connect(uri);\n\n    var query = \"\"\"\n    select geojson\
  \ from dm_quakefeatures order by modified_date desc\n    limit 10\n    \"\"\";\n\
  \n    List<Row> dbResults = await dbConn.query(query).toList();\n    List<String>\
  \ results = new List<String>();\n\n    dbResults.forEach((record) {\n        results.add(record[0]);\n\
  \    });\n\n    return results;\n  } catch (exception, stackTrace) {\n    print(exception);\n\
  \    print(stackTrace);\n  } finally {\n    dbConn.close();\n  }\n}\n```\n\n结果以记录列表的形式返回，每条返回的记录都是一个\
  \ List 对象。这意味着需要指定 record[0]，因为我们只需要第一个字段中的字符串。\n\n### 发现 API\n\nrpc 包为 API 提供了内置的可发现性。这是以服务的\
  \ JSON 定义形式提供的，可从 API 服务器访问：\n\nhttp://127.0.0.1:8080/api/discovery/v1/apis/quake/v1/rest\n\
  \n该定义将被开发工具使用，以生成所需的包装器对象和支持代码。让我们看看下面截图中的输出：\n\n![](img/52c05b53a56abd53584e4fed738ed509_189_0.png)\n\
  \n头部包含标识信息（如版本）和关键使用数据（如调用方法的基本 URL）。\n\n`schemas` 部分总结了 API 使用的所有数据类型、方法列表以及可进行的可用函数调用。此外，resources\
  \ 部分（此项目为空）将包含将 API 方法分组在一起的对象。\n\n### 运行 Web 服务\n\n与数据监控器一样，您可能希望在开发环境之外运行 REST\
  \ Web 服务。要从终端（命令行）运行，请输入以下代码：\n\n```bash\n$ cd georestwebservice/\n$ dart bin/main.dart\n\
  Starting georestwebservice...\n```\n\n### 回顾目前的系统\n\n我们现在已经完成了系统的两个部分。第一部分联系实时数据源并提取突发信息，第二部分通过标准\
  \ API 公开收集到的数据：\n\n![](img/52c05b53a56abd53584e4fed738ed509_190_0.png)\n\n这两部分都需要运行，并且建议在开发环境之外运行它们。这因操作系统而异，因此请酌情使用批处理文件或\
  \ shell 脚本。\n\n打开一个进程资源管理器应用程序（Linux 命令行中的 top，Windows 中的任务管理器，Mac OS 中的活动监视器），您将能够看到\
  \ Dart VM 的效率有多高。应用程序会立即启动，并且只使用相对较少的内存。\n\n## 消费应用程序\n\n我们现在已经有了解决方案的两个部分：收集到的数据和发布这些数据的\
  \ Web 服务。下一步是构建一个与 Web 服务通信的客户端应用程序。最初，我们将有一个包含最新十条传入数据的详细信息网格视图（或者对于熟悉 HTML 的人来说，就是一个表格）。\n\
  \n屏幕不会让用户手动更新页面，而是会定期自动更新最新地震信息。\n\n### 打包网格\n\n网格显示可能对其他应用程序也有用，因此它将作为包 webgridview\
  \ 拆分到自己的项目中，如下所示：\n\n```yaml\nname: 'GridViewer'\nversion: 0.0.1\ndescription: A\
  \ grid viewer for GeoJSON data.\nenvironment:\n  sdk: '>=1.0.0 <2.0.0'\ndependencies:\n\
  \  browser: '>=0.10.0 <0.11.0'\n  intl: any\n  webgridview:\n    path: ../webgridview/\n\
  ```\n\n该包可以在 pubspec.yaml 中作为本地包被引用。\n\n### 启动实时更新\n\nmain.dart 中的主函数将执行网格的初始更新，然后启动一个\
  \ Timer，定期更新页面：\n\n```dart\nvoid main() {\n  performUpdate(null);\n  updater = new\
  \ Timer.periodic(new Duration(seconds: 10),\n  performUpdate);\n}\n```\n\n\n\n周期性计时器处理器\
  \ `performUpdate` 在每次触发 10 秒时，会作为参数提供一个 `Timer` 对象。当我们直接调用它时，`null` 会被提供而不是 `Timer`\
  \ 实例。\n\n### 执行更新\n\n正在更新的两个元素是当前时间，以及到下一次刷新的倒计时，还有数据的网格。让我们来看一下以下代码片段：\n\n```dart\n\
  void performUpdate(Timer triggerTimer) {\n    DivElement outputDiv = querySelector('#timestatus');\n\
  \n    DateTime currentDateTime = new DateTime.now();\n    DateFormat timeStamp =\
  \ new DateFormat(\"hh:mm a\");\n\n    if (triggerTimer != null) {\n        secondsToUpdate\
  \ -= 10;\n    } else updateDataView();\n\n    if (secondsToUpdate == 0) {\n    \
  \    updateDataView();\n        secondsToUpdate = 60;\n    }\n\n    outputDiv.text\
  \ =\n        \"${timeStamp.format(currentDateTime)} - $secondsToUpdate seconds until\
  \ refresh.\";\n}\n```\n\n`secondsToUpdate` 变量从 60 递减到 0，并在每六次调用时触发一次更新，以便显示每分钟更改一次。\n\
  \n### 获取 JSON\n\n`main.dart` 文件中的 `updateDataView` 函数负责获取数据并更新网格视图：\n\n```dart\n\
  ...\nHttpRequest.getString(jsonSrc).then((String data) {\n    outputDiv.children.clear();\n\
  \n    List items;\n    try {\n        items = JSON.decode(data);\n    } catch (exception,\
  \ stackTrace) {\n        print(exception);\n        print(stackTrace);\n    }\n\
  ...\n```\n\n`DivElement outputDiv` 是动态更新内容的容器，在每次更新时都会被完全清空。传入的 JSON 数据被解码并存储在名为\
  \ `items` 的 `List` 对象中。\n\n### 配置网格视图控件\n\n网格的数据以列表的列表结构提供。结构中的第一个列表构成表格的标题。让我们来看一下以下代码片段：\n\
  \n```dart\n...\nif (items != null) {\n    List allQuakeData = [];\n    allQuakeData.add(\n\
  \        ['Time', 'Magnitude', 'Type', 'Tsunami', 'Place', 'Sig', 'Link']);\n\n\
  \    items.forEach((String post) {\n        Map decodedData = JSON.decode(post);\n\
  \n        List quakeData = [];\n        quakeData.add(convertTime(decodedData['properties']['time']));\n\
  \        quakeData.add(decodedData['properties']['mag']);\n        quakeData.add(decodedData['properties']['type']);\n\
  \        quakeData.add(decodedData['properties']['tsunami']);\n        quakeData.add(decodedData['properties']['place']);\n\
  \        quakeData.add(decodedData['properties']['sig']);\n        quakeData.add(decodedData['properties']['url']);\n\
  \n        allQuakeData.add(quakeData);\n    });\n\n    outputDiv.append(Gridview.getTable(allQuakeData));\n\
  }\n...\n```\n\nJSON 项会被迭代，并提取网格的值。唯一未直接使用的值是时间字段，该字段需要格式化。\n\n前述代码渲染以下输出显示，其内容会根据执行时间而变化：\n\
  \nDate and Time Demo\n\n| Format | Output |\n|--------|--------|\n| hh:mm a | 04:12\
  \ PM |\n| HH:MM | 16:06 |\n| y | 2015 |\n| d | 13 |\n| EEEE | Saturday |\n\n函数 `printTime`\
  \ 将输入的 `DateTime` 格式化为所需样式。`String` 对象上的 `padRight` 方法用于通过添加空格将字符串填充到 12 个字符来制作简单的表格，如下所示：\n\
  \n```dart\nvoid printTime(DateTime dt, String format) {\n  DateFormat timeStamp\
  \ = new DateFormat(format);\n  print(\"\\t${format.padRight(12)} ${timeStamp.format(dt)}\"\
  );\n}\n```\n\n程序的第二部分允许使用 `stdin.readLineSync()` 方法输入日期。用户可以输入空行以退出。字符串根据格式 `yyyy-MM-dd`\
  \ 进行解析，如果解析成功则显示星期几：\n\n```dart\nwhile (true) {\n  String userDate = \"\";\n  print(\"\
  \\nPlease enter a date (yyyy-MM-dd):\");\n\n  try {\n    DateFormat timeStamp =\
  \ new DateFormat(\"yyyy-MM-dd\");\n    DateFormat outputFmt = new DateFormat(\"\
  EEEE\");\n\n    userDate = stdin.readLineSync();\n    if (userDate.length == 0)\
  \ exit(0);\n\n    print(outputFmt.format(timeStamp.parse(userDate)));\n  } catch\
  \ (exception, stacktrace) {\n    print('Error parsing the entered date.');\n   \
  \ print(exception);\n    print(stacktrace);\n  }\n}\n```\n\n解析被包裹在 `try catch` 中以处理日期字符串解析失败时引发的异常。\n\
  \n### 构建表格\n\n位于文件 `lib/src/webgridview_base.dart` 中的类 `GridView` 从调用的网页提供的列表的列表中准备表格。静态方法\
  \ `getTable` 执行此任务。由于它是静态的，因此无需类的实例即可调用此函数。让我们来看一下以下代码片段：\n\n```dart\nstatic TableElement\
  \ getTable(List rows) {\n  TableElement te = new TableElement();\n  rows.forEach((row)\
  \ => addRow(te, row));\n  return te;\n}\n```\n\n`addRow` 函数遍历结果中的列。标题行作为普通行添加，因为\
  \ CSS 会负责第一行的特殊格式，如下所示：\n\n```dart\nstatic addRow(TableElement table, List cols)\
  \ {\n  TableRowElement tableRow = table.addRow();\n\n  cols.forEach((column) {\n\
  \    TableCellElement tableCell = tableRow.addCell();\n    String content = column.toString();\n\
  \    if (content.startsWith('http')) {\n      content = \"<a href=\\\"$content\\\
  \">Link</a>\";\n      tableCell.appendHtml(content);\n    } else tableCell.text\
  \ = content;\n  });\n}\n```\n\n内容作为文本添加到表格单元格中，其中一个特殊情况是字符串以 `http` 开头。这些 URL 被格式化为\
  \ HTML 并使用通用链接文本，并使用 `appendHtml` 方法以确保文本在添加到页面之前不会被清理。\n\n### 显示页面\n\n在 Dartium\
  \ 中启动应用程序将显示 `index.html` 页面：\n\n![](img/52c05b53a56abd53584e4fed738ed509_197_0.png)\n\
  \n在一段时间内保持此页面打开，表格将随着新数据的可用而平滑更新。来自美国以外的事件也会出现，尽管频率较低。相当罕见的是，Type 列并不总是显示为 'earthquake'。\n\
  \n### 总结\n\n本章中创建的应用程序众多，但它们共同协作以实现实时数据显示的目标。\n\n数据收集器将原始实时数据转换为可处理的形式。REST API\
  \ 是使用 rpc 包创建的，省去了大部分工作。创建新的 Web API 方法只需添加一个带注解的常规 Dart 方法即可。\n\n消费型 Web 应用程序展示了如何连接到\
  \ JSON 标准 Web 服务并生成高质量的输出，并在实时更新。HTML DOM 被用来替换基于表格的新显示。\n\n传入的地震数据被证明非常引人入胜，但它可以更具视觉效果。在下一章中，我们将使用数据库中存储的要素几何数据创建可视化，并查看扩展\
  \ API 以提供超出数据馈送的功能。\n"
- "## 9 实时可视化\n\n> 地图确实有一种催眠般的吸引力。\n>\n> - Ken Jennings\n\n地图确实令人着迷，闪烁的指示灯也是如此，这可能让你大致了解地震监测项目下一步的发展方向。这是显示我们收集的丰富地理数据的逻辑格式。\n\
  \n动画显示比静态显示更进一步，而动画之后的步骤是使其具有交互性。我们将研究如何从 Dart 访问 Web 浏览器功能，以便集成到桌面并使用用户的位置。\n\n\
  为了在专业的开发环境中工作或在线与社区分享，我们需要从 Dart 源代码创建文档。\n\n### 迭代概述\n\n网格视图提供了从收集数据的软件堆栈中获得的数据的非常详细的视图，该数据从\
  \ Web 服务收集，存储在数据库中，然后通过 API 从数据库共享。\n\n对于项目的这一部分，我们将重用除 `gridview` 之外的每个部分，并使用世界地图构建新的可视化。\n\
  \n\n\n\nThe MapDisplay class sets up the map on the web page (on the div element\
  \ with the ID mapview) and the image is loaded in. Then, quakeUpdate() is called\
  \ to ensure the initial display of the map and data on the page.\n\nOnce the initial\
  \ display is handled, the **Zoom** button is connected to the zoomMap function.\
  \ Then the two timers have handlers to deal with updating the quake data and the\
  \ animation display. The FeaturePlotter class handles the data and display updates\
  \ and is used by quakeUpdate and animationUpdate.\n\n## Drawing the map image\n\n\
  The HTML5 canvas will host the live display. The background is a block-like map\
  \ of the world; feel free to find and use a different version!\n\nLet's have a look\
  \ at the following screenshot:\n\n![](img/52c05b53a56abd53584e4fed738ed509_201_0.png)\n\
  \nThe red lines represent 0 degrees of latitude and longitude.\n\n## Plotting on\
  \ the map\n\nThe geometry point contains three pieces of data in a list called coordinates.\
  \ They are the longitude, latitude, and also the depth in kilometers of where the\
  \ earthquake originated:\n\n```\n{type: Point, coordinates: [-117.4505005, 34.2316666,\
  \ 13.31]}\n```\n\nTo map these coordinates to the map, we use the method toPoint\
  \ in the FeaturePlotter class in the file featureplotter.dart, which performs the\
  \ conversion as follows:\n\n```\nPoint toPoint(double longitude, double latitude)\
  \ {\n  double x = 0.0;\n  double y = 0.0;\n  double hdeg = width.toDouble() / 360;\n\
  \  double vdeg = height.toDouble() / 180;\n\n  x = (width / 2) + (hdeg * longitude);\n\
  \  y = (height / 2) - (vdeg * latitude);\n\n  return new Point(x.toInt(), y.toInt());\n\
  }\n```\n\nThe longitude and latitude is based on the spherical nature of the Earth,\
  \ and the x axis is 360 degrees wide with 0 being the mid-point. The y axis is 180\
  \ degrees wide with 0 being the midpoint at the equator. In terms of the GeoJSON\
  \ data, the x values are in the range of -180 to +180 and y is from -90 to 90.\n\
  \n![](img/52c05b53a56abd53584e4fed738ed509_202_0.png)\n\n> Dart, at the time of\
  \ writing is at version 1.11 and you may be wondering if it will reach version 2\
  \ in the near future. Yes, it will! During the first Dart Developer Summit, version\
  \ 2 of Dart was mentioned for the first time by Lars Bak. While it was hinted that\
  \ there may be some language changes, it was strongly emphasized these would only\
  \ be made with tools to handle updating existing code. In Bak's words, \"this is\
  \ not Python!\" This quote is a reference for the somewhat disruptive move from\
  \ Python 2 to Python 3. One key change that has already begun is the moving of some\
  \ packages out of the SDK. This allows them to update on their own schedule. For\
  \ example, dart:html has to respond more quickly than the SDK update cycle to web\
  \ browser changes.\n\n## Fetching the data\n\nThe data is fetched as an `HttpRequest`\
  \ in the same manner as in the grid view project, and the fields we are interested\
  \ in are put into the list `quakePoints` before being filtered into the `geoFeatures`\
  \ list:\n\n```dart\nfetchFeatureList() async {\n  geoFeatures.clear();\n\n  String\
  \ data = await HttpRequest.getString(jsonSrc);\n  List items;\n  List quakePoints\
  \ = [];\n\n  try {\n    items = JSON.decode(data);\n  } catch (exception, stacktrace)\
  \ {\n    print(exception);\n    print(stacktrace);\n  }\n\n  if (items != null)\
  \ {\n    items.forEach((String post) {\n      Map feature = JSON.decode(post);\n\
  \n      List quakedata = [\n        feature['geometry']['coordinates'][0],\n   \
  \     feature['geometry']['coordinates'][1],\n        feature['properties']['mag'],\n\
  \        feature['properties']['place'],\n        feature['properties']['type'],\n\
  \        feature['geometry']['coordinates'][2]\n      ];\n\n      quakePoints.add(quakedata);\n\
  \    });\n\n    quakePoints.where((qp) => qp[4] == 'earthquake').forEach((qp) {\n\
  \      geoFeatures.add(qp);\n    });\n  }\n}\n```\n\nAll the items returned are\
  \ added to the quake points list, but we only want to add the `earthquake` ones\
  \ to the `geoFeatures` list. The list may contain other types such as `quarry blast`.\n\
  \nUsing a `where` clause, we can filter the list an item at a time. The list item\
  \ is run through the function, and the list item at index number 4 is compared against\
  \ the string `earthquake`.\n\nThis is a very convenient method for getting only\
  \ the required data and best of all it is available on any iterable object. On top\
  \ of this, there are a number of variants such as `firstWhere` and `lastWhere` that\
  \ help to quickly get a reference to the data that matches a criterion.\n\n## Updating\
  \ the map indicators\n\nOnce a list of `geoFeatures` is available, it can be used\
  \ to construct a list of `MapIndicator` objects that will appear on the map. The\
  \ entire list is cleared out each time so that the number of indicators on the map\
  \ does not build up too much over time. Let's take a look at the following screenshot:\n\
  \n```\nupdateData() async {\n    await fetchFeatureList();\n    mapIndicators.clear();\n\
  \    geoFeatures.forEach((List feature) {\n        Point pos = toPoint(feature[0],\
  \ feature[1]);\n        MapIndicator mi;\n        mi = new MapIndicator(pos.x, pos.y,\
  \ ctx, feature[2].toInt());\n        mi.summary = \"Magnitude ${feature[2]} - ${feature[3]}.\"\
  ;\n        mapIndicators.add(mi);\n    });\n}\n```\n\nThis function is marked `async`\
  \ as there is an `await` being used for the `fetchFeatureList` method call. Once\
  \ the features are available, the `mapIndicators` list is reset and a new one is\
  \ constructed.\n\n## Mouse over popups\n\nTo give the user more details about the\
  \ feature on the map, a popup appears at the top of the screen when the pointer\
  \ is moved over a map indicator. To get the mouse pointer coordinates, a handler\
  \ can be added to handle the mouse move events on the canvas element:\n\n```dart\n\
  MapDisplay(CanvasElement mapcanvas, this.width, this.height) {\n  mapctx = mapcanvas.getContext(\"\
  2d\");\n  mapcanvas.onMouseMove.listen(onMouseMove);\n}\n```\n\nThis is carried\
  \ out in the MapDisplay constructor and the method handles the triggering of the\
  \ implementation function. This function is a field in the class that is set by\
  \ the page using the map display:\n\n```dart\nvoid mouseMove(MouseEvent e) {\n \
  \ if (showPopup != null)\n    showPopup(e.client.x - 50, e.client.y - 90);\n}\n\
  ```\n\nThe implementation of the showPopup function is in main.dart. It displays\
  \ the initially hidden popup above the map and then populates it with the feature\
  \ details:\n\n```dart\nvoid showPopup(int x, int y) {\n  bool inHotspot = false;\n\
  \n  if (zoomed) {\n    x = x ~/ 2;\n    y = y ~/ 2;\n  }\n\n  featPlotter.hotspotInfo.forEach((Rectangle<int>\
  \ key, String value) {\n    if (key.containsPoint(new Point(x, y))) {\n      inHotspot\
  \ = true;\n      querySelector('#popup').innerHtml = value;\n    }\n  });\n\n  if\
  \ (inHotspot)\n    querySelector('#popup').style.visibility = \"visible\";\n}\n\
  ```\n\nIf the map display is zoomed in, then the coordinates must be updated; this\
  \ is performed with the ~/ division operator, which returns an integer value. This\
  \ is faster than the equivalent (x/2).toInt() and gives the required whole numbers\
  \ for plotting:\n\n![](img/52c05b53a56abd53584e4fed738ed509_208_0.png)\n\nThe Map\
  \ containing the hotspotInfo is iterated over with a convenient forEach loop, giving\
  \ both the dictionary key and the respective value. The current point of the mouse\
  \ relative to the top-left corner of the canvas element is tested against each rectangle\
  \ that defines the hotspot (the hotspot is the area on the map that will trigger\
  \ the popup).\n\nThe hotspots are stored as a list of Rectangle<int> objects generated\
  \ when the data list is being updated by the FeaturePlotter class. This class is\
  \ from the dart:math package:\n\n```\nvoid updateHotspots() {\n    hotspotInfo.clear();\n\
  \    mapIndicators.forEach((MapIndicator mi) {\n        Rectangle<int> rect = new\
  \ Rectangle(mi.x - mi.maxWidth,\n            mi.y - mi.maxWidth, mi.maxWidth * 2,\
  \ mi.maxWidth * 2);\n\n        hotspotInfo[rect] = mi.summary;\n    });\n}\n```\n\
  \nThe hotspot is defined as a square area around the map indicator when it is at\
  \ its maximum width. The summary property gives the text to be displayed. The screenshot\
  \ of the quake map is as follows:\n\n![](img/52c05b53a56abd53584e4fed738ed509_208_1.png)\n\
  \n\n\n\n\n希望这能帮助你提高地理知识并了解更多关于 Dart 的信息！\n\n在 Dartium 中调试时，使用 REST 或其他类似的 Web 服务，可以在浏览器开发者工具的控制台窗口中获得\
  \ XMLHttpRequests 的额外日志。\n\n调出上下文菜单（右键单击），其中有一个名为 Log XMLHttpRequests 的选项，可在控制台输出窗口中显示网页发出的\
  \ HTTP 请求：\n\n[-121.5371704, 36.8165016, 0.93]\n129.91739911111114 177.278328\n\
  2.2222222222222223 3.3333333333333335\nmaxWidth 2\nXHR finished loading: GET \"\
  http://127.0.0.1:8080/api/quake/v1/latest\".\n\n在调试项目时，这非常宝贵，可以节省在每个发出 HTTP 请求的代码部分添加日志的工作。\n\
  \n## 放大显示\n\ncanvas 元素具有一系列 2D 绘图功能，其中包括一个缩放功能，我们可以利用它来聚焦地图上最活跃的部分，即北美。在 main.dart\
  \ 中，有一个名为 zoomed 的标志，默认为 false，可帮助应用程序跟踪当前显示状态。一个按钮绑定到缩放代码实现：\n\n```dart\nzoomMap(Event\
  \ evt) async {\n  if (zoomed == true) {\n    zoomed = false;\n    quakeMap.mapCtx.resetTransform();\n\
  \    quakeMap.mapCtx.scale(1, 1);\n  } else {\n    zoomed = true;\n    quakeMap.mapCtx.scale(2,\
  \ 2);\n  }\n  quakeMap.drawMapGrid();\n}\n```\n\n## 实时可视化\n\ncanvas 在缩放设置之间切换，其中对\
  \ `resetTransform` 方法的调用至关重要。如果没有它，缩放将无法恢复正常。整个地图视图必须立即重绘，以便用户获得响应式体验。让我们看一下以下屏幕截图：\n\
  \n![](img/52c05b53a56abd53584e4fed738ed509_210_0.png)\n\n如果你观看此页面一段时间，你会发现加利福尼亚和阿拉斯加的特征在数据中占据很大比重。随着弹出代码处理缩放变化，这些特征仍然可用。第二次按下\
  \ **Zoom** 按钮会返回到完整的世界视图。\n\n> print 函数不仅仅用于命令行应用程序，也可用于 Web 应用程序。输出显示在 **Developer\
  \ Tools** 控制台日志窗口中，可通过右键单击页面调出上下文菜单，然后单击 `Inspect Element` 来显示。\n\n## 实时可视化\n\n\
  一旦获得许可，最后一步是创建通知类的实例。不需要进一步的方法调用：\n\n![](img/52c05b53a56abd53584e4fed738ed509_212_0.png)\n\
  \n应用程序设置为经常通知——你可能希望提高通知地震的级别，否则你会发现自己需要 dismiss 很多通知。通知的视觉显示在不同平台和 Web 浏览器上可能有所不同。\n\
  \n## 绘制用户位置\n\n大多数移动设备都配备了地理位置设备，或者可以通过 IP 等次要信息甚至回退到用户输入来确定位置。这通过 HTML5 地理位置 API\
  \ 在 `http://www.w3.org/TR/geolocation-API/` 上向现代 Web 开发者公开以供应用程序使用。\n\n与桌面通知一样，用户必须授予页面使用其位置的权限。另一个小障碍是，位置功能在\
  \ Dartium 上不起作用。要尝试此应用程序的功能，请使用 pub build 创建 JavaScript 版本并使用其他浏览器：\n\n![](img/52c05b53a56abd53584e4fed738ed509_212_1.png)\n\
  \n页面上的 **Locate** 按钮将尝试获取用户的位置并通过将其添加到 `featurePlotter` 类实例在页面上绘制它：\n\n```dart\n\
  locateUser(Event evt) async {\n  Geoposition geoPos = await window.navigator.geolocation.\n\
  \  getCurrentPosition();\n  MapIndicator mapIndicator;\n  var pos =\n  featPlotter.toPoint(geoPos.coords.longitude,\
  \ geoPos.coords.\n  latitude);\n  mapIndicator = new MapIndicator(pos.x, pos.y,\
  \ quakeMap.mapCtx, 4);\n  mapIndicator.colorPrimary = \"#0000ff\";\n  mapIndicator.colorSecondary\
  \ = \"#00ffff\";\n  featPlotter.userLocation.add(mapIndicator);\n}\n```\n\n坐标的转换方式与地震相同，并且指示器更改为蓝色，以便在地图上突出显示，如以下屏幕截图所示：\n\
  \n![](img/52c05b53a56abd53584e4fed738ed509_213_0.png)\n\n一旦应用程序编译为 JavaScript，在获得用户许可的情况下，地理位置数据即可使用，蓝色点指示用户的位置，在本例中是相对地震较少的英国。\n\
  \n在命令行和 Dartium 中运行的 Dart VM 并不是唯一的体现。Dart 团队正在开发两个在其他环境中运行的 Dart 实验版本，与主 Dart VM\
  \ 有很大不同。目前，两者都运行在移动环境中，并专注于并发和高性能。\n\nFletch 在桌面操作系统上运行，但旨在在 Android 和 iOS 上执行且没有\
  \ JIT。Fletch 对高度异步的 Dart 采取了 somewhat 相反的方法，偏爱用户级线程，这些线程被阻塞但只保留少量资源。Fletch 为在不同平台上共享同一代码提供了有趣的前景；这将对移动开发者来说是巨大的生产力提升。\n\
  \nhttps://github.com/dart-lang/fletch\n\nSky 仅在撰写时为 Android，并雄心勃勃地旨在以 120 FPS 运行高度响应式的应用程序。为了实现这一点，它优先考虑用户界面，以便在进行其他处理时仍能保持\
  \ 8 ms 的响应。目前，它可能可以在 Dart VM 可以运行的任何地方运行。\n\nhttps://github.com/domokit/sky_engine/tree/master/sky/packages/sky\n\
  \n如果 Fletch 和 Sky 原型成功，它们很可能将是移动或服务器虚拟机，而不是嵌入在 Web 服务器中。\n\n## 对功能列表进行排序\n\n到目前为止，坐标列表中的第三个数据，即地震深度，还没有被使用。当用户按下\
  \ Sort 按钮时，此数据将以当前功能的排序列表形式呈现。让我们看一下以下代码片段：\n\n```dart\nvoid sortFeatures(Event\
  \ evt) {\n  featPlotter.sortFeatures();\n  DivElement out = querySelector('#depthDetail');\n\
  \  out.nodes.clear();\n  featPlotter.geoFeatures.forEach((feature) {\n    LIElement\
  \ detail = new LIElement();\n    detail.innerHtml = \"${feature[5]}km - ${feature[3]}\"\
  ;\n    out.nodes.add(detail);\n  });\n}\n```\n\n## 使用 dartdoc 记录 Dart 代码\n\n文档是软件开发的关键部分，为了鼓励对包进行良好的文档记录，Dart\
  \ 提供了工具 dartdoc (https://github.com/dart-lang/dartdoc/)，它基于特殊格式的代码注释创建静态 HTML 文档。Dart\
  \ 之前的文档工具是 SDK 的一部分，而 dartdoc 是 Dart 团队开发的独立项目。\n\n它可以通过命令行使用 pub 安装：\n\n```bash\n\
  pub global activate dartdoc\n```\n\n我们将查看一个 Dart 包项目以探索 dartdoc 的功能。在 WebStorm 编辑器中打开项目\
  \ quakerecord，并查看文件 quakerecord.dart：\n\n```dart\nlibrary quakerecord;\nexport 'src/quakerecord_base.dart';\n\
  ```\n\n该包导出单个文件 quakerecord_base.dart，在此文件中声明了类 Processor：\n\n```dart\n/// A lightweight\
  \ object to process a raw earthquake feature.\n///\n/// * Must have valid JSON.\n\
  /// * Must be less than 128MB.\n///\nclass Processor {\n\n// Store for the JSON.\n\
  String _feature;\n\n/// The state of processing\nbool get processed => true;\n\n\
  /// The default constructor.\n///     Processor processor;\n///     processor =\
  \ new Processor('{}');\nProcessor(String feature) {}\n\n/// Returns a converted\
  \ object based on the feature passed into\n/// the constructor [Processor].\nobject\
  \ convert() {\n    // A normal comment.\n```\n\n\n\n\n### 实时可视化\n\n项目中创建了一个文档子文件夹，其中包含一个名为\
  \ `api` 的文件夹，用于存放文档。在你喜欢的网络浏览器中打开该页面，查看 `Processor` 类的输出。让我们看看下面的截图：\n\n![](img/52c05b53a56abd53584e4fed738ed509_218_0.png)\n\
  \n最后，你可能想知道来自 `recordhelper.dart` 的 `ProcessHelper` 类在生成的页面上位于何处。它不属于文档的一部分，因为它没有从包中导出，因此被视为包的消费者无需知道的私有实现细节。\n\
  \n### 总结\n\n我们已经看到如何从原始数据生成可视化，并使用基于 HTML5 canvas 的客户端以动画形式渲染。此外，还可以通过弹出窗口和缩放功能使其具有交互性。\n\
  \nHTML5 可用于提供桌面通知，并利用用户的地理位置作为应用程序的一部分。SDK 工具 dartdocgen 为地震地图查看器项目生成了高质量、格式规范且标准化的文档。\n\
  \n我们已经探索了数据结构，并了解了便捷的排序和迭代工具。\n\n从这个项目继续深入，数据仍然可以在日期范围内以更详细的方式呈现。我们将研究如何使用 Dart\
  \ 构建业务和其他应用程序的常用功能——可打印报告。此外，我们将在 API 的基础上进行扩展，允许直接输入地理信息，而不是依赖外部数据源。\n\n这些报告将主要采用\
  \ HTML 格式，不过我们也会探讨其他格式。**逗号分隔值（CSV）**格式至今仍是大多数系统上的用户需求，因为它灵活且易于在电子表格和其他应用程序中使用。让我们看看\
  \ API 客户端和报告如何融入整个系统：\n\n![](img/52c05b53a56abd53584e4fed738ed509_222_0.png)\n\n\
  该项目完成后将包含许多部分，这是许多系统的典型特征。这并非要吓唬新程序员，但实际上这是一个相当简单的系统。如果你不信，可以想想一个现代社交网络网站，它接收来自各种设备的文本、照片以及\
  \ API 客户端提交的数据。再想象一下它需要多少子系统和管理报告！\n\n## 推进 REST API\n\n这个 API 将更加实用，并使我们能够添加数据，这样一来，当前网络数据源就不再是唯一的数据来源。\n\
  \ngeorestwebservice 项目（本章中的）中的示例代码是 API 的更新版本，其中的 georestwebservice.dart 文件新增了 recordFeature\
  \ 方法：\n\n```\n@ApiMethod(path: 'record', method: 'POST')\nQuakeResponse recordFeature(QuakeRequest\
  \ request) {\n  DaoQuakeAPI quakeAPI = new DaoQuakeAPI();\n  quakeAPI.recordFeature(getFeatureAsJSON(request));\n\
  \n  QuakeResponse quakeResponse = new QuakeResponse();\n  quakeResponse.result =\
  \ \"1\";\n\n  return quakeResponse;\n}\n```\n\n此方法将使用标准的 HTTP POST 动词来接收来自客户端应用程序的输入。由于\
  \ rpc 包封装了整个方法，并负责构造和发送错误响应，因此此方法中无需进行错误处理。例如，如果在数据库中存储结果时出现问题，客户端将收到一条错误消息。\n\n\
  下面的 getFeatureAsJSON 函数位于 helpers.dart 文件中，它将传入的 QuakeRequest 对象转换为 JSON 字符串：\n\n\
  ```\nString getFeatureAsJSON(QuakeRequest request) {\n  String feature = jsonData;\n\
  \  feature = feature.replaceAll(\"MAG\", request.magnitude.toString());\n  feature\
  \ = feature.replaceFirst(\"TIME\", request.time.toString());\n  feature = feature.replaceFirst(\"\
  LAT\", request.latitude.toString());\n  feature = feature.replaceFirst(\"LONG\"\
  , request.longitude.toString());\n  return feature;\n}\n```\n\njsonData 字符串是 GeoJSON\
  \ feature 的模板。String 类提供了许多用于字符串匹配的有用方法，这些方法被用来生成函数返回的最终字符串。replaceAll 方法用于替换字符串中的所有匹配项；在本例中，用于替换以值形式出现并出现在文本描述中的\
  \ magnitude。replaceFirst 方法用于替换字符串中第一次出现的匹配项，在该函数中用于替换那些只在字符串中出现一次的值。\n\n下面 API\
  \ 方法的参数是一个简单的类，它声明在同一个文件中，包含四个字段：\n\n```\nclass QuakeRequest {\n\n    @ApiProperty(required:\
  \ true)\n    int time;\n\n    @ApiProperty(required: true)\n    double magnitude;\n\
  \n    @ApiProperty(required: true)\n    double longitude;\n\n    @ApiProperty(required:\
  \ true)\n    double latitude;\n}\n```\n\n这些字段带有注解，这使得 rpc 包能够通过 REST 接口处理数据的编组（marshaling）。\n\
  \n### 向 API 传递参数\n\n向 REST API 提供输入的一种方式是通过调用 URL，下面这个 URL 将用于从数据库获取指定数量的条目：\n\n\
  ```\nhttp://127.0.0.1:8080/api/quake/v1/recent/100\n```\n\n该实现涉及用花括号语法扩展路径模式（这些花括号对应函数中的\
  \ String 参数）：\n\n```\n@ApiMethod(path: 'recent/{count}')\nFuture<List<String>> recent(String\
  \ count) async {\n  DaoQuakeAPI quakeAPI = new DaoQuakeAPI();\n  return await quakeAPI.fetchRecent(int.parse(count));\n\
  }\n```\n\nint.parse 方法用于将 count 字符串转换为数据库查询参数。\n\n### 向 API 发布数据\n\n在本章的 georestwebservice\
  \ 项目中，源代码是 API 的更新版本，其中 daoapi.dart 文件新增了 recordFeature 方法，如下所示：\n\n```\nFuture<List<String>>\
  \ recordFeature(String json) async {\n  var dbConn;\n  DateTime time = new DateTime.now();\n\
  \  String featureID = time.millisecondsSinceEpoch.toString();\n  List<String> result\
  \ = new List<String>();\n\n  try {\n    dbConn = await connect(uri);\n\n    await\
  \ dbConn.execute(\n      'insert into dm_quakefeatures (qufeat_id, geojson) values\
  \ (@qufeat_id, @geojson)',\n      {'qufeat_id': featureID, 'geojson': json});\n\
  \  } catch (exception, stacktrace) {\n    print(exception);\n    print(stacktrace);\n\
  \  } finally {\n    dbConn.close();\n  }\n  result.add(featureID);\n  return result;\n\
  }\n```\n\n此方法将为传入的 feature 详细信息创建一个 featureID 字符串，然后将其与来自客户端的数据一起插入到 dm_quakefeatures\
  \ 表中。生成的 featureID 字符串随后返回给调用方应用程序，以备将来引用。\n\n### 连接 API 客户端\n\n客户端将是一个命令行应用程序，用于通过新的\
  \ REST API 方法向数据库添加新的 feature。\n\n这个项目是一个命令行应用程序，使用 `dart:io` 包处理 HTTP 请求，其功能与 `dart:html`\
  \ 类似，如下列代码所示：\n\n```\nmain() async {\n  print(\"API client\");\n\n  HttpClient client\
  \ = new HttpClient();\n  HttpClientRequest request = await client.postUrl(Uri.parse(apiUrl));\n\
  \  request.headers.contentType = ContentType.JSON;\n  await request.write(JSON.encode(getFeature()));\n\
  \n  HttpClientResponse response = await request.close();\n  print(\"${response.toString()}\"\
  );\n\n  response.transform(UTF8.decoder).listen((contents) {\n    request.close();\n\
  \    print(contents);\n    print(\"API client - done\");\n    exit(0);\n  });\n\
  }\n```\n\n该应用程序将向 API 提交一个包含单个 feature 的 JSON 字符串，等待响应，显示响应，然后退出。如果需要多个 feature，只需重新运行该程序即可。\n\
  \n### 多样化数据\n\n客户端在运行时将提供一个生成的 feature 提交给 API。该 feature 不是使用固定数据，而是随机生成的。要在 Dart\
  \ 中生成随机数，我们可以使用 dart:math 中的 Random 类，如下所示：\n\n```\nMap getFeature() {\n  var rng\
  \ = new Random();\n  var now = new DateTime.now();\n  Map feature = new Map();\n\
  \  feature['time'] = now.millisecondsSinceEpoch;\n  feature['magnitude'] = rng.nextInt(8)\
  \ + 1;\n  feature['latitude'] = rng.nextDouble() * 90;\n  feature['longitude'] =\
  \ rng.nextDouble() * 90;\n  return feature;\n}\n```\n\nRandom 类提供了生成整数和 double 值的方法，其中前一种方法可以设置上限。nextDouble\
  \ 方法返回一个介于 0 和 1 之间的值，因此只需将该值乘以期望的最大值即可。time 字段将设置为当前时间。\n\n![](img/52c05b53a56abd53584e4fed738ed509_227_0.png)\n\
  \n> dart:math 包包含了大量的函数，如果你浏览文档，你会发现大多数类型不是 integer 或 double，而是 num。在 Dart 中，integer\
  \ 和 double 是 num 对象的子类型，而 num 对象实现了基本运算符（+、*、/ 等）。\n> \n> Dart 规范包含任意精度的整数，这导致在处理非常大的数字时，JavaScript\
  \ 与编译为 JavaScript 的 Dart 之间存在行为差异。这适用于 -2^53 到 2^53 范围之外的数字，因此对于非常高级和特殊的应用程序来说，这可能是我们唯一需要担心的点！\n\
  \n\n\n\n\n## 返回地图\n\n要查看生成的数据，可以使用上一章中的地震地图视图。让我们在下面的屏幕截图中查看生成数据的可视化表示：\n\n![](img/52c05b53a56abd53584e4fed738ed509_228_0.png)\n\
  \n一旦命令行 API 客户端运行了多次，地图很快就会被填充。尝试调整生成数据的输入以覆盖地图的更多区域，因为当前数字偏向于右上角。\n\n## 数据报告\n\n\
  有许多现有的系统可用于创建报告，例如安装基数很大的 Microsoft SQL Server Reporting Services (SSRS)。由于 Dart\
  \ 对 XML 等最普遍格式的支持，以及能够与工业标准数据库配合使用，因此使用 Dart 构建的解决方案当然可以集成。\n\n我们在此考虑的报告功能是一个纯 Dart\
  \ 实现。对于许多应用程序来说，报告——即使是轻量级报告功能和导出——可以大大提高其有用性。这里的额外优势是部署的简易性，即使在企业环境中也是如此。\n\n##\
  \ ReportSite 项目\n\n用户将通过一个小型网站访问报告，该网站允许他们选择每种报告类型。该网站在 ReportSite 项目中实现，`main.dart`\
  \ 文件设置了初始页面，其中包含按钮的事件处理程序，如下图所示：\n\n![](img/52c05b53a56abd53584e4fed738ed509_229_0.png)\n\
  \n报告的数据来自 REST API 方法，因此如果您希望查看报告，请确保其正在运行。它们以 HTML 形式呈现并显示在同一网页上。以下摘自 `report_latest.dart`\
  \ 文件，展示了其实现方式：\n\n```dart\nquerySelector('body').setInnerHtml(rep.output.toString(),\n\
  \  treeSanitizer: new ReportSanitizer());\n```\n\n这是一个简单的函数调用，参数为页面的 HTML 字符串，那么为什么需要第二个参数呢？这是一个安全措施，以确保用户提供的内容在显示时渲染不包含任何不需要的\
  \ HTML 字符串或脚本。请考虑以下代码片段：\n\n```dart\nclass ReportSanitizer implements NodeTreeSanitizer\
  \ {\n  void sanitizeTree(Node node) {}\n}\n```\n\n`ReportSanitizer` 类是一个 **无操作 (NOP)**\
  \ 实现，因为 HTML 已知来自受信任的来源。\n\n## 报告类\n\n报告由列表中的一系列对象组成，页面元素应基于类似的接口，以便可以在不更改显示或导出功能的情况下将新页面元素添加到包中。\n\
  \n页面元素在 `report_elements.dart` 文件中实现，该文件是 Reports 包项目的一部分。\n\n核心类将称为 `Element`，由于它将被用作其他类的接口，因此将声明如下：\n\
  \n```dart\nabstract class Element {\n  void setContent(var content);\n  String toHtml();\n\
  }\n```\n\n该类声明为抽象类，并未为方法提供实现。\n\n为了演示这一点，我们将考虑 `Title` 页面元素类，它实现了该元素（方法具有 `@override`\
  \ 注解，该注解向代码分析工具和其他开发人员提供反馈，表明该方法是基类的实现）如下：\n\n```dart\nclass Title implements Element\
  \ {\n\n  String content;\n\n  Title(this.content) {}\n\n  @override\n  void setContent(var\
