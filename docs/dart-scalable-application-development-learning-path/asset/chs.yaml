  \n## 工作原理...\n\n在检查模式下，类型通过调用形如 `assert (var1 is T)` 的断言来检查，以确保 `var1` 是类型 `T`。每当你执行赋值、向函数传递参数或从函数返回结果时，都会发生这种检查。\n\
  \n然而，Dart 是一种动态语言，类型是可选的。这就是为什么在生产模式下，VM 必须像 `type` 注解（例如 `int n`）不存在一样执行你的代码；这些注解实际上会被丢弃。因此，在运行时，以下语句\
  \ `int x = 1` 等同于 `var x = 1`。\n\n创建了绑定 `x`，但没有使用 `type` 注解。\n\n> 避免类型检查使生产模式运行得更快。此外，VM\
