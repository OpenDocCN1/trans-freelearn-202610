  \n## 准备工作\n\nDart Editor 使用的一些 JVM 设置存储在 dart 安装目录的 `DartEditor.ini` 文件中。该文件通常包含以下设置（在\
  \ Windows 系统上）：\n\n```\n```ini\n-data\n@user.home\\DartEditor\n-vmargs\n-d64\n-Dosgi.requiredJavaVersion=1.6\n\
  -Dfile.encoding=UTF-8\n-XX:MaxPermSize=128m\n-Xms256m\n-Xmx2000m\n```\n```\n\n在\
  \ Linux 系统上，`-data` 下方的行将是 `@user.home/.dartEditor`。\n\n## 如何操作...\n\n如果你在编辑器中注意到奇怪或不想要的行为，删除\
  \ `settings` 文件夹及其子文件夹（由 `-data` 指向）可以恢复正常。该文件夹根据操作系统的不同位于不同位置；位置如下：\n\n+   - 在\
