  \ `dart` 并按 *Enter* 来测试环境变量。您应该看到以下帮助文本：\n\n**用法：dart [<vm-flags>] <dart-script-file>\
  \ [<dart-options>]**\n\n**执行作为 <dart-script-file> 传入的 Dart 脚本**\n\n### 设置检查模式和生产模式\n\
  \n在开发或维护期间，应用的执行速度并不那么重要，但有关程序执行的信息却很重要。另一方面，当应用被置于客户环境中运行时，需求几乎相反；速度是最重要的，程序暴露的自身信息越少越好。这就是为什么当应用在\
