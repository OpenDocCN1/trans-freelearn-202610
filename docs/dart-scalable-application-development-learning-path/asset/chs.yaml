  棋盘游戏在很大程度上具有相同的结构；用户所看到的（视图）是一个包含网格单元（模型类）的表面，这些单元可以有不同的形状。再加上一些用于随机选择颜色的工具类，这构成了构建棋盘游戏的坚实基础。Dzenan\
  \ Ridjanovic 凭借其在构建游戏项目方面的经验，将这个游戏结构提取到了 boarding 项目中，该项目可在 https://github.com/dzenanr/boarding\
  \ 找到。\n\n### 操作步骤...\n\n从前面的网址下载游戏项目的 zip 压缩包，解压后，在 Dart Editor 中打开。新棋盘游戏的起始代码位于\
  \ lib 文件夹中；名为 boarding 的库（在 boarding.dart 中）导入了视图类 Surface 和 Shape：\n\n```\nlibrary\
  \ boarding;\n\nimport 'dart:html';\nimport 'dart:math';\n\nimport 'package:boarding/boarding_model.dart';\n\
  \npart 'view/shape.dart';\npart 'view/surface.dart';\n```\n\n脚本 boarding_model.dart\
  \ 声明了库 boarding_model，它导入了模型类 Grid、Cell、Cells 和一些工具方法：\n\n```\nlibrary boarding_model;\n\
  \nimport 'dart:math';\n\npart 'model/cell.dart';\n```\n\n```\npart 'model/grid.dart';\n\
  \npart 'util/color.dart';\npart 'util/random.dart';\n```\n\n通过在这些类的基础上进行构建，你可以创建你想要的特定棋盘游戏。具体的实现可以在\
  \ example 文件夹中找到，其中包含一个记忆游戏和一个井字棋游戏（ttt）。例如，记忆游戏的启动脚本导入了两个库，并添加了它自己的特定 Memory 类，该类继承自\
  \ Grid 和 Board 类，而 Board 类又扩展了 Surface：\n\n```\nlibrary memory;\n\nimport 'dart:async';\n\
  import 'dart:html';\nimport 'package:boarding/boarding_model.dart';\nimport 'package:boarding/boarding.dart';\n\
  \npart 'model/memory.dart';\npart 'view/board.dart';\n\nplayAgain(Event e) {\n \
  \ window.location.reload();\n}\n\nmain() {\n  new Board(new Memory(4), querySelector('#canvas')).draw();\n\
  \  querySelector('#play').onClick.listen(playAgain);\n}\n```\n\n### 工作原理...\n\n\
  Surface 类有一个 draw() 方法，用于绘制线条（如果需要）和单元：\n\n```\ndraw() {\n  clear();\n  if (withLines)\
  \ lines();\n  cells();\n}\n```\n\nshape.dart 中的 Circle、Rectangle、Square、Line 和 Tag（用于文本）类知道如何绘制自身。model\
  \ 文件夹中的 Grid 类知道如何使用 Cell 类的对象来构造自身。cell.dart 文件包含 Cell 类的代码，该类可以判断两个单元是否相交，并且还有一个单元集合。将这个项目作为起点，来构建你自己的游戏吧！\n\
  \n### 更多内容...\n\n另一种方法是使用 `window` 类中的 `animationFrame` 方法。使用这种技术，我们在 `main()` 函数中启动\
  \ `gameLoop`，并让它递归调用自身，如下代码所示：\n\n```\nmain() {\n  // redraw\n  window.animationFrame.then(gameLoop);\n\
  }\n\ngameLoop(num delta) {\n  // animation code;\n  window.animationFrame.then(gameLoop);\n\
  }\n```\n\n## 另请参阅\n- - 看看 John McCutchan 的 pub 包 `game_loop`（https://github.com/johnmccutchan/game_loop）。另一个流行的包是\
  \ Bernhard Pichler 开发的 StageXL（www.stagexl.org）。它面向那些希望将项目和技能迁移到 HTML5 的 Flash/ActionScript\
  \ 开发者；视觉效果、动画、声音——一应俱全。\n\n## 在你的应用中使用 WebGL\n\nHTML5 Canvas API 仅允许你在二维空间中绘图。使用\
  \ **Web 图形库（WebGL）**，你可以在任何现代 Web 浏览器中（Internet Explorer 11 仅部分支持 WebGL）显示交互式 2D\
  \ 图形和 3D 图形，而无需使用插件。WebGL 元素绘制在 canvas 元素上，并可以与其他 HTML 元素组合。使用 WebGL 的程序由用于控制的 Dart（或\
  \ JavaScript）代码和特定的 WebGL 着色器代码混合组成。这些着色器代码在计算机的**图形处理单元（GPU）**上执行，使得物理效果和图像处理作为网页画布的一部分获得\
  \ GPU 加速，因此这里实现了真正的并行处理！\n\nWebGL 提供了一个底层 3D API；掌握它需要的不止一篇操作指南，可能需要专门的课程或一本书。不过，本操作指南将在\
  \ `webgl` 项目中为你提供基础知识，并提供一些链接以供进一步了解。\n\n\n\n\n查看项目 webgl 的代码。执行时，我们会看到黑色表面上有一个矩形红点。点击该表面时，会显示新的点：\n\
  \n![](img/52c05b53a56abd53584e4fed738ed509_687_0.png)\n\n## 如何实现...\n\n按照以下步骤开始使用\
  \ WebGL：\n\n- 1. 首先，访问 http://get.webgl.org/ 以确定你的浏览器和 GPU 是否支持 WebGL；你应该会看到一个旋转的立方体。\n\
  - 2. webgl.html 页面简单地定义了一个 `<canvas>` 标签，我们将在这个标签上绘图，代码如下：\n\n    ```\n    <canvas\
  \ id=\"webgl\" style=\"border: none;\" width=\"500\" height=\"500\"></canvas>\n\
  \    ```\n\n- 3. 要在代码中使用 WebGL，请导入 dart_webgl 包：\n\n    ```\n    import 'dart:web_gl';\n\
  \    ```\n\n- 4. 现在定义绘图所需的着色器代码：\n\n    ```\n    // Vertex shader program\n    var\
  \ VSHADER_SOURCE = 'attribute vec4 a_Position;\\n void main() {\\n gl_Position =\
  \ a_Position;\\n gl_PointSize = 10.0;\\n }\\n';\n    ```\n\n    ```javascript\n\
  \    // Fragment shader program\n    var FSHADER_SOURCE = 'void main() {\\n\n  \
  \  gl_FragColor = vec4(1.0, 0.0, 0.0, 1.0);\\n // Set the point color\n    }';\n\
  \    ```\n\n    要将点的顶点坐标设置为固定值，请使用以下代码：\n\n    ```\n    gl_Position = vec4(0.0,\
  \ 0.0, 0.0, 1.0);\n    ```\n\n- 5. `main()` 函数首先获取 canvas 的引用以及 3D 渲染上下文：\n\n  \
  \  ```\n    void main() {\n        // Retrieve <canvas> element\n        var canvas\
  \ = querySelector(\"#webgl\");\n        if (canvas == null) {\n            print('Failed\
  \ to retrieve the <canvas> element');\n        }\n        // Get the rendering context\
  \ for WebGL\n        RenderingContext gl = canvas.getContext3d();\n        if (gl\
  \ == null) {\n            print('Failed to get the rendering context for WebGL');\n\
  \            return;\n        }\n    }\n    ```\n\n- 6. 然后，必须编译着色器代码并将其链接到程序中：\n\
  \n    ```\n    // compiling the GPU code\n    Shader fragShader = gl.createShader(FRAGMENT_SHADER);\n\
  \    gl.shaderSource(fragShader, FSHADER_SOURCE);\n    gl.compileShader(fragShader);\n\
  \n    Shader vertShader = gl.createShader(VERTEX_SHADER);\n    gl.shaderSource(vertShader,\
  \ VSHADER_SOURCE);\n    gl.compileShader(vertShader);\n\n    Program program = gl.createProgram();\n\
  \    gl.attachShader(program, vertShader);\n    gl.attachShader(program, fragShader);\n\
  \    gl.linkProgram(program);\n\n    if (!gl.getProgramParameter(program, LINK_STATUS))\
  \ {\n        print(\"Could not initialise shaders\");\n        return;\n    }\n\
  \    gl.useProgram(program);\n    ```\n\n- 7. 然后，我们获取程序中名为 a_Position 的属性变量的位置索引：\n\
  \n    ```\n    var a_Position = gl.getAttribLocation(program, 'a_Position');\n \
  \   if (a_Position < 0) {\n        print('Failed to get the storage location of\
  \ a_Position');\n        return;\n    }\n    ```\n\n- 8. 我们注册鼠标点击时要调用的事件处理程序：\n\n\
  \    ```\n    canvas.onMouseDown.listen((ev) => click(ev, gl, canvas, a_Position));\n\
  \    ```\n\n- 9. 指定用于清除 `<canvas>` 的颜色。清除画布并绘制点：\n\n    ```\n    gl.clearColor(0.0,\
  \ 0.0, 0.0, 1.0);\n    gl.clear(COLOR_BUFFER_BIT);\n    gl.drawArrays(POINTS, 0,\
  \ 1);\n    ```\n\n- 10. 点击处理程序使用数组 g_points 来记录鼠标点击的位置：\n\n    ```\n    List<num>\
  \ g_points = new List<num>();\n\n    void click(ev, RenderingContext gl, canvas,\
  \ a_Position) {\n        var x = ev.clientX; // x coordinate of a mouse pointer\n\
  \        var y = ev.clientY; // y coordinate of a mouse pointer\n        var rect\
  \ = ev.target.getBoundingClientRect();\n\n        x = ((x - rect.left) - canvas.width\
  \ / 2) / (canvas.width / 2);\n        y = (canvas.height / 2 - (y - rect.top)) /\
  \ (canvas.height / 2);\n\n        // Store the coordinates to g_points array\n \
  \       g_points.add(x);\n        g_points.add(y);\n\n        gl.clear(COLOR_BUFFER_BIT);\n\
  \n        var len = g_points.length;\n        for (var i = 0; i < len; i += 2) {\n\
  \            // Pass the position of a point to a_Position variable\n          \
  \  gl.vertexAttrib3f(a_Position, g_points[i], g_points[i + 1], 0.0);\n         \
  \   gl.drawArrays(POINTS, 0, 1);\n        }\n    }\n    ```\n\n## 工作原理...\n\n第四步中的着色器代码包括顶点着色器程序（用于绘制形状边界）和片段着色器程序（用于颜色、纹理和光照）；它们被硬编码为分配给常量\
  \ VSHADER_SOURCE 和 FSHADER_SOURCE 的字符串。\n\n第六步中的代码看起来有些吓人，但不用担心，这段代码可以直接在其他绘图场景中复用。\n\
  \n第七步是必要的，用于在着色器代码中的 a_Position 变量与 Dart 中同名的变量之间建立联系。请注意，第 8 步和第 10 步中的点击事件处理程序需要将\
  \ GL 上下文和 canvas 作为第二和第三个参数。\n\n## 更多内容...\n\nWebGL 本身没有内置支持来加载普通 3D 文件格式中定义的 3D\
  \ 场景。要显示 3D 场景，需要使用查看器代码或诸如 three.dart 之类的库（它是 Three.js 的一个移植版本，可从 pub 中以 three\
  \ 名称获取）。要创建内容，请使用普通的内容创建工具，并将内容导出为查看器可读取的格式。\n\n## 另请参阅\n\n- 查看并研究 Dart 团队制作的精美\
  \ 3D 太阳系可视化示例，地址为 https://github.com/dart-lang/dart-samples/tree/master/html5/web/webgl/solar3\n\
  - http://www.learnwebgl.com 上的教程由 John Thomas McDole 为 Dart 重写；你可以在 https://github.com/jtmcdole/dart-webgl\
  \ 找到它\n- 想了解更多 WebGL 信息，请访问 http://www.khronos.org/webgl/wiki/Main_Page\n- 如果你想进一步了解着色器（Shader），请访问\
  \ http://aerotwist.com/tutorials/an-introduction-to-shaders-part-1/\n\n## 对 Google\
  \ 服务进行 OAuth2 授权\n\n你一定见过一些网站，可以使用 Google、Facebook 或 Twitter 账号登录，而无需重新输入个人信息。这种服务很可能是由\
  \ OAuth2 驱动的，OAuth2 是开放（网络）授权标准的（第二版）。它为已获得第三方 OAuth2 授权服务器发放访问令牌的客户端，提供对你应用服务端的安全访问。凭据保证由令牌验证，并且不会交给你这个网站所有者。Dart\
  \ 团队和社区为我们提供了一些不错的包，可以轻松实现这一功能。\n\n- 4. 要查看认证返回的内容，我们添加以下代码：\n\n    ```\n    void\
  \ oauthReady(Token token) {\n      print(token);\n    }\n    ```\n\n- 5. 假设我们要使用该令牌访问\
  \ Google+ 个人资料数据并显示用户的完整姓名。进入项目控制台（参考第 2 步），选择 **用 Google API 增强你的应用**，然后选择 **启用\
  \ API**，并启用 Google+ API。进入 API 访问界面，创建一个 **公共 API 访问密钥**。你需要在第 8 步中将该值填入 **plus.key**。\n\
  \n- 6. 现在将 google_plus_v1_api 添加到 pubspec.yaml 文件中，并添加以下导入行：\n\n    ```\n    import\
  \ \"package:google_plus_v1_api/plus_v1_api_browser.dart\" as plusclient;\n    ```\n\
  \n- 7. 在 auth 变量中的 e-mail 作用域之后添加 plusclient.Plus.PLUS_ME_SCOPE。\n\n- 8. 现在将以下代码添加到\
  \ oauthReady：\n\n    ```\n    // get the users full name\n    var plus = new plusclient.Plus(auth);\n\
  \    // set the API key\n    plus.key = \"Axxxxxxxxxxxxxxxxxxxx-x-xxxxxxxxx-x\"\
  ;\n    plus.oauth_token = auth.token.data;\n    plus.people.get(\"me\").then((person)\
  \ {\n      // log the users full name to the console\n      print(\"Hello ${person.name.givenName}\
  \ ${person.name.familyName}\");\n    });\n    ```\n\n## 工作原理...\n\n第 3 到第 5 步说明了如何使用\
  \ OAuth 客户端。点击 **登录** 按钮将显示 Google 登录界面，用户必须在其中输入电子邮件地址和密码，如下面的截图所示：\n\n![](img/52c05b53a56abd53584e4fed738ed509_693_0.png)\n\
  \nGoogle 账号登录界面\n\n接下来会出现一个屏幕，根据你在 auth 变量 `[\"openid\", \"email\"]` 中指定的作用域，授权访问你的应用程序。之后，tokenLoaded\
  \ 事件被触发，返回一个 OAuth 令牌，其回调函数 oauthReady 可以将其打印出来；格式如下（敏感数据用 x 代替）：\n\n```\n[Token\
  \ type=Bearer,\ndata=xxx.xxxx-xxxxxxxxxxxxxxxxxxxx,\nexpired=false,\nexpiry=2014-05-24\
  \ 15:46:19.445,\nemail=xxxxxxxxxxxxxx@gmail.com,\nuserId=xxxxxxxxxxxxxxxxxxxxxx]\n\
  ```\n\n该令牌将被发送到服务器上的 Web 应用程序。总之，用户通过 OAuth2 协议，以现有 Google 账号的身份在你的应用程序中得到认证。\n\n\
  从第 7 步开始，我们使用令牌登录 Google+。在第 9 步中，auth.token 被交给 Google+ 客户端，它会从 Google+ 服务中打印出\
  \ givenName 和 familyName，例如：Hello John Doe。\n\n\n\n\n\n## 处理 Web 应用\n\n通常，如果你想通过\
  \ OAuth2 访问某个 URL `urlxyz`，并且你已经拥有一个 auth token，请使用以下代码：\n\n```\nvar request = new\
  \ HttpRequest();\nrequest.onLoad.listen(...);\nrequest.open(method, urlxyz);\nauth.authenticate(request).then((request)\
  \ => request.send());\n```\n\n### 还有更多...\n\nDart 团队制作了 oauth2 客户端库，它允许你从非 Google\
  \ 服务器获取 OAuth2 授权。有了它，用户可以为你的应用进行身份验证，而无需在你的网站上存储密码。用户通过身份验证后，你的应用将拥有该用户的 oauth2\
  \ token，可用于访问其他服务。要在代码中开始使用它，将 oauth2 添加到你的 pubspec.yaml 依赖项中，让 Dart Editor 中的 pub\
  \ 安装它，或在命令行上调用 pub get。然后，在你的脚本中添加以下内容：\n\n```\nimport 'package:oauth2/oauth2.dart';\n\
  ```\n\n这样做的方式稍微复杂一些，但有了你现在所学的内容，你将能够理解 http://pub.dartlang.org/packages/oauth2 上给出的示例代码。\n\
  \n要在服务器端应用中通过 Facebook、Windows Live 或 Google 进行 OAuth2 身份验证，请使用 Christophe Hurpeau\
  \ 的 pub 包。\n\n### 另请参阅\n\n- 有关 OAuth2 和 Google 的更详细信息，请参阅文章 *Using OAuth2 to access\
  \ Google APIs*，网址为 `https://developers.google.com/accounts/docs/OAuth2?csw=1`\n\
  - 如果你想了解更多关于 OAuth2 的信息，请参考 `http://oauth.net/2/`\n\n## 与 JavaScript 通信\n\n如果我们考虑到存在的庞大\
  \ JavaScript 代码和库的数量，并且仍在不断开发中，那么我们非常需要一种简单的方式从 Dart 应用中使用 JavaScript 代码，特别是为了让\
  \ Dart 访问在同一网页中运行的 JavaScript 代码。最早的尝试使用了 `window.postMessage`，然后构建了一个名为 js 的包。由于这个主题的重要性极大，Dart\
  \ 团队现在为我们提供了一个核心库，`dart:js`，用于与 JavaScript 互操作。这提供了更好的性能，减少了编译后的 JavaScript 文件大小，并且也更容易使用。一旦\
  \ `dart:js` 就绪，js 包已被重写以在内部使用 `dart:js`。\n\n### 如何操作...\n\n请查看项目 `js_interop`，按以下步骤说明：\n\
  \n- 1. 要在我们的项目中使用 `dart:js`，我们必须在代码中导入它：\n  \n  ```dart\n  import 'dart:js';\n \
  \ ```\n\n- 2. 在 `js_interop.html` 中，我们声明一个 Dart 脚本，并且 JavaScript 程序 `js_interop.dart`\
  \ 将查看 `interact.js` 的代码：\n  \n  ```html\n  <script type=\"application/dart\" src=\"\
  js_interop.dart\"></script>\n  <script type=\"application/javascript\"\n    src=\"\
  interact.js\"></script>\n  ```\n\n- 3. `interact.js` 文件包含以下代码：一个变量 `jsvar`，一个具有属性\
  \ name 和 gender 的类 `Person`，以及方法 greeting 和 sayHello：\n  \n  ```javascript\n  var\
  \ jsvar = \"I want Dart\";\n\n  function Person(name, gender) {\n      this.name\
  \ = name;\n      this.gender = gender;\n      this.greeting = function(otherPerson)\
  \ {\n          alert('I greet you ' + otherPerson.name);\n      };\n  }\n\n  Person.prototype.sayHello\
  \ = function () {\n      alert ('hello, I am ' + this.name );\n  };\n  ```\n\n-\
  \ 4. 首先，我们获取 JavaScript 变量的内容：\n  \n  ```dart\n  var dart = context['jsvar'];\n\
  \  print(dart);  // I want Dart\n  ```\n\n- 5. 然后，我们创建一个 `Person` 对象：\n  \n  ```dart\n\
  \  var pers1 = new JsObject(context['Person'], ['An', 'female']);\n  var pers2 =\
  \ new JsObject(context['Person'], ['John', 'male']);\n  ```\n\n- 6. 我们使用以下代码访问和设置属性：\n\
  \n```dart\nprint(pers1['name']); // An\nprint(pers2['gender']); // male\npers1['gender']\
  \ = 'female';\nprint(pers2['gender']); // female\n```\n\n- 7. 我们在 Person 对象上调用方法：\n\
  \n```dart\npers1.callMethod('sayHello', []);\npers2.callMethod('greeting', [pers1]);\n\
  ```\n\n前面的步骤会显示带有消息 **hello, I am An** 和 **I greet you An** 的 alert 窗口。\n\n- 8.\
  \ 现在我们通过 `context` 获取 JavaScript 中的全局对象（通常是 window），并使用 `callMethod` 显示一个 alert\
  \ 窗口：\n\n```dart\ncontext.callMethod('alert', ['Hello from Dart!']);\n```\n\n- 9.\
  \ 使用 `jsify` 创建 JavaScript 对象和数组：\n\n```dart\nvar jsMap = new JsObject.jsify({'a':\
  \ 1, 'b': 2});\nprint(jsMap); // [object Object]\nvar jsArray = new JsObject.jsify([1,\
  \ 2, 3]);\nprint(jsArray); // [1, 2, 3]\n```\n\n### 其工作原理...\n\n`dart:js` 库为 Web\
  \ 应用中的 Dart 提供对 JavaScript 对象的访问，而非服务器应用。更具体地说，它公开了你访问的任何 JavaScript 对象的包装或代理版本。这使得\
  \ Dart 能够安全地将 JavaScript 沙箱化，并防止其问题泄漏到 Dart 应用中。你可以获取和设置属性并在 JavaScript 对象上调用 JavaScript\
  \ 函数和方法，同时在 Dart 和 JavaScript 之间的转换尽可能自动完成。此时，桥接并非完全双向；JavaScript 无法访问 Dart 对象，但可以调用\
  \ Dart 函数。\n\n> 在 HTML `<script src=\"packages/browser/interop.js\"></script>` 代码中包含\
  \ `script` 标签已不再需要。\n\n主要的对象类型是 `JsObject`，我们可以用它来访问 JavaScript 对象；换句话说，我们为 JavaScript\
  \ 对象创建一个 Dart 代理对象。要获取 JavaScript 中的全局对象（大多数情况下是 window），请使用顶级 getter 函数 `context`；这在步骤\
  \ 8 中使用。然而，`context` 也用于获取 JavaScript 变量的值，如步骤 4 所示。\n\n你可以按步骤 5 所示创建 JavaScript\
  \ 对象。使用 JsObject() 构造函数。它接受一个 JavaScript 构造函数函数的名称和它需要的参数列表作为参数。如步骤 6 所示，我们可以使用\
  \ [] 索引运算符获取属性的值，使用 [] = 设置它们；而不是数字索引，我们使用属性名称字符串作为键。第七和第八步演示了我们可以使用 callMethod\
  \ 在对象上调用 JavaScript 方法，参数为方法名称及其参数列表。最后，在步骤 9 中，我们看到 JsObject.jsify 将 Dart map 转换为\
  \ JavaScript 对象，使用键作为属性；相同的方法也将 Dart 列表转换为 JavaScript 数组。\n\n### 还有更多...\n\n为了能够进行比较，我们现在将展示相同的代码，但使用\
  \ js 包重写。在 js_interop2.html 中，我们有相同的 JavaScript，但与 Dart 脚本 js_interop2.dart 一起运行。我们将\
  \ js 包添加到 pubspec.yaml 文件中作为 js:any，并让 pub get 发挥其魔力。为了使该包对我们的 Dart 脚本可用，我们在 js_interop2.dart\
  \ 中添加以下代码：\n\n```\nimport 'package:js/js.dart' as js;\n```\n\n重写 js_interop.dart\
  \ 中的 Dart 代码，我们得到以下输出：\n\n```\nvoid main() {\n  // getting a variable:\n  var dart\
  \ = js.context['jsvar'];\n  print(dart); // I want Dart\n  // making objects:\n\
