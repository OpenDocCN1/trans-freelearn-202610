  \ // [object Object]\n  var jsArray = js.array([1, 2, 3]);\n  print(jsArray); //\
  \ [1, 2, 3]\n}\n```\n\n\n\n\n\n这个语法比 dart:js 稍微容易一些，但由于 js 包中的名称不能被压缩（因为它使用了 dart:mirrors\
  \ 和 noSuchMethod），使用这个库在编译为 JavaScript 时可能会导致代码体积明显增加。如果这对你来说是一个很大的缺点，那就改用 dart:js。我们将在下一个食谱中使用\
  \ js 包来与 Google Visualizations API 进行交互。\n\n### 参见\n\n- 关于如何使用 JavaScript 库的更多信息，请参阅“使用\
  \ JavaScript 库”食谱\n- 一个可让你轻松从 Javascript 调用 Dart 的小型库位于 https://github.com/jptrainor/js_bridge，它是围绕\
  \ dart:js 的一个薄封装层。\n\n## 使用 JavaScript 库\n\n在本食谱中，我们将 js 包作为 Dart 脚本与 Google Chart\
  \ JavaScript API 之间的接口。这为我们提供了丰富且高度可定制的方式来在 Dart Web 应用中图形化表示数据，并且由于它是基于 HTML5/SVG\
  \ 构建的，因此它可以在跨浏览器（甚至包括旧版 IE）和跨平台（也包括 iOS 和 Android）的环境中工作。\n\n### 如何实现...\n\n看一下\
  \ googlechart 项目：\n\n1. 在 HTML 文件的 `<body>` 标签中，放置以下内容：\n\n   ```\n   <div id=\"\
  chart\" style=\"width: 900px; height: 500px;\"></div>\n   <script type=\"text/javascript\"\
  \n     src=\"https://www.google.com/jsapi\"></script>\n   <script type=\"application/dart\"\
  \n     src=\"googlechart.dart\"></script>\n   ```\n\n   带有 ID 为 chart 的 `<div>`\
  \ 标签是图表将被绘制的地方；执行此操作的代码包含在 googlechart.dart 中。\n\n2. 以下是我们想要在图表中表示的数据：\n\n   ```\n\
  \   var listData = [\n     ['Year', 'Sales', 'Expenses'],\n     ['2004', 1000, 400],\n\
  \     ['2005', 1170, 460],\n     ['2006', 660, 1120],\n     ['2007', 1030, 540]\n\
  \   ];\n   ```\n\n3. 导入 js 包之后，我们从 Google API 加载 corechart 包，并告诉我们的代码在完成时执行 drawChart\
  \ 方法：\n\n   ```\n   import 'dart:html';\n   import 'package:js/js.dart' as js;\n\
  \   main() {\n       js.context.google.load('visualization', '1', js.map(\n    \
  \       { 'packages': ['corechart'],\n             'callback': drawChart,\n    \
  \       }));\n   }\n   ```\n\n4. 调用 drawChart 方法然后加载数据并绘制图表：\n\n   ```\n   void\
  \ drawChart() {\n       var gviz = js.context.google.visualization;\n       var\
  \ arrayData = js.array(listData);\n       var tableData = gviz.arrayToDataTable(arrayData);\n\
  \       var options = js.map({\n           'title': 'Company Performance, ',\n \
  \          'hAxis': {'title': 'Year', 'titleTextStyle': {'color': 'red'}}\n    \
  \   });\n       var chart = new js.Proxy(gviz.ColumnChart, querySelector('#chart'));\n\
  \       chart.draw(tableData, options);\n   }\n   ```\n\n执行上述步骤会在浏览器中给出以下输出：\n\n\
  ![](img/52c05b53a56abd53584e4fed738ed509_699_0.png)\n\n使用 js 的 Google Charts\n\n\
  另外，注意当鼠标悬停在柱子上时，会显示一个工具提示，包含该柱子的确切数据。\n\n### 工作原理...\n\n在第一步中，高亮的 script 标签指向在线\
  \ Google 可视化库，这些库必须在你使用它们绘制图表之前动态加载。第二步定义数据；这些数据可以从文件或数据库中加载。在第四步中，我们通过 `js.context`\
  \ 获取对 JavaScript Google Visualizations 对象的引用 `gviz`。然后，数据通过 `js.array` 转换为 JavaScript\
  \ 数组；图表选项（如标题、x 轴、颜色等）通过 `js.map` 传递。然后，我们构造一个代理 `chart` 指向 JavaScript 对象，并在其上调用\
  \ `draw` 方法。\n\n所以基本上，创建一个图表有四个步骤：\n\n1. 加载 `jsapi` 库。\n2. 列出数据。\n3. 配置选项。\n4. 创建图表。\n\
  \n### 参见\n\n- 想了解更多关于 Google Charts 的信息？请访问 `https://google-developers.appspot.com/chart/interactive/docs/`，在那里你可以找到大量的示例。这些示例是用\
  \ JavaScript 编写的，但凭借你现在所掌握的知识，你可以轻松地将它们转换为 Dart。\n"
- "## 6 使用文件和流\n\n在本章中，我们将介绍以下食谱：\n\n- 逐行读取和处理文件\n- 写入文件\n- 在文件中搜索\n- 连接文件\n- 下载文件\n\
  - 使用 Blob\n- 转换流\n\n### 引言\n\n在每种编程语言中，处理文件都是与环境中的数据进行交互的基本操作。处理此功能的类和方法可以在 dart:io\
  \ 包中找到，该包还支持网络（套接字和 HTTP）。这个包只能在 Dart 命令行应用程序中使用，不能在浏览器应用中使用，所以我们的代码运行在 Dart VM\
  \ 中。\n\n在处理文件以及一般的 I/O 操作时，有两种操作模式：\n\n- 同步操作，代码执行等待 I/O 结果\n- 异步操作，代码执行不会被阻塞，在\
  \ I/O 进行期间继续运行\n\n由于 Dart VM 是单线程的，同步调用会阻塞应用程序。因此，出于可扩展性的原因，异步方式是使用 `dart:async`\
  \ 包中的 `Future` 和 `Stream` 类的最佳实践。文件的大多数方法都是成对出现的，包括异步和同步版本，例如 copy 和 copySync。除非你真的必须等待结果，否则请使用异步方式，这样屏幕和应用看起来不会阻塞，并且仍然可以响应。\n\
  \n> 如果你需要回顾，请访问教程 https://www.dartlang.org/docs/tutorials/futures/ 和 https://www.dartlang.org/docs/tutorials/streams/。在本章中，我们将重点介绍处理文件的食谱。\n\
  \n### 逐行读取和处理文件\n\n包含 **逗号分隔值（csv）** 格式数据的文件的结构是每一行包含一个对象的数据，所以我们需要一种逐行读取和处理文件的方法。作为示例，我们使用数据文件\
  \ `winequality-red.csv`，其中包含 1,599 条样本测量结果，每条样本有 12 个数据列，例如 **pH** 和 **alcohol**，以分号（;）分隔，你可以在下面的截图中看到前\
