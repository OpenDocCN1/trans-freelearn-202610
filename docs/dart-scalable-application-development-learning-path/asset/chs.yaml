  \ 是 Dart 提供应用程序并发和并行性的机制。\n\n## 编写游戏循环\n\n在游戏应用中，屏幕的刷新率至关重要；它必须足够高，以确保令人愉快和逼真的游戏体验。刷新意味着定期重绘屏幕。本配方向您展示如何在应用中构建此功能。它在\
