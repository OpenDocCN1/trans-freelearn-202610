  \ error.\n  return var2.asyncFunc().then(processResult);  // Could throw error.\n\
  }\n```\n\n如果我们调用此函数 `mixedFunction(data).catchError(handleError);`，那么 `catchError`\
  \ 无法捕获 `synFunc` 抛出的错误。为了解决这个问题，他们在 `Future.sync` 函数中调用，如下代码所示：\n\n```dart\nmixedFunction(data)\
  \ {\n  return new Future.sync(() {\n    var var1 = synFunc(data);        // Could\
  \ throw error.\n    return var1.asyncFunc().then(processResult);  // Could throw\
  \ error.\n  });\n}\n```\n\n这样，`catchError` 就可以捕获同步和异步错误。\n\n### How it works...\n\
  \n在变体 1 中，`catchError` 将处理在任何已执行的步骤中发生的全部错误。对于变体 2，我们使用一个列表列出所有步骤。`Future.wait`\
  \ 选项会正如其名称所示：它会等待所有步骤完成。但它们执行的顺序并不特定，因此可以并发运行。所有函数都在不等待任何特定函数完成的情况下被触发。当全部完成时，它们的返回值会被收集到一个列表中（此处称为\
  \ `val`）并可进行处理。同样，`catchError` 处理在任何步骤中可能发生的错误。\n\n在发生错误的情况下，List 值不会被返回；我们看到，在\
