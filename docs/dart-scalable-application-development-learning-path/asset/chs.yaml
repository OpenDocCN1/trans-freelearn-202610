  \ 50 bytes\n7.3;0.65;0;1.2;0.065;15;21;0.9946;3.39;0.47;10;7: 48 bytes\n7.8;0.58;0.02;2;0.073;9;18;0.9968;3.36;0.57;9.5;7:\
  \ 49 bytes\n```\n\n- 2. 将每行数据提取到一个对象中，如下面的代码所示：\n\n```dart\nprocessLines(List<String>\
  \ lines) {\n  // process lines:\n  for (var line in lines) {\n    print(line);\n\
  \    // when not header line, split line on separator:\n    if (!header) {\nList<String>\
  \ fields = line.split(\",\");\nWine wn = new Wine();\nwn.fixed_acidity = fields[0];\n\
  wn.volatile_acidity = fields[1];\n// extracting remaining properties\nwn.alcohol\
  \ = fields[10];\nwn.quality = fields[11];\nprint(wn);\n}\nheader = false;\n}\n}\n\
  class Wine {\n    var fixed_acidity;\n    var volatile_acidity;\n    // other properties\n\
  \    var alcohol;\n    var quality;\n\n    toString() => \"This wine has $fixed_acidity\
  \ fixed acidity,\"\n    \"alcohol % of $alcohol and quality $quality.\";\n}\n```\n\
  \n上述代码给出的输出是 **这款葡萄酒的固定酸度为 6.8，酒精含量为 11.3%，质量为 6**。\n\n- 3. 使用 openRead 方法作为替代方案，如下面的代码所示：\n\
  \n```dart\nmain() {\n  File data= new File(\"../winequality-red.csv\");\n  // using\
  \ openRead:\n  Stream<List<int>> input = data.openRead();\n  input\n  .transform(UTF8.decoder)\
  \ // Decode to UTF8.\n  // Convert stream to individual lines.\n  .transform(const\
  \ LineSplitter())\n  .listen((String line) { // Callback to process results.\n \
  \   print('$line: ${line.length} bytes');\n    // Further processing of line, e.g.\
  \ as in processLines\n  }, onDone: () {\n    print('File is now closed.');\n  },\
  \ onError: (e) {\n    print(e.toString());\n  });\n}\n```\n\n```dart\nprint(data);\n\
  // [228, 189, 160, 229, 165, 189, 228, 184, 150, 231, 149, 140]\nprint(UTF8.decode(data));\
  \ // prints '你好世界'.\n});\n```\n\n- 4. 我们可以使用 openWrite 写入文件，如下面的代码所示：\n\n```dart\n\
  var file = new File('out3.txt');\nvar sink = file.openWrite();\nsink.write('File\
  \ was written to at ${new DateTime.now()}\\n');\n// close the IOSink to free system\
  \ resources!\nsink.close();\n}\n```\n\n## 工作原理...\n\n第 1 步使用异步的 writeAsString 方法将一个（大的）字符串写入文件，然后该文件会自动关闭。在由\
  \ then 调用的回调函数中，例如，你可以通过网络发送该文件。第 2 步展示了如何使用 writeAsBytes 将原始字节写入文件。当文件包含不可读字符或\
  \ Unicode 字符时，这是必需的。\n\n## 更多内容...\n\n如果我们想要分块写入文件，该怎么办？这时，我们使用第 3 步中所示的 openWrite\
  \ 方法。当在 File 对象上调用此方法时，它会为该文件创建一个 IOSink 对象，你可以使用以下任意方法向其写入：write、writeln、writeCharCode、writeAll。与前几步的\
  \ write 方法相比，IOSink 对象在不再需要时必须显式关闭。openWrite 方法接受两个可选参数，如下面的代码所示：\n\n```dart\nfile.openWrite(mode:\
  \ FileMode.APPEND, encoding: ASCII);\n```\n\n默认模式是 FileMode.WRITE。\n\n## 在文件中搜索\n\
  \n在本节中，我们演示如何搜索文本文件中的特定词语。你可以在项目 searching_file 的 search.dart 脚本中找到相关代码。我们使用 taoprog.txt\
  \ 作为示例文本文件。\n\n-n 标志是可选的；如果包含该标志，我们会看到行号打印在该行的前面。\n\n以下是脚本中的代码：\n\n```dart\nimport\
  \ 'dart:io';\nimport 'package:args/args.dart';\n\nconst HOWTOUSE = 'usage: dart\
  \ search.dart [-n] search-pattern file';\nconst LINENO = 'line-number';\nArgResults\
  \ argResults;\nvar searchTerms = \"\";\nFile file;\n```\n\n执行以下步骤在文件中搜索：\n\n- 1.\
  \ 我们可以使用 args 包搜索文件，如下面的代码所示：\n\n```dart\nvoid main(List<String> args) {\n  final\
  \ parser = new ArgParser()..addFlag(LINENO, negatable:\n  false, abbr: 'n');\n \
  \ argResults = parser.parse(args);\n  if (argResults.rest.length < 2) {\n    print(HOWTOUSE);\n\
  \    exit(1);\n  }\n}\n```\n\n- 2. 我们可以通过获取文件名和搜索词来搜索文件，如下面的代码所示：\n\n```dart\nfinal\
  \ strFile = argResults.rest.last;\nFile file = new File(strFile);\nsearchTerms =\
  \ argResults.rest.sublist(0,\nargResults.rest.length - 1);\nsearchFile(file, searchTerms);\n\
  }\n```\n\n- 3. 我们可以通过读取文件并搜索来搜索文件，如下面的代码所示：\n\n```dart\nsearchFile(File file, searchTerms)\
  \ {\n  file.readAsLines().then(searchLines).catchError(print);\n}\n\nsearchLines(lines)\
  \ {\n  for (var i = 0; i < lines.length; i++) {\n    for (var j = 0; j < searchTerms.length;\
  \ j++) {\n      if (lines[i].contains(searchTerms[j])) {\n        printMatch(lines[i],\
  \ i);\n      }\n    }\n  }\n}\n```\n\n- 4. 我们可以通过打印找到的匹配行来搜索文件，如下面的代码所示：\n\n```dart\n\
  void printMatch(String line, int i) {\n    StringBuffer sb = new StringBuffer();\n\
  \    if (argResults[LINENO]) sb.write('${i + 1}: ');\n    sb.write(line);\n    print(sb.toString());\n\
  }\n```\n\n## 工作原理...\n\n在第 1 步中，我们看到使用 args 包解析命令行参数。选项 -n 要么存在，要么不存在（开或关，是一个布尔值），这就是为什么它作为标志添加到解析器对象中；negatable:false\
  \ 防止你将 no-n 作为参数写入。我们进行解析，然后检查是否至少有两个参数（一个搜索词和一个文件名）。如果没有，则显示常量 HOWTOUSE 中的字符串作为帮助选项。第\
  \ 2 步准备场景；最后一个参数是文件名，由 sublist 方法给出的其余参数是搜索词列表。\n\n实际的搜索发生在第 3 步；我们使用 readAsLines\
  \ 方法读取文件。当读取完成后，回调函数 searchLines 在嵌套的 for 循环中被调用，其中每一行依次针对所有搜索词进行测试，看它是否包含该词。因此\
  \ printMatch 会打印该行，并且如果指定了 -n，还会在该行前面打印行号。\n\n## 另请参阅\n\n- 有关使用 args 包的更多信息，请参阅第\
  \ 2 章“构建、测试和部署应用程序”中的“解析命令行参数”一节，网址为 https://pub.dartlang.org/packages/args\n- 你可以在\
  \ https://code.google.com/p/dart/source/browse/branches/bleeding_edge/dart/samples/dgrep/bin/dgrep.dart\
  \ 找到一个递归搜索文件夹结构的示例。\n\n## 拼接文件\n\n假设我们有一些文本文件，想要将它们拼接成一个大文件。本节中的代码位于项目 concat_files\
  \ 中，展示了如何实现这一点。\n\n## 如何实现...\n\n该程序在 `bin` 文件夹中从命令行启动（或者在 Dart Editor 中使用 Managed\
  \ Launch 并设置脚本参数 `file1.txt file2.txt file.txt`），命令为 `dart concat.dart file1.txt\
  \ file2.txt file.txt`，其中 `file1.txt` 和 `file2.txt` 是要拼接（可以有两个或更多文件）到 `file.txt`\
  \ 中的文件。以下是执行此操作的代码：\n\n```dart\nimport 'dart:io';\nimport 'package:args/args.dart';\n\
  \nArgResults argResults;\nFile output;\n\nvoid main(List<String> arguments) {\n\
  \  final parser = new ArgParser();\n  argResults = parser.parse(arguments);\n  final\
  \ outFile = argResults.rest.last;\n  List<String> files = argResults.rest.sublist(0,\
  \ argResults.rest.length - 1);\n  if (files.isEmpty) {\n    print('No files provided\
  \ to concatenate!');\n    exit(1);\n  }\n  output = new File(outFile);\n  if (output.existsSync())\
  \ {\n    output.delete();\n  }\n  concat(files);\n}\n\nconcat(List<String> files)\
  \ {\n  for (var file in files) {\n    var input = new File(file);\n    try {\n \
  \     var content = input.readAsStringSync();\n      content += \"\\n\";\n     \
  \ output.writeAsStringSync(content, mode: FileMode.APPEND);\n    } catch (e) {\n\
  \      print(\"An error $e occurred\");\n    }\n  }\n}\n```\n\n\n\n## 使用文件和流\n\n\
  ### 它是如何工作的...\n\n我们使用 args 包来获取输出文件名和要连接的文件。开始时输出文件为空，我们在它已存在时删除它。然后，我们遍历所有输入文件，依次读取输入文件并以追加模式写入输出。我们以同步模式执行所有这些操作，因为我们不希望文件内容混杂。\n\
  \n### 更多内容...\n\n在 concat_files 文件夹内的 concat2.dart 中，我们看到一个异步版本也适用于这里——只有 concat\
  \ 方法中的代码需要更改。请看以下代码：\n\n```\nIOSink snk;\n\nFuture concat(List<String> files) {\n\
  \  snk = output.openWrite(mode: FileMode.APPEND);\n  return Future.forEach(files,\
  \ (file) {\n    Stream<List<int>> stream = new File(file).openRead();\n    return\
  \ stream.transform(UTF8.decoder)\n      .transform(const LineSplitter())\n     \
  \ .listen((line) {\n        snk.write(line + \"\\n\");\n      }).asFuture().catchError((_)\
  \ => _handleError(file));\n  });\n}\n\n_handleError(String file) {\n  FileSystemEntity.isDirectory(file).then((isDir)\
  \ {\n    if (isDir) {\n      print('error: $file is a directory');\n    } else {\n\
  \      print('error: $file not found');\n    }\n  });\n}\n```\n\n我们使用 openWrite\
  \ 方法以追加模式向 IOSink 对象 snk 写入。Future.forEach 方法异步地对每个文件运行提供的回调。forEach 方法按顺序为每个元素运行回调，仅在回调返回的\
  \ Future 完成时才移动到下一个元素。流被转换；这里使用转换器将数据转换为 UTF-8 并将字符串值拆分为单独的行。\n\n### 另请参阅\n\n- 请参阅第\
  \ 2 章 *Structuring, Testing, and Deploying an Application* 中的 *Parsing command-line\
  \ arguments* 食谱，了解有关使用 `args` 包的更多信息，以及本章中的 *Transforming streams* 食谱。\n\n## 下载文件\n\
  \n本食谱向您展示了通过代码下载文件的最简单方法，首先在命令行应用程序中，然后从 Web 应用程序中。作为示例，我们从 http://learningdart.org\
  \ 下载 Learning Dart 网站的首页。\n\n### 准备工作\n\n客户端程序（无论是 Web 还是命令行）使用 HTTP 协议从 Web 服务器接收内容，例如文件或网页。`dart:html`\
  \ 和 `dart:io` 包为我们提供了执行此操作所需的基本类，分别是：\n\n- `Uri` 类（来自 `dart:core`）具有解析、编码和解码 Web\
  \ 地址所需的一切；方法 `Uri.parse` 常被使用\n- `HttpRequest` 类（来自 `dart:html`）具有 `getString` 方法来从\
  \ URL 获取文件\n- `HttpClient` 类（来自 `dart:io`）具有各种方法，例如 `get` 和 `post`，用于向 Web 服务器发送请求（类\
  \ `HttpClientRequest`）并获取响应（类 `HttpClientResponse`）\n\n### 如何操作...\n\n1. 对于 Web\
  \ 应用，这在 `download_string.dart` 中显示，该文件从 `download_string.html` 启动（这些文件可以在 `download_file`\
  \ 项目中找到），如下所示的代码：\n\n```\nimport 'dart:html';\n\nmain() {\n  HttpRequest.getString('http://learningdart.org')\n\
  \    .then(processString)\n    .catchError(print);\n}\n\nprocessString(str) {\n\
  \  print(str);\n}\n```\n\n对于命令行应用，首先我们使用静态方法 parse 将 Web 地址字符串转换为 Uri 对象。然后我们创建一个\
  \ HttpClient 对象并在 URL（Uri 对象）上调用 getUrl 请求。这分为两个步骤，每个步骤都返回一个 Future，分别是：\n\n- 第一个\
  \ .then 完成时得到一个已创建但尚未发送的请求对象。在回调中，您仍可以更改或添加请求头或正文。调用 close 会将请求发送到服务器。此步骤用于创建请求并发送它。\n\
  - 第二个 .then 在从服务器接收到响应对象时完成，您可以访问头和正文（正文作为流可用）。此步骤用于处理响应；在这里，我们调用 writeToFile。\n\
  \n> 如果有正文，必须对其进行处理。通过调用 drain() 方法避免内存泄漏。\n\n在 writeToFile 中，我们读取响应数据，将其从 UTF-8\
  \ 转换为字符串（由将列表转换为字符串的 join 方法帮助），并使用 writeAsString 将其写入文件。当此操作完成时，HttpClient 对象被关闭；这会释放已建立的网络连接。\n\
  \n### 更多内容...\n\n以下是用于命令行应用以实现相同功能的某些变体：\n\n### 使用管道\n\n命令行中的 .then 变量可以简化为以下内容：\n\
  \n```\n.then((HttpClientResponse resp) => resp.pipe(new\n  File('dart.txt').openWrite()));\n\
  ```\n\n响应对象上的 pipe 方法可以将流立即发送到要写入的文件。这在下载较大文件时性能更好。\n\n### 使用 http 包\n\n使用 Dart\
  \ 团队提供的 http 包可以采取更简化的方式，该包旨在便于编码请求和响应（参见 download_file2.dart）。请看以下代码：\n\n```\n\
  import 'dart:io';\nimport 'package:http/http.dart' as http;\n\nmain() {\n  var url\
  \ = Uri.parse('http://learningdart.org');\n```\n\n```\nhttp.get(url).then((response)\
  \ {\nnew File('dart.txt').writeAsBytes(response.bodyBytes);\n});\n}\n```\n\n###\
  \ 另请参阅\n\n- 请参阅 *Writing to a file* 食谱，了解有关 `writeAsBytes` 方法的信息\n\n## 使用 blob\n\
  \n在上一食谱的步骤 1 中，我们使用了客户端 `HttpRequest` 对象及其方法 `getString`。在本食谱中，我们想要下载一个 blob（二进制大对象）文件，例如大型图像、音频或视频文件。但首先，如果您需要做的不仅仅是从\
  \ URL 资源下载字符串在客户端处理它，则需要为此做好准备。您需要执行以下步骤（代码请参见 `request_prep.dart`，位于项目 `request_blob`\
  \ 中）。\n\n### 准备工作\n\n1. 创建一个 `HttpRequest` 对象，如以下代码所示：\n```\nimport 'dart:html';\n\
  \nvoid main() {\nvar path = 'http://learningdart.org';\nvar request = new HttpRequest();\n\
  ```\n2. 打开它（这里使用 HTTP GET 方法），如以下代码所示：\n```\nrequest\n..open('GET', path)\n```\n\
  3. 在此阶段，我们也可以使用 `setRequestHeader()` 方法配置其头，例如 `request.setRequestHeader('Content-type','application/json')`\
  \ 当您发送 JSON 字符串时。\n4. 定义一个回调函数，例如 `requestComplete`，在响应返回时执行；这是在 `onLoadEnd` 事件中完成的，如以下代码所示：\n\
  ```\n..onLoadEnd.listen((e) => requestComplete(request))\n```\n5. 使用 `send` 方法发出请求，如以下代码所示：\n\
  ```\n..send();\n}\n```\n\n这里，我们发送一个空字符串，因为它是一个 GET 请求，但对于 POST 请求，我们可以发送数据，例如 request.send(JSON.encode(data));。\n\
  \n在回调中，我们测试请求的状态是否为 200；如果一切正常，我们可以处理 responseText。请看以下代码：\n\n```\nrequestComplete(HttpRequest\
  \ request) {\n  if (request.status == 200) {\n    print('headers: ${request.responseHeaders}');\n\
  \    print('type: ${request.responseType}');\n    print('text: ${request.responseText}');\n\
  \  }\n  else {\n    print('Request failed, status=${request.status}');\n  }\n}\n\
  ```\n\n### 如何操作...\n\n现在，我们向您展示如何对 blob 执行相同的操作，在 request_blob.dart 中（从 request_blob.html\
  \ 运行）使用以下代码：\n\n```\nimport 'dart:html';\n```\n\n1. 要创建 FileReader 对象，请使用以下代码：\n\
  \n```\nFileReader flr = new FileReader();\nImageElement img;\n\nvoid main() {\n\
  \  img = document.querySelector('#anImage');\n  // var path = 'stadium.jpg';\n \
  \ var path =\n    'https://farm1.staticflickr.com/2/\n1418878_1e9228336_m.jpg';\n\
  ```\n\n2. 要为 blob 构建请求，请使用以下代码：\n\n```\nvar request = new HttpRequest();\nrequest\n\
  ..open('GET', path)\n..responseType = 'blob'\n..overrideMimeType(\"image/jpg\")\n\
  ..onLoadEnd.listen((e) => requestComplete(request))\n..send('');\n```\n\n\n\n3.\
  \ 要处理响应，请使用以下代码：\n\n```\nrequestComplete(HttpRequest request) {\n  if (request.status\
  \ == 200 && request.readyState == HttpRequest.DONE) {\n    Blob blob = request.response;\n\
  \    flr.onLoadEnd.listen( (e) {\n      img.src = flr.result;\n    });\n    flr.readAsDataUrl(blob);\n\
  \  }\n  else {\n    print('Request failed, status=${request.status}');\n  }\n}\n\
  ```\n\n使用 5 MB 的文件 stadium.jpg 试试。\n\n## How it works...\n\n要读取 blob，我们需要一个 FileReader\
  \ 对象；我们在步骤 1 中构造了它。在步骤 2 中，我们构建请求对象，它相当通用，只是我们设置了 responseType 和 mimeType。在步骤 3\
  \ 的回调函数中，我们使用 request.readyState == HttpRequest.DONE 进行测试，以确保请求已完全处理。然后，我们执行了以下步骤：\n\
  \n- 我们从 dart:html 中的 Blob 类创建了一个 Blob 对象并将其设置为响应\n- 我们使用 readAsDataUrl 方法读取 blob\n\
  - 当此操作完成时（由 onLoadEnd 事件发出信号），图像标签的源被设置为 FileReader 对象的结果\n\n## Transforming streams\n\
  \n监听流会捕获来自类似事件的操作的结果序列，例如在网页上单击按钮或使用 openRead 方法打开文件。这些结果是可以处理的数据，但发生的错误也是流的一部分。Dart\
  \ 可以以非常函数式的方式处理流，例如使用 where 过滤结果或将结果映射到新流（有关这些方法的完整列表，请参阅 https://api.dartlang.org/apidocs/channels/stable/dartdoc-viewer/dart:async.Stream）。要修改传入的结果，我们还可以使用转换器；本食谱向您展示如何执行此操作（请参阅项目\
  \ transforming_stream）。\n\n## How to do it...\n\n在我们的脚本中，我们有一个列表 persons，其中项目本身是包含姓名和性别的列表。我们想遍历列表并根据人员的性别发出问候消息，但如果性别未知，则跳过该人员。以下代码向我们展示了如何使用转换器执行此操作：\n\
  \n```\n```dart\nimport 'dart:async';\n\nvar persons = [\n  ['Carter', 'F'],\n  ['Gates',\
  \ 'M'],\n  ['Nuryev', 'M'],\n  ['Liszt', 'U'],\n  ['Besançon', 'F']\n];\n\nvoid\
  \ main() {\n```\n```\n\n我们需要执行以下步骤来转换流：\n\n- 1. 要从列表制作流，请使用以下代码：\n  \n      ```dart\n\
  \      var stream = new Stream.fromIterable(persons);\n      ```\n  \n- 2. 要定义流转换器，请使用以下代码：\n\
  \  \n      ```dart\n      var transformer = new\n          StreamTransformer.fromHandlers(handleData:\
  \ convert);\n      ```\n  \n- 3. 要过滤和转换流并监听其输出以进一步处理，请使用以下代码：\n  \n      ```dart\n\
  \      stream\n        .where((value) => value[1] != 'U')\n        .transform(transformer)\n\
  \        .listen((value) => print(\"$value\"));\n      }\n      ```\n\n```\n```dart\n\
  convert(value, sink) {\n  // Create a new value from the original value\n  var greeting\
  \ = \"Hello Mr. or Mrs. ${value[0]}\";\n  if (value[1] == 'F') {\n    greeting =\
  \ \"Hello Mrs. ${value[0]}\";\n  }\n}\n```\n```\n\n```\nelse if (value[1] == 'M')\
  \ {\n    greeting = \"Hello Mr. ${value[0]}\";\n}\n    sink.add(greeting);\n}\n\
  ```\n\n执行上述步骤后，我们得到以下输出：\n\nHello Mrs. Carter\n\nHello Mr. Gates\n\nHello Mr. Nureyev\n\
  \nHello Mrs. Besançon\n\n## How it works...\n\n要将列表转换为流，我们使用了步骤 1 中的 fromIterable\
  \ 方法。丢弃流中的某些值可以使用 where 来完成；请参阅步骤 3 中的第一个子句。\n\n步骤 2 详细说明了如何转换流。此方法采用一个对象（此处称为 transformer）属于\
  \ StreamTransformer 类，它允许您更改流的内容。名为 fromHandlers 的构造函数采用可选的 handleData 参数，该参数为流中传递的每个值调用我们的回调函数\
  \ convert。convert 选项基于旧值的 content 构建新值并将其添加到 sink 变量的旧值位置。只有这些转换后的值才会输出到流，传递给 listen，并在那里处理。sink\
  \ 选项是抽象类 StreamSink 的实例，它是数据的通用目的地，可以由任何数据接收器实现。\n\n## There's more...\n\n我们已经在本章中使用\
  \ transform 读取文件，其中使用 openRead，如以下代码所示：\n\n```\nStream<List<int>> input = file.openRead();\n\
  input\n.transform(UTF8.decoder)\n.transform(const LineSplitter())\n```\n\n## Creating\
  \ a web server\n\n类 `HttpServer` 用于编写 Web 服务器；该服务器侦听（或绑定到）特定主机和端口以接收传入的 HTTP 请求。它提供事件处理程序（在本例中更恰当地称为\
  \ `request` 处理程序），当从 Web 客户端接收到带有传入数据的请求时触发。\n\n## How to do it...\n\n我们从模板命令行应用程序开始创建一个名为\
  \ `simple_webserver` 的项目并按如下方式导入 `dart:io`：\n\n```\nimport 'dart:io';\n//Define\
  \ host and port:\nInternetAddress HOST = InternetAddress.LOOPBACK_IP_V6;\nconst\
  \ int PORT = 8080;\n\nmain() {\n  // Starting the web server:\n  HttpServer.bind(HOST,\
  \ PORT)\n    .then((server) {\n      print('server starts listening on port ${server.port}');\n\
  \      // Starting the request handler:\n      server.listen(handleRequest);\n \
  \   })\n    .catchError(print);\n}\n\nhandleRequest(HttpRequest req) {\n  print('request\
  \ coming in');\n  req.response\n    ..headers.contentType = new ContentType(\"text\"\
  , \"plain\",\n      charset: \"utf-8\")\n    ..write(' I heard you loud and clear.')\n\
  \    ..write(' Send me the data!')\n    ..close();\n}\n```\n\n## Working with Web\
  \ Servers\n\n这会产生以下服务器控制台输出：\n\n![](img/52c05b53a56abd53584e4fed738ed509_726_0.png)\n\
  \n来自 Web 服务器的控制台输出\n\n然后，使用 URL `http://localhost:8080` 启动任何浏览器，以查看响应文本出现在客户端，如以下屏幕截图所示：\n\
  \n![](img/52c05b53a56abd53584e4fed738ed509_726_1.png)\n\n浏览器客户端显示响应\n\n## There\
  \ is more...\n\n`HttpRequest` 对象还具有提供有关客户端请求的信息的属性；其中最重要的如下：\n\n- `method`：这是从 Web\
  \ 表单提交方式派生的。在 `<form action=\"http://localhost:4041\" method=\"GET\">` 代码中，其值可以是\
  \ **GET, POST, PUT,** 或 **DELETE**。\n- `headers`：这提供了有关请求的一般信息，例如内容类型、内容长度和日期。\n\
  - `uri`：这给出了请求源自的位置。\n\n## Posting JSON-formatted data\n\n这是一个客户端 Web 应用的食谱，它向 Web\
  \ 服务器发送请求。请求包含以 JSON 格式发布的表单数据。\n\n## How to do it...\n\n查看项目 post_form 以获取代码。\n\
  \n- 1. 我们的表单（参考下图）将发布 IT 工作的数据；我们重用类 Job 在您的类食谱中从第 4 章《面向对象》中的 Making toJSON 和 fromJSON\
  \ 方法。我们保持示例简短简单，但添加了两个新属性 posted 和 open。请看以下代码：\n  ```\n  class Job {\n      String\
  \ type;\n      int salary;\n      String company;\n      DateTime posted; // date\
  \ of publication of job\n      bool open = true; // is job still vacant ?\n    \
  \  Job(this.type, this.salary, this.company, this.posted);\n      // toJSON and\
  \ fromJSON methods\n  }\n  ```\n- 2. 模型类通过以下代码在 post_form.dart 中的代码中可用：\n  ```\n\
  \  import '../model/job.dart';\n  ```\n- 3. 我们使用以下代码为提交按钮添加自己的事件处理程序：\n  ```\n \
  \ void main() {\n      querySelector(\"#submit\").onClick.listen(submitForm);\n\
  \  }\n  ```\n- 4. 方法 submitForm 按如下方式制作并发送请求：\n  ```\n  submitForm(e) {\n      e.preventDefault();\
  \ // Don't do the default submit.\n      // send data to web server:\n      req\
  \ = new HttpRequest();\n      req.onReadyStateChange.listen(onResponse);\n     \
  \ // POST the data to the server.\n      var url = 'http://127.0.0.1:PORT';\n  \
  \    req.open('POST', url);\n      req.send(_jobData()); // send JSON String to\
  \ server\n  }\n  ```\n\n\n\n\n以下截图展示了发送数据后我们屏幕的样子：\n\n![](img/52c05b53a56abd53584e4fed738ed509_729_0.png)\n\
  \n客户端发送任务数据\n\n在前一张截图中，没有显示服务器，因为没有Web服务器来处理请求。\n\n### 工作原理...\n\n在第1步中，我们添加了一个\
  \ `DateTime` 属性。这种类型不能原生地序列化为JSON；encode方法不知道如何处理这种情况。我们必须自己定义，并提供 `toEncodable`\
  \ 闭包作为 `JSON.encode` 的第二个可选参数；这会返回一个恰当的DateTime序列化。以下是 `Job` 类中修改后的 `toJson` 方法：\n\
  \n```\nString toJson() {\n  var jsm = new Map<String, Object>();\n  jsm[\"type\"\
  ] = type;\n  jsm[\"salary\"] = salary;\n  jsm[\"company\"] = company;\n  jsm[\"\
  posted\"] = JSON.encode(posted, toEncodable: (p) {\n    if(p is DateTime)\n    \
  \  return p.toIso8601String();\n    return p;\n  });\n  jsm[\"open\"] = open;\n\
  \  var jss = JSON.encode(jsm);\n  return jss;\n}\n```\n\n2. `acceptRequests` 函数描述了Web服务器如何基于请求方法处理传入的请求，如下所示：\n\
  \n```\nvoid acceptRequests(server) {\n    server.listen((HttpRequest req) {\n  \
  \      switch (req.method) {\n            case 'POST':\n                handlePost(req);\n\
  \                break;\n            case 'GET':\n                handleGet(req);\n\
  \                break;\n            case 'OPTIONS':\n                handleOptions(req);\n\
  \                break;\n            default: defaultHandler(req);\n        }\n\
  \    },\n    onError: handleError, // Listen failed.\n    onDone: () => print('Web\
  \ server shuts down.'));\n    print('Listening for GET and POST on http://$HOST:$PORT');\n\
  }\n```\n\n3. 不同的请求处理器在以下代码中展示：\n\n```\nvoid handlePost(HttpRequest req) {\n    HttpResponse\
  \ res = req.response;\n    addCorsHeaders(res);\n    res.statusCode = HttpStatus.OK;\n\
  \    req.listen(processData, onError: handleError);\n}\n\nprocessData(List<int>\
  \ buffer) {\n    res.write('OK, I received: ');\n    res.write(new String.fromCharCodes(buffer));\n\
  \    // process incoming data\n    res.close();\n}\n\nhandleGet(HttpRequest req)\
  \ { // not needed here }\n\nvoid handleOptions(HttpRequest req) { // not needed\
  \ here }\n\nvoid addCorsHeaders(HttpResponse res) {\n    res.headers.add('Access-Control-Allow-Origin',\
  \ '*');\n    res.headers.add('Access-Control-Allow-Methods', 'POST, OPTIONS');\n\
  \    res.headers.add('Access-Control-Allow-Headers',\n    'Origin, X-Requested-With,\
  \ Content-Type, Accept');\n}\n\nvoid defaultHandler(HttpRequest req) {\n    res\
  \ = req.response;\n    res.statusCode = HttpStatus.METHOD_NOT_ALLOWED;\n    res.write('Unsupported\
  \ request: ${req.method}.');\n    res.close();\n}\n\nhandleError(e) {\n    print(e);\n\
  \    // other error handling\n}\n```\n\n运行上一个技巧中的客户端（启动 `web\\post_form.html`）并以JSON格式向服务器提交一个任务。Web服务器会回传确认信息并将数据返回给客户端。客户端显示以下响应：\n\
  \n![](img/52c05b53a56abd53584e4fed738ed509_732_0.png)\n\nWeb服务器的响应\n\n### 更多内容...\n\
  \n如果服务器需要为响应设置内容类型，请在 `handlePost` 中首次写入响应之前执行以下操作：\n\n```\nres.headers.contentType\
  \ =\nnew ContentType(\"application\", \"json\", charset: 'utf-8');\n```\n\n在这里，我们明确表示将使用UTF-8字符集发送JSON数据。\n\
  \n### 将数据写入服务器上的文件\n\n如果我们想把从客户端接收到的数据写入文件，可以这样做：\n\n- 在 `handlePost` 的 `req.listen`\
  \ 之前添加以下代码行：\n\n  ```\n  BytesBuilder builder = new BytesBuilder();\n  ```\n\n-\
  \ 在以下代码中，我们看到 `processData`：\n\n  ```\n  processData(List<int> buffer) {\n    builder.add(buffer);\n\
  \  }\n  ```\n\n- builder 对象通过 add 方法分块收集缓冲数据，直到所有数据传递完毕。然后，调用 `acceptRequests` 中的\
  \ `onDone` 回调，例如 `onDone: writeToFile`）。在以下代码中，我们看到 `writeToFile`：\n\n  ```\n  writeToFile(builder)\
  \ {\n    var strJson = UTF8.decode(builder.takeBytes());\n    var filename = \"\
  jobs.json\";\n    new File(filename).writeAsString(strJson, mode:\n      FileMode.APPEND).then((_)\
  \ {\n      res.write('Job data was appended to file');\n      res.close();\n   \
  \ });\n  }\n  ```\n\n### 另请参阅\n\n- 有关CORS的更多信息，请参阅*第5章，处理Web应用程序*中的*使用CORS头*技巧。\n\
  \n## 使用 http_server 提供文件服务\n\nWeb服务器的基本功能之一，也是我们视为理所当然的功能，就是提供静态文件服务。我们可以完全使用 dart:io\
  \ 中的类来编写这种功能，但Dart团队编写了一个名为 http_server 的pub包，旨在简化Web服务器编程以提供Web内容。在本技巧中，我们将使用 http_server\
  \ 来编写一个提供文件服务的Web服务器。你可以在 serving_files 项目中找到相关代码。\n\n### 操作步骤...\n\n执行以下步骤来构建一个提供文件服务的Web服务器：\n\
  \n1. 在第一个示例 `serving_file.dart` 中，你会看到一个Web服务器的代码，它提供名为 `Learning Dart Packt Publishing.html`\
  \ 的文件：\n\n   ```dart\n   import 'dart:io';\n   import 'package:http_server/http_server.dart';\n\
  \n   InternetAddress HOST = InternetAddress.LOOPBACK_IP_V6;\n   const PORT = 8080;\n\
  \n   void main() {\n     VirtualDirectory staticFiles = new VirtualDirectory('.');\n\
  \     HttpServer.bind(HOST, PORT).then((server) {\n       server.listen((req) {\n\
  \         staticFiles.serveFile(new File('Learning Dart Packt Publishing.html'),\
  \ req);\n       });\n     });\n   }\n   ```\n\n   通过运行 `bin\\serving_file.dart`\
  \ 启动服务器，并在浏览器中打开URL `localhost:8080`。你将看到**学习Dart**网页。\n\n2. 若要提供当前目录及其所有子文件夹中的所有文件，请扩展代码，如下所示（参见\
  \ `serving_curdir.dart`）：\n\n   ```dart\n   import 'dart:io';\n   import 'dart:async';\n\
  \   import 'package:http_server/http_server.dart';\n\n   InternetAddress HOST =\
  \ InternetAddress.LOOPBACK_IP_V6;\n   const PORT = 8080;\n   VirtualDirectory staticFiles;\n\
  \n   void main() {\n     staticFiles = new VirtualDirectory('.')\n       ..allowDirectoryListing\
  \ = true;\n\n     runZoned(() {\n       startServer();\n     }, onError: handleError);\n\
  \   }\n\n   startServer() {\n     HttpServer.bind(HOST, PORT).then((server) {\n\
  \       server.listen(staticFiles.serveRequest);\n     });\n   }\n\n   handleError(e,\
  \ stackTrace) {\n     print('An error occurred: $e $stackTrace');\n   }\n   ```\n\
  \n   通过运行 `bin\\serving_curdir.dart` 启动服务器，并在浏览器中打开URL `localhost:8080`。你将看到 bin\
  \ 文件夹中的内容列表，如下图所示：\n\n   ![](img/52c05b53a56abd53584e4fed738ed509_736_0.png)\n\n\
  \   Web服务器的目录列表\n\n### 工作原理...\n\n在第1步中，我们首先将 `http_server` 包添加到项目中（将其添加到 `pubspec.yaml`\
  \ 并在代码中导入）。然后，我们通过从 `VirtualDirectory` 类创建一个 `staticFiles` 对象来定义提供服务的文件夹，这里指定它将在当前目录下提供文件。我们在这个对象上调用\
  \ `serveFile` 方法，并将文件的引用作为参数。\n\n在第2步中，`serveRequest` 方法处理对当前目录中任何文件的单个请求（`allowDirectoryListing`\
  \ 属性使内容可查看）。请注意，服务器请求处理器被包裹在对 `dart:async` 中 `runZoned` 方法的调用中。这并非是为了使其工作所必需的，但它展示了一种使我们的代码更加健壮的方法。\n\
  \n使用 `runZoned` 时，作为其第一个参数给定的函数像是在沙箱中执行，而第二个可选参数 `onError` 会处理所有未捕获的异常，无论同步还是异步。你可以在\
  \ https://www.dartlang.org/articles/zones/ 找到有关zone使用的更多详细信息。\n\n### 更多内容...\n\n\
  - 如果你需要当前执行脚本的路径，请使用以下代码：\n\n  `var path = Platform.script.toFilePath();`\n\n- 如果你需要web文件夹的路径，请使用以下代码：\n\
  \n  `final HTTP_ROOT_PATH = Platform.script.resolve('web').toFilePath();`\n\n- 你可以将虚拟目录指向该路径，以使用以下代码从该文件夹开始提供文件：\n\
  \n  `final virDir = new VirtualDirectory(HTTP_ROOT_PATH);`\n\n`HttpServer`、`VirtualDirectory`\
  \ 和 `Platform` 这些类共同足以实现一个基本的Web服务器。当需要根据URL提供不同响应时，`Router` 类（参见*使用WebSockets*技巧）可以简化代码。\n\
  \n> 如果你需要操作某些文件夹或文件的路径，请使用pub包 `path` 及其跨平台方法，例如 `join` 和 `split`。尤其是，在URI和路径之间转换时，`toUri()`\
  \ 和 `fromUri()` 非常有用。\n\n## 使用 Socket\n\n在OSI模型中，我们可以在比HTTP客户端和服务器稍低的层次上找到套接字。它们还实现了网络中客户端和服务器之间的进程间通信，并在TCP/IP之上实现。提供该功能的类同样可以在\
  \ `dart:io` 中找到，如下所示：\n\n- `Socket`：客户端使用它与服务器建立连接\n- `ServerSocket`：服务器使用它接受客户端连接\n\
  \n\n\n\n\n```dart\n'${socket.remoteAddress.address}:${socket.remotePort}');\nsocket.destroy();\n\
