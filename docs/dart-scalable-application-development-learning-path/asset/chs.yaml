  \ `dart` 的文件夹，其中包含您需要的一切。请将其放入您选择的目录中。这个目录可以是任何位置，但为了方便起见，请保持简短，例如 Windows 上的 `d:\\\
  dart` 或 Linux 上的 `~/dart`。在 OS X 上，您可以直接将该目录拖放到 App 文件夹中。\n\n#### 如何操作...\n\n1.\
  \ 创建一个包含 `dart-sdk` 文件夹路径的 `DART_SDK` 环境变量。在 Windows 上，创建并将 `DART_SDK` 设置为 `d:\\\
  dart\\dart-sdk`；如果使用其他文件夹中的 dart，则设置为 `<your-dart-sdk-path>\\dart-sdk`（如果需要更多关于如何执行此操作的信息，请参阅\
  \ `http://www.c-sharpcorner.com/UploadFile/6cde20/use-of-environment-variable-in-windows-8/`）。在\
