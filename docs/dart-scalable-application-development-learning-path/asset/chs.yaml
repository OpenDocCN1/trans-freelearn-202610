  \ Dart Editor 时会立即创建一个新的设置文件夹。不过，你将需要重新加载项目。如果你想保存旧设置，可以重命名该文件夹，而不是直接删除；这样，如果你以后想要恢复旧设置，就可以这样做。\n\
  \n## 工作原理...\n\n`-data` 设置所指向的 Dart Editor 文件夹位于用户主目录中，其中包含编辑器的各种设置（元数据）。清除所有设置会删除编辑器使用的元数据。\n\
  \n## 扩展内容...\n\n**-d64** 或 **-d32** 值指定了 JVM 所需的位宽。你可以通过在终端会话中发出命令 `java -version`\
  \ 来检查你的安装的这些设置，其输出如下：\n\n```\njava version \"1.7.0_51\"\n\nJava(TM) SE Runtime Environment\
  \ (build 1.7.0_51-b13)\n\nJava HotSpot(TM) 64-Bit Server VM (build 24.51-b03, mixed\
  \ mode)\n```\n\n如果这与 `-d` 设置不对应，请确保你下载的 Dart Editor 和已安装的 JVM 具有相同的位宽，可以下载与你位宽匹配的\
  \ JVM。\n\n> 如果你处理许多 Dart 项目和/或大文件，JVM 的内存消耗将相应增长，你的编辑器将变得非常缓慢且无响应。\n> \n> 在 32 位环境中运行几乎会限制你的内存消耗为\
  \ 1GB，因此如果你看到这种行为，建议切换到 64 位系统（Dart Editor 和 JVM）。然后，你还可以根据已安装的内存大小，将 `-Xmx` 参数的值（默认设置为\
  \ 2000m = 2 GB）设置为更高的值。这将显著提高你编辑器的加载和工作速度！\n\n如果你的 JVM 未安装在默认位置，你可以在 `.ini` 文件中\
  \ `-vmargs` 之前的一行添加以下内容：\n\n```\n-vm\n  /full/path/to/java\n```\n\n如果你遇到问题，可以通过将\
  \ Dart SDK 和 Dart Editor 升级到最新版本来解决。在 Dart Editor 菜单中，选择“帮助”，然后选择“关于 Dart Editor”。如果有新版本可用，它会自动下载，完成后，点击“应用更新”。\n\
  \n## 托管你自己的私有 pub 镜像\n\n当 pub 仓库不可达时（因为你没有互联网访问权限，或在非常严格的防火墙后面工作），另一种可能性是托管你自己的私有\
  \ pub 镜像。\n\n## 如何操作...\n\n按照以下步骤托管你自己的私有 pub 镜像：\n\n+   1. 你需要一个能与 pub 的 HTTP API\
  \ 通信的服务器。关于该独立 API 的文档尚不存在，但运行在 pub.dartlang.org 的主 pub 服务器是开源的，其代码位于 https://github.com/dart-lang/pub-dartlang。要在本地运行服务器，请执行以下步骤：\n\
  +      1. 安装适用于 Python 的 App Engine SDK。\n+      2. 验证其路径在 $PATH 中。\n+      3. 安装\
  \ pip 安装文件、beautifulsoup4 和 pycrypto webtest 包。\n+      4. 从顶层目录运行此命令以启动 pub 服务器\
  \ `dev_appserver.py app.`\n+      5. 使用 http://localhost:8080/ 在浏览器中验证其是否正常工作。\n\
  \n\n\n\n\n- 2. 你需要设置一个 PUB_HOSTED_URL 环境变量，使其指向你的镜像服务器的 URL，以便 pub 在那里查找以下载托管的依赖项，例如，PUB_HOSTED_URL\
  \ = http://me:mypassword@127.0.0.1:8042。\n- 3. 手动将你需要的包上传到你的服务器，访问 http://localhost:8080/admin（以管理员身份登录），转到\
  \ Private Key 选项卡，并在私钥字段中输入任意字符串。\n\n### How it works...\n\n服务器 https://pub.dartlang.org/\
  \ 用 Python 编写，设计用于在 Google App Engine 上运行，但也可以在局域网中运行。\n\n## Using Sublime Text\
  \ 2 as an IDE\n\nDart Editor 是一个很棒的环境，但 Sublime Text 也具有许多功能，并且可以与许多其他语言一起使用，使其成为许多开发者的首选编辑器。\n\
  \n### Getting ready\n\n你可以免费下载 Sublime Text 用于评估，然而，为了继续使用，必须从 http://www.sublimetext.com/\
  \ 购买许可证。\n\nGoogle 的 Tim Armstrong 为 Sublime Text 开发了一个 Dart 插件，可以从 GitHub 下载 https://github.com/dart-lang/dart-sublime-bundle，或你可以在本书的代码下载中找到它。最简单开始的方法是先安装\
  \ Package Control 插件，按照 https://sublime.wbond.net/installation#st2 的说明进行操作。\n\n\
  ### How to do it...\n\n在 Sublime Text 中，按 Ctrl + Shift + P（Windows 或 Linux）或 Cmd\
  \ + Shift + P（OS X；以下所有命令均适用），点击 Install Package 选择该选项，然后点击并选择 Dart 安装插件。之后你打开的任何\
  \ Dart 文件都会显示高亮的语法、匹配的括号等。\n\n另外，点击 Menu Preferences，Settings，然后点击 User 并在该 JSON\
  \ 文件的第一行添加你的 dart-sdk 路径：\n\n```\n{\n\"dartsdk_path\": \"path\\to\\dart-sdk\",\n\
  ...\n}\n```\n\n如果你想手动安装此插件，将 `dart-sublime-bundle-master` 文件夹的内容复制到 `Sublime packages`\
  \ 目录下名为 `Dart` 的新目录中。该目录在不同操作系统上的位置不同，分别如下：\n\n- ► 在 Windows 上，这很可能位于 `C:\\Users\\\
  {your username}\\AppData\\Roaming\\Sublime Text 2\\Packages`\n- ► 在 Linux 上，这很可能位于\
  \ `$HOME/Sublime Text 2/Pristine Packages`\n- ► 在 OSX 上，这很可能位于 `~/Library/Application\
  \ Support/Sublime Text 2/Packages`\n\n### How it works...\n\n该插件有一系列代码片段来方便使用 Dart，例如，输入\
  \ `lib` 会展开库语句。其他片段包括 `imp` 用于导入，`class` 用于类模板，`method` 用于方法模板，以及 `main` 用于 main()\
  \ 函数。在按下 `Ctrl + SHIFT + P` 后在弹出窗口中输入片段，可以查看所有片段的列表。使用 `Ctrl + /` 来（取消）注释选中的代码文本。\n\
  \n该插件还为你创建了一个构建系统。`Ctrl + B` 将调用 dartanalyzer，然后使用 dart2js 编译器将 Dart 代码编译为 JavaScript，如以下屏幕截图所示。编辑并保存\
  \ `pubspec.yaml` 文件将自动调用 `pub get` 命令。\n\n![](img/52c05b53a56abd53584e4fed738ed509_560_0.png)\n\
  \nWorking in Sublime Text 2\n\n### See also\n\n- Refer to the *Configuring the Dart\
  \ environment* recipe for the path to the Dart SDK\n\n## Compiling your app to JavaScript\n\
  \n在浏览器中部署 Dart 应用意味着在 JavaScript 引擎中运行它，因此 Dart 代码必须先编译为 JavaScript。这是通过 `dart2js`\
  \ 工具完成的，该工具本身用 Dart 编写，位于 `dart-sdk` 的 `bin` 子文件夹中。该工具也在 Dart Editor 中得到了很好的集成。\n\
  \n### How to do it...\n\n- 右键单击 `.html` 或 `.dart` 文件并选择 **Run as JavaScript**。\n\
  - 或者，你可以右键单击 `pubspec.yaml` 文件并从上下文菜单中选择 **Pub Build**（生成 JS）。你也可以在选择同一文件时点击 **Tools**\
  \ 菜单，然后点击 **Pub Build**。\n\n### How it works...\n\n第一个选项调用 `pub serve` 命令启动一个本地\
  \ Web 服务器，并在其过程中调用 dart2js 进入检查模式。然而，编译后的 `.dart.js` 文件由内部开发 Web 服务器从内存中提供，地址为 `http://127.0.0.1:4031`。这仅适用于开发测试。\n\
  \n在第二个选项中，生成的 files 会写入磁盘中应用的 `build/web` 子文件夹中。这样，你可以将此文件夹复制到生产 Web 服务器并部署你的 Web\
  \ 应用以在所有现代 Web 浏览器中运行（你只需要部署 `.js` 文件，而不需要 `.precompiled.js` 文件或 `.map` 文件）。然而，Dart\
  \ Editor 中的 **Pub Build** 默认启用检查模式；请使用控制台中的 `pub build` 命令进行生产模式。\n\n### There's\
  \ more...\n\n`dart2js` 文件也可以从命令行运行，这是构建非 Web 应用的首选方式。\n\n## Working with Dart Tools\n\
  \n使用 `-o <file>` 或 `-out <file>` 将 dart 脚本编译为输出文件 `prorabbits.js` 的命令是 `dart2js\
  \ -o prorabbits.js prorabbits.dart`。\n\n如果你想在 JavaScript 版本中启用检查模式，使用 `-c` 或 `-checked`\
  \ 选项，例如 `dart2js -c -o prorabbits.js prorabbits.dart`。命令 `dart2js -vh` 会给出所有选项的详细概述。\n\
  \n在 `pubspec.yaml` 所在的目录中命令行发出 `pub build` 命令，将与之前选项 2 相同，但还会应用 JavaScript 缩小步骤；以下是\
  \ `apptest_pub` 的示例输出：\n\n```\nf:\\code\\test_pub>pub build\n\nLoading source assets...\
  \ (0.7s)\n\nBuilding test_pub... (0.3s)\n\n[Info from Dart2JS]:\n\nCompiling test_pub|web/test.dart...\n\
  \n[Info from Dart2JS]:                  Took\n0:00:01.770028 to compile test_pub|web/test.dart.\
  \   Built 165\nfiles to \"build\"\n```\n\n你可以同时缩小你的应用的 JavaScript 版本和 Dart 版本。\n\
  \n### Producing more readable JavaScript code\n\n要生成更易读的 JavaScript 代码（而不是生产模式的缩小版本，参考\
  \ *Shrinking the size of your app* 配方），使用命令 `pub build --mode=debug`，这是 Dart Editor\
  \ 中的默认命令。\n\n或者，你可以在应用的 `pubspec.yaml` 文件中添加以下 transformers 部分：\n\n```\nname: test_pub\n\
  description: testing pub\n\ntransformers:\n  - $dart2js:\n      minify: false\n\
  \      checked: true\n\ndependencies:\n  js: any\n\ndev_dependencies:\n  unittest:\
  \ any\n```\n\n![](img/52c05b53a56abd53584e4fed738ed509_562_0.png)\n\n> 有关更多信息，请参考\
  \ https://www.dartlang.org/tools/pub/dart2js-transformer.html。\n\n### Producing\
  \ a single Dart file\n\ndart2js 工具也可以用作 Dart 到 Dart 来创建包含应用所需一切的单个 .dart 文件，使用以下命令：\n\
  \n```\ndart2js --output-type=dart --minify -oapp.complete.dart app.dart\n```\n\n\
  这会获取 Dart 应用，对其进行树摇动、缩小，并生成一个用于部署的单个 .dart 文件。其优点是它会引入依赖项，如第三方库，并对其进行树摇动以消除未使用的部分。\n\
  \n### See also\n\n你可能对本章中的以下配方感兴趣：\n\n- Using the command-line tools\n- Shrinking\
  \ the size of your app\n- Debugging your app in JavaScript for Chrome\n\n## Debugging\
  \ your app in JavaScript for Chrome\n\n在本配方中，我们将研究如何在 Chrome 浏览器中调试你的应用。\n\n###\
  \ How to do it...\n\n- 1. 从右上角的菜单中，选择 Tools 然后 Developer Tools。\n- 2. 通过 Settings（Developer\
  \ Tools 部分右上角的轮图标）验证 Enable JavaScript source maps 选项是否已打开。确保调试已启用，无论是对所有异常还是仅对未捕获的异常。\n\
  - 3. 在 Developer Tools 菜单中选择 Sources，然后按 Ctrl + O 打开文件浏览器并选择你想要调试的 Dart 脚本。\n\n\
  > 在代码行左侧边距点击会放置一个断点，用粗蓝色箭头表示。\n\n\n\n\n\n## 在 Firefox 中调试 JavaScript 应用\n\n在 Firefox\
  \ 中，源映射功能尚未实现。使用 Shift + F2 打开开发者工具栏和命令行。在顶部菜单中，你会看到 Debugger。设置断点并重新加载文件。代码执行随后会停止，你可以检查变量的值，如以下屏幕截图所示：\n\
  \n![](img/52c05b53a56abd53584e4fed738ed509_565_0.png)\n\n## 使用命令行工具\n\n有些事情在命令行上完成起来更简单，或者只是尚未包含在\
  \ Dart Editor 中。这些工具位于 dart-sdk/bin 中。它们包括以下内容：\n\n- dart：用于运行 Dart 命令行应用的独立 Dart\
  \ VM，例如服务器端脚本和服务器应用\n- dartanalyzer：用于静态检查代码\n- pub：这是一个包和仓库管理器\n- dartfmt：这是一个代码格式化工具\n\
  - docgen：这是一个文档生成工具\n\n### 如何操作...\n\n1. 对于每个工具，了解或检查其版本可能很有用。这是通过 `--version` 选项完成的，例如\
  \ `dart --version`，典型输出为 **Dart VM version: 1.3.0 (Tue Apr 08 09:06:23 2014) on\
  \ \"windows_ia32\"**。\n2. `dart -v -h` 选项列出并讨论 VM 的所有可能选项。许多工具还接受 `--package_root=<path>`\
  \ 或 `-p=<path>` 选项来指示导入中使用的包在文件系统上的位置。\n3. `dartanalyzer` 用 Java 编写，在项目导入或 Dart\
  \ 代码更改时在 Dart Editor 中工作；它以 `dartanalyzer prorabits.dart` 启动，输出为：\n\n   **Analyzing\
  \ prorabits.dart...**\n\n   **No issues found (or possibly errors and hints to improve\
  \ the code)**\n\n4. 上述输出验证代码符合语言规范 `https://www.dartlang.org/docs/spec/`，pub 功能已内置于\
  \ Dart Editor，但该工具也可以从命令行使用（请参阅 `test_pub`）。要获取包（例如 `test_pub` 应用），在 `pubspec.yaml`\
  \ 所在的文件夹中使用以下命令，`pub get`，典型输出如下：\n\n   `Resolving dependencies... (6.6s)`\n   `Got\
  \ dependencies!`\n\n5. 会创建一个 packages 文件夹，其中包含指向机器上中央 `package` 缓存的符号链接。最新版本将被下载，并且包版本会注册在\
  \ `pubspec.lock` 文件中，以便你的应用只能使用这些版本。\n6. 如果你想获取包的新版本，请使用 `pub upgrade` 命令。你可以使用\
  \ `-v` 和 `--trace` 选项生成详细输出以验证其工作情况。\n7. `dartfmt` 工具也内置于 Dart Editor。右键单击任何 Dart\
  \ 文件并从上下文菜单中选择 **Format**。这会将代码转换以使其符合 Dart 风格指南，可在 `https://www.dartlang.org/articles/style-guide/`\
  \ 查看。你也可以从命令行使用它，但此时默认操作模式是清理空白。使用 `-t` 选项应用代码转换，例如 `dartfmt -t -w bank_terminal.dart`。\n\
  \n> 开始处理项目时，如果项目已包含包版本，请始终执行 pub upgrade！\n\n### 另请参阅\n\n- Solving problems when\
  \ `pub get` fails\n- Compiling your app to JavaScript (for `pub build`)\n- Documenting\
  \ your code from Chapter 2, Structuring, testing, and deploying an application\n\
  - Publishing your app to a pub (for pub publishing)\n- Using snapshotting to start\
  \ an app in Dart VM\n- For additional information, refer to https://www.dartlang.org/tools/\n\
  \n## Solving problems when pub get fails\n\npub 包管理器是一个功能复杂的工具，因此偶尔出现问题并不奇怪。`pub\
  \ get` 命令会下载应用所需的所有库，如 `pubspec.yaml` 文件中指定的那样。在代理或防火墙后面运行 `pub get` 曾经是个问题，但在大多数情况下已得到解决。如果这仍然困扰你，请查看\
  \ https://www.dartlang.org/tools/editor/troubleshoot.html 中的相应部分。\n\n### Getting\
  \ ready\n\n当你在 Dart Editor 中尝试打开项目并在 pub get 阶段时，在 Dart 控制台中遇到以下错误时，本食谱尤其有用：\n\n\
  ```\nPub install fails with 'Deletion failed'\n```\n\n### 如何操作...\n\n首先尝试这样操作；右键单击你的项目并选择\
  \ **Close Folder**。然后，重新启动编辑器并再次打开你的项目。在许多情况下，你的项目将正常加载。如果这不起作用，请尝试 `pub get` 命令：\n\
  \n1. 从 `C:\\Users\\{your username}\\AppData\\Roaming\\Pub.` 删除 pub 缓存文件夹\n2. 删除项目中的所有\
  \ `packages` 文件夹（也在子文件夹中）。\n3. 删除项目中的 `pubspec.lock` 文件。\n4. 再次从命令行运行 `pub get`\
  \ 或在 Dart Editor 菜单中选择 **Tools**，然后选择 **Pub Get。**\n\n### 如何工作...\n\n`dart2js` 文件利用了\
  \ tree-shaking 功能；只有执行期间必要的代码会被保留，即未被调用的函数、类和库会被排除在生成的 `.js` 文件之外。压缩过程进一步通过用更短的名称替换变量、函数等名称并移动代码以使用几行来减小大小。\n\
  \n### There's more...\n\n使用反射时要小心。\n\n### More Information Section 1\n\n在 Dart 代码中使用反射会阻止\
  \ tree shaking。因此，只有在确实需要时才导入 `dart:mirrors` 库。在这种情况下，包含 `@MirrorsUsed` 注解，如以下代码所示：\n\
  \n```\nlibrary mylib;\n\n@MirrorsUsed(targets: 'mylib')\nimport 'dart:mirrors';\n\
  ```\n\n在前面的代码中，`mylib` 内部的所有名称和实体（类、函数等）都将在生成的代码中保留以使用反射。因此，创建一个单独的库来保存使用 mirrors\
  \ 的类。\n\n> 确保你的部署 Web 服务器使用 `gzipping` 进行实时 HTTP 压缩。\n\n### 另请参阅\n\n- You might\
  \ want to consult the *Using Reflection* recipe in *Chapter 4, Object Orientation.*\n\
  \n## Making a system call\n\n一个相当常见的用例是你需要从 Dart 应用调用另一个程序或操作系统命令。为此，`dart:io` 包中创建了抽象类\
  \ `Process`。\n\n### 如何操作...\n\n要从 Dart 脚本 `prorabits.dart` 生成名为 `prorabits` 的脚本快照文件，请发出以下命令：\n\
  \n```\ndart --snapshot=prorabits prorabits.dart\n```\n\n然后，使用 `dart prorabits args`\
  \ 启动应用，其中 args 代表脚本所需的可选参数。\n\n### 如何工作...\n\n脚本快照是应用对象在内存中的字节表示（更准确地说是在启动的 isolate\
  \ 的堆中），在加载后但在开始执行之前。这使得启动速度更快，因为对应用代码进行标记化和解析的工作已在快照中完成。\n\n### There's more...\n\
  \n本食谱适用于服务器应用或命令行应用。内置 Dart VM 的浏览器可以自动为你的 Web 应用创建快照并将其存储在浏览器缓存中；下次请求该应用时，它会从快照中更快地启动。因为快照实际上是对象(s)的序列化形式，所以这也是\
  \ Dart VM 在 isolate 之间传递对象的方式。文件夹 `dart/dart-sdk/bin/snapshots` 包含主要 Dart 工具的快照。\n\
  \n### 另请参阅\n\n- Occasionally, your app needs access to the operating system, for\
  \ example, to get the value of an environment variable to know where you are in\
  \ the filesystem, or to get the number of processors when working with isolates.\
  \ Refer to the *Using isolates in the Dart VM* and *Using isolates in web apps*\
  \ recipes, in *Chapter 8, Working with Futures, Tasks, and Isolates*, for more information\
  \ on working with isolates.\n\n## Getting information from the operating system\n\
  \n在本食谱中，你将看到如何通过进行系统调用并从系统获取信息来与应用运行的底层操作系统进行交互。\n\n\n\n\n\n### 准备工作\n\nPlatform\
  \ 类提供了有关操作系统和应用程序运行的计算机的信息。它位于 dart:io 中，因此我们需要导入此库。\n\n### 如何做...\n\n以下脚本展示了一些有趣选项的使用（请参阅本章的代码文件\
  \ `tools\\code\\platform\\bin\\platform.dart`）：\n\n```dart\nimport 'dart:io';\n\n\
  Map env = Platform.environment;\n\nvoid main() {\n  print('We run from this VM:\
  \ ${Platform.executable}');\n  // getting the OS and Dart version:\n  print('Our\
  \ OS is: ${Platform.operatingSystem}');\n  print('We are running Dart version: ${Platform.version}');\n\
  \  if (!Platform.isLinux) {\n    print('We are not running on Linux here!');\n \
  \ }\n  // getting the number of processors:\n  int noProcs = Platform.numberOfProcessors;\n\
  \  print('no of processors: $noProcs');\n  // getting the value of environment variables\
  \ from the Map env:\n  print('OS = ${env[\"OS\"]}');\n  print('HOMEDRIVE = ${env[\"\
  HOMEDRIVE\"]}');\n  print('USERNAME = ${env[\"USERNAME\"]}');\n  print('PATH = ${env[\"\
  PATH\"]}');\n  // getting the path to the executing Dart script:\n  var path = Platform.script.path;\n\
  \  print('We execute at $path');\n  // on this OS we use this path separator:\n\
  \  print('path separator: ${Platform.pathSeparator}');\n}\n```\n\n运行后，上述代码会给出以下输出：\n\
  \n```\nOur OS is: windows\nWe are running Dart version: 1.3.3 (Wed Apr 16 12:40:55\
  \ 2014) on \"windows_ia32\"\nWe are not running on Linux here!\nno of processors:\
  \ 8\nOS = Windows_NT\nHOMEDRIVE = C:\nUSERNAME = CVO\nPATH = C:\\mongodb\\bin;C:\\\
  MinGW\\bin;...\nWe execute at /F:/Dartiverse/platform/bin/platform.dart\npath separator:\
  \ \\\n```\n\n### 它是如何工作的...\n\n大多数选项都很直接。你可以通过 `Platform.executable` 获取正在运行的 VM。你可以通过\
  \ `Platform.operatingSystem` 获取操作系统；这也可以通过布尔属性如 `Platform.isLinux` 来测试。Dart 版本可以通过\
  \ `Platform.version` 属性进行测试。`Platform.environment` 选项返回系统环境变量的良好映射结构，因此你可以通过名称访问其值，例如，对于变量\
  \ `envVar`，使用 `var envVar = Platform.environment[\"envVar\"]`。\n\n要获取正在执行的 Dart\
  \ 脚本的路径，可以使用 `Platform.script` 的 `path` 属性，因为后者返回脚本的绝对 URI。在应用程序中构建文件路径时，你需要知道路径中各组件的分隔方式；`Platform.pathSeparator`\
  \ 为你提供此信息。\n\n### 还有更多...\n\n不要将此类与 `dart:html` 中的 `Platform` 混淆，后者返回有关浏览器平台的信息。\n\
  \n## 引言\n\n在本章中，我们主要关注使你的项目更专业并在维护阶段节省大量时间的生命周期中的各种不同任务。这包括结构化项目、在其中安装日志工具、测试、文档化、分析以及发布它。然而，首先我们将看到如何结束一个应用程序，以及服务器应用程序如何接受命令行参数。\n\
  \n### 从应用程序退出\n\nDart 程序从 Dart VM 中的一个线程（或 isolate）中的 `main()` 函数开始执行。Dart VM 按设计始终以单线程启动。程序可以通过三种不同的方式结束：\n\
  \n- 它可以通过执行 `main()` 中的最后一条语句以正常方式结束，并返回值为 0 的退出代码，表示成功。\n- 它可以通过运行时异常异常终止，返回与 0\
  \ 不同的退出代码，例如未处理的异常情况下为 255。\n- 它可以等待事件循环以进行用户交互（如在浏览器中或 Web 服务器等待请求），然后在浏览器关闭或同一浏览器标签中启动另一个应用程序时终止。\n\
  \n然而，我们如何从代码本身退出应用程序？这在某些情况下很有用，例如在服务器端 VM 应用程序中存在可能返回也可能不返回的 Futures。\n\n#### 如何做...\n\
  \n第一个可能性是使用来自 `dart:io` 的顶层函数 `exit(int code)`，如 `exit_app.dart` 中所示，以从无限循环或在特定条件下停止应用程序，并返回退出代码：\n\
  \n```dart\nimport 'dart:io';\n\nvoid main() {\n  var message = \"Dart is fun!\"\
  ;\n  int i = 0;\n  while (true) {\n    print(message);\n    i++;\n    if (i == 10)\
  \ {\n      print(\"That's enough!\");\n      exit(10);\n    }\n  }\n}\n```\n\n你也可以使用属性\
  \ `exitCode` 设置退出代码值，如以下代码所示：\n\n```dart\nexitCode = 10;\n// ... other code can\
  \ be executed\nexit(exitCode);\n```\n\n#### 它是如何工作的...\n\n`exit(code)` 函数将终止正在运行的\
  \ Dart VM 进程并将整数代码作为退出值返回给父进程或操作系统环境，表示程序的成功、失败或其他退出状态。你可以选择代码的值；有一种约定是使用 0 表示成功，1\
  \ 表示警告，2 表示错误。另一种约定是零表示成功，非零表示失败，并且程序在自然结束时返回警告以表示成功退出。一个具体例子是 dartanalyzer 程序，如果代码生成警告则返回\
  \ 0。\n\n> 退出代码的含义是特定于平台的；如果你使用 0–127 范围内的退出代码，将不会遇到跨平台问题。\n\n### 解析命令行参数\n\n运行批处理作业的服务器应用程序通常从命令行获取参数值。我们如何在程序中获取这些值？\n\
  \n#### 如何做...\n\n解析命令行参数的明显方法如下（参见 `command_line_arguments.dart`）：\n\n```dart\n\
  void main(List<String> args) {\n  print(\"script arguments:\");\n  for(String arg\
  \ in args)\n    print(arg);\n}\n```\n\n现在，命令 `dart command_line_arguments.dart param1\
  \ param2 param3` 会给出以下输出：\n\n**script arguments:**\n\n**param1**\n\n**param2**\n\
  \n**param3**\n\n然而，你也可以从 Dart Editor 中进行测试，打开菜单 **Run**，并选择 **Manage Launches**（*Ctrl\
  \ + Shift + M*）。在 **Script arguments** 窗口中填写参数：\n\n![](img/52c05b53a56abd53584e4fed738ed509_578_0.png)\n\
  \n脚本参数\n\n如果你的参数采用 key:value 形式，如以下代码所示？\n\n```\npar1:value1 par2:value2 par3:value3\n\
  ```\n\n在这种情况下，使用以下代码片段：\n\n```dart\nfor(String arg in args) {\n    List<String>\
  \ par = arg.split(':');\n    var key = par[0];\n    var value = par[1];\n    print('Key\
  \ is: $key - Value is: $value');\n}\n```\n\n之前的代码片段会给出以下输出：\n\n**Key is: par1 -\
  \ Value is: value1**\n\n**Key is: par2 - Value is: value2**\n\n**Key is: par3 -\
  \ Value is: value3**\n\n`split` 方法返回 `List<String>`，其中包含每个参数的键和值。更复杂的参数解析可以如下进行：\n\
  \n```dart\nfinal parser = new ArgParser();\nfinal argResults = parser.parse(args);\n\
  List<String> pars = argResults.rest;\nprint(pars); // [par1:value1, par2:value2,\
  \ par3:value3]\n```\n\n再次使用 `split` 来获取键和值。\n\n#### 它是如何工作的...\n\n`main()` 函数可以采用可选参数\
  \ `List<String> args` 来获取命令行参数。它只需要对参数字符串进行拆分即可获取键和值。\n\n第二个选项使用来自 pub 仓库的 `args`\
  \ 包，由 Dart 团队编写。在 `pubspec.yaml` 文件的 dependencies 部分包含 `args:any`。然后，你可以通过在脚本顶部包含\
  \ `import 'package:args/args.dart';` 来使用该包。`args` 包既可用于客户端也可用于服务器应用程序。它可更具体地用于解析\
  \ GNU 和 POSIX 风格选项，并在 https://api.dartlang.org/apidocs/channels/stable/dartdoc-viewer/args/args\
  \ 上有文档说明。\n\n#### 另请参阅\n\n- 请参阅第 6 章《使用文件和流》中的“在文件中搜索”配方，了解如何使用 args 包配合标志的示例\n\n\
  ### 结构化应用程序\n\n所有旨在在生产环境中使用的 Dart 项目都应遵循最佳软件工程实践，因此必须包含特定文件夹结构。结构良好的项目体现了专业性，并让开发人员有熟悉感；在标准化结构中更容易找到方向。此外，如果你想在应用程序中使用一组特定于应用程序的库，这也是必要的，正如我们在下一个配方中将看到的那样。\n\
  \n\n\n\n\n\n## 结构化、测试和部署应用程序\n\n### 准备工作\n\n一个旨在独立运行的应用程序，无论是命令行应用程序还是 Web 应用程序，都属于应用程序包；它需要一个\
  \ `main()` 入口点。库包将被用作其他应用程序中的依赖项。所有 Dart 项目都依赖于配置文件 `pubspec.yaml`，它描述了应用程序及其依赖项，以及\
  \ `pubspec.lock` 文件。这决定了哪些库将被包含在顶层的 `packages` 文件夹中。该文件和 `packages` 文件夹由 pub 工具（更具体地说是\
  \ `pub get` 和 `pub upgrade` 命令）生成，不应手动编辑。\n\n### 如何做...\n\n如果您在 Dart Editor 中开发应用程序，在启动新项目时，您需要选择一个项目模板开始，如下表所示：\n\
  \n| 项目类型 | 模板 | 项目文件夹 |\n|---|---|---|\n| 独立运行的客户端或服务器应用 | 命令行 | `bin` |\n| Web\
  \ 或 Polymer 应用 | Web 应用程序或使用 Polymer 的 Web 应用程序 | `web` |\n| Chrome 应用 | Chrome\
  \ 打包应用 | `web` |\n| 库 | 包 | `lib` |\n\n`bin` 文件夹包含一个带有 `main()` 函数的启动脚本。它还可以包含 shell\
  \ 脚本，例如启动服务器的脚本。在 `web` 文件夹中，您通常会有 `index.html` 和一个 `main.dart` 文件，或者通常是 `app.html`\
  \ 和 `app.dart` 文件。其他资源文件如 CSS、JavaScript 文件和图片可以放在各自的文件夹 `css`、`js` 和 `images` 中。Polymer\
  \ 项目通常会包含一个 `web\\component` 子文件夹。不要在 `lib` 文件夹中放置带有 `main()` 的脚本。\n\n然后，您希望按如下方式增强项目的结构：\n\
  \n| 文件夹 | 项目类型 | 文件 |\n|---|---|---|\n| 顶层 | 全部 | `README.md`、`LICENSE`、`CHANGELOG`\
  \ 和 `AUTHORS` 文件 |\n| `doc` | 全部 | `getting_started.md`、`todo.txt` |\n| `example`\
  \ | 全部 | 示例脚本，展示如何使用该应用 |\n| `lib` | Web | `src`、`view` 和 `model` 的文件夹 |\n| `src`\
  \ | 服务器 | `src` 和 `model` 的文件夹 |\n| `test` | 全部 | 单元测试脚本 |\n\n### 它是如何工作的...\n\n\
  Dart Editor 中的模板为您提供了一个基本结构，但通常您希望添加一些之前指定的文件夹，以提供一个可识别且专业的结构，您可以在其中轻松找到所需的内容，例如项目中包含哪些测试。正如我们在下一个配方中将会看到的，为了使用应用程序库，它们必须放在\
  \ `lib` 文件夹中。\n\n### 还有更多...\n\nREADME 文件（`readme.md`，采用 markdown 语法；请参阅 http://en.wikipedia.org/wiki/Markdown）和\
  \ CHANGELOG 文件会显示在 pub 仓库中您包的页面上，因此其内容很重要。\n\n可选文件夹如下：\n\n- `mock`：此文件夹包含用于在测试环境中模拟应用程序某些行为的类，例如使用文本文件代替真实数据库。\n\
  - `tool`：此文件夹包含项目所需的工具脚本，如构建脚本、测试运行器等。\n- `benchmark`：当性能至关重要时，此文件夹可以包含用于测试性能的示例。\n\
  \n一个同时具有客户端和服务器组件的应用程序的替代结构可以基于之前的结构放置：\n\n- `client`\n- `server`\n- `core`（或 shared）\n\
  \nDart 网站上的 `https://www.dartlang.org/tools/pub/package-layout.html` 链接包含一些额外的信息。\n\
  \n### 另请参阅\n\n- 您可能还想阅读本章中的 *发布和部署您的应用* 配方\n\n## 在应用程序中使用库\n\n如前一配方所述，每种类型的应用程序都可以包含一个\
  \ `lib` 文件夹，其中至少包含模型类。这些模型类非常重要，因为它们构成了项目的骨干，因此必须在整个应用程序中可访问。您可以通过将它们放在顶层的 `lib`\
  \ 文件夹中，或更好的是放在 `lib/model` 中来实现。这中心的位置也会使它们突出，并让您代码的其他阅读者更容易找到。\n\n### 如何做...\n\n\
  查看 `bank_terminal` 项目的结构。模型类 `Person` 和 `BankAccount` 放在 `lib\\model` 文件夹中。在 `pubspec.yaml`\
  \ 文件中为您的项目命名：\n\n```\nname: bank_terminal\n```\n\n然后，使用相同的名称为 `lib` 文件夹中创建的库脚本 `bank_terminal.dart`，其中包含以下代码：\n\
  \n```\nlibrary bank_terminal;\n\nimport 'dart:convert';\n\npart 'model/bank_account.dart';\n\
  part 'model/person.dart';\n```\n\n> 库的名称与您的应用名称相同！这对 Dart 脚本本身不是必需的，但这是一种常见且建议的做法。\n\
  \n现在当执行 `pub get` 或 `pub upgrade` 命令时，`packages` 文件夹中会出现一个 `bank_terminal` 文件夹。然后，您可以通过像导入从\
  \ pub 下载的任何托管包一样导入它，使该库在其他 Dart 脚本中使用。例如，在 `web\\bank_terminal.dart` 中我们有以下代码：\n\
  \n```\nimport 'package:bank_terminal/bank_terminal.dart';\n```\n\n在这种情况下，模型类变得可用。项目结构如下图所示：\n\
  \n![](img/52c05b53a56abd53584e4fed738ed509_583_0.png)\n\n### 它是如何工作的...\n\npub 工具就是这样设计的，以便于在应用程序中使用内部库。每个在\
  \ `lib` 文件夹（或其子文件夹）中声明库的脚本都将被 `pub get` 或 `pub upgrade` 命令拾取。其结果是，带有其所有代码的库被视为一个单独的“内部”包，因此与应用程序依赖的其他包一起放在\
  \ `packages` 文件夹中。这使得代码模型更清晰，也使 pub 更容易部署您的代码。\n\n### 还有更多...\n\npub 工具可以扩展到 `lib`\
  \ 的几个子文件夹，每个子文件夹包含自己的库文件（例如，位于 model 文件夹中的以 library model 开头的脚本 `model.dart`），然后是一个顶层库文件\
  \ `project_name.dart`，其前几行代码如下：\n\n```\nlibrary project_name;\nimport 'model/model.dart';\
  \   // 导入 library model\nimport 'view/view.dart';     // 导入 library view\n...\n\
  ```\n\n这样，来自 `model`、`view` 等的不同库被导入到一个大的库中，然后应用程序按如下方式导入它：\n\n```\nimport 'package:project_name/project_name.dart';\n\
  ```\n\n## 使用 assert 对代码进行微测试\n\n为您的应用程序编写测试是必要的，但花费大量时间在琐碎的测试上是不高效的。经常被低估的 Dart\
  \ 关键字是 `assert`，它可用于测试代码中的条件。\n\n### 如何做...\n\n查看代码文件 `microtest.dart`，其中 `microtest`\
  \ 是一个如前一配方中所述的内部包：\n\n```\nimport 'package:microtest/microtest.dart';\n\nvoid main()\
  \ {\n  Person p1 = new Person(\"Jim Greenfield\", 178, 86.0);\n  print('${p1.name}\
  \ weighs ${p1.weight}' );\n  // 许多其他代码和方法调用\n  // p1 = null;\n  // 再次使用 p1：\n  assert(p1\
  \ is Person);\n  p1.weight = 100.0;\n  print('${p1.name} now weighs ${p1.weight}'\
  \ );\n}\n```\n\n我们导入 `microtest` 库，其中包含 `Person` 类的定义。在 `main()` 中，我们创建一个 `Person`\
  \ 对象 `p1`，经过大量代码后，又想再次使用 `p1`，可能在另一个类的不同方法中。我们如何知道 `p1` 仍然引用一个 `Person` 对象？在之前的片段中很明显，但在更复杂的情况下可能更困难。如果\
  \ `p1` 例如被解除引用，没有 assert 我们会得到异常 **NoSuchMethodError: method not found: 'weight='**。\n\
  \n然而，如果我们使用 assert 语句，我们会得到一个更清晰的消息：**AssertionError: Failed assertion: line 9 pos\
  \ 9: 'p1 is Person' is not true.** 你可以通过取消注释行 `p1 = null` 来测试它。\n\n### 它是如何工作的...\n\
  \n`assert` 参数是一个逻辑条件或任何表达式（例如调用返回布尔值的函数），其解析结果为 false 或 true。如果其值为 `false`，则正常执行会通过抛出\
  \ `AssertionError` 而停止。\n\n使用 `assert` 测试代码中任何不明显的条件；它可以替代许多简单的单元测试或难以设置的单元测试。可以放心，`assert`\
  \ 仅在检查模式下工作；它不会影响部署应用程序的性能，因为它在生产模式下会被忽略。\n\n### 还有更多...\n\n使用 `assert` 进行测试在进入方法时测试参数条件（前置条件），以及在离开方法时测试返回值（后置条件）时非常有用。您也可以从\
  \ `assert` 中调用一个 `test` 函数（它必须返回布尔值），例如 `assert(testfunction());`。\n\n## 单元测试 Polymer\
  \ Web 应用\n\n项目应包含一些自动化测试，可以在每次代码更改后运行，以确保之前的功能仍然有效。Dart 的 `unittest` 框架是最佳工具，Dart\
  \ 网站上有一些优秀的文章可供入门。然而，测试 Polymer Web 应用程序要困难得多，因为 Polymer 的工作方式隐藏了 HTML 在 shadow\
  \ DOM 中，并且它以异步方式工作，与测试代码无关。\n\n### 准备工作\n\n我们将在 `ClickCounter` 示例中创建一些测试（使用 `polymer`\
  \ 库的标准 Web 应用程序模板）。您可以在 `polymer1` 应用中找到代码。我们在 `pubspec.yaml` 文件中包含 `unittest` 库，并创建\
  \ `test` 文件夹。\n\n\n\n\n### 操作步骤...\n\n在测试文件夹中，我们创建了一个 `test_polymer1.html` 页面，即一个加载测试此功能所需\
  \ Polymer 组件的网页。该组件所需的最低内容如下：\n\n```html\n<head>\n    <title>test_polymer1</title>\n\
  \    <link rel=\"import\" href=\"../web/polymer1.html\">\n    <script type=\"application/dart\"\
  \ src=\"test_polymer1.dart\"></script>\n</head>\n```\n\n`test_polymer1.dart` 包含测试脚本：\n\
  \n```dart\nimport 'package:unittest/unittest.dart';\nimport 'dart:html';\nimport\
  \ 'package:polymer/polymer.dart';\nimport '../web/clickcounter.dart';\n\nmain()\
  \ {\n    initPolymer();\n    var _el;\n    setUp(() {\n        _el = createElement('<click-counter>Click\
  \ counter test</click-counter>');\n        document.body.append(_el);\n    });\n\
  \    tearDown(() {\n        _el.remove();\n    });\n    // tests:\n    test('shadowroot\
  \ elements are created', () {\n        expect(querySelector('click-counter').children,\
  \ isNotNull);\n        expect(querySelector('click-counter').shadowRoot.text, isNotNull);\n\
  \    });\n    test('initial text ok', () {\n        expect(querySelector('click-counter').shadowRoot.text.contains('click\
  \ count: 0'), isTrue);\n    });\n}\n```\n\n### 工作原理...\n\n测试网页加载 Polymer 组件，测试脚本加载\
  \ unittest 和 polymer 包以及组件类（`clickcounter.dart`）。在 `main()` 中，我们通过 `initPolymer()`\
  \ 加载 polymer 包；在 `setup()` 中，我们使用辅助方法 `createElement()`，以包含 polymer 标签 `<click-counter>`\
  \ 的 HTML 字符串作为参数来实例化 Polymer 组件并将其添加到页面。这样做是为了避免默认的 HTML 清理 `createElement()`——它使用空清理器而不是内置清理器（关于此主题的更多信息，请参阅第\
  \ 5 章“处理 Web 应用”）。然后，我们开始测试，例如：\n\n- `expect(querySelector('click-counter').children,\
  \ isNotNull);` 确保 Polymer 组件树被创建\n- `var button = querySelector('click-counter').shadowRoot.querySelector('#click');\
  \ expect(button, isNotNull);` 确保具有 ID `'click'` 的按钮被创建\n- `expect(querySelector('click-counter').shadowRoot.text.contains('click\
  \ count: 0'), isTrue);` 确保初始显示的文本是 `'click count: 0'`。\n\n注意，我们必须深入 Polymer 组件的\
  \ `shadowRoot` 才能获取这些信息，如下所示：\n\n- 验证通过 `button.click()` 触发三次按钮点击后，我们的 count 属性的值为\
  \ 3：\n\n  ```dart\n  ClickCounter cc = querySelector('click-counter');\n  expect(cc.count,\
  \ 3);\n  ```\n\n### 另请参阅\n\n- 想了解有关 Dart unittest 库的更多信息，请参阅《Learning Dart》一书（Ivo\
  \ Balbaert、Dzenan Ridjanovic 著，Packt Publishing 出版），或访问 https://www.dartlang.org/articles/writing-unit-tests-for-pub-packages/\
  \ 和 https://www.dartlang.org/articles/dart-unit-tests/ 上的优秀文章。这些内容应有助于你进一步了解背景知识，并帮助你在自己的工作中扩展使用\
  \ Dart Unittest。\n\n## 为应用添加日志记录\n\n每个生产应用都需要日志记录功能，以便将不同严重级别（信息/警告/调试）的日志消息输出到（Web\
  \ 浏览器调试）控制台或文件中。本技巧将帮助你快速轻松地实现这一点。\n\n### 准备工作\n\n使用 Dart 团队开发并通过 pub 提供的 logging\
  \ 包来实现此目的。将其添加到你的 `pubspec.yaml` 文件中，并在代码中添加代码行 `import 'package:logging/logging.dart';`。在\
  \ `bank_terminal_polymer` 中可以看到它的实际应用。我们将该导入添加到 Polymer 组件和模型类 `BankAccount` 的代码中。\n\
  \n### 操作步骤...\n\n1. 在 `web\\bank_account.dart` 中，顶层代码如下：\n\n   ```dart\n   import\
  \ 'package:logging/logging.dart';\n   final Logger log = new Logger('Bank Account');\n\
  \   ```\n\n2. 我们将构造函数改为以下代码：\n\n   ```dart\n   BankAccount.created() : super.created()\
  \ {\n       setupLogger();\n       log.info('Bank Account component is created');\n\
  \   }\n   ```\n\n   `setupLogger()` 是你可以定义日志格式的地方；以下代码展示了一种最小的格式：\n\n   ```dart\n\
  \   setupLogger() {\n       // Set up logger.\n       Logger.root.level = Level.ALL;\n\
  \       Logger.root.onRecord.listen((LogRecord rec) {\n           print('${rec.level.name}:\
  \ ${rec.time}: ${rec.message}');\n       });\n   }\n   ```\n\n3. 在 `checkAmount()`\
  \ 中，我们添加以下警告消息：\n\n   ```dart\n   checkAmount(String in_amount) {\n       try {\n\
  \           amount = double.parse(in_amount);\n       } on FormatException catch(ex)\
  \ {\n           log.warning(\"Amount $in_amount is not a double!\");\n         \
  \  return false;\n       }\n       return true;\n   }\n   ```\n\n4. 在 `lib\\bank_account.dart`\
  \ 文件的模型类中，当 `BankAccount` 对象被创建时，我们添加一条“信息”消息：`log.info('Bank Account is created')`，并在\
  \ `transact` 方法中，当余额变为负数时添加一条“严重”消息：\n\n   ```dart\n   transact(double amount) {\n\
  \       balance += amount;\n       if (amount < 0 && (-amount) > balance) {\n  \
  \         log.severe(\"Balance will go negative!\");\n       }\n       date_modified\
