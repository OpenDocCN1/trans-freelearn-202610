  \n```\nfuture.then(nextStep)\n```\n\n`then` 和 `catchError` 对象在被调用时被链接，但这并不意味着它们都会被执行。只有其中一个完全执行；将其与同步代码中的\
  \ try-catch 块进行比较。`catchError` 对象甚至可以捕获在 `handleValue` 中抛出的错误。\n\n这是一个相当优雅的机制，但当代码变得稍微复杂一些时我们该怎么办？\n\
  \n\n\n\n```dart\nprint('happy end');\n}\n```\n\n输出如下：\n\n**happy end**\n\na\n\n\
  c\n\nd\n\n**Error occurred in b!**\n\n- 下面的代码有助于捕获特定错误或多个错误：\n\n  ```dart\n  firstStep()\n\
  \      .then((_) => secondStep())\n      // more .then( steps )\n      .catchError(handleArgumentError,\n\
  \          test: (e) => e is ArgumentError)\n      .catchError(handleFormatException,\n\
  \          test: (e) => e is FormatException)\n      .catchError(handleRangeError,\n\
