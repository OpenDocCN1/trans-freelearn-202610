- "### 7\n\n### Image Enhancement\n\n在本章中，我们将探讨从经典的基于像素的变换到现代深度学习模型的一系列图像增强技术，旨在提高视觉质量并强调重要特征。与图像恢复不同，增强方法不依赖于明确的退化模型，而是专注于细化对比度、降低噪声和增强细节。\n\
  \n我们首先介绍逐点强度变换、基于直方图的对比度调整和抖动算法，然后是高斯、中值、双边和非局部均值滤波等线性和非线性平滑技术。本章还涵盖了基于模糊逻辑的对比度增强和基于小波域的图像融合。为了让概念更具实践性，一个交互式\
  \ Streamlit 应用演示了这些增强技术在用户提供图像上的应用。最后，我们演示了先进的基于深度学习的增强方法，包括低光校正、去噪、去雾和超分辨率，使用预训练模型。\n\
  \n本章将涵盖的关键主题如下：\n\n- Point-wise intensity transformations\n- Tone and perceptual\
  \ enhancement\n- Image enhancement with histogram processing\n- Fuzzy logic-based\
  \ image enhancement\n- Linear noise-smoothing\n- Non-linear noise smoothing\n- Wavelet-based\
  \ image fusion and enhancement\n- Image enhancement with deep learning models\n\n\
  ## Technical requirements\n\n以下是本书配套 GitHub 仓库中对应本章的 Jupyter notebook 的链接：https://github.com/PacktPublishing/Hands-On-Image-Processing-and-Computer-Vision-with-Python-Second-Edition。在阅读本章不同章节时，请跟随此\
  \ notebook（并运行必要的代码片段）。为确保代码按预期运行并不受未来弃用或不向后兼容的更改影响，仓库同一文件夹中提供了 requirements.txt\
  \ 文件。使用以下命令安装：\n\n```\n```bash\npip install -r requirements.txt.\n```\n```\n\n##\
  \ Point-wise intensity transformations\n\n逐点强度变换将传输函数 *T* 应用于图像中每个像素 *f(x, y)*，生成\
  \ *g(x, y) = T(f(x, y))* 或 *s = T(r)*，其中 *r* 和 *s* 分别是输入和输出灰度级。这是一个无记忆操作。每个输出像素仅取决于其对应的输入值。虽然它既不增加也不恢复信息，但它增强了视觉外观或突出了特征，使其成为图像增强中常见的预处理步骤。\n\
  \n下图显示了点处理，以及掩模/核处理（对于空间滤波器，变换时也考虑邻域像素，如我们之前所见）：\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_306_0.png)\n\
  \n*Figure 7.1 – Point-wise pixel intensity transformation*\n\n一些流行的强度变换是图像负片、色彩空间变换、对数/幂律变换、对比度拉伸、标量量化和小波阈值。我们已在\
  \ *Chapter 1* 中讨论了一些。我们将从使用 PIL 对彩色 RGB 图像进行对数变换开始，然后讨论一些尚未涵盖的变换。\n\n## Log transform\n\
  \n当我们需要压缩或拉伸图像中某一范围的灰度级时，对数变换非常有用；例如，为了显示傅里叶频谱（其中直流分量值远高于其他分量，因此如果没有对数变换，其他频率分量几乎总是无法看到）。对数变换的点变换函数具有以下一般形式：\n\
  \n$s = T(r) = c\\log(1+r)$\n\n其中 c 为常数。请参阅 GitHub notebook 中 `plot_hist()` 函数的实现，以绘制输入图像颜色通道的直方图。现在让我们使用\
  \ PIL 图像模块的 `point()` 函数应用对数变换，并观察变换对给定 RGB 图像不同颜色通道直方图的影响，使用以下代码行：\n\n```\n```python\n\
  im = im.point(lambda i: 255*np.log(1+i/255))\nim_r, im_g, im_b = im.split()\n```\n\
  ```\n\n在对数内部加上 1 可确保输入始终 ≥ 1（因为像素值可以为 0），从而避免 log(0) 并使变换在数学上有效。\n\n如果你绘制 RGB 颜色通道在应用对数变换前后的输入/输出图像的直方图，并将\
  \ i/o 图像并排绘制，你应该会得到如下图所示的结果：\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_307_0.png)\n\
  \n*Figure 7.2 – Image and histogram of color channels before and after application\
  \ of the logarithm transform*\n\n让我们现在探索另一个非常重要的点变换方法，即幂律变换。\n\n\n\n\n## 幂律变换\n\n\
  如我们所见，该点变换（传递函数）的一般形式为：\n\n\\[\ns = T(r) = c r^\\gamma\n\\]\n\n其中 \\(c\\) 是常数。在第\
  \ 1 章中我们使用 `PIL.Image.point()` 方法将其应用于灰度图像，这次我们用 scikit-image 在 RGB 彩色图像上应用幂律变换，并可视化该变换对颜色通道直方图的影响。\n\
  \n```python\nim = img_as_float(imread('images/cheetah.png'))\nγ = 2.5 # try different\
  \ values here and observe the impact\nim_trans = im**γ\n```\n\n如果运行上述代码片段，并绘制图像及相应的\
  \ RGB 通道直方图，您将得到下图，该图展示了幂律变换前后的颜色通道直方图，以及原始图像和变换后的图像：\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_308_0.png)\n\
  \n令像素值归一化到 \\([0,1]\\) 范围内。\\(\\gamma\\) 的效果关键取决于它是小于 1 还是大于 1（如下表和下图所示）。\n\n- \
  \  当 \\(\\gamma < 1\\) 时，变换会扩展较低强度值，使暗区域变亮，提高阴影中的可见度。\n-   相反，当 \\(\\gamma > 1\\\
  ) 时，变换会压缩较低强度值，导致图像整体看起来更暗。\n\n| Gamma | 曲线形状 | 效果 |\n|---|---|---|\n| \\(\\gamma\
  \ < 1\\) | 对角线以上 | 使阴影变亮 |\n| \\(\\gamma = 1\\) | 直线 | 无变化 |\n| \\(\\gamma > 1\\\
  ) | 对角线以下 | 使图像变暗 |\n\n因此，与常见直觉相反，增大 \\(\\gamma\\) 并不会使图像变亮，而是使其变暗；而小于 1 的值则产生变亮效果。该变换是非线性的：它重新分配对比度，而不仅仅是亮度。\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_309_0.png)\n\n*图 7.4 – 幂律变换*\n\n## 亮度调整\n\
  \n亮度是图像最基本的属性之一。调整亮度在图像增强、预处理、视觉美感和可读性方面起着关键作用。在许多实际应用中，尤其是涉及低光、过曝或欠曝图像时，亮度校正是迈向更好图像理解或下游处理（如目标检测、OCR\
  \ 或分类）的第一步。让我们探讨如何使用 PIL 和 opencv-python 等库调整图像亮度。\n\n在数字成像中，亮度是指图像感知到的强度。对于灰度图像，它直接对应像素值。对于彩色图像，则更为微妙，通常与特定颜色空间（如\
  \ HSV、Lab 或 YUV）中的亮度或明度分量相关。对于图像 \\(I(x, y)\\)，亮度调整后的图像 \\(I'(x, y)\\) 通常按下式计算：\n\
  \n\\[\nI'(x, y) = \\alpha \\cdot I(x, y) + \\beta\n\\]\n\n其中 \\(\\alpha\\) 是对比度缩放因子（对于仅调整亮度通常为\
  \ 1），\\(\\beta\\) 是亮度偏移量（正值变亮，负值变暗）。\n\n由于数字图像以固定值范围表示（例如 8 位图像为 0–255），调整后的值必须进行裁剪：\n\
  \n\\[\nI'(x,y)=\\min(255,\\max(0,\\alpha\\cdot I(x,y)+\\beta))\n\\]\n\n下表列出了亮度调整非常有用的几个用例：\n\
  \n| 领域 | 目的 |\n|---|---|\n| 摄影 | 校正欠曝/过曝的照片 |\n| OCR 预处理 | 提高文本可见性 |\n| 监控 | 增强昏暗或夜间影像\
  \ |\n| 卫星图像 | 在分析前改善对比度 |\n| 医学成像 | 揭示扫描中的隐藏结构 |\n\n*表 7.2 – 不同场景下的亮度调整*\n\n###\
  \ 使用 PIL\n\n让我们首先通过以下代码片段探索如何使用 PIL 调整亮度，步骤如下：\n\n1.  首先，使用 `Image.open()` 加载图像，并使用\
  \ `ImageEnhance.Brightness(img)` 创建亮度增强器。\n2.  `enhance(1.5)` 方法将亮度提高 50%（其中 1.0\
  \ 为原始亮度）。\n3.  使用 matplotlib 并排显示原始图像和增亮图像以进行比较。\n\n本质上，它演示了如何使用 PIL 快速调整图像亮度并可视化结果。现在参考以下代码片段：\n\
  \n```python\nimg = Image.open('images/boy.png')\nenhancer = ImageEnhance.Brightness(img)\n\
  bright_img = enhancer.enhance(1.5)\ndark_img = enhancer.enhance(0.5)\n# plot images\
  \ and intensity histogram here, refer to github code\n```\n\n如果运行上述代码并并排绘制图像和通道直方图，您将得到类似下图的图像：\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_311_0.png)\n\n*图 7.5 – 使用 PIL 改变图像亮度*\n\
  \n它具有以下关键优点：使用直观，支持所有图像模式，并包含内置的伽马和色彩调整工具。\n\n### 使用 OpenCV-Python\n\n现在让我们使用以下代码片段，探索如何利用\
  \ opencv-python 通过仿射变换执行亮度调整。让我们通过以下逐步解释来理解代码：\n\n-   首先使用 `cv2.imread()` 以 BGR\
  \ 格式加载输入图像。使用函数 `cv2.cvtColor()` 将其转换为 RGB 格式，以便用 matplotlib 正确显示。\n-   使用函数 `cv2.convertScaleAbs()`\
  \ 对每个像素强度应用仿射变换：\n    \\[\n    I'(x,y) = \\alpha \\cdot I(x,y) + \\beta\n    \\\
  ]\n-   \\(\\alpha\\) 控制对比度：\n    -   \\(\\alpha > 1\\)：增大对比度（扩展强度范围）\n    -   \\\
  (0 < \\alpha < 1\\)：降低对比度（压缩强度范围）\n    -   \\(\\alpha = 1.0\\)：保持原始对比度\n\n```python\n\
  high_contrast_img = cv2.convertScaleAbs(img, alpha=2, beta=0)\n# Brightness increase\
  \ by adding constant\nhigh_brightness_img = cv2.convertScaleAbs(img, alpha=1.0,\
  \ beta=50)\nplt.imshow(np.hstack((img, high_contrast_img, high_brightness_img)))\n\
  plt.axis('off')\n```\n\n如果运行上述代码片段，您将得到下图：\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_313_0.png)\n\
  \n*图 7.6 – 使用 opencv-python 增加图像亮度*\n\n该方法简单、高效，常用于实时图像增强。它通过 alpha 和 beta 同时支持亮度和对比度调整，适合批量处理，并在计算机视觉流程中广泛使用。\n\
  \n## 色调与感知增强\n\n本节探讨基于强度的技术，如阈值处理、半色调化和抖动，这些技术通过修改像素色调来增强视觉感知，或为有限的显示和打印设备准备图像，包括广泛使用的\
  \ Floyd–Steinberg 误差扩散方法。\n\n### 阈值处理\n\n这是一种点运算，通过将低于某个阈值的所有像素设为 0，高于该阈值的所有像素设为\
  \ 1，从灰度图像创建二值图像。如果 \\(g\\) 是 \\(f\\) 在某个全局阈值 \\(T\\) 下的阈值化版本，则可以表示为：\n\n\\[\ng(x,y)=\\\
  begin{cases}1, & f(x,y)>T\\\\0, & \\text{otherwise}\\end{cases}\n\\]\n\n为什么需要二值图像？原因有很多，例如，我们可能希望将图像分离为前景和背景；图像要用黑白打印机打印（所有灰度阴影需要仅用黑白点表示）；或者我们希望使用**形态学运算**对图像进行预处理，这将在后续章节中讨论。\n\
  \n以下代码片段展示了如何使用 `PIL.Image.point()` 方法进行固定阈值处理：\n\n```python\nim = Image.open('images/swans.jpg').convert('L')\n\
  threshold = [0, 50, 100, 150, 200]\nfor i in range(2, 5):\n    im_bin = im.point(lambda\
  \ x: x > threshold[i])\n    # plot the binary image obtained with this threshold\
  \ value here\n```\n\n如果运行上述代码片段并可视化在不同阈值下获得的二值图像，您会注意到阈值的选择如何影响最终结果。首先，观察原始图像中像素强度的分布。当使用单个固定阈值时，所有像素被迫分为两类：黑色或白色。\n\
  \n这通常会导致原始图像中平滑过渡的丢失。因此，本应逐渐变化的区域反而呈现为不自然的、锐利的边界或带状图案。这些人为的带状图案被称为*伪轮廓*（它们之所以出现，是因为连续的灰度级被突然分割为仅两个级别，破坏了平滑的强度变化）。简而言之，图像不是平滑的阴影，而是看起来“阶梯状”或“海报化”，这降低了视觉质量，并可能隐藏重要细节。\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_314_0.png)\n\n*图 7.7 – 在灰度级别上使用不同阈值创建二值图像*\n\
  \n\n\n我们将在*第 9 章*中回顾阈值处理。\n\n## 随机半色调（随机抖动）\n\n在阈值处理（二值量化）中，减少假轮廓伪影的一种方法是在量化之前向输入图像添加均匀分布的白噪声。具体来说，对于灰度图像\
  \ $f(x,y)$ 的每个输入像素，我们添加一个独立的均匀 $[-128,128]$ 随机数（可以表示为一个独立的均匀随机变量 $n(x,y)\\sim U(-\\\
  Delta,\\Delta)$），然后应用阈值处理。这可以表示为：\n\n$$g(x,y)=1(f(x,y)+n(x,y)\\geq T)$$\n\n其中 $1(\\\
  cdot)$ 表示指示函数，若条件为真则等于 1，否则为 0；T 是阈值，$\\Delta$ 控制噪声幅度（例如，对于 8 位图像，$\\Delta=128$）。\n\
  \n这种技术通常被称为**随机抖动**，可视为**半色调**的一种简单形式，其中噪声用于打破大片均匀区域，并通过空间变化模拟中间灰度级。\n\n与强制将所有像素变成非黑即白的严格区域（这会产生条带效应）不同，添加的噪声会使相邻像素随机跨越阈值翻转。在一定距离外观看时，这些随机图案会被人类视觉系统感知为平滑的灰度级，从而减少可见的轮廓伪影。\n\
  \n下面的代码块给出了一个实现：\n\n```\nim = Image.open('images/swans.jpg').convert('L')\nim =\
  \ Image.fromarray(np.clip(im + np.random.randint(-128, 128, \\\n    (im.height,\
  \ im.width)), 0, 255).astype(np.uint8))\nthreshold = [0, 50, 100, 150, 200]\nfor\
  \ i in range(2, 5):\n    im_bin = im.point(lambda x: x > threshold[i])\n    # plot\
  \ binary image obtained with this threshold value here, refer\n    github\n```\n\
  \n如果运行上述代码片段并绘制所得到的二值图像，应得到下图：\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_316_0.png)\n\
  \n*图 7.8 – 使用阈值处理得到的二值图像*\n\n请注意，在上图中，尽管生成的二值图像有些噪声，但伪轮廓已显著减少；在足够的模糊下（例如，从远处观看时），它们会给我们一种具有多个灰度级的印象。\n\
  \n## 抖动\n\n虽然随机噪声添加（如半色调中讨论的）能减少可见的条带效应，但其方式是非结构化的。更一般地，**抖动**是指在量化之前或量化过程中刻意修改像素值的技术，目的是使量化误差在空间上分布，而不是集中在大片均匀区域。这种重新分布有助于打破诸如伪轮廓之类的人为图案，并产生中间灰度级的视觉错觉。抖动可以通过不同方式实现，包括**随机抖动**、**有序抖动**和**误差扩散方法**，每种方法在视觉质量和计算复杂度之间提供了不同的权衡。\n\
  \n## 带误差扩散的 Floyd–Steinberg 抖动\n\nFloyd–Steinberg 算法通过在扫描方向上向前扩散量化误差来执行抖动，确保局部误差由后续像素决策来补偿。它把一个像素的残余量化误差推（加）到其相邻像素上，留待后续处理。它按照下图所示的相邻像素分布，将量化误差扩散出去：\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_316_1.png)\n\n*图 7.9 – 使用 Floyd-Steinberg\
  \ 误差扩散抖动传播量化误差*\n\n在上图中，当前像素用星号（*）表示，空白像素表示先前已扫描的像素。算法从左到右、从上到下扫描图像。它逐一连续量化像素值；每次量化误差都会分配到相邻像素（尚未扫描）中，同时不影响已经量化的像素。如果多个像素被向下取整，那么算法就更有可能将接下来的像素向上取整，从而使平均量化误差接近于零。\n\
  \n令 $f(x,y) \\in [0,1]$ 表示输入灰度图像，$g(x,y) \\in \\{0,1\\}$ 表示二值化输出。\n\n在每个像素 $(x,y)$\
  \ 处，我们定义 $\\tilde{f}(x,y)=f(x,y)+e(x,y)$，其中 $e(x,y)$ 是从先前已处理像素传播过来的累积误差。\n\n关键步骤如下：\n\
  \n- **量化步骤：** 将该像素量化为最近的调色板值（对于二值图像，阈值为 $T=0.5$ 时）：\n  \n  $$g(x,y)=1\\bigl(\\tilde{f}(x,y)\\\
  ge T\\bigr)$$\n\n- **量化误差：** 在 $(x,y)$ 处的量化误差为：\n  \n  $$\\varepsilon(x,y)=\\tilde{f}(x,y)-g(x,y)$$\n\
  \n- **误差扩散：** 将该误差按照固定权重分布到相邻的未处理像素：\n  \n  $$e(x+1,y)\\mathrel{+}=\\frac{7}{16}\\\
  varepsilon(x,y),\\quad e(x-1,y+1)\\mathrel{+}=\\frac{3}{16}\\varepsilon(x,y)$$\n\
  \  $$e(x,y+1)\\mathrel{+}=\\frac{5}{16}\\varepsilon(x,y),\\quad e(x,y+1)\\mathrel{+}=\\\
  frac{1}{16}\\varepsilon(x,y)$$\n\n- **守恒性质：** 这些权重满足 $\\frac{7}{16}+\\frac{3}{16}+\\\
  frac{5}{16}+\\frac{1}{16}=1$，确保总量化误差被守恒并重新分布，而不是丢失。\n\n与引入*随机噪声*的随机抖动不同，Floyd–Steinberg\
  \ 使用确定性的、结构化的误差重新分布，从而：\n\n- 更好地保留图像结构\n- 降低噪声观感\n- 获得更高的感知质量\n\n接下来，Python 代码实现了\
  \ FS 抖动。下面列出了代码所执行的关键任务：\n\n1. **颜色量化（find_closest_palette_color）：** 该函数将像素映射到一组精简灰度级中最接近的值。对于\
  \ num_colors = k，该函数创建一个调色板，其中的灰度级在 0 到 255 之间等步长分布：$step = \\frac{255}{k-1}$。因此，像素强度会被取整到这\
  \ k 个灰度级中最接近的一个。\n2. **抖动（get_dithered_image）：** 算法访问每个像素，并将其量化为最近的调色板灰度级。它计算量化误差：\n\
  \   \n   $error = original - quantized$\n   \n   然后根据固定权重将误差分布到相邻像素，如伪代码所示。这种误差扩散即使图像仅限于\
  \ k 个灰度级，也能产生中间强度的错觉。\n3. **最终量化与裁剪：** 误差扩散后，图像再次被精确量化为 k 个灰度级。像素值被裁剪到 [0, 255]\
  \ 并转换为 uint8。\n4. **验证：** 代码使用 np.unique(dithered) 打印抖动图像中的唯一灰度级。这确认了输出符合预期的 k 个调色板灰度级。\n\
  \n现在，请参考下面的代码片段：\n\n```\ndef find_closest_palette_color(old_pixel, num_colors=2):\n\
  \    step = 255 / (num_colors - 1)\n    return np.round(old_pixel / step) * step\n\
  \ndef get_dithered_image(image, num_colors):\n    dithered = np.copy(image)\n  \
  \  h, w = dithered.shape\n    for x in range(h):  # Floyd-Steinberg Dithering\n\
  \        for y in range(w):\n            old_pixel = dithered[x, y]\n          \
  \  new_pixel = find_closest_palette_color(old_pixel, num_colors)\n            dithered[x,\
  \ y] = new_pixel\n            quant_error = old_pixel - new_pixel\n            if\
  \ y + 1 < w:\n                dithered[x, y + 1] += quant_error * 7 / 16\n```\n\n\
  ```python\nif x + 1 < h and y > 0:\n    dithered[x + 1, y - 1] += quant_error *\
  \ 3 / 16\nif x + 1 < h:\n    dithered[x + 1, y] += quant_error * 5 / 16\nif x +\
  \ 1 < h and y + 1 < w:\n    dithered[x + 1, y + 1] += quant_error * 1 / 16\nreturn\
  \ find_closest_palette_color(dithered, num_colors)\n\nimage = 255 * rgb2gray(imread('images/lena.jpg')[...,\
  \ :3])\nimage = image.astype(np.float32)\ndithered2 = get_dithered_image(image,\
  \ 2)\ndithered4 = get_dithered_image(image, 4)\n# Display the original and dithered\
  \ images side-by-side here\n```\n\n如果运行上述代码片段，应得到下图。该图显示，与之前的半色调方法相比，所获得的二值图像（使用\
  \ 2 个灰度级）的质量有了极大改善。当在抖动中使用 4 个灰度级时，可以注意到质量进一步提高。\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_319_0.png)\n\
  \n*图 7.10 – Floyd-Steinberg 抖动*\n\n总结如下：\n\n- 算法按**因果扫描顺序**（从左到右、从上到下）处理像素。\n- 已经量化的像素保持不变。\n\
  - 后续像素会**受到先前误差的影响**，从而促使进行补偿。如果较早的像素被向下取整，后续像素往往会被向上取整。这保持了**局部平均强度**，从而产生没有条带效应的视觉平滑结果。\n\
  \n\n\n\n\n伪代码中呈现的 Floyd–Steinberg 抖动输出的是二值（黑白）图像，但这段代码更加灵活和强大！该算法的这个版本允许你生成具有 k\
  \ 个不同灰度级的抖动灰度图像，而不仅仅是 2 个！无论你想要模拟复古打印机还是在保留视觉丰富度的同时压缩图像数据，只需选择：`num_colors = k`（例如，2、4、8...），代码将：\n\
  \n- 自动创建 k 个等间距的灰度级调色板（例如，k=4 时为 [0, 85, 170, 255]）\n- 智能地量化并扩散像素误差以产生自然的外观结果\n\
  - 显示并验证输出中唯一色调的数量\n\n与通常为二值量化呈现的经典 Floyd–Steinberg 公式不同，这种方法通过选择适当数量的输出强度级（`num_colors=k`）自然地扩展到\
  \ k 级灰度量化。调色板随后被构造为均匀间隔的灰度级，并且相同的误差扩散机制无需修改即可应用。该框架可进一步推广到彩色图像，通过对每个通道独立应用抖动处理。\n\
  \n阈值化速度快；它非常适合高对比度应用，如文本。半色调适用于传统印刷，当没有灰度时，而抖动则擅长用最少的灰度级模拟平滑色调。下表比较了上述三种方法：\n\n\
  | Feature | Thresholding | Halftoning | Dithering |\n|---|---|---|---|\n| Output\
  \ | Binary | Patterned dots | Multi-tone illusion |\n| Complexity | Very low | Medium\
  \ | High |\n| Spatial Context | None | Yes (patterned) | Yes (diffuses error) |\n\
  | Visual Quality | Low for photos | Medium–high | High |\n| Customization | Static\
  \ threshold | Grid patterns | Quantization + error |\n| Hardware Use | Scanners\
  \ | Printers | Displays, encoders |\n\n*Table 7.4 – Thresholding vs. Halftoning\
  \ vs. Dithering*\n\n## 图像增强与直方图处理\n\n直方图处理技术提供了一种更好的方法来改变图像中像素值的动态范围，使得其强度直方图具有期望的形状。正如我们所见，图像增强通过对比度拉伸操作是有限的，因为它只能应用线性缩放函数。\n\
  \n### 直方图滑动（平移）\n\n滑动对每个像素加上或减去一个常数，在保持对比度的同时均匀地移动亮度。数学上可以表示为：\n\n`I' = I + Δ`\n\
  \n下一段代码实现了上述直方图修改方法：\n\n```\ndef histogram_stretching(image):\n    min_val, max_val\
  \ = np.min(image), np.max(image)\n    stretched = 255 * (image - min_val) / (max_val\
  \ - min_val)\n    return stretched.astype(np.uint8)\n\ndef histogram_shrinking(image,\
  \ target_range=(100, 200)):\n    min_val, max_val = np.min(image), np.max(image)\n\
  \    shrunk = (image - min_val) / (max_val - min_val) * \\\n            (target_range[1]\
  \ - target_range[0]) + target_range[0]\n    return shrunk.astype(np.uint8)\n\ndef\
  \ histogram_sliding(image, shift_value=30):\n    slid = np.clip(image + shift_value,\
  \ 0, 255)\n    return slid.astype(np.uint8)\n\nimage = cv2.imread('images/mandrill.jpg')\n\
  image = cv2.cvtColor(image, cv2.COLOR_BGR2LAB)\nstretched_image = image.copy()\n\
  shrunk_image = image.copy()\nslid_image = image.copy()\ni = 0 # only stretch the\
  \ intensity channel L, the very first channel\nstretched_image[...,i] = histogram_stretching(stretched_image[...,i])\n\
  shrunk_image[...,i] = histogram_shrinking(shrunk_image[...,i])\nslid_image[...,i]\
  \ = histogram_sliding(slid_image[...,i])\nimage = cv2.cvtColor(image, cv2.COLOR_LAB2RGB)\n\
  stretched_image = cv2.cvtColor(stretched_image, cv2.COLOR_LAB2RGB)\nshrunk_image\
  \ = cv2.cvtColor(shrunk_image, cv2.COLOR_LAB2RGB)\nslid_image = cv2.cvtColor(slid_image,\
  \ cv2.COLOR_LAB2RGB)\nplt.imshow(np.hstack((image, stretched_image, shrunk_image,\
  \ slid_image)))\n```\n\n如果你运行上述代码片段，你应该得到以下图像：\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_323_0.png)\n\
  \nFigure 7.11 – Histogram stretching, shrinking, and sliding\n\n### 使用 scikit-image\
  \ 进行对比度拉伸和直方图均衡化\n\n直方图均衡化使用单调且非线性的映射，该映射重新分配输入图像中的像素强度值，使得输出图像具有均匀的强度分布（平坦的直方图），从而增强图像的对比度。下图描述了直方图均衡化的变换函数：\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_323_1.png)\n\nFigure 7.12 – Transform\
  \ function for histogram equalization\n\n以下代码块展示了如何使用 scikit-image 的 `exposure`\
  \ 模块的 `equalize_hist()` 函数进行直方图均衡化。直方图均衡化实现有两种不同的风格：一种是对整个图像的全局操作，而第二种是局部（自适应）的，通过将图像分成块并对每个块运行直方图均衡化，使用\
  \ `equalize_adapthist()` 函数。下一段代码片段还比较了使用 scikit-image 的两种不同直方图处理技术，即对比度拉伸和直方图均衡化所获得的图像增强效果。\n\
  \n```\nim = io.imread('images/beans_g.png')\nim_rescale = exposure.rescale_intensity(im,\
  \ \\\n    in_range=(0, 100), out_range=(0, 255)) # contrast stretching\nim_rescale\
  \ = im_rescale.astype(np.uint8)\nim_eq = exposure.equalize_hist(im) # Global histogram\
  \ equalization\nim_adapteq = exposure.equalize_adapthist(im, \\\n    clip_limit=0.03)\
  \ # Local (adaptive) histogram equalization\n```\n\n如果你运行上述代码片段并绘制图像以及 CDF（参考 GitHub\
