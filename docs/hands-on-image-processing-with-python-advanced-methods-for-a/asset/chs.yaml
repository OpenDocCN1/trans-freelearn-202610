  \n*Figure 2.36 – Extracting the red, green, and blue channels of the parrot image\
  \ with PIL*\n\n上图显示了通过运行前述代码片段为每个 RGB 通道创建的三个输出图像。\n\n## 合并图像的多个通道\n\n我们可以使用 `merge()`\
  \ 函数来合并多通道图像的通道，如下代码所示，其中在交换红色和蓝色通道后，将通过拆分鹦鹉 RGB 图像获得的颜色通道合并：\n\n```\n```python\n\
  im = Image.merge('RGB', (ch_b, ch_g, ch_r)) # swap the red and blue channels\nim.show()\n\
