- "## 前言\n\n图像处理和计算机视觉已成为现代人工智能的基础技术，使机器不仅能够增强和分析图像，还能解释、理解并生成视觉内容。如今，这些技术广泛应用于医疗保健、自主系统、机器人技术、遥感、科学成像、制造业和创意媒体等领域。\n\
  \n本书以实践和数学为基础，带领读者从数字图像处理的基础知识，一路深入到计算机视觉和生成式AI的最新进展，并全程使用Python。从图像表示、采样、量化、傅里叶分析、卷积以及空间域和频域滤波等核心概念开始。在这些基础上，探讨了图像增强、基于导数的处理，以及用于解决实际成像问题的经典图像复原技术。\n\
  \n随后，本书转向现代计算机视觉范式，包括图像分割、图像分类和目标检测，涵盖了经典方法和基于深度学习的方法。读者将获得广泛使用的架构和框架的实践经验，以及医学成像、遥感、工业检测和场景理解等领域的应用。\n\
  \n最后一章介绍了正在重新定义计算机视觉的前沿生成式AI方法。主题包括GAN、VAE、扩散模型、Stable Diffusion、ControlNet、DALL·E、基于GPT的图像系统以及多模态视觉-语言模型。这些方法展示了视觉系统从被动感知到主动生成、编辑、修复以及基于视觉数据进行推理的演变。\n\
  \n本书的核心哲学是从第一性原理出发进行学习。每个主题都通过严谨的数学基础进行阐述，并辅以直观的解释和实用的Python实现。这种理论、直觉和动手编码的整合，旨在帮助读者不仅理解这些方法如何工作，还理解它们为何有效。\n\
  \n在第二版中，内容经过广泛修订和扩展，以反映深度学习、多模态AI和生成建模的快速发展。新内容包含了最新的最先进方法，同时保持了对数学严谨性和实际实现的高度重视。\n\
  \n\n\nPython 库发展迅速，函数、类或 API 可能在不同版本中被弃用、重命名或移除。此外，由于许多库由不同团队独立开发，一个包的变化可能与其他包产生不兼容，并破坏依赖链。因此，版本不匹配可能需要固定包版本、更新依赖或进行少量代码修改，以确保本章示例的顺利执行。\n\
  \n建议读者查阅随附的 GitHub 仓库，获取最新的代码更新和补充材料。\n\n无论您是学生、研究人员、工程师还是从业者，本书都提供了一条从经典图像处理到现代计算机视觉和最新生成式\
  \ AI 系统的全面路径。关注 https://youtube.com/@sandipanumbc 获取更多关于这些主题的视频和教程。\n\n### 本书面向的读者\n\
  \n本书面向计算机视觉、机器学习和深度学习领域的学生、研究人员、工程师和从业者，他们希望打下坚实的图像处理基础，并进阶到现代视觉系统，包括图像分类、目标检测、分割、生成式\
  \ AI 和最先进（SOTA）的深度学习模型。本书面向那些希望超越黑盒使用，并使用 NumPy、OpenCV、PyTorch 和 TensorFlow 等工具理解底层数学原理、算法和实现的\
  \ Python 开发者和应用科学家。假定读者具备基本的 Python、线性代数和概率知识，而事先接触过机器学习或图像处理虽有帮助但并非必需。\n\n### 本书涵盖的内容\n\
  \n第 1 章，数字图像处理入门，介绍了数字图像表示、采样、量化和使用 Python 进行图像 I/O 的基础知识，以及使用 PIL、OpenCV 和 scikit-image\
  \ 等核心库进行图像读取、写入和显示。\n\n第 2 章，图像处理操作，涉及使用 NumPy、PIL 和 scikit-image 进行高级图像处理，包括几何变换、强度操作、混合、合成、alpha\
  \ 蒙版、直方图分析、绘制基元和多通道图像处理。\n\n第 3 章，更多图像处理操作，展示了如何使用 OpenCV、SciPy、PIL 和 scikit-image\
  \ 等多个库执行高级图像处理，涵盖基于 LUT 的变换、颜色效果、几何扭曲、单应性、鱼眼校正、插值和基于图像的特效。\n\n第 4 章，采样与傅里叶变换，通过采样和量化探索图像形成，包括上采样、下采样、混叠、插值，并使用\
  \ DFT、FFT、DCT 和 Walsh-Hadamard 变换及其数学性质对频域分析进行严格介绍。\n\n第 5 章，卷积与空间/频率域滤波，解释了空间域和频率域中的卷积理论，包括相关性、模板匹配、高斯滤波、卷积定理，以及使用\
  \ SciPy、OpenCV 和 PyTorch 的实际实现，还包括 2D 和 3D 卷积概念。\n\n第 6 章，频率域滤波，详细介绍了频率域滤波技术，包括使用理想、巴特沃斯和高斯形式实现的低通、高通、带通和陷波滤波器，以及它们在去噪、周期性噪声去除和傅里叶特征表示中的应用。\n\
  \n第 7 章，图像增强，涵盖了逐点强度变换、直方图处理、对比度增强、抖动、基于模糊逻辑的增强、颜色校正、去噪技术、小波方法，以及现代基于深度学习的增强模型，包括\
  \ Zero-DCE、BM3D 和 EDSR。\n\n第 8 章，基于导数的图像增强，解释了基于导数的图像处理，包括梯度、拉普拉斯算子、边缘检测（Sobel、Canny、LoG、DoG、罗盘滤波器）、各向异性扩散、结构和脊线检测、多尺度金字塔，以及基于深度学习的边缘检测方法。\n\
  \n第 9 章，图像复原：成像中的逆问题，对图像复原进行了严格论述，包括去卷积、维纳滤波、Tikhonov 正则化、贝叶斯公式、CLEAN 算法、稀疏表示，以及现代基于深度学习的复原和修复方法，如\
  \ NAFNet、LaMa 和扩散模型。\n\n第 10 章，图像分割：从经典方法到深度学习，解释了从阈值分割、分水岭、超像素和变分方法到深度学习方法的各类分割技术，包括\
  \ FCN、DeepLab、Mask R-CNN、基于 YOLO 的分割，以及基于 Transformer 的模型，如 SegFormer、Mask2Former\
  \ 和 DETR。\n\n第 11 章，图像分割的更多深度学习方法，探索了可提示和多模态分割模型，如 SAM 和基于 CLIP 的方法、视觉-语言集成、单目深度估计、3D\
  \ 重建、医学和遥感分割，以及 IoU、Dice 和 mAP 等评估指标。\n\n第 12 章，图像分类与目标检测，详细介绍了使用 CNN、迁移学习、Vision\
  \ Transformer、少样本和零样本学习、自监督学习、对抗鲁棒性、OCR 流水线、人脸识别进行的图像分类和检测，以及现实世界应用，包括 AR 滤镜、深度伪造和工业检测系统。\n\
  \n第 13 章，图像处理和计算机视觉中的生成式 AI，探索了从 GAN 和 VAE 到扩散模型和大规模基础模型的生成建模，包括 Stable Diffusion、ControlNet、DALL·E\
  \ 和基于 GPT 的图像系统，以及它们在图像合成、编辑、修复、复原、多模态推理以及科学、医学和工业领域的特定生成应用。\n\n### 充分利用本书\n\n读者应具备\
  \ Python 编程的基础知识、机器学习和深度学习的基本概念，以及对大型语言模型的基本了解。熟悉计算机视觉工作流程和 AI 模型 API 会有所帮助。线性代数、微积分和优化的基础知识将大大有助于理解理论和数学部分。本书假定读者对\
  \ AI 开发环境有一定经验，并且能够熟练使用 API。\n\n要运行示例，需要访问 Python 环境。本书中的大部分代码是在 Windows 11 x64\
