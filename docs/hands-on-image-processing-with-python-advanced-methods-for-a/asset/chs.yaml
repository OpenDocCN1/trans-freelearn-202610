  \ of PATCH\npad_h = (PATCH - H % PATCH) % PATCH\npad_w = (PATCH - W % PATCH) % PATCH\n\
  img_pad = np.pad(img, ((0, pad_h), (0, pad_w), (0, 0)), mode='reflect')\nmask_pad\
  \ = np.pad(mask, ((0, pad_h), (0, pad_w), (0, 0)), mode='reflect')\nHp, Wp, _ =\
  \ img_pad.shape\n```\n\n尽管采用了有效的分块、注意力融合和类别不平衡处理，遥感分割仍然具有挑战性，原因在于高分辨率复杂性、多传感器变异性和严重的类别不平衡，这促使了像混合注意力\
  \ U-Net 这样专门的架构，以实现更好的全局上下文建模和精细细节保留。\n\nMAnet 架构提供了若干重要优势：\n\n- 改进的上下文推理\n- 增强的边界定位\n\
  - 更好的小目标检测\n- 高效的编码器-解码器融合\n- 对类别不平衡的鲁棒性\n\n注意力机制在遥感中特别有用，因为卫星场景包含跨越多个尺度的高度异构空间结构。\n\
  \n## 应用\n\n混合注意力卫星分割系统广泛应用于土地覆盖分类、洪水制图、作物监测、野火评估、城市扩张分析、军事侦察、海岸线提取、道路网络检测和环境监控。这些系统构成了现代地理空间\
  \ AI 管道的关键组成部分。\n\n在探索了涵盖经典、深度学习和基于 Transformer 的范式的各种分割方法后，我们现在以介绍用于定量评估分割性能的标准评估指标作为本章的结尾。\n\
  \n## 分割评估指标\n\n评估分割模型的质量与设计模型本身一样重要。在语义分割和实例分割中，预测掩膜 Ŷ 必须与真实掩膜 Y 进行比较，以量化模型识别对象边界和语义区域的准确性。\n\
  \n设 $Y \\subseteq \\Omega$ 表示属于真实对象区域的像素集合，$\\hat{Y} \\subseteq \\Omega$ 表示预测的分割区域，其中\
  \ $\\Omega$ 为图像域。\n\n对于二值分割，每个像素要么属于前景类，要么属于背景类。真实类别与预测类别之间的比较通常使用混淆矩阵量来表达：\n\n\
  - **True Positive (TP):** 正确预测的前景像素\n- **False Positive (FP):** 错误预测为前景的背景像素\n-\
  \ **False Negative (FN):** 模型遗漏的前景像素\n- **True Negative (TN):** 正确预测的背景像素\n\n这些量构成了大多数分割指标的基础。\n\
  \n## 交并比指标\n\n交并比 Intersection over Union (IoU) 指标，也称为 Jaccard Index，衡量预测区域与真实区域之间的重叠程度：\n\
  \nIoU = |Y ∩ Ŷ| / |Y ∪ Ŷ|\n\n其中 Y ∩ Ŷ 表示交集（共同像素），Y ∪ Ŷ 表示并集（属于任一掩膜的所有像素）。\n\n使用混淆矩阵术语，\n\
  \nIoU = TP / (TP + FP + FN)\n\n其中 IoU = 1 为完美分割，IoU = 0 表示无重叠。IoU 越高，表示定位和边界一致性越好。IoU\
  \ 同时惩罚假阳性和假阴性，使其成为语义分割最可靠的指标之一。\n\nIoU 广泛用于医学图像分割、自动驾驶、卫星图像分析、器官和肿瘤分割，以及 Cityscapes\
  \ 和 Pascal VOC 等基准数据集。对于多类分割，IoU 对每个类别独立计算并取平均：\n\nmIoU = 1/C Σ_{c=1}^C IoU_c\n\n\
  其中 C 为类别数。\n\n## Dice 系数\n\nDice 相似系数 Dice Similarity Coefficient (DSC) 衡量两个集合之间的相似性，在医学成像中特别流行：\n\
  \nDice = 2|Y ∩ Ŷ| / (|Y| + |Ŷ|)\n\n用混淆矩阵量表示，\n\nDice = 2TP / (2TP + FP + FN)\n\n\
  Dice 系数与 IoU 密切相关：\n\nDice = 2·IoU / (1 + IoU)\n\n反之，\n\nIoU = Dice / (2 − Dice)\n\
  \n### Note\n\nDice 的取值范围为 0 到 1。Dice 越高，表示重叠越强。Dice 比 IoU 对小结构更敏感。这一特性使 Dice 特别适用于肿瘤分割、病变检测、血管分割和脑\
  \ MRI 分析。\n\n## Dice 损失\n\n深度学习模型通常优化 Dice 损失：\n\n```\nL_Dice = 1 − Dice\n```\n\n\
  或其可微分的软版本：\n\n```\nL_Dice = 1 − (2 Σ_i p_i g_i + ε) / (Σ_i p_i + Σ_i g_i + ε)\n\
  ```\n\n其中 p_i 为预测概率，g_i 为真实标签，ε 用于防止除零。Dice 损失对于前景仅占图像一小部分的失衡数据集非常有效。\n\n## 像素准确率\n\
  \n像素准确率衡量正确分类像素的比例：\n\n```\nAccuracy = correct pixels / total pixels\n```\n\n对于二值分割，\n\
  \n```\nAccuracy = (TP + TN) / (TP + TN + FP + FN)\n```\n\n像素准确率评估全局分类正确性，但在高度不平衡的数据集上可能具有误导性。有时会出现准确率很高，但分割完全无用的情况，因为对象从未被检测到。因此，像素准确率不应单独用于分割评估。\n\
  \n## 平均像素准确率\n\n对于多类分割，我们有：\n\n```\nMean Accuracy = (1/C) Σ_{c=1}^C TP_c / (TP_c\
  \ + FN_c)\n```\n\n其中 C 为语义类别数。\n\n## 平均平均精度\n\n平均平均精度 Mean Average Precision (mAP)\
  \ 指标在实例分割和目标检测中广泛使用，特别是对于 Mask R-CNN、YOLO 和 Detectron2 等模型。与语义分割指标不同，mAP 同时评估：\n\
  \n- 定位质量\n- 分类正确性\n\n## 精确率和召回率\n\n精确率定义为：\n\nPrecision = TP / (TP + FP)\n\n而召回率为：\n\
  \nRecall = TP / (TP + FN)\n\n如果其 IoU 超过阈值，则认为预测是正确的，通常为：IoU ≥ 0.5。该标准通常写为 AP₅₀。\n\
  \n## 平均精度\n\n对于给定类别，在不同置信度阈值下计算精确率-召回率曲线。平均精度 AP 为该曲线下的面积：\n\nAP = ∫₀¹ p(r) dr,\n\
  \n其中 p(r) 是召回率的函数。\n\n平均平均精度：所有类别的平均值给出：\n\nmAP = 1/C Σ_{c=1}^C AP_c\n\n## COCO\
  \ 风格的 mAP\n\nCOCO 基准在多个 IoU 阈值上评估 AP：{0.50,0.55,0.60,...,0.95} 并取平均：\n\nmAP_coco\
  \ = 1/10 Σ_{t=0.50}^{0.95} AP_t\n\n这比仅使用 AP₅₀ 产生更严格的评估。\n\n## 获取本书的 PDF 版本和更多内容\n\
  \n扫描二维码（或访问 packtpub.com/unlock）。按书名搜索本书，确认版本，然后按照页面上的步骤操作。\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_596_0.png)\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_596_1.png)\n\nNote: Keep your invoice\
  \ handy. Purchases made directly from Packt don’t require an invoice.\n\n\n\n\n"
- "### 12 图像分类与目标检测\n\n在上一章关于图像分割的基础上，本章探讨了两个基础的计算机视觉任务——图像分类和目标检测，这些任务使机器能够识别、分类、定位和解释视觉内容。本章从特征可视化和迁移学习开始，逐步介绍现代范式，如\
  \ Transformer、自监督学习、少样本学习、联邦学习和对抗鲁棒性，然后再研究高级检测、实例分割、OCR、地标分析以及实际的视觉应用。综合起来，这些技术构成了智能视觉理解系统的基础，架起了低级图像处理与高级语义推理之间的桥梁。\n\
  \n现代图像分类网络并非直接在像素空间中运行。相反，它们将图像转换为高维特征嵌入，在其中语义相似性变得在几何上具有意义。\n\n在本章中，我们将学习以下主题：\n\
  \n- 使用 t-SNE 可视化高维图像特征\n- 图像分类\n- 用于图像分类的迁移学习\n- 使用注意力网络进行图像分类\n- 少样本学习\n- 用于图像分类的贝叶斯神经网络\n\
  - 使用半监督学习进行图像分类\n- **掩码自编码器 (MAE)**\n- 联邦学习（隐私保护深度学习）用于分布式图像分类\n- 针对图像分类的神经网络对抗攻击\n\
  - 利用 EfficientNet 特征构建图像搜索引擎\n- 目标检测\n- 使用 RetinaNet 进行目标检测\n- 使用 Mask R-CNN 进行目标检测和实例分割\n\
  - 光学字符识别和视觉语言文本提取管道\n- 使用 MediaPipe 的增强现实滤镜和基于地标的人脸-手部分析\n- 手部地标检测和手势可视化\n- 使用首阶运动模型进行\
  \ Deepfake 生成\n- 使用 YOLOv8 分割进行车辆损伤检测和严重程度评估\n\n### 技术要求\n\n在阅读本章各节的同时，请跟随 Jupyter\
  \ 笔记本（并运行必要的代码片段）。以下是本章对应笔记本的 GitHub 链接：https://github.com/PacktPublishing/Hands-On-Image-Processing-and-Computer-Vision-with-Python-Second-Edition。在运行代码之前，必须安装正确版本的库，才能无缝运行代码。如果版本不匹配，代码可能需要根据库中某些功能/函数是否被移除或弃用进行少量调整。\n\
  \n### 使用 t-SNE 可视化高维图像特征\n\n在训练图像分类器或目标检测器之前，了解图像在特征空间中的表示方式通常很有用。深度神经网络将图像转换为高维嵌入向量，其几何结构编码了语义信息。属于相似类别的图像往往聚类在一起，而不相关的图像则占据特征空间的远距离区域。\n\
  \n不幸的是，这些特征向量可能包含数百或数千个维度，无法直接可视化。降维技术如主成分分析（PCA）和 t-分布随机邻域嵌入（t-SNE）提供了一种将高维表示投影到二维空间同时保留重要结构关系并在\
  \ 2-D（或 3-D）中可视化的机制。可视化有助于建立直觉，了解神经网络如何在特征空间中组织和分离视觉概念，使学习到的表示更易于解释和分析。\n\n本节演示了如何使用\
  \ t-SNE 可视化原始图像表示以及从预训练卷积神经网络提取的深度特征。\n\n### 使用 t-SNE 的 MNIST 嵌入\n\nMNIST 数据集由 70,000\
  \ 张大小为 28 × 28 的灰度手写数字图像组成。每张图像可视为 784 维空间中的一个向量 x ∈ ℝ⁷⁸⁴。虽然人类可以轻松区分数字，但在 784 维空间中手写数字的分布很难直接解释。\n\
  \n**主成分分析：** 一种常见的降维方法是主成分分析（PCA），它寻求最大方差的正交方向。给定中心化观测值 $X = [x_1, x_2, ..., x_n]^T$，PCA\
  \ 计算协方差矩阵 $C = \\frac{1}{n} X^T X$ 并求解特征向量 $C v_i = \\lambda_i v_i$。前导特征向量定义了保留最大方差的投影方向。虽然\
  \ PCA 计算效率高，但它是一种线性变换，通常无法保留图像数据集中存在的非线性结构。\n\n**t-分布随机邻域嵌入（t-SNE）：** t-SNE 由 van\
  \ der Maaten 和 Hinton 于 2008 年提出，是一种专门为可视化设计的非线性降维技术。对于每对样本 $x_i$ 和 $x_j$，在原始空间中定义一个概率分布：\n\
  \n$$p_{j|i} = \\frac{\\exp\\left(-\\frac{|x_i - x_j|^2}{2\\sigma_i^2}\\right)}{\\\
  sum_{k \\neq i} \\exp\\left(-\\frac{|x_i - x_k|^2}{2\\sigma_i^2}\\right)}$$\n\n\
  低维嵌入点 $y_i$ 定义了另一个概率分布：\n\n$$q_{ij} = \\frac{(1 + |y_i - y_j|^2)^{-1}}{\\sum_{k\
  \ \\neq l} (1 + |y_k - y_l|^2)^{-1}}$$\n\n使用 Student t 分布。\n\n最优嵌入通过梯度下降最小化 Kullback-Leibler\
  \ 散度：\n\n$$KL(P||Q) = \\sum_i \\sum_j p_{ij} \\log \\frac{p_{ij}}{q_{ij}}$$\n\n\
  与 PCA 不同，t-SNE 更关注保留局部邻域关系而非全局方差。\n\n**MNIST 可视化：** 以下示例随机选择 10,000 张 MNIST 图像并比较\
  \ PCA 和 t-SNE 投影。仅显示了必要的代码（完整代码请参阅 GitHub）。\n\n```python\nX, y = fetch_openml('mnist_784',\
  \ version=1, return_X_y=True)\nX = X.values / 255.0\nidx = np.random.choice(len(X),\
  \ 10000)\nX, y = X[idx], y[idx]\npca = PCA(n_components=2)\nX_pca = pca.fit_transform(X)\n\
  tsne = TSNE(n_components=2, perplexity=40, random_state=0)\nX_tsne = tsne.fit_transform(X)\n\
  ```\n\n resulting two-dimensional embeddings are visualized using scatter plots.\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_600_0.png)\n\n*Figure 12.1 - PCA vs.\
  \ t-SNE 2D manifolds for MNIST*\n\nPCA 投影通常在数字类别之间表现出大量重叠，因为线性投影无法有效分离复杂流形。然而，t-SNE\
  \ 嵌入揭示了对应于数字 0–9 的不同簇。视觉外观相似的数字，如 4 和 9 或 3 和 5，可能更接近，而视觉上不同的类别则占据单独区域。\n\n该实验说明了现代计算机视觉中的一个重要原则：属于同一语义类别的图像通常位于嵌入在更高维空间中的低维流形上。\n\
  \n### 可视化 VGG16 的深度特征\n\n前一个示例直接将 t-SNE 应用于原始图像像素。现代深度学习系统很少在像素空间中运行。相反，图像被转换为由卷积神经网络学习的可区分特征嵌入。为了演示这一概念，我们使用预训练的\
  \ VGG16 网络并可视化从 Animal-10 数据集提取的特征。\n\n**使用 VGG16 进行特征提取：** 预训练的 VGG16 网络在其输出附近包含多个全连接层。倒数第二层，记为\
  \ FC2，产生 4096 维特征向量：\n\n$$f = f_{VGG16}(x) \\in \\mathbb{R}^{4096}$$\n\n它捕获语义图像内容。不是使用最终的分类输出，而是提取这些特征向量并用作图像描述符。特征提取器创建如下：\n\
  \n```python\nmodel = VGG16(weights='imagenet')\nfeat_extractor = Model(inputs=model.input,\n\
  \    outputs=model.get_layer(\"fc2\").output)\n```\n\n每张图像被调整大小并通过网络转发。\n\n```python\n\
  feat = feat_extractor.predict(x).ravel()\nfeatures.append(feat)\n```\n\n\n\n产生每个图像一个\
  \ 4096 维的表示。\n\n**将 t-SNE 应用于 CNN 特征：** 获取深度特征后，应用 t-SNE。\n\n```\ntsne = TSNE(n_components=2)\n\
  embedding = tsne.fit_transform(features)\n```\n\n所得坐标使用颜色编码的动物类别进行可视化。与原始像素不同，VGG16\
  \ 特征编码了从数百万张图像中学习到的高级语义信息。因此，|f_i − f_j| 成为视觉相似度的有意义度量。如前所述，狗的图像往往占据特征空间中相近的区域，而大象和蝴蝶则相距更远。所得的\
  \ t-SNE 图通常会显示出与动物类别相对应的良好分离的簇，尽管网络从未在 Animal-10 数据集上进行过显式训练。这一现象展示了深度卷积表示的 remarkable\
  \ 可迁移性。\n\n**缩略图可视化：** 更具信息量的可视化方法是在 t-SNE 嵌入上叠加实际图像缩略图，使用 AnnotationBbox()。用户不再只是观察彩色点，而是可以直接检查哪些图像占据相邻位置。此类可视化为数据集探索、异常检测、特征调试、迁移学习分析和嵌入质量评估提供了强大的工具。\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_601_0.png)\n\n图 12.2 – Animal-10 数据集样本的\
  \ t-SNE 2D 流形可视化\n\n虽然 t-SNE 可视化特征嵌入，但 **可解释 AI** 技术例如 *激活图* 可视化揭示了 CNN 层学习了什么，这促使接下来开发的\
  \ CNN Brain Viewer Dashboard。\n\n## CNN 脑查看器仪表板\n\n深度学习系统的一个常见批评是其似乎缺乏可解释性。尽管卷积神经网络实现了\
  \ remarkable 的分类准确率，但理解中间层捕获了什么信息仍然具有挑战性。一个有用的策略是可视化网络各处生成的激活图。\n\n**从边缘到语义：** CNN\
  \ 学习分层表示：\n\n| 层深度 | 通常学习到的特征 |\n|---|---|\n| 早期层 | edges, corners |\n| 中间层 | textures,\
  \ patterns |\n| 深层 | object parts |\n| 最终层 | semantic concepts |\n\n*表 12.1: CNN\
  \ 的分层表示*\n\n这种层次结构类似于人类视觉皮层的处理方式，其中更抽象的表示在更深的区域中出现。\n\n**ResNet18 特征可视化：** 仪表板使用预训练的\
  \ ResNet18 模型。向前钩子附加到选定的层。\n\n```\ndef hook_fn(name):\n    def hook(module, input,\
  \ output):\n        activations[name] = output.detach()\n    return hook\n\nmodel\
  \ = models.resnet18(weights=models.ResNet18_Weights.DEFAULT).to(DEVICE)\nmodel.eval()\n\
  activations = {} # hooks storage\nmodel.conv1.register_forward_hook(...) # register\
  \ layers\nmodel.layer1.register_forward_hook(...)\nmodel.layer2.register_forward_hook(...)\n\
  model.layer3.register_forward_hook(...)\nmodel.layer4.register_forward_hook(...)\n\
  ```\n\n向前钩子提供了一种非侵入式的方法，可以在不改变其架构或重新训练模型的情况下从预训练网络捕获中间激活，从而使特征可视化变得简单可靠。这些钩子在推理期间捕获中间特征张量。\n\
  \n对于特征张量 $A \\in \\mathbb{R}^{C\\times H\\times W}$，通过在通道上平均计算简单的激活图：\n\n$$M(x,y)=\\\
  frac{1}{C}\\sum_{c=1}^{C}A_c(x,y),$$\n\n得到网络注意力的粗略表示。\n\n**热力图叠加：** 激活图被归一化：\n\n\
  $$M' = \\frac{M-\\min(M)}{\\max(M)-\\min(M)}$$\n\n并叠加到原始图像上。\n\n```\noverlay_img\
  \ = 0.5 * image + 0.5 * heatmap\n```\n\n所得可视化突出显示强烈激活特定 CNN 层的图像区域。\n\n### 使用 Gradio\
  \ 进行交互式探索\n\n仪表板提供了一个交互式界面。\n\n```\ndemo = gr.Interface(  # GRADIO UI\n    fn=cnn_brain_view,\n\
  \    inputs=[gr.Image(type=\"pil\", label=\"Upload Image\"),\n            gr.Slider(0,\
  \ 4, step=1, value=0,\n                      label=\"CNN Layer (0=Early → 4=Deep)\"\
  )],\n    outputs=[gr.Image(label=\"Input\"),\n             gr.Image(label=\"Activation\
  \ Heatmap\"),\n             gr.Image(label=\"Overlay (Model Attention)\")],\n  \
  \  title=\"CNN Brain Viewer (ResNet18)\",\n    description=\"Visualize how CNNs\
  \ transform images from edges → textures →\nsemantic object parts\")\ndemo.launch()\n\
  ```\n\n允许用户选择不同的网络深度并观察表示如何演变。CNN 脑查看器仪表板如下所示：\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_604_0.png)\n\
  \n图 12.3 – CNN 脑查看器 Gradio 应用（使用 ResNet18）\n\n一个典型的观察是：Conv1 专注于边缘和边界，Layer1 捕获局部纹理，Layer2\
  \ 捕获重复结构，Layer3 捕获对象组件，Layer4 专注于语义上有意义的区域。\n\n本节展示了理解图像表示的三种互补方法：\n\n- PCA 揭示方差的主要方向\n\
  - t-SNE 在高维空间中揭示非线性簇结构\n- CNN 激活可视化揭示深度神经网络内部的分层特征提取\n\n together，这些技术提供了关于现代图像分类系统如何将原始像素转换为语义上有意义的特征嵌入的宝贵直觉，为本章其余部分讨论的迁移学习、视觉\
  \ Transformer、自监督学习、图像检索和目标检测技术奠定了基础。\n\n## 图像分类\n\n因此，在 ImageNet 上训练的网络通常只需少量修改即可用于完全不同的分类问题。\n\
  \n**VGG16 架构：** VGG16 由 Simonyan 和 Zisserman 于 2015 年提出，由 13 个卷积层后接 3 个全连接层组成。该网络接受\
  \ RGB 图像 **x** ∈ ℝ²²⁴×²²⁴×³ 并产生 1000 个 ImageNet 类别的后验概率：ŷ = *f*(**x**; θ)，其中 θ 表示学习到的网络参数。原始\
  \ VGG16 架构包含约 138 × 10⁶ 个可训练参数，使其成为最早能够实现 ImageNet 最先进性能的深度卷积网络之一。\n\n**实验数据集：**\
  \ *Cats vs Dogs* 数据集包含两个类别：*Cats* 和 *Dogs*。数据集结构为\n\n```\ndataset/\n├── training_set/\n\
  │   ├── cats/\n│   └── dogs/\n└── test_set/\n    ├── cats/\n    └── dogs/\n```\n\
  \n实验使用 8,000 张训练图像和 2,000 张测试图像。每张图像均调整为 224 × 224 以匹配 VGG16 输入要求。\n\n**数据加载和预处理：**\
  \ ImageDataGenerator 创建高效的输入管道，可自动从磁盘加载图像并应用 VGG16 特定预处理（均值减法和通道归一化）。`flow_from_directory()`\
  \ 函数然后从训练和测试文件夹读取图像，将其调整为 (224, 224)，根据子目录名称（cats 和 dogs）分配二进制标签，并为模型训练和评估生成小批量。\n\
  \n```\ntrain_datagen = ImageDataGenerator(preprocessing_function=preprocess_input)\n\
  train_data = train_datagen.flow_from_directory('dataset/training_set',\n       \
  \     target_size=(IMAGE_SIZE, IMAGE_SIZE), batch_size=BATCH_SIZE,\n           \
  \ class_mode='binary', shuffle=True)\n```\n\n### 方法 1：使用预训练的 VGG16 网络\n\n最简单的策略是按\
  \ ImageNet 训练的方式使用 VGG16。\n\n```\npretrained_vgg16_model = VGG16(weights='imagenet',\
  \ include_top=True)\n```\n\n由于 ImageNet 不包含单一的“dog”或“cat”类别，而是包含许多品种，因此预测的 ImageNet\
  \ 标签必须合并为两个超类。例如，\n\n```\n\"Persian cat\" → cat\n\"Siamese cat\" → cat\n```\n\n\n\
  \n\n```text\n\"Golden retriever\" → dog\n\"Beagle\" → dog\n```\n\n因此，模型预测可以写作：\n\
  \n$\\hat{y}=g(f_{\\mathrm{ImageNet}}(x)),$\n\n其中$g(\\cdot)$表示类别合并操作。主要优点是无需额外训练，展示了ImageNet特征的可迁移性，并且部署非常简单：\n\
  \n```python\npretrained_vgg16_model = VGG16(weights='imagenet', include_top=True)\n\
  ```\n\n主要局限性在于：网络是针对1000个ImageNet类别而非猫狗分类优化的；当预测的品种不在映射中时会产生错误；分类边界也未针对目标数据集进行调整。\n\
  \n## 方法2：使用VGG16进行迁移学习\n\n更有效的策略是复用卷积特征提取器，并训练一个新的分类头。原始VGG16分类器被移除。\n\n```python\n\
  base_model = VGG16(weights='imagenet', include_top=False,\n    input_shape=(224,224,3))\n\
  ```\n\n仅保留卷积主干网络。\n\n**冻结特征提取器：** 预训练参数被冻结。\n\n```python\nfor layer in base_model.layers:\n\
  \    layer.trainable = False\n```\n\n从数学角度看，主干网络变为固定映射$\\mathbf{z}=f_{\\mathrm{VGG16}}(\\\
  mathbf{x})$，其中$\\mathbf{z}\\in\\mathbb{R}^{7\\times7\\times512}$表示高层特征张量。训练期间仅优化新添加的分类层。\n\
  \n**设计新的分类头：** 输出特征张量通过全局平均池化转换为紧凑的特征向量：\n\n$z_k=\\frac{1}{HW}\\sum_{i=1}^{H}\\\
  sum_{j=1}^{W}F_k(i,j),$\n\n其中$F_k$表示第$k$个特征图。该操作大幅减少参数量并缓解过拟合。分类器头为：\n\n```python\n\
  base_model = VGG16(weights='imagenet', include_top=False,\n    input_shape=(224,224,3))\n\
  x = base_model.output\nx = GlobalAveragePooling2D()(x)\nx = Dense(256, activation='relu')(x)\n\
  x = Dropout(0.3)(x)\noutput = Dense(1, activation='sigmoid')(x)\n```\n\n最终预测为：$\\\
  hat{y}=\\sigma(\\mathbf{w}^{T}\\mathbf{z}+b)$，其中$\\sigma(t)=\\frac{1}{1+e^{-t}}$是sigmoid激活函数。\n\
  \n### 二元交叉熵损失\n\n由于任务仅包含两个类别，网络使用二元交叉熵进行训练：\n\n$\\mathcal{L} = -y \\log(\\hat{y})\
  \ - (1 - y)\\log(1 - \\hat{y}),$\n\n其中$y \\in \\{0,1\\}$为真实标签。\n\n优化目标为：\n\n$\\\
  theta^* = \\arg\\min_{\\theta} \\sum_{i=1}^{N} \\mathcal{L}_i$\n\n使用Adam优化器求解：\n\
  \n```python\ntransfer_learning_model.compile(optimizer=Adam(learning_rate=1e-4),\
  \ # compile\nloss='binary_crossentropy', metrics=['accuracy'])\n```\n\n### 模型训练\n\
  \n网络训练五个轮次（epochs）。\n\n```python\ntransfer_learning_model.fit(train_data, validation_data=test_data,\
  \ epochs=5)\n# Epoch 5/5\n# [1m250/250[0m [32m------------------------------[0m[37m[0m\
  \ [1m68s[0m 271ms/step -\n# accuracy: 0.9808 - loss: 0.0537 - val_accuracy: 0.9835\
  \ - val_loss: 0.0585\n```\n\n由于主干网络已经包含从ImageNet学习到的高判别性视觉表示，训练快速收敛。下图展示了观察到的学习曲线。在整个训练过程中，验证损失稳步下降，表明预训练特征成功适应了新任务。\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_608_0.png)\n\n图12.4 – 迁移学习训练与损失\n\n##\
  \ 性能评估\n\n在两个模型上，使用未见过的测试数据集评估分类准确率：\n\n```python\ndef evaluate_pretrained_vgg16():\n\
  \    predictions, targets = [], []\n    for images, labels in test_data:\n     \
  \   outputs = pretrained_vgg16_model.predict(images, verbose=0)\n        decoded\
  \ = decode_predictions(outputs, top=1)[0][0][1]\n        predictions.append(map_imagenet_class(decoded))\n\
  \        targets.append(idx_to_class[int(labels[0])])\n    print(\"Pretrained VGG16\
  \ Accuracy:\", accuracy_score(targets, predictions))\n    return acc\n\npretrained_acc,\
  \ _, _ = evaluate_pretrained_vgg16() # evaluate pretrained model\ntransfer_acc,\
  \ _, _ = evaluate_transfer_vgg16() # evaluate TL model (refer GitHub)\n```\n\n**预训练的VGG16：**\
  \ 该ImageNet模型取得了96.22%的测试准确率，混淆矩阵如下：\n\n[668  47]\n[  1  554]\n\n测试数据集上的分类报告如下：\n\
