  \n下图展示了数据集之外的猫和狗图像，预训练模型和微调VGG16模型均正确分类。\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_610_1.png)\n\
  \n*图12.6 – 使用预训练模型与迁移学习模型预测数据集外图像的标签*\n\n## 实践注意事项\n\n**微调：** 在本实验中，所有卷积层均被冻结。一种常见的改进是部分微调：\n\
  \n```python\nfor layer in base_model.layers[-4:]:\n    layer.trainable = True\n\
  ```\n\n允许最深层适应目标领域。\n\n**数据增强：** 通常可以通过随机翻转、旋转、缩放和亮度扰动进一步提高性能，这些操作增加了训练多样性并减少了过拟合。\n\
  \n**现代替代方案：** 尽管VGG16在教学上仍然重要，但较新的架构通常以更少的参数提供更高的准确率：ResNet、EfficientNet、ConvNeXt、视觉Transformer（ViT）和Swin\
  \ Transformer。本章稍后将探讨其中的许多模型。\n\n这个例子展示了现代计算机视觉的核心思想之一：从大规模数据集中学习到的强大图像表示可以在许多下游任务中复用。预训练的VGG16网络尽管从未针对该目的训练，却已经在猫狗分类上取得了超过96%的准确率。通过将原始ImageNet分类器替换为轻量级任务特定头，并仅重新训练少量参数，迁移学习将准确率提升到98%以上。这种显著的性能提升，加上更短的训练时间和更少的数据需求，解释了为什么迁移学习已成为实际图像分类系统的默认策略。\n\
  \n## 使用VGG16进行迁移学习（PyTorch）\n\n同样的迁移学习工作流也可以在PyTorch中实现，使用来自`torchvision.models`的预训练VGG16网络。卷积主干网络被冻结，最终分类器替换为二分类头，并且仅在新添加的层上使用Cats-vs-Dogs数据集进行训练。PyTorch实现用**ImageFolder**和**DataLoader**取代了Keras的**ImageDataGenerator**，使用`torchvision.models.VGG16`代替`tf.keras.applications.VGG16`，采用**BCEWithLogitsLoss**和**torch.optim.Adam**进行训练，并使用原生PyTorch\
  \ API执行推理和模型保存。其性能与TensorFlow/Keras版本相当，将预训练模型的准确率从约**97.4%**提升到迁移学习后的**98.5%**。完整实现可在配套的GitHub仓库中获取，下图展示了模型对测试图像的分类结果。\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_611_0.png)\n\n虽然*迁移学习*复用了从大规模数据集中学到的知识，*注意力机制*通过使网络能够选择性地关注信息量最大的图像区域来进一步提升分类性能，我们将在下一节探讨这一点。\n\
  \n\n\n\n\n## 使用注意力网络的图像分类\n\n传统的 CNN 对每个特征图和图像区域都同等重要地处理。然而，人类自然会关注场景中最具信息量的部分——例如猫的脸而不是背景的草地。注意力机制试图模仿这种行为，通过自动学习**要强调哪些特征以及在哪里查看**，从而提高分类准确性和可解释性。\n\
  \n### 带通道注意力和空间注意力的 CNN\n\n考虑观察一张鸟的图像。某些特征图可能对羽毛、喙或翅膀做出强烈响应，而其他特征图可能包含很少有用的信息。通道注意力学习哪些特征图很重要，而空间注意力则识别与分类决策最相关的图像区域。\n\
  \n给定特征张量 $F \\in \\mathbb{R}^{H\\times W\\times C}$，通道注意力计算 $F' = M_c(F) \\odot\
  \ F$，而空间注意力进一步将特征细化为 $F'' = M_s(F') \\odot F'$。\n\n**通道注意力：** 直观上，通道注意力就像特征图的音量控制：有用的通道被放大，而信息较少的通道被衰减，如下一段代码所示。直观上，GlobalAveragePooling2D\
  \ 询问“哪些特征在整个图像中持续存在？”，而 GlobalMaxPooling2D 询问“哪些特征在图像中的任何位置出现得最强？”，两者共同为计算通道重要性提供了互补的线索。\n\
  \n```\n```python\nclass ChannelAttention(tf.keras.layers.Layer): # for complete\
  \ code refer to GitHub\n\n    def call(self, inputs):\n        avg_pool = tf.keras.layers.GlobalAveragePooling2D()(inputs)\n\
  \        avg_pool = self.shared_layer_one(avg_pool)\n        avg_pool = self.shared_layer_two(avg_pool)\n\
  \        max_pool = tf.keras.layers.GlobalMaxPooling2D()(inputs)\n        max_pool\
  \ = tf.keras.layers.Reshape((1,1,filters))(max_pool)\n        max_pool = self.shared_layer_one(max_pool)\n\
  \        max_pool = self.shared_layer_two(max_pool)\n        attention = tf.keras.layers.Add()([avg_pool,max_pool])\n\
  \        attention = tf.keras.layers.Activation('sigmoid')(attention)\n        return\
  \ tf.keras.layers.Multiply()([inputs, attention])\n```\n```\n\n**空间注意力：** 空间注意力像聚光灯一样突出重要对象区域并抑制背景杂乱。通道注意力决定*什么*特征图（例如毛皮、眼睛、翅膀）很重要，而空间注意力决定图像中*哪里*这些重要特征位于。\n\
  \n```\n```python\nclass SpatialAttention(tf.keras.layers.Layer):\n    def call(self,\
  \ inputs):\n        avg_pool = tf.keras.layers.Lambda(\n```\n\n```\n```python\n\
  lambda x: tf.keras.backend.mean(\n    x, axis=3, keepdims=True)(inputs)\nmax_pool\
  \ = tf.keras.layers.Lambda(\n    lambda x: tf.keras.backend.max(\n        x, axis=3,\
  \ keepdims=True))(inputs)\nattention = tf.keras.layers.Concatenate(\n    axis=3)([avg_pool,\
  \ max_pool])\nattention = self.conv2d(attention)\nreturn tf.keras.layers.multiply(\n\
  \    [inputs, attention])\n```\n```\n\n> **注意**\n> \n> 通道注意力通常首先应用以强调最具信息量的特征图，提供更强且噪声更少的表示，以便空间注意力随后能更有效地定位重要区域。\n\
  \n**向 CNN 添加注意力：** *注意力*模块在 *卷积* 和 *批归一化* 块之后插入。\n\n```\n```python\nimport tensorflow\
  \ as tf\nprint(tf.__version__)\n# 2.18.0\nsimple_cnn_with_attention = tf.keras.model.Sequential([\n\
  \    tf.keras.layers.Conv2D(32, 3, input_shape=ds_info.features['image'].shape,\n\
  \                           activation='elu', padding='same'),\n    tf.keras.layers.BatchNormalization(),\n\
  \    tf.keras.layers.Conv2D(32, 3, padding='same', activation='elu'),\n    tf.keras.layers.BatchNormalization(),\n\
  \    ChannelAttention(32,8),\n    SpatialAttention(7),\n    ...                \
  \         # for complete code refer GitHub\n])\n```\n```\n\n> **注意**\n> \n> 批归一化\
  \ (**BatchNorm**) 层将中间激活归一化为在 mini-batch 内近似零均值和单位方差，稳定并加速训练，同时提高收敛性。\n\n函数 `tfds.load()`\
  \ 自动下载（如需）、准备并加载 CIFAR-100 数据集作为 TensorFlow 数据管道，同时返回数据集元数据，如类别名称、图像形状和数据集大小。\n\n\
  ```\nimport tensorflow_datasets as tfds\nfrom tf_explain.core.grad_cam import GradCAM\n\
  gpus = tf.config.experimental.list_physical_devices('GPU')\n(ds_train, ds_test),\
  \ ds_info = tfds.load('cifar100', split=['train', 'test'],\n                   \
  \                   shuffle_files=True, as_supervised=True, with_\ninfo=True)\n\
  ```\n\n网络在 CIFAR-100 上训练，并与一个相同的 *基线* CNN 模型 **不带注意力** 进行比较。下图显示了改进的学习行为。\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_614_0.png)\n\
  \n*图 12.8 – 带和不带注意力的 CNN 的训练曲线*\n\n模型首先预测图像类别，然后 **Grad-CAM** 从预测类别向最后的卷积层反向传播梯度，以生成类激活热图，显示哪些图像区域对决策贡献最大。比较\
  \ *基线* 和 *注意力增强* CNN 的热图提供了 **可解释 AI (XAI)** 可视化，有助于解释 *为什么* 会做出预测，以及模型是关注目标对象而不是无关背景区域，如下一段代码所示。\n\
  \n```\ny_pred = model.predict(img[None])  # Prediction\npred_class = np.argmax(y_pred)\n\
  explainer = GradCAM()  # Grad-CAM explanation\nheatmap = explainer.explain([img],\
  \ None), model, class_index=pred_class,\n                              image_weight=0.8)\n\
  plt.imshow(heatmap)  # Visualization\n```\n\n下图表明，注意力使 *Grad-CAM* 激活在目标对象周围更加集中。\n\
  \n## 使用带和不带注意力层的 ConvNets 进行图像分类的 GradCAM 可视化\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_615_0.png)\n\
  \n图 12.9 – 使用 CNN（带和不带注意力层）进行图像分类的 GradCAM 可视化\n\n# 注意\n\ntf.config.experimental\
  \ 命名空间包含在 TensorFlow 急切执行转换期间引入的低级运行时控制，提供高级硬件和内存管理功能，这些功能最初标记为实验性，后来成为稳定 API 的一部分。\n\
  \n## 使用视觉 Transformer (ViT) 进行图像分类\n\nCNN 使用局部感受野分析图像。视觉 Transformer 反而将图像视为一系列小块，类似于句子中的单词。自注意力允许每个块直接与其他每个块交互，从而使模型能够捕捉长程关系。对于\
  \ N 个图像块，\n\nAttention(Q, K, V) = softmax( (Q K^T) / sqrt(d) ) V\n\n在这些示例中，我们将使用\
  \ transformers 库（由 Hugging Face 开发），该库提供了轻松访问用于视觉、语言和多模态任务的最先进预训练 Transformer 模型。它让我们只需几行代码即可下载、预处理并使用预训练的\
  \ Transformer-based 视觉模型进行推理，而无需从头实现架构。预训练的 ViT 模型可以加载为：\n\n```\nfrom transformers\
  \ import ViTImageProcessor, ViTForImageClassification\nprocessor = ViTImageProcessor.from_pretrained(\"\
  google/vit-base-patch16-224\")\nmodel = ViTForImageClassification.from_pretrained(\"\
  google/vit-base-patch16-224\", output_attentions=True)\n```\n\n使用预训练的 ViT 模型进行推理模式（`model.eval()`），输入图像被转换为块并处理，以获得类别预测（分类分数：logits）和自注意力图（attentions），随后可以可视化以揭示对模型决策影响最大的图像区域。\n\
  \n```\n```python\nmodel.eval()\ninputs = processor(images=image, return_tensors=\"\
  pt\")  # Forward pass\nwith torch.no_grad():\n    outputs = model(**inputs, output_attentions=True)\n\
  logits = outputs.logits\nattentions = outputs.attentions\n```\n```\n\nAttention\
  \ rollout（参考 GitHub 中的函数 `rollout_attention()`）结合多个 Transformer 层的注意力图，以可视化哪些图像块对最终预测贡献最强。下图显示了叠加在输入图像上的典型注意力热图。\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_616_0.png)\n\n*图 12.10 – 可解释 AI – ViT\
  \ 图像分类的注意力热图*\n\n## 使用 ViT 进行花卉分类\n\n微调预训练的 ViT（在牛津 102 花卉数据集上微调）可实现高度准确的花卉物种识别。与仅返回标签的传统分类器不同，Transformer\
  \ 注意力图揭示了哪些花瓣、纹理和花卉结构影响了预测。\n\n```\n```python\nmodel = AutoModelForImageClassification.from_pretrained(\n\
  \    \"MaulikkMadhavi/vit-base-flowers102\", output_attentions=True)\n```\n```\n\
  \n上传的花卉图像使用预训练的 ViT 进行分类，显示前 5 个预测结果，以及注意力 rollout 热图，该热图突出显示对预测最负责任的图像区域，如以下代码片段所示：\n\
  \n```\n```python\nwith torch.no_grad():\n    outputs = model(**inputs, output_attentions=True)\
  \  # ViT inference\ntop5 = torch.topk(torch.nn.functional.softmax(outputs.logits,\
  \ dim=-1)[0], k=5)\nmask = rollout_attention(outputs.attentions)  # Attention Heatmap\n\
  ```\n```\n\n\n\n\n\n这些结果通过一个交互式 Gradio Web 应用呈现，用于实时模型探索和可视化，如下图所示。\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_617_0.png)\n\
  \n图 12.11 – 使用 ViT + Attention 的花卉分类 Gradio 应用\n\n## 使用 Swin Transformer 的图像分类\n\
  \n标准 Vision Transformer 的局限性在于，全局注意力对于大图像来说计算成本很高。Swin Transformer 通过将注意力限制在局部窗口中，同时逐步在相邻窗口之间交换信息来解决这个问题。可以将\
  \ Swin Transformer 视为将 CNN 的局部性与 Transformer 注意力的灵活性相结合。与全局注意力复杂度不同，Swin Transformer\
  \ 通过分层窗口式注意力实现了近似线性复杂度。\n\n以下代码片段使用预训练的 Swin Transformer 首先对一只鹦鹉图像进行分类，然后预测最可能的物体类别。为了解释预测结果，将预测类别分数的梯度反向传播到输入图像，生成突出对决策影响最大的像素的显著性图；然后将生成的热力图叠加到原始图像上进行可视化，如下代码片段所示：\n\
  \n```\nmodel = SwinForImageClassification.from_pretrained(\n    \"microsoft/swin-base-patch4-window7-224\"\
  )\noutputs = model(**inputs)    # Forward pass\n```\n\n```\npred_class = outputs.logits.argmax()\
  \  \nscore = outputs.logits[0, pred_class]  # Saliency map  \nscore.backward() \
  \ \nsaliency = (inputs[\"pixel_values\"].grad.abs().mean(dim=1)[0])  \noverlay =\
  \ cv2.addWeighted(image, 0.6, heatmap, 0.4, 0)  # Overlay heatmap on image\n```\n\
  \n这种方法使用 **基于梯度的显著性** 来揭示哪些图像区域最强烈地影响了 Swin Transformer 的分类决策，使其成为 **可解释 AI (XAI)**\
  \ 的一个例子，而不同于 ViT attention-rollout 可视化。下图显示了生成的显著性图和注意力叠加。\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_618_0.png)\n\
  \n*图 12.12 – 使用 Swin Transformer 的显著性图*\n\n注意力机制使深度网络能够像人类视觉感知一样选择性地分配计算资源。CNN 注意力模块改善了特征选择，而\
  \ Vision Transformers 和 Swin Transformers 采用自注意力来建模长距离图像关系并生成高度可解释的分类决策。\n\n## 少样本学习\n\
  \n传统的监督图像分类每个类别需要数百或数千个标记示例。相比之下，**少样本学习 (FSL)** 旨在仅从少量标记示例中学习新类别。形式上，在 *N*-way\
  \ *K*-shot 任务中，模型必须使用每个类别仅 *K* 个标记示例对 *N* 个类别进行分类。FSL 在注释数据稀缺的领域尤其重要，例如医学成像、遥感和工业检测。\n\
  \n直观上，少样本学习类似于人类学习：在看到新鸟种的几个例子后，人通常可以识别未来图像中的相似鸟类。现代 FSL 系统通过学习可迁移的视觉表示而不是记忆类别标签来实现这一能力。\n\
  \n## 使用 CLIP 的零样本学习\n\nCLIP 模型使用对比学习在数亿对图像-文本对上联合学习图像和文本表示。在推理期间，可以通过将图像与描述候选类别的文本提示进行比较来执行分类，*无需任何任务特定训练*（这就是\
  \ CLIP 是零样本模型的原因）。\n\n下一个代码使用预训练的 CLIP 模型通过将输入图像与多个文本描述进行比较并选择文本嵌入与图像嵌入最相似的类别来执行零样本图像分类，同时可视化影响预测的区域。CLIPModel\
  \ 加载预训练的 CLIP 神经网络，而 CLIPProcessor 自动对文本提示进行分词并将输入图像预处理为模型所需格式。\n\n```\n```python\n\
  # Load pretrained CLIP\nfrom transformers import CLIPProcessor, CLIPModel\nmodel\
  \ = CLIPModel.from_pretrained(\"openai/clip-vit-base-patch32\")\nclasses = [\"a\
  \ photo of a dog\", \"a photo of a horse\", \"a photo of a parrot\"]\noutputs =\
  \ model(**inputs)\nlogits = outputs.logits_per_image # Image-text similarities\n\
  probs = logits.softmax(dim=1)\n```\n```\n\nCLIP 不是从固定的分类器头进行预测，而是计算图像和文本嵌入之间的相似度。文本描述与图像嵌入最相似的类别被选为预测结果。为了可视化模型的推理，可以将\
  \ Grad-CAM 应用于视觉编码器：\n\n```\n```python\nlogits[0, class_idx].backward() # Grad-CAM\n\
  cam = (acts * weights.unsqueeze(1)).sum(dim=2)\n```\n```\n\n生成的热力图突出显示对所选文本提示贡献最大的图像区域，为零样本预测提供了可解释的解释。下图显示了生成的图像-文本相似度分数和分类概率。\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_619_0.png)\n\n*图 12.13 – 使用 CLIP 的零样本图像分类*\n\
  \n## 使用 DINOv2 的少样本学习\n\nDINOv2 是一个无类别标签训练的自监督 Vision Transformer。与学习显式类别不同，DINOv2\
  \ 学习强大的视觉嵌入，可用于下游任务。可以使用类别原型构建一个简单的少样本分类器：在此示例中，分类头被移除，网络纯粹用作特征提取器，将每个图像映射到高维嵌入向量。\n\
  \n```\n```python\nmodel = timm.create_model('vit_base_patch14_dinov2.lvd142m', pretrained=True)\n\
  model.reset_classifier(0)  # use embeddings\n```\n```\n\n```\nThe embedding function\
  \ computes a feature vector f(x) for each image.\nwith torch.no_grad():\n    emb\
  \ = model(x)\n```\n\n**基于原型的少样本分类：** 提供一个仅包含每个类别几个示例的小支持集。\n\n```\nsupport_set =\
  \ {\"dog\": [\"dog1.png\", \"dog2.png\"],\n               \"cat\": [\"cat1.png\"\
  , \"cat2.png\"]}\n```\n\n对于每个类别，嵌入被平均以形成 **原型**（类别代表）：\n\n$$p_c = \\frac{1}{N_c}\\\
  sum_{i=1}^{N_c} f(x_i)$$\n\n```\nembs = [get_embedding(p) for p in paths]\nprototypes[cls]\
  \ = torch.stack(embs).mean(0)  # prototype construction\n```\n\n直观上，原型充当嵌入空间中类别的“中心”。\n\
  \n**基于相似度的预测：** 查询图像被嵌入并使用 **余弦相似度** 与所有类别原型进行比较：\n\n$$\\operatorname{sim}(q,p_c)=\\\
  frac{q^T p_c}{\\lVert q\\rVert\\lVert p_c\\rVert}$$\n\n按以下代码实现。\n\n```\nquery_emb\
  \ = get_embedding(\"lab.png\")\nsim = F.cosine_similarity(query_emb, proto, dim=0)\n\
  ```\n\n预测类别只是相似度最高的原型：\n\n$$\\hat{c}=\\arg\\max_c \\operatorname{sim}(q,p_c)$$\n\
  \n与传统的监督嵌入不同，DINOv2 通过在未标记图像的多个增强视图上进行 *自监督* **教师-学生** 训练学习通用视觉表示，其中学生学习匹配教师的 **基于原型的语义表示**，鼓励具有相似底层视觉内容的图像占据特征空间的相近区域，同时对外观变化保持不变。\n\
  \n因此，拉布拉多图像产生的嵌入比 **猫原型** 更接近 **狗原型**，即使只有几个支持示例可用。从本质上讲，少样本学习成为嵌入空间中的 **最近原型搜索**，利用大规模自监督预训练期间学习到的强大视觉知识。\n\
  \n仅使用每个类别两个支持图像来构建类别原型。查询图像使用 DINOv2 进行嵌入，并分配给余弦相似度最高的原型的类别。下图显示了代表性的支持图像以及检索到的预测。\n\
  \n\n\n\n\n# DINOv2 少样本分类\n预测：狗 (0.18)\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_621_0.png)\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_621_1.png)\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_621_2.png)\n\
  \n图 12.14 – 使用 DINOv2 的少样本图像分类\n\n与 CLIP 不同，DINOv2 不需要文本提示，完全依赖于学习到的嵌入空间中的视觉相似性。\n\
  \n# 使用深度人脸嵌入的少样本人脸识别（孪生网络）\n\n人脸识别可以表述为一个度量学习问题，其中图像被映射到嵌入空间，使得同一个人的人脸彼此靠近，而不同身份的人脸则相距较远。与传统分类不同，新的身份只需通过存储其嵌入即可添加，无需重新训练模型，如此处示例所示（完整代码请参阅\
  \ GitHub）。\n\n# 注释\n\n人脸识别是孪生网络学习最成功的应用之一。经典的孪生网络（如 FaceNet）通过使用对比损失或三元组损失联合训练两个相同的编码器来学习保持相似性的嵌入空间。相比之下，此处的示例使用的是未以孪生方式训练的预训练\
  \ ResNet18 编码器；然而，识别仍然是通过使用相似性度量比较嵌入来执行的，遵循了基于孪生网络的人脸识别所依据的相同基本原理。\n\nFaceEncoder\
  \ 使用预训练的 ResNet18 主干（而不是经典的孪生训练网络）来提取面部特征并将其转换为归一化的 128 维嵌入，而 forward() 方法则为基于相似性的人脸识别生成这些嵌入。\n\
  \n```\n# Siamese Encoder (ResNet backbone)\nclass FaceEncoder(nn.Module):\n    def\
  \ __init__(self, embedding_dim=128):\n```\n```\n```python\nsuper().__init__()\n\
  backbone = models.resnet18(weights=models.ResNet18_Weights.DEFAULT)\nbackbone.fc\
  \ = nn.Identity()  # remove classification head\nself.backbone = backbone\nself.projector\
  \ = nn.Sequential(\n    nn.Linear(512, 256),\n    nn.ReLU(inplace=True),\n    nn.Linear(256,\
  \ embedding_dim)\n)\n\ndef forward(self, x):\n    feat = self.backbone(x)      \
  \    # [B, 512]\n    emb = self.projector(feat)       # [B, D]\n    emb = F.normalize(emb,\
  \ dim=1)    # L2-normalize\n    return emb\n\nmodel = FaceEncoder(embedding_dim=128).to(device)\
  \  # Build model\nmodel.eval()                                      # inference\
  \ mode\n```\n```\n\n**人脸嵌入提取：** 预训练的 *ResNet18* 主干（`models.resnet18`）通过使用 `nn.Identity()`\
  \ 移除其最终分类层而转换为特征提取器。每张人脸由一个归一化的 128 维嵌入向量表示，该向量作为个人外观的紧凑数值签名。\n\n**画廊构建：** 每个人物的多张图像被转换为嵌入并取平均值以形成原型表示：\n\
  \n$$p_c = \\frac{1}{N_c}\\sum_{i=1}^{N_c} e_i$$\n\n其中 $e_i$ 表示人脸嵌入，$p_c$ 是身份 $c$\
  \ 的原型，其使用以下代码行实现：\n\n```\n```python\ngallery[person] = torch.stack(embs).mean(0)\
  \ # average embedding (prototype)\n```\n```\n\n在函数 `build_gallery_embeddings()`\
  \ 中，该函数按人创建嵌入。\n\n**人脸匹配：** 查询人脸被嵌入并与所有画廊原型使用余弦相似度进行比较：\n\n$$\\operatorname{sim}(q,p)\
  \ = \\frac{q^T p}{\\lVert q\\rVert\\cdot\\lVert p\\rVert}$$\n\n实现如下：\n\n```\n```python\n\
  q_emb = model(q).squeeze(0) # q is the query face\n# Compute similarities\n```\n\
  ```\n\n```\nresults = []\nfor person, g_emb in gallery.items():\n    sim = F.cosine_similarity(q_emb,\
  \ g_emb, dim=0).item() # similarity with a face g\n    results.append((person, sim))\n\
  ```\n\n选择相似度分数最高的人物身份；低于阈值的分数被标记为未知。\n\n```\nresults = sorted(results, key=lambda\
  \ x: x[1], reverse=True)\ntop_results = results[:top_k]\nbest_person, best_score\
  \ = top_results[0]\nif best_score < threshold: final_label = \"Unknown\"\n```\n\n\
  这本质上是少样本人脸识别，因为每个身份只需要很少的画廊图像。\n\n可视化：系统显示查询图像以及最相似的画廊人脸及其相似度分数，提供识别结果的直观解释，如下所示：\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_623_0.png)\n\n图 12.15 – 使用深度人脸嵌入的人脸识别\n\
  \n# 通过孪生微调提高识别效果\n\n当前实现依赖于预训练 ResNet18 提取的通用 ImageNet 特征。识别性能通常可以通过使用对比损失、三元组损失或现代人脸识别目标（如\
  \ ArcFace）对编码器进行微调来提高。例如，对比损失为：\n\nL = y D² + (1 − y) max(0, m − D)²\n\n其中 D 表示嵌入距离，m\
  \ 为边界。这种度量学习方法将匹配的人脸拉得更近，同时将不同身份推得更远，从而产生更具判别性的嵌入。\n\n# 使用 FaceNet 进行人脸识别\n\n在实践中，专门的人脸识别模型如\
  \ FaceNet 比通用图像分类器更受青睐。FaceNet 直接在人脸图像上使用三元组损失进行训练，并学习一个高度判别性的嵌入空间，其中欧几里得或余弦距离对应于面部相似性。\n\
  \n```\nfrom facenet_pytorch import InceptionResnetV1\nmodel = InceptionResnetV1(pretrained='vggface2').eval()\
  \  # Pretrained FaceNet\nembedding = model(face_tensor)\n```\n\n函数 get_embedding()\
  \ 对人脸图像进行预处理，将其通过预训练的人脸编码器在推理模式下（torch.no_grad()）传递，并返回表示该人脸的归一化嵌入向量。然后将画廊嵌入与查询嵌入使用余弦相似度进行比较，选择相似度分数最高的人物身份作为预测匹配。\n\
  \n```\ndef get_embedding(path):\n    img = transform(Image.open(path).convert(\"\
  RGB\")).unsqueeze(0)\n    with torch.no_grad():\n        emb = model(img)\n    return\
  \ F.normalize(emb, dim=1)\n\ngallery = {  # face images\n    \"Dad\": get_embedding(\"\
  images/dad.jpg\"),\n    \"Me\": get_embedding(\"images/me.jpg\"),\n    \"Mom\":\
  \ get_embedding(\"images/mom.jpg\")}\nquery = get_embedding(\"images/query.png\"\
  )\n\nscores = { name: F.cosine_similarity(query, emb).item()\n           for name,\
  \ emb in gallery.items()}\nprediction = max(scores, key=scores.get)\n```\n\n与少样本\
  \ ResNet18 示例不同，FaceNet 已针对人脸识别进行了优化，因此通常在无需额外训练的情况下就能实现显著更高的准确率，同时产生更具判别性的相似度分数，匹配和不匹配人脸之间的分离更好，如下图所示。\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_624_0.png)\n\n图 12.16 – 使用 FaceNet 的人脸识别\n\
  \n总之，识别流程将人脸转换为嵌入，使用余弦相似度进行比较，并分配最近原型的身份。使用孪生风格的度量学习进行微调或使用预训练的人脸识别模型如 FaceNet 可以进一步提高识别性能。\n\
  \n# 用于图像分类的贝叶斯神经网络\n\n传统的神经网络为每个权重学习单一确定值。相比之下，贝叶斯神经网络（BNN）将每个权重建模为概率分布，使网络不仅能估计预测，还能估计其不确定性。这在医疗成像、自动驾驶和遥感等安全关键应用中尤为重要，在这些应用中，了解预测的\
  \ *置信度* 可能与预测本身一样重要。直观地说，贝叶斯网络不是问“最佳权重是什么？”，而是问“在给定数据的情况下，哪些权重范围是合理的？”\n\n**贝叶斯神经网络：**\
  \ 在确定性网络中，权重是固定的：$W = w$ 而在贝叶斯网络中，每个权重由分布表示：\n\n$$W \\sim \\mathcal{N}(\\mu, \\\
  sigma^2)$$\n\n其中 $\\mu$ 和 $\\sigma$ 在训练期间学习。预测分布通过对所有可能权重进行边缘化获得：\n\n$$p(y|x, D)\
  \ = \\int p(y|x, W),\\,p(W|D),\\,dW$$\n\n其中 $D$ 表示训练数据。由于该积分对于深度网络是不可处理的，因此通常使用\
  \ **变分推断**、**蒙特卡洛采样** 和 **MC Dropout** 等近似方法。\n\n**贝叶斯线性层：** 关键思想是用 *高斯分布权重* 替换\
  \ *确定性权重*。\n\n```\n```python\nclass BayesianLinear(nn.Module):\n    def forward(self,\
  \ x):\n        weight_std = torch.exp(0.5 * self.weight_logvar)\n        weight\
  \ = self.weight_mu + weight_std * torch.randn_like(weight_std)\n        return F.linear(x,\
  \ weight, bias)\n```\n```\n\n在每次 *前向* 传递中，都会从学习到的分布中抽取一个 *新权重* 样本。因此，对同一张图像的两次评估可能会产生略有不同的预测。网络不是致力于单一模型，而是有效地评估许多合理模型并组合它们的预测。\n\
  \n**变分学习和 KL 正则化：** 训练同时优化分类准确性和不确定性估计。损失结合了交叉熵和 KL 散度惩罚：\n\n$$L = L_{CE} + \\beta\
  \ D_{KL}(q(W)\\|p(W)),$$\n\n其中 $L_{CE}$：分类损失，$q(W)$：学习到的后验，$p(W)$：先验分布，$D_{KL}$：复杂度惩罚。在实现中：\n\
  \n```\n```python\nce = F.cross_entropy(out_bnn, y_batch)\nkl = bnn.kl_loss() / len(train_dataset)\n\
  loss_bnn = ce + 0.01 * beta * kl\n```\n```\n\n\n\n\n\nKL 项可防止权重分布变得过度复杂，并充当贝叶斯正则化器。\n\
  \n**蒙特卡洛预测：** 单次前向传播提供一个采样的模型。多次前向传播近似预测分布。\n\n```\ndef forward_mc(model, x, samples=3):\n\
  \    outputs = []\n    for _ in range(samples):\n        outputs.append(model(x))\n\
  \    return torch.stack(outputs).mean(0)\n```\n\n从数学上讲，\n\n$$p(y|x) \\approx \\\
  frac{1}{N} \\sum_{i=1}^{N} p(y|x,W_i)$$\n\n其中 $W_i$ 是采样的权重实现。让多个略有不同的网络对预测进行投票通常会产生更可靠的估计。\n\
  \n**比较贝叶斯和确定性网络：** 实验训练了两者。\n\n```\nbnn = BayesianNN()\ndnn = DeterministicNN()\n\
  ```\n\n在来自 sklearn.datasets 的手写数字数据集上：\n\n```\ndata = load_digits()\n```\n\n使用两个全连接层。\n\
  \n贝叶斯网络通常训练更慢，并且可能实现略低的准确率，因为它学习的是整个权重分布而不是单一的最优解。示例输出：\n\n```\nDeterministic NN\
  \ Accuracy: 0.9694\nBayesian NN Accuracy:      0.8833\n```\n\n这种准确率的降低通常会被改进的不确定性估计所抵消。\n\
  \n**不确定性估计：** 贝叶斯网络最重要的优势在于它量化预测置信度。\n\n```\nmean_probs, uncertainty = predict_mc(bnn,\
  \ X_test[:5])\n```\n\n其中 mean_probs = 平均预测，uncertainty = 预测标准差。\n\n```\npred = mean_probs[i].argmax().item()\n\
  unc = uncertainty[i].mean().item()\n```\n\n下图显示了少数测试图像的预测数字和不确定性值 σ。更高的不确定性表示采样网络之间存在分歧，因此对预测的置信度较低。如果不同的采样模型对一个数字意见不一致，网络会认识到自己不确定，而不是做出过度自信的预测。\n\
  \n贝叶斯神经网络（不确定性）\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_627_0.png)\n\n图 12.17\
  \ - 使用贝叶斯神经网络对图像进行分类对 MNIST 数字进行分类\n\n尽管完整的贝叶斯神经网络通过学习权重上的分布来提供原则性的不确定性估计，但其计算成本促使人们采用蒙特卡洛\
  \ Dropout 等高效近似方法，我们接下来将探讨它。\n\n## MC dropout：一种实用的贝叶斯近似\n\n真正的贝叶斯神经网络可能计算成本高昂。一种优雅的近似方法是蒙特卡洛\
  \ Dropout，由 Yarin Gal 和同事提出。关键思想是在推理期间保持 dropout 激活：\n\n```\nclass MCDropoutNN(nn.Module):\n\
  \n    def __init__(self):\n        ...\n        self.dropout = nn.Dropout(0.3)\n\
  \n    def forward(self, x):\n        x = self.dropout(x)\n        return self.fc2(x)\n\
  ```\n\n并执行多次随机前向传播：\n\n```\nmodel.train()    # keep dropout active\nfor _ in range(20):\n\
  \    logits = model(x)\n```\n\n每次传播有效地采样了不同的网络。\n\n**蒙特卡洛 Dropout 预测：** 函数 mc_dropout_predict()\
  \ 使用 dropout 启用进行多次随机前向传播（完整代码请参阅 GitHub），然后返回平均类别概率（mean_probs）作为预测，并将变异性（uncertainty）作为模型置信度的度量。\n\
  \n```\nmean_probs, uncertainty = mc_dropout_predict(mc_model, X_test)\n```\n\n预测均值为\
  \ $\\bar{p} = \\frac{1}{N} \\sum_{i=1}^{N} p_i$，不确定性从样本方差估计：\n\n$\\sigma^2 = \\\
  frac{1}{N} \\sum_{i=1}^{N} (p_i - \\bar{p})^2$\n\n这可以在不显式学习权重分布的情况下产生不确定性估计。\n\n\
  **结果：** 示例输出：\n\n```\nDeterministic NN Accuracy: 0.9722\nMC Dropout Accuracy:  \
  \     0.9750\n```\n\n下一个可视化显示每个测试图像的预测数字和不确定性值 $\\sigma$，这次使用 MC dropout。\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_628_0.png)\n\
  \n与 *完整的贝叶斯网络* 不同，*MC Dropout* 通常能达到与确定性模型相当的准确率，同时仍提供有用的不确定性估计，如下表所示。\n\n| 方法 |\
  \ 学习权重分布 | 不确定性估计 | 计算成本 |\n|---|---|---|---|\n| Deterministic NN | No | No | Low\
  \ |\n| Bayesian NN | Yes | Excellent | High |\n| MC Dropout | Approximate | Good\
  \ | Moderate |\n\n*表 12.5: Deterministic vs. Bayesian Network for image classification*\n\
  \n*贝叶斯神经网络* 通过学习 *权重上的概率分布* 提供了对不确定性的最原则性处理，而 *MC Dropout* 则通过 *随机 dropout 采样* 近似\
  \ *贝叶斯推理*。尽管确定性网络通常能实现略高的分类准确率，但 *贝叶斯* 方法提供了宝贵的 *置信度估计*，可以揭示模糊、噪声或超出分布的输入。\n\n总之，贝叶斯神经网络将图像分类从预测单一答案转变为预测一系列合理答案的分布，从而实现不确定性感知的决策制定。MC\
  \ Dropout 提供了一种实用的近似方法，在仅对标准神经网络进行少量修改的情况下保留了许多贝叶斯优势。\n\n## 使用半监督学习进行图像分类\n\n在许多现实世界应用中，获取大量标记图像既昂贵又耗时，而未标记图像却十分丰富。**半监督学习（SSL）**\
  \ 通过利用少量标记数据集和大量未标记数据集来解决这一挑战。其核心思想是未标记样本包含有关底层数据分布的有价值信息，可以提高分类性能。\n\n直观地说，SSL\
  \ 模仿人类学习：学生可能从少数带注释的示例中学习，然后根据相似性和一致性为许多额外示例推断标签。\n\n**FixMatch – 从未标记图像中学习：** FixMatch\
  \ 是一种 *半监督学习* 方法，通过反复使用当前网络从弱增强的未标记图像生成伪标签来迭代改进模型，但仅在预测高度自信时才使用。这些伪标签随后用于在同一图像的强增强版本上训练模型，强制在扰动下保持一致。直观地说，它是一个自我强化的循环，其中模型先从“可靠的猜测”中学习，然后在标准端到端训练过程中逐步完善其预测和对未标记数据的使用。\n\
  \n下一个 python 演示实现了 FixMatch 的简化版本，这是最具影响力的 SSL 算法之一（完整代码请参阅 GitHub）。模型首先在少量标记子集上训练，然后为\
  \ *未标记* 图像生成 **伪标签**。只有 10% 的训练样本被视为标记：\n\n```\nnum_labeled = int(0.1 * len(X_train))\n\
  X_l = torch.tensor(X_train[:num_labeled])\ny_l = torch.tensor(y_train[:num_labeled])\n\
  X_u = torch.tensor(X_train[num_labeled:])\n```\n\n这里 **标记集：** $(X_l, y_l)$ 和 **未标记集：**\
  \ $X_u$。\n\n**分类网络：** 使用一个简单的全连接神经网络：\n\n```\nclass Net(nn.Module):\n    def __init__(self):\n\
  \        super().__init__()\n        self.fc1 = nn.Linear(64,128)\n        self.fc2\
  \ = nn.Linear(128,10)\n\n    def forward(self,x):\n        return self.fc2(F.relu(self.fc1(x)))\n\
  ```\n\n网络将 64 维数字向量映射到 10 个数字类别之一。\n\n**监督学习基线：** 基线模型仅使用标记子集进行训练。\n\n```\nlogits\
  \ = model_sup(X_l)\nloss = F.cross_entropy(logits, y_l)\n```\n\n这最小化标准 *分类损失* $L_{sup}\
  \ = -\\sum_i y_i \\log p_i$，其中 $p_i$ 表示 **预测类别概率**。\n\n**伪标记：** SSL 模型首先为未标记样本预测标签。它预测一个\
  \ *概率分布* 并将 *伪标签* 分配给最自信的类别：\n\n$\\hat{y} = \\arg\\max_k p(k|x_u)$\n\n```\nweak_logits\
  \ = model_ssl(X_u)\nprobs = F.softmax(weak_logits, dim=1)\nmax_probs, pseudo_labels\
  \ = probs.max(dim=1)\n```\n\n仅保留高置信度预测（$p_{max} \\geq \\tau$）。\n\n```\nmask = max_probs\
  \ >= 0.7\n```\n\n直观地说，模型说：“我足够确信此图像属于类别 K，因此我将暂时将其视为标记示例。”\n\n**一致性正则化：** 这些 *伪标签*\
  \ 被视为同一图像的强增强版本的临时目标。*更强的增强* 是通过添加 *噪声* 创建的。*FixMatch* 假设 *小的扰动* 不应改变预测类别。\n\n```\n\
  noise = torch.randn_like(X_u) * 0.05\nstrong_logits = model_ssl(X_u + noise)\nloss_unsup\
  \ = F.cross_entropy(strong_logits[mask], pseudo_labels[mask])\n```\n\n然后鼓励模型对两个版本产生相同的预测。**无监督一致性损失**\
  \ 为：\n\n$L_u = CE(f(x_u^{strong}), \\hat{y})$\n\n其中 $\\hat{y}$ = 来自弱增强图像的 *伪标签*，$x_u^{strong}$\
  \ = 强增强图像，$CE(\\cdot)$ = 交叉熵。直观地说，如果图像被分类为“7”，则在小扰动后预测仍应为“7”。\n\n**组合目标：** 最终的 SSL\
  \ 目标结合 *监督* 和 *无监督损失*：\n\n```\nloss = loss_sup + lambda_u * loss_unsup\n```\n\n\
  在数学上，$L = L_{sup} + \\lambda_u L_{unsup}$，其中 $\\lambda_u$ 控制未标记数据的贡献。直观地说，模型充当自己的教师：对未标记样本的自信预测成为伪标签，并且网络被训练在扰动后仍产生相同的预测，从而使其能够从大量未标记数据中学习。\n\
  \n**性能评估：** 分类准确率在测试集上计算。\n\n```\npreds = model(X).argmax(dim=1)\nacc = (preds ==\
  \ y).float().mean()\n```\n\n演示获得的典型结果为：\n\n\n\n| 方法 | 精度 |\n|---|---|\n| 有监督（10%\
  \ 标签） | 89.4% |\n| 半监督（10% + 未标记） | 92.8% |\n\n*表 12.6：有监督与半监督分类精度*\n\n尽管使用完全相同的标记样本数量，SSL\
  \ 通过利用未标记数据实现了更高的精度。\n\n**可视化：** 代码生成了以下几幅可视化结果：\n\n## 预测网格\n\n```\npreds_sup =\
  \ model_sup(X_test_t[:10]).argmax(1)\npreds_ssl = model_ssl(X_test_t[:10]).argmax(1)\n\
  ```\n\n第一行显示有监督模型的预测结果，而第二行显示 SSL 模型的预测结果。绿色标签表示正确分类，红色标签表示错误。\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_631_0.png)\n\
  \n*图 12.19 – 数字图像的半监督分类*\n\n## 精度比较\n\n```\nplt.bar(labels, accuracies)\n```\n\n\
  下面的条形图比较了有监督学习和半监督学习的性能，清楚地说明了利用未标记数据的益处。\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_631_1.png)\n\
  \n*图 12.20 – 使用数字图像的有监督与半监督分类精度*\n\n传统的有监督学习仅从标记图像中学习：少量标签 → 分类器。半监督学习 additionally\
  \ 从未标记图像的结构中学习：\n\n少量标签 + 大量未标记图像 → 更好的分类器。\n\n未标记数据充当一种指导，帮助网络发现更准确的决策边界。随着模型改进，其伪标签变得更可靠，使其能够逐步从更大比例的未标记数据集中学习。这种利用大量未标记数据的能力使得半监督学习对现代图像分类应用特别有吸引力。\n\
  \n## Masked Autoencoders（MAE）：通过重建缺失图像块进行自监督学习\n\nMasked Autoencoders（MAE）是一种强大的自监督学习框架，可在无需图像标签的情况下学习视觉表征。模型不是预测类别标签，而是通过从图像的可见部分重建缺失的图像区域来学习。\n\
  \n核心思想非常简单：\n\n- 将图像分割成块\n- 随机遮蔽大部分块（通常为 75%）\n- 仅将可见块输入 Vision Transformer（ViT）编码器\n\
  - 训练一个轻量级解码器来重建缺失的块\n\n通过解决此重建任务，网络学习到丰富的语义表征，后续可迁移到图像分类、目标检测、分割和其他视觉任务。MAE 的学习方式类似于解决拼图游戏。即使大部分碎片缺失，模型也能从周围上下文推断出缺失内容。\n\
  \n> 注意\n> \n> 自监督学习（SSL）通过从数据本身自动生成监督信号，而不是使用人工提供的标签，从未标记数据中学习有用的特征表征。Masked Autoencoders（MAE）是一种\
  \ SSL 方法，因为它们随机遮蔽大部分图像块，并训练 Vision Transformer 从可见块重建缺失块，使用原始图像作为自身的监督信号。\n\nMAE\
  \ 架构：Masked Autoencoder 由以下部分组成：\n\n- Patch Embedding Layer\n- Vision Transformer\
  \ Encoder\n- Masking Module\n- Lightweight Decoder\n- Reconstruction Loss\n\n模型通过最小化原始图像块与重建图像块之间的重建误差进行预训练。重建目标为：\n\
  \n$$L = \\frac{1}{N}\\sum_{i=1}^{N}|x_i - \\hat{x}_i|^2$$\n\n其中 $x_i$ = 原始块，$\\\
  hat{x}_i$ = 重建块，$N$ = 被遮蔽块的数量。与有监督学习不同，不需要类别标签。\n\n**加载预训练 MAE：** 以下代码从 Hugging\
  \ Face 加载预训练的 MAE 模型：\n\n```\nprocessor = AutoImageProcessor.from_pretrained(\"\
  facebook/vit-mae-base\")\nmodel = ViTMAEForPreTraining.from_pretrained(\"facebook/vit-mae-base\"\
  )\n```\n\n该模型已使用 MAE 重建目标在数百万张图像上进行了预训练。\n\n**数据集准备：** 为演示目的，将 CIFAR-10 图像调整为 ViT\
  \ 输入尺寸。\n\n```\ndataset = CIFAR10(root=\"./data\", train=False, download=True,\n\
  \                 transform=transforms.Resize((224,224)))\nimg, label = dataset[0]\n\
  ```\n\n该图像用作重建和特征提取实验的输入。\n\n**重建缺失块：** 预处理后，图像通过预训练的 MAE。\n\n```\ninputs = processor(images=img,\
  \ return_tensors=\"pt\")\nwith torch.no_grad():\n    outputs = model(**inputs)\n\
  ```\n\n模型返回：\n\n```\nloss, reconstruction = outputs.loss, outputs.logits\n```\n\n\
  其中 loss = 重建误差，logits = 重建图像块。重建损失表示模型恢复缺失信息的准确程度。\n\n```\nprint(loss.item())\n\
  ```\n\n较低的重建损失意味着模型已学习到有意义的视觉结构和上下文。\n\n**可视化 MAE 重建：** 重建的块被重新排列到原始图像布局中。\n\n```\n\
  reconstruction = reconstruction.squeeze()\nreconstruction = reconstruction.reshape(num_patches,\
  \ num_patches, \\\n                                        patch_size, patch_size,\
  \ 3)\n```\n\n resulting 可视化比较了原始图像和重建图像。\n\n```\nax[0].imshow(img_np); ax[1].imshow(reconstruction)\n\
  ```\n\n尽管预训练期间隐藏了图像的大部分区域，模型通常仍能相当好地恢复整体对象结构。\n\n**随机块遮蔽：** MAE 在训练期间通常遮蔽约 75% 的图像块。以下可视化说明了遮蔽过程：\n\
  \n```\nfor y in range(0,224,16):\n    for x in range(0,224,16):\n        if np.random.rand()\
  \ < 0.75:\n            masked[y:y+16, x:x+16] = 0\n```\n\n遮蔽后的图像仅包含一小部分可见块。通过隐藏大部分图像，模型被迫学习高级语义概念而不是记忆像素。\n\
  \n**Vision Transformer 块表征：** MAE 继承了 Vision Transformer 使用的基于块的表征。对于 patch_size\
  \ 为 16，224 × 224 的图像变为 14 × 14 = 196 个块 token。以下可视化显示了块网格：\n\n```\nax.axhline(i);\
  \ ax.axvline(i)\n```\n\n每个块成为由 Transformer 处理的独立 token。\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_634_0.png)\n\
  \n*图 12.21 – 使用 MAE 的图像重建*\n\n**块激活图：** 编码器为每个图像块生成特征向量。\n\n```\ntokens = model.vit(inputs[\"\
  pixel_values\"]).last_hidden_state\n```\n\n移除 CLS token 后，计算每个块的特征幅度：\n\n```\npatch_tokens\
  \ = tokens[0,1:,:]\nactivation_map = torch.norm(patch_tokens, dim=1)\n```\n\n这会生成一个热图，指示哪些图像区域产生最强的\
  \ Transformer 激活。亮区域对应包含更具信息量的视觉内容的块。\n\n resulting 嵌入总结了图像的视觉内容。这些学习到的表征通常可高度迁移到下游任务。\n\
  \n**MAE 特征的 PCA 可视化：** 从 500 张 CIFAR-10 图像中提取的特征使用 PCA 投影到二维。\n\n```\npca = PCA(n_components=2)\n\
  emb = pca.fit_transform(features)\n```\n\n散点图揭示了 MAE 如何在特征空间中组织图像。尽管模型在预训练期间从未见过类别标签，但属于相似语义类别的图像通常会形成可见的簇。\n\
  \n**学习表征的 t-SNE 可视化：** 使用 t-SNE 可获得更强大的非线性可视化。\n\n```\ntsne = TSNE(n_components=2,\
  \ perplexity=30)\nemb = tsne.fit_transform(features)\n```\n\n resulting 特征图通常表现出对象的清晰语义分组。这表明\
  \ MAE 学习了有意义的表征，即使其训练目标纯粹基于重建。\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_636_0.png)\n\
  \n*图 12.24 – 使用 PCA 和 t-SNE 的 MAE 特征空间二维流形*\n\n**为什么 MAE 有效：** 传统有监督学习优化：图像 → 类别标签，MAE\
  \ 而是优化：可见块 → 缺失块。因为重建需要理解对象结构、纹理、形状和上下文，模型自然学习到丰富的视觉表征。与有监督学习不同，可以利用数百万张未标记图像。关键见解是\
  \ **重建缺失图像块迫使模型学习视觉内容的语义理解**，使 MAE 成为现代计算机视觉任务的有效基础模型。\n\n\n\n\n\n# 联邦学习（隐私保护深度学习）用于分布式图像分类\n\
  \n传统的深度学习假设所有训练数据都收集并存储在中央服务器上。在许多现实世界应用中，例如医院、移动设备、银行和自动驾驶汽车，由于隐私、法律或安全限制，共享原始数据可能是不可能的。\n\
  \n联邦学习（FL）通过允许多个客户端在不共享本地数据的情况下协作训练模型来解决这一挑战。每个客户端不是传输图像，而是训练本地模型并仅将模型更新（权重或梯度）发送到中央服务器。\n\
  \nServer ← Model Updates ← Clients\n\n服务器聚合更新并将改进后的全局模型分发回所有客户端。\n\n数学表述：假设有 K 个客户端。客户端\
  \ k 拥有本地数据集 D_k = (x_i, y_i) 并最小化其本地目标：\n\nF_k(w) = 1/|D_k| Σ_{(x,y)∈D_k} L(f(x;\
  \ w), y)\n\n其中 w = 网络参数，L = 分类损失，f = CNN 模型。\n\n全局优化问题变为：\n\nF(w) = Σ_{k=1}^K |D_k|/N\
  \ F_k(w)\n\n其中 N = Σ_{k=1}^K |D_k| 是样本总数。\n\n联邦平均（FedAvg）：最广泛使用的联邦学习算法是联邦平均（FedAvg）。每个客户端本地训练并产生权重\
  \ w_1, w_2, ..., w_K。服务器计算 w_global = 1/K Σ_{k=1}^K w_k 并重新分发平均模型。这种简单的平均过程使所有客户端都能从集体学习中受益，同时保持其数据私密。\n\
  \n想象五个医院（A、B、C、D、E）各自拥有医学图像。医院 A、B 和 C 从不共享图像。相反，每个医院训练一个本地 CNN 并仅将学习到的参数发送到中央服务器。服务器平均参数并创建一个更强的全局模型，该模型在从未看到其原始数据的情况下间接从所有医院学习。\n\
  \n数据集：Fashion-MNIST：演示使用手写时尚数据集：28 × 28 灰度服装图像，属于十个类别：T-Shirt、Trouser、Pullover、Dress、Coat、Sandal、Shirt、Sneaker、Bag\
  \ 和 Ankle Boot。数据集随机划分为五个模拟客户端。\n\n```\nnum_clients = 5\nclient_indices = np.array_split(indices,\
  \ num_clients)\n```\n\n每个客户端接收其自己的私有子集。\n\n## CNN 分类器\n使用轻量级 CNN 进行图像分类。\n\n```\n\
  class CNN(nn.Module):\n    def forward(self,x):\n        f = self.features(x)\n\
  \        return self.classifier(f)\n```\n\n架构由卷积层用于特征提取、最大池化用于空间缩减以及全连接层用于分类组成。\n\
  \n## 本地客户端训练\n每个客户端使用其本地数据集独立训练。\n\n```\ndef local_train(model, loader):\n    pred\
  \ = model(x)\n    loss = criterion(pred, y)\n    loss.backward()\n```\n\n客户端永远不会将其图像暴露给任何其他客户端或服务器。仅共享学习到的权重。\n\
  \n## 联邦聚合\n本地训练后，服务器使用 FedAvg 聚合客户端模型。\n\n```\ndef fedavg(weights):\n    avg = copy.deepcopy(weights[0])\n\
  \    for key in avg.keys():\n        for i in range(1, len(weights)):\n        \
  \    avg[key] += weights[i][key]\n        avg[key] /= len(weights)\n    return avg\n\
  ```\n\n概念上，\n\n$w_{global} = \\frac{1}{K} \\sum_{k=1}^{K} w_k$\n\n resulting model\
  \ becomes the new global model.\n\n## 联邦训练循环\n训练通过多次通信轮次进行。\n\n```\nfor r in range(rounds):\n\
  \    local_weights = []\n    for client_loader in clients:\n        w = local_train(local_model,\
  \ client_loader)\n    global_model.load_state_dict(fedavg(local_weights))\n```\n\
  \n每个轮次包括\n- 将全局模型发送给客户端\n- 本地客户端训练\n- 聚合客户端模型\n- 更新全局模型\n\n该过程重复进行直到收敛。\n\n## 集中式学习基线\n\
  为了比较，使用整个数据集训练传统的集中式模型。\n\n```\ncentral_model = CNN()\n```\n\n这代表了所有数据可以存储在一个位置的理想场景。\n\
  \n## 联邦与集中式准确率\n实验比较了两种方法获得的测试准确率。如下一图所示，联邦和集中式分类器的准确率随训练轮次增加，联邦准确率最终达到 90.6%（略低于其集中式对应物）。\n\
  \n```\nPlt.plot(federated_acc)\nPlt.plot(central_acc)\n```\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_639_0.png)\n\
  \n*Figure 12.25 – Federated vs. Centralized classifier performance over epochs*\n\
  \n### 观察到的性能：\n\n| Round | Federated Accuracy |\n|-------|--------------------|\n\
  | 0 | 77.9% |\n| 5 | 89.3% |\n| 9 | 90.6% |\n\n*Table 12.7: Federated classification\
  \ accuracy over rounds*\n\n## Note\n由于联邦学习在异构本地数据上优化模型且通信受限，与集中式训练相比会失去一些全局统计效率，但仍然接近，因为所有客户端共同近似相同的底层数据分布。联邦模型在从未访问集中式数据的情况下逐渐接近集中式性能。\n\
  \n## 混淆矩阵分析\n分类性能可以使用混淆矩阵进行分析。\n\n```\ncm = confusion_matrix(y_true, y_pred)\n```\n\
  \n矩阵揭示了联邦训练中经常混淆的服装类别、强类、弱类以及错误模式。接近对角线的矩阵表示良好的分类性能。\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_640_0.png)\n\
  \n*Figure 12.26 – Confusion matrix for classification*\n\n## 学习特征空间可视化\n提取中间 CNN\
  \ 特征并使用 t-SNE 投影到二维。\n\n```\nf = global_model.features(x)\nembedding = tsne.fit_transform(features[:3000])\n\
  ```\n\n resulting visualization shows how the network organizes clothing categories\
  \ in feature space. Well-separated clusters indicate that the federated model has\
