  \n*Figure 3.31 – Annotating an image with text*\n\n### Drawing contour lines for\
  \ an image\n\nA contour line for an image is a curve connecting all the pixels where\
  \ they have the same particular (constant) value. If we represent the image as a\
  \ function, f(x, y), where x and y are the spatial coordinates, a contour line corresponds\
  \ to a set of points (x, y) such that f(x, y) = constant.\n\nThe following code\
  \ snippet shows how to draw the contour lines for a gray-scale image of Einstein,\
  \ using the `contour()` function from the `matplotlib.pylab` module.\n\nThe constant\
  \ levels are specified using the `np.linspace()` function, which creates an array\
  \ with 15 values, evenly spaced between 0 and 255 (inclusive), to be used as levels\
  \ (constants) for the contour plot.\n\nContour lines can be styled and colored using\
  \ various parameters, such as `colors`, `cmap` (colormap; here `plt.cm.hot` is used),\
  \ and `linewidths`. You can fill the regions between contours using `plt.contourf()`.\n\
  \nYou can add labels to the contours using the `plt.clabel()` function. This adds\
  \ labels to the contours at specified locations (as can be seen from the following\
  \ figures, the 18.2, 36.4, and 91.1 levels are added as labels. These values were\
  \ generated previously using `np.linspace()`).\n\nNow, refer to the following code\
  \ snippet:\n\n```python\nim = imread(\"images/einstein.jpg\")  # read image as\n\
  \                                    # a numpy ndarray\n\nplt.subplot(131), plt.imshow(im,\
  \ cmap='gray', aspect='auto')\nplt.axis('off'), plt.title('Original Image', size=20)\n\
  plt.subplot(132)\ncs = plt.contour(np.flipud(im), levels=np.linspace(0,255,15),\
  \ \\\n                 cmap=plt.cm.hot)\nplt.clabel(cs, fontsize=15, inline=True)\n\
  ```\n\n```python\nplt.gray()\nplt.subplot(131), plt.imshow(im_ctr, aspect='auto')\
