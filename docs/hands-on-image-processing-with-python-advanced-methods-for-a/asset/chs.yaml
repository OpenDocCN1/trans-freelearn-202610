  \n## Image enhancement with deep learning models\n\n随着深度学习的出现，图像增强已超越传统算法的局限性，使得数据驱动的恢复和感知质量提升成为可能。在本节中，我们探讨了最先进的深度模型，例如\
  \ Zero-DCE、MAXIM、DCP 和 EDSR，展示了它们在低光增强、去噪、去雾和超分辨率方面的强大能力。我们将仅关注使用预训练深度学习模型进行图像增强，而在自定义数据集上训练模型将在后续章节中介绍。\n\
  \n## Low-light image enhancement with Zero-DCE\n\n低光图像增强是许多计算机视觉任务中的关键预处理步骤，尤其是在自动驾驶、监控、医学成像和夜间摄影中。传统的增强方法，如直方图均衡化、伽马校正和\
  \ Retinex-based 技术，在应用于严重曝光不足的图像时往往效果不佳，因为会放大噪声、造成色彩失真或过度饱和。\n\n2020 年，Guo 等人引入了一种创新的基于学习的技巧，称为\
  \ Zero-Reference Deep Curve Estimation（Zero-DCE），它无需成对训练数据（即低光和真实正常光图像对），而是直接以无监督方式学习增强图像。本节解释了\
  \ Zero-DCE 的理论基础、直觉以及使用 PyTorch 的实际实现。\n\n### Enhancement function: iterative curve\
  \ estimation\n\nZero-DCE 的核心在于学习一组增强曲线以迭代调整像素强度。\n\n每个像素值 x ∈ [0,1] 使用以下方式增强：\n\n\
  $x_{t+1} = x_t + α_t · x_t · (1 − x_t)$\n\n该表达式可从一般光照调整直觉推导而来：x_t · (1 − x_t) 在中强度处（x=0.5）最大，使得增强能够非线性地自适应。α_t\
  \ ∈ [−1,1] 由神经网络按像素和迭代学习。\n\n迭代应用该曲线可逐步细化亮度。实际上，作者发现对称变体同样有效；这种形式避免了与 x · (1 − x)\
  \ 的乘法，但由于其对称性，效果相似。\n\nZero-DCE 不需要真实图像。相反，它依赖于自正则化损失项：\n\n- 空间一致性损失 L_spa：鼓励输入图像与增强图像之间的结构一致性。\n\
  - 曝光控制损失 L_exp：引导平均亮度到参考水平（通常为 0.6）。\n- 色彩恒常性损失 L_col：确保 R、G 和 B 通道平衡。\n- 光照平滑损失\
  \ L_tv：正则化预测的光照图。\n\n\n\n\n\n总损失为：\n\n$$L_{total} = \\lambda_{spa} L_{spa} + \\\
  lambda_{exp} L_{exp} + \\lambda_{col} L_{col} + \\lambda_{tv} L_{tv}$$\n\n所提出的网络\
  \ DCE-Net 轻量且为全卷积结构，由七个卷积层、ReLU 激活和跳跃连接构成，以保留空间信息。\n\n**输入：** RGB 低光图像\n\n**输出：**\
  \ 用于 α_t 的 3 × n 通道堆栈，针对 n 次迭代的每个 3 个颜色通道。\n\n最终层使用 tanh 激活以约束输出 α_t ∈ [−1,1]。\n\
  \n对于前向传递逻辑，网络预测 n 个单独的 α_t 映射，每个映射有 3 个通道。这些映射沿通道轴拆分以迭代应用增强曲线。迭代地使用增强曲线细化图像 x。如有需要存储中间结果（例如第\
  \ 4 次和第 8 次迭代）。\n\n以下 Python 代码演示了如何使用预训练模型增强几张低光图像。它首先将预训练权重加载到实例化的 DCENet 模型对象中，然后将模型移至\
  \ GPU 以加速。对于增强图像目录，它加载并归一化每个输入图像，将其转换为张量并移至 CUDA，然后应用模型并保存增强后的输出。\n\n### 为什么这会有效？\n\
  \n- 增强曲线是逐像素自适应的，通过 CNN 学习\n- 迭代应用允许渐进细化\n- 损失项鼓励曝光校正、色彩平衡和结构保留，而无需监督\n- 网络紧凑（少于\
  \ 100k 参数），在 GPU 甚至移动设备上运行速度快\n\n现在，参考以下代码片段：\n\n```\nimport torch, torchvision,\
  \ torch.nn as nn\nfrom pathlib import Path\n\nclass DCENet(nn.Module):\n    def\
  \ __init__(self, n=8, return_results=[4, 6, 8]):\n        super().__init__()\n \
  \       self.n = n\n        self.ret = return_results\n        self.conv1 = nn.Conv2d(3,\
  \ 32, kernel_size=3, padding=1, bias=True)\n        self.conv2 = nn.Conv2d(32, 32,\
  \ kernel_size=3, padding=1,\n            bias=True)\n        self.conv3 = nn.Conv2d(32,\
  \ 32, kernel_size=3, padding=1,\n            bias=True)\n        self.conv4 = nn.Conv2d(32,\
  \ 32, kernel_size=3, padding=1,\n            bias=True)\n        self.conv5 = nn.Conv2d(64,\
  \ 32, kernel_size=3, padding=1,\n            bias=True)\n        self.conv6 = nn.Conv2d(64,\
  \ 32, kernel_size=3, padding=1,\n            bias=True)\n        self.conv7 = nn.Conv2d(64,\
  \ 3 * n, kernel_size=3, padding=1,\n            bias=True)\n        self.relu =\
  \ nn.ReLU(inplace=True)\n        self.tanh = nn.Tanh()\n\n    def forward(self,\
  \ x):\n        out1 = self.relu(self.conv1(x))\n        out2 = self.relu(self.conv2(out1))\n\
  \        out3 = self.relu(self.conv3(out2))\n        out4 = self.relu(self.conv4(out3))\n\
  \        out5 = self.relu(self.conv5(torch.cat((out4, out3), 1)))\n        out6\
  \ = self.relu(self.conv6(torch.cat((out5, out2), 1)))\n        alpha_stacked = self.tanh(self.conv7(torch.cat((out6,\
  \ out1), 1)))\n        alphas = torch.split(alpha_stacked, 3, 1)\n        results\
  \ = [x]\n        for i in range(self.n):\n            x = x + alphas[i] * (torch.pow(x,\
  \ 2) - x)\n            if i + 1 in self.ret: results.append(x)\n        return results,\
  \ alpha_stacked\n\ndevice = torch.device('cuda:0') # Run on GPU (e.g., google colab)\n\
  model = DCENet(return_results=[4, 8])\nmodel.load_state_dict(torch.load('models/8LE-color-loss2_best_model.pth',\n\
  \                map_location='cuda:0', weights_only=False)['model'])\nmodel.to(device)\n\
  ```\n\n```python\ninPath = Path('images/low_light_inp')\noutPath = Path('images/enhanced_out')\n\
  outPath.mkdir(parents=True, exist_ok=True)\nnum_images = 0\nfor file in inPath.glob('*'):\n\
  \    img = Image.open(file)\n    img = torch.from_numpy(np.array(img))\n    img\
  \ = img.float().div(255)\n    img = img.permute((2, 0, 1)).contiguous()\n    img\
  \ = img.unsqueeze(0)\n    img = img.to(device)\n    results, Astack = model(img)\n\
  \    enhanced_image = results[1]\n    torchvision.utils.save_image(enhanced_image,\
  \ \\\n        outPath.joinpath('enhanced_' + file.name))\n    num_images += 1\n\
  ```\n\n如果运行上述代码片段，您应获得以下图：\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_364_0.png)\n\
  \n*Figure 7.35 – Low-light image enhancement with Zero-DCE pretrained model*\n\n\
  ## 使用多轴 MLP 的去噪\n\n传统的 Gaussian 滤波、wavelet shrinkage 和 BM3D 方法在一定程度上已被证明有效，但基于深度学习的方法现在引领了最先进水平。其中一个模型是\
  \ **Multi-Axis MLP (MAXIM)**，由 Google Research 开发，它在真实去噪基准测试 **Smartphone Image\
  \ Denoising Dataset (SIDD)** 上展示了令人印象深刻的性能。\n\nMAXIM (Tao et al., 2022) 是一种通用图像恢复框架，采用新颖的架构，集成了：\n\
  \n- **MAMLP** 以实现全局感受野学习\n- **局部和全局操作** 以捕捉精细和粗糙特征\n- **具有跳跃连接的分层编码器-解码器架构**\n\n\
  MAXIM 代表了一类新的神经架构，利用 MLP 进行去噪等密集图像预测任务。它在 SIDD 和其他基准测试上的强劲性能证明了其现实世界的相关性。\n\nMAXIM\
  \ 架构亮点包括：\n\n- **基于 MLP 的处理：** 与卷积架构不同，MAXIM 用多轴 MLP 层替代自注意力或卷积，以实现高效处理\n- **交叉门控机制：**\
  \ 有助于编码器和解码器特征的更好融合\n- **多尺度分层解码器：** 逐步重建精细细节\n\nMAXIM 变体（例如 MAXIM-S3）设计为轻量且快速，同时仍提供顶级性能。在这里，我们将使用\
  \ Google 在 Hugging Face 上提供的预训练 MAXIM-S3 模型进行真实图像去噪，如下一段代码所示。Keras 和 Hugging Face\
  \ 的集成使 MAXIM 在 Python 项目中易于用于实际增强任务。\n\n代码中的关键步骤如下：\n\n- **加载预训练模型：** 使用函数 `from_pretrained_keras()`\
  \ 通过 Hugging Face 加载在 SIDD 数据集上训练的 MAXIM-S3 模型\n- **遍历噪声图像：** 处理指定噪声文件夹中的所有 .jpg\
  \ 图像\n- **预处理每张图像：** 调整图像大小并将其转换为批量为 1 的张量（使用 `tf.expand_dims()`）以供模型输入\n- **运行\
  \ MAXIM 去噪：** 生成 3 个中间输出；第 3 个 (`denoised[0][2]`) 是最终去噪结果\n- **后处理输出：** 裁剪值（使用 `tf.clip_by_value()`）并将输出张量转换回可显示的图像格式\n\
  - **并排可视化：** 显示噪声输入和去噪输出以进行视觉比较\n\n现在参考下一段代码片段：\n\n```\nfrom huggingface_hub import\
  \ from_pretrained_keras\nimport tensorflow as tf\n# Load pretrained MAXIM for SIDD\
  \ denoising\nmodel = from_pretrained_keras(\"google/maxim-s3-denoising-sidd\")\n\
  for imf in sorted(glob('images/noisy/*.jpg')):\n    im = Image.open(imf)       \
  \   # Load a sample noisy image\n    im = im.resize((256, 256))\n    im_np = np.array(im)\n\
  \    im_tensor = tf.convert_to_tensor(im_np, dtype=tf.float32)\n    im_tensor =\
  \ tf.expand_dims(im_tensor, 0)  # batch = 1\n    denoised = model.predict(im_tensor)\
  \ # Run inference for denoising\n    denoised[0][0].shape, denoised[0][1].shape,\
  \ denoised[0][2].shape\n    denoised_np = tf.clip_by_value(denoised[0][2].squeeze(),\
  \ 0, 255).numpy().astype(np.uint8) # Squeeze and convert back to uint8\n    # Display\
  \ input image im_np vs. Output denoised_np here\n```\n\n如果运行上述代码片段，您应获得以下图：\n\n\
  ![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_366_0.png)\n\n*Figure 7.36 – Denoising\
  \ images with a pretrained MAXIM model*\n\nMAXIM 在以下方面表现良好：\n\n- **长程依赖：** 传统 CNN\
  \ 受局部感受野限制。MAXIM 的 MLP 层可以建模全局上下文。\n- **多尺度监督：** 有助于在各种空间分辨率下细化细节。\n- **交叉门控块：**\
  \ 改善编码器和解码器特征之间的交互。\n\n## 使用暗通道先验的去雾\n\n户外摄影通常由于雾霾、雾气或大气散射导致可见度降低。雾霾会影响色彩保真度和对比度，使目标检测和场景理解更加困难。在本节中，我们将探讨一种强大且广泛使用的图像去雾方法，称为\
  \ **暗通道先验 (DCP)**。\n\n该技术最初由 He、Sun 和 Tang 在 2009 年具有影响力的论文中提出，利用了关于无雾图像的一个简单而深刻的观察：无雾户外图像中的大多数局部块都包含至少一个颜色通道中强度非常低的像素。这种统计先验，即暗通道，构成了有效的去雾算法的基础。\n\
  \n雾化图像的形成通常由大气散射模型建模：\n\n$$I(x) = J(x) \\cdot t(x) + A \\cdot (1 - t(x))$$\n\n其中：\n\
  \n- $I(x)$：像素 $x$ 处的观测雾化图像\n- $J(x)$：场景辐射度（待恢复的真实图像）\n- $A$：全局大气光（通常为 3 通道 RGB 向量）\n\
  - $t(x)$：介质透射率描述到达相机的未被散射的光的比例\n\n去雾的目标是在给定 $I(x)$ 的情况下恢复 $J(x)$。\n\n### 暗通道先验\n\
  \n考虑图像 $I$ 的暗通道，其中\n\n- $\\Omega(x)$：以像素 $x$ 为中心的局部块\n- $I^c(y)$：像素 $y$ 处颜色通道 $c$\
  \ 的强度\n\n\n\n\n\nThis exploits the observation that in non-sky regions, at least\
  \ one channel tends to have low intensity. In hazy images, these dark channels appear\
  \ much brighter due to scattered light. Hence, the difference between the dark channel\
  \ of a hazy image and a haze-free image becomes a cue for transmission estimation.\n\
  \nLet’s understand the algorithm step by step:\n\n- Reads the input image.\n- **Computes\
  \ dark channel:** implemented by the function `dark_channel()`, which splits RGB\
  \ channels using a minimum filter and morphological erosion on local patches, computes\
  \ the minimum per-pixel across R, G, B and applies erosion with a kernel (patch\
  \ size sz) to compute the local minimum — the dark channel.\n- **Estimates global\
  \ atmospheric light:** Implemented using the function `estimate_atmospheric_light()`,\
  \ refer to the next code snippet. We assume the brightest pixels in the dark channel\
  \ correspond to haze-opaque regions (e.g., sky or distant background). Their RGB\
  \ values give us the atmospheric light vector A.\n- **Flattens the dark channel\
  \ and selects the top brightest pixels:** Averages their RGB values to estimate\
  \ atmospheric light A.\n- **Estimates transmission map** (dehazes the image) using\
  \ the function `dehaze()`. We use the equation derived from the haze model and assume\
  \ constant airlight over a local patch:\n  \n  $$t(x) = 1 - \\omega \\cdot I_{dark}(x)$$\
  \ \n  \n  where $\\omega$ is a constant (typically 0.95).\n- **Recover scene radiance\
  \ from the haze model:**\n  \n  $$J(x) = \\frac{I(x) - A}{\\max(t(x), t0)} + A$$\n\
  - Displays original and restored images side by side.\n\nNow, refer to the following\
  \ code snippet:\n\n```\ndef dark_channel(im, sz):\n    b, g, r = cv2.split(im)\n\
  \    dc = cv2.min(cv2.min(r, g), b)\n    kernel = cv2.getStructuringElement(cv2.MORPH_RECT,\
  \ (sz, sz))\n    dark = cv2.erode(dc, kernel)\n    return dark\n```\n\n```\n```python\n\
  def estimate_atmospheric_light(im, dark):\n    [h, w] = im.shape[:2]\n    imsz =\
  \ h * w\n    numpx = int(max(np.floor(imsz / 1000), 1))\n    darkvec = dark.reshape(imsz,\
  \ 1)\n    imvec = im.reshape(imsz, 3)\n    indices = darkvec.argsort()\n    indices\
  \ = indices[imsz-numpx:]\n    atmsum = np.zeros([1, 3])\n    for ind in indices:\n\
  \        atmsum = atmsum + imvec[ind]\n    A = atmsum / numpx\n    return A\n\n\n\
  def dehaze(im, A, omega=0.95, t0=0.1):\n    im3 = np.empty(im.shape, im.dtype)\n\
  \    for ind in range(0, 3):\n        im3[:, :, ind] = im[:, :, ind] / A[0, ind]\n\
  \    transmission = 1 - omega * dark_channel(im3, 15)\n    t = cv2.max(transmission,\
  \ t0)\n    J = np.empty(im.shape, im.dtype)\n    for ind in range(0, 3):\n     \
  \   J[:, :, ind] = (im[:, :, ind] - A[0, ind]) / t + A[0, ind]\n    return J\n\n\
  \nimg = plt.imread('images/hazy.jpg')\nA = estimate_atmospheric_light(img, dark_channel(img,\
  \ 15))\ndehazed_img = dehaze(img, A)\nplt.imshow(np.hstack((img, dehazed_img))),\
  \ plt.axis('off')\n```\n```\n\nIf you run the above code snippet, you should obtain\
  \ the following figure:\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_370_0.png)\n\
  \nFigure 7.37 – Dehazing with dark channel prior\n\nThe method works best on natural\
  \ outdoor images with distinct haze. Indoor images or those without strong haze\
  \ may not benefit. Refining the transmission map (e.g., with guided filtering) can\
  \ significantly improve visual quality.\n\n## Super-resolution with enhanced deep\
  \ residual networks\n\nImage **super-resolution (SR)** is the task of reconstructing\
  \ a **high-resolution (HR)** image from its **low-resolution (LR)** counterpart.\
  \ It is crucial for applications like medical imaging (e.g., zooming in on scans),\
  \ satellite and aerial imagery, surveillance and forensics, and enhancing consumer\
  \ images and videos. Traditional methods like bicubic interpolation fail to preserve\
  \ textures and sharp edges. Deep learning–based approaches, such as **Enhanced Deep\
  \ Residual Networks (EDSR)**, provide a significant leap forward.\n\nGiven a low-resolution\
  \ image $I_{LR}$, we aim to estimate its high-resolution counterpart $I_{SR}$, such\
  \ that $I_{SR} \\approx I_{HR}$. The network learns a mapping function $f_\\theta$\
  \ parameterized by deep network weights:\n\n$I_{SR} = f_\\theta(I_{LR})$\n\n## Architecture\
  \ of EDSR\n\nEDSR is an improved version of the **SRResNet** model, which builds\
  \ on residual learning. Its architecture includes:\n\n- **Feature extraction layer:**\
  \ $F_0 = Conv(I_{LR})$\n- **Residual blocks (×N):** Each block contains:\n- Conv\
  \ → ReLU → Conv\n- **Residual skip connection:**\n  \n  $F_{i+1} = F_i + B(F_i)$\n\
  - **Long skip connection:**\n  \n  $F_{res} = F_0 + Conv(F_N)$\n- **Upsampling layers:**\
  \ Uses sub-pixel convolution or pixel shuffle [Shi et al., 2016]\n- **Output layer:**\
  \ Final convolution to get the RGB SR image\n\nNow, let’s deep-dive into Python\
  \ implementation and understand how the following code works. Here’s a concise summary\
  \ of what the following code does, broken into key steps and functions:\n\n- Loads\
  \ and normalizes input image using Lambda(normalize) to center pixel values\n- Defines\
  \ residual blocks with res_block() using two convolutional layers and a skip connection\n\
  - Stacks multiple residual blocks (e.g., 16 blocks) and adds a long skip connection\n\
  - Applies upsampling via pixel_shuffle() in the upsample() function for 2×, 3×,\
  \ or 4× resolution\n- Builds the full model using edsr() that returns high-resolution\
  \ output\n- Loads pretrained weights from 'models/weights-edsr-16-x4.h5'\n- Reads\
  \ low-resolution input image using PIL.Image.open()\n- Performs baseline upscaling\
  \ via bicubic interpolation using PIL.Image.resize()\n- Applies EDSR model inference\
  \ using resolve_single() and resolve()\n- Displays LR, bicubic, and EDSR outputs\
  \ side by side using matplotlib.pyplot\n\nNow refer to the following code snippet\
  \ (to be run in Google Colab); for complete code, refer to GitHub:\n\n```\n# run\
  \ in google colab (on GPU)\nfrom tensorflow.keras.layers import Add, Conv2D, Input,\
  \ Lambda\nfrom tensorflow.keras.models import Model\n\ndef edsr(scale, num_filters=64,\
  \ num_res_blocks=8, res_block_scaling=None):\n    x_in = Input(shape=(None, None,\
  \ 3))\n    x = Lambda(normalize)(x_in)\n    x = b = Conv2D(num_filters, 3, padding='same')(x)\n\
  \    for i in range(num_res_blocks):\n```\n\n```\n```python\ndef resolve_and_plot(model_pre_trained,\
  \ lr_image_path):\n    im_lr = Image.open(lr_image_path)\n    lr = np.array(im_lr)[...,:3]\n\
  \    sr_ci = np.array(im_lr.resize((lr.shape[1]*4, lr.shape[0]*4),\n           \
  \                       Image.BICUBIC))[...,:3]\n    sr_pt = resolve_single(model_pre_trained,\
  \ lr)\n    model_name = model_pre_trained.name.upper()\n    # Plot low-res image\
  \ (LR), sr_ci and sr_pt side-by-side here\n\nweights_dir = 'models/'\nlr_image_path\
  \ = 'images/butterfly.png'\n# EDSR baseline as described in the EDSR paper (1.52M\
  \ parameters)\nedsr_pre_trained = edsr(scale=4, num_res_blocks=16)\nedsr_pre_trained.load_weights(os.path.join(weights_dir,\
  \ \\\n                               'models/weights-edsr-16-x4.h5'))\nresolve_and_plot(edsr_pre_trained,\
  \ lr_image_path)\n```\n```\n\nIf you run the above code snippet, you should obtain\
  \ the following figure:\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_373_0.png)\n\
