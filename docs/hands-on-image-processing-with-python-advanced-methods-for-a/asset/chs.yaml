  \ app for image enhancement*\n\n主要优势包括以下内容：\n\n- **Modular Design:** 可轻松扩展以添加新的增强方法\n\
  - **Streamlit Integration:** 快速部署，支持滑块、文件上传和图像显示\n- **Interactive UI:** 参数调整的即时反馈\n\
  - **Color Space Flexibility:** 可适应不同类型的视觉输入（HSV、YCrCb 等）\n\n强烈建议读者通过集成以下附加功能来增强此应用程序的功能：\n\
  \n- 支持更多增强算法（例如，CLAHE、Retinex、去雾）\n- 直方图实时可视化\n- 批量图像处理\n- 增强输出的下载按钮\n- 性能指标，如熵或对比度评分\n\
  \n该应用程序的模块化架构使其易于扩展和定制。将此应用程序视为构建更强大、更具交互性的图像增强工具的基础！\n\n## Denoising with BM3D\n\
  \n图像去噪是图像处理中的一项基本任务，旨在从噪声观测中恢复原始图像。**Block-Matching and 3D (BM3D)** 滤波，由 Dabov 等人于\
  \ 2007 年提出，是一种最先进的去噪算法，以其在有效去除噪声的同时保留边缘和纹理的能力而闻名。本节全面解释了 BM3D，包括其理论、数学公式和 Python\
  \ 实现。\n\n设噪声图像 $y$ 被建模为 $y = x + n$，其中 $x$ 是原始干净图像，$n$ 是加性高斯白噪声（AWGN），其标准差为（有关深入讨论，请参阅图像恢复章节）。\n\
  \nBM3D 在两个主要阶段运行：\n\n- **Basic estimate**（硬阈值）：分组相似的块，执行协作 3D 滤波，通过变换域中的硬阈值\n- **Final\
  \ estimate**（维纳滤波）：使用基本估计执行维纳滤波以获得更好的精度\n\n总体 BM3D 去噪流程由三个基本操作组成，即块匹配、协作滤波和聚合，这些操作在上述两个估计阶段中迭代执行：\n\
  \n- **Block matching:** 在图像中查找相似的 2D 块 {$P_i$}。这些块堆叠成 3D 数组：[$P_i^1$, $P_i^2$, ...,\
  \ $P_i^k$]。\n- **Collaborative filtering:** 应用 3D 线性变换（例如，2D DCT + 1D Haar）。执行阈值或维纳滤波。逆变换得到去噪块。\n\
  - **Aggregation:** 重叠块使用加权平均聚合以形成最终图像。\n\n要在 Python 中使用 BM3D，让我们首先按下一段代码所示安装 bm3d\
  \ 库：\n\n```\nimport bm3d  # first install with !pip install bm3d\nimage_path = 'images/mandrill_spnoise_0.3.jpg'\
  \  # Load a noisy image\nnoisy_image = img_as_float(io.imread(image_path))\ndenoised\
  \ = bm3d.bm3d(noisy_image, sigma_psd=0.2, \\\n                    stage_arg=bm3d.BM3DStages.ALL_STAGES)\n\
  # Display the results here\n```\n\n如果您运行上述代码片段并绘制输入和输出图像，您应该得到以下图：\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_355_0.png)\n\
  \n*Figure 7.32 – Denoising with BM3D*\n\n前面的代码片段演示了如何评估和可视化 BM3D 去噪算法在不同噪声标准差（sigma_psd）设置下的性能，使用标准图像质量指标，如\
  \ **PSNR** 和 **Structural Similarity Index Measure (SSIM)**。以下是关键步骤：\n\n- 向干净的灰度图像添加合成噪声\n\
  - 使用一系列 sigma_psd 值用 BM3D 进行去噪\n- 评估去噪后的图像质量\n- 可视化结果；原始、噪声和多个去噪输出显示在子图网格中，并附带其关联的\
  \ σ 值\n\n**Core functions:**\n\n- `bm3d.bm3d(...)`: 应用完整的 BM3D 去噪流程\n- `peak_signal_noise_ratio(...)`:\
  \ 衡量去噪图像与原始图像的接近程度（越高越好）\n- `structural_similarity(...)`: 评估结构相似性（接近 1 的值更好）\n-\
  \ `plt.imshow(...)`: 显示每个结果以便比较\n\n现在，向灰度 cameraman 图像（来自 `skimage.data`）添加高斯噪声，并使用不同的\
  \ sigma_psd 值应用 BM3D 去噪，并将您的 PSNR 和 SSIM 结果与 GitHub 笔记本中的我的参考实现进行比较。您应该得到如下图所示：\n\
  \n\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_356_0.png)\n\n> Figure 7.33 – Denoising\
  \ with BM3D with different noise variances\n\nBM3D 在去噪方面提供了最先进的质量，能够保留边缘、精细细节和纹理，并能有效处理高低噪声水平。然而，与更简单的方法相比，它计算密集，且需要准确的噪声水平估计。\n\
  \n## Wavelet-based image fusion and enhancement\n\n图像融合将同一场景的多个图像组合成一幅包含更多有意义信息的单幅增强图像。它在医学成像、遥感以及摄影中的曝光融合等应用中特别有用。基于小波变换的图像融合是一种广泛使用的多分辨率方法，它将输入图像分解为频率子带并使用融合规则进行组合。然后使用逆变换重建融合图像。本节详细介绍了基于小波的图像融合的数学解释、直觉以及\
  \ Python 实现。\n\n## Discrete wavelet transform\n\n离散小波变换（DWT）将图像分解为近似系数和细节系数：\n\n\
  - 近似系数（LL）：低频分量\n- 细节系数（LH, HL, HH）：分别在水平、垂直和对角方向上的高频分量\n\n设 f(x, y) 为大小为 M × N\
  \ 的输入图像。进行一层 2D DWT 如下：\n\n### Step 1: Row-wise filtering and downsampling\n\n对图像的每一行进行卷积：\n\
  \n- 低通滤波器（h_L[n]），\n- 高通滤波器（h_H[n]）\n\n然后将结果下采样 2 倍（保留每第二个采样）：\n\n```\nL_r(x, y)\
  \ = (f * h_L)(x, y) ↓₂\nH_r(x, y) = (f * h_H)(x, y) ↓₂\n```\n\n这里，* 表示沿行的 1D 卷积。\n\
  \n### Step 2: Column-wise filtering and downsampling\n\n然后将中间结果 L_r 和 H_r 沿列方向与相同的滤波器对\
  \ h_L^T 和 h_H^T 进行卷积，随后下采样 2 倍：\n\n```\nLL(x, y) = (L_r * h_L^T)(x, y) ↓₂\nLH(x,\
  \ y) = (L_r * h_H^T)(x, y) ↓₂\nHL(x, y) = (H_r * h_L^T)(x, y) ↓₂\nHH(x, y) = (H_r\
  \ * h_H^T)(x, y) ↓₂\n```\n\n因此，图像被分解为四个子带：LL、LH、HL 和 HH。\n\n这里，h_L^T 和 h_H^T 表示滤波器的转置（用于列方向卷积），而\
  \ ↓₂ 表示在相应方向上按因子二下采样。\n\n常见的小波类型包括：\n\n- **Haar (db1)**：最简单的正交小波。它执行基本的平均和差分。\n\
  - **Daubechies (dbN)**：具有更多消失矩以实现更平滑近似的正交小波族。\n\n设 I₁ 和 I₂ 为两个输入图像。应用 2D 小波分解后，对系数应用融合规则。融合规则包括：\n\
  \n- **Mean**：平均系数\n- **Max**：保留更强的特征\n- **Min**：保留更弱的特征\n\n接下来，使用逆 DWT 重建融合图像。\n\
  \n下面的代码演示了使用 DWT 进行图像融合，采用三种不同的融合策略：mean、max 和 min。下面是对代码每个部分的详细解释、其目的以及其工作原理：\n\
  \n- **Pywavelets (Pywt)**：小波变换的 Python 包装器；它支持 wavedec2（2D DWT）和 waverec2（逆 2D DWT）。\n\
  - **cv2**：OpenCV，用于图像读取、调整大小和灰度转换。\n- **Numpy**：高效的数组操作。\n- **Matplotlib.pylab**：用于图像显示和绘图。\n\
  \n函数 fuse_coefficients() 定义了两个小波系数矩阵如何融合。\n\n方法包括以下内容：\n\n- mean：取两个系数的平均值：Cf =\
  \ (C1+C2)/2\n- min：逐元素最小值，有助于抑制亮噪声：Cf = min(C1,C2)\n- max：保留最大特征（例如强边缘）：Cf = max(C1,C2)\n\
  \n函数 fuse_images() 实现了图像融合流程。\n\n图像调整大小确保两个图像大小相同（DWT 所需）。2D 小波分解使用选定的小波（默认 db1，即\
  \ Haar）执行多级 DWT。它返回：\n\n- coeffs[0]：近似系数（低通）\n- coeffs[1:]：细节系数的元组：\n  - **Horizontal\
  \ (LH)**\n  - **Vertical (HL)**\n  - **Diagonal (HH)**\n\n每个层级将图像分解为融合系数：如果 i ==\
  \ 0，则融合近似系数；否则，融合细节系数。这些保留不同的方向特征（例如 HL 中的垂直边缘）。重建执行逆小波重建：\n\n$I_{fused} = IDWT2(Af,\
  \ Hf, Vf, Df)$\n\n归一化确保最终图像缩放到 8 位范围 [0, 255]，适合显示。\n\n现在，参考下面的代码片段：\n\n```python\n\
  import pywt, cv2\nimport numpy as np\nimport matplotlib.pylab as plt\n\ndef fuse_coefficients(coeff1,\
  \ coeff2, method='mean'):\n    if method == 'mean':\n        return (coeff1 + coeff2)\
  \ / 2\n    elif method == 'min':\n        return np.minimum(coeff1, coeff2)\n  \
  \  elif method == 'max':\n        return np.maximum(coeff1, coeff2)\n    else: raise\
  \ ValueError(\"Unsupported fusion method\")\n\ndef fuse_images(im1, im2, fusion_method,\
  \ wavelet='db1'): # Daubechies wavelet\n    im2 = cv2.resize(im2, (im1.shape[1],\
  \ im1.shape[0])) # Resize im2 to match im1\n    coeffs1 = pywt.wavedec2(im1, wavelet)\
  \ # Wavelet decomposition\n    coeffs2 = pywt.wavedec2(im2, wavelet) # Wavelet decomposition\n\
  \    # Fuse wavelet coefficients\n    fused_coeffs = []\n    for i in range(len(coeffs1)):\n\
  \        if i == 0:\n            fused_coeffs.append(fuse_coefficients(coeffs1[0],\
  \ coeffs2[0], fusion_method)) # Approximation coefficients\n        else: # Detail\
  \ coefficients (horizontal, vertical, diagonal)\n            c1 = fuse_coefficients(coeffs1[i][0],\
  \ coeffs2[i][0], fusion_method)\n            c2 = fuse_coefficients(coeffs1[i][1],\
  \ coeffs2[i][1], fusion_method)\n            c3 = fuse_coefficients(coeffs1[i][2],\
  \ coeffs2[i][2], fusion_method)\n            fused_coeffs.append((c1, c2, c3))\n\
  \    fused_image = pywt.waverec2(fused_coeffs, wavelet) # Reconstruct fused image\n\
  \    fused_image = 255 * (fused_image - fused_image.min()) / (fused_image.max()\
  \ - fused_image.min()) # Normalize to 8-bit range\n    return fused_image.astype(np.uint8)\n\
  \nim1 = cv2.imread('images/mask.png', cv2.IMREAD_GRAYSCALE) # load images\nim2 =\
  \ cv2.imread('images/dust.png', cv2.IMREAD_GRAYSCALE)\nplt.gray() # Show images\n\
  plt.imshow(np.hstack((im1, im2, \\\n    cv2.resize(fuse_images(im1, im2, 'mean'),\
  \ (im1.shape[1],\n        im1.shape[0])),\n    cv2.resize(fuse_images(im1, im2,\
  \ 'max'), (im1.shape[1],\n        im1.shape[0])),\n    cv2.resize(fuse_images(im1,\
