- "### 更多图像处理\n\n在本章中，我们将更深入地研究使用各种 Python 库进行图像变换和增强的高级技术。在基础概念的基础上，我们探索一系列操作，从调整分辨率和色彩分级到模拟复杂的视觉效果，如镜头模糊、暗角效果和鱼眼失真。\n\
  \n我们将利用 PIL、opencv-python、SciPy、Wand、Matplotlib 和 Pilgram 等流行的库来进行变换，修改图像的结构、颜色和视觉吸引力。您将学习如何插值图像、应用基于查找表\
  \ (LUT) 的颜色校正、实现单应性变换，甚至重现类似 Instagram 的滤镜。\n\n我们将涵盖以下关键主题：\n\n- 使用 PIL 进行更多图像处理\n\
  - 使用 opencv-python 进行图像处理\n- 使用 `scipy.ndimage` 进行图像处理\n- 使用 Wand 进行图像处理\n- 使用 Matplotlib\
  \ 进行图像处理\n- 使用 Pilgram 进行图像处理\n\n在本章结束时，您将获得各种图像处理技术的实践经验，掌握以编程方式增强和变换图像的技能。让我们开始吧！\n\
  \n## 技术要求\n\n在阅读本章不同部分时，请跟随 Jupyter notebook 进行操作（并运行必要的代码片段）。GitHub 链接如下：https://github.com/PacktPublishing/Hands-on-Image-Processing-and-Computer-Vision-with-Python-Second-Edition。为了确保代码顺利运行，必须在运行代码之前安装正确版本的库。如果版本不匹配，代码可能需要在某些地方进行少量调整，具体取决于库中的某些特性/函数是否被移除/弃用。\n\
  \n# 使用 PIL 进行更多图像处理\n\n从上章结束的地方继续，让我们探索更多使用 PIL 进行图像处理的应用。\n\n# 更改 JPEG 图像的质量/分辨率\n\
  \n以下代码演示了 `Image.save()` 方法的 quality 参数如何控制 JPEG 压缩质量和文件大小。JPEG 使用有损压缩来减少存储空间，方法是丢弃人眼不太容易察觉的图像细节。在内部，Pillow\
  \ 将图像从 RGB 转换为 YCbCr 颜色空间，应用色度子采样（例如 4:2:0），将图像划分为 8 × 8 的块，并应用离散余弦变换 (DCT)。直观地说，DCT\
  \ 将图像块转换为频率分量，将大部分视觉信息集中在低频系数中，而精细细节对应于高频。较低的质量设置会更积极地量化这些高频分量，从而产生更小的文件，但也会引入诸如块状效应、模糊和振铃之类的伪影。我们将在第\
  \ 4 章中详细重新讨论 DCT 及其数学原理。\n\n以下代码将图像以质量值 95、20、5 和 1 保存，展示了视觉保真度与压缩比之间的权衡。较高的质量保留了细节，而较低的质量增加了压缩并导致明显的退化。使用\
  \ `os.path.getsize()` 计算文件大小和压缩比，以定量比较存储效率。\n\n```\nim = Image.open('images/parrot.jpg')\n\
  qualities = [95, 20, 5, 1]\nfor quality in qualities:\n    im.save(f\"images/parrot_{quality}.jpg\"\
  , quality=quality)\nplt.imshow(np.hstack([imread(f\"images/parrot_{quality}.jpg\"\
  ) \\\n    for quality in qualities]))\n```\n\n如果运行上述代码片段，您应该会得到类似下面的图像：\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_140_0.png)\n\
  \n图 3.1 —— 使用 PIL 更改 JPEG 图像质量\n\n如果从每个压缩图像 `im` 中提取一个小块（例如，使用 NumPy 切片 `im[100:200,\
  \ 200:300]`）并进行放大可视化，您可以观察到压缩伪影，如块状效应、模糊和振铃，尤其是在较低质量级别下，如下图所示。\n\n# 使用 PIL 提取的图像小块（质量：[95,\
  \ 20, 5, 1]）\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_141_0.png)\n\n图 3.2 ——\
  \ 使用 PIL 在较低质量 JPEG 图像中引入的伪影\n\n降低 JPEG 质量会利用更激进的熵编码和高频 DCT 分量的量化，通过丢弃人眼不太容易察觉的精细图像细节来减小文件大小。\n\
  \n您可以使用以下代码片段比较压缩后的文件大小（以 KB 为单位）或压缩比（原始文件大小与压缩文件大小的比值），以演示 JPEG 质量与压缩之间的权衡，这将帮助您定量理解压缩取舍。\n\
  \n```\noriginal_size = os.path.getsize(\"images/parrot.jpg\")\nfor quality in qualities:\n\
  \    compressed_size = \\\n        os.path.getsize(f\"images/parrot_{quality}.jpg\"\
  )\n    print(f\"Quality {quality}: Compression Ratio = \"\n          \"{original_size\
  \ / compressed_size:.2f}\")\n# Quality 95: Compression Ratio = 0.55\n# Quality 20:\
  \ Compression Ratio = 2.94\n# Quality 5: Compression Ratio = 5.32\n# Quality 1:\
  \ Compression Ratio = 6.12\n```\n\n较高的压缩比表明空间效率更好，因为这意味着用更少的内存或磁盘空间存储了更多的数据。您也可以选择性地加入\
  \ PSNR 作为图像质量指标，但仅比较文件大小就能提供有价值的见解，说明较低的质量如何显著降低存储需求——尽管这是以视觉保真度为代价的。\n\n# 为什么以质量\
  \ 95 重新保存 JPEG 时压缩比 < 1？\n\n原始 JPEG 可能已经被高度压缩。大多数从网络下载或由手机/相机拍摄的图像已经以质量和大小之间的最佳权衡保存——通常质量设置在\
  \ 75-85 左右，甚至更低。\n\n当使用 `Image.save()` 保存 PNG 图像时，quality 参数将被忽略，因为 PNG 使用无损压缩。要控制\
  \ PNG 文件大小，请使用 compress_level 参数（0-9）而不是 quality 参数，其中较高的值应用更强的压缩。\n\n# 变形图像\n\n\
  下面的代码片段对图像应用类似波的几何（正弦网格）变形，产生类似波纹的涟漪扭曲效果。它使用 `ImageOps.deform()` 和一个自定义的 `WaveDeformer`\
  \ 类。`transform()` 方法使用正弦函数修改像素坐标，产生水平波纹扭曲。`transform_rectangle()` 方法将此映射应用于矩形图像补丁的四个角，而\
  \ `getmesh()` 将图像划分为矩形网格（gridspace=20），计算其变形后的位置，并返回 `ImageOps.deform()` 所需的网格映射。应用变形会产生平滑、有机的扭曲效果，类似于涟漪、水波或热失真：\n\
  \n```\n```python\nclass WaveDeformer:\n\n    def transform(self, x, y):\n      \
  \  y = y + 20*np.sin(x/15)\n        return x, y\n\n    def transform_rectangle(self,\
  \ x0, y0, x1, y1):\n        return (*self.transform(x0, y0),\n                *self.transform(x0,\
  \ y1),\n                *self.transform(x1, y1),\n                *self.transform(x1,\
  \ y0),\n                )\n\n    def getmesh(self, img):\n        self.w, self.h\
  \ = img.size\n        gridspace = 20\n        target_grid = []\n        for x in\
  \ range(0, self.w, gridspace):\n            for y in range(0, self.h, gridspace):\n\
  \                target_grid.append((x, y, x + gridspace, \\\n                 \
  \                   y + gridspace))\n        source_grid = [self.transform_rectangle(*rect)\
  \ \\\n                       for rect in target_grid]\n        return [(t for t\
  \ in zip(target_grid, source_grid))]\n\nim = Image.open('images/monalisa.jpg')\n\
  im_deformed = ImageOps.deform(im, WaveDeformer())\nplt.imshow(\n    np.hstack((np.array(im),\
  \ np.array(im_deformed)))\n)\nplt.axis('off')\n```\n```\n\n\n\n\n\n### 原始图像与变形图像\n\
  \n如果你运行上述代码片段，你应该会得到类似下图的图形。它会产生一种有机的扭曲效果，使图像看起来弯曲或起伏。\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_143_0.png)\n\
  \n图 3.3 – 原始图像与变形图像\n\n## 给灰度图像着色\n\n下一个代码片段通过将像素强度映射到指定的颜色渐变来为灰度图像着色。`ImageOps.colorize()`\
  \ 方法将黑色像素映射为红色 (255,0,0)，将白色像素映射为黄色 (255,255,127)，为中间色调创建平滑过渡。这有效地模拟了假彩色映射，增强了灰度图像的视觉效果，以便更好地解释：\n\
  \n```python\nim = Image.open('images/sculpture.png').convert('L')\nim_colorized\
  \ = ImageOps.colorize(im, black=(255,0,0), \\\n    white=(255,255,127))\nplt.imshow(np.hstack((color.gray2rgb(np.array(im)),\
  \ \\\n    np.array(im_colorized))))\nplt.axis('off')\nplt.title('The original and\
  \ the colorized image', size=20)\n```\n\n如果你运行上述代码片段，你应该会得到类似下图的图形。\n\n### 原始图像与着色图像\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_143_1.png)\n\n图 3.4 – 原始图像与着色图像\n\n**注意：**\
  \ `ImageOps.colorize()` 期望输入一幅像素值覆盖完整 [0, 255] 范围的灰度图像。如果输入图像已归一化或对比度较低，则生成的着色结果可能显得平淡或缺乏活力。要获得视觉上丰富的着色效果，请考虑在使用\
  \ `ImageOps.colorize()` 之前应用对比度拉伸或重新缩放强度值。\n\n## 通过 LUT 文件更改图像颜色\n\nLUT 是一种预定义的映射，它将输入颜色转换为新的输出颜色，用于色彩分级和图像增强。下一个代码片段使用\
  \ LUT 文件对图像应用色彩分级以更改其颜色。.cube 文件包含预定义的颜色变换（RGB 到 RGB 映射），将输入颜色映射到输出颜色（用于色彩分级）。加载原始图像，并将\
  \ LUT 滤镜应用于图像，根据预定义的映射更改其颜色。\n\n该技术广泛应用于照片编辑和电影制作中，以应用特定的色调，例如电影感外观或情绪增强：\n\n```python\n\
  lut = load_cube_file(\"images/Bourbon 64.cube\")  # NightFromDay.CUBE\nim = Image.open(\"\
  images/sea_beach.jpeg\")\nim_in = np.array(im)\nim_out = np.array(im.filter(lut))\n\
  plt.imshow(np.hstack((im_in[:, :im_in.shape[1]//2], \\\n    im_out[:, :im_out.shape[1]//2])))\n\
  plt.axis('off')\n```\n\n如果你运行上述代码片段，你应该会得到类似下图的图形：\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_144_0.png)\n\
  \n图 3.5 – 使用 LUT 文件更改图像颜色\n\n## 使用 LUT 应用伽马（γ）校正\n\n伽马校正是一种非线性强度变换，用于调整图像亮度，尤其适用于增强暗图像。查找表（LUT）通过预计算输入和输出像素值之间的映射，避免了逐像素计算，从而提供了一种高效的实现方式。\n\
  \n### 使用 PIL\n\n使用 PIL 时，`ImageFilter.Color3DLUT.generate()` 通过一个回调函数创建 3D 颜色 LUT（例如\
  \ 11 × 11 × 11），该回调函数将伽马变换独立应用于 RGB 通道。然后使用 `Image.filter()` 将生成的 LUT 应用于图像，无需显式像素迭代即可实现快速颜色校正：\n\
  \n```python\nγ = 0.4\nimg = Image.open('images/roma.jpg')\nLUT = ImageFilter.Color3DLUT.generate((11,11,11),\
  \ \\\n    lambda r, g, \\\n    b: tuple(min(max(c ** γ, 0), 1) for c in (r, g, b))\n\
  )\nimg_out = img.filter(LUT)\nplt.imshow(np.hstack((np.array(img), np.array(img_out))))\n\
  plt.axis('off')\nplt.title('original and γ-corrected image', size=20)\n```\n\n如果你运行上述代码片段并并排绘制输入/输出图像，你应该会得到类似下图的图形：\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_145_0.png)\n\n*图 3.6 – 使用 PIL 通过 LUT\
  \ 进行伽马校正*\n\n### 使用 opencv-python\n\n使用 OpenCV-Python 时，可以通过 `cv2.LUT()` 实现相同的操作。下面代码中的\
  \ `γ_correct()` 函数首先创建一个包含伽马校正强度值的 256 项查找表，然后将其应用于图像：\n\n```python\ndef γ_correct(img,\
  \ γ):\n    table = [((i / 255) ** γ) * 255 for i in range(256)]\n    table = np.array(table,\
  \ np.uint8)\n    return cv2.LUT(img, table)\n\nimg = np.array(img)\nplt.imshow(np.hstack((img,\
  \ γ_correct(img, γ))))\nplt.axis('off')\n```\n\n如果你运行上述代码片段，你应该会得到下图：\n\n原始图像与 γ\
  \ 校正图像\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_146_0.png)\n\n图 3.7 – 使用 opencv-python\
  \ 通过 LUT 进行伽马校正\n\n比较 opencv-python 与 PIL 的实现，并改变伽马参数以观察其对输出图像的影响。\n\n## 模拟镜头模糊效果\n\
  \n镜头模糊模拟真实相机的景深效果，使失焦区域显得平滑，同时保持所选区域清晰。该实现首先使用 `image.point()` 结合传递函数 `I' = I^p`（例如\
  \ `p = 0.5`）进行伽马校正，以在模糊前增强对比度。然后使用 `ImageFilter.GaussianBlur(radius=5)` 生成模糊效果，该效果近似于失焦镜头行为。模糊强度通过掩码和\
  \ `Image.composite()` 在空间上进行控制，`Image.composite()` 将原始图像和模糊图像混合，在需要的地方保留清晰区域。最后，应用逆伽马校正以恢复亮度，并且可以组合多个模糊层以产生更自然的景深效果。\n\
  \n现在，请参考以下代码片段：\n\n```python\nfrom PIL import ImageFilter\nfrom PIL.ImageChops import\
  \ lighter\n\nimage = Image.open('images/me8.jpg').convert('RGB')\nmask = Image.open('images/mask.png').convert('L')\n\
  p = 0.5\nr = 5\n\ngammaCorrectedImage = image.point(lambda x: x ** p)\nbokeh = gammaCorrectedImage.filter(\
  \ \\\n                         ImageFilter.GaussianBlur(radius=r))\nbokeh = bokeh.point(lambda\
  \ x: x ** (1/p)) # To get back the\n                                          #\
  \ original gamma.\n\nbokeh = Image.composite(image, bokeh, mask)\nblurImage = image.filter(ImageFilter.GaussianBlur(radius=r))\n\
  blurImage = Image.composite(image, blurImage, mask)\nfinalImage = lighter(bokeh,\
  \ blurImage)\nfinalImage.show()\n```\n\n如果你运行上述代码片段，你应该会得到类似下图的图形：\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_147_0.png)\n\
  \n*图 3.8 – 使用 PIL 模拟镜头模糊效果*\n\n在模糊之前使用 $x^p$（$0 < p < 1$）可以提亮阴影区域并改善模糊质量，而之后应用逆变换\
  \ $x^{\\frac{1}{p}}$ 则可近似恢复原始亮度和对比度。\n\n## 交换图像颜色调色板\n\n基于调色板的图像（**P 模式**）将像素值存储为**颜色查找表（CLUT）**的索引，而不是完整的\
  \ RGB 值，从而减少内存和文件大小。下一个代码片段交换两幅图像的 16 色自适应调色板，在保持图像结构的同时重新映射它们的颜色。\n\n首先，使用函数 `convert(\"\
  P\", palette=Image.ADAPTIVE, colors=16)` 将图像转换为 16 色**自适应调色板**，该函数在保持视觉外观的同时执行自适应颜色量化。使用\
  \ `getpalette()` 提取相应的调色板，辅助函数 `plot_palette()` 通过将扁平的 RGB 调色板列表重塑为 `(num_colors,3)`\
  \ 数组并将其显示为色板来可视化这些调色板。然后使用 `putpalette()` 交换调色板，之后使用新调色板保存图像。尽管像素索引和图像结构保持不变，但颜色会根据交换后的调色板重新映射，从而产生视觉冲击力强且富有艺术效果的结果。\n\
  \n请参考以下代码片段：\n\n```python\ndef plot_palette(palette, num_colors=16, title='Palette'):\n\
  \    plt.imshow([np.array(palette[:num_colors*3]).reshape(\\\n                (num_colors,\
  \ 3)) / 255], aspect='auto')\n    plt.show()\n\nimg1, img2 = Image.open('images/parrot.jpg'),\
  \ Image.open('images/lena.jpg')\nimg1_p = img1.convert(\"P\", palette=Image.ADAPTIVE,\
  \ colors=16)\nimg1_p.save('images/parrot_adaptive16_orig.png')\nimg2_p = img2.convert(\"\
  P\", palette=Image.ADAPTIVE, colors=16)\nimg2_p.save('images/lena_adaptive16_orig.png')\n\
  print(os.stat('images/parrot.jpg').st_size,\n      os.stat('images/parrot_adaptive16_orig.png').st_size)\n\
  data = list(img1_p.getdata())\nprint(data[50:70])\nclrs = img1_p.getcolors()\nprint(len(clrs))\n\
  \n# show up colors and palette\npal1 = img1_p.getpalette()\npal2 = img2_p.getpalette()\n\
  plot_palette(pal1, title='Palette of Image 1 before swap')\nplot_palette(pal2, title='Palette\
  \ of Image 2 before swap')\n```\n\n使用上述代码片段显示调色板。你应该会得到类似下图的图形：\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_148_0.png)\n\
  \n*图 3.9 – 交换前图像的调色板*\n\n现在，使用以下代码片段交换调色板：\n\n```python\nimg1_p.putpalette(pal2);\
  \ img2_p.putpalette(pal1)\n```\n\n\n\n如果你运行上述代码片段，应该会得到类似下图的结果：\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_149_0.png)\n\
  \n图3.10 – 使用PIL交换图像的调色板\n\n注意：\n使用 `putpalette()` 时，请确保调色板长度不超过768个值（256种颜色 × 3个通道）。分配更长的调色板可能会引发错误。在处理动态生成或无界调色板时，这一点尤其重要。\n\
  \n## 调整图像的色温\n\n图像的色温指的是图像整体的色调，单位为开尔文（K）。它表示图像的暖度（偏红/偏黄的色调）或冷度（偏蓝的色调）：\n\n- 较低色温（1,000K\
  \ – 4,000K）：偏暖、偏红，例如烛光、日出\n- 中性色温（5,500K）：自然日光\n- 较高色温（6,000K – 10,000K）：偏冷、偏蓝，例如阴天、阴影\n\
  \n例如，烛焰（1900K）是暖色（橙色/黄色），而蓝天（8000K）是冷色。\n\n色温调整是通过基于目标色温偏移的变换来缩放 RGB 通道完成的。\n\n\
  ## 使用 RGB 缩放调整色温\n\n改变图像色温的一种简单方法是根据目标色温缩放红、绿、蓝通道。\n\n对于输入图像 I(x, y) = (R, G, B)，我们使用以下方式调整：\n\
  \n```\nR' = R × α_R, G' = G × α_G, B' = B × α_B\n```\n\n其中 α_R、α_G 和 α_B 是基于开尔文色温的缩放因子。\n\
  \n以下是一个示例：\n\n- **暖色偏移（增加红色，减少蓝色）**：α_R > 1, α_G ≈ 1, α_B < 1\n- **冷色偏移（增加蓝色，减少红色）**：α_R\
  \ < 1, α_G ≈ 1, α_B > 1\n\n## 使用颜色变换矩阵调整色温\n\n一种更精确的调整色温的方法是使用颜色变换矩阵：\n\n```\nM\
  \ = [[α_R, 0, 0, 0], [0, α_G, 0, 0], [0, 0, α_B, 0]]\n```\n\n对图像应用矩阵变换后，我们得到：I'\
  \ = M · I。\n\n这将基于开尔文色温校正因子变换每个 (R, G, B) 像素。\n\n对于 3,000K（暖色偏移），红色保持不变（缩放因子为1.0），绿色降至原始值的70.5%，蓝色降至42%，使图像呈现更暖的效果。\n\
  \n对于 8,000K（冷色偏移），红色降低（0.89）以使图像偏冷，绿色略微调整（0.95），蓝色增强（1.1）以产生更冷的效果。\n\n某色温对应的 RGB\
  \ 值可以在这里找到：http://www.vendian.org/mncharity/dir3/blackbody/。\n\n现在，让我们使用基于开尔文色温的\
  \ RGB 变换来改变图像的色温，参考下面的代码片段。步骤如下：\n\n- 代码使用预定义的 `kelvin_table`，其中包含 RGB 值。\n- 它构造一个颜色变换矩阵。\n\
  - 它使用 PIL 的 `Image.convert()` 方法应用矩阵。\n\n下图可视化了以下代码片段中 `kelvin_table` 提供的不同色温下的\
  \ RGB 色调变化：\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_150_0.png)\n\n图3.11 – 不同色温下的\
  \ RGB 色调变化\n\nPIL 中的 `convert(mode, matrix)` 方法允许使用变换矩阵 M 进行线性颜色变换。它对每个像素的 RGB 值应用线性变换。给定一个输入像素\
  \ (R, G, B)，它将其变换为新的输出像素 (R', G', B')，如下所示：\n\n```\n[R']   [α_R 0 0 0] [R]\n[G']\
  \ = [0 α_G 0 0]·[G]\n[B']   [0 0 α_B 0] [B]\n                     [1]\n```\n\n这个变换独立地应用于图像中的每个像素。它可以用来模拟不同的光照条件（例如烛光、日光或冷荧光灯），因此对于照片颜色校正和艺术效果非常有用。\n\
  \n现在，请参考以下代码片段：\n\n```\nfrom PIL import Image\n\nkelvin_table = {\n    1000: (255,56,0),\n\
  \    1500: (255,109,0),\n    2000: (255,137,18),\n    2500: (255,161,72),\n    3000:\
  \ (255,180,107),\n    3500: (255,196,137),\n    4000: (255,209,163),\n    4500:\
  \ (255,219,186),\n    5000: (255,228,206),\n    5500: (255,236,224),\n    6000:\
  \ (255,243,239),\n    6500: (255,249,253),\n    7000: (245,243,255),\n    7500:\
  \ (235,238,255),\n    8000: (227,233,255),\n    8500: (220,229,255),\n    9000:\
  \ (214,225,255),\n    9500: (208,222,255),\n    10000: (204,219,255)}\n\ndef convert_temp(image,\
  \ temp):\n    r, g, b = kelvin_table[temp]\n    matrix = ( r / 255.0, 0.0, 0.0,\
  \ 0.0,\n               0.0, g / 255.0, 0.0, 0.0,\n               0.0, 0.0, b / 255.0,\
  \ 0.0 )\n    return image.convert('RGB', matrix)\n\nim = Image.open('images/boy.jpg').convert('RGB')\n\
  #print(im.mode)\nplt.figure(figsize=(12,4))\nplt.subplot(141), plt.imshow(im), plt.title('original',\
  \ size=15)\nfor i, k in enumerate([1000, 5000, 10000]):\n    plt.subplot(1,4,i+2),\
  \ plt.imshow(convert_temp(im, k))\n    plt.title(f'{k}K', size=15), plt.axis('off')\n\
  ```\n\n如果你运行上述代码片段，应该会得到类似下图的结果：\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_152_0.png)\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_152_1.png)\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_152_2.png)\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_152_3.png)\n\n图3.12 – 使用PIL改变图像的色温\n\n\
  ## 实现暗角/Lomography效果\n\n暗角是一种图像边缘变暗的视觉效果，会在中心形成自然的聚光效果；而 Lomography 效果则是一种复古、高对比度、高饱和度的外观，常与老式胶片相机联系在一起。\n\
  \n接下来的 Python 演示通过组合暗角、增强饱和度和增强对比度来创建 Lomography 风格的效果。\n\n`apply_vignette()` 函数利用每个像素到图像中心的距离生成径向遮罩：`vignette\
  \ = clip(1 − αd^p, 0, 1)`，其中 alpha 控制暗角强度，p 控制衰减速率。\n\n该遮罩与每个 RGB 通道相乘，使图像边缘变暗，同时保留中心区域。`lomography_effect()`\
  \ 函数使用 `cv2.imread()` 加载图像，通过 `cv2.cvtColor()` 将其转换为 RGB，应用暗角效果，然后使用 `ImageEnhance.Color().enhance(1.3)`\
  \ 增强色彩强度（饱和度增加30%），并使用 `ImageEnhance.Contrast().enhance(1.5)` 增强对比度（对比度增加50%）。最终图像呈现出典型的\
  \ Lomography 外观：边缘更暗、色彩更丰富、对比度更强，从而将注意力吸引到中心主体上。\n\n```\nfrom PIL import ImageEnhance\n\
  \ndef apply_vignette(img, alpha=0.7, p=2.5):\n    rows, cols = img.shape[:2]\n \
  \   x, y = np.meshgrid(np.linspace(-1, 1, cols), \\\n                       np.linspace(-1,\
  \ 1, rows))\n    d = np.sqrt(x**2 + y**2)\n    vignette = 1 - alpha * (d ** p)\n\
  \    vignette = np.clip(vignette, 0, 1).astype(np.float32)\n\n    for i in range(3):\
  \  # Apply to R, G, B channels\n        img[:, :, i] = img[:, :, i] * vignette\n\
  \    return img\n```\n\n```\ndef lomography_effect(img_path):\n    img = cv2.imread(img_path)\n\
  \    img = cv2.cvtColor(img, cv2.COLOR_BGR2RGB)  # Convert to RGB\n\n    # Vignette\
  \ Effect\n    img = apply_vignette(img)\n\n    # Increase Saturation\n    pil_img\
  \ = Image.fromarray(img)\n    enhancer = ImageEnhance.Color(pil_img)\n    img =\
  \ np.array(enhancer.enhance(1.3))  # 30% saturation incr\n\n    # Increase Contrast\n\
  \    enhancer = ImageEnhance.Contrast(Image.fromarray(img))\n    img = np.array(enhancer.enhance(1.5))\
  \  # 50% contrast incr\n\n    return Image.fromarray(img)\n\n# Apply effect and\
  \ display\nlomo_img = lomography_effect(\"images/pyramid.png\")\nlomo_img\n```\n\
  \n如果你运行上述代码片段，应该会得到类似下图的结果：\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_153_0.png)\n\
  \n图3.13 – 使用PIL应用Lomography效果\n\n## 实际应用\n\n暗角和 Lomography 风格效果广泛用于手机摄影应用、复古滤镜以及\
  \ Instagram 等社交媒体平台，以增强视觉叙事能力。这些效果能够吸引观看者对主体的注意力，并营造怀旧或戏剧性的氛围。\n\n\n\n\n\n在机器学习管道中，尤其是在图像分类或对比学习中，此类变换可以作为数据增强技术发挥作用。暗角效果可以引入类似遮挡的变化，提高模型对中心与周边特征重要性的鲁棒性。然而，过度应用可能会妨碍模型，如果它遮挡了关键信息。请根据任务谨慎使用此效果。\n\
  \n> **注意：**\n>\n> 反复在 PIL 和 NumPy 之间转换可能会引入内存和处理开销，尤其是在处理大图像时。为了获得更好的性能，请考虑批处理或以链式方式使用\
  \ PIL 原生操作，以避免不必要的转换。\n\n## 使用 PIL 生成图像\n\nPIL 可用于生成以下类型的图像：\n\n- **曼德博集合：** `effect_mandelbrot()`\
  \ 函数通过将指定的像素网格映射到复平面上的区域来生成曼德博分形图像。该区域由 extent 参数定义，它决定了要可视化的复平面区域。该函数接受的参数如下：\n\
  \  - `size`: 请求的像素大小，2 元组：(width, height)\n  - `extent`: 要覆盖的范围，4 元组：(x0, y0, x1,\
  \ y1)\n  - `quality`: 图像质量\n- **以 (128 x 128) 为中心的大小为 (256 x 256) 的高斯噪声：** 使用 `effect_noise()`\
  \ 函数。它接受的参数如下：\n  - `size`: 请求的像素大小，2 元组：(width, height)\n  - `sigma`: 噪声的标准差\n\
  - **256x256 从上到下从黑到白的线性渐变：** 使用 `linear_gradient()` 函数，接受参数 mode（输入模式）。\n- **256x256\
  \ 从中心到边缘从黑到白的径向渐变：** 使用 `radial_gradient()` 函数，同样接受 mode 参数（输入模式）。\n\n> **提示：**\n\
  >\n> 使用 `linear_gradient` 实现诸如淡入淡出、阴影和 UI 过渡等效果，而 `radial_gradient` 非常适合聚光灯效果、暗角或图像合成和光照模拟中的圆形蒙版。\n\
  \n以下代码片段演示了图像的生成：\n\n```python\nfrom PIL.Image import effect_mandelbrot, effect_noise,\
  \ \\\n                  linear_gradient, radial_gradient\n\nsz = (256, 256)\nplt.figure(figsize=(20,8))\n\
  plt.imshow(np.hstack((\n    effect_mandelbrot(size=sz, \\\n                    \
  \  extent=(-2, 1.5, 1, 1.5), quality=100),\n    effect_noise(size=sz, sigma=5),\n\
  \    linear_gradient(mode='L'),\n    radial_gradient(mode='L'))))\n```\n\n如果运行前面的代码片段，您应该获得类似于以下图示的结果。\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_155_0.png)\n\n*Figure 3.14 – Generating\
  \ images with PIL*\n\n前述效果不仅可用于视觉实验，而且在程序化纹理生成（例如游戏开发、计算机图形学和模拟）、合成数据集（例如机器学习或计算机视觉）以及测试图像处理管道（例如由于已知的数学特性而对算法进行基准测试）中也有实际应用，在这些场景中受控的模式是有益的。\n\
  \n> **洞察：**\n>\n> **曼德博**集合被定义为复数集合，对于该集合，迭代 *sequence*，其中 *c*，不会发散到无穷大（即即使在 *n*\
  \ 时也保持有界）。\n>\n> 这个 Stackoverflow 问题 https://stackoverflow.com/questions/78030547/how-to-make-faster-mandelbrot-set-plot\
  \ 回答了如何从头用 Python 生成该集合。它不仅因其无限复杂性和自相似性而在视觉上令人着迷，而且还是分形几何中的基本构造，常用于说明混沌理论和复数动力学。\n\
  \n在探索了 Python PIL 库的图像处理多样化功能之后——从转换图像质量到应用艺术效果——我们解锁了广泛的创造可能性。但旅程还未结束！在下一节中，我们将深入\
  \ opencv-python 的图像处理世界，在那里有一套新的工具和技术等待着将我们的想象力推向更远。\n\n## 使用 opencv-python 进行图像处理\n\
  \n如前所述，opencv-python 是 Python 编程语言中用于图像处理和计算机视觉任务的强大且广泛使用的库。以其简洁性和效率而闻名，opencv-python\
  \ 使开发人员能够执行各种图像处理操作，从基本变换到高级计算机视觉应用。在本节中，您将学习如何使用库函数实现一些图像处理任务。\n\n## 旋转\n\nOpenCV\
  \ 提供了通过仿射变换高效执行图像旋转的功能。在以下 Python 演示中，输入图像围绕其中心逆时针和顺时针旋转 45°。图像首先使用 cv2.imread()\
  \ 加载，并使用 cv2.cvtColor() 从 OpenCV 默认的 BGR 颜色格式转换为 RGB 以便正确可视化。\n\n旋转矩阵使用 cv2.getRotationMatrix2D(center,\
  \ angle, scale) 计算，其中 center 指定枢轴点 x,y，angle 是旋转角度，单位为度（正值为逆时针旋转，负值为顺时针旋转），scale\
  \ 控制图像缩放（设为 1 表示不缩放）。内部，该函数返回 2 × 3 仿射变换矩阵：\n\n$$M = \\begin{bmatrix} \\alpha &\
  \ \\beta & (1-\\alpha)c_x - \\beta c_y \\\\ -\\beta & \\alpha & \\beta c_x + (1-\\\
  alpha)c_y \\end{bmatrix}$$\n\n其中 $c_x, c_y$ 是旋转中心的坐标，$\\alpha = \\cos\\theta$，$\\\
  beta = \\sin\\theta$，$s$ 是缩放因子，$\\theta$ 是旋转角度。\n\n然后使用 cv2.warpAffine(src, M, dsize)\
  \ 应用变换，其中 src 是输入图像，M 是 2 × 3 仿射变换矩阵，dsize=(width, height) 指定输出图像尺寸。附加可选参数包括插值标志（例如\
  \ INTER_NEAREST、INTER_LINEAR、INTER_CUBIC）、用于处理图像边界外像素的 borderMode（例如 BORDER_CONSTANT、BORDER_REPLICATE、BORDER_REFLECT）以及在常数边框时指定填充颜色的\
  \ borderValue。生成的图像展示了使用仿射扭曲围绕图像中心进行顺时针和逆时针旋转。\n\n```python\nimage = cv2.cvtColor(cv2.imread('images/fruits.png'),\
  \ cv2.COLOR_BGR2RGB)\nrotation_angle = 45\nrows, cols = image.shape[:2]\nrotation_matrix\
  \ = cv2.getRotationMatrix2D((cols / 2, rows / 2), \\\n    rotation_angle, 1)\nrotated_image_anticlockwise\
  \ = cv2.warpAffine(image, \\\n    rotation_matrix, (cols, rows))\n```\n\n```python\n\
  rotation_matrix = cv2.getRotationMatrix2D((cols / 2, rows / 2), \\\n    -rotation_angle,\
  \ 1)\nrotated_image_clockwise = cv2.warpAffine(image, rotation_matrix, \\\n    (cols,\
  \ rows))\nplot_images([image, rotated_image_anticlockwise, \\\n            rotated_image_clockwise],\
  \ \\\n    ['original', 'rotated counterclockwise', 'rotated clockwise'])\n```\n\n\
  如果运行前面的代码片段，您应该获得类似于以下内容的结果：\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_157_0.png)\n\
  \nFigure 3.15 – Rotating an image with opencv-python\n\n## 避免旋转图像时裁剪\n\n在使用 cv2.getRotationMatrix2D()\
  \ 和 cv2.warpAffine() 旋转图像时，默认输出画布大小通常保持与原始图像相同。这可能导致旋转图像的部分被裁剪，尤其是在较大旋转角度时。\n\n\
  为了防止裁剪，请考虑以下最佳实践：\n\n- 计算新的画布大小，使其完全包含整个旋转后的图像，同时考虑旋转引起的宽度和高度变化\n- 调整旋转矩阵的平移分量，使图像在放大的画布中居中\n\
  - 在调用 cv2.warpAffine() 时使用更新后的旋转矩阵和新的画布大小\n\n这种方法可保留旋转后图像的所有内容，避免不必要的裁剪。如果您并排可视化有裁剪和无裁剪的旋转图像以及原始图像，您应该获得类似于以下内容的结果。\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_157_1.png)\n\nFigure 3.16 – Rotating\
  \ an image with or without crop using opencv-python\n\n\n\n\n\n## 翻转\n\n图像翻转是一种几何变换，它使用\
  \ `cv2.flip()` 沿某个轴反转像素位置。该函数接受输入图像和一个 `flipCode` 参数，该参数指定翻转方向：`flipCode=0` 垂直翻转图像（上\
  \ ↔ 下），`flipCode=1` 水平翻转图像（左 ↔ 右），`flipCode=-1` 同时应用两种翻转，等效于 180° 旋转。下面的示例演示了全部三种翻转操作，并与原始图像进行比较：\n\
  \n```\nim = cv2.cvtColor(cv2.imread('images/parrot.png'),\n                  cv2.COLOR_BGR2RGB)\n\
  plt.imshow(np.hstack((im,\n                      cv2.flip(im, flipCode=0), # Flip\
  \ Image Vertically\n                      cv2.flip(im, flipCode=1), # Flip Image\
  \ Horizontally\n                      # Flip Image Vertically and Horizontally\n\
  \                      cv2.flip(im, flipCode=-1))))\n```\n\n如果你运行上面的代码片段，应该会得到类似下图的结果：\n\
