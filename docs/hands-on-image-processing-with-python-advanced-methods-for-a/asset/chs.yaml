  \n## Image manipulations with Pilgram\n\nPilgram filters work by adjusting colors,\
  \ contrast, brightness, and other properties. They work by manipulating pixel values\
  \ using mathematical transformations, such as convolution, color mapping, and blending.\n\
  \nMathematically, a filter can be expressed as a function, F, applied to an image\
  \ matrix, I' = F(I), where we have the following:\n\n- I is the original image represented\
  \ as a matrix of pixel values\n- F is the transformation function (filter effect)\n\
  - I' is the resulting filtered image\n\n\n\n\n\n如我们之前所见，滤镜使用数学变换修改像素值，例如颜色映射、伽马校正和卷积。滤镜通常涉及以下内容：\n\
  \n- **颜色变换：** 使用变换矩阵调整 RGB 值：\n\n$$\n\\begin{bmatrix}R'\\\\G'\\\\B'\\end{bmatrix}=M\\\
  times\\begin{bmatrix}R\\\\G\\\\B\\end{bmatrix}+B\n$$\n\n这里，$M$ 是变换矩阵，$B$ 是偏置向量。\n\
  \n- **伽马校正：** 使用 $I' = I^\\gamma$ 调整亮度，其中 $\\gamma$ 控制亮度。\n\n- **卷积滤镜：** 应用核 $K$\
  \ 来增强特征：\n\n$$\nI'(x,y)=\\sum_{i=-k}^{k}\\sum_{j=-k}^{k}I(x-i,y-j)K(i,j)\n$$\n\n\
  这里，$K$ 是滤波器核，例如高斯模糊或锐化。\n\n以下 Python 代码片段将 Pilgram 库中的多个 Instagram 风格滤镜应用于图像并以网格形式显示。以下是关键步骤：\n\
  \n1. `getmembers(pilgram, isfunction)` 函数检索 Pilgram 库中可用的所有滤镜函数。\n2. 莫奈丽莎图像从磁盘加载，然后每个滤镜函数都应用于此（原始）图像\
  \ im，并将生成的图像存储在名为 effects 的字典中，以滤镜名称作为键。\n3. 原始图像以及经过滤波的图像（以及作为标题的已应用滤镜名称）通过遍历 effects\
  \ 字典，使用 Matplotlib 以网格形式显示。\n\n现在，参考以下代码片段：\n\n```\n# !pip install pilgram\nimport\
