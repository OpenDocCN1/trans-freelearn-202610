  \n*Figure 3.28 – Applying sketch, solarize, and fx_filter with Wand*\n\n## Distorting\
  \ and undistorting images\n\nImage distortion commonly arises from lens effects,\
  \ with radial distortion causing straight lines to appear curved. Distortion can\
  \ be modeled mathematically (e.g., with the Brown–Conrady model) using radial and\
  \ tangential distortion coefficients. Distortion is applied by mapping original\
  \ pixel coordinates to distorted coordinates, while undistortion reverses this process\
  \ using known distortion parameters, typically obtained through camera calibration\
  \ (e.g., using checkerboard images). Libraries such as OpenCV and Wand provide tools\
  \ for distortion correction.\n\nThe next code snippet uses Wand's `Image.distort()`\
  \ method to simulate several geometric distortions:\n\n- `distort('barrel', ...)`:\
  \ Applies radial barrel distortion, causing straight lines to bulge outward.\n-\
  \ `distort('polar', ...)`: Transforms the image between Cartesian and polar coordinate\
  \ systems, producing a radial warping effect.\n- `distort('arc', (ArcAngle, RotateAngle))`:\
  \ Bends the image along a curved arc.\n- `distort('shepards', ...)`: Applies Shepard's\
  \ (Inverse Distance Weighting) distortion, where pixel positions are warped using\
  \ distance-based interpolation weights.\n\nAdditional settings such as `virtual_pixel='transparent'`,\
  \ `artifacts['distort:viewport']`, and `artifacts['shepards:power']` control boundary\
  \ handling and distortion behavior. The resulting images demonstrate various geometric\
  \ warping effects, including bulging, radial, arched, and spatially interpolated\
  \ deformations.\n\n```python\nwith ImageW(filename='images/house.png') as im:\n\
  \    w, h = im.size\n    im.virtual_pixel = 'transparent'  # 'black'\n    im_out_barrel\
  \ = im.clone()\n    im_out_barrel.distort('barrel', (0.2, 0.0, 0.0, 1.0))\n    im_out_barrel.save(filename='images/house_distorted.png')\n\
  ```\n\nIf you run the preceding code snippet, you should obtain something similar\
  \ to the following figure:\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_177_0.png)\n\
