  \ 进行多模型分割与集成学习*\n\n上述讨论的集成方法整合了多个语义分割模型的预测，以提高逐像素的类别准确率。然而，它们本质上仍局限于为每个像素分配单一类别标签，并且无法区分同一类别中的不同对象实例。这一局限性促使人们转向实例感知分割，其目标不仅是对像素进行分类，还要区分并定位场景中的单个对象实例。\n\
  \n## 实例分割\n\n在语义分割（每个像素被分配一个类别标签）之后，实例分割更进一步，区分同一类别中的*单个对象实例*。例如，语义分割将属于“猫”的所有像素标记为一个类别，而实例分割\n\
  \n则为每只猫分配单独的分割掩码。形式上，给定图像 $I \\in \\mathbb{R}^{H\\times W\\times 3}$，实例分割旨在预测一个集合：\n\
  \n$$y = \\{(M_i, c_i, b_i)\\}_{i=1}^{N},$$\n\n其中 $M_i \\in \\{0,1\\}^{H\\times W}$：实例\
  \ $i$ 的二元掩码，$c_i \\in \\{1,\\ldots,C\\}$：类别标签，$b_i \\in \\mathbb{R}^4$：边界框。\n\n\
  ## Mask R-CNN：两阶段实例分割框架\n\n随着何恺明等人（2017）提出 **Mask R-CNN**，实例分割得到了显著发展。Mask R-CNN\
  \ 通过添加一个用于预测分割掩码的并行分支，扩展了 **Faster R-CNN**。\n\nMask R-CNN 由三个主要组件组成：\n\n- **骨干网络：**\
  \ 深度 CNN（例如 ResNet-50 + FPN）提取特征图：\n\n  $$F = \\phi(I),$$\n\n  其中 $\\phi$ 是骨干函数。\n\
  \n- **区域提议网络（RPN）：** 生成候选对象区域（锚框）：\n\n  $$\\mathcal{R} = \\{r_i\\}_{i=1}^{K}$$\n\
  \n  每个区域都具有物体性得分和边界框细化。\n\n- **ROI 头（多任务学习）：** 对于每个提议区域，**分类头**预测类别 $c_i$，**边界框回归器**细化\
  \ $b_i$，**掩码头**预测二元掩码 $M_i$。Mask R-CNN 优化一个**多任务损失**：\n\n  $$\\mathcal{L} = \\mathcal{L}_{cls}\
  \ + \\mathcal{L}_{box} + \\mathcal{L}_{mask}$$\n\nMask R-CNN 的总体训练目标被表述为一个*多任务损失*，它联合监督分类、边界框回归和掩码预测，并使用一种关键的对齐机制来实现精确的区域特征提取。各个组成部分定义如下：\n\
  \n- **分类损失：**\n\n  $$\\mathcal{L}_{cls} = -\\log p_{c^*},$$\n\n  其中 $c^*$ 是真实类别。\n\
  \n- **边界框损失：**\n\n  $$\\mathcal{L}_{box} = \\sum_{i\\in x,y,w,h} \\operatorname{SmoothL1}(t_i\
  \ - t_i^*),$$\n\n  其中 **Smooth $L_1$** 损失是标准 $L_2$ 损失的稳健替代。当误差较小时，其行为类似于 L2 损失（二次）；当误差较大时，类似于\
  \ L1 损失（线性）。\n\n- **掩码损失：** 与分类不同，掩码预测是逐像素的**二元分类**：\n\n  $$\\mathcal{L}_{mask}\
  \ = \\frac{1}{m^2}\\sum_{u,v}[y_{uv}\\log \\hat{y}_{uv} + (1-y_{uv})\\log(1-\\hat{y}_{uv})].$$\n\
  \n其中 $y_{uv}$：真实掩码，$\\hat{y}_{uv}$：预测掩码，$m \\times m$：掩码分辨率（通常为 28×28）。\n\n- **ROIAlign：**\
  \ Mask R-CNN 用 **ROIAlign** 替换 ROI Pooling，消除了量化误差：\n\n$$F_{aligned}(x, y) = \\\
  sum_{i,j} w_{ij}\\,F(x_i, y_j)$$\n\n这种双线性插值确保了**像素级对齐**，这对精确掩码至关重要。\n\n> **注意**\n\
  > \n> 边界框回归是学习将粗略的对象提议细化为准确对象位置的过程，通过预测相对于初始锚框或区域提议的连续坐标偏移 $(\\Delta x, \\Delta\
  \ y, \\Delta w, \\Delta h)$ 来实现。直观地说，模型不是直接猜测边界框，而是“微调”一个粗糙的框，使其紧密贴合对象，从而提高目标检测中的定位精度。\n\
  \n下面的代码片段（完整代码请参阅 GitHub）演示了通过 torchvision 使用带有 ResNet-50 + 特征金字塔网络（FPN）主干的 Mask\
  \ R-CNN 进行实例分割。`models.detection.maskrcnn_resnet50_fpn()` 在 COCO 数据集上预训练。该模型为检测到的对象预测边界框、类别标签和分割掩码。网络在可用时自动使用\
  \ GPU，而 `eval()` 会禁用训练专用层。输入图像被转换为形状为 $\\mathbb{R}^{3\\times H\\times W}$ 的张量，`unsqueeze(0)`\
  \ 添加批量维度 $\\mathbb{R}^{1\\times 3\\times H\\times W}$。在推理期间，模型输出包含 \"boxes\"、\"\
  labels\"、\"scores\" 和 \"masks\" 的字典。低置信度检测被过滤掉，软掩码 $M_i \\in [0,1]^{H\\times W}$\
  \ 使用 $\\hat{y}_{uv} > 0.3$ 阈值化为二元掩码。为每个实例分配不同颜色以进行视觉区分，并使用 alpha 混合生成 RGB 叠加图像：\n\
  \n$$I_{overlay} = \\alpha M + (1 - \\alpha) I$$\n\n最终可视化并排显示原始图像、预测掩码和分割叠加效果。\n\n\
  ```\nmodel = torchvision.models.detection.maskrcnn_resnet50_fpn(weights=\"DEFAULT\"\
  )\nmodel.eval()\nimage = Image.open('images/cats_dogs.jpg').convert(\"RGB\")\nimg_tensor\
  \ = transforms.ToTensor()(image).unsqueeze(0).to(device)\nwith torch.no_grad():\
  \ outputs = model(img_tensor)\nscores, masks = outputs[0]['scores'], outputs[0]['masks']\n\
  labels = outputs[0]['labels']\nkeep = scores > 0.7\nmasks = masks[keep].cpu().numpy()\n\
  h, w = masks.shape[-2:]\ncombined_mask = np.zeros((h, w, 3)) # RGB canvas\ncmap\
  \ = plt.get_cmap('gist_rainbow')\nfor i, m in enumerate(masks):\n```\n\n\n\n```\n\
  mask_binary = m.squeeze() > 0.3  # Threshold the soft mask\ncolor = np.array(cmap(1\
  \ / len(masks))[:, :3])  # Get vibrant RGB\ncombined_mask[mask_binary] = color\n\
  # Plot image, combined_mask and the overlay here\n```\n\n如果你运行上述代码并绘制图像，你应该会得到类似下图的结果：\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_528_0.png)\n\nMask R-CNN 能够分别检测同一类别的多个对象。它能生成像素级精确的分割掩码。即使在杂乱场景中也能很好地工作。\n\
  \n- **为什么 Mask R-CNN 表现出色？** 它将分类和掩码预测解耦，避免了任务之间的竞争。它通过 ROIAlign 保持空间精度。由于共享主干网络，它非常高效。\n\
  - **Mask R-CNN 的局限性：** 两阶段 → 相对较慢，内存占用大，不适合实时应用。\n\n## YOLO（YOLOv8 / YOLOv11）：单阶段公式化\n\
  \n现代实例分割架构，如 **基于 YOLO 的分割模型**，采用 **单阶段公式化方案，能够实现实时推理**，同时保持有竞争力的精度。在本节中，我们将使用 **Ultralytics\
  \ YOLO11 分割模型** 探索 **基于 YOLO 的实例分割**，并研究其理论基础和实际实现。随后，我们将把它的设计选择和性能特征与 **经典的两阶段\
  \ Mask R-CNN 架构** 进行对比。\n\n- **从检测到分割：YOLO 的视角：** 由 Joseph Redmon 提出的传统 YOLO（You\
  \ Only Look Once）最初是为目标检测设计的：\n\n  $$f_{\\theta}(I) \\rightarrow \\{(b_i, c_i, s_i)\\\
  }_{i=1}^{N},$$\n\n  其中 $b_i$：边界框，$c_i$：类别，$s_i$：置信度。\n\n- **扩展到实例分割：** YOLO 分割模型将此公式扩展为包含像素级掩码：\n\
  \n  $$f_{\\theta}(I) \\rightarrow \\{(b_i, c_i, s_i, M_i)\\}_{i=1}^{N},$$\n\n  其中\
  \ $M_i \\in [0,1]^{H\\times W}$ 是预测掩码。\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_530_0.png)\n\
  \n*图 10.26 – 使用第 11 代 Nano 版本的 YOLO 分割模型进行实例分割*\n\n**为什么 YOLO 速度快？** YOLO 避免了 **区域提议网络（RPN）**\
  \ 和逐 ROI 计算。相反，它执行：\n\n单次前向传播 ⇒ 所有预测\n\n这使得每张图像的推理复杂度为 O(1)，并且 GPU 利用率高度优化。\n\n\
  **实际观察：** 掩码精度可能略低于 Mask R-CNN，但非常适合实时应用（自动驾驶、视频分析、监控）。与 Mask R-CNN 不同，YOLO **不直接预测全分辨率掩码**。相反，它使用低秩掩码近似。这降低了计算复杂度：\n\
  \nO(HW) → O(K + HW)，其中 K ≪ HW。\n\n基于 YOLO 的实例分割代表了向统一架构、实时性能和可扩展部署的重大转变。与 Mask R-CNN\
  \ 一起，它完善了实例分割技术的完整谱系，其中 Mask R-CNN → **注重精度**，YOLO → **注重速度**。实例分割通过提供对象级理解和像素级精度，弥合了检测与分割之间的差距。\n\
  \nMask R-CNN 因其优雅的公式化和强大的性能而仍然是一种基础方法，而现代基于 YOLO 的方法则朝着实时应用的方向推进。\n\n## 基于 Transformer\
  \ 的分割\n\nTransformer 架构通过用 **全局自注意力机制** 取代卷积归纳偏置，从根本上重塑了图像分割。与依赖局部感受野的基于 CNN 的分割不同，基于\
  \ Transformer 的模型显式建模 **长程依赖关系**，从而实现更卓越的场景理解。\n\n给定输入图像 \\(I \\in \\mathbb{R}^{H\\\
  times W\\times 3}\\)，基于 Transformer 的分割模型旨在学习一个映射：\n\n$$f_\\theta: I \\to \\mathcal{Y},\\\
  quad y \\in \\mathbb{Z}^{H\\times W}$$\n\n其中每个像素都被分配一个语义或实例标签。所有 Transformer 模型的核心是\
  \ **缩放点积注意力**：\n\n$$\\operatorname{Attention}(Q,K,V)=\\operatorname{softmax}\\left(\\\
  frac{QK^T}{\\sqrt{d_k}}\\right)V,$$\n\n其中 $Q=XW_Q$：查询（我们正在寻找的内容），$K=XW_K$：键（存在的内容），$V=XW_V$：值（要聚合的信息）。**基于\
  \ Transformer 的模型代表了图像分割的根本性转变——从局部卷积推理转向通过注意力进行全局上下文建模。** 这一范式源于 Ashish Vaswani\
  \ 等人（2017 年）的开创性工作《Attention Is All You Need》，并由 Alexey Dosovitskiy 等人（2021 年）扩展到视觉领域。\n\
  \n### 数学基础：自注意力与令牌化图像表示\n\nDPT、DETR、**SegFormer** 和 Mask2Former 等基于 Transformer\
  \ 的分割模型共享统一的理论框架，该框架根植于《Attention Is All You Need》中引入的 Transformer 范式，并在 **视觉 Transformer（ViT）**\
  \ 中扩展到视觉领域。\n\n虽然 **SETR** 等早期工作证明了 *纯 ViT* 可用于密集预测，但现代架构（**DPT、SegFormer、Mask2Former**）通过解决其在空间分辨率和效率方面的局限性，显著改进了这一基线。本节将建立理解这些模型所需的数学和概念基础。\n\
  \n**密集预测：** 语义分割被定义为一种密集映射：\n\n$$S:\\Omega\\subset\\mathbb{R}^2\\to\\mathcal{C},$$\n\
  \n其中 $\\Omega$ 是图像域，$\\mathcal{C}$ 是语义类别的集合。目标是为每个像素分配一个标签，这需要全局推理（场景级理解）和局部精度（精细边界）。\n\
  \n**从图像到令牌：Patch 嵌入：** 设输入图像为：\n\n$$I\\in\\mathbb{R}^{H\\times W\\times 3}$$\n\n\
  Patch 嵌入的关键步骤如下：\n\n- **Patch 划分：** 图像被划分为大小为 $P\\times P$ 的不重叠 patch：$N=\\frac{HW}{P^2}$。每个\
  \ patch 被展平：\n\n  $$x_i\\in\\mathbb{R}^{P^2C}.$$\n\n- **线性投影（Patch 嵌入）：** 每个 patch\
  \ 被投影到一个潜在空间：\n\n  $$z_i=Ex_i+b,\\quad E\\in\\mathbb{R}^{D\\times P^2C}\\text{ 且\
  \ }z_i\\in\\mathbb{R}^{D}.$$\n\n  堆叠所有令牌：\n\n  $$Z_0=[z_1,\\ldots,z_N]\\in\\mathbb{R}^{N\\\
  times D}$$\n\n- **等效卷积视角：** 这等价于 Conv2D($P,P$)，在数学上与每个 patch 的线性投影完全相同，这揭示了 Transformer\
  \ 首先将图像转换为令牌序列：Patch → 令牌，图像 → 序列，Transformer → 全局推理引擎。与局部操作的 CNN（依赖卷积归纳偏置：局部性和平移等变性）不同，Transformer\
  \ 允许所有 patch 直接交互（通过全局上下文建模）。\n\n- **位置编码：** Transformer 缺乏固有的空间感知能力；为了使其具有置换不变性，需要注入位置信息：\n\
  \n  $$Z_0 \\leftarrow Z_0 + E_{pos},\\quad E_{pos} \\in \\mathbb{R}^{N\\times D}$$\n\
  \n  设计选择各不相同：例如，*ViT* / *DPT* 使用 *可学习的嵌入*，*Swin* 使用 *相对位置偏置*，而 *SegFormer* 则移除了显式的\
  \ *位置编码*。位置告诉模型：“这个 patch 在图像中的什么位置？”没有它，空间结构就会丢失。没有位置编码，**左上角**的像素与**右下角**的像素将无法区分。位置编码恢复了\
  \ **几何信息**，从而能够理解对象边界、空间关系和场景布局。\n\n- **自注意力（核心机制）：** 基本操作是：\n\n  $$\\operatorname{Attention}(Q,K,V)=\\\
  operatorname{softmax}\\left(\\frac{QK^T}{\\sqrt{d_k}}\\right)V$$\n\n  这个方程告诉我们：每个令牌决定它应该对其他每个令牌“*关注*”多少。把每个令牌想象成图像的一个\
  \ patch。\n\n  从 $Z \\in \\mathbb{R}^{N\\times D}$ 出发，我们计算：\n\n  $$Q=ZW_Q,\\quad\
  \ K=ZW_K,\\quad V=ZW_V.$$\n\n  下表解释了 Q、K 和 V 的含义：\n\n  | 符号 | 含义 | 直觉理解 |\n  |---|---|---|\n\
  \  | Q（查询） | “我在寻找什么？” | 每个令牌提出一个问题 |\n  | K（键） | “我包含什么？” | 每个令牌描述自身 |\n  | V（值）\
  \ | “我提供什么信息？” | 实际内容 |\n\n  *表 10.2：Transformer 中的查询-键-值*\n\n这实现了全局交互，每个 patch\
  \ 查询所有其他 patch，度量相似度并聚合相关信息。因此，每个像素都能“看到”整个图像。这可以看作是像素之间的对话：每个 patch 提出一个问题（**查询**），与所有其他\
  \ patch 进行比较（**键**），并收集相关信息（**值**）。这使得 **上下文感知分割** 成为可能，这与依赖局部邻域的 CNN 不同。\n\n下图展示了\
  \ **缩放点积注意力机制**，其中输入令牌被转换为 **查询（Q）、键（K）和值（V）** 向量。它展示了相似度分数 $(QK^T)$ 如何被计算、缩放、通过\
  \ softmax 归一化，并用于生成 **值的加权和**，从而使每个令牌能够关注输入中最相关的部分。\n\n\n\n- **3. 第二次归一化：**  \n\
  \  $\\hat{Z}_l = \\operatorname{LayerNorm}(Z'_l)$，  \n  这为非线性变换准备了特征。\n\n- **4.\
  \ 前馈网络（FFN）+ 残差连接：**  \n  $\\operatorname{FFN}(x) = W_2\\sigma(W_1x)$，  \n  $Z_{l+1}\
  \ = Z'_l + \\operatorname{FFN}(\\hat{Z}_l)$\n\nFFN 独立作用于每个 token。它引入了非线性和特征变换。完整的\
  \ Transformer 层可以总结为：\n\n*层 = 归一化 → 注意力 → 残差 → 归一化 → FFN → 残差*\n\n下图（完整 Transformer\
  \ 层示意图）展示了这一流程，其中：\n\n- **输入 tokens** $Z_l$（patch 嵌入）进入该层\n- **自注意力** 允许每个 token\
  \ 在整个图像上进行全局关注 → 实现**上下文聚合和长距离依赖**。\n- **残差连接** 确保训练稳定并保留原始信息。\n- **层归一化** 提高收敛性和数值稳定性\n\
  - **FFN（MLP）** 独立地细化每个 token 位置的特征\n\n**输出：** $Z_{l+1}$ 是输入 tokens 的**上下文感知、全局增强表示**。\n\
  \n在堆叠 $L$ 个这样的层之后：$Z_0 \\rightarrow Z_1 \\rightarrow \\cdots \\rightarrow Z_L$，最终表示\
  \ $Z_L$ 用于下游任务，如**语义分割**，在此过程中它被重塑并解码为逐像素预测。\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_534_0.png)\n\
  \n*图 10.28 – Transformer 块架构*\n\n**计算复杂度：** $QK^T \\in \\mathbb{R}^{N\\times N}$。因此，时间：$\\\
  mathcal{O}(N^2 d)$，内存：$\\mathcal{O}(N^2)$，所以高分辨率图像 $\\rightarrow$ 较大的 $N$ $\\rightarrow$\
  \ 昂贵的计算。这推动了分层 Transformer（**SegFormer**）、高效解码器（**DPT**）和基于查询的方法（**DETR**、**Mask2Former**）的发展。\n\
  \n**从 Tokens 到稠密预测：用于分割的解码器头：** 编码后：\n\n$Z_L \\in \\mathbb{R}^{N\\times D}$，\n\n\
  将其重塑为：\n\n$Z_L \\rightarrow \\mathbb{R}^{H/P \\times W/P \\times D}$，\n\n不同的架构以不同方式将\
  \ tokens 映射到像素预测（不同的分割模型采用不同的解码器策略）。\n\n## 纯 ViT 稠密预测 — SETR\n\n诸如 SEgmentation\
  \ TRansformer（**SETR**）之类的早期工作表明，tokens 可以直接映射到分割：$\\hat{Y} = \\text{Upsample}(W\
  \ Z_L)$，无需层级结构且解码器极简。**SETR** 将图像视为**patch 序列**，并使用**无卷积的 Transformer 编码器**执行**逐像素分割**。它是一个**纯\
  \ ViT + 线性解码器**模型：使用纯 ViT 编码器，将 tokens 重塑为空间网格，应用 *1x1 卷积*和*双线性上采样*到全分辨率。这等价于对每个\
  \ token 进行分类，然后进行插值。\n\n**局限性：** 空间细节较差，边界定位较弱，计算成本高。这促使人们研究更先进的架构。\n\n## 使用 DPT\
  \ 进行多尺度特征融合\n\n**稠密预测 Transformer（DPT）** 是一种针对分割和深度估计等稠密预测任务调整的*纯视觉 Transformer（ViT）*架构。与标准\
  \ ViT 不同，DPT 引入了**多尺度特征融合**，将 tokens 投影回空间网格。关键洞察如下：全局注意力 $\\rightarrow$ 捕获**场景上下文**，多尺度融合\
  \ $\\rightarrow$ 恢复**精细空间细节**。**DPT** 从多个层中提取特征：\n\n$F = \\text{Fusion}(F_1, F_2,\
  \ F_3, F_4), \\quad \\hat{Y} = \\text{Upsample}(F)$\n\n其中浅层 $\\rightarrow$ 细粒度细节，深层\
  \ $\\rightarrow$ 语义信息，融合 $\\rightarrow$ 精确分割。\n\n下一个代码片段从 Hugging Face 加载一个预训练的\
  \ DPT 模型，处理输入图像，并通过预测每个像素的类别标签来执行**语义分割**。预测的 logits 被调整到原始图像分辨率，转换为分割图，然后着色并与原始图像混合，以并排方式可视化分割结果。\n\
  \n方法 `DPTForSemanticSegmentation.from_pretrained()` 使用 **ViT-Large 骨干网络**，并输出 logits：\n\
  \n$\\mathbf{L} \\in \\mathbb{R}^{C \\times H' \\times W'}$\n\n**上采样：** 函数 `torch.nn.functional.interpolate()`\
  \ 执行：\n\n$\\hat{Y}(x,y) = \\arg\\max_c L_c(x,y)$\n\n现在请参考下一个代码片段：\n\n```python\n\
  from transformers import DPTImageProcessor, DPTForSemanticSegmentation\n\nmodel_id\
  \ = \"Intel/dpt-large-ade\"\nprocessor = DPTImageProcessor.from_pretrained(model_id)\n\
  model = DPTForSemanticSegmentation.from_pretrained(model_id).to(device)\nimage =\
  \ Image.open(\"images/men_beach2.jpg\").convert(\"RGB\")\ninputs = processor(images=image,\
  \ return_tensors=\"pt\").to(device)\nwith torch.no_grad(): outputs = model(**inputs)\n\
  logits = outputs.logits\nprediction = torch.nn.functional.interpolate(\n    logits,\
  \ size=image.size[::-1], mode=\"bilinear\", align_corners=False)\nseg_map = prediction.argmax(1).squeeze().cpu().numpy()\n\
  seg_color = get_vibrant_mask(seg_map)  # refer github for the function\noverlay\
  \ = (np.array(image) * 0.5 + seg_color * 0.5).astype(np.uint8)\n# Plot image_np,\
  \ seg_color and overlay side-by-side here\n```\n\n如果你运行上述代码，应该会得到类似下图的结果：\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_536_0.png)\n\
  \n*图 10.29 – 使用预训练 DPT（ViT）进行语义分割*\n\n**为什么需要插值：** Transformer 在 patch 网格上操作 → 分辨率降低\
  \ → 必须恢复原始尺寸。\n\n## 基于查询的 DETR 预测\n\n**DETR**（DEtection TRansformer，检测 Transformer）将图像视为*一组待发现的对象*，而不是像素网格。它使用固定数量的可学习对象查询——可以将它们视为“槽位”，询问：*“有属于我的对象吗？”*——每个查询直接预测一个**类别标签、边界框和掩码**。该模型不是对像素进行标记，而是询问：*“存在哪些对象？”*\n\
  \n在训练期间，**匈牙利匹配** 将每个预测查询分配给一个真实对象（一对一），因此模型学会生成**唯一、不重叠的检测结果**，而无需 NMS 之类的后处理。对于**全景分割**，DETR\
  \ 简单地将这些对象预测（things）与背景区域（stuff）结合起来，形成完整的**场景理解**。\n\nDETR 引入了对象查询：\n\n$Attention(Q_o,\
  \ Z_L, Z_L)$\n\n每个查询预测**对象类别**和**掩码/区域**。**DETR** 将分割重新表述为**集合预测问题**。给定对象查询 Q，DETR\
  \ 预测：\n\n$\\hat{Y} = \\{(c_i, b_i, m_i)\\}_{i=1}^N$\n\n其中 $c_i$：类别标签，$b_i$：边界框，$m_i$：掩码。训练使用：\n\
  \n- **匈牙利匹配：**  \n  $\\mathcal{L} = \\sum_{i=1}^N \\mathcal{L}_{\\mathrm{match}}(y_i,\
  \ \\hat{y}_{\\sigma(i)})$\n\n- **全景分割：** DETR 扩展到全景分割：  \n  $\\text{Panoptic} =\
  \ \\text{Things} \\cup \\text{Stuff}$\n\n下一个代码片段加载一个预训练的 **DETR 全景分割模型**（它使用函数 DetrForSegmentation.from_pretrained()\
  \ 加载预训练模型 **facebook/detr-resnet-50-panoptic**），并将其应用于输入图像，以在单次前向传播中**同时分割对象（things）和背景区域（stuff）**。它预处理图像、运行推理、将预测的分割图转换为彩色区域，并将其叠加在原始图像上进行可视化。\n\
  \ndetr_processor（使用函数 DetrImageProcessor.from_pretrained() 加载的另一个预训练模型）负责**图像预处理和后处理**（通过处理器方法\
  \ post_process_panoptic_segmentation()）——它将图像转换为模型所需的张量，之后将原始输出转换为逐像素分割图——而 detr_model\
  \ 是**基于 Transformer 的网络（ResNet-50 骨干 + DETR）**，它使用对象查询来预测分割片段。\n\n直观地说，DETR 使用**基于\
  \ Transformer 的对象查询**全局地查看整个图像，并直接预测整个场景的分割片段，后处理步骤将这些预测转换为**逐像素全景掩码**，然后着色并叠加到原始图像上进行可视化。这会产生**分割图**和**segments_info**。与逐像素模型不同，**DETR\
  \ 输出对象级掩码**，因此不需要**NMS（非极大值抑制）**。其关键优势在于端到端学习以及统一的检测 + 分割。现在，请参考下一个代码片段：\n\n```python\n\
  from transformers import DetrImageProcessor, DetrForSegmentation\n\ndetr_processor\
  \ = DetrImageProcessor.from_pretrained( \\\n    \"facebook/detr-resnet-50-panoptic\"\
  ) # DETR (Panoptic Segmentation)\n\ndetr_model = DetrForSegmentation.from_pretrained(\\\
  \n    \"facebook/detr-resnet-50-panoptic\").to(device)\n\ndef run_pipeline(image_path):\n\
  ```\n\n\n\n- **多阶段分层编码器** 生成多分辨率特征图。编码器输出通过多尺度特征融合组合为：\n\n  $$F = \\operatorname{concat}(F_1,\
  \ F_2, F_3, F_4)$$\n\n- **无位置编码**（一个关键创新——空间信息被隐式保留）。\n\n- **轻量级 MLP 解码器** 高效融合多尺度特征，因此最终的分割预测为：\n\
  \n  $$\\hat{Y} = \\operatorname{MLP}(F)$$\n\n这种设计避免了重型解码器（如 U-Net 风格），保留了空间细节，并显著减少了计算量。因此，SegFormer\
  \ 可以被理解为一种*使用 Transformer 实现的类 CNN 分层特征提取器，并结合了一个简单而强大的解码器*。\n\n现在，我们用下一个代码片段来演示语义分割，该片段使用预训练模型\
  \ **nvidia/segformer-b0-finetuned-ade-512-512**。这里，**processor**（AutoImageProcessor）将图像转换为归一化张量，并处理调整大小、填充和批处理。\n\
  \n它还执行**后处理**，而 **model**（AutoModelForSemanticSegmentation）实现了 SegFormer 架构，并输出形状为\
  \ `[1, C, H′, W′]` 的 **logits**，其中 `C` 是类别数量。\n\n`post_process_semantic_segmentation()`\
  \ 方法将 logits *上采样* 到原始图像大小，在类别维度上应用 **argmax**，并返回一个**逐像素类别图**：\n\n$$\\hat{Y}(x,y)\
  \ = \\operatorname{argmax}_c\\ \\operatorname{logits}_c(x,y)$$\n\n```python\nfrom\
  \ transformers import AutoImageProcessor,AutoModelForSemanticSegmentation\nmodel_name\
  \ = \"nvidia/segformer-b0-finetuned-ade-512-512\"\nprocessor = AutoImageProcessor.from_pretrained(model_name)\n\
  model = AutoModelForSemanticSegmentation.from_pretrained(model_name)\n\ndef run_segmentation(image_path):\n\
  \    image = Image.open(image_path).convert(\"RGB\")\n    image_np = np.array(image)\n\
  \    inputs = processor(images=image, return_tensors=\"pt\").to(device)\n    with\
  \ torch.no_grad(): outputs = model(**inputs)\n    segmentation = processor.post_process_semantic_segmentation(outputs,\
  \ \\\n            target_sizes=[image.size[::-1]])[0]\n    seg_color = colorize(segmentation)\n\
  \    overlay = (0.4 * image_np + 0.6 * seg_color).astype(np.uint8)\n    # Plot image_np,\
  \ seg_color and detr_overlay side-by-side here\n\nrun_segmentation(\"images/cricket.jpg\"\
  )\n```\n\n如果运行上述代码，你应该会得到如下图所示的结果：\n\n这个示例展示了一个强大的思想：SegFormer 提供了一种统一的架构，但特定于数据集的训练决定了模型“看到”和“理解”的内容。\n\
  \n模型使用 Transformer 注意力全局理解场景。每个像素都基于上下文和语义进行分类。不同的数据集强调不同的环境：ADE20K → 通用场景，Cityscapes\
  \ → 自动驾驶，CamVid → 道路理解。\n\n## 掩码分类 Transformer：Mask2Former\n\nMask2Former 将分割表述为一个集合预测问题，预测掩码-类别对：\n\
  \n$\\{(M_i,c_i)\\}_{i=1}^{N}$\n\n其中 $M_i$ 是预测的软/二值掩码，$c_i$ 是其类别标签。与基于 CNN 的分割中独立的逐像素分类不同，\n\
  \n$\\hat{y}(x,y)=\\underset{k}{\\operatorname{argmax}}\\,P_k(x,y)$，\n\n像素 $(x,y)$\
  \ 的最终标签来自置信度最高的掩码预测：\n\n$\\hat{y}(x,y)=c_{i^*},\\quad i^*=\\underset{i}{\\operatorname{argmax}}\\\
  ,M_i(x,y)$\n\n这在基于 Transformer 的单一框架内统一了语义、实例和全景分割，使用基于全局注意力的 token 交互，而不是仅依赖 CNN\
  \ 的局部感受野。训练使用匈牙利匹配和组合的集合预测损失：\n\n$\\mathcal{L}=\\lambda_{cls}\\mathcal{L}_{cls}+\\\
  lambda_{mask}\\mathcal{L}_{mask}+\\lambda_{dice}\\mathcal{L}_{dice},$\n\n其中 $\\\
  mathcal{L}_{cls}$ 是分类损失，$\\mathcal{L}_{mask}$ 是逐像素掩码损失（如 BCE），$\\mathcal{L}_{dice}$\
  \ 是 Dice 重叠损失。这种公式化方法提高了全局一致性，减少了重复预测，并产生更清晰的分割边界。\n\n以下代码片段演示了使用 Mask2Former 结合预训练\
  \ Transformer 模型进行通用分割，涵盖语义、实例和全景分割。使用了两个预训练模型：\"facebook/mask2former-swin-large-ade-semantic\"\
  \ 用于语义分割，\"facebook/mask2former-swin-large-coco-panoptic\" 用于全景/实例分割，其中相同的 Mask2Former\
  \ 架构在不同的训练目标下被重复使用。\n\n函数 colorize() 为分割掩码分配基于 HSV 的视觉上可区分的颜色，确保相邻区域和对象实例之间的清晰分离。函数\
  \ overlay() 将分割输出与原始图像混合，同时可以选择性地保留背景区域。有关这些函数的定义，请参阅 GitHub。\n\n语义分割使用 post_process_semantic_segmentation()\
  \ 方法执行，该方法在整个图像上生成密集的逐像素类别标签。实例分割使用 post_process_instance_segmentation() 来检测和分离单个对象实例（“things”），例如人或汽车，并为每个对象分配唯一\
  \ ID。全景分割使用 post_process_panoptic_segmentation() 执行，该方法将语义“stuff”区域（天空、道路）和实例感知的“thing”对象统一为完整的场景表示。最终可视化显示\n\
  \n原始图像以及语义、实例和全景分割输出及其相应的叠加结果。\n\n```python\nfrom transformers import Mask2FormerImageProcessor,\
  \ \\\n                         Mask2FormerForUniversalSegmentation\nsem_processor\
  \ = Mask2FormerImageProcessor.from_pretrained(\\\n                         \"facebook/mask2former-swin-large-ade-semantic\"\
  )\nsem_model = Mask2FormerForUniversalSegmentation.from_pretrained(\\\n        \
  \                 \"facebook/mask2former-swin-large-ade-semantic\").to(device)\n\
  mask_processor = Mask2FormerImageProcessor.from_pretrained(\\\n                \
  \         \"facebook/mask2former-swin-large-coco-panoptic\")\nmask_model = Mask2FormerForUniversalSegmentation.from_pretrained(\\\
  \n                         \"facebook/mask2former-swin-large-coco-panoptic\").to(device)\n\
  \ndef segment_and_display(image_path):\n    image = Image.open(image_path).convert(\"\
  RGB\")\n    image_np = np.array(image)\n    h, w = image_np.shape[:2]\n    # 1 Semantic\
  \ Segmentation\n    inputs = sem_processor(images=image, return_tensors=\"pt\").to(device)\n\
  \    with torch.no_grad():\n        outputs = sem_model(**inputs)\n    sem_seg =\
  \ sem_processor.post_process_semantic_segmentation(\\\n                        \
  \ outputs, target_sizes=[(h, w)])[0]\n    # 2 Instance Segmentation (filter out\
  \ \"things\")\n    inputs_mask = mask_processor(images=image, \\\n             \
  \            return_tensors=\"pt\").to(device)\n    with torch.no_grad(): mask_outputs\
  \ = mask_model(**inputs_mask)\n    instance_result = mask_processor.post_process_instance_segmentation(\\\
  \n                         mask_outputs, target_sizes=[(h, w)])[0]\n    inst_map\
  \ = np.zeros((h, w), dtype=np.int32)\n    segmentation_tensor = instance_result[\"\
  segmentation\"].cpu().numpy()\n    instance_counter = 1\n    for res in instance_result[\"\
  segments_info\"]:\n        if res[\"label_id\"] < 80:\n            binary_mask =\
  \ (segmentation_tensor == res[\"id\"])\n            inst_map[binary_mask] = instance_counter\n\
  \            instance_counter += 1\n    # 3. Panoptic Segmentation\n    panoptic_result\
  \ = mask_processor.post_process_panoptic_segmentation(\\\n                     \
  \    mask_outputs, target_sizes=[(h, w)])[0]\n    pan_map = panoptic_result[\"segmentation\"\
  ].cpu().numpy()\n```\n\n```python\n# Plot imgs and overlays here side-by-side\n\n\
  segment_and_display(\"images/men_beach.jpg\")\n```\n\n如果运行上述代码，你应该会得到如下图所示的结果：\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_543_0.png)\n\n图 10.33：使用预训练 Mask2Former\
  \ 进行语义、实例和全景分割\n\nMask2Former 引入了一种范式转变：不是标记像素 → 而是预测物体为掩码；不是局部决策 → 而是进行全局推理；不是多个独立模型\
  \ → 而是提供统一框架。Mask2Former 不问“这个像素是什么？”；相反，它问“场景中存在哪些物体，它们的掩码在哪里？”下表展示了深度分割模型的演进：\n\
  \n| 模型类型 | 核心思想 | 解决的局限 |\n|---|---|---|\n| SETR | 纯 ViT | 缺乏空间细节 |\n| DPT | 多尺度融合\
  \ | 改进定位 |\n| DETR | 基于查询的推理 | 以对象为中心的建模 |\n| SegFormer | 分层 Transformer | 效率 +\
  \ 可扩展性 |\n| Mask2Former | 统一分割 | 泛化所有任务 |\n\n表 10.3：基于 Transformer 的分割模型\n\n## 使用预训练的\
  \ OneFormer 分割 Cityscapes 和 ADE20K 数据集图像\n\n基于 Transformer 的分割技术的最新进展催生了统一的架构，能够在单一模型中处理多种分割任务：语义分割、实例分割和全景分割。OneFormer\
  \ 就是这样一个模型，它通过引入任务条件分割扩展了掩码分类的思想（如 Mask2Former），使单个网络能够跨数据集和分割范式进行泛化。OneFormer 同时学习“分割什么”（任务）和“如何分割”（掩码预测）。这实现了跨数据集泛化、多任务学习，并减少了模型冗余。\n\
  \n\n\n\n接下来代码首先从 ADE20K 和 Cityscapes 加载基准图像，为基于 OneFormer 的通用分割准备输入。它使用 OneFormerProcessor\
  \ 进行预处理（调整大小、归一化、标记化）和 OneFormerForUniversalSegmentation 进行基于变换器的推理。函数 `segment_image()`\
  \ 执行语义分割，生成彩色掩码和叠加可视化，并显示最终的分割结果。\n\n```python\nfrom transformers import OneFormerProcessor,\
  \ \\\n                        OneFormerForUniversalSegmentation\n\nade20k_image\
  \ = Image.open('images/ADE_val_00000519.png').convert('RGB')\ncityscapes_image =\
  \ Image.open(\\\n    'images/stuttgart_00_000000_000113_leftImg8bit.png').convert('RGB')\n\
  \nade_processor = OneFormerProcessor.from_pretrained(\\\n                      \
  \  \"shi-labs/oneformer_ade20k_swin_large\")\nade_model = OneFormerForUniversalSegmentation.from_pretrained(\\\
  \n                        \"shi-labs/oneformer_ade20k_swin_large\").to(device).eval()\n\
  city_processor = OneFormerProcessor.from_pretrained(\\\n                       \
  \ \"shi-labs/oneformer_cityscapes_swin_large\")\ncity_model = OneFormerForUniversalSegmentation.from_pretrained(\\\
  \n                        \"shi-labs/oneformer_cityscapes_swin_large\").to(device).eval()\n\
  \ndef segment_image(image, processor, model, device):\n    inputs = {k: v.to(device)\
  \ for k, v in processor(image, [\"semantic\"],\n                        return_tensors=\"\
  pt\").items()}\n    with torch.no_grad():\n        seg_map = processor.post_process_semantic_segmentation(\n\
  \            model(**inputs), target_sizes=[image.size[::-1]])[0].cpu()\n      \
  \  # Plot image, seg_map and overlay side-by-side here\n\nsegment_image(ade20k_image,\
  \ processor=ade_processor, model=ade_model,\n              device='cuda')\n```\n\
  \n如果运行上述代码对 ADE20K 中的图像进行分割，你应该会得到如下图所示的结果：\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_544_0.png)\n\
  \n> *图 10.34 – 使用预训练 OneFormer 分割 ADE20k 图像*\n\n同样，要对 Cityscapes 中的图像进行分割，请运行以下代码：\n\
  \n```python\nsegment_image(cityscapes_image, processor=city_processor, model=city_model)\n\
  ```\n\n如果运行上述代码，你应该会得到如下图所示的结果：\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_545_0.png)\n\
  \n> *图 10.35 – 使用预训练 OneFormer 分割 Cityscape 图像*\n\n上述代码演示了真实世界的数据集，介绍了标准化的评估基准，并为通用分割流程奠定了基础。OneFormer\
  \ 学会了在任何任务下、在任何地方分割任何东西，使用单一统一的变换器。\n\n要点：最后一部分将经典的、基于 CNN 的和基于变换器的分割统一在共同的视角下，突出了方法如何从像素/区域建模演进到以对象为中心和基于查询的表示。它强调了语义、实例和全景分割在现代架构中的核心区别和联系。\n\
  \n## Summary\n\n在本章中，我们建立了图像分割的坚实基础，从经典概念发展到现代深度学习和基于变换器的方法。我们探讨了语义、实例和全景分割的基本公式，并研究了诸如\
  \ CNN 和变换器（例如 DPT、SegFormer、DETR、Mask2Former）等架构如何建模空间上下文、全局依赖和对象级推理。通过理论见解和实际实现，读者对分割模型如何从像素级分类演进到统一的、基于查询的框架有了清晰的理解。这一基础为我们进入下一部分做好了准备，在那里分割将变得更加交互式、多模态和以应用为驱动。\n\
