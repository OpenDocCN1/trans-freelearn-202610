  \ UI（app.py）交互以上传图像、选择增强方法并调整参数。请求由使用 OpenCV 和 NumPy 实现的图像增强引擎（image_enhancement.py）处理，并将增强后的图像返回给用户。此架构突出了\
  \ UI 逻辑（Streamlit）与处理逻辑（增强引擎）之间的分离，从而实现模块化和易于扩展。\n\n\n\n\n\n文件 app.py 作为您使用 Streamlit\
  \ 构建的交互式图像增强工具的主应用程序脚本。它将用户输入（通过 Streamlit）和后端处理（通过 image_enhancement 模块）结合起来，为交互式尝试不同的图像增强技术构建响应迅速且直观的\
  \ GUI。以下是它的简要说明。\n\nPython 脚本 app.py 创建了一个图形化 Web 界面，允许用户：\n\n- 上传一张图像\n- 从列表中选择图像增强方法\n\
  - 可选地调整方法特定的参数（如分箱数或 alpha）\n- 查看原始图像与增强图像之间的实时视觉对比\n\n下表总结了关键函数，如下一段代码所示：\n\n|\
