  \ Files\\\\ImageMagick-7.1.1-Q16-HDRI'\n```\n```\n\n### Creating visual effects\n\
  \nWand 库提供了一系列内置的艺术和摄影效果，由以下代码片段演示。辅助函数 `call_func()` 使用 `getattr()` 动态地将效果应用于克隆的图像，防止修改原始图像。名为\
  \ `functions` 的字典存储效果名称及其参数，允许自动应用多个效果。\n\n\n\n\n\nThe demonstrated effects include\
  \ `blue_shift()` (moonlight-like blue tint), `charcoal()` (sketch effect), `colorize()`\
  \ and `tint()` (color blending), `vignette()` (darkened borders), `sepia_tone()`\
  \ (vintage appearance), `implode()` (pulls pixels toward the center), `polaroid()`\
  \ (adds a Polaroid-style frame and shadow), `swirl()`, `wave()`, `shade()` (3D shading\
  \ effect), `white_balance()`, `cycle_color_map()`, and `spread()`. The code loads\
  \ an image with `wand.image.Image`, applies each effect with its corresponding parameters,\
  \ and displays the original and transformed results in a Matplotlib grid, illustrating\
  \ the variety of visual effects available through Wand and ImageMagick.\n\nNow,\
  \ refer to the following code snippet:\n\n```python\nfrom wand.image import Image\
  \ as ImageW\nfrom wand.color import Color\n\n\ndef call_func(img, func_name):\n\
  \    img = img.clone()\n    func = getattr(img, func_name)\n    arg_dict = functions[func_name]\n\
  \    func(**arg_dict)\n    return img\n\nfunctions = {\n    'spread': {'radius':16.0},\n\
  \    'blue_shift': {'factor':2},\n    'charcoal': {'radius':2, 'sigma':1},\n   \
  \ 'colorize': {'color': 'magenta', 'alpha':\"rgb(10%, 50%, 20%)\"},\n    'tint':\
  \ {'color': 'magenta', 'alpha': 'rgb(50%, 70%, 80%)'},\n    'vignette': {'sigma':3,\
  \ 'x':15, 'y':15},\n    'sepia_tone': {'threshold': 0.9}, 'implode': {'amount':0.5},\n\
  \    'polaroid': {}, 'swirl': {'degree': -120},\n                 'wave': {'amplitude':10,\
  \ 'wave_length':50},\n    'shade': {'gray':True, 'azimuth':100.0, 'elevation':45.0},\n\
  \    'white_balance': {},\n    'cycle_color_map': {'offset': 50}\n}\n\nwith ImageW(filename=\"\
  images/parrot.png\") as img:\n    plt.subplot(3,5,1), plt.imshow(np.array(img))\n\
  \    plt.axis('off'), plt.title('original', size=20)\n    i = 2\n    for func_name\
  \ in functions:\n        out_img = call_func(img, func_name)\n        plt.subplot(3,5,i),\
  \ plt.imshow(np.array(out_img))\n```\n\n```python\nwith ImageW(filename=\"images/parrot.png\"\
  ) as img:\n    filtered_img = img.fx(fx_filter)\n```\n\nIf you run the preceding\
