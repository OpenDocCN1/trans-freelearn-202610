  \ 中显示 PIL 图像*\n\n#### 使用 Matplotlib 读取、保存和显示图像\n\nMatplotlib 主要是一个 Python 绘图库，但它也提供了一些用于读取、保存和显示图像的函数。让我们通过几个示例来演示。\n\
  \n##### 使用 matplotlib.image 读取图像\n\n下面的代码块演示了如何使用 `matplotlib.image` 中的 `imread()`\
  \ 函数将图像读取为浮点 NumPy ndarray 数据结构。像素值将表示为 0 到 1 之间的实数值：\n\n```\n```python\nimport\
  \ matplotlib.image as mpimg\nim = mpimg.imread(\"images/hill.png\") # read image\
  \ from disk as ndarray\nprint(im.shape, im.dtype, im.max(), type(im))\n# (960, 1280,\
  \ 3) float32 1.0 <class 'numpy.ndarray'>\n```\n```\n\n\n\n\n或者，你也可以使用 `matplotlib.pylab`\
  \ 模块中的 `imread()` 函数，如下所示：\n\n```python\nimport matplotlib.pylab as plt\nim = plt.imread(\"\
  images/hill.png\")  # read image from disk as numpy ndarray\nprint(im.shape, im.dtype,\
  \ im.max(), type(im))\n# (960, 1280, 3) float32 1.0 <class 'numpy.ndarray'>\n```\n\
  \n下一个代码片段演示了如何使用 NumPy 阈值处理和 Matplotlib 图像 I/O 实现简单的图像变暗。首先将图像归一化到 [0,1] 范围，使用 `copy()`\
  \ 复制，然后通过布尔索引将所有低于阈值 0.5 的像素值设为 0：`im_dark[im_dark < 0.5] = 0`。阈值越低，被变暗的像素越多。随后使用\
  \ `mpimg.imsave()` 保存变暗后的图像，再用 `mpimg.imread()` 重新加载，并通过 `np.hstack()` 和 `plt.imshow()`\
  \ 将其与原始图像并排显示。`[..., :3]` 运算符确保在存在 alpha 通道时仅保留 RGB 三个通道。\n\n```python\nim = im\
  \ / im.max()  # 0-1 normalize\nim_dark = im.copy()\nim_dark[im_dark < 0.5] = 0 \
  \     # make the image look darker\nmpimg.imsave(\"images/hill_dark.png\", im_dark)\
  \  # save the dark image\nim_dark = mpimg.imread(\"images/hill_dark.png\")[...,\
  \ :3]  # 1st 3 color channels\nplt.imshow(np.hstack((im, im_dark)), plt.axes('off'))\n\
  plt.title('original and the darkened image', size=20)\n```\n\n如果运行上述代码片段，你应该会得到类似下面这样的图：\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_43_0.png)\n\n*图1.4 – 使用 PIL 将图像变暗*\n\n\
  你可以使用 `matplotlib.pylab` 中的 `savefig()` 函数将图像保存到磁盘，但在此之前必须先使用 `imshow()` 函数将其绘制出来。\n\
  \n> **注意**\n> \n> 本例中 0.5 这个阈值是任意选取的，目的是演示如何通过操作图像中的像素值使其看起来更暗。不过，该阈值并非固定不变，建议你尝试\
  \ [0, 1] 范围内的其他值。\n\n##### 使用 matplotlib.pylab 显示图像\n\nmatplotlib.pylab 的 imshow()\
  \ 函数被广泛用于显示以 NumPy ndarray 对象表示的图像。它支持可选参数，例如 cmap 用于颜色映射表，interpolation 用于控制像素插值，aspect\
  \ 用于调整图像宽高比。axis('off') 命令会移除坐标轴刻度和标签，使可视化更清晰。\n\n插值方法决定了当图像像素与显示像素无法完全对齐时如何估算像素值，这对于小图像或调整大小后的图像尤为重要。常见的插值方法包括\
  \ 'nearest'、'bilinear'、'bicubic'、'gaussian' 和 'lanczos'（你将在第 2 章和第 3 章进一步了解它们）。下一个代码片段使用\
  \ imshow()、plt.subplots() 和 plt.tight_layout() 以多种插值选项显示同一幅图像，演示不同插值方法的效果。\n\n```\n\
  im = mpimg.imread(\"images/monalisa.jpg\") # read image as numpy ndarray\nmethods\
  \ = [None, 'none', 'nearest', 'bilinear', 'bicubic', 'spline16', \\\n    'spline36',\
  \ 'hanning', 'hamming', 'hermite', 'kaiser', 'quadric',\\\n    'catrom', 'gaussian',\
  \ 'bessel', 'mitchell', 'sinc', 'lanczos']\nfig, axes = plt.subplots(nrows=3, ncols=6,\
  \ figsize=(12, 7), \\\n    subplot_kw={'xticks': [], 'yticks': []})\nfig.subplots_adjust(hspace=0.05,\
  \ wspace=0.05)\nfor ax, interp_method in zip(axes.flat, methods):\n    ax.imshow(im,\
  \ interpolation=interp_method)\n    ax.set_title(str(interp_method))\nplt.tight_layout();\
  \ plt.show()\n```\n\n如果运行上述代码，你应该会得到类似下面这样的图：\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_44_0.png)\n\
  \n图1.5 – 使用不同插值方法显示图像\n\n###### 颜色映射表\n\n颜色映射表（cmap）定义了从标量数据值到颜色的映射，使图像中的强度变化可视化，特别适用于灰度或单通道图像，此时像素值以颜色表示。实际应用中，先将三通道图像转换为二维灰度表示（例如使用\
  \ np.mean(..., axis=-1) 对各通道取平均），然后应用不同的颜色映射表来可视化强度分布，通常还会配有颜色条（plt.colorbar()）来指示颜色值与像素强度之间的映射关系。\n\
  \n```\nim = plt.imread('images/cameraman.jpg')\nim_gray = np.mean(im, axis=-1)\n\
  i = 1\nfor cmap in ['viridis', 'inferno', 'coolwarm', 'Spectral', 'jet', \\\n  \
  \  'nipy_spectral', 'hot', 'Blues']:\n    plt.subplot(1,8,i), plt.imshow(im_gray,\
  \ cmap=cmap, aspect='auto')\n    plt.axis('off')\n    i += 1\nplt.colorbar(label='Intensity')\n\
  plt.tight_layout(); plt.show()\n```\n\n如果运行上述代码片段，你应该会得到类似下面这样的图：\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_45_0.png)\n\
  \n图1.6 – 将颜色映射表应用于灰度图像\n\n### 注意\n\n要将 RGB 图像转换为灰度图像，前面的代码使用了所有颜色通道的线性组合，且各通道权重相等，公式如下：\n\
  \nG = (R + G + B) / 3\n\n使用国家电视系统委员会（NTSC）公式 G = 0.299R + 0.587G + 0.114B 进行感知加权计算得到的亮度值，能更准确地表示人类对红、绿、蓝光亮度相对感知。你可以使用下面这行代码来实现：\n\
  \nG = (R + G + B) / 3\n\n```\nim_gray_ntsc = np.dot(im[..., :3], [0.299, 0.587,\
  \ 0.114])\n```\n\n现在，分别使用均值加权与感知加权绘制灰度图像：\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_46_0.png)\n\
  \n*图1.7 – 分别使用均值加权与感知加权对颜色通道加权生成的灰度图像*\n\n###### 子图\n\n`matplotlib.pylab` 提供了使用\
  \ `subplot()` 函数创建子图的便捷接口。子图允许你在同一幅图中按网格形式显示多个图形。`subplot()` 函数接受三个参数：行数、列数，以及要创建的子图索引，正如你在前面的代码片段中可能已经注意到的那样。\n\
  \n#### 使用 scikit-image 读取、保存和显示图像\n\nscikit-image 库是一个图像处理算法的集合。虽然它主要专注于图像处理任务而非\
  \ I/O 操作，但你可以将 Imageio 或 Matplotlib 等其他库与 scikit-image 结合使用，以完成图像的读取、保存和显示。以下是示例代码块：\n\
  \n```python\nfrom skimage.io import imread, imread_collection, imshow_collection\n\
  from skimage import color\n\n\ndef min_max_normalize(im, low=0, high=255):\n   \
  \ \"\"\"Normalizes the pixel values of the image im to the specified\n    [low,\
  \ high] range using min-max scaling\"\"\"\n    return ((high-low)*(im-im.min())/(im.max()-im.min())).astype(np.uint8)\n\
  \nim = imread(\"images/parrot.png\")  # read image, provide the correct path\nprint(im.shape,\
  \ im.dtype, type(im), im.max(), im.min())\n# (362, 486, 3) uint8 <class 'numpy.ndarray'>\n\
  im_gray = imread(\"images/parrot.png\", as_gray=True)  # read grayscale image\n\
  im_gray = min_max_normalize(im_gray)\nim_gray = color.gray2rgb(im_gray)\n```\n\n\
  ```\nhsv = color.rgb2hsv(im) # from RGB to HSV color space\nhsv[:, :, 1] = 0.5 #\
  \ change the saturation\nim_hsv = min_max_normalize(color.hsv2rgb(hsv)) # from HSV\
  \ back to RGB\nprint(im_hsv.dtype)\n# uint8\nimsave('images/parrot_hsv.png', im_hsv)\n\
  im_hsv = imread(\"images/parrot_hsv.png\")\nplt.imshow(np.hstack((im, im_gray, im_hsv)));\
  \ plt.axis('off'); plt.show()\n```\n\n在上述代码中，skimage.io 的 imread() 函数将图像读取为 NumPy\
  \ ndarray 对象。在默认的 as_gray=False 情况下，图像以 uint8 数组加载，像素值范围为 [0,255]；而 as_gray=True\
  \ 会将灰度图像加载为 float64 数组，数值范围为 [0,1]。自定义的 min_max_normalize() 函数执行最小-最大归一化，将图像强度缩放到指定范围（通常为\
  \ [0,255]）。\n\n灰度图像通过 gray2rgb() 转换为三通道图像，并使用 skimage.color.rgb2hsv() 进行 RGB 到 HSV\
  \ 的颜色转换。\n\n接下来，在保持色调和明度不变的情况下修改饱和度通道，演示饱和度如何控制色彩的鲜艳程度：高饱和度产生浓郁的色彩，低饱和度产生柔和的色彩，零饱和度则得到灰度图像。修改后的\
  \ HSV 图像通过 hsv2rgb() 转换回 RGB，使用 skimage.io.imsave() 保存，并通过 np.hstack() 和 plt.imshow()\
  \ 并排显示。下图展示了该代码片段的输出：输入图像、灰度图像以及改变饱和度后的新图像并排显示。\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_47_0.png)\n\
  \n图1.8 – 使用 skimage 显示 RGB、灰度和 HSV 颜色空间中的图像\n\n注意：skimage.color.rgb2hsv() 与 OpenCV\
  \ 的 cv2.cvtColor(..., cv2.COLOR_RGB2HSV) 在 HSV 通道表示上的主要区别在于缩放约定：在 scikit-image 中，色调（Hue）、饱和度（Saturation）和明度（Value）这三个通道均以\
  \ [0.0, 1.0] 范围内的归一化浮点值表示；而 OpenCV 使用基于整数的缩放，其中色调映射到 [0, 179]（对应 0–360°，但在 8 位表示中按一半分辨率存储），饱和度和明度均存储在\
  \ [0, 255] 范围内。因此，scikit-image 采用单位区间上的连续表示，而 OpenCV 采用 8 位整数表示，且不同通道的缩放因子不同。\n\n\
  \n\n下图显示了代码片段的输出：\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_49_0.png)\n\n图1.9\
  \ – 来自 scikit-image 数据的宇航员和摄影师图像\n\n##### 一次读取并显示多张图像\n\n我们可以使用 skimage.io 模块的 `imread_collection()`\
  \ 函数加载文件夹中文件名符合特定模式的所有图像，并使用 `imshow_collection()` 函数同时显示它们。以下代码块展示了读取并显示图像集合的示例：\n\
  \n```\nimages = imread_collection('images/image_dir/*.jpg')\nprint(len(images))\
  \ # print no. of jpg images in the folder, there are 4\n# 4\nimshow_collection(images);\
  \ plt.show()\n```\n\n下图显示了上述代码块的输出：\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_49_1.png)\n\
  \n图1.10 – 使用 scikit-image 读取并显示图像集合\n\n##### 图像的块视图\n\n使用 skimage.util.view_as_blocks()\
  \ 的块视图将图像分割成不重叠的块，以实现池化等局部操作。给定一幅灰度图像，将其划分为 m × n 个块（可选填充以确保可整除性），每个块被缩减为单个值以形成下采样图像：均值池化计算平均强度，最大池化选择最大强度，中值池化选择每个块内的中值强度。\n\
  \n下一个代码块定义了几个用于可视化的辅助函数：plot_image() 显示单张图像并带有标题且关闭坐标轴，而 plot_images() 使用 matplotlib\
  \ 将多张图像排列在 1×n 的网格中，应用灰度颜色映射，设置各个子图标题，并添加具有可调整图形和字体大小的全局总标题。\n\n```\ndef plot_image(im,\
  \ title='', fontsize=20):\n    plt.imshow(im), plt.axis('off'),\n    plt.title(title,\
  \ size=fontsize)\n\ndef plot_images(images, titles, suptitle='', fontsize=20, \\\
  \n                supfontsize=22, figsize=(15,7)):\n    n = len(images)\n    plt.figure(figsize=figsize)\n\
  \    plt.gray()\n    for i in range(n):\n        plt.subplot(1,n,i+1), plot_image(images[i],\
  \ titles[i], fontsize)\n    plt.suptitle(suptitle, size=supfontsize)\n    plt.tight_layout()\n\
  \    plt.show()\n```\n\n下一个代码片段使用不同的池化方法对输入图像实现块视图：\n\n```\nfrom skimage.util import\
  \ view_as_blocks\nim = color.rgb2gray(imread('images/sculpture.png')[..., :3])\n\
  block_shape = (8, 8) # Ensure image dimensions are divisible by block size\npad_height\
  \ = (block_shape[0] - im.shape[0] % block_shape[0]) % block_shape[0]\npad_width\
  \ = (block_shape[1] - im.shape[1] % block_shape[1]) % block_shape[1]\nif pad_height\
  \ != 0 or pad_width != 0:\n    # optional: pad the image to make it divisible by\
  \ block size\n    im = np.pad(im, ((0, pad_height), (0, pad_width)), mode='reflect')\n\
  view = view_as_blocks(im, block_shape)\nflatten_view = view.reshape(view.shape[0],\
  \ view.shape[1], -1)\nmean_view = np.mean(flatten_view, axis=2)\nmax_view = np.max(flatten_view,\
  \ axis=2)\nmedian_view = np.median(flatten_view, axis=2)\nplot_images([im, mean_view,\
  \ max_view, median_view], ['original', \\\n    'local mean pooling', 'local max\
  \ pooling', 'local median pooling'])\n```\n\n如果运行上述代码，你应该会得到如下图所示的结果：\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_51_0.png)\n\
  \n图1.11 – 使用不同局部池化方法的图像块视图\n\n上述代码首先加载 RGB 图像，丢弃任何 alpha 通道，并将其转换为灰度以进行单通道处理。然后，它使用\
  \ view_as_blocks() 将图像划分为不重叠的 8 × 8 块，如有必要，对图像进行填充，使其尺寸可被块大小整除。\n\n块表示将图像从 (H, W)\
  \ 重塑为 (H/8, W/8, 64)，其中每个块被展平为包含 64 个像素的一维数组。然后在每个块上应用局部池化操作：np.mean() 计算平均强度（均值池化），np.max()\
  \ 保留最强响应（最大池化），np.median() 在保留结构的同时降噪（中值池化）。\n\n最后，plot_image() 和 plot_images()\
  \ 辅助函数使用 Matplotlib 可视化带标题的单张或多张图像，而 plt.tight_layout() 则整齐地排列子图。\n\n#### 使用 OpenCV-Python\
  \ 读取、保存和显示图像\n\n使用 OpenCV-Python，读取灰度图像和彩色图像都很简单。cv2.imread() 函数用于读取图像，你可以使用可选标志指定颜色模式。下面介绍如何读取彩色图像并在\
  \ notebook 中内联显示。你需要将图像文件路径提供给 cv2.imread() 函数，如下一个代码片段所示。检查图像是否成功加载（图像不为 None）：\n\
  \n```\nimport cv2\nimage = cv2.imread('images/model.png')\ncv2.imshow('Model', image)\n\
  cv2.waitKey(0)\ncv2.destroyAllWindows()\nprint(image.dtype)\n# uint8\n```\n\n> **注意**\n\
  > cv2.imshow() 会打开一个 GUI 窗口，在 Jupyter Notebook 中无法可靠工作——它应该作为独立的 Python 脚本运行（例如，通过终端或\
  \ .py 文件）。\n\n下面演示如何使用标志 cv2.IMREAD_GRAYSCALE（等于 0）读取灰度图像：\n\n```\nimage_gray =\
  \ cv2.imread('images/model.png', cv2.IMREAD_GRAYSCALE)\ncv2.imshow('Model Gray',\
  \ image_gray)\ncv2.waitKey(0)\n```\n\nOpenCV 默认以蓝色、绿色、红色（BGR）颜色格式读取彩色图像。如果你想使用 Matplotlib\
  \ 显示图像（Matplotlib 期望 RGB 格式的图像），则应使用 cv2.cvtColor() 函数并将输入标志设置为 cv2.BGR2RGB 来转换颜色通道，以正确显示颜色，如下一个代码片段所示：\n\
  \n```\nimage_rgb = cv2.cvtColor(image, cv2.COLOR_BGR2RGB)\nplt.imshow(np.hstack(([image,\
  \ image_rgb,\n    np.repeat(image_gray[..., np.newaxis], 3, axis=-1)]))\n```\n\n\
  如果运行上述代码片段，你应该会得到如下图所示的结果：\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_52_0.png)\n\
  \n图1.12 – 使用 OpenCV-Python 加载图像的 BGR 到 RGB 转换\n\n要使用 OpenCV-Python 写入图像，可以使用 cv2.imwrite()\
  \ 函数。该函数的第一个参数是存储路径，第二个参数是作为 NumPy 数组的图像。下面是一个示例，它将输入图像从 RGB 转换为 YUV 颜色空间，并在颜色空间转换后保存图像：\n\
  \n```\ncv2.imwrite('images/model_yuv.png', cv2.cvtColor(image_rgb,\n    cv2.COLOR_RGB2YUV))\n\
  # True # => image is successfully written (saved) to disk without error\n```\n\n\
  如上述代码片段所示，cv2.imwrite() 函数将文件路径和图像数据作为输入，并将图像保存到指定位置。确保路径根据所需的图像格式包含正确的文件扩展名（例如\
  \ .jpg 或 .png）。格式由文件扩展名决定。如果文件路径不存在，OpenCV 将尝试创建它。请记住，OpenCV 支持各种图像格式，如 JPEG、PNG、BMP\
  \ 等。格式根据文件路径中提供的文件扩展名确定。\n\n#### 使用 ImageIO 读取和保存图像\n\nImageIO 是一个用于图像 I/O 的简单 Python\
  \ 库，提供 `imageio.imread()` 和 `imageio.imwrite()` 等函数，用于读取和保存多种格式的图像，包括通过读取帧来支持动画\
  \ GIF，以及从图像序列生成 GIF。动画 GIF 由多个帧按顺序循环播放以产生运动，通常使用有限的调色板（≤ 256 种颜色），支持透明度，并依赖无损压缩，使其在保持文件大小紧凑的同时，跨平台广泛兼容。\n\
  \n###### 从动画 GIF 中提取帧\n\n在 ImageIO 中，可以使用 `imageio.get_reader()` 从动画 GIF 中提取帧，该函数创建一个读取器对象，允许按顺序迭代\
  \ GIF 的帧，每帧表示为一个 NumPy 数组；然后可以处理或选择性采样这些帧（例如，使用 `np.random.rand()` 随机选择帧的子集），从而能够检查或操作单个动画组件。\n\
  \n```python\nimport imageio\ngif_path = 'images/leaves.gif'\nnp.random.seed(3)\n\
  images = []\nwith imageio.get_reader(gif_path) as reader:\n    for i, frame in enumerate(reader):\n\
  \        if len(images) < 5:\n            if np.random.rand() > 0.75:\n        \
  \        images.append(frame)\n                print(f\"Frame {i + 1} shape: {frame.shape}\"\
  )\nplt.imshow(np.hstack(images)), plt.axis('off')\nplt.title('frames selected from\
  \ the animated GIF', size=12); plt.show()\n# Frame 5 shape: (512, 512, 4)\n# Frame\
  \ 6 shape: (512, 512, 4)\n# Frame 26 shape: (512, 512, 4)\n# Frame 30 shape: (512,\
  \ 512, 4)\n# Frame 31 shape: (512, 512, 4)\n```\n\n这是运行上述代码片段后你将获得的输出：\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_53_0.png)\n\
  \n*图1.13 – 从动画 GIF 中选择的五帧*\n\n\n\n\n\n使用 ImageIO 可以创建动画 GIF：首先将一系列图像（例如通过 glob.glob()\
  \ 和 imageio.imread() 从文件夹中读取的 PNG 文件）加载到帧列表中，然后用 imageio.get_writer() 初始化一个 GIF\
  \ 写入器，其中 duration 参数控制每帧显示时间，最后遍历帧列表，使用 writer.append_data() 构建动画，生成如 world.gif\
  \ 的输出文件。\n\n现在，请参考以下代码片段：\n\n```\nfrom glob import glob\n# read frames for the animation\n\
  frames = [imageio.imread(f) for f in glob('images/world/*.png')]\n# Save frames\
  \ as an animated GIF\nwith imageio.get_writer('images/world.gif', duration=0.1)\
  \ as writer:\n    for frame in frames:\n        writer.append_data(frame)\n```\n\
  \n#### Python 中的图像文件格式与转换\n\n图像可以以多种文件格式存储，每种格式具有不同的压缩策略、颜色支持和使用场景。常见格式包括 BMP（未压缩的光栅图像，体积大，支持\
  \ 8/24/32 位颜色深度，可选 alpha 通道）、PNG（无损压缩，支持透明度，适合网络图形和锐利边缘）、JPEG（有损压缩，针对具有平滑渐变的照片进行了优化，但不支持透明度）、GIF（限于\
  \ 256 种颜色，支持无损压缩和动画）、PPM/PNM（简单的未压缩格式，文件体积非常大，很少使用）以及 TIFF（高质量、灵活的格式，支持无损压缩、图层和元数据，广泛用于专业成像）。\n\
  \n下表说明了位深度如何影响 2 x 2 图像的像素表示：\n\n| 位深度 | 像素值（十进制/二进制） | 图像 |\n|---|---|---|\n| 8\
  \ 位 | [[0, 85], [170, 255]]<br>二进制：[[00000000, 01010101], [10101010, 11111111]]\
  \ | [2x2 灰度图像] |\n| 16 位（显示时缩放至 8 位） | [[0, 21845], [43690, 65535]]<br>二进制：[[0000000000000000,\
  \ 0101010101010101], [1010101010101010, 1111111111111111]] | [2x2 灰度图像] |\n\n表 1.1：位深度与像素表示\n\
  \n## 转换文件格式\n\n尽管格式不同，Python 图像库会抽象掉元数据，并允许直接访问图像数组以及大小、模式和数据类型等属性。可以使用 PIL 通过以新扩展名保存图像（例如，从\
  \ PNG 转换为 JPG）来执行格式转换，如下一个代码片段所示：\n\n```\nim = Image.open(\"images/parrot.png\"\
  )\nprint(im.mode)\n# RGB\nim.save(\"images/parrot.jpg\")\n```\n\nRGBA 模式的 PNG 图像必须先转换为\
  \ RGB，然后才能保存为 JPEG，因为 JPEG 不支持 alpha 通道，如下一个代码片段所示。\n\n```\nim = Image.open(\"images/hill_alpha.png\"\
  )\nprint(im.mode)\n# RGBA\nim.convert('RGB').save(\"images/hill.jpg\") # first convert\
  \ to RGB mode\n```\n\n## 图像类型（模式）\n\n图像可以根据表示每个像素所使用的通道数进行分类。\n\n- 单通道图像：每个像素由一个值表示：\n\
  \  - 二值（单色）图像：每个像素使用一个位（0 或 1）存储。\n  - 灰度图像：每个像素通常使用 8 位，强度值范围为 [0,255]。\n- 多通道图像：每个像素由一个值元组表示，例如：\n\
  \  - RGB / HSV 图像：像素分别以 (R, G, B) 表示红、绿、蓝强度，以 (H, S, V) 表示色调、饱和度（色彩丰富度）和明度（亮度），其中\
  \ HSV 提供了更符合感知的颜色模型。\n  - RGBA 图像：四通道图像，表示为 (r, g, b, α)，其中 α 表示透明度。\n  - 索引颜色（调色板）图像：像素存储的是颜色调色板中的索引，而不是直接的\
  \ RGB 值。这样可以减少存储空间，常用于 GIF 图像。\n\n## 使用 PIL 转换图像模式\n\nPIL/Pillow 支持多种图像模式，包括：\n\n\
  - 1：1 位像素，黑白，每个像素存储为一个字节\n- L：8 位像素，黑白\n- P：8 位像素，通过调色板映射到任何其他模式\n- RGB：3 x 8 位像素，真彩色\n\
  - RGBA：4 x 8 位像素，带透明度的真彩色\n- CMYK：4 x 8 位像素，分色\n- F：32 位浮点像素\n\n## 从 RGB 转换为二值模式\n\
  \n我们可以使用 PIL.Image 中的 convert() 方法，通过下面这行代码将 RGB 图像转换为二值图像（模式为 '1'）：\n\n```\nImage.open('images/parrot.png').convert('1',\
  \ dither=Image.FLOYDSTEINBERG)\n```\n\n如果你运行上面这行代码，应该会得到类似下面这样的图像：\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_56_0.png)\n\
  \n图 1.14 – 使用 Floyd-Steinberg 抖动生成的二值图像\n\n## 注意\n\n上面的二值图像仅使用两种不同的像素值（即黑色和白色；如果转换为\
  \ NumPy ndarray，会产生一个 bool 数组），但它看起来仍然接近原始图像，并且没有太多信息损失，因为它使用了抖动算法（这里为 FLOYD-STEINBERG），我们将在第\
  \ 6 章（图像增强章节）中详细讨论：\n\n```\nnp.unique(np.array(Image.open('images/parrot.png').convert('1')))\n\
  # array([False, True], dtype=bool)\n```\n\n## 从 RGB 转换为调色板模式，再转换回来\n\n在调色板（\"P\"\
  ）模式下，像素存储的是映射到查找表中 RGB 颜色的索引。每个像素的值并不是直接的颜色，而是一个对独立调色板列表的引用（例如，一个 0–255 的整数索引），该列表包含实际的\
  \ RGB 值。当颜色总数较少时，这种映射有助于压缩图像大小，这也是 GIF 等格式使用该技术的原因。下表直观地说明了调色板模式如何作用于一张 2 x 2（RGB）彩色图像，以及图像中的每个像素如何持有一个映射到调色板中实际颜色的索引值：\n\
  \n## 注意\n\n前面的代码可以使用 NumPy 进行向量化，从而消除 for 循环，这样会获得更好的性能和更简洁的语法：\n\n```\npalette_array\
  \ = np.array(palette, dtype=np.uint8)\nmodified_palette = (palette_array + 19) %\
  \ 256\nimage_palette.putpalette(modified_palette.tolist())\n```\n\n你可以分别使用 getdata()\
  \ 和 putdata() 方法获取原始和修改后的像素数据；尝试将它们作为练习。\n\n## 向 PNG 图像添加 alpha 通道（RGB 到 RGBA）\n\
  \nalpha 通道表示透明度。在下一个代码片段中，putalpha() 方法将灰度蒙版用作透明度。图像 parrot.png 被加载并转换为 RGBA。图像\
  \ Ishihara.png（常用于检测色盲）被加载并转换为灰度（L 模式），使用 ImageOps.invert() 进行反相，调整大小，然后用作 alpha\
  \ 蒙版。随后 putalpha() 应用透明度蒙版，结果保存为 parrot_alpha.png。蒙版中较亮的区域变得更不透明，而较暗的区域变得更透明。\n\n\
  ```\nfrom PIL import ImageOps\nim = Image.open('images/parrot.png').convert('RGBA')\n\
  im_alpha = ImageOps.invert(Image.open(\"images/Ishihara.png\").convert('L'))\nim.putalpha(im_alpha.resize((im.width,\
  \ im.height)))\nim.save('images/parrot_alpha.png')\nim # run in jupyter notebook\n\
  # RGB <ImagingCore object at 0x0000015375A334F0>\n```\n\n如果你运行上面的代码片段，应该会得到类似下面这样的图：\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_58_0.png)\n\n图 1.16 – 使用 PIL 将 Ishihara\
  \ 图像强度作为 alpha 通道值添加到 parrot 图像\n\n## 使用 scikit-image 转换模式\n\n使用 `skimage.io.read(...,\
  \ as_gray=True)` 可以直接将图像读取为二维灰度图像：\n\n```python\nim = imread(\"images/parrot.png\"\
  , as_gray=True)\n```\n\n`color.rgb2gray()` 函数也可以将 RGB 图像转换为灰度图像：\n\n```python\n\
  im = imread(\"images/Ishihara.jpeg\")\nim_g = color.rgb2gray(im)\n# Plot color and\
  \ grayscale Ishihara image (im, im_g) here side-by-side\n```\n\n然而，灰度转换可能会丢失重要的颜色信息。例如，在石原氏色盲测试图中，RGB\
  \ 图像中可见的数字在灰度转换后可能几乎不可见，如下图所示。\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_59_0.png)\n\
  \n*图 1.17 – 用于色盲测试的图像，使用 skimage.color 转换为灰度*\n\n## 图像数据类型与转换\n\n在 Python 图像处理中，图像以数组形式存储，其**数据类型**决定了像素值范围、数值精度、内存占用和算术行为。下表总结了常见的图像（NumPy）数据类型：\n\
  \n| 数据类型 | 描述 | 值范围 | 使用示例 |\n|---|---|---|---|\n| `uint8` | 8 位无符号整数 | 0 到 255\
  \ | 标准彩色图像 |\n| `float32` | 32 位浮点数 | 0.0 到 1.0（归一化） | 归一化处理 |\n| `bool` | 布尔型 |\
  \ True 或 False | 二值掩码 |\n\n表 1.3：常见图像数据类型\n\n## 检查图像的数据类型\n\n下面是一个示例代码：\n\n```python\n\
  im = imread('images/parrot.png')  # automatically returns uint8\nprint(\"Image dtype:\"\
  , im.dtype, \"range\", im.min(), \"to\", im.max())\n# Image dtype: uint8, range:\
  \ 0 to 255\n```\n\n\n\n\n\n# 数据类型之间的转换\n\n```\nim_float = im.astype(np.float32)\
  \ / 255.0 # Normalize float [0, 1]\nprint(\"Float dtype:\", im_float.dtype)\nprint(\"\
  New range:\", im_float.min(), \"to\", im_float.max())\n# Float dtype: float32\n\
  # New range: 0.0 to 1.0\n```\n\n## 注意：溢出与裁剪\n\n当对 uint8 图像进行操作时，进行算术运算需要格外小心：\n\n\
  ```\nbright = im + 100 # Wrong: causes overflow if dtype is uint8\n```\n\n这会因溢出而发生回绕（例如，250\
  \ + 100 = 94）。\n\n以下是正确的做法：\n\n```\nbright = np.clip(image.astype(np.int16) + 100,\
  \ 0, 255).astype(np.uint8)\n```\n\n下面这种做法甚至更好：\n\n```\nim_float = im.astype(np.float32)\
  \ / 255.0\nbright_float = np.clip(im_float + 0.4, 0.0, 1.0)\n```\n\n## 使用布尔图像生成二值掩码\n\
  \n在图像分割或阈值化处理中，你通常需要生成布尔掩码，如下一个代码片段所示：\n\n```\ngray = rgb2gray(image)  # Returns\
  \ float image [0, 1]\nmask = gray > 0.5        # Boolean mask\nprint(\"Mask dtype:\"\
  , mask.dtype)  # Output: bool\n# Mask dtype: bool\n```\n\n## 专业提示\n\n使用 `skimage.img_as_float`\
  \ 和 `skimage.img_as_ubyte` 来进行安全转换：\n\n```\nfrom skimage import img_as_float, img_as_ubyte\n\
  im_float = img_as_float(im)  # converts safely to float [0,1]\nim_uint8 = img_as_ubyte(im_float)\
  \  # converts safely back to uint8\n```\n\n请记住，OpenCV-Python 在图像处理中主要使用 NumPy 数组。以下是一些常见的\
  \ OpenCV 数据类型与其对应的 NumPy 数据类型之间的映射关系：\n\n- cv2.CV_8U（8位无符号整数）：numpy.uint8\n- cv2.CV_32F（32位浮点数）：numpy.float32\n\
  - cv2.CV_64F（64位浮点数）：numpy.float64\n\n# 颜色空间\n\n颜色空间是利用坐标系对颜色进行数学表示的一种方式，它能够实现高效的图像表示、操作和分析。不同的颜色空间是为不同的图像处理任务而设计的，因为没有任何单一的表示方法对所有应用都是最优的。\n\
  \n常用的颜色空间包括以下几种：\n\n- **RGB（红、绿、蓝）**：电子显示器和一般图像处理中使用的标准加色模型。\n- **HSV（色相、饱和度、明度）**：将颜色、色彩饱和度和亮度分离，适用于颜色过滤、分割和颜色操作。\n\
  - **CMYK（青、品红、黄、黑）**：主要用于印刷和出版领域的减色模型。\n- **Lab（CIELAB）**：使用亮度（L*）和对立色通道（a、b）来表示颜色。它在感知上是均匀的，广泛用于颜色校正和比较。\n\
  - **YUV**：分离亮度和色度分量，能够实现高效的视频压缩和广播。\n- **YCbCr**：将亮度（Y）与色度（Cb、Cr）分离，广泛用于JPEG、MPEG和数字视频压缩中。\n\
  - **YIQ**：NTSC标准中使用的一种电视广播颜色模型，将亮度和色度信息分离。\n\n不同的颜色空间会强调不同的图像特性，例如亮度、色度、感知均匀性或压缩效率。例如，RGB\
  \ 直观且对硬件友好，HSV 简化了基于颜色的阈值处理，Lab 与人类颜色感知紧密对齐，YUV/YCbCr 提高了压缩效率，而灰度则降低了 OCR 和边缘检测等任务的计算复杂度。\n\
  \n选择合适的颜色空间取决于应用需求、计算需求以及与图像处理任务相关的感知特性。\n\n我们可以使用仿射映射在颜色空间之间进行转换。下面的矩阵表示从 RGB 到\
  \ YIQ 颜色空间的线性映射：\n\nRGB 到 YIQ\n[ Y ]   [ 0.299   0.587   0.114 ] [ R ]\n[ I ] =\
  \ [ 0.596  -0.274  -0.322 ] [ G ]\n[ Q ]   [ 0.211  -0.523   0.312 ] [ B ]\n\nYIQ\
  \ 到 RGB\n[ R ]   [ 1   0.956   0.621 ] [ Y ]\n[ G ] = [ 1  -0.272  -0.647 ] [ I\
  \ ]\n[ B ]   [ 1  -1.106   1.703 ] [ Q ]\n\nFigure 1.18 – 颜色空间变换矩阵\n\n# 颜色色域\n\n\
  颜色色域是指设备或系统能够重现或显示的颜色范围，通常表示为颜色空间中由原色定义的可见光谱的一个子集。更宽的色域能够实现更丰富、更准确的颜色再现，这在摄影、成像和显示技术等应用中非常重要。了解颜色色域有助于在不同设备和媒体之间保持一致且忠实的颜色表示。\n\
  \n**colour-science** Python 库可用于通过 `plot_chromaticity_diagram_CIE1931()` 函数，借助 **CIE\
  \ 1931 色度图** 可视化颜色色域。使用 `pip install colour-science` 安装该包后，该函数会生成一个二维色度图，使用 x 和\
  \ y 色度坐标表示可感知的颜色。该图在颜色科学、显示技术、照明和图像处理应用中被广泛使用。\n\n```python\n# pip install colour-science\n\
  from colour.plotting import plot_chromaticity_diagram_CIE1931\nplot_chromaticity_diagram_CIE1931();\
  \ plt.show()\n```\n\n如果你运行前面的代码，它将会生成如下所示的一幅输出图像：\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_62_0.png)\n\
  \n*Figure 1.19 – CIE 1931 色度图*\n\n# 色度图的应用\n\nCIE 色度图在颜色科学和技术领域有着广泛的实际应用，包括以下几种：\n\
  \n- **颜色显示校准：** 该图通过将设备（例如显示器）的色域与人类感知进行比较，帮助校准设备。\n- **照明体与光源比较：** 该图可以显示不同照明体或光源的色度坐标。\n\
  - **颜色研究：** 有助于研究颜色如何被感知，以及不同光照条件如何影响颜色外观。\n\n# 在颜色空间之间进行转换\n\n我们可以使用库函数在颜色空间之间进行转换。例如，下一小节中的代码使用\
  \ `color.rgb2hsv()` 函数，将 RGB 颜色空间转换为 HSV 颜色空间图像。\n\n## RGB 转 HSV\n\nHSV 颜色空间通常更适合用于颜色过滤或对象跟踪等任务，因为这样可以更轻松地分离颜色属性。下图对\
  \ RGB 和 HSV 颜色空间进行了比较。RGB 立方体（左）将颜色表示为红、绿、蓝强度的组合，形成一个立方体，每个轴对应一个颜色通道。HSV 圆柱体（右）则更符合人类感知的方式对颜色进行建模，其中\
  \ *Hue*（色调）为角度，*Saturation*（饱和度）为半径，*Value*（明度）为高度，如下图所示：\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_63_0.png)\n\
  \n*Figure 1.20 – RGB 与 HSV 颜色空间对比*\n\n我们可以使用下一个代码片段中的 `color.rgb2hsv()` 函数，将 RGB\
  \ 图像转换为 HSV 颜色空间。下图显示了通过运行以下代码片段创建的鹦鹉 HSV 图像：\n\n```\nim = imread(\"images/parrot.png\"\
  )\nim_hsv = color.rgb2hsv(im)\n# plot 3 channels of im_hsv here (e.g., im_hsv[...,0])\
  \ side-by-side here\n```\n\n如果你运行上述代码片段，你应该会得到类似下图的结果：\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_63_1.png)\n\
  \n*Figure 1.21 – 显示 HSV 颜色空间中的色相、饱和度和明度通道*\n\n## RGB 转 YUV\n\n类似地，我们可以使用下面的代码，借助\
  \ color.rgb2yuv() 函数将 RGB 颜色空间转换为 YUV 颜色空间：\n\n```\nim_yuv = color.rgb2yuv(im)\n\
  imsave('images/parrot_yuv.png', (255*im_yuv).astype(np.uint8))\n```\n\n下图显示了使用上述代码创建的鹦鹉\
  \ YUV 图像，以及来自 RGB 颜色空间的原始红、绿、蓝通道：\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_64_0.png)\n\
  \nFigure 1.22 – 显示 YUV 与 RGB 通道的对比\n\n## RGB 转 CMYK\n\n与 RGB（加色颜色空间）相反，CMYK 是一种减色光谱。这意味着这些油墨会在较浅的背景下（如白纸）遮蔽颜色。CMYK\
  \ 油墨从白光中减去红、绿、蓝，留下青、品红和黄。黑色是颜色的缺失。RGB 颜色在屏幕上可能看起来很棒，但在将你的美术文件提供给打印机之前，需要将它们转换为 CMYK\
  \ 颜色空间。\n\n下图显示了从 RGB 转换为 CMYK 的公式：\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_64_1.png)\n\
  \nFigure 1.23 – 从 RGB 到 CMYK 颜色空间的转换公式\n\n\n\n\n\n让我们使用 `rgb2cmyk()` 函数将图像从 RGB\
  \ 转换为 CMYK，如以下代码片段所示。首先从输入图像中提取 R、G 和 B 通道。将 rgb `[0,255]` 转换为 cmy `[0,1]`。提取黑色分量\
  \ k。最后，将 CMYK 值转换为所需的 `[0, CMYK_SCALE]` 范围以便存储或处理。\n\n```\n```python\nRGB_SCALE,\
  \ CMYK_SCALE = 255, 100\n\ndef rgb2cmyk(x):\n    r, g, b = x[...,0], x[...,1], x[...,2]\n\
  \    c, m, y = 1 - r / RGB_SCALE, 1 - g / RGB_SCALE, 1 - b / RGB_SCALE\n    min_cmy\
  \ = np.minimum(np.minimum(c, m), y)\n    c, m, y, k = (c - min_cmy) / (1 - min_cmy),\
  \ \\\n                  (m - min_cmy) / (1 - min_cmy), \\\n                  (y\
  \ - min_cmy) / (1 - min_cmy), min_cmy\n    return np.dstack((c * CMYK_SCALE, m *\
  \ CMYK_SCALE, y * CMYK_SCALE, \\\n                      k * CMYK_SCALE))\n\nim =\
  \ plt.imread('images/rgb_cmyk_t.png')\nim_cmyk = rgb2cmyk(im)\n```\n```\n\n下图显示了使用原始输入图像的\
  \ RGB 和 CMYK 图像的输出通道；输出结果符合预期且不言自明。将绘图作为练习留给读者（参考 github）。\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_65_0.png)\n\
  \n*图 1.24 – CMYK 与 RGB 色彩空间*\n\n下图显示了鹦鹉 RGB 图像的 CMYK 通道。\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_65_1.png)\n\
  \n*图 1.25 – 在 CMYK 色彩空间中显示鹦鹉图像的四个通道*\n\n## HSV 色彩空间中的色彩增强\n\n现在让我们在图像的 HSV 色彩空间表示中更改色相、饱和度和明度通道（例如，使用\
  \ `multiply_channel_hsv()` 函数将相应通道值乘以一个因子，并使用以下代码片段将大于 1 的值裁剪至 1）。观察当分别增加饱和度和明度通道时图像颜色如何得到增强。我们需要将\
  \ RGB 图像转换为 HSV，修改其中一个通道，然后转换回 RGB：\n\n```\ndef multiply_channel_hsv(im, i, f):\n\
  \    im_hsv = color.rgb2hsv(im)\n    im_hsv[...,i] = np.minimum(f*im_hsv[...,i],\
  \ 1)\n    return color.hsv2rgb(im_hsv)\n\nim = imread('images/parrot.png')\nplot_images([im,\
  \ multiply_channel_hsv(im, 0, 3), \\\n                multiply_channel_hsv(im, 1,\
  \ 2.5), \\\n                multiply_channel_hsv(im, 2, 2)], \\\n    ['original',\
  \ 'hue changed', 'saturation enhanced', 'value enhanced'])\n```\n\n如果运行上述代码片段，你应该会得到如下图所示的结果：\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_66_0.png)\n\n图 1.26 – 使用 HSV 色彩空间增强 RGB\
  \ 图像的色彩\n\n## HSV 色彩空间中灰度图像的着色\n\n给图像着色是指对整个图像应用色彩偏色或色相，从而改变其整体颜色。着色通常是通过在原始图像上叠加一层半透明的颜色层来实现的，从而改变整个场景的外观。人工给灰度图像着上某种颜色在突出图像特定区域或只是让灰度图像更生动时非常有用。在本节中，我们将通过缩放\
  \ RGB 值并在 HSV 色彩空间中调整颜色来演示图像着色。\n\n## 显示色相渐变\n\n首先，让我们使用以下代码片段显示色相渐变，使用来自 skimage.color\
  \ 模块的 `hsv2rgb()` 函数。注意图像范围被设置为使色相从 0 到 1，并且图像具有良好的宽高比：\n\n```\nhue_gradient = np.linspace(0,\
  \ 1)\nhsv = np.ones(shape=(1, len(hue_gradient), 3), dtype=float)\n```\n\n```\n\
  hsv[:, :, 0] = hue_gradient\nall_hues = color.hsv2rgb(hsv)\nfig, ax = plt.subplots(figsize=(5,\
  \ 2))\nax.imshow(all_hues, extent=(0 - 0.5 / len(hue_gradient), \\\n    1 + 0.5\
  \ / len(hue_gradient), 0, 0.2))\n```\n\n如果运行上述代码片段，你应该会得到如下图所示的结果：\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_67_0.png)\n\
  \n图 1.27 – 色相渐变\n\n## 使用复古风格给灰度图像上色\n\n让我们定义 `colorize()` 函数，它将给定色相的颜色添加到灰度图像中。默认情况下，饱和度设置为\
  \ 1，以便颜色更突出。通过降低饱和度（例如 0.3）并使用 `np.linspace()` 色相渐变获得的不同色相值，可以赋予其复古风格：\n\n```\n\
  def colorize(im, hue, saturation=1):\n    hsv = color.rgb2hsv(im)\n    hsv[:, :,\
  \ 1], hsv[:, :, 0] = saturation, hue\n    return color.hsv2rgb(hsv)\n\nim = gray2rgb(imread('images/man.png',\
  \ as_gray=True))\nhue_rotations = np.linspace(0, 1, 6)\nfig, axes = plt.subplots(nrows=1,\
  \ ncols=7, sharex=True, sharey=True)\naxes[0].imshow(im); axes[0].set_title('grayscale')\n\
  for ax, hue in zip(axes.flat[1:], hue_rotations):\n    tinted_im = colorize(im,\
  \ hue, saturation=0.3)\n    ax.imshow(tinted_im, vmin=0, vmax=1); ax.set_axis_off()\n\
  ```\n\n上述代码将输入图像作为灰度图像读取，使用 `gray2rgb()` 函数将图像转换为 RGB 图像，然后使用 HSV 色彩空间应用基于不同色相的着色。\n\
  \n如果运行上述代码片段，你应该会得到如下图所示的结果：\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_67_1.png)\n\
  \n图 1.28 – 将灰度图像着色为复古风格\n\n## 使用 HSV 操作创建色彩突出效果\n\n色彩突出效果通过将图像的大部分转换为灰度，同时保留选定的颜色，从而营造出戏剧性的外观。这种技术在\
  \ HSV 色彩空间中很容易实现，其中将饱和度通道降低到零即可产生灰度区域。\n\n下面的代码片段将 RGB 图像转换为 HSV，根据色相值过滤像素，并将除选定颜色外的所有区域的饱和度通道设置为零。由于橙色类颜色通常具有较低的色相值，保留色相\
  \ ≤ 0.09 的像素可保留人脸肤色，同时将剩余区域转换为灰度。修改后的 HSV 图像随后转换回 RGB 以获得最终的色彩突出效果。\n\n```\nim =\
  \ imread('images/me.jpg')\nim = im / im.max()  # normalize\nim_hsv = color.rgb2hsv(im)\n\
  im_gray = im_hsv.copy()\nim_gray[...,1] = 0  # set saturation of the pixels to 0\n\
  im_gray = color.hsv2rgb(im_gray) # creates grayscale image\nim_hsv[im_hsv[...,0]\
  \ > 0.09,1] = 0 #set all but skin pixel saturation to 0\nim_out = color.hsv2rgb(im_hsv)\
  \ # creates RGB image with all but\n# skin pixels grayed out (popping the skin pixels\
  \ out)\nplt.imshow(np.hstack((im,im_gray,im_out)))\n```\n\n如果运行上述代码片段，你应该会得到如下图所示的结果：\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_68_0.png)\n\n图 1.29 – 色彩突出效果，仅显示人脸肤色，其余为灰度\n\
  \n## RGB 色彩空间中的色彩增强\n\n在 RGB 色彩空间中增强色彩对比度的一种方法是增加主导和较弱颜色通道之间的分离，使颜色看起来更鲜艳、更易区分。\n\
  \n在本节中，让我们对 RGB 图像使用变换 c′ = (c/m)^f m 来增强色彩，其中 c ∈ {r, g, b}，m = max(r, g, b)，f\
  \ 控制增强强度。当通道已具有最大强度（c = m）时，它保持不变，而对于 f > 1，较低值的通道会被进一步抑制，从而增加通道间对比度。\n\n下面的代码片段演示了色彩增强，使用\
  \ `enhance_rgb()` 函数提取 RGB 通道，使用 `np.maximum()` 计算每个像素的最大值，并应用非线性增强 (c/m)^f m，然后将增强后的值分配回图像通道。参数\
  \ f=4 控制增强水平。演示加载了使用 `imread()` 的 RGB 伊希哈拉图像，使用 `enhance_rgb()` 应用增强，使用 `color.rgb2gray()`\
  \ 将原始图像和增强图像都转换为灰度，并使用 `plot_images()` 可视化它们。增强后的灰度图像揭示了在原始图像灰度版本中几乎不可见的数字。\n\n\
  ```\ndef enhance_rgb(im, f=4):\n    r, g, b = im[...,0], im[...,1], im[...,2]\n\
  \    m = np.maximum(np.maximum(r, g), b)\n    im[...,0], im[...,1], im[...,2] =\
  \ (r/m)**f*m, (g/m)**f*m, \\\n                                    (b/m)**f*m\n \
  \   return im\n\nim = imread('images/Ishihara.png')\nim_en = enhance_rgb(im)\nplot_images([im,\
  \ color.rgb2gray(im), im_en, color.rgb2gray(im_en)], \\\n            ['original',\
  \ 'grayscale from original', 'enhanced image', \\\n             'grayscale from\
  \ enhanced'])\n```\n\n如果运行上述代码片段，你应该会得到如下图所示的结果：\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_69_0.png)\n\
  \n图 1.30 – 增强 RGB 到灰度的转换\n\n## Lab 色彩空间中的色彩偏移\n\n现在，让我们在图像的 Lab 色彩空间表示中更改亮度 L 和颜色\
  \ a、b 通道（例如，使用 `add_channel_lab()` 函数通过给定的偏移值 x 增加相应通道值）使用以下代码片段。观察当 a 通道值增加 10\
  \ 时图像颜色如何偏移（导致红调图像），以及当 b 通道值减少 25 时图像颜色如何偏移（导致冷调图像）。当 L 通道值增加时，图像的亮度也会增加，如下图所示。我们需要转换\n\
  \n\n将 RGB 图像转换为 Lab，修改其中一个通道，再将其转换回 RGB：\n\n```python\ndef add_channel_lab(im, i,\
  \ x):\n    im_lab = color.rgb2lab(im)\n    im_lab[...,i] = x + im_lab[...,i]\n \
  \   return color.lab2rgb(im_lab)\n\nim = imread('images/scene.jpg')\nplot_images([im,\
  \ add_channel_lab(im, 0, 50), \\\n             add_channel_lab(im, 1, 10), \\\n\
  \             add_channel_lab(im, 2, -25)], \\\n            ['original', 'luminosity\
  \ changed', 'red tinted', 'cooled'])\n```\n\n如果运行上述代码片段，您应该会得到类似下图的结果：\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_70_0.png)\n\
  \n*图 1.31 – Lab 颜色空间中的颜色偏移*\n\n## 使用 HSV 和 YCbCr 颜色空间进行肤色检测\n\n肤色检测识别不同颜色空间中位于预定义肤色范围内的像素。以下实现同时使用\
  \ HSV 和 YCbCr 颜色空间以提高鲁棒性。输入 BGR 图像通过 `cv2.cvtColor()` 进行转换，并使用 `cv2.inRange()` 根据预定义的上下阈值生成二值肤色掩码：\n\
  \n$$HSV_{lower}, HSV_{upper},\\quad YCbCr_{lower}, YCbCr_{upper}$$\n\n处于指定范围内的像素被标记为肤色（1），而其他像素被抑制（0）。形态学开运算（`cv2.morphologyEx()`）去除小的噪声区域，`cv2.medianBlur()`\
  \ 则对最终掩码进行平滑。使用 `np.bitwise_and()` 组合这两个掩码，以获得更可靠的全局肤色掩码。\n\n函数 `detect_skin_color()`\
  \ 接受一个 BGR 图像（`np.ndarray`），并返回原始 RGB 图像以及基于 HSV、基于 YCbCr 和组合的肤色检测输出。类型提示提高了可读性，并有助于编辑器辅助的错误检查，尽管它们在\
  \ Python 中是可选的。\n\n最终的可视化使用 Matplotlib 将原始图像与来自 HSV、YCbCr 以及组合掩码的检测结果并排显示。\n\n```python\n\
  # Constants for HSV and YCrCb skin detection thresholds\nHSV_LOWER, HSV_UPPER =\
  \ (0, 15, 0), (17, 170, 255)\n\nYCrCb_LOWER, YCrCb_UPPER = (0, 135, 85), (255, 180,\
  \ 135)\n\ndef detect_skin_color(img: np.ndarray) -> tuple[np.ndarray, np.ndarray,\
  \ np.ndarray, np.ndarray]:\n    img_HSV = cv2.cvtColor(img, cv2.COLOR_BGR2HSV)\n\
  \    HSV_mask = cv2.inRange(img_HSV, HSV_LOWER, HSV_UPPER)\n    HSV_mask = cv2.morphologyEx(HSV_mask,\
  \ cv2.MORPH_OPEN, np.ones((3,3), np.uint8))\n    img_YCrCb = cv2.cvtColor(img, cv2.COLOR_BGR2YCrCb)\n\
  \    YCrCb_mask = cv2.inRange(img_YCrCb, YCrCb_LOWER, YCrCb_UPPER)\n    YCrCb_mask\
  \ = cv2.morphologyEx(YCrCb_mask, cv2.MORPH_OPEN, np.ones((3,3), np.uint8))\n   \
  \ global_mask = np.bitwise_and(YCrCb_mask,HSV_mask)\n    global_mask = cv2.medianBlur(global_mask,3)\n\
  \    global_mask = cv2.morphologyEx(global_mask, cv2.MORPH_OPEN, np.ones((4,4),\
  \ np.uint8))\n    img_RGB = cv2.cvtColor(img, cv2.COLOR_BGR2RGB)\n    out_HSV =\
  \ cv2.cvtColor(img & cv2.merge([HSV_mask]*3), cv2.COLOR_BGR2RGB)\n    out_YCrCb\
  \ = cv2.cvtColor(img & cv2.merge([YCrCb_mask]*3), cv2.COLOR_BGR2RGB)\n    out_global\
  \ = cv2.cvtColor(img & cv2.merge([global_mask]*3), cv2.COLOR_BGR2RGB)\n    return\
  \ img_RGB, out_HSV, out_YCrCb, out_global\n\nimg = cv2.imread(\"images/cycling.png\"\
  )\nimg_RGB, out_HSV, out_YCrCb, out_global = detect_skin_color(img)\nplt.imshow(np.hstack((img_RGB,\
  \ out_HSV, out_YCrCb, out_global)))\n```\n\n如果运行上述代码片段，您将得到如下图所示的输出：\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_71_0.png)\n\
  \n*图 1.32 – 使用不同颜色空间进行肤色检测*\n\n> **注意**\n>\n> 该函数明确使用了**类型提示**（例如，`img: np.ndarray`\
  \ 和 `tuple[np.ndarray, ...]` 返回类型）。类型提示（Python 3.5 引入）提高了代码可读性，支持在现代编辑器（如 VS Code\
  \ 或 PyCharm）中进行更好的错误检查和自动补全，并使函数的输入输出预期更加清晰，尤其在协作或大型项目中。然而，由于 Python 本质上是一种动态类型语言（即类型在运行时解析），类型提示是可选的，不会影响代码在运行时的功能。\n\
  \n正如我们已经讨论过的，PIL 使用 Image 对象来存储图像，而 scikit-image 使用 NumPy ndarray 数据结构来存储图像数据。下一节将介绍如何在这两种数据结构之间进行转换。\n\
  \n## 转换图像数据结构\n\n以下代码块展示了如何从 PIL Image 对象转换为 NumPy ndarray（供 scikit-image 使用）：\n\
  \n```python\nim = Image.open('images/flowers.jpg')  # read image into Image object\
  \ (PIL)\nim = np.array(im)  # create a numpy ndarray from the Image object\n```\n\
  \n以下代码块展示了如何从 NumPy ndarray 转换为 PIL Image 对象。运行后，代码显示的输出与前述图形相同：\n\n```python\n\
  im = imread('images/flowers.png')  # read image into numpy ndarray\nim = Image.fromarray(im)\
  \  # create a PIL Image object from the numpy ndarray\n#im.show() # display the\
  \ image with PIL Image.show() method\n```\n\n现在我们已经了解了如何将图像加载到内存中，接下来介绍一些基本的图像处理方法。\n\
  \n## 图像数组坐标与绘图坐标\n\n在 Python 中处理图像时，重要的是要理解**数组索引**和**绘图坐标**在表示空间数据时并不总是一致的。这种差异在可视化或处理图像时可能会引起混淆，尤其是在像素操作、绘图或叠加图形等任务中。\n\
  \n### 图像数组坐标（NumPy 风格）\n\n在 NumPy 中，图像被视为多维数组。这意味着：\n\n- 第一个索引对应于行（Y 轴），方向为从上到下；第二个索引对应于列（X\
  \ 轴），方向为从左到右；原点 `(0,0)` 位于图像的左上角像素；Y（行）向下增大；X（列）向右增大。\n\n### 绘图坐标（Matplotlib 风格）\n\
  \nMatplotlib 的常规绘图函数（例如 `plt.plot()` 和 `plt.scatter()`）使用标准笛卡尔坐标：原点 `(0,0)` 默认位于左下角，X\
  \ 向右增大，Y 向上增大。然而，使用 `plt.imshow()` 显示图像时，图像仍按从上到下的方式显示（原点在左上角），除非另行指定。下表总结了坐标系之间的差异：\n\
  \n| 特性 | NumPy 数组 | Matplotlib 绘图 |\n|---|---|---|\n| 索引格式 | (row, col) = (y, x)\
  \ | (x, y) |\n| 原点（默认） | 左上 | 左下 |\n| Y 轴方向 | 从上到下 | 从下到上（除非 origin='upper'） |\n\
  | 用途 | 处理与过滤 | 显示与叠加 |\n\n表 1.4：numpy 二维数组与 matplotlib 绘图的坐标系\n\n## 基本图像处理\n\n不同的\
  \ Python 库可用于基本图像处理。几乎所有库都将图像存储在 NumPy ndarray 中（例如，灰度图像为二维数组，RGB 图像为三维数组）。如前所述，下图显示了彩色蒙娜丽莎图像的正\
  \ x 和 y 方向（原点位于图像二维数组的左上角）：\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_73_0.png)\n\
  \n*图 1.33 – 图像与 NumPy 二维数组坐标的对比*\n\n### 常见的图像处理操作\n\n数字图像处理涉及对图像进行修改以增强外观、改变构图或创建视觉效果。常见操作包括裁剪、缩放、旋转、颜色调整、锐化、模糊、变形以及应用滤镜效果（如棕褐色或灰度）。更高级的操作包括添加文本、移除对象、克隆图像区域以及将多张图像合成为合成场景。本书将使用不同的\
  \ Python 图像处理库来实现这些技术中的许多内容。\n\n### 使用 NumPy 进行图像处理\n\nNumPy 是 Python 中用于数值和数组运算的强大库，凭借其数组处理能力，也可用于图像处理。以下小节将介绍一些使用\
  \ NumPy 的基本图像处理任务。\n\n#### 使用数组切片进行裁剪\n\nNumPy 数组切片是指提取数组的一部分或创建包含其部分元素的原始数组视图的过程。下面的代码片段展示了如何使用\
  \ NumPy 数组的切片和掩码操作，先从输入的蒙娜丽莎图像中裁剪出面部区域，然后通过应用圆形掩码隐藏图像的一部分：\n\n```python\nmona =\
  \ plt.imread(\"images/monalisa.jpg\") # read from disk as numpy ndarray\nlx, ly\
  \ = mona.shape[:2]\ncropped_mona = mona[120:210, 160:220, :]  # crop a region\n\
  X, Y = np.ogrid[0:lx, 0:ly]\nmask = (X - lx / 2) ** 2 + (Y - ly / 2) ** 2 > lx *\
  \ ly / 4\nmasked_mona = mona.copy()\nmasked_mona[np.where(mask)] = 0 # masks\n#\
  \ plot mona, cropped_mona and masked_mona side-by-side here\n```\n\n如果运行上述代码片段，您应该会得到类似下图的结果：\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_74_0.png)\n\n*图 1.34 – 使用 NumPy 数组切片裁剪蒙娜丽莎图像*\n\
  \n#### 调整彩色图像的亮度和对比度\n\n对比度和亮度调整是帮助增强图像或修正曝光不足的重要操作。对比度调整放大亮部与暗部之间的差异，而亮度调整则改变图像的整体亮度。亮度和对比度的调整通常在\
  \ Lab 颜色空间中进行，该空间将亮度与颜色信息分离。RGB 图像使用 `rgb2lab()` 转换为 Lab，通过亮度通道（L）进行修改，再使用 `lab2rgb()`\
  \ 转换回 RGB。\n\n\n\n\n**调整亮度：** 亮度调整会统一移动亮度值：\n\n$L'(x,y)=\\operatorname{clip}(L(x,y)+\\\
  beta,0,255)$\n\n其中*移位参数* $\\beta>0$ 使图像变亮，而 $<0$ 则使其变暗。`adjust_brightness()` 函数通过向\
  \ Lab 颜色空间中的 L 通道（`im_lab[...,0]`）添加移位值，并使用 `np.clip()` 约束结果来实现这一点，如下面的代码片段所示：\n\
  \n```\n```python\nfrom skimage.color import rgb2lab, lab2rgb\n\n\ndef adjust_brightness(im,\
  \ shift):\n    im_lab = rgb2lab(im)\n    im_lab[...,0] = np.clip(im_lab[...,0] +\
  \ shift, 0, 255)\n    im_out = lab2rgb(im_lab)\n    return (255*im_out/im_out.max()).astype(np.uint8)\n\
  ```\n```\n\n**调整对比度：** 对比度是指图像中亮部和暗部之间的强度差异。对比度调整按比例缩放亮度差异：\n\n$L'(x,y)=\\operatorname{clip}(\\\
  alpha L(x,y),0,255)$\n\n其中 $\\alpha>1$ 增加对比度，$0<\\alpha<1$ 降低对比度。`adjust_contrast()`\
  \ 函数在转换回 RGB 之前，将 *L通道* 乘以缩放因子。\n\n```\n```python\ndef adjust_contrast(im, scale):\n\
  \    im_lab = rgb2lab(im)\n    im_lab[...,0] = np.clip(im_lab[...,0] * scale, 0,\
  \ 255)\n    im_out = lab2rgb(im_lab)\n    return (255*im_out/im_out.max()).astype(np.uint8)\n\
  ```\n```\n\n下一个代码片段使用 `skimage.io.imread()` 加载图像，使用上述函数生成变亮、变暗、高对比度和低对比度的输出，并使用\
  \ `plt.imshow()` 和 `np.hstack()` 并排显示结果。\n\n```\n```python\nim = imread('images/rabbit.png')[...,:3]\n\
  im_brightened, im_darkened = adjust_brightness(im, 50), \\\n                   \
  \           adjust_brightness(im, -25)\nim_high_contrast, im_low_contrast = adjust_contrast(im,\
  \ 2), \\\n                                     adjust_contrast(mona, 0.25)\nplt.imshow(np.hstack((im,\
  \ im_brightened, im_darkened)))\nplt.imshow(np.hstack((im, im_high_contrast, im_low_contrast)))\n\
  ```\n```\n\n如果运行上述代码片段，你应该会得到类似下面的图形：\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_76_0.png)\n\
  \n## 水平翻转和垂直翻转\n\n使用 `np.flipud()` 和 `np.fliplr()` 函数对输入图像进行垂直和水平翻转，如下一个代码片段所示：\n\
  \n```\n```python\nv_flipped_mona = np.flipud(mona)  # Vertical flip\nh_flipped_mona\
  \ = np.fliplr(mona)  # horizontal flip\nvh_flipped_mona = np.fliplr(v_flipped_mona)\
  \ # both Vert. & horiz. flip\n# Plot images side-by-side with np.hstack() here\n\
  ```\n```\n\n如果运行上述代码片段，你应该会得到类似下面的图形：\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_76_1.png)\n\
  \n## 使用交叉溶解的简单图像变形\n\n一种基本的图像变形形式可以通过 α 混合来实现，其中两张对齐的图像通过线性插值进行组合。给定两张图像 I₁ 和 I₂，中间变形图像计算如下：\n\
  \n$$I_{\\alpha}=(1-\\alpha)I_1+\\alpha I_2,\\qquad \\alpha\\in[0,1].$$\n\n下一个代码片段演示了人脸变形，通过使用\
  \ np.linspace() 将 α 从 0 到 1 进行迭代变化，逐渐将年轻的面部图像（im1）转换为年老的（im2）。每一步都使用 plt.imshow()\
  \ 可视化混合后的图像。\n\n```\nim1 = mpimg.imread(\"images/me_young.jpg\")\nim2 = mpimg.imread(\"\
  images/me_now.jpg\")\ni = 1\nfor alpha in np.linspace(0,1,18):\n    plt.subplot(3,6,i),\
  \ plt.imshow((1-alpha)*im1 + alpha*im2)\n    i += 1\n```\n\n下图显示了使用上述代码通过将一张面部图像交叉溶解为另一张而创建的\
  \ α 混合图像序列。从中间图像序列可以看出，使用简单混合的人脸变形并不是很平滑。在接下来的章节中，我们将看到更高级的图像变形技术。\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_77_0.png)\n\
  \n图 1.37 – 使用 α 混合的简单图像变形\n\n## 使用图像除法去除光照模式\n\n将一张图像除以另一张图像可用于增强图像的某些特征。考虑下面使用\
  \ np.divide() 的示例；你也可以使用 OpenCV-Python 中的 cv2.divide() 函数（自己尝试一下）。如下一个代码片段所示，除法运算可从输入图像中去除光照模式。\n\
  \n```\nimg1 = cv2.imread('images/board_illum_pat.png', 0)\nimg2 = cv2.imread('images/pattern.png',\
  \ 0)\nout = np.divide(img1.astype(float), img2.astype(float)+0.001) #no div by 0\n\
  out = out / (out.max() + epsilon) # 0-1 normalization\nout = (255*out).astype('uint8')\
  \  # for visualization: scale in [0,255]\nplt.imshow(np.hstack((img1, img2, out))),\
  \ plt.axis('off')\n```\n\n如果运行上述代码片段，你应该会得到类似下面的图形：\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_78_0.png)\n\
  \n图 1.38 – 去除图像中（已知的）光照模式\n\n## 应用棕褐色滤镜\n\n棕褐色滤镜为图像应用一种暖棕色-黄色调，产生类似于早期照片的复古外观。该效果通过使用棕褐色变换矩阵变换\
  \ RGB 通道来实现。下一个代码片段演示了棕褐色滤镜，它定义了一个函数 sepia_filter()，该函数接受归一化的 RGB 图像 I(x, y) ∈ [0,1]，并使用\
  \ np.dot() 应用变换：\n\nI_sepia = I · S^T\n\n其中 S 是 3 × 3 棕褐色矩阵：\n\nS = [[0.393 0.769\
  \ 0.189], [0.349 0.686 0.168], [0.272 0.534 0.131]]\n\n这里，np.dot(im, sepia_matrix.T)\
  \ 在每个 RGB 像素向量与棕褐色矩阵之间执行矩阵乘法，将原始颜色转换为棕褐色调。由于该变换可能生成超出有效 RGB 范围的值，np.clip(...,0,1)\
  \ 将强度限制在 [0,1] 内。接下来的代码首先读取并归一化输入图像，应用棕褐色变换，并并排绘制原始图像和棕褐色过滤后的图像。\n\n```\ndef sepia_filter(im):\n\
  \    return np.clip(np.dot(im, np.array([[0.393, 0.769, 0.189], \\\n           \
  \                              [0.349, 0.686, 0.168], \\\n                     \
  \                    [0.272, 0.534, 0.131]]).T), 0, 1)\n\nim = imread('images/sea_beach.jpg')\n\
  im_out = sepia_filter(im / im.max())\nplt.imshow(np.hstack((im, im_out))), plt.axis('off')\n\
  ```\n\n如果运行上述代码片段，你应该会得到类似下面的图形：\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_79_0.png)\n\
  \n*图 1.39 – 将棕褐色滤镜应用于图像（使用 NumPy dot）*\n\n作为额外练习，读者可以使用基于 PIL 的逐像素处理和基于 NumPy 的向量化矩阵运算来实现棕褐色滤镜，并使用\
  \ `time()` 比较它们的执行时间。完整的实现和基准测试代码可在本书的 GitHub 仓库中找到，可以观察到由于向量化，NumPy 方法的执行速度明显更快。\n\
  \n## 使用 Gradio 构建交互式棕褐色滤镜应用程序\n\nGradio 提供了一种为 Python 函数和深度学习模型构建交互式网页演示的简单方式。其高级\
  \ Interface 类封装了一个函数（例如 sepia()），指定输入和输出组件（例如输入图像和输出图像），并使用 launch() 启动本地 Web 服务器。设置\
  \ share=True 会生成一个用于浏览器访问的公共 URL。下一个代码片段演示了使用 Gradio 的交互式棕褐色滤镜应用程序。\n\n```\n```python\n\
  # !pip install gradio -q\nimport gradio as gr\n\n\ndef sepia(input_img):\n    sepia_filter\
  \ = np.array([[0.393, 0.769, 0.189],\n                             [0.349, 0.686,\
  \ 0.168],\n                             [0.272, 0.534, 0.131]])\n    sepia_img =\
  \ input_img.dot(sepia_filter.T)\n    sepia_img /= sepia_img.max()\n    return sepia_img\n\
  \n\ngr.Interface(sepia, gr.Image(), \"image\").launch()\n```\n```\n\n如果运行上述代码片段并选择输入图像，你应该会看到一个弹出窗口，如下一幅图所示：\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_80_0.png)\n\n*图 1.40 – 将棕褐色滤镜应用于图像（使用\
  \ Gradio 界面）*\n\n从前面的图可以看出，Gradio 界面便于快速演示图像处理任务的实现。\n\n## 总结\n\n在本章中，我们介绍了数字图像处理的基本概念以及计算机视觉等相关领域，还介绍了主要的图像处理任务和工作流程。我们讨论了本书中使用的主要\
