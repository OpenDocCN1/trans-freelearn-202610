- "### 6 频域滤波\n\n在本章中，我们将探讨如何在**频域**中对图像进行滤波，这是空间滤波的一种强大替代方案，对于某些任务通常能获得更快、更灵活的结果。我们不会直接在空间域中执行卷积，而是使用傅里叶变换将图像转换到频域，应用滤波器，然后将结果转换回来。我们将在频域中探讨一些滤波技术（这些技术也可使用卷积核（如盒式卷积核或高斯卷积核）通过卷积实现），例如**高通**、**低通**、**带通**和**带阻**滤波器，并通过实际示例展示如何使用\
  \ Python 库实现它们。\n\n从基本问题——什么是滤波器？——开始，我们将研究不同类型的频域滤波器及其行为如何影响图像的噪声、边缘和精细纹理等成分。我们将介绍理想滤波器以及更实用的滤波器，如**巴特沃斯**滤波器和高斯滤波器。你还将学习如何使用\
  \ `scipy.fftpack`、`scikit-image` 和 `fourier_gaussian` 等工具执行这些操作。此外，我们将研究**信噪比（SNR）**如何随截止频率等滤波器参数而变化，并将基于频率的滤波器用于**图像去噪**和**周期性噪声去除**等任务。\n\
  \n在本章的后半部分，我们将转向现代深度学习应用，探索**傅里叶特征网络（FFNs）**——一类利用频率信息来克服平滑性偏差并改进函数逼近的神经网络。我们将讨论其动机、架构和实现，包括**基于傅里叶的位置编码**如何帮助编码高频信号。本章最后将使用\
  \ JAX 进行 FFN 的动手实现。\n\n本章将涵盖的主题如下：\n\n- **低通、高通和带通滤波器** – 使用 Python 实现常用的频域滤波器\n\
  - **傅里叶特征网络** – 使用 TensorFlow 实现的、具有傅里叶特征的图像重建深度学习模型\n\n### 技术要求\n\n以下是本书随附 GitHub\
  \ 仓库中与本章对应的 Jupyter notebook 链接：`https://github.com/PacktPublishing/Hands-On-Image-Processing-and-Computer-Vision-with-Python-Second-Edition/tree/main/Chapter06`。在阅读本章不同部分时，请跟着该\
  \ notebook 操作（并运行必要的代码片段）。为确保代码按预期运行并免受未来弃用或向后不兼容更改的影响，仓库的同一文件夹中提供了 `requirements.txt`\
  \ 文件——请使用 `pip install -r requirements.txt` 安装。\n\n### 频域滤波\n\n如果还记得 *第 1 章* 中描述的图像处理流程，图像采集之后紧接着就是图像预处理。图像常常因强度和照明的随机变化而受损，或对比度较差，因此不能直接使用，需要增强。这正是滤波器的用武之地。\n\
  \n#### 什么是滤波器？\n\n滤波是指变换像素强度值，以揭示某些图像特征，例如：\n\n- **增强：** 这种图像特征提高对比度\n- **平滑：**\
  \ 这种图像特征去除噪声\n- **模板匹配：** 这种图像特征检测已知图案\n\n滤波后的图像由离散卷积描述，滤波器由 *n × n* 离散卷积掩码描述。\n\
  \n频域滤波是图像处理中的一项基础技术，它通过操控图像的频率分量来实现平滑、锐化和降噪等各种效果。与直接操作像素值的空间域滤波不同，频域滤波利用傅里叶变换将图像转换到频域。这样，我们可以根据预期结果选择性地增强或抑制某些频率分量。\n\
  \n在本节中，我们将探讨不同的频域滤波器，包括**理想滤波器、巴特沃斯滤波器和高斯滤波器**及其应用。这些滤波器有助于控制图像细节、增强特征和抑制不需要的噪声。我们将使用\
  \ `scipy` 和 `scipy.ndimage` 等库实现这些滤波器，并展示它们在真实图像上的效果。\n\n### 频域滤波器的类型\n\n从频域的角度来看，滤波器可以是以下四种类型之一：\n\
  \n- **低通滤波器**（用于模糊和降噪）\n- **高通滤波器**（用于边缘增强和锐化）\n- **带通滤波器**（提取特定频率范围以进行特征分析）\n-\
  \ **带阻（陷波）滤波器**（去除特定频率噪声，例如周期性干扰）\n\n\n\n\n\n对于每种类型，实现将使用 **理想**、**巴特沃斯** 和 **高斯**\
  \ 滤波方法。现在，让我们了解每种类型的滤波器，并演示它们在图像处理中的用途。\n\n## 低通滤波器 (LPF)\n\n该滤波器仅允许从图像的频率域表示（使用\
  \ DFT 获得）的低频通过，并阻挡截止值之外的所有高频。图像通过逆 DFT (IDFT) 重建，由于高频分量对应于边缘、细节、噪声等，因此 LPF 倾向于去除这些。下面的表格总结了常见的\
  \ LPF 及其数学公式、特性、优点和局限性。\n\n| Filter Type | Mathematical Expression | Characteristics\
  \ | Pros | Cons |\n|---|---|---|---|---|\n| **Ideal LPF (ILPF)** | $H(u,v)=\\begin{cases}1,&D(u,v)\\\
  leq D_0\\\\0,&D(u,v)>D_0\\end{cases}$ | Sharp transition, removes all high frequencies\
  \ above $D_0$ | Strong smoothing effect, simple to implement | Causes blurring artifacts\
  \ due to sudden cutoff |\n| **Butterworth LPF (BLPF)** | $H(u,v)=\\frac{1}{1+(D(u,v)/D_0)^{2n}}$\
  \ | Smooth transition controlled by order $n$ | Less blurring compared to Ideal\
  \ LPF, adjustable smoothness | Higher computational cost compared to Ideal LPF |\n\
  | **Gaussian LPF (GLPF)** | $H(u,v)=e^{-D^2(u,v)/(2D_0^2)}$ | Very smooth transition,\
  \ no ringing artifacts | No ringing artifacts, best for natural image smoothing\
  \ | Weaker attenuation of high frequencies compared to ILPF and BLPF |\n\n其中我们有\
  \ $D(u,v)=\\sqrt{(u-u_0)^2+(v-v_0)^2}$ 是频率域中相对于原点 $(u_0,v_0)$ 的欧几里得距离。\n\n- $D_0$\
  \ 是截止频率\n- $n$ 是巴特沃斯滤波器的阶数。\n\n首先，让我们开始实现前述表格中描述的一些滤波器。\n\n### 理想、巴特沃斯和高斯 LPF\n\n\
  以下代码在 **频率域** 中实现前述 LPF，并逐一将它们应用于带噪声的输入图像，通过去除添加到输入图像的 **随机噪声** 并通过去除高频分量 (**噪声**)\
  \ 实现平滑 (**去噪**) 效果：\n\n```python\ndef ideal(sz, D0):\n    h, w = sz\n    u, v =\
  \ get_grid(w, h)\n    return dist(u,v) < D0\n\n\ndef gaussian(sz, D0):\n    h, w\
  \ = sz\n    u, v = get_grid(w, h)\n    return np.exp(-(dist(u,v)**2/(2*D0**2)))\n\
  \n\ndef butterworth(sz, D0, n=2):\n    h, w = sz\n    u, v = get_grid(w, h)\n  \
  \  return 1 / (1 + (dist(u,v)/D0)**(2*n))\n\ndef apply_filter(f, func, arg_dict):\n\
  \    F = fp.fftshift(fp.fft2(f))\n    H = func(**arg_dict)\n    G   =  H * F\n \
  \   g   =  np.abs(fp.ifft2(G))\n    g = g / g.max()\n    return F, H, G, g\n```\n\
  \n让我们逐步分解。以下是前述代码的作用：\n\n- `ideal()` 函数实现了 ILPF，截止频率为 D0：半径 D0 内的频率被保留，其他频率设为零。这会产生硬截止，可能导致振铃伪影（**吉布斯现象**）。\n\
  - `gaussian()` 函数实现了 GLPF。频率衰减遵循平滑的指数衰减。这避免了理想 LPF 中出现的振铃伪影。\n- `butterworth()`\
  \ 函数实现了 BLPF。它的过渡比理想 LPF 更平缓，但比高斯更尖锐。n 参数控制滤波器阶数：n 越高，过渡越尖锐。\n- `apply_filter()`\
  \ 函数在频率域中对图像应用滤波函数（使用卷积定理，G(u, v) = F(u, v)H(u, v)）。该函数灵活且支持不同滤波器类型，使用 kwargs (arg_dict)\
  \ 并动态将所需参数传递给相应的滤波函数。下表描述了传递给该函数的输入参数：\n\n| Parameter | Type | Description |\n|---|---|---|\n\
  | f | numpy.ndarray | Input image (grayscale, stored as a 2D array). |\n| func |\
  \ function | A filtering function (e.g., ideal, gaussian, or butterworth). |\n|\
  \ arg_dict | dict | Keyword arguments (kwargs) passed to the filter function. |\n\
  \nFigure 6.2 – Input arguments to the apply_filter function\n\n- 它首先使用 FFT 转换图像，应用滤波器掩码，然后转换回来。下表显示了\
  \ `apply_filter()` 函数的返回值：\n\n| Output | Description |\n|---|---|\n| F | Original\
  \ frequency spectrum of the image (before filtering). |\n| H | The applied filter\
  \ in the frequency domain. |\n| G | Filtered frequency spectrum (after applying\
  \ H). |\n| g | Final processed image after inverse FFT (low-pass filtered image).\
  \ |\n\nFigure 6.3 – Output returned by the apply_filter function\n\n- `dist()` 函数计算相对于中心\
  \ (h/2, w/2) 的欧几里得距离。\n- `get_grid(w, h)` 函数使用 `np.meshgrid()` 函数生成以 (h/2, w/2)\
  \ 为中心的频率网格。它对于傅里叶空间中的基于频率的图像滤波至关重要。\n\n```python\ndef dist(u, v):\n    return np.sqrt(u**2\
  \ + v**2)\n\ndef get_grid(w, h):\n    return np.meshgrid(\n        range(-int(np.floor(w/2)),\
  \ int(np.ceil(w/2))), \\\n        range(-int(np.floor(h/2)), int(np.ceil(h/2))))\n\
  ```\n\n- 下一段代码首先从 `skimage.data` 加载标准的 **“camera”** 图像，然后添加方差为 0.1 的 **高斯噪声**，最后应用截止频率为\
  \ `D0 = 20` 的 **理想低通滤波器 (ILPF)**：\n\n```python\nfrom skimage import data\nfrom skimage.util\
  \ import random_noise\n\nf = data.camera()\nf = random_noise(f, var=0.1)\n\nF, H,\
  \ G, g = apply_filter(f, ideal, {'sz':f.shape, 'D0':20})\n\n# plot original noisy\
  \ image (f) and the output (g)\n# obtained with ILPF here\n```\n\n- 如果你绘制输入和滤波器以及通过运行前述代码片段获得的输出的图像和频谱，你应该得到如下图所示的结果：\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_276_0.png)\n\n*Figure 6.4 – Applying\
  \ the ILPF to the cameraman image*\n\n- 下一段代码片段在频率域中对图像应用 **巴特沃斯低通滤波器 (BLPF)**。它去除高频细节，产生平滑的去噪（模糊）输出图像：\n\
  \n```python\nF, H, G, g = apply_filter(f, butterworth, \\\n                    \
  \     {'sz':f.shape, 'D0':20, 'n':2})\n# plot original noisy image (f) and the output\
  \ (g) obtained\n# with BLPF here\n```\n\n再次绘制输出，你应该得到如下图所示的结果：\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_277_0.png)\n\
  \n*Figure 6.5 – Applying the BLPF to the cameraman image*\n\n`scipy.ndimage` 和 `skimage.filters`\
  \ 模块提供了许多在频率域中对图像应用 LPF 的函数。下一节演示了其中一个滤波器（由 `fourier_gaussian()` 函数实现）的示例。\n\n###\
  \ 使用 fourier_gaussian 的 LPF\n\n该函数来自 `scipy.ndimage` 模块，实现多维高斯傅里叶滤波器。频率数组乘以给定大小的高斯核的傅里叶变换，使用\
  \ `ndimage.fourier_gaussian()` 函数。以下代码块演示了如何使用 LPF（加权平均滤波器）模糊 *Lena* 图像：\n\n```python\n\
  im = np.mean(imread('images/lena.jpg'), axis=2) # convert image to\n# grayscale\n\
  freq = np.fft.fft2(im)\n\nim_rec = fp.ifft2(fp.ifftshift(freq)).real\nprint(psnr(im,\
  \ im_rec))\n# 2.389151856495427\n# plot original image im and reconstructed image\
  \ im_rec,\n# along with the frequency spectrums\n```\n\n下图显示了前述代码片段的输出，通过在输入犀牛图像上应用\
  \ LPF 获得的粗略输出图像，没有更精细的细节。现在在对数域中绘制图像的频谱，在阻断高频后；换句话说，只允许低频通过：\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_279_0.png)\n\
  \nFigure 6.7 – Low-pass filtered rhinos image\n\n以下代码块显示了对摄像机灰度图像应用 LPF，使用不同的频率截止值\
  \ F。\n\n```python\nim = np.array(Image.open('images/cameraman.jpg').convert('L'))\n\
  freq = fp.fft2(im)\n(h, w) = freq.shape\nhalf_w, half_h = int(w/2), int(h/2)\nsnrs_lp\
  \ = []\nubs = list(range(1,30,3))\n\nfor u in ubs:\n    freq = fp.fftshift(np.copy(freq))\n\
  \    freq_low = np.copy(freq)\n    freq_low[half_h-u:half_h+u+1,half_w-u:half_w+u+1]\
  \ = 0\n    freq -= freq_low # select only first 20x20 (low) frequencies\n    im_rec\
  \ = fp.ifft2(fp.ifftshift(freq)).real # reconstruction\n    snrs_lp.append(psnr(im,\
  \ im_rec)) # append SNR for cutoff u\n    plt.subplot(2, 5, u//3+1), plt.imshow(im,\
  \ cmap='gray')\n    plt.axis('off'), plt.title('F = ' + str(u), size=15)\n```\n\n\
  \n\n以下图表展示了随着截止频率 *F* 增加，LPF 如何在图像中检测到越来越多的细节：\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_280_0.png)\n\
  \n*Figure 6.8 – Low-pass filtered cameraman image at different cut-off frequencies*\n\
  \n## SNR changes with cut-off frequency\n\n以下代码片段展示了如何绘制 LPF 的 **峰值信噪比 (PSNR)**\
  \ 随截止频率 (*F*) 变化的曲线：\n\n```python\nplt.plot(ubs, snrs_lp, 'b.-')\nplt.xlabel('Cutoff\
  \ Frequency for LPF'), plt.ylabel('PSNR')\n```\n\n以下图表展示了随着 LPF 截止频率的增加，输出图像的 SNR\
  \ 如何增加（表示重建效果更好）。\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_280_1.png)\n\n*Figure\
  \ 6.9 – LPF Cut-off frequency versus PSNR of the reconstructed image*\n\n## Image\
  \ denoising with LPF\n\n图像去噪是图像处理和计算机视觉中的一项基本任务，旨在从其噪声版本中恢复干净的图像。噪声会因传感器误差、低光条件或传输错误等因素而降低图像质量。去噪的目标是重建原始信号，使其可用于下游任务，如目标检测、医学成像或图像增强。\n\
  \n下面的示例演示了如何对带噪声的 *moonlanding* 图像进行去噪，首先使用 FFT 通过 LPF 阻断傅里叶高频分量。\n\n```python\n\
  im = plt.imread('images/moonlanding.png').astype(float)\nim_fft = fp.fft2(im)\n\
  ```\n\n**Filtering in the frequency domain:** 下面的代码块展示了如何拒绝一组高频并实现 LPF 以从图像中衰减噪声（对应于高频分量）。\n\
  \n```python\n# Copy the original spectrum and truncate coefficients.\n# Define the\
  \ fraction of coefficients (in each direction)\nkeep_fraction = 0.1\nim_fft_filtered\
  \ = im_fft.copy()\n# Set r and c to the number of rows and columns of the array.\n\
  r, c = im_fft.shape\n# Set rows with indices between\n# r*keep_fraction and r*(1-keep_fraction)\
  \ to 0\nim_fft_filtered[int(r*keep_fraction):int(r*(1-keep_fraction))]=0\n# Similarly\
  \ with the columns\nim_fft_filtered[:, \\\n                int(c*keep_fraction):int(c*(1-keep_fraction))]=0\n\
  ```\n\n**Reconstructing the final image:** 下面的代码片段展示了如何从滤波后的傅里叶系数中通过 IFFT 重建图像。\n\
  \n```python\n# Reconstruct image from filtered spectrum,\n# keep only real part\
  \ for display.\nim_denoised = fp.ifft2(im_fft_filtered).real\n# plot im, im_denoised\
  \ and the spectrums im_fft, im_fft_filtered\n```\n\n如果绘制原始带噪声图像、去噪后图像以及相应的频率谱，你应该会得到类似以下图表的结果：\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_282_0.png)\n\n*Figure 6.10 – Denoised\
  \ input image with LPF*\n\n正如前述图所示，通过在频域中进行滤波，可以获得比原始带噪声图像更干净的输出图像。\n\n虽然低通滤波器对于平滑图像和去除高频噪声很有用，但在某些情况下我们希望做相反的事情——通过抑制低频内容来突出精细细节和边缘。这就是高通滤波器发挥作用的地方，我们接下来将探讨它。\n\
  \n## High-pass filters (HPFs)\n\n该滤波器仅允许图像频率域表示（使用 DFT 获得）中的高频通过，并阻断截止值之外的所有低频。图像通过逆\
  \ DFT 重建，由于高频分量对应于边缘、细节、噪声等，因此 HPF 倾向于提取或增强它们。下面的表格总结了常见的 HPF 及其数学公式、特性、优点和局限性。\n\
  \n| Filter Type | Mathematical Expression | Characteristics | Pros | Cons |\n|---|---|---|---|---|\n\
  | Ideal HPF (IHPF) | $H(u,v)=\\begin{cases}0, & D(u,v)\\leq D_0\\\\1, & D(u,v)>\
  \ D_0\\end{cases}$ | Sharp transition, removes all low frequencies below $D_0$ |\
  \ Strong filtering effect, simple to implement | Causes ringing artifacts (Gibbs\
  \ effect) due to the sudden cutoff |\n| Butterworth HPF (BHPF) | $H(u,v)=\\frac{1}{1+\\\
  left(\\frac{D_0}{D(u,v)}\\right)^{2n}}$ | Smooth transition controlled by order\
  \ $n$ | Less ringing compared to Ideal HPF, adjustable sharpness | Higher computational\
  \ cost compared to Ideal HPF |\n| Gaussian HPF (GHPF) | $H(u,v)=1-e^{-\\frac{D^2(u,v)}{2D_0^2}}$\
  \ | Very smooth transition, no ringing artifacts | No ringing artifacts, best for\
  \ natural image processing | Weaker attenuation of low frequencies compared to IHPF\
  \ and BHPF |\n\n让我们开始实现前述表格中描述的 GHPF。\n\n### Ideal, Butterworth, and Gaussian HPFs\n\
  \n下面的代码片段在 **频域** 中实现了 **高斯高通滤波器 (GHPF)**（IHPF 和 BHPF 的实现类似，留作练习），并将其应用于砖块输入图像。它移除了低频内容，保留了尖锐边缘和精细细节，并用于图像锐化和边缘增强：\n\
  \n```python\ndef gaussian(sz, D0):\n    h, w = sz\n    u, v = get_grid(w, h)\n \
  \   return 1 - np.exp(-dist(u,v)**2/(2*D0**2))\n```\n\n函数 `gaussian()` 实现了 GHPF，移除了低\
  \ **频率**，并保留了高 **频率**（锐化）。这避免了与理想 HPF 相比的振铃伪影。让我们逐步分解。\n\n下面的代码片段首先从 `skimage.data`\
  \ 加载标准的 **“brick”** 图像，然后使用截止频率 $D_0 = 20$ 应用 **高斯高通滤波器 (GHPF)**。\n\n```python\n\
  from skimage import data\nf = data.brick()\nF, H, G, g = apply_filter(f, gaussian,\
  \ {'sz':f.shape, 'D0':20})\n# plot original noisy image (f) and the output (g) obtained\
  \ # with GHPF here\n```\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_283_0.png)\n\
  \n如果绘制输入和滤波器的图像和谱以及通过运行前述代码片段获得的输出，你应该会得到类似以下图表的结果：\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_284_0.png)\n\
  \n*Figure 6.12 – Applying the Gaussian high-pass filter to the brick image*\n\n\
  ## HPF with scipy.fftpack\n\n可以使用 `scipy.fftpack.fft2()` 实现一个简单的 HPF，通过计算图像的 2D\
  \ FFT，使用 `fftshift()` 抑制移位谱中心附近的低频分量，然后使用 `ifft2()` 和 `ifftshift()` 重建图像。由于高频分量主要代表边缘和精细细节，去除低频会抑制平滑的强度变化并强调输出图像中的边缘状结构。以下是代码片段：\n\
  \n```python\nim = np.array(Image.open('images/rhino.jpg').convert('L'))\nfreq =\
  \ fp.fft2(im)\n(h, w) = freq.shape\nhalf_w, half_h = int(w/2), int(h/2)\nfreq_out\
  \ = fp.fftshift(np.copy(freq))\n```\n\n如果运行前述代码片段，你应该会得到类似以下图表的结果：\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_288_0.png)\n\
  \n*Figure 6.17 – Butterworth low-pass and high-pass filters with skimage.filters*\n\
  \n虽然高通滤波器通过去除低频分量来保留精细细节非常有效，但有时我们希望仅隔离并保留特定范围的频率。这就引出了带通滤波器，它针对定义频带内的频率——让我们更仔细地了解一下。\n\
  \n## Band-pass filters (BPFs)\n\n带通滤波器允许特定范围内的频率通过，同时阻断该范围之外的频率，增强或抑制某些图像细节（用于特征提取）。理想\
  \ BPF (IBPF) 由以下公式给出：\n\n\\[\nH_{\\text{BPF}}(u,v) = \n\\begin{cases}\n1, & \\text{if\
  \ } D_1 \\le D(u,v) \\le D_2\\\\\n0, & \\text{otherwise}\n\\end{cases}\n\\]\n\n\
  同样，我们可以定义巴特沃斯和高斯 BPF（留作练习）。\n\n### With a DoG kernel\n\n高斯差分 (DoG) 核可以用作 BPF，以允许特定频带内的频率并丢弃所有其他频率。下面的代码块展示了如何使用\
  \ `fftconvolve()` 将 DoG 核用于实现 BPF：\n\n```python\nim = img_as_float(plt.imread('images/tigers.jpeg'))\n\
  x = np.linspace(-10, 10, 15)\nkernel_1d = np.exp(-0.005*x**2)\nkernel_1d /= np.trapz(kernel_1d)\
  \ # normalize the sum to 1\ngauss_kernel1 = kernel_1d[:, np.newaxis] * \\\n    \
  \            kernel_1d[np.newaxis, :]\nkernel_1d = np.exp(-5*x**2)\nkernel_1d /=\
  \ np.trapz(kernel_1d) # normalize the sum to 1\ngauss_kernel2 = kernel_1d[:, np.newaxis]\
  \ * \\\n                kernel_1d[np.newaxis, :]\nDoGKernel = gauss_kernel1[:, :,\
  \ np.newaxis] - \\\n            gauss_kernel2[:, :, np.newaxis]\nim_out = signal.fftconvolve(im,\
  \ DoGKernel, mode='same')\n# plot the images im, im_out here\n```\n\n\n\n下一张图展示了前一个代码块的输出，即通过带通滤波器得到的输出图像：\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_289_0.png)\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_289_1.png)\n\
  \n图6.18 - 对图像应用带通滤波器\n\n带通滤波器允许特定范围的频率通过，而相反的方法——阻止某个选定的频带——在许多应用中也同样重要。这就引出了带阻滤波器，我们接下来将探讨它。\n\
  \n## 带阻/带拒（陷波）滤波器（BSF/BRF）\n\n这种滤波器会阻止/拒绝图像频域表示（通过DFT获得）中的少数选定频率，因此得名。它特别适用于去除图像中的周期性噪声。理想BRF如下所示：\n\
  \nH_BSF(u, v) = { 0, if D1 ≤ D(u, v) ≤ D2\n1, otherwise }\n\n类似地，我们可以定义巴特沃斯和高斯BRF（留作练习）。\n\
  \n## 去除周期性噪声\n\n在本例中，我们首先向鹦鹉图像添加一些周期性（正弦）噪声，以生成一幅带噪的鹦鹉图像（这可能是由于某些电信号的干扰造成的），然后使用以下代码片段观察噪声在图像频域中的效果：\n\
  \n```\nim = np.mean(imread(\"images/parrot.jpg\"), axis=2)\nim = im / im.max()\n\
  F1 = fp.fft2((im).astype(float))\nF2 = fp.fftshift(F1)\n# plot original image im\
  \ and spectrum F2 here\n# add periodic noise to the image\nfor n in range(im.shape[1]):\n\
  \    im[:, n] += np.cos(0.1*np.pi*n)\nF1 = fp.fft2((im).astype(float)) # noisy spectrum\n\
  F2 = fp.fftshift(F1)\n# plot noisy image im and spectrum F2 here\n```\n\n下图展示了运行上述代码块并绘制图像所得到的输出。可以看到，水平线上的周期性噪声在频谱中变得更加突出：\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_290_0.png)\n\n图6.19 – 应用带阻滤波器去除图像中的正弦噪声\n\
  \n现在，让我们设计一个带阻/带拒（陷波）滤波器，通过将相应的频率分量设为零来消除导致噪声的频率，代码如下：\n\n```\nF2[170:176,:220]\
  \ = F2[170:176,230:] = 0 # eliminate the\n# frequencies most likely responsible\
  \ for noise\n# (keep some low frequency components)\nim_denoised = fp.ifft2(fp.ifftshift(F2)).real\n\
  ```\n\n下图展示了上述代码块的输出，即应用陷波滤波器后恢复的图像：\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_291_0.png)\n\
  \n图6.20 – 应用陷波滤波器后的输出图像\n\n可以看到，原始图像看起来比恢复后的图像更清晰，因为原始图像中的一些真实频率也随噪声一起被BRF抑制了。\n\
  \n## 高斯带阻滤波器\n\n高斯带阻滤波器（GBSF）可以定义如下：\n\n```\nH_BS(u, v) = e^(-D²(u,v)/(2D_L²)) (\
  \ 1 - e^(-D²(u,v)/(2D_H²)) )\n```\n\n下面是对该公式的分解：\n\n+   1. 低通分量：\n\n```\nH_LP(u,\
  \ v) = e^(-D²(u,v)/(2D_L²))\n```\n\n+   - 让低频通过\n+   - 衰减高频\n\n+   2. 高通分量：\n\n\
  ```\nH_HP(u, v) = 1 - e^(-D²(u,v)/(2D_H²))\n```\n\n+   - 去除极低频\n+   - 允许中频范围通过\n\
  \n## 效果\n\n它们按如下方式选择性地允许和抑制频率：\n\n+   - 允许中频范围（频带频率）通过\n+   - 阻断极低频（去除缓慢变化）\n+ \
  \  - 阻断极高频率（去除噪声）\n\n以下是实现GBSF的步骤，如下表所示：\n\n| 步骤 | 操作 | 效果 |\n|---|---|---|\n| 1\
  \ | 计算FFT | 将图像转换为频域 |\n| 2 | 定义频率网格 | 创建频率坐标系 |\n| 3 | 计算距离D² | 测量每个频率离中心有多远 |\n\
  | 4 | 创建高斯带通滤波器 | 允许中频范围通过，去除极低和极高频率 |\n| 5 | 应用滤波器 | 将滤波器与傅里叶变换后的图像相乘 |\n| 6 |\
  \ 计算逆FFT | 将滤波后的图像转换回空间域 |\n| 7 | 提取实部 | 去除复数值 |\n\n图6.21 – 计算高斯带阻滤波器的步骤\n\n以下代码片段实现了上述步骤：\n\
  \n```\ndef gaussian_bandpass_filter(image):\n    # Assumes input is a 2D grayscale\
  \ image\n    image_freq = np.fft.fftshift(np.fft.fft2(image))\n    m, n = np.shape(image_freq)\n\
  \    u0, v0 = int(n/2), int(m/2) # Find the center\n    u, v = np.meshgrid(range(n),\
  \ range(m))\n    DL, DH = 5, 9\n    D2 = (u-u0)**2+(v-v0)**2 # Squared Euclidean\
  \ distance from\n                            # the center\n    gaussian_filter =\
  \ np.exp(-0.5*D2/DL**2) * \\\n                      (1 - np.exp(-0.5*D2/DH**2))\n\
  \    # Apply the filter\n    fourier_transform = image_freq * gaussian_filter\n\
  \    rec_image = np.fft.ifft2(np.fft.ifftshift(\\\n                            \
  \  fourier_transform))\n    return rec_image\n\nim = imread('images/heart.png',\
  \ as_gray=True)\n# im = im / im.max()\nim_rec, F, G = gaussian_bandpass_filter(im)\n\
  im_rec = im_rec.real\n# plot original noisy (im) and reconstructed images (im_rec)\n\
  # plot spectrum of the noisy image and the gaussian BRF\n```\n\n如果你运行上述代码片段并将得到的图像/频谱并排绘制，你应该会得到类似下图的输出：\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_293_0.png)\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_293_1.png)\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_293_2.png)\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_293_3.png)\n\
  \n图6.22 – 使用带阻滤波器去除图像中的周期性噪声\n\n虽然诸如带阻滤波器之类的传统频域滤波器在抑制不需要的频率方面很有用，但机器学习的最新进展已经以更强大的方式利用了频率表示。其中一项创新是傅里叶特征网络，它使用基于频率的编码来增强神经网络的学习。接下来，让我们深入了解其工作原理。\n\
  \n## 傅里叶特征网络\n\n傅里叶特征网络（FFNs）通过结合基于傅里叶的位置编码来增强神经网络，从而更好地表示图像和3D场景等信号中的高频细节。传统的MLP倾向于学习低频平滑模式，往往产生模糊的输出，并且无法捕捉锐利的边缘或纹理。FFN通过使用正弦映射将输入坐标x\
  \ ∈ ℝ^d转换为更高维的富含频率的表示来解决这一局限：\n\nγ(x) = [sin(2πBx), cos(2πBx)]\n\n其中B通常是一个随机采样的高斯频率矩阵，跨越多个频率尺度。更一般地，\n\
  \nγ(x) = [sin(B₁x), cos(B₁x), ..., sin(Bₙx), cos(Bₙx)]\n\n该模型不是直接将x输入网络，而是学习：I(x)~MLP(γ(x))，从而使网络能够有效地模拟粗粒度和细粒度结构。正弦编码迫使网络关注多个空间频率，克服了标准神经网络固有的低频偏置。这一想法受到傅里叶分析的启发，在傅里叶分析中，信号被分解为正弦频率分量。\n\
  \nFFN被广泛应用于神经辐射场（NeRF）等应用中，其中傅里叶特征有助于重建具有清晰纹理和边缘的照片级逼真3D场景；在图像超分辨率中，它们也改善了精细空间细节的恢复。其主要优势包括改进的高频表示、跨2D和3D任务的灵活性，以及增强的神经场建模。然而，傅里叶编码增加了计算复杂度，而且频率矩阵（B）的选择会显著影响性能，这也是一个活跃的研究领域。\n\
  \n在了解以上FFN的背景后，现在让我们进入实现部分。让我们实现一个FFN模型，它可被视为一种基于坐标的多层感知机。对于每个输入图像坐标(x, y)，模型预测关联的像素颜色(r,\
  \ g, b)，如下图所示：\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_294_0.png)\n\n## 训练网络\n\
  \n现在，让我们了解如何训练具有不同输入映射的网络。我们将比较以下映射γ(v)：\n\n+   - 无映射：γ(v) = v\n+   - 基本映射：γ(v)\
  \ = [cos(2πv), sin(2πv)]ᵀ\n+   - 高斯傅里叶特征映射：\n\nγ(v) = [cos(2πBv), sin(2πBv)]ᵀ\n\n\
  其中B ∈ R^{m×d}中的每个条目均从N(0, σ²)中采样\n\n## 使用JAX实现\n\n下面的Python代码片段演示了如何使用JAX在输入图像上训练FFN，以实现高效的自动微分和优化计算。该网络使用傅里叶特征映射来提高神经网络学习高频细节的能力，从而基于学习到的特征实现更精确的图像重建（为避免训练缓慢，代码应在Google\
  \ Colab的GPU/TPU上运行）。以下是关键组件的详细逐步说明：\n\n+   - 初始设置\n\n通过安装必要的库并导入它们来设置环境。安装jax以及其他依赖项（如用于图像处理的imageio-ffmpeg）。\n\
  \n```\n#!pip install jax, imageio-ffmpeg\n#!git clone https://github.com/tancik/fourier-feature-networks\n\
  import jax.numpy as np\n```\n\n\nfrom jax import jit, grad, random\nfrom jax.example_libraries\
  \ import stax, optimizers\nfrom tqdm.notebook import tqdm\nimport os, imageio.v2\
  \ as imageio\nrand_key = random.PRNGKey(0)\n\n- **加载并预处理图像**\n  \n  使用 `imageio`\
  \ 加载图像文件（例如猫.jpg），并且仅使用前三个颜色通道（RGB）。在 `FourierFeatNet` 类中对图像数据进行归一化处理，确保数值位于 0 到\
  \ 1 之间，以便高效训练。\n\n- **类定义（FourierFeatNet）：**\n  \n  `FourierFeatNet` 类封装了构建和训练 FFN\
  \ 的整个过程。它执行以下任务：\n\n- **初始化（`__init__()`）：**\n  - **输入归一化：** 将图像 `img` 的像素值除以图像中的最大值来进行归一化。\n\
  \  - **傅里叶特征（B）：** 傅里叶特征映射矩阵 `B` 作为参数提供。它可以根据傅里叶映射的选择（例如高斯特征）而变化。\n  - **训练/测试分割：**\
  \ 使用 `train_test_split()` 将数据分割为低分辨率训练集和全分辨率测试集。这使得网络可以在下采样数据上训练，并在全分辨率图像上进行测试。\n\
  \n- **傅里叶特征映射（`map_input()`）：**\n  - 输入坐标通过傅里叶特征映射进行变换。如果没有提供映射矩阵（B），则直接使用像素坐标。如果提供了\
  \ B，则将输入坐标 x 投影到更高维空间：2πx·Bᵀ。\n  - 将这些投影的正弦和余弦值拼接起来，形成最终的映射输入。这种傅里叶特征映射使网络能够更好地捕获图像中的高频信息，这对于重建精细图像至关重要。\n\
  \n- **网络架构（`build_network()`）：** 使用 JAX 中的 `stax` 模块构建神经网络架构。该网络包含以下部分：\n  - 多个带有\
  \ ReLU 激活函数的全连接层（全连接神经网络中的标准层）\n  - 最后一个带有 Sigmoid 激活函数的全连接层，输出 3 个通道（RGB），取值范围为\
  \ [0, 1]，表示重建图像的像素值\n\n- **训练网络（`train_model()`）：** 主要的训练过程发生在 `train_model()` 函数中。它执行以下步骤：\n\
  \  - 模型预测和损失计算\n\n- **模型预测**（`model_pred()`）：通过将网络学习到的参数应用于傅里叶映射后的输入坐标，计算预测输出（重建图像）。\n\
  - **损失函数**（`model_loss()`）：损失定义为预测像素值与真实像素值之间的**均方误差**（MSE）：$loss = \\frac{1}{2}\
  \ mean((prediction - ground\\ truth)^2)$\n- **PSNR 计算**（`model_psnr()`）：PSNR 是图像重建质量的标准指标。现在你应该对它很熟悉了。PSNR\
  \ 值越高表示重建质量越好。它使用公式计算：$(PSNR = -10 \\cdot log_{10}(2 \\cdot loss))$。\n- **优化**：使用\
  \ Adam 优化器更新网络参数。通过 `grad`(`model_loss`) 计算损失函数的梯度，优化器根据梯度信息调整参数。训练过程共迭代 `iters`\
  \ 次（本例中为 2000 次）。\n- **训练循环**\n  - 每次迭代，模型使用 Adam 优化器更新参数。\n  - 每 25 次迭代，记录训练 PSNR、测试\
  \ PSNR 和预测图像。这些值用于监控网络在训练期间的性能。\n  - 该函数返回一个字典，包含：\n    1. `state`：网络的最终学习参数。\n\
  \    2. `train_psnrs`：训练期间各迭代步的训练 PSNR 值列表。\n    3. `test_psnrs`：测试 PSNR 值列表。\n\
  \    4. `pred_imgs`：训练过程中不同时刻的预测图像。\n    5. `xs`：记录 PSNR 值时的迭代步。\n\n以下是完整的代码片段：\n\
  \n```\nclass FourierFeatNet:\n    def __init__(self, img, B, num_layers, num_channels):\n\
  \        self.I = img / img.max()\n        self.B, self.L, self.C = B, num_layers,\
  \ num_channels\n        self.train_test_split()\n        self.build_network()\n\
  \    def train_test_split(self):\n        # Create input pixel coordinates in the\
  \ unit\n        # square\n        coords = np.linspace(0, 1, self.I.shape[0], \\\
  \n                            endpoint=False)\n        x_test = np.stack(np.meshgrid(coords,\
  \ coords), -1)\n```\n\n```\nself.test_data = [x_test, self.I]\nself.train_data =\
  \ [x_test[::2, ::2], self.I[::2, ::2]]\n\n# Fourier feature mapping\ndef map_input(self,\
  \ x):\n    if self.B is None:\n        return x\n    else:\n        x_proj = (2.*np.pi*x)\
  \ @ self.B.T\n        return np.concatenate([np.sin(x_proj), \\\n              \
  \                 np.cos(x_proj)], \\\n                               axis=-1)\n\
  \n# JAX network definition\ndef build_network(self):\n    layers = []\n    for i\
  \ in range(self.L-1):\n        layers.append(stax.Dense(self.C))\n        layers.append(stax.Relu)\n\
  \        layers.append(stax.Dense(3))\n        layers.append(stax.Sigmoid)\n   \
  \ self.FFN = stax.serial(*layers)\n\n# Train model with given hyperparameters and\
  \ data\ndef train_model(self, learning_rate, iters):\n    init_fn, apply_fn = self.FFN[0],\
  \ self.FFN[1]\n    model_pred = jit(lambda params, x: apply_fn(params,\\\n     \
  \               self.map_input(x)))\n    model_loss = jit(lambda params, x, y: .5\
  \ * np.mean(\\\n        (model_pred(params, x) - y) ** 2))\n    model_psnr = jit(lambda\
  \ params, x, y: \\\n        -10 * np.log10(2.*model_loss(params, x, y)))\n    model_grad_loss\
  \ = jit(lambda params, x, y: \\\n        grad(model_loss)( params, x, y))\n    opt_init,\
  \ opt_update, get_params = \\\n        optimizers.adam(learning_rate)\n    opt_update\
  \ = jit(opt_update)\n    _, params = init_fn(rand_key, (-1, \\\n        self.map_input(self.train_data[0]).shape[-1]))\n\
  \    opt_state = opt_init(params)\n```\n\n```\n```python\ntrain_psnrs = []\ntest_psnrs\
  \ = []\npred_imgs = []\nxs = []\nfor i in tqdm(range(iters), desc='train iter',\
  \ leave=False):\n    opt_state = opt_update(i, \\\n        model_grad_loss(get_params(opt_state),\
  \ \\\n        *self.train_data), opt_state)\n    if i % 25 == 0:\n        train_psnrs.append(model_psnr(\\\
  \n            get_params(opt_state), *self.train_data))\n        test_psnrs.append(model_psnr(\\\
  \n            get_params(opt_state),\\\n            *self.test_data))\n        pred_imgs.append(model_pred(\\\
  \n            get_params(opt_state), \\\n            self.test_data[0]))\n    xs.append(i)\n\
  return {\n    'state': get_params(opt_state),\n    'train_psnrs': train_psnrs,\n\
  \    'test_psnrs': test_psnrs,\n    'pred_imgs': np.stack(pred_imgs),\n    'xs':\
  \ xs,\n}\n```\n```\n\n下一个代码比较存储在 `B_dict` 中的不同傅里叶特征映射，以研究它们对图像重建的影响。`B_dict['none']\
  \ = None` 仅使用原始像素坐标，不进行傅里叶编码；而 `B_dict['basic'] = np.eye(2)` 应用简单的恒等映射，保留原始坐标。三个高斯傅里叶特征映射\
  \ `B_dict['gauss_{scale}']` 使用随机高斯矩阵 `B_gauss` 按因子 1、10 和 100 缩放创建，使网络能够捕获不同频率范围的图像结构。输入图像被归一化，对于\
  \ `B_dict` 中的每个映射，训练一个具有 4 层和 256 个通道的 `FourierFeatNet` 模型，使用学习率 10⁻⁴ 迭代 2000 次。所有映射的输出都被存储，以便后续比较重建质量和频率表示能力。\n\
  \n```\n```python\nnum_layers, num_channels = 4, 256\nlearning_rate = 1e-4\niters\
  \ = 2000\nmapping_size = 256\n\nB_dict = {}\n```\n\n```\n# Standard network - no\
  \ mapping\nB_dict['none'] = None\n# Basic mapping\nB_dict['basic'] = np.eye(2)\n\
  # Three different scales of Gaussian Fourier\n# feature mappings\nB_gauss = random.normal(rand_key,\
  \ (mapping_size, 2))\n\nfor scale in [1., 10., 100.]:\n    B_dict[f'gauss_{scale}']\
  \ = B_gauss * scale\n\nimg = imageio.imread('cat.jpg')[..., :3]\nimg = img / img.max()\
  \ # input images must be normalized\n# between [0, 1] # for proper training when\
  \ passed into the # Fourier Feature\nNetwork, otherwise, PSNR values will be\n#\
  \ misleading.\n\n# This will take about 2-3 minutes on GPU\noutputs = {}\nfor k\
  \ in tqdm(B_dict):\n    outputs[k] = FourierFeatNet(img, B_dict[k], num_layers,\\\
  \n        num_channels).train_model(learning_rate, iters)\n```\n\n绘制结果：训练完成后，`plot_output()`（参见\
  \ GitHub）将不同映射的重建图像与真实图像一起可视化，并绘制训练和测试 PSNR 随迭代次数的变化曲线，如下图所示，使读者能够比较各模型的重建质量、收敛行为和泛化性能。\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_299_0.png)\n\n图 6.24 – 使用不同傅里叶映射的 FFN\
  \ 进行图像重建\n\n\n\n\n\n下图显示了使用 FFN 重建的图像的 PSNR 随训练 epoch 的增加情况，训练集和测试集均有体现：\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_300_0.png)\n\
  \n图 6.25 – 使用 FFN 重建后训练和测试误差（以 PSNR 衡量）\n\n这种方法突出了傅里叶特征映射如何增强神经网络捕捉图像中高频细节的能力，从而比仅使用原始像素坐标获得更好的重建质量。\n\
  \n## Note\n\n如果训练 PSNR 持续改善而测试 PSNR 停滞或开始下降，则这是 FFN 出现过拟合的强有力指标。为缓解过拟合，请考虑诸如早停、正则化（例如增加\
  \ dropout）等技术。Dropout 在训练期间随机禁用神经元，有助于提高泛化能力；如果观察到过拟合，请尝试适度提高 dropout 率。此外，请注意，在推理期间（例如图像重建），模型使用全分辨率测试数据，且不应用\
  \ dropout。\n\n## Summary\n\n在本章中，我们探讨了如何在频域中有效执行滤波操作，为许多图像处理任务提供了速度和灵活性的优势。我们涵盖了各种类型的滤波器，包括低通、高通、带通和带阻，并使用\
  \ Python 库如 scipy.fftpack、scikit-image 和 fourier_gaussian 实现了理想、巴特沃斯和高斯变体。我们还分析了滤波如何影响图像质量和\
  \ SNR，特别是在去噪和噪声去除应用中。最后，我们介绍了傅里叶特征网络（FFNs），解释了其动机、结构以及使用 JAX 的实际实现，展示了基于频率的表示如何增强神经网络在高频任务中的性能。\n\
  \n完成本章后，你应该能够编写 Python 代码来实现 LPF/HPF/BPF/BSF 频域滤波器。\n\n在下一章中，我们将开始基于最近几章介绍的概念的图像增强技术。\n\
