  \n*Figure 2.37 – Color-channel swapping with PIL*\n\n## Alpha (α) 通道和图像混合\n\n图像中的\
  \ alpha 通道是一个额外的通道，表示每个像素的透明度或不透明度。它常用于具有不同透明度级别的图像中，可实现图像与其背景或其他图像之间的平滑混合。\n\n\
  Alpha 通道是 RGBA 颜色模型不可分割的一部分，其中每个像素由四个分量表示：红色、绿色、蓝色和 alpha。PNG 图像格式支持 alpha 通道，使其成为需要透明度的图像的热门选择。另一方面，JPEG\
  \ 不支持 alpha 通道。\n\nAlpha 通道允许图像具有像素级透明度，从而可以在图像和背景之间创建平滑过渡。\n\nAlpha 值为 0 表示完全透明，意味着该像素完全不可见。Alpha\
  \ 值为 255（或浮点图像的 1.0）表示完全不透明，使像素完全可见。\n\n## 将 JPG 转换为透明 PNG 图像\n\n可以通过添加 alpha 通道使用\
  \ `convert(\"RGBA\")`、从原始图像生成灰度遮罩并使用 `putalpha()` 分配透明度值，将 JPG 图像转换为透明 PNG。在示例中，`ImageChops.invert()`\
  \ 反转灰度遮罩，使较暗区域变为透明而较亮区域保持可见，之后将图像保存为支持透明度的 PNG 文件。下面的代码片段读取一张黑白鸟的 JPG 图像并将其保存为透明\
  \ PNG 图像：\n\n```\n```python\nfrom PIL import Image, ImageChops\n\nimg_trans = Image.new('RGBA',\
  \ img.size)\nalpha = Image.open('images/birds.jpg').convert('L')\nimg_trans.putalpha(ImageChops.invert(alpha))\n\
  img_trans.save('images/bird.png')\nimg_trans\n```\n```\n\n下图显示了通过运行前述代码片段创建的输出图像：\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_128_0.png)\n\n*Figure 2.38 – Creating\
  \ a transparent PNG image with PIL*\n\n下面的代码片段读取鹦鹉 RGB 彩色 JPG 图像，提取对应于红色羽毛的区域并将其保存为透明\
  \ PNG，如下图所示：\n\n```\nimg = Image.open('images/parrot.jpg') # n x m x 3\nimga = img.convert(\"\
  RGBA\")  # n x m x 4\n\nimga = np.asarray(imga)\nr, g, b, a = np.rollaxis(imga,\
  \ axis=-1) # split into 4 n x m arrays\nr_m = r > 100 # binary mask for red channel,\
  \ True for read feathers\ng_m = g < 100 # binary mask for green channel, True for\
  \ read feathers\nb_m = b < 200 # binary mask for blue channel, True for read feathers\n\
  \n# combine the three masks using the binary \"or\" operation\n# multiply the combined\
  \ binary mask with the alpha channel\na = a * ((r_m == 1) & (g_m == 1) & (b_m ==\
  \ 1))\n\n# stack the img back together\nimga = Image.fromarray(np.dstack([r, g,\
  \ b, a]), 'RGBA')\nimga.save('images/parrot_transparent.png')\n\nprint(img.mode,\
  \ imga.mode)\n# RGB RGBA\n```\n\n如果运行上述代码片段，你应该会得到如下图所示的图像：\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_129_0.png)\n\
  \nFigure 2.39 – Creating transparent PNG image from a JPG image\n\n## α-混合两幅图像\n\
  \nblend() 函数可用于通过使用常数 α 在两幅给定图像（大小相同）之间进行插值来创建新图像。两幅图像必须具有相同的大小和模式。输出图像由下式给出：\n\n\
  out = image₁.(1.0 − α) + image₂.α\n\n如果 α 为 0.0，则返回第一幅图像的副本。如果 α 为 1.0，则返回第二幅图像的副本。\n\
  \n下面的代码片段显示了一个示例：\n\n```\nim1 = Image.open(\"images/parrot.png\")\nim2 = Image.open(\"\
  images/hill.jpg\")\n# if two images have different modes, must be converted to the\
  \ same mode\nim2 = im2.resize((im1.width, im1.height), Image.BILINEAR)\n# if two\
  \ images have different sizes, must be converted to the same size\nim = Image.blend(im1,\
  \ im2, alpha=0.5).show()\n```\n\n下图显示了通过运行前述代码片段混合前两幅图像生成的输出图像：\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_130_0.png)\n\
  \nFigure 2.40 – alpha-blending two images with PIL\n\n## α-合成两幅图像\n\nα-合成使用两幅图像的\
  \ alpha（透明度）值来混合两幅图像，决定每幅图像对最终像素颜色的贡献程度。给定一幅前景图像 F 和一幅背景图像 B，每幅图像均具有 RGBA 值，结果图像\
  \ C 使用 alpha 混合计算得出。以下是计算步骤的说明：\n\n- 1. Alpha 归一化：首先，将前景 α_F 和背景 α_B 的 alpha 值归一化到\
  \ 0 到 1 之间：α_F' = α_F / 255 和 α_B' = α_B / 255\n- 2. 合成 alpha 计算：结果 alpha α_C（最终图像的透明度）计算为：α_C\
  \ = α_F' + α_B'(1 − α_F')。\n- 3. 混合颜色计算：对于每个颜色通道（R、G 和 B），最终合成颜色 C 计算如下：\n- C =\
  \ (F · α_F' + B · α_B'(1 − α_F')) / α_C\n\n这确保前景根据透明度与背景混合。下面的 Python 代码片段通过使用 PIL.Image\
  \ 中的方法，使用不同的透明度（alpha）值对两幅图像（鱼和海）进行 α-合成。以下是关键步骤：\n\n- 1. 设置透明度：putalpha(100) 使鱼更透明，而\
  \ putalpha(200) 使海更不透明。\n\n\n\n\n\n+   2. **复合图像：** Image.alpha_composite(sea, fish)\
  \ 基于它们的 alpha 值将 fish 叠加到 sea 上。\n\n这会创建平滑的混合效果，其中 fish 在 sea 上方呈现半透明，展示了 alpha\
  \ 混合：\n\n```\nfish = Image.open('images/fish.jpg')\nsea = Image.open('images/water.jpg')\n\
  fish.putalpha(100); sea.putalpha(200)\nalpha_comp = Image.alpha_composite(sea, fish)\n\
  plt.imshow(np.hstack((np.array(fish), np.array(sea), np.array(alpha_comp))))\nplt.title('alpha\
  \ composite of the fish and sea images', size=15)\n```\n\n如果运行前面的代码片段，你应该会得到如下图所示的图形：\n\
  \n# alpha composite of the fish and sea images\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_131_0.png)\n\
  \n图 2.41 - 使用 PIL 对两幅图像进行 alpha 复合\n\n## 为图像添加水印\n\n水印是叠加到另一幅图像上的可识别图像或图案，通常用于品牌或版权目的。水印通常是半透明的，并放置在图像的角落或中心，以防止未经授权的使用或标识图像的创建者。\n\
  \n下面的代码片段将 Packt 标志图像添加到鹦鹉封面图像中，使用以下步骤：\n\n+   1. 首先，将原始输入（封面）和水印图像都转换为 RGBA 模式。\n\
  +   2. 水印图像被调整大小并粘贴到空白图像上，随后添加一个半透明的 alpha 层（α = 128）。\n+   3. 最后，使用 alpha_composite()\
  \ 函数合并原始图像和水印图像的 alpha 通道。生成的带水印输出显示在下图中。\n\n现在，参考以下代码片段：\n\n```\ncover_image =\
  \ Image.open('images/parrot.jpg').convert('RGBA')\nwatermark = Image.open('images/packt.png')\\\
  \n    .resize((100, 50))\\\n.convert('RGBA')\nlayer = Image.new('RGBA', cover_image.size,\
  \ (0, 0, 0, 0))\nlayer.paste(watermark, (325, 225))\n\n# Create a copy of the layer\n\
  layer2 = layer.copy()\n# Put alpha on the copy\nlayer2.putalpha(128)\n# merge layers\
  \ with mask\nlayer.paste(layer2, layer)\n\nwatermarked_image = Image.alpha_composite(cover_image,\
  \ layer)\nwatermarked_image.convert('RGB')\n```\n\n如果运行前面的代码片段，你应该会得到如下所示的带水印图像：\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_132_0.png)\n\n图 2.42 – 向图像添加水印（标志）\n\n\
  ## 使用蒙版混合两幅图像\n\n下面的代码片段使用 Image.composite() 方法，通过（水平）强度梯度透明度蒙版（grad_mask）将蝴蝶图像（im）与其自身反转版本（im_inv）混合。以下是关键步骤。\n\
  \n首先，使用 np.linspace() 创建一个 1D 梯度数组（grad_mask），并使用 np.tile(grad_mask, (h, 1)) 函数将\
  \ 1D 梯度数组沿行重复以创建 2D 水平强度梯度蒙版，其中像素值范围从 0（完全透明）到 255（完全不透明）。\n\nImage.composite(im,\
  \ im_inv, grad_mask) 方法根据透明度蒙版 grad_mask 混合 im 和 im_inv，使一侧更像原始图像，另一侧更像反转版本。\n\n\
  **Hard Light** 混合模式对较暗的像素应用 **Multiply** 混合模式，对较亮的像素应用 **Screen** 混合模式。混合方程如下：\n\
  \n```\n$$C_{out}=\\begin{cases}2C_{base}C_{blend}, & C_{blend}\\le 0.5\\\\1-2(1-C_{base})(1-C_{blend}),\
  \ & C_{blend}>0.5\\end{cases}$$\n```\n\n如果混合像素较暗（$C_{blend}\\le 0.5$），则应用 **Multiply**\
  \ 模式，导致色调变暗。否则，应用 **Screen** 模式，导致色调变亮。其效果是增加对比度——亮区变得更强烈，暗区加深。\n\n**Soft Light**\
  \ 混合模式提供微妙的方向性光照效果，使暗区变暗、亮区变亮，但过渡更平滑。混合方程如下：\n\n```\n$$C_{out}=\\begin{cases}C_{base}-(1-C_{base})C_{base}(1-2C_{blend}),\
  \ & C_{blend}\\le 0.5\\\\C_{base}+D(C_{base})(2C_{blend}-1), & C_{blend}>0.5\\end{cases}$$\n\
  ```\n\n其中\n\n```\n$$D(C_{base})=\\begin{cases}\\frac{16C_{base}^{2}+3C_{base}}{19},\
  \ & C_{base}\\le 0.25\\\\\\sqrt{C_{base}}, & C_{base}>0.25\\end{cases}$$\n```\n\n\
  如果混合像素较暗（$C_{blend}\\le 0.5$），它会烧蚀阴影，使其变暗。否则，它会减淡高光，使其变亮。其效果类似于 **Hard Light**，但过渡更平滑、强度更低。\n\
  \n**Overlay** 混合模式类似于 **Hard Light**，但不同之处在于混合图像决定效果，而基底图像控制它。混合方程如下：\n\n```\n$$C_{out}=\\\
  begin{cases}2C_{base}C_{blend}, & C_{base}\\le 0.5\\\\1-2(1-C_{base})(1-C_{blend}),\
  \ & C_{base}>0.5\\end{cases}$$\n```\n\n如果基底像素较暗（$C_{blend}\\le 0.5$），它会使用 **Multiply**\
  \ 混合使图像变暗。否则，它会使用 **Screen** 混合使图像变亮。其效果是对比度增加，但基底图像控制效果强度。下图总结了算法之间的差异：\n\n| Blend\
  \ Mode | Dark Pixels Behavior | Light Pixels Behavior | Contrast Effect |\n|---|---|---|---|\n\
  | Hard Light | Darker (Multiply) | Lighter (Screen) | High contrast |\n| Soft Light\
  \ | Subtly darker | Subtly lighter | Soft transitions |\n| Overlay | Darker (Multiply)\
  \ | Lighter (Screen) | Strong contrast, but base-driven |\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_134_0.png)\n\
  \n*图 2.44 – 比较混合模式算法*\n\n这些混合技术通常用于照片编辑，以进行动态光照调整和艺术效果。\n\n## 使用 PIL\n\n下面的代码片段使用不同的混合模式叠加两幅图像以创建不同的光照效果，如前所述，使用\
  \ ImageChops 中的以下方法：\n\n- hard_light 通过应用 Multiply 和 Screen 混合的混合来增强对比度——亮区变亮，暗区变暗\n\
  - soft_light 是 hard_light 的更微妙版本，通过根据前景减淡或烧蚀像素来模拟柔和的方向性光照\n- overlay 类似于 hard_light，但强度由背景驱动——亮区变得更亮而暗区加深\n\
  \n现在，参考下面的代码片段：\n\n```\nim1 = Image.open(\"images/scene.jpg\")\nim2 = Image.open(\"\
  images/turtle.jpeg\").convert('RGB') \\\n    .resize((im1.width, im1.height))\n\n\
  im_hard = hard_light(im1, im2)\nim_soft = soft_light(im1, im2)\nim_overlay = overlay(im1,\
  \ im2)\nplt.imshow(np.hstack((im_hard, im_soft, im_overlay))), plt.axis('off')\n\
  ```\n\n如果运行前面的代码片段，你应该会得到如下图所示的图形：\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_135_0.png)\n\
  \n图 2.45 - 使用 PIL 使用不同算法混合图像\n\n## 使用 blend_modes\n\n下面的代码片段演示了使用 blend_modes 库以不同不透明度使用\
  \ soft_light 算法混合两幅图像。imgviz 库用于为图像添加 alpha 通道。blend_modes.soft_light() 方法应用软光混合，由不透明度（α）参数控制。对于每个像素，soft_light\
  \ 混合公式如下应用：\n\nC_out = (1 − α) · C_base + α · F_soft−light(C_base, C_blend)\n\n\
  这里，$F_{soft-light}$ 是 soft_light 混合函数。前景图像（im2）以增加的不透明度柔和地混合到背景（im1）上，创建微妙的光照效果。较高的不透明度意味着前景对最终混合的贡献更大，而较低的不透明度使其更透明：\n\
  \n```\nimport blend_modes, imgviz\ni = 1\nplt.figure(figsize=(15,5))\nfor opacity\
