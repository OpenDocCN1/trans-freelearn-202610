  \n## 客户端数据分布\n以下可视化说明了训练样本如何在客户端之间分布。\n\n```\nclient_sizes = [len(idx) for idx in\
  \ client_indices]\n```\n\n在真实联邦系统中，客户端通常拥有高度不平衡的数据集，使得学习变得更加具有挑战性。\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_641_1.png)\n\
  \n*Figure 12.28 – Federated client data distribution*\n\n## 预测可视化\n最后一幅图显示了 Fashion-MNIST\
  \ 测试图像以及预测标签。\n\n```\npred = global_model(img.unsqueeze(0).to(device)).argmax()\n\
  ```\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_642_0.png)\n\n## 什么是对抗样本？\n设 $x$\
  \ 表示输入图像，$f(x)$ 为神经网络的预测。对抗图像构造为：\n\n$$x_{adv}=x+\\delta$$\n\n其中 $\\delta$ 是专门选择以最大化模型分类错误的小扰动。尽管\
  \ $|\\delta|$ 极小，但 resulting prediction may change dramatically.\n\n### 为什么对抗攻击有效？\n\
  神经网络在非常高维空间中运行。即使在数千个像素上应用的微小扰动也可能累积成网络决策边界的巨大变化。直观地，想象站在悬崖边缘。轻微的推动可能足以使你越过边界。同样，图像可能靠近分类边界，允许微小扰动改变预测类别。\n\
  \n### 白盒与黑盒攻击\n- **White-Box Attack:** 攻击者知道模型架构、参数和梯度。FGSM 是经典的白盒攻击，因为它直接使用模型梯度。\n\
  - **Black-Box Attack:** 攻击者仅观察输出或概率，并且无法访问内部模型细节。这种攻击在实践中通常更现实。\n\n## 快速梯度符号法（FGSM）\n\
  最简单且最具影响力的对抗攻击之一是 Ian Goodfellow 等人提出的 **快速梯度符号法（FGSM）**。FGSM 使用分类损失相对于输入图像的梯度。给定损失\
  \ $J(\\theta,x,y)$，对抗图像为：\n\n$$x_{adv}=x+\\epsilon\\,\\operatorname{sign}(\\nabla_xJ(\\\
  theta,x,y))$$\n\n其中 $x$ = 原始图像，$y$ = 真实标签，$\\theta$ = 模型参数，$\\epsilon$ = 攻击强度，$\\\
  nabla_xJ$ = 相对于图像像素的损失梯度。sign 操作强制每个像素扰动朝最大增加分类错误的方向移动。\n\n梯度告诉我们：“每个像素应朝哪个方向移动以最快增加网络的损失？”\
  \ 而不是执行多次优化迭代，FGSM 在该方向上进行单步。扰动因此变为 $\\delta=\\epsilon\\,\\operatorname{sign}(\\\
  nabla_xJ)$，计算成本低廉但非常有效。\n\n**加载预训练图像分类器：** 演示使用预训练的 MobileNetV2 分类器。\n\n```\n```python\n\
  model = models.mobilenet_v2(weights=models.MobileNet_V2_Weights.DEFAULT)\nmodel.eval()\n\
  ```\n```\n\n该网络在 ImageNet 数据集上训练，可以识别 1000 个物体类别。\n\n\n\n\n\n## 图像预处理\n\n图像调整大小后转换为张量。\n\
  \n```python\nimg = transform(img)\nimg = img * 2 - 1\n```\n\n像素值从 [0,1] 缩放到 [−1,1]，以匹配模型所期望的预处理。\n\
  \n## 计算输入梯度\n\nFGSM 的核心步骤是计算损失相对于输入图像的梯度。\n\n```python\nimage.requires_grad = True\n\
  output = model(image)\nloss = nn.CrossEntropyLoss()(output, label)\nloss.backward()\n\
  ```\n\n从数学上看，$g = \\nabla_x J(\\theta, x, y)$ 衡量了损失对每个图像像素的敏感程度。\n\n## 符号梯度扰动\n\n\
  FGSM 仅保留梯度的符号。\n\n```python\nperturbations = image.grad.sign()\n```\n\n这对应于 $\\\
  operatorname{sign}(\\nabla_x J)$，其中每个像素都会根据哪个方向会增加损失，而收到 +1 或 −1 的扰动。\n\n## 扰动可视化\n\
  \n扰动图像揭示了攻击者打算在哪些位置修改像素。\n\n```python\nplt.imshow((perturbations.squeeze().numpy().transpose(1,2,0)+1)/2)\n\
  ```\n\n尽管扰动看起来具有一定结构，但当用 ε 缩放时，其幅度通常非常小。\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_644_0.png)\n\
  \n*图 12.30 – 符号梯度扰动*\n\n**生成对抗图像：** 使用多种扰动强度来实施攻击：\n\n```python\nepsilons = [0,\
  \ 0.01, 0.1, 0.2]\n```\n\n对抗图像按如下方式生成：\n\n```python\nadv_x = input_tensor + eps\
  \ * perturbations\n```\n\n对应于 $x_{adv} = x + \\epsilon \\cdot \\operatorname{sign}(\\\
  nabla_x J)$。$\\epsilon$ 的值越大，产生的攻击就越强。\n\n**有效像素约束：** 扰动之后，图像必须保持在有效的像素范围内。\n\n\
  ```python\nadv_x = torch.clamp(adv_x, -1, 1)\n```\n\n这会防止像素超出允许的值范围。\n\n**Top-5\
  \ 预测可视化：** 对于每张对抗图像，代码都会显示扰动后的图像、预测类别以及 ImageNet 的 Top-5 概率。\n\n```python\npreds\
  \ = decode_predictions(output)\n```\n\n这让我们能够观察到增加扰动强度如何改变网络的置信度。\n\n**典型行为：** 当\
  \ $\\epsilon = 0$ 时，网络会正确预测为*大熊猫*。随着 $\\epsilon$ 从 0.01 → 0.1 → 0.2 增大，*预测置信度*不断下降，并最终转移到错误的类别，尽管在人类看来，图像仍然可被识别为大熊猫。这体现了深度神经网络惊人的脆弱性。这种脆弱性在安全敏感型应用中尤为关键，例如医学影像、自动驾驶和监控系统；在这些场景中，微小且不易察觉的扰动可能导致高置信度的错误决策，从而带来潜在严重的现实后果。\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_645_0.png)\n\n*图 12.31 – 使用预训练 MobileNet\
  \ 在 FGSM 攻击下的 Top-5 预测（ε=0.01）*\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_646_0.png)\n\
  \n*图 12.32 – 使用预训练 MobileNet 在 FGSM 攻击下的 Top-5 预测（ε=0.1）*\n\n*图 12.33 – 使用预训练 MobileNet\
  \ 在 FGSM 攻击下的 Top-5 预测（ε=0.2）*\n\n## 对抗攻击的防御\n\n目前已提出多种策略：\n\n- **对抗训练：** 使用对抗样本进行训练：\n\
  \n  $$L = L(x) + L(x_{adv}),$$\n\n  使网络更加鲁棒\n- **防御性蒸馏：** 平滑决策边界并降低敏感性\n- **输入去噪：**\
  \ 尝试在分类前移除对抗扰动\n- **认证防御：** 在有界扰动区域内提供数学上的鲁棒性保证\n\n## 对抗学习的应用\n\n尽管对抗样本最初被视为安全威胁，但如今它们不仅被广泛用于评估模型鲁棒性，还通过对抗训练来提升鲁棒性；此外，它们还可应用于模型调试、可解释人工智能、安全测试、自动驾驶汽车安全和医学人工智能验证等场景。\n\
  \n提取出的特征向量可看作一种学习到的图像描述符。对于输入图像 $x$，有 $f = \\Phi(x)$，其中 $\\Phi(\\cdot)$ 表示预训练的 EfficientNet\
  \ 编码器，$f$ 是最终得到的特征嵌入。直观地说，网络将像素转换为一个紧凑的数值签名，该签名捕获了形状、纹理、物体局部和语义信息。\n\n**构建图像数据库：**\
  \ 数据集中的所有图像都会经过特征提取器。\n\n```python\nfeat = feat_extractor.predict(x).ravel()\nfeatures.append(feat)\n\
  ```\n\n这会生成一个特征矩阵 $F = \\begin{bmatrix} f_1 \\\\ f_2 \\\\ \\vdots \\\\ f_N \\end{bmatrix}$，其中每一行对应一张图像。代码处理了\
  \ Caltech101 中的约 9,000 张图像，并存储它们的 *EfficientNet* 描述符。\n\n## 为什么需要降维？\n\n深度 CNN 嵌入通常具有非常高的维度。为了减少存储并加速相似性搜索，代码使用了主成分分析（PCA）：\n\
  \n```python\npca = PCA(n_components=500)\npca.fit(features)\npca_features = pca.transform(features)\n\
  ```\n\nPCA 将原始特征向量 $f$ 投影到一个低维空间：\n\n$$z = W^T f$$\n\n其中 $W$ 包含特征协方差矩阵的主特征向量。得到的压缩特征向量\
  \ (z) 在显著降低内存和计算需求的同时，保留了大部分判别性信息。\n\n**查询搜索引擎：** 给定一张查询图像，提取其特征向量。\n\n```python\n\
  img, x = load_image(\"images/guitar.jpg\")\nfeature = feat_extractor.predict(x).ravel()\n\
  pca_feature = pca.transform(feature.reshape(1,-1))\n```\n\n然后将查询嵌入与数据库中的每张图像用余弦距离进行比较。\n\
  \n```python\nsimilar_idx = [distance.cosine(pca_feature, feat) for feat in pca_features]\n\
  ```\n\n*余弦相似度* 衡量的是特征向量之间的夹角：\n\n$$\\operatorname{sim}(a,b) = \\frac{a^T b}{\\lVert\
  \ a \\rVert \\lVert b \\rVert}$$\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_650_0.png)\n\
  \n*图 12.35 – 使用查询图像搜索得到的相似图像*\n\n**可视化特征空间：** 理解检索性能的一种有效方式是用 PCA 或 t-SNE 来可视化特征嵌入。例如，`emb\
  \ = pca.transform(features)` 或 `tsne.fit_transform(features)`。相似的物体类别往往会在嵌入空间中形成簇，这表明\
  \ EfficientNet 已经学习到了有意义的图像语义组织。\n\n**计算复杂度：** 设 *N* 为数据库图像数，*d* 为特征维度。暴力搜索每次查询需要\
  \ *O(Nd)* 次运算。对于非常大的图像集合，可以使用 *FAISS*、*Annoy* 或 *ScaNN* 等近似最近邻方法，将检索时间从秒级降低到毫秒级。\n\
  \n**改进搜索引擎：** 以下几种增强手段可以显著提升检索质量：\n\n- 将 *EfficientNet* 替换为 DINOv2 等自监督模型\n- 使用来自\
  \ CLIP 的多模态嵌入\n- 使用三元组损失对网络进行微调\n- 用 FAISS 索引替换暴力搜索\n- 在向量数据库中存储嵌入，以支持大规模部署\n\n\
  到目前为止，我们已经学习了图像分类，其目标是为整张图像分配一个标签。在这个基础上，接下来我们将更进一步迈向目标检测，其目标不仅是识别图像中存在什么，还要使用边界框定位其中的每个物体。\n\
  \n## 目标检测\n\n**目标检测** 扩展了图像分类，它同时识别 **图像中存在什么物体以及它们位于何处**，从而将图像分类与空间定位结合在一起。\n\n\
  $x_D = \\{(c_i, b_i, s_i)\\}_{i=1}^{N}$, $b_i = (x_i, y_i, w_i, h_i)$; $f(x) \\\
  rightarrow \\{(c_i, b_i)\\}_{i=1}^{N}$\n\n### 交并比（IoU）\n\nIoU = Area(B_pred ∩ B_gt)\
  \ / Area(B_pred ∪ B_gt).\n\n例如，模型不再仅仅预测 Dog，而是输出 Dog 以及一个包围这只狗的边界框。多个物体可以同时被检测到，每个物体都有自己的类别和位置。\n\
  \n### 使用 RetinaNet 进行目标检测\n\n在本节中，我们将使用 PyTorch 中一个在 COCO 数据集上训练好的 RetinaNet-ResNet50-FPN\
  \ 预训练模型，无需额外训练即可检测多个物体。\n\nRetinaNet - 一种单阶段检测器：RetinaNet 是一种极具影响力的单阶段检测器，它结合了：\n\
  \n- 用于特征提取的 ResNet50 骨干网络\n- 用于多尺度检测的特征金字塔网络（FPN）\n- 用于处理类别不平衡的 Focal Loss\n\n其关键创新是\
  \ Focal Loss：\n\n$$FL(p_t) = -(1 - p_t)^\\gamma \\log(p_t)$$\n\n其中 $p_t$ 是模型对正确类别预测的概率。容易样本对损失的贡献更小，从而迫使网络关注困难的物体。\n\
  \n你可以把 RetinaNet 想象成使用 FPN 在多个分辨率下扫描图像，并在各处提出候选物体。然后，Focal Loss 会抑制大量容易的背景区域，让检测器专注于真正的物体。最终的结果是，一个准确的检测器能够在单次前向传播中识别出多个物体及其位置。\n\
  \n**加载预训练模型：** 使用预训练的 COCO 权重加载检测器。\n\n```python\nmodel = torchvision.models.detection.retinanet_resnet50_fpn(weights=\"\
  DEFAULT\")\nmodel.eval()\n```\n\n对应的 COCO 类别名称可通过以下方式获得：\n\n```python\nweights =\
  \ RetinaNet_ResNet50_FPN_Weights.DEFAULT\nCOCO_CLASSES = weights.meta[\"categories\"\
  ]\n```\n\n该模型可以识别大约 80 个常见的物体类别，包括人、车辆、动物和日常家居物品。\n\n**运行推理：** 将输入图像转换为张量，并传入 RetinaNet。\n\
  \n```python\nimg_tensor = transforms.ToTensor()(image)\nwith torch.no_grad():\n\
  \    outputs = model([img_tensor])[0]\n```\n\n\n\n模型返回：\n\n```\nboxes, scores, labels\
  \ = outputs[\"boxes\"], outputs[\"scores\"], outputs[\"labels\"]\n```\n\n概念上，Image\
  \ → RetinaNet → Box_i, Class_i, Score_i，其中每个检测结果由一个边界框、类别标签和置信度分数组成。\n\n**多尺度检测与\
  \ FPN：** 物体在图像中以不同尺寸出现。RetinaNet 使用特征金字塔网络将来自多个分辨率的信息结合起来：\n\n$P_l = Conv(C_l) +\
  \ Up(P_{l+1})$\n\n从而能够同时检测小物体和大物体。\n\n**置信度阈值：** 低置信度的检测结果会被移除。\n\n```\nthreshold\
  \ = 0.6\nkeep = scores >= threshold\nboxes, scores, labels = boxes[keep], scores[keep],\
  \ labels[keep]\n```\n\n这减少了误报并提高了可视化质量。\n\n**可视化：** 每个检测到的类别都被分配一个唯一颜色，并绘制边界框和标签：\n\
  \n```\ncolors = generate_colors(len(unique_labels))\ncv2.rectangle(img, (x1,y1),\
  \ (x2,y2), color, 3)\ntext = f\"{class_name} ({score:.2f})\"\n```\n\n最终输出以视觉可解释的形式显示物体的位置、预测类别和置信度分数。\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_652_0.png)\n\n**RetinaNet 为何有效：** RetinaNet\
  \ 结合了深度特征提取（ResNet50）、多尺度表示学习（FPN）和对类别不平衡的稳健处理（*Focal Loss*）。这些组件使其能够在保持高推理速度的同时，准确检测各种尺度的多个物体。\n\
  \n**优点：** RetinaNet 在保持相对高效的同时实现了高检测精度，这得益于其用于多尺度物体检测的 **特征金字塔网络（FPN）** 和 **Focal\
  \ Loss**，后者将学习重点放在困难样本上并缓解前景-背景类别不平衡。作为一个在 *COCO* 上预训练的模型，它可以在无需额外训练的情况下检测各种物体类别。与\
  \ *YOLO*（另一种流行的物体检测模型，将在稍后介绍）相比，后者优先考虑实时推理速度，*RetinaNet* 更强调检测精度，特别是在小物体和具有挑战性的物体上，使其非常适合高质量检测任务。\n\
  \n**局限性：** 小型、严重遮挡或视觉上模糊的物体仍可能被遗漏或误分类，并且推理速度通常比 YOLO 等轻量级检测器慢。由于模型是在 COCO 上预训练的，除非在特定任务数据集上进行微调，否则在特定领域物体上的性能可能会下降。\n\
  \n## 使用 Mask R-CNN 进行物体检测和实例分割\n\n虽然像 RetinaNet 这样的物体检测器仅预测边界框，但 **Mask R-CNN**\
  \ 通过额外生成每个检测物体的 **像素级分割掩码** 来扩展检测功能（如我们在分割章节中所见）。因此，每个实例由类别标签、置信度分数、边界框和分割掩码表示，从而能够精确地定位物体边界。\n\
  \n**Mask R-CNN 是一个两阶段物体检测器：** 第一阶段（**区域建议网络，RPN**）生成候选物体区域，而第二阶段对每个区域进行分类，细化其边界框，并为每个检测到的实例预测逐像素的分割掩码。\n\
  \n在此示例中，我们使用一个在 **COCO 数据集** 上训练的 **预训练 Mask R-CNN 模型**（`maskrcnn_resnet50_fpn`）。该模型采用\
  \ ResNet-50 主干和 **特征金字塔网络（FPN）** 进行多尺度特征提取，并在物体分类和定位的同时预测物体掩码。对于输入图像，网络返回：\n\n```\n\
  outputs = model([img_tensor])[0]\nboxes, scores, labels, masks = outputs[\"boxes\"\
  ], outputs[\"scores\"],\noutputs[\"labels\"], outputs[\"masks\"]\n```\n\n使用置信度阈值移除低置信度检测结果（`keep\
  \ = scores >= 0.50`）。每个保留的检测结果都被分配一个唯一颜色，并使用四个互补视图进行可视化：\n\n- **原始图像** – 输入场景\n\
  - **掩码叠加** – 实例分割掩码\n- **物体轮廓** – 提取的物体边界\n- **最终检测视图** – 掩码、轮廓、边界框、类别标签和置信度分数的组合\n\
  \n分割掩码是通过对预测概率图进行阈值处理获得的，其中彩色掩码与原始图像混合以创建透明叠加层。\n\n```\nmask = (mask[0] > 0.5).astype(np.uint8)\n\
  final_result = np.where(mask[:, :, None],\n                        final_result\
  \ * (1 - alpha) + overlay * alpha, final_result)\n```\n\n物体边界使用 OpenCV 轮廓提取。还生成了一个检测摘要表（参见\
  \ GitHub），显示每个实例的预测类别、置信度分数和分割面积。\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_654_0.png)\n\
  \n*Figure 12.37 – Object detection and instance segmentation with Mask R-CNN*\n\n\
  Mask R-CNN 可以被视为同时执行 **物体检测和语义分割**。首先，检测器识别物体 *位于何处*，然后专用的掩码分支预测 *哪些* 像素属于每个物体。与仅仅在自行车周围画一个框不同，Mask\
  \ R-CNN 可以精确地勾勒出车架、车轮和车把，提供更丰富的场景理解。可视化展示了 Mask R-CNN 如何从原始图像数据逐步推进到实例掩码、轮廓和最终检测。这种像素级定位在医学图像分析、自动驾驶、机器人、视频监控和图像编辑等应用中特别有用。\n\
  \n**练习：** 预训练模型有时会对同一物体产生多个重叠检测（例如，此处的 cycle 物体被检测了两次，每次对应一个车轮）。通过在可视化之前应用 **非极大值抑制（NMS）**（或按类别\
  \ NMS；使用 `torchvision.ops.nms`）来扩展实现，以移除冗余检测并获得更清晰的实例分割结果。\n\n虽然物体检测和实例分割对视觉物体进行定位和描绘，但\
  \ OCR 将相同的定位原理扩展到文本区域，然后执行字符识别，使机器能够直接从图像中读取文本信息，我们将在下一节中探讨这一点。\n\n## 光学字符识别（OCR）和视觉语言文本提取管道\n\
  \n本节通过引入 **光学字符识别（OCR）** 作为后检测或独立的识别模块，扩展了之前关于物体检测的讨论。OCR 在 **视觉感知和机器可读文本** 之间架起桥梁，使系统能够解释结构化文档、场景文本以及发票、招牌、支票和车牌等身份相关视觉内容。\n\
  \n### 问题建模：从像素到文本：\n\n给定输入图像 $I \\in \\mathbb{R}^{H\\times W\\times 3}$，OCR 旨在学习映射：\n\
  \n$$F_{OCR}: I \\rightarrow \\mathcal{T},$$\n\n其中 $\\mathcal{T}=t_1,t_2,\\ldots,t_n$\
  \ 是识别出的文本标记序列。经典 OCR 系统将其分解为两个阶段：\n\n- **文本检测：** 定位区域 $R_i \\subset I$\n- **文本识别：**\
  \ 将每个区域解码为字符串 $t_i=f_\\theta(R_i)$\n\n现代系统将两者集成到统一的深度学习管道中。\n\n### 使用 Tesseract\
  \ 的基线 OCR\n\nTesseract OCR 是一种传统的 **基于 LSTM 的识别引擎**，结合了版面分析。当文本结构良好（文档、发票）且预处理改善对比度和噪声水平时效果最佳。它支持页面分割模式（`--psm`）和\
  \ OCR 引擎模式（`--oem`）。\n\n**数学视角：** Tesseract 使用序列建模近似 $\\arg\\max_T P(T\\mid I)$：\n\
  \n$$P(T\\mid I)=\\prod_{i=1}^{n}P(t_i\\mid I,t_{<i})$$\n\n**实现 - 发票文本提取：** 图像首先转换为灰度，然后应用\
  \ OCR：\n\n```\ngray = cv2.cvtColor(bill, cv2.COLOR_BGR2GRAY)\ntext = pytesseract.image_to_string(gray,\
  \ config=r'--oem 3 --psm 4')\n```\n\n灰度转换降低了光度复杂性，而 `--psm 4` 假设 **稀疏列式版面**，适用于发票。\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_655_0.png)\n\n*Figure 12.38 – Extracting\
  \ text with OCR using Tesseract*\n\n\n\n\n\n**输出解释：** 提取的文本重构了结构化的账单信息，例如发票元数据（日期、ID）、行项目解析（食品项目、数量、价格）和最终总计。\n\
  \n这展示了传统 OCR 的一个关键局限：它本身并不理解结构——只处理文本序列。\n\n**多语言场景文本识别：** 场景文本（例如招牌）引入了非拉丁文字、噪声/失真以及可变光照。\n\
  \n**示例：孟加拉语 + 英语招牌 OCR**\n\n```\ntext = pytesseract.image_to_string(img, lang='ben',\
  \ config=config)\n```\n\n多语言 OCR 扩展了识别 ℱ * OCR: I → \U0001D4AF * lang，其中语言条件解码为：P(T\
  \ | I, L)，L 为语言先验。与文档 OCR 不同，多语言场景文本识别必须同时处理多样化的文字、复杂的背景、透视失真、可变照明和语言识别，使得识别任务变得更加困难。\n\
  \n多语言 OCR 通过结合特定语言的字符字典和语言模型来处理多种文字，使解码器能够识别并区分同一图像中不同语言的文本。输出包括混合语言检测：英语词元（例如“\
  \ CCTV ”、“ PARKING ”）和孟加拉文字识别。这突出了对语言模型和训练字符字典的依赖。\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_656_0.png)\n\
  \n*图 12.39 – 使用 Tesseract 的多语言场景文本识别*\n\n在探索了使用 Tesseract 的经典 OCR 之后，我们现在转向基于深度学习的\
  \ OCR，即 PaddleOCR，它在现实场景中提供了更大的鲁棒性。\n\n## 深度学习 OCR：PPOCR（PaddleOCR）\n\n*PaddleOCR\
  \ 引入了三阶段深度流水线：*\n\n- 文本检测（DBNet）\n- 角度分类\n- 文本识别（SVTR / CRNN 变体）\n\n**主要优势：** 与\
  \ Tesseract 不同，它联合学习检测和识别，对弯曲和旋转文本具有鲁棒性，并在真实图像上提供更好的性能。\n\n```\nocr = PaddleOCR(use_angle_cls=True,\
  \ lang='en')\nresult = ocr.ocr(image_path, cls=True)\n```\n\n提取的组件为边界框 $B_i$、文本预测\
  \ $t_i$ 和置信度分数 $s_i$。\n\n**可视化：** 系统使用 draw_ocr 将 $(B_i, t_i, s_i)$ 叠加到图像上，实现可解释性。\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_657_0.png)\n\n*图 12.40 – 使用 PPOCR 从银行支票中提取文本*\n\
  \n*PaddleOCR 通过解耦检测和识别以获得稳定性，显式建模 $P(T, B \\mid I) = P(B \\mid I) \\cdot P(T \\\
  mid B, I)$。*\n\n## ALPR（自动车牌识别）：通过检测 + 识别的端到端 OCR\n\n自动车牌识别（ALPR）是一种专门的 OCR 问题，其中必须先定位文本区域，然后才能进行字符识别。因此，现代\
  \ ALPR 系统采用两阶段流水线：\n\n$I \\xrightarrow{\\text{YOLOv5}} R_i \\xrightarrow{\\text{OCR}}\
  \ t_i,$\n\n其中 $R_i$ 表示检测到的车牌区域，$t_i$ 为识别的车牌文本。在此示例中，车牌定位使用 YOLOv5 执行，YOLOv5 是一种单阶段目标检测器，可在一次前向传递中预测边界框和类别概率，从而实现实时检测。\n\
  \n预训练的 YOLOv5m6 模型通过迁移学习在 Car Plate Detection Kaggle 数据集上进行微调，该数据集包含 433 张带有车牌边界框标注的车辆图像。在训练期间，检测器通过优化定位、目标性和分类损失来学习预测车牌位置\
  \ $(x_{\\min}, y_{\\min}, x_{\\max}, y_{\\max})$。检测到的车牌区域随后被裁剪并传递给 Tesseract OCR，后者提取字母数字车牌号码，形成完整的端到端\
  \ ALPR 系统。\n\n### 可视化最终结果：\n\n识别的车牌号码被渲染在检测到的图像上。\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_660_0.png)\n\
  \n*图 12.42 – 使用 YOLOv5 + Tesseract 的车牌检测*\n\n因此，完整的 ALPR 流水线可以总结为 图像 → YOLOv5（车牌\
  \ ROI）→ Tesseract（车牌号码）。通过结合基于深度学习的目标检测与**模块化感知流水线**，系统可自动定位车辆车牌并提取其字母数字标识，形成现代智能交通和监控系统的基础。\n\
  \nOCR 系统已从手工规则 → CNN/LSTM 流水线 → 视觉 Transformer 演进。现代 OCR 不再只是字符识别——它现在是一个**视觉语言理解任务**，与目标检测、场景理解和生成建模紧密集成。\n\
  \n## 使用 EasyOCR 的场景文本识别\n\n在构建了使用 YOLO 和 Tesseract 的完整 ALPR 流水线之后，让我们现在探索 EasyOCR，这是一个轻量级的基于深度学习的\
  \ OCR 系统（基于 CNN 特征提取和序列解码），只需几行代码即可实现鲁棒的场景文本检测和识别。\n\n**推理模型：** *I* → *CNN* → *SequenceDecoder*\
  \ → *T*。它输出边界框、文本和置信度分数。\n\n```python\nimport easyocr\nreader = easyocr.Reader(['en'])\n\
  img = cv2.imread(\"images/car.png\")\nresults = reader.readtext(img)\n```\n\n提取的车牌文本显示在下一幅图中。\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_660_1.png)\n\n*图 12.43 – 使用 EasyOCR 的车牌识别*\n\
  \n实时地标检测器能够估计密集的面部和手部关键点，使其成为交互式视觉应用的理想框架。\n\n在本节中，我们使用 *MediaPipe* 的 Tasks API\
  \ 来构建 Snapchat 风格的面部滤镜并可视化手部地标。这些示例展示了现代地标检测如何用于面部增强、手势分析、虚拟配饰和人机交互。\n\n## 面部地标检测和\
  \ Snapchat 风格滤镜\n\nMediaPipe Face Landmarker 预测由 468 个地标组成的密集面部网格：\n\n$$L = \\{(x_i,\
  \ y_i, z_i)\\}_{i=1}^{468}$$\n\n其中每个地标代表眼睛、眉毛、鼻子、嘴唇或下颌线等语义上有意义的面部位置。给定图像 $I$，检测器学习映射\
  \ $f(I) \\to L$，估计图像空间中归一化的地标坐标。这些地标提供了对面部几何表示，不受尺度和中等姿态变化的影响。\n\n在实现中，*MediaPipe*\
  \ 的 Face Landmarker 模型通过 *Tasks API* 初始化：\n\n```python\nfrom mediapipe.tasks.python\
  \ import vision\noptions = vision.FaceLandmarkerOptions(base_options=base_options,\n\
  \        output_face_blendshapes=False,\n        output_facial_transformation_matrixes=True,\
  \ num_faces=1)\nself.detector = vision.FaceLandmarker.create_from_options(options)\n\
  ```\n\n该模型加载面部地标模型并将推理限制为图像中最突出的面部。在推理之前，*OpenCV* 图像被转换为 *MediaPipe* 的内部图像表示：\n\n\
  ```python\nmp_image = mp.Image(image_format=mp.ImageFormat.SRGB, data=frame)\nresult\
  \ = self.detector.detect(mp_image)\n```\n\n这是预测地标的核心推理步骤。选择特定的地标索引来定义感兴趣的面部区域：左眼（33）、右眼（263）、鼻尖（1）、嘴角（61、291）。地标用作放置虚拟对象的锚点，例如太阳镜、胡须和卡通鼻子。例如，眼部地标\n\
  \n```python\nleft_eye, right_eye = face_landmarks[33], face_landmarks[263]\n```\n\
  \n为放置太阳镜提供了稳定的参考点，而鼻尖和嘴角则不然。\n\n为了正确放置滤镜，眼间距被用作比例参考：\n\n$$d = \\sqrt{(x_r - x_l)^2\
  \ + (y_r - y_l)^2},$$\n\n其中 $(x_l, y_l)$ 和 $(x_r, y_r)$ 表示左眼和右眼坐标。然后将叠加宽度计算为 $W_f\
  \ = \\alpha d$，其中 $\\alpha$ 是经验选择的缩放因子，例如太阳镜宽度计算为：\n\n```python\nglass_w = int(1.4\
  \ * abs(rx - lx))\n```\n\n\n\n\n该策略会自动调整滤镜尺寸以适应不同的面部尺寸。所选的关键点会被转换为图像坐标，并由一个边界矩形包围。这提供了直观的可视化效果，展示了MediaPipe如何将人脸划分为具有语义意义的区域，如眼睛、眉毛、鼻子、嘴唇和整个面部。然后，利用PNG\
  \ alpha通道进行感知透明度的合成，从而生成视觉上逼真的叠加效果，且不会出现可见的矩形伪影（通过alpha混合实现）。\n\n```\npts = np.array([[int(face_landmarks[i].x*w),\
  \ int(face_landmarks[i].y*h)]\n    for i in indices])\nx, y, bw, bh = cv2.boundingRect(pts)\n\
  ```\n\n下图展示了该管线的三个阶段：原始图像、检测到的面部区域，以及带有太阳镜、胡须和卡通鼻子滤镜的最终Snapchat风格增强图像。\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_663_0.png)\n\
  \n图12.45 – 使用MediaPipe的Snapchat滤镜\n\n## 手部关键点检测与手势可视化\n\nMediaPipe手部关键点检测器（Hand\
  \ Landmarker）为每只检测到的手估计21个解剖学关键点：\n\n$H = \\{(x_i, y_i, z_i)\\}_{i=1}^{21}$\n\n\
  这些关键点对应于手指关节、指尖和手掌位置，为手部提供了一种紧凑的骨骼表示。该检测器学习 $g(I) \\rightarrow H$，其中 $H$ 编码手部姿态和细粒度的手指关节运动。预训练的手部关键点检测器使用MediaPipe\
  \ Tasks API初始化：\n\n```\noptions = vision.HandLandmarkerOptions(base_options=base_options,\
  \ num_hands=2)\nself.detector = vision.HandLandmarker.create_from_options(options)\n\
  ```\n\n这支持同时跟踪最多两只手。与基于边界框的检测器不同，关键点模型能够捕捉细粒度的手指运动，因此适用于手势识别和手语分析。手部骨骼可以表示为图 $G\
  \ = (V, E)$，其中顶点 $V$ 对应关键点，边 (E) 定义关节之间的解剖连接。例如，拇指链由(0,1)、(1,2)、(2,3)、(3,4)表示。这些骨骼连接编码为：\n\
  \n```\nHAND_CONNECTIONS = [(0,1), (1,2), (2,3), (3,4), ...]\n```\n\n人体姿态的表示。它们共同说明了现代计算机视觉的一个关键趋势：从粗略的物体检测转向**密集的关键点定位和对人体解剖的几何感知理解。**\n\
  \n除了可视化和分析之外，关键点表示还可以作为生成模型的运动描述符。通过跟踪面部或身体关键点随时间的变化，可以将运动从一个主体转移到另一个主体，从而实现逼真的图像动画和DeepFake生成。下一节将通过**一阶运动模型（First\
  \ Order Motion Model，FOMM）**来探讨这一思想，该模型利用学习到的基于关键点的表示来合成运动。\n\n## 使用一阶运动模型生成Deepfake\n\
  \n**一阶运动模型（First Order Motion Model，FOMM）**是一种用于图像动画的关键点生成框架，它可以将运动从驱动视频转移到单个源图像。给定源图像\
  \ $I_s$ 和驱动帧 $I_d^t$，目标是通过以下方式合成动画帧：\n\n$$I^t = G(I_s, K_s, K_d^t),$$\n\n其中，$G$\
  \ 是生成器网络，$K_s$ 和 $K_d^t$ 分别是从源图像和驱动帧中提取的稀疏运动关键点。\n\n在运行*DeepFake*管线之前，需要从GitHub克隆官方的*FOMM*代码仓库，并将*Colab*环境配置为使用与预训练模型及依赖项兼容的Python版本。该仓库包含图像动画所需的预训练网络架构、配置文件、运动迁移算法和实用函数。\n\
  \n```\n!git clone https://github.com/AliaksandrSiarohin/first-order-model\n```\n\
  \n后续步骤会加载预训练检查点，并使用模型的关键点检测器和生成器网络，将运动从驱动视频转移到静态源图像，生成逼真的动画DeepFake序列。与依赖手动定义的面部关键点的经典人脸动画方法不同，FOMM自动学习关键点：\n\
  \n$$K = \\{(x_i, y_i)\\}_{i=1}^N$$\n\n从而使模型能够以*自监督*的方式发现与运动相关的区域。源帧和驱动帧之间的运动会被转换为稠密变形场，在图像合成前对源图像特征进行扭曲。预训练的关键点检测器和生成器通过以下方式加载：\n\
  \n```\ngenerator, kp_detector = load_checkpoints(config_path='config/vox-256.yaml',\n\
  \                                    checkpoint_path=filename)\n```\n\n其中，kp_detector\
  \ 估计运动关键点，generator 合成动画输出。源图像和驱动视频帧会被调整为模型的训练分辨率：\n\n```\nselected_image = imread('/content/socrates.png')[...,\
  \ :3]\ndriving_video = [resize(frame, (256,256))[..., :3] for frame in driving_video]\n\
  ```\n\n然后使用以下代码片段生成动画（完整代码请参考GitHub）：\n\n```\npredictions = make_animation(resize(np.asarray(selected_image),\
  \ (256,256)),\n[resize(frame,(256,256)) for frame in driving_frames],\ngenerator,\
  \ kp_detector)\n```\n\n在内部，模型执行\n\n$K_s = f_{kp}(I_s),\\ K_d^t = f_{kp}(I_d^t)$\n\
  \n随后进行运动估计和图像生成：\n\n$M_t = \\Phi(K_s, K_d^t),\\ \\hat{I}^t = G(I_s, M_t)$\n\n生成的序列保留了源图像的外观和身份，同时复现了驱动视频中观察到的面部表情、头部姿态和运动。最后，驱动帧、源图像和合成输出会并排显示（动态视频请参考GitHub）：\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_666_0.png)\n\n*图12.47 – 使用FOMM进行视频中的运动迁移*\n\
  \n尽管基于扩散的更新型虚拟形象模型现在已经实现了更高的真实感，但FOMM仍然是最有影响力和计算效率最高的DeepFake生成方法之一，它展示了一张静态图像如何通过学习到的运动迁移实现动画化：外观\
  \ + 运动 → 动画视频。这一原理构成了现代语音头部合成、虚拟化身、数字人以及神经视频生成系统的基础。\n\n## 使用YOLOv8分割进行车辆损坏检测与严重程度评估\n\
  \n**保险理赔评估**传统上依赖人工检查车辆损坏情况，这一过程耗时、主观且成本高昂。现代计算机视觉系统可以通过定位损坏区域、估计其范围并提供客观的严重程度度量来自动化该过程。在本演示中，我们在Kaggle的**CarDD（车辆损坏检测）**数据集上训练了YOLOv8的分割版本，该数据集包含凹痕、划痕、裂缝和破损部件等标注的车辆损坏。与预测矩形边界框的目标检测不同，实例分割预测像素级掩码，从而能够准确估计损坏面积。\n\
  \n首先，从Kaggle下载CarDD（车辆损坏检测）数据集，并将其解压到本地dataset/目录中，这将提供训练和评估YOLOv8分割模型所需的车辆图像及对应的损坏标注。\n\
  \n```\n!kaggle datasets download -d nasimetemadi/car-damage-detection\n!unzip -q\
  \ car-damage-detection.zip -d dataset\n```\n\n导入Ultralytics YOLO框架，并加载预训练的YOLOv8\
  \ Nano分割（YOLOv8n-seg）模型，该模型已在COCO数据集上训练，可以作为在车辆损坏分割任务上进行迁移学习和微调的起点：\n\n```\nfrom\
  \ ultralytics import YOLO\nmodel = YOLO(\"yolov8n-seg.pt\")\n```\n\n与YOLOv5相比，YOLOv8提供了无锚框检测、改进的特征提取、更好的精度-速度权衡，以及在小型目标上更强的性能。\n\
  \n数据集准备与标注转换：CarDD数据集以COCO格式提供，而YOLOv8分割需要YOLO多边形格式的标注。预处理流程中最重要的部分是将COCO分割掩码转换为归一化的多边形坐标，使用convert_coco_to_yolo_seg()函数完成；完整代码请参考GitHub。该代码需要在Colab\
  \ / GPU上运行。对于每个标注，提取多边形顶点并进行归一化：\n\n```\nx, y = largest_seg[i] / w, largest_seg[i\
  \ + 1] / h\n```\n\n这将像素坐标转换为范围在 ([0,1]) 内的归一化坐标，使标注与分辨率无关。转换后的标签随后写入YOLO分割文件：\n\n\
  ```\nline = f\"{cls_id} \" + \" \".join(map(str, points))\n```\n\n随后生成数据集配置文件。\n\
  \n```\nwith open(\"damage_seg.yaml\", \"w\") as f:\n    f.write(yaml_text)\n```\n\
  \n该YAML文件指定了训练和验证图像路径，以及YOLOv8使用的损坏类别。\n\n训练YOLOv8分割模型：分割网络使用预训练的YOLOv8模型进行初始化（从以下位置下载）：\n\
  \n```\nmodel = YOLO(\"yolov8n-seg.pt\")\n```\n\n在CarDD数据集上训练/微调预训练的YOLOv8分割模型。根据GPU和Colab负载情况，训练可能需要几分钟到几小时；请耐心等待训练过程完全结束后再继续。\n\
  \n```\nmodel.train(data=\"damage_seg.yaml\", epochs=30, imgsz=640, batch=8)\n```\n\
  \n\n\n\n在这里，预训练模型将其学到的视觉特征适配到车辆损伤分割任务上。在训练过程中，YOLO 联合优化定位、分类和分割掩码损失，以提升像素级的损伤预测能力。\n\
  \n**损伤分割与严重程度估计**：训练结束后，加载性能最佳的检查点。\n\n```\nbest_model = YOLO(\"runs/segment/train-7/weights/best.pt\"\
  )\n```\n\n在测试图像上执行推理：\n\n```\nresults = best_model(test_image)\n```\n\n模型返回与检测到的损伤区域对应的分割掩码。通过统计掩码像素数量来估算总损伤面积。\n\
  \n```\nmasks = results[0].masks.data.cpu().numpy()\nfor mask in masks:\n    area\
  \ = np.sum(mask > 0.5)\n    total_damage += area\n```\n\n数学上，如果 M(x, y) 表示二值损伤掩码，则\
  \ A = Σₓ,ᵧ M(x, y) 给出以像素为单位的损伤面积。随后，该面积被映射到严重程度类别：\n\n```\nif total_damage < 5000:\
  \    severity = \"Minor\"\nelif total_damage < 20000:  severity = \"Moderate\"\n\
  else:                       severity = \"Severe\"\n```\n\n尽管方法较为简单，这种基于规则的方式展示了如何将分割输出转换为保险相关的量化指标。\n\
  \n**结果可视化**：预测掩码直接渲染在车辆图像上。\n\n```\nannotated = results[0].plot()\n```\n\n将原始图像与分割出的损伤区域进行并排对比，能够对预测质量进行直观验证。最终输出不仅定位了受损部件，还提供了估计的严重程度等级，展示了深度学习如何助力自动化保险检查、理赔处理、车队管理和车辆状况评估系统。\n\
  \n## 本章小结\n\n本章全面介绍了现代图像分类与目标检测的完整历程，涵盖了基础的深度学习方法以及提升精度、效率、鲁棒性和数据效率的新兴范式。通过整合识别、定位、分割、文本提取和基于关键点的分析，这些方法使机器能够从视觉数据中提取有意义的信息，并支持广泛的现实应用。本章所建立的概念自然地为下一章铺平了道路——下一章的重点将从理解图像转向通过生成式\
  \ AI 和图像合成模型来创造图像。在下一章中，我们将探索计算机视觉领域最新的生成式 AI 模型。\n\n## 订阅 Agentic Engineering，并在参与过程中免费获取一本电子书\n\
