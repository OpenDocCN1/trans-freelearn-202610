- "### 图像处理与计算机视觉中的生成式 AI\n\n前一章聚焦于图像分类和目标检测，计算机视觉系统在其中学习识别和定位视觉内容。相比之下，本章探索快速发展的生成式\
  \ AI 领域，模型不仅要理解图像，还要学会创建、修改、修复和变换图像。本章从生成对抗网络和变分自编码器开始，逐步深入到基于扩散的方法（如 Stable Diffusion、SDXL、ControlNet\
  \ 和 GPT 图像模型），并使用 Python 介绍现代图像合成、图像编辑、修复、风格迁移和多模态视觉系统的理论基础与实践实现。\n\n本章首先介绍生成建模的基础概念，包括**生成对抗网络（GANs）**和**变分自编码器（VAEs）**，然后逐步推进到现代基于扩散的方法，涵盖\
  \ Stable Diffusion、SDXL、ControlNet 和 OpenAI GPT-Image 模型。本章还探讨了多模态视觉-语言系统、提示引导的图像生成、可控图像合成，以及用于真实世界计算机视觉和图像处理应用的实用\
  \ Python 实现。这些主题共同为理解那些将现代视觉 AI 从图像理解推向图像创造的技术提供了全面介绍。\n\n在本章中，我们将学习以下主题：\n\n- 使用条件生成对抗网络（cGANs）进行类别条件图像生成\n\
  - 使用条件变分自编码器（CVAE）进行条件图像生成\n- Pix2Pix 和 CycleGAN 用于图像到图像的转换\n- 基于 StyleGAN 的高保真人脸合成与语义操作\n\
  - GFPGAN：使用生成式人脸先验进行盲人脸修复\n- 去噪扩散概率模型（DDPMs）\n- 使用 Stable Diffusion 进行文本到图像的生成\n\
  - 使用 InstructPix2Pix 进行图像编辑\n- 使用 ControlNet 进行结构引导的图像生成\n- Stable Diffusion 和 SDXL\
  \ 的实际应用\n- 用于保持身份的姿态引导生成的 IP-Adapter 和 ControlNet\n- 使用 DALL·E 2 和 DALL·E 3 API\
  \ 进行图像生成\n- GPT 图像 API：生成、编辑、修复和视觉\n\n# 技术要求\n\n在阅读本章各节时，请跟随 Jupyter notebook（并运行必要的代码片段）。以下是本章对应的\
  \ notebook 的 GitHub 链接：https://github.com/PacktPublishing/Hands-On-Image-Processing-and-Computer-Vision-with-Python-Second-Edition。为了使代码能够无缝运行，在运行代码之前，必须安装正确版本的库。如果版本不匹配，根据库中的某些特性/函数是否被移除或弃用，代码可能需要进行一些细微调整。\n\
  \n# 使用条件生成对抗网络（cGANs）进行类别条件图像生成\n\n**生成对抗网络（GANs）**由 Ian Goodfellow 及其同事于 2014 年提出，是现代机器学习中最具影响力的生成模型之一。GAN\
  \ 由两个相互竞争的神经网络组成：一个**生成器** *G*，从随机噪声中合成图像；一个**判别器** *D*，试图区分真实图像和生成图像。通过这种对抗博弈，生成器逐渐学会生成越来越逼真的样本。\n\
  \n原始的 GAN 学习数据分布 *p(x)*，但对生成何种类型的图像几乎无法控制。例如，在 *Fashion-MNIST* 上训练时，标准 GAN 可能生成衬衫、鞋子、连衣裙或包，但无法被指示合成特定类别。**条件生成对抗网络（cGANs）**通过将生成器和判别器都附加类别标签、属性或文本描述等额外信息作为条件，克服了这一限制。\n\
  \n**训练数据集**：*Fashion-MNIST* 是一个基准图像数据集，包含**10 个服装类别中的 70,000 张 28 × 28 灰度图像**（例如\
  \ T 恤、裤子、连衣裙、运动鞋和包），特别适合用于演示 cGAN，因为离散的类别标签能够清晰地展示**类别条件图像生成**，使模型能够按需合成特定服装类别，同时训练计算成本较低。\n\
  \n**条件对抗学习**：在 cGAN 中，生成器接收潜在向量 *z* 和条件 *y*：*x̂ = G(z, y)*。\n\n类似地，判别器评估图像-标签对：*D(x,\
  \ y)*。\n\n目标函数变为：\n\nmin_G max_D \U0001D53C_{x ~ p_data}[log D(x, y)] + \U0001D53C\
  _{z ~ p_z}[log(1 − D(G(z, y), y))]\n\n因此，判别器不仅要判断图像是否逼真，还要判断图像是否与所提供的条件匹配。在本例中，y\
  \ 对应于 Fashion-MNIST 的十个类别之一，使模型能够按需生成特定服装类别。\n\n**生成器架构**：生成器对类别标签进行嵌入，将其与潜在向量拼接，将结果投影为特征张量，并将其上采样为\
  \ 28 × 28 的 Fashion-MNIST 图像。\n\n```\nclass Generator(nn.Module):\n    def __init__(self):\n\
  \        super().__init__()\n        self.emb = nn.Embedding(NUM_CLASSES, 128)\n\
  \        self.fc = nn.Sequential(\n            nn.Linear(LATENT_DIM + 128, 7*7*256),\n\
  \            nn.ReLU()\n        )\n        self.net = nn.Sequential(\n         \
  \   nn.ConvTranspose2d(256,128,4,2,1),\n            nn.ReLU(),\n            nn.ConvTranspose2d(128,64,4,2,1),\n\
  \            nn.ReLU(),\n            nn.Conv2d(64,1,3,1,1),\n            nn.Tanh()\n\
  \        )\n\n    def forward(self, z, y):\n        y = self.emb(y)\n        x =\
  \ torch.cat([z,y], dim=1)\n        x = self.fc(x).view(-1,256,7,7)\n        return\
  \ self.net(x)\n```\n\n__init__() 方法通过定义网络层和可训练参数来构建网络架构，而 forward() 方法实现从输入到输出的前向传播过程中执行的计算。生成器首先使用\
  \ nn.Embedding() 将类别标签转换为可学习的嵌入表示。该嵌入捕获每个类别的语义信息，并将离散标签转换为连续的向量表示。然后，使用 torch.cat()\
  \ 将潜在向量和类别嵌入拼接起来。数学上，\n\n$$h = [z; e(y)]$$\n\n这种组合表示被投影为低分辨率特征图，并使用转置卷积逐步上采样，将空间分辨率从\
  \ 7 × 7 → 14 × 14 → 28 × 28 逐步提高。最后，Tanh 激活函数生成归一化的灰度图像。\n\n**投影判别器**：一种朴素的 conditioning\
  \ 方法是将标签与图像特征拼接。现代 cGAN 通常使用投影判别器，它提供更强的条件约束。判别器提取图像特征并计算投影分数：\n\n$$h(x)^T e(y)$$\n\
  \n\n\n它衡量图像与提供的类别标签之间的兼容性：\n\n```\nclass Discriminator(nn.Module):\n    def __init__(self):\n\
  \        super().__init__()\n        self.emb = nn.Embedding(NUM_CLASSES, 256)\n\
  \        self.conv = nn.Sequential(\n            nn.utils.spectral_norm(nn.Conv2d(1,64,4,2,1)),\n\
  \            nn.LeakyReLU(0.2),\n            nn.utils.spectral_norm(nn.Conv2d(64,128,4,2,1)),\n\
  \            nn.LeakyReLU(0.2))\n        self.fc = nn.Linear(128*7*7, 256)\n   \
  \     self.out = nn.Linear(256,1)\n\n    def forward(self, x, y):\n        h = self.conv(x).view(x.size(0),\
  \ -1)\n        h = self.fc(h)\n        proj = (h * self.emb(y)).sum(1, keepdim=True)\n\
  \        return self.out(h) + proj\n```\n\n判别器提取图像特征 h(x) 并计算投影 proj，对应于\n\nD(x,y)\
  \ = f(h(x)) + h(x)^T e(y)\n\n第一项衡量图像的真实性，而投影项衡量图像特征与提供的类别标签之间的一致性。这种机制显著改善了类别条件生成。GAN\
  \ 训练通常由于对抗优化动态而不稳定，这可能导致梯度消失/爆炸、判别器过于强大、训练振荡以及模式崩溃（生成器仅产生少数重复样本，而非捕捉完整的数据分布）。为了稳定训练，应用了谱归一化\
  \ nn.utils.spectral_norm()，它约束了判别器的 Lipschitz 常数并防止不稳定的梯度增长。\n\n一旦使用指数移动平均 EMA 等技术改善了训练稳定性，下一步就是评估生成输出的质量。\n\
  \n## Exponential Moving Average (EMA) Generator\nGAN 参数在训练期间可能会大幅波动。为了获得更平滑、更可靠的样本，会维护一个\
  \ EMA 生成器。\n\n```\nG_ema = Generator().to(device)\nG_ema.load_state_dict(G.state_dict())\n\
  \ndef ema_update(beta=0.999):\n    with torch.no_grad():\n        for p, p_ema in\
  \ zip(G.parameters(), G_ema.parameters()):\n            p_ema.data.mul_(beta)\n\
  \            p_ema.data.add_(p.data*(1-beta))\n```\n\nEMA 模型在评估和图像生成期间使用。更新\n\n\
  $$\\theta_{EMA}=\\beta\\theta_{EMA}+(1-\\beta)\\theta,$$\n\n其中 $\\beta=0.999$ 使用以下方式实现：`p_ema.data.mul_(beta).add_(p.data\
  \ * (1 - beta))`。\n\nEMA 生成器用于评估和样本生成，因为它通常能产生更清晰、更稳定的结果。\n\n## Evaluating Image\
  \ Quality with FID\n模型使用 Fréchet Inception Distance (FID) 进行评估，FID 是生成模型的标准度量。给定真实图像的特征分布\
  \ $(\\mu_r,\\Sigma_r)$ 和生成图像的特征分布 $(\\mu_g,\\Sigma_g)$，FID 分数是：\n\n$$FID=\\lVert\\\
  mu_r-\\mu_g\\rVert_2^2+\\operatorname{Tr}(\\Sigma_r+\\Sigma_g-2(\\Sigma_r\\Sigma_g)^{1/2})$$\n\
  \nFID 值越低，表示生成图像越接近真实数据分布。实现会定期计算 FID。\n\n```\nfrom torchmetrics.image.fid import\
  \ FrechetInceptionDistance\nfid_metric = FrechetInceptionDistance(feature=64).to(device)\n\
  ```\n\nFID 衡量真实图像和生成图像分布之间的相似性，是生成模型最广泛使用的指标之一。\n\n```\ndef compute_fid(real, fake):\n\
  \    fid_metric.reset()\n    fid_metric.update(real, real=True)\n    fid_metric.update(fake,\
  \ real=False)\n    return fid_metric.compute().item()\n\nfid_score = compute_fid(real_fid,\
  \ fake_fid)\n```\n\n并自动保存性能最佳的模型。\n\n对抗训练：使用 hinge-loss 目标在判别器和生成器更新之间交替进行。对于每个小批量，生成器首先生成类别条件伪造图像，用于更新判别器。\n\
  \n```\nLATENT_DIM = 128\nz = torch.randn(real.size(0), LATENT_DIM, device=device)\n\
  fake = G(z,y).detach()\nd_loss = (F.relu(1-D(real,y)).mean() + F.relu(1+D(fake,y)).mean())\n\
  opt_d.zero_grad(); d_loss.backward()\nopt_d.step()\nA new batch of fake images is\
  \ then generated to update the generator.\nz = torch.randn(real.size(0), LATENT_DIM,\
  \ device=device)\nfake = G(z,y)\ng_loss = -D(fake,y).mean()\n```\n\n```\nopt_g.zero_grad();\
  \ g_loss.backward()\nopt_g.step()\nema_update()\n```\n\n## Hinge Loss\n与原始 GAN 损失不同，实现使用\
  \ *hinge loss*：\n\n$$L_D = \\mathbb{E}[\\max(0,1 - D(x, y))] + \\mathbb{E}[\\max(0,1\
  \ + D(G(z, y), y))]$$\n\n并且\n\n$$L_G = -\\mathbb{E}[D(G(z, y), y)]$$\n\n（在上述代码中为\
  \ d_loss 和 g_loss）。Hinge loss 通常比二元交叉熵提供更稳定的优化和更好的样本质量。\n\n每个 epoch 之后，EMA 生成器使用\
  \ Fréchet Inception Distance (FID) 进行评估，生成可视化，并保存性能最佳的模型。为了改善收敛，余弦退火学习率调度在训练期间逐渐降低学习率。\n\
  \n```\nsched_g = torch.optim.lr_scheduler.CosineAnnealingLR(opt_g, EPOCHS)\nsched_d\
  \ = torch.optim.lr_scheduler.CosineAnnealingLR(opt_d, EPOCHS)\n```\n\n这种交替优化过程使生成器能够生成越来越逼真的类别条件\
  \ Fashion-MNIST 图像，同时保持稳定的对抗训练。下图展示了使用 Fashion-MNIST 训练 cGAN 的示意图：\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_676_0.png)\n\
  \nFigure 13.1 – Training a Conditional GAN (cGAN) model with fashion-MNIST images\n\
  \n训练后，网络学习到一个类别条件潜在空间，能够根据用户指定的类别生成逼真的 Fashion-MNIST 图像。类别嵌入、投影判别、谱归一化、hinge loss、EMA\
  \ 平均和基于 FID 的模型选择相结合，比基本的条件 GAN 实现产生了显著更好的结果。\n\n## Class Transition in the Conditional\
  \ Latent Space\n以下函数演示了训练好的 cGAN 如何通过在保持潜在向量固定的同时对学习到的类别嵌入进行插值，从而平滑地将一个 Fashion-MNIST\
  \ 类别转变为另一个类别。\n\nEmbedding Interpolation：函数 class_transition() 通过在保持潜在向量固定的同时对两个类别的嵌入进行插值来生成一系列图像，从而可视化类别之间的平滑语义转换。\n\
  \n```\ndef class_transition(class_a, class_b, steps=15):\n    z = torch.randn(1,\
  \ LATENT_DIM, device=device)\n    emb_a = G.emb(torch.tensor([class_a], device=device))\n\
  \    emb_b = G.emb(torch.tensor([class_b], device=device))\n    imgs = []\n\n  \
  \  with torch.no_grad():\n        for alpha in np.linspace(0, 1, steps):\n     \
  \       emb = ((1 - alpha) * emb_a + alpha * emb_b)\n            img = generate_from_embedding(G,\
  \ z, emb)\n            imgs.append(img.cpu())\n    return imgs\n```\n\nImage Generation\
  \ from an Interpolated Embedding：函数 generate_from_embedding() 绕过标签嵌入层，并直接从潜在向量和任意（可能为插值）类别嵌入合成图像。插值后的嵌入与固定的潜在向量连接并通过生成器传递，生成对应于中间语义状态的图像：\n\
  \n```\ndef generate_from_embedding(G, z, emb):\n    x = G.fc(torch.cat([z, emb],\
  \ dim=1))\n    x = x.view(-1, 256, 7, 7)\n    return G.net(x)\n```\n\n### Transition\
  \ Sequence\n生成一系列中间嵌入，产生两个 Fashion-MNIST 类别之间的平滑视觉转换。例如，\n\n```\nimages = class_transition(7,\
  \ 9)\n```\n\n创建从 **Sneaker**（类别 7）到 **Ankle Boot**（类别 9）的渐进转换，说明学习到的条件嵌入空间捕捉了服装类别之间有意义的语义关系。\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_679_0.png)\n\n*Figure 13.4 – Class transition\
  \ – from Sneaker to Ankle Boot in cGAN latent space*\n\n## Visualizing the Learned\
  \ Conditional Manifold with t-SNE\n为了检查学习到的条件空间的结构，为每个 Fashion-MNIST 类别生成 500 张图像，并使用\
  \ t-SNE 将其从原始 784 维图像空间投影到 2D 流形。这种可视化有助于评估生成器是否学习到不同类别的良好分离且语义上有意义的聚类，表明条件解耦有效。\n\
  \n```\nimgs = G(z, labels)\nX = images.view(images.size(0), -1).numpy()\ntsne =\
  \ TSNE(n_components=2, perplexity=30, random_state=42)\nX_2d = tsne.fit_transform(X)\n\
  ```\n\n resulting 可视化显示，不同 Fashion-MNIST 类别的样本形成大体上不同的聚类，表明 cGAN 学会了类别特定的表示。视觉上相似的类别如\
  \ **Shirt, Pullover, and Coat** 存在一些重叠，而 **Bag, Sneaker, and Ankle Boot** 等类别则很好地分离。这种聚类证明了良好的类别可分性和结构良好的条件潜在流形。\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_679_1.png)\n\n*Figure 13.5 – t-SNE 2D-manifold\
  \ for fashion-MNIST samples generated with cGAN*\n\n## Advantages\n对生成图像类别的显式控制，通过\
  \ hinge loss 和谱归一化改善训练稳定性，通过 EMA 平均获得高质量样本，使用投影判别实现有效的标签条件。\n\n\n\n\n\n**局限性：**\
  \ 训练仍然计算密集，模式崩溃仍可能发生（模式崩溃是指 GAN 生成器学会生成有限种类的样本，同时忽略真实数据分布的大部分），并且 FID 并不能完美地与人类感知相关。\n\
  \n总体而言，cGANs 通过对抗学习提供了强大的可控性和高保真样本生成，但其训练复杂性和不稳定性促使了替代的概率方法，例如 CVAEs，我们将在下文介绍其以实现更稳定但更平滑的条件生成。\n\
  \n## 使用条件变分自编码器（CVAE）的条件图像生成\n\ncGANs 通过生成器和判别器之间的对抗博弈生成图像，而 **变分自编码器（VAEs）** 学习数据的概率潜在表示，并通过解码从学习到的分布中抽取的潜在向量来生成新样本。\
  \ **条件变分自编码器（CVAE）** 通过将类别标签纳入编码器和解码器来扩展 VAE，从而实现可控的图像生成。给定潜在变量 $z$、图像 $x$ 和类别标签\
  \ $y$，CVAE 对条件分布 $p_\\theta(x|z,y)$ 建模，通过指定标签 $y$ 即可合成所需类别的图像。\n\n与 GAN 不同，GAN 可能遭受模式崩溃，CVAEs\
  \ 明确地将潜在空间正则化为遵循已知的先验分布，通常是标准高斯分布。这产生了一个平滑且可解释的潜在流形，支持插值、可视化和语义操作。\n\n**CVAE 架构：**\
  \ 架构由三个主要组件组成：\n\n- **Encoder：** 将图像-标签对 $(x,y)$ 映射到潜在分布\n- **Reparameterization\
  \ Layer：** 采样潜在代码 $z$\n- **Decoder：** 在 $z$ 和 $y$ 的条件下重建图像\n\n编码器预测潜在分布的均值和方差：\n\
  \n$q_\\phi(z|x,y) = \\mathcal{N}(\\mu(x,y), \\sigma^2(x,y)),$\n\n其中 $\\mu$ 和 $\\\
  sigma$ 由神经网络学习。解码器建模 $p_\\theta(x|z,y)$，根据潜在代码和类别标签重建或生成图像。下一代码片段中的 CVAE 类实现了一个条件变分自编码器，该自编码器学习\
  \ Fashion-MNIST 图像的类别条件潜在表示：\n\n```\n```python\nclass CVAE(nn.Module):\n\n    def\
  \ __init__(self):\n        super().__init__()\n        self.mu = nn.Linear(256,\
  \ LATENT_DIM) # LATENT_DIM = 64\n        self.logvar = nn.Linear(256, LATENT_DIM)\n\
  \        self.label_fc = nn.Linear(NUM_CLASSES, 32)\n        self.encoder = nn.Sequential(...)\
  \ # refer to GitHub for complete code\n        self.decoder = nn.Sequential(...)\
  \ # refer to GitHub for complete code\n```\n```\n\n```\n```python\ndef encode(self,\
  \ x, y):\n    y = self.label_fc(F.one_hot(y, NUM_CLASSES).float())\n    h = self.encoder(torch.cat([x,\
  \ y], dim=1))\n    return self.mu(h), self.logvar(h)\n\ndef reparameterize(self,\
  \ mu, logvar):\n    std = torch.exp(0.5 * logvar)\n    return mu + torch.randn_like(std)\
  \ * std\n\ndef decode(self, z, y):\n    y = self.label_fc(F.one_hot(y, NUM_CLASSES).float())\n\
  \    return self.decoder(torch.cat([z, y], dim=1))\n\ndef forward(self, x, y):\n\
  \    mu, logvar = self.encode(x, y)\n    z = self.reparameterize(mu, logvar)\n \
  \   return self.decode(z, y), mu, logvar\n```\n```\n\n**基于类别标签的条件化：** 类别标签首先转换为独热向量并投影到连续嵌入空间（`self.label_fc`）。标签嵌入在编码器中与图像特征拼接，在解码器中与潜在向量拼接。这种条件化机制使模型能够学习类别特定的潜在分布并生成属于所需\
  \ Fashion-MNIST 类别的图像。\n\n**Encoder：** 编码器接收展平的 28 × 28 图像以及嵌入的类别标签。编码器并非直接生成潜在向量，而是预测高斯分布的参数：\n\
  \n$$\\mu = f_\\mu(x,y), \\log \\sigma^2 = f_\\sigma(x,y)$$\n\n**重参数化技巧：** 直接从高斯分布采样会阻止梯度通过网络传播。因此\
  \ VAE 使用重参数化技巧。数学上，\n\n$$z = \\mu + \\sigma \\odot \\epsilon, \\qquad \\epsilon\
  \ \\sim \\mathcal{N}(0, I)$$\n\n该公式保持可微性并使端到端训练通过反向传播成为可能。\n\n**Decoder：** 解码器从潜在代码和类别嵌入重建图像。生成执行为：\n\
  \n$$\\hat{x} = D(z,y),$$\n\n其中 $D$ 表示解码器网络。\n\n**CVAE 损失函数：** CVAE 目标结合了重建精度和潜在空间正则化。重建项确保忠实的数据生成，而\
  \ KL 散度则将潜在空间正则化为平滑的先验分布，从而在 CVAE 框架中实现有意义的插值和采样。\n\n```\ndef cvae_loss(recon, x,\
  \ mu, logvar):\n    recon_loss = F.binary_cross_entropy(recon, x, reduction=\"sum\"\
  )\n    kl = -0.5 * torch.sum(1 + logvar - mu.pow(2) - logvar.exp())\n    return\
  \ recon_loss + BETA * kl\n```\n\n完整的损失为：\n\n$$L = L_{\\text{recon}} + \\beta L_{\\\
  text{KL}},$$\n\n其中 $L_{\\text{recon}} = -\\sum_i x_i \\log \\hat{x}_i + (1 - x_i)\\\
  log(1 - \\hat{x}_i)$ 且 $L_{\\text{KL}} = D_{KL}(q_\\phi(z|x,y) \\| \\mathcal{N}(0,I))$。\n\
  \n超参数 $\\beta$ 控制重建保真度与潜在空间平滑度之间的权衡。\n\n**无对抗训练：** 与 GAN 不同，CVAEs 只需要单一网络且不涉及判别器。这与\
  \ cGANs 中使用的对抗训练范式形成对比，在该范式中生成器和判别器相互竞争，凸显了 CVAEs 作为条件生成模型更广泛家族中更稳定但通常更不清晰的替代方案。因此训练仅由标准的前向和反向传递组成：\n\
  \n```\nrecon, mu, logvar = model(x, labels)\nloss, recon_loss, kl = cvae_loss(recon,\
  \ x, mu, logvar)\nloss.backward()\noptimizer.step()\n```\n\n这使得 CVAEs 比 GANs 更容易且更稳定地训练，尽管生成的图像通常略显模糊。\n\
  \n**类别条件图像生成：** 训练后，可通过采样潜在向量并指定类别标签来生成图像。\n\n```\nz = torch.randn(1, LATENT_DIM)\n\
  for cls in range(10):\n    label = torch.tensor([cls]) # same_z_different_labels\n\
  \    img = model.decode(z, label)\n```\n\n下图显示了从每个 Fashion-MNIST 类别生成的示例，证明解码器已学习到类别特定的视觉特征，例如鞋子、包、连衣裙和衬衫。\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_683_0.png)\n\n*Figure 13.6 – Sample images\
  \ generated with CVAE trained on fashion-MNIST images*\n\n## 使用 t-SNE 可视化潜在空间：\n\
  \n为研究学习到的潜在表示，可将编码器产生的潜在均值投影到二维，使用 t-SNE。\n\n```\nmu, _ = model.encode(x, labels)\n\
  coords = TSNE(n_components=2, perplexity=20).fit_transform(features)\n```\n\n resulting\
  \ 流形显示 Fashion-MNIST 类别占据潜在空间的不同区域。相似的类别如衬衫、毛衣和外套表现出部分重叠，而视觉上不同的类别如包、运动鞋和靴子形成良好分离的簇。这证明\
  \ CVAE 已学习到有意义的类别结构化潜在表示。\n\n## 跨类别条件遍历：\n\n通过固定潜在向量 *z* 并在线性插值两个类别标签之间，解码器生成从 *sneaker*\
  \ 到 *ankle boot* 的平滑语义过渡。此实验分离了类别条件化的影响，并证明 CVAE 可以在保持底层潜在风格的同时连续融合对象类别。下述代码在保持潜在向量\
  \ *z* 固定的同时执行 **类别条件插值**。语义过渡完全由变化的类别标签嵌入驱动：\n\n$$x_{\\alpha}=D(z,(1-\\alpha)y_1+\\\
  alpha y_2)$$\n\n```\n# Encode one sneaker and one bag\nz = torch.randn(1, LATENT_DIM,\
  \ device=device)\ny1 = torch.tensor([7], device=device)  # Sneaker\ny2 = torch.tensor([9],\
  \ device=device)  # Ankle Boot\ny1_hot = F.one_hot(y1, NUM_CLASSES).float()  # One-hot\
  \ labels\ny2_hot = F.one_hot(y2, NUM_CLASSES).float()\n\nwith torch.no_grad():\n\
  \    for a in enumerate(np.linspace(0,1,15)):\n        y = (1-a)*y1_hot + a*y2_hot\
  \       # Label interpolation\n        img = model.decode(z, y)\n        img = img.view(28,\
  \ 28).cpu()\n```\n\n\n\n\n当 α 从 0 变化到 1 时，通过对类别条件向量进行插值，生成图像会在两个 Fashion-MNIST 类别之间平滑过渡，这证明了所学条件潜在空间的连续性。\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_684_0.png)\n\n图 13.7 – cVAE 潜在空间中的跨类别过渡——从运动鞋到短靴\n\
  \n### 类内潜在空间遍历：\n\n与在语义类别之间切换（例如上一个例子中的“运动鞋”到“短靴”）的*跨类别*遍历不同，*类内*遍历保持类别标签固定（例如下一个代码片段中\
  \ 7 代表运动鞋），并通过在*潜在向量*之间进行*插值*，CVAE 生成同一物体类别的平滑变化，这表明所学潜在空间能够捕获诸如*形状*和*风格*这类连续的类内属性：\n\
  \n```\nx1 = img_sneaker.view(1,-1).to(device)\nx2 = img_bag.view(1,-1).to(device)\n\
  y1 = torch.tensor([7], device=device) # Sneaker\ny2 = torch.tensor([8], device=device)\
  \ # Bag\nmu1,_ = model.encode(x1, y1)\nmu2,_ = model.encode(x2, y2)\n\nfor i,a in\
  \ enumerate(np.linspace(0,1,15)):\n    z = (1-a)*mu1 + a*mu2\n    out = model.decode(z,\
  \ y1)\n```\n\n完整实现可在随附的 GitHub 仓库中获取，这里仅展示最终的遍历可视化结果。\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_684_1.png)\n\
  \n图 13.8 – 使用 cVAE 的类内（运动鞋）潜在遍历\n\n### 条件潜在流形探索：\n\n通过同时插值潜在向量和类别标签，可以进一步探索学习到的流形。这将生成一个二维潜在景观，其中相邻图像在外观和语义类别上都平滑变化，有助于理解\
  \ CVAE 如何组织 Fashion-MNIST 概念（代码参见 GitHub）。\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_685_0.png)\n\
  \n*图 13.9 – 使用 cVAE 的条件潜在流形探索*\n\n### CVAE 与 cGAN 的对比：\n\n与 cGAN 相比，CVAE 提供了更平滑、更具可解释性的潜在空间，支持有意义的插值，并且训练更可靠，因为它们避免了对抗优化。然而，cGAN\
  \ 通常能生成更清晰、更逼真的图像。因此，当潜在空间分析、表示学习和可控生成比照片级逼真度更重要时，人们往往更倾向使用 CVAE。此外，cGAN 的潜在表示往往形成更清晰的类别分离簇，而\
  \ CVAE 的潜在表示则重叠更多，因为 KL 散度正则化鼓励所有类别共享一个共同的连续潜在流形（可比较 2D-tSNE 流形）。\n\n总体而言，当稳定性、可解释性和结构化潜在表示是主要目标时，CVAE\
  \ 更受青睐，尤其是在特征分析、受控插值和下游表示学习等任务中；而 cGAN 则更适合视觉保真度和感知清晰度至关重要的应用，例如高质量图像合成和逼真的数据增强。\n\
  \n## 用于图像到图像转换的 Pix2Pix 和 CycleGAN\n\n图像到图像转换旨在学习两个视觉域之间的映射，是一个实用工具，可以减少人工投入，并在实际应用中实现可扩展的跨域视觉合成。给定来自一个域的输入图像\
  \ *x*，目标是生成另一个域中对应的图像 *y*，同时保留底层场景结构。示例包括草图转照片、卫星图转地图、夏季转冬季以及马转斑马的转换。Pix2Pix 和 CycleGAN\
  \ 是基于 GAN 的两个里程碑式图像转换框架。尽管它们都学习图像域之间的映射，但在训练期间可用的监督信息上有着本质区别。\n\n### Pix2Pix – 成对图像转换：\n\
  \nPix2Pix 由 Phillip Isola 等人（2017）提出，假设存在*成对*的训练样本 $(x,y)$，其中每个输入图像都有对应的真实目标图像。生成器学习\
  \ $G:x\\to y$，判别器则区分真实图像对 $(x,y)$ 与伪造图像对 $(x,G(x))$。目标函数结合了对抗损失和 $L_1$ 重建损失：\n\n\
  $$L_{\\mathrm{Pix2Pix}}=L_{\\mathrm{GAN}}(G,D)+\\lambda L_1(G),$$\n\n其中 $L_1(G)=\\\
  mathbb{E}_{x,y}[\\|y-G(x)\\|_1]$。对抗项促进真实性，而重建项保持与目标图像的对应关系。\n\n### CycleGAN – 非成对图像转换：\n\
  \n获取成对数据集通常成本高昂，甚至不可能。CycleGAN 由 Jun-Yan Zhu 等人（2017）提出，通过从两个非成对图像集合中学习来解决这一限制。\n\
  \n考虑两个域：$X=$ 马，$Y=$ 斑马。CycleGAN 学习两个生成器：$G:X\\to Y$、$F:Y\\to X$，以及两个判别器 $D_X$ 和\
  \ $D_Y$。\n\n关键创新在于**循环一致性约束**：\n\n$$F(G(x))\\approx x,\\quad G(F(y))\\approx y$$\n\
  \n由此产生循环一致性损失：\n\n$$L_{\\mathrm{cyc}}=\\mathbb{E}_x[\\|F(G(x))-x\\|_1]+\\mathbb{E}_y[\\\
  |G(F(y))-y\\|_1]$$\n\n完整目标为：\n\n$$L=L_{\\mathrm{GAN}}(G,D_Y)+L_{\\mathrm{GAN}}(F,D_X)+\\\
  lambda L_{\\mathrm{cyc}}$$\n\n循环约束避免了任意映射，并有助于在改变外观的同时保留内容。\n\n> **注意**\n> \n> 在*成对*设置中，每个输入图像都与真实目标对齐（例如，图像到掩码的映射），而在*非成对*设置中，两个域是独立且不对齐的（例如，马和斑马图像的独立集合，彼此没有一一对应关系）。\n\
  \n### CycleGAN 架构：\n\n下一张图展示了 CycleGAN 框架。该模型包含：\n\n- 1. 判别器 $D_Y$：检测假的斑马\n- 2.\
  \ 判别器 $D_X$：检测假的马\n- 3. 循环一致性损失，强制执行可逆映射\n\n## 使用预训练 CycleGAN 进行马到斑马的转换\n\n与其从头训练\
  \ CycleGAN（通常需要大量数据、计算资源且耗时），接下来的 Python 演示使用来自官方 CycleGAN 实现的预训练 马 ↔ 斑马 模型，对单张输入图像执行图像转换。首先，安装所需的\
  \ PyTorch 和可视化库，然后下载\n\nStyleGAN3 的设置包括克隆 NVIDIA 的官方仓库、安装所需依赖（ninja、click、requests、tqdm、pyspng、imageio-ffmpeg），以及下载预训练的\
  \ FFHQ 1024x1024 生成器检查点，用于推理和图像合成。\n\n```\n!git clone https://GitHub.com/NVlabs/stylegan3.git\n\
  %cd stylegan3\n!pip install ninja click requests tqdm pyspng imageio-ffmpeg\n!wget\
  \ https://api.ngc.nvidia.com/v2/models/nvidia/research/stylegan3/\nversions/1/files/stylegan3-t-ffhq-1024x1024.pkl\n\
  ```\n\n### 模型加载与潜在采样：\n\n在提供的实现中，使用 NVIDIA 官方检查点加载预训练的 StyleGAN3 模型（FFHQ 数据集）：\n\
  \n```\nwith dnnlib.util.open_url(\"stylegan3-t-ffhq-1024x1024.pkl\") as f:\n   \
  \ G = legacy.load_network_pkl(f)[\"G_ema\"].to(device)\n```\n\n这里，G_ema 代表**指数移动平均生成器**，它能提供比原始权重更高质量的样本。该模型在两种潜在空间中运行：\n\
  \n- Z 空间：输入高斯噪声\n- W 空间：中间解耦表示（隐式学习）\n\n> **注意**\n> \n> 解耦潜在空间是这样一种表示：不同的潜在维度或方向对应生成图像中不同且很大程度上独立的语义属性，例如姿态、年龄、表情或发型。\n\
  \n### 从潜在空间生成图像：\n\n每张图像都从一个采样的潜在向量生成：\n\nz ~ N(0,I),   x = G(z)\n\n```\ndef generate(seed):\n\
  \    z = torch.from_numpy(np.random.RandomState(seed).randn(\n        1, G.z_dim)).to(device)\n\
  \    label = torch.zeros([1, G.c_dim], device=device)\n    img = G(z, label)\n```\n\
  \n该函数通过采样基于种子的潜在向量、将其输入带有零类别标签的 StyleGAN 生成器，并将输出张量后处理为有效的 8 位 RGB 图像数组来生成合成图像。固定种子可确保结果可复现。类别条件\
  \ c 在此处未使用（FFHQ 是无条件的），输出张量会从 [−1,1] 归一化到 [0,255]。以下是一些使用不同种子生成的合成人脸：\n\n\n\n##\
  \ StyleGAN3 合成人脸\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_691_0.png)\n\n图13.11——使用StyleGAN3生成的合成人脸\n\
  \n潜在空间插值：StyleGAN的一个关键特性是潜在空间在语义上是平滑的。给定两个潜在编码（z₁, z₂），插值定义为：\n\n```\nz(α) = (1\
  \ − α)z₁ + αz₂,      α ∈ [0,1]\n```\n\n这会产生渐进的语义过渡，例如身份变换、姿态过渡和表情融合。\n\n下一个代码片段生成两个基于种子的潜在向量，并在多个步骤间进行线性插值，将每个插值后的向量输入StyleGAN，以可视化生成器产生的合成人脸图像之间的平滑过渡。\n\
  \n```\nz1 = torch.from_numpy(np.random.RandomState(100).randn(1,G.z_dim)).to(device)\n\
  z2 = torch.from_numpy(np.random.RandomState(500).randn(1,G.z_dim)).to(device)\n\
  for alpha in np.linspace(0,1,9):\n    z = (1-alpha)*z1 + alpha*z2\n    img = G(z,\
  \ torch.zeros([1,G.c_dim], device=device))\n```\n\n与像素空间插值不同，潜在空间插值保持了真实性，因为生成器将线性潜在流形映射到非线性图像流形。\n\
  \n### 潜在空间插值\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_691_1.png)\n\n图13.12——使用StyleGAN3进行潜在空间插值\n\
  \n### 局部潜在扰动与流形结构\n\n通过对中心潜在向量进行扰动，可以在潜在空间中进行局部探索：\n\n$$z' = z + \\Delta z$$\n\n\
  其中仅修改选定的维度：\n\n```python\ndelta[0] = (i-grid//2)*0.5\ndelta[1] = (j-grid//2)*0.5\n\
  z = center + delta\n```\n\n早期的潜在维度通常控制**全局属性**（姿态、性别、光照）。微小的扰动揭示了StyleGAN3编码了一个**局部平滑流形**，支持可控合成。\n\
  \n### StyleGAN3中的风格混合\n\nStyleGAN引入了一种**基于风格的生成器架构**，其中不同层控制不同层次的抽象。合成过程为：\n\n$$w=f(z),\\\
  quad x=G_s(w)$$\n\n风格混合会替换潜在风格中的部分子集：\n\n$$w_l^{(mix)}=\\begin{cases}w_l^{(A)},\
  \ & l<k\\\\ w_l^{(B)}, & l\\ge k\\end{cases}$$\n\n该方程定义了StyleGAN风格混合：早期层（$l<k$）使用来自潜在变量$A$的风格，后期层（$l\\\
  ge k$）使用来自潜在变量$B$的风格，从而生成一个结合了$A$的粗略结构和$B$的精细细节的混合图像。\n\n以下代码实现了这一点：通过从行种子和列种子生成潜在向量，将一个向量的早期层风格与另一个向量的后期层风格组合，并合成一个合成人脸图像网格，以可视化受控的语义特征迁移。\n\
  \n```python\nW_row, W_col = [], []\nfor s in [10,20,30]:\n    z = torch.from_numpy(np.random.RandomState(s).randn(1,G.z_dim)).to(device)\n\
  \    W_row.append(G.mapping(z, None))\nfor s in [100,200,300]:\n    z = torch.from_numpy(np.random.RandomState(s).randn(1,G.z_dim)).to(device)\n\
  \    W_col.append(G.mapping(z, None))\n\nfor r in range(3):\n    for c in range(3):\n\
  \        w = W_row[r].clone()\n        w[:,8:] = W_col[c][:,8:]\n        img = G.synthesis(w)\n\
  ```\n\n函数$G.mapping()$将来自输入潜在空间$Z$的随机潜在向量$z$转换为解耦潜在空间$W$中的中间潜在表示$w$，在该空间中，姿态、面部结构和纹理等语义属性变得更加独立可控。这里早期层→粗略结构（姿态、脸型），而后期层→精细纹理（皮肤、头发、光照）。这使得**无需监督的语义解耦**成为可能。\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_693_0.png)\n\n*图13.13——使用StyleGAN3进行风格混合*\n\
  \n## StyleGANEX：高保真反演与身份编辑\n\n虽然StyleGAN3专注于无条件合成，但StyleGANEX将StyleGAN扩展为真实图像编辑和反演框架，结合了*GAN反演*、基于编码器的潜在预测、特征级优化和人脸对齐流程。它专为**真实世界的人脸编辑、重建和变形**而设计。\n\
  \nStyleGANEX的搭建涉及克隆官方仓库，该仓库提供了高保真人脸重建、操作和变形所需的预训练模型、反演框架和潜在编辑工具。\n\n```bash\n!git\
  \ clone https://github.com/williamyang1991/StyleGANEX.git\n```\n\n**GAN反演问题：** 给定真实图像$x$，GAN反演旨在找到潜在编码$w$，使得：\n\
  \n$$w^* = \\underset{w}{\\operatorname{argmin}}\\; \\mathcal{L}(G(w), x),$$\n\n\
  其中$\\mathcal{L}$是重建损失（像素+感知），$G$是预训练生成器。StyleGANEX通过优化潜在编码$w$、中间特征$f$和随机噪声图$n$来改进这一点，其中$\\\
  phi(\\cdot)$是感知特征提取器（通常是VGG）。\n\n**解码反演后的人脸表示：** 函数decode()使用pSp解码器（基于StyleGAN生成器构建）从潜在编码、中间特征和噪声图中重建人脸图像，并将输出转换为可显示的RGB图像。\n\
  \n```python\ndef decode(model, w, f, noise):\n    with torch.no_grad():\n      \
  \  img, _ = model.decoder([w], input_is_latent=True,\n            first_layer_feature=f,\
  \ noise=noise)\n    img = (img.clamp(-1,1) + 1) * 127.5\n    img = img.permute(0,2,3,1)[0].cpu().numpy().astype(np.uint8)\n\
  \    return Image.fromarray(img)\n```\n\n**通过潜在插值进行人脸变形：** 首先，将两张人脸对齐并反演到W⁺潜在空间，产生潜在表示w₁和w₂。然后通过在这些潜在编码之间进行线性插值来创建变形序列：\n\
  \n$$w(\\alpha) = (1 − \\alpha)w_1 + \\alpha w_2,    \\alpha \\in [0,1]$$\n\n每个插值后的潜在向量由pSp/StyleGAN生成器解码，生成中间人脸图像，并将所得帧组合成动画GIF。相关代码如下：\n\
  \n```python\nw1, f1, n1, _, _ = invert(img1, psp, lm, inv_steps)\nw2, f2, n2, _,\
  \ _ = invert(img2, psp, lm, inv_steps)\nframes = []\nfor a in np.linspace(0, 1,\
  \ steps):\n    w = (1-a)*w1 + a*w2\n    frames.append(np.array(decode(psp, w, f1,\
  \ n1)))\nimageio.mimsave(\"morph.gif\", frames, fps=15)\n```\n\n此处，invert()将每张人脸映射到StyleGAN（W⁺）潜在空间，w\
  \ = (1 − a)w1 + a * w2执行潜在插值，decode()重建相应的人脸图像，mimsave()将所有生成的帧组合成平滑的变形动画。这产生了时间上平滑的人脸变换，在潜在空间而不是像素空间中形成连续轨迹。所得序列展示了StyleGAN潜在流形的语义连续性，其中面部身份逐渐变化（从左脸到右脸），同时保持照片级真实感。\n\
  \nStyleGAN 变形过程\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_695_0.png)\n\n*图13.14——使用StyleGANEX进行人脸变形*\n\
  \n**时间变形可视化：** 生成的GIF展示了身份转换、平滑的面部结构变形以及高频细节的保留。\n\n这证实了*StyleGANEX*潜在空间是**语义一致且测地线平滑的**（即，沿着*潜在空间中最短路径*的插值会在生成的图像中产生渐进、连续的变化，而不会出现突变的视觉伪影，从而证实了StyleGANEX潜在空间中的语义一致性）。\n\
  \n**StyleGAN3**学习的是*纯生成流形*：$z \\to x$，而**StyleGANEX**学习的是*可逆语义映射*：$x \\leftrightarrow\
  \ w \\leftrightarrow x'$。它们共同代表了现代生成视觉中的两种互补范式：先合成（StyleGAN3）和先重建与编辑（StyleGANEX）。\n\
  \n在生成和编辑这两种互补范式的基础上，下一个方法介绍了如何进一步利用预训练生成先验来执行图像恢复任务。\n\n## GFPGAN：使用生成式人脸先验进行盲人脸恢复\n\
  \n**生成式人脸先验GAN（GFPGAN）**是一个人脸恢复框架，它将恢复网络与预训练的StyleGAN先验相结合，从退化图像中恢复真实且保持身份的人脸细节。与纯粹在像素层面操作的传统增强方法不同，GFPGAN利用学习到的人脸流形来重建合理的人脸结构。\n\
  \n给定退化图像$y$，$y = D(x) + n$，其中$x$是未知的高质量人脸图像，$D(\\cdot)$表示未知的退化过程，$n$表示噪声，目标是估计恢复后的图像$\\\
  hat{x} = R(y)$。GFPGAN使用预训练的StyleGAN生成器$x_G = G(w)$来约束重建，其中$w$是StyleGAN潜在空间中的潜在表示。该模型结合了重建损失、感知损失、对抗损失和身份保持损失，以生成视觉上真实且保持面部身份的人脸。\n\
  \n**安装GFPGAN：** 搭建过程包括克隆仓库、安装所需的依赖项，以及下载预训练的GFPGAN v1.3检查点。\n\n```bash\n!git clone\
  \ https://github.com/TencentARC/GFPGAN.git\n%cd GFPGAN/\n!pip install -r requirements.txt\n\
  !wget https://github.com/TencentARC/GFPGAN/releases/download/v1.3.0/GFPGANv1.3.pth\
  \ -P experiments/pretrained_models\n```\n\n**加载恢复模型：** 预训练的GFPGAN模型初始化如下：\n\n```python\n\
  restorer = GFPGANer(model_path='experiments/pretrained_models/GFPGANv1.3.pth',\n\
  \                    upscale=2, arch=\"clean\")\n```\n\n\n\n\n\n在这里，`upscale=2`\
  \ 将图像分辨率提高一倍，而 `arch=\"clean\"` 则选择轻量级的复原架构。\n\n### 人脸复原\n\n核心复原步骤为：\n\n```\n_,\
  \ _, restored_img = restorer.enhance(img, paste_back=True)\n```\n\n`enhance()` 函数会检测面部区域，利用生成式先验恢复面部细节，并将增强后的面部重新嵌入原始图像中。完整的复原函数可简化为：\n\
  \n```\ndef restore_image_gfpgan(img):\n    restorer = GFPGANer(model_path='experiments/pretrained_models/GFPGANv1.3.pth',\
  \ \\\n                        upscale=2, arch=\"clean\")\n    _, _, restored_img\
  \ = restorer.enhance(img, paste_back=True)\n    return restored_img\n```\n\n###\
  \ 可视化结果\n\n该演示复原了多张面部图像，并将原始图像与增强后的输出并排展示：\n\n```\nrestored = restore_image_gfpgan(cv2.imread(input_path))\n\
  ```\n\n复原后的图像通常会展现出更清晰的面部特征、更少的伪影、更高的纹理质量以及更强的感知真实感，这说明了生成式面部先验在盲人脸复原中的有效性，如下图所示（图中将一组退化人脸及其\
  \ GFPGAN 复原版本以网格形式绘制出来）。\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_697_0.png)\n\
  \n*图 13.15 – 使用 GFPGAN 进行盲人脸复原*\n\n下图中展示了更多复原的人脸：\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_698_0.png)\n\
  \n*图 13.16 – 使用 GFPGAN 进行盲人脸复原*\n\n当 GFPGAN 利用对真实人脸结构的习得知识（*强面部先验*）从严重退化或低分辨率图像中恢复出保持身份特征的高质量面部细节时，它比传统增强方法更受青睐。\n\
  \n除了基于 GAN 的框架（包括 cGAN、CVAE、CycleGAN、StyleGAN 和 GFPGAN）之外，现代生成式 AI 中另一个互补且同样具有开创性的范式是\
  \ *扩散模型*，它已成为通过迭代去噪进行高保真图像合成的基础方法。\n\n## 去噪扩散概率模型（DDPM）\n\n扩散模型已成为最成功的生成建模范式之一，为\
  \ Stable Diffusion、Imagen 和 DALL-E 等现代图像合成系统提供动力。与通过对抗训练学习生成图像的 GAN 不同，**去噪扩散概率模型（DDPM）**\
  \ 学习逐步逆转随机噪声过程。其核心思想非常简单：通过添加高斯噪声逐步破坏图像，直至其变成纯噪声，然后训练一个神经网络来逆转这一过程并重建原始图像。\n\nDDPM\
  \ 由两个互补的过程组成：\n\n- **前向扩散**（添加噪声）\n- **反向扩散**（去除噪声）\n\n这两个过程共同定义了一条马尔可夫链，将图像转换为噪声，再从噪声重建图像。\n\
  \n## 前向扩散过程\n\n前向过程通过在 $T$ 个时间步上添加高斯噪声来逐步破坏图像信息。从一张干净图像 $x_0$ 出发：\n\n$$q(x_t \\\
  mid x_{t-1}) = \\mathcal{N}\\left(x_t; \\sqrt{\\alpha_t}x_{t-1}, (1-\\alpha_t)I\\\
  right)$$\n\n其中 $\\alpha_t = 1 - \\beta_t$，$\\beta_t$ 是一个较小的方差调度，控制每一步添加的噪声量。DDPM\
  \ 的一个显著特性是：任意时间步的图像都可以直接从原始图像采样得到：\n\n$$q(x_t|x_0) = \\mathcal{N}\\left(x_t; \\\
  sqrt{\\bar{\\alpha}_t} x_0, (1-\\bar{\\alpha}_t)I\\right)$$\n\n其中 $\\bar{\\alpha}_t\
  \ = \\prod_{s=1}^{t} \\alpha_s$（它决定了在时间步 $t$ 时原始图像保留了多大比例）。等价地：\n\n$$x_t = \\sqrt{\\\
  bar{\\alpha}_t} x_0 + \\sqrt{1-\\bar{\\alpha}_t} \\epsilon, \\quad \\epsilon \\\
  sim \\mathcal{N}(0, I)$$\n\n该方程表明，每一幅带噪图像都只是原始图像与高斯噪声的加权组合。下面的代码通过逐步用高斯噪声破坏图像，模拟了\
  \ DDPM 的前向扩散过程。\n\n### 噪声调度\n\n下面的代码使用线性方差调度：\n\n```\nT = 1000\nbetas = np.linspace(1e-4,\
  \ 0.02, T)\nalphas = 1 - betas\nalpha_bar = np.cumprod(alphas)\n```\n\n序列 $\\beta_t$\
  \ 决定了信息被破坏的速度。早期的时间步只引入轻微扰动，而后期的时间步则逐渐用噪声淹没图像。\n\n### 可视化前向扩散\n\n前向扩散过程通过以下代码实现。在选定的时间步上，使用闭式扩散方程生成图像：\n\
  \n$$x_t = \\sqrt{\\bar{\\alpha}_t} x_0 + \\sqrt{1-\\bar{\\alpha}_t} \\epsilon, \\\
  quad \\epsilon \\sim \\mathcal{N}(0, I)$$\n\n实现为：\n\n```\nnoise = np.random.randn(*img.shape)\n\
  xt = (np.sqrt(alpha_bar[t]) * img + np.sqrt(1-alpha_bar[t]) * noise)\n```\n\n这里，`img`\
  \ 对应原始图像 $x_0$，而 `noise` 表示高斯噪声样本 $\\varepsilon$。在 $t = 0$ 时，图像几乎不变。随着 $t$ 增大，图像的贡献减少，噪声的贡献增加，视觉结构逐渐消失，直到图像变得与高斯噪声无法区分。生成的可视化展示了轨迹\
  \ $x_0 \\rightarrow x_{50} \\rightarrow x_{100} \\rightarrow \\cdots \\rightarrow\
  \ x_{999}$，演示了扩散如何将自然图像转变为纯噪声。\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_699_0.png)\n\
  \n*图 13.17 – 前向扩散过程 – 从图像到噪声*\n\nU-Net 估计噪声分量，而调度器计算下一个去噪样本 $x_{t-1}$。从概念上讲，每次迭代执行以下过程：带噪图像\
  \ → 较少噪声的图像 → 更干净的图像，直到生成逼真的图像。\n\n### 可视化反向扩散\n\n在采样过程中记录中间状态。\n\n```\ncapture_steps\
  \ = [999,900,800,700, 600,500,400,300, 200,100,50,0]\n```\n\n收集到的快照揭示了视觉结构的逐渐显现，如下图所示：\n\
  \n- $t = 999$：纯高斯噪声\n- $t = 700$：出现微弱的颜色块\n- $t = 400$：出现粗略的物体结构\n- $t = 100$：出现可辨认的语义内容\n\
  - $t = 0$：最终合成图像\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_701_0.png)\n\n*图 13.18\
  \ – 反向扩散过程 – 从噪声到图像*\n\n上述可视化凸显了扩散模型最直观的方面之一：图像生成本质上是一个逐步去除噪声的过程（注意在去噪过程中视觉结构如何逐渐显现）。\n\
  \n*DDPM* 提供了一种与 GAN 根本不同的图像生成方法。它不是学习从潜向量到图像的直接映射，而是学习一系列去噪操作，逐步将随机噪声转换为逼真样本。其训练目标稳定，潜表示表达力强，并且始终能够达到最先进的图像质量。\n\
  \n前向扩散过程按照以下公式逐步破坏图像：\n\n$$x_t = \\sqrt{\\bar{\\alpha}_t}x_0 + \\sqrt{1-\\bar{\\\
  alpha}_t}\\epsilon,$$\n\n而反向扩散过程学习估计并去除噪声分量 $\\epsilon_\\theta(x_t,t)$，从而从纯噪声中重建图像。这个简单而强大的思想构成了现代基于扩散的生成式\
  \ AI 系统的基础。\n\n## 潜空间扩散模型\n\n最初的**去噪扩散概率模型（DDPM）**直接在图像像素上执行扩散过程。尽管非常有效，但像素空间扩散的计算成本很高，因为高分辨率图像包含数百万个值。**潜空间扩散模型（LDM）**通过在一个由**变分自编码器（VAE）**学习的压缩潜表示中执行扩散（而非在像素空间中）来解决这一限制。这一思想构成了\
  \ Stable Diffusion 等现代扩散系统的基础。\n\n给定图像 $x$，编码器 $E$ 将其映射为潜表示 $z = E(x)$，其中 $z$ 比原始图像小得多。然后对\
  \ $z$ 而不是 $x$ 应用扩散。\n\n去噪后，解码器 $D$ 重建图像：$\\hat{x} = D(z)$。例如，一张 $512 \\times 512\
  \ \\times 3$ 的图像包含 786,432 个像素值，而 Stable Diffusion VAE 将其压缩为大小为 $(4, 64, 64)$ 的潜张量，仅包含\
  \ 16,384 个值——大约缩小了 48 倍。这极大地减少了内存占用和计算成本。\n\n### 用于潜压缩的变分自编码器\n\nStable Diffusion\
  \ VAE 使用以下方式加载：\n\n```\nvae = AutoencoderKL.from_pretrained(\"stabilityai/sd-vae-ft-mse\"\
  ).to(device)\n```\n\n图像被编码到潜空间并重建。\n\n```\nlatent = vae.encode(x).latent_dist.sample()\n\
  recon = vae.decode(latent).sample\n```\n\n编码器将图像压缩为低维潜表示，而解码器则从该表示重建图像。重建结果与原始图像非常相似，如下图所示，这表明尽管潜空间的维度低得多，但它保留了大多数视觉上重要的信息。\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_702_0.png)\n\n*图 13.19 – VAE 潜空间重建*\n\
  \n> **注意**\n>\n> 从数学上讲，编码器预测一个高斯潜分布 $q_\\phi(z|x) = \\mathcal{N}(\\mu(x), \\sigma^2(x))$，并使用**重参数化技巧**从中采样一个潜变量：\n\
  >\n> $z = \\mu + \\sigma \\odot \\epsilon, \\quad \\epsilon \\sim \\mathcal{N}(0,\
  \ I)$\n\n### 潜空间插值\n\n潜空间插值在实践中很有用，因为它能够在不同语义概念之间实现平滑过渡，从而支持受控生成，并在引入代码之前揭示所学潜空间的*连续性*和*结构*。\n\
  \n\n\n\n\n潜在表示的一个重要属性是其连续性。通过在潜在向量之间进行插值，可以平滑地对图像进行变形。两张图像首先被编码：\n\n```\nz1 = vae.encode(x1).latent_dist.mean\n\
  z2 = vae.encode(x2).latent_dist.mean\n```\n\n通过线性插值生成中间潜在编码。\n\n```\nz = (1-a)*z1\
  \ + a*z2\n```\n\n其中 \\(z_\\alpha = (1 - \\alpha)z_1 + \\alpha z_2, \\quad 0 \\le\
  \ \\alpha \\le 1.\\) 每个插值的潜在向量被解码以生成图像。 resulting 序列揭示了两个对象之间平滑的语义过渡，表明潜在空间中相近的点对应于视觉上相关的图像。这种连续性是潜在空间非常适合基于扩散的图像生成的关键原因之一。\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_703_0.png)\n\n*Figure 13.20 – Latent\
  \ space interpolation*\n\n## 理解潜在扩散\n\n在潜在扩散模型中，高斯噪声被添加到潜在向量而不是像素上：\n\n\\[\nz_t\
  \ = \\sqrt{\\bar{\\alpha}_t}z_0 + \\sqrt{1 - \\bar{\\alpha}_t}\\epsilon, \\quad\
  \ \\epsilon \\sim \\mathcal{N}(0,I)\n\\]\n\n然后神经网络学习预测并去除这种噪声，逐步恢复干净的潜在表示。为了说明潜在退化的效果，潜在表示被人为缩放：\n\
  \n```\nnoisy = latent * (step / 1000)\nimg = vae.decode(noisy).sample\n```\n\n随着潜在幅度减小，解码后的图像逐渐失去结构和细节。该实验为潜在扩散提供了直观理解：信息在潜在空间中逐步被破坏，然后通过去噪恢复。\n\
  \nVAE Decoding of Scaled Latents\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_703_1.png)\n\
  \n*Figure 13.21 – VAE decoding of scaled latents with Latent Diffusion*\n\n这表明有意义的图像结构被编码在潜在空间中，并且渐进的噪声破坏会导致语义和视觉细节的逐渐丧失，这促使需要学习去噪过程来恢复高质量图像。\n\
  \n```\npipe.to('cuda')\n# torch_dtype=torch.float16\n```\n\n该管道包含一个 CLIP 文本编码器、一个潜在空间\
  \ *VAE*、一个 *U-Net* 去噪器和一个扩散调度器。使用半精度（float16）可降低内存消耗并加速现代 GPU 上的推理。\n\n### 文本到图像生成\n\
  \n核心图像生成步骤为：\n\n```\nimg = pipe(prompt, num_inference_steps=30).images[0]\n```\n\
  \n给定文本描述，管道从随机潜在噪声开始并执行 30 步逆扩散，以合成与提示匹配的图像。数学上，该过程可总结为：\n\n\\[\nz_T \\sim \\mathcal{N}(0,I)\
  \ \\rightarrow z_{T-1} \\rightarrow \\cdots \\rightarrow z_0 \\rightarrow x,\n\\\
  ]\n\n其中每个去噪步骤都由提示嵌入引导。\n\n### 从多个提示生成图像\n\n演示为四个不同的提示生成图像。\n\n```\nprompts = [\"\
  A futuristic city\", \"A medieval castle\",\n           \"A cyberpunk street\",\
  \ \"A photorealistic tiger\"]\n```\n\n每个提示独立处理。\n\n```\nfor prompt in prompts:\n\
  \    img = pipe(prompt, num_inference_steps=30).images[0]\n```\n\n生成的图像展示了 Stable\
  \ Diffusion 所学习的卓越语义理解。尽管从纯噪声开始，模型仍能合成视觉上连贯的场景，对应于未来建筑、历史结构、赛博朋克环境和逼真野生动物。\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_705_0.png)\n\
  \n*Figure 13.22 — Text-to-image generation with Stable Diffusion*\n\n生成的输出清楚地表明，不同的文本提示引导模型朝向视觉空间的不同语义区域，从而产生相应不同的图像（例如，城市未来场景、历史城堡、赛博朋克街道和逼真动物），从而证明了扩散式图像合成中强大的文本条件控制。\n\
  \nStable Diffusion 通过结合扩散模型、潜在空间学习和多模态文本-图像表示，成为生成式 AI 的一个重要里程碑。与直接将潜在向量映射到图像的 GAN\
  \ 不同，Stable Diffusion 在每个步骤都以文本提示为条件，逐步去噪潜在表示。这使得可以从自然语言描述中进行高度可控的图像合成，使 Stable\
  \ Diffusion 成为现代文本到图像生成的最广泛使用的框架之一。\n\n## 使用 InstructPix2Pix 进行图像编辑\n\n虽然 Stable\
  \ Diffusion 可以仅从文本生成图像，但许多实际应用需要根据文本指令编辑现有图像。示例包括改变物体的外观、修改艺术风格、改变光照条件或将草图转换为逼真照片。InstructPix2Pix\
  \ 通过学习遵循自然语言编辑指令同时保留输入图像的内容和结构来解决此问题。\n\n给定输入图像 \\(x\\) 和文本指令 \\(c\\)，目标是生成编辑后的图像\
  \ \\(y = F(x, c)\\)，其中 \\(F(\\cdot)\\) 表示学习到的图像编辑模型。与文本到图像生成不同，目标不是从头创建新图像，而是根据指令转换现有图像。\n\
  \n### InstructPix2Pix 架构\n\nInstructPix2Pix 基于 Stable Diffusion 框架构建并执行基于扩散的图像编辑。模型接收：\n\
  \n- 输入图像\n- 文本编辑指令\n- 噪声潜在表示\n\n文本指令使用语言编码器编码：\\(c = T(\\text{instruction})\\)，而输入图像使用变分自编码器（VAE）映射为潜在表示：\\\
  (z = E(x)\\)。扩散 U-Net 然后在图像潜在和指令嵌入的条件下执行迭代去噪：\\(\\epsilon_\\theta(z_t, t, c)\\)。最终编辑图像使用\
  \ VAE 解码器重建：\\(\\hat{y} = D(z_0)\\)。由于模型同时以图像内容和文本指令为条件，因此可以在保留整体场景的同时仅修改请求的属性。\n\
  \n### 加载预训练模型\n\n预训练的 InstructPix2Pix 管道加载如下：\n\n```\nfrom diffusers import StableDiffusionInstructPix2PixPipeline\n\
  pipe = StableDiffusionInstructPix2PixPipeline.from_pretrained(\n    \"timbrooks/instruct-pix2pix\"\
  )\n```\n\n该管道包含用于图像编辑的 Stable Diffusion 潜在扩散模型以及指令遵循组件。\n\n### 输入图像和编辑指令\n\n演示使用手袋草图作为源图像。\n\
  \n```\ninput_image = Image.open(\"bag_sketch.png\").convert(\"RGB\")\n```\n\n然后提供详细的指令。\n\
  \n```\nprompt = \"\"\"\n```\n\n## 使用 ControlNet 进行结构引导的图像生成\n\n虽然诸如 Stable Diffusion\
  \ 之类的文本到图像模型可以从文本提示生成高度逼真的图像，但它们通常对生成内容的空间结构提供有限的控制。ControlNet 通过引入额外的条件信号来解决此限制，例如边缘、深度图、分割掩码、人脸姿势或草图，同时保留扩散模型的生成能力，从而实现对图像构图的精确控制。\n\
  \n给定控制信号 \\(c\\)（例如边缘图）和文本提示 \\(y\\)，ControlNet 模拟条件分布 \\(p(x|c, y)\\)，允许图像生成同时由结构信息和语义指令引导。\n\
  \n### ControlNet 架构\n\nControlNet 通过添加一个可训练分支来扩展 Stable Diffusion，该分支处理外部控制信号。原始\
  \ Stable Diffusion U-Net 基本保持不变，而 ControlNet 分支提取结构信息并将其注入去噪过程。\n\n令 \\(z_t\\) 表示时间步\
  \ \\(t\\) 处的噪声潜在表示。去噪器变为 \\(\\epsilon_\\theta(z_t, t, c, y)\\)，其中 \\(z_t\\) 是噪声潜在，\\\
  (c\\) 是控制图像，\\(y\\) 是文本提示。因此生成的图像不仅受文本语义约束，还受提供的几何结构约束。\n\n### 提取边缘引导\n\n演示使用马图像作为输入并提取\
  \ Canny 边缘图。\n\n```\ngray = cv2.cvtColor(np.array(input_image), cv2.COLOR_RGB2GRAY)\n\
  edges = cv2.Canny(gray, 100, 200)\n```\n\nCanny 检测器计算图像梯度并识别显著的强度不连续性，生成捕获物体形状和姿势同时丢弃纹理和颜色信息的边缘表示。然后边缘图转换为三通道图像：\n\
  \n```\nedges = cv2.cvtColor(edges, cv2.COLOR_GRAY2RGB)\n```\n\n该边缘图像作为提供给 ControlNet\
  \ 的结构条件信号。\n\n### 加载 ControlNet 模型\n\n训练于 Canny 边缘图的 ControlNet 模型使用以下方式加载：\n\n\
  ```\ncontrolnet = ControlNetModel.from_pretrained(\"lllyasviel/sd-controlnet-canny\"\
  )\n```\n\n该网络已学习边缘结构如何对应于逼真图像内容，因此可以在生成过程中保留物体几何。ControlNet 模型随后与 Stable Diffusion\
  \ 集成：\n\n```\npipe = StableDiffusionControlNetPipeline.from_pretrained(\n    \"\
  runwayml/stable-diffusion-v1-5\",\n    controlnet=controlnet)\n```\n\n resulting\
  \ 管道将文本提示的语义引导与边缘图的结构引导相结合。\n\n\n\n\n仅需少量去噪步骤即可实现图像合成，从而使实时图像生成成为可能。本节将展示使用预训练扩散管道的\
  \ **SDXL** 和 *SDXL-Turbo* 的若干实际应用。\n\n## SDXL-Turbo 文生图\n\nSDXL-Turbo 能以极少的扩散步骤直接从文本提示生成图像。\n\
  \n```\npipe_t2i = AutoPipelineForText2Image.from_pretrained(\"stabilityai/sdxl-turbo\"\
  )\nprompt = \"\"\"A futuristic cyberpunk city at sunset, cinematic lighting, ultra\
  \ detailed\"\"\"\nimage = pipe_t2i(prompt, guidance_scale=0, num_inference_steps=2).images[0]\n\
  ```\n\n与通常需要20–50次去噪迭代的传统扩散模型不同，SDXL-Turbo 采用 **对抗扩散蒸馏（ADD）**，仅需1–4步去噪即可生成图像，同时保持惊人的高视觉质量。`pipe_t2i()`\
  \ 函数可在现代 GPU 上于不到一秒的时间内（根据文本提示）生成图像，使 SDXL-Turbo 适用于快速概念生成、实时设计探索和创意原型制作等交互式应用。\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_710_0.png)\n\n*图 13.25 – 使用 SDXL-turbo\
  \ 进行文生图*\n\n该示例使用文本描述生成了一座未来主义赛博朋克城市，展示了蒸馏扩散模型的卓越效率。\n\n> **注意**\n>\n> SDXL 示例使用了两个密切相关的管道：**文生图**（`pipe_t2i`）和**图生图**（`pipe_i2i`）。文生图管道从纯随机噪声和一个文本提示生成图像：$x_0\
  \ = G(y)$，其中 $y$ 表示提示，$G$ 表示扩散模型。由于未提供输入图像，模型可以完全自由地合成新场景。\n\n## 排版生成\n\nSDXL 的主要改进之一在于其在生成的图像中呈现可读文本的能力得到增强。以下提示要求生成一张包含标题和主题列表的会议海报：\n\
  \n```\nprompt = \"\"\"\nProfessional conference poster.\nTitle:\nCOMPUTER VISION\
  \ 2026\n\"\"\"\n\nimage = pipe_t2i(prompt, guidance_scale=0, num_inference_steps=40).images[0]\n\
  ```\n\n模型同时合成视觉布局和内嵌文本。尽管生成的排版仍可能偶尔出现拼写错误，但相比难以渲染连贯文本的早期扩散模型，SDXL 已是显著的进步。\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_711_0.png)\n\
  \n图 13.26 – 使用 SDXL 进行排版生成\n\n> **注意**\n>\n> 尽管 SDXL-Turbo 针对 1–4 步去噪进行了优化，但排版生成有时可能会从额外迭代中受益，因为文本需要高度精确的空间结构；不过，超过几步后是否能改善并不确定，因为该模型主要针对超快速低步数推理进行训练。\n\
  \n## 提示敏感性\n\n扩散模型对提示措辞高度敏感。考虑以下序列：\n\n```\nprompts = [\"A cat\", \"A realistic\
  \ cat\", \"A realistic Persian cat\",\n\"A realistic Persian cat sitting on a sofa\"\
  ]\nimage = pipe_t2i(prompt, guidance_scale=0, num_inference_steps=2).images[0]\n\
  ```\n\n随着语义约束逐步增加，生成的图像也变得越来越具体。这说明提示在习得的潜空间中定义了一条轨迹，更丰富的描述通常会产生更符合用户意图的输出。\n\n\
  ![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_712_0.png)\n\n*图 13.27 – SDXL 的提示敏感性*\n\
  \n## 速度与质量权衡\n\n去噪步骤的数量直接影响生成质量：\n\n```\nprompt = \"A futuristic robot\"\nsteps\
  \ = [1,2,4,8]\nfor s in steps:\n    img = pipe_t2i(prompt, num_inference_steps=s,\
  \ guidance_scale=0).images[0]\n```\n\n较少的步骤可快速生成图像，但可能出现伪影或细节减少。增加步骤数通常会提高视觉保真度，但代价是额外的计算量。SDXL-Turbo\
  \ 经过专门优化，即使在扩散迭代次数很少时也能保持质量。\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_712_1.png)\n\
  \n*图 13.28 – SDXL 的速度与质量权衡*\n\n## 随机种子探索\n\n扩散模型从随机潜在噪声生成图像。不同的随机种子会产生不同的样本，同时保持提示语义不变。\n\
  \n```\nseeds = range(6)\nfor ax, seed in zip(axes, seeds):\n    generator = torch.Generator(device=\"\
  cuda\").manual_seed(seed)\n    img = pipe_t2i(prompt, num_inference_steps=2, guidance_scale=0,\n\
  \                   generator=generator).images[0]\n```\n\n生成的图像在姿态、构图、光照和物体外观上表现出差异，展示了基于扩散生成过程的随机性。\n\
  \n## 使用 SDXL-Turbo 进行图生图细化\n\n一个有用的工作流是首先生成粗略概念，然后通过 *图生图扩散* 对其进行细化。\n\n**阶段 1 –\
  \ 概念创建：** 使用文生图（`pipe_t2i`）管道生成概念：\n\n```\nconcept_prompt = \"\"\"fantasy dragon\
  \ city, flying dragons, ancient towers,\n fantasy landscape, concept art, cinematic\
  \ lighting\"\"\"\npipe_t2i = AutoPipelineForText2Image.from_pretrained(\"stabilityai/sdxl-turbo\"\
  ,\n    torch_dtype=torch.float16,\n    variant=\"fp16\")\nconcept = pipe_t2i(prompt=concept_prompt,\
  \ num_inference_steps=4).images[0]\n```\n\n**阶段 2 – 细化：** 图生图管道（`pipe_i2i`）从现有图像开始，根据文本提示对图像进行修改：\n\
  \n$$x_{out} = G(x_{in}, y)$$\n\n其中 $x_{in}$ 是输入图像，$y$ 是文本指令（*文本提示*）。\n\n```\ndetail_prompt\
  \ = \"\"\"highly detailed fantasy dragon city, ultra detailed\narchitecture,\n \
  \   cinematic lighting, fantasy masterpiece, sharp focus, intricate textures\"\"\
  \"\npipe_i2i = AutoPipelineForImage2Image.from_pretrained(\"stabilityai/sdxl-turbo\"\
  ,\n    torch_dtype=torch.float16,\n    variant=\"fp16\")\nrefined = pipe_i2i(prompt=detail_prompt,\
  \ image=concept, strength=0.35).images[0]\n```\n\n第一阶段确立整体设计，第二阶段引入建筑细节、纹理、光照效果和更高的视觉保真度。这种分层工作流广泛用于概念艺术、游戏设计和建筑可视化。\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_713_0.png)\n\n*图 13.29 – 使用 SDXL 进行图生图扩散*\n\
  \n## 人脸修复\n\n图生图扩散还可以修复受损照片：\n\n```\nface_image = Image.open('child.jpg').convert('RGB')\n\
  result = pipe_i2i(prompt=\"\"\"restore photograph, preserve face identity\"\"\"\
  ,\n    image=face_image, strength=0.35).images[0]\n```\n\n该提示引导模型去除划痕、提高清晰度并增强图像质量，同时保留面部身份、姿态和场景内容。这种修复能力对于档案图像增强和照片恢复极具价值。\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_714_0.png)\n\n图 13.30 – 使用 SDXL 进行人脸修复\n\
  \n## 渲染风格转换\n\n将 SDXL 与 ControlNet 结合，可以在保持图像几何结构的同时修改风格。首先提取 Canny 边缘图：\n\n```\n\
  controlnet = ControlNetModel.from_pretrained(\"diffusers/controlnet-canny-sdxl-1.0\"\
  ,\n    torch_dtype=torch.float16)\nimg_np = np.array(Image.open(\"horse.jpg\").convert(\"\
  RGB\"))\nedges = cv2.Canny(img_np,100,200)\n```\n\n边缘图在生成过程中充当结构约束。\n\n```\nresult\
  \ = pipe_i2i(prompt=style_prompt, image=image, control_image=control_image).images[0]\n\
  ```\n\n使用诸如“动漫插图”或“转换为水彩画”之类的提示（`style_prompt`），模型仅改变渲染风格，同时保留物体布局、姿态、视角和场景构图。这展示了\
  \ ControlNet 将图像结构与视觉外观分离的能力。\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_715_0.png)\n\
  \n*图 13.31 – 使用 SDXL 进行风格转换*\n\n## 基于扩散的超分辨率\n\n扩散模型还可以执行图像放大：\n\n```\npipe=StableDiffusionUpscalePipeline.from_pretrained(\\\
  \n    \"stabilityai/stable-diffusion-x4-upscaler\")\nupscaled = pipe(prompt=\"high\
  \ quality photograph\", image=low_res_image).images[0]\n```\n\n扩散模型并非简单地插值像素，而是合成合理的高频细节，从而生成更清晰、更逼真的高分辨率图像。\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_715_1.png)\n\n*图 13.32 – 使用 Stable Diffusion\
  \ 进行图像超分辨率*\n\n\n\n\n\n## 图像修复\n\n修复通过利用周围像素的上下文信息来填补缺失或不需要的图像区域。\n\n```\npipe =\
  \ StableDiffusionInpaintPipeline.from_pretrained(\n    \"runwayml/stable-diffusion-inpainting\"\
  ).to(\"cuda\")\nimage = Image.open('man.jpg').convert('RGB')\nmask = Image.open('man_mask.png').convert('RGB')\n\
  result = pipe(prompt=\"natural background\", image=image, mask_image=mask).images[0]\n\
  ```\n\n掩码标识要修改的区域，而扩散模型生成与周围场景一致的内容。应用包括对象移除、图像修复和内容感知编辑。\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_716_0.png)\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_716_1.png)\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_716_2.png)\n\
  \n图 13.33 – 使用 Stable Diffusion 进行图像修复\n\n## 艺术风格生成\n\n扩散模型仅通过提示工程即可模仿各种艺术风格。\n\n\
  ```\nfrom diffusers import StableDiffusionPipeline\npipe = StableDiffusionPipeline.from_pretrained(\n\
  \    \"runwayml/stable-diffusion-v1-5\", torch_dtype=torch.float16).to(\"cuda\"\
  )\nstyles = [\"oil painting\", \"anime illustration\", \"pixel art\", \"pencil sketch\"\
  ]\nfor style in styles:\n    prompt = (\n        f\"A majestic castle on a mountain,\
  \ \"\n        f\"{style}\"\n    )\n    img = pipe(prompt, num_inference_steps=30,\
  \ guidance_scale=8).images[0]\n```\n\n对于每种风格，提示“A majestic castle on a mountain”都会加上所需的艺术描述进行扩充。生成的图像在保留场景语义的同时采用截然不同的视觉外观，展示了现代扩散模型强大的风格迁移能力。\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_717_0.png)\n\n*图 13.34 – 使用 Stable Diffusion\
  \ 进行艺术风格生成*\n\n除了基于风格的提示工程之外，扩散模型还可以使用外部视觉和结构条件机制进行引导，以实现更精确和可控的生成，我们将在下一节中探讨。\n\
  \n## IP-Adapter 和 ControlNet 用于身份保持的姿势引导生成\n\n文本到图像扩散模型的一个局限是，它们无法可靠地在同时控制姿势和构图的情况下保持特定人物的外观。两种最新的条件机制解决了这个问题。**IP-Adapter（Image\
  \ Prompt Adapter）** 将参考图像的视觉信息注入扩散模型，而 **ControlNet** 则施加诸如边缘、深度图、分割掩码或人体姿势等结构约束。通过结合这两种方法，可以生成在遵循所需姿势的同时保持人物身份的图像。\n\
  \n**IP-Adapter：** 传统的 Stable Diffusion 仅依赖文本嵌入。IP-Adapter 通过从参考图像中提取视觉特征并将其通过额外的交叉注意力层注入扩散\
  \ U-Net 来扩展条件机制。设 *T* 表示文本嵌入，*I* 表示从视觉编码器提取的图像嵌入。扩散模型变为 ε<sub>θ</sub>(z<sub>t</sub>,\
  \ t, T, I)，\n\n其中 z_t 是噪声潜在表示。因此，生成过程同时受文本和视觉信息的引导。IP-Adapter 使用以下方式加载到 Stable Diffusion\
  \ 流水线中：\n\n```\npipe.load_ip_adapter(\"h94/IP-Adapter\", subfolder=\"models\", weight_name=\"\
  ip-adapter_sd15.bin\")\npipe.set_ip_adapter_scale(0.8)\n```\n\n参数 ip_adapter_scale\
  \ 控制参考图像的影响。较大的值会增加身份保持，而较小的值会为文本提示提供更大的自由度。\n\nControlNet：尽管 IP-Adapter 保留了外观，但它并未明确约束图像几何。ControlNet\
  \ 引入了一个辅助网络，对扩散过程进行结构信号的条件化。给定控制图像 c，去噪过程变为 ε_θ(z_t, t, T, c)。在此示例中，控制信号是描述所需身体姿势的\
  \ OpenPose 骨架：\n\n```\ncontrolnet = ControlNetModel.from_pretrained(\"lllyasviel/control_v11p_sd15_openpose\"\
  )\n```\n\nOpenPose 图像充当几何蓝图，迫使生成的主题遵循指定的姿势，同时与文本提示保持一致。\n\n## 结合身份和姿势约束：完整的流水线结合了三种条件来源：\n\
  \n- Text prompt – controls semantic content\n- Reference image (IP-Adapter) – preserves\
  \ identity and appearance\n- OpenPose skeleton (ControlNet) – constrains body pose\n\
  \nStable Diffusion 流水线构建为：\n\n```\npipe = StableDiffusionControlNetPipeline.from_pretrained(\"\
  runwayml/stable-diffusion-v1-5\",\n    controlnet=controlnet, torch_dtype=torch.float16)\n\
  ```\n\n然后使用以下方式进行生成：\n\n```\nimages = pipe(prompt=\"professional portrait photograph\"\
  ,\n    image=openpose_image, ip_adapter_image=reference_image,\n    num_inference_steps=30,\
  \ guidance_scale=7.5, num_images_per_prompt=4).images\n```\n\n这里，openpose_image\
  \ 提供姿势信息，而 reference_image 提供面部外观和身份线索。生成的图像继承了参考图像的面部特征和视觉风格，同时采用 OpenPose 骨架编码的姿势。与通常会改变样本间身份的普通文本到图像生成不同，结合\
  \ IP-Adapter 和 ControlNet 的框架能够实现受控合成，其中身份和姿势可以独立操纵。这种能力对于头像生成、虚拟摄影、数字人类、角色动画、时尚可视化和姿势引导人像合成特别有价值。\n\
  \n## IP-Adapter + OpenPose ControlNet\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_719_0.png)\n\
  \n图 13.35 – 使用 ip-adapter 和 controlnet 进行身份保持的姿势引导图像生成\n\n安装阶段加载 Stable Diffusion\
  \ v1.5、OpenPose ControlNet 模型和 IP-Adapter 权重。流水线随后附加 IP-Adapter 注意力层并使用 set_ip_adapter_scale()\
  \ 设置其影响。在推理期间，OpenPose 图像通过 image 参数提供，身份参考通过 ip_adapter_image 提供，文本提示指定所需外观。扩散模型融合所有三个条件来源以生成在保持身份的同时符合目标姿势的光栅化逼真人像。\n\
  \n## 使用 DALL·E 2 和 DALL·E 3 API 进行图像生成\n\nOpenAI 的 DALL·E 模型系列能够从自然语言描述生成高质量的文本到图像。给定文本提示\
  \ y，模型学习条件分布 p(x|y)，其中 x 表示生成的图像。DALL·E 2 引入了强大的文本引导图像合成和变体生成，而 DALL·E 3 则显著改善了提示理解、组合推理、场景连贯性、排版以及对详细说明的遵循。这些模型广泛用于概念艺术、广告、产品可视化、讲故事、建筑设计和创意内容生成。\n\
  \n要使用 API，请在 OpenAI Platform(https://platform.openai.com/?utm_source=chatgpt.com)\
  \ 上创建账户，从仪表板生成 API 密钥，添加计费积分，并注意图像生成是按使用量计费的，成本取决于模型（例如 DALL·E 2 与 DALL·E 3）、图像分辨率和生成的图像数量。\n\
  \n以下代码配置 OpenAI API 并安装所需的库：\n\n```\n!pip install openai pillow matplotlib requests\n\
  \nimport os\nos.environ['OPENAI_API_KEY'] = '<your API key here>'\n\nfrom openai\
  \ import OpenAI\nclient = OpenAI()\n```\n\nAPI 密钥对 OpenAI 图像生成服务的请求进行身份验证，而 OpenAI\
  \ 客户端提供对 DALL·E 图像生成端点的访问。\n\n## 使用 DALL·E 2 生成图像：DALL·E 2 直接从文本提示创建图像。\n\n```\n\
  resp = client.images.generate(model=\"dall-e-2\", prompt=prompt,\n    size=\"1024x1024\"\
  , n=1)\n```\n\n模型接收文本描述并生成一个或多个与提示一致的图像。在演示中，对同一提示请求多次生成以可视化输出多样性。由于图像生成具有随机性，反复执行通常会产生对同一描述的不同解释。辅助函数\
  \ generate_dalle2() 为每个提示创建基础图像和两个额外变体。\n\n```\ndef generate_dalle2(prompt):  #\
  \ DALL-E 2 generator\n    resp_base = client.images.generate(model=\"dall-e-2\"\
  ,\n                                    prompt=prompt, size=\"1024x1024\",  n=1)\n\
  \    base_img = get_image(resp_base.data[0].url)\n    resp_vars = client.images.generate(model=\"\
  dall-e-2\",\n                                    prompt=prompt, size=\"1024x1024\"\
  ,  n=2)\n    var1 = get_image(resp_vars.data[0].url)\n    var2 = get_image(resp_vars.data[1].url)\n\
  \    return base_img, var1, var2\n```\n\n## 使用 DALL·E 3 生成图像：DALL·E 3 的访问方式类似。\n\
  \n```\nresp = client.images.generate(model=\"dall-e-3\", prompt=prompt,\nsize=\"\
  1024x1024\")\n```\n\n类似的辅助函数 generate_dalle3(prompt) 生成同一提示的三个独立实现。与 DALL·E 2 相比，DALL·E\
  \ 3 通常产生更好的提示遵循性、改进的空间推理、更连贯的对象关系、更高的视觉真实感、更优越的排版和文本渲染以及对复杂指令更准确的解释。\n\n## 基于提示的图像生成：实验在多样化的想象提示集合上评估两种模型。\n\
  \n```\nprompts = [\n    \"Photo of Victoria Memorial Hall in the winter...\",\n\
  ```\n\n\n\n\n```text\n“泰姬陵漂浮在空中……”,\n“一只长颈鹿在繁忙的东京街道上骑自行车……”,\n...\n]\n```\n\n该提示词集合有意融合了著名地标、历史重想象、不可能场景、拟人化动物、科幻概念和创意艺术构图。这类提示词为评估语义理解和视觉创造力提供了一个有效的基准。\n\
  \n**自动化对比流程：** 对于每个提示词，程序执行以下操作：\n\n```python\ndalle2_imgs = generate_dalle2(prompt)\n\
  dalle3_imgs = generate_dalle3(prompt)\n```\n\n生成的图像被排列成对比网格，其中第一行对应 DALL·E 2 的输出，第二行对应\
  \ DALL·E 3 的输出。这种并排可视化使得能够针对相同的文本描述比较提示词忠实度、构图质量、场景复杂度、对象一致性、艺术真实感和输出多样性。\n\n**下载并显示结果：**\
  \ 辅助函数\n\n```python\ndef get_image(url):\n    response = requests.get(url)\n   \
  \ return Image.open(io.BytesIO(response.content))\n```\n\n从 API 返回的 URL 下载生成的图像，并将其转换为\
  \ PIL 图像以便可视化。随后这些图像会被自动保存。\n\n```python\nplt.savefig(out_path, dpi=150)\n```\n\n\
  从而支持在大量提示词上进行大规模基准测试。\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_721_0.png)\n\n\
  *图 13.36 – 使用相同提示词通过 DALL·E 2 与 DALL·E 3 生成图像*\n\n与 DALL·E 2（使用相同的提示词集合）相比，DALL·E\
  \ 3 生成的图像更详细、更符合提示词，这反映了其语义理解和视觉连贯性的提升，如最后一幅图和下一幅图（使用两个不同提示词）所示。\n\n**提示词 2：** 埃菲尔铁塔淹没在水下，周围有潜水员在游泳。\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_722_0.png)\n\n*图 13.37 – 使用相同提示词通过 DALL·E\
  \ 2 与 DALL·E 3 生成图像*\n\n## DALL·E 2 与 DALL·E 3 的对比：该实验通常会揭示几个质的差异：\n\nDALL·E 2 仍然适用于快速图像生成和实验，而\
  \ DALL·E 3 通常能产生更忠实、视觉上更连贯的结果，尤其是对于涉及多个对象、详细空间布局和叙事性描述的较长提示词。\n\n### 备注\n\nLLM（大语言模型）是一种在大规模文本数据上训练的神经网络，用于理解和生成人类语言。现代多模态\
  \ LLM 还可以与图像、音频和视频交互。值得注意的是，DALL·E 和 GPT-Image 并非 LLM；它们是 OpenAI 专有的专用图像生成模型（与 Stable\
  \ Diffusion 不同，但据信它们将基于 Transformer 的架构与基于扩散的图像生成相结合），与 ChatGPT 等 LLM 协同工作，通过自然语言提示词执行图像生成、编辑、内修补、外修补和修复相关任务。多家公司提供了具有不同优势的多模态\
  \ AI 系统，如下表所示。在本章中，我们仅专注于 OpenAI 的 DALL·E 和 GPT-Image 模型，因为它们具有强大的图像生成和编辑能力、通过 API\
  \ 易于使用，并且与计算机视觉和图像处理应用密切相关。\n\n下表总结了几个流行的 LLM 和图像生成模型：\n\n| 公司 | AI 系统 | 优势 | 局限性\
  \ |\n|---|---|---|---|\n| OpenAI | ChatGPT + GPT-Image / DALL·E | 出色的图像生成、编辑、内修补、指令遵循和\
  \ API 支持 | 在科学图像修复方面不够专门 |\n| Google | Gemini | 强大的多模态推理和生态集成 | 图像编辑能力因版本而异 |\n\
  | Anthropic | Claude | 出色的长上下文推理和文档理解能力 | 原生图像生成功能有限 |\n| xAI | Grok | 实时信息访问和多模态交互\
  \ | 图像创建生态较小 |\n| Microsoft | Copilot | 生产力工具集成和可访问性 | 高度依赖底层基础模型 |\n\n*表 13.2 –\
  \ 面向图像相关任务的主要多模态 AI 系统对比*\n\n在超越使用 **DALL·E 2** 和 **DALL·E 3** 的特定模型生成之后，下一节将探讨通过\
  \ **GPT Image API** 提供的更广泛的图像生成和编辑能力，以实现更灵活、更集成的多模态工作流。\n\n## GPT Image API：生成、编辑、内修补和视觉\n\
  \nOpenAI 生态系统为图像理解和图像生成提供了统一的多模态框架。诸如 GPT-4.1、GPT-4o 和 GPT-5.1 等视觉模型可以分析图像、回答视觉问题、比较多幅图像并生成结构化报告，而\
  \ GPT Image 模型可以通过自然语言指令合成、编辑、修复、重新着色和变换图像。与需要 ControlNet、IP-Adapter 或分割网络等专用架构的传统扩散流水线不同，GPT\
  \ Image API 通过单一的提示词驱动接口暴露这些能力。\n\n**设置：** OpenAI API 需要从 OpenAI 平台获取 API 密钥。创建账户并添加计费信息后，可以从开发者仪表板生成\
  \ API 密钥，并将其提供给客户端：\n\n```python\nfrom openai import OpenAI\napi_key = \"<your_api_key>\"\
  \nclient = OpenAI(api_key=api_key)\n```\n\n对于图像理解任务，图像通常被编码为 Base64 字符串并传递给视觉模型，而图像生成和编辑任务则使用\
  \ GPT Image API。\n\n### 使用 GPT 视觉进行图像理解\n\n现代 GPT 模型可以同时处理文本和图像。图像以 `Base64` 格式编码，并与文本查询一起提供。\n\
  \n```python\nimage_path = \"images/family.png\"\nbase64_image = encode_image(image_path)\n\
  data_url = f\"data:image/jpeg;base64,{base64_image}\"\nresponse = client.responses.create(model=\"\
  gpt-4.1-mini\",\n    input=[{\"role\": \"user\",\n    \"content\": [{\"type\": \"\
  input_text\", \"text\": \"what's in this image?\"},\n                {\"type\":\
  \ \"input_image\", \"image_url\": data_url}] }])\n```\n\n对于以下输入图像，生成了如下描述：\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_724_0.png)\n\
  \n*图 13.38 – 使用 GPT 视觉进行图像理解*\n\n```python\nprint(response.output_text)\n```\n\n\
  ```text\nThe image shows a group of five people sitting indoors. Among them, there\
  \ are three elderly women and one elderly man, all dressed in traditional Indian\
  \ attire, including sarees for the women and a checked shirt for the man. There\
  \ is also a younger man standing at the right side of the group wearing a light\
  \ blue polo shirt. The scene appears to be a family or social gathering. The room\
  \ has a window in the background, and the lighting suggests the picture was taken\
  \ indoors during the evening or night.\n```\n\n该模型执行视觉场景理解，并生成对图像内容的自然语言描述。典型应用包括图像描述、视觉搜索、无障碍工具、文档理解和图像索引。\n\
  \n### 使用 GPT Image 进行图像编辑\n\nGPT Image 模型支持基于指令的图像编辑。模型不是从头生成图像，而是根据提示词修改现有图像。\n\
  \n```python\nresult = client.images.edit(model=\"gpt-image-1\", image=open(\"cat.jpg\"\
  ,\"rb\"),\n                             prompt=\"Enhance lighting and make it cinematic\"\
  )\n```\n\n该模型在根据指令调整光照、颜色、纹理和整体外观的同时，保留图像结构，如下所示（输入猫图像和编辑后图像并排显示）。\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_725_0.png)\n\
  \n*图 13.39 – 使用 GPT-image 进行图像编辑*\n\n应用包括照片增强、重新照明、色彩校正、艺术变换和内容修改。\n\n### 边缘引导编辑\n\
  \n传统计算机视觉可以与生成式 AI 相结合。在此示例中，OpenCV 使用 Canny 检测器提取边缘。边缘图被转换为掩码，并通过 `create_edge_mask()`\
  \ 函数（参考 GitHub）提供给 GPT Image。函数 `edge_inpaint()` 将边缘掩码用作*编辑区域规范*；它将原始图像连同掩码一起发送给\
  \ `client.images.edit()`，指示模型仅修改掩码中的边缘像素，将检测到的边缘替换为发光的艺术线条，并返回 AI 编辑后的图像。\n\n```python\n\
  def edge_inpaint(image):\n    mask = create_edge_mask(image)  # find edges (Canny),\
  \ convert to RGBA mask\n```\n\n\n\n\n\n```python\nresult = client.images.edit(model=\"\
  gpt-image-1\", image=open(image, \"rb\"),\n    mask=open(\"images/mask.png\", \"\
  rb\"),\n    prompt=\"Replace edges with artistic glowing lines\")\nreturn Image.open(io.BytesIO(base64.b64decode(result.data[0].b64_json)))\n\
  ```\n\n这展示了一种混合工作流：传统图像处理提供结构引导，而生成式 AI 合成新的视觉内容。该 Gradio 应用结合了 OpenCV 边缘检测与 GPT\
  \ Image 修复功能，通过交互式 Web 界面自动将图像边缘替换为 AI 生成的发光艺术轮廓。\n\n```python\nimport gradio as\
  \ gr\n\ngr.Interface(fn=edge_inpaint, inputs=gr.Image(type=\"filepath\"),\n    outputs=gr.Image(),\n\
  \    title=\"OpenCV + GenAI Hybrid\").launch()\n```\n\n下图展示了用于边缘引导图像生成的 Gradio 界面：\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_726_0.png)\n\n图 13.40 – 使用 GPT 图像进行边缘引导图像编辑的\
  \ Gradio 应用\n\n## 图像修复（Image inpainting）\n\n修复功能可在保留周围内容的同时，填补缺失或被遮罩的图像区域。\n\n```python\n\
  result = client.images.edit(model=\"gpt-image-1\", image=img_f, mask=mask_f,\n \
  \   prompt=\"Fill the masked region realistically\")\n```\n\n遮罩用于标识需要修改的区域，模型会合成视觉上一致的内容，如下方\
  \ Gradio 应用所示（参见 GitHub）。\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_727_0.png)\n\
  \n图 13.41 – 使用 Gradio 和 GPT-image 模型（OpenAI API）的 AI 修复工具\n\n典型应用包括物体移除、划痕去除、损坏修复、背景补全和内容替换。\n\
  \n## AI 风格迁移\n\nGPT Image 可以将图像转换为所需的艺术风格，同时保留不同程度的结构信息。下一个 Gradio 演示中的 `build_prompt()`\
  \ 函数会根据结构保持参数动态调整提示词。低数值允许创造性重新诠释，而高数值则保留几何形状、物体布局和透视。`style_transfer()` 函数使用 GPT\
  \ Image Editing 将选定的艺术风格应用于输入图像，同时强制实现所需的结构保持水平。\n\n```python\nclient = OpenAI(api_key=api_key)\n\
  \ndef build_prompt(style, strength):\n    if strength < 0.3:\n        return f\"\
  \"\"Transform this image into {style} style.\n        Feel free to creatively reinterpret\
  \ the scene.\"\"\"\n    else:\n        return (f\"Apply {style} style. Preserve\
  \ composition,\"\n                f\"geometry, object positions and perspective.\"\
  \n                f\"Only modify colors, textures and lighting.\")\n\ndef style_transfer(image_path,\
  \ style, strength):\n    prompt = build_prompt(style, strength)\n    result = client.images.edit(model=\"\
  gpt-image-1\",\n                                image=open(image_path, \"rb\"),\
  \ prompt=prompt)\n    img_bytes = base64.b64decode(result.data[0].b64_json)\n  \
  \  return Image.open(io.BytesIO(img_bytes))\n```\n\n用于应用吉卜力风格的 Gradio 应用界面如下所示：\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_728_0.png)\n\n图 13.42 – 使用 GPT 图像从输入图像生成吉卜力风格图像的\
  \ Gradio 应用\n\n支持的风格包括动漫、水彩、油画、赛博朋克、铅笔素描、吉卜力工作室和梵高。这种方法提供了一种可控的风格迁移形式，无需单独的风格迁移网络。\n\
  \n## 人脸修复\n\n视觉模型和图像生成模型可以组合成一个两阶段的修复流水线。\n\n### 阶段 1：图像评估\n\nGPT Vision 首先分析图像质量。该模型会估计输入旧照片的模糊程度、噪声、划痕和修复需求。\n\
  \n```python\nresponse = client.responses.create(model=\"gpt-4.1\",\n    input=[{\"\
  role\": \"user\", \"content\": [\n        {\"type\": \"input_text\", \"text\": \"\
  \"\"Analyze this image. Estimate:\nblur level,\n    noise level, scratches, restoration\
  \ needs\"\"\"},\n        {\"type\": \"input_image\", \"image_url\": f\"data:image/jpeg;base64,{base64.b64encode(img_bytes).decode()}\"\
  }\n    ]}])\n```\n\n```python\nanalysis = response.output_text\nprint(\"\\nGPT Vision\
  \ Analysis:\")\nprint(analysis)\n```\n\n> **摘要**：\n> 这是一张严重模糊的复古图像，噪声较低，无明显划痕。修复工作主要应侧重于提升清晰度、对比度，并重建关键面部特征，以恢复照片的清晰度和个性。\n\
  \n### 阶段 2：修复\n\n```python\nresult = client.images.edit(model=\"gpt-image-1\", image=[(\"\
  old_photo.jpg\", img_bytes)], prompt=\"\"\"Restore this photograph. Remove blur.\
  \ Remove noise.\n\nImprove facial detail. Preserve identity.\"\"\")\n```\n\n模型在保留原始身份和整体外观的同时，增强了面部细节。\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_729_0.png)\n\n图 13.43 – 使用 GPT Vision\
  \ 进行人脸修复\n\n应用包括历史照片修复、家庭照片增强、档案数字化和人脸重建。\n\n## 多图像合成\n\nGPT Image 可以联合推理多张输入图像，如下一段代码所示：\n\
  \n```python\nresult = client.images.edit(model=\"gpt-image-1\",\n    image=[open(\"\
  images/beach.png\", \"rb\"), open(\"images/whale.jpg\", \"rb\")],\n    # image=[open(\"\
  images/giraffe.jpg\", \"rb\"), open(\"images/bird.jpg\", \"rb\")]\n    prompt=\"\
  Combine these into a realistic product scene\")\n```\n\n模型将来自多个来源的视觉概念（鲸鱼与海滩、长颈鹿与鸟类）融合成一个连贯的构图，如下图所示。\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_730_0.png)\n\n图 13.44 – 使用 GPT-image\
  \ 进行多图像合成\n\n应用包括广告设计、产品可视化、概念艺术和合成场景创作。\n\n## 电商产品增强\n\n产品图像可以自动转换为专业的营销照片。\n\n\
  ```python\nresult = client.images.edit(model=\"gpt-image-1\", image=f,\n    prompt=\"\
  \"\"Place this product in a professional\n    studio background with soft lighting\"\
  \"\")\n```\n\n模型通过改善背景、光照、反射和呈现质量来执行虚拟摄影，如下一个 Gradio 应用所示。\n\n### 电商产品生成器\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_730_1.png)\n\
  \n图 13.45 – 使用 GPT-image 进行电商产品增强的 Gradio 应用\n\n## 视觉问答（VQA）\n\n视觉模型可以回答关于图像的任意问题。下一段代码中的\
  \ `analyze()` 函数将图像和自然语言问题发送给多模态 GPT 模型，并返回模型对图像的视觉理解。\n\n```python\ndef analyze(image,\
  \ question):\n    with open(image, \"rb\") as f:\n        b64 = base64.b64encode(f.read()).decode()\n\
  \    response = client.responses.create(model=\"gpt-4.1-mini\",\n        input=[{\"\
  role\": \"user\", \"content\": [\n            {\"type\": \"input_text\", \"text\"\
  : question},\n            {\"type\": \"input_image\", \"image_url\": f\"data:image/jpeg;base64,{b64}\"\
  }\n        ]}])\n    return response.output_text\n```\n\n展示 VQA 的 Gradio 应用界面如下图所示：\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_731_0.png)\n\n图 13.46 – 使用 GPT-Image\
  \ 的视觉问答系统 Gradio 应用\n\n> **注意**\n>\n> 上述三个基本步骤为：**编码图像 → 将图像和问题发送给 GPT → 返回答案。**\
  \ 这种能力被称为**视觉问答（VQA）**，下一个 Gradio 应用对此进行了演示。\n\n## 自动化工业检测（检测制造缺陷）\n\nGPT Vision\
  \ 可以充当质量检查助手。下一段代码使用多模态 GPT 模型作为自动化质量检查员，分析胶囊图像的*制造缺陷*，并返回结构化的 JSON 检测报告，其中包含检测到的缺陷、位置、严重程度、置信度分数和总体质量评估。\n\
  \n```python\nwith open(\"images/capsules.png\", \"rb\") as f:\n    image_b64 = base64.b64encode(f.read()).decode()\n\
  \nprompt = \"\"\"You are an industrial quality-control inspector. Analyze the image\
  \ carefully. Look for:\nScratches, Cracks, Corrosion, Missing parts, Deformation,\
  \ Surface\ncontamination, Paint defects,\nManufacturing anomalies. Return ONLY valid\
  \ JSON:\n{\"defect_found\": true,  \"defects\": [{\"type\": \"\",  \"location\"\
  : \"\", \"severity\": \"\",\n\"confidence\": 0, \"description\": \"\"}],  \"overall_quality\"\
  : \"\",  \"inspection_summary\": \"\"}\"\"\"\n\nresponse = client.responses.create(model=\"\
  gpt-4o\", input=[{\"role\": \"user\",\n    \"content\": [{\"type\": \"input_text\"\
  , \"text\": prompt},\n                {\"type\": \"input_image\",\n            \
  \     \"image_url\": f\"data:image/jpeg;base64,{image_b64}\"}]}])\nresult = response.output_text\n\
  print(result)\n```\n\n函数 `base64.b64encode(...)` 将图像转换为适合 API 传输的文本格式。\n\n`prompt`\
  \ 定义了检测任务并指定了所需的 JSON 输出格式。函数 `client.responses.create(...)` 将图像和检查指令发送给 GPT 视觉模型。此处，`\"\
  role\": \"user\"` 再次表明提示词和图像是用户输入给模型的内容，`\"type\": \"input_text\"` 提供缺陷检查指令，`\"\
  type\": \"input_image\"` 提供待分析的胶囊图像，其中 `response.output_text` 以 JSON 格式获取模型的检测报告，`print(result)`\
  \ 显示生成的质量控制报告。\n\n结果以结构化 JSON 形式返回。\n\n```json\n{\n    \"defect_found\": true,\n\
  \    \"defects\": [{\"type\": \"crack\", \"location\": \"first capsule\", \"severity\"\
  : \"high\", \"confidence\": 0.95,\n        \"description\": \"Visible crack running\
  \ down the length of the capsule.\"}, ...]\n}\n```\n\n随后的可视化代码（参见 GitHub）将 JSON\
  \ 输出转换为仪表板，显示缺陷位置、严重程度、置信度分数和检测摘要。\n\n\n\n\n\n## 质量控制报告\n\n### 整体质量：差\n\n发现多处缺陷，包括裂纹、变形和表面污染，影响胶囊的完整性和外观。\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_733_0.png)\n\n- **#1 裂纹**\n  - 严重程度：高\n\
  \  - 置信度：95.0%\n  - 位置：第一个胶囊\n  - 可见裂纹沿胶囊长度方向向下延伸。\n\n- **#2 变形**\n  - 严重程度：中\n\
  \  - 置信度：90.0%\n  - 位置：第二个胶囊\n  - 胶囊红色部分可见表面变形。\n\n- **#3 表面污染**\n  - 严重程度：中\n \
  \ - 置信度：85.0%\n  - 位置：第三个胶囊\n  - 胶囊下部可见褐色变色。\n\n检测到的缺陷：3\n\n图 13.47 – 使用 GPT-Image\
  \ 检测制造缺陷\n\n这展示了多模态基础模型如何协助工业质量保证。\n\n## 图像着色\n\nGPT-Image 可将灰度照片转换为逼真的彩色图像。\n\n\
  ```\nprompt = \"\"\"Colorize this grayscale photograph. Preserve: geometry, faces,\
  \ objects, composition. Add realistic natural colors. Photorealistic. High quality.\
  \ Historical accuracy if applicable.\"\"\"\n\ninput_image = \"images/balloons.png\"\
  \nwith open(input_image, \"rb\") as img:\n    result = client.images.edit(model=\"\
  gpt-image-1\", image=img, prompt=prompt)\n```\n\n该提示指示模型在生成合理色彩的同时保留几何形状和内容。\n\n\
  ![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_733_1.png)\n\n图 13.48 – 使用 GPT-Image 对灰度图像进行着色\n\
  \n应用包括历史图像修复、胶片修复、档案数字化以及文化遗产保护。\n\n## 草图到照片级真实合成\n\n手绘草图可以转换为逼真图像。\n\n```\nprompt\
  \ = \"\"\"Convert this sketch into a photorealistic image.\"\"\"\n```\n\n模型保留形状、构图、透视和姿势，同时生成逼真的纹理、光照和材质。\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_734_0.png)\n\n*图 13.49 – 从草图生成照片级真实图像（艾伦·图灵）*\n\
  \n应用包括概念设计、建筑、时尚和工业原型制作。\n\n## 绘画到照片级真实转换\n\n绘画和艺术作品可以转换为摄影图像。\n\n```\nresult =\
  \ client.images.edit(model=\"gpt-image-1\", image=img, prompt=prompt)\n```\n\n转换在保留场景结构的同时，将艺术纹理替换为逼真的视觉细节。\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_734_1.png)\n\n*图 13.50 – 从绘画生成照片级真实图像*\n\
  \n## 局部对象编辑\n\n特定对象可通过自然语言指令进行修改。\n\n```\nprompt = \"\"\"Change the yellow car to\
  \ red. Preserve everything else.\"\"\"\n```\n\n与传统的基于分割的方法不同，GPT-Image 通过对场景的语义理解执行局部编辑。\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_735_0.png)\n\n*图 13.51 – 使用 GPT-Image\
  \ 进行局部对象（汽车）编辑*\n\n应用包括产品定制、虚拟原型制作和设计探索。\n\n## 对象移除\n\n不需要的对象可以在不显式提供掩码的情况下被移除，如下所示：\n\
  \n```\nprompt = \"\"\"Remove the person from the image. Keep everything else unchanged.\"\
  \"\"\n```\n\n模型重建被隐藏的背景并一致地填充被移除区域。这是一种广义的 *语义修复* 形式，如下图所示：\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_735_1.png)\n\
  \n*图 13.52 – 使用 GPT-Image 进行对象移除*\n\n将原始图像和结果图像（使用上述提示生成）并排绘制，您将得到以下图：\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_737_0.png)\n\
  \n图 13.54 – 使用 GPT-Image 进行夜到日转换\n\n季节转换：植被、积雪覆盖、大气和光照条件在保持底层地貌结构的同时被修改，如使用下一提示对维多利亚纪念大厅图像所做的那样。\n\
  \n```\nprompt = \"\"\"Convert this summer scene into a realistic winter scene.\"\
  \"\"\n```\n\n将原始图像和结果图像（使用上述提示生成）并排绘制，您将得到以下图：\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_737_1.png)\n\
  \n图 13.55 – 使用 GPT-Image 进行夏到冬转换\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_739_0.png)\n\
  \n图 13.56 - 使用 GPT-5 对两张图像进行变化检测\n\n模型比较两张图像并识别：新建筑、拆除结构、道路修改、植被变化、城市扩张和施工活动。输出以结构化\
  \ JSON 返回并转换为表格报告以供进一步分析。\n\n## 医学图像解读\n\n视觉模型可以提供医学图像的教育性分析。下一段代码使用多模态 GPT 模型分析大脑\
  \ MRI 图像（如下所示）并生成非诊断性报告，描述可见解剖结构、图像方向、结构、观察结果和局限性。\n\n```\nwith open(\"images/mri.png\"\
  , \"rb\") as f:\n    image_b64 = base64.b64encode(f.read()).decode()\n\nresponse\
  \ = client.responses.create(model=\"gpt-5.1\", input=[{\"role\": \"user\",\n\"content\"\
  : [{\"type\": \"input_text\", \"text\": \"Analyze this brain MRI. Describe visible\
  \ anatomy, orientation, structures, observations, and limitations. Do not provide\
  \ a diagnosis.\"},\n{\"type\": \"input_image\", \"image_url\": f\"data:image/jpeg;base64,{image_b64}\"\
  }]}])\n\nprint(response.output_text)\n```\n\n- **可见解剖结构（主要区域）**\n  - 大脑半球：额叶（上部）、颞叶（侧部/下部）。\n\
  \  - 深部灰质结构：丘脑在中线附近部分可见。\n  - 脑室系统：侧脑室体部（中线、低信号）。\n  - 中线结构：大脑镰、半球间裂。\n  - 颅底/眶区：\n\
  \    - 眶和外眼肌\n    - 鞍/鞍上区（垂体区）\n    - 海绵窦/蝶窦区\n    - 脑干上部开始在下方出现。\n    - . . .\n\
  \n代码将 MRI 图像和分析提示发送给多模态 GPT 模型，并返回对扫描的结构化教育性描述，而不尝试医学诊断。\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_740_0.png)\n\
  \n模型描述可见解剖结构和成像特征，同时避免确定性诊断。潜在应用包括医学教育、图像标注、数据集文档和临床工作流程辅助。人类专家审查对于诊断决策至关重要。\n\n\
  GPT Vision 和 GPT Image API 提供统一的多模态框架，用于图像理解、生成、编辑、修复、修复、风格迁移、视觉问答、工业检测、遥感分析和医学图像解读。通过将大型视觉语言模型与强大的图像生成能力相结合，这些\
  \ API 能够通过简单的自然语言指令实现复杂的计算机视觉工作流程，显著减少对任务特定架构和专门训练流程的需求。\n\n> 注意\n> 上述各节中使用的 GPT-4.1\
  \ 和 GPT-5 是为推理、语言生成、编码和图像理解而设计的多模态 LLM，而 gpt-image-1 是专门的图像生成模型，用于根据文本提示和现有图像创建和编辑图像。\n\
  \n## 生成式 AI 用于化学\n\n这些练习展示了使用 GPT-Image 在化学中使用多模态生成式 AI 的应用，完整代码和实现可在随附的 GitHub\
  \ 仓库中获得；仅显示最终生成的输出。\n\n### 练习 1：杂化可视化\n\n生成教科书风格的信息图表，比较 sp、sp² 和 sp³ 杂化，包括几何形状、键角和示例（BeCl₂、BF₃、CH₄），展示自动化学图生成：\n\
  \n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_741_0.png)\n\n图 13.58 – GPT-Image 生成化学教育内容\n\
  \n此示例展示了生成式 AI 如何快速生成高质量的化学教育图表，用于科学传播和教学材料。\n\n### 练习 2：类药分子设计\n\n使用分子图像作为输入供视觉模型分析结构并提出新型类似物，然后使用\
  \ GPT-Image 生成其 2D 骨架式，展示分子设计的图像到推理到图像流程。\n\n输入药物（阿莫西林）分子\n\n生成的新类药分子\n\n![](img/ebc2ad05fd41bdb1531c3dba43fbf8d5_741_1.png)\n\
  \n图 13.59 – GPT-Image 从现有药物分子生成新型类药分子\n\n此示例说明了生成式 AI 如何通过将化学结构图像转化为新型设计概念来支持分子构思和可视化，为教育、化学信息学和\
  \ AI 辅助药物发现研究提供有用的工具。\n\n\n\n\n## 小结\n\n在本章中，我们考察了塑造现代生成式计算机视觉的主要范式，包括GAN、VAE、扩散模型、潜在扩散和多模态基础模型。通过动手示例，我们展示了这些技术如何实现高质量图像生成、图像到图像转换、人脸复原、结构保持编辑、身份引导合成、图像修复、视觉推理和智能图像分析。结合全书所涉及的主题，这些方法展示了从传统图像处理和视觉识别向能够理解并创建视觉内容的强大生成系统的转变。\n\
  \n在整本书中，我们完成了一段旅程：从基础的图像处理和计算机视觉任务——图像操作、增强、复原、分类、目标检测和分割——到现代生成式和多模态AI系统。各章共同展示了计算机视觉从理解视觉内容到生成、编辑和控制视觉内容的演进，为当代AI驱动的图像处理提供了一个统一视角。\n\
