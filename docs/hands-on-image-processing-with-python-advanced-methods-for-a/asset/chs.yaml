  \ **0.93** | **1.00** |\n| **F1分数** | **0.97** | **0.96** |\n\n*表12.3：使用预训练模型在测试数据集上的分类报告*\n\
  \n考虑到该模型从未专门针对猫狗分类进行训练，这一结果出人意料地强大。\n\n**迁移学习VGG16：** 在替换分类头并重新训练后，测试准确率提升至98.35%，混淆矩阵为[990\
  \  10; 23  977]。这一改进证明了将预训练特征适应到目标领域的有效性。\n\n**分类指标：** 迁移学习模型取得：\n\n| 指标 | 猫 | 狗\
  \ |\n|---|---|---|\n| 精确率 | 0.98 | 0.99 |\n| 召回率 | 0.99 | 0.98 |\n| F1分数 | 0.98\
  \ | 0.98 |\n\n*表12.4：使用微调模型（带迁移学习）在测试数据集上的分类报告*\n\n均衡的精确率和召回率表明模型在两个类别上都表现良好。预训练模型学习了一个为ImageNet优化的决策函数$f_{\\\
  mathrm{ImageNet}}: \\mathcal{X} \\to \\mathbb{R}^{1000}$。迁移学习在保留已学到的视觉表示的同时，修改最终分类器：$f_{\\\
  text{cats-dogs}}: \\mathcal{X} \\to \\mathbb{R}^2$。卷积滤波器继续检测耳朵、毛发纹理、眼睛和身体形状，但最终决策边界变得专门用于区分猫和狗。\n\
