  \    plt.axis('off'), plt.title(f'opacity={opacity}', size=20)\n    i += 1\nplt.suptitle('Blending\
  \ with soft-light algorithm with blend_modes', \\\n    size=25)\n```\n\n如果运行前面的代码片段，你应该会得到如下图所示的图形：\n\
