  ```\n! python -m streamlit run app.py\n```\n\n它默认在 localhost:8501 打开一个浏览器窗口（或指定的端口）。现在，上传一张图像并交互式尝试不同的增强效果。下一张截图显示了应用程序的外观：\n\
