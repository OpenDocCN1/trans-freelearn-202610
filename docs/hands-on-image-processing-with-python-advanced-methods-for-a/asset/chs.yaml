  | `st.slider(...)` | 允许用户为所选方法动态调整参数 |\n| Conditional if-elif block | 将所选增强方法应用于上传的图像\
  \ |\n| `cv2.cvtColor(...)` again | 将结果从 BGR 转换为 RGB，以便在 Streamlit 中正确显示 |\n| `st.columns(...)\
  \ + st.image(...)` | 并排显示原始图像和增强图像 |\n\n*Table 7.7 – Summary of the key functions\
  \ in app.py*\n\n其工作原理如下（高层流程）：\n\n1. 用户上传图像\n2. 用户选择增强方法\n3. 可选滑块出现（如果方法需要参数）\n\
