    \ in literary form by Orson Scott Card, and musically\nby Iron Maiden through\
    \ their epic album of the same title.\n```\n\n在模板中，我们可以看到 Consul 被指示插入 `son/seventh/gift`\
    \ 键的值。\n\n为了利用模板并创建文件，可以手动运行 consul-template。然而，我们正试图通过 Consul 的智能尽可能自动化。为什么我们现在要诉诸手动操作呢？因此，与其手动运行\
    \ consul-template，我们在创建基础设施时执行的 `remote-exec` 操作的一部分中将其作为后台操作启动：\n\n```\nnohup\
    \ sudo consul-template -consul-addr=\\\"${self.private_ip}\\\"\n-template \\\"\
    /tmp/SeventhSon.tpl:/etc/consul/seventh_son.txt\\\",\n```\n\n此命令实例化 consul-template\
    \ 应用程序，标识用于连接到 Consul 服务的 IP 地址。对于我们的基础设施，consul-template 函数在与 Consul 相同的机器上运行，但它可以位于其他地方并仍然使用\
    \ Consul 的数据。我们告诉 consul-template 加载模板文件 `tmp/SeventhSon.tpl` 并使用该模板创建一个新的文本文件（`/etc/consul/seventh_son.txt`）。由于应用程序在后台运行，consul-template\
    \ 将监控已标识键的值，并在该值更改时更新目标文件。我们可以在自己的小环境中尝试一下。\n\n如果你一直跟着做，你已经为 `son/seventh/gift`\
    \ 键设置了 `clairvoyance` 值。如果 consul-template 按设计工作，我们应该已经创建了文件。要验证对可用客户端之一的 SSH，请执行以下命令：\n\
    \n```\n$ cat /etc/consul/seventh_son.txt\n```\n\n我们应该会看到按模板指定的文本显示，其中插入了值 `clairvoyance`：\n\
    \n```\nSeventh Son of a Seventh Son is a story about a young boy born\nwith the\
    \ gift of clairvoyance. It has been popularized in\nliterary form by Orson Scott\
    \ Card, and musically by Iron Maiden\nthrough their epic album of the same title.\n\
    ```\n\n让我们看看当我们更改值时该文件会发生什么。更新 `son/seventh/gift` 键的值。随意通过我们之前练习的任何方法来完成。更新值后，再次检查\
    \ `seventh_son.txt` 文件，看看你的更新值是否已反映出来。现在，我们可以想象这个简单的文本文件是应用程序的配置文件。我们的模板可以根据需要在管理大量配置文件方面一样全面，所有这些都由\
    \ Consul KV 存储中的值动态管理并自动更新！\n\n如果你因兴奋而神经元活跃，请继续保持！Consul Template 可以做的事情远不止我们在这里涵盖的范围。项目的完整文档和源代码也可在\
    \ GitHub 上获得，网址为 https://github.com/hashicorp/consul-template。\n\n既然我们已经介绍了 KV\
    \ 存储的使用以及 Consul Template 的使用，让我们继续并查看如何利用 Consul 监视和处理程序作为自动化第三方组件配置的另一种方法。\n\
    \n## Watching your handlers\n\n早在 *Chapter 5, Little Bo Peep Lost Her Service*\
    \ 中，小波比牧羊女丢失了她的服务，我们就触及了 Consul 监视和处理程序的功能。回想一下，Consul **watch** 会观察 Consul 中任意数量的参数，并基于值更改，可以执行\
    \ **handler** 来执行某些功能。在 *Chapter 5, Little Bo Peep Lost Her Service* 中，我们专注于能够监视服务的状态，以便通知第三方有关服务健康状况。我们可以使用相同的功能，但不是监视服务状态，而是监视\
    \ KV 存储中参数的状态。\n\n例如，如果我们想监视我们的键，使用直接命令行，我们将执行以下操作：\n\n```\n$ consul watch -type=key\
    \ -key=son/seventh/gift\n{\n    \"Key\": \"son/seventh/gift\",\n    \"CreateIndex\"\
