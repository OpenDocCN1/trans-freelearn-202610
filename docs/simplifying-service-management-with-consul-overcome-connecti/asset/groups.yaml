    ```

    server = true

    datacenter = "Elwood"

    bootstrap_expect = 3

    ```


    我已在两个数据中心 Jake 和 Elwood 中各设置了三台服务器节点。连接这两个数据中心在配置中以及通过命令行都非常简单。在配置中，我们使用 retry_join_wan
    命令，与我们已用于 Consul 节点相互发现的 retry_join 命令类似。此外，你只需要每个数据中心之间的一台服务器连接，因为它们随后会相互了解。然而，我强烈建议包含多台服务器，以防在两个数据中心需要连接时其中一台不可用：


