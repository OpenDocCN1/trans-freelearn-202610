    # Consul Template


    The application of Consul Template may be one of my favorite things about Consul.
    However, it isn’t just restricted to Consul, as Vault implementations can utilize
    the same functionality. With Consul Template, configuration files can be populated
    by Consul directly utilizing parameters as if it was, well, a template. I guess
    you probably saw that coming.


    The functionality of Consul Template isn''t embedded within Consul itself, however,
    so it must be downloaded and executed as its own service. The binary (`consul-template`)
    is available at the HashiCorp releases website if you would like to download it
    yourself, however, when we built new images for this chapter, installation of
    the Consul Template binary was part of the process (`https://releases.hashicorp.com/consul-template/`).'
