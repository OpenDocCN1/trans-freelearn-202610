- raw:
  - "[PAGE 62]\n\nAll right—now, the good stuff! Within this section, we're creating\
    \ three Consul servers, utilizing the AMI that we found as the data source (the\
    \ AMI that we built using Packer). We're using the SSH key that we created as\
    \ part of the Terraform script and have allocated a public IP address so that\
    \ we can reach the server. Toward the bottom, we are associating tags with the\
    \ servers so that we can easily find them. Do yourself and your IT operations\
    \ group a favor: never deploy infrastructure without associating logical tags!\
    \ One of those tags uniquely identifies the instance as well, which we can use\
    \ to uniquely identify the server. Directly above the tags, there is a user_data\
    \ field. This is pretty important as it calls a template file, server_template.tpl,\
    \ to configure the Consul servers. We're also passing a server_name_tag property\
    \ to the template file to help identify the servers. The code is illustrated in\
    \ the following snippet:\n\n```\nresource aws_instance \"consul-server\" {\n \
    \ count                         = 3\n  ami                           = data.aws_ami.an_image.id\n\
    \  instance_type                 = var.instance_type\n  key_name             \
    \         = aws_key_pair.consul_key.key_name\n  associate_public_ip_address  \
    \ = true\n  subnet_id                     = aws_subnet.consul-demo.id\n  vpc_security_group_ids\
    \        = [aws_security_group.consul-demo.id]\n  iam_instance_profile       \
    \   = aws_iam_instance_profile.instance_profile.name\n  user_data = templatefile(\"\
    files/server_template.tpl\", {\n    server_name_tag = \"${var.owner}-consul-server-instance\"\
    })\n  tags = {\n    Name     = \"${var.owner}-consul-server-instance\"\n    Owner\
    \    = var.owner\n    Instance = \"${var.owner}-consul-server-instance-${count.index}\"\
    \n  }\n}\n```"
  - "[PAGE 63]\n\nIn the next code snippet, we’re building our Consul clients—four\
    \ of them to be exact, representing the core elements of earth, air, fire, and\
    \ water. Many of these parameters are identical to what we used for the servers,\
    \ but notice that there is no user_data section. For variety, we’re using a Terraform\
    \ provisioner to configure the clients, although in a production environment,\
    \ configuration managers such as Ansible would be preferred:\n\n```\nresource\
    \ aws_instance \"consul-client\" {\n  count = 4\n  ami = data.aws_ami.an_image.id\n\
    \  instance_type = var.instance_type\n  key_name = aws_key_pair.consul_key.key_name\n\
    \  associate_public_ip_address = true\n  subnet_id = aws_subnet.consul-demo.id\n\
    \  vpc_security_group_ids = [aws_security_group.consul-demo.id]\n  iam_instance_profile\
    \ = aws_iam_instance_profile.instance_profile.name\n  tags = {\n    Name = \"\
    ${var.owner}-consul-client-instance-${count.index}\"\n    Owner = var.owner\n\
    \  }\n}\n```\n\nIt should be noted that remote provisioners aren’t preferred within\
    \ the world of Terraform; however, I find it very useful on occasion to customize\
    \ the resources that we require. As part of this provisioning, we’re iterating\
    \ over each of our four clients and performing a few functions, as follows:\n\n\
    +   - Transferring a service definition file called `httpd.json` to the client.\
    \ We’ll discuss this more later as we start playing with the cluster.\n+   - Creating\
    \ a `consul-client.hcl` configuration file. I want to dig into this file a bit\
    \ more:\n+     - We’re advertising the public IP address of the client. This tells\
    \ the Consul servers, and any devices requesting access to any services on this\
    \ client, which address it can be reached on. We’re choosing the public address\
    \ of the client so that it can be reached by applications outside of the internal\
    \ network."
  - "[PAGE 64]\n\n+   - We’re telling the agent not to run as a server, because—well—we’re\
    \ a client.\n+   - We’re enabling script checks. This allows custom scripts to\
    \ be used to check for service health and is not enabled by default.\n+   - We’re\
    \ telling Consul to bind its service to the private address of the machine. Note\
    \ the difference between the bind address and the advertising address. The private\
    \ address is known by the machine itself and identifies the external interface.\
    \ The public address we’re advertising isn’t even known by the client machine\
    \ itself and is managed by AWS.\n+   - We’re telling the clients where the servers\
    \ are. Remember that a client needs to register with the servers in order to communicate\
    \ the status of itself and all of its managed services.\n+   - We’re identifying\
    \ the client address to use when communicating with the Consul server. Because\
    \ the server and client reside within the same AWS virtual network, we can use\
    \ the private IP address.\n+   - Moving the client configuration and the service\
    \ definition files to the configuration directory (`/etc/consul/consul.d/`).\n\
    +   - Starting a simple HyperText Transfer Protocol (HTTP) server using Python.\
    \ After all, why go through the hassle of creating a Consul cluster without having\
    \ any services running on it?!\n+   - Next, we’re using a provisioner to remotely\
    \ start the Consul service on the client machine.\n+   - This last block tells\
    \ Terraform how it’s going to connect to the client machine. Note that we’re using\
    \ the contents of that SSH key we created previously.\n\nNotice that although\
    \ the configuration for the clients is all in this Terraform file, the application\
    \ configuration for the servers is not. This is because we used that `user_data`\
    \ feature within Terraform, and we’ll be looking at the template file very shortly.\
    \ Within Terraform, when we utilize a provisioner for scripting or moving files,\
    \ we declare a `null_resource` property, as follows:\n\n```\nresource null_resource\
    \ \"provisioning-clients\" {\n  for_each = { for client in aws_instance.consul-client\
    \ : client.tags.Name => client }\n  provisioner \"file\" {\n    source      =\
    \ \"files/httpd.json\"\n    destination = \"/tmp/httpd.json\"\n  }\n}\n```"
  - "[PAGE 65]\n\n```\n```hcl\nprovisioner \"remote-exec\" {\n  inline = [\n    \"\
    sudo cat << EOF > /tmp/consul-client.hcl\",\n    \"advertise_addr = \\\"${each.value.public_ip}\\\
    \"\",\n    \"server = false\",\n    \"enable_script_checks = true\",\n    \"bind_addr\
    \ = \\\"${each.value.private_ip}\\\"\",\n    \"retry_join = [\\\"${aws_instance.consul-server[0].public_ip}\\\
    \",\\\"${aws_instance.consul-server[1].public_ip}\\\",\\\"${aws_instance.consul-server[2].public_ip}\\\
    \"]\",\n    \"client_addr = \\\"${each.value.private_ip}\\\"\",\n    \"EOF\",\n\
    \    \"sudo mv /tmp/consul-client.hcl /etc/consul/consul.d/consul-client.hcl\"\
