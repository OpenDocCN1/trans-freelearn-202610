    owner         = \"rjackson\"\naws_region    = \"us-east-2\"\ninstance_type = \"\
    t2.small\"\n```\n\nOK—now that we’ve set our variables to our liking, it’s time\
    \ to fire up our infrastructure! If you’ve never used Terraform before, don’t\
    \ worry—it’s quite easy, and all of the code has been built. Again, I never claimed\
    \ to be a software developer, so please don’t laugh at my code! First, we’re going\
    \ to kick off our infrastructure build and then dissect what we built. To get\
    \ started, Terraform needs to download any provider-specific data necessary. This\
    \ is performed via the following command:\n\n```\n$ terraform init\n```\n\nOf\
    \ course, it’s never good to build something without examining what you build,\
    \ so next, we’re going to plan our build. All of the output from this command\
    \ should be green plus signs (+), identifying which infrastructure is going to\
    \ be created. Note that many of these items are known after apply operation as\
    \ they require assignment from AWS, but it might be fun to peruse what you are\
    \ about to build. If not, don’t worry—I’ll review the details after we kick off\
    \ the build.\n\nNow, run the following command:\n\n```\n$ terraform plan\n```\n\
    \nNext, we’re going to apply our infrastructure build. This is done using—you\
    \ guessed it: terraform apply. This kicks off another plan and shows you what\
    \ you are about to build, but since we’ve already done that, let’s live dangerously\
    \ and auto-approve. Have a look at the following code snippet:\n\n```\n$ terraform\
    \ apply --auto-approve\n```\n\n> Note\n> The author can't be held responsible\
    \ for any costs you incur during this practice. Please be sure to destroy your\
    \ infrastructure when you quit for the day or night. If you want to set up an\
    \ m3.xlarge system and leave it running for days, that's up to you!\n\nAll right—let's\
    \ take a look at what we are building. All of the following code blocks (in this\
    \ section) are within the main.tf file. It is Terraform best practice to have\
    \ all pieces of the code in one file, so that's what we're going to do here!\n\
    \nThis first section is fairly simple and simply sets up the Terraform providers\
    \ that we'll be using. A Terraform provider is kind of like a module that provides\
    \ functionality specific to the provider—for example, we're installing the AWS\
    \ provider, enabling us to manage resources in AWS. We're specifying the version\
    \ of that provider, and the region that we'll be working in. The provider block\
    \ is also where naughty people would insert their AWS credentials, but we're never\
    \ going to do that—WILL WE??? Finally, we're using an AWS data source to find\
    \ the image that we just built using Packer. Here's the code you'll need:\n\n\
    ```\nterraform {\n  required_providers {\n    aws = {\n      source  = \"hashicorp/aws\"\
    \n      version = \"~> 2.5\"\n    }\n  }\n}\nprovider \"aws\" {\n  region = var.aws_region\n\
    }\ndata \"aws_ami\" \"an_image\" {\n  most_recent = true\n  owners      = [\"\
    self\"]\n  filter {\n    name   = \"name\"\n    values = [\"${var.owner}-consul-*\"\
    ]\n  }\n}\n```\n\nThis next section creates a private key for us to use in order\
    \ to ssh into our machines. An organization would typically maintain its own private\
    \ keys for machine access, but these really shouldn't be floating around. A more\
    \ secure approach would be to utilize the HashiCorp Vault Secure Shell (SSH) helper\
    \ for one-time-use SSH keys, but that's another story. The key will be built within\
    \ our Consul machines, but we'll also have a local Privacy Enhanced Mail (PEM)\
    \ file ending in -consul-key.pem. The code you'll need is illustrated in the following\
    \ snippet:\n\n```\nresource \"tls_private_key\" \"my_private_key\" {\n  algorithm\
    \ = \"RSA\"\n  rsa_bits = 4096\n}\nresource \"local_file\" \"private_key\" {\n\
    \  content = tls_private_key.my_private_key.private_key_pem\n  filename = \"${var.owner}-consul-key.pem\"\
    \n  file_permission = 0400\n}\nresource \"aws_key_pair\" \"consul_key\" {\n  key_name\
    \ = \"${var.owner}-consul-key\"\n  public_key = tls_private_key.my_private_key.public_key_openssh\n\
    }\n```\n\nThis section provides the vast majority of the networking information\
    \ necessary for our system. As we aren't reading a book about the intricacies\
    \ of AWS networking, you'll have to just trust me that all of the code in the\
    \ following snippet is cool:\n\n```\nresource aws_vpc \"consul-demo\" {\n  cidr_block\
    \           = var.vpc_cidr\n  enable_dns_hostnames = true\n  tags = {\n    Name\
    \ = \"${var.owner}-vpc\"\n  }\n}\nresource aws_subnet \"consul-demo\" {\n  vpc_id\
    \     = aws_vpc.consul-demo.id\n  cidr_block = var.vpc_cidr\n  tags = {\n    name\
    \ = \"${var.owner}-subnet\"\n```\n```\n}\n}\nresource aws_internet_gateway \"\
    consul-demo\" {\n  vpc_id = aws_vpc.consul-demo.id\n\n  tags = {\n    Name = \"\
    ${var.owner}-internet-gateway\"\n  }\n}\nresource aws_route_table \"consul-demo\"\
    \ {\n  vpc_id = aws_vpc.consul-demo.id\n  route {\n    cidr_block = \"0.0.0.0/0\"\
    \n    gateway_id = aws_internet_gateway.consul-demo.id\n  }\n}\nresource aws_route_table_association\
    \ \"consul-demo\" {\n  subnet_id     = aws_subnet.consul-demo.id\n  route_table_id\
    \ = aws_route_table.consul-demo.id\n}\n```\n\nOK—this part of the networking is\
    \ not something to gloss over. AWS security groups identify which ports are open\
    \ between which devices. Here is a list of the defined ports and their purpose:\n\
    \n- Port 22—SSH access.\n- Ports 8300-8302—These cover all consensus, RPC, and\
    \ gossip communication between the nodes.\n- Port 8500—This is used for the Consul\
    \ web user interface (UI).\n- Port 8600—Consul utilizes port 8600 for Domain Name\
    \ System (DNS) queries as part of the Service Discovery function.\n\nThese ports\
    \ have all been addressed and configured within the security group configuration.\
    \ Here's the code illustrating this:\n\n```\nresource aws_security_group \"consul-demo\"\
    \ {\n  name   = \"${var.owner}-security-group\"\n  vpc_id = aws_vpc.consul-demo.id\n\
    ```\n\n```\ningress {\n    from_port    = 22\n    to_port      = 22\n    protocol\
    \     = \"tcp\"\n    cidr_blocks  = [\"0.0.0.0/0\"]\n}\ningress {\n    from_port\
    \    = 8300\n    to_port      = 8302\n    protocol     = \"tcp\"\n    cidr_blocks\
    \  = [\"0.0.0.0/0\"]\n}\ningress {\n    from_port    = 8500\n    to_port     \
    \ = 8500\n    protocol     = \"tcp\"\n    cidr_blocks  = [\"0.0.0.0/0\"]\n}\n\
    ingress {\n    from_port    = 8600\n    to_port      = 8600\n    protocol    \
    \ = \"tcp\"\n    cidr_blocks  = [\"0.0.0.0/0\"]\n}\negress {\n    from_port  \
    \      = 0\n    to_port          = 0\n    protocol         = \"-1\"\n    cidr_blocks\
    \      = [\"0.0.0.0/0\"]\n    prefix_list_ids  = []\n}\ntags = {\n    Name = \"\
    ${var.owner}-security-group\"\n}\n}\n```\n"
  mdcn: "\n\n## 构建 Consul 集群\n\n首先，切换到 ch2 的根目录。在这里，我们将找到用于构建集群的 Terraform 脚本。你可以通过运行以下命令来完成此操作：\n\
    \n```\n$ cd $github_root/Consul-Up-and-Running/ch2/\n```\n\n与构建 Packer 镜像时类似，此目录中有几个文件需要我们注意。暂时不用关心\
    \ files 目录，等我们评估用于构建集群的 Terraform 脚本时再深入探讨。\n\n如果你查看我们的 variables.tf 文件，这里定义了\
    \ Terraform 所需的变量。我总是分不清变量在哪里定义、在哪里赋值。总之，对于这五个变量，每个都有描述（这总是一个好习惯）和一个合理的默认值（好吧，从我的角度来看是合理的）。请看下面的代码片段：\n\
    \n### variables.tf\n\n```\nvariable \"aws_region\" {\n  type        = string\n\
    \  default     = \"us-east-1\"\n  description = \"Region for AWS Components\"\n\
    }\nvariable \"owner\" {\n  type        = string\n  default     = \"consul-demo\"\
    \n}\nvariable \"consul_region\" {\n  type        = string\n  description = \"\
    Region of consul server (not AWS Region)\"\n  default     = \"global\"\n}\nvariable\
    \ \"vpc_cidr\" {\n  type        = string\n  description = \"CIDR of the VPC\"\n\
    \  default     = \"192.168.100.0/24\"\n}\nvariable \"instance_type\" {\n```\n\n\
    ```\ntype          = string\ndescription   = \"machine instance type\"\ndefault\
    \       = \"t3.micro\"\n}\n```\n\n如果你更愿意为必要的变量使用自己的值，别担心——我不会介意的。这些变量在 terraform.tfvars\
    \ 文件中设置。请看下面的代码片段：\n\n### Terraform.tfvars\n\n```\nowner         = \"rjackson\"\
    \naws_region    = \"us-east-2\"\ninstance_type = \"t2.small\"\n```\n\n好了——现在我们已经按照自己的喜好设置好了变量，是时候启动我们的基础设施了！如果你以前从未使用过\
    \ Terraform，别担心——它非常简单，而且所有代码都已构建完成。再说一次，我从不自称是软件开发人员，所以请不要嘲笑我的代码！首先，我们要启动基础设施的构建，然后剖析我们构建的内容。要开始，Terraform\
    \ 需要下载任何必要的特定于提供程序的数据。这通过以下命令执行：\n\n```\n$ terraform init\n```\n\n当然，在不检查将要构建的内容的情况下就进行构建从来都不是好事，所以接下来，我们要规划我们的构建。此命令的所有输出都应该是绿色的加号（+），表示将要创建哪些基础设施。请注意，其中许多项目在\
    \ apply 操作之后才能确定，因为它们需要从 AWS 分配，但浏览一下你将要构建的内容可能会很有趣。如果不感兴趣，别担心——我们会在启动构建后审查细节。\n\
    \n现在，运行以下命令：\n\n```\n$ terraform plan\n```\n\n接下来，我们要应用我们的基础设施构建。这通过你猜对了的 terraform\
    \ apply 来完成。这会再次触发一个 plan，并显示你将要构建的内容，但既然我们已经做过这件事了，那就来个危险的操作吧，直接自动批准。请看下面的代码片段：\n\
    \n```\n$ terraform apply --auto-approve\n```\n\n> 注意\n> 对于你在本练习中产生的任何费用，作者概不负责。请务必在白天或夜晚结束时销毁你的基础设施。如果你想设置一个\
    \ m3.xlarge 系统并让它连续运行几天，那随你便！\n\n好的——让我们来看看我们在构建什么。以下所有代码块（本节中的）都在 main.tf 文件中。Terraform\
    \ 的最佳实践是将所有代码片段放在一个文件中，所以我们要做的就是这样！\n\n第一部分相当简单，只是设置了我们将要使用的 Terraform 提供程序。Terraform\
    \ 提供程序有点像提供特定于该提供程序的功能的模块——例如，我们正在安装 AWS 提供程序，使我们能够管理 AWS 中的资源。我们指定了该提供程序的版本，以及我们将要工作的区域。provider\
    \ 块也是调皮的人会插入其 AWS 凭据的地方，但我们永远不会那样做——对吧？？？最后，我们使用 AWS 数据源来查找我们刚刚使用 Packer 构建的镜像。以下是您需要的代码：\n\
    \n```\nterraform {\n  required_providers {\n    aws = {\n      source  = \"hashicorp/aws\"\
    \n      version = \"~> 2.5\"\n    }\n  }\n}\nprovider \"aws\" {\n  region = var.aws_region\n\
    }\ndata \"aws_ami\" \"an_image\" {\n  most_recent = true\n  owners      = [\"\
    self\"]\n  filter {\n    name   = \"name\"\n    values = [\"${var.owner}-consul-*\"\
    ]\n  }\n}\n```\n\n下一个部分创建了一个私钥，供我们用来 SSH 登录到我们的机器。一个组织通常会维护自己的私钥用于机器访问，但这些私钥确实不应该随意流传。更安全的方法是使用\
    \ HashiCorp Vault Secure Shell (SSH) 助手来生成一次性 SSH 密钥，但那是另一个故事了。密钥将构建在我们的 Consul\
    \ 机器内部，但我们也会有一个以 -consul-key.pem 结尾的本地 Privacy Enhanced Mail (PEM) 文件。您需要的代码如下面片段所示：\n\
    \n```\nresource \"tls_private_key\" \"my_private_key\" {\n  algorithm = \"RSA\"\
    \n  rsa_bits = 4096\n}\nresource \"local_file\" \"private_key\" {\n  content =\
    \ tls_private_key.my_private_key.private_key_pem\n  filename = \"${var.owner}-consul-key.pem\"\
    \n  file_permission = 0400\n}\nresource \"aws_key_pair\" \"consul_key\" {\n  key_name\
    \ = \"${var.owner}-consul-key\"\n  public_key = tls_private_key.my_private_key.public_key_openssh\n\
    }\n```\n\n本部分提供了我们系统所需的大部分网络信息。由于我们不是在阅读关于 AWS 网络复杂细节的书，你就得相信我，下面片段中的所有代码都很酷：\n\
    \n```\nresource aws_vpc \"consul-demo\" {\n  cidr_block           = var.vpc_cidr\n\
    \  enable_dns_hostnames = true\n  tags = {\n    Name = \"${var.owner}-vpc\"\n\
    \  }\n}\nresource aws_subnet \"consul-demo\" {\n  vpc_id     = aws_vpc.consul-demo.id\n\
    \  cidr_block = var.vpc_cidr\n  tags = {\n    name = \"${var.owner}-subnet\"\n\
    ```\n```\n}\n}\nresource aws_internet_gateway \"consul-demo\" {\n  vpc_id = aws_vpc.consul-demo.id\n\
    \n  tags = {\n    Name = \"${var.owner}-internet-gateway\"\n  }\n}\nresource aws_route_table\
    \ \"consul-demo\" {\n  vpc_id = aws_vpc.consul-demo.id\n  route {\n    cidr_block\
    \ = \"0.0.0.0/0\"\n    gateway_id = aws_internet_gateway.consul-demo.id\n  }\n\
    }\nresource aws_route_table_association \"consul-demo\" {\n  subnet_id     = aws_subnet.consul-demo.id\n\
    \  route_table_id = aws_route_table.consul-demo.id\n}\n```\n\n好的——这部分网络内容可不是能轻易略过的。AWS\
    \ 安全组确定了哪些设备之间开放哪些端口。以下是已定义端口及其用途的列表：\n\n-   端口 22—SSH 访问。\n-   端口 8300-8302—这些涵盖了节点之间所有的共识、RPC\
    \ 和 gossip 通信。\n-   端口 8500—用于 Consul 的 Web 用户界面（UI）。\n-   端口 8600—Consul 利用端口\
    \ 8600 进行域名系统（DNS）查询，作为服务发现功能的一部分。\n\n这些端口都已在安全组配置中设置并配置完毕。以下是说明这一点的代码：\n\n```\n\
    resource aws_security_group \"consul-demo\" {\n  name   = \"${var.owner}-security-group\"\
    \n  vpc_id = aws_vpc.consul-demo.id\n```\n\n```\ningress {\n    from_port    =\
    \ 22\n    to_port      = 22\n    protocol     = \"tcp\"\n    cidr_blocks  = [\"\
    0.0.0.0/0\"]\n}\ningress {\n    from_port    = 8300\n    to_port      = 8302\n\
    \    protocol     = \"tcp\"\n    cidr_blocks  = [\"0.0.0.0/0\"]\n}\ningress {\n\
    \    from_port    = 8500\n    to_port      = 8500\n    protocol     = \"tcp\"\n\
    \    cidr_blocks  = [\"0.0.0.0/0\"]\n}\ningress {\n    from_port    = 8600\n \
    \   to_port      = 8600\n    protocol     = \"tcp\"\n    cidr_blocks  = [\"0.0.0.0/0\"\
    ]\n}\negress {\n    from_port        = 0\n    to_port          = 0\n    protocol\
    \         = \"-1\"\n    cidr_blocks      = [\"0.0.0.0/0\"]\n    prefix_list_ids\
    \  = []\n}\ntags = {\n    Name = \"${var.owner}-security-group\"\n}\n}\n```\n\n"
