  mdcn: '


    那么，我们该如何处理这个不祥的状态文件呢？好吧，在本章的第一部分，我们谈到了分布式 Consul KV 存储可用的功能。只要我们能将该状态文件保持在可管理的大小，少于
    512 KB，我们就可以将该状态文件保存在 Consul KV 存储中。这实际上就是我们在 terraform 块内的后端配置子块中所做的操作。这不仅为我们提供了一个可以使用
    ACL 保护的分布式存储位置，还提供了对状态文件更改的指示（还记得 KV 响应中的 ModifyIndex 值吗）。这要求我们保持状态相对简单，但我们无论如何都应该这样做，将用于
    CTS 的 Terraform 脚本仅聚焦于我们需要管理的特定基础设施。例如，如果我有 10 台虚拟机、一个 Kubernetes 集群和一个负载均衡器，我应该只将负载均衡器的基础设施代码作为
    CTS 的一部分包含在内。


    所有这些关于状态和 Terraform 配置的讨论可能看起来过分，但这里的细节不容低估。总结一下，仅将我们的 Terraform 代码聚焦于服务目录导致更改所需的内容，可以实现以下目标：


    - 利用 Consul KV 存储实现集中且受保护的存储 – 我们已经可以使用 Consul，为什么不将其用于此目的呢？

    - 状态文件中的敏感信息保持在最低限度，仅与 CTS 管理的基础设施相关。

    - 通过 CTS 启动的更改更快。对于由于大型基础设施定义而导致的大型状态文件，Terraform 处理更改所需的时间会更长。


    我们接下来要处理的块是 task 块。现在我们终于可以定义我们希望 CTS 实际做什么了！task 块标识了将作为服务目录更改结果而执行的 Terraform
    模块。对于我们的目的，该模块非常简单，只打印出服务节点和相关信息。然而，Terraform 模块可以在基础设施管理的范围内做几乎任何事情！Terraform
    模块可以类比为应用程序中的一个函数，为一个特定目的而构建。一些模块可能相当庞大（例如创建整个生产 HashiCorp Vault 系统），但我们已经看到我们希望保持
    Terraform 操作的聚焦。因此，我们希望使用非常具体的模块，例如在负载均衡器中填充客户端节点。Terraform 仓库，https://registry.terraform.io/，提供了大量可供查阅的示例模块。


    由于这是我们第一次运行 CTS，几项操作将在后台发生。首先，CTS 将为 Terraform 状态文件准备 Consul 后端。我们也可以在 Consul
    系统 KV 存储中看到这一点：


    ![](img/52479dafaefba00517c48a137e037b7e_212_0.png)

    **图 7.3 – KV 存储中的 CTS**


    在 CTS 的文件夹中，我们可以看到，如图 7.4 所示，我们有一个特定于已配置的 `find-httpd-nodes` 任务的状态文件。请注意，每个任务，因此每个模块，都会创建自己的状态文件，并将这些文件存储在此处
    Consul 中：


    ![](img/52479dafaefba00517c48a137e037b7e_212_1.png)

    **图 7.4 – 任务状态文件存储**


    如果我们查看我们的目录，我们还可以看到 CTS 已为我们下载了 Terraform 二进制文件，但我们也拥有这个名为 `sync-tasks` 的文件夹。这里就是魔法的发生之处。


    ![](img/52479dafaefba00517c48a137e037b7e_213_0.png)

    **图 7.5 – CTS 创建的内容**


    在 `sync-tasks` 文件夹中，我们将为 CTS 被命令的每个任务拥有一个文件夹。对于我们来说，我们只有 `find-httpd-nodes`，这是我们任务的名称。在该文件夹中，我们有一堆
    Terraform 代码！更重要的是，我们有一个 `terraform.tfvars.tmpl` 文件。如果你观察该文件，你会发现它看起来很像一个 Consul
    Template 文件。如果你继续使用 HashiCorp 产品，请习惯这些模板文件。它们非常有用，并且无处不在！


    当 CTS 运行 时，该模板文件用于创建一个新的 `terraform.tfvars` 文件，即实际保存用于 Terraform 代码的变量的文件。到目前为止，我们所做的只是一个检查操作；基本上，使用
    CTS 的一个任务来查看它会做什么，但实际上并不执行它。这些由 CTS 创建的变量被输入到随后用于相应调整基础设施的 Terraform 代码中。


    现在我们运行了命令，我们可以看到我们的 `httpd.txt` 文件已被创建。该文件是在任务的目录中创建的，我们可以通过发出以下命令查看结果：


    ```

    $ cat /home/ubuntu/sync-tasks/find-httpd-nodes/httpd.txt

    ```


    现在我们拥有了运行 httpd 服务的所有四个节点，以文本文件形式提供。这本身并不令人兴奋，直到我们看到使之特别的不是文件本身；而是它是用 Terraform
    创建的！现在几乎可以在 Terraform 模块中执行的任何操作，都可以使用 Consul 提供的服务目录信息自动执行！当我们将服务作为守护进程运行（不是恶魔）时，CTS
    将持续监控服务目录中 httpd 的更改，并利用 Terraform 相应地更新基础设施。


    ## 总结


    让我们回顾一下我们在这里做了什么。Consul 系统有潜力保存有关您网络中服务的丰富信息。那信息就是力量！当然，这是安全连接的力量，但我希望通过本章，你已经看到
    Consul 的力量可以远远超出其 gossip 角落的象征性围墙。我们已经看到 KV 系统如何用于存储和分发配置信息。我们学习了如何构建 Consul 监视，以使服务更改通知其他组件进行配置管理。最后，我们看到了
    Consul 如何与 Terraform 互操作，使用 Consul-Terraform-Sync 能力，基于 Consul 的服务知识虚拟调整任何基础设施。现在是时候坐下来，拿起你喜欢的饮品，梦想
    Consul 能为你做的一切！


    ## 8 我们接下来去哪里？


    我想用最后一章来结束本书，希望能将你进一步推向利用 Consul 系统进行服务发现、服务网格和自动化的世界。这本书只是个开始，我希望它既有趣又富有信息量。


    ### Consul Associate 认证


    如果你想继续提升，我推荐 **HashiCorp 认证计划**，特别是 Consul Associate 考试：https://www.hashicorp.com/certification/consul-associate。


    在此页面上，你将找到考试的学习指南链接，以及关于注册考试的信息。虽然本书并非 intended 作为考试的学习指南，但它应该能让你达到大部分要求。


    ### HashiCorp Cloud Platform


    如果你准备启动服务，但又不想承担 Consul 系统的运维管理，我强烈建议你注册 HashiCorp Cloud Platform。设置服务器和保护它所需的所有工作都已为你完成。入门非常容易，只需在以下网址注册即可：https://cloud.hashicorp.com/。


    流程的一部分要求你创建自己的组织，一旦完成，你就可以访问 HashiCorp Cloud Platform。


    ![](img/52479dafaefba00517c48a137e037b7e_218_0.png)

    **图 8.1 – HashiCorp Cloud Platform**


    创建虚拟网络需要几分钟时间，但一旦完成，我们就有创建集群的选项。我们可以选择部署 Vault 集群或 Consul 集群。由于这是一本关于 Consul 而非
    Vault 的书，让我们继续创建一个 Consul 集群。


    ![](img/52479dafaefba00517c48a137e037b7e_220_0.png)

