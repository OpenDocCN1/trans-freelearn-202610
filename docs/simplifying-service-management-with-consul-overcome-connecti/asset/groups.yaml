  mdcn: "\n\n## 前言\n\n你是否曾花费数小时排查网络问题，最后却发现应用程序的网络地址已经变了？或者，你是否因为更新防火墙或负载均衡器花费数周时间，而不得不躲避愤怒项目经理扔来的咖啡杯？也许你的工程团队正在为服务之间的端到端加密而苦苦挣扎，每个项目都在重新发明轮子，或者把安全性寄托在网络周围虚构的边界上。如果这些情况听起来很熟悉，那么\
    \ HashiCorp Consul 或许正是你解决烦恼的答案！\n\nConsul 为服务发现、网络自动化和安全服务通信提供了一种与平台无关的解决方案。本书将深入探讨\
    \ Consul 架构的基础，解释服务器和客户端如何运作。我们将在 Amazon Web Services 中构建自己的 Consul 系统，并保护系统免受爬虫和窃听者的攻击。在集群建立后，我们将开始向系统中部署服务，并展示\
    \ Consul 如何发现和监控这些服务。我们将讨论多种共享服务信息的方法。不过，我们始终关注的是 Consul 如何利用这些信息动态调整网络基础设施，并促进注册服务之间的安全连接。最后，我们将快速浏览\
    \ HCP Consul，这是 HashiCorp 云平台上提供的软件即服务（SaaS）解决方案。\n\n## 本书面向的读者\n\n任何对动态混合云环境中的网络管理挑战与解决方案感兴趣的系统架构师或\
    \ DevOps 工程师。在讨论设备通信和连接以及网络协议栈各层时，具备基础网络知识会有所帮助。了解 Terraform 将是有益的，因为我们将使用 Terraform\
    \ 来创建和管理我们的系统，但这不是必需的。\n\n## 本书涵盖的内容\n\n*第1章，Consul 概览——操作与用例，* 以 Consul 的简短概述和对三个主要\
    \ Consul 用例的高层理解开篇。\n\n*第2章，架构——它是如何运作的？* 向我们展示了服务器和代理如何运作和通信，现在我们对“为什么使用 Consul”有了基本的理解。\n\
    \n*第3章，保持安全，笨蛋，并保护你的集群！* 在了解了 Consul 的运作方式后，探讨如何保护整个系统。我们将学习如何将零信任应用于我们所有的应用程序。\n\
    \n*第4章，数据中心（而非贸易）联盟，* 探讨了 Consul 如何促进集群跨多个环境扩展以实现全球统治，因为在全球和不断变化的世界中，我们的应用程序必须超越数据中心的地理边界。\n\
    \n*第5章，小波比丢失了她的服务，* 探讨了 Consul 如何不仅发现服务——服务发现是 Consul 运作的基础——而且在这些服务中，它还监控并共享服务状态信息。\n\
    \n*第6章，连接四个或更多，* 探讨了在了解我们的服务及其位置的情况下，如何使用 Consul 来识别和保护服务之间的通信。\n\n*第7章，激活我，*\
    \ 涵盖了如何使用 Consul 的服务信息简化我们的网络基础设施管理，Consul 之外的整个世界都可以利用其动态服务发现。\n\n*第8章，我们现在去哪里？*\
    \ 提供了一些继续学习和使用 Consul 的途径。我们介绍了 HashiCorp 的 Consul 助理认证（Consul Associate Certification）认证计划以获得更多知识。此外，我们还将向您展示如何注册\
    \ HashiCorp 托管的 Consul 解决方案，从而在不承担管理集群本身开销的情况下采用 Consul。\n\n## 充分利用本书\n\n在本书中，我们将使用\
    \ Terraform 来构建和管理 Consul 系统，虽然了解 Terraform 会有所帮助，但并非必需。我们将逐步讲解 Terraform 代码及其功能，以创建和管理\
    \ Consul 系统。本书中的大部分操作都使用 bash 命令行。熟悉常见的 bash 操作以及使用 emacs 或 vi 编辑文本文档会很有帮助。\n\n\
