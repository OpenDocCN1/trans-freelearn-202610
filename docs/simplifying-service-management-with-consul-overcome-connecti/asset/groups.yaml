  - '[PAGE 90]


    Here, the bearer of the associated token to this policy would be able to write
    to any hostname starting with `ip-192`, but would only have read-only access to
    any hostname starting with `ip`.


    As I hope you can see, the flexibility of the ACLs within Consul allows us to
    define and enforce incredibly specific rules on our system. We can apply a variety
    of controls to exact areas of the Consul functionality. Some of these rules are
    crucial for any functional system (such as node or agent types), but even those
    should be controlled so that they''re only applied to specific segments (hostnames,
    domains, and so on). Next, we''re going to look at what we can do to manage the
    humans that have access to our Consul cluster and track what they are doing, just
    like Big Brother.


    As we have already seen, the ability to use Terraform to create and manage infrastructure
    simplifies a lot of this complexity. When you start working with Consul clusters
    containing hundreds, thousands, and tens of thousands of nodes (and yes, clusters
    of that size do exist), the convenience of using infrastructure as code becomes
    more of a necessity. If you''re tired of reading and want to see how all these
    security features come together, just hang tight – we''ll get there soon. First,
    we need to take a quick look at audit logging within the Consul system, a critical
    component for any enterprise.


    # Role up your identity


    As part of enabling production for a service, we need to work with who is going
    to access the system, and what they can do. This is typically referred to as **Role-Based
    Access Control**, or **RBAC**. We also want to be able to maintain an audit trail
    for the system. This last part is becoming increasingly important as we get out
    of that trusted walled garden network and into the cloud. I can''t tell you how
    many times, even in a controlled environment, I had to go back and figure out
    what changed and when that broke my system! In the interests of full disclosure,
    an Enterprise-level license for Consul is required to implement this level of
    functionality.


    The actual process of logging in to the Consul system can certainly be managed
    by using ACLs and then treating any human like a machine by giving them their
    own particular access token. However, these tokens aren''t as simple as Jean Valjean''s
    24601. So, inevitably, somebody will end up writing their token down on a sticky
    note attached to their laptop, or better yet, emailing it to their friends and
    family with the latest cat meme. Furthermore, this only works until you have some
    engineer (could it be you?) standing up in front of the company exclaiming *I
    am not a number, I am a free man!* Cue the maniacal laugh emanating from the offices
    of upper management. A much better solution is to tie Consul into some centralized
    method of authentication and authorization. For this, Consul Enterprise utilizes
    one of the growing standards for centralized authentication and authorization
    – **OpenID Connect (OIDC)**.'
