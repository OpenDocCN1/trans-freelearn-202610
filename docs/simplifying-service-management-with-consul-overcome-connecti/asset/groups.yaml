  md: "\nWhen I was a young lad, I would on occasion participate in activities that\
    \ could be considered questionable at times. Luckily, we weren’t all carrying\
    \ computers with GPS trackers in our pockets; however, my parents had the phone\
    \ numbers for the houses of all of my friends. If I was going to Mike’s house,\
    \ my parents would know how to reach me by way of the phone number associated\
    \ with Mike’s house. However, when they called, there was no control over who\
    \ would answer. Among our friends, we were able to have some fun with this level\
    \ of ambiguity. For example, when our friend Gina would call Mike’s house, I might\
    \ answer the phone. Now we were all very close, but even now sometimes it can\
    \ be difficult to identify somebody by their voice over the telephone. It was\
    \ a lot more challenging then, with lower quality audio on landlines! So, here\
    \ I was having an active conversation with Gina; however, she believed she was\
    \ speaking with Mike. We can continue this practice today; however, it is more\
    \ difficult to pick up somebody’s mobile phone than it was to just lift the handset\
    \ in their house. In this analogy, Gina and I are the applications, and Mike’s\
    \ house is a host. Gina was trying to reach Mike by way of his house phone number,\
    \ but simply by being there, I was able to impersonate Mike. The phone number\
    \ may be trusted and clearly identified with the host, but that doesn’t ensure\
    \ the identity or the security of the application.\n\nThis story demonstrates\
    \ how simply assuming a **layer 4 address** as the identity of any application\
    \ imposes risk. In a private data center, when the house was securely locked with\
    \ guards placed at the door, identification by address wasn’t that unreasonable.\
    \ However, in the environment of the public cloud, the existence of legitimate\
    \ and illegitimate address masking, and especially in any sort of migratory workload\
    \ environment (such as Kubernetes), the address alone just isn’t good enough.\
    \ So, let’s look at how we can solve this problem using tunnels.\n\n## Tunneling\
    \ to safety\n\nThe concept of network tunnels and **Virtual Private Networks (VPNs)**\
    \ is nothing new. However, in every one of those instances, the connection is\
    \ based on the layer four address of the components involved. We can connect our\
    \ application machines using a series of point-to-point VPNs, but that isn’t going\
    \ to alleviate the need to identify and secure the **application**. In reality,\
    \ the use of VPNs actually increases the need for application identity instead\
    \ of relying on simply the address. However, we can still look at the VPN as a\
    \ model for where we want to be.\n\nWhen you establish a VPN in most cases, there\
    \ is a software application that connects to some remote site or service. When\
    \ that connection is made, your device now has a new IP address, valid on the\
    \ destination network, and all machine traffic flows through that connection.\
    \ The beauty of VPNs is that the information traversing the VPN is encrypted and\
    \ secured, from the VPN client to the VPN server. This was, and continues to be,\
    \ a great way to protect your traffic from prying eyes. The use of VPNs historically\
    \ has been primarily for enterprise networks. Lately, many people today utilize\
    \ VPNs to not only encrypt their traffic, but also to hide their layer four address\
    \ identity. We've already determined that for true secure operations, we need\
    \ to validate the identity of the application, so the use of a VPN may actually\
    \ hinder, rather than help, that effort.\n\n![](img/52479dafaefba00517c48a137e037b7e_173_0.png)\n\
    \nFigure 6.4 – VPN traffic pattern\n\nNow, I'm not saying that VPNs don't have\
    \ their place in this world. When you need to connect machines in a secure manner,\
    \ they provide a vital function. However, we aren't talking about connecting machines;\
    \ we are connecting our applications. That being said, the concept of the VPN\
    \ extends nicely if we can bring that connection up a layer to the application.\
    \ This is exactly what the Consul Service Mesh provides via Consul Connect.\n\n\
    The Consul Connect functionality connects identity-verified applications and encrypts\
    \ the traffic between those applications. We've already seen in Chapter 3, Keep\
    \ It Safe, Stupid, and Secure Your Cluster! how the Consul server cluster verifies\
    \ the identity of the agents and encrypts the RPC traffic utilizing mutual TLS\
    \ (mTLS). Consul Connect allows us to extend that same functionality to every\
    \ Consul managed service. Let's take a few minutes and revisit Consul and mTLS.\n\
    \nRemember the days of old, when we were having fun with certificates in *Chapter\
    \ 3, Keep It Safe, Stupid, and Secure Your Cluster!* As part of that process,\
    \ we were utilizing the Consul server as the **certificate authority (CA)** to\
    \ sign and manage the certificates (it's an authority, what else would it do?).\
    \ In an effort to reduce complexity, we were using common certificates for each\
    \ of the three servers. Additionally, all client agents were using a common certificate.\
    \ At the time it was mentioned that in a production environment, each Consul agent\
    \ should have its own unique certificate. When one agent receives a public certificate\
    \ from another, that certificate provides the **identity** of the sender. We know\
    \ we can **trust** that identity, because the certificate is signed by some authoritative\
    \ source. These certificates not only provide the identity, but also the keys\
    \ necessary for the encryption and decryption of the messages between the agents.\
    \ If this method of mTLS is secure enough to validate Consul agents and encrypt\
    \ the traffic, why not use it for the services that Consul manages?\n\nWith Consul\
    \ Connect, each service is assigned a unique certificate. As you can see, the\
    \ use of certificates is quite important when working with Consul. Not only do\
    \ we have certificates for the agents to enable secure agent communication, but\
    \ we also have certificates for the services. All of these certificates can be\
    \ quite challenging to manage, but the benefit of true application identity and\
    \ encryption far outweighs that challenge. Luckily, much like in *Chapter 3, Keep\
    \ It Safe, Stupid, and Secure Your Cluster!*, we are able to utilize Consul as\
    \ the CA for our applications. Consul does support Vault as the CA as well; however,\
    \ for our purposes, we are going to focus on utilizing Consul. Regardless of who\
    \ the CA is, Consul can orchestrate the rotation and distribution of the certificates,\
    \ which can dramatically simplify the operational aspect of Consul. Unlike *Chapter\
    \ 3, Keep It Safe, Stupid, and Secure Your Cluster!*, however, we want our applications\
    \ to utilize the certificates for identification and encryption. Unfortunately,\
    \ many applications have not been developed to accommodate special certificates\
    \ and encryption. There are development libraries for custom application integration;\
    \ however, proxy servers are wonderfully suited for this purpose and require no\
    \ additional development.\n\nThis shows us that our Python-based web server is\
    \ listening on port 8080, with the address `0.0.0.0`. This value represents all\
    \ available addresses and interfaces. With that configuration, any device that\
    \ can reach this machine can access port 8080. To increase security, we're going\
    \ to change how we run that `httpd` server for this exercise:\n\n```\n```bash\n\
    nohup python3 -m http.server 8080 --bind 127.0.0.1 &\n```\n```\n\nWith the additional\
    \ `bind` configuration flag, we are telling the Python `http` server to **only**\
    \ listen on `127.0.0.1`, which is the localhost of the machine. To validate this,\
    \ we can run our handy dandy `netstat` command again, providing us with the following\
    \ result:\n\n```\n```text\ntcp        0      0 127.0.0.1:8080        0.0.0.0:*\n\
    LISTEN     7954/python3\n```\n```\n\nWith the server listening only on the localhost\
    \ address, no outside application can access the server. Unless, of course, they\
    \ start getting meshy. So, now I have to ask, are you ready to get meshy with\
    \ me?\n\nWithin the repository folder for *Chapter 6, Connect Four or More*, I've\
    \ placed a new `httpd.json` file, as well as a `curl.json` file. These are going\
    \ to represent our new meshy services, and as part of the Terraform build, these\
    \ files will be placed on the Consul clients.\n\nThe `httpd.json` service definition\
    \ hasn't changed much from our original definition, with one main exception. We\
    \ now have a connect configuration block, which identifies that this service is\
    \ going to utilize a sidecar for connectivity. That sidecar is the proxy server.\n\
    \n## httpd.json\n\n```\n```json\n{\n    \"service\": {\n        \"name\": \"httpd\"\
    ,\n        \"id\": \"httpd-1\",\n        \"tags\": [\n            \"python-server\"\
    \n        ],\n        \"port\": 8080,\n        \"connect\": {\n            \"\
    sidecar_service\": {}\n        }\n    },\n```\n```\n"
  mdcn: "\n当我还是个少年时，我有时会参与一些时不时可能被认为有问题的事情。幸运的是，那时我们并不是所有人兜里都揣着带 GPS 跟踪器的电脑；不过，我父母有我所有朋友家的电话号码。如果我要去迈克家，我父母就能通过迈克家的电话号码联系到我。然而，当他们打电话时，无法控制是谁接听。在我们的朋友之间，我们可以利用这种模糊性找点乐子。比如，当我们的朋友吉娜给迈克家打电话时，可能是我接的。虽然我们都很亲近，但即使在现在，有时也很难通过电话里的声音辨认出某人。而那时（固定电话音质更差）就更有挑战性了！所以，我正和吉娜聊得热火朝天，但她却以为自己在和迈克通话。这种把戏今天也能玩，只是要拿起某人的手机比在他们家拿起电话听筒更难。在这个类比中，吉娜和我就是应用程序，迈克的家就是主机。吉娜试图通过迈克家的电话号码联系迈克，但我只要在那里，就能冒充迈克。电话号码也许可信，并且明确地与主机绑定，但并不能保证应用程序的身份或安全。\n\
    \n这个故事表明，仅仅假设 **第 4 层地址** 是任何应用的身份会带来风险。在私有数据中心，当房子被牢牢锁住、门口有守卫时，按地址识别并没有那么不合理。然而，在公有云环境中，存在合法和非法的地址伪装，尤其是在任何类型的迁移型工作负载环境（如\
    \ Kubernetes）中，仅靠地址是远远不够的。那么，让我们看看如何通过隧道来解决这个问题。\n\n## 隧道通往安全\n\n网络隧道和**虚拟专用网络（VPN）**的概念并不新鲜。然而，在所有这些实例中，连接都基于所涉及组件的第\
    \ 4 层地址。我们可以通过一系列点对点 VPN 来连接应用机器，但这并不能缓解对**应用**进行识别和保护的需求。实际上，使用 VPN 反而增加了对应用身份的需求，而不是单纯依赖地址。不过，我们仍然可以把\
    \ VPN 视为我们想要达到目标的一个模型。\n\n在大多数情况下，当你建立 VPN 时，会有一个软件应用程序连接到某个远程站点或服务。连接建立后，你的设备会获得一个新的\
    \ IP 地址，该地址在目标网络上有效，所有机器流量都经过该连接流动。VPN 的美妙之处在于，从 VPN 客户端到 VPN 服务器之间传输的信息都经过加密和安全保护。这过去是、现在依然是保护流量不被窥探的好方法。历史上，VPN\
    \ 的使用主要面向企业网络。如今，许多人使用 VPN 不仅是为了加密流量，也是为了隐藏他们的第 4 层地址身份。我们已经确定，要实现真正安全的操作，需要验证应用程序的身份，因此使用\
    \ VPN 实际上可能阻碍而不是帮助这项工作。\n\n![](img/52479dafaefba00517c48a137e037b7e_173_0.png)\n\
    \n图 6.4 – VPN 流量模式\n\n现在，我并不是说 VPN 在这个世界上没有用武之地。当你需要以安全的方式连接机器时，它们提供了至关重要的功能。然而，我们讨论的不是连接机器，而是连接我们的应用。话虽如此，如果我们能把连接向上提升一层到应用层，VPN\
    \ 的概念就能很好地延伸。这正是 Consul Service Mesh 通过 Consul Connect 所提供的。\n\nConsul Connect\
    \ 功能将经过身份验证的应用连接起来，并加密这些应用之间的流量。我们已经看到，在第 3 章，保持安全，笨蛋，并保护好你的集群！中，Consul 服务器集群如何验证代理身份，并利用相互\
    \ TLS（mTLS）加密 RPC 流量。Consul Connect 使我们能够将同样的功能扩展到每个由 Consul 管理的服务。让我们花几分钟重新回顾一下\
    \ Consul 和 mTLS。\n\n还记得那些旧日时光吗？我们在 *第 3 章，保持安全，笨蛋，并保护好你的集群！* 中玩转证书。在那过程中，我们使用\
    \ Consul 服务器作为**证书颁发机构（CA）** 来签发和管理证书（它是权威机构，还能做什么呢？）。为了降低复杂性，我们为三台服务器使用了通用证书。此外，所有客户端代理都使用一个通用证书。当时提到，在生产环境中，每个\
    \ Consul 代理都应该拥有自己唯一的证书。当一个代理收到另一个代理的公共证书时，该证书提供了发送者的**身份**。我们知道可以**信任**这个身份，因为证书是由某个权威来源签名的。这些证书不仅提供了身份，还提供了代理之间消息加解密所需的密钥。如果这种\
    \ mTLS 方法足以安全地验证 Consul 代理并加密流量，为什么不把它用于 Consul 管理的服务呢？\n\n使用 Consul Connect，每个服务都会分配一个唯一证书。如你所见，证书的使用对于\
    \ Consul 工作至关重要。我们不仅有用于代理之间安全通信的证书，还有用于服务的证书。所有这些证书的管理可能相当具有挑战性，但真正的应用身份和加密所带来的好处远超这些挑战。幸运的是，与\
    \ *第 3 章，保持安全，笨蛋，并保护好你的集群！* 非常相似，我们可以使用 Consul 作为我们应用程序的 CA。Consul 也支持使用 Vault\
    \ 作为 CA，但出于我们的目的，我们将专注于使用 Consul。无论 CA 是谁，Consul 都可以编排证书的轮换和分发，这能极大地简化 Consul\
    \ 的运维工作。然而，与 *第 3 章，保持安全，笨蛋，并保护好你的集群！* 不同的是，我们希望应用程序利用这些证书来进行身份识别和加密。不幸的是，许多应用程序并不是为支持特殊证书和加密而开发的。有用于自定义应用集成的开发库，但代理服务器非常适合这一目的，并且不需要额外的开发。\n\
    \n这表明我们的基于 Python 的 Web 服务器正在监听 8080 端口，地址为 `0.0.0.0`。该值代表所有可用的地址和接口。在这种配置下，任何能够访问这台机器的设备都可以访问\
    \ 8080 端口。为了增强安全性，我们要在本次练习中更改运行该 `httpd` 服务器的方式：\n\n```bash\nnohup python3 -m\
    \ http.server 8080 --bind 127.0.0.1 &\n```\n\n通过额外的 `bind` 配置标志，我们告诉 Python `http`\
    \ 服务器**只**监听 `127.0.0.1`，也就是机器的本地回环地址。为了验证这一点，我们可以再次运行我们得心应手的 `netstat` 命令，得到以下结果：\n\
    \n```text\ntcp        0      0 127.0.0.1:8080        0.0.0.0:*\nLISTEN     7954/python3\n\
    ```\n\n由于服务器只监听本地回环地址，任何外部应用程序都无法访问该服务器。当然，除非它们开始变得“网格化”。所以，现在我要问你，准备好和我一起“网格化”了吗？\n\
    \n在第 *6 章，连接四个或更多* 的存储库文件夹中，我放置了一个新的 `httpd.json` 文件，以及一个 `curl.json` 文件。它们将代表我们新的网格化服务，并且作为\
    \ Terraform 构建的一部分，这些文件将放在 Consul 客户端上。\n\n`httpd.json` 服务定义与我们的原始定义相比变化不大，只有一个主要例外。我们现在有一个\
    \ connect 配置块，它标识该服务将利用一个 sidecar 进行连接。这个 sidecar 就是代理服务器。\n\n## httpd.json\n\n\
    ```json\n{\n    \"service\": {\n        \"name\": \"httpd\",\n        \"id\":\
    \ \"httpd-1\",\n        \"tags\": [\n            \"python-server\"\n        ],\n\
    \        \"port\": 8080,\n        \"connect\": {\n            \"sidecar_service\"\
    : {}\n        }\n    },\n}\n```\n"
