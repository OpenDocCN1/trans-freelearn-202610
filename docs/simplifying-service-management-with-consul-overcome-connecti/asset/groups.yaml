    \nAs we've now covered the usage of KV storage, along with the use of Consul Template,\
    \ let's move on and take a look at utilizing Consul watches and handlers as another\
    \ method of automating the configuration of third-party components.\n\n# Watching\
    \ your handlers\n\nWay back in *Chapter 5, Little Bo Peep Lost Her Service*, where\
    \ Little Bo Peep lost her service, we touched on the functionality of Consul watches\
    \ and handlers. Recall that a Consul **watch** observes any number of parameters\
    \ within Consul, and based on value changes, can execute a **handler** to perform\
    \ some function. Within *Chapter 5, Little Bo Peep Lost Her Service*, we focused\
    \ on being able to watch the status of a service, in order to inform a third party\
    \ about service health. We can use this same functionality, but instead of watching\
    \ service status, we can watch the status of a parameter within the KV store.\n\
    \nFor example, if we wanted to watch our key, using the direct command line, we\
    \ would execute the following:\n\n```\n$ consul watch -type=key -key=son/seventh/gift\n\
    {\n    \"Key\": \"son/seventh/gift\",\n    \"CreateIndex\": 194,\n```"
  md: "\nInteracting with the Consul KV system is quite simple. Much like everything\
    \ else we've done with Consul, we can utilize the command line, the API, or the\
    \ web interface. The path to the key and value is represented as, well, a path,\
    \ not unlike the folder and file structure that we all know and love. This not\
    \ only lends itself well to the organization of the data but also facilitates\
    \ logical path based API calls, which are all REST-based. We're going to walk\
    \ through these actions, and if you would like to follow along, all of the code\
    \ for creating the image and Consul system is located within the GitHub repository\
    \ we've been using. Of course, there is a new folder for this chapter at `https://github.com/PacktPublishing/Consul-Up-and-Running/tree/main/ch7`.\n\
    \nWe can use a previous image that we've built, however, this new build includes\
    \ some additional functionality that we'll be using in later sections of this\
    \ chapter. Therefore, I would recommend you create an updated image (`$github_root/ch7/Image-Creation`)\
    \ as we've done in previous chapters.\n\nWith our new Consul system built and\
    \ ready to go, let's create a couple of values in our KV store. We're going to\
    \ be playing with environment variables in order to ensure that we are hitting\
    \ different Consul nodes, so please follow along closely. As an example, I'll\
    \ be referring to the following Terraform output:\n\n## Terraform output\n\n```\n\
    Outputs:\n\n\nCONSUL_HTTP_ADDR = \"http://3.128.180.154:8500\"\nCTS_IP = \"3.141.25.114\"\
    \nConsul_Client_IPs = [\n    \"18.117.222.65\",\n    \"3.17.161.19\",\n    \"\
    18.222.124.50\",\n    \"18.118.47.132\",\n]\nConsul_Server_IPs = [\n    \"18.222.216.65\"\
    ,\n    \"3.128.180.154\",\n    \"18.117.157.22\",\n]\n```\n\n```\n\"LockIndex\"\
    : 0,\n\"Key\": \"son/seventh/gift\",\n\"Flags\": 0,\n\"Value\": \"Y2hxaXJ2b3lhbmN1\"\
    ,\n\"CreateIndex\": 194,\n\"ModifyIndex\": 194\n}\n]\n```\n\nBut wait, that value\
    \ isn't what we entered! You are correct, this is the base64 encoded value that\
    \ we've seen in other areas of Consul. This allows more complex data within the\
    \ values of our KV store to be accessed programmatically. If we want multiple\
    \ values to be returned within a path, we can set a recurse flag on the request:\n\
    \n```\n$ curl http://18.222.124.50:8500/v1/kv/son/\\?recurse=TRUE | jq\n```\n\n\
    Let's take a look at some of the other values that are provided as part of this\
    \ output:\n\n- **LockIndex** – Using Consul Sessions, we are able to lock access\
    \ to particular parameters within the KV store to prevent inadvertent overwriting\
    \ or conflicts.\n- **Key** – This is the full path to the key from the root of\
    \ the KV store.\n- **Flags** – Defaulting to 0, this parameter provides the ability\
    \ to assign an unsigned integer to the value entry. This value is opaque to Consul\
    \ but may help provide additional information (such as version) to an extensive\
    \ KV implementation.\n- **Value** – This is the value of the key encoded to base64.\n\
    - **CreateIndex** – Here we have a numerical value that provides some insight\
    \ into when the value was created in relation to other keys or updates.\n- **ModifyIndex**\
    \ – This is a good value to watch as part of the output, as an intelligent state\
    \ machine can determine whether the value has changed since the last time it was\
    \ queried.\n\nThis information is always returned via the API, however, if you\
    \ would like to see this detail within the command-line output, we can use the\
    \ `detailed` flag:\n\n|  |  |\n|---|---|\n| `$ consul kv get -detailed son/seventh/gift`\
    \ |  |\n| CreateIndex | 194 |\n| Flags | 0 |\n| Key | son/seventh/gift |\n| LockIndex\
    \ | 0 |\n| ModifyIndex | 327 |\n| Session | - |\n| Value | `clairvoyance2` |\n\
    \nNote that I updated the value, and the ModifyIndex parameter recognized this\
    \ change.\n\nWe should note here that writing passwords and sensitive information\
    \ to the storage might not be the best idea in the world. For secrets management,\
    \ we really should be utilizing a world-class secrets manager such as HashiCorp\
    \ Vault. That being said, there may be information written into this storage that\
    \ requires some level of access control. Recall that through our ACL system, we\
    \ are able to secure paths and functions within Consul. By combining our ACL system\
    \ with the KV store, we can create a distributed storage system for each application\
    \ and ensure that only that application (with the proper ACL token) can access\
    \ the data store.\n\nThis is wonderful! Using the KV store within Consul, we can\
    \ write all sorts of information to the storage, and make it available to specific\
    \ consumers of the data or applications. *But Rob, my applications have no idea\
    \ about the Consul API or command line, and you’re out of your mind if you think\
    \ we’re going to adjust our development path for that.* Well, you are correct,\
    \ I am out of my mind, but that has nothing to do with Consul. Allow me to introduce\
    \ you to Consul Template.\n\n## Consul Template\n\nThe application of Consul Template\
    \ may be one of my favorite things about Consul. However, it isn’t just restricted\
    \ to Consul, as Vault implementations can utilize the same functionality. With\
    \ Consul Template, configuration files can be populated by Consul directly utilizing\
    \ parameters as if it was, well, a template. I guess you probably saw that coming.\n\
    \nThe functionality of Consul Template isn't embedded within Consul itself, however,\
    \ so it must be downloaded and executed as its own service. The binary (`consul-template`)\
    \ is available at the HashiCorp releases website if you would like to download\
    \ it yourself, however, when we built new images for this chapter, installation\
    \ of the Consul Template binary was part of the process (`https://releases.hashicorp.com/consul-template/`).\n\
    \nAlso, as part of this build, I've created a very simple template file and placed\
    \ it in the `/tmp` directory. This template file is a very simple text file and\
    \ utilizes the information that we've populated within our KV store that identifies\
    \ the gift of the Seventh Son of a Seventh Son:\n\n### SeventhSon.tpl\n\n```\n\
    Seventh Son of a Seventh Son is a story about a young boy born\nwith the gift\
    \ of {{ key \"/son/seventh/gift\" }}. It has been\npopularized in literary form\
    \ by Orson Scott Card, and musically\nby Iron Maiden through their epic album\
    \ of the same title.\n```\n\nWithin the template, we can see where Consul is directed\
    \ to insert the value for the `son/seventh/gift` key.\n\nIn order to utilize the\
    \ template and create a file, consul-template can be run manually. However, we're\
    \ talking about automating as much as we can through Consul's intelligence. Why\
    \ would we now resort to manual operations? So, instead of manually running consul-template,\
    \ we kicked off the application as a background operation as part of the `remote-exec`\
    \ operation performed when we created the infrastructure:\n\n```\nnohup sudo consul-template\
    \ -consul-addr=\\\"${self.private_ip}\\\"\n-template \\\"/tmp/SeventhSon.tpl:/etc/consul/seventh_son.txt\\\
    \",\n```\n\nThis command instantiates the consul-template application, identifying\
    \ the IP address to use to connect to the Consul service. For our infrastructure,\
    \ the consul-template function is running on the same machine as Consul, but it\
    \ can live elsewhere and still make use of Consul's data. We are telling consul-template\
    \ to load the template file `tmp/SeventhSon.tpl` and create a new text file (`/etc/consul/seventh_son.txt`)\
    \ with that template. As the application is running in the background, consul-template\
    \ will monitor the value for the identified key, and when that value is changed,\
    \ consul-template will update the target file as well. We can try this in our\
    \ own little environment.\n\nIf you've been playing along, you've already set\
    \ a value of `clairvoyance` for the `son/seventh/gift` key. If consul-template\
    \ is working as designed, we should already have our file created. To validate\
    \ SSH to one of the clients that are available, execute the following command:\n\
    \n```\n$ cat /etc/consul/seventh_son.txt\n```\n\nWe should see the text displayed\
    \ as specified in the template, with the value `clairvoyance` inserted:\n\n```\n\
    Seventh Son of a Seventh Son is a story about a young boy born\nwith the gift\
    \ of clairvoyance. It has been popularized in\nliterary form by Orson Scott Card,\
    \ and musically by Iron Maiden\nthrough their epic album of the same title.\n\
    ```\n\nLet's take a look at what happens to that file when we change the value.\
    \ Update the value of the `son/seventh/gift` key. Feel free to do this through\
    \ any of the methods we practiced previously. Once you've updated the value, check\
    \ the `seventh_son.txt` file again to see if your updated value has been reflected.\
    \ Now, we can imagine that this simple text file is a configuration file for an\
    \ application. Our templates can be as comprehensive as necessary to address a\
    \ multitude of configuration files, all managed dynamically and automatically\
    \ updated based on the values within our Consul KV store!\n\nIf your neurons are\
    \ firing with excitement, please keep it rolling! There is so much more that can\
    \ be done with Consul Template beyond the scope of what we've covered here. The\
    \ full documentation, and source code for the project, is also available on GitHub\
    \ at https://github.com/hashicorp/consul-template.\n\nAs we've now covered the\
    \ usage of KV storage, along with the use of Consul Template, let's move on and\
    \ take a look at utilizing Consul watches and handlers as another method of automating\
    \ the configuration of third-party components.\n\n## Watching your handlers\n\n\
    Way back in *Chapter 5, Little Bo Peep Lost Her Service*, where Little Bo Peep\
    \ lost her service, we touched on the functionality of Consul watches and handlers.\
    \ Recall that a Consul **watch** observes any number of parameters within Consul,\
    \ and based on value changes, can execute a **handler** to perform some function.\
    \ Within *Chapter 5, Little Bo Peep Lost Her Service*, we focused on being able\
    \ to watch the status of a service, in order to inform a third party about service\
    \ health. We can use this same functionality, but instead of watching service\
    \ status, we can watch the status of a parameter within the KV store.\n\nFor example,\
    \ if we wanted to watch our key, using the direct command line, we would execute\
    \ the following:\n\n```\n$ consul watch -type=key -key=son/seventh/gift\n{\n \
    \   \"Key\": \"son/seventh/gift\",\n    \"CreateIndex\": 194,\n```\n"
  mdcn: "\n\n与 Consul KV 系统交互非常简单。就像我们使用 Consul 的其他所有功能一样，我们可以利用命令行、API 或 Web 界面。键和值的路径表示为，嗯，就是一个路径，不像我们所熟知和喜爱的目录和文件结构那样。这不仅非常适合数据的组织，而且还便于基于逻辑路径的\
    \ API 调用，而所有这些调用都是基于 REST 的。我们将逐步介绍这些操作，如果你想跟随操作，所有用于创建镜像和 Consul 系统的代码都位于我们一直使用的\
    \ GitHub 仓库中。当然，本章有一个新的文件夹位于 `https://github.com/PacktPublishing/Consul-Up-and-Running/tree/main/ch7`。\n\
