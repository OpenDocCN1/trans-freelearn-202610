    configuration management. Lastly, we''ve seen how Consul interoperates with Terraform,
    using the Consul-Terraform-Sync capability, to virtually adjust any infrastructure
    based upon Consul''s service knowledge. Now it''s time to sit back with a beverage
    of choice, and dream of all of the things that Consul can do for you!


    ## 8 Where Do We Go Now?


    I wanted to leave you with one last chapter that will hopefully launch you further
    into the world of service discovery, service mesh, and automation utilizing the
    Consul system. This book was merely the start, and I hope it was something that
    you found both entertaining and informative.


    ### Consul Associate Certification


    If you would like to continue to the next level, I recommend the **HashiCorp Certification
    Programs**, specifically the Consul Associate Exam: https://www.hashicorp.com/certification/consul-associate.


    On this page, you will find links to study guides for the exam, as well as information
    about registering for the exam. Although this book wasn''t intended to be a study
    guide for the exam, it should get you most of the way there.


    ### HashiCorp Cloud Platform


    If you are ready to fire up services but you don''t want to take on the operational
    management of the Consul system, I strongly recommend signing up for the HashiCorp
    Cloud Platform. All of that work setting up the server and securing it is done
    for you. Getting started is really easy, just by signing up at the following URL:
    https://cloud.hashicorp.com/.


    Part of the process requires you to create your own organization, and once that
    is complete, you have access to the HashiCorp Cloud Platform.


    ![](img/52479dafaefba00517c48a137e037b7e_218_0.png)

    **Figure 8.1 – HashiCorp Cloud Platform**


    It takes a couple of minutes for the virtual network to be created, but once it
    is complete, we have the option to create a cluster. We have the option to deploy
    a Vault cluster, or a Consul cluster. As this is a book on Consul, and not Vault,
    let''s go ahead and create a Consul cluster.


    ![](img/52479dafaefba00517c48a137e037b7e_220_0.png)

    **Figure 8.3 – HashiCorp Cloud Platform option to deploy a Consul cluster**


    Now we get to fill in the parameters needed to create the Consul cluster. There
    really isn''t much to decide upon here, but starting with a small system and making
    it publicly accessible makes it a bit easier to connect. In production, special
    care should be taken regarding external connectivity to the cluster.

