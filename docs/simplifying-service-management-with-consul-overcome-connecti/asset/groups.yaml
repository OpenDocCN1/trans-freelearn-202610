    \ required for new versions, tags, and so on. Ideally, every time a new service\
    \ or application is released, a corresponding Consul service definition file will\
    \ accompany the application.\n\nAs that new application, or new version of an\
    \ existing application, is deployed, the service definition would be updated as\
    \ well. If you're using a simple orchestrator such as Nomad, it can manage the\
    \ corresponding service definition as part of the application definition and be\
    \ deployed automatically. However, in traditional systems where you are actively\
    \ selecting on which nodes the application is to run, whatever process is used\
    \ to push the application should also be pushing the corresponding service definition.\n\
    \nOnce the new definition is available, the associated Consul agent does require\
    \ a simple reload in order to recognize the adjusted configuration. Much like\
    \ most configurations, dynamic adjustments to the services aren't picked up automatically.\
    \ However, reloading the agent is quite simple, via the `consul reload` command,\
