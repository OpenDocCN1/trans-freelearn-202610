  - '[PAGE 86]


    +   - **Event**: This is specifically related to the ability to read and write
    Consul events. We won’t be covering events in this book, but they can be utilized
    to exercise custom actions based on changes within the Consul system, including
    service availability.

    +   - **Key/Value**: Control access to the distributed key/value store within
    Consul. Rules can apply to the ability to read, write, or list sets of keys and
    their associated values.

    +   - **Sentinel**: No relation to the incredible song by Judas Priest, the Sentinel
    rule allows us to write just about any rule possible based on the Consul structure.
    Sentinel is an Enterprise feature, and quite advanced, so we won’t be covering
    it in this book.

    +   - **Keyring**: This is one of the rule types that requires no variable to
    be applied, as it is specific to the keyring function. As the keyring is what
    controls the encryption key for the gossip protocol, access to this area should
    be tightly controlled.

    +   - **Node**: This is an important one. It controls node-level data such as
    the services available in the catalog and node health. This also operates as a
    filter for agent-level operations to the subset of cluster members permitted.

    +   - **Operator**: This is another rule type that requires no variable to be
    applied and addresses the operator-level operations within Consul, such as auto-pilot
    or Raft specifics. Like the keyring, access to this area should be tightly controlled.

    +   - **Prepared query**: Consul offers the ability to create templates that are
    useful for more complex service queries within the system, including node location,
    metadata, tags, and so on. We will not be covering prepared queries as part of
    this book.

    +   - **Service**: Here is another important one to understand. This rule type
    governs service-level information, including access to the service catalog and
    service health status.

    +   - **Session**: Consul enables you to allocate and release a lock on values
    within the key/value store. This can be done in performed sessions and will not
    be addressed as part of this book.

    +   - **Namespace**: Namespaces are another Enterprise-level feature and enable
    the subdivision of Consul clusters. This rule type allows you to create more comprehensive
    rules consisting of multiple rule types for an entire namespace. Although we won’t
    be covering namespaces much in this book, it is very important to understand that
    several rule types, including the operator and keyring rules, can’t be applied
    to namespaces. These functions are global in scale and only operate on the default
    namespace.'
  - "[PAGE 87]\n\nAs you can see, there are a lot of areas where we can apply ACLs\
    \ to manage what humans, machines, or cyborgs can do to access our services. This\
    \ also provides a plethora of areas to control the individual nodes.\n\nWhen we\
    \ are talking about security, we often use the term *least privilege*. Plainly\
    \ speaking, or writing, this means that instead of giving a child a pile of candy\
    \ and telling them what they can’t eat, we start with the child having no candy\
    \ and providing only what they can eat. This is why, earlier in this section,\
    \ we talked about instituting a default deny policy within Consul. If we utilize\
    \ this as our standard security rule, especially with the certificates we discussed\
    \ in the previous section, we can further tighten our control of the individual\
    \ nodes. This drastically reduces the possibility of any cowans or eavesdroppers\
    \ gaining access to, or listening in on, our cluster operations – for if you don’t\
    \ have the secret handshake, you will not pass.\n\nNow that we’ve addressed all\
    \ of that, let’s take a look at what a rule looks like. We’re going to look at\
    \ two rules here, both of which we’ll actually use when we start getting our hands\
    \ on the system.\n\nThis first rule applies a minimal policy for a Consul client\
    \ to perform its operations on itself and alert the Consul server of any changes\
    \ to the infrastructure:\n\n```\nnode \"ip-192-168-100-11\" {\n  policy = \"write\"\
    \n}\nservice \"consul\" {\n  policy = \"write\"\n}\nagent_prefix \"ip\" {\n  policy\
    \ = \"write\"\n}\n```\n\nWithin this policy, we have three main rules that appear\
    \ to be quite simple, but within a least privileged model, their role in society\
    \ is critically important.\n\nThe first rule within the policy utilizes the node\
    \ rule type. Without this rule, the node can’t update the server cluster on what\
    \ services it sees and, more importantly, the health and location of the node.\
    \ If a client attempts to join the cluster, without the token associated with\
    \ this rule, the server cluster won’t even recognize it as a client. Note that\
    \ because the node rule only applies to ip-192-168-100-11, this rule only applies\
    \ to the actions for this particular node, as that is its hostname. Any other\
    \ node using the token associated with this policy would not be recognized by\
    \ the Consul server cluster."
  - "[PAGE 88]\n\nThe next rule, which is of the `service` type, allows us to update\
    \ the service catalog on the node itself. This is particular to the services on\
    \ the node itself, not the overall service catalog hosted by the Consul server\
    \ cluster. To update the centralized service catalog, we'll need the `agent` rule,\
    \ which we'll talk about next. Note that with this rule, we can `write` to the\
    \ service named `consul` to manage service changes. If we only wanted to read\
    \ the status or availability of the service, we could use a `read` directive.\n\
    \nThe last rule utilizes the `agent` rule type. This is similar in importance\
    \ to the node rule type, where it controls very fundamental aspects of the functionality\
    \ of the node (although in this case, it's pertinent to the agent). This rule\
    \ allows the bearer of the associated token to perform agent-level functions such\
    \ as updating the service catalog... which is kind of important since Consul is\
    \ all about services. One difference that you might have picked up with this particular\
    \ rule definition is that instead of pointing to a particular agent, it utilizes\
    \ the slight variation called `agent_prefix`. As you might have guessed, this\
    \ applies to any agent with a hostname that starts with the prefix `ip`. This\
    \ provides some flexibility, allowing you to apply rules to groups of agents,\
    \ as opposed to writing a rule for each individual agent. This does, however,\
    \ expose us a bit because the rule isn't locked down to one particular agent.\
    \ One thing that can be done to help here is to have two agent rules – one specific\
    \ to the host that it resides on, enabling it to write to agent operations, and\
    \ another to read agent operations from other nodes:\n\n```\n```hcl\nnode \"ip-192-168-100-11\"\
    \ {\n    policy = \"write\"\n}\nagent \"ip-192-168-100-11\" {\n    policy = \"\
    write\"\n}\nagent_prefix \"ip\" {\n    policy = \"read\"\n}\n```\n```\n\nThis\
    \ was a very constricted set of policy rules applicable to that particular agent.\
    \ The following policy opens things up a bit and is more applicable to the server\
    \ cluster, affording it the ability to do things such as write ACLs, events, and\
    \ more:\n\n```\n```hcl\nacl = \"write\"\nagent_prefix \"\" {\n    policy = \"\
    write\"\n}\nevent_prefix \"\" {\n```\n```"
