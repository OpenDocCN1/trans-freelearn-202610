    # Section 1:

    Consul Use Cases

    and Architecture


    Welcome to the consoling world of Consul. If you''ve ever built a structure, you
    know that the foundation is the most important part. If you don''t believe me,
    just look at the leaning tower of Pisa! This section covers the foundational aspects
    of the Consul system, briefly reviewing why Consul is such a critical component
    in today''s dynamic world, as well as how the Consul system operates to support
    various use cases.


    This part of the book comprises the following chapters:


    +   - Chapter 1, Consul Overview – Operation and Use Cases

    +   - Chapter 2, Architecture – How Does It Work?

    +   - Chapter 3, Keep It Safe, Stupid, and Secure Your Cluster!

    +   - Chapter 4, Data Center (Not Trade) Federation'
