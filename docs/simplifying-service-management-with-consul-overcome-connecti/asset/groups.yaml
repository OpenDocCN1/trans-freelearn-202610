    \ data centers. The Consul mesh gateway takes that connection and adds not only\
    \ the encryption to that connection, but also the ability to control which services\
    \ are permitted to traverse those data centers.\n\n![](img/52479dafaefba00517c48a137e037b7e_188_0.png)\n\
    \nFigure 6.11 — Mesh gateways connecting data centers\n\nWhenever we connect a\
    \ service within the Consul service mesh, the Consul server cluster manages the\
    \ certificates for identity and encryption through the **connect** functionality.\
    \ Connecting clusters through the mesh is no different; however, we all know what\
    \ happens when we have more than one boss (let alone six bosses Bob, six bosses).\
    \ Therefore, whenever we are connecting data centers via a mesh gateway, a primary\
    \ data center must be identified to manage and distribute the certificates. These\
    \ certificates create a new mTLS session between mesh gateway peers used for identity.\
    \ It is important to note here that the encrypted traffic that flows through the\
    \ mesh gateway is still service-to-service encrypted. In other words, the mesh\
    \ gateway entities do not decrypt the message between services; they only retain\
    \ the encryption that was already performed at the service endpoints.\n\nWell,\
    \ what if we don't want all of our services traversing through the gateway? No\
    \ problem! When the services are connected through the mesh gateway, the Consul\
    \ clusters recognize those services, and we can write intentions! This gives the\
    \ Consul administrators the immense power of not only controlling the service\
    \ mesh within a single cluster, but the entire world! Furthermore, as part of\
    \ the service definition, we can tell Consul that the **upstream service** (the\
    \ service we want to initiate the connection to) is available via the mesh gateway.\
    \ Let's take a look at a modified `curl` service as an example.\n\n## Curl.json\
    \ across the mesh gateway\n\n```\n{\n    \"service\": {\n        \"name\": \"\
    curl\",\n        \"tags\": [\n            \"curl-client\"\n        ],\n      \
    \  \"connect\": {\n            \"sidecar_service\": {\n                \"proxy\"\
    : {\n                    \"upstreams\": [{\n                        \"destination_name\"\
    : \"httpd\",\n                        \"datacenter\": \"secondary\",\n       \
    \                 \"local_bind_port\": 3579\n                    }]\n        \
    \        }\n            }\n        }\n    }\n}\n```\n\nWithin this slightly altered\
    \ service definition, we are telling Consul that the `httpd` service that we want\
    \ to reach is available in the data center named *secondary*. This is a great\
    \ example of connecting to another Consul data center for access to a service,\
    \ but what if the intended service isn't within the mesh?\n\n## Terminating gateways\n\
    \nWith the proliferation of **anything as a service (*aaS)**, cloud providers\
    \ are working very hard to differentiate themselves and remain competitive. At\
    \ least, that's my theory, which I believe leads to hosted services that would\
    \ normally require dedicated compute. Even if it isn't true, it sounds logical,\
    \ and besides, I'm pretty sure I read it on the internet somewhere. Hosted database\
    \ services are a wonderful example of this functionality, and unfortunately, we\
    \ can't deploy a Consul agent on a hosted AWS database service. For this purpose,\
    \ we have the role of a terminating gateway.\n\n![](img/52479dafaefba00517c48a137e037b7e_190_0.png)\n\
    \nLuckily, this gateway isn't wandering through the clouds looking for Sarah Connor.\
    \ However, what it does terminate is the security and control of the Consul services.\
    \ All is not lost, however, because if the destination service supports mTLS,\
    \ the terminating gateway will maintain that secure connection. If the service\
    \ only supports one-way TLS, the gateway can work with that too; however, this\
    \ can open the terminating gateway to potential attacks. As the gateway is at\
    \ the edge of the mesh, unlike the mesh gateway, it does have the ability to decrypt\
    \ the traffic it receives. Therefore, it is always recommended to tightly control\
    \ access to the node operating as the gateway. There is a problem though ... how\
    \ does Consul know about the services that aren't even inside the Consul cluster?\n\
    \nRecall that as we were discussing service discovery in *Chapter 5, Little Bo\
    \ Peep Lost Her Service*, Consul is able to contain services within the registry\
    \ that are not being managed by Consul. These are **external** services, which\
    \ kind of makes sense, as they are **external** to Consul. Any services that are\
    \ to be accessible via the terminating gateway must be registered in Consul; after\
    \ all, if they aren't, how can we discover them? When we configure a terminating\
    \ gateway, we need to list the services that are available through that gateway.\
    \ This is the only way that Consul can manage the discovery and connection from\
    \ within the mesh to those external services. We can still use ACLs and security\
    \ up to the gateway node; however, once the traffic leaves the gateway, we need\
    \ to resort to old-fashioned networking, the way our grandmothers did.\n\n## Ingress\
    \ gateways\n\nNext, we have to think about all of those entities that are outside\
    \ in the great big scary world that want to access the wonderful services that\
    \ we offer! This requires a method to open the service mesh and invite others\
    \ to join us. However, we just don't want to open the door and let anything into\
    \ our mesh. We've worked very hard and have put up with a plethora of horrible\
    \ jokes to secure our beautiful mesh. The last thing we want is to put the mesh\
    \ at risk by allowing nefarious traffic through the door.\n\n![](img/52479dafaefba00517c48a137e037b7e_191_0.png)\n\
    \nFigure 6.13 – Ingress gateways\n\nLuckily, any service that we would want to\
    \ be accessible via the ingress gateway should already be registered within the\
    \ Consul service catalog. However, we don't want to expose ourselves completely\
    \ as part of the process. Consul allows us to define a listener as part of the\
    \ configuration for the ingress gateway. This listener tells the Consul agent\
    \ (and Envoy proxy as well) which port to listen on, and what the associated service\
    \ is. With this configuration, the ingress gateway can receive traffic on the\
    \ specified port and forward that traffic to the appropriate destination service.\n\
    \nNow that we can see how Consul can connect internal and external services to\
    \ the mesh network, let's take a quick look at an environment that exists as individual\
    \ networks that yearn to be connected.\n\n## Meshing with Kubernetes\n\nThroughout\
    \ this entire chapter, I've only mentioned Kubernetes once, and that was in passing.\
    \ This is partly due to my loathness of Kubernetes and the number of hours I've\
    \ struggled with the technology. However, service orchestrators such as Kubernetes\
    \ (or Nomad) definitely have a place in the world of service mesh. In fact, many\
    \ people don't think about service mesh unless it is within the realm of one of\
    \ these application orchestration tools. We aren't going to get into the details\
    \ of Kubernetes for a number of reasons (some of which I've already mentioned).\
    \ However, I do want to address why service mesh is so important within this arena.\n\
    \nApplication orchestration provides an entire operating environment in which\
    \ our applications reside. Once deployed within the environment, the primary job\
    \ of the orchestrator is to ensure that the desired number of instances are operating\
    \ and that the resources are being managed. The application can reside anywhere\
    \ within the cluster of machines, so long as any constraints are satisfied. If\
    \ the application fails, it is up to the orchestrator to restart the instance\
    \ somewhere within the cluster. Additionally, when performing upgrades of machines,\
    \ the orchestrators are able to move the applications throughout the cluster to\
    \ best suit the desired goal. Essentially, the orchestrator, whether it's Kubernetes\
    \ or Nomad, has full control over the location, and therefore the addressing,\
    \ of the application. This migratory and ephemeral nature of the applications\
    \ dramatically complicates the problems of IP addressing discussed earlier.\n"
  mdcn: "\n\n## 网格网关\n\n我们已经了解了如何通过服务网格安全地连接服务。我喜欢将网格网关视为一种*超级网格*。利用我们在*第4章，数据中心（而非贸易）联邦*中玩过的WAN联邦，我们能够跨多个数据中心连接Consul集群。Consul网格网关不仅为这种连接增加了加密能力，还增加了控制哪些服务被允许穿越这些数据中心的能力。\n\
    \n![](img/52479dafaefba00517c48a137e037b7e_188_0.png)\n\n图6.11——连接数据中心的网格网关\n\n\
    每当我们连接Consul服务网格中的一个服务时，Consul服务器集群都会通过**connect**功能管理身份证书和加密。通过网格连接集群也不例外；但我们都知道，当老板不止一个时会发生什么（更别提六个老板，六个老板）。因此，每当我们通过网格网关连接数据中心时，必须指定一个主数据中心来管理和分发证书。这些证书会在网格网关对等体之间创建一个新的mTLS会话，用于身份验证。这里需要注意的重要一点是，流经网格网关的加密流量仍然是服务到服务之间加密的。换句话说，网格网关实体不会解密服务之间的消息；它们只保留服务端点已经执行的加密。\n\
    \n那么，如果我们不希望所有服务都穿过网关呢？没问题！当服务通过网格网关连接时，Consul集群能够识别这些服务，我们就可以编写意图（intentions）！这把巨大的权力交给了Consul管理员，他们不仅可以控制单个集群内的服务网格，还可以控制整个世界！此外，作为服务定义的一部分，我们可以告诉Consul，**上游服务**（我们想要发起连接的服务）可以通过网格网关访问。让我们看一个修改过的`curl`服务作为示例。\n\
    \n## 跨网格网关的Curl.json\n\n```\n{\n    \"service\": {\n        \"name\": \"curl\"\
    ,\n        \"tags\": [\n            \"curl-client\"\n        ],\n        \"connect\"\
    : {\n            \"sidecar_service\": {\n                \"proxy\": {\n      \
    \              \"upstreams\": [{\n                        \"destination_name\"\
    : \"httpd\",\n                        \"datacenter\": \"secondary\",\n       \
    \                 \"local_bind_port\": 3579\n                    }]\n        \
    \        }\n            }\n        }\n    }\n}\n```\n\n在这个稍微修改过的服务定义中，我们告诉Consul，我们想要访问的`httpd`服务位于名为*secondary*的数据中心。这是一个连接另一个Consul数据中心以访问服务的绝佳示例，但如果目标服务不在网格内呢？\n\
    \n## 终止网关\n\n随着**一切即服务（*aaS）**的普及，云提供商正在努力使自己脱颖而出并保持竞争力。至少，这是我的理论，我认为这导致了原本需要专用计算资源的托管服务的出现。即使这不完全正确，听起来也合乎逻辑，而且我相当确定我在互联网的某个地方读到过。托管数据库服务是这一功能的绝佳示例，不幸的是，我们无法在托管的AWS数据库服务上部署Consul代理。为此，我们有了终止网关的角色。\n\
    \n![](img/52479dafaefba00517c48a137e037b7e_190_0.png)\n\n幸运的是，这个网关并没有在云中游荡寻找莎拉·康纳。然而，它终止的是Consul服务的安全和控制。但并非一切尽失，因为如果目标服务支持mTLS，终止网关将维持该安全连接。如果服务只支持单向TLS，网关也可以处理；但这可能会使终止网关面临潜在攻击。由于网关位于网格的边缘，与网格网关不同，它确实有能力解密它收到的流量。因此，始终建议严格控制充当网关的节点的访问权限。但有一个问题……Consul是如何知道那些甚至不在Consul集群内的服务的呢？\n\
    \n回想我们在*第5章，小波比丢失了她的服务*中讨论服务发现时，Consul能够在注册表中包含不受Consul管理的服务。这些是**外部**服务，这说得通，因为它们对Consul来说是**外部**的。任何希望通过终止网关访问的服务都必须在Consul中注册；毕竟，如果不注册，我们怎么能发现它们呢？当我们配置终止网关时，我们需要列出可通过该网关访问的服务。这是Consul管理从网格内部到这些外部服务的发现和连接的唯一方式。我们仍然可以使用ACL和安全措施直到网关节点；然而，一旦流量离开网关，我们就需要诉诸老式的网络方式，就像我们的祖母们所做的那样。\n\
    \n## 入口网关\n\n接下来，我们必须考虑外部广阔而可怕的世界中那些想要访问我们提供的精彩服务的实体！这需要一种方法来打开服务网格并邀请其他人加入我们。然而，我们不想只是打开门让任何东西进入我们的网格。我们付出了巨大的努力，忍受了无数糟糕的笑话，来保护我们美丽的网格。我们最不希望的就是允许邪恶的流量通过大门，使网格陷入风险。\n\
    \n![](img/52479dafaefba00517c48a137e037b7e_191_0.png)\n\n图6.13 – 入口网关\n\n幸运的是，任何我们希望通过入口网关访问的服务都应该已经在Consul服务目录中注册了。然而，我们不想在这个过程中完全暴露自己。Consul允许我们在入口网关的配置中定义一个监听器。这个监听器告诉Consul代理（以及Envoy代理）要监听哪个端口，以及对应的服务是什么。通过这种配置，入口网关可以在指定端口接收流量，并将该流量转发到适当的目标服务。\n\
    \n现在我们了解了Consul如何将内部和外部服务连接到网格网络，让我们快速看看一个由渴望连接的独立网络组成的环境。\n\n## 与Kubernetes构建网格\n\
    \n在整章中，我只提到过Kubernetes一次，而且只是一带而过。部分原因是我对Kubernetes的厌恶以及我在这项技术上挣扎的无数小时。然而，像Kubernetes（或Nomad）这样的服务编排器在服务网格领域绝对有一席之地。事实上，许多人只有在应用程序编排工具的领域内才会考虑服务网格。我们不会深入讨论Kubernetes的细节，原因有很多（其中一些我已经提到过）。不过，我确实想谈谈为什么服务网格在这个领域如此重要。\n\
    \n应用程序编排提供了一个完整的运行环境，我们的应用程序就驻留在其中。一旦部署到环境中，编排器的主要工作就是确保所需数量的实例正在运行，并确保资源得到管理。只要满足任何约束条件，应用程序可以位于集群机器中的任何位置。如果应用程序失败，编排器负责在集群内的某个位置重新启动该实例。此外，在执行机器升级时，编排器能够在集群中移动应用程序，以最好地实现预期目标。本质上，无论编排器是Kubernetes还是Nomad，它都完全控制着应用程序的位置，从而控制其寻址方式。应用程序的这种迁移性和短暂性极大地复杂化了我们之前讨论的IP寻址问题。\n\
    \n"
