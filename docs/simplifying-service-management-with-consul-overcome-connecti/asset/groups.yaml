    \ the timeout that Consul will wait for a response to the HTTP request, as well\
    \ as the interval at which requests are made. You may be recognizing a pattern\
    \ here. If the Consul agent is able to connect to the host and port, the service\
    \ is considered to be healthy.\n\n- **TTL**: This check is purely based on the\
    \ **Time-To-Live (TTL)** of the last known state of the application. Within the\
    \ HTTP and TCP health checks, Consul queries the service to validate availability.\
    \ With the TTL check, however, Consul will listen for HTTP updates to see whether\
    \ the service is healthy. In most cases, this is utilized only when the service\
    \ can self-report its status, as either **pass**, **warn**, or **fail**. If the\
    \ service doesn’t report within the TTL value, then Consul will assume the service\
    \ is no longer available.\n\n- **Docker**: This can be useful to ascertain the\
    \ health of services or applications that are running within Docker containers\
    \ without any exposed interfaces on which the TCP, HTTP, or script-based checks\
    \ can be used. For a Docker-based check, Consul interacts with a Docker host utilizing\
    \ the Docker HTTP API or a direct socket. Consul directs Docker to spin up a container\
    \ application that will check the service health, report the health to Consul,\
    \ and then terminate the container. As part of the configuration, you can specify\
    \ the interval at which this check is run, but no timeout for this one. Note that\
    \ similar to the script check, this does require advanced permissions on the Consul\
    \ agent, therefore the `enable_script_checks` Boolean configurations must be set\
    \ to `true`.\n\n- **gRPC**: Some applications that support **gRPC remote procedure\
    \ calls** may also support a gRPC-specific health check endpoint. This is definitely\
    \ a more specific integration. However, the check supports the health validation\
    \ of a single service, or multiple services as reported by the gRPC server. The\
    \ definition of a gRPC-based check has both the `timeout` and `interval` parameters\
    \ we have seen in other checks. Additionally, similar to the HTTP check, the gRPC\
    \ health check supports TLS configuration for secure networks.\n\n- **H2ping**:\
    \ This check provides similar functionality as the HTTP check; however, this supports\
    \ a very simple ping frame delivery defined via the HTTP2 protocol. Just like\
    \ the HTTP check, the H2ping check provides the ability to configure the interval\
    \ at which the checks are executed and the timeout to wait before declaring a\
    \ check as failed. Unlike the HTTP check, however, H2ping relies upon a TLS connection\
    \ by default, but it can be disabled by setting `tls_skip_verify` to `true`.\n"
  mdcn: "\n\n此时，我们已在 Consul 中定义了一个外部服务，它不仅注册在服务目录中，而且还会被监控，以确保在向任何消费者提供目录信息之前，服务处于健康状态。\n\
    \n如果你希望将 Consul ESM 下载到自己的系统上并试用该服务，只需登录到你选择的其中一个 Consul 客户端节点。在命令行 shell 中，执行以下命令：\n\
    \n```\n$ curl -o https://releases.hashicorp.com/consul-esm/0.5.0/ consul-esm_0.5.0_linux_amd64.tgz\n\
    ```\n\n```\n$ tar -zxvf consul-esm_0.5.0_linux_amd64.tgz\n```\n\n这为你提供了 consul-esm\
    \ 二进制文件，它可以像标准 Consul 代理一样，使用 HCL 配置文件进行配置！我提供了一个非常简单的配置文件。如果你想试用 ESM，只需确保修改 `local_private_ip`\
    \ 参数，并插入与你节点对应的正确参数：\n\n```\n# consul-esm.hcl Configuration File\nlog_level =\
    \ \"INFO\"\ninstance_id = \"\"\nconsul_service = \"consul-esm\"\nhttp_addr = \"\
    <local_private_ip>:8500\"\ndatacenter = \"dc1\"\n```\n\n现在你已经有了配置文件，可以运行 consul-esm\
    \ 并使用它：\n\n```\n$ sudo ./consul-esm -config-file=./consul-esm.hcl\n```\n\n如果你正在跟着操作（你当然应该这么做），那么你的\
    \ VCS 外部服务应该已在 Consul 集群中注册为健康状态。如果你想查看 Consul ESM 的源代码或其他文档，所有内容都在 GitHub 上开源提供！\n\
    \nhttps://github.com/hashicorp/consul-esm\n\n既然我们已经知道了如何定义内部和外部服务，小波比也能够分辨哪些羊是她的，以及它们在哪里。她还需要一种方法来确保她的羊都健康。毕竟，生病的羊需要被照料！让我们来看看如何确保我们的羊——我是说服务——保持健康。\n\
    \n## 汤姆少校，你还好吗？\n\n每当我们处理通信时，几乎总需要某种程度的反馈来确保接收方可用。这正是我们耳熟能详的短语的由来，比如*你现在能听到我吗？*。任何处理过网络负载均衡器或系统监控的人对*健康检查*一词都不会陌生。这正是\
    \ Consul 可以在每个服务定义中采用的机制。尽管健康检查并非服务定义的必需部分，但我无法想象为什么会有人想要定义和部署一个没有健康检查的服务！\n\n\
    在网络负载均衡器或系统监控领域，健康检查是由某种集中式智能定义和编排的。这意味着，如果一个负载均衡器管理着分布在 100 个不同节点上运行的 10 个服务，那么该负载均衡器需要跟踪\
    \ 1,000 个健康检查。这不仅会在服务增长时导致一些扩展问题，而且还会（至少略微）增加网络流量。\n\n如今许多监控系统利用远程代理进行健康检查，既解决了扩展问题，也减轻了网络影响。Consul\
    \ 的运作方式与监控系统类似，利用与服务一起部署的 Consul 代理来管理和执行所有本地健康检查。然而，与集中式监控系统不同，如果 Consul 管理的服务或\
    \ Consul 节点/代理发生故障，负担并不完全落在服务器集群上。回想一下，由于我们所有的代理都在进行 gossip（八卦）通信，它们会了解对等节点的服务可用性并用于上报。因此，对于\
    \ Consul 而言，每个管理服务的代理也会管理和执行与相应服务健康相关的检查。让我们看看为了实现这一目的，我们可以实施哪些检查：\n\n- **脚本**：顾名思义，脚本检查会执行一个预定义的自定义脚本，以执行某些功能来验证服务的健康状态。在我们使用\
    \ `httpd.json` 服务定义的示例中，我们使用了脚本检查，利用 Linux `curl` 工具以及一些相应参数（`localhost:8080`）。虽然我使用的是一个常见工具作为脚本，但在大多数情况下，脚本是非常自定义的，会对服务健康状态进行深入查询。除了脚本之外，你还可以指定脚本运行的间隔，以及为适应脚本失败而设置的必要超时。请注意，脚本检查默认未启用，因此代理的配置必须允许脚本检查。这可以通过\
    \ `enable_script_checks` 以及 `enable_local_script_checks` 布尔参数来实现。Consul 根据脚本返回的值来识别服务的健康状态：\n\
    \n  - 0：服务健康。\n  - 1：服务处于警告状态。\n  - 其他任何值：服务不可用。\n\n> **注意**\n> \n> `enable_script_checks`\
    \ 字段允许通过任何方法（包括 API）定义的脚本。如果你尚未正确保护集群安全，这会使远程实体能够在 Consul 代理上执行脚本。强烈建议将所有脚本检查定义并实现于代理本地，并专门使用\
    \ `enable_local_script_checks`。\n\n- **HTTP**：你可能已经猜到，基于 HTTP 的检查会发起一个 HTTP 请求，以确认相关服务的健康状态。默认情况下，这是一个\
    \ GET 请求；不过，该检查确实支持在配置中指定其他 HTTP 方法。如果需要特定的 HTTP 头，也可以通过配置中的 headers 字段指定。与基于脚本的检查类似，配置可以指定\
    \ Consul 等待 HTTP 请求响应的超时时间，以及发起请求的间隔。此外，正如我们已经看到的保护通信的重要性，HTTP 检查确实支持 TLS 配置，以防应用程序使用安全的\
    \ HTTP 端点。来自 HTTP 检查的任何 2xx 响应都被视为服务健康。\n\n- **TCP**：如果你曾经使用过 Telnet 来检查应用程序是否在某个端口上监听，那么\
    \ TCP 检查非常适合你！TCP 检查只是尝试连接到应用程序应该监听的某个主机和 TCP 端口。当然，与基于 HTTP 和脚本的检查类似，配置可以指定 Consul\
    \ 等待 HTTP 请求响应的超时时间，以及发起请求的间隔。你可能已经注意到这里的一个模式。如果 Consul 代理能够连接到主机和端口，则该服务被视为健康。\n\
    \n- **TTL**：此检查完全基于应用程序最后已知状态的**生存时间（TTL）**。在 HTTP 和 TCP 健康检查中，Consul 会查询服务以验证可用性。然而，对于\
    \ TTL 检查，Consul 会监听 HTTP 更新来判断服务是否健康。在大多数情况下，这仅在服务能够自我报告其状态时使用，状态可为**通过**、**警告**或**失败**。如果服务在\
    \ TTL 值内没有报告，Consul 将假定该服务不再可用。\n\n- **Docker**：这对于确定运行在 Docker 容器内的服务或应用程序的健康状态非常有用，因为这些容器可能没有任何暴露的接口，无法使用\
    \ TCP、HTTP 或基于脚本的检查。对于基于 Docker 的检查，Consul 利用 Docker HTTP API 或直接套接字与 Docker 主机交互。Consul\
    \ 指示 Docker 启动一个容器应用程序来检查服务健康状态，向 Consul 报告健康信息，然后终止该容器。作为配置的一部分，你可以指定运行此检查的间隔，但没有超时时间。请注意，与脚本检查类似，这确实需要\
    \ Consul 代理上的高级权限，因此 `enable_script_checks` 布尔配置必须设置为 `true`。\n\n- **gRPC**：一些支持\
    \ **gRPC 远程过程调用**的应用程序可能也支持特定于 gRPC 的健康检查端点。这无疑是一种更具体的集成方式。不过，该检查支持对单个服务或多个服务进行健康验证，具体情况由\
    \ gRPC 服务器报告。基于 gRPC 的检查定义包含我们在其他检查中见过的 `timeout` 和 `interval` 参数。此外，与 HTTP 检查类似，gRPC\
    \ 健康检查支持用于安全网络的 TLS 配置。\n\n- **H2ping**：此检查提供与 HTTP 检查类似的功能；不过，它支持通过 HTTP2 协议定义的非常简单的\
    \ ping 帧传输。与 HTTP 检查一样，H2ping 检查可以配置检查执行的间隔，以及在宣布检查失败前等待的超时时间。然而，与 HTTP 检查不同，H2ping\
    \ 默认依赖 TLS 连接，但可以通过将 `tls_skip_verify` 设置为 `true` 来禁用。\n\n"
