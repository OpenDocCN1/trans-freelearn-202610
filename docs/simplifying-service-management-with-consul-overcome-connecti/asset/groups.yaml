    \ which gives greater importance to enabling authentication methods such as OIDC\
    \ to uniquely distinguish users. The logs are written to a file in JSON format,\
    \ which can be ingested into most log analysis utilities such as DataDog, Splunk,\
    \ and Elasticsearch. When configuring the logging, however, be sure to set limits\
    \ on the number of log files and the rotation frequency… nobody ever likes to\
    \ admit that they ran out of space due to logging!\n\n```\n```hcl\naudit {\n \
    \ enabled = true\n  sink \"consul_audit\" {\n    type   = \"file\"\n    format\
    \ = \"json\"\n    path   = \"data/audit/audit.json\"\n    delivery_guarantee =\
    \ \"best-effort\"\n    rotate_duration = \"24h\"\n    rotate_max_files = 15\n\
    \    rotate_bytes = 25165824\n  }\n}\n```\n```\n\nThe output of the log file identifies\
    \ several important pieces of information, specifically the timestamp and the\
    \ token accessor. This accessor can be linked back to the individual tokens and\
    \ roles (and therefore users) that accessed the system. I personally find the\
    \ source IP address to be very interesting in audit logs, especially when I can\
    \ do geographic association and determine who is accessing the system from various\
    \ parts of the world. Of course, the entry includes what they did with the system\
    \ as well!\n\n```\n```json\n{\n  \"created_at\": \"2020-08-25T10:35:23.258765383Z\"\
    ,\n  \"event_type\": \"audit\",\n  \"payload\": {\n    \"id\": \"3a880e2b-3f43-5d4d-97a6-26aec5eacc0c\"\
    ,\n```\n\n```\n```json\n\"version\": \"1\",\n\"type\": \"HTTPEvent\",\n\"timestamp\"\
    : \"2020-08-25T10:35:23.258548744Z\",\n\"auth\": {\n  \"accessor_id\": \"48162132-6b28-de21-aee9-6903d2024f2e\"\
    ,\n  \"description\": \"token created via OIDC login\",\n  \"create_time\": \"\
    2020-08-25T10:35:23.158336091Z\"\n},\n\"request\": {\n  \"operation\": \"GET\"\
    ,\n  \"endpoint\": \"/v1/catalog/datacenters\",\n  \"remote_addr\": \"172.17.0.1:48516\"\
    ,\n  \"user_agent\": \"Mozilla/5.0 (Macintosh; Intel Mac OS X 10_14_6) AppleWebKit/537.36\
    \ (KHTML, like Gecko) Chrome/84.0.4147.125 Safari/537.36\",\n  \"host\": \"192.168.64.243:31394\"\
    \n},\n\"stage\": \"OperationStart\"\n}\n```\n```\n\nAs you can see, enabling these\
    \ audit logs is a crucial aspect of operating and managing the Consul system within\
    \ any enterprise. Because we are simply practitioners learning the system, it\
    \ isn't as interesting (we should know what we did and when, although I admit\
    \ I probably use the Bash history more than I should). However, as Consul is rolled\
    \ out to enterprise environments, tracking these operations is as critical as\
    \ ensuring the system is actually running! Speaking of running, I hope you're\
    \ ready. I would strongly advise at this point that you get up, take a walk, or\
    \ stretch your legs, because it's about to get pretty thick.\n\n## Securing your\
    \ Consul cluster\n\nBefore we start securing your cluster, I need to set forth\
    \ a word of caution. Things can get a little tricky when you work with security\
    \ enforcement, especially when you accidentally lock yourself out of your own\
    \ cluster. Luckily, we're just working with a simple development system here.\
    \ However, in a production environment, extreme care must be taken. I've tried\
    \ to automate as much as possible, but at any point in this process, you can destroy\
    \ the entire infrastructure set and rebuild it. Ah, the wonder and beauty of Terraform\
    \ and ephemeral infrastructure!\n"
  mdcn: "\n\n利用 OIDC，Consul 可以通过查询众多 OIDC 提供商之一来验证尝试访问 Consul 的用户（大多数企业环境至少使用一个）。如果你曾经登录某个服务并被重定向到另一个用于\
    \ Google、Yahoo、Microsoft、PayPal 或 Amazon 凭证的身份验证页面或弹出窗口，那么很可能你已为该身份验证使用了 OIDC。企业环境中其他流行的\
    \ OIDC 提供商包括 OKTA 和 Auth0。此过程不仅验证并对用户进行身份验证，还可以将该用户映射到一组授权策略以控制对系统的访问。毕竟，如果你曾经需要给经理提供\
    \ Consul 集群的访问权限，你肯定不希望他们拥有管理权限！那么，让我们用另一个美妙的例子来逐步了解。\n\n作为这个故事的一部分，我们需要假设我们的更大雇主已实施\
    \ OIDC，并且我们每个人都有自己的凭证来使用该 OIDC 提供商进行身份验证。除了我们的凭证外，我们所有人都有与我们在公司中的职位相关联的特定元数据：\n\
    \n| Credentials | Metadata |\n| Username | Password | First Name | Last Name |\
    \ Position |\n| sharris | ********** | Steve | Harris | Bassist |\n| bdickinson\
    \ | ********** | Bruce | Dickinson | Singer |\n| dmurray | ********** | Dave |\
    \ Murray | Guitarist |\n| asmith | ********** | Adrian | Smith | Guitarist |\n\
    | nmcbrain | ********** | Nicko | McBrain | Drummer |\n\nFigure 3.6 – OIDC accounts\
    \ and metadata\n\n在这个示例中，每个人都有自己独特的职位，除了 Adrian 和 Dave。他们都属于吉他手组，我们将把它映射到 Consul\
    \ 中的一个角色。回想一下，角色由 Consul 中的一组 ACL 策略组成。当我们配置 Consul 来利用此信息时，我们创建了所谓的声明映射。这将 OIDC\
    \ 提供商中配置的元数据映射到 Consul 中的变量中，然后可用于将该元数据与特定角色关联。例如，以下配置将名字和姓氏的特定映射关联起来，并且职位元数据与\
    \ Consul 中名为 band_positions 的列表相关联：\n\n```\n{\n\"OIDCDiscoveryURL\": \"https://<OIDC_URL>/\"\
    ,\n\"OIDCClientID\": \"<OIDC_CLIENT_ID>\",\n```\n\n```\n\"OIDCClientSecret\":\
    \ \"<OIDC_CLIENT_SECRET>\",\n\"BoundAudiences\": [\"<OIDC_CLIENT_ID>\"],\n\"AllowedRedirectURIs\"\
    : [\n    \"http://localhost:8550/oidc/callback\",\n    \"http://localhost:8500/ui/oidc/callback\"\
    \n],\n\"ClaimMappings\": {\n    \"user.metadata.first_name\": \"first_name\",\n\
    \    \"user.metadata.last_name\": \"last_name\"\n},\n\"ListClaimMappings\": {\n\
    \    \"user.metadata.position \": \"band_positions\"\n}\n}\n```\n\n此配置只是允许 Consul\
    \ 与 OIDC 提供商通信并提取特定的账户信息（名字、姓氏和职位）。然而，除非我们配置 Consul 将该元数据与特定角色关联，否则这些信息毫无意义。让我们假设\
    \ Consul 中有一个吉他手的角色，由两个策略组成。我们可以使用以下示例命令创建该角色：\n\n```\n$ consul acl role create\
    \ -name guitarists -policy-name rhythm -policy-name lead\n```\n\n太棒了！我们已在 OIDC\
    \ 提供商中创建了我们的账户，并且在 Consul 中定义了一个角色，该角色将账户的特定属性与一组策略相关联。但是，我们如何链接这两条信息？这可以通过所谓的绑定规则来完成。现在，我们之前没有谈论过这些，但绑定规则将一种身份验证方法与特定角色关联。绑定规则可以应用于应用程序身份验证（例如，如果你想使用\
    \ Java Web Token 验证身份验证），但我们这里的重点是验证人类。特别是，我们希望具有吉他手职位的用户能够访问吉他手 Consul 角色。请注意拼写上的细微差别（guitarist\
    \ 与 guitarists）。这是为了在整个过程中区分术语。\n\n够谈论我们的绑定规则了。如果我们想创建一个，我们可以使用以下示例：\n\n```\n\
    $ consul acl binding-rule create -method=<oidc_name> -bind-type=role -bind-name=guitarists\
    \ -selector='guitarist in list.band_positions'\n```\n\n在这里，我们使用在 Consul 中配置 OIDC\
    \ 提供商时给出的 OIDC 提供商的名称。我们声明任何使用该方法登录 Consul 的人都需要使用关联的 OIDC 提供商进行身份验证。当我们收到尝试身份验证的用户元数据时，我们会在\
    \ band_positions 列表中查找，如果我们找到 guitarist，我们就可以将 guitarists 角色（以及因此关联的所有策略）分配给这些用户。现在，为什么我们要经历所有这些工作，而我只需要创建令牌并将这些令牌交给用户呢？\n\
    \n让我们假设我们已经完成了为吉他手创建角色的过程，并且该角色拥有自己的令牌。我们可以将同一个令牌交给 Adrian 和 Dave，他们就可以使用该令牌通过\
    \ CLI 或 Web 界面使用 Consul 进行身份验证。这里出现问题一；当我们跟踪审计日志时，如何区分 Adrian 和 Dave？当我们只有一个用户时可能没那么糟糕，但当\
    \ Jannick（另一名吉他手）加入乐队时，区分用户变得更加困难（尽管他们的吉他风格截然不同）。\n\n现在，我承认所有这些都可能令人困惑，所以让我列出顺序：\n\
    \n## Consul OIDC Authentication\n\n![](img/52479dafaefba00517c48a137e037b7e_93_0.png)\n\
    \nFigure 3.7 – OIDC authentication process\n\n我提到过需要区分 Adrian、Dave，现在是 Jannick，因为他们登录\
    \ Consul 系统。这是为了区分每个个人在审计日志中执行的操作。这并不是为了站在后面指责，而是为了确保流程得到遵循并且系统中的更改得到跟踪。\n\n在\
    \ Consul 服务器中启用审计日志非常简单。启用后，Consul 将输出条目以跟踪谁做了什么以及何时做，所有内容都写入文件。别担心——不会包含机密信息，这使得启用\
    \ OIDC 等身份验证方法以唯一区分用户变得更加重要。日志以 JSON 格式写入文件，可以被大多数日志分析实用程序（如 DataDog、Splunk 和\
    \ Elasticsearch）摄取。但是，在配置日志记录时，请务必设置日志文件数量和轮换频率的限制……没有人喜欢承认自己因日志记录而耗尽了空间！\n\n\
    ```\n```hcl\naudit {\n  enabled = true\n  sink \"consul_audit\" {\n    type  \
    \ = \"file\"\n    format = \"json\"\n    path   = \"data/audit/audit.json\"\n\
    \    delivery_guarantee = \"best-effort\"\n    rotate_duration = \"24h\"\n   \
    \ rotate_max_files = 15\n    rotate_bytes = 25165824\n  }\n}\n```\n```\n\n日志文件的输出标识了几个重要的信息，特别是时间戳和令牌访问者。此访问者可以链接回访问系统的个人令牌和角色（因此是用户）。我个人发现审计日志中的源\
    \ IP 地址非常有趣，尤其是当我可以进行地理关联并确定谁从世界各地访问系统时。当然，条目还包括他们对系统做了什么！\n\n```\n```json\n{\n\
    \  \"created_at\": \"2020-08-25T10:35:23.258765383Z\",\n  \"event_type\": \"audit\"\
    ,\n  \"payload\": {\n    \"id\": \"3a880e2b-3f43-5d4d-97a6-26aec5eacc0c\",\n```\n\
    \n```\n```json\n\"version\": \"1\",\n\"type\": \"HTTPEvent\",\n\"timestamp\":\
    \ \"2020-08-25T10:35:23.258548744Z\",\n\"auth\": {\n  \"accessor_id\": \"48162132-6b28-de21-aee9-6903d2024f2e\"\
    ,\n  \"description\": \"token created via OIDC login\",\n  \"create_time\": \"\
    2020-08-25T10:35:23.158336091Z\"\n},\n\"request\": {\n  \"operation\": \"GET\"\
    ,\n  \"endpoint\": \"/v1/catalog/datacenters\",\n  \"remote_addr\": \"172.17.0.1:48516\"\
    ,\n  \"user_agent\": \"Mozilla/5.0 (Macintosh; Intel Mac OS X 10_14_6) AppleWebKit/537.36\
    \ (KHTML, like Gecko) Chrome/84.0.4147.125 Safari/537.36\",\n  \"host\": \"192.168.64.243:31394\"\
    \n},\n\"stage\": \"OperationStart\"\n}\n```\n```\n\n正如你所见，启用这些审计日志是操作和管理任何企业中的\
    \ Consul 系统的一个关键方面。因为我们只是正在学习系统的从业者，所以它并不那么有趣（我们应该知道我们做了什么以及何时做，尽管我承认我可能比应该更频繁地使用\
    \ Bash 历史记录）。然而，当 Consul 推广到企业环境时，跟踪这些操作与确保系统实际运行一样关键！说到运行，我希望你准备好了。我强烈建议此时你起身走走或伸展双腿，因为接下来会变得相当复杂。\n\
    \n## Securing your Consul cluster\n\n在开始保护你的集群之前，我需要提出一个警告。当你处理安全执行时，事情可能会变得有点棘手，尤其是在你不小心将自己锁在自己的集群之外时。幸运的是，我们只是在这里使用一个简单的开发系统。然而，在生产环境中，必须格外小心。我已尽可能自动化，但在此过程中的任何时候，你都可以销毁整个基础设施集并重建它。啊，Terraform\
    \ 和临时基础设施的奇迹和美丽！\n\n"
