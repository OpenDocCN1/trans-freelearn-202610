    ## 6 Connect Four or More


    This is it! All that you have read so far has led you to this point. I know I''ve
    said that before, but it is true. Everything you have read in this book has led
    you to this point. Regardless, welcome to the world of service mesh. Any engineer
    with a background in routing and networking appreciates the power of the service
    mesh. For years, we have focused on connecting machines, allocating or identifying
    the addresses, and segmenting them into subnets, switchports, and route tables.
    This functionality is still required, of course; however, much of it is now defined
    as Infrastructure as Code and is programmatically managed by public or private
    cloud operators. Now we have a chance to bring the conversation up a level, quite
    literally, so we are no longer connecting strings of numbers, but we are connecting
    the services directly. In this chapter, we''re going to be meshing with the following
    topics:


    - Connecting our services within the mesh – In the last chapter, we learned how
    to discover our services. Now we are going to learn how to get them communicating
    with each other through the service mesh.

    - Connecting our services outside of the mesh – It is unrealistic to think that
    everything you could ever interact with would reside within the service mesh.
    Therefore, we need to look at how to enable and manage connections with external
    entities.

    - Securing the mesh – If all the mesh did was allow service-to-service communication,
    it would be pretty cool, but not very useful in my opinion. Once you have a service
    mesh enabled, you can uniquely secure, and easily disable and enable, each service
    connection.

    - Mesh to mesh – Much like the assumption that all services will exist in a mesh,
    it is also unrealistic to assume that there will be a single mesh to rule them
    all! As we extend our network and services, we will need to connect multiple service
    meshes, providing a mesh of meshes. Yup, we''re going to get meshy!


    The progression we''ve laid out here isn''t only good for education, but it provides
    a logical path for service mesh adoption within any network as well. Without any
    further delay, or puns, let''s connect four, or more!


    ### Technical requirements


    In this section, we''ll be deploying a full Consul cluster to **Amazon Web Services
    (AWS)** using Terraform. If you''ve already gone through *Chapter 2, Architecture
    – How Does It Work?*, set up your AWS account, downloaded Terraform, and cloned
    the repository, you''re in great shape!


    Within the `ch6` folder of the repository, we have a similar structure as for
    the `ch2` folder, providing the code for creating the image and, of course, creating
    the Consul cluster. If you would like to follow along, use `ch6` to create a new
    Consul cluster, which includes some of the service configuration files you''ll
    utilize within this chapter.


    Before we walk through the code and functionality within this chapter, it might
    be useful to revisit *Chapter 2, Architecture – How Does It Work?* and review
    the steps required to deploy and access our infrastructure.


    ### Connect services, not addresses


    Whether you take the red pill or the blue pill, the network that we live in can''t
    be refuted. The medium or the base layer connection isn''t always recognized.
    After all, for most of 2020, and at least half of 2021, many of us have been living
    through connected machines. Nearly every phone out there today resides on some
    sort of computer network, identified by an assigned address. However, as consumers,
    we don''t really care about that address, at least not directly. The functionality
    that provides and maintains that address only exists to allow our applications
    to communicate. Looking at the communication path as a whole, there are other
    aspects beyond that assigned address that are required, for example, some sort
    of physical connection and identification. Each of these aspects functions as
    a layer in what is called the **Open Systems Interconnection (OSI)** model.


    Unless you''ve been playing with cables and switches for the last several years,
    this may be a new concept. So, before we talk much more about the service mesh,
    I want to get a baseline of networking laid out. Don''t worry, we aren''t prepping
    for a Cisco Certified Internetwork Expert exam.


    ### Understanding the network connection


    When our applications communicate with each other, the messages that are transmitted
    need to travel through a variety of mediums. When we open up our favorite video
    conferencing software, the application connects with a server on the other side.
    I think we all can understand that. But what facilitates that communication? We
    can say it just goes over Wi-Fi, but what does that really mean? Well, the application
    software and the Wi-Fi are just layers within the communication path. Thankfully,
    we aren''t dealing with the number of layers of an onion, or an ogre. And we''re
    even going to simplify the number of layers for our discussion as well.


    ![](img/52479dafaefba00517c48a137e037b7e_169_0.png)


    Figure 6.1 – Vidona connection over Swampnet


    Take a look at Figure 6.1. Due to a pandemic in the swamp, Shrek and Donkey haven''t
    been able to see each other for quite some time. However, they''ve discovered
    a new application, Vidona, that allows them to see each other virtually. When
    Donkey calls Shrek, the message originates in Vidona, the application in use.
    That message flows through a channel and is wrapped up in an envelope with Shrek''s
    address, and Donkey''s return address. The message then flows down to the physical
    layer. Although we can''t feel Wi-Fi signals (wouldn''t that be wild if we could?),
    the Wi-Fi radio exists physically. In order to send the message on the Wi-Fi radio,
    it is packaged in another envelope, with a different address representing Donkey''s
    physical tablet.


    Now we have two addresses: a **network** address and a **physical** address. The
    **physical** address doesn''t change (usually). It is associated with Donkey''s
    tablet, and it helps the tablet talk to the components it is *physically* connected
    to (even if wirelessly). Meanwhile, the **network** address identifies Donkey''s
    tablet as a globally unique entity, which is what Shrek''s computer will use to
    respond to Donkey''s tablet. Note a very important distinction here; Donkey''s
    **Vidona** application requires knowledge of Shrek''s network address in order
    to connect, and the network address changes over time. Furthermore, if Donkey
    and Shrek want to keep their communication secret from the eyes of Lord Farquaad,
    **Vidona** must develop its own security mechanisms. This may be challenging for
    the developers of **Vidona** alone, and when other applications need to participate
    in this secure communication, it becomes even more difficult. Ultimately, however,
    the goal is to provide a secure connection at the Application layer, the **Vidona**
    layer, as shown in Figure 6.2:


    ![](img/52479dafaefba00517c48a137e037b7e_170_0.png)


    Figure 6.2 – Vidona secure connection


    The important distinction between Figure 6.1 and 6.2 is that although the underlying
    network flow does not change, the **Vidona** application is able to communicate
    among peers in a seemingly direct and secure manner. As **Vidona** controls both
    sides of this particular example, utilizing its own built-in security mechanisms
    may be sufficient. However, once you mix applications and services, this continuity
    breaks down.


    As part of our conversation moving forward, we''re going to be referring to various
    layers within the networking world. At the beginning of this chapter, I referred
    to the OSI model, which consists of seven layers, as shown in Figure 6.3:


    ![](img/52479dafaefba00517c48a137e037b7e_171_0.png)


    Figure 6.3 – Network OSI model


    For our purposes, we are going to focus primarily on the top three layers, Application,
    Presentation, and Session, which we will collectively refer to as the Application
    layer. The Transport layer, as well as the Network layer, do come into play as
    well, however, these are at the machine level of communication.


    With that basic understanding of the networking stack, let''s take a look at why
    simply relying on that stack just isn''t enough for today''s cloudy world.


    ### Why traditional networking isn''t enough


    In the realm of zero-trust, we can''t just implicitly assume that anything operating
    on a single machine is friendly. Nearly every week we hear about a security event
    that originated with the assumption that an entity was trusted, and yet it was
    compromised. The concept of zero-trust, or least privilege security, focuses on
    the identity and the security of what we truly care about, the application. If
    our server, or system, is hosting multiple applications, we need a standardized
    way to uniquely identify, and secure, each of those applications. To illustrate
    this point, I''m going to revisit the common phone number analogy.

