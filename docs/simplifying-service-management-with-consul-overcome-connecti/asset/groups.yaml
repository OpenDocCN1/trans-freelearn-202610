    # 5

    Little Bo Peep

    Lost Her Service


    This is it! The moment we''ve all been waiting for! All of those horrible dad
    jokes and puns are about to pay off as we actually start putting all of this tremendous
    knowledge to use! At the very foundation of every Consul use case is the discovery
    and sharing of service information. We''re ready to focus our energies more on
    *why use Consul*, instead of *what is Consul*. To understand the why for this
    initial use case, let''s look at the age-old nursery rhyme of *Little Bo Peep
    who lost her sheep*. However, as you may have guessed, instead of losing sheep,
    we''re losing our service!


    Little Bo Peep is tending to her flock of sheep, all free on the hillside. It
    is easy for her to monitor the sheep while they are confined to their pen. They
    can only roam so far, and as long as she controls those gates of the pen, there''s
    no problem! As time goes on, she starts to learn that her sheep can provide much
    more bountiful wool, not only to her but to others, when they are left to roam.
    Furthermore, as she allows those sheep to nomadically roam, she finds providing
    food and water for the sheep is dramatically more efficient. So, what does she
    need to manage these sheep without corralling them into their pen?


    +   - **Location:** Of course, she needs some sort of method to track and locate
    the sheep. She can solve this by installing **Global Positioning System (GPS)**
    trackers in each one of them so she can locate them if necessary.'
  - '[PAGE 148]


    +   - **Health:** She needs to know that her sheep are healthy! If one isn’t feeling
    well, she needs to tend to it, and just as important, make sure nobody shears
    that sheep for its wool!

    +   - **Discovery:** So she knows where they are and how they are feeling, but
    how is she going to let other people find the sheep? Will she just announce it
    periodically, hold up a sign, or maybe offer a hotline with celebrity guests?


    As we dig into this chapter, we’re going to see just how Consul solves these three
    key challenges for Little Bo Peep and her lost sheep, I mean, service.


    # Technical requirements


    Within this section, we’ll be deploying a full Consul cluster to **Amazon Web
    Services (AWS)** utilizing Terraform. If you’ve already gone through *Chapter
    2, Architecture – How Does It Work?*, set up your AWS account, downloaded Terraform,
    and cloned the repository, you’re in great shape!


    There are no specific steps throughout this chapter; however, it may be very useful
    to have a simple running Consul cluster (such as that from *Chapter 2, Architecture
    – How Does It Work?*), along with the services provided, to navigate and play
    with the services!


    # Dude, where''s my service?


    The first of Little Bo Peep’s challenges that we’re going to address is simply
    to determine the location of her sheep, or in this case, her service. In our analogy,
    Little Bo Peep has installed GPS trackers in each of her sheep. However, the GPS
    at its core only provides the longitude and latitude of a given point. It alone
    doesn’t give you any information about that point, only that it exists. If she
    stops at simply installing the trackers, she hasn’t really solved the problem,
    has she? At a very high level, she can see that a GPS tracker exists in a particular
    location. However, what she doesn’t yet know is which sheep exists at that location.
    She also needs some sort of receiver to maintain the location of all of those
    GPS coordinates. This comes down to service definition and centralized service
    registration.


    Every service in every network has some sort of definition. Some aspects of the
    definition could be very high level, such as a name or a purpose. Other aspects
    of the definition can be incredibly detailed, such as on what address the service
    can be reached and on what port it is listening. Historically, this information
    could be maintained in a database, spreadsheet, or sticky note in somebody’s cubicle.
    Regardless of where it was kept, however, it needed to be fully defined. Consul
    is no different.'
