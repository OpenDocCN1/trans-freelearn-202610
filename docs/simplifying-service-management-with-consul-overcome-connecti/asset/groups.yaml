  - "[PAGE 165]\n\nAs noted previously, all checks can be operated at the command\
    \ line, which is a great way to learn more about the operation and results of\
    \ the check. The results of the check are JSON formatted to facilitate parsing\
    \ of the data, which can be useful for alerting other components of the service\
    \ availability. For something such as the Consul services watch, the results are\
    \ very high level, as in the following example:\n\n```\n```json\n{\n    \"consul\"\
    : [],\n    \"httpd\": [\n        \"python-server\"\n    ]\n}\n```\n```\n\nMeanwhile,\
    \ the output for the service specific watch is quite more elaborate. The following\
    \ example results have been truncated for brevity.\n\n```\n```json\n{\n    \"\
    Node\": {\n        \"ID\": \"494c2e14-5442-0339-6bbd-fa84254f5aa5\",\n       \
    \ \"Node\": \"ip-192-168-100-124\",\n        \"Address\": \"3.128.24.217\",\n\
    \        \"Datacenter\": \"dc1\",\n        \"TaggedAddresses\": {\n...\n```\n\
    ```\n\nIf we want to find which nodes are running the `httpd` service we are using\
    \ in our examples, we can easily parse the JSON result from the query. Additionally,\
    \ we can add a `passingonly` Boolean parameter to indicate that we only want to\
    \ retrieve nodes that are hosting healthy instances of the `httpd` service:\n\n\
    ```\n```bash\nconsul watch -type service -service httpd -passingonly true |\n\
    jq \".[] | .Node.Address\"\n```\n```"
  - "[PAGE 166]\n\nOf course, these examples are all interactive with the Consul service,\
    \ and it only provides the results of the watch. The following example specifies\
    \ a checks type watch that will call the `check-handler.py` Python script whenever\
    \ the check is executed:\n\n```\nwatches = [\n    {\n        type = \"checks\"\
    \n        service = \"httpd\"\n        args = [\"/etc/consul/consul.d/check-handler.py\"\
    ]\n    }\n]\n```\n\nIn order to notify the external applications or services of\
    \ the check results, including the location of our healthy services, the handler\
    \ is able to post this information out to a multitude of services. One potential\
    \ option is to update a messaging queue that services are subscribed to, such\
    \ as **RabbitMQ** or **ActiveMQ**. Once Consul posts the service information,\
    \ any component that is listening on the respective queue can retrieve the information.\n\
    \nThere we have it! Throughout this section, you've learned three different ways\
    \ to obtain information about the services within the Consul catalog, starting\
    \ with DNS, which appeared to be the most straightforward, leading to the direct\
    \ API integration, through to a notification mechanism that can notify just about\
    \ anything or anybody!\n\n# Summary\n\nI hope you enjoyed this chapter…the topic\
    \ of defining and managing our services isn't a horribly complex one, but it is\
    \ critically important for the healthy operation of any dynamic network. A huge\
    \ advantage of our cloudy world isn't the existence of cloud computing; it is\
    \ how being able to quickly create and remove resources changes our human operational\
    \ model. Unfortunately, that flexibility does mean our services have the ability\
    \ to migrate and roam amongst the clouds. Using our basic example, we were able\
    \ to register our `httpd` service within the Consul system, ensure that the service\
    \ is healthy, and review the different methods that can be used to discover that\
    \ service. Now would be a good time to take a break and play with the Consul system,\
    \ as the next topic, *service mesh*, has quite a few more working pieces to it.\
    \ Hang on…things are about to get meshy!"
