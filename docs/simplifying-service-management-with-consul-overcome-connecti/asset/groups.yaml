    This assumes that we have simple scripts created that evaluate the resources,
    taking into consideration the limits and thresholds as variables. If any one of
    these scripts results in 1, the node will be considered in a warning state. In
    order for the node to be deemed healthy, the output of all scripts must be 0.


    There we have it. As you can see, Consul supports a myriad of health check protocols
    to ensure service availability. The heart of Consul''s functionality resides in
    its service catalog; therefore, accurate understanding of the health of the services
    associated with a particular agent is a critical function of the system.


    So, at this point, we have a service catalog, and we''re able to validate that
    our services are healthy and ready to be utilized. Next, we''re going to see how
    our applications can discover those services.


    # Methods of discovery – no lawyers required


    Whenever I hear the term discovery, I can''t help but think about all of the lawyer
    shows and movies that reference the process. Thankfully, we don''t require lawyers
    as part of the discovery process, but there are several methods available to discover
    what services our catalog offers. Let''s see some of them in the following sections.


    # DNS


    The easiest way for any application to discover the location of services is the
    same way they''ve been doing it for years, utilizing DNS. By default, Consul offers
    DNS on port 8600 on every agent within the Consul cluster. Every node and service
    can be queried utilizing a Consul domain. For example, if we want to find the
    address(es) for the nodes hosting the httpd service, we can execute the following
    command (using the IP address of a Consul node, of course):


    ```

    $ dig @192.168.100.20 -p 8600 httpd.service.consul

    ```'
  - '[PAGE 162]


    Focusing on the answer section of the query, we can validate that two addresses
    have been returned on which the httpd service can be found:


    ```

    ; ; ANSWER SECTION:

    httpd.service.consul. 0 IN A 3.20.237.142

    httpd.service.consul. 0 IN A 13.59.70.71

    ```


    *Hey Rob, everybody knows that DNS utilizes port 53, why don’t you just use that
    for Consul DNS?* This is an excellent question and is associated with the privileges
    under which Consul is running. In order to attach an application or service to
    port 53, a well-known port, the application requires privileged access. I don’t
    recommend operating Consul (or most applications) with that level of access within
    any production environment. *Well, how are we going to make use of this now?*
    Don’t worry, young Padawan…there are a few options here.


    Within most systems, there exists a plethora of DNS-based services that may be
    deployed not only to manage the name resolution for that particular node but also
    to help that node find other nodes within the network. This includes utilities
    such as BIND, dnsmasq, Unbound, and systemd-resolved. As some of these solutions
    may result in only resolving the Consul domain, there is a parameter within the
    Consul agent configuration entitled recursers. This enables Consul to send any
    DNS queries that it cannot resolve up to another DNS.


    # API


    Compared to the utilization of DNS, accessing services via the API is incredibly
    simple. However, from the application side, this does require some level of development
    for service discovery. Along with the API, Consul provides an extensive filtering
    mechanism in order to manage the criteria utilized to discover the service. Attributes
    on which we can filter include tags for the service and node, metadata for the
    service and node, addresses, and the data center. In the following example, we’re
    filtering based on the ServiceTags that are associated with our httpd service:


    ```

    curl http://18.189.17.157:8500/v1/catalog/service/httpd ''filter=ServiceTags ==
    "python-server"'' | jq

    ```'
