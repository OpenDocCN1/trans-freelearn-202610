    \  \"3.128.180.154\",\n    \"18.117.157.22\",\n]\n```\n\n```\n\"LockIndex\": 0,\n\
    \"Key\": \"son/seventh/gift\",\n\"Flags\": 0,\n\"Value\": \"Y2hxaXJ2b3lhbmN1\"\
    ,\n\"CreateIndex\": 194,\n\"ModifyIndex\": 194\n}\n]\n```\n\n但等等，那个值不是我们输入的值！你是对的，这是我们在\
    \ Consul 的其他区域看到的 base64 编码值。这允许我们在 KV 存储的值中访问更复杂的数据。如果我们想在一个路径中返回多个值，我们可以在请求上设置递归标志：\n\
    \n```\n$ curl http://18.222.124.50:8500/v1/kv/son/\\?recurse=TRUE | jq\n```\n\n\
    让我们看一下作为此输出一部分提供的一些其他值：\n\n- **LockIndex** – 使用 Consul Sessions，我们能够锁定 KV 存储中特定参数的访问权限，以防止意外覆盖或冲突。\n\
    - **Key** – 这是从 KV 存储根目录到该键的完整路径。\n- **Flags** – 默认值为 0，此参数提供将无符号整数分配给值条目的能力。该值对\
    \ Consul 来说是不透明的，但可能有助于为广泛的 KV 实现提供额外的信息（例如版本）。\n- **Value** – 这是键的值，已编码为 base64。\n\
    - **CreateIndex** – 这里我们有一个数值，提供有关该值相对于其他键或更新的创建时间的一些信息。\n- **ModifyIndex** –\
    \ 这是输出中值得关注的一个值，因为智能状态机可以确定该值自上次查询以来是否已更改。\n\n此信息始终通过 API 返回，不过，如果你想在命令行输出中看到此详细信息，我们可以使用\
