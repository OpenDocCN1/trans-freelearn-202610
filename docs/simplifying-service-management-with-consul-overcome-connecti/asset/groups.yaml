    ```\n\n与客户端类似，我们将验证参数设置为确保使用证书文件验证接收的消息以及发送的消息。那些文件在接下来的几行中配置，但请注意，与客户端不同，我们为每个服务器配置了私钥和公钥。服务器集群必须以安全的方式配置和创建，然后才能使用\
    \ auto_encrypt 配置启用向客户端分发证书。我想指出配置的端口。在此配置中，我们将端口 8500 配置为 HTTP，这就是我们在 *第 2 章，架构\
    \ – 它是如何工作的？* 中使用的方法。然而，我们还具有 HTTPS 配置，端口 8501 专门用于与 Consul 集群的 TLS 通信。因此，如果你禁用\
    \ HTTP（将 `http = -1` 设置），你将通过阻止任何未加密的 HTTP 流量来保护你的 Consul 系统。如果你想看看未认证的网页浏览器尝试与\
    \ Consul 通信时会是什么样子，假设 Consul 系统正在运行，将你的网页浏览器指向 Terraform 输出中提供的 `CONSUL_HTTPS_ADDR`\
    \ 参数之一。你会看到类似以下内容：\n\n![](img/52479dafaefba00517c48a137e037b7e_105_0.png)\n\n\
    图 3.8 – 未授权的 HTTP 访问\n\n## 保持安全、愚蠢，并保护你的集群！\n\n如果你检查证书，你会看到它是由 Consul CA 签发的并且不受信任。这是因为证书没有由官方\
    \ CA 签名；它仅由 Consul 本身签名。\n\n![](img/52479dafaefba00517c48a137e037b7e_106_0.png)\n\
    \n图 3.9 – 用于 HTTP 通信的证书\n\n值得庆幸的是，我们仍然打开了端口 8500，以便无阻碍地与服务器集群通信。\n\n但等等，还有更多！你还记得我们说过保护通信主要有两条路径吗？一条是通过相互\
    \ TLS，使用证书进行 RPC 通信。那我们所有服务器的 gossip 呢？没错，我们也必须保护它，但不用担心，这要容易得多，而且像证书一样，我已经提前为你设置好了。\n\
    \n如果你查看 `consul-common.hcl` 文件，你会看到一个额外的行，其中包含一个简单的参数 `encrypt`。该文件已作为使用 Packer\
    \ 的镜像构建过程的一部分放置在所有服务器上：\n\n```\nlog_file = \"/etc/consul/logs/\"\nlog_level =\
    \ \"DEBUG\"\nencrypt = \"86753098Qr2LsXLcfD+Y+S6RUuzUZsY1ZxdAj5E9c=\"\nencrypt_verify_incoming\
    \ = true\nencrypt_verify_outgoing = true\n```\n\n这个值并不是我凭空编造的——好吧，不完全是。通过使用 `consul\
    \ keygen` 命令，你可以生成一个加密密钥，然后用于加密节点之间的 gossip。由于该参数位于 `common` 配置中，所有节点都使用相同的密钥。我们还确保每个代理都在加密其流量（`encrypt_verify_outgoing`）并且只接受已加密的流量（`encrypt_verify_incoming`）。如果你想更新此加密密钥（强烈建议），你可以使用\
    \ `consul keyring` 命令。\n\n此时，你已经拥有一个完全设置好的 Consul 集群，所有节点之间运行受保护的消息，既用于 RPC 通信，也用于\
    \ gossip 通信。如我之前所述，将证书和加密参数作为构建的一部分包含在内的决定是为了简化流程。根据我的经验，创建和分发证书的过程具有挑战性，如果你没有机器的官方注册域名则更具挑战性。此过程应由你的安全团队完成，因此在设计\
