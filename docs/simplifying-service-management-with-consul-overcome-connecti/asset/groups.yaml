  mdcn: '


    希望你能看到，Consul 所感知到的信息在此场景中扮演着如此关键的角色。当服务被添加、更新和移除时，Consul 服务器集群都能感知到这些变化，这要归功于分布式代理。现在的主要挑战是如何将
    Consul 中的信息传递给网络设备，解决这个问题有几种方法。


    对于网络设备而言，了解服务变化的最直接方法之一，就是让设备通过 Consul 的 API 直接从 Consul 获知这些变化。这一功能已经体现在 Consul
    与 F5 Big-IP 负载均衡器的集成中，使用了 F5 Application Services 接口。每当 Consul 发现网络更新时，负载均衡器都能获知这些更新，并自动调整负载均衡池。尽管这种集成确实需要网络组件为
    Consul API 专门开发功能，但负载均衡器本身并不需要部署 Consul 代理。


    ![](img/52479dafaefba00517c48a137e037b7e_29_0.png)


    图 1.6 – 负载均衡器向 Consul 查询服务更新


    这种集成级别的另一种替代方案是让 Consul 将服务可用性的更新发布到消息服务，如 ActiveMQ 或 RabbitMQ。任何能够接收 HTTP 消息的消息服务或其他应用程序，都可以从
    Consul 接收服务更新，而无需直接查询 Consul。


    ![](img/52479dafaefba00517c48a137e037b7e_30_0.png)


    图 1.7 – Consul 动态更新消息总线


    一种更常见的集成方法是利用 Consul 的模板功能。顾名思义，你可以创建一个配置文件模板，以匹配你需要管理的任何设备。在该模板中，你可以指定需要从 Consul
    获取输入的位置，例如某个端点的 IP 地址。如果你还记得，Consul 会根据它接收到的数据做出智能决策。Consul 服务器从客户端接收到的所有数据，都是构建智能动态网络这个拼图中的一块。一个非常简化的类比就是设置收款人来支付账单。我想我们很多人都做过这种事，肯定比开支票更常见。在我们的银行网站上，我们设置一个收款人——我们每月向其付款的公司或个人。例如，看看我们每月的电费账单，我们支付的金额会随着我的孩子们当月用电量而变化。他们怎么就学不会关灯呢？所以，我们设置好了收款人，我们知道我们要付钱给电力公司。这就是我们的模板。我们所需要的就是应付金额这个数据点。一旦电力公司（客户端）告诉我们（服务器）应付金额，我们就可以填入金额并完成电子支付。希望这会发生在停电之前！


    ![](img/52479dafaefba00517c48a137e037b7e_31_0.png)


    图 1.8 – 出色的模板功能


    不过，模板功能不仅适用于配置文件。除了 Consul 之外，HashiCorp 还有其他几个产品，其中之一就是 Terraform。如果你不熟悉 Terraform，它提供了一种标准化的方法，可以为多个云提供商将系统基础设施定义为代码，同时它也有适用于多个应用程序的
    provider，包括防火墙、负载均衡器、监控系统等。现在，想象一下将 Consul 服务发现的动态特性与 Terraform 的基础设施即代码平台结合起来！


    > **重要提示**

    > Consul 与 Terraform 的同步功能（称为 Consul-Terraform-Sync）在撰写本文时仍处于公开测试阶段，并且仅支持有限的一组合作伙伴模块用于自动化。以
    HashiCorp 的开发速度，当你读到本文时，该功能很可能已得到全面支持。


    ## 架构——它是如何工作的？


    现在，我们已经从管理层面了解了 Consul 是什么，以及它能为我们做什么，接下来我们将更深入地探讨 Consul 系统的架构，了解它是如何工作的。在本章中，我们将自行搭建一个
    Consul 集群，以便更好地理解集群中分发哪些信息、谁负责这些信息，以及它们是如何共享的。本章涵盖的主题包括：


    - **Consul 集群运行** —— 我们已经从理论上了解了 Consul 服务器如何作为集群的大脑运作，以及客户端如何监控服务。现在我们将把这一理论付诸实践。

    - **建立共识** —— 我们将研究 Consul 服务器如何建立共识以选举领导者并维护服务目录。

    - **集群通信协议** —— 集群服务器和客户端之间会发生大量活动。我们将更深入地探讨所有这些信息是如何共享和更新的。

    - **地理分布** —— Consul 内部管理着许多决策，而服务位置不仅仅意味着其背后的**互联网协议（IP）**地址。我们将了解 Consul 还能报告哪些其他服务标准。


    作为我们学习之旅的一部分，我们将使用 Terraform 在 **Amazon Web Services（AWS）** 中创建自己的 Consul 集群。如果你以前从未使用过
    Terraform，也不用担心。我们只需要执行几条基本指令，而且我已经为你写好了所有代码！如果你以前用过 Terraform，请别笑话我的代码；我从来没说过自己是软件开发人员。


    ## 技术要求


    由于你将在此部分中构建自己的集群，因此有一些要求需要满足。不过，我们将在 AWS 中构建所有内容，所以你真正需要的只是能够在命令行环境中运行 Terraform。我将使用
    macOS，但 Terraform 可以在大多数桌面操作系统中运行。在接下来的几个小节中，我们将在 AWS 中设置所需内容，并下载必要的 HashiCorp
    工具。为了能够跟着我们一起操作，如果你还没有 AWS 账户，就需要创建一个。我们将全程使用 AWS 来创建和管理基础设施。我们已经尽力确保搭建这套基础设施的成本尽可能低，但仍有一些事项需要注意，例如：


    - 每天工作结束后，务必执行一次 `terraform destroy` 操作。这确实意味着你第二天继续工作时必须重新构建，但这是关于不可变基础设施的绝佳一课！

