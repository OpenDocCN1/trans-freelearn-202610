  mdcn: "\n\n我们需要做的第一件事是修改服务器配置以启用 ACL。文件的结构已经放置在服务器上，所以我们只需要把它放到正确的位置，然后就可以开始操作了。现在，我们需要在集群中的**每个**服务器上执行这些操作，因为如果你只在一台服务器上启用了\
    \ ACL，你可能会出现狗和猫和谐共处的局面，而我们绝对不能允许这种情况发生！\n\n如果你仍然能看到你的 Terraform 输出，那太好了——请务必将它们复制到一个临时文本文件中以便使用。那里有很多有用的信息。如果你是。\n\
    \n*现在我们有了这个神级令牌，我们需要保存它！无论你把客户端和服务器的 IP 地址复制到哪里，也把这个 bootstrap 令牌复制到那里。* 你永远不知道什么时候需要这种级别的访问权限。然而，我们确实需要为我们的服务器创建一个更合理的令牌。再次强调，我们不希望那个\
    \ root 令牌到处乱飞，虽然我们可以做到非常精细的控制，但我们现在只是设置一下，让我们熟悉使用 ACL 并了解一些相关知识。\n\n所以，我们的第一个目标是为我们的服务器创建一个包含两个简单规则的新策略。我们需要对节点和服务具有写访问权限。作为此过程的一部分，我们需要创建策略文件，这可以通过文本编辑器完成，也可以通过使用以下命令完成：\n\
    \n```sh\ncat > first-policy.hcl << EOF\nnode_prefix \"\" {\n    policy = \"write\"\
    \n}\nservice_prefix \"\" {\n    policy = \"read\"\n}\nEOF\n```\n\n如果你能够正确地复制粘贴（或者如果你使用的是纸质书籍，输入正确），文件应该如下所示：\n\
    \n```hcl\nnode_prefix \"\" {\n    policy = \"write\"\n}\nservice_prefix \"\" {\n\
    \    policy = \"read\"\n}\n```\n\n根据我们的专业知识，我们知道这允许节点写入所有节点级操作，并且能够读取所有服务级信息。使用此文件，我们将在\
    \ Consul 中创建一个策略。这可以通过以下命令完成：\n\n```sh\n$ consul acl policy create -name \"first-token\"\
    \ -description\n\"Server Token Policy\" -rules @first-policy.hcl\n```\n\n此命令的输出应包含所有策略信息：\n\
    \n```\nID:            c034c84d-f4f6-6bb6-4e96-8fc9a4d7dbae\nName:          first-token\n\
    Description:   Server Token Policy\nDatacenters:\nRules:\nnode_prefix \"\" {\n\
    \    policy = \"write\"\n```\n\n请务必再次在三个服务器上重启 Consul，这样所有服务器节点就可以使用它们的新令牌了！\n\
    \n现在我们的服务器节点已经设置好了，让我们看看客户端节点会发生什么。我们网络中有五个客户端节点，当你运行 `consul members` 时，它们仍然都在。这只是因为服务器正在维护与这些机器的连接。一旦这些机器上的\
    \ Consul 服务被重启，该节点将不再能够在服务器集群上注册自己。如果你不相信我，试试看！\n\n你还记得我让你保存的那份 IP 地址列表吗？我希望你能随手拿到，因为我们需要它来访问客户端。让我们打开一个新的终端标签页或窗口，并\
    \ SSH 到其中一个客户端。任何客户端都可以，所以从列表中随便挑一个。我喜欢挑一个有特殊数字的：\n\n```bash\n$ ssh -i rjackson-consul-key.pem\
    \ ubuntu@3.142.52.65\n```\n\n查看服务器的主机名。它就在命令行里：\n\n```bash\nubuntu@ip-192-168-100-77:~$\n\
    ```\n\n在你的服务器上，再次运行那个 `consul members` 命令并查找该主机。它应该在那里，但它即将被禁止进入你的 Consul 世界！重启该客户端代理：\n\
    \n```bash\n$ sudo systemctl restart consul\n```\n\n等一分钟左右，然后在服务器上再次检查 `consul\
    \ members` 输出。你会看到该代理已离开集群，但它仍然在那里！它可能在，但它不再被授权加入集群：\n\n```text\nip-192-168-100-77\
    \   3.142.52.65:8301    left     client  1.9.0\n2                  dc1  <default>\n\
    ```\n\n你觉得那个客户端节点上发生了什么？我们可以通过检查其状态来获得提示。在该客户端节点上执行以下命令：\n\n```bash\n$ sudo systemctl\
    \ status consul\n```\n\n"
