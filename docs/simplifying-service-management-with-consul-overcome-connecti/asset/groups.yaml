  - '[PAGE 42]


    The status of the deployed services and their location is something that isn''t
    needed only by the server, but also by the clients distributed throughout the
    network. Now, this level of communication isn''t anything new, right? The servers
    need to know what''s happening with the clients and the client function in nearly
    any distributed system. However, as these systems scale, you end up with hundreds,
    thousands, or even tens of thousands of clients all trying to communicate with
    the servers. Eventually, the server leader is going to bang the gavel and insist
    on order in the court! With Consul, however, the servers and the clients all gossip
    with each other, using a protocol called—well—**gossip**. The imagination behind
    the names of these protocols is astounding. Utilizing the gossip protocol, clients
    share information about their own services and status with their neighboring clients,
    and the servers are all listening in. You can see an overview of this process
    in *Figure 2.9*:


    ![](img/52479dafaefba00517c48a137e037b7e_42_0.png)


    So, now that we have everybody talking, what are they all talking about? I want
    to know too! Don''t leave me out! In a feeble attempt to maintain some sort of
    focus, we''re going to first discuss the role of the servers and then move on
    to the clients.'
  - '[PAGE 43]


    <!-- no content -->'
  - '[PAGE 44]


    All right—now that we know essentially what happens within a massive cluster,
    let''s take a deeper dive into the protocols used that help make all of this happen!


    # Rafting consensus


    We''ve seen how the Consul servers elect their leader utilizing the **consensus**
    protocol, but what exactly does that mean, and is that all that they do? Well,
    of course they do more; otherwise, this would be a very short section. The consensus
    protocol that Consul utilizes is based on the Raft algorithm (https://raft.github.io/raft.pdf),
    which is based on Paxos (https://en.wikipedia.org/wiki/Paxos_%28computer_science%29).
    If you get the feeling that we are quickly heading down a rabbit hole, don''t
    worry—we aren''t going to keep digging until we hit water.


    # A closer look at leader election


    As you will soon see, a Consul server is configured with a number of other servers,
    which it will Raft up with. This is called the `bootstrap_expect` value within
    the configuration. That number of servers is important to remember, as it will
    come up again. Of course, if a Consul server is going to expect a number of servers
    to Raft up with, it needs to know about them so that is also configured. In order
    to become a leader, a server needs to be elected by a majority of servers within
    the Raft—for example, if you are expecting five servers within your Raft, you''ll
    need at least three to vote for you. This is referred to as a quorum and is a
    critical concept when it comes to the availability of a server cluster. Much like
    with the many meetings that we hold, if you don''t have a quorum of members, you
    can''t really make any decisions. In some meetings, even with a quorum, you can''t
    make any decisions if you don''t have anybody leading! If you aren''t sure about
    how many servers are needed to attain a quorum, refer to the following equation:


    (Number of Servers)/2 + 1 = Quorum


    If the number of servers is the same as the quorum size, there is no protection
    for the cluster. Of course, you can''t have a half of a server, so if you end
    up with a half, just round down. The table in Figure 2.11 might also help:'
  - '[PAGE 45]


    | Number of Servers | Quorum | Failure Tolerance |

    |---|---|---|

    | 1 | 1 | 0 |

    | 2 | 2 | 0 |

    | 3 | 2 | 1 |

    | 4 | 3 | 1 |

    | 5 | 3 | 2 |

    | 6 | 3 | 2 |

    | 7 | 4 | 3 |


    Figure 2.11 – Never fail for quorum


    So, let''s look at how that election is performed. For a really cool animated
    view of the process, the following website is fantastic: http://thesecretlivesofdata.com/raft/.


    Walking through the election, we''re going to look at three servers: **Bart**,
    **Lisa**, and **Maggie**. **Bart** is the first server to recognize consciousness,
    so he submits himself as a *candidate* and sends a request to **Lisa** and **Maggie**
    to become the *leader*. However, before **Lisa** heard **Bart**''s request, she
    sent her own request for candidacy with a leader request to **Bart** and **Maggie**,
    because we all know **Lisa** is smarter.


    You can see an overview of the process in Figure 2.12:


    ![](img/52479dafaefba00517c48a137e037b7e_45_0.png)


    Figure 2.12 – Lisa''s nomination for election


    **Maggie** hears **Lisa**''s request for leadership and responds happily. By this
    time, **Bart**''s request has made it to both **Lisa** and **Maggie**, but alas,
    he is too late. **Maggie** has already voted for **Lisa** (I mean, seriously:
    why would she vote for **Bart** anyway?).'
  - '[PAGE 46]


    <!-- no content -->'
  - "[PAGE 47]\n\nWonderful—we now have a leader for the cluster! However, the election\
    \ of a server leader is only one piece of what Consul actually utilizes the consensus\
    \ protocol for—after all, what is a leader if it doesn't share the information\
    \ it learns?\n\n> **Note**\n> \n> Although this process can move quite quickly\
    \ with only three servers, it only accommodates the failure of a single Consul\
    \ server. You may be thinking: *Wow, I'll just throw in, like, 12 servers and\
    \ I'll be good!* There is a trade-off—as the number of servers in the Raft increases,\
    \ so does the time it takes to achieve a quorum. This not only impacts leader\
    \ elections but also data consistency. Usually, it is recommended to keep the\
    \ peer set of servers between five and seven.\n\n# Data sharing within the server\
    \ peer set\n\nNow that **Lisa** has become the undisputed leader, she is responsible\
    \ for maintaining the information shared with **Bart** and **Maggie**. This information\
    \ is recorded and shared via log entries written by **Lisa**. These log entries\
    \ are what contain the state of our service catalog and leader election process,\
    \ and essentially anything that the server peer set needs to know in order to\
    \ function. It's time to start peeling that onion, but I do hope it doesn't make\
    \ you cry.\n\nWithin the peer set, any server can receive information from the\
    \ clients and share that information with the leader. This information can contain\
    \ a change to the service status on the direct node or even updates to other nodes\
    \ within the cluster. The leader is the only one that updates the log entries;\
    \ however, just because the leader, **Lisa**, knows about some adjustment to the\
    \ service catalog or other components, it doesn't mean that **Maggie** or **Bart**\
    \ have the same information. This is where our quorum comes back into play. Just\
    \ as with *groupthink*, a minimum number of servers within the peer set need to\
    \ agree on what is the reality at that point in time. Therefore, as **Lisa** writes\
    \ an update to her log file, she sends that update to both **Bart** and **Maggie**.\
    \ Until either **Bart** or **Maggie** confirm that they've applied the corresponding\
    \ log entry and the log has been properly *replicated*, the entry is not considered\
    \ to be *committed*. However, once **Lisa** gets confirmation and at least one\
    \ other member of the server peer set (remember—there are three members, so we\
    \ need two to achieve a quorum), we can consider the log entry to be committed\
    \ and we have a new view of the reality."
  - '[PAGE 48]


    All of these exchanges utilize Remote Procedure Calls (RPC) and consensus, as
    displayed in Figure 2.15.


    ![](img/52479dafaefba00517c48a137e037b7e_48_0.png)


    Figure 2.15 – Consensus and RPC connections within the peer set


    I know what you may be thinking: OK, Rob, but what if the logs grow too large?
    This is a valid concern and is managed via a common finite-state machine (FSM)
    within the server peer set. As logs are replicated and committed among the servers,
    the FSM is updated with the current status. When queries are made to the Consul
    server peer set, the leader responds to that query based on the status of the
    FSM. Consul is structured in such a way that any replay of a set of logs will
    result in an identical state. Wow—wouldn’t it be nice if humans were that predictable?
    This creation and maintenance of the state, however, enables Consul to periodically
    snapshot the log entries in order to manage the replicated log size. This snapshot
    is performed without any interruption to Consul services and ensures long-term
    happiness among the peer set.


    # Gossiping serfs


    Now that we understand a bit more about how a server peer set is established and
    operates, let''s take a deeper look into what everybody is gossiping about. Again,
    if we start unpacking where the gossip protocol comes from, it utilizes the Serf
    (https://www.serf.io/) library, which is based on the Scalable Weakly-consistent
    Infection-style Process Group Membership protocol, which has thankfully been shortened
    to SWIM (http://www.cs.cornell.edu/info/projects/pringlass/public_pdfs/swim.pdf).
    We''ve jumped off of the Raft, and we''ve gone swimming!'
