  - '[PAGE 55]


    One of those configuration files includes the common settings that we want across
    all Consul nodes. For our purposes, we''re only going to set this to the log settings.
    We''re going to set these to DEBUG so that we can poke around and learn more about
    what Consul is doing! Have a look at the following code snippet:


    # consul-common.hcl


    ```

    log_file = "/etc/consul/logs/"

    log_level = "DEBUG"

    ```


    At this point, you might want to double-check to make sure your AWS environment
    variables are set. You can do this with the following command:


    ```

    $ env |grep AWS

    AWS_ACCESS_KEY_ID=AFAIKJENNY

    AWS_SECRET_ACCESS_KEY=8675309...

    ```


    Now, we''re ready to build! Execute the simple Packer command shown in the following
    code snippet and take a few minutes to congratulate yourself for packing an image!
    Celebrate with a beverage of choice and relax, as the process will take about
    5 minutes:


    ```

    $ packer build -var-file="variables.pkrvars.hcl" .

    ```


    Reviewing the output, it will look like somebody threw Christmas lights all over
    your terminal. The Packer output is all red and in various shades of green, just
    to make things festive. You''ll see files getting moved over, as well as the operating
    system updating, just to make sure we''ve got all of the latest packages for Ubuntu.
    You''ll also see some lines about provisioning with a shell script. Packer creates
    shell scripts based on those shell provisioning blocks we saw within the Packer
    build definition.


    At the end of the process, you''ll see the location and the Amazon Machine Image
    (AMI) ID for your new image! This is illustrated in the following snippet. Now,
    you can build upon your Consul knowledge in your own image:


    ```

    ==> Wait completed after 5 minutes 52 seconds

    ==> Builds finished. The artifacts of successful builds are:

    --> amazon-ebs.ubuntu-image: AMIs were created:

    us-east-2: ami-079a52bd81f91b201

    ```


    Again, there is no need to remember that image ID, as in our next step, Terraform
    will find it for us!'
