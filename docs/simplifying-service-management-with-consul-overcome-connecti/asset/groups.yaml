    ## 保护通信路径


    不知道你怎么样，但每当我开始阅读有关 AES、TLS、GCM 等文档时，我的眼睛就开始发花。大量的缩写词让我们像追松鼠一样到处乱跑，但这并不能帮助我们保护
    Consul 集群的安全。所以，我的目标是用最少的缩写词来解释我们需要做些什么来保护我们的系统通信。这让我想起高中时我不得不写一篇论文，而且不能用任何形式的动词“to
    be”。谢谢您，法利先生。重要的是要记住，目前我们只关注保护我们的客户端和服务器。保护我们服务的流量并对其进行加密稍后再说，所以请耐心等待。


    在本书的第二章中，我们了解了 Consul 组件之间两种主要的通信模式：**远程过程调用（RPC）** 和八卦协议。但是等等——我们读到的 Raft 和共识机制是怎么回事呢？嗯，所有这些通信都利用
    RPC 通信，并且通过 TCP 传输。八卦协议是代理之间用来相互通信的，如果你还记得的话，它利用的是 UDP。我之所以提到这些，是因为将有两种不同的方法来保护这些通信路径。让我们先谈谈保护八卦协议，仅仅因为那更容易理解一些。


    ### 保护我们的八卦协议


    如果你见过一群人八卦，你就知道他们通常会紧密地聚在一起，以便没有其他人能加入并偷听他们的谈话。当你试图靠近这群人时，突然间，他们的谈话声变安静了，一种不信任感立刻产生。这是因为你可能不是他们认识的实体，或者他们可能不清楚你的立场。如果那些人因为社交距离而在更大的区域里分散开来，那就更容易偷听了。这就是我们在
    Consul 中工作的环境。尤其是在云环境中，要让八卦群体紧密地聚在一起并远离外人和窃听者就比较困难了。


    既然我们明白了八卦者不可能作为一个孤立的群体存在，那么确保他们谈论的内容不被其他人听到，或者至少不被理解的最佳方法是什么呢？让我们给我们的故事加个转折（不是给饮料里加片柠檬）。假设你发现自己身处一群说着你不熟悉语言的人群中。我想我们大多数人都经历过这种情况——即使他们说同一种核心语言，你可能也不明白他们说的某些词。我的妻子在印第安纳州长大，我们搬到波士顿地区时就经历过这种情况，但那是另一个故事了。在这种环境下，你可能会听到人们在说话，但你无法理解他们在说什么。这是一种保持通信开放，但对那些无权接收信息的人保密的好方法。这正是我们在保护我们的八卦代理时所做的。


    Consul 提供了一种生成特殊语言的方法，该语言由一个*加密密钥*定义。这个信息与我们创建的相同，但使用的语言不同。这个密钥被分发到 Consul 集群中的所有代理。即使你有多个集群相互通信，它们也都需要使用相同的语言，因此使用相同的密钥。


    ![](img/52479dafaefba00517c48a137e037b7e_78_0.png)


    图 3.1 – 谁懂苏美尔语？


    此时，你可能会想*但是 Rob，最终人们可以学会一种新语言并破译消息*。你说得对，虽然我们中有些人可能比其他人花更多时间学习不同的语言，但最终，只要我们足够努力，我们就能弄明白。这对于每一个加密密钥、密码和证书都是一样的，这也是为什么定期更换和更新这些安全项目很重要的主要原因。本质上，当八卦者周围的人学会了新语言，我们就要更换语言！当我们开始谈论群体中有几十、几百或几千个八卦者时，要让每个人都学会新语言、同时又不遗漏消息，这可能非常具有挑战性。幸运的是，Consul
    可以为你管理很多这方面的事情，当我们部署新的安全系统时，我们将会看到如何做到这一点。


    ### 保护我们的通话


    与八卦协议不同，当我们给人打电话时（当然，除非是电话会议），通信不会广播给分散的群体。那个对话通常是点对点的，并有一定程度的身份验证，以确认你在和谁说话。这可以是电话号码、来源号码、熟悉的声音等等。当我们研究
    Consul 代理之间的通信时，这个过程非常相似。然而，我们永远不知道是否有人在窃听那个对话。因此，保护我们的通话需要三个步骤：验证谁在呼叫、验证谁被呼叫，以及加密他们之间的消息。


    ![](img/52479dafaefba00517c48a137e037b7e_79_0.png)


    图 3.2 – 安全与不安全的通信


    我们使用 Consul 实现这一点的方式，与你几乎每天打开网页浏览器、登录银行账户并给我汇钱时的做法并没有太大不同。当你这样做时，你的网页浏览器会验证它是否已连接到银行的正确网站。这种验证来自于一个由某个官方权威实体签名的证书，确保你的浏览器相信该网站是有效的。如果你在浏览器中看到过弹出窗口，提示无法验证证书，那意味着该证书不是由已知且被接受的权威机构签名的。当该证书被交换时，浏览器就知道了如何加密流量，以便银行网站能够解密，同样，你的浏览器也知道如何解密从银行传回的消息。然而，我们使用
    Consul 的做法有一点小小的不同。


    让我们再次假设你正在从浏览器访问银行网站的场景。银行网站并不真正关心你在哪里（至少在大多数情况下是这样）。对于 Consul，发起呼叫的代理不仅验证它在呼叫一个有效的实体，被呼叫的一方也会确保呼叫者是有效的。让我们深入探讨一下这个问题，但别担心——我们深入探讨时不会碰到水。


    我们将在本节中大量讨论密钥和证书。如果你从未深入研究过传输层安全（TLS），这可能会有点令人困惑，所以我将使用一些符号来标识服务器、客户端以及公钥和私钥，这些符号基于长寿动画系列片《辛普森一家》中的角色。例如，我们将有三台服务器：Bart、Lisa
    和 Maggie。对于这三台服务器，需要某种受信任的权威机构来标识 Bart、Lisa 和 Maggie；我们将称我们的权威机构为 Marge。


    我们的三台服务器都需要某种方法来传输和接收只有它们自己能理解的消息。如果你还记得我们的电话类比，它们都需要验证谁在呼叫、谁被呼叫，并加密它们之间的消息。所有这些都通过专门为它们制作的证书来完成。现在，如果
    Bart 创建了自己的证书，并将这些证书分发给 Lisa 和 Maggie，它们就可以共享秘密消息。然而，什么能阻止 Homer——那个本不应该接触这些消息的家伙——加入这个群体，分享他自己的证书，并查看这些秘密消息呢？为此，我们需要
    Marge，某种中央权威机构，以确保每个人都使用她授权的证书。我们可以称她为证书颁发机构（CA）。


    Marge 利用她的强大力量，为 Bart 制作了两份证书，为 Lisa 制作了两份，为 Maggie 制作了两份。这些证书有特殊的名称：公钥和私钥。公钥确认了他们的身份，并使他们能够向其他人加密消息，而私钥使他们能够解密他们收到的消息。可选地，Marge
    可以创建特定的限制，例如证书的持续时间，以及允许哪些姓氏使用该证书。例如，如果有个人走进来，其姓氏不是 Simpson，那么他们将无法使用 Marge 的证书。


    Marge 使用她自己的两份证书来制作这些证书；一份标识她的权威机构，我们称之为 chop-chop，另一个秘密成分我们称之为 salt。没有其他人知道 Marge
    的私密秘密，因为如果他们知道了，他们就可以在自己的证书中使用 salt，从而破坏 Marge 的权威性。总而言之，让我们看看我们拥有的证书：


    - porkchop：标识 Marge 具有权威性的证书

    - salt：Marge 用来制作证书的秘密成分

    - bart.public_key：Bart 用来标识自己并向 Lisa 和 Maggie 加密秘密消息的证书

    - bart.private_key：只有 Bart 拥有，并且可以用来解密来自 Lisa 和 Maggie 的消息的证书


