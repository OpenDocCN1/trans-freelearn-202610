  - '[PAGE 17]


    # 1

    Consul Overview – Operation and Use Cases


    Welcome to the wonderful world of HashiCorp Consul, a versatile utility to manage,
    automate, and securely connect all of the services within your network. Thanks
    for joining me on this ride, and I hope we''ll both learn a lot throughout the
    process. Within this chapter, we''re going to be reviewing Consul at a high level
    just to understand its basics and applications; essentially, we''ll be digging
    the foundation and pouring the concrete to create a stable base on which to form
    your Consul structure. And if you''ve ever looked at the leaning tower of Pisa,
    you know that a solid foundation is critical for any important structure! Within
    this chapter, we''ll be learning about the following:


    +   - The Consul system – what are the components and how do they live together
    in harmony?

    +   - Consul service discovery – touching on the foundational use case on which
    all of the other Consul functionality builds'
  - '[PAGE 18]


    +   - Consul service mesh – the basics of Consul service mesh to securely enable
    service-to-service communication

    +   - Network automation – a high-level view of the application of service discovery
    to automate your network infrastructure


    We won''t be getting into any code snippets quite yet, but rest assured they are
    coming. If you''re familiar with the concepts and use cases of Consul, go ahead
    and skip to those chapters – I promise I won''t be hurt (too much). However, this
    would be an excellent chapter to hand your manager when they ask, *what in the
    world are you doing with this newfangled invention?*


    # The Consul system – servers and clients


    Sometimes, in order to understand exactly how something works, we need to understand
    the components involved. After all, within every form of communication, there
    is a transmitter and a receiver, and if we aren''t familiar with either one it
    can be difficult to understand the message. Consul, at its core, is a communications
    engine. It provides a new structure to facilitate the communications of network
    services, not just network devices. If you''ve spent any time in the networking
    field, you''ll have heard terms such as IP address, subnet mask, and gateway address.
    These are all critical components involved in the communications of your network
    devices. However, in the glorious world of the cloud, microservices, and dynamic
    adjustments to the network, these components will change as the network waxes
    and wanes. Throughout this painful process, we''ve learned that the addressing
    system we''ve grown to know and love was simply a means to an end. That end is
    the connection and efficient communication of our services. So how does Consul
    do that? We are about to find out!


    # Consul servers – the master of their domain


    Within almost any operational system or structure, there is a brain. This might
    not be the Brain who, along with his sidekick Pinky, attempts to take over the
    world day after day. We''re focusing here on the brain that makes the decisions.
    The brain that determines whether to have Indian food or Thai food for dinner.
    The brain that figures out what to wear on a particular day. The brain that decides
    which employee gets the biggest raise. Now, at this point, you might be saying
    *computers and applications don''t have brains; they only do what we tell them
    to do.* You are absolutely correct, but that doesn''t mean that the machines don''t
    have the logic and intelligence, even if artificial, to make decisions. In some
    ways, they are superior, as machines and applications are able to focus on logic
    and less on ego and emotion. Right, Mr. Spock? *That is correct, you subservient
    and primitive mammal.*'
