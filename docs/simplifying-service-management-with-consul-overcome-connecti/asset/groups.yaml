  md: "\nAll the code for this section can be found in the following GitHub repository:\n\
    https://github.com/PacktPublishing/Simplifying-Service-Management-with-Consul/tree/main/ch3\n\
    \n## Creating the image\n\nIf you've already forked or downloaded the repository,\
    \ you should have the corresponding folder for this chapter. This is where we'll\
    \ be doing all our work. We are going to be building a new image for this chapter\
    \ that includes all the certificates that have been generated for you.\n\nAs we\
    \ build the system and look at the code, we're going to focus on the differences\
    \ between what we did in Chapter 2, Architecture – How Does It Work?, and what\
    \ we are doing here, simply for brevity. Unless you actually shut down your machine\
    \ or closed your Terminal, you should still have your AWS keys: AWS_ACCESS_KEY_ID\
    \ and AWS_SECRET_ACCESS_KEY. To check whether you still have these set properly,\
    \ run the following command:\n\n```\n$ env | grep AWS\nAWS_ACCESS_KEY_ID=AKIA26CFBA32D6JFVJJB\n\
    AWS_SECRET_ACCESS_KEY=NYaSFhAzZqOq4bqSGJda/Y22Guc3p...\n```\n\nSince you are all\
    \ Packer experts by now, we're going to kick off the build so that we can review\
    \ what we are doing while the image is created. To do that, you need to be in\
    \ the proper folder:\n\n```\n$ cd $github_root/Consul-Up-and-Running/ch3/Image-Creation\n\
    ```\n\nNow, kick off your Packer building using the following command:\n\n```\n\
    packer build -var-file=\"variables.pkrvars.hcl\" .\n```\n\nNow, while the Christmas\
    \ lights are spewing across your screen, let's take a look at the differences\
    \ between what you are building now and what you built in Chapter 2, Architecture\
    \ – How Does It Work?.\n\nThe first thing you might recognize is that in the source\
    \ definition, we have slightly changed the name of the image to be used. This\
    \ is just because we only want to be using this image to understand the security\
    \ aspects of Consul. As we move forward, we will be using the insecure image.\
    \ *But Rob, why would it be insecure?* I've been asking this myself nearly all\
    \ my life! As we will see, once we secure our cluster, it becomes more much difficult\
    \ to utilize and navigate. This is by design because, in a production environment,\
    \ you don't want to make it easier for those nefarious hackers:\n\n```\n```hcl\n\
    source \"amazon-ebs\" \"ubuntu-image\" {\n  ami_name      = \"${var.owner}-secure-consul-${timestamp}\"\
    \n  region        = \"${var.aws_region}\"\n  instance_type = var.aws_instance_type\n\
    \  tags = {\n    Name = \"${var.owner}-secure-consul\"\n  }\n}\n```\n```\n\nWe\
    \ aren't really changing things that drastically, only slightly modifying the\
    \ name to identify it as the secure image base. One of the small changes for the\
    \ secure image is the presence of the CA file, `consul-agent-ca.pem`. Recall that\
    \ the CA confirms that the certificate being used is valid. Marge needs to be\
    \ sure that her kids are all using valid certificates! We could use a provisioner\
    \ to move this file to the machines when we run the Terraform script; however,\
    \ every machine needs the CA file, so we might as well pack that into the image:\n\
    \n```\n```hcl\nprovisioner \"file\" {\n  source      = \"../files/consul-agent-ca.pem\"\
    \n  destination = \"/tmp/consul-agent-ca.pem\"\n}\n```\n```\n\nWe're also going\
    \ to be moving that file to the proper location within Consul as part of our shell\
    \ provisioner:\n\n```\n```hcl\nprovisioner \"shell\"{\n  inline = [\n    \"sudo\
    \ /usr/local/bin/consul -autocomplete-install\",\n    \"sudo useradd --system\
    \ --home /etc/consul/consul.d --shell /bin/false consul\",\n    \"sudo mkdir /etc/consul\
    \ /etc/consul/consul.d /etc/consul/logs /var/lib/consul/ /var/run/consul/\",\n\
    \    \"sudo chown -R consul:consul /etc/consul /var/lib/consul/\"\n```\n\n```\n\
    /var/run/consul/\",\n        \"sudo chmod -R a+r /etc/consul/logs/\",\n      \
    \  \"sudo mv /tmp/consul.service /etc/systemd/system/consul.service\",\n     \
    \   \"sudo mv /tmp/consul-common.hcl /etc/consul/consul.d/consul-common.hcl\"\
    ,\n        \"sudo mv /tmp/consul-agent-ca.pem /etc/consul/consul.d/consul-agent-ca.pem\"\
    \n    ]\n```\n```\n\nAnd that's it! These are seemingly small changes, but we\
    \ should get used to packing our commonalities into the image files to manage\
    \ how we build out our systems in that crazy place called the *real world*.\n\n\
    Next, we're going to build our Consul system. Again, this process is very similar\
    \ to what we did previously. We're going to kick off `terraform apply`, and while\
    \ that is running, we'll take a look at the differences.\n\n## Building the Consul\
    \ cluster\n\nNow that we've built the image, we can use Terraform to build the\
    \ cluster itself. All the Terraform code exists in this chapter's root folder,\
    \ so let's go there:\n\n```\n```bash\n$ cd $github_root/Consul-Up-and-Running/ch3\n\
    ```\n```\n\nAs you may recall, the `terraform.tfvars` file doesn't get copied\
    \ over from what you configured in *Chapter 2, Architecture – How Does It Work?*.\
    \ So, you'll have to make sure you edit it so that it matches your Chapter 2 file\
    \ (or just copy the Chapter 2 `terraform.tfvars` file to the Chapter 3 directory):\n\
    \n# Terraform.tfvars\n\n```\n```hcl\nowner         = \"rjackson\"\naws_region\
    \    = \"us-east-2\"\ninstance_type = \"t2.small\"\n```\n```\n\nNow that we've\
    \ confirmed our variables are to our liking, let's start firing up our infrastructure.\
    \ Remember that to get started, Terraform needs to download any provider-specific\
    \ data necessary. This can be done via the following command:\n\n```\n```bash\n\
    $ terraform init\n```\n```\n\nNext, we're going to run our plan so that we can\
    \ see what changes Terraform is going to make. This will be all new infrastructure,\
    \ so you should just see a bunch of green plus signs:\n\n```\n```shell\n$ terraform\
    \ plan\n```\n```\n\nLet's start building our infrastructure now! Once again, by\
    \ living dangerously (not recommended in production), we can auto-approve our\
    \ `apply` command:\n\n```\n```shell\n$ terraform apply --auto-approve\n```\n```\n\
    \nOK; let's now look at what we are building. Within the definition of the security\
    \ groups within the `main.tf` file, we did make a slight modification to include\
    \ access to port 8501. This is the port that Consul is using for secure communication:\n\
    \n```\n```hcl\ningress {\n    from_port   = 8501\n    to_port     = 8501\n   \
    \ protocol    = \"tcp\"\n    cidr_blocks = [\"0.0.0.0/0\"]\n}\n```\n```\n\nThe\
    \ majority of the changes, however, are where we are creating our AWS server instances.\
    \ The big difference here is that we are pushing our private and public keys for\
    \ each server out to the system. Please note that I'm using very generic certificates\
    \ that were created by Consul. In most instances, you'll want to use specific\
    \ certificates for your environment. As the process of creating and distributing\
    \ the certificates may cause even the most stable person to lose their mind, I've\
    \ done a lot of that for you. If you wish to follow the process of creating the\
    \ certificates, the following command must be run for every server. These commands\
    \ are simply for informative purposes as certificates have already been embedded\
    \ in the infrastructure:\n\n```\n```shell\nconsul tls cert create\n```\n```\n\n\
    You can use this command to create server and client certificates, and even a\
    \ certificate for the CLI to access the Consul system. They would all use the\
    \ same CA file that is also produced by the command. The output would be as follows:\n\
    \n```\n```text\nconsul tls cert create -server\n==> WARNING: Server Certificates\
    \ grants authority to become a\n    server and access all state in the cluster\
    \ including root\nkeys\n```\n\n```\nand all ACL tokens. Do not distribute them\
    \ to production hosts\nthat are not server nodes. Store them as securely as CA\
    \ keys.\n==> Using consul-ca.pem and consul-ca-key.pem\n==> Saved dc1-server-consul-0.pem\n\
    ==> Saved dc1-server-consul-0-key.pem\n```\n\nThis command would need to be executed\
    \ for each of the three servers in the server cluster, and the files would need\
    \ to be transferred over. For simplicity's sake, I've created the certificates\
    \ ahead of time and placed them in their proper positions. A big part of the changes\
    \ that have been made to the Terraform script in the `main.tf` file is due to\
    \ the placement of these files. It can't be stressed enough that in a production\
    \ environment, you should be using certificates provided by your security team\
    \ (or through automation with HashiCorp's Vault):\n\n```\nmain.tfresource aws_instance\
    \ \"consul-server\" {\n  count                       = 3\n  ami              \
    \           = data.aws_ami.an_image.id\n  instance_type               = var.instance_type\n\
    \  key_name                    = aws_key_pair.consul_key.key_name\n  associate_public_ip_address\
    \ = true\n  subnet_id                   = aws_subnet.consul-demo.id\n  vpc_security_group_ids\
    \      = [aws_security_group.consul-demo.id]\n  iam_instance_profile        =\
    \ aws_iam_instance_profile.instance_profile.name\n  user_data = templatefile(\"\
    files/server_template.tpl\", {\n    server_name   = \"${var.owner}-consul-server-instance\"\
    ,\n    server_number = count.index})\n  tags = {\n    Name     = \"${var.owner}-consul-server-instance\"\
    \n    Owner    = var.owner\n    Instance = \"${var.owner}-consul-server-instance-${count.index}\"\
    \n  }\n  provisioner \"file\" {\n    source      = \"files/dc1-server-consul-${count.index}.pem\"\
    \n    destination = \"/tmp/dc1-server-consul-${count.index}.pem\"\n```\n"
