  mdcn: "\n请看以下示意图：\n\n![](img/52479dafaefba00517c48a137e037b7e_49_0.png)\n\n图 2.16\
    \ – Gossip 连接\n\nConsul 集群中的所有成员，无论是服务器还是客户端，都处于同一个“池子”中。这样可以实现对池中所有成员的分布式发现、它们的状态，当然，还包括注册到\
    \ Consul 客户端的任何服务的状态。虽然 gossip 是让所有代理了解集群成员和服务变更的方式，但所有信息仍然是通过直接 RPC 从代理发送到服务器节点的。请记住，peer\
    \ 集合中的任何服务器都可以接收更新，并将其转发给领导者，以便进行法定人数提交和对状态机的更新。\n\n## 纬度的变化\n\n我们已经了解了 Consul\
    \ 如何在集群内共享有关领导者选举、服务可用性变化和节点可用性变化的信息。除了这些项目之外，Consul 始终知道集群中每个节点相对于其他节点的地理位置。这有助于做出智能决策，例如定位离请求实体最近的可用的服务实例。发现机制利用了\
    \ Serf 库提供的网络断层扫描技术。没错——它们不仅互相 gossip 彼此的状态，还知道彼此的位置！奇点即将来临！\n\n## 建立我们的第一个 Consul\
    \ 集群\n\n关键时刻到了！在本章开头，有创建 AWS 账户凭据以及下载 Terraform 的说明。现在，你终于可以把这些工作派上用场了！\n\n> **注意**\n\
    > \n> 本书涵盖了 Consul 在服务器和客户端操作方面的内容。HashiCorp 还提供了托管式 Consul 服务，即 **HashiCorp 云平台（HCP）**，在您自己的生产环境中部署时，这可能是理想的选择。然而，为了理解服务器操作，我们将自行操作。有关\
    \ HashiCorp 托管 Consul 服务的更多信息，请访问 `https://portal.cloud.hashicorp.com/`。\n\n本节的所有代码都在以下\
    \ GitHub 仓库中：\n\nhttps://github.com/PacktPublishing/Simplifying-Service-Management-with-Consul\n\
    \n您可以 fork 该仓库，或者直接下载它并跟着操作。我们将使用该仓库中的代码为每一章构建我们的系统，相关代码位于相应的章节文件夹中。\n\n以下各节包括对我们用来创建\
    \ Consul 集群的 Packer 和 Terraform 代码的回顾。没有必要理解代码的每个方面，但我还是想包含一些解释，以求完整。当您继续操作时，请仔细注意以\
    \ `$` 符号表示的命令。\n\n## 构建镜像\n\n我们将从构建基础镜像开始。为了让我们所有人——毫不夸张地说——在使用镜像和操作 Consul 方面保持一致，我们将一起使用\
    \ Packer 构建一个镜像。但别担心——你需要的所有代码都在仓库里。在 ch2 文件夹中，您会找到另一个名为 Image-Creation 的文件夹。我知道——这个名字很有创意。以下是进入该文件夹所需的代码：\n\
    \n```\n```sh\n$ cd $github_root/Consul-Up-and-Running/ch2/Image-Creation\n```\n\
    ```\n\n这里有几个关键项需要注意。您的构建变量都在 `variables.pkr.hcl` 中定义，如下面的代码片段所示：\n\n```\n```hcl\n\
    variable \"owner\" {\n  type        = string\n```\n```\n\n```\ndescription = \"\
    Owner tag to which the artifacts belong\"\ndefault     = \"packt-consul\"\n}\n\
    variable \"consul_version\" {\n    type = string\n    description = \"Three digit\
    \ Consul version to work with\"\n    default = \"1.9.0\"\n}\nvariable \"aws_region\"\
    \ {\n    type        = string\n    description = \"AWS Region for image\"\n  \
    \  default     = \"us-east-2\"\n}\nvariable \"aws_instance_type\" {\n    type\
    \        = string\n    description = \"Instance Type for Image\"\n    default\
    \     = \"t2.small\"\n}\n```\n\n对于这些变量中的大多数，默认值就可以了。但是，如果您想更改任何默认值，请在 variables.pkrvars.hcl\
    \ 中进行修改。例如，请看下面的片段：\n\n```\nowner = \"rjackson\"\n```\n\n是的——自定义变量就是这么简单！定义我们要构建内容的\
    \ Packer 文件名为 AWS_linux_image.pkr.hcl。让我们快速看一下该文件，看看我们要构建什么。\n\n第 1 到 19 行定义了我们将用来构建\
    \ Consul 镜像的基础镜像。我们利用上述变量文件为名称和区域设置了变量。我们还在 AWS 中筛选合适的 Ubuntu 镜像，如下面的代码片段所示：\n\
    \n# AWS_linux_image.pkr.hcl\n\n```\nsource \"amazon-ebs\" \"ubuntu-image\" {\n\
    \    ami_name = \"${var.owner}-consul-{{timestamp}}\"\n    region   = \"${var.aws_region}\"\
    \n```\n\n```\ninstance_type = var.aws_instance_type\ntags = {\n    Name = \"${var.owner}-consul\"\
    \n}\nsource_ami_filter {\n    filters = {\n        virtualization-type = \"hvm\"\
    \n        name = \"ubuntu/images/*ubuntu-bionic-18.04-amd64-server-*\"\n     \
    \   root-device-type = \"ebs\"\n    }\n    owners = [\"099720109477\"]\n    most_recent\
    \ = true\n}\ncommunicator = \"ssh\"\nssh_username = \"ubuntu\"\n}\n```\n\n第 21-58\
    \ 行实际构建镜像，包括我们需要的所有配置。本质上，我们是获取搜索到的初始镜像，并将我们需要的内容打包进去——因此得名 Packer。在此过程中，我们会移动几个文件供\
    \ Consul 使用：一个定义如何在 Ubuntu 环境中管理 Consul 的服务文件，以及一个将应用于所有 Consul 节点的通用配置文件。我们还执行一些内联配置，指示\
    \ Packer 通过 ssh 连接到节点，并在设置过程中执行一组命令。代码如下面的片段所示：\n\n```\nbuild {\n    sources =\
    \ [\n        \"source.amazon-ebs.ubuntu-image\"\n    ]\n    provisioner \"file\"\
    \ {\n        source      = \"../files/consul.service\"\n        destination =\
    \ \"/tmp/consul.service\"\n    }\n    provisioner \"file\" {\n        source \
    \     = \"../files/consul-common.hcl\"\n        destination = \"/tmp/consul-common.hcl\"\
    \n    }\n```\n\n```\n```hcl\n}\nprovisioner \"shell\" {\n  inline = [\n    \"\
    sleep 30\",\n    \"sudo apt-get update\",\n    \"sudo apt install unzip -y\",\n\
    \    \"sudo apt install default-jre -y\",\n    \"curl -k -O \\\"https://releases.hashicorp.com/consul/${var.consul_version}/consul_${var.consul_version}_linux_amd64.zip\\\
    \"\",\n    \"unzip consul_${var.consul_version}_linux_amd64.zip\",\n    \"sudo\
    \ mv consul /usr/local/bin\"\n  ]\n}\nprovisioner \"shell\"{\n  inline = [\n \
    \   \"sudo /usr/local/bin/consul -autocomplete-install\",\n    \"sudo useradd\
    \ --system --home /etc/consul/consul.d --shell /bin/false consul\",\n    \"sudo\
    \ mkdir /etc/consul /etc/consul/consul.d /etc/consul/logs /var/lib/consul/ /var/run/consul/\"\
    ,\n    \"sudo chown -R consul:consul /etc/consul /var/lib/consul/ /var/run/consul/\"\
    ,\n    \"sudo chmod -R a+r /etc/consul/logs/\",\n    \"sudo mv /tmp/consul.service\
    \ /etc/systemd/system/consul.service\",\n    \"sudo mv /tmp/consul-common.hcl\
    \ /etc/consul/consul.d/consul-common.hcl\"\n  ]\n}\n}\n```\n\n其中一个配置文件包含我们希望在所有\
    \ Consul 节点上使用的通用设置。就我们而言，我们只将其设置为日志设置。我们将这些设置为 DEBUG，以便我们能深入了解 Consul 正在做什么！请看下面的代码片段：\n\
    \n# consul-common.hcl\n\n```\nlog_file = \"/etc/consul/logs/\"\nlog_level = \"\
    DEBUG\"\n```\n\n此时，您可能需要再次确认您的 AWS 环境变量已设置。您可以使用以下命令进行检查：\n\n```\n$ env |grep\
    \ AWS\nAWS_ACCESS_KEY_ID=AFAIKJENNY\nAWS_SECRET_ACCESS_KEY=8675309...\n```\n\n\
    现在，我们准备构建！执行下面代码片段中显示的那个简单的 Packer 命令，然后花几分钟为自己打包了一个镜像而祝贺吧！选择您喜欢的饮料庆祝一下，放松一下，因为该过程大约需要\
    \ 5 分钟：\n\n```\n$ packer build -var-file=\"variables.pkrvars.hcl\" .\n```\n\n\
    查看输出，它看起来就像有人把圣诞灯扔满了您的终端。Packer 的输出全是红色的，并且有各种深浅不一的绿色，只是为了营造节日气氛。您会看到文件被移动，操作系统也在更新，以确保我们拥有所有最新的\
    \ Ubuntu 软件包。您还会看到一些关于使用 shell 脚本进行配置的行。Packer 会根据我们在 Packer 构建定义中看到的那些 shell\
    \ 配置块来创建 shell 脚本。\n\n在过程结束时，您会看到新镜像的位置和 Amazon 系统映像（AMI）ID！如下面的片段所示。现在，您可以在自己的镜像之上构建您的\
    \ Consul 知识：\n\n```\n==> Wait completed after 5 minutes 52 seconds\n==> Builds\
    \ finished. The artifacts of successful builds are:\n--> amazon-ebs.ubuntu-image:\
    \ AMIs were created:\nus-east-2: ami-079a52bd81f91b201\n```\n\n同样，无需记住该镜像 ID，因为在下一步中，Terraform\
    \ 会为我们找到它！\n"
