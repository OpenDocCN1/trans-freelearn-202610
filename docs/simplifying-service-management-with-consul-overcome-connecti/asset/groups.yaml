  mdcn: "\n\n- **事件（Event）**：这专门与读取和写入 Consul 事件的能力相关。本书不会涵盖事件相关的内容，但可以利用事件根据 Consul\
    \ 系统中的变化（包括服务可用性）来执行自定义操作。\n- **键/值（Key/Value）**：控制对 Consul 内分布式键/值存储的访问。规则可应用于读取、写入或列出键及其关联值的权限。\n\
    - **哨兵（Sentinel）**：与犹大牧师乐队那首绝妙的歌曲无关，Sentinel 规则允许我们根据 Consul 结构编写几乎任何可能的规则。Sentinel\
    \ 是企业版功能，且相当高级，因此本书不会涉及。\n- **密钥环（Keyring）**：这是一种无需应用变量的规则类型，因为它特定于密钥环功能。由于密钥环控制着\
    \ gossip 协议的加密密钥，因此对此区域的访问应严格管控。\n- **节点（Node）**：这是一个重要的规则类型。它控制节点级数据，例如目录中的可用服务和节点健康状态。它还可以作为过滤器，将代理级操作限制在允许的集群成员子集内。\n\
    - **操作员（Operator）**：这是另一种无需应用变量的规则类型，用于处理 Consul 中的操作员级操作，例如 auto-pilot 或 Raft\
    \ 特定功能。与密钥环一样，对此区域的访问应严格管控。\n- **预置查询（Prepared query）**：Consul 提供了创建模板的能力，这些模板对于系统中更复杂的服务查询非常有用，包括节点位置、元数据、标签等。本书不会涵盖预置查询。\n\
    - **服务（Service）**：这是另一个需要理解的重要规则类型。该规则类型管理服务级信息，包括对服务目录和服务健康状态的访问。\n- **会话（Session）**：Consul\
    \ 允许你在键/值存储中分配和释放值的锁。这可以在已执行的会话中完成，本书不会涉及这部分内容。\n- **命名空间（Namespace）**：命名空间是另一个企业级功能，支持对\
    \ Consul 集群进行细分。此规则类型允许你为整个命名空间创建由多种规则类型组成的更全面的规则。虽然本书不会过多涉及命名空间，但非常重要的是要理解，包括操作员和密钥环规则在内的几种规则类型不能应用于命名空间。这些功能是全局性的，只在默认命名空间上运行。\n\
    \n正如你所看到的，有很多领域可以应用 ACL 来管理人类、机器或半机械人访问我们服务的权限。这也为控制各个节点提供了大量途径。\n\n当我们谈论安全性时，我们经常使用术语*最小权限*。简单地说（或写），这意味着不是给一个孩子一堆糖果并告诉他们什么不能吃，而是从孩子没有糖果开始，只提供他们能吃的东西。这就是为什么在本节前面，我们讨论了在\
    \ Consul 中实施默认拒绝策略。如果我们将其作为标准安全规则，尤其是结合我们在上一节中讨论的证书，我们就可以进一步加强对各个节点的控制。这大大减少了任何懦夫或窃听者访问或监听我们集群操作的可能性——因为如果你没有秘密握手暗号，你就不会通过。\n\
    \n既然我们已经解决了所有这些问题，让我们看看规则长什么样。我们将在这里查看两条规则，当我们开始实际操作系统时，这两条规则都会用到。\n\n第一条规则为 Consul\
    \ 客户端应用了一个最小策略，使其能够在自身执行操作，并将基础设施的任何变化通知 Consul 服务器：\n\n```hcl\nnode \"ip-192-168-100-11\"\
    \ {\n  policy = \"write\"\n}\nservice \"consul\" {\n  policy = \"write\"\n}\n\
    agent_prefix \"ip\" {\n  policy = \"write\"\n}\n```\n\n在此策略中，我们有三个主要规则，看起来非常简单，但在最小权限模型中，它们的作用至关重要。\n\
    \n策略中的第一条规则使用了节点（node）规则类型。如果没有这条规则，节点就无法向服务器集群更新它看到的服务，更重要的是，无法更新节点的健康状况和位置。如果客户端尝试加入集群，但没有与此规则关联的令牌，服务器集群甚至不会将其识别为客户端。请注意，由于节点规则仅适用于\
    \ ip-192-168-100-11，因此该规则仅适用于此特定节点的操作，因为那是它的主机名。任何其他使用与此策略关联的令牌的节点都不会被 Consul\
    \ 服务器集群识别。\n\n下一条规则属于 `service` 类型，允许我们更新节点本身上的服务目录。这特定于节点本身上的服务，而不是由 Consul 服务器集群托管的整体服务目录。要更新集中式服务目录，我们需要\
    \ `agent` 规则，我们接下来会讨论。请注意，使用此规则，我们可以 `write` 到名为 `consul` 的服务来管理服务更改。如果我们只想读取服务的状态或可用性，我们可以使用\
    \ `read` 指令。\n\n最后一条规则使用了 `agent` 规则类型。这与节点规则类型的重要性类似，它控制着节点功能的非常基本的方面（尽管在这种情况下，它与代理相关）。此规则允许关联令牌的持有者执行代理级功能，例如更新服务目录……这有点重要，因为\
    \ Consul 的一切都围绕着服务。你可能已经注意到这个特定规则定义的一个不同之处：它不是指向某个特定的代理，而是使用了一个微小的变体，称为 `agent_prefix`。正如你可能已经猜到的，这适用于任何主机名以\
    \ `ip` 前缀开头的代理。这提供了一些灵活性，允许你将规则应用于代理组，而不是为每个单独的代理编写规则。然而，这确实让我们暴露了一些，因为该规则并未锁定到某一个特定的代理。可以帮助解决这个问题的一种方法是拥有两条代理规则——一条特定于其所在的主机，使其能够写入代理操作，另一条用于从其他节点读取代理操作：\n\
    \n```hcl\nnode \"ip-192-168-100-11\" {\n    policy = \"write\"\n}\nagent \"ip-192-168-100-11\"\
    \ {\n    policy = \"write\"\n}\nagent_prefix \"ip\" {\n    policy = \"read\"\n\
    }\n```\n\n这是适用于该特定代理的一组非常有限的策略规则。以下策略稍微开放了一些，更适用于服务器集群，使其能够执行诸如写入 ACL、事件等操作：\n\
    \n```hcl\nacl = \"write\"\nagent_prefix \"\" {\n    policy = \"write\"\n}\nevent_prefix\
    \ \"\" {\n```\n\n在这里，与此策略关联的令牌的持有者将能够写入任何以 `ip-192` 开头的主机名，但只能对任何以 `ip` 开头的主机名进行只读访问。\n\
    \n我希望你能看到，Consul 中 ACL 的灵活性允许我们在系统上定义和执行极其具体的规则。我们可以对 Consul 功能的具体领域应用各种控制。其中一些规则对于任何功能正常的系统都至关重要（例如节点或代理类型），但即使是这些规则也应该受到控制，以便它们只应用于特定的分段（主机名、域等）。接下来，我们将看看如何管理那些可以访问我们\
    \ Consul 集群的人类，并跟踪他们在做什么，就像老大哥一样。\n\n正如我们已经看到的，使用 Terraform 来创建和管理基础设施简化了很多这种复杂性。当你开始处理包含数百、数千和数万个节点的\
    \ Consul 集群时（是的，这种规模的集群确实存在），将基础设施作为代码使用的便利性就变得更加必要了。如果你已经厌倦了阅读，想看看所有这些安全功能是如何结合在一起的，请稍安勿躁——我们很快就会讲到。首先，我们需要快速了解一下\
    \ Consul 系统中的审计日志记录，这是任何企业都至关重要的组成部分。\n\n## 打造你的身份\n\n作为服务生产启用的一部分，我们需要处理谁将访问系统以及他们能做什么。这通常被称为**基于角色的访问控制**，或\
    \ **RBAC**。我们还希望能够维护系统的审计跟踪。随着我们走出那个受信任的有围墙花园网络进入云环境，最后这一点变得越来越重要。我无法告诉你，即使在受控环境中，我有多少次不得不回去弄清楚是什么改变以及何时改变破坏了我的系统！为充分披露起见，要实现这一级别的功能，需要\
    \ Consul 的企业版许可证。\n\n实际登录 Consul 系统的过程当然可以通过使用 ACL 进行管理，然后像对待机器一样对待任何人类，给他们自己特定的访问令牌。然而，这些令牌并不像冉·阿让的\
    \ 24601 那么简单。所以，不可避免地会有人把他们的令牌写在便利贴上贴在笔记本电脑上，或者更甚者，把它和最新的猫咪表情包一起通过电子邮件发送给朋友和家人。此外，这只有在某个工程师（会是你吗？）站在公司面前高呼*我不是一个数字，我是一个自由的人！*之前才有效。这时，高层管理办公室里传来癫狂的笑声。一个更好的解决方案是将\
    \ Consul 连接到某种集中的身份验证和授权方法。为此，Consul Enterprise 利用了一种日益增长的集中式身份验证和授权标准——**OpenID\
    \ Connect (OIDC)**。\n\n"
