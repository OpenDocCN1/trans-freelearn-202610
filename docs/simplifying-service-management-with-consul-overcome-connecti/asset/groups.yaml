    \ so that we can easily find them. Do yourself and your IT operations group a\
    \ favor: never deploy infrastructure without associating logical tags! One of\
    \ those tags uniquely identifies the instance as well, which we can use to uniquely\
    \ identify the server. Directly above the tags, there is a user_data field. This\
    \ is pretty important as it calls a template file, server_template.tpl, to configure\
    \ the Consul servers. We're also passing a server_name_tag property to the template\
    \ file to help identify the servers. The code is illustrated in the following\
    \ snippet:\n\n```\nresource aws_instance \"consul-server\" {\n  count        \
