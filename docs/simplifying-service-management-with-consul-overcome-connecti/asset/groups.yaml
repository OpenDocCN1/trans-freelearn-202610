    So, what are we to do with this ominous state file? Well, in the first part of
    this chapter we talked about the functionality available with the distributed
    Consul KV store. So long as we can keep that state file to a manageable size,
    less than 512 KB, we can keep that state file within the Consul KV store. This
    is actually what we are doing with the backend configuration sub-block within
    the terraform block. This not only gives us a distributed storage location that
    we can protect using ACLs but also an indication of changes to the state file
    (remember the ModifyIndex value in the KV response). This does require us to keep
    the state relatively simple, but we really should be doing that anyway, focusing
    the Terraform script used for CTS only on the specific infrastructure we need
    to manage. For example, if I have 10 virtual machines, a Kubernetes cluster, and
    a load balancer, I should only include the infrastructure code for the load balancer
    as part of CTS.


    All of this talk about state and the Terraform configuration may seem excessive,
    but the details here cannot be undervalued. To summarize, keeping our Terraform
    code focused only on what needs to change as a result of the service catalog enables
    the following:


    +   - Centralized and protected storage utilizing the Consul KV store – we have
    Consul available already, so why not use it for this purpose?

    +   - Sensitive information in the state file is kept to a minimum, only related
    to the infrastructure being managed by CTS.

    +   - Faster changes initiated through CTS. With large state files, as a result
    of large infrastructure definitions, it will take Terraform longer to process
    the changes.


    The next block we want to address is the task block. Now we''ll finally get to
    define what we actually want CTS to do! The task block identifies the Terraform
    module that is to be executed as a result of changes to the service catalog. For
    our purpose, the module is incredibly simple, printing out the service nodes and
    relevant information. However, a Terraform module can do just about anything within
    the realm of infrastructure management! A Terraform module can be likened to a
    function within an application, built for one specific purpose. Some modules can
    be quite large (such as creating an entire production HashiCorp Vault system),
    but we''ve already seen that we want to keep the Terraform operation focused.
    Therefore, we want to use very specific modules, such as populating the client
    nodes in a load balancer. The Terraform registry, https://registry.terraform.io/,
    offers a plethora of example modules to be perused.'
