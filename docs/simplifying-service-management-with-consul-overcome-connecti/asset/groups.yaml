    # Contributors


    # About the author


    **Robert E. Jackson** earned his bachelor of science in electrical engineering
    from Purdue University in 1997, and since then has found himself in a multitude
    of pre- and post-sales positions with various successful start-ups, mostly in
    the network access technology space. He has played multiple roles over the course
    of his career, including sales engineer, solutions engineer, integration engineer,
    network engineer, and product manager. Throughout all of these engineering positions
    he never learned to drive a train, but he was able to experience the digital transformation
    from traditional data centers to cloud computing from multiple viewpoints. He
    is currently employed at HashiCorp as a senior solutions engineer, based in the
    northeast area of the United States.


    > *Special acknowledgements to Ancil McBarnett for his continued support and guidance,
    and for taking a chance on an old cable guy. I would also like to thank Patrick
    Roche and Gina Cocivera-Wright for their encouragement – you guys are the best
    cheerleaders. Last but certainly not least I would like to thank Rachael Jackson
    for the weekend, nights, and anxiety-ridden freak-outs throughout the creation
    of this book.*'
  - '[PAGE 4]


    # # About the reviewer


    **Alex Schenck** is a senior solutions engineer at HashiCorp. He holds a BSc in
    information technology, focusing on network engineering, from the New England
    Institute of Technology and an MSc in management from Worcester Polytechnic Institute.
    He has worked as an IT admin, tech support engineer, sales engineer, and solutions
    architect for a variety of organizations, including EMC and Zerto. In his spare
    time, he enjoys flying his 1978 Piper Archer II, learning German as a second language,
    and traveling. He lives in Rhode Island with his wife Melissa and two cats, Maid
    and Butler.


    > > *I would like to thank Rob for giving me the opportunity to be a part of his
    journey in creating this book. Reviewing his content gave me an opportunity to
    grow as a technologist, and you learn a lot about a person through their writing
    style. I am happy to count Rob as a friend and colleague at HashiCorp and I am
    honored to have taken this journey with him.*

    > >

    > > *Thank you to Shagun at Packt as well, for her enormous patience and keeping
    me on track.*


    **Ed Featherston** is a Distinguished Technologist with more than thirty-nine
    years of designing and delivering **Enterprise Architecture (EA)** solutions for
    the most complex technical environments. Ed''s experience has included consulting
    engagements with numerous Fortune 500 companies across a variety of industries,
    including financial services, government, pharmaceutical, and retail. He has significant
    expertise in systems integration, including internet and intranet, client/server,
    and middleware technologies. He''s successfully evaluated current-state architecture
    and business and system requirements and then formulated and supported the architecture
    and integration strategy. Ed''s used best practices and sound processes to rebuild
    IT organizations by integrating and aligning business applications and defining
    roles and responsibilities to achieve optimal business performance and technology
    functionality.


    In recent years, Ed has also expanded his profile to become a leading voice on
    technology industry trends including cloud computing and blockchain. He regularly
    engages in industry conversations on social media channels like Twitter and routinely
    shares learnings, insights, and best practices with his 5,500 followers.'
