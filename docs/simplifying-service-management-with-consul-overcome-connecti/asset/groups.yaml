    如果 Lisa 想给 Maggie 发送消息，她会使用自己的特殊公钥对消息进行加密。Lisa 将该消息发送给 Maggie，Maggie 可以用自己的私钥打开消息，并使用
    Marge 提供的猪排来验证该消息。现在，假设 Homer 可以创建自己的公钥并向 Maggie 加密自己的消息。好吧，该密钥没有使用 Marge 的授权，也没有她的秘密配料。因此，Maggie
    知道要拒绝该消息，而伤心的 Homer 则前往 Moe''s。


    ![](img/52479dafaefba00517c48a137e037b7e_81_0.png)


