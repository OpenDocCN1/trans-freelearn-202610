    ## Summary


    好吧，我真心希望你喜欢这一章。我们已经看到 Consul 如何能够在许多现实场景中扩展到惊人的大量节点。我们看到了 *read replicas* 以及更重要的是
    *Autopilot* 的使用如何使我们能够扩展服务器集群，以支持拥有数万个节点的网络。我相信我最近听说过一家公司在生产环境中运行 Consul，节点超过
    100,000 个！在如此庞大的系统上集中管理所有服务的操作无疑具有挑战性，因此启用命名空间不仅有助于在 Consul 内部扩展应用程序使用，还能随着系统的增长扩展对人类操作的依赖。最后，我们研究了以几种方式联合我们的
    Consul 集群，以帮助跨数据中心扩展我们的服务可用性。正如我从一开始所说的，Consul 实现了组件和服务之间的通信。现在，这些通信路径不再受规模或地理位置的限制。


    到目前为止，我们应该对 Consul 的操作以及集群中各个组件如何相互协作有相当好的理解。在接下来的几章中，我们将更深入地研究 Consul 的用例，以便你开始将所有这些知识应用于价值创造型服务！第一个用例涉及
    Consul 服务发现，这是 Consul 服务提供的最基础部分。


    ## Section 2:

    Use Cases

    Deep Dive


    现在我们了解了 Consul 的工作原理，让我们更深入地研究如何将 Consul 应用于我们的主要用例。我们在第 1 章《Consul 概述 – 操作和用例》中涉及了用例；然而，现在是时候更深入地挖掘并亲眼看看它们如何运作！


    本书的这一部分包含以下章节：


    - Chapter 5, Little Bo Peep Lost Her Service

    - Chapter 6, Connect Four or More

    - Chapter 7, Animate Me

    - Chapter 8, Where Do We Go Now?


    ## 5

    Little Bo Peep

    Lost Her Service


    就是现在！我们所有人都在等待的时刻！所有那些可怕的冷笑话和双关语即将得到回报，因为我们实际上开始将所有这些巨大的知识付诸实践！在每个 Consul 用例的最基础部分都是服务信息的发现和共享。我们准备将精力更多地集中在
    *为什么使用 Consul*，而不是 *什么是 Consul*。为了理解这个初始用例的为什么，让我们看看古老的童谣 *Little Bo Peep who
    lost her sheep*。不过，正如你可能猜到的那样，我们失去的不是羊，而是我们的服务！


    Little Bo Peep 在照看她的羊群，它们自由地在山坡上。只要羊群被限制在羊圈里，她很容易监控它们。它们只能游荡到一定范围，只要她控制羊圈的那些门，就没有问题！随着时间的推移，她开始了解到她的羊群如果被放任游荡，不仅能为她，还能为他人提供更丰厚的羊毛。此外，随着她允许那些羊游牧式地游荡，她发现为羊提供食物和水变得高效得多。那么，她需要管理这些羊而不把它们赶回羊圈，需要什么呢？


    - **Location:** 当然，她需要某种方法来追踪和定位羊。她可以通过在每只羊上安装 **Global Positioning System (GPS)**
    追踪器来解决这个问题，以便在必要时定位它们。

    - **Health:** 她需要知道她的羊是健康的！如果其中一只感觉不舒服，她需要照顾它，而且同样重要的是，确保没有人给那只羊剪毛！

    - **Discovery:** 所以她知道它们在哪里以及感觉如何，但她将如何让其他人找到羊呢？她会定期宣布，举起一个牌子，还是也许提供一个有名人嘉宾的热线？


    随着我们深入本章，我们将看到 Consul 如何解决 Little Bo Peep 及其迷路的羊，我的意思是服务，这三个关键挑战。


    ### Technical requirements


    在本节中，我们将在 **Amazon Web Services (AWS)** 上使用 Terraform 部署完整的 Consul 集群。如果你已经完成了
    *Chapter 2, Architecture – How Does It Work?*，设置了你的 AWS 账户，下载了 Terraform，并克隆了仓库，你就准备得很充分！


    本章中没有特定的步骤；然而，拥有一个简单的运行中 Consul 集群（例如来自 *Chapter 2, Architecture – How Does It
    Work?*）以及提供的服务，对于导航和操作服务可能会非常有用！


    ### Dude, where''s my service?


    我们要解决的 Little Bo Peep 的第一个挑战就是简单地确定她的羊，或在这种情况下，她的服务的位置。在我们的类比中，Little Bo Peep
    在每只羊上安装了 GPS 追踪器。然而，GPS 从根本上只提供给定点的经度和纬度。它本身并不能提供关于该点的任何信息，只知道它存在。如果她仅仅停留在安装追踪器上，她真的解决了问题吗？在非常高的层面上，她可以看到特定位置存在一个
    GPS 追踪器。然而，她还不知道哪个羊存在于该位置。她还需要某种接收器来维护所有这些 GPS 坐标的位置。这归结为服务定义和集中式服务注册。


    每个网络中的每个服务都有某种定义。定义的某些方面可能非常高层次，例如名称或目的。定义的某些方面可能非常详细，例如服务可以在哪个地址访问以及它监听哪个端口。历史上，这些信息可以保存在数据库、电子表格或某人隔间里的便签上。无论保存在哪里，它都需要被完全定义。Consul
    也不例外。


