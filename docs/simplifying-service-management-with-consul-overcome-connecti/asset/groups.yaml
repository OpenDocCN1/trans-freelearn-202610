    \ see the location and the Amazon Machine Image (AMI) ID for your new image! This\
    \ is illustrated in the following snippet. Now, you can build upon your Consul\
    \ knowledge in your own image:\n\n```\n==> Wait completed after 5 minutes 52 seconds\n\
    ==> Builds finished. The artifacts of successful builds are:\n--> amazon-ebs.ubuntu-image:\
    \ AMIs were created:\nus-east-2: ami-079a52bd81f91b201\n```\n\nAgain, there is\
    \ no need to remember that image ID, as in our next step, Terraform will find\
