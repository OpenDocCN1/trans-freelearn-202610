    as it extends supportability beyond `http` servers. If you want to utilize Consul
    for a database, for example, this uses the `tcp` protocol. In this instance, the
    identity of the application encoded within the mTLS certificate is a combination
    of IP address and TCP port. Intentions that manage these connections are called
    layer 4 intentions. If we look at the Application layer, layer 7, we can set intentions
    based on the actual URL utilized within the communication. This is necessary for
    service routing and splitting, which we discussed previously regarding the proxy
    servers.


    One additional important distinction between layer 4 intentions and layer 7 intentions
    is when intention updates become effective. Without delving too deep, when there
    is a TCP connection between client and server, that connection is established
    and remains connected for the life of the communication path. For HTTP, however,
    the connection is only active for the request and response for the information.
    Therefore, layer 7 intentions may become effective much more quickly than layer
    4 intentions. Consul doesn''t tear down existing connections, so only when a new
    connection request is made will the intention have an impact.


    Regardless of the layer at which the intentions are enforced, the configuration
    procedure is identical, and it only requires three pieces of information: the
    name of the service, the source of the communication request, and whether to allow
    or deny the connection. Before we get into the definition of the intentions, I
    want to revisit the ACL section of *Chapter 4, Data Center (Not Trade) Federation.*

