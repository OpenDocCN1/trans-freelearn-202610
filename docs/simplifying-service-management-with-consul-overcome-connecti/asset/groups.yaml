    \ of the `external-node` and `external-probe` parameters, both set to `true`.\
    \ This information informs Consul that the service needs to be monitored by some\
    \ sort of external service manager. Funnily enough, *external service manager*\
    \ happens to be the name of a simple binary daemon that can run alongside all\
    \ of your Consul agents to manage any sort of external query. Before we get to\
    \ that, though, let's get our service registered.\n\nAs not only the service resides\
    \ outside of Consul, but also the node on which that service lies, Consul requires\
    \ a registration of the node, service, and any additional checks via the API.\
    \ We can do this by utilizing cURL and the GitHub service definition JSON file\
    \ from the preceding code:\n\n```\n```bash\n$ curl --request PUT --data @github.json\
    \ http://<consul_http_address>:8500/v1/catalog/register\n```\n```\n\nWith our\
    \ service registered, Consul is just going to assume that all is well in the vcs\
    \ service world and make it available within the service catalog:\n\n![](img/52479dafaefba00517c48a137e037b7e_154_0.png)\n\
    \nSo, we can see that our service has been registered; however, it isn't showing\
    \ as healthy yet. This is because the Consul agent is looking for an external\
    \ service monitor to monitor, um, that external service. When the Consul **External\
    \ Service Manager**, or ESM, is running, that too will show up as a service within\
    \ the Consul catalog. With that service, we can now see that the external GitHub\
    \ service is now reporting to be in a healthy state:\n\n![](img/52479dafaefba00517c48a137e037b7e_155_0.png)\n\
    \nFigure 5.2 – Consul External Service Monitor registered\n\nWhen we look at the\
    \ service details, we can see not only our HTTP check for GitHub returning healthy\
    \ but also an **External Node Status** check returning in a happy and healthy\
    \ state:\n\n![](img/52479dafaefba00517c48a137e037b7e_155_1.png)\n\nFigure 5.3\
    \ – Service checks for the external service\n"
  mdcn: "\nConsul 所感知的每个服务都是由，嗯，服务定义（service definition）来定义的。有人可能会说，等等，你说过这些是自动发现的——为什么还需要配置？这里要说的是，这些服务是自动发现，而不是自动定义。定义以文件形式存在，可以是\
    \ JSON 或 HCL，Consul 能够将其与其他配置文件一起读取。这些文件可以相当复杂，也可以极其简单，具体取决于服务及其功能。我们来看一个到目前为止在我们的工作中已经使用过的服务定义：\n\
    \n## httpd.json\n\n```\n{\n    \"service\": {\n        \"name\": \"httpd\",\n\
    \        \"tags\": [\n            \"python-server\"\n        ],\n        \"port\"\
    : 8080,\n        \"check\": {\n            \"args\": [\n                \"curl\"\
    ,\n                \"localhost:8080\"\n            ],\n            \"interval\"\
    : \"10s\"\n        }\n    }\n}\n```\n\n你可能会注意到，这是一个名为 httpd.json 的文件，其中包含部署在 Consul\
    \ 中的 httpd 服务的定义。当 Consul agent 启动时，它会尝试读取配置文件夹中的每个文件。这些文件可以是实际的 agent 配置、安全配置（如访问控制列表（ACL））或服务定义。这使任何组织都能够让服务开发者编写，或至少深度参与编写其服务定义，并对其进行单独管理。\n\
    \n如果你不想为每个服务单独创建一个文件，Consul 确实提供了将多个服务合并到一个配置文件中的能力。不过，应当注意不要让这些文件过载。毕竟，你能想象一个\
    \ Consul agent 上运行着 100 个服务，却只有一个配置文件吗？\n\n在典型的 Consul 系统中，服务的部署、移除或更新十分频繁。如果你考虑软件开发生命周期，新服务或应用程序的孕育期可能短至几周。在许多此类情况下，可能都需要针对新版本、标签等更新服务定义。理想情况下，每次发布新服务或应用程序时，都会有一个相应的\
    \ Consul 服务定义文件伴随该应用程序一起发布。\n\n当新应用程序或现有应用程序的新版本被部署时，服务定义也会随之更新。如果你使用的是诸如 Nomad\
    \ 这样简单的编排器，它可以将相应的服务定义作为应用程序定义的一部分进行管理，并自动部署。然而，在传统系统中，你通常需要主动选择应用程序运行在哪些节点上，那么用于推送应用程序的任何过程都应该同时推送相应的服务定义。\n\
    \n一旦新定义就绪，相关的 Consul agent 需要简单重载以识别调整后的配置。与大多数配置一样，服务的动态调整不会自动被识别。不过，重载 agent\
    \ 非常简单，可以通过 `consul reload` 命令或 API 调用来完成：\n\n```sh\n$ curl --request PUT $CONSUL_HTTP_ADDR/v1/agent/reload\n\
    ```\n\n在更动态的环境中，Consul API 在这一过程中提供了大量功能。它不能帮助你部署应用程序；但是，所有的服务定义和检查都可以通过 Consul\
    \ API 提供给 Consul agent。这对于那些需要在应用程序部署后对服务定义或该定义的任何方面（包括健康检查）进行修改的环境非常有用。不过，通过\
    \ API 注册服务确实需要一些额外的信息，以便确保 Consul 知道该服务预期位于哪个节点上。请注意下面用于 Consul API 的 `httpd-api.json`\
    \ 与我们之前使用的原始 `httpd.json` 定义之间的区别。需要提供 Datacenter、Node 和 Address 字段，以便告知 Consul\
    \ 该服务预期位于哪个节点上；同时需要提供 CheckId 和 ServiceId，以便将服务定义和检查定义关联起来。这样便可以单独推送服务和检查定义：\n\
    \n## httpd-api.json\n\n```json\n{\n  \"Datacenter\": \"dc1\",\n  \"Node\": \"\
    ip-192-168-100-118\",\n```\n\n```\n\"Address\": \"192.168.100.118\",\n\"Service\"\
    : {\n  \"ID\": \"httpd2\",\n  \"Service\": \"httpd2\",\n  \"Tags\": [\n    \"\
    python-server\"\n  ],\n  \"Address\": \"192.168.100.118\",\n  \"Port\": 8080\n\
    },\n\"Check\": {\n  \"CheckID\": \"httpd2\",\n  \"Node\": \"ip-192-168-100-118\"\
    ,\n  \"ServiceID\": \"httpd2\",\n  \"Status\": \"passing\",\n  \"Definition\"\
    : {\n    \"tcp\": \"localhost:8080\",\n    \"interval\": \"10s\"\n  }\n}\n}\n\
    ```\n\n**重要提示**\n尽管通过 API 定义和管理服务对于 Consul 的程序化管理非常有用，但必须注意，如果 Consul agent 重启，通过\
    \ API 执行的所有目录条目都不会持久化。\n\n## 外部服务\n\n但是，Rob，如果我想让 Consul 感知那些并未直接嵌入 Consul 系统的服务，该怎么办？这对\
    \ Consul 来说并不是问题；只不过，它确实需要一些额外的配置选项，类似于我们在 API 服务定义中所做的那样。让我们考虑这样一种情况：在整个生命周期中，我们希望为开发人员提供一个集中式的\
    \ GitHub Enterprise 服务，同时让他们能够利用 Consul 来发现 GitHub 服务。我将以 **GitHub** 托管的服务平台作为示例，但由于它只是一个\
    \ URL，这个定义可以很容易地适用于多种场景：\n\n## github.json 外部服务定义\n\n```json\n{\n  \"Node\": \"\
    github\",\n  \"Address\": \"www.github.com\",\n  \"NodeMeta\": {\n    \"external-node\"\
    : \"true\",\n    \"external-probe\": \"true\"\n  },\n  \"Service\": {\n    \"\
    ID\": \"vcs\",\n    \"Service\": \"vcs\",\n    \"Port\": 80\n  },\n  \"Checks\"\
    : [{\n    \"Name\": \"http-check\",\n    \"Definition\": {\n      \"http\": \"\
    https://www.github.com\",\n      \"interval\": \"30s\"\n    }\n  }]\n}\n```\n\n\
    请注意，在此服务定义中，我们同时包含了节点和检查信息。\n\n这个定义与我们之前所见不同，其重要特点是存在 `external-node` 和 `external-probe`\
    \ 参数，两者均设置为 `true`。该信息告知 Consul，此服务需要由某种外部服务管理器来监控。有趣的是，*外部服务管理器* 恰好是一个简单二进制守护进程的名字，它可以与所有\
    \ Consul agent 一起运行，以管理任何类型的外部查询。不过，在我们介绍它之前，先来注册我们的服务。\n\n由于不仅服务位于 Consul 之外，承载该服务的节点也位于\
    \ Consul 之外，因此 Consul 需要通过 API 注册该节点、服务以及任何附加检查。我们可以使用 cURL 和前面代码中的 GitHub 服务定义\
    \ JSON 文件来完成此操作：\n\n```bash\n$ curl --request PUT --data @github.json http://<consul_http_address>:8500/v1/catalog/register\n\
    ```\n\n注册服务后，Consul 会认为 vcs 服务领域一切正常，并将其在服务目录中提供：\n\n![](img/52479dafaefba00517c48a137e037b7e_154_0.png)\n\
    \n因此，我们可以看到我们的服务已经注册；然而，它还没有显示为健康状态。这是因为 Consul agent 正在寻找一个外部服务监视器来监视，嗯，那个外部服务。当\
    \ Consul **外部服务管理器**（ESM）运行时，它也会作为 Consul 目录中的一个服务出现。有了这个服务，我们现在可以看到外部 GitHub\
    \ 服务开始报告为健康状态：\n\n![](img/52479dafaefba00517c48a137e037b7e_155_0.png)\n\n图 5.2\
    \ – Consul 外部服务监视器已注册\n\n当我们查看服务详情时，不仅可以看到 GitHub 的 HTTP 检查返回健康，还可以看到一个 **外部节点状态**\
    \ 检查也返回了愉快且健康的状态：\n\n![](img/52479dafaefba00517c48a137e037b7e_155_1.png)\n\n图\
    \ 5.3 – 外部服务的服务检查\n\n"
