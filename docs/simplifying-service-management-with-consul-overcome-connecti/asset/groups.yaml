  mdcn: "\n\n## 创建 Consul 集群\n\n预配置一个基于 Consul 服务的集群实例。\n\n**集群 ID**\n\nwhat-a-cluster\n\
    \n**HashiCorp 虚拟网络**\n\n您的集群将使用您的 HashiCorp 虚拟网络。这将把 HashiCorp 虚拟网络中的云提供商和区域与您的集群部署关联起来。\n\
    \nveganet aws 俄勒冈州（us-west-2）\n\n**Consul 层级**\n\n**开发**\n\n用于测试和开发目的的非生产部署，可连接最多\
    \ 50 个服务实例。开发层级集群拥有 1 个 Consul 服务器。\n\n超小型\n$0.027/小时\n大小\n2 vCPU / 1 GiB 内存\n\
    服务实例\n1-50\n\n准备好部署生产工作负载了吗？添加支付方式以启用标准层级 Consul 集群\n用于生产部署，可连接最多 10,000 个服务实例。标准层级集群拥有\
    \ 3 个 Consul 服务器，跨区域内的可用区复制以实现高可用性。\n添加信用卡\n\n**网络访问**\n\n允许公共连接更便于测试，因为无需更多配置即可连接并与您的集群通信，但安全性较低。\n\
    \n允许从所选网络外部进行公共连接\n不建议用于生产服务器\n\n**Consul 版本**\n\n请指定您希望在集群上安装的 Consul 版本（如果可用）。\n\
    \n**版本选择**\n\nv1.9.8（推荐）\n\n创建集群\n取消\n\n*图 8.4 – 配置 Consul 集群*\n\n一旦您点击那个神奇的蓝色按钮，HashiCorp\
    \ 云平台将开始创建您自己的 Consul 集群，并托管在云端！集群创建完成后，您将看到一个类似于以下截图的屏幕：\n\n![](img/52479dafaefba00517c48a137e037b7e_222_0.png)\n\
    \n*图 8.5 – HashiCorp 云平台中的集群概览页面*\n\n从这里，您可以生成管理员令牌，在 Web 浏览器中访问集群 URL，一切就绪！要添加客户端，请下载客户端配置并将其分发给您的\
    \ Consul 客户端。下载的软件包包含客户端访问系统所需的证书以及任何必要的额外配置，这就是您开始云端 HashiCorp Consul 之旅所需的全部内容！\n\
    \n## 结束\n\n我美丽的朋友，希望不只是唯一的朋友，这就是结束。或者，也许并且希望，这是您 Consul 之旅的开始。如果您有 Consul 的历史，您可能注意到我们遗漏了大量信息，我同意。在创作本书的过程中，我继续从事日常工作，寻找更多需要涵盖的内容。Kubernetes\
    \ 就是一个例子，可能值得单独写一整本书。然而，我确实希望我们为应用 HashiCorp Consul 的多种用途和应用程序奠定了基础。Consul 节点之间的通信路径，可以说是架构中最重要的方面之一，已经得到了一些详细的解释。我们经历了保护\
    \ Consul 集群的过程，不仅确保通信加密，还确保身份验证。我们不希望外人加入我们的群体并监听我们的八卦，对吗？将 Consul 扩展到多个数据中心和区域是架构的下一个合理步骤。当然，一旦我们有了稳定的基础，我们需要确保我们的运营和资本投资获得价值。Consul\
    \ 通过在我们动态且不断变化的世界中进行服务发现来提供这种价值。在这个世界中简单地找到我们的服务往往并不那么简单！一旦我们能够定位我们的服务，我们利用 Consul\
    \ 将它们连接到各种环境（内部和外部）到 Consul 的领域。当然，网络世界确实远远超出 Consul 的领域，但我们可以应用 Consul 的知识来自动化该网络基础设施。最后，尽管\
    \ Consul 几乎可以部署在任何系统上（有些人在树莓派上运行 Consul！），但我们通常不希望在不必要的情况下处理操作系统。HashiCorp 云平台上的\
    \ Consul 提供了快速启动托管 Consul 集群并接入您的服务的能力。\n\n我确实希望您喜欢这本书并学到了一些关于 Consul 的知识。更重要的是，我希望我已经激起了您对许多话题的好奇心。永远不要停止学习！\n\
    \n## 您可能还喜欢的其他书籍\n\n如果您喜欢这本书，您可能对 Packt 的其他书籍感兴趣：\n\n![](img/52479dafaefba00517c48a137e037b7e_226_0.png)\n\
    \n### HashiCorp 基础设施自动化认证指南\n\nRavi Mishra\n\nISBN：978-1-80056-597-5\n\n- 使用 Terraform\
    \ 1.0 有效维护基础设施的生命周期\n- 重用 Terraform 代码以预配任何云基础设施\n- 在多个云提供商上编写 Terraform 模块\n\
    - 使用 Azure DevOps 管道使用 Terraform 工作流\n- 为 AWS、Azure 和 Google Cloud 编写 Terraform\
