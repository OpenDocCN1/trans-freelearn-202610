    So far, we''ve only been working in our default data center, imaginatively named
    dc1. For this example, I''m going to be creating two data centers, Jake and Elwood.
    The data center for the particular Consul agent is defined within the configuration
    with a simple datacenter parameter. Take this, for example:


    ```

    server = true

    datacenter = "Elwood"

    bootstrap_expect = 3

    ```


    I''ve set up a system with three server nodes in each of the two data centers,
    Jake and Elwood. Joining the two data centers is pretty simple within the configuration
    as well as via the command line. Within the configuration, we utilize a retry_join_wan
    command, similar to the retry_join command we already use for the Consul nodes
