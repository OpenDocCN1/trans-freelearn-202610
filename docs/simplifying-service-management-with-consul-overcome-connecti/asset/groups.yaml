    \ The data, however, is fed by Consul clients that are distributed throughout\
    \ the network. These clients may co-reside with the application, or they may travel\
    \ alongside the application watching its every move. Regardless of the location,\
    \ the client is not only a client for the server, but it is also a client for\
    \ the application, representing the application and reporting information about\
    \ the application to the server. This enables Consul’s deployment within the network\
    \ without the need to modify existing applications or services. Furthermore, a\
    \ single client can represent multiple services and applications.\n\n![](img/52479dafaefba00517c48a137e037b7e_21_0.png)\n\
    \nFigure 1.2 – Agent deployment options\n\n> **Important Note**\n> \n> Care should\
    \ be taken when utilizing an external service monitor with the Consul client.\
    \ The data available to the client is reduced in this configuration and it is\
    \ less flexible with respect to migrating services.\n\nThe Consul client not only\
    \ monitors the applications that it is associated with, but it also collects information\
    \ about the distance between itself and other clients within the network. This\
    \ allows the servers to make more intelligent decisions about which instances\
    \ of the applications or services are best suited to serve the impending request.\
    \ The concept is very similar to emergency services when you dial for police or\
    \ the fire service. There is one centralized number that you dial into (that is,\
    \ 911 in the United States), but that centralized number connects you with whatever\
    \ dispatch is closest to your current location. As Voice over IP services spread,\
    \ this was a difficult challenge that increased network intelligence helped us\
    \ overcome."
  - '[PAGE 22]


    # The marriage of server and client


    OK, now that we know what the servers do, and we know what clients do, how does
    this entire system work together? As I''ve mentioned before, Consul is all about
    communication. The Consul servers need to communicate with each other, and the
    clients all need to communicate with the server cluster.


    ![](img/52479dafaefba00517c48a137e037b7e_22_0.png)


    Figure 1.3 – Consul servers and agents living in harmony


    The server communication is pretty manageable. It''s a small dinner party with
    3, 5, or 7 individuals. However, as you scale from tens to hundreds to potentially
    thousands of clients, having all of these clients report back to the relatively
    small server cluster can be quite overwhelming. Our intimate dinner party has
    expanded to a much larger party with tens, hundreds, or potentially thousands
    of guests. Can you imagine all of them wanting to talk to the head table at once!
    However, if the guests were able to chat amongst themselves, they could share
    their own information, discover new things, and only update the head table with
    pertinent and relevant information. In some cases, we might call this chat gossiping.
    Oddly enough, that''s exactly the protocol Consul uses for this interaction, but
    we''ll dig deeper into that in a later chapter.'
  - '[PAGE 23]


    Alright, now we have an understanding of the purpose of the servers, the purpose
    of the clients, and how they interact and communicate with each other. But what
    the heck can we do with this amazingly beautiful system? Why do I even care?


    # Oh where, oh where have my services gone?


    As mentioned previously, one of the biggest problems related to the implementation
    of private and public cloud infrastructures is the fluidity of the network. Back
    in my day, any changes to the network required a myriad of steps. Let''s focus
    on the simple need to deploy a new application. Let''s assume that our application
    has already been written and tested:


    +   1. Review the machine requirements requested.

    +   2. Obtain the number of quotes for the requested machine(s).

    +   3. Submit a purchase requisition.

    +   4. Justify the purchase request with a number of management layers depending
    on cost.

    +   5. Submit the purchase order to the vendor.

    +   6. Wait for the machines to arrive.

    +   7. Decide what IP address we''re going to allocate.

    +   8. Vote on what inventive name we''ll call the machine(s).

    +   9. Determine where in the warm and loud server room we''re going to mount
    the machine(s).

    +   10. Figure out how we''re going to connect the machine(s).

    +   11. Once the machine arrives, install the actual hardware and plug it in.

    +   12. Argue with facilities about where to put the cardboard and leftover packing
    materials.

    +   13. Configure the machine with the allocated network parameters (address and
    name).

    +   14. Troubleshoot routing and address resolution tables.

    +   15. Provide the application team with the address and credentials for the
    server.'
