    在思考 Consul 的大脑时，我们必须关注 **Consul 服务器集群**。查看 *服务器*（server）的同义词，我们会发现 *仆人*（servant），而这正是
    Consul 服务器为分布式 Consul 客户端（我们稍后会讨论）所做的事情。服务器之间也协同工作，由选举产生的服务器做出主要决策，并将这些决策分发给整个集群中的其他服务器。那么，这些我网络中的仆人们会做出什么样的决策呢？


    首先，Consul 服务器做出的最有用的决策之一就是找到服务所在的位置。Consul 所做的一切都基于这样一个前提：不仅需要发现网络上的服务及其位置，还需要将这些信息共享给任何有权请求该信息的实体。如果你回想旧式电话交换台，有人（应用程序）拿起电话，立刻接通中央接线员（服务器）。呼叫者（应用程序）会请求连接某个特定号码（服务），比如
    *特兰西瓦尼亚 6-5000*。接线员（服务器）随后移动那些巨大的插头，将呼叫者（应用程序）与目的地方（服务）连接起来。


    ![](img/52479dafaefba00517c48a137e037b7e_19_0.png)


    图 1.1 – 1945 年左右的人工电话交换台


    但如果我有一些应用程序，我不想让它们找到特定的服务呢？好吧，很高兴你问到这个问题！在某些情况下，你可能会遇到一些人或机器想要联系其他人，与他们谈论延长汽车保修期的事。也许我不想收到这些消息。那么，我会告诉那个中央接线员，不让那些呼叫者联系我，这有点像史前的
    *勿扰电话登记处*。这些决策也由 Consul 服务器根据你的指令来管理。


    好的，听起来 Consul 可以自动做出很多炫酷而智能的决策，但它从哪里获取做出这些决策所需的信息呢？嗯，任何决策都是怎么做出的？员工的加薪可能基于他们的工作表现，同时还要考虑他们是否也在写一本书。我们决定穿什么衣服是基于场合和环境。晚餐吃什么可能基于……嗯，变量太多，无法在此一一列举！我们做出的每一个决策，其质量都取决于我们拥有的数据。Consul
    客户端正提供了这些数据。


    > **重要说明**

    >

    > 在官方 Consul 文档中，有一个 *代理*（agent），可以配置为客户端模式或服务器模式。在本文中，我们将服务器代理简称为 *服务器*，将客户端代理简称为
    *客户端*。


    ## 集群的构成要素


    正如大脑是任何系统中的决策者，也必须有实体来提供数据，并根据决策执行工作。例如，当经理做出决策时，数据很可能由董事会成员、高级管理人员，当然还有团队成员提供。话虽如此，我们都知道真正做所有工作的是团队成员！


    为 Consul 服务器结构做出决策而提供的大量数据分为两类：


    - Consul 配置

    - 网络数据


    当然，配置是由运行 Consul 系统的人员决定的，希望这些配置经过深思熟虑、以代码形式定义并经过同行评审。而数据则由分布在整个网络中的 Consul 客户端提供。这些客户端可能与应用程序同驻一台机器，也可能伴随应用程序运行，注视着它的一举一动。无论位于何处，客户端不仅是服务器的客户端，同时也是应用程序的客户端，代表应用程序并向服务器报告有关应用程序的信息。这使得
    Consul 可以在网络中部署，而无需修改现有的应用程序或服务。此外，单个客户端可以代表多个服务和应用程序。


    ![](img/52479dafaefba00517c48a137e037b7e_21_0.png)


    图 1.2 – 代理部署选项


    > **重要说明**

    >

    > 将外部服务监控器与 Consul 客户端一起使用时，应格外小心。在这种配置下，客户端可用的数据会减少，并且在迁移服务方面灵活性较低。


    Consul 客户端不仅监控与其关联的应用程序，还收集自身与网络中其他客户端之间距离的信息。这使得服务器能够更智能地决定哪个应用程序或服务实例最适合服务于即将到来的请求。这个概念与紧急服务非常相似，比如你拨打报警电话或火警电话时。有一个你可以拨打的集中号码（即美国的
    911），但这个集中号码会将你连接到离你当前位置最近的调度中心。随着 IP 语音服务的普及，这是一个艰难的挑战，而不断增强的网络智能帮助我们克服了它。


    ## 服务器与客户端的结合


    好的，现在我们知道了服务器的职责，也知道了客户端的职责，那么整个系统是如何协同工作的呢？正如我之前提到的，Consul 的一切都关乎通信。Consul 服务器之间需要相互通信，所有客户端都需要与服务器集群通信。


    ![](img/52479dafaefba00517c48a137e037b7e_22_0.png)


    图 1.3 – Consul 服务器与代理和谐共处


    服务器之间的通信相当容易管理。那是一场只有 3、5 或 7 人的小型晚宴。然而，当客户端规模从几十扩展到几百，甚至可能几千时，让所有这些客户端都向相对较小的服务器集群汇报，可能会让人不堪重负。我们私密的小型晚宴已经扩展成一场拥有几十、几百甚至上千位宾客的大型派对。你能想象所有宾客都同时想要与主桌交谈吗！但是，如果宾客们能够互相聊天，他们就可以分享自己的信息，发现新事物，并且只将相关且重要的信息汇报给主桌。在某些情况下，我们可能会称这种聊天为“八卦闲聊”。奇怪的是，这正是
    Consul 用于这种交互的协议，但我们将在后面的章节中深入探讨。


    好了，现在我们了解了服务器的用途、客户端的用途，以及它们之间如何交互和通信。但这个惊人而美妙的系统到底能为我们做些什么呢？我为什么要在意它呢？


    ## 哦，在哪儿，哦，我的服务都去哪儿了？


    如前所述，与私有云和公有云基础设施实施相关的最大问题之一就是网络的流动性。在我那个年代，对网络进行任何更改都需要无数个步骤。让我们聚焦于部署一个新应用这一简单需求。假设我们的应用已经编写并测试完毕：


    1. 审查所请求的机器需求。

    2. 就所请求的机器获取多份报价。

    3. 提交采购申请。

    4. 根据成本，通过相应数量的管理层级为采购请求提供合理理由。

    5. 向供应商提交采购订单。

    6. 等待机器到货。

    7. 决定我们要分配哪个 IP 地址。

    8. 投票决定我们给这些机器起什么有创意的名字。

    9. 确定在温暖而嘈杂的服务器机房中，我们要把机器安装在哪里。

    10. 弄清楚我们如何连接这些机器。

    11. 机器到货后，安装实际硬件并接通电源。

    12. 与后勤部门争论纸板和剩余包装材料应该放在哪里。

    13. 使用分配的网络参数（地址和名称）配置机器。

    14. 排查路由和地址解析表的问题。

    15. 向应用团队提供服务器的地址和凭据。


    '
