  - '[PAGE 188]


    # Mesh gateways


    We''ve seen how we can connect services securely using the service mesh. I like
    to think about mesh gateways as kind of a *super-mesh*. Utilizing WAN federation,
    which we played with back in *Chapter 4, Data Center (Not Trade) Federation*,
    we are able to connect Consul clusters across multiple data centers. The Consul
    mesh gateway takes that connection and adds not only the encryption to that connection,
    but also the ability to control which services are permitted to traverse those
    data centers.


    ![](img/52479dafaefba00517c48a137e037b7e_188_0.png)


    Figure 6.11 — Mesh gateways connecting data centers


    Whenever we connect a service within the Consul service mesh, the Consul server
    cluster manages the certificates for identity and encryption through the **connect**
    functionality. Connecting clusters through the mesh is no different; however,
    we all know what happens when we have more than one boss (let alone six bosses
    Bob, six bosses). Therefore, whenever we are connecting data centers via a mesh
    gateway, a primary data center must be identified to manage and distribute the
    certificates. These certificates create a new mTLS session between mesh gateway
    peers used for identity. It is important to note here that the encrypted traffic
    that flows through the mesh gateway is still service-to-service encrypted. In
    other words, the mesh gateway entities do not decrypt the message between services;
    they only retain the encryption that was already performed at the service endpoints.'
  - "[PAGE 189]\n\nWell, what if we don't want all of our services traversing through\
    \ the gateway? No problem! When the services are connected through the mesh gateway,\
    \ the Consul clusters recognize those services, and we can write intentions! This\
    \ gives the Consul administrators the immense power of not only controlling the\
    \ service mesh within a single cluster, but the entire world! Furthermore, as\
    \ part of the service definition, we can tell Consul that the **upstream service**\
    \ (the service we want to initiate the connection to) is available via the mesh\
    \ gateway. Let's take a look at a modified `curl` service as an example.\n\n#\
    \ Curl.json across the mesh gateway\n\n```\n{\n    \"service\": {\n        \"\
    name\": \"curl\",\n        \"tags\": [\n            \"curl-client\"\n        ],\n\
    \        \"connect\": {\n            \"sidecar_service\": {\n                \"\
    proxy\": {\n                    \"upstreams\": [{\n                        \"\
    destination_name\": \"httpd\",\n                        \"datacenter\": \"secondary\"\
    ,\n                        \"local_bind_port\": 3579\n                    }]\n\
    \                }\n            }\n        }\n    }\n}\n```\n\nWithin this slightly\
    \ altered service definition, we are telling Consul that the `httpd` service that\
    \ we want to reach is available in the data center named *secondary*. This is\
    \ a great example of connecting to another Consul data center for access to a\
    \ service, but what if the intended service isn't within the mesh?"
  - '[PAGE 190]


    # Terminating gateways


    With the proliferation of **anything as a service (*aaS)**, cloud providers are
    working very hard to differentiate themselves and remain competitive. At least,
    that''s my theory, which I believe leads to hosted services that would normally
    require dedicated compute. Even if it isn''t true, it sounds logical, and besides,
    I''m pretty sure I read it on the internet somewhere. Hosted database services
    are a wonderful example of this functionality, and unfortunately, we can''t deploy
    a Consul agent on a hosted AWS database service. For this purpose, we have the
    role of a terminating gateway.


    ![](img/52479dafaefba00517c48a137e037b7e_190_0.png)


    Luckily, this gateway isn''t wandering through the clouds looking for Sarah Connor.
    However, what it does terminate is the security and control of the Consul services.
    All is not lost, however, because if the destination service supports mTLS, the
    terminating gateway will maintain that secure connection. If the service only
    supports one-way TLS, the gateway can work with that too; however, this can open
    the terminating gateway to potential attacks. As the gateway is at the edge of
    the mesh, unlike the mesh gateway, it does have the ability to decrypt the traffic
    it receives. Therefore, it is always recommended to tightly control access to
    the node operating as the gateway. There is a problem though ... how does Consul
    know about the services that aren''t even inside the Consul cluster?'
  - '[PAGE 191]


    Recall that as we were discussing service discovery in *Chapter 5, Little Bo Peep
    Lost Her Service*, Consul is able to contain services within the registry that
    are not being managed by Consul. These are **external** services, which kind of
    makes sense, as they are **external** to Consul. Any services that are to be accessible
    via the terminating gateway must be registered in Consul; after all, if they aren''t,
    how can we discover them? When we configure a terminating gateway, we need to
    list the services that are available through that gateway. This is the only way
    that Consul can manage the discovery and connection from within the mesh to those
    external services. We can still use ACLs and security up to the gateway node;
    however, once the traffic leaves the gateway, we need to resort to old-fashioned
    networking, the way our grandmothers did.


    # Ingress gateways


    Next, we have to think about all of those entities that are outside in the great
    big scary world that want to access the wonderful services that we offer! This
    requires a method to open the service mesh and invite others to join us. However,
    we just don''t want to open the door and let anything into our mesh. We''ve worked
    very hard and have put up with a plethora of horrible jokes to secure our beautiful
    mesh. The last thing we want is to put the mesh at risk by allowing nefarious
    traffic through the door.


    ![](img/52479dafaefba00517c48a137e037b7e_191_0.png)


    Figure 6.13 – Ingress gateways'
  - '[PAGE 192]


    Luckily, any service that we would want to be accessible via the ingress gateway
    should already be registered within the Consul service catalog. However, we don''t
    want to expose ourselves completely as part of the process. Consul allows us to
    define a listener as part of the configuration for the ingress gateway. This listener
    tells the Consul agent (and Envoy proxy as well) which port to listen on, and
    what the associated service is. With this configuration, the ingress gateway can
    receive traffic on the specified port and forward that traffic to the appropriate
    destination service.


    Now that we can see how Consul can connect internal and external services to the
    mesh network, let''s take a quick look at an environment that exists as individual
    networks that yearn to be connected.


    # Meshing with Kubernetes


    Throughout this entire chapter, I''ve only mentioned Kubernetes once, and that
    was in passing. This is partly due to my loathness of Kubernetes and the number
    of hours I''ve struggled with the technology. However, service orchestrators such
    as Kubernetes (or Nomad) definitely have a place in the world of service mesh.
    In fact, many people don''t think about service mesh unless it is within the realm
    of one of these application orchestration tools. We aren''t going to get into
    the details of Kubernetes for a number of reasons (some of which I''ve already
    mentioned). However, I do want to address why service mesh is so important within
    this arena.


    Application orchestration provides an entire operating environment in which our
    applications reside. Once deployed within the environment, the primary job of
    the orchestrator is to ensure that the desired number of instances are operating
    and that the resources are being managed. The application can reside anywhere
    within the cluster of machines, so long as any constraints are satisfied. If the
    application fails, it is up to the orchestrator to restart the instance somewhere
    within the cluster. Additionally, when performing upgrades of machines, the orchestrators
    are able to move the applications throughout the cluster to best suit the desired
    goal. Essentially, the orchestrator, whether it''s Kubernetes or Nomad, has full
    control over the location, and therefore the addressing, of the application. This
    migratory and ephemeral nature of the applications dramatically complicates the
    problems of IP addressing discussed earlier.'
