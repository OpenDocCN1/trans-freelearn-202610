    read_replica = false

    ```


    When we set this value to true, Consul considers that node to be a read replica
    node, and reflects that configuration in the output of the consul operator raft
    list-peers command:


    ![](img/52479dafaefba00517c48a137e037b7e_123_0.png)


    Figure 4.2 – List of raft peers


    ## Consul Autopilot


    Consul Autopilot itself is an open source feature; however, it largely operates
    in the background. As a matter of fact, you''ve already been using Autopilot!
    Much of the Consul server functionality with respect to creating and maintaining
