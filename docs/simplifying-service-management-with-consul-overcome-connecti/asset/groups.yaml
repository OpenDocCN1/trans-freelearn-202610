    OK—now that we’ve set our variables to our liking, it’s time to fire up our infrastructure!
    If you’ve never used Terraform before, don’t worry—it’s quite easy, and all of
    the code has been built. Again, I never claimed to be a software developer, so
    please don’t laugh at my code! First, we’re going to kick off our infrastructure
    build and then dissect what we built. To get started, Terraform needs to download
    any provider-specific data necessary. This is performed via the following command:


    ```

    $ terraform init

    ```


    Of course, it’s never good to build something without examining what you build,
    so next, we’re going to plan our build. All of the output from this command should
    be green plus signs (+), identifying which infrastructure is going to be created.
    Note that many of these items are known after apply operation as they require
    assignment from AWS, but it might be fun to peruse what you are about to build.
    If not, don’t worry—I’ll review the details after we kick off the build.


    Now, run the following command:


    ```

    $ terraform plan

    ```


    Next, we’re going to apply our infrastructure build. This is done using—you guessed
    it: terraform apply. This kicks off another plan and shows you what you are about
    to build, but since we’ve already done that, let’s live dangerously and auto-approve.
    Have a look at the following code snippet:


    ```

    $ terraform apply --auto-approve

    ```'
  - "[PAGE 58]\n\n> Note\n> The author can't be held responsible for any costs you\
    \ incur during this practice. Please be sure to destroy your infrastructure when\
    \ you quit for the day or night. If you want to set up an m3.xlarge system and\
    \ leave it running for days, that's up to you!\n\nAll right—let's take a look\
    \ at what we are building. All of the following code blocks (in this section)\
    \ are within the main.tf file. It is Terraform best practice to have all pieces\
    \ of the code in one file, so that's what we're going to do here!\n\nThis first\
    \ section is fairly simple and simply sets up the Terraform providers that we'll\
    \ be using. A Terraform provider is kind of like a module that provides functionality\
    \ specific to the provider—for example, we're installing the AWS provider, enabling\
    \ us to manage resources in AWS. We're specifying the version of that provider,\
    \ and the region that we'll be working in. The provider block is also where naughty\
    \ people would insert their AWS credentials, but we're never going to do that—WILL\
    \ WE??? Finally, we're using an AWS data source to find the image that we just\
    \ built using Packer. Here's the code you'll need:\n\n```\nterraform {\n  required_providers\
    \ {\n    aws = {\n      source  = \"hashicorp/aws\"\n      version = \"~> 2.5\"\
    \n    }\n  }\n}\nprovider \"aws\" {\n  region = var.aws_region\n}\ndata \"aws_ami\"\
    \ \"an_image\" {\n  most_recent = true\n  owners      = [\"self\"]\n  filter {\n\
    \    name   = \"name\"\n    values = [\"${var.owner}-consul-*\"]\n  }\n}\n```"
  - "[PAGE 59]\n\nThis next section creates a private key for us to use in order to\
    \ ssh into our machines. An organization would typically maintain its own private\
    \ keys for machine access, but these really shouldn't be floating around. A more\
    \ secure approach would be to utilize the HashiCorp Vault Secure Shell (SSH) helper\
    \ for one-time-use SSH keys, but that's another story. The key will be built within\
    \ our Consul machines, but we'll also have a local Privacy Enhanced Mail (PEM)\
    \ file ending in -consul-key.pem. The code you'll need is illustrated in the following\
    \ snippet:\n\n```\nresource \"tls_private_key\" \"my_private_key\" {\n  algorithm\
    \ = \"RSA\"\n  rsa_bits = 4096\n}\nresource \"local_file\" \"private_key\" {\n\
    \  content = tls_private_key.my_private_key.private_key_pem\n  filename = \"${var.owner}-consul-key.pem\"\
    \n  file_permission = 0400\n}\nresource \"aws_key_pair\" \"consul_key\" {\n  key_name\
    \ = \"${var.owner}-consul-key\"\n  public_key = tls_private_key.my_private_key.public_key_openssh\n\
    }\n```\n\nThis section provides the vast majority of the networking information\
    \ necessary for our system. As we aren't reading a book about the intricacies\
    \ of AWS networking, you'll have to just trust me that all of the code in the\
    \ following snippet is cool:\n\n```\nresource aws_vpc \"consul-demo\" {\n  cidr_block\
    \           = var.vpc_cidr\n  enable_dns_hostnames = true\n  tags = {\n    Name\
    \ = \"${var.owner}-vpc\"\n  }\n}\nresource aws_subnet \"consul-demo\" {\n  vpc_id\
    \     = aws_vpc.consul-demo.id\n  cidr_block = var.vpc_cidr\n  tags = {\n    name\
    \ = \"${var.owner}-subnet\"\n```"
  - "[PAGE 60]\n\n```\n}\n}\nresource aws_internet_gateway \"consul-demo\" {\n  vpc_id\
    \ = aws_vpc.consul-demo.id\n\n  tags = {\n    Name = \"${var.owner}-internet-gateway\"\
    \n  }\n}\nresource aws_route_table \"consul-demo\" {\n  vpc_id = aws_vpc.consul-demo.id\n\
    \  route {\n    cidr_block = \"0.0.0.0/0\"\n    gateway_id = aws_internet_gateway.consul-demo.id\n\
    \  }\n}\nresource aws_route_table_association \"consul-demo\" {\n  subnet_id \
    \    = aws_subnet.consul-demo.id\n  route_table_id = aws_route_table.consul-demo.id\n\
    }\n```\n\nOK—this part of the networking is not something to gloss over. AWS security\
    \ groups identify which ports are open between which devices. Here is a list of\
    \ the defined ports and their purpose:\n\n+   - Port 22—SSH access.\n+   - Ports\
    \ 8300-8302—These cover all consensus, RPC, and gossip communication between the\
    \ nodes.\n+   - Port 8500—This is used for the Consul web user interface (UI).\n\
    +   - Port 8600—Consul utilizes port 8600 for Domain Name System (DNS) queries\
    \ as part of the Service Discovery function.\n\nThese ports have all been addressed\
    \ and configured within the security group configuration. Here's the code illustrating\
    \ this:\n\n```\nresource aws_security_group \"consul-demo\" {\n  name   = \"${var.owner}-security-group\"\
    \n  vpc_id = aws_vpc.consul-demo.id\n```"
