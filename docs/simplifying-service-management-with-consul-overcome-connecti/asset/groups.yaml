    ```

    ```bash

    $ consul connect proxy -sidecar-for httpd-1 > ~/httpd-proxy.log

    &

    ```

    ```


    这里我们所做的是告诉 Consul 发出连接请求，利用内部代理，作为 `httpd-1` 服务的 sidecar 运行。*等等，我还以为只是 httpd 呢！*
    你真是敏锐…… 我非常佩服！在创建代理服务时，我们使用的是服务的 **ID**，而不是服务的 **名称**。该请求的任何输出都被重定向到日志文件，并且我们在后台运行该命令。一旦运行该命令，服务在
