    \nSo, at this point, we have a service catalog, and we're able to validate that\
    \ our services are healthy and ready to be utilized. Next, we're going to see\
    \ how our applications can discover those services.\n\n## Methods of discovery\
    \ – no lawyers required\n\nWhenever I hear the term discovery, I can't help but\
    \ think about all of the lawyer shows and movies that reference the process. Thankfully,\
    \ we don't require lawyers as part of the discovery process, but there are several\
    \ methods available to discover what services our catalog offers. Let's see some\
    \ of them in the following sections.\n\n### DNS\n\nThe easiest way for any application\
    \ to discover the location of services is the same way they've been doing it for\
    \ years, utilizing DNS. By default, Consul offers DNS on port 8600 on every agent\
    \ within the Consul cluster. Every node and service can be queried utilizing a\
    \ Consul domain. For example, if we want to find the address(es) for the nodes\
    \ hosting the httpd service, we can execute the following command (using the IP\
    \ address of a Consul node, of course):\n\n```\n$ dig @192.168.100.20 -p 8600\
    \ httpd.service.consul\n```\n\nFocusing on the answer section of the query, we\
    \ can validate that two addresses have been returned on which the httpd service\
    \ can be found:\n\n```\n;; ANSWER SECTION:\nhttpd.service.consul. 0 IN A 3.20.237.142\n\
    httpd.service.consul. 0 IN A 13.59.70.71\n```\n\n*Hey Rob, everybody knows that\
    \ DNS utilizes port 53, why don’t you just use that for Consul DNS?* This is an\
    \ excellent question and is associated with the privileges under which Consul\
    \ is running. In order to attach an application or service to port 53, a well-known\
    \ port, the application requires privileged access. I don’t recommend operating\
    \ Consul (or most applications) with that level of access within any production\
    \ environment. *Well, how are we going to make use of this now?* Don’t worry,\
    \ young Padawan…there are a few options here.\n\nWithin most systems, there exists\
    \ a plethora of DNS-based services that may be deployed not only to manage the\
    \ name resolution for that particular node but also to help that node find other\
    \ nodes within the network. This includes utilities such as BIND, dnsmasq, Unbound,\
    \ and systemd-resolved. As some of these solutions may result in only resolving\
    \ the Consul domain, there is a parameter within the Consul agent configuration\
    \ entitled recursors. This enables Consul to send any DNS queries that it cannot\
    \ resolve up to another DNS.\n\n### API\n\nCompared to the utilization of DNS,\
    \ accessing services via the API is incredibly simple. However, from the application\
    \ side, this does require some level of development for service discovery. Along\
    \ with the API, Consul provides an extensive filtering mechanism in order to manage\
    \ the criteria utilized to discover the service. Attributes on which we can filter\
    \ include tags for the service and node, metadata for the service and node, addresses,\
    \ and the data center. In the following example, we’re filtering based on the\
    \ ServiceTags that are associated with our httpd service:\n\n```\ncurl http://18.189.17.157:8500/v1/catalog/service/httpd\
    \ 'filter=ServiceTags == \"python-server\"' | jq\n```\n\nThe result of such a\
    \ query is quite extensive, but it is all provided in JSON format, which has shown\
    \ to be quite easy to parse for both man and machine (and maybe cyborg):\n\n`#\
    \ Truncated output of Consul API Service Query`\n\n```json\n[\n  {\n    \"ID\"\
    : \"c83108da-f84c-20cf-7882-386e91ee2b27\",\n    \"Node\": \"ip-192-168-100-168\"\
    ,\n    \"Address\": \"13.59.70.71\",\n    \"Datacenter\": \"dc1\",\n    \"TaggedAddresses\"\
    : {\n      \"lan\": \"13.59.70.71\",\n      \"lan_ipv4\": \"13.59.70.71\",\n \
    \     \"wan\": \"13.59.70.71\",\n      \"wan_ipv4\": \"13.59.70.71\"\n    },\n\
    \    \"NodeMeta\": {\n      \"consul-network-segment\": \"\"\n    },\n    \"ServiceKind\"\
    : \"\",\n    \"ServiceID\": \"httpd\",\n    \"ServiceName\": \"httpd\",\n    \"\
    ServiceTags\": [\n      \"python-server\"\n    ],\n    \"ServiceAddress\": \"\"\
    ,\n    \"ServiceWeights\": {\n      \"Passing\": 1,\n      \"Warning\": 1\n  \
    \  },\n    \"ServiceMeta\": {},\n    \"ServicePort\": 8080,\n    \"ServiceEnableTagOverride\"\
    : false,\n    \"ServiceProxy\": {\n      \"MeshGateway\": {},\n      \"Expose\"\
    : {}\n```\n\nAs noted previously, all checks can be operated at the command line,\
    \ which is a great way to learn more about the operation and results of the check.\
    \ The results of the check are JSON formatted to facilitate parsing of the data,\
    \ which can be useful for alerting other components of the service availability.\
    \ For something such as the Consul services watch, the results are very high level,\
    \ as in the following example:\n\n```json\n{\n    \"consul\": [],\n    \"httpd\"\
    : [\n        \"python-server\"\n    ]\n}\n```\n\nMeanwhile, the output for the\
    \ service specific watch is quite more elaborate. The following example results\
    \ have been truncated for brevity.\n\n```json\n{\n    \"Node\": {\n        \"\
    ID\": \"494c2e14-5442-0339-6bbd-fa84254f5aa5\",\n        \"Node\": \"ip-192-168-100-124\"\
    ,\n        \"Address\": \"3.128.24.217\",\n        \"Datacenter\": \"dc1\",\n\
    \        \"TaggedAddresses\": {\n...\n```\n\nIf we want to find which nodes are\
    \ running the `httpd` service we are using in our examples, we can easily parse\
    \ the JSON result from the query. Additionally, we can add a `passingonly` Boolean\
    \ parameter to indicate that we only want to retrieve nodes that are hosting healthy\
    \ instances of the `httpd` service:\n\n```bash\nconsul watch -type service -service\
    \ httpd -passingonly true |\njq \".[] | .Node.Address\"\n```\n\nOf course, these\
    \ examples are all interactive with the Consul service, and it only provides the\
    \ results of the watch. The following example specifies a checks type watch that\
    \ will call the `check-handler.py` Python script whenever the check is executed:\n\
    \n```text\nwatches = [\n    {\n        type = \"checks\"\n        service = \"\
    httpd\"\n        args = [\"/etc/consul/consul.d/check-handler.py\"]\n    }\n]\n\
    ```\n\nIn order to notify the external applications or services of the check results,\
    \ including the location of our healthy services, the handler is able to post\
    \ this information out to a multitude of services. One potential option is to\
    \ update a messaging queue that services are subscribed to, such as **RabbitMQ**\
    \ or **ActiveMQ**. Once Consul posts the service information, any component that\
    \ is listening on the respective queue can retrieve the information.\n\nThere\
    \ we have it! Throughout this section, you've learned three different ways to\
    \ obtain information about the services within the Consul catalog, starting with\
    \ DNS, which appeared to be the most straightforward, leading to the direct API\
    \ integration, through to a notification mechanism that can notify just about\
    \ anything or anybody!\n\n## Summary\n\nI hope you enjoyed this chapter…the topic\
    \ of defining and managing our services isn't a horribly complex one, but it is\
    \ critically important for the healthy operation of any dynamic network. A huge\
    \ advantage of our cloudy world isn't the existence of cloud computing; it is\
    \ how being able to quickly create and remove resources changes our human operational\
    \ model. Unfortunately, that flexibility does mean our services have the ability\
    \ to migrate and roam amongst the clouds. Using our basic example, we were able\
    \ to register our `httpd` service within the Consul system, ensure that the service\
    \ is healthy, and review the different methods that can be used to discover that\
    \ service. Now would be a good time to take a break and play with the Consul system,\
    \ as the next topic, *service mesh*, has quite a few more working pieces to it.\
    \ Hang on…things are about to get meshy!\n"
  mdcn: "\n\n所有上述检查都支持可选字段，例如 notes（用于提供有关检查的人类可读信息）和 token（用于为检查提供特定的 ACL 令牌）。此外，在许多情况下，我们并不希望健康检查仅作为一次性的操作运行。识别在我们信任服务可用之前需要发生的通过检查次数通常很有用。此外，我们可能希望确保单次检查失败并不一定否定整个服务的可用性。对于这些场景，每个检查都支持\
    \ success_before_passing 字段以及 failures_before_critical 字段。最后，需要注意的是，Consul 支持在单个配置中定义多个检查。在很大程度上，我们的讨论一直围绕检查服务的健康状况展开。我们还应该检查\
    \ Consul 代理所在的节点的健康状况。多个检查的应用非常适合此目的，因为我们就可以检查内存、CPU、磁盘空间等。以下 uber-check 提供了多个节点级检查的示例（请注意，与检查关联的没有\
    \ service ID）：\n\n`# node-check.json`\n\n```json\n{\n  \"checks\": [\n    {\n\
    \      \"name\": \"mem\",\n      \"args\": [\"check_mem.sh\", \"-limit\", \"256MB\"\
    ],\n      \"interval\": \"5s\",\n      \"timeout\": \"2s\"\n    },\n    {\n  \
    \    \"name\": \"cpu\",\n      \"args\": [\"check_cpu.sh\", \"-percent\", \"90\"\
    ],\n      \"interval\": \"10s\"\n    },\n    {\n      \"name\": \"disk\",\n  \
    \    \"args\": [\"check_disk.sh\",\n        \"-path\", \"/\",\n        \"-threshold\"\
    , \"80\"\n      ],\n      \"interval\": \"10s\",\n      \"timeout\": \"5s\",\n\
    \    }\n  ]\n}\n```\n\n这假设我们创建了简单的脚本来评估资源，同时将限制和阈值作为变量来考虑。如果其中任何一个脚本的结果为 1，则节点将被视为处于警告状态。为了使节点被视为健康，所有脚本的输出都必须为\
    \ 0。\n\n就这样了。正如你所见，Consul 支持多种健康检查协议以确保服务可用性。Consul 功能的核心在于其服务目录；因此，准确了解与特定代理关联的服务的健康状况是系统的关键功能。\n\
    \n因此，在这一点上，我们拥有一个服务目录，并且能够验证我们的服务是否健康并准备好被使用。接下来，我们将看到我们的应用程序如何发现这些服务。\n\n## 方法\
    \ of discovery – no lawyers required\n\n每当我听到 discovery 这个词时，我就不禁想到所有律师节目和电影中引用的流程。幸运的是，我们不需要律师作为发现过程的一部分，但有几种方法可以发现我们的目录提供哪些服务。让我们在以下各节中看一些例子。\n\
    \n### DNS\n\n任何应用程序发现服务位置的最简单方法与它们多年来一直使用的方法相同，利用 DNS。默认情况下，Consul 在 Consul 集群中的每个代理上端口\
    \ 8600 上提供 DNS。每个节点和服务都可以使用 Consul 域进行查询。例如，如果我们想找到托管 httpd 服务的节点的地址，我们可以执行以下命令（当然使用\
    \ Consul 节点的 IP 地址）：\n\n```\n$ dig @192.168.100.20 -p 8600 httpd.service.consul\n\
    ```\n\n专注于查询的 answer 部分，我们可以验证已返回两个地址，可以在这些地址上找到 httpd 服务：\n\n```\n;; ANSWER SECTION:\n\
    httpd.service.consul. 0 IN A 3.20.237.142\nhttpd.service.consul. 0 IN A 13.59.70.71\n\
    ```\n\n*嘿 Rob，每个人都知道 DNS 使用端口 53，为什么你不直接用那个端口用于 Consul DNS？* 这是一个非常好的问题，并且与 Consul\
    \ 运行的权限有关。为了将应用程序或服务附加到众所周知的端口 53，应用程序需要特权访问。我不建议在任何生产环境中以这种级别的访问权限运行 Consul（或大多数应用程序）。*那么我们现在如何使用它呢？*\
    \ 别担心，小帕达万……这里有几个选项。\n\n在大多数系统中，存在大量基于 DNS 的服务，可以部署不仅用于管理该特定节点的名称解析，还可帮助该节点在网络中找到其他节点。这包括\
    \ BIND、dnsmasq、Unbound 和 systemd-resolved 等实用程序。由于其中一些解决方案可能只解析 Consul 域，因此 Consul\
    \ 代理配置中有一个名为 recursors 的参数。这使 Consul 能够将无法解析的任何 DNS 查询发送到另一个 DNS。\n\n### API\n\
    \n与使用 DNS 相比，通过 API 访问服务非常简单。然而，从应用程序的角度来看，这确实需要一定程度的开发来进行服务发现。Consul 除了 API 外，还提供了一个广泛的过滤机制，以便管理用于发现服务的标准。我们可以过滤的属性包括服务的标签和节点、服务的元数据和节点、地址以及数据中心。在以下示例中，我们基于与我们的\
    \ httpd 服务关联的 ServiceTags 进行过滤：\n\n```\ncurl http://18.189.17.157:8500/v1/catalog/service/httpd\
    \ 'filter=ServiceTags == \"python-server\"' | jq\n```\n\n此类查询的结果相当广泛，但它全部以 JSON\
    \ 格式提供，这已被证明对人类、机器（也许还有赛博格）解析都很容易：\n\n`# Truncated output of Consul API Service\
    \ Query`\n\n```json\n[\n  {\n    \"ID\": \"c83108da-f84c-20cf-7882-386e91ee2b27\"\
    ,\n    \"Node\": \"ip-192-168-100-168\",\n    \"Address\": \"13.59.70.71\",\n\
    \    \"Datacenter\": \"dc1\",\n    \"TaggedAddresses\": {\n      \"lan\": \"13.59.70.71\"\
    ,\n      \"lan_ipv4\": \"13.59.70.71\",\n      \"wan\": \"13.59.70.71\",\n   \
    \   \"wan_ipv4\": \"13.59.70.71\"\n    },\n    \"NodeMeta\": {\n      \"consul-network-segment\"\
    : \"\"\n    },\n    \"ServiceKind\": \"\",\n    \"ServiceID\": \"httpd\",\n  \
    \  \"ServiceName\": \"httpd\",\n    \"ServiceTags\": [\n      \"python-server\"\
    \n    ],\n    \"ServiceAddress\": \"\",\n    \"ServiceWeights\": {\n      \"Passing\"\
    : 1,\n      \"Warning\": 1\n    },\n    \"ServiceMeta\": {},\n    \"ServicePort\"\
    : 8080,\n    \"ServiceEnableTagOverride\": false,\n    \"ServiceProxy\": {\n \
    \     \"MeshGateway\": {},\n      \"Expose\": {}\n```\n\n如前所述，所有检查都可以在命令行上运行，这是一个了解检查操作和结果的好方法。检查的结果以\
    \ JSON 格式格式化以便于解析数据，这对于向服务可用性的其他组件发出警报很有用。对于诸如 Consul services watch 之类的东西，结果非常高级别，如以下示例所示：\n\
    \n```json\n{\n    \"consul\": [],\n    \"httpd\": [\n        \"python-server\"\
    \n    ]\n}\n```\n\n与此同时，服务特定 watch 的输出要详细得多。以下示例结果已为简洁起见而截断。\n\n```json\n{\n \
    \   \"Node\": {\n        \"ID\": \"494c2e14-5442-0339-6bbd-fa84254f5aa5\",\n \
    \       \"Node\": \"ip-192-168-100-124\",\n        \"Address\": \"3.128.24.217\"\
    ,\n        \"Datacenter\": \"dc1\",\n        \"TaggedAddresses\": {\n...\n```\n\
    \n如果我们想找到运行我们在示例中使用的 `httpd` 服务的节点，我们可以轻松解析查询的 JSON 结果。此外，我们可以添加一个 `passingonly`\
    \ 布尔参数来指示我们只想检索托管 `httpd` 服务的健康实例的节点：\n\n```bash\nconsul watch -type service -service\
    \ httpd -passingonly true |\njq \".[] | .Node.Address\"\n```\n\n当然，这些示例都与 Consul\
    \ 服务交互，并且只提供 watch 的结果。以下示例指定了一个 checks 类型 watch，当检查执行时将调用 `check-handler.py`\
    \ Python 脚本：\n\n```text\nwatches = [\n    {\n        type = \"checks\"\n     \
    \   service = \"httpd\"\n        args = [\"/etc/consul/consul.d/check-handler.py\"\
    ]\n    }\n]\n```\n\n为了通知外部应用程序或服务检查结果，包括我们健康服务的位置，处理程序能够将此信息发布到多种服务中。一个潜在的选项是更新服务订阅的消息队列，例如\
    \ **RabbitMQ** 或 **ActiveMQ**。一旦 Consul 发布服务信息，任何在相应队列上监听的组件都可以检索信息。\n\n就这样了！在本节中，你学习了三种获取\
    \ Consul 目录中服务信息的方法，从看起来最直接的 DNS 开始，到直接的 API 集成，再到可以通知几乎任何人或任何事的通知机制！\n\n## Summary\n\
    \n我希望你喜欢这一章……定义和管理我们的服务并不是一个极其复杂的话题，但对于任何动态网络的健康运行至关重要。我们多云世界的巨大优势不在于云计算的存在；而在于能够快速创建和删除资源如何改变我们的人类运营模式。不幸的是，这种灵活性确实意味着我们的服务有能力在云中迁移和漫游。使用我们的基本示例，我们能够在\
    \ Consul 系统中注册我们的 `httpd` 服务，确保服务健康，并查看可用于发现该服务的不同方法。现在是休息一下并玩转 Consul 系统的好时机，因为下一个主题，*service\
    \ mesh*，有更多的工作部件要处理。坚持住……事情马上就要变得 meshy 了！\n\n"
