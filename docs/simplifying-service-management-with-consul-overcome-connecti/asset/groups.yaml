  - "[PAGE 56]\n\n# Building the Consul cluster\n\nStart by changing directories to\
    \ the root directory of ch2. This is where we will find the Terraform scripts\
    \ for building our cluster. You can do this by running the following command:\n\
    \n```\n$ cd $github_root/Consul-Up-and-Running/ch2/\n```\n\nMuch like when building\
    \ our Packer image, we have a few files in this directory to be aware of. Don't\
    \ be concerned about the files directory just yet, as we'll get into that as we\
    \ evaluate the Terraform script for building our cluster.\n\nIf you take a look\
    \ at our variables.tf file, this is where the variables that Terraform requires\
    \ are defined. I always get confused between variables being defined and where\
    \ they are set. Anyhow, for each of the five variables, there is a description\
    \ (always a good idea) and a reasonable default (well, reasonable from my perspective).\
    \ Have a look at the following code snippet:\n\n# variables.tf\n\n```\nvariable\
    \ \"aws_region\" {\n  type        = string\n  default     = \"us-east-1\"\n  description\
    \ = \"Region for AWS Components\"\n}\nvariable \"owner\" {\n  type        = string\n\
    \  default     = \"consul-demo\"\n}\nvariable \"consul_region\" {\n  type    \
    \    = string\n  description = \"Region of consul server (not AWS Region)\"\n\
    \  default     = \"global\"\n}\nvariable \"vpc_cidr\" {\n  type        = string\n\
    \  description = \"CIDR of the VPC\"\n  default     = \"192.168.100.0/24\"\n}\n\
    variable \"instance_type\" {\n```"
  - '[PAGE 57]


