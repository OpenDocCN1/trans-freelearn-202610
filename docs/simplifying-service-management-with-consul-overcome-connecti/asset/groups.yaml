  - "[PAGE 160]\n\nAll of the aforementioned checks support optional fields, such\
    \ as notes (to provide human-readable information about the check) and token (to\
    \ provide a specific ACL token for the check to utilize). Additionally, in many\
    \ instances, we don't want our health checks to just operate as a one-and-done\
    \ operation. It can often be useful to identify how many passing checks need to\
    \ occur before we trust the service to be available. Additionally, we may want\
    \ to ensure that a single check failure doesn't necessarily negate the entire\
    \ service availability. For these scenarios, each check supports a success_before_passing\
    \ field as well as a failures_before_critical field. Finally, it should be noted\
    \ that Consul supports the definition of multiple checks within a single configuration.\
    \ For the most part, our conversation has revolved around checking for the health\
    \ of our services. We should also be checking the health of the nodes on which\
    \ our Consul agents reside. The application of multiple checks is perfectly suited\
    \ for this purpose as we can then check memory, CPU, disk space, and so on. The\
    \ following uber-check provides an example of multiple node-level checks (note\
    \ how there is no service ID associated with the checks):\n\n# node-check.json\n\
    \n```\n{\n  \"checks\": [\n    {\n      \"name\": \"mem\",\n      \"args\": [\"\
    check_mem.sh\", \"-limit\", \"256MB\"],\n      \"interval\": \"5s\",\n      \"\
    timeout\": \"2s\"\n    },\n    {\n      \"name\": \"cpu\",\n      \"args\": [\"\
    check_cpu.sh\", \"-percent\", \"90\"],\n      \"interval\": \"10s\"\n    },\n\
    \    {\n      \"name\": \"disk\",\n      \"args\": [\"check_disk.sh\",\n     \
    \   \"-path\", \"/\",\n        \"-threshold\", \"80\"\n      ],\n      \"interval\"\
    : \"10s\",\n\n```"
