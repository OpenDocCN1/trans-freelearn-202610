    \ 服务现在是否显示在该节点的目录中？运行以下命令来找出答案：\n\n```\n$ consul catalog services -node=ip-192-168-100-77\n\
    ```\n\n你应该在输出中看到 httpd 服务列出。如果是这样，就站起来向世界大喊，我已经掌握了 Consul 访问控制列表！好吧，掌握可能有点夸张，但你应该为自己在这里取得的成就感到非常自豪！\n\
    \n## Summary\n\n哇——又一个很长的章节！我不知道你怎么样，但我真的筋疲力尽了！虽然这是一本*入门*书，但使用 TLS 证书进行安全通信的概念并不是家庭晚餐的轻松话题。然而，由于\
    \ Consul 是网络的关键服务，它维护应用程序和服务信息，因此对节点进行身份验证并加密其通信路径的必要性不言而喻。此外，Consul ACLs 提供了如此多的灵活性，以至于它们可能非常令人不知所措。然而，它们的强大功能和控制应该是任何生产环境中的核心组件。我强烈建议你继续操作其他客户端节点，为它们创建一些新的策略和令牌，看看你能管理什么。如果你担心搞坏东西，不用担心。你始终可以使用\
    \ Terraform 来销毁和重建基础设施。说到这个，别忘了销毁你今天构建的东西……我们不想月底收到 AWS 账单而苦恼！一旦你销毁了基础设施，放松一下，喝点饮料。下一章会轻松一些，我保证。那里，我们将讨论如何将\
    \ Consul 扩展到多个数据中心并连接集群。我们快到一半了！\n\n"
