  - '[PAGE 156]


    At this point, we''ve defined an external service within Consul that is not only
    registered within the service catalog but is also being monitored to ensure the
    service is in a healthy state prior to providing the catalog information to any
    consumers.


    If you want to download Consul ESM onto your own systems and play with the service,
    simply log in to one of the Consul client nodes of your choice. At the command
    shell, execute the following commands:


    ```

    $ curl -o https://releases.hashicorp.com/consul-esm/0.5.0/ consul-esm_0.5.0_linux_amd64.tgz

    ```


    ```

    $ tar -zxvf consul-esm_0.5.0_linux_amd64.tgz

    ```


    This provides you with the consul-esm binary, which can be configured much like
    a standard Consul agent, using an HCL configuration file! I''ve provided a very
    simple configuration file. If you wish to play with ESM, just make sure you modify
    the local_private_ip parameters and insert the proper parameter with your node:


    # consul-esm.hcl Configuration File


    ```

    log_level = "INFO"

    ```


    ```

    instance_id = ""

    ```


    ```

    consul_service = "consul-esm"

    ```


    ```

    http_addr = "<local_private_ip>:8500"

    ```


    ```

    datacenter = "dc1"

    ```


    Now you have a configuration file, you can run consul-esm and use it:


    ```

    $ sudo ./consul-esm -config-file=./consul-esm.hcl

    ```


    If you''re playing along, as you certainly should be, your external service for
    the VCS should be registered as healthy within your Consul cluster. If you would
    like to check out the Consul ESM source code or other documentation, it is all
    available open source on GitHub!


    https://github.com/hashicorp/consul-esm


    Now that we know how to define both internal and external service. Little Bo Peep
    is able to determine which sheep are hers, and where they reside. She also needs
    a way to ensure her sheep are healthy. After all, an unhealthy sheep needs to
    be tended to! Let''s take a look at how we ensure our sheep, I mean services,
    are healthy.'
  - '[PAGE 157]


    # Major Tom, are you OK?


    Whenever we deal with communications, there is almost always some level of feedback
    that is required to ensure that the receiver is available. This is the entire
    instigator of the phrases we all know so well, such as *can you hear me now?*.
    Anybody who has had to deal with network load balancers or system monitoring should
    be no stranger to the term *health check*. This is exactly what Consul can employ
    within every service definition. Although a health check isn’t a required part
    of a service definition, I can’t imagine why anybody would want to define and
    deploy a service without one!


    In the realm of network load balancers or system monitoring, health checks were
    defined and orchestrated by some centralized form of intelligence. This means
    that if a load balancer managed 10 services running across 100 different nodes,
    the load balancer would need to track 1,000 health checks. This can not only cause
    some scaling issues as the services grow but it also (at least slightly) increases
    the amount of network traffic.


    Many monitoring systems today utilize remote agents for health checking, addressing
    both the scaling issue as well as network impact. Consul operates in a similar
    fashion as the monitoring system, utilizing the Consul agent deployed alongside
    the service to manage and perform all local health checks. Unlike a centralized
    monitoring system, however, if there is a failure on a Consul-managed service,
    or a Consul node/agent, the burden is not solely on the server cluster. Recall
    that as all of our agents are gossiping, they learn about the service availability
    of their peers for reporting. Therefore, with Consul, every agent that is managing
    services also manages and executes the checks that are associated with the health
    of the respective services. Let’s take a look at what checks we can implement
    for that purpose:


    +   - **Script**: As it sounds, a script check executes a predefined custom script
    in order to perform some function to validate the health of the service. In our
    example with the `httpd.json` service definition, we are using a script check
    utilizing the Linux `curl` utility along with some corresponding arguments (`localhost:8080`).
    Although I’m using a common utility as the script, in most cases the script is
    something very custom that performs an in-depth query of the service health. Along
    with the script, you can specify the interval at which the script is run, as well
    as any timeout necessary to accommodate for script failure. Note that script checks
    are not enabled by default, so the configuration of the agent must permit script
    checks. This can be performed through `enable_script_checks` as well as the `enable_local_script_checks`
    Boolean parameter. Consul recognizes the health of the service based on the returned
    value from the script:


    +   - 0: Service is healthy.

    +   - 1: Service is in warning status.

    +   - Anything else: Service unavailable'
  - "[PAGE 158]\n\n> **Caution**\n> \n> The `enable_script_checks` field permits scripts\
    \ defined with any method, including the API. If you haven't properly secured\
    \ your cluster, this enables remote entities to execute scripts on the Consul\
    \ agent. It is highly recommended to have any script checks defined and implemented\
    \ local to the agent and exclusively use `enable_local_script_checks`.\n\n+  \
    \ - **HTTP:** As you might be able to guess, an HTTP-based check performs an HTTP\
    \ request to ascertain the health of the associated service. By default, this\
    \ is a GET request; however, the check does support other HTTP methods as part\
    \ of the configuration. If specific HTTP headers are necessary, these can also\
    \ be specified as part of the configuration via the headers field. Similar to\
    \ the script-based check, the configuration can specify both the timeout that\
    \ Consul will wait for a response to the HTTP request, as well as the interval\
    \ at which requests are made. Additionally, as we've already seen the importance\
    \ of securing our communication, HTTP checks do support configuration for TLS\
    \ in the event that the application utilizes a secure HTTP endpoint. Any 2xx response\
    \ from the HTTP check is considered to be a healthy service.\n+   \n+   - **TCP:**\
    \ If you've ever utilized Telnet to check to see whether an application is listening\
    \ on a port, then the TCP check is for you! The TCP check simply attempts to connect\
    \ to a host and a TCP port that the application should be listening on. Of course,\
    \ similar to the HTTP and script-based check, the configuration can specify both\
    \ the timeout that Consul will wait for a response to the HTTP request, as well\
    \ as the interval at which requests are made. You may be recognizing a pattern\
    \ here. If the Consul agent is able to connect to the host and port, the service\
    \ is considered to be healthy."
  - '[PAGE 159]


    +   - **TTL**: This check is purely based on the **Time-To-Live (TTL)** of the
    last known state of the application. Within the HTTP and TCP health checks, Consul
    queries the service to validate availability. With the TTL check, however, Consul
    will listen for HTTP updates to see whether the service is healthy. In most cases,
    this is utilized only when the service can self-report its status, as either **pass**,
    **warn**, or **fail**. If the service doesn’t report within the TTL value, then
    Consul will assume the service is no longer available.

    +   - **Docker**: This can be useful to ascertain the health of services or applications
    that are running within Docker containers without any exposed interfaces on which
    the TCP, HTTP, or script-based checks can be used. For a Docker-based check, Consul
    interacts with a Docker host utilizing the Docker HTTP API or a direct socket.
    Consul directs Docker to spin up a container application that will check the service
    health, report the health to Consul, and then terminate the container. As part
    of the configuration, you can specify the interval at which this check is run,
    but no timeout for this one. Note that similar to the script check, this does
    require advanced permissions on the Consul agent, therefore the `enable_script_checks`
    Boolean configurations must be set to `true`.

    +   - **gRPC**: Some applications that support **gRPC remote procedure calls**
    may also support a gRPC-specific health check endpoint. This is definitely a more
    specific integration. However, the check supports the health validation of a single
    service, or multiple services as reported by the gRPC server. The definition of
    a gRPC-based check has both the `timeout` and `interval` parameters we have seen
    in other checks. Additionally, similar to the HTTP check, the gRPC health check
    supports TLS configuration for secure networks.

    +   - **H2ping**: This check provides similar functionality as the HTTP check;
    however, this supports a very simple ping frame delivery defined via the HTTP2
    protocol. Just like the HTTP check, the H2ping check provides the ability to configure
    the interval at which the checks are executed and the timeout to wait before declaring
    a check as failed. Unlike the HTTP check, however, H2ping relies upon a TLS connection
    by default, but it can be disabled by setting `tls_skip_verify` to `true`.'
