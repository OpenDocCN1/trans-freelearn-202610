    \n# Terraform.tfvars\n\n```\n```hcl\nowner         = \"rjackson\"\naws_region\
    \    = \"us-east-2\"\ninstance_type = \"t2.small\"\n```\n```\n\nNow that we've\
    \ confirmed our variables are to our liking, let's start firing up our infrastructure.\
    \ Remember that to get started, Terraform needs to download any provider-specific\
    \ data necessary. This can be done via the following command:\n\n```\n```bash\n\
    $ terraform init\n```\n```"
  - "[PAGE 99]\n\nNext, we're going to run our plan so that we can see what changes\
    \ Terraform is going to make. This will be all new infrastructure, so you should\
    \ just see a bunch of green plus signs:\n\n```\n```shell\n$ terraform plan\n```\n\
    ```\n\nLet's start building our infrastructure now! Once again, by living dangerously\
    \ (not recommended in production), we can auto-approve our `apply` command:\n\n\
    ```\n```shell\n$ terraform apply --auto-approve\n```\n```\n\nOK; let's now look\
    \ at what we are building. Within the definition of the security groups within\
    \ the `main.tf` file, we did make a slight modification to include access to port\
    \ 8501. This is the port that Consul is using for secure communication:\n\n```\n\
    ```hcl\ningress {\n    from_port   = 8501\n    to_port     = 8501\n    protocol\
    \    = \"tcp\"\n    cidr_blocks = [\"0.0.0.0/0\"]\n}\n```\n```\n\nThe majority\
    \ of the changes, however, are where we are creating our AWS server instances.\
    \ The big difference here is that we are pushing our private and public keys for\
    \ each server out to the system. Please note that I'm using very generic certificates\
    \ that were created by Consul. In most instances, you'll want to use specific\
    \ certificates for your environment. As the process of creating and distributing\
    \ the certificates may cause even the most stable person to lose their mind, I've\
    \ done a lot of that for you. If you wish to follow the process of creating the\
    \ certificates, the following command must be run for every server. These commands\
    \ are simply for informative purposes as certificates have already been embedded\
    \ in the infrastructure:\n\n```\n```shell\nconsul tls cert create\n```\n```\n\n\
    You can use this command to create server and client certificates, and even a\
    \ certificate for the CLI to access the Consul system. They would all use the\
    \ same CA file that is also produced by the command. The output would be as follows:\n\
    \n```\n```text\nconsul tls cert create -server\n==> WARNING: Server Certificates\
    \ grants authority to become a\n    server and access all state in the cluster\
    \ including root\nkeys\n```\n```"
  - "[PAGE 100]\n\n```\nand all ACL tokens. Do not distribute them to production hosts\n\
    that are not server nodes. Store them as securely as CA keys.\n==> Using consul-ca.pem\
    \ and consul-ca-key.pem\n==> Saved dc1-server-consul-0.pem\n==> Saved dc1-server-consul-0-key.pem\n\
    ```\n\nThis command would need to be executed for each of the three servers in\
    \ the server cluster, and the files would need to be transferred over. For simplicity's\
    \ sake, I've created the certificates ahead of time and placed them in their proper\
    \ positions. A big part of the changes that have been made to the Terraform script\
    \ in the `main.tf` file is due to the placement of these files. It can't be stressed\
    \ enough that in a production environment, you should be using certificates provided\
    \ by your security team (or through automation with HashiCorp's Vault):\n\n```\n\
    main.tfresource aws_instance \"consul-server\" {\n  count                    \
    \   = 3\n  ami                         = data.aws_ami.an_image.id\n  instance_type\
    \               = var.instance_type\n  key_name                    = aws_key_pair.consul_key.key_name\n\
    \  associate_public_ip_address = true\n  subnet_id                   = aws_subnet.consul-demo.id\n\
    \  vpc_security_group_ids      = [aws_security_group.consul-demo.id]\n  iam_instance_profile\
