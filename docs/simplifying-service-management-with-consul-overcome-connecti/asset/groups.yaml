  - '[PAGE 109]


    The first thing we want to do is move that server_acl.hcl file to its proper location.
    As part of the provisioning process, this file was placed in the /tmp directory.
    Now, we need to move it to the Consul configuration directory. Once the file has
    been moved, we need to restart Consul. To do that, execute the following command:


    ```

    $ sudo mv /tmp/server_acl.hcl /etc/consul/consul.d/

    ```


    ```

    $ sudo systemctl restart consul

    ```


    This needs to be done on each of the three Consul servers in your cluster. The
    file exists on all three servers, so you just need to SSH to each one and run
    the same mv command. Once you''ve moved the file on all three servers, select
    one and settle down for some fun. Find the private IP address for the server,
    which is your temporary home, using the ifconfig command:


    ```

    $ ifconfig | grep inet

    ```


    The output will provide you with four lines, similar to those shown here:


    ```

    inet 192.168.100.231  netmask 255.255.255.0  broadcast 192.168.100.255

    ```


    ```

    inet6 fe80::49e:7ff:fe21:bce6  prefixlen 64  scopeid 0x20<link>

    ```


    ```

    inet 127.0.0.1  netmask 255.0.0.0

    ```


    ```

    inet6 ::1  prefixlen 128  scopeid 0x10<host>

    ```


    Now, you''re going to export that first address as an environment variable. This
    will give you the ability to interact with that node on the command line. Let''s
    move along with the current example:


    ```

    $ export CONSUL_HTTP_ADDR=http://192.168.100.231:8500

    ```


    Now, you can interact with the Consul CLI to play with ACLs, policies, services,
    and all sorts of other good stuff. To test this out, let''s query the Consul members:


    ```

    $ consul members

    ```


    Uh oh, we got nothing. Can you guess why? Well, we''ve enabled ACLs, that''s why!
    Now that you''ve enabled ACLs on that server, you can no longer interact with
    it unless you have a token. Oh no, but how do we create a token? By utilizing
    our good old friend, bootstrap Bill!'
  - "[PAGE 110]\n\nWhenever you start building your system with ACLs, you need to\
    \ bootstrap the initial token. This is a very special token that provides full\
    \ management abilities, kind of like your root user in most environments. *However,\
    \ like your root user, once you’ve set up your ACLs, you should securely save\
    \ that bootstrap token in some super-secret vault.* But for now, let's focus on\
    \ getting ACLs working throughout our system. Initialize the ACL bootstrap process\
    \ via the following command:\n\n```\n```shell\n$ consul acl bootstrap\n```\n```\n\
    \nYou'll see a bunch of output from this command, including a special SecretID:\n\
    \n```\n```text\nAccessorID:        aedf1ba5-5023-e0a5-643e-f1e814ec5562\nSecretID:\
    \          34e87e9d-2207-f2eb-7efc-d41674eca6f0\nDescription:       Bootstrap\
    \ Token (Global Management)\nLocal:             false\nCreate Time:       2021-04-03\
    \ 22:58:49.387046985 +0000 UTC\nPolicies:\n    00000000-0000-0000-0000-000000000001\
    \ - global-management\n```\n```\n\nThis secret ID is your initial token to interact\
    \ with the Consul system. As you can see, there is a single policy attached to\
    \ that token for global management. Just to make things easier, we're going to\
    \ utilize this token and the global management policy for all our servers. One\
    \ way to do this is by exporting that token, just like we did with the IP address.\
    \ Moving along with the example here, we have the following:\n\n```\n```shell\n\
    $ export CONSUL_HTTP_TOKEN=34e87e9d-2207-f2eb-7efc-d41674eca6f0\n```\n```\n\n\
    Now, let's run that Consul members command again. You should get the full list\
    \ of servers and clients in the response.\n\n*Now that we have this deity-level\
    \ token, we need to save it! Wherever you copied your IP addresses for the clients\
    \ and servers, copy that bootstrap token there as well.* You never know when you'll\
    \ need to get this level of access. However, we do need to create something more\
    \ reasonable for our servers. Again, we don't want that root token flying around,\
    \ and although we can really get down to a very fine point, we're going to just\
    \ set things up so that we can get used to using ACLs and learn a bit about them."
  - "[PAGE 111]\n\nSo, our first goal is going to be to create a new policy with two\
