    ![](img/52479dafaefba00517c48a137e037b7e_25_0.png)


    Figure 1.4 – Find your migratory services


    As we''ve seen, the evolution of our network infrastructure has produced some
    amazing benefits when it comes to the management and the deployment velocity of
    the infrastructure. However, it has also introduced some complexity and perhaps
    some unwelcome variability, but with Consul service discovery, we''re able to
    embrace those changes without trying to figure out who moved my cheese. So now
    that we know where our services are, what do we do next?


    ## Something is meshy around here


    If you''ve read any technical articles within the last couple of years, especially
    within the discussions of microservices or Kubernetes, you''ll have heard the
    term service mesh quite pervasively. Personally, whenever I think of a mesh, it''s
    rarely a clean concept of machines communicating with each other. Usually, I think
    of the myriad of tunnels that have been buried underneath Boston, but that''s
    another story. From a network perspective, however, a service mesh provides a
    way to securely connect your various services without requiring additional functionality
    within the applications themselves. But it still sounds kind of meshy, so why
    would I want to deal with this?


    In the previous section, we talked about service discovery and how easy it is
    to determine where different applications and services reside, along with their
    health status. With that information, a bad actor can target the service for a
    variety of attacks and even service *spoofing*. For example, if I figure out that
    a particular application is connecting to a service, some sort of data store or
    provider, it would be possible to create a rogue service that the application
    would unknowingly connect to and potentially divulge sensitive information. Our
    ability to secure our applications has certainly improved over the past several
    years, however, the problem of imposters, cowans, and eavesdroppers has persisted,
    if not gotten worse, within a dynamic cloud world. And when this happens, it usually
    isn''t good.


    The Consul service mesh provides a networking model that ensures that all communication
    from service to service is not only encrypted but there is validation that the
    sender and receiver are actually who they claim to be. A great analogy for these
    communication systems is the postal system.


    Let''s step through the process of sending a package, something important that
    we want to secure and verify that it made it to the final destination:


    - 1. First, we''re going to wrap the item we want to send in a box or envelope
    of some kind. On that package, we''re going to place a label. Typically, that
    label will include the name of the person the package is destined for and their
    address. Note that this is a fixed address.

    - 2. We''re going to hand that package to a postal worker... for argument''s sake,
    we''ll just call them *Proxy*. Proxy is going to make sure we are who we say we
    are, and because this package is important, we''re going to tell Proxy that we
    need to make sure it goes to the right person.

    - 3. Proxy is going to potentially slap another label on the package and start
    moving the package through space and time. Since Proxy is local to your area,
    they aren''t going with the package, but there is trust that the package will
    be protected along its journey.


    The package may see all sorts of interesting things during its travels, but eventually,
    it will arrive at the name and address you intended. Proxy''s distantly related
    sibling, *Envoy*, will validate that the package arrives at the proper location,
    based on the attached label. If we want to be fancy, we can even receive confirmation
    (such as an ACK) that it was delivered.


    This simple analogy describes the communication within a service mesh. There is
    a message that needs to be communicated, but the application itself has neither
    the resources nor the intelligence to get that message securely to its intended
    destination. This is especially the case when that intended destination can change
    as, unlike our home address, we''ve already determined that we may not have the
    details of the destination address. So, the application hands that message to
    a local proxy, within the same machine, to eliminate the possibility of external
    snooping. That proxy has been configured with a certificate for two reasons. First,
    to validate its own authenticity. Second, to encrypt the message so that only
    those that are within the *inner circle* can obtain it. When the message gets
    to the other side, the receiving proxy can validate the certificate of the transmitter
    and unencrypt the message. From there, the proxy hands the message to the receiving
    application, again, on the same machine to eliminate any external snooping.


    ![](img/52479dafaefba00517c48a137e037b7e_27_0.png)


    As we''ve seen, adding a service mesh into the Consul architecture enables us
    to not only discover our services but we can also securely, with validation, connect
    to those services. However, we may be using identical certificates within our
    network in order to validate and encrypt messages. This practice is not uncommon,
    and therefore opens the possibility of a rogue application within the mesh talking
    to whatever else it wants to. Well, we can''t have that, so through Consul, we
    can create what''s called an *intention*. When you create an intention within
    Consul, you''re telling the associated Consul client who it can, and more importantly
    cannot, receive messages from. This provides yet another level of security within
    the service mesh.


    OK, that service mesh stuff is a bit confusing, but I get it. Now that I''m not
    dealing with IP addresses, I can now set up connections between my applications
    and services that not only secure the message but also validate the sender. I
    can even control the communication within my own network by creating rules regarding
    who can talk to whom. But there is still all of this other network stuff that
    slows me down. Even in the cloud, I''m hit with delays with the firewall, load
    balancer, and other communication devices. Why can''t we automate those pieces?
    Well, of course you can!


    ## Automate me!


    So, we''ve established how great it is to be able to discover the services available
    on our network without cumbersome static addressing, and how to utilize that to
    ensure the secure delivery of messages among our services. Wouldn''t it be great
    to share this dynamic information with other components in the network? Well,
    why would we want to do that? To understand how this functionality can improve
    the lives of so many people, let''s jump into the way-back machine and once again
    recall what we used to do, and often still do, when making adjustments to the
    network:


    - 1. Yeah! We have our application deployed into the network and I can communicate
    with it. However, I can''t reach the service my application needs to hit. Better
    call the network team.

    - 2. The network team told me that the problem must be on my end because the destination
    service is *alive* and responding to their monitoring tools.

    - 3. After a few days of troubleshooting, we learn that there is a firewall in
    the path that is protecting that service from nefarious creatures.

    - 4. So, next, we submit a ticket to the firewall team and request a rule be configured
    to allow traffic from, you guessed it, my IP address.

    - 5. Of course, the firewall team is not only getting hammered with requests,
    but they know that one wrong move on the list of firewall rules and the number
    of tickets will be the least of their problems, so extreme care must be taken.

    - 6. Eventually, the team is able to safely add and test the new rule, and we''re
    off and running.


    Now after all of that, let''s hope that we didn''t forget to include any important
    information in that ticket (such as an additional port). Not to mention that when
    the address changes (not if), we''ll need to enter the process again. This process
    continues today, even with cloud automation, for a number of different reasons.
    In my personal experience, these changes are the ones that tend to create the
    most confusion and delay in any project, and in a dynamic world, the changes aren''t
    slowing down.

