    \ 后端配置应特别注意。\n\n在处理期间，Terraform 可以记录与所管理基础设施组件的交互。此日志输出可能包含敏感信息，如果存储在运行 CTS 的机器上，可能会带来安全问题。因此，除非你正在调试，否则建议不要记录\
    \ Terraform 交互。Terraform 状态中也会记录相同的敏感信息，而这不是可选的。Terraform 利用该状态文件来了解所管理基础设施的当前状态，并评估需要哪些更改。\n"
