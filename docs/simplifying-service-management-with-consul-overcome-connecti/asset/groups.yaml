    \ we needed to create a bootstrap ACL token that gave us full administrative privileges\
    \ over the entire Consul system. Using a grossly oversimplified analogy, we can\
    \ view this administrator, or administrative group, as the governor of the Consul\
    \ system. We'll call him **Governor Lepetomane**. Based on his credentials, represented\
    \ by a unique token, he is able to set the rules for his jurisdiction that all\
    \ of the towns and communities within must abide by. However, each town still\
    \ maintains some level of autonomy. **Mayor Johnson**, with his own credentials\
    \ (token), is able to create his own rules and regulations for the town of Rock\
    \ Ridge, so long as those rules comply with those set forth by Governor Lepetomane.\
    \ The management of the Consul namespace structure is nearly identical.\n\nWhen\
    \ we bootstrap the ACL functionality within Consul, we create a token that abides\
    \ by the default global management policy. Using this token, we are able to create\
    \ new policies, and corresponding tokens, to enable very fine-grained management\
    \ of everything Consul can do. When we create our namespaces, we need to give\
    \ those operators their own management policies, but we can't have them exercising\
    \ their authority over neighboring namespaces. Therefore, each namespace gets\
    \ its own *operator*-level token that the administrators of those namespaces can\
    \ use to create their own policies, rules, services, and so on. So how are these\
    \ two default policies different?\n\n> **Important Note**\n> \n> Namespaces allow\
    \ us to subdivide services and policy; however, Consul cluster nodes are visible\
    \ to all namespaces."
