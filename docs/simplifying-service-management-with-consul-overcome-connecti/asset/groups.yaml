  - "[PAGE 97]\n\nThe first thing you might recognize is that in the source definition,\
    \ we have slightly changed the name of the image to be used. This is just because\
    \ we only want to be using this image to understand the security aspects of Consul.\
    \ As we move forward, we will be using the insecure image. *But Rob, why would\
    \ it be insecure?* I've been asking this myself nearly all my life! As we will\
    \ see, once we secure our cluster, it becomes more much difficult to utilize and\
    \ navigate. This is by design because, in a production environment, you don't\
    \ want to make it easier for those nefarious hackers:\n\n```\n```hcl\nsource \"\
    amazon-ebs\" \"ubuntu-image\" {\n  ami_name      = \"${var.owner}-secure-consul-${timestamp}\"\
    \n  region        = \"${var.aws_region}\"\n  instance_type = var.aws_instance_type\n\
    \  tags = {\n    Name = \"${var.owner}-secure-consul\"\n  }\n}\n```\n```\n\nWe\
    \ aren't really changing things that drastically, only slightly modifying the\
    \ name to identify it as the secure image base. One of the small changes for the\
    \ secure image is the presence of the CA file, `consul-agent-ca.pem`. Recall that\
    \ the CA confirms that the certificate being used is valid. Marge needs to be\
    \ sure that her kids are all using valid certificates! We could use a provisioner\
    \ to move this file to the machines when we run the Terraform script; however,\
    \ every machine needs the CA file, so we might as well pack that into the image:\n\
    \n```\n```hcl\nprovisioner \"file\" {\n  source      = \"../files/consul-agent-ca.pem\"\
    \n  destination = \"/tmp/consul-agent-ca.pem\"\n}\n```\n```\n\nWe're also going\
    \ to be moving that file to the proper location within Consul as part of our shell\
    \ provisioner:\n\n```\n```hcl\nprovisioner \"shell\"{\n  inline = [\n    \"sudo\
    \ /usr/local/bin/consul -autocomplete-install\",\n    \"sudo useradd --system\
    \ --home /etc/consul/consul.d --shell /bin/false consul\",\n    \"sudo mkdir /etc/consul\
    \ /etc/consul/consul.d /etc/consul/logs /var/lib/consul/ /var/run/consul/\",\n\
    \    \"sudo chown -R consul:consul /etc/consul /var/lib/consul/\"\n```\n```"
  - "[PAGE 98]\n\n```\n```json\n/var/run/consul/\",\n        \"sudo chmod -R a+r /etc/consul/logs/\"\
    ,\n        \"sudo mv /tmp/consul.service /etc/systemd/system/consul.service\"\
    ,\n        \"sudo mv /tmp/consul-common.hcl /etc/consul/consul.d/consul-common.hcl\"\
    ,\n        \"sudo mv /tmp/consul-agent-ca.pem /etc/consul/consul.d/consul-agent-ca.pem\"\
    \n    ]\n```\n```\n\nAnd that's it! These are seemingly small changes, but we\
    \ should get used to packing our commonalities into the image files to manage\
    \ how we build out our systems in that crazy place called the *real world*.\n\n\
    Next, we're going to build our Consul system. Again, this process is very similar\
    \ to what we did previously. We're going to kick off `terraform apply`, and while\
    \ that is running, we'll take a look at the differences.\n\n# Building the Consul\
    \ cluster\n\nNow that we've built the image, we can use Terraform to build the\
    \ cluster itself. All the Terraform code exists in this chapter's root folder,\
    \ so let's go there:\n\n```\n```bash\n$ cd $github_root/Consul-Up-and-Running/ch3\n\
    ```\n```\n\nAs you may recall, the `terraform.tfvars` file doesn't get copied\
    \ over from what you configured in *Chapter 2, Architecture – How Does It Work?*.\
    \ So, you'll have to make sure you edit it so that it matches your Chapter 2 file\
