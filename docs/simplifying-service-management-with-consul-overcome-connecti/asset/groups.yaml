    请注意，此配置中的 connect 部分稍微更复杂一些。对于 sidecar 服务，我们需要一些额外的参数来告诉代理服务器 curl 将要连接的服务（httpd），以及代理服务器应侦听请求的本地端口。在我的系统中——我鼓励你一起实践——httpd
    服务运行在一个 Consul 客户端上，而 curl 进程运行在另一个客户端上。然而，当我尝试在 Consul UI 中查看这些服务时，发现它们并不处于健康状态！


