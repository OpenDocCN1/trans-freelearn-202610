    # 4

    数据中心（非贸易）联合


    我很高兴地告诉你（和我自己），在经历了关于 Consul 安全性的那章颇具挑战性的内容之后，我们关于扩展 Consul 集群的讨论将会轻松得多。事实上，由于我们将在本节中讨论的许多功能都是
    Consul Enterprise 特有的，因此不会有什么练习！


    在前几章中，我们主要关注于设置和保护我们的 Consul 集群。然而，由于 Consul 是在企业环境中实施的，我们希望了解如何扩展 Consul 系统本身，并将
    Consul 功能扩展到多个数据中心或区域。为了理解 Consul 的扩展，我们将回顾以下主题：


    -   规模扩展——不，我们不会讨论爬行动物或音乐上的音阶，而是讨论如何扩展 Consul 系统。我们在前面的章节中已经看到，增加服务器集群会如何对达成共识所需的时间产生负面影响。那么，当我们增加客户端数量时，如何确保我们有足够的服务器结构来管理集群？我们又如何在如此庞大的系统中管理升级？

    -   细分——在了解了如何将 Consul 扩展到不同区域并管理这种扩展规模之后，我们将研究如何最佳利用这种扩展后的系统。这一操作的主要结果是，在企业环境中提供自治的
    Consul 系统，同时不放弃集中控制。

    -   联合——在这个全球化的世界中，服务很少只存在于一个区域或数据中心。在本节中，我们将了解如何跨多个区域连接服务器集群，以确保我们的服务无论位于何处都能通信。


    虽然我们不会直接应用本章学到的知识，但我将提供代码示例，以帮助进一步解释这些概念的实现。那么，让我们开始练习我们的“音阶”吧！


    ## 保护与规模扩展


    尽管 Consul 代理可以与外部节点上的服务协同工作，但最佳实践（以及最大的灵活性）建议在运行所连接服务的节点上共同驻留一个 Consul 代理。在许多企业中，Consul
    连接着成千上万（甚至更多）的服务，这意味着 Consul 集群拥有数千或数万个节点。当然，我们不希望只有三到五个服务器节点来管理这样一个规模的集群，所以让我们从扩展
    Consul 服务器集群开始。


    正如我们在第 2 章“架构——它是如何工作的？”中所了解到的，对于共识池的大小而言，越大并不总是越好。我们需要至少三台服务器才能获得法定人数，但随着服务器数量的增加，该池选举领导者所需的时间将大大延长。为了解决这个问题，Consul
    提供了将 Consul 服务器代理配置为只读副本的能力。当设置此标志时，该代理不参与任何法定人数选举，但它仍然有助于处理节点和服务注册，就像集群中的任何其他服务器一样。


    ![](img/52479dafaefba00517c48a137e037b7e_122_0.png)


    图 4.1 – 只读副本服务器


    使用前面的示例，让我们再次查看我们的服务器集群。我们最初将 Bart、Lisa 和 Maggie 作为三个主要的 Consul 服务器节点。我们能够快速达成共识，但随着斯普林菲尔德的成长，我们需要开始用更多服务扩展我们的
    Consul 网络。因此，我们最终向集群中添加了三台服务器：Hugo、Marge 和 Homer。为了确保 Hugo、Marge 或 Homer 都无法投票选举服务器集群领导者，它们通过配置中的布尔参数被指定为只读副本：


    ```

    server = true

    bootstrap_expect = 3

    retry_join = ["provider=aws tag_key=Name tag_value=${server_name_tag}"]

    bind_addr = "$(curl -s http://169.254.169.254/latest/meta-data/local-ipv4)"

    advertise_addr = "$(curl -s http://169.254.169.254/latest/meta-data/public-ipv4)"

    client_addr = "$(curl -s http://169.254.169.254/latest/meta-data/local-ipv4)"

    ui = true

    read_replica = false

    ```


    当我们将此值设置为 `true` 时，Consul 会将该节点视为只读副本节点，并在 `consul operator raft list-peers` 命令的输出中反映该配置：


    ![](img/52479dafaefba00517c48a137e037b7e_123_0.png)


    图 4.2 – Raft 对等节点列表


    ## Consul Autopilot


    Consul Autopilot 本身是一个开源功能；然而，它主要在后台运行。事实上，你已经在使用 Autopilot 了！Consul 服务器在创建和维护法定人数方面的许多功能都是由
    Autopilot 执行的。让我们来看一下 Autopilot 的配置参数，以理解为什么它是一个如此有用的小引擎。


    要查看集群中默认存在哪些配置，只需运行以下命令：


    ```

    ```bash

    # consul operator autopilot get-config

    ```

    ```


    假设你使用的是相同的 Consul 版本，输出应该与以下内容相同，因为这些是默认参数：


    ```

    ```text

    CleanupDeadServers = true

    LastContactThreshold = 200ms

    MaxTrailingLogs = 250

    MinQuorum = 0

    ServerStabilizationTime = 10s

    RedundancyZoneTag = ""

    DisableUpgradeMigration = false

    UpgradeVersionTag = ""

    ```

    ```


    在大多数情况下，这些默认参数就足够了，但如果你需要或想要更改它们，最好了解它们控制的内容：


    - `CleanupDeadServers` – 在服务器故障不可避免的情况下，你会希望尽快替换该故障服务器。这可以通过手动流程或某种自动化方法来完成。然而，在
    Consul 成员列表中，如果一台故障服务器在离开前没有“道别”，它可能会在列表中停留一段时间。这可能会围绕服务器法定人数和领导者选举造成一些混乱。将该值设置为
    `true` 后，Consul 会在有新的服务器可用并接管时，立即从服务器集群中移除任何故障服务器。

    - `LastContactThreshold` – 正如名称所示，如果领导者在此时段内未收到某个特定服务器节点的消息，领导者将假定该节点已故障。

    - **MaxTrailingLogs** – 回想一下，数据是通过日志在 Consul 服务器节点之间同步的，这些日志指示服务目录状态以及其他有用信息。领导者维护这些日志并将其分发给对等节点，但如果某个节点落后太多会怎样？此参数指示服务器与领导者之间允许落后的程度，以日志条目（而非日志）的数量来定义，超过该数量后节点将被视为不健康。

    - **MinQuorum** – 该值定义了在 Autopilot 可以开始修剪已被标记为死亡或不健康的服务器之前，集群中必须存在的最少服务器数量。这直接对应于清理死服务器的参数。

    - **ServerStabilizationTime** – 我们都需要一些时间才能被视为社会中稳定且有价值的成员。我的治疗师仍在试图弄清楚我需要的时间；然而，我们的集群服务器节点比人脑可预测得多。该值指示集群领导者在将集群中的新成员视为健康之前应等待多长时间。


    在这五个参数的基础上，为企业系统添加了三个参数：


    - **RedundancyZoneTag** – 每台服务器都可以配置元数据，以帮助执行任意数量的操作。其中一项操作是定义该服务器所在的冗余区域。此参数指示使用哪个标签进行该指定。

    - **DisableUpgradeMigration** – 此布尔参数直接影响 Consul 在升级过程中的表现。不过，我们不会在本书中讨论升级 Consul；升级任何分布式系统（如
    Consul）都应由单个节点的滚动更新组成。这消除了对整个集群进行下线、升级所有节点然后一次性全部重新启动（这会导致相当严重的服务中断）的需要。使用 Consul
    时，当我们开始升级服务器时，一旦有足够多的服务器运行新版本以支持法定人数，Autopilot 就会开始将它们提升为投票者。如果我们将此值设置为 `true`，Autopilot
    将不会自动将新服务器提升为投票者。


    '
