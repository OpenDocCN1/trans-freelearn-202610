    \ is doing! Have a look at the following code snippet:\n\n# consul-common.hcl\n\
    \n```\nlog_file = \"/etc/consul/logs/\"\nlog_level = \"DEBUG\"\n```\n\nAt this\
    \ point, you might want to double-check to make sure your AWS environment variables\
    \ are set. You can do this with the following command:\n\n```\n$ env |grep AWS\n\
    AWS_ACCESS_KEY_ID=AFAIKJENNY\nAWS_SECRET_ACCESS_KEY=8675309...\n```\n\nNow, we're\
    \ ready to build! Execute the simple Packer command shown in the following code\
    \ snippet and take a few minutes to congratulate yourself for packing an image!\
    \ Celebrate with a beverage of choice and relax, as the process will take about\
    \ 5 minutes:\n\n```\n$ packer build -var-file=\"variables.pkrvars.hcl\" .\n```\n\
    \nReviewing the output, it will look like somebody threw Christmas lights all\
    \ over your terminal. The Packer output is all red and in various shades of green,\
    \ just to make things festive. You'll see files getting moved over, as well as\
