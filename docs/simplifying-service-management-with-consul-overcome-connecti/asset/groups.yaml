    # Consul Autopilot


    Consul Autopilot itself is an open source feature; however, it largely operates
    in the background. As a matter of fact, you''ve already been using Autopilot!
    Much of the Consul server functionality with respect to creating and maintaining
    the quorum is performed by Autopilot. Let''s go through the configuration parameters
    of Autopilot to understand why it''s such a useful little engine.


    To see what configuration exists by default within your cluster, just run the
    following command:


    ```

    ```bash

    # consul operator autopilot get-config

    ```

    ```


    Assuming you''re on the same Consul version, the output should be identical to
    the following, as these are the default parameters:


    ```

    ```text

    CleanupDeadServers = true

    LastContactThreshold = 200ms

    MaxTrailingLogs = 250

    MinQuorum = 0

    ServerStabilizationTime = 10s

    RedundancyZoneTag = ""

    DisableUpgradeMigration = false

    UpgradeVersionTag = ""

    ```

    ```


    In most cases, these default parameters will be fine, but if you need or want
    to change them, it would be good to understand what they control:


    +   - `CleanupDeadServers` – In the inevitable case of a server failure, you''re
    going to want to replace that failed server as quickly as possible. This can be
    done through a manual process or some automated method. However, within the Consul
    member list, a failed server could stick around for a while if it didn''t say
    goodbye before it left. This could cause some confusion around the quorum of servers
    and the leader election. This value set to `true` enables Consul to remove any
    failed servers from the server cluster as soon as a new one is available to take
    over.

    +   - `LastContactThreshold` – Much like the name indicates, if the leader hasn''t
    heard from a particular server node within this time period, the leader will assume
    the node is failed.'
  - '[PAGE 126]


    +   - **MaxTrailingLogs** – Recall that the data is synchronized among the Consul
    server nodes via logs that indicate service catalog status along with other useful
    information. The leader maintains these logs and distributes them to peer nodes,
    but what if a node falls too far behind? This parameter indicates just how far
    behind a server can be from the leader, defined by the number of log entries (not
    logs) before the node is considered to be unhealthy.

    +   - **MinQuorum** – This value defines the minimum number of servers that need
    to be in a cluster before Autopilot can start pruning servers that have been marked
    as dead or unhealthy. This corresponds directly to the parameter to clean up dead
    servers.

    +   - **ServerStabilizationTime** – We all need some time to be considered a stable
    and valuable member of society. My therapist is still trying to figure out the
    time I need; however, our cluster server nodes are much more predictable than
    the human brain. This value indicates how long the cluster leader should wait
    before deeming a new member of the cluster to be healthy.


    To these five parameters, three have been added for an enterprise system:


    +   - **RedundancyZoneTag** – Each server can be configured with metadata to help
    with any number of actions. One of those actions is to define what redundancy
    zone that server resides within. This parameter indicates which tag is used for
    that designation.

    +   - **DisableUpgradeMigration** – This Boolean parameter directly impacts how
    Consul performs throughout the process of an upgrade. We won''t be talking about
    upgrading Consul within this book, however; upgrading any distributed system such
    as Consul should consist of a rolling update of individual nodes. This eliminates
    the need to take down the entire cluster, upgrade all nodes, and bring them all
    back at once (something that would cause a pretty significant service outage).
    With Consul, when we start upgrading servers, as soon as enough servers are on
    the new version to support a quorum, Autopilot would start promoting them to the
    voters. If we set this value to `true`, Autopilot would not automatically promote
    the new servers as voters.'
