- pgno: 96
  md: 'All the code for this section can be found in the following GitHub repository:

    https://github.com/PacktPublishing/Simplifying-Service-Management-with-Consul/tree/main/ch3


    # Creating the image


    If you''ve already forked or downloaded the repository, you should have the corresponding
    folder for this chapter. This is where we''ll be doing all our work. We are going
    to be building a new image for this chapter that includes all the certificates
    that have been generated for you.


    As we build the system and look at the code, we''re going to focus on the differences
    between what we did in Chapter 2, Architecture – How Does It Work?, and what we
    are doing here, simply for brevity. Unless you actually shut down your machine
    or closed your Terminal, you should still have your AWS keys: AWS_ACCESS_KEY_ID
    and AWS_SECRET_ACCESS_KEY. To check whether you still have these set properly,
    run the following command:


    ```

    $ env | grep AWS

    AWS_ACCESS_KEY_ID=AKIA26CFBA32D6JFVJJB

    AWS_SECRET_ACCESS_KEY=NYaSFhAzZqOq4bqSGJda/Y22Guc3p...

    ```


    Since you are all Packer experts by now, we''re going to kick off the build so
    that we can review what we are doing while the image is created. To do that, you
    need to be in the proper folder:


    ```

    $ cd $github_root/Consul-Up-and-Running/ch3/Image-Creation

    ```


    Now, kick off your Packer building using the following command:


    ```

    packer build -var-file="variables.pkrvars.hcl" .

    ```


    Now, while the Christmas lights are spewing across your screen, let''s take a
    look at the differences between what you are building now and what you built in
    Chapter 2, Architecture – How Does It Work?.'
