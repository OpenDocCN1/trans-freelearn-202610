- pgno: 102
  md: "The `consul-agent-ca-key.pem` file is the private key for the CA (Consul is\
    \ our CA). The public CA file, `consul-agent-ca.pem`, was pushed to all the machines\
    \ as part of the image build process. By using the provisioners within the `aws_instance`\
    \ resource, we are transferring the remaining to each of the three servers (0,\
    \ 1, and 2) and placing them in the `/etc/consul/consul.d/` directory.\n\nUtilizing\
    \ the file provisioner, we are also adding an ACL configuration file to the server.\
    \ This is just to help us when the time comes for us to start playing with ACLs.\
    \ When we provision our clients, there are a couple of small changes we have to\
    \ make. First, we must move a new configuration file to the clients to help with\
    \ the ACL configuration. We're also adding the CA file to the configuration:\n\
    \n```\n```hcl\nresource null_resource \"provisioning-clients\" {\n  for_each =\
    \ { for client in aws_instance.consul-client :\n  client.tags.Name => client }\n\
    \  provisioner \"file\" {\n    source      = \"files/httpd.json\"\n    destination\
    \ = \"/tmp/httpd.json\"\n  }\n  provisioner \"file\" {\n    source      = \"files/client_acl.hcl\"\
    \n    destination = \"/tmp/client_acl.hcl\"\n  }\n  provisioner \"remote-exec\"\
    \ {\n    inline = [\n      \"sudo cat << EOF > /tmp/consul-client.hcl\",\n   \
    \   \"advertise_addr = \\\"${each.value.public_ip}\\\"\",\n      \"server = false\"\
    ,\n      \"enable_script_checks = true\",\n      \"bind_addr = \\\"${each.value.private_ip}\\\
    \"\",\n      \"retry_join = [\\\"${aws_instance.consul-server[0].public_ip}\\\"\
    ,\\\"${aws_instance.consul-server[1].public_ip}\\\",\\\"${aws_instance.consul-server[2].public_ip}\\\
    \"]\",\n      \"client_addr = \\\"${each.value.private_ip}\\\"\",\n      \"ca_file\
    \ = \\\"/etc/consul/consul.d/consul-agent-ca.pem\\\"\",\n      \"verify_incoming\
    \ = true\",\n      \"verify_outgoing = true\",\n      \"verify_server_hostname\
    \ = true\",\n      \"auto_encrypt = {\"\n```\n```"
  merge: -1
