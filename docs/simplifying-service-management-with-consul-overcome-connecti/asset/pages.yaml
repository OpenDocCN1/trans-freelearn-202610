- pgno: 215
  md: 'Now that we''ve run the command, we can see that our httpd.txt file has been
    created. The file is created in the directory of the task, and we can see the
    result by issuing the following command:


    ```

    $ cat /home/ubuntu/sync-tasks/find-httpd-nodes/httpd.txt

    ```


    Now we have all four nodes that are running our httpd service, provided in a text
    file. That alone isn''t very exciting until we see that it''s the file that makes
    this special; it''s the fact that it was created using Terraform! Now pretty much
    anything that can be performed within a Terraform module can be performed automatically,
    using service catalog information provided by Consul! When we run the service
    as a daemon (not a demon), CTS will continually monitor for changes to httpd in
    the service catalog and utilize Terraform to update the infrastructure accordingly.


    # Summary


    Let''s take a look at what we''ve done here. The Consul system has the potential
    to hold a wealth of information about the services within your network. That information
    is power! Of course, that''s the power to connect securely, but I hope that through
    this chapter, you''ve seen how Consul''s power can extend far beyond the figurative
    walls of its gossiping corner. We''ve seen how the KV system can be used to store
    and distribute configuration information. We''ve learned how to construct Consul
    watches, enabling the notification service changes to other components for configuration
    management. Lastly, we''ve seen how Consul interoperates with Terraform, using
    the Consul-Terraform-Sync capability, to virtually adjust any infrastructure based
    upon Consul''s service knowledge. Now it''s time to sit back with a beverage of
    choice, and dream of all of the things that Consul can do for you!'
  merge: -1
  img_proc: true
