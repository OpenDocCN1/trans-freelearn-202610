    \ Feel free to do this through any of the methods we practiced previously. Once\
    \ you've updated the value, check the `seventh_son.txt` file again to see if your\
    \ updated value has been reflected. Now, we can imagine that this simple text\
    \ file is a configuration file for an application. Our templates can be as comprehensive\
    \ as necessary to address a multitude of configuration files, all managed dynamically\
    \ and automatically updated based on the values within our Consul KV store!\n\n\
    If your neurons are firing with excitement, please keep it rolling! There is so\
    \ much more that can be done with Consul Template beyond the scope of what we've\
    \ covered here. The full documentation, and source code for the project, is also\
    \ available on GitHub at https://github.com/hashicorp/consul-template.\n\nAs we've\
    \ now covered the usage of KV storage, along with the use of Consul Template,\
    \ let's move on and take a look at utilizing Consul watches and handlers as another\
    \ method of automating the configuration of third-party components.\n\n# Watching\
    \ your handlers\n\nWay back in *Chapter 5, Little Bo Peep Lost Her Service*, where\
    \ Little Bo Peep lost her service, we touched on the functionality of Consul watches\
    \ and handlers. Recall that a Consul **watch** observes any number of parameters\
    \ within Consul, and based on value changes, can execute a **handler** to perform\
    \ some function. Within *Chapter 5, Little Bo Peep Lost Her Service*, we focused\
    \ on being able to watch the status of a service, in order to inform a third party\
    \ about service health. We can use this same functionality, but instead of watching\
    \ service status, we can watch the status of a parameter within the KV store.\n\
    \nFor example, if we wanted to watch our key, using the direct command line, we\
    \ would execute the following:\n\n```\n$ consul watch -type=key -key=son/seventh/gift\n\
    {\n    \"Key\": \"son/seventh/gift\",\n    \"CreateIndex\": 194,\n```"
