- pgno: 222
  md: 'Once you click that magic blue button, the HashiCorp Cloud Platform will start
    creating your very own Consul cluster, hosted on the cloud! Once the cluster is
    created, you''ll be presented with a screen similar to the following screenshot:


    ![](img/52479dafaefba00517c48a137e037b7e_222_0.png)


    Figure 8.5 – Cluster Overview page in HashiCorp Cloud Platform


    From here, you can generate your admin token, access the cluster URL in a web
    browser, and you''re ready to go! In order to add clients, download the client
    configuration and distribute it to your Consul clients. The downloaded package
    includes the certificate that clients require to access the system, and any additional
    configuration necessary, and that''s all you need to begin your journey into HashiCorp
    Consul in the cloud!'
  merge: -1
  img_proc: true
- pgno: 223
  md: '# This is the end


    My beautiful friend, hopefully not my only friend, this is the end. Or perhaps,
    and hopefully, it is the beginning of your journey with Consul. If you have a
    history with Consul, you may have noticed that there is a ton of information that
    we''ve missed, and I agree. Throughout the creation of this book, I continued
    to work my day job, identifying additional areas to cover. Kubernetes is an example
    that likely warrants an entire book on its own. However, I do hope that we''ve
    laid a foundation on which to apply multiple usages and applications of HashiCorp''s
    Consul. The communication paths among Consul nodes, arguably one of the most important
    aspects of the architecture, has been explained in some detail. We''ve gone through
    the exercise of securing our Consul cluster and ensuring not only the encryption
    of communication, but the verification of identity. We don''t want outsiders in
    our group and listening to our gossip, do we? Extending Consul across multiple
    data centers and regions is the next logical step for the architecture. Of course,
    once we have that stable foundation, we need to make sure we are getting value
    for our operational and capital investment. Consul provides that value through
    service discovery in our dynamic and ever-changing world. Simply finding our services
    in this world tends not to be so simple! Once we are able to locate our services,
    we utilize Consul to connect them across various environments, both internal and
    external, to Consul''s domain. Of course, the networking world does extend far
    beyond Consul''s domain, but we can apply Consul''s knowledge to automate that
    network infrastructure. Lastly, although Consul can be deployed on nearly any
    system (some people run Consul on Raspberry Pis!), we often don''t want to deal
    with operating systems if we don''t have to. Consul on HashiCorp Cloud Platform
    provides the ability to quickly spin up a hosted Consul cluster and plug in your
    services.


    I do hope you''ve enjoyed the book and learned a bit about Consul. More importantly,
    I hope that I''ve piqued your curiosity on a number of topics. Never stop learning!'
  merge: -1
  img_proc: true
