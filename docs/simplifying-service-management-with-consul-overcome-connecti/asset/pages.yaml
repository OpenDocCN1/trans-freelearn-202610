- pgno: 110
  md: "Whenever you start building your system with ACLs, you need to bootstrap the\
    \ initial token. This is a very special token that provides full management abilities,\
    \ kind of like your root user in most environments. *However, like your root user,\
    \ once you’ve set up your ACLs, you should securely save that bootstrap token\
    \ in some super-secret vault.* But for now, let's focus on getting ACLs working\
    \ throughout our system. Initialize the ACL bootstrap process via the following\
    \ command:\n\n```\n```shell\n$ consul acl bootstrap\n```\n```\n\nYou'll see a\
    \ bunch of output from this command, including a special SecretID:\n\n```\n```text\n\
    AccessorID:        aedf1ba5-5023-e0a5-643e-f1e814ec5562\nSecretID:          34e87e9d-2207-f2eb-7efc-d41674eca6f0\n\
    Description:       Bootstrap Token (Global Management)\nLocal:             false\n\
    Create Time:       2021-04-03 22:58:49.387046985 +0000 UTC\nPolicies:\n    00000000-0000-0000-0000-000000000001\
    \ - global-management\n```\n```\n\nThis secret ID is your initial token to interact\
    \ with the Consul system. As you can see, there is a single policy attached to\
    \ that token for global management. Just to make things easier, we're going to\
    \ utilize this token and the global management policy for all our servers. One\
    \ way to do this is by exporting that token, just like we did with the IP address.\
    \ Moving along with the example here, we have the following:\n\n```\n```shell\n\
    $ export CONSUL_HTTP_TOKEN=34e87e9d-2207-f2eb-7efc-d41674eca6f0\n```\n```\n\n\
    Now, let's run that Consul members command again. You should get the full list\
    \ of servers and clients in the response.\n\n*Now that we have this deity-level\
    \ token, we need to save it! Wherever you copied your IP addresses for the clients\
    \ and servers, copy that bootstrap token there as well.* You never know when you'll\
    \ need to get this level of access. However, we do need to create something more\
    \ reasonable for our servers. Again, we don't want that root token flying around,\
    \ and although we can really get down to a very fine point, we're going to just\
    \ set things up so that we can get used to using ACLs and learn a bit about them."
  merge: -1
  img_proc: true
- pgno: 111
  md: "So, our first goal is going to be to create a new policy with two simple rules\
    \ for our servers. We need write access to our nodes and our services. As part\
    \ of this process, we need to create our policy file, which can be done using\
    \ a text editor, or simply by using the following command:\n\n```\n```sh\ncat\
    \ > first-policy.hcl << EOF\nnode_prefix \"\" {\n    policy = \"write\"\n}\nservice_prefix\
    \ \"\" {\n    policy = \"read\"\n}\nEOF\n```\n```\n\nIf you were able to copy\
    \ and paste correctly (or if you're using a paper book, typing properly), the\
    \ file should look as follows:\n\n```\n```hcl\nnode_prefix \"\" {\n    policy\
    \ = \"write\"\n}\nservice_prefix \"\" {\n    policy = \"read\"\n}\n```\n```\n\n\
    Based on our expertise, we know that this allows the node to write all node-level\
    \ operations and that it's able to read all service-level information. Using this\
    \ file, we're going to create a policy within Consul. This can be done with the\
    \ following command:\n\n```\n```sh\n$ consul acl policy create -name \"first-token\"\
    \ -description\n\"Server Token Policy\" -rules @first-policy.hcl\n```\n```\n\n\
    The output of this command should include all the policy information:\n\n```\n\
    ```\nID:            c034c84d-f4f6-6bb6-4e96-8fc9a4d7dbae\nName:          first-token\n\
    Description:   Server Token Policy\nDatacenters:\nRules:\nnode_prefix \"\" {\n\
    \    policy = \"write\"\n```\n```"
