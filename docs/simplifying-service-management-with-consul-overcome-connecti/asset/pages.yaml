- pgno: 90
  md: 'Here, the bearer of the associated token to this policy would be able to write
    to any hostname starting with `ip-192`, but would only have read-only access to
    any hostname starting with `ip`.


    As I hope you can see, the flexibility of the ACLs within Consul allows us to
    define and enforce incredibly specific rules on our system. We can apply a variety
    of controls to exact areas of the Consul functionality. Some of these rules are
    crucial for any functional system (such as node or agent types), but even those
    should be controlled so that they''re only applied to specific segments (hostnames,
    domains, and so on). Next, we''re going to look at what we can do to manage the
    humans that have access to our Consul cluster and track what they are doing, just
    like Big Brother.


    As we have already seen, the ability to use Terraform to create and manage infrastructure
    simplifies a lot of this complexity. When you start working with Consul clusters
    containing hundreds, thousands, and tens of thousands of nodes (and yes, clusters
    of that size do exist), the convenience of using infrastructure as code becomes
    more of a necessity. If you''re tired of reading and want to see how all these
    security features come together, just hang tight – we''ll get there soon. First,
    we need to take a quick look at audit logging within the Consul system, a critical
    component for any enterprise.


    # Role up your identity


    As part of enabling production for a service, we need to work with who is going
    to access the system, and what they can do. This is typically referred to as **Role-Based
    Access Control**, or **RBAC**. We also want to be able to maintain an audit trail
    for the system. This last part is becoming increasingly important as we get out
    of that trusted walled garden network and into the cloud. I can''t tell you how
    many times, even in a controlled environment, I had to go back and figure out
    what changed and when that broke my system! In the interests of full disclosure,
    an Enterprise-level license for Consul is required to implement this level of
    functionality.


    The actual process of logging in to the Consul system can certainly be managed
    by using ACLs and then treating any human like a machine by giving them their
    own particular access token. However, these tokens aren''t as simple as Jean Valjean''s
    24601. So, inevitably, somebody will end up writing their token down on a sticky
    note attached to their laptop, or better yet, emailing it to their friends and
    family with the latest cat meme. Furthermore, this only works until you have some
    engineer (could it be you?) standing up in front of the company exclaiming *I
    am not a number, I am a free man!* Cue the maniacal laugh emanating from the offices
    of upper management. A much better solution is to tie Consul into some centralized
    method of authentication and authorization. For this, Consul Enterprise utilizes
    one of the growing standards for centralized authentication and authorization
    – **OpenID Connect (OIDC)**.'
  merge: -1
  img_proc: true
- pgno: 91
  md: 'Utilizing OID C, Consul can validate users attempting to access Consul by querying
    one of the many OID C providers (most enterprise environments utilize at least
    one). If you''ve ever logged in to a service and were redirected to another authentication
    page or popup for your Google, Yahoo, Microsoft, PayPal, or Amazon credentials,
    it is likely that you''ve utilized OID C for that authentication. Other popular
    OID C providers for enterprise environments include OKTA and Auth0. This process
    not only validates and authenticates the user, but it can also map that user to
    a set of authorization policies to control access to the system. After all, if
    you ever have to give a manager access to your Consul cluster, you certainly don''t
    want them having administrative privileges! So, let''s walk through this with
    another lovely example.


    As part of this story, we need to assume that our greater employer has implemented
    OID C and that each of us has our own credentials to authenticate with that OID
    C provider. Along with our credentials, we all have specific metadata that is
    associated with our position in the company:


    | Credentials | Metadata |

    | Username | Password | First Name | Last Name | Position |

    | sharris | ********** | Steve | Harris | Bassist |

    | bdickinson | ********** | Bruce | Dickinson | Singer |

    | dmurray | ********** | Dave | Murray | Guitarist |

    | asmith | ********** | Adrian | Smith | Guitarist |

    | nmcbrain | ********** | Nicko | McBrain | Drummer |


    Figure 3.6 – OID C accounts and metadata


    In this example, everybody has their own unique position, except for Adrian and
    Dave. They are both in the guitarist group, which we''re going to map to a role
    within Consul. Recall that a role consists of a group of ACL policies within Consul.
    When we configure Consul to utilize this information, we create what''s called
    a claim mapping. This maps the metadata that''s been provisioned within the OID
    C provider to variables within Consul, which can then be used to associate that
    metadata with a particular role. For example, the following configuration associates
    specific mappings for the first and last name, and the position metadata is associated
    with a list in Consul called band_positions:


    ```

    {

    "OIDCDiscoveryURL": "https://<OIDC_URL>/",

    "OIDCClientID": "<OIDC_CLIENT_ID>",

    ```'
  merge: -1
  img_proc: true
- pgno: 92
  md: "```\n\"OIDCClientSecret\": \"<OIDC_CLIENT_SECRET>\",\n\"BoundAudiences\": [\"\
    <OIDC_CLIENT_ID>\"],\n\"AllowedRedirectURIs\": [\n    \"http://localhost:8550/oidc/callback\"\
    ,\n    \"http://localhost:8500/ui/oidc/callback\"\n],\n\"ClaimMappings\": {\n\
    \    \"user.metadata.first_name\": \"first_name\",\n    \"user.metadata.last_name\"\
    : \"last_name\"\n},\n\"ListClaimMappings\": {\n    \"user.metadata.position \"\
    : \"band_positions\"\n}\n}\n```\n\nThis configuration simply allows Consul to\
    \ communicate with the OIDC provider and pull specific account information (first\
    \ name, last name, and position). However, this information means absolutely nothing\
    \ unless we configure Consul to associate that metadata with a specific role.\
    \ Let's pretend we have a role within Consul for guitarists that consists of two\
    \ policies. We can create that role using the following example command:\n\n```\n\
    $ consul acl role create -name guitarists -policy-name rhythm -policy-name lead\n\
    ```\n\nWonderful! We have created our accounts in our OIDC provider, and we have\
    \ a role defined within Consul that associates specific attributes of the account\
    \ with a set of policies. However, how do we link these two pieces of information?\
    \ This can be done through what is called a binding rule. Now, we haven't talked\
    \ about these before, but a binding rule associates a method of authentication\
    \ with a particular role. Binding rules can be applied to application authentication\
    \ (for example, if you wanted to validate authentication using a Java Web Token),\
    \ but our focus here is to authenticate humans. Specifically, we want humans that\
    \ have a band position of guitarist to have access to the guitarists Consul role.\
    \ Note a slight difference in spelling (guitarist versus guitarists). This was\
    \ done to differentiate between terms through the process.\n\nEnough talk about\
    \ our binding rules. If we wanted to create one, we could use the following example:\n\
    \n```\n$ consul acl binding-rule create -method=<oidc_name> -bind-type=role -bind-name=guitarists\
    \ -selector='guitarist in list.band_positions'\n```"
  merge: -1
  img_proc: true
- pgno: 93
  md: 'Here, we are using the name of the OID C provider that was given when we configured
    the OID C provider within Consul. We are stating that anybody who logs in to Consul
    using that method needs to be authenticated using the associated OID C provider.
    When we receive the metadata back for the user attempting to authenticate, we
    are looking in the list of band_positions, and if we find a guitarist, we can
    assign the role (and therefore all the associated policies) of guitarists to those
    users. Now, why would we go through all this work when all I need to do is create
    tokens and give those tokens to users?


    Let''s assume we''ve gone through the process of creating a role for guitarists,
    and that the role has its own token. We can give that same token to Adrian and
    Dave, and they can authenticate with Consul (using the CLI or web interface) using
    that token. Here is problem number one; how can we differentiate between Adrian
    and Dave when we are tracking audit logs? It might not be too bad when we only
    have one user, but when Jannick (another guitarist) is added to the band, it becomes
    even more difficult to differentiate users (although their guitar styles are vastly
    different).


    Now, I admit that all of this can be confusing, so let me lay out the sequence:


    # Consul OID C Authentication


    ![](img/52479dafaefba00517c48a137e037b7e_93_0.png)


    Figure 3.7 – OID C authentication process'
  merge: -1
  img_proc: true
- pgno: 94
  md: "I had mentioned the necessity to differentiate between Adrian, Dave, and now\
    \ Jannick, as they log in to the Consul system. This is to differentiate between\
    \ actions performed within the audit log by each individual. This isn't necessarily\
    \ to stand back and point fingers, but more to ensure that the process is followed\
    \ and changes are tracked throughout the system.\n\nEnabling the audit log is\
    \ pretty simple within Consul servers. When enabled, Consul will spit out entries\
    \ to track who did what and when, and it all gets written to a file. Don't worry\
    \ – secret information isn't included, which gives greater importance to enabling\
    \ authentication methods such as OIDC to uniquely distinguish users. The logs\
    \ are written to a file in JSON format, which can be ingested into most log analysis\
    \ utilities such as DataDog, Splunk, and Elasticsearch. When configuring the logging,\
    \ however, be sure to set limits on the number of log files and the rotation frequency…\
    \ nobody ever likes to admit that they ran out of space due to logging!\n\n```\n\
    ```hcl\naudit {\n  enabled = true\n  sink \"consul_audit\" {\n    type   = \"\
    file\"\n    format = \"json\"\n    path   = \"data/audit/audit.json\"\n    delivery_guarantee\
    \ = \"best-effort\"\n    rotate_duration = \"24h\"\n    rotate_max_files = 15\n\
    \    rotate_bytes = 25165824\n  }\n}\n```\n```\n\nThe output of the log file identifies\
    \ several important pieces of information, specifically the timestamp and the\
    \ token accessor. This accessor can be linked back to the individual tokens and\
    \ roles (and therefore users) that accessed the system. I personally find the\
    \ source IP address to be very interesting in audit logs, especially when I can\
    \ do geographic association and determine who is accessing the system from various\
    \ parts of the world. Of course, the entry includes what they did with the system\
    \ as well!\n\n```\n```json\n{\n  \"created_at\": \"2020-08-25T10:35:23.258765383Z\"\
    ,\n  \"event_type\": \"audit\",\n  \"payload\": {\n    \"id\": \"3a880e2b-3f43-5d4d-97a6-26aec5eacc0c\"\
    ,\n```\n```"
  merge: -1
  img_proc: true
