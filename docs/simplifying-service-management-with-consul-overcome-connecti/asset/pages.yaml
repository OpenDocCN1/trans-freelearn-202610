- pgno: 33
  md: '# Architecture – How

    Does It Work?


    Now that we''ve had a managerial-level view of what Consul is and what it can
    do for us, we''re going to take a deeper dive into the architecture of the Consul
    system and look at how it works. Throughout this chapter, we''re going to be building
    up a Consul cluster on our own in order to better understand what information
    is distributed within the cluster, who is responsible for it, and how it is shared.
    The topics covered within this chapter include the following:


    +   - **Consul cluster operation** – We''ve already seen in theory how Consul
    servers operate as the brain of the cluster, and how clients work to monitor the
    services. Now we''ll put that theory into practice.

    +   - **Establishing consensus** – We''re going to take a look into how the Consul
    servers establish consensus to elect a leader and maintain the service catalog.

    +   - **Cluster communication protocols** – There''s a lot of activity happening
    among the cluster servers and the clients. We''re going to dig a bit deeper into
    how all of that information is shared and updated.

    +   - **Geography** – A lot of decisions are managed within Consul, and service
    location doesn''t just mean the **Internet Protocol (IP)** address it is behind.
    We''re going to see what other service criteria Consul can report.'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'As part of our educational journey, we will be creating our own Consul cluster
    within **Amazon Web Services (AWS)** using Terraform. If you''ve never used Terraform
    before, don''t worry. We only need to perform a few basic instructions, and I''ve
    written all of the code for you! If you have used Terraform before, please don''t
    laugh at my code; I never claimed to be a software developer.


    # Technical requirements


    As you will be building your own cluster within this section, there are some requirements
    that we need to address. However, we''ll be building everything in AWS, so all
    you really need is the ability to run Terraform from your command-line environment.
    I''ll be using macOS, but Terraform can run in most desktop operating systems.
    Over the next few sections, we''ll be setting up what you need within AWS and
    downloading the necessary HashiCorp tools. In order to work together as we proceed,
    you''re going to want to create an AWS account if you don''t already have one.
    We''re going to be using AWS to create and manage the infrastructure throughout
    the process. An effort has been made to ensure that the costs of setting up this
    infrastructure are minimal, but there are a few things to be aware of, such as
    the following:


    +   - Always perform a `terraform destroy` operation when you are done for the
    day. This does mean you''ll have to rebuild as you continue working the next day,
    but what a great lesson on immutable infrastructure!

    +   - Be very careful with your AWS credentials. Never share your **access key
    identifier**, and definitely don''t share your **secret access key**. We''re going
    to set them as environment variables so that they never show up in code and they
    should absolutely never show up in your **Version Control System (VCS)**!


    # Obtaining AWS credentials


    To obtain your AWS credentials, log in to AWS at `https://console.aws.amazon.com/iam/home?#`
    and proceed to **Identity and Access Management (IAM)**.


    On the left side of the page, you should see a **Users** section where you can
    utilize an existing user or add a new one. I would recommend creating a new user
    specifically for this project. You can see an overview of this page in the following
    screenshot:'
  merge: -1
  img_proc: true
