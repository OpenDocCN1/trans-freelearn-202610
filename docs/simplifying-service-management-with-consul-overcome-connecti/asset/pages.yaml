  md: "> Note\n> The author can't be held responsible for any costs you incur during\
    \ this practice. Please be sure to destroy your infrastructure when you quit for\
    \ the day or night. If you want to set up an m3.xlarge system and leave it running\
    \ for days, that's up to you!\n\nAll right—let's take a look at what we are building.\
    \ All of the following code blocks (in this section) are within the main.tf file.\
    \ It is Terraform best practice to have all pieces of the code in one file, so\
    \ that's what we're going to do here!\n\nThis first section is fairly simple and\
    \ simply sets up the Terraform providers that we'll be using. A Terraform provider\
    \ is kind of like a module that provides functionality specific to the provider—for\
    \ example, we're installing the AWS provider, enabling us to manage resources\
    \ in AWS. We're specifying the version of that provider, and the region that we'll\
    \ be working in. The provider block is also where naughty people would insert\
    \ their AWS credentials, but we're never going to do that—WILL WE??? Finally,\
    \ we're using an AWS data source to find the image that we just built using Packer.\
    \ Here's the code you'll need:\n\n```\nterraform {\n  required_providers {\n \
    \   aws = {\n      source  = \"hashicorp/aws\"\n      version = \"~> 2.5\"\n \
    \   }\n  }\n}\nprovider \"aws\" {\n  region = var.aws_region\n}\ndata \"aws_ami\"\
    \ \"an_image\" {\n  most_recent = true\n  owners      = [\"self\"]\n  filter {\n\
    \    name   = \"name\"\n    values = [\"${var.owner}-consul-*\"]\n  }\n}\n```"
