- pgno: 205
  md: "```\n```json\n\"ModifyIndex\": 237,\n\"LockIndex\": 0,\n\"Flags\": 0,\n\"Value\"\
    : \"Y2hxaXJ2b3lhbmN1\",\n\"Session\": \"\"\n}\n```\n```\n\nWe can see that the\
    \ output of this command provides us with the nearly identical output from the\
    \ API when we were reading the value for our key. However, we aren't talking about\
    \ manual operation; we want…say it with me…AUTOMATION!\n\nWithin the Consul agent\
    \ configuration, we can define the watches that we want to be running on the platform\
    \ along with a handler. The handler performs some function based on the results\
    \ of the watch, and can either call an HTTP interface or execute some custom script.\
    \ Therefore, as the values for a watched key change, Consul will execute that\
    \ handler to proactively notify some device. For example, the following watch\
    \ section added to the agent configuration would result in the execution of an\
    \ update_configs.sh script:\n\n# Sample watches configuration\n\n```\n```hcl\n\
    watches = [\n    {\n        type = \"key\"\n        key = \"son/seventh/gift\"\
    \n        handler_type = script\n        args [\"/etc/consul/updates_configs.sh\"\
    ]\n    }\n]\n```\n```\n\nThis particular watch pays special attention to a particular\
    \ key, however, recall that we can define a watch with keyprefix, enabling us\
    \ to watch an entire path within the Consul KV store. This provides us with the\
    \ ability to create multiple keys for a particular configuration, and when any\
    \ one of those keys change, the watch will execute the handler, and perform the\
    \ desired operation."
