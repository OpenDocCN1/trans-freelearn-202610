- pgno: 176
  md: "This shows us that our Python-based web server is listening on port 8080, with\
    \ the address `0.0.0.0`. This value represents all available addresses and interfaces.\
    \ With that configuration, any device that can reach this machine can access port\
    \ 8080. To increase security, we're going to change how we run that `httpd` server\
    \ for this exercise:\n\n```\n```bash\nnohup python3 -m http.server 8080 --bind\
    \ 127.0.0.1 &\n```\n```\n\nWith the additional `bind` configuration flag, we are\
    \ telling the Python `http` server to **only** listen on `127.0.0.1`, which is\
    \ the localhost of the machine. To validate this, we can run our handy dandy `netstat`\
    \ command again, providing us with the following result:\n\n```\n```text\ntcp\
    \        0      0 127.0.0.1:8080        0.0.0.0:*\nLISTEN     7954/python3\n```\n\
    ```\n\nWith the server listening only on the localhost address, no outside application\
    \ can access the server. Unless, of course, they start getting meshy. So, now\
    \ I have to ask, are you ready to get meshy with me?\n\nWithin the repository\
    \ folder for *Chapter 6, Connect Four or More*, I've placed a new `httpd.json`\
    \ file, as well as a `curl.json` file. These are going to represent our new meshy\
    \ services, and as part of the Terraform build, these files will be placed on\
    \ the Consul clients.\n\nThe `httpd.json` service definition hasn't changed much\
    \ from our original definition, with one main exception. We now have a connect\
    \ configuration block, which identifies that this service is going to utilize\
    \ a sidecar for connectivity. That sidecar is the proxy server.\n\n# httpd.json\n\
    \n```\n```json\n{\n    \"service\": {\n        \"name\": \"httpd\",\n        \"\
    id\": \"httpd-1\",\n        \"tags\": [\n            \"python-server\"\n     \
    \   ],\n        \"port\": 8080,\n        \"connect\": {\n            \"sidecar_service\"\
    : {}\n        }\n    },\n```\n```"
  merge: -1
  img_proc: true
- pgno: 177
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 178
  md: 'Notice that the connect portion of this configuration is slightly more involved.
    For the sidecar service, we need some additional parameters to tell the proxy
    server what service curl will be connecting to (httpd), as well as the local port
    on which the proxy server should listen for requests. Within my system, and I
    encourage you to play along, I have the httpd service running on one Consul client,
    with the curl process on another. However, when I try to look at these services
    within the Consul UI, I find they are not in a healthy state!


    ![](img/52479dafaefba00517c48a137e037b7e_178_0.png)


    Figure 6.5 – Unhealthy httpd and curl services


    What we can see in Figure 6.5, however, is that the services are in service mesh
    with proxy. Well, this is new! I wonder if the fact that the service is in a service
    mesh has something to do with the lack of availability. If we look at the service
    instances, we can see that there is this thing called Connect Sidecar Listening,
    which we also haven’t seen before. This looks to be the problem, and it obviously
    appears similar to the sidecar stuff we’ve been playing with.'
  merge: -1
  img_proc: true
- pgno: 179
  md: '![](img/52479dafaefba00517c48a137e037b7e_179_0.png)


    In order to get this service healthy, the sidecar needs some attention. What we''ve
    done so far is register an httpd service in the catalog, and we''ve told Consul
    that the service will be accessible via proxy. However, we haven''t done anything
    to start that proxy! When utilizing the service mesh, every application (unless
    it supports the mesh natively) requires its own proxy service. Therefore, if Consul
    isn''t aware of any running proxy service that is paired with the service, the
    service will not be in a healthy state. To fire up the proxy server for the `httpd`
    service, all we need is a single command:


    ```

    ```bash

    $ consul connect proxy -sidecar-for httpd-1 > ~/httpd-proxy.log

    &

    ```

    ```


    What we''ve done here is tell Consul to issue a connect request, utilizing the
    internal proxy, operating as a sidecar for the `httpd-1` service. *But wait, I
    thought it was just httpd!* How astute you are . . . I''m very impressed! When
    creating the proxy services, we utilize the **ID** of the service, not the **name**
    of the service. Any output of that request is being redirected to a log file,
    and we''re running the command in the background. Once we run that command, the
    service is now healthy and happy within the Consul system.'
  merge: -1
  img_proc: true
- pgno: 180
  md: 'Now, we have to get the curl service up and running. I find it strange calling
    curl a service since it''s only a simple command line, but for our purposes, we
    are going to imagine curl is a client application accessing some web server. To
    get the proxy server for the curl service running, we''re going to run a similar
    command:


    ```

    $ consul connect proxy -sidecar-for curl > ~/curl-proxy.log &

    ```


    Now we have proxy servers for both curl and our web server running. From the Consul
    UI, both services are healthy, and we can even see the topology for the service
    connections. The topology isn''t very exciting at the moment (like curling), but
    as the number of services grows, having a view of what services are connected
    is critical to understanding the communication paths. The path that we''ve established
    is represented in Figure 6.7:


    ![](img/52479dafaefba00517c48a137e037b7e_180_0.png)


    Figure 6.7 – Connected services via proxies


    Let''s walk through this flow a bit from the client''s perspective. We have a
    proxy server running alongside a service we are calling curl. The definition of
    that service, specifically the local_bind_port, identifies a port (3579) that
    the proxy should be listening to for messages. Any messages that the proxy receives
    on that port are going to be sent upstream to the httpd service. Note that we
    have no port or address for that service configured; all we have is the service
    name used as the destination. On the server side, we have another proxy server
    running alongside our httpd service. We haven''t defined a port for that service,
    the proxy server dynamically allocates the port when it starts. For this instance,
    the proxy server allocated port 21000. Because the httpd service is running on
    port 8080 on the internal localhost interface, the proxy server knows to forward
    requests to that port.'
  merge: -1
  img_proc: true
- pgno: 181
  md: 'To demonstrate that we have the mesh working properly, we''re going to pretend
    that we are that client application. So, emulating a client request, from the
    client machine, we are going to reach out to port 3579. That message will flow
    through both proxy servers to the httpd service:


    ```

    $ curl http://localhost:3579

    ```


    The response is a directory listing of the server node from /home/ubuntu, where
    the Python web server is running. If you want to double-check, you can use a utility
    called tcpdump:


    ```

    $ sudo tcpdump -nnvvXSs 1514 -i any port 21000

    ```


    If you run that command on the server node that is running the httpd service and
    then issue the curl command, you''ll see packets received and sent. Don''t worry,
    you aren''t expected to be able to read the packet information. As a matter of
    fact, you won''t be able to! The proxy servers are utilizing certificates provided
    by Consul to encrypt that communication. Although there is no encryption configured
    on the web server or the curl utility, the communication between the two devices
    is successfully encrypted. Furthermore, the routing that we did was all based
    on the service name, without any address configurations! At this point, you deserve
    a congratulatory virtual hug.


    It is important to note at this point that the Consul server cluster isn''t participating
    in the actual exchange of information between the client and the server. The data
    between these applications flows through the proxies directly to each other. This
    path of data is often called the data plane. Very inventive, I know. However,
    the information about those proxy servers that is necessary to establish that
    data connection is managed by Consul. All of the activities that Consul performs
    in this effort take place on the control plane. After all, these are the communications
    necessary to control your cluster! With that centralized control point, we have
    the ability to create rules to either permit or deny communications between services.
    Within the world of Consul, we call these intentions.


    # State your intentions


    Now that we understand how our applications will communicate over the service
    mesh, we need to understand how to configure and manage that communication. We
    may want to think that all of our services will live in harmony, and only those
    that should speak to each other shall do so. However, as altruistic as this idea
    is, it isn''t very realistic. Therefore, we need a mechanism to easily define
    what applications can, and more importantly cannot, access one another within
    the Consul system. For this, we use what is called a Consul intention.'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'The nice thing about where we are with Consul services is that each service
    is defined by a human-understandable name. I would strongly recommend clear and
    distinct service names within any system simply to avoid ambiguity. However, that
    effort provides some additional comfort in that we can now specify intentions
    via the service name. If you''ve ever had to deal with any sort of IP-based firewall,
    you should find this very reassuring. Similar to an IP-based firewall, however,
    the Consul intention defines the connection based on the source of the communication
    method, and the destination service or application. The granularity of that control,
    however, depends on what protocol the service is defined to use.


    The service definition enables the ability for the administrator to define the
    protocol on which the application resides. There are four options for the protocol:
    tcp, http, http2, and grpc. However, for intentions, we are going to focus on
    the first two, tcp and http.


    The `tcp` protocol definition provides greater flexibility than the `http` protocol,
    as it extends supportability beyond `http` servers. If you want to utilize Consul
    for a database, for example, this uses the `tcp` protocol. In this instance, the
    identity of the application encoded within the mTLS certificate is a combination
    of IP address and TCP port. Intentions that manage these connections are called
    layer 4 intentions. If we look at the Application layer, layer 7, we can set intentions
    based on the actual URL utilized within the communication. This is necessary for
    service routing and splitting, which we discussed previously regarding the proxy
    servers.


    One additional important distinction between layer 4 intentions and layer 7 intentions
    is when intention updates become effective. Without delving too deep, when there
    is a TCP connection between client and server, that connection is established
    and remains connected for the life of the communication path. For HTTP, however,
    the connection is only active for the request and response for the information.
    Therefore, layer 7 intentions may become effective much more quickly than layer
    4 intentions. Consul doesn''t tear down existing connections, so only when a new
    connection request is made will the intention have an impact.


    Regardless of the layer at which the intentions are enforced, the configuration
    procedure is identical, and it only requires three pieces of information: the
    name of the service, the source of the communication request, and whether to allow
    or deny the connection. Before we get into the definition of the intentions, I
    want to revisit the ACL section of *Chapter 4, Data Center (Not Trade) Federation.*'
  merge: -1
  img_proc: true
- pgno: 183
  md: 'If you recall, there are two methods in which Consul will run as a default
    for ACLs. We can either implicitly deny all requests and only specify the access
    that is permitted, or we can implicitly allow all requests and specify which connections
    we want to deny. Following along with the zero-trust model, critical to any security
    posturing, the implicit deny should be in place for any production environment.
    Consul intentions follow the same model, where we can either implicitly accept
    all network connections or implicitly deny all network connections. Whatever policy
    you have configured for your ACLs, the same policy applies to your intentions.
    For example, if your ACL policy is deny all, then by default any allowed service
    connections need to be explicitly defined. As we''ve already shown traffic flowing
    through the mesh, we can see that we don''t have a deny all ACL policy in place.


    So, in order to play with intentions, we''ll be using that same curl to http server
    connection that is already established. Utilizing the CLI, let''s take a look
    at the services that are registered within the Consul catalog:


    ```

    $ consul catalog services

    consul

    curl

    curl-sidecar-proxy

    httpd

    httpd-sidecar-proxy

    ```


    Note that we actually have services listed for each of the sidecar proxy servers.
    However, our intention is to manage the actual services, curl and httpd. If we
    want to prevent communication between curl and httpd using the command line, it
    is quite simple:


    ```

    $ consul intention create -deny curl httpd

    ```


    The CLI responds, acknowledging the creation of the intention:


    ```

    Created: curl => httpd (deny)

    ```


    With this in place, let''s go ahead and try issuing that curl command again:


    ```

    $ curl http://localhost:3579

    curl: (52) Empty reply from server

    ```'
  merge: -1
  img_proc: true
- pgno: 184
  md: 'As you see, we are no longer able to connect: `Empty reply from server.`

    I get the same reaction when I ask if a menu item is vegan…empty reply from server.

    If you observe the logs from the `httpd` server when this happens, we get a very
    interesting message:


    ```

    ```text

    [ERROR] proxy.connect: authz call denied: service=httpd

    reason="Matched L4 intention: default/curl => default/httpd

    (ID: a605dfa9-cdcc-b304-400d-3fe708b603c1, Precedence: 9,

    Action: DENY)"

    ```

    ```


    From the result, we can plainly see that an attempt was made from `default/curl`
    to `default/httpd` and it was denied. The *default* value that we see here relates
    to the namespace that the services, and the intention, applies to. This allows
    unique intentions to be configured and assigned for individual namespaces within
    the Consul system. Furthermore, we already know that with the proper ACL tokens,
    we can ensure that only those that are authorized can create intentions in their
    own namespaces. We also have a precedence value returned. With any rules in life,
    there is going to be an order of precedence. There may also be wildcards in place
    to generalize some of those rules and help with the management. For example, we
    may want to make sure that certain services on our system *only* receive connections,
    and never transmit. For example, our `httpd` service should never be initiating
    connections to any other service. For this purpose, we can wildcard an intention
    that instructs Consul to deny any request originating from the `httpd` service:


    ```

    ```shell

    $ consul intention create -deny httpd ''*''

    ```

    ```


    If you aren''t implicitly denying all connections within your production environment,
    this type of rule can be incredibly useful to manage any potential breach of an
    application. For example, if our `httpd` service was compromised and used to send
    information to any other service within our mesh, this intention would explicitly
    prevent such an occurrence from happening. It should be noted as well that wildcard
    intentions are very low in the precedence list, as shown in *Figure 6.8*. The
    more precise the intention, the higher the precedence that intention will have
    in the evaluation.'
  merge: -1
  img_proc: true
- pgno: 185
  md: '| Source Namespace | Source Name | Destination Namespace | Destination Name
    | Precedence |

    |---|---|---|---|---:|

    | Exact | Exact | Exact | Exact | 9 |

    | Exact | * | Exact | Exact | 8 |

    | * | * | Exact | Exact | 7 |

    | Exact | Exact | Exact | * | 6 |

    | Exact | * | Exact | * | 5 |

    | * | * | Exact | * | 4 |

    | Exact | Exact | * | * | 3 |

    | Exact | * | * | * | 2 |

    | * | * | * | * | 1 |


    Figure 6.8 – Consul intentions order of precedence


    Within our Consul system, we have now created two intentions: one to prevent `curl`
    from communicating with the `httpd` service, and another to prevent any outward
    communication from that `httpd` service to any other service. Within the Consul
    UI, all of the configured intentions are visible, and can even be sorted by order
    of precedence! As the number of services, and therefore intentions, grows, this
    view can be incredibly useful.


    ![](img/52479dafaefba00517c48a137e037b7e_185_0.png)


    Figure 6.9 – Intentions in the UI'
  merge: -1
  img_proc: true
- pgno: 186
  md: 'Managing intentions within the UI is quite simple either by creating a new
    intention or editing an existing intention. Every service within the Consul mesh
    is provided as a source and destination, and we can either choose to allow, deny,
    or create an **Application Aware** rule:


    ![](img/52479dafaefba00517c48a137e037b7e_186_0.png)


    *Figure 6.10 – Editing intentions within the UI*


    The **Application Aware** rules add complexity through the use of explicit permissions.
    Recall that layer 7 intentions provide additional functionality to define intentions
    based on the path of the URL or even the headers in the request.


    Up until now, every scenario that we''ve been discussing has been based on the
    event that every application and service exists within the service mesh. What
    can we do about services that reside outside of the mesh? Well, I''m glad you
    asked, as that question provides an excellent gateway to the next topic.'
  merge: -1
  img_proc: true
- pgno: 187
  md: '# Gateways to domination


    Wow, such wonderful and entertaining information on the service mesh! But I have
    a problem: not all of my services are eligible for the mesh. To quote the Finnish-American
    architect Eero Saarinen, *have you tried gateway?*


    To think that every service, and every application, will reside within a single
    service mesh is quite unrealistic for any enterprise deployment. For this reason,
    Consul offers the concept of a **gateway**. Nearly every gateway in existence,
    be they spiritual, philosophical, or physical, connects two realms of existence.
    Looking at Consul, we can view each cluster as an individual realm, within which
    services are discovered and can safely communicate with each other. However, we
    need to consider the following scenarios as well:


    +   - **Multiple data centers** – We know we can connect multiple Consul clusters
    within different data centers. However, when we leave the mesh, we lose the security
    of identity and encryption.

    +   - **External services** – Not every service that we need will exist within
    the service mesh. As we’ve seen, the mesh requires a proxy server co-resident
    with the relevant application. Many services, such as hosted databases, don’t
    offer an embedded mesh compliant proxy server (at least, not yet).

    +   - **External clients and applications** – Especially if we are offering services
    to end consumers, the mesh needs to accept traffic from external entities. There
    must be a way for external entities to enter the mesh to access the services they
    are entitled to.


    Each of these three scenarios requires a Consul agent dedicated to the function
    of gateway operation. Additionally, the Envoy proxy must be paired with that agent
    to provide that tunnel-like connection. As we saw in the previous section, Consul
    utilizes the Envoy proxy server to manage the connections among services within
    the mesh. This functionality wouldn’t be possible without the tight coupling between
    Consul and Envoy, a coupling that is required for the mesh gateways. Therefore,
    Envoy at this point is the only proxy server supported for this purpose. Let’s
    take a look at how Consul applies various gateways in these scenarios.'
  merge: -1
  img_proc: true
- pgno: 188
  md: '# Mesh gateways


    We''ve seen how we can connect services securely using the service mesh. I like
    to think about mesh gateways as kind of a *super-mesh*. Utilizing WAN federation,
    which we played with back in *Chapter 4, Data Center (Not Trade) Federation*,
    we are able to connect Consul clusters across multiple data centers. The Consul
    mesh gateway takes that connection and adds not only the encryption to that connection,
    but also the ability to control which services are permitted to traverse those
    data centers.


    ![](img/52479dafaefba00517c48a137e037b7e_188_0.png)


    Figure 6.11 — Mesh gateways connecting data centers


    Whenever we connect a service within the Consul service mesh, the Consul server
    cluster manages the certificates for identity and encryption through the **connect**
    functionality. Connecting clusters through the mesh is no different; however,
    we all know what happens when we have more than one boss (let alone six bosses
    Bob, six bosses). Therefore, whenever we are connecting data centers via a mesh
    gateway, a primary data center must be identified to manage and distribute the
    certificates. These certificates create a new mTLS session between mesh gateway
    peers used for identity. It is important to note here that the encrypted traffic
    that flows through the mesh gateway is still service-to-service encrypted. In
    other words, the mesh gateway entities do not decrypt the message between services;
    they only retain the encryption that was already performed at the service endpoints.'
  merge: -1
  img_proc: true
- pgno: 189
  md: "Well, what if we don't want all of our services traversing through the gateway?\
    \ No problem! When the services are connected through the mesh gateway, the Consul\
    \ clusters recognize those services, and we can write intentions! This gives the\
    \ Consul administrators the immense power of not only controlling the service\
    \ mesh within a single cluster, but the entire world! Furthermore, as part of\
    \ the service definition, we can tell Consul that the **upstream service** (the\
    \ service we want to initiate the connection to) is available via the mesh gateway.\
    \ Let's take a look at a modified `curl` service as an example.\n\n# Curl.json\
    \ across the mesh gateway\n\n```\n{\n    \"service\": {\n        \"name\": \"\
    curl\",\n        \"tags\": [\n            \"curl-client\"\n        ],\n      \
    \  \"connect\": {\n            \"sidecar_service\": {\n                \"proxy\"\
    : {\n                    \"upstreams\": [{\n                        \"destination_name\"\
    : \"httpd\",\n                        \"datacenter\": \"secondary\",\n       \
    \                 \"local_bind_port\": 3579\n                    }]\n        \
    \        }\n            }\n        }\n    }\n}\n```\n\nWithin this slightly altered\
    \ service definition, we are telling Consul that the `httpd` service that we want\
    \ to reach is available in the data center named *secondary*. This is a great\
    \ example of connecting to another Consul data center for access to a service,\
    \ but what if the intended service isn't within the mesh?"
  merge: -1
  img_proc: true
- pgno: 190
  md: '# Terminating gateways


    With the proliferation of **anything as a service (*aaS)**, cloud providers are
    working very hard to differentiate themselves and remain competitive. At least,
    that''s my theory, which I believe leads to hosted services that would normally
    require dedicated compute. Even if it isn''t true, it sounds logical, and besides,
    I''m pretty sure I read it on the internet somewhere. Hosted database services
    are a wonderful example of this functionality, and unfortunately, we can''t deploy
    a Consul agent on a hosted AWS database service. For this purpose, we have the
    role of a terminating gateway.


    ![](img/52479dafaefba00517c48a137e037b7e_190_0.png)


    Luckily, this gateway isn''t wandering through the clouds looking for Sarah Connor.
    However, what it does terminate is the security and control of the Consul services.
    All is not lost, however, because if the destination service supports mTLS, the
    terminating gateway will maintain that secure connection. If the service only
    supports one-way TLS, the gateway can work with that too; however, this can open
    the terminating gateway to potential attacks. As the gateway is at the edge of
    the mesh, unlike the mesh gateway, it does have the ability to decrypt the traffic
    it receives. Therefore, it is always recommended to tightly control access to
    the node operating as the gateway. There is a problem though ... how does Consul
    know about the services that aren''t even inside the Consul cluster?'
  merge: -1
  img_proc: true
- pgno: 191
  md: 'Recall that as we were discussing service discovery in *Chapter 5, Little Bo
    Peep Lost Her Service*, Consul is able to contain services within the registry
    that are not being managed by Consul. These are **external** services, which kind
    of makes sense, as they are **external** to Consul. Any services that are to be
    accessible via the terminating gateway must be registered in Consul; after all,
    if they aren''t, how can we discover them? When we configure a terminating gateway,
    we need to list the services that are available through that gateway. This is
    the only way that Consul can manage the discovery and connection from within the
    mesh to those external services. We can still use ACLs and security up to the
    gateway node; however, once the traffic leaves the gateway, we need to resort
    to old-fashioned networking, the way our grandmothers did.


    # Ingress gateways


    Next, we have to think about all of those entities that are outside in the great
    big scary world that want to access the wonderful services that we offer! This
    requires a method to open the service mesh and invite others to join us. However,
    we just don''t want to open the door and let anything into our mesh. We''ve worked
    very hard and have put up with a plethora of horrible jokes to secure our beautiful
    mesh. The last thing we want is to put the mesh at risk by allowing nefarious
    traffic through the door.


    ![](img/52479dafaefba00517c48a137e037b7e_191_0.png)


    Figure 6.13 – Ingress gateways'
  merge: -1
  img_proc: true
- pgno: 192
  md: 'Luckily, any service that we would want to be accessible via the ingress gateway
    should already be registered within the Consul service catalog. However, we don''t
    want to expose ourselves completely as part of the process. Consul allows us to
    define a listener as part of the configuration for the ingress gateway. This listener
    tells the Consul agent (and Envoy proxy as well) which port to listen on, and
    what the associated service is. With this configuration, the ingress gateway can
    receive traffic on the specified port and forward that traffic to the appropriate
    destination service.


    Now that we can see how Consul can connect internal and external services to the
    mesh network, let''s take a quick look at an environment that exists as individual
    networks that yearn to be connected.


    # Meshing with Kubernetes


    Throughout this entire chapter, I''ve only mentioned Kubernetes once, and that
    was in passing. This is partly due to my loathness of Kubernetes and the number
    of hours I''ve struggled with the technology. However, service orchestrators such
    as Kubernetes (or Nomad) definitely have a place in the world of service mesh.
    In fact, many people don''t think about service mesh unless it is within the realm
    of one of these application orchestration tools. We aren''t going to get into
    the details of Kubernetes for a number of reasons (some of which I''ve already
    mentioned). However, I do want to address why service mesh is so important within
    this arena.


    Application orchestration provides an entire operating environment in which our
    applications reside. Once deployed within the environment, the primary job of
    the orchestrator is to ensure that the desired number of instances are operating
    and that the resources are being managed. The application can reside anywhere
    within the cluster of machines, so long as any constraints are satisfied. If the
    application fails, it is up to the orchestrator to restart the instance somewhere
    within the cluster. Additionally, when performing upgrades of machines, the orchestrators
    are able to move the applications throughout the cluster to best suit the desired
    goal. Essentially, the orchestrator, whether it''s Kubernetes or Nomad, has full
    control over the location, and therefore the addressing, of the application. This
    migratory and ephemeral nature of the applications dramatically complicates the
    problems of IP addressing discussed earlier.'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'Within Kubernetes, we have our own server cluster to manage all of the **nodes**
    (machines) and applications being orchestrated. Today, we have the benefit of
    the cloud providers offering their own managed Kubernetes services, dramatically
    simplifying the (often severe) burden of managing the cluster. The cluster can
    have any number of **nodes**, which provide the compute resources for the applications
    to be deployed. Each application being deployed and managed is packaged as a **container**.
    This brings us to the Pod, which is a set of one or more containers that live,
    operate, and tie together. The Kubernetes Pod often shares various attributes
    among the containers within the Pod. These attributes include things such as storage,
    and . . . wait for it . . . networking!


    ![](img/52479dafaefba00517c48a137e037b7e_193_0.png)


    Figure 6.14 – Kubernetes at a high level


    When deploying applications to Kubernetes, we use a command called `helm`, which
    is accompanied by a helm chart that defines how the application is to be deployed.
    Consul provides its own helm chart for this purpose and is available publicly
    on GitHub (`https://github.com/hashicorp/consul-k8s`). Utilizing this helm chart,
    Consul can be installed alongside the relevant Pod(s) within the Kubernetes cluster,
    facilitating a secure network connection to the Pod. Much like the mesh example
    outside of Kubernetes, within Kubernetes the Consul Connect feature utilizes the
    Envoy proxy server as the connection point to the application. The primary difference
    is that instead of the Consul agent running as an individual process, it runs
    as a **sidecar** process within the cluster configured with Kubernetes **annotations**.
    This process is the same regardless of whether the application is the destination
    for the mesh connection or the source for the mesh connection with an upstream
    service.'
  merge: -1
  img_proc: true
- pgno: 194
  md: 'Again, when the topic of service mesh arises, it usually relates to the concept
    of orchestrators such as Kubernetes. However, I hope I''ve been able to show you
    how the applicability extends far beyond the Kubernetes cluster. Kubernetes is
    an advanced topic in itself and, in my opinion, can be very confusing, and it
    is exactly that level of complexity that requires technologies such as the Consul
    service mesh.


    # Summary


    Congratulations! If you''ve been able to follow this chapter and deal with my
    horrible jokes, you have a foundational view of the Consul service mesh. The topic
    of service mesh is a very lengthy one, and I truly hope that this has provided
    a decent start to that messy journey! We discussed (well, I wrote, and you read)
    a bit about traditional networking and why the service mesh is such a valuable
    tool in today''s multi-cloud world. We were able to see a bit of how the mesh
    worked, connecting our services securely, and how to ensure some services did
    *not* connect. We had a brief overview of how to use the mesh principles to connect
    data centers, and how to support services outside of the mesh. Finally, we had
    a very high-level view of how Consul operates within the world of Kubernetes.


    If the topic of service mesh really gets you tingly, I strongly recommend you
    continue your education. HashiCorp has several tutorials on the topic, and as
    the need for the mesh has grown, countless blogs and videos have been produced.
    The topic is far too broad for a single chapter, but I do hope that I was able
    to provide some clarity on the subject. Next, we''re going to look at how Consul
    can help us minimize, or eliminate, those dastardly tickets for network changes
    through automation!'
  merge: -1
  img_proc: true
- pgno: 195
  md: '# 7

    Animate Me


    We''ve already talked at great length about the Consul cluster''s awareness of
    the services and applications deployed within the system, along with their corresponding
    health. Why should Consul keep all of this information to itself? A big part of
    the successful existence of any network, human or machine, is the sharing of information.
    Throughout this chapter, we''re going to look at a few ways that Consul is able
    to share that information with third-party components in order to improve our
    lives through automation:


    +   - Key/value (KV) store – Consul utilizes the distributed KV store to share
    information among Consul nodes, but this can also be used by humans and machines
    to share data and directives throughout the cluster.

    +   - Watches and handlers – In Chapter 5, Little Bo Peep Lost Her Service, we
    saw how Consul watches and handlers are able to announce specific changes to the
    service status. In this chapter, we''ll see how this can be used to distribute
    information to third-party components.

    +   - Consul and Terraform – Although this isn''t a book on Terraform, we have
    been using it to create and manage our infrastructure. The final section of this
    chapter is going to show how Consul works with Terraform to automate nearly any
    infrastructure components based on Consul''s application and service awareness.


    So, whether the title of this chapter conjures up fears of the singularity overtaking
    humans, or the sounds of an incredible song from the band Rush, please join me
    as we journey into the world of a more intelligent and self-reliant network.'
  merge: -1
  img_proc: true
- pgno: 196
  md: 'The following topics will be covered in this chapter:


    +   - The need for automation

    +   - Distributed configuration with the KV store

    +   - Watching your handlers

    +   - Floating with Consul-Terraform-Sync


    # Technical requirements


    Within this section, we''ll be deploying a full Consul cluster to **Amazon Web
    Services (AWS)** utilizing Terraform. If you''ve already gone through *Chapter
    2, Architecture – How Does It Work?*, set up your AWS account, downloaded Terraform,
    and cloned the repository, you''re in great shape!


    Within the `ch7` folder of the repository, we have a similar structure as for
    `ch 2 folder`, providing the code for creating the image, and of course, creating
    the Consul cluster. If you would like to follow along, use `ch7` to create a new
    Consul cluster, which includes some of the service configuration files you''ll
    utilize within this chapter.


    # The need for automation


    Within the world of information technology, we live by tickets. Thankfully not
    speeding tickets or violation of other laws, but methods in which work can be
    requested and addressed. Entire product lines and organizations have been built
    around these processes, and rightfully so. I have a colleague who raves about
    a book called *The Phoenix Project*. If you haven''t read or listened to it, I
    would strongly recommend it. The entire fictional story focuses on the process
    problems with IT and how technology might be all well and good, but the *process*
    of making changes often dictates the success or failure of any project.


    As we look at our networking and security equipment, the importance of following
    this ticketing system increases by orders of magnitude. It''s not like ordering
    the wrong virtual machine size or the wrong operating system. The slightest misstep
    can disrupt entire organizations and cause millions of dollars in damage and lost
    revenue. Therefore, any changes to this equipment need to be officially requested,
    evaluated, tested, and tracked throughout the change management process. You don''t
    have to work in this field to have felt the challenge of DNS settings taking down
    entire networks and preventing our kids from attending virtual classes!'
  merge: -1
  img_proc: true
