  md: "```\n}\n}\nresource aws_internet_gateway \"consul-demo\" {\n  vpc_id = aws_vpc.consul-demo.id\n\
    \n  tags = {\n    Name = \"${var.owner}-internet-gateway\"\n  }\n}\nresource aws_route_table\
    \ \"consul-demo\" {\n  vpc_id = aws_vpc.consul-demo.id\n  route {\n    cidr_block\
    \ = \"0.0.0.0/0\"\n    gateway_id = aws_internet_gateway.consul-demo.id\n  }\n\
