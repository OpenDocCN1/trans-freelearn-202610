- pgno: 41
  md: 'Remember where the files are saved, and once the download is complete, unzip
    the files. You''ll end up with a single `terraform` executable file and a single
    `packer` executable file that you need to save to a happy home and ensure that
    `home` is in your command-line path.


    That''s it! Now, you might be asking: Rob, *if it''s that easy to download and
    use Terraform, why isn''t everybody doing it?* That is a very good question, my
    dear reader...*a very good question.*


    # What a cluster!


    If you''ve just set up your AWS account and installed Terraform, I can imagine
    you are ravenously awaiting the moment to fire up a cluster. Don''t worry—as Robert
    Plant always used to say, *your time is gonna come.* First, we''re going to dig
    a bit deeper into the mechanisms employed within the Consul cluster operation
    itself. I may have mentioned this before, but one of the core applications of
    Consul is to facilitate and enable a simpler and more secure communication mechanism
    among all of the services within the network. Consul would never be able to facilitate
    external communication if it didn''t have a handle on its internal communication.
    So, let''s look at the communication mechanisms and flows within the entire Consul
    cluster, both servers and clients.


    Starting with the servers, what is the fundamental information they need to share
    and communicate? Here''s what''s required:


    +   1. Leader election—After all, without a leader, there will be anarchy, and
    services will be burning in the streets.

    +   2. Client registration—Servers obviously need to know when clients join the
    cluster.

    +   3. Service status and location—The servers need to know the status of each
    service deployed within the cluster, as well as their location.


    In order to elect a leader, the server nodes have to gain consensus. They do this
    using a protocol called—well—**consensus**. We''re going to take a closer look
    at this protocol in an upcoming section, but essentially what happens is that
    when the server nodes spin up, there will be an election. If the server hasn''t
    received notification that somebody stepped forward to be a leader, it will elect
    itself. If somebody else elected themselves first, then the server will vote for
    that initial leader. Eventually, all of the servers will gain *consensus* and
    there will be an undisputed leader. Again, we''ll see how this works in more detail
    and discuss the potential issues in a later section.'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'The status of the deployed services and their location is something that isn''t
    needed only by the server, but also by the clients distributed throughout the
    network. Now, this level of communication isn''t anything new, right? The servers
    need to know what''s happening with the clients and the client function in nearly
    any distributed system. However, as these systems scale, you end up with hundreds,
    thousands, or even tens of thousands of clients all trying to communicate with
    the servers. Eventually, the server leader is going to bang the gavel and insist
    on order in the court! With Consul, however, the servers and the clients all gossip
    with each other, using a protocol called—well—**gossip**. The imagination behind
    the names of these protocols is astounding. Utilizing the gossip protocol, clients
    share information about their own services and status with their neighboring clients,
    and the servers are all listening in. You can see an overview of this process
    in *Figure 2.9*:


    ![](img/52479dafaefba00517c48a137e037b7e_42_0.png)


    So, now that we have everybody talking, what are they all talking about? I want
    to know too! Don''t leave me out! In a feeble attempt to maintain some sort of
    focus, we''re going to first discuss the role of the servers and then move on
    to the clients.'
  merge: -1
  img_proc: true
