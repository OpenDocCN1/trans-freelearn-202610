- pgno: 121
  md: '# 4

    Data Center (Not Trade) Federation


    I''m very happy to tell you (and myself) that after that very challenging chapter
    dealing with Consul security aspects, our discussion about extending your Consul
    cluster will be much lighter. In fact, as many of the features we''ll be discussing
    in this section are specific to Consul Enterprise, there won''t be any exercises!


    In the previous chapters, we focused primarily on setting up and securing our
    Consul clusters. However, as Consul is implemented in enterprise environments,
    we want to look at how to scale the Consul system itself and extend that Consul
    functionality across multiple data centers or regions. To understand the expansion
    of Consul, we''ll be reviewing the following topics:


    +   - Scales – Nope, we won''t be discussing reptilian or musical scales, but
    rather how to scale the Consul system. We''ve seen in earlier chapters how increasing
    server clusters can negatively impact the time to achieve consensus. So, how can
    we ensure that we have enough server structure to manage the cluster as we increase
    our client count? How do we manage upgrades across such a vast system?

    +   - Subdivisions – After we look at how to scale Consul into different areas
    and manage that increased scale, we''re going to look at how to make best use
    of that expanded system. The primary result of this operation is to offer autonomous
    Consul systems within an enterprise environment without giving up centralized
    control.'
  merge: -1
  img_proc: true
- pgno: 122
  md: '+   - Federation – In this global world, services rarely reside in one region
    or data center. In this section, we’re going to see how we connect server clusters
    across multiple regions to ensure that our services can communicate regardless
    of their location.


    Although we won’t be applying the knowledge gained in this chapter directly, I
    will be including code samples to help further explain the implementation of the
    concepts. So, with that, let’s start playing our scales!


    # Protection and scale


    Although Consul agents can work with services on external nodes, best practices
    (and best flexibility) recommend having a Consul agent co-resident on the nodes
    running the connected services. In many enterprises, Consul is connecting thousands
    of services (or more), which means Consul clusters of thousands, or tens of thousands,
    of nodes. Certainly, we don’t want only three to five server nodes managing a
    cluster of that size, so let’s start with expanding the Consul server cluster.


    As we learned in Chapter 2, Architecture – How Does It Work?, bigger is not always
    better when it comes to the size of your consensus pool. We need at least three
    servers to obtain a quorum, but as that server count increases, it’s going to
    take much longer for the pool to elect a leader. In order to resolve this, Consul
    offers the ability to configure Consul server agents as a read replica. When set
    with this flag, the agent doesn’t participate in any quorum election, but it still
    helps deal with node and service registration, just like any other server within
    the cluster.


    ![](img/52479dafaefba00517c48a137e037b7e_122_0.png)


    Figure 4.1 – Read replica servers'
  merge: -1
  img_proc: true
- pgno: 123
  md: 'Using the preceding example, let’s look at our server cluster again. We started
    with Bart, Lisa, and Maggie as our three primary Consul server nodes. We’re able
    to attain consensus quickly, but as Springfield grows, we need to start extending
    our Consul network with more services. So, we end up adding three servers into
    the cluster: Hugo, Marge, and Homer. In order to ensure that neither Hugo, Marge,
    nor Homer has the ability to vote for a server cluster leader, they are designated
    as read replicas via a Boolean parameter in the configuration:


    ```

    server = true

    bootstrap_expect = 3

    retry_join = ["provider=aws tag_key=Name tag_value=${server_name_tag}"]

    bind_addr = "$(curl -s http://169.254.169.254/latest/meta-data/local-ipv4)"

    advertise_addr = "$(curl -s http://169.254.169.254/latest/meta-data/public-ipv4)"

    client_addr = "$(curl -s http://169.254.169.254/latest/meta-data/local-ipv4)"

    ui = true

    read_replica = false

    ```


    When we set this value to true, Consul considers that node to be a read replica
    node, and reflects that configuration in the output of the consul operator raft
    list-peers command:


    ![](img/52479dafaefba00517c48a137e037b7e_123_0.png)


    Figure 4.2 – List of raft peers'
  merge: -1
  img_proc: true
