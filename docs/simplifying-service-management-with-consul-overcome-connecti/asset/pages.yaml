- pgno: 66
  md: "Next, we have the instance identity information and associated roles. This\
    \ doesn't have any direct association with Consul but is required to enable the\
    \ communication paths we need within AWS. The code is illustrated in the following\
    \ snippet:\n\n```\n```hcl\nresource \"aws_iam_instance_profile\" \"instance_profile\"\
    \ {\n  name_prefix = var.owner\n  role        = aws_iam_role.instance_role.name\n\
    }\n\nresource \"aws_iam_role\" \"instance_role\" {\n  name_prefix        = var.owner\n\
    \  assume_role_policy = data.aws_iam_policy_document.instance_role.json\n}\n\n\
    data \"aws_iam_policy_document\" \"instance_role\" {\n  statement {\n    effect\
    \  = \"Allow\"\n    actions = [\"sts:AssumeRole\"]\n\n    principals {\n     \
    \ type        = \"Service\"\n      identifiers = [\"ec2.amazonaws.com\"]\n   \
    \ }\n  }\n}\n\nresource \"aws_iam_role_policy\" \"metadata_access\" {\n  name\
    \   = \"metadata_access\"\n  role   = aws_iam_role.instance_role.id\n  policy\
    \ = data.aws_iam_policy_document.metadata_access.json\n}\n\ndata \"aws_iam_policy_document\"\
    \ \"metadata_access\" {\n  statement {\n    effect = \"Allow\"\n    actions =\
    \ [\n      \"ec2:DescribeInstances\",\n    ]\n    resources = [\"*\"]\n  }\n}\n\
    ```\n```"
  merge: -1
