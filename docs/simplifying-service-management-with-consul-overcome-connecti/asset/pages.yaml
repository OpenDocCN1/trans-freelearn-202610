    ,\n  \"3.138.196.158\",\n  \"18.222.5.4\",\n]\n```\n\nConnect to the first server\
    \ in your list using SSH and the pem key that was created for you. It will be\
    \ based on your owner variable, which you set up way back at the beginning of\
    \ time:\n\n```\n$ ssh -i rjackson-consul-key.pem ubuntu@3.128.25.100\n```"
