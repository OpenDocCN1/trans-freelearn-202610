- pgno: 75
  md: '# Keep It Safe,\nStupid, and Secure\nYour Cluster!


    At this point, you may be saying to yourself, *Wow, two chapters and I''m done.*
    Well, sorry to break it to you, but you are currently very much exposed. Yes,
    we''ve built a basic Consul cluster, consisting of three servers and four clients,
    but there is no security around that system. Essentially, we''ve built a glass
    house with no doors, so anybody can walk in, and anybody can see what''s going
    on inside. Kind of creepy, isn''t it?


    To understand how we''re going to protect our system, and more importantly our
    services, let''s take a look at all of the areas where we are exposed:


    +   - **System communication** – We have seen how all the Consul components communicate
    freely with each other. Anybody can join that cluster without verification, and
    anybody can listen in.

    +   - **Who can do what** – Even if you are verified and authenticated within
    the cluster, we need to make sure that the scope of the actions available is tightly
    controlled. After all, we don''t want just anybody jumping into the cluster with
    full access to the configuration.'
  merge: -1
  img_proc: true
- pgno: 76
  md: '+   - Extending Consul – With the understanding that multiple groups are going
    to access Consul, we want to give each of them the access they need to manage
    their own services, without interrupting others.


    In addition to these areas, there are the basic procedures of securing the operating
    environment. This includes protected access to the operating system and the file
    structure within. These are considered basic administration procedures and aren''t
    covered as part of this book.


    With that, let''s jump right in and start looking at how to start securing our
    glass house!


    # Technical requirements


    With the additional complexities introduced through securing any infrastructure,
    we''ll be working with a new repository that is specific to this chapter:


    ```

    https://github.com/PacktPublishing/Simplifying-Service-Management-with-Consul/tree/main/ch3

    ```


    All the files and code are available, and we''ll be utilizing Packer and Terraform
    again to create our working infrastructure, which means we''ll also need the AWS
    credentials we established in Chapter 2, Architecture – How Does It Work?.


    The exercises contained within this chapter have been performed within a macOS
    Terminal while utilizing the native SSH client. Familiarity with a command-line-based
    file editor is always helpful as well for viewing and editing files where necessary.


    Finally, let''s reiterate what was stated in Chapter 2, Architecture – How Does
    It Work?:


    +   - Always perform a terraform destroy when you are done for the day. It does
    mean you''ll have to rebuild as you continue the work the next day, but what a
    great lesson on immutable infrastructure!

    +   - Be very careful with your AWS credentials. Never share your access key ID,
    and definitely don''t share your secret access key. We''re going to set them as
    environment variables so that they never show up in code, and absolutely never
    show up in your version control system!'
  merge: -1
  img_proc: true
- pgno: 77
  md: '# Protecting the communication paths


    Now, I''m not sure about you, but when I start reading documents about AES, TLS,
    GCM, and so on, my eyes start to gloss over. The plethora of acronyms help us
    chase squirrels in all directions, but that''s not going to help us secure our
    Consul cluster. So, my goal is to explain what we need to do to secure our system
    communications with minimal acronyms. This reminds me of the time I had to write
    a paper in high school without using any of the forms of the verb to be. Thanks,
    Mr. Farley. It is important to remember that, currently, we''re only going to
    focus on securing our clients and servers. Securing and encrypting traffic for
    our services will come later, so please be patient.


    In the second chapter of this book, we learned about the two primary modes of
    communication among the Consul components: **Remote Procedure Calls (RPC)** and
    gossip. But wait – what about this Raft and consensus stuff we''ve read about?
    Well, all that communication utilizes RPC communications, and it is transmitted
    by utilizing TCP. Gossip is what the agents use to communicate with each other,
    and if you recall, it is utilizing UDP. I am calling these out because there are
    going to be two different methods of securing those communication paths. Let''s
    talk about securing the gossip protocol first, simply because that''s a bit easier
    to understand.


    # Securing our gossip


    If you''ve ever seen a group of people gossiping, you know that they are usually
    closely gathered so that nobody else can join and listen in on their conversation.
    When you try to approach the group, suddenly, their conversation goes quiet, and
    paranoia instantly sets in. This is because you may not be a known entity to them,
    or they might not understand where your allegiances lie. If those people were
    more spread out in a larger area, due to social distancing, it would be a lot
    easier to listen in. This is the environment that we are working with for Consul.
    Especially within cloud environments, it''s more difficult to keep the gossiping
    group close together and away from cowans and eavesdroppers.


    Now that we understand that the gossipers can''t exist as a single isolated group,
    what is the best way to ensure that what they are talking about can''t be heard,
    or at least understood, by others? Let''s put a twist into our story (not a piece
    of citrus for our drink). Let''s assume you find yourself in the midst of groups
    of people speaking a language you aren''t familiar with. I can imagine most of
    us have been in that situation – even if they are speaking the same core language,
    you might not understand some of the words they''re speaking. My wife, having
    grown up in Indiana, experienced this when we moved to the Boston area, but that''s
    another story. Within that environment, you may hear that people are speaking,
    but you''re unable to understand what they are saying. This is a great way to
    keep communication open, but safe from those not entitled to the message. This
    is exactly what we are doing to secure our gossiping agents.'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'Consul provides a method of generating a special language, defined by an *encryption
    key*. This message is the same as what we created, but the language that''s used
    is different. This key is distributed to all the agents within the Consul cluster.
    Even if you have multiple clusters communicating with each other, they all need
    to use the same language, and therefore the same key.


    ![](img/52479dafaefba00517c48a137e037b7e_78_0.png)


    Figure 3.1 – Who understands Sumerian?


    At this point, you might be thinking *but Rob, eventually people can learn a new
    language and decipher the message*. Right you are, and although it may take some
    of us more time to learn a different language than others, eventually, if we work
    hard enough, we can figure it out. This is the same for every encryption key,
    password, and certificate, and is the main reason why it''s important to periodically
    change and update these secure items. Essentially, as those around the gossipers
    learn the new language, we need to change the language! When we start talking
    about tens, hundreds, or thousands of gossipers in our group, it can be very challenging
    to have everybody learn the new language, without missing messages. Thankfully,
    Consul can manage a great deal of this for you, and we''ll see how that''s done
    when we deploy our new secure system.'
  merge: -1
  img_proc: true
- pgno: 79
  md: '# Securing our calls


    Unlike gossip, when we call people (unless, of course, it''s a conference call),
    the communications aren''t broadcast to a distributed group of people. That conversation
    is usually person to person, with some level of verification of who you are speaking
    with. This can be the phone number, the source number, a familiar voice, and so
    on. When we look at the communication among our Consul agents, the process is
    very similar. However, we never know when somebody else might be listening in
    on that conversation. Therefore, there are three steps to securing our calls:
    validating who is calling, validating who is being called, and encrypting the
    messages between them.


    ![](img/52479dafaefba00517c48a137e037b7e_79_0.png)


    Figure 3.2 – Secure versus insecure communications


    The way we do this with Consul isn''t that different from what you do nearly every
    day when you open a web browser, log in to your bank account, and send lots of
    money to me. When you do this, your web browser validates that it is connected
    to the proper website for your bank. This validation comes from a certificate
    that is signed by some official authoritative entity, ensuring your browser that
    the site is valid. If you''ve ever seen a pop-up window from your browser that
    says the certificate can''t be authenticated, that means it wasn''t signed by
    a known and accepted authority. As that certificate is exchanged, the browser
    then knows how to encrypt traffic so that the banking website can decipher it,
    and similarly, your browser knows how to decipher the messages coming back from
    the bank. However, there is one slight variation to what we do with Consul.


    Let''s take the scenario again where you are accessing your bank''s website from
    your browser. The bank''s website doesn''t really care where you are (in most
    instances, at least). With Consul, the agent making the call not only validates
    that it''s calling a valid entity, but the one being called also ensures that
    the caller is valid. Let''s dig into this a bit deeper, but don''t worry – we
    won''t be hitting the water with this dig.'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'We’re going to be talking a lot about keys and certificates within this section.
    If you’ve never worked in any detail with Transport Layer Security (TLS), it can
    get a bit confusing, so I’m going to be using some notation to identify servers,
    clients, and private and public keys, based on the characters of the long-running
    animated series The Simpsons. For example, we’re going to have three servers:
    Bart, Lisa, and Maggie. For these three servers, there needs to be some sort of
    trusted authority to identify Bart, Lisa, and Maggie; we’ll call our authority
    Marge.


    All three of our servers require some sort of method to transmit and receive messages
    that only they can understand. If you remember our telephone analogy, they all
    need to validate who is calling, who is being called, and encrypt the messages
    between them. All of this is done using certificates that are made especially
    for them. Now, if Bart created his own certificates and distributed those to Lisa
    and Maggie, they could share secret messages. However, what would prevent Homer,
    who really shouldn’t be privy to the messages, from jumping into the group, sharing
    his own certificates, and seeing these secret messages? For this, we need Marge,
    some sort of centralized authority to ensure that everybody is using the certificates
    that she authorizes. We can call her a Certificate Authority (CA).


    Using her awesome power, Marge produces two certificates for Bart, two for Lisa,
    and two for Maggie. These certificates have special names: a public key and a
    private key. The public key confirms their identity and enables them to encrypt
    messages to the others, while the private key enables them to decrypt the messages
    they receive. Optionally, Marge can create specific constraints, such as how long
    the certificates will last, and which family names are allowed to utilize the
    certificate. For example, if somebody walks in and their last name isn’t Simpson,
    then they won’t be able to use Marge’s certificates.


    Marge produces these certificates using two certificates of her own; one that
    identifies her authority, which we’ll call porkchop, and another secret ingredient
    we’ll call salt. Nobody else knows about Marge’s private secret, for if they did,
    they could use salt in their own certificates, thereby compromising Marge’s authority.
    To summarize, let’s look at the certificates that we have:


    +   - porkchop: A certificate that identifies Marge as authoritative

    +   - salt: Marge''s secret ingredient that she uses to produce certificates

    +   - bart.public_key: A certificate that Bart uses to identify himself and encrypt
    secret messages to Lisa and Maggie

    +   - bart.private_key: A certificate that only Bart has, and that he can use
    to decrypt messages from Lisa and Maggie'
  merge: -1
  img_proc: true
- pgno: 81
  md: '+   - `lisa.public_key`: A certificate that Lisa uses to identify herself and
    encrypt secret messages to Bart and Maggie

    +   - `lisa.private_key`: A certificate that only Lisa has, and that she can use
    to decrypt messages from Bart and Maggie

    +   - `maggie.public_key`: A certificate that Maggie uses to identify herself
    and encrypt secret messages to Bart and Lisa

    +   - `maggie.private_key`: A certificate that only Maggie has, and that she can
    use to decrypt messages from Bart and Lisa


    If Lisa wants to send a message to Maggie, she encrypts the message using her
    own special public key. Lisa sends that message to Maggie, who can open the message
    using her own private key, and validates that message using the porkchop that
    Marge provided. Now, let''s say Homer can create his own public key and encrypt
    his own message to Maggie. Well, that key didn''t use Marge''s authority, nor
    does it have her secret ingredient. Therefore, Maggie knows to reject the message,
    and sad Homer heads to Moe''s.


    ![](img/52479dafaefba00517c48a137e037b7e_81_0.png)


    Figure 3.3 – Certificate and key distribution'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'This is exactly how we secure the calls between our Consul machines. Every
    node in the cluster has its own public key, private key, and an authoritative
    key provided by some centralized CA. For our exercises, we''ll be using Consul
    as our CA. This is just to help us be as independent as possible, but this shouldn''t
    be done in a production environment. In the real world, your company would have
    a CA and somebody in the security team would provide these keys to you (as well
    as new keys as the certificates are rotated). If your company has embraced automation,
    it''s possible to generate these keys by utilizing HashiCorp''s Vault if, of course,
    you are authorized to do so.


    Now that we''ve seen how to secure both the gossip among our nodes and their direct
    messages, let''s look at what else we can do to secure our system.


    # Controlling access with access control


    At the heart of Consul''s functionality is a distributed key/value store. Through
    the gossip protocol, anything that one node learns can be shared with other nodes
    in the cluster. This not only applies to our three main use cases, but often,
    operators will utilize Consul to distribute configuration parameters that the
    associated components can utilize. This can be very helpful if you want to quickly
    change the logging level on all machines. This is especially the reason why, in
    any production deployment, the importance of securing Consul can''t be understated.
    Utilizing the TLS keys, as we discussed in the previous section, we can validate
    and secure the communications between the clients and the servers. If we didn''t
    do this, it would be possible for somebody to pretend to be part of the cluster.


    The access control system within Consul provides an additional level of control
    regarding what each node can do on the network – hence the term *access control*.
    If you''ve ever had to deal with **Access Control Lists (ACLs)** on routing equipment
    or network firewall rules, you may already be familiar with the concept of access
    control. However, with Consul, the rules can be very fine-grained and detailed.
    Of course, this means they can grow to be very complex, increasing the need for
    some level of infrastructure as code (such as Terraform) or another automation
    tool. Before we get into that, though, let''s understand a bit more about what
    the Consul access control system consists of.'
  merge: -1
  img_proc: true
- pgno: 83
  md: 'When we discuss access control in the realm of Consul, there are three main
    pieces that we need to understand: rules, policies, and tokens. Optionally, we
    can create roles for groups of policies as well, targeting groups of nodes, services,
    or data centers that the policy should be applied to. We''ve talked about ensuring
    identification a great deal in this chapter. After all, this chapter is about
    security, and a big part of security is ensuring identity. This is why secret
    handshakes and passes were invented. For Consul access control, that identity
    is provided in the form of a token that is generated by some authoritative entity.
    We''re going to be using Consul for that authority; however, centrally managing
    these tokens in a system such as HashiCorp''s Vault would be preferred, not just
    because I''m currently employed by HashiCorp, but primarily because utilizing
    Vault provides the operator with a centralized and secure method of maintaining
    and rotating these tokens. OK, enough about tokens... what can a token do for
    me?


    When somebody uses a token to access Consul, the token is linked with a policy,
    which contains one or more rules. As the policy is simply a group of rules, we''re
    going to focus on the rules that we can apply.


    ![](img/52479dafaefba00517c48a137e037b7e_83_0.png)


    Figure 3.4 – Tokens, policies, and rules'
  merge: -1
  img_proc: true
- pgno: 84
  md: 'Nearly every rule contains three parts: a rule type, a variable that defines
    where that rule is applied, and a control level for a rule. There are some special
    cases where the variable is not necessary, but we''ll address those later. There
    is also always a default policy, which is either *deny* or *allow* based on your
    security posture. Now that I''ve mentioned *posture*, I sat up straight in my
    chair... did you? Extreme care must be taken when defining that default policy.
    If the default is *deny*, then every operation, service, node, and so on needs
    explicit permission to perform some function. If the default policy is *allow*,
    then you need to specify what you are going to block. Certainly, the latter appears
    much simpler to implement. However, from a security perspective, it is a great
    deal easier to only identify the few things you want to permit, rather than try
    to identify and prevent all those things you need to block (which changes constantly).
    So, moving forward, we''re going to assume our default policy is to deny. You
    may hate me for this now, but you''ll appreciate it later.


    You can guess the control levels for Consul rules, but just in case you can''t,
    they are as follows:


    +   - **read**: Read access to a particular resource grants those using the token
    the ability to read the values associated with the resource.

    +   - **write**: Write access to a particular resource grants those using the
    token the ability to update or create values associated with the resource. If
    your token grants write access to the resource, you also have read access.

    +   - **deny**: Smackdown – you have no permission to read or write values associated
    with the identified resource. As we''ll be using a default deny policy, we won''t
    need this level.

    +   - **list**: This is a special level that grants those using the token the
    ability to list all associated parameters. The only place this is applicable is
    within the Consul key/value store, where the bearer of the associated token can
    list all key/value combinations at a particular path prefix.


    As I brutally learned in math class, whenever you are looking at areas like this,
    the order of precedence is critical. If there are any overlapping rules, deny
    has priority overall, and the ability to write has priority over read-only. This
    should be a given, but the fact that deny has priority over everything should
    be well understood. Furthermore, if you have *write* access within a particular
    rule, you automatically get list access. If you have *list* access, you automatically
    have *read* access, so the level of control is somewhat nested. I find one way
    to easily remember this is through the following diagram:'
  merge: -1
  img_proc: true
- pgno: 85
  md: '![](img/52479dafaefba00517c48a137e037b7e_85_0.png)


    Now that we know *what* we can do with individual rules, let''s look at *where*
    we can (or can''t) perform these actions… which brings us to rule types. The following
    is a list of all the rule types currently supported. Although we will only be
    using a few of them during this exercise, I wanted to list them all simply for
    completeness:


    +   - **ACL resource:** Controls the management of ACL rules.

    +   - **Agent:** This rule type controls aspects related to managing the Consul
    agent, such as joining a cluster, listing members, and agent configuration. Agents
    really should have write access to their own nodes; otherwise, they won''t be
    able to register their own service information with the catalog.'
  merge: -1
  img_proc: true
- pgno: 86
  md: '+   - **Event**: This is specifically related to the ability to read and write
    Consul events. We won’t be covering events in this book, but they can be utilized
    to exercise custom actions based on changes within the Consul system, including
    service availability.

    +   - **Key/Value**: Control access to the distributed key/value store within
    Consul. Rules can apply to the ability to read, write, or list sets of keys and
    their associated values.

    +   - **Sentinel**: No relation to the incredible song by Judas Priest, the Sentinel
    rule allows us to write just about any rule possible based on the Consul structure.
    Sentinel is an Enterprise feature, and quite advanced, so we won’t be covering
    it in this book.

    +   - **Keyring**: This is one of the rule types that requires no variable to
    be applied, as it is specific to the keyring function. As the keyring is what
    controls the encryption key for the gossip protocol, access to this area should
    be tightly controlled.

    +   - **Node**: This is an important one. It controls node-level data such as
    the services available in the catalog and node health. This also operates as a
    filter for agent-level operations to the subset of cluster members permitted.

    +   - **Operator**: This is another rule type that requires no variable to be
    applied and addresses the operator-level operations within Consul, such as auto-pilot
    or Raft specifics. Like the keyring, access to this area should be tightly controlled.

    +   - **Prepared query**: Consul offers the ability to create templates that are
    useful for more complex service queries within the system, including node location,
    metadata, tags, and so on. We will not be covering prepared queries as part of
    this book.

    +   - **Service**: Here is another important one to understand. This rule type
    governs service-level information, including access to the service catalog and
    service health status.

    +   - **Session**: Consul enables you to allocate and release a lock on values
    within the key/value store. This can be done in performed sessions and will not
    be addressed as part of this book.

    +   - **Namespace**: Namespaces are another Enterprise-level feature and enable
    the subdivision of Consul clusters. This rule type allows you to create more comprehensive
    rules consisting of multiple rule types for an entire namespace. Although we won’t
    be covering namespaces much in this book, it is very important to understand that
    several rule types, including the operator and keyring rules, can’t be applied
    to namespaces. These functions are global in scale and only operate on the default
    namespace.'
  merge: -1
  img_proc: true
- pgno: 87
  md: "As you can see, there are a lot of areas where we can apply ACLs to manage\
    \ what humans, machines, or cyborgs can do to access our services. This also provides\
    \ a plethora of areas to control the individual nodes.\n\nWhen we are talking\
    \ about security, we often use the term *least privilege*. Plainly speaking, or\
    \ writing, this means that instead of giving a child a pile of candy and telling\
    \ them what they can’t eat, we start with the child having no candy and providing\
    \ only what they can eat. This is why, earlier in this section, we talked about\
    \ instituting a default deny policy within Consul. If we utilize this as our standard\
    \ security rule, especially with the certificates we discussed in the previous\
    \ section, we can further tighten our control of the individual nodes. This drastically\
    \ reduces the possibility of any cowans or eavesdroppers gaining access to, or\
    \ listening in on, our cluster operations – for if you don’t have the secret handshake,\
    \ you will not pass.\n\nNow that we’ve addressed all of that, let’s take a look\
    \ at what a rule looks like. We’re going to look at two rules here, both of which\
    \ we’ll actually use when we start getting our hands on the system.\n\nThis first\
    \ rule applies a minimal policy for a Consul client to perform its operations\
    \ on itself and alert the Consul server of any changes to the infrastructure:\n\
    \n```\nnode \"ip-192-168-100-11\" {\n  policy = \"write\"\n}\nservice \"consul\"\
    \ {\n  policy = \"write\"\n}\nagent_prefix \"ip\" {\n  policy = \"write\"\n}\n\
    ```\n\nWithin this policy, we have three main rules that appear to be quite simple,\
    \ but within a least privileged model, their role in society is critically important.\n\
    \nThe first rule within the policy utilizes the node rule type. Without this rule,\
    \ the node can’t update the server cluster on what services it sees and, more\
    \ importantly, the health and location of the node. If a client attempts to join\
    \ the cluster, without the token associated with this rule, the server cluster\
    \ won’t even recognize it as a client. Note that because the node rule only applies\
    \ to ip-192-168-100-11, this rule only applies to the actions for this particular\
    \ node, as that is its hostname. Any other node using the token associated with\
    \ this policy would not be recognized by the Consul server cluster."
  merge: -1
  img_proc: true
- pgno: 88
  md: "The next rule, which is of the `service` type, allows us to update the service\
    \ catalog on the node itself. This is particular to the services on the node itself,\
    \ not the overall service catalog hosted by the Consul server cluster. To update\
    \ the centralized service catalog, we'll need the `agent` rule, which we'll talk\
    \ about next. Note that with this rule, we can `write` to the service named `consul`\
    \ to manage service changes. If we only wanted to read the status or availability\
    \ of the service, we could use a `read` directive.\n\nThe last rule utilizes the\
    \ `agent` rule type. This is similar in importance to the node rule type, where\
    \ it controls very fundamental aspects of the functionality of the node (although\
    \ in this case, it's pertinent to the agent). This rule allows the bearer of the\
    \ associated token to perform agent-level functions such as updating the service\
    \ catalog... which is kind of important since Consul is all about services. One\
    \ difference that you might have picked up with this particular rule definition\
    \ is that instead of pointing to a particular agent, it utilizes the slight variation\
    \ called `agent_prefix`. As you might have guessed, this applies to any agent\
    \ with a hostname that starts with the prefix `ip`. This provides some flexibility,\
    \ allowing you to apply rules to groups of agents, as opposed to writing a rule\
    \ for each individual agent. This does, however, expose us a bit because the rule\
    \ isn't locked down to one particular agent. One thing that can be done to help\
    \ here is to have two agent rules – one specific to the host that it resides on,\
    \ enabling it to write to agent operations, and another to read agent operations\
    \ from other nodes:\n\n```\n```hcl\nnode \"ip-192-168-100-11\" {\n    policy =\
    \ \"write\"\n}\nagent \"ip-192-168-100-11\" {\n    policy = \"write\"\n}\nagent_prefix\
    \ \"ip\" {\n    policy = \"read\"\n}\n```\n```\n\nThis was a very constricted\
    \ set of policy rules applicable to that particular agent. The following policy\
    \ opens things up a bit and is more applicable to the server cluster, affording\
    \ it the ability to do things such as write ACLs, events, and more:\n\n```\n```hcl\n\
    acl = \"write\"\nagent_prefix \"\" {\n    policy = \"write\"\n}\nevent_prefix\
    \ \"\" {\n```\n```"
  merge: -1
  img_proc: true
