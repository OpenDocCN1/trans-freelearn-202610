- pgno: 153
  md: "# External services\n\nBut Rob, what if I want Consul to be aware of services\
    \ that aren't embedded directly into the Consul system? This isn't a problem for\
    \ Consul; however, it does require some additional configuration options, similar\
    \ to what we had to do with the API service definition. Let's consider the situation\
    \ that throughout our life cycle, we want to provide a centralized GitHub Enterprise\
    \ service to our developers but enable them to utilize Consul for the discovery\
    \ of the GitHub service. I'm going to use the **GitHub** hosted service platform\
    \ as an example, but as it's only a URL, this definition can easily adapt to a\
    \ multitude of scenarios:\n\n# github.json External Service Definition\n\n```\n\
    ```json\n{\n  \"Node\": \"github\",\n  \"Address\": \"www.github.com\",\n  \"\
    NodeMeta\": {\n    \"external-node\": \"true\",\n    \"external-probe\": \"true\"\
    \n  },\n  \"Service\": {\n    \"ID\": \"vcs\",\n    \"Service\": \"vcs\",\n  \
    \  \"Port\": 80\n  },\n  \"Checks\": [{\n    \"Name\": \"http-check\",\n    \"\
    Definition\": {\n      \"http\": \"https://www.github.com\",\n      \"interval\"\
    : \"30s\"\n    }\n  }]\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 154
  md: 'Note that within the service definition, we''re also including the node and
    check information.


    The important aspect of this definition, unique from what we''ve seen before,
    is the existence of the `external-node` and `external-probe` parameters, both
    set to `true`. This information informs Consul that the service needs to be monitored
    by some sort of external service manager. Funnily enough, *external service manager*
    happens to be the name of a simple binary daemon that can run alongside all of
    your Consul agents to manage any sort of external query. Before we get to that,
    though, let''s get our service registered.


    As not only the service resides outside of Consul, but also the node on which
    that service lies, Consul requires a registration of the node, service, and any
    additional checks via the API. We can do this by utilizing cURL and the GitHub
    service definition JSON file from the preceding code:


    ```

    ```bash

    $ curl --request PUT --data @github.json http://<consul_http_address>:8500/v1/catalog/register

    ```

    ```


    With our service registered, Consul is just going to assume that all is well in
    the vcs service world and make it available within the service catalog:


    ![](img/52479dafaefba00517c48a137e037b7e_154_0.png)'
  merge: -1
  img_proc: true
- pgno: 155
  md: 'So, we can see that our service has been registered; however, it isn''t showing
    as healthy yet. This is because the Consul agent is looking for an external service
    monitor to monitor, um, that external service. When the Consul **External Service
    Manager**, or ESM, is running, that too will show up as a service within the Consul
    catalog. With that service, we can now see that the external GitHub service is
    now reporting to be in a healthy state:


    ![](img/52479dafaefba00517c48a137e037b7e_155_0.png)


    Figure 5.2 – Consul External Service Monitor registered


    When we look at the service details, we can see not only our HTTP check for GitHub
    returning healthy but also an **External Node Status** check returning in a happy
    and healthy state:


    ![](img/52479dafaefba00517c48a137e037b7e_155_1.png)


    Figure 5.3 – Service checks for the external service'
