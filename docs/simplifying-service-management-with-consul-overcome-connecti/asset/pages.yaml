    is restricted to read within a namespace\n  policy = "read"\n} |

    | operator = "write"\nquery_prefix "" {\n  policy = "write"\n} |  |

    | service_prefix "" {\n  policy = "write"\n  intentions = "write"\n}\nsession_prefix
    "" {\n  policy = "write"\n} | service_prefix "" {\n  policy = "write"\n  intentions
    = "write"\n}\nsession_prefix "" {\n  policy = "write"\n} |

    | namespace_prefix "" {\n  acl = "write"\n  key_prefix "" {\n    policy = "write"\n  }\n  node_prefix
    "" {\n    policy = "read"\n  }\n  session_prefix "" {\n    policy = "write"\n  }\n  service_prefix
    "" {\n    policy = "write"\n    intentions = "write"\n  }\n} |  |


    Figure 4.12 – Bootstrap and namespace policies'
  merge: -1
