- pgno: 166
  md: "Of course, these examples are all interactive with the Consul service, and\
    \ it only provides the results of the watch. The following example specifies a\
    \ checks type watch that will call the `check-handler.py` Python script whenever\
    \ the check is executed:\n\n```\nwatches = [\n    {\n        type = \"checks\"\
    \n        service = \"httpd\"\n        args = [\"/etc/consul/consul.d/check-handler.py\"\
    ]\n    }\n]\n```\n\nIn order to notify the external applications or services of\
    \ the check results, including the location of our healthy services, the handler\
    \ is able to post this information out to a multitude of services. One potential\
    \ option is to update a messaging queue that services are subscribed to, such\
    \ as **RabbitMQ** or **ActiveMQ**. Once Consul posts the service information,\
    \ any component that is listening on the respective queue can retrieve the information.\n\
    \nThere we have it! Throughout this section, you've learned three different ways\
    \ to obtain information about the services within the Consul catalog, starting\
    \ with DNS, which appeared to be the most straightforward, leading to the direct\
    \ API integration, through to a notification mechanism that can notify just about\
    \ anything or anybody!\n\n# Summary\n\nI hope you enjoyed this chapter…the topic\
    \ of defining and managing our services isn't a horribly complex one, but it is\
    \ critically important for the healthy operation of any dynamic network. A huge\
    \ advantage of our cloudy world isn't the existence of cloud computing; it is\
    \ how being able to quickly create and remove resources changes our human operational\
    \ model. Unfortunately, that flexibility does mean our services have the ability\
    \ to migrate and roam amongst the clouds. Using our basic example, we were able\
    \ to register our `httpd` service within the Consul system, ensure that the service\
    \ is healthy, and review the different methods that can be used to discover that\
    \ service. Now would be a good time to take a break and play with the Consul system,\
    \ as the next topic, *service mesh*, has quite a few more working pieces to it.\
    \ Hang on…things are about to get meshy!"
  merge: -1
  img_proc: true
- pgno: 167
  md: '# 6

    Connect Four

    or More


    This is it! All that you have read so far has led you to this point. I know I''ve
    said that before, but it is true. Everything you have read in this book has led
    you to this point. Regardless, welcome to the world of service mesh. Any engineer
    with a background in routing and networking appreciates the power of the service
    mesh. For years, we have focused on connecting machines, allocating or identifying
    the addresses, and segmenting them into subnets, switchports, and route tables.
    This functionality is still required, of course; however, much of it is now defined
    as Infrastructure as Code and is programmatically managed by public or private
    cloud operators. Now we have a chance to bring the conversation up a level, quite
    literally, so we are no longer connecting strings of numbers, but we are connecting
    the services directly. In this chapter, we''re going to be meshing with the following
    topics:


    +   - Connecting our services within the mesh – In the last chapter, we learned
    how to discover our services. Now we are going to learn how to get them communicating
    with each other through the service mesh.

    +   - Connecting our services outside of the mesh – It is unrealistic to think
    that everything you could ever interact with would reside within the service mesh.
    Therefore, we need to look at how to enable and manage connections with external
    entities.'
  merge: -1
  img_proc: true
- pgno: 168
  md: '+   - Securing the mesh – If all the mesh did was allow service-to-service
    communication, it would be pretty cool, but not very useful in my opinion. Once
    you have a service mesh enabled, you can uniquely secure, and easily disable and
    enable, each service connection.

    +   - Mesh to mesh – Much like the assumption that all services will exist in
    a mesh, it is also unrealistic to assume that there will be a single mesh to rule
    them all! As we extend our network and services, we will need to connect multiple
    service meshes, providing a mesh of meshes. Yup, we''re going to get meshy!


    The progression we''ve laid out here isn''t only good for education, but it provides
    a logical path for service mesh adoption within any network as well. Without any
    further delay, or puns, let''s connect four, or more!


    # Technical requirements


    In this section, we''ll be deploying a full Consul cluster to **Amazon Web Services
    (AWS)** using Terraform. If you''ve already gone through *Chapter 2, Architecture
    – How Does It Work?*, set up your AWS account, downloaded Terraform, and cloned
    the repository, you''re in great shape!


    Within the `ch6` folder of the repository, we have a similar structure as for
    the `ch2` folder, providing the code for creating the image and, of course, creating
    the Consul cluster. If you would like to follow along, use `ch6` to create a new
    Consul cluster, which includes some of the service configuration files you''ll
    utilize within this chapter.


    Before we walk through the code and functionality within this chapter, it might
    be useful to revisit *Chapter 2, Architecture – How Does It Work?* and review
    the steps required to deploy and access our infrastructure.


    # Connect services, not addresses


    Whether you take the red pill or the blue pill, the network that we live in can''t
    be refuted. The medium or the base layer connection isn''t always recognized.
    After all, for most of 2020, and at least half of 2021, many of us have been living
    through connected machines. Nearly every phone out there today resides on some
    sort of computer network, identified by an assigned address. However, as consumers,
    we don''t really care about that address, at least not directly. The functionality
    that provides and maintains that address only exists to allow our applications
    to communicate. Looking at the communication path as a whole, there are other
    aspects beyond that assigned address that are required, for example, some sort
    of physical connection and identification. Each of these aspects functions as
    a layer in what is called the **Open Systems Interconnect (OSI)** model.'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'Unless you''ve been playing with cables and switches for the last several years,
    this may be a new concept. So, before we talk much more about the service mesh,
    I want to get a baseline of networking laid out. Don''t worry, we aren''t prepping
    for a Cisco Certified Internet Expert exam.


    # Understanding the network connection


    When our applications communicate with each other, the messages that are transmitted
    need to travel through a variety of mediums. When we open up our favorite video
    conferencing software, the application connects with a server on the other side.
    I think we all can understand that. But what facilitates that communication? We
    can say it just goes over Wi-Fi, but what does that really mean? Well, the application
    software and the Wi-Fi are just layers within the communication path. Thankfully,
    we aren''t dealing with the number of layers of an onion, or an ogre. And we''re
    even going to simplify the number of layers for our discussion as well.


    ![](img/52479dafaefba00517c48a137e037b7e_169_0.png)


    Figure 6.1 – Vidona connection over Swampnet


    Take a look at Figure 6.1. Due to a pandemic in the swamp, Shrek and Donkey haven''t
    been able to see each other for quite some time. However, they''ve discovered
    a new application, Vidona, that allows them to see each other virtually. When
    Donkey calls Shrek, the message originates in Vidona, the application in use.
    That message flows through a channel and is wrapped up in an envelope with Shrek''s
    address, and Donkey''s return address. The message then flows down to the physical
    layer. Although we can''t feel Wi-Fi signals (wouldn''t that be wild if we could?),
    the Wi-Fi radio exists physically. In order to send the message on the Wi-Fi radio,
    it is packaged in another envelope, with a different address representing Donkey''s
    physical tablet.'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'Now we have two addresses: a **network** address and a **physical** address.
    The **physical** address doesn’t change (usually). It is associated with Donkey’s
    tablet, and it helps the tablet talk to the components it is *physically* connected
    to (even if wirelessly). Meanwhile, the **network** address identifies Donkey’s
    tablet as a globally unique entity, which is what Shrek’s computer will use to
    respond to Donkey’s tablet. Note a very important distinction here; Donkey’s **Vidona**
    application requires knowledge of Shrek’s network address in order to connect,
    and the network address changes over time. Furthermore, if Donkey and Shrek want
    to keep their communication secret from the eyes of Lord Farquaad, **Vidona**
    must develop its own security mechanisms. This may be challenging for the developers
    of **Vidona** alone, and when other applications need to participate in this secure
    communication, it becomes even more difficult. Ultimately, however, the goal is
    to provide a secure connection at the Application layer, the **Vidona** layer,
    as shown in Figure 6.2:


    ![](img/52479dafaefba00517c48a137e037b7e_170_0.png)


    Figure 6.2 – Vidona secure connection


    The important distinction between Figure 6.1 and 6.2 is that although the underlying
    network flow does not change, the **Vidona** application is able to communicate
    among peers in a seemingly direct and secure manner. As **Vidona** controls both
    sides of this particular example, utilizing its own built-in security mechanisms
    may be sufficient. However, once you mix applications and services, this continuity
    breaks down.


    As part of our conversation moving forward, we’re going to be referring to various
    layers within the networking world. At the beginning of this chapter, I referred
    to the OSI model, which consists of seven layers, as shown in Figure 6.3:'
  merge: -1
  img_proc: true
- pgno: 171
  md: '![](img/52479dafaefba00517c48a137e037b7e_171_0.png)


    Figure 6.3 – Network OSI model


    For our purposes, we are going to focus primarily on the top three layers, Application,
    Presentation, and Session, which we will collectively refer to as the Application
    layer. The Transport layer, as well as the Network layer do come into play as
    well, however, these are at the machine level of communication.


    With that basic understanding of the networking stack, let’s take a look at why
    simply relying on that stack just isn’t enough for today’s cloudy world.


    # Why traditional networking isn''t enough


    In the realm of zero-trust, we can’t just implicitly assume that anything operating
    on a single machine is friendly. Nearly every week we hear about a security event
    that originated with the assumption that an entity was trusted, and yet it was
    compromised. The concept of zero-trust, or least privilege security, focuses on
    the identity and the security of what we truly care about, the application. If
    our server, or system, is hosting multiple applications, we need a standardized
    way to uniquely identify, and secure, each of those applications. To illustrate
    this point, I’m going to revisit the common phone number analogy.'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'When I was a young lad, I would on occasion participate in activities that
    could be considered questionable at times. Luckily, we weren’t all carrying computers
    with GPS trackers in our pockets; however, my parents had the phone numbers for
    the houses of all of my friends. If I was going to Mike’s house, my parents would
    know how to reach me by way of the phone number associated with Mike’s house.
    However, when they called, there was no control over who would answer. Among our
    friends, we were able to have some fun with this level of ambiguity. For example,
    when our friend Gina would call Mike’s house, I might answer the phone. Now we
    were all very close, but even now sometimes it can be difficult to identify somebody
    by their voice over the telephone. It was a lot more challenging then, with lower
    quality audio on landlines! So, here I was having an active conversation with
    Gina; however, she believed she was speaking with Mike. We can continue this practice
    today; however, it is more difficult to pick up somebody’s mobile phone than it
    was to just lift the handset in their house. In this analogy, Gina and I are the
    applications, and Mike’s house is a host. Gina was trying to reach Mike by way
    of his house phone number, but simply by being there, I was able to impersonate
    Mike. The phone number may be trusted and clearly identified with the host, but
    that doesn’t ensure the identity or the security of the application.


    This story demonstrates how simply assuming a **layer 4 address** as the identity
    of any application imposes risk. In a private data center, when the house was
    securely locked with guards placed at the door, identification by address wasn’t
    that unreasonable. However, in the environment of the public cloud, the existence
    of legitimate and illegitimate address masking, and especially in any sort of
    migratory workload environment (such as Kubernetes), the address alone just isn’t
    good enough. So, let’s look at how we can solve this problem using tunnels.


    # Tunneling to safety


    The concept of network tunnels and **Virtual Private Networks (VPNs)** is nothing
    new. However, in every one of those instances, the connection is based on the
    layer four address of the components involved. We can connect our application
    machines using a series of point-to-point VPNs, but that isn’t going to alleviate
    the need to identify and secure the **application**. In reality, the use of VPNs
    actually increases the need for application identity instead of relying on simply
    the address. However, we can still look at the VPN as a model for where we want
    to be.'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'When you establish a VPN in most cases, there is a software application that
    connects to some remote site or service. When that connection is made, your device
    now has a new IP address, valid on the destination network, and all machine traffic
    flows through that connection. The beauty of VPNs is that the information traversing
    the VPN is encrypted and secured, from the VPN client to the VPN server. This
    was, and continues to be, a great way to protect your traffic from prying eyes.
    The use of VPNs historically has been primarily for enterprise networks. Lately,
    many people today utilize VPNs to not only encrypt their traffic, but also to
    hide their layer four address identity. We''ve already determined that for true
    secure operations, we need to validate the identity of the application, so the
    use of a VPN may actually hinder, rather than help, that effort.


    ![](img/52479dafaefba00517c48a137e037b7e_173_0.png)


    Figure 6.4 – VPN traffic pattern


    Now, I''m not saying that VPNs don''t have their place in this world. When you
    need to connect machines in a secure manner, they provide a vital function. However,
    we aren''t talking about connecting machines; we are connecting our applications.
    That being said, the concept of the VPN extends nicely if we can bring that connection
    up a layer to the application. This is exactly what the Consul Service Mesh provides
    via Consul Connect.


    The Consul Connect functionality connects identity-verified applications and encrypts
    the traffic between those applications. We''ve already seen in Chapter 3, Keep
    It Safe, Stupid, and Secure Your Cluster! how the Consul server cluster verifies
    the identity of the agents and encrypts the RPC traffic utilizing mutual TLS (mTLS).
    Consul Connect allows us to extend that same functionality to every Consul managed
    service. Let''s take a few minutes and revisit Consul and mTLS.'
  merge: -1
  img_proc: true
- pgno: 174
  md: 'Remember the days of old, when we were having fun with certificates in *Chapter
    3, Keep It Safe, Stupid, and Secure Your Cluster!* As part of that process, we
    were utilizing the Consul server as the **certificate authority (CA)** to sign
    and manage the certificates (it''s an authority, what else would it do?). In an
    effort to reduce complexity, we were using common certificates for each of the
    three servers. Additionally, all client agents were using a common certificate.
    At the time it was mentioned that in a production environment, each Consul agent
    should have its own unique certificate. When one agent receives a public certificate
    from another, that certificate provides the **identity** of the sender. We know
    we can **trust** that identity, because the certificate is signed by some authoritative
    source. These certificates not only provide the identity, but also the keys necessary
    for the encryption and decryption of the messages between the agents. If this
    method of mTLS is secure enough to validate Consul agents and encrypt the traffic,
    why not use it for the services that Consul manages?


    With Consul Connect, each service is assigned a unique certificate. As you can
    see, the use of certificates is quite important when working with Consul. Not
    only do we have certificates for the agents to enable secure agent communication,
    but we also have certificates for the services. All of these certificates can
    be quite challenging to manage, but the benefit of true application identity and
    encryption far outweighs that challenge. Luckily, much like in *Chapter 3, Keep
    It Safe, Stupid, and Secure Your Cluster!*, we are able to utilize Consul as the
    CA for our applications. Consul does support Vault as the CA as well; however,
    for our purposes, we are going to focus on utilizing Consul. Regardless of who
    the CA is, Consul can orchestrate the rotation and distribution of the certificates,
    which can dramatically simplify the operational aspect of Consul. Unlike *Chapter
    3, Keep It Safe, Stupid, and Secure Your Cluster!*, however, we want our applications
    to utilize the certificates for identification and encryption. Unfortunately,
    many applications have not been developed to accommodate special certificates
    and encryption. There are development libraries for custom application integration;
    however, proxy servers are wonderfully suited for this purpose and require no
    additional development.'
  merge: -1
  img_proc: true
