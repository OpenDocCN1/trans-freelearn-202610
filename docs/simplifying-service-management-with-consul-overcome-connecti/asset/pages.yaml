- pgno: 206
  md: 'As I hope you can see, the power possible within Consul watches and handlers
    in order to adjust component configuration dynamically is quite immense. We’ve
    now seen multiple ways to utilize the Consul KV store to update configuration.
    Applications can receive updated configuration values through a pull method using
    the API. We can automatically adjust configuration files utilizing the consul-template
    function. And of course, we can push KV information into nearly any system that
    can be controlled via scripts or an HTTP interface. Next, we’re going to look
    at how we can expand beyond KV and utilize Consul to dynamically adjust our infrastructure
    components using Terraform!


    # Floating with consul-terraform-sync


    Throughout this book, we’ve been looking at how Consul can help us discover and
    connect our services, focusing on the higher-level connectivity (remember that
    model, working at layer 4 or above). Although this is exactly what we need for
    our service-to-service communication, the fact that the entire networking world
    relies on IP addresses to discover, route, and protect our systems has not gone
    away. Firewalls and load balancers remain in place, largely operating on addresses,
    managing traffic entering or leaving our managed networks. This is often referred
    to as North/South traffic. Historically, these components would rely upon countless
    health checks to validate service availability or massive configuration files
    where a simple typo could bring an entire network down. For these reasons, changes
    to load balancing and firewall components by the hands of an error-prone human
    require careful scrutiny. If only there was some way to automatically discover
    and implement updates to these components in an automated and trackable fashion?


    We are already familiar with an incredible tool for managing infrastructure that
    we’ve been using as we’ve built and managed our own infrastructure for this book,
    Terraform. By using the Terraform OSS binary, we’ve been creating and destroying
    the Consul systems necessary for our education. If you aren’t familiar with Terraform,
    it can do so much more. At the time of writing, Terraform offers supported integration
    with over 1,100 infrastructure providers. This includes the big cloud vendors
    as well as monitoring components, load balancers, firewalls, content distribution
    systems, domain name systems, and so on. For automation, many organizations integrate
    Terraform with a pipeline process, however, we’re going to look at how we can
    automate Terraform infrastructure adjustments utilizing the plethora of data provided
    by Consul.'
  merge: -1
  img_proc: true
- pgno: 207
  md: "> **Important note**\n> \n> Up until this point in the chapter, most of our\
    \ discussion has been around creating and sharing configuration parameters throughout\
    \ our services. The Consul integration with Terraform drastically extends that\
    \ capability and therefore does warrant additional scrutiny as part of the change\
    \ control process. Although our work here focuses on the open source versions\
    \ of Consul and Terraform, an enterprise integration enables the employment of\
    \ fine-grained policies to specify what automation can change, what it cannot,\
    \ and what requires an additional level of approval. Furthermore, Terraform Enterprise\
    \ records state changes throughout the process, providing a history of any automated\
    \ or approved changes.\n\nMuch like the **consul-template**, HashiCorp offers\
    \ an additional standalone binary application called **Consul-Terraform-Sync**.\
    \ For the purpose of simplicity, I'll be referring to Consul-Terraform-Sync as\
    \ CTS moving forward. Utilizing CTS, Consul monitors for changes in the service\
    \ catalog, and based on those changes, issues a request to Terraform to adjust\
    \ the infrastructure accordingly:\n\n![](img/52479dafaefba00517c48a137e037b7e_207_0.png)\n\
    \nFigure 7.2 – CTS managed infrastructure\n\nAs part of the current deployment,\
    \ we've created a machine specifically for CTS, with the IP address provided in\
    \ `terraform output` by the variable `CTS_IP`. If you can't find the output from\
    \ your Terraform run, no problem. Running `terraform output` will provide you\
    \ with all of the necessary data again. So, let's grab that IP address and SSH\
    \ into the CTS machine:\n\n```\n```bash\n$ ssh -i <username>-consul-key.pem ubuntu@<CTS_IP>\n\
    ```\n```"
  merge: -1
