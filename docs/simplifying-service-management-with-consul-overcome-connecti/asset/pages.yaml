- pgno: 138
  md: 'Notice that there is an entire section of the bootstrap policy that is directly
    related to namespace management. Therefore, those with this very privileged policy
    are able to manage ACLs, keys, nodes, sessions, and services within each namespace.
    In other words, our governor has the ability to manage and control items at the
    town level, but mayors within the town have no authority over other towns. Additionally,
    although at the bootstrap level we have the ability to write to nodes within the
    cluster, at a namespace level, as the namespace has access to all nodes, it can
    only read.


    As we''ve seen, namespaces are able to segment our entire Consul system into individual
    mini-systems, providing autonomy to the operators of those systems. However, in
    some highly secure environments, it may be required to actually divide Consul
    at the network layer, not just the application layer.


    Our entire Consul cluster, every node in every namespace, communicates utilizing
    that gossip protocol we talked about so very long ago. We''re not going to delve
    too deep into this topic, as it is quite advanced. However, consider the situation
    where we might have thousands of Consul nodes distributed throughout our data
    center network, a situation not uncommon in production environments. If you remember,
    when we started the discussion about namespaces with the tree example (Figure
    4.10), the separation occurred one layer above the Consul nodes. When we segment
    the Consul network, we are actually dividing up those gossip pools into smaller
    pools, each communicating on their own network ports.


    ![](img/52479dafaefba00517c48a137e037b7e_138_0.png)'
  merge: -1
  img_proc: true
- pgno: 139
  md: 'I''ve tried to illustrate this segmentation in Figure 4.13, using different
    types of pools. In this example, all network segments, or pools, are able to communicate
    with the core centralized server cluster. However, due to firewall or other network-based
    divisions, the pools are not able to communicate with each other. By utilizing
    Consul network segmentation, we can still manage the overall Consul cluster, services,
    and namespaces within the divided network.


    Now that we''ve successfully conquered an entire data center with Consul services,
    it''s time to continue with the Brain''s goal of taking over the world. So come
    along Pinky, let''s start discussing how to connect our Consul clusters.


    # Connecting clusters


    To think that all of our services are going to reside within a single data center
    might have worked 20 years ago when I started writing this book (so it seems).
    The world has truly evolved to a continuously connected mobile environment, although
    some might argue that this was actually devolution. Regardless, the only way to
    really maintain the communications among our services in this world is to ensure
    that their availability and location can be discovered from multiple geographic
    areas. Whether I''m in Boston, Berlin, or Melbourne, the applications and services
    I''ve grown to rely on must be available! All that we have done within this chapter
    has led us to this point!


    Throughout the book, we''ve been talking a lot about gossiping and pools, and
    we''re going to continue that discussion. However, as you can imagine, the amount
    of data that we have communicated within a single Consul cluster can be quite
    extensive, especially as we onboard all of our services. If we wanted, we could
    simply start deploying Consul nodes into different data centers and regions and
    be done with that. Unfortunately, this would cause a great deal of traffic to
    be broadcast across the entire network. Furthermore, spreading Consul server nodes
    across data centers can impact the availability of your server cluster, even with
    the brilliant Autopilot.


    When you join Consul clusters across a Wide Area Network (WAN), the clusters don''t
    share catalog information. Each server cluster only becomes aware of the other,
    so when a request for a service is made, that request can be transmitted to another
    data center to check for service availability.'
  merge: -1
  img_proc: true
- pgno: 140
  md: 'So far, we''ve only been working in our default data center, imaginatively
    named dc1. For this example, I''m going to be creating two data centers, Jake
    and Elwood. The data center for the particular Consul agent is defined within
    the configuration with a simple datacenter parameter. Take this, for example:


    ```

    server = true

    datacenter = "Elwood"

    bootstrap_expect = 3

    ```


    I''ve set up a system with three server nodes in each of the two data centers,
    Jake and Elwood. Joining the two data centers is pretty simple within the configuration
    as well as via the command line. Within the configuration, we utilize a retry_join_wan
    command, similar to the retry_join command we already use for the Consul nodes
    to discover each other. Additionally, you only require a connection between one
    server in each data center, as they then learn about each other. However, I would
    strongly recommend including multiple servers in the event that one is not available
    when the two data centers need to join up:


