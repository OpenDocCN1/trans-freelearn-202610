- pgno: 133
  md: "Creating the namespaces themselves only requires a simple `write` command.\
    \ For good measure, we're going to view the namespaces we created as well:\n\n\
    ```\n```text\n# consul namespace write shawn.hcl\nName: shawn\nDescription:\n\
    \    Shawns namespace for his funny antics and visions\n# consul namespace write\
    \ gus.hcl\nName: gus\nDescription:\n    Gus' namespace to track his pharmaceutical\
    \ distribution\n# consul namespace list\ndefault:\n    Description:\n        Builtin\
    \ Default Namespace\ngus:\n    Description:\n        Gus' namespace to track his\
    \ pharmaceutical distribution\nshawn:\n    Description:\n        Shawns namespace\
    \ for his funny antics and visions\n```\n```\n\nNote that there is a default namespace\
    \ value that will capture all the data that hasn't been explicitly associated\
    \ with a namespace.\n\nNow that the namespaces have been created, we can see them\
    \ within the Consul UI:\n\n![](img/52479dafaefba00517c48a137e037b7e_133_0.png)\n\
    \nFigure 4.11 – Namespace selection within the Consul UI"
  merge: -1
  img_proc: true
- pgno: 134
  md: "If we want to register a service with a specific namespace (not the default\
    \ namespace), all we need to do is specify the desired namespace within the configuration\
    \ of the service itself. In previous sections, we observed an httpd service that\
    \ Consul was managing. I've modified that JSON file slightly, just to indicate\
    \ that this service will be running within the gus namespace.\n\n# httpd.json\
    \ service definition\n\n```\n{\n    \"service\": {\n        \"name\": \"httpd\"\
    ,\n        \"namespace\": \"gus\",\n        \"tags\": [\n            \"python-server\"\
    \n        ],\n        \"port\": 8080,\n        \"check\": {\n            \"args\"\
    : [\n                \"curl\",\n                \"localhost:8080\"\n         \
    \   ],\n            \"interval\": \"10s\"\n        }\n    }\n}\n```\n\nWhen we\
    \ have our services configured and designated to a particular namespace, as we've\
    \ done here with the httpd service, then only members of that namespace can interact\
    \ and obtain the information associated with that service. To follow on from my\
    \ example, if I query the services that are associated with my Consul system,\
    \ I only end up with one service:\n\n```\n$ consul catalog services\nconsul\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 135
  md: "Oh no! Isn't my `httpd` service running? I can assure you that the service\
    \ is running, only in a separate and distinct namespace:\n\n```\n```bash\n$ consul\
    \ catalog services -namespace gus\nhttpd\n```\n```\n\nNow, being able to separate\
    \ these services can help greatly; however, if we aren't securing those namespaces\
    \ uniquely, then we really aren't getting the true benefit of these subdivisions.\
    \ If those nerves are acting up from the memories of our ACL work, you need to\
    \ trust your intuition. When we start creating namespaces within our Consul system,\
    \ it's kind of like developing a management hierarchy.\n\nIf you recall, when\
    \ we were playing with ACLs in order to bootstrap the system, we needed to create\
    \ a bootstrap ACL token that gave us full administrative privileges over the entire\
    \ Consul system. Using a grossly oversimplified analogy, we can view this administrator,\
    \ or administrative group, as the governor of the Consul system. We'll call him\
    \ **Governor Lepetomane**. Based on his credentials, represented by a unique token,\
    \ he is able to set the rules for his jurisdiction that all of the towns and communities\
    \ within must abide by. However, each town still maintains some level of autonomy.\
    \ **Mayor Johnson**, with his own credentials (token), is able to create his own\
    \ rules and regulations for the town of Rock Ridge, so long as those rules comply\
    \ with those set forth by Governor Lepetomane. The management of the Consul namespace\
    \ structure is nearly identical.\n\nWhen we bootstrap the ACL functionality within\
    \ Consul, we create a token that abides by the default global management policy.\
    \ Using this token, we are able to create new policies, and corresponding tokens,\
    \ to enable very fine-grained management of everything Consul can do. When we\
    \ create our namespaces, we need to give those operators their own management\
    \ policies, but we can't have them exercising their authority over neighboring\
    \ namespaces. Therefore, each namespace gets its own *operator*-level token that\
    \ the administrators of those namespaces can use to create their own policies,\
    \ rules, services, and so on. So how are these two default policies different?\n\
    \n> **Important Note**\n> \n> Namespaces allow us to subdivide services and policy;\
    \ however, Consul cluster nodes are visible to all namespaces."
  merge: -1
  img_proc: true
- pgno: 136
  md: "Let's start by creating a *namespace-management-level* policy for Shawn's namespace:\n\
    \n```\nconsul acl token create -namespace shawn -description \"Shawn's Management\
    \ Token\" -policy-name \"namespace-management\"\n```\n\nNow we have a default\
    \ operational-level token assigned to the shawn namespace. Utilizing the Consul\
    \ CLI, we can observe the existence of both policies. Note that in order to see\
    \ the *namespace-management* policy, I need to include the flag for the appropriate\
    \ namespace:\n\n```\n$ consul acl policy list\nglobal-management:\n  ID:     \
    \        00000000-0000-0000-0000-000000000001\n  Namespace:      default\n  Description:\
    \    Builtin Policy that grants unlimited access\n  Datacenters:\n\n$ consul acl\
    \ policy list -namespace=shawn\nnamespace-management:\n  ID:             2226f072-68ae-9082-6d8d-7c9bdb1a987c\n\
    \  Namespace:      shawn\n  Description:    Default policy that grants all available\
    \ privileges within a single namespace\n  Datacenters:\n```\n\nUtilizing the consul\
    \ acl policy read command, I'm able to look at the details of those two policies.\
    \ Again, for the shawn namespace, I need to include the namespace flag in the\
    \ command. Figure 4.12 provides a side-by-side view of the policy differences:"
  merge: -1
  img_proc: true
- pgno: 137
  md: '| ID: 00000000-0000-0000-0000-000000000001\nName: global-management\nNamespace:
    default\nDescription: Builtin Policy that grants unlimited access\nDatacenters:\nRules:
    | ID: 2226f072-68ae-9082-6d8d-7c9bdb1a987c\nName: namespace-management\nNamespace:
    shawn\nDescription: Default policy that grants all available privileges within
    a single namespace\nDatacenters: |

    | acl = "write" | acl = "write" |

    | agent_prefix "" {\n  policy = "write"\n}\nevent_prefix "" {\n  policy = "write"\n}
    |  |

