- pgno: 115
  md: "If we look at that file, we'll see that it is nearly identical to the server\
    \ file that we put in place. There is only one thing missing – a suitable token:\n\
    \n```\nacl = {\n    enabled = true\n    default_policy = \"deny\"\n    enable_token_persistence\
    \ = true\n    tokens {\n        \"default\" = \"\"\n    }\n}\n```\n\nSo, before\
    \ we restart that client node again, why don't we create a new policy and token\
    \ for that node? This one is going to be a bit more specific. To create these\
    \ items, we need to go back to the Consul server that we were using previously.\
    \ If your bootstrap token is no longer in the environment, you'll need that again.\
    \ You can check this by looking at the environment variables:\n\n```\n$ env |\
    \ grep CONSUL\n```\n\nThe output should contain the Consul address of the server\
    \ that you are working on, as well as its HTTP token:\n\n```\nCONSUL_HTTP_TOKEN=34e87e9d-2207-f2eb-7efc-d41674eca6f0\n\
    CONSUL_HTTP_ADDR=http://192.168.100.146:8500\n```\n\nIf you have both these values,\
    \ and they are correct, then we can continue.\n\nWe're going to create a policy\
    \ specifically for this node. The hostname for the client node I'm working with\
    \ is ip-192-168-100-77. The policy rule I'm going to create is going to enable\
    \ node- and agent-level write operations, but only for that node. Let's start\
    \ by creating that policy file, similar to what we did previously for the servers:\n\
    \n```\n$ cat > client-policy.hcl << EOF\nnode \"ip-192-168-100-77\" {\n    policy\
    \ = \"write\"\n}\nagent \"ip-192-168-100-77\" {\n    policy = \"write\"\n}\nEOF\n\
    ```"
