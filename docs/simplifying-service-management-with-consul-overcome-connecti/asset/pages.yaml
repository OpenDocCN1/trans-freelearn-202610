- pgno: 151
  md: "In a typical Consul system, services are deployed, removed, or updated quite\
    \ frequently. If you think about the software development life cycle, the gestation\
    \ period for new services or applications can be as little as a few weeks. In\
    \ many of these cases, updates to the service definition may be required for new\
    \ versions, tags, and so on. Ideally, every time a new service or application\
    \ is released, a corresponding Consul service definition file will accompany the\
    \ application.\n\nAs that new application, or new version of an existing application,\
    \ is deployed, the service definition would be updated as well. If you're using\
    \ a simple orchestrator such as Nomad, it can manage the corresponding service\
    \ definition as part of the application definition and be deployed automatically.\
    \ However, in traditional systems where you are actively selecting on which nodes\
    \ the application is to run, whatever process is used to push the application\
    \ should also be pushing the corresponding service definition.\n\nOnce the new\
    \ definition is available, the associated Consul agent does require a simple reload\
    \ in order to recognize the adjusted configuration. Much like most configurations,\
    \ dynamic adjustments to the services aren't picked up automatically. However,\
    \ reloading the agent is quite simple, via the `consul reload` command, or via\
    \ an API call:\n\n```\n```sh\n$ curl --request PUT $CONSUL_HTTP_ADDR/v1/agent/reload\n\
    ```\n```\n\nIn a more dynamic world, the Consul API provides a great amount of\
    \ functionality as part of this process. It can't help you deploy your applications;\
    \ however, every service definition and check can be provided to the Consul agent\
    \ utilizing the Consul API. This can be very useful for environments where the\
    \ service definition, or any aspect of that definition (including health checks),\
    \ requires modifications post application deployment. Registering the service\
    \ with the API does require some additional information, however, to ensure that\
    \ Consul is aware of which node the service is expected to reside on. Note the\
    \ difference between the following `httpd-api.json` for the Consul API and the\
    \ original `httpd.json` definition we used previously. The Datacenter, Node, and\
    \ Address fields are required in order to inform Consul on which node the service\
    \ is expected, while CheckId and ServiceId are required in order to link the service\
    \ and check definitions. This enables the ability to push service and check definitions\
    \ uniquely:\n\n# httpd-api.json\n\n```\n```json\n{\n  \"Datacenter\": \"dc1\"\
    ,\n  \"Node\": \"ip-192-168-100-118\",\n```\n```"
  merge: -1
  img_proc: true
- pgno: 152
  md: "```\n\"Address\": \"192.168.100.118\",\n\"Service\": {\n  \"ID\": \"httpd2\"\
    ,\n  \"Service\": \"httpd2\",\n  \"Tags\": [\n    \"python-server\"\n  ],\n  \"\
    Address\": \"192.168.100.118\",\n  \"Port\": 8080\n},\n\"Check\": {\n  \"CheckID\"\
    : \"httpd2\",\n  \"Node\": \"ip-192-168-100-118\",\n  \"ServiceID\": \"httpd2\"\
    ,\n  \"Status\": \"passing\",\n  \"Definition\": {\n    \"tcp\": \"localhost:8080\"\
    ,\n    \"interval\": \"10s\"\n  }\n}\n}\n```\n\n**Important Note**\nAlthough defining\
    \ and managing services via the API can be incredibly useful for programmatic\
    \ management of Consul, it must be noted that should the Consul agent restart,\
    \ any catalog entries performed via the API are not persisted."
  merge: -1
