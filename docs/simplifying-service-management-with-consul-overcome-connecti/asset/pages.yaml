- pgno: 105
  md: "```\n```\n}\nconnect {\n  enabled = true\n}\nEOF\nsudo systemctl start consul\n\
    ```\n```\n\nMuch like the clients, we have our verification parameters set to\
    \ make sure that we are validating messages being received, as well as messages\
    \ being sent, with our certificate files. Those files are configured in the next\
    \ few lines, but notice that, unlike the clients, we have our private and public\
    \ keys configured for each server. Our server cluster must be configured and created\
    \ in a secure manner before enabling it to distribute certificates to the clients\
    \ using the auto_encrypt configuration. I want to call out the ports that are\
    \ configured. Within this configuration, we have port 8500 configured for HTTP,\
    \ which is what we used in *Chapter 2, Architecture – How Does It Work?* However,\
    \ we also have an HTTPS configuration, with port 8501 specifically for TLS communication\
    \ with the Consul cluster. Therefore, if you disable HTTP (set `http = -1`), you\
    \ will secure your Consul system by preventing any unencrypted HTTP traffic. If\
    \ you want to see what it would look like for an unauthenticated web browser to\
    \ try to communicate with Consul, assuming the Consul system is up, point your\
    \ web browser to one of the `CONSUL_HTTPS_ADDR` parameters provided in the Terraform\
    \ output. You’ll see something similar to the following:\n\n![](img/52479dafaefba00517c48a137e037b7e_105_0.png)\n\
    \nFigure 3.8 – Unauthorized HTTP access"
