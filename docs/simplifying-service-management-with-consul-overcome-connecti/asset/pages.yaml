    Note that I updated the value, and the ModifyIndex parameter recognized this change.


    We should note here that writing passwords and sensitive information to the storage
    might not be the best idea in the world. For secrets management, we really should
    be utilizing a world-class secrets manager such as HashiCorp Vault. That being
    said, there may be information written into this storage that requires some level
    of access control. Recall that through our ACL system, we are able to secure paths
    and functions within Consul. By combining our ACL system with the KV store, we
    can create a distributed storage system for each application and ensure that only
    that application (with the proper ACL token) can access the data store.


    This is wonderful! Using the KV store within Consul, we can write all sorts of
    information to the storage, and make it available to specific consumers of the
    data or applications. *But Rob, my applications have no idea about the Consul
    API or command line, and you’re out of your mind if you think we’re going to adjust
    our development path for that.* Well, you are correct, I am out of my mind, but
    that has nothing to do with Consul. Allow me to introduce you to Consul Template.


    # Consul Template


    The application of Consul Template may be one of my favorite things about Consul.
    However, it isn’t just restricted to Consul, as Vault implementations can utilize
    the same functionality. With Consul Template, configuration files can be populated
    by Consul directly utilizing parameters as if it was, well, a template. I guess
    you probably saw that coming.


    The functionality of Consul Template isn''t embedded within Consul itself, however,
    so it must be downloaded and executed as its own service. The binary (`consul-template`)
    is available at the HashiCorp releases website if you would like to download it
    yourself, however, when we built new images for this chapter, installation of
    the Consul Template binary was part of the process (`https://releases.hashicorp.com/consul-template/`).'
