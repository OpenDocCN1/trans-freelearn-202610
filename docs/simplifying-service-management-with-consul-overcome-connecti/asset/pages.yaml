- pgno: 47
  md: "Wonderful—we now have a leader for the cluster! However, the election of a\
    \ server leader is only one piece of what Consul actually utilizes the consensus\
    \ protocol for—after all, what is a leader if it doesn't share the information\
    \ it learns?\n\n> **Note**\n> \n> Although this process can move quite quickly\
    \ with only three servers, it only accommodates the failure of a single Consul\
    \ server. You may be thinking: *Wow, I'll just throw in, like, 12 servers and\
    \ I'll be good!* There is a trade-off—as the number of servers in the Raft increases,\
    \ so does the time it takes to achieve a quorum. This not only impacts leader\
    \ elections but also data consistency. Usually, it is recommended to keep the\
    \ peer set of servers between five and seven.\n\n# Data sharing within the server\
    \ peer set\n\nNow that **Lisa** has become the undisputed leader, she is responsible\
    \ for maintaining the information shared with **Bart** and **Maggie**. This information\
    \ is recorded and shared via log entries written by **Lisa**. These log entries\
    \ are what contain the state of our service catalog and leader election process,\
    \ and essentially anything that the server peer set needs to know in order to\
    \ function. It's time to start peeling that onion, but I do hope it doesn't make\
    \ you cry.\n\nWithin the peer set, any server can receive information from the\
    \ clients and share that information with the leader. This information can contain\
    \ a change to the service status on the direct node or even updates to other nodes\
    \ within the cluster. The leader is the only one that updates the log entries;\
    \ however, just because the leader, **Lisa**, knows about some adjustment to the\
    \ service catalog or other components, it doesn't mean that **Maggie** or **Bart**\
    \ have the same information. This is where our quorum comes back into play. Just\
    \ as with *groupthink*, a minimum number of servers within the peer set need to\
    \ agree on what is the reality at that point in time. Therefore, as **Lisa** writes\
    \ an update to her log file, she sends that update to both **Bart** and **Maggie**.\
    \ Until either **Bart** or **Maggie** confirm that they've applied the corresponding\
    \ log entry and the log has been properly *replicated*, the entry is not considered\
    \ to be *committed*. However, once **Lisa** gets confirmation and at least one\
    \ other member of the server peer set (remember—there are three members, so we\
    \ need two to achieve a quorum), we can consider the log entry to be committed\
    \ and we have a new view of the reality."
  merge: -1
  img_proc: true
- pgno: 48
  md: 'All of these exchanges utilize Remote Procedure Calls (RPC) and consensus,
    as displayed in Figure 2.15.


    ![](img/52479dafaefba00517c48a137e037b7e_48_0.png)


    Figure 2.15 – Consensus and RPC connections within the peer set


    I know what you may be thinking: OK, Rob, but what if the logs grow too large?
    This is a valid concern and is managed via a common finite-state machine (FSM)
    within the server peer set. As logs are replicated and committed among the servers,
    the FSM is updated with the current status. When queries are made to the Consul
    server peer set, the leader responds to that query based on the status of the
    FSM. Consul is structured in such a way that any replay of a set of logs will
    result in an identical state. Wow—wouldn’t it be nice if humans were that predictable?
    This creation and maintenance of the state, however, enables Consul to periodically
    snapshot the log entries in order to manage the replicated log size. This snapshot
    is performed without any interruption to Consul services and ensures long-term
    happiness among the peer set.


    # Gossiping serfs


    Now that we understand a bit more about how a server peer set is established and
    operates, let''s take a deeper look into what everybody is gossiping about. Again,
    if we start unpacking where the gossip protocol comes from, it utilizes the Serf
    (https://www.serf.io/) library, which is based on the Scalable Weakly-consistent
    Infection-style Process Group Membership protocol, which has thankfully been shortened
    to SWIM (http://www.cs.cornell.edu/info/projects/pringlass/public_pdfs/swim.pdf).
    We''ve jumped off of the Raft, and we''ve gone swimming!'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'Have a look at the following diagram:


    ![](img/52479dafaefba00517c48a137e037b7e_49_0.png)


    Figure 2.16 – Gossip connections


    All of the members of the Consul cluster, the servers and clients, are swimming
    in the same pool. This enables the distributed discovery of all members of the
    pool, their status, and—of course—the status of any services registered with the
    Consul clients. Although gossip is how all of the agents learn about changes to
    cluster members as well as services, all information is still sent from the agents
    to the server nodes via direct RPCs. Remember, any server within the peer set
    can receive an update and forward this to the leader for quorum commitment and
    an update to the state machine.


    # Changes in latitudes


    We''ve already seen how Consul shares information within a cluster regarding leadership
    election, changes in service availability, and changes in node availability. In
    addition to these items, Consul is always aware of the geographic location of
    each node relative to others within the cluster. This can help with intelligent
    decisions such as locating the nearest available service instance to the requesting
    entity. The discovery mechanism utilizes network tomography offered by the Serf
    library. Yup—not only do they all gossip about each other''s state, but they also
    know each other''s location! The singularity is upon us!'
  merge: -1
  img_proc: true
