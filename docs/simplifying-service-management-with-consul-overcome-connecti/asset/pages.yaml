    ![](img/52479dafaefba00517c48a137e037b7e_212_0.png)


    Figure 7.3 – CTS within the KV store


    Within the folder for CTS, we can see, as shown in Figure 7.4, how we have a state
    file specific to the find-httpd-nodes task that is configured. Note that each
    task, and therefore module, will create its own state file, and will store those
