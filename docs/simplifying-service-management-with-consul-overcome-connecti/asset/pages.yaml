- pgno: 106
  md: '# Keep It Safe, Stupid, and Secure Your Cluster!


    If you examine the certificate, you''ll see that it has been issued by the Consul
    CA and is not trusted. This is because the certificate hasn''t been signed by
    an official CA; it has only been signed by Consul itself.


    ![](img/52479dafaefba00517c48a137e037b7e_106_0.png)


    Figure 3.9 – Certificate used for HTTP communication


    Thankfully, we still have port 8500 open, to facilitate our communication with
    the server cluster unimpaired.


    But wait, there''s more! Do you remember how we were saying that there were two
    main paths for protecting our communication? One was through mutual TLS, using
    certificates for the RPC communication. What about all our servers gossiping?
    Yup, we must protect that, too, but don''t worry, that''s much easier to do, and
    like the certificates, I''ve set this up for you ahead of time.'
  merge: -1
  img_proc: true
- pgno: 107
  md: 'If you look in the `consul-common.hcl` file, you''ll see an additional line
    with a simple parameter, `encrypt`. This file was placed on all the servers as
    part of the image build process of using Packer:


    ```

    log_file = "/etc/consul/logs/"

    log_level = "DEBUG"

    encrypt = "86753098Qr2LsXLcfD+Y+S6RUuzUZsY1ZxdAj5E9c="

    encrypt_verify_incoming = true

    encrypt_verify_outgoing = true

    ```


    This value isn''t something I just made up – well, not entirely. By utilizing
    the `consul keygen` command, you can generate an encryption key that can then
    be used to encrypt the gossiping among your nodes. As the parameter is in the
    `common` configuration, all the nodes utilize the same key. We''re also ensuring
    that each agent is encrypting their traffic (`encrypt_verify_outgoing`) and only
    accepting traffic that has been encrypted (`encrypt_verify_incoming`). If you
    want to update this encryption key (which is strongly recommended), you can use
    the `consul keyring` command.


    At this point, you have a Consul cluster all set up, with protected messages running
    between all the nodes, both for RPC communication and all the gossip communication.
    As I stated previously, the decision to include certificates and encryption parameters
    as part of the build was to simplify the process. In my experience, the process
    of creating and distributing certificates is challenging, and even more so if
    you don''t have officially registered domains for your machines. This process
    should be completed by your security team, so be sure to involve them when designing
    secure communication among your Consul machines.


    # Let''s play with some ACLs!


    Now that we have our cluster up and running, let''s start playing with some ACLs.
    I didn''t want to enable ACLs as part of the build process simply because without
    the tokens, we wouldn''t be able to access our Consul system! I also wanted you
    to see how the system is locked down with the default deny policy, and then we
    would open it up slowly. We''re going to be bouncing through machines quite a
    bit here using SSH and the key that is created as part of the build process. In
    a real-world scenario, like our build-out, much, if not all, of this can be performed
    as code with Terraform, so if you find this process painful, you might want to
    read a Terraform book next.'
  merge: -1
  img_proc: true
- pgno: 108
  md: "The first thing we need to do is modify our server configuration to enable\
    \ ACLs. The structure of the file has already been placed on the server, so all\
    \ we need to do is get that into the right place and then we can start playing.\
    \ Now, we need to perform these actions on EACH server in the cluster, because\
    \ if you only have ACLs enabled on one server, you might end up with dogs and\
    \ cats living in harmony, and we just can’t have that!\n\nIf you can still see\
    \ your Terraform outputs, that’s great – be sure to copy them to a temporary text\
    \ file so that you can play with them. There’s lots of good information there.\
    \ If you’re thinking, *what in the world is he talking about?*, don’t worry –\
