- pgno: 44
  md: 'All right—now that we know essentially what happens within a massive cluster,
    let''s take a deeper dive into the protocols used that help make all of this happen!


    # Rafting consensus


    We''ve seen how the Consul servers elect their leader utilizing the **consensus**
    protocol, but what exactly does that mean, and is that all that they do? Well,
    of course they do more; otherwise, this would be a very short section. The consensus
    protocol that Consul utilizes is based on the Raft algorithm (https://raft.github.io/raft.pdf),
    which is based on Paxos (https://en.wikipedia.org/wiki/Paxos_%28computer_science%29).
    If you get the feeling that we are quickly heading down a rabbit hole, don''t
    worry—we aren''t going to keep digging until we hit water.


    # A closer look at leader election


    As you will soon see, a Consul server is configured with a number of other servers,
    which it will Raft up with. This is called the `bootstrap_expect` value within
    the configuration. That number of servers is important to remember, as it will
    come up again. Of course, if a Consul server is going to expect a number of servers
    to Raft up with, it needs to know about them so that is also configured. In order
    to become a leader, a server needs to be elected by a majority of servers within
    the Raft—for example, if you are expecting five servers within your Raft, you''ll
    need at least three to vote for you. This is referred to as a quorum and is a
    critical concept when it comes to the availability of a server cluster. Much like
    with the many meetings that we hold, if you don''t have a quorum of members, you
    can''t really make any decisions. In some meetings, even with a quorum, you can''t
    make any decisions if you don''t have anybody leading! If you aren''t sure about
    how many servers are needed to attain a quorum, refer to the following equation:


    (Number of Servers)/2 + 1 = Quorum


    If the number of servers is the same as the quorum size, there is no protection
    for the cluster. Of course, you can''t have a half of a server, so if you end
    up with a half, just round down. The table in Figure 2.11 might also help:'
  merge: -1
  img_proc: true
- pgno: 45
  md: '| Number of Servers | Quorum | Failure Tolerance |

    |---|---|---|

    | 1 | 1 | 0 |

    | 2 | 2 | 0 |

    | 3 | 2 | 1 |

    | 4 | 3 | 1 |

    | 5 | 3 | 2 |

    | 6 | 3 | 2 |

    | 7 | 4 | 3 |


    Figure 2.11 – Never fail for quorum


    So, let''s look at how that election is performed. For a really cool animated
    view of the process, the following website is fantastic: http://thesecretlivesofdata.com/raft/.


    Walking through the election, we''re going to look at three servers: **Bart**,
    **Lisa**, and **Maggie**. **Bart** is the first server to recognize consciousness,
    so he submits himself as a *candidate* and sends a request to **Lisa** and **Maggie**
    to become the *leader*. However, before **Lisa** heard **Bart**''s request, she
    sent her own request for candidacy with a leader request to **Bart** and **Maggie**,
    because we all know **Lisa** is smarter.


    You can see an overview of the process in Figure 2.12:


    ![](img/52479dafaefba00517c48a137e037b7e_45_0.png)


    Figure 2.12 – Lisa''s nomination for election


    **Maggie** hears **Lisa**''s request for leadership and responds happily. By this
    time, **Bart**''s request has made it to both **Lisa** and **Maggie**, but alas,
    he is too late. **Maggie** has already voted for **Lisa** (I mean, seriously:
    why would she vote for **Bart** anyway?).'
