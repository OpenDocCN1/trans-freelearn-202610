    \ web interface. The path to the key and value is represented as, well, a path,\
    \ not unlike the folder and file structure that we all know and love. This not\
    \ only lends itself well to the organization of the data but also facilitates\
    \ logical path based API calls, which are all REST-based. We're going to walk\
    \ through these actions, and if you would like to follow along, all of the code\
    \ for creating the image and Consul system is located within the GitHub repository\
    \ we've been using. Of course, there is a new folder for this chapter at `https://github.com/PacktPublishing/Consul-Up-and-Running/tree/main/ch7`.\n\
