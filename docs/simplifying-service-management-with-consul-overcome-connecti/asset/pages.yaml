- pgno: 119
  md: "This is very specific to our node, as well as to the two services that are\
    \ running on our client node – just as things should be.\n\nLet's update our client-token\
    \ policy with the new rule:\n\n```\n$ consul acl policy update -name \"client-token\"\
    \ -rules=@client-policy.hcl\n```\n\nThe output should confirm that your new service\
    \ rules have been written to the policy:\n\n```\nID:           a1fb3a7c-2a42-613d-4586-5dadfb422022\n\
    Name:         client-token\nDescription:  Client ip-192-168-100-77 Token Policy\n\
    Datacenters:\nRules:\nnode \"ip-192-168-100-77\" {\n    policy = \"write\"\n}\n\
    agent \"ip-192-168-100-77\" {\n    policy = \"write\"\n}\nservice \"httpd\" {\n\
    \    policy = \"write\"\n}\n```\n\nGreat! We've updated our policy on our server\
    \ node, and we never had to return to the client. Here's the final test; does\
    \ your httpd service now show up in your catalog for that node? Run the following\
