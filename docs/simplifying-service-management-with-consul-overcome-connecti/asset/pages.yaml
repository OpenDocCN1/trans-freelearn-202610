- pgno: 165
  md: "As noted previously, all checks can be operated at the command line, which\
    \ is a great way to learn more about the operation and results of the check. The\
    \ results of the check are JSON formatted to facilitate parsing of the data, which\
    \ can be useful for alerting other components of the service availability. For\
    \ something such as the Consul services watch, the results are very high level,\
    \ as in the following example:\n\n```\n```json\n{\n    \"consul\": [],\n    \"\
    httpd\": [\n        \"python-server\"\n    ]\n}\n```\n```\n\nMeanwhile, the output\
    \ for the service specific watch is quite more elaborate. The following example\
    \ results have been truncated for brevity.\n\n```\n```json\n{\n    \"Node\": {\n\
    \        \"ID\": \"494c2e14-5442-0339-6bbd-fa84254f5aa5\",\n        \"Node\":\
    \ \"ip-192-168-100-124\",\n        \"Address\": \"3.128.24.217\",\n        \"\
    Datacenter\": \"dc1\",\n        \"TaggedAddresses\": {\n...\n```\n```\n\nIf we\
    \ want to find which nodes are running the `httpd` service we are using in our\
    \ examples, we can easily parse the JSON result from the query. Additionally,\
    \ we can add a `passingonly` Boolean parameter to indicate that we only want to\
    \ retrieve nodes that are hosting healthy instances of the `httpd` service:\n\n\
    ```\n```bash\nconsul watch -type service -service httpd -passingonly true |\n\
    jq \".[] | .Node.Address\"\n```\n```"
