- pgno: 213
  md: 'If we look in our directory, we can also see that we now have our Terraform
    binary downloaded by CTS, but we also have this folder called `sync-tasks`. Here
    is where the magic happens.


    ![](img/52479dafaefba00517c48a137e037b7e_213_0.png)


    Figure 7.5 – CTS content created


    Within the `sync-tasks` folder, we will have a folder for every task that CTS
    has been commanded with. For us, we just have `find-httpd-nodes`, the name of
    our task. Within that folder, we have a bunch of Terraform code! More importantly,
    we have a `terraform.tfvars.tmpl` file. If you observe that file, we''ll find
    that it looks a lot like a Consul Template file. If you continue your path with
    HashiCorp products, get used to these template files. They are incredibly useful,
    and they pop up everywhere!


    When CTS runs, that template file is used to create a new `terraform.tfvars` file,
    the file that actually holds the variables used for the Terraform code. All we''ve
    done so far is run an inspect operation; basically, a task with CTS to see what
    it would do, but not actually do it. These variables, created by CTS, are fed
    into the Terraform code that is then used to adjust the infrastructure accordingly.'
  merge: -1
  img_proc: true
- pgno: 214
  md: <!-- no content -->
