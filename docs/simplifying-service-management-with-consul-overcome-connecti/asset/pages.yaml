- pgno: 67
  md: 'OK—now that we''ve gone through the full Terraform file, let''s take a closer
    look at that server template file. Via the template, we''re creating a `consul-server.hcl`
    server configuration file and populating it with all of the configuration necessary,
    as follows:


    ```

    ```bash

    #!/usr/bin/env bash


    cat << EOF > /etc/consul/consul.d/consul-server.hcl

    server = true

    bootstrap_expect = 3

    retry_join = ["provider=aws tag_key=Name tag_value=${server_name_tag}"]

    bind_addr = "$(curl -s http://169.254.169.254/latest/meta-data/local-ipv4)"

    advertise_addr = "$(curl -s http://169.254.169.254/latest/meta-data/public-ipv4)"

    client_addr = "$(curl -s http://169.254.169.254/latest/meta-data/local-ipv4)"

    ui = true

    EOF


    # Starting consul services

    sudo systemctl start consul

    ```

    ```


    Following along with that template file, let''s take a look at exactly what that
    file is doing:


    +   1. Indicating that the Consul agent should operate as a server.

    +   2. Next, we''re identifying the expected number of servers that we want to
    see in our cluster. Remember that we mentioned this before when discussing consensus
    and quorums. We''re creating three Consul servers, which means our quorum is…
    (I''ll give you a hint—it''s more than one, and less than three).

    +   3. OK—this part is pretty cool. If you remember, in the Terraform script,
    we had that `instance` tag that identifies the individual servers. This `retry_join`
    configuration identifies a list of servers that compose that expected peer set
    of three servers. AWS fills in this value with the servers that match that `instance`
    tag.'
  merge: -1
  img_proc: true
- pgno: 68
  md: '+   4. Much like with the client configuration, we''re configuring the address
    that we are going to bind to (`bind_addr`), the address that we are advertising
    (`advertise_addr`), and the address that we want to be identified as (`client_addr`).
    We''re configuring these values using machine metadata that was set as part of
    the provisioning—another nice feature with Terraform and AWS.

    +   5. Finally, we''re enabling the web UI for Consul. By default, the web interface
    is not available, but we''ll be using it occasionally throughout the book.


    That completes the contents of the configuration file. The last thing we need
    to do is start our Consul servers!


    Wahoo! Congratulate yourself for getting through all of that craziness! I hope
    it was as much fun for you reading it as it was for me writing it. If it makes
    you feel any better, *Planet Caravan* provides a great little beat for writing.


    OK—by now, your Consul cluster should be up and running. Hey—*up and running*:
    that would be a great name for a book series! So, now that we''ve gotten it up,
    let''s start taking a look around.


    # Accessing the Consul system


    The output from the Terraform run is going to provide you with vital information
    for accessing the Consul cluster. This is produced as *output* from the Terraform
    run. Another output you''ll find in your directory is an SSH key that can be used
    for remotely connecting to the machines, should that ever be required, as it will
    be here shortly. Have a look at the following code snippet:


    ```

    Apply complete! Resources: 25 added, 0 changed, 0 destroyed.


    Outputs:


    CONSUL_HTTP_ADDR = "http://18.191.150.155:8500"

    Consul_Server_IPs = [

    "3.129.42.175",

    "18.191.150.155",

    "3.139.81.1",

    ]

    ```


    Using the preceding example, we''re going to access the Consul system in two different
    ways: through the CLI and through the web interface.'
  merge: -1
  img_proc: true
- pgno: 69
  md: "# Using the CLI\n\nLet's start with SSH. One of the artifacts produced from\
    \ that Terraform run is an SSH PEM key used to authenticate yourself with the\
    \ Consul machines. The file will be called `<owner>-consul-key.pem`. Using your\
    \ command-line shell, from the same place you ran Terraform, you can SSH into\
    \ any of the Consul servers—for example, this one:\n\n```\n```bash\n$ ssh -i rjackson-consul-key.pem\
    \ ubuntu@18.191.150.155\n```\n```\n\nObviously, you want to replace the name of\
    \ the key with your own key and the IP address of one of the Consul servers. It\
    \ can be either of the three, so don’t worry about picking the *right* one. You\
    \ will receive a prompt with all sorts of gobbledygook (technical term) about\
    \ the **Secure Hash Algorithm 256 (SHA256)** fingerprint and asking if you want\
    \ to continue. Yes—you do want to continue, and you'll be on your very first Consul\
    \ server!\n\n> **Note**\n> \n> If you don't want to SSH into the server, you don't\
    \ need to! However, in order to communicate with the Consul cluster via the CLI,\
    \ you will need Consul installed locally. Don't worry—it's as simple as downloading\
    \ Packer and Terraform; download a ZIP file, unzip it, and place it in your path.\
    \ Consul can be downloaded from https://www.consul.io/downloads. If you decide\
    \ to utilize a remote CLI, just follow along, as the steps are the same.\n\nNow\
    \ that you're on the machine, please don't delete anything! Don't laugh—it happens.\
    \ If you remember back when we were discussing the template file, there was a\
    \ `bind_address` property that specified which address Consul was going to listen\
    \ on. We are using the public address, so we want to set that as the Consul address\
    \ in our environment. Don't worry—you have all of the information you need to\
    \ *export* this information into your environment. I have no idea why they call\
    \ it *export* when you are putting the information in, but so be it.\n\nWithin\
    \ the Terraform output, you'll see a value for `CONSUL_HTTP_ADDR`. This is exactly\
    \ the variable, along with that address, to set in your environment. Again using\
    \ that Terraform output as an example, you can see this here:\n\n```\n```bash\n\
    $ export CONSUL_HTTP_ADDR=http://18.191.150.155:8500\n```\n```\n\nOK—you’re all\
    \ set, so let's take a look at that cluster! The first thing we should do is make\
    \ sure that all of our machines, servers, and clients are up and registered in\
    \ the Consul system. If you don't remember how many, we have three servers and\
    \ four clients. You can see all of the *members* of our cluster via the following\
    \ command:\n\n```\n```bash\n$ consul members\n```\n```"
  merge: -1
