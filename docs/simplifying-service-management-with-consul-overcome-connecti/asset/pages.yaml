- pgno: 209
  md: '```

    server tag"

    }

    ```


    We have a few sections within this configuration, so let''s take them one at a
    time.


    The first eight lines describe general parameters for the CTS application. The
    log_level, port, and syslog sections should be pretty self-explanatory, but what
    is with this buffer stuff?


    One of the challenges we find with automating changes such as these is that when
    there is any sort of instability, that instability can have a ripple effect. As
    humans, we can sometimes take time to react to a situation, and by the time we
    are able to react, the situation has changed. Of course, I say sometimes because
    this isn''t always the case, and we all know that when we don''t take time, problems
    occur. Machines don''t usually have this problem of delay. Actually, our problem
    with machines and software is typically just the opposite, where the applications
    respond so quickly, we get flapping back and forth. Our buffer configuration helps
    manage that flapping and ensures that there is some period of time waiting for
    the system to obtain a steady state before making an adjustment.


    The next section identifies the Consul related configuration parameters in the
    consul configuration block; essentially telling CTS where it can find the Consul
    service. Here we only have the address, however, any certificates or tokens would
    be called out in this area. As we''ve already seen how granular we can get with
    ACLs and tokens, we would want to make sure that the CTS service is utilizing
    a token that would give it read access to the service catalog.


    We know that CTS requires a connection to Terraform in order to initiate infrastructure
    changes. Optionally, the terraform configuration block can specify a pre-downloaded
    Terraform binary and path to be used. However, without this specification, CTS
    will download a Terraform binary (adhering to the version specification if included)
    and save that binary within the CTS working directory. Logging the Terraform actions,
    as well as the Terraform backend configuration, should take special attention.


    During processing, Terraform can log the interaction with the infrastructure components
    being managed. This log output may contain sensitive information, and if stored
    locally on the machine(s) running CTS, could pose a security concern. Therefore,
    unless you''re debugging, it is recommended to not log the Terraform interaction.
    This same sensitive information is also recorded in Terraform state, which isn''t
    optional. Terraform utilizes that state file to understand the current status
    of the infrastructure being managed, and evaluate what changes are necessary.'
  merge: -1
  img_proc: true
- pgno: 210
  md: 'So, what are we to do with this ominous state file? Well, in the first part
    of this chapter we talked about the functionality available with the distributed
    Consul KV store. So long as we can keep that state file to a manageable size,
    less than 512 KB, we can keep that state file within the Consul KV store. This
    is actually what we are doing with the backend configuration sub-block within
    the terraform block. This not only gives us a distributed storage location that
    we can protect using ACLs but also an indication of changes to the state file
    (remember the ModifyIndex value in the KV response). This does require us to keep
    the state relatively simple, but we really should be doing that anyway, focusing
    the Terraform script used for CTS only on the specific infrastructure we need
    to manage. For example, if I have 10 virtual machines, a Kubernetes cluster, and
    a load balancer, I should only include the infrastructure code for the load balancer
    as part of CTS.


    All of this talk about state and the Terraform configuration may seem excessive,
    but the details here cannot be undervalued. To summarize, keeping our Terraform
    code focused only on what needs to change as a result of the service catalog enables
    the following:


    +   - Centralized and protected storage utilizing the Consul KV store – we have
    Consul available already, so why not use it for this purpose?

    +   - Sensitive information in the state file is kept to a minimum, only related
    to the infrastructure being managed by CTS.

    +   - Faster changes initiated through CTS. With large state files, as a result
    of large infrastructure definitions, it will take Terraform longer to process
    the changes.


    The next block we want to address is the task block. Now we''ll finally get to
    define what we actually want CTS to do! The task block identifies the Terraform
    module that is to be executed as a result of changes to the service catalog. For
    our purpose, the module is incredibly simple, printing out the service nodes and
    relevant information. However, a Terraform module can do just about anything within
    the realm of infrastructure management! A Terraform module can be likened to a
    function within an application, built for one specific purpose. Some modules can
    be quite large (such as creating an entire production HashiCorp Vault system),
    but we''ve already seen that we want to keep the Terraform operation focused.
    Therefore, we want to use very specific modules, such as populating the client
    nodes in a load balancer. The Terraform registry, https://registry.terraform.io/,
    offers a plethora of example modules to be perused.'
  merge: -1
  img_proc: true
