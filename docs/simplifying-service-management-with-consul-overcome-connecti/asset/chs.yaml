  \n## 结束\n\n我美丽的朋友，希望不只是唯一的朋友，这就是结束。或者，也许并且希望，这是您 Consul 之旅的开始。如果您有 Consul 的历史，您可能注意到我们遗漏了大量信息，我同意。在创作本书的过程中，我继续从事日常工作，寻找更多需要涵盖的内容。Kubernetes\
  \ 就是一个例子，可能值得单独写一整本书。然而，我确实希望我们为应用 HashiCorp Consul 的多种用途和应用程序奠定了基础。Consul 节点之间的通信路径，可以说是架构中最重要的方面之一，已经得到了一些详细的解释。我们经历了保护\
  \ Consul 集群的过程，不仅确保通信加密，还确保身份验证。我们不希望外人加入我们的群体并监听我们的八卦，对吗？将 Consul 扩展到多个数据中心和区域是架构的下一个合理步骤。当然，一旦我们有了稳定的基础，我们需要确保我们的运营和资本投资获得价值。Consul\
  \ 通过在我们动态且不断变化的世界中进行服务发现来提供这种价值。在这个世界中简单地找到我们的服务往往并不那么简单！一旦我们能够定位我们的服务，我们利用 Consul\
  \ 将它们连接到各种环境（内部和外部）到 Consul 的领域。当然，网络世界确实远远超出 Consul 的领域，但我们可以应用 Consul 的知识来自动化该网络基础设施。最后，尽管\
  \ Consul 几乎可以部署在任何系统上（有些人在树莓派上运行 Consul！），但我们通常不希望在不必要的情况下处理操作系统。HashiCorp 云平台上的\
  \ Consul 提供了快速启动托管 Consul 集群并接入您的服务的能力。\n\n我确实希望您喜欢这本书并学到了一些关于 Consul 的知识。更重要的是，我希望我已经激起了您对许多话题的好奇心。永远不要停止学习！\n\
