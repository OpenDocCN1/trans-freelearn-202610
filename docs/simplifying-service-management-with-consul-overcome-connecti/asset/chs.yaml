- "## 5\nLittle Bo Peep\nLost Her Service\n\n就是现在！我们所有人都在等待的时刻！所有那些可怕的冷笑话和双关语即将得到回报，因为我们实际上开始将所有这些巨大的知识付诸实践！在每个\
  \ Consul 用例的最基础部分都是服务信息的发现和共享。我们准备将精力更多地集中在 *为什么使用 Consul*，而不是 *什么是 Consul*。为了理解这个初始用例的为什么，让我们看看古老的童谣\
  \ *Little Bo Peep who lost her sheep*。不过，正如你可能猜到的那样，我们失去的不是羊，而是我们的服务！\n\nLittle\
  \ Bo Peep 在照看她的羊群，它们自由地在山坡上。只要羊群被限制在羊圈里，她很容易监控它们。它们只能游荡到一定范围，只要她控制羊圈的那些门，就没有问题！随着时间的推移，她开始了解到她的羊群如果被放任游荡，不仅能为她，还能为他人提供更丰厚的羊毛。此外，随着她允许那些羊游牧式地游荡，她发现为羊提供食物和水变得高效得多。那么，她需要管理这些羊而不把它们赶回羊圈，需要什么呢？\n\
  \n- **Location:** 当然，她需要某种方法来追踪和定位羊。她可以通过在每只羊上安装 **Global Positioning System (GPS)**\
  \ 追踪器来解决这个问题，以便在必要时定位它们。\n- **Health:** 她需要知道她的羊是健康的！如果其中一只感觉不舒服，她需要照顾它，而且同样重要的是，确保没有人给那只羊剪毛！\n\
  - **Discovery:** 所以她知道它们在哪里以及感觉如何，但她将如何让其他人找到羊呢？她会定期宣布，举起一个牌子，还是也许提供一个有名人嘉宾的热线？\n\
  \n随着我们深入本章，我们将看到 Consul 如何解决 Little Bo Peep 及其迷路的羊，我的意思是服务，这三个关键挑战。\n\n### Technical\
  \ requirements\n\n在本节中，我们将在 **Amazon Web Services (AWS)** 上使用 Terraform 部署完整的 Consul\
  \ 集群。如果你已经完成了 *Chapter 2, Architecture – How Does It Work?*，设置了你的 AWS 账户，下载了 Terraform，并克隆了仓库，你就准备得很充分！\n\
  \n本章中没有特定的步骤；然而，拥有一个简单的运行中 Consul 集群（例如来自 *Chapter 2, Architecture – How Does It\
  \ Work?*）以及提供的服务，对于导航和操作服务可能会非常有用！\n\n### Dude, where's my service?\n\n我们要解决的 Little\
  \ Bo Peep 的第一个挑战就是简单地确定她的羊，或在这种情况下，她的服务的位置。在我们的类比中，Little Bo Peep 在每只羊上安装了 GPS 追踪器。然而，GPS\
  \ 从根本上只提供给定点的经度和纬度。它本身并不能提供关于该点的任何信息，只知道它存在。如果她仅仅停留在安装追踪器上，她真的解决了问题吗？在非常高的层面上，她可以看到特定位置存在一个\
  \ GPS 追踪器。然而，她还不知道哪个羊存在于该位置。她还需要某种接收器来维护所有这些 GPS 坐标的位置。这归结为服务定义和集中式服务注册。\n\n每个网络中的每个服务都有某种定义。定义的某些方面可能非常高层次，例如名称或目的。定义的某些方面可能非常详细，例如服务可以在哪个地址访问以及它监听哪个端口。历史上，这些信息可以保存在数据库、电子表格或某人隔间里的便签上。无论保存在哪里，它都需要被完全定义。Consul\
  \ 也不例外。\n\n\n\n\nConsul 所感知的每个服务都是由，嗯，服务定义（service definition）来定义的。有人可能会说，等等，你说过这些是自动发现的——为什么还需要配置？这里要说的是，这些服务是自动发现，而不是自动定义。定义以文件形式存在，可以是\
  \ JSON 或 HCL，Consul 能够将其与其他配置文件一起读取。这些文件可以相当复杂，也可以极其简单，具体取决于服务及其功能。我们来看一个到目前为止在我们的工作中已经使用过的服务定义：\n\
  \n## httpd.json\n\n```\n{\n    \"service\": {\n        \"name\": \"httpd\",\n  \
  \      \"tags\": [\n            \"python-server\"\n        ],\n        \"port\"\
  : 8080,\n        \"check\": {\n            \"args\": [\n                \"curl\"\
  ,\n                \"localhost:8080\"\n            ],\n            \"interval\"\
  : \"10s\"\n        }\n    }\n}\n```\n\n你可能会注意到，这是一个名为 httpd.json 的文件，其中包含部署在 Consul\
  \ 中的 httpd 服务的定义。当 Consul agent 启动时，它会尝试读取配置文件夹中的每个文件。这些文件可以是实际的 agent 配置、安全配置（如访问控制列表（ACL））或服务定义。这使任何组织都能够让服务开发者编写，或至少深度参与编写其服务定义，并对其进行单独管理。\n\
  \n如果你不想为每个服务单独创建一个文件，Consul 确实提供了将多个服务合并到一个配置文件中的能力。不过，应当注意不要让这些文件过载。毕竟，你能想象一个 Consul\
  \ agent 上运行着 100 个服务，却只有一个配置文件吗？\n\n在典型的 Consul 系统中，服务的部署、移除或更新十分频繁。如果你考虑软件开发生命周期，新服务或应用程序的孕育期可能短至几周。在许多此类情况下，可能都需要针对新版本、标签等更新服务定义。理想情况下，每次发布新服务或应用程序时，都会有一个相应的\
  \ Consul 服务定义文件伴随该应用程序一起发布。\n\n当新应用程序或现有应用程序的新版本被部署时，服务定义也会随之更新。如果你使用的是诸如 Nomad\
  \ 这样简单的编排器，它可以将相应的服务定义作为应用程序定义的一部分进行管理，并自动部署。然而，在传统系统中，你通常需要主动选择应用程序运行在哪些节点上，那么用于推送应用程序的任何过程都应该同时推送相应的服务定义。\n\
  \n一旦新定义就绪，相关的 Consul agent 需要简单重载以识别调整后的配置。与大多数配置一样，服务的动态调整不会自动被识别。不过，重载 agent 非常简单，可以通过\
  \ `consul reload` 命令或 API 调用来完成：\n\n```sh\n$ curl --request PUT $CONSUL_HTTP_ADDR/v1/agent/reload\n\
  ```\n\n在更动态的环境中，Consul API 在这一过程中提供了大量功能。它不能帮助你部署应用程序；但是，所有的服务定义和检查都可以通过 Consul\
  \ API 提供给 Consul agent。这对于那些需要在应用程序部署后对服务定义或该定义的任何方面（包括健康检查）进行修改的环境非常有用。不过，通过 API\
  \ 注册服务确实需要一些额外的信息，以便确保 Consul 知道该服务预期位于哪个节点上。请注意下面用于 Consul API 的 `httpd-api.json`\
  \ 与我们之前使用的原始 `httpd.json` 定义之间的区别。需要提供 Datacenter、Node 和 Address 字段，以便告知 Consul\
  \ 该服务预期位于哪个节点上；同时需要提供 CheckId 和 ServiceId，以便将服务定义和检查定义关联起来。这样便可以单独推送服务和检查定义：\n\n\
  ## httpd-api.json\n\n```json\n{\n  \"Datacenter\": \"dc1\",\n  \"Node\": \"ip-192-168-100-118\"\
  ,\n```\n\n```\n\"Address\": \"192.168.100.118\",\n\"Service\": {\n  \"ID\": \"httpd2\"\
  ,\n  \"Service\": \"httpd2\",\n  \"Tags\": [\n    \"python-server\"\n  ],\n  \"\
  Address\": \"192.168.100.118\",\n  \"Port\": 8080\n},\n\"Check\": {\n  \"CheckID\"\
  : \"httpd2\",\n  \"Node\": \"ip-192-168-100-118\",\n  \"ServiceID\": \"httpd2\"\
  ,\n  \"Status\": \"passing\",\n  \"Definition\": {\n    \"tcp\": \"localhost:8080\"\
  ,\n    \"interval\": \"10s\"\n  }\n}\n}\n```\n\n**重要提示**\n尽管通过 API 定义和管理服务对于 Consul\
  \ 的程序化管理非常有用，但必须注意，如果 Consul agent 重启，通过 API 执行的所有目录条目都不会持久化。\n\n## 外部服务\n\n但是，Rob，如果我想让\
  \ Consul 感知那些并未直接嵌入 Consul 系统的服务，该怎么办？这对 Consul 来说并不是问题；只不过，它确实需要一些额外的配置选项，类似于我们在\
  \ API 服务定义中所做的那样。让我们考虑这样一种情况：在整个生命周期中，我们希望为开发人员提供一个集中式的 GitHub Enterprise 服务，同时让他们能够利用\
  \ Consul 来发现 GitHub 服务。我将以 **GitHub** 托管的服务平台作为示例，但由于它只是一个 URL，这个定义可以很容易地适用于多种场景：\n\
  \n## github.json 外部服务定义\n\n```json\n{\n  \"Node\": \"github\",\n  \"Address\": \"\
  www.github.com\",\n  \"NodeMeta\": {\n    \"external-node\": \"true\",\n    \"external-probe\"\
  : \"true\"\n  },\n  \"Service\": {\n    \"ID\": \"vcs\",\n    \"Service\": \"vcs\"\
  ,\n    \"Port\": 80\n  },\n  \"Checks\": [{\n    \"Name\": \"http-check\",\n   \
  \ \"Definition\": {\n      \"http\": \"https://www.github.com\",\n      \"interval\"\
  : \"30s\"\n    }\n  }]\n}\n```\n\n请注意，在此服务定义中，我们同时包含了节点和检查信息。\n\n这个定义与我们之前所见不同，其重要特点是存在\
  \ `external-node` 和 `external-probe` 参数，两者均设置为 `true`。该信息告知 Consul，此服务需要由某种外部服务管理器来监控。有趣的是，*外部服务管理器*\
  \ 恰好是一个简单二进制守护进程的名字，它可以与所有 Consul agent 一起运行，以管理任何类型的外部查询。不过，在我们介绍它之前，先来注册我们的服务。\n\
  \n由于不仅服务位于 Consul 之外，承载该服务的节点也位于 Consul 之外，因此 Consul 需要通过 API 注册该节点、服务以及任何附加检查。我们可以使用\
  \ cURL 和前面代码中的 GitHub 服务定义 JSON 文件来完成此操作：\n\n```bash\n$ curl --request PUT --data\
  \ @github.json http://<consul_http_address>:8500/v1/catalog/register\n```\n\n注册服务后，Consul\
  \ 会认为 vcs 服务领域一切正常，并将其在服务目录中提供：\n\n![](img/52479dafaefba00517c48a137e037b7e_154_0.png)\n\
  \n因此，我们可以看到我们的服务已经注册；然而，它还没有显示为健康状态。这是因为 Consul agent 正在寻找一个外部服务监视器来监视，嗯，那个外部服务。当\
  \ Consul **外部服务管理器**（ESM）运行时，它也会作为 Consul 目录中的一个服务出现。有了这个服务，我们现在可以看到外部 GitHub 服务开始报告为健康状态：\n\
  \n![](img/52479dafaefba00517c48a137e037b7e_155_0.png)\n\n图 5.2 – Consul 外部服务监视器已注册\n\
  \n当我们查看服务详情时，不仅可以看到 GitHub 的 HTTP 检查返回健康，还可以看到一个 **外部节点状态** 检查也返回了愉快且健康的状态：\n\n\
  ![](img/52479dafaefba00517c48a137e037b7e_155_1.png)\n\n图 5.3 – 外部服务的服务检查\n\n\n\n\
  \n\n此时，我们已在 Consul 中定义了一个外部服务，它不仅注册在服务目录中，而且还会被监控，以确保在向任何消费者提供目录信息之前，服务处于健康状态。\n\
  \n如果你希望将 Consul ESM 下载到自己的系统上并试用该服务，只需登录到你选择的其中一个 Consul 客户端节点。在命令行 shell 中，执行以下命令：\n\
  \n```\n$ curl -o https://releases.hashicorp.com/consul-esm/0.5.0/ consul-esm_0.5.0_linux_amd64.tgz\n\
  ```\n\n```\n$ tar -zxvf consul-esm_0.5.0_linux_amd64.tgz\n```\n\n这为你提供了 consul-esm\
  \ 二进制文件，它可以像标准 Consul 代理一样，使用 HCL 配置文件进行配置！我提供了一个非常简单的配置文件。如果你想试用 ESM，只需确保修改 `local_private_ip`\
  \ 参数，并插入与你节点对应的正确参数：\n\n```\n# consul-esm.hcl Configuration File\nlog_level = \"\
  INFO\"\ninstance_id = \"\"\nconsul_service = \"consul-esm\"\nhttp_addr = \"<local_private_ip>:8500\"\
  \ndatacenter = \"dc1\"\n```\n\n现在你已经有了配置文件，可以运行 consul-esm 并使用它：\n\n```\n$ sudo\
  \ ./consul-esm -config-file=./consul-esm.hcl\n```\n\n如果你正在跟着操作（你当然应该这么做），那么你的 VCS\
  \ 外部服务应该已在 Consul 集群中注册为健康状态。如果你想查看 Consul ESM 的源代码或其他文档，所有内容都在 GitHub 上开源提供！\n\n\
  https://github.com/hashicorp/consul-esm\n\n既然我们已经知道了如何定义内部和外部服务，小波比也能够分辨哪些羊是她的，以及它们在哪里。她还需要一种方法来确保她的羊都健康。毕竟，生病的羊需要被照料！让我们来看看如何确保我们的羊——我是说服务——保持健康。\n\
  \n## 汤姆少校，你还好吗？\n\n每当我们处理通信时，几乎总需要某种程度的反馈来确保接收方可用。这正是我们耳熟能详的短语的由来，比如*你现在能听到我吗？*。任何处理过网络负载均衡器或系统监控的人对*健康检查*一词都不会陌生。这正是\
  \ Consul 可以在每个服务定义中采用的机制。尽管健康检查并非服务定义的必需部分，但我无法想象为什么会有人想要定义和部署一个没有健康检查的服务！\n\n在网络负载均衡器或系统监控领域，健康检查是由某种集中式智能定义和编排的。这意味着，如果一个负载均衡器管理着分布在\
  \ 100 个不同节点上运行的 10 个服务，那么该负载均衡器需要跟踪 1,000 个健康检查。这不仅会在服务增长时导致一些扩展问题，而且还会（至少略微）增加网络流量。\n\
  \n如今许多监控系统利用远程代理进行健康检查，既解决了扩展问题，也减轻了网络影响。Consul 的运作方式与监控系统类似，利用与服务一起部署的 Consul 代理来管理和执行所有本地健康检查。然而，与集中式监控系统不同，如果\
  \ Consul 管理的服务或 Consul 节点/代理发生故障，负担并不完全落在服务器集群上。回想一下，由于我们所有的代理都在进行 gossip（八卦）通信，它们会了解对等节点的服务可用性并用于上报。因此，对于\
  \ Consul 而言，每个管理服务的代理也会管理和执行与相应服务健康相关的检查。让我们看看为了实现这一目的，我们可以实施哪些检查：\n\n- **脚本**：顾名思义，脚本检查会执行一个预定义的自定义脚本，以执行某些功能来验证服务的健康状态。在我们使用\
  \ `httpd.json` 服务定义的示例中，我们使用了脚本检查，利用 Linux `curl` 工具以及一些相应参数（`localhost:8080`）。虽然我使用的是一个常见工具作为脚本，但在大多数情况下，脚本是非常自定义的，会对服务健康状态进行深入查询。除了脚本之外，你还可以指定脚本运行的间隔，以及为适应脚本失败而设置的必要超时。请注意，脚本检查默认未启用，因此代理的配置必须允许脚本检查。这可以通过\
  \ `enable_script_checks` 以及 `enable_local_script_checks` 布尔参数来实现。Consul 根据脚本返回的值来识别服务的健康状态：\n\
  \n  - 0：服务健康。\n  - 1：服务处于警告状态。\n  - 其他任何值：服务不可用。\n\n> **注意**\n> \n> `enable_script_checks`\
  \ 字段允许通过任何方法（包括 API）定义的脚本。如果你尚未正确保护集群安全，这会使远程实体能够在 Consul 代理上执行脚本。强烈建议将所有脚本检查定义并实现于代理本地，并专门使用\
  \ `enable_local_script_checks`。\n\n- **HTTP**：你可能已经猜到，基于 HTTP 的检查会发起一个 HTTP 请求，以确认相关服务的健康状态。默认情况下，这是一个\
  \ GET 请求；不过，该检查确实支持在配置中指定其他 HTTP 方法。如果需要特定的 HTTP 头，也可以通过配置中的 headers 字段指定。与基于脚本的检查类似，配置可以指定\
  \ Consul 等待 HTTP 请求响应的超时时间，以及发起请求的间隔。此外，正如我们已经看到的保护通信的重要性，HTTP 检查确实支持 TLS 配置，以防应用程序使用安全的\
  \ HTTP 端点。来自 HTTP 检查的任何 2xx 响应都被视为服务健康。\n\n- **TCP**：如果你曾经使用过 Telnet 来检查应用程序是否在某个端口上监听，那么\
  \ TCP 检查非常适合你！TCP 检查只是尝试连接到应用程序应该监听的某个主机和 TCP 端口。当然，与基于 HTTP 和脚本的检查类似，配置可以指定 Consul\
  \ 等待 HTTP 请求响应的超时时间，以及发起请求的间隔。你可能已经注意到这里的一个模式。如果 Consul 代理能够连接到主机和端口，则该服务被视为健康。\n\
  \n- **TTL**：此检查完全基于应用程序最后已知状态的**生存时间（TTL）**。在 HTTP 和 TCP 健康检查中，Consul 会查询服务以验证可用性。然而，对于\
  \ TTL 检查，Consul 会监听 HTTP 更新来判断服务是否健康。在大多数情况下，这仅在服务能够自我报告其状态时使用，状态可为**通过**、**警告**或**失败**。如果服务在\
  \ TTL 值内没有报告，Consul 将假定该服务不再可用。\n\n- **Docker**：这对于确定运行在 Docker 容器内的服务或应用程序的健康状态非常有用，因为这些容器可能没有任何暴露的接口，无法使用\
  \ TCP、HTTP 或基于脚本的检查。对于基于 Docker 的检查，Consul 利用 Docker HTTP API 或直接套接字与 Docker 主机交互。Consul\
  \ 指示 Docker 启动一个容器应用程序来检查服务健康状态，向 Consul 报告健康信息，然后终止该容器。作为配置的一部分，你可以指定运行此检查的间隔，但没有超时时间。请注意，与脚本检查类似，这确实需要\
  \ Consul 代理上的高级权限，因此 `enable_script_checks` 布尔配置必须设置为 `true`。\n\n- **gRPC**：一些支持\
  \ **gRPC 远程过程调用**的应用程序可能也支持特定于 gRPC 的健康检查端点。这无疑是一种更具体的集成方式。不过，该检查支持对单个服务或多个服务进行健康验证，具体情况由\
  \ gRPC 服务器报告。基于 gRPC 的检查定义包含我们在其他检查中见过的 `timeout` 和 `interval` 参数。此外，与 HTTP 检查类似，gRPC\
  \ 健康检查支持用于安全网络的 TLS 配置。\n\n- **H2ping**：此检查提供与 HTTP 检查类似的功能；不过，它支持通过 HTTP2 协议定义的非常简单的\
  \ ping 帧传输。与 HTTP 检查一样，H2ping 检查可以配置检查执行的间隔，以及在宣布检查失败前等待的超时时间。然而，与 HTTP 检查不同，H2ping\
  \ 默认依赖 TLS 连接，但可以通过将 `tls_skip_verify` 设置为 `true` 来禁用。\n\n\n\n\n\n所有上述检查都支持可选字段，例如\
  \ notes（用于提供有关检查的人类可读信息）和 token（用于为检查提供特定的 ACL 令牌）。此外，在许多情况下，我们并不希望健康检查仅作为一次性的操作运行。识别在我们信任服务可用之前需要发生的通过检查次数通常很有用。此外，我们可能希望确保单次检查失败并不一定否定整个服务的可用性。对于这些场景，每个检查都支持\
  \ success_before_passing 字段以及 failures_before_critical 字段。最后，需要注意的是，Consul 支持在单个配置中定义多个检查。在很大程度上，我们的讨论一直围绕检查服务的健康状况展开。我们还应该检查\
  \ Consul 代理所在的节点的健康状况。多个检查的应用非常适合此目的，因为我们就可以检查内存、CPU、磁盘空间等。以下 uber-check 提供了多个节点级检查的示例（请注意，与检查关联的没有\
  \ service ID）：\n\n`# node-check.json`\n\n```json\n{\n  \"checks\": [\n    {\n  \
  \    \"name\": \"mem\",\n      \"args\": [\"check_mem.sh\", \"-limit\", \"256MB\"\
  ],\n      \"interval\": \"5s\",\n      \"timeout\": \"2s\"\n    },\n    {\n    \
  \  \"name\": \"cpu\",\n      \"args\": [\"check_cpu.sh\", \"-percent\", \"90\"],\n\
  \      \"interval\": \"10s\"\n    },\n    {\n      \"name\": \"disk\",\n      \"\
  args\": [\"check_disk.sh\",\n        \"-path\", \"/\",\n        \"-threshold\",\
  \ \"80\"\n      ],\n      \"interval\": \"10s\",\n      \"timeout\": \"5s\",\n \
  \   }\n  ]\n}\n```\n\n这假设我们创建了简单的脚本来评估资源，同时将限制和阈值作为变量来考虑。如果其中任何一个脚本的结果为 1，则节点将被视为处于警告状态。为了使节点被视为健康，所有脚本的输出都必须为\
  \ 0。\n\n就这样了。正如你所见，Consul 支持多种健康检查协议以确保服务可用性。Consul 功能的核心在于其服务目录；因此，准确了解与特定代理关联的服务的健康状况是系统的关键功能。\n\
  \n因此，在这一点上，我们拥有一个服务目录，并且能够验证我们的服务是否健康并准备好被使用。接下来，我们将看到我们的应用程序如何发现这些服务。\n\n## 方法\
  \ of discovery – no lawyers required\n\n每当我听到 discovery 这个词时，我就不禁想到所有律师节目和电影中引用的流程。幸运的是，我们不需要律师作为发现过程的一部分，但有几种方法可以发现我们的目录提供哪些服务。让我们在以下各节中看一些例子。\n\
  \n### DNS\n\n任何应用程序发现服务位置的最简单方法与它们多年来一直使用的方法相同，利用 DNS。默认情况下，Consul 在 Consul 集群中的每个代理上端口\
  \ 8600 上提供 DNS。每个节点和服务都可以使用 Consul 域进行查询。例如，如果我们想找到托管 httpd 服务的节点的地址，我们可以执行以下命令（当然使用\
  \ Consul 节点的 IP 地址）：\n\n```\n$ dig @192.168.100.20 -p 8600 httpd.service.consul\n\
  ```\n\n专注于查询的 answer 部分，我们可以验证已返回两个地址，可以在这些地址上找到 httpd 服务：\n\n```\n;; ANSWER SECTION:\n\
  httpd.service.consul. 0 IN A 3.20.237.142\nhttpd.service.consul. 0 IN A 13.59.70.71\n\
  ```\n\n*嘿 Rob，每个人都知道 DNS 使用端口 53，为什么你不直接用那个端口用于 Consul DNS？* 这是一个非常好的问题，并且与 Consul\
  \ 运行的权限有关。为了将应用程序或服务附加到众所周知的端口 53，应用程序需要特权访问。我不建议在任何生产环境中以这种级别的访问权限运行 Consul（或大多数应用程序）。*那么我们现在如何使用它呢？*\
  \ 别担心，小帕达万……这里有几个选项。\n\n在大多数系统中，存在大量基于 DNS 的服务，可以部署不仅用于管理该特定节点的名称解析，还可帮助该节点在网络中找到其他节点。这包括\
  \ BIND、dnsmasq、Unbound 和 systemd-resolved 等实用程序。由于其中一些解决方案可能只解析 Consul 域，因此 Consul\
  \ 代理配置中有一个名为 recursors 的参数。这使 Consul 能够将无法解析的任何 DNS 查询发送到另一个 DNS。\n\n### API\n\n\
  与使用 DNS 相比，通过 API 访问服务非常简单。然而，从应用程序的角度来看，这确实需要一定程度的开发来进行服务发现。Consul 除了 API 外，还提供了一个广泛的过滤机制，以便管理用于发现服务的标准。我们可以过滤的属性包括服务的标签和节点、服务的元数据和节点、地址以及数据中心。在以下示例中，我们基于与我们的\
  \ httpd 服务关联的 ServiceTags 进行过滤：\n\n```\ncurl http://18.189.17.157:8500/v1/catalog/service/httpd\
  \ 'filter=ServiceTags == \"python-server\"' | jq\n```\n\n此类查询的结果相当广泛，但它全部以 JSON\
  \ 格式提供，这已被证明对人类、机器（也许还有赛博格）解析都很容易：\n\n`# Truncated output of Consul API Service\
  \ Query`\n\n```json\n[\n  {\n    \"ID\": \"c83108da-f84c-20cf-7882-386e91ee2b27\"\
  ,\n    \"Node\": \"ip-192-168-100-168\",\n    \"Address\": \"13.59.70.71\",\n  \
  \  \"Datacenter\": \"dc1\",\n    \"TaggedAddresses\": {\n      \"lan\": \"13.59.70.71\"\
  ,\n      \"lan_ipv4\": \"13.59.70.71\",\n      \"wan\": \"13.59.70.71\",\n     \
  \ \"wan_ipv4\": \"13.59.70.71\"\n    },\n    \"NodeMeta\": {\n      \"consul-network-segment\"\
  : \"\"\n    },\n    \"ServiceKind\": \"\",\n    \"ServiceID\": \"httpd\",\n    \"\
  ServiceName\": \"httpd\",\n    \"ServiceTags\": [\n      \"python-server\"\n   \
  \ ],\n    \"ServiceAddress\": \"\",\n    \"ServiceWeights\": {\n      \"Passing\"\
  : 1,\n      \"Warning\": 1\n    },\n    \"ServiceMeta\": {},\n    \"ServicePort\"\
  : 8080,\n    \"ServiceEnableTagOverride\": false,\n    \"ServiceProxy\": {\n   \
  \   \"MeshGateway\": {},\n      \"Expose\": {}\n```\n\n如前所述，所有检查都可以在命令行上运行，这是一个了解检查操作和结果的好方法。检查的结果以\
  \ JSON 格式格式化以便于解析数据，这对于向服务可用性的其他组件发出警报很有用。对于诸如 Consul services watch 之类的东西，结果非常高级别，如以下示例所示：\n\
  \n```json\n{\n    \"consul\": [],\n    \"httpd\": [\n        \"python-server\"\n\
  \    ]\n}\n```\n\n与此同时，服务特定 watch 的输出要详细得多。以下示例结果已为简洁起见而截断。\n\n```json\n{\n    \"\
  Node\": {\n        \"ID\": \"494c2e14-5442-0339-6bbd-fa84254f5aa5\",\n        \"\
  Node\": \"ip-192-168-100-124\",\n        \"Address\": \"3.128.24.217\",\n      \
  \  \"Datacenter\": \"dc1\",\n        \"TaggedAddresses\": {\n...\n```\n\n如果我们想找到运行我们在示例中使用的\
  \ `httpd` 服务的节点，我们可以轻松解析查询的 JSON 结果。此外，我们可以添加一个 `passingonly` 布尔参数来指示我们只想检索托管 `httpd`\
  \ 服务的健康实例的节点：\n\n```bash\nconsul watch -type service -service httpd -passingonly\
  \ true |\njq \".[] | .Node.Address\"\n```\n\n当然，这些示例都与 Consul 服务交互，并且只提供 watch 的结果。以下示例指定了一个\
  \ checks 类型 watch，当检查执行时将调用 `check-handler.py` Python 脚本：\n\n```text\nwatches =\
  \ [\n    {\n        type = \"checks\"\n        service = \"httpd\"\n        args\
  \ = [\"/etc/consul/consul.d/check-handler.py\"]\n    }\n]\n```\n\n为了通知外部应用程序或服务检查结果，包括我们健康服务的位置，处理程序能够将此信息发布到多种服务中。一个潜在的选项是更新服务订阅的消息队列，例如\
  \ **RabbitMQ** 或 **ActiveMQ**。一旦 Consul 发布服务信息，任何在相应队列上监听的组件都可以检索信息。\n\n就这样了！在本节中，你学习了三种获取\
  \ Consul 目录中服务信息的方法，从看起来最直接的 DNS 开始，到直接的 API 集成，再到可以通知几乎任何人或任何事的通知机制！\n\n## Summary\n\
  \n我希望你喜欢这一章……定义和管理我们的服务并不是一个极其复杂的话题，但对于任何动态网络的健康运行至关重要。我们多云世界的巨大优势不在于云计算的存在；而在于能够快速创建和删除资源如何改变我们的人类运营模式。不幸的是，这种灵活性确实意味着我们的服务有能力在云中迁移和漫游。使用我们的基本示例，我们能够在\
  \ Consul 系统中注册我们的 `httpd` 服务，确保服务健康，并查看可用于发现该服务的不同方法。现在是休息一下并玩转 Consul 系统的好时机，因为下一个主题，*service\
  \ mesh*，有更多的工作部件要处理。坚持住……事情马上就要变得 meshy 了！\n\n\n\n\n"
- "## 6 连接四个或更多\n\n就是它了！到目前为止你所读的一切都引向了这一点。我知道我之前说过，但这是真的。你在这本书中所读到的所有内容都引向了这一点。无论如何，欢迎来到服务网格的世界。任何具有路由和网络背景的工程师都欣赏服务网格的强大功能。多年来，我们一直专注于连接机器、分配或识别地址，并将它们分割成子网、交换机端口和路由表。当然，这些功能仍然是必需的；然而，其中很大一部分现在被定义为基础设施即代码，并由公共或私有云运营商以编程方式管理。现在我们有机会将对话提升一个层次，字面意义上的提升，这样我们就不再连接数字串，而是直接连接服务了。在本章中，我们将探讨以下主题：\n\
  \n- 在网格内连接我们的服务 – 在上一章中，我们学习了如何发现我们的服务。现在我们将学习如何通过服务网格让它们相互通信。\n- 在网格外连接我们的服务 –\
  \ 认为你能交互的一切都存在于服务网格内是不现实的。因此，我们需要研究如何启用和管理与外部实体的连接。\n- 保护网格 – 如果网格只是允许服务到服务通信，那会很酷，但在我看来并不太有用。一旦启用了服务网格，你就可以唯一地保护，并且轻松地禁用和启用每个服务连接。\n\
  - 网格到网格 – 就像假设所有服务都将存在于一个网格中一样，假设只有一个网格统治一切也是不现实的！随着我们扩展网络和服务，我们将需要连接多个服务网格，提供一个网格的网格。是的，我们要变得很“网格”！\n\
  \n我们在这里规划的进展不仅对教育有益，而且为任何网络中的服务网格采用提供了一条合乎逻辑的路径。在没有进一步的拖延，或双关语的情况下，让我们连接四个，或更多！\n\
  \n### 技术要求\n\n在本节中，我们将使用 Terraform 在 **Amazon Web Services (AWS)** 上部署一个完整的 Consul\
  \ 集群。如果你已经阅读过 *Chapter 2, Architecture – How Does It Work?*，设置了你的 AWS 账户，下载了 Terraform，并克隆了仓库，你就准备得很充分了！\n\
  \n在仓库的 `ch6` 文件夹中，我们有与 `ch2` 文件夹类似的结构，提供创建镜像的代码，以及当然创建 Consul 集群的代码。如果你想跟随操作，使用\
  \ `ch6` 创建一个新的 Consul 集群，其中包含本章中你将使用的一些服务配置文件。\n\n在我们在本章中讲解代码和功能之前，重温 *Chapter 2,\
  \ Architecture – How Does It Work?* 并回顾部署和访问我们的基础设施所需的步骤可能会很有用。\n\n### 连接服务，而非地址\n\
  \n无论你选择红药丸还是蓝药丸，我们所处的网络是不可否认的。媒介或底层连接并不总是被认可。毕竟，在 2020 年的大部分时间里，以及 2021 年的至少一半时间里，我们中的许多人一直生活在连接的机器中。今天几乎每部手机都存在于某种计算机网络上，由分配的地址标识。然而，作为消费者，我们并不真正关心那个地址，至少不是直接关心。提供和维护该地址的功能仅存在于允许我们的应用程序通信。全面看通信路径，除了分配的地址之外，还需要其他方面，例如某种物理连接和标识。这些方面中的每一个都作为\
  \ **Open Systems Interconnection (OSI)** 模型中的一层发挥作用。\n\n除非你在过去几年一直在玩电缆和交换机，否则这可能是一个新概念。因此，在我们谈论更多关于服务网格之前，我想先建立一个网络的基础。别担心，我们不是在准备思科认证互联网专家考试。\n\
  \n### 理解网络连接\n\n当我们的应用程序相互通信时，传输的消息需要在各种媒介中传输。当我们打开我们最喜欢的视频会议软件时，应用程序会连接到另一边的服务器。我想我们都能理解这一点。但是什么促进了这种通信？我们可以说它只是通过\
  \ Wi-Fi，但这到底意味着什么？嗯，应用程序软件和 Wi-Fi 只是通信路径中的层。感谢上天，我们不必处理洋葱或怪物那样的层数。而且我们也将为我们的讨论简化层数。\n\
  \n![](img/52479dafaefba00517c48a137e037b7e_169_0.png)\n\n图 6.1 – Vidona 通过 Swampnet\
  \ 的连接\n\n请看图 6.1。由于沼泽地的疫情，舒렉和驴子已经很长时间没能见面了。然而，他们发现了一个名为 Vidona 的新应用程序，可以让他们虚拟地见面。当驴子呼叫舒렉时，消息起源于\
  \ Vidona，即使用的应用程序。该消息通过一个通道流动，并被包裹在一个写有舒렉地址和驴子回邮地址的信封中。然后消息流向物理层。虽然我们无法感受到 Wi-Fi\
  \ 信号（如果我们能感受到那会多么疯狂？），但 Wi-Fi 无线电在物理上存在。为了在 Wi-Fi 无线电上发送消息，它被打包在另一个信封中，使用不同的地址代表驴子的物理平板。\n\
  \n现在我们有两个地址：**network** 地址和 **physical** 地址。**physical** 地址通常不会改变。它与驴子的平板相关联，并帮助平板与它\
  \ *物理* 连接的组件通信（即使是无线）。与此同时，**network** 地址将驴子的平板标识为全局唯一的实体，这是舒렉的计算机用来响应驴子平板的地址。请注意一个非常重要的区别；驴子的\
  \ **Vidona** 应用程序需要知道舒렉的网络地址才能连接，并且网络地址会随时间变化。此外，如果驴子和舒렉想让他们的通信不被法尔夸德勋爵窥探，**Vidona**\
  \ 必须开发自己的安全机制。这对于 **Vidona** 的开发人员来说可能具有挑战性，而当其他应用程序需要参与这种安全通信时，难度会更大。最终，目标是在应用层提供安全连接，即\
  \ **Vidona** 层，如图 6.2 所示：\n\n![](img/52479dafaefba00517c48a137e037b7e_170_0.png)\n\
  \n图 6.2 – Vidona 安全连接\n\n图 6.1 和 6.2 之间的重要区别在于，尽管底层的网络流没有改变，**Vidona** 应用程序能够以看似直接和安全的方式在对等方之间通信。由于\
  \ **Vidona** 控制此特定示例的双方，利用其内置的安全机制可能就足够了。然而，一旦混合应用程序和服务，这种连续性就会被打破。\n\n作为我们后续的对话，我们将参考网络世界中的各个层。在本章开头，我提到了\
  \ OSI 模型，它由七层组成，如图 6.3 所示：\n\n![](img/52479dafaefba00517c48a137e037b7e_171_0.png)\n\
  \n图 6.3 – 网络 OSI 模型\n\n就我们的目的而言，我们将主要关注最上面的三层，即应用层、表示层和会话层，我们将它们统称为应用层。传输层以及网络层也会发挥作用，不过这些是在机器级别的通信。\n\
  \n有了对网络栈的基本理解，让我们来看看为什么仅仅依赖该栈对于当今的云世界来说是不够的。\n\n### 为什么传统网络不够用\n\n在零信任领域，我们不能仅仅隐含地假设在单台机器上运行的任何东西都是友好的。几乎每周我们都会听到一起安全事件，其起源于对某个实体受信任的假设，而该实体却被攻破了。零信任或最小权限安全概念专注于我们真正关心的身份和安全，即应用程序。如果我们的服务器或系统托管多个应用程序，我们需要一种标准化的方法来唯一标识并保护每个应用程序。为了说明这一点，我将重温常见的电话号码类比。\n\
  \n\n\n\n当我还是个少年时，我有时会参与一些时不时可能被认为有问题的事情。幸运的是，那时我们并不是所有人兜里都揣着带 GPS 跟踪器的电脑；不过，我父母有我所有朋友家的电话号码。如果我要去迈克家，我父母就能通过迈克家的电话号码联系到我。然而，当他们打电话时，无法控制是谁接听。在我们的朋友之间，我们可以利用这种模糊性找点乐子。比如，当我们的朋友吉娜给迈克家打电话时，可能是我接的。虽然我们都很亲近，但即使在现在，有时也很难通过电话里的声音辨认出某人。而那时（固定电话音质更差）就更有挑战性了！所以，我正和吉娜聊得热火朝天，但她却以为自己在和迈克通话。这种把戏今天也能玩，只是要拿起某人的手机比在他们家拿起电话听筒更难。在这个类比中，吉娜和我就是应用程序，迈克的家就是主机。吉娜试图通过迈克家的电话号码联系迈克，但我只要在那里，就能冒充迈克。电话号码也许可信，并且明确地与主机绑定，但并不能保证应用程序的身份或安全。\n\
  \n这个故事表明，仅仅假设 **第 4 层地址** 是任何应用的身份会带来风险。在私有数据中心，当房子被牢牢锁住、门口有守卫时，按地址识别并没有那么不合理。然而，在公有云环境中，存在合法和非法的地址伪装，尤其是在任何类型的迁移型工作负载环境（如\
  \ Kubernetes）中，仅靠地址是远远不够的。那么，让我们看看如何通过隧道来解决这个问题。\n\n## 隧道通往安全\n\n网络隧道和**虚拟专用网络（VPN）**的概念并不新鲜。然而，在所有这些实例中，连接都基于所涉及组件的第\
  \ 4 层地址。我们可以通过一系列点对点 VPN 来连接应用机器，但这并不能缓解对**应用**进行识别和保护的需求。实际上，使用 VPN 反而增加了对应用身份的需求，而不是单纯依赖地址。不过，我们仍然可以把\
  \ VPN 视为我们想要达到目标的一个模型。\n\n在大多数情况下，当你建立 VPN 时，会有一个软件应用程序连接到某个远程站点或服务。连接建立后，你的设备会获得一个新的\
  \ IP 地址，该地址在目标网络上有效，所有机器流量都经过该连接流动。VPN 的美妙之处在于，从 VPN 客户端到 VPN 服务器之间传输的信息都经过加密和安全保护。这过去是、现在依然是保护流量不被窥探的好方法。历史上，VPN\
  \ 的使用主要面向企业网络。如今，许多人使用 VPN 不仅是为了加密流量，也是为了隐藏他们的第 4 层地址身份。我们已经确定，要实现真正安全的操作，需要验证应用程序的身份，因此使用\
  \ VPN 实际上可能阻碍而不是帮助这项工作。\n\n![](img/52479dafaefba00517c48a137e037b7e_173_0.png)\n\
  \n图 6.4 – VPN 流量模式\n\n现在，我并不是说 VPN 在这个世界上没有用武之地。当你需要以安全的方式连接机器时，它们提供了至关重要的功能。然而，我们讨论的不是连接机器，而是连接我们的应用。话虽如此，如果我们能把连接向上提升一层到应用层，VPN\
  \ 的概念就能很好地延伸。这正是 Consul Service Mesh 通过 Consul Connect 所提供的。\n\nConsul Connect 功能将经过身份验证的应用连接起来，并加密这些应用之间的流量。我们已经看到，在第\
  \ 3 章，保持安全，笨蛋，并保护好你的集群！中，Consul 服务器集群如何验证代理身份，并利用相互 TLS（mTLS）加密 RPC 流量。Consul Connect\
  \ 使我们能够将同样的功能扩展到每个由 Consul 管理的服务。让我们花几分钟重新回顾一下 Consul 和 mTLS。\n\n还记得那些旧日时光吗？我们在\
  \ *第 3 章，保持安全，笨蛋，并保护好你的集群！* 中玩转证书。在那过程中，我们使用 Consul 服务器作为**证书颁发机构（CA）** 来签发和管理证书（它是权威机构，还能做什么呢？）。为了降低复杂性，我们为三台服务器使用了通用证书。此外，所有客户端代理都使用一个通用证书。当时提到，在生产环境中，每个\
  \ Consul 代理都应该拥有自己唯一的证书。当一个代理收到另一个代理的公共证书时，该证书提供了发送者的**身份**。我们知道可以**信任**这个身份，因为证书是由某个权威来源签名的。这些证书不仅提供了身份，还提供了代理之间消息加解密所需的密钥。如果这种\
  \ mTLS 方法足以安全地验证 Consul 代理并加密流量，为什么不把它用于 Consul 管理的服务呢？\n\n使用 Consul Connect，每个服务都会分配一个唯一证书。如你所见，证书的使用对于\
  \ Consul 工作至关重要。我们不仅有用于代理之间安全通信的证书，还有用于服务的证书。所有这些证书的管理可能相当具有挑战性，但真正的应用身份和加密所带来的好处远超这些挑战。幸运的是，与\
  \ *第 3 章，保持安全，笨蛋，并保护好你的集群！* 非常相似，我们可以使用 Consul 作为我们应用程序的 CA。Consul 也支持使用 Vault 作为\
  \ CA，但出于我们的目的，我们将专注于使用 Consul。无论 CA 是谁，Consul 都可以编排证书的轮换和分发，这能极大地简化 Consul 的运维工作。然而，与\
  \ *第 3 章，保持安全，笨蛋，并保护好你的集群！* 不同的是，我们希望应用程序利用这些证书来进行身份识别和加密。不幸的是，许多应用程序并不是为支持特殊证书和加密而开发的。有用于自定义应用集成的开发库，但代理服务器非常适合这一目的，并且不需要额外的开发。\n\
  \n这表明我们的基于 Python 的 Web 服务器正在监听 8080 端口，地址为 `0.0.0.0`。该值代表所有可用的地址和接口。在这种配置下，任何能够访问这台机器的设备都可以访问\
  \ 8080 端口。为了增强安全性，我们要在本次练习中更改运行该 `httpd` 服务器的方式：\n\n```bash\nnohup python3 -m http.server\
  \ 8080 --bind 127.0.0.1 &\n```\n\n通过额外的 `bind` 配置标志，我们告诉 Python `http` 服务器**只**监听\
  \ `127.0.0.1`，也就是机器的本地回环地址。为了验证这一点，我们可以再次运行我们得心应手的 `netstat` 命令，得到以下结果：\n\n```text\n\
  tcp        0      0 127.0.0.1:8080        0.0.0.0:*\nLISTEN     7954/python3\n```\n\
  \n由于服务器只监听本地回环地址，任何外部应用程序都无法访问该服务器。当然，除非它们开始变得“网格化”。所以，现在我要问你，准备好和我一起“网格化”了吗？\n\n\
  在第 *6 章，连接四个或更多* 的存储库文件夹中，我放置了一个新的 `httpd.json` 文件，以及一个 `curl.json` 文件。它们将代表我们新的网格化服务，并且作为\
  \ Terraform 构建的一部分，这些文件将放在 Consul 客户端上。\n\n`httpd.json` 服务定义与我们的原始定义相比变化不大，只有一个主要例外。我们现在有一个\
  \ connect 配置块，它标识该服务将利用一个 sidecar 进行连接。这个 sidecar 就是代理服务器。\n\n## httpd.json\n\n\
  ```json\n{\n    \"service\": {\n        \"name\": \"httpd\",\n        \"id\": \"\
  httpd-1\",\n        \"tags\": [\n            \"python-server\"\n        ],\n   \
  \     \"port\": 8080,\n        \"connect\": {\n            \"sidecar_service\":\
  \ {}\n        }\n    },\n}\n```\n\n\n\n请注意，此配置中的 connect 部分稍微更复杂一些。对于 sidecar 服务，我们需要一些额外的参数来告诉代理服务器\
  \ curl 将要连接的服务（httpd），以及代理服务器应侦听请求的本地端口。在我的系统中——我鼓励你一起实践——httpd 服务运行在一个 Consul 客户端上，而\
  \ curl 进程运行在另一个客户端上。然而，当我尝试在 Consul UI 中查看这些服务时，发现它们并不处于健康状态！\n\n![](img/52479dafaefba00517c48a137e037b7e_178_0.png)\n\
  \n图 6.5 – 不健康的 httpd 和 curl 服务\n\n然而，我们在图 6.5 中可以看到，这些服务已通过代理处于服务网格中。嗯，这是新情况！我想知道服务处于服务网格中是否与缺乏可用性有关。如果我们查看服务实例，可以看到一个名为\
  \ Connect Sidecar Listening 的东西，这也是我们以前从未见过的。这看起来就是问题所在，而且它显然与我们一直在研究的 sidecar 类似。\n\
  \n![](img/52479dafaefba00517c48a137e037b7e_179_0.png)\n\n为了让此服务恢复健康，sidecar 需要一些关注。到目前为止，我们所做的只是在目录中注册了一个\
  \ httpd 服务，并告诉 Consul 该服务将通过代理访问。然而，我们还没有做任何事情来启动该代理！使用服务网格时，每个应用程序（除非原生支持网格）都需要自己的代理服务。因此，如果\
  \ Consul 不知道有任何与该服务配对的代理服务正在运行，该服务就不会处于健康状态。要启动 `httpd` 服务的代理服务器，我们只需要一条命令：\n\n\
  ```\n```bash\n$ consul connect proxy -sidecar-for httpd-1 > ~/httpd-proxy.log\n\
  &\n```\n```\n\n这里我们所做的是告诉 Consul 发出连接请求，利用内部代理，作为 `httpd-1` 服务的 sidecar 运行。*等等，我还以为只是\
  \ httpd 呢！* 你真是敏锐…… 我非常佩服！在创建代理服务时，我们使用的是服务的 **ID**，而不是服务的 **名称**。该请求的任何输出都被重定向到日志文件，并且我们在后台运行该命令。一旦运行该命令，服务在\
  \ Consul 系统中就健康快乐了。\n\n现在，我们必须让 curl 服务启动并运行。我觉得把 curl 称为服务有点奇怪，因为它只是一个简单的命令行工具，但为了我们的目的，我们将设想\
  \ curl 是一个访问某个 Web 服务器的客户端应用程序。要让 curl 服务的代理服务器运行起来，我们将运行类似的命令：\n\n```\n$ consul\
  \ connect proxy -sidecar-for curl > ~/curl-proxy.log &\n```\n\n现在，curl 和我们的 Web\
  \ 服务器的代理服务器都已运行。在 Consul UI 中，两个服务都是健康的，我们甚至可以看到服务连接的拓扑。目前的拓扑并不令人兴奋（就像 curl 一样），但随着服务数量的增长，能够查看哪些服务已连接对于理解通信路径至关重要。我们建立的路径如图\
  \ 6.7 所示：\n\n![](img/52479dafaefba00517c48a137e037b7e_180_0.png)\n\n图 6.7 – 通过代理连接的服务\n\
  \n让我们从客户端的角度来稍微梳理一下这个流程。我们有一个代理服务器与我们称之为 curl 的服务一起运行。该服务的定义，特别是 local_bind_port，标识了代理应该监听消息的端口（3579）。代理在该端口上接收到的任何消息都将被发送到上游的\
  \ httpd 服务。请注意，我们没有为该服务配置任何端口或地址；我们只拥有用作目的地的服务名称。在服务器端，我们有另一个代理服务器与我们的 httpd 服务一起运行。我们未为该服务定义端口，代理服务器在启动时动态分配端口。在本示例中，代理服务器分配了端口\
  \ 21000。由于 httpd 服务运行在内部 localhost 接口的 8080 端口上，代理服务器知道将请求转发到该端口。\n\n为了证明服务网格正常工作，我们将假装自己是那个客户端应用程序。因此，模拟客户端请求时，我们将从客户端机器访问端口\
  \ 3579。该消息将流经两个代理服务器到达 httpd 服务：\n\n```\n$ curl http://localhost:3579\n```\n\n响应是来自\
  \ /home/ubuntu（Python Web 服务器运行的位置）的服务器节点目录列表。如果你想再次核对，可以使用一个名为 tcpdump 的工具：\n\n\
  ```\n$ sudo tcpdump -nnvvXSs 1514 -i any port 21000\n```\n\n如果你在运行 httpd 服务的服务器节点上运行该命令，然后发出\
  \ curl 命令，你会看到接收和发送的数据包。别担心，我们并不指望你能读懂数据包信息。事实上，你也读不懂！代理服务器正在使用 Consul 提供的证书来加密该通信。虽然\
  \ Web 服务器或 curl 工具没有配置任何加密，但这两台设备之间的通信已成功加密。此外，我们所做的路由完全基于服务名称，没有任何地址配置！此时此刻，你值得获得一个祝贺性的虚拟拥抱。\n\
  \n此时有一点需要指出：Consul 服务器集群并未参与客户端和服务器之间的实际信息交换。这些应用程序之间的数据直接通过代理流向彼此。这条数据路径通常被称为数据平面。很有创意，我知道。然而，建立该数据连接所需的代理服务器信息由\
  \ Consul 管理。Consul 在此过程中执行的所有活动都发生在控制平面上。毕竟，这些是控制集群所必需的通信！有了这个集中控制点，我们就能够创建规则来允许或拒绝服务之间的通信。在\
  \ Consul 的世界里，我们称之为意图（intentions）。\n\n## 表明你的意图\n\n既然我们了解了应用程序将如何通过服务网格进行通信，就需要了解如何配置和管理这种通信。我们或许希望认为所有服务都会和谐共处，并且只有那些应该相互通信的服务才会通信。然而，尽管这个想法利他主义，但它并不太现实。因此，我们需要一种机制，以便在\
  \ Consul 系统中轻松定义哪些应用程序可以（更重要的是，不可以）相互访问。为此，我们使用所谓的 Consul 意图（Consul intention）。\n\
  \nConsul 服务的现状有一个好处：每个服务都由人类可理解的名称定义。我强烈建议在任何系统中使用清晰独特的服务名称，以避免歧义。然而，这种努力也带来了额外的好处，因为我们现在可以通过服务名称来指定意图。如果你曾经处理过任何基于\
  \ IP 的防火墙，你会觉得这非常令人安心。然而，与基于 IP 的防火墙类似，Consul 意图根据通信来源以及目标服务或应用来定义连接。不过，这种控制的粒度取决于服务被定义使用的协议。\n\
  \n服务定义使管理员能够定义应用程序所在的协议。协议有四个选项：tcp、http、http2 和 grpc。不过，对于意图，我们将重点讨论前两个：tcp 和 http。\n\
  \n`tcp` 协议定义比 `http` 协议具有更大的灵活性，因为它将支持范围扩展到 `http` 服务器之外。例如，如果你想将 Consul 用于数据库，那么将使用\
  \ `tcp` 协议。在这种情况下，mTLS 证书中编码的应用程序身份是 IP 地址和 TCP 端口的组合。管理这些连接的意图称为第 4 层意图。如果看应用层（第\
  \ 7 层），我们可以根据通信中实际使用的 URL 来设置意图。这对于服务路由和服务拆分是必要的，我们之前讨论代理服务器时已经提到过。\n\n第 4 层意图和第\
  \ 7 层意图之间的另一个重要区别是意图更新的生效时机。无需深入探讨，当客户端和服务器之间存在 TCP 连接时，该连接一旦建立，就会在通信路径的生命周期内保持连接。然而，对于\
  \ HTTP，连接仅在请求和响应信息期间处于活动状态。因此，第 7 层意图生效的速度可能比第 4 层意图快得多。Consul 不会拆除现有连接，因此只有在发出新的连接请求时，意图才会产生影响。\n\
  \n无论在哪个层执行意图，配置过程都是相同的，并且只需要三部分信息：服务名称、通信请求的来源，以及允许还是拒绝该连接。在深入探讨意图的定义之前，我想回顾一下*第\
  \ 4 章“数据中心（非贸易）联邦”*中的 ACL 部分。\n\n\n\n\n如果你还记得，Consul 在 ACL 方面默认有两种运行方式。我们可以隐式拒绝所有请求，只指定允许访问的部分；或者隐式允许所有请求，并指定我们想要拒绝的连接。遵循零信任模型——这对任何安全姿态都至关重要——隐式拒绝应适用于任何生产环境。Consul\
  \ 意图（Intentions）遵循同样的模型，我们可以隐式接受所有网络连接，也可以隐式拒绝所有网络连接。无论你为 ACL 配置了何种策略，相同的策略也会应用到你的意图上。例如，如果你的\
  \ ACL 策略是全部拒绝，那么默认情况下，任何允许的服务连接都需要显式定义。由于我们已经展示了流量通过网格传输，可以看到我们当前并没有启用全部拒绝的 ACL\
  \ 策略。\n\n因此，为了试验意图功能，我们将使用已经建立的同一个 curl 到 http 服务器的连接。利用 CLI，让我们查看 Consul 目录中注册的服务：\n\
  \n```\n$ consul catalog services\nconsul\ncurl\ncurl-sidecar-proxy\nhttpd\nhttpd-sidecar-proxy\n\
  ```\n\n注意，我们实际上列出了每个 sidecar 代理服务器的服务。然而，我们的意图是管理实际服务，即 curl 和 httpd。如果我们想通过命令行阻止\
  \ curl 和 httpd 之间的通信，非常简单：\n\n```\n$ consul intention create -deny curl httpd\n\
  ```\n\nCLI 会响应，确认意图已创建：\n\n```\nCreated: curl => httpd (deny)\n```\n\n有了这个意图后，让我们再次尝试发出之前那条\
  \ curl 命令：\n\n```\n$ curl http://localhost:3579\ncurl: (52) Empty reply from server\n\
  ```\n\n如你所见，我们无法再建立连接：`Empty reply from server.`\n当我询问菜单项是否为素食时，我得到的也是同样的反应……来自服务器的空回复。\n\
  如果此时你观察 `httpd` 服务器的日志，会看到一个非常有趣的消息：\n\n```text\n[ERROR] proxy.connect: authz call\
  \ denied: service=httpd\nreason=\"Matched L4 intention: default/curl => default/httpd\n\
  (ID: a605dfa9-cdcc-b304-400d-3fe708b603c1, Precedence: 9,\nAction: DENY)\"\n```\n\
  \n从结果中，我们可以清楚地看到，`default/curl` 尝试访问 `default/httpd`，但被拒绝了。我们在这里看到的 *default* 值指的是服务及意图所适用的命名空间。这使得我们可以为\
  \ Consul 系统中的各个命名空间配置并分配独特的意图。此外，我们已经知道，凭借适当的 ACL 令牌，我们可以确保只有获得授权的人才能在自己的命名空间中创建意图。我们还看到了一个返回的优先级值。任何规则中都会有优先级顺序。也可能存在通配符，用于概括某些规则并帮助管理。例如，我们可能希望确保系统中的某些服务\
  \ *只* 接收连接，而从不发起传输。比如，我们的 `httpd` 服务绝不应主动向任何其他服务发起连接。为此，我们可以使用通配意图来指示 Consul 拒绝任何源自\
  \ `httpd` 服务的请求：\n\n```shell\n$ consul intention create -deny httpd '*'\n```\n\n\
  如果你没有在生产环境中隐式拒绝所有连接，这类规则对于管理应用可能遭受的任何潜在入侵会非常有用。例如，如果我们的 `httpd` 服务被入侵，并被用于向网格内的任何其他服务发送信息，这条意图将明确阻止此类事件的发生。还应注意，通配意图在优先级列表中非常靠后，如\
  \ *图 6.8* 所示。意图越精确，在评估中的优先级就越高。\n\n| 源命名空间 | 源名称 | 目标命名空间 | 目标名称 | 优先级 |\n| ---\
  \ | --- | --- | --- | ---: |\n| 精确 | 精确 | 精确 | 精确 | 9 |\n| 精确 | * | 精确 | 精确 | 8\
  \ |\n| * | * | 精确 | 精确 | 7 |\n| 精确 | 精确 | 精确 | * | 6 |\n| 精确 | * | 精确 | * | 5 |\n\
  | * | * | 精确 | * | 4 |\n| 精确 | 精确 | * | * | 3 |\n| 精确 | * | * | * | 2 |\n| * | *\
  \ | * | * | 1 |\n\n图 6.8 – Consul 意图的优先级顺序\n\n在我们的 Consul 系统中，现在已经创建了两条意图：一条阻止 `curl`\
  \ 与 `httpd` 服务通信，另一条阻止 `httpd` 服务向任何其他服务发起对外通信。在 Consul UI 中，所有已配置的意图都是可见的，甚至可以按优先级顺序排序！随着服务数量以及随之而来的意图数量增长，这个视图会变得极为有用。\n\
  \n![](img/52479dafaefba00517c48a137e037b7e_185_0.png)\n\n图 6.9 – UI 中的意图\n\n在 UI\
  \ 中管理意图非常简单，既可以创建新意图，也可以编辑现有意图。Consul 网格中的每个服务都会作为源和目标提供，我们可以选择允许、拒绝，或者创建一条**应用感知（Application\
  \ Aware）**规则：\n\n![](img/52479dafaefba00517c48a137e037b7e_186_0.png)\n\n*图 6.10\
  \ – 在 UI 中编辑意图*\n\n**应用感知**规则通过使用显式权限增加了复杂性。回想一下，第 7 层意图提供了额外的功能，可以基于 URL 路径甚至请求中的头部来定义意图。\n\
  \n到目前为止，我们讨论的每个场景都基于一个前提：每个应用和服务都存在于服务网格内。对于那些位于网格之外的服务，我们能做些什么呢？嗯，很高兴你问这个问题，因为这个问题为下一个主题提供了一个绝佳的切入点。\n\
  \n## 通向统治之门\n\n哇，关于服务网格的信息真是精彩又有趣！但我有个问题：并不是我所有的服务都符合进入网格的条件。引用芬兰裔美国建筑师埃罗·沙里宁的话，*你试过网关吗？*\n\
  \n认为每个服务、每个应用都会驻留在单个服务网格中，对于任何企业部署来说都是相当不现实的。因此，Consul 提供了**网关**的概念。几乎所有现存的网关，无论是精神上的、哲学上的还是物理上的，都将两个存在领域连接起来。着眼于\
  \ Consul，我们可以将每个集群视为一个独立的领域，在其中服务可以被发现并安全地相互通信。然而，我们还需要考虑以下场景：\n\n- **多数据中心** –\
  \ 我们知道可以连接不同数据中心内的多个 Consul 集群。然而，一旦离开网格，我们就会失去身份和加密的安全性。\n- **外部服务** – 并非我们需要的每个服务都会存在于服务网格内。正如我们所看到的，网格要求代理服务器与相关应用共置。许多服务（例如托管的数据库）并不提供符合网格要求的嵌入式代理服务器（至少目前还没有）。\n\
  - **外部客户端和应用** – 尤其是当我们向最终消费者提供服务时，网格需要接受来自外部实体的流量。必须有办法让外部实体进入网格，以访问它们有权使用的服务。\n\
  \n上述三种场景中的每一种，都需要一个专用于网关操作功能的 Consul agent。此外，Envoy 代理必须与该 agent 配对，以提供那种隧道般的连接。正如我们在上一节中看到的，Consul\
  \ 利用 Envoy 代理服务器来管理网格内服务之间的连接。如果没有 Consul 与 Envoy 之间的紧密耦合，这种功能是不可能实现的，而这种耦合正是网格网关所必需的。因此，Envoy\
  \ 目前是唯一支持用于此目的的代理服务器。让我们来看看 Consul 如何在这些场景中应用各种网关。\n\n\n\n\n\n## 网格网关\n\n我们已经了解了如何通过服务网格安全地连接服务。我喜欢将网格网关视为一种*超级网格*。利用我们在*第4章，数据中心（而非贸易）联邦*中玩过的WAN联邦，我们能够跨多个数据中心连接Consul集群。Consul网格网关不仅为这种连接增加了加密能力，还增加了控制哪些服务被允许穿越这些数据中心的能力。\n\
  \n![](img/52479dafaefba00517c48a137e037b7e_188_0.png)\n\n图6.11——连接数据中心的网格网关\n\n\
  每当我们连接Consul服务网格中的一个服务时，Consul服务器集群都会通过**connect**功能管理身份证书和加密。通过网格连接集群也不例外；但我们都知道，当老板不止一个时会发生什么（更别提六个老板，六个老板）。因此，每当我们通过网格网关连接数据中心时，必须指定一个主数据中心来管理和分发证书。这些证书会在网格网关对等体之间创建一个新的mTLS会话，用于身份验证。这里需要注意的重要一点是，流经网格网关的加密流量仍然是服务到服务之间加密的。换句话说，网格网关实体不会解密服务之间的消息；它们只保留服务端点已经执行的加密。\n\
  \n那么，如果我们不希望所有服务都穿过网关呢？没问题！当服务通过网格网关连接时，Consul集群能够识别这些服务，我们就可以编写意图（intentions）！这把巨大的权力交给了Consul管理员，他们不仅可以控制单个集群内的服务网格，还可以控制整个世界！此外，作为服务定义的一部分，我们可以告诉Consul，**上游服务**（我们想要发起连接的服务）可以通过网格网关访问。让我们看一个修改过的`curl`服务作为示例。\n\
  \n## 跨网格网关的Curl.json\n\n```\n{\n    \"service\": {\n        \"name\": \"curl\",\n\
  \        \"tags\": [\n            \"curl-client\"\n        ],\n        \"connect\"\
  : {\n            \"sidecar_service\": {\n                \"proxy\": {\n        \
  \            \"upstreams\": [{\n                        \"destination_name\": \"\
  httpd\",\n                        \"datacenter\": \"secondary\",\n             \
  \           \"local_bind_port\": 3579\n                    }]\n                }\n\
  \            }\n        }\n    }\n}\n```\n\n在这个稍微修改过的服务定义中，我们告诉Consul，我们想要访问的`httpd`服务位于名为*secondary*的数据中心。这是一个连接另一个Consul数据中心以访问服务的绝佳示例，但如果目标服务不在网格内呢？\n\
  \n## 终止网关\n\n随着**一切即服务（*aaS）**的普及，云提供商正在努力使自己脱颖而出并保持竞争力。至少，这是我的理论，我认为这导致了原本需要专用计算资源的托管服务的出现。即使这不完全正确，听起来也合乎逻辑，而且我相当确定我在互联网的某个地方读到过。托管数据库服务是这一功能的绝佳示例，不幸的是，我们无法在托管的AWS数据库服务上部署Consul代理。为此，我们有了终止网关的角色。\n\
  \n![](img/52479dafaefba00517c48a137e037b7e_190_0.png)\n\n幸运的是，这个网关并没有在云中游荡寻找莎拉·康纳。然而，它终止的是Consul服务的安全和控制。但并非一切尽失，因为如果目标服务支持mTLS，终止网关将维持该安全连接。如果服务只支持单向TLS，网关也可以处理；但这可能会使终止网关面临潜在攻击。由于网关位于网格的边缘，与网格网关不同，它确实有能力解密它收到的流量。因此，始终建议严格控制充当网关的节点的访问权限。但有一个问题……Consul是如何知道那些甚至不在Consul集群内的服务的呢？\n\
  \n回想我们在*第5章，小波比丢失了她的服务*中讨论服务发现时，Consul能够在注册表中包含不受Consul管理的服务。这些是**外部**服务，这说得通，因为它们对Consul来说是**外部**的。任何希望通过终止网关访问的服务都必须在Consul中注册；毕竟，如果不注册，我们怎么能发现它们呢？当我们配置终止网关时，我们需要列出可通过该网关访问的服务。这是Consul管理从网格内部到这些外部服务的发现和连接的唯一方式。我们仍然可以使用ACL和安全措施直到网关节点；然而，一旦流量离开网关，我们就需要诉诸老式的网络方式，就像我们的祖母们所做的那样。\n\
  \n## 入口网关\n\n接下来，我们必须考虑外部广阔而可怕的世界中那些想要访问我们提供的精彩服务的实体！这需要一种方法来打开服务网格并邀请其他人加入我们。然而，我们不想只是打开门让任何东西进入我们的网格。我们付出了巨大的努力，忍受了无数糟糕的笑话，来保护我们美丽的网格。我们最不希望的就是允许邪恶的流量通过大门，使网格陷入风险。\n\
  \n![](img/52479dafaefba00517c48a137e037b7e_191_0.png)\n\n图6.13 – 入口网关\n\n幸运的是，任何我们希望通过入口网关访问的服务都应该已经在Consul服务目录中注册了。然而，我们不想在这个过程中完全暴露自己。Consul允许我们在入口网关的配置中定义一个监听器。这个监听器告诉Consul代理（以及Envoy代理）要监听哪个端口，以及对应的服务是什么。通过这种配置，入口网关可以在指定端口接收流量，并将该流量转发到适当的目标服务。\n\
  \n现在我们了解了Consul如何将内部和外部服务连接到网格网络，让我们快速看看一个由渴望连接的独立网络组成的环境。\n\n## 与Kubernetes构建网格\n\
  \n在整章中，我只提到过Kubernetes一次，而且只是一带而过。部分原因是我对Kubernetes的厌恶以及我在这项技术上挣扎的无数小时。然而，像Kubernetes（或Nomad）这样的服务编排器在服务网格领域绝对有一席之地。事实上，许多人只有在应用程序编排工具的领域内才会考虑服务网格。我们不会深入讨论Kubernetes的细节，原因有很多（其中一些我已经提到过）。不过，我确实想谈谈为什么服务网格在这个领域如此重要。\n\
  \n应用程序编排提供了一个完整的运行环境，我们的应用程序就驻留在其中。一旦部署到环境中，编排器的主要工作就是确保所需数量的实例正在运行，并确保资源得到管理。只要满足任何约束条件，应用程序可以位于集群机器中的任何位置。如果应用程序失败，编排器负责在集群内的某个位置重新启动该实例。此外，在执行机器升级时，编排器能够在集群中移动应用程序，以最好地实现预期目标。本质上，无论编排器是Kubernetes还是Nomad，它都完全控制着应用程序的位置，从而控制其寻址方式。应用程序的这种迁移性和短暂性极大地复杂化了我们之前讨论的IP寻址问题。\n\
  \n\n\n\n\n在 Kubernetes 中，我们有自己的服务器集群来管理所有被编排的**节点**（机器）和应用程序。如今，云提供商提供了他们自己的托管 Kubernetes\
  \ 服务，极大地简化了管理集群的（通常很严峻的）负担。集群可以有任意数量的**节点**，它们为要部署的应用程序提供计算资源。每个被部署和管理的应用程序被打包为**容器**。这就引出了\
  \ Pod，它是一组一个或多个容器的集合，这些容器一起生存、运行和绑定。Kubernetes Pod 通常在其内的容器之间共享各种属性。这些属性包括存储，以及……等等……网络！\n\
  \n![](img/52479dafaefba00517c48a137e037b7e_193_0.png)\n\n图 6.14 – Kubernetes 高层概览\n\
  \n向 Kubernetes 部署应用程序时，我们使用名为 `helm` 的命令，并配有一个 helm chart，用于定义应用程序的部署方式。Consul 为此提供了自己的\
  \ helm chart，并在 GitHub 上公开可用（`https://github.com/hashicorp/consul-k8s`）。利用这个 helm\
  \ chart，Consul 可以安装在 Kubernetes 集群内相关 Pod 旁边，促进与 Pod 的安全网络连接。与 Kubernetes 之外的网格示例非常相似，在\
  \ Kubernetes 内部，Consul Connect 功能利用 Envoy 代理服务器作为应用程序的连接点。主要区别在于，Consul agent 不是作为独立进程运行，而是作为配置了\
  \ Kubernetes **注解**的集群内的 **边车（sidecar）** 进程运行。无论应用程序是网格连接的目标，还是与上游服务的网格连接的源，该进程都是相同的。\n\
  \n此外，每当提到服务网格这个话题时，通常都会与 Kubernetes 这类编排器概念联系在一起。然而，我希望我已经向您展示了其适用性远远超出了 Kubernetes\
  \ 集群。Kubernetes 本身就是一个高级主题，在我看来，它可能非常令人困惑，正是这种复杂性才需要像 Consul 服务网格这样的技术。\n\n## 总结\n\
  \n恭喜！如果你能读完本章并忍受我糟糕的笑话，你就对 Consul 服务网格有了基础性的认识。服务网格的主题非常冗长，我真心希望这能为你开启这段混乱旅程提供一个不错的起点！我们讨论了（好吧，我写，你读）一些关于传统网络的内容，以及为什么服务网格在当今多云世界中是如此宝贵的工具。我们看到了网格是如何运作的，如何安全地连接服务，以及如何确保某些服务*不*进行连接。我们简要了解了如何使用网格原则连接数据中心，以及如何支持网格之外的服务。最后，我们对\
  \ Consul 在 Kubernetes 世界中如何运作有了一个非常高层级的认识。\n\n如果服务网格这个话题真的让你兴奋，我强烈建议你继续学习。HashiCorp\
  \ 有几个关于这个主题的教程，随着对网格需求的增长，已经产生了无数博客和视频。这个主题太广泛，一章无法涵盖，但我确实希望我能提供一些清晰的见解。接下来，我们将看看\
  \ Consul 如何通过自动化帮助我们减少或消除那些可恶的网络变更工单！\n"
- "## 7 动起来\n\n我们已经详细讨论了 Consul 集群对系统内部署的服务和应用程序及其相应健康状况的感知。为什么 Consul 要把所有这些信息留给自己？任何网络（无论是人的还是机器的）成功存在的一个重要部分是信息共享。在本章中，我们将探讨\
  \ Consul 能够将信息共享给第三方组件的一些方式，以便通过自动化改善我们的生活：\n\n- 键/值（KV）存储 —— Consul 利用分布式 KV 存储在\
  \ Consul 节点之间共享信息，但这也可以被人类和机器用来在整个集群中共享数据和指令。\n- 监视和处理器 —— 在第5章“小波比丢了她的服务”中，我们看到了\
  \ Consul 的监视和处理器如何发布服务状态的特定变化。在本章中，我们将看到这如何用于向第三方组件分发信息。\n- Consul 和 Terraform ——\
  \ 虽然这不是一本关于 Terraform 的书，但我们一直在使用它来创建和管理我们的基础设施。本章的最后一部分将展示 Consul 如何与 Terraform\
  \ 协同工作，基于 Consul 的应用程序和服务感知，自动化几乎任何基础设施组件。\n\n所以，无论本章标题让你想起奇点统治人类的恐惧，还是 Rush 乐队那首令人难以置信的歌曲的旋律，请和我一起踏上通往更智能、更自足的网络世界的旅程。\n\
  \n本章将涵盖以下主题：\n\n- 自动化的必要性\n- 使用 KV 存储进行分布式配置\n- 监视你的处理器\n- 与 Consul-Terraform-Sync\
  \ 一同畅游\n\n### 技术要求\n\n在本节中，我们将使用 Terraform 向**亚马逊网络服务（AWS）**部署一个完整的 Consul 集群。如果你已经完成了*第2章，架构\
  \ – 它是如何工作的？*，设置了你的 AWS 账户，下载了 Terraform，并克隆了代码仓库，那你就万事俱备了！\n\n在仓库的 `ch7` 文件夹中，我们有与\
  \ `ch2` 文件夹类似的结构，提供用于创建镜像的代码，当然还有创建 Consul 集群的代码。如果你想跟着操作，请使用 `ch7` 创建一个新的 Consul\
  \ 集群，其中包含一些你将在本章中使用的服务配置文件。\n\n### 自动化的必要性\n\n在信息技术领域，我们靠工单为生。谢天谢地，不是超速罚单或其他违法行为的罚单，而是请求和解决工作的方式。整个产品线和组织都建立在这些流程之上，并且理所当然。我有一位同事经常对一本叫*《凤凰项目》*的书赞不绝口。如果你没读过或听过这本书，我强烈推荐。整个虚构故事聚焦于\
  \ IT 的流程问题，技术可能一切都很好，但进行变更的*流程*往往决定任何项目的成败。\n\n当我们审视网络和安全设备时，遵循这套工单系统的重要性成倍增加。这不像订错虚拟机规格或操作系统。最微小的失误都可能扰乱整个组织，造成数百万美元的损失和收入流失。因此，对该设备的任何更改都需要在变更管理流程中正式请求、评估、测试和跟踪。你不必在这个领域工作，也能感受到\
  \ DNS 设置导致整个网络瘫痪、让孩子们无法参加虚拟课堂的挑战！\n\n### 使用键/值存储进行分布式配置\n\n正如我们所读到的，Consul 系统的基本协议之一是\
  \ gossip 协议，使系统内的每个 Consul agent 都能与所有其他 agent 共享信息。这些信息由 Consul 服务器集群集中存储和管理，但所有\
  \ agent（如果要求授权，则需正确授权）都可以访问这些数据。通过一个非常简单的 KV 接口，Consul 提供了向与系统交互的所有实体分发情报的能力。虽然这提供了一种非常简单的信息分发方式，但\
  \ Consul 并不是一个功能完备的分布式数据存储。KV 系统中的对象最大为 512 KB，并且数据仅保留在本地数据中心。然而，这并不妨碍我们用它来做一些非常酷的事情。\n\
  \n要了解应用 Consul KV 系统进行配置调整的好处，请考虑排查分布式应用程序的场景。毕竟，如今我们部署的几乎所有东西都由一组服务组成，而不是一个庞大的单体应用。当问题出现（它们总是会出现）时，我们会发现所需的日志数据只有在更高级别才可用。根据我过去做这件事的糟糕回忆，这个过程通常如下：\n\
  \n1. 获取需要调整的每台机器/组件的 IP 地址。\n2. 在我的机器上打开一堆终端窗口。\n3. SSH 进入第一台机器，通常使用团队中每个人都有的共享\
  \ PEM 密钥。\n4. 编辑配置文件以更改日志级别。\n5. 重新加载服务并检查日志，以确保服务以新的日志级别重新运行。\n6. 注销机器，继续执行列表中的下一台。\n\
  \n一旦调试会话结束，我们不得不回到机器中并还原我们所做的更改。Ansible、Puppet 或 Chef 等配置管理工具也可以帮助进行这些更改，但这些更改通常需要更新大量脚本，这会带来额外的风险。\n\
  \n\n\n\n\n与 Consul KV 系统交互非常简单。就像我们使用 Consul 的其他所有功能一样，我们可以利用命令行、API 或 Web 界面。键和值的路径表示为，嗯，就是一个路径，不像我们所熟知和喜爱的目录和文件结构那样。这不仅非常适合数据的组织，而且还便于基于逻辑路径的\
  \ API 调用，而所有这些调用都是基于 REST 的。我们将逐步介绍这些操作，如果你想跟随操作，所有用于创建镜像和 Consul 系统的代码都位于我们一直使用的\
  \ GitHub 仓库中。当然，本章有一个新的文件夹位于 `https://github.com/PacktPublishing/Consul-Up-and-Running/tree/main/ch7`。\n\
  \n我们可以使用之前构建的镜像，不过，此次新构建包含了一些额外的功能，我们将在本章后面的部分使用这些功能。因此，我建议你创建一个更新后的镜像（`$github_root/ch7/Image-Creation`），就像我们在前几章中所做的那样。\n\
  \n在我们的新 Consul 系统构建完成并准备就绪后，让我们在 KV 存储中创建几个值。我们将使用环境变量来确保我们命中不同的 Consul 节点，因此请密切关注。举例来说，我将引用以下\
  \ Terraform 输出：\n\n## Terraform output\n\n```\nOutputs:\n\n\nCONSUL_HTTP_ADDR =\
  \ \"http://3.128.180.154:8500\"\nCTS_IP = \"3.141.25.114\"\nConsul_Client_IPs =\
  \ [\n    \"18.117.222.65\",\n    \"3.17.161.19\",\n    \"18.222.124.50\",\n    \"\
  18.118.47.132\",\n]\nConsul_Server_IPs = [\n    \"18.222.216.65\",\n    \"3.128.180.154\"\
  ,\n    \"18.117.157.22\",\n]\n```\n\n```\n\"LockIndex\": 0,\n\"Key\": \"son/seventh/gift\"\
  ,\n\"Flags\": 0,\n\"Value\": \"Y2hxaXJ2b3lhbmN1\",\n\"CreateIndex\": 194,\n\"ModifyIndex\"\
  : 194\n}\n]\n```\n\n但等等，那个值不是我们输入的值！你是对的，这是我们在 Consul 的其他区域看到的 base64 编码值。这允许我们在\
  \ KV 存储的值中访问更复杂的数据。如果我们想在一个路径中返回多个值，我们可以在请求上设置递归标志：\n\n```\n$ curl http://18.222.124.50:8500/v1/kv/son/\\\
  ?recurse=TRUE | jq\n```\n\n让我们看一下作为此输出一部分提供的一些其他值：\n\n- **LockIndex** – 使用 Consul\
  \ Sessions，我们能够锁定 KV 存储中特定参数的访问权限，以防止意外覆盖或冲突。\n- **Key** – 这是从 KV 存储根目录到该键的完整路径。\n\
  - **Flags** – 默认值为 0，此参数提供将无符号整数分配给值条目的能力。该值对 Consul 来说是不透明的，但可能有助于为广泛的 KV 实现提供额外的信息（例如版本）。\n\
  - **Value** – 这是键的值，已编码为 base64。\n- **CreateIndex** – 这里我们有一个数值，提供有关该值相对于其他键或更新的创建时间的一些信息。\n\
  - **ModifyIndex** – 这是输出中值得关注的一个值，因为智能状态机可以确定该值自上次查询以来是否已更改。\n\n此信息始终通过 API 返回，不过，如果你想在命令行输出中看到此详细信息，我们可以使用\
  \ `detailed` 标志：\n\n|  |  |\n|---|---|\n| `$ consul kv get -detailed son/seventh/gift`\
  \ |  |\n| CreateIndex | 194 |\n| Flags | 0 |\n| Key | son/seventh/gift |\n| LockIndex\
  \ | 0 |\n| ModifyIndex | 327 |\n| Session | - |\n| Value | `clairvoyance2` |\n\n\
  请注意，我更新了该值，并且 ModifyIndex 参数识别了这一更改。\n\n我们在这里应该注意，将密码和敏感信息写入存储可能不是最好的主意。对于密钥管理，我们确实应该利用世界级的密钥管理器，例如\
  \ HashiCorp Vault。话虽如此，可能仍有一些信息写入此存储，需要一定程度的访问控制。回想一下，通过我们的 ACL 系统，我们能够保护 Consul\
  \ 中的路径和功能。通过将我们的 ACL 系统与 KV 存储结合，我们可以为每个应用程序创建一个分布式存储系统，并确保只有该应用程序（使用正确的 ACL 令牌）可以访问数据存储。\n\
  \n太棒了！使用 Consul 中的 KV 存储，我们可以将各种信息写入存储，并使其可供特定数据消费者或应用程序使用。*但 Rob，我的应用程序对 Consul\
  \ API 或命令行一无所知，如果你认为我们会为此调整我们的开发路径，你就疯了。* 好吧，你是对的，我疯了，但这与 Consul 无关。让我向你介绍 Consul\
  \ Template。\n\n## Consul Template\n\nConsul Template 的应用可能是我最喜欢的 Consul 功能之一了。然而，它并不仅限于\
  \ Consul，因为 Vault 实现也可以利用相同的功能。有了 Consul Template，配置文件可以直接由 Consul 填充，使用参数，就像它是一个模板一样。我想你大概已经猜到了。\n\
  \nConsul Template 的功能并未嵌入 Consul 本身，因此必须作为其自己的服务下载并执行。二进制文件（`consul-template`）可在\
  \ HashiCorp 发布网站上获得，如果你想自己下载它，不过，当我们为本章构建新镜像时，Consul Template 二进制文件的安装是该过程的一部分（`https://releases.hashicorp.com/consul-template/`）。\n\
  \n此外，作为此次构建的一部分，我创建了一个非常简单的模板文件并将其放在 `/tmp` 目录中。此模板文件是一个非常简单的文本文件，并利用了我们在 KV 存储中填充的信息，该信息标识了七个儿子中的第七个儿子的天赋：\n\
  \n### SeventhSon.tpl\n\n```\nSeventh Son of a Seventh Son is a story about a young\
  \ boy born\nwith the gift of {{ key \"/son/seventh/gift\" }}. It has been\npopularized\
  \ in literary form by Orson Scott Card, and musically\nby Iron Maiden through their\
  \ epic album of the same title.\n```\n\n在模板中，我们可以看到 Consul 被指示插入 `son/seventh/gift`\
  \ 键的值。\n\n为了利用模板并创建文件，可以手动运行 consul-template。然而，我们正试图通过 Consul 的智能尽可能自动化。为什么我们现在要诉诸手动操作呢？因此，与其手动运行\
  \ consul-template，我们在创建基础设施时执行的 `remote-exec` 操作的一部分中将其作为后台操作启动：\n\n```\nnohup sudo\
  \ consul-template -consul-addr=\\\"${self.private_ip}\\\"\n-template \\\"/tmp/SeventhSon.tpl:/etc/consul/seventh_son.txt\\\
  \",\n```\n\n此命令实例化 consul-template 应用程序，标识用于连接到 Consul 服务的 IP 地址。对于我们的基础设施，consul-template\
  \ 函数在与 Consul 相同的机器上运行，但它可以位于其他地方并仍然使用 Consul 的数据。我们告诉 consul-template 加载模板文件 `tmp/SeventhSon.tpl`\
  \ 并使用该模板创建一个新的文本文件（`/etc/consul/seventh_son.txt`）。由于应用程序在后台运行，consul-template 将监控已标识键的值，并在该值更改时更新目标文件。我们可以在自己的小环境中尝试一下。\n\
  \n如果你一直跟着做，你已经为 `son/seventh/gift` 键设置了 `clairvoyance` 值。如果 consul-template 按设计工作，我们应该已经创建了文件。要验证对可用客户端之一的\
  \ SSH，请执行以下命令：\n\n```\n$ cat /etc/consul/seventh_son.txt\n```\n\n我们应该会看到按模板指定的文本显示，其中插入了值\
  \ `clairvoyance`：\n\n```\nSeventh Son of a Seventh Son is a story about a young\
  \ boy born\nwith the gift of clairvoyance. It has been popularized in\nliterary\
  \ form by Orson Scott Card, and musically by Iron Maiden\nthrough their epic album\
  \ of the same title.\n```\n\n让我们看看当我们更改值时该文件会发生什么。更新 `son/seventh/gift` 键的值。随意通过我们之前练习的任何方法来完成。更新值后，再次检查\
  \ `seventh_son.txt` 文件，看看你的更新值是否已反映出来。现在，我们可以想象这个简单的文本文件是应用程序的配置文件。我们的模板可以根据需要在管理大量配置文件方面一样全面，所有这些都由\
  \ Consul KV 存储中的值动态管理并自动更新！\n\n如果你因兴奋而神经元活跃，请继续保持！Consul Template 可以做的事情远不止我们在这里涵盖的范围。项目的完整文档和源代码也可在\
  \ GitHub 上获得，网址为 https://github.com/hashicorp/consul-template。\n\n既然我们已经介绍了 KV 存储的使用以及\
  \ Consul Template 的使用，让我们继续并查看如何利用 Consul 监视和处理程序作为自动化第三方组件配置的另一种方法。\n\n## Watching\
  \ your handlers\n\n早在 *Chapter 5, Little Bo Peep Lost Her Service* 中，小波比牧羊女丢失了她的服务，我们就触及了\
  \ Consul 监视和处理程序的功能。回想一下，Consul **watch** 会观察 Consul 中任意数量的参数，并基于值更改，可以执行 **handler**\
  \ 来执行某些功能。在 *Chapter 5, Little Bo Peep Lost Her Service* 中，我们专注于能够监视服务的状态，以便通知第三方有关服务健康状况。我们可以使用相同的功能，但不是监视服务状态，而是监视\
  \ KV 存储中参数的状态。\n\n例如，如果我们想监视我们的键，使用直接命令行，我们将执行以下操作：\n\n```\n$ consul watch -type=key\
  \ -key=son/seventh/gift\n{\n    \"Key\": \"son/seventh/gift\",\n    \"CreateIndex\"\
  : 194,\n```\n\n\n\n```json\n\"ModifyIndex\": 237,\n\"LockIndex\": 0,\n\"Flags\"\
  : 0,\n\"Value\": \"Y2hxaXJ2b3lhbmN1\",\n\"Session\": \"\"\n}\n```\n\n我们可以看到，该命令的输出为我们提供了与之前读取\
  \ key 值时从 API 获取的几乎相同的输出。然而，我们并不是在谈论手动操作；我们想要……跟我一起说……自动化！\n\n在 Consul agent 配置中，我们可以定义希望在平台上运行的\
  \ watches 以及一个 handler。handler 根据 watch 的结果执行某些功能，可以调用 HTTP 接口或执行自定义脚本。因此，随着被监视\
  \ key 的值发生变化，Consul 将执行该 handler 以主动通知某个设备。例如，将以下 watch 部分添加到 agent 配置中将导致执行 update_configs.sh\
  \ 脚本：\n\n### Sample watches configuration\n\n```hcl\nwatches = [\n    {\n      \
  \  type = \"key\"\n        key = \"son/seventh/gift\"\n        handler_type = \"\
  script\"\n        args = [\"/etc/consul/updates_configs.sh\"]\n    }\n]\n```\n\n\
  这个特定的 watch 特别关注一个特定的 key，不过请记住，我们可以使用 keyprefix 定义一个 watch，从而监视 Consul KV 存储中整个路径。这使我们能够为特定配置创建多个\
  \ key，并且当其中任何一个 key 发生变化时，watch 将执行 handler 并执行所需的操作。\n\n正如我希望你能看到的，Consul watches\
  \ 和 handlers 在动态调整组件配置方面所能实现的强大功能是相当巨大的。我们现在已经看到了多种利用 Consul KV 存储更新配置的方法。应用程序可以通过使用\
  \ API 的 pull 方法接收更新的配置值。我们可以利用 consul-template 函数自动调整配置文件。当然，我们也可以将 KV 信息推送到几乎任何可以通过脚本或\
  \ HTTP 接口控制的系统。接下来，我们将研究如何超越 KV 并利用 Consul 通过 Terraform 动态调整我们的基础设施组件！\n\n## Floating\
  \ with consul-terraform-sync\n\n在本书中，我们一直在研究 Consul 如何帮助我们发现和连接服务，重点关注更高级别的连接性（记住那个模型，工作在第\
  \ 4 层或以上）。虽然这正是我们服务到服务通信所需的，但整个网络世界仍然依赖 IP 地址来发现、路由和保护我们的系统这一事实并未消失。防火墙和负载均衡器仍然存在，主要基于地址运行，管理进入或离开我们受管网络的流量。这通常被称为\
  \ North/South 流量。历史上，这些组件会依赖无数健康检查来验证服务可用性，或庞大的配置文件，其中一个简单的拼写错误就可能导致整个网络瘫痪。因此，出于这些原因，由容易出错的人手工更改负载均衡和防火墙组件需要仔细审查。如果只有某种方法可以自动发现并以自动化且可追踪的方式实现对这些组件的更新呢？\n\
  \n我们已经熟悉一个用于管理基础设施的令人难以置信的工具 Terraform，我们在本书中构建和管理自己的基础设施时一直在使用它。通过使用 Terraform\
  \ OSS 二进制文件，我们一直在创建和销毁为我们的学习所需的 Consul 系统。如果你不熟悉 Terraform，它可以做更多的事情。在撰写本文时，Terraform\
  \ 提供了超过 1,100 个基础设施提供商的支持集成。这包括大型云厂商以及监控组件、负载均衡器、防火墙、内容分发系统、域名系统等等。对于自动化，许多组织将 Terraform\
  \ 与流水线流程集成，然而，我们将研究如何利用 Consul 提供的海量数据来自动化 Terraform 基础设施调整。\n\n> **Important note**\n\
  >\n> 直到本章的这一点，我们的大部分讨论都围绕着在服务之间创建和共享配置参数。Consul 与 Terraform 的集成极大地扩展了该功能，因此作为变更控制流程的一部分也需要额外的审查。虽然我们的工作这里集中在\
  \ Consul 和 Terraform 的开源版本上，但企业集成使能够采用细粒度策略来指定自动化可以更改什么、不能更改什么，以及什么需要额外级别的批准。此外，Terraform\
  \ Enterprise 在整个过程中记录状态更改，提供任何自动化或已批准更改的历史记录。\n\n与 **consul-template** 类似，HashiCorp\
  \ 提供了一个额外的独立二进制应用程序，称为 **Consul-Terraform-Sync**。为简单起见，我将继续称 Consul-Terraform-Sync\
  \ 为 CTS。利用 CTS，Consul 监控服务目录中的更改，并基于这些更改，向 Terraform 发出请求以相应地调整基础设施：\n\n![](img/52479dafaefba00517c48a137e037b7e_207_0.png)\n\
  \nFigure 7.2 – CTS managed infrastructure\n\n作为当前部署的一部分，我们已为 CTS 创建了一台专用机器，其 IP\
  \ 地址由 `terraform output` 中的变量 `CTS_IP` 提供。如果找不到 Terraform 运行的输出，也没问题。运行 `terraform\
  \ output` 将再次为你提供所有必要的数据。所以，让我们获取该 IP 地址并 SSH 进入 CTS 机器：\n\n```bash\n$ ssh -i <username>-consul-key.pem\
  \ ubuntu@<CTS_IP>\n```\n\n当我们为本章构建基础设施时，创建了一个新目录来保存我们的 CTS 配置文件。让我们查看一下该配置文件：\n\n\
  ### cts-config.hcl\n\n```hcl\nlog_level = \"INFO\"\nport = 8558\nsyslog {}\nbuffer_period\
  \ {\n  enabled = true\n  min = \"5s\"\n  max = \"20s\"\n}\nconsul {\n  address =\
  \ \"192.168.100.65:8500\"\n}\ndriver \"terraform\" {\n  log = false\n  persist_log\
  \ = false\n  working_dir = \"\"\n  backend \"consul\" {\n    gzip = true\n  }\n\
  }\ntask {\n  name        = \"find-httpd-nodes\"\n  description = \"Example task\
  \ with two services\"\n  source      = \"findkim/print/cts\"\n  version     = \"\
  0.1.0\"\n  services    = [\"httpd\"]\n}\nservice {\n  name = \"httpd\"\n  tag =\
  \ \"python-server\"\n  # namespace = \"service-namespace\"\n  # datacenter = \"\
  dc1\"\n  description = \"Filter for httpd services that have the python-server tag\"\
  \n}\n```\n\n我们在此配置中有几个部分，让我们一次一个地来看。\n\n前八行描述了 CTS 应用的通用参数。log_level、port 和 syslog\
  \ 部分应该很容易理解，但这个 buffer 是什么？\n\n我们在自动化此类更改时发现的一个挑战是，当存在任何不稳定性时，该不稳定性可能会产生连锁反应。作为人类，我们有时会花时间对情况做出反应，而到我们能够反应时，情况已经发生了变化。当然，我说有时是因为并非总是如此，我们都知道当我们不花时间时，问题就会发生。机器通常没有这种延迟问题。实际上，我们与机器和软件的问题通常恰恰相反，即应用程序响应太快，导致来回波动。我们的\
  \ buffer 配置有助于管理这种波动，并确保在进行调整之前有一定时间等待系统达到稳定状态。\n\n下一个部分在 consul 配置块中标识了 Consul\
  \ 相关配置参数；本质上告诉 CTS 它可以在哪里找到 Consul 服务。这里我们只有 address，然而，任何证书或令牌都将在此区域说明。正如我们已经看到的\
  \ ACL 和令牌可以有多细粒度，我们希望确保 CTS 服务使用的是具有读取服务目录访问权限的令牌。\n\n我们知道 CTS 需要连接到 Terraform 才能启动基础设施更改。可选地，terraform\
  \ 配置块可以指定要使用的预下载 Terraform 二进制文件和路径。然而，如果没有此指定，CTS 将下载 Terraform 二进制文件（遵循版本规范（如果包含））并将该二进制文件保存在\
  \ CTS 工作目录中。对 Terraform 操作的日志记录以及 Terraform 后端配置应特别注意。\n\n在处理期间，Terraform 可以记录与所管理基础设施组件的交互。此日志输出可能包含敏感信息，如果存储在运行\
  \ CTS 的机器上，可能会带来安全问题。因此，除非你正在调试，否则建议不要记录 Terraform 交互。Terraform 状态中也会记录相同的敏感信息，而这不是可选的。Terraform\
  \ 利用该状态文件来了解所管理基础设施的当前状态，并评估需要哪些更改。\n\n\n\n\n那么，我们该如何处理这个不祥的状态文件呢？好吧，在本章的第一部分，我们谈到了分布式\
  \ Consul KV 存储可用的功能。只要我们能将该状态文件保持在可管理的大小，少于 512 KB，我们就可以将该状态文件保存在 Consul KV 存储中。这实际上就是我们在\
  \ terraform 块内的后端配置子块中所做的操作。这不仅为我们提供了一个可以使用 ACL 保护的分布式存储位置，还提供了对状态文件更改的指示（还记得 KV\
  \ 响应中的 ModifyIndex 值吗）。这要求我们保持状态相对简单，但我们无论如何都应该这样做，将用于 CTS 的 Terraform 脚本仅聚焦于我们需要管理的特定基础设施。例如，如果我有\
  \ 10 台虚拟机、一个 Kubernetes 集群和一个负载均衡器，我应该只将负载均衡器的基础设施代码作为 CTS 的一部分包含在内。\n\n所有这些关于状态和\
  \ Terraform 配置的讨论可能看起来过分，但这里的细节不容低估。总结一下，仅将我们的 Terraform 代码聚焦于服务目录导致更改所需的内容，可以实现以下目标：\n\
  \n- 利用 Consul KV 存储实现集中且受保护的存储 – 我们已经可以使用 Consul，为什么不将其用于此目的呢？\n- 状态文件中的敏感信息保持在最低限度，仅与\
  \ CTS 管理的基础设施相关。\n- 通过 CTS 启动的更改更快。对于由于大型基础设施定义而导致的大型状态文件，Terraform 处理更改所需的时间会更长。\n\
  \n我们接下来要处理的块是 task 块。现在我们终于可以定义我们希望 CTS 实际做什么了！task 块标识了将作为服务目录更改结果而执行的 Terraform\
  \ 模块。对于我们的目的，该模块非常简单，只打印出服务节点和相关信息。然而，Terraform 模块可以在基础设施管理的范围内做几乎任何事情！Terraform\
  \ 模块可以类比为应用程序中的一个函数，为一个特定目的而构建。一些模块可能相当庞大（例如创建整个生产 HashiCorp Vault 系统），但我们已经看到我们希望保持\
  \ Terraform 操作的聚焦。因此，我们希望使用非常具体的模块，例如在负载均衡器中填充客户端节点。Terraform 仓库，https://registry.terraform.io/，提供了大量可供查阅的示例模块。\n\
  \n由于这是我们第一次运行 CTS，几项操作将在后台发生。首先，CTS 将为 Terraform 状态文件准备 Consul 后端。我们也可以在 Consul\
  \ 系统 KV 存储中看到这一点：\n\n![](img/52479dafaefba00517c48a137e037b7e_212_0.png)\n**图 7.3\
  \ – KV 存储中的 CTS**\n\n在 CTS 的文件夹中，我们可以看到，如图 7.4 所示，我们有一个特定于已配置的 `find-httpd-nodes`\
  \ 任务的状态文件。请注意，每个任务，因此每个模块，都会创建自己的状态文件，并将这些文件存储在此处 Consul 中：\n\n![](img/52479dafaefba00517c48a137e037b7e_212_1.png)\n\
  **图 7.4 – 任务状态文件存储**\n\n如果我们查看我们的目录，我们还可以看到 CTS 已为我们下载了 Terraform 二进制文件，但我们也拥有这个名为\
  \ `sync-tasks` 的文件夹。这里就是魔法的发生之处。\n\n![](img/52479dafaefba00517c48a137e037b7e_213_0.png)\n\
  **图 7.5 – CTS 创建的内容**\n\n在 `sync-tasks` 文件夹中，我们将为 CTS 被命令的每个任务拥有一个文件夹。对于我们来说，我们只有\
  \ `find-httpd-nodes`，这是我们任务的名称。在该文件夹中，我们有一堆 Terraform 代码！更重要的是，我们有一个 `terraform.tfvars.tmpl`\
  \ 文件。如果你观察该文件，你会发现它看起来很像一个 Consul Template 文件。如果你继续使用 HashiCorp 产品，请习惯这些模板文件。它们非常有用，并且无处不在！\n\
  \n当 CTS 运行 时，该模板文件用于创建一个新的 `terraform.tfvars` 文件，即实际保存用于 Terraform 代码的变量的文件。到目前为止，我们所做的只是一个检查操作；基本上，使用\
  \ CTS 的一个任务来查看它会做什么，但实际上并不执行它。这些由 CTS 创建的变量被输入到随后用于相应调整基础设施的 Terraform 代码中。\n\n\
  现在我们运行了命令，我们可以看到我们的 `httpd.txt` 文件已被创建。该文件是在任务的目录中创建的，我们可以通过发出以下命令查看结果：\n\n```\n\
  $ cat /home/ubuntu/sync-tasks/find-httpd-nodes/httpd.txt\n```\n\n现在我们拥有了运行 httpd\
  \ 服务的所有四个节点，以文本文件形式提供。这本身并不令人兴奋，直到我们看到使之特别的不是文件本身；而是它是用 Terraform 创建的！现在几乎可以在 Terraform\
  \ 模块中执行的任何操作，都可以使用 Consul 提供的服务目录信息自动执行！当我们将服务作为守护进程运行（不是恶魔）时，CTS 将持续监控服务目录中 httpd\
  \ 的更改，并利用 Terraform 相应地更新基础设施。\n\n## 总结\n\n让我们回顾一下我们在这里做了什么。Consul 系统有潜力保存有关您网络中服务的丰富信息。那信息就是力量！当然，这是安全连接的力量，但我希望通过本章，你已经看到\
  \ Consul 的力量可以远远超出其 gossip 角落的象征性围墙。我们已经看到 KV 系统如何用于存储和分发配置信息。我们学习了如何构建 Consul 监视，以使服务更改通知其他组件进行配置管理。最后，我们看到了\
  \ Consul 如何与 Terraform 互操作，使用 Consul-Terraform-Sync 能力，基于 Consul 的服务知识虚拟调整任何基础设施。现在是时候坐下来，拿起你喜欢的饮品，梦想\
  \ Consul 能为你做的一切！\n\n## 8 我们接下来去哪里？\n\n我想用最后一章来结束本书，希望能将你进一步推向利用 Consul 系统进行服务发现、服务网格和自动化的世界。这本书只是个开始，我希望它既有趣又富有信息量。\n\
