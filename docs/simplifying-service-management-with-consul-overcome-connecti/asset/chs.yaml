  \ 会用与该 `instance` 标签匹配的服务器来填充这个值。\n\n\n\n\n\n+   4. 与客户端配置类似，我们正在配置要绑定的地址（`bind_addr`）、要通告的地址（`advertise_addr`）以及我们希望被识别为的地址（`client_addr`）。我们使用的是在配置过程中设置的主机元数据来配置这些值——这是\
  \ Terraform 和 AWS 的另一个不错的功能。\n+   5. 最后，我们启用了 Consul 的 Web UI。默认情况下 Web 界面不可用，但我们在全书中偶尔会使用它。\n\
