  在该 CSV 文件中，你会找到你的 **用户名**、**访问密钥 ID** 和 **秘密访问密钥**。是的——里面还有其他一些内容，但那些不那么有用。我在这里提供了一个\
  \ CSV 文件的示例视图：\n\n| 用户名 | 密码 | 访问密钥 ID | 秘密访问密钥 | 控制台登录链接 |\n| h.abiff |  | AKIA26CFBA32D6JFVJJB\
  \ | NYaSFhAzZqQq4bqSGIda/Y22Guc3pB2WCA8R9jVj | https://751764047604.signin.aws.amazon.com/console\
  \ |\n\n图 2.7 – 访问凭证 CSV 文件内容\n\n是的——我明白我刚刚通过分享我的凭证把自己暴露给了阅读这本书的任何人，而我说过你绝不应该这样做。不过，我刚刚吊销了那些凭证，所以连编辑都没有机会！\n\
  \n现在，我们可以选择如何处理这些数据，即使我们不把它发布到 InstaFace 上。为了在 Terraform 中使用这些凭证，我们需要用它们的内容创建环境变量。我们现在将看到一些示例，以图\
  \ 2.7 中显示的凭证为例。\n\n> **注意**\n> 这些凭证也可以保存在 Terraform 直接使用的文件中；然而，这有时会导致凭证被共享或无意中分发。然后，在你意识到之前，你就收到了一张巨额云计算账单，却没有任何比特币可以展示！\n\
  \n一种选择是手动将凭证值复制并粘贴到 export 语句中，如下所示：\n\n```\n$ export AWS_ACCESS_KEY_ID=AKIA26CFBA32D6JFVJJB\n\
  ```\n\n```\n$ export AWS_SECRET_ACCESS_KEY=NYaSFhAzZqQq4bqSGJda/Y22Guc...\n```\n\
  \n或者，我们可以使用一些 Bash 工具创建环境变量（假设你与下载的文件在同一目录中），如下所示：\n\n```\n$ export AWS_ACCESS_KEY_ID=$(tail\
  \ -n 1 new_user_credentials.csv | awk -F ',' '{print $3}')\n```\n\n```\n$ export\
  \ AWS_SECRET_ACCESS_KEY=$(tail -n 1 new_user_credentials.csv | awk -F ',' '{print\
  \ $4}')\n```\n\n如果你能够验证环境中的值与凭证文件中的值相同，你就知道做对了。你可以使用以下命令进行验证：\n\n```\n$ env | grep\
  \ AWS\n```\n\n```\nAWS_ACCESS_KEY_ID=AKIA26CFBA32D6JFVJJB\n```\n\n```\nAWS_SECRET_ACCESS_KEY=NYaSFhAzZqOq4bqSGJda/Y22Guc3p...\n\
  ```\n\n另外，如果你使用的是 Terraform Cloud，你可以将它们作为工作区的环境变量输入，如下面的屏幕截图所示。但是，请记住，我们将主要使用 **命令行界面（CLI）**\
  \ 进行工作，所以除非你熟悉 Terraform 远程后端，否则建议直接使用 Terraform CLI：\n\n![](img/52479dafaefba00517c48a137e037b7e_40_0.png)\n\
  \n图 2.8 – Terraform Cloud 环境变量\n\n是的！所有这些工作只是为了确保你有足够的凭证，并且它们位于正确的位置。\n\n## 安装 Terraform\
  \ 和 Packer\n\n我们快到了……你能感觉到吗？请务必在这里仔细跟着做。我们将使用 Packer 为我们的项目创建基础镜像，并使用 Terraform\
  \ 创建基础设施。\n\n要安装 Terraform，首先从 Terraform 下载页面 `https://www.terraform.io/downloads.html`\
  \ 下载适合你操作系统的 ZIP 文件。\n\n要安装 Packer，首先从 Packer 下载页面 `https://www.packer.io/downloads`\
  \ 下载适合你操作系统的 ZIP 文件。\n\n作为参考，本书中的材料是使用 Terraform 0.14.8 版本和 Packer 1.7 版本创建的。\n\n\
  记住文件保存的位置，下载完成后，解压缩这些文件。你将得到一个 `terraform` 可执行文件和一个 `packer` 可执行文件，你需要将它们保存到一个合适的“家”中，并确保这个“家”在你的命令行路径中。\n\
  \n就是这样！现在，你可能会问：Rob，*如果下载和使用 Terraform 这么简单，为什么不是每个人都在用呢？* 这是一个非常好的问题，我亲爱的读者……*一个非常好的问题。*\n\
  \n## 什么是集群！\n\n如果你刚刚设置了 AWS 账户并安装了 Terraform，我可以想象你正迫不及待地想要启动一个集群。别担心——正如 Robert\
  \ Plant 常说的，*你的时机终将到来。* 首先，我们将更深入地研究 Consul 集群操作本身所采用的机制。我之前可能提到过，Consul 的核心应用之一是促进并实现网络中所有服务之间更简单、更安全的通信机制。如果\
  \ Consul 无法掌控其内部通信，它永远无法实现外部通信。因此，让我们来看看整个 Consul 集群（包括服务器和客户端）中的通信机制和流程。\n\n从服务器开始，它们需要共享和通信的基本信息是什么？以下是必需的内容：\n\
  \n- 1. 领导者选举——毕竟，没有领导者，就会陷入无政府状态，服务将在街头燃烧。\n- 2. 客户端注册——服务器显然需要知道客户端何时加入集群。\n- 3.\
  \ 服务状态和位置——服务器需要知道集群中部署的每个服务的状态及其位置。\n\n为了选举领导者，服务器节点必须达成共识。它们使用一种称为——嗯——**共识**的协议来做到这一点。我们将在接下来的章节中更详细地研究这个协议，但本质上发生的情况是，当服务器节点启动时，会进行一次选举。如果服务器没有收到有人站出来成为领导者的通知，它就会选举自己。如果其他人先选举了自己，那么该服务器就会投票给最初的领导者。最终，所有服务器将达成\
  \ *共识*，并产生一个无可争议的领导者。同样，我们将在后面的章节中更详细地了解这是如何工作的，并讨论潜在的问题。\n\n\n\n\n已部署服务的状态及其位置不仅是服务器需要的信息，也是分布在整个网络中的客户端需要的信息。现在，这种级别的通信并不是什么新鲜事，对吧？在几乎任何分布式系统中，服务器需要了解客户端的状况，以及客户端在几乎任何分布式系统中的作用。然而，随着这些系统的扩展，最终会有成百上千甚至上万个客户端同时尝试与服务器通信。最终，服务器领导者将敲响法槌，要求法庭保持秩序！不过，在\
  \ Consul 中，服务器和客户端都使用一种名为——嗯——**gossip** 的协议相互传播信息。这些协议名称背后的想象力真是令人惊叹。利用 gossip\
  \ 协议，客户端与相邻客户端共享关于自身服务和状态的信息，而服务器则在一旁监听。你可以在*图 2.9*中看到此过程的概览：\n\n![](img/52479dafaefba00517c48a137e037b7e_42_0.png)\n\
  \n那么，既然我们让所有人都开始交谈，他们到底在谈些什么？我也想知道！别把我排除在外！为了勉强保持某种重点，我们将先讨论服务器的角色，然后再讨论客户端。\n\n\
  好了——既然我们基本了解了大型集群内部发生的情况，让我们更深入地研究一下促成这一切的协议！\n\n## Raft 共识\n\n我们已经看到 Consul 服务器如何利用**共识**协议选举领导者，但这到底意味着什么？这就是它们的全部工作吗？嗯，当然不止；否则这一节就会非常简短。Consul\
  \ 使用的共识协议基于 Raft 算法（https://raft.github.io/raft.pdf），而 Raft 又基于 Paxos（https://en.wikipedia.org/wiki/Paxos_%28computer_science%29）。如果你觉得我们正在迅速陷入兔子洞，别担心——我们不会一直挖到水为止。\n\
  \n## 深入探讨领导者选举\n\n你很快就会看到，一个 Consul 服务器会与若干其他服务器一起配置，并与它们组成 Raft。这在配置中被称为 `bootstrap_expect`\
  \ 值。记住这个服务器数量很重要，因为它稍后还会出现。当然，如果一个 Consul 服务器期望与若干服务器组成 Raft，它需要知道它们，因此这些信息也会被配置。为了成为领导者，服务器需要获得\
  \ Raft 中大多数服务器的选举——例如，如果你期望 Raft 中有五台服务器，你至少需要三台投票给你。这被称为法定人数，对于服务器集群的可用性来说是一个关键概念。就像我们参加的许多会议一样，如果没有法定人数的成员，你就无法真正做出任何决定。在某些会议上，即使有法定人数，如果没有领导，你也无法做出任何决定！如果你不确定需要多少台服务器才能达到法定人数，请参考以下公式：\n\
  \n(服务器数量)/2 + 1 = 法定人数\n\n如果服务器数量等于法定人数规模，那么集群就没有保护机制。当然，你不可能有半台服务器，所以如果结果有小数，直接向下取整。图\
  \ 2.11 中的表格也许也有帮助：\n\n| 服务器数量 | 法定人数 | 故障容忍度 |\n|---|---|---|\n| 1 | 1 | 0 |\n|\
  \ 2 | 2 | 0 |\n| 3 | 2 | 1 |\n| 4 | 3 | 1 |\n| 5 | 3 | 2 |\n| 6 | 3 | 2 |\n| 7 |\
  \ 4 | 3 |\n\n图 2.11 – 法定人数不容有失\n\n那么，让我们来看看选举是如何进行的。如果你想看这个过程非常酷的动画演示，下面这个网站很棒：http://thesecretlivesofdata.com/raft/。\n\
  \n我们以三台服务器为例来走一遍选举：**Bart**、**Lisa** 和 **Maggie**。**Bart** 是第一台“觉醒”的服务器，因此他提名自己为*候选人*，并向\
  \ **Lisa** 和 **Maggie** 发送请求，希望能成为*领导者*。然而，在 **Lisa** 听到 **Bart** 的请求之前，她已经向 **Bart**\
  \ 和 **Maggie** 发送了自己的候选人提名及领导者请求，因为我们都知道 **Lisa** 更聪明。\n\n你可以在图 2.12 中看到该过程的概览：\n\
  \n![](img/52479dafaefba00517c48a137e037b7e_45_0.png)\n\n图 2.12 – Lisa 的选举提名\n\n\
  太棒了——我们的集群现在有了领导者！然而，服务器领导者的选举只是 Consul 实际使用共识协议的目的之一——毕竟，如果一个领导者不分享它学到的信息，那它还算什么领导者呢？\n\
  \n> **注意**\n> \n> 虽然这个过程只有三台服务器时可以非常迅速，但它只能容忍一台 Consul 服务器的故障。你可能会想：*哇，那我就塞进 12\
  \ 台服务器，总该没问题了吧！* 但凡事有取舍——随着 Raft 中服务器数量的增加，达到法定人数所需的时间也会增加。这不仅影响领导者选举，还影响数据一致性。通常，建议将服务器对等集保持在五到七台之间。\n\
  \n## 服务器对等集中的数据共享\n\n现在 **Lisa** 已成为无可争议的领导者，她负责维护与 **Bart** 和 **Maggie** 共享的信息。这些信息通过\
  \ **Lisa** 写入的日志条目进行记录和共享。这些日志条目包含了服务目录和领导者选举过程的状态，以及服务器对等集运作所需的一切。是时候开始剥洋葱了，但我希望它不会让你流泪。\n\
  \n在对等集内，任何服务器都可以接收来自客户端的信息，并将这些信息共享给领导者。这些信息可能包含直接节点上服务状态的变更，甚至对集群内其他节点的更新。只有领导者才能更新日志条目；然而，仅仅因为领导者\
  \ **Lisa** 知道了服务目录或其他组件的某些调整，并不意味着 **Maggie** 或 **Bart** 也拥有相同的信息。这时我们的法定人数概念再次派上用场。正如*群体思维*一样，对等集中最少数量的服务器需要就当前时间点的现实情况达成一致。因此，当\
  \ **Lisa** 对日志文件写入更新时，她会将更新同时发送给 **Bart** 和 **Maggie**。直到 **Bart** 或 **Maggie**\
  \ 确认他们已应用相应的日志条目且日志已被正确*复制*，该条目才被视为已*提交*。然而，一旦 **Lisa** 获得确认，并且服务器对等集中至少有一个其他成员（记住——共有三个成员，所以我们需要两个才能达到法定人数），我们就可以认为该日志条目已提交，并且我们对现实有了新的视角。\n\
  \n所有这些交换都利用了远程过程调用（RPC）和共识机制，如图 2.15 所示。\n\n![](img/52479dafaefba00517c48a137e037b7e_48_0.png)\n\
  \n图 2.15 – 对等集中的共识与 RPC 连接\n\n我知道你可能会想：好吧，Rob，但是如果日志变得太大怎么办？这是一个合理的担忧，可以通过服务器对等集中的公共有限状态机（FSM）来管理。当日志在服务器之间复制和提交时，FSM\
  \ 会更新为当前状态。当对 Consul 服务器对等集发起查询时，领导者会根据 FSM 的状态响应查询。Consul 的结构使得任何一组日志的重放都会产生完全相同的状态。哇——如果人类也能如此可预测，那该多好啊！然而，正是这种状态的创建和维护，使\
  \ Consul 能够定期对日志条目进行快照，以管理复制日志的大小。这种快照不会中断 Consul 服务，并确保对等集的长期稳定。\n\n## 传播流言的 Serf\n\
  \n既然我们对服务器对等集的建立和运作有了更多了解，让我们更深入地看看大家都在传播什么。再次，如果我们开始解析 gossip 协议的来源，它使用 Serf（https://www.serf.io/）库，该库基于可扩展的弱一致感染式进程组成员协议，幸运的是它被缩写为\
  \ SWIM（http://www.cs.cornell.edu/info/projects/pringlass/public_pdfs/swim.pdf）。我们从\
  \ Raft 上跳下来，去游泳了！\n\n\n\n请看以下示意图：\n\n![](img/52479dafaefba00517c48a137e037b7e_49_0.png)\n\
  \n图 2.16 – Gossip 连接\n\nConsul 集群中的所有成员，无论是服务器还是客户端，都处于同一个“池子”中。这样可以实现对池中所有成员的分布式发现、它们的状态，当然，还包括注册到\
  \ Consul 客户端的任何服务的状态。虽然 gossip 是让所有代理了解集群成员和服务变更的方式，但所有信息仍然是通过直接 RPC 从代理发送到服务器节点的。请记住，peer\
  \ 集合中的任何服务器都可以接收更新，并将其转发给领导者，以便进行法定人数提交和对状态机的更新。\n\n## 纬度的变化\n\n我们已经了解了 Consul 如何在集群内共享有关领导者选举、服务可用性变化和节点可用性变化的信息。除了这些项目之外，Consul\
  \ 始终知道集群中每个节点相对于其他节点的地理位置。这有助于做出智能决策，例如定位离请求实体最近的可用的服务实例。发现机制利用了 Serf 库提供的网络断层扫描技术。没错——它们不仅互相\
  \ gossip 彼此的状态，还知道彼此的位置！奇点即将来临！\n\n## 建立我们的第一个 Consul 集群\n\n关键时刻到了！在本章开头，有创建 AWS\
  \ 账户凭据以及下载 Terraform 的说明。现在，你终于可以把这些工作派上用场了！\n\n> **注意**\n> \n> 本书涵盖了 Consul 在服务器和客户端操作方面的内容。HashiCorp\
  \ 还提供了托管式 Consul 服务，即 **HashiCorp 云平台（HCP）**，在您自己的生产环境中部署时，这可能是理想的选择。然而，为了理解服务器操作，我们将自行操作。有关\
  \ HashiCorp 托管 Consul 服务的更多信息，请访问 `https://portal.cloud.hashicorp.com/`。\n\n本节的所有代码都在以下\
  \ GitHub 仓库中：\n\nhttps://github.com/PacktPublishing/Simplifying-Service-Management-with-Consul\n\
  \n您可以 fork 该仓库，或者直接下载它并跟着操作。我们将使用该仓库中的代码为每一章构建我们的系统，相关代码位于相应的章节文件夹中。\n\n以下各节包括对我们用来创建\
  \ Consul 集群的 Packer 和 Terraform 代码的回顾。没有必要理解代码的每个方面，但我还是想包含一些解释，以求完整。当您继续操作时，请仔细注意以\
  \ `$` 符号表示的命令。\n\n## 构建镜像\n\n我们将从构建基础镜像开始。为了让我们所有人——毫不夸张地说——在使用镜像和操作 Consul 方面保持一致，我们将一起使用\
  \ Packer 构建一个镜像。但别担心——你需要的所有代码都在仓库里。在 ch2 文件夹中，您会找到另一个名为 Image-Creation 的文件夹。我知道——这个名字很有创意。以下是进入该文件夹所需的代码：\n\
  \n```\n```sh\n$ cd $github_root/Consul-Up-and-Running/ch2/Image-Creation\n```\n\
  ```\n\n这里有几个关键项需要注意。您的构建变量都在 `variables.pkr.hcl` 中定义，如下面的代码片段所示：\n\n```\n```hcl\n\
  variable \"owner\" {\n  type        = string\n```\n```\n\n```\ndescription = \"\
  Owner tag to which the artifacts belong\"\ndefault     = \"packt-consul\"\n}\nvariable\
  \ \"consul_version\" {\n    type = string\n    description = \"Three digit Consul\
  \ version to work with\"\n    default = \"1.9.0\"\n}\nvariable \"aws_region\" {\n\
  \    type        = string\n    description = \"AWS Region for image\"\n    default\
  \     = \"us-east-2\"\n}\nvariable \"aws_instance_type\" {\n    type        = string\n\
  \    description = \"Instance Type for Image\"\n    default     = \"t2.small\"\n\
  }\n```\n\n对于这些变量中的大多数，默认值就可以了。但是，如果您想更改任何默认值，请在 variables.pkrvars.hcl 中进行修改。例如，请看下面的片段：\n\
  \n```\nowner = \"rjackson\"\n```\n\n是的——自定义变量就是这么简单！定义我们要构建内容的 Packer 文件名为 AWS_linux_image.pkr.hcl。让我们快速看一下该文件，看看我们要构建什么。\n\
  \n第 1 到 19 行定义了我们将用来构建 Consul 镜像的基础镜像。我们利用上述变量文件为名称和区域设置了变量。我们还在 AWS 中筛选合适的 Ubuntu\
  \ 镜像，如下面的代码片段所示：\n\n# AWS_linux_image.pkr.hcl\n\n```\nsource \"amazon-ebs\" \"ubuntu-image\"\
  \ {\n    ami_name = \"${var.owner}-consul-{{timestamp}}\"\n    region   = \"${var.aws_region}\"\
  \n```\n\n```\ninstance_type = var.aws_instance_type\ntags = {\n    Name = \"${var.owner}-consul\"\
  \n}\nsource_ami_filter {\n    filters = {\n        virtualization-type = \"hvm\"\
  \n        name = \"ubuntu/images/*ubuntu-bionic-18.04-amd64-server-*\"\n       \
  \ root-device-type = \"ebs\"\n    }\n    owners = [\"099720109477\"]\n    most_recent\
  \ = true\n}\ncommunicator = \"ssh\"\nssh_username = \"ubuntu\"\n}\n```\n\n第 21-58\
  \ 行实际构建镜像，包括我们需要的所有配置。本质上，我们是获取搜索到的初始镜像，并将我们需要的内容打包进去——因此得名 Packer。在此过程中，我们会移动几个文件供\
  \ Consul 使用：一个定义如何在 Ubuntu 环境中管理 Consul 的服务文件，以及一个将应用于所有 Consul 节点的通用配置文件。我们还执行一些内联配置，指示\
  \ Packer 通过 ssh 连接到节点，并在设置过程中执行一组命令。代码如下面的片段所示：\n\n```\nbuild {\n    sources = [\n\
  \        \"source.amazon-ebs.ubuntu-image\"\n    ]\n    provisioner \"file\" {\n\
  \        source      = \"../files/consul.service\"\n        destination = \"/tmp/consul.service\"\
  \n    }\n    provisioner \"file\" {\n        source      = \"../files/consul-common.hcl\"\
  \n        destination = \"/tmp/consul-common.hcl\"\n    }\n```\n\n```\n```hcl\n\
  }\nprovisioner \"shell\" {\n  inline = [\n    \"sleep 30\",\n    \"sudo apt-get\
  \ update\",\n    \"sudo apt install unzip -y\",\n    \"sudo apt install default-jre\
  \ -y\",\n    \"curl -k -O \\\"https://releases.hashicorp.com/consul/${var.consul_version}/consul_${var.consul_version}_linux_amd64.zip\\\
  \"\",\n    \"unzip consul_${var.consul_version}_linux_amd64.zip\",\n    \"sudo mv\
  \ consul /usr/local/bin\"\n  ]\n}\nprovisioner \"shell\"{\n  inline = [\n    \"\
  sudo /usr/local/bin/consul -autocomplete-install\",\n    \"sudo useradd --system\
  \ --home /etc/consul/consul.d --shell /bin/false consul\",\n    \"sudo mkdir /etc/consul\
  \ /etc/consul/consul.d /etc/consul/logs /var/lib/consul/ /var/run/consul/\",\n \
  \   \"sudo chown -R consul:consul /etc/consul /var/lib/consul/ /var/run/consul/\"\
  ,\n    \"sudo chmod -R a+r /etc/consul/logs/\",\n    \"sudo mv /tmp/consul.service\
  \ /etc/systemd/system/consul.service\",\n    \"sudo mv /tmp/consul-common.hcl /etc/consul/consul.d/consul-common.hcl\"\
  \n  ]\n}\n}\n```\n\n其中一个配置文件包含我们希望在所有 Consul 节点上使用的通用设置。就我们而言，我们只将其设置为日志设置。我们将这些设置为\
  \ DEBUG，以便我们能深入了解 Consul 正在做什么！请看下面的代码片段：\n\n# consul-common.hcl\n\n```\nlog_file\
  \ = \"/etc/consul/logs/\"\nlog_level = \"DEBUG\"\n```\n\n此时，您可能需要再次确认您的 AWS 环境变量已设置。您可以使用以下命令进行检查：\n\
  \n```\n$ env |grep AWS\nAWS_ACCESS_KEY_ID=AFAIKJENNY\nAWS_SECRET_ACCESS_KEY=8675309...\n\
  ```\n\n现在，我们准备构建！执行下面代码片段中显示的那个简单的 Packer 命令，然后花几分钟为自己打包了一个镜像而祝贺吧！选择您喜欢的饮料庆祝一下，放松一下，因为该过程大约需要\
  \ 5 分钟：\n\n```\n$ packer build -var-file=\"variables.pkrvars.hcl\" .\n```\n\n查看输出，它看起来就像有人把圣诞灯扔满了您的终端。Packer\
  \ 的输出全是红色的，并且有各种深浅不一的绿色，只是为了营造节日气氛。您会看到文件被移动，操作系统也在更新，以确保我们拥有所有最新的 Ubuntu 软件包。您还会看到一些关于使用\
  \ shell 脚本进行配置的行。Packer 会根据我们在 Packer 构建定义中看到的那些 shell 配置块来创建 shell 脚本。\n\n在过程结束时，您会看到新镜像的位置和\
  \ Amazon 系统映像（AMI）ID！如下面的片段所示。现在，您可以在自己的镜像之上构建您的 Consul 知识：\n\n```\n==> Wait completed\
  \ after 5 minutes 52 seconds\n==> Builds finished. The artifacts of successful builds\
  \ are:\n--> amazon-ebs.ubuntu-image: AMIs were created:\nus-east-2: ami-079a52bd81f91b201\n\
  ```\n\n同样，无需记住该镜像 ID，因为在下一步中，Terraform 会为我们找到它！\n\n\n\n\n## 构建 Consul 集群\n\n首先，切换到\
  \ ch2 的根目录。在这里，我们将找到用于构建集群的 Terraform 脚本。你可以通过运行以下命令来完成此操作：\n\n```\n$ cd $github_root/Consul-Up-and-Running/ch2/\n\
  ```\n\n与构建 Packer 镜像时类似，此目录中有几个文件需要我们注意。暂时不用关心 files 目录，等我们评估用于构建集群的 Terraform 脚本时再深入探讨。\n\
  \n如果你查看我们的 variables.tf 文件，这里定义了 Terraform 所需的变量。我总是分不清变量在哪里定义、在哪里赋值。总之，对于这五个变量，每个都有描述（这总是一个好习惯）和一个合理的默认值（好吧，从我的角度来看是合理的）。请看下面的代码片段：\n\
  \n### variables.tf\n\n```\nvariable \"aws_region\" {\n  type        = string\n \
  \ default     = \"us-east-1\"\n  description = \"Region for AWS Components\"\n}\n\
  variable \"owner\" {\n  type        = string\n  default     = \"consul-demo\"\n\
  }\nvariable \"consul_region\" {\n  type        = string\n  description = \"Region\
  \ of consul server (not AWS Region)\"\n  default     = \"global\"\n}\nvariable \"\
  vpc_cidr\" {\n  type        = string\n  description = \"CIDR of the VPC\"\n  default\
  \     = \"192.168.100.0/24\"\n}\nvariable \"instance_type\" {\n```\n\n```\ntype\
  \          = string\ndescription   = \"machine instance type\"\ndefault       =\
  \ \"t3.micro\"\n}\n```\n\n如果你更愿意为必要的变量使用自己的值，别担心——我不会介意的。这些变量在 terraform.tfvars\
  \ 文件中设置。请看下面的代码片段：\n\n### Terraform.tfvars\n\n```\nowner         = \"rjackson\"\n\
  aws_region    = \"us-east-2\"\ninstance_type = \"t2.small\"\n```\n\n好了——现在我们已经按照自己的喜好设置好了变量，是时候启动我们的基础设施了！如果你以前从未使用过\
  \ Terraform，别担心——它非常简单，而且所有代码都已构建完成。再说一次，我从不自称是软件开发人员，所以请不要嘲笑我的代码！首先，我们要启动基础设施的构建，然后剖析我们构建的内容。要开始，Terraform\
  \ 需要下载任何必要的特定于提供程序的数据。这通过以下命令执行：\n\n```\n$ terraform init\n```\n\n当然，在不检查将要构建的内容的情况下就进行构建从来都不是好事，所以接下来，我们要规划我们的构建。此命令的所有输出都应该是绿色的加号（+），表示将要创建哪些基础设施。请注意，其中许多项目在\
  \ apply 操作之后才能确定，因为它们需要从 AWS 分配，但浏览一下你将要构建的内容可能会很有趣。如果不感兴趣，别担心——我们会在启动构建后审查细节。\n\
  \n现在，运行以下命令：\n\n```\n$ terraform plan\n```\n\n接下来，我们要应用我们的基础设施构建。这通过你猜对了的 terraform\
  \ apply 来完成。这会再次触发一个 plan，并显示你将要构建的内容，但既然我们已经做过这件事了，那就来个危险的操作吧，直接自动批准。请看下面的代码片段：\n\
  \n```\n$ terraform apply --auto-approve\n```\n\n> 注意\n> 对于你在本练习中产生的任何费用，作者概不负责。请务必在白天或夜晚结束时销毁你的基础设施。如果你想设置一个\
  \ m3.xlarge 系统并让它连续运行几天，那随你便！\n\n好的——让我们来看看我们在构建什么。以下所有代码块（本节中的）都在 main.tf 文件中。Terraform\
  \ 的最佳实践是将所有代码片段放在一个文件中，所以我们要做的就是这样！\n\n第一部分相当简单，只是设置了我们将要使用的 Terraform 提供程序。Terraform\
  \ 提供程序有点像提供特定于该提供程序的功能的模块——例如，我们正在安装 AWS 提供程序，使我们能够管理 AWS 中的资源。我们指定了该提供程序的版本，以及我们将要工作的区域。provider\
  \ 块也是调皮的人会插入其 AWS 凭据的地方，但我们永远不会那样做——对吧？？？最后，我们使用 AWS 数据源来查找我们刚刚使用 Packer 构建的镜像。以下是您需要的代码：\n\
  \n```\nterraform {\n  required_providers {\n    aws = {\n      source  = \"hashicorp/aws\"\
  \n      version = \"~> 2.5\"\n    }\n  }\n}\nprovider \"aws\" {\n  region = var.aws_region\n\
  }\ndata \"aws_ami\" \"an_image\" {\n  most_recent = true\n  owners      = [\"self\"\
  ]\n  filter {\n    name   = \"name\"\n    values = [\"${var.owner}-consul-*\"]\n\
  \  }\n}\n```\n\n下一个部分创建了一个私钥，供我们用来 SSH 登录到我们的机器。一个组织通常会维护自己的私钥用于机器访问，但这些私钥确实不应该随意流传。更安全的方法是使用\
  \ HashiCorp Vault Secure Shell (SSH) 助手来生成一次性 SSH 密钥，但那是另一个故事了。密钥将构建在我们的 Consul\
  \ 机器内部，但我们也会有一个以 -consul-key.pem 结尾的本地 Privacy Enhanced Mail (PEM) 文件。您需要的代码如下面片段所示：\n\
  \n```\nresource \"tls_private_key\" \"my_private_key\" {\n  algorithm = \"RSA\"\n\
  \  rsa_bits = 4096\n}\nresource \"local_file\" \"private_key\" {\n  content = tls_private_key.my_private_key.private_key_pem\n\
  \  filename = \"${var.owner}-consul-key.pem\"\n  file_permission = 0400\n}\nresource\
  \ \"aws_key_pair\" \"consul_key\" {\n  key_name = \"${var.owner}-consul-key\"\n\
  \  public_key = tls_private_key.my_private_key.public_key_openssh\n}\n```\n\n本部分提供了我们系统所需的大部分网络信息。由于我们不是在阅读关于\
  \ AWS 网络复杂细节的书，你就得相信我，下面片段中的所有代码都很酷：\n\n```\nresource aws_vpc \"consul-demo\" {\n\
  \  cidr_block           = var.vpc_cidr\n  enable_dns_hostnames = true\n  tags =\
  \ {\n    Name = \"${var.owner}-vpc\"\n  }\n}\nresource aws_subnet \"consul-demo\"\
  \ {\n  vpc_id     = aws_vpc.consul-demo.id\n  cidr_block = var.vpc_cidr\n  tags\
  \ = {\n    name = \"${var.owner}-subnet\"\n```\n```\n}\n}\nresource aws_internet_gateway\
  \ \"consul-demo\" {\n  vpc_id = aws_vpc.consul-demo.id\n\n  tags = {\n    Name =\
  \ \"${var.owner}-internet-gateway\"\n  }\n}\nresource aws_route_table \"consul-demo\"\
  \ {\n  vpc_id = aws_vpc.consul-demo.id\n  route {\n    cidr_block = \"0.0.0.0/0\"\
  \n    gateway_id = aws_internet_gateway.consul-demo.id\n  }\n}\nresource aws_route_table_association\
  \ \"consul-demo\" {\n  subnet_id     = aws_subnet.consul-demo.id\n  route_table_id\
  \ = aws_route_table.consul-demo.id\n}\n```\n\n好的——这部分网络内容可不是能轻易略过的。AWS 安全组确定了哪些设备之间开放哪些端口。以下是已定义端口及其用途的列表：\n\
  \n-   端口 22—SSH 访问。\n-   端口 8300-8302—这些涵盖了节点之间所有的共识、RPC 和 gossip 通信。\n-   端口 8500—用于\
  \ Consul 的 Web 用户界面（UI）。\n-   端口 8600—Consul 利用端口 8600 进行域名系统（DNS）查询，作为服务发现功能的一部分。\n\
  \n这些端口都已在安全组配置中设置并配置完毕。以下是说明这一点的代码：\n\n```\nresource aws_security_group \"consul-demo\"\
  \ {\n  name   = \"${var.owner}-security-group\"\n  vpc_id = aws_vpc.consul-demo.id\n\
  ```\n\n```\ningress {\n    from_port    = 22\n    to_port      = 22\n    protocol\
  \     = \"tcp\"\n    cidr_blocks  = [\"0.0.0.0/0\"]\n}\ningress {\n    from_port\
  \    = 8300\n    to_port      = 8302\n    protocol     = \"tcp\"\n    cidr_blocks\
  \  = [\"0.0.0.0/0\"]\n}\ningress {\n    from_port    = 8500\n    to_port      =\
  \ 8500\n    protocol     = \"tcp\"\n    cidr_blocks  = [\"0.0.0.0/0\"]\n}\ningress\
  \ {\n    from_port    = 8600\n    to_port      = 8600\n    protocol     = \"tcp\"\
  \n    cidr_blocks  = [\"0.0.0.0/0\"]\n}\negress {\n    from_port        = 0\n  \
  \  to_port          = 0\n    protocol         = \"-1\"\n    cidr_blocks      = [\"\
  0.0.0.0/0\"]\n    prefix_list_ids  = []\n}\ntags = {\n    Name = \"${var.owner}-security-group\"\
  \n}\n}\n```\n\n\n好了，现在进入正题！在本节中，我们将创建三个 Consul 服务器，使用我们通过数据源找到的 AMI（即我们用 Packer\
  \ 构建的 AMI）。我们使用 Terraform 脚本中创建的 SSH 密钥，并分配了一个公网 IP 地址，以便能够访问服务器。在脚本底部，我们为服务器关联了标签，以便轻松找到它们。帮你自己和你的\
  \ IT 运维团队一个忙：永远不要在未关联逻辑标签的情况下部署基础设施！其中一个标签还能唯一标识实例，我们可以用它来唯一识别服务器。在标签正上方，有一个 `user_data`\
  \ 字段。这非常重要，因为它调用模板文件 `server_template.tpl` 来配置 Consul 服务器。我们还将 `server_name_tag`\
  \ 属性传递给模板文件，以帮助识别服务器。代码如下所示：\n\n```\nresource aws_instance \"consul-server\" {\n\
  \  count                         = 3\n  ami                           = data.aws_ami.an_image.id\n\
  \  instance_type                 = var.instance_type\n  key_name               \
  \       = aws_key_pair.consul_key.key_name\n  associate_public_ip_address   = true\n\
  \  subnet_id                     = aws_subnet.consul-demo.id\n  vpc_security_group_ids\
  \        = [aws_security_group.consul-demo.id]\n  iam_instance_profile         \
  \ = aws_iam_instance_profile.instance_profile.name\n  user_data = templatefile(\"\
  files/server_template.tpl\", {\n    server_name_tag = \"${var.owner}-consul-server-instance\"\
  })\n  tags = {\n    Name     = \"${var.owner}-consul-server-instance\"\n    Owner\
  \    = var.owner\n    Instance = \"${var.owner}-consul-server-instance-${count.index}\"\
  \n  }\n}\n```\n\n在下一个代码片段中，我们正在构建 Consul 客户端——准确地说，是四个，分别代表地、风、火、水四大核心元素。其中许多参数与服务器使用的参数相同，但请注意，这里没有\
  \ `user_data` 部分。为了多样化，我们使用 Terraform provisioner 来配置客户端，尽管在生产环境中，像 Ansible 这样的配置管理器会更受欢迎：\n\
  \n```\nresource aws_instance \"consul-client\" {\n  count = 4\n  ami = data.aws_ami.an_image.id\n\
  \  instance_type = var.instance_type\n  key_name = aws_key_pair.consul_key.key_name\n\
  \  associate_public_ip_address = true\n  subnet_id = aws_subnet.consul-demo.id\n\
  \  vpc_security_group_ids = [aws_security_group.consul-demo.id]\n  iam_instance_profile\
  \ = aws_iam_instance_profile.instance_profile.name\n  tags = {\n    Name = \"${var.owner}-consul-client-instance-${count.index}\"\
  \n    Owner = var.owner\n  }\n}\n```\n\n需要注意的是，远程 provisioner 在 Terraform 领域中并不是首选；不过，我偶尔发现它在定制所需资源时非常有用。作为此配置过程的一部分，我们遍历四个客户端中的每一个并执行一些功能，如下所示：\n\
  \n- 将名为 `httpd.json` 的服务定义文件传输到客户端。稍后当我们开始使用集群时，会进一步讨论这一点。\n- 创建一个 `consul-client.hcl`\
  \ 配置文件。我想更深入地探讨一下这个文件：\n  - 我们宣告客户端的公网 IP 地址。这告诉 Consul 服务器以及任何请求访问此客户端上服务的设备，可以通过哪个地址访问它。我们选择客户端的公网地址，以便内部网络之外的应用程序可以访问它。\n\
  - 我们告诉 agent 不要以服务器模式运行，因为——嗯——我们是客户端。\n- 我们启用脚本检查。这允许使用自定义脚本来检查服务健康状态，默认情况下是不启用的。\n\
  - 我们告诉 Consul 将其服务绑定到机器的私有地址。请注意绑定地址和宣告地址之间的区别。私有地址是机器自身知道的，并标识外部接口。而我们宣告的公网地址甚至不是客户端机器本身所知道的，它由\
  \ AWS 管理。\n- 我们告诉客户端服务器在哪里。请记住，客户端需要向服务器注册，以便传达自身及其所有受管服务的状态。\n- 我们指定与 Consul 服务器通信时使用的客户端地址。由于服务器和客户端位于同一个\
  \ AWS 虚拟网络中，我们可以使用私有 IP 地址。\n- 将客户端配置和服务定义文件移动到配置目录（`/etc/consul/consul.d/`）。\n\
  - 使用 Python 启动一个简单的超文本传输协议（HTTP）服务器。毕竟，创建一个 Consul 集群却不在上面运行任何服务，何必这么麻烦呢？！\n- 接下来，我们使用一个\
  \ provisioner 在客户端机器上远程启动 Consul 服务。\n- 最后一块告诉 Terraform 它将如何连接到客户端机器。请注意，我们使用的是之前创建的\
  \ SSH 密钥的内容。\n\n请注意，虽然客户端的配置全部都在这个 Terraform 文件中，但服务器的应用程序配置却不在这里。这是因为我们在 Terraform\
  \ 中使用了 `user_data` 功能，而且我们很快就会看到模板文件。在 Terraform 中，当我们使用 provisioner 来执行脚本或移动文件时，我们会声明一个\
  \ `null_resource` 属性，如下所示：\n\n```\nresource null_resource \"provisioning-clients\"\
  \ {\n  for_each = { for client in aws_instance.consul-client : client.tags.Name\
  \ => client }\n  provisioner \"file\" {\n    source      = \"files/httpd.json\"\n\
  \    destination = \"/tmp/httpd.json\"\n  }\n}\n```\n\n```\n```hcl\nprovisioner\
  \ \"remote-exec\" {\n  inline = [\n    \"sudo cat << EOF > /tmp/consul-client.hcl\"\
  ,\n    \"advertise_addr = \\\"${each.value.public_ip}\\\"\",\n    \"server = false\"\
  ,\n    \"enable_script_checks = true\",\n    \"bind_addr = \\\"${each.value.private_ip}\\\
  \"\",\n    \"retry_join = [\\\"${aws_instance.consul-server[0].public_ip}\\\",\\\
  \"${aws_instance.consul-server[1].public_ip}\\\",\\\"${aws_instance.consul-server[2].public_ip}\\\
  \"]\",\n    \"client_addr = \\\"${each.value.private_ip}\\\"\",\n    \"EOF\",\n\
  \    \"sudo mv /tmp/consul-client.hcl /etc/consul/consul.d/consul-client.hcl\",\n\
  \    \"sudo mv /tmp/httpd.json /etc/consul/consul.d/httpd.json\",\n    \"nohup python3\
  \ -m http.server 8080 &\",\n    \"sleep 60\"\n  ]\n}\nprovisioner \"remote-exec\"\
  \ {\n  inline = [\n    \"sudo systemctl start consul\",\n  ]\n}\nconnection {\n\
  \  type        = \"ssh\"\n  user        = \"ubuntu\"\n  private_key = local_file.private_key.content\n\
  \  host        = each.value.public_ip\n}\n```\n```\n\n接下来，我们有实例身份信息和相关角色。这与 Consul\
  \ 没有直接关联，但它是启用我们在 AWS 内所需通信路径所必需的。代码如下所示：\n\n```\n```hcl\nresource \"aws_iam_instance_profile\"\
  \ \"instance_profile\" {\n  name_prefix = var.owner\n  role        = aws_iam_role.instance_role.name\n\
  }\n\nresource \"aws_iam_role\" \"instance_role\" {\n  name_prefix        = var.owner\n\
  \  assume_role_policy = data.aws_iam_policy_document.instance_role.json\n}\n\ndata\
  \ \"aws_iam_policy_document\" \"instance_role\" {\n  statement {\n    effect  =\
  \ \"Allow\"\n    actions = [\"sts:AssumeRole\"]\n\n    principals {\n      type\
  \        = \"Service\"\n      identifiers = [\"ec2.amazonaws.com\"]\n    }\n  }\n\
  }\n\nresource \"aws_iam_role_policy\" \"metadata_access\" {\n  name   = \"metadata_access\"\
  \n  role   = aws_iam_role.instance_role.id\n  policy = data.aws_iam_policy_document.metadata_access.json\n\
  }\n\ndata \"aws_iam_policy_document\" \"metadata_access\" {\n  statement {\n   \
  \ effect = \"Allow\"\n    actions = [\n      \"ec2:DescribeInstances\",\n    ]\n\
  \    resources = [\"*\"]\n  }\n}\n```\n```\n\n好了——现在我们已经看完了整个 Terraform 文件，让我们仔细看看那个服务器模板文件。通过该模板，我们创建了一个\
  \ `consul-server.hcl` 服务器配置文件，并用所有必要的配置填充它，如下所示：\n\n```\n```bash\n#!/usr/bin/env\
  \ bash\n\ncat << EOF > /etc/consul/consul.d/consul-server.hcl\nserver = true\nbootstrap_expect\
  \ = 3\nretry_join = [\"provider=aws tag_key=Name tag_value=${server_name_tag}\"\
  ]\nbind_addr = \"$(curl -s http://169.254.169.254/latest/meta-data/local-ipv4)\"\
  \nadvertise_addr = \"$(curl -s http://169.254.169.254/latest/meta-data/public-ipv4)\"\
  \nclient_addr = \"$(curl -s http://169.254.169.254/latest/meta-data/local-ipv4)\"\
  \nui = true\nEOF\n\n# Starting consul services\nsudo systemctl start consul\n```\n\
  ```\n\n顺着这个模板文件，让我们看看这个文件到底在做什么：\n\n- 1. 指示 Consul agent 以服务器模式运行。\n- 2. 接下来，我们指定希望在集群中看到的预期服务器数量。请记住，我们之前在讨论共识和法定人数时提到过这一点。我们创建了三个\
  \ Consul 服务器，这意味着我们的法定人数是……（我给你一个提示——它大于一，小于三）。\n- 3. 好的——这部分相当酷。如果你还记得，在 Terraform\
