- "## Keep It Safe, Stupid, and Secure Your Cluster!\n\n此时，你可能会对自己说，*哇，两章就完成了。* 好吧，很抱歉打破你的幻想，但你目前非常暴露。是的，我们构建了一个基本的\
  \ Consul 集群，由三台服务器和四台客户端组成，但该系统没有任何安全措施。基本上，我们建造了一座没有门的玻璃房子，任何人都可以走进去，任何人都可以看到里面发生了什么。有点\
  \ creepy，不是吗？\n\n为了了解我们将如何保护我们的系统，更重要的是保护我们的服务，让我们看看我们暴露的所有区域：\n\n- **System communication**\
  \ – 我们已经看到所有 Consul 组件如何自由地相互通信。任何人都可以未经验证地加入该集群，任何人都可以窃听。\n- **Who can do what**\
  \ – 即使你在集群中经过验证和身份验证，我们也需要确保可用操作的范围受到严格控制。毕竟，我们不希望任何人带着对配置的完全访问权限跳入集群。\n- Extending\
  \ Consul – 在理解到多个组将访问 Consul 的前提下，我们希望为每个组提供他们管理自己的服务所需的访问权限，而不会干扰他人。\n\n除了这些区域之外，还有保护操作系统环境的基本程序。这包括对操作系统和文件结构的受保护访问。这些被认为是基本的管理程序，不在本書中涵盖。\n\
  \n有了这些，让我们直接跳进去，开始看看如何开始保护我们的玻璃房子！\n\n## Technical requirements\n\n随着通过保护任何基础设施而引入的额外复杂性，我们将使用一个特定于本章的新存储库：\n\
  \n```\nhttps://github.com/PacktPublishing/Simplifying-Service-Management-with-Consul/tree/main/ch3\n\
