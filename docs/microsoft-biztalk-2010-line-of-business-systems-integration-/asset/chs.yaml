  \  <SendPort Name=\"SendEchoString\" IsStatic=\"true\" IsTwoW\n    <Description>SendPort\
  \ for EchoAdapterBinding.</Descr\n```\n\n4. 现在我们已准备好所有工件，可以继续构建示例应用程序。\n\n5. 向项目添加\
