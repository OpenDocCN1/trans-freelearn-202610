  \ 2010: Line of Business\nSystems Integration\n\n## 关于 Packt Publishing\n\nPackt，读作\
  \ 'packed'，于 2004 年 4 月出版了首本书 \"Mastering phpMyAdmin for Effective MySQL Management\"\
  ，随后继续专注于出版针对特定技术和解决方案的高度聚焦的书籍。\n\n我们的书籍和出版物分享了您的同行 IT 专业人士在适应和定制当今系统、应用程序和框架方面的经验。我们的基于解决方案的书籍为您提供定制您正在使用的软件和技术以完成工作的知识和能力。与过去所见的\
  \ IT 书籍相比，Packt 的书籍更具体、更少泛化。我们的独特商业模式使我们能够为您提供更集中的信息，让您了解所需的内容，而非不需要的内容。\n\nPackt\
  \ 是一家现代而独特的出版公司，专注于为开发者、管理员和新手社区生产高质量的前沿书籍。如需更多信息，请访问我们的网站：www.packtpub.com。\n\n\
  ## 关于 Packt Enterprise\n\n在 2010 年，Packt 推出了两个新品牌 Packt Enterprise 和 Packt Open\
  \ Source，以继续其专业化重点。本书是 Packt Enterprise 品牌的一部分，该品牌是出版企业软件书籍的所在地——由主要供应商（包括但不限于 IBM、Microsoft\
  \ 和 Oracle）创建的软件，通常供其他公司使用。其标题将为使用该软件的各类用户提供相关信息，包括管理员、开发者、架构师和终端用户。\n\n## 为 Packt\
  \ 撰写\n\n我们欢迎所有有兴趣撰写的作者的咨询。书稿提案应发送至 author@packtpub.com。如果您的书稿想法仍处于早期阶段，并且您希望在撰写正式书稿提案之前先讨论，请联系我们；我们的其中一位编辑会与您联系。\n\
  \n我们不仅寻找已出版的作者；如果您具有强大的技术技能但没有写作经验，我们经验丰富的编辑可以帮助您发展写作生涯，或为您提供专业知识的额外回报。\n\n\n\n\
