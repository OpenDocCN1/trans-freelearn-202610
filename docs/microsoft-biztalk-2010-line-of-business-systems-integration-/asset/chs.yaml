  \ WCF-Custom 传输属性窗口。如您所见，对于接收位置，此窗口的外观略有不同。没有“凭据”选项卡；相反，您必须切换到“其他”选项卡并在那里指定用户名和密码。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_57_1.png)\n\n22. 在启动应用程序之前最后一步是绑定编排。在\
  \ BizTalk 管理控制台中双击 ProcessEcho 编排以打开“编排属性”窗口。激活“绑定”选项卡并将属性设置为以下图像所示：\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_58_0.png)\n\
  \n23. 单击“确定”关闭“编排属性”窗口，然后启动应用程序。\n\n如果我们向适配器监控的 c:\\temp 文件夹提交文件，我们将收到以下错误消息：\n\n\
  ```\nThe adapter failed to transmit message going to send port\n\"SendEchoString\"\
  \ with URL \" echo://host/temp?EchoPrefix=pre \".\nIt will be retransmitted after\
  \ the retry interval specified for\nthis Send Port. Details:\"Microsoft.ServiceModel.Channels.Common.\n\
  UnsupportedOperationException: Incorrect Action\n<BtsActionMapping xmlns:xsi=\"\
  http://www.w3.org/2001/XMLSchema-instance\" xmlns:xsd=\"http://www.w3.org/2001/XMLSchema\"\
  >\n  <Operation Name=\"EchoString\" Action=\"Echo/EchoString\" />\n</BtsActionMapping>.\
  \ Correct the specified Action, or refer to the\ndocumentation on the allowed formats\
  \ for the Actions. Note that\nActions are case-sensitive.\n```\n\n问题正是错误消息所告诉我们的——应用于发送端口的\
  \ SOAP 操作设置不被适配器理解。在 MSDN 论坛上最常被问到的问题之一是“我使用 Consume Adapter Service 插件生成的 SOAP\
  \ 操作设置导入了绑定，为什么它们不被适配器理解？”。我们将在完成演练后不久揭开这个问题的神秘面纱，并阐明 WCF 自定义适配器如何处理操作。现在，为了修复问题并完成应用程序，请转到\
  \ BizTalk 管理控制台并执行以下操作：\n\n1. 双击 `SendEchoString` 发送端口。在 **发送端口属性** 窗口中单击 **配置**\
  \ 以打开 **WCF-Custom 传输** 属性窗口。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_59_0.png)\n\
  \n2. 在 **SOAP 操作头** 部分的 **操作** 文本框中，注意 **名称** 属性的值，即 **EchoString**。您需要做的是使编排逻辑发送端口名称与\
  \ **名称** 属性的值匹配。第一个选项是将逻辑端口名称从 Operation_1 更改为 EchoString，然后当然重新部署应用程序。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_60_0.png)\n\
  \n3. 如果您不想重新部署应用程序，一个替代选项是将 **名称** 属性值设置为 **Operation_1**，使 **操作** 框的内容如下所示：\n\n\
  ![](img/23d1402649b6528b085cd6b900a2c9c3_60_1.png)\n\n4. 虽然从纯技术角度来看这是一个完全有效的解决方案，但使用这种不具描述性的名称是一种值得怀疑的做法，应避免。我们在此仅出于说明概念的目的而提出它。最佳做法不是将操作名称保留为默认值\
  \ Operation_1，而是在设计编排时为其赋予描述性名称，然后调整物理端口操作映射。\n\n因此，让我们正确地操作，只需将逻辑端口操作名称更改为 EchoString。完成后，重新部署应用程序。现在，您可以创建一个包含单个单词“Echo”的文件，将其拖放到\
  \ C:\\temp 文件夹中，并查看事件日志中 Echo 适配器返回的回显消息。请不要忘记，文件必须具有 TXT 扩展名。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_61_0.png)\n\
  \n## WCF-Custom 适配器和 SOAP 操作\n\n现在，正如所承诺的，让我们更深入地了解 SOAP 操作以及 WCF-Custom 适配器如何处理它们。SOAP\
  \ 操作背后的想法非常简单。本质上，SOAP 操作只是附加到传入 WCF 消息的标签，告诉适配器它必须执行什么操作。\n\n为了通过具体示例说明概念，让我们参考随\
  \ Echo 适配器提供的源代码。我们感兴趣的重点是 Microsoft.ServiceModel.Channels.Common.IOutboundHandler\
  \ 接口的 Execute 方法。此接口是所有支持外发操作的 ASDK 基于适配器必须实现的接口之一。Execute 由 ASDK 运行时调用以执行外发操作。以下是实现：\n\
  \n```csharp\n/// <summary>\n/// Executes the request message on the target system\
  \ and returns a response message.\n/// If there isn't a response, this method should\
  \ return null\n/// </summary>\n/// <param name=\"message\">The Message to be executed</param>\n\
  /// <param name=\"timeout\">The timeout for the operation</param>\n/// <returns>the\
  \ response message, null if there was no response</returns>\npublic Message Execute(Message\
  \ message, TimeSpan timeout)\n{\n    OperationMetadata om =\n        this.MetadataLookup.GetOperationDefinitionFromInputMessageAction(message.Headers.Action);\n\
  \    if (om == null)\n    {\n        throw new AdapterException(\"Invalid operation\
  \ \" + message.Headers.Action);\n    }\n\n    switch (message.Headers.Action)\n\
  \    {\n        case \"Echo/EchoString\":\n            return CreateEchoStringResponseMessage(message);\n\
  \n        default: throw new AdapterException(\"Invalid Operation \" + message.Headers.Action);\n\
  \    }\n}\n```\n\n代码不言自明，正如您所清楚看到的，是以操作为中心的。如果随 SOAP 头一起传递的操作被识别，适配器将执行请求的操作，如果没有，则适配器会以“无效操作”异常进行响应。由于\
  \ Echo 适配器只公开一个操作，使用操作似乎是不必要的，但想象一下适配器公开多个操作的情况？在这种情况下，使用 SOAP 操作是帮助适配器决定执行什么操作的非常合乎逻辑的方式。\n\
  \n将 BizTalk 消息与适当的 SOAP 操作关联（或附加适当的处理标签，如您所愿）有两种不同的方法。一种是使用所谓的“操作映射”配置物理发送端口。另一种是在运行时动态设置操作。\n\
  \n\n\n\n## 操作映射\n\n您在大多数情况下会使用操作映射——这是配置物理端口最简单的方式，因为 Consume Adapter Service Wizard\
  \ 会完成大部分工作。对于设计时您所选择的操作，Consume Adapter Service Wizard 会在 BtsActionMapping 包装器内部生成相应的\
  \ Operation 条目，并将该映射放置到它将生成的物理端口绑定文件中。一般形式下，操作映射如下所示：\n\n```\n<BtsActionMapping>\n\
  \  <Operation Name =\"Operation1\" Action = \"Action1\" />\n  <Operation Name =\
  \ \"Operation2\" Action = \"Action2\"/>\n  ...\n  <Operation Name = \"OperationN\"\
  \ Action = \"ActionN\"/>\n</BtsActionMapping>\n```\n\n为了处理操作映射并将 SOAP 操作标签附加到传入消息，WCF-Custom\
  \ 适配器使用以下算法：\n\n当传出消息离开编排时，编排实例会使用逻辑端口操作名称设置 BTS.Operation 上下文属性。一旦订阅机制从消息框中提取消息并将其交给物理端口进行处理，WCF-Custom\
  \ 适配器会尝试查找操作映射中 Name 与 BTS.Operation 属性匹配的 Operation。如果找到匹配项，则适配器会将相应的 Action 值附加到消息并将其发送到自定义绑定以执行。如果未找到匹配项，则\
  \ WCF-Custom 适配器会将整个 BtsActionMapping 视为一个大的操作，因此自定义绑定将获得以下操作：\n`<BtsActionMapping><Operation\
  \ Name=\"Operation 1\" Action =......</BtsActionMapping>` 其后果相当可预测 – \"Invalid action\"\
  \ 异常。因此，规则很明确：对于每个编排传出操作，对应的物理端口操作映射中必须有一个 Operation 条目，其 Name 属性值与编排操作名称匹配。\n\n\
  需要注意的是，对于基于内容路由的场景，其中您不使用编排而仅依赖消息引擎提供的功能，您无需编写自定义管道组件来设置 BTS.Operation 上下文属性。幸运的是，WCF-Custom\
  \ 适配器支持一种替代的单操作格式。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_64_0.png)\n\n本质上，这意味着所有到达为单操作处理配置的发送端口的消息都将被标记为相同的操作，而不管\
  \ BTS.Operation 上下文属性如何。由于 Echo 适配器仅支持一个操作，因此单操作方法是一种完全适用于我们示例应用程序的替代解决方案。\n\n##\
  \ 动态设置 SOAP 操作\n\n在您希望将对要执行哪个操作的决策推迟到运行时时，可以使用 WCF.Action 上下文属性。您需要做的就是向编排添加一个 Expression\
  \ 形状并配置该形状以执行类似于下面所示的代码：\n\n```\nYourOutboundMessage (WCF.Action) = \"DesiredAction\"\
  \n```\n\n正如您所见，WCF-Custom 适配器提供了足够的灵活性来应对您可能遇到的几乎任何情况。一旦您理解了概念和可用选项，只需准确操作，不超过几分钟即可配置发送端口。\n\
  \n## ASDK 工具和功能\n\n到目前为止，您基本上已拥有开始构建依赖于基于 ASDK 的适配器的应用程序所需的所有必要信息。然而，与任何严肃的技术一样，ASDK\
  \ 无疑也是如此，其中一些区域和功能如果被滥用可能会成为头痛的来源或降低您的工作效率。而且，与任何严肃的技术一样，也有工具可以帮助您有效解决潜在问题。\n\n\
  在本节中，我们将讨论以下适用于所有基于 ASDK 的适配器的主题：\n\n- 生成架构 - 有用的提示\n- 处理超时\n- 跟踪和追踪\n\n### 生成架构\n\
  \n完成演练后，您可能会得出结论，生成架构可能是决定您使用适配器的体验是快速顺畅还是需要花费大量时间排查应用程序问题的最重要步骤。如果这是您的判断，您绝对是正确的。在这里，我们想为您提供一些提示和建议，这可能会提高您的工作效率并帮助避免潜在问题：\n\
  \n- 如果您对 **Consume Adapter Service** 插件生成的架构文件名称不满意，请随意将其更改为您喜欢的名称或贵组织采用的命名约定。\n\
  - 正如您可能知道的，BizTalk 架构会被编译成 .Net 类。您可以自由更改要生成的 .NET 类的名称和命名空间。只需在解决方案资源管理器中单击架构文件并在\
  \ **Properties** 窗口中进行更改。这样，您将使引用 XSD 文件中定义的类型变得更容易、更直观。\n- 您可以根据需要区分或提升架构字段。但是，请注意，如果出于任何原因您需要重新生成架构，您的提升将会丢失。\n\
  \n- 在绝大多数情况下，您无需更改 Consume Adapter Service 插件生成的架构的命名空间和根节点名称。正如您所知，这两个元素构成了文档类型，是消息引擎订阅机制的基石。如果您仍然有非常充分的理由更改类型，则该更改必须伴随自定义管道组件。对于入站场景，管道组件必须将适配器生成的文档转换为匹配您的自定义文档类型。否则，消息引擎将抛出臭名昭著的\
  \ \"subscription not found\" 异常。对于出站场景，您的自定义管道组件必须将您的自定义文档转换为适配器期望的类型，即 Consume\
  \ Adapter Service 插件为您生成的类型。否则消息将被适配器拒绝。\n- 如果您计划在同一 BizTalk 组中使用多个应用程序使用 ASDK 适配器，则必须格外谨慎。如果您在不同的\
  \ Visual Studio 项目中为同一操作生成架构，您将最终出现同一消息类型在 BizTalk 管理数据库中出现两次的情况。此配置的后果是消息引擎将抛出异常，报告其无法解析消息类型或找到订阅，因为多个架构匹配了消息类型。\n\
  - 为避免这种情况，我们建议将 **Consume Adapter Service add-in** 生成的架构放入单独的 Visual Studio BizTalk\
  \ 项目中，您可以从其他 Visual Studio BizTalk 项目引用该项目。部署时，您需要将包含架构的程序集添加到单独的 BizTalk 应用程序，例如\
  \ `YourOrganization.Common`，然后从组中的其他 BizTalk 应用程序引用该应用程序。\n- 另一种选择是配置 XMLReceive\
  \ 或 XMLTransmit 管道，并在 DocumentSpecNames 属性中设置完全限定的架构名称。\n\n- 使用 **Consume Adapter\
  \ Service Wizard** 时，您可能注意到 **Consume Adapter Service Wizard** 底部的 **Generate Unique\
  \ Schema Types** 复选框，并想知道这是否是我们刚刚讨论的问题的更简单解决方案。\n- 不幸的是，此复选框处理的是从根本上相似但最终不同的问题。考虑以下场景：您想要为例如名为\
  \ **LOBOOperationA** 的操作生成架构。**LOBOOperationA** 的架构使用复杂类型 **CT1** 的参数。假设您关闭了 **the\
  \ Consume Adapter Service Wizard**，并在稍后重新打开它以生成架构 **for LOBOOperationB**，它使用相同的复杂类型\
  \ **CT1**。在您生成 **LOBOOperationB** 的架构并编译项目后，您将收到错误消息，报告同一类型 **CT1** 在不同的 XSD 文件中被定义了两次。为解决这种情况，您可以执行以下操作：\n\
  \  - 在可能的情况下，将您计划使用的所有操作的架构一次性生成到 Consume Adapter Service addin 中。addin 能够识别这种情况并将共享类型的定义放在单个单独的\
  \ XSD 文件中，该文件由主 XSD 文件使用 **Import** 指令引用。\n  - 如果您的应用程序正在演进，并且您唯一的选择是在多次运行中生成架构，则选中\
  \ **Generate Unique Schema Types** 可以通过为复杂类型生成唯一的命名空间来解决问题。\n\n最佳方法是仅运行一次插件并一次性生成所有架构，但正如经常发生的那样，在实际项目中这种解决方案并不总是可行。因此，在许多情况下，您最好的选择是使用\
  \ Generate Unique Schema Types 复选框。即使操作不使用共享类型，保持此复选框选中也不会造成任何损害。\n\n\n\n## 超时\n\
  \n如果你已按照演练操作，你应该已经注意到在“配置适配器”对话框的“绑定属性”页面上设计时可用的超时相关绑定属性组。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_68_0.png)\n\
  \n在导入 ASDK 生成的绑定文件后，这些属性可通过 WCF-Custom 传输属性对话框的“绑定”选项卡访问。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_68_1.png)\n\
  \n下表列出了每个属性的用途以及 ASDK 设置的默认值：\n\n| 属性 | 用途 |\n|---|---|\n| openTimeout | 打开连接超时。默认值是\
  \ 1 分钟。 |\n| closeTimeout | 关闭连接超时。默认值是 1 分钟。 |\n| sendTimeout | 外发请求-响应超时。该属性指定适配器在抛出异常之前等待目标\
  \ LOB 响应的时长。默认值是 1 分钟。 |\n| receiveTimeout | 接收操作超时。基本上，该属性指定适配器等待来自目标 LOB 的入站消息的时长。默认值为\
  \ 10 分钟。 |\n\n在处理外发场景中的超时异常时，可能会很诱人通过简单地增加 sendTimeout 值来解决问题。然而，你的第一道防线应该是与 LOB\
  \ 应用程序管理员沟通，以确定是否可以通过优化 LOB 应用程序端的性能来解决问题。盲目增加 sendTimeout 值来掩盖问题绝对不是最佳解决方案。\n\n\
  对于入站操作，你必须将 receiveTimeout 属性设置为足够大的值，以不干扰你特定的接收位置配置。如果你抓耳挠腮试图弄清楚为什么你的适配器行为完全“无法解释”——例如，使用专用配置属性而不是轮询数据库时以随机且无明显规律的间隔轮询数据库，首先要检查的就是\
  \ receiveTimeout 设置。在许多情况下，调整此属性会神奇地解决甚至看似无关的问题。我们将在后续章节中再次讨论此主题。默认值是 10 分钟；最大支持值是\
  \ 24.20:31:23.6470000（24 天）。\n\n## 跟踪和消息日志记录\n\n当适配器行为不符合预期时，跟踪和消息日志记录是 ASDK 提供的实用功能，可帮助你识别问题的根源。它们在入站场景中尤其有用，在这些场景中，ASDK\
  \ 适配器及其底层 LOB 可能会充当客户端。在这种场景中，可能的异常，例如我们刚刚讨论的接收超时，将不会传播到你的 BizTalk 应用程序。最好情况下，异常可能会出现在\
  \ BizTalk 计算机的事件查看器中，最坏情况下则完全不会出现，让你无从猜测。\n\n使用跟踪和消息日志记录功能，你可以跟踪并记录 BizTalk Server\
  \ 与 ASDK 适配器之间的通信、ASDK 适配器内部的通信，以及在 SAP 适配器的情况下，ASDK 适配器与其目标 LOB 应用程序之间的通信。简而言之，要激活跟踪，只需将跟踪选项添加到应用程序配置文件中——用于设计时跟踪的\
  \ Visual Studio 或用于运行时的 BizTalk 服务器。我们已将文件名和其位置放在下表中：\n\n| 应用程序/环境 | 位置 |\n|---|---|\n\
  | Visual Studio，32 位环境 | <installation drive>:\\Program Files\\Microsoft Visual\
  \ Studio 10.0\\Common7\\IDE\\devenv.exe.config |\n| Visual Studio，64 位环境 | <installation\
  \ drive>:\\Program Files (x86)\\Microsoft Visual Studio 10.0\\Common7\\IDE\\devenv.exe.config\
  \ |\n| BizTalkServer，32 位环境 | <installation drive>:\\Program Files\\Microsoft BizTalk\
  \ Server 2010\\BTSNTSvc.exe.config |\n| BizTalkServer，64 位环境 | <installation drive>:\\\
  Program Files (x86)\\Microsoft BizTalk Server 2010\\BTSNTSvc.exe.config for 32-bit\
  \ host instances <installation drive>:\\Program Files (x86)\\Microsoft BizTalk Server\
  \ 2010\\BTSNTSvc64.exe.config for 64-bit host instances |\n\n产品文档提供了可直接使用的配置节，可复制粘贴到适当的配置文件中。目前可在\
  \ http://msdn.microsoft.com/en-us/library/cc185440(BTS.10).aspx 获取。如果位置发生变化，你可以使用你喜欢的搜索引擎搜索\
  \ “WCF LOB SDK Diagnostic tracing”。\n\n## 摘要\n\n在本章中，我们为讨论 BizTalk Adapter Pack\
  \ 2010 中适配器的特性和功能奠定了良好的基础。我们已涵盖：\n\n- 架构基础以及引入新的基于 WCF 的技术 WCF LOB Adapter SDK（ASDK）的原因\n\
  - 使 BizTalk 应用程序能够使用基于 ASDK 的适配器的主要步骤\n- 一些最佳实践，使你的工作更高效且无麻烦\n\n在下一章中，我们将向你介绍 WCF\
  \ SQL Adapter，可能是 BizTalk Adapter Pack 2010 中使用最广泛的适配器。\n"
- "## 2 WCF LOB SQL 适配器\n\n### WCF LOB SQL 适配器\n\nWCF LOB SQL Adapter 是 BizTalk Adapter\
  \ Pack 2010 中提供对 SQL Server 数据库连接的适配器。BizTalk Server 解决方案与 SQL Server 数据库交互非常常见，使其成为\
  \ BizTalk 最受欢迎的适配器之一。与包中的所有适配器一样，它基于 Microsoft Windows Communication Foundation\
  \ Line-of-Business Adapter SDK（ASDK）。如第 1 章所述，它不仅可以从 BizTalk Server 解决方案中使用，还可以从任何基于\
  \ .NET 的应用程序中使用。\n\nWCF LOB SQL Adapter（本章中我们将其称为 ASDK SQL 适配器或简称适配器）应作为旧 SQL Adapter\
  \ 的替代品使用。ASDK SQL 适配器提供多种新功能、改进的性能，并支持自 SQL Server 2000 以来的所有版本的 SQL Server。旧的 SQL\
  \ Adapter 依赖于 SQL Server 的 SQLXML 功能，而新适配器遵循 .NET Framework 并通过 ADO.NET 与 SQL Server\
  \ 通信。\n\n> 有关这两个适配器的更深入讨论，请参阅此博客文章：http://connectedthoughts.wordpress.com/2011/01/18/wcf-sql-versus-the-old-sql-adapter/\n\
  \n在本章前半部分，我们将涵盖以下主题：\n\n- 支持的操作\n- 在 Visual Studio 中设计时使用适配器\n- 使用 BizTalk 管理控制台配置物理端口\n\
  - 通过 WCF-Custom 与 WCF-SQL 专用适配器使用\n\n在第二部分，我们将构建一系列 BizTalk 应用程序，以说明你在项目中可能遇到的最常见集成场景。\n\
  \n为了充分利用本章，你必须熟悉 ASDK 提供的 Consume Adapter Service 向导以及使 BizTalk 应用程序能够使用基于 ASDK\
  \ 的适配器所涉及的主要步骤。如果你需要复习记忆，或尚未安装 BizTalk Adapter Pack 2010，请参阅第 1 章，我们在其中详细介绍了这些主题。\n\
  \n## 支持的操作\n\nASDK SQL 适配器提供了一套广泛的灵活且可配置的操作，涵盖开发人员可能遇到的几乎所有需求。根据特定操作在 BizTalk Server\
  \ 消息子系统中的位置，操作分为两组——入站和出站。\n\n## 入站操作\n\n在入站场景中，ASDK SQL 适配器作为接收端口基础设施的一部分从 SQL\
  \ Server 查询数据。然后将数据提交到 MessageBox 以进行进一步处理。\n\n下表列出了适配器支持的以下入站操作及其描述：\n\n| 操作 |\
  \ 描述 |\n|---|---|\n| TypedPolling | TypedPolling 是最常见的入站操作。由轮询语句生成的结果集的模式是强类型的，这对于使用\
  \ BizTalk 映射器进行消息转换非常方便。我们将在“示例”部分详细讨论此操作。 |\n| Polling | 与 TypedPolling 操作类似。区别在于由轮询语句生成的结果集的模式是弱类型的。通常它用于经典的\
  \ .NET 场景，而很少被 BizTalk Server 应用程序使用。 |\n| Notification | 通知选项允许适配器接收有关数据库更改的通知。我们将在“示例”部分讨论此操作。\
  \ |\n| XmlPolling | ASDK SQL 适配器提供 XmlPolling 以支持返回 XML 的现有存储过程，并与旧 SQL Adapter\
  \ 兼容。对于此操作，Consume Adapter Service 向导不提供支持。XmlPolling 的模式要么在运行时使用 FOR XML 子句的 XMLSCHEMA\
  \ 参数生成，要么手动在 Visual Studio 中生成。 |\n\n\n\n\n## 出站操作\n\n在出站场景中，ASDK SQL 适配器作为发送端口基础设施的一部分，对数据库实体执行操作并将响应传回调用方。\n\
  \n下表显示了适配器支持的出站操作：\n\n| 操作 | 描述 |\n|---|---|\n| 强类型存储过程 | 使 BizTalk 应用程序能够调用强类型存储过程。适配器生成的响应消息为强类型。\
  \ |\n| 存储过程 | 与调用强类型存储过程类似。不同之处在于适配器生成的結果集的架构为弱类型。 |\n| 标量函数 | 使 BizTalk 解决方案能够调用标量函数并接收标量值结果。\
  \ |\n| 表值函数 | 使 BizTalk 解决方案能够调用表值函数并接收强类型结果。 |\n| 表 | 使 BizTalk 解决方案能够对 SQL Server\
  \ 表执行 Select、Insert、Update 和 Delete 操作，并还能够通过 VarText 和 VarBinary 操作类型设置 varchar(max)、nvarchar(max)\
  \ 或 varbinary(max) 数据类型的表列。 |\n| 视图 | 使 BizTalk 解决方案能够对 SQL Server 视图执行 Select、Insert、Update\
  \ 和 Delete 操作，并还能够通过 VarText 和 VarBinary 操作类型设置 varchar(max)、nvarchar(max) 或 varbinary(max)\
  \ 数据类型的视图列。 |\n| 执行非查询 | 启用执行任何非 SELECT 语句，包括 DDL 语句。对于 INSERT、UPDATE 和 DELETE 语句，响应消息包含受影响的行数。对于其他语句，它始终为\
  \ -1。 |\n| 执行读取器 | 启用对表和视图执行任何 SELECT 语句。您可以执行用分号分隔的多个语句。响应消息包含 DataSets 数组。 |\n\
  | 执行标量 | 启用执行任何 SELECT 语句。仅返回结果集中第一行的第一列。 |\n| 复合操作 | 复合操作是适配器支持的一种特殊操作类型。它使 BizTalk\
  \ 解决方案能够以任意顺序将多个 Insert、Update、Delete、Procedure 和强类型存储过程操作组合成在单个事务中执行的单个操作。 |\n\n\
  我们将在本章的练习部分展示最常用的出站操作。\n\n## 在 Visual Studio 中使用 ASDK SQL 适配器\n\n正如您在第 1 章中记得的那样，为项目中打算使用的操作生成架构和绑定文件是使\
  \ BizTalk 应用程序能够使用基于 ASDK 的适配器的重要步骤之一。此任务的首选工具是 Consume Adapter Service 向导，这是 ASDK\
  \ 提供的设计时工具。要调用该向导，我们必须右键单击 Visual Studio 项目，选择 Add...，然后选择 Add Generated Items...。在\
  \ Add Generated Items 窗口中，我们需要选择 Consume Adapter Service 并单击 Add。一旦 Consume Adapter\
  \ Service 窗口显示出来，第一步就是指定适当的绑定。ASDK SQL 适配器由 sqlBinding 表示——在 Consume Adapter Service\
  \ 向导中执行其他操作之前，您必须在 Select a binding 下拉列表中选择它。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_76_0.png)\n\
  \n然后，在选择绑定后，我们单击 Configure 按钮打开 Configure Adapter 窗口以指定数据库连接性和绑定属性。\n\n## 提供凭据\n\
  \nConfigure Adapter 窗口的 Security 选项卡允许我们指定访问 SQL Server 的凭据。ASDK SQL 适配器仅支持两种模式\
  \ – Windows 身份验证和 SQL Server 身份验证，但 Client credential type 下拉列表提供四种：\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_77_0.png)\n\
  \n这些选项是通用的，旨在满足不同基于 ASDK 的适配器的要求，因此让我们针对 ASDK SQL 适配器回顾这些选项：\n\n- **None** – 此选项与\
  \ Windows 相同。\n- **Windows** – 适配器将使用 Windows 身份验证连接到 SQL Server。\n- **Username**\
  \ – 适配器将使用 User name 和 Password 字段中提供的凭据连接到 SQL Server。\n- **Certificate** – 即使选择了\
  \ Certificate 选项，适配器也会忽略它并使用 Windows 身份验证。映射到证书的用户不受支持，因此此选项不适用于 ASDK SQL 适配器。\n\
  \n请记住，只有用户有权访问的 SQL Server 对象才会显示在 Consume Adapter Service 向导上。因此，请确保在选择 Windows\
  \ 身份验证模式时，Visual Studio 运行的帐户对项目所需的数据库对象具有适当的访问权限。对于 SQL Server 身份验证指定的用户名也适用相同的情况。\n\
  \n## 连接到 SQL Server URI 属性\n\nURI Properties 选项卡是我们指定构建 SQL Server 连接字符串所需属性值的位置。\n\
  \n例如，要连接到名为 BT2010DEV-PC 的 SQL Server 默认实例上的名为 AdventureWorksCh2 的数据库，运行在默认端口 1433\
  \ 上且没有故障转移服务器，我们可以指定以下内容：\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_78_0.png)\n\
  \n这将映射到以下连接 URI：\n\n```\nmssql://BT2010DEV-PC//AdventureWorksCh2?\n```\n\n> 如果这样更方便，您也可以在主\
  \ Consume Adapter Service 向导窗口的 URI 文本框中输入连接字符串，而不是使用 URI Properties 选项卡。\n\n一般形式下，SQL\
  \ Server 的 URI 连接字符串如下所示：\n\n```\nmssql://[Server_Name[:Portno]]/[SQL_SERVER_Instance_Name]/[Database_Name]?FailoverPartner=[Partner_Server_Name]&InboundId=[Inbound_ID]\n\
  ```\n\n其中：\n\n- 服务器名称 (Server_Name)、端口 ([:Portno]) 和实例名称 ([SQL_SERVER_Instance_Name])\
  \ 确定要连接的 SQL Server 实例，而数据库名称 ([Database_Name]) 指定数据库。如果您连接到 SQL Server 的默认实例，可以将\
  \ SQL_SERVER_Instance_Name 部分留空。\n- 如果 SQL Server 实例还具有在主服务器无响应时由适配器使用的故障转移伙伴，则使用伙伴服务器名称\
  \ ([Partner_Server_Name])。\n- 需要注意的连接 URI 的最后一部分是 InboundID ([Inbound_ID])。使用 TypedPolling\
  \ 操作生成唯一架构并唯一标识相应的接收位置时必须设置它。如果我们使用 InboundID 生成架构，那么在相应的接收位置配置中提供相同的 InboundID\
  \ 也是至关重要的。如果我们不这样做，将会收到运行时错误，指示 BizTalk 无法按消息类型找到文档规范。\n- 在内部，LOB SQL 适配器使用 URI\
  \ 和绑定属性的组合来构建最终的 ADO.NET 连接字符串，如以下博客文章中所述：\n\n```\nhttp://connectedthoughts.wordpress.com/2011/01/18/how-the-wcf-sql-adapter-builds-the-ado-net-connection-string/\n\
  ```\n\n## 绑定属性\n\nBinding Properties 选项卡是我们配置适配器运行时行为的位置：\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_79_0.png)\n\
  \n此选项卡上显示的属性反映在 Consume Adapter Service 向导生成的绑定文件中。对于出站操作，我们通常可以接受默认值，因为默认值对于大多数情况来说是足够的。在默认值不令人满意的情况下，我们始终可以使用\
  \ BizTalk Admin Console 对物理端口进行调整。\n\n对于入站操作，情况稍微复杂一些。由于入站操作的性质，Consume Adapter\
  \ Service 向导不提供默认值，我们必须显式提供配置设置。我们可以在设计时完成，然后导入绑定文件以创建配置的接收位置，或者稍后使用 BizTalk Admin\
  \ Console 提供设置。唯一的例外是用于配置 TypedPolling 入站操作的 PollingStatement 属性。此属性直接影响 Consume\
  \ Adapter Service 向导为操作生成的架构，因此必须在开发时设置。当我们部署应用程序时，我们必须确保接收位置上设置的 PollingStatement\
  \ 属性与我们在开发时使用的一致。如果这听起来令人困惑，请继续阅读。我们在示例部分提供了对 TypedPolling 操作和适用配置属性的详细说明。\n\n##\
  \ 生成架构\n\n完成连接性和绑定设置后，我们单击 OK 关闭 Configure Adapter 窗口并返回到主 Consume Adapter Service\
  \ 窗口。此时，Configure a URI 文本控件包含基于我们在 Configure Adapter 窗口的 URI 选项卡上指定的属性构建的连接 uri\
  \ 字符串。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_80_0.png)\n\n现在我们单击 Connect 按钮；如果连接成功建立，Consume\
  \ Adapter Service 向导将授予我们访问适配器公开的操作的权限：\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_81_0.png)\n\
  \n首先，我们需要在“Select contract type”控件中选择合约类型。然后，在“Available categories and operations”面板中，我们可以选择所需的操作并单击“Add”，将操作添加到“Added\
  \ categories and operations”列表中。收集完所有所需操作后，我们可以单击“OK”关闭向导。此操作将返回到 Visual Studio，您将在其中看到一个或多个\
  \ xsd 架构和一个绑定文件已添加到项目中。如果需要为另一种合约类型生成架构，则必须再次进入 Consume Adapter Service Wizard 并重复该过程。\n\
  \n## BizTalk 管理控制台中的 ASDK SQL 适配器\n\n部署应用程序后，并使用 BizTalk Admin Console 导入由 Consume\
  \ Adapter Service Wizard 为我们生成的绑定文件后，我们可能需要为特定环境调整适配器配置。\n\n### 入站操作\n\n要访问入站场景的适配器属性，我们必须导航到适当的接收位置并双击它以打开\
  \ **Receive Location Properties** 窗口。然后单击 **OK** 打开 **WCF-Custom Transport Properties**\
  \ 多标签对话框。\n\n**General** 选项卡为我们提供了 Address（URI）文本控件以设置或修改连接字符串：\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_82_0.png)\n\
  \n**Bindings** 选项卡顾名思义，是可以访问绑定属性的地方：\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_83_0.png)\n\
  \n名为 Other 的选项卡用于指定访问目标数据库的凭据：\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_83_1.png)\n\
  \n我们可以采用以下选项来指定凭据：\n\n- **None** – 适配器将使用 Windows 身份验证，并使用 Receive Handler 主机实例运行的帐户的身份\n\
  - **User account** – 此选项允许指定用户名和密码以使用 SQL Server 身份验证模式连接到目标数据库\n- **Get credentials\
  \ from affiliate application** – 允许指定 Single Sign-On 关联应用程序以获取凭据\n\n在大多数情况下，您无需处理\
  \ **Behavior**、**Messages** 和 **Import/Export** 选项卡提供的配置选项。如果仍有必要，请参阅 WCF-Custom\
  \ 适配器文档。\n\n### 出站操作\n\n出站场景的配置过程与入站基本相同。您必须找到适当的发送端口，双击它以打开 **Send Port Properties**\
  \ 窗口，然后单击 **Configure** 按钮以打开 **WCF-Custom Transport Properties** 窗口。**General**\
  \ 选项卡为您提供对 URI 连接字符串以及 SOAP 操作的访问。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_84_0.png)\n\
  \n**Credentials** 选项卡如您所猜测，允许您提供访问数据库的凭据：\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_85_0.png)\n\
  \n可用选项如下：\n\n- **Do Not Use Single Sign On** – 如果 User name 和 Password 字段为空，适配器将使用\
  \ Windows 身份验证和 Send Handler 帐户身份连接到数据库。否则适配器将使用 User name 和 Password 控件中指定的凭据使用\
  \ SQL Server 身份验证。\n- **Use Single Sign On** 允许选择 Single Sign On 关联应用程序来提供凭据。\n\n\
  与接收位置一样，**General, Bindings, and Credentials** 选项卡上显示的属性涵盖了大多数配置场景。对于复杂情况，请参阅 WCF-Custom\
  \ 适配器文档。\n\n## WCF-SQL 与 WCF-Custom 适配器\n\n除了 WCF-Custom，代表 ASDK SQL 适配器的 sqlBinding\
  \ 还可以通过随 BizTalk Server 2010 Adapter Pack 安装的专用 WCF-SQL BizTalk 适配器访问。这些适配器之间的区别在于\
  \ WCF-SQL 适配器提供了一个针对 sqlBinding 量身定制的更直观的 UI。例如，通过单击专用 WCF-SQL 适配器 General 选项卡上的\
  \ Configure，我们可以填充一个表来构建连接字符串，而使用通用的 WCF-Custom 则必须直接输入整个字符串，正如您在上一节中看到的那样。\n\n\
  ![](img/23d1402649b6528b085cd6b900a2c9c3_86_0.png)\n\n要在 BizTalk Admin Console 中创建\
  \ WCF-SQL 适配器，我们需要执行以下步骤：\n\n- 1. 右键单击 Adapters，然后选择 New - Adapter.\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_86_1.png)\n\
  - 2. 单击 **Adapter** 下拉列表并选择 **WCF-SQL**。在 **Name** 文本框中输入 **WCF-SQL** 并单击 **OK**\
  \ 按钮：\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_87_0.png)\n\n重要的是要理解，无论您使用 WCF-Custom\
  \ Adapter 还是 WCF-SQL 适配器，都不会丢失功能。使用 WCF-SQL 适配器简化了维护 BizTalk 环境所涉及的管理任务。由于 WCF-Custom\
  \ 适配器可以利用多种不同的绑定，包括 Oracle、SQL、SAP 以及允许我们连接到云的绑定，因此显式创建专用适配器以避免混淆可能是有益的。权衡之处在于，开发时为您生成的绑定文件将无济于事，因为它们使用的是\
  \ WCF-Custom 适配器。归根结底，没有对错之分；您可以根据个人风格和偏好选择其中之一。本章我们依赖 WCF-Custom；在 SAP 章节中，我们将使用专用的\
  \ WCF-SAP 适配器，以便您能够比较方法。为了结束本次讨论，我们想为您提供一个 URL，如果您选择使用 WCF-SQL 适配器并且因此需要手动配置 SOAP\
  \ 操作，您可能会觉得有用。按照位于 http://msdn.microsoft.com/en-US/library/dd788515(v=BTS.10).aspx\
  \ 页面上提供的链接，您将找到 ASDK SQL 适配器支持的操作的 SOAP 操作。\n\n## ASDK SQL 适配器示例\n\n在本节中，我们将介绍 ASDK\
  \ SQL 适配器提供的一些常用操作。我们准备了一些易于遵循的示例，重点关注适配器操作的细节，而不是构建整个 BizTalk 应用程序本身或所使用的 SQL Server\
  \ 对象的细节。\n\n对于这些示例，我们有一个场景，其中销售订单详细信息保存在 SQL Server 数据库中的几个不同表中。生成数据库工件的脚本随本章附带的示例代码一起提供。\n\
  \n示例中使用的三个主要表是 SalesOrderHeader、SalesOrderStatus 和 SalesOrderDetails。\n\nSalesOrderHeader\
  \ 表包含有关订单的基本信息，包括到期时间、发货时间、帐号、CustomerID、SalesPersonID 等：\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_88_0.png)\n\
  \n**SalesOrderStatus** 表从系统集成角度跟踪订单的状态。由于我们不希望 BizTalk 多次处理订单，因此需要管理已消耗的记录。此表允许我们通过在\
  \ **ProcessingIndicator** 字段中指定 GUID 来标记记录正在被处理。当其设置为 NULL 时，表示行需要由 BizTalk Server\
  \ 处理。\n\n**OrderStatus** 列用于标识销售订单处理的各个阶段，而 SalesOrderID 是与实际保存销售订单信息的表的链接：\n\n\
  ![](img/23d1402649b6528b085cd6b900a2c9c3_89_0.png)\n\n**SalesOrderDetail** 表为我们提供了有关订单的一些补充信息，包括\
  \ **UnitPrice**、**Discount**、**CarrierTracking Number** 等：\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_89_1.png)\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_90_0.png)\n\n就设计接收方 T-SQL 代码以避免死锁而言，旧\
  \ SQL 适配器的最佳实践仍然适用于新的 ASDK SQL 适配器。主要区别在于新适配器不需要在存储过程末尾使用 FOR XML，并且它生成的架构更易于配置以进行拆批。旧\
  \ SQL 适配器的最佳实践可以在此处在线找到：http://msdn.microsoft.com/en-us/library/cc507804(BTS.10).aspx\n\
  \n如果适配器调用的 T-SQL 代码无法更改以遵循最佳实践，并且有多个 BizTalk Server 主机实例映射到运行轮询接收位置的主机，则可能会发生 SQL\
  \ Server 死锁或检索到重复数据。在这些情况下，对主机进行集群可以确保解决方案在避免死锁的同时保持高度可用。\n\n有关集群 BizTalk 主机的更多信息，可在此处找到：http://kentweare.blogspot.com/2009/04/clustering-biztalk-hosts.html。\n\
  \n另一个选项是根据您的场景设置适当的事务隔离级别。有关详细信息，请访问此链接 http://msdn.microsoft.com/en-us/library/dd788041(v=bts.10).aspx。\n\
  \n### 示例 1—TypedPolling 和拆批\n\n第一个示例将演示如何使用 ASDK SQL 适配器的 **TypedPolling** 操作来轮询数据库，以查找尚未由\
  \ BizTalk Server 处理的销售订单。\n\n**TypedPolling** 操作是当 BizTalk Server 解决方案需要轮询 SQL Server\
  \ 获取数据时最常用的操作。轮询结果的架构是强类型的，可以轻松用于映射或将其元素提升以进行基于内容的路由。\n\n我们创建了一个存储过程，该过程返回尚未由 BizTalk\
  \ Server 处理的前 100 行。我们稍后将更详细地描述该存储过程。\n\n由于我们已经有了存储过程，如本示例的数据库脚本中提供的那样，我们下一步是生成表示该过程生成的\
  \ resultset 的类型化架构。在 Consume Adapter Service Wizard 中，我们将 **sqlBinding** 设置为绑定并单击\
  \ **Configure** 以打开 **Configure Adapter** 窗口以指定 URI 和绑定属性。在 **URI Properties** 选项卡上，我们设置属性以连接到我们的示例\
  \ **AdventureWorksCh2** 数据库。注意，如果您的 SQL 服务器是本地的，您可以为 **Server** 属性指定 \"localhost\"\
  ：\n\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_91_0.png)\n\n**InboundId** 的值在适配器构建\
  \ TypedPolling 入站操作架构的命名空间时使用，也用于其生成的绑定文件中，该文件包含稍后将使用的 BizTalk 端口配置。此值可确保从同一数据库轮询的多个接收位置之间的连接\
  \ URI 唯一。非常重要的一点是我们配置接收位置时使用的 **InboundId** 必须与在 Consume Adapter Service 向导中使用的相同。否则，我们可以预期会出现\
  \ BizTalk 运行时错误。\n\n**Binding Properties** 选项卡是我们设置支持类型化轮询操作的适配器属性的地方。以下是我们需要设置的一些重要属性：\n\
  \n- 1. **inboundOperationType** 需要为此场景设置。 由于我们有兴趣从 SQL Server 接收强类型结果集，因此需要将此属性的值填充为\
  \ **TypedPolling**。\n- 2. **PolledDataAvailableStatement** 在运行时用于检查是否有可轮询的数据。 如果它在第一列中返回正值，则会执行\
  \ **PollingStatement** 语句。 这种方法的优点是我们可以提供一个轻量级查询来确定是否存在数据，而不是在执行时可能消耗更多资源的更复杂的轮询查询。\
  \ 在此示例中，我们使用查询配置 **PolledDataAvailableStatement**，该查询检查尚未处理的销售订单：\n- 3. 你可能已经注意到我们在语句开头设置了隔离级别，并在\
  \ select 查询上提供了 SQL 提示。 这是为了避免多服务器环境中的死锁。\n\n```\nSET TRANSACTION ISOLATION LEVEL\
  \ READ COMMITTED\nSELECT COUNT(*) FROM Sales.SalesOrderStatus WITH(UPDLOCK ROWLOCK\
  \ READPAST )\nWHERE OrderStatus = 'Pending' AND ProcessingIndicator IS NULL\n```\n\
  \n- 4. PollingStatement 设置是每次 PolledDataAvailableStatement 返回正值时将执行的语句。 开发期间使用的相同\
  \ PollingStatement 必须在配置接收位置时使用。 这是必需的，因为该设置在运行时由适配器使用，以创建与 Consume Adapter Service\
  \ 向导生成的架构匹配的消息。 为本示例的目的，我们将把 PollingStatement 设置为存储过程，该过程返回尚未处理的最初 100 个销售订单并将它们标记为已处理：\n\
  \n```\nexec dbo.usp_GetSalesOrdersToProcess\n```\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_92_0.png)\n\
  \n> 你也可以用分号分隔多个 T-SQL 语句。 例如，如果你有一个用于获取销售订单的存储过程和另一个用于将它们标记为已处理的存储过程，则 PollingStatement\
  \ 可以是：\n> \n> exec dbo.usp_GetSalesOrdersToProcess; exec dbo.usp_UpdateSalesOrdersToProcess\n\
  \n我们的存储过程使用新的 GUID 值更新 ProcessingIndicator 为 NULL 的最初 100 行的 ProcessingIndicator\
  \ 列。 然后它返回 SalesOrderHeader 表中与这 100 行相关的数据。 我们选择在选择它们之前更新我们想要处理的记录。 通过这种方法，我们可以确保控制每次轮询事件想要返回给\
  \ BizTalk 的记录数量。\n以下是存储过程：\n\n```\nCREATE PROCEDURE [dbo].[usp_GetSalesOrdersToProcess]\n\
  AS\nSET nocount on\nset xact_abort on\nSET TRANSACTION ISOLATION LEVEL READ COMMITTED\n\
  \ndeclare @procIndicator uniqueidentifier\nset @procIndicator = NEWID();\n\nUPDATE\
  \ Sales.SalesOrderStatus WITH (ROWLOCK)\nSET ProcessingIndicator = @procIndicator,\n\
  \    OrderStatus ='Processing'\nFROM (\nSELECT TOP 100 SalesOrderID\nFROM  Sales.SalesOrderStatus\
  \ WITH(UPDLOCK ROWLOCK READPAST)\nWHERE ProcessingIndicator IS NULL AND OrderStatus\
  \ ='Pending' ORDER BY SalesOrderID)\nAS t1\nWHERE (Sales.SalesOrderStatus.SalesOrderID\
  \ = t1.SalesOrderID)\n\nSELECT TOP 100 soh.[SalesOrderID], [RevisionNumber]\n, [OrderDate],\
  \ [DueDate]\n, [ShipDate], [Status]\n, [SalesOrderNumber], [PurchaseOrderNumber]\n\
  , [AccountNumber], [CustomerID]\n, [ContactID], [BillToAddressID]\n, [ShipToAddressID],\
  \ [ShipMethodID]\n, [CreditCardApprovalCode], [SubTotal]\n, [TaxAmt], [Freight]\n\
  , [TotalDue], [Comment]\nFROM Sales.SalesOrderHeader soh WITH(UPDLOCK ROWLOCK READPAST)\n\
  INNER JOIN Sales.SalesOrderStatus sos ON soh.SalesOrderID = sos.SalesOrderID\nWHERE\
  \ sos.ProcessingIndicator = @procIndicator\n```\n\n- 5. **PollingIntervalInSeconds**\
  \ 指定 BizTalk Server 将运行设置在 **PolledDataAvailableStatement** 属性上的 SQL 语句的频率。 轮询间隔必须仔细设置，以避免在数据不经常更改时进行不必要的轮询，同时也要以足够高的频率轮询，以便及时捕获更改。\
  \ 我们将其设置为 60 秒。\n- 6. 我们示例中要介绍的最后一个属性是 **PollWhileDataFound**。 我们的目标是从 SQL Server\
  \ 获取 100 个销售订单的批次。 将轮询语句返回的行数限制与 **PollWhileDataFound** 属性（设置为 true 时）结合使用是确保适配器创建多个较小消息的好做法。\
  \ 该技术也很重要，因为 BizTalk Server 可以并行处理多个消息，而不是创建一个大消息。 设置为 true 时，**PollWhileDataFound**\
  \ 属性指示适配器忽略 **PollingInterval** 属性并连续调用轮询语句。 对于我们当前的示例，我们将此属性设置为 **False**，以便我们能清楚地了解\
  \ BizTalk 的轮询行为。 如果我们持续处理所有数据，它将降低我们对 BizTalk 轮询周期的可见性。\n\n以下是为我们的示例配置的 **Binding\
  \ Properties** 选项卡：\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_94_0.png)\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_94_1.png)\n\
  \n在轮询场景中值得特别关注的属性是 **ReceiveTimeout**。 此属性表示适配器等待入站消息的时间量。 Microsoft 文档建议将此属性设置为最大允许值\
  \ 24.20:31:23.6470000（24 天）。 设置这样大的值不会影响适配器的性能。 我们确实需要确保此值超过我们的轮询间隔，以确保在达到此超时阈值之前，我们的\
  \ BizTalk Server(s) 与 SQL Server 之间具有连接性。\n\n有关 ASDK SQL 适配器属性的更多信息，请访问以下 TechNet\
  \ 链接：http://technet.microsoft.com/en-us/library/dd787981(BTS.10).aspx\n\n在设置绑定属性后，我们需要连接到我们的\
  \ SQL Server，选择 **Service (Inbound operations)**，选择根/类别，并添加 **TypedPolling** 操作：\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_95_0.png)\n\n一旦我们按照前一图像所示配置了 Consume\
  \ Adapter Service 向导，我们现在可以单击 **OK** 按钮。 Consume Adapter Service 向导随后将架构添加到 BizTalk\
  \ Server 项目（在本示例中，架构名为 `TypedPolling.SalesOrders.xsd`），并创建包含物理接收端口和位置配置详细信息的绑定文件。\n\
  \n我们在 Typed Polling 场景中使用的架构包括存储过程的结果集的数组。 如果我们希望 BizTalk Server 进一步拆分它，架构很容易配置。\
  \ 我们的存储过程被创建为每次轮询最多返回 100 个销售订单。 我们可以修改适配器创建的架构，以便 XmlDisassembler 管道将这些重复节点中的每一个拆分为单独的消息。\
  \ 第一步是将 <Schema> 节点的 Envelope 属性设置为 Yes：\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_96_0.png)\n\
  \n然后，将 TypedPolling 节点的 Body Xpath 值设置为第一个 TypedPollingResultSet0。 这将告诉 XmlDisassembler\
  \ 此记录下方的任何内容都应拆分为单独的消息：\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_96_1.png)\n\n\
  前两个步骤是在开发期间为 TypedPolling 架构配置其消息以便拆分所需设置的所有内容。\n\n\n\n\n部署解决方案后，由 Consume Adapter\
  \ Service 向导创建的绑定文件可以导入到 BizTalk Administration Console 中，以创建接收端口和接收位置，并包含我们在开发期间创建的所有\
  \ URI 和绑定设置。示例代码中包含整个解决方案的示例绑定文件。\n\n此接收位置随后将轮询尚未处理的销售订单，将其作为批处理传递给 BizTalk Server，并对包含销售订单信息的每条消息进行拆分。以下\
  \ XML 显示了其中一条拆分后的消息：\n\n```\n<TypedPollingResultSet0 xmlns=\"http://schemas.microsoft.com/Sql/2008/05/TypedPolling/SalesOrders\"\
  >\n<SalesOrderID>43669</SalesOrderID>\n<RevisionNumber>10</RevisionNumber>\n<OrderDate>2001-07-01T00:00:00Z</OrderDate>\n\
  <DueDate>2001-07-13T00:00:00Z</DueDate>\n<ShipDate>2001-07-08T00:00:00Z</ShipDate>\n\
  <Status>5</Status>\n<SalesOrderNumber>S043669</SalesOrderNumber>\n<PurchaseOrderNumber>PO14123169936</PurchaseOrderNumber>\n\
  <AccountNumber>10-4020-000578</AccountNumber>\n<CustomerID>578</CustomerID>\n<ContactID>295</ContactID>\n\
  <BillToAddressID>895</BillToAddressID>\n<ShipToAddressID>895</ShipToAddressID>\n\
  <ShipMethodID>5</ShipMethodID>\n<CreditCardApprovalCode>25877Vi80261</CreditCardApprovalCode>\n\
  <SubTotal>881.4687</SubTotal>\n<TaxAmt>70.5175</TaxAmt>\n<Freight>22.0367</Freight>\n\
  <TotalDue>974.0229</TotalDue>\n</TypedPollingResultSet0>\n```\n\n本示例演示了如何使用 ASDK\
  \ SQL Adapter 和 BizTalk Server 的开箱即用功能来轮询并从 SQL Server 中提取数据。\n\n## 示例 2—Select、表值函数和\
  \ Execute Reader\n\n本第二个示例在第一个示例的基础上构建，但重点关注出站操作。我们将通过对其他与销售订单相关的表进行后续调用来扩展场景，以检索数据，从而使用所有必需的销售订单详细信息完成消息。\n\
  \n对于本示例，我们将查询与第一个示例中每个拆分消息相关的其他 SQL Server 对象，以演示一些出站适配器操作，然后构建包含所有销售订单详细信息的最终规范消息。\n\
  \n用于丰富销售订单详细信息的数据库对象如下：\n\n- 名称为 Sales.vSalesOrderDetailProduct 的 SQL 视图，返回包含产品信息的订单行明细。ASDK\
  \ SQL 适配器支持查询 SQL Server 表和视图。使用此方法的一个限制是，我们无法从 ASDK SQL 适配器调用中将视图与其他视图或表进行连接。但是，此问题有解决方案。SQL\
  \ Server 视图可以修改以满足我们可能有的任何额外数据需求。\n- 一个返回联系人详细信息的表值函数 ufnGetContactInformation。从\
  \ BizTalk 的角度来看，表值函数的工作方式类似于存储过程。我们能够提供强类型请求并接收强类型响应。\n- 一个动态 select 语句，将使用 ExecuteReader\
  \ 操作执行以检索额外的客户详细信息。ExecuteReader 操作非常灵活，因为它没有强类型的结果集，并且开发人员在设计时不需要访问表。这种方法的挑战在于它要求\
  \ BizTalk 开发人员处理来自 SQL Server 的未类型化响应消息。如果我们想解析或转换这些响应消息，可能需要我们编写自定义 XSLT。\n\n要为本示例中使用的出站操作生成架构，在建立成功连接后，我们在\
  \ **Select contract type** 下拉列表中设置 **Client(Outbound operations)**。在 **Select a\
  \ category** 面板中，我们展开了 Views 节点，选择 vSalesOrderDetailView 并将 \"Select\" 添加到所需操作列表中。然后，我们添加位于\
  \ **Table Valued Functions** 节点下的 ufnGetContactInformation 函数。最后，我们添加位于 \"/\" 根节点下的\
  \ **ExecuteReader** 操作。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_99_0.png)\n\n\
  我们现在可以单击 OK 按钮关闭向导并生成架构。\n\n首先让我们讨论我们想要在 vSalesOrderDetailProduct 视图上执行的 SELECT\
  \ 操作的架构。要构建 SELECT 语句，ASDK SQL 适配器要求我们在 Select 节点下的 Columns 元素中指定以逗号分隔的所需列。同一节点下的\
  \ Query 元素是指定用于过滤 SELECT 语句结果集的 \"WHERE\" 子句的位置。\n\n架构的响应部分是强类型的，并包含来自 vSalesOrderDetailProduct\
  \ 视图的所有列。请注意，列是用 Min. Occurs. xsd 属性设置为 0 定义的。这意味着适配器返回的响应消息将仅包含 Columns 元素中列出的列：\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_100_0.png)\n\n对于表值函数，Consume Adapter\
  \ Service 向导会生成一个架构，允许我们为函数参数提供值——请注意 ufnGetContactInformation 节点下的 ContactId 元素。架构的响应部分是强类型的，并包含\
  \ ufnGetContactInformation 函数返回的表的定义：\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_100_1.png)\n\
  \n要执行 **ExecuteReader** 操作，我们需要在 **ExecuteReader** 节点下的 **Query** 元素中指定一个 SELECT\
  \ 语句。适配器为此操作生成的响应是 DataSet 节点的数组。架构中每个 DataSet 节点都有两个 <Any> 元素，第一个将具有 DataSet 的架构，第二个将是数据的\
  \ ADO.NET diffgram：\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_101_0.png)\n\n现在我们有了出站操作的架构，我们可以创建一个单一映射，从传入的销售订单头消息中一次性生成所有三个请求消息。要生成多目标映射，我们双击\
  \ Transform 形状，为新映射指定 **Transform.SalesOrder_to_LookupRequests** 名称，然后指定请求和三个响应消息：\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_101_1.png)\n\n一旦我们单击 **OK**，映射设计器就会显示出来，其中包含我们打包在一个目标架构中的三个架构。\n\
  \n以下图像显示了我们在示例应用程序中使用的完全配置的映射：\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_102_0.png)\n\
  \n要设置 **ExecuteReader** 请求消息的 **Query** 属性，我们使用字符串连接函数体构建一个由多个表连接组成的 select 语句，以返回客户的地址信息。然后，我们将源消息中的\
  \ CustomerID 元素链接起来，以使用 WHERE 子句完成该语句：\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_103_0.png)\n\
  \n对于我们想要针对 vSalesOrderDetailsProduct 视图运行的 select 语句，我们需要指定所需的列和 WHERE 子句。字符串连接函数体用于将\
  \ Columns 元素设置为 *。这将告诉适配器应选择视图中的所有列。另一个字符串连接函数体用于填充 Query 元素。我们使用输入架构中的 SalesOrderID\
  \ 元素构建 WHERE 子句，其中 SalesOrderID = SalesOrderID。\n\n最后，我们需要为 ufnGetContactInformation\
  \ 表值函数指定输入参数。此函数只有一个参数：ContactID。因此，我们将源架构中的 ContactID 拖到目标架构的 ContactID 元素。\n\n\
  BizTalk 的一个不错的功能是在编排中重用逻辑端口的能力。这允许我们将逻辑端口绑定到 BizTalk Administration Console 中的单个物理端口，以进行全部三次查找。这减少了我们必须创建和维护的发送端口数量。我们还可以在编排中使用并行形状同时执行全部三个操作。\n\
  \n\n\n## WCF LOB SQL 适配器\n\n为了表示完整的销售订单，我们有一个名为 SalesOrder.xsd 的架构。并行形状完成后，对 SQL\
  \ Server 执行全部三个操作后，我们就可以将它们的响应和原始销售订单头数据映射到最终的 SalesOrder 消息：\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_104_0.png)\n\
  \n这就是 LookupResponses_to_SalesOrder 映射的外观：\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_105_0.png)\n\
  \n如你所见，前面的映射相当直接，除了 ExecuteReaderResponse 节点外。如我们之前讨论的，Execute Reader 操作存在权衡。权衡在于我们的结果集将是无类型的，这意味着我们需要执行一些自定义工作来将此消息转换为强类型消息。为此我们需要编写一些\
  \ XSLT 并使用内联 XSLT 调用模板脚本 functoid 来映射 diffgram 内容：\n\n```\n<xsl:template name=\"\
  AddressTemplate\">\n    <xsl:param name=\"param1\" />\n    <xsl:if test=\"count(//NewTable)\
  \ > 0\">\n        <xsl:element name=\"Addresses\">\n            <xsl:for-each select=\"\
  //NewTable\">\n                <xsl:element name=\"Address\">\n                \
  \    <xsl:if test=\"Name\">\n                        <xsl:element name=\"Name\"\
  >\n                            <xsl:value-of select=\"Name\" />\n              \
  \          </xsl:element>\n                    </xsl:if>\n                    <xsl:if\
  \ test=\"AddressLine1\">\n                        <xsl:element name=\"AddressLine1\"\
  >\n                            <xsl:value-of select=\"AddressLine1\"/>\n       \
  \                 </xsl:element>\n                    </xsl:if>\n              \
  \      <xsl:if test=\"AddressLine2\">\n                        <xsl:element name=\"\
  AddressLine2\">\n                            <xsl:value-of select=\"AddressLine2\"\
  />\n                        </xsl:element>\n                    </xsl:if>\n    \
  \                <xsl:if test=\"City\">\n                        <xsl:element name=\"\
  City\">\n                            <xsl:value-of select=\"City\"/>\n         \
  \               </xsl:element>\n                    </xsl:if>\n                \
  \    <xsl:if test=\"StateProvinceCode\">\n                        <xsl:element name=\"\
  StateProvinceCode\">\n                            <xsl:value-of select=\"StateProvinceCode\"\
  />\n                        </xsl:element>\n                    </xsl:if>\n    \
  \                <xsl:if test=\"Country\">\n                        <xsl:element\
  \ name=\"Country\">\n                            <xsl:value-of select=\"Country\"\
  />\n                        </xsl:element>\n                    </xsl:if>\n    \
  \            </xsl:element>\n            </xsl:for-each>\n        </xsl:element>\n\
  \    </xsl:if>\n</xsl:template>\n```\n\n这就是该示例开发阶段的内容。最终的编排包含两个映射和全部三个并行执行的出站操作，看起来如下：\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_107_0.png)\n\n现在解决方案的开发已完成，我们可以部署它并导入绑定文件，该文件位于本章源代码的\
  \ BindingFiles 文件夹中。此绑定文件创建一个发送端口，由三个操作共享，其绑定属性与创建架构时设置的属性相同。需要重点查看的是 WCF-Custom\
  \ 适配器“常规”选项卡上的 SOAP Action 头属性：\n\n```\n<BtsActionMapping xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\
  \ xmlns:xsd=\"http://www.w3.org/2001/XMLSchema\">\n<Operation Name=\"Select\" Action=\"\
  ViewOp/Select/Sales/vSalesOrderDetailProduct\" />\n<Operation Name=\"ufnGetContactInformation\"\
  \ Action=\"TableFunction/dbo/ufnGetContactInformation\" />\n<Operation Name=\"ExecuteReader\"\
  \ Action=\"GenericOp/ExecuteReader\" />\n</BtsActionMapping>\n```\n\n这提供了操作与 SOAP\
  \ 操作之间的映射。请参阅第 1 章，了解 SOAP 操作和操作如何协同工作的详细信息。\n\n当我们启用解决方案后，几秒钟后我们将收到包含销售订单数据的新消息。以下是处理后的销售订单示例：\n\
  \n```\n<ns0:SalesOrder xmlns:ns0=\"http://Schemas.SalesOrder\" xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\
  >\n<Header>\n<RevisionNumber>28</RevisionNumber>\n<OrderDate>2001-07-01T00:00:00Z</OrderDate>\n\
  <DueDate>2001-07-13T00:00:00Z</DueDate>\n<ShipDate>2001-07-08T00:00:00Z</ShipDate>\n\
  <Status>5</Status>\n<SalesOrderNumber>SO43660</SalesOrderNumber>\n<PurchaseOrderNumber>PO18850127500</PurchaseOrderNumber>\n\
  <AccountNumber>10-4020-000117</AccountNumber>\n<CreditCardApprovalCode>115213Vi29411</CreditCardApprovalCode>\n\
  <SubTotal>1553.1035</SubTotal>\n<TaxAmt>124.2483</TaxAmt>\n<Freight>38.8276</Freight>\n\
  <TotalDue>1716.1794</TotalDue>\n<Contact>\n<FirstName>Takiko</FirstName>\n<LastName>Collins</LastName>\n\
  <JobTitle>Purchasing Manager</JobTitle>\n<ContactType>Store Contact</ContactType>\n\
  <Addresses>\n<Address>\n<Name>Main Office</Name>\n<AddressLine1>6055 Shawnee Industrial\
  \ Way</AddressLine1>\n<City>Suwanee</City>\n<StateProvinceCode>GA </StateProvinceCode>\n\
  <Country>United States</Country>\n</Address>\n</Addresses>\n</Contact>\n</Header>\n\
  <Items>\n<Item>\n<CarrierTrackingNumber>6431-4D57-83</CarrierTrackingNumber>\n<OrderQty>1</OrderQty>\n\
  <UnitPrice>419.4589</UnitPrice>\n<UnitPriceDiscount>0.0000</UnitPriceDiscount>\n\
  <LineTotal>419.458900</LineTotal>\n<ProductName>Road-650 Red, 44</ProductName>\n\
  <ProductNumber>BK-R50R-44</ProductNumber>\n<ProductSize>44</ProductSize>\n<ProductWeight>18.77</ProductWeight>\n\
  <SellEndDate>2003-06-30T00:00:00Z</SellEndDate>\n<SellStartDate>2001-07-01T00:00:00Z</SellStartDate>\n\
  </Item>\n<Item>\n<CarrierTrackingNumber>6431-4D57-83</CarrierTrackingNumber>\n<OrderQty>1</OrderQty>\n\
  <UnitPrice>874.7940</UnitPrice>\n<UnitPriceDiscount>0.0000</UnitPriceDiscount>\n\
  <LineTotal>874.794000</LineTotal>\n<ProductName>Road-450 Red, 52</ProductName>\n\
  <ProductNumber>BK-R68R-52</ProductNumber>\n<ProductSize>52</ProductSize>\n<ProductWeight>17.42</ProductWeight>\n\
  <SellEndDate>2002-06-30T00:00:00Z</SellEndDate>\n<SellStartDate>2001-07-01T00:00:00Z</SellStartDate>\n\
  </Item>\n</Items>\n</ns0:SalesOrder>\n```\n\n## 示例 3—查询通知和多个结果集\n\n在本示例中，我们将介绍 ASDK\
  \ SQL 适配器的两个高级功能。我们将使用查询通知来取代之前示例中用于检索尚未处理的销售订单的类型化轮询。我们还将使用多个结果集来检索销售订单信息并替换示例\
  \ 2 中创建的查找操作。\n\n尽管轮询入站操作非常常见，但轮询原则本身需要一些考虑。在没有数据返回时频繁轮询会浪费系统资源。在有数据返回时轮询不频繁意味着解决方案的效率不如预期。仔细考虑轮询间隔和轮询语句可以缓解这些限制，但通知是一种替代且通常更好的选择。\n\
  \n> ASDK SQL 适配器帮助信息中有一节很好地介绍了通知与轮询之间的差异，可在以下文章中找到：\n> http://msdn.microsoft.com/en-us/library/dd788096(BTS.10).aspx\n\
  \nADO.NET 为 ASDK SQL 适配器提供了一种通知选项：查询通知。查询通知构建在 SQL Server Service Broker 队列之上，并在\
  \ SQL Server 查询结果发生变化时向 BizTalk Server 引发事件。适配器封装了此功能，使用 ADO.NET SqlDependency 通知对象在查询结果更改时接收通知信息。\n\
  \n我们可以在“配置适配器”窗口和“绑定属性”选项卡中配置通知属性。可用的两个属性是 NotificationStatement 和 NotifyOnListenerStart。这些设置对我们在“使用适配器服务向导”中生成的\
  \ SQL 架构没有影响，并在配置接收位置时进行更详细的讨论。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_110_0.png)\n\
  \n输入 Connection URI 后，我们需要单击“连接”，并确保将“服务（入站操作）”选为合约类型，因为查询通知是入站操作。接下来，我们选择“通知”操作并单击“确定”按钮。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_111_0.png)\n\n为“通知”操作创建的架构是通用的，其作用只是告知\
  \ BizTalk Server 解决方案有数据可供处理：\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_111_1.png)\n\
  \n架构的元素与 ADO.NET 关于查询更改接收到的信息相关，包含：\n\n- **Info** – 此单个元素保存 System.Data.SqlClient.SqlNotificationInfo\
  \ 枚举的值，提供有关适配器接收到的通知的附加信息。\n- **Source** – 这将包含 System.Data.SqlClient.SqlNotificationSource\
  \ 枚举的值，表示适配器接收到的通知的来源。\n\n\n\n-   **类型** – 这将包含 System.Data.SqlClient.SqlNotificationType\
  \ 枚举的值。大多数情况下这将是 change，表示通知查询的数据发生了更改。请参阅 MSDN 以获取这些枚举的详细信息。\n\n当我们在接收位置中的 **NotifyOnListenerStart**\
  \ 绑定选项设置为 true 时，适配器会生成一条通知消息，其硬编码值为 Info = ListenerStarted、Source = SqlBinding\
  \ 和 Type = Startup。\n\n我们的编排将过滤掉不需要的通知消息，检索任何待处理的销售订单，然后对销售订单进行拆批。请注意我们如何区分通知模式的全部三个元素。这是因为我们将在此编排中的\
  \ **Decide** 形状中使用它们。以下是编排的开始部分，其中包括我们用来仅过滤插入、更新或侦听器启动通知的表达式：\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_112_0.png)\n\
  \n如果通知符合我们的 decide 形状条件，编排将执行名为 usp_GetSalesOrdersToProcess 的存储过程，以检索待处理的销售订单列表。在拆批之前，通过消息分配形状中的\
  \ Xpath 语句，编排首先通过计算存储过程返回的销售订单数量来检查是否有实际数据需要处理。这很重要，因为触发的通知并不总是意味着有销售订单需要处理，因为我们将\
  \ NotifyOnListenerStart 设置为 True。以下是编排中将订单拆分为单个消息的部分：\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_113_0.png)\n\
  \n我们将响应消息 msgGetSalesOrdersToProcessResp 提供给编排表达式形状中可用的 xpath 方法。此 xpath 表达式将计算存储过程返回的节点数。以下是用于确定是否有需要处理的销售订单的完整表达式：\n\
  \n```\nrecCount = System.Convert.ToInt32(xpath(msgGetSalesOrdersToProcessResp, \"\
  count(/*[local-name()='usp_GetSalesOrdersToProcessResponse' and namespace-uri()='http://schemas.microsoft.com/Sql/2008/05/TypedProcedures/dbo']/*[local-name()='StoredProcedureResultSet0'\
  \ and namespace-uri()='http://schemas.microsoft.com/Sql/2008/05/TypedProcedures/dbo']/*[local-name()='StoredProcedureResultSet0'\
  \ and namespace-uri()='http://schemas.microsoft.com/Sql/2008/05/ProceduresResultSets/dbo/usp_GetSalesOrdersToProcess']')\"\
  ));\n```\n\n> 在 BizTalk 模式编辑器中使用您想要评估的元素的 **Instance XPath** 属性来查找要使用的正确 xpath。该属性在以下页面中进行了描述：\n\
  > http://msdn.microsoft.com/en-us/library/ee253960(BTS.10).aspx\n\n现在我们使用查询通知替代了类型化轮询。开发实现更复杂，但对解决方案所做的更改的主要优势如下：\n\
  \n-   一旦设置了处理指示器，我们的未结销售订单将立即处理\n-   由于不再轮询，对数据库的调用更少，从而将系统资源利用率保持在最低限度\n\n我们对解决方案进行的下一个改进与在发送最终销售订单消息之前如何丰富销售订单信息有关。ASDK\
  \ SQL 适配器的一个强大功能是它可以处理多个结果集。我们创建了一个名为 usp_GetSalesOrderDetails 的存储过程，它接收销售订单 ID\
  \ 并执行三个不同的 select 语句，分别对应 Example2 中的三个查找——函数调用、select 语句和视图调用。以下是存储过程：\n\n```sql\n\
  CREATE PROCEDURE [dbo].[usp_GetSalesOrderDetails]\n@SalesOrderId [int]\nAS\nSET\
  \ NOCOUNT ON\nSET XACT_ABORT ON\nSET TRANSACTION ISOLATION LEVEL READ COMMITTED\n\
  \nDECLARE @ContactId int\n\nSELECT * FROM Sales.vSalesOrderDetailProduct\nWHERE\
  \ SalesOrderID = @SalesOrderId\n\nSELECT\nat.Name, a.AddressLine1\n, a.AddressLine2,\
  \ a.City\n, sp.StateProvinceCode, cr.Name as Country\nFROM\nSales.SalesOrderHeader\
  \ soh\ninner join Sales.Customer c on soh.CustomerID = c.CustomerID\ninner join\
  \ Sales.CustomerAddress ca ON C.CustomerID = ca.CustomerID\ninner join Person.Address\
  \ a ON ca.AddressID = a.AddressID\ninner join Person.AddressType at ON ca.AddressTypeID\
  \ =\nat.AddressTypeID\ninner join Person.StateProvince sp ON a.StateProvinceID =\n\
  sp.StateProvinceID\nINNER JOIN Person.CountryRegion cr ON sp.CountryRegionCode =\n\
  cr.CountryRegionCode\nWHERE soh.SalesOrderID = @SalesOrderId\n\nSELECT @ContactId\
  \ = ContactId FROM Sales.SalesOrderHeader\nWHERE SalesOrderID = @SalesOrderId\n\
  SELECT * FROM dbo.ufnGetContactInformation(@ContactId)\n```\n\nASDK SQL 适配器将处理符合全部三个结果集的模式生成。以下是存储过程模式在\
  \ Consume Adapter Service 向导中作为强类型过程出站操作被选中后的外观。请注意，它在 usp_GetSalesOrderDetails\
  \ 节点下具有 SalesOrderId 作为输入，并返回全部三个强类型结果：\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_115_0.png)\n\
  \n通过创建此存储过程并使用多个结果集功能，我们可以看到以下优势：\n\n-   仅建立一次与数据库的连接即可提取所有销售订单详细信息\n-   为全部三个结果仅创建一种模式，使其在映射中使用更方便\n\
  \n一旦我们丰富了销售订单信息，我们将把来自 SQL Server 的 SQL 响应写入磁盘，以便查看包含三个不同结果集的 XML 文档。\n\n过程中的下一步是使用状态\
  \ \"Processed\" 更新我们的 SalesOrderTable 中已处理的订单。为此，我们有一个非常简单的映射：\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_116_0.png)\n\
  \n我们编排的最后一步是通过 FILE 适配器将 SalesOrderStatus 表更新的结果写入文件文件夹：\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_116_1.png)\n\
  \n解决方案部署后，我们需要配置 SQL 通知接收位置。sqlBinding 设置用于配置查询通知：\n\n-   1. **InboundOperationType**\
  \ 必须设置为 **Notification**。\n-   2. **NotificationStatement**：在此处设置适配器将监视更改的 SQL 语句。当语句的结果发生变化时，适配器会引发通知。在此示例中，我们将使用与\
  \ Example 1 中用于类型化轮询的 **PolledDataAvailableStatement** 非常相似的查询进行配置。对于通知查询，我们使用 select\
  \ 语句来检查尚未处理的销售订单：\n-   3. **NotifyOnListenerStart** 属性在启用接收位置时生成通知。这确保 BizTalk 会在接收位置被禁用期间从\
  \ SQL Server 检索任何更新的数据。在我们的解决方案中，我们希望尽快处理任何未结销售订单，因此我们将保持其设置为 **True**。\n\n```\n\
  SELECT SalesOrderID FROM Sales.SalesOrderStatus\nWHERE ProcessingIndicator IS NULL\
  \ and OrderStatus ='Pending'\n```\n\n按照上述讨论配置后，我们的通知接收位置的绑定属性选项卡如下所示：\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_117_0.png)\n\
  \n## Example 4 – Composite Operations\n\n本章中我们要讨论的最后一个操作是复合操作。复合操作的目的是能够在单个工作单元或事务的上下文中执行多个数据库操作。即使我们调用多个操作，我们也期望所有操作作为一个整体要么全部成功，要么全部失败。想法是如果我们需要插入/更新多个表，我们希望所有插入/更新都成功，否则我们希望回滚操作以使我们的表保持同步。\n\
  \n我们再次进入 Consume Adapter Service 向导。有两个表对我们特别感兴趣：SpecialOffer 和 SpecialOfferProduct。SpecialOfferProduct\
  \ 表将特价优惠和产品联系在一起。我们希望对这两个表都执行插入操作。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_118_0.png)\n\
  \n向导完成后，我们将发现两个对我们感兴趣的模式，它们模拟我们的数据库表：SpecialOffer.xsd 和 SpecialOfferProduct.xsd：\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_119_0.png)\n\n为了构建复合操作，我们需要有一个包含多个根节点的单一架构。在第一个根节点下，我们添加所有操作执行请求架构，在另一个根节点下我们添加所有操作响应架构。根节点的唯一命名约定规则是，操作响应根节点必须与操作根节点相同并后缀为\
  \ 'Response'。对于此示例，我们创建了一个名为 **CompositeSchema.xsd** 的架构，并创建了两个根节点：**Request** 和\
  \ **RequestResponse**。\n\n一旦我们有了根节点，我们就可以使用 BizTalk Server 架构的 Import 属性将两个更新架构导入到复合架构中：\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_120_0.png)\n\n在导入架构后，我们需要确保所有父节点都指定了正确的\
  \ Data Structure Type。如以下图像所示，我们在 Request 根节点下有两个 Insert 节点。在这些 Insert 节点中的每一个中，我们为\
  \ SpecialOffer 请求和 SpecialOfferProduct 请求提供 Data Structure 类型。同样，我们对 RequestResponse\
  \ 节点也做同样的操作：\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_120_1.png)\n\n下面是我们的映射，它将演示如何从单个请求中获取数据并将其拆分到复合架构中的多个请求节点中。当此映射通过\
  \ BizTalk 运行后，我们将以单个事务的形式将数据插入到 **SpecialOffer** 和 **SpecialOfferProduct** 表中：\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_121_0.png)\n\n在我们为复合操作创建的 solicit response\
  \ 发送端口上，我们需要使用一个名为 **CompositeOperation** 的特殊 Action 名称：\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_122_0.png)\n\
  \n另一个需要注意的适配器属性位于 **Binding** 选项卡上，名为 **useAmbientTransaction**，应设置为 **True**。结合在\
  \ SOAP Action 头中提供 CompositeOperation，此属性指示适配器将执行多个操作，并且这些操作必须作为单个事务执行。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_123_0.png)\n\
  \n通过对两个表更新使用复合操作，我们具有以下好处：\n\n- 对两个操作使用相同的事务。这意味着如果出现异常，两者都会回滚。这对我们的解决方案很重要，因为我们希望两个更新一起执行，如果其中一个失败，两者都会回滚。\n\
  - 使用相同的数据库连接。适配器将为复合操作中的所有更新、插入和删除语句使用来自连接池的相同连接，从而最大限度地降低连接池耗尽连接的风险。\n\n现在有了我们的复合架构和将传入请求转换为复合消息的映射，我们可以构建解决方案的其余部分：\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_124_0.png)\n\n在部署应用程序后，我们可以通过复制 ...\\\
  Chapter02\\Example4\\SpecialOffer.xml 文件并将其粘贴到 Chapter02\\Example4\\FileDrop 文件夹来初始化此过程。\n\
  \n如果我们检查 SpecialOffer 和 SpecialOfferProduct 表，我们会发现我们在这两个表中都有 SpecialOfferID 为 182\
  \ 的记录（在您的系统上可能会有所不同，因为 Special_Offer_To_Composite 映射中的第一个脚本化函数化为 SpecialOfferID\
  \ 生成一个随机数），并且时间戳相似。这些记录作为单个事务写入此数据库。预期复合操作运行没有问题，因此 SQL Server 响应中没有传递回数据。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_125_0.png)\n\
  \n## 摘要\n\n在本章中，我们学习了如何使用 ASDK SQL 适配器将 SQL Server 和 BizTalk Server 2010 集成。\n\n\
  BizTalk Server 解决方案经常集成到 SQL Server，本章中的最佳实践和示例应有助于 BizTalk 开发人员在构建集成解决方案时。\n\n\
  在下一章中，我们将研究 BizTalk Server 和 Microsoft Dynamics CRM 的集成。\n"
- "## 3 将 BizTalk Server 与 Microsoft Dynamics CRM 集成\n\n### 将 BizTalk Server 与 Microsoft\
  \ Dynamics CRM 集成\n\nMicrosoft Dynamics CRM 2011 是来自 Microsoft 的最新最强大的关系管理软件。此产品版本引入了对用户界面的广泛改进、新的\
  \ WCF 编程模型、基于角色的表单、数据分析仪表板、与 SharePoint 2010 的紧密集成、Windows Azure 集成等等。任何评估小型或大型\
  \ CRM 项目的人都应考虑 Dynamics CRM 2011。但我们如何使 Dynamics CRM 成为企业环境中集成的一部分？本章重点关注这个问题。\n\
  \n在本章中，我们将介绍：\n\n- 什么是 Microsoft Dynamics CRM 以及它解决了什么问题？\n- 为什么要将 Dynamics CRM\
  \ 与 BizTalk Server 集成\n- BizTalk Server 如何向 Dynamics CRM 发出请求\n- Dynamics CRM 如何向\
  \ BizTalk Server 发送数据\n\n### 什么是 Microsoft Dynamics CRM？\n\n客户关系管理是几乎每个企业的关键部分。Dynamics\
  \ CRM 2011 为 CRM 的三个传统领域提供了解决方案：销售、营销和客户服务。\n\n对于有兴趣管理销售团队的客户，Dynamics CRM 2011\
  \ 具有强大的功能集。这包括将团队组织到区域、定义价格表、管理机会、维护组织结构、跟踪销售渠道、启用移动访问等等。\n\n如果您使用 Dynamics CRM\
  \ 2011 进行营销工作，那么您有能力从多个来源导入数据、计划活动并设置目标列表、创建大规模通信、跟踪活动响应、与销售团队共享线索并分析营销计划的成功情况。\n\
  \nDynamics CRM 2011 还可作为客户服务场景的强大中心。功能包括丰富的账户管理、案例路由和管理、内置知识库、呼叫中心资源调度、称为 Dialogs\
  \ 的脚本化问答工作流、合同管理等。\n\n除了这三个领域之外，Microsoft 将 Dynamics CRM 作为通用应用程序平台 xRM 进行推广，其中“X”代表任何类型的关系管理。Dynamics\
  \ CRM 具有强大的底层框架，用于屏幕设计、安全角色、数据审计、实体定义、工作流和移动性等。无需将这些基础方面构建到每个应用程序中，我们可以在 Dynamics\
  \ CRM 中构建我们的数据驱动应用程序。\n\nMicrosoft 在 Dynamics CRM 2011 的此版本中做出了进入云的大举措。公司历史上首次，产品在线发布（Dynamics\
  \ CRM Online）早于本地软件。应用程序的主机版本运行与本地版本相同的代码库，这意味着为本地实例构建的代码在云中也能正常工作。除了在 CRM 主机上的大举措外，Microsoft\
  \ 还将 Windows Azure 集成融入了 Dynamics CRM 2011。具体来说，我们现在有能力配置对 Azure AppFabric Service\
  \ Bus 端点的调用。为此，下游服务必须实现特定的 WCF 接口，并且在 CRM 中，Azure AppFabric 插件配置为通过 Azure AppFabric\
  \ Service Bus 中继服务调用该下游服务。为了使 BizTalk Server 适应这种模式，我们希望构建一个代理服务，该服务实现所需的 Dynamics\
  \ CRM 2011 接口并将请求转发到 BizTalk Server 端点。本章不会演示此场景，因为重点仅放在与本地实例的集成上。\n\n### 为什么集成\
  \ Dynamics CRM 和 BizTalk Server？\n\n将这两种技术结合在一起有许多原因。请记住，BizTalk Server 是一个企业集成总线，连接不同的应用程序。可能存在将数据囤积在特定应用程序中的自然倾向，但如果我们采用实时消息交换，我们实际上可以拥有一个更敏捷的企业。\n\
  \n\n\n\n考虑这样一种场景：客户的完整“联系历史”分布在多个系统中。Dynamics CRM 2011 联系中心可能仅服务于特定受众，而公司内部的其他系统则保存着有关公司客户的额外详细信息。一种设计选择可能是按计划间隔将这些信息批量加载到\
  \ Dynamics CRM 2011 中。然而，更有效的方法可能是调用 BizTalk Server 服务，该服务汇总跨系统的數據并返回客户与公司历史的综合视图。\n\
  \n类似地，思考一下系统之间如何共享信息。公司的公共网站可能包含一个注册页面，访客可以在此注册以获取更多信息和更深入的内容访问权限。该注册事件与公司内部的多个系统相关。我们可以将初始注册消息发送到\
  \ BizTalk Server，然后将该消息广播给希望了解该客户的多个系统。营销应用程序可能希望通过个性化电子邮件回应，欢迎该人访问网站。销售团队可能会决定跟进该人，如果他们表示对购买产品感兴趣。我们的\
  \ Dynamics CRM 2011 客户服务中心可以选择自动添加注册事件，以便在该客户来电时随时准备就绪。在这种情况下，BizTalk Server 充当数据的中央路由器，并调用已公开的\
  \ Dynamics CRM 服务来创建客户和交易。\n\n在本章剩余部分，我们将了解如何查找驻留在 Dynamics CRM 中的数据、如何将新数据推送到 Dynamics\
  \ CRM，以及如何将数据从 Dynamics CRM 推送出来。\n\n## Communicating from BizTalk Server to Dynamics\
  \ CRM\n\n从 BizTalk Server 向 Dynamics CRM 2011 发送请求的方式在本版本中发生了显著变化。在之前的 Dynamics\
  \ CRM 版本中，可用于与平台通信的 BizTalk“发送”适配器是可用的。Dynamics CRM 2011 不再随附适配器，建议开发人员使用产品公开的 WCF\
  \ 端点。\n\nDynamics CRM 具有 WCF REST 和 SOAP 端点。REST 端点只能在 CRM 应用程序内部使用。例如，您可以构建所谓的\
  \ Web 资源，该资源嵌入在 Dynamics CRM 页面中。该资源可以是 Microsoft Silverlight 或 HTML 页面，从三个不同的 Dynamics\
  \ CRM 实体中查找数据并在页面上汇总它们。此 Web 资源可以与 Dynamics CRM REST API 通信，后者对 JavaScript 客户端友好。不幸的是，您无法从\
  \ Dynamics CRM 环境外部使用 REST 端点，但由于 BizTalk 无法与 REST 服务通信，这对 BizTalk 集成影响不大。\n\n与\
  \ ASMX Web 服务前身不同，Dynamics CRM SOAP API 是静态的，并使用通用的 `Entity` 数据结构运行。不是拥有一个动态 WSDL\
  \ 来公开系统中所有标准和自定义实体的类型定义，Dynamics CRM 2011 SOAP API 拥有一组操作（例如 Create、Retrieve），它们使用单一对象类型运行。`Entity`\
  \ 对象具有一个属性，用于标识其表示的具体对象（例如 Account 或 Contract），以及一个名称/值对集合，表示其表示的对象中的列和值。例如，一个 Entity\
  \ 的 `LogicalName` 可能设置为 \"Account\"，并且具有 \"telephone1\"、\"emailaddress\" 和 \"websiteurl\"\
  \ 的列。\n\n本质上，这意味着从 BizTalk Server 与 Dynamics CRM 2011 交互时，我们有两个选择。我们的第一个选项是直接使用和调用未类型化的\
  \ SOAP API。执行此操作涉及从规范模式创建到无类型 `Entity` 模式的映射。在执行 Retrieve 操作的情况下，我们可能还必须将无类型 Entity\
  \ 消息映射回结构化消息以进行进一步处理。下面，我们将通过一个示例来说明这一点。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_130_0.png)\n\
  \n第二个选项涉及为 BizTalk Server 调用创建类型化代理服务。Dynamics CRM 拥有功能丰富的解决方案开发工具包 (SDK)，允许我们创建类型化对象并将其发送到\
  \ Dynamics CRM SOAP 端点。该代理服务随后将向 BizTalk 公开类型化接口，该接口使用强类型模式按预期运行。即将进行的练习演示了此场景。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_131_0.png)\n\n哪个选择最好？对于简单的解决方案，直接与 Dynamics\
  \ CRM 2011 SOAP API 交互可能是可以的。如果您正在更新实体上的几个字段，或检索一对数据值，则无类型模式的混乱程度值得采用直接的解决方案。然而，如果您对实体进行大规模更改，或获取整个实体并发布到\
  \ BizTalk 总线以供更多订阅者接收，那么严格使用类型化代理服务是最好的选择。然而，我们将在下面查看两种场景，您可以自行做出选择。\n\n## Integrating\
  \ Directly with the Dynamics CRM 2011 SOAP API\n\n在以下一系列步骤中，我们将了解如何在 BizTalk Server\
  \ 中使用本地 Dynamics CRM SOAP 接口。我们首先将了解如何查询 Dynamics CRM 以返回 Entity。之后，我们将了解在 Dynamics\
  \ CRM 中创建新 Entity 的步骤。\n\n### Querying Dynamics CRM from BizTalk Server\n\n在此场景中，BizTalk\
  \ Server 将请求特定 Dynamics CRM “contact” 记录的详细信息，并将查询结果发送到另一个系统。\n\n### Building the\
  \ BizTalk components\n\n在这第一组步骤中，我们定义规范 BizTalk 模式，添加 Dynamics CRM 模式，创建格式之间的映射，并构建将所有部分连接起来的编排：\n\
  \n- 1. 转到本书的代码包并导航到 `C:\\LOBIntegration\\Chapter3-DynamicsCrm`，并打开名为 `Chapter3-DynamicsCrm.sln`\
  \ 的 Visual Studio 2010 解决方案文件。\n- 2. 在 Visual Studio 2010 中，创建一个名为 **Chapter3-DynamicsCRM.AccountInt**\
  \ 的新 BizTalk 项目。此项目将保存此解决方案的所有 BizTalk 工件。右键单击项目，选择 **Properties**，并设置强名称密钥，并将部署应用程序设置为\
  \ **Chapter3**。\n- 3. 右键单击 BizTalk 项目并选择添加新项。选择 (XML) 模式项类型并将模式命名为 `Customer_XML.xsd`。\n\
  - 4. 此模式反映了我们组织对客户的内部定义。对 Dynamics CRM 的查询结果应映射到此结构。我们的客户由标识符、名称、地址集、电话号码集和电子邮件地址定义。以下图像反映了模式的结构：\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_132_0.png)\n\n- 5. 添加对 Dynamics CRM SOAP\
  \ 端点的引用，以便生成我们需要用于使用服务的工件。Dynamics CRM 2011 实例的 WCF SOAP 端点形式为：`http://<server name>/<instance\
  \ name>/XRMServices/2011/Organization.svc`\n- 6. 右键单击 BizTalk 项目并选择 **Add** 然后 **Add\
  \ Generated Items**。选择 **Consume WCF Service**。在 BizTalk WCF 服务使用向导的 **Metadata\
  \ source** 页面上，选择元数据的来源为 **Metadata Exchange (MEX) endpoint**。在向导的 **Metadata Endpoint**\
  \ 页面上，输入您的 Dynamics CRM SOAP 端点的 URL。单击 **Metadata Address (URL)** 旁边的 **Get** 按钮后，移动到向导的下一页并单击\
  \ **Import**。\n- 7. 向导向 BizTalk 项目添加大量文件。这包括两个绑定文件、一个编排（包括消息和编排端口定义），以及七个表示此服务使用的数据类型的模式。\n\
  - 8. 不幸的是，为此端点生成的模式被认为无效。它们彼此之间没有正确的链接，并且在打开其中一个时会出现错误。您可以手动更正每个模式，或者，更好的是，利用可以从\
  \ Microsoft 网站下载的 Dynamics CRM SDK 中包含的有效 BizTalk 模式。\n- 9. 删除服务引用添加的七个 XSD 模式。\n\
  - 10. 右键单击 BizTalk 项目并选择 **Add** 然后 **Existing Item**。导航到您已解压 Dynamics CRM SDK 包的位置，找到\
  \ `sdk\\schemas\\crmbiztalkintegration` 文件夹并选择七个 \"organizationservice\" 模式，然后单击\
  \ **Add**。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_133_0.png)\n\n\n\n- 11. 不幸的是，通过\
  \ Dynamics CRM 服务引用生成的编排现在会因新架构与生成的架构相比类型名称的微小变化而出现错误。既然我们最终会替换所有架构并导致编排损坏，为什么还要费力添加服务引用呢？仍然添加服务引用的一个好处是获取绑定文件。Dynamics\
  \ CRM 端点具有特定的配置，这些配置与标准的 BizTalk WCF 绑定并不完全匹配。这些绑定文件使我们第一次就能更轻松地正确配置 Dynamics CRM\
  \ 发送端口。注意，在实际操作中，最好构建一个包含 Dynamics CRM 架构的单个项目，并在未来的项目中引用它。\n\n- 12. 从 BizTalk 项目中排除生成的编排并构建项目，以确认添加的架构有效。\n\
  \n- 13. 右键单击 BizTalk 项目并选择添加新项。选择 **Map** 类型并将其命名为 `Customer_To_CrmContactQuery.btm`，然后单击\
  \ **Add**。\n\n- 14. 对于源架构，选择 `Chapter3-DynamicsCRM.AccountInt.Customer_XML` 消息类型。此映射接收\
  \ `Customer` 消息类型，最初仅在 `ID` 字段中包含值。当从 Dynamics CRM 收到响应时，我们将填充 `Customer` 消息其余节点的。\n\
  \n- 15. 对于目标架构，选择 `Chapter3-DynamicsCRM.AccountInt.organizationservice_schemas_microsoft_com_xrm_2011_contracts_services`\
  \ 消息类型。提示时，选择 `Retrieve` 作为根节点。我们的映射现在看起来像以下图像：\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_134_0.png)\n\
  \n- 16. 如前所述，Dynamics CRM 的 `Retrieve` 架构是无类型的。提供正在查询的实体的名称（`entityName`）、目标记录的唯一\
  \ ID（`id`），以及我们想要的具体属性的列表（`Columns`）或请求记录的所有属性（`AllColumns`）。\n\n- 17. 我们可以通过在 BizTalk\
  \ Mapper 的 **Properties** 窗口中设置节点的 value 属性来硬编码 `entityName` 值，但这些设置以后可能很难找到。一种通过\
  \ functoid 视觉上表示默认节点值的方法。从 Visual Studio 2010 工具箱中，打开 **Advanced Functoids** 选项卡并将\
  \ **Value Mapping** functoid 拖到映射网格中。通过双击打开 functoid，并将第一个参数的值设置为 `true`（使其始终适用），并将\
  \ **Result** 值设置为 `contact`（这是 Dynamics CRM 实体的正式名称）。最后，将 functoid 的输出拖到目标架构中的 `entityName`\
  \ 节点。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_135_0.png)\n\n- 18. 如上所述，源架构中最初包含值的唯一字段是\
  \ ID 字段。将该源字段映射到目标中的 id 字段。请注意，由于目标字段 id 附带了一个查找 GUID 格式的模式，请将源节点的 Value 属性设置为有效的\
  \ GUID，以便映射可以成功测试。不要担心在运行时引入副作用，因为在 Visual Studio 2010 之外对源架构节点设置的任何 Value 都会被忽略。但是，请注意，设置目标架构节点的\
  \ Value 属性确实会导致该值在运行时推送到映射的消息中。\n\n- 19. Dynamics CRM 联系人对象中有 146 个字段，因此选择返回所有列可能过于冗余。如果确实想要检索所有列，只需将目标架构的\
  \ AllColumns 节点设置为 true 即可。但是，在本例中，我们将只请求特定列。为了在 Columns 节点下生成重复元素，请编写一些自定义 XSLT。从\
  \ Visual Studio 2010 工具箱中，在 Advanced Functoids 下，将 Scripting functoid 拖到映射网格中。\n\
  \n- 20. 双击 functoid 并切换到 Script Functoid Configuration 选项卡。由于此自定义 XSLT 没有源架构输入，且目标是发出一组\
  \ XML 元素，因此选择 Inline XSLT 选项。输入以下 XML 以仅检索所需的列。请注意显式的命名空间声明，以正确“键入”字符串并防止服务调用期间出现错误：\n\
  \n```\n<string xmlns=\"http://schemas.microsoft.com/2003/10/Serialization/Arrays\"\
  >salutation</string>\n<string xmlns=\"http://schemas.microsoft.com/2003/10/Serialization/Arrays\"\
  >firstname</string>\n<string xmlns=\"http://schemas.microsoft.com/2003/10/Serialization/Arrays\"\
  >middlename</string>\n<string xmlns=\"http://schemas.microsoft.com/2003/10/Serialization/Arrays\"\
  >lastname</string>\n<string xmlns=\"http://schemas.microsoft.com/2003/10/Serialization/Arrays\"\
  >address1_addresstypecode</string>\n<string xmlns=\"http://schemas.microsoft.com/2003/10/Serialization/Arrays\"\
  >address1_line1</string>\n<string xmlns=\"http://schemas.microsoft.com/2003/10/Serialization/Arrays\"\
  >address1_city</string>\n<string xmlns=\"http://schemas.microsoft.com/2003/10/Serialization/Arrays\"\
  >address1_stateorprovince</string>\n<string xmlns=\"http://schemas.microsoft.com/2003/10/Serialization/Arrays\"\
  >address1_postalcode</string>\n<string xmlns=\"http://schemas.microsoft.com/2003/10/Serialization/Arrays\"\
  >telephone1</string>\n<string xmlns=\"http://schemas.microsoft.com/2003/10/Serialization/Arrays\"\
  >emailaddress1</string>\n```\n\n- 21. 保存并关闭映射。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_137_0.png)\n\
  \n- 22. 右键单击 BizTalk 项目并添加新项。选择 Map 类型，将名称设置为 CrmContact_To_Customer.btm。\n\n- 23.\
  \ 对于源架构，选择 Chapter3-DynamicsCRM.AccountInt.organizationservice_schemas_microsoft_com_xrm_2011_contracts_services\
  \ 类型并选择 RetrieveResponse 作为根。\n\n- 24. 对于目标架构，选择 `Chapter3-DynamicsCRM.AccountInt.Customer_XML`\
  \ 消息类型。生成的映射将如下所示：\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_138_0.png)\n\n- 25.\
  \ 从 Dynamics CRM 返回的消息（即此映射的源）包含返回实体的字段和值的数组。`Attributes` 节点包含实体的所有值。当涉及选项集或值列表时（例如\
  \ `addresstypecode`），Attributes 值将为“1”，而 `FormattedValues` 节点（包含选项集值的更友好表示）将为 `addresstypecode`\
  \ 提供一个条目，其值将为“Default Value”。\n\n- 26. 为了将重复的 `KeyValuePairOfstringanyType` 映射到结构化的目标字段，我们可以构建一个长的自定义\
  \ XSLT 块、每个部分的单独 XSLT 块，或尝试使用其他 functoid（例如使用 **Value Mapping** 的 **Logical** functoid）来匹配重复的源节点与目标节点。在本示例中，构建单独的\
  \ XSLT 块以填充整个目标架构。\n\n- 27. 将 Scripting functoid 拖到映射表面并将其设置为使用 **Inline XSLT**。此\
  \ functoid 连接到目标 ID 节点，且没有来自源字段的链接。此 functoid 的 XSLT 查找与持有 `contactid` 值的 `key`\
  \ 节点关联的 `value` 节点。\n\n```\n<ID>\n<xsl:value-of select=\"//*[local-name()='KeyValuePairOfstringanyType']/*[local-name()='key']='contactid']/*[local-name()='value']\"\
  />\n</ID>\n```\n\n- 28. 接下来，将另一个 Scripting functoid 拖到映射表面并将其也设置为使用 Inline XSLT。将其连接到\
  \ Name 目标节点。与之前的 functoid 类似，它将找到 Name 下每个元素对应的 key 节点的 value 节点。以下是检索请求值的 XSLT\
  \ 部分的突出显示。\n\n```\n<Name>\n<Prefix>\n<xsl:value-of select=\"//*[local-name()='KeyValuePairOfstringanyType']/*[local-name()='key']='salutation']/*[local-name()='value']\"\
  />\n</Prefix>\n<FirstName>\n<xsl:value-of select=\"//*[local-name()='KeyValuePairOfstringanyType']/*[local-name()='key']='firstname']/*[local-name()='value']\"\
  />\n</FirstName>\n<MiddleName>\n<xsl:value-of select=\"//*[local-name()='KeyValuePairOfstringanyType']/*[local-name()='key']='middlename']/*[local-name()='value']\"\
  />\n</MiddleName>\n<LastName>\n<xsl:value-of select=\"//*[local-name()='KeyValuePairOfstringanyType']/*[local-name()='key']='lastname']/*[local-name()='value']\"\
  />\n</LastName>\n</Name>\n```\n\n- 29. 添加另一个使用 Inline XSLT 的 Scripting functoid，并将其连接到名为\
  \ Addresses 的目标节点：\n\n```\n<Addresses>\n<Address>\n<Type>\n<xsl:value-of select=\"\
  //*[local-name()='KeyValuePairOfstringstring']/*[local-name()='key']='address1_addresstypecode']/*[local-name()='value']\"\
  />\n</Type>\n<Street>\n<xsl:value-of select=\"//*[local-name()='KeyValuePairOfstringanyType']/*[local-name()='key']='address1_line1']/*[local-name()='value']\"\
  />\n</Street>\n```\n\n```\n<City>\n<xsl:value-of select=\"//*[local-name()='KeyValuePairOfstringanyType']/*[local-name()='key']='address1_city']/*[local-name()='value']\"\
  />\n</City>\n<State>\n<xsl:value-of select=\"//*[local-name()='KeyValuePairOfstringanyType']/*[local-name()='key']='address1_stateorprovince']/*[local-name()='value']\"\
  />\n</State>\n<PostalCode>\n<xsl:value-of select=\"//*[local-name()='KeyValuePairOfstringanyType']/*[local-name()='key']='address1_postalcode']/*[local-name()='value']\"\
  />\n</PostalCode>\n</Address>\n</Addresses>\n```\n\n30. 接下来，添加一个利用**内联 XSLT**并连接到\
  \ PhoneNumbers 节点的 Scripting 函数体：\n\n```\n<PhoneNumbers>\n<PhoneNumber>\n<Type>Business</Type>\n\
  <Number>\n<xsl:value-of select=\"//*[local-name()='KeyValuePairOfstringanyType']/*[local-name()='key']='telephone1']/*[local-name()='value']\"\
  />\n</Number>\n</PhoneNumber>\n</PhoneNumbers>\n```\n\n31. 最后，添加一个使用**内联 XSLT**并连接到目标架构中\
  \ EmailAddress 节点的 Scripting 函数体：\n\n```\n<EmailAddress>\n<xsl:value-of select=\"\
  //*[local-name()='KeyValuePairOfstringanyType']/*[local-name()='key']='emailaddress1']/*[local-name()='value']\"\
  />\n</EmailAddress>\n```\n\n32. 最终的映射如下图所示：\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_141_0.png)\n\
  \n33. 此服务将由 BizTalk 协调流程使用，因此右键单击 BizTalk 项目并添加新项。选择协调流程并将名称设置为 QueryCrmCustomer.odx。此解决方案可以通过消息传递直接使用服务（无需协调流程），但由于生成的\
  \ BizTalk 发送端口将具有多个可能的调用操作（例如 Create、Retrieve、Update），因此协调流程是设置目标操作的最简单方法。\n\n34.\
  \ 创建四个协调流程消息：类型为 Chapter3-DynamicsCRM.AccountInt.Customer_XML 的 Customer_Input，类型为\
  \ Chapter3-DynamicsCRM.AccountInt.Customer_XML 的 Customer_Output，类型为 Chapter3-DynamicsCRM.AccountInt.organizationservice_schemas_microsoft_com_xrm_2011_contracts_services.Retrieve\
  \ 的 ContactRetrieve_Request 以及类型为 Chapter3-DynamicsCRM.AccountInt.organizationservice_schemas_microsoft_com_xrm_2011_contracts_services.RetrieveResponse\
  \ 的 ContactRetrieve_Response。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_141_1.png)\n\
  \n- 35. 勾画出一个协调流程：接收消息、转换消息、向服务发送请求、接收响应、转换响应并发送最终消息。顶部的 Receive 形状，名为**接收请求**，与\
  \ `Customer_Input` 消息关联。名为**构造查询**的 Construct 形状构建 `ContactRetrieve_Request` 消息。Transform\
  \ 形状使用之前构建的 **Customer_To_CrmContactQuery** 映射。下一个名为**发送请求**的 Send 形状使用 `ContactRetrieve_Request`\
  \ 消息，而其后的名为**接收结果**的 Receive 形状获取 `ContactRetrieve_Response` 消息。下一个名为**构造输出**的 Construct\
  \ 形状构建 `Customer_Output` 消息。其 Transform 形状使用 **CrmContact_To_Customer** 映射，其中 Transform\
  \ 目标设置为 `Customer_Output`。最后，名为**发送结果**的 Send 形状与 `Customer_Output` 消息关联。\n- \n\
  - 36. 添加一个单向协调流程端口，用于接收消息并与**接收请求**形状关联。\n- \n- 37. 添加一个单向协调流程端口，用于发送消息并连接到**发送结果**形状。\n\
  - \n- 38. 创建一个双向协调流程端口，用于发送消息并接收响应。确保将此端口的操作名称设置为**检索**。此处的操作名称必须与正在调用的 Dynamics\
  \ CRM Web 服务方法的操作名称相对应。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_142_0.png)\n\
  \n39. 构建并部署 BizTalk 项目。\n\n我们现在拥有配置完成解决方案的消息端口所需的组件。\n\n## 配置 BizTalk 端点\n\n在本练习的这一部分，我们将配置\
  \ BizTalk 消息端口，这些端口接收查询请求、调用 Dynamics CRM 2011、转换响应消息，并通过 FILE 适配器将规范的 Customer\
  \ 消息写入磁盘。\n\n- 1. 打开 BizTalk 管理控制台并找到 Chapter3 应用程序。\n- 2. 向应用程序添加一个新的接收端口（Chapter3.PickupCustomerQuery）和接收位置（Chapter3.PickupCustomerQuery.FILE），该位置将从文件系统接收“查询请求”消息。\n\
  - 3. 右键单击 Chapter3 应用程序并选择导入然后绑定。将指向由引用 Dynamics CRM Web 服务生成的 OrganizationService_Custom.BindingInfo.xml\
  \ 绑定文件，该文件现在位于 Visual Studio 中的 BizTalk 项目内。导入完成后，将显示一个新的发送端口。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_143_0.png)\n\
  \n- 4. 双击新的发送端口以查看其设置。请注意，它使用 WCF-Custom 适配器并应用自定义 WCF 绑定。服务使用发送端口主机实例的凭据调用，因此我们无需向发送端口本身添加凭据。\n\
  - 5. 添加一个新的发送端口，用于发出 Dynamics CRM 响应消息。此单向发送端口使用 FILE 适配器并将消息发送到文件系统。\n\n- 6. 消息端口就位后，我们现在将协调流程绑定到这些端口。查看\
  \ Chapter3 应用程序中的 Orchestrations 文件夹并双击 QueryCrmCustomer 协调流程。\n- 7. 将协调流程绑定到主机、\
  \ newly 创建的接收端口、生成的发送端口和 FILE 发送端口。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_144_0.png)\n\
  \n- 8. 启动接收位置、发送端口和协调流程。\n\n我们现在拥有用于接收“查询”消息的通道、调用 Dynamics CRM 2011 的发送端口以及发送服务结果的发送端口。\n\
  \n请记住，发送到 Dynamics CRM 的查询消息中的主字段是记录的 ID。因此，需要一个 Customer 消息的 XML 实例，其中仅填充 ID 值。\n\
  \n- 1. 导航到您的 Dynamics CRM 2011 实例并打开您要查询的客户记录。查看浏览器中的地址并检索记录的 GUID 并删除 URL 编码。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_145_0.png)\n\n2. 将记录 ID 添加到 Customer_XML\
  \ 消息生成的实例的 ID 字段中。\n\n```\n<ns0:Customer xmlns:ns0=\"http://Chapter3-DynamicsCRM.AccountInt.Customer_XML\"\
  >\n  <ID>C210E386-D58A-E011-A552-000C29D4FA55</ID>\n  <Name>\n    <Prefix />\n \
  \   <FirstName />\n    <MiddleName />\n    <LastName />\n  </Name>\n  <Addresses>\n\
  ```\n\n3. 将 XML 实例文件复制到 BizTalk 接收位置轮询的文件夹中。\n\n4. 查看发送端口传输最终消息的文件夹。我们应该看到一条消息，其中包含从\
  \ Dynamics CRM 格式化的值，格式为 `Customer_XML` 消息。\n\n```\n<ns0:Customer xmlns:ns0=\"http://Chapter3-DynamicsCR\n\
  \  <ID>c210e386-d58a-e011-a552-000c29d4fa55</ID>\n  <Name>\n    <Prefix>Mr.</Prefix>\n\
  \    <FirstName>Richard</FirstName>\n    <MiddleName>L.</MiddleName>\n    <LastName>Seroter</LastName>\n\
  \  </Name>\n  <Addresses>\n    <Address>\n      <Type>Primary</Type>\n      <Street>1\
  \ West Avenue</Street>\n      <City>Simi Valley</City>\n      <State>CA</State>\n\
  \      <PostalCode>93065</PostalCode>\n    </Address>\n  </Addresses>\n  <PhoneNumbers>\n\
  \    <PhoneNumber>\n      <Type>Business</Type>\n      <Number>800-111-2222</Number>\n\
  \    </PhoneNumber>\n  </PhoneNumbers>\n  <EmailAddress>rseroter@riley corp.com</EmailAddress>\n\
  </ns0:Customer>\n```\n\n我们在这里看到的是如何创建到 Dynamics CRM “retrieve” 消息的映射，如何将该查询的非结构化结果放入结构化格式，以及如何设置\
  \ BizTalk 组件以路由和调用请求。接下来，我们将看到如何从 BizTalk Server 向 Dynamics CRM 添加记录。\n\n## 从 BizTalk\
  \ Server 向 Dynamics CRM 添加新记录\n\n我们已经看到与 Dynamics CRM 2011 SOAP 端点关联的无类型架构如何使映射变得具有挑战性。具体来说，我们刚刚看到如何从\
  \ DynamicsCRM 获取无类型消息并将其转换为结构化、规范架构。但如果要将规范架构映射到无类型消息呢？在本练习中，我们将获取 `Customer_XML`\
  \ 消息并将其映射到 Dynamics CRM `Create` 消息，并在我们的 DynamicsCRM 实例中添加一条记录。\n\n## 构建 BizTalk\
  \ 组件\n\n本练习基于前一个练习。在此步骤中，我们将定义一个新的映射并构建一个调用 Dynamics CRM `Create` 操作的协调流程：\n\n-\
  \ 1. 右键单击 BizTalk 项目并添加新项。选择 **Map** 类型并将映射命名为 `Customer_To_CrmContactCreate.btm`。\n\
  - 2. 将映射的源设置为 `Customer_XML` 消息类型。对于目标架构，选择 `organizationservice_schemas_microsoft_com_xrm_2011_contracts_services`\
  \ 类型并选择 Create 消息。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_147_0.png)\n\n3.\
  \ 在本例中，我们必须将每个源字段复制到重复的 `KeyValuePairOfstringanyType` 节点。我们将利用 BizTalk Server 2010\
  \ 的功能，该功能允许您将映射方面整齐地分割为称为页面的逻辑容器。将第一个页面重命名为 **Entity Name**。\n\n从映射表面上的 **Advanced\
  \ Functoids** 选项卡拖动 **Value Mapping** functoid。双击 **Value Mapping** functoid，并手动将第一个参数（**Condition**）的值设置为\
  \ **true**，并手动将 **Result** 参数设置为 **contact**。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_147_1.png)\n\
  \n4. 在映射中创建一个新页面并将页面命名为 **Looping**。虽然我们可以选择仅使用自定义 XSLT 来构建目标架构，但本练习展示了如何使用 BizTalk\
  \ functoid 使该任务变得更轻松。如果将一组节点连接到 **Looping** functoid，然后将 Looping functoid 的输出连接到目标节点，您就可以创建一个环境，让我们将源中的各个节点复制到目标的重复节点中。从工具箱的\
  \ **Advanced Functoids** 部分拖动 **Looping** functoid 到映射上。将以下节点连接到它：`Prefix, FirstName,\
  \ MiddleName, LastName, [Address] Type, Street, City, State, PostalCode, Number,\
  \ EmailAddress.`\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_148_0.png)\n\n5. 创建另一个名为\
  \ **Any Pairs** 的映射页面。在此页面上，将各个节点连接到重复的目标节点。然而，有一些注意事项。首先，`KeyValuePairOfstringanyType`\
  \ 下的 `key` 节点期望保存 Dynamics CRM 实体属性的名称。我们的规范架构与 Dynamics CRM 实体属性的名称并不完全匹配。因此，我们必须进行一些转换以设置正确的值。此外，由于\
  \ `KeyValuePairOfstringanyType` 可以将任何数据类型作为列值保存，因此在创建时必须显式“键入” `value` 节点。例如，对于字符串值，我们必须添加一个“string”属性。\n\
  \n6. 将 Scripting functoid 拖到映射表面并将其连接到 `Prefix` 源节点和 `key` 目标节点。将 **Script type**\
  \ 设置为 **Inline XSLT Call Template**。添加下面的 XSLT。请注意，`xsi:type` 属性已添加到 `value` 节点中，并且类型设置为\
  \ `xs:string`：\n\n```\n<xsl:template name=\"SetPrefixValue\">\n<xsl:param name=\"\
  param1\" />\n<key xmlns=\"http://schemas.datacontract.org/2004/07/System.Collections.Generic\"\
  >salutation</key>\n<value xmlns=\"http://schemas.datacontract.org/2004/07/System.Collections.Generic\"\
  \ xmlns:xs=\"http://www.w3.org/2001/XMLSchema\" xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\
  >\n<xsl:attribute name=\"xsi:type\">\n<xsl:value-of select=\"xs:string\" />\n</xsl:attribute>\n\
  <xsl:value-of select=\"$param1\" />\n</value>\n</xsl:template>\n```\n\n7. 对之前连接到循环\
  \ functoid 的每个源节点重复此过程，并确保为每个脚本使用不同的 XSLT 模板名称。列表中排除的是 [Address] Type 节点，该节点必须以不同的方式处理，正如我们稍后将看到的那样。请注意，我的映射如下：\n\
  \n| 源节点 | XSLT 模板名称 | CRM 键名称 |\n|-------------|--------------------|--------------|\n\
  | Prefix | SetPrefixValue | salutation |\n| FirstName | SetFNameValue | firstname\
  \ |\n| MiddleName | SetMNameValue | middlename |\n| LastName | SetLNameValue | lastname\
  \ |\n| Street | SetStreetValue | address1_line1 |\n| City | SetCityValue | address1_city\
  \ |\n| State | SetStateValue | address1_stateorprovince |\n| PostalCode | SetPostalValue\
  \ | address1_postalcode |\n| Number | SetPhoneValue | telephone1 |\n| EmailAddress\
  \ | SetEmailValue | emailaddress1 |\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_149_0.png)\n\
  \n8. 现在我们准备处理 Address Type 属性，该属性不是字符串，而是值列表中的一个条目（称为 Option Sets）。将新的 Scripting\
  \ functoid 拖到映射表面并将其设置为使用 **Inline XSLT Call Template**。添加以下 XSLT：\n\n```\n<xsl:template\
  \ name=\"SetAddrTypeValue\">\n<xsl:param name=\"param1\" />\n<key xmlns=\"http://schemas.datacontract.org/2004/07/System.Collections.Generic\"\
  >address1_addresstypecode</key>\n<value xmlns=\"http://schemas.datacontract.org/2004/07/System.Collections.Generic\"\
  \n    xmlns:xs=\"http://www.w3.org/2001/XMLSchema\"\n    xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\
  \n    xmlns:a=\"http://schemas.microsoft.com/xrm/2011/Contracts\">\n    <xsl:attribute\
  \ name=\"xsi:type\"><xsl:value-of select=\"'a:OptionSetValue'\" /></xsl:attribute>\n\
  \    <Value xmlns=\"http://schemas.microsoft.com/xrm/2011/Contracts\"><xsl:value-of\
  \ select=\"$param1\" /></Value>\n    </value>\n</xsl:template>\n```\n\n9. 将 Address\
  \ 节点下的 Type 节点连接到此 functoid，并将 functoid 的另一端连接到 KeyValuePairOfstringanyType 下的 key\
  \ 节点。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_150_0.png)\n\n- 10. 映射完成后，最后的任务是构建一个消耗\
  \ Dynamics CRM 服务并发出结果的编排。在本例中，对 Create 操作的调用结果是一个 GUID，表示新记录的唯一 ID。在此 BizTalk 项目中添加一个名为\
  \ `CreateCrmCustomer.odx` 的新编排。\n- 11. 创建三个编排消息：类型为 `Chapter3-DynamicsCRM.AccountInt.Customer_XML`\
  \ 的 `Customer_Input`、类型为 `Chapter3-DynamicsCRM.AccountInt.organizationservice_schemas_microsoft_com_xrm_2011_contracts_services.Create`\
  \ 的 `ContactCreate_Request`，以及类型为 `Chapter3-DynamicsCRM.AccountInt.organizationservice_schemas_microsoft_com_xrm_2011_contracts_services.CreateResponse`\
  \ 的 `ContactCreate_Response`。\n- 12. 构建一个编排流程，该流程接收消息、转换消息、向服务发送请求、接收响应并发送最终消息。顶部的\
  \ Receive 形状，名为 **Receive Request**，与 `Customer_Input` 消息关联。名为 **Construct Create**\
  \ 的 Construct 形状构建 `ContactCreate_Request` 消息。Transform 形状使用刚刚构建的 **Customer_To_CrmContactCreate**\
  \ 映射。下一个名为 **Send Request** 的 Send 形状使用 `ContactCreate_Request` 消息，而其后的名为 **Receive\
  \ Result** 的 Receive 形状则获取 `ContactCreate_Response` 消息。最后的名为 **Send Result** 的 Send\
  \ 形状也使用 `ContactCreate_Response` 消息。\n- 13. 添加一个单向编排端口，该端口接收消息并与 **Receive Request**\
  \ 形状绑定。\n- 14. 添加一个单向编排端口，该端口发送消息并连接到 **Send Result** 形状。\n- 15. 创建一个双向编排端口，该端口发送消息并接收响应。将此端口的\
  \ Operation 名称设置为 **Create**。请记住，此处的操作名称必须与正在调用的 Dynamics CRM Web 服务方法的操作名称相对应。\n\
  - 16. 构建并部署 BizTalk 项目。\n\n我们现在已构建了映射和编排，以便成功调用此服务。\n\n## 配置 BizTalk 端点\n\n我们的最终任务是配置\
  \ BizTalk 消息组件以向 Dynamics CRM 服务发送消息。由于上一次练习，我们已经有一系列可重用的端口配置，可以在此次利用它们。\n\n- 1.\
  \ 打开 BizTalk 管理控制台并确认应用程序的更新已成功部署。可以通过在 **Chapter3** 应用程序下的 **Orchestrations** 文件夹中查找我们的新编排来确认。\n\
  - 2. 双击编排以将其绑定到消息端口。\n- 3. 设置主机值，对于初始接收端口，重用上一次练习中创建的端口。当接收端口绑定到编排时，结果订阅会同时查看端口的名称和传入的消息类型。因此，在本例中，由于我们对两种类型都使用\
  \ `Customer_XML` 消息输入，因此必须取消注册之前的编排，以防止它也拾取此消息。\n- 4. 设置编排也重用上一次练习中的发送端口。这包括调用 Dynamics\
  \ CRM 的生成的发送端口，以及将服务结果消息发送到文件系统的端口。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_152_0.png)\n\
  \n\n\n\n5. 启动编排，并确保接收位置、发送端口和主机也已启动。记得取消注册之前的编排，以免它也拾取消息。\n\n6. 为 Customer_XML 消息类型创建一个\
  \ XML 实例文件，并用尚未存在于 Dynamics CRM 中的新联系人详细信息填充它。\n\n```\n<ns0:Customer xmlns:ns0=\"\
  http://Chapter3-DynamicsCRM.Account\">\n  <ID />\n  <Name>\n    <Prefix>Mr.</Prefix>\n\
  \    <FirstName>Michael</FirstName>\n    <MiddleName>W.</MiddleName>\n    <LastName>Scott</LastName>\n\
  \  </Name>\n  <Addresses>\n    <Address>\n      <Type>3</Type>\n      <Street>200\
  \ West Dunder Avenue</Street>\n      <City>Scranton</City>\n      <State>PA</State>\n\
  \      <PostalCode>19446</PostalCode>\n    </Address>\n  </Addresses>\n  <PhoneNumbers>\n\
  \    <PhoneNumber>\n      <Type>Business</Type>\n      <Number>800-BUY-PAPR</Number>\n\
  \    </PhoneNumber>\n  </PhoneNumbers>\n  <EmailAddress>michael.scott@dundermifflin.com</EmailAddress>\n\
  </ns0:Customer>\n```\n\n7. 将此文件放入由我们的 FILE 接收位置监控的文件夹中。\n\n8. 如果一切配置正确，我们应该在 Dynamics\
  \ CRM 实例中看到一条新记录，并且有一个文件保存该新记录的唯一 ID。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_153_0.png)\n\
  \n在本练习中，我们看到了如何从规范模式创建非类型化服务请求消息，并成功地从 BizTalk Server 在 Dynamics CRM 中创建记录。\n\n\
  ## 使用 BizTalk Server 与 Dynamics CRM 代理服务\n\n### 设置\n\n代理服务策略需要安装 Dynamics CRM 2011\
  \ SDK。确保将 XRM 程序集添加到开发机器的全局程序集缓存中。此外，无论是否使用 Dynamics CRM 的新基于声明的安全策略，您仍需要安装 Windows\
  \ Identity Foundation (WIF) 组件，因为客户端程序集与 WIF 之间存在依赖关系。\n\n### 生成代理服务\n\n代理服务的关键在于代表\
  \ Dynamics CRM 应用程序中标准和自定义实体的类型化类：\n\n- 1. 在 Windows 命令提示符中，导航到 CRM SDK 下载包下的 `bin`\
  \ 目录。\n- 2. 执行 CrmSvcUtil.exe 实用工具，该实用工具为 Dynamics CRM 2011 中的实体创建 .NET 类。此实用工具有一系列命令行参数包括：\n\
  - a. url – Dynamics CRM Organization 服务的端点地址\n- b. out – 生成代码的文件名\n- c. username\
  \ – 具有调用 Dynamics CRM 服务权限的用户名\n- d. password – 具有调用 Dynamics CRM 服务权限的用户的密码\n-\
  \ e. domain – 调用 Dynamics CRM 服务的用户所在的目录域\n- f. namespace – 生成代码中使用的 .NET 命名空间\n\
  \n使用这些参数，生成早期绑定 Dynamics CRM 类的示例查询如下所示：\n\n```\nCrmSvcUtil.exe /url:http://<server>/<orgName>/XRMServices/2011/\n\
  Organization.svc /out:\"C:\\temp\\CrmEntities.cs\" /\nusername:<username> /password:<password>\
  \ /domain:<domain> /\nnamespace:Chapter3.CrmProxyService\n```\n\n- 3. 生成的 C# 类包含目标\
  \ Dynamics CRM 系统中存在的所有标准和自定义实体的定义。此类允许我们仅处理类型化实体，避免与原始 Entity 格式交互。\n- 4. 在 Visual\
  \ Studio 2010 中，创建一个新的 **Web Site** 项目，类型为 **WCF Service**，并将其命名为 Chapter3-DynamicsCRM.SvcProxy。\n\
  - 5. 右键单击新项目并选择 **Add Existing Item**。找到之前生成的 CrmEntities.cs 类并将其包含在此项目中。将它添加到项目的\
  \ App_Code 文件夹中。\n- 6. 再次右键单击项目并选择 **Add New Item**。选择 **WCF Service** 类型并将其命名为\
  \ CrmCustomerProxy.svc。\n- 7. 显示此服务的契约，其中将包含 BizTalk 将调用的数据类型和操作。请注意，CrmEntities.cs\
  \ 类不包含 WCF 可序列化类型。因此，我们不能简单地从服务返回 Dynamics CRM \"customer\" 类型。在 ICrmCustomerServiceProxy.cs\
  \ 中定义一个新类来描述客户。请注意，在此示例中我们使用单个 CRM 实体 Customer。需要对我们希望向 BizTalk 公开的每个实体执行类似的练习。\n\
  \n```\n[DataContract(Namespace=\"http://chapter3/data\")]\npublic class Customer\n\
  {\n    [DataMember]\n    public string NamePrefix { get; set; }\n    [DataMember]\n\
  \    public string FirstName { get; set; }\n    [DataMember]\n    public string\
  \ MiddleName { get; set; }\n    [DataMember]\n    public string LastName { get;\
  \ set; }\n    [DataMember]\n    public string PrimaryAddressStreet { get; set; }\n\
  \    [DataMember]\n    public string PrimaryAddressCity { get; set; }\n    [DataMember]\n\
  \    public string PrimaryAddressState { get; set; }\n    [DataMember]\n    public\
  \ string PrimaryAddressPostalCode { get; set; }\n    [DataMember]\n    public string\
  \ PhoneNumber { get; set; }\n    [DataMember]\n    public string EmailAddress {\
  \ get; set; }\n}\n```\n\n8. 也在该 ICrmCustomerProxy.cs 文件中，添加服务契约。此契约包含单个操作，该操作接收客户对象并返回包含新记录唯一标识符的字符串。\n\
  \n```\n[ServiceContract(Namespace=\"http://chapter3/service\")]\npublic interface\
  \ ICrmCustomerProxy\n{\n    [OperationContract]\n    string AddCustomer(Customer\
  \ newCustomer);\n}\n```\n\n9. 切换到生成的 CrmCustomerProxy.cs 文件并为所需的 AddCustomer 操作添加占位符。\n\
  \n10. 在继续之前，向此项目添加程序集引用。指向 Dynamics CRM SDK 下载的 bin 文件夹中包含的 Microsoft.Xrm.Sdk.dll。\n\
  \n11. 在 CrmCustomerProxy.cs 代码类的顶部，添加三个引用：\n\n```\nusing Microsoft.Xrm.Sdk;\nusing\
  \ Microsoft.Xrm.Sdk.Client;\nusing System.ServiceModel.Description; //for credentials\n\
  using Chapter3.CrmProxyService; //generated class\n```\n\n12. 通过代码调用 Dynamics CRM\
  \ WCF SOAP 服务时，我们可以选择使用 SDK 中包含的特殊服务代理类（OrganizationServiceProxy）。通过将此代理类与 Dynamics\
  \ CRM WCF 行为（ProxyTypesBehavior）结合使用，我们可以仅使用类型化对象，让这些对象在幕后转换为实体和从实体转换。在 AddCustomer\
  \ 操作开始时，添加以下代码，该代码为服务代理创建变量并定义客户端凭据对象：\n\n```\nOrganizationServiceProxy proxy;\n\
  ClientCredentials creds = new ClientCredentials();\ncreds.Windows.ClientCredential\
  \ =\nSystem.Net.CredentialCache.DefaultNetworkCredentials;\n```\n\n13. 定义两个变量，一个保存我们的\
  \ Dynamics CRM 联系人对象，另一个保存创建新联系人时返回的 GUID 值。\n\n```\nContact newContact;\nGuid newContactId;\n\
  ```\n\n14. 我们准备实例化用于调用 Dynamics CRM 服务的自定义服务代理。请注意，我们的凭据对象会传递给构造函数。在代理实例化后，将自定义\
  \ Dynamics CRM WCF 行为添加到端点：\n\n```\nusing (proxy = new OrganizationServiceProxy(new\n\
  Uri(\"http://<server>/<instance>/XRMServices/2011/Organization.\nsvc\"),\nnull,\n\
  creds,\nnull))\n{\n    proxy.ServiceConfiguration.CurrentServiceEndpoint.\nBehaviors.Add(new\
  \ ProxyTypesBehavior());\n}\n```\n\n15. 在服务客户定义和 Dynamics CRM 联系人实体之间创建映射：\n\n```\n\
  newContact = new Contact();\nnewContact.Salutation = newCustomer.NamePrefix;\nnewContact.FirstName\
  \ = newCustomer.FirstName;\nnewContact.MiddleName = newCustomer.MiddleName;\nnewContact.LastName\
  \ = newCustomer.LastName;\nnewContact.Address1_Line1 = newCustomer.PrimaryAddressStreet;\n\
  newContact.Address1_City = newCustomer.PrimaryAddressCity;\nnewContact.Address1_StateOrProvince\
  \ = \nnewCustomer.PrimaryAddressState;\nnewContact.Address1_PostalCode = \nnewCustomer.PrimaryAddressPostalCode;\n\
  newContact.Telephone1 = newCustomer.PhoneNumber;\nnewContact.EMailAddress1 = newCustomer.EmailAddress;\n\
  ```\n\n16. 最后，调用服务，传入 Dynamics CRM 实体，并获取 GUID 响应。从服务操作返回 GUID 的字符串值：\n\n```\nnewContactId\
  \ = proxy.Create(newContact);\n```\n\n\n\n17. 构建服务并将其部署到本地 Web 服务器。在浏览器中打开服务以确保其配置正确：\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_158_0.png)\n\n18. 如果需要，您也可以尝试使用 WCF Test\
  \ Client 调用此服务。请确保服务位于以具有 Dynamics CRM 2011 访问权限的域账户运行的应用程序池中。\n\n我们现在拥有一个完整且可用的代理服务，它作为外观位于实际的\
  \ Dynamics CRM 2011 WCF 端点之前。该代理公开了一个干净的类型化接口，BizTalk 可以轻松使用，我们接下来将会看到。\n\n## Building\
  \ the BizTalk components\n\n在这组步骤中，我们从 BizTalk 项目中消费代理服务，并创建将我们的规范模式转换为服务期望的格式所需的映射：\n\
  \n- 1. 返回 Visual Studio 2010，导航到现有的 BizTalk Server 项目。我们将为此新的 WCF 服务添加引用并配置调用代理服务所需的\
  \ BizTalk 组件。右键单击 BizTalk 项目，然后选择 **Add**，再选择 **Add Generated Items**。\n- 2. 逐步完成\
  \ BizTalk WCF 服务消费向导，并将元数据源选择为 MEX 端点。在下一页上，将地址设置为我们的 WCF 服务的 Web 地址：\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_158_1.png)\n\
  \n3. 完成向导并查看解决方案中包含的新工件。这包括绑定文件、模式和编排：\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_159_0.png)\n\
  \n4. 右键单击 BizTalk 项目并添加一个类型为 Map 的新项，并将映射命名为 Customer_To_CrmContactProxy.btm。\n\n\
  5. 将映射的源设置为 Customer_XML，目标设置为 Chapter3-DynamicsCRM.AccountInt.CrmCustomerProxy_chapter3_service，并选择\
  \ AddCustomer 根节点。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_159_1.png)\n\n6.\
  \ 将适用的源节点连接到相应的目标字段。\n\n7. 我们直接从 BizTalk 消息传递消费此服务，因此不需要构建编排来调用代理服务。构建并将 BizTalk\
  \ 项目部署到 BizTalk Server。\n\n这组步骤生成了我们调用位于 Dynamics CRM 前面的外观服务所需的 BizTalk 工件。与之前需要创造性地转换未类型化模式的练习不同，这组服务模式是强类型的，易于使用。\n\
  \n## Configuring the BizTalk endpoints\n\n接下来，我们将配置调用服务并路由响应的 BizTalk 消息组件：\n\n\
  - 1. 打开 BizTalk 管理控制台，并确保新的代理服务模式是 **Chapter3** 应用程序的一部分。\n- 2. 当我们为代理服务创建服务引用时，BizTalk\
  \ WCF 服务消费向导生成了一个绑定文件，该文件定义了一个能够调用代理服务的发送端口。右键单击 **Chapter3** 应用程序，选择导入绑定并选择 BizTalk\
  \ 项目中包含的 `CrmCustomerProxy_Custom.BindingInfo.xml` 文件。\n- 3. 打开生成的发送端口。端口配置无需更改，但我们将向此发送端口添加新的映射和筛选器。在端口配置的\
  \ **Outbound Maps** 选项卡上，选择 **Contact_To_CrmContactProxy** 映射。\n- 4. 切换到 **Filters**\
  \ 选项卡并为 `Customer_XML` 类型的消息类型添加订阅。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_160_0.png)\n\
  \n5. 我们的最后一个配置项是发送端口，它监听此服务调用的响应并将消息发送到文件系统。创建一个新的单向静态发送端口。将适配器设置为 FILE 并设置发送端口将发送响应消息的位置。转到端口配置的\
  \ **Filters** 选项卡。在这里，我们将为响应消息类型添加订阅。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_161_0.png)\n\
  \n6. 注销所有先前定义的发送端口和编排，以消除使用相同的 Customer_XML 消息类型作为输入产生的任何副作用。\n\n7. 向 BizTalk Server\
  \ 发送包含客户定义的 文件：\n\n```\n<ns0:Customer xmlns:ns0=\"http://Chapter3-DynamicsCRM.Acc...\"\
  >\n  <ID />\n  <Name>\n    <Prefix>Mr.</Prefix>\n    <FirstName>Jim</FirstName>\n\
  \    <MiddleName>P.</MiddleName>\n    <LastName>Halpert</LastName>\n  </Name>\n\
  \  <Addresses>\n    <Address>\n      <Type>3</Type>\n      <Street>200 West Dundar\
  \ Avenue</Street>\n      <City>Scranton</City>\n      <State>PA</State>\n      <PostalCode>19446</PostalCode>\n\
  \    </Address>\n  </Addresses>\n  <PhoneNumbers>\n    <PhoneNumber>\n      <Type>Business</Type>\n\
  \      <Number>800-BUY-PAPR</Number>\n    </PhoneNumber>\n  </PhoneNumbers>\n  <EmailAddress>jim.halpert@dundermifflin.com</EmailAddress>\n\
  </ns0:Customer>\n```\n\n8. 结果，我们应该在 Dynamics CRM 中看到新的记录，并在磁盘上看到一个保存该记录标识符的文件。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_161_1.png)\n\n在本练习中，我们展示了一种直接构建外观或代理服务的方法，该服务位于\
  \ Dynamics CRM 2011 前面并公开易于使用的类型化接口。底层代理服务利用了 Dynamics CRM SDK，因此在任何时候我们都不需要处理基础\
  \ Entity 对象。\n\n## Communicating from Dynamics CRM to BizTalk Server\n\n可以想象许多 Dynamics\
  \ CRM 要么向 BizTalk Server 发布数据，要么查询 BizTalk 暴露的服务端点的场景。例如，当客户请求退还缺陷产品时，呼叫中心代理可能会在\
  \ Dynamics CRM 中记录此请求。电话结束后，Dynamics CRM 应向退货处理系统发送消息，该系统处理客户账户的记账。在另一个场景中，BizTalk\
  \ Server 可能是数据聚合服务的主机，该服务查询存储“customer”数据的三个企业系统并汇总响应。当呼叫中心代理查看客户记录时，Dynamics CRM\
  \ 可能希望执行该服务，以便他们更全面地了解该客户与公司的交互。\n\nDynamics CRM 可以与 BizTalk Server 通信的有三个可行位置。首先，Dynamics\
  \ CRM 表单能够在表单生命周期的各个点执行客户端 JavaScript。确实可以使用 JavaScript 调用 Web 服务，包括 BizTalk Server\
  \ 暴露的 Web 服务。然而，请注意，JavaScript 调用 Web 服务通常是同步的，如果表单必须不断等待来自分布式服务的响应，则可能会对用户体验产生负面影响。此外，在\
  \ Dynamics CRM 中运行的 JavaScript 是客户端的，并直接绑定到其所在的页面。如果我们以编程方式与 Dynamics CRM 实体交互，则客户端脚本中存在的任何代码都不会被调用。例如，如果在创建“account”记录后我们通过\
  \ JavaScript 向 BizTalk 发送消息，如果我们以编程方式创建“account”记录，则此逻辑不会触发。\n\nDynamics CRM 可以通过工作流与\
  \ BizTalk Server 通信的第二个位置。Dynamics CRM 中的工作流是一个自动化过程，其中一组步骤根据我们定义的规则执行。例如，当销售机会关闭时，我们运行一个工作流，该工作流向客户记录添加消息，通知与机会相关的所有方，并向流失的潜在客户发送礼貌的电子邮件。工作流基于\
  \ Windows Workflow 4.0 技术，可以在 Dynamics CRM 应用程序本身或 Visual Studio 2010 中构建。Dynamics\
  \ CRM Web 应用程序允许我们使用先前注册的工作流步骤拼凑工作流。如果我们需要新的工作流步骤或需要构建复杂的东西，我们可以进入 Visual Studio\
  \ 2010 并在那里定义工作流。为什么我们会选择使用工作流向 BizTalk Server 发送消息？如果您有一个可以按计划或按需执行的长时间运行的流程，并且希望用户能够修改流程，那么工作流可能是正确的选择。\n\
  \nDynamics CRM 与 BizTalk Server 之间通信的最后策略是使用插件。插件是基于服务器的应用程序扩展，执行业务逻辑并直接绑定到实体。这意味着无论我们使用\
  \ Dynamics CRM Web 界面还是通过 API 工作，它们都会被调用。我可以根据情况同步或异步运行插件。例如，如果我们在保存记录之前需要验证记录上的数据，我们可以设置插件在“保存”操作提交之前运行，并对无效信息提供一些用户反馈。或者，我们可以选择在记录保存后异步调用插件并将数据传输到我们的服务总线\
  \ BizTalk Server。在以下练习中，我们将利用插件将数据从 Dynamics CRM 发送到 BizTalk Server。\n\n## Integration\
  \ to BizTalk Server\n\n在本次首次演练中，我们将构建一个插件，该插件从 Dynamics CRM 通信到位于的 BizTalk Server。每当\
  \ Dynamics CRM 中的 Account 记录发生更改时，就会向 BizTalk 发送事件消息。\n\n## Setup\n\n本练习利用了您 Visual\
  \ Studio 2010 解决方案中已有的 BizTalk Server 项目。我们将从 BizTalk Server 发布一个 Web 服务，该服务接收消息并将其路由到将消息写入文件系统的\
  \ BizTalk 发送端口。\n\n- 1. 如果您尚未执行，请转到本书的代码包并导航到 C:\\LOBIntegration\\Chapter03\\Chapter3-DynamicsCRM\
  \ 并打开名为 Chapter3-DynamicsCRM.sln 的 Visual Studio 2010 解决方案文件。\n\n\n\n- 2. 找到名为 **Chapter3-DynamicsCRM.AcctRouting**\
  \ 的 BizTalk Server 项目并打开它。\n\n- 3. 书中的代码包包含一个名为 `AccountEventChange_XML.xsd` 的自定义架构，并注意当账户发生变化时我们希望从\
  \ Dynamics CRM 2011 获取哪些元素。第一个元素 `EventSource` 用于指定变更事件的来源，因为组织的账户变更可能由多个系统共享。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_164_0.png)\n\n- 4. 此 BizTalk 项目应设置为部署到名为\
  \ Chapter3 的 BizTalk 应用程序。构建并将项目部署到指定的 BizTalk Server。\n\n- 5. 确认部署成功后，启动 BizTalk\
  \ WCF 服务发布向导。我们将使用此架构在 BizTalk Server 中公开一个 Web 服务入口点，以便 Dynamics CRM 2011 可以调用。\n\
  \n- 6. 在 WCF 服务类型向导页面中，选择 **WCF-BasicHttp** 适配器，并设置服务以公开元数据，并让向导在 **Chapter3** 应用程序中为我们生成一个接收位置：\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_164_1.png)\n\n- 7. 在创建 WCF 服务向导页面中，选择将架构发布为\
  \ WCF 服务。此选项使我们能够对与服务相关的命名进行精细控制。\n\n- 8. 在下一页中，删除服务定义中已有的双向操作。将最顶层的服务定义重命名为 AccountChangeService\
  \ 并为服务分配相同的名称。右键单击服务并创建一个名为 PublishAccountChange 的新单向操作。右键单击操作的请求消息并从 BizTalk 项目的\
  \ DLL 中选择 AccountChangeEvent 消息：\n\n- 9. 在以下向导页面中，将服务的命名空间设置为 http://Chapter3/AccountServices。\n\
  \n- 10. 接下来，将我们的服务位置设置为 http://localhost/AccountChangeService 并选择允许匿名访问生成的服务的选项。最后，通过在最终向导页面上单击创建按钮来完成向导。\n\
  \n- 11. 确认向导成功创建了 IIS 主持的 Web 服务以及 BizTalk 接收端口/位置。确保 IIS Web 服务在具有访问 BizTalk 数据库权限的应用程序池下运行。\n\
  \n- 12. 为了测试此服务，首先转到 BizTalk Server 管理控制台并找到 Chapter3 应用程序。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_165_0.png)\n\
  \n- 13. 右键单击 **Send Ports** 文件夹并创建一个新的、静态的单向发送端口，命名为 **Chapter3.SendAccountChange.FILE**。将发送端口设置为使用\
  \ FILE 适配器，并选择章节代码包中存在的 `FileDrop\\DropCustomerChangeEvent` 文件夹：\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_166_0.png)\n\
  \n- 14. 此发送端口应侦听所有账户变更事件消息，而不管它们来自哪个接收位置（和系统）。转到此发送端口的 **Filters** 选项卡。将筛选器 **Property**\
  \ 设置为 **BTS.MessageType**，并将筛选器 **Value** 设置为 `http://Chapter3-DynamicsCRM.AcctRouting.AccountChangeEvent_XML#AccountChangeEvent`。\n\
  \n- 15. 剩下的就是测试我们的服务。打开 WCF 测试客户端应用程序并添加对 `http://localhost/AccountChangeService/AccountChangeService.svc`\
  \ 的新服务引用。\n\n- 16. 调用 `PublishAccountChange` 方法，如果一切配置正确，我们将看到 BizTalk Server 发出的与我们的服务输入参数匹配的消息：\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_167_0.png)\n\n我们现在已准备好编写 Dynamics CRM\
  \ 插件，该插件调用此 BizTalk 服务。\n\n## 编写 Dynamics CRM 插件\n\nDynamics CRM 插件是使用自定义代码扩展产品开箱即用行为的强大方法。我们为本次练习构建的插件调用了上面构建的服务。\n\
  \n开始之前，请确保已下载 Dynamics CRM 2011 SDK 并将 `microsoft.xrm.sdk.dll` 程序集安装到全局程序集缓存中。\n\
  \n- 1. 在现有的 Chapter3-DynamicsCRM Visual Studio 2010 解决方案中，向解决方案添加一个名为 `Chapter3-DynamicsCRM.AcctPlugin`\
  \ 的新类库项目。\n\n- 2. 为此项目添加新引用并指向 `microsoft.xrm.sdk.dll` 程序集。此程序集包含我们正确定义插件所需的接口和类型。\n\
  \n- 3. 现在，我们需要对 BizTalk 生成的 WCF 端点进行服务引用。选择为项目添加新的服务引用。指向我们之前创建的服务并将命名空间设置为 **AcctChangeSvc**：\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_168_0.png)\n\n- 4. 向项目添加一个名为 `AccountEventPlugin.cs`\
  \ 的新类文件。\n\n- 5. 在新类的顶部，添加两个额外的 \"using\" 语句，指向 `Microsoft.Xrm.Sdk` 和 `System.ServiceModel`。这些程序集包含我们定义插件和消费\
  \ BizTalk 生成的服务所需的一切。\n\n- 6. 公共类应实现 `IPlugin` 接口，该接口有一个名为 `Execute` 的单个必需操作：\n\n\
  ```\npublic class AccountEventPlugin : IPlugin\n{\n    public void Execute(IServiceProvider\
  \ serviceProvider)\n    {\n    }\n}\n```\n\n- 7. 根据您的用例，您可能需要在 Dynamics CRM 记录上存储成功插件调用的结果。在此场景中，我们将简单地将插件执行详细信息记录到计算机的事件日志中。因此，Execute\
  \ 操作中的第一行如下：\n\n```\nSystem.Diagnostics.EventLog.\nWriteEntry(\"Application\", \"\
  Plugin invoked successfully\", System.\nDiagnostics.EventLogEntryType.Information);\n\
  ```\n\n- 8. 接下来，我们需要获取有关传递给插件的数据实体的上下文。IPipelineExecutionContext 包含此类信息，以及插件正在执行的运行时环境：\n\
  \n```\nIPluginExecutionContext context = (IPluginExecutionContext)\nserviceProvider.GetService(typeof(IPluginExecutionContext));\n\
  ```\n\n- 9. 我们将从 Account 中提取数据，因此需要一个引用此实体的变量。在声明此变量时，其值为 null：\n\n```\nEntity accountEntity\
  \ = null;\n```\n\n- 10. 因为插件可以在各种场景中使用，因此进行一些预防性错误检查是明智的。首先，我们可以确保传递给插件的对象确实是 Dynamics\
  \ CRM 实体。前面定义的上下文对象包含一组输入参数，其中包含来自请求消息的数据：\n\n```\nif (context.InputParameters.Contains(\"\
  Target\") && context.\nInputParameters[\"Target\"] is Entity)\n{\n}\n```\n\n- 11.\
  \ 如果插件目标是实体，则将之前定义的 accountEntity 变量设置为传递给插件的实体：\n\n```\n//retrieve entity from\
  \ input params\naccountEntity = (Entity)context.InputParameters[\"Target\"];\n```\n\
  \n- 12. 我们本可以将此插件绑定到任何 Dynamics CRM 实体，因此应该检查并确保传递给插件的实体类型有效：\n\n```\n//if the target\
  \ account type isn't \"account\" exit\nif (accountEntity.LogicalName != \"account\"\
  )\n{\n    System.Diagnostics.EventLog.WriteEntry(\n\"Application\",\n\"Target is\
  \ not 'account' type\",\nSystem.Diagnostics.EventLogEntryType.Error);\n    return;\n\
  }\n```\n\n- 13. 需要认识到的一件关键事情是，当 Dynamics CRM 事件管道中发生“更新”事件时，只有实体的已更改字段会被放入上下文的属性包中。为了访问账户实体的整个负载，我们可以使用\
  \ Image。Image 是实体在保存到 Dynamics CRM 之前或之后的表示。我们对 Account 实体感兴趣的四个字段可以从上下文的一部分 PostEntityImages\
  \ 集合中检索。这里我们使用名称“PostEventImage”，并将在将此插件与 Dynamics CRM 注册时稍后引用它：\n\n```\nEntity\
  \ acctImage = context.PostEntityImages[\"PostEventImage\"];\n\nstring acctName =\
  \ accountEntity[\"name\"].ToString();\nstring acctNumber = accountEntity[\"accountnumber\"\
  ].ToString();\nstring state = accountEntity[\"address1_stateorprovince\"].ToString();\n\
  string phone = accountEntity[\"telephone1\"].ToString();\n```\n\n- 14. 借助必要的数据元素，我们现在可以创建\
  \ WCF 服务输入对象。AccountChangeEvent 对象是之前建立的服务引用的一部分：\n\n```\nAcctChangeSvc.AccountChangeEvent\
  \ acct = new AcctChangeSvc.AccountChangeEvent();\nacct.EventSource = \"Dynamics\
  \ CRM\";\nacct.AccountName = acctName;\nacct.AccountNumber = acctNumber;\nacct.PrimaryState\
  \ = state;\nacct.PrimaryPhoneNumber = phone;\n```\n\n- 15. 我们现在可以从代码中调用服务。首先，创建一个对与\
  \ BizTalk 生成的服务关联的绑定类型的引用。在此示例中，使用没有任何安全设置打开的 BasicHttpBinding：\n\n```\nBasicHttpBinding\
  \ binding = new BasicHttpBinding(BasicHttpSecurityMode.None);\n```\n\n- 16. 接下来，需要一个端点地址。输入与\
  \ BizTalk 端点关联的完整服务 URL：\n\n```\nEndpointAddress addr = new EndpointAddress(\"http://localhost/AccountChangeService/AccountChangeService.svc\"\
  );\n```\n\n- 17. 这些信息就是实例化我们在服务引用中定义的服务客户端所需的一切：\n\n```\nAcctChangeSvc.AccountChangeServiceClient\
  \ client =\n    new AcctChangeSvc.AccountChangeServiceClient(binding, addr);\n```\n\
  \n\n\n18. 调用 PublishAccountChange 操作，并在成功后向机器的事件日志写入一条消息：\n\n```\nclient.PublishAccountChange(acct);\n\
  \nSystem.Diagnostics.EventLog.WriteEntry(\"Application\",\n\"Service called successfully\"\
  ,\nSystem.Diagnostics.EventLogEntryType.Information);\n```\n\n插件现已准备好部署并在 Dynamics\
  \ CRM 环境中注册。\n\n## 注册插件\n\nMicrosoft 作为 SDK 的一部分提供了一个插件注册工具。该工具位于 SDK 的 `SDK\\Tools\\\
  PluginRegistration` 文件夹中。在运行插件注册工具之前，将 `Chapter3-DynamicsCRM.AcctPlugin.dll` 复制到托管\
  \ Dynamics CRM 的服务器上的 `<installation directory>\\Program Files\\Microsoft CRM\\\
  server\\bin\\assembly`。如果您以后想调试它或不使用数据库存储选项，则需要将程序集放在此处。如果您选择将插件程序集存储在 Dynamics\
  \ CRM 数据库中，并且不关心调试插件，那么在注册期间程序集可以位于任何位置：\n\n- 1. 插件注册工具作为示例应用程序包含在 Dynamics CRM\
  \ SDK 中。前往我们解压 SDK 的位置并导航到 `tools\\pluginregistration` 文件夹。构建项目并启动可执行文件。\n- 2. 连接到\
  \ Dynamics CRM 2011 实例。\n- 3. 点击注册新程序集的选项：\n- 4. 导航到 `Chapter3-DynamicsCRM.AcctPlugin.dll`\
  \ 程序集并点击 **加载程序集**。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_171_0.png)\n\n-\
  \ 5. 将隔离模式指定为 **无**。还有一个额外的 **沙盒** 选项，它对该模式下运行的插件引入了一系列限制。沙盒插件在访问文件系统、事件日志、网络等方面有限制。当提供托管环境时，这是一个非常有用的选项，因为提供商可以限制共享环境中每个客户可以部署的插件类型。\n\
  - 6. 接下来，选择存储插件的位置。默认选项是 **数据库**，但我们也可以将文件存储在磁盘上或全局程序集缓存中。将位置设置为 **数据库**。\n- 7.\
  \ 点击 **注册选定的插件** 按钮以加载并在 Dynamics CRM 数据库中注册插件：\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_172_0.png)\n\
  \n- 8. 接下来，在 **已注册的插件和自定义工作流活动** 窗口中，选择我们的新插件，然后从菜单中选择 **注册**，再选择 **注册新步骤**。\n-\
  \ 9. 此窗口允许我们注册应触发插件的事件和实体。将事件（在 Dynamics CRM 中称为 **消息**）设置为 **更新**。有许多消息选项，包括 Create、Close、Merge、Retrieve\
  \ 等。\n- 10. 将 **主实体** 值设置为 **account**。这是其消息将启动插件的实体。请注意，通过使用 **筛选属性** 属性，我们可以设置实体的哪些字段会触发消息。\n\
  - 11. 将 **事件管道执行阶段** 设置为 **后操作**。插件在实体处理的执行管道内运行。在“pre”阶段运行的插件在消息保存到 Dynamics CRM\
  \ 之前运行。这是在进行数据验证的有用位置。“post”阶段是数据提交到 Dynamics CRM 后应运行逻辑的好地方。在我们的例子中，我们希望在实体更新后将消息发送到\
  \ BizTalk Server。选择 **后操作** 旁边的单选按钮。\n- 12. 最后，设置执行模式。插件可以同步或异步运行。在保存之前验证数据的插件应同步运行，以便在遇到任何错误时通知用户。在这种情况下，我们的服务应在\
  \ Dynamics CRM 用户完成实体更新后执行，并且在调用 BizTalk 服务时我们不想中断或延迟用户。将 **执行模式** 设置为 **异步**：\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_173_0.png)\n\n13. 在步骤注册后，我们的最后一步是注册一个映像。请记住，Update\
  \ 消息仅包含已更改的字段。如果我们需要访问实体的其他字段，我们必须调用 Dynamics CRM 服务，或者更好的是，使用传递到插件中的映像。从 **已注册的插件和自定义工作流活动**\
  \ 窗口中选择插件，选择 **注册**，然后点击 **注册新映像** 按钮。\n\n14. 将 **映像类型** 设置为 **后映像**，并将 **名称** 和\
  \ **实体别名** 设置为 **PostEventImage**。**参数** 设置允许我们设置实体中希望在映像中可用的字段。将此值保留为 **所有属性**。最后，点击\
  \ **注册映像** 按钮。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_174_0.png)\n\n15. 此时，我们的配置应如下所示：\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_174_1.png)\n\n我们现在已成功构建了 Dynamics CRM\
  \ 2011 插件并将其注册到系统中。此插件将在账户记录保存后异步触发，并在 `IPluginExecutionContext` 对象中传递完整的映像。\n\n\
  ## 测试插件\n\n要测试此配置，我们只需更改特定账户的详细信息即可。由于我们注册此插件在账户实体的任何更改时触发（而不是过滤哪些属性启动插件），任何更改的属性都可以：\n\
  \n- 1. 打开 Dynamics CRM 2011 并导航到“Accounts”视图。\n- 2. 打开任何现有账户以查看其属性。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_175_0.png)\n\
  \n- 3. 更改账户的任意一个属性。在上面的示例中，我将账户号码从 10094 改为 10095。插件应几乎立即启动。检查托管 Dynamics CRM 2011\
  \ 的机器的事件日志并观察表示成功的事件。\n- 4. 接下来，切换到 BizTalk Server 发送账户更改事件到的文件夹，并确认事件已发布在那里。\n\n\
  ```\n<AccountChangeEvent xmlns=\"http://Chapter3-DynamicsCRM.AcctRoute\">\n  <EventSource\
  \ xmlns=\"\">Dynamics CRM</EventSource>\n  <AccountName xmlns=\"\">Pinecrest Industries</AccountName>\n\
  \  <AccountNumber xmlns=\"\">10095</AccountNumber>\n  <PrimaryState xmlns=\"\">CA</PrimaryState>\n\
  \  <PrimaryPhoneNumber xmlns=\"\">800-333-4343</PrimaryPhoneNumber>\n</AccountChangeEvent>\n\
  ```\n\n此简单测试展示了 Dynamics CRM 实体中的更改如何立即向 BizTalk Server 发送消息以进行额外处理。\n\n## 摘要\n\n\
  Microsoft Dynamics CRM 2011 提供了多种集成选项。虽然它不再为 BizTalk 消费提供强类型 SOAP 接口，但我们有多种方式向 Dynamics\
  \ CRM 发送消息。要将消息从 Dynamics CRM 发送到 BizTalk Server，我们有许多选择，包括本章中演示的插件模型。随着 Dynamics\
  \ CRM 2011 在市场上的成熟，预计将看到更多将其与 BizTalk Server 集成的创造性方法。\n\n在下一章中，我们将了解如何安装 WCF-SAP\
  \ 适配器的先决条件 DLL。了解扩展的、定制的和开箱即用的 IDOC 以及如何发送和接收它们。\n"
- "## 4 WCF SAP 适配器—发送和接收 IDOC\n\n### WCF SAP 适配器—发送和接收 IDOC\n\nSAP 是一家大型企业软件公司，于\
  \ 1972 年在德国曼海姆成立。SAP 是 Systeme、Anwendungen、Produkte 的缩写，翻译成英语为 Systems Applications\
  \ and Products。该公司历史上专注于构建业务应用程序，因为五位原始联合创始人以前曾在 IBM 工作。\n\nSAP 提供了一个全面的开发平台，并许可针对行业特定功能量身定制的特定领域模块。一些模块包括人力资源\
  \ (HR)、财务 (FI)、物料管理 (MM)、工厂维护 (PM)、供应链管理 (SCM)、兼容单元 (CU)、公用事业 (ISU) 和客户关系管理 (CRM)。除了这些模块之外，还存在称为\
  \ BASIS 的底层平台组件。BASIS 管理员通常负责配置和维护关系数据库管理系统 (RDBMS)、部署传输（部署包）以及为请求连接到 SAP 接口的外部系统配置访问权限。\n\
  \n在本章中，我们将讨论以下主题：\n\n- 什么是 SAP？\n- 为什么人们使用它？\n- SAP 的市场份额\n- 为什么人们选择 BizTalk 与 SAP\
  \ 集成？\n- BizTalk 开发人员可能面临的挑战\n- WCF SAP 适配器的安装\n- 先决条件文件\n- 所需的 SAP DLL\n\n\n\n\n\
  - 32 位与 64 位注意事项\n- WCF-SAP 适配器与 WCF 自定义适配器\n- IDOC 架构生成\n- 什么是 IDOC？\n- 入站与出站 IDOC\
  \ 的区别\n- IDOC 深度解析\n- 控制记录\n- 合作伙伴配置文件/程序 ID\n- 扩展 IDOC\n- 构建 BizTalk 应用程序\n- 测试\
  \ BizTalk 应用程序\n- 自定义 IDOC\n- 平面文件 IDOC 注意事项\n\n## 为什么人们使用 SAP？\n\n许多中型和大型企业都依赖\
  \ SAP 来提供运行其业务的软件。 通常，这些组织采用的是“购买”而非“构建”的理念。 许多 CIO 倾向于这种做法，因为构建软件可能不是公司的核心竞争力。\
  \ 由于 SAP 也提供开发平台，企业通常可以自定义与内部实践不符的 SAP 功能。 SAP 的定制相当常见，因为每个企业都不同，而且世界各地各司法辖区的法规也各不相同。\n\
  \n由于 SAP 平台非常全面，大多数开发人员或顾问会专注于特定模块，例如物料管理 (MM) 或工厂维护 (PM)。 在每个模块中，SAP 资源会专攻功能角色或更技术性的\
  \ ABAP 角色。 ABAP，即高级业务应用编程，是一种与 COBOL 非常相似的编程语言。 ABAP 仍然是 SAP 程序员构建程序时使用的主要语言。 近来，随着\
  \ SAP 引入 NetWeaver 堆栈，Java 开始变得流行。 NetWeaver 是 SAP 向面向服务架构 (SOA) 转型的尝试，这与 SAP 所建立的主机式文化截然不同。\n\
  \nNetWeaver 中直接与 BizTalk 竞争的组件称为流程集成 (PI)。 PI 可用于在模块间集成 SAP 功能，也可用于与其他外部系统集成。 PI\
  \ 拥有与 BizTalk 类似的工具，包括消息转换、业务流程编排和适配器等功能。\n\n## 为什么人们选择 BizTalk 来集成 SAP？\n\nBizTalk\
  \ 通常会与 PI 竞争，当组织开始将 SAP 与其他内部和外部系统集成时。 有些组织会选择 SAP 路线，其他组织会选择 Microsoft 路线，还有一些组织会使用这两种技术的组合来解决其集成需求。\n\
  \n选择引入 BizTalk 的组织通常出于以下原因：\n\n- SAP PI 资源稀缺且昂贵\n- Microsoft 拥有出色的开发生态系统\n  - 为了验证这一点，只需浏览\
  \ Microsoft 的 MSDN 论坛、BizTalkGurus.com 或现有的众多 BizTalk 博客即可。 BizTalk 集成相关信息的数量在 BizTalk\
  \ 的竞争对手中是无与伦比的。\n- 一致的开发体验\n  - 许多，如果不是大多数，BizTalk 开发人员在涉足 BizTalk 之前曾担任过 .NET 程序员。\
  \ 虽然一些集成概念对 .NET 程序员来说很陌生，但他们开发应用程序的环境并非如此。 .NET 和 BizTalk 开发人员都在 Visual Studio\
  \ 中执行开发任务。 添加服务引用和架构开发等任务在这两种技术之间也极其相似。 SAP 平台上的开发工具不具备 Visual Studio 所提供的精细度和持续改进。\n\
  - 开发人员生产力\n  - Microsoft 赞助了一项生产力研究，以确定 PI 与 BizTalk 之间的总拥有成本。 BizTalk 与 SAP PI\
  \ 相比表现非常出色。 整个研究可在以下位置找到：http://www.microsoft.com/downloads/en/details.aspx?FamilyID=6EC68631-2B4C-485F-83CF-7C26893839C4&displaylang=en\n\
  \n另一个需要考虑的方面是你将集成哪些其他系统。 BizTalk 的优势之一是能够很好地与 Microsoft 和非 Microsoft 平台集成。 本书本身就是\
  \ BizTalk 能够与如此多不同平台集成的证明。 这一观点通常是促使决策者最终选择 BizTalk 的关键因素。 BizTalk 能够可靠、高效、经济地与\
  \ SAP 集成，并且还能与其他非 SAP 系统集成。 虽然 SAP PI 非常擅长与 SAP 集成，但在与非 SAP 系统集成时表现并不理想。\n\n## BizTalk\
  \ 开发人员可能面临的挑战\n\nBizTalk 开发人员在与 SAP 集成时面临的一些最具挑战性的障碍并非技术性的。 通常，这些挑战与政治有关。 许多 SAP\
  \ 资源对 Microsoft 的看法是，Microsoft 的系统不稳定、未准备好用于企业环境，并且充满安全漏洞。 考虑到大多数 SAP 系统运行在 UNIX\
  \ 或其衍生系统之上，这些看法并不令人意外。 事实是，Microsoft 在企业领域已经成熟，可以与 SAP、Oracle 和 IBM 等竞争。 其他担忧通常涉及\
  \ BizTalk 适配器是否对 SAP 系统做了不应该做的事情。 我记得几年前有一位 BASIS 管理员坚决认为没有任何 Microsoft“连接器”会连接到他的系统。\
  \ 在这些情况下，重要的是要强调 Microsoft 经历的认证流程，以确保其相关产品获得 SAP 认证。 BizTalk 适配器包恰好是获得 SAP 如此评级的这些技术之一。\n\
  \n领地之争经常发生，因为 SAP 资源可能会觉得“外来者”在侵占他们的地盘。 我过去曾与一位 SAP 顾问合作过，他坚称可以通过使用 SAP 数据仓库/商业智能来移动数据，从而完成集成工作。\
  \ 这显然不是正确的决定，但那个人不想看到部分控制权转移到 Microsoft。\n\n事实是，每当你构建跨多种技术和团队的集成解决方案时，你需要作为一个团队来构建、测试和排除解决方案的故障。\
  \ 这要求开发人员和架构师放下偏见和自我，以便作为一个团队工作。 最终结果应该为组织提供价值，而不是参与其中的个人。 我发现在这方面有帮助的是尝试理解他们的术语。\
  \ 如果你是新的 BizTalk“高手”，他们可能不会很高兴看到你在这里，更不用说学习你的术语了。 但是，如果你能学习他们的术语，可能会使过渡更顺利。\n\n\
  作为 BizTalk 开发人员，你需要与你的 BASIS 管理员建立积极的工作关系。 构建 IDOC 解决方案需要 BASIS 管理员付出一些努力，因为他们必须创建\
  \ BizTalk 账户、程序 ID 或合作伙伴配置文件，以便 BizTalk 处理各种 IDOC。\n\n## WCF SAP 适配器的安装\n\nWCF SAP\
  \ 适配器的安装已在第一章中介绍过；然而，本章有几个具体的细节值得提及。\n\n## 32 位与 64 位\n\n如果我们的 BizTalk 环境是 32 位，则无需执行任何额外操作。\
  \ 如果我们的 BizTalk 环境是 64 位，则需要同时安装适配器的 32 位和 64 位版本。 原因在于许多 BizTalk 工具仍然是 32 位应用程序，包括\
  \ Visual Studio 和 BizTalk 管理控制台。 因此，即使我们的运行时可能是 64 位，我们仍需要 32 位版本来生成架构并配置将使用 SAP\
  \ 适配器的任何接收位置或发送端口。\n\n## SAP 先决条件 DLL\n\n安装 BizTalk 适配器包是不够的。 你需要从 SAP Marketplace\
  \ 获取两个软件包。 SAP Marketplace 相当于 Microsoft 的 MSDN 和 TechNet 服务。 这是注册客户和合作伙伴可以获取 SAP\
  \ 软件下载和技术文档的地方。 SAP Marketplace 需要登录，任何支付 SAP 支持的组织都会有一个。 最有可能的是我们的 BASIS 管理员拥有登录凭据，因此我们可能需要请他们为我们下载软件包。\
  \ 此外，请注意，每个软件包都特定于 SAP 的某个版本，无论是 Unicode 还是非 Unicode 安装。 在下载任何软件包之前，最好与 BASIS 管理员进行沟通。\n\
  \n\n\nThe first package that we need to obtain contains the SAP RFC SDK DLLs. These\
  \ RFC DLLs get used during design time generation of SAP schemas and during the\
  \ runtime operations when BizTalk is sending and receiving messages with SAP. Microsoft\
  \ using these DLLs is a good thing and strengthens our case for having Microsoft\
  \ handle the integration with an SAP system since we are using SAP code when establishing\
  \ connections.\n\n我们需要获取的第一个软件包包含 SAP RFC SDK DLL。这些 RFC DLL 在设计时生成 SAP 架构期间以及 BizTalk\
  \ 与 SAP 发送和接收消息时的运行时操作期间使用。Microsoft 使用这些 DLL 是一件好事，并且加强了我们让 Microsoft 处理与 SAP 系统集成的理由，因为我们在建立连接时使用的是\
  \ SAP 代码。\n\nThe second package is called `R3DLLINST.zip` and contains the Microsoft\
  \ runtime DLLs. Even though these are Microsoft DLLs, they are still available through\
  \ the SAP Marketplace.\n\n第二个软件包名为 `R3DLLINST.zip`，包含 Microsoft 运行时 DLL。尽管这些是 Microsoft\
  \ DLL，但它们仍然可以通过 SAP Marketplace 获取。\n\nWithin the BizTalk Adapter Pack installation\
  \ folder, an install guide called `InstallationGuide.htm` exists in the `C:\\Program\
  \ Files\\Microsoft BizTalk Adapter Pack (x64)\\Documents` folder for 64-bit systems.\
  \ Similarly, a document will exist on a 32-bit system in the `C:\\Program Files\\\
  Microsoft BizTalk Adapter Pack\\Documents` folder. A table exists that describes\
  \ the prerequisite DLLs that are required for specific versions of SAP. Microsoft\
  \ has included a link within each section that will take us directly to the location\
  \ within the SAP Marketplace to download the package and get more specific information.\
  \ The SAP client version that we will be using for this chapter is SAP client 7.0\
  \ so the URLs that we will follow are:\n\n在 BizTalk Adapter Pack 安装文件夹中，名为 `InstallationGuide.htm`\
  \ 的安装指南位于 64 位系统的 `C:\\Program Files\\Microsoft BizTalk Adapter Pack (x64)\\Documents`\
  \ 文件夹中。同样，在 32 位系统上，文档将存在于 `C:\\Program Files\\Microsoft BizTalk Adapter Pack\\\
  Documents` 文件夹中。存在一个表格，描述了特定 SAP 版本所需的先决条件 DLL。Microsoft 在每个部分中都包含了一个链接，可直接带我们到\
  \ SAP Marketplace 中的位置下载软件包并获取更具体的信息。本章将使用的 SAP 客户端版本是 SAP client 7.0，因此我们将遵循的 URL\
  \ 为：\n\n| Download Purpose | SAP Note ID | Download URL |\n|---|---|---|\n| RFC\
  \ SDK | 27517 | http://go.microsoft.com/fwlink/?LinkID=94691 |\n| Microsoft Run\
  \ Time DLLs | 684106 | http://go.microsoft.com/fwlink/?LinkID=94693 |\n\nWhen we\
  \ navigate to the SAP note for the installing the SAP RFC SDK, we are prompted to\
  \ download the assemblies from another URL: `http://service.sap.com/swdc`.\n\n当我们导航到安装\
  \ SAP RFC SDK 的 SAP 备注时，会提示我们从另一个 URL 下载程序集：`http://service.sap.com/swdc`。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_183_0.png)\n\
  \nOnce we navigate down the website's hierarchy of Support Packages and Patches\
  \ - Entry by Application Group - Additional Components - SAP RFC SDK UNICODE - SAP\
  \ RFC SDK 7.00 UNICODE we end up with the download section that we are interested\
  \ in. If we are running a 64-bit environment, then we need both 32-bit and 64-bit\
  \ packages due to the differences between the 32-bit BizTalk design/admin tools\
  \ and the 64-bit BizTalk runtime.\n\n一旦我们沿着网站的层级结构导航到 Support Packages and Patches\
  \ - Entry by Application Group - Additional Components - SAP RFC SDK UNICODE - SAP\
  \ RFC SDK 7.00 UNICODE，我们就会到达感兴趣的下载部分。如果我们运行的是 64 位环境，则需要同时获取 32 位和 64 位软件包，这是由于\
  \ 32 位 BizTalk 设计/管理工具与 64 位 BizTalk 运行时之间的差异。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_183_1.png)\n\
  \nThese software packages that exist in the SAP Marketplace have been packaged in\
  \ a SAP specific package tool called SAPCAR. In order to open these packages, we\
  \ need to download the SAPCAR tool.\n\n这些存在于 SAP Marketplace 中的软件包已使用名为 SAPCAR 的\
  \ SAP 特定打包工具进行打包。为了打开这些软件包，我们需要下载 SAPCAR 工具。\n\nWe can download SAPCAR from the\
  \ same location as where we found the RFC SDK.\n\n我们可以从找到 RFC SDK 的同一位置下载 SAPCAR。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_184_0.png)\n\nOnce again we will need\
  \ to choose the platform that we will be using when extracting the SAR package.\n\
  \n再次提取 SAR 软件包时，我们需要选择将使用的平台。\n\nOnce we have SAPCAR downloaded, we need to open\
  \ a command line prompt and change our directory to the location where we saved\
  \ the SAPCAR.exe. If we execute a command similar to the one below, we will be able\
  \ to extract the SAR archive.\n\n一旦下载了 SAPCAR，我们需要打开命令提示符并将目录更改为保存 SAPCAR.exe 的位置。如果执行类似于下面的命令，我们将能够提取\
  \ SAR 归档。\n\n```\nF:\\Dev\\SAP>SAPCAR_0-10003696.exe -xfv \"RFC_25-20001765.SAR\"\
  \n\nSAPCAR: processing archive RFC_25-20001765.SAR (version 2.01)\n\nSAPCAR: 61\
  \ file(s) extracted\n```\n\nThe result of this command being executed is that a\
  \ folder called rfcsdk is created that will contain several sub folders including\
  \ a bin and lib folders.\n\n执行此命令的结果是创建一个名为 rfcsdk 的文件夹，其中将包含多个子文件夹，包括 bin 和 lib\
  \ 文件夹。\n\n- If we are running a 64-bit BizTalk environment, then we need to copy\
  \ the SAP DLLs from the 32-bit SAR package and 64 bit SAR package to multiple locations.\n\
  \n- 如果我们运行的是 64 位 BizTalk 环境，则需要从 32 位 SAR 软件包和 64 位 SAR 软件包复制 SAP DLL 到多个位置。\n\n\
  - If you are installing both 32 bit and 64 bit Adapters and DLLs, you need to pay\
  \ close attention to Microsoft's install instructions. The installation instructions\
  \ that are provided as part of the adapter install specify the following:\n  - \"\
  On a 64-bit computer, the 32-bit version of the DLLs must be added to the C:\\Windows\\\
  SysWow64 folder. The 64-bit version of the DLLs must be added to the C:\\Windows\\\
  System32 folder.\" These instructions defy common logic so be sure not to overlook\
  \ this step. You can also read about this step in the SAP Adapter's Frequently Asked\
  \ Questions page: http://msdn.microsoft.com/en-us/library/cc185322(BTS.10).aspx\n\
  \n- 如果您同时安装 32 位和 64 位适配器和 DLL，则需要仔细注意 Microsoft 的安装说明。随适配器安装提供的安装说明指定如下：\n  - \"\
  On a 64-bit computer, the 32-bit version of the DLLs must be added to the C:\\Windows\\\
  SysWow64 folder. The 64-bit version of the DLLs must be added to the C:\\Windows\\\
  System32 folder.\" 这些说明违背了常识，因此请务必不要忽略此步骤。您也可以在 SAP Adapter 的常见问题解答页面中阅读有关此步骤的信息：http://msdn.microsoft.com/en-us/library/cc185322(BTS.10).aspx\n\
  \nIn the demo environment for this book, the following 64-bit DLLs and libraries\
  \ have been copied into the %WINDOWS%\\System32 directory from the bin directory\
  \ that was created in the SAPCAR process.\n\n在本书的演示环境中，以下 64 位 DLL 和库已从 SAPCAR 过程中创建的\
  \ bin 目录复制到 %WINDOWS%\\System32 目录中。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_185_0.png)\n\
  \nWe now need to copy the following libraries from the 64-bit lib directory into\
  \ the %WINDOWS%\\System32 directory.\n\n我们现在需要从 64 位 lib 目录复制以下库到 %WINDOWS%\\System32\
  \ 目录。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_185_1.png)\n\nThe end result is\
  \ that the following nine files should all end up in the %WINDOWS%\\System32 directory\
  \ as illustrated in the following screenshot:\n\n最终结果是以下九个文件都应位于 %WINDOWS%\\System32\
  \ 目录中，如以下屏幕截图所示：\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_186_0.png)\n\nSimilarly,\
  \ the following 32-bit DLLs need to be copied into the %WINDOWS%\\SysWOW64 directory.\
  \ The 32-bit DLLs should come from the 32 bit SAR archive that we previously downloaded.\n\
  \n同样，以下 32 位 DLL 需要复制到 %WINDOWS%\\SysWOW64 目录。32 位 DLL 应来自我们之前下载的 32 位 SAR 归档。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_186_1.png)\n\nThe next set of prerequisite\
  \ DLLs that we need to deal with are the Microsoft runtime DLLs. Once again, these\
  \ DLLs can be retrieved from the SAP Marketplace via the URL that is specified in\
  \ the BizTalk Adapter Pack Installation Guide. Navigating to http://go.microsoft.com/fwlink/?LinkID=94693\
  \ will render the following page. After reviewing the content that SAP has provided,\
  \ we want to click on the **Attachments** link.\n\n我们需要处理的下一组先决条件 DLL 是 Microsoft\
  \ 运行时 DLL。再次，这些 DLL 可以通过 BizTalk Adapter Pack 安装指南中指定的 URL 从 SAP Marketplace 获取。导航到\
  \ http://go.microsoft.com/fwlink/?LinkID=94693 将显示以下页面。在查看 SAP 提供的内容后，我们希望单击 **Attachments**\
  \ 链接。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_187_0.png)\n\nThe file that we\
  \ are interested in is r3dllinst.zip. Click on the link to download this package.\n\
  \n我们感兴趣的文件是 r3dllinst.zip。单击链接下载此软件包。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_187_1.png)\n\
  \nOnce we have the r3dllinst.zip downloaded, we need to extract this package and\
  \ will end up with the following files in the nt patch folder:\n\n一旦下载了 r3dllinst.zip，我们需要提取此软件包，并在\
  \ nt patch 文件夹中得到以下文件：\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_187_2.png)\n\n\
  We now want to execute R3DLLINS.EXE and should get prompted with the following message.\
  \ Click OK to proceed with the installation of these DLLs.\n\n我们现在想要执行 R3DLLINS.EXE，并应收到以下提示消息。单击\
  \ OK 继续安装这些 DLL。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_188_0.png)\n\nThis\
  \ concludes the prerequisite DLLs that are required in order for the SAP adapter\
  \ to function properly. We will validate the SAP Adapter functions properly in an\
  \ upcoming section when we generate IDOC schemas. If we are able to generate Schemas\
  \ via Visual Studio, then we know our 32-bit installation is complete. We will not\
  \ know about our 64-bit assemblies until we try to process a message.\n\n这完成了 SAP\
  \ 适配器正常运行所需的先决条件 DLL。我们将在生成 IDOC 架构时在即将到来的部分验证 SAP 适配器是否正常运行。如果我们能够通过 Visual Studio\
  \ 生成架构，则我们知道 32 位安装已完成。我们在尝试处理消息之前不会知道 64 位程序集的情况。\n\n## WCF-SAP Adapter vs WCF\
  \ Custom Adapter with SAP binding\n\n## WCF-SAP 适配器与带 SAP 绑定的 WCF 自定义适配器\n\nWhen\
  \ we generate schemas for SAP artifacts, the binding file that is also generated\
  \ will use the WCF-Custom Adapter with an SAP Binding Type. With this binding type\
  \ selected, we can manipulate any SAP-related property.\n\n当我们为 SAP 工件生成架构时，同时生成的绑定文件将使用带\
  \ SAP 绑定类型的 WCF-Custom 适配器。选择此绑定类型后，我们可以操作任何与 SAP 相关的属性。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_189_0.png)\n\
  \nThe challenge with using the WCF-Custom Adapter is that when we configure the\
  \ URI for our SAP server, the interface is not very intuitive. The SAP connection\
  \ string is confusing at best and one missing key stroke will result in an error.\n\
  \n使用 WCF-Custom 适配器的挑战在于，当我们配置 SAP 服务器的 URI 时，界面并不十分直观。SAP 连接字符串最多令人困惑，缺少一个键入就会导致错误。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_189_1.png)\n\n## WCF SAP Adapter – Sending\
  \ and Receiving IDOCs\n\n## WCF SAP 适配器 – 发送和接收 IDOC\n\nConversely, the WCF-SAP\
  \ adapter is a little more intuitive when we configure our SAP URI. By clicking\
  \ the Configure button, we have a well-organized table to populate, which reduces\
  \ the complexity of providing a valid SAP connection string.\n\n相反，在配置 SAP URI 时，WCF-SAP\
  \ 适配器更直观一些。通过单击 Configure 按钮，我们有一个结构良好的表格需要填写，这降低了提供有效 SAP 连接字符串的复杂性。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_190_0.png)\n\
  \nTo create a WCF-SAP adapter, we need to perform the following steps:\n\n创建 WCF-SAP\
  \ 适配器，我们需要执行以下步骤：\n\n- 1. Right mouse click on Adapters and then select New - Adapter.\n\
  \n- 1. 右键单击 Adapters，然后选择 New - Adapter。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_190_1.png)\n\
  \n2. Click the Adapter drop-down list and select WCF-SAP. In the Name text box,\
  \ type in WCF-SAP and click OK button.\n\n2. 单击 Adapter 下拉列表并选择 WCF-SAP。在 Name 文本框中输入\
  \ WCF-SAP，然后单击 OK 按钮。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_191_0.png)\n\n\
  It is important to understand that no matter whether you use the WCF-Custom Adapter\
  \ or WCF-SAP Adapter, you are not losing functionality. Using the WCF-SAP adapter\
  \ simplifies the administration tasks that are involved in maintaining our BizTalk\
  \ environment. Since the WCF-Custom adapter can leverage many different bindings\
  \ including Oracle, SQL, SAP, and bindings that allow us to connect to the cloud,\
  \ it is beneficial to explicitly create these adapters to avoid confusion.\n\n重要的是要理解，无论您使用\
  \ WCF-Custom 适配器还是 WCF-SAP 适配器，都不会丢失功能。使用 WCF-SAP 适配器简化了维护 BizTalk 环境所涉及的管理任务。由于\
  \ WCF-Custom 适配器可以利用多种不同的绑定，包括 Oracle、SQL、SAP 以及允许我们连接到云的绑定，因此明确创建这些适配器以避免混淆是有益的。\n\
  \n## Supported SAP configurations\n\n## 支持的 SAP 配置\n\nThe following SAP configurations\
  \ are supported. New to BizTalk 2010 is the support for SAP 7. For the purpose of\
  \ this chapter, the SAP system that is being used is SAP ECC 6.0 but the following\
  \ versions are supported:\n\n以下 SAP 配置受支持。BizTalk 2010 的新功能是支持 SAP 7。为了本章的目的，所使用的\
  \ SAP 系统是 SAP ECC 6.0，但以下版本受支持：\n\n- Supported server versions: SAP 7, SAP ECC 6.0\
  \ Unicode, SAP ECC 5.0 Non-Unicode, SAP ECC 5.0 Unicode, SAP R/3 4.7 Non-Unicode,\
  \ SAP R/3 4.7 Unicode, SAP R/3 4.6c Non-Unicode, SAP ERP 6.0 with EHP 4.0\n- Supported\
  \ client versions: SAP RFC SDK 7.11 UNICODE, SAP RFC SDK 7.1 UNICODE, SAP RFC SDK\
  \ 7.0 UNICODE, SAP RFC SDK 6.4 UNICODE\n\n- 支持的服务器版本：SAP 7、SAP ECC 6.0 Unicode、SAP\
  \ ECC 5.0 Non-Unicode、SAP ECC 5.0 Unicode、SAP R/3 4.7 Non-Unicode、SAP R/3 4.7 Unicode、SAP\
  \ R/3 4.6c Non-Unicode、SAP ERP 6.0 with EHP 4.0\n- 支持的客户端版本：SAP RFC SDK 7.11 UNICODE、SAP\
  \ RFC SDK 7.1 UNICODE、SAP RFC SDK 7.0 UNICODE、SAP RFC SDK 6.4 UNICODE\n\n\n\n##\
  \ IDOC 架构生成\n\n在完成 SAP Adapter 的安装和配置后，我们现在将重点关注 IDOC。我们将探索 IDOC 的以下功能：\n\n- IDOC\
  \ 是什么\n- 如何生成 IDOC 架构并理解重要属性\n\n### IDOC 是什么？\n\nIDOC 是 Intermediate Document（中间文档）的缩写，是一种\
  \ SAP 规范，用于在 SAP 系统内部以及与 BizTalk 等外部系统之间交换信息。SAP 人员将 IDOC 视为类似于 BizTalk 人员思考 XSD\
  \ 架构的方式。不同之处在于 IDOC 结构类似于平面文件，而 XSD 架构基于 XML。\n\nSAP 具有一致的结构，包括包含与 IDOC 关联的元数据的\
  \ Header 段。Header 在所有 IDOC 类型中保持一致，但 IDOC 的主体将根据 IDOC 支持的功能而不同。SAP 为不同的系统功能提供特定的\
  \ IDOC 结构。HR Timesheet IDOC 看起来会与采购订单大不相同。每个 IDOC 都有特定于该 IDOC 的段。我们可以将段视为类似于 XML\
  \ 节点。如果您问 SAP 人员 IDOC 是否有重复的节点，他们可能不理解您的问题。但是，如果您问 IDOC 是否有重复的段，他们会立即理解。\n\n###\
  \ 如何生成 IDOC 架构\n\n现在我们对 IDOC 有了一些基本了解，让我们继续生成一个 IDOC 以获得更好的理解。就像我们之前为 SQL Server\
  \ 生成架构一样，我们将利用 Consume Adapter Service。我们可以通过右键单击 BizTalk 项目并选择 Add - Add Generated\
  \ Items...Consume Adapter Service 来启动此向导。\n\n1. 我们现在处于熟悉的领域，因为在之前的章节中使用过此向导。这次我们想要从“选择绑定”下拉列表中选择\
  \ sapBinding。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_193_0.png)\n\n2. 我们现在需要配置\
  \ URI，可以通过单击 **Configure** 按钮来完成。我们需要处理的第一个区域是 **Security** 选项卡。在此选项卡中，关于 **Client\
  \ credential type** 我们有几个不同的选项：\n\n- None\n- Windows\n- Username\n- Certificate\n\
  \n我大胆猜测我们永远不会遇到不需要提供凭据的情况，所以我们不会使用 **None**。本演练中使用的 SAP 系统不驻留在 **Windows** 平台上，因此该选项不可用。如果您的\
  \ SAP 系统支持 Windows 身份验证，那么使用这种类型的身份验证是值得考虑的。证明我们身份没有特定要求，因此不需要 **Certificate**。这就剩下提供标准的\
  \ **Username** 和 **Password**。通常，这些凭据由 SAP 安全管理员分配，有时由 BASIS 管理员分配。这些是用户通过 SAP GUI\
  \ 访问 SAP 时提供的同类型凭据，只是具有额外的权限。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_193_1.png)\n\
  \n3. 我们接下来要关注的选项卡是 **URI Properties**。我们需要填充的基础属性包括：\n\n- Application Server Host\n\
  - System Number\n- Client\n\n**Application Server Host** 是物理 SAP 应用服务器的名称，或更可能是虚拟\
  \ DNS 别名。此值在各个 SAP 景观，即 DEVELOPMENT/TEST/PRODUCTION 中很可能唯一。\n\n**System Number**\
  \ 是 SAP 特定实例的唯一数字标识符。**Client** 在此上下文中用于在 SAP 系统内分隔数据。例如，如果您有子公司共享一个 SAP 系统，但希望数据隔离，那么您可以创建多个客户端，以便区分一家公司的数据与另一家公司的数据。如果您熟悉\
  \ Dynamics CRM，**Client** 相当于一个 Organization。此数字在各个 SAP 景观中很可能相同，但在共托管情况下您可能有多个值。这些都是您很可能从\
  \ BASIS 管理员处获得的值。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_194_0.png)\n\n4. 我们需要关心的最后一个选项卡是\
  \ **Binding Properties** 选项卡。在此选项卡中，我们将指定与 BizTalk 如何与 SAP 交互相关的一些属性。需要注意的是，其中许多设置可以在您准备配置应用程序时在\
  \ BizTalk Administration 控制台中更改。在下一张截图中，我们将集中讨论两个特定属性：\n\n- **ReceiveTimeout** –\
  \ 可能是需要设置的最重要的生产属性之一。此属性指定 BizTalk 在关闭之前等待传入消息的持续时间。默认值是 10 分钟，时间几乎不够。如果我们不修改此设置，在生产环境中当超过此阈值时，BizTalk\
  \ 停止监听 IDOC 时，我们可能会得到一些不理想的结果。最大值是 24.20:31:23.6470000（24 天）。要了解有关此属性的更多信息，请参阅以下博文：http://kentweare.blogspot.com/2010/03/biztalk-adapter-pack-sap-binding.html\n\
  - **EnableBizTalkCompatibilityMode** – 指定是否应加载 BizTalk 分层通道绑定元素，这将允许 BizTalk 事务流向\
  \ SAP。使用 BizTalk 中的 WCF-SAP Adapter 时，此值应始终设置为 true。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_195_0.png)\n\
  \n5. **Binding Properties** 选项卡中还有一些我们感兴趣的其他属性：\n\n- **EnableSafeTyping** – 并非所有\
  \ SAP 数据类型都有 .NET 数据类型等价物。通过启用安全类型，BizTalk 在尝试将 SAP 数据类型绑定到 .NET 数据类型时对类型的要求会“更宽松”。了解此属性如何改变应用程序的行为非常重要。如果您期望从\
  \ SAP 获取日期，当此属性设置为 True 时，数据很可能将被转换为字符串。说实话，根据个人经验，我在与 IDOC 集成时不需要将此属性设置为 true，但在调用\
  \ RFC 和 BAPI 时需要更改该属性。\n- **GenerateFlatFileCompatibleIDOC** – 此属性指定 `<appinfo>`\
  \ 节点是否应包含段类型或段定义以解析平面文件 IDOC。通过将属性设置为 True，并不意味着您必须使用平面文件来处理 IDOC。最好将此值保持为 true，因为它为您将来使用平面文件提供了灵活性。\n\
  - **ReceiveIDOCFormat** – 以前使用基于 .NET Connector 的 SAP Adapter 时，您必须将 IDOC 作为平面文件处理。在\
  \ WCF 版本的 Adapter 中情况不再如此。我们现在有机会在不使用平面文件架构和管道的情况下以 XML 发送和接收消息。如果我们指定 **Typed**\
  \ 则我们将以 XML 消息接收消息。我们也有能力指定 String 或 RFC。如果我们想使用平面文件架构/管道则需要指定 String。如果我们想以带有 RFC\
  \ 参数的 WCF 消息接收 IDOC 则需要指定 RFC。请注意，这些属性可以在 BizTalk Administration 控制台中配置接收位置时进行修改。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_197_0.png)\n\n6. 现在配置已设置好，单击 OK 按钮返回主向导。\n\
  \n7. 只要我们正确配置了向导，现在就可以单击 Connect 按钮建立与 SAP 的连接。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_197_1.png)\n\
  \n8. 我们接下来需要问自己的问题是这是一个入站还是出站操作。重要的是记住提出此问题时的上下文。该问题是从 BizTalk 角度提出的。 此 IDOC 将是\
  \ BizTalk 的出站操作还是入站操作？由于我们将 IDOC 发送到 SAP，因此我们希望指定客户端（出站操作）。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_197_2.png)\n\
  \n\n\n9. 如果我们想要从 SAP 接收 IDOC，我们将需要指定服务（入站操作）：\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_198_0.png)\n\
  \n10. 下一个需要关注的区域是“搜索类别”功能。为了使该功能正常工作，我们需要指定“选择类别”，因为我们无法搜索 SAP 整个 BAPI、IDOC、RFC\
  \ 和 TRFC 目录。为本次演示的目的，我们将选择 IDOC。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_198_1.png)\n\
  \n11. 在此文本框中，我们可以提供通配符搜索，然后点击绿色箭头执行搜索。在这种情况下，我们可以提供术语 CONF，这将搜索确认 IDOC。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_198_2.png)\n\
  \n12. 我们将在“可用类别和操作”列表中看到搜索结果。我们感兴趣的特定 IDOC 是 CONF32 IDOC。一旦选择了此 IDOC，我们可以点击“添加”，然后该\
  \ IDOC 将被添加到“已添加类别和操作”列表框中。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_199_0.png)\n\
  \n13. 使用旧的基于 .NET Connector 的适配器，一个 IDOC 等于一个 BizTalk XSD 架构。这已不再是这种情况。Consume Adapter\
  \ Service 向导将为每个 IDOC 生成多个架构。原因在于向导会为特定的 SAP 类型创建架构，然后将其导入到主架构或父架构中。如果解决方案中有许多 IDOC，这可能会变得非常混乱，除非提供文件名前缀。如果我们提供前缀，例如\
  \ CONF32，所有架构都将以此前缀开头，这将使我们能够组织和区分我们的架构。\n\n14. 一旦我们提供了此前缀，我们可以点击“确定”按钮，我们的 IDOC\
  \ 架构将被生成。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_199_1.png)\n\n15. 虽然这种方法很方便，但它也带来了一些问题。当您点击“确定”按钮时，它将从\
  \ SAP 系统下载 IDOC 的每个版本。这可能会导致您拥有比感兴趣的更多架构，并且也可能导致 Consume Adapter Service 向导超时，因为要检索的数据太多。\n\
  \n16. 我们还有另一个选择，即浏览 IDOC 目录并找到我们感兴趣的 IDOC 的确切版本。正如以下图像所示，我们的 SAP 系统中有许多不同版本的 IDOC。选择您感兴趣的\
  \ IDOC 版本，点击“添加”按钮。如果我们使用之前提到的步骤下载所有版本，我们的 BizTalk 解决方案将会变得极其臃肿。通过浏览到我们感兴趣的确切版本，我们将只下载该版本以及包含复杂类型的任何支持架构。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_200_0.png)\n\n17. 我们现在有机会提供文件名前缀。如果我们不提供前缀，向导将提供一个非常通用的文件名，这无法将其与其他\
  \ SAP 架构区分开。我们应该使用描述性前缀，以便我们能够轻松地区分此架构与解决方案中将拥有的其他架构。我们可以点击“确定”按钮将架构添加到 BizTalk\
  \ 解决方案中。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_200_1.png)\n\n18. 我们现在会发现有六个构件被添加到我们的解决方案中。\n\
  我们感兴趣的主要架构是 CONF32IDOCoperation.CONF32.700.3.Send.xsd。剩余的架构用于支持发送 IDOC，我们还拥有一个绑定文件，其中包含我们用于配置\
  \ Consume Adapter Service 向导的值。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_201_0.png)\n\
  \n19. Consume Adapter Service 向导允许我们一次生成单个 IDOC 架构或多个 IDOC。当处理多个架构时，我们需要小心 IDOC\
  \ 不要共享可能导致编译错误的底层公共类型。为了避免这些编译时错误，我们可以选中“生成唯一架构类型”复选框。通过这样做，我们将增加添加到解决方案中的架构数量。额外的架构将包含唯一的命名空间，这使我们能够避免编译时错误。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_201_1.png)\n\n> 注：BizTalk 2010 的新功能是\
  \ SAP URI 可以在 Consume Adapter Service 向导的启动之间保存。以前，每次我们想要生成架构时，都必须填充整个 URI 配置。这是一个节省大量时间和极其方便的功能，已被添加。请注意，如果您使用用户名作为客户端凭据类型，则每次运行向导时仍需要提供密码。\n\
  \n## IDOC Deep Dive\n\n现在是时候更深入地了解 IDOC 的结构，以便更好地理解 BizTalk 开发人员必须了解的一些段。\n\n在每个\
  \ IDOC 架构中，您可以期望以下元素：\n\n- EDI_DC40\n- SAP table(s), that is, E2CONF5\n- guid\n\n\
  EDI_DC40 节点也称为标头节点或记录。在此节点中，我们会发现需要填充的多个字段，包括：\n\n| Element Name | Purpose |\n|---|---|\n\
  | IDOCTYP | IDOC 的基本结构。 |\n| CIMTYP | 自定义扩展的结构。如果扩展了 SAP 基本结构，则必须为扩展指定名称。 |\n| MESTYP\
  \ | 消息的逻辑表示。名称应提供业务上下文含义。 |\n| SNDPOR | 发送系统端口 |\n| SNDPRN | 发送系统/合作伙伴 |\n| SNDPRT\
  \ | 发送方合作伙伴类型 |\n| RCVPRT | 接收方合作伙伴类型 |\n| RCVPRN | 接收系统/合作伙伴 |\n| IDOCTYP | IDOC\
  \ 的基本结构 |\n\n根据 IDOC 的不同，IDOC 中可能表示一个或多个 SAP 表。在 CONF32 IDOC 的情况下，只有一个，称为 E2CONF5。在此段或节点中，有多个字段需要我们填充。\n\
  \n| Element Name | Purpose |\n|---|---|\n| LDATE | 确认的逻辑日期/实际日期。在我们的情况下，我们只需提供当前日期。\
  \ |\n| BUDAT | 确认的过账日期。在我们的情况下，我们只需提供当前日期。 |\n| LTIME | 确认的逻辑时间/实际时间。在我们的情况下，我们只需提供当前时间。\
  \ |\n| ERTIME | 确认的录入时间。在我们的情况下，我们只需提供当前时间。 |\n| ARBPL | 工作中心 |\n| AUFNR | 此字段用于提交作业的订单号。\
  \ |\n| VORNR | 订单号通常与其关联操作，因此我们可以利用此字段提供操作号。 |\n| ISMW | 已执行工作的持续时间。 |\n\n最后，存在一个\
  \ GUID 元素，它与 SAP 事务 ID (TID) 相关联。我们可以提供自己的 GUID，或让适配器提供 GUID。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_203_0.png)\n\
  \n## Building a BizTalk application – Sending IDOC\n\n我们将要构建的应用程序将从我们的工单管理系统接收车辆工时表，转换数据并构建\
  \ CONF32 确认 IDOC。您可能会问自己“车辆有工时表”？是的！此场景是现实世界解决方案的一个示例，我们在能源部门有员工在进行能源基础设施维护工作。就像我们期望跟踪员工在工作上花费的时间一样，我们也希望跟踪已使用设备的时长。车辆构成了作业总体成本的很大一部分，因此我们希望确保这些成本在\
  \ SAP 中得到记录。开箱即用的 CONF32 IDOC 允许我们在无需定制的情况下将此信息发送到 SAP。\n\n1. 我们要进行的第一个任务是生成 **CONF32**\
  \ IDOC。为了简化此过程，我们可以利用本章中 *How to Generate IDOC schemas* 部分讨论的步骤。最终结果是我们应该具有以下架构：\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_204_0.png)\n\n2. 下一个需要关注的区域是生成表示工单管理系统将发送的\
  \ XML 的架构。本章源代码中存在一个名为 `VehicleTime.xsd` 的简单架构。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_204_1.png)\n\
  \n3. 我们现在需要构建一个名为 `VehicleTime_to_CONF32.btm` 的映射。在此映射中，我们将有两个选项卡。我们要构建的第一个选项卡是\
  \ **Control Record** 选项卡。在此选项卡中，我们需要向 SAP 提供有关我们即将发送的 IDOC 的元数据。SAP 将使用此信息来确定应如何处理\
  \ IDOC。SAP 还将使用提供的合作伙伴信息来确定提交 IDOC 的 BizTalk 用户是否具有适当的权限。\n\n\n\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_205_0.png)\n\
  \n4. 下表包含已提供给每个节点的数值。此信息通常是静态的，但最好将此信息存储在公共的 Helper 类中，这样如果需要更改，就可以在一个地方进行修改。为本章的目的，我们将使用\
  \ String Concatenate functoids 直接嵌入此信息。请注意，像 SNDPOR、SNDPRN 和 RCVPRN 这样的某些值在你的 SAP\
  \ 系统中很可能不同。\n\n| Node | Value |\n|------|-------|\n| /EDI_DC40/TABNAM | EDI_DC40\
  \ |\n| /EDI_DC40/IDOCTYP | CONF32 |\n| /EDI_DC40/CIMTYP | CONF32 |\n| /EDI_DC40/MESTYP\
  \ | CONF32 |\n| /EDI_DC40/SNDPOR | MTSIDOC |\n| /EDI_DC40/SNDPRT | LS |\n| /EDI_DC40/SNDPRN\
  \ | MTSIDOC |\n| /EDI_DC40/RCVPRT | LS |\n| /EDI_DC40/RCVPRN | MTSIDOC |\n| /E2CONF5/SATZA\
  \ | I20 |\n| /E2CONF5/ISMNE | H |\n\n5. 我们接下来要创建的是 **Data** 选项卡。在此选项卡中，我们将专注于从工单管理系统传递的数据，并执行\
  \ SAP 所需的任何格式处理。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_206_0.png)\n\nNote:\
  \ BizTalk 2010 映射器的新功能是可以仅显示当前已映射的节点。要启用此功能，请单击 **Switch to relevance tree view\
  \ for destination schema** 按钮。选中后，BizTalk 映射器将仅显示当前正在映射的节点。此功能在映射具有许多节点的 SAP IDOC\
  \ 时非常有帮助。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_206_1.png)\n\n6. 在 BizTalk\
  \ 映射完成后，我们可以专注于 BizTalk 协调，该协调将负责在工单管理系统和 SAP 之间编排事件。协调将负责以下功能：\n\n- a. 接收包含车辆时间的工单管理请求。\n\
  - b. 将此请求转换为 SAP CONF32 IDOC 请求。\n- c. 接收 SAP CONF32 IDOC 响应。\n- d. 将 SAP CONF32\
  \ IDOC 响应写入磁盘，以便我们可以验证与 SAP 的交换是否成功。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_207_0.png)\n\
  \n7. 由于我们不使用 Flat File 架构，而是选择使用 SAP 适配器的 SOAP 消息功能，因此现在可以通过右键单击解决方案并选择部署解决方案来部署我们的应用程序。\n\
  \n8. 进入 BizTalk 管理控制台后，我们会发现一个名为 Chapter04-SAPIDOCs 的应用程序现在已存在。\n\n9. 在此应用程序中，我们可以找到一个名为\
  \ **ReceiveVehicleTimeSheet** 的接收端口和一个名为 **ReceiveVehicleTimeSheetFromDisk** 的接收位置。此接收位置将使用\
  \ **FILE** 适配器、**BizTalkServerApplication** 接收处理程序和 **XMLReceive** 接收管道。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_208_0.png)\n\
  \n10. 我们将有两个发送端口，其中第一个是用于与 SAP 通信的发送端口。Consume Adapter 向导生成了一个绑定文件，我们可以使用它自动生成发送端口。此方法的问题在于绑定文件将使用\
  \ WCF Custom 适配器，这不允许我们轻松操作 SAP 连接详细信息。由于我们通常在非生产环境中创建 SAP IDOC 架构，因此我们不太可能充分利用生成的绑定文件，因为在每个\
  \ BizTalk 环境中的目标都会不同。\n\n11. SAP 发送端口的名称为 **SendCONF32IDOC**。它将使用 WCF-SAP 自定义适配器、**BizTalkServerApplication**\
  \ 发送处理程序、**XMLTransmit** 发送管道和 **XMLReceive** 管道。通过单击配置按钮，我们可以进一步探索 SAP 适配器公开的属性。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_209_0.png)\n\n12. General 选项卡将公开我们的端点地址和\
  \ SOAP Action 头。要进一步探索地址 URI，我们可以单击配置按钮。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_209_1.png)\n\
  \n13. General 选项卡上的配置按钮是使用 WCF-Custom 适配器配合 SAP 绑定与使用 WCF-SAP 适配器之间的关键区别之一。如以下图像所示，WCF-SAP\
  \ 适配器在配置 SAP 配置时为我们提供了更多选项。我们想要填充的关键属性是：\n\n- a. Application Server Host\n- b. System\
  \ Number\n- c. Client\n\n14. 如果你不确定组织的数值，请联系你的 BASIS 管理员。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_210_0.png)\n\
  \n15. 我们需要关注的下一个选项卡是 Credentials 选项卡。在此选项卡中，我们将提供用于与 SAP 通信的 BizTalk 凭据。我们可以指定用户名/密码组合或\
  \ SSO 联盟应用程序。为本章的目的，我们将简单提供用户名/密码。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_211_0.png)\n\
  \n16. 我们需要创建的下一个发送端口是将 SAP IDOC 响应写入磁盘的发送端口。此发送端口的名称为 **SendIDOCResponseToDisk**，它将使用\
  \ **FILE** 适配器、**BizTalkServerApplication** 的发送处理程序、**PassThruTransmit** 的发送管道。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_211_1.png)\n\n17. 现在我们需要配置我们的编排以使用我们刚刚创建的接收端口和发送端口。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_212_0.png)\n\n18. 现在我们可以启动我们的应用程序，以便准备进行应用程序测试。\n\
  \n## Testing BizTalk Application\n\n我们的应用程序测试涉及将示例文件复制并粘贴到接收位置配置的热文件夹中。文件内容将包括：\n\
  \n- VehicleID\n- Order Number\n- Order Duration\n- Order Operation\n- Order Date\n\
  - Order Time\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_213_0.png)\n\n- 1. 要初始化测试，请复制并粘贴位于\
  \ C:\\LOBIntegration\\Chapter04\\Chapter04-SAPIDOCs\\FileDropfolder 的 VehicleTimeSample.xml\
  \ 文件。\n- 2. BizTalk 将使用此文件并开始处理文件。\n- 3. 一旦 BizTalk 与 SAP 通信，SAP 应向 BizTalk 返回响应。\n\
  - 4. BizTalk 将采用此响应并生成一个名为 IDOCoutput{GUID}.xml 的文件。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_213_1.png)\n\
  \n## Custom IDOCs\n\n前面的示例包含了一个“开箱即用”的 CONF32 SAP IDOC。虽然能够开箱即用地与 SAP 集成极具吸引力，但现实是，对于组织感兴趣的每个集成场景都期望有一个开箱即用的\
  \ IDOC 是不现实的。大多数组织会在考虑构建自定义 IDOC 之前尝试使用开箱即用的 IDOC。当被迫构建时，SAP 开发人员有几个选项：\n\n- Extend\
  \ existing IDOCs.\n- Copy an IDOC structure and modify as you see fit.\n- Start\
  \ a new IDOC from Scratch.\n\n扩展 IDOC 涉及保持 IDOC 结构完整，但添加场景所需的额外段。这是当你只缺少几个段并希望利用\
  \ SAP 现有工作时理想的解决方案。\n\n如果 SAP 有一个与你的场景 somewhat 相似的 IDOC，你可以复制该现有结构，然后根据需要添加或删除段。\n\
  \n虽然 SAP 确实提供了一个丰富的平台来运行你的业务，但它们不可能预见每一个集成场景。这就给我们提供了自定义构建一个解决我们独特集成场景的 IDOC 的选项。\n\
  \nBizTalk 能够通过这三种机制与 SAP 集成。使用开箱即用的 IDOC 是首选选项，因为它不需要自定义，并且你可以确保 SAP 在未来版本中提供支持。如果你编写自定义\
  \ IDOC 并且其执行的功能与 SAP 的升级路径冲突，你的组织将自行解决任何问题。\n\n在生成自定义 IDOC 时，从 BizTalk 角度来看不需要任何特殊操作。我们继续使用\
  \ Consume Adapter Service 向导，就像我们尝试为开箱即用 IDOC 生成架构一样。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_214_0.png)\n\
  \n> Note: 如果构建自定义 IDOC 的 SAP 开发人员说 IDOC 可用，但在 Consume Adapter Service 向导中你看不到它在可用\
  \ IDOC 列表中，请要求他们确保 IDOC 已发布。\n\n下面是一张自定义 IDOC 的图像。如你所见，它与 SAP 开箱即用 IDOC 看起来并没有太大不同。架构将同时具有\
  \ **idocData** 和 **EDI_DC40** 节点。剩余的节点或段是由 SAP 开发人员构建的。\n\n\n\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_215_0.png)\n\
  \n类似于开箱即用的 IDOC，我们的自定义 IDOC 架构也将继承共享类型。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_215_1.png)\n\
  \n## 从 SAP 接收自定义 IDOC\n\n- 1. 以下演练将描述接收自定义 IDOC（或标准 IDOC）所涉及的内容。本演练的源代码未包含在本书的源代码中，因为在\
  \ SAP 内部构建自定义 IDOC 超出了本书的范围。由于在与 SAP 集成时很可能会出现自定义场景，因此本演练包含在本章中，但会根据贵组织中 SAP 的实施方式而有所不同。\n\
  \n- 2. 接收带类型 IDOC 时，需要进行配置才能成功处理消息。当我们部署包含任何 IDOC 架构的 BizTalk 应用程序时，我们需要添加对 Microsoft.Adapters.SAP.BiztalkPropertySchema.dll\
  \ 的引用。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_216_0.png)\n\n- 3. 如果未添加此引用，在尝试处理\
  \ SAP IDOC 时，您可以在事件查看器中看到以下运行时错误：\n\n```\n\"System.Exception: Loading property information\
  \ list by namespace failed or property not found in the list. Verify that the schema\
  \ is deployed properly.\"\n```\n\n- 4. 由于此错误仅在首次接收 IDOC 时才会出现，将此资源引用添加到任何部署脚本中是您希望包含的内容。\n\
  \n- 5. 在放置了适当的引用后，我们可以继续配置我们的 BizTalk 应用程序，该应用程序由接收端口和发送端口组成。鲜为人知的是，在交换 IDOC 时，您可以选择指定单向或双向端口。IDOC\
  \ 响应通常提供来自 SAP 的事务 ID，因此除非您有兴趣跟踪此信息，否则可能不需要使用双向端口。\n\n- 6. 部署包含任何自定义 IDOC 架构的 BizTalk\
  \ 应用程序。\n\n- 7. 创建一个名为 **ReceiveCustomIDOC** 的单向接收端口和一个名为 **ReceiveCustomIDOCFromSAP**\
  \ 的接收位置。我们将使用 **WCF-SAP** 适配器、**BizTalkServerApplication** 接收处理程序和 **XMLReceive**\
  \ 接收管道。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_217_0.png)\n\n- 8. 单击 **Configure**\
  \ 按钮，以便我们可以提供 SAP 连接信息。\n\n- 9. 进入 WCF-SAP 传输属性对话框后，我们需要单击 **Configure** 按钮以提供 SAP\
  \ 连接信息。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_217_1.png)\n\n- 10. 类似于我们前一个示例中的\
  \ SAP 发送端口，我们需要提供 **Application Server Host**、**System Number** 和 **Client**。\n\n\
  ![](img/23d1402649b6528b085cd6b900a2c9c3_218_0.png)\n\n- 11. 如果我们向下滚动，将会发现一些在发送端口配置中未包含的额外属性：\n\
  \  - a. **Gateway Host** – 根据 SAP 系统的配置，此值可能与 Application Server Host 相同。\n  - b.\
  \ **Gateway Service** – 此值通常以 \"sapgw\" 开头，后跟 System Number。\n  - c. **Program Id**\
  \ – 这是由您的 BASIS 管理员提供的数值。它也可能被称为 Partner Profile，并充当 SAP IDOC 接口的授权容器。例如，在 SAP 中此\
  \ **WOMIDOC Program ID** 配置中，将存在我们即将接收的此自定义 IDOC 的条目。此外，我们的 BizTalk 用户将被授予发送或接收这些类型\
  \ IDOC 的权限。如果 BizTalk 尝试发送其没有权限的 IDOC，SAP 将接受该消息但不会处理它。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_219_0.png)\n\
  \n- 12. 我们需要处理的下一个选项卡是 Other 选项卡。此选项卡为我们提供各种凭据选项。再次，我们将使用 Username/ Password 作为身份验证类型。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_219_1.png)\n\n- 13. 接收端口配置完成后，现在是关注发送端口的时候了。在此简单场景中，我们不会让编排处理此消息，而是让发送端口订阅此接收端口并将\
  \ IDOC 的内容写入文件文件夹。此发送端口的名称为 SendCustomIDOCToDisk。它将使用 FILE 适配器、BizTalkServerApplication\
  \ 发送处理程序和 PassThruTransmit 发送管道。\n\n- 14. 在 Filters Property 中，我们希望针对我们的 ReceiveCustomIDOC\
  \ Receive Port 创建一个订阅。这样做将允许我们处理通过接收端口接收的任何消息，并将其写入发送端口中指定的 URI。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_220_0.png)\n\
  \n- 15. 在此阶段，接收端口和发送端口都已配置好后，我们可以同时启用发送端口和接收位置。\n\n## 测试 BizTalk 应用程序—接收自定义 IDOC\n\
  \n将 SAP 与 BizTalk 集成时，此过程的这一部分几乎总是变得困难。原因在于 BizTalk 会监听 SAP 消息。您无法指示 BizTalk 去从\
  \ SAP 检索 IDOC。您可以将其视为托管 Web 服务；客户端系统必须发起请求。在此情况下，客户端是 SAP。\n\nSAP 是一个非常庞大的系统，有许多屏幕或事务需要调用才能启动向\
  \ BizTalk 发送 IDOC。最终结果是您几乎总是需要团队协作或记住生成 IDOC 的复杂步骤。随着小错误的解决，此过程可能会让 BizTalk 和 SAP\
  \ 开发人员都感到沮丧。\n\n对 SAP 开发人员和 BizTalk 开发人员都可能有益的方法是让 SAP 资源生成初始 IDOC 并让 BizTalk 处理该\
  \ IDOC。如果 BizTalk 开发人员需要对他的接口执行额外的测试，甚至负载测试，他可以通过使用名为 \"WE19\" 的 SAP 事务来实现。此事务将重新处理传入和传出的\
  \ IDOC。\n\n如果我们想重新发送 IDOC 到 BizTalk，我们需要知道原始 IDOC 的 IDOC 编号，然后就可以从 SAP 重新提交消息到 BizTalk。为了获取\
  \ IDOC 编号，我们将使用名为 \"WE02\" 的事务。大多数 SAP 开发人员都可以访问这两个事务，因此 BizTalk 开发人员获得这些事务的相同访问权限不应太困难。除了在负载测试场景中尝试处理太多消息外，用户使用这两个事务几乎不会造成什么损害。\n\
  \n现在让我们逐步介绍浏览 WE02、获取 IDOC 编号，然后在 WE19 中使用该 IDOC 编号将 IDOC 提交到 BizTalk 的过程。\n\n-\
  \ 1. 登录 SAP GUI 后，在导航文本框中输入 WE02 并按 *Enter*。\n- 2. 在 WE02 中，我们可以限制希望查询的时间范围。如果您的组织处理大量\
  \ IDOC，您希望确保此查询窗口很小。指定查询时间范围后，我们可以单击 **Execute** 按钮，该按钮以带绿色勾号的时钟表示。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_221_0.png)\n\
  \n- 3. 查询结果返回后，我们将看到最近发送或接收的 IDOC 列表。在屏幕左侧，我们可以通过单击 **Inbound** 或 **Outbound** IDOC\
  \ 来细化结果。我们甚至可以在只关注该类型时单击我们感兴趣的特定 IDOC 类型。还值得注意的是此显示中包含的各种列。**Status** 和 **Status\
  \ code** 列有助于了解 IDOC 的成功/失败情况，而 **Direction** 列有助于区分 IDOC 是入站还是出站。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_222_0.png)\n\
  \n- 4. 我们使用 WE02 事务的主要原因是获取之前发送的 IDOC 的 IDOC 编号。获取它的最简单方法是扫描 **IDOC Number** 列并记下我们感兴趣的\
  \ IDOC 的值。\n\n\n\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_223_0.png)\n\n5. 一旦我们有了\
  \ IDOC 编号，我们可以导航到 WE19 交易并在“现有 IDOC”文本框中填写该编号，且不带前导零。要执行该交易，请单击“执行”按钮。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_223_1.png)\n\
  \n6. IDOC 的段落现在将显示。我们现在需要决定 SAP 对此 IDOC 应该做什么。如果这是入站 IDOC，则我们将单击“标准入站”按钮。由于这是一个出站\
  \ IDOC，我们将单击“标准出站处理”按钮。需要注意的是，SAP 并不会重新处理此消息。它只是复制原始消息并通过端口将其发送到 BizTalk 服务器。当此消息发送到\
  \ BizTalk 时，SAP 内不会进行任何额外的重新处理。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_224_0.png)\n\
  \n7. 我们现在有机会指定希望发送到 BizTalk 的 IDOC 副本数量。在我们的场景中，我们将选择 1 份副本并单击绿色复选标记。此功能在 BizTalk\
  \ 开发者希望进行应用程序负载测试时提供了有趣的机会。如果您决定使用 WE19 交易来对 BizTalk 应用程序进行负载测试，请确保您与 BASIS 团队进行沟通，以便减轻\
  \ SAP 中的任何性能问题。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_224_1.png)\n\n8. SAP\
  \ 现在将提交此消息并显示确认消息。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_225_0.png)\n\n9.\
  \ 正如预期，BizTalk 将接收此消息并将其发送到文件 drop。当我们打开文件时，我们将看到 IDOC 以 XML 形式表示，其基于 Consume Adapter\
  \ Service 向导生成的 XSD 架构。\n\n```\n<Receive xmlns=\"http://Microsoft.LobServices.Sap/2007/03/Idoc/3/ZCU_EXTRACT//700/Receive\"\
  >\n  <idocData>\n    <EDI_DC40 xmlns=\"http://Microsoft.LobServices.Sap/2007/03/Types/Idoc/3/ZCU_EXTRACT//700\"\
  >\n      <ZCU_HEADER000 xmlns=\"http://Microsoft.LobServices.Sap/2007/03/Types/Idoc/3/ZCU_EXTRACT//700\"\
  >\n      ...\n      <ZCU_EXTRACT_PARENT000 xmlns=\"http://Microsoft.LobServices.Sap/2007/03/Types/Idoc/3/ZCU_EXTRACT//700\"\
  >\n        <DATAHEADERCOLUMN_SEGNAM>ZCU_EXTRACT_PARENT000</DATAHEADERCOLUMN_SEGNAM>\n\
  \        <DATAHEADERCOLUMN_SEGNAM>010</DATAHEADERCOLUMN_SEGNAM>\n        ...\n \
  \       <CU_ID>C2S33NXXX</CU_ID>\n        <CU_ACTION>INSTALL</CU_ACTION>\n     \
  \   <CU_CATEGORY>2</CU_CATEGORY>\n        <CU_DESCRIPTION>DrPh #2 AGSR SB Haddock</CU_DESCRIPTION>\n\
  \        <CU_TYPE>CONDUCTOR</CU_TYPE>\n```\n\n## Receiving flat file IDOCs\n\n如果我们仔细检查\
  \ BizTalk 在前一场景中从 SAP 接收到的消息，我们会注意到命名空间中有一个有趣的地方。DOCREL（文档版本）包含在 Consume Adapter\
  \ Service 向导生成的架构的命名空间中。\n\n```\n<Receive xmlns=\"http://Microsoft.LobServices.Sap/2007/03/Idoc/3/ZCU_EXTRACT//700/Receive\"\
  >\n  <idocData>\n    <EDI_DC40 xmlns=\"http://Microsoft.LobServices.Sap/2007/03/Types/Idoc/3/ZCU_EXTRACT//700\"\
  >\n      <ZCU_HEADER000 xmlns=\"http://Microsoft.LobServices.Sap/2007/03/Types/Idoc/3/ZCU_EXTRACT//700\"\
  >\n      ...\n      <ZCU_EXTRACT_PARENT000 xmlns=\"http://Microsoft.LobServices.Sap/2007/03/Types/Idoc/3/ZCU_EXTRACT//700\"\
  >\n        <DATAHEADERCOLUMN_SEGNAM>ZCU_EXTRACT_PARENT000</DATAHEADERCOLUMN_SEGNAM>\n\
  ```\n\n如果我们检查接收 IDOC 从 SAP 时填充的上下文属性，我们会发现 SAP 正在发送正在发送的 IDOC 的 DOCREL。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_226_0.png)\n\
  \n那么大问题是什么呢？这不是什么大问题，直到贵组织下一次执行 SAP 升级时。如果新的 SAP 版本会递增 DOCREL 编号，那么您的 BizTalk 订阅将无效，因为您的订阅将查找版本\
  \ 700 的文档，而 SAP 将发送版本 710（或其他编号）。\n\n一种缓解这种情况的方法是使用平面文件管道，这使我们作为开发者能够控制接收消息的命名空间。只要\
  \ IDOC 结构不变，这种方法就能在升级后继续使用。\n\n这种类型的架构版本问题应该在 SAP 升级的集成测试期间暴露出来。然而，经历过 SAP 升级后，我不希望自己成为导致为解决\
  \ DOCREL 架构版本问题而花费 X 天/周/月努力的原因。\n\n在与 SAP IDOC 集成时使用平面文件管道并不是一个新概念，因为在 BizTalk\
  \ Adapter Pack 之前，使用基于旧版 .NET Connector 的适配器接收 IDOC 时，这是唯一的方法。确实有一些额外的开销，因为您需要创建额外的管道，但避免\
  \ DOCREL 问题可能值得这种轻微的麻烦。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_227_0.png)\n\
  \n有关此问题的更多信息，请访问以下博客文章：http://kentweare.blogspot.com/2010/01/biztalk-adapter-pack-20-sap-adapter.html\n\
  \n## Summary\n\n在本章中，我们了解了 SAP、其软件的使用方式、与之集成时的一些挑战、标准和自定义 IDOC，以及在构建集成解决方案时帮助 BizTalk\
  \ 开发者使用的一些 SAP GUI 交易。\n\nSAP 通常代表组织的系统记录，或皇冠上的明珠。增加高效集成 SAP 的能力将为贵组织打开许多新的企业机会，这可能带来竞争优势。\n\
  \n虽然与 SAP 集成需要一些底层先决知识，但一旦组织实现了第一个接口，额外的接口可以非常快速地实现，因为基础组件已经建立并且可以继续利用。BizTalk 非常有能力在关键任务情况下与\
  \ SAP 集成，不应因 SAP 管理员的偏执而被否定。\n\n正如您可能已经开始认识到的那样，与 SAP 集成是一个非常大的主题，甚至值得一整本书专门讨论，更不用说一章了。考虑到这一点，本书中还包含了一章，讨论使用远程函数调用（RFCs）和\
  \ BAPI 以同步模式集成 SAP。您可以在第 5 章阅读有关 RFC 和 BAPI 功能的所有内容。\n"
- "## 5 WCF SAP Adapter RFCs and BAPIs\n\n在上一章中，我们讨论了在与 SAP 集成时使用 IDOC 的各种情况。在本章中，我们将继续研究其他\
  \ SAP 集成技术，包括 RFC 和 BAPI。\n\n在本章中，我们将讨论以下主题：\n\n- SAP RFC 和 BAPI 概述\n- RFC/BAPI\
  \ 与 IDOC\n- 架构生成\n- 自定义与开箱即用的 RFC/BAPI\n- RFC 演练\n- BAPI 演练\n- 提示、陷阱和故障排除\n\n##\
  \ Overview of SAP RFCs and BAPIs\n\nRFC 和 BAPI 术语经常被互换使用，尤其是由非 SAP 资源使用。技术上，它们非常相似，但在细节层面上运行。接下来的一节中，我们将进一步发现这两种技术之间的相似性和差异。\n\
  \n## RFCs\n\nRFC 代表 Remote Function Call，远程函数调用，是在 SAP 系统之间交换数据或在非 SAP 系统与 SAP 系统之间交换数据时的标准\
  \ SAP 接口。您可以将 RFC 想象成类似 C# 方法，不同之处在于 SAP 提供了一个接口，允许与 SAP 系统进行通信。有三种不同类型的 RFC：\n\n\
  | RFC Type | Description |\n|---|---|\n| Synchronous RFC | 正如名称所示，此类型的 RFC 在 SAP\
  \ 与 SAP 系统之间或 SAP 与非 SAP 系统之间交换信息时使用请求-响应连接。由于请求-响应需求的流行，这可能是最受欢迎的 RFC 类型。 |\n|\
  \ Transactional RFC (tRFC) | “Transactional RFCs（tRFCs）是在逻辑工作单元（LUW）的一部分中调用的 RFC。在\
  \ SAP 系统中，LUW 包含完成业务或编程任务所需的所有步骤。tRFC 代表调用 RFC 的一种方式；它不是唯一的 SAP 构件。” 此 RFC 之前被称为异步\
  \ RFC，有其原因。一旦请求从客户端发送，SAP 将处理这些数据并关联唯一的事务 ID。此 ID 和相应数据将存储在 SAP 中，这允许断开连接的客户端在重新上线时接收信息。此\
  \ ID 也在调用 RfcConfirmTransID 操作时使用，该操作将确认 tRFC 调用并允许 SAP 从其数据库中删除当前条目。tRFC 保证所有逻辑工作单元（LUW）将被执行，但不能保证事务的顺序在执行过程中会被保持。另请注意，使用此方法会有性能损失。\
  \ |\n| Queued RFC (qRFC) | 如果您需要保证多个事务，无论是入站还是出站，按顺序执行，则 qRFC 提供按顺序、一次仅交付。就像其他有序交付场景一样，使用此方法会有性能损失。注意：qRFC\
  \ 客户端功能已从 Microsoft BizTalk Adapter 3.0 起在 BizTalk 中弃用。有关 qRFC 的更多信息，请参阅此链接：http://msdn.microsoft.com/en-us/library/cc185531(BTS.10).aspx\
  \ |\n\n本书的范围侧重于同步 RFC。有关 tRFC 的更多信息，请参阅 MSDN：http://msdn.microsoft.com/en-us/library/cc185268(v=BTS.10).aspx\n\
  \n\n\n## BAPIs\n\n描述业务应用编程接口（BAPI）最简单的方式是 RFC 启用的函数模块。函数模块是属于一起的特定领域函数的逻辑分组。例如，我们可能有一个人力资源（HR）函数模块，其中包含所有可用的\
  \ HR 操作。BAPI 与 RFC 之间的关键区别在于它们操作的详细程度。可以认为 BAPI 在业务流程级别运行，而 RFC 则在更低或更细粒度的级别运行。\n\
  \n## RFCs/BAPIs vs. IDOCs\n\n经常出现的一个问题是何时使用 RFCs/BAPIs 与 IDOCs。实际上取决于几个因素：\n\n-\
  \ 您的集成场景是同步还是异步？\n- 是否存在开箱即用的接口？\n- 您是否试图将多个事件/流程串联起来？\n- 您的流程是否需要 SAP 工作流？\n\n\
  ## Synchronous vs asynchronous\n\n同步场景更适合利用 RFCs/BAPIs，因为它们具有即时的请求/响应机制。例如，假设 SAP\
  \ 是贵组织内客户的记录系统，但您选择为特定应用使用 Dynamics CRM/XRM。如果不必，我们就不想在两个系统中手动输入客户信息。因此我们可以构建一个接口来查询\
  \ SAP 以检索组织中现有客户的主数据。在这种情况下，如果我们期望立即响应，就不希望使用 IDOC，因为 BizTalk 会发送 IDOC 然后必须异步等待\
  \ SAP 的响应。当 SAP 将响应发送回 BizTalk 时，我们可能需要将此响应与发送到 SAP 的请求进行关联，以便 BizTalk 能够向调用应用程序提供正确的响应。\n\
  \n相反，如果您的场景不需要立即响应，例如即发即弃场景，则使用异步模式可以提供一些额外的缓冲来将消息传递给 SAP。在提供订单更新给 SAP 的工单管理系统（WOM）中，WOM\
  \ 系统希望更新能够到达 SAP，但不需要立即反馈消息已发送。例如，如果我们的 SAP 系统有定期维护窗口执行备份，我们不希望 WOM 系统在此计划停机期间被中断。BizTalk\
  \ 可以使用其开箱即用的重试机制可靠地将此消息传递给 SAP。\n\n## Does an out-of-box interface exist?\n\n这种情况可能两种方式都可行。并非所有接口都一样。例如，可能存在允许您提交员工考勤记录的\
  \ IDOC，而 RFC/BAPI 可能不存在，反之亦然。能够使用开箱即用接口并减少或防止 SAP 定制，是一种在一种接口类型与另一种接口类型之间做出选择的合理情况。\n\
  \n## Are you trying to chain multiple events/processes together?\n\n本章前面我们介绍了逻辑工作单元的概念。如果您有多个逻辑上将业务流程联系在一起的工作单元，那么使用\
  \ RFC/BAPI 是更好的选择，因为它能够提交和回滚事务。IDOC 是彼此不相关的独立实体。\n\n## Workflow\n\n如果您需要在集成场景中执行\
  \ SAP 工作流，那么使用 IDOC 是更好的替代方案。您不希望 BizTalk 在客户端的请求-响应情况下处于中间位置，而 SAP 正在执行工作流。此处的风险是\
  \ SAP 工作流的执行可能因工作流负载和优先级而变得难以预测。\n\n## Schema generation\n\n如果您阅读了一些前面的章节，您已经非常熟悉\
  \ Consume Adapter Service Wizard。考虑到这一点，我们将简要回顾此向导以涵盖 RFC/BAPI 材料。\n\n## Outbound\
  \ operations\n\n执行客户端出站操作（来自 BizTalk）时，我们可以选择以下合约类型：\n\n- BAPI\n- IDOC\n- RFC\n\
  - TRFC\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_233_0.png)\n\n如果我们展开 BAPI 节点，我们会发现我们的架构是根据其在\
  \ SAP 系统中的功能角色进行排序的。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_233_1.png)\n\n\
  ## Inbound Operations\n\n执行服务入站操作（到 BizTalk）时，我们可以选择以下合约类型：\n\n- IDOC\n- RFC\n-\
  \ TRFC\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_234_0.png)\n\n## Calling RFCs/tRFCs\
  \ hosted in BizTalk\n\n如果您还记得，RFC 与 BAPI 之间的关键区别之一是业务对象仓库。BizTalk 不会在任何地方存储这些业务对象，因此\
  \ BizTalk 无法托管 BAPI，因为底层的函数模块将不可用。\n\nBizTalk 托管 RFC 有趣之处在于 SAP 可以消费它，甚至不会知道它是在调用外部系统而不是另一个\
  \ SAP 系统。显然，配置端点的 BASIS 管理员会知道，但 Microsoft 利用 SAP 的 RFC SDK 来确保互操作性。如果您的组织反对定制 SAP，此架构也提供了一些有趣的机会。您可以将此功能从\
  \ SAP 中抽象出来，并在像 BizTalk 这样更敏捷的环境中实现它。也许您的组织没有 ABAP 技能或资源带宽来编码 RFC，而选择利用 BizTalk\
  \ 技能集。\n\nRFC 被托管在 BizTalk 中更实际、更可能的使用是数据驻留在 SAP 之外，而 SAP 需要以同步方式获取此信息。在这种情况下，SAP\
  \ 将调用 BizTalk 托管的 RFC，而 BizTalk 将检索下游信息并将其返回给 SAP。\n\nBizTalk 托管 RFC 的真实世界示例是一家能源公司，需要通过\
  \ Web 服务从外部系统检索计量读数。该公司没有 SAP 经验或技术栈来支持从 SAP 安全地调用外部 Web 服务。这些外部 Web 服务使用复杂类型，是安全的，并且托管在合作伙伴的数据中心。解决此问题的方案包括\
  \ BizTalk 托管一个 SAP 可以按需调用的 RFC。反过来，BizTalk 将从该外部系统获取所需的计量读数信息，并以 SAP 所期望的格式将结果返回给\
  \ SAP。\n\n## Custom objects\n\n如果我们正在查找自定义对象（例如 RFC），我们将在 \\ RFC\\OTHER 层次结构中找到它们。SAP\
  \ 最佳实践表明，只要您有自定义对象，就用字母 'Z' 为其添加前缀。这是一个很棒的概念，尤其是对于母语不是德语的非 SAP 资源。虽然文档和命名约定正在改进，但仍有大量表、字段和程序使用德语单词或缩写，对英语母语的\
  \ BizTalk 人员来说完全没有意义。通过利用用 \"Z\" 为自定义对象添加前缀的做法，SAP 和 Microsoft 资源都可以轻松识别自定义对象。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_235_0.png)\n\n## Transactions\n\n调用执行创建、更新或删除操作的\
  \ BAPI 时，有必要为以下两个额外操作生成架构：\n\n- **BAPI_TRANSACTION_COMMIT**\n- **BAPI_TRANSACTION_ROLLBACK**\n\
  \n调用其中任一操作是必需的，因为我们可能在操作多组数据，我们希望所有数据都成功或都不成功。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_236_0.png)\n\
  \n为方便起见，我们将同时生成所有这些架构。需要注意的是，BAPI_TRANSACTION_COMMIT 和 BAPI_TRANSACTION_ROLLBACK\
  \ 操作是通用的，可以与其他 BAPI 结合使用。如果您计划在环境中拥有多个 BAPI 集成场景，将这些架构放在公共项目中可能是一个更可持续的解决方案。\n\n\
  ![](img/23d1402649b6528b085cd6b900a2c9c3_236_1.png)\n\n\n\n## 自定义与开箱即用的 RFC/BAPI\n\
  \n在最近的一个项目中，我与 SAP 团队合作，以确定可以利用哪些接口来满足我们的业务需求。不幸的是，这是一项非常耗时的练习。除非项目人员之前使用过开箱即用的\
  \ RFC/BAPI，否则通常需要通过试错来确定某个接口是否合适。很容易通过 Consume Adapter Service Wizard 使用关键字浏览 SAP\
  \ 接口目录，找到合适的接口，却发现它并不完全符合你的场景。例如，我们希望通过 Dynamics CRM 调用 BizTalk 接口在 SAP 中查找客户。我们找到一个名为\
  \ BAPI_CUSTOMER_FIND 的 BAPI，看起来“应该”非常合适。不幸的是，该 BAPI 并未返回我们所需的所有主数据。另一个名为 BAPI_CUSTOMER_GETDETAIL\
  \ 的 BAPI 可以与 FIND BAPI 结合使用来满足我们的需求。这意味着我们必须调用两个 BAPI 才能实现从 SAP 中提取客户信息的目标。\n\n\
  作为架构师，我们需要开始评估选项以确定最佳行动方案。在这种情况下，我们选择编写一个自定义 BAPI 来提供搜索功能并返回 CRM 所需的适当字段。我们觉得可以让\
  \ BizTalk 进行一系列连续调用，但选择了更简洁的“Wrapper”BAPI 方法。“Wrapper”BAPI 这个术语是我们创造的，用来描述将多个系统调用包装在一个\
  \ BAPI 中。在此 BAPI 中，SAP 开发人员负责捕获跨调用发生的错误，并确保事务根据需要提交或回滚。SAP 资源还声称他们可以插入更多调试和跟踪语句，有助于长期支持系统。利用\
  \ Wrapper BAPI 的另一个原因是来自 Dynamics CRM 的调用是同步的。我们不希望 CRM 在 BizTalk 向 SAP 发出多次调用时“卡住”等待\
  \ BizTalk 的响应。\n\n现在我们已经介绍了部分 SAP 术语并讨论了开发人员和架构师在与 SAP 集成时面临的一些决策，让我们进入一些实际场景，在这些场景中我们同时调用\
  \ RFC 和 BAPI。\n\n## 构建 BizTalk 应用程序——RFC 演练\n\n我们将要演练的场景涉及一家能源公司的报价系统。客户将委托能源公司建设基础设施，以便为其工厂/办公室/家庭/农场等供电。报价系统基于\
  \ Dynamics CRM/XRM 平台构建。作为报价系统的一部分，我们在向客户提供报价时需要能够考虑我们的材料成本。SAP 在供应链管理和物料管理方面的优势使其有意义继续在\
  \ SAP 中利用此功能。在我们的场景中，SAP 是所有物料管理的系统记录。由于商品市场的变化，材料成本在一年内会波动，平均移动价格也会随之变化。我们不想对客户报价过高或过低，因此在向客户提供报价之前需要获取材料的移动平均价格。\n\
  \n- 1. 我们将要使用的 RFC 称为 **BAPI_MATERIAL_GET_DETAIL**，它是开箱即用的。等等！我以为我们在本次演练中讨论的是 RFC，为什么它以“BAPI”开头呢？好吧，请记住本章前面我们讨论过，所有\
  \ BAPI 都是 RFC，并且由于架构是从 \\RFC 类别生成的，我将其视为 RFC。\n- 2. 在生成架构时，使用 **文件名前缀** 是一个良好的实践。我个人偏好使用\
  \ BAPI 的名称作为 **文件名前缀**；这样在 Visual Studio 内部就不会产生混淆。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_239_0.png)\n\
  \n- 3. 在 Visual Studio 内部，我们会找到两个生成的架构，名为：BAPI_MATERIAL_GET_DETAILRfc.xsd 和 BAPI_MATERIAL_GET_DETAILTypes.xsd。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_239_1.png)\n\n- 4. 在 **BAPI_MATERIAL_GET_DETAILRfc.xsd**\
  \ 架构内部，我们会发现请求和响应记录都存在。**BAPI_MATERIAL_GET_DETAILTypes.xsd** 架构仅包含底层的 SAP 数据类型。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_240_0.png)\n\n- 5. 接下来，我们想要构建一个我们的 CRM\
  \ 系统可以填充的架构。该架构名为 **MaterialDetailRequest.xsd**，包含三个元素。为简化起见，所有字段的类型均为字符串。\n\n|\
  \ 字段名称 | 用途 |\n|---|---|\n| MaterialID | 用于区分不同材料的标识符。 |\n| Plant | 货物生产或提供的地点。在我们的情况下，我们会将仓库视为\
  \ Plant。 |\n| ValuationArea | 存在两种类型的估值区域：公司和工厂。由于成本可能因来源工厂而异，这可能会影响价格。假设你在偏远地区有一个工厂或仓库。检索特定材料可能需要额外的运输成本。相反，如果你有一个中央仓库，那么你可能希望使用公司级别的成本，使其在材料之间保持一致。在我们的示例中，我们将使用工厂级别，并在此请求消息中提供工厂\
  \ ID 作为值。 |\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_240_1.png)\n\n> 注：最好不要将系统生成的架构暴露给消费客户端。对于\
  \ SAP 来说，生成的架构通常对用户/开发人员不友好，我们不希望将这种复杂性传递给系统集成能力可能不如 BizTalk 或中间件团队的团队。我们也不希望因为\
  \ SAP 架构发生变化而不得不管理客户端接口的破坏。例如，如果我们将旧的 SAP 适配器架构暴露给客户端消费系统，然后决定升级 BizTalk 接口以支持新的\
  \ WCF-SAP 适配器，我们将对客户端应用程序产生大量不必要的更改。\n\n- 6. 我们现在想要创建一个名为 **MaterialDetailRequestDisk_to_MaterialDetailRequestSAP.btm**\
  \ 的映射，将我们的 **MaterialDetailRequest** 转换为我们的 **BAPI_MATERIAL_GET_DETAIL** 请求。\n\n\
  ![](img/23d1402649b6528b085cd6b900a2c9c3_241_0.png)\n\n- 7. 接下来，我们需要构建一个映射，将 **BAPI_MATERIAL_GET_DETAILResponse**\
  \ 转换为可以发送回调用 CRM 系统的 **MaterialDetailResponse**。执行此操作的映射称为 **MaterialDetailResponseSAP_to_MaterialDetailResponseDisk.btm**。正在映射的节点如下：\n\
  \n| BAPI_MATERIAL_GET_DETAIL 响应 | MaterialDetail 响应 |\n|---|---|\n| /MATERIAL_GENERAL_DATA/MATL_DESC\
  \ | MaterialDescription |\n| /MATERIAL_GENERAL_DATA/MATL_TYPE | MaterialType |\n\
  | /MATERIAL_GENERAL_DATA/BASE_UOM | UnitOfMeasure |\n| /MATERIAL_GENERAL_DATA/NET_WEIGHT\
  \ | NetWeight |\n| /MATERIAL_GENERAL_DATA/CREATED_ON | MaterialCreateDate |\n| /MATERIAL_GENERAL_DATA/LAST_CHNGE\
  \ | MaterialLastUpdated |\n| /MATERIALVALUATIONDATA/MOVING_PR | MovingPrice |\n\
  | /MATERIALVALUATIONDATA/PRICE_UNIT | PriceUnit |\n| /MATERIALVALUATIONDATA/CURRENCY\
  \ | Currency |\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_242_0.png)\n\n- 8. 为了协调所有这些事件，需要一个名为\
  \ **ProcessGetMaterialDetails.odx** 的编排。在此编排内部，会发生以下事件：\n  - a. 我们接收一个 Material\
  \ Detail Request 实例。\n  - b. 将 Material Detail Request 转换为 SAP BAPI_MATERIAL_GET_DETAIL\
  \ 请求。\n  - c. 向 SAP 发送 BAPI_MATERIAL_GET_DETAIL 请求并接收 BAPI_MATERIAL_GET_DETAIL 响应。\n\
  \  - d. 将 BAPI_MATERIAL_GET_DETAIL 响应转换为 Material Detail Response。\n  - e. 将 Material\
  \ Detail Response 发送回调用应用程序。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_243_0.png)\n\
  \n\n\n9. 在已放置签名的密钥 **Chapter05-RFCBAPI.snk** 后，我们可以右键单击 Chapter05-RFCBAPI 解决方案并部署我们的应用程序。\n\
  \n10. 进入 BizTalk 管理控制台后，我们会发现一个名为 Chapter05-RFCBAPI 的应用程序。\n\n11. 我们需要创建一个名为 **ReceiveMaterialDetailRequest**\
  \ 的接收端口，其下有一个名为 **ReceiveMaterialDetailRequestFromDisk** 的接收位置。此接收位置将使用 **FILE**\
  \ 适配器、**BizTalkServerApplication** 接收处理程序和 **XMLReceive** 接收管道。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_244_0.png)\n\
  \n12. 此解决方案需要两个发送端口。我们要处理的第一个是名为 **SendMaterialDetailRequestToSAP** 的 SAP 双向发送端口。此发送端口将使用\
  \ **WCF-SAP** 适配器、**BizTalkServerApplication** 发送处理程序、**XMLTransmit** 发送管道和 **XMLReceive**\
  \ 接收管道。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_245_0.png)\n\n> 注：与第 4 章类似，我选择使用\
  \ WCF-SAP 适配器而不是使用 SAP 绑定的 WCF-Custom 适配器。使用 WCF-SAP 适配器其实是一种个人偏好。我喜欢在填充 SAP 连接信息时可用的更简洁的界面，并且它与其他用于连接\
  \ SQL Server 和 Oracle 的 WCF-Custom 端口有所区别。这种方法的一个缺点是，当使用“使用适配器服务向导”生成绑定文件时，需要额外的工作来提取其中包含的值并将其包含在新端口中。\n\
  \n- 13. 单击 **Configure** 按钮以编辑 SAP 特定属性。\n- 14. 再次单击 **Configure** 按钮以编辑 SAP URI。与第\
  \ 4 章中的 IDOC 配置类似，我们希望填充以下值：\n    a. **Application Server Host**\n    b. **System\
  \ Number**\n    c. **Client**\n\n15. 如果您不确定贵组织的这些值，请联系您的 BASIS 管理员。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_246_0.png)\n\
  \n16. 单击确定按钮关闭此对话框。\n\n17. 我们的 SOAP Action 头的 Action 值必须与我们在编排中提供的逻辑操作名称匹配。也就是说，我们需要在发送端口中提供以下\
  \ Action。\n\n```\n<BtsActionMapping xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\
  \ xmlns:xsd=\"http://www.w3.org/2001/XMLSchema\">\n<Operation Name=\"Operation_SendMaterialDetailRequestToSAP\"\
  \ Action=\"http://Microsoft.LobServices.Sap/2007/03/Rfc/BAPI_MATERIAL_GET_DETAIL\"\
  \ />\n</BtsActionMapping>\n```\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_246_1.png)\n\
  \n18. 在“绑定”选项卡中，我想强调两个属性：\n- a. EnableBizTalkCompatibilityMode – 调用 BizTalk 中的 SAP\
  \ 操作时，此值应始终设置为 True。\n- b. EnableSafeTyping – 由于并非所有 .NET 和 SAP 类型都相同，我们有时需要在日期周围放宽一些限制。例如，如果从\
  \ RFC/BAPI 返回可选日期，我们可能会遇到以下错误：为了解决此问题，我们可以将 EnableSafeTyping 属性设置为 True。这样，WCF-SAP\
  \ 适配器将把 SAP DATS 值作为字符串而不是 DateTime 暴露出来。\n\n```\nMicrosoft.ServiceModel.Channels.Common.XmlReaderGenerationException:\
  \ An error occurred when trying to convert the byte array [30-00-30-00-30-00-30-00-30-00-30-00-30-00-30-00]\
  \ of RFCTYPE RFCTYPE_DATE with length 8 and decimals 0 to XML format.\n```\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_247_0.png)\n\
  \n19. 在 **Credentials** 选项卡上，我们需要提供我们的 SAP 凭据。在此场景中，我们使用 **Username/Password** 凭据。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_248_0.png)\n\n20. 我们接下来要处理的发送端口将把物料明细响应发送到磁盘，以便调用应用程序可以消费它。此发送端口的名称为\
  \ **SendMaterialDetailsResponseToDisk**。发送端口将使用 **FILE** 适配器、**BizTalkServerApplication**\
  \ 发送处理程序和 **PassThruTransmit** 发送管道。您可以在源代码的 C:\\LOBIntegration\\Chapter05\\BindingFiles\
  \ 中获取此解决方案的绑定文件，这样您就不必手动键入整个配置。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_248_1.png)\n\
  \n21. 为了启动我们的应用程序，我们必须将编排绑定到我们刚刚创建的物理接收和发送端口。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_249_0.png)\n\
  \n## 测试 BizTalk 应用程序—RFC 演练\n\n1. 我们的应用程序现已构建并部署，我们准备好通过执行以下步骤开始测试：在重启 BizTalkServerApplicationHost\
  \ 实例并启动应用程序后，我们可以处理 MaterialDetailRequest.xsd 的一个实例。名为 MaterialDetailRequest.xml\
  \ 的示例文件已包含在 C:\\LOBIntegration\\Chapter05\\FileDrop 文件夹中。要处理此文件，我们只需复制并粘贴该文件即可。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_249_1.png)\n\n注：此示例文件中提供的值代表用于构建此解决方案的\
  \ SAP 系统中存在的 master 数据。这些值可能在您的 SAP 系统中无效。建议您咨询组织内的 SAP 资源，以便他们为您提供系统中存在的数据。\n\n\
  - 2. BizTalk 应消费此文件，联系 SAP，从 SAP 接收响应，并将结果写回同一文件夹。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_250_0.png)\n\
  \n- 3. 当我们检查 MaterialsOutput[GUID].xml 文件时，我们会发现有关我们感兴趣的物料的信息，包括移动价格。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_250_1.png)\n\
  \n在此示例中，我们在调用客户端和 BizTalk 之间使用了异步消息传递。在此场景中使用异步通信在与 SAP 通信时给了我们一些喘息空间。在这种情况下调用 SAP\
  \ RFC 是一个非常快速的操作（~2 秒），但如果 SAP 出现问题，我们有时间重试调用 SAP。\n\n如果我们与客户端应用程序有同步场景，那么在客户端超时之前我们就没有太多时间重试调用\
  \ SAP。在这些同步情况下，我建议将 SAP 发送端口的重试值设置为 0，然后确保我们向客户端返回响应，表明 SAP 不可用。这提供了一些好处：\n- 我们不会在客户端已经超时并切断与\
  \ BizTalk 的连接时尝试重试连接到 SAP。\n- 如果 SAP 宕机，BizTalk 将能够立即检测到这种情况并向客户端应用程序发送否定确认消息。否则，我们要等到\
  \ BizTalk 耗尽其重试阈值后才会知道。\n- 然后客户端系统可以向客户端提供清晰、用户友好的错误消息，表明存在问题。\n\n## 构建 BizTalk\
  \ 应用程序—BAPI 演练\n\n我们现在将扩展我们的 RFC 场景并更新现有的 Chapter05-RFCBAPI 项目。一旦我们的客户从报价系统收到报价并决定继续由我们公司执行工作，我们希望利用\
  \ SAP 的销售和分销功能。SAP 在销售和财务方面也具有优势，因此我们不想在报价系统中尝试构建该功能，而是希望利用 SAP 在该领域的核心能力。\n\n报价系统将创建销售订单请求，并提供有关客户以及与工作相关的物料的信息。作为回报，SAP\
  \ 将创建可用于计费的销售订单，并将订单号返回给报价系统。\n\n让我们通过生成我们的 SAP 架构开始解决方案：\n- 1. 再次，我们将利用一个开箱即用的接口\
  \ **CREATEFROMDAT2b**，它可以在 **\\BAPI\\Sales and Distribution\\Sales\\Sales Order**\
  \ 类别中找到。如本章架构生成部分所述，我们还需要包含 **COMMIT** 和 **ROLLBACK** 操作，因为我们将在 SAP 中创建数据。出于方便的目的，我们将同时生成所有架构。\n\
  - 2. 再次，我们不想向报价系统公开我们的 SAP 请求，因此我们将公开一个更用户友好的架构，称为 **CreateSalesOrderRequest.xsd**。在此架构内部，我们将找到以下元素。所有元素都是字符串，**isCommitted**\
  \ 除外，它是一个布尔值。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_252_0.png)\n\n| 字段名称 |\
  \ 用途 |\n|---|---|\n| /Header/DocumentType | 也称为订单类型。典型值是 OR（英文值）或 TA（德文值）。 |\n|\
  \ /Header/SalesOrganization | 物流内的组织单位，根据其销售需求对公司进行结构化。 |\n| /Header/DistributionChannel\
  \ | 分销渠道决定了物料或服务如何销售以及如何分销给客户，例如零售、批发、自提。 |\n| /Header/Division | 部门是 R/3 系统中物流中的组织单位。\
  \ |\n| /Header/SalesOffice | 负责此交易的销售办公室或销售区域。 |\n\n\n\n\n\n| 字段名称 | 用途 |\n|---|---|\n\
  | /Header/RequestedDate | 产品或服务所需的日期。 |\n| /Header/PurchaseNo | 描述采购编号的文本。 |\n|\
  \ /Header/Currency | 交易发生的货币。 |\n| /Material/MaterialID | 我们希望包含在采购订单中的物料项目的 ID。\
  \ |\n| /Material/TargetQU/ | 目标计量单位。 |\n| /Partner/PartnerRole | 业务伙伴角色用于按业务术语对业务伙伴进行分类。您分配给业务伙伴的角色反映了其拥有的功能以及其可能涉及的业务交易。\
  \ |\n| /Partner/Number | 用于识别客户的编号。 |\n| isCommitted | 该字段用于演示目的。它将触发是否要提交订单或回滚订单。为了便于确定该值是否为真或假，该字段已被标记为区分字段。\
  \ |\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_253_0.png)\n\n3. 下一步是创建一个映射，将我们的报价系统中的\
  \ CreateSalesOrderRequest 转换为我们的 SALESORDER_CREATEFROMDAT2 SAP BAPI 调用。此映射的名称为 CreateSalesOrderRequest_to_SALESORDER_CREATEFROMDAT2.btm。以下图像包含详细的映射说明。请注意，Material\
  \ 节点是递归节点，因此添加了循环 functoid 以确保在目标消息中创建正确数量的 BAPISDITM 节点。\n\n4. 我们还希望确保 **BAPIRET2**\
  \ 节点被实例化，以便 SAP 可以返回任何错误。**BAPIRET2** 是一个常用表，用于返回刚刚执行的 BAPI 的状态。即使您调用的是自定义 BAPI，返回此节点也是一个良好的实践。为了在我们的请求消息中提供此节点，我们只需从根节点拖动一个链接到\
  \ **BAPIRET2** 节点。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_254_0.png)\n\n5.\
  \ 一旦我们向 SAP 发送了 SALESORDER_CREATEFROMDAT2 请求并收到响应，我们就需要向我们的报价系统提供响应消息。已创建名为 **CreateSalesOrderResponse.xsd**\
  \ 的架构来处理此职责。在此架构中，我们将找到三个元素。**CustomerNumber** 和 **SalesOrderNumber** 为字符串，而 **isCommitted**\
  \ 为布尔值。\n\n| 字段名称 | 用途 |\n|---|---|\n| CustomerNumber | 由于我们将在报价系统和 BizTalk 之间使用异步消息传递，我们希望提供销售订单所属的客户编号。\
  \ |\n| SalesOrderNumber | 这是 SAP 在销售订单成功创建时提供的标识符。 |\n| isCommitted | 该字段也用于演示目的，并将向报价系统提供交易是已提交还是已回滚的指示。我们还将把该字段标记为区分字段，以便我们可以在\
  \ ProcessCreateSalesOrder.odx 编排中方便地更新此标志。 |\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_255_0.png)\n\
  \n6. 负责将 SAP 响应转换为报价系统响应的映射称为 **SALESORDER_CREATEFROMDAT2Response_to_CreateSalesOrderResponse.btm**。\n\
  \n7. 由于 **isCommitted** 字段未从 SAP 返回，我们将从 String Concatenate functoid 设置初始值为 true，并随后在我们的\
  \ `ProcessCreateSalesOrder.odx` 编排中的 Message Assignment 形状内更新此标志。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_255_1.png)\n\
  \n8. 在本章的 Schema Generation 部分，我们讨论了通过 BAPI 创建、更新和删除数据时需要提交或回滚事务。为了满足提交事务的要求，我们需要创建一个映射来实例化\
  \ BAPI_TRANSACTION_COMMIT 消息的实例。此映射的源消息可以是任何内容，因为我们在 Commit 消息中不使用任何消息正文负载数据。考虑到这一点，CreateSalesOrderRequest\
  \ 消息应该可以工作。名为 CreateSalesOrder_to_BAPI_TRANSACTION_COMMIT.btm 的映射已包含在本章的源代码中，以满足我们的需求。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_256_0.png)\n\n9. 同样，我们需要创建一个处理回滚场景的映射。名为\
  \ CreateSalesOrderRequest_to_BAPI_TRANSACTION_ROLLBACK.btm 的映射已为此目的创建，其逻辑与 Commit\
  \ 映射相同。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_256_1.png)\n\n10. 我们现在可以将在名为\
  \ ProcessCreateSalesOrder.odx 的编排中组装所有这些构件。由于此编排比 SAP 章节中的其他编排更大，我们将将其分解为几个部分。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_257_0.png)\n\n11. 我们的初始步骤将涉及以下操作：\n-\
  \ a. 接收我们的 CreateSalesOrderRequest 消息的一个实例。\n- b. 将我们的 CreateSalesOrderRequest 消息转换为我们的\
  \ SALESORDER_CREATEFROMDAT2 SAP 请求消息。\n- c. 更新消息上下文以将 ConnectionState 设置为 \"OPEN\"\
  。通过将其设置为 OPEN，我们指示适配器为事务打开一个新通道。为了设置此消息上下文，我们需要为 Microsoft.Adapters.SAP.BiztalkPropertySchema.dll\
  \ 添加程序集引用。您可以在以下位置找到此 dll：\n- i. 32 位: C:\\Program Files (x86)\\Microsoft BizTalk\
  \ Adapter Pack\\bin\n- ii 64 位: C:\\Program Files\\Microsoft BizTalk Adapter Pack\
  \ (x64)\\bin\\\n![](img/23d1402649b6528b085cd6b900a2c9c3_258_0.png)\n- e. 向 SAP\
  \ 发送 SALESORDER_CREATEFROMDAT2Request。\n- f. 从 SAP 接收 SALESORDER_CREATEFROMDAT2Response。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_259_0.png)\n\n12. 我们现在想要执行检查以确定是否应在 SAP\
  \ 中提交事务。为此，我们将向编排添加一个 Decide 形状，然后检查我们的请求消息的 isCommitted 标志是否设置为 true：\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_259_1.png)\n\
  - a. 如果 msgCreateSalesOrderRequest.isCommitted 设置为 true，则我们将继续调用一个转换，将我们的 CreateSalesOrderRequest\
  \ 消息转换为我们的 BAPI_TRANSACTION_COMMIT 消息的一个实例。\n- b. 一旦此消息被转换，我们需要在 Message Assignment\
  \ 形状中更新其消息上下文属性。在此形状中，我们希望将 **ConnectionState** 属性设置为 \"**CLOSE**\"。通过将此属性设置为 **CLOSE**，我们指示适配器提交事务并关闭通道。\n\
  ![](img/23d1402649b6528b085cd6b900a2c9c3_260_0.png)\n- c. 我们现在希望向 SAP 发送我们的 **BAPI_TRANSACTION_COMMIT**\
  \ 消息。\n- d. 一旦事务已提交，SAP 将向我们发送响应消息，确认事务已完成。\n![](img/23d1402649b6528b085cd6b900a2c9c3_260_1.png)\n\
  \n13. 如果 `msgCreateSalesOrderRequest.isCommitted` 设置为 false，我们希望回滚事务而不是提交事务。\n-\
  \ a. 为了回滚事务，我们需要通过转换我们的 CreateSalesOrderRequest 消息来创建一个 **BAPI_TRANSACTION_ROLLBACK**\
  \ 消息的实例。\n- b. 一旦此消息被转换，我们需要在 Message Assignment 形状中更新其消息上下文属性。在此形状中，我们希望将 **ConnectionState**\
  \ 属性设置为 \"ABORT\"。通过将此属性设置为 **ABORT**，我们指示适配器中止事务并关闭通道。\n![](img/23d1402649b6528b085cd6b900a2c9c3_261_0.png)\n\
  - c. 我们现在希望向 SAP 发送我们的 **BAPI_TRANSACTION_ROLLBACK** 消息。\n- d. 一旦事务已被中止，SAP 将向我们发送响应消息，确认事务已被取消。\n\
  ![](img/23d1402649b6528b085cd6b900a2c9c3_262_0.png)\n\n14. 剩余步骤包括将我们的 SALESORDER_CREATEFROMDAT2Response\
  \ 转换为我们将发送给报价系统的 CreateSalesOrderResponse。\n- a. 为了演示目的，我们在 CreateSalesOrderResponse\
  \ 消息上添加了一个标志，以指示是否设置了 Commit 标志。在 Message Assignment 形状中，我们只需分配在 CreateSalesOrderRequest\
  \ 消息中填充的值。\n![](img/23d1402649b6528b085cd6b900a2c9c3_262_1.png)\n\n\n\n\nb. 向报价系统发送\
  \ CreateSalesOrderResponse 消息。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_263_0.png)\n\
  \n15. 由于我们已更新 Chapter05-RFCBAPI 解决方案，因此无需重新添加强名称密钥；我们可以右键单击 Visual Studio 解决方案文件并部署我们的应用程序。\n\
  \n16. 在 Chapter05-RFCBAPI 应用程序内部，我们需要添加一个接收端口 ReceiveCreateSalesOrderRequests 来接收来自报价系统的消息。我们现在需要为此接收端口创建一个名为\
  \ ReceiveCreateSalesOrderRequestsFromQuotingSystem 的接收位置，它将使用 FILE 适配器、BizTalkServerApplication\
  \ 接收处理程序和 XMLReceive 接收管道。由于我们与之前的示例共享一个热文件夹，因此需要提供文件掩码 CreateSales*Copy*.xml。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_264_0.png)\n\n17. 我们现在需要创建发送端口。我们将创建的第一个发送端口将用于与\
  \ SAP 通信。我们将创建的发送端口名为 SendCreateSalesOrdersToSAP，负责发送 BAPI_SALESORDER_CREATEFROMDAT2、BAPI_TRANSACTION_COMMIT\
  \ 和 BAPI_TRANSACTION_ROLLBACK 消息。\n\n18. 此发送端口将使用 WCF-SAP 适配器、BizTalkServerApplication\
  \ 发送处理程序、XMLTransmit 发送管道和 XMLReceive 接收管道。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_265_0.png)\n\
  \n- 19. 单击 **配置** 按钮以编辑 SAP 特定属性。\n- 20. 再次单击 **配置** 按钮以编辑 SAP URI。就像我们在第 4 章中的\
  \ IDOC 配置一样，我们希望填充以下值：\n    - a. **应用程序服务器主机**\n    - b. **系统编号**\n    - c. **客户端**\n\
  \n21. 如果您不确定贵组织的这些值，请联系您的 BASIS 管理员。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_266_0.png)\n\
  \n22. 单击 OK 按钮关闭此对话框。\n\n23. 我们现在需要使用在编排中创建的操作名称更新 SOAP Action 头。由于此发送端口负责发送创建销售订单、提交和回滚消息，因此我们需要在此文本框中提供三个条目：\n\
  \n```\n<BtsActionMapping xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\
  \ xmlns:xsd=\"http://www.w3.org/2001/XMLSchema\">\n<Operation Name=\"Operation_SendCreateSalesOrderCommit\"\
  \ Action=\"http://Microsoft.LobServices.Sap/2007/03/Bapi/BUS2032/BAPI_TRANSACTION_COMMIT/BAPI_TRANSACTION_COMMIT\"\
  \ />\n<Operation Name=\"Operation_SendCreateSalesOrderRollback\" Action=\"http://Microsoft.LobServices.Sap/2007/03/Bapi/BUS2032/BAPI_TRANSACTION_ROLLBACK/BAPI_TRANSACTION_ROLLBACK\"\
  \ />\n<Operation Name=\"Operation_SendSalesOrderRequestsToSAP\" Action=\"http://Microsoft.LobServices.Sap/2007/03/Bapi/BUS2032/CREATEFROMDAT2/BAPI_SALESORDER_CREATEFROMDAT2\"\
  \ />\n</BtsActionMapping>\n```\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_267_0.png)\n\
  \n24. 在 **绑定** 选项卡上，我们希望确保 **EnableBizTalkCompatibilityMode** 和 **EnableSafeTyping**\
  \ 设置为 **True**。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_267_1.png)\n\n25. 在\
  \ **凭据** 选项卡上，我们需要提供 SAP 凭据。在此场景中，我们使用 **用户名/密码** 凭据。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_268_0.png)\n\
  \n26. 我们需要创建的最后一个发送端口将负责将销售订单状态发送回报价系统。发送端口名为 **SendCreateSalesOrderResponsesToQuotingSystem**，使用\
  \ **FILE** 适配器、**BizTalkServerApplication** 发送处理程序和 **PassThruTransmit** 发送管道。您可以在源代码的\
  \ C:\\LOBIntegration\\Chapter05\\BindingFiles 中获取此解决方案的绑定文件，这样就无需手动输入所有这些配置。\n\n\
  27. 最后，我们需要将 **ProcessCreateSalesOrder** 编排绑定到我们刚刚创建的物理接收和发送端口。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_269_0.png)\n\
  \n28. 我们现在可以重启 BizTalkServerApplication 主机实例并启动我们的应用程序。\n\n## 测试 BizTalk 应用程序—BAPI\
  \ 演练\n\n应用程序构建并部署后，我们现在可以通过执行以下步骤来测试应用程序：\n\n- 1. 从 C:\\LOBIntegration\\Chapter05\\\
  FileDrop 文件夹复制名为 CreateSalesOrderRequest_Commit.xml 的示例文件并粘贴到同一文件夹中。此文件包含 isCommitted\
  \ 标志设置为 true，因此 BizTalk 将尝试提交此事务。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_269_1.png)\n\
  \n2. BizTalk 将接收此文件，然后在 SAP 中创建销售订单，提交事务，然后向我们的报价系统发送名为 **SalesOrderResponse{GUID}.xml**\
  \ 的响应。此文档将包含刚刚在 SAP 中创建的 **SalesOrderNumber**。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_270_0.png)\n\
  \n3. 要执行回滚场景，我们可以复制并粘贴位于 C:\\LOBintegration\\Chapter05\\FileDrop 文件夹中的 CreateSalesOrderRequest_Rollback.xml。与\
  \ CreateSalesOrderRequest_Commit.xml 的区别在于 **isCommitted** 标志设置为 **false**。\n\n\
  ![](img/23d1402649b6528b085cd6b900a2c9c3_270_1.png)\n\n4. 当此文件通过 BizTalk 处理时，将创建销售订单并返回销售订单号。不同之处在于此事务是回滚而不是提交。此外，在我们发送给报价系统的响应消息中，**isCommitted**\
  \ 标志设置为 **false**。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_271_0.png)\n\n以下是操作销售订单时一些有用的\
  \ SAP GUI 事务的表格：\n\n| SAP 事务 | 目的 |\n|---|---|\n| VA01 | 创建销售订单 |\n| VA02 | 修改/更改销售订单\
  \ |\n| VA03 | 显示销售订单 |\n\n## 提示、陷阱和故障排除\n\n使用 RFC 和 BAPI 为 BizTalk 开发人员提供了工具箱中的另一个工具。以下是我在集成\
  \ RFC 和 BAPI 时遇到的提示、问题和行为列表：\n\n- 1. RFC 和 BAPI 可以处理大量数据。虽然我不了解具体的上限，但我曾意外调用过返回超过\
  \ 100 MB 数据的 RFC。这并不意味着调用返回 100 MB 的 RFC 是个好主意，但这意味着这是可能的。\n- 2. 请务必与您的 SAP 对应人员确认，在提供特定对象的\
  \ ID 时是否需要提供前导零。在我们的物料演练中，我们需要提供前导零才能成功调用操作。\n- 3. 调用 RFC 或 BAPI 时，如果 SAP 的响应中缺少特定段或重复节点，则可能是由于请求文档中缺少该节点所致。我们之前示例中\
  \ BAPIRET2 节点就是这种行为的完美示例。与前导零类似，这种行为在我看来似乎并不完全一致。\n- 4. 使用 RFC 跟踪工具也可以在问题发生时提供可见性。RFC\
  \ 跟踪工具非常细粒度，可以为您提供正在发送的报文负载的详细信息。要了解有关此跟踪工具的更多信息，请阅读以下链接中的故障排除部分：http://msdn.microsoft.com/en-us/biztalk/ee705492。\n\
  \n- 5. 在花费大量时间尝试调试 BizTalk 解决方案之前，从 SAP 资源获取“示例”数据总是有益的。一旦拥有有效数据，您将花费更少的时间进行故障排除，而将更多时间用于开发/测试解决方案。RFC/BAPI\
  \ 可能因多种原因而失败，而 SAP 资源比 BizTalk 资源更能确定发生了什么。\n- 6. 执行 BAPI 事务时，必须使用单个主机实例执行。如果此情况适用并且您需要高可用性，那么您应该查看集群主机实例。这将允许您一次运行单个主机实例，但在系统故障的情况下，您将拥有一个被动节点，该节点可以成为活动节点并自动继续处理。\n\
  - 7. 当 BAPI 创建或更新记录时，在更改提交之前，其他 BAPI 实例无法读取这些更改。\n- 8. 执行 BAPI 事务时，您需要使用相同的连接操作这些对象。请参阅\
  \ http://msdn.microsoft.com/en-us/library/cc185482(v=BTS.10).aspx 以了解所有连接状态的细分。\n\
  \n## 摘要\n\n在本章中，我们继续学习 SAP 以及 BAPI/RFC 同步处理。我们学习了提交和回滚事务，以及 BizTalk 开发人员在与 SAP 通信时面临的一些提示、技巧和陷阱。\n\
  \n从过去两章中，您可以看到与 SAP 集成是一个庞大的主题，因为 SAP 是一个非常丰富的平台。然而，与 SAP 集成对 BizTalk Server 来说是一个很大的增值，因为托管在\
  \ SAP 中的业务流程通常代表关键任务服务。\n\n在下一章中，我们将转换方向，学习 BizTalk 如何通过利用 Microsoft 的 AppFabric\
  \ Service Bus 集成云和本地服务。\n\n\n\n\n## 6 使用 Windows Azure AppFabric Service Bus 进行\
  \ BizTalk 集成\n\n在当今的商业环境中，组织需要能够快速、安全地与不断变化的业务合作伙伴集成的能力。成功地将本地服务暴露给其他部门或整个组织可能需要付出赫拉克勒斯式的网络和安全努力。如何安全地暴露深埋在防火墙和网络路由器后面的服务？当合作伙伴增加或情况发生变化时，我们可以采取哪些措施来避免脆弱的安全模型崩溃？今天构建这种类型的分布式应用程序是可能的，但它需要对基础设施进行大量投资，并且需要各方做出多项让步。\n\
  \n本章将涵盖：\n- 包含在名为 Windows Azure AppFabric 的 Microsoft 云计算集成平台中的内容\n- AppFabric Access\
  \ Control 服务和 AppFabric Service Bus 旨在解决的问题\n- 如何利用本地部署的 BizTalk Server 安全地消费 Windows\
  \ Azure AppFabric 消息并发布到 Windows Azure AppFabric 云环境\n\n## 什么是 Windows Azure AppFabric？\n\
  \nWindows Azure AppFabric 是 Microsoft Windows Azure 云服务的一部分，后者是一组由 Microsoft 主持的用于构建解决方案的功能。AppFabric\
  \ 是一种“平台即服务”（PaaS）解决方案，作为云中的中间件运行。此中间件包括安全云消息传递（Service Bus）、跨联合身份存储的统一访问控制（Access\
  \ Control）、分布式应用程序缓存（Caching）以及类似 BizTalk 的集成服务（Integration）。预计 Caching 和 Integration\
  \ 服务将在 2011 年下半年发布。就本章而言，重点将放在 Service Bus 和 Access Control 服务上。\n\n## AppFabric\
  \ Access Control\n\nAppFabric Access Control 服务使用“声明转换”来为连接的应用程序创建联合安全策略。在下面的各节中，我们将探讨在尝试统一身份模型时面临的问题，以及\
  \ AppFabric Access Control 服务如何提供帮助。\n\n### 问题场景\n\n“你是谁，你能做什么？”这是应用程序安全的根本问题。我们的许多应用程序选择通过本地存储的凭据和角色来回答这个问题，但这会导致杂乱、难以管理的[content]\n\
