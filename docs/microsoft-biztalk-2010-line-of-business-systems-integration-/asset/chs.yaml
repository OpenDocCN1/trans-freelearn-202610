  ## 6 使用 Windows Azure AppFabric Service Bus 进行 BizTalk 集成\n\n在当今的商业环境中，组织需要能够快速、安全地与不断变化的业务合作伙伴集成的能力。成功地将本地服务暴露给其他部门或整个组织可能需要付出赫拉克勒斯式的网络和安全努力。如何安全地暴露深埋在防火墙和网络路由器后面的服务？当合作伙伴增加或情况发生变化时，我们可以采取哪些措施来避免脆弱的安全模型崩溃？今天构建这种类型的分布式应用程序是可能的，但它需要对基础设施进行大量投资，并且需要各方做出多项让步。\n\
  \n本章将涵盖：\n- 包含在名为 Windows Azure AppFabric 的 Microsoft 云计算集成平台中的内容\n- AppFabric Access\
  \ Control 服务和 AppFabric Service Bus 旨在解决的问题\n- 如何利用本地部署的 BizTalk Server 安全地消费 Windows\
  \ Azure AppFabric 消息并发布到 Windows Azure AppFabric 云环境\n\n## 什么是 Windows Azure AppFabric？\n\
  \nWindows Azure AppFabric 是 Microsoft Windows Azure 云服务的一部分，后者是一组由 Microsoft 主持的用于构建解决方案的功能。AppFabric\
  \ 是一种“平台即服务”（PaaS）解决方案，作为云中的中间件运行。此中间件包括安全云消息传递（Service Bus）、跨联合身份存储的统一访问控制（Access\
  \ Control）、分布式应用程序缓存（Caching）以及类似 BizTalk 的集成服务（Integration）。预计 Caching 和 Integration\
  \ 服务将在 2011 年下半年发布。就本章而言，重点将放在 Service Bus 和 Access Control 服务上。\n\n## AppFabric\
  \ Access Control\n\nAppFabric Access Control 服务使用“声明转换”来为连接的应用程序创建联合安全策略。在下面的各节中，我们将探讨在尝试统一身份模型时面临的问题，以及\
  \ AppFabric Access Control 服务如何提供帮助。\n\n### 问题场景\n\n“你是谁，你能做什么？”这是应用程序安全的根本问题。我们的许多应用程序选择通过本地存储的凭据和角色来回答这个问题，但这会导致安全环境混乱且难以管理。\n\
  \n虽然许多组织在内部身份提供程序上标准化，例如 Microsoft 的 Active Directory，但在组织需要与大量外部方交互时，尝试维护单一身份提供程序可能会很具挑战性。一个解决方案是将外部账户显式添加到内部\
  \ Active Directory 中，但这需要大量维护，并且可能赋予外部用户比预期更多的内部应用程序访问权限。我们需要一种方式让每个组织使用自己的身份提供程序，同时能够以干净的方式将这些身份和凭据转换成本系统能够理解的形式。理想情况下，我们的系统应摆脱管理凭据和权限的业务，并能够信任统一的第三方。\n\
  \n### 解决方案\n\nAppFabric Access Control（AC）服务提供了一个基于云的引擎，用于从一个受信任的身份提供程序向另一个受信任的身份提供程序转换声明。AC\
  \ 服务与指定的颁发者建立信任关系，无论是企业目录，如合作伙伴的 Active Directory，还是网络身份提供程序，如 Google、Facebook 或\
  \ Windows Live ID。\n\n这些提供程序向 AC 服务发送一组“声明”。**声明**是关于用户身份的一组信息。安全令牌可能包含有关您的姓名、电子邮件地址、职位和入职日期的声明。如果\
  \ AC 服务信任提供这些声明的颁发者，那么这些值就可以被这些声明的消费者视为可信。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_275_0.png)\n\
  \n例如，我的应用程序可能要求用户经过身份验证，并且还要求特定用户角色（例如“Manager”）来执行操作。此应用程序可以构建为接受声明作为其身份输入。可以想象，构建应用程序以接受来自每个颁发者的这些颁发者特定声明将是一团糟，维护起来也是噩梦。然而，这正是声明转换的强大之处所在。我的应用程序需要特定的声明，AC\
  \ 服务从所有单个颁发者执行转换到我的单一输出声明类型。通过这种方式，我们的应用程序代码完全与特定身份提供程序解耦，而可以授权大量各方，通过将他们的声明转换到预期的单一格式。AppFabric\
  \ AC 充当“声明代理”，因为它从多个来源接收声明并将其转换到我们需要的输出格式。\n\n这是一个强大的概念，并且将在接下来的页面中得到充分演示。\n\n##\
  \ Service Bus\n\nAppFabric Service Bus 允许我们在不不必要地打开网络端口或更改任何基础设施考虑的情况下，以安全的方式将 Web\
  \ 服务暴露给云。\n\n### 问题场景\n\n连接两个分布式方绝非易事。我们多年来一直通过使用电子数据交换（EDI）和增值网络（VAN）、公司对公司 VPN、FTP\
  \ 以及一系列其他机制来解决这个问题。在每种情况下，通信都需要专门的软件或对每个组织的基础设施格局进行重大更改。为了实现这一点，必须打开防火墙端口，用户账户会在目标组织的目录中创建，证书可能会交换，等等。此外，当组织为合作伙伴打开\
  \ VPN 时，他们可能会无意中启用合作伙伴不应该看到的整个应用程序集的访问。\n\n### 解决方案\n\nAppFabric Service Bus 引入了一种新颖的方式，可以选择性地并安全地将本地部署的\
  \ WCF 端点暴露给云。\n\n让我们来看一下 Service Bus 的两个主要组件。首先，我们有一个全局寻址服务，允许我们拥有一个命名空间（例如“Contoso”）并在其下定义\
  \ URI。此全局命名空间可以前端一个地理分布并托管在不同环境和容器中的分布式服务集。云命名空间中构建的 URI 充当其后面内部服务的中央参考点。\n\nService\
  \ Bus 的第二个，也是主要组件是 Relay Service，它包括一组 WCF 绑定，使任何 WCF 服务都能在云命名空间地址上监听。即使是非 WCF 服务（例如\
  \ ASMX 服务、非 .NET 客户端）也能够通过 Relay Service 接收消息。服务客户端调用云端点，请求被中继到内部托管的服务。\n\nService\
  \ Bus 利用一些熟悉的基础绑定，同时也引入了一些新绑定。例如，许多标准 WCF 绑定（**BasicHttpBinding**、**WebHttpBinding**、**Ws2007HttpBinding**、**NetTcpBinding**）都有等效的\
  \ Relay 绑定（**BasicHttpRelayBinding**、**WebHttpRelayBinding**、**Ws2007HttpRelayBinding**、**NetTcpRelayBinding**）。除了这些\
  \ Relay 绑定之外，还有两个额外的绑定是 Service Bus 独有的。**NetOneWayRelayBinding** 通过 TCP 从云到客户端执行单向通信。**NetEventRelayBinding**\
  \ 是一种广播绑定，也是单向的，但允许多个服务在云端点上监听。如果您希望将客户端服务请求发送到多个服务，您可能会使用此绑定。\n\n## 将 Service Bus\
  \ 消息发布到 BizTalk Server\n\nBizTalk Server 2010 是 Azure Service Bus 消息的直接接收者。在可预见的未来，组织将继续维护大量的本地部署软件投资，同时希望云扩展其应用程序组合。架构师将特别注意本地部署软件与云平台之间的集成。通过\
  \ Azure Service Bus 扩展 BizTalk Server 开辟了大量可能性，并在利用云的可扩展性和可访问性的同时利用先前的软件投资。\n\n\
  ### 场景描述\n\n本章的其余部分将通过一个完整的解决方案场景，演示如何通过 Service Bus 将消息发送到 BizTalk Server，并从 BizTalk\
  \ Server 返回到 Service Bus。\n\n在此场景中，我们代表虚构公司 **WatsonBSafe**。该公司为订阅其服务的组织管理建筑访问安全。他们拥有扫描员工徽章并允许进入公司办公楼内建筑物和房间的技术。WatsonBSafe\
  \ 有许多客户，每个客户都会向他们发布员工注册表以及授予客户员工访问权限的明确请求。\n\n\n\n**Riley Semiconductor** 是 WatsonBSafe\
  \ 的客户之一。这些组织之间的关系已有多年历史，并且已设置了 VPN，以便 Riley Semiconductor 可以与 WatsonBSafe 的用户访问配置系统进行交互。WatsonBSafe\
  \ 也会回连到 Riley Semiconductor 以发现访问特定建筑所需的培训课程。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_278_0.png)\n\
  \nWatsonBSafe 希望摆脱这种模式，但将分阶段进行。首先，他们希望消除为 Riley Semiconductor 用户配置账户的需求，转而依赖于 Riley\
  \ 建筑访问配置系统提供的声明。因此，本解决方案首先演示如何将基于声明的授权应用于本地 BizTalk 端点。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_278_1.png)\n\
  \n实现此目标后，我们将把端点迁移到云中，消除 VPN，并建立完全安全的云交换。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_279_0.png)\n\
  \n代码中附带了本章的入门解决方案。在 Chapter 6 文件夹中，您可以找到一个名为 Chapter6.BuildingAccessManagement.sln\
  \ 的 Visual Studio 2010 解决方案。在构建以下组件之前，请先打开此解决方案。\n\n## Building the BizTalk solution\
  \ components\n\n我们首先需要创建一个消息架构，然后配置 BizTalk 和服务端点。\n\n## Defining message schemas\n\
  \n我们首先要构建描述访问请求的架构定义，然后创建一个接受该类型消息的 Web 服务。\n\n- 1. 打开 Chapter6.BuildingAccessManagement.sln\
  \ 解决方案并创建一个名为 Chapter6.BuildingAccessManagement.BizTalk 的新 BizTalk 项目。\n- 2. 使用强名称密钥配置项目，并将其设置为部署到名为\
  \ Chapter 6 的 BizTalk 应用程序。\n- 3. 在 BizTalk 项目中添加一个名为 AccessRequestEvent_XML.xsd\
  \ 的新架构。\n\n4. 使用下面列出的字段构造架构，并将每个数据类型设置为“string”。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_280_0.png)\n\
  \n5. 接下来，定义一个提升字段，以便以后可以根据 CompanyId 字段进行路由。向项目添加一个名为 BuildingAccess_Prop.xsd 的提升属性架构。\n\
  \n6. 在属性架构中添加一个名为 CompanyID 的字段。\n\n7. 将 AccessRequestEvent_XML.xsd 中的 CompanyId\
  \ 字段映射到属性架构中的 CompanyID 字段。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_280_1.png)\n\
  \n8. 构建并部署 BizTalk 应用程序。\n\n## Exposing a service endpoint\n\n接下来，我们使用架构来公开本地服务端点。此架构用于构建两个不同的服务，以公开“请求访问”和“撤销访问”操作。为什么我们有两个服务而不是一个具有两个操作的服务？我们希望能够为这些操作添加细粒度的授权控制，如果只有一个接收位置，则很难做到这一点，而\
  \ BizTalk WCF 服务发布向导正为每个单独的服务解决方案生成一个接收位置。\n\n- 1. 在 Visual Studio 2010 中，转到“工具”菜单并启动\
  \ BizTalk WCF 服务发布向导以构建我们需要的第一个服务端点。\n- 2. 选择 WCF-CustomIsolated 适配器，并在以下应用程序选项中选择启用本地元数据交换并创建\
  \ BizTalk 接收位置。\n- 3. 接下来，选择将架构作为 Web 服务发布。此选项让我们手动构建服务定义，而不是使用编排来生成服务的名称、操作名称和消息类型。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_281_0.png)\n\n- 4. 在下一个向导窗格中跳过构建 Service\
  \ Bus 端点的选项。在此阶段，根据我们的第一个用例，我们仅将服务公开给本地消费者。在未来的步骤中，当我们模拟两家公司之间 VPN 的消除时，我们将“云启用”我们的端点。\n\
  - 5. 现在，我们有选项可以手动塑造 RequestAccessService 的服务定义。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_282_0.png)\n\
  \n- 6. 定义服务后，将目标命名空间设置为 http://Chapter6/BuildingAccessManagement。\n- 7. 将服务部署到此地址：http://localhost/RequestAccessService。\n\
  - 8. 完成向导并通过确认新服务存在于 IIS 中并且与在具有发布到 BizTalk MessageBox 数据库权限的帐户下运行的应用程序池相关联来验证成功部署。\n\
  \n- 9. 如果我们深入研究向导生成的服务，会看到一些有趣的事情。首先，当您打开 svc 文件时，会看到使用了 `CustomWebServiceHostFactory`\
  \ 而不是标准的 WCF `ServiceHost`。这导致了第二个有趣的点。查看 web.config 文件，注意到 `system.serviceModel`\
  \ 部分非常稀疏。没有为 Web 服务定义特定的端点。这是因为前面提到的 `CustomWebServiceHostFactory` 会提取接收位置配置详细信息来配置服务。您将在\
  \ web.config 文件的 `system.ServiceModel` 中找到的端点是我们元数据交换 (MEX) 端点的定义。\n- 10. 切换到 BizTalk\
  \ Server 管理控制台并打开 **Chapter 6** 应用程序。\n- 11. 找到向导生成的接收位置，打开它，并将绑定设置为 **BasicHttpBinding**。\n\
  - 12. 启动接收位置并浏览到服务地址，注意到可工作的元数据链接。\n- 13. “请求访问”服务完成后，我们再次通过 BizTalk WCF 服务发布向导构建一个“撤销访问”服务。\n\
  - 14. 选择与上次向导遍历相同的适配器 (**WCF-CustomIsolated**)，并再次选择从架构构建服务。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_283_0.png)\n\
  \n- 15. 将服务的目标命名空间设置为 http://Chapter6/BuildingAccessManagement\n- 16. 将此服务的部署地址设置为\
  \ http://localhost/RevokeAccessService\n- 17. 完成向导并通过在 IIS 中找到服务、设置有效的应用程序池以及将生成的接收位置上的绑定设置为\
  \ **BasicHttpBinding** 来确认成功。\n- 18. 在定义了入站服务通道后，我们现在需要一个订阅已发布内容的发送端口。定义一个新的单向静态发送端口，将我们的消息发送到磁盘。此发送端口的订阅基于消息类型属性。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_284_0.png)\n\n我们现在拥有解决方案第一部分的基础组件。接下来，我们将定义\
  \ Azure AppFabric Access Control (AC) 服务设置，以为内部服务端点叠加细粒度的授权。\n\n## Building the\
  \ Access Control Service Components\n\nAC 服务可以接收一方提供的声明并将其转换为另一方所需的声明。对于解决方案的这一部分，我们定义一组\
  \ AC 规则来管理向 BizTalk 服务端点发送消息的权限。\n\n- 1. 首先，我们需要管理 AC 安全令牌服务 (STS) 的凭据，该服务负责签发有效令牌。访问\
  \ http://windows.azure.com 并记录先前创建的服务命名空间的 **Management Key Name** 和 **Current Management\
  \ Key**。这些值需要访问和管理我们的 STS。\n2. 下载并打开 Azure 平台 AppFabric SDK（版本 1.0 可在 http://bit.ly/9kEVfh\
  \ 获取）并导航到访问控制示例中的 AcmBrowser 应用程序（`AccessControl\\ExploringFeatures\\Management\\\
  AcmBrowser`）。编译并运行 AcmBrowser 应用程序。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_285_0.png)\n\
  \n3. 在 AcmBrowser 中，将有效的 AC 凭据输入到 **Service Namespace** 和 **Management Key** 中，然后单击\
  \ **Load from Cloud** 按钮以确认连接。\n4. 创建一个代表 WatsonBSafe 公司的新的发行者。右键单击 **Issuers**\
  \ 节点并选择 **Create**。\n5. 将 **Display Name** 和 **Issuer Name** 设置为 **WatsonBSafe**\
  \ 并生成密钥。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_285_1.png)\n\n\n\n6. 我们需要为每个与我们通信的供应商创建一个额外的发行者。当供应商调用我们的服务时，他们使用其唯一的发行者，我们将把他们的发行者声明映射到我们的应用程序所理解的声明。创建一个名为\
  \ **Riley Semiconductor** 的另一个发行者。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_286_0.png)\n\
  \n7. 右键单击 **Token Policies** 菜单项以创建 **Token Policy**，它负责签名令牌并应用指定的令牌生存期。新的 Token\
  \ Policy 命名为 WatsonBSafe Token Policy，并且具有 3600 秒的超时时间以及生成的签名密钥。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_286_1.png)\n\
  \n8. 在发行者和令牌策略就位后，我们通过右键单击 **Scopes** 菜单项并创建新的作用域来定义一个 **Scope**。AC 作用域是一组规则，用于指定资源的令牌签发行为。设置作用域的名称、**appliesTo**\
  \ URI（标识这些规则应适用于哪个资源）和令牌策略。之前，我们构建了两个处理“建筑访问管理”的单独服务，但现在我们可以定义一个应用规则的单一逻辑资源。具体来说，定义一个名为\
  \ `http://localhost/BuildingAccessManagementService` 的逻辑资源（**appliesTo** 值），该资源由两个先前构建的服务用于验证传入声明。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_287_0.png)\n\n9. 作用域中最重要的部分是驱动声明签发行为的实际规则。我们拥有既创建又撤销员工对公司建筑访问权限的服务，并且我们希望限制谁可以执行这些操作。任何员工都可以提交建筑访问请求，但只有站点管理员才有权撤销访问权限。在构建管理服务授权的声明之前，我们将构建一个简单的规则，将供应商的电子邮件地址传递给我们的服务。\n\
  \n10. 首先，在新的作用域下，创建一个 **PassThrough** 规则，该规则获取供应商的电子邮件地址并将提供的值复制到选定的输出声明 **PartnerContactEmail**。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_287_1.png)\n\n11. 接下来，创建我们的服务将用于接受或拒绝供应商数据的规则。在同一作用域下，创建一个名为\
  \ **ActivityPermission_Create** 的规则，类型为 **Simple**，并将 **Issuer** 设置为 **Riley Semiconductor**，**Type**\
  \ 为 **Group**，**Value** 为 **Employee**。我们刚才所做的是定义一个输入声明，我们在其中检查我们的发行者（我们的供应商）是否向我们提供了一个“Group”声明，表明服务调用者是员工。输出声明类型为\
  \ **ActivityPermission**，值为 **Create**。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_288_0.png)\n\
  \n12. 定义另一个名为 **ActivityPermission_Remove** 的规则，该规则使用 **Group** 的声明类型，但值为 **SiteManager**。输出声明的类型为\
  \ **ActivityPermission**，值为 **Revoke**。你可以想象，当我们有十几个供应商时，能够将多样化的输入声明映射到单个输出声明是一个强大的概念！\n\
  \n13. 通过单击 ACS 浏览器应用程序工具栏上的 **Save to Cloud** 按钮保存对 AC STS 的更改。\n\n我们在这里所做的是定义了一组规则，我们的服务现在可以在确认服务调用者有权执行所请求的操作时利用这些规则。\n\
  \n## 构建令牌验证器 WCF 行为\n\n在定义了声明后，我们现在需要一种实际验证发送到我们服务的声明的方法。在此练习中，我们构建一个部署为 WCF 端点行为的验证器组件，并拒绝无效的传入令牌。这是一个可重用的组件，因此我们希望避免硬编码任何值，而是依靠运行时配置来提供我们需要验证的声明类型。\n\
  \n- 1. 在现有的 Visual Studio 2010 解决方案中添加一个新的 .NET 类库项目，命名为 Chapter6. ClaimValidationBehavior。添加对\
  \ **System.Web**、**System.ServiceModel** 和 **System.ServiceModel.Web** 的引用。\n- 2.\
  \ 在本章提供的代码包中，你将找到一个 `TokenValidator.cs` 文件，该文件取自 AppFabric SDK。此类完成了验证令牌签名、到期日期、发行者等的大部分繁重工作。它还包含一个操作来从令牌中检索声明，以便我们可以查看它们是否与服务要求匹配。将此类添加到我们新的\
  \ .NET 项目中。\n- 3. 在项目中添加一个名为 `ClaimInspector.cs` 的新类。\n- 4. 在类的顶部添加以下“using”语句：\n\
  - 5. 确保 `ClaimInspector` 类是公共的，并从 WCF `IDispatchMessageInspector` 接口添加继承。\n- 6.\
  \ 定义一系列将在构造函数中设置并稍后在检查器类中使用的成员变量：\n\n```\nusing System.ServiceModel;\nusing System.ServiceModel.Web;\n\
  using System.ServiceModel.Dispatcher;\n//for http response property\nusing System.ServiceModel.Channels;\n\
  //for copied TokenValidator object\nusing Microsoft.AccessControl.SDK.ACS.Calculator.AuthorizationManager;\n\
  using System.Net;\n```\n\n```\nprivate string serviceNamespace;\nprivate string\
  \ trustedTokenPolicyKey;\nprivate string acsHostName;\nprivate string trustedAudience;\n\
  private string claimType;\nprivate string claimValue;\n```\n\n7. 接下来，创建一个公共构造函数，接收值并设置成员变量。\n\
  \n```\npublic ClaimInspector(string serviceNamespace, string trustedTokenPolicyKey,\
  \ string acsHostName, string trustedAudience, string claimType, string claimValue)\n\
  {\n    this.serviceNamespace = serviceNamespace;\n    this.trustedTokenPolicyKey\
  \ = trustedTokenPolicyKey;\n    this.acsHostName = acsHostName;\n    this.trustedAudience\
  \ = trustedAudience;\n    this.claimType = claimType;\n    this.claimValue = claimValue;\n\
  }\n```\n\n8. `IDispatchMessageInspector` 接口需要两个强制操作（AfterReceiveRequest 和 BeforeSendReply），但在填充这些操作之前，我们希望有一个辅助函数，使用我们的\
  \ TokenValidator 对象检查传入 HTTP 标头中的有效令牌。\n\n```\nprivate bool CheckValidToken()\n\
  {\n    bool isValid = true;\n    //instantiate the TokenValidator\n    TokenValidator\
  \ tv = new TokenValidator(\n        acsHostName,\n        serviceNamespace,\n  \
  \      trustedAudience,\n        Convert.FromBase64String(trustedTokenPolicyKey));\n\
  \n    // get the HTTP authorization header\n    string authorizationHeader = WebOperationContext.Current.IncomingRequest.Headers[HttpRequestHeader.Authorization];\n\
  \n    //if the header is missing return false\n    if (string.IsNullOrEmpty(authorizationHeader))\n\
  \    {\n        return false;\n    }\n\n    // validate the token and return false\
  \ if validation fails\n    if (!tv.Validate(authorizationHeader))\n    {\n     \
  \   return false;\n    }\n}\n```\n\n```\n// extract claims from header\nDictionary<string,\
  \ string> claims =\ntv.GetNameValues(authorizationHeader);\n\n// look for requested\
  \ claim\nstring permValue = \"\";\n    //if the required claim is missing, return\
  \ false\nif (!claims.TryGetValue(claimType, out permValue))\n{\nreturn false;\n\
  }\n\n    // check for the matching claim value\nif (permValue != claimValue)\n{\n\
  return false;\n}\n    //if all checks succeed, return success\nreturn isValid;\n\
  }\n```\n\n9. `AfterReceiveRequest` 操作现在可以通过辅助函数验证令牌。\n\n```\npublic object AfterReceiveRequest(\n\
  ref System.ServiceModel.Channels.Message request,\nIClientChannel channel,\nInstanceContext\
  \ instanceContext)\n{\n    //check claims using helper function\nbool isValid =\
  \ CheckValidToken();\n\nif (isValid == false)\n{\nrequest = null;\n\nreturn \"access\
  \ denied\";\n}\n\nreturn null;\n}\n```\n\n10. 此操作返回的值会自动用作 `BeforeSendReply` 操作中的上下文参数。在向调用方发送回复之前，我们检查请求是否应被拒绝，如果是，则返回\
  \ HTTP 401 状态代码（“unauthorized”）。\n\n```\npublic void BeforeSendReply(\nref System.ServiceModel.Channels.Message\
  \ reply,\nobject correlationState)\n{\n    //if invalid claim\n    if (correlationState\
  \ != null && correlationState.ToString() ==\n    \"access denied\")\n    {\n   \
  \     HttpResponseMessageProperty httpResponse =\n        new HttpResponseMessageProperty();\n\
  \        httpResponse.StatusCode =\n        System.Net.HttpStatusCode.Unauthorized;\n\
  \        reply.Properties[\"httpResponse\"] = httpResponse;\n    }\n}\n```\n\n11.\
  \ 我们的消息检查器现在已完成，我们可以继续构建我们的服务将利用的实际 WCF 行为。创建一个名为 ClaimVerificationBehavior.cs 的新类文件。\n\
  \n12. 在类的顶部添加以下“using”语句：\n\n```\nusing System.ServiceModel;\nusing System.ServiceModel.Description;\n\
  ```\n\n13. 确保 ClaimVerificationBehavior 类是公共的，并使其继承自 IEndpointBehavior 接口并定义以下成员变量：\n\
  \n```\npublic class ClaimVerificationBehavior : IEndpointBehavior\n{\n    private\
  \ string serviceNamespace;\n    private string trustedTokenPolicyKey;\n    private\
  \ string acsHostName;\n    private string trustedAudience;\n    private string claimType;\n\
  \    private string claimValue;\n```\n\n\n\n14. 如前所述，我们的公共构造函数将接受设置成员变量所需的值：\n\n\
  ```\npublic ClaimVerificationBehavior(\nstring serviceNamespace,\nstring trustedTokenPolicyKey,\n\
  string acsHostName,\nstring trustedAudience,\nstring claimType,\nstring claimValue)\n\
  {\nthis.serviceNamespace = serviceNamespace;\nthis.trustedTokenPolicyKey = trustedTokenPolicyKey;\n\
  this.acsHostName = acsHostName;\nthis.trustedAudience = trustedAudience;\nthis.claimType\
  \ = claimType;\nthis.claimValue = claimValue;\n}\n```\n\n15. 行为的最后一部分是接口要求的 ApplyDispatchBehavior\
  \ 操作，它将我们的 ClaimInspector 对象添加到 WCF 在接收消息时应用的消息检查器列表中。\n\n```\npublic void AddBindingParameters(ServiceEndpoint\
  \ endpoint,\nSystem.ServiceModel.Channels.BindingParameterCollection\nbindingParameters)\n\
  {}\n\npublic void ApplyClientBehavior(ServiceEndpoint endpoint, System.\nServiceModel.Dispatcher.ClientRuntime\
  \ clientRuntime)\n{}\n\npublic void ApplyDispatchBehavior(ServiceEndpoint endpoint,\n\
  System.ServiceModel.Dispatcher.EndpointDispatcher\nendpointDispatcher)\n{\nendpointDispatcher.DispatchRuntime.MessageInspectors.Add(new\
  \ ClaimInspector(serviceNamespace, trustedTokenPolicyKey, acsHostName, trustedAudience,\
  \ claimType, claimValue));\n}\n\npublic void Validate(ServiceEndpoint endpoint)\n\
  {}\n```\n\n16. 这个谜题的最后一部分是允许我们将此行为作为配置绑定的一部分进行配置的对象。创建一个名为 ClaimBehaviorExtension.cs\
  \ 的新类。\n\n17. 向该类添加以下三个 \"using\" 语句：\n\n```\nusing System.ServiceModel;\nusing\
  \ System.ServiceModel.Configuration; //for extension element\nusing System.Configuration;\
  \ //for configurationproperty\n```\n\n18. 此公共类应继承自 WCF BehaviorExtensionElement\
  \ 接口。\n\n19. 创建一系列可在服务配置上设置的公共属性。\n\n```\n//default constructor\npublic ClaimBehaviorExtension()\
  \ {}\n\n[ConfigurationProperty(\"serviceNamespace\", IsRequired=true)]\npublic string\
  \ ServiceNamespace\n{\n    get { return base[\"serviceNamespace\"].ToString(); }\n\
  \    set { base[\"serviceNamespace\"] = value; }\n}\n\n[ConfigurationProperty(\"\
  trustedTokenPolicyKey\", IsRequired=true)]\npublic string TrustedTokenPolicyKey\n\
  {\n    get { return base[\"trustedTokenPolicyKey\"].ToString(); }\n    set { base[\"\
  trustedTokenPolicyKey\"] = value; }\n}\n\n[ConfigurationProperty(\"acsHostName\"\
  , IsRequired=true)]\npublic string AcsHostName\n{\n    get { return base[\"acsHostName\"\
  ].ToString(); }\n    set { base[\"acsHostName\"] = value; }\n}\n\n[ConfigurationProperty(\"\
  trustedAudience\", IsRequired=true)]\npublic string TrustedAudience\n{\n    get\
  \ { return base[\"trustedAudience\"].ToString(); }\n    set { base[\"trustedAudience\"\
  ] = value; }\n}\n\n[ConfigurationProperty(\"claimType\", IsRequired=true)]\npublic\
  \ string ClaimType\n{\nget { return base[\"claimType\"].ToString(); }\nset { base[\"\
  claimType\"] = value; }\n}\n\n[ConfigurationProperty(\"claimValue\", IsRequired=true)]\n\
  public string ClaimValue\n{\n    get { return base[\"claimValue\"].ToString(); }\n\
  \    set { base[\"claimValue\"] = value; }\n}\n```\n\n20. 接下来，将 BehaviorType 属性设置为实际自定义行为类的\
  \ .NET 类型。\n\n```\npublic override Type BehaviorType\n{\n    get\n    {\n      \
  \  return typeof(ClaimVerificationBehavior);\n    }\n}\n```\n\n21. 最后，描述 CreateBehavior\
  \ 操作，该操作实例化我们的自定义声明检查器行为并传入服务在其配置设置中定义的所有值。\n\n```\nprotected override object CreateBehavior()\n\
  {\n    return new ClaimVerificationBehavior(\n        ServiceNamespace,\n      \
  \  TrustedTokenPolicyKey,\n        AcsHostName,\n        TrustedAudience,\n    \
  \    ClaimType,\n        ClaimValue);\n}\n```\n\n到目前为止，我们已在 AppFabric AC 中定义了声明，并且有一个新的\
  \ WCF 行为可以验证声明。接下来，配置 BizTalk Server 2010 以使用我们的自定义行为并验证传入的服务调用。\n\n## 配置 BizTalk\
  \ 服务以验证声明\n\nBizTalk Server 2010 针对 WCF 具有清晰的扩展点，并且可以在其处理管道中利用服务和端点行为。\n\n- 1. 使用强名称密钥签署自定义\
  \ WCF 行为，并将其添加到安装了 BizTalk Server 的服务器的全局程序集缓存 (GAC) 中。\n- 2. 为了让 BizTalk Server\
  \ 找到自定义行为，必须将它们添加到服务器的 machine.config 文件中。在我的服务器上，该文件位于 `C:\\Windows\\Microsoft.NET\\\
  Framework\\v4.0.30319\\Config\\machine.config`。如果您运行的是 64 位机器，请不要忘记同时打开并添加到 64 位\
  \ machine.config 文件中 (`C:\\Windows\\Microsoft.NET\\Framework64\\v4.0.30319\\Config\\\
  machine.config`)。\n- 3. 在 `machine.config` 文件的 `behaviorextensions` 部分中，添加以下块（根据您的签名密钥更改公钥令牌）。\n\
  - 4. 如果 BizTalk Server 管理控制台已打开，请先关闭然后重新打开，以避免任何缓存问题。\n- 5. 浏览到 **RequestAccessService**\
  \ 的接收位置。\n- 6. 在适配器配置下访问 **Behaviors** 选项卡并添加新的 **EndpointBehavior**。我们的 **ClaimValidationBehavior**\
  \ 应该列出并可供选择。\n\n```\n<add name=\"ClaimValidationBehavior\" type=\"Chapter6.\nClaimValidationBehavior.ClaimBehaviorExtension,\
  \ Chapter6.\nClaimValidationBehavior, Version=1.0.0.0, Culture=neutral,\nPublicKeyToken=<your\
  \ public key>\"/>\n```\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_296_0.png)\n\n\
  7. 一旦我们将行为添加到接收位置配置中，我们就可以查看公开的属性并根据我们的 AppFabric AC 值设置它们。\n\n| 属性 | 值 | 注释 |\n\
  |---|---|---|\n| acsHostName | Accesscontrol.windows.net |  |\n| claimType | ActivityPermission\
  \ | 这来自 AC 输出声明 |\n| claimValue | Create | 也来自输出声明 |\n| serviceNamespace | richardseroter\
  \ | 使用您的 AppFabric 命名空间的值 |\n| trustedAudience | http://localhost/BuildingAccessManagementService\
  \ | 来自 AC 范围 \"appliesTo\" 值 |\n| trustedTokenPolicyKey | <insert your token policy\
  \ key> | 来自 AC TokenPolicy |\n\n8. 保存接收位置配置。\n\n我们现在已配置 BizTalk Server 2010 以验证\
  \ AppFabric AC 声明。请注意，我们尚未将端点扩展到云中，但即使对于本地到本地的场景，我们仍然可以使用声明。\n\n## 构建服务使用者\n\n为了测试我们的配置，我们需要一个有效的服务使用者。在本章提供的\
  \ Visual Studio 2010 入门项目中，您应该能找到一个名为 Chapter6.ServiceConsumer.WinUI 的 Windows 窗体项目。\n\
  \n- 1. 打开 Chapter6.ServiceConsumer.WinUI 项目并添加对 http://localhost/RequestAccessService/RequestAccessService.svc\
  \ 的服务引用。\n- 2. 添加对 System.Web、System.ServiceModel 和 System.ServiceModel.Web 的项目引用。\n\
  - 3. 向窗体代码添加以下 \"using\" 语句：\n\n```\nusing System.ServiceModel;\nusing System.ServiceModel.Web;\n\
  using System.Web;\nusing System.Net;    //for HttpWebRequest\nusing System.IO; \
  \   //for Streaming\n```\n\n4. 在窗体的代码中添加一个名为 BuildToken 的辅助函数。令牌可以通过几种方式请求，我将在此处演示如何进行简单而有效的请求。\n\
  \n```\nprivate string BuildToken()\n{\n    //get the scope resource from the form\n\
  \    string wrap_scope = HttpUtility.UrlEncode(txtScope.Text);\n    //get the AC\
  \ issuer name from the form\n    string wrap_name = txtIssuerName.Text;\n    //get\
  \ the AC issuer key from the form\n    string wrap_password =\nHttpUtility.UrlEncode(txtIssuerKey.Text);\n\
  \n    //build token request\n    //NOTE: if you don't pass in the correct (or any)\
  \ input claims,\n    get HTTP 400 error (bad request)\n    string tokenReq = \"\
  wrap_scope=\" + wrap_scope + \"&wrap_name=\" +\n    wrap_name + \"&wrap_password=\"\
  \ + wrap_password +\n    \"&Email=riley@hotmail.com&Group=\"+ cbSubmitterType.SelectedItem;\n\
  \n    //create web request to AC endpoint\n    HttpWebRequest req =\n    (HttpWebRequest)WebRequest.Create(\n\
  \    \"https://your namespace.accesscontrol.windows.net/WRAPv0.9\");\n    req.ContentType\
  \ = \"application/x-www-form-urlencoded\";\n    req.Method = \"POST\";\n\n    //stream\
  \ the token request string\n    using (Stream reqStream = req.GetRequestStream())\n\
  \    {\n        var bytes = Encoding.UTF8.GetBytes(tokenReq);\n        reqStream.Write(bytes,\
  \ 0, bytes.Length);\n        reqStream.Close();\n    }\n\n    //get the token result\n\
  \    var response = (HttpWebResponse)req.GetResponse();\n    var token = new StreamReader(response.GetResponseStream()).\n\
  \    ReadToEnd();\n\n    //remove the \"wrap_access_token\" prefix\n    string splitToken\
  \ = token.Split('&').Single(value => value.\n    StartsWith(\"wrap_access_token=\"\
  , StringComparison.\n    OrdinalIgnoreCase)).Split('=')[1];\n    string tokenHeader\
  \ = HttpUtility.UrlDecode(splitToken);\n\n    return tokenHeader;\n}\n```\n\n\n\n\
  5. 为表单的 **btnSubmit** 按钮创建一个单击事件。此单击事件首先通过我们的 `BuildToken` 方法获取一个令牌，然后继续构建调用服务的\
  \ WCF 通道栈。不过首先，简单地输出 `BuildToken` 方法的结果，以确保我们可以成功地从 AppFabric AC 服务返回令牌。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_299_0.png)\n\
  \n6. 手握令牌后，我们可以继续定义 WCF 绑定和端点对象。\n\n```csharp\nBasicHttpBinding binding = new BasicHttpBinding();\n\
  EndpointAddress address = new EndpointAddress(\"http://localhost/RequestAccessService/RequestAccessService.svc\"\
  );\n```\n\n7. 接下来，我们为此绑定和地址定义 WCF 通道工厂。\n\n```csharp\nChannelFactory<RequestAccessSvc.RequestAccessServiceChannel>\
  \ factory =\n    new ChannelFactory<RequestAccessSvc.RequestAccessServiceChannel>(binding,\
  \ address);\n\nRequestAccessSvc.RequestAccessServiceChannel proxy = factory.CreateChannel();\n\
  ```\n\n8. 最后，我们打开代理，将令牌添加到传出的 HTTP 授权头中，构建消息负载并调用服务。\n\n```csharp\nusing (new OperationContextScope((IClientChannel)proxy))\n\
  {\n    //pass in token in service header\n    WebOperationContext.Current.OutgoingRequest.Headers.Add(HttpRequestHeader.Authorization,\
  \ tokenHeader);\n    try\n{\n    //build payload\n    RequestAccessSvc.PublishAccessRequestRequest\
  \ req =\n        new RequestAccessSvc.PublishAccessRequestRequest();\n\n    req.AccessRequestEvent\
  \ =\n    new RequestAccessSvc.AccessRequestEvent();\n        req.AccessRequestEvent.EmployeeId\
  \ = txtEmpId.Text;\n        req.AccessRequestEvent.LocationId = txtLocation.Text;\n\
  \        req.AccessRequestEvent.CompanyId = \"Riley Semiconductor\";\n        req.AccessRequestEvent.BuildingNumber\
  \ = txtBuilding.Text;\n        //TODO reader, conditionally set this value\n   \
  \     req.AccessRequestEvent.RequestType = RequestAccessSvc.AccessRequestEventRequestType.Create;\n\
  \        req.AccessRequestEvent.RoomNumber = txtRoom.Text;\n        req.AccessRequestEvent.DateRequested\
  \ = \"2010-10-29\";\n        req.AccessRequestEvent.DateAccessNeeded = dtNeeded.Text;\n\
  \        //call service\n        proxy.PublishAccessRequest(req);\n    }\n    catch\
  \ (Exception ex)\n    {\n    MessageBox.Show(\"Error: \" + ex.Message);\n    }\n\
  \    finally\n    {\n        ((IClientChannel)proxy).Close();\n        MessageBox.Show(\"\
  Done!\");\n    }\n```\n\n- 9. 你可能会注意到，与上面的接收位置练习一样；这些步骤仅涉及 Create 服务，而不涉及 Revoke\
  \ 服务。你可以随意将这些步骤添加到你的解决方案中，但在证明本练习要点的情况下配置此项是不必要的。\n- 10. 构建应用程序并确保 Scope、Issuer\
  \ Name 和 Issuer Key 值与我们的 AppFabric AC 值匹配。\n- 11. 创建一个新请求并将 Submitter Type 设置为\
  \ Employee。这是服务调用者的有效组分配，因此我们应该看到消息经过 BizTalk 并发送到我们之前构建的发送端口指定的位置。\n- 12. 再次提交相同的请求，不过这次将\
  \ Submitter Type 属性设置为 Site Manager。提交后，你应该收到一个错误，提示 HTTP 请求未授权。此外，由于未成功发布到 BizTalk，不应有消息写入磁盘。\n\
  \n令牌确实与其生命周期相关，因此实际上我们可以将令牌缓存在客户端，并在一段时间内使用它，直到需要刷新令牌为止。你现在已经构建了一个具有丰富授权控制的 BizTalk\
  \ Server 2010 服务端点。做得好！\n\n## 创建 Service Bus 访问控制权限\n\n为完成我们示例解决方案的这一部分，我们希望通过 Azure\
  \ AppFabric Service Bus 将此本地 BizTalk Server 端点扩展到 Azure 云。回顾我们的用例，两个合作伙伴首先消除了使用单一身份提供者的需求，现在他们准备消除\
  \ VPN 并通过基于云的 Service Bus 中继进行通信。\n\n之前我们为特定范围和访问规则集配置了 AppFabric AC 服务。AppFabric\
  \ Service Bus 拥有自己的安全令牌服务，用于管理谁可以向 Service Bus 发送和接收消息。你可以在 AppFabric 门户上看到有两个不同的\
  \ STS 端点地址：一个用于 Service Bus，一个用于访问控制服务。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_301_0.png)\n\
  \n在本次练习中，我们为 WatsonBSafe 公司和我们的合作伙伴 Riley Semiconductor 配置 Service Bus STS。\n\n\
  - 1. 在 AcmBrowser 应用程序中，输入 Service Bus STS 的命名空间和所有者密钥。请注意，Service Bus STS 的命名空间是\
  \ AppFabric 命名空间加上 \"-sb\" 后缀。例如，我的 Service Bus STS 命名空间是 richardseroter-sb。从云中加载当前配置。\n\
  - 2. 你可能会注意到，许多 AppFabric Service Bus 的演示都使用 \"owner\" 发行者名称和管理密钥来进行云监听和发送。在现实世界中，你永远不会分发你的命名空间管理凭据，而是定义特定的范围和发行者权限，将发送者和接收者限制在给定域中。我们将向此\
  \ STS 添加特定的发行者和新的范围以反映我们的解决方案场景。请注意，我们不会添加任何服务授权规则，因为我们之前的访问控制设置也将应用于云传输。\n- 3.\
  \ 为 **WatsonBSafe** 添加一个新的发行者，并为 **Riley Semiconductor** 添加另一个。\n- 4. Service Bus\
  \ STS 的默认范围位于命名空间根目录下。这太宽泛了，因此我们将在根目录下定义一个范围。将我们范围的 **AppliesTo** 参数设置为 `http://<your\
  \ namespace>.servicebus.windows.net/RequestAccessService` 并重用现有的 Service Bus 令牌策略。你可能会注意到，此范围用于物理服务地址，而\
  \ AC STS 使用的是逻辑地址。在这种情况下，Service Bus 将为希望绑定到云的特定地址签发声明，因此需要完全匹配。\n- 5. 创建一个名为 **Listen**\
  \ 的新规则。此规则的输入声明使用 **WatsonBSafe** 发行者，类型为 **Issuer**，值为 **WatsonBSafe**。输出声明的类型为\
  \ `net.windows.servicebus.action`，值为 **Listen**。基本上，它表示如果服务知道该发行者的发行者名称和密钥，则它们有权在请求的服务\
  \ URL 处监听。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_302_0.png)\n\n- 6. 定义第二个名为\
  \ **Send** 的规则，其输入声明使用 **Riley Semiconductor** 发行者，**Type** 为 **Issuer**，**Value**\
  \ 为 **Riley Semiconductor**。输出声明的类型为 **net.windows.servicebus.action**，值为 **Send**。与之前一样，如果服务客户端知道发行者的发行者名称和密钥，则允许它们向\
  \ Service Bus 端点发送请求。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_303_0.png)\n\n\
  - 7. 将此配置保存到 Service Bus STS。\n\n你现在已使用更精细的发行者和特定资源配置了 AppFabric Service Bus STS，我们的服务可以绑定到该资源，客户端也可以调用它。\n\
  \n## 重新配置 BizTalk 解决方案以使用 Service Bus 绑定\n\n如果在 **BizTalk Server 2010 AppFabric\
  \ Connect for Services** 发布之前想要 BizTalk Server 监听云端，你必须手动配置一个使用 Service Bus 绑定的\
  \ **WCF-CustomIsolated** 端点。这并不是一件特别具有挑战性的事情；然而，由于 Service Bus 绑定不能完全遵守通常用于共享服务\
  \ WSDL 的 `serviceMetadata` WCF 行为，因此在轻松共享元数据方面存在问题。BizTalk Server 2010 更新的服务生成向导通过生成云可见的\
  \ MEX 端点解决了此问题。\n\n\n\n我们可以重建之前构建的、由 BizTalk 生成的服务，但这次选择将我们的端点扩展到云端。请注意，为了实现未来的云启用，我们之前创建了两个不同的服务，而不是一个具有两个端点的服务。新的向导不支持在同一解决方案中包含两个服务端点的概念，因此我们需要两个不同的服务项目。对于本示例，我们将只重建（并启用云）**RequestAccessService**。\n\
  \n- 1. 在 Visual Studio 2010 中，启动 BizTalk WCF 服务发布向导并选择 **WCF-CustomIsolated** 适配器。还选择在\
  \ **Chapter 6** 应用程序中拥有元数据终结点和接收位置。\n- 2. 在下一个向导页面中，选择 **添加 Service Bus 端点。** 选项。如果看不到此选项，请验证是否确实安装了\
  \ BizTalk Server 2010 功能包。\n- 3. 选择从模式构建 Web 服务的选项。\n- 4. 重建服务，使其与我们最初的 **RequestAccessService**\
  \ 相同。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_304_0.png)\n\n- 5. 将服务的目标命名空间设置为\
  \ `http://Chapter6/BuildingAccessManagement`\n- 6. 将部署位置设置为 `http://localhost/RequestAccessService`\
  \ 并确保选择覆盖现有服务的选项。\n- 7. 后续的向导页面出现是因为我们之前选择了构建 Service Bus 端点的选项。\n\n- 8. 选择 **BasicHttpRelayBinding**\
  \ 并在 **服务命名空间** 字段中输入您个人的 Service Bus 命名空间值。此外，选择 **在云上启用元数据交换** 选项。这意味着我们的服务中有一个独立的云端点，用于公开元数据描述。您也可以选择使此服务在\
  \ Service Bus 命名空间的 ATOM feed 中可发现。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_305_0.png)\n\
  \n- 9. 在定义 Service Bus 端点后，我们选择服务身份验证参数。在我们的例子中，我们使用 WatsonBSafe 发行者和关联的发行者密钥。下面的配置显示，获取服务元数据不需要客户端身份验证，但实际调用服务需要调用方使用\
  \ Service Bus 进行身份验证。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_305_1.png)\n\n\
  - 10. 完成向导，该向导会覆盖我们现有的 Web 服务和接收位置。进入 BizTalk 管理控制台，找到生成的接收位置并将绑定重置为 **BasicHttpBinding**（不是云中继绑定），并使用之前概述的值重新添加我们的自定义声明授权行为。\n\
  - 11. 找到向导生成的 Web 服务并检查 `web.config` 文件。请注意，我们现在总共有三个端点：一个用于本地元数据交换，一个用于云元数据交换，一个用于云中继。向导没有利用接收位置配置来定义服务端点，而是将云所需设置添加到\
  \ Azure AppFabric Web 服务端点。然而，这意味着我们的自定义授权行为不会自动应用于我们的云中继端点。行为必须手动添加到 AppFabric\
  \ 端点，因为它不会从接收位置的配置中提取。\n- 12. 找到名为 `sharedSecretClientCredentials` 的端点行为，并使用与接收位置行为相同的值添加我们自定义行为的配置块。\n\
  - 13. 保存 `web.config` 文件并在浏览器中浏览服务端点，确认我们的端点配置正确。\n\n```\n<ClaimVerificationBehavior\n\
  serviceNamespace=\"<your namespace>\"\ntrustedTokenPolicyKey= <your key here>\n\
  acsHostName=\"accesscontrol.windows.net\"\ntrustedAudience=\"http://localhost/BuildingAccessManagementService\"\
  \nclaimType=\"ActivityPermission\"\nclaimValue=\"Create\" />\n```\n\n## 重新配置服务使用者以使用\
  \ Service Bus 绑定\n\n现在剩下的就是通过云中继调用我们的服务。以下步骤概述了使之成为可能的客户端代码更改。\n\n- 1. 要在 `Chapter6.ServiceConsumer.WinUI`\
  \ Windows 窗体项目中调用我们的新云端点，我们需要对现有代码进行一些更改。首先，添加对 `System.ServiceBus.dll` 的引用，并在窗体代码中添加一个“using”语句。然后，在窗体的按钮单击事件中，使用\
  \ `BasicHttpRelayBinding` 类型重新定义 `binding` 变量。\n\n```\nBasicHttpRelayBinding binding\
  \ = new BasicHttpRelayBinding(EndToEndBasicHttpSecurityMode.Transport, RelayClientAuthenticationType.RelayAccessToken);\n\
  ```\n\n- 2. 接下来，将端点地址更改为指向云托管端点。\n\n```\nEndpointAddress address = new EndpointAddress(\"\
  https://richardseroter.servicebus.windows.net/RequestAccessService/RequestAccessService.svc\"\
  );\n```\n\n- 3. 为了传入我们的 Service Bus 身份验证令牌，该令牌为我们提供调用服务所需的声明，我们需要定义一个 TransportClientEndpointBehavior。我们使用\
  \ SharedSecret 凭据类型并传入 Service Bus 的供应商凭据。\n\n```\nTransportClientEndpointBehavior\
  \ sbBehavior =\n    new TransportClientEndpointBehavior();\nsbBehavior.CredentialType\
  \ =\nTransportClientCredentialType.SharedSecret;\nsbBehavior.Credentials.SharedSecret.IssuerName\
  \ =\n\"Riley Semiconductor\";\nsbBehavior.Credentials.SharedSecret.IssuerSecret\
  \ =\n\"HwWbATe00bCpxszylPdJoVns+PNfJCdgK2lUErcWJAE=\";\n```\n\n- 4. 最后，在我们的通道工厂定义之后，我们添加端点行为。\n\
  \n```\nfactory.Endpoint.Behaviors.Add(sbBehavior);\n```\n\n- 5. 保存并编译客户端应用程序。\n\n\
  如果我们在向云端点提交消息时使用正确的发送者（“Employee”），则可以看到消息通过 BizTalk Server 传输并最终到达文件系统。如果我们尝试使用无效的发送者类型（“Site\
  \ Manager”）调用服务，则会收到 HTTP 401 错误。\n\n在本演示中，我们看到了如何构建自定义授权管理器并将其应用于本地 BizTalk 生成的\
  \ Web 服务。然后很容易稍后扩展该本地服务并添加云端点。这是将现有内部端点通过云扩展到选定外部用户群的有力场景。\n\n## 将 BizTalk Server\
  \ 消息发布到 Service Bus\n\nBizTalk Server 2010 是 Azure Service Bus 消息的直接使用者。随着越来越多的组织在其企业架构中引入云解决方案，我们将看到对无缝编排这些端点与本地数据和系统日益增长的需求。云服务可以非常轻松地由\
  \ BizTalk Server 调用，使 BizTalk 在云与云之间或本地与云之间集成时成为宝贵的资产。\n\n## 场景描述\n\n在此场景中，我们继续与\
  \ WatsonBSafe 和 Riley Semiconductor 组织的合作。如果您还记得上一次练习，WatsonBSafe 需要查询 Riley Semiconductor\
  \ 的培训系统，以便在授予员工进入建筑物或房间的权限之前确定所需的课程。培训服务通过 Service Bus 公开，需要由 BizTalk Server 2010\
  \ 调用。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_308_0.png)\n\n## 解决方案设计\n\n对于此解决方案，我们将使用\
  \ BizTalk Server 的 WCF-CustomIsolated 适配器以及 Service Bus 绑定来调用培训服务。由于该服务仅查找数据且不需要细粒度安全性，因此我们不会在标准\
  \ Service Bus 身份验证流程之外应用任何安全性。\n\n## 构建访问控制服务组件\n\n我们首先需要的是供应商培训服务的 Service Bus\
  \ STS 配置。在之前的演示中，WatsonBSafe 托管了一个 Riley Semiconductor 发送到的服务。在这里，角色发生了逆转。\n\n-\
  \ 1. 打开 AcmBrowser 应用程序并使用您的命名空间（加上“-sb”后缀）和默认发行者密钥登录 Service Bus STS。\n- 2. 添加一个名为\
  \ **TrainingServices** 的新范围，并将范围的 **应用到 URL** 设置为 `http://<your namespace>.servicebus.windows.net/TrainingServices`\n\
  - 3. 创建一个名为 **Listen** 的新规则，其中输入声明 **发行者** 为 **Riley Semiconductor**，**类型** 为 **Issuer**，**值**\
  \ 为 **Riley Semiconductor**。输出声明类型为 `net.windows.servicebus.action`，值为 **Listen**。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_309_0.png)\n\n- 4. 定义第二个名为 **Send** 的规则，该规则使用\
  \ **WatsonBSafe** 发行者，类型为 **Issuer**，值为 **WatsonBSafe**。输出声明类型为 `net.windows.servicebus.action`，值为\
  \ **Send**。此规则颁发令牌，允许服务使用者在知道 WatsonBSafe 发行者的凭据时调用服务。\n- 5. 将 Service Bus STS 配置保存回云端。\n\
  \n\n\n\n- 6. 返回 Visual Studio 2010 并打开解决方案中存在的 `Chapter6.TrainingService` 项目。\n\
  - 7. 打开服务的 `web.config` 文件并进行以下更改：\n  - a. 在 `system.ServiceModel/services/service`\
  \ 下为每个端点完成端点地址，填写您自己的 Service Bus 命名空间。\n  - b. 在 `system.serviceModel/behaviors/endpointBehaviors`\
  \ 处为两个行为设置有效的发行者密钥。\n- 8. 构建并部署 TrainingService，并在浏览器中查看服务以确保成功绑定到云。\n\n我们的 TrainingService\
  \ 现已完成，可供 BizTalk Server 调用。\n\n## 构建 BizTalk 解决方案组件\n\n我们将构建一些 BizTalk 组件，用于调用\
  \ TrainingService 并将其结果与访问请求消息合并，以便发出一条包含请求访问的员工以及授予访问权限所需培训的单一消息。\n\n- 1. 在 Visual\
  \ Studio 2010 解决方案中打开现有的 BizTalk Server 项目。\n- 2. 创建一个名为 `AccessRequirements_XML.xsd`\
  \ 的新架构。此架构保存访问请求详细信息和与访问请求相关的必需培训课程的组合。所有元素的 数据类型均为“string。”\n- 3. 确保上述架构将 `Course`\
  \ 节点设置为无界，以支持无限数量的分配课程。\n- 4. 现在我们准备引用云托管的 TrainingService 并生成调用该服务所需的 BizTalk 工件。在\
  \ Visual Studio 2010 中右键单击 BizTalk 项目并选择 **添加生成项**。选择 **使用 WCF 服务** 选项。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_310_0.png)\n\
  \n- 5. 在提示时，输入服务的 MEX 地址（例如，`https://<your namespace>.servicebus.windows.net/TrainingServices/TrainingService.svc_mex`）并单击\
  \ **获取** 按钮。您可能会看到错误，但这不会产生负面影响。MEX 查询通过 SOAP 进行，而此向导仅执行简单的 HTTP GET 请求。因此，错误是预期的。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_311_0.png)\n\n- 6. 完成 BizTalk WCF 服务使用向导，注意向导会在\
  \ BizTalk 项目中添加架构、编排和绑定文件。\n- 7. 在 BizTalk 项目中创建一个名为 `VerifyRileyAccessRequirements.odx`\
  \ 的新编排。此编排监听来自 Riley Semiconductor 公司的建筑访问请求，并通过云回调到 Riley Semiconductor 的培训系统，以查找请求建筑所需的培训。从概念上讲，我们可以为每个合作伙伴创建一个编排，或者也可以构建一个更松散耦合的编排，该编排更依赖于发送端口映射以实现特定于目标的格式。在此场景中，我们将构建特定于供应商的编排。\n\
  - 8. 定义四个编排级消息：\n  - a. **AccessRequestInput** of type **Chapter6.BuildingAccessManagement.BizTalk.AccessRequestEvent_XML**\n\
  \  - b. **EmployeeTrainingOutput** of type **Chapter6.BuildingAccessManagement.BizTalk.AccessRequirements_XML**\n\
  \  - c. **TrainingServiceRequest** of multi-part type **Chapter6.BuildingAccessManagement.BizTalk.ITrainingService_GetTrainingForBuildingAccess_InputMessage**\n\
  \  - d. **TrainingServiceResponse** of multi-part type **Chapter6.BuildingAccessManagement.BizTalk.ITrainingService_GetTrainingForBuildingAccess_OutputMessage**\n\
  - 9. 在编排的初始接收形状上添加过滤器。此过滤器将确保只有来自 Riley Semiconductor 的消息进入此编排。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_312_0.png)\n\
  \n- 10. 在最顶层的接收形状之后，添加一个 **构造/转换** 块，负责构建服务的请求消息。\n- 11. 双击 **转换** 形状并选择创建名为 **BizTalk.AccessRequest_To_TrainingServiceRequest**\
  \ 的新映射的选项。此映射应以 **AccessRequestInput** 消息开始并输出 **TrainingServiceRequest** 消息。\n\
  - 12. 在映射中，将 **LocationId**、**BuildingNumber** 和 **RoomNumber** 连接到目标架构中的相应节点。保存映射并返回到编排。\n\
  - 13. 在之前的 **构造** 形状下方添加 **发送** 形状和 **接收** 形状。这些新形状负责调用 TrainingService 并接收响应消息。将\
  \ **发送** 形状设置为使用 **TrainingServiceRequest** 消息，而 **接收** 形状将使用 **TrainingServiceResponse**\
  \ 消息。\n- 14. 在编排的 **端口表面** 部分创建一个新的已配置端口。对于 **端口类型** 值，选择使用现有端口类型并指向由服务引用创建的端口类型。我们的编排应如下图所示：\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_313_0.png)\n\n- 15. 接下来，我们需要将原始消息与服务调用的结果合并。在编排底部添加一个新的\
  \ **构造/转换** 块。\n- 16. 双击 **转换** 形状并创建名为 **AccessRequestTrainingResponse_To_EmployeeTrainingOutput**\
  \ 的新映射。\n- 17. 映射的输入同时为 **AccessRequestInput** 和 **TrainingServiceResponse** 消息，并输出\
  \ **EmployeeTrainingOutput** 消息。你可能记得可以在 BizTalk Server 中创建多部分映射，但只能在编排内部创建。不能在\
  \ Mapper 本身内部创建多部分映射。\n- 18. 将相关的源节点连接到目标节点。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_313_1.png)\n\
  \n- 19. 添加一个最终的发送形状，使用 **EmployeeTrainingOutput** 消息。\n- 20. 为初始 **接收** 形状定义一个编排接收端口，为最后一个\
  \ **发送** 形状定义一个编排发送端口。最顶层的编排接收端口应为 **直接绑定**，这意味着它侦听 MessageBox 中的数据，而不是绑定到消息端口。\n\
  - 21. 构建并部署更新的 BizTalk 解决方案。\n\n我们现在拥有从 BizTalk Server 消费云服务所需的所有编译组件。接下来，我们需要配置\
  \ BizTalk 消息组件以与 Windows Azure AppFabric 通信。\n\n## 配置 BizTalk 解决方案以使用 Service Bus\
  \ 绑定\n\n我们的最终练习是配置 BizTalk 消息组件。\n\n- 1. 切换到 BizTalk Server 管理控制台并找到 **Chapter6**\
  \ 应用程序。\n- 2. 我们需要两个消息端口。首先，我们需要通过 Service Bus 调用 TrainingService 的双向发送端口。无需手动构建此端口，我们可以使用\
  \ BizTalk WCF 服务使用向导生成的绑定文件。右键单击 **Chapter6** 应用程序并选择 **导入**，然后选择 **绑定**，并导航到与我们的\
  \ BizTalk 项目代码所在文件夹中的 `TrainingService_Custom.BindingInfo.xml` 文件。\n- 3. 导入绑定后，我们可以在应用程序中看到一个新的发送端口。打开该端口会显示云地址、云绑定和有效的\
  \ WCF 操作。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_315_0.png)\n\n- 4. 切换到 **行为**\
  \ 选项卡并添加一个新的端点行为。找到 **TransportClientEndpointBehavior** 并为 Service Bus 设置有效的“发送”凭据。在我们的例子中，这是来自\
  \ Service Bus STS 的 WatsonBSafe 发行者及其密钥。\n- 5. 我们的最终消息端口是一个单向发送端口，用于传输编排的最终消息。创建一个文件发送端口，将消息发送到文件系统。\n\
  - 6. 消息端口完成后，我们可以完成编排绑定。转到 Chapter6 应用程序中的编排，并将传出逻辑端口与适当的发送端口/发送端口组匹配。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_316_0.png)\n\
  \n- 7. 启动发送端口和编排。\n\n我们可以通过启动客户端应用程序并提交新的建筑访问请求来测试整个端到端解决方案。选择建筑 10 进行第一次请求，注意输出消息中用户没有培训要求。如果发送另一个请求并使用建筑\
  \ 41，你应该会看到一条消息，其中用户被分配了两门课程。\n\n## 摘要\n\n随着越来越多的组织开始依赖云来运行关键任务应用程序，对简单集成解决方案的需求将会增加。在本章中，我们首先看到了如何以最少的努力将消息从云发送到本地\
  \ BizTalk Server。我们执行的大部分工作围绕构建可重用的 WCF 行为，该行为可以验证令牌并在服务上叠加授权层。在 Windows Azure AppFabric\
  \ 可用之前，这种集成只能通过通过反向代理将 BizTalk Server 暴露给互联网，或使用硬件/软件允许合作伙伴直接访问内部服务总线来实现。现在，通过最少的努力，我们可以选择性地将单个端点暴露给任何经过授权的、可以通过互联网访问的客户端。\n\
  \n除了向云发送消息之外，我们还需要能够消费云服务的能力。我们看到以 BizTalk 消费本地服务的方式消费云端点非常容易。可以想象，编排将内部和外部数据无缝结合的消息解决方案的令人兴奋的可能性。\n\
  \n在下一章中，我们将看到如何使用 Windows SharePoint Services 适配器和 InfoPath 构建集成的 SharePoint 解决方案。\n\
  \n\n\n"
- "## 7 与 SharePoint 2010 集成\n\nMicrosoft SharePoint Server 是一个平台，允许人们通过交互式 Web 技术进行协作。团队可以通过项目生命周期管理文档集、捕获可用于报表功能的结构化与非结构化数据，并构建复合业务应用程序。\n\
  \n对许多人来说，SharePoint 不被视为业务线 (LOB) 系统。它历史上一直被视为文档管理系统。那么，为什么它会被收录在这本书中呢？现实情况是，随着组织持续在该技术上投入，SharePoint\
  \ 不断被用作 LOB 系统。SharePoint 不再只是 Word 文档和 PowerPoint 演示文稿的存储位置。SharePoint 本质上是一个平台，很像\
  \ BizTalk。不同之处在于 SharePoint 是一个协作平台，而 BizTalk 则是集成平台，除此之外还有其他区别。SharePoint 包含一个名为\
  \ SharePoint Foundation 的底层框架。开发人员可以利用 API 和 Web 服务在平台之上构建自定义应用程序。对于喜欢先“购买”再“构建”的组织来说，这是一个有吸引力的方案。即使您的组织有定制开发的需求，我们仍然可以使用\
  \ ASP.Net、JQuery、Windows Workflow Foundation (WF) 和 Windows Communication Foundation\
  \ (WCF) 在 SharePoint 内部构建自定义应用程序。\n\n请注意，SharePoint 2010 使用 .NET 3.5，因此我们无法使用 .NET\
  \ 4.0 中可用的最新 WF 和 WCF 功能。\n\n组织开始在 SharePoint 平台上构建复合应用程序。这些应用程序通常是独立的应用程序，但随着越来越多的组织希望利用\
  \ SharePoint，他们经常需要将信息导入或导出 SharePoint，而这正是使用 BizTalk 增加价值的地方。\n\n一个正在出现的常见场景涉及在可以使用记录系统（System\
  \ of Record）的地方使用 SharePoint，例如 ERP 系统。SharePoint 允许快速应用程序开发，并且在许多情况下解决方案可以通过配置构建。组织越来越受到快速且经济高效地构建解决方案的压力，这使得\
  \ SharePoint 成为一个有吸引力的选择。最终用户也可能更喜欢其用户界面而不是 ERP 的界面。SharePoint 的用户界面，尤其是在 SharePoint\
  \ 2010 中，与 Office 产品套件中常见的用户界面非常接近。这简化了最终用户的采用和接受，并为用户经常访问的应用程序提供一致的体验。SharePoint\
  \ 2010 中提供的一项新功能是 Office 功能区。所以无论您喜欢功能区还是讨厌功能区，您都将在 Microsoft Office 套件和 SharePoint\
  \ 之间获得一致的体验。\n\n记录系统应用程序，例如 ERP，通常需要 SharePoint 应用程序中收集的数据。指定记录系统的组织通常不希望数据在无法核对或报告信息的其他系统中被修改和存储。为了使您的记录系统与其他系统保持同步，您需要集成系统，或者让最终用户将数据输入到多个系统中。企业架构师和最终用户都不希望信息输入到多个位置，因为这会导致数据完整性问题且工作繁琐。使用\
  \ BizTalk 集成这些系统可避免这种额外的手动工作，同时在各个系统之间提供可重复、可靠的数据同步。\n\n在本章剩余部分，我们将介绍以下主题：\n\n-\
  \ SharePoint 与 BizTalk 集成：为什么 SharePoint 与 BizTalk 结合更好\n- 了解 SharePoint 集成的组件\n\
  - Windows SharePoint Services 适配器的安装\n- Windows SharePoint Services 适配器\n- 从 SharePoint\
  \ 接收文档\n- 向 SharePoint 发送文档\n\n### SharePoint 与 BizTalk 集成：为什么 SharePoint 与 BizTalk\
  \ 结合更好\n\nSharePoint 与 BizTalk 结合更好，因为它将 SharePoint 的覆盖范围扩展到企业内部。它不再是一个需要用户手动输入的孤立系统。虽然可以在没有\
  \ BizTalk 的情况下集成 SharePoint，但 BizTalk 具有内置功能，可减少集成系统与 SharePoint 所需的时间。集成可以通过 Windows\
  \ SharePoint Services (WSS) 适配器实现，该适配器包含在 BizTalk 安装中，并通过与 SharePoint 即开即用的 Web\
  \ 服务进行交互。\n\n组织已通过 BizTalk 找到了一些巧妙的方法来增强或扩展 SharePoint 与其他系统的功能。我们现在将逐步介绍这些不同的场景，展示如何将\
  \ SharePoint 和 BizTalk 结合使用，为您的组织提供真正的价值。\n\n### 捕获设备更换图像\n\n**Problem:** 随着一家公用事业配电公司用自动计量表替换传统电表，监管要求必须存储新旧电表的当前读数信息。这些信息需要在特定时间内保留，以防出现计费差异。当出现此类差异时，客户服务代表需要能够轻松搜索这些图像。\n\
  \n**Solution:** 当现场工作人员完成电表安装后，图像会同步到网络文件夹位置，而 BizTalk 的 FILE 适配器正在监视该位置。当 BizTalk\
  \ 消费文件时，图像将通过发送管道传输，其中文件名会被解析，并检索有关图像的元数据并放置在 Windows SharePoint Services 适配器上下文属性中。这些元数据将被添加到文档库中的\
  \ SharePoint 列中，以便可以对其进行排序和分组。\n\n这些图像可以很容易地存储在网络文件共享中，但使用此解决方案有几个优点：\n\n- 可以为这些图像添加元数据，从而改善搜索体验。\n\
  - 由于 SharePoint 索引，搜索执行速度比扫描网络文件夹更快，后者可能包含数万张到数十万张图像。\n- 可以在 SharePoint 中实施信息策略，在满足监管合规期后清理不必要的文件。\n\
  \n### 车辆维护列表\n\n**Problem:** 当现场车辆完成维护工作时，这些信息需要为财务和监管目的记录在公司的记录系统中，该系统恰好是 ERP。移动工作人员希望快速准确地完成这些信息，以便回到真正的工作上。\n\
  \n**Solution:** 在 SharePoint 内部，我们可以创建一个简单的自定义列表。您可以将自定义列表视为类似于 Excel 电子表格，不同之处在于自定义列表中的数据存储在\
  \ SharePoint 数据库中。现场工作人员可以在自定义列表中输入所需的车辆维护信息，而无需输入大量按键。让这些现场工作人员登录复杂的 ERP 系统既耗时又有培训影响。访问\
  \ SharePoint 列表只需在 Internet Explorer 中启动书签站点并利用 Windows 身份验证即可，无需提供额外凭据。\n\n这些信息需要传达给\
  \ ERP 以用于财务和报告目的；BizTalk 能够定期消费 SharePoint 的 Web 服务并检索此信息，并构建可加载到 ERP 系统中的等效平面文件。本场景的深入演练包含在第\
  \ 8 章中。\n\n使用此解决方案的一些好处是：\n\n- 简单的用户界面用于输入车辆维护详细信息\n- 无需向应用程序提供额外凭据\n- 最终用户所需培训很少，因为他们都熟悉\
  \ Office 2010 套件\n\n### 现场事件报告\n\n**Problem:** 每当现场工作人员涉及事故或环境事件时，这些信息必须为监管目的进行跟踪。同样，这些信息需要在组织的记录系统中捕获，该系统恰好是\
  \ ERP。ERP 系统确实允许用户通过 ERP 系统内的图形用户界面 (GUI) 表单完成这些信息，但要求用户填写 12 个不同的选项卡，这非常耗时。\n\n\
  \n\n**解决方案：** 再次，我们希望确保该解决方案易于现场工作人员使用，不需要大量按键或鼠标点击，也不需要大量培训。通过利用存储在 SharePoint\
  \ 中的 InfoPath 表单，员工可以从现场访问这些表单，并将其提交到 SharePoint，办公室中的某人会在提交信息到 ERP 之前验证这些信息。一旦数据得到验证，BizTalk\
  \ 将监听这些 InfoPath 请求并转换 InfoPath 消息，然后通过 BizTalk 适配器将信息提交到 ERP 系统。\n\n使用此解决方案的一些好处是：\n\
  \n- 员工生产率提高，因为他们不再需要在 ERP 应用程序中填写 12 个标签页\n- 降低培训成本\n- 单点登录功能\n\n## 了解 SharePoint\
  \ 和 BizTalk 集成的组件\n\n对于许多开发人员来说，与 SharePoint 集成可能是一项令人困惑的工作。这在一定程度上与必须存在的要求组件有关，以便在这两个系统之间进行集成。\n\
  \n开箱即用，BizTalk 包含一个名为 Windows SharePoint Services 适配器的适配器。这是在与 SharePoint 文档和表单库通信时使用的适配器。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_321_0.png)\n\n## 与 SharePoint 2010 集成\n\
  \n单独使用此 BizTalk 适配器是不够的。为了使此适配器正常运行，我们还需要安装 Windows SharePoint Services 适配器 Web\
  \ 服务。此适配器 Web 服务可在 BizTalk 安装光盘上获得，但 Windows SharePoint Services 适配器 Web 服务需要在 SharePoint\
  \ 服务器上安装。如果您在同一服务器上共同托管 BizTalk 和 SharePoint，则应将其安装在同一服务器上。如果您有远程 SharePoint 服务器，则此适配器\
  \ Web 服务只需安装在 SharePoint 服务器上，而无需安装在 BizTalk 服务器上。\n\n> 与远程 SharePoint 安装集成时，BizTalk\
  \ 服务器和 SharePoint 服务器必须存在于同一域中。\n\n如果在尝试安装适配器 Web 服务的服务器上未检测到 SharePoint，则无法安装此组件，因为在安装应用程序中该选项将被禁用。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_322_0.png)\n\n## Windows SharePoint Services\
  \ 适配器 Web 服务的安装\n\n由于在安装 BizTalk 运行时时已安装 Windows SharePoint Services 适配器，我们将仅关注安装\
  \ Windows SharePoint Services 适配器 Web 服务。\n\n下面是在集成 BizTalk 2010 和 SharePoint 时支持的配置。请参阅\
  \ http://technet.microsoft.com/en-us/library/bb743377(BTS.70).aspx 获取更多信息。\n\n|\
  \ SharePoint 版本 | 注释 |\n|---|---|\n| SharePoint 2010/SharePoint 2010 Foundation\
  \ | SharePoint 2010 Foundation 是一个免费的基础组件，SharePoint 2010 建立在其之上。 |\n| Microsoft\
  \ Office SharePoint Server (MOSS) 2007/Windows SharePoint Services (WSS) 3.0 SP2\
  \ | WSS 3.0 SP2 是一个免费的基础组件，MOSS 2007 建立在其之上。 |\n\n> 只要您在已许可的 Windows 版本上运行它们，SharePoint\
  \ 2010 Foundation 和 Windows SharePoint Service 3.0 SP2 都是免费的。\n\n1. 一旦我们安装了 SharePoint，或有权访问现有的\
  \ SharePoint 环境，我们就可以从 BizTalk 安装介质安装 Windows SharePoint Services 适配器 Web 服务。安装过程将检测到\
  \ SharePoint 已安装，因为您可以选择 Windows SharePoint Services 适配器 Web 服务选项。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_323_0.png)\n\
  \n2. 现在我们将被提示确认是否要继续安装 Windows SharePoint Services 适配器 Web 服务。单击“安装”按钮继续。\n\n> 尽管\
  \ SharePoint 产品团队已放弃 Windows SharePoint Services 品牌，但 BizTalk 团队仍将此组件称为 Windows\
  \ SharePoint Services 适配器 Web 服务，即使您可能正在连接到现在使用 SharePoint Foundation 的 SharePoint\
  \ 2010 环境。\n\n3. 与许多 BizTalk 组件一样，每个实现都有两个方面：安装和配置。我们现在将通过选择“启动 BizTalk 服务器配置”复选框并单击“完成”按钮来配置\
  \ Windows SharePoint Services 适配器 Web 服务。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_324_0.png)\n\
  \n4. 我们现在希望在此计算机上启用 Windows SharePoint Services 适配器。为了启用此适配器，我们需要提供主机实例用户是其成员的 Windows\
  \ 组。在以下配置中，已在 Active Directory 中创建了一个名为 SharePoint Enabled Hosts 的组，并且一个名为 btslcl\
  \ 的 BizTalk 主机实例用户帐户已添加到该组中。每个主机实例都在具有执行 BizTalk 任务所需权限的用户上下文下运行，例如与其他端点系统和 BizTalk\
  \ 消息框等进行交互。\n\n5. 我们还需要提供将部署此适配器 Web 服务的 Windows SharePoint Services/ Foundation\
  \ 站点的名称。在本例中，我们选择的是 SharePoint 网站的名称，该名称恰好为 **SharePoint-LOB-8080**。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_325_0.png)\n\
  \n6. 在这一点上，我们准备好单击 **应用配置** 按钮以完成适配器 Web 服务的安装。\n\n7. 我们现在应该看到适配器配置成功的确认。单击 **完成**\
  \ 按钮完成此任务。\n\n## 注：原生 64 位支持\n\nSharePoint 2010 仅支持 64 位操作系统。考虑到这一点，我们还需要确保托管适配器\
  \ Web 服务的服务器上的 IIS 以 64 位原生模式运行。否则，在应用配置设置时可能会出现以下错误。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_326_0.png)\n\
  \n要启用 64 位原生模式，请以管理员身份从命令提示符运行以下命令：\n\n```\nC:\\inetpub\\AdminScripts>cscript adsutil.vbs\
  \ SET W3SVC/AppPools/Enable32bitAppOnWin64 0\nC:\\inetpub\\AdminScripts>%SYSTEMROOT%\\\
  Microsoft.NET\\Framework64\\v2.0.50727\\aspnet_regiis.exe -i\n```\n\n8. 一旦配置成功应用，我们可以导航到\
  \ Internet Information Services (IIS) 管理器，并发现已创建了一个名为 BTSharePointAdapterWS 的应用程序。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_326_1.png)\n\n9. 在此 IIS 应用程序中，存在一个名为\
  \ BTSharePointAdapterWS.asmx 的 Web 服务。这是 Windows SharePoint 适配器在与 SharePoint 服务通信时使用的\
  \ Web 服务。如果您尝试在 Web 浏览器中启动此 Web 服务，您将收到错误提示。此错误仅为显示错误，不会影响 BizTalk 与 SharePoint\
  \ 的交互。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_327_0.png)\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_327_1.png)\n\
  \n> 注：启用或禁用此错误消息其实是一种个人偏好。保留错误消息会给人一种服务有问题的印象。作为开发人员，我们通常喜欢浏览我们连接的服务。如果我们连接时收到错误消息，我们往往会认为出了问题。只要您正确完成剩余步骤，保留此错误消息启用不会影响与\
  \ SharePoint 的连接。\n\n10. 为了消除此错误消息，您需要修改与 BTSharePointAdapterWS.asmx Web 服务位于同一文件夹中的\
  \ Web.config 文件。\n\n```\n<webServices>\n    <protocols>\n        <!-- Commented\
  \ out line below to resolve bad request error-->\n        <!--remove name=\"Documentation\"\
  /-->\n    </protocols>\n</webServices>\n```\n\n\n\n11. 修改 web.config 文件后，我们可以刷新\
  \ Web 浏览器，即会看到服务操作。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_328_0.png)\n\n12.\
  \ BTSharePointAdapterWS.asmx Web 服务公开了四个 Web 方法：\n\n- FinalizeDocuments\n- GetDocuments\n\
  - IsAlive\n- PutDocuments\n\nWindows SharePoint Services 适配器在与 SharePoint 交互时会调用这些方法。这些\
  \ Web 服务的实现对 BizTalk 开发人员来说是抽象的，使得与 SharePoint 的集成成为一种良好的体验。\n\n每个 Web 方法都有其独特的目的，让我们进一步研究每个方法。\n\
  \n## FinalizeDocuments\n\n接收来自 SharePoint 的文档时，适配器的默认行为是从源位置删除文件。这种行为模仿了 FILE 和\
  \ FTP 适配器的行为，以防止无限循环和消息重复。如果某人已将消息或文档加载到 SharePoint 中，那么当 BizTalk 拾取时，他们很可能不希望完全丢失该消息。为避免这种情况，Microsoft\
  \ 在适配器中包含了一个名为 Archive Location URL 的属性。此功能将存储当前正在处理的副本，并将其放置到另一个文档或表单库中。Archive\
  \ Location URL 功能利用 FinalizeDocuments Web 方法来实现正在处理的消息归档。\n\n## GetDocuments\n\n\
  GetDocuments Web 方法由 Windows SharePoint Services 适配器在从 SharePoint 检索文档时使用。Windows\
  \ SharePoint Services 适配器本质上是一个轮询适配器。Polling Interval 属性将决定适配器应多频繁地连接到 SharePoint。适配器将在每次轮询期间调用此\
  \ Web 服务，如果存在文档，则将使用此 Web 服务检索它们。\n\n## IsAlive\n\nIsAlive Web 方法是一个简单的 ping Web\
  \ 服务，允许 BizTalk 确定 SharePoint 是否在线。\n\n## PutDocuments\n\n每当将文档上传到 SharePoint 时，Windows\
  \ SharePoint Services 适配器将利用此 Web 服务执行此操作。\n\n> Note: Multi-Node Deployments\n>\
  \ 如果您的组织拥有包含多个角色和服务器的 SharePoint 场，BizTalk 仍可支持此部署。只需在 SharePoint 场中的每个前端服务器上安装\
  \ Windows SharePoint Services 适配器 Web 服务。在提供 URL 作为适配器配置的一部分时，请确保使用前端加载这些请求的网络负载均衡器\
  \ NLB 的 URL。\n\n## Windows SharePoint Services Adapter configuration\n\n现在 Windows\
  \ SharePoint Services 适配器和适配器 Web 服务已安装，我们将进一步研究在与 SharePoint 集成时可使用的一些属性。\n\n##\
  \ Receive Adapter\n\n以下图像将进一步说明 SharePoint Services 接收适配器的配置。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_330_0.png)\n\
  \n## Adapter Web Service port\n\nIIS Web 应用程序的默认端口为 80。如果我们想在一台 IIS 服务器上运行多个网站，那么我们希望通过让\
  \ IIS 监听不同的端口来分隔这些网站。如果您选择这样做，则需要使用正确的端口值填充此属性。本书中的示例将使用端口 8080，因为为本书创建的 SharePoint\
  \ 站点正在端口 8080 上运行。在 BizTalk 和 SharePoint 服务在同一服务器上共同托管的情况下，我们很可能会遇到这种情况，尤其是在默认网站中安装了\
  \ BAM 门户时。如果是这种情况，则需要将 SharePoint 站点与默认站点分开，因此这些站点之一必须在非标准端口上运行。\n\n> Note: Another\
  \ option is to create another website that uses port 80 but also leverages host\
  \ headers. If we create a DNS alias for our server, we can then reference this alias\
  \ as a host header and have multiple sites listening on port 80. IIS will then look\
  \ at the http header when determining which site should be responsible for handling\
  \ the request. To learn more about host headers, please refer to the following link:\
  \ http://technet.microsoft.com/en-us/library/cc424952.aspx.\n\n## Archive File Location\
  \ URL\n\n从 SharePoint 检索文档时，它们将被从 SharePoint 中删除以防止无限循环。使用另一个文档或表单库的位置填充此属性以归档消息。如果配置的\
  \ Archive File Location 不可用或配置不正确，BizTalk 将尝试检索源文档。但是，BizTalk 在解决 Archive File Location\
  \ 问题之前不会处理文档。源文档将保留在 SharePoint 库中以防止消息丢失。\n\n## Batch Size\n\n由于接收适配器是轮询适配器，您可能希望限制\
  \ BizTalk 在单个批处理中从 SharePoint 检索的文档数量。\n\n## Namespaces Aliases\n\n如果我们计划使用 XPath\
  \ 来填充其他 SharePoint 列，例如 Archive Filename，我们需要提供我们期望的消息的命名空间。例如，我们可以使用 XPath 从消息正文中提取一个值，并将其用作我们正在归档的文件名称的一部分。\n\
  \n## Polling Interval\n\nBizTalk 连接到 SharePoint 以确定是否有待处理的可用消息供消费的时间间隔，以秒为单位。\n\n\
  ## SharePoint Site URL\n\nBizTalk 将连接到的 SharePoint 站点的基 URL。例如，如果我们创建了一个文档库，整个 URL\
  \ 为 http://localhost:8080/sites/BizTalkLineOfBusiness/Completed%20Forms/，那么我们将使用\
  \ http://localhost:8080/sites/BizTalkLineOfBusiness/ 填充 SharePoint Site URL，然后将\
  \ SharePoint Document Library URL 填充为 Completed%20Forms/。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_332_0.png)\n\
  \n> Note: Spaces and Special Characters\n> SharePoint 文档和表单库的名称中可能包含空格。与包含空格的任何其他\
  \ HTTP 地址一样，需要 URL 编码将空格转换为字符序列。此序列表示为 %20。在 BizTalk 配置内部，您可以指定一个空格，通过按空格键，或提供 %20。无论何时导出\
  \ BizTalk 绑定文件，您都会发现空格始终表示为 %20。\n\n## View Name\n\n与 FILE 适配器不同，Windows SharePoint\
  \ Services 适配器不支持文件掩码。默认情况下，BizTalk 在连接时会从文档或表单库中检索所有文档。为了避免这种情况，我们可以提供一个视图名称，BizTalk\
  \ 将仅检索符合该视图条件的记录。例如，假设我们在 SharePoint 中实现了办公用品审批流程。员工可能会填写 InfoPath 表单并将其保存到 SharePoint\
  \ 表单库。由于此采购需要员工主管批准，因此我们不希望 BizTalk 在获得批准之前拾取此办公用品请求。我们可以在 SharePoint 中构建一个视图，它仅显示已批准的办公用品请求。然后让\
  \ BizTalk 连接到此视图以检索这些已批准的请求。这允许员工和主管在同一表单库中工作，但 BizTalk 仅检索已批准的表单。\n\n## Send Adapter\n\
  \n现在，我们将进一步探索 SharePoint Services 发送适配器的配置。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_333_0.png)\n\
  \n## Adapter Web Service Port\n\n我们 Windows SharePoint Services 适配器 Web 服务已部署的 Web\
  \ 应用程序的端口。\n\n## SharePoint Site URL\n\n您想要连接到的 SharePoint 站点的基 URL。例如，如果我们创建了一个文档库，整个\
  \ URL 为 http://localhost:8080/sites/BizTalkLineOfBusiness/Completed%20Forms/，那么我们将使用\
  \ http://localhost:8080/sites/BizTalkLineOfBusiness/ 填充 SharePoint Site URL，然后将\
  \ SharePoint Document Library URL 填充为 Completed%20Forms/。\n\n## Namespaces Aliases\n\
  \n如果我们计划使用 XPath 来填充其他 SharePoint 列，例如文件名，我们需要提供我们期望的消息的命名空间。例如，我们可以使用 XPath 从消息正文中提取一个值，并将其用作我们正在归档的文件名称的一部分。我们也可以使用此信息填充\
  \ SharePoint 列。\n\n\n\n\n## Microsoft Office 集成\n\nSharePoint 与 BizTalk 集成的关键增值之一是可从\
  \ InfoPath 利用的功能。例如，我们可以创建 SharePoint 列，然后使用 InfoPath 字段中的数据或已填充到 BizTalk 适配器上下文属性中的数据来填充这些列。启用此属性将允许启用\
  \ InfoPath 预处理指令。这些预处理指令还允许已存放在 SharePoint 中的 XML 消息与表单关联。当您单击启动已存放在的 XML 消息时，SharePoint\
  \ 将找到其相关模板并启动表单，其中嵌入了 XML 数据。需要注意的是，在 BizTalk 处理此类消息时，它无法看到表单模板标记。它严格处理底层 XML 表单数据，并且实际上不会接收表单模板标记。\n\
  \n## 模板文档库\n\n当 XML 消息已发送到 SharePoint 库，并且我们希望将其与特定的 InfoPath 表单关联时，我们可以填充此属性，以便\
  \ SharePoint 知道在哪里找到匹配的表单模板。\n\n## 模板命名空间列\n\n这是存储 InfoPath 解决方案命名空间的 SharePoint\
  \ 列的名称。\n\n## SharePoint 列\n\nWindows SharePoint Services 适配器公开的属性在填充后将被插入到 SharePoint\
  \ 库中对应的列中。例如，如果我们有一个审批者场景，我们可以在 SharePoint 库中创建一列，当 BizTalk 将消息插入此库时，它可以从消息正文或从发送端口配置中获取数据，并将该数据插入\
  \ SharePoint 列中。列上下文属性的工作方式类似于键/值对。我们需要在“Column XX”属性中插入列的名称，然后在“Column XX Value”属性中插入相关值。可填充的列数上限为\
  \ 16。\n\n## 其他注意事项\n\n## 上下文属性\n\n与其他适配器类似，Windows SharePoint Services 适配器上下文属性在编排中也可用。在构建动态发送端口方案时，这变得非常有用。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_335_0.png)\n\n## Windows SharePoint Services\
  \ 适配器是一个单向适配器\n\n在配置使用 Windows SharePoint Services 适配器的接收位置或发送端口时，我们可以使用单向接收位置或单向发送端口。此场景有趣之处在于，我们知道适配器利用的是双向\
  \ Web 服务。这并不意味着 BizTalk 会对 SharePoint 不可用时发生的任何故障或诸如安全故障之类的其他运行时问题毫不知情。这些错误仍会被 BizTalk\
  \ 捕获并报告。但是，如果您查看 BizTalk 管理控制台中的跟踪服务实例，您将只为每次与 SharePoint 的连接找到一条记录。\n\n再次，Microsoft\
  \ 为我们抽象了调用 Web 服务所涉及的大量复杂性。Microsoft 架构的另一个好处是，使用 Windows SharePoint Services 适配器时，我们的编排中不需要\
  \ SharePoint 代理类。这为我们的解决方案提供了松耦合设计。如果我们有目前利用 FILE 适配器的项目，我们可以轻松更改接收位置或发送端口以使用 Windows\
  \ SharePoint Services 适配器，而无需重新编译我们的解决方案。我们只需在 BizTalk 管理控制台中更改适配器类型即可。\n\n## 从\
  \ SharePoint 接收文档\n\n我们要构建的场景是一个使用 InfoPath、BizTalk 和 SharePoint 2010 Foundation\
  \ 的假期申请审批系统。员工将填写表单并将其提交到 SharePoint 中的表单库，以便员工的主管进行审批。一旦假期获得批准，BizTalk 将使用此表单、对其进行归档，然后使用\
  \ FILE 适配器将已批准的假期申请传递给 ERP 系统。ERP 系统要求此信息以逗号分隔值 (CSV) 文件的形式提供。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_336_0.png)\n\
  \n> 注意：本章中的示例假定您已拥有现有的 SharePoint 站点。以下链接描述了如何为 WSS 3.0 SP2 和 SharePoint 2010 Foundation\
  \ 创建 SharePoint 站点：\n> \n> WSS 3.0 SP2:\n> http://technet.microsoft.com/en-us/library/cc288969(office.12).aspx\n\
  > \n> SharePoint 2010 Foundation:\n> http://technet.microsoft.com/en-us/library/cc263094.aspx\n\
  \n此解决方案的基础是一个名为 `InfoPath_Vacation_Approval.xsd` 的架构。我们将在 BizTalk 解决方案中使用此架构作为消息类型，但我们也将使用此架构来构建\
  \ InfoPath 表单。最终结果是，当审批表单提交到 SharePoint 并被 BizTalk 拾取时，我们将在 BizTalk 中获得一个强类型消息。\n\
  \n此架构是本书源代码中 Chapter7-ReceivingDocuments 解决方案的一部分。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_337_0.png)\n\
  \n## 构建 InfoPath 表单和 SharePoint 表单库\n\n为了基于此架构设计表单，我们需要打开 Microsoft InfoPath Designer。此示例将使用\
  \ InfoPath 2010，但此解决方案也应与 InfoPath 产品的前一版本一起使用：\n\n- 1. 双击“高级表单模板”中的 XML 或架构。\n\n\
  ![](img/23d1402649b6528b085cd6b900a2c9c3_337_1.png)\n\n- 2. 浏览到 **InfoPath_Vacation_Approval.xsd**\
  \ 架构的位置并单击 **Next** 按钮。\n- 3. 当提示是否要向主数据源添加另一个 XML 架构或 XML 文档时，选择 **No**，然后单击 **Finish**\
  \ 按钮。\n- 4. 在以下屏幕截图的右侧，我们会注意到在我们的 XSD 架构中创建的字段和节点现在可用于插入到我们的 InfoPath 表单中：\n- 5.\
  \ 我们现在有机会设计表单以符合组织可能拥有的任何外观和感觉或设计标准。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_338_0.png)\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_339_0.png)\n\n- 6. 完成表单设计后，我们希望将表单发布到\
  \ SharePoint 表单库。为此，单击 文件 – 发布 – SharePoint Server。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_339_1.png)\n\
  \n- 7. 提供您希望部署此表单的 SharePoint 站点的 URL，然后单击 Next 按钮。\n- 8. 对于此示例，我们希望选择将此表单发布到 **Form\
  \ Library**，然后单击 **Next** 按钮。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_340_0.png)\n\
  \n- 9. 我们现在希望 **Create a new form library**，然后单击 **Next** 按钮。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_340_1.png)\n\
  \n- 10. 为此新表单库提供名称，例如 **Vacation Approval**，然后单击 **Next** 按钮。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_340_2.png)\n\
  \n- 11. 指定 **Employee Name**、**Supervisor** 和 **Approval Status** 作为我们希望在表单库中显示的字段。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_341_0.png)\n\n- 12. 发布并验证我们的表单库是否成功部署。请注意，我们应该在库下看到\
  \ **Vacation Approval** 链接，并且应该在浏览器右上角看到 **Employee Name**、**Supervisor** 和 **Approval\
  \ Status** 列。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_341_1.png)\n\n- 13. 单击\
  \ **Add document** 链接。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_341_2.png)\n\n\
  - 14. 我们之前设计的表单将被启动。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_342_0.png)\n\n\
  - 15. 我们现在需要返回表单并修改员工完成表单后表单应提交到的位置。提交表单到 SharePoint 库时，我们有几个选项：\n  - 使用 InfoPath\
  \ 客户端自带的 **Submit Form** 按钮\n  - 向表单添加按钮控件，然后将 **Submit Form** 操作附加到该按钮\n\n- 16.\
  \ 我们现在将通过单击 **File -Info - Submit Options -To SharePoint Library** 通过 InfoPath 客户端添加提交表单功能。这使我们能够利用开箱即用的功能，而无需任何额外的配置或脚本。\n\
  \n\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_343_0.png)\n\n17. 我们需要提供表单库的 URL\
  \ 以及表单提交时将使用的表单名称。最好使用宏并利用表单中的唯一数据来避免重复的文件名。填充这些文本框后，单击“下一步”按钮继续。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_343_1.png)\n\
  \n18. 为此数据连接提供一个名称，以描述正在提交的数据类型，然后单击“完成”按钮。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_343_2.png)\n\
  \n19. 如果自我们最初发布表单以来表单位置未发生变化，我们可以选择快速发布将此最新版本的表单上传到 SharePoint。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_344_0.png)\n\
  \n20. 当我们通过单击“添加文档”链接启动新表单时，我们现在将有提交表单的选项。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_344_1.png)\n\
  \n21. 提交后，我们会看到 InfoPath 表单已添加到表单库中，并且元数据已填充到 SharePoint 列中。\n\n## 创建 SharePoint\
  \ 视图\n\n此时，我们可以配置 BizTalk 从此表单库消费消息，但休假申请尚未获批。我们只想消费已获批准的 InfoPath 表单。\n\n- 1. 为了实现此要求，我们需要在此表单库中创建一个视图，然后配置\
  \ BizTalk 仅检索满足该视图要求的文档。\n- 2. 要创建视图，请从“库工具”菜单中选择“库”，然后单击“创建视图”。\n- 3. 选择标准视图。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_345_0.png)\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_345_1.png)\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_345_2.png)\n\n4. 提供适当的视图名称，例如 Approved\
  \ Vacation Requests，然后单击“确定”按钮。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_346_0.png)\n\
  \n5. 现在，滚动到筛选器部分。我们只想显示审批状态等于“已批准”的表单。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_346_1.png)\n\
  \n6. 在名为“所有文档”的默认视图中，我们可以看到所有文档，无论其审批状态如何。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_346_2.png)\n\
  \n7. 如果我们将视图更改为 **Approved Vacation Requests**，我们将找不到任何列出的文档，因为没有休假申请已被批准。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_347_0.png)\n\
  \n## 创建 SharePoint 归档库\n\nBizTalk 可以利用这些允许文档处于各种状态的相同视图。如果我们在接收位置配置中提供一个视图，BizTalk\
  \ 将只检索满足该视图条件的文档。\n\n我们还希望确保我们拥有成功休假申请的归档副本。为此，我们将创建另一个名为 **Archived Vacation Requests**\
  \ 的表单库。\n\n- 1. 在 SharePoint 站点中单击 **Libraries** 链接。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_347_1.png)\n\
  \n2. 单击 **Create** 链接。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_348_0.png)\n\n\
  3. 选择 **Form Library**，提供表单库名称，例如 **Archived Vacation Requests**，然后单击 **Create**。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_348_1.png)\n\n4. 我们现在有一个名为 **Archived\
  \ Vacation Requests** 的表单库。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_348_2.png)\n\
  \n5. 现在，每当 BizTalk 拾取已批准的休假申请时，它将在此表单库中制作表单的归档副本。截至目前，我们已执行以下操作：\n\n- 设计了一个可用于设计\
  \ InfoPath 表单的架构\n- 设计了 InfoPath 表单\n- 创建了表单库\n- 发布了 InfoPath 表单并创建了自定义列\n- 更新表单以提交到我们的表单库\n\
  \n## 构建应用程序\n\n我们现在将重点关注此解决方案的 BizTalk 部分。一旦获批，此休假申请信息需要提交到组织的 HR 系统，该系统是一个 ERP\
  \ 系统。此 ERP 系统期望的平面文件类似于下面的文件。\n\n1. 此文件的副本可在本章源代码的 FlatFile 文件夹中找到。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_349_0.png)\n\
  \n2. 我们现在需要一个能够为我们的 ERP 系统组装平面文件的平面文件架构。解决方案中包含一个名为 ERP_Vacation_Approval_FF.xsd\
  \ 的平面文件架构。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_349_1.png)\n\n3. 如果没有管道来组装，在我们的例子中，或将消息从\
  \ XML 格式拆分为平面文件格式，反之亦然，平面文件架构并无多大价值。在我们的解决方案中，存在一个名为 `SendVacationApproval.btp`\
  \ 的发送管道，用于获取 BizTalk 内部创建的 XML 消息并组装供 ERP 系统消费的平面文件。此架构中的 **Document Schema** 属性被分配给我们之前创建的平面文件架构\
  \ `ERP_Vacation_Approval_FF.xsd`。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_350_0.png)\n\
  \n4. 现在我们已经创建了源（InfoPath）和目标（ERP）架构，我们想要创建一个映射来执行这两个消息之间的转换。我们解决方案中此映射的名称为 `InfoPathVacationRequests_to_ERPVacationRequests.btm`。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_350_1.png)\n\n5. 将所有这些组件整合在一起的 BizTalk\
  \ 工件是一个名为 `processVacationRequests.odx` 的编排。在此编排中，我们将找到以下功能：\n\n- 接收 XML InfoPath\
  \ 消息\n- 将 InfoPath 消息转换为 ERP 消息\n- 将 ERP 消息发送到 ERP 系统\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_351_0.png)\n\
  \n6. 我们现在需要通过右键单击解决方案名称并单击“部署解决方案”来部署我们的解决方案。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_351_1.png)\n\
  \n7. 当我们启动 BizTalk Server 管理控制台时，我们会发现已创建了一个名为 **Chapter7-ReceivingDocuments** 的应用程序。我们现在将逐步介绍\
  \ **Receive Locations**、**Orchestrations** 和 **Send Ports** 的各种配置设置。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_352_0.png)\n\
  \n> Note: 你可以在本章源代码中找到的 `Bindings` 文件夹中找到解决方案绑定文件的副本。请注意，绑定文件包含对用于演示本章功能的 8080 端口的引用。如果你的\
  \ SharePoint 服务器使用不同的端口，你需要更新配置。\n\n8. 在接收位置节点中，我们将找到一个名为 `ReceiveInfoPathVacationRequest`\
  \ 的接收位置。此接收位置将使用 Windows SharePoint Services 适配器，使用默认的 **BizTalkServerApplication**\
  \ 主机，以及 **XMLReceive** 管道。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_352_1.png)\n\
  \n9. 通过单击“配置”按钮，我们可以进一步探索接收位置的配置。\n\n下面是描述重要适配器属性的表格：\n\n| 属性 | 值 | 注释 |\n|---|---|---|\n\
  | 适配器 Web 服务端口 | 8080 | 在用于构建此解决方案的服务器上，SharePoint 站点创建在 8080 端口，因为该服务器还安装了 BAM\
  \ 门户。如果您将 SharePoint 安装为默认网站，则您的端口将为 80。 |\n| 超时 | 100000 | 适配器在超时之前的时间，以毫秒为单位。\
  \ |\n| 归档文件名 | %XPATH=//ns0:VacationApproval_InfoPath/EmployeeName%-%XPATH=//ns0:VacationApproval_InfoPath/DateSubmitted%.xml\
  \ | 我们可以使用接收到的消息中的值来确定将放置在归档中的文件的名称。在这里，我们使用员工姓名和员工提交表单的日期。 |\n| 归档位置 URL | Archived%20Vacation%20Requests\
  \ | 这是存储已归档休假申请的库。 |\n| 命名空间别名 | ns0=\"http://Chapter7_ReceivingDocuments.InfoPath_Vacation_Approval\"\
  \ | 这是构建 InfoPath 表单时使用的 InfoPath_Vacation_Approval.xsd 架构的命名空间。 |\n| 轮询间隔 | 60\
  \ | BizTalk 连接到 SharePoint 库以检查是否有新的休假申请获批的时间间隔，以秒为单位。 |\n| SharePoint 站点 URL |\
  \ http://win2k8r2:8080/sites/BizTalkLineOfBusiness/ | 用于托管创建和存储休假申请的表单库的 SharePoint\
  \ 站点的位置。 |\n| 源文档库 | Vacation Approval | 我们创建和存储休假申请的表单库的名称。 |\n| 视图名称 | Approved\
  \ Vacation Requests | BizTalk 将用于确定哪些表单可以被消费的视图的名称。 |\n\n\n\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_354_0.png)\n\
  \n注：用于连接 SharePoint 的接收位置的 BizTalk 主机实例用户需要对文档或表单库具有“参与者”访问权限。有关 SharePoint 权限的更多信息，请参阅以下链接：http://technet.microsoft.com/en-us/library/cc721640.aspx\n\
  \n10. 我们的发送端口将利用 FILE 适配器将已批准的平面文件休假请求传递到 ERP 系统能够从中消费的文件 drop 中。由于 ERP 系统期望的是平面文件，因此我们需要确保正在使用自定义发送管道。我们想要使用的管道是\
  \ Send Vacation Approval。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_355_0.png)\n\
  \n11. processVacationRequests 编排的配置非常简单：\n\n- 我们有一个接收端口用于从 SharePoint 接收 InfoPath\
  \ 表单\n- 一个发送端口，我们将使用它将已批准的休假请求发送到 ERP 系统\n- 我们将使用的主机是 BizTalkServerApplication。在尝试执行示例应用程序之前，请记住重新启动此主机实例。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_355_1.png)\n\n## 测试应用程序\n\n此时，我们已准备好验证我们的解决方案。要测试我们的解决方案，我们需要执行以下操作：\n\
  \n1. 导航到您的 SharePoint 文档库并选择 **添加文档**。\n2. 填写 InfoPath 表单并单击 **提交** 按钮。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_356_0.png)\n\
  \n3. 您现在应该在表单库中有一个文档，其审批状态为 **待处理。**\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_356_1.png)\n\
  \n4. 打开此现有表单，将 **审批状态** 设置为 **已批准**，然后单击 **提交** 按钮。\n\n5. 我们将片刻看到 InfoPath 的审批状态已更改为已批准。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_357_0.png)\n\n6. 由于审批状态已更改为已批准，BizTalk\
  \ 现在将消费此消息并将其写入我们的文件夹位置。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_357_1.png)\n\
  \n7. 如果我们打开文件，将会发现它与 ERP 系统期望的格式相匹配。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_357_2.png)\n\
  \n## 向 SharePoint 发送文档\n\n在此场景中，我们有一个工作订单管理系统，员工使用它来管理石油和天然气公司的作业或任务。该组织的法律要求是他们必须记录员工在现场发生的任何安全事故。员工将使用此工作订单管理系统来更新其作业的状态，但也会记录任何现场事故。在工作订单管理系统中捕获此信息的问题在于它专为现场设计，不利于可能需要跟踪这些事故以确保监管合规性的办公室员工。\n\
  \n解决此问题的方法是允许现场工作人员在工作订单管理系统中输入事故数据，但将此信息输入 SharePoint，以便办公室员工可以跟踪。工作订单管理系统将输出一个\
  \ XML 文件，我们将将其加载到 SharePoint 表单库中。\n\n由于我们不希望办公室员工查看 XML 文档，我们将把此信息加载到 InfoPath\
  \ 表单中，这将为我们的办公室员工提供良好的用户界面。\n\n将此信息放在 SharePoint 中的另一个好处是我们可以应用信息策略，该策略将设置文档的过期日期，并在文档日期超过文档到期日期时自动将其清除。\n\
  \n## 创建 SharePoint 表单库\n\n在“接收文档”演练中，我们让 InfoPath 客户端为我们创建了一个表单库。这次我们将手动创建内容类型、表单库和\
  \ SharePoint 列。内容类型是我们可以用作内容基础的模板。它允许我们在 SharePoint 库中设置默认文档类型，因此如果我们想从 SharePoint\
  \ 功能区创建新文档，默认情况下它将是我们基于内容类型创建的类型。\n\n1. 在创建内容类型之前，我们需要创建一个 InfoPath 表单，以便我们可以基于它创建内容类型。我们将再次从\
  \ XSD 架构开始。在这种特殊情况下，我们将使用的架构名称是 **WorkOrderManagementIncident_InfoPath.xsd**，可在\
  \ Chapter7-SendingDocuments 解决方案中找到。\n\n2. 然后我们希望基于 **WorkOrderManagementIncident_InfoPath**\
  \ 架构设计一个 InfoPath 表单，就像我们在本章“从 SharePoint 接收文档”部分中所做的那样。不同之处在于，我们不会将此表单发布到 SharePoint，也不会将表单提交到\
  \ SharePoint，因为我们基本上将 InfoPath 用作这些文档的查看器，并且不会修改它们。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_359_0.png)\n\
  \n3. 现在我们需要创建内容类型并将此 InfoPath 表单与其关联。为此，请单击“网站操作”下拉菜单，然后单击“网站设置”。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_360_0.png)\n\
  \n4. 现在，我们需要从“图库”分组中单击“网站内容类型”。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_360_1.png)\n\
  \n5. 单击“创建”按钮。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_360_2.png)\n\n6. 提供 **名称**、**父内容类型**，然后选择此网站内容应所属的组。在这种情况下，我们应使用\
  \ **自定义内容类型。**\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_361_0.png)\n\n7. 正如我们在本章“接收文档”示例中所看到的，SharePoint\
  \ 列成为将元数据关联到 SharePoint 中文档的有价值工具。通过填充 SharePoint 列，我们现在可以根据列中包含的信息进行搜索、排序并创建视图。\n\
  \n- 我们现在将列关联到我们的特定内容类型，以便当我们将内容类型添加到文档库时，这些列将可供我们使用 Windows SharePoint Services\
  \ 适配器填充。单击 **从新建网站列添加** 链接。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_361_1.png)\n\
  \n8. 我们现在将继续使用以下数据为 **事故日期**、**事故城市** 和 **事故工厂** 创建列。否则，我们将使用默认值。\n\n| 列名称 | 数据类型\
  \ | 最大字符数 |\n|---|---|---|\n| 事故日期 | 日期和时间 | N/A |\n| 事故城市 | 单行文本 | 50 |\n| 事故工厂\
  \ | 单行文本 | 10 |\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_362_0.png)\n\n9. 完成内容类型后，它应如下图所示：\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_363_0.png)\n\n10. 现在我们需要将特定的 InfoPath\
  \ 表单与此内容类型关联。单击“高级设置”以启动负责此功能的向导。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_363_1.png)\n\
  \n11. 浏览到表单的位置并选择它。另请确保内容类型未设置为只读。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_363_2.png)\n\
  \n12. 此时，我们已准备好创建新的表单库，然后将此内容类型与我们新创建的文档库关联。要创建新的文档库，请单击 **网站操作**，然后单击 **更多选项**。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_364_0.png)\n\n13. 选择 **表单库**，然后提供名称并单击\
  \ **创建** 按钮。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_364_1.png)\n\n14. 我们还希望为表单库设置默认模板。我们需要修改默认模板设置，可以通过单击\
  \ **库设置** 来完成。\n\n\n\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_365_0.png)\n\n\
  15. 进入表单库设置页面后，单击“高级设置”链接。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_365_1.png)\n\
  \n16. 在此屏幕中，我们需要设置模板 URL。通过设置文档模板，当 BizTalk 将文档加载到此表单库中时，SharePoint 将自动尝试将上传的文件与此模板关联。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_365_2.png)\n\n> 注：我们不需要提供文档模板的完整路径。我们只需要提供基本站点之后的路径。\n\
  > 例如，我们站点的基 URL 为：\n> 因此，对于文档模板的位置，我们只需要提供文件夹的名称和模板的名称。\n\n```\nhttp://win2k8r2:8080/sites/BizTalkLineOfBusiness/\n\
  ```\n\n```\nField Incident Forms/Forms/FieldIncidentType/\nChapter7-WorkOrderManagement_Incident.xsn\n\
  ```\n\n17. 如果我们想要浏览 SharePoint 库使用的文件系统，请单击“库”，然后单击“连接并导出”。这将启动 Windows 资源管理器，并带我们进入存储文档库文件的文件夹。为了更方便，请确保在\
  \ Windows 资源管理器中可以看到隐藏文件和文件夹，以便查看 Forms 文件夹。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_366_0.png)\n\
  \n18. 如果我们导航到表单库并单击“新建文档”按钮，我们的现场事故模板现在将默认启动。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_366_1.png)\n\
  \n19. 现在我们需要添加之前创建的 FieldIncidentType 中的列。我们可以通过从表单库设置页面单击“从现有站点列添加”链接来完成此操作。\n\n\
  ![](img/23d1402649b6528b085cd6b900a2c9c3_367_0.png)\n\n20. 从“从以下位置选择站点列：”下拉列表中选择“自定义列”，然后将\
  \ Incident City、Incident Date 和 Incident Plant 添加到“要添加的列：”组合框中，然后单击“确定”按钮。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_367_1.png)\n\
  \n21. 现在我们将在表单库中看到这些列的显示。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_367_2.png)\n\
  \n22. 到目前为止，我们已执行以下操作：\n- 设计了一个可用于设计 InfoPath 表单的架构\n- 设计了一个 InfoPath 表单\n- 创建了一个内容类型\n\
  - 创建了一个表单库\n- 为表单库设置了模板\n- 修改表单库的视图以包含我们在内容类型中指定的自定义列\n\n## 构建 BizTalk 应用程序\n\n\
  SharePoint 配置完成后，我们现在需要专注于解决方案的 BizTalk 部分。作为 BizTalk 解决方案的一部分，我们需要执行以下步骤：\n- 为我们将从工作订单管理系统接收的消息建立架构\n\
  - 创建映射以将此工作订单管理数据转换为 InfoPath 架构类型数据\n- 设置 Windows SharePoint Services 适配器上下文属性，以便保留原始文件名的名称\n\
  - 将消息发送到 SharePoint 并配置 Windows SharePoint Services 适配器，以便我们可以填充之前配置的内容类型列\n\n1.\
  \ 工作订单管理系统使用的文件的消息结构与 InfoPath 架构的结构非常相似。不同之处在于工作订单管理系统使用属性而不是元素。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_369_0.png)\n\
  \n2. 我们将使用的映射非常简单，因为架构结构非常相似。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_369_1.png)\n\
  \n3. 一旦我们将传入的工作订单管理消息转换为 InfoPath 消息，我们需要在消息分配形状中修改 InfoPath 消息。此消息分配形状的目的是检索传入消息的名称，以便在发布到\
  \ SharePoint 后我们可以保留文件的名称。默认情况下，如果您未提供静态或动态文件名，SharePoint 适配器将使用 GUID 作为文件名。\n\n\
  ![](img/23d1402649b6528b085cd6b900a2c9c3_370_0.png)\n\n> 注：BizTalk 2010 的新功能是长期以来许多开发人员希望清单上的一个功能：可扩展的表达式编辑器！我从来不明白为什么我们被限制在固定窗口中工作，但很高兴看到此功能终于被添加了。\n\
  \n4. 在此示例中，我们已从编排中操作了适配器上下文属性。我们也可以从自定义管道组件中访问这些属性。这允许仅消息解决方案也利用 Windows SharePoint\
  \ Services 适配器提供的强大功能。有关操作 SharePoint 适配器上下文属性的完整功能演练，请参阅 Kent Weare 的博客文章：http://kentweare.blogspot.com/2010/01/sharetalk-integration-sharepointbiztalk_16.html\n\
  - 总体而言，我们的编排非常简单。我们接收消息，对其进行转换，更新以设置适配器上下文属性，然后将其发送到 SharePoint。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_371_0.png)\n\
  \n5. 我们现在可以通过右键单击解决方案名称并单击 **Deploy Solution** 来部署应用程序。\n\n6. 在 BizTalk 管理控制台中，我们现在应该看到一个名为\
  \ Chapter7-SendingDocuments 的应用程序。我们现在需要一个接收位置来从工作订单管理系统获取文件。此接收位置的名称为 **ReceiveXMLIncident**。它将使用\
  \ **FILE** 适配器、**BizTalkServerApplication** 接收处理程序和 **XMLReceive** 接收管道。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_371_1.png)\n\
  \n7. 发送端口的配置比应用程序的其他部分更有趣。发送端口将利用 Windows SharePoint Services 适配器，通过利用 BizTalkServerApplication\
  \ 主机实例和 PassThruTransmit 发送管道。\n\n8. 如果我们单击 **Configure** 按钮，我们可以进一步探索适配器的配置设置。\n\
  \n9. 我们的 `processFieldIncidents.odx` 的配置非常简单。我们有一个接收端口，将从中接收现场事故，以及一个发送端口，将用于将 InfoPath\
  \ 消息发送到 SharePoint。我们再次使用默认主机实例 **BizTalkServerApplication.**\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_372_0.png)\n\
  \n| 属性 | 值 | 注释 |\n|---|---|---|\n| 适配器 Web 服务端口 | 8080 | 在用于构建此解决方案的服务器上，SharePoint\
  \ 站点是在端口 8080 上创建的，因为该服务器还安装了 BAM 门户。如果您将 SharePoint 安装为默认网站，则您的端口将为 80。 |\n| 目标文件夹\
  \ URL | Field Incident Forms | 我们将把这些 InfoPath 文档存放在此处的表单库。 |\n| 命名空间别名 | ns0=\"\
  http://Chapter7_SendingDocuments.WorkOrderManagementIncident_InfoPath\" | 这是构建 InfoPath\
  \ 表单时使用的 `WorkOrderManagementIncident_InfoPath.xsd` 架构的命名空间。 |\n| SharePoint 站点\
  \ URL | http://localhost:8080/sites/BizTalkLineOfBusiness/ | 用于托管创建和存储现场事故表单的表单库的\
  \ SharePoint 站点的位置。 |\n| Microsoft Office 集成 | Yes (InfoPath Form Library) | 这指示\
  \ SharePoint 尝试使用 InfoPath 模板加载此文档。 |\n| 列 01 | Incident City | 我们在建立 FieldIncidentType\
  \ 内容类型时创建的 SharePoint 列的名称。 |\n| 列 01 值 | %XPATH=//ns0:WOMIncident_InfoPath/Location/City%\
  \ | 这是一个 XPath 表达式，将从我们的消息有效负载中检索事故的城市。 |\n| 列 02 | Incident Plant | 我们在建立 FieldIncidentType\
  \ 内容类型时创建的 SharePoint 列的名称。 |\n| 列 02 值 | %XPATH=//ns0:WOMIncident_InfoPath/Location/Plant%\
  \ | 这是一个 XPath 表达式，将从我们的消息有效负载中检索事故的工厂。 |\n| 列 03 | Incident Date | 我们在建立 FieldIncidentType\
  \ 内容类型时创建的 SharePoint 列的名称。 |\n| 列 03 值 | %XPATH=//ns0:WOMIncident_InfoPath/IncidentDate%\
  \ | 这是一个 XPath 表达式，将从我们的消息有效负载中检索事故的日期。 |\n\n\n\n\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_374_0.png)\n\
  \n注意：连接到 SharePoint 的发送端口的 BizTalk 主机实例用户需要对文档或表单库具有“Contributor”访问权限。\n\n## 测试应用程序\n\
  \n配置好我们的应用程序后，现在可以启动它并执行测试以确保其正常工作。\n\n- 1. 我们希望在接收位置的文件夹中放置一条与下面类似的消息。此消息的示例可在本章源代码的\
  \ Chapter7-SendingDocuments\\FileDrop\\ 文件夹中找到。\n\n```\n<ns0:WOMIncident_XML INCIDENT_DATE=\"\
  2010-10-10\"\n  xmlns:ns0=\"http://Chapter7_SendingDocuments.WorkOrderManagementIncident_InfoPath\"\
  >\n  <Location CITY=\"Regina\" PROVINCE=\"Saskatchewan\" PLANT=\"2135\"\n  SERVICE_POINT=\"\
  23\" />\n  <Personnel>\n  <PERSON NAME=\"Kurt Weare\" ID=\"9999\" POSITION=\"Area\
  \ Foreman\"\n  EMP_OR_CONTR=\"Employee\" />\n  </Personnel>\n  <VEHICLE VEHICLE_ID=\"\
  1400\" DAMAGE=\"Front End Damage to Truck\" />\n  <ENVIRONMENT IS_OIL_SPILL=\"false\"\
  \ IS_ENV_HAZARD=\"false\"\n  IS_WILD_LIFE_IMPACT=\"true\">\n  <COMMENTS>While travelling\
  \ back from Oilfield install, a moose ran into the road\n  and I couldn't stop in\
  \ time to avoid him. Extensive damage to the front end of\n  the truck has occurred.</COMMENTS>\n\
  \  </ENVIRONMENT>\n</ns0:WOMIncident_XML>\n```\n\n- 2. BizTalk 应拾取此文件，将其转换为 InfoPath\
  \ 所期望的格式，并发送到 SharePoint。在此过程中，BizTalk 还应使用消息负载中的数据填充 SharePoint 列。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_375_0.png)\n\
  \n- 3. 请注意，在 Type 列中包含一个 InfoPath 图标。这意味着 SharePoint 已确定该文档中的数据与可在该表单库中找到的 InfoPath\
  \ 模板相匹配。使此演示有趣的是，在 BizTalk 中我们并未指定 InfoPath 模板名称。事实上 BizTalk 并不知晓此数据与模板匹配，因为我们无需提供任何像在\
  \ BizTalk 2006 中那样必须提供的处理指令。为了验证这一点，请打开此发送端口的跟踪消息正文功能并查看消息的内容。您在任何地方都找不到表明此数据属于\
  \ InfoPath 模板的迹象。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_375_1.png)\n\n- 4.\
  \ 当我们单击此文档的链接时，我们还会发现 InfoPath 客户端已加载，并且我们的 XML 消息已加载到我们的 InfoPath 模板中。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_376_0.png)\n\
  \n## 摘要\n\n在本章中，我们看到了两个示例，展示了 InfoPath、SharePoint 和 BizTalk 之间紧密的集成。在第一个场景中，我们接收来自现场员工的工时表请求，并仅将已批准的请求发送到我们的工资系统。在第二个场景中，我们演示了工作订单管理系统输出的现场事件被加载到\
  \ SharePoint 中。这些场景展示了紧密的集成，使我们能够构建引人注目的解决方案。这使我们作为 BizTalk 开发人员能够快速构建在业务内部具有高度可见性的稳健解决方案。\n\
  \n我们还能够将 SharePoint 扩展到企业中，并将企业带入 SharePoint，这使 IT 能够利用之前的投资。SharePoint 不再是数据被创建并变得陈旧的孤岛。借助\
  \ BizTalk 及其适配器套件，我们可以将 SharePoint 功能扩展到 BizTalk 能够通信的任何系统。\n\nWindows SharePoint\
  \ Services 适配器与 Windows SharePoint Services 适配器 Web 服务的组合在集成文档和表单库时提供了全面的解决方案。然而存在一个限制，即\
  \ Windows SharePoint 适配器只能与文档和表单库集成。如果我们想与 SharePoint 的其他功能（如列表）通信，则无法使用适配器进行操作。不要担心，与列表通信时确实存在其他选项，它们将在下一章中讨论。\n"
- "## 8 与 SharePoint 集成\n\n### 与 SharePoint 集成\n2010 Web 服务\n\n在第 7 章中，发送和接收演练均演示了使用\
  \ Windows SharePoint Services（WSS）适配器与 SharePoint 的集成。这些演示真正突出了 SharePoint 的优势，包括在最终用户熟悉的环境中进行表单管理和协作：Microsoft\
  \ Office。\n\nWindows SharePoint Services 适配器的问题在于它非常以文档和表单库为中心。适配器在与这些库交互时非常出色，但我们不可避免地会被问到\
  \ BizTalk 是否可以操作自定义 SharePoint 列表。对此问题的回答是肯定的，也是否定的。适配器本身不支持操作自定义列表，但由于 SharePoint\
  \ 将操作列表的功能作为服务公开，因此 BizTalk 可以通过该机制与 SharePoint 集成。\n\n在本章中，我们将介绍：\n\n- SharePoint\
  \ 列表概述\n- SharePoint 的列表 Web 服务\n- 消费 SharePoint 列表场景演练\n- 创建自定义 SharePoint 列表\n\
  - 自定义列表 GUID\n- 构建 BizTalk 应用程序\n- 部署和配置 BizTalk 应用程序\n- 测试 BizTalk 应用程序\n- 与 SharePoint\
  \ 集成的其他方式\n\n## SharePoint 列表概述\n\nSharePoint 列表代表 SharePoint 的基础组件。在使用 SharePoint\
  \ 时几乎不可能以某种方式避免列表。从技术上讲，文档/表单库是一种列表类型，但为本次讨论的目的，我们将把文档/表单库排除在此类别之外。列表在结构和行为上通常类似于数据库表。列表具有列和可以附加的元数据。不同之处在于列表具有可由用户操作的图形用户界面（GUI）。\n\
  \nSharePoint 开箱即提供列表，例如日历和任务列表。我们的讨论将集中在自定义列表上。自定义列表允许我们配置与业务流程相关的特定字段。\n\n下面举例说明了一个名为\
  \ BizTalk Environments 的自定义列表。它是一个简单的列表，可用于跟踪 BizTalk 服务器所连接的各种端点。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_380_0.png)\n\
  \n## SharePoint 的列表 Web 服务\n\n使用 MOSS 2007/Windows SharePoint Services 3.0 时，通过\
  \ Web 服务操作列表时您只有一个选择。开箱即用的 Web 服务 `Lists.asmx` 允许您通过多种 Web 方法操作列表数据。以下图像说明了 `Lists.asmx`\
  \ Web 服务公开的许多 Web 方法：\n\n## 列表\n\n支持以下操作。有关正式定义，请查看服务说明。\n\n- AddAttachment\n- AddDiscussionBoardItem\n\
  - AddList\n- AddListFromFeature\n- AddWikiPage\n- ApplyContentTypeToList\n- CheckInFile\n\
  - CheckOutFile\n- CreateContentType\n- DeleteAttachment\n- DeleteContentType\n-\
  \ DeleteContentTypeXmlDocument\n- DeleteList\n- GetAttachmentCollection\n- GetList\n\
  \n您将在自定义列表的 `_vti_bin` 文件夹中找到 `Lists.asmx` Web 服务。例如，这里是 `lists.asmx` Web 服务的位置，如果我们要操作前面描述的\
  \ BizTalk Environments 列表，我们将使用它。\n\n```\nhttp://localhost:8080/sites/BizTalkLineOfBusiness/Lists/BizTalk%20Environments/_vti_bin/lists.asmx\n\
  ```\n\n> 注意：如果您在非标准端口上设置了 SharePoint，则只需提供端口号（:8080）。\n\nSharePoint 2010 和 SharePoint\
  \ 2010 Foundation 引入了另一种消费列表数据的方式，即通过 WCF RESTful 服务。这使我们能够消费 RESTful 端点并将列表中的数据用作\
  \ Atom 提要。\n\n**REST** 代表 **Representational State Transfer**，是一种基于 HTTP 的分布式系统灵活软件架构。REST\
  \ 的详细概述超出了本书的范围。\n\n> 有关 REST 的更详细解释，请访问以下链接：http://en.wikipedia.org/wiki/Representational_State_Transfer\n\
  \n\n\n\n我们可以将 Web 浏览器指向 ListData.svc 服务并提供 BizTalk Environments 列表的名称。相应地，我们列表中存在的所有数据都将作为\
  \ Atom feed 返回。该服务需要权限，就像 SharePoint 站点中的任何其他资源一样。该服务不能匿名调用，因此如果您想通过 BizTalk 操作此列表，请确保您的主机实例用户具有参与权限。我们还能够提供\
  \ REST 查询以返回列表中数据的子集，就像数据库查询一样。除了通过此接口读取数据外，我们还可以执行插入和更新操作。\n\n我们可以在站点下的 _vti_bin\
  \ 文件夹中找到 ListData.svc。与 WSS 适配器不同，如果我们的列表名称包含空格，我们需要将其删除，而不是提供空格键的 HTML 等价形式：%20。\n\
  \n```\nhttp://localhost:8080/sites/BizTalkLineOfBusiness/_vti_bin/ListData.svc/BizTalkEnvironments\n\
  ```\n\n当我们在浏览器中输入此 URL 并按 Enter 时，我们将收到一个 XML 响应，其中包含在列表中捕获的 BizTalk 环境数据。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_382_0.png)\n\
  \n值得注意的是，BizTalk WCF 适配器开箱即用不支持这些 RESTful 接口。当 BizTalk 消费 RESTful 列表服务时，它无法解析部分\
  \ XML。在 <entry m:etag=\"W/\"1\"\"> 标签内，存在一个嵌套的引号 \"\"，BizTalk 将其视为无效 XML。最终结果是此消息在接收管道中被挂起。如果使用\
  \ WCF 端点是必不可少的，我们可以编写一个自定义管道组件，在消息发送到消息框之前删除此额外的引号。为了本书的目的，我们将重点关注 Lists.asmx，因为与此服务交互时无需额外编码。\n\
  \n```\n<?xml version=\"1.0\" encoding=\"utf-8\" standalone=\"yes\" ?>\n<feed xml:base=\"\
  http://win2k8r2:8080/sites/BizTalkLineOfBusiness/_vti_bin/ListData.svc/\"\nxmlns:d=\"\
  http://schemas.microsoft.com/ado/2007/08/dataservices\"\nxmlns:m=\"http://schemas.microsoft.com/ado/2007/08/dataservices/metadata\"\
  \ xmlns=\"http://www.w3.org/200\n<title type=\"text\">BizTalkEnvironments</title>\n\
  <id>http://win2k8r2:8080/sites/BizTalkLineOfBusiness/_vti_bin/ListData.svc/BizTalkEnvironments/</id>\n\
  <updated>2010-10-03T21:59:19Z</updated>\n<link rel=\"self\" title=\"BizTalkEnvironments\"\
  \ href=\"BizTalkEnvironments\" />\n<entry m:etag=\"W/\"1\"\">\n<id>http://win2k8r2:8080/sites/BizTalkLineOfBusiness/_vti_bin/ListData.svc/BizTalkEnvironments(1)</id>\n\
  <title type=\"text\">Dev</title>\n<updated>2010-10-03T11:35:03-06:00</updated>\n\
  <author>\n<name />\n```\n\n由于 Lists.asmx Web 服务基于经典的 ASMX 风格 Web 服务，因此在消费此服务时我们有两个\
  \ BizTalk 适配器选项：\n\n- SOAP\n- WCF-BasicHttp\n\nSOAP 适配器自 BizTalk 2009 起已被弃用，并在 BizTalk\
  \ 2010 中继续被弃用。虽然使用此适配器仍然是一个可支持的方案，但如果可能的话，我们最好避免使用它，因为此适配器将在 BizTalk 的未来版本中消失。请参阅官方\
  \ MSDN 文档了解更多详细信息：http://msdn.microsoft.com/en-us/library/aa559720(BTS.70).aspx\n\
  \nWCF-BasicHttp 适配器支持消费 WCF 和传统 ASMX Web 服务。该适配器于 BizTalk 2006 R2 引入，并在消费 Web/WCF\
  \ 服务时继续成为 BizTalk 2010 中可靠的适配器。我们将开发的方案基于 WCF 适配器。\n\n在使用 Lists.asmx Web 服务时，我们需要利用一种名为协作应用程序标记语言（CAML）的技术。CAML\
  \ 是一种基于 XML 的标记语言，用于通过 Web 服务、客户端对象模型或 SharePoint API 操作 SharePoint。在本书的上下文中，我们将从高层次介绍\
  \ CAML，因为本书并不打算成为全面的 CAML 资源。\n\n## 消费 SharePoint 列表方案演练\n\n我们将要演练的真实世界方案是一个车辆维护列表。现场员工将使用此列表来填充与其公司车辆相关的任何维护信息。就像第\
  \ 7 章中的方案一样，我们不希望现场员工登录我们的 ERP 系统，因为用户体验不适合在外执行日常职责的现场员工。\n\nSharePoint 列表中填充的信息仍需要传到我们的\
  \ ERP 系统。此信息由财务和监管部门跟踪，因此重要的是此信息与我们的记录系统进行交换。BizTalk 开发人员面临的一个常见挑战是安排流程以启动编排的能力。大多数\
  \ BizTalk 方案始于 BizTalk 接收消息，进而该消息实例化编排。在我们的方案中并非如此，而且由于您无法通过发送消息来开始 BizTalk 编排，我们需要触发一条消息来启动\
  \ BizTalk 编排。我们有几个选项：\n\n- BizTalk Scheduled Task Adapter\n- SQL Server Polling\
  \ Adapter\n\nBizTalk Scheduled Task Adapter 是一个开源适配器，可在 codeplex 上获取；http://biztalkscheduledtask.codeplex.com。该适配器允许您安排触发消息，以便在设定时间实例化编排。\n\
  \nSQL Server 适配器，无论是 WCF 还是传统，都可以像 BizTalk Scheduled Task Adapter 一样使用，因为它可以安排每\
  \ X 分钟/小时/天执行一次。对于某些环境，运行开源或社区可执行文件是禁止的，因此我们将利用基于 WCF 的 SQL Server 适配器。\n\n使用 SQL\
  \ Server 适配器（传统或基于 WCF）另一个好处是需要存储我们想要通信的 SharePoint 列表的 SharePoint 列表 GUID。我们可以将此\
  \ GUID 存储在 SQL Server 表中，并在消费 SharePoint 列表数据之前从数据库检索此值。随着我们将此解决方案从各种环境（开发/测试/生产）迁移，我们拥有一些可移植性，因为每个\
  \ SharePoint 环境将具有唯一的列表 GUID。\n\n一旦我们获得了 SharePoint 列表的 GUID，我们将在构建 CAML 查询时使用此\
  \ GUID。然后我们将此查询发送到 Lists.asmx 服务。我们期望 CAML 查询将返回车辆维护列表的结果。此查询的结果将被映射到 ERP 系统期望的平面文件格式。\n\
  \n## 创建自定义 SharePoint 列表\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_385_0.png)\n\
  \n> 注：以下示例假定您已有一个现有的 SharePoint 站点。以下链接描述了如何为 WSS 3.0 SP2 和 SharePoint 2010 Foundation\
  \ 创建 SharePoint 站点：\n> WSS 3.0 SP2：\n> http://technet.microsoft.com/en-us/library/cc288969(office.12).aspx\n\
  > SharePoint 2010 Foundation：\n> http://technet.microsoft.com/en-us/library/cc263094.aspx\n\
  \n我们需要创建一个自定义列表，让我们的现场工作人员输入与其车辆维护相关的数据。BizTalk 稍后将连接到此列表并检索数据，以便将其发送到我们的 ERP 系统。\n\
  \n1. 我们可以通过在 SharePoint 功能区中 **主页** 菜单下方的 **列表** 链接来创建自定义列表。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_385_1.png)\n\
  \n2. 我们现在想要点击 Create 链接。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_386_0.png)\n\
  \n3. 选择自定义列表，提供列表名称 Vehicle Maintenance，然后点击创建按钮。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_386_1.png)\n\
  \n4. 我们现在有一个空列表，想要通过点击创建列按钮来创建自定义列。\n\n5. 向列表添加以下列：\n\n- 标题（系统生成）\n- 位置\n- 开始时间\n\
  - 结束时间\n- 单位\n- 里程表读数\n\n\n\n- 项目\n- 为简单起见，我们将数据类型保持为 **单行文本** 并使用默认属性\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_387_0.png)\n\
  \n在前面的示例中，我们创建的列名称不包含空格。这是有意为之，因为 SharePoint 会为字段名称维护内部值，然后是显示在 GUI 上的外部名称。在内部，SharePoint\
  \ 始终使用内部名称。如果内部列名称包含空格，将会创建在运行时难以调试的问题。因此，最好始终在创建列名称时不使用空格，然后在需要更用户友好的列名称时再重命名。\n\
  \n6. 完成后，我们可以通过单击 **添加新项目** 链接来填充我们的列表。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_387_1.png)\n\
  \n7. 完成后，我们的列表应如下所示：\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_388_0.png)\n\n\
  ## 自定义列表 GUID\n\nSharePoint 在标识列表时 heavily relies upon GUID 的使用。列表 GUID 对每个环境都是唯一的。因此，如果我们在测试环境中创建自定义列表，它的值将与生产环境中的自定义列表不同。\n\
  \n1. 获取我们的列表 GUID 的第一步是在列表设置页面上。我们可以通过单击列表设置按钮导航到设置。\n\n2. 我们需要确定我们刚刚创建的列表的 GUID。我们可以通过右键单击标题、描述和导航链接并单击复制快捷方式来实现。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_388_1.png)\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_388_2.png)\n\
  \n3. 将此值粘贴到记事本等编辑器中。我们得到一个如下所示的 URL：`http://localhost:8080/sites/BizTalkLineOfBusiness/_layouts/ListGeneralSettings.aspx?List=%7B27E9BDCE%2D0D87%2D451C%2DB6C9%2D053C246517AE%7D`\n\
  \   - 我们的编码列表 GUID 是 \"?List=\" 之后的值\n\n4. 由于此 GUID 值仍为编码状态，我们希望使用 URL 解码工具对其进行解码。我们可以使用\
  \ `http://www.albionresearch.com/misc/urlencode.php` 上的免费服务来解码我们的 GUID。初始值 `%7B27E9BDCE%2D0D87%2D451C%2DB6C9%2D053C246517AE%7D`\
  \ 被转换为我们的实际 GUID `{27E9BDCE-0D87-451C-B6C9-053C246517AE}`。相反，如果你想自己执行此转换，`'%7B'`\
  \ 等同于 `'{'`，`'%2D'` 等同于 `'-'`，而 `'%7D'` 等同于 `'}'`。\n\n5. 我们现在希望将此 GUID 值插入到我们的自定义\
  \ SQL Server 表中。此表称为 **Lists**，包含一个名为 **ListGUID** 的列。本章源代码中存在一个 SQL 脚本，它将生成适当的\
  \ **SharePointList** 数据库、**Lists** 表和 **ListGUID** 列。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_389_0.png)\n\
  \n## 构建 BizTalk 应用程序\n\n在本节中，我们将讨论构建 BizTalk 组件所需的组件，以构建一个解决方案，该解决方案将使用自定义 SharePoint\
  \ 列表并生成平面文件。\n\n## 为 SharePoint Web 服务生成架构\n\n为了使 BizTalk 和 SharePoint 能够有效地相互通信，我们需要在两个系统之间建立一个契约。我们将通过使用\
  \ Consume Adapter Service 向导为 SharePoint Web 服务生成架构来建立此契约。这将确保当 BizTalk 向 SharePoint\
  \ 发送请求时，它能够理解请求并提供 BizTalk 预期响应的响应。在生成 SharePoint 架构之前，我们需要做一件事，那就是添加允许我们与之前创建的数据库表通信的架构。\n\
  \n1. 现在数据库结构已就位，我们可以使用 Consume Adapter Service 向导生成我们的 `GetListGUIDTypedPolling.xsd`。本章未涵盖生成此架构的详细说明，因为类型化轮询在\
  \ *第 2 章，WCF SQL Server 适配器* 中进行了介绍。\n\n2. Web 服务公开了 Web 服务描述语言 (WSDL)，与大多数其他 Web\
  \ 服务类似。我们希望使用 Consume WCF Service 向导来使用此 WSDL。我们可以通过右键单击 **Chapter8-ManipulatingLists**\
  \ 项目并选择 **添加** 来启动此向导。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_390_0.png)\n\n\
  ![](img/23d1402649b6528b085cd6b900a2c9c3_391_0.png)\n\n3. 我们现在希望选择添加生成项。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_391_1.png)\n\
  \n4. 从添加生成项屏幕中，我们希望选择 Consume WCF Service 并单击添加按钮。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_392_0.png)\n\
  \n5. 单击下一步按钮继续 BizTalk WCF 服务使用向导。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_392_1.png)\n\
  \n6. 确保选择了元数据交换 (MEX) 端点并单击下一步按钮。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_393_0.png)\n\
  \n7. 在元数据地址 (URL) 中，我们需要提供 Lists.asmx Web 服务的位置。例如：http://localhost:8080/sites/BizTalkLineOfBusiness/Lists/VehicleMaintenance/_vti_bin/lists.asmx。在这种情况下，BizTalkLineOfBusiness\
  \ 是 SharePoint 站点的名称，Lists 是此站点中所有列表的位置，我们要使用的列表名称称为 VehicleMaintenance。由于 Lists.asmx\
  \ 不特定于任何自定义列表，我们可以从任何 Lists.asmx 端点生成架构并将其用于任何列表。通过提供 Lists.asmx 端点的 URL，我们可以单击获取按钮并查看构成\
  \ Lists.asmx Web 服务的所有 Web 方法。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_393_1.png)\n\
  \n8. 单击下一步继续。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_394_0.png)\n\n我们现在处于可以导入与\
  \ Web 服务关联的架构的位置，可以通过单击导入按钮来完成。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_394_1.png)\n\
  \n9. 我们会发现五个工件已添加到我们的解决方案中：\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_395_0.png)\n\
  \n| 工件名称 | 目的 |\n|---|---|\n| Lists.BindingInfo.xml | 可以与 WCF-BasicHttp 适配器一起使用的绑定文件。\
  \ |\n| Lists.odx | 模板编排，其中包含与 SharePoint 通信时所需的多个部分消息类型和端口类型。我们不想删除此编排：配置逻辑端口时将需要多个部分消息类型和端口类型。\
  \ |\n| Lists_Custom.BindingInfo.xml | 此绑定文件与 Lists.BindingInfo.xml 类似，不同之处在于此绑定是用于将使用\
  \ basicHttpBinding 的 WCF-Custom 适配器。从根本上讲，使用此绑定的适配器将与 WCF-BasicHttp 适配器的工作方式相同。WCF-Custom\
  \ 适配器允许在配置发送端口时进行更多选项，包括安全性。 |\n| Lists_microsoft_com_wsdl_types.xsd | 此架构在与 Lists.asmx\
  \ Web 服务交互时为 Lists_schemas_microsoft_com_sharepoint_soap.xsd 架构提供底层支持。 |\n| Lists_schemas_microsoft_com_sharepoint_soap.xsd\
  \ | 这是该集合中最关键的工件，因为它提供了在与 Lists Web 服务中包含的各种 Web 方法通信时所需的结构。 |\n\n10. 当我们下载这些工件时，**Lists_schemas_microsoft_com_sharepoint_soap.xsd**\
  \ 架构在编译时出现问题。我们得到的错误如下：\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_396_0.png)\n\
  \n似乎 **Consume WCF Service** 向导中存在一个错误，即它插入了一个不包含 **schemaLocation** 的架构导入节点。\n\n\
  ![](img/23d1402649b6528b085cd6b900a2c9c3_396_1.png)\n\n11. 我们可以通过删除第一个 **<xs:import/>**\
  \ 节点来解决此错误，而不会出现问题。为了删除此行，请打开记事本等文本编辑器，或在 Visual Studio 中通过右键单击 XSD 文件、选择 **打开方式**，然后选择\
  \ **XML 编辑器** 来编辑 XSD 文件。\n\n\n\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_397_0.png)\n\
  \n## 编排初始化\n\n消费 SharePoint 列表数据需要 BizTalk 提交请求然后等待响应。在 BizTalk 发送此请求之前，我们需要通过接收触发消息来实例化我们的编排。我们现在将配置\
  \ BizTalk 从 SQL Server 接收此触发消息，以便启动我们的编排。\n\n- 1. 在下载了 WCF-SQL 和 Web 服务架构后，我们现在希望通过将逻辑\
  \ **Receive Port** 和 **Receive Shape** 拖到我们的编排上构建解决方案。当消息通过此端口处理时，它将初始化此编排，从而允许我们连接到\
  \ SharePoint 自定义列表。逻辑端口是一个 **one-way** 端口，并且其 **Port Binding** 为 **Specify later**。然后我们希望配置\
  \ **Receive Shape** 以接受名为 **msgSQLConfiguration** 的消息，其类型为 **Chapter8ManipulatingLists.GetListGUIDTypedPolling.TypedPolling**。此接收形状还应将其\
  \ Activate 属性设置为 True。将接收到的消息是我们接收位置中指定的轮询查询的结果。此消息将包含我们想要交互的 SharePoint 列表的 GUID。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_397_1.png)\n\n- 2. 我们要提供给 SharePoint\
  \ 的消息的架构名为 **Lists_schemas_microsoft_com_sharepoint_soap.xsd.** 在此架构中，我们将发现许多节点，这些节点代表需要传递给\
  \ `Lists.asmx` Web 服务中可用的各种 Web 方法的 XML 结构。我们最感兴趣的结构是 **GetListItems** 节点。我们将使用此消息从自定义列表中检索数据。为了使用此架构，我们需要在编排中创建一个名为\
  \ **msgGetListItemsRequest** 的消息，其类型为 **Chapter8ManipulatingLists.GetListItemsSoapIn.**\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_398_0.png)\n\n## 映射 SharePoint 请求\n\n\
  编排启动后，现在是时候将我们从 SQL Server 轮询调用中收到的 GUID 传递过去，并将其与其他补充数据一起提供给 SharePoint 请求消息。请求消息为\
  \ SharePoint 提供有关 BizTalk 希望从 SharePoint 列表返回的数据的说明。\n\n为了填充我们的 SharePoint 请求消息，我们需要能够从\
  \ **msgSQLConfiguration** 消息中检索 GUID 并将其提供给 SharePoint 获取列表项请求消息。此转换发生在名为 **SQLConfiguration_to_GetListItemsRequest.btm**\
  \ 的映射中，该映射作为本书源代码的一部分提供。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_399_0.png)\n\
  \n- 1. 在这一点上，我们需要完成 SharePoint 列表请求消息的填充。此消息必须遵循 SharePoint 预期的 CAML 结构。请求消息由七个消息部分组成。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_399_1.png)\n\n- 2. 我们将从 **SQLConfiguration_to_GetListItemsRequest.btm**\
  \ 映射中填充这些消息部分的每一个。在 **listName** 节点中，我们希望填充自定义列表的 GUID。在这种情况下，我们将通过将此节点映射到 **listName**\
  \ 节点来利用 **msgSQLConfiguration** 消息中的 **ListGUID** 元素。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_400_0.png)\n\
  \n- 3. 对于 **viewName** 属性，我们只需通过 **String Concatenation** Functoid 分配一个空字符串值。在我们的场景中，我们没有利用\
  \ SharePoint 视图。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_400_1.png)\n\n- 4.\
  \ 在 SharePoint 请求消息的 **query** 节点中，注意它期望的节点类型：**<Any>**。在此架构的上下文中，这意味着它是一个松散类型的节点，并期望我们开发者提供有效的\
  \ CAML 标记。然后此 CAML 标记将针对我们的自定义列表执行。如果我们想根据一组条件过滤 SharePoint 列表，我们将在此处执行。由于我们对列表中存储的所有数据感兴趣，我们将查找\
  \ **ID** 字段大于 0 的所有记录。由于 ID 是系统列，可以保证它存在，并且 ID 总是从 1 开始，因此如果列表中存在记录，我们将始终返回记录。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_400_2.png)\n\n- 5. 为了填充此 CAML 查询，我们可以利用\
  \ **Scripting Functoid** 并使其从 XSLT 调用模板返回 XML。我们可以通过右键单击它并选择 **Configure Functoid\
  \ Script** 来配置此 **Scripting Functoid**。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_401_0.png)\n\
  \n- 6. 进入 Functoid 脚本的配置后，我们可以将 Select 脚本类型设置为 Inline XSLT Call Template 并提供以下 XSLT\
  \ 标记：\n\n```\n<xsl:template name=\"Query\">\n    <Where>\n        <Gt>\n       \
  \     <FieldRef Name='ID' />\n            <Value Type='Number'>0</Value>\n     \
  \   </Gt>\n    </Where>\n</xsl:template>\n```\n\n> 注意：我们也有选项编写一个 .NET Helper 方法，使其返回\
  \ XML 并将其分配给此节点。\n\n- 7. 我们需要填充的下一个消息部分是 queryOptions 元素。我们将为此元素遵循与 Query 元素相同的模式。我们将配置一个\
  \ Scripting Functoid 来调用 XSLT 模板。此元素的目的是在查询中提供约束，例如包含强制列。在我们的场景中，我们不会强制返回强制列。\n\n\
  ![](img/23d1402649b6528b085cd6b900a2c9c3_401_1.png)\n\n- 8. Inline XSLT Call Template\
  \ 将包含以下 XSLT 标记：\n\n```\n<xsl:template name=\"QueryOptions\">\n    <QueryOptions>\n\
  \        <IncludeMandatoryColumns>FALSE</IncludeMandatoryColumns>\n    </QueryOptions>\n\
  </xsl:template>\n```\n\n- 9. rowLimit 消息部分提供了限制我们感兴趣从 SharePoint 列表返回的行数的能力。此消息部分不需要\
  \ XML 节点，因此我们可以简单地从 String Concatenate functoid 提供一个数值文字。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_402_0.png)\n\
  \n- 10. 在我们的场景中，我们将在 String Concatenate functoid 中提供 1000 的值。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_402_1.png)\n\
  \n- 11. 我们需要处理的下一个消息部分是 viewFields，它提供了限制 CAML 查询返回的字段数量的能力。在我们的场景中，我们将返回所有用户创建和系统生成的字段。再次，我们将利用调用\
  \ XSLT Call Template 的 Scripting Functoid。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_403_0.png)\n\
  \n- 12. 在 XSLT Call Template 调用中，我们将提供以下 XSLT 标记：\n\n```\n<xsl:template name=\"\
  ViewFields\">\n    <ViewFields></ViewFields>\n</xsl:template>\n```\n\n- 13. 如果我们想操作根网站中的列表，即使\
  \ Lists.asmx Web 服务可能位于子站点中，我们也可以在 webID 节点中提供父站点的 GUID。在我们的场景中，我们可以简单地不映射该节点且不提供任何说明。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_403_1.png)\n\n- 14. 在这一点上，我们已经填充了 SharePoint\
  \ 获取列表项请求消息并准备将其发送到 SharePoint。为此，我们希望利用 Consume WCF Service Wizard 为我们提供的逻辑端口。创建逻辑端口时，我们希望确保使用名为\
  \ Chapter8ManipulatingLists.ListSoap 的现有端口类型。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_403_2.png)\n\
  \n- 15. 配置逻辑端口后，我们会发现所有已公开的各种 Web 方法都已添加到我们的编排中。我们感兴趣的 Web 方法是 **GetListItems**。如果您有兴趣了解此\
  \ Web 服务提供的其他 Web 方法的更多信息，请访问以下网页：http://msdn.microsoft.com/en-us/library/ms774517(v=office.12).aspx\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_404_0.png)\n\n- 16. 然后我们可以将 **Request**\
  \ 操作拖到 **Send Shape**，并将 **Response Operation** 拖到 **Receive Shape**。\n\n\n\n\n\
  ![](img/23d1402649b6528b085cd6b900a2c9c3_405_0.png)\n\n17. **Send Shape** 将发送一条名为\
  \ **msgGetListItemsRequest** 的消息，其类型为 **Chapter8ManipulatingLists.GetListItemsSoapIn**。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_405_1.png)\n\n18. **Receive Shape** 将接收一条名为\
  \ **msgGetListItemsResponse** 的消息，其类型为 **Chapter8ManipulatingLists.GetListItemsSoapOut**。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_406_0.png)\n\n19. 现在我们已经创建了逻辑发送端口并连接了\
  \ **Send Shape**，可以向 SharePoint 发送 Get List Items 请求并从 SharePoint 接收响应消息。我们会遇到的问题是\
  \ SharePoint 返回的响应消息包含一个未类型化的段落。这意味着 SharePoint 知道它发送回的结构，但 BizTalk 不知道。BizTalk\
  \ 不知道的原因是 **GetListItemsResponse** 的结构包含一个 **<Any>** 节点，这意味着将返回非结构化 XML。微软选择 **<Any>**\
  \ 节点的原因是他们不知道我们的自定义列表有多少列，因此保持结构松散以适应更多场景。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_406_1.png)\n\
  \n20. 本章源代码的 SampleDocs 文件夹中包含 SharePoint 响应的示例，文件名为 Sample_Response_From_Lists.xml。\n\
  \n```\n<GetListItemsResponse xmlns=\"http://schemas.microsoft.com/sharepoint/soap/\"\
  >\n  <GetListItemsResult>\n    <listitems xmlns=\"uuid:BD6CFE...\" ...>\n      <rs:data\
  \ ItemCount=\"2\">\n        <z:row ows_Attachments=\"0\" ows_LinkTitle=\"Oil Change\"\
  \ ows_Location=\"Moose Jaw\" ows_StartTime=\"9/13/2010\" ows_EndTime=\"9/14/2010\"\
  \ ows_Unit=\"U644\" ows_OdometerReading=\"30000 miles\" ows_Item=\"Oil Filter change\
  \ and 5 Litres added\" ... />\n        <z:row ows_Attachments=\"0\" ows_LinkTitle=\"\
  Tire Replacement\" ows_Location=\"Saskatoon\" ows_StartTime=\"9/15/2010\" ows_EndTime=\"\
  10/16/2010\" ows_Unit=\"U342\" ows_OdometerReading=\"90000 miles\" ows_Item=\"Rear\
  \ left tire had a flat\" ... />\n      </rs:data>\n    </listitems>\n  </GetListItemsResult>\n\
  </GetListItemsResponse>\n```\n\n## SharePoint 的非结构化响应\n\n接收非结构化消息段的问题在于，很难将此数据转换为我们可以发送给\
  \ ERP 系统的响应。此时我们可以采取以下几种方案：\n\n- 编写一系列 XPath 语句来检索 ERP 系统所需的数值\n- 使用此示例消息生成一个 Schema，以便稍后在\
  \ BizTalk Map 中使用，将 SharePoint 返回的数据转换为 ERP 系统可以处理的格式\n\n编写大量 XPath 语句容易出错且难以调试。采用第二种方案，我们可以利用\
  \ BizTalk Mapper 工具。为此，我们将生成一个 Schema 来结构化 SharePoint 的这些响应，然后将这些响应转换为 ERP 可以消费的消息。\n\
  \n1. 为了为 SharePoint 返回的结构创建架构，我们可以使用“添加生成项向导”的一部分的“生成架构”功能。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_408_0.png)\n\
  \n2. 进入“生成架构向导”后，我们需要确保文档类型设置为“格式良好的 XML（未加载）”，然后可以浏览示例文件。我们可以使用名为 Sample_Response_From_Lists.xml\
  \ 的示例文件，可在本章源代码的 SampleDocs 文件夹中找到。找到该文档后，我们可以单击“确定”继续下一步。\n\n> 示例文件已为您提供方便。如果您想从\
  \ SharePoint 生成自己的示例消息，请发送您的 SharePoint 列表请求，然后将响应消息写入文件系统。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_408_1.png)\n\
  \n3. 已向我们的项目添加了三个架构。这些架构已被重命名以更好地反映其用途。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_409_0.png)\n\
  \n> 注：重命名这些架构时，请确保通过在文本编辑器中打开架构来更新架构内部的引用。我们需要在 SharePointListResponseParent.xsd\
  \ 中更新 <xs:import> 元素，以反映 SharePointListResponseChildData.xsd 架构的新名称。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_409_1.png)\n\
  \n我们还需要在 SharePointListResponseChildData.xsd 中更新 <xs:import> 元素，以反映 SharePointListResponseChildRow.xsd\
  \ 架构的新名称。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_409_2.png)\n\n4. 我们接下来要做的修改是更新\
  \ **SharePointListResponseParent.xsd** 架构的 **Target Namespace**。打开此架构，选择 **Schema**\
  \ 文件夹，然后将 **Target Namespace** 更新为：`http://Chapter8ManipulatingLists.SharePointListResponseParent`。我们需要这样做的原因是，在生成此架构时，我们使用的是\
  \ SharePoint Get List Items Response 的输出，其中包含 SharePoint 的 Target Namespace。如果不进行此更改，项目中将有两个具有相同\
  \ Target Namespace 的架构。这将导致运行时错误，因为 BizTalk 将不知道将传入消息匹配到哪个架构。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_410_0.png)\n\
  \n5. 现在我们需要能够将 SharePoint 的结果转换为基于我们 **SharePointListResponseParent.xsd** 架构的消息实例。为此，我们将创建一个名为\
  \ **msgGetListItemsResponseHelper** 的新消息，其类型为 **Chapter8ManipulatingLists.SharePointListResponseParent**。然后我们将向编排中添加一个\
  \ **Message Assignment** 形状，并将 **Message Constructed** 属性设置为 **msgGetListItemsResponseHelper**。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_411_0.png)\n\n6. 在此 **Message Assignment**\
  \ 形状中，我们将利用存在于我们的 Helper C# 项目 Chapter8ManipulatingLists.Utility 中的 Helper 方法。\n\
  \n```\n//We want a typed response document so that we can map to\n//the flat file\
  \ message for our ERP\nmsgGetListItemsResponseHelper = Chapter8ManipulatingLists.Utility.toXML(msgGetListItemsResponse);\n\
  ```\n\n7. toXML 方法将简单地接受来自 SharePoint 的 Get List Items Response 消息，更新 Target Namespace\
  \ 使其与我们的 msgGetListItemsResponseHelper Target Namespace 匹配，然后将消息返回给 BizTalk，以便将其强制转换为\
  \ msgGetListItemsResponseHelper 的架构。Utility 类相当简单，只有一个方法 toXML：\n\n```\nusing System;\n\
  using System.Collections.Generic;\nusing System.Linq;\nusing System.Text;\nusing\
  \ System.Xml;\n\n//needed to receive message from BizTalk\nusing Microsoft.XLANGs.BaseTypes;\n\
  namespace Chapter8ManipulatingLists\n{\n```\n\n```\npublic static class Utility\n\
  {\n    public static XmlDocument toXML(XLANGMessage msgXlang)\n    {\n        //Want\
  \ to receive a typed BizTalk message as an XML Document\n        XmlDocument xmlMessage\
  \ = (XmlDocument)msgXlang[0].RetrieveAs(typeof(System.Xml.XmlDocument));\n     \
  \   try\n        {\n            //Need to override Target Namespace to use our custom\
  \ schema instead of the SharePoint response message's Target Namespace\n       \
  \     xmlMessage.DocumentElement.SetAttribute(\"xmlns\", \"http://Chapter8ManipulatingLists.SharePointListResponseParent\"\
  );\n        }\n        catch (XLANGsException xlngEx)\n        {\n            throw\
  \ xlngEx;\n        }\n        //Return message back to BizTalk\n        return xmlMessage;\n\
  \    }\n}\n```\n\n## ERP 平面文件\n\n我们的 ERP 系统与其他许多系统一样，有严格的要求，即必须以平面文件形式提供车辆维护数据。BizTalk\
  \ 拥有丰富的工具集，可让我们轻松满足此要求。\n\n- 现在我们已经从 SharePoint 获得了类型化响应消息，可以将其转换为 ERP 系统期望的格式。我们将再次利用\
  \ BizTalk Mapper 来提供此功能。负责此操作的映射名为 **SharePointListResponse_to_VehicleMaintenanceResponse_FF.btm**。\n\
  \n\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_413_0.png)\n\n2. 我们将要使用的 ERP 消息的架构名为\
  \ SharePointListVehicleMaintenance_FF.xsd，它是一个平面文件架构。我们想要生成的消息的示例存在于 SampleDocs\
  \ 文件夹中，该文件夹可在本章示例代码中找到。文件的名称为 Vehicle_Maintenance_For_ERP.csv。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_413_1.png)\n\
  \n3. 你会注意到平面文件架构的结构与我们之前创建的自定义 SharePoint 列表相似。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_414_0.png)\n\
  \n4. 由于这是一个平面文件架构，我们还需要一个平面文件管道来在消息通过发送端口传输时组装该消息。负责此操作的发送管道称为 SendVehicleMaintenance_FF.btp。在\
  \ Assemble 阶段，我们希望将一个平面文件装配组件拖到管道的表面上。然后我们希望将文档架构设置为我们的平面文件架构：Chapter8ManipulatingLists.SharePointListVehicleMaintenance_FF。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_414_1.png)\n\n5. 我们现在希望在编排中放置一个 **Send**\
  \ 形状并创建一个逻辑发送端口。在 **Send** 形状中，我们希望指定一个名为 msgVehicleMaintenance_FF 的消息，其类型为 **Chapter8ManipulatingLists.SharePointListVehicleMaintenance_FF**\
  \ 并且逻辑 **Send Port** 为单向，并且其端口绑定设置为 **Specify Later.**\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_415_0.png)\n\
  \n## 部署和配置 BizTalk 解决方案\n\n我们现在准备部署和配置我们的 BizTalk 解决方案。\n\n- 1. 要部署我们的解决方案，请右键单击它，然后单击\
  \ **Deploy Solution.**\n- 2. 在 BizTalk 管理控制台中，我们应该能找到一个名为 **Chapter8-ManipulatingLists**\
  \ 的应用程序。此解决方案的绑定文件 `Chapter8-ManipulatingLists.xml` 存在于本章源代码中的 `Bindings` 文件夹内。如果我们导入此文件，我们会发现我们有一个接收端口、一个接收位置和两个发送端口。请注意，此绑定文件中包含的端点可能与您机器上的目标不匹配。\n\
  \n3. 我们的接收端口名为 **RetrieveSharePointGUIDs**，它有一个名为 **RetrieveSharePointGUIDsFromSQL**\
  \ 的接收位置。接收位置将使用 WCF-Custom 适配器、**BizTalkServerApplication** 主机实例和 **XMLReceive**\
  \ 管道。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_416_0.png)\n\n> 注：我们也可以在此解决方案中使用\
  \ WCF-SQL 适配器。由于 Consume Adapter Service Wizard 在其自动生成的绑定文件中指定了 WCF-Custom 适配器，我们将使用它。本质上，两个适配器都利用\
  \ sqlBinding，因此底层功能相同。\n\n4. 在此接收位置中，我们需要提供一个 **Address (URI)**。在这种情况下，我们可以提供以下内容：\
  \ `mssql://localhost//SharePointList?InboundId=1`。**Localhost** 表示托管 **SharePointList**\
  \ 数据库的数据库服务器。我们还必须为此连接提供唯一的 **InboundId**，以防我们配置了多个轮询接收位置使用同一数据库。有关 **InboundId**\
  \ 属性的更多信息，请参阅第 2 章。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_417_0.png)\n\n5.\
  \ 在 **Binding** 选项卡中，有一些我们需要修改的属性，如下所述：\n\n| 属性名称 | 属性值 | 说明 |\n|---|---|---|\n\
  | Binding Type | sqlBinding | 由于我们使用的是 WCF-Custom 适配器，我们需要提供绑定，并且由于我们连接到的是 SQL Server，我们需要提供\
  \ **sqlBinding**。 |\n| inboundOperation Type | TypedPolling | 我们的方案使用 TypedPolling，因为我们期望从\
  \ **pollingStatement** 查询返回强类型消息。 |\n| polledData Available | Select count(*) from\
  \ Lists | 此属性需要一个查询，在执行时将确定是否继续执行 **pollingStatement**。如果此查询未返回任何数据，则 **pollingStatement**\
  \ 查询将不会被执行。 |\n| pollingIntervalIn Seconds | 30 | 我们希望联系 SQL Server 检索数据的间隔。此值在生产环境中可能无效，但在我们的演示目的中可以使用。在生产环境中，我们可能不希望如此频繁地轮询，因为每次轮询都会给数据库带来一定的压力。\
  \ |\n| pollingStatement | Select ListGUID from Lists | 此查询将返回我们用于联系 SharePoint 以检索自定义列表数据的\
  \ GUID。 |\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_418_0.png)\n\n- 6. 已设置的其余属性是使用\
  \ **sqlBinding** 的 **WCF-Custom** 适配器的默认值。\n- 7. 我们用于与 SharePoint 通信的发送端口名为 **cfSendPort_Lists_ListsSoap_Custom**。此发送端口还将使用\
  \ **WCF-Custom** 适配器、**BizTalkServerApplication** 主机实例、**PassThruTransmit** 发送管道和\
  \ **XMLReceive** 接收管道。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_419_0.png)\n\n\
  8. 我们现在需要指定 Lists.asmx Web 服务的 URL 和我们的 Soap Action 头。下面提供的 URL 代表用于构建此示例的 URL。您需要更新此\
  \ URL 以反映您的 SharePoint 服务器。当我们使用 Consume WCF Service Wizard 时，它还生成了一个绑定文件，我们可以用它来填充我们的发送端口。这种方法的一个关键好处是生成的绑定文件将包含所有\
  \ Soap Action 头，包括 GetListItemChanges 如下所示：\n\n```\n<Operation Name=\"GetListItems\"\
  \ Action=\"http://schemas.microsoft.com/sharepoint/soap/GetListItems\" />\n```\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_420_0.png)\n\n9. 在 Binding 选项卡上，有一些我们需要修改的重要属性，描述如下：\n\
  \n| 属性名称 | 属性值 | 说明 |\n|---|---|---|\n| Binding Type | basicHttpBinding | 此绑定是我们使用经典\
  \ ASP.Net ASMX Web 服务时的最佳选择。 |\n| Security | mode=Transport CredentialOnly | 由于我们使用的数据不敏感，因此此方案不需要任何特殊的基于消息的安全性。我们需要为\
  \ SharePoint 提供凭据，以便我们可以进行身份验证和授权以操作 SharePoint 列表。在此方案中，我们的 BizTalk 主机实例帐户将被传递。我们的\
  \ BizTalk 主机实例帐户还需要连接到站点的 Contribute 访问权限。 |\n| Security-Transport | clientCredential\
  \ Type=Ntlm | 由于我们的 BizTalk 服务器和 SharePoint 服务器存在于同一域中，我们可以利用 Ntlm 凭据类型。 |\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_421_0.png)\n\
  \n10. 在 Behavior 选项卡中，我们需要确保我们有一个 EndpointBehaviour，其类型为 clientCredentials 并启用 Windows\
  \ Impersonation。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_421_1.png)\n\n11. 此发送端口的其余设置利用\
  \ WCF-Custom 适配器对 basicHttpBinding 的默认属性。\n\n12. 我们的最终发送端口负责将平面文件发送到我们的 ERP 系统。此发送端口的名称为\
  \ SendVehicleMaintenanceListToERP。它将利用 FILE 适配器、BizTalkServerApplication 主机实例和我们的自定义\
  \ SendVehicleMaintenance_FF 管道。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_422_0.png)\n\
  \n13. 我们现在需要配置我们的编排，以便我们可以设置主机实例并将我们的逻辑端口与物理端口链接。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_422_1.png)\n\
  \n## 测试 BizTalk 应用程序\n\n在启用 BizTalk 应用程序之前，让我们回到我们的列表，以确保我们有一些数据可以通过 SharePoint\
  \ Lists.asmx Web 服务检索。\n\n- 1. 一旦我们到达列表，我们可以通过单击 Add new item 链接来添加新记录。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_423_0.png)\n\
  \n- 2. SharePoint 为我们提供了一个很好的界面来向我们的自定义列表添加数据。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_423_1.png)\n\
  \n\n\n3. 我们现在有三条记录，BizTalk应在我们的应用程序启动后对其进行处理。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_424_0.png)\n\
  \n4. 现在让我们启动我们的应用程序。30秒内，我们应该会看到为我们的ERP系统消费而生成的平面文件。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_424_1.png)\n\
  \n5. 如果我们导航到我们的ERP文件夹，就会发现为我们生成了一个CSV文件。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_424_2.png)\n\
  \n6. 我们现在可以用记事本或Microsoft Excel等文本编辑器打开此文件。打开后，我们会发现自定义SharePoint列表中的三条记录现在已包含在此CSV文件中。\n\
  \n|  | A | B | C | D | E | F | G |\n|---|---|---|---|---|---|---|---|\n| 1 | Oil\
  \ Change | Moose Jaw | 9/13/2010 | 9/14/2010 | U644 | 30000 miles | Oil Filter change\
  \ and 5 Litres added |\n| 2 | Tire Replacement | Saskatoon | 10/15/2010 | 10/16/2010\
  \ | U342 | 90000 miles | Rear left tire had a flat |\n| 3 | Windshield Replacement\
  \ | Regina | 10/17/2010 | 10/18/2010 | U007 | 12310 miles | Massive rock flew into\
  \ Windshield and cracked it |\n\n> 注：与Windows SharePoint Services适配器不同，从此Web服务检索到的数据并未被删除。如果我们只想检索自上次轮询数据库以来添加到列表中的新记录，则必须自行实现此解决方案。这种情况可以通过在SQL\
  \ Server数据库中添加一列来轻松管理，该列存储上次检索的记录的ID。然后我们将使用此ID作为CAML查询中的条件。\n\n## 与SharePoint集成的其他方式\n\
  \n在过去的两章中，我们回顾了BizTalk可以与SharePoint集成的两种方式：利用开箱即用的Windows SharePoint Services适配器以及使用SharePoint开箱即用的Web服务。还有几种其他与SharePoint集成的方式，我们也应该了解。\n\
  \n## SharePoint客户端对象模型\n\nSharePoint 2010中的新功能是SharePoint客户端对象模型。客户端对象模型主要由两个名为`Microsoft.SharePoint.Client.dll`和`Microsoft.SharePoint.Client.Runtime.dll`的程序集组成。使用这些库时，我们需要在项目中引用它们。此客户端对象模型可由JavaScript、Silverlight和.NET\
  \ CLR引用。客户端对象模型仍然依赖于CAML，就像Web服务一样，并且从SharePoint返回的数据也是未类型的，就像Web服务一样。客户端对象模型能够操作Webs、Lists、List\
  \ Items、Content Types、Fields和External Lists。\n\n如果我们想从BizTalk利用此客户端对象模型，我们将创建一个Helper\
  \ .NET程序集，然后从此Helper项目中添加对对象模型的引用。BizTalk将通过Expression形状或Pipeline组件与此Helper程序集交互。这种方法的好处是性能提高，因为我们避免了MessageBox并直接与SharePoint通信。这种方法的一个缺点是我们避免了MessageBox并负责服务调用的配置。如果SharePoint离线或引发错误，我们需要自行处理这些情况。BizTalk提供深入的跟踪、消息重试和配置，使我们作为开发人员的工作变得更加容易。通过创建避免这些BizTalk核心功能的解决方案，我们冒着开发难以支持的解决方案的风险。\n\
  \n## SharePoint REST服务\n\n本章前面我们讨论了SharePoint 2010中RESTful服务的包含。即使BizTalk WCF-Custom适配器在处理这些服务返回的XML时遇到困难，我们仍然可以借助WCF\
  \ Data Services让BizTalk与这些服务交互。从.NET Helper项目中，我们可以消费WCF Data服务并操作这些列表。在消息重试、跟踪和配置方面，我们仍将处于与客户端对象模型相同的情况。然而，我们将具有消费Atom提要返回的类型化数据的优势。\n\
  \n## Business Connectivity Services (BCS)\n\nSharePoint 2010的另一个有趣功能是Business Connectivity\
  \ Services或BCS，不要将其与共享相同缩写的美国大学橄榄球碗锦标赛系列混淆。BCS是SharePoint 2007功能Business Data Catalogue\
  \ (BDC)的更新。有了BDC，SharePoint可以通过Web服务和数据库连接从外部系统消费数据。例如，如果我们想从SQL Server数据库消费数据，我们可以配置BDC来消费此数据并将其显示为SharePoint中的列表。当需要来自ERP等记录系统的數據时，这是一个理想的解决方案。我们可以使用此技术的一个例子是在SharePoint中创建员工列表，而无需在两个地方维护数据。我们只需使用BDC检索员工信息供SharePoint使用。需要注意的是，BDC/BCS不会复制数据；它只是引用源系统中的数据。\n\
  \n除了BDC提供的所有功能外，BCS还提供了写入数据源的能力。这使我们能够利用SharePoint的用户界面修改ERP和CRM等其他系统中的数据。除了通过数据库连接写入外，我们还可以写入.NET对象和Web/WCF服务。在许多数据库场景中，我们可以在不编写任何代码的情况下使用这些类型的功能。与.NET对象和Web服务交互很可能需要编写一些代码。\n\
  \n## 确定合适的解决方案\n\n那么我们如何知道该采用哪种方法呢？这真的取决于我们自己组织内的架构方向。如果我们的架构原则之一包括减少系统中的自定义编码量，那么使用BizTalk就很有说服力。\n\
  \n如果您的组织并不反对自定义编码，并且可能还没有BizTalk许可证，那么在BizTalk之外使用这些其他技术有很多优点。\n\n## 摘要\n\n在本章中，我们发现了使用SharePoint提供的开箱即用Web服务与其他方式集成SharePoint的方法。我们还介绍了可用于与SharePoint\
  \ 2010交互的其他技术，包括SharePoint客户端对象模型、RESTful服务和Business Connectivity Services。\n\n\
  在下一章中，我们将远离SharePoint，但继续讨论与ERP系统的集成。这次我们不关注通用的ERP系统，而是将研究与微软的ERP系统Dynamics AX集成时涉及的内容。\n"
- "## 9 Microsoft Dynamics AX\n\n### Microsoft Dynamics AX\n\n在本章中，我们将讨论使用BizTalk\
  \ Dynamics AX适配器与Microsoft Dynamics AX 2009集成。它将是对Dynamics AX 2009应用程序集成框架（AIF）模块中的配置设置以及相关批处理作业设置的完整演练。我们将完成两个BizTalk应用程序，演示同步和异步形式的集成，并展示使用AIF模块的好处。\n\
  \n完成的解决方案包含在本章的代码中。在第一个演练示例中，我们将创建一个BizTalk应用程序来填充汇率表。在第二个演练示例中，我们将创建一个BizTalk应用程序，通过AIF队列从Dynamics\
  \ AX 2009检索消息。还包括一个控制台应用程序，演示如何利用.NET业务连接器与Dynamics AX 2009集成。\n\n我们将具体涵盖：\n- 什么是Dynamics\
  \ AX？\n- 与AX集成的方法\n- 安装适配器和.NET Business Connector\n- 为BizTalk适配器配置Dynamics AX 2009应用程序集成框架\n\
  - 同步演练示例 – 货币汇率\n- 异步演练示例 – Dynamics AX 消息流出\n- 其他开发和配置说明\n\n\n\n## 什么是 Dynamics\
  \ AX？\n\nMicrosoft Dynamics AX（正式名称为 Microsoft Axapta）是微软面向中型和大型客户的企业资源规划（ERP）解决方案。类似\
  \ SAP，Dynamics AX 提供了对能够受益于 BizTalk 集成的企业至关重要的功能。Microsoft Dynamics AX 通过其丰富的开发平台和工具完全可定制和可扩展。它与\
  \ Microsoft BizTalk Server、Microsoft SQL Server、Exchange 和 Office 等产品具有直接连接。\n\n\
  经常将 Dynamics AX 与 SAP All in One 进行比较。熟悉 SAP 的人也熟悉其相关的实施、维护和定制的高成本。Microsoft Dynamics\
  \ AX 解决方案比 SAP 提供更高的可定制性、更低的维护成本和更低的每用户成本。ERP 实施往往部分由于用户接受度不足而失败。Dynamics AX 用户界面与\
  \ Microsoft Office 和 Microsoft Outlook 等广泛使用的产品具有相似的外观和感觉，这显著提高了用户在使用新 ERP 系统时的舒适度。有关\
  \ Dynamics AX 2009 和 SAP 的更多信息，请参阅 http://www.microsoft.com/dynamics/en/us/compare-sap.aspx\n\
  \n## 与 AX 集成的 方法\n\n随 Dynamics AX 2009 包含，微软提供了两种与 Dynamics AX 集成的工具：\n\n- Dynamics\
  \ AX BizTalk 适配器\n- .NET Business Connector\n\nBizTalk 适配器通过 Dynamics AX 2009 中的应用程序接口框架模块（AIF）进行接口，而\
  \ .NET Business Connector 直接调用您 AX 源代码中的应用程序对象树（AOT）类。\n\nAIF 模块需要许可证密钥，如果贵组织尚未购买此模块，则会增加集成项目的成本。它提供了一个可扩展的框架，可通过\
  \ XML 文档交换实现集成。AIF 模块的一个巨大优势是其与 BizTalk Dynamics AX 适配器的集成功能。其他适配器包括 FILE 适配器和 MSMQ，以及开箱即用的用于消费\
  \ XML 文件的 Web 服务。AIF 模块需要相当多的设置和配置，我们将在本章后面讨论。其他优势包括完整且细粒度的安全性、同步和异步模式集成模式的能力，以及交易的完整日志记录和错误处理。\n\
  \nMicrosoft BizTalk AX 2009 适配器可以在同步和异步模式下执行 AX 操作（向 AIF 模块公开的函数）以将数据写入 AX。使用哪种模式由\
  \ BizTalk 应用程序的设计（通过逻辑端口）决定。单向发送端口会将 XML 数据放入 AIF 队列，而双向发送-接收端口会执行操作并返回响应消息。异步转换将保留在\
  \ AIF 队列中，直到执行批处理作业。设置和执行批处理作业可能非常难以管理，我们将在本章后面讨论这一点。也可以使用 BizTalk 适配器从 AX 中提取数据。以异步模式（方向为\
  \ OUTBOUND）推送到同一 AIF 队列中的事务可以使用轮询 AX 以获取这些事务的 AX 适配器检索。\n\n.NET Business Connector\
  \ 需要编写自定义 .NET 代码才能实现。如果您的业务需求是少量点对点集成数据流（或非常少），那么我们建议使用 .NET Business Connector。但是，这通常需要定制才能创建和公开方法。安全性也需要使用代码运行的服务帐户来处理。我们将在本章后面讨论这个问题，并且我们为本章提供了带有源代码的工作示例。\n\
  \n## 安装适配器和 .NET Business Connector\n\nMicrosoft BizTalk 适配器 for Dynamics AX 2009\
  \ 和 .NET Business Connector 可从 Dynamics AX 设置中的集成下的“添加或修改组件”窗口安装。每个组件彼此独立；然而 BizTalk\
  \ 适配器利用了业务连接器的组件。您无需在 BizTalk 服务器上安装 Dynamics AX 客户端。安装 BizTalk 适配器时，您可以简单地从安装向导中选择所有默认值。对于\
  \ .NET 业务连接器，您将被提示输入 Dynamics AX 实例的位置。这仅用作默认配置，可以轻松更改。\n\n## 为 BizTalk 适配器配置 Dynamics\
  \ AX 2009 应用程序集成框架\n\nAIF 模块的配置涉及多个步骤。它也有助于提高您对 Dynamics AX 设置的细粒度以及为集成可能高度敏感的数据而考虑的安全性考虑的理解。建议此设置以管理员级别的安全性完成，然而只需要对\
  \ AIF 模块完全控制。此设置在 Dynamics AX 2009 之前的版本中几乎相同；将注明细微差异。\n\n- 1. 所有 AIF 设置表都可以在 Dynamics\
  \ AX 下的 **Basic | Setup | Application Integration Framework** 中找到。\n- 2. 第一步相当简单，但至关重要。在\
  \ **Transport Adapters** 表单中，添加新条目，选择 **Adapter Class** 下拉菜单 **AifBizTalkAdapter**，选择\
  \ **Active**，并且 **Direction** 将为 **Receive and Respond**。您还会注意到还有两个开箱即用的适配器：FILE\
  \ 和 MSMQ。这是一次性设置，对所有公司都有效。\n- 3. 接下来，使用 **Channels** 表单为特定的 BizTalk 服务器设置活动通道。选择有意义且可识别的\
  \ **Channel ID** 和 **Name**，例如 **BizTalkChannelID** 和 **BizTalkChannel**。将 **Adapter**\
  \ 选择为 **BizTalk Adapter**，勾选 **Active**，将 **Direction** 设置为 **Both**，**Response\
  \ channel** 等于 **BizTalkChannelID** 的 Channel ID。将 **Address** 设置为您的 BizTalk 服务器（如下所示的\
  \ **I2CDARS1**）。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_432_0.png)\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_433_0.png)\n\
  \n- 4. 然后，单击 Configure 以调出 BizTalk 适配器配置表单。再次将 Server name 设置为 BizTalk 服务器实例的名称。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_433_1.png)\n\n- 5. 此配置在运行时安全连接时是必需的。当使用架构导入向导时，Visual\
  \ Studio 连接到 Dynamics AX 2009 实例也需要此配置（我们将在本章后面执行此操作）。这也是跨所有公司的一次性设置。\n- 6. 现在，在此步骤中，我们将从\
  \ Local endpoints 表单设置本地端点。BizTalk 应用程序需要连接的每个公司都需要一个本地端点。选择要配置的公司（在我们的例子中为 CDF）并输入\
  \ CDFLocalEndpoint，如图所示。\n\n> 我们建议使用这种命名约定（Company + 'LocalEndpoint'），因为通常您的 BizTalk\
  \ 应用程序需要指定此值。通常，传入消息将包含用于确定其目标公司的信息，因此您需要在运行时动态确定本地端点。请参阅本章后面的演练示例，其中我们需要向多个 Dynamics\
  \ AX 公司发送汇率。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_434_0.png)\n\n- 7. 接下来，我们需要从\
  \ Endpoints 表单创建端点。端点将我们的本地端点、BizTalk 通道、BizTalk 服务帐户和活动的 Dynamics AX 操作链接在一起。同样，每个公司都需要一个本地端点，因此我们将使用相同的命名约定。\n\
  - 8. 我们将首先将 Endpoint ID 输入为 CDFEndpoint 并将 Local endpoint ID 选择为 CDFLocalEndpoint。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_434_1.png)\n\n- 9. 在 General 选项卡上，将 Outbound\
  \ channel ID 指定为 BizTalkChannelID，即我们在上面创建的。这也将允许使用 BizTalk 适配器从 Dynamics AX 2009\
  \ 检索异步传出消息。\n\n\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_435_0.png)\n\n10. 在“Constraints”选项卡上，我们将勾选“无约束”。如有需要，您可以指定诸如“Customer”和“Vendor”之类的约束。现在，从“General”选项卡将记录设置为“Active”，然后保存。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_435_1.png)\n\n11. 在**Users**选项卡上，我们将添加\
  \ AX BizTalk 用户（链接到我们的 BizTalk 主机实例运行所在的 Active Directory 账户），方法是选择**User type**为**User**，然后选择\
  \ AX BizTalk（示例中为 **cdar**）用户。因此，AX 中的所有记录都将以此账户作为创建用户。根据您的集成需求，此用户可能还需要其他关联，例如员工。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_436_0.png)\n\n12. 下一步要做的事情（在 AX 中完成 AIF\
  \ 基础配置设置后）是确定我们将使用哪些**AIF Services**。这将使我们知道使用哪些服务以及需要启用哪些服务。每个服务都有多个相关操作。如果开箱即用的服务中没有满足我们需求的操作，我们可以自定义现有服务或创建自己的服务。这正是\
  \ Dynamics AX 自定义速度和便捷性的优势所在。\n\n> 注：在 AX 2009 之前，操作未分组到服务中，因此不存在 AIF Services 表。\n\
  \n13. 对于本示例（我们将在本章后面使用），我们必须使用开箱即用的服务**LedgerExchangeRatesService**。因此，我们将在**AIF\
  \ services**表单中启用此服务，如以下屏幕截图所示：\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_437_0.png)\n\
  \n14. 在 AIF Services 表单中，我们可以通过突出显示服务名称、单击“Service operations”、选择特定操作，然后单击“Parameter\
  \ schema”来检查每个服务的 AX 架构。操作包括 create、delete、find、findkeys、read 和 update。选择 SalesOrderService\
  \ 并注意 delete 和 update 操作没有传出架构，因为它们不返回消息。\n\nExchange Rates 表中的基本记录只需要三个字段：（1）Currency\
  \ code、（2）Exchange Rate 和（3）From Date。我们通常不指定结束日期，因为当输入下一天的汇率时，AX 逻辑会处理此问题。\n\n\
  每个 AIF 服务都与其自己的安全密钥相关联。您必须通过在 Dynamics AX 2009 中为所需的安全密钥分配用户权限来授予 DynamicsAX BizTalk\
  \ 用户账户访问权限。在较早版本的 Dynamics AX（AIF 中没有服务）中，安全权限必须手动处理。这可以通过创建具有执行每个 AIF 操作所需权限的安全组并将\
  \ Dynamics AX BizTalk 用户与该组关联来实现。\n\n1. 现在 AIF 服务已启用，我们可以转到**Actions**表单并查看已启用的四个操作。这些操作是\
  \ AIF **LedgerExchangeRatesService** 服务的一部分。请注意，如果不启用服务，就无法单独启用任何默认操作（在 Dynamics\
  \ AX 的早期版本中，每个单独的操作都需要启用）。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_438_0.png)\n\
  \n2. 对于每个 Dynamics AX 公司，您需要输入相对于基础货币的货币。因此，如果您有一个以 USD 为基础的公司，另一个以 CAD 为基础的公司，那么您需要在每个公司为每种货币输入汇率。以\
  \ USD 为基础的公司需要输入 USD/CAD 汇率，而以 CAD 为基础的公司需要输入 CAD/USD 汇率。因此，如果您使用**LedgerExchangeRatesService**\
  \ AIF 服务，则需要为每个公司的**Endpoint**重复以下 AIF **Actions** 设置。\n\n3. 现在，我们返回到**Endpoints**表单并单击**Action\
  \ policies**以打开**Endpoint Action Policies**表单。尽管我们已激活**LedgerExchangeRatesService**，但**Endpoint\
  \ Action Policies**是操作特定的，因此我们需要为每个操作创建一条记录。在这里，我们将从下拉列表中选择**Action ID**为**LedgerExchangeRatesService.create**；将**Status**设置为**Enabled**，将**Logging\
  \ Mode**设置为**Log All**。现在，我们需要保存记录。这将启用此表单上的**Configure**按钮，如以下屏幕截图所示：\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_439_0.png)\n\
  \n4. 接下来，单击“Configure”以打开“Parameter Data Policies”窗口。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_439_1.png)\n\
  \n5. 单击“Data policies”；这将打开“Endpoint Action data policies”表单。您会注意到只有必填字段已启用。在这里，我们可以对安全和数据策略进行非常细粒度的控制；然而，对于更复杂的\
  \ AX 操作，这可能会非常繁琐。因此，只需单击“Set”，然后单击“Enable all”即可。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_439_2.png)\n\
  \n如果您对任何 Dynamics AX 服务进行自定义，例如添加新字段，您需要（1）通过单击“Refresh”按钮（如下图所示）更新 AIF Services，以及（2）在“Endpoint\
  \ action data policies”表中启用该字段。\n\n通常，集成策略是不覆盖 Exchange Rate 表中（基于货币和日期）已存在的值。事实上，如果我们尝试发送重复的汇率，AIF\
  \ 将抛出错误。我们可以简单地捕获并忽略此错误；然而，这会在 AIF 异常日志中引入不必要的杂乱。由于我们可以将此表暴露给 AX 业务用户，因此我们希望尽可能限制\
  \ AIF 模块抛出的错误数量。\n\n6. 因此，在尝试推送汇率之前，我们希望查询 AX 以查看特定汇率是否已存在。为此，我们可以使用开箱即用的操作 LedgerExchangeRates.find。请注意，该操作的架构将返回汇率列表。因此，现在我们需要重复上述步骤，在\
  \ AIF Actions 表单中启用此操作，将其添加到我们的 AIF Endpoint 的 Action policies 中，并在 Endpoint Action\
  \ data policies 表单中启用所有字段。这完成了在 Dynamics AX 中对 AIF 模块的配置，以便进行本章后面的示例。\n\n## 同步演练示例——货币汇率\n\
  \n理解使用 Dynamics AX BizTalk 适配器所需的行为和设置的最佳方式是通过完整示例进行演练。对许多使用 Dynamics AX 的公司而言，常见需求是填充货币汇率。通常，这需要在收盘汇率发布时每天进行。AX\
  \ 中的 Exchange Rates（总账 | 设置汇率）表不是跨公司的共享表，因此根据您的组织设置，您可能需要也可能不需要使用多个公司和多个汇率填充汇率表。我们将在以下示例中进一步解释这一点。我们发现这是在学习使用\
  \ BizTalk 和 Dynamics AX AIF 模块创建集成应用程序时开始的绝佳实践示例。\n\n对于本示例，我们假设我们的 Dynamics AX 实施中有两个公司；一个以加元（CAD）为基础，另一个以美元（USD）为基础。因此，我们需要重复本章前面显示的\
  \ AIF 设置过程，以便在两个公司中使用**LedgerExchangeRates.create**和**LedgerExchangeRates.find**操作。在本示例的其余部分中，我们将把它们称为**daxCADCompany**和**daxUSDCompany**。完整的解决方案，名为**Chapter9-AXExchangeRates**，包含在本章的源代码中。\n\
  \n## Dynamics AX 架构\n\n我们将首先在 Visual Studio 中创建一个新的 BizTalk 项目，**Chapter9-AXExchangeRates**。在\
  \ AIF 操作设置完成后（如本章前面所示），下一步是生成 BizTalk 应用程序所需的架构。这是通过在 Visual Studio 2010 中右键单击 BizTalk\
  \ 项目，单击**Add**，突出显示并单击**Add Generated Items**来完成的。这将打开**Add Generated Items**窗口，在**Templates**部分下\
  \ — **Visual Studio installed template**，选择**Add Adapter Metadata**，然后单击**Add**。这将打开**Add\
  \ Adapter Wizard**窗口（如以下屏幕截图所示），因此我们只需选择**Microsoft Dynamics AX 2009**并单击**Next**。现在，我们需要在**Server\
  \ name**下填写 AX 服务器实例名称（在我们的示例中为**AX 2009-SHARED**），以及**TCP/IP Port**号（**2712**，这是默认端口号，但可能不同）。现在，从“BizTalk\
  \ Adapter for Microsoft Dynamics AX Schema Import Wizard”窗口单击**Next**。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_441_0.png)\n\
  \n\n\n在下一步中指定连接信息。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_442_0.png)\n\n在下一个窗口中，您应该可以看到所有活动的\
  \ AIF 服务。请注意，由于 AIF 服务表是全局表，因此您将看到 Dynamics AX 实例中的所有活动服务。这并不意味着每个端点，即每个公司，都配置为接受每个列出的\
  \ AIF 服务所提供的操作。这是您首先验证连接性和 AIF 设置是否正确的地方。使用向导在此处出现错误通常是由于 AIF 通道配置错误造成的。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_442_1.png)\n\
  \n在上方的向导窗口中，您可以看到已启用的 AIF 服务。在我们的例子中，ExchangeRatesService 是我们 Dynamics AX 实例中当前唯一启用的服务。在该服务下，您将看到三种可能的模式（sync、async\
  \ request 和 async response）来执行这些操作。这三种模式实际上都会生成相同的架构。我们使用哪种模式和操作（create、find、findkeys\
  \ 或 read）实际上是由我们将发送到 AX 的消息中的元数据以及我们在编排中的逻辑端口配置决定的。现在，单击 Finish。\n\n现在在项目解决方案中，我们可以看到向导将生成两个工件。第一个\
  \ ExchangeRates_ExchangeRates.xsd 是调用 LedgerExchangeRates.create 操作时需要发送的消息类型的架构，并且它也是调用\
  \ LedgerExchangeRates.find 操作时在响应消息中返回的相同架构。由于我们在两个操作中实际上都在处理同一个 AX 表，即 Exchange\
  \ Rates，两个操作在部分上（一个将是入站消息，另一个将是出站消息）都需要相同的架构。\n\n第二个工件 BizTalk Orchestration.odx\
  \ 也由向导默认生成。在编排视图中，我们可以看到还向编排添加了四个多部分消息类型。将编排重命名为更有意义的名称，例如 ProcessExchangeRates.odx。\n\
  \n现在我们已经定义了将在响应消息中返回的消息类型，我们需要定义请求类型是什么。请注意，从编排视图中可以看到，两个消息 ExchangeRatesService_create_Response\
  \ 和 ExchangeRatesService_find_Request 的类型在 Visual Studio 中出现错误 ‘does not exist or\
  \ is invalid’。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_443_0.png)\n\n对于开箱即用的\
  \ find 操作，我们需要消息类型 DynamicsAX5.QueryCriteria。调用 create 操作时 AX 返回的另一个消息类型是 DynamicsAX5.EntityKey（如果我们调用\
  \ createList 操作，则返回的消息类型将为 DynamicsAX5.EntityKeyList）。\n\n这些消息类型的架构位于 **Microsoft.Dynamics.BizTalk.Adapter.Schemas**\
  \ 程序集中，该程序集可以在 BizTalk 适配器安装位置的 bin 目录中找到。在 Visual Studio 中将此引用添加到项目中。然后，如图所示，从\
  \ Select Artifact Type 窗口中重新选择每个无效 Message Part 的适当消息类型。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_444_0.png)\n\
  \n接下来，根据您的组织，通常您可能希望填充中午汇率或收盘汇率。对于我们的示例，我们将使用加拿大银行的收盘 USD/CAD 汇率。这在网站上于 16:30 EST\
  \ 发布（http://www.bankofcanada.ca/rss/fx/close/fx-close.xml）。\n\n由于此来源已是 XML，请下载并保存一个示例。然后我们使用\
  \ BizTalk Schema Generator 从 Visual Studio 生成架构（右键单击解决方案，**添加生成项**，**添加生成架构**，使用\
  \ **格式良好的 XML（未加载）** 文档类型）。这将生成我们 BizTalk 应用程序每天需要接收的消息的架构。在提供的示例中，架构是 **ClosingFxRates.xsd**（向导将生成另外四个\
  \ .xsd 文件，这些文件在 ClosingFxRates.xsd 中被引用）。\n\n安排下载此 XML 数据文件的一种简单方法是使用 Schedule Task\
  \ Adapter（http://biztalkscheduledtask.codeplex.com/），该适配器可以免费下载和安装（源代码也可用）。下载并安装适配器（需要\
  \ Microsoft .NET Framework 版本 1.1 可再发行组件包），然后使用 BizTalk Server 管理控制台以名称 **Schedule**\
  \ 添加。我们将在接收位置使用此适配器通过 http 检索 XML。还有可供购买的 RSS 适配器，例如来自 nsoftware（http://www.nsoftware.com/）。但是，对于本示例，计划任务适配器就足够了。\n\
  \n现在，由于我们的汇率来源是第三方架构，并且您对来源的具体要求很可能有所不同，我们将创建一个规范架构 **ExchangeRates.xsd**。如下面架构所示，我们只对几条信息感兴趣：**基准货币**（在我们的示例中为\
  \ USD 或 CAD）、**目标货币**（同样为 USD 或 CAD）、**汇率**，最后是**日期**。创建规范架构也将简化我们解决方案的其余部分。\n\n\
  ![](img/23d1402649b6528b085cd6b900a2c9c3_445_0.png)\n\n现在我们已经为消息类型定义或引用了所有架构，我们可以向编排添加所需的消息。\n\
  \n我们将首先添加消息 **msgClosingFxRates**。这将是我们来自加拿大银行的原始输入数据，其消息类型来自生成的架构 **ClosingFxRates.RDF**。\n\
  \n对于每个汇率，我们首先需要查询 Dynamics AX 以查看它是否存在，因此我们需要请求消息和响应消息。添加消息 **msgAXQueryExchangeRatesRequest**，它将是多部分消息类型\
  \ **ExchangeRatesService_find_Request**，以及 **msgAXQueryExchangeRatesResponse**，它将是多部分消息类型\
  \ **ExchangeRatesService_find_Response**。\n\n接下来，我们将创建发送和接收 XML 以从 Dynamics AX 创建汇率的消息。添加消息\
  \ **msgAXCreateExchangeRatesRequest**，它将是 **ExchangeRatesService_create_Request**\
  \ 的多部分消息类型，以及 **msgAXCreateExchangeRatesResponse**，它将是多部分消息类型 **ExchangeRatesService_create_Response。**\n\
  \n最后，我们需要创建两个消息，**msgExchangeRatesUSDCAD** 和 **msgExchangeRatesCADUSD**，它们将具有规范架构\
  \ **ExchangeRates** 的消息类型。这些消息将分别包含 USD 到 CAD 和 CAD 到 USD 的汇率。我们创建这两个消息只是为了简化本示例的编排。在实践中，如果您要处理多个汇率，您需要在编排中添加逻辑来循环遍历您感兴趣的汇率列表，并仅使用一个类型为\
  \ **ExchangeRates** 的消息多次发送。\n\n正如我们在本章前面讨论的那样，我们需要知道 Dynamics AX 公司名称，以便在发送到 AX\
  \ 的消息中填充正确的源和目标端点的元数据。对于本示例，我们将使用 **daxCADCompany** 和 **daxUSDCompany** 变量对这两个公司名称进行硬编码，类型为\
  \ System.String。我们将添加一个变量 **needToLoadFxRateUSD**，类型为 System.Boolean，我们将在编排中使用它。此外，我们将对变量\
  \ **serviceAccountName** 进行硬编码，该变量为 BizTalk 主机实例运行所在的 Active Directory 服务帐户。最后，我们需要一个名为\
  \ **xpathQueryCADResultsExpression** 的变量，类型为 System.String，我们将用它来确定我们的查询响应消息。以下是消息和变量的编排视图：\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_446_0.png)\n\n现在，我们需要在编排中添加一个逻辑接收端口和两个逻辑发送端口。\n\
  \n为来自加拿大银行的 XML 收盘汇率创建一个新的逻辑接收端口，设置如下：\n\n| 属性 | 值 |\n|---|---|\n| 端口名称 | ReceiveClosingFxRates_Port\
  \ |\n| 端口类型名称 | ReceiveClosingFxRates_PortType |\n| 通信模式 | One-Way |\n| 通信方向 | 我将始终在此端口接收消息\
  \ |\n| 端口绑定 | 稍后指定 |\n\n创建一个新的发送-接收逻辑端口以查询 Dynamics AX，设置如下：\n\n| 属性 | 值 |\n|---|---|\n\
  | 端口名称 | QueryAXExchangeRates_Port |\n| 端口类型名称 | QueryAXExchangeRates_PortType |\n\
  | 通信模式 | Request-Response |\n| 通信方向 | 我将发送请求并接收响应 |\n| 端口绑定 | 稍后指定 |\n\n创建一个新的第二个发送-接收逻辑端口以发送汇率创建消息，设置如下：\n\
  \n| 属性 | 值 |\n|---|---|\n| 端口名称 | CreateAXExchangeRates_Port |\n| 端口类型名称 | CreateAXExchangeRates_PortType\
  \ |\n| 通信模式 | Request-Response |\n| 通信方向 | 我将发送请求并接收响应 |\n| 端口绑定 | 稍后指定 |\n\n接下来，我们需要创建两个映射，将加拿大银行的\
  \ XML 消息转换到我们的规范汇率消息。请参阅代码示例提供的这两个映射的详细信息。\n\n- ClosingFxRates_To_ExchangeRatesCADUSD.btm\n\
  \  - CAD 基准货币 – USD 目标货币\n- ClosingFxRates_To_ExchangeRatesUSDCAD.btm\n  - USD 基准货币\
  \ – CAD 目标货币\n\n\n\n再者，为了限制此示例的复杂性，我们在一定程度上对这两个映射进行了硬编码，以满足我们的特定需求。如果我们需要创建具有不同基础/目标货币组合的许多消息，那么我们将在编排中添加逻辑并创建更复杂的映射。\n\
  \n现在，我们需要创建另外两个映射，将我们的规范 ExchangeRates 架构转换为 (1) 查询 Dynamics AX 中特定汇率以及 (2) 由 BizTalk\
  \ Dynamics AX 适配器生成的 ExchangeRatesService_ExchangeRates AIF 架构。\n\n## Dynamics AX\
  \ 查询消息\n\nDynamicsAx5.QueryCriteria 架构在我们的映射 ExchangeRates_To_AXQueryExchangeRatesRequest.btm\
  \ 中显示。Dynamics AX 中的每个公司都将有一个基础货币，因此所有汇率都将相对于该基础。对于每个日期，只能存在针对特定目标货币的一个汇率，因此我们将构造一个查询并专门针对该日期进行筛选。我们的查询将返回特定日期下具有多种目标货币的所有汇率，因此我们将编写一个\
  \ XPath 表达式来查找我们感兴趣的汇率（将在本演练后面显示）。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_448_0.png)\n\
  \n在上面的映射中，我们将使用 String Concatenate functoid 来存储我们需要填充 QueryCriteria 架构的 DataSourceName、FieldName\
  \ 和 Operator 元素的常量。DataSource 是 Dynamics AX 2009 表名 ExchRates。FieldName 是表的列 FromDate。最后，我们将\
  \ Operator 设置为 Equal。\n\n## Dynamics AX 创建消息\n\n如映射 **ExchangeRates_To_AXCreateExchangeRatesRequest.btm**\
  \ 所示，转换相对简单。Dynamics AX 汇率基于相对于 100 的比例尺而不是 1，因此我们需要使用下面的 Multiplication functoid\
  \ 将来自我们的 **ExchangeRates** 架构的值乘以 100。请注意，我们可以对任何基础/目标货币组合使用此转换。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_449_0.png)\n\
  \n此外，请注意 **ExchangeRates** Dynamics AX 架构中没有维度。通常，在大多数面向业务的消息中，例如销售订单，架构将包含一个用于维度的元素。在这种情况下，我们建议首先在映射中添加与维度数量相同的\
  \ String Concatenate functoid，并在 Dynamics AX 架构中从上到下按顺序将链接添加到 **Dimension** 记录下的\
  \ **element** 字段，如下所示：\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_449_1.png)\n\n\
  如上所示，在每个 String Concatenate functoid 中，添加零长度字符串输入，然后将每个维度的适当映射逻辑作为输入添加到相对的 concatenate\
  \ functoid 中。这将确保每次在映射中添加/删除/更改链接时，输出消息都具有正确数量的维度元素并且顺序正确。为了保持映射的可读性，作为标准做法，您可以选择为映射维度创建一个新页面。\n\
  \n继续构建我们的编排，我们将在顶部添加一个 Receive 形状以接收来自加拿大银行的 msgClosingFxRtes 消息，并将 Activate 属性设置为\
  \ True。接下来，我们将添加两个 Construct 形状来构造规范消息 msgExchangeRatesUSDCAD 和 msgExchangeRatesCADUSD，每个形状都包含一个\
  \ transform 形状，分别使用 ClosingFxRates_To_ExchangeRatesUSDCAD.btm 和 ClosingFxRates_To_ExchangeRatesCADUSD.btm。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_450_0.png)\n\n## 编排设置\n\n现在，我们将添加另一个\
  \ Construct 形状来构造我们的第一个 msgAXQueryExchangeRatesRequest 消息（这将用于查询我们的基于 USD 的 Dynamics\
  \ AX 公司）。我们将为 ExchangeRates_To_AXQueryExchangeRatesRequest.btm 添加一个 Transform 形状，并使用\
  \ msgExchangeRatesUSDCAD 作为转换的输入。转换形状之后，我们需要添加 Message Assignment 形状以添加 AIF 元数据。Message\
  \ Assignment 形状的内容如下：\n\n```\nmsgAXQueryExchangeRatesRequest(DynamicsAx5.MessageId)\
  \ = System.String.Format(\"{0:B}\",System.Guid.NewGuid());\nmsgAXQueryExchangeRatesRequest(DynamicsAx5.Action)\
  \ = \"http://schemas.microsoft.com/dynamics/2008/01/services/ExchangeRatesService/find\"\
  ;\nmsgAXQueryExchangeRatesRequest(DynamicsAx5.DestinationEndpoint) = daxUSDCompany\
  \ + \"LocalEndpoint\";\nmsgAXQueryExchangeRatesRequest(DynamicsAx5.SourceEndpoint)\
  \ = daxUSDCompany + \"Endpoint\";\nmsgAXQueryExchangeRatesRequest(DynamicsAx5.SourceEndpointUser)\
  \ = serviceAccountName;\n```\n\n这一步我们可以看到 AIF 设置中的命名转换非常重要。消息中的 AIF 元数据决定了此消息 intended\
  \ for 哪个 **SourceEndpoint** 和 **DestinationEndpoint**（分别在 AIF 设置中为 **Endpoint**\
  \ 和 **Localendpoint** 表）。它还决定了消息针对哪个 AIF **Action** 执行。**SourceEndpointUser** 也必须在每个消息的元数据中明确设置。\n\
  \n现在，我们将添加一个 send 形状，后跟一个 **Receive** 形状以 **Send** **msgAXQueryExchangeRatesRequest**\
  \ 并接收 **msgAXQueryExchangeRatesResponse** 消息。现在，将 send 和 receive 形状连接到 **QueryAXExchangeRates_Port**\
  \ 端口，如以下图像所示：\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_451_0.png)\n\n接下来，我们将添加一个\
  \ expression 形状。由于我们将接收查询消息中指定的 **FromDate** 对应的所有汇率，我们需要确定基于 USD 的公司是否为 CAD 货币的对应条目。执行此操作的\
  \ expression 形状的内容如下：\n\n```\nxpathQueryCADResultsExpression = System.String.Format(\"\
  /*[local-name()='ExchangeRates']/*[local-name()='ExchRates']/*[local-name()='CurrencyCode'\
  \ and text()='{0}']\", \"CAD\");\n\n// If we find a result, then don't need to load\n\
  if (xpath(msgAXQueryExchangeRatesResponse.ReturnValue,\nxpathQueryCADResultsExpression)\
  \ != null)\n{\nneedToLoadFxRate = false;\n}\n```\n\n由于查询返回汇率列表，我们将使用 XPath 快速确定基础货币的汇率是否在该日期存在。你可能会注意到，我们在\
  \ **xpathQueryCADResultsExpression** 中对 **CAD** 货币代码进行了硬编码。在具有多个目标货币的更复杂场景中，你需要添加逻辑来查找你感兴趣的对应货币代码。此外，由于每天可能不会有每种货币的汇率（例如法定假日），你需要为每个货币/日期组合包含此逻辑。\n\
  \n现在，我们将基于 expression 形状中设置的 **needToLoadFxRate** 布尔变量添加一个 **Decide** 形状。如果我们找到了该日期的汇率，则不执行任何操作，否则我们将构造\
  \ **msgAXCreateExchangeRatesRequest** 消息并将其发送到 Dynamics AX。\n\n在 decide 形状中未找到汇率的分支中，我们将添加一个包含\
  \ transform 后跟 Message Assignment 形状的 Construct Message 形状。我们将使用的映射是 **ExchangeRates_To_AXCreateExchangeRatesRequest.btm**，输入为\
  \ **msgExchangeRatesUSDCAD** 消息。\n\n在 expression 形状中，我们需要再次添加 AIF 元数据。内容如下：\n\n\
  ```\nmsgAXCreateExchangeRatesRequest(DynamicsAx5.MessageId) = System.String.Format(\"\
  {0:B}\",System.Guid.NewGuid());\nmsgAXCreateExchangeRatesRequest(DynamicsAx5.Action)\
  \ = \"http://schemas.microsoft.com/dynamics/2008/01/services/ExchangeRatesService/create\"\
  ;\nmsgAXCreateExchangeRatesRequest(DynamicsAx5.DestinationEndpoint) = daxUSDCompany\
  \ + \"LocalEndpoint\";\nmsgAXCreateExchangeRatesRequest(DynamicsAx5.SourceEndpoint)\
  \ = daxUSDCompany + \"Endpoint\";\nmsgAXCreateExchangeRatesRequest(DynamicsAx5.SourceEndpointUser)\
  \ = serviceAccountName;\n```\n\n请注意，只有 **DynamicsAX5.Action** 与之前发送到 AX 的查询消息不同。另请注意此处使用了\
  \ **daxUSDCompany** 变量。\n\n现在，添加一个 **Send** 形状，后跟一个 **Receive** 形状以发送 **msgAXCreateExchangeRatesRequest**\
  \ 并接收 **msgAXCreateExchangeRatesResponse** 消息。现在，将 send 和 receive 形状连接到 **CreateAXExchangeRates_Port**。\n\
  \n\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_453_0.png)\n\n这样就完成了向我们的基于 USD 的\
  \ Dynamics AX 公司发送 USD - CAD 汇率的步骤。为了完成我们的示例，我们现在将为基于 CAD 的 Dynamics AX 公司添加 USD\
  \ - CAD 汇率的逻辑。因此，我们将使用 msgExchangeRatesCADUSD 和 daxCADCompany 替代 msgExchangeRatesUSDCAD\
  \ 和 daxUSDCompany，从编排设置步骤重复上述操作。参见完整的代码示例。\n\n在提供的示例源代码中，编排中没有内置错误处理。如果向 Dynamics\
  \ AX 发送消息时出现错误，端口将抛出异常。相当频繁地，尤其是在 AX 2009 之前的 Dynamics AX 版本中，错误消息有时可能相当通用或晦涩。连接错误会有一些有意义的错误消息；然而，逻辑错误则不会。这是因为\
  \ AIF 模块是一个面向外部的接口，因此最有帮助的详细错误消息可在 AIF 模块中的异常（基本 | 定期 | 应用程序集成框架 | 异常）表单中找到。\n\n\
  现在我们可以构建和部署解决方案，下一步将是在 BizTalk Server 管理控制台中设置我们的端口配置。\n\n## 端口配置\n\n我们将开始创建一个静态请求-响应发送端口，并输入名称\
  \ AXExchangeRates_SendReceivePort。\n\n- 1. 我们将把类型设置为 Microsoft Dynamics AX 2009，并分别将发送管道和接收管道设置为\
  \ XML Transmit 和 XML Receive。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_454_0.png)\n\
  \n- 2. 单击 Configure 以打开 Microsoft Dynamics AX 2009 传输属性窗口。\n- 3. 在此处，我们将从下拉列表中选择身份验证类型为\
  \ Host User，并将网关用户设置为 BizTalk 主机实例运行所在的 Active Directory 服务帐户。我们将 AOS 端口设置为 2712，AOS\
  \ 服务器设置为我们的 Dynamics AX 2009 服务器名称 AX 2009-SHARED。我们可以将默认的同步超时时间保留为 20 分钟。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_455_0.png)\n\
  \n- 4. 单击 Ok 保存此配置。\n- 5. 接下来，我们将通过创建一个名为 ReceiveClosingFxRates_ReceivePort 的单向接收端口继续端口配置，其接收位置名为\
  \ ReceiveClosingFxRates_ReceiveLocation。我们将使用类型为 Schedule 并将接收管道设置为 XML Receive。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_455_1.png)\n\n- 6. 接下来，单击 **Configure**\
  \ 以打开计划传输属性窗口。在此处，我们将输入 **名称** 为 **加拿大银行**，并将配置 **计划** 设置为 **每日计划**，**开始时间** 为 **下午5:00**（假设我们的服务器时间为\
  \ EST）。请注意，我们将配置为每天运行，无论周末或银行假日（此时没有新汇率可用），因为我们的编排在尝试创建新的汇率之前会先查询 AX。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_456_0.png)\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_456_1.png)\n\n- 7. 现在，从 **计划传输属性** 窗口中单击\
  \ **任务属性** 字段以打开 **任务属性** 窗口。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_457_0.png)\n\
  \n- 8. 在此处，单击 Find Task，这将打开程序集限定类型名称窗口。单击 Browse 按钮，选择 ScheduledTask.TaskComponents.dll\
  \ 程序集并单击打开。现在，双击 HttpDownload 并单击 Select。单击 Ok。最后，在任务属性窗口中，输入 URL http://www.bankofcanada.ca/rss/fx/close/fx-close.xml，由于不需要身份验证，请将用户名留空。单击\
  \ OK 两次并保存。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_457_1.png)\n\n- 9. 在编排属性中，我们将逻辑接收端口分配给刚刚创建的物理端口，并将两个传出逻辑端口都设置为物理发送端口以连接到\
  \ Dynamics AX 2009。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_458_0.png)\n\n-\
  \ 10. 在我们启动应用程序后，现在是测试的时候了。我们可以等待到下午 5:00，或者简单地将计划属性窗口中的开始时间更改为当前时间之后的几分钟。你将在 Windows\
  \ 事件日志中看到一条日志消息，指示计划任务的配置已更改。\n- 11. 在计划任务适配器触发并且编排成功完成后，导航到 Dynamics AX 2009 中的文档历史表单（基本\
  \ | 定期 | 应用程序集成框架 | 文档历史）。在此处，你将看到来自我们的 BizTalk 应用程序发送和接收的所有四条消息的日志。你还可以通过突出显示其中一个文档历史日志条目，单击\
  \ Document logs 打开文档日志表单，最后单击 View XML 来查看 XML 消息。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_459_0.png)\n\
  \n- 12. 验证汇率是否已在表中创建（总账 | 设置 | 汇率）。\n- 13. 请注意，文档历史表单是公司特定的，并将记录所有成功和出错的交易。然而，异常表单日志不是公司特定的。因此，尝试将异常链接到文档历史条目可能会很困难。\n\
  \n## 异步演练示例—Dynamics AX 消息流出\n\n现在使用 AIF XML 文档向 AX 发送数据的设置已完成，我们还可以使用 BizTalk 适配器通过此\
  \ AIF 模块从 Dynamics AX 检索数据。这是通过 AIF 队列管理器完成的。在整个 Dynamics AX 中，都有“发送电子邮件”按钮，可以让你将数据推送到\
  \ AIF 队列中，方向为传出。同样，异步传入消息具有入站方向参数。\n\n我们发现，与其在需要从 AIF 队列检索数据时在多个 BizTalk 解决方案中重复代码，更简单的方法是创建一个通用解决方案来实现此功能。此解决方案将通过在设定的时间间隔轮询队列，使用\
  \ BizTalk Dynamics AX 适配器检索所有数据。最小轮询间隔为 1 分钟，因此你放入 AIF 队列中的任何消息都不会立即被 BizTalk 消费。完整的解决方案（Chapter9-AXMessageOutflow）包含在本章的源代码中。\n\
  \n我们将开始在 Visual Studio 中创建一个新的 BizTalk 项目 Chapter9-AXMessageOutflow。添加一个新的编排 ProcessOutboundAXMessage.odx，它将是此示例所需的唯一编排。此外，我们需要添加对\
  \ Microsoft.Dynamics.BizTalk.Adapter.Schemas 程序集的引用并使用强名称密钥对项目进行签名。\n\n### 消息设置\n\
  \n接下来，我们将向我们的编排添加两个消息：**msgAxOutboundMessage** 和 **msgAXDocument**。这些将是此示例所需的唯一两个消息。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_460_0.png)\n\n第一个消息 **msgAXOutboundMessage**\
  \ 的类型为 **DynamicsAX5.Message.Envelope**。架构位于引用的 Microsoft.Dynamics.BizTalk.Adapter.Schemas\
  \ 程序集中。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_460_1.png)\n\nAIF 队列中的所有传出消息都是此类型。如下面的示例屏幕截图所示，我们在\
  \ header 节点中有一些元数据，但我们真正感兴趣的是 Body 节点的 XML 内容。Body 节点中 **MessageParts** 节点的内容将是类型为\
  \ **ExchangeRatesService_ExchangeRates.xsd**，我们在之前的示例中用它向 AX 发送相同的消息。因此，我们所需的所有入站和出站事务的架构都可以使用适配器生成。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_461_0.png)\n\n对于第二个消息，由于我们不想指定文档类型，我们将使用\
  \ System.Xml.XmlDocument 作为消息类型。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_461_1.png)\n\
  \n使用 System.Xml.XmlDocument 消息类型为此解决方案提供了很大的灵活性。我们可以将任何消息推送到 AIF 队列，而无需对该 BizTalk\
  \ 应用程序进行任何更改。只有使用应用程序可能需要添加消息的 AX 架构才能处理它。\n\n\n\n## Orchestration setup\n\n接下来，我们创建一个新的逻辑端口，用于接收来自\
  \ Dynamics AX 通过 AIF 队列发送的所有消息，设置如下：\n\n| 端口名称 | ReceiveAXOutboundMessage_Port |\n\
  | 端口类型名称 | ReceiveAXOutboundMessage_PortType |\n| 通信模式 | 单向 |\n| 通信端口方向 | 我将始终在此端口接收消息\
  \ |\n| 端口绑定 | 稍后指定 |\n\n此外，创建一个新的发送端口。在此示例中，我们只需使用 FILE 适配器发送到文件夹，以便可以轻松查看 XML 文档。实际上，其他\
  \ BizTalk 应用程序很可能会处理这些消息，因此您可以根据需要修改发送端口。发送端口设置：\n\n| 端口名称 | SendAXDocument_Port\
  \ |\n| 端口类型名称 | SendAXDocument_PortType |\n| 通信模式 | 单向 |\n| 通信端口方向 | 我将始终在此端口发送消息\
  \ |\n| 端口绑定 | 稍后指定 |\n\n接下来，我们需要在编排中添加以下内容：\n\n- 接收形状（接收 msgAXOutboundMessage 消息）\n\
  - 表达式形状（确定 msgAXDocument 的文件名）\n- 消息分配（构造 msgAXDocument 消息）\n- 发送形状（发送 msgAXDocument\
  \ 消息）\n\n我们还将添加两个变量（aifActionName 和 xpathExpression），类型为 System.String，以及 xmlDoc，类型为\
  \ System.Xml.XmlDocument。\n\n![](img/23d1402649b6528b085cd6b9002c9c3_463_0.png)\n\
  \n在表达式形状中，我们希望提取 AIF 操作，以便以类似的方式命名传出 XML 文档。这将使我们能够轻松识别来自 AX 的消息类型。\n\n接下来，我们将在接收下方表达式形状中放入以下内容以提取\
  \ AIF 操作名称，我们将在后续传出消息中使用它：\n\n```\naifActionName = msgAXOutboundMessage (DynamicsAx5.Action);\n\
  aifActionName = aifActionName.Substring(55,aifActionName.\nLastIndexOf('/') - 55);\n\
  ```\n\n现在，我们需要提取正文消息的内容，即我们感兴趣的 XML 文档。在消息分配形状中，我们将使用 XPath 来提取消息。我们感兴趣的是从 AX 通过\
  \ AIF 队列接收的 DynamicsAX5.Message.Envelope 消息中 Body 节点的内容。将以下代码添加到分配形状中以提取 XML，将其分配给我们传出的消息，并设置一个可以在发送端口中使用的通用名称：\n\
  \n```\n// Extract Contents of Body node in Envelope Message\nxpathExpression = \"\
  /*[local-name()='Envelope' and namespace-uri()='http://schemas.microsoft.com/dynamics/2008/01/documents/Message']/*[local-name()='Body'\n\
  and namespace-uri()='http://schemas.microsoft.com/dynamics/2008/01/documents/Message']\"\
  ;\n```\n\n```\nxmlDoc = xpath(msgAXOutboundMessage, xpathExpression);\n\n// Extract\
  \ the XML we are interested in\nxmlDoc.LoadXml(xmlDoc.FirstChild.FirstChild.InnerXml);\n\
  \n// Set the message to the XML Document\nmsgAXDocument = xmlDoc;\n\n// Assign FILE.ReceivedFileName\
  \ property\nmsgAXDocument(FILE.ReceivedFileName) = aifActionName;\n```\n\n我们现在可以构建并部署解决方案。接下来，我们将介绍物理端口的设置以及将其绑定到我们的编排。\n\
  \n## Port configuration\n\n创建一个新的接收端口 ReceiveAxOutboundMessage_ReceivePort，以及一个新的接收位置\
  \ ReceiveAxOutboundMessage_ReceiveLocation。将类型设置为 Microsoft Dynamics AX 2009，并且我们需要为接收管道选择\
  \ PassThruReceive。\n\n![](img/23d1402649b6528b085cd6b9002c9c3_464_0.png)\n\n点击 **配置**\
  \ 以打开 **Microsoft Dynamics AX 2009 传输属性** 窗口。在这里，我们将 **身份验证类型** 设置为 **主机用户**，将 **网关用户**\
  \ 设置为我们的 BizTalk 主机实例运行所在的 Active Directory 账户，**AOS 端口** 设置为 **2712**，**AOS 服务器**\
  \ 设置为我们的 AX 服务器名称（**AX 2009-SHARED**）。此外，我们将 **轮询间隔** 设置为 **1** 分钟，最后，我们必须将 **直通**\
  \ 设置为 **True**。这允许我们的解决方案在不解析消息的情况下使用适配器。如果我们将其设置为 `False`，适配器将在从 AIF 队列中移除消息之前尝试解析消息类型，如果不成功则将其设置为错误状态。\n\
  \n![](img/23d1402649b6528b085cd6b9002c9c3_465_0.png)\n\n接下来，我们将创建一个 **静态单向发送端口**，其\
  \ **名称** 设置为 **SendAxDocument_SendPort** 以绑定到我们的逻辑发送端口。将 **类型** 设置为 **文件**，**发送管道**\
  \ 设置为 **PassThruTransmit**，因为我们可能将不同类型的消息作为 XML 文档发送出去。\n\n![](img/23d1402649b6528b085cd6b9002c9c3_466_0.png)\n\
  \n点击 **配置** 以打开 **FILE 传输属性** 窗口。将 **目标文件夹** 设置为 **C:\\LOBIntegration\\Chapter09\\\
  Chapter9-AXMessageOutflow\\AXOutboundDocuments**，文件名设置为 **%SourceFileName% - %datetime%\
  \ - %MessageID%.xml**。每个消息类型的 **SourceFileName** 都是相同的，因为它在我们上面的编排中已设置为 Dynamics\
  \ AX 操作名称。**datetime** 添加到文件名属性中，因为我们通常在排查错误时发现它很有帮助，有时它也是未来集成逻辑所必需的。\n\n![](img/23d1402649b6528b085cd6b9002c9c3_466_1.png)\n\
  \n现在，我们将两个端口绑定到编排并启动 BizTalk 应用程序。由于 AIF 队列中没有我们需要提取的内容，因此在 BizTalk 服务器端我们看不到太多内容。但是，如果您登录到\
  \ Dynamics AX，转到 **在线用户（Administration | Online users）**，您可以验证您的 BizTalk 应用程序是否确实已连接。将有一个连接，其\
  \ **会话类型** 为 **Worker** 以验证您的连接。持续点击刷新按钮，您将看到 **会话类型** 为 **Business Connector**\
  \ 每分钟出现一次（我们的应用程序轮询间隔已设置在端口上）。\n\n![](img/23d1402649b6528b085cd6b9002c9c3_467_0.png)\n\
  \n现在我们已经验证了连接性，我们需要向 AIF 队列发送一条消息以运行测试。现在禁用接收位置，以便我们可以在 AX 内部看到正在发生的事情，然后再将其从队列中移除。\n\
  \n在 Dynamics AX 中的许多表单（例如汇率）中，您会看到 **电子发送** 按钮。点击汇率表上的按钮，您将看到 **电子发送文档** 窗口弹出。您需要选择一个\
  \ **端点 ID**，并且如果愿意，可以从选择按钮中输入筛选条件。请注意，只有启用了 LedgerExchangeRates AIF 服务操作的端点才会出现在下拉列表中。\n\
  \n![](img/23d1402649b6528b085cd6b9002c9c3_467_1.png)\n\n点击 **确定** 将消息发送到 AIF 队列。现在，尝试在\
  \ **会计科目表** 表（**总账 | 会计科目表**）上点击 **电子发送**，并注意以下屏幕截图中显示的错误消息。由于我们尚未激活此 AIF 服务，也未将服务的任何操作添加到任何端点，因此\
  \ Dynamics AX 不允许我们发送此消息。\n\n![](img/23d1402649b6528b085cd6b9002c9c3_468_0.png)\n\
  \n接下来，我们将打开 AIF **队列管理器** 表单（**基础 | 设置 | AIF | 队列管理器**），在这里我们可以看到刚刚从汇率表发送的消息。请注意，日志条目缺少通道和源端点。这是因为默认情况下，**电子发送**\
  \ 按钮是一个异步过程，需要运行批处理以根据 **目标端点** 的配置指定通道（在我们的例子中是 BizTalk）。\n\n![](img/23d1402649b6528b085cd6b9002c9c3_468_1.png)\n\
  \n## Batch setup in Dynamics AX\n\n现在我们需要设置一个批处理，以便通过 BizTalk 通道发送此传出消息。如果我们之前以异步模式从\
  \ BizTalk 发送过消息，它也会出现在这里，并且需要批处理才能处理。请注意，在 Dynamics AX 中也可以自定义方法，这些方法仍会将消息写入 AIF\
  \ 队列，但不需要批处理即可被我们的 BizTalk 应用程序提取。\n\nDynamics AX 2009 允许在服务器上运行批处理作业；但是，早期版本需要活动客户端才能运行批处理作业。可以想象，在生产环境中保持活动客户端打开以运行连续批处理作业，或在需要时手动启动批处理作业可能会非常麻烦。即使具有服务器端批处理作业功能，您也可以选择仅进行同步集成以消除对任何批处理作业的需求。\n\
  \n因此，对于此示例，我们需要创建一个批处理。首先，我们将在批处理作业（Basic | Inquiries | Batch job）表中创建一个新条目。我们输入作业描述为\
  \ AIF BATCH 并点击保存。\n\n![](img/23d1402649b6528b085cd6b9002c9c3_469_0.png)\n\n接下来，点击查看任务按钮，这将打开批处理任务表单。在这里，我们需要添加四个新条目，每个\
  \ AIF 类（AifOutboundProcessingService、AifInboundProcessingService、AIFgatewaySendService、AIFGatewayReceiveService）各一个，从下拉列表中选择并为每个设置公司账户。由于批处理任务是公司特定的，可以想象这可能会给您的集成流程带来显著的管理开销。\n\
  \n![](img/23d1402649b6528b085cd6b9002c9c3_469_1.png)\n\n\n\n配置完批处理任务后，保存并关闭窗口。返回“批处理作业”表单并点击“重复”按钮，这将打开下面的窗口。在这里，我们可以配置多个参数，但在本示例中只需将“重复模式计数”设置为\
  \ 1 并选择“分钟”。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_470_0.png)\n\n单击“确定”。再次返回批处理作业表单，点击“函数”按钮，这将打开“选择新状态”窗口。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_470_1.png)\n\n选择“等待”以激活批处理作业。现在，我们返回\
  \ AIF 队列管理器表单。约一分钟后点击刷新，你会看到之前发送的同一条传出记录。然而，你会注意到“通道”和“源端点”已被填充。另请注意，状态仍设置为“就绪”。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_471_0.png)\n\n现在，我们返回并在你的 BizTalk 解决方案上启用接收位置。你应该会看到该记录从\
  \ AIF 队列中移除，并在发送端口指定的文件夹中找到 XML 文档。\n\n请注意，我们刚刚从 AIF 队列中提取的这条记录将出现在 AIF 文档历史表中。你可以通过选择一条记录，点击“文档日志”，然后点击“查看\
  \ XML”来查看 XML。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_471_1.png)\n\n如果出现任何错误，详细消息将出现在\
  \ AIF 异常（Basic | Periodic | Application Integration Framework | Exceptions）表单中，并且队列管理器中传出记录的状态将更改为“错误”。可以修复错误，然后将状态改回“就绪”。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_471_2.png)\n\n例如，如果我们在端点配置中未指定传出通道，则在批处理作业执行时会出现上述错误。因此，我们可以返回，将\
  \ BizTalk 通道添加到配置中，将队列中消息的状态更改为“就绪”；然后，下次批处理作业执行时，该消息将准备好被我们的 BizTalk 应用程序提取。\n\n\
  ## 使用 .NET 业务连接器\n\n.NET 业务连接器允许在没有 BizTalk 的情况下与 AX 集成。BizTalk Dynamics 适配器实际上利用了\
  \ .NET 业务连接器。然而，它可以独立运行，不需要安装 BizTalk。\n\n从 Dynamics AX 设置安装中安装业务连接器。你会在 AX 安装屏幕的“可选组件”下看到它。为了使其运行，你不需要安装\
  \ Dynamics AX 客户端或其他任何 Dynamics 组件。请注意安装与你的 AX 环境版本完全匹配的正确版本；否则在运行时，你将在 Windows\
  \ 事件日志中收到一条通用错误消息，且没有任何明确的指示说明问题所在。\n\n业务连接器充当一个无 GUI 客户端，可以从自定义 .NET 程序集调用。安装时，会提示你输入将用于初始配置的\
  \ Dynamics 环境；此设置可在安装后更改。如本章源代码中包含的示例所示，可在运行时指定业务连接器配置的 AX 实例。最佳实践是使用你的 Dynamics\
  \ AX 系统管理员应提供的配置文件（这是 AX 客户端用于建立与 AOS 连接的相同配置文件）。如果在运行时未指定配置，则将使用业务连接器设置中的默认配置。运行\
  \ Microsoft Dynamics AX 配置实用工具来管理你的默认配置，如下所示：\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_473_0.png)\n\
  \n在随附的控制台应用程序示例中（完整解决方案 Chapter9-AXBusinessConnector 包含在本章源代码中），我们创建一个简单的会话对象来查询\
  \ Dynamics AX 中的表。更实用的示例将是调用一个带参数的静态方法，例如返回 AxaptaContainer 对象。有关 .NET Business\
  \ Connector 用法的更多详细信息，请参阅 http://msdn.microsoft.com/en-us/library/aa659581.aspx，因为仅此主题就可以写一整章，这并非本书的意图。\n\
  \n请注意，必须正确释放每个连接，因为如果发生错误，.NET 业务连接器不会自行处理。如你所想，未经监控可能会导致灾难性后果，可能需要重新启动你的 AOS。\n\
  \n就安全性而言，每个连接与使用 Dynamics AX 客户端的连接类似。因此，如果你的 AX 用户是多个安全组的成员，请注意可能的性能问题。另外，请记住 Dynamics\
  \ AX 中的类不是线程安全的，因此请验证你的集成逻辑是否考虑到了这一点。谨慎使用 .NET 业务连接器与你的自定义代码。\n\n此示例仅对 AX 表执行公司名称查询，但它确实指出了一些关键概念，包括连接的释放、重试的使用和身份验证。在\
  \ Program.cs 文件中，只需替换常量、构建并运行。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_474_0.png)\n\
  \n> 请注意，我们需要引用 **Microsoft.Dynamics.BusinessConnectorNet** 和 **System.Web** 程序集，并且提供的代码的“目标框架”设置为\
  \ **.Net Framework 3.5**\n\n## 其他开发和配置说明\n\n### 开发\n\n你的 Dynamics AX 集成需求很可能需要某种定制才能利用\
  \ AIF 模块。许多组织非常反对过度定制第三方系统。然而，Dynamics AX 是基于定制概念构建的，因此在集成定制开发需求方面通常可以达到一个平衡点。\n\
  \n可以创建自定义服务来集成几乎任何 Dynamics AX 对象，从而允许自定义查找、创建、读取、更新和删除操作。AX 4.0 SP2 之前的 Dynamics\
  \ AX 版本不允许在 AIF 操作中执行删除操作。如果需要，你可以自定义现有代码功能以执行删除操作，例如通过设置自定义标志。然而，你仍需要使用已公开的现有操作。\n\
  \n对于开发，建议在你的 Dynamics AX 开发实例中，以运行 Visual Studio 的用户为 Admin 安全组成员。你的生产 BizTalk 服务帐户也可以是\
  \ Admin 角色的成员，这使其成为一个功能强大的帐户，但消除了对细粒度安全要求的需要。\n\n### 配置\n\n通常，你的组织会运行多个 AOS 实例以确保高可用性和可接受的在线性能。你可以通过运行本章前面提到的批处理作业流程，在非高峰时段安排所有高资源需求的集成任务。然而，通常需要（或更倾向于）在接近实时进行业务级集成。为了最大限度地减少对在线用户的影响，你可能需要考虑仅为集成任务创建一个单独的\
  \ AOS。\n\n在 AIF 服务表单上，“刷新”按钮将扫描整个 AOT（应用程序对象树）中的 AIF 服务并填充所有找到的结果。如果登录用户对连接多个对象的特定服务只有部分权限，则生成的架构可能仅部分完整。因此，对此表（或更具体地说刷新按钮）的访问应尽可能限制为系统管理员。\n\
  \n### 维护\n\n在非高峰时段安排集成任务的缺点是，你的 BizTalk 和 Dynamics AX 支持人员在诊断错误方面的可用性要低得多。AX 集成的支持通常是业务知识和\
  \ BizTalk 技术集成技能的结合。我们强烈建议至少你的 BizTalk 支持团队拥有 AIF 队列管理器、异常和文档历史表单以及所有 AIF 配置表单的查看权限。对“在线用户”表单的查看权限对于确认连接也非常有帮助。\n\
  \n在 Dynamics AX 实例发生非计划中断后，你通常需要重新启动 BizTalk 主机实例以重新连接到 AOS。因此，我们建议在与你的其他应用程序不同的主机实例下运行\
  \ Dynamics AX 的 BizTalk 应用程序。对于使用 .NET Business Connector 的任何服务也同样适用。\n\n\n\n\n\
  ## 摘要\n\n在本章中，我们讨论了使用 BizTalk Dynamics AX 2009 适配器用于 BizTalk 集成应用程序的优势。我们介绍了 Dynamics\
  \ AX 2009 中 Application Integration Framework 模块所需的配置设置。\n\n在第一个示例中，我们使用了开箱即用的 AIF\
  \ 服务 **LedgerExchangeRatesService** 来创建一个货币汇率应用程序，演示了 BizTalk 适配器的同步集成模式。在第二个示例中，我们创建了一个通用解决方案来从\
  \ Dynamics 检索传出消息，这演示了异步集成（包括批处理作业）的要求。\n\n最后，我们提到了使用 **.NET Business Connector**\
  \ 与 Dynamics AX 集成，并讨论了在不利用 AIF 模块编写自定义应用程序时需要考虑的影响。在下一章中，我们将讨论与 Salesforce CRM\
  \ 的集成。一种流行的在 \"云\" 中运行的 CRM。\n"
- "## 10 集成 BizTalk Server 和 Salesforce.com\n\nSoftware as a Service (SaaS) 是企业软件中的一种趋势，不可忽视也不应忽视。合法的\
  \ SaaS 方案提供了一个高度可扩展、可靠且可配置的环境，该环境托管在组织之外。与传统的 Application Service Providers (ASP)\
  \ 不同，SaaS 提供商利用多租户、元数据驱动的架构，通常为所有用户运行单一实例和软件版本。这意味着客户没有前期基础设施成本，可以在没有重大“升级项目”的情况下看到定期软件更新，并可确保应用程序性能的强服务水平协议。\n\
  \n虽然我们可能会为特定解决方案采用 Salesforce.com 等 SaaS 产品，但我们对现有的托管关键信息和算法的本地系统该怎么办？如何在 SaaS 环境和本地源之间共享数据？我们将在本章中回答这个问题。\n\
  \n在本章中，我们将介绍：\n- Salesforce.com 是什么以及为什么我们可能希望将其与 BizTalk Server 连接\n- 如何使用 BizTalk\
  \ Server 从 Salesforce.com 拉取数据\n- 从 Salesforce.com 向 BizTalk Server 发送数据和查询请求的工具和技术\n\
  \n### 什么是 Salesforce.com？\n\nSalesforce.com 是一家云计算公司，销售企业软件解决方案的订阅。它是标准客户关系管理（CRM）重点领域（如销售、营销和客户服务）的可行选择。您会找到传统的\
  \ CRM 功能，如账户管理、客户跟踪、机会管理、销售历史、案例管理等等。Salesforce.com 还具有一些创新能力，例如 Chatter，这是一种类似\
  \ Facebook 的协作工具，用于在组织内共享信息。\n\nSalesforce.com 本身就是一个出色的产品，但对于技术人员来说，真正的兴奋点应保留给其底层\
  \ Force.com 平台。Force.com 是 Salesforce.com 构建的 Platform as a Service (PaaS) 软件。更重要的是，Salesforce.com\
  \ 已将 Force.com 平台开放给外部开发人员，以构建和扩展基于云的应用程序。\n\nForce.com 面向的是（结构化）数据驱动的应用程序，这些应用程序可以从云托管的基础平台服务集中受益。开发人员无需花费时间和精力构建托管基础设施、用户界面框架、Web\
  \ 服务层、安全框架和报表工具，而是可以使用 Force.com 的这些内置功能快速部署丰富、可靠且安全的系统。\n\n当我们在 Force.com 应用程序中编写代码时，我们使用一种名为\
  \ Apex 的 Java/C# 类似语言。它是 Force.com 应用程序专用语言，但您会发现它相当容易上手和理解。新的 Web 页面使用 Visualforce\
  \ 技术构建，该技术利用标准 HTML、JavaScript 和 Apex 特定标签。Force.com 应用程序中的每个对象都可以通过 SOAP 或 REST\
  \ 服务接口访问。这为将 Salesforce.com 数据与存储在其他地方的数据集成打开了大量场景。\n\n### 为什么要集成 Salesforce.com\
  \ 和 BizTalk Server？\n\nBizTalk Server 是一款世界级的集成服务器，擅长连接不同的应用程序、转换文档结构、桥接通信协议以及执行长时间运行的事务性工作流。超过一万家组织依靠\
  \ BizTalk Server 来分发数据并在系统之间协调交互。Salesforce.com 等 SaaS 解决方案只是组织企业架构的另一个组件，可被视为企业数据的第一类接收方和来源。\n\
  \n像任何企业软件一样，Salesforce.com 将成为某些信息的孤岛。然而，其数据可能需要其他业务领域成功运营。对于实例，当医生致电服务中心询问产品问题时，他们可能拥有完全不同部门可能感兴趣的医学专业。该客户记录可以从\
  \ Salesforce.com 中提取并与组织中的其他系统共享。同样，公司可能拥有本地数据聚合服务，其中保存的信息对 Salesforce.com 应用程序有用。\n\
  \n当我们将组织的集成服务器暴露给 Salesforce.com 时，这意味着我们可以帮助防止形成新的数据孤岛，同时仍能利用创新且可扩展的云软件。\n\n###\
  \ 从 BizTalk Server 与 Salesforce.com 通信\n\nBizTalk Server 如何向 Salesforce.com 或 Force.com\
  \ 应用程序发出请求？我们有几个可行的选择：第三方适配器或调用原生 Web 服务 API。\n\n供应商构建了许多适配器来加速与 Salesforce.com\
  \ 的集成。通过使用适配器，开发人员无需学习底层 API，也可避免构建扩展函数来解决 API 缺陷。其中一个适配器是 TwoConnect BizTalk Adapter\
  \ for Salesforce.com，它支持推送和拉取交互模式。此类适配器的有价值功能之一是它可以在 BizTalk Server 接收位置轮询 Salesforce.com。使用原生\
  \ BizTalk 适配器无法轻松可靠地轮询 Web 服务端点。\n\n尽管适配器可以加快开发并在底层系统 API 上引入有用的包装功能，但企业系统上可用 Web\
  \ 服务接口的日益普及意味着直接集成比以往任何时候都简单。消费 Web 服务是大多数开发人员工具箱的标准部分。本章剩余部分，我们将重点介绍在与 BizTalk\
  \ Server 集成时使用原生的 Salesforce.com API。\n\nBizTalk Server 获取 Salesforce.com 数据的最直接方法是使用查询策略。当\
  \ BizTalk 需要来自 Salesforce.com 的信息时，使用一套标准可用服务操作执行查询。本章后面我们将介绍一种从 Salesforce.com\
  \ 向 BizTalk 推送数据的有效方法，但在许多情况下，轮询或查询是更理想的模式。当一个系统向另一个系统推送数据时，目标系统无法控制数据的传输时间或数量。如果源系统中发生重大数据更改，则下游系统将被迫处理大量意外的负载。相反，当我们使用轮询或查询策略时，我们可以控制请求信息的时间，并且在\
  \ Salesforce.com 的情况下，规定单次请求返回的消息数量。\n\n正如您所期望的那样，BizTalk 可以对 Salesforce.com 数据执行丰富的操作。信息可以通过记录\
  \ ID 或时间戳检索，并使用 Salesforce Object Query Language (SOQL)，其看起来像 T-SQL 查询，或 Salesforce\
  \ Object Search Language 进行查询，后者对实体中的字段进行文本搜索。Salesforce.com 服务 API 还公开了广泛的“写入”操作，允许我们创建记录、更新记录、upsert\
  \ 记录（创建，或如果存在则更新它）、删除记录，甚至执行批量修改。\n\n在某些情况下，开箱即用的 API 并不能完全满足您的需求。例如，标准 API 不支持多对象事务。还有\
  \ API 限制，在特别频繁的交互中可能会达到。幸运的是，我们可以定义自定义服务，这些服务可能会做诸如捆绑相关操作或返回整个实体的特定子集之类的事情。与标准 Salesforce.com\
  \ 服务一样，自定义服务具有易于消费的 WSDL 定义。\n\nSalesforce.com 中的 Enterprise WSDL 定义了您特定 Salesforce.com\
  \ 账户中的所有标准、扩展和自定义对象。WSDL 始终是对象状态的最新视图，这意味着如果您向 Customer 对象添加新字段，该字段会立即在 WSDL 中可用。如果您定义自定义服务，则该特定服务可用唯一的\
  \ WSDL。\n\nSalesforce.com 宇宙中最重要的服务操作之一称为 `login`。每次对 Salesforce.com 业务操作的调用都需要在\
  \ HTTP 头中包含会话令牌。为了获取令牌，调用方将其 Salesforce.com 用户凭据以及账户特定的安全令牌发送到 `login` 函数。如果凭据有效，则该函数返回会话令牌和服务\
  \ URL。会话令牌具有可配置的生命周期，但每次调用服务操作时超时计数器都会重置。作为最佳实践，您应创建一个专用于集成交互的 Salesforce.com 用户账户，并在为\
  \ Salesforce.com 服务调用获取会话令牌时使用该账户。\n\n\n\n在本章的首次演示中，BizTalk Server 将接收一条消息，然后附加从\
  \ Salesforce.com 检索到的一些额外数据元素。在此场景中，我们的一位客户正在申请之前购买商品的报销，我们希望查找该客户的联系人详情，而这些详情恰好存储在\
  \ Salesforce.com 中。\n\n## 配置基础 BizTalk 组件\n\n我们的解决方案除了包含需要访问 Salesforce.com 数据的业务流程的中央编排之外，还需要一些核心架构：\n\
  \n- 1. 打开 `Chapter10-SFDC.sln` 解决方案并找到四个预建项目。第一个是将在后续练习中使用的 WCF 消息检查器行为。第二个项目是一个保存对\
  \ Salesforce.com 会话令牌引用的组件。下一个项目是一个简单的测试应用程序，用于验证我们的 Salesforce.com 凭据。最后一个是一个功能完整的\
  \ BizTalk 项目，将在最后一次练习中使用。\n- 2. 创建一个名为 `Chapter10-SFDC.AccountProcessing.ReimbApproval`\
  \ 的新 BizTalk Server 项目。设置项目的强名称密钥，并将部署应用程序值设置为 **Chapter10**。\n- 3. 添加一个名为 `ReimbursementRequest_XML.xsd`\
  \ 的新架构，并将目标命名空间设置为 **http://Chapter10-SFDC**。\n- 4. 按以下屏幕截图所示构建架构。此架构包含有关报销请求和客户联系信息的详细信息。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_481_0.png)\n\n- 5. 向项目添加名为 `ApprovalProcess.odx`\
  \ 的编排。此编排驱动报销的长时间运行的审批流程。\n- 6. 定义两个编排消息，表示初始请求和 Salesforce.com 增强的审查消息。第一个消息名为\
  \ **ReimburseInput**，第二个为 **ReimburseOutput**，两者类型均为 **Chapter10-SFDC.ReimbApproval.ReimbursementRequest_XML**。\n\
  - 7. 草拟一个编排流程，首先接收一条消息，然后为与 Salesforce.com 的待处理交互设置一个 **Group** 占位符，发送增强的响应消息以供审批，最后分发结果。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_482_0.png)\n\n## 自定义 Salesforce.com 数据实体\n\
  \nSalesforce.com 中的对象可以自定义，我们需要在 Account 实体上添加一些新字段。\n\n- 1. 登录到您的 Salesforce.com\
  \ 账户 (https://login.salesforce.com)，或创建一个新的免费账户。请注意，Salesforce.com 每季度发布一次，因此本章中所示内容不可避免地会出现细微的用户界面或功能差异。\n\
  - 2. 我们的大部分时间将花费在配置 Salesforce.com 上，这需要我们访问强大的设置屏幕。您可以通过在屏幕右上角姓名下方找到下拉菜单来访问该网站部分。\n\
  - 3. 在 App Setup 部分，我们的一个选项是扩展 Salesforce.com 原生提供的标准对象。在我们的案例中，我们希望为 Account 实体添加一些额外字段。展开\
  \ Customize 菜单，然后选择 Accounts 以找到 Fields 选项。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_483_0.png)\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_483_1.png)\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_483_2.png)\n\
  \n- 4. 在下一个屏幕上，我们可以看到所选实体的标准字段和自定义字段。我们的报销查找流程需要在 Account 实体上有一个“主要联系人”字段和一个“主要联系人电话号码”字段。页面底部有一个\
  \ **Account Custom Fields and Relationships** 部分。单击 **New** 按钮开始字段创建向导。\n- 5. 将此新字段的数据类型设置为\
  \ **Text** 值。我们也可以在这里考虑使用查找值，并指定一个特定的联系记录作为账户的主要联系人。\n- 6. 将此新字段的名称设置为 **PrimaryContactName**，并将其长度定义为\
  \ 100 个字符。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_484_0.png)\n\n- 7. 在随后的两个向导页面上保留默认的安全性和页面布局选项，并在最后一页单击\
  \ **Save & New**。这将创建新字段并重新启动向导。\n- 8. 对于此新字段的数据类型，选择 **Phone**，并将字段命名为 **PrimaryContactPhone**。\n\
  - 9. 将剩余选项保留为默认选择并保存新字段定义。\n- 10. 如果一切成功，您应该在实体定义上看到自定义字段（及其底层 API 名称）。请注意，Salesforce.com\
  \ 上的所有自定义字段都有“__c”后缀，这使得它们易于识别。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_485_0.png)\n\
  \n- 11. 回想一下，Salesforce.com 提供了 Enterprise WSDL 定义，描述了我们可以从本地软件系统交互的操作和实体。请注意，WSDL\
  \ 中同时提供自定义对象以及修改后的标准对象。WSDL 是动态生成的，因此它始终反映我的 Salesforce.com 对象模型的当前状态。\n- 12. 导航到\
  \ App Setup 部分，然后是 Develop，然后是 API 以找到指向 Enterprise WSDL 的链接。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_485_1.png)\n\
  \n- 13. 单击 Generate Enterprise WSDL 链接并将生成的 WSDL 文件以名称 SFDC_EnterpriseWSDL.wsdl\
  \ 保存到您的机器上。\n- 14. 在 Visual Studio 2010 中打开 WSDL 文件，找到 Account 对象并注意我们的两个自定义字段存在于该对象的定义中。\n\
  \n```\n<element name=\"PartnersFrom\" nillable=\"true\" ...>\n<element name=\"PartnersTo\"\
  \ nillable=\"true\" minOccur ...>\n<element name=\"Phone\" nillable=\"true\" minOccur\
  \ ...>\n<element name=\"PrimaryContactName__c\" nillable ...>\n<element name=\"\
  PrimaryContactPhone__c\" nillable ...>\n<element name=\"ProcessInstances\" nillable=\"\
  tr ...>\n<element name=\"ProcessSteps\" nillable=\"true\" ...>\n```\n\n## 在 BizTalk\
  \ Server 中使用 Salesforce.com WSDL\n\nSalesforce.com Enterprise WSDL 包含我们需要提取 Account\
  \ 数据的所有消息和函数定义。在此步骤中，我们将这些定义导入 BizTalk Server：\n\n- 1. 在撰写本文时下载的 WSDL 文件大小为 455KB，包含所有\
  \ Salesforce.com 对象和操作定义。如果您只需要单个对象或操作，您可以选择手动从 WSDL 中提取所需的架构并手工构建 BizTalk 消息端点。对于此场景，我们将引用整个\
  \ WSDL，并让 BizTalk 为我们生成架构、编排端口和绑定文件。如果您可能在多个项目中重用这些 Salesforce.com 工件，那么创建单独的 BizTalk\
  \ 项目来包含它们是有意义的。话虽如此，我们将继续在主要的 BizTalk Server 项目中添加对 Salesforce.com WSDL 的引用。\n-\
  \ 2. 右键单击我们的 BizTalk 项目并选择 **Add Generated Items**，然后选择 **Consume WCF Service**。\n\
  - 3. 一旦向导弹出，选择服务元数据的来源为 **Metadata files**，因为我们有一个物理 WSDL 文件需要使用。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_486_0.png)\n\
  \n- 4. 当提示添加元数据文件时，浏览到您机器上名为 `SFDC_EnterpriseWSDL.wsdl` 的 WSDL。\n- 5. 保留建议的命名空间并完成向导。\n\
  - 6. 向导会创建一系列文件：\n  - `SforceService.BindingInfo.xml` 文件包含创建 **WCF-BasicHttp** 发送端口所需的信息，该端口使用\
  \ Salesforce.com 服务。\n  - `SforceService.odx` 文件是一个编排，其中包含一个名为 **Soap** 的单个 **Port\
  \ Type** 定义，其中包含您可以在 Salesforce.com WSDL 上执行的所有操作。此编排还为每个与端口类型操作对应的输入和输出提供了多部分消息定义。\n\
  \  - `SforceService_Custom.BindingInfo.xml` 文件是 **WCF-Custom** 适配器绑定，为我们提供了进一步自定义对\
  \ Salesforce.com Web 服务调用的机会。\n  - `SforceService_enterprise_soap_sforce_com.xsd`\
  \ 架构描述了 Salesforce.com 操作使用的每个根消息类型（例如 `login`、`sendEmail`、`update`、`queryAll`）。底层消息类型位于不同的架构中。\n\
  \  - `SforceService_fault_enterprise_soap_sforce_com.xsd` 架构定义了 Salesforce.com 服务返回的所有可能故障类型。\n\
  \  - `SforceService_sobject_enterprise_soap_sforce_com.xsd` 架构保存了 Salesforce.com\
  \ 域中可用的所有业务实体（例如 **Account**、**Campaign**、**Case History**）。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_487_0.png)\n\
  \n\n\n- 7. 在我们原始的编排 `ApprovalProcess.odx` 中，创建一个新的配置端口，命名为 **CallSFDCPort**，它使用现有的、生成的端口\
  \ **Chapter10-SFDC.AccountProcessing.ReimbApproval.Soap**。将其设置为发送请求并接收响应，并稍后指定端口绑定。\n\
  \n- 8. 当编排端口配置向导完成后，我们会看到该服务中的每个操作都暴露在编排的端口表面上。这里有两个选择。首先，返回向导生成的编排并从端口类型中删除这些未使用的操作。如果我们将此\
  \ Salesforce.com 引用用于其他 BizTalk 项目计划使用的共享程序集中，这并不是非常实用。我们的第二个，也是最好的，选项是简单地忽略我们不需要的操作，并处理编排表面上的额外杂乱。\n\
  \n- 9. 创建 Salesforce.com 服务期望的输入和输出消息。第一个消息，命名为 **SFDC_QueryRequest**，是多部分类型 **Chapter10-SFDC.AccountProcessing.ReimbApproval.queryRequest**，第二个消息，命名为\
  \ **SFDC_QueryResponse**，是多部分类型 **Chapter10-SFDC.AccountProcessing.ReimbApproval.queryResponse**。\n\
  \n- 10. 向现有的 **Group** 占位符添加一个 **Transform** 形状，并将 **Construct Message** 形状的 **Message\
  \ Constructed** 值设置为 **SFDC_QueryRequest** 消息。此映射创建我们的服务查询消息。\n\n- 11. 双击 **Transform**\
  \ 形状并创建一个名为 **ReimbRequest_To_SFDCQuery** 的新映射，并选择 **ReimburseInput** 消息作为映射的 **Source\
  \ Transform**，以及 **SFDC_QueryRequest.parameters** 消息作为映射的 **Destination Transform**。\n\
  \n- 12. 目标架构的唯一字段 (`queryString`) 包含检索我们需要的 Account 属性所需的 Salesforce 对象查询语言 (SOQL)\
  \ 语句。将一个 **Scripting** functoid 拖到映射的网格表面。将 `AccountId` 字段从源架构拖入 functoid。\n\n-\
  \ 13. 双击 functoid 并切换到 **Script Functoid Configuration** 选项卡，并将 **Select script\
  \ type** 值设置为 **Inline C#**。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_488_0.png)\n\
  \n- 14. 在 functoid 的 **Inline Script** 窗口中添加以下代码，该代码接收来自源架构的 account ID 值并构建查询语句：\n\
  \n```\npublic string BuildSFDCQuery(string accountId)\n{\nstring query;\n\nquery\
  \ = \"SELECT Name, BillingStreet, BillingState, BillingCity,\nBillingPostalCode,\
  \ BillingCountry, PrimaryContactName__c,\nPrimaryContactPhone__c FROM Account WHERE\
  \ AccountNumber ='\" +\naccountId + \"'\";\n\nreturn query;\n}\n```\n\n- 15. 保存\
  \ functoid 的配置并将 functoid 连接到目标架构的 queryString 元素。\n\n- 16. 在 **Construct** 形状之后，添加一个\
  \ **Send** 形状（命名为 **Send Request**）和一个 **Receive**（命名为 **Receive Response**）形状。将\
  \ **SendRequest** 形状与 **SFDC_QueryRequest** 消息关联，并将 **Receive Response** 形状与 **SFDC_QueryResponse**\
  \ 消息关联。将这些形状连接到编排端口中的 **query** 操作。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_489_0.png)\n\
  \n- 17. 在 **Receive Response** 形状下方，拖动一个 **Transform** 形状。将 **Construct** 形状的 **Message\
  \ Constructed** 属性设置为 **ReimburseOutput**。\n\n- 18. 双击 Transform 形状并创建一个新的映射，其中有两个输入消息\
  \ ReimburseInput 和 SFDC_QueryResponse，以及 ReimburseOutput 作为唯一的输出消息。此多部分映射将两个输入值合并在一起，并生成一个完全填充的单个输出消息。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_490_0.png)\n\n- 19. 在新映射中，展开源架构中的第一个消息部分。将除\
  \ AccountDetails 下的字段之外的所有字段连接到目标架构。回想一下，我们的初始消息目前还没有任何联系人详细信息，因此没有理由映射这些字段。\n\n\
  ![](img/23d1402649b6528b085cd6b900a2c9c3_490_1.png)\n\n- 20. 接下来，将 Salesforce.com\
  \ 服务查询的输出映射到目标消息的 AccountDetails 部分。因为 Salesforce.com 查询响应返回一个 sObject 类型（代表所有已知类型），记录节点下的类型列表包含继承自\
  \ sObject 的所有可能类型。找到 Account 对象并将所需字段映射到目标架构。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_491_0.png)\n\
  \n- 21. 保存映射并返回到编排。创建一个编排接收端口，该端口吸收初始报销请求消息。\n\n- 22. 对于本示例，代替实际发送消息进行审查并更新后端应用程序，我们将设置\
  \ Expression 形状以写入系统事件日志。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_491_1.png)\n\
  \n```\nEventLog.WriteEntry(\"Application\", \"Routing Message\");\n```\n\n- 23.\
  \ 在编排的最底部添加一个新的 **Send** 形状，并将 **ReimburseOutput** 消息从编排中发送出去。这将确认我们已成功将 Salesforce.com\
  \ 数据与原始数据合并。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_492_0.png)\n\n- 24. 解决方案的开发部分几乎已完成。然而，请记住，我们对\
  \ Salesforce.com 的调用必须经过身份验证。对 Salesforce.com 的调用需要附加安全令牌，该令牌通过调用 Salesforce.com\
  \ 服务的 `login` 操作获取。在提供的 Visual Studio 2010 解决方案中有一个类库（`Chapter10-SFDC.TokenManager`），其中包含一个单例对象，该对象在初始化时调用\
  \ Salesforce.com 服务并检索会话令牌。单例每小时刷新一次令牌。请注意，Salesforce.com 令牌的默认超时时间为两小时。对 Salesforce.com\
  \ 服务的每次调用都会重置此超时的时钟。虽然您可以一次获取多个令牌（在单例被多个不同的 BizTalk 主机使用的情况下），请注意 Salesforce.com\
  \ 限制同时查询的数量（基于您拥有的 Salesforce.com 账户类型），因此您可能需要在解决方案中引入节流机制。\n\n- 25. 编辑 `TokenManager`\
  \ 类并包含您的 Salesforce.com 凭据（`sfdcUserName`、`sfdcPassword`、`sfdcSecurityToken`）。复合登录密码是账户安全令牌和账户密码的组合。构建此组件，然后运行\
  \ `Chapter10-SFDC.TokenTester.exe` 应用程序。此应用程序连接到 Salesforce.com 服务并尝试执行成功登录。如果凭据正确，我们将获得一个\
  \ `LoginResult` 对象，其中包含唯一的 Session ID 和服务 URL。复制并保存返回的服务 URL，因为我们稍后在 BizTalk 发送端口中需要它。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_493_0.png)\n\n- 26. 将 `Chapter10-SFDC.TokenManager.dll`\
  \ 组件添加到全局程序集缓存，然后在我们的 BizTalk 项目中添加对该组件的引用。\n\n- 27. 最后一个剩余的开发任务是将我们的会话令牌添加到传出消息中。此令牌不进入消息的有效负载，而是添加到传出标头中。在我们的编排中，并且在构建查询的\
  \ **Construct** 形状内，在 **Transform** 形状正下方放置一个 **Message Assignment** 形状。添加以下代码行。不要忘记在\
  \ `SessionHeader` 节点上放置命名空间，因为 Salesforce.com API 对此很严格，如果缺少命名空间，将返回无效令牌消息。\n\n\
  ```\nSFDC_QueryRequest(WCF.Headers) = \"<headers><SessionHeader xmlns='urn:enterprise.soap.sforce.com'><sessionId>\"\
  \ + Chapter10_SFDC.TokenManager.TokenManager.SessionId + \"</sessionId></SessionHeader></headers>\"\
  ;\n```\n\n- 28. 构建并部署 BizTalk 项目。\n\n- 29. 在离开 Visual Studio 2010 之前，生成 `ReimbursementRequest_XML.xsd`\
  \ 的 XML 实例并将其保存到项目文件夹中。\n\n## 配置 BizTalk 消息端口以调用 Salesforce.com\n\n我们的开发已完成，现在我们可以添加必要的\
  \ BizTalk 发送和接收端口来完成我们的解决方案：\n\n- 1. 打开 BizTalk 管理控制台并确认您拥有一个 **Chapter10** 应用程序。\n\
  \n\n\n- 2. 创建初始接收端口（**Chapter10.ReceiveReimbursementRequest**）、接收位置（**Chapter10.ReceiveReimbursementRequest.FILE**）以及最终发送端口（**Chapter10.SendCompleteReimbursement.FILE**）。所有文件适配器的地址都应指向解决方案文件夹中“FileDrop”部分的文件夹。\n\
  \n- 3. 请记住，添加对 Salesforce.com WSDL 的引用会生成一对绑定文件。在 BizTalk 管理控制台中右键单击 BizTalk 应用程序，然后选择\
  \ **Import**，然后选择 **Bindings**。指向 BizTalk 项目文件夹中的 `SforceService_Custom.BindingInfo.xml`。此操作会生成一个新的发送端口。\n\
  \n- 4. 打开名为 **WcfSendPort_SforceService_Soap_Custom** 的自定义发送端口。注意 **Address(URI)**\
  \ 值指向 Salesforce.com 登录服务。将此地址更改为我们之前使用的令牌测试应用程序返回的 URL。实际上，我们应该从 Login 操作中获取 Salesforce.com\
  \ URL 并动态设置到出站发送端口上。对于本示例，硬编码值就足够了。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_494_0.png)\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_494_1.png)\n\n- 5. 最后，转到控制台中的 Orchestrations\
  \ 文件夹并双击 **ApprovalProcess** 编排。切换到 **Bindings** 选项卡并配置主机、初始接收端口、服务发送端口和最终发送端口。启动发送端口、接收位置、编排和主机。\n\
  \n## 测试应用程序\n\n我们的代码已部署并且所需的消息配置已完成。剩下的就是测试我们的应用程序能否成功使用 Salesforce.com 数据丰富传入数据。\n\
  \n- 1. 要测试应用程序，请转到您的 Salesforce.com 站点并创建新账户，或从现有账户获取账户号码。将该值放入 BizTalk 将接收的 XML\
  \ 实例文件中。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_495_0.png)\n\n- 2. 发送报销请求并监视输出消息。如果一切配置正确，您将看到初始消息中的数据与\
  \ Salesforce.com Account 对象的结果合并。\n\n```\n<ns0:ReimbursementRequest xmlns:ns0=\"\
  http://Chapter10-SFDC.Accou\n  <AccountId>300</AccountId>\n  <RequestDate>2011-06-01</RequestDate>\n\
  \  <RequestDetails>\n    <ProductId>ABC</ProductId>\n    <Quantity>10</Quantity>\n\
  \    <ReasonCode>Too big.</ReasonCode>\n  </RequestDetails>\n  <AccountDetails>\n\
  \    <AccountName>Vandalay Industries</AccountName>\n    <BillingAddrStreet>1445\
  \ Main Street Suite 1004</BillingAddrStreet>\n    <BillingAddrCity>Los Angeles</BillingAddrCity>\n\
  \    <BillingAddrZip>92130</BillingAddrZip>\n    <BillingAddrZip>CA</BillingAddrZip>\n\
  \    <BillingAddrCountry>USA</BillingAddrCountry>\n  </AccountDetails>\n</ns0:ReimbursementRequest>\n\
  ```\n\n在本练习中，我们看到了如何自定义 Salesforce.com 对象并将 Account 记录提取到 BizTalk Server 编排中。Salesforce.com\
  \ Enterprise WSDL 使发现和消费我们需要的操作变得非常容易。\n\n## 从 Salesforce.com 向 BizTalk Server 通信\n\
  \n集成不应该是 SaaS 解决方案的单向模式。虽然大多数成熟的 SaaS 产品提供一组查询服务，但从云应用程序中检索本地数据通常没有强大的选项。事实证明，Salesforce.com\
  \ 提供了多种与外部应用程序集成的策略。\n\n首先，Salesforce.com 有一个名为 **Outbound Messaging** 的功能。使用 Outbound\
  \ Messaging，我们可以指定对给定实体的哪些更改应导致事件发送到外部 URL。此功能与 Salesforce.com 工作流直接相关。发送传出消息是工作流的一种可能操作。Outbound\
  \ Messaging 提供排队和可靠的传递，并在后台进程中运行。对外部服务的调用不是异步的，并且要求接收服务返回布尔确认。消息可能会被发送多次，因此我们的服务应该是幂等的，这意味着使用相同数据多次调用将成功执行且没有副作用。如果我们担心处理积压或意外先处理旧记录再处理新记录，我们可以选择在传出消息中发送会话令牌，并要求接收服务进行回调以实际提取记录的更改。\n\
  \n虽然 Outbound Messaging 非常有用，但也有一些缺点。首先，您无法对传出的 HTTP 请求进行任何自定义。这意味着如果您想添加 HTTP 标头或将数据转换为不同格式，您就无能为力。同样，每个\
  \ Outbound Message 都会生成特定的 WSDL，接收服务必须遵守它。当直接与遗留系统集成而不是通过集成服务器时，这可能是一个问题。\n\n虽然我们可以通过\
  \ WSDL 导入生成代理类直接从 Apex 代码调用 Web 服务，但您仍可以执行自定义操作存在限制。我们不会在此演示该特定功能，但我们将展示如何使用 Force.com\
  \ 中的本机函数执行低级 HTTP 请求和响应处理。当使用原始 Salesforce.com HTTP 对象时，我们控制服务消息的定义、服务的调用、任何编码或解码、密码学和安全。\n\
  \n接下来的两个练习首先向我们展示如何利用 Windows Azure AppFabric Service Bus 来促进 Outbound Messaging，其次如何从\
  \ Salesforce.com 向 BizTalk Server 执行低级 Apex 服务调用。为什么我们要将 Windows Azure AppFabric\
  \ 引入此场景？为了让 Salesforce.com 访问公司的服务，这些服务必须位于公共互联网上。组织可能不愿意公开其服务，而 AppFabric Service\
  \ Bus 提供了一种安全、干净的方式来将我们的服务保留在内部网络上，并避免在 extranet 中添加面向互联网的代理。\n\n## 从 Salesforce.com\
  \ 向 BizTalk Server 发送传出消息\n\n在此演示中，我们设置 Salesforce.com，以便每当 Account 记录的账单地址更改时发送传出消息。理想情况下，我们将使用\
  \ AppFabric Service Bus 的客户端身份验证功能来保护我们的本地服务。然而，我们无法控制 Salesforce.com 传出消息的低级 HTTP\
  \ 细节，因此无法直接使用 AppFabric Service Bus 进行身份验证。相反，我们将向入站 BizTalk 通道应用自定义 WCF 行为，该行为会在从\
  \ Salesforce.com 传出传输期间插入的唯一令牌。\n\n## 配置 Salesforce.com 工作流以使用传出消息\n\n在此练习的第一部分中，我们扩展\
  \ Account 对象，然后制作包含 Outbound Messaging 活动的工作流。\n\n- 1. 登录到您的 Salesforce.com 站点（假设您之前已注册免费\
  \ Force.com 账户）并转到设置屏幕。选择自定义 Accounts 对象。导航到字段视图。\n- 2. 创建一个新自定义字段，该字段将在 Salesforce.com\
  \ 发送消息之前填充令牌。选择文本数据类型。将名称设置为 AzureValidationToken。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_498_0.png)\n\
  \n- 3. 在向导的第四步中，当被要求将字段添加到页面时，取消选择所有选项，因为该字段不应在任何用户界面上可见。\n- 4. 在 App Setup 菜单下，选择\
  \ Create，然后选择 Workflow & Approvals。单击 Workflow Rules。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_499_0.png)\n\
  \n- 5. 单击 **New Rule** 按钮开始工作流向导，然后选择 **Account** 对象作为此工作流作用的实体。\n- 6. 接下来，将规则命名为\
  \ **BillingStreetChanged** 并将 **Evaluation Criteria** 设置为在 **每次创建或编辑记录时** 运行。\n\
  - 7. 设置规则在公式计算为 true 时运行，并将 `ISCHANGED(BillingStreet)` 设置为公式。此公式在字段的值与之前不同时返回 true。保存此配置并继续。\n\
  - 8. 指定两个工作流操作。第一个操作向 Account 对象添加唯一令牌，第二个工作流操作实际通过 Azure AppFabric Service Bus\
  \ 将传出消息发送到 BizTalk Server。\n- 9. 将第一个工作流操作设置为 **New Field Update**。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_499_1.png)\n\
  \n\n\n10. 将操作名称设置为 **SetAzureToken**，从 **要更新的字段** 列表中选择 **AzureValidationToken**\
  \ 字段，并指定一个 GUID 作为新值。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_500_0.png)\n\n\
  11. 选择为我们的 **BillingStreetChanged** 规则添加另一个工作流操作。选择 **New Outbound Message** 操作以利用\
  \ Salesforce.com 中的传出消息功能。\n\n12. 将传出消息名称设置为 **CallBillingUpdateService**，并输入一个临时的\
  \ **Endpoint URL**，例如 http://localhost。我们目前还没有本地服务的基于云的地址，因此暂时使用占位符地址即可。\n\n如果我们想要支持回调模式，可以选择在消息负载中发送\
  \ **SessionID**。选择发送以下字段：**AccountNumber**、**BillingStreet**、**BillingCity**、**BillingState**、**BillingPostalCode**、**BillingCountry**、**AzureValidationToken__c**、**Name**\
  \ 和 **LastModifiedDate**。**LastModifiedDate** 字段在您怀疑本地处理存在积压并且需要一种方法来查找最近更新时很有用。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_501_0.png)\n\n- 1. 保存传出消息配置。\n- 2. 在\
  \ App Setup 菜单下，在 Create 菜单和 Workflows & Approvals 菜单下，选择 Outbound Messages 链接。\n\
  - 3. 点击我们的传出消息的 Name 以查看其详细信息。将 Endpoint WSDL 以 workflowOutboundMessage.wsdl 的名称保存到您的开发机器上。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_501_1.png)\n\n## Building the BizTalk\
  \ recipient of the Outbound Message\n\n在设置好传出消息后，我们需要配置 BizTalk 以理解消息、公开接收服务并发送预期的确认：\n\
  \n- 1. 在现有的 Visual Studio 2010 解决方案中，创建一个新的空 BizTalk 项目，命名为 `Chapter10-SFDC.AccountProcessing.ChangeRouting`。\n\
  - 2. 为项目分配一个强名称密钥，并将部署应用程序设置为 **Chapter10**。\n- 3. 我们可以选择手动构建接收和处理 Salesforce.com\
  \ 传出消息的架构和匹配的编排端口，或者利用 BizTalk 的开发向导来完成大部分工作。右键单击 BizTalk 项目并选择 **Add Generated\
  \ Items**。\n- 4. 选择 **Consume WCF Service** 选项并选择 **Metadata files** 源。虽然我们通常使用此向导来使用\
  \ BizTalk 将调用的服务，但我们也可以用它来生成入站服务工件。\n- 5. 在向导的 Metadata files 页面上，浏览到您之前保存到机器上的\
  \ Salesforce.com WSDL。完成向导并导入引用。\n- 6. 向导的输出包括包含所有消息定义的架构以及包含描述交互的端口类型的编排。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_502_0.png)\n\
  \n- 7. Salesforce.com 传出消息进程需要服务提供确认。这意味着我们不能仅仅将消息接收到 BizTalk 中并进行路由。相反，我们需要一个能够向\
  \ Salesforce.com 返回同步布尔确认的编排。向项目添加一个新的编排，命名为 `ProcessSFDCMessage.odx`。\n- 8. 创建两个编排消息。第一个消息名为\
  \ **BillingChangeInput**，类型为 **Chapter10-SFDC.AccountProcessing.ChangeRouting.notificationsRequest**，而第二个消息名为\
  \ **BillingChangeOutput**，类型为 **Chapter10-SFDC.AccountProcessing.ChangeRouting.notificationsResponse**。\n\
  - 9. 我们通常使用任何生成的编排端口作为调用我们引用的服务的方式。然而，我们也可以使用此生成的端口来描述 **inbound** 交互。将新配置的端口拖到\
  \ **Port Surface** 并选择现有的 Port Type，命名为 **Chapter10-SFDC.AccountProcessing.ChangeRouting.NotificationPort**。选择接收请求并发送响应，然后完成端口配置向导。\n\
  - 10. 按以下顺序排列编排形状：**Receive** 形状、包含 **Message Assignment** 形状的 **Construct Message**\
  \ 形状、一个 **Send** 形状和另一个 **Send** 形状。此编排接收 Salesforce.com 传出消息，生成确认消息，将其返回给 Salesforce.com，最后将传出消息发布到\
  \ BizTalk 总线以进行进一步处理。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_503_0.png)\n\n\
  - 11. 最上面的 **Receive** 形状应使用 **BillingChangeInput** 编排消息。**Construct** 形状应将 **Message\
  \ Constructed** 值设置为 **BillingChangeOutput**。下一个 **Send** 形状应与 **BillingChangeOutput**\
  \ 消息关联，而最终的发送形状应与 **BillingChangeInput** 消息绑定。\n- 12. 创建一个新的编排变量，命名为 **tempXml**，其类型为\
  \ **System.Xml.XmlDocument**。\n- 13. 在 **Message Assignment** 形状中，实例化 **XmlDocument**\
  \ 变量，加载指示“true”确认的 XML 内容，并将变量设置为等于响应消息。\n- 14. 最后，创建一个配置好的编排端口以将我们接收到的计费更改事件发送出去以供进一步处理。选择稍后指定传输通道的选项。最终的编排应如下所示：\n\
  \n```\ntempXml = new System.Xml.XmlDocument();\ntempXml.LoadXml(\"<ns0:notificationsResponse\
  \ xmlns:ns0='http://soap.sforce.com/2005/09/outbound'><ns0:Ack>true</ns0:Ack></ns0:notificationsResponse>\"\
  );\n\nBillingChangeOutput.@response = tempXml;\n```\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_504_0.png)\n\
  \n- 15. 构建并部署应用程序，然后切换到 BizTalk Administration Console。\n- 16. 我们有几个服务托管选项可供选择。对于此场景，我们将直接在\
  \ BizTalk 进程内托管云端点，而不是在 IIS Web 服务器内托管。这不需要我们构建物理服务。通过创建一个新的 Request-Response 接收端口，命名为\
  \ **Chapter10.ReceiveBillingChangeNotification**，开始此步骤。\n- 17. 向该端口添加一个新的 Request-Response\
  \ 接收位置，命名为 **Chapter10.ReceiveBillingChangeNotification.HttpRelay**。将 **Type** 设置为\
  \ **WCF-Custom**，接收管道设置为 **XMLReceive**。\n- 18. 单击适配器类型旁边的 **Configure** 按钮。在 **General**\
  \ 选项卡上，将 **Address (URI)** 设置为 `https://<your namespace>.servicebus.windows.net/AccountProcessing/BillingChange.svc`。\n\
  - 19. 在 **Binding** 选项卡上，将 **Binding Type** 设置为 Azure 提供的 **basicHttpRelayBinding**。展开\
  \ **Security** 绑定配置，并确保安全模式设置为 **Transport**，并且 **relayClientAuthenticationType**\
  \ 为 **None**。请记住，Salesforce.com 传出消息传输详细信息不能由开发人员调整，因此我们不能正式发送额外的凭据或直接向 Service\
  \ Bus 进行身份验证。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_505_0.png)\n\n- 20. 导航到\
  \ **Behavior** 选项卡并添加一个新的 Endpoint 行为。从列表中选择 **transportClientEndpointBehavior**。此行为提供了\
  \ BizTalk 连接到 Service Bus 端点地址并监听所需的凭据。选择 **SharedSecret** 凭据类型并填写您的 AppFabric Service\
  \ Bus 帐户的 **issuerName** 和 **issuerSecret** 值。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_506_0.png)\n\
  \n- 21. 保存接收位置配置。\n- 22. 创建一个新的单向发送端口，命名为 **Chapter10.SendBillingChange.FILE**，我们的编排将绑定到该端口并向其发送计费更改消息。该端口应将其输出发送到文件系统。\n\
  - 23. 将 **ProcessSFDCMessage** 编排绑定到主机、relay 接收位置，最后绑定到 FILE 发送端口。\n- 24. 启动依赖的发送端口、编排，最后启动接收位置。如果接收位置配置正确，您现在应该在云上进行监听。\n\
  \n## Triggering the outbound message from Salesforce.com\n\n配置完成后，我们可以发起传出消息并确认\
  \ BizTalk 能够接收它：\n\n- 1. 返回您的 Salesforce.com 站点并编辑传出消息配置，使 Endpoint URL 现在指向 `https://<yournamespace>.servicebus.windows.net/AccountProcessing/BillingChange.svc`。确保我们的\
  \ workflow 规则已激活。\n\n\n\n\n- 2. 在你的 Salesforce.com 站点中查找一个账户并更改 **BillingStreet**\
  \ 值，以便触发我们的工作流并发送消息。\n- 3. 切换到 **Outbound Messages** 视图并点击 **View Message Delivery\
  \ Status** 按钮以查看传输状态。确认消息已接收到 BizTalk 中，并在文件系统上看到一条消息。\n- 4. 最后的练习是对我们的端点应用一层安全措施。目前，任何知道我们\
  \ Service Bus URL 的人都可以向此服务发送消息。为了解决这个问题，我们可以利用自定义 WCF 行为来定位并验证添加到我们传出消息中的长安全令牌。\n\
  - 5. 在 Visual Studio 2010 解决方案中，找到一个名为 `Chapter10.XmlMessageInspector` 的现有项目。此 WCF\
  \ 行为会查找指定的节点和值，除非找到它，否则用户会收到 HTTP 未授权错误，并且没有任何内容发布到 BizTalk MessageBox。构建此项目并将其添加到机器的全局程序集缓存中。\n\
  - 6. 为了使 BizTalk Server 识别此 WCF 行为，我们必须在 `System.ServiceModel/extensions.behaviorExtensions`\
  \ 节点下向 `machine.config` 文件添加一个条目：\n```\n<add name=\"XmlInspectorBehavior\" type=\"\
  Chapter10_SFDC.XmlMessageInspector.XpathInspectorBehaviorExtension, Chapter10-SFDC.XmlMessageInspector,\
  \ Version=1.0.0.0, Culture=neutral, PublicKeyToken=<your public key token>\"/>\n\
  ```\n- 7. 打开 BizTalk 管理控制台并找到连接到云的接收位置。双击接收位置，然后点击适配器类型旁边的 **Configure** 按钮。\n-\
  \ 8. 切换到 **Behavior** 选项卡并选择添加新的端点行为。找到 **XmlInspectorBehavior** 并选择它。将 **namespaceValue**\
  \ 属性设置为 **urn:sobject.enterprise.soap.sforce.com**。该行为将名为 \"custom\" 的 XPath 前缀映射到\
  \ **namespaceValue** 字段中指定的命名空间。因此，找到验证令牌的 XPath 语句可以表示为 **//custom:AzureValidationToken__c**。最后，设置此节点必须包含的实际值。在我们的例子中，它是在工作流规则中设置的\
  \ GUID 值。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_508_0.png)\n- 9. 保存配置并再次从\
  \ Salesforce.com 触发传出消息。所有操作应按预期进行，BizTalk 发送端口应发出一条消息。我们如何确认我们的 WCF 行为按预期工作？返回\
  \ Salesforce.com 并在 **Workflow & Approvals** 菜单下导航到 **Field Updates**。通过在现有 GUID\
  \ 末尾附加一个字符来更改公式值。通过这样做，我们在 Salesforce.com 发送的内容与 BizTalk Server 预期之间创建了不匹配。\n- 10.\
  \ 保存更新并通过更改账户的账单街道地址再次触发 Outbound Messaging。观察 **Outbound Messaging Delivery Status**\
  \ 中交付失败并显示 **HTTP 401 (Unauthorized)** 消息。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_508_1.png)\n\
  \n虽然这不是一种万无一失的安全机制，但此最后一步向我们展示了，如果我们发送错误的值，或完全省略该节点，服务调用将失败，BizTalk 将永远不会处理该消息。总的来说，Outbound\
  \ Messaging 是一项强大的功能，使 Salesforce.com 变得非常事件驱动，并减少了进行低效轮询操作的需求。\n\n## 从 Salesforce.com\
  \ 查询 BizTalk Server\n\nOutbound Messaging 很棒，但肯定会有一些情况，我们希望发送的不仅仅是对本地系统的事后异步请求。如果我们在本地系统中嵌入了敏感或复杂的查询数据，但在云中需要访问它们怎么办？我们可以选择复制这些数据和逻辑，但可能存在物流和法律上的原因导致这种做法并不理想。\n\
  \n相反，我们可以通过 Azure AppFabric Service Bus 将本地系统暴露给 Salesforce.com。为此，我们需要进行低级 Apex\
  \ 编程，以公开对原始 HTTP 请求和响应负载的访问。在之前的练习中，我们向传出消息中注入了一个长令牌，并在 BizTalk Server 中验证了该令牌。我们这样做是因为我们无法直接对\
  \ Service Bus 进行身份验证。然而，当我们进行 Apex 编程时，这就不是问题了。然而，一个新的挑战出现了：监听 Service Bus 的基于 REST\
  \ 的服务期望在 HTTP 头中包含访问控制令牌。这使得构建并将令牌附加到 Service Bus 调用变得容易。不幸的是，监听 Service Bus 的基于\
  \ SOAP 的服务期望在 SOAP 头中包含复杂的令牌，创建正确的令牌要困难得多。对于本章的解决方案，我们将在 BizTalk 生成的 SOAP 服务前面构建一个\
  \ REST 服务代理。这样，我们就可以在向 BizTalk Server 发送请求/回复消息之前正式对 Service Bus 进行身份验证。\n\n本次练习的最后一部分要求我们构建一个调用\
  \ Service Bus 的 Visualforce 页面。我们的完整解决方案反映了一个端到端场景，其中 Salesforce.com 用户需要本地数据，而\
  \ BizTalk Server 满足该请求。\n\n## 构建云启用的 REST 服务代理\n\n对于此场景，我们已经有一个正在运行的 BizTalk 流程，用于计算我们给予客户的折扣。这是我们不想在云中复制的专有知识。在这第一步中，我们将此\
  \ BizTalk 协调作为 Web 服务公开，并在其前面放置一个面向云的 REST Web 服务：\n- 1. 部署现有的 BizTalk 项目 `Chapter10-SFDC.AccountProcessing.ContractCalc.`\n\
  - 2. 启动 BizTalk WCF 服务部署向导，并从 LookupDiscountRate 协调创建新的 Web 服务（和接收位置）。完成向导并确保服务已成功部署到\
  \ Web 服务器。将新的接收位置绑定到 LookupDiscountRate 协调，并启动协调和相应的接收位置。\n- 3. 要创建面向云的 REST 代理服务，请返回\
  \ Visual Studio 2010 并向解决方案添加一个新网站。选择 WCF Service 类型并将站点命名为 Chapter10-SFDC.AccountProcessing.RestDiscountService。\n\
  - 4. 向我们之前从 BizTalk 项目生成的 WCF 服务添加一个名为 CalcServiceReference 的服务引用。\n- 5. 打开定义 Web\
  \ 服务接口的 IService.cs 文件。创建一个名为 Discount 的对象类型，表示 BizTalk 服务返回的负载的相关部分。\n```\n[DataContract\
  \ (Namespace=\"http://Chapter10-SFDC.AccountProcessing\")]\npublic class Discount\n\
  {\n    [DataMember]\n    public string AccountId { get; set; }\n    [DataMember]\n\
  \    public string DateDelivered { get; set; }\n    [DataMember]\n    public float\
  \ DiscountPercentage { get; set; }\n    [DataMember]\n    public bool IsBestRate\
  \ { get; set; }\n}\n```\n- 6. 为 IDiscountService 接口构建服务契约，该接口接收账户 ID 并返回 Discount\
  \ 对象。请注意，我们使用名为 WebGet 的 REST 属性装饰此操作，允许我们通过 URI 将输入值传递给服务。\n```\n[ServiceContract]\n\
  public interface IDiscountService\n{\n    [WebGet(UriTemplate=\"/{accountId}/Discount\"\
  )]\n    [OperationContract]\n    Discount GetDiscountDetails(string accountId);\n\
  }\n```\n- 7. 打开 Service.cs 文件并创建服务类并继承 IDiscountService 接口。向 BizTalk 生成的 Web 服务添加一个名为\
  \ CalcServiceReference 的服务引用，并插入调用服务所需的代码。\n```\npublic class DiscountService :\
  \ IDiscountService\n{\n    public Discount GetDiscountDetails(string accountId)\n\
  \    {\n        Discount customerDiscount = new Discount();\n        CalcServiceReference.Chapter10_SFDC_AccountProcessing_ContractCalc_LookupDiscountRate_ReceiveDiscountRequestPortClient\
  \ client = new CalcServiceReference.Chapter10_SFDC_AccountProcessing_ContractCalc_LookupDiscountRate_ReceiveDiscountRequestPortClient();\n\
  \n        CalcServiceReference.DiscountRequest req = new CalcServiceReference.DiscountRequest();\n\
  \        req.AccountId = accountId;\n\n        CalcServiceReference.Discount discount\
  \ = client.GenerateDiscount(req);\n\n        customerDiscount.AccountId = accountId;\n\
  \        customerDiscount.DateDelivered = discount.DateDelivered;\n        customerDiscount.DiscountPercentage\
  \ = discount.DiscountDetails.DiscountPercentage;\n        customerDiscount.IsBestRate\
  \ = discount.DiscountDetails.IsBestRate;\n\n        client.Close();\n\n        return\
  \ customerDiscount;\n    }\n}\n```\n- 8. 打开 Service.svc 文件并确保更新引用的服务类，并为我们的 REST\
  \ 服务添加 Factory 属性。\n```\n<%@ ServiceHost Language=\"C#\" Debug=\"true\" Service=\"\
  DiscountService\" CodeBehind=\"~/App_Code/Service.cs\" Factory=\"System.ServiceModel.Activation.WebServiceHostFactory\"\
  \ %>\n```\n- 9. 接下来，更新 web.config 文件以将此 REST 服务连接到云。首先，我们创建一个绑定元素并指定需要客户端安全。我们的先前（传出消息）服务关闭了客户端安全并强制服务对用户进行身份验证。在此示例中，我们强制\
  \ Salesforce.com 在传输请求之前提供有效的 Service Bus 身份验证令牌。\n```\n<bindings>\n<webHttpRelayBinding>\n\
  <binding name=\"WebRestBinding\">\n```\n\n```\n<security relayClientAuthenticationType=\"\
  RelayAccessToken\" />\n</binding>\n</webHttpRelayBinding>\n</bindings>\n```\n\n\
  10. 定义一个行为，指定本地服务的连接详细信息以及用于 RESTful 服务的 webHttp 行为。这些凭据在服务尝试在云地址上开始侦听时发送到 Service\
  \ Bus。\n\n```\n<endpointBehaviors>\n    <behavior name=\"CloudBehavior\">\n    \
  \    <transportClientEndpointBehavior>\n            <clientCredentials>\n      \
  \          <sharedSecret issuerName=\"owner\" issuerSecret=\"your secret\" />\n\
  \            </clientCredentials>\n        </transportClientEndpointBehavior>\n\
  \        <webHttp />\n    </behavior>\n</endpointBehaviors>\n```\n\n11. 最后，我们通过定义服务和端点将所有内容连接起来。引用上面创建的绑定和行为。\n\
  \n```\n<services>\n<service name=\"DiscountService\">\n<endpoint\naddress=\"https://<your\
  \ namespace>.servicebus.windows.net/DiscountService\"\nbehaviorConfiguration=\"\
  CloudBehavior\" binding=\"webHttpRelayBinding\"\nbindingConfiguration=\"WebRestBinding\"\
  \nname=\"CloudRestEndpoint\"\ncontract=\"IDiscountService\" />\n</service>\n</services>\n\
  ```\n\n12. 将服务部署到 IIS Web 服务器并启动服务。确保可以通过浏览到您的云服务端点（在我这里是 https://richardseroter.servicebus.windows.net/DiscountService/12345/Discount）成功连接，您应该会收到一条消息，提示授权标头丢失。我们的服务需要客户端身份验证，而浏览器不会传递有效的\
  \ Service Bus 凭据，因此此消息是预期的。\n\n## 构建一个消费云服务的 Visualforce 页面\n\n在本步骤中，我们构建一个 Visualforce\
  \ 页面和 Apex 控制器。控制器负责获取访问控制令牌，然后将该令牌传递到 Service Bus 调用中。Visualforce 页面包含显示 Account\
  \ 详细信息和 Service Bus 结果所需的标记：\n\n- 1. 我们的本地和云连接环境已准备好供使用。前往 Salesforce.com 并进入设置屏幕。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_513_0.png)\n\n- 2. 为了使 Apex 代码与 Azure\
  \ 之间的调用成功，我们必须显式允许对 Service Bus 端点的出站调用。具体来说，我们必须将 Azure 访问控制和 Service Bus URL 注册到我们的\
  \ Salesforce.com 账户。在管理设置下，导航到安全控制，并单击远程站点设置。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_513_1.png)\n\
  \n3. 单击 **新建远程站点** 按钮并提供名称 **AzureAC**，将 **Url** 设置为 `https://<your namespace>-sb.accesscontrol.windows.net`，并确保\
  \ **Active** 标志已选中。\n\n4. 再添加一个名为 **AzureSB** 的远程站点，并将 **Url** 设置为 `https://<your\
  \ namespace>.servicebus.windows.net`，并将站点设置为 **Active**。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_514_0.png)\n\
  \n5. 我们此处的目标是将从 BizTalk Server 查询到的折扣详细信息添加到账户对象中。因此，让我们扩展该对象以包含保存所需值的字段。在设置屏幕中，导航到\
  \ **App Setup**，然后 **Customize**，找到 **Accounts**。单击 **Fields** 链接。添加一个名为 **DiscountPercentage**\
  \ 的新字段，使用 **Percent** 数据类型，**Length** 为十六且最多保留两位小数。接下来，添加一个名为 **DiscountLastUpdated**\
  \ 的字段，其数据类型为 **Text**，长度为 50 个字符。最后，创建一个名为 **DiscountBestPrice** 的字段，使用 **Checkbox**\
  \ 数据类型。\n\n6. 通过查看 Salesforce.com 站点中的任何账户并找到新字段，确认我们的字段已成功添加。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_515_0.png)\n\
  \n7. 我们现在准备构建一个自定义 VisualForce 页面，显示账户详细信息并允许我们通过云查询 BizTalk Server 服务。Salesforce.com\
  \ 使用模型-视图-控制器（MVC）模式，我们的本地服务由控制器调用。需要构建的第一件事是自定义页面使用的控制器。导航到 App Setup，然后 Develop，选择\
  \ Apex Classes。单击 New 按钮构建新的 Apex 类。您看到的下一个屏幕是基于 Web 的 Apex IDE。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_515_1.png)\n\
  \n8. 在 Visualforce 环境中，我们可以选择控制器类型。标准控制器与开箱即用的 Salesforce.com 对象（如 Accounts）相关联。它们公开像\
  \ Save 这样的操作，可保存对底层对象的更改。自定义控制器是不使用标准控制器并指定全新行为的控制器。最后，控制器扩展扩展标准或自定义控制器。我们想要使用控制器扩展，以便在添加调用云的新功能的同时获得与\
  \ Account 控制器关联的现有操作和数据。通过定义指向活动账户的本地引用变量并在默认构造函数中实例化它来开始控制器类。\n\n```\npublic class\
  \ accountDiscountExtension{\n\nprivate final Account myAcct;\n\npublic accountDiscountExtension(ApexPages.StandardController\
  \ controller) {\n    this.myAcct = (Account)controller.getRecord();\n}\n\n}\n```\n\
  \n9. 定义将调用 Azure AppFabric 服务的操作。添加一个执行 HTTP 通信的 Http 对象变量。然后，为访问控制（AC）服务和 Service\
  \ Bus 服务添加 HTTP 请求对象。\n\n```\npublic void GetDiscountDetails()\n{\n    Http httpProxy\
  \ = new Http();\n    HttpRequest acReq = new HttpRequest();\n    HttpRequest sbReq\
  \ = new HttpRequest();\n}\n```\n\n10. 创建保存 AC URL 以及编码密码的变量。\n\n// ** Getting Security\
  \ Token from STS\nString acUrl =\n'https://<your namespace>-sb.accesscontrol.windows.net/WRAPv0.9/';\n\
  String encodedPW = EncodingUtil.urlEncode('<issuer password>',\n'UTF-8');\n\n11.\
  \ 设置 HTTP 请求以向 AC 服务执行 POST。请注意，我们手动构建负载，其中包含发行者名称、密码和请求的范围。请记住第 6 章中我们可以将发行者与范围关联到更细粒度的级别；实际上，您将为\
  \ Salesforce.com 定义一个发行者，并仅将其分配给其有权访问的范围。在本例中，我们将利用账户所有者凭据。\n\n```\nacReq.setEndpoint(acUrl);\n\
  acReq.setMethod('POST');\nacReq.setBody('wrap_name=owner&wrap_password=' + encodedPW\
  \ +\n'&wrap_scope=http://<your namespace>.servicebus.windows.net/');\nacReq.setHeader('Content-Type','application/x-www-form-urlencoded');\n\
  ```\n\n12. 我们现在准备调用 AC 服务。服务调用的结果被放入字符串变量以供后期处理。\n\n```\nHttpResponse acRes = httpProxy.send(acReq);\n\
  String acResult = acRes.getBody();\n```\n\n13. 我们从 AC 服务收到的令牌与 Service Bus 所需的格式并不完全匹配。来自\
  \ AC 服务的原始响应如下所示：\n\n```\nwrap_access_token=net.windows.servicebus.action%3dListen%252cSend%252cManage%26Issuer%3dhttps%253a%252f%252frichardseroter-sb.accesscontrol.windows.net%252f%26Audience%3dhttp%253a%252f%252frichardseroter.windows.net%26ExpiresOn%3d1290807349%26HMACSHA256%3dEcvt\
  \ eRJ9T1hDo9gwWT5MWwfhOL OOR eoeCKP9esor p7JA%253d&wrap_access_token_expires_in=1200\n\
  ```\n\n14. SB 不需要全部内容，因此我们需要解析出几部分。首先，删除与号（&）之后的部分（wrap_access_token_expires_in），然后提取开头部分（wrap_access_token=），最后进行\
  \ URL 解码。我们的令牌需要 WRAP access_token= 前缀，以便 Service Bus 知道提供了何种类型的身份验证。\n\n// clean\
  \ up result\n    String suffixRemoved = acResult.split('&')[0];\n    String prefixRemoved\
  \ = suffixRemoved.split('=')[1];\n    String decodedToken = EncodingUtil.urlDecode(prefixRemoved,\
  \ 'UTF-8');\n    String finalToken = 'WRAP access_token=\"' + decodedToken + '\"\
  ';\n\n15. 手持可供 Service Bus 使用的令牌后，我们可以调用 Service Bus 端点并调用我们的本地 BizTalk 服务（通过 REST\
  \ 代理）。由于我们拥有 REST 服务，HTTP 请求中没有需要传递的“正文”，因为所有详细信息都在 URL 中。我们使用客户的账户号码构建 REST URL，并向\
  \ HTTP 请求添加授权标头。\n\n```\nString sbUrl = 'https://<your namespace>.servicebus.windows.net/DiscountService/'\
  \ + myAcct.AccountNumber + '/Discount';\nsbReq.setEndpoint(sbUrl);\nsbReq.setMethod('GET');\n\
  sbReq.setHeader('Content-Type', 'text/xml');\nsbReq.setHeader('Authorization', finalToken);\n\
  ```\n\n\n\n16. 通过发送请求调用 Service Bus，然后将响应加载到 XML 文档中。\n\n```\n// invoke service\
  \ bus\nHttpResponse sbRes = httpProxy.send(sbReq);\nDom.Document responseDoc = sbRes.getBodyDocument();\n\
  Dom.XMLNode root = responseDoc.getRootElement();\n```\n\n17. 最后，解析响应并提取值以设置在账户字段上。\n\
  \n```\nmyAcct.DiscountPercentage__c = Decimal.valueOf\n    (root.getChildElement('DiscountPercentage',\n\
  \    'http://Chapter10-SFDC.AccountProcessing').getText());\nmyAcct.DiscountLastUpdated__c\
  \ = root.getChildElement\n    ('DateDelivered', 'http://Chapter10-SFDC.AccountProcessing').getText();\n\
  myAcct.DiscountBestPrice__c = Boolean.valueOf\n    (root.getChildElement('IsBestRate',\n\
  \    'http://Chapter10-SFDC.AccountProcessing').getText());\n```\n\n18. 我们现在可以构建自定义\
  \ Visualforce 页面。获取一个空白页面进行操作的一个简单方法是转到浏览器 URL 并输入一个（不存在的）页面地址，Salesforce.com 将提示你创建该页面。在服务器地址之后（在我这里是\
  \ https://na7.salesforce.com/），输入 apex/DiscountLookup。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_518_0.png)\n\
  \n19. 点击 Create Page DiscountLookup 链接，你将获得一个全新的空白 Visualforce 页面。如果已打开“开发模式”（设置、个人设置、我的个人信息、个人信息、开发模式复选框），你将在底部看到一个\
  \ Page Editor 按钮，可让你查看页面的源代码并实时编辑它。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_519_0.png)\n\
  \n20. 回想一下我们之前构建了一个控制器扩展，因此在此页声明中，我们希望同时调用 Account 对象的 standardController，以及扩展名\
  \ accountDiscountExtension。通过选择 Account 控制器，页面上会选中 Account 选项卡，并且我们可以在后续步骤中在 URL\
  \ 中提供账户 ID。\n\n```\n<apex:page standardController=\"Account\" extensions=\"accountDiscountExtension\"\
  >\n<!-- Begin Default Content REMOVE THIS -->\n<h1>Congratulations</h1>\n    This\
  \ is your new Page: DiscountLookup\n<!-- End Default Content REMOVE THIS -->\n</apex:page>\n\
  ```\n\n21. 我们希望在此页面上看到账户详情，而单个 Apex 标签即可使整个对象详情网格可见。relatedList 属性决定是否拉取相关详情或仅核心账户详情。在页面标签关闭之前立即添加此标签：\n\
  \n```\n<apex:detail relatedList=\"false\" />\n```\n\n22. 此时你的页面上仍不会显示任何内容，因为我们没有提供要显示的账户。显示的账户是从查询字符串值读取的。在\
  \ Salesforce.com 中查看当前账户并观察 URL。在我这里，该值为 https://na7.salesforce.com/001A00000SP1yr。从\
  \ URL 中提取唯一 ID，然后返回你的页面编辑视图，并在 URL 后附加 ?id=[你的账户 ID]，即可在页面上看到账户。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_520_0.png)\n\
  \n23. 对于五行代码来说，这已经是非常可观的页面内容了！接下来，用一个 Apex 页面块替换该默认占位符文本（从 begin default content\
  \ 注释开始，到 end default content 注释结束），该块将按名称欢迎用户并显示所选账户的名称。\n\n```\n<apex:pageBlock\
  \ title=\"Contract Discount Lookup\">\n  Hello {!$User.FirstName } <br />\n  You\
  \ are viewing the {!account.name} account.\n</apex:pageBlock>\n```\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_520_1.png)\n\
  \n24. 最后的任务是添加一个表单，显示来自账户的字段以及调用 Web 服务的按钮，然后将结果保存回账户。Save 按钮来自默认的 Account 控制器，而\
  \ Get Discount 按钮调用我们控制器扩展中的操作。带有 rendered=false 属性的 outputText 字段存在的原因是标准控制器会根据\
  \ Visualforce 页面中引用的字段查询账户对象。我们的控制器扩展需要 AccountNumber 字段来构建 REST 查询字符串，因此我们必须将该（不可见）字段放在表单上，以便控制器可以访问此字段。\n\
  \n```\n<br /><br />\n<apex:form >\n<apex:outputText value=\"{!account.AccountNumber}\"\
  \nrendered=\"false\"/>\n<b>Customer Discount Percentage: </b>{!account.\nDiscountPercentage__c}<br\
  \ />\n<b>Last Discount Calculation Date: </b> {!account.\nDiscountLastUpdated__c}\
  \ <br />\n<b>Is Best Discount: </b> {!account.DiscountBestPrice__c}<br /><br />\n\
  </>\n<apex:CommandButton value=\"Get Discount\" action=\"{!GetDiscountDetails}\"\
  /><apex:CommandButton value=\"Save\" action=\"{!save}\"/>\n</apex:form>\n```\n\n\
  ![](img/23d1402649b6528b085cd6b900a2c9c3_521_0.png)\n\n25. 确保云端点在线，如果在线，请点击 **获取折扣**\
  \ 按钮，让 Salesforce.com 调用我们的本地服务。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_522_0.png)\n\
  \n在本练习中，我们看到 Azure AppFabric Service Bus 不仅适用于 WCF 客户端。我们可以安全、快速地从 SaaS 环境利用本地资源，而无需不必要地复制数据或更改网络基础设施。\n\
  \n## 摘要\n\n在我们的第一个示例中，我们看到了如何在 BizTalk 解决方案中消费强类型的 Salesforce.com WSDL。在第二个示例集中，我们研究了从\
  \ Salesforce.com 向本地服务发送请求的策略。这两个演示都利用了 Windows Azure AppFabric 将消息从云中中继回内部服务。第一个示例使用了\
  \ Salesforce.com Outbound Messaging，使用嵌入在消息中的令牌来验证调用者。在第二个示例中，我们使用 Salesforce.com\
  \ APEX 代码获取 AppFabric Access Control 令牌并将我们的客户端认证到 Service Bus。然后请求消息被中继到代理服务，该服务随后将消息发送到\
  \ BizTalk Server。\n\n可以肯定的是，我们可以通过公开的服务或代理在 Salesforce.com 和我们的本地系统之间进行通信。如果你的组织具有成熟的\
  \ extranet 策略，并通过反向代理通信连接到内部服务，那么你不需要利用 Microsoft 云集成服务。然而，Windows Azure AppFabric\
  \ 为我们提供了一种以简单、安全的方式公开内部服务的方法，而无需额外的硬件或软件。\n\nSalesforce.com 是一个出色的 SaaS 环境，而 Force.com\
  \ 为解决方案开发开辟了新的可能性。只要对本地软件的投资存在，就需要集成技术。BizTalk Server 是 Salesforce.com 解决方案的强有力补充，因为它具有原生的\
  \ Web 服务适配器和强大的消息引擎。\n\n## 索引\n\n## 符号\n\n## A\n\n32-bit\n  与 64 位 161\n64-bit\n\
