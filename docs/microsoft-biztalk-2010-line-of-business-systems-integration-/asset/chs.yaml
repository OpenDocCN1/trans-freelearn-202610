  \ Echo 适配器附带完整源代码，位于 C:\\Program Files\\WCF LOB Adapter SDK\\Documents\\Samples\
  \ 目录，以及安装包。撰写本书时，Echo 适配器的设置包尚未更新以用于 Visual Studio 2010 和 .NET 4.0；为方便您使用，我们为 .NET\
  \ 4.0 32/64 位环境准备了设置，并将软件包放在包含本书代码示例的 ZIP 文件中。若尚未下载示例，请现在下载。\n\n## Echo 适配器\n\n\
  先简要讨论 Echo 适配器提供的功能。与 BizTalk Adapter Pack 2010 中的“大兄弟”一样，Echo 适配器支持两种消息交换模式。\n\n\
  \n\n生成工件的第一步是建立与目标系统的连接。大多数 LOB 系统在连接过程中需要有效的客户端凭据，我们的 Echo 系统也不例外，尽管它相当宽容——在 **Client\
  \ credential type** 下拉列表中选择 **Username** 后，您可以为 **User name** 和 **Password** 输入任何您喜欢的内容，但请不要留空。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_43_0.png)\n\n此外，除了有效的凭据外，为了建立连接，我们还需要提供主机名、端口号以及其他\
  \ LOB 应用程序特定的参数——这就是 **URI Properties** 选项卡的作用。切换到此选项卡并注意其中显示的属性。与用户名和密码一样，您可以输入任何您喜欢的内容或接受默认值。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_43_1.png)\n\n虽然 Echo Adapter 只需要三个元素来构建连接\
  \ URI，但来自 BizTalk Adapters Pack 2010 的实际适配器需要更多详细信息才能连接到其 LOB 系统。为便于比较，下图显示了建立与\
  \ SAP 的连接所需的属性：\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_44_0.png)\n\n- 最后，我们需要通过设置\
  \ Binding Properties 选项卡上显示的属性来配置适配器公开的绑定。对于我们的场景，我们可以接受所有属性的默认值。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_44_1.png)\n\
  \n现在，单击 **OK** 关闭 Configure Adapter 对话框并返回到 **Consume Adapter Service** 窗口。请注意，**Configure\
  \ a URI** 文本框现在包含一个已配置的连接字符串，该字符串由 URI 属性选项卡的值构建而成。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_45_0.png)\n\
  \n如果我们构建的连接字符串正确，单击 **Connect** 按钮将建立与 Echo 系统的活动连接。如果连接被接受，我们将看到类别树填充了传出类别——传出契约类型是\
  \ Consume Adapter Service 插件默认选择的类型。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_45_1.png)\n\
  \n接下来，我们需要选择要在应用程序中使用的操作并将它们添加到所需操作列表中。在 Select a category 树中单击 Echo Category 节点，然后在\
  \ Available categories and operations 面板中，选择 EchoString 并单击 Add 按钮。此操作将 EchoString\
  \ 添加到屏幕底部的所需操作列表中。最后一步是通过将屏幕底部的文件名前缀设置为 EchoOutbound 来帮助 Consume Adapter Service\
  \ 插件生成描述性的文件名。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_46_0.png)\n\n最后，单击 OK\
  \ 关闭 Consume Adapter Service 向导窗口并返回 Visual Studio，在那里我们看到 BizTalk 项目中添加了两个新文件。一个文件是\
  \ EchoString 操作的 XSD 架构，另一个是 XML 绑定文件。部署应用程序后，您将使用 BizTalk 管理控制台导入此文件以创建物理 WCF-Custom\
  \ 发送端口，该端口配置为执行 EchoString 操作。\n\n不幸的是，我们必须处理的一个不便之处是 **Consume Adapter Service\
  \ add-in** 不允许在一轮运行中为不同契约类型生成工件。要为入站操作生成架构和绑定文件，我们需要再次打开 **Consume Adapter Service\
  \ add-in** 并重复该过程。在 **Security** 选项卡上，指定用户名和密码，对于 **URI Properties** 和 **Binding\
  \ Properties** 选项卡上的属性，您可以接受默认值。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_47_0.png)\n\
  \n- 然后，一旦建立了成功的连接，在 **Select contract type** 下拉列表中选择 **Service**，在 **Select a category**\
  \ 面板中单击 **EchoCategory**，并将 **OnReceiveEcho** 添加到所需操作列表中。将屏幕底部的 **Filename Prefix**\
  \ 设置为 **EchoInbound**。\n- 单击 **OK** 返回 Visual Studio。我们的 Visual Studio 解决方案现在应如下所示，其中添加了两个新文件：\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_48_0.png)\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_49_0.png)\n\
  \n最后，为了完成架构，双击 EchoOutbound.xsd 文件以打开架构编辑器并区分 EchoStringResult 字段。我们将在编排中使用此字段。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_49_1.png)\n\n从技术上讲，此时我们已拥有构建 BizTalk\
  \ 应用程序所需的所有组件。在继续之前，让我们做一些外观上的更改。\n\n首先，将 WcfSendPort_EchoAdapterBinding_Custom.bindinginfo.xml\
  \ 重命名为 SendPort.Bindinginfo.xml。同样，将 WcfReceivePort_EchoAdapterBinding_Custom.bindinginfo.xml\
  \ 重命名为 ReceivePort.Bindinginfo.xml。\n\n接下来，我们需要为接收端口和接收位置提供更具描述性的名称。打开 ReceivePort.bindinginfo.xml\
  \ 文件，并按如下方式更改 ReceivePort 和 ReceiveLocation Name 属性：\n\n```\n<DistributionListCollection\
  \ />\n<ReceivePortCollection>\n  <ReceivePort Name=\"Echo_ReceiveNotification\"\
