- "## 1 使用基于 ASDK 的适配器\n\nWCF LOB Adapter SDK (ASDK) 是一套用于执行和开发面向业务应用程序（LOB）适配器的开发工具和运行时组件，例如\
  \ SAP、Oracle、DBMS 等。基于 ASDK 的适配器提供的最大优势是它们不仅可以从 BizTalk 使用，还可以从任何使用熟悉的 WCF 语义并结合\
  \ WCF 提供的丰富配置能力的 .NET WCF 兼容应用程序中使用。如果在 BizTalk Server 的早期版本中，开发人员可以在基于 ASDK 的适配器和旧的基于\
  \ COM 的 LOB 适配器之间进行选择，那么随着 BizTalk Server 2010 和 BizTalk Adapter Pack 2010 的发布，开发人员唯一的选择就是掌握新技术——旧的传统\
  \ LOB 适配器，除了 SQL Server 适配器外，已成为历史，不能与 BizTalk 2010 一起使用。在本章中，我们将涵盖以下主题：\n\n- Understanding\
  \ the ASDK-based adapter\n- ASDK-based adapters vs. WCF services\n- Installation\
  \ of the BizTalk Adapter Pack 2010\n- Using the ASDK development tools\n- The WCF-Custom\
  \ adapter and SOAP actions\n- ASDK tools and features\n\n主要目标是让您熟悉使用基于 ASDK 的适配器构建\
  \ BizTalk 应用程序所涉及的常见步骤和技术，以便在后续章节中，我们能够集中关注每个特定适配器特有的功能。\n\n### 了解基于 ASDK 的适配器\n\
  \n如果您阅读产品文档，您会发现基于 ASDK 的适配器构建在 WCF 通道模型之上，并作为自定义 WCF 绑定公开。这意味着 WCF 客户端能够与基于 ASDK\
  \ 的适配器通信，就好像它们是 WCF 服务一样。您可能最先想问的问题是，基于 ASDK 的适配器是否实际上是 WCF 服务，只是以新花哨的名字呈现。不，不是！在\
  \ WCF LOB Adapter SDK 中使用 WCF 首字母缩写有些误导性；WCF 构成了该技术的基础，但软件并不围绕 Web 服务展开。为了了解适配器如何融入\
  \ WCF 基础设施，让我们回顾一些 WCF 基础知识。\n\n为了与客户端建立通信过程，任何 WCF 服务必须至少公开一个终结点。WCF 终结点基于三个元素，称为\
  \ WCF 的“A, B, and C”。这三个元素是：\n\n- **Address:** It takes a form of the URI specifying\
  \ the address where the service can be reached at.\n- **Binding:** Bindings specify\
  \ a communication protocol between the client and the service.\n- **Contract:**\
  \ Contracts specify what operations are exposed by the service.\n\nCommunication\
  \ between client and service is conducted through communication channels; one channel\
  \ on the client side and its equivalent on the server side. On the server side,\
  \ when you instantiate the `ServiceHost` class, it instantiates a channel listener,\
  \ which in turn builds a communication channel for the service. On the client side,\
  \ the proxy creates a channel factory, which is responsible for building the channel\
  \ for the client. The channels consist of binding elements, each responsible for\
  \ its own part of message processing to form a stack of binding elements.\n\n\n\n\
  ![](img/23d1402649b6528b085cd6b900a2c9c3_29_0.png)\n\n如你在前一图中可以看到，通信通道中的底层是传输层，而\
  \ ASDK 基于的适配器恰好就位于通道栈中的这一层。\n\nWCF 的优点在于它在设计时考虑了可扩展性，这使你能够使用针对特定需求定制的自定义传输绑定。与标准\
  \ WCF 传输（如 TCP、命名管道、HTTP 和 MSMQ）类似，ASDK 基于的适配器只是可由 BizTalk 应用程序通过标准 WCF 自定义适配器使用的自定义传输绑定元素。如以下图所示，在出站场景中，ASDK\
  \ 基于的适配器不会像标准 WCF 传输那样通过网络发送消息，而是直接与 LOB 系统通信，然后向客户端发送响应消息。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_29_1.png)\n\
  \n在入站场景中，ASDK 基于的适配器会监视或监听目标 LOB 系统针对特定事件的通知，并生成包含事件特定数据的消息供托管应用程序使用。我们将在本章及后续章节中详细介绍。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_30_0.png)\n\n## 基于 ASDK 的适配器与 WCF 服务\n\
  \n关于新适配器，经常被问到的问题之一是引入 ASDK 技术的原因是什么？有什么问题？那些用了多年、可以完美地被几乎所有应用程序使用的老式 WCF 服务有什么问题？为什么微软要重新发明轮子？嗯，这些都是完全合理的问题，这里是答案。WCF\
  \ 服务本身没有问题；它们和以前一样好，但有一个很大的“但是”——前提是 LOB 应用程序相对静态。想象一下你的 LOB 应用程序在不断演进，而你作为开发者，必须向客户端应用程序公开新的元数据？你要么更新现有契约，要么实现新的契约，并对主机和\
  \ WCF 服务执行后续配置步骤。这对从事 LOB 方面的开发团队来说一直是个大麻烦。\n\n> 元数据通常被定义为关于数据的数据。这是一个非常宽泛的定义；在\
  \ WCF LOB Adapter SDK 中，元数据可以被定义为目标 LOB 系统中可用的数据类型和操作。例如，对于 SAP，它可以是 IDOC 和 BAPI，或者对于基于\
  \ DBMS 的应用程序，可以是存储过程和数据表。确定并公开特定 LOB 应用程序的元数据是适配器设计者的职责。\n\n相比之下，基于 ASDK 的适配器会自动提供设计时元数据发现和解析，无需开发团队付出任何努力即可使新的元数据（根据我们的定义，即功能）可供使用。此过程的细节超出了本章范围，但如果你有兴趣深入了解，随\
  \ WCF LOB Adapters SDK 提供的示例适配器可供使用。查看位于 `C:\\Program Files\\WCF LOB Adapter SDK\\\
  Documents\\Samples` 目录中的 Contoso 示例适配器如何实现 `IMetadata*` 接口组，你就会明白自动元数据发现和解析背后的原理。实现\
  \ `IMetadata*` 接口确实需要适配器开发人员付出大量努力，但最终结果绝对值得。\n\n现在你已经熟悉了架构基础，让我们继续进行适配器的安装。\n\n\
  ## 安装\n\nBizTalk Adapter Pack 2010 的安装过程并不复杂，但与 BizTalk 的一切一样，需要准确性和一些耐心。第一步要做的是确保你的系统满足先决条件要求。你必须在计算机上安装以下组件：\n\
  \n- Windows XP SP2、Windows Server 2003、Windows Server 2008、Windows Vista 或 Windows\
  \ 7\n- 用于开发目的的 Visual Studio 2010\n- 带有 Windows Communication Foundation 适配器的 BizTalk\
  \ Server 2010。WCF 适配器默认未安装；在安装 BizTalk Server 2010 时必须显式启用它。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_32_0.png)\n\
  \n完成验证后，你可以继续进行安装，本质上是以下步骤的顺序：\n\n- 1. 安装 WCF LOB Adapter SDK。\n- 2. 安装 BizTalk\
  \ Adapter Pack 2010。\n- 3. 安装额外的客户端库以在适配器与其目标 LOB 系统之间启用通信。唯一不需要任何额外组件的适配器是 SQL\
  \ 适配器。\n\n从上述步骤来看，安装额外的客户端库是最耗时且最容易出错的过程。我们将在专门介绍 SAP 适配器的章节中详细探讨这一主题。\n\n尽管安装 WCF\
  \ LOB Adapter SDK 和 BizTalk Adapter Pack 是直接的过程，但在 64 位环境中存在一个陷阱。如果你的计算机运行在 32 位操作系统下，你只需要安装\
  \ WCF LOB Adapter SDK 和 BizTalk Adapter Pack 的 32 位版本。在 64 位环境中，情况稍微复杂一些。首先你必须安装\
  \ WCF LOB Adapter SDK 的 64 位版本和 BizTalk Adapter Pack 2010 的 64 位版本。然后，如果你在设计时使用\
  \ Visual Studio 和 BizTalk 管理控制台等工具，或在运行时使用 32 位 BizTalk 主机实例，你将必须安装 BizTalk Adapter\
  \ Pack 的 32 位版本和客户端库。这听起来可能违反直觉，但考虑到 Visual Studio 和 BizTalk 管理控制台是 32 位应用程序，因此只能与\
  \ 32 位组件交互，这种要求就变得清晰了。因此，如果在 64 位环境中运行 BizTalk 安装程序时，它提供同时安装 BizTalk Adapter Pack\
  \ 2010 的 32 位和 64 位版本，请不要感到惊讶。现在我们已经熟悉了要求，可以开始 ASDK 适配器的安装了。\n\n## 安装 WCF LOB Adapter\
  \ SDK\n\n第一步是奠定基础，即安装 WCF LOB Adapter SDK。\n\n- 1. 从 BizTalk 安装 DVD 或 ISO 的 `\\\
  Setup\\BT Setup` 文件夹启动 `setup.exe`，然后选择 **Install Microsoft BizTalk Adapters**。\n\
  - 2. 选择 **Step 1: Install Microsoft WCF LOB Adapter SDK**。请注意，安装程序会自动安装正确版本；你无需在\
  \ 32 位和 64 位之间显式选择。\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_33_0.png)\n\n- 3.\
  \ 在 **Welcome** 屏幕上，单击 **Next** 按钮。\n- 4. 接受许可条款并单击 **Next**。\n- 5. 在 **Installation\
  \ Type** 屏幕上，单击 **Custom** 按钮。**Custom Setup** 屏幕将显示出来。\n- 6. 你始终必须安装运行时组件，无论是否计划使用\
  \ UI 工具。如果你在计划使用 UI 设计时组件的计算机上安装，例如 Visual Studio 的 **Add Adapter Service Reference\
  \ plug-in**，以及 BizTalk 管理控制台的 **BizTalk Server Add-in**，你必须启用 **Tools** 和 **BizTalk\
  \ Server Add-in** 组件的安装。本章后面的演练中，你还需要随 WCF LOB Adapter SDK 提供的 **Samples**。\n\n\
  ![](img/23d1402649b6528b085cd6b900a2c9c3_34_0.png)\n\n- 7. 单击 **Next**，然后单击 **Install**\
  \ 开始安装。\n- 8. 安装完成后，单击 **Finish** 按钮关闭 WCF LOB Adapter SDK 安装程序并返回主适配器安装窗口。\n\n\
  ## 安装 BizTalk Adapter Pack 2010\n\n我们现在将安装 BizTalk Adapter Pack 2010。请注意，如果你处于 64\
  \ 位环境，安装程序会提供同时安装 BizTalk Adapter Pack 2010 的 32 位和 64 位版本。\n\n\n\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_35_0.png)\n\
  \n以下是需要遵循的流程：\n\n- 1. 在主适配器设置窗口中，单击链接以安装相关版本的 BizTalk Adapter Pack。\n- 2. 在欢迎屏幕上，单击“下一步”。\n\
  - 3. 接受许可条款并单击“下一步”。\n- 4. 在“选择设置类型”屏幕上，单击“自定义”按钮。\n- 5. 在“自定义设置”屏幕上，选择要使用的适配器并单击“下一步”。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_35_1.png)\n\n- 6. 单击“安装”开始安装。\n- 7. 安装完成后，单击“完成”以完成操作并关闭设置窗口。\n\
  \n要完成 BizTalk Adapter Pack 2010 的安装，您需要为除 SQL 之外的所有适配器安装额外的客户端组件。对于本书中涉及的 SAP 适配器，我们将在第\
  \ 4 章提供逐步指导。如果您仅计划使用 SQL 适配器，则无需进一步步骤，此时您已拥有使用和开发 SQL 适配器所需的一切。\n\n## 使用 ASDK 开发工具\n\
  \n在本节中，我们将向您展示如何使用 ASDK 提供的工具，以便 BizTalk 应用程序能够使用基于 ASDK 的适配器。为此，我们将使用 Echo 适配器，即\
  \ ASDK 提供的两个示例适配器之一。这是一个非常简单的适配器，用于模拟对虚构 LOB 系统的操作，但此时我们不需要任何复杂的东西，因为无论适配器如何，ASDK\
  \ 工具的工作方式完全相同。因此，Echo 适配器的简洁性对我们有利——我们将集中于本质，而将现实世界适配器的复杂性留给各自的章节。作为额外的奖励，Echo 适配器附带完整的源代码，位于\
  \ C:\\Program Files\\WCF LOB Adapter SDK\\Documents\\Samples 目录中，以及一个安装包。在撰写本书之时，Echo\
  \ 适配器的设置包尚未更新以用于 Visual Studio 2010 和 .NET 4.0；为了让您更轻松，我们为 .NET 4.0 32/64 位环境准备了设置，并将软件包放在包含本书代码示例的\
  \ ZIP 文件中。如果您尚未下载示例，请现在下载。\n\n## Echo 适配器\n\n让我们先简要讨论 Echo 适配器提供的功能。与 BizTalk Adapter\
  \ Pack 2010 中的“大兄弟”一样，Echo 适配器支持两种消息交换模式。\n\n- Inbound： 在入站场景中，Echo 适配器作为接收端口基础设施的一部分，监视指定文件文件夹中是否有新的\
  \ TXT 扩展名文件；一旦有新文件到达，适配器会向 BizTalk 应用程序发送通知。通知的形式为符合以下 XSD 架构的 XML 消息：\n\n![](img/23d1402649b6528b085cd6b900a2c9c3_36_0.png)\n\
  \n- path 元素包含正在监视新文件的[content]\n![](img/23d1402649b6528b085cd6b900a2c9c3_35_0.png)\n\
  \n以下是需要遵循的流程：\n\n- 1. 在主适配器设置窗口中，单击链接以安装相关版本的 BizTalk Adapter Pack。\n- 2. 在欢迎屏幕上，单击“下一步”。\n\
  - 3. 接受许可条款并单击“下一步”。\n- 4. 在“选择设置类型”屏幕上，单击“自定义”按钮。\n- 5. 在“自定义设置”屏幕上，选择要使用的适配器并单击“下一步”。\n\
  \n![](img/23d1402649b6528b085cd6b900a2c9c3_35_1.png)\n\n- 6. 单击“安装”开始安装。\n- 7. 安装完成后，单击“完成”以完成操作并关闭设置窗口。\n\
  \n要完成 BizTalk Adapter Pack 2010 的安装，您需要为除 SQL 之外的所有适配器安装额外的客户端组件。对于本书中涉及的 SAP 适配器，我们将在第\
  \ 4 章提供逐步指导。如果您仅计划使用 SQL 适配器，则无需进一步步骤，此时您已拥有使用和开发 SQL 适配器所需的一切。\n\n## 使用 ASDK 开发工具\n\
