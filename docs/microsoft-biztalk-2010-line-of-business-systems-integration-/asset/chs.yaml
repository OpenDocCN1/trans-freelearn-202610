  ## 前言


  Microsoft BizTalk 是一种集成服务器解决方案，允许企业连接不同的系统。在当今并购频繁的商业环境中，越来越多的企业被迫使用 BizTalk Server
  2010 等集成代理在业务系统之间交换数据。在集成这些系统时经常被忽视的是，为了有效集成它们，ERP 和 CRM 系统所要求的先决知识。这些知识不再被锁在昂贵顾问的脑海中。通过本书培养业务系统集成方面的宝贵技能，在组织内获得竞争优势。


  本书将通过实际场景向您展示如何将 BizTalk 与业务系统集成。每章将介绍一个业务系统，介绍一些先决知识并演示如何将 BizTalk 与该业务系统集成，然后基于实际经验提供指导，进一步提升您的
  BizTalk 知识。


  本书将使您掌握如何将 BizTalk 与业务系统集成。本书首先强调 WCF-LOB 适配器的技术基础以及与流行 WCF-LOB 适配器相关的常见步骤和重要属性。然后您将了解如何使用基于
  WCF 的 SQL Server 适配器与 Microsoft SQL Server 集成的概述。本书随后深入探讨诸如与 Dynamics CRM 集成、使用
  IDOC 构建 BizTalk/SAP 集成解决方案、IDOC 与 RFC/BAPI 之间的差异，以及通过 Windows Azure AppFabric Service
  Bus 进行 WCF 集成等主题。




  ### 本书涵盖内容


  - 第 1 章，使用基于 ASDK 的适配器：探索 WCF LOB SDK 和 WCF 自定义适配器的一些内部工作原理。

  - 第 2 章，WCF-SQL 适配器：学习如何使用 WCF-SQL 适配器公开的流行操作（包括轮询、通知和复合操作）检索和操作数据。

  - 第 3 章，集成 BizTalk Server 和 Microsoft Dynamics CRM：发现与 Dynamics CRM 2011 和 BizTalk
  Server 集成的不同方式，包括调用原生 Web 服务和代理解决方案。还学习如何通过 CRM 注册的插件调用 BizTalk 暴露的 WCF 服务。

  - 第 4 章，WCF SAP 适配器发送和接收 IDOC：了解如何安装 WCF-SAP 适配器的先决条件 DLL。了解扩展的、定制的和开箱即用的 IDOC 以及如何发送和接收它们。

  - 第 5 章，WCF SAP 适配器 RFC 和 BAPI：区分 SAP IDOC、BAPI 和 RFC 之间的差异以及何时使用它们。

  - 第 6 章，BizTalk 与 Windows Azure AppFabric 服务总线的集成：发现 Microsoft 的 AppFabric 服务总线并学习如何构建与
  Windows Azure 云中 Microsoft 服务总线互补的 BizTalk 解决方案。

  - 第 7 章，集成 SharePoint 2010：使用 Windows SharePoint Services 适配器和 InfoPath 构建集成的 SharePoint
  解决方案。

  - 第 8 章，集成 SharePoint 2010 Web 服务：通过使用 SharePoint 的开箱即用列表 Web 服务来学习操作 SharePoint
  自定义列表。

  - 第 9 章，Microsoft Dynamics AX：了解如何使用 BizTalk 适配器和 .Net 业务连接器集成 Microsoft Dynamics
  AX 2009。

  - 第 10 章，集成 BizTalk Server 和 Salesforce.com：了解如何建立 SalesForce.com CRM 与本地服务之间的双向连接。


  ### 本书适合谁


  如果您是一名经验丰富的 BizTalk 开发人员，希望使用实际场景将 BizTalk 与业务系统集成，那么本书适合您。需要对 BizTalk 有扎实的 intermediate
  中级理解。本书假定开发人员能够在 Visual Studio 中创建架构、映射、编排、端口和消息，并在 BizTalk 管理控制台中配置应用程序。然而，集成业务系统的经验并非绝对必要。


