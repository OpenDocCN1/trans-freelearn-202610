- pgno: 50
  md: '# Step 1 — Definition


    While much of this book will be focused solely on AI as it pertains to product
    management, you can use this process for implementing any AI system, even if it’s
    not specifically integrated into your product. As any PM knows, you don’t start
    out with a solution without first addressing the problem you’re trying to solve.
    No matter the purpose of your AI system, you’re going to want to articulate the
    specific problem you want to use AI for and the goal you’re trying to achieve
    with it. This is what allows you to attach that problem to the business impact
    its potential solution could contribute to. Aligning an AI system to business
    impact and how it will help achieve business goals is the first step because you’re
    going to ask your organization to put in a significant investment for setting
    up an AI system.


    Before they grant your request, they’ll have a lot of questions. Figuring out
    how to answer those questions and how to establish success criteria will be your
    primary task. Scoping out the bulk of the work and establishing requirements and
    constraints will be part of your upfront investment in creating an AI system.
    Being able to identify limitations and requirements relating to infrastructure,
    data availability, and compute power will ensure you’re preparing yourself adequately
    as an AI PM. It won’t just be the leadership’s approval you need but stakeholders’
    approval as well. In most cases, you’ll need to consult with your key stakeholders
    to be able to offer a reasonable and circumspect answer to the problem you’re
    trying to solve.


    # Step 2 — Data availability and centralization


    Essentially, you’ll need a central place to store the data that your AI/ML models
    and algorithms will be learning from. Depending on the databases you invest in
    or legacy systems you’re using, you might have a need for an extract, transform,
    load (ETL) pipeline and data engineering to make the layers of data and metadata
    available for your productionized AI/ML models to ingest and offer insights from.
    Think of this as creating the pipeline needed to feed your AI/ML system. Determine
    the type and amount of data you’ll need to train and test your AI models so that
    you can gather the right data from various sources in order to establish your
    centralized, integrated training dataset.


    AI feeds on data, and if your system of delivering data is clunky or slow, you’ll
    run into issues in production later. Choosing your preferred way of storing data
    is tricky in and of itself. You don’t know how your tech stack will evolve as
    you scale, so choosing a cost-effective and reliable solution is a mission in
    and of itself, as is cleaning and processing the data you do decide to use. You’ll
    also want to split your dataset into a training, validation, and testing set.
    Depending on the model you choose and the purpose, you may also choose to augment
    your dataset with generated data points or external data sources.


    For example, as we started to add more and more customers at a cybersecurity company
    we were previously working with, we noticed the load time for certain customer-facing
    dashboards was lagging behind. Part of the issue was the number of customers,
    and their metadata was too large to support the pipelines we already had in place.'
