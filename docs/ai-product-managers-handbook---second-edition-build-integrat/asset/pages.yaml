- pgno: 187
  md: 'We bring up the differences between AI products and traditional software products
    here because we want everyone who has the investment and will to create AI products
    to be set up for success. If you can anticipate potential hurdles as you’re building
    a novel product, you can better prepare your teams for surmounting them as well.


    # How are the products similar?


    There are a number of similarities between traditional software products and AI
    products because, fundamentally, AI products actually are traditional software
    products with a productized AI/ML service built in. For this reason, the similarities
    we will outline here involve Agile product development as well as data. Native
    AI products, along with the outputs from the AI pipelines that support them, follow
    the same building process most traditional software products use. They are also
    built with a heavy focus on the data that powers them. This is still true for
    traditional software products.


    # Agile development


    In traditional software development, you follow some methodology to ideate, keep
    track of your work, and stay consistent with some framework or schedule. Most
    software companies these days don’t use the waterfall methodology anymore and
    have instead opted to use some version of the Agile, Scrum, Kanban, or Lean methodology.
    This means most software companies use an iterative and experimental approach
    to building and shipping products. They take large overarching business goals
    and translate those goals into specific tasks that will then amount to deliverables
    by the end of any given sprint. Once they have these deliverables done, they undergo
    a process of evaluation to make sure they meet varying expectations through testing.


    The heart of this approach is *agility*. When you’re building out features of
    your product over time, you have time to test those features both functionally
    and conceptually. This is an economical way of spending time, energy, and resources
    on a product or a feature to then see how it’s received by your customer base
    and greater market. The agility this offers is what allows tech companies to be
    successful: they are able to make changes and adjustments as they build if they
    see that their product or feature isn’t resonating with their audience of users.
    This will be true whether or not your product supports AI/ML features.


    We’d even go a step beyond this and say AI/ML takes the heart of this agility
    to the next level. Because AI/ML products are consistently building from prior
    manifestations, they’re constantly evolving and adapting to new demands on performance,
    accuracy, or speed. You can’t build an AI product in a vacuum. Over time, AI products
    will have many transformations, and because of this, they’re always in a state
    of being updated or upgraded to meet the expectations of their outputs. This is
    particularly true with generative AI products because of the opacity of the deep
    neural networks that power them.


    Since engineers can’t really explain why generative models are producing certain
    outputs, there has to be a continuous process of incorporating changes to the
    models through external influences, like retraining and bolstering that training
    with prompt tuning and user feedback. Prompt engineering itself needs to be a
    permanent fixture in how a company readies a generative AI product for the market
    because the prompts themselves guide the generation process. Without some way
    to pivot continuously, particularly in this area, you won’t know which prompt
    strategies are most effective. Agility needs to be a constant.'
