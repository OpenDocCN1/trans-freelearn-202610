- pgno: 190
  md: 'It’s also important to note that the line between traditional software products
    and AI products is increasingly becoming blurred. This is because most software
    companies have already started to integrate AI/ML into their existing products
    or launched AI-native products. PMs that cover a wide variety of products will
    want to deepen their knowledge of AI/ML as a way to stay competitive within their
    own fields, whether they plan to go deep into AI or not. Let’s turn our attention
    to how AI/ML products are positioned and built according to their business models
    particularly B2B and B2C products.


    # B2B versus B2C — productizing business models


    When it comes to building and shipping products, some of the biggest differences
    between B2B and B2C business models include domain knowledge and the degree of
    experimentation. In this section, we’ll be focusing on these two areas because
    they have the biggest impact on what productizing looks like for AI/ML products
    between these two business models. If we expand on the notion that AI/ML products
    behave more like services, the desired end result of both these business models
    will be different because they serve different kinds of customers and different
    overall needs:


    +   - With B2B products, there’s a strong need for these products to demonstrate
    a high degree of *domain knowledge* and a focus on that. Since B2B products often
    serve a proven business niche, they must often prove they have expertise in this
    niche.


    +   - With B2C products, we see a focus on *experimentation* because rather than
    tapping into a business need that already exists, these products are looking to
    tap into a more collective need that their own customer base may not yet be aware
    they have. This requires a high degree of experimentation.


    In the following sections, we will build on these ideas further.


    # Domain knowledge for B2B products — understanding the needs of your market


    For starters, in B2B products, domain knowledge reigns supreme. This is because
    the use cases are incredibly specific, and the products themselves solve niche
    business problems that are specific to certain industries and domains. In order
    for a PM to be effective in the B2B space, they need to be intimately connected
    to their customers’ needs, workflows, and major pain points because their products
    solve very specific use cases. This isn’t to say PMs in this space have to come
    from the specific industry they’re serving, but they do need to invest a significant
    amount of time in building empathy with their user base in order to be effective
    in the following areas:


    +   - **Building credibility:** This time-intensive process can look like a number
    of things; conducting customer interviews, keeping up with industry trends, and
    understanding the competitive landscape and the benefits and features their competitors
    are serving their own customers are all part of this work toward building credibility
    in the space their product is competing in. This is all preliminary work of understanding
    the various types of users their product will serve as well. You’re setting yourself
    up for success if you’re a PM in this space and you’re spending time on establishing
    clear buyer and user personas and making sure you have a handle on what their
    individual needs, problems, and “jobs to be done” are.'
  merge: -1
  img_proc: true
- pgno: 191
  md: '+   - **Sales cycles:** The expectation threshold of B2B customers is high
    because this space is likely riddled with a large number of competing products
    to choose from. In many cases, these customers are undergoing various rounds of
    **requests for proposals (RFPs)** and in-depth **proof-of-concept (PoC)** processes
    to make sure they are purchasing the right product for their use case. For an
    AI/ML product, these PoCs can be costly for your organization because you’ll need
    to acquire a large enough sample from your customers, use that data to train your
    models, and present your product and its capabilities to them once its performance
    is at an acceptable level to be able to show to your prospective customers.

    +   - **Building within an ecosystem:** This means there are often many eyes on
    these products, and each of those pairs of eyes may come with its own set of expectations
    and objections to your product, so you really need to be aware of multiple perspectives
    when building B2B products. This also means that as you build, you’re planning
    your release schedules with the idea that every release may include features that
    could impact your customers’ individual workflows, so you often have to be mindful
    of how often and how loaded your release rollouts into production are. This is
    doubly true because often B2B products need to be integrated into existing enterprise
    tools, APIs, or other platforms, so you’re already working within an established
    framework of some sort.


    This domain knowledge is then built up to the point where you as a PM, and your
    broader organization as a whole, then become a thought leader in the space you’re
    serving. Because the B2B landscape is a small world, once a product—along with
    its leadership team—makes a splash, it will trickle across the professional world.
    Building credibility internally and externally is foundationally proportional
    to the level of industry expertise that’s acquired.


    This further reinforces that the expectations of an AI/ML B2B product are quite
    high. Your users and buyers will scrutinize you on the tech stack that’s supporting
    your AI product as well as its performance and accuracy. They will want you to
    have evidence of explainability and why your product works, which could make AI
    products built with generative AI or DL models tricky. This will all be happening
    in conjunction with the testing and trialing of other AI/ML solutions that are
    out there to compare them. This means that you will have to be incredibly intentional
    about your releases to make sure there aren’t any lags in performance when you
    do make your push to production, with the full knowledge that other businesses
    are relying on your product.


    Let’s take the example of an AI company that’s looking to develop a predictive
    maintenance tool that will predict when equipment will fail before it occurs in
    order to avoid downtime in manufacturing environments. The AI engineers who are
    working on this tool will need to be aware of different types of machinery, as
    well as the specific failure modes they experience. AI models will need to be
    aware of the operational limits of certain equipment to interpret sensor data
    correctly. Domain experts will be needed to identify critical data points like
    vibration, temperature, or pressure to help the AI product team decide which data
    is most relevant for predicting failures. In B2B environments, one client’s needs
    can differ drastically from another’s, so the product team will need to focus
    on having a deep understanding of the client companies that will be using their
    tool and the intricacies and customizations that would be most relevant to their
    environments.'
  merge: -1
  img_proc: true
- pgno: 192
  md: 'Expectations are to be managed at every stage of the customer journey. B2B
    products exist in a massive ecosystem, and companies that use one product might
    pass outputs from that product to other workflows or their own customers. B2B
    products frequently integrate with other software solutions to streamline workflows
    or enhance operations. For instance, a project management tool might take data
    from a time-tracking application to generate reports. Data from those reports
    can be fed to a team collaboration platform to make sure stakeholders stay informed,
    and so forth.


    This places an expectation on B2B companies to maintain their company''s and product''s
    reputation and be more transparent about their marketing efforts. Long-term relationship
    building is foundational to the success of a B2B product because the contracts
    are often multi-year and sometimes the sales cycle is too. This introduces a lot
    more strain on AI/ML product teams to shy away from black-box algorithms and sell
    products that can stand by their outputs because there''s a greater need for transparency,
    accountability, and explainability. If a B2B product fails to deliver on performance
    or expected results, businesses want to understand why, often in the form of a
    formal live meeting. B2B company customers have a tremendous amount of leverage
    because the stakes are high all around, as are the contract costs. B2B products
    benefit from having engaged customers who want to see a certain level of performance
    from their products and that feedback and collaboration help improve products.


    # Experimentation with B2C products — discover the needs of your collective


    With B2C products, because there isn''t such a hyperfocus on the domain you''re
    serving, the pressure on the market you''re serving is a bit more relaxed, but
    this creates another kind of pressure: the pressure to build a product that appeals
    to a much wider audience universally. Casting a wider net brings other areas into
    focus, and the following are some key considerations:


    +   - **Gaining customer insights:** As a PM building in a B2C environment, you''re
    going to approach your product and the market it serves more experimentally and
    derive insights about what''s most useful to your customers by tracking how they
    behave with and use your product. You can conduct focus groups, nurture beta testers,
    or interview your customers through in-product surveys, but because you can''t
    conduct customer interviews in the way you might for a B2B product, you''re left
    with understanding your customers'' impressions of your product through their
    in-product behaviors.


    +   - **Enhancing customer experience:** This business model also consolidates
    all your user and buyer personas in one because, typically, the person who''s
    using your product is also the person buying it. Understanding the main drivers,
    desires, hopes, and dreams of your customer base becomes a very nebulous task
    because what you''re trying to capture are underlying needs, pain points, and
    moments of delight that will apply to all your users at once. This complicates
    a PM''s ability to empathize with their end users. Because most of these users
    aren''t signing the kind of year-long contracts you see with B2B products, the
    pressure to keep these consumers charmed is constant because they can leave at
    any point. This puts pressure on product, leadership, and development teams to
    consistently provide their customer base reasons to stay and choose them. Creating
    a streamlined, intuitive, standardized experience is one thing but deciding on
    which experience to choose above all others is another.'
  merge: -1
  img_proc: true
- pgno: 193
  md: '+   - **Investing in data analytics:** Because of the bird’s-eye view B2C products
    enforce on their builders, this means PMs have to be very discerning with their
    data analytics and metrics. Investing in understanding their customer lifetime
    value and customer acquisition costs and tracking those metrics is an important
    part of staying profitable and sustainable in the B2C landscape. B2C offers PMs
    an easy outlet for applying AI/ML toward the acquisition and retention of customers
    since they have such few touchpoints with the end users of their product. PMs
    in the consumer space also need to hone in on the demographic and individualistic
    qualities of their consumers to better understand what to build. If you see that
    it’s mostly people within a geographic area, gender, generation, or subgenre that
    appeal most to your product, you might start to build future features and releases
    in your roadmap with them in mind.


    We’ve mentioned many times that AI/ML products are experimental in nature because
    you want to leverage AI/ML in ways that will impact your product most obviously
    for it to be worth the top-heavy investment it requires. This is doubly true for
    B2C products because you’re building and using AI to deliver something that saves
    your consumers money or delights them, as well as using the data your product
    produces to decide on how to pivot your product. B2C PMs are reliant on data and
    analytics to make global decisions about their products on a regular basis. Although
    this is changing for the most part, traditionally in the B2B space, your marketing
    efforts are most oriented toward your buyers because they’re the ultimate decision-makers.
    This is in sharp contrast to the B2C space because your marketing efforts are
    directly linked to collective information you can derive and infer from your data.


    Let’s consider an AI company that wants to offer a personalized styling tool that
    will suggest clothing to customers based on their preferences, purchase history,
    and feedback. Because the tool will be applicable to all users at once, experimenting
    through fine-tuning performance and optimizing UX will be the key to success.
    This might require experimenting with different algorithms, learning paradigms,
    or filtering methods to find the best combination that will capture the preferences
    and behaviors of their user base the best. A/B testing and iterating on personalization
    criteria will allow product teams to try different recommendation formats, styles,
    and explanations for users and customers that will maximize purchases, customer
    satisfaction, or positive feedback. Then, the most effective approach can be discovered
    and scaled across all users.


    Experimentation is fun to a point, but at the end of the day, it has to deliver.
    By far the greatest pressure this places on AI/ML consumer products is the pressure
    to perform well, maintain their enormous user base, and keep their consumers happy.
    This means that consumers want to use an app that does what it says it’s going
    to do in a way that’s visually appealing. Because they aren’t as concerned with
    the downstream risks of using your product as B2B customers are, consumers don’t
    particularly care why it’s working, just that it does work. This means that the
    issue of explainability is minimized in the B2C space, and the use of black-box
    or DL algorithms is less scrutinized.


    B2B and B2C business models come with their own blend of challenges, but at the
    end of the day, players in both business models must understand their customers
    enough to create products that actually bring them value. Once you’ve built something
    of value for your customers, you enter a new phase. This next phase is about delivering
    that value consistently enough to not only win customers but keep them in the
    long run. In the following section, we will take a look under the hood to understand
    the necessary elements of delivering value consistently with the help of MLOps
    or AIOps. Both will be used interchangeably in this book.'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# Using AIOps/MLOps


    Maintaining trust, reliance, and consistency within your internal product teams
    as well as with your customer base involves an act of committing to specific rituals.
    Ritualizing the acquisition of clean data, tracking the flow through your infrastructure,
    tracking your model training, versions, and experiments, setting up a deployment
    schedule, and monitoring pipelines that get pushed to production are all part
    of the work that needs to be done to make sure you are keeping on top of the comings
    and goings of your AI/ML pipeline. This ritualizing is what’s referred to as MLOps
    or AIOps. In the following sections, we will explore a few important considerations
    that relate to AIOps and MLOps.


    # Consistency and AIOps/MLOps — reliance and trust


    MLOps’ greatest contribution to your business is maintaining the consistency needed
    to build an AI/ML product that lasts. Let’s explore the benefits of AIOps/MLOps
    and how they help you stay consistent:


    +   - **Managing ML pipelines:** If you’re managing an ML pipeline, you will need
    to learn how to depend on an MLOps team and set up your team for success. You
    don’t want to get caught losing $20,000 in 10 minutes (as we saw in our Profit
    margins section earlier in this chapter) and have no leads for where the problem
    stems from. At the very least, you should have some idea of where the problem
    is stemming from. MLOps is able to help with creating and managing the ML pipelines
    themselves, scaling those pipelines, and moving sensitive data at scale. Ultimately,
    the risks of compromising your customers’ reliance on and trust in your product
    are great.

    +   - **Productizing AI/ML:** We’ve spoken at length in this chapter about productizing
    and what that looks like in different contexts of AI product management, but MLOps
    is actually where the productizing functionally happens. Taking a service and
    splitting that service apart into smaller pieces that are managed and standardized
    into reproducible and regulated segments is the work of “productizing,” and in
    that vein, MLOps is really the vehicle we use to truly productize AI/ML. In order
    to build the consistency and credibility customers can expect from your product,
    the ritual of MLOps needs to be cemented into your process. You never know when
    you’ll need to revert to a specific version of your models or zero in on an experiment
    that had the right mix of factors. MLOps creates the organization and focus your
    team needs to have in order to have a handle on such a wide variety of experiments.


    Tools like Splunk, Dynatrace, and Moogsoft are used for AIOps to provide analytics
    and monitoring tools that help IT teams analyze machine data and logs. These are
    AI-powered monitoring solutions for applications and infrastructures used to keep
    your AI program working properly. In many cases, they also have proactive monitoring
    features as well as incident response and management features to help troubleshoot
    when (and for how long) something is going wrong.'
  merge: -1
  img_proc: true
- pgno: 195
  md: 'Tools like MLflow, Kubeflow, Data Version Control (DVC), Seldon, and Weights
    & Biases are used for MLOps to manage AI/ML lifecycles from experimentation to
    deployment. Managing and scaling ML workflows, maintaining versions of AI/ML projects,
    A/B testing, managing different deployment strategies, and visualizing performance
    metrics are all functions these tools can offer to ML, engineering, and data science
    teams.


    Now that we’ve covered some of the benefits of creating an MLOps organization
    to help keep track of your AI/ML pipeline, let’s explore how to build on that
    pipeline and evaluate the state of the models used. In the following section,
    we will reiterate some concepts around testing, retraining, and hyperparameter
    tuning to ensure your AI/ML pipelines are routinely being refreshed and optimized
    for performance.


    # Performance evaluation — testing, retraining, and hyperparameter tuning


    Without having a built-out AI/ML pipeline that validates, trains, and retrains
    regularly, you won’t have a great handle on your product’s performance. Establishing
    a baseline, as well as specific benchmarks, for trust, reliance, and consistency
    in AI/ML performance evaluation is essential for building effective AI/ML operations.
    AI PMs can expect to help build standards and benchmarks around this. How you
    define your standards is up to you, but the most important thing is that you do
    define it somehow. The following are some typical MLOps standards you can potentially
    apply within your AI/ML program:


    +   - **Accuracy**: Maintain an accuracy threshold that’s balanced with precision
    and recall to make sure your model isn’t favoring false positives or false negatives.
    You could also set a standard for model performance to ensure that 95% of your
    model predictions are within an acceptable margin of error over a defined period.

    +   - **Latency**: Establish latency thresholds for real-time applications so
    that you’re getting responses from your models within an appropriate time if your
    AI product is trying to detect fraud within a certain window of time, for example.

    +   - **Audit trails**: Keep a record of model versions and performance evaluations.

    +   - **Trust metrics**: You could employ user surveys to establish a trust score
    so that over 80% of your users feel confident about your model or product’s predictions.

    +   - **Variance**: Monitor your model performance so that there’s no more than
    5% variance on key metrics, like accuracy or recall, over a defined period to
    prove your product is consistent.'
  merge: -1
  img_proc: true
- pgno: 196
  md: 'MLOps helps us with accentuating the importance of retraining and hyperparameter
    tuning our models to deliver performance. Here are some tasks that your MLOps
    team will likely be performing:


    +   - Your MLOps team will essentially be made up of data scientists and ML and
    DL engineers who will be tasked with making adjustments to the hyperparameters
    of your model builds, testing those models, and retraining them when needed. This
    will need to be done in conjunction with managing the data needed to feed this
    testing, along with the code base for your product’s interface as well.

    +   - In addition to testing and validating the models and working to clean and
    explore the data, MLOps team members also traditionally do software testing, such
    as code testing, unit testing, and integration testing.

    +   - In many cases, your AI products will effectively be traditional software
    products that incorporate AI/ML features in a subset of a greater ecosystem that’s
    in line with traditional software development. This means that MLOps may, in many
    cases, ensure your greater product is functioning along with the AI/ML deliverables
    and outputs. This will be true for generative AI models as well, which will need
    to be regularly evaluated for diversity, coherence, perplexity, and factual accuracy.
    Maintaining standards in performance is especially important in cases where you
    have a lot of competition as well.

    +   - Another major area MLOps is well suited for is minimizing the risk of data
    drift and system degradation. We covered a few different types of drift in earlier
    chapters of this book, but we’d like to reiterate here that this is a risk that
    can sneak up on you. Model degradation can happen for a number of reasons across
    all AI/ML models, including generative models. Perhaps there are differences between
    assumptions that are made with the data in training and production. Perhaps there’s
    been a change to the data itself. Perhaps there are unseen biases in your training
    data that were never picked up on. Whatever the reason, continuous monitoring
    of models in production by MLOps will be your best defense in picking up on these
    nuances and changes in AI/ML outputs so that the risks from any number of issues
    within the ML pipeline are minimized as much as possible.


    In Chapters 1 and 2 of this book, we covered the concept of continuous maintenance,
    which consists of **continuous integration (CI)**, **continuous deployment (CD)**,
    and **continuous training (CT)**. These basic areas of MLOps are mirrored in DevOps,
    which is common to traditional software development. The main differences are:


    +   - CI: In MLOps, CI isn’t just about testing and validating code—it’s also
    about validating and testing the models, data schemas, and the data samples themselves.

    +   - CD: CD isn’t just about deploying a software package in MLOps but about
    nurturing an automated ML pipeline deployment process that’s optimized for deploying
    the model prediction service or for automatically scaling back to an earlier version
    if there is trouble ahead.

    +   - CT: In MLOps, CT isn’t just about testing software packages themselves but
    about retraining and testing the models that are actively being relied upon.'
