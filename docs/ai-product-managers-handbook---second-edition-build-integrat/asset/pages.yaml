- pgno: 423
  md: '# 18


    # What Does It Mean to Be a Good AI PM?


    In the previous chapter, we got our feet wet with what it takes to get started
    with the AI PM job function. We discussed how people break into the AI PM role,
    what skills they need to build up to be considered for the role and what ultimately
    makes them successful when taking on their first AI PM roles. In this chapter,
    we will be expanding on these concepts and talking more about what builds a strong
    foundation for longevity in the AI PM career.


    We''ll spend the bulk of this chapter discussing what it means for an AI PM to
    be effective. AI PM is a varied job family, and we will be going over the many
    facets of it to help you best understand what parts of the role you might find
    most enjoyable, and which parts you might want to work on to develop. We will
    also be exploring the various ways different people will be challenged by the
    role based on their previous experiences and how all AI PMs can set up their careers
    for sustained growth.


    Because of the incumbency of the AI PM role, there are more nuances to get into
    other than technical competence, comfort, and expertise, as we''ve discussed in
    previous chapters. If you recall, in the last chapter, we highlighted five areas
    that AI PMs will have to demonstrate competence in: technical proficiency, business
    acumen, communication, leadership, and problem-solving skills. We will build on
    these ideas in this chapter by reinforcing what demonstrating these competencies
    looks like in a mid-level career. As the chapter goes on, we will cover the following
    areas:


    +   - The practical stressors and expectations related to the various hats the
    AI PM needs to wear

    +   - What a proven track record of core competencies looks like

    +   - What communicating accessibly means from the perspective of an AI PM

    +   - Common challenges and opportunities that come as AI PMs rise in their careers

    +   - How an AI PM can take care of themselves as they are expanding'
