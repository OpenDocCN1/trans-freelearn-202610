- pgno: 328
  md: 'The numbers for the growth of ethical AI practices are also encouraging and
    indicate that individuals and companies are taking the ethics and responsibility
    that AI comes with seriously as their level of experience and investment grow.
    Forrester predicts 25% of tech executives will need to report their AI governance
    activities to their boards to cover “explainability, fairness audits of high-impact
    algorithmic decision-making, and accounting for environmental impacts of AI (green
    AI).” This also indicates that boards and high-level decision makers are aware
    of the risks that come with not properly accounting for the potential harm AI
    can pose to customers, users, and organizations.


    Based on their own research in this area, Gartner had predicted that by 2023,
    anyone hired for development and training work on AI systems would need to demonstrate
    their expertise in ethical and responsible AI. Unfortunately, it remains to be
    seen if this is the case. Their outlook on what they consider causal AI, or AI
    that’s able to demonstrate explainability and deliver on communicating causal
    relationships, is much longer. Gartner believes causal AI could take up to a decade
    to achieve mainstream adoption but will eventually have a “transformational impact
    on business.” Here, we also see the relationship between trust and responsibility
    going hand in hand, with companies understanding that explainability and communicating
    risk impacts even those that hold high positions within companies.


    Gartner lists AI trust, risk, and security management (AI TRiSM) as a strategic
    technology trend for 2023, citing that in the US., UK, and Germany, 41% of organizations
    had experienced an AI privacy breach or security incident. This further highlights
    that the world is still ripe for responsible AI practices that bleed into privacy
    and security and they are very much needed and will continue to stay relevant.
    Seeing these indicators in research organizations is encouraging, but it’s just
    a prediction of the future, not a manifestation.


    As companies continue to build and invest in their AI products, they will need
    to not only build products in a trustworthy way for the benefit of their users
    but they should come to understand that not doing so can threaten their own investment
    in the AI tech they’ve spent so much time, money, and patience building.


    McKinsey’s Technology Trends Outlook 2022 report also highlights trustworthiness
    and explainability in embedded/applied AI as one of the top considerations when
    incorporating AI into products. The ability to hedge risks, particularly as AI
    use cases expand, is of particular concern. Adhering to laws, remaining vigilant
    on ethics, and building AI with social robustness are their recommendations for
    building in a way that mitigates harm. They also note that explainability is closely
    related to this, further highlighting that as models become increasingly complex
    and are deployed on high-risk use cases, the issue of explainability will remain
    critical.


    McKinsey lists explainability as threefold:


    +   - Explaining how the model actually works

    +   - Organizations demonstrating causal explainability, which is about explaining
    why certain outputs come from the inputs.

    +   - Trust-inducing explainability, i.e., explaining why you can trust and deploy
    a model, which is perhaps the most important'
