  md: "+   - The impact of integrating AI into their existing project management product\
    \ meant that sprint cycles had to get updated. It wasn’t enough to split the product\
    \ development into epics for various product areas of ProjectABZ; they had to\
    \ now incorporate new epics around areas like data collection, model training,\
    \ and model iteration. Even post-launch, these epics were static because the work\
    \ of product managing an AI product is ongoing with constant iterations.\n+  \
    \ \n+     Before the re-launch, ProjectABZ was a well-oiled machine. It had been\
    \ released on the market for at least nine years and it was a mature product that\
    \ didn’t need the level of oversight its newly evolved AI-powered counterpart\
    \ did. Because of this, they went from three-week sprints to weekly sprints to\
    \ capture all the elements that were ongoing for the re-launch. Having sprints\
    \ more frequently also allowed them to respond quickly to evolving AI components\
    \ and the challenges that came up when integrating them into an existing system.\n\
    +   - The last major change for the re-launch surrounded the user feedback they\
    \ were incorporating. Prior to AI integration, the ProjectABZ product team was\
    \ able to get user feedback organically since the original launch nine years prior.\
    \ They had partners, user interviews, and marquee customers who provided feedback\
    \ on a rolling basis and they were less methodical about their approach. However,\
    \ they couldn’t risk that for this re-launch; too much was at stake.\n+   \n+\
    \     The product team at ProjectABZ knew that they had to re-focus their efforts\
    \ on receiving feedback from surveys, beta testers, and in-depth user interviews.\
    \ They also added a focus on UX research to manage the ongoing, regular analysis\
    \ of the feedback they were getting from those groups. This feedback was then\
    \ frequently discussed with internal stakeholders and teams to refine the AI algorithms\
    \ further and improve UX post-launch.\n\n# Management alignment\n\nAfter the work\
    \ done on ProjectABZ (outlined in the Case study section in Chapter 15), the product\
    \ team was able to work with their leadership team to update a strategic vision\
    \ of ProjectABZ that exalted its position in the market as an AI project management\
    \ tool. They updated their product roadmap to reflect the new AI features, capabilities,\
    \ enhancements, and integrations that were agreed upon during the design and research\
    \ phase. Strategic alignment was achieved through in-depth product strategy sessions\
    \ that explored how the evolved ProjectABZ product experience reflected the company’s\
    \ overarching business goals and values. These sessions were managed by the AI\
    \ PM and incorporated a lot of the market research and analysis that justified\
    \ the integration of AI in the first place."
