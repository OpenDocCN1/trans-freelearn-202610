- pgno: 333
  md: '+   - **Domino''s Pizza** was strategic about its AI rollout by using AI to
    optimize operations as well as customer experience through the DOM Assist chatbot
    and predictive ordering algorithms. They were able to be most effective by developing
    clean data pipelines, adopting continuous data transformation, and aligning organizational
    expectations around AI integration and launching Project 3TEN, an initiative that
    aimed to have pizza ready for delivery after three minutes and delivered to the
    customer within ten minutes.

    +   - **Capital One** uses AI in its mobile app experience and in their fraud
    detection systems. Their tangible challenges related to building the necessary
    data pipelines and supporting infrastructure to support their AI endeavors, as
    well as training the team on working with AI and even fostering trust in AI decision-making.
    They even went as far as to launch skill development programs to equip their PMs
    with the right skills to effectively support AI deployment and become model owners
    in collaboration with the data scientists they were working with.


    These examples highlight that companies are able to be most successful with AI
    integration when they prioritize their data pipelines and infrastructure needs,
    and when they prepare their teams culturally through setting expectations, training,
    workshops, or other upskilling opportunities.


    At its core, AI enablement is really all about the data. Finding a way to most
    efficiently collect, label, and curate large amounts of unstructured data is what
    allows model performance to improve most consistently. Improving that data pipeline,
    keeping it clean, and making sure there is a steady supply of it to be used for
    training purposes is what gives the AI/ML pipeline its capabilities. Making sure
    the right data transformations are happening and the proper level of data quality
    is in place is the ultimate objective of AI enablement. This is because of the
    tremendous reliance AI has on data.


    The best combination of AI enablement or AI readiness will come from having strong
    use cases to support your investment in AI, having strong networks of clean data
    you can leverage to support those use cases, and having a clear governance strategy
    of who can access what and how roles are delineated within your organization to
    demonstrate ownership, control, and safety measures to make sure your AI investment
    is as successful as possible. We will go into these concepts in more depth in
    the next chapter.


    # Riding the GenAI wave


    Now let’s turn our attention to GenAI models and tools. The rise of LLMs and generative
    models has helped democratize access to AI, bringing capabilities to companies
    of all sizes without the significant investment they originally needed to scale
    their products. It’s not the models themselves that are becoming more accessible,
    but the infrastructure needed to employ those models in production as well. Given
    the significant costs to train and deploy applications of AI in production, **infrastructure
    as a service (IaaS)** platforms exist today to help drive innovation and adoption.
    Some of its uses are:


    +   - **Serving as a knowledge base**: Since popular LLMs like ChatGPT have come
    out, we’ve seen them being deployed as chatbots and virtual assistants across
    a variety of products and company websites. In many cases, they serve as a centralized
    knowledge base. Though a generalized approach might be helpful for expanding support
    hours or coverage, the companies that are innovating with chatbots the most are
    able to map chatbot activity to specific use cases that reduce or limit reliance
    on call centers and support teams internally.'
