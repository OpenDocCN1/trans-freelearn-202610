- pgno: 117
  md: 'The world is increasingly global. The global job market supports people all
    over the world who can work remotely or locally, so the idea that someone could
    move or just learn a language out of curiosity seems like it has increased within
    the last 10 to 15 years.


    The idea that people would want to self-express in general, but particularly when
    sharing the collective retreat that was the COVID-19 pandemic, supports the idea
    of a global social media app that helps you create content almost effortlessly.
    TikTok and Duolingo captured the needs of the collective in a way that brought
    relief and ease to millions of people. With Midjourney, we also see an app that''s
    focused on removing the fear-mongering of generative AI replacing artists by firmly
    and economically offering AI power to the very artists themselves. But even this
    is not without controversy. Companies like Midjourney and OpenAI are being sued
    by collectives of artists for copyright infringement because these models have
    been trained with real artists'' work without their knowledge or consent.


    B2C apps are in the business of tapping into the collective needs of the masses.
    Consumers are different from those working with other businesses. There isn''t
    an entire village of potential gatekeepers getting in the way of finding an able
    and willing sale. When selling a product to consumers, you''ve just got to win
    over one consciousness. You''d be tempted to be all things to all people, in a
    way. But catering your product to potentially millions of viewpoints would be
    unsustainable. We can imagine it would also be hard to select and prioritize features.
    But capturing an emotional need that would inspire and engage millions of viewers
    would ring like a bell, and everyone who heard its echo would feel its radiance.
    How so very artsy!


    # The pioneers – examples of blue ocean products


    When we think of pioneers, we think of those who go into uncharted territories
    with curiosity and are rewarded for their bravery. Blue oceans are especially
    difficult to navigate because you are creating demand for a product and, in essence,
    creating a market. The belief and vision required to survive the uncertainty in
    this kind of market is something very few people can sustain for very long. The
    evangelism, experimentation, and mission-building make pioneers stand out from
    the crowd. The first path to be forged carries with it an inherent virtue. All
    subsequent paths have you to thank for laying the foundation.


    With pioneers, we wanted to focus on companies that were seeking new categories
    or use cases for their products. These are companies that are finding new paths
    to create demand for what they offer, and these companies create demand for themselves
    in multiple ways. This is what''s referred to as a **blue ocean**: a competitive
    landscape that''s still being formed, that doesn''t see a lot of competition (yet),
    and that has to advocate for its own demand. It''s relatively straightforward
    to explore the market in a red ocean because so many pathways have been created.
    There is already a thriving ecosystem to learn and navigate. But pioneers have
    to work for this knowledge.'
