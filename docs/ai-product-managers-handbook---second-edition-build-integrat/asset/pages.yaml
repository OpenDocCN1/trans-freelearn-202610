- pgno: 367
  md: '# Ideation: Managing expectations


    In order to bring a product to market that’s significantly better than its first-gen
    counterpart, we have to understand the expectations and experiences of our users’
    needs. These needs are likely to change over time as the competitive and technological
    landscapes change as well. Theoretically, a product team is already aware of their
    users’ issues, concerns, pain points, and demands. After all, maintaining a feedback
    loop with your customers is already a foundational part of a product role at most
    companies.


    If you’ve been on a product team managing a traditional software product for some
    time, you’ve likely already got a baseline for how your product is currently serving
    your customers. You have a backlog of potential features you’re already planning
    to develop. Even traditional software products have predefined algorithms that
    help to solve specific problems based on user inputs. The integration of AI doesn’t
    necessarily change any of this, but what it does do is force us to re-envision
    what a product experience with AI might look like for potential customers. The
    existing version of your product is effective to some level, but it’s likely that
    it falls short in other aspects. AI introduces the ability to fill these cracks
    in our product offering, turning shortcomings into opportunities for a renewal
    in product design.


    Beyond the level of existing product functionality, new expectations and assumptions
    will come from incorporating AI. Today, AI is a polarizing topic since people
    have varying viewpoints. Some are excited about what AI might mean for them, while
    others are uncertain about what an AI-heavy future might look like. Some are disturbed
    that AI is learning more about our behaviors than we realize, while others find
    a world where AI might anticipate our next need a welcome relief. For most, AI
    can elicit conflicting feelings across different times and contexts. Either way,
    incorporating ML and DL models will redefine what your users and customers come
    to expect from your product.


    Taking a step back after the strategic decision to incorporate AI and go back
    to your early design principles allows product teams, developers, data teams,
    leaders, and UX designers the chance to reassess the core problems your product
    is offering a solution for. For example, if your product is a customer relationship
    management platform, perhaps it’s gotten really good at managing customer data
    and logging interactions. But with AI, your product could learn from those interactions.
    It could offer your customers a sense of partnership, helping them with predicting
    customer behaviors and future interactions, automating outgoing messages, or offering
    advanced analytics and insights to your users.


    Now your product isn’t just fixing one problem it already knew about; it’s helping
    your customers and users anticipate future problems they weren’t yet aware of.
    This brings the product into a new echelon. If your customers accept your pricing
    model and value proposition in comparison with the other players in your market
    under the conditions before, what does that mean for future iterations of your
    product with new AI capabilities? Then, you get into a different kind of conversation.
    Does this new iteration of your product give overblown expectations to your customers
    about what they can reasonably expect from your product?'
