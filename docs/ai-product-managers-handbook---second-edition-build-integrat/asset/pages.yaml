- pgno: 387
  md: '# 16


    # Managing the Evolving AI Product


    In Part 2 of this book, we covered the aspects of going to market with an AI-native
    product and the intricacies involved with novice products coming into the market,
    both from a product design and a product management perspective. In Part 3, we’ve
    covered the same topics. Only here, it’s through the lens of transitioning from
    a traditional software product to an AI product. This chapter is meant to summarize
    the elements we’ve already discussed throughout Part 3 with a focus on the day-to-day
    experience of managing an evolved AI product. We will cover the various areas
    of product management of the evolved AI product and the considerations involved
    with taking an existing software product that already has:


    +   - An established customer base

    +   - An internal team supporting its development

    +   - Operational infrastructure already set up

    +   - A hospitable market that currently supports an existing product’s success


    This represents a departure from the considerations we looked at in Part 2, which
    did not build a culture and standard process around the areas highlighted above.
    This illustrates the point of why AI transformation is so hard for companies to
    get right. Sure, it’s challenging to go to market with a new product. Of course,
    there are so many considerations to get right when you’re launching a new product
    in a new market. However, re-launching an existing product with AI features and
    capabilities poses a unique challenge because you already have the infrastructure,
    cultural norms, and standard procedures set up for the existing version of a traditional
    software product.


    Many things will need to change when you’re embarking on AI transformation and
    evolving your existing product to embrace AI. For starters, the product vision,
    strategy, and roadmap will all have to be reenvisioned with respect to transitioning
    to an AI product. This means that, in addition to launching a product in the market
    and ensuring its commercial success, you’re also battling the inertia of the way
    things were done before internally. You don’t have to necessarily worry about
    this when you’re building natively with AI; everything is new there. However,
    that’s not the case when you’re re-launching an existing product.'
