  md: '+   - Productizing AI-powered outputs – how AI product management is different

    +   - Customization for groups – considerations for verticals and customer groupings

    +   - Selling AI—product management as a higher octave of sales


    # Stages of AI product development


    Whether your organization is robust enough that you’re supporting multiple product
    teams for various stages of your AI product development or lean enough that you’re
    running on a skeleton crew that will see your product through each stage, you’ll
    want to be cognizant of what these different stages are so that you can define
    success through each phase.


    There are various schools of thought on what product management is or should be.
    Few universities offer courses on product management as part of an undergrad or
    graduate program. Since the product world is still nascent and growing every day,
    I would even venture to say that the role of a PM varies from company to company
    in terms of expectations, roles, and responsibilities. We’ll do our best here
    to describe the various phases in a way that best summarizes the core aspects
    of AI product development.


    Either way, as an AI PM or leader of an AI product, you’ll want to consider how
    your product relates to each of these phases so that you can identify the phase
    your product is currently in and what you need to do to bring it to full maturity.
    Here’s a tailored version of the key phases in AI product development:


    ![](img/a0c9f9a2ba06a06d309ce21d890a47c6_150_0.png)


    Figure 6.1: Stages of AI product development'
  merge: -1
  img_proc: true
- pgno: 151
  md: '# Phase 1 — Ideation


    Just as with the traditional software product lifecycle, as a PM, you''ll be involved
    in the ideation phase. You might see this referred to as the innovation or design
    phase as well. Whatever you call it, this is the phase where the brainstorming
    on features is happening, and as a PM, you''re a key stakeholder in influencing
    the direction of the product. This is the phase where you''re also weighing the
    cost/benefit of incorporating various features, as well as identifying the non-negotiables
    for your product.


    One differentiator between traditional software development and AI product development
    in this phase is that the focus on ideation is even more important before continuing
    because the costs of investing in an AI product are great. Therefore, you want
    to be heavily focused on this phase before you move on in the product development
    lifecycle. You don''t want to be going back to the drawing board after you''re
    in the thick of it with your product only to realize halfway through that you
    have a better idea of how to leverage AI for your product and have to lose months
    of work, time integrating a specific tech stack, storage, and an expensive headcount.


    Ideally, the work in the ideation phase results in getting a picture of what the
    product will look like using UX mockups/wireframes and surveys, as well as gathering
    the requirements you need to have in order to properly scope out your MVP. As
    a PM, perhaps the most important part of your role is understanding what the actual
    opportunity or problem is you''re addressing. This is true from the market perspective
    as well as the ML perspective.


    Where ML is concerned, you''re using AI to address the following types of problems:


    +   - **Anomaly detection:** Applying AI/ML to identify rare or unusual patterns
    that do not conform to expected behavioral patterns (e.g., fraud detection)

    +   - **Clustering/peer grouping:** Applying AI/ML to group data points into distinct
    sets based on similarities (e.g., user segmentation)

    +   - **Classification:** Applying AI/ML to assign labels to data from an established
    set of categories (e.g., spam detection)

    +   - **Regression:** Applying AI/ML to predict a numeric value based on training
    data (e.g., predicting housing prices)

    +   - **Recommendations:** Applying AI/ML to suggest relevant items or content
    based on established preferences (e.g., shopping cart recommendations)

    +   - **Ranking:** Ordering or prioritizing items based on criteria (e.g., search
    engine results)

    +   - **Optimization:** Finding the best solution from a set of potential solutions
    (e.g., driving route optimization)

    +   - **Generation:** Creating new data/examples based on input examples/prompts
    (e.g., image generators)


    Getting clear on which Problem with a capital-P you''re addressing in the market,
    as well as which ML problem you''re solving based on the eight competencies we
    just discussed in the preceding list, will be your most important task as a PM.
    Everything else is secondary.'
  merge: -1
