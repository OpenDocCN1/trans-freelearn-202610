- pgno: 155
  md: 'By the end of this phase, you should have the following in place:


    +   - **Documentation of the methods and models that have been tested:** This
    should include strong model contenders that have been evaluated along with metrics
    used to assess their performance. Criteria used to select the final model or ensemble
    of models should explicitly define the business and technical factors that led
    to the selection. Include content about how these models have been tested and
    if there are concerns that they may not scale or generalize well in real-world
    conditions. This should also include documentation of any A/B testing results,
    cohort analysis, and confidence intervals used for various models.

    +   - **Clear acceptable performance thresholds for your MVP:** Include thresholds
    for precision, accuracy, and other performance metrics that are acceptable to
    internal stakeholders and end users alike. This will help make sure the MVP is
    performing well after deployment, and integrating triggers, logs, and alerts when
    performance dips below this threshold will ensure your team remains proactive
    should performance issues arise. Identify potential risks such as bias or performance
    degradation over time.

    +   - **Tools, resources, or infrastructure that data scientists and ML engineers
    need to make the MVP successful:** In addition to the infrastructure needed to
    support your data management, there will also be infrastructure needed to support
    the AI/ML teams. Ensure your technical team has what it needs to carry out effective
    R&D including platforms, compute power, and other tools to support their work.

    +   - **Product requirements and user stories that tie model selection and performance
    back to business goals and customer needs:** Often, when we’re building and thinking
    about technical investments and restraints, we are looking to optimize our resources.
    But remember to connect the tech back to what matters most: providing value to
    your target users. Create a narrative around the research being done and how it’s
    impacting customers, users, and the overall business’s success.

    +   - **A plan for refining and iterating on the MVP:** Remember the MVP is just
    the starting point. From there, you are making future iterations on your product.
    How will the MVP continuously improve? How will your models be retrained? How
    often? New data and performance feedback will start to create momentum around
    your MVP, so have a plan in place to catch this momentum.


    # Phase 4 — Deployment


    We’re using deployment as an umbrella term here for everything that comes after
    the R&D phase. At this point, you’ve settled on a model or a collection of models
    that satisfies your product ideation and MVP requirements, is supported by your
    data infrastructure, and has been thoroughly tested. Now, you’re ready to build
    the supporting infrastructure to make sure this model and its outputs can be integrated
    into the broader product that your end users will experience. This is the deployment
    phase, where you’re marrying the work of your data scientists and ML engineers
    to the work of your full stack developers and actually integrating it into the
    greater product that will support these AI/ML outputs.'
  merge: -1
  img_proc: true
- pgno: 156
  md: 'Your product may have many *features*, and only a couple of them may be AI
    features, or the very heart of your product could be ML. Regardless of how rooted
    in AI your product is, you will need to deploy the ML findings from the models
    you’ve invested time in building in the context of the greater UI/UX. Because
    of this integrative dance that has to happen between your AI/ML code and your
    production code, you might go through your own R&D phase with deployment as well.
    Selecting the proper ML model and technique is a separate process from selecting
    the proper way to showcase and use the outputs of that ML R&D and how to maintain
    those outputs.


    The broader context of the deployment phase is really to create continuity and
    delivery of the substance of your ML outputs. This is also where you’ll be creating
    processes and structure around the continuous maintenance and delivery of your
    product, which were outlined in Chapter 2.


    Here are some aspects that you should have taken care of during this phase:


    +   - **Considerations for integrating your MVP into your product or platform:**
    Ensure the frontend and backend systems are fully integrated into your MVP so
    that AI functionality and UI/UX are blended seamlessly. Document the deployment
    process and details about how models were integrated into your MVP so that knowledge
    is retained and easily transferable.

    +   - **Production infrastructure is set up for model serving:** Models used in
    production need to remain scalable, reliable, and responsive. Maintain the appropriate
    microservices, APIs, containers, or platforms needed to keep model deployment
    smooth in production.

    +   - **Automation of model monitoring and maintenance:** Set up triggers, logs,
    and flags to monitor your models in production and alert you when performance
    drags below the thresholds you established. Tracking performance and detecting
    potential issues can trigger model retraining or updates when they’re needed most.
    Make sure your MVP is set up with pipelines that ensure the model powering it
    stays relevant as new data is collected and used. Maintain performance standards
    by stress testing models to ensure that production performance metrics align with
    expectations set during Phase 3.

    +   - **Feedback loops from customers and users post-production:** Whether it’s
    in product surveys, questionnaires, customer calls, or focus groups, having a
    method of gathering and applying user feedback on your MVP will help identify
    areas for improvement and minimize edge cases or unintended bias.


    Now that we’ve covered the various phases of the AI product development lifecycle,
    let’s focus on the folks that will make the magic happen in the first place: the
    AI product team. Building a new team for a new AI product is tricky, and it can
    be tough to adequately hire for the needs of your product. Every product and company
    will have different needs, so we will try to remain as objective as possible in
    this section.'
  merge: -1
  img_proc: true
