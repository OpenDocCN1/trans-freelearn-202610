- pgno: 419
  md: '+   - **Consumer-facing (B2C) AI products:** This is anything that''s being
    developed for end users to interact with directly, like home devices, personal
    assistants, and recommendation systems. These will be areas where **user experience
    (UX)** is emphasized. Most of the time, they''ll also come with some sort of NLP
    or computer vision since these will be apps that have to do with your local, immediate
    environment.

    +   - **Enterprise (B2B) AI solutions:** If you''re looking to stay within the
    confines of B2B solutions, there will be no shortage of work for that too. All
    businesses need AI solutions to help them with day-to-day operations. Analytics
    platforms, automation tools, or anything that helps teams with making decisions
    will be applicable here. If your background is in enterprise or SaaS software,
    process optimization, or data platforms, you''ll find a thriving ecosystem here.


    Beyond these two major areas, you also have subgroupings based on industry. We''re
    seeing robust ecosystems for AI PMs in healthcare, finance, transportation, manufacturing,
    and logistics. Because of the pervasive effects of AI, we''re going to see AI
    applications crop up across all industries. So if you''ve always wanted to break
    into any one industry, maybe you can help become one of the innovators to bring
    that space into the future.


    # Case study


    As I thought about a case study for the chapters in *Part 4*, I was tempted to
    create hypothetical career trajectories for readers to follow along. But to do
    that would be intellectually dishonest. It presupposes that there are tried and
    true pathways to success as an AI PM, and it''s exactly what I want to avoid in
    this book. The truth is that your unique blend of experiences, tastes, and interests
    will contribute to your success as an AI PM in ways no one can predict. The idea
    that one can follow a set path or trajectory to land the job one wants is one
    that I want to leave in the past. When I think of AI PMs today, I think about
    how much potential there is for AI products and the importance of bringing people
    into the discipline from various backgrounds.


    Here, I will be sharing my own journey to becoming an AI PM and some of the considerations
    that were relevant to me as I was getting started. The following is a breakdown
    of the steps I took to demonstrate my abilities as a well-rounded AI PM early
    on:


    +   1. Learned Python and got a foundation for data concepts through MOOCs (MIT
    xPRO/ Coursera/Udemy/DataCamp)

    +   2. Completed a data science apprenticeship (Thinkful)

    +   3. Built a project portfolio with 7 ML projects

    +   4. Volunteered my data science skills for an early open source app (Fight
    Pandemics)

    +   5. Wrote articles about my knowledge of data science, ML, and product management

    +   6. Worked as a data scientist for an on-demand gift-giving app (Gesture)

    +   7. Built a mental health-focused NLP app with a peer from Thinkful and ran
    it through an accelerator with Women in AI (Waterbear/Akeira)

    +   8. Volunteered to organize events locally for Women in Data and Women in AI'
  merge: -1
  img_proc: true
- pgno: 420
  md: '+   9. Started a book club focused on AI and data science concepts for continuous
    learning

    +   10. An 8+ year career in account management and sales helped me navigate customer
    empathy and problem-solving skills


    Let’s take a look at how I was able to demonstrate competency across the top technical
    and soft skills AI PMs need to be successful:


    +   - **Tech skills:** I was able to demonstrate my technical proficiency by completing
    online coursework, finishing an apprenticeship, building a portfolio, and writing
    about my projects online. I was also able to apply my technical skills to Fight
    Pandemics and Gesture, the two organizations I supported in a data science capacity
    before my first AI PM role.

    +   - **Business acumen:** For this, I leaned most on my prior 8+ year career
    in account management and sales for B2B SaaS companies. In those roles, I was
    client-facing and my primary areas of focus were customer experience and contract
    retention. In some cases, I had a hard target. This showed a proven client-focused
    track record of retaining SaaS customers over time. I also built and launched
    an app with a peer from my Thinkful program, an NLP-based mental health-focused
    app.

    +   - **Communication and leadership:** I served as the NYC and Boston co-lead
    for Women in Data, organizing local events that supported the NYC and Boston communities
    of data and product professionals. I also hosted and moderated a monthly talk
    with Women in AI where I would find women doing incredible work in AI and talk
    to them about it, as well as a monthly book club for Women in Data where we would
    read and talk about a new book about data, AI, ethics, and management. I wrote
    about all these experiences on my personal blog on LinkedIn and Medium.

    +   - **Problem-solving:** I demonstrated this largely through my portfolio and
    open source project work. Because each of my projects was devoted to an area of
    my life I wanted to problem solve, I was able to do this organically as I talked
    about my projects. Because Fight Pandemics and Gesture were the only relevant
    work experiences I had before my first product role, I was able to lean on those
    real-world examples during behavioral questions as well.


    Rather than give you archetypes to aspire to, I welcome everyone who’s interested
    in becoming an AI PM to find their own thought leaders and role models and to
    learn from those individuals directly or indirectly.


    # Summary


    We’ve covered a lot in this chapter. We started with a discussion of the requirements
    for AI PMs entering the space from a theoretical and practical perspective, as
    well as a look into where the AI PM space can be better served by newcomers. We
    also looked at strategies and tools you can put in place to help you stay supported
    and inspired. We briefly looked at the major areas of AI that you could get involved
    in once you are ready to dip your feet in and concluded with a real-life case
    study to ground these ideas further.'
