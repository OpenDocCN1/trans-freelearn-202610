- pgno: 60
  md: '+   - **Shadow deployment:** Running the new delivery time feature along with
    the current delivery time feature. The new feature would gather data about customer
    interactions but the current delivery time feature would be the only one actually
    outputting delivery times visibly to users. Let’s look at the pros and cons of
    this approach:

    +     - **Pros:** The product team can test the new feature with real conditions
    without it actually affecting users.

    +     - **Cons:** Because users won’t actually interact with the new delivery
    time feature, the product team won’t actually know how they’d be affected by it
    and if it would impact user engagement or user behavior.

    +   - **A/B testing:** The product team would split users into two groups with
    the first group using the current delivery time feature and the second using the
    new delivery time feature. The pros and cons would be as follows:

    +     - **Pros:** The product team can compare how effective the current and the
    new feature would be at predicting delivery times, as well as how they impacts
    the user, their behaviors, and their engagement.

    +     - **Cons:** Testing the features needs to be carefully considered and designed
    in a way where the two groups can be equitably compared. The product team also
    needs to be careful not to accidentally overlap users.

    +   - **Canary:** The product team could test out the new delivery time feature
    with only 5% of its users and monitor their reaction to it. The following are
    the pros and cons:

    +     - **Pros:** This allows the product team to monitor any adverse reactions
    to user behavior and engagement and fix any issues before more users experience
    them.

    +     - **Cons:** The small group of users might not be reflective of their entire
    customer base. Some user segments that aren’t in the canary group might be more
    sensitive to the new feature.


    In the end, the product team decided to go with the *A/B testing deployment* strategy
    because they didn’t want to risk unknowns from their canary group and they also
    didn’t want to push a feature without any users directly experiencing the change
    like they would in the shadow deployment strategy. They wanted to get clear, comparative
    measures of the impact of the new feature on user engagement, user behavior, and
    delivery accuracy all at once. Seeing how the rollout would impact users in real-world
    scenarios and having a direct comparison to the existing feature was paramount.
    Because the company had the infrastructure to handle A/B testing appropriately,
    as well as the means to analyze the results comprehensively, they went ahead with
    an A/B test of their delivery time prediction feature.


    Now that we’ve discussed the different deployment strategies, let’s take a bird’s
    eye view and see where AI is taking us.'
