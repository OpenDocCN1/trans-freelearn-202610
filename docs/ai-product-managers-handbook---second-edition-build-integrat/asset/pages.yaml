- pgno: 137
  md: 'There’s a whole slew of music apps using AI to generate new music, such as
    SOUNDRAW, OpenAI’s Jukebox, and Boomy, or lyrics, such as Audoir. Or, maybe we
    can explore the myriad ways AI has been changing how we optimize film schedules,
    promote films, predict the success of films, edit films, and even produce films.
    The use of AI-generated content was a big part of the bargaining done by the Writers
    Guild of America (WAG) and SAG-AFTRA during the strikes in the US in 2023. For
    months on end, countless people came together to protest the networks that were
    looking to diminish the labor and creativity of the actors and writers that make
    blockbusters happen. There is virtually no creative industry that’s going to be
    untouched by AI in the future, and this trend has only escalated with the rise
    and prominence of generative AI models. The rise of LLMs and other generative
    AI models has not only contributed to a wealth of accessible creativity, but they’ve
    severely sped up the ability of AI to effectively convince you. What these powerful
    models offer us as technologists, AI PMs, and customers is the ability to interact
    with a machine that doesn’t feel like a machine. The use of these new models and
    abilities will become more prevalent in the future as AI applications become more
    social. We surpassed the threshold of a previous limitation of generative AI models
    to generate long-form text, which is huge.


    By now, generative models have been around long enough that we’ve all seen AI-generated
    selfies, images, videos, and songs. To the novel eye, they may be fleetingly entertaining
    and fascinating. But after you’ve seen a few, you’ve seen them all. No doubt the
    quality of the outputs will improve as the models get better. But I maintain it’s
    much more interesting to see an artist use AI like they would any other medium
    to not only bring forth art into the world (and get properly paid for that art)
    than it is to spin up a tired, formulaic AI-generated movie in the likeness of
    Brad Pitt.


    All the products we’ve mentioned in this section started with an idea to create
    a product that could bring the richness of life to consumers, and these product
    teams built MVPs out of these seminal ideas.


    # Product perspective


    An MVP should be released to market quickly so that you can start the process
    of collecting feedback on how your users are resonating and working with it, allowing
    you to iterate further through the production process. In many of the examples
    that we just discussed, companies built MVPs that they then tested, and they found
    an overwhelming willingness and curiosity from their target markets to the point
    where there are now many competing products for each aforementioned area. Building
    an MVP that you can test and improve quickly not only helps your own business
    but also creates an even bigger market that attracts more competitors.


    To best leverage AI/ML to build an MVP, here are some approaches you can adopt:


    +   - Begin with a narrow use case of AI and align that use case to the needs
    of your business

    +   - Leverage pre-built AI models where you can from open-source libraries or
    AI platforms like TensorFlow, Hugging Face, or Google Cloud AI

    +   - Agree on data requirements for the MVP and, once it’s live, continuously
    collect data on how users are interacting with it to fine-tune the product experience
    and keep improving'
  merge: -1
  img_proc: true
- pgno: 138
  md: '+   - Leverage customer feedback regularly to inform your product development
    cycle once the MVP is live

    +   - Agree on a baseline of explainability for how your MVP is arriving at determinations
    or conclusions that you will pass along to your users and customers

    +   - Leverage natural language where you can to help with adoption. If people
    have the option to use natural language and effectively speak to a piece of technology
    in their own native language, they’ll gladly take it.


    Building an MVP is a tool to give you an early signal that you’ve got the right
    idea, market, and target customer base. This helps you to quickly and successfully
    balance the needs of your customers with your own commercial success. We can also
    call this product market fit. However, how does this change when applied to governmental
    sectors? We will explore that in the following section.


    # Government and autonomy — how AI will shape our borders and freedom


    Using AI is not all fun and games. The immense availability of data and AI simultaneously
    opens us up to the risk of authoritarianism and the rise of oppression, and the
    collective empowerment to combat threats to democracy across the world. At the
    moment, we have some striking contradictions of power and protection being exerted
    in very different ways, based on a system of shared societal values. Governments
    will increasingly need to focus on preserving their country’s ecosystems and the
    fallout from climate change, and with that focus, there will need to be some degree
    of investment as well. The private sector can only do so much, and we hope that
    governmental bodies will use their influence for the betterment of their citizens.
    Let’s look at how AI will be leveraged in governmental capacities and what it
    means for all of us as consumers and makers alike.


    Let’s take an issue such as voting, which, at least in the US, has seen many headlines
    during the last few presidential elections. Companies such as Microsoft are developing
    electronic voting systems, such as ElectionGuard, as part of their Defending Democracy
    Program to allow for safe, secure, and verifiable voting processes in the future.


    AI also has a role to play in policy-making itself. There are several stages in
    which AI and big data can be leveraged to facilitate the process of legislating.
    We see a range of use cases where AI can be helpful at the legislation and policy
    levels:


    +   - Pattern detection and identification of topics that constituents most want
    to address:

    +     - The UK government has a Data Science Campus that uses AI to analyze social
    media and other sources to detect patterns and identify key issues the public
    is most concerned about. This has allowed the government to understand public
    sentiment about a variety of topics and assist with policy-making (https://datasciencecampus.ons.gov.uk/).

    +     - Singapore’s government launched the “Smart Nation” initiative to use AI
    to analyze data from various sources, including feedback directly from citizens
    to detect emerging trends and topics of public concern to target public engagement
    strategies that are relevant (https://www.smartnation.gov.sg/).'
  merge: -1
  img_proc: true
- pgno: 139
  md: '+   - **Creation of analysis and forecasting at a granular level:**

    +     - Estonia''s e-Residency program uses AI to help non-Estonians start and
    manage a business online in order to attract more e-residents and investors from
    out of the country (https://www.e-resident.gov.ee/).

    +     - Australia''s “National Map” analyzes geographic and socioeconomic data
    to help facilitate better urban planning, resource allocation, and disaster management
    by offering real-time insights for initiatives and responses (https://nationalmap.gov.au/).

    +   - **Generation of data to support findings:**

    +     - The U.S. Census Bureau uses AI to process and analyze large volumes of
    data from the census and surveys it administers in order to provide accurate population
    estimates and demographic data that supports policy decisions and resource allocation
    (https://www.census.gov/data/data-tools.html).

    +     - Canada''s “Open Government” data initiative helps process, generate, and
    make data available from various public sources to enhance transparency and encourage
    public participation in government (https://open.canada.ca/en).

    +   - **Implementation and diagnostic feedback for how certain policies are performing:**

    +     - The Netherlands “AI for Government” project uses AI to monitor and evaluate
    the implementation of policies and provide diagnostic feedback on their effectiveness,
    helping to improve the impact of initiatives and legislation (https://nlaic.com/en/about-nl-aic/).

    +     - South Korea''s “Digital Government” project uses AI to track and analyze
    the performance of various policies and programs and help increase public satisfaction
    with policy outcomes (https://www.dgovkorea.go.kr/).

    +   - **Evaluation of the ultimate effectiveness of certain policies:**

    +     - New Zealand''s “Policy Project” uses AI to assess the impact of various
    policies by offering simulations and predictive modeling to help refine policies
    and enhance economic outcomes (https://www.dpmc.govt.nz/our-programmes/policy-project).


    If governments choose to partner with the private sector or invest in their own
    development of AI applications to address policy-making, we will likely see an
    expansion of the democratic process.


    On a broader societal level, we can see some novel applications of AI that will
    likely continue into the future. The alleviation of bias is something AI can help
    address at the governmental level, where policies are impacting varying demographic
    groups and the intersectionality of their experiences. Companies such as Algorithm
    Audit are doing just that with their bias detection tool. Their product works
    by first analyzing the data used to train and test a model. It also uses various
    statistical methods to assess and visualize different types of bias to examine
    whether certain groups are unfairly represented or treated by the model. Finally,
    it then offers recommendations and remediation efforts to mitigate the bias and
    monitor the models over time.'
  merge: -1
  img_proc: true
- pgno: 140
  md: 'Part of the ethical conundrum of using AI resides with the issue of bias in
    algorithms, a topic made famous recently by M.I.T. Media Lab researcher Joy Buolamwini
    in the Netflix documentary *Coded Bias*. Joy has taken her work forward by building
    her own organization (and effectively her own movement), the Algorithmic Justice
    League, to continue this advocacy for algorithmic bias further. We’re also starting
    to see companies such as Pipeline Equity that advocate for pay transparency and
    equity across demographics to minimize the pay gap and give organizations sound
    business proof for why they should invest in pay equity as well. They do this
    effectively by developing AI tools that use data to detect and analyze bias in
    hiring, **diversity, equity, and inclusion (DEI)**, promotions, and pay equity.
    They also learn from the data they amass by developing guidelines, best practices,
    research, and standards for regulatory frameworks and building training resources
    to spread awareness and educate about risks and biases in AI.


    By far, where governmental bodies are concerned, AI is the elephant in the room.
    Particularly, the use of autonomous weapons and mass surveillance are most controversial
    for understandable reasons. People want to feel safe, but they also don’t want
    their privacy abused. I had the honor of speaking with Colonel Dave Barnes, chief
    AI ethics officer at the US Army Artificial Intelligence Task Force and professor
    and deputy head of English and philosophy at the USMA, at a virtual conference
    I participated in with Women in Trusted AI in 2020. The greatest insight from
    that conversation was the acknowledgment that every country is still grappling
    with how to most responsibly and effectively use AI and understand the potential
    harms and risks. It’s clear that there’s much to be done across governments to
    set limits and understand the full capacity of how AI is leveraged. We’re seeing
    more conversations about how to limit the negative externalities of AI in *defense*.
    Regarding autonomous weapons, the US Department of Defense’s principles of AI
    are as follows: responsible, equitable, traceable, reliable, and governable. This
    sentiment is perhaps best expressed by Air Force Lt. Gen. Jack Shanahan, director
    of the Joint Artificial Intelligence Center: “*The complexity and the speed of
    warfare will change as we build an AI-ready force of the future. We owe it to
    the American people and our men and women in uniform to adopt AI ethics principles
    that reflect our nation’s values of a free and open society.*” Societies aren’t
    free or open if they’re being controlled and oppressed.


    The same could be said for mass surveillance. AI can be used to empower governments
    to oppress and control their citizens, and it can also be used to keep them safe.
    Mass surveillance is also bleeding into the private sector, with many private
    companies choosing to use facial recognition, which is very difficult to opt out
    of, for something as simple as going to a theater or a bar. The recent AI Global
    Surveillance (AIGS) Index shows an increase in AI surveillance being used worldwide.


    The following is an extract from *The Global Expansion of AI Surveillance* by
    Steven Feldstein (https://carnegieendowment.org/research/2019/09/the-global-expansion-of-ai-surveillance?lang=en):'
  merge: -1
  img_proc: true
- pgno: 141
  md: '> "The index shows that 51 percent of advanced democracies deploy AI surveillance
    systems. In contrast, 37 percent of closed autocratic states, 41 percent of electoral
    autocratic/competitive autocratic states, and 41 percent of electoral democracies/illiberal
    democracies deploy AI surveillance technology. Liberal democratic governments
    are aggressively using AI tools to police borders, apprehend potential criminals,
    monitor citizens for bad behavior, and pull out suspected terrorists from crowds.
    This doesn’t necessarily mean that democracies are using this technology unlawfully.
    The most important factor determining whether governments will exploit this technology
    for repressive purposes is the quality of their governance – is there an existing
    pattern of human rights violations? Are there strong rule of law traditions and
    independent institutions of accountability? That should provide a measure of reassurance
    for citizens residing in democratic states."


    With the rise of generative AI models, governments will have to invest in *data
    synthesis and evaluation* regulations to ensure the responsibility of monitoring
    data that comes out of LLMs and other forms of generative AI. While these models
    are especially good at generating new data, making sure that generated data is
    correct, safe, and legal is another story. Increasingly, we’re seeing issues with
    LLM providers being sued for violating intellectual property laws, and this is
    a trend that’s likely to continue and impact artists and creators whose content
    has been used to train LLMs and whose content is likely to be included in outputs
    shared with users as well. Companies like CloudFactory are promoting “Human-in-the-loop
    AI solutions” to combat the lack of accountability when it comes to long-term,
    scalable AI systems.


    What does this mean for AI PMs? Well, for one, if you’re in the *authoritarian
    tech* space, business is booming, no matter your politics! More importantly, it
    means that we as AI PMs have a responsibility to support and create products we
    believe in. Our input and involvement in building these products has massive repercussions,
    depending on the audience and whether you have your eyes set on governmental or
    military aspirations. You should think critically about the products you bring
    to market to see how you can combine the common good with your own success. These
    governmental examples also went through the process of ideating, from building
    an MVP to releasing it and getting feedback. The only difference is these products
    are being administered in areas that affect public citizens, and we would say
    the responsible use and development of these products is the hardest area to get
    right when the potential impact is so high.'
