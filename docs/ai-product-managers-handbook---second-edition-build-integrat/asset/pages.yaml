- pgno: 279
  md: '# 11


    # Managing the AI-Native Product


    In Chapter 6, we discussed the different stages of the AI-native product development
    cycle, the dream team that will power your AI-native product, and the way you’d
    position and sell that product. We also covered the establishment of a product
    vision, strategy, and roadmap in Chapter 8. In this chapter, we’ll be expanding
    on some of those concepts to better understand what the management life cycle
    looks like after you’ve launched a product. Managing the AI-native product is
    a discipline in and of itself and it’s what makes the work of a PM challenging.
    It’s one thing to build and enter a market from scratch and quite another to maintain
    and manage the product thereafter.


    As is often the case, hiring managers and recruiters breathe a sigh of relief
    when a PM comes from an engineering background because they feel it means they
    will better empathize with the dev team that will support their product. While
    that’s nice, and certainly helpful for more technical PM roles, that’s only a
    small part of the story. When building a team, particularly as an AI PM, I urge
    you to find candidates who can show their strengths beyond the technical side.


    Understanding the strategic elements that power your product choices, from leadership
    to internal department feedback to the invisible hand of the market, is more important
    than your technical prowess. Building trust with your colleagues, the people you
    will depend on to execute the roadmap, strategy, and backlog you build with, is
    also more important than your technical prowess. Chances are, if you’re managing
    an AI product, your technical understanding of AI concepts is already quite strong.
    You will need to understand various models and how they work if you’re going to
    work with a team of ML engineers. But as you go on the journey of managing your
    AI product, you will continuously find that these skills are secondary, not primary.


    Some people might be surprised to read that. They may think that as a PM, so much
    of their work is involved with problem-solving technical issues, and understanding
    technical debt or the scope of a body of work. This is true; a lot of your work
    will be focused on this. But if your PM work is largely devoted to these areas
    at the negligence of the others we’ll cover, you’re effectively relegating yourself
    to a DevOps role rather than a true PM role. The core skills for a PM are communication,
    market research, user research, strategic thinking, analytical, leadership, customer
    engagement, and collaboration.'
  merge: -1
  img_proc: true
- pgno: 280
  md: 'We will explore how these skills manifest themselves in the various facets
    of a PM''s work in the following sections:


    +   - The head – Managing alignment

    +   - The heart – Managing people and values

    +   - The guts – Managing the rest


    # The head — Managing alignment


    Defining a product vision, strategy, and roadmap is all part of the work of creating
    alignment. In Chapter 8, we discussed the concept of marrying your product vision
    and strategy with those of your leadership team. This is because the alignment
    you establish needs to be a reflection of those of your company. Product alignment
    is important for the AI native product because AI technology is central to value
    delivery. AI products need to solve the right problems for customers and they
    are highly cross-functional. This means all teams involved with development and
    strategy need to make sure they are working toward the same customer-centric goals.


    Failure to do so would render the resource-intensive process of developing an
    AI system inefficient, which means a lot of wasted time, money, and brain power.
    We don''t work in a vacuum. There''s a reason why companies have core values in
    their career section when they''re recruiting for new talent. What''s publicly
    facing needs to reflect the interests, values, and convictions of the greater
    structure. There has to be a way to set yourself apart from the rest, as well
    as discerning newcomers in the group. In this section, we will expand on some
    of the principles we''ve covered in Chapter 8 and see how they''re employed in
    practice.


    # Vision


    All organizations amplify certain values internally and externally whether they''re
    aware of it or not. If you know how to look, these values are implicit in a company''s
    brand, messaging, and communications of all kinds. Some companies are better at
    crafting these communications in a way that harmonizes with their vision and values
    than others. But this process is happening in the background whether they''re
    good at it or not. This is still the case once you''ve joined a company and are
    in the flow of managing a product. If anything, this becomes more prominent when
    you''re an AI PM for a company because one of your primary tasks is bringing clarity
    and reassurance to a process that''s rife with inherent complexity, ethical considerations,
    and long-term focus.


    Reporting structures and role definitions vary at many companies, but irrespective
    of how your company perceives (and pays) you, an AI PM is always a visionary.
    You have to be! Visionaries see potential and opportunity where others don''t
    and AI products come with a heavy burden for visionary thought because you''re
    often navigating emerging technologies, intricate environments, and frequently
    uncharted user experiences. Because these products are AI native, it can be hard
    to predict how users will engage with AI/ML. What new pain points or benefits
    of using your nascent product will emerge? How might user needs evolve as your
    product, or the technology it employs, matures?'
