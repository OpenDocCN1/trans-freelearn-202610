  img_proc: true
- pgno: 368
  md: 'This is true of your internal stakeholders as well. Part of your work as a
    PM, particularly early on in the AI ideation phase, is to manage the expectations
    of the key stakeholders that also come with their own assumptions and notions
    about AI. Balancing expectations on the customer side and internally isn''t easy.
    It''s one of the reasons it''s recommended to include stakeholders in product
    design discussions and brainstorms as early as you can. Doing so will mean you
    get ahead of their input, perspective, and concerns, but it also means you can
    soften the blow of a paradigm-shifting technological adoption.


    Your development teams will also be impacted by the integration of an AI system
    as it relates to scalability because of the impact it will have on development
    in general. In traditional software development, we''re often working in some
    kind of Agile framework that follows a linear path of gathering requirements,
    designing, developing, and testing. But this process will be stressed with the
    implementation of AI because of the iterative nature of AI. Though an organization
    may already be agile, the development and management of AI systems in your existing
    workflows will still have an impact. This is because AI model development involves
    more iterative cycles of training, testing, and tuning, which will lead to a slower
    time to delivery than what an agile engineering organization might already be
    used to.


    The team will also need to start working with new kinds of infrastructure and
    tooling, like data pipelines, model training environments, and ML frameworks,
    once AI is involved. Your existing development process and culture will be impacted
    by experimenting with various models, training methods, validation methods, and
    model tuning as you are operating within the confines of your established development
    cycle and legacy systems. Adopting methodologies to catch the continuous evolution
    of your data science and machine learning functions and pipelines will ensure
    you''re setting your development teams up for success as they stretch to accommodate
    the new paradigm of AI.


    To successfully manage the design expectations of all your internal and external
    stakeholders, you should be able to answer the following questions at the end
    of your ideation phase:


    +   - Can your stakeholders clearly define the core challenges in your product
    that AI will address?

    +   - Can they articulate how AI will improve the product for users? Which specific
    pain points will it alleviate?

    +   - Can stakeholders articulate how the new AI features and capabilities will
    differentiate your product from competitors in a new landscape?

    +   - Do all relevant business and technical stakeholders understand the measurable
    goals and metrics tracked for the new AI features and capabilities?

    +   - Are all stakeholders aware of how the new AI features and capabilities relate
    to product strategy, vision, and goals? To company goals?

    +   - How will the product interface evolve with AI and how will users interact
    with AI-driven features?

    +   - How will the user journey and customer behavior change with integrated AI
    features and capabilities? How will this be communicated to customers and users?

    +   - How will the integration of new AI features and capabilities impact existing
    business processes and operations?

    +   - What are the expectations around re-training or upskilling staff to better
    adjust to this impact?'
  merge: -1
  img_proc: true
- pgno: 369
  md: '# Data management: Strategizing and integrity


    Because AI products are so reliant on data, there will have to be significant
    discussions about what that means for your data strategy overall. How will data
    be entered, transformed, processed, stored, and trained on? What system will you
    put in place to ensure the quality remains high, that is, that it’s safely stored
    and retrieved? Data architecture and data management are dedicated practices on
    their own, and many companies can find themselves overwhelmed by the data demands
    of building AI features if they’re not prepared for the cost and competency of
    understanding these considerations before they’ve deployed any AI features.


    Part of going back to the drawing board means necessary conversations about how
    the data will be captured, categorized, and processed to make sure it actually
    makes your AI capabilities useful. Testing your AI features to make sure they
    work as intended will often come down to how reliable and scalable your data is.
    We will discuss AI bias and ethics later on in this chapter from a design perspective,
    but this is a consideration that’s worth noting in this first section because
    you’ll likely want to have some alignment on how you’re going to address data
    security early on in your AI ideation process.


    While you might not necessarily want to have all these decisions made at the ideation
    stage, you should be setting aside dedicated time for these discussions to happen
    early on because the determinations you make will have a downstream impact on
    how your product is built and developed. It will certainly have an impact on how
    it will amass storage and compute costs. Finding a way to be agile with your ideations
    and start vetting requirements, costs, and scope for each, even if they’re rough
    estimates, will help you plan strategically from the beginning.


    To successfully manage data strategy and integrity, you should be able to answer
    the following questions at the end of your data management phase:


    +   - How will data to support your AI features and capabilities be centralized
    and structured for AI/ML?

    +   - Have you established processes to execute data preparation standards to
    handle your proposed AI features and capabilities?

    +   - How will data pipelines be monitored to remain reliable to process new volumes
    of data?

    +   - How will quality issues in data or data pipelines be flagged and addressed?

    +   - What kind of robust privacy measures will you plan to carry out in order
    to make sure your customer and user data is stored appropriately?

    +   - Are you planning to make transparency and data privacy a central fixture
    of your product offering in the first place?

    +   - Which data governance and ownership standards will you implement?

    +   - How will you address issues of data bias? Will this be something you test
    for regularly?

    +   - How will you make sure training data for your models is accurate and up
    to date?

    +   - How will your organization comply with national and global regulations like
    GDPR, CCPA, and others?'
