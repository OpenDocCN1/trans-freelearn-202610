- pgno: 66
  md: 'Through each stage, we''ll cover the major foundational areas, from the ideation
    to the launch of an acceptable first version of a product. The steps are laid
    out incrementally:


    +   1. In the **Discovery** stage, you brainstorm about the need you''re looking
    to address in the market and why that need needs to be bolstered by AI.

    +   2. In the **Define** stage, you bring in your product requirements for your
    product.

    +   3. In the **Design** stage, you bring in the active visual and experiential
    elements of your end product.

    +   4. In the **Implementation** stage, you build it out.

    +   5. In the **Marketing** stage, you craft a message for your broader audience.

    +   6. In the **Training** stage, you put your product to the test and make sure
    it''s being used as intended.

    +   7. Finally, in the **Launch** stage, you release your product to a broader
    audience for feedback.


    This can be illustrated by the following framework:


    ![](img/a0c9f9a2ba06a06d309ce21d890a47c6_66_0.png)


    *Figure 2.1: The NPD stages*


    Let''s get into these stages in more detail in the following sections.


    # Step 1 – Discovery


    In this phase, you''re ideating. You look to isolate the particular problem you''re
    trying to solve, and in the context of a machine learning (ML) product, a crucial
    part of this first phase is understanding why you''re trying to solve that particular
    problem with ML in the first place. To borrow a phrase from Simon Sinek''s popular
    book *Find Your Why*, this is where you “find your why.” This is the phase in
    which you contemplate the fundamentals of the problem at hand and look to isolate
    what is most urgent about the problem so that you can later address an unmet need
    or under-served customers.


    This requires gathering qualitative and quantitative customer feedback about the
    particular issue they''re facing that you''re looking to address, as well as doing
    market and competitive analysis to understand what potential solutions are out
    there today. The biggest focus here is creativity – to brainstorm potential solutions
    that you can then analyze and further explore (or discard) later. Not every problem
    will be solved with AI/ML and it''s important to develop discernment when you''re
    working with emerging technologies and be mindful and critical about when to employ
    them. In some cases, there might not be enough high-quality or diverse data to
    make AI/ML a reasonable solution to the problem you''re trying to solve. Or, very
    simply, rules and formulas might be enough to solve your problem rather than training
    ML algorithms. In many cases, ML might be too costly a solution for the gains
    it may bring.'
