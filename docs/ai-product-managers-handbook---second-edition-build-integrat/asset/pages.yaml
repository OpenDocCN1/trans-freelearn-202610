- pgno: 401
  md: '# Operational alignment


    From an operational perspective, both leaders at the ABCDZCo company level and
    the ProjectABZ product level understood that an AI re-launch was going to mean
    a significant financial investment. Computational resources, cloud services, AI
    processing hardware, and increased AI-focused head count all contributed to the
    costs of maintaining a pilot AI program. However, setting up the proper infrastructure
    to support ProjectABZ meant that ABCDZCo could then use that same infrastructure
    to support their other products as they scaled and increased their margins with
    ProjectABZ. Data pipelines also had to be updated and optimized to make sure the
    flow of high-quality, clean data would feed their AI models.


    From a maintenance perspective, new workflows had to be created to handle the
    new supply of data feeding the models. AI model training, validation, deployment,
    and continuous monitoring had to have established workflows of their own. The
    team also had to build out automation to handle repetitive tasks and set up flags
    and logs to oversee all the new workflows and activities that had to be created
    to support and monitor the new AI program, particularly as it related to AI model
    performance, anomaly detection, and troubleshooting. This meant that there had
    to be regular model retraining schedules with the latest, refreshed data, as well
    as security protocols to strengthen and protect their data and AI models from
    breaches and adversarial attacks.


    # Results and outcomes


    Nine months post-re-launch, this resulted in the following product outcomes for
    ProjectABZ:


    +   - **Efficiency improved:** The evolved product led to a 43% reduction in project
    delays and efficient task management. The automated resource allocation helped
    project teams make more informed decisions and an 18% increase in project success
    rates.

    +   - **UX improved:** In-product summaries reflected a 36% increase in user satisfaction
    levels compared to the original version of the product with positive feedback
    surrounding the new AI features, with users finding them intelligent, intuitive,
    and valuable in helping them with their work. The new chatbot feature also helped
    users reduce their admin time on the platform by a whopping 63%.

    +   - **Differentiation improved:** ProjectABZ did gain a competitive edge in
    the market and the new features helped attract customers that previously churned
    for other competitors. They were able to re-attract 22% of their churned customers
    from the past three years. The re-launch also helped rebrand ABCDZCo as a future-oriented,
    forward-thinking company. ABCDZCo also experienced a 45% reduction in churned
    employees because of how they handled the cultural impact of AI product integration.'
