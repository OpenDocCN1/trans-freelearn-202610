- pgno: 57
  md: "At this point, most companies haven’t been running AI/ML programs for decades\
    \ and don’t have dedicated teams. Tech companies like Meta, Amazon, Apple, Netflix,\
    \ and Google are leading the cultural norms with managing AI/ML, but most companies\
    \ that will need to embrace AI are not in tech and are largely unprepared for\
    \ the technical debt that AI adoption will pose for their engineering teams to\
    \ manage. Managing and integrating legacy systems alongside new AI technologies\
    \ and capabilities, building structure around the AI/ML life cycle, bringing in\
    \ enough technical skill to make it all happen in the first place, scoping compute\
    \ resources and storage needs, managing cloud and on-premises services and infrastructure,\
    \ and managing costs are all complexities an AI PM will need to think about and\
    \ prepare for.\n\nShortcuts taken to get AI initiatives off the ground will require\
    \ code refactoring or changing how your data is stored and managed, which is why\
    \ strategizing and planning for AI adoption is so crucial. Even beyond the planning\
    \ and costs, an AI PM will need to help the organization measure the success and\
    \ failure of the AI initiatives it’s planning, particularly if those AI initiatives\
    \ are directly supporting their product. Setting up performance metrics, measuring\
    \ the impact on the business, establishing a pattern of adoption and satisfaction,\
    \ and linking that to return on investment (ROI) are all important facets of an\
    \ AI PM’s work. This is why so many of these IaaS services are popping up to help\
    \ keep engineering teams nimble should they require changes in the future as well.\
    \ The infrastructure needed to keep AI teams up and running is going to change\
    \ as time goes on, and the advantage of using an IaaS provider is that you can\
    \ run all your projects and only pay for the time your AI developers are actually\
    \ using data to train models.\n\n# Deployment strategies — what do we do with\
    \ these outputs?\n\nOnce you’re happy with the models you’ve chosen (including\
    \ their performance and error rate) and you’ve got a good level of infrastructure\
    \ to support your product and chosen AI model’s use case, you’re ready to go to\
    \ the last step of the process and deploy this code into production. Keeping up\
    \ with a deployment strategy that works for your product and organization will\
    \ be part of the continuous maintenance we outlined in the previous section. You’ll\
    \ need to think about things such as how often you’ll need to retrain your models\
    \ and refresh your training data to prevent model decay and data drift. You’ll\
    \ also need a system for continuously monitoring your model’s performance so this\
    \ process will be really specific to your product and business, particularly because\
    \ these periods of retraining will require some downtime for your system.\n\n\
    > Over time, an ML model’s performance can experience a gradual reduction in performance\
    \ if there are changes to underlying patterns or relationships in the data that\
    \ is being used to train them. This is known as model decay.\n> \n> When data\
    \ used by an ML model changes or shifts from what the model was originally trained\
    \ on, it can make a model’s predictions less accurate because the patterns have\
    \ changed. This is known as data drift."
