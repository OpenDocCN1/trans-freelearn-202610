- pgno: 93
  md: 'The idea is you would pass these steps through the model multiple times until
    you were satisfied with the performance. Remember the distinction between supervised
    and unsupervised learning in *Chapter 1*? Because MLPs use backpropagation to
    minimize their error rate by adjusting weights, MLPs are a supervised DL algorithm
    as they know, based on the label data, exactly how far off they were from being
    right. These algorithms are also heavily used in ensembles with other ANNs as
    a final polishing stage because of their ability to handle complex, non-linear
    relationships in tabular data. Business use cases are most appropriate in classification
    problems like customer segmentation and personalization, fraud detection, forecasting,
    prediction, and scoring.


    # ## Case study


    A financial services firm wants to update its credit scoring system because the
    existing model is based on traditional statistical models and is quickly becoming
    outdated. Given the influx of data and complexity in the market, their old system
    has become less effective. The firm is looking for a more sophisticated model
    that would handle the large volumes of data and the various data types and sources,
    and could also improve on predicting credit risk. If the new model could reduce
    the rate of defaults (primary goal) and improve creditworthy customer approval
    rates (secondary goal), the investment would be successful. Here’s why an MLP
    was chosen as the favorite among the DL models tested by the AI PM team:


    +   - MLPs can integrate easily with existing systems and handle complex, diverse
    datasets. So, it was a practical choice because it was integrated smoothly with
    the firm’s existing infrastructure.

    +   - MLPs excel at modeling non-linear interactions between features and this
    made it useful for capturing the complexities of a credit risk.

    +   - The firm had diverse data that included transaction histories, credit behavior,
    demographic data, and appended external data sources, which meant they had to
    invest in a DL model that could process high-dimensional data elegantly. The MLP
    proved versatile with the data and effective at identifying high-risk customers,
    which addressed the primary goal.


    The following is a list of other DL models that were tested but ultimately not
    chosen:


    +   - CNNs: Because the firm’s data was primarily tabular data that included transaction
    records and credit scores, a CNN would not have been a great choice.

    +   - RNNs: These models are better suited for time series or sequential data
    so it wasn’t fully able to capture the complexity of the data the firm had.

    +   - Autoencoders: These models helped the firm identify relevant features in
    their high-dimensional data but, ultimately, the model helped point out associations
    more than it was able to classify someone as a credit risk. Experimentation with
    autoencoders was, however, useful once they landed on MLP.


    After the deployment of its new DL-powered system, the firm saw an 18% reduction
    in default rates and a 10% increase in approval rates for creditworthy customers.
    This meant that both the primary and secondary goals of the product team were
    met.'
