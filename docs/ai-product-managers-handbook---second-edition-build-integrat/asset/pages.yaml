- pgno: 33
  md: '+   - The first group lies with the emergence of models that continue to progress
    through statistical models.


    +   - The second group lies with the emergence of models that try to mimic our
    own natural neural intelligence.


    Colloquially, these are referred to as traditional ML and DL models, respectively.
    In this section, we will take a look at the traditional statistical ML models
    in order to understand both the historical relevance and prevalence of ML models.
    Some of the most reliable and prevalent models used in ML have been around for
    ages. **Linear regression** models have been around since the late 1800s and were
    popularized through the work of Karl Pearson and Sir Francis Galton, two British
    mathematicians. Their contributions gave way to one of the most popular ML algorithms
    used today, although unfortunately, both were prominent eugenicists. Karl Pearson
    is also credited with inventing **principal component analysis** (PCA), a learning
    method that reduces dimensions in a dataset, in 1901.


    ![](img/a0c9f9a2ba06a06d309ce21d890a47c6_33_0.png)


    In the context of datasets, dimensions are categories or variables you would use
    to describe and analyze your data. Think of them as “labels” or “attributes” that
    give context to the elements you have within a dataset. For example, a customer
    database might include the age, gender, and location dimensions


    A popular ML method, **naïve Bayes classifiers**, came onto the scene in the 1960s
    but they’re based on the work of an English statistician named Thomas Bayes and
    his theorem of conditional probabilities, which is from the 1700s. The logistic
    function was introduced by Belgian mathematician Pierre Francois Verhulst in the
    mid-1800s, and **logistic regression** models were popularized by a British statistician
    named David Cox in 1958.


    One of the simplest ML models for classification and regression, the **KNN algorithm**,
    emerged from a technical analysis report that was done by statisticians Evelyn
    Fix and Joseph Lawson Hodges Jr. on behalf of the United States Armed Forces in
    collaboration with Berkeley University in 1951. K-means clustering, an ML clustering
    method, was first proposed by a mathematician at UCLA named James MacQueen in
    1967. As you can see, many of the algorithms that are used most commonly in ML
    models today have their roots quite far back in our modern history. Their simplicity
    and elegance add to their relevance today.


    # # A brief history of DL


    In 1943, Warren S. McCulloch and Walter Pitts published a paper, *A logical calculus
    of the ideas immanent in nervous activity*, which made a link between mathematics
    and neurology by creating a computer model based on the neural networks inherent
    in our own brains based on a combination of algorithms to create a “threshold”
    to mimic how we pass information from our own biological network of neurons. Then,
    in 1958, Frank Rosenblatt published a paper that would be widely considered the
    ancestor of neural nets, called *The Perceptron: A Perceiving and recognizing
    automaton*. This was, for all intents and purposes, the first, simplest, and oldest
    ANN.'
