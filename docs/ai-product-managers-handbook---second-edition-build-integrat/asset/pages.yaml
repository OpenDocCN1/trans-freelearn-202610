- pgno: 94
  md: '# **Radial basis function networks**


    Radial basis function networks (RBFNs) came on the scene in 1988 with D.S. Broomhead
    and David Lowe''s paper titled *Multivariable Functional Interpolation and Adaptive
    Networks*. RBFNs differ from most other ANNs we will cover in this chapter in
    that they only have three layers. While most ANNs, including the MLPs we discussed
    in the preceding section, will have an input and output layer with several hidden
    layers in between, RBFNs only have *one* hidden layer. Another key difference
    is that rather than having the input layer be a computational layer, the input
    layer only passes data to the hidden layer in RBFNs, so this ANN is incredibly
    fast. These DL algorithms are feedforward networks, so they are computationally
    only really passing through two layers: the hidden layer and the output layer.


    It would be helpful to think of these networks as similar to the KNN algorithm
    we discussed in the previous chapter, which aims to predict data points based
    on the data points around the value they''re trying to predict. The reason for
    this is that RBFNs look to approximate values based on the distance, radius, or
    Euclidean distance between points and they will cluster or group data in circles
    or spheres to better make sense of a complex multivariable dataset similar to
    how a K-means clustering algorithm from *Chapter 1* would. This is a highly versatile
    algorithm that can be used with both classification and regression problems in
    both supervised and unsupervised ways.


    # **Self-organizing maps**


    Self-organizing maps (SOMs) were introduced in the 1980s by Tuugo Hohonen and
    are another example of unsupervised competitive learning ANNs in which the algorithm
    takes a multivariable dataset and reduces it into a two-dimensional “map.” Each
    node will compete with the others to decide whether it''s the one that should
    be activated, so it''s essentially just a massive competition, which is how it
    self-organizes. Structurally, though, SOMs are very different from most ANNs.
    There''s just one layer or node outside of the input layer, which is called the
    Kohonen layer. The nodes themselves are also not connected the way they are in
    more traditional ANNs.


    The training of a SOM mirrors our own brain''s ability to self-organize and map
    inputs. When we sense certain inputs, our brain organizes those inputs into certain
    areas that are apt for what we''re seeing, hearing, feeling, smelling, or tasting.
    The SOM will similarly cluster data points into certain groupings. The way that
    happens is through a learning/training process where the algorithm sends out the
    data through the input layer and weights, randomly selecting input data points
    to test against the nodes until a node is chosen based on the distance between
    it and the data point, which then updates the weight of the node. This process
    is repeated until the training set is complete and the optimal nodes have been
    selected.


    SOMs will also be in the same class of clustering algorithms such as K-means,
    or the RBFNs we touched on in the preceding section, in that they are useful for
    finding relationships and groupings in datasets that are unlabeled or undiscovered.'
