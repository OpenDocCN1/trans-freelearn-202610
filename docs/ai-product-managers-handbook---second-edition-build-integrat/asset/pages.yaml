- pgno: 35
  md: 'Then, in 1997, Sepp Hochreiter and Jürgen Schmidhuber published their groundbreaking
    work titled *Long Short-Term Memory*, which effectively allowed DL to “solve complex,
    artificial long-time lag tasks that had never been solved by previous recurrent
    network algorithms.” The reason why this development was so important was it allowed
    the idea of sequences to remain relevant for DL problems. Because neural networks
    involve hidden layers, it’s difficult for the notion of time to remain relevant,
    which makes a number of problems hard to solve. For instance, a traditional recurrent
    neural network might not be able to autocomplete a sentence in the way that a
    **long short-term memory (LSTM)** can because it doesn’t understand the time sequence
    involved in the completion of a sentence.


    Today, most DL models require a ton of data, meaning the neural networks that
    power DL need lots of examples to understand whether something is, for example,
    a dog or a horse. If you think about it a bit, though, this doesn’t actually relate
    that closely to how our brains work. A small child that’s just emerging and learning
    about the world might need to be reminded once or twice about the difference between
    a dog and a horse, but you likely aren’t reminding them of that difference thousands
    or millions of times. In that sense, DL is evolving toward requiring fewer and
    fewer examples to learn. Sure, these days, we’re able to gather massive amounts
    of data for DL models to learn from, but the models themselves are evolving to
    improve without needing much data toward the ultimate goal of DL models that can
    be trained with small amounts of data.


    So far, we’ve covered some of the history and influences shaping the field of
    ML and DL more specifically. While we haven’t gone into many of the technical
    concepts too heavily, this gives us a good foundation with which to understand
    how ML and DL have developed over time and why they’ve risen to prominence. In
    the following section, we will get more hands-on and get into understanding DL
    better.


    # The new — exploring DL


    Part of our intention with separating ML and DL conceptually in this book is really
    to create associations in your mind regarding these concepts. For most technical
    folks in the field, there are specific models and algorithms that come up when
    you see ML or DL as a descriptor of a product. Quick reminder here that DL is
    a subset of ML. If you ever get confused by the two terms, just remember that
    DL is a form of ML that’s grown and evolved to form its own ecosystem. Our aim
    is to demystify that ecosystem as much as possible so that you can confidently
    understand the dynamics at play with DL products as a PM.


    The foundational idea of DL is centered around our own biological neural networks,
    and DL uses what’s often the umbrella term of ANNs to solve complex problems.
    As we will see in the next section, much of the ecosystem that’s been formed in
    DL has been inspired by our own brains, where the “original” neural networks are
    found. This inspiration comes not just from the function of the human brain, particularly
    the idea of learning through examples, but also from its structure.'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'Because this isn''t an overly technical book meant for DL engineers, we will
    refrain from going into the terms and mathematics associated with DL. A basic
    understanding of an ANN would be helpful, however. As we go through this section,
    keep in mind that a neural network is composed of artificial neurons or nodes
    and that these nodes are stacked next to one another in layers. Typically, there
    are three types of layers:


    +   - The input layer

    +   - The hidden layer(s)

    +   - The output layer


    While we will go over the various types of ANNs, there are some basics to how
    these DL algorithms work. Think in terms of layers and nodes. Essentially, data
    is passed through each node of each layer and the basic idea is that there are
    weights and biases that are passed from each node and layer. The ANNs work through
    the data they''re training on in order to best arrive at patterns that will help
    them solve the problem at hand. An ANN that has at least three layers (which means
    an input, an output, and a minimum of one hidden layer) is "deep" enough to be
    classed as a DL algorithm.


    That settles the layers, but what about the nodes? One of the simplest models
    (which we will discuss in detail later in this chapter) is the linear regression
    model. You can think of each node as its own mini-linear regression model because
    this is the calculation that''s happening within each node of an ANN. Beyond that,
    each node does more than just a linear regression calculation as it also applies
    a non-linear activation function to the result. This activation function then
    introduces non-linearity into the model, allowing ANNs to capture complex patterns
    and relationships in the data that linear regression cannot. Each node has its
    data, a weight for that data, and a bias or parameter that it''s measuring against
    to arrive at an output. The summation of all these nodes making these calculations
    at scale gives you a sense of how an ANN works. If you can imagine a large scale
    of hundreds of layers, each with many nodes within each layer, you can start to
    imagine why it can be hard to understand why an ANN arrives at certain conclusions.


    DL is often referred to as a black-box technology and this starts to get to the
    heart of why that is. Depending on our math skills, we humans can explain why
    a certain error rate or loss function is present in a simple linear regression
    model. We can conceptualize the ways a model, which is being fitted to a curve,
    can be wrong. We can also appreciate the challenge when presented with real-world
    data, which doesn''t lay out a perfect curve, for a model. But if we increase
    that scale and try to conceptualize potentially billions of nodes, each representing
    a linear regression model, our brains will start to hurt.


    Though DL is often discussed as a bleeding-edge technological advancement, as
    we saw in the prior section, this journey also started long ago.


    # Invisible influences


    It''s important to understand the underlying relationships that have influenced
    ML and DL as well as the history associated with both. This is a foundational
    part of the storytelling but it''s also helpful to better understand how this
    technology relates to the world around us. For many, understanding AI/ML concepts
    can be mystifying, and unless you come from a tech, or computer science background,
    the topics themselves can seem intimidating. Many will, at best, only acquire
    a rudimentary understanding of what this tech is and how it''s come about.'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'We want to empower anyone interested in exploring this underlying tech that
    will shape so many products and internal systems in the future by making a deeper
    understanding more accessible. Already, it may seem like there’s a bias – most
    of the folks who intimately understand ML and DL already come from a computer
    science background, whether it’s through formal education or through boot camps
    and other technical training programs. That means that, for the most part, the
    folks who have had access to this knowledge and pursued study and entrepreneurship
    in this field have traditionally been predominantly white and predominantly male.


    Apart from the demographics, the level of investment in these technologies, from
    an academic perspective, has gone up. Let’s get into some of the numbers. Stanford
    University’s AI index states that AI investment at the graduate level among the
    world’s top universities has increased by 41.7%. That number jumps to 102.9% at
    the undergraduate level. An extra 48% of recipients of AI PhDs have left academia
    in the past decade in pursuit of the private sector’s big bucks. Also, while only
    14.2% of computer science PhDs were AI-related 10 years ago, that number is now
    above 23%. The United States, in particular, is holding onto the talent it educates
    and attracts. Foreign students who come to the United States to pursue an AI PhD
    stay at a rate of 81.8%.


    The picture this paints is one of a world that’s in great need of talent and skill
    in AI/ML. This high demand for the AI/ML skill set, particularly a demographically
    diverse AI skill set, is making it hard for people to stay in academia, since
    the private sector handsomely rewards those who don’t. In the start-up circuits,
    many venture capitalists and investors are able to confidently solidify their
    investments when they know a company has somebody with an AI PhD on staff, whether
    or not their product needs this heavy expertise. Placing a premium on human resources
    with these sought-after skills is likely not going to go away anytime soon.


    Another key thing to remember is the relationship between ML teams and product
    teams. How the models are chosen, built, tuned, and maintained for optimized performance
    is the work of data scientists and ML engineers. Using this knowledge of performance
    toward the optimization of the product experience itself is the work of PMs. If
    you’re working in the field of AI product management, you’re working incredibly
    closely with your data science and ML teams (we’ll learn more about specific roles
    later in the book).


    We’d like to also make a distinction about the folks you’ll be working with as
    an AI PM. Depending on your organization, you’re either working with data scientists
    and developers to deploy ML or you’re working with ML engineers who can both train
    and upkeep the models as well as deploy them into production. We highly suggest
    maintaining strong relationships with any and all of these impacted teams, along
    with DevOps.


    We dream of a world where people from many competencies and backgrounds come into
    the field of AI because diversity is urgently needed and the opportunity that’s
    ahead of us is too great for the gatekeeping that’s been going on to prevail.
    It’s not just important that the builders of AI understand the underlying tech
    and what makes its application of it so powerful. It’s equally important for the
    business stakeholders that harness the capabilities of this tech to also understand
    the options and capabilities that lie before them. At the end of the day, nothing
    is so complicated that it can’t be easily explained.'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# ML versus DL — understanding the difference


    In this section, we will explore the relationship between ML and DL and the way
    in which they bring their own sets of expectations, explanations, and elucidations
    to builders and users alike. Whether you work with products that incorporate ML
    models that have been around since the 50s or use cutting-edge models that have
    sprung into use recently, you''ll want to understand the implications either way.
    Incorporating ML or DL into your product will have different repercussions. Most
    of the time, when you see an AI label on a product, it''s built using ML or DL,
    so we want to make sure you come out of this chapter with a firm understanding
    of how these areas differ and what this difference will tangibly mean for your
    future products.


    As a PM, you''re going to need to build a lot of trust with your technical counterparts
    so that, together, you can build an amazing product that works as well as it can
    technically. We will go over some of the basics here, and will be elaborating
    on these concepts later on. Let''s first take a look at how some of the key concepts
    that we''ll be discussing are interlinked:


    ![](img/a0c9f9a2ba06a06d309ce21d890a47c6_38_0.png)


    Figure 1.2: The subcategories of ML'
