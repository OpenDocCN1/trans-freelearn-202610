- pgno: 301
  md: '# Summary


    In this chapter, we discussed how managing alignment across leadership, stakeholder
    teams, and day-to-day operations is crucial to the success of an AI PM. We learned
    that establishing a clear product vision, strategy, and roadmap that reflects
    the company''s overall goal is necessary because the use of AI technology must
    address user-centric problems through cross-functional team collaboration. Misalignment
    can lead to inefficiencies that are too costly in such sensitive environments.
    AI PMs must also navigate the volatile nature of technology, market demands, diverse
    personalities, and competing priorities to do their work effectively, as we learned
    in this chapter. We further learned that by cultivating a curious mindset and
    an open culture of collaboration and experimentation, AI PMs can hedge their bets
    against the many sources of entropy that can influence their AI product development
    cycle.


    This chapter concludes Part 2 of this book on the AI native product. So far, we''ve
    had a chance to understand the AI-native product from a team, tech stack, productization,
    customization, and positioning perspective. We''ve discussed the many facets of
    what it takes to build products natively with AI and took a deeper dive into benchmarking,
    growth hacking, and storytelling for your AI native product. We''ve also explored
    the most important product design and product management considerations that are
    tailored to the unique challenges that face AI PMs.


    In Part 3, we''ll explore what it looks like to build AI capabilities and features
    into existing traditional software products and meet a new case study example
    that will demonstrate the concepts we discuss in Part 3, much like we did in Part
    2. We''ll start Part 3 with Chapter 12, which will focus on the rising tide of
    AI and how product teams can prepare themselves for the demands of working with
    AI when they''re already established.


    # References


    +   - *Pinterest vision statement:* https://www.pinterestcareers.com/our-life/


