- pgno: 371
  md: '+   - **Explainability:** Define how you will manage expectations with users
    about the new features you''re targeting and what level of explainability you
    want to pass on to customers and end users to enhance transparency, trust, and
    adoption. These will give you the blueprints you need to eventually create onboarding
    tutorials and feature guides.

    +   - **Bias:** Establish ethical guidelines and mechanisms to ensure fairness
    and inclusion during the R&D phase to further enhance trust in AI outcomes and
    outputs.

    +   - **User feedback:** Build processes that allow you to gather feedback from
    real users from beta testers and other select groups of users to make sure you''re
    fine-tuning models appropriately at the level a typical user would expect.


    # Deployment: Are you ready to scale?


    Often, when we talk about scale, it''s about whether a product can technically
    scale up to support a 10x or 100x increase in customer acquisition. Technical
    debt and technological limitations are one thing, but costs are another. Because
    AI can be computationally heavy and data-heavy, some of your earliest considerations
    for your product might be: is it worth the cost of offering this piece of functionality
    to users? Is the feature strategic enough that it''s worth the resources, financial
    investment, and technical debt to support? Remember that technical debt is a form
    of investment that will eventually need to be paid off. Acquiring technical debt
    might allow you to release new features faster in the short term, but if left
    unaddressed, it can accrue interest and cause bigger problems in your AI system
    later.


    Once you''re in the deployment phase of the AI product development lifecycle,
    you''re integrating models and data pipelines into legacy systems, finalizing
    your infrastructure for go-live, working on a rollout strategy for the new AI
    features and capabilities, and setting up mechanisms for the continuous maintenance
    and monitoring of your new AI system. Theoretically, if all goes well, you''re
    supporting the existing volume of users as well as the new users you will acquire
    in response to your AI investment.


    The way you grow and scale as a result of AI adoption could result in new volumes
    of data you weren''t gathering before, which could have implications on the costs
    of maintaining the AI system you''ve built to support new AI features and capabilities.
    Likewise, your thresholds for performance will impact price and scalability as
    well. Perhaps certain accuracy thresholds are just too expensive to justify than
    others. Your data science teams will be coming to you with a range of options.
    Likely, it will be the models themselves they''re comparing performance against,
    but it will also be performance thresholds that need to be understood and discussed
    as well. Going back to the drawing board with regard to scale is relevant here
    because there might be infrastructural decisions that need to be made about how
    you''ll support your code base and data accessibility for AI integration.


    Some of the key questions you can think about when you''re in the deployment phase
    that relate to scalability include:


    +   - Could cloud-based platforms and tools offer you a way to beat the new margins
    AI integration will demand?

    +   - Are there ways you can limit computational demand or use distributed computing
    frameworks to help serve your ability to scale?

    +   - Are there hard limits on the number of customers you''d be able to support?'
