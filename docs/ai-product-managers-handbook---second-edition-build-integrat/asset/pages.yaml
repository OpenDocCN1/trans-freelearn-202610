- pgno: 161
  md: 'UI/UX is all about how to most efficiently deliver value to your end users.
    Minimizing sources of frustration and inspiring moments of delight is the primary
    focus of this function. A good UI/UX designer or researcher will guide the visible
    changes of your product that your end users will experience. This role is a critical
    partner to an AI PM because it can help validate customer pain points or market
    strategy decisions. While the go-to-market and product teams might be making decisions
    based on data, UX research can offer that objective third-party perspective. We
    recommend having this function be an ongoing engagement so that you can learn
    from your users as you build further iterations of your product that align most
    closely with what your users—and, by extension, their buyers—will approve.


    # Customer success specialist


    Having proper channels for listening via UI/UX design and research is important,
    but eventually, your customers will want you to talk back—and not just through
    the product itself. You might not have a huge need for a customer success team
    if you’re creating a B2C product, but if you’re selling an AI/ML product to other
    businesses, you certainly will. The customer success team exists to make sure
    your customers are properly using your product and receiving the intended value
    from it.


    They’re also a great source of feedback for your data and AI/ML functions. A customer
    success specialist offers the feedback loop that an AI/ML product will need to
    build and improve over time. They’re also incredibly helpful at helping to expand
    on product features and collaborating with products on which potential new features
    end users might really love to see. If you’re an AI/ML PM, make sure you have
    a warm and open relationship with the customer success team because they’re your
    biggest source of knowledge on the ground. They’re the ones actually talking to
    your customers!


    # Marketing/sales/go-to-market team


    This is another one that will likely be involved at the beginning and throughout
    your product development journey. We’re lumping in sales and marketing as go-to-market
    (GTM) because this is essentially what this function does. It communicates out
    to your market: the entire landscape of your potential customers. This is where
    you’ll combine your skill sets to optimize your product language fit or the message
    your market will see about your product. You’ll be using your GTM meetings to
    decide on the following:


    +   - Terminology about your product

    +   - How you’re going to position it in the market

    +   - How much of your proprietary tech and algorithmic magic you’re going to
    allow your sales force to discuss with potential customers on demos

    +   - How much explainability you’re going to offer

    +   - How you’re going to communicate about technical decisions you’ve made about
    your product

    +   - How much information about your product you’re going to shield from the
    world in the spirit of competition


    As you build and improve your product, your GTM team will stick with you, and
    you’ll be regularly in the flow of discussing how you’re going to communicate
    about upcoming features or releases.'
