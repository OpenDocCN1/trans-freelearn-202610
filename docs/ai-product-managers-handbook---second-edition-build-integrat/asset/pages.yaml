- pgno: 226
  md: 'We will finish with a product design overview of our case study example as
    we’ve done with the other chapters in this section.


    # Recap of common product design terms


    **Customer journey:** The complete series of interactions a customer has with
    a company or product, from initial awareness to product onboarding, mapping key
    thoughts, emotions, pain points, and touch points until purchase.


    **User journey:** The complete series of interactions a user experiences with
    a product, including discovery, engagement, and ongoing use, mapping key thoughts,
    emotions, pain points, and touch points at each stage of the life cycle.


    **User interface (UI):** The UI encompasses all visual elements and interactive
    features (screens, buttons, icons, menus) of a digital product, focusing on aesthetics,
    layout, and visual elements.


    **User experience (UX):** The UX encompasses the entire user experience, including
    UI, functionality, accessibility, and overall ease of use, satisfaction, and emotional
    responses.


    **UI vs. UX design:** While UI design focuses on the visual representation and
    surface-level interactions of a product, UX design encompasses the entire user
    experience, including look and feel, user research, content structure, and interaction
    flow, to ensure a seamless and satisfying experience.


    **UX research vs. market research:** UX research is product-centric, focusing
    on user behavior, needs, and motivations to improve product interaction. Market
    research is broader in scope, focusing on the market landscape, competitors, trends,
    demographics, and preferences to inform overall business strategy and product
    positioning.


    **Customer journey vs. user journey:** While customer journey encompasses the
    broader pre- and post-purchase experience, including marketing, customer service,
    and brand perception, user journey focuses on the specific functional and task-oriented
    experience of navigating and using a product.


    # Product design elements 101


    In Chapter 6, we covered the stages of AI product development. You’ll likely see
    concepts mirrored here, but it’s important to note that developing a product and
    designing a product are two different things. Certainly, there’s an interplay
    between the two; both are required to bring a product to market. Product development
    refers to the entire process of building a product. Product design focuses on
    the creation of the product’s user experience and form itself. If you refer back
    to Chapter 6, you can think of product design as one of the areas that will be
    covered in Phase 1 (ideation) and Phase 3 (research and development) of the product
    development process. As you iterate on your ideas and reinforce them with research
    and feedback, you’re doing the work of maturing your product design.


    The following is a visual guide to organize your product design elements and refer
    back to. Keep in mind that these stages may change as you’re building, but they
    generally take the following sequence. As you’re navigating the task of bringing
    AI-native products to market, you’ll revisit various stages at various times.'
