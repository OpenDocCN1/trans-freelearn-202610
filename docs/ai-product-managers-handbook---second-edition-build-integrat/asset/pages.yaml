  md: '# Contributors


    # About the author


    Irene Bratsis currently oversees product at Presage, a production company and
    magazine based in NYC, works independently as a consultant, and most recently
    served as Director of Digital Product and Data at the International WELL Building
    Institute (IWBI). She has a bachelor''s degree in economics and international
    relations from Simmons University. Irene has completed a big data and analytics
    certificate from MIT xPRO and an intensive data science program with Thinkful.


    Before IWBI, she worked as an operations analyst at Tesla, a data scientist at
    Gesture, a data product manager at Beekin, and led product at Tenacity. Irene
    has served as the co-lead of the NYC chapter of Women in Data and currently organizes
    and moderates WaiTalks, an online series of talks organized by Women in AI. A
    founding member of Trusted AI, Irene has written articles for well-known outlets
    such as Data Driven Investor, Analytics Vidhya, and Towards Data Science, as well
    as her own Medium and LinkedIn profiles. Irene is currently based in NYC.'
