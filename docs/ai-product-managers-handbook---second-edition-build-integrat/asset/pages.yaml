  md: '# Part 2


    # Building an AI-Native

    Product


    Understanding what it takes to manage an AI program is a prerequisite of AI product
    management. Now that we’ve covered the basics of that in Part 1, we can move on
    to contextualize the output of that AI program when building products natively
    with AI.


    This part consists of six chapters addressing the various relevant areas when
    going to market with a new product built with AI from the very beginning. We will
    cover the basics of creating an AI-native product, productizing the AI/ML service
    that powers it, positioning that product for various groups, AI/ML options you
    can take when building, and how that all relates to performance benchmarking,
    costs, and growth. We’ll understand both the tactical and strategic considerations
    of designing, launching and managing an AI-native product by the end of this part.
    We will contextualize all these concepts with the help of a case study that will
    span all the chapters in this part.


    This part comprises the following chapters:


    +   - Chapter 6, Understanding the AI-Native Product

    +   - Chapter 7, Productizing the ML Service

    +   - Chapter 8, Customization for Verticals, Customers, and Peer Groups

    +   - Chapter 9, Product Design for the AI-Native Product

    +   - Chapter 10, Benchmarking Performance, Growth Hacking, and Cost

    +   - Chapter 11, Managing the AI-Native Product'
