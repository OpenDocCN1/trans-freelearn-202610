- pgno: 411
  md: 'Being able to prove you can navigate complex challenges and innovate using
    ML and data science is your task as a novice AI PM. But demonstrating this is
    not straightforward. In order to build a portfolio as a PM, people have to trust
    you enough to actually be one. That poses a hurdle for those who have their eyes
    set on this career path, but it’s not impossible.


    The following are some options you can use to demonstrate your AI/ML skills:


    +   - Project portfolio

    +   - Competitions

    +   - Open source projects

    +   - Apprenticeships/internships

    +   - Entry-level positions


    Particularly for those looking to jump straight into an AI PM role without first
    working as a data scientist or ML engineer, building a project portfolio of personal
    projects is a great way to demonstrate your knowledge of AI/ML. You can focus
    on projects that are more accessible and relevant in today’s job market by choosing
    projects like specialized chatbots or recommendation systems.


    Beyond that, you can also flex your tech skills by enlisting in Kaggle competitions.
    Kaggle is a well-known and reputable community, so you get bragging rights if
    you can prove that your work was successful enough to win a championship.


    AI for Good projects tend to be open source because their appeal resonates with
    a lot of people at once and many experienced people are often willing to offer
    their time, expertise, and skills for causes they care about. They’re also a noble
    pursuit no matter what level you’re at in your career because we should all be
    using advanced technology for the common good. If you’re early in your ML or product
    management journey, see if there are open source AI for Good projects you can
    get involved with so that you can demonstrate your skills toward a goal that’s
    mutually beneficial for all. It also increases the likelihood that others will
    give you guidance or assistance.


    The program I did as I was upskilling was called Thinkful and I worked under a
    senior data scientist as I was building my portfolio. What that meant was I was
    able to build a portfolio around real work that was coming from the industry.
    The advantage of this was that instead of doing a project with all the public
    data samples everyone was using to build a portfolio, I got to focus on real-world
    case study examples and data samples that came with all the data hygiene issues
    you’re likely to find in production at a real company. It also meant that I got
    to work under someone who was doing the kind of work I’d be doing five years down
    the line.


    Apprentice programs and internships are a great way to get clout as a data scientist,
    ML engineer, or product manager because they’re able to give you organic, realistic
    resources to work with that will emulate what you come across as a real PM. They
    often come with opportunities to work on real problems with the help of a more
    established working professional, which is preferable to the theoretical knowledge
    you’d get from courses or MOOCs alone.'
