- pgno: 177
  md: '# GTM strategy and verticalization


    Waterbear initially opened up to a small group of beta testers early on to better
    understand interest and viability in a product like Akeira after completing the
    prototype. The target market was initially adult women over the age of 18 and
    focused on authentic and organic marketing campaigns that met their users where
    they were: endlessly scrolling online. Because both of Waterbear’s founders were
    women, they were able to build an early network of potential investors and advisors
    through a start-up accelerator with Women in AI.


    The market for a product like Akeira was also a blue ocean market. While there
    were direct competitors like Woebot, Wysa, Moodnotes, and Pacifica out there,
    most of them were simple mood trackers or chatbots that didn’t quite capture the
    complexity that Akeira was able to offer. Other indirect competitors like Talkspace,
    BetterHelp, and Cerebral were only able to get you connected with mental health
    professionals in the space. Because Akeira was a combination of both direct and
    indirect competitors, it was able to amass a loyal following of dedicated users
    using a product-led approach.


    Using conservative estimates of the **total available market (TAM)** of 0.6 billion,
    based on the state of the mental health-focused app market, Waterbear was able
    to discover a shared **serviceable addressable market (SAM)** of mental health
    apps focused on women to be just over $350 million. Because they prioritized slow,
    organic growth with their one flagship product before focusing on scaling, their
    initial **serviceable obtainable market (SOM)** was just over $5 million.


    Finally, although Akeira was initially created to service direct consumers specifically,
    Waterbear’s GTM team discovered that there was a significant population of users
    that could come from businesses that were looking for a conversational AI solution
    they could deliver to their employees to help boost their creativity, happiness,
    and well-being.


    Future explorations of Akeira would branch out into other verticals like various
    age groups, genders, and use cases beyond just well-being. Look out for our Waterbear
    case study through the rest of the chapters in Part 2 as we add more complexity
    to our example.


    # Summary


    The work of a PM is never done. There are always more voices, perspectives, and
    considerations to take in. Coordinating all the stakeholders, technology, leadership,
    market analysis, customer feedback, and passion for a product isn’t an easy task.
    In this chapter, we covered the stages of the AI product development lifecycle
    and the various roles that can make up your AI product dream team. We also covered
    the tech stack that can help that team build a product, and various focus areas
    to help that product stand out and resonate with the cohorts of groups that will
    be buying and using your product. Hopefully, this chapter has helped you understand
    what the most important factors are when you set out to build an AI-native product.'
