- pgno: 29
  md: '# 1


    # Understanding the Infrastructure

    and Tools for Building AI Products


    The frontier of artificial intelligence (AI) products seems a lot like our universe:
    ever-expanding. That rate of expansion is increasing with every passing year as
    we go deeper into a new way to conceptualize the products, organizations, and
    industries we’re all a part of. Laying a solid foundation is an essential part
    of understanding this transformation, which is our goal with this book. Since
    virtually every aspect of our lives is expected to be impacted in some way by
    AI, we hope you will come out of this experience more confident about what AI
    adoption will look like for the products you support or hope to build someday.


    Part 1 of this book will serve as an overview of the lay of the land. We will
    cover terms, infrastructure, types of AI algorithms, and products done well, and
    by the end of this part, you will understand the various considerations when attempting
    to build an AI strategy, whether you’re looking to create a native-AI product
    or add AI features to an existing product. We will be covering theoretical concepts
    in Part 1 and will be using Parts 2 and 3 for more practical content, where we
    will see these theoretical concepts applied more specifically. In Part 4, we will
    discuss how you can build and grow your AI PM career.


    Managing AI products is a highly iterative process, and the work of a product
    manager (PM) is to help your organization discover what the best combination of
    infrastructure, training, and deployment workflow is to maximize success in your
    target market. The performance and success of AI products lie in understanding
    the infrastructure needed for managing AI pipelines, the outputs of which will
    then be integrated into a product. In this chapter, we will cover everything from
    databases to deployment strategies to tools you can use to manage your AI projects,
    as well as how to gauge your product’s efficacy.


    This chapter will serve as a high-level overview of the subsequent chapters in
    Part 1, but it will first and foremost provide a definition of terms, which is
    often quite hard to come by in today’s marketing-heavy AI competitive landscape.
    These days, it feels like every product is an AI product, and marketing departments
    are trigger-happy with sprinkling that term around, rendering it almost useless.
    A big part of why I wanted to write this book is because of my own challenges
    with navigating competitive landscapes in hopes of trying to understand various
    “AI” products.'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'I felt that if I had trouble understanding how products out there were built
    when using AI, given my familiarity with machine learning, what hope could there
    be for others? I suspect this won’t be changing anytime soon, but the more fluency
    consumers and customers alike have with the capabilities and specifics of AI,
    **machine learning (ML)**, **deep learning (DL)**, and data science, the more
    we should see clarity about how products are built and optimized. Understanding
    the context of AI is important for anyone considering building or supporting an
    AI product.


    In this chapter, we will cover the following topics:


    +   - Definitions – what AI is and is not

    +   - The old – exploring ML

    +   - The new – exploring DL

    +   - ML versus DL – understanding the difference

    +   - Learning paradigms in ML

    +   - The order – what is the optimal flow and where does every part of the process
    live?

    +   - DB 101 – databases, warehouses, data lakes, and lakehouses

    +   - Managing projects – IaaS

    +   - Deployment strategies – what do we do with these outputs?

    +   - Succeeding in AI – how well-managed AI companies do infrastructure right

    +   - The promise of AI – where is AI taking us?


    # Definitions — what AI is and is not


    In 1950, a mathematician and World War II war hero named Alan Turing asked a simple
    question in his paper *Computing Machinery and Intelligence*, and that question
    was, *Can machines think?* Today, we’re still grappling with that same question.
    Perhaps more so now that we have accessible, powerful **large language models
    (LLMs)** like ChatGPT and Claude to blur the lines. Depending on who you ask,
    AI can be many things. Many maps exist on the internet to define the broad categories
    of AI, from expert systems used in healthcare and finance to simpler forms of
    ML to more advanced models like neural networks. As we continue with this chapter,
    we will cover many of these facets of AI, particularly those that apply to products
    emerging in the market today. For the purposes of applied AI in products across
    industries, in this book, we will focus primarily on various applications of ML
    and DL models because these are often used in production anywhere AI is referenced
    in any marketing capacity. We will use AI/ML as a blanket term covering a span
    of ML applications, and we will cover the major areas most people would consider
    ML, such as DL, computer vision, natural language processing, and facial recognition.
    These are the methods of applied AI that most people will come across in the industry,
    and familiarity with these applications will serve any PM looking to break into
    AI. If anything, we’d like to help anyone who’s looking to expand into the field
    from another product management background to choose which area of AI appeals
    to them most.'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'First, let’s look at what is and what isn’t ML. The best way for us to express
    it as simply as we can is: if a machine is learning from some past behavior and
    its success rate is improving as a result of this learning, it is ML! Learning
    is the active element. No models are perfect, but we do learn a lot from employing
    models. Most models will have some element of hyperparameter tuning, but all models
    will have parameters that are learned during the training process. The use of
    each model will yield certain results in performance, which data scientists and
    ML engineers will use to benchmark performance and improve upon it.


    If there are fixed, hardcoded rules that don’t change, it’s not ML. AI is a field
    of computer science, and all programmers are effectively doing just that: giving
    computers a set of instructions to fire away on. If your current program doesn’t
    learn from the past in any way and it simply executes on directives it was hardcoded
    with, we can’t call this ML. Rather, you may have heard the terms *rules-based
    engine* or *expert system* thrown around in other programs. They are considered
    forms of AI but they’re not ML because, although they are a form of AI, the rules
    are effectively replicating the work of a person, and the system itself is not
    learning or changing on its own.


    We find ourselves in a tricky time in AI adoption where it can be very difficult
    to find information online about what makes a product AI. Marketing is eager to
    add the AI label to their products but there still isn’t a baseline that explains
    what that means out in the market. This further confuses the term AI for consumers
    and technologists alike. If you’re confused by the terms, particularly when they’re
    applied to products you see promoted online, you’re very much not alone.


    Another area of confusion is the general term that is AI. For most people, the
    concept of AI brings to mind the *Terminator* franchise from the 1980s, the 2013
    film *Her* of an OS gone wrong, and other futurist depictions of inescapable technological
    destruction. While there certainly can be a lot of harm to come from the AI we
    use today, the depictions in the films above represent what’s referred to as *strong
    AI* or *artificial general intelligence* (AGI). AGI is a theorized, potential
    future state of AI where machines can perform high-value economic tasks without
    any human oversight or intervention. We still have ways to go for something as
    advanced as AGI but we’ve got plenty of what’s referred to as *artificial narrow
    intelligence* or narrow AI (ANI).


    ANI is also commonly expressed as *weak AI* and is what’s generally meant when
    you see the term “AI” plastered all over products you find online. ANI is exactly
    what it sounds like: a narrow application of AI. Maybe it’s good at talking to
    you, at predicting some future value, or at organizing things; maybe it’s an expert
    at that, but its expertise won’t bleed into other areas. For instance, GPT-4,
    a model that powers one of the most widely recognized conversational AIs, ChatGPT,
    might have advanced comprehension and conversation skills but it can’t perform
    spinal surgery. If it could, it would stop being ANI. These major areas of AI
    are referred to as “strong” and “weak” in comparison to human intelligence.


    But even that may be a controversial opinion. The Microsoft Research team published
    a paper in April 2023 detailing their exploration into GPT-4 and its proximity
    to AGI, titled *Sparks of artificial general intelligence: Early experiments with
    GPT-4*.'
  merge: -1
