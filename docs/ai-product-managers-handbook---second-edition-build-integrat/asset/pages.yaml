- pgno: 336
  md: '# Summary


    This chapter was all about trends and insights for AI adoption collected from
    some of the most reputable companies that speak about it. We looked at some of
    their insights and projections for the coming years and decades regarding AI adoption.
    Building an AI-native product is, in many ways, more straightforward than transitioning
    a product from traditional software development to an AI product.


    In this chapter, we wanted to set the stage and discuss some of the high-growth
    areas for AI adoption because, for many companies, knowing where to begin is often
    the hardest part. Once you''re in the flow of things, you can better anticipate
    what comes next, but when you''re at the precipice of a major paradigm shift,
    there''s a lot of friction. Going over the growth areas, data, and common use
    cases and setting the stage for AI enablement was an intuitive choice to make
    sure AI PMs out there are aware of what adopting AI can mean for their product.
    It''s a big responsibility and undertaking, and it should be treated as such.


    In the next chapter, we will go into a lot of the applied considerations of transitioning
    a product to adopt AI and tangibly what that means for your product team or organization.


    # References


    +   - *Predictions 2022: Successfully riding the next wave of AI:* https://www.forrester.com/blogs/predictions-for-2022-successfully-riding-the-next-wave-of-ai/

