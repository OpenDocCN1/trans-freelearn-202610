- pgno: 394
  md: 'AI and data literacy go a long way to dispelling fears around AI and job displacement
    because as time goes on, they will encounter more and more products that are AI-powered.
    They will also start to incorporate more AI products into their own workflows
    irrespective of the AI features you''re adding to your product. Because AI transformation
    is something that will impact most products at some point, you never know where
    the idea of a new feature may come from. Helping to bridge the gap with regard
    to AI literacy also allows for literacy in other areas, like the importance of
    data quality.


    The move toward AI transformation and adoption should be communicated as an opportunity
    internally and externally because it is. Externally, it represents an evolution
    of what your product offering can do for your users and market. Internally, it
    represents a chance for internal teams to evolve to meet the new product. This
    will have repercussions that most people can''t see yet, so it''s best to keep
    the focus on the positive. Try to limit the negatives as much as possible. Yes,
    AI transformation is a huge undertaking that will require a significant amount
    of time and energy to implement successfully, culturally, and functionally. But
    the more this can be done with joy and safety, the better the whole organization
    will be for it. The following is a list of best practices and suggestions for
    handling AI transformation best with your most prized resource – the humans that
    build and support your product:


    +   - Build a cultural strategy around AI literacy that starts with an AI town
    hall to get a sense of how internal stakeholders might be threatened by AI and
    what it represents. Topics can include what AI means to the company, how they''re
    planning to work with it, and interest areas for how AI may transform the existing
    products the company develops.

    +   - Then, build a series of AI workshops and trainings around those issues and
    concerns. This is meant to symbolize a cultural shift to embrace AI so these sessions
    should be handled by a variety of leaders. The burden of communicating and evangelizing
    AI should never be left to the AI PM alone.

    +   - Ensure teams have a list of external resources where they can bolster their
    own knowledge beyond that.

    +   - Create a process where stakeholders can communicate interest in broadening
    their skill set or job description to advance toward AI.

    +   - Identify skill gaps to understand which roles on which teams need to have
    AI skills and implement a training program to get them there.

    +   - Educate teams on the impact bias, drift, and fairness have on AI and machine
    learning so that everyone at the company can contribute to an ethical AI product.

    +   - Educate teams on AI system security and potential forms of adversarial attacks
    on AI models.


    The people management side of the PM may not be a fixed line. Many PMs serve as
    individual contributors in an organization. However, culturally, you will serve
    as the nexus of AI and how it will impact the product; so, whether you want the
    role or not, you will be the AI guide for many people in your organization. Partly,
    this is because much of the communication around what''s going on will fall on
    you. But perhaps more importantly: the more people you have around you who are
    educated about what AI transformation is and what it will mean for their work,
    the better off you''ll be. It will ensure you''re keeping the right perspectives
    close and it will be easier to manage the highs and lows of executing your AI-driven
    roadmap downstream.'
