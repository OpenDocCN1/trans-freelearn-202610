- pgno: 417
  md: 'If you do find yourself feeling jealous, you can channel that into something
    more positive by drawing inspiration from the subject of your jealousy instead.
    You can ask them for an informational interview to understand how they got to
    where they are and maybe for some guidance. If they’re not open to that, you can
    learn from their career trajectory on LinkedIn and ask your community for guidance
    instead.


    Either way, your network is priceless. If you build it, they will come when you
    need them. Leverage LinkedIn and Slack groups for specialized areas of focus.
    If you do take the path of MOOCs, most of them will have a professional networking
    group you can join after you achieve your certification. Bootcamps and apprenticeship
    programs will do this as well. Invest in virtual communities but leverage in-person
    events and communities where you can. We may be in the age of AI but interpersonal
    relationships still reign supreme. If your professional area is too niche for
    there to be a group (an unbelievable predicament), start one.


    Here is a list of some communities you can think about joining as you’re navigating
    beginning a career as an AI PM:


    +   - **Data Science Society**: A global community offering data science events,
    challenges, educational resources, and a network of data scientists and ML professionals

    +   - **Mind the Product**: While this is a broader PM community, they often host
    events, articles, and forums on AI product management

    +   - **AI4ALL**: A nonprofit focused on expanding access to AI education and
    programs for those interested in AI ethics and product applications

    +   - **DeepLearning.AI**: Led by Andrew Ng, this community provides courses and
    forums where users can engage with others interested in AI

    +   - **Women in Machine Learning & Data Science (WiMLDS)**: A community focused
    on diversity in AI and data science careers with chapters worldwide

    +   - **AIPM**: An online community specialized for AI PMs focusing discussions
    around AI use cases, product-market fit, ethical considerations, and user-centered
    design for AI applications and features

    +   - **Women in Data**: An online community for women in data careers that focuses
    on skills gap training, networking, mentoring, and chapter-based talks and activities
    in local areas

    +   - **Women in AI**: A hands-on AI community with a range of initiatives and
    programs devoted to AI applications created by women


    # Choosing your AI PM specialization


    There are a number of paths that are available to you as an AI PM. Often, the
    main problem is just choosing one. Review Part 1 of this book when you’re deciding
    on this to better understand which areas of AI resonate with you most. This is
    a great starting point for many AI PMs because the area of AI you choose to predominantly
    focus on will be the area of AI you will invest in first. The following are a
    few questions to get you thinking in the right direction as you’re starting to
    build a career as an AI PM:


    +   - Are you most excited by supervised or unsupervised learning models?

    +   - Do you have a preference for deep learning or traditional ML?'
