- pgno: 438
  md: '# Common challenges and opportunities as you’re leveling up in your career


    Having a clear plan of what you want out of your AI PM career and where you want
    to go is important for anyone looking to build a long, sustained career. You will
    be inspired to go in different directions as you continue down the AI PM path,
    but having a clear path (or roadmap if you will) for your career direction will
    help you harness opportunities and prepare for challenges you''ll face as you
    grow your career. As we''ve discussed in previous chapters of this book, the following
    are some challenges and opportunities you may face as you scale your career so
    that you can best anticipate them as you grow your AI PM career:


    +   - **Tech landscape:** One of the greatest hurdles with the AI PM career path
    is staying up to date on the fast pace of advancements in AI technologies. It’s
    demanding and many people face imposter syndrome over it because they might have
    some familiarity only with certain methodologies or models. Then, because they’re
    an “AI PM,” they may feel that they need to be aware of all areas of AI to embrace
    the title with confidence. But this isn’t the case. Yes, you’ll want to stay up
    to date with what’s going on as much as you can, but you’re also working within
    one area of AI, and mastering that will likely be enough for your product and
    company. It’s often hard for people to balance the need for deep technical knowledge
    with a general awareness of other AI models and capabilities. It can be solved
    by knowing what area of AI you want to specialize in and going deeper with that.

    +   - **Alignment:** Maintaining alignment with stakeholders is hard without knowing
    what each group’s intentions for the product and level of AI awareness are. This
    poses a hurdle for a lot of AI PMs because it’s what most contributes to breakdowns
    in communication. Build trust with these teams first so that you can understand
    what their goals are and what their understanding of the product’s value is. Once
    you have that, you can use that feedback to inform the roadmap you’ll present
    to the company. If you take every step of this as a standalone step, it will prevent
    miscommunications later. You can’t set realistic expectations with others without
    first assessing their baseline expectations. Because you’re an AI PM, you’re assessing
    their understanding and expectations of both the product you support as well as
    what AI can do. Both need to be addressed and clarified.

    +   - **Market:** The AI landscape is competitive and will continue to be so as
    more and more players enter the AI game. This is also true of PMs coming into
    the space with increasingly more familiarity with AI. You don’t exist in a void
    – you have people around you who should be incentivized to help you. Try to combat
    the pressure from the market by digesting the findings you get from your research
    and then build strategy sessions and workshops around them. Your work as an AI
    PM is to bring all the relevant voices into the room and to receive guidance from
    your leadership team. They’re the ones who took on the responsibility and investment
    to build a company and play in the market. Let them lead you.'
  merge: -1
  img_proc: true
- pgno: 439
  md: '+   - **Resources:** We’ve covered the costs of maintaining an AI system earlier
    in this book and often, as an AI PM, you’ll make certain calls based on budget
    or time constraints. Setting out to achieve unrealistic, ambitious AI product
    goals is a good way to evaporate your credibility as an AI PM. Just as you build
    trust and gather AI awareness with the stakeholders above, you very much set out
    to do the same with your data science, machine learning, and development teams.
    Try to establish a baseline of awareness of technical teams’ capacity early on
    to understand what velocity they have. Avoid making any commitments until you’ve
    gotten to know what your technical teams are capable of.

    +   - **Ethics:** Many AI PMs may feel that assessing their products for bias,
    drift, and fairness fall on data science teams to flag up but that’s irresponsible.
    Yes, your data science and machine learning teams should feel safe to voice concerns
    they have around training data bias or issues with model performance across a
    variety of user demographics. But you can’t leave that up to them. You’re supposed
    to be the expert on your product and if you don’t set up a plan for catching potential
    issues that relate to bias and ethics proactively, it could get lost in the cracks.
    Also, transparency is becoming increasingly important to customers and users.
    Without running a full assessment of how your product’s performance changes based
    on a variety of factors, you won’t be able to give a transparent account of what
    makes your product effective.


    We’ve covered a lot of areas where AI PMs can expand as they’re maturing in their
    careers over time. For those starting out, it can seem overwhelming to have to
    think about so many considerations for one job. And it is! We won’t all be excellent
    at every aspect of our role all the time. Depending on the company you work for
    or the expectations for that particular product role, certain aspects that we’ve
    covered so far will be stressed and appreciated more than others. As you mature
    as an AI PM, you’ll build strategies that will help you find the right mix of
    company, role expectations, and personal preference that will make you shine the
    brightest. Growing our careers sustainably, as joyfully and gracefully as we can,
    is the most important job of all. In the next section, we will discuss the biggest
    contributor to sustainable career growth: self-care.


    # The importance of self-care


    Having a support system of self-care is crucial when dealing with the wear and
    tear of a career in AI PM (and any PM role really). As we’ve seen with the first
    two sections of this chapter, there are many hats to wear in this line of work
    and a long list of recommended actions to take to meet the needs of these various
    roles. Without the proper infrastructure to maintain capacity, productivity, and
    inspiration, people can burn out very quickly because it’s often a role with high
    visibility, expectations, and stress.


    This is largely because the investment in an AI PM is high. A lot is at stake
    for the business and they need to find someone that’s truly up to the task. Remember
    that as an AI PM, you’re responsible for the organization’s ingestion and understanding
    of AI, the AI program itself, the product strategy and vision, the execution of
    that strategy, and, of course, user adoption and satisfaction. These would be
    demanding projects even if one person was in charge of each, let alone one person
    being responsible for all.'
  merge: -1
  img_proc: true
- pgno: 440
  md: 'Taking measures to not only keep your focus and energy levels but also to maintain
    your emotional engagement will keep you replenished. Often, it''s not the actual
    demands of the job but the emotional resistance that makes us more tired. Combat
    this by taking on roles where you work closely with direct managers, direct reports,
    and leadership teams that are supportive and inspiring when you can. I realize
    this isn''t always possible, but how well you work with others will have a direct
    impact on your success as an AI PM. The more emotionally supported you are, the
    more mentally clear and capable you will be.


    Working with people who disempower or undermine you will have you working against
    a strong current of resistance. Priding yourself on logic and reason will only
    take you so far. Eventually, the demands of the job will outweigh your unemotional
    veneer and you''ll find yourself struggling to find the motivation to keep your
    job. Do yourself a favor early and build supportive teams around you to help you
    maintain a strong emotional sense of belonging and purpose. Our commitments are
    emboldened when our minds and hearts are in it for the right reasons.


    Maintaining strong mental and physical health is important for all people, but
    for the AI PM role it should be looked at as a prerequisite. The role of an AI
    PM is high pressure and demanding, so make sure you''re able to manage stress
    effectively to prevent burnout. There''s an established connection between mental
    health and physical health. You won''t be doing yourself or your product organization
    any favors by sitting behind a screen all day, going from meeting to meeting back
    to back, and never seeing the sun. You can stay ahead of your health by focusing
    on the following:


    +   - Incorporate regular exercise like walking, yoga, or going to a gym/workout
    class to relieve stress and stay fit.

    +   - Balance your emotions and your focus by eating a balanced diet regularly
    throughout the day.

    +   - Get enough sleep! Don''t work late. Don''t work early. If you''re managing
    your schedule properly, a 40-hour workweek is enough to do your job effectively.

    +   - Meditate! Create distance around your to-do list and revisit it from a bird''s-eye
    view every day.

    +   - Take mental breaks throughout the day. See the sun. Don''t schedule back-to-back
    meetings.

    +   - Build strong emotional ties around you. See your friends, family, or therapist
    regularly so that you have a way to blow off steam. No career is worth the dis-ease
    that comes from isolation and overwork.

    +   - Maintain hobbies, personal projects, and third-space involvements. We are
    not just our jobs; we''re so much more than that.

    +   - Prioritize your work so that you''re focusing on what''s most important
    or time sensitive first.

    +   - Delegate what you can.

    +   - Don''t work when you''re on vacation.

    +   - Define your working hours and stick to them.

    +   - Make professional connections virtually or in person.

    +   - Find an AI PM mentor, someone you trust that you feel has your best interests
    at heart.'
  merge: -1
  img_proc: true
