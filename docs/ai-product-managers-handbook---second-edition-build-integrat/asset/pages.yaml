- pgno: 284
  md: 'We don’t build a clear vision for our products because we read an opinion piece
    somewhere on LinkedIn and think it sounds nice. We do it so that we operate from
    a position of strength. Executing is not easy. You have to build a plan based
    on a solid strategy because hiccups come up all the time when you’re executing.
    Building a foundation from a strong vision is a way to prevent those hiccups from
    throwing you off course so that your work is measurable, ethical, and aligned
    with both the company’s goals as and market demands.


    # Communication


    Reading the previous section might resonate deeply with some. To others, it will
    sound like abstraction and nonsense. But it’s not. AI PMs need to be able to navigate
    the nebulous gray space of knowns and unknowns, especially in the rapidly evolving
    field of AI/ML. They have to build their strategy and intuition muscles around
    AI’s potential and limitations, and constantly communicate these concepts to their
    community of stakeholders, teams, and end users.


    There’s a reason why AI PMs exist. The skill set you need to build machine learning
    models and craft solutions to AI-specific problems is different from the skill
    set you need to manage a product from vision to deployment. An AI PM’s role is
    to translate the complex world of AI into a product roadmap; it’s to balance technical
    possibilities with business goals and user needs. At its core, the work of an
    AI PM involves a lot of communicating. Whether it’s explaining AI capabilities
    and benefits to non-technical stakeholders, aligning engineers with user-centered
    outcomes, or ensuring AI products are built ethically and responsibly, your work
    touches virtually every facet of your company. People have short attention spans.
    They have their own work to focus on! That means you’re going to consistently
    reinforce ideas and concepts, continuously communicate the vision you’ve defined,
    and regularly give updates to all stakeholders. Communicating doesn’t just mean
    talking in meetings with stakeholders, though there’s a lot of that too.


    You communicate through many channels: product documentation, blog posts, thought
    pieces, white papers, user stories, and changelogs. Your calendar is a way to
    communicate your priorities. You communicate regularly with end users and customers,
    directly or indirectly. You communicate regularly with your leadership team to
    make sure any threats or risks to the AI product strategy and vision are discussed.
    Your product marketing efforts communicate the value and viability of your product
    to your potential customers. The roadmap you settle on communicates which features
    and capabilities are making it into the product and which aren’t. Those decisions
    communicate the strategy and vision of your AI product.


    Communication is key! As an AI PM, you’ll need to make sure you’re aware of how
    your thoughts, ideas, words, and actions are serving your product communications.
    It’s also a way to build trust with all the relevant stakeholders you’ll regularly
    be communicating with.'
