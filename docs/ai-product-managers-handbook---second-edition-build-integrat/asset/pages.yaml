- pgno: 315
  md: 'Even the way we see roles defined now will begin to change. At this point in
    time, you might find roles such as AI PM or ML PM, which articulate the focus
    on an AI or ML product. Over time, my prediction is that this qualifier will start
    to go away as all PM roles mature with AI adoption. As you’ve seen time and again
    throughout this book, as with the idea that all companies will become AI companies
    by the end of the decade, the same will hold true for PMs. It will likely be that
    within 10 years, you’ll have to have some comfort and familiarity with AI in order
    to be a PM at all.


    The last subject I wanted to touch on in this section is the cost associated with
    having an AI program in place for you to research, develop, test, and manage your
    AI activities. As an AI PM, you’re not necessarily keeping up with the costs and
    decisions of how to handle this function in your company, but you’ll need to be
    familiar with the costs that go into your product. If you’re actively working
    on developing AI features, this will be one area you’re keeping track of as you
    build products. Part of your work as a PM is comparing the costs of certain feature
    developments with the potential gains from investing in those features. The metrics
    you choose to demonstrate the value and **return on investment (ROI)** from the
    features you’re investing in will make your business case.


    Remember that it’s still relatively early in the AI game. Outside of the top tech
    companies, AI adoption is modest. This means that in this phase, and at least
    for the next few years, the companies that are coming out with AI features for
    their products are still ahead of the curve, which means it’s arguably the best
    time for AI feature releases. Coming to market with AI features for your product
    means you’re able to strive for more market share faster, before your competitors
    get the same idea and send out the same marketing message: “We’re the only AI-powered
    X” will only last so long. Across many industries, AI features themselves are
    the marketing differentiator. Maintaining alignment and controlling our part in
    the areas covered above will allow us to come to market confidently. Beyond the
    marketing, AI features, if implemented properly, should give you a more robust,
    smarter product. Actual product functionality and results will broaden your product’s
    reputation and lead to organic growth. If you’re leveraging AI features in a way
    that helps your product save your customers money, save them time, or make them
    money faster, then it should be learning from what works. The inherent promise
    of AI/ML lies in the following equation: data plus models equals more data and
    better models. Your performance will improve if your data is clean and if your
    models are updated regularly. Getting more and more familiar with this process
    will fine-tune your intuition when it comes to your product’s functionality and
    performance in the market you’re in. As you begin to see progress in the scale
    and insights your AI features are adding to your product, you’ll begin to anticipate
    potential issues that can arise with an AI product. This is where some healthy
    fear is appropriate in your AI PM role.


    # Anticipating potential risks


    Part of the specialization that takes place in the current form of an AI PM is
    knowledge of what can go wrong. Your AI features may be taking certain liberties
    with your customers’ data, and it’s your job as a PM to anticipate the potential
    risks your product might create for your users. As a PM, you’re looking to address
    the most important business problems your users have with your product, but you’re
    also looking to minimize potential adverse effects.'
