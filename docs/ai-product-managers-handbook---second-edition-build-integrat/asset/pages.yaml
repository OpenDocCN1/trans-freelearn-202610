- pgno: 306
  md: 'In this chapter, we will cover the following topics:


    +   - Evolve or die – when change is the only constant

    +   - Structural changes in the Fourth Industrial Revolution

    +   - Fear is not the answer – there is more to gain than lose (or spend)

    +   - Anticipating potential risks

    +   - How LLMs are evolving


    We will contextualize this with the help of a case study at the end of the chapter.


    # Evolve or die — when change is the only constant


    I like referring to the evolution that AI will require of all industries as a
    competitive imperative because the language we use to describe this paradigm shift
    will need to be more urgent if it’s going to adequately prepare people for what’s
    to come. Each industry is a universe in and of itself, and once companies within
    industries start to see success with AI adoption, this adoption will accelerate.
    I’ve mentioned before that product management is an inherently commercial role
    because, as a PM or leader, you are tasked with the commercial success of your
    product. The competitive edge and marketing splash that can come from promoting
    an AI product are undeniable.


    But beyond marketing, AI allows all industries to advance in more tangible ways.
    All economic and social areas will change with AI, from healthcare to tech, to
    education and government. The way industries relate to raw materials and plan,
    predict, and build products will change with this transition to AI adoption. The
    World Economic Forum (WEF) defines the industrial revolution we’re currently in
    as “characterized by a fusion of technologies that is blurring the lines between
    the physical, digital, and biological spheres.” I love this description because
    it places AI and ML firmly in the middle of these spheres. In order to account
    for the physical, we need a way to translate the physical world into data. This
    data could be about anything in the world beyond us, or it could be about ourselves.
    The collection and processing of this data will inevitably interact with AI and
    ML to some degree in order to be actionable in some way, and once this ball gets
    rolling, we humans, in our infinite creativity and inspiration, will come up with
    new combinations and expressions beyond the use cases we see today.


    The way our lives are changing in seen and unseen ways affects many technological
    areas, not just AI. We’re currently seeing massive breakthroughs in these areas,
    and the WEF goes on to say, “the possibilities of billions of people connected
    by mobile devices, with unprecedented processing power, storage capacity, and
    access to knowledge, are unlimited. And these possibilities will be multiplied
    by emerging technology breakthroughs in fields such as artificial intelligence,
    robotics, the Internet of Things, autonomous vehicles, 3D printing, nanotechnology,
    biotechnology, materials science, energy storage, and quantum computing.” This
    is at the heart of what makes this such a privilege to witness in our time. There’s
    effectively a technological renaissance happening, and we’re slowly witnessing
    this renaissance unfold in real time every time we read the news, download a white
    paper, or find a study. I’m constantly reminding myself how exciting the current
    technological advancements are considering that 15 years ago, I didn’t have a
    smartphone.'
  merge: -1
  img_proc: true
- pgno: 307
  md: 'Even beyond the areas where we’re experiencing breakthroughs, casualties or
    negative externalities, such as job losses, accompany all this progress. The automation
    of work will replace tasks and jobs that are routine, and almost all jobs have
    some routine to them. This is inevitable. It’s also why some fear the age of AI
    because they’re worried AI will replace their jobs. After all, if a company can
    get things done with automation, by buying a product, or by using some form of
    AI to replace a human worker, then why wouldn’t it? There are people who work
    in operations, procurement, or finance whose entire job is to look for ways to
    save their companies money, and even those people could find their own jobs automated!
    Eventually, the shift will come, and in the meantime, we’ll be reading about it
    one headline at a time.


    But what’s more likely is that AI will be used to assist just about all workers
    with their jobs in some capacity. I don’t mean to minimize the collective loss
    that will arise with AI. There are jobs in data entry and manufacturing that will
    never come back, and you could argue they shouldn’t. But AI could make all these
    debates a moot point by automating the very jobs we’re looking to boost with a
    higher minimum wage. We’ve heard arguments that AI will replace jobs that are
    unenjoyable, mind-numbing, and oppressive. We’ve also heard arguments that AI
    will allow humans to capitalize on their curiosity and make even more money working
    jobs that place a premium on their creative, complex problem-solving, and critical-thinking
    skills. This assumes most people want that and don’t want an easy job they can
    do day in and day out and live a peaceful life free of complex thoughts. Those
    who are in the know and can anticipate the way their jobs will change because
    of AI can better prepare for it, and they’ll probably make more money because
    they’re embracing this change. Others may find their jobs being automated out
    of existence. This is all but guaranteed.


    Beyond all the doom and gloom, there’s an upside. Many of the jobs people will
    be doing in the future are not yet known. According to a report by Dell and the
    Institute for the Future (IFTF), 85% of jobs that will exist by 2030 don’t exist
    yet. That’s incredible. What’s perhaps most incredible is that this is all being
    discovered by all of us as time goes on. Just 15 years ago, we’d be confused if
    someone told us they were a social media manager. Even throughout my own career,
    I have seen what was previously called an account manager role shift and morph
    into a more sales-focused account executive role or a more performance-focused
    role such as customer success manager. The terms data analyst and data scientist
    also entered the zeitgeist not long ago. The function of both these roles has
    existed for some time, but the formalization of those roles and what they mean
    at a certain point in time is a new development. In the near future, we might
    be hearing about tele-surgeons, data brokers, drone managers, and VR technicians
    more often than we do now.


    The evolution that AI adoption will require of us will have positive and negative
    effects, as with any technological adoption. Can we say we’re all the better for
    it now that we have electricity running through the walls of our schools, offices,
    hospitals, and homes? How can we quantify the social and economic net benefit
    of such a massive change to how we live and work? How could the contributors of
    electricity have known that, eventually, their breakthroughs would power the internet
    and AI? If you could time travel back and tell them, they wouldn’t even understand
    the gravity of what you were explaining to them in the first place. It’s important
    to keep an eye on the risks.'
  merge: -1
  img_proc: true
- pgno: 308
  md: 'We''d love to see governments and companies working together to embrace this
    technological shift and to see major sectors of industry recognize a need for
    skilled workers that can help them build the next generation of their products
    and nurture this wave of workers with paid internships, training programs, and
    leadership programs that will bring more workers into fulfilling careers with
    a future. I do a lot of speaking engagements addressing upskilling and career
    transitioning, and I repeatedly remind my audience that their interest, dedication,
    and commitment to upskilling are immensely helpful to society at large. Data analysts,
    data scientists, and ML engineers are highly sought after, and there''s a huge
    skill gap. There are not enough skilled, trained, and experienced workers in these
    fields for the demand that''s coming from companies. If you take on this learning
    journey, you will eventually find success, and you''ll be rewarded with a lifelong
    career that will keep your interest. We can only hope that our larger institutions
    will see the upside in helping individuals with the burden of upskilling and invest
    in making that a smoother transition because it truly is a social and economic
    investment that''s in everyone''s best interest to be sponsored.


    # Changes in the Fourth Industrial Revolution


    As a company and leadership begin the process of opening up to the capabilities
    and promise of AI, it''s important to understand the full spectrum of opportunities
    AI can potentially offer. It''s important for your company and leadership team
    to fully understand the scope and competitive advantage AI adoption will mean
    for your business. Product functionality is not the only area AI helps with.


    Your strategy will also define how you approach AI program development. In the
    following sections, we will briefly explore the expected changes in terms of both
    culture and structure, followed by a discussion of the major areas of investment
    with regard to AI strategy, so you can choose the best course of action for your
    business. My recommended best practice would be to use these cumulatively. If
    you start with a consultant and escalate from there, you''ll be setting your business
    up for success with regard to AI adoption and strategy.


    # Cultural and structural changes


    Because AI is so data-hungry and progress is derived from performance benchmarking,
    you first and foremost have to have a healthy *data-driven culture* throughout
    the organization. You can''t really see how AI will help you if you don''t have
    a consistent baseline. Having metrics and KPIs in place to track your performance
    before you implement AI projects and AI features in your product is crucial for
    measuring and communicating success. Building this culture must come from the
    top down and I invite all leaders reading this to invest in building that culture
    to best see successes from AI adoption.


    The second cultural influence I want to stress in this section is to have a *willing,
    open, and curious culture* around AI. According to Harvard Business Review, 80%
    of AI projects fail, a number that''s almost double the rate of IT projects ten
    years ago. A big part of this is organizations not being appropriately set up
    for success regarding AI adoption. Inundating your data science, ML, and product
    teams with pressure and stress is not the way to set them up for success. The
    ability to iterate, experiment, and take some risks with regard to AI so that
    your teams feel safe to try various use cases is crucial to giving AI the best
    chance it has within your organization.'
