- pgno: 130
  md: '# Limitations and uneven adoption


    There are still limitations to the use of AI/ML. These include incomplete, inconsistent,
    unreliable, and outdated data; model transparency is often a regulatory issue;
    bias and fairness issues stemming from the model''s training data; ethical concerns;
    and the model overfitting to historical data in a way that doesn''t generalize
    well for the present data. Modeling is currently being used in a capacity that
    still requires significant input from human staff.


    In 2023, the U.S. Securities and Exchange Commission (SEC) proposed a series of
    AI rules and investigations into the development and use of AI models. While the
    SEC themselves are using AI to analyze complex data and assess market risk and
    potential fraud, they only use AI to help prioritize examinations for the Division
    of Economic and Risk Analysis (DERA); for more details on this, you can refer
    to https://perkinscoie.com/insights/blog/artificial-intelligence-sec-proposals-and-concerns.
    Despite these trends, and with the rise of more and more competitive LLMs crowding
    the market, we are still seeing AI stall when it comes to adoption in finance,
    with two notable exceptions:


    +   - Asset management

    +   - Mutual funds


    These areas are the exceptions because the adoption of AI in fintech has been
    uneven, with these areas being favored. Asset management and mutual funds use
    quantitative strategies and are highly data-driven areas that are able to benefit
    from AI''s ability to process and model complex financial data. Other areas of
    finance can face regulatory, security, and data privacy issues. Based on a recent
    Harvard Business Review article, the major disruptions that have come from a “dominance
    of technology and data” in this space have most favored the rise of “passive”
    fund managers rather than the historical trend of “active” fund managers. What
    this means is, over time, the influence of data and AI has led to managers trusting
    the growth and prosperity of indices rather than managers that charge hefty fees
    for “stock picking” based on “informational edges.” This means that at a macro
    level, the gains that come from more data being analyzed at scale are surpassing
    those that come from more in-depth, micro-level analysis, as has traditionally
    been the case.


    From financial transactions to the exchange of stocks, to boosting customer retention
    through personalization, to the regulation of financial activities and risk management,
    we’ve seen a few examples in this part of how AI is impacting the industry as
    a whole. With the rise of more accessible generative AI apps and pilots, we’re
    going to see AI increasingly playing a vital role in compliance, customer experience,
    fraud detection, risk assessment, and financial analysis as they relate to financial
    sector activities.


    # Product perspective


    We’d like to end with a more philosophical view of what AI adoption means for
    the very concept of value, worth, and money from a product perspective. If you
    work in fintech and you support financial products, you’re likely concerned with
    not only the value this will deliver to your customers but also keeping an eye
    out for risks to the commercialization of your product. The financial examples
    in this section remind us of the importance of ideating use cases and products
    in a way that delivers value first and foremost.'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'Whether you work in Web3 and blockchain tech, traditional banks, or in the
    regulation of financial products, you’re looking to harness AI/ML in a capacity
    where your product is helping someone improve some outcome. Help comes in all
    shapes and sizes. As you’re in the throes of ideation and looking to offer something
    the market needs, consider products that are helping someone to arrive at conclusions
    in a faster, easier, or otherwise more efficient way. Maybe it’s making your customers
    more profitable or minimizing their costs. Maybe it’s helping your customers predict
    future uncertainty. Maybe it’s offering them a way to expand their generational
    wealth and gain financial independence. Maybe your offering is using AI/ML to
    best understand your customers through personalization. There is immense value
    in this too.


    If you’re thinking about how to best leverage AI/ML for your fintech products,
    think in terms of how you can best deliver revenue and value to your end users
    and your business. Here are some approaches you can adopt:


    +   What degree of personalization can you offer your customers to build loyalty?
    Whether it’s AI-powered advisors that offer investment or portfolio advice, tailored
    banking products and services, personalized loan offers, savings plans, and credit
    card recommendations, there’s likely some way you can communicate value to customers
    in an otherwise dense and overwhelming market.


    +   How can you create a better customer experience that instills more trust from
    your customers? Customers can benefit greatly from agents and chatbots that handle
    customer queries, offer support, automate tasks, enhance customer service, proactively
    recommend solutions, offer market analysis, send targeted marketing campaigns,
    offer personalized rewards, loyalty programs, and predictive analytics, or analyze
    their behaviors and transaction patterns.


    +   Where can you make operational efficiencies for your business and others?
    Automating back-office operations, compliance checks, document processing, transaction
    reconciliation, data management, reporting, risk assessment, transaction monitoring,
    fraud prevention, and anomaly detection are all available options for AI integration.


    Let’s look at a different domain now, healthcare.


    # Sickness and health — the benefits of AI and nanotech across healthcare


    AI continues to be incredibly successful when applied to the medical and healthcare
    industry in capacities like revolutionizing diagnostics, personalized treatment
    plans, and operational use cases. AI tools are being used to analyze medical imaging
    for X-rays, MRIs, and CAT scans at levels that surpass human productivity and
    accuracy. AI use cases for things like detecting tumors, bone fractures, and heart
    conditions have been successful because they’re able to identify anomalies early,
    helping already short-staffed and stretched-thin medical systems in many countries.


    We’re also seeing personalization going far with AI. Tailoring treatment plans
    to genetic, environmental, and lifestyle factors for individuals has been successful
    because of AI’s ability to analyze large datasets like genomic sequences. AI applications
    focused on oncology and cancer research are helping reduce the one-size-fits-all
    approach to cancer treatment options by optimizing treatment paths for individuals.
    Even the path to drug discovery and development is shortened by the use of AI
    applications that are focused on analyzing biological data to predict how new
    compounds will interact with the human body.'
