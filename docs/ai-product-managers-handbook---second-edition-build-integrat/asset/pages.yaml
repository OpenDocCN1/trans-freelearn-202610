- pgno: 96
  md: 'In contrast to the preceding CNN example, which works with a feedforward function,
    RNNs work in loops. Rather than the motion going from the input layer through
    the hidden layers and, ultimately, to the output layer, the RNN cycles through
    a loop back and forth, and that''s how it retains its short-term memory. This
    means the data passes through the input layer, then loops through the hidden layers,
    before it ultimately passes to the output layer. It''s important to note that
    RNNs only have short-term memory, which is why there was a need for an LSTM network.
    More on that in the next section.


    In essence, the RNN actually has two inputs:


    +   *   The first is the initial data that makes its way through the neural network.

    +   *   The second is actually the information and context it''s acquired along
    the way.


    This workflow is the framework with which it also effectively alters its own weights
    to current and previous inputs, so it''s course-correcting as it goes through
    its loops. This process of retroactively adjusting weights to minimize its error
    rate is known as backpropagation, which you''ll recall from *Chapter 1 (A brief
    history of DL)* as this was a major advancement that has helped DL become so successful.


    It''s helpful to imagine that an RNN is actually a collection of neural networks
    that are continuously retrained and optimized for accuracy through backpropagation,
    which is why it''s also considered a supervised learning algorithm. Because it''s
    such a robust and powerful DL algorithm, we can see RNNs used for anything from
    captioning and understanding images to predicting time-series problems to natural
    language processing and machine translation.


    RNNs do well with sequential data and place a premium on the context in order
    to excel at working with time-series data, DNA and genomics data, speech recognition,
    and speech-to-text functions.


    # ## Long short-term memory networks


    Long short-term memory (LSTM) networks are basically RNNs with more memory power.
    Often, the way they manifest is through networks of the LSTM because what they
    do is connect layers of RNNs, which is what allows them to retain inputs over
    lags or longer periods of time. Much like a computer, LSTMs can write, read, or
    delete data from the memory they possess. Because of this, they have the ability
    to learn about what data they need to hold onto over time. Just as RNNs continuously
    adjust their weights and optimize for performance, LSTMs do the same thing by
    assigning levels of importance for what data to store or delete through their
    own weights.


    LSTMs mirror our own ability to discard irrelevant or trivial information through
    time through LSTM cells, which have the ability to let the information come in
    as an input, be forgotten or excluded completely, or let it pass to influence
    the output. These categorizations are referred to as gates and they''re what allow
    LSTMs to learn through backpropagation.'
  merge: -1
  img_proc: true
