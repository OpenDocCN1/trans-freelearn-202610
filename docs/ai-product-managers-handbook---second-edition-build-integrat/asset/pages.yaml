- pgno: 111
  md: '# 4


    # Commercializing AI Products


    Now that we''re in the period of **artificial intelligence** (AI) integration,
    we''re seeing many use cases of AI proliferating across industries. In our work
    managing AI products, we''ve certainly relied on AI consultants and PhD-level
    advisors to help us with modeling and orchestrating our data strategy to support
    a full-scale AI operation. However, as the rising tidal wave of AI continues to
    penetrate various companies and use cases, we''re seeing less of a reliance on
    breakthroughs achieved through advanced models. What''s most important now is
    familiarity with the use of even simple, reliable models. There''s a time and
    place for specialization. Data science and AI are massive umbrella terms but,
    based on my experiences as a product manager, I see a real need for data and AI
    generalists who can understand the use cases themselves and how they relate to
    a business perspective.


    In the age of AI breakthroughs pre-smartphones, we didn''t have a wide selection
    of use cases because the data wasn''t as abundant as it is now. The rise of generative
    AI models has also helped with regard to the availability of data as many ANNs
    require so much training data to train on and optimize those models. In many cases,
    neural networks are used to create synthetic data as well. Now that data is abundant,
    we''re seeing a profound shift – instead of the focus being on researching and
    discovering the most cutting-edge algorithms, it is on acquiring enough talent
    to use tried-and-true models and algorithms.


    What we particularly like about this is the concept of AI democratization, or
    the idea that AI is becoming accessible to more groups of people outside research
    and big tech companies. This is especially true in 2024 as generative AI models
    are sweeping the landscape in terms of use cases and applications. The ChatGPT
    API alone is now responsible for the proliferation of so many generative applications
    that are out there in the market today.


    As a product manager, your philosophy on this will really depend on who you ask.
    Some product managers believe that the way to create the best product is to conduct
    your own breakthrough research from an AI perspective. Other product managers
    believe you can actually get a lot done with models that have become commonplace
    or have been around a long time, such as regression models. This remains true
    and even more relevant today where generative capabilities are concerned. The
    reason for this is training the kind of complex ANNs that generate content can
    be so prohibitively expensive that for the time being, we will see the market
    open up to models that have been trained by heavily financed, open sourced organizations.'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'The goal of a product manager is to help the manifestation of a product that
    isn’t just a commercial success but an industrial triumph as well. What exactly
    do we mean by industrial triumph? If we can influence you to bring a product to
    market that truly can offer something new, necessary, and useful to the world,
    we will have achieved the central goal of writing this book. We would also consider
    that a triumph.


    Explainability is a big area of interest for a product manager. The idea that
    you can easily explain your AI product, how it comes to certain conclusions, and
    the inner mechanics of how it works becomes very important when you’re dealing
    with the public or a sensitive subject matter, or if you have high-profile or
    enterprise customers that may be subject to risk later downstream. We don’t want
    to convince you of what kind of product manager you should be; rather, we want
    to lay down the options for you to consider.


    The purpose of this chapter is to highlight some promising developments in AI
    products in recent years to offer a variety of perspectives on how AI can be leveraged
    across a number of different business models. This isn’t about emulating other
    companies but rather coming to appreciate how AI philosophy, behaviors, ethics,
    and practices can change from one business model to another. For us, this is vital
    to how the product is managed at the department level. As a product manager, you
    are tasked with the commercial success of the product, and understanding how AI
    relates to your business model is important to your risk management.


    With that, let’s explore the best examples of AI product management done well
    and see how this success impacts a business in all areas, expected and unexpected.
    In this chapter, we will be taking a look at some examples of AI companies through
    the lens of differing business models and offerings, including **business-to-business
    (B2B)** examples and **business-to-consumer (B2C)** examples. We will also be
    taking a look at companies thriving in unsaturated and underserved markets (blue
    oceans) as well as saturated and competitive markets (red oceans). The aim of
    this chapter is to highlight a few key areas in which businesses are thriving
    with regard to the AI products they bring to market.


    The chapter will cover the following topics:


    +   - The professionals – examples of B2B products done right

    +   - The artists – examples of B2C products done right

    +   - The pioneers – examples of blue ocean products

    +   - The rebels – examples of red ocean products

    +   - The GOATs – examples of differentiated disruptive and dominant strategy
    products


    # The professionals – examples of B2B products done right


    The professionals are a good place to start with grouping products. AI will gravitate
    first toward use cases that can be profitable and allow for research and optimization.
    Because B2B products are products that are made for and used by other businesses,
    their use case is oriented completely toward the business world. This impacts
    everything from how they’re marketed to how they’re bought, sold, used, and negotiated.
    So many B2B products speak to the business impact that a product can satisfy for
    a customer across multiple levels. It’s a great way to learn potentially helpful
    applications of AI.'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'Part of the challenge with the rising supply of AI companies is that they need
    data to train on. Specifically, one of the ethical challenges with this expansion
    in data and AI products is being able to offer large amounts of data without leaking
    information that can identify you as a person, also known as *private personal
    information (PPI)* or *personally identifiable information (PI)*. Hazy, a UK-based
    AI company, offers its customers just that: the ability to derive insights, understand
    signals, and share data using synthetic data. Because of the nature of data-hungry
    deep learning models, synthetic data is preferred when training neural networks,
    and because of that, Hazy has a bright future ahead of itself. After an initial
    seed funding round of $3 million, it acquired $9 million in funding during a series
    A round in March 2023 led by Conviction VC. Their most recent round included funding
    from UCL Technology Fund and M12, a Microsoft venture capital fund.


    The nature of a successful B2B company lies in its ability to create success for
    the businesses it supports, and though we''re firmly in the data-rich era of big
    data, machine learning and deep learning still require massive volumes of data
    to learn and retrain from regularly. Hazy has done a fantastic job of alleviating
    businesses'' pain points when it comes to data availability, and it''s evident
    in the loyalty of their customer base. Another way Hazy maintains this loyalty
    is by educating its customers on the ethical and legal ramifications of traditional
    ways of anonymizing or masking existing real-world data.


    In the world of generative AI and LLMs, Mistral AI is emerging as a strong competitor
    to OpenAI''s ChatGPT product. Their most powerful B2B product is Mistral Large,
    which has already been sold to Microsoft for upward of $15 million to support
    their Azure platform. Their other product, Mistral 7B, an open source version
    of their foundational model, has also been used by companies like Hugging Face
    and is free to use. Companies like Mistral AI are taking the idea of powerful
    LLMs and customizing them for more specialized uses. This is a significant step
    in the direction of AI democratization because it allows for companies that want
    to adopt AI without having to front the significant cost, commitment, and time
    to develop their own LLMs. When companies as large as Microsoft accept this kind
    of partnership from third parties, it''s clear that it''s a solution that can
    help transform the B2B landscape when it comes to making generative AI more accessible.


    Another great example of an AI company driving success in the B2B marketplace
    is a California-based gaming company called GGBP. While they don''t create their
    own games, they use AI to reduce toxicity in the gaming culture and provide gaming
    companies with a dashboard where they can see how their users are performing from
    a moderation perspective. As gaming companies consistently take a more serious
    look at the safety and health of their gaming communities, they will come to rely
    on companies such as GGBP to ensure all their users feel safe. Moderation has
    long been a topic of discussion in social media companies and gaming companies
    alike, and it''s really nice to find an AI company finding success in this field.


    GGBP''s most recent funding round in July 2023, led by SK Telecom Ventures and
    Samsung Ventures, won them $10 million in funding. Their success serves as a positive
    reminder of the importance of leveraging AI over human workers in specific fields.
    The biggest issue in employing human moderators is first and foremost the emotional
    toll it takes on their mental health as they go about their day. Scanning for
    hurtful or violent language isn''t for the faint of heart, and finding depictions
    of graphic or hateful content on a consistent basis can deflate even the strongest
    of us. There''s a strong case to be made for the ethical use of AI in helping
    us tackle the problems that we, as human beings, would rather not be tasked with.'
