  md: '# The promise of AI – where is AI taking us?


    So, where is this era of AI implementation headed and what does it mean for all
    industries? At this point, we''re looking at an industry of geopolitical influence,
    a technologically obvious decision that comes with a lot of responsibility, cost,
    and opportunity. As long as companies and PMs are aware of the risks, costs, and
    level of investment needed to properly care for an AI program, use it as a source
    of curiosity, and apply AI/ML to projects that create success early on and build
    from that knowledge, those that invest in AI will find themselves experiencing
    AI''s promise. This promise is rooted in quantifying prediction and optimization.
    Here are a few examples:


    +   - 35% of Amazon''s sales come from their personalization and recommendation
    engine because of its effectiveness at suggesting products based on their users''
    behaviors, preferences, and past purchases. As this is 35% of their total revenue,
    this has a substantial impact on both ROI for their AI investment as well as revenue.

    +   - Netflix''s content recommendation engine personalizes recommendations and
    improves user engagement and retention to the tune of $1B annually. By reducing
    churn and increasing customer retention, the company is able to reduce the costs
    of acquiring new customers as well as lost revenue from churning customers.

    +   - Shopify uses AI to detect and prevent fraud in their transactions, helping
    their entire community of sellers and merchants feel safe on their platform. These
    tools have helped the company save from chargebacks and losses and have significantly
    decreased fraud costs with over 20 million fraudulent authorizations stopped from
    their interventions.


    When a third of your revenue is coming from an AI algorithm, there''s virtually
    no argument. Whatever investment you make in AI/ML, make sure you''re leveraging
    it to its maximum capacity by properly planning and strategizing, finding capable
    talent that''s aware of the space and potential dangers, and choosing the right
    scalable infrastructure to limit your refactoring.


    As long as your AI/ML projects are directly married to outcomes that impact cost
    savings or revenue, you''ll likely experience success within your own career if
    you''re overseeing these projects. The recommendation of starting small, applying
    it to a clear business goal, tracking that goal, and showing off its effectiveness
    is a smart strategy because this chapter details the many areas of maintaining
    an AI program, as well as potential areas where it might experience hurdles. Justifying
    the time, investment in headcount, and infrastructure expenses will be challenging
    if you''re not able to communicate the strength and capabilities of AI to even
    your most hesitant executive.


    This will also be important for your *technical resources* (data scientists, data
    engineers, and ML engineers) as well as for your *business stakeholders*. It''s
    one thing to know more about the ML algorithms you''ll be using or to get a few
    recommendations about how to best store your data, but you really won''t have
    the intimacy and fluency needed to truly be an agent of change within your organization
    if you don''t iterate with your own projects and grow your knowledge of what works
    best from there. We learn through iteration and we build confidence the more we
    complete a task successfully. This will be the case for you as a PM as well.'
