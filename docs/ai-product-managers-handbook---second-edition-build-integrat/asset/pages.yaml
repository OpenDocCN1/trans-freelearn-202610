- pgno: 312
  md: '# The first hire


    This brings us to the first hire. Your first hire will be someone who''s enough
    of a generalist to lay out all the options for you much like a consultant would,
    but they''re working for you full time so they can run with the ideas if their
    leadership team agrees with the recommendations. As you''re vetting and interviewing
    this person, make it clear to them in which area of the business you''re looking
    to include AI, automation, advanced analytics, or ML. I would also make it clear
    what the goals are for that position, what you honestly need help with, and what
    stage you''re at. If you''re in a position to only hire one person to get you
    started, I would also make sure you have agreement on what a first project looks
    like so that no one''s surprised on the other end.


    You should have a pretty clear idea of your data and AI strategy so that you''re
    not overloading this person with unrealistic pressure. AI PMs, ML engineers, data
    scientists, data engineers, and data analysts all specialize in their own ways
    and it''s essentially impossible to find a data generalist. Someone who can tell
    you the best infrastructure for your data and workflows, actually build those
    pipelines, clean all that data, load it into models, train those models appropriately,
    deploy those models, and finally communicate the success of all that work in a
    way that''s meaningful to the business is impossible to find. You also don''t
    want to just hire a whole team right out the gate without having ways to meaningfully
    apply their work. These roles don''t come cheap, so investing in a team before
    you really know how you''re going to use them is like buying a submarine before
    you get your license to drive a car. AI is a massive investment in your business,
    so make sure you educate yourself and take advantage of consultants before you
    start hiring so that you''re not wasting your money. This is an ecosystem, and
    there''s a place for everyone in it, with good reason.


    # The first AI team


    Now let''s say you do have a good idea of where to start, you have some good early
    projects for your data and AI folks to work on, and you''re already seeing some
    success in your AI applications. Excitement is buzzing within your business, and
    you''ve got a number of departments reaching out to you about starting their own
    ML projects. Suddenly, your lone data scientist or ML engineer is overloaded with
    work. You start to invest in a team and essentially an entirely new department.
    In Chapter 6, we discussed PMs roles of ML engineers, data scientists, data engineers,
    and data analysts – this is your AI team. This is the team that will allow you
    to responsibly build out your AI function and optimize your infrastructure, data
    management, workflows, data pipelines, modeling, training, deploying, and communicating
    with the business. Having a dedicated team for this is optimal and ethical because
    a lot of work and maintenance goes into AI management. If you can afford it, you
    know how to best make use of your employees, and you know how to keep them happy
    and dedicated, they will create a wealth of opportunity and success for your product
    and business.


    # Fear is not the answer — there is more to gain than lose (or spend)


    Believing in and dreaming of success are vital skills for a an AI PM. So much
    of the role surrounds concepts such as building a product vision, mission, and
    strategy and ultimately using these tools to create a roadmap that will manifest
    these more nebulous concepts. As a PM, you have to train yourself to visualize.'
  merge: -1
  img_proc: true
- pgno: 313
  md: 'You can''t visualize if you don''t maintain clarity and focus on your goal.
    It''s all about alignment. You might find yourself saying, “Do we have alignment?”
    over and over again as a PM to the point where you''ll find TikTok videos joking
    about PMs saying this way too much. Perhaps what makes it so funny is that alignment
    is so crucial to the role that the job function itself can be distilled into this
    one word. You''re creating alignment in all ways. You''re aligning leadership,
    marketing, sales, customer success, operations, finance, engineering, and countless
    other impacted business functions around the product and helping build something
    successful that all these teams can be proud of.


    This is the emotional part of the role, and it''s one I feel the need to bring
    up in this section because many AI PMs might find themselves facing the cumbersome
    task of grappling with AI when they might not know much about it in the first
    place. The fear that can arise from this is the very essence of why I decided
    to write this book. In my first role as an AI PM, I felt fear pop up for me. I
    felt insecure about my own knowledge of AI in the first place. I had a background
    in data science and ML before my first official role as a ML and I still had this
    fear and uncertainty. I began managing a book club about data science, AI, and
    ML books to keep this fear at bay. After each book, 38 and counting, I find myself
    becoming more and more confident about the subject matter. I then started writing
    and sharing my own articles as a way to manage the complicated emotions that came
    up for me as I was managing these products.


    When I look at these emotions objectively, I think it''s was funny that I still
    have reservations about my knowledge and skill set. After all, there aren''t too
    many PMs out there who have come from the data science and ML space in the first
    place. Because of this, depending on their level of confidence, I would venture
    to say that most AI PMs will likely find themselves grappling with many of the
    emotions I have felt. Particularly in the previous sections, which focus on non-AI-native
    products, I wanted to address the emotional side of AI product management and
    give further insight into how to contextualize the power of AI and ML to keep
    the fears at bay.


    If we zoom out of the emotional aspect of the role and take a bird''s-eye view
    of the jobs to be done, what does alignment really look like? We discussed many
    of the first strategic hires in the last section and it was tempting to include
    a list of tasks these roles might fulfill. But in the end, any of these roles
    could do any number of these tasks. A lot of fear can arise when we venture into
    the unknown and get inundated with conflicting messages about what the right way
    forward is. I feel it''s beneficial instead to think about what levels of alignment
    you''ll be working on as an AI PM, which will keep your fears at bay. Here is
    a list of areas of alignment you''ll be working on from the beginning:


    +   - **Planning and roadmapping:** In the early days, you''ll be identifying
    areas where AI can add the most value to your product or organization. You''ll
    work with your technical counterparts on finding areas to enhance operational
    efficiency, enhance customer experiences, or enable new business. This will be
    formalized in the form of a structured plan for AI adoption; it will include steps
    and milestones for success.

    +   - **Data strategy and management:** You''ll be working with people who will
    help you assess the quality, availability, and structure of your data and give
    you guidance on how to fill any gaps you have and collect, clean, transform, and
    access your data to make sure it will be effective enough for any AI/ML modeling
    you will do.'
