- pgno: 384
  md: '# Marketing and communication


    The ProjectABZ product team invested in an in-depth competitive analysis early
    to better understand how some of their biggest competitors were integrating AI.
    They noticed many used vague language and a lack of transparency as a way to keep
    their intellectual property out of the hands of prying competitors. ABCDZCo saw
    this as an opportunity to differentiate their product and offer a premium experience
    while also putting their customers’ and users’ fears about privacy and trust at
    bay. The overarching decision to communicate and market the new AI features and
    capabilities of ProjectABZ in a way that emphasized their commitment to trust
    and transparency not only aligned with ABCDZCo’s company values but also served
    as a stark differentiator for ProjectABZ.


    Because of this, ABCDZCo’s marketing team saw an opportunity to develop a campaign
    that highlighted the new AI features while balancing and addressing trust and
    security concerns about AI head-on. What this looked like for them was a series
    of webinars, demonstrations, case studies, blog posts, FAQs, and customer testimonials
    to explain the new AI features and capabilities, data privacy, AI bias measures,
    and user control options. They posted this content publicly and often to capture
    their existing user base, as well as to attract newcomers to the project management
    tool space.


    They kept close communication with the beta-testing team of users and customers
    to ensure their feedback loops came from committed partners they could trust.
    Super-users were rewarded with free premium features in exchange for their feedback
    and trust. All feedback was incorporated to help with feature refinement and to
    address any major product concerns and issues before launch.


    Their launch campaign included personalized emails to existing customers and users,
    as well as prospective customers and users who had already expressed interest
    in the AI features through engagement with social media or through the beta tester
    program. Social content was centered on the value the new AI capabilities had
    on the product and on real customer testimonials. Influencer engagement and partnerships
    also helped ProjectABZ gain traction with known people in the industry: tech bloggers
    and industry thought-leaders who were able to review and promote ProjectABZ 2.0.


    # Summary


    In this chapter, we recapped the stages of the AI product development lifecycle
    and contextualized those stages for products that are going through an AI transformation.
    We went over how AI PMs can manage expectations during the ideation phase, how
    to manage data with strategy and integrity, how to map the user experience journey
    during the R&D phase, and how to prepare for increased scale and adoption during
    deployment. We also reviewed some of the major ways AI can have an impact on your
    product experience through insights, automation, and personalization. We had a
    discussion on the interplay between product design and marketing and the importance
    of communicating in a way that’s consistent with the new product design that will
    emerge. Finally, we ended the chapter with an overview of the importance of building
    AI systems into your legacy infrastructure in a way that’s safe, secure, and accountable
    before exploring many of these themes in our case study.'
