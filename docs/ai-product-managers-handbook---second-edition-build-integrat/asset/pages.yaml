- pgno: 40
  md: '# ## DL


    DL is a subset of ML, but the terms are often used colloquially as almost separate
    expressions. The reason for this is DL is based on neural network algorithms and
    ML can be thought of as... the rest of the algorithms. DL refers to models that
    have neural networks and all other models (including language models and computer
    vision models) are referred to as ML. In the preceding section covering ML, we
    looked at the process of taking data, using it to train our models, and using
    that trained model to predict new future data points. Every time you use the model,
    you see how off it was from the correct answer by getting some understanding of
    the rate of error so you can iterate back and forth until you have a model that
    works well enough. Every time, you are creating a model based on data that has
    certain patterns or features.


    This process is the same in DL, but one of the key differences of DL is the depth
    of the models - patterns or features in your data are largely picked up by the
    DL algorithm through what’s referred to as feature learning or feature engineering
    through a hierarchical layered system. Here’s a diagram showing how it works:


    ![](img/a0c9f9a2ba06a06d309ce21d890a47c6_40_0.png)


    Figure 1.3: How ANNs work


    We will go into detail about the various algorithms that are used in Chapter 3
    because they have a few nuances, but as you continue developing your understanding
    of the types of ML out there, you’ll also start to group the various models that
    make up these major areas of AI (ML and DL). For marketing purposes, you will,
    for the most part, see terms such as ML, DL/neural networks, or just the general
    umbrella term of AI referenced where DL algorithms are used.'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'It''s important to know the difference between what these terms mean in practice
    and at the model level and how they''re communicated by non-technical stakeholders.
    As AI PMs, we are toeing the line between the two worlds: what engineering is
    building and what marketing is communicating. As mentioned previously, anytime
    you''ve heard the term **black-box model**, it''s referring to a neural network
    model, which is DL. The reason for this is DL engineers often can''t determine
    how their models are arriving at certain conclusions, creating an opaque view
    of what the model is doing. This opacity is double-sided, both for the engineers
    and technologists, as well as for the customers and users downstream who are experiencing
    the effects of these models without knowing how they make certain determinations.


    For AI PMs, DL poses a concern for explainability because there''s very little
    we can understand about how and why a model is arriving at conclusions. Depending
    on the context of your product, the importance of explainability could vary. One
    of the biggest objections your sales team might face from customers is that they''re
    not able to purchase black-box model products; this came up for us quite a bit
    in some of our own work experiences. Another inherent challenge is these models
    essentially learn autonomously because they aren''t waiting for their engineer
    to choose the features that are most relevant in the data for them; the neural
    networks themselves do the feature selection. They learn with very little input
    from an engineer. Think of the models as the *what* and the following section
    of learning paradigms as the *how*.


    # Learning paradigms in ML


    In this section, we will cover the differences between supervised, unsupervised,
    semi-supervised, and reinforcement learning and how all these learning categories
    can be applied. Again, the learning type has to do with whether or not you''re
    labeling the data and the method you''re using to reward the models you''ve used
    for good performance. The ultimate objective is to understand what kind of learning
    model gets you the kind of performance and explainability you''re going to need
    when considering whether or not to use it in your product.


    # Supervised learning


    If humans are labeling the data (also known as structured data) and the machine
    is also looking to correctly label current or future data points, it''s supervised
    learning. Because we humans know the answer the machines are trying to arrive
    at, we can see how off they are from finding the correct answer, and we continue
    this process of training the models and retraining them until we find a level
    of model performance that we''re happy with.


    Applications of supervised learning models include classification models that
    are looking to categorize data in the way spam filters do or regression models
    that look for relationships between variables in order to predict future events
    and find trends. Keep in mind that all models will only work to a certain point,
    which is why they require constant training and updating, and AI teams often use
    ensemble modeling or will try various models and choose the best-performing one.
    It won''t be perfect either way, but with enough handholding, it will take you
    closer and closer to the truth.'
