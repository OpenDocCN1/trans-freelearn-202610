- pgno: 104
  md: 'That said, the goal post of what constitutes "harm" or an "AI system" is always
    changing and will continue to change, as we saw with the current regulations and
    movements to legislate, which were introduced in **Chapter 2** of this book. Companies,
    technologists, leaders, and officers of organizations often won''t be held to
    scrutiny or accountability until after harm has been done. Not everyone operates
    in the world with a moral compass, and many may support the building of products
    they''re aware cause harm. Many will remain willfully ignorant as a matter of
    choice.


    If you''re leveraging ML or DL in a capacity that has even the potential to cause
    harm to others, if there''s a clear bias that affects underrepresented or minority
    groups (in terms of race, gender, or culture), go back to the ideation phase.
    This is true whether that''s immediate or downstream harm. This is a general risk
    that ML poses to us collectively: the notion that we''re coding our societal biases
    into AI without taking the necessary precautions to make sure the data we feed
    our algorithms is truly unbiased.


    The engineers who build ANN are unable to look under the hood and truly explain
    how ANNs make decisions. As we''ve seen with the, albeit layman, preceding explanations
    of DL algorithms, ANN structures are built on existing ML algorithms and scaled,
    so it''s almost impossible for anyone to truly explain how these networks come
    to certain conclusions. Nevertheless, some of the most encouraging legislation
    brought forth by the EU, the AI Act discussed in **Chapter 2**, aims to combat
    this very issue. By insisting that companies not only demonstrate the level of
    risk their AI systems pose but also prove their findings in the form of a white
    paper that aims to specifically articulate the potential harm, they''re combating
    the main issue that plagues DL models. Going a step further, they also want there
    to be requirements that communicate the training methodology used for the creation
    of an AI system, which can allow for greater trust and transparency in AI as it
    evolves. This is encouraging to see and a positive move forward when it comes
    to the promotion of AI regulation and safety.


    DL algorithms are often referred to as a black box because they resist a truly
    in-depth analysis of the underpinnings of the logic that makes them work. This
    is true of all deep tech models, including the most popular and effective generative
    AI models. DL has a natural opacity to it because of the nature and complexity
    of ANNs. Remember that ANNs effectively just make slight adjustments to the weights
    that affect each neuron within its layers. They are basically elaborate pattern
    finders using math and statistics to make optimizations to their weighting system.
    They do that hundreds of times for each data point over multiple iterations of
    training. We simply don''t have the mental capacity or language to explain this.


    You also don''t have to be a DL engineer to truly understand how your product
    affects others. If you, as a PM, are not able to fully articulate how DL is leveraged
    in your product and, at the very least, can''t prove that the outputs of your
    DL product aren''t causing harm to others, then it probably isn''t a product you
    want to go all in for. Now that we''ve seen DL become more accessible through
    the use of popularized generative AI models, we see the potential for the opacity
    of DL to become exacerbated and fuel even more distrust in the market. While DL
    is currently more accessible, it''s still very much in the research phase and
    many PMs should be prudent when incorporating it because of this issue of explainability.
    We urge PMs to use caution when looking to wet their feet with DL. Moving forward
    without a sense of stewardship and responsibility for our peers and customers
    with something as complicated and full of potential as DL is a recipe for adding
    more chaos and harm to the world.'
  merge: -1
  img_proc: true
- pgno: 105
  md: "AI PMs play a crucial role in making sure the AI systems they build are designed,\
    \ deployed, and monitored with ethical considerations in mind. The following is\
    \ a list of best practices that are meant to serve as a checklist for AI PMs to\
    \ use to ensure that they’ve got their bases covered:\n\n+   * Schedule periodic\
    \ audits of your AI system to ensure certain groups are not discriminated against\
    \ by addressing bias in training datasets and model predictions. Tools like IBM’s\
    \ Fairness 360 toolkit and guides like TensorFlow’s Fairness Indicators can help\
    \ with this.\n+   \n+   * Set up tools to track predictions and user interactions\
    \ so that there’s a triggering system when there are unusual patterns that could\
    \ be proxies for ethical concerns.\n+   \n+   * Create accessible documentation\
    \ for AI systems where users/developers can ask questions or raise concerns.\n\
    +   \n+   * Proactively ask for feedback through user surveys and feedback forms\
    \ to get information on system performance and ethical concerns.\n+   \n+   *\
    \ Regularly review training data and model outputs for fairness and inclusivity.\n\
    +   \n+   * Document ethical considerations and decisions throughout the development\
    \ lifecycle, particularly for key decisions, and use **explainable AI (XAI)**\
    \ methods like LIME or SHAP to document model interpretability and decision-making.\
    \ DataCamp has a great resource for that, which can be found here: https://www.datascamp.com/tutorial/explainable-ai-understanding-and-trusting-machine-learning-models.\n\
    +   \n+   * Regularly review changes in AI regulations and legislation with legal\
    \ teams and establish an AI ethics review board within your organization to demonstrate\
    \ due diligence regarding ethical concerns.\n+   \n+   * If a cross-functional\
    \ governance and ethics board doesn’t exist at your organization, help form one\
    \ to ensure leadership, technical, and legal stakeholders are represented where\
    \ you can discuss strategic decisions together.\n+   \n+   * Embed ethical principles\
    \ into the design process from the outset to make sure **fairness, accountability,\
    \ and transparency (FAT)** remain constants within your product team or organization.\
    \ Adopt ethical frameworks like IEEE or OECD, which outline responsible AI development.\n\
    \nDo we always have to be so cautious? Not necessarily. If DL applications get\
    \ really good at saving lives by detecting cancer or they work better when applied\
    \ to robotics, who are we to stand in the way of progress? However, medical applications\
    \ of DL models are heavily scrutinized for accuracy and safety standards. As time\
    \ goes on, we will be seeing more legal, legislative, and regulatory oversight\
    \ of AI systems, not less. The complexity and depth of DL models make it difficult\
    \ to trace how certain decisions or predictions are made compared to traditional\
    \ ML models. If you’re an AI PM, you will have to help prepare your organization\
    \ to account for this ambiguity."
