- pgno: 287
  md: '# Safety


    Fostering a culture of psychological safety is important for any collaborative
    work environment. We spend more time with our co-workers than we do our own families
    much of the time, so working with people that we trust and feel safe with is imperative
    for all workers. The AI PM role is one that gathers inputs from all sides and
    finds a way to digest them all in a way that best serves their product. But what
    will the quality of that feedback be? If our stakeholders, collaborators, and
    teammates don''t feel comfortable sharing their authentic thoughts, asking questions,
    expressing controversial opinions, or raising concerns without worrying about
    how others will react, the feedback won''t be of much use. It will also alienate
    the people you need to build trust and work well with. An effective AI PM knows
    this well and helps create a culture based on respect, inclusivity, collaboration,
    communication, and trust.


    This is easier said than done. A kind of hubris can develop in PMs, particularly
    now that AI is reaching a larger-than-life influence. This hubris can develop
    for many reasons. Because the role is so encompassing, the cumulative effect of
    having to balance so many perspectives, meetings, and resources can lead to a
    mental environment where you feel overwhelmed and underappreciated. Some PMs may
    feel resentment or a sense of superiority over others, leading to a downward spiral
    of trust and safety.


    Remember that as an AI PM, you will likely absorb any criticisms, disagreements,
    and resentments stakeholders voice when you''re collecting feedback from them.
    Things won''t always be perfect. Sometimes we''re disappointed when a feature
    we really wanted doesn''t make it into the product, or when a decision is made
    that isn''t in our favor, whether we''re an AI PM or a key stakeholder. Whether
    it''s a salesperson who really needs a piece of functionality for their biggest
    customer to buy or a machine learning engineer who disagrees with a modeling decision
    one of their peers made, they will often go to the AI PM first. Over time, the
    cognitive load from these factors can add up.


    Our top priority should always be ourselves because we can''t create a culture
    of safety and empowerment without first feeling it ourselves. I urge all AI PMs
    to establish strong self-care practices. You will find yourself empathizing with
    people time and time again. Absorbing too much of this will leave you feeling
    depleted. Absorbing too little will make it hard for you to establish authentic
    relationships with the people you will rely on to build and ship your product.
    You''re at the nexus of a big ecosystem and your own health will radiate into
    that ecosystem.


    Humility can''t exist when we feel that certain people are more worthy or capable
    than others. It comes from the understanding that everyone has a part to play
    in making something great together based on their skills and inputs. As an AI
    PM, you''ll have to balance a lot of different skills and knowledge to perform
    your role effectively. But it will largely be other people who will carry out
    the “work” itself, for the most part. Your counterparts in machine learning and
    development will be doing the development work to build and ship your product.
    Your coworkers in marketing and sales will be communicating about your product
    based on your collaboration. Your leadership will be evangelizing your product
    when they go to conferences. No one does anything alone. You need them and they
    need you!'
