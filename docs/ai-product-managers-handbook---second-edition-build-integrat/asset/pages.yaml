- pgno: 166
  md: '# Productizing AI-powered outputs — how AI product management is different


    In this section, we will be exploring the difference between product management
    for traditional products and AI/ML products. At first glance, it may seem that
    AI/ML products aren’t that different from traditional products. We’re still creating
    a baseline of value, use, performance, and functionality and optimizing that baseline
    as best we can. This is true for every product as well as for the greater practice
    of product management, and this won’t change just because our product works with
    AI.


    The true differentiator when it comes to AI products is you’re essentially productizing
    a service. Think about it for a moment. In order for AI to work, it has to learn
    from your (or your customers’) data. Different models might work better on different
    kinds of data. Different datasets will require different hyperparameters from
    your models. This is the nature of AI/ML. In a way, this means that you could
    find yourself in a situation where the way you build and structure your product
    could even change fundamentally from one customer to another, especially at first
    when you have very few customers.


    What this effectively means is you understand how all your customers are benefiting
    from the AI/ML service you’re providing your customers and establish a standard
    procedure for recreating that process so that all your customers are able to experience
    the highest benefit. The general advice when productizing a service is first to
    find a niche or a specific cohort of customers to reach. We covered the UI/UX
    designer/researcher role earlier in this chapter; these folks will help you make
    the most of your customer cohorts and their preferences. If you can understand
    how AI is most helping your customers through your product and you’re able to
    focus on what value means for your customers’ success, you’ve begun the first
    steps of productizing.


    The main focus will then be on how to best structure your product and internal
    processes so that you’re not starting from scratch with every customer. This will
    be exploratory at first. Perhaps certain models are working better with some customers’
    data than others. Perhaps there are specific use cases that didn’t arise until
    one of your customers asked for them. The basic idea of productizing is finding
    something that has value and brainstorming to understand where else you can leverage
    a previous project, output, or process for the betterment of all. Waste not, want
    not. If you can recycle something for the benefit of your collection of customers,
    it will add to the success and collective love your product receives.


    Productizing services is a familiar concept in consulting where consultants are
    working project to project and often have to create new engagements with clients
    with an almost blank slate. But given that our own minds are pattern detection
    machines, eventually, we start to see similar requests come in or similar use
    cases pop up. Creating a repeatable process for certain types of customers, verticals,
    profiles, or use cases is the very essence of productizing. This is exactly what
    we’re doing with AI/ML products. This is also a way to better anticipate how and
    why your customers are coming to you and your product specifically so that you
    know how to share successes and case studies that apply directly to them. The
    act of productizing will also immensely empower your marketing, sales, customer
    success, and broader GTM teams.'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'In many ways, the work of “productizing” ML happens within engineering, the
    folks responsible for building the application that will administer the models
    the data science and ML engineers are providing for engineers. You need engineers
    and developers whether you’re building an AI product or not; these are the builders
    that turn a great idea, vision, or even roadmap into a tangible product you can
    experience. They’re also responsible for making sure the product overall can scale,
    is robust enough to withstand a variety of user behavior, and ensures the product
    is compatible with various platforms and technologies.


    As we have seen in this section, AI/ML product integration is about finding the
    balance between the outputs of your models and the use cases or groups those outputs
    are trying to serve. Many PMs come out of the experience of building with AI/ML
    finding they may need to customize their product for certain cohorts. So, next,
    let’s address the need for AI customization, should it arise.


    # AI customization


    Through the act of productizing, you’ll likely start to create groupings or cohorts
    for your product. You might find that certain models work best for certain kinds
    of customers and build a structure around that. The act of grouping your offering
    into use cases and communicating differently or optimally to those cohorts builds
    on the wisdom gained from productizing. Taking that a step further, you’ll then
    naturally start to verticalize.


    Understanding the various considerations for business models, verticals, and special
    customer groupings will be an important part of how you go to market with your
    product. For instance, if you’re supporting a B2C or consumer product, you’ll
    want to invest more in information gathering by acquiring more of your end users’
    direct feedback for your ideation phase. Because you’ll be creating a product
    that’s going to be experienced by potentially millions of users, you will want
    a strong handle on the preferences and desires of those end users so that your
    product is most aligned with the voice of your customer. A product such as this
    could also benefit from experimenting and iterating fast so that you can get a
    product out and start gathering feedback on it before you’re even getting your
    desired level of performance from the AI/ML models themselves.


    If you’re supporting B2B or business-facing apps, you might spend more time on
    the ideation and deployment of that product so that you can zero in on the specific
    set of customers you’re hoping to win over. With business applications, you might
    be creating a very complex product that does a number of overlapping operations
    but for a very niche group of users. You might also have a wide variety of well-documented
    tools that offer similar solutions to your customers, so maintaining feature parity
    with the market could be more of a factor for this line of products.


    The size of your business will also impact how you show up in your organization
    as an AI PM. For instance, if your organization is large enough, there might be
    a separate PM allocated to every version of the product cycle mentioned previously.
    There could also be various PMs that support various aspects of the functionality
    of your AI product. There could also be a PM that’s devoted only to the AI features
    of the product with a higher-level PM or product director overseeing the entire
    suite. In a smaller organization, there might be only one AI PM overseeing the
    entirety of the product throughout all the phases of the lifecycle or ideating
    to continuously maintain that product.'
  merge: -1
  img_proc: true
- pgno: 168
  md: 'Another differentiation between the sizes of companies lies in the **data**
    itself. Depending on how large your company is, the access or quality of the data
    you have can have varying degrees of difficulty. As a PM, making this data available
    and in a usable condition could prove more difficult and take up more of your
    time than it would at a start-up because of having to get access to siloed groupings
    of data that require administrative governance permissions. Even getting that
    data to fit together could be tough, depending on the conventions of each silo.
    Conversely, a start-up might have a hard time even amassing enough users and have
    issues with data volumes. Data availability and quality are notorious issues for
    companies big and small.


    If you have a **highly verticalized product**, this could also impact how your
    work shows up as an AI PM. For instance, having a product that’s specialized for
    healthcare, fintech, or education might necessitate a PM who has domain knowledge
    and expertise in these different verticals. Even if it’s the same PM that’s supporting
    this product for those verticals, you’ll likely see it as three different versions
    of your product because the weights, thresholds, and performance metrics for these
    specific verticals will likely be drastically different. Depending on the type
    of product you’re offering, you might even see a hyper-specialization to the point
    where the product is customized heavily even for every customer you have! This
    might be the case for highly tailored ML products that have to fit your clients’
    data.


    Ultimately, the work of building products and crafting them for specific audiences
    is all about creating a product that sells. We need to be able to understand our
    audience—the buyers and users of our products—in order to build something that
    will truly serve them. In the next section, we will discuss the notion of selling
    and what that means from a product management perspective.


    # Selling AI — product management as a higher octave of sales


    With AI product management, you’re selling in a number of ways. There’s the traditional
    sense of selling, which is this: creating a product that your market wants to
    buy. This is inherent in any traditional PM role. Your understanding of your market,
    your product, and your sales force is one where you’re confident in the solution
    you’re bringing to market, your solution’s performance, and your sales force’s
    ability to articulate the value of the solution you’re building. Then, there’s
    the opportunity and challenge AI presents: the ability to sell the AI functionality
    itself.


    Earlier in this book, we mentioned the difficulty AI/ML projects have in being
    deployed into production; this happens for a number of reasons, but among the
    top reasons is the inability to sell the value of AI to the broader organization.
    This will be incredibly relevant to any PM who’s looking to work with AI products
    because you will have to develop this understanding and ability to sell your product
    to the outside market as well as to your internal stakeholders and leaders. This
    is the case whether you work at a large organization or a small start-up.'
  merge: -1
  img_proc: true
