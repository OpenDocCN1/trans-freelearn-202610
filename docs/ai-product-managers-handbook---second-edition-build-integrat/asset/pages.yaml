  img_proc: true
- pgno: 309
  md: 'It''s important to maintain a healthy skepticism and temper expectations with
    your AI activities until you experience early successes. It''s even more important
    that you celebrate your early AI successes loudly and proudly across your organization
    when they do arise.


    It''s hard to overstate the gravity of what AI adoption will mean for all industries
    and all job roles, and the delineation between technical and non-technical roles
    will start to change as well. Right now, AI is mentioned in business articles
    for the most part as a rising trend or wave, but this wave is quickly turning
    into a tsunami. In order to stay competitive with their peers, all companies across
    all industries will find themselves scrambling toward the digital transformation
    of AI. As more and more companies do this and successfully advance toward accomplishing
    AI adoption, we will also be seeing more demand for data-centric roles simply
    because most products, internal operations, and client discussions will evolve
    along with the AI adoption strategies of companies.


    We''re also already starting to see automated ML (autoML) companies and offerings
    starting to grow. Companies creating autoML products such as DataRobot and H2O.ai
    are starting to pop up more and more. This will allow anyone, even those who don''t
    actively work as data scientists and ML engineers, to be able to use, tune, test,
    and deploy ML models for performance. This means that over time, AI adoption will
    become more accessible to those who choose to take the red pill.


    This also begs the question: What will happen to data scientists and ML engineers?
    Demand for these roles isn''t projected to go down over time. With more and more
    companies embracing and planning their AI strategies, even companies who started
    early will find themselves looking for the right resources to get them going.
    Your business strategy will impact how you wet your feet with ML and advanced
    analytics. Ultimately, your forecasting, market strategy, and growth strategy
    will influence how quickly and in what manner you approach the creation, continuation,
    and growth of your AI programs internally. You might decide to start with your
    product, but you could also start with other internal applications of AI, such
    as using AI within HR or finance functions. If you recall our list of AI use cases
    from Chapter 6, you''d typically be using AI to address eight main types of problems:


    +   - **Anomaly detection:** Applying AI/ML to identify rare or unusual patterns
    that do not conform to expected behavioral patterns (e.g., fraud detection)

    +   - **Clustering/peer grouping:** Applying AI/ML to group data points into distinct
    sets based on similarities (e.g., user segmentation)

    +   - **Classification:** Applying AI/ML to assign labels to data from an established
    set of categories (e.g., spam detection)

    +   - **Regression:** Applying AI/ML to predict a numeric value based on training
    data (e.g., predicting housing prices)

    +   - **Recommendations:** Applying AI/ML to suggest relevant items or content
    based on established preferences (e.g., shopping cart recommendations)

    +   - **Ranking:** Ordering or prioritizing items based on criteria (e.g., search
    engine results)

    +   - **Optimization:** Finding the best solution from a set of potential solutions
    (e.g., driving route optimization)

    +   - **Generation:** Creating new data/examples based on input examples/prompts
    (e.g., image generators)'
  merge: -1
  img_proc: true
- pgno: 310
  md: 'All of these use cases can be applied to your product or your internal processes.
    Feel free to skip ahead toward the end of this chapter to see our case study example,
    which demonstrates how regression, optimization, recommendation, and anomaly detection
    can potentially be implemented into new AI features for traditional software products
    looking to integrate AI. Perhaps you want to predict how much demand there will
    be for some products you sell for inventory purposes. Perhaps you want to see
    whether some of your customers’ purchases are fraudulent. Perhaps you’re trying
    to group your customers into targeted categories. All these problems can be helped
    with AI. Similarly, you could choose to use certain algorithms in your product
    development to help your product make predictions for your customers, show them
    how they are performing compared to their peers, or offer them insight into anomalies
    within their performance. AI is applicable to both internal and customer-facing
    expressions. Here’s something to think about – which of these use cases is relevant
    to you and which approach would you choose?


    > The number of AI start-ups, the amount of annual investment from venture capitalist
    firms, job opening projections, and the annual number of AI patents, as well as
    published AI papers, are all on upward trends. According to Crunchbase, 35% of
    all start-up investment went to AI companies in 2024, the highest percentage on
    record. Forecasts are showing a 28.46% increase in the AI market by 2030, where
    it will reach $826.7B worldwide. Currently, there are 70,717 AI start-ups worldwide.
    This means we are experiencing a massive explosion in demand and investment in
    AI, and this is still very much the beginning.


    # Working with an AI consultant


    If you’re just wetting your feet with AI, one area to start with would be to solicit
    the help of a consultant. When doing your own research within the space, it can
    be daunting to understand the spread of options you have before you. These options
    can span everything from data preparation to model deployment and AI program optimization.
    If you have limited domain knowledge in this area, working with a consultant can
    help you navigate the choices you have. You’ll also have to make some decisions
    about what kind of infrastructure you want to have, what the reporting structure
    will look like for your high-tech projects, and where the easiest applications
    of data or AI projects would be for maximum visibility within your organization.
    I always recommend companies start small with one high-impact project because
    your first attempt at AI will likely be met with hesitation or resistance.


    It’s something unknown, and there isn’t an established baseline yet for what success
    looks like. Consultants are great with a first-time project, particularly if the
    company struggles with aligning AI initiatives to the organization’s goals and
    resources, or just getting you set up with the right infrastructure and workflow
    to make it happen. Many companies will attempt to take on building an AI pipeline
    on their own without the help of outside consultants and strategists, but if you
    don’t have a good baseline of understanding for how to manage an AI program, you
    could wind up spending a lot of money on decisions that haven’t been properly
    thought through.'
