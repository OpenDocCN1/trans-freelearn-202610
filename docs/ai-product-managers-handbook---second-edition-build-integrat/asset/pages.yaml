  md: '# 3. Error Analysis


    After aligning them, we analyze the semantic errors produced by our translation
    model because these types of errors are critical in translation quality.


    It is observed from the error analysis that semantic errors (involving SENSE,
    DISCOURSE, and PRAGMATICS levels) are the most prevalent and persistent.


    We analyzed each sentence with semantic errors and categorized them in terms of
    MTS errors (Vilar et al., 2006), a well-known taxonomy for machine translation
    errors. Specifically, each sentence, we first detect and classify the semantic
    errors at word, phrase, and sentence levels.


    | Error Type | Example | Analysis |

    | --- | --- | --- |

    | SENSE (Missing words) | EN: A 65-year-old woman ... | The missing of the word...
    |

    | DISCOURSE (Collocation) | EN: ... get 2 silver medals... | Improper word selection...
    |

    | PRAGMATICS (Extra words) | EN: The police are still looking for... | The extra
    words inserted... |


    Figure 3: Examples of semantic errors in terms of the MTS taxonomy.'
  merge: -1
