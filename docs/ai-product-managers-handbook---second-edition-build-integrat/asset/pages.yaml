- pgno: 201
  md: '# 8


    # Customization for Verticals,

    Customers, and Peer Groups


    In this chapter, we''ll understand how products evolve and segment themselves
    across **verticals, customers, and peer groups** (customers of similar sizes that
    may not necessarily be in the same vertical but are complementary). The purpose
    of this analysis is to understand how you can start to think of product management''s
    role in orienting AI products for specialized groups and, ultimately, what AI
    allows you to do for those groups. AI and ML are powerful tools but have a general
    power that needs to be applied specifically in order for their value to be fully
    appreciated. Adjusting AI models to meet industry-specific needs, personalizing
    AI solutions based on customer demographics, behaviors, or company size, and leveraging
    data to share insights across industries and sectors are all ways to create customization
    when bringing forward solutions. In many ways, the work of a **product manager
    (PM)** is to make that value as obvious as possible to everyone, from customers
    to developers. For this reason, we will be discussing the various ways products
    can be contextualized in terms of domains, verticals, and use cases.


    As we’ve discussed in previous chapters, the role of a PM incorporates a lot;
    it’s multifaceted in nature. You’re involved with designing the product, organizing
    the workflow as that product evolves, analyzing feedback from your customers,
    incorporating that feedback into your overarching business goals, researching
    new methods and improvements, building the greater product strategy that aligns
    with your company’s strategy, and, ultimately, communicating across all levels
    to all your stakeholders, developers, and leaders. This requires a lot of understanding,
    intimacy, and commitment to your product and its success!


    When you incorporate the role of a PM into an AI PM, you’ve got a few more areas
    to consider. You’ll want to understand the options you have in terms of ML algorithms
    and data models, as well as understanding how AI will move the needle as far as
    your acceptance criteria and key metrics are concerned. Particularly now, with
    the accessibility of generative AI models and APIs, you’ll also want to try to
    understand how generative outputs can be used to leverage the value and strength
    of your product. You’ll want to have an understanding of data privacy and AI ethics
    to make sure you aren’t building something that might cause harm to any of your
    customers or the business at large down the line.'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'Above all, the role of an AI PM will require a level of data fluency and literacy.
    Gaining an intuition about how to use data, how to apply data to specific use
    cases, and understanding a bit about statistics and the data models themselves
    will be crucial to making sure you’ve got enough of an understanding to be confident
    as an AI PM. This area is, in many ways, a prerequisite to being able to start
    your AI PM career. As an AI PM, you’ll be working with data heavily. Critical
    thinking and complex problem-solving will be necessary to build a successful product
    that best aligns with the specific use case for your AI product. To help you develop
    these skills, we will explore the most common use cases, domains, verticals, and
    peer groups that AI is leveraged for.


    The topics we will cover in this chapter are as follows:


    +   - Understanding domain spaces and how AI can be optimized for these domains

    +   - Fluency with various verticals that are seeing a high saturation of AI products

    +   - Understanding user behavior analytics

    +   - Learning from peers in your space through thought leadership and consultancy


    # Domains — orienting AI toward specific areas


    When discussing domains, there are really two major domains you’ll want to invest
    significant time establishing credibility in. The first is in understanding AI
    concepts themselves, which we’ve already covered extensively throughout this book
    so far. The second is in understanding how AI is helping certain domains achieve
    success. Considering that the part of the book we’re in is focused on building
    an AI-native product, we will focus on how an AI PM can achieve this as they’re
    setting out to build a new AI product.


    Depending on the industry you’re in, you’re going to want to understand your space
    well enough that you have an understanding of who your direct and indirect competitors
    are. This might be more straightforward or not, depending on the space you’re
    working and competing in. Gartner has a great tool called Magic Quadrant. The
    four areas of the quadrant are as follows:


    +   - **Leaders:** Established players in a market that have been most reliable
    and prevalent. They demonstrate the most complete vision as well as the highest
    ability to execute that vision.

    +   - **Challengers:** Newcomers that are threatening the dominance of leaders
    in a given market. Their completeness of vision isn’t quite where it is for leaders,
    but they are able to compete on execution.

    +   - **Visionaries:** This group has a lot of vision but their ability to execute
    it is limited, so they’re competing with leaders but they’re not able to execute
    quite as quickly or comprehensively.

    +   - **Niche players:** This group is able to focus on a limited amount of use
    cases and serve that select group quite well. They’re not expanding their product
    suite to meet a higher vision, nor are they aggressively trying to gain a higher
    market share. They’re happy in their niche.'
  merge: -1
  img_proc: true
- pgno: 203
  md: '![](img/a0c9f9a2ba06a06d309ce21d890a47c6_203_0.png)


    Figure 8.1: Adapted from the Gartner Magic Quadrant


    As an AI PM building a novel AI product in your space, you''ll want to have an
    understanding of all four kinds of competitors in your chosen space or domain.
    The four quadrants themselves are built on an x axis based on the completeness
    of vision, and a y axis based on the ability to execute it. We encourage you to
    use Gartner''s Magic Quadrant as a resource when evaluating your organization''s
    placement in your own market, as well as the placement of your biggest competitors.
    Your ability to gauge where you fall along these fault lines will best prepare
    you for coming to market with a new AI product, particularly now that so many
    AI products are still in their early days.


    When building the AI-native product, a lot of initial work needs to go into ideating
    and positioning your product because it''s so new and it''s entering a new market.
    Given the cost and investment of getting an AI product up and running, you''ll
    want to be deliberate when building that investment. In the following sections,
    we will be focusing on the work of positioning a product appropriately for your
    market, understanding how your product design will actually serve that market,
    and how to build an AI product strategy that will make the most sense for your
    market.


    # Understanding your market


    For any specific domain, Gartner''s Magic Quadrant helps companies identify and
    orient themselves against their competitors in terms of execution and vision.
    Doing competitive analysis to understand where you are and where you perceive
    others to be in terms of your products and AI capabilities today will help you
    determine your future strategy for your product or suite of products. Let''s look
    at what the different categories are:


    +   - **Leaders:** The leaders demonstrate a proven history of executing the most
    complete vision. They can show you what''s been working and what needs the main
    market players in the domain are predominately addressing. This will be valuable
    for you to get a sense of what the addressable market actually wants out of the
    companies that serve them. Leaders are also great for showing their domains what
    a sustainable execution of domain pain points looks like, as they''ve been around
    for a long time and fellow PMs can learn from the products they''ve released and
    how the greater market has received them over the years. Leaders offer a great
    foundation for research when you''re in a new domain as a PM. In this section,
    you''ll find companies like Microsoft (Azure AI), Google Cloud (AI and ML), and
    IBM Watson, which offer comprehensive AI tools, widespread adoption and market
    dominance, innovation, and scalable solutions that have stood the test of time.'
  merge: -1
  img_proc: true
- pgno: 204
  md: "+   - **Challengers:** Though challengers in the quadrant show less of a complete\
    \ vision, they’re able to address the needs of their market well enough to take\
    \ some of the market share away from leaders. This is a helpful dynamic to understand\
    \ when you’re thinking about your own product. If challengers are able to take\
    \ market share from the leaders in their domains, it means there are potential\
    \ fault lines to tap into. Those fault lines are areas where leaders are not addressing\
    \ the needs of their market adequately and the most successful challengers are\
    \ able to find opportunities in those fault lines.\n+   \n+   In this section,\
    \ you’ll find companies like AWS, Oracle, and Salesforce, which offer high levels\
    \ of execution in AI/ML platforms but aren’t leading the charge in terms of innovation.\n\
    \n+   - **Niche players:** Niche players are not overachieving in the completeness\
    \ of their vision nor their ability to execute it, but it’s exactly what gives\
    \ them their superpower, as the niche players are able to show you where the edge\
    \ cases might be. This could help you potentially identify features or use cases\
    \ for your product as you’re building and designing that have some proven success.\
    \ These edge cases might be so niche that the challengers and leaders themselves\
    \ don’t find them strategic to build into their existing product suites, but for\
    \ an emerging product, this knowledge could be valuable. Getting an understanding\
    \ of what niches exist within your domain will show you where there might be latent\
    \ areas of growth that are currently untapped or underserved. In this section,\
    \ you’ll find companies like H2O.ai, SAS, and Cloudera that focus on specific\
    \ verticals and use cases.\n\n+   - **Visionaries:** These are the players that\
    \ have a robust vision for their product suite and, likely, their entire domain.\
    \ Visionaries are able to show you what’s possible from a product in your chosen\
    \ domain and will likely include some of the most cutting-edge features you’re\
    \ likely to find in your space. As an AI PM, you’ll see most of your direct competitors\
    \ here because AI features are still slow to adopt in most domains, and we would\
    \ wager that most of these players are starting to experiment with AI capabilities.\
    \ In this section, you’ll find companies like DataRobot, UiPath, and Palantir,\
    \ which offer strong visions but in more limited scopes.\n\nIf you’re getting\
    \ started in AI in your domain, and you have the privilege of being involved with\
    \ your product strategy from the very beginning, understanding the emerging visionaries\
    \ in your domain will be a great place to start. Today’s visionaries may be tomorrow’s\
    \ leaders, so you’ll want to get cozy with the names in this category for your\
    \ chosen domain.\n\nYou can do your own market research, but either way, you’re\
    \ going to want to have some sense of the landscape that makes up your domain\
    \ so that you understand your competition, the problems they’re trying to solve,\
    \ and the customers that are in your domain as completely as possible. Working\
    \ with your marketing team or building a comprehensive understanding of your competitive\
    \ landscape is a crucial layer to building your AI-native product. In order to\
    \ build something of value, you have to build something that addresses the deepest\
    \ customer pain points you’re trying to solve with AI. You can use the following\
    \ checklist to determine who you are today and who you want to be in your market\
    \ tomorrow:\n\n+   - **Identify key players:** Map out your key competitors against\
    \ yourself in the four quadrants to understand strengths and weaknesses. What\
    \ are the problems your competitors are trying to solve? Who are the customers\
    \ that make up your target market?"
  merge: -1
  img_proc: true
- pgno: 205
  md: '+   - **Research current trends:** Analyze the impact of emerging technologies
    and trends to understand what influences are having the biggest impact on your
    overall market. What are the gaps in the existing tools out there?

    +   - **Evaluate your positioning:** Review the quadrants and the players in your
    market that are in them to determine if your current product and company strategy
    align with what you''re seeing. If it doesn''t, think about how you might get
    to where you want to be.

    +   - **Inventory capabilities and strengths:** Are there products or features
    that are most prominent for the companies in your market? Are these relevant to
    where you want to take your company?

    +   - **Customer feedback analysis:** Are there gaps or pain points in some of
    the perceived strengths of your competitors based on the quadrants? How does your
    product stack up?

    +   - **Analyze market share:** For your most prominent competitors, what does
    their market share and growth trajectory look like?

    +   - **Market segmentation:** Are there certain segments within a market that
    your competitors are servicing most? Are these competitive or complementary to
    your company''s focus?

    +   - **Feature level:** At the product level, compare the features, capabilities,
    and pricing of your products across competitors in all four quadrants. Do you
    notice adjustments you can make to your roadmap?

    +   - **Strategic partners:** Can you identify potential partnerships and collaborators
    within the four quadrants? Are there complementary partners that you might collaborate
    with?

    +   - **Find your disruptors:** Which companies within the quadrants may pose
    the greatest risk to your company or product? Are there elements you can introduce
    that could limit this risk?


    Beyond the pain points themselves, your product will also begin to collect customer
    data. This means that you''re not just building a product that addresses your
    customers'' problems; you''re also improving how your product functions with the
    data your product is collecting from your customers. We will talk about this specific
    point further in the UEBA section, but for now, keep in mind that understanding
    how much and what kind of customer data to collect, in addition to how to use
    that customer data, will be part of the work you need to do while doing the market
    research to fully understand the market you''re looking to serve.


    For many AI PMs, you likely already have some familiarity and credibility built
    in your domain. It is possible to grow your reputation in your chosen domain by
    bringing something novel to your company, organization, or industry. AI offers
    a vehicle to do this but, again, you first must have a clear answer to why you
    want to be using AI that goes beyond the marketing fluff so that you can stand
    out from the competition. Making sure that you''re understanding your market needs,
    understanding how your product will specifically address those needs, and building
    and communicating a product strategy that aligns all that into one path forward
    will be a great way to make sure AI is properly oriented toward your chosen domain.


    Again, this will be a prerequisite for ideating on the early stages of your product
    design and strategy. Feel free to refer to *Chapter 2*, where we discuss **new
    product development (NPD)** stages, and *Chapter 6*, where we expand on those
    ideas for AI product development stages.'
  merge: -1
  img_proc: true
- pgno: 206
  md: '# Understanding how your product design will serve your market


    After you feel like you understand the domain, the major players, the way they’re
    leveraging AI, and some of the main customer pain points you’re looking to solve
    in your chosen domain, you’re going to be ready to start to ideate on your product.
    This will come with a whole slew of activities. Before all the wireframing, building
    version one of your product strategy, and coming up with a roadmap, you’re going
    to want to be really clear on why you’re using AI to address this market. Building
    an AI product to address your market without having a clear understanding of why
    it takes AI to solve this problem is an easy way to waste the money you worked
    hard to raise.


    Yes, there’s a market splash and many start-ups embrace AI just for the funding,
    but this alone will not have enough substance to get you through the stages of
    responsibly building an AI product that will perform well in your market. Before
    you go out and build an amazing product that solves all your customers’ problems
    with the power of AI, you will need to solve the fundamental question of Why AI?


    Once you have a clear idea of why you’re using AI to solve your customers’ issues,
    you have the building blocks of your marketing message. Because we’re at an integral
    time for AI products, just coming to market with AI features is enough to put
    you in the position of having to evangelize AI in your domain. Sure, some industries
    and domains are seeing lots of AI features already, as we will cover in the next
    section, but by and large, you’ll likely be among the first, so this question
    of Why AI will keep coming up from your customers, from your competitors who insist
    their product is superior, or from your design and building team internally.


    As you begin to ideate, you will need to keep this answer, along with your customers’
    major problems, at the front of your mind so that you remain customer-focused
    and dedicated to your message. As you build through the initial versions of your
    product, always keep asking how AI is helping you solve your customers’ most frustrating
    and integral needs. As a PM, you’re an energy-generating force within your company.
    This means that your work of ideating and building a solution that works for everyone
    is also meant to stimulate your leadership team. Keeping your focus on Why AI,
    as well as the primary problems of the customers you’re serving, means you’re
    keeping your leadership team focused as well.


    The next decade will show us new ways of applying AI in a way that addresses specific
    domains. If a great solution doesn’t yet exist, see whether you can dream it up
    yourself. If you can pull it off, your domain will reward you with thought leadership
    bragging rights, an ever-growing customer roster, and the knowledge that you were
    able to forge something memorable in the wilderness. Many still think of applied
    AI as the Wild West because technologists know that by 2030, we will be looking
    back on some amazing breakthroughs and use cases of AI that we haven’t even thought
    of yet. It’s important to keep this spirit of curiosity and creativity alive in
    such a nascent field.


    This applies no matter which domain you’re in. Some domains will be more advanced
    as far as AI adoption is concerned and this will make your work as an AI PM more
    and less difficult because each level of advancement of AI has its own slew of
    challenges and opportunities, but the process will be the same regardless. If
    you’re in a domain that is more advanced as far as AI adoption is concerned, you’ll
    be more interested in which AI features your competitors are using to address
    certain needs and decide whether that’s a direction you want to go in as you refine
    your product strategy. If you’re in a domain that’s less advanced, you’ll have
    to look to other industries for inspiration for AI adoption and you’ll be able
    to make a more eye-catching splash with your own product in your market.'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'Either way, you will be able to successfully reach a market when you’re able
    to apply all you’ve learned in a way that offers your domain something that’s
    currently missing from the offerings that already exist. As an AI PM, you don’t
    need to be an expert in all areas of AI but you do need to have enough of an understanding
    of your market and AI capabilities/strategies/algorithms that will best serve
    the exact use cases you’re trying to apply AI.


    Keeping your leadership team, go-to-market (GTM) marketing/business development/sales
    team, and development team aligned with your customers and the AI solutions you’re
    bringing to the table means you’re helping your entire stakeholder team focus
    on your main goal, which is to build an AI product that best addresses your market’s
    needs. This seems like an obvious point, but as many PMs know, once you get started
    with the day-to-day work of building and evolving a product through your various
    sprints, losing sight of your main goal is easier than it seems. There are so
    many specialized skills that an AI PM needs, so keeping this focus is important
    when you start getting into the weeds with your design, choosing which AI algorithms
    to go with, and so on. The following is a list of considerations and questions
    to get you started:


    +   - What specific customer pain points are you aiming to solve?

    +   - What is the impact these pain points currently have on your customers’ experience?

    +   - Why is AI the right solution for these pain points?

    +   - What unique capabilities does AI bring to the table that traditional methods
    don’t?

    +   - How are the key competitors in your market currently using AI to address
    similar problems?

    +   - What gaps exist in their offering that your product can fill?

    +   - How will you educate and explain the benefits of your AI solution to customers
    and stakeholders?

    +   - What potential challenges could arise from using AI in your product?

    +   - Is there a plan for how you will address concerns related to data privacy,
    model bias, and ethical applications of AI?

    +   - Are there strategic AI milestones in your product?

    +   - How will your AI product empower the overall business goals at your company?

    +   - Which AI algorithms and models will you choose and why?

    +   - How are these choices supporting your goals of solving customer problems?

    +   - How can you make sure your focus remains on these main goals throughout
    the product development process?

    +   - How will you limit scope creep and distractions during sprints?


    For more discussions on design, feel free to jump to Chapter 9, where we will
    be expanding more deeply on product design for the AI native product, and Chapter
    15, where we will discuss the role of design when traditional software products
    evolve with AI features and capabilities.'
  merge: -1
  img_proc: true
- pgno: 208
  md: '# Building your AI product strategy


    Once you’ve done the work on designing a product that addresses your customers’
    and the market’s major pain points you want to solve with AI, you’re then in a
    position to start to build out your overarching product strategy. Obviously, your
    product MVP will start somewhere but after that, there needs to be a course for
    your product vision to grow toward. Remember that completeness of vision was the
    x axis in Gartner’s Magic Quadrant? The reason for this is that an addressable
    market has a variety of needs, ranging in complexity. Your product MVP will only
    solve a small fraction of these needs. Your leadership and company goals will
    likely not be able to solve all the needs of your market, but you will need to
    work with your leadership team to define what you’re looking to do for your market
    at large, as this will directly inform your product strategy.


    Remember, building a product strategy falls on the PM but creating company goals
    falls on leadership. You can consider your leadership team as offering you the
    crucial outputs (the company goals) you need to build a robust product strategy,
    vision, and roadmap that aligns with your company’s business objectives. This
    is an important distinction to have. PMs can put a lot of pressure on themselves
    and it’s something I wrongly internalized early on in my own PM journey as well.
    Being a PM doesn’t mean all the grand ideas have to come from you. Lean on your
    leadership team to inform your work.


    The work they should be doing is defining the company’s overarching vision, mission,
    and objectives. Without these clearly defined, it will be difficult for you to
    formulate any real product strategy because there won’t be anything to base it
    on. Once you can take these overarching company goals and turn them into a product
    vision, strategy, and roadmap, you’re able to communicate this to your development
    team and start the work of building the actual product, which will result in an
    MVP all the stakeholders involved can be proud of that satisfies the minimum solution
    needed for your company to go to market with your product.


    In order to build a product strategy and vision that can grow with your market,
    you will need to see how your market has been changing and have as complete an
    understanding as you possibly can to look at where this market is headed. Countless
    articles come out every day about the trends for particular industries and domains.
    As an AI PM, it’s even more important for you to keep ahead of these articles
    so that you have a clear picture of how your market is changing and evolving.


    Many of your internal stakeholders, along with your customers, will be looking
    to you for thought leadership and communications about how your company or product
    suite is growing with the market. Staying aware of these market trends, particularly
    as they align with your AI strategy, will be necessary for you to keep maturing
    your product strategy responsibly in a robust, evolving, unpredictable world.


    Nowadays, specific domains can have hundreds or thousands of competitors in the
    space. Particularly now that so many start-ups can erupt and work remotely first,
    we’re seeing a growing number of companies coming into virtually every domain.
    Being able to communicate your company’s offering in a way that meets your customers
    where they are, using the technical language or jargon they’re familiar with,
    and being able to show them why your product is the best choice through AI will
    be your challenge and opportunity as an AI PM.'
  merge: -1
  img_proc: true
- pgno: 209
  md: 'While we will be going over some of the common use cases as we continue with
    this chapter, we do want to stress one important point before we complete this
    section: AI is incredibly customizable. Its basic building blocks are data, and
    what you choose to do with that data is really what gives AI the power it possesses.
    If you’re an eager, talented PM in the AI space and you’re passionate about solving
    your customers’ major problems through a novel product you’re helping build, you
    can build something highly customizable to your customers’ specific needs.


    The following is a list of considerations and questions to get you started:


    +   - What are the overarching company goals set by leadership?

    +   - How do these goals translate to specific product objectives?

    +   - What is the long-term vision for the product?

    +   - How does this vision align with company goals and market needs?

    +   - How have the key pain points in your market evolved over time?

    +   - What trends are emerging?

    +   - How are your primary competitors positioning their AI products?

    +   - What AI features or capabilities differentiate your product from theirs?

    +   - What specific needs do your target customers have?

    +   - Are there other segments in your customer base for more tailored solutions?

    +   - What recent articles or reports can you use to source trends in your industry?

    +   - Which will you be checking regularly to maintain a pulse on your market?

    +   - How can insights from these reports inform your product strategy?

    +   - How will you communicate your product vision and benefits to stakeholders?

    +   - What messaging will resonate best with your target customers or segmented
    customers?

    +   - How will you make sure there is alignment between the product marketing
    and development teams?

    +   - Which recurring meetings, channels, or methods will you set up to make sure
    communication lines stay open?

    +   - What is your go-to-market strategy for launching the product?

    +   - How can you encourage creativity and the exploration of new ideas and innovations
    within your team?


    For deeper discussions about product strategy, feel free to refer to Chapter 10,
    where we expand on performance benchmarking and metrics that align with your product
    strategy. You can also jump ahead to Chapter 14, where we discuss product strategy
    in the context of evolving traditional software products into AI products.


    Now that we’ve spent some time seeing how to best position a product for your
    market and the considerations of building an AI strategy that serves the customers
    you’re trying to attract, we can take a look at some of the most popular verticals
    for AI. Each vertical will have a series of popular use cases that we see time
    and again, and this can shed light on some of the greatest benefits AI can give
    certain verticals.'
  merge: -1
  img_proc: true
- pgno: 210
  md: '# Verticals — examination of some key domains


    We discussed general domains in understanding how AI is to be oriented in your
    chosen domain in the previous section. In this section, we will be looking at
    a few key verticals – that is, fintech, healthcare, marketing, manufacturing,
    education, and cybersecurity – that have seen increased AI adoption in order to
    best demonstrate trends within major areas of AI development through these examples.
    Getting an understanding of how and why AI was adopted in these verticals can
    give us promising insights into how AI can be applied in other domains as well.
    Let’s explore the adoption of AI in these key verticals.


    # Fintech


    Perhaps the swiftest and most substantial AI transformation has been in the fintech
    space, and it’s not surprising to see why. AI applied to specific use cases can
    bring about significant revenues saved or generated when done right. According
    to a recent report by UnivDatos Market Insights, “The AI in Fintech Market is
    expected to grow at a steady rate of around 30% owing to the increasing demand
    for fraud detection, virtual helpers coupled with easy transactions, and chatbots
    for quick and instant query solutions.”


    Let’s take a look at some of the most compelling use cases of AI for the fintech
    space that have contributed to its quick adoption.


    # Chatbots and virtual assistants


    Chatbots or conversational AIs use natural language processing (NLP) to handle
    customer service through what’s referred to as sentiment analysis. Particularly
    now, as LLMs and APIs that connect to them are becoming more prevalent, these
    capabilities are becoming even more accessible. These language models are used
    to find patterns in what end users are asking for to inform things such as a centralized
    knowledge base, a frequently asked questions page, or to help the company understand
    more about their customers and what they’re looking for in the form of customer
    surveys. Where ML and deep learning work with data points, in NLP, the data points
    are the words themselves and it’s their orientation and arrangement that gets
    optimized.


    Players in the fintech space are able to use chatbots to also optimize for other
    things, such as customer feedback with their fintech apps, process automation,
    and reducing wait times. They’re also great for capturing generational sentiments,
    such as not wanting to jump on a quick call, something that’s increasingly prioritized
    by the younger generations, who prefer to interact with a brand digitally. bank
    of america (boa) has seen massive success with its chatbot, Erica, and plans to
    increase its AI capabilities because of how accessible Erica has been to its users.
    Erica can assist users with tasks like managing accounts, tracking spending, and
    providing personalized financial advice. Launched in 2018, Erica has surpassed
    1 billion interactions and helped BoA spike earnings by 19% since the launch.
    Over 32 million clients have benefitted from Erica’s insights and notifications.
    Other examples include Cleo, which uses chatbots to help customers analyze spending
    habits and provide financial insights, and Sage’s Accounting Chatbot, which helps
    customers using its accounting software with financial queries and tasks.'
  merge: -1
  img_proc: true
- pgno: 211
  md: 'Though the upsides can be significant, chatbots can have their limitations.
    Potential miscommunications due to language nuances can cause frustration with
    customers. Though chatbots’ 24/7 availability is certainly helpful in a pinch,
    they’re reliant on predefined scripts, which makes complex queries hard for them
    to service. This has given rise to AI-powered virtual assistants, which are essentially
    chatbots powered by generative AI models that work in conjunction with NLP models.


    # Fraud detection


    This is a big one, particularly because so many financial institutions are left
    with a risk when there is fraudulent activity on an account. Therefore, it makes
    sense that one of the primary use cases for AI that caught on heavily within fintech
    has to do with catching fraud more efficiently. In this use case, AI is used for
    anomaly detection within accounts so that banks and other financial institutions
    can be alerted faster when activity that’s outside an existing customer’s pattern
    of behavior is identified. This is also used for money laundering and other illegal
    activities.


    **Fraud detection** as a use case isn’t quite as straightforward as building a
    chatbot because there are likely multiple layers of AI tools working together
    to make it happen. It’s more likely to be a combination of things:


    +   - First, some version of continuous data mining is at play to discover whether
    there are overarching, easy-to-detect patterns in the customer data.

    +   - There’s also likely to be a rules-based system that’s used to mine as it’s
    scouring the data and looking for anomalies.

    +   - On top of this, there are likely unsupervised ML models used to look for
    patterns beyond the mining and to group activities into clusters to be analyzed
    later.

    +   - There are often neural networks used as well to learn from established suspicious
    patterns that do turn out to be fraudulent.


    Because of the level of sophistication that’s out there now in the cybersecurity
    space, fraud can come from multiple sources. Fraud can come from a customer themselves,
    someone impersonating them, an adversarial bot attack, phishing attacks, and other
    scams. Fintech institutions need to find a way to address all these potential
    cybercrimes through the help of various layers of AI. Setting up this kind of
    in-depth operation is expensive, but the cost to run a system like that is nothing
    in the face of the $51M fintech loses to fraud every year. With regard to fraud
    detection, there are also temporal qualities to it, so fintech often looks at
    finding fraud that has occurred, finding fraud as it’s occurring, and finding
    and stopping fraud before it happens.


    Companies like PayPal use AI for fraud detection by leveraging ML, DL, and graph
    technologies to analyze transaction patterns and detect anomalies that could indicate
    fraud. Mastercard uses predictive analytics, ML, and a proprietary recurrent neural
    network in their decision intelligence capabilities to assess risk levels of transactions
    in real time. Zest AI uses ML and advanced analytics to enhance their credit risk
    and fraud detection capabilities for lending.'
  merge: -1
  img_proc: true
- pgno: 212
  md: 'Though companies using AI for fraud detection are able to save on potential
    losses, there are challenges with these applications as well. Balancing false
    positives with false negatives is a constant battle. Favoring false positives
    could mean leaving customers frustrated when they make real purchases and favoring
    false negatives means they would have to spend more money on recuperating costs.
    Also, as fraudsters get smarter with new, evolving fraud tactics, businesses need
    to constantly adapt to match their evolved skills.


    # Algorithmic trading and predictive analytics


    AI is helpful when it comes to the fast trading speeds and improving accuracy
    that’s needed to compete with things such as **high-frequency trading (HFT)**.
    ML models are used to effectively predict market movements more quickly to help
    algorithms make their bids, anticipate the best times in the day to make trades,
    and use historical data for prediction models to understand when the prices might
    go up. Apart from the main motivator being to make better, more fortuitous trades
    for their customers, another big driver of the adoption of this AI use case is
    that algorithmic trading also helps limit mistakes coming from emotional or psychologically
    stressed traders to limit trade volatility.


    Though algorithmic trading relies on a set of instructions to execute decisions,
    and there are a number of solutions out there that do just that, the underlying
    technology that supports it is based on predictive analytics. Fintech players
    are able to crunch so much data and they’re so committed to improving their ML
    models that even small percentages of improvement in their accuracy or precision
    could result in millions of dollars of saved revenue or maximized profits. Whether
    they’re a start-up that’s looking to convert a lead or a bank that’s looking to
    offer a loan based on a credit score, fintech is using predictive analytics to
    constantly learn from new and historical data to power most of their decisions
    so that they know how much a potential customer transaction is worth to them in
    the long run.


    Companies like Goldman Sachs use ML and DL to analyze vast amounts of market data
    to identify trading opportunities, find optimizations in trading strategies, and
    predict stock price movements. AQR Capital Management uses machine learning and
    quantitative analysis to optimize portfolio construction, manage its investment
    risks, and assess the value of various investment factors. Citadel Securities
    recently partnered with Google Cloud to optimize their quantitative research technology
    platform, which uses ML, advanced analytics, and time series analysis to inform
    real-time trading decisions and manage risks as well.


    Though leveraging AI for algorithmic trading and prediction is beneficial, managing
    data quality standards from disparate data sources is a constant challenge. All
    models have their limitations and this is especially true with unpredictable financial
    markets that are often responsive to unforeseen events and the chaos of the real
    world. The speed of market changes requires model adaptation that’s frequent and
    rapid to adjust to a changing landscape. Financial institutions leveraging AI/ML
    in this way need to remain competitive and innovate constantly to keep an edge
    in this highly crowded space.'
  merge: -1
  img_proc: true
