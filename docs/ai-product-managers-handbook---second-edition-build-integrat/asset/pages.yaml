- pgno: 444
  md: 'Anticipate how you’ll grow and change in order to build a roadmap for your
    own career maturity, but remember what makes you you too. Think about the aspects
    of the role that you really love and feel you’re best suited for. While it’s nice
    to be consistently striving to grow and challenge ourselves, I believe our deepest
    strength comes from knowing ourselves and what we truly value. Only then can we
    attract opportunities that resonate deeply with who we are and the kind of work
    we want to do in the world. If I were to think about the aspects of the role that
    align most with me, my interests, and my skill set, my favorites would be *visionary,
    motivator, customer advocate, strategist, and conflict resolver.*


    I feel useful and appreciated when I’m translating a product vision through different
    manifestations, channels, and discussions and aligning it with the company’s mission.
    It feels meaningful to me to help motivate others back toward a core purpose and
    focus on what will make the biggest impact on customers and users. I feel a deep
    sense of purpose when I can successfully resolve conflicts that can keep product
    teams from doing their best work. As an AI PM, it’s important to me that I build
    a career that makes me feel useful, appreciated, meaningful, and purpose-driven.
    Find the combination of factors that feels right for you and do your own exercise
    to understand what values and considerations you want to build into your career
    trajectory.


    # Summary


    Remember that “good” is in the eye of the beholder. All AI PMs will be subject
    to the context they find themselves in. Your direct manager, leadership team,
    corporate culture, and peer relationships will all have an impact on how your
    work is being seen. Everything we’ve discussed in this chapter is to be taken
    as a form of best practice. We can’t be all things to all people, and if one were
    to take care of every aspect discussed in this chapter, they could find themselves
    in an unsustainable work situation. Rather than taking exhaustive actions to wear
    every “hat,” it’s best to think in terms of systems. What systems can you put
    in place so that you’re at least covering some aspect of each AI PM “hat” with
    some regularity? Remember, it’s a hedge, not a guarantee.


    Building structure and systems around your work isn’t about setting up dogmatic
    rules, it’s about creating healthy boundaries so that we don’t do too much and
    burn out. It’s much harder to come back from burnout than it is to avoid it altogether,
    so be gentle with yourself as much as you can. You’re balancing the wills, intentions,
    frustrations, and conflicts of many people, all at once, in the AI PM role. If
    you’re not careful, you could find yourself with problems coming from all corners.
    But you can set up guardrails and boundaries in a way that feels supportive. You’ll
    find yourself enjoying all the gifts this career has to offer you for years as
    a result.


    In the next chapter, we will explore what maturity and growth look like in the
    AI PM career path.'
