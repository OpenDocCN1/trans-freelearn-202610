- pgno: 305
  md: '# 12


    # The Rising Tide of AI


    With this chapter, we begin the third part of this book, which will focus on evolving
    existing products that don’t currently use machine learning (ML) to leverage artificial
    intelligence (AI). We will refer to these products as non-AI-nnative products.
    In the previous part, we explored how to go about building an AI native product
    and how the process unfolds in a way that’s optimal from a data, company, and
    strategy perspective. Using this same lens, we will now compare and contrast how
    this process unfolds for products that don’t currently leverage AI.


    More specifically, this chapter will re-introduce us to the concept of the Fourth
    Industrial Revolution. It will serve as a reminder and a blueprint for those of
    us working as entrepreneurs or PMs for products and organizations that are ready
    to fully embrace AI. Because this chapter introduces Part 3 of this book, which
    focuses on integrating AI into traditional software products, it serves as a good
    reminder of what companies stand to gain. We will be reinforcing the importance
    of the coming shift toward AI and what it means across industries. For those who
    are already at a place where they can embrace AI, I hope to offer a plan you can
    be confident in as you move forward toward evangelizing AI in their products and
    wider organizations. For those who are still skeptical, I hope it galvanizes you
    and offers a clear vision of what’s to come so that you can start the work needed
    to prepare for such a shift. For those who are AI skeptical, I hope to offer a
    glimpse into what a future without AI adoption looks like for your company’s success.


    As we continue in this chapter, the first section will go into what the AI evolution
    will mean to businesses and products in order to best communicate the competitive
    advantage of embracing AI at the industry level. We will then go over accessible
    options for adopting AI for companies looking to capitalize on the AI adoption
    wave in the second section. The final section will focus on the mindset and attitude
    for AI adoption at the PM level, as well as how PMs can communicate AI adoption
    across their organizations. I’m honored to be a part of this journey with you,
    and I hope the coming words offer you solace in a landscape of misinformation
    and disinformation when it comes to AI and its adoption.'
