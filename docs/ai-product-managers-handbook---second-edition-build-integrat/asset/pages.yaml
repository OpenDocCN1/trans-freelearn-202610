- pgno: 424
  md: 'We will finish with a contextualized example of the areas above with our case
    study example, as well as with a summary of the chapter, as always. The path of
    an AI PM is challenging but rewarding. Anyone can build a successful, lengthy
    career as an AI PM, because it’s a professional area that will see more growth
    as we expand with AI proliferation, if they are willing to apply themselves in
    service to their products, markets, and organizations.


    As we saw in Chapter 17, the current landscape of AI PMs tends to fit a profile.
    But it’s my hope that books like this one will inspire you to break into the field
    even if you don’t fit this stereotype and enrich the role with your own unique
    blend of experiences and values. Anyone can do it if they want it enough, and
    that means you can too. If reading that gives you pause, because deep down you
    don’t feel you have what it takes, I challenge you to contradict that side of
    yourself. We all deserve to build careers around what lights us up and inspires
    us. If working as an AI PM makes you feel excited and inspired, or if it simply
    sounds like a good way to make a living, that will drive you to find success.
    For those of you who aren’t so sure, the rest of the chapter may very well dissuade
    you. That’s OK and valuable too! It’s better to make informed decisions than to
    never try at all because of imposter syndrome.


    # A job family of many hats


    In this section, we will explore the many practical stressors and expectations
    of an AI PM based on the competencies we introduced in Chapter 17: technical proficiency,
    business acumen, communication, leadership, and problem solving. I will be using
    an umbrella for each of these five competencies to keep this section digestible,
    but you’ll notice a long list of hats under each one. We can think of each competency
    as a concentration of skills and responsibilities and not just as standalone skills.
    Let’s get started!


    Remember that listing these competencies isn’t about promoting excellence in each
    one, but rather is being done to demonstrate the full range of skill sets and
    competencies you can explore as you grow and mature into your AI PM career.


    # Technical proficiency


    An AI PM’s technical proficiency encapsulates various roles that are important
    when aligning AI capabilities with business goals, ensuring responsible data usage,
    and maintaining high quality across their product. The AI PM leverages technical
    insights to solve real-world problems and documents that work to track its impact
    on the business. Ongoing learning through academic degrees, certifications, and
    bootcamps can help AI PMs stay updated on evolving technologies and ML models
    and they can in turn translate complex AI concepts for non-technical audiences
    and create accessibility through workshops and communications. Technical proficiency
    isn’t just limited to ML models but extends to areas like data management, product
    quality control, and data analytics, as AI PMs need to make sure the data used
    in their AI systems, the performance of their products, and usage patterns from
    their users and customers are all supporting their products.'
