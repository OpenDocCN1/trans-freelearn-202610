- pgno: 153
  md: '# Phase 2 — Data management


    Once you have a clear idea of what you''re building and why, you invest in setting
    up your product for success. Throughout this book, we refer to AI, ML, and deep
    learning (DL) products, but it''s important to remember the original colloquialism
    for any of these products is this: data product. At its core, any product that
    leverages AI/ML in any way is a data product first, and no data product can be
    good at anything without lots of quality, clean data. Organizing and expanding
    on the infrastructure needed to support all your data is the first applied step
    post-ideation. You''ll want to understand the requirements, constraints, and vocabulary
    required for a system that supports the data gathering and data processing that
    will be required to make your AI product function properly because you''ll be
    central in helping make decisions about this.


    In this phase, you''re also defining the best features to use in your AI/ML models.
    We discussed feature engineering in previous chapters. As a refresher, this is
    the idea that you''re looking for facets or features in your dataset that you''re
    primarily going to use for training your model. You can think of features as the
    individual columns of data elements that will be most important to include in
    your model preparation and training. You won''t want to leave this up to your
    data scientists, engineers, and architects either. As a PM, you''ll want to be
    intimately involved with and understand the various features that will be selected
    as the most relevant and final inputs in training the models that will make up
    your product.


    Once that''s been decided, this is the phase where the data pipelines to support
    this data feed will be put in place. Having a good grasp on how you''re setting
    your organization and product up for sound data collection and preparation, data
    storage, and data pipeline practices will be crucial in this step as well. These
    data practices will allow you to leverage data for internal use cases and traditional
    analytics, and they will also serve as the true foundation of your AI product.
    While there will often be a data team handling these considerations, it is important
    for AI PMs to have an understanding of how these decisions impact the efficacy
    and cost of their products from a resource management and planning perspective.


    By the end of this phase, you should be able to answer the following questions:


    +   - **What kinds of data do we need to make this MVP successful?**

    +     Identify the types of data required for training and model development to
    make sure the models you eventually choose will be set up for high performance
    and accuracy.

    +   - **Are there infrastructure needs that your organization doesn''t currently
    invest in to support the success of this MVP?**

    +     Ensure data pipelines and storage solutions at the organization are sufficient
    to handle the volume and variety of data your MVP will need to be properly supported.
    Which constraints or limitations affect your data infrastructure?'
