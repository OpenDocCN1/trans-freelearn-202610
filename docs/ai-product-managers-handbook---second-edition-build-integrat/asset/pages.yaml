- pgno: 373
  md: 'When we think of AI adoption, most people would appreciate it if AI took on
    aspects of our everyday lives that we actually *don’t* want to do. The above quote
    encompasses this sentiment most elegantly, and it’s in the spirit of Joanna Maciejewska’s
    quote that we consider how to best think about what value AI may bring to our
    product. Do the proposed AI features we want to incorporate help people feel like
    they’re being helped and supported with the drudgery of their days or workflows?
    Because if not, that feature likely isn’t bringing in that much value. In the
    following sections, let’s take a look at some of the most impactful ways AI can
    be integrated into a traditional software product and how that might impact your
    product design.


    # Decisions and insights


    Because you’ll likely need a lot of data to run your AI systems, that will mean
    that you’ll be gathering enough data to offer significant insights that will impact
    the decision-making being done on the customer end. If you have enough data to
    run an AI system, you have enough data to find patterns in it and help your users
    make decisions in a way that’s more informed. Analyzing habits, predicting future
    states, offering recommendations, or forecasting future costs and trends is a
    way to use insights collected from your users’ data that are meaningful to them.
    You can do this at the local level, by analyzing the data at each user level,
    or you can append this data to external data sources.


    From a product design perspective, this gives you many options to choose from
    when it comes to reimagining your product experience. You can build interfaces
    and experiences around your product that demonstrate to your users that you are
    learning from their behaviors and preferences. Not only that, but you’re using
    that information to in turn help them with their own decision-making through dynamic
    interfaces, visualizations, and dashboards. For example, Salesforce integrated
    AI into its existing **customer relationship management (CRM)** platform through
    Einstein AI, which helps users working in sales to make decisions more effectively.
    Einstein AI allows users to receive predictive insights about sales opportunities,
    customer behavior, and marketing campaigns so they can prioritize leads and forecast
    deal closures more effectively.


    By giving users and customers the control and flexibility to understand more about
    themselves, their environment, or their peer group, you’re showing them that they
    can trust in the product experience you’re crafting for them. We don’t look at
    trends, insights, and forecasts in a void. We care about these things because
    more knowledge empowers us to make better decisions in the moment. If your product
    can show even one user that they’re better prepared in an uncertain world with
    your product in their arsenal of tools, you can win their loyalty. If you can
    do that in a way that presents decision-making and insights in a filtered, digestible
    format, you can win their admiration.


    The key considerations for ensuring that you have enough insights for effective
    decision-making for product design are:


    +   - **User personas:** Build personas around insights that assist decision-making
    for different sets of users. Not all users will appreciate the same insights.
    Perhaps some users want more in-depth data while others want more high-level trends.
    Find what is most valuable to your users and tailor insights that are contextually
    relevant and actionable.'
  merge: -1
  img_proc: true
- pgno: 374
  md: '+   - **Collaborative design:** Engage your internal stakeholders through workshops
    devoted to developing insights and analytics features to make sure you have holistic
    input on which insights would be most meaningful and how they should be presented
    to maximize user satisfaction and expectations.

    +   - **Testing:** Build mockups and prototypes of visualization and insight features
    to test with real users to make sure you''re getting feedback early. This will
    allow you to iterate more effectively and ensure final designs are relevant and
    user-friendly before a massive rollout.

    +   - **Continuous learning:** As you add more complexity with regard to data,
    insights, and functionality that informs decision-making, build training materials
    and onboarding resources that will help users understand how to interpret the
    insights and visualizations they see.


    # Automation and adaptability


    Automation is one of the easier AI features there are to work with. Taking considerable
    time away from an arduous task that someone no longer needs to perform themselves
    is a surefire way to demonstrate AI''s efficacy and value. In fact, automation
    is one of the aspects of AI that people think of first when they think of AI value
    because it can reduce so much cognitive load on users. But it''s often an over-amplified
    expectation that rarely plays out seamlessly in reality. So, if your product can
    offer a seamless automation experience, you''re already ahead of the curve.


    Automating a task that reduces time or cost delivers quite a lot of value already
    because it eases the burden on users. From a product design perspective, this
    means prioritizing features that have a direct impact on the usability and efficiency
    of your product. Automating in a way that enhances someone''s experience of your
    product and offers a superior user experience surprises those with the highest
    AI expectations and further contributes to user satisfaction and retention rates.
    Adapting your product experience in a way that learns from the snags that come
    up during automation will keep your customers engaged and anxious about your next
    release.


    For example, customer support software company Zendesk incorporated AI by adding
    a chatbot functionality into their platform called Answer Bot, which helped automate
    responses to common customer questions by learning from previous interactions
    and adaptations over time. Because it was able to learn from previous examples,
    it was able to evolve answers when new discoveries or considerations were uncovered.
    The automation reduced the need for routine and manual tasks and helped live agents
    focus on more pressing, complex customer issues.


    To ensure that you''re automating the right way, here are some questions you can
    ask of product design:


    +   - Which repetitive or time-consuming tasks that users frequently perform can
    be automated?

    +   - Which automations will not only save time but also improve the user journey?

    +   - What are all the data types and sources necessary for an automation feature?

    +   - How will automation features be designed intuitively and clearly for the
    user to understand and engage with?

    +   - How will users report issues or suggest improvements for automation features?'
