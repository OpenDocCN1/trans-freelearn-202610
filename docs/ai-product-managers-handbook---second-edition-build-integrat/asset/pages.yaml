- pgno: 122
  md: 'Previously, a Spanish fast fashion company, Zara, had the fastest turnaround
    time of 3 weeks for creating and delivering a collection. SHEIN brought that down
    to a new best-in-class of 3 days – a truly admirable use of AI and machine learning.
    Though it may be effective, this example is also a complicated one because it
    highlights the nature of AI''s effectiveness being in conflict with the world
    at large. Fast fashion already exacerbates environmental impacts and ethical concerns
    regarding the use of AI. Quick turnarounds and low costs lead to unsustainable
    practices, excessive waste, and poor labor conditions. But it''s important to
    remember that while AI can improve operational efficiency, and it certainly has
    for SHEIN, it doesn''t inherently address the fundamental problems fast fashion
    creates. In order to mitigate these concerns, it''s crucial for companies to use
    AI in conjunction with ethical and sustainable practices.


    Another company dominating a highly competitive ecosystem is Hugging Face, which
    not only brings machine learning code repositories, models, datasets, and web
    apps to demo AI-powered products to smaller companies, but it does that through
    an open source community. They''ve also recently partnered with AWS to offer their
    machine learning capabilities to their open source community as well, features
    that are otherwise only available to the AWS customers that can afford them. The
    proof of the feasibility of the company is in the funding; it raised over $235
    million in a series D round in August 2023.


    A dominant strategy is one that undercuts the competition in the market by getting
    the job done better and costing less. This is effective because it maximizes its
    rewards on both ends. It gets to receive the customers that want the job done
    better as well as the customers that just want to pay less. That''s quite a lot
    of the pie you''re winning. When done right, companies employing these strategies
    can essentially print money. But with great power comes great responsibility.
    There should always be a discussion about the tradeoff between ethics and financial
    success, and companies of all sizes need to remain vigilant about the impact they''re
    having on the world.


    # ## The disruptive strategy


    With a disruptive strategy, you''re still selling a product for less money, but
    it offers you less too. Who wants that? People who are overserved and bombarded
    with options, but who actually need relatively simple tools compared to the competing
    options they have to choose from. We can see no better example of that than Canva.
    You can edit photos and create anything from a social media post to a resume using
    Canva, and the tools to do so are incredibly user-friendly and simple.


    The Australian creativity platform leverages AI to offer customers more of the
    kinds of templates and content they''re looking for. They do this by using CNNs
    for image processing tasks like background removal and object recognition, transformer
    models like BERT and GPT for auto-generating design suggestions and extracting
    text from images, GANs for creating new design elements and enhancing image quality,
    and reinforcement learning for optimizing design recommendations and layout suggestions.
    While it offers less than Adobe''s Photoshop or the Microsoft Office suite, it
    does offer what its users are specifically looking for, and it''s either free
    or cheap to use.'
