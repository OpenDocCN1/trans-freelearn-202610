- pgno: 55
  md: 'You might also come across the term lakehouse. There are many databases, data
    warehouses, and data lakes out there. However, the only lakehouse we’re aware
    of has been popularized by a company called Databricks, which offers something
    like a data lake but with some of the capabilities you get with data warehouses,
    namely, the ability to showcase data, make it available and ingestible for non-technical
    internal users, and create dashboards with it. The biggest advantage here is that
    you’re storing it and paying for the data to be stored upfront with the ability
    to access and manipulate it downstream.


    # Data pipelines


    Regardless of the tech you use to maintain and store your data, you’re still going
    to need to put up pipelines to make sure your data is moving, that your dashboards
    are refreshing as readily as your business requires, and that data is flowing
    the way it needs to. There are also multiple ways of processing and passing data.
    You might be doing it in batches (batch processing) for large amounts of data
    being moved at various intervals, or in real-time pipelines for getting data in
    real time as soon as it’s generated. If you’re looking to leverage predictive
    analytics, enable reporting, or have a system in place to move, process, and store
    data, a data pipeline will likely be enough. However, depending on what your data
    is doing and how much transformation is required, you’ll likely be using both
    data pipelines and perhaps, more specifically, ETL pipelines:


    ![](img/a0c9f9a2ba06a06d309ce21d890a47c6_55_0.png)


    Figure 1.4: The ETL process (icons obtained from Flaticon.com)


    ETL stands for extract, transform, and load, so your data engineers are going
    to be creating specific pipelines for more advanced systems such as centralizing
    all your data into one place, adding data or data enrichment, connecting your
    data with CRM tools, or even transforming the data and adding structure to it
    between systems. The reason for this is that it’s a necessary step when using
    a data warehouse or database. If you’re exclusively using a data lake, you’ll
    have all the metadata you need to be able to analyze it and get your insights
    as you like. In most cases, if you’re working with an AI/ML product, you’re going
    to be working with a data engineer who will power the data flow needed to make
    your product a success because you’re likely using a relational database as well
    as a data warehouse. The analytics required to enable AI/ML features will most
    likely need to be powered by a data engineer who will focus on the ETL pipeline.'
