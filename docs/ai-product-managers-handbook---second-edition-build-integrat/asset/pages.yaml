- pgno: 459
  md: 'Whatever the result is, let it bring you closer to your professional community
    in whatever form makes the most sense for you. It could come in the form of a
    blog post, a LinkedIn post, a case study or article, a speaking engagement, or
    a presentation at a tech conference. Sharing your struggles and lessons learned
    from navigating the intricate landscape of AI is a real and tangible way you can
    contribute to your professional community. Even if you think your struggles are
    common, or that other AI PMs have had the same challenges, remember that no one
    else is you. Your unique perspective adds value. You never know when the hurdles
    you encounter could help others who are less far along the mountain. Sharing about
    your real lived experiences can create powerful connections between people that
    can potentially lead to new collaborations, work projects, or partnerships in
    the future.


    The following are some strategies and recommendations you can keep in mind as
    you’re building your AI PM career feedback loops:


    +   - Seek feedback from a broad range of stakeholders, mentors, and peers. Make
    sure to include data scientists, ML engineers, customers/end-users, team leads,
    and members of your leadership team who you respect and whose opinions you value.

    +   - Keep a record of the feedback you receive and the actions you’ve taken in
    response to that feedback. Document the insights and patterns you observe and
    reflect on how you’ve applied them in your work or career over time. Let this
    inform the career narrative you share with others and, most of all, with yourself.

    +   - Prioritize feedback that’s specific and actionable. Vague or subjective
    feedback can leave you with more questions than answers and can cloud your self-reflection
    as an AI PM.

    +   - Find the balance between confidence in your abilities and humility in recognizing
    areas of growth. Striving to maintain that balance will enhance your credibility
    and inspire others to openly engage with you when they struggle with it.

    +   - Treat feedback as a necessary part of your own AI PM career iteration and
    be genuinely grateful when others share their honesty with you.

    +   - Become an active member of AI and PM communities both online and offline
    to expand your feedback loop sphere of influence and look for ways to meaningfully
    add to the discourse.

    +   - Partner with peers or colleagues to co-author articles, white papers, or
    case studies that address challenges and innovations in the AI PM field.


    # What’s next? The world is our oyster


    The future holds a lot of promise for the AI PM career path. As we’ve gone through
    this chapter, we’ve discussed a lot of topics related to growing and maturing
    as an AI PM. While this is helpful to know, eventually it’s less about learning
    and more about choosing. Each of us is equipped with our own set of values, interests,
    and world views. As we get deeper into the AI integration of products, we’re going
    to start to see a lot of overlap in AI methodologies. Products will enter the
    market that employ a variety of AI models in a multidisciplinary way. We’ll experience
    more of a blur between analog reality and AI.'
  merge: -1
  img_proc: true
- pgno: 460
  md: 'My advice is to try not to deviate from products that you believe *should*
    exist in the world. Building ethical AI products and systems that are free from
    bias and harm, bringing forth products that are compliant with regulations and
    beneficial to the world, is a collective responsibility. Creating AI products
    and experiences that are human-centric means placing emphasis on user needs, and
    building AI in a way that’s intuitive, reliable, trustworthy, and beneficial has
    to be the way forward if we’re going to build a hopeful future.


    As we continue with the AI transformation, we’re in desperate need of leaders
    who will prove themselves to be responsible stewards of AI. As AI PMs, we want
    to be proud of the work we put forth into the world, particularly at this juncture,
    when so many legislative efforts are struggling to obtain the footing they need
    to properly rein in the unintended ill consequences of AI. At its heart, the AI
    PM role is about strategy, innovation, leadership, and inspiration. This generation
    of AI PMs is at the forefront of integrating AI into products that redefine how
    we live and work.


    We should use the influence we have to bring AI products to market that enhance
    human experiences, not diminish them. We have the privilege of addressing some
    of the most pressing challenges of our time through our work. We can harness the
    immense opportunity to build trust and bring real value to the world. AI is not
    just a technology that’s relegated to the ivory towers of the tech industry. The
    AI transformation is everywhere now, across industries, and AI PMs have the unique
    opportunity to lead this transformation. The world truly is our oyster.


    As I expand further into my own AI PM career, I want my next chapter to be focused
    on helping to build interpretive AI products that create personalized, equitable
    digital experiences. I want my work to focus on meaningful, empathetic product
    design that enhances human creativity and productivity. Imagine the possibilities:
    collaborating in a cross-functional innovation lab to experiment with AI capabilities,
    participating in AI ethics committees or AI policy shaping. By building AI-native
    frameworks that balance high-impact features with user-centric values, we can
    contribute to digital experiences that genuinely improve people’s lives. I’m committed
    to working on products that align with my values and passion, products I can put
    my whole heart into – what would you like to commit to?


    # Case study


    Astrid is an AI PM with over 20 years of experience in tech and she has successfully
    led several AI products in the healthcare, finance, and retail industries. She
    came into AI PM through prior roles in project management and **user experience
    (UX)** and her academic background is business management. Her strengths include
    a strong understanding of market dynamics, user needs, customer journey, budgeting,
    and business strategy, as well as leading cross-functional teams. After 20 years
    in the field, she’s more selective about the roles she takes on and she’s still
    learning and growing as an AI PM. Currently, she is the SVP of product at a tech
    company that specializes in various work optimization tools. In this example,
    we’re going to explore the actions Astrid might take, along with the impact of
    those actions, as she continues on her path down the AI PM rabbit hole.'
  merge: -1
  img_proc: true
- pgno: 461
  md: '# Projecting


    In the projecting phase of her career, Astrid is looking for ways to make a more
    meaningful impact on the world around her. She became clear about what kind of
    work she wanted to be doing as she matured as an AI PM and she was also able to
    find pathways to bring mentorship and wisdom to the next generation of AI PMs,
    such as the following:


    +   - **Cross-functional team building:**

    +     - **Action:** As Astrid rose up at her current organization, she built and
    led various cross-functional teams. She built a collaborative environment where
    data scientists, engineers, designers, and domain experts could work on pod teams
    with a concentration on product suites.

    +     - **Impact:** This established Astrid as a respected and competent product
    leader within her organization because it broke down previous silos that existed
    between development, AI teams, and domain experts. By focusing roles around product
    suites, these cross-functional teams could build group identities around their
    areas of focus.

    +   - **Developing a mentorship program:**

    +     - **Action:** Because her product organization had gotten so big by the
    time she was SVP, Astrid created a mentorship program to help junior PMs level
    up their skill sets and expose them to new areas of product they hadn’t worked
    in before.

    +     - **Impact:** This strengthened her product organization’s overall capabilities
    and collective skill set. It also gave the people who were starting to break into
    product on her team a way to cultivate and grow in their own career path.


    # Learning


    In the Learning – staying informed and inspired section earlier in this chapter,
    we focused on three main learning areas AI PMs can explore to deepen their knowledge
    in their field. Thought leadership, certifications and degrees, and professional
    development are all avenues you can take to keep your learner mindset active as
    you advance through your AI PM career. Let’s explore the actions taken and their
    impact as Astrid navigates her learning paths:


    +   - **AI upskilling:**

    +     - **Action:** Astrid had to supplement her AI knowledge by enrolling in
    advanced AI and machine learning courses through MOOCs like Coursera and edX.
    Courses included certifications in deep learning, reinforcement learning, and
    AI ethics. She completes a new one every two years.

    +     - **Impact:** As AI consistently evolves, Astrid keeps her technical knowledge
    relevant and fresh through her biannual learning. Even after 10 years, she still
    feels that there is more for her to learn and keeps it a priority in her professional
    life.'
  merge: -1
  img_proc: true
- pgno: 462
  md: '+   - **Establishing an AI innovation lab Action:** Given Astrid’s 10-year
    career, she’s been able to rise up within her organization and has been leading
    teams of PMs for the last several years. As a PM manager, she encourages her team
    to experiment with AI tools they’re unfamiliar with and learn new frameworks.
    She’s also created a process of developing MVPs for her team to test ideas from
    their AI innovation lab quickly.

    +   - **Impact:** This has led to a culture of innovation and experimentation
    within Astrid’s organization and team. It’s kept them agile and alert to new AI
    developments and trends to test out in their lab. It’s also created a lot of psychological
    safety for her PM organization. They trust her and feel she is a co-creator in
    their professional development and success. This has also encouraged a number
    of innovative new ideas and solutions that have positively contributed to the
    company’s revenue and user retention targets.


    # Networking


    Getting more comfortable with networking is an effective way of making sure you’re
    growing your ecosystem of peers, mentors, and potential collaborators. Careers
    need to be maintained with a consistent supply of social opportunities because
    our passions come alive in collaboration with others. Finding a way to network
    in a way that feels meaningful and authentic is a fine balance, but when done
    right, it’s well worth the effort. Let’s explore how Astrid found opportunities
    to network and expand her professional sphere:


    +   - **Remaining active in the AI conference circuit:**

    +     - **Action:** Astrid regularly attends AI conferences and has created a
    community of industry professionals she sees at conferences.

    +     - **Impact:** This has given her a strong sense of community and belonging
    within her career path. It’s helped her keep imposter syndrome at bay and it’s
    routinely inspired her as she catches up with people she’s known for over eight
    years now. In hard labor markets, this has contributed to a safety net for Astrid.
    She’s found multiple work opportunities over the years through her chosen AI PM
    family because she’s built trust with the people she’s met, consistently been
    present with others, built organic connections over time, and even spoken at these
    conferences several times.


    +   - **Building inspired partnerships through academic collaboration:**

    +     - **Action:** One day, Astrid went to an AI talk at one of her local universities
    and connected with a woman who served as head of professional partnerships at
    the university. Initially, they spoke about an internship program, but this led
    to the development of a strategic partnership where her AI innovation lab could
    collaborate with research teams at the university for special joint projects.

    +     - **Impact:** This gave the AI innovation lab at her organization the jet
    fuel they needed to discover new, unique ways of applying AI in a variety of product
    use cases. It created a funnel of new, emergent junior talent that was a cultural
    fit. The partnership also provided additional AI resources for complex projects
    when the engineering team needed it.'
  merge: -1
  img_proc: true
- pgno: 463
  md: '# Growing


    In the growing phase of your career maturity, you’re more focused on expanding
    your awareness. You look for opportunities to deepen your understanding of your
    AI specialization, how you want to grow professionally, and where there might
    be blind spots. Embracing challenges, reflecting, and expanding your feedback
    loops are all ways you can delve more fully into your own career. Astrid was able
    to deepen her involvement with the startup world and discover uncharted areas
    in AI ethics through the following actions:


    +   - **Working on a healthcare startup MVP:**

    +     - **Action:** Astrid helped ideate, developed, and shipped a predictive
    analytics tool for a healthcare startup that leveraged NLP to predict patient
    readmissions. She had never worked in the healthcare domain before this product
    and took on the role after going to an AI entrepreneurship happy hour where she
    met a startup founder who was looking for someone with her AI background.

    +     - **Impact:** After the product was launched, it was implemented in three
    of the hospitals in her area. She was able to positively impact her local community,
    improve patient outcomes for real people, and showcase her ability to apply her
    knowledge and expertise in a new domain space.

    +   - **Setting ethical AI standards:**

    +     - **Action:** Astrid spearheaded a new ethical AI standard of best practices
    for the product management, data science, machine learning, and development teams
    to follow when they’re working on AI products within her organization. The rollout
    also had an extension for non-technical teams to be able to flag AI ethics conflicts
    even when they’re not directly involved in a technical capacity. The guidelines
    she developed dealt with issues of fairness, bias, transparency, and accountability
    for all AI products.

    +     - **Impact:** Astrid was able to mitigate risks that could compromise her
    company’s brand through her investment in the ethical AI standard. She was able
    to support her team by creating infrastructure around ethics so that no one person
    felt solely responsible for ethical AI oversight. She was also able to make AI
    and its potential dangers more accessible to those who were non-technical within
    her organization. Model performance and fairness improved slightly for the AI
    products that were already released, which also enhanced customer and user trust.


    # What’s next?


    Astrid’s next major step is to find a way to combine many of the elements she’s
    touched on in various areas of her career into an entrepreneurial venture that
    can be her very own. Because of her work with the AI innovation lab, AI conference
    participation, and academic partnerships, Astrid decides to launch her own AI
    consultancy business. She realizes she already has a lot of contacts through the
    various talks and sessions she’s given over the years.'
  merge: -1
  img_proc: true
- pgno: 464
  md: 'She''s also worked collaboratively with academics and with the teams that participated
    in the lab. Astrid''s seen her fair share of project diversity and has learned
    a lot from building ethical AI standards at her own company.


    Because of her passion for improving patient outcomes, Astrid wants her consultancy
    business to focus on the healthcare sector. Working on the NLP-based MVP gave
    her a sense of confidence in her work, and she realizes there are many startups
    that she could help like this. Sometimes one experience can ignite a newfound
    sense of purpose. Working with startups allowed Astrid to open her horizons to
    new ways of empowering teams. She was used to more rigid, corporate environments
    prior to the MVP and hadn''t considered how valuable her work would be when applied
    to startups that could really benefit from her many years of experience.


    Overall, these various actions and impacts contributed to Astrid''s effectiveness
    as an AI PM leader in her field. First and foremost, it kept her engaged with
    learning and growing as a practitioner. But these collective actions also created
    pathways for others below her to learn and grow as well. She was able to keep
    her teams agile and inspired on a regular basis. Cross-functional teams learned
    to trust each other and this resulted in more inspired solutions to business problems.
    It also made everyone, including Astrid, more resilient. Astrid''s commitment
    to continuous learning, innovative leadership, ethical AI practices, team management,
    and strategy made her an AI PM success story. As a result, she''s been able to
    stay relevant and competitive in her field.


    # Summary


    We began this chapter by covering what growth looks like as you mature through
    various levels of AI PM maturity and saw a few different areas of learning as
    you advance through these stages. We covered the topic of effective networking
    and the role it plays in keeping a long career recharged. We finished with practices
    and habits that can provide sources of growth in the advanced stages.


    As we end this book, remember that reaching maturity in an AI PM career path isn''t
    just about becoming adept at the technicalities of AI products – from ideation
    to deployment; it''s also about developing the resilience, vision, and adaptability
    that will define you as a true leader in this evolving space. There will always
    be an ongoing dance between continuously sharpening your technical acumen and
    cultivating the skills you need to support successful and ethical product launches.
    The more you progress, the more challenges will feel less like barriers and more
    like pathways to deeper insights about your work and yourself.'
