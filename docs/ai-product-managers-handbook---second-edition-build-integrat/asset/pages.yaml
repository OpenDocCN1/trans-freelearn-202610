- pgno: 158
  md: '# AI/ML/data strategists/architects


    This will be more of a consultative role for most companies. Ideally, this person
    would help with the acquisition of talent, along with developing methodologies
    and workflows that would support your AI/ML function/team in its entirety. This
    might be a role that you hire for at the start of your AI/ML journey to help with
    key decisions about who to hire for various roles in your AI program or product
    team, what should be included in your tech stack, and how certain workflows should
    be set up with regard to experimentation and deployment.


    This may be someone who stays on for the planning and initial phases of your product
    development (first 6–8 months) or someone who you keep on staff as a PM in more
    resourced environments. This person will also ideally be well-versed in AI ethics
    principles. If you’re a start-up and you’re creating a company and a product from
    scratch, this might be your technical cofounder who is able to act as your technical
    decision-maker. This role could also be referred to as a data architect role.


    # Data engineer


    We have an architect for how the AI product/program team will function; now, we
    start laying down the foundations for our data pipelines with a data engineer
    based on the blueprint that’s come out of our collaboration with an AI strategist.
    If you’re setting up an AI product from scratch, look for a data engineer who
    can help support your team’s choices of data engineering philosophies. Note that
    this person should not be looking to the AI PM for the proper data setup. Rather,
    they will inform the AI PM about what various data engineering choices will mean
    for the AI MVP.


    Will you be using a data mesh, a data fabric, a data lake, or a data warehouse?
    As you’re starting this function from the beginning for an AI/ML native product,
    you’ll want to hire someone with the confidence and experience to help guide you
    with a proper setup. Migrating and changing your data architecture can be expensive
    and time-consuming. If you get the help you need properly at the beginning, it
    will save you potential headaches later and give you a sustainable, scalable infrastructure
    to grow with confidence.


    # Data analyst


    A path for many companies will be to build on an already established foundation
    of data analytics before they start expanding on those analytics with ML. The
    traditional order of operations is gaining clarity and control over your data
    by hiring amazing data analysts first who will quickly figure out what’s interesting
    and worth exploring in the data you already have. In this role, you’re looking
    for someone who’s able to quickly analyze your swathes of data with curiosity
    and exploration.


    This is the person who might be your expert query maker, working in concert with
    your data engineer to feed queries through the workflows you establish to power
    your AI/ML product. These will also be the hires that will improve on the analytics
    you use internally to improve internal processes as well as the analytics you
    pass on to your customers through your product or platform’s dashboard UI/UX.'
