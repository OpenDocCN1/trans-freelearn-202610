- pgno: 225
  md: '# 9


    # Product Design for the AI-Native Product


    So far, in Part 2 of this book, we’ve covered a lot of areas as they pertain to
    building and maintaining an AI-native product. But we still haven’t covered product
    design and the extent to which PMs should be well versed in design. In this chapter,
    we aim to do just that: understand the design elements that best set up a native
    AI product for success. We will go into design principles and the priority levels
    that are important to building any product, and we will home in on which of these
    elements will be important to focus on when you’re setting out to build an AI
    product natively from the ground up.


    Often, when we discuss the rise of AI, we imagine a world where a number of human
    tasks will be automated. This has left a lot of people wondering where our place
    as humans will fall among all the technological advancement that’s been going
    on, particularly in recent years. Not all product designers will know how to be
    product managers, but all product managers will have to have some understanding
    of design if they’re going to do their jobs effectively. Design is, perhaps, the
    most exciting and glamorous part of the discipline of product management, where
    function, creativity, and user experience converge. Solving complex, human-centered
    problems isn’t something that’s easy to automate, and your understanding of design
    will have a huge impact on your product.


    Designing a product isn’t just about being creative. It’s also about how you can
    craft an experience that not only makes the lives of your end users easier or
    more joyful but also communicates the value your product can give others in a
    meaningful way. Product design is psychological, interdisciplinary, and all-encompassing.
    It’s not just about making a product that works well from a utility standpoint;
    it’s also about building something that emotionally resonates with your end users
    and has them coming back for more. Throughout this chapter, we will:


    +   - Go over general product design foundations

    +   - Examine how those foundations are challenged when we throw AI into the mix

    +   - Learn how to use tools that help us balance design priorities

    +   - See how we can weave those priorities into the storytelling that accompanies
    our product'
