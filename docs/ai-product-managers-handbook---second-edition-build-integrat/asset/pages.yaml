- pgno: 46
  md: '# LLMs, NLP, GANs, and generative AI


    Just as “AI” is an umbrella term, “generative AI” follows suit. As you might have
    inferred from its name, generative AI is an area of AI that’s all about generating
    new content, whether that’s text, an image, or even code. The ML models that power
    generative AI are creating outputs that closely resemble the training data they
    learn from.


    When you think of generative AI, think primarily of advanced DL models; these
    can be grouped into three major categories:


    +   - **Latent variable models:** These models try to decipher hidden factors
    (latent variables) from the data they are given to train on. From the visible
    data they receive, they try to understand the determinants that are hidden in
    that data. Examples of latent variable models include **variational autoencoders
    (VAEs)** and **energy-based models (EBMs)**. Examples of tools that are made with
    these kinds of models include Artbreeder, NSynth (Google Magenta), AutoCAD’s Generative
    Design, and DeepLog. Netflix’s recommendation system is also partially supported
    by VAEs.

    +   - **Adversarial models:** These models work more like a game in that there
    are two adversarial models “fighting” in tandem to arrive at the best result.
    One model generates data while the other evaluates what it’s generating to ensure
    it’s worthy enough to offer as an output. Examples of adversarial models include
    **generative adversarial networks (GANs)** and adversarial EBMs. Examples of tools
    that are made with these kinds of models include DeepArt, Jukebox (OpenAI), Adobe
    Photoshop (Content-Aware Fill), DALL-E, GANimation, GameGAN (NVIDIA), FaceApp,
    and Prisma.

    +   - **Sequential models:** These models have gotten good at predicting outputs
    in a sequence and are able to use previous elements contextually. They’ve paved
    the way for long-form text generation because they are able to generate one step
    at a time by considering all that came before the output they’re trying to create.
    Examples of sequential models include autoregressive models, Transformer models,
    and diffusion models. Examples of tools that are made with these models include
    GPT models that power ChatGPT (OpenAI), Smart Compose (Google), MuseNet (OpenAI),
    PixelCNN, and Google Translate.


    One of the most famous generative AI models to reach the market, ChatGPT, which
    was trained by OpenAI, was only launched in November 2022 after almost a decade
    of work done by a massive open-source community of developers and scientists.
    Now that it’s been launched, many of the tech giants are trying to compete in
    the market with similar products. Even though they are struggling with creating
    something truly competitive given ChatGPT’s prevalence in the market, some competing
    products have emerged including Google’s Bard and Gemini, Microsoft’s Bing Chat,
    and Anthropic’s Claude and Mistral. Think about that for a moment: these models
    are so complex and require so much compute power and so much data that they’re
    a formidable challenge even for the kinds of tech companies that are wealthier
    than most countries’ GDP.'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'What makes these models special is that they’re DL models that are accessible
    to people with very little understanding of AI and deep tech. The reason for that
    is when they’re released to market, they are powered by prompts. This means you
    have to actually ask it a question or give it a “prompt” to get a result. Because
    of the quantity of data, most of which is written text, images, and web page content,
    they’re good at understanding both what someone is asking for and also what someone
    might want to read or see back. The process by which these DL models understand
    a question and generate a response is called **natural language processing (NLP)**.


    **Chatbots** or **conversational AIs** are computer programs designed to simulate
    human conversation. They use NLP to understand and respond to text or voice inputs
    from users. Think of them as virtual assistants that handle customer service tasks
    like answering questions, providing recommendations, or helping with customer
    support in different ways. NLP is made up of two components:


    +   - **Natural language generation (NLG)**: AI interprets and makes sense of
    the text or speech it receives by recognizing the meaning behind words, identifying
    known entities, and understanding the intent behind a user’s message.

    +   - **Natural language understanding (NLU)**: AI then crafts coherent and contextually
    appropriate responses, such as simple acknowledgments, more detailed instructions,
    or more in-depth information based on what it has understood using NLU.


    The models that harness this NLP capability are called LLMs. Most LLMs use a learning
    process that combines unsupervised, supervised, and reinforcement learning. In
    the case of ChatGPT, the model is pretrained on a massive dataset with unstructured
    data.


    For those interested in an example dataset used in the unsupervised pretraining
    step, feel free to explore one here: https://pile.eleuther.ai/.


    The stages involved are as follows:


    +   1. Its first stage is unsupervised learning.

    +   2. The next stage of its training process is supervised fine-tuning, in which
    it undergoes a corrective phase where a human reviewer steps in to tell it when
    it gets something right.

    +   3. In the final learning phase, it undergoes reinforcement learning so that
    a system of rewards is introduced into its feedback loop to further improve its
    performance.


    We will be going into further nuances about the relevance and details when it
    comes to generative AI models and the DL models that power them in later chapters
    of this book. But for now, this was a concise summary of the basics when it comes
    to generative AI. Before we discuss the optimal flow of the ML process, let’s
    see what it takes to succeed in AI.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# Succeeding in AI — how well-managed AI companies do infrastructure right


    It''s indicative of the complexity of ML systems that many large technology companies
    that depend heavily on ML have dedicated teams and platforms that focus on building,
    training, deploying, and maintaining ML models. The following are a few examples
    of options you can take when building an ML/AI program:


    +   - **OpenAI Platform from OpenAI:** OpenAI''s AI management platform encompasses
    tools and systems for developing, deploying, and managing AI models. This includes
    the training infrastructure, deployment pipelines, and monitoring systems they
    use to support the creation and operations of models like GPT-4 and other AI technologies
    they have.

    +   - **MLflow from Databricks:** MLflow is an open source platform developed
    by Databricks to help manage the complete ML life cycle for enterprises. It allows
    you to run experiences and work with any library, framework, or language. The
    main benefits are:

    +     - Experiment tracking allows you to see how your models are doing between
    experiments.

    +     - Model management helps you manage all versions of your model between teammates.

    +     - Model deployment gives you a quick view of deployment in the tool.

    +   - **TensorFlow Extended (TFX) from Google:** This is Google''s newest product
    built on TensorFlow and it''s an end-to-end platform for deploying production-level
    ML pipelines. It gives you the following benefits:

    +     - Collaboration within and between teams

    +     - Robust capabilities for scalable, high-performance environments

    +   - **Michelangelo from Uber:** Uber is a great example of a company creating
    their own ML management tool in-house for collaboration and deployment. Earlier,
    they were using disparate languages, models, and algorithms and had teams that
    were siloed. After they implemented Michelangelo, they were able to do the following:

    +     - Bring in varying skill sets and capabilities under one system.

    +     - Create, manage, predict, and deploy their data at scale using a reliable,
    recreatable, and standardized pipeline.

    +   - **FB Learner Flow from Meta:** Meta also created its own system for managing
    its numerous AI projects. Since ML is such a foundational part of its product,
    Meta needed a platform that would allow the following:

    +     - Every ML algorithm that was implemented once to have the ability to be
    reusable by someone else at a later date.

    +     - Every engineer to have the ability to write a training pipeline that can
    be reused.

    +     - Make model training easy and automated.

    +     - Everybody to have the ability to search past projects and experiments
    easily.'
