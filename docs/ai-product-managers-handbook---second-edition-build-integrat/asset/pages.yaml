- pgno: 79
  md: 'A quick note on neural networks: while training generative AI models will be
    a bit different considering the subject matter and purpose of your model, it will
    follow a similar process. You''re still going to put a premium on a clean and
    diverse data sample, you''re still going to be thoughtful about which neural network
    will work best for the performance you want, and you''re still going to need to
    account for (and optimize on) your loss function to the best of your ability.
    This process will continue through various loops of training and validating until
    you feel confident enough that your generative AI model will be able to generate
    new outputs based on the training examples you''ve given it. Your goal of tweaking
    hyperparameters for performance, minimizing loss where you can, and amassing enough
    data to set your model up for success remains the same as it does for other ML
    models.


    Once you have comprehensive, representative data that you''re training your models
    on, and you''ve trained those models enough times and adjusted those models accordingly
    to get the performance you''re seeking (and promising to customers), you''re ready
    to move forward!


    Now that we''ve gone over some of the major aspects of model training, we can
    move on to what deployment looks like. Keep in mind that the entire process of
    ideating your product, choosing the right model to employ in your product, and
    gauging the performance of that model based on your training efforts is a collaborative
    effort. That collaboration doesn''t end when you trained your models; it intensifies.
    This is because you''re now tasked with how exactly to integrate those models
    into the infrastructure of your product for your customers. Let''s get into that
    in the following section.


    # # Deployment – what happens after training?


    In *Chapter 1*, we discussed deployment strategies that can be used as you manage
    your AI/ML products in production. In this section, we''d like you to understand
    the avenues available from a DevOps perspective, where you will ultimately use
    and deploy the models in production outside of the training workspace or training
    environment itself. Perhaps you''re using something such as GitLab to manage the
    branches of your code repository for various applications of AI/ML in your product
    and experimenting there. However, once you are ready to make changes or update
    your models after retraining, you''ll push the new models into production regularly.
    This means you need a pipeline that can support this kind of experimentation,
    retraining, and deployment regularly. This section will primarily focus on the
    considerations after we place a finished ML model into production (a live environment)
    where it will be accessed by end users.


    How you manage these future deployments will vary widely depending on whether
    your AI/ML product offering is **business-to-business (B2B)** or **business-to-consumer
    (B2C)**:


    +   - If you''re managing a B2C product, you''ll likely make changes in phases
    and you''ll likely use the deployment strategies outlined in *Chapter 1*, to manage
    how your updated product is received and when certain groups of users will see
    the new updated models. This is just the nature of a B2C product: it''s one product
    going out to thousands, if not millions, of individual consumers, and your one
    product will mean many different things to individual users.

    +   - If your product is a B2B product, then you manage expectations often at
    the customer level. One customer might have a different experience with your AI/ML
    product than another. The models you use could also very well change from one
    customer to another because the data you''re using to train your models will be
    different from one customer to another.'
