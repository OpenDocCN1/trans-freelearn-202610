- pgno: 436
  md: 'That’s a lot of hats. There are likely many more that are missing from this
    list. Perhaps we can make this list longer for the third edition, at the risk
    of scaring off more curious, prospective AI PMs out there. Though this list is
    quite long, it adequately visualizes both the impact and the complexity of the
    AI PM role. It also highlights the important point we made in the last chapter:
    technical expertise does not make up the bulk of the role. I would consider it
    more of a prerequisite. Most of the items on this list are non-technical in nature.
    At its heart, the AI PM role is about critical thinking and people. Next, we will
    explore how we can use critical thinking and interpersonal relationships to excel
    in the AI PM role.


    One of the reasons AI PMs struggle the most within their roles is that others
    are often not aware of what they are doing in service to their products. We’d
    all like to live in a world where we’re rewarded and celebrated for the work we
    do without having to take on the burden of making it apparent to others.


    But we don’t live in that world. If you’re not able to visibly position the work
    you do, the day-to-day stressors and challenges of your higher-ups, leadership
    team, stakeholders, and professional network will blind them to your effectiveness.
    We try not to take this personally. But if we don’t understand this point, we
    may feel that we’re doing quite a lot without having the necessary support and
    recognition that will fuel us for the long haul. Navigating the core competencies
    and championing your contributions to the business through them will contribute
    most to your real and perceived success as an AI PM.


    These actions might seem overwhelming at first. But this reinforces the importance
    of structures in the day-to-day life of an AI PM. Organize activities that will
    make the biggest contribution to your real and perceived effectiveness as an AI
    PM into categories that are weekly, monthly, quarterly, and yearly. I’ve done
    my best to include how often you should be checking in with various teams and
    stakeholders in the bullets above, but ultimately the decision is yours. You know
    your leadership, GTM, and stakeholder teams best. Just remember it’s better to
    book time and decide you don’t need it later than to struggle to find time with
    people. Be proactive with the structures you set up in your AI PM role. Let these
    structures work for you. One of the major structures you’ll set up to enable success
    in your role is communication channels. We’ll explore what these look like next.


    # The AI whisperer and the role of communicating accessibly


    I can’t stress the role of making AI accessible to the various non-technical stakeholders
    you will work with enough, so this deserves its own section. As an AI PM, much
    of the product communication will fall directly on you. You may have large product
    teams at your organization, but that doesn’t mean this role won’t fall on you.
    Whether you work for a large or small company, despite the size of the product
    team you’re working in, if you are responsible for communicating your product
    vision, strategy, and roadmap to your organization, you will bear this burden.'
  merge: -1
  img_proc: true
