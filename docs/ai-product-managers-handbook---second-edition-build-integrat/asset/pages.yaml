- pgno: 396
  md: 'Because you''re supporting the evolution of an existing product, this means
    you''ll need to create an AI system around infrastructure that already exists
    as well. This means that one of the unique challenges will be understanding how
    to integrate your AI system into the current software, infrastructure, tools,
    and data pipelines you''ve already built so far. Finding **compatibility** between
    the new features you want to add and the current systems in a way that avoids
    or limits disruptions to your existing product experience will also be a challenge
    to the AI PM who''s evolving it into a traditional software product. This process
    of redesigning your product from a technical perspective to support your AI system
    will result in new workflows and automation to help you manage that system or,
    at least, to free up as much time as possible for those working on your product
    to work on things that matter most. You''ll need to think about training team
    members to work with those new workflows. At the very least, they''ll need to
    train on collaborative tools to help them all manage the work that needs to be
    done. Technically speaking, there''s a lot going on to support the ongoing work
    of evolving a traditional software product into an AI product.


    This work requires a strong partnership with engineering. AI PMs will not be solely
    responsible for doing this at any company because it''s outside of the scope of
    the role. However, AI PMs will need to be aware that this work needs to be done
    and should do their part in influencing and encouraging progress toward this work.
    While engineers will ultimately be doing all this work, it''s up to AI PMs to
    present the problem to be solved and the priorities of the work that needs to
    be done. AI PMs will organize and present the findings to all relevant stakeholders
    and leadership. The following are a few best practices you can use to better prepare
    your organization for the data and infrastructural needs of setting up an AI system:


    +   - Conduct a current state analysis to understand what limits and capabilities
    your current, established infrastructure has. The less you have to change initially,
    the better. Make efficiencies where you can.

    +   - Test your current infrastructure for scalability, particularly for computational
    and storage demands for supporting your proposed AI features.

    +   - Inventory your current data sources, tables, transformations, and pipelines.

    +   - Gather requirements or the data needs your proposed AI features will have
    and confirm that you have all the data you''ll need to support those feature requirements.
    If you have gaps in your data, create a plan for how you''ll fill them.

    +   - Leverage cloud services that are adjustable and flexible wherever you can.
    Most cloud services are charging you for real usage and this can be advantageous
    early on to help with fluctuations in storage, AI microservices, and processing
    power needs.

    +   - Build robust data pipelines for data collection, processing, storage, and
    mining.


    Being thoughtful about the data and infrastructural needs early on will make it
    so that you can better anticipate and maintain the needs of your AI system as
    time goes on. Remember that you''ll always be making incremental improvements.
    The work of maintaining your product and the AI system that powers it will be
    an ongoing effort. Particularly as you scale, you''ll be making necessary improvements
    to make sure your product is working as intended. Next, we''ll look at various
    aspects of maintenance that will be supplemental to the work you''re already doing
    in managing a traditional software product.'
