  md: 'Here are some accompanying questions:


    +   - Do you employ any scoring methods when assessing or prioritizing AI features?

    +   - Have you communicated to stakeholders what methods are used for prioritizing
    your product backlog, roadmap, or epics?

    +   - Are you considering the ethical implications and potential biases of features
    when assessing their priority?


    **Modeling:** The best way to get buy-in into a culture you’re helping create
    is by demonstrating it yourself first. When you’re in meetings with stakeholders,
    you set the standard for how you want those meetings to go. If you’re conducting
    a recurring meeting, workshop, or brainstorming session, find ways to embody the
    spirit of experimentation, curiosity, and commitment to your product. Even something
    as simple as admitting when you make a mistake or an assumption can go a long
    way. It shows you can still be capable and respected even if you’re sometimes
    wrong. In order to be an effective AI PM, you have to be a credible source of
    truth for your organization. You can’t foster credibility if you’re not practicing
    what you preach.


    Here are some accompanying questions:


    +   - Do you feel you’re in alignment with the cultural goals you’ve set for your
    product team?

    +   - Do you embody the values and strengths you ask for in others?

    +   - When was the last time you publicly admitted a mistake without shame?


    **Recognition:** Being an AI PM allows you a wide perspective into the contributors
    that most impact your product. As you allow more perspectives to influence your
    product, you’ll naturally start to see people showing dedication, consistency,
    and achievement. This is an opportunity to use your vantage point to recognize
    those contributions. It makes people feel appreciated and it helps others buy
    into the culture you’re trying to create. Just simply saying you promote a collaborative
    work culture isn’t the same thing as embodying that collaborative spirit and recognizing
    it in others. It also helps reinforce the idea that you say what you mean and
    you mean what you say, which is usually in short supply. Be timely about it. Recognize
    and celebrate your peers when their contributions are making an impact on your
    AI initiatives.


    Here are some accompanying questions:


    +   - Do you remember the last time you recognized someone else’s contribution
    to an AI project or feature publicly?

    +   - Do you remember the last time you were recognized for your work and how
    did it impact your motivation?

    +   - Can you incorporate recognition into your regular team meetings or communications
    to reinforce a culture of appreciation and gratitude?'
