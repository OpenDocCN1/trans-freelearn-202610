- pgno: 256
  md: '# KPIs and other metrics


    The previous section on north star metrics gave us some good examples of the variety
    of metrics we can track. This is an excellent way of grouping various KPIs you''re
    going to track, besides whichever you settle on for your north star metric, because
    the goal of metrics is to give us quick flashes of insight into the strength and
    success of your product. However, these numbers don''t stand alone. What good
    is it if your revenue is great but it''s only coming from two customers? What
    good is it if your customers install your product but never use it actively?


    Having a well-rounded assortment of KPIs is responsible. Doing your due diligence
    to explore the variety of ways your customers and users interact with your product
    will go a long way toward not only your product succeeding in delivering value
    to your customers but also educating your product organization on potential areas
    of improvement and expansion as far as product features are concerned. This is
    doubly true for an AI product, which may have fault lines that traditional software
    products don''t have. Using KPIs to track several behaviors and performance benchmarks
    is a way for you to keep the feedback loop between your customers and your product
    alive.


    > We refer to KPIs and metrics interchangeably in this chapter, but there is one
    crucial difference. A metric is more of a generalized term that applies to something
    that can be quantifiably measured. A KPI relates to something specific that can
    be tracked and measured against key business objectives. Not all your metrics
    will relate to your top-line business objectives, but all your KPIs will be metrics.
    The point of using these is to see where there needs to be new growth in the adoption
    of your product. Maybe your north star metric tracks well, but there are dips
    in your other KPIs. This is an indicator that there might be new product areas
    to focus on.


    The use of KPIs and other metrics is meant to serve as an early warning sign to
    PMs and leaders about the strength, success, and usability of their product, but
    beyond that, they also are meant to paint a narrative about why something isn''t
    going well. This is why the orchestration of your KPIs and metrics is such a thought-intensive
    process.


    You want to use your metrics to help you to troubleshoot problems that arise,
    such as a bug or an issue with a page, but you also want to use them to help discover
    areas of the product experience that are suboptimal. You want to understand whether
    there is a problem with how your product is being built but also whether there
    is a temporary problem with how the product is being deployed. Using an assortment
    of metrics to gauge the overall product experience is a best practice for AI PMs.
    The following is a list of many common KPIs and metrics you can consider, along
    with descriptions:


    +   - **Annual/monthly recurring revenue**: A measure of predictable revenues
    across a month or year

    +   - **Revenue growth**: The percentage of revenue growth compared to the previous
    period

    +   - **Paid users**: The number of all active subscribers/purchasers

    +   - **The average revenue per user**: All revenue divided by the number of total
    users

    +   - **Customer lifetime value (CLTV)**: The revenue generated by each customer
    acquired

    +   - **Customer acquisition costs (CAC)**: The total costs associated with marketing,
    sales, and advertising for each customer acquired'
  merge: -1
  img_proc: true
- pgno: 257
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 258
  md: '+   - **Referral rate:** The percentage of new customers who come from existing
    customer referrals

    +   - **App downloads:** Number of weekly or monthly app downloads and installations

    +   - **Customer engagement metrics:** Measures of depth of user interactions
    with the product, app, or website for things like time on site and bounce rate


    Establishing metrics that are specific and measurable is a given, but they also
    have to be highly relevant to be justified. Having a high number of unique visitors,
    sessions, or social media followers might look great for a while, but these markers
    don''t actually help you in the long run because they aren''t actionable. There''s
    nowhere to go with that information if those unique visitors arrive accidentally
    or leave because something''s wrong, if the sessions are accidents or clickbait,
    or if the social media followers are bots.


    You also may have heard the term “vanity metrics” before, and this is a point
    of caution for leaders and PMs alike. **Vanity metrics** are metrics that are
    flattering to the company but actually have no real basis for communicating real
    success or performance. They also don''t tell you what to improve on. Make sure
    any metrics you''re using, north star or otherwise, all provide the company with
    important insights.


    When you''re looking to establish metrics and KPIs, keep in mind the following
    questions:


    +   - How does this metric influence our business/product decisions?

    +   - What does this metric actually tell us about our product/customer behavior?

    +   - Does the data from this metric actually reflect reality?

    +   - Is this metric tied to a part of a specific process we can improve once
    we start measuring it?


    # OKRs and product strategy


    We introduced OKRs in *Chapter 6*. Let’s jog your memory – the idea behind **OKRs**
    is to tie certain results back to the overarching goals of the company or team.
    Usually, there are organizational OKRs, but individual teams and even individual
    people can also have them. OKRs consist of one objective that is aligned with
    various key results that reflect the attainment and success of that objective.
    They arise from a clear, defined goal and are matched with a series of success
    criteria to constitute the completion of that goal. You look at what you want
    to achieve and then you set guidelines for knowing when you’ve achieved it.


    All of this work of establishing a north star metric and relating it to other
    organizational metrics and KPIs serves your highest OKRs and, finally, your product
    strategy as a whole. All of this orchestration is part of the in-depth work that
    has to be done to align organizational growth with product success. Doing so not
    only reinforces the product team’s influence on and strategic input into the company
    but also aligns the entire organization with a high level of focus and alignment.


    Getting all teams committed and oriented toward certain organization-wide goals
    and tracking metrics that support those goals allow the company to be data-driven
    and also allow product teams to make data-driven decisions about how their products
    are used and how that impacts the overall bottom line. OKRs are meant to be ambitious,
    and they’re meant to stretch your organization or team’s capacity.'
  merge: -1
  img_proc: true
- pgno: 259
  md: 'Creating a measurable, metrics-driven product strategy is optimal, particularly
    for an AI product, because you need as much visibility as possible into your customers’
    experience of your product so that you know what to improve and optimize. Everything
    we’ve discussed so far – your product vision, your north star metric, your supporting
    KPIs and metrics, as well as your OKRs – should all support your overarching product
    strategy.


    We love the graphic presented by ProductPlan because it highlights this relationship
    between product vision and strategy, as well as how that strategy is then applied
    within the various supporting teams that drive the product forward. According
    to the *Product Strategy* blog published on the ProductPlan website, product strategy
    is high level. It’s a plan that describes what a business would like to accomplish
    with the product it’s building. The product becomes a vehicle for the business’s
    overarching goals. Because it’s a plan, it should address the personas and customer
    segments the product will serve, how it will benefit those segments, as well as
    the company’s goals for the product after development starts. The product strategy,
    which aligns with all the metrics we’ve covered in this chapter, influences how
    the product interacts with customers and internal teams within the business, how
    it’s built relative to competing products, and how it will relate to macro trends,
    with the aim of establishing a product roadmap. You can think of the product strategy
    as the overall plan, and the tracking, measurement, and improvement of the metrics
    and OKRs as the concrete, tangible way that you will implement that plan.


    In this section, we’ve covered a few of the key elements involved in building
    out a product strategy and how to measure the progress of that strategy. There
    are several options a company can take with this. The direction a company or product
    team takes is highly dependent on the organization’s goals, business model, market
    strategy, competitive landscape, and overall market conditions.


    Next, we will cover some of the elements of growth hacking so that an emerging
    AI/ML-native company or product can get early signals on whether its product is
    meeting its customers’ expectations, which will help lead to product-market fit
    and commercial success.


    # Hacking — product-led growth


    There is philosophical debate these days about whether companies should be marketing-led,
    sales-led, or product-led. Depending on where you are in the ecosystem of a company,
    you might have a bias for favoring your own designation. As PMs, we might have
    this bias as well, but if we take marketing- or sales-led growth to its natural
    conclusion, we might be faced with a predicament. Let’s look at these different
    perspectives for a moment:


    +   - **Marketing** crafts a message that might resonate beautifully with the
    audience, but might not actually align with what’s being built. Marketing-led
    growth focuses on driving business growth through marketing efforts like advertising,
    content creation, and branding. Attracting, nurturing, and converting leads into
    customers are the main focus. While this strategy may lead to quick brand awareness
    and attract customers, acquiring those customers could be costly, and it can make
    the business reliant on marketing spend for growth.'
  merge: -1
  img_proc: true
- pgno: 260
  md: '+   - **Sales** may line up the ideal marquee customers for a company to take
    on, but they will be forced to reactively dictate what product should be built
    based on a handful of customer preferences. Sales-led growth focuses on building
    dedicated teams to engage with leads through direct sales outreach, sales enablement,
    and relationship-building through networking and partnerships. Though this is
    an effective strategy for high-priced complex sales cycles, it is resource- and
    cost-intensive.

    +   - **Product-led growth** is about making the product itself the primary driver
    of acquisition, retention, and expansion by allowing users to experience the value
    of the product directly through freemium or trial models. The focus here is on
    empowering prospective customers and users through self-service, in-product experiences,
    product analytics, and customer feedback loops. Optimizing product experiences
    and investing in product development are significant associated costs, and this
    strategy might be too costly for products that need to be highly customized.


    The role of a product team is multifaceted and multidisciplinary, and their involvement
    with marketing and sales serves as an extension of their own work. A product can’t
    exist alone. If a product is built and no one hears about it or buys it, does
    it even exist? There has to be so much extensive work done on research, market
    analysis, and understanding the competitive landscape and the true needs of the
    market in order to ideate and build a product that stands a chance. Often, product
    management is at the nexus of these activities and is there from the very beginning.


    That isn’t to say that marketing and sales don’t also spend a considerable amount
    of time understanding the market. They do, but the product team contextualizes
    everything in a way that prioritizes what gets built and physically manifests
    something to promote and sell through marketing and sales. The ultimate goal of
    building a product strategy, choosing the optimal metrics and KPIs, and getting
    alignment from your leadership team and main stakeholders is to make your product
    successful – said in another way, to ultimately achieve **product market fit**.
    How does product-led growth relate to this?


    The best combination of factors is for the product function to take in feedback
    from the marketing and sales functions in an organization (among the many other
    sources of feedback), digest that information, and apply it to what’s being built.
    Then, once it’s gone through that wave, the product function sends out new communication
    and updates on how the messaging and the product can be improved and optimized.
    Ideally, this process will happen based on the product experience itself. The
    importance of fostering an environment that supports the pursuit of product-led
    growth within the business can’t be understated for AI/ML PMs.


    In a 2018 study by Epsilon, we can see that 80% of consumers are more likely to
    stick with a brand when it offers them a personalized experience. A more recent
    McKinsey study shows that 71% of consumers are starting to expect personalization,
    and 77% get frustrated when it doesn’t happen. The companies that do personalization
    well aren’t just delighting customer expectations, they’re growing 40% faster
    because of it. According to Forrester, “68% of B2B buyers prefer doing business
    online versus with a salesperson, and when they engage with sales, they want that
    experience to be in a more problem-solving, consultative manner.”'
