- pgno: 198
  md: '# Case study


    Building off our case study example from Chapter 6, in this chapter, we will be
    deepening our understanding of Waterbear and their flagship B2C product, Akeira,
    to better understand some of the principles outlined in this chapter and how they
    may appear in our working example. We will use the flowchart shown in Figure 7.1
    to inform how we break down this chapter’s principles in our case study example:


    ![](img/a0c9f9a2ba06a06d309ce21d890a47c6_198_0.png)


    Figure 7.2: Productizing basics for Akeira


    Here are the steps involved:


    +   - Scope: Here, the product is a B2C mobile application that uses natural language
    processing (NLP) to digest the data users feed into a dashboard that is used to
    track progress toward their established goals. End users can expect that the dashboard
    will be refreshed regularly, every time they make a new submission into the app.
    Waterbear currently offers Akeira to women over the age of 18, but it’s in the
    process of creating different use cases for girls under 18, boys under 18, men
    over 18, non-binary people under 18, and non-binary people over 18. Each will
    be a different product. Currently, their language models are training on each
    individual customer’s data, although they are testing a hybrid model that will
    merge smaller localized language models with training data from their entire customer
    pool.'
  merge: -1
  img_proc: true
- pgno: 199
  md: '+   - **Branding and packaging:** Although Waterbear does have one integrated
    blog, they plan to have separate brand identities based on the characters of their
    various products. Akeira is their flagship product and she is represented as a
    woman to mirror her intended user base. Because users are sharing personal information
    about their lives and emotional states with the app, Waterbear wanted to personalize
    the experience by building a personality and vibe around who Akeira is. Many of
    the end users of Akeira are Gen Z and Millennial women, so the feel, look, and
    sound of Akeira are palatable to that user group.

    +   - **Sales and delivery:** With Akeira and Waterbear, the delivery is through
    the app store on all major device carriers. Because it''s a consumer product that
    functions in a product-led organization, most of the sales come through marketing
    efforts, easy installation, ease of use, and customer satisfaction-based renewals.
    Akeira is powered through a subscription, which consumers pay a monthly fee for.

    +   - **Feedback:** Currently, Akeira has over 200,000 monthly active users and
    the only sustainable way for its product teams to manage customer feedback is
    predominately through in-app surveys. Their team of customer success specialists
    also responds to feedback online through social media sites, such as Reddit, TikTok,
    Instagram, Facebook, and X (formerly Twitter). Occasionally, they host pop-up
    events in major cities. All feedback is also fed through Waterbear''s NLP capabilities
    so that areas of continuous improvement and new features can be discovered. This
    is how they discovered new use cases and cohorts. Based on the feedback from their
    existing users and potential users who were not yet eligible, they discovered
    that there are significant user groups that would benefit immensely from their
    product.


    # Summary


    In this chapter, we learned that the act of productizing involves taking a concept,
    a service, or a piece of technology and developing it into a commercial product
    that''s suitable for the customers you''re looking to attract. As we''ve seen
    throughout the chapter, this work isn''t just a matter of getting your product
    up and running and creating a landing page for your potential customers to magically
    find. Productizing involves critically understanding the business model you''re
    working in and the ultimate audience you''re building for. Remember that AI products
    can be thought of as AI/ML services that are being built into traditional software
    products. This means that another big part of productizing for AI products involves
    the standardization and ritualization of the AI/ML service in a way that''s repeatable
    and predictable for the internal operations teams as well as the customers who
    will come to rely on your product.'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'If you''re able to understand your market, build internal structures to make
    sure there''s consistency with the outputs of your AI/ML pipelines, and communicate
    that consistency through your marketing efforts, as well as the ongoing performance
    of your product, you''ve successfully productized. But productizing may not be
    enough. Depending on the specifics of the market you''re serving, you might have
    to customize your product even further for specific use cases, verticals, customer
    segments, and other peer groups. Because AI/ML model performance is so dependent
    on training data, there might be collections of data that perform differently
    when run against one model. Further specialization might be in order. If you find
    this applies to your product and market, read on to Chapter 8, where we will build
    on the concept of customization.


