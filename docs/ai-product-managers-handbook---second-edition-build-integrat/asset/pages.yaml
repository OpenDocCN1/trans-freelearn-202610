  img_proc: true
- pgno: 329
  md: 'Building AI/ML products and upgrading traditional software products into AI
    products will be a continuous process of reinforcing their trustworthiness, reliability,
    and safety across multiple areas. It gives me confidence that these three prominent
    advisory organizations give ethical AI the importance it deserves as we continue
    to build the future with these powerful tools.


    # GenAI — immersive applications


    Another theme surrounds the rapid adoption and success of GenAI. Acquiring valuable
    lessons and putting them into practice with the power of GenAI causes pressure
    to prove ROI and demonstrate tangible value for organizations. I want to encourage
    you as AI PMs to follow suit in planning bold roadmaps for your products and avoiding
    distractions by prioritizing use cases that ultimately deliver real value to your
    customers, users, and internal stakeholders. But keep in mind that GenAI models
    have been democratized for only a few years. According to Forrester’s Q2 2024
    AI Pulse Survey, “49% of US generative AI decision makers said their organization
    expects ROI on AI investments within one to three years and 44% said within three
    to five years.”


    Because of the evolving nature of the AI technology landscape, long development
    cycles, and the resource intensity of building AI products, expecting true ROI
    within three or five years is still ambitious. AI PMs need to help their organizations
    balance the pressure to prove ROI with innovative, bold roadmaps that balance
    opportunities for short- and long-term ROI. Building a strategy around re-investing
    gains from features and capabilities that bring short-term ROI into longer-term
    projects is a great way to build on AI successes.


    McKinsey’s *Technology Trends Outlook 2024* report highlights GenAI and the context
    windows for LLMs, which grew from 100,000 to two million tokens. This means that
    as generative models are being adopted at record numbers, their ability to handle
    more and more complex prompts has scaled massively. Now we’re seeing LLMs grow
    from text summarization and image generation to more sophisticated capabilities
    through video, images, audio, and text. This means that as the capabilities of
    powerful GenAI models grow, they’re being integrated more aggressively into software
    tools and customer-facing applications.


    Generative AI apps had a great year from 2022 to 2023. Adoption was strong and
    the general public flocked to generative tools that flooded the market in efforts
    to take the new tech for a spin. Curiosity and experimentation were strong. But
    as we discovered from the open trials mentioned earlier, spurred on by the SAG-AFTRA
    strikes in 2023, 2024 was a more sobering year for GenAI. There are many more
    alongside the open legal battles mentioned. The list is quite long today. Most
    well-known GenAI companies are currently being sued, and for most of them, the
    issues lie with the creativity the models are training on themselves. Public perception
    of GenAI and its uses will continue to fluctuate as we grapple with the implications
    of having these powerful models have access to a multitude of human creativity.'
