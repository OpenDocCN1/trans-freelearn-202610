- pgno: 415
  md: 'Beyond educational and background diversity, we’re still starved for demographic
    diversity in AI product management. Generally, the tech field is still aggressively
    male-dominated. We’ve already seen issues with tech products (and physical products)
    being made by men for men. Increasing the representation of women alone could
    help product designs and launches be more inclusive and find more compelling market
    adoption that way. The goal of a PM is to craft product experiences and innovations
    that reflect the needs of a diverse group of users. Making steps toward bringing
    more women into AI PM roles is a way of achieving that.


    This is also the case with cultural, ethnic, location, and age diversity. If we
    can find a way to attract more types of people, with more perspectives into global
    markets or user preferences in a way that’s unexpected, it will make for an overall
    better product experience. Whether we admit it or not, we can all learn from one
    another. No one group has it all figured out. There’s inherent wisdom and knowledge
    in all demographic groups, and no matter what some people may think, we’re equals.
    Even the way we compete inspires us. An innovation that can come from a competing
    product, which might be due to the demographic or educational background of their
    PM, could be the thing that changes the industry as a whole. Little things can
    change everything at any given moment. This is doubly true when thinking about
    AI products. AI will continue to shape our future, and the more we can encourage
    diversity today, the more we can trust that we’re building future solutions with
    significant consequences that can benefit all members of society.


    # The importance of communities


    The fact that there is such a lack of diversity is one of the reasons why we have
    to rely on building strong communities. You never know how a job will go. Every
    role you say yes to is a gamble. Everyone has the ability to fall through the
    cracks, but once you do, is anyone there to catch you? Companies don’t operate
    the way they used to. Companies today have learned that they can hire many employees
    at once, and conduct massive hiring sprees where their needs can be met in the
    moment to match the market demand and funding they’re experiencing.


    But what happens when companies experience periods of downturn? They turn to one
    of the tried and true tricks of rebalancing their P&L: mass layoffs. Where I live,
    in NYC, it’s a cut-throat environment. The best of the best come here to live,
    work, and build their dream lives. Those who have strong professional networks
    can combat the repercussions of layoffs more easily than others who are more siloed,
    particularly if you’re building a career in tech, where layoffs are more common
    based on the demand for their products. Leaning on established communities is
    also a way to learn from others with more diverse backgrounds than yours.


    The stronger our networks, the greater the opportunities for growth, resources,
    knowledge, and new jobs. Once you start working in the industry, you can start
    to specialize in an area of AI or certain industry verticals because they become
    more familiar. The roles you start to look at might be dictated by the opportunities
    you take on early in your career. The market overwhelmingly rewards those who
    specialize because hiring managers are largely looking for a snug fit with their
    job description.'
  merge: -1
  img_proc: true
- pgno: 416
  md: 'For instance, if you build a career as a cybersecurity AI PM, you might find
    yourself taking future jobs in cybersecurity because you have the required number
    of years of that specialty for the next role. But what happens when you stop being
    curious about cybersecurity and want to branch out? You may find yourself succumbing
    to the inertia of the job market because it will reward you for staying in your
    given area of expertise. So leaning on professional communities is a way to stay
    employed, but it’s also a way to branch out into new areas altogether. Even if
    you’ve worked in one area for some time, you could meet others interested in a
    new specialization through your networks, and together you could work on a project
    to help break into a new vertical.


    As we get started in any particular job function, we also start to streamline
    the kind of work we do. For instance, if you start to specialize in LLMs and conversational
    AI products, you’ll find that you’re deepening your knowledge of LLMs but the
    knowledge you have of other types of ML models starts to wane. Maintaining involvement
    in communities is also a good way to have access to others who have a deeper knowledge
    of other areas of AI as you mature in your AI PM career. Being able to share insights
    about your work, learn from others, and share best practices and industry knowledge
    is a way of giving back to the community that’s supported you.


    Communities are also a great way to learn about new workshops, webinars, or training
    sessions that are more specialized or relevant to your particular area of work
    as well. Because the AI PM has to be learning on an ongoing basis, this is an
    effortless way of keeping your skills sharp and staying professionally social.
    Keeping up with your skills and staying competitive in your job family is important
    whether you’re on the search for a job or not. In some cases, I’ve even been able
    to lean on professional communities when I’ve looked for beta testers for an app
    I was building.


    The reality is that we never know what direction our career might take in the
    future. Perhaps some will get lucky and find a long-lasting, satisfying, stable
    career at a company that will stick with them through the long haul. Most will
    experience a shifting, volatile market. The exciting thing about this moment is
    that we’re going to see more advancements and innovations continue in the area
    of AI. Keeping up with new breakthroughs, use cases, and insights isn’t only going
    to help you future-proof your career, but it’s also going to allow you to be available
    when new developments arise that you want to be a part of.


    Finally, if you’re dead set on building a career as a PM, you’re going to very
    quickly find that it’s a thankless, demanding job. But that doesn’t mean that
    it’s not rewarding. And who knows, you may even work for an organization that
    passionately celebrates your contributions. But because the role is so multifaceted,
    eventually, you’re going to need emotional support. We can’t be all things all
    the time. Building a supportive community around you can help you prepare for
    the emotional struggles of being an AI PM. Building a network of peers you can
    trust around you can help you share experiences and build coping strategies for
    when things are going less than stellar. Managing stress, maintaining motivation,
    and celebrating successes will help make all the difference.


    Whether it’s emotional support, collaboration, skill building, networking, or
    knowledge sharing, communities play a vital role when you’re starting out your
    career as an AI PM (and beyond). Beyond this, it also teaches you not to see others
    as competitors. When you’re an active participant in contributing to your communities,
    you start to see that the whole is greater than the sum of its parts. This makes
    it harder to be jealous of anyone else’s success.'
