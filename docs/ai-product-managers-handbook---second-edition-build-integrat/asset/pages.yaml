- pgno: 176
  md: 'Other KPIs and visualizations would also be included in the dashboard. Here,
    you can think of things like a mood tracker, engagement levels on the app and
    how they correlate to your mood, self-care metrics with progress bars, visualizations
    relating to physical activity, a gratitude score to reflect areas where the end
    user can build appreciation for the areas of their lives that are going well,
    and a social tracker that would allow users a bird’s-eye view of their social
    health:


    ![](img/a0c9f9a2ba06a06d309ce21d890a47c6_176_0.png)


    *Figure 6.3: Akeira dashboard showing the available programs*


    The second toggle would be their established goals module that specifically covers
    goals that were established through the NLP models and confirmed by the user;
    these would be more specific in nature and tailored to the end user’s specific
    use of Akeira. Goals would have established success criteria so that once progress
    is made toward a goal, it can be recorded and celebrated as well.


    Finally, all these various metrics and KPIs would result in highly personalized
    insights for each end user for things like feedback display, prompts that encourage
    self-reflection, mindfulness, or even actions for physical and mental well-being.
    If the goal of an AI product is to deliver value through data, the app experience
