- pgno: 214
  md: '# Drug discovery and research


    Drug discovery and research have historically been notoriously time- and energy-consuming.
    A process that might have taken years or decades in the past can be sped up today
    with the help of AI. We all collectively saw AI applied in this way to address
    the COVID-19 pandemic and speed up vaccine discovery, and according to the National
    Library of Medicine, “AI is being successfully used in the identification of disease
    clusters, monitoring of cases, prediction of the future outbreaks, mortality risk,
    diagnosis of COVID-19, disease management by resource allocation, facilitating
    training, record maintenance and pattern recognition for studying the disease
    trend.”


    Companies like AbCellera use ML to predict binding affinity and to develop monoclonal
    antibodies in drug discovery. They analyze data from immune responses to identify
    potential antibody candidates based on sequences and structural information that
    can bind to proteins associated with various diseases. BenevolentAI uses ML to
    repurpose drugs by using historical data and biological insights to find new uses
    for existing drugs to help speed up the process of developing new solutions. They
    also use ML to identify novel drug targets by analyzing relationships between
    genres, proteins, and diseases, as well as to optimize clinical trials by identifying
    suitable patient populations. BioXcel Therapeutics is thriving in the drug discovery
    space by using their BioXcel AI platform to analyze genomic, proteomic, chemical,
    and clinical data to identify potential drug candidates by predicting their safety
    profiles and efficacy. They use DL to mine scientific literature, clinical trials,
    and biological databases to prioritize targets for future investigation for solutions
    to central nervous system disorders as well. They also use computer vision to
    analyze images of high-throughput screening to identify cellular responses and
    evaluate the effects of compounds on cell morphology for drug candidates.


    Challenges of AI applications in the drug discovery and research space relate
    to regulatory compliance issues since the regulatory landscape in AI drug development
    is still evolving; compliance can be difficult to achieve and regulatory standards
    are complex and time-consuming. High computational needs also make it hard for
    smaller organizations to play a role in AI-assisted drug discovery and research.
    Similarly to algorithmic trading AI applications, a changing biological landscape
    means that models may become quickly outdated. Biological factors of diseases
    are complex and can evolve over time, making it hard for AI/ML models to adapt.


    # Marketing — segmentation


    Companies have long been using data to capture our minds and hearts through marketing
    efforts, but today this is further amplified with the use of AI. Targeting the
    right audience with the message they most want to receive at the right time is
    an art form and a lot of data is involved with refining that art. Because marketers
    are often trying to establish a baseline of behavior for conversions, and how
    they can improve on that behavior, this is an area that’s ripe for AI implementation.
    While marketing use cases see AI applied in a variety of ways, from targeting,
    advertising, sentiment analysis, content generation, and analytics, we will focus
    on segmentation specifically as it’s an area that underlies almost every facet
    of marketing.


    Segmentation allows not just for grouping customers you already have, but a grouping
    of your prospective customers as well. Segmentation is used for targeting advertising
    by analyzing large consumer datasets to establish preferences and patterns across
    consumer groups.'
  merge: -1
  img_proc: true
- pgno: 215
  md: 'AI can help establish these groups, gather insights and preferences from these
    groups, and even help generate content relevant to these groups as well. All data
    sources can be relevant here, including demographics, browsing history and cookies,
    purchase behaviors, and interactions from social media engagement, and can all
    be factored in to create various profiles of potential users/customers based on
    this data.


    This kind of segmentation also allows personalization to happen at scale. If you
    can use profiling data to understand your users, it follows that you can then
    help bolster engagement with your brand by taking segmentation a step further
    into personalization. Generative AI models and NLP now make the generation of
    personalized content incredibly fast. They can even help inform the marketing
    strategy overall by tweaking language around product descriptions, email campaigns,
    social media content, and blog content as well.


    Companies like Sephora use clustering algorithms and regression models to segment
    customers based on purchasing behavior, preferences, and engagement levels to
    deliver targeted marketing messages to specific groups. They also use neural collaborative
    filtering for personalized recommendations. Spotify uses content-based collaborative
    filtering to understand users’ music preferences and suggest new music recommendations
    and personalized playlists for segmented users. H&M uses clustering algorithms
    and predictive modeling to analyze customer data with trend forecasts to align
    their marketing strategies with their inventory levels for various segmented groups.


    Challenges with AI/ML applications in marketing and segmentation include ensuring
    compliance with data protection regulations like GDPR, CCPA, and others, which
    can have legal implications but also negatively impact consumer trust. Data quality
    issues can also lead to marketing campaigns that are irrelevant, which can lower
    engagement rates and negatively impact the brand. Also, in many cases, segmented
    users may find themselves in an echo chamber of sorts, with their AI recommendations
    only showing them certain categories of content, which can limit their experience
    of discovering new preferences. Personal preferences are always subject to change
    or be impacted by pop culture and other outside influences, so marketing teams
    that employ AI applications need to find a way to capture new evolving interests
    even when segmentation goes well.


    # Manufacturing — predictive management


    We see the pragmatic and utilitarian approach of AI in manufacturing contexts.
    Here, AI is being used for everything from quality control to supply chain to
    robotics and the end goal is to optimize the use of time and resources. Particularly
    today, when global supply chains can be sensitive to fluctuations in the market
    and global geo-political influences, AI can be used to smooth disruptions.


    One of the advantages of the manufacturing industry is it’s able to generate a
    lot of its own clean data to learn historical trends from when the infrastructure
    is set up properly. AI can learn from real-time production data to understand
    where there are inefficiencies and bottlenecks so that management can address
    them. Based on inefficiencies AI systems learn from, they can then help predict
    when there may be a potential breakdown somewhere along the process. Because so
    much of the equipment used today might have sensors or IoT devices, we can also
    predict when certain parts of the factory line might be in need of maintenance
    as well.'
  merge: -1
  img_proc: true
- pgno: 216
  md: 'Predictive maintenance also helps advance the overall management of the facilities
    themselves. Managers can use the predictive capabilities of AI to better plan
    how they allocate resources, plan for downtimes and disruptions to their assembly
    lines, budget for maintenance costs and investments, and track the overall productivity
    of their operations. This doesn’t just bolster productivity gains but also give
    peace of mind from being proactive and managing things in a planned, controlled
    way.


    Companies like Avathon specialize in AI-powered solutions for predictive maintenance,
    optimizing manufacturing processes, and detecting early signs of equipment failures.
    Their suite of AI products for manufacturing, known as the Industrial AI Suite,
    uses AI/ML to predict potential machinery failures before they occur, helping
    to minimize unplanned downtime and maintenance costs for the oil and gas, aerospace,
    and manufacturing industries. Uptake, a predictive maintenance company that specializes
    in trucking fleets, has built their platform around risk management and downtime
    minimization as core value propositions of using their product.


    # Education — personalized learning


    We all have different writing styles and a one-size-fits-all approach to learning
    makes it so that most students end up with sub-optimal learning experiences. Education
    is ripe for a boost from AI to help learning paths and strategies become more
    widely accessible to students from many diverse backgrounds. This is encouraging
    to see, particularly since today’s reality of working in education has already
    alienated many well-meaning educators in the US and across the world. Students
    are in dire need of learning pathways that meet them where they are and can grow
    with them, without adding additional strain on their already overworked teachers!


    Today, there are so many use cases of AI to help education platforms adapt to
    the learning styles of the students they are serving. Understanding the preferences,
    weaknesses, and strengths of the end users/students contributes to crafting personalized
    learning experiences for individual students. The outcomes of these customized
    learning paths are that learning can be self-paced, content can be tailored, and
    gaps in knowledge that need to be improved can be prioritized for each student.
    In many cases, this also adds an additional premium of shielding students from
    potential judgment from their peers since students can learn confidently without
    being singled out. Adaptive learning also makes it so that students can progress
    according to their ability to receive learning. Difficulty levels can be adjustable,
    personalized practice exercises can help fill in gaps, and underlying ideas can
    be continuously reinforced as a student progresses along a path.


    Companies like Duolingo use an LSTM (RNN) model for speech recognition and feedback
    on pronunciation as well as reinforcement learning to tailor lessons based on
    how well users have performed on previous exercises and lessons. Squirrel AI uses
    knowledge graphs to establish relationships between concepts and track student
    mastery, as well as reinforcement DL to predict student learning outcomes and
    optimize difficulty levels for problems.'
  merge: -1
  img_proc: true
- pgno: 217
  md: 'AI applications in education can face some unique challenges. If learning paths
    are too personalized, they may actually dissuade students from learning because
    they may favor their weak areas and overwhelm them with difficulty. Learning content
    also has to adhere to local, national, or international localization and cultural
    standards. Bias also needs to be a priority so that models are not trained on
    data that underrepresents the learning group, which could have unfair or unequal
    learning outcomes for some students. Even teachers could pose a challenge, particularly
    if they are AI skeptics or fear job displacement.


    # Cybersecurity — anomaly detection and user and entity behavior analytics


    Cybercrime is up, and cybersecurity continues to be one of the most prevalent
    sources of AI/ML adoption that we see most regularly because of the persistence
    and sophistication of cyber criminals. The nature of cybersecurity is ever-changing,
    which means that, over time, companies need to keep step with their potential
    adversaries. It feels like we hear about a new data leak every day, and perhaps
    the most alarming part of cybersecurity is the number of attacks you don’t hear
    about. In this section, we will discuss two popular use cases used in cybersecurity:
    anomaly detection and user and entity behavior analytics (UEBA).


    Uncovering patterns and changes in those patterns is at the very heart of anomaly
    detection. In cybersecurity, this established baseline and deviation from it are
    what create the use case of anomaly detection. However, anomaly detection is quite
    broad in scope because it can refer to identifying outliers or abnormal events
    in any system, network, or dataset. Areas in cybersecurity can range between network
    traffic and system logs and even user behavior. Any irregular traffic spikes,
    unusual data transfers, or system behaviors that don’t align with historical data
    would be good contenders. Anomaly detection is often used in network security
    to combat DDoS attacks or potential data breaches. Once there’s been an anomaly
    and an action is required from the system, we can then move toward rectifying
    it somehow. Often, cyber attacks come from within networks and have clever ways
    of hiding their tracks, but with advanced pattern recognition that’s used for
    anomaly detection, AI systems can see when some actor/user is behaving in ways
    that don’t make sense for a normal user.


    As we went through some of the use cases for various verticals, you’re likely
    seeing patterns of your own emerge in terms of some of the underlying tech used
    to power those applications of AI. One of these overarching use cases is encapsulated
    in UEBA, which is, in many ways, an undercurrent for many of the use cases we
    discussed. As an AI PM, it will be really helpful if you can understand the power
    of UEBA and how to apply it within your product and beyond, particularly as you’re
    in the operational phase of building out increasingly powerful features over time.


    You can think of UEBA as a network of insights that are gathered by basically
    pooling all your users’ actions and subsequent data that is generated from those
    actions on a daily basis. Once all this data is centralized and analyzed, it’s
    able to offer you profound insights by giving you a baseline for not just individual
    users but for all your users all at once as well. This makes things such as finding
    anomalies or new patterns, no matter what the change is, easier because you can
    establish triggers or actions that alert your user or your internal workforce
    when something that requires attention has happened.'
  merge: -1
  img_proc: true
- pgno: 218
  md: 'Companies these days need to stay more vigilant than ever, and many don''t
    have the headcount or allocated budget to truly stay on top of this potential
    risk, which is why the breaches keep coming. This is a big part of the reason
    cybersecurity has adopted AI so readily: it''s ripe for it. When use cases are
    notoriously underfunded and understaffed, AI has an opportunity to get adopted
    and truly shine.


    Companies like Darktrace use a combination of supervised and unsupervised ML to
    model the behaviors of every device, user, and network within an enterprise through
    pattern recognition. Varonis is used by companies in the financial sector to prevent
    sensitive data leaks. They use ML and behavioral analytics to find anomalies in
    data access and usage in order to find compromised accounts or insider threats.
    They also use NLP for customers to investigate and analyze breaches through the
    Athena AI (generative AI) layer of their data security platform. Exabeam''s advanced
    analytics platform uses machine learning to create detailed timelines of abnormal
    user behavior for threat detection and access to sensitive data as well.


    This kind of behavioral profiling does, however, struggle with false positives
    as not all anomalies are malicious, and even routine activities like system updates
    could be flagged. In general, these applications of AI generate too many alerts
    and alert fatigue is a user pain point that these companies have to grapple with.
    Too few alerts and you risk exposure, but too many risks disengagement.


    # Thought leadership — learning from peer groups


    At the start of this chapter, we discussed the idea of building a foundation in
    your domain and understanding (as much as possible) what the specific pain points
    in your domain are with the aim of building an AI product that will serve the
    space for years to come. Building a product that works well, aligns with what
    your customers need, and employs modern technology is a fast way to build the
    credibility that''s necessary to spread thought leadership across your domain.


    You might choose to take on a leadership role in your domain in order to be positioned
    as a leader in your industry. With all the knowledge hubs, white papers, and product
    one-pagers that are out there, it''s common to see companies adopt the role of
    an industry thought leader for a number of reasons. Maybe this is for marketing,
    inbound leads, glory, or simply because they''re generous with their knowledge
    and success. Your choice of whether or not to be open with your online communities
    about your product and proprietary information might even come down to your product
    and brand strategy. Does it open up pathways for your end users, customers, and
    fans to follow along with your journey? Could it contribute to a stickier, more
    loyal customer base?


    Choosing how open and transparent you want to be with your company''s choices
    and major roadblocks will be up to you and your leadership team. Will you choose
    to be an example for the other players in your field? Or, will you choose to keep
    quiet and hold your algorithmic secret sauces, dirty laundry, and success stories
    close to your chest? Being a true thought leader in an industry may come at a
    financial and design cost if you''re not careful of how much information you let
    out. As with all risky endeavors, sometimes we need to open ourselves up to risk
    in order to also accept the gifts that come with transparency.'
  merge: -1
  img_proc: true
- pgno: 219
  md: 'As we’ve mentioned so many times, this period of applied AI products is still
    new. Even with all the buzz coming from the generative AI space, we’re still just
    scratching the surface of how companies and users will adopt these technologies.
    In the end, we don’t know how useful and groundbreaking they will be until we
    see them prove their worth in action. We have yet to understand the future use
    cases that will allow companies the greatest growth and success. The spirit of
    innovation and technological advancement is fed through example. Every use case
    and applied example has the ability to inspire us to discover a new use case.
    The newness of AI brings with it a kind of excitement about what’s possible.


    Particularly in a time when so many are apprehensive about whether AI can and
    should solve all our biggest problems, maybe it’s up to companies, PMs, technologists,
    and entrepreneurs to embody the collaborative quality of this spirit. AI products
    bring together science, data, technology, and humanity in a way that has shown
    so much promise already. Should you choose to open up and share the examples that
    do come up in your experience, whether directly or indirectly, the gifts that
    come along with that won’t just benefit you or your organization; they will benefit
    us all and, foremost, serve the highest ideals of your business: to best serve
    your customers and market.


    # Case Study


    # The market


    Given the size and resource constraints of Waterbear as a company, our case study
    would firmly be in the Visionaries category. Here, Waterbear’s greatest strength
    is that it’s an app with a lofty goal: to deliver robust mental health support
    to its users not through outside sources but through internal reflection. Though
    it’s an app you can freely share with a therapist, a friend, a partner, or any
    other external third party, it is meant to be a personal journey through your
    own journal prompts. Waterbear’s goals were quite visionary from the onset because
    its leadership team didn’t see NLP being leveraged in the form of a personal dashboard
    in the user experience for any of the other competing products out there. This
    sets it apart from its competition, which typically serves as either a simple
    mood tracker or as a connector to mental health networks and therapists. Bringing
    a holistic experience to its users meant that they could track their progress
    from week to week, month to month, or year to year. The sustainability of long-term
    advancement toward health, goal setting, and accomplishment is something that
    the founders of Waterbear felt was sorely lacking among the mental health and
    wellness apps that were out in the market. Depth was also lacking. Building an
    app experience that could go beyond capturing a mood but could capture a wide
    range of human-centric goals and pursuits wasn’t easy to build, but it was worthwhile
    enough.


    # Product design and strategy


    For Waterbear, the Why AI question was an easy one to solve. You need AI that’s
    good at working with unstructured, unlabeled textual data. Though some aspects
    of the product experience were able to be established with the end user, the most
    substantial work the NLP algorithms were running in the background was around
    the establishment of goals, sentiment analysis, and tracking progress.'
