- pgno: 133
  md: "+   - **Healthcare for disabilities:** Necessity is the mother of invention,\
    \ and disability is also a huge area of healthcare that AI has been serving for\
    \ some time. With the combination of robotics, computer vision, voice assistance,\
    \ audio assistance, speech-to-text, and smart home tech, we have been applying\
    \ and will continue to apply AI in contexts that can help individuals with disabilities\
    \ related to sight, sound, smell, taste, touch, mobility, mental health, understanding,\
    \ communication, and learning.\n+   \n+   A company called Parrots has created\
    \ a medical assistive AI called Polly that's assisting people with neurological\
    \ conditions. Polly helps its customers physically see the world around them better\
    \ with 360-degree vision and navigate within their home or outside, offers real-time\
    \ prediction by analyzing eye-tracking technology to anticipate needs, and facilitates\
    \ the communication of needs, thoughts, and desires to the people around them.\
    \ Essentially, it's a whole suite of products in one platform for a specific use\
    \ case. Wheelmap is a crowdsourced navigation app that helps you find wheelchair-accessible\
    \ routes, building on its knowledge through a community of users that participate\
    \ in a feedback loop. Biped, a company that makes smart harnesses, has developed\
    \ a product that fits like a backpack to assist blind and vision-impaired people\
    \ with potential collision risks as they navigate the world.\n+   - **Mental health\
    \ and suicide prevention:** These are areas we've seen tremendous investment in\
    \ with the use of AI applications. I teamed up with a colleague from my data science\
    \ program to create my dream product in 2020. It was a mental health-focused conversational\
    \ AI that got to know you, established goals with you, and recorded your mood.\
    \ We were interested in using AI to serve as a real-time journal and dashboard\
    \ for self-reflection, with the option to share this data and dashboard with a\
    \ therapist if you chose to work with one.\n+   \n+   Through the process of building\
    \ the idea and MVP, we did our research and discovered other companies that were\
    \ tackling mental health and suicide prevention in their own ways. Initially,\
    \ we wanted to focus on all consumers but saw that the language models would have\
    \ to be tailored considerably to the needs of more specific groups if they were\
    \ going to be effective. Companies such as ResolveX are using AI to work with\
    \ suicide hotlines to eliminate manual and administrative tasks so that the workers\
    \ can focus on the human on the other end of the line. Woebot developed a chatbot\
    \ using cognitive behavioral therapy techniques to help people battling depression\
    \ and anxiety.\n+   - **Vision enhancement:** Google's DeepMind achieved notoriety\
    \ for its ability to help detect retinal diseases and cardiovascular risk factors\
    \ by using AI on retinal images. A company called Be My Eyes partnered with OpenAI\
    \ to incorporate its GPT-4 model into their Virtual Volunteer product, an AI-powered\
    \ visual assistant for those who are blind or have low vision. Since its inception\
    \ in 2015, Be My Eyes has connected its staggering 6.3 million volunteers to assist\
    \ users with daily tasks but now that they've incorporated a foundational model\
    \ or LLM into their product, they're able to escalate toward their goal of improving\
    \ \"accessibility, usability and access to information globally\" (https://www.bemyeyes.com/blog/introducing-be-my-eyes-virtual-volunteer)."
