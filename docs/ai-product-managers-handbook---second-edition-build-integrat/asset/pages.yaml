  md: "Managing and maintaining this system will also be the work of your data engineer,\
    \ and we encourage every PM to have a close relationship with the data engineers\
    \ who support their products. ETL pipelines are generally updated in batches and\
    \ not in real time. If you’re using an ETL pipeline, for instance, to update historical\
    \ daily information about how your customers are using your product to offer client-facing\
    \ insights in your platform, it might be optimal to keep this batch updating twice\
    \ daily. If you need insights to come in real time for a dashboard that’s being\
    \ used by your internal business users that rely on that data to make daily decisions;\
    \ however, you likely will need to resort to a data pipeline that’s updated continuously.\n\
    \nNow that we understand the different available options to store data and how\
    \ to choose the right option for the business, let’s discuss how to manage our\
    \ projects.\n\n# Managing projects — IaaS\n\nIf you’re looking to create an AI/ML\
    \ system in your organization, you’ll have to think about it as its own ecosystem\
    \ that you’ll need to constantly maintain. We will start to see managed services\
    \ and **infrastructure-as-a-service (IaaS)** offerings coming out more and more\
    \ as time goes on, particularly with the rise of AI being implemented internally\
    \ for company optimizations but also for product optimizations. There has been\
    \ a shift in the industry toward companies such as Determined AI and Google’s\
    \ AI Platform pipeline tools to meet the needs of the market. At the heart of\
    \ this need is the desire to ease some of the burden from companies left scratching\
    \ their heads as they begin to take on the mammoth task of getting started with\
    \ an AI system.\n\nJust as DevOps teams became popular with at-scale software\
    \ development, the result of decades of mistakes, we will see something similar\
    \ with MLOps and AIOps. Developing a solution and putting it into operation are\
    \ two different key areas that need to work together. This is doubly true for\
    \ AI/ML systems. The trend now is on IaaS. According to Gartner, generative AI\
    \ and application modernization are the reasons “IaaS is forecast to experience\
    \ the highest end-user spending growth at 25.6%” (2024) and it’s projected to\
    \ grow 29.1% in 2025. This is an important concept to understand because companies\
    \ just approaching AI often don’t have an understanding of the cost, storage,\
    \ compute power, and investment required to do AI properly, particularly for DL\
    \ AI projects that require massive amounts of data to train on.\n\n> **Artificial\
    \ intelligence operations (AIOps)** focus on using ML and AI to automate and enhance\
    \ IT operations and infrastructure for things like issue detection and predictive\
    \ analytics to prevent outages, manage incidents, analyze root causes, or optimize\
    \ system performance.\n> \n> **Machine learning operations (MLOps)** focus on\
    \ optimizing and managing the life cycle of ML models from development and deployment\
    \ to monitoring and maintenance. The goal is to ensure models are efficiently\
    \ integrated into production environments.\n\n![](img/a0c9f9a2ba06a06d309ce21d890a47c6_56_0.png)"
