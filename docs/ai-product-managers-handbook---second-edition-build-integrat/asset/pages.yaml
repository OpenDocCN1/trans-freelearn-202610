- pgno: 228
  md: 'Some questions you can ask potential end users at this stage are:


    +   - What is the biggest challenge you face in your current workflow or daily
    routine?

    +   - What are your existing options for solutions to address those challenges?

    +   - What do you like and dislike about those existing options?

    +   - Is there a “perfect solution” and, if so, what would that look like for
    you?

    +   - How do you typically discover and decide on new products?

    +   - What are your core user needs?


    # Defining the problem


    Once you’ve amassed enough information about your customers and end users, you’ll
    start to group these findings and establish the actual problem you’re trying to
    solve. In many cases, these first two steps are inverted when the end user’s perspective
    is brought in after the problem has been considered. Technologists, product managers,
    and well-meaning entrepreneurs can jump the gun on this one pretty quickly. They
    might already be veterans in the space they’re trying to bring a new product to
    market in. They may already feel they understand the problem and then validate
    that problem with evidence from the end users they interview, if they do this
    at all. In some cases, they may make an assumption about the problem they’re solving
    and cherry-pick user interviews that only support their underlying assumption.


    Doing this might satisfy your ego temporarily, but it will create more work for
    you downstream when you discover the problem is actually more complex or multifaceted
    than you initially thought. The work of designing a product balances art and science.
    Sure, you’re creatively thinking about how a product needs to come together to
    suit the needs of your customers, but you also have to gather evidence and see
    how that evidence stacks up against your current understanding of the problem.
    Feel free to let yourself be guided by the results of your user research. Leave
    enough room to be pleasantly surprised by the findings you discover. You don’t
    need to know everything. But you do need to make sure you respect the guidelines
    of product design and build with end users in mind.


    The following are some key questions that you should be able to answer:


    +   - Can you define the specific problem in three sentences? Can you define it
    in one?

    +   - How do you know this problem is significant and worth solving?

    +   - Does the end user analysis support the weight of this problem?

    +   - What are the different facets of this problem? How are those facets experienced
    by various end user segments?

    +   - What assumptions have been made about the problem and how have they been
    validated or disproven?'
  merge: -1
  img_proc: true
- pgno: 229
  md: '# Experimentation


    Now comes the fun part. Experimenting with ideas and concepts of what to include
    in your product allows you to take the data you’ve gathered so far to understand
    your end users and validate your problem and turn it into a form you can work
    with and mold. You won’t want to rush this step. This is where you can create
    a series of brainstorming sessions and workshops that will inform your eventual
    prototypes. Let your creativity run free here and make sure the team you’re building
    with feels comfortable enough to bring up ideas that aren’t very good. In fact,
    don’t even worry about whether those ideas are good or not at the beginning. Let
    your team’s creativity run free. The only restraint to include here is to make
    sure that all the ideas actually address the customer needs identified in the
    first section. For more information on team roles and responsibilities, feel free
    to refer back to Chapter 6.


    You can discard ideas that don’t work so well later on when you’ve landed on a
    few options you feel confident enough in to move on to the prototyping stage.
    This stage is about excavating the corners of the mind for all the ideas and concepts
    that your product stakeholders and designers feel compelled to consider when building
    the product. Let their structure be loose because this is the stage of product
    design that’s the most free-flowing. You want everyone involved to be in the flow
    state, which means you want them to be thinking visually and experientially. Think
    here in terms of whiteboard exercises, loose mockups, sketches, and mood boards.
    You want to get all the ideas that occur to your team out and make sure they’re
    expressed first. Then you want to bring everyone together to think more critically
    about these ideas and agree to 2-3 prototypes at least.


    Once you have a few product ideas that are most compelling, you can turn them
    into the prototypes you’ll validate and test. Prototyping will take the elements
    that were included in your brainstorming sessions and thread them together into
    a few product experiences that you’d feel good about bringing to potential customers.
    This allows you to make a visualization of your product: a jump from the formless
    world of ideas into the defined world of form. How formal these prototypes are
    will depend on your own preferences, but make sure these prototypes capture the
    visual representation of your product in sketch or wireframe form. At this stage,
    you haven’t actually built and developed anything yet. You’re still in the early
    stages of brainstorming potential solutions to the problem you’ve defined. It’s
    just that those potential solutions are shareable and you can start to get feedback
    from potential end users.


    You should be able to answer the following questions at this stage:


    +   - What are all the potential ideas and concepts that have emerged during brainstorming
    sessions?

    +   - How do the 2-3 prototypes you’ve settled on relate to the customer needs
    identified in the first stage?

    +   - Are the ideas explored wide enough? Have a wide range of unconventional
    or “out-of-the-box” ideas and potential solutions been considered?

    +   - Are there ideas that stray too far from the core user needs?

    +   - Do all team members involved in the brainstorming process feel comfortable
    enough to express their thoughts fully?

    +   - Have all ideas been captured and documented during these brainstorming sessions?

    +   - Are the prototypes you’ve settled on detailed enough to convey the main
    functionality but flexible enough to iterate on?'
  merge: -1
  img_proc: true
- pgno: 230
  md: '+   - Do the ideas and prototypes align with the overall product vision and
    strategic objectives of the company?


    # Validation


    Now that you have something you can put in front of people, you can start amassing
    feedback that will directly impact the direction and presentation of your product.
    In this phase, you''re putting your prototypes in front of real human users who
    may one day purchase your product, or represent groups of users who will. This
    is where you''re checking that the feedback aligns with the initial feedback you
    gathered in the first phase. Here, you''re also checking to make sure your prototypes
    are accurately being perceived, that their usability is being understood even
    in prototype form, and that your users feel it will solve their pain points. This
    stage should also give you a few more ideas to help make your product better.


    In this phase, you''re not only looking to see that your prototype is fitting
    the bill but also that it''s capturing additional complexity you might not have
    thought of or been aware of in the first round of user feedback. This early in
    the game, there''s plenty of room for improvement, and you''ll get an intuitive
    sense of how many rounds of testing and validation to do. As you continue to mature
    and refine your product, your testing and validation needs will mature. In some
    cases, you''ll be testing not just the ideas and prototypes, but eventually reliability,
    performance, and compliance as well. Remember, these phases are design principles,
    not exactly a set list of sequential steps. You''ll be coming back to test and
    validate with each new iteration that emerges from it.


    The key questions you can ask in this stage are:


    +   - Does the feedback from users at this stage align with the initial user research
    findings from the first phase? Are there significant discrepancies between them?

    +   - Are users understanding the purpose and functionality of the prototype(s)
    as intended?

    +   - Are there challenges in how users navigate through the prototype(s) to complete
    core tasks?

    +   - Do users feel the prototype addresses their pain points effectively and
    efficiently?

    +   - Which features do users find most meaningful, useful, or appealing? Which
    features do users find most confusing, unnecessary, or counterproductive?

    +   - Have any new ideas, needs, or suggestions emerged from this second round
    of user feedback during the validation stage? Are there any edge cases, scenarios,
    or unexpected complexities?


    # Iteration


    Each iteration of your product that comes out of your testing and validation phases
    will represent a level of your product''s maturity and growth. The idea with the
    iteration phase is to ensure your product is growing in the right direction, that
    it still resonates with potential end users and customers, and that it is capturing
    the feedback they''re bringing up. The more the real humans who will use your
    product are in the mix, the closer you will come to designing a product that''s
    intended for them and puts their concerns first. Each iteration will get you closer
    to a user experience that aligns best with what the majority of your customers
    and end users want from your product.'
  merge: -1
  img_proc: true
