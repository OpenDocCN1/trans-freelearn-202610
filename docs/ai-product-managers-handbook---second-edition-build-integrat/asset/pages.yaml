- pgno: 101
  md: '![](img/a0c9f9a2ba06a06d309ce21d890a47c6_101_0.png)


    In a paper written by Open AI''s Prafulla Dhariwal and Alex Nichol titled *Diffusion
    models beat GANs on image synthesis*, the authors attribute a number of advantages
    to diffusion models and clue us into a big part of why they’ve been so successful
    in saying “GANs currently hold the state-of-the-art on most image generation tasks
    as measured by sample quality metrics such as FID, Inception Score and Precision.
    However, some of these metrics do not fully capture diversity, and it has been
    shown that GANs capture less diversity than state-of-the-art likelihood-based
    models (diffusion models). Furthermore, GANs are often difficult to train, collapsing
    without carefully selected hyperparameters and regularizers. While GANs hold the
    state-of-the-art, their drawbacks make them difficult to scale and apply to new
    domains. As a result, much work has been done to achieve GAN-like sample quality
    with likelihood-based models. While these models capture more diversity and are
    typically easier to scale and train than GANs, they still fall short in terms
    of visual fidelity. Furthermore, except for VAEs, sampling from these models is
    slower than GANs in terms of wall-clock time.”


    We see a number of advantages in the passage above ranging from training difficulty,
    output diversity, model collapse, and scalability. They do, however, go on to
    say that although they “believe diffusion models are an extremely promising direction
    for generative modeling, they are still slower than GANs at sampling time due
    to the use of multiple denoising steps.” Depending on the size of the diffusion
    model, speed will be an issue as each denoising step can take anywhere from five
    to twenty times longer to train than GANs.


    # ## Transformer models


    While many of the **large language models** (LLMs) have been created using other
    ANNs like RNNs and LSTM, which we referenced in the previous section of this chapter,
    recent advancements in this space have come from transformer models. Transformers
    have become the darlings of the NLP space due, in large part, to their ability
    to handle sequential data so well. As you can imagine, a model that can holistically
    contextualize, understand, and respond to a prompt is quite the breakthrough when
    it comes to language understanding. Popular transformer models include Stable
    Diffusion, GitHub''s Copilot, Quora''s Poe, Microsoft''s MS Copilot, Anthropic''s
    Claude, Google''s BERT, T5, and Gemini models, as well as OpenAI''s GPT model.


    First introduced in 2017 by a team of Google researchers in a paper titled *Attention
    is all you need*, transformers made it possible for a model to analyze the entirety
    of a body of text rather than trying to understand it sequentially. What that
    means is that rather than understanding each word in order, a transformer model
    allows for a more global understanding of an entire prompt. It’s able to do this
    by assigning weights or various levels of “attention” to different words in the
    text it’s trying to analyze or deliver. It does this through a process called
    parallelization.


    Another major advancement of the transformer model is the ability to train on
    huge datasets in comparison to RNNs or LSTM, while also being able to support
    such a large number of parameters. The world''s current state-of-the-art LLM,
    GPT-4, is owned by OpenAI and currently has 1.8 trillion parameters. You can think
    of parameters as individual “lessons” or variables the model learns from its training
    data. Note this is not the same as hyperparameters, which are a different set
    of tools that ML engineers can use to calibrate or fine-tune their models.'
