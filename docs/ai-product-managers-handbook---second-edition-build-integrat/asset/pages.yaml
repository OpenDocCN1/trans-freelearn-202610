- pgno: 413
  md: 'We’ve gone through a few learning and portfolio-building options in this section,
    but remember that these are the skills you’re going to try to convey to land your
    first couple of roles. Make sure that the work you’re doing to learn doesn’t just
    apply to technical AI concepts but that it can be applicable across all five areas.


    # What an AI PM looks like today


    Today’s AI PMs are heavy on the business side because they need to possess strong
    commercialization skills to make their applied AI products a success. Things like
    understanding market analysis, product strategy, and financial planning are important
    skills for AI PMs to master because there’s simply a lot of market uncertainty.
    The AI wave is still new and, depending on where you stand, it could feel like
    a tsunami. We’re also early in the hype cycle, so having AI PMs who know how to
    talk about their brand of AI in a way that’s accessible is valuable. Also, because
    many of the AI use cases are still novel, someone who can translate technical
    ability into business value and ROI is a huge asset to their organization.


    They’re not just doing this for their organization’s leaders but also functionally
    for all the stakeholders they work with. We’ve talked at length throughout the
    book about how cross-functional and collaborative the AI PM role is, but this
    translation is highly relevant here as well. AI PMs have to communicate the business
    value that comes from AI to virtually all their stakeholders on various other
    teams all the time. With data science and ML stakeholders, they’re doing the opposite:
    they’re translating business problems into tech terms. The AI PM has to be bidirectional,
    effectively communicating and fostering a team environment with every department
    they work with.


    That sounds like a lot because it is. All that communication doesn’t happen in
    a vacuum. There are important projects related to their product with every sprint,
    so they need to manage the development and deployment of multiple aspects of their
    AI products and platforms. They’re balancing timelines, resources, priorities,
    and outcomes related to all aspects of their product or platform and they’re communicating
    all that information across teams—occasionally, even to the whole company at once.
    Depending on where you work, this may not all be happening at the same time by
    one person. At a small start-up, it likely is. At a bigger start-up, there are
    anywhere from 5 to 20 PMs. At bigger companies, you have longer, hierarchical
    product management structures.


    But today’s AI PM also has a foundation of technical knowledge through computer
    science, data science, or otherwise related technical fields. Even if they don’t
    possess an advanced degree, they need to have a foundational knowledge of ML to
    be able to do the job. Chances are, they have had hands-on experience with Python
    or R and have personally used frameworks like PyTorch or TensorFlow to at the
    very least understand the full lifecycle of an ML model.


    I find it surprising that a technical background is prized well above others in
    a product role. As I started to reach out to people on LinkedIn to understand
    their level of satisfaction with their current role as PM, I noticed something
    many of them had in common: they used to be engineers. This notion is starting
    to change, but it still holds true that today’s PMs are overwhelmingly represented
    by technical backgrounds. It’s a shame really. Engineering skills are great; it’s
    helpful to know about technical feasibility when you’re scoping features and technical
    complexity. But if the bulk of PMs are coming from technical backgrounds, they
    have a lot of PM skills to acquire if they’re going to be successful PMs.'
