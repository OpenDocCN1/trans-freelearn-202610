- pgno: 389
  md: '+   - Operational capability

    +   - Meeting customer expectations


    When you’re re-launching an existing product with new AI capabilities and features,
    these are the areas you’ll be revisiting. As we mentioned prior, it’s important
    to revisit the product vision and goals when evolving products because you want
    to make sure that why you’re building hasn’t changed. So many factors go into
    AI transformations. Perhaps it is market influences that are prompting the evolution.
    Perhaps your CEO got inspired at an AI conference. Perhaps your customers are
    asking for certain efficiencies or automation. There has to be recognition on
    the part of the PM that incorporating AI could change the product experience so
    drastically that it should effectively be thought of as an entirely new product.
    It’s also entirely possible that the problems your traditional product was solving
    will disappear with the incorporation of AI. Defining what the purpose of AI transformation
    is, how AI is addressing gaps in the original product, and how this transformation
    aligns with the vision and goals of the company will all be important conversations
    for the product organization to lead.


    When you already have an established product that people know and use, you run
    the risk of going to market with a new and improved product that threatens the
    success you’ve already built. The new version might not be worth the hype. It
    could introduce new problems to your product experience that rub users the wrong
    way. You’re faced with a new challenge: positioning your evolved product as an
    optimal solution to meet the needs of your evolving market and user base. Chances
    are, if you’re contemplating adding AI to your existing product, your competitors
    are too. This means that now, your market likely has many new and improved AI-powered
    competing products to choose from. All competitors influence each other in one
    way or another, so new innovations result in a changed landscape. Your customers
    and users are responding to these new choices by re-examining and refining their
    expectations of products to choose from as well.


    Even internally, various employees in various job families might have different
    expectations of what AI transformation will mean for the product they support,
    and how exactly it will make the lives of your customers and users better downstream.
    So, the work of maintaining alignment is really about making sure that everyone
    is on board with the new value proposition of the product you’re re-launching.
    Strategic alignment will profoundly influence how the market will accept your
    AI-evolved product. In turn, acceptance, adoption, and met and exceeded expectations
    will result in the long-term success of the new AI-evolved product.


    The ongoing work of managing alignment is integral to the work of an AI PM because,
    in this role, you’re constantly keeping an eye on your competitive landscape and
    your product’s standing in that landscape. It’s your job to see how AI technology
    can enhance your product experience and how to best communicate that strength
    to stakeholders internally and externally. In Chapter 15, we discussed the concept
    of going back to the drawing board; the idea of designing a new product experience
    that poses a significant improvement to your product experience to increase the
    chances that it will be a formidable player in your market.'
