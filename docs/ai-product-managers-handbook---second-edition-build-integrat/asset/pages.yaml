- pgno: 163
  md: '| Quality Assurance (QA) Engineer | Ensures that AI features are tested for
    functionality, reliability, and performance, reducing post-deployment issues.
    | Engineering |

    | Cloud Architect | Helps scale AI infrastructure, optimizing cloud resource usage
    and handling large-scale deployment strategies. | Engineering |

    | Business Analyst | Translates business needs into technical requirements, providing
    additional clarity and stakeholder alignment. | Analytics |

    | Ethics and Compliance Officer | Assesses the model for ethical considerations,
    biases, and regulatory compliance. | Legal/Compliance |


    Table 6.1: Critical and non-critical roles


    Now that you’re familiar with what your dream team might look like, let’s look
    at the next key component – your tech stack.


    # Investing in your tech stack


    Understanding the tech stack and languages that will give you the most flexibility
    is the most important part of beginning your tech stack journey. As a PM, you’re
    regularly thinking about the value of building something compared to the cost
    or effort required to build it. This is why you can’t ignore your tech stack.
    It might be tempting to leave it to a CTO to decide on which tech stack to invest
    in, but it’s not so easy to outsource if this tech stack is directly involved
    with the building of your product in any way. Empowering your stakeholders impacts
    the effort and cost that go into your AI product, so you’ll want to make sure
    you’re involved in the making of these key decisions.


    You’ll also want to build trust with your technical counterparts by developing
    an understanding of when your tech stack poses a limitation with your product.
    If you need to make a case for adding in more complexity for the sake and success
    of your product, or for the sake of customer acquisition, it should be you who
    brings it up. You’ll work closely with your data science and data engineering
    teams to create the proper channels for delivering the relevant data to your models
    in a reliable way so that all the other stakeholders involved in building your
    product can trust the infrastructure in place. Here are some key factors that
    you should keep in mind as an AI PM:


    +   - The biggest consideration in your tech stack is paying attention to properly
    setting up your infrastructure to handle the scale of your data as your business
    grows. Building the right tech stack to handle the cleansing, storing, securing,
    preparing, and monitoring of your data will be the foundation for supporting your
    AI program or product team. This goes hand in hand with building your data strategy.

    +   - Beyond this, you’ll seek to create a collaborative environment for the many
    roles in your AI program to participate in. Between the analysts, data scientists,
    ML engineers, broader engineering team, and any leaders and consultants you include
    in the formation of your AI team, you’ll want to create channels for all these
    various members to communicate and collaborate.'
  merge: -1
