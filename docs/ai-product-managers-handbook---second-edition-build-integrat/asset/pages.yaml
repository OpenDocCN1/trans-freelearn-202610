- pgno: 98
  md: 'Because of their flexibility across applications and use cases, generative
    AI models are used for everything from facial recognition, data augmentation and
    synthesis, anomaly detection, super-resolution imaging and enhancement, and content
    creation, whether that be video, sound, image, or text. In the following sections,
    we will explore some of the major categories of generative AI models that are
    widely used today, as well as some of their strengths and drawbacks.


    # ## Generative adversarial networks


    Generative adversarial networks (GANs) are my favorite type of ANN because they''re
    essentially made up of two neural networks (the generator and the discriminator)
    that are pitted against each other, hence the name, which compete toward the goal
    of generating new data that''s passable for real-world data. Because of this generative
    ability, GANs are used for image, video, and voice generation. They were also
    initially used for unsupervised learning because of their generative and self-regulation
    abilities, but they can be used for supervised and reinforcement learning as well.
    The way they work is one of the neural networks is referred to as the generator
    and the other is the discriminator, and the two compete as part of this generative
    process.


    GANs were first introduced in a breakthrough paper that came out in 2014 by Goodfellow
    et al. titled *Generative adversarial networks*, which states that GANs “simultaneously
    train two models: a generative model G that captures the data distribution, and
    a discriminative model D that estimates the probability that a sample came from
    the training data rather than G. The training procedure for G is to maximize the
    probability of D making a mistake.”


    We can think of discriminative and generative models as two sides of the same
    coin. Discriminative models look at the features a type of image might have, for
    example, looking for associations between all the images of dogs the model is
    currently learning from. Generative models start from the category itself and
    expand out into the potential features that a category in that image might possess.
    If we take the example of a category such as space kittens, the generative model
    might look at the example data it’s fed and deduce that if it creates an image,
    it should create something that involves space and kittens. The discriminative
    model then takes the image the generative model creates and confirms, based on
    its own learning, that any images in the space kittens category must contain both
    kittens and space as features.


    Another way to explain this is that the generative model maps the label to potential
    features and the discriminative model maps features to the label. What''s most
    interesting to us about GANs is they effectively pass or fail their own version
    of the Turing test. How do you know whether you passed? If the GAN correctly identifies
    a generated image as a falsified image, it’s passed (or failed?) its own test.
    It really depends on how you look at passing or failing for that matter. If it
    incorrectly labeled a falsified/generated image as a “real” image, it means the
    generative model is pretty strong because its own discriminator wasn''t able to
    discriminate properly. Then again, because it''s a double-sided coin, it means
    that the discriminator needs to be strengthened to be more discerning. GANs are
    very meta.


    The steps a GAN takes to run through its process are as follows:


    +   1. It begins with a generator neural network that takes in data and returns
    an image.'
  merge: -1
  img_proc: true
- pgno: 99
  md: '+   2. The image is then fed to the discriminator along with other images from
    a real-world dataset.

    +   3. Then, the discriminator produces outputs that are numbered between 0 and
    1, which it assigns as probabilities for each of the images it is discriminating,
    with 0 representing a fake and 1 representing an authentic real-world image.

    +   4. GANs also use backpropagation, so every time the discriminator makes a
    wrong call, the GAN learns from previous mistakes to correct its weights and optimize
    itself for accuracy.


    Because of the adversarial nature of GANs, the effects of pitting two neural networks
    against each other offer us a tool that produces the most realistic generated
    images. But it''s not just images GANs are good at making; they''re also great
    for producing synthetic data. Neural networks need so much data that, often, creating
    synthetic data is the best way to adequately feed them, but the drawback is if
    you create enough synthetic data, the model will collapse upon itself. GANs also
    excel at translating between images, so you often see them used in map generation
    from satellite images or in products that allow you to edit artistic styles, filter
    between images, or even improve the resolution of blurry images. Because they''re
    so good at producing outputs that are diverse, they''ve also been used to improve
    **natural language processing** (NLP). The superpower of GANs is the diversity
    of images, text, and video that can be derived from using them.


    ![](img/a0c9f9a2ba06a06d309ce21d890a47c6_99_0.png)


    > In the context of DL, synthetic data refers to data that is artificially generated
    rather than collected from real-world events and observations. It''s valuable
    for training, validating, and testing DL models, where obtaining enough real-world
    data is challenging, time-consuming, or costly.


    However, GANs can suffer, like any ANN, if they don''t have diverse enough data
    samples to learn from. Generated images are often flawed and you can see these
    flaws anytime a generated image adds a sixth finger to someone''s hand. These
    models are trying to predict the output the user is asking for based on the prompt
    it''s given, so we often see the limitations of generated images or video when
    the output is too flawed to be real. They''re also hard to train and can be unstable.
    Ethically, because GANs are often so focused on image generation, and because
    that image generation is so crisp, they can be used for malicious intent by those
    looking to influence the political, economic, social, or cultural landscape through
    the use of propaganda and misinformation.


    # Autoencoders


    Autoencoder models are the simplest of the generative AI models we will cover
    as they primarily exist to reduce noise in data and to learn how to reconstruct
    basic patterns in the data they see. For that reason, it''s used most for unsupervised
    learning tasks like data compression, denoising, and feature extraction to identify
    the most important features in a data sample, which means it''s often used with
    other models as part of a larger model pipeline. Let''s break down the layers:


    +   - The first part of autoencoders is called an **encoder**. This part of the
    model has an input layer where inputs flow into. Those inputs flow through two
    hidden layers that reduce the dimensionality of the data. The encoder stage does
    exactly what its name suggests; it turns the input data it receives into code
    that will pass through to the second part.'
