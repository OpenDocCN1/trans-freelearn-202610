  md: 'Now that we’ve covered the various ways AI implementation impacts the design
    process of a traditional software product, we can start to explore the ways AI
    impacts the day-to-day management of a newly evolved AI product. When building
    natively with AI, as we explored in Part 2 of this book, you’re baking your AI
    and data strategy into your development process from the beginning. You can revisit
    Part 2 to understand that more fully. In this scenario in Part 3, we’re exploring
    the nuances and logistics of incorporating various aspects related to AI enablement
    after you’ve already launched and found success with a traditional software product.


    In the next chapter, we’ll explore how AI enablement impacts the ephemeral management
    of an evolved AI product. This chapter will serve as a guide for anyone who’s
    thinking critically about what AI enablement will mean for their product and how
    they can best prepare for the demands of managing a traditional software product
    that’s presently bolstered by AI capabilities and features.


