- pgno: 240
  md: 'A lot can go wrong if you’re not able to maintain clarity and objectivity through
    these various phases of your product design lifecycle. This explains why user
    research and UX are such important disciplines. They bring objectivity to a process
    that can get lost in its own subjectivity. A reality check is helpful when you’re
    investing significant time, energy, money, and resources into a project. False
    assumptions can be costly and may convince you to go to market with a product
    that no one asked for and no one likes. Or you could launch a product with so
    many unnecessary features that your end users get overwhelmed and confused about
    what your product actually does.


    Take the time to invest in research and inquiry. Understand where your users are
    emotionally with regard to their pain points and their preferences. Why do they
    like the things they want? Why do they dislike the things they don’t want? Then,
    from there, how can you design an experience that meets those needs and preferences?
    It’s better to start with a simple, elegant design than it is to start with more
    features than anyone knows what to do with. Less is more.


    Getting clear on what your product actually needs to be will help maintain the
    experiences and contexts that your end users are working with. Spending time on
    research will also make your leadership feel better about the significant resources
    they’re about to deploy on investing in an AI product. Of course, you can validate
    things as you go. It’s best practice to have product designers, UX designers,
    and UX researchers as part of your product team full time. A lot goes into the
    work of capturing the evolving needs of an AI product. But make sure you spend
    time on gaining clarity upfront and not just after you’ve launched an MVP. Starting
    from a flawed product design will have you playing catch up and will ultimately
    prove to be more costly down the line.


    # Adding complexity


    Eventually, you will build and add more features to your product MVP and this
    will set off another exercise in prioritization: *which features will come first?*
    If you’re managing a B2B AI product, you might be tempted to go with the features
    that will satisfy your marquee customer best. If you’re managing a B2C product,
    you might go for the most requested feature from your user feedback interviews.
    Both could be flawed choices because they only represent the thoughts and opinions
    of very select, outspoken, and privileged perspectives. The choices you have at
    given periods of time will have downstream impacts on customers you haven’t acquired
    yet, that is, customers that you will acquire in the future.


    The decision of where to add complexity and how shouldn’t be taken lightly. As
    you start your validation stage, you’re going to be confronted with more complexity
    with each new user or type of user you ask for feedback. Then, each time you dip
    back in to iterate and validate the next iteration, you’ll see your list of considerations,
    features, and functionalities start to grow. You’re going between validation and
    iteration several times before arriving at a final prototype. But you can’t consider
    everyone’s desires and preferences. The reality is you only have so many resources
    to make one “great” prototype, so complexity has to be limited.


    Regardless of the type of product and market you’re working in, once you have
    that one “great” prototype, the users of it will have to learn how to use it.
    There will be a learning curve of some sort and every degree of complexity you
    add to your product will have to have its own onboarding lesson accompanying it.
    Products that are cognitively heavy to process and understand will be faced with
    the most user resistance. But you can explore strategies to counteract this resistance.'
  merge: -1
  img_proc: true
- pgno: 241
  md: 'Let''s look at some important aspects that an AI PM must keep in mind:


    +   - **Cognitive weight:** Remember that your end result is the prototype your
    development team will work on building into a fully fledged product for end users
    to use. Even if your prototype could theoretically capture all user needs and
    preferences, the end result might be clunkier than the average user''s needs.
    This means they might have to sift through too many features or functionality
    that don''t help or apply to them, which could lead to them getting frustrated
    and stopping using it altogether. The harder your product is to understand and
    use, the more frustration it will create with end users.

    +   - **User adoption:** Many companies rely on having community managers or developer
    advocates in addition to customer success folks who help with keeping their community
    of users properly supported in cases where they have complex products. Often,
    this can be a source of bonding for the community of worldwide users to create
    a subculture around their product''s brand identity. The issue of complexity doesn''t
    necessarily have to be a challenge. More complexity can mean more capabilities
    and more nuance; complex products don''t necessarily need to signal difficult
    products. Even if your product is challenging, and the road to onboarding and
    training on your product is a long one, you can still maintain a sprawling, bustling,
    loyal customer base. Good things may not come easily and the difficulty of mastering
    a product could be the very thing that fosters long-term adoption and success.

    +   - **Cost:** You''ll also have to balance the organization''s appetite for
    additional complexity, particularly when it has to do with more AI features. The
    decision to store, use, and train on more data or introduce additional models
    to your product''s design will also have to be handled collaboratively as more
    complexity in AI infrastructure can be costly, particularly if there are issues
    that might impact the scalability of your product design. Decisions like this
    will need to be strategic ones, and that additional complexity needs to be a bigger
    value addition than just adding more nice-to-haves to your product for the sake
    of a competitive edge.

    +   - **Risk impact:** Additional complexity also means there are more opportunities
    for your AI product to get things wrong. We touched on ethical considerations
    for AI earlier in this chapter, and that''s important to note here again as well,
    particularly when that added complexity is another AI feature.


    The priority of added complexity is one that will have to be balanced with the
    customer, cost, and risk impact. You may find yourself having to answer questions
    such as:


    +   - Will the added complexity hinder bias efforts in the AI system that supports
    your product design?

    +   - Will it introduce new risks to determinations that might limit or restrict
    protected groups of people/users?

    +   - Is there a way to test for that before you roll out that feature and see
    its impact on your real customer base?

    +   - Is the impact of that added complexity fair across your entire customer
    base?

    +   - Does the added complexity introduce data privacy concerns?'
  merge: -1
  img_proc: true
- pgno: 242
  md: 'All these considerations have a role to play, and prioritizing ethics and risk
    when you''re introducing more complexity into your product will help you build
    ethically and responsibly.


    # Branding


    It might seem strange to see branding included in the list of priority factors,
    but branding is all around us. We all have a personal brand, whether we’re aware
    of it or not. Our departments and teams have a brand identity, as do the companies
    we work for. When you’re prioritizing the most important factors for your product
    design, you will have to think about how branding plays a role and if that branding
    aligns with the choices you’re making at the product design level in the aesthetics
    phase. On a foundational level, the product you’re designing must adhere to the
    brand identity the company has spent time creating.


    This is because branding affects everything, from influencing your users and customers,
    building trust with them, and differentiating your value in the market, to emotionally
    engaging with your audience, your perception in the market as a company and as
    a product, and the role you play in ethics and social responsibility. When we’re
    building and shipping products, many intuitive decisions are supported by the
    analytics and metrics we use to guide us. We implement product KPIs and metrics
    to let us know when we’re on the right track.


    In the absence of formal metrics, we can often revert to **brand identity** to
    be our guide. There will be emotional elements to branding and, as we build, these
    elements will shine through our products whether we know it or not. Brand identity
    is the vehicle with which we will communicate the company and product’s values
    to end users and customers.


    Even if you do everything right, how your product fits into your brand identity
    still might be a challenge. You’ve built an impeccable design, you’ve validated
    all your hunches, you’ve brought the best minds at the company on board, you feel
    your product is cohesive enough that its purpose and value are clear...and your
    product still might not be aligned with your brand identity. Particularly today,
    when AI products are ever present, aligning products to your brand and values
    is an important way to emotionally connect with the people who will buy and use
    them.


    Branding isn’t that nebulous a concept when you think about it. It’s a voice,
    a tone, certain colors, and certain values and characters. It helps make your
    company and offering special in a sea of generic gray matter. As AI continues
    to be adopted, more and more companies will give in to the temptation to use generative
    AI for their marketing and communication efforts themselves. As convenient and
    cheap as outsourcing creativity to AI is, eventually it will make that sea of
    gray matter bigger. So, remember that as we continue on the AI journey together,
    showing more of your personality, identity, and values will be crucial because
    you’re not selling to AI; you’re selling to human beings.


    We’ve discussed the concept of building trust as it relates to AI ethics and data
    privacy, but we need to come back to that idea here as well. Establishing a strong,
    reputable, and distinguishable voice through your branding efforts will instill
    trust and credibility in your AI product. Many AI products already exist in all
    verticals and industries, and the space will continue to get saturated as the
    decade continues. Differentiating your company and product intentionally through
    the way you communicate with your community will be key.'
  merge: -1
  img_proc: true
- pgno: 243
  md: 'With more and more AI products crowding the space, you''ll find yourself coming
    back to the same question when making product design decisions. “Does this product
    design decision align with our brand identity?” If upholding ethical standards,
    avoiding bias and discrimination, respecting your users’ privacy, and promoting
    transparency and accountability are part of your brand identity, you''ll want
    to signal that in various ways through your product design and communication efforts.


    Product design decisions impact everything from how you''ll set up your infrastructure
    and build your teams to how you''ll craft a user experience, which ethical considerations
    you''ll prioritize, and how you want to emotionally engage with your end users
    and customers. These will all be discussions to be had with all the key stakeholders
    you identify when you start the process of product design, and they''re big discussions
    because they impact how your product will be perceived and engaged with. A product
    that is well designed, works well, and is valuable will have a good reputation
    in the market. That will be especially true if it''s made by a company that''s
    established and respected. It will lead to organic growth from users who are your
    champions, which will drive demand and keep your adoption high. Your UI, languages,
    overall UX design, colors, visual elements, design elements, and workflows are
    all part of crafting a visual brand identity in your product design. These are
    the tools you will use to create an experience for your end users and customers
    that instills trust and loyalty for your product over the long term.


    I won''t tell you which priority is correct; no book can. That''s a collaborative
    effort that only you and your team can agree on together. But we already have
    a blueprint to work off of. Based on our product design principles from the first
    section, you''ve already got a place to start: your end user and market. Beyond
    that, we''ve also discussed the factors that add complexity to the product design
    process when AI is involved and some of the considerations you can entertain when
    you are prioritizing your product design efforts. These are meant to be tools
    you can deploy when you''re starting out with bringing an AI-native product to
    market and initially setting out on the design journey. But that journey will
    continue, and if it''s to be a long one, you''ll need to communicate to your community
    about where you started and why.


    Think about that today. Why has your company already invested in getting your
    own team resourced? Surely there must be a compelling reason your position at
    the company exists or why your company decided to go all in with launching this
    new AI product. Getting down to the bottom of that narrative and finding the passion
    that has led to those decisions is the kernel that will make up your story. Communicating
    that story will be a big reason people buy your product.


    # What’s the story you’re telling?


    Everyone loves a story of tech founders who believed so much in their products
    that they built their companies in their garages. Often these stories are false
    or flawed, projecting an image of a single founder who rose through adversity
    through their passion, dedication, and bootstrapping alone. Eventually, they get
    lucky and the right person sees the value in what they''re doing and, inspired,
    they go all in and bankroll their noble ambitions. This is a kind of myth, of
    course, and we humans have been interested in mythology for millennia.'
  merge: -1
  img_proc: true
- pgno: 244
  md: 'Storytelling is like candy for our brains; it helps us cut through all the
    distractions in our lives to intrinsically enjoy something. That enjoyment allows
    us to do a number of things. Firstly, it can help us better understand complicated
    things like AI products with a steep learning curve. Also, engaging users and
    communicating why your product matters in the first place is how you can start
    to build a relationship with users, and that’s taken to the next level when you’re
    able to use that engagement to make your product more digestible and add more
    context to how it works and why it was built the way it was.


    Because you’re creating a narrative around your product, this also makes your
    offering more personable and relatable. According to a Nielsen study, people buy
    products largely for emotional reasons. Whether you’re selling in B2B or B2C environments,
    storytelling offers a cheat code to effectively communicate the worth and emotional
    benefits of purchasing and using our products. As we discussed in earlier sections
    of this chapter, you will be finding ways to emotionally resonate with your end
    users through the elements of your product design. But the storytelling that will
    accompany your product will also be doing that. Having and building on a compelling
    story will make it so that others will truly empathize with what your product
    is trying to do on multiple levels.


    There are also highly practical reasons for investing in storytelling. Through
    the act of listening to a story, we’re able to remember quite a lot more detail
    than we otherwise would if our emotions weren’t engaged. Some scientists have
    discovered that our brain releases chemicals like cortisol, dopamine and oxytocin
    when we’re being told a story. These chemicals help with formulating memories,
    regulating our emotional responses to keep us engaged, and enhancing our empathy
    to help develop and maintain relationships.


    Particularly in the context of AI products, where multiple use cases may be involved,
    building on storytelling is a way for us to ensure that customers not only understand
    our products but can see them playing out in multiple contexts. Not only that,
    but they’ll find those varying contexts memorable as well. We’ve discussed the
    ethics of maintaining AI products throughout this chapter, and storytelling is
    also an excellent way to create narratives around why this matters to your company,
    brand, and product. Doing so will make sure that your brand perception is tied
    to your commitment to building AI ethically and responsibly.


    Storytelling can be a number of things. It can be your CEO or leadership team
    evangelizing the work your company is doing at conferences and events. It can
    be in the form of blog posts, white papers, special reports, or content on your
    company website/product page. It can be in the way you comment and engage with
    your online community. It can be in your own social media strategy, language,
    and posts. Or it can be baked into the product design and user experience itself.'
  merge: -1
  img_proc: true
- pgno: 245
  md: 'Now that we’ve talked about the benefits and dynamics involved in storytelling,
    let’s see them applied across the product design itself. Incorporating storytelling
    elements will help with a number of things: communicating the value and relevance
    of your product, engaging your user and customer base, and offering an emotional
    connection to those who are engaging with your product. Building a narrative that
    brings your customers and users closer and keeps them engaged will ensure that
    you nurture a loyal following for your AI product. Let’s explore what storytelling
    elements might look like when they’re embedded into your product design efforts.
    One of my favorite products to use is Duolingo, and I will use the app as a positive
    example of how a company can use storytelling in the delivery of their AI product.


    # Set the stage


    Duolingo is consistently creating narratives around why the product exists and
    how it helps people. I know why I’m using Duolingo, but I don’t necessarily know
    why or how others are. Setting the stage is important because, experientially,
    it constantly reinforces why something is relevant to me. This kind of framing
    consistently helps me understand the importance of the value of the app. As I
    continue on the app, I am reminded often about how Duolingo is effective for others,
    which percentile I’m in when I complete a task or milestone, and when I’ve hit
    a pain point or a celebratory moment. Context is key, and while these narratives
    are not too overwhelming or constant, they consistently remind me of my orientation
    within the product.


    # Characters


    We see this with AI products all the time. Whether it’s a chatbot feature or a
    voice, some sort of character is involved, which anthropomorphizes the AI. In
    Duolingo, there are a number of characters of a variety of ages that come out
    to interact with me, and each brings a different energy or perspective to the
    experience of the product. The diversity of the characters also plays a role in
    the gamification of the app, which is already intrinsically designed to make me
    want to win…and learn French as a consolation prize. The characters also allow
    me to feel like I am indeed playing with a team, and that there are a number of
    other entities that are there to see me succeed. Yes, I can suspend my disbelief
    enough to feed into the fantasy if it means getting to the next level.


    # Progression


    Every good story has a compelling intro, a slow build to a climax, and a resolution.
    You can imagine the unfolding of your product in much the same way as you build
    your design. Perhaps you don’t want to unveil all the features to your users at
    the same time so as not to inundate them with capabilities. Perhaps achievements
    of some kind can unlock other features. If there can be some progression that
    your customers and users experience, it will give off the effect that they’re
    on a journey with you and that their actions and performance during this journey
    matter, that they have real consequences. Preventing overwhelming cognitive load
    is tricky with all tech products, including AI products.'
  merge: -1
  img_proc: true
- pgno: 246
  md: 'In our Duolingo example, the app does this expertly by showing me exactly what
    steps I have coming up in my journey. I can see all my learning courses outlined
    as a step-by-step roadmap. I can decide how fast I want to go and see what’s coming
    up as I advance. Bringing the users on a journey like this also contributes to
    periods where they are delighted and surprised by what they discover or unlock.
    That boosts engagement as well. The progressive quality of storytelling in your
    product design process will also capture a user’s milestones as they continue
    their journey. Building narrative components for when your users hit a goal, meet
    a requirement, celebrate the completion of something, hit periods of difficulty,
    or are given feedback to help them improve are all ways you can demonstrate the
    progression they’re experiencing as they continue to use your product. It also
    communicates that you understand them as a user and as a person.


    # Knowledge


    Building a strong knowledge base that communicates the intended use and special
    perks of your product experience is also key to boosting engagement. Particularly
    early on, when your customers and users are onboarding or when they become part
    of a bustling community, you’ll want there to be enough material about your product
    design, UI, and UX to keep those who are knowledge-hungry fed. Keeping a robust
    knowledge base is a way of keeping the storytelling alive with your user base.


    In the case of Duolingo, there are a number of articles, resources, and sections
    that cover various areas of learning a language, and they make a point of alerting
    me when there is something new on the app. We touched on documentation earlier
    on in the chapter and this is an extension of that. All customer-facing resources
    and documentation are opportunities for you to announce new features, highlight
    core offerings and concepts, and reinforce important interactions that you want
    your users to be having. Having tutorials or onboarding materials that can be
    ingested as stories will enable your users to learn and remember and reinforce
    why your brand and product matter to them.


    # Call to action


    Often, AI products include some sort of call to action at the end. Perhaps it’s
    a recommendation, a next step, or an explanation of some deterministic quality
    it’s made. You can use narration when delivering a call to action to your customers
    to give them more context and better explain why your AI has come to that decision.
    This does two things:


    +   - It makes AI-based determinants more human and understandable.

    +   - It offers your customers and users more of a reason to believe in your product.


    Because building trust is so important with AI products, particularly now when
    fears of AI going wrong are still alive and well with so many, building narration
    into all aspects of communication with your customers and users is a way to reinforce
    that trust you’ve spent so much time building! Duolingo offers a number of ways
    to spring you into action. They might have you on a friend quest, so you’re galvanized
    by beating a friendly adversary. If you’re making certain mistakes often, they
    give you a brief window of time to understand a concept before giving you the
    next lesson. If you are progressing well, they also alert you to potential new
    awards and badges you can receive if you keep up the good work. All these are
    ways where AI features and mechanisms powering an app can be used to influence
    behavior.'
  merge: -1
  img_proc: true
- pgno: 247
  md: "# Case study\n\nUsing our case study example of Waterbear, we see a number\
    \ of these storytelling elements alive in much the same way as Duolingo. The Waterbear\
    \ founding team wanted to offer an experience that was gamified for users, particularly\
    \ because they felt this would help balance some of the heavier aspects of using\
    \ a mental health app. Though gamification works and can promote engagement, as\
    \ we’ve seen with Duolingo, it also has the capacity to detract from an app experience.\
    \ The founding team found early on that their first iteration of the product actually\
    \ wasn’t resonating well with end users because they felt the gamification was\
    \ too lighthearted for what the app was intended to do. The feedback was overwhelmingly\
    \ that although they appreciated that the app “encouraged” you as if you were\
    \ playing a game, it felt tone deaf. Users were, after all, not playing a game\
    \ but instead sharing deep, emotional, and sometimes overwhelming topics with\
    \ a conversational AI that was trying to get to know them. This was one of many\
    \ product design lessons learned for Waterbear.\n\nLet’s explore some of the lessons\
    \ learned based on the product design elements from earlier in the chapter:\n\n\
    +   1. Start with understanding the end user—really!\n+   \n+   Initially, the\
    \ Waterbear founding team had lofty dreams of completely outsourcing mental healthcare\
    \ to AI. AI was the silver bullet and they overidentified with the hype! They\
    \ thought their product could solve the issue of there not being enough therapists\
    \ in the world and the high demand for support for mental health needs. But it\
    \ turns out that replacing a human therapist isn’t really all that easy. There\
    \ are a number of therapeutic disciplines a professional can build a career in\
    \ and one model couldn’t possibly account for them all without contradicting itself.\
    \ Eventually, they started talking to real potential end users of Akeira and found\
    \ something quite surprising, which allowed them to define the problem more easily.\n\
    +   \n+   2. Define the problem before it defines you.\n+   \n+   What they discovered\
    \ was that none of the potential end users actually wanted to replace their therapists,\
    \ or use Akeira in place of a therapist. All they wanted out of Akeira was a friendly\
    \ ear and a place to centralize all their mental activities. They didn’t want\
    \ to be diagnosed or psychologized. They just wanted a safe place to share. One\
    \ of the resounding pain points was that it was hard to have a consistent place\
    \ to just voice mental health concerns and try to make sense of them.\n+   \n\
    +   3. Experimentation: Start with a few prototypes and then settle on one.\n\
    +   \n+   Defining the problem through a more user-centric lens helped inform\
    \ the Akeira product team on the kinds of solutions they could experiment with\
    \ and validate before arriving at a final prototype. But they settled on an Akeira\
    \ prototype too quickly, without bringing in enough diverse perspectives and considering\
    \ at least two or three prototypes. The first prototype had a journaling function,\
    \ a dashboard function, and a chat function. Given this level of complexity for\
    \ the first prototype, it was hard for the product team to get consistent feedback\
    \ from beta testers."
  merge: -1
  img_proc: true
- pgno: 248
  md: 'Here is an example of a wireframe Akeira''s product team produced to build
    the final prototype:


    ![](img/a0c9f9a2ba06a06d309ce21d890a47c6_248_0.png)


    Figure 9.2: Reference wireframes for Akeira


    4. Validation: Testing assumptions.


    Some users found the chat function really helpful but the diary function awkward.
    Some liked the dashboard but others found it confusing because they felt it wasn’t
    clear or deterministic enough. One of the most resounding pieces of feedback from
    Akeira’s beta testing group was that they wanted Akeira to serve as a companion
    tool they could share with a therapist or a loved one if they wanted to open up.
    This was still pretty early on and the company still did OK along its product
    design journey, but it’s a great reminder of what can happen when certain assumptions
    are made too early on before proper vetting from real end users.


    5. Iteration is key.


    When it set out to launch its flagship product Akeira, the leadership and product
    team at Waterbear knew that they wanted to go to market with a mental health-focused
    app, but early on they had initially built an MVP in mind with the ChatGPT API.
    What they found after a few different iterations of the product using other foundational
    models by other companies (LLMs) was that performance was improved by the BERT
    model compared to ChatGPT’s model.'
  merge: -1
  img_proc: true
- pgno: 249
  md: 'They found more hallucinations with ChatGPT than they did with BERT and decided
    to go for the more conservative model given the subject matter was mental health
    focused. They didn’t want the model to say anything sensationalizing or triggering
    to someone who was being vulnerable with their technology and trusting their product
    design choices.


    6. Aesthetics don’t have to be decided internally.


    The Akeira product team also wanted to include some of their product decisions
    on their blog so that the loyal community they were building was let in on some
    of these decisions. The choice to do so was twofold: they could show off their
    company’s transparency as it relates to AI and it would also allow them to get
    an early signal from eager customers who wanted to be a foundational part of the
    building process. It turned out that their online community appreciated the transparency
    so much that they started recruiting more potential customers by sharing the insights
    on social media. Akeira was able to double its **monthly active users (MAUs)**
    within three months following that blog post.


    Partly, it came from customers feeling let in on a secret. They felt trusted and
    appreciated enough by receiving a special blog post about it. But they also felt
    like it was an opportunity to learn. By posting that blog that day, they felt
    their intelligence was being complimented, not insulted. These were not end users
    who were particularly interested in AI, but the candor actually got them interested
    in not just AI but Waterbear itself. By identifying so much with the brand and
    feeling like they were let in on a secret garden of possibilities, they found
    themselves more loyal to the company. Other companies might not have chosen to
    be so transparent, but in the case of Waterbear, it had a galvanizing effect especially
    because it is so rare.


    7. Documentation: Including your customers in documentation and product design
    choices can pay off.


    Part of the hype that came from the blog initiative mentioned earlier bled into
    potential new product areas for Waterbear. Eventually, there was enough discussion
    around the company and its product choices that potential customers outside of
    Akeira’s demographic were asking for their own products. Akeira was built for
    and targeted women over the age of 18, but some of the online discourse came from
    men as well as girls under the age of 18. Waterbear hasn’t launched any new products
    yet, but it has begun the research phase of its product design lifecycle to begin
    developing new products for girls and men. Preliminary discussions have begun
    for boys under the age of 18 as well, but no product design activities have begun
    in that area yet.


    In the end, the Akeira product team found a way to beautifully balance the unknown
    with the constants they reassuringly came back to. They knew from the beginning
    that they wanted to build a product experience around real value and wellness
    for their users. They also had the humility to keep coming back for feedback and
    iteration until they felt they had accomplished that.'
  merge: -1
  img_proc: true
- pgno: 250
  md: '# Summary


    In this chapter, we covered the various stages of product design to cover the
    foundational design elements that will inform how an AI product will be conceptualized
    and brought to market through the development of a prototype. We also covered
    the areas that make AI-native product design especially challenging, focusing
    on the specifics of bringing forth solutions that are user-centric, as well as
    the ML and explainability challenges. We discussed what AI PMs can do to ensure
    they stay clear and consistent with their objectives as they’re going through
    the product design process and finished with a discussion on storytelling and
    the role it plays in influencing product design. These are all relevant factors
    that will play a vital role in ensuring your nascent AI product’s success and
    adoption because they help communicate who your product is for, as well as the
    story of how it will help them along their journey.


    Product design is about building a blueprint that will grow into a fully developed,
    managed, and mature product over time. This was a dense chapter that set the stage
    for the next phase post-prototype launch: establishing performance metrics for
    your prototype. These are metrics you will be incorporating once you’re ready
    to build your fully fledged product and enter the development cycle.


    # References


    +   - *The neuroscience of storytelling:* https://neuroleadership.com/your-brain-at-work/the-neuroscience-of-storytelling/

