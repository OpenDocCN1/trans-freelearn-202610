- pgno: 391
  md: 'The following is a list of recommended feedback loops and best practices to
    ensure you’re maintaining proper product alignment on an ongoing basis:


    +   - **User feedback:** Whether you’re achieving this through ongoing formal
    **user experience (UX)** research surveys and user interviews or informal in-app
    surveys and polls, your goal is to amass user opinions on the AI features you’ve
    added and their effectiveness and to analyze those findings in a way that’s meaningful.
    Finding ways to incorporate feedback in small ways like rating features or reporting
    issues directly in your platform with minimal keystrokes also goes a long way
    to serve as an early signal and pulse check on how your new features are being
    received by your users. Consider your user feedback data as the tip of the iceberg.
    Often, users may not have the exact words to articulate what they truly need and
    feel. So, when you do get any feedback, know that what is being communicated at
    all is significant.

    +   - **Analytics:** If you can set up product analytics to understand how users
    are behaving in-app, you can make determinations without necessarily needing to
    engage directly with users. This shouldn’t replace direct user feedback, but it
    should be a complimentary feedback mechanism. If your analytics can corroborate
    the story coming directly from your users, you have proof you can rely on for
    years to come. Monitoring behavioral analytics and feature adoption rates will
    allow you to see which AI features are being celebrated and which are being ignored
    so that you can make more informed decisions later. Analytics help you understand
    which features and capabilities are truly being valued the most because they’re
    based on actual behavior in the app.

    +   - **Support data:** Particularly early on in post-launch, you should keep
    a strong focus on complaints and issues being flagged up to support. Customer
    service interactions and support tickets show you where your product experience
    is most confusing. If a user is taking time out of their day to write a ticket
    or call your customer service number, that’s significant. As a user, I personally
    avoid having to talk to anyone if I don’t have to. It’s unpleasant to have to
    face drawbacks and limitations in your product, but the earlier you can catch
    them, the sooner you can limit the risks of an AI feature gone wrong. As an AI
    PM, you won’t be responsible for responding to support tickets, but you should
    take an interest in understanding what issues your users are consistently coming
    back to complain about the most. Analyzing the content from support tickets and
    customer service interactions is a good way to find common issues and concerns
    that have been introduced into your product experience as a result of the AI transformation.
    This then gives you an opportunity to address these concerns through marketing
    collateral, thought pieces, or, at the very least, an update to your product’s
    FAQs or knowledge base.

    +   - **Competitive feedback:** Staying informed on how your industry is evolving
    with AI is important for maintaining market alignment. Conduct market research
    regularly to understand what features your competitors are adding to their products.
    Make sure your ongoing AI features are competitive and relevant. This doesn’t
    mean you have to do what your competition is doing. It means you’re remaining
    aware of how their actions compete with yours. If you can position your product’s
    AI features and performance against others in your competitive landscape through
    the use of benchmarking standards, even better.'
