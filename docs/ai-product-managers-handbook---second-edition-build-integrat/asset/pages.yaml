- pgno: 317
  md: 'AI shouldn’t be a silver bullet. Slapping on an AI tag just for the sake of
    a competitive marketing edge is not a strategy for success because if AI is not
    significantly improving your product and is only included as a vanity feature,
    you’ll eventually find yourself outperformed by products that do leverage AI appropriately.
    Understanding which AI features to expand on and how they’re improving your product
    will make your job as an AI PM easier and you’ll understand this better and better
    with time. Use your curiosity and experimentation and take intelligent risks.
    Getting clear on how you can best support your company and what the limitations
    and benefits of AI/ML are will set you up for success in prioritizing features
    and planning product strategy. Understanding the potential harm your AI investments
    might contribute downstream will allow you to build credibility both internally
    within your company and externally within your industry.


    As an AI PM, you are evangelizing AI for your organization. A big part of this
    indirect influence is actually creating awareness and understanding the growth,
    the risks, and the inherent opportunity AI offers not only to your product and
    business but to other stakeholders you work with regularly as well. All roles
    will be impacted by AI with time. You’re just ahead of the curve, in a sense,
    because your role is most intimately connected with AI and its potential and you
    can use this firsthand knowledge to guide your peers through this transformation
    as well.


    # How LLMs are evolving and the rise of open source LLM capabilities


    With the rise in generative AI and large language models (LLMs), we’re getting
    close to a mass market adoption of AI in a way we haven’t seen in prior years.
    OpenAI was founded in 2015 and it took them almost 7 years of research and development
    before they released the first version of ChatGPT. But LLMs have been in the works
    for some time. Prior to the LLMs we know of today, there were many early language
    models by other names:


    +   - **N-gram models** have been able to predict the next word in a sentence
    since the early 2000s.

    +   - **Feed-forward neural networks** have worked as probabilistic language models
    since 2003.

    +   - Two of the models we covered in *Chapter 1*, **recurrent neural networks
    (RNNs)** and **long short-term memory (LSTM)** models, have been able to handle
    longer sequences of prompts and responses since the mid-2010s.

    +   - **Transformer** models came out in 2017.

    +   - Transformers laid much of the groundwork for enabling larger pre-trained
    models like Google’s **BERT** and OpenAI’s **GPT** series that came out in 2018.


    Now that these pre-trained models have gotten us to the point where we can see
    how far we can take the tech, the emerging trends are more focused on specializing
    these capabilities and maximizing efficiency. We’ve already seen products come
    into the market combining text, image, audio, and video capabilities, but we’re
    also seeing models that are able to match the performance of larger models, but
    with a fraction of the parameters or compute LLMs need.'
  merge: -1
  img_proc: true
- pgno: 318
  md: 'For many companies, one easy way for them to incorporate LLMs into their business,
    online experience, or offerings is to offer a chatbot. This has led to the practice
    of companies bolstering pre-trained models with knowledge bases and specialized
    domains and tasks. Adapting LLMs and improving their fine-tuning will take us
    further as their capabilities are harnessed in more focused ways.


    We don’t yet fully know how this adoption will impact markets. For some, the threat
    of generative AI models, including LLMs, is existential. Others see LLMs as a
    tool they can use to make their jobs easier. We know it will support workers across
    a variety of jobs, and that it will make workers who use generative models more
    productive. But we still don’t know to what end.


    Many companies today are using the hype of LLMs as a way to take agency away from
    workers, in some cases downsizing. Some are encouraging their employees to use
    generative models while others are penalizing their use. We’re still very much
    at the onset of generative adoption but if we take a look at the numbers, adoption
    is staying strong. According to an article by iOPEX, “67% of organizations have
    incorporated LLMs into their workflows and are utilizing GenAI capabilities to
    unlock unprecedented insights, automate tasks, and optimize processes.” Another
    company, called Amperly, conducted an LLM survey and found that 37.3% of participants
    use AI tools like ChatGPT for work every day. Almost half, about 46%, said they
    use them a few times a week.


    LLMs are still making their way through the hype cycle, and even OpenAI struggles
    to keep users coming back after the initial excitement wears off. We don’t know
    what sustained use will look like, but we do know that tools like this are primed
    for open source communities to flourish and find innovative ways of pushing LLM
    capabilities further. Communities like Hugging Face, EleutherAI, BigScience, Turing-NLG,
    Cohere.ai, Stanford NLP Group, and the OpenAI GPT API community are all encouraging
    new concentrations of innovation to happen in their own way.


    These are spaces where repositories of pre-trained models, collections of datasets
    for training and evaluating models, discussion forums, GitHub repositories, research
    projects, Discord servers, API access resources, workshops, events, documentation,
    educational resources, and libraries can all be found for AI practitioners to
    play with. As we inch closer to the next frontier of LLMs, many of the next innovations
    are likely to come from open source communities. So far, they’ve achieved the
    following:


    +   - They’ve helped democratize these technologies so that we can advance faster
    than we have before.

    +   - They’ve made a variety of models and resources listed above more widely
    accessible to more people and they’ve shared the burden of cost by providing access
    to pre-trained models, something that would have been hard to access before.

    +   - They’ve also allowed for fast prototyping, so if you have an idea you can
    validate that idea with others quickly and get feedback to iterate on the next
    version.

    +   - Open source communities have also allowed for diverse uses of LLMs. Because
    of the nature of models being developed in various languages or domains, they’ve
    allowed for more creative uses of LLMs to emerge.'
  merge: -1
  img_proc: true
- pgno: 319
  md: '+   - Open source communities shine a light on innovation because there are
    simply many eyes on it and their work is published publicly. Because many open
    source projects adhere to and promote AI practices that are ethical, they’re able
    to influence the broader AI landscape for good.


    The important thing to remember is the availability of these tools won’t go away
    any time soon. Bringing more transparency and ethics to this space will allow
    for future use cases that are brought to market through community oversight and
    collaboration. If knowledgeable communities working on generative AI innovations
    can come together to help audit, identify, and address biases, we can explore
    future AI potential more safely. Investing in open source communities with your
    time, knowledge, energy, and ideas makes it so that the next generation of technologists
    will have a broader set of use cases and applications to work with as they dream
    up new possibilities with AI. We’re also likely to see new start-ups be nurtured
    through open source communities, competing with the larger monoliths that have
    a chokehold on AI innovation today. If the future of LLMs is open and diverse,
    this will yield great things for the market.


    # Case study


    In this case study, we will take a look at a fictional green tech company called
    GreenCo123, which specializes in optimizing energy consumption in commercial buildings.
    They’re working on developing the next generation of their energy management system,
    GridOS. This latest version will include AI features. The goal of this evolving
    product is to help businesses reduce energy costs, lower carbon emissions, and
    improve building sustainability by predicting energy demand and automating HVAC
    systems, lighting, and other energy-intensive operations.


    GreenCo123 looked into the following features for bolstering GridOS with AI capabilities:


    +   - **Energy demand forecasting**: Time-series analysis and predictive modeling
    were done using LSTMs to handle time-dependent data used for predicting the energy
    demand of a building based on historical usage data, occupancy patterns, and operations
    schedules. This internal data was appended with external data like weather forecasts.

    +   - **Automated energy control**: Reinforcement learning models were used to
    dynamically control HVAC systems, lighting, and other devices to optimize energy
    consumption across all occupancy levels.

    +   - **Anomaly detection**: Unsupervised learning models were used to detect
    anomalies in energy usage to help find equipment malfunctions or trigger unusual
    consumption patterns, which enabled proactive maintenance.


    # Implementation


    Initially, GreenCo123 partnered with a green tech consultancy to help them understand
    their options for how they can make GridOS significantly more robust to be able
    to compete in their new AI-evolved marketplace. From there, they also worked with
    this green tech consultancy to define the system requirements they would need
    to enable the AI features they identified together. They also collaboratively
    developed the system architecture, the data pipelines, and the ML models that
    would initially be used to power the features above with their staff data scientist,
    along with other stakeholders at the company.'
  merge: -1
  img_proc: true
- pgno: 320
  md: 'Once GridOS was up and running and deployed on a few pilot buildings, GreenCo123
    onboarded an in-house AI team to support the AI system they created and to further
    develop and support the needs of GridOS. They already had a data scientist with
    domain expertise in green energy on staff to sign off on the models used for each
    of the features and to work with the consulting company, so handoff was relatively
    seamless. But once deployment on the pilot locations started, they went forward
    with their team-building strategy, which happened in tiers:


    +   - **Tier 1:** Post-pilot, there was a core team to handle the day-to-day operations
    of GridOS composed of the data scientist they had on staff, a data engineer to
    maintain the data pipelines, and an engineer to maintain the pilot program of
    GridOS. They also hired an AI PM to handle all these activities and bring focus
    and intention to GridOS.

    +   - **Tier 2:** As they were scaling, the team grew the data science and ML
    engineering headcount to handle the scale of the models and of the deployments
    across multiple buildings and locations.

    +   - **Tier 3:** In the third tier, they had individual teams to support activities
    for each of the main features discussed earlier. One team was focused on predictive
    modeling for energy demand forecasting, another on the automated control reinforcement
    learning models, and a third on anomaly detection activities.


    # Risks


    Integrating AI was a calculated risk for GreenCo123, which had to set aside funding
    for the green tech consultancy as well as for the data engineering, preparation,
    and infrastructure development needed to support the AI features they wanted to
    implement in GridOS. Here are the risks that could have potentially impacted the
    next gen of GridOS and how the AI PM handled this added complexity:


    +   - **System reliability and safety:** The automated energy control feature
    posed an issue for GridOS. What if it malfunctioned or risked exposing occupants
    to suboptimal conditions? The AI PM had to get ahead of that by not only implementing
    testing procedures that were rigorous and thorough but also introducing a manual
    fallback mechanism so that the AI system could be overridden easily in the event
    of an issue.

    +   - **Data quality and standardization:** Because so much of the data needed
    to run GridOS came from different buildings that had data that had varying degrees
    of data uniformity, the AI PM had to make sure there was a robust data governance
    framework in place. This allowed the data flowing from multiple sources to be
    standardized and cleaned before being introduced to models for training.

    +   - **Adaptability:** Each of the buildings GridOS was managing had its very
    own energy usage patterns, signatures, and equipment. The AI PM worked ahead of
    these issues by working with the ML engineers to prioritize the development of
    adaptable models that could be easily customized for each building.'
