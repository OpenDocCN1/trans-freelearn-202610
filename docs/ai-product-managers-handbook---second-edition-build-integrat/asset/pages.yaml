- pgno: 175
  md: '# AI outputs


    With regard to Waterbear’s Akeira product, user journals are recorded and integrated
    into a dashboard the user is able to reference as they’re going about their day.
    The following is an example of what that might look like in the app:


    ![](img/a0c9f9a2ba06a06d309ce21d890a47c6_175_0.png)


    Figure 6.2: Akeira dashboard with journal and personal data


    Because the app is a consumer-facing mobile app, the text that would be shared
    by an end user would be analyzed and keywords would be selected. The app would
    first aim to understand the end user in the form of a chat, so Akeira’s first
    objective of making sure the person they’re talking to is seen, understood, and
    validated is achieved. NLP models would analyze not only the text explicitly shared
    but would also be connected with social media and other text inputs if the user
    wants it to establish a holistic understanding of how they’re doing. These would
    be the inputs.


    The outputs that a consumer would see would be shown between a toggle between
    the dashboard and the goals modules. The dashboard module would be able to show
    various metrics you might use to gauge your overall health and well-being. An
    overall Akeira score would be shared as a visual indicator of your overall emotional
    state over a specific period.'
