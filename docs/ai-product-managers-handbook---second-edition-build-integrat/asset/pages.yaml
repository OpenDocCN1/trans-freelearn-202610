- pgno: 296
  md: 'This was a foundational part of how the company started; the founders knew
    they wanted to use AI in a psychological and mental health context. The company
    mission was simple: “Know thyself with the help of AI.” It was often a part of
    their marketing campaigns and pitch deck. They wanted something that resonated
    with a deeply unsettled population, especially women who faced challenges in balancing
    work and personal life. This was particularly relevant in a society where women’s
    rights were under scrutiny and they were increasingly taxed without full bodily
    autonomy. For this reason, Waterbear crafted the following product vision statement
    to center its AI products around: “Waterbear uses AI to empower individuals globally,
    offering insights that unlock deeper self-understanding and personal growth.”


    Waterbear wanted the focus of their product vision statement to emphasize empowering
    individuals to convey a sense of agency and personal strength, as well as the
    global nature of the problem they’re looking to solve. Highlighting insights and
    deeper self-exploration reflects the core purpose of the product, which is to
    fuel significant personal revelations in a way that’s self-directed. The aspirational
    part of the statement resonates from the focus on personal growth, which is a
    journey that never really ends and can look different for everyone. It’s also
    concise, clear, and easy to remember and communicate across channels.


    The ramifications of that, exacerbated by a mental health crisis from the pandemic,
    created an environment where Waterbear’s founders were ready to go all in on their
    product vision and start to build out the team for Akeira, their flagship product.
    The founding product team for Akeira wanted to focus on the core competencies
    of the AI PM role: AI literacy, communication, market research, user research,
    strategic thinking, analytics, leadership, customer engagement, and collaboration.
    In that spirit, one of the first things they did was conduct user research trials
    and begin the work of scouting therapists that they could start working with.
    Once they had this team, they began the iterative work of trial and error to discover
    what combination of factors would result in the best product experience for their
    users.


    The product (Akeira) aligned with the company’s vision and mission. It helped
    women specifically know themselves and empowered them to reach their goals faster.
    Waterbear knew this was only the beginning, so the goal was to capture more groups
    of users and offer them an AI of their own to connect with eventually. They knew
    they wanted to learn from the experience with Akeira, and to get her to a point
    where they could launch an MVP that they would be proud to share with their beta
    users. Once they did, they knew their product team and greater organization would
    put in the dedication to serve a loyal customer base. Post-launch, a beautiful
    journey of discovery began.


    The following is a list of the most significant actions from the founding product
    team as they began this journey, along with their impact:'
