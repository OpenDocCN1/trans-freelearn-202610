  md: '# Part 3


    # Integrating AI into Existing Traditional Software Products


    Many companies will embark on the journey of integrating AI and ML into their
    existing traditional products because of the potential competitive advantage and
    strategic influence AI can provide across industries.


    The third part of this book will focus on evolving existing software products
    that don''t currently use ML or DL to leverage AI. In the previous part, we discussed
    building an AI-native product and how the process unfolds in a way that''s optimal
    from a data, company, and strategy perspective. Using this same lens, we will
    now compare and contrast how this process unfolds for products that don''t currently
    leverage AI. By the end of this part, we''ll understand the impact AI is having
    on individual companies and the industries they''re a part of. We''ll also see
    how product design and product management are impacted with the introduction of
    AI features and capabilities for products that have already been launched prior
    as traditional software products. Similar to Part 2, we will contextualize these
    concepts through different case studies in this part.


    This part comprises the following chapters:


    +   - Chapter 12, The Rising Tide of AI

    +   - Chapter 13, Trends and Insights across Industry

    +   - Chapter 14, Evolving Products into AI Products

    +   - Chapter 15, The Role of AI Product Design

    +   - Chapter 16, Managing the Evolving AI Product'
