- pgno: 270
  md: 'Given the high cost of operating, you''ll want to be sure that your product
    serves the needs of your market and your customers as quickly as you can. Keep
    in mind that your costs are likely high when managing an AI/ML program, but they''re
    also dependent on how many AI features you''ve built into your product, particularly
    if the underlying logic powering your product as a whole is driven by AI/ML. The
    longer you operate in the dark, the more resources you''ll spend on your product.
    This means you''ll know later rather than sooner whether it resonates with your
    customers.


    Let’s first start with the cost of AI/ML resources themselves. According to WebFX,
    most AI consultants charge between $200-$350 an hour and the cost of a custom
    AI solution is anywhere from $6,000 to $300,000. Using third-party AI software
    instead can cost anywhere from $0 to $40,000 annually. Real costs are subject
    to change based on the availability of talent, reputation, and location, but these
    are reliable ballparks for now.


    It might be tempting to build an AI/ML-native product around consultants, but
    it’s not the best practice. As soon as something goes wrong, you''ll spend copious
    amounts of money fixing even modest problems. If you want to hire someone in-house
    and avoid having to use outside help, you''re looking at an average salary of
    $160,000+ for an ML engineer in New York City. If you want someone to manage a
    team of ML engineers, you''re looking at an average salary of $200,000+ in New
    York City.


    Then, there''s the AI enablement tech stack. Running, maintaining, training, querying,
    storing, and processing data and AI systems all have costs associated as well.
    That doesn''t include many of the growth-hacking tools we have already mentioned,
    which all vary in price as well. Managing all the various vendor relationships,
    contracts, pricing bands, and caps so that your usage doesn''t grow astronomically
    will probably warrant its own head count on top of it all. Managing AI/ML infrastructure
    and empowering a product team to scale and grow to meet the market that it services
    is an expensive endeavor, but that doesn''t mean it''s not worth the pursuit!


    > We’re not going into too many specifics here since your AI strategy will largely
    determine which tools, platforms, partners, and roles you hire for. You’ll collaborate
    with key stakeholders to decide on suitable options based on your specific use
    case and budget.


    # Case study


    Let’s now return once again to our Waterbear case study to see a practical example
    of how benchmarking, performance, growth hacking, and costs are balanced for the
    production of their flagship product, Akeira. Earlier in this chapter, we looked
    at a list of KPIs and value metrics. In this section, we will be expanding on
    some of these metrics and discussing how these metrics were vetted, selected,
    and prioritized. We will also go into the OKRs that drove the organization to
    manage the performance of Akeira.


    # North star metrics


    Akeira’s product management team considered a number of metrics to include as
    a north star metric. These metrics included:'
  merge: -1
  img_proc: true
- pgno: 271
  md: '+   - Engagement metrics like **daily** and **monthly active users** (DAU and
    MAU)

    +   - Interaction metrics like frequency of use and number of entries per user

    +   - Quality metrics like user satisfaction and recommendation relevance

    +   - Impact metrics like self-reported outcomes


    But, in the end, they chose a metric that strongly aligned with the mission and
    values of the company for their north star metric: the **monthly mental health
    improvement index (MMHII)**. This also aligned with their product strategy, which
    was to allow the experience of Akeira to be product led. For Akeira, that meant
    gathering in-app feedback based on how the product was functionally improving
    the lives of its users.


    Waterbear’s founders wanted to choose a north star metric they could base their
    product decisions on, and they set out to create the company for the express purpose
    of improving the lives of the users. They demonstrated this when choosing their
    north star metric, which revolved around a personal MMHII as well as a collective
    MMHII.


    This choice was also strategic in the sense that it separated the in-app experience
    from outcomes and well-being. All tech companies want to build a world-class app
    experience based on user preferences and behavior that keeps users coming back.
    But what does it mean to have an amazing app experience if it doesn’t functionally
    improve the lives of its users? Choosing MMHII meant that they were prioritizing
    proven outcomes above the in-app experience. Doing so also meant that they could
    align their internal decision-making and external communications around proven
    mental health outcomes, which resonated highly with their customer and user base.
    They were speaking directly to their community by doing this.


    # KPIs


    Other KPIs that were heavily tracked were user engagement, user interaction, quality,
    impact, and retention metrics. These metrics were able to split the product experience
    into various areas to assess performance and success, and to help provide early
    signals when the product was in danger of suffering in one of these areas. Each
    of these areas also adheres to the positioning of the north star metric. If users
    are not engaged with the product and if they’re not interacting with it regularly,
    they won’t see a positive outcome in their mental health given the nature of feedback
    loops that impact our mental health positively.


    If the quality of the interactions they’re having in the app aren’t high, their
    engagement will suffer. If the impact of their mental health improvements can’t
    be quantified and defined in various areas, we can’t claim to be impacting their
    MMHII positively in a meaningful way. Finally, if users can’t be retained, that
    also means their mental health will not be served. The operative word here is
    “served.” If your KPIs are not in service to your north star metric, they will
    only represent superficial successes and should be considered vanity metrics.
    Vanity metrics might fool an immature investor and build short-term success, but
    they’re not a strategy for sustainable growth.'
  merge: -1
  img_proc: true
- pgno: 272
  md: 'Here is an overview of the established Akeira KPIs we saw in this chapter,
    from a product perspective:


    +   - **User engagement metrics:** Engagement metrics allowed the product team
    to prove Akeira was product led because they established a pattern of behavior
    of users returning to the platform for sessions. A steady increase indicated onboarding
    was effective and that users were finding consistent value in the app. Longer
    sessions showed that users were finding the content and features engaging. Frequency
    of use was helpful for the Akeira product team to segment various types of users
    and to work on more personalized experiences for users of different ages and backgrounds.
    Here are some metrics in this category:

    +     - **DAU/MAU:** The number of unique users who journaled with Akeira on a
    daily/monthly basis

    +     - **Session duration:** The average time each unique user spent on the app
    for each session

    +     - **Frequency of use:** How often they came back to the app over time (daily,
    weekly, monthly)


    +   - **User interaction metrics:** User interaction metrics helped the product
    team demonstrate product effectiveness. They cross-referenced these users with
    those who submitted support tickets to confirm that the app intuitively guides
    most users, retains users, and promotes organic growth demonstrated by the retention
    rate. Tracking the number of entries helped confirm the app was helping users
    develop a journaling habit that served the north star metric, and the average
    length of entries demonstrated the depth with which users were connecting with
    Akeira. Here are the key metrics in this category:

    +     - **Number of entries:** The number of journal entries created by each Akeira
    user

    +     - **Average length of entries:** Average word and character count for each
    journal entry for each Akeira user

    +     - **Retention rate:** The percentage of users who continued to use Akeira
    over time (daily, weekly, monthly)

    +     - **Support ticket frequency:** The number of support tickets opened by
    active users


    +   - **Quality of interaction metrics:** Quality of interaction metrics centered
    around proving the efficacy of the ML models that were powering Akeira, most notably
    NLP models and the recommendation engine that powers suggestions. These metrics
    also helped confirm user trust in Akeira’s AI capabilities. High user satisfaction
    metrics meant that the app had referral potential, increasing the likelihood that
    users would recommend Akeira to friends, which also furthers organic growth. Key
    metrics in this category include:

    +     - **User satisfaction:** Built off an in-app survey to measure user satisfaction
    and how likely each user was to recommend Akeira to their friends.'
  merge: -1
  img_proc: true
- pgno: 273
  md: '+   - **NLP analysis accuracy:** These metrics were built on the reward systems
    in the NLP that underlie Akeira. They measured how accurate Akeira was at sentiment
    analysis, topic extraction, and entity recognition for each user.

    +   - **Relevance of suggestions:** These metrics graded the performance of Akeira''s
    suggestions or prompts to users as they were reflecting.

    +   - **Impact metrics:** Impact metrics are aptly named because they made the
    greatest impact on the MMHII, which helps Akeira deliver on its promise to users.
    This is because demonstrating user transformation was essential to proving meaningful
    improvements. Self-reported outcomes also added qualitative data to add depth
    to quantitative metrics like the MMHII, much of which was organized and analyzed
    for building compelling marketing stories and messages. Let''s look at the important
    impact metrics:

    +     - **Established behavioral changes:** These metrics captured changes in
    the users'' behavior, attitudes, or emotions over time based on the analysis in
    the journal entries. They were reinforced and confirmed by the users.

    +     - **Self-reported outcomes:** During the confirmation process for the above
    metrics, users were asked for open-ended feedback for further context on the perceived
    impact of journaling on their well-being, self-awareness, and personal growth.

    +     - **Goal achievement:** Though Akeira tried to recommend and notice goals
    on its own, these goals were confirmed by the user. Once they were confirmed,
    Akeira worked to substantiate progress toward those goals based on the journal
    prompts and, once the goals were achieved, Akeira celebrated those achievements
    with its users.

    +   - **Retention metrics:** Retention metrics helped the Akeira product team
    understand which features or challenges customers had that led to them leaving
    the platform so that they could focus on minimizing those challenges for other
    customers. Direct feedback from customers allowed the team to address areas where
    user expectations might have surpassed app functionality. Some critical retention
    metrics are:

    +     - **Churn rate:** The percentage of users that stopped using Akeira within
    a specific period of time (weeks, months).

    +     - **Reasons for churn:** To best inform product improvements and strategies
    for retention, Akeira provided a survey to those who wanted to give feedback to
    help improve the app experience.'
