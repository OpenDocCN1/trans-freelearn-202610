- pgno: 265
  md: '+   - Make sure dashboards can handle your most relevant product KPIs and metrics
    and that custom reports can help you dive deep into certain aspects of user behavior
    and product performance.


    # A/B testing tools


    We’ve discussed the concept of optimization at length throughout these chapters,
    as well as the spirit of experimentation that’s optimal for a growing AI/ML-powered
    product organization. This is perhaps best captured with A/B testing, a concept
    we first introduced in Chapter 1. While there’s a fair amount of comparison when
    it comes to the types of models you might employ when building your product with
    AI/ML features, you will also need to test certain versions of your product with
    different groups. You’ll likely be A/B testing all sorts of things – how your
    product looks and feels, which features you put where, how you guide your users,
    how you track metrics, and which metrics you actually track – to inspire the kind
    of product adoption that will have your audience evangelizing about it on your
    behalf.


    It can be hard to make concrete decisions about what will appeal most to your
    user base when you design a product, particularly when it’s a novel AI/ML product
    that’s being released to the market. A/B testing allows you to collect data on
    which iterations are more successful than others. There are so many routes you
    can take to optimize the use of your product, how personalized it is, and eventually
    decide on which iterations best lead to conversions and further revenue. Investing
    in A/B testing tools not only reinforces a culture of experimentation but also
    helps you track countless tests and stores the insights from those tests for you.


    You can once again choose to send this data out to your warehouse and further
    mine it for insights and append it with other methods of experimentation from
    the other tools in your BI tool, or you can store it on the dashboard of your
    tool of choice. Either way, A/B tools allow you to organize and keep track of
    the results of your efforts, allowing you to do hundreds of A/B tests if you need
    to. You can use these tools to A/B-test anything, whether marketing campaigns,
    features, buttons, links, colors, fonts, or anything that you can derive quantitative
    and qualitative feedback from. Reputable A/B testing tools include VWO, Optimizely,
    AB Tasty, Google Optimize, and Five Second Test. Let’s take a look at a few considerations
    to keep in mind when choosing an A/B testing product:


    +   - Ensure the tool can support various experimentation types to accommodate
    different testing needs.

    +   - Consider options for segmenting users based on behavior, demographics, segments,
    and other criteria to understand the extent of tailoring capabilities.

    +   - Check integrations with personalization activities you might be doing elsewhere
    to see if you can combine efforts within the platform.

    +   - Gauge how much technical expertise is needed for implementation, onboarding,
    and setting up your first experiment and whether you have the in-house expertise
    required to handle it.

    +   - Look at the statistical methods used to analyze the results of your experiments.

    +   - Confirm the sample size minimums for your tests to make sure you can conduct
    experiments that will yield statistically significant results.

    +   - Confirm the tool’s ability to allocate traffic for experiments according
    to your needs during tests.'
  merge: -1
  img_proc: true
- pgno: 266
  md: '# Data warehouses


    A data warehouse is a kind of relational database that allows you to centralize
    data much as a CDP does, but the main advantage here is that it formats, transforms,
    and standardizes that data so that it can be made available for things such as
    the CDPs we discussed earlier, as well as BI tools, which we will look at next.
    You might recall that we covered the importance of data warehouses in Chapter
    1. It suffices to say that you''ll probably need a data warehouse because it serves
    as the backbone of all relevant company data, customer or otherwise. Think of
    it as the main artery that pushes data out to various tools. It will also allow
    you to query the data you have so that you can gain insights from it.


    Your data warehouse will be an agnostic place in which your data will live when
    it''s not actively being called through a direct query or through one of the other
    tools you hook it up to. When you manage a native AI/ML product, you will think
    about the success of your product agnostically as well because, the truth is,
    success comes from a collection of events. Your product needs to be communicated
    about with customers and users, but it also needs to be built in a way that directly
    solves their problems. Your data warehouse will serve as your main source of truth,
    sending data appropriately to the teams that deal with communication, as well
    as to the teams that deal with building.


    Keep in mind that how you store your data is going to be a pretty big financial
    and strategic decision. You might opt for a data lake or other relational/non-relational
    databases that aren''t considered to be data warehouses - folks in other roles
    (like solution architects, data engineers, and consultants) will probably be making
    that call. As an AI PM, we would advise you to be a foundational part of that
    conversation because how and where you store your data will have downstream impacts
    on things such as which other growth-hacking tools you end up adopting and ultimately
    how much insight you''ll be able to gather from your data.


    If your data is in a data lake, you probably won''t interact with it very much.
    Data warehouses are built for the express purpose of refining your data and getting
    it ready to push out to other contexts easily. Reputable data warehouses to consider
    would be Snowflake, Amazon Redshift, Google BigQuery, and Databricks. Below are
    a few considerations to keep in mind when choosing a data warehouse:


    +   - Ensure the data warehouse you intend to use will scale with your data volumes,
    processing needs, and storage needs, particularly if you''re setting one up for
    the first time.

    +   - Have an understanding of how fast you need the query to be, particularly
    if you''re setting it up for advanced analytics and machine learning to inform
    fast decision-making.

    +   - Look for built-in ETL tools to refine your data and, if they don''t exist,
    confirm they have third-party ETL tool integration because you will need to refine
    your data to make it usable for the tables in the warehouse.

    +   - Assess data modeling options to make sure the warehouse will support your
    current data structure, schemas, and querying needs, as well as data types (structured,
    unstructured, semi-structured, etc).

    +   - Understand the total cost of ownership of the data warehouse, which should
    include onboarding, setup, storage, compute, and additional services.'
  merge: -1
  img_proc: true
- pgno: 267
  md: '+   - Ensure compatibility with the BI tools you will be using to extract insights
    from your data.

    +   - Confirm backup and recovery options to prevent data loss in case of incidents,
    outages, or data breaches.


    # Business Intelligence (BI) tools


    While your CDP and your data warehouse organize data in a certain way for you
    to consume, they probably aren’t going to be robust enough for you to explore
    it effectively. While CDPs are nice for establishing some patterns and understanding
    the journey of your personas and so forth, they aren’t intended for the exhaustive
    exploration of your data. You can also technically query data from your data warehouse
    directly, but you won’t visualize or wrangle that data directly in the warehouse.
    That’s where BI tools come in.


    BI tools allow you to take all the data that’s in your data warehouse, data that’s
    coming from all sorts of places, and actually analyze it. The purpose of a BI
    tool is to help you answer important business questions about your data. Data
    itself, lying in a dormant state, is not helpful or insightful. You have to analyze
    it to get the treasure, and in this case, that treasure comes in the form of trends,
    insights, and knowledge. Taking data from a dormant, disparate state, unifying
    it, and processing it is a tedious process that’s very hard to do without a BI
    tool. BI tools also allow you to create dashboards for teams to use so that they
    routinely get a health check on the metrics we outlined earlier in the chapter.


    While your data warehouse might serve as your source of truth, you will use your
    BI tools to understand whether that truth actually reflects reality because it’s
    virtually the only place you can actually see it. With a BI tool, you don’t just
    check the validity and visual expression of your data – you create a system of
    reliance on making data-driven decisions. There will always be an element of risk
    in the creation and expression of a new product or business. You don’t know how
    it’s going to go. BI tools help us see what we do know as clearly as we can and
    help us minimize that risk.


    BI tools aren’t just super valuable internally. They also allow us to make visual
    representations of our data that we can communicate in the form of customer dashboards
    or through marketing and sales collateral about our products. If you create infographics
    and sales decks and drive customer communication that involves charts and graphs
    of your data, they are probably all made through the use of a BI tool.


    In essence, a BI tool works as a refinery for your data so that you can further
    craft the message you want to send out, as well as the message you want to reflect
    on internally. Notable BI tools include Power BI, Tableau, Sisense, ThoughtSpot,
    and Looker. The following are a few considerations to keep in mind when choosing
    a BI tool:


    +   - Assess how user-friendly your BI tool needs to be. Does it need to be accessible
    for people with low technical skill levels, or can it be used by more technical
    members of the team?

    +   - Understand your dashboard, visualization, and reporting customization needs,
    particularly if you have niche or specific needs for your dashboards. Not all
    BI tools uniformly allow you to showcase your data. Certain ones are better than
    others when it comes to how you show data. Take stock of different needs at the
    department level because some departments may have different needs than others,
    but the tool needs to work for everyone.'
  merge: -1
  img_proc: true
- pgno: 268
  md: '+   - Check to see what level of data preparation and cleansing the BI tool
    offers. This will integrate with your data warehouse, and if neither tool can
    support your specific data ETL needs, you’ll need to handle that independently.

    +   - If interactive dashboards and embeddings are important to you, ask about
    how the tool will handle that because these are not default features. If you need
    to drill down into data for deeper insights, you may not be able to with certain
    tools. If these features are available but for an additional cost, understand
    those costs fully.

    +   - BI tools allow data to be shared and exported for various purposes, so understand
    what options you have for sharing reports and dashboards with team members and
    external stakeholders.

    +   - Vet the level of advanced analytics or NLP capabilities your BI tool will
    offer to query your data in the platform, particularly for users that are less
    technical.

    +   - Look for BI tools that have robust communities around them for things like
    user guides, tutorials, and customization tips and tricks from power users. In
    many cases, BI tools do not have a comprehensive, dedicated headcount to help
    you set up these tools if you don’t have the technical capabilities in-house.


    # Growth-hacking tools


    Finding quick success isn’t just the imperative of an AI/ML PM but of all PMs
    and entrepreneurs. Figuring out the best way to make money, increase brand awareness,
    and find quality leads is what growth hacking is all about. Although most products
    won’t go viral overnight, there is some method in the madness of investing in
    the tools we went over in previous sections. They all get you closer to the information
    you need to make present and future decisions in a way that’s informed by what
    works and what your customer truly wants from you.


    You can imagine growth hacking as part of your go-to-market strategy and team
    and, often, it’s discussed as a set of tactics that help scale and grow the adoption
    of your product. The idea is you try a set of practices and techniques to see
    if they have an early impact on your metrics and adoption. You often try a selection
    of strategies to see which is the most impactful, and this includes quite a large
    degree of experimentation. This allows your marketing and business development
    teams to get creative, strategic, and agile with their approaches to their own
    work and gets them thinking outside of the box.


    Growth hacking can mean a lot of things. Sometimes, it may involve using product
    analytics to measure the success of certain strategies against performance or
    engagement. Other times, it could mean testing different marketing channels, messages,
    or social media tactics to see what line of messaging lands best with the customer
    and user base you’re targeting.


    We went over some broad categories of products that certainly help with growth
    hacking and finding success with your AI/ML product previously, but there are
    so many valuable tools out there that don’t fall into those categories per se:


    +   - Products such as Expandi allow you to use LinkedIn for social selling campaigns.

    +   - Crystal Knows uses AI to craft personality profiles to provide insights
    into behavior and sentiments.'
  merge: -1
  img_proc: true
