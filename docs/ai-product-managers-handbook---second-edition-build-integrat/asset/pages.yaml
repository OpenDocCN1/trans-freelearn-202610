- pgno: 220
  md: 'It takes AI for that kind of work because every person that''s using the app
    is different. They say things differently, words mean different things to different
    people, and their reactions or emotions about certain words will even vary from
    day to day. Training an AI that can capture that kind of elasticity, and will
    be able to notice drift and fluctuations from day to day is important. With their
    product Akeira, Waterbear had to zero in on nuances in language that pertain to
    specific demographics of women. In this case, the demographics weren''t just specific
    to ages or racial backgrounds but even generational identities and subcultures.


    For this reason, they focused on training each model for each user and using the
    combined data for overarching trends and insights and not to inform model performance.
    This meant that they were customizing their own proprietary pre-trained language
    models and cloning those models for further training on the input data coming
    from each end user independently. Because the journal prompt inputs were so idiosyncratic,
    keeping the training process separate and optimized at the per-user level meant
    that they could capture that nuance in the personalized dashboard.


    # Thought leadership


    Since transparency, trust, and authenticity are important to Waterbear, they were
    authenticity-forward with their product strategy. The Akeira product team transparently
    talked about how they built and trained their models and they shared that information
    with their user groups and online communities. They focused on a grassroots marketing
    campaign to maximize organic users and found that the more transparent they were
    able to be about their own challenges, the more their customers and end users
    trusted them.


    Akeira''s AI PM maintained a product blog on the company page where they frequently
    discussed important product decisions they felt comfortable sharing with their
    online community to better represent their choices and decisions to a wider audience.
    This fulfilled a few key objectives: it widened their circle of feedback, brought
    awareness and discussion to difficult and sometimes controversial decisions, generated
    brand awareness for Akeira and Waterbear overall and, most importantly, positioned
    the company as a thought leader. Their AI PM spoke at conferences and industry
    events often and this broader visibility of Akeira garnered the attention of industry
    awards and recognition. All of these activities generated significant amounts
    of inbound leads and inquiries about the work they were doing.


    # Summary


    This chapter was geared toward markets, positioning, and common use cases of AI/ML
    products. We''ve been able to look at how AI can be optimized for certain domains
    and markets and how AI can commonly be leveraged in various verticals that are
    seeing a high saturation of AI products. Through those use cases, we''ve been
    able to see how companies leverage AI to be able to make the most of the data
    they have. As an AI/ML PM, you won''t be building your AI-native product in a
    vacuum. You''ll regularly be studying your market and your competition to make
    sure you''re bringing use cases for AI that truly set you apart.'
