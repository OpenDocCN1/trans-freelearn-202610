- pgno: 274
  md: '# OKRs


    Next, let’s take a look at Akeira’s OKRs:


    +   - Objective: Improve mental health outcomes


    This is aligned with Akeira’s north star metric, which is again a reflection of
    Waterbear aligning its product strategy with the goals it has established to gauge
    product success. By focusing its top OKR on MMHII, and reflecting that mental
    health improvement against the self-reported mood, anxiety, depression, and sleep
    quality, they put the focus on the purpose for which the app was created. This
    is also an area Waterbear focuses its marketing efforts on, whether it’s blog
    posts, deep dives, fireside chats, or white papers. By defining mental health
    outcomes and what success looks like and sharing it, they’re ensuring their product
    strategy leads with their values. Here are the key results associated with this
    objective:


    +   - KR1: Increase average MMHII per user by 30% within a year.

    +   - KR2: Increase the percentage of users reporting mood improvement by 25%
    within the next six months.

    +   - KR3: Achieve a 15% reduction in self-reported anxiety and depression symptoms
    among users within a year.

    +   - KR4: Increase the percentage of users reporting improved sleep quality by
    30% within the next nine months.


    +   - Objective: Enhance conversational effectiveness


    This OKR focuses on the tech powering the app experience. Here, the completion
    rate refers to the interactions by users that are successfully “finished” without
    the user abandoning the discussion because they don’t feel it’s worthwhile. Conversational
    AI apps can be finicky to manage and, even when they are effective, they struggle
    with retaining user interactions. By placing conversational effectiveness at the
    second level of priority, Waterbear is sending a powerful message to users and
    internal stakeholders alike: we don’t deserve to maintain a product if it’s not
    effective and if the underlying tech that powers it is not improving over time.
    The following are the key results expected:


    +   - KR1: Improve completion rate to 70% within the next two quarters.

    +   - KR2: Maintain a user satisfaction score of 4 out of 5 or higher consistently.

    +   - KR3: Reduce issue resolution time to under 1 minute on average by the end
    of the year.'
  merge: -1
  img_proc: true
- pgno: 275
  md: '# Objective: Increase user engagement


    Finally, the third OKR is exemplary of what you might see with many traditional
    software apps: ensuring users are engaged and keep coming back. By making this
    the third OKR, the company is signaling to everyone internally and externally
    that app engagement is tertiary to proven mental health outcomes and enhancing
    tech effectiveness. Often, we see tech companies cannibalizing their own success
    by prioritizing in-app user engagement before the outcomes for which the app was
    created in the first place. This offers a ripe environment for the establishment
    of vanity metrics. Given how hard it is to shape company culture even when leadership
    is aligned, it can be hard for an organization to come back from this culturally.
    The key results are:


    +   - KR1: Increase DAU by 20% within the next quarter.

    +   - KR2: Increase average session duration by 15% by the end of the year.

    +   - KR3: Achieve a retention rate of 40% for users within the first month of
    Akeira usage.


    # Growth hacking


    In earlier case study sections, we discussed Waterbear focusing on beta users
    and testers before they scaled their product. In this section, we’ll discuss what
    that period of time looked like practically, because it was the time when growth
    hacking was most in focus for Akeira. After testing the product with a very small
    group of friends, colleagues, and beta testers who signed up for the mission of
    using tech to address the mental health crisis impacting the globe, Waterbear
    got to work on testing assumptions and messaging with a wider audience to see
    what resonated best.


    They wanted to drive organic growth, so they started their growth hacking journey
    by focusing on an incentivized referral program offering considerable discounts
    to friends of friends who joined. Waterbear did considerable A/B testing with
    various features, charitable donations, and cost reductions for joining to see
    what resonated best with that user base. By leveraging social proofing, they were
    able to create a reputation around the app’s effectiveness. Because there were
    not a lot of apps like it in the market, and the apps that did exist were only
    capable of handling certain competencies of Akeira instead of the full package,
    the social proofing paid off.


    Part of their social proofing strategy was built on social media engagement. By
    encouraging users to share their stories on TikTok, Reddit, and Instagram, particularly
    early on, they were able to create a community around their app’s effectiveness
    and success. This built a lot of trust in their small but mighty community, and
    growth came from organic means. Building on the social impact, they also created
    a trend on social media where users were sharing what they love most about Akeira,
    personifying the app experience further. This gave Akeira a brand identity and
    personality with current and future users of Akeira, which became the mascot for
    Waterbear in its own right.'
  merge: -1
  img_proc: true
- pgno: 276
  md: 'This community influence blossomed further through the use of partnerships
    with influencers who had also built a personal brand around mental health and
    the importance of using tech to serve our collective human growth and not the
    other way around, which also created a splash. This was unexpected for the PM
    team for Akeira, but it started a wave of influencers and social media users criticizing
    tech companies that were not serving the markets they claimed to be. Nurturing
    a community based on authenticity and transparency was by far the greatest tool
    in Waterbear’s growth hacking shed. It also allowed users to discover new ways
    to leverage Akeira and share that feedback with its PM team.


    Remember that growth hacking isn’t just about acquiring more users or even making
    more money. It’s about creating a feedback loop of sustainability and growth that
    helps a company scale. In Akeira’s case, the growth hacking did lead to higher
    user engagement and sales. But it also led to an additional well of inspiration:
    valuable user feedback that improved the app experience tenfold.


    # Summary


    In this chapter, we focused on the tracking, marketing, promotion, and selling
    of the AI/ML product. We covered the various ways that an AI PM can benchmark
    and track their product and its success using metrics and KPIs, as well as what
    that means for the greater organization and the successful adoption of that product
    among its user base. We also contextualized this benchmarking against the overarching
    product strategy and vision that powers what gets tracked and measured. All these
    activities help PMs get internal signals into whether or not the product they’ve
    built works for their active customers and users.


    Then, we discussed the greater work of getting external signals for what is and
    isn’t working using the various tools in the growth tech stack that directly connect
    to the UX. We went over the elements of growth hacking. Whether you’re looking
    to optimize how you acquire, engage, or retain customers, you’re going to have
    to find a way to gather that data, analyze it, and use it to make real decisions
    about how to add, remove, or improve features. Overarching, long-lasting trends
    of organizations becoming increasingly data-oriented and data-driven have been
    massively influential drivers of creating a new culture in the software world.


    Customers increasingly look for an experience that doesn’t just feel intuitive
    and natural, but that reinforces to them over and over again that they’ve come
    to the right place and that the product they’re interacting with is the right
    tool for them. They don’t want to have to speak to a live person and they don’t
    necessarily even want to take what marketing is selling them. They want to interact
    with a product directly and see whether its inherent value is apparent through
    their own exploration. This is a massive shift from how products were built and
    sold in the past, and this means that our responsibility as AI PMs is to offer
    an experience that aligns with how customers want to be regarded.'
