- pgno: 448
  md: '+   - Keeping up with the world of AI and keeping the student mindset alive

    +   - Widening your community and giving back to others

    +   - Deepening your footprint on your professional network

    +   - Anticipating future trends in the AI PM career path


    We will be ending with a case study example of practical steps that can be taken
    by a seasoned AI PM to maintain their place in their field.


    # Projecting — what’s your ideal AI PM roadmap?


    As you continue through the process of embracing challenges, reflecting on them,
    receiving feedback from others, and ultimately sharing your lessons learned with
    others, you''ll start to develop a kind of callus around hardships. They won''t
    affect you as much after you''ve experienced enough setbacks and emerged triumphant
    afterward as a result. You won''t be as reactive to the experiences around you.
    You''ll be able to then fully and proactively embrace the unknown. The callus
    that will form from fully embracing a growth mindset will make you professionally
    resilient and persistent about working toward the kind of career you truly want.
    This is where the fun starts! Depending on how ambitious you are, you''ll start
    to get a sense of how quickly and in what direction you want to be moving.


    Challenges have a lot to teach us, and those who are able to embrace challenges,
    self-reflect on experiences, seek and incorporate feedback, and share knowledge
    with others will build enough resilience and understanding of themselves to map
    out where they''re headed in their AI PM career. Building an AI PM roadmap is
    about exploring evolutions in your professional mindset and your work. Initially,
    you might be resistant and reactive to challenges, but then you grow into a more
    curious version of yourself. In more advanced stages, you become more proactive
    about steering your career and shaping your future more concretely.


    In the following sections, we have used levels to establish career milestones,
    which you can use as suggestions to start to build your own AI PM career roadmap.


    # Level 1 — building a foundation


    In this level, you''re building a foundation for your educational background and
    skills. We covered a lot of these areas in Chapter 17. Feel free to refer to that
    chapter for more context on how to get started on the AI PM career path. This
    level is all about choosing which learning or education path you want to embark
    on and how you''ll gain your early practical experiences. It shapes your understanding
    of the field and helps you acquire the essential competencies to advance in it.
    At this level, that will most likely look like an internship or your first entry-level
    role. You''ll begin the early stages of forming your professional network here
    as well.


    The following are some suggestions to get you started:


    +   - Choose whether you want to go down the formal or online course route to
    gain technical skills. Think about your budget, time constraints, and personal
    learning style to understand if you thrive in more structured or more accessible
    environments.'
  merge: -1
  img_proc: true
- pgno: 449
  md: '+   - Look for internship opportunities with companies that resonate with your
    values and career aspirations to gain hands-on experience and understand the dynamics
    of working in a tech environment.

    +   - Consider entry-level positions like product analyst or junior product manager
    roles, which can offer you a warm introduction to product management or data analysis.

    +   - Join professional groups focused on data, AI, or product management to begin
    forming your professional community.

    +   - Seek out mentors who have experience in AI product management or related
    fields who can share experiences and give you guidance on how to move forward
    in your career.

    +   - Build your professional brand and connect with people on LinkedIn. Ask them
    questions about their work, daily responsibilities, career path, and perspectives
    on the industry and where it’s headed.

    +   - Embrace this stage with curiosity and determination! The beginning is always
    hard but your hard work will pay off if you approach it with the right energy.


    # Level 2 — strategic growth


    By Level 2, you’re already several years into your AI PM career path. At this
    point, you have some experience under your belt and are ready to take on more
    advanced courses or more complex AI products. You’ve also deepened your PM skills
    through the roles you’ve taken on. Because you have more applied PM experience,
    you’re more comfortable with creating strategic plans, roadmaps, market analysis,
    and user research. At this point, you also have a robust portfolio of case studies,
    contributions, projects, and products you’ve supported. You feel more confident
    in your abilities and you’re excited by more complex challenges.


    The following are suggestions to ensure that you keep growing:


    +   - Identify areas where your technical knowledge can expand or get deeper,
    whether that relates to AI/ML models and algorithms, data analytics tools, or
    AI frameworks that are relevant to the work you’re doing.

    +   - If the work you’re doing is increasingly specialized in areas like NLP,
    computer vision, or cloud computing, consider more focused certifications or courses
    to expand your knowledge.

    +   - Decide if there are any projects you can take on to help you get exposure
    to deeper technical expertise or give you more experience with data science or
    ML engineering teams.

    +   - Take inventory of which product management skills you need to strengthen.
    Refer to the job hats covered in Chapter 18 to help you assess which aspects of
    the AI PM role you’d like to improve on.

    +   - As you accumulate experiences, it’s important to document all your products/projects/case
    studies in a portfolio, on LinkedIn, or on other public websites to serve as a
    testament to your skills, growth, and contributions as an AI PM.

    +   - Keep active with the professional communities you’ve built and seek opportunities
    to participate in AI PM forums, workshops, and meetups to connect more deeply
    with your peers and mentors.'
  merge: -1
  img_proc: true
- pgno: 450
  md: '# Level 3 — specializing and leading


    In Level 3, you’ve likely specialized in one area of AI or a particular industry.
    At this level, you’ve gained familiarity with what it means to manage teams, and
    the scope of your work is larger. Your focus has shifted toward a culture built
    around AI and product management within your organization. You may have had exposure
    to leadership training or developed your soft skills to prepare yourself for potential
    conflicts and high-level negotiations. You’re also playing a more active role
    in strategic initiatives and publicly engaging with your professional community
    through talks at conferences or knowledge-sharing opportunities. The impact and
    influence of your work expand significantly here.


    The following are some suggestions for expanding your impact:


    +   - Reflect on whether you’re happy in the industry/AI tech focus you’re settled
    into and if your current path aligns with your long-term career aspirations. Of
    course, you can always make changes, so consider the aspects of your work that
    bring you the most joy or are most meaningful.

    +   - Take inventory of potential other industries or AI specializations you’re
    excited by. Research trends or go to industry- or specialization-specific conferences
    and events and connect with others.

    +   - Pursue leadership training opportunities to make you a more effective communicator,
    negotiator, and conflict resolver.

    +   - Look for leadership training programs or workshops on emotional intelligence,
    team dynamics, and strategic decision-making to build your tools and skills to
    lead teams effectively.

    +   - Seek constructive feedback from sources you respect and trust about your
    effectiveness around larger projects, scopes, and products.

    +   - Identify gaps in your capacity or skill set based on that feedback and use
    it to inform your professional development plan.

    +   - Lead strategic initiatives in your work environment to make your work more
    visible and demonstrate your ability to manage complex projects and drive organizational
    change.

    +   - Find ways to share your work with your professional network and speak at
    conferences, participate in panel discussions, or write articles for publications
    you respect where you can.


    # Level 4 — a light for others


    At this level, you’ve become a master. Your expertise is recognized. You’re likely
    sharing your thoughts and best practices with others often and have created a
    brand around your AI PM work. You may have even gotten advanced degrees or been
    published for your work. Perhaps you’ve even started your own publication. Your
    focus has shifted to expanding your thought leadership and influence on your AI
    specialization or industry. You’re also likely to speak regularly at large conferences
    and events and serve as a board member for smaller tech companies. You’re heavily
    involved in your professional community and offer mentorship to the next generation
    of AI PMs.'
  merge: -1
  img_proc: true
- pgno: 451
  md: 'Here are a few suggestions for maintaining mastery:


    +   - Identify where you can correct assumptions or misunderstandings people have
    about the nature of AI products, ethical AI considerations, or the role of an
    AI PM in published papers, blogs, books, or speaking engagements.

    +   - Look for effective talking points for inspiring junior AI PMs and offering
    them guidance that truly reflects what’s possible for them.

    +   - Share about your journey, the challenges you faced, and strategies that
    led to your success with your professional community and mentees.

    +   - Consider creating your own mentorship program, workshop, or webinar that’s
    focused on offering practical advice to others navigating their own paths.

    +   - Use your seasoned skill set, knowledge, and expertise to contribute to startups
    that bring real (and good) value into the world!

    +   - Embrace this stage with a spirit of generosity and a desire to uplift others.
    You demonstrated devotion and drive to get here. Show others how to bask in their
    accomplishments. Be a beacon of light for others!


    # Learning — staying informed and inspired


    We covered the importance of upskilling and establishing your technical knowledge
    when you’re just starting out in Chapter 17. But once you’ve matured into your
    career, you’re not “upskilling” anymore, per se. You’re maintaining your knowledge
    and staying relevant in your field. In this section, we will be exploring how
    to keep learning in a sustainable and inspired way as you get to a more mature
    place in your AI PM career. The operative word here is sustainable. It just so
    happens that the field is always rapidly changing, which means there’s always
    something you could be doing to stay ahead. Here, we will explore the various
    ways you can stay up to speed on AI and PM advancements in a way that feels manageable
    and sustainable so that you can keep being inspired with your work.


    Some key areas you’ll want to focus on as you mature in your AI PM career are
    technical skills, product management skills, and soft skills. All these can be
    expanded on through three main avenues: building your professional brand through
    thought leadership, bolstering knowledge through certifications and degrees, and
    sharpening your skills through professional development. In the following sections,
    we’ll examine the various ways you’ll be able to learn and stay informed with
    regard to all three areas to maintain a well-rounded background as an AI PM.


    # Thought leadership


    We all have different interests, values, and skill sets that we bring to the AI
    PM role. Building a small collection of thought leaders you resonate with strongly
    is a way to connect with others in your field based on their ideas. It’s one of
    the human experience’s most beautiful concepts: the idea that we can feel connected
    to others by the quality of their ideas alone across time and space. As you mature
    as an AI PM, you’ll be more discerning about the kind of information you let yourself
    ingest. When you’re starting out on your journey, it’s harder to tell who’s worth
    following.'
  merge: -1
  img_proc: true
- pgno: 452
  md: 'There is no shortage of AI, data, machine learning, product management, or
    leadership influencers and thought leaders online, at universities, or at conferences.
    Many of them will regurgitate many of the same ideas, hoping to give themselves
    relevance and notoriety. But as you regularly keep up with AI, product or tech
    industry newsletters, blogs, articles, and white papers, you''ll start to see
    a few stand out from the crowd. Keep track of the people who inspire you. Make
    sure they are reputable professionals who you feel truly have something to say.


    One AI PM thought leader who inspires me is Mira Murati. Murati has been a vocal
    advocate for the ethical implications of AI and has emphasized the importance
    of developers creating systems that are safe, transparent, and aligned with human
    values. She oversaw the development of powerful AI models like ChatGPT and DALL-E
    and her public discussions around responsible AI use that highlight AI''s risks
    and societal impacts are admirable, especially when you consider how successful
    and accessible the products she''s brought to market have been. She has held various
    prestigious positions at Tesla and OpenAI and has shown strength in navigating
    those dynamics within a predominantly male industry, eventually stepping in as
    interim CEO of OpenAI during Sam Altman''s brief absence. Murati inspires me as
    an AI leader and practitioner and she''s a shining example of what is possible
    in tech.


    The thought leaders you let into your internal world will have an impact on your
    own philosophies on life and work. They will impact how you make decisions in
    your work experiences and, ultimately, will have a role in shaping your career.
    Let your curiosity guide you and make it a habit to stay up to date on their articles
    and recent work on a weekly or monthly basis. You never know: as you scale up
    in your career, you could eventually connect, meet, or even work with them. Cover
    your bases by having preferred thought leaders you connect with across various
    aspects of the AI PM role: leadership, communication, product management, data,
    and AI.


    # Certifications and degrees


    As you keep growing and exploring the areas of AI/ML that you want to work in,
    getting more certifications and coursework could be a great way to fill in gaps
    you might have in your technical background or your understanding of soft skills.
    You might even pursue more bootcamps or higher learning degrees if you want to
    deepen your knowledge or expertise in new areas of AI as well.


    I''ve known an AI PM who left their corporate role, went to pursue a PhD in deep
    learning, stayed in academia for a few years, and then returned to the private
    sector to specialize in deep tech startups. While this might sound a bit roundabout,
    this person had a great time taking a break from the grind to return refreshed.
    Degrees and specialized certificates can also play a part in pivoting your role
    as an AI PM. Maybe you want to become an AI PM who focuses more on user-centric
    design or market strategy. Or perhaps you''re sure you want to get involved with
    the high-level management of AI PM teams. Use these tools in cases where you''re
    looking to make a significant area or focus more prominent in your career trajectory.'
  merge: -1
  img_proc: true
- pgno: 453
  md: '![](img/a0c9f9a2ba06a06d309ce21d890a47c6_453_0.png)


    When I think of deepening knowledge, I think of courses and degrees. But when
    I think about sharpening skills and acquiring tools, I think about professional
    development. You can think of them as different focus areas with different goals.
    Professional development is all about workshops, seminars, and conferences – ways
    you can deepen your professional capacity to be effective in your work. While
    certifications and degrees focus on deepening your applied, technical skills and
    credibility through an academic space, professional development is more industry-oriented.


    # Professional development


    You certainly don’t have to just keep your skills sharp through bootcamps and
    degrees. There are more digestible ways available to you of filling skill or domain
    gaps in your professional background. Maybe you attend a workshop or a seminar
    to learn from an expert. Maybe you just go to a conference and learn about new
    areas in the AI PM landscape that you hadn’t even considered before. You could
    even just join a book club. There are also online learning sessions, lectures,
    and webinars you can enroll in to gain new skills and insights.


    As you advance in your career, you could also start to organize these yourself.
    One of the most advantageous things I did early in my own career was to start
    to organize events around women in AI. In some cases, it was talks from AI entrepreneurs.
    In other cases, the events were talks given by female practitioners in the industry.
    Occasionally, these talks were full working sessions where the speakers would
    give an overview of a project they worked on, along with a step-by-step tutorial
    on how they gathered product requirements, data, and feedback to deploy and launch
    a specific use case of AI.


    Investing a work day or the occasional weekend in something like this will have
    greater downstream effects because your horizons will be expanded each time. They’re
    also a great way of vetting which areas you want to strengthen. Are there certain
    technical skills you’ve been curious about but haven’t invested much in? Are you
    curious about leadership but lack the confidence or communication skills to act
    toward it? Keeping professional development experiences occasional will mean that
    you’ll have plenty of time to integrate the information and insights you gain
    from these smaller engagements into your own work as an AI PM. Small seeds can
    have a lot of potential, so use these to start small and see if they inspire you
    to take more concrete actions for your career.


    The following are some practical actions you can take to maintain a learning path
    that makes sense for you:


    +   - Establish short- and long-term goals. Do you want to learn a new skill set,
    programming language, tool, or framework? Are you looking for expertise in a particular
    area of AI? Get clear on what you want to learn and why it will be helpful in
    your career.

    +   - Establish a sustainable schedule. Are you able to sustain learning on a
    weekly or monthly basis?

    +   - Clarify which learning paths make sense for you. Do you prefer MOOCs or
    an advanced degree?

    +   - Find inspiring reading materials. Are there any books, blogs, academic journals,
    or research teams that speak to you?'
  merge: -1
  img_proc: true
- pgno: 454
  md: '# Networking — deepening your involvement with the professional community


    Engaging with your professional community serves two purposes:


    +   - It allows you to keep learning and growing through the work and insights
    of others.

    +   - It also allows you to share your own insights, successes, and failures with
    the very people who can appreciate them the most.


    Networking has acquired a bad reputation over the years. It conjures images of
    stuffy rooms full of strangers, places where you put on a brave face and an air
    of confidence to “work the room.” Maybe you give yourself a quantifiable goal:
    “Meet five new AI PMs today.” Maybe you do indeed speak to them and exchange a
    few words but nothing meaningful or especially substantial comes of it. You’ve
    done the work. You’ve left your house, met five strangers, and checked off the
    “networking” box on your to-do list. The connections feel lukewarm at best and
    the experience is ultimately unfulfilling.


    But that’s not real networking. That’s just personal brand evangelism masquerading
    as networking. True networking is about establishing connections with people you
    truly resonate with to form a safety net. That safety net should be based on something
    real, something authentic. These should be people you can turn to when you feel
    confused, disheartened, afraid, curious, or inspired. You don’t have to become
    best friends with these people, but you should be able to share some vulnerabilities
    with them. What’s the point of having a professional network if it can’t support
    you when you need guidance or reassurance?


    Build strategies that feel natural for you as you start forming authentic relationships
    with your professional peers and go beyond transactional networking. Start by
    giving first. Maybe you can offer an endorsement or a recommendation for someone
    you know without asking for something in return. Or you could host a session or
    organize an event about sharing successes and lessons learned with colleagues
    in your organization or network. In a world where people are often approached
    by those wanting something, demonstrate emotional intelligence by giving something
    of value before asking. It will set you apart from the crowd and create a foundation
    for lasting, meaningful professional relationships.


    As you gain confidence and start to share more about your work through your own
    channels, your professional network will keep you honest. Many of them will become
    your best champions as you start to build a public-facing brand around your work.
    Here are a few suggestions for how you can get involved in your professional community
    over time:


    +   - **Online communities:** LinkedIn, Slack, and Discord are powerful platforms
    that support all kinds of niche groups. An easy way to maintain a professional
    community is by leaning on these by frequently posting and commenting. Beyond
    posting and commenting, you can promote your written work, portfolio, or any events
    you’re a part of. You can think of these as the largest part of the funnel. Sure,
    you may make some deeper connections here over time but many of the connections
    here will be weaker if you don’t find ways to contextualize them in your life.'
  merge: -1
  img_proc: true
- pgno: 455
  md: '+   - **Conferences:** Industry events and known conferences are a great way
    to synchronously meet a lot of people under one roof. Your chances of meeting
    people and connecting organically are higher in conferences because you''re there
    in person. The more you go, the more likely you''ll see people you''ve met before.
    Particularly if you''re maintaining communication with people online, you can
    make sure you''re making time to see people you''ve come to know virtually and
    root them into the present moment. Conferences are a great way to hear established
    peers in your industry speak. They also typically have happy hours, afterparties,
    and musical events after the official schedule, so the chances that you''ll connect
    with people on a more personal level are higher.

    +   - **Meetups:** Regular in-person meetups, particularly in bigger cities, are
    quite common. With meetups, you get some of the benefits of a conference without
    the overwhelming tsunami of people. You can receive a lot of the social benefits
    of seeing people in person without needing to spend nearly as much money. They
    also offer opportunities for deeper connection because often you''re seeing the
    same faces over and over again. The opportunity to experience belonging is highest
    with local meetups because you know you''re connecting with people who live in
    your vicinity.

    +   - **Mentorship:** As you expand on networking efforts throughout your career,
    through the various avenues mentioned above, eventually you''ll start to form
    closer bonds with people. Many of these close bonds will take on a mentorship
    role. Mentors don''t need to be significantly further along in their careers than
    you. Sometimes they can even be at your level. But they will be people who you
    can turn to when you''re in need of guidance. You won''t have the capacity to
    turn all your professional connections into true mentors, but in essence, the
    people you let into your inner circle have the capacity to offer you mentorship.
    Keep the ones you trust and respect close to you and give back to them when you
    can.


    # Growing — the student becomes the teacher


    It''s one thing to learn and grow as a student, but it''s another to take that
    knowledge and guidance and turn it into real wisdom. In many ways, you''ll always
    be learning as an AI PM. But at some point, you will be able to give back. Growth
    is about taking lived experience and using it to improve as an AI PM and a person.
    In this section, we''ll examine the growth mindset and the areas that contribute
    most to the application of it.


    # Embracing challenges


    As you continue to mature in your AI PM career path, you''ll eventually hit major
    challenges. Maybe the product you''ve been working on developing just isn''t hitting
    the performance targets that are needed to meet your customers'' and users'' expectations.
    Or even worse, maybe it does but you''re still struggling with reaching product
    market fit or with establishing a consistent user base. Perhaps one of the main
    takeaways from your market or competitive research deals with the integration
    of a new form of machine learning you haven''t worked with yet for an upcoming
    feature. Whatever the challenge is, keeping a curious spirit and embracing the
    challenge is the way through.'
  merge: -1
  img_proc: true
- pgno: 456
  md: 'I realize that''s easier said than done, particularly when you have leadership
    expectations to balance in the fray of it all to keep your job. The AI PM role
    is rife with challenges and pressures coming from all sides. Balancing ethical
    considerations, technical constraints, regulatory compliance, high user expectations,
    complexity in AI systems, and technical innovations piles a lot on the AI PM role.
    Complexity in AI systems often introduces unpredictable results, data biases,
    and issues with interpretability, which adds more difficulty to development and
    deployment.


    But viewing these challenges as opportunities can be transformative. Use them
    as a catalyst to develop a new skill or improve your problem-solving abilities.
    The more you do, the more resilient you''ll be when they do arise. Embracing a
    growth mindset means you believe in your ability to excel and succeed through
    challenges. The idea that persistence, learning, and effort are the way to become
    more capable is a powerful one. It means that you don''t let failures define you.
    I would venture so far as to say that keeping optimism alive when challenges occur
    is one of the foundational skills of a PM.


    Think about it; you often have to be the one who motivates and inspires the people
    you work with when they get down. But who can do this for you at your organization?
    Corporate environments in many cases can be brutal; we often have to become our
    own cheerleaders. But that doesn''t have to be a bad thing. If we never experienced
    challenges, we''d rest on our laurels and our work would be consistently stellar
    but dull. The stakes have to be high for a pursuit to be meaningful. Champions
    are made through struggle. Your ability to dominate that struggle, to not let
    it consume you or reinforce your inability, is what will keep you growing.


    For a powerful example of AI PMs who have mastered the art of embracing challenges,
    we can look no further than Fei-Fei Li, co-director of the Stanford Human-Centered
    AI Institute and former chief scientist of AI/ML at Google Cloud. Fei-Fei is an
    inspiring AI leader who has embraced and overcome significant challenges in AI
    development. One of the effective ways she found to make an impact was in the
    healthcare space. By collaborating with hospitals and senior homes in the Bay
    Area, Fei-Fei found a way to solve the issue of monitoring human behavior with
    regard to handwashing and hand hygiene, one of the leading causes of infection
    in hospitals.


    Through her work on developing “ambient intelligence” systems, a series of sensors
    and computer vision models that are able to track the hand hygiene of medical
    staff, she was able to build AI systems that respond to human needs in real time
    while minimizing bias that would come from human observers. As a result of her
    work in hospital settings, Fei-Fei was able to prevent patient deaths and infections,
    democratize the use of AI in hospital settings, and find a way to repackage some
    of the same capabilities used in self-driving cars to save lives.


    # Reflecting


    Reflecting is a powerful process that starts with embracing challenges. We don''t
    let challenges define us or send us into downward spirals; we use them as an opportunity
    to reflect. We can''t be afraid to look directly at the shortcomings we experience.
    This means avoiding the problem, and it will prevent you from ever making the
    kinds of changes and pivots that will lead to a breakthrough, both personally
    and professionally. Let yourself be courageous enough to analyze and reflect on
    the challenges you face so that you can receive their wisdom. Understanding what
    went wrong and how to prevent it from happening in the future is how growth happens.'
  merge: -1
