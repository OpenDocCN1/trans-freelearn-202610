- pgno: 59
  md: 'For example, if an e-commerce company wants to try out a new pricing algorithm
    to see if it would have an impact on sales, it could split users into two groups.
    One group would see the old pricing model while the other would experience the
    new pricing algorithm. Since these two groups would reflect real pricing and purchasing
    decisions, the results could be compared between the two over a period of time.
    This would allow the company to monitor the site and compare sales performance,
    user engagement, and conversions between the two groups of customers to be able
    to understand the real impact of the new pricing algorithm.


    # Canary deployment strategy


    Here, we see a more gradual approach to deployment where you actually create subsets
    of users that will then experience your new model deployment. Here, we’re seeing
    the number of users that are subjected to your new model gradually increasing
    over time. This means that you can have a buffer time between groups of users
    to understand how they’re reacting and interacting with this new model. Essentially,
    you’re using varying groups of your own users as testers before you release to
    a new batch so you can catch bugs more gradually as well. It’s a slow but rewarding
    process if you have the patience and courage.


    For example, if a photo-sharing social media app wanted to test out a new photo
    editing feature, it might only deploy that new feature to a small test group.
    In this case, the “canary” group. They could monitor the performance, adoption,
    and feedback from this small group to identify any bigger issues the feature or
    capability might have before they roll it out to their entire user base. Being
    able to test a feature with a smaller group minimizes potential risks they might
    otherwise have with a wider rollout. After the success of that initial experiment,
    they can have a chance to make changes or improvements from the feedback before
    opening it to a wider audience.


    There are more strategies to choose from but keep in mind that the selection of
    these strategies will depend on the following:


    +   - The nature of your product

    +   - The budget, which is what’s most important to your customers and users

    +   - Your metrics and performance monitoring

    +   - Your technical capacity and knowledge

    +   - The timeline


    Beyond deployment, you’re going to have to help your business understand how often
    they should be doing code refactoring and branching as well.


    # Example


    Let’s take an example of a food delivery service that was looking to launch a
    new feature for an app that improved delivery time predictions. They considered
    their options between canary, A/B testing, and shadow deployment approaches with
    the following pros and cons:'
