- pgno: 251
  md: '# 10


    # Benchmarking Performance, Growth Hacking, and Cost


    In this chapter, we will understand the benchmarking needed to gauge product success
    in all its various forms. We will be looking at performance metrics from a product
    and growth perspective. These include **value metrics, north star metrics, key
    performance indicators (KPIs), and objectives and key results (OKRs)** that companies
    can use to get early signals on whether their product strategy is successful and
    will lead to growth hacking. We will also be discussing how companies can prepare
    themselves to defend their product when it''s compared to other products.


    When it comes to the success of your product, it will all come down to how effectively
    you can communicate its value to your potential customers and put it to the test.
    Part of maneuvering between your sales teams and customer conversations will involve
    making sure the tangible benefit your AI product can bring to your customers is
    a big part of the sales process. When customers come to you and give you the stage,
    do you have a dependable demo to show them? Are you able to show them your product''s
    performance across a variety of datasets or does it only work well when you use
    your own data? Can you talk about the approach or algorithm you''re using without
    having to resort to the safe space of a *proprietary blend* that you''re not at
    liberty to discuss? Can you confidently get them in touch with partners or customers
    they can speak with to get a referral? Before you start to track the performance
    of your product for your sales or investment pitch, you will need to build trust
    within the ecosystem you''re a part of. Communicating success when there isn''t
    a foundation of strength will ring hollow.


    As we continue with the chapter and discuss how we can gauge and communicate a
    product''s success, as well as how we can determine an appropriate cost structure,
    we have to remember one foundational truth: at the end of the day, cost doesn''t
    matter. Sure, it''s important to remain in a palatable realm. Does the price align
    with your product''s value proposition? Is it competitive compared to comparable
    solutions out there in the market? Some of your customers will be more cost-conscious
    than others, but at the end of the day, customers don''t necessarily forgo powerful
    products because of the price tag. If it works and it works better than the other
    products out there, they will usually find a way to make the budget.'
  merge: -1
  img_proc: true
- pgno: 252
  md: 'If you’re working as an AI PM at a B2B company, you’re well aware that buying
    software is tricky because purchasing decisions typically involve multiple stakeholders.
    Amid the proofs of concept, the budget discussions, countless meetings with potential
    vendors, time and dedication of your own technical resources to evaluate every
    tool in your environment, feature comparisons, managing internal stakeholders,
    and, ultimately, achieving alignment on the product the company believes is best
    for its use case, the entire process can be exhausting and frustrating. If you’re
    an AI PM for a B2C company, you still have these hurdles, only with fewer business
    stakeholders to juggle. This offers PMs a huge opportunity to make their customers’
    lives much easier while making their products stand out from the rest.


    Decision-making in B2B contexts can be lengthy and involve many layers of approval,
    making it more complicated than in B2C scenarios. AI PMs must focus on enhancing
    user experience, addressing customer pain points, and managing areas of friction
    as their products are evaluated before purchase. In order to do this effectively,
    they must define metrics that measure product success and effectiveness so that
    they’re aware of how their products are being received, whether they’re B2B or
    B2C products.


    By establishing value metrics, AI PMs make sure the decisions they’re making are
    objectively supported by data. This means they can better justify investments
    they’re making in AI/ML capabilities and third-party tools, as well as addressing
    concerns around costs and demonstrate value to customers and users. If AI PMs
    can build a product that demonstrating immediate value – a product that can help
    expedite decisions and reduce friction for users – they can create a compelling
    use case that resonates deeply with customers and eases the path to alignment
    and purchase.


    With that, let’s dive into the chapter. We will be covering the following topics
    here:


    +   - Value metrics – a guide to north star metrics, KPIs, and OKRs

    +   - Hacking – product-led growth

    +   - The tech stack – early signals

    +   - Managing costs and pricing – AI is expensive


    # Value metrics — a guide to north star metrics, KPIs and OKRs


    In this section, we will be discussing value metrics, KPIs, and OKRs through the
    lens of what’s best kept inside the business and what’s best communicated outward.
    All relationships are built on trust, and this includes the relationships that
    companies/PMs have with their customers and the market. Assuming you’ve found
    a way to build a reputable circle of trust around your product, it’s now your
    job as PM to make sure this relationship continues to grow and evolve, ideally
    by incorporating feedback from your market.


    A great way to do this is by communicating the value of your product and continuously
    building and referencing that growth and evolution. The way to do so is by using
    tools to track and confirm your product’s progress. The key question is: what
    will you choose to track and which metrics will you give particular attention
    to? This is something that all companies struggle with getting right because it
    can be tempting to tie all pursuits to revenue and make that the top value metric,
    but that often doesn’t give us the full picture.'
  merge: -1
  img_proc: true
- pgno: 253
  md: 'Choosing metrics, particularly a north star metric, is a rigorous and meticulous
    activity, and it’s best done in a collaborative environment. You want to have
    a diversity of voices present when you’re making such foundational decisions.
    These are decisions that shouldn’t be taken lightly because, in many ways, the
    establishment of these norms will have downstream ripple effects that touch virtually
    all your internal teams in one way or another.


    All companies and organizations have a certain amount of entropy they’re battling
    at all times. Entropy is the force that introduces disorder, uncertainty, or randomness
    to how business is getting done, and it’s the central force we’re building against
    when defining success and setting goals. We’ve covered the concept of drift in
    earlier chapters and that concept applies here. You can think of entropy as organizational
    drift. This is because as the days, weeks, and months go by, priorities can change.
    Sometimes there is a good reason for this. But if you’re planning and strategizing
    well, you should resist ambient changes to make sure you’re executing the product
    strategy you laid out.


    Building OKRs at the product- or org-level functions as a tool against that entropy.
    It ensures that you’re sticking to the values, beliefs, and purpose that you set
    out to address by building a company and product. It’s advisable that companies
    have 3-4 product or organizational OKRs to make sure that alignment isn’t disrupted.
    OKRs are strategic choices a company makes to prioritize certain outcomes over
    others. They should be reasonable, achievable targets that are aligned with the
    product strategy and reflect the goals and priorities of the company.


    The KPIs we will focus on in this chapter mostly relate to your general product’s
    KPIs and how they relate to your overall product strategy. Your product strategy
    is an extension of your product vision, establishing KPIs and metrics that reflect
    not just what your product’s goals are for its users but also what its users find
    most valuable about it.


    Finding a way to articulate this value and communicate it continuously in both
    internal and external contexts is perhaps the most important aspect of engaging
    your market because it influences how you see and hear your customers and, ultimately,
    how you speak to them. Let’s dive in!


    # North star metrics


    Choosing your product’s north star metric is an important part of aligning your
    product strategy with the realization of a key goal. It’s common for most products
    to be oriented toward one top metric that the company is using to track progress.
    Choosing the wrong one, or not choosing one at all, can have a discombobulating
    influence on how your teams are built, guided, and measured. It can also have
    the unfortunate unintended consequence of not giving you the full picture of what’s
    happening on the customer side. This is particularly important for the nascent
    AI/ML-native product because you want to make sure you’re getting an early signal
    on what’s working and what isn’t so that you can improve your product sooner.


    Depending on the forces involved with your product, you’ll be subject to certain
    influences. This could mean influence from investors and leadership, but it also
    means influence from the builders and users of your product. Of course, we rely
    on feedback to make product decisions. But putting the users and customer voice
    central to product strategy isn’t a given. Many product teams will call themselves
    customer obsessed, but few follow this lip service in practice.'
  merge: -1
  img_proc: true
- pgno: 254
  md: 'This is why choosing a north star metric is structurally tied to your product
    strategy and your values as a company. This can also have a disruptive effect
    on how you choose to measure the success of your product overall. This is because
    the north star metric serves as your primary KPI. It doesn’t just unite your entire
    company around a common goal, but it also communicates how well the company as
    a whole is performing. Using it tells folks internally and externally whether
    things are going well overall (or not). If you’re doing it right, you will have
    one metric to serve as an elegant indicator of revenue, performance, and engagement.


    It might be tempting to take a laissez-faire approach. After all, a product has
    traditionally and often been measured on how much is built and shipped. However,
    establishing a north star metric is a strategic choice that benefits the product’s
    function and influence within the company. This is especially true for AI companies
    because of the novelty of AI and the strategic importance it has in the market
    today. Establishing a north star metric is a way of demonstrating to the entire
    organization that the product team is foundationally aligned with the success
    of the business, and it reinforces the idea that the company is product-led and
    not sales-led.


    The benefits of doing this are threefold:


    +   - You’re giving your organization as a whole alignment with your product team.

    +   - You’re also giving your product team a standard to stay accountable to and
    be measured against.

    +   - These two systems working together create a feedback loop so that anyone
    at your organization can see, with a large degree of certainty, whether the ship
    is sailing the way it should be. This informs discussions that marketing, sales,
    logistics, finance, product, and customer success teams all have with each other,
    as well as within their own teams.


    If you’re a PM, particularly one pioneering a novel AI product, we highly suggest
    you push for the establishment of a north star metric. Chances are, if you’re
    foundationally involved with building your product strategy and creating a product
    vision, you have some clarity already on what this metric will be because it aligns
    most closely with the ultimate value of your product. We suggest Growth Academy
    as a resource if you’d like more direction on how to establish a north star metric,
    but for now, here are some questions to get you going:


    +   - What does my product intend to do?

    +   - How do I know whether it carries out its intended function?

    +   - Which activities result in the best experience with my product?

    +   - What do my customers value most about my product?

    +   - Is there a moment in my customer’s journey that hooks them?

    +   - What are some indicators of future revenue other than *sign-ups* or *purchases*?

    +   - Is my goal to make customers more productive, capture their attention, or
    get them to buy something?

    +   - Do I want my customers to take a specific action or a wide variety of actions?

    +   - Is success measured by how often or how efficiently my customers rely on
    my product?'
  merge: -1
  img_proc: true
- pgno: 255
  md: "Every company will have a different methodology for arriving at a north star\
    \ metric because it’s so foundationally centered around the business model, which\
    \ is why establishing a north star metric is part of your overall product strategy\
    \ discussions. It will also be based on your ideal customer journey because you’re\
    \ optimizing for a certain moment that most benefits your customer’s expectations\
    \ and aligns that moment with what’s most important to the company’s success.\n\
    \n> Note\n> \n> You may want to have more than one north star metric if your business\
    \ model and success make more sense with a multifaceted approach.\n\nThe following\
    \ is a list of famous digital product companies and their north star metrics:\n\
    \n+   - *Airbnb* focuses on the number of nights booked.\n+   - *Uber*’s ultimate\
    \ goal is to boost ridership, so they focus on rides booked.\n+   - *HubSpot*\
    \ looks for entire teams to be actively engaged on their platform to ensure their\
    \ software is depended on regularly, so they use weekly active teams.\n+   - *Amazon*\
    \ doesn’t just look for total sales – they look for a pattern of behavior for\
    \ all their users, so they use monthly purchases per user.\n+   - *LinkedIn* might\
    \ not be a social media tool you’ll use daily, but if you’re a working professional,\
    \ you’ll likely have a reason to come back on a monthly basis, so they focus on\
    \ monthly active users.\n+   - *BlueApron* is one of the few that have two north\
    \ star metrics, so they focus on orders per customer as well as active subscribers\
    \ for their subscription model.\n+   - *Facebook* and *Instagram* want to create\
    \ a daily dependency on your attention, so they focus on daily active users.\n\
    +   - *Netflix* ultimately tries to encourage people to view all their films and\
    \ shows and they keep it simple by focusing on watch time.\n+   - *Spotify* also\
    \ has two north star metrics, conveying a focus on returning users with monthly\
    \ active users, as well as the consumption of music on their platform with stream\
    \ time.\n+   - *Duolingo* has three north star metrics – daily active users, learn\
    \ time, and success – reinforcing their desire for active learners to come back\
    \ frequently and spend a significant amount of time learning and seeing the positive\
    \ results of that dedication.\n+   - *Quora* keeps it simple by focusing on the\
    \ number of questions answered.\n\nThere are also a number of out-of-the-box north\
    \ star metrics categories you can contemplate as you’re sifting through your options,\
    \ particularly if you’re getting started with a novel product in your product\
    \ suite or if you’re just building a company. Again, be incredibly discerning\
    \ about these metrics and put them to the test. Brainstorm with your go-to-market/sales/leadership\
    \ team and workshop them. Try to arrive at a full destination assuming these metrics\
    \ are in place. Ask yourself: what does our business look like a year, 5 years,\
    \ or 10 years down the line if we make this our north star?"
