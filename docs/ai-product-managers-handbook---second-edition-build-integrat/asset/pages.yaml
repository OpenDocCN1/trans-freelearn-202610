- pgno: 116
  md: 'Now, let''s turn our attention to another addictive app. This time, it encourages
    perhaps a healthier addiction: a thirst for knowledge! Pennsylvania-based Duolingo
    has leveraged deep learning in a way that helps people learn languages in a more
    efficient and specialized way for them. The gamified, personalized app reaches
    more than 300 million monthly active users and offers more than 30 languages.


    The main idea of Duolingo is it learns along with you and it offers you repetitions
    of words based on what it thinks you''re just on the verge of forgetting. This
    repetition mimics the way we learn naturally and the gamified points-based behavior
    in the app gives you the emotional encouragement you need to keep going with your
    15 minutes a day.


    As a plus, Duolingo didn''t start out as an AI company. It was founded in 2009,
    and once it started experimenting with personalization and A/B testing, it realized
    quickly that it ought to start testing with machine learning. Later on in the
    book, we will be discussing how to add AI features to an existing non-AI product.
    Duolingo offers us a successful example of a company that did just that. In particular,
    Duolingo uses RNNs for word sequencing and translating, LSTMs for recognizing
    long-term dependencies in text, CNNs for feature extraction and improving text
    understanding, Transformer models like BERT and GPT for understanding and generating
    natural language and providing contextual feedback, and reinforcement learning
    for personalizing learning experience and adapting content based on users'' progress
    and behaviors.


    Finally, one of the great resounding successes from the generative AI boom is
    an image generation app called Midjourney. In a rarity for the tech world, the
    company was able to generate $200 million in revenue with 40 employees and $0
    in funding. Ever since the company''s inception in 2021, David Holz, the founder
    of Midjourney, has been inundated with offers for funding from investors. It functions
    through the Discord chat app, which made ease of use and accessibility some of
    the hallmarks of its success. It''s become a tool of choice for creative hobbyists
    and professionals who want to test out the capabilities of generative AI. The
    company''s focus on sustainable, organic growth has also been a big part of its
    popularity, with subscription models between $10 and $120.


    Another reason why we wanted to include Midjourney in this chapter is due to its
    inspiring labor practices. By having a democratic, flat organization and promoting
    a profit-sharing model among its admittedly very few employees, they''re able
    to retain loyal employees by offering something many US companies cannot: true
    camaraderie. Even their disinterest in funding helps offer tangible and intangible
    rewards to the people who have built the company. With so many promising start-ups
    being snatched up by VCs, often with their own goals and priorities that conflict
    with those of the start-up they''re funding, it''s nice to see a company succeed
    when it goes against the grain. Often, start-up founders feel they won''t be able
    to succeed without seeking funding, only to then see their company visions and
    missions compromised once they have it. In Midjourney, we see highly capable generative
    AI models being given to people, for a minimal cost, for the express purpose of
    delivering creative AI capabilities to artists.


    We decided to call this group the *artists* because art captures the zeitgeist
    and varying energies coming from the social collective. It aligns pretty nicely
    with the idea of the invisible hand of the market. The concept of product-market
    fit is nebulous as well. The market wants what it wants and we all make up the
    market directly or indirectly, and the companies that create true art meet the
    market where it is. For instance, it''s no wonder people are interested in learning
    languages.'
