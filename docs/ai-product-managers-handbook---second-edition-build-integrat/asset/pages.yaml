    Table 11.1: Significant actions from the product team


    This is by no means an exhaustive list, but it is a list of the practices that
    contributed most to the success of Akeira’s founding AI PM team. Most of the items
    on the list were actions that contributed most to the emotional and cultural health
    of the product organization. That’s because the founding product team knew that
    when they supported their stakeholders, customers, and prospects as best they
    could, they’d find success with their product. They already knew they had a great
    technical team. There was already a lot of trust built with the ML and data teams
    that supported the product organization. This meant that many of their efforts
    and actions went toward ensuring the rest of the world around them knew it as
    well.


    Given the success and adoption of Akeira, it’s clear the founding product team’s
    intuition and values were in the right place. The reason why they focused on their
    values and building trust was because Waterbear’s founders already knew there
    would be pushback with a conversational AI. The market is saturated with conversational
    AIs and there is already a lot of distrust when it comes to AI companies’ data
    storage practices. Even if consumers weren’t inherently suspicious or aware of
    these things, it still felt like a long shot that the average consumer would bare
    their soul to an AI. This is why so many of their efforts early on were focused
    on over-communicating and building a brand identity around trust and security.'
