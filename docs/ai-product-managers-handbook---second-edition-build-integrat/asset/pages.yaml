- pgno: 232
  md: 'You''ll want to align your product aesthetic with the overall brand identity
    of your product to make sure company values are being communicated as effectively
    as product functionality is. This phase is about ensuring consistency and cohesion
    across multiple levels because once your product is out there on the market, perception
    is everything. Balancing aesthetics with product functionality is a way to communicate
    to your end users, prospective customers, and the market at large that you''ve
    put the work into building a product that works, feels, and looks intentional.
    Some may feel that aesthetics are secondary to functionality, but even if they
    are, people will see what your product looks like before they actually use it.


    Some questions you can ask at this stage are:


    +   - Does the visual design of the product align with your overall brand identity
    and values? Are consistent color schemes, typography, and visual elements that
    are recognizable integrated?

    +   - Do visual elements enhance or distract user experience?

    +   - Are aesthetics and functionality balanced? Does the product look visually
    appealing and does that make it easier to use?

    +   - Are the design elements used inclusive and accessible for all users?

    +   - Have you identified visual inconsistencies or areas that need to be refined
    for a more cohesive look?

    +   - How well do visual design elements communicate the value proposition and
    unique selling points of your product?

    +   - What final visual elements or marketing materials (product videos, landing
    pages, and imagery) are needed to support the launch of your product?


    # Documentation


    Pre-launch, you''ll focus on building enough content to make sure your customers
    are set up for success as best you can. The work of building this support is ongoing,
    of course, but you''ll want to have enough there to feel comfortable with launching
    and making sure your company won''t be inundated with questions and concerns following
    the launch as best you can. Documenting your product is important, of course,
    but it''s equally vital to have resources for customers who will be buying your
    product post-launch. This is where all the content related to your technical documentation,
    product documentation, marketing, distribution, and customer success knowledge
    bases will be handled. Remember that this is just a phase of your product design.
    It''s meant to accompany your product and should have a branding, look, and feel
    that''s consistent with your product experience.


    This content will also be evolving over time. As you continue to gather more and
    more customer feedback, particularly post-launch, you''ll need to make sure your
    accompanying documentation and marketing collateral align with your evolving product.
    Don''t think of documentation as something separate from your product because
    it isn''t. Documentation is the mouthpiece of your product and your end users
    and customers will be relying on it to make sure they understand the capabilities
    and value of your product. If your documentation and marketing fail to do that
    adequately, you''re not speaking clearly to your potential customer base. Documentation
    will also be handed off to the development team that''s building your product,
    so make sure you have customer-facing and internal-facing documentation in this
    phase.'
  merge: -1
  img_proc: true
- pgno: 233
  md: 'Here are some key questions to consider at this stage:


    +   - What core features and functionalities need to be covered in a customer-facing
    document(s)? What level of detail are you comfortable including for these documents?

    +   - Have you created clear guides detailing prototype design elements and rationale
    for development to refer back to when they start development? Is there an internal
    knowledge base that covers product architecture and validation processes for your
    development team?

    +   - Do you have a system in place to capture and share prototype upgrades/changes
    (and subsequent product documentation) after each sprint?

    +   - Are there detailed user stories, workflows, and use cases documented to
    help relevant teams understand the prototype''s functionality and user experience?

    +   - How will documentation issues, gaps, or pain points be handled? How will
    feedback mechanisms be used to make sure there''s a way to receive internal and
    external feedback on documentation?


    # What makes the AI-native product design process special?


    Given the massive impact AI is having on our workflows and products, we''re seeing
    it have a transformative effect on the design process itself. Here, we''re not
    just seeing AI have an impact on the act of designing products, but on designing
    AI products intuitively and taking a human-centered approach. What''s perhaps
    most interesting about integrating AI isn''t necessarily the tech itself, but
    the fact that it puts an added premium on the parts of the process that require
    human intervention. Considering the central role that user needs, interests, and
    challenges play in product design, this is further amplified when AI is involved
    in the design process.


    In this section, we will cover some of the unique considerations AI products bring
    to the product design process and how to account for them when designing your
    AI-native products.


    # User obsession


    Whether it''s using AI to better understand and anticipate user behavior, establishing
    profiles and patterns from past interactions with your product, or discovering
    new user preferences and priorities, AI products are prime for making quite a
    lot of progress compared to their traditional software counterparts because of
    the level of knowledge gathering that''s possible with them. In traditional software
    products, we''re still able to gather a lot of data about usage and customer needs.
    This is the nature of product design, as we covered in the first section of this
    chapter. But with AI products, we''re able to align product design principles
    with AI algorithms and gain even more insight from the data we gather.'
  merge: -1
  img_proc: true
- pgno: 234
  md: 'Because the premium of understanding user needs is so high, it’s a top requirement
    for AI products. With more information about users, you’re able to design a product
    experience that’s incredibly appealing and “sticky,” which means it has staying
    power with your end users. Amassing this much information about your product doesn’t
    just impact the overall aesthetics, user experience, and form, but it also creates
    an opportunity where you can create different product experiences for groups of
    users or even individual users. Your ultimate goal in product design isn’t just
    to create a product that works optimally and looks good; you’re also trying to
    create a product experience that’s intuitive and emotionally connected with your
    end user.


    In traditional software products, you might have a threshold where you’re comfortable
    to stop building because you and your go-to-market team might feel the product
    has reached a level where it’s finally fit for general consumption. Sure, you
    might incrementally add more features and adjust your product design based on
    ongoing feedback. But by and large, your product experience itself will be uniform.
    That isn’t the case with AI products, where tailored experiences are the norm.
    In Chapter 7, we discussed the idea of “productizing” the ML service. The idea
    of user obsession in AI product design reinforces that idea because if you have
    infinite time and resources, and you really wanted to, you could design a different
    product for each user. AI not only opens up the notion of personalization, but
    it also stretches the use cases for your product as well.


    It’s also not just about knowing your users; it’s also about interacting with
    your users. AI products, particularly these days, often incorporate generative
    capabilities to capture the nuance of their users’ needs. This means that instead
    of having a uniform, predefined user experience and the occasional product survey
    going out to some customers, you’re actually incorporating a lot more opportunities
    to interact with your end users. Perhaps your product has a chatbot, voice or
    video component, which we’re sure to see more and more products having with the
    passage of time. You’ll be able to get more feedback, understand your users’ sentiments,
    and interact with your users in a more casual way than you otherwise would with
    traditional software products.


    Finally, all the data that you’re able to gather doesn’t just make for a better
    product experience and better user engagement, but it also makes it easier to
    predict future user needs and interactions. This makes the design process itself
    more fluid. It’s not just that the ML algorithms are always learning, but so are
    you as a PM. Understanding historic trends in behavior and preferences offers
    PMs and designers a way to even further entrench their products into the psyche
    of their end users in a way that unequivocally demonstrates that they get what
    their end users care about and want from their product.


    # Machine learning


    Sure, this one seems pretty obvious. We’ve gone over the requirements for the
    ongoing product management of AI products over various chapters in this book but
    it’s worth echoing in this section as well. Unlike traditional software products,
    AI/ML products are not a set-it-and-forget-it kind of product. You’re not establishing
    a list of rules that you’ll update and check once a quarter or using a static
    data sample to power your product (most likely). You’re creating an AI system
    that will support the ongoing maintenance and evolution of your product overall.'
  merge: -1
  img_proc: true
- pgno: 235
  md: 'This includes data and ML models you''re using to power your foundational product,
    data and ML models that will handle incoming activities, as well as data and ML
    models that will handle outgoing activities related to your product. That''s a
    lot of data and modeling to keep a handle on, which means your product will evolve
    over time. Data drift, model drift, and evolving customer needs and preferences
    are all factors that will necessitate changes to the AI/ML algorithms that will
    support your AI products, particularly as you scale. Remember from earlier chapters
    that your data strategy and management will be an integral part of your AI PM
    work because AI systems require large amounts of data to get running optimally.
    With your product live and in production, your data needs will increase, not decrease.


    Your product design team will need to account for this flux, whatever it may be.
    It will be hard to know upfront, of course, what that flux will look like. But
    there will be flux nonetheless. Training, adjusting, hyper-parameter tuning, and
    retraining your AI/ML algorithms will be part of the continuous maintenance and
    refinement that your product will undergo to make sure your models are up to date
    and accurate, working optimally and aligning with evolving customer needs. Building
    that time and resource allocation into your product design flow will be a key
    part of your AI product strategy.


    Often, AI products will also be accompanied by features that offer a dashboard
    of trends, insights, and recommendations. Translating all that data and model
    activity into a framework that offers those outputs in the form of informative
    action steps for your customers is a moving target, but there will have to be
    a way to account for all the adjustments in data/model activity and to then package
    those adjustments in the form of recommended next steps for your end users. In
    traditional software products, your requirements might be more limited and externally
    set. You might do some market research, talking to potential users to arrive at
    a list of set specifications for your product, and they might routinely change
    based on ongoing efforts. But with AI products, this work is constant and incessant.
    If you don''t have a plan in place to capture this complexity, your product and
    customer success teams will be overwhelmed.


    # Explainability


    The consumer is changing, particularly when it comes to AI and the role generative
    AI has played in making AI capabilities accessible to the general public. The
    marked shift that came with the release of ChatGPT has implications for not just
    how consumers use and purchase products but also how they advocate for and evangelize
    those products. Whether you''re on the B2B or B2B side of PM, you''re going to
    have to do some explaining to somebody, and how you''re going to do that will
    be wrapped into your brand strategy whether you like it or not. This is because
    AI ethics are becoming woven into a company''s brand identity. Are you going to
    design the kind of product that''s created by a company that''s committed to data
    privacy and AI sustainability... or one that''s not?


    Consumers might not yet be well versed enough in AI to understand the variety
    of models that power the AI products they''ve come to know and love as household
    names. But that day is coming, and books like this one help with democratizing
    that kind of AI knowledge. Traditional software products don''t need to worry
    about that kind of transparency as much as AI products do because they''re scrutinized
    more heavily. Perhaps discussions around data privacy have accelerated with the
    rise of AI integration in products because AI systems require so much data and
    a lot of damage can be done with that data. Building trust with users is also
    important as data breaches and cybersecurity attacks become more common. Many
    AI systems will be incredibly vulnerable to these kinds of attacks.'
  merge: -1
  img_proc: true
- pgno: 236
  md: 'Even if consumers don’t have a deeper knowledge of AI, they do know that algorithms
    account for data points in a variety of weights, so sharing more about which models
    give more weight to which factors will be valuable information for them to have.
    B2C consumers may be concerned about these things for their own personal use,
    safety, and responsibility. B2B consumers will want to understand how your product
    works before their companies invest in you. They also may be subject to fines
    or litigation if they don’t do their due diligence to properly vet your product.


    You don’t have to divulge a lot of information to offer your end users a glimpse
    into the inner workings of your product. Particularly with neural network-powered
    generative AI models, where determinations might not be so obvious for the builders
    of the products, there has to be some way to offer insight into how AI products
    are making certain decisions. Automated decision-making and determination can
    be scary and inaccurate in the best of circumstances, when you have tons of clean,
    representative data and you’re building your product with integrity.


    Many consumers have seen what happens when that isn’t the case. Certain AI products
    may have frozen them out of potential jobs or mortgage rates if they haven’t been
    de-biased. As a PM, the most encouraging part of the cultural shift as it pertains
    to AI products comes from bias. Consumers don’t want to trust AI products that
    are biased and they reward brands that make a commitment to transparently proving
    that they’re building ethically in any way they can. Soon, we will start to see
    more regulations that demand this kind of auditing and it won’t just be largely
    consumer-driven. Building thought leadership, communication, and documentation
    that demonstrates your product is fair, unbiased, and accountable should be a
    big part of your AI product design. You’ll be rewarded by your customers, peers,
    end users, and critics alike for it.


    The design process needs to account for all the challenges and opportunities AI
    brings to a product. You’re not just designing a product that will be used by
    a user. You’re designing a universe that will be experienced by a variety of cross-functional
    teams, stakeholders, customers, and observers. Your product will need to communicate
    to the world that it understands why it exists through marketing, customer/user
    engagement, and, frankly, success. It will also need to communicate that you’re
    using AI/ML responsibly and ethically.


    One of the central ideas we keep coming back to when we talk about AI products,
    as we have done across many of the chapters of this book, is that AI adds more
    complexity to an already complex ecosystem of jobs-to-be-done. Product management
    is already a multidisciplinary, complex role. You already have to balance a lot
    of hats. You’re zooming out and assessing how your product is doing from a high
    level and you’re zooming in and thinking about which story points need to make
    it in the next sprint. You’re working with a design, development, and go-to-market
    team. That’s a lot of variance for one role. It’s a constant juggling act that
    needs to be done by someone who intuitively and deeply understands the product
    your company is building. That’s still the case with AI products, but as we’ve
    just seen, you’re balancing even more factors than you otherwise would with traditional
    software products.'
  merge: -1
  img_proc: true
- pgno: 237
  md: '# Choosing your priorities wisely


    We started this chapter with an overview of general product design principles
    and some of the top factors that impact the AI-native product design process.
    Now, let’s turn to the essential task of setting priorities, which lies at the
    heart of the AI PM role. The work of product management always eventually turns
    to discussions of priority. What do we work on first and why? That prioritization
    will not only be informed by your product strategy but also by your leadership’s
    values and the company mission as well. The product function doesn’t live in a
    silo. It’s an extension of the leadership at the company and the overarching values
    of the organization itself. Prioritization is impacted by organizational values,
    the broader mission, and the interplay of competing needs.


    As you’re establishing priorities for your AI-native product, it’s important that
    you’re maintaining product clarity and a shrewd balance of complexity, and aligning
    this with your product and company’s greater mission and brand. We will cover
    these topics in the upcoming sections, but first, let’s explore some foundational
    considerations for prioritization:


    +   - **Purpose-driven priorities:** Make sure you’re building teams and working
    in organizations that you believe in. At the individual level, we all have our
    own priorities for joining certain missions. Within the confines of this book,
    we talk a lot about product roles and the way things ought to be, understanding
    full well that we don’t always have the luxury of doing things in order and with
    full resourcing. Limitations like resource constraints and time crunches exist.
    We might not always have the perfect leadership, team, or budget, but we can always
    decide if signing on to work on a product or with an organization is aligned with
    our values before committing.

    +   - **Trust in leadership and teams:** You need to trust your leadership in
    order to manage their product. If you’re a CEO or technologist, you need to trust
    the people working on your product in order to be effective. So, before we get
    into priorities and how to balance them, make sure you work with people who you
    feel have the right balance of values and integrity so that you can do your best
    work. Irrespective of the role or whether you work in the product team, it’s a
    good first priority to have.

    +   - **Communication:** Now that you’re working with a functional team and your
    values align, you’re going to be influencing quite a lot with the decisions you
    make surrounding product design priorities. There are multiple considerations,
    such as the AI architecture that will support your AI product, the aesthetic look
    and feel, your customer journey, and the features that will be included in your
    product. Prioritizing these aspects in a way that’s purposeful will be the guiding
    light that will keep you grounded should you get off course. Communicating your
    priority list during your product strategy meetings will be integral to making
    sure you have buy-in and alignment from your leadership team.


    Now, let’s look at a few considerations about clarity, complexity, and branding
    that will inform how you prioritize your product design elements further.'
  merge: -1
