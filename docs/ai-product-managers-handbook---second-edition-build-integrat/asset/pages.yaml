- pgno: 376
  md: '# Choosing your words carefully


    More and more companies will start to get their message out to their markets as
    they make the steady and sure transformation into AI. Getting messaging right
    with regard to your AI-evolved product can’t be overstated because it’s something
    companies consistently struggle with. As companies pivot to include AI in their
    product offerings, they will need to be thoughtful about how AI capabilities and
    features are communicated because misleading messaging can lead to disillusionment
    among existing users. AI PMs will need to ensure that the language used is reflective
    of the evolved product’s true capabilities and manage expectations accordingly.


    As a PM, I’m always interested in how companies articulate their AI offerings
    and value because I rarely see them getting it right. Most of the time, AI features
    are communicated as a silver bullet, priming their customers for an experience
    they’re rarely going to experience in practice. Incorporating clear and precise
    language about AI features and capabilities early in the design process is essential
    because it helps bridge the gap between what users expect and what the product
    actually delivers. Integrating these considerations into the design phase means
    that PMs and designers can create a new product experience that resonates better
    with users.


    For example, IBM Watson Health was heavily marketed as a leading-edge, revolutionary
    tool for diagnosing diseases and helping medical professionals by suggesting treatment
    plans for patients. The messaging was misleading and positioned the product as
    something capable of more than it was. According to Robert Wachter, chair of the
    department of medicine at the University of California, the company “came in with
    marketing first, product second, and got everybody excited”. Hospitals found that
    the system struggled with real-world medical data and offered irrelevant or incorrect
    recommendations.


    Being clear on how you want AI capabilities to come across to your customers early
    on is also a way to align with user perspectives and reimagine your new product
    experience in a user-centered way. Incorporating ideas of product language fit
    around AI features early in the design process is a way of ensuring you end up
    with a final product that won’t surprise anyone and is built for them. Whether
    you sit in marketing or in the user’s seat, you’ll want the delivery and expectation
    around your AI-powered product to ring true and send the right message.


    # Product language fit


    Creating strong product language fit means being thoughtful with your communication
    style and using precise word choices to convey the appropriate tone that will
    resonate best with users and also manage their expectations. Some aspects of product
    language fit and the way you talk about your product’s AI features and capabilities
    are:


    +   - **Communication style:** Keeping your messaging clear and simple goes a
    long way. You want your language to be accessible and memorable. Avoiding unnecessary
    jargon or overly technical language means that your general audience will find
    your messaging digestible and it will help you engage with a broader audience
    as you re-release your AI bolstered product. Keeping the product messaging on
    user needs and experience, rather than on the AI technology itself, is a way to
    emphasize and contextualize how AI features will be useful or relevant for users’
    real-world experiences, which will, in turn, make your product more relatable
    and valuable to your audience.'
  merge: -1
  img_proc: true
- pgno: 377
  md: '+   - **Word choice:** Look for wording that will convey the truth about your
    AI features and capabilities without exaggerating. For example, rather than using
    terms like “magical” or “revolutionary,” you can reach for more grounded phrases
    like “powerful” or “advanced” to temper expectations. You’ll also want to avoid
    hyperbolic words that convey extremes. For instance, limit how often you’re reaching
    for definitive words like “always” or “never” when describing AI features and
    capabilities so that you’re not saddling potential or existing users with unfair
    perceptions of what your evolved AI product can offer them.

    +   - **Tone:** While many may be excited about the prospect of incorporating
    AI into their products, that excitement can prime users for future disappointment.
    You’ll want your messaging to convey confidence and optimism for your product’s
    next evolution, but in a balanced, informative way. Acknowledging the strengths
    AI can bring to your product experience, as well as the limitations of the new
    features and capabilities, is a way to remain transparent and relatable.


    Product communications aren’t just limited to marketing. Everything from your
    product documentation and thought pieces to social media comments, blog posts,
    marketing materials, and change logs will be impacted by decisions you make early
    on about what AI integration will mean to you as a product team and to your users
    as those experiencing your product. Building consistency with all these communication
    channels early on will foster trust with your user base.


    Disparities between channels or using certain words over others in different contexts
    will only create confusion and distrust. It may even affect the perceived reliability,
    efficacy, and competency of your product. When products are positioned and communicated
    inconsistently, it sends the message that they were built inconsistently too.
    Building an AI program, supporting AI features and capabilities, and retraining
    and preparing your workforce for the shift it will bring are too big of an undertaking
    to leave communication up to chance.


    You will not need to have all your marketing collateral ready early on in the
    product design phase. But you will need to have a devoted meeting or brainstorming
    session about it as soon as you can. It should be a foundational part of how you’re
    ideating the value of the AI features you’re proposing to add to your existing
    product. Even if product communications are coming from different sources internally,
    there should be a universally applied style guide that the product communications
    conform around. Launching a new AI-powered version of an existing product is big
    news for most companies at this point. This means it’s also an opportunity to
    communicate in a way that’s consistent with your brand identity.


    As you continue down the product development lifecycle, you’ll likely need to
    have a strategy on how you’re going to talk about the ethical aspects of your
    AI features that deal with data privacy, governance, model bias, and training
    data bias. Establishing a relationship with trust early on will make you more
    credible if and when you are ready to divulge more details about your AI ethical
    philosophies. Even if you do plan to hold your AI sacred sauce close to your chest,
    users still need to know what the AI features and capabilities in your product
    can and can’t do. They’ll also need some information about how incorporated AI
    is processing and using their data. Building trust and setting realistic, achievable
    expectations is the path to launching a novel product in a way that’s best set
    up for success.'
  merge: -1
  img_proc: true
- pgno: 378
  md: '# # Accessibility and inclusivity


    Language plays a role in how features and products are understood and utilized.
    You’re launching a new product once AI transformation has taken place and, once
    you do, you’ll want your loyal base to come with you on that journey. Abandoning
    them with a product that doesn’t look or sound anything like the existing one
    they’re already used to will introduce a lot of friction to your product rollout
    and your bottom line. As you’re designing your product features early on, you’ll
    want to make sure the new AI features are designed and communicated in a way that
    maximizes a diverse user and customer base.


    What this means is you’ll likely have to incorporate ways of making your product
    accessible to different ages, backgrounds, technical proficiency levels, language
    skills, and even accessibility needs. Using clear and simple language that’s understood
    by all is often the best way to make sure your product’s value isn’t misconstrued.
    For example, Microsoft launched its Seeing AI app to help visually impaired users
    understand the environment around them through image recognition. During the initial
    rollout, Microsoft hadn’t involved the visually impaired community in the design
    and testing phase, which meant that the features they built didn’t meet the needs
    of their users. As a result, the app struggled to recognize complex scenes or
    differentiate between similar colors. The UI was also not intuitive and needed
    simpler, clearer instructions.


    Chances are there will be a few different profiles of various users that you’re
    going to build product onboarding, materials, and resources around as you get
    closer to launch. You may not have these elements ready during the design phase
    but you should be thinking about them. Yes, you will be designing as inclusively
    as you can, but no matter how well prepared you think you are, there will always
    be edge cases. Even without edge cases, relaunching a product will always come
    with some sort of learning curve for even the sharpest of users. Building an onboarding
    library and knowledge base, tutorials, or modules if they’re required is a way
    to make sure your existing and new customers are well supported to continue the
    journey with you. Here are some questions to help you with accessibility and inclusivity
    as you’re evolving your product with AI:


    +   - Are you demonstrating the value of your product in a way that aligns with
    what your users expect from your product already?

    +   - How are the needs of various user profiles in your user base considered
    in your AI product re-design?

    +   - Does the delivery of your AI feature messaging relate and contextualize
    well with the existing knowledge your existing users already have of your product?

    +   - How will you gather ongoing feedback to improve accessibility and inclusivity
    in your AI-evolved product?


    # # Building with trust and security


    When evolving traditional software products into AI products, bias, explainability,
    accountability, and security considerations must be integrated into your design
    process so that you can avoid concerns in these areas after you re-launch. Bias
    can lead to the unfair treatment of users and unintended consequences that can
    hurt your brand and the product’s reputation. Explainability in AI product design
    will help create more trust with your current and potential users.'
  merge: -1
  img_proc: true
- pgno: 379
  md: 'Reinforcing accountability when relying on AI-driven decisions gives your users
    confidence when interacting with your product. Bolstering your product with security
    protocols and ethical design practices will also help mitigate the risks associated
    with the misuse of the data that will be used in your AI systems. Let’s discuss
    these concepts in greater detail and the role they play in product design.


    # Bias


    The perpetuation of bias with AI is a hot topic and it represents one of the areas
    we will need to focus on when addressing ethics and transparency with regard to
    AI. Work with your stakeholders early to understand how you’re going to address
    bias, mitigate its impact, and put guardrails in place to ensure it doesn’t veer
    too far. Whether or not maintaining trust and offering equitable product outcomes
    is baked into your company and product values, it will be an issue raised with
    your user base if the bias is strong enough. If left unattended, this will have
    an impact on your brand identity as well.


    You can minimize the risks and impacts of this by talking with your data science
    teams about how you will manage bias and drift in your data samples. Beyond that,
    you can also conduct regular bias audits, train your models on diverse training
    data samples, and use fairness-aware algorithms. Whether or not you choose to
    incorporate this language into your formal product communications, these practices
    will still help you maintain control over your product performance and risk exposure.
    This is particularly true if your product has the ability to discriminate based
    on race, gender, or other protected classes.


    Here are some key design-related considerations to ensure your product doesn’t
    inadvertently have any biases:


    +   - Include diverse demographic groups (age, gender, cultural, and socio-economic)
    to identify varying needs and perspectives in your user research (interviews,
    surveys, focus groups, etc.) when you can.

    +   - Create prototypes and MVPs of AI capabilities early in the design process
    to conduct usability testing with diverse user groups.

    +   - Incorporate bias mitigation strategies into design specifications/requirements
    for things like diverse training datasets, algorithms for countering bias, fairness
    constraints, and design patterns that promote inclusivity, like language options
    and accessibility features.

    +   - Build feedback mechanisms that allow users to report bias or issues with
    the product directly within the product experience so they have a chance to tell
    you before they tell public channels.

    +   - Keep cross-functional teams involved in product design diverse and make
    sure diverse viewpoints are welcome.


    # Accountability and explainability


    Customers and users will want to know what they can reasonably expect out of your
    product, and depending on how AI-fluent they are, they’ll also want to understand
    how your product arrives at certain decisions or determinations in simple, plain
    language. Whether your users are consumers or business users, you’ll likely still
    have some explaining to do as a product team. Most users need to know that there
    is a clear line of accountability for the AI feature’s actions. Proving to users
    not just that you can be trusted to build responsibly with AI but also that you
    can communicate how and why it is responsible will resonate with people.'
  merge: -1
  img_proc: true
- pgno: 380
  md: 'To ensure explainability of your product, here are some aspects you must account
    for in your product design:


    +   - Perpetuate design transparency by documenting and sharing how AI algorithms
    are being used through user guides, FAQs, and glossaries at varying levels of
    AI fluency so that all users can understand how the new, evolved product functions.

    +   - Incorporate explanations or visualizations of the decision-making process
    that’s happening with the new AI features and capabilities for users to see.

    +   - Incorporate real-time explanations within the product’s UI for users to
    interact with AI features more deeply where you can to make explainability a part
    of your product experience.

    +   - Gather feedback regularly on how well users understand the explanations
    of AI features and capabilities through user testing sessions and make sure the
    design evolves based on user needs and comprehension.


    # Security


    Because of the level of data involved, most AI systems pose a security threat.
    Securing these systems and the swaths of data that are used to power them is a
    considerable undertaking. Building safeguards that address both cybersecurity
    issues and AI-specific vulnerability testing and penetration testing is a good
    way to hedge against potential threats or sources of degradation for the AI systems
    you will build to power your evolved AI product.


    You’ll be working with a number of technical counterparts to create architecture
    that will power your product’s new features and capabilities. Models themselves
    can be targets for manipulation and external attacks, so you’ll want to design
    the system you’ll be creating to detect and handle unexpected or malicious inputs
    that could skew your model’s performance.


    On the data side, you’ll want to encrypt data both when it’s at rest and when
    it’s in transit between APIs. In some cases, attackers could try to poison your
    data by feeding your models data that can produce harmful or inaccurate model
    outputs. Depending on the features you’ll be building, in many cases, they will
    be processing sensitive personal or business information, so preventing unauthorized
    access is important.


    To ensure the security of your product, here are some aspects you can account
    for in your product design:


    +   - Incorporate **role-based access control (RBAC)** to limit those who have
    access to various levels of data, AI/ML models, and outputs.

    +   - Limit access and masking/anonymizing data when you’re training your models.

    +   - Embed security best practices into the development cycle with regular code
    reviews and checks for vulnerabilities both for the AI models that will power
    your AI features and the surrounding infrastructure.

    +   - Build encryption into your AI systems for both data in transit and at rest.

    +   - Securely deploy models using containers and isolated environments.

    +   - Develop incident response plans for AI vulnerabilities.'
  merge: -1
  img_proc: true
- pgno: 381
  md: '+   - Help identify and address security breaches by maintaining detailed logs
    for auditing.

    +   - Maintain compliance with local regulations and privacy laws that are applicable
    to you.


    # Case study


    # Integrating AI into ProjectABZ: A project management tool created by ABCDZCo


    ABCDZCo is an established and trusted traditional software company that''s built
    a brand identity and reputation for building effective operational tools over
    the course of the past 22 years. Their overarching company values are productivity,
    efficacy, trust, and innovation. Their flagship product ProjectABZ, a project
    management tool, has been a dependable staple for small to medium-sized businesses
    since 2015. They''ve amassed a loyal customer base due to their unmatched customer
    service, self-service product capabilities, light onboarding, and ease-of-use
    user experience.


    While ABCDZCo has enjoyed years of consistent sales, robust customer lifetime
    value metrics, and positive customer feedback, they know they can move the needle
    further by bringing their product into the future with AI capabilities and features.
    This poses a double-edged sword for ABCDZCo. On the one hand, they have a soft
    landing with which to test out new AI features with customers that they''ve consistently
    built trust with for years. On the other, executing an AI strategy and design
    incorrectly could impact the good graces they''ve painstakingly built over time.


    Despite the risks, ABCDZCo is ready to take on the journey of building AI enablement
    into their ProjectABZ product design, and they''re willing to roll the dice. Their
    plan is to test out the AI capabilities and features they decide on with a close-knit
    group of trusted super-users and beta testers. They''ve also isolated a key number
    of customers that will represent the initial phase of their AI feature rollout
    before altering their product experience for all customers. While this adds more
    time to their design and development process, they know this will hedge them against
    the adverse effects of AI adoption gone wrong. The upside of winning with customers,
    enhancing their product functionality in a meaningful way, and staying competitive
    in their evolving market means the potential gains are well beyond their potential
    losses. Let''s look at the different stages of the product development lifecycle
    of ProjectABZ.


    # Ideation and research


    The product team at ProjectABZ had a clear objective when revisiting their original
    product ideations and research analysis: they wanted to integrate AI in a way
    that substantially improves the productivity, user experience, and analytical
    capabilities of their product in a way that doesn''t compromise their users''
    trust and security. They understood that this was a big undertaking and made sure
    to work with leadership to manage their expectations about what this process would
    look like and how long it would last, as any product team should.'
  merge: -1
  img_proc: true
- pgno: 382
  md: 'Because ideation can have such a huge impact on your product''s trajectory
    and utility, they made sure to involve stakeholders early and dedicated a significant
    amount of time to brainstorming sessions. By creating a culture that''s inclusive
    of all viewpoints, the ProjectABZ team made sure that project managers, customer
    success, developers, data scientists, and leadership were all well represented
    at these brainstorming sessions. They kept the focus on building a map of the
    user experience journey to better identify pain points and opportunities where
    AI implementation could add the most value for ProjectABZ.


    Significant time went into surveys and interviews with current ProjectABZ customers
    and users to understand their needs and concerns with regard to AI implementation,
    which yielded the following insights:


    +   - Users consistently voiced concerns about ProjectABZ''s ability to help them
    with task management, something that was often a source of feeling overwhelmed.

    +   - They also expressed a heavy demand for forecasting and predictive features
    to help with planning and budgeting.

    +   - There was concern about the privacy of their data and whether they could
    trust the determinants of AI systems as a whole.


    The ProjectABZ product team didn''t want to create design silos. They didn''t
    wait for the full list of potential ideas before running a feasibility study on
    them. They created a staggered approach where as soon as one idea was identified
    and found worthy of being on the list, they tested the feasibility of that idea
    early. While this might sound chaotic to some, doing this allowed them to evaluate
    the technical feasibility, market appetite, and philosophical alignment of that
    idea with their overarching company values. Their goal was to have a shortlist
    of AI features and capabilities that could be developed within the next eight
    months that also had compelling benefits for their users and customers.


    After several rounds of ideation exercises, brainstorming sessions, and feasibility
    testing sessions, they came up with the following list of top AI implementation
    opportunities for ProjectABZ:


    +   - Task prioritization

    +   - Predictive project timelines

    +   - Intelligent chatbot

    +   - Automated resource allocation


    Let''s look at how they went about designing these features.


    # Design and development


    ABCDZCo invested heavily in setting up their data science and ML teams for success
    by having them start their technical research early in the ideation phase. Just
    as the product capabilities, use cases, and user experience had to be re-examined,
    the AI enablement team needed time to research which models, technologies, and
    frameworks would work best for the AI program they were building. They selected
    the ML algorithms to be used for task prioritization, resource allocation, and
    project timeline prediction features, and they used NLP for the chatbot.'
