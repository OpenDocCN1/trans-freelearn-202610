- pgno: 311
  md: 'Here are some tasks that could be handled by a consultant:


    +   - Identifying AI use cases

    +   - Developing an AI roadmap that aligns with the company goals and mission

    +   - Data assessment and inventory

    +   - Data preparation and best practices for data collection, cleaning, and annotation

    +   - Implementing data governance strategies to manage data access, privacy,
    and compliance

    +   - Infrastructure, tool, and platform recommendations for building the AI tech
    stack

    +   - Setting up and configuring AI infrastructure


    # Working with a third party


    Perhaps you want to go with a consulting firm to help you instead of one individual
    person. This would be similar to what we’ve just discussed in the previous section
    but with the following key advantages:


    +   - You’d have the added help of a consulting team or a firm that’s done similar
    work in the past, has worked with a number of companies, and has a good reputation.

    +   - Third parties also tend to verticalize, so you could search within an ecosystem
    of consulting firms that specialize in your specific industry or use case. Understanding
    your own goals in relation to your industry peers is a way to make sure you’re
    going in the right direction from a competitive perspective.

    +   - Working with a group of consultants also allows you to learn from a group
    of people who will then work with and educate your own employees.

    +   - Many companies also struggle to find the right pool of candidates who actually
    have the experience they need. AI is a wide field, and depending on the specialization
    of your product, it might be hard to have enough support internally with the talent
    you already have. Consultancies have their own network of AI talent, so building
    a partnership with a firm you trust means you can have a third party that can
    guide you as your AI/ML needs change over time. It’s a way to hedge against making
    infrastructure or business investments that turn out to be the wrong choice later
    on.

    +   - It’s also a way to make sure you have access to a talent pool that actually
    suits your needs.


    One word of caution for using third parties is that it’s most recommended for
    high-level organizational education or really select proofs of concept. If you
    use a consultant for your product or some internal function and you think they’re
    going to create an awesome ML product for you and let your engineers take it from
    there, you’re going to be disappointed and your ML project will likely fail to
    get corporate or leadership sponsorship because the results will be abysmal. Perhaps
    you’re not ready to have someone on staff yet.


    Perhaps you have great developers who can tune, retrain, and deploy models regularly
    but aren’t up to the task of establishing an algorithm or choosing a model and
    you need someone with more of a statistical background to create the best model
    for your use case. You might be tempted to just use a consultancy to get you to
    level one. Avoid this temptation. If you’re actively looking to start with data
    strategy and AI, use a consultant to educate yourself and arrive at a decision
    on how to move forward, and then invest in having someone who actually knows your
    business from the inside out take it from there.'
