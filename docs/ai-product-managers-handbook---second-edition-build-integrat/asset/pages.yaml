- pgno: 408
  md: 'During the course of my career, I have learned that not all PMs are as customer-focused
    as I am. I’ve even worked with PMs who considered speaking directly with customers
    as beneath them. Today, it feels wild that someone in this role might have that
    perspective; that’s a massive gap in their understanding of their job function.
    Customer experience and customer success are a big focus area for a tech PM because
    they’re disciplines that affect how customers and users actually interact with
    the product experience you’re creating.


    But the idea that a PM reading this book might have gaps in their understanding
    of the AI PM role didn’t sit well with me. Gaps like this have the power to make
    or break your performance in a role or even in an entire career.


    Let’s take a deep dive to better understand how people enter and stay on this
    rewarding and challenging career path. This chapter will focus on those looking
    to start a career as an AI PM, and we will be exploring the following topics as
    the chapter progresses:


    +   - How to get ready as an AI PM

    +   - The current state of the AI PM landscape

    +   - The importance of maintaining communities

    +   - Interview skills and recommendations

    +   - The paths available to you as a novice AI PM


    We won’t be spending any time on what the AI PM role looks like here because we’ve
    covered the various sides of this throughout this book already. We will instead
    focus on applied, practical steps to get your career going because, chances are,
    if you’re still interested in it up to this point, you’re probably ready to take
    the next step.


    # Bolstering your knowledge in theory and practice


    A healthy blend of theory and practical experience is essential for building competency.
    In this section, we will explore an overview of skills, resources, and credentials
    that can set you up for success when you’re approaching a career as an AI PM.
    Theory provides a solid foundation for understanding AI concepts like ML algorithms,
    data science, and AI ethics, but practical experience helps an AI PM hone in on
    real-world challenges like scaling, model deployment, and integrating user feedback.
    Combining the two allows AI PMs to build a career around making informed product
    decisions and anticipating potential issues.


    # Theory


    We started this book with an overview of the ML landscape in Part 1 because it
    represents the theoretical foundation we need to build on. If you’re interested
    in a career as an AI PM, you’ll have to show that you have some understanding
    of the basic building blocks of AI. You won’t be able to make informed decisions
    or have meaningful technical discussions with your counterparts on ML and data
    science teams without this. Algorithms, data transformations and processing, model
    preparation and training, AI bias, and ethics are all important areas of ML that
    you’ll need to understand well in order to have credibility as an AI PM.'
  merge: -1
  img_proc: true
- pgno: 409
  md: 'There are many learning paths you can take to get there and the option you
    take is largely based on your own learning preferences. Someone can learn these
    concepts all for free on YouTube if they want to. If anything, the democratization
    of concepts and ideas that give people financial and career autonomy is one of
    the shining pillars of tech’s glory. But not everyone will have the patience,
    context, or drive to keep steady progress alone.


    For those who don’t, there are a number of online resources to lean on. **Massive
    online open courses (MOOCs)** like Coursera, edX, and Udacity bring a wealth of
    knowledge for very little financial investment. The financial investment will
    go up depending on how much support you’ll need to be held accountable. MOOCs
    will have some level of accountability because you have to actually complete the
    course in order to get the certificate but they’re made to be easy to understand
    and easy to complete as well. A few reputable ones to note are the professional
    certificates in ML and AI from MIT and the AI Product Management Specialization
    course from Coursera.


    Depending on how deep you want to go with the material, the information there
    might be superficial in that it’s just enough to get you to complete that particular
    course. I recommend MOOCs for those who are already PMs but want to make the jump
    into the AI subject matter. The reason for that is that it can be daunting to
    build up enough credibility through MOOCs alone. People tend to undervalue and
    undermine the efforts people make on their own.


    Without a certificate or degree, there’s an underlying assumption that the knowledge
    acquired on one’s own merits isn’t substantial enough. But that probably has more
    to do with gatekeeping and resentment. If you have hiring power over someone,
    you may be inclined to reward someone who’s followed in your own footsteps, particularly
    if those footsteps were an expensive degree from a US university. But this is
    not my belief. I believe anyone can get a comprehensive enough understanding of
    ML to be an AI PM even with completely free resources.


    Bootcamps are the next phase up from that because they often come with a mentor,
    a seasoned professional in the field, who you can go to with all your burning
    theoretical questions. But be discerning with these. Many offer a money-back guarantee
    but that’s slowly falling out of favor when coming up against an unpredictable
    job market. Even if they don’t offer a job guarantee, they should be able to give
    you confidence to help you understand, retain, and demonstrate your new ML skills.
    Typically, these programs come with career coaching as well, so you’ll often get
    a coach who will help you to interview for jobs as a result.


    For those who are serious about getting their AI PM career going, I recommend
    spending at least a year or two in a data science or ML engineer role if you can,
    particularly if you take the bootcamp or MOOC route. As an AI PM, you’re going
    to be working with data scientists and ML engineers quite often. You’ll want to
    understand the challenges they’re up against when they’re working in production
    and it can be hard to empathize with them if you haven’t faced these challenges
    yourself yet.'
