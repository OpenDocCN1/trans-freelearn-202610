- pgno: 432
  md: '**Recommended steps:** Demonstrate thought leadership by writing about how
    your AI product is being developed and deployed ethically and how you mitigate
    issues of bias, fairness, or transparency when they arise. Share these pieces
    with your network and peers. Encourage broader discussions on the importance of
    ethics in AI and engage in these conversations to position yourself as a knowledgeable
    advocate.


    # Team leader


    You act as a team leader by making sure all stakeholders are aware of their role
    and their importance to the product team. This involves creating an inclusive
    environment where team members feel empowered to approach you with questions or
    concerns regardless of your direct management role. Keeping open lines of communication
    fosters trust and encourages people to collaborate in a productive, dynamic team.


    **Recommended steps:** Communicate to your leadership team or direct manager about
    how you’re leading teams, fostering collaboration, or resolving conflicts when
    they arise. Highlight how you facilitate teamwork and share updates on team performance,
    challenges faced, and goals achieved.


    # Storyteller


    As a storyteller, your role is to regularly communicate the product vision, strategy,
    value proposition, and the benefits those things will bring to stakeholder teams.
    You also tell the story of your product and what it can do for your market, customers,
    and users. Good AI PMs know that effective storytelling is about clearly articulating
    narratives that resonate emotionally with audiences to keep them invested. By
    connecting the benefits of your product in relatable and compelling ways, storytelling
    can inspire action for internal teams and users alike. As you weave your stories
    into various pieces of product collateral or promotional opportunities, you’ll
    refine how naturally and authentically you deliver your message.


    **Recommended steps:** Regularly communicate the product vision, strategy, value
    proposition, and the benefits those things will bring to stakeholder teams with
    every major sprint, product update, or pivot. Enhance your storytelling skills
    by weaving your storylines into various communication channels like presentations,
    newsletters, customer-facing changelogs, blog posts, meetings, formal talks, podcasts,
    articles, happy hour conversations, or anything else applicable.


    # Motivator


    When the team loses inspiration, when they forget what they’re doing and why they’re
    doing it, you’re the one who’s going to help them remember what their hard work
    is all for. Drudgery and overwhelm can set in when you’re working a full-time
    job. Without the influence of someone who can bring the team back to the core
    purpose of their work, stagnancy and disillusionment can set in. By keeping the
    big picture alive, you remind everyone of the impact and meaning behind their
    efforts. Encouragement and perspective can reignite drive and help others overcome
    obstacles with renewed purpose and optimism. This is one of the more emotional
    aspects of the job and good AI PMs have the emotional intelligence to recognize
    when this important ingredient is missing from the team.'
  merge: -1
  img_proc: true
- pgno: 433
  md: '**Recommended steps:** Affirm the product vision and goals when others seem
    lost, frustrated, disillusioned, or confused. Acknowledge individual and team
    contributions publicly or privately, as appropriate, to strengthen morale and
    reinforce the value of their hard work.


    # Knowledge sharer


    You’ll lead by example by creating a culture of continuous learning and knowledge
    sharing regarding AI, the market, or areas related to your product. Because successful
    working AI PMs are already in the process of acquiring and reinforcing knowledge
    for their own personal excellence, this role is about sharing and applying that
    knowledge with others. The goal here is to disseminate information. By actively
    finding moments to share insights, resources, and product knowledge, you’re making
    sure your team and stakeholders remain well informed and empowered to make their
    own decisions. This contributes to overall growth and expertise within your organization
    and it fosters a lot of trust and belief from your coworkers.


    **Recommended steps:** Maintain a public calendar of knowledge sessions, training,
    and resources, and make public announcements when there has been a contribution
    to your product’s knowledge base.


    # Problem solving


    This aspect of the AI PM role encompasses the various responsibilities of the
    role. Solving a problem is about considering a variety of potential solutions
    and bearing the responsibility of settling on one choice that will bring the most
    benefit. AI PMs have to sift through a variety of problems ranging from customer
    feedback to regulation and compliance; necessary technical adaptations to general
    conflicts that can arise. There’s no shortage of problems at a company, but there
    is a shortage of effective problem-solvers. Many organizations face challenges
    related to communication breakdowns, resource limitations, and evolving market
    demands. Building your problem-solving muscles to navigate complexities, identify
    root causes, and enable collaboration will serve you in many situations.


    # Customer advocate


    As a customer advocate, you’re often placed in a position where you’re sifting
    through various channels of customer feedback and looking for opportunities to
    optimize product development in service to the major trends your users and customers
    are consistently delivering back to your product organization. You prioritize
    user needs and pain points to ensure your product has a real impact on what’s
    most meaningful to them – to make sure it’s genuinely addressing enhancements
    that would positively impact their lives. You empathize with the end user’s journey
    and craft an AI product experience that meets their needs and fosters loyalty
    through consistent, value-driven improvements.


    **Recommended steps:** Develop compelling case studies that demonstrate how your
    product delivers value to your customers/users. Collect and present major user
    feedback, reviews, testimonials, and survey findings to stakeholders to reinforce
    product alignment with user priorities and build evidence-based support for future
    product iterations.'
  merge: -1
  img_proc: true
- pgno: 434
  md: '# Regulatory complier


    While your organization might have legal teams that are more heavily concerned
    with regulatory oversight and adherence to frameworks for auditing purposes, you’ll
    likely need to work with those teams as you’re increasingly integrating AI into
    your product experience. This means staying familiar and up to date on legal standards
    and regulatory frameworks in order to ensure your work aligns with them and doesn’t
    pose potential risks. By staying informed about relevant and timely laws and regulations
    that relate to your product, you can also identify opportunities that can add
    value to your product and give it a competitive edge.


    **Recommended steps:** Regularly stay informed about relevant and timely laws
    and regulations that impact your product; be the first to flag potential risks
    and opportunities that compliance with those regulations poses to your product’s
    success. Document insights and potential regulatory or legislative milestones
    you’re anticipating in the future that could impact your product decisions or
    strategic direction long term.


    # Facilitator


    We’ve discussed *knowledge sharer, stakeholder manager,* and *project manager*
    previously in this list, but none of these gets to the heart of what a facilitator
    really does. A facilitator’s primary focus is to create an environment where collaboration
    can thrive across diverse teams and to remove any barriers there might be to that
    end goal. You regularly align with stakeholder teams to prevent friction as much
    as possible and problem solve as to how to prevent it from happening in the first
    place. Facilitators guide discussions to make sure all perspectives are heard
    and that there are no gaps in necessary conversation streams when teams do collaborate
    and meet. Facilitators also help the team work through misunderstandings before
    they become serious threats or blocks. Proactively managing group dynamics, identifying
    areas of misalignment, and encouraging open dialogue may be aspects of other roles,
    but they’re not the primary focus.


    **Recommended steps:** Maintain a regular cadence with all major stakeholder teams
    to regularly keep them up to date on product goals, milestones, and changes. Do
    not meet with them ad hoc. When meetings do occur, make sure the agenda is representative
    of the goals of that meeting and that all relevant voices have the freedom and
    safety to speak openly.


    # Data-driven decision maker


    Earlier, we covered the *analyst* role, which focuses on tactically finding trends
    in data concentrated on user behavior and engagement metrics. While this is a
    skill set in and of itself, acting on those trends and insights and weighing options
    for how to move forward is what this role is all about. You use data and metrics
    to make the right decisions for your product and its positioning based on competing
    priorities from various stakeholders. Aligning decisions with overall product
    goals and priorities means the product will evolve based on comprehensive data
    insights. In this role, AI PMs facilitate discussions with leadership and stakeholders
    about decisions that will shape the direction and positioning of the product long
    term.'
