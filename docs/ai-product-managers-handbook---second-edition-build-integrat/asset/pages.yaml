- pgno: 291
  md: 'Here are some accompanying questions:


    +   - Do your stakeholders feel comfortable voicing ethical or safety concerns
    during your recurring meetings?

    +   - How does your organization facilitate open discussions about ethics, data
    privacy, and algorithmic bias in AI product development?

    +   - Does the company encourage employees to upskill or receive AI training and
    other efforts to promote data and AI literacy?


    **Innovation:** Once you get into a day-to-day routine, the inertia of a repeatable
    sequence sets in. Breaking out of this can be hard for organizations that have
    tight deadlines or inundate themselves with milestones. It can be tempting to
    do this. Nothing makes someone feel like they’re useful and capable quite like
    a checklist. But often, we fall into the trap of creating urgency and scarcity
    in our efforts to feel useful. Try to create space in your organization for experimentation
    to thrive. Perhaps you can bring a small group of people together or encourage
    them to spend 10% of their work hours exploring new ideas. Or you could set up
    an AI innovation lab and let that be a day once a month where your research, AI,
    data, and product teams can collaborate on innovative new product offerings. Consider
    fostering a culture of innovation by establishing dedicated time for teams to
    brainstorm and develop new ideas. We’re still early in AI adoption and organizations
    that prioritize this stand to gain a lot. Doing so will help promote a culture
    of curiosity, which will empower your organization to dream up new possibilities
    that otherwise wouldn’t exist.


    Here are some accompanying questions:


    +   - When was the last time you and your team felt you had the brainspace and
    freedom for a truly out-of-the-box brainstorming session focused on AI innovations?

    +   - Does your leadership team see innovation as a worthy investment in the future
    of the company?

    +   - How are new ideas and experiments prioritized within your AI product development
    cycle?

    +   - What structures are in place to ensure innovative ideas generated during
    brainstorming sessions are captured and effectively acted on?


    **Boundaries:** In the world of AI, there’s always something new and exciting
    to read or discover. You could be working around the clock. But promoting a positive
    work culture has to be a priority for PMs. You shouldn’t be sending communications
    out after hours or working during your vacations. We lead by example; doing so
    communicates to your peers and stakeholders that this behavior is acceptable and
    that they should do it too. Burnout is hard to recover from and as an AI PM, you
    should be avoiding that at all costs. We aren’t machines; we’re biological creatures
    that need rest and strong boundaries if we’re going to take on challenging roles.
    You won’t be effective for anyone if you can’t maintain boundaries for yourself
    and nurture your well-being. Doing so sends a powerful message to others that
    they should too. The organization will benefit tenfold from having an energized,
    engaged workforce.'
  merge: -1
  img_proc: true
- pgno: 292
  md: 'Here are some accompanying questions:


    +   - Do you feel overwhelmed by your responsibilities or are they a source of
    excitement and motivation?

    +   - Does your work ethic make others feel supported and does it encourage them
    to maintain their own boundaries?

    +   - What strategies do you use to disconnect and recharge?


    Working in an organization that prioritizes and invests in its employees is empowering.
    We should all be looking to work for organizations that value and model this behavior
    because those are the organizations that benefit from an engaged, dedicated workforce.
    When people feel empowered, they feel big and bold. It gives them the energy to
    push forward with love and without fear.


    # The guts — Managing the rest


    In the world of an AI PM, managing “the rest” encompasses the resilience and adaptability
    to navigate the unpredictable landscape of technology and market demands. Responding
    to challenges as they arise, proactively identifying risks and opportunities that
    impact your product’s success, and managing the day-to-day functional operations
    of an AI product is a heavy load. AI PMs frequently need to use data to inform
    decisions, iterate quickly based on user feedback, and stay on top of industry
    trends and competitor movements to remain effective. Cultivating a mindset of
    experimentation and embracing mistakes is a stepping stone to innovation and sustainability
    when it comes to managing AI products. As with the machines that learn from past
    mistakes, so do we. Building a gut instinct for resilience and adaptability will
    help manage the complexity of AI products in a way that keeps the team aligned
    and motivated for the long haul. Let’s go over various areas we will manage over
    the course of our AI PM work that will help us approach challenges with confidence
    and creativity:


    +   - **Data:** All AI products need to have an effective data management strategy
    to function properly as AI products. Understanding elements that relate to data
    collection, cleaning, preprocessing, scraping, and privacy will ensure that you’re
    effectively managing the data side of your AI product. Data management issues
    can eventually have an impact on data quality and significant issues there will
    render your AI systems useless. Improper management and maintenance of data could
    open you up to legal risk as well, particularly if you’re not adhering to data
    privacy regulations. Over time, we’re likely to see more data privacy regulations
    and legislation so make sure you’re prioritizing this work.


    Here are some accompanying questions:


    +   - How do you ensure data quality, integrity, and governance throughout the
    life cycle of your AI product?

    +   - Have you examined all relevant data privacy, collection, and processing
    regulations that are applicable to your AI product?

    +   - Would you be proud to talk publicly about your data management practices?

    +   - What strategies do you employ to monitor and improve your data management
    practices?'
  merge: -1
  img_proc: true
- pgno: 293
  md: '+   - Have you established a framework for ethical data usage that includes
    considerations for bias and fairness in your AI models?

    +   - What process is there in place to incorporate feedback from data scientists
    and ML engineers regarding data management challenges/opportunities?


    **Centralize:** A lot of communication happens asynchronously when managing AI
    systems due to the cross-functional nature of AI development, so it’s great to
    have a central repository where people can find ways to collaborate and communicate
    that way. Tools like Confluence, Notion, Jira, Trello, and Asana all serve as
    a knowledge base or a place to come together and ask questions relevant to certain
    areas like tracking AI/ML model development, managing data pipeline progress,
    and user research insights. They also communicate what product areas are being
    worked on at which time. The most challenging part of this is getting people to
    use and rely on them consistently but once they do, you’re reducing the need for
    synchronous face-to-face updates. This also means that when you do meet synchronously,
    you’re making the most of the time you do have on more substantial, in-depth,
    and strategic conversations.


    Here are some accompanying questions:


    +   - Are the AI/ML and data science teams effectively documenting model experiments,
    metrics, and decisions within your centralized tools?

    +   - How do you make sure communication breakdowns between AI, data, and product
    teams are minimized, especially when experimenting with new models or datasets?

    +   - Are there tools you’ve invested in that your teams don’t like or don’t want
    to use?

    +   - Can the tools you’re using help automate routine communication like reminders
    or task updates to reduce manual efforts for your teams?


    **Training:** Often people don’t end up using certain tools or adhering to certain
    practices because they haven’t been properly trained for them. Not everyone is
    going to be excited about adopting a new tool or learning a new way to do something.
    Inertia is real and most people want to streamline their work as much as possible.
    Learning something new can often be an impediment to that, so encourage your team
    and the stakeholders around you to join training sessions to better understand
    PM processes and tools. Training is also a good way to keep various teams up to
    date on new trends, AI best practices, or even new AI tools that have recently
    come on the market.


    Here are some accompanying questions:


    +   - Is there a way for you to gauge people’s interest or satisfaction with certain
    tools, particularly those that have AI capabilities?

    +   - Are any tools in the current tech stack too difficult, time-consuming, or
    cumbersome to use effectively?

    +   - Do non-technical stakeholders receive training on AI concepts relating to
    data science, ethics, bias detections, fairness, and model interpretation to bridge
    any gaps?'
