- pgno: 123
  md: 'It quickly rose to unicorn status for expertly meeting its customers where
    they were. Canva did this by conducting extensive market research to understand
    the needs and pain points of potential users and analyzing existing design tools
    to identify gaps in the market and discover areas for improvement. It also segmented
    their audience based on design complexity, industry-specific needs, and whether
    they were professional or non-professional users, allowing the company to tailor
    offerings specific to different user groups. One of the biggest contributors to
    Canva''s success was the freemium model, which attracted a wide range of users.
    Those who had more specific needs could address them with paid features, but the
    freemium model allowed Canva to meet users at different stages of their design
    journey.


    What''s most interesting about disruptive strategies is the ability to influence
    your potential customers by showing them a different angle. Disruption changes
    the paradigm of the existing power structures in a market and a new tastemaker
    arrives to inspire their competitors and customers alike to try new things with
    regard to how they ask for and use a product. This change in paradigm offers the
    entire market the gift of novelty and specialization. Maybe the job gets done
    worse, but this is beneficial for a new group of proposed customers. Perhaps this
    new group is one none of the other competitors thought to try and serve. Canva
    also offers us a glimpse into the potential danger disruptive strategies can face.
    Recently, the unicorn company was in the news for raising annual prices on their
    business-focused subscription service by 300% or more, driving users to threaten
    to abandon the software for competitors and claiming it''s no longer the "simple
    and affordable alternative" that got them to buy it in the first place. Canva''s
    response was that the new prices reflect the true value of their new AI-powered
    product experience. In this case, Canva appears to be abandoning its disruptive
    strategy for a more... differentiated strategy. This example is also a reminder
    that investing in AI is likely to incur costs that your company will then have
    to pass on to your users and customers. This decision may, in turn, affect your
    go-to-market strategy.


    # The differentiated strategy


    In a differentiated strategy, you may sell a superior product that specializes
    in some niche, but you also charge more for it to account for this specialization.
    My differentiated strategy example is a company that his close to home: a British
    machine learning-based property tech company I worked with named Beekin. Beekin
    isn''t a property technology platform that offers cheaper services than its competitors,
    but at the time, it offered a next-generation platform no other property tech
    company was able to offer. We built a machine learning-native platform that did
    everything from making market evaluations to predicting future behaviors to offer
    an optimal price for renters. Our customers didn''t have many options for competing
    tools because their alternatives were property tech giants with antiquated rule-based
    engines, and the competitive landscape in property tech is only just being disrupted
    by AI.'
