- pgno: 170
  md: 'Waterbear Inc. is building a flagship product, Akeira, to help tackle the mental
    health epidemic we’ve seen been exacerbated by the Covid-19 pandemic, specifically
    for women over the age of 18. What began as an idea to help people better understand
    themselves has now turned into a viable product people are using to get a better
    read on how their sentiments and moods are changing over time. The product uses
    NLP to scan journal entries that users type into the application, establish goals
    and focus areas the user wants to work on, and recommend activities and questions
    to better help them reach their personal goals.


    Despite funding hurdles and difficulties early on to acquire users, they’ve now
    reached a milestone. They’ve acquired series A funding and have now acquired the
    resources needed to pursue new customers and build out their internal teams. Their
    mission of helping individuals better understand themselves and rise above their
    psychological blocks is well on its way. Waterbear’s approach is holistic; they
    want to build an organization where job functions are seamlessly integrated to
    ensure not only an efficient product lifecycle but also a healthy pace for the
    company’s scalability and employee well-being.


    Based on concepts we’ve discussed in this chapter, we will be offering a breakdown
    of how the product navigated through each phase of the AI product development
    cycle, how various job functions work together to run this product, what their
    tech stack looks like, which AI outputs make the most impact on the product, how
    they’ve verticalized this product so far, and what their current GTM strategy
    is.


    # AI product development cycle


    First, let’s revisit the stages of the product development lifecycle covered earlier
    in this chapter and see what this looked like for Akeira:


    +   - **Ideation:** The Akeira product team first began by analyzing how users
    might find value in a mental health tool to offer real-time emotional support,
    analysis, and reassurance. AI features like sentiment analysis, **natural language
    understanding (NLU)** for therapy sessions, and mood tracking through conversational
    data were all considered. Feasibility studies were conducted to make sure the
    data requirements aligned with potential solutions and models that would empower
    the kind of complex language understanding required for mental health contexts
    like detecting distress or tone.

    +   - **Data management:** Mental health-related conversation datasets and anonymized
    therapy transcripts, mood-tracking journals, and relevant social media interactions
    were acquired to support training AI/ML models being used. Emotional tones and
    sentiments were categorized and labeled in preparation for feeding into the AI/ML
    models that would be tried and tested in the third phase.

    +   - **R&D:** Various language models were used but the team finally settled
    on Google’s BERT model. The collected and labeled mental health data from the
    prior phase was used to fine-tune BERT for specific tasks like detecting mental
    health cues in conversation. BERT was then tested for performance thresholds in
    understanding context, intent, and emotional sentiment before being integrated
    into a working prototype or MVP, which became referred to as Akeira. This prototype
    was then shared with a small group of beta testers.'
  merge: -1
  img_proc: true
- pgno: 171
  md: '**Deployment:** Akeira was incorporated into a mental health app of the same
    name and monitoring tools were set up to track how well it was able to identify
    emotional cues in real-time interactions and respond. Now that beta testers were
    actively using the app, teams were able to set up maintenance and monitoring to
    ensure the beta testers were using the app correctly and were seeing benefits
    from it. Feedback mechanisms were put in place to capture their concerns and issues.
    These feedback mechanisms became a prime feature of the app to ensure Akeira could
    regularly gather feedback about the accuracy and sensitivity of Akeira’s reactions
    so that future iterations were adjusted accordingly.


    # Team breakdown


    Let’s take a look at what the team working on Akeira might look like:


    **Product:** One of the first hiring decisions the company made was to find a
    worthy hire for their coveted founding lead PM role. They were looking for someone
    who had experience building AI tools focused on NLP, but they were also hiring
    for passion. Once they found someone who had a proven record for building products
    that help people, with a personal interest in psychology and well-being, they
    were able to trust that person to define the strategy, vision, and roadmap for
    the company’s flagship product.


    Because this person has built AI products in the past, they’re able to work well
    with the subject matter experts, therapists, data scientists, ML engineers, testers,
    customer success folks, and designers to bring their product to the next level.
    They’re able to combine these internal workings with research, competitive analysis,
    user feedback, and external data sources to understand where there might be opportunities
    for the product moving forward. They understand that their objective is for their
    product to not only remain relevant but also to innovate and align with the needs
    of the market they’re serving.


    **Data science and ML:** The data science and ML team serving the product has
    their work cut out for them. These folks are responsible for building and training
    the models that power Akeira.


    The data scientists are routinely gathering insights from their user data to better
    understand what kind of user behavior leads to the optimal use of the product.
    Their work focuses primarily on A/B testing various models and using statistical,
    probabilistic, and predictive approaches to NLP to continuously improve their
    AI models, and they regularly share their findings with their product and ML counterparts.
    They also spend a lot of time bolstering various **large foundational models (LFMs)**
    with specialized, technical data that comes from the therapists they work with
    to ensure the viability of the product. Most of their time is spent on exploring
    the data, feature engineering for the models, choosing the best models for deployment,
    and using their knowledge and expertise to interpret the results of their models.
    They’re primarily coding in Python and they hand off these models as outputs to
    the ML engineers they work with.'
