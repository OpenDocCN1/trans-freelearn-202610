- pgno: 142
  md: '# Basic needs — AI for Good


    Having started my career in sales and account management, I took its competitiveness
    for granted. But one thing that really struck me about the AI/ML community when
    I first joined was how collaborative and benevolent it was. There were so many
    open-source projects you could get involved in. You could put your projects up
    on Kaggle and win competitions. You could find an almost infinite supply of solutions
    to problems on Stack Overflow. I found a lot of success reaching out to people
    who shared their perspectives on their area of AI. Never was this more apparent
    than when I reached out to potential speakers to host a panel or a workshop to
    teach others. It makes this field all the more compelling because if you do want
    to focus on a particular AI solution, you can find lots of friends along the way
    to join your cause and support you.


    Saving ourselves from ourselves is big business for AI, and there are many companies
    that put humanitarianism in their business model, using a combined passion and
    entrepreneurship to bring products to market that also benefit society on some
    level. You’ll likely see the term *AI for Good* used by organizations that look
    to use AI for some social or humanitarian cause. Many of them work with other
    companies, schools, governments, and NGOs collaboratively to address certain causes.
    The **AI for Good** nonprofit organization has worked on smart cities, workforce
    diversity, AI ethics, and Economists for Ukraine projects alongside the United
    Nations **sustainable development goals (SDGs)** SDGs. The UN itself has the **International
    Telecommunication Union (ITU)**, a specialized agency for information and communication
    technologies that has its own AI for Good year-round platform to host volunteers
    and serve their communities as well. There are more ecosystems, such as Omdena,
    DataKind, and Teamcore, that look to collaboratively address humanitarian causes
    as well. Microsoft, H2O.ai, Google, and IBM also have their own AI for Good initiatives.


    AI for Good is such a wide area covering everything from environmental protection
    and disaster, water and food scarcity, and disasters caused by nature or war,
    offering assistance and accessibility for a variety of impairments, sustainable
    development, resource management, public safety, and many more. Let’s look at
    some examples from different domains:


    +   - **Water systems:** Nonprofits like Earth05 are creating an open-source community
    of scientists, academics, innovators, start-ups, and organizations that can use
    AI to predict and analyze future water systems and consumption, optimize water
    delivery systems, and create better irrigation systems toward the goal of positively
    impacting over 500 million people by 2030.

    +   - **Agriculture and food distribution:** Sustainable food distribution and
    urban farming projects are being powered by AI, where companies such as Square
    Roots and Bowery Farming can make sustainable indoor farming more popular and
    widely adopted, particularly in cities where access to local fresh produce is
    challenging and continuously in demand. Companies such as Peat are able to help
    farmers in insecure areas better maximize their yields with their product Plantix.'
  merge: -1
  img_proc: true
- pgno: 143
  md: '+   - **Disaster relief:** This is another area where we see quite a lot of
    investment when it comes to AI for Good use cases, particularly in situations
    where there are search and rescue needs, harsh weather conditions, fires, and
    other natural disasters. Autonomous drones like Fotokite’s Fotokite Sigma and
    robots like Shark Robotics’ Colossus will become increasingly relevant as we experience
    extreme weather patterns exacerbated by climate change that put human first responders
    at greater risk.


    Bringing products to market that affect people’s access to basic needs is one
    of the greatest expressions of AI products we see out there, and we want to remind
    you of the importance of divergent thinking here with regard to ideation. Where
    AI for Good is concerned, we are barely scratching the surface of what AI can
    do, and we would recommend people who enter this realm as AI PMs focus most of
    their attention on the ideation phase. Once you’ve found a worthy application
    of AI for some social good, practice the use of divergent thinking. Hone in on
    the end result you’re looking to achieve with AI, and use this as your guide in
    your ideation phase. Building an MVP will come with its own considerations, and
    you’re already crafting this offering for the benefit of all and combining it
    with a way to create commercial success with your tool, so you can really take
    your time with ideation.


    # Summary


    This chapter concludes *Part 1* of this book. We started with an introduction
    to AI and the infrastructure required to support it, went into the weeds of model
    maintenance and the particulars of ML and deep learning, saw a mix of applications
    and business model examples of AI products, and concluded with a glimpse into
    where AI is going next. We saw how AI can transform products by enhancing decision
    making, automating processes, and personalizing user experiences. To achieve this,
    PMs need to think about how their products best create value and how AI can maximize
    that value. While AI can leverage large datasets to demonstrate the effectiveness
    of products and policies, PMs must be aware of how bias and ethical considerations
    should be handled in their products to avoid controversy. Products across sectors
    are also susceptible to an evolving landscape of regulatory requirements. This
    was by far not an exhaustive list in terms of the future of AI, but I believe
    it’s representative enough of where we’re heading to offer those in AI product
    management a few insights into a few major sectors that shape our world through
    AI. AI is often discussed as an integral part of the Fourth Industrial Revolution,
    but when we consider just how many facets of our world and our businesses AI will
    impact, it’s easy to see why we are constantly returning to the gravity of these
    terms. We know that we will continue to see more novel ideas of how to harness
    AI, and that’s what makes this period of AI implementation so exciting.


    *Part 2* will expand on AI-native products by focusing on what it takes to understand,
    ideate, create, and productize AI. We will focus on practical applications and
    case studies that explore how AI products can be customized and how performance
    can be optimized, as well as going into some examples of common pitfalls and successes
    an AI PM can run into with the AI-native product. In the next chapter, we will
    be looking at what areas are essential when you’re building an AI-native product.
    We will be looking at the particulars of managing a product from the ground up,
    with certain AI considerations and what AI PMs will need to account for as they
    begin the process of ideating, building an MVP, and ultimately, launching an AI
    product. Though we touched on some of these concepts in this chapter already,
    we will be expanding on them in the next chapter primarily for those who are entrepreneurial
    and are looking specifically to ship products that will meet the needs of their
    market using AI.'
