- pgno: 119
  md: '# The rebels — examples of red ocean products


    Part of the evangelism being done on the part of the pioneering companies also
    applies to the competitive landscape. When you’re in a blue ocean, your competitors
    are your friends because they justify the existence of your product and solution.
    The more competitors you have, the more credibility you have as a business and
    the more you help create a supportive ecosystem with few key players. In many
    ways, pioneers are expanding and covering new ground in all directions.


    Red oceans are markets that have become inhospitable environments with a full,
    mature, and developed competitive landscape. In this environment, many paths have
    already been formed and you have to choose one to live in and serve. You still
    have the option to create something new and you can employ many strategies to
    beat the competition and specialize, but you’re challenged with having enough
    intuition to see what the next step should be. Part of the challenge with having
    such a diverse and thriving ecosystem of competitors is that it’s hard to know
    what direction you want to really go in, or which competitors are truly taking
    a piece of your business.


    Intercom, an Irish-founded company headquartered in San Francisco, has grown to
    become a major player in the customer communication and support software space
    globally. Operating in a highly competitive, red ocean environment, they face
    a crowded market of well-established platforms like Zendesk, Drift, HubSpot, and
    many others. These competitors offer similar customer engagement solutions like
    live chat, chatbots, AI-driven workflows, automated messaging, CRM integrations,
    and customer support ticket tracking. Feature parity, price sensitivity, and a
    focus on existing demand means that their strategies are limited when it comes
    to differentiating themselves in the red ocean they play in.


    In an attempt to stand out, Intercom has highlighted their AI capabilities, such
    as chatbots and predictive tools, to streamline customer interactions and offer
    a more intuitive customer experience. They’ve also emerged as a customer-centric
    option due to their emphasis on a more human-centered, conversational approach
    to dealing with customers. Additional strengths, such as ease of use, a unified
    platform, a robust ecosystem of integrations and APIs, and community management,
    have also helped to secure their place in the market. Their significant investments
    in AI and automation have allowed them to automate routine tasks like answering
    common support questions and qualifying leads so that their customers and users
    can focus on troubleshooting more complex issues.


    We see this with another prime example in a red ocean competitive landscape, Lilt,
    a machine translation company also based in California. The localization and translation
    industry has also seen its fair share of infighting; this is a market that’s full
    of translation services and tech providers, and Lilt combines the two. From an
    AI perspective, what’s special about Lilt is that it’s “the world’s first and
    only interactive, self-learning neural machine translation system,” according
    to their CEO, Spence Green. Its founders built Lilt as a response to the inadequacies
    they saw in machine translation while working at Google Translate, and their work
    has paid off. The company’s most recent series C round raised over $55 million
    in funding in April 2022, bringing the total funding to more than $90 million
    at the time of writing.'
