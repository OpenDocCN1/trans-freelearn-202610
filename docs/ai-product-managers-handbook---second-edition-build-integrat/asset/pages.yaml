- pgno: 52
  md: '# **Step 5 – Deployment**


    Depending on the size of your product organization, you’ll likely have data scientists
    working in tandem with ML engineers who will take all the work that was done on
    the model side and translate that into a successful deployment into production.
    This is where the deployment environment will be prepared for the trained model
    to be integrated into an existing system or application that is already in production.
    Models are typically integrated into these systems through APIs or web services.
    This is also where logs that continuously track the model’s performance and operational
    status are set up.


    You won’t be able to understand how a model is performing if you’re not using
    tools to monitor performance metrics like response time, accuracy, and errors,
    as well as system health and performance. This is also where security measures
    are put in place to keep the model and the data it’s using encrypted, secure,
    and accessible by authorized users.


    # **Step 6 – Continuous maintenance**


    At this point, you have your models and algorithms and you’ve chosen a system
    for delivering data to them. Now, you’re going to be in the flow of constantly
    maintaining this system. In DevOps, this is referred to as continuous integration
    (CI)/continuous delivery (CD). In the later chapters, we will cover the concept
    of Ai for IT operations (AiOps) but, for now, the following is a list of the stages
    tailored for the continuous maintenance of AI pipelines. The following are the
    four major components of the continuous maintenance process:


    +   - **CI:** Testing/validating code and components, along with data, data schemas,
    and models.

    +   - **CD:** Code changes or updates to your model are passed on continuously
    so that once you’ve made changes, they are slated to appear in the testing environment
    before going to production without pauses.

    +   - **CT:** We’ve mentioned the idea of continuous learning being important
    for ML, and **continuous training** productionizes this process so that as new
    data feeds are refreshed, your models are consistently training and learning from
    that new data.

    +   - **CM:** We can’t have ML/AI models continuously running without also using
    **continuous monitoring** to make sure something isn’t going horribly wrong.


    You can’t responsibly manage an AI program if you aren’t iterating your process
    constantly, or without diligently documenting each step of this process. Your
    models and hyperparameters will become stale. Your data will become stale, and
    when an iterative process like this stagnates, it will stop being effective. Your
    documentation itself will become stale. Performance is something you’ll constantly
    be staying up to date on because the lack of performance will be self-evident,
    whether it is client-facing or not. With that said, things can also go wrong.


    There are severe ethical reasons for staying focused on proper AI system management.
    Depending on the product and its use, lags in performance or frequency of the
    model refreshing can lead to people losing their jobs, not getting a competitive
    rate on a mortgage, or getting an unfair prison sentence. Major consequences can
    arise from downstream effects due to improper model maintenance. We recommend
    exploring the *Additional resources* section at the end of this chapter for more
    examples and information on how stagnant AI systems can wreak havoc on environments
    and people.'
