- pgno: 179
  md: '# 7


    # Productizing the ML Service


    In *Chapter 6*, we briefly touched upon the notion of productizing and what that
    means for AI outputs in the *Productizing AI-powered outputs – how AI product
    management is different* section. We will be expanding on that concept in this
    chapter by exploring the trials and tribulations that may come up when building
    an AI product. Rather than thinking of AI products as traditional software products,
    it helps to think of them as a service that you''re learning to productize. **Productizing**
    is the process of taking a service, process, skill, or idea and finding a way
    to present it to the greater market.


    First, we will look at some of the basic principles of productizing and the differences
    and similarities between AI products and traditional software products. While
    we’ve covered some of these elements in prior chapters, we will be expanding on
    these ideas further in this chapter. Next, we will explore how productizing might
    change based on the business model itself. We’ll take a look at the role **AI
    for IT operations (AIOps)** and **machine learning operations (MLOps)** play in
    productizing when it comes to managing your various products and comparing their
    performance. Finally, we’ll end with a look at how our productizing loop can be
    continually refreshed through feedback.


    By the end of this chapter, you will have an understanding of the following topics:


    +   - Productizing principles

    +   - Understanding the differences between AI and traditional software products

    +   - B2B versus B2C – productizing business models

    +   - Consistency and AIOps/MLOps – reliance and trust

    +   - Performance evaluation – testing, retraining, and hyperparameter tuning

    +   - Feedback loop – relationship building


    # Basics of productizing


    Productizing is a concept that comes up a lot in consulting, where service offerings
    are solidified into well-defined entities that can be effectively customized and
    resold. What this refers to is the ability to create a consistent workflow that
    you can rely on to deliver consistent results in the way traditional products
    demand.'
  merge: -1
  img_proc: true
- pgno: 180
  md: 'Before we go further in depth into product management principles and aligning
    them to the idiosyncrasies of AI/ML services, let’s address a few of the basic
    ideas when it comes to what productizing means in the first place. The following
    flowchart demonstrates the process of “productizing” through four major areas:
    defining the scope of the product you’re ending up with, aligning branding and
    packaging to support that scope, training your sales and delivery teams to appropriately
    communicate the scope of your product, and establishing a feedback loop to inform
    the scope of your work (or to establish new productized services).


    ![](img/a0c9f9a2ba06a06d309ce21d890a47c6_180_0.png)


    Figure 7.1: Productizing basics


    Because the AI/ML models and outputs are what are effectively being productized,
    this means that standards will need to be set for the following, as shown in the
    preceding flowchart:


    +   - **Scope:** Defining a scope establishes boundaries of what your product
    will offer to your customers and users. This is where you define the features,
    functionality, deliverables, and outputs your end users can expect. The scope
    also guides internal teams to better understand priorities and expectations. It
    also helps create a roadmap for future iterations and variations. Some questions
    you can ask at this stage are:

    +     - What are the features, deliverables, and outputs you are offering as a
    product?

    +     - What can your customers consistently expect from your product?

    +     - Will you have different models for different customers?

    +     - Will each customer’s data stay separate to train on separate models or
    will you train your models on all your customers’ data at once?'
  merge: -1
  img_proc: true
- pgno: 181
  md: '+   - **Branding and packaging:** Whatever scope you set will inform your branding
    and packaging choices. If you are grouping models and deliverables into cohorts,
    you''ll effectively need to brand those as separate products, each with its own
    marketing collateral (whitepapers, one-pagers, blog posts, etc.), contracts and
    **service-level agreements (SLAs)**, documentation, brand identity, and messaging.
    Some questions you can ask are:

    +     - What is the core value proposition of this product?

    +     - How will the brand voice align with this product?

    +     - How is this product best visually represented?

    +     - Do branding and marketing efforts align with the target market for this
    product?

    +     - Do branding and marketing efforts need to be tailored across a variety
    of target customer profiles?

    +   - **Sales and delivery:** Your sales force will need to be trained on your
    various products, however they shake out. They''ll need to understand how to talk
    about each product and the competencies and value propositions of each. You will
    have to agree on a method of delivery here as well. Some questions you can ask
    are:

    +     - Is there a platform or portal where each product will be administered
    and delivered?

    +     - Is it an application on a mobile phone?

    +     - What level of automation will you be embedding into your delivery architecture?

    +     - How will the product be priced? Will there be tiers?

    +     - What are the key pain points addressed in a sales pitch or deck?

    +     - How is value going to be communicated during the sales cycle?

    +     - What will the onboarding process look like?

    +   - **Feedback:** You''ll need some way of measuring how your product is resonating
    with your audience and cohort group. You''ll want to do this to make sure you
    have happy customers whose needs are being met by your product but you''ll also
    want the feedback to be incorporated into the future *scope* of your product as
    well:

    +     - How will customer feedback be gathered, used, and analyzed?

    +     - How will negative feedback be addressed and prioritized for future iterations
    and product updates?

    +     - What communication plan exists for sharing improvements and updates with
    customers?

    +     - Which customer success metrics will be tracked?


    Now that we''ve gone over some of the basics of productizing, let''s explore how
    these aspects might change based on context.'
  merge: -1
  img_proc: true
- pgno: 182
  md: '# AI versus traditional software product management


    Understanding the differences between traditional software and AI products isn’t
    so much about comparing two disparate groups of products. Although this is helpful,
    this is a macro trend, and the biggest reason for understanding the two is to
    anticipate how all products will evolve with AI. From the perspective of a PM,
    there are a number of differences between traditional software products and AI/ML
    products. In this section, we’ll first go over how they’re different, and then
    we’ll note the similarities between the two to give us a well-rounded sense of
    what to expect when you’re product-managing an AI/ML product. This will help us
    establish a baseline as well as a deviation from traditional PM work.


    # How are the products different?


    While AI products are built on a foundation of traditional software development
    for the most part, they do have a number of key differences you should be aware
    of as a PM. AI is able to evolve a traditional software product, and you’ll hear
    this referred to as applied AI in product circles. What this refers to is applications
    of AI outside of a research setting or lab that are used in the building of tech
    products. Essentially, the concept of putting AI/ML to use, testing and optimizing
    the models for accuracy and precision, and evolving them over time through feedback
    loops is what constitutes applied AI.


    The following sections will cover the biggest differences between traditional
    software products and AI products, which include scalability, profit margins,
    and uncertainty.


    # Scalability


    One of the major differences between applied AI products and traditional software
    products is in the area of scalability. Because AI is so specific and sensitive
    to the quality and peculiarities of the training data, you’re likely going to
    have issues with scaling this kind of product because you’re likely to encounter
    so many edge cases that you have to go back to the drawing board or start to create
    cohorts within your user base. This has led to what AI Forum refers to as a collective
    AI fatigue from the people who are working directly on developing AI, as well
    as with leadership and the market at large itself, that all stems from the issue
    of scalability when applied for commercial uses.


    This issue lies not just in the challenge AI poses with accuracy; indeed, you
    need a lot of data for advanced ML and deep learning (DL) models to work well
    and give you good performance, but you also need those models to be robust enough
    to work with a generalized population of users, situations, contexts, and locations.
    In traditional software products, you might not need this level of granularity
    to see success, but with applied AI products, you might think you need a highly
    personalized model for every user or use case.


    This sense might not be that far off from an optimal reality. What this also means
    is that AI is particularly sensitive to the idea of edge cases, and the threshold
    for what even constitutes an edge case might be lower for AI products compared
    to their traditional software counterparts. While edge cases impact all software
    products, traditional software companies do have an inherent advantage in that
    they’re iterative, so once you build and ship a product, you’re able to sell it
    to virtually all your customers without having to do a lot of customization.'
  merge: -1
  img_proc: true
- pgno: 183
  md: 'We will go over the differences in business models later on in this chapter,
    but this issue of scalability is doubly affected by your choice of business model.
    For instance, if you’re a B2B company, your AI product might behave wildly differently
    when compared to other customers because their training data differences might
    be too great. If we contrast this with a B2C company, you might be training your
    models on really representative and diverse data, but then the way your individual
    consumers interact with your product might vary wildly.


    Whether an issue with the training data or the way end users work with your product,
    the issue is the same: you’re having to account for so many perspectives and demands
    on your product from outside influences that it makes the scaling of the models
    used almost impossible while keeping with one consistent product build. Even the
    issue of agreeing on an acceptable level of product performance will likely be
    time, cost, and energy inefficient, let alone actually acquiring those levels
    of accuracy that you’ll need to end up with a product that’s consistent enough
    to sell as an a minimum viable product.


    Getting to a level of trust where your earliest customers will see the value in
    your product enough to consistently use it will require a lot of initial work,
    and you don’t have guarantees that this intensive customer acquisition will necessarily
    dissipate as it might with traditional software products. With applied AI products,
    the process of acquiring and keeping your customers may stay at a consistently
    grueling pace, which further contributes to this issue of scalability up to a
    certain point. Strides are being made, however, to build and discover ways to
    improve models that are less reliant on massive hoards of data.


    According to AI Forum “Data can be expensive to collect, requiring annotation
    and labelling (by clinicians in healthcare), cleaning, and preparation which can
    contribute 50% of AI training costs. Consent from data owners (e.g. patients)
    is needed to use their private data, and additional incentives are sometimes required
    for data custodians to share the data. Data privacy and security laws can introduce
    barriers to sharing, storing, accessing and handling the data.”


    This reinforces the idea that the quantity of data itself is secondary to the
    commercial success of scalable AI products compared to the quality and diversity
    of the training data. It doesn’t just need to be standardized in a way that’s
    uniform across your data sample; it also needs to have enough representative data
    points that encompass the diversity of users as well—the idea being that the more
    diverse your data is, the more it will be able to anticipate the needs and uses
    of the general users that will experience it once it is deployed to the greater
    public.


    Access to clean data is easier said than done. Most real-world datasets are riddled
    with data hygiene issues. Tableau (https://www.tableau.com/learn/articles/what-is-data-cleaning)
    offers a great summary of how to solve this: “Data cleaning is the process of
    fixing or removing incorrect, corrupted, incorrectly formatted, duplicate, or
    incomplete data within a dataset. When combining multiple data sources, there
    are many opportunities for data to be duplicated or mislabeled. If data is incorrect,
    outcomes and algorithms are unreliable, even though they may look correct. There
    is no one absolute way to prescribe the exact steps in the data cleaning process
    because the processes will vary from dataset to dataset.”'
  merge: -1
  img_proc: true
- pgno: 184
  md: 'AI/ML products are particularly sensitive to the quality of data, and this
    is further exacerbated by the issue of deliberate tampering or data poisoning
    in which end users attack AI/ML systems to intentionally manipulate the training
    data that powers them.


    # Profit margins


    We’ve discussed the costs associated with building out an AI organization, which
    you’ll have to do if you’re building applied AI products. These costs are some
    of the biggest differentiators between traditional software products and applied
    AI products. Because the development, data, and maintenance costs can be so high,
    they will impact your margins. To paint a picture of what can go wrong, the best
    example we were able to find came from Harvard Business Review (https://hbr.org/2022/03/how-to-scale-ai-in-your-organization),
    which mentioned “...one financial company lost $20,000 in 10 minutes because one
    of its machine learning models began to misbehave. With no visibility into the
    root issue — and no way to even identify which of its models was malfunctioning
    — the company was left with no choice but to pull the plug. All models were rolled
    back to much earlier iterations, which severely degraded performance and erased
    weeks of effort.” Imagine losing that much money in such a short time and still
    not being able to know where the problem was!


    With that said, there are aspects of applied AI that are more profitable than
    others, depending on the timescale:


    +   - According to Forbes (https://www.forbes.com/sites/forbesfinancecouncil/2020/09/01/past-the-ai-hype-when-is-ai-actually-profitable/),
    the area where we see the fastest short-term return on applied AI is when it supports
    customer behavior, which makes sense because it directly impacts sales and is
    one of the highest revenue drivers. This would be use cases of applied AI, such
    as product recommendations, scaled pricing algorithms, or advertising personalization/optimization,
    that bring in more traffic to your website or help customers choose more products
    based on their specific spending and purchasing habits, cost consciousness, or
    tastes and preferences.

    +   - The more medium-term payoff of applied AI is when AI is used to improve
    a product or make a user’s experience better in some way. This could look like
    product automation that boosts users’ productivity. For most of this book, we’ve
    been talking about these applications of AI because they directly impact an individual
    product and its performance. As a PM, this is likely the primary area you are
    focused on when it comes to applied AI and where the best place for it to fit
    is as far as your product’s performance and standing with customers and the wider
    market are concerned. Because this essentially poses a medium-term payoff, and
    because your AI costs will be front-loaded for the most part, you’ll have to manage
    expectations with your engineering, leadership, and customer-facing teams from
    both a revenue and performance perspective.'
  merge: -1
  img_proc: true
- pgno: 185
  md: '+   - The most significant long-term payoff of applied AI is when it affects
    the reputation of the company. This means AI is applied in a way that boosts a
    company’s trust reputationally, particularly when compared to its competitors
    and peers in the same space. But acquiring this level of AI supremacy is time
    intensive, and it sheds light on the double-edged sword of AI. Eventually, your
    competitors will catch on and will pay to play in your arena as well. This is
    the nature of competition, and as PMs, we understand that our products are scrutinized
    in the market, and rightly so. That being said, these areas of profitability aren’t
    exactly siloed. The short-term advantages of AI that we just discussed can also
    bleed into this area if your product specializes in marketing, recommendation
    systems, or advertising, for instance.


    The long-term advantages of AI that we discussed can also apply to integrating
    applied AI into your product if the premium AI offers your product is so great
    that it impacts your reputational standing in your chosen market or vertical.
    As a PM, technologist, or entrepreneur, you’re going to have to grapple with the
    costs AI poses as well as its advantages and create a plan for how you want to
    start leveraging applied AI. As you’re getting started, one of the best ways to
    do this is to first understand the benefits AI can offer your product and company
    at large and then draft your own version of this plan and pitch it to your leadership.
    Communicating the effectiveness of AI and your understanding of how it will impact
    profitability will help you gain credibility in your own organization. It will
    also offer an avenue for your stakeholders to be able to understand the challenges
    and opportunities and ultimately contribute to the plan.


    Once you have this plan, you can start keeping track of the relative profitability
    of the various areas AI is applied to and have champions/supporters within your
    organization that help keep the visibility of AI. If you can all agree on a specific
    appetite for AI spending and margin threshold tolerance, it will be easier to
    navigate the AI waters as you continue on your applied AI journey because it will
    force you to invest in AI in cases where there’s data, economic returns, and excitement
    to keep it going. It will also keep your finance team happy.


    # Uncertainty


    The last big difference is conceptual. AI introduces a whole lot of uncertainty
    to the work of product management. For a PM, this may be the most important section
    of the book thus far. A PM applying the known patterns of product management from
    e-commerce, banking, travel, and social media will only take them so far when
    building an AI product. PMs need to adapt their thinking and their approach in
    light of the uncertainties AI can introduce into their product.


    With traditional software products, the deterministic qualities of a product are
    hardcoded. Algorithms still exist, but they’re not improving or learning over
    time; they are static. But with AI products, these qualities are more fluid. There’s
    a level of expectation setting and performance that has to be agreed upon, expressly
    or intuitively, by the builders and users. If that level of performance doesn’t
    happen because the models aren’t trained enough, they have to be trained more.
    If performance doesn’t come no matter how much training you throw at it, you might
    not have a product to sell at the end of the day! This level of uncertainty is
    cushioned in traditional software because your performance goals aren’t quite
    the moving target they are when you’re building an AI product.'
  merge: -1
  img_proc: true
