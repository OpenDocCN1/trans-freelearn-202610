- pgno: 339
  md: '# 14


    # Evolving Products into AI Products


    In this chapter, we will explore the areas that benefit and negatively impact
    AI adoption in existing products. Every product will be different and every product
    owner will come to their own conclusions about what level of AI adoption to infuse
    into their product. For some products, something as simple as adding one AI feature
    is enough. For other products, a fundamental change to the underlying logic that
    powers your product might be required. The decisions of how to transform your
    product should, first and foremost, be determined by your product strategy and
    should serve your overarching company vision. These decisions should be collaborative
    and should come with a high level of executive sponsorship.


    As the chapter continues, we will explore various areas of AI transformation,
    and they will serve as a step-by-step guide to building a product strategy that
    supports the evolution of your product. We will look at how to approach brainstorming
    about your AI options, which considerations will be most important as you brainstorm,
    how to evaluate your product’s performance within the competitive landscape, how
    to build a product strategy that sets you up for success, and, ultimately, which
    signposts and milestones will help you build confidence and which will indicate
    that you need to go back to the drawing board.


    We will discuss these in the context of the stages of AI product development we
    introduced in Chapter 6: ideation, data management, research and development,
    and deployment. Whether you’re adding AI features or upgrading the existing logic
    of your product, having an established plan that supports your product strategy
    will be the best way to successfully update your product for commercial success
    with AI in a way that’s sustainable. Once you’ve achieved the successful transformation
    of your product into an AI product, feel free to return to Part 2 of this book
    where we go over the various aspects of building and maintaining an AI-native
    product.


    In this chapter, we will cover the following topics:


    +   - Ideation – what’s possible and what’s probable

    +   - Data management – the bloodstream of the company'
  merge: -1
  img_proc: true
- pgno: 340
  md: '+   - Competition – love your enemies

    +   - Product strategy – building a blueprint that works for everyone

    +   - Red flags and green flags – what to look and watch out for


    # Ideation — what’s possible, what’s desirable, and what’s probable


    There are multiple ways in which a product could stand to benefit from AI adoption.
    Understanding the Venn diagram of what’s probable, what’s desirable, and what’s
    possible is an important part of your AI product strategy. Clarify the distinction
    between the ideal outcomes you’d like to achieve (desirable), the technical feasibility
    of those outcomes (possible), and the viable options you can explore based on
    current constraints, data, and priorities (probable).


    ![](img/a0c9f9a2ba06a06d309ce21d890a47c6_340_0.png)


    *Figure 14.1: The Venn diagram for ideation*


    As an AI PM, you must asses your wish list (what’s desirable) against the constraints
    you face (what’s possible) to identify the probabilistic or most realistic choices
    that you can then focus on. As you continue this exercise, you’ll go through a
    spectrum of possibilities. You’ll start with a really open-ended, right-brain
    brainstorming session on the cerebral notion of value and how your product can
    deliver it to your customers, which will then be refined by a left-brain, analytical
    breakdown of the fruits of that brainstorming session. Both are important parts
    of the product management creative process. More specifically, this exercise represents
    the Ideation phase of the AI product development cycle.


    Whether you look at your product from the perspective of the main problems your
    customers face, the *jobs to be done*, or feature parity, you’ll want to get a
    sense of which AI enhancements would be most high-value for your product, which
    would be the most low-cost, which have the best data readiness or availability,
    and which have the highest degree of executive or market sponsorship. Since this
    section is about how to evolve an existing product into an AI product, take your
    time with this step because, with it, you’re coming to an important decision:
    identifying which problems or opportunities AI could offer significant value to.
    Being mindful about taking your time to really familiarize yourself with the models,
    the benefits, and the options you have before you will be important.'
  merge: -1
  img_proc: true
- pgno: 341
  md: 'Before we get into all that, a word of caution about adopting the term AI.
    We’ve discussed the notion of starting with your why when it comes to AI and how
    important it is. We’ve also discussed the notion of the marketing buzz that comes
    with AI and how attractive it is to investors and customers alike. In the current
    AI climate, there’s a lot of noise that’s generated when AI and ML enter the lexicon
    of your product’s communication efforts. You don’t want to fall victim to the
    trap of attracting a lot of attention without necessarily having the substance
    to support that attention. A big part of that is getting clarity on the feasibility
    of using AI for an identified problem or opportunity.


    The last thing we want is for PMs and technologists to go through the effort of
    investing in AI and push out vanity features that don’t actually make their products
    better only because they want to capitalize on the attention AI offers them. Examining
    the availability of data, infrastructure needed, and potential technical limitations
    means you’re being honest about what the proposed AI features can even do for
    your product. For that reason, we recommend grasping the real opportunities that
    AI and ML will afford your product, assessing technical aptitude and ability,
    and then creating a series of lists that will rank the order of these potential
    opportunities according to three key categories: value, scope, and reach.


    The ultimate goal of brainstorming and creating these lists is to define a potential
    path to AI maturity within your product. Understanding where your current product
    falls short, which areas you want to start with bolstering with AI, and which
    areas you want to transform as part of your overall product strategy and roadmap
    over time will be an important part of the process. AI transformation won’t happen
    overnight. You will have to start somewhere and, given the cost of investing in
    AI, being strategic and intentional about where you want to start will make all
    the difference in the long run.


    In the following sections, we will be applying various lenses to ideations when
    it comes to AI adoption. Those lenses will relate to how AI adoption will impact
    your product based on perceived value for your customers, how AI adoption will
    impact the scope of your product, and, finally, how AI adoption will spread to
    your end users.


    # List 1 — value


    The work of product management often requires a high level of trade-off. You’re
    always judging the amount of effort and skill required to bring a feature to light
    and comparing that with the proposed upside for making that building investment.
    If you do, however, start with the highest-value AI enhancements, you’ll be coming
    from an intuitive, customer-centric place. Understanding first and foremost what
    makes your product valuable to your customers and your market and then finding
    use cases of AI to expand on that value should be the first order of business.'
  merge: -1
  img_proc: true
- pgno: 342
  md: 'You''ll need a source-of-truth list like this later on when decisions become
    more difficult and – when they inevitably come up – you maneuver political discussions
    with leadership and other key stakeholders at your company. The reason why your
    value list should be your primary source of truth is that every product fundamentally
    needs a value proposition: a statement about why your product brings value to
    its customers and users. The world has enough false advertisements, overcommitments,
    and exaggerations, particularly in tech. The 2019 State of AI study examined European
    companies claiming to have cutting-edge AI products and found that up to 40% of
    them were not substantially using AI. This is further echoed in a 2023 Eurostat
    commission, which still reflected only 8% of businesses were using AI in a meaningful
    way in Europe. Build a solid list of true AI enhancements that will deliver real
    value to your customers. Build an AI product you can be proud of. Start with what
    really matters.


    That value list shouldn''t just be a list of features you want to add to your
    product. It should be a summary of the types of value your product offers its
    users and customers. Features are descriptive and matter-of-fact. Values are closely
    tied to worth. If you''re having trouble understanding the difference, start with
    the features themselves and then see whether you can go a step further with each
    feature and write down why that feature actually matters to your customer. If
    you can do this, then you''ll be able to do this exercise when evaluating the
    products that yours will be competing against. Try and get a sense of whether
    or not the products in your competitive landscape offer the same level of value
    to your market. Another way of looking at value, particularly with the competitors
    that have actually gone to market with their own AI features or upgrades, is to
    understand how those decisions might have impacted value perception in the market.


    Treat this as an exercise in divergent thinking. We spent a considerable amount
    of this book going over the various use cases and models that can be employed
    in ML and deep learning. We''ve also looked at a number of verticals, industries,
    and high-level adoption trends. How can you apply these strengths to your own
    product? Get creative and try not to stop logistical considerations from getting
    your ideas flowing. Anything that feels like it will be inherently valuable to
    even just a small subset of your customers can and should make this list. If it''s
    helpful, consider the various types of models we covered in earlier chapters and
    what value they could bring to your product as it currently stands. Take stock
    of the benefits that various types of ML can potentially bring to your product
    and see where they might be able to improve on existing use cases that pertain
    to the product and your customers. When you''re thinking about value and how to
    grow it in your product, use this list exercise as a way to get all the potential
    ideas out there, no matter how outlandish or unrealistic. Keep in mind the various
    strengths of AI: stacking, ranking, optimizing, predicting, grouping, comparing,
    automating, standardizing, and learning from ongoing trends and analysis. With
    due diligence, you should come out of this exercise feeling inspired about the
    potential directions your product can take based on its current value proposition.
    With some luck on top of that due diligence, you should also experience the new
    benefits AI can bring. There will be plenty of opportunities to whittle this list
    down and realistically refine it later. Marty Cagan''s book Inspired: How to Create
    Products Customers Love outlines the “Four Big Risks” for product teams to address
    as they develop products. One way of whittling your list of ideas down later will
    be to assess them against the value risk. Cagan defines this as the risk that
    customers or users might not actually value the proposed feature or product enough
    to buy it or use it regularly.'
  merge: -1
  img_proc: true
- pgno: 343
  md: 'One of the best ways to mitigate this risk is for product teams to focus on
    whether or not they are solving a real problem or fulfilling a genuine need with
    the solutions they put forward. Developing a product or functionality without
    validating demand for it first will result in high cost and energy output with
    very little to show for it. You can work on market research, prototype testing,
    and customer interviews to validate the ideas you generate in this stage.


    For now, let the creativity flow and think about how you can build on the existing
    value your product already offers its customers and users. You will be rewarded
    for being less discerning during this step because you never know which of the
    fringe ideas on this list might become valuable seeds for future features. Brainstorming
    about potential features and use cases is also some of the most fun an AI PM can
    have – figure out a way to make this a standard part of your product strategy
    work and revisit this on a quarterly or biannual basis.


    Some questions on value you should be able to answer at the end of this stage
    are:


    +   - How well do I understand how my current customers use the product at a feature
    level?

    +   - Which features are the most valuable and frequently used by my customers?

    +   - What are the top customer pain points this product team wants to tackle
    with AI?

    +   - What real customer problem will this proposed AI feature solve?

    +   - What is the core value proposition of my proposed AI feature?

    +   - How is AI adoption improving the customer experience of this feature?

    +   - What types of AI/ML models or techniques will be most beneficial for this
    feature?

    +   - What are the risks of customers not valuing this feature?


    # List 2 — scope


    Once you have a list of the highest-value AI enhancements from the previous section,
    you can then start to prioritize them into a list of most to least scope. Scope
    includes not only the time and effort required to complete a body of work but
    also the cost and skill level required to do so. Given that we’re talking about
    AI products here, it may not be as straightforward to understand what will require
    the most effort, time, cost, and skill. Often, we don’t know this until we’re
    well on our way to building out these features, but do your best to create enough
    of a stacked order from most to least effort for this list.


    This list won’t be an absolute source of truth, and it doesn’t have to be. It
    also doesn’t necessarily mean that the items that involve the least effort will
    get built first, but it’s important to establish which kinds of enhancements will
    require more of an investment from the company to complete. Understanding the
    variety in terms of effort is most important from a planning and resource management
    perspective. If certain features need to be built, and they require a lot of effort,
    time, or skill that you might not conveniently have, knowing this will help with
    forecasting and making the necessary plans in the future to obtain them.'
  merge: -1
  img_proc: true
- pgno: 344
  md: 'It will also allow your leadership team the time and focus to really internalize
    what this investment in AI will actually require of them, and whether or not you
    currently have the skill sets and capabilities to even embark on this path. Taking
    the time to discuss the scope and get clear on the organization’s current level
    of ability is an essential part of this step. The act of acquiring the right tech
    resources to make the loftiest AI dreams a reality will likely be an arduous journey
    in and of itself. Your leadership team needs to be prepared for that.


    This isn’t just the case with acquiring talent – it’s also the case with understanding
    what internal processes need to change. Often, when it comes to AI, managing expectations
    can be the most difficult part of making an AI transformation successful, so anything
    you can do early on to prime your leadership for the trials and tribulations that
    might impact you as you begin the process of leveraging AI will go a long way
    when hurdles inevitably come up.


    As any PM out there knows, the scope is an important factor in deciding what to
    build and when, and you’ll want to make sure you’re cementing yourself as the
    authority where leadership is concerned when it comes to the AI features you propose
    to add to your product. Even if you do have a mature team of data scientists and
    ML engineers around you who you can trust and who have a ton of experience and
    AI wisdom, as an AI PM, you will still own the product and be responsible for
    the ultimate strategy related to your product. It’s important that you maintain
    this high level of oversight and command over your product’s key AI considerations
    and the major decisions impacting your product because you are the captain of
    that ship. Congratulations! It’s a gift and a curse.


    This responsibility also relates to another of Cagan’s “Four Big Risks,” the feasibility
    risk, which focuses on whether the product or capabilities can actually be built
    with the resources available. There will always be some combination of time, skill
    set, technical ability, or organizational capacity you’re juggling to make any
    idea come to life. Being honest about addressing feasibility as early as possible
    means technical stakeholders will be working on something that can actually deliver
    on its promises.


    If you can’t defend the decisions made in relation to your product, you’re not
    the authority, and this will only cause confusion and undermine your leadership
    later on. Remember that your technical team is there to support the product, offer
    sincere advice, and give their best estimates on the scope and on how to build
    the features that are decided on by the strategic arm of the organization. They
    are there to build and implement the decisions that you make in collaboration
    with your leadership and stakeholder team. Having a clear definition of ownership
    and using your technical team to accurately reflect on the scope to the best of
    their ability is what this exercise is all about.


    Some questions about scope that you should be able to answer at the end of this
    stage are:


    +   - What is the time/effort required to develop, implement, and maintain this
    AI feature?

    +   - What is the expected ROI for developing this feature, and has technical
    leadership bought in?

    +   - Are there missing skill sets and resources to build this AI feature?

    +   - How will you plan to fill the gaps in skills/resources to build this AI
    feature?

    +   - What internal processes need to change to support this AI feature?

    +   - What are the main risks associated with not delivering this AI feature?'
  merge: -1
  img_proc: true
- pgno: 345
  md: '# List 3 — reach


    By this point, you have two lenses through which to look at your proposed product
    AI embellishments – the lens of ultimate value and the lens of scope: effort,
    time, skill level, and cost. As you may notice, with our second list, we have
    moved from a divergent mindset and added more analytical, convergent restraints.
    With this third list, you add another layer of conditions through the lens of
    how many of your existing customers it will impact – or your reach.


    Being able to create this list will require you to have enough intimacy with your
    existing product as it currently stands, right down to the feature level. Understanding
    the baseline of how your subset of customers uses your product and which features
    have been most instrumental to them in their experience of your product will be
    necessary.


    You can’t accurately predict the reach of these proposed value items from your
    original list if you don’t already understand how your customers experience your
    product. You also won’t be able to articulate to your leadership team why certain
    AI embellishments will be valuable to your customers if you don’t already understand
    how they use your product.


    This seems like a really obvious statement but you’d be surprised how many PMs
    out there know very little about how their customers actually use their own products.
    AI PMs can get caught in the trap of building their product team into a feature
    farm, and few of them actually stop to make sure their product is being built
    holistically and sustainably, but maintaining intimacy with their customers and
    users is a big part of being a PM. If you aren’t using product analytics or regularly
    checking in with your customers, either through direct customer interviews or
    through in-app/in-platform surveys, then you don’t really know how your customers
    experience your product.


    If you don’t have a strong grasp of how your customers use your product and what
    they find most valuable about it, then you’re limiting your reach and building
    in the dark. This darkness exposes you to two more of Cagan’s “Four Big Risks”:
    usability risk and business viability risk. Usability risk pertains to the effective
    use of your feature or product. Even if some customers see the value of your feature
    or product, they may struggle to actually make use of it. If it’s not intuitive,
    easy to navigate, or self-evident from a user expectation perspective, you’ll
    lose those users. That’s a practical reason to lose reach. Another of Cagan’s
    risks is more philosophical in nature. Business viability risk alienates certain
    users based on the company’s overarching business objectives. If the product can’t
    support a company’s financial model, legal constraints, brand reputation, or long-term
    strategy, you could lose reach that way as well.


    If you’ve gotten to this part of the exercise and it’s just now dawning on you
    that you don’t have this information, then you’ll want to start doing your homework
    and start this list creation exercise all over again. This, once again, ties back
    into the original value items we put on our first list. If you do find yourself
    in this situation, there’s no harm. Keep your original list. Get to know your
    customers and what they most love about your product and start the exercise over
    again. This is one of the beautiful things about product management. You can always
    find out more! There are deeper and deeper truths to uncover about your product
    the more you build and the more customers you take on. Never get discouraged.
    If there are unanswered questions, it’s only an opportunity to learn.'
  merge: -1
  img_proc: true
- pgno: 346
  md: 'Some questions you should be able to answer about the reach of your product
    at the end of this stage are:


    +   - How many of my current customers will be directly impacted by this AI feature?

    +   - Which customer segments will benefit most from the proposed AI feature?

    +   - How will I make sure this feature is intuitive and easy to understand/adopt?

    +   - How does this AI feature align with the business''s long-term product strategy
    and product roadmap?

    +   - What evidence (data, research, feedback) supports the demand for this AI
    feature?

    +   - What are the potential challenges or risks in prioritizing this AI feature?

    +   - What legal, ethical, or regulatory constraints could limit the reach of
    this AI feature?


    # Case study


    In January 2024, Shopify introduced a series of AI-powered merchant and customer
    experience features that would help streamline operations for the online retailers
    they support. We will use the framework that we''ve just discussed to describe
    how Shopify identified high-value AI enhancements, assessed scope and feasibility,
    and understood customer reach and usability. Here is a list of AI features that
    Shopify incorporated for the AI transformation of their platform:


    +   - **Merchandising features**: Ability to store more complex product catalogs
    (along with more variety for color, sizing, and SKU options), combine listings,
    and create networks. Improved classification taxonomy to reduce time/effort to
    create product listing with automations for standardized categories and product
    attributes reducing manual, repetitive work.

    +   - **Storefront performance features**: The launch of a new web performance
    dashboard that shows you how your store''s page ranking can be improved to sell
    more. They also improved infrastructure speed and expanded the global footprint
    of buyers.

    +   - **Semantic search**: Gives more relevant search results that customers would
    be more likely to buy from, even without using specific keywords.

    +   - **Digital advertising**: The launch of Shopify Audiences, which uses ML
    to improve digital advertising, find more customers, lower **customer acquisition
    costs (CACs)**, and improve **return on ad spend (ROAS)** with custom targeting
    lists that can be used on ad platforms like Mega, Google, Pinterest, Snapchat
    and Tiktok. Smarter retargeting algorithms were also launched, which are at least
    doubling retargeting audience sizes.

    +   - **Shop Campaigns**: They rebranded their prior feature of Shop Cash offers
    into Shop Campaigns as a risk-free customer acquisition program to bring new customers
    into shops without the merchants having to build new audiences or create new assets.

    +   - **AI code of ethics**: Concerns from merchants that AI adoption was moving
    faster than ideal in their industry were met with Shopify providing an AI code
    of ethics for their merchants, and it''s reported that 78% of them have adopted
    it.

    +   - **Shopify Magic**: A suite of free AI-enabled tools that includes:'
  merge: -1
  img_proc: true
- pgno: 347
  md: '+   a. **Media Editor:** A generative AI app that lets you generate product
    images instantly and for free

    +   b. **Smart Sidekick:** An AI-enabled assistant that allows you to manage productivity,
    improve workflows, improve decision-making, and limit time on operational tasks


    Now let’s break this down a bit and discuss Shopify’s adoption of AI through the
    lens of value, scope, and reach.


    # Value


    Shopify wanted to focus on delivering features that would help merchants (their
    customers) better understand their own customers and, in turn, be able to offer
    them better conversions for the products they’re selling on the platform. Since
    Shopify is a B2B company, the team went about this by conducting extensive market
    research and customer feedback sessions to make sure they understood what could
    make the biggest impact on their customers’ business operations. Through this
    process, they found that real-time personalized product recommendations could
    make the biggest impact on improving customer engagement and expanding sales.
    What is perhaps most inspiring about this approach is the AI features posed a
    win-win scenario. Shopify won by fitting the bill in terms of offering AI enhancements
    that their customers found valuable. And their customers won by using valuable
    features that also brought them better customer experience with their own customers
    and more sales.


    # Scope


    Shopify wanted to assess the required resources for implementing the AI features
    they settled on and took inventory of the technical skills needed to develop and
    maintain the AI/ML models and capabilities they were integrating into their product.
    Their challenge was to integrate these new features without disrupting the user
    experience that already existed on the platform. The Shopify engineering team
    then had to work on the new features in a way that would make them easily scale
    and integrate while maintaining the current platform performance. Shopify also
    had to fill gaps in their skills capabilities by hiring additional data scientists
    and ML engineers to support the new AI-powered features. They also put time and
    resources into upskilling their existing teams through training programs focused
    on AI capabilities and technologies.


    # Reach


    Because Shopify was already using advanced analytics to understand how their merchants
    (customers and users) were already using the platform and what challenges they
    faced when running their business operations or working with clients, they were
    able to lean on that baseline of data to understand the potential reach these
    new AI features and capabilities would offer their customers. It also meant they
    were able to empathize early on with their top concerns, which means their proposed
    solutions were applicable to as many customers as possible. Shopify also conducted
    beta testing with a smaller select group of merchants to make sure they were meeting
    usability standards and getting feedback from real merchants in the process. Post-launch,
    Shopify also used user feedback and performance metrics to continue to improve
    the AI features they launched.'
  merge: -1
  img_proc: true
- pgno: 348
  md: 'The result and impact of this work led to improved customer engagement on their
    platform. Merchants reported higher conversion rates due to more effective product
    recommendations, and customer interactions improved through automated support.
    Beyond this, Shopify won leadership clout and branding support in the e-commerce
    space through their innovations with AI adoption, which sets them apart as a leader
    in their industry. Shopify’s ability to integrate AI features, many of which are
    free, while considering scope and reach using a strategic approach enhanced the
    company’s reputation as well as its product’s value.


    This case study is exemplary and aspirational for a lot of AI PMs out there thinking
    about how to have an impact. It’s possible that, with time, they’ll learn more
    about what makes their platform valuable to their merchants and they will start
    to monetize upsell and advanced features more heavily. But by coming to market
    with an AI-improved platform and offering these features generously, they’re helping
    all their merchants get more comfortable with AI adoption as a whole. It’s a reminder
    that you don’t always have to be so focused on the ROI of specific features. ROI
    can be secondary when it means broadening the horizon for the entire ecosystem
    with a launch.


    Now that we have our priority list of potential sources of AI adoption based on
    value, scope, and reach, we can move on to the next big consideration for evolving
    a traditional software product into an AI product: data readiness. Making sure
    our data is in a digestible format to be able to handle the new AI capabilities
    is going to be the next big focus area for PMs looking to make the jump into AI.


    # Data management — the bloodstream of the company


    Before PMs can begin the work needed to start building and developing their product,
    getting it ready for testing, and releasing it to their customers, they need to
    get really clear on the strategy of how they will position their product. This
    is the thought process behind the Venn diagram exercise we saw in the previous
    section. Now that we’ve gone over the process of how AI PMs can approach potential
    AI embellishments, we can add one more layer of scrutiny to this list. This additional
    layer focuses on the data, which is what will power every single item on these
    lists, and it represents stage 2 of the AI product development cycle.


    Once AI PMs begin the work of understanding what they can do with the data sources
    they have and which data sources they’ll need to make the items on their list
    a reality, we’re getting close to actually having a plan. This stage is about
    gathering the right data that will be used to train and test the AI/ML models
    from internal systems, third-party providers, customer interactions, or external
    IoT devices like sensors, processing and refining that data for AI/ML readiness,
    and securely storing and protecting that data.


    In the following subsections, we will be addressing the key areas of data readiness:


    +   - Preparing and researching the data you have available

    +   - Assessing the quality of the data you have and partnering with your data
    team

    +   - Using the data for benchmarking the current and future adoption of your
    product and defining success'
  merge: -1
  img_proc: true
- pgno: 349
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 350
  md: '+   - Are data security and privacy benchmarks being met? How will those change
    with your AI system?

    +   - Which data governance for data management, ownership, and access standards
    will you implement for your AI system?

    +   - Is your data prepared for the next phase (R&D)?

    +   - Are there enough features in your data to train the AI/ML models you''ll
    be using in your AI system?


    Key challenges and common issues for AI PMs in this phase surround issues of data
    readiness, availability, and coverage. Merging data from various sources into
    a digestible format for AI/ML systems, having insufficient data, and planning
    for scalability in the future are all concerns for AI PMs who are looking to navigate
    the complexities of their data ecosystem. Here is a set of common issues that
    AI PMs can face at this stage:


    +   - **Data and AI goal misalignment:** Making sure the data you are using has
    the right features your AI system needs to perform optimally is crucial in this
    phase. Sometimes, the data you have might lack features that are essential for
    the AI use case you''re trying to solve. Take inventory of the data needs that
    will power your AI/ML capabilities and make sure those are reflected in product
    requirement documents and other sources of documentation.

    +   - **Compatibility issues in data integration:** The AI/ML capabilities for
    your product may often require a variety of internal and external data sources
    that can cause downstream complications in the data pipelines. When working with
    the data engineers who will enable your AI/ML capabilities, make sure that they
    are accounting for all the data that will be coming into your AI system and that
    they have cleared all the relevant data sources.

    +   - **Anticipating data needs:** AI PMs need to accurately assess what data
    volumes their AI system needs to power their AI/ML product capabilities. How much
    data will be enough for training needs to be discussed with ML engineers and data
    scientists. This is also the case for forecasting future data needs. AI PMs need
    to make sure these important discussions about current and future data attributes
    and volumes are discussed with relevant stakeholders ahead of time.

    +   - **Maintain buy-in:** AI PMs need to be aware of the risks of not managing
    expectations around data effectively. If your leadership team thinks the data
    challenges at your organization are too costly or complex to solve, it could threaten
    their sponsorship for your product''s AI/ML capabilities. This is also the case
    for data restructuring needs. If data needs to be restructured to meet new requirements
    for your AI system, this could impact budgeting and planning for your roadmap.


    # Ensuring quality partnerships


    It''s become a cliche by now but within AI, data science, and ML circles, the
    age-old tagline is *garbage in, garbage out*. This is an a priori truth of AI.
    Your models won''t give you the insights and value you''re looking for if you
    don''t adequately prepare and clean your data. Should you find yourself in this
    situation and ignore your AI/ML team''s recommendations, you''re going to be left
    defending an internal AI program that your leadership team will perceive to be
    a waste of time and money. And they would be right, it would be a waste of time
    and money.'
  merge: -1
  img_proc: true
- pgno: 351
  md: 'Rather than looking at your data pipeline strategy as the necessary input for
    your product, in an AI product life cycle, you''ll come to see it as the partner
    that co-creates your AI product alongside your models and developers. Your data
    pipeline is going to constitute a huge part of your AI/ML program and it will
    complicate stage 3 of the product development cycle (research and development)
    as you''re evaluating different models if it''s not implemented correctly. You
    will need to think of it as a program. Orchestrating and coordinating your data
    sources and the quality of the data will be a huge part of your success with AI.
    Acknowledge that adopting AI is going to constitute a paradigm shift for your
    organization, and if you were able to skate by with incompatible silos of data
    wrought with duplicates and poisoned data wells in the past, this isn''t going
    to be the case when you adopt AI.


    The biggest resistance that organizations face when it comes to data quality comes
    from inside: the internal resistance to keep processes as they''ve always been.
    Doing nothing is easy. Keeping things as they are is the natural instinct for
    most people. Even if your organization is super passionate about maturing its
    data practice and you have champions across all major stakeholder teams within
    your organization, it still won''t be enough. You will need to evangelize the
    importance of shifting in mindset when it comes to data quality, as well as the
    cost and time associated with making this happen. It''s one thing to make a verbal
    commitment to improving data quality and another to actually see that manifest
    tangibly in the behaviors of teams.


    Expect internal resistance to this and do your best to communicate the risks of
    empty promises. Remember that when you''re changing workflows, processes, and
    departmental habits of a product that''s been around for a while, you have entire
    teams of people who have been used to doing things a certain way. Making those
    changes will be a collective effort. This isn''t just a product evolution that
    will happen because leadership said so. This is a product evolution that will
    require partnership from all employees who touch your existing product. Take time
    to manage your own expectations for this as well. There might be days when you''re
    frustrated and weeks when you''re not seeing changes and you return to past bad
    habits. It''s a process and it will take time for this to be fully internalized.


    Building and maturing a data team will also take time. How much time it takes
    will be up to you and your leadership team. You might want to use a data strategy
    consultant or have in-depth sessions with your technical stakeholders to really
    understand how to organize your data pipelines in a way that will empower AI adoption
    best. You may even want to jump in straight away and establish a dedicated cross-functional
    data team that will be responsible for the oversight of your data. Having dedicated
    folks to work out the details of centralizing the various silos of data you have
    and deciding on the best way to centralize that data and send it to your models
    in development, and ultimately in production, will be a great way to work through
    the various inconsistencies in your data that will inevitably come up.


    At one of my recent roles managing data products, the time our organization had
    allotted for managing data quality was impossibly short. Despite extensive communication
    with leadership to manage the risks of not investing more fully into managing
    data quality issues, we were asked to press on with the time limitations. But
    in the end, the dashboards and data tables were unreliable because the work was
    unsustainable. After assessing the results and planning, we came up with a data
    quality model that had our team working more closely with data stewards from various
    departments to be the subject matter experts for data within a certain domain.'
  merge: -1
  img_proc: true
- pgno: 352
  md: 'The process still took some time – at least six months of work to get to the
    underlying issues for each department’s data, but we were then left with data
    pipelines and tables that we could all rely on for subsequent derivative products.
    The impact of our work meant that all other products thereafter would be coming
    from data we could trust, data that was properly vetted. The partnership between
    the data team and between representatives from virtually all other teams meant
    that we could reshape the culture around our data organization. This experience
    also showed us that we sometimes have to insist on what we know is right, especially
    when leadership is resistant to devoting time or money to projects that are well
    worth the effort.


    Treat this as an investment in your R&D and product design phase and give it the
    time it deserves because it’s a foundational part of your AI infrastructure. How
    you store your data, how often you’re calling it, how often you’ll need to train
    your models, and how you’ll be planning a release schedule to support this new
    AI infrastructure will all be a part of this discussion. At this stage, it’s just
    a discussion. No decisions are being made yet, but you will want to start this
    discussion as early as possible because, by the time you are ready to start considering
    models, training, and testing, you’re going to want to be sitting on clean, rich
    data to feed those models.


    Understanding your data, exploring it, experimenting with it, wrangling it, preparing
    it for feature development (for ML models), using it in modeling, evaluating the
    performance of those models, and, ultimately, deploying it are all going to be
    regular discussion points. So, starting conversations about data strategy early
    on before any real decisions about how you’re going to leverage AI are finalized
    is a strategic move. It also allows for technical voices to become a part of this
    conversation sooner than they might have expected because adopting AI is a highly
    technical investment and those voices should be present early on.


    As we’ve seen in prior chapters, feature engineering is a major part of making
    the models you choose to employ in your product successful. This further reinforces
    the idea that you need to make sure your technical teams weigh in on important
    decisions about what kinds of data are being included in your training sets.


    Some key aspects that quality collaborations with your data and team will help
    you address are:


    +   - Maintaining strong data integrity practices to make sure you’re not having
    to retrace your steps when you start the R&D phase of the AI product development
    cycle.

    +   - Establishing cross-functional alignment so that all stakeholders work together
    to create processes, reduce internal resistance, and deliver workflows that support
    AI capabilities.

    +   - Long-term stability with regard to strategy and scalability means that teams
    are invested in sustainable AI infrastructure so that teams can plan ahead safely.

    +   - The importance of treating AI adoption as part of R&D means businesses will
    appropriately invest in the right data infrastructure, data strategy consultants,
    and AI cross-functional team building.

    +   - Making sure the organization invests in building data and AI/ML literacy
    across departments so that teams can collaborate effectively.

    +   - Whether data pipelines are clean, centralized, and scalable enough to support
    AI features.'
  merge: -1
  img_proc: true
- pgno: 353
  md: '# Benchmarking and defining success


    Data is already the bloodstream of a company, empowering everything from internal
    decision-making to product performance:


    +   - Your customer and product data will help you understand which parts of your
    product are already valuable and will help you deduce which proposed features
    will have the most impact on your customers.

    +   - Your historical internal data will help you understand which features have
    traditionally taken the longest to manifest in your product to predict future
    scope.

    +   - Your product analytics will help inform which UI/UX and design changes might
    have the most impact.

    +   - Your training and performance data will help you understand which ML models
    work best for your customers.

    +   - Your operational data will help you understand which deployments have been
    most successful and why.


    Data helps you manage your release schedule and product roadmap and helps you
    scale your product. Establishing an existing benchmark using data will be an important
    step in creating a narrative around your plans for adopting AI. This is because,
    in future quarters and years, you want to be able to demonstrate that AI has helped
    move the needle on some of your most compelling use cases both internally and
    externally. You won’t be able to know how far you’ve come later if you don’t have
    an established baseline from the very beginning.


    As an AI PM, you’ll want to speak from a position of strength when you demonstrate
    the milestones your product has been able to hit with AI. The business will evolve
    and metrics will come and go, but make the most of the data you already have before
    you embark on your AI adoption path so that you can truly reflect on your progress
    when the time comes.


    You’ll also use your internal data to set metrics, which we covered in Part 2
    of this book, in order to define what success looks like for your product. Defining
    success will be a collaborative act and it’s important for AI PMs to bring in
    all major stakeholders of the company to align on defining that success. If the
    product evolution into AI doesn’t include the voices of your go-to-market, sales,
    marketing, strategy, engineering, and leadership teams, it won’t have the appropriate
    level of sponsorship it will need to truly be effective, funded, and evangelized
    internally and externally.


    Perhaps most importantly, without the right level of sponsorship, the success
    of your product will also not be tied to your most important business objectives
    at the organizational level. Building the right level of data fluency with these
    teams and using data to support your claims about the direction your product is
    taking is non-negotiable. Be patient with yourself, your organization, and your
    technical talent on data. Data is what powers this entire endeavor we’re discussing.
    Don’t give in to the pressure to rush things. There are always business imperatives
    to get to market as quickly as possible. The instinct to just start and build
    as you go will always be something AI PMs and leaders alike will have to push
    against, but don’t rush this.'
  merge: -1
  img_proc: true
- pgno: 354
  md: 'Here are some questions you can ask to determine whether you''re geared for
    success:


    +   - Do we have a clear baseline of data for comparison once we onboard AI features
    for things like customer behavior, product performance, and internal processes
    using existing data?

    +   - Have we defined specific measurable outcomes and metrics that will indicate
    the success of the AI features we might want to add?

    +   - Are all major stakeholders (go-to-market, sales, marketing, engineering,
    leadership) aligned on these metrics?

    +   - Is there sufficient executive sponsorship for potential AI features?

    +   - Is there adequate funding, commitment, and advocacy from leadership to ensure
    the success of your AI transformation long term?

    +   - Does AI transformation support overarching business goals like revenue growth,
    operational efficiency, or improving customer satisfaction?


    # Competition — love your enemies


    Now that we’ve discussed the internal process of ideating potential areas of AI
    adoption within your product, as well as the stages of ensuring your data readiness
    to adopt AI, we can move on to your external environment and internal development.


    Your competitors will offer a landscape of possibilities when it comes to what
    AI adoption will look like for your product. We don’t advise mimicking your competitors’
    AI strategy but, rather, taking what AI adoption looks like for your competition
    as input when you weigh up options. AI PMs who mimic the competition risk their
    product’s failure because doing so makes them lose what makes them special to
    customers, investors, partners, and employees. Your product is unique and that’s
    what attracts people to it. Own your unique value proposition and find a way to
    make it even more special with AI. Using the data you already have will take you
    quite far, but there will always be a need to append this data with a feedback
    loop from the outside world. Understanding your competitors will help you inform
    your strategy. It will give you examples from your peers who have already made
    the jump that you’re looking to make. Some of the examples you see from your competitors
    will be sources of inspiration and some examples will help you avoid certain mistakes.
    Doing your due diligence when researching your competitors, particularly those
    that have also embraced AI, will have some influence on what you choose to build
    and should be one of the factors that influence the lists we established previously.


    Some will refute this point and say that you should build a product based on your
    own understanding of your market and your customers’ problems. The notion that
    you should focus on the problem you’re looking to solve without the sometimes
    eclipsing influence of the competitive landscape is well-meaning but highly flawed.
    We don’t exist in a vacuum. Products are compared with others in their peer group
    and, in many cases, one product defines another. Whether you’re selling to consumers
    or other businesses, your product is going to be compared with similar products.
    Being aware of your competition doesn’t necessarily mean you will build like them
    but it does offer you a perspective that’s valuable and realistic. Ignoring the
    impact of your competitors’ influence on your product would be like ignoring gravity.
    It’s going to impact you whether you think it will or not.'
  merge: -1
  img_proc: true
- pgno: 355
  md: 'Another important point it would be remiss not to mention here is to recognize
    that a big part of your competition includes the past iterations of your own product.
    You’re competing with how you’ve done things. You’re competing with past versions
    of your product. Thinking critically about this past version, particularly the
    version that doesn’t leverage AI, is going to be a big part of your design process.
    Think about what the limitations are, and what opportunities, strengths, and challenges
    the old version of your product offered your customers. How can you capitalize
    on those opportunities, limitations, and challenges with this new version you’re
    building? Treat the old or current iteration of your product as its own threat
    to your current product.


    As you think about your competitive landscape, you might be tempted to get down
    to the feature level and do a comparison matrix with your top competitors. This
    is often a worthwhile exercise, particularly for your sales, marketing, and engagement
    teams later down the line, but at this stage, it’s a bit too soon for that. Try
    to analyze your competition from the lens of the original value list we started
    out with.


    Getting to know your competitors is a great way of not only understanding possible
    directions you can take with your own product but also getting a glimpse into
    where the industry that you work in is headed. Understanding the competitive landscape
    you’re playing in and how it’s changing can have a strong impact on your ability
    to see trends within your own industry and decide whether or not you want to be
    an active participant or an agent of change for those trends. Going to market
    is an entire specialization in and of itself, and as an AI PM, you’re wearing
    that hat to quite a large degree. The better acquainted you can get with the market
    you’re serving and how that market is evolving with AI, the stronger position
    you’ll be in when it comes to making the call on how to leverage AI in your own
    product.


    So far, we have brainstormed potential areas in which AI can be adopted in your
    existing product, grasped data readiness, and evaluated what AI adoption looks
    like in your competitive landscape. These are all valuable inputs you’re going
    to consider when it comes to crafting your product strategy now that it’s ready
    for its AI makeover. In the following section, we’ll cover how to build that new
    product strategy that aligns with all the ideating we’ve done.


    # Product strategy — building a blueprint that works for everyone


    By now, we’ve brainstormed potential ideas. We’ve taken an inventory of our data,
    as well as the insights that can come from our competition and greater market,
    and we’re finally able to come to the drawing board and build a product strategy
    that will reflect the next major era of our product. Going from a traditional
    software product to an AI product is no small feat and it should be treated as
    a massive overhaul of the product because so much of how we build, what we build,
    and how we store, collect, and use data will be majorly renovated.


    Building a product strategy will directly influence your product roadmap, and
    this will help you realize which parts of your product will need to transform
    first to succeed in the actualization of your product’s AI transformation and
    commercial success. However, there’s a big difference between creating a product
    strategy that fits in with your product’s new value system and creating a product
    roadmap that reflects that strategy.'
  merge: -1
  img_proc: true
- pgno: 356
  md: 'The roadmap is a proposed timeline of major milestones and features that will
    be built in the year ahead. The roadmap should not come before your product strategy
    is agreed upon by your key stakeholders. The roadmap is derived from this strategy
    and not the other way around.


    We don’t build what we can and hope for the best. We agree on what to build using
    the collective knowledge and wisdom we’ve gathered about our product and how to
    best go to market with AI capabilities. In the following subsections, we will
    cover the product strategy process and a proposed list of how to develop a product
    strategy that works for all your major stakeholders.


    In the section that follows, we will cover product vision, product strategy, and
    product goals and how they all relate to each other. Then we will explore how
    to best execute a product roadmap that supports the growth of AI features and
    capabilities. This isn’t necessarily a how-to because the order and the contributions
    you take in will depend on your specific product. Rather, this can be viewed as
    more of a checklist to ensure you’re headed in the right direction:


    +   - Product vision

    +   - Product strategy

    +   - Product goals

    +   - Product roadmap


    # Product vision


    We won’t go into the specifics of what having a company mission statement or vision
    is about, but suffice it to say that there will be one. If it doesn’t exist, this
    is a great moment to generate a simple statement that encapsulates why your organization
    exists in the first place. What is it trying to achieve and what is the vision?
    From this point, your product vision is about aligning with your organization’s
    higher-level goals for the market it’s serving. In your product vision, you’re
    looking to simply explain how you see your product serving its target market.
    What are the needs and problems your customers and market face and how does your
    product meet those needs? Try to nail this down before you think about how AI
    shapes that vision, and then take a moment to reflect on what changes when you
    bring in AI. Try to whittle this down to one sentence if you can – two if you
    absolutely need to.


    Gathering feedback and crafting a product vision are all collaborative efforts
    that are not done exclusively by the PM. Rather, the PM brings the right voices
    together to make sure a collective sentiment is agreed upon by the stakeholder
    team. You should be the person that organizes the meetings in which these things
    are decided and it’s your job to make sure you leave those meetings with something
    everyone present can live with. You’ll meet with your stakeholders regularly in
    those product strategy meetings we already discussed and you’ll have many opportunities
    to reevaluate how this vision evolves. If your product vision is the “why” behind
    your product, your product strategy will be the “how” and your product goals will
    be the “what.” A product vision is, well, visionary: it represents some ideal
    future state or ultimate impact your product will have on users or the market.
    It’s a statement that will align everyone’s efforts to that ideal future state.


    Here are some examples of the product vision of well-known companies:


    +   - **LinkedIn:** “Create economic opportunity for every member of the global
    workforce.”'
  merge: -1
  img_proc: true
- pgno: 357
  md: '+   - Slack: “To make work life simpler, more pleasant, and more productive.”

    +   - Ikea: “To create a better everyday life for the many people.”


    > For a more nuanced discussion on product vision and its impact on managing alignment
    with leadership and company values, feel free to refer to Chapter 11.


    # Product strategy


    Knowing and agreeing on why your product exists allows you to contextualize all
    the activities you’re doing to brainstorm and ideate early on and formulate them
    into a plan. Product management is a creative job first and foremost, and the
    most difficult part is knowing where to start. The beauty of starting with a product
    that already exists is that you have a starting point. Once you’re able to get
    started with some of the lists and exercises we’ve already gone over in this chapter,
    you’re ready to start building your product strategy.


    This will serve as a high-level plan for how your product will be built over time
    and incorporates the many facets of expressing a product: the marketing, the distribution
    channels, and how it will be communicated to your customers. Keep in mind that
    many of the elements for your product strategy will spring from the first stage
    of the product development process: ideation. During this stage, many ideas will
    be explored and each of them will have a priority. These ideas will inform where
    you currently are with your product and where you want to go.


    Reconciling all of this will be an act of putting all these pieces together in
    a rough draft, which will allow you to get to the heart of what building a product
    strategy is all about: deciding what your organization wants to achieve with your
    product and creating a product strategy that aligns with your overall company
    vision. If a product strategy is the “how” to the “why” of product vision, this
    means it will describe how the team will get to that ideal future state. The product
    strategy will break down the vision into actionable steps and priorities that
    will ultimately guide the roadmap and established product goals. It will include
    things like:


    +   - How the product team wants to compete in the market and position the product

    +   - Whether customers will be targeted and segmented around the product

    +   - Key differentiators in the market and key features to build


    # Product goals


    Next up, you establish goals for your product – you can’t really have a strategy
    without establishing high-level goals. These goals will be a critical thinking
    task that will spring from your product vision, particularly now that this vision
    encapsulates the adoption of AI in whatever form makes sense for your product.
    These will be actionable checkpoints derived from the product strategy and they
    will provide specific metrics or outcomes that indicate success has been reached
    toward the product vision. Because they’re goals, they will be short-to mid-term
    targets that will help indicate progress is happening toward that overarching
    product vision and strategy.'
  merge: -1
  img_proc: true
- pgno: 358
  md: 'Goals exist to help you measure and prepare for important objectives that you
    want to reach with your product, for your customers, users, market, developers,
    and the rest of the employees in your organization. Consider these your strategic
    objectives and key results (OKRs) for your product. Without putting these big
    boulders in and building your product vision and goals from the place of what’s
    most important, you’ll drown in the weeds and you won’t build strategically. You’ll
    be left chasing opportunities unintentionally and it may tempt you to just follow
    what your competitors are doing or what your customers are asking for. Given the
    importance of the move to AI, take the time here to begin from a place of strength.
    If you find yourself weighing feedback from your competitive analysis, your customers,
    or your internal teams disproportionately when finding this vision and establishing
    your product goals, think critically about whether that’s actually appropriate.


    Feel free to also make this process collaborative and jot down all the goals that
    occur to all your various stakeholders so that you can prioritize them together.
    Again, you can always revisit these goals and scrutinize them later, but try and
    see what you can come up with together, refine that list, and try to stick to
    three or four higher-level product goals here so that you can begin to approach
    your product roadmap with confidence. All these goals will manifest in being broken
    down into smaller bits, and those bits may take weeks, months, or even years to
    fully realize. That’s OK. Your product goals shouldn’t be something that can happen
    in days and weeks. They should be encompassing and strategic enough that they
    are long-lasting because they’re there to inform your overall product roadmap
    and to ensure everyone is working in service to a unifying goal.


    When setting up goals, remember the following critical questions:


    +   - Does the goal align with our product vision?

    +   - Are there certain major milestones or benchmarks that we’re hoping to achieve
    with AI being incorporated into these goals?

    +   - Is this goal addressing the most critical customer pain points?

    +   - How does this goal help move us closer to our long-term vision?

    +   - Which metrics will we use to measure success?

    +   - How will achieving this goal improve the overall customer experience?

    +   - Is the goal realistic and achievable given the resources and time?


    # The product roadmap


    Finally, we’ve made it to the product roadmap. This is the last step toward establishing
    our product strategy and it’s the most detailed part because it’s meant to capture
    initiatives that have come from all of the strategic goal-setting and vision exercises.
    This is where the magic of building and shipping products is. Taking strategic
    nebulous goals and turning them into a tangible reality, the roadmap is where
    we apply the conditions, limitations, and dependencies that we haven’t yet bothered
    with. Roadmaps will change and they’re not meant to be crystal balls, rendering
    your fate non-negotiable. They are meant to serve as guides for a product team’s
    strategic directives. They are meant to be a bird’s-eye, calendar-view translation
    of your product vision and goals.'
  merge: -1
  img_proc: true
- pgno: 359
  md: 'Virtually everyone in your organization is going to see your product roadmap
    and it will serve as a blueprint for all teams to use to align when it comes to
    their own goals and planning sessions. It’s also a way to communicate the results
    of all your strategy sessions and is meant to serve as a guardrail for all kinds
    of projects, initiatives, and implementation issues. Let’s look at the key benefits:


    +   - **Identifying changes in deadlines or scope:** If deadlines, issues, or
    bottlenecks arise, as they inevitably will, your internal teams have an internal
    source of truth to give them guidance on how much leeway they have, and it also
    gives them structure around when to escalate things because a roadmap is marked
    by months and quarters. This is an especially important note with AI products
    because, as you build, you will start to see certain experiments or projects taking
    longer than expected. Your regular product strategy sessions will make sure to
    absorb the shock of any major changes to deadlines or the scope.


    +   - **Aligning different teams:** Establishing a product roadmap will also ensure
    you’re aligning the efforts of your product design, development, UX, success,
    marketing, and sales with your strategic goals. Each major initiative you include
    in your roadmap will have its own documentation that comes with it in the form
    of user stories or product requirement docs, and all major initiatives will come
    with some kind of acceptance criteria. This makes it so that your roadmap is tied
    to the manifestation of specific outcomes. The roadmap isn’t just a collection
    of features you plan to deliver by a certain date. It’s a representation of the
    outcomes you expect to see from your development efforts. Multiple features may
    be in service to these outcomes.


    +   - **Aligning the product with vision, goals, and expected outcomes:** As you
    start to establish a backlog of epics and tasks, you’ll start to align them with
    the themes present in your product goals and initiatives as they get further grouped
    into sprints and releases. The product team, along with the AI PM, will own the
    product roadmap creation and maintenance and will continuously break down elements
    of the roadmap into individual tasks with their own acceptance criteria. Themes
    will start to emerge as you go. The roadmap will be a reflection of the initiatives
    and outcomes that are most compelling, whether it’s because they have the biggest
    impact on customers or whether they offer the greatest ROI to the business.


    +   - **Ease of working with stakeholders:** The last thing to keep in mind about
    establishing the roadmap is that, as an AI PM, you’ll take whatever version of
    your product roadmap is final enough and you’ll begin the work of evangelizing
    about that roadmap to your greater organization. Up until now, all of this has
    been a collaborative effort, but you can’t get very far if your group of collaborators
    is too wide. Establishing a stakeholder team to work with that’s representative
    enough of leadership, development, product, and go-to-market teams is a strategic
    task in and of itself. They will help you get to this point in the process. Now
    that you’ve gotten to this point, you’re going to spread the word and get feedback
    from the rest of the organization because everyone will use it as a guideline.
    This offers you another level of scrutiny and allows for additional voices to
    raise concerns that might not have come up with the core stakeholder team.'
  merge: -1
  img_proc: true
- pgno: 360
  md: 'To achieve this, you can maintain a recurring product strategy meeting with
    key stakeholders. We recommend making this a biweekly or monthly process if you''re
    in a relatively new organization, and making it monthly or quarterly if you''re
    at a more mature organization where things move more slowly. Make sure you''re
    crafting your roadmap in a way where you''re planning at least two quarters out
    so that you''re strategic with your resources and time. Keep lines of communication
    open and allow space for new ideas and alterations to make their way into your
    product strategy and roadmap. This is a responsible way of not just capturing
    all the new energy that will come from building through your plans as they stand
    but is also a way to regularly welcome new perspectives. It''s easy to get really
    great ideas when you''re always brainstorming. When you''re in the practice of
    just executing, brainstorming becomes a luxury that your time rarely affords,
    and things get stale. Resist the temptation to make these meetings ad hoc and
    only bring the party together when ideas start to stagnate. That''s not a good
    practice because it puts a lot of pressure on your stakeholders to perform when
    the well has already run dry. Keeping this meeting scheduled regularly will make
    sure that your stakeholders expect it and get used to coming to it with their
    own ideas. Keep the meetings up, and even if you do run out of ideas or motivation,
    you can always shorten them when they do arise and give yourself more time back.


    Now that you have a product strategy and roadmap you can be proud of (yes, this
    is the intended final state), we have great news for you: it''s never going to
    be finished! This is just the first iteration of the current state of affairs.
    The goal here isn''t to finish anything, it''s to agree on the starting point.
    Over time, your strategy and roadmap will both evolve and you will revisit them
    regularly.


    Remaining committed to keeping a standing meeting means that your stakeholders
    can take it upon themselves to keep a running list of topics and considerations
    to bring up in these meetings. It also keeps you honest by keeping you out of
    the very understandable and common pattern of staying in execution mode. When
    we''re there for too long, our vision can get blurred by the inertia of building
    products. Maintaining the product strategy is your ultimate responsibility and
    it consists primarily of the strategic elements that happen when building your
    product vision, goals, and roadmap. Having regular product strategy meetings makes
    you a good steward of your strategy.


    # Red flags and green flags — what to look for and watch out for


    Moving forward into the wide frontier of AI products includes some common pitfalls
    in AI transformation, as well as markers for success. We will call them red flags
    and green flags and they''re signals you can pick up on as you go through this
    process of getting your product ready for AI adoption. Some of these will be concrete
    actions or results and some will be more emotional, but either way, you can use
    them as markers to know whether you''re on the right path or whether you''re hitting
    potential rough patches. In the following subsections, we''ll address a few red
    and green flags. Let''s get started.'
  merge: -1
  img_proc: true
- pgno: 361
  md: "# # Red flags\n\nRed flags are behavioral patterns we can try and look out\
    \ for that indicate there is an issue with a process we’re setting forth. Because\
    \ AI adoption is such a revolutionary undertaking for any company to take on,\
    \ it’s best to look out for some of these habitual patterns early so that you’re\
    \ starting on the right foot:\n\n+   - **I don’t know:** If you’re regularly engaging\
    \ with various teammates or employees on different teams at your company and they\
    \ seem confused about why the company is adopting AI, what the value will be for\
    \ their customers or readers, and what the product’s high-level goals are, that’s\
    \ a red flag. The point of crafting a product strategy that aligns with the move\
    \ to embrace AI is to make sure no one in your organization is confused about\
    \ why this is happening. Make sure the entire company knows why you’re adopting\
    \ AI and which use cases you’re trying to solve with it.\n+   \n+   - **Shifting\
    \ goals and strategy:** Building a product strategy or overarching goals is about\
    \ setting an intention and sticking to it. The bigger a ship is, the slower it\
    \ gets moving, so if you’re finding the goals and strategy are often changing\
    \ from the top down, it will make for unfocused, unaligned teams handling day-to-day\
    \ tasks. Likewise, if daily tasks stray too far from the original goals and strategy,\
    \ mechanisms have to be put in place so that teams are reinforcing higher-level\
    \ goals in a more focused way.\n+   \n+   - **Communication stalls:** If you’re\
    \ not meeting regularly or there’s a lack of engagement in your recurring product\
    \ meetings, there’s likely some internal resistance you have to deal with. Do\
    \ your best to communicate the exciting opportunity that embracing AI is, not\
    \ just in terms of your product but the market as a whole. Rather than seeing\
    \ AI transformation as a burden that’s going to be a lot of work, you’ll know\
    \ you’re on the right path when you can sense curiosity and openness from the\
    \ stakeholders who hold leadership positions at the organization they serve. A\
    \ lack of executive engagement is a critical red flag. AI isn’t something leadership\
    \ can outsource. They need to be involved and engaged at every stage of your AI\
    \ adoption journey.\n+   \n+   - **You’re not seeing progress:** If you’ve started\
    \ the process of working on creating your AI/ML pipeline and you don’t see progress\
    \ or at least some early positive signals from the model training you’re starting,\
    \ you might not have the right skill level to truly tackle the undertaking that\
    \ is AI transformation. Making sure you have the right talent team, tech stack,\
    \ and know-how is hard to do at the outset, and many companies struggle with establishing\
    \ the right combination of factors as they get started. If you are struggling\
    \ for talent, consider working with AI consultancies that can help you leverage\
    \ from a diverse talent pool that’s had exposure to use cases similar to yours."
  merge: -1
  img_proc: true
- pgno: 362
  md: "# Green flags\n\nIn this section, we wanted to include a few green flags that\
    \ might appear as red flags at first glance. In part, we want to prepare you for\
    \ some of the hurdles you’ll encounter on your journey to help manage your own\
    \ expectations, but we also want to convey that the following behavioral patterns\
    \ are often a sign of things going right even if you might not experience them\
    \ that way:\n\n+   - **Your pilot project fails:** It was probably going to anyway.\
    \ We’ve talked so much about managing expectations, and this is really what it’s\
    \ all about. Whether you’re balancing your own reaction or the reactions of others\
    \ in the face of lackluster performance or no performance at all, you’re going\
    \ to have to act as a source of faith for yourself and others. ML works and companies\
    \ all over the world use it constructively and productively every day. Those with\
    \ the patience and determination to see through will be rewarded, but it can be\
    \ hard to see progress, particularly at the beginning and when you’re starting\
    \ from the perspective of a traditional software product. Give it time and don’t\
    \ give up.\n+   \n+   - **Too much feedback:** Whether from your customers, prospects,\
    \ users, or internal teams, if you find yourself inundated with feedback about\
    \ what should make it to the roadmap and what shouldn’t, take it as a sign that\
    \ you’ve succeeded in properly evangelizing your product vision, goals, and roadmap.\
    \ When it comes to AI transformation, having more voices involved early on can\
    \ be exhausting, but it’s also an amazing indication that people are engaged.\
    \ It’s a good problem to have. Being the referee is easier than being the cheerleader\
    \ who’s trying to muster up excitement where there is none.\n+   \n+   - **Reimagining\
    \ data consumption:** If your internal teams are changing how they use and ingest\
    \ data, that means the culture is changing toward becoming more data-driven, which\
    \ will further support the success of your AI platform. If your organization realizes\
    \ it has to massively overhaul how it annotates, stores, collects, and uses data,\
    \ that means the AI transformation has gotten to a phase where it’s affecting\
    \ internal teams and the predominant climate.\n\nAs the AI PM, you’ll want to\
    \ be aware of the potential hurdles to look out for, as well as the indicators\
    \ that your AI adoption is going well. Your organization will be looking to your\
    \ leadership as this journey unfolds. Your credibility in this area will be cemented\
    \ if you can be a safe haven for your colleagues when things go wrong and a source\
    \ of encouragement when things seem to be going wrong but aren’t.\n\n# Summary\n\
    \nSo much of this chapter has been about how to anticipate and prepare for the\
    \ jump to AI/ML. In *Part 2* of the book, we heavily discussed concepts related\
    \ to the AI-native product: a product that’s created with AI initially. Once you\
    \ do make the jump to fully embrace AI in your own product, you can refer to *Part\
    \ 2*, which is more focused on the aspects that come up when you’re in the flow\
    \ of building AI. In this chapter, we wanted to focus on the preparation stages\
    \ for embracing AI/ML because of the gravity that comes with AI transformation."
  merge: -1
  img_proc: true
- pgno: 363
  md: 'Brainstorming ideas, vetting those ideas with practical considerations, getting
    your data right, evaluating the competitive landscape you''ll be playing in, and
    bringing in your stakeholders to make a plan for how to build the transition are
    all part of AI readiness. All of the ideas expressed in this chapter are also
    easier said than done, and each section of this chapter will be a process in and
    of itself, but once you are able to get to the point where you''ve decided on
    a product strategy and you''re executing that strategy with a product roadmap
    that your entire organization can get behind, you''re on your way to building
    with AI.


    It''s a privilege and a massive responsibility to be a PM, particularly one that
    oversees the AI transformation of their product. It''s an exciting time in your
    product management career and one that you''ll likely look back on fondly. We''re
    at a unique precipice in history and not many PMs can say they were able to be
    of service in such a big step for their organizations and their respective products.
    As you hit difficult moments along this journey, remind yourself that this is
    a difficult transformation to manage and evangelize for others in your organization
    too.


    Embracing AI and all the challenges that come with it isn''t for the faint of
    heart, and if you find yourself getting frustrated, it''s actually a great sign.
    It means you care enough about your product and your organization''s success with
    AI to elicit an emotional reaction. Give yourself and your co-creators grace and
    be proud of the work you''re all doing collectively to embrace the wave of AI.


    In the next chapter, we will explore the role of design in more depth. If this
    chapter sets the stage for AI transformation, the next chapter shows us how products
    can evolve to embrace AI from a practical design perspective.


