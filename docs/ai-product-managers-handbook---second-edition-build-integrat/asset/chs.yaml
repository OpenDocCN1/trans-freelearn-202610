  \n\n\n\n# 8\n\n# 为垂直行业、客户和同行群体定制\n\n在本章中，我们将理解产品如何在**垂直行业、客户和同行群体**（规模相似、不一定同属一个垂直行业但具有互补性的客户群体）中演变和细分。这一分析的目的是理解你如何开始思考产品管理在引导AI产品面向特定群体时所扮演的角色，以及最终AI能为你为这些群体做些什么。AI和机器学习是强大的工具，但其通用力量需要被针对性地应用，才能让它们的价值得到充分体现。调整AI模型以满足行业特定需求、根据客户的人口统计特征、行为或公司规模来个性化AI解决方案，以及利用数据在跨行业和跨领域间分享洞见，都是解决方案落地时实现定制化的方式。在许多方面，**产品经理（PM）**的工作就是让这种价值对从客户到开发者的所有人都尽可能清晰可见。因此，我们将讨论产品如何在领域、垂直行业和用例方面被情景化的各种方式。\n\
  \n正如我们在前面章节中讨论过的，产品经理的角色涉及很多方面，本质上是多面的。你参与设计产品、组织产品演进过程中的工作流程、分析客户反馈、将反馈整合到整体业务目标中、研究新方法与改进、构建与公司战略相符的更大产品战略，并最终在各级层面与所有利益相关者、开发者和领导者沟通。这要求你对产品及其成功有深入的理解、亲密度和承诺！\n\
  \n当你将产品经理的角色融入AI产品经理时，还有更多领域需要考虑。你需要了解机器学习算法和数据模型方面有哪些选择，也要理解AI将如何在验收标准和关键指标上推动进展。尤其是现在，随着生成式AI模型和API的可及性，你还需要理解如何利用生成输出来提升产品的价值和优势。你需要了解数据隐私和AI伦理，确保你不会构建可能对任何客户或企业未来造成伤害的东西。\n\
  \n最重要的是，AI产品经理的角色需要一定的数据流利度和数据素养。培养关于如何使用数据、如何将数据应用于特定用例的直觉，以及了解一些统计学和数据模型本身的知识，对于确保你有足够的理解来自信地担任AI产品经理至关重要。在许多方面，这个领域是开启AI产品经理职业生涯的前提条件。作为AI产品经理，你将大量处理数据。批判性思维和复杂问题解决能力对于构建能够最好地匹配AI产品特定用例的成功产品是必需的。为了帮助你培养这些技能，我们将探讨AI最常被应用的用例、领域、垂直行业和同行群体。\n\
  \n本章我们将涵盖以下主题：\n\n- 理解领域空间以及AI如何针对这些领域进行优化\n- 熟悉AI产品渗透率较高的各类垂直行业\n- 理解用户行为分析\n-\
  \ 通过思想领导力和咨询向同行学习\n\n## 领域——将AI导向特定区域\n\n在讨论领域时，确实有两个主要领域你需要投入大量时间建立可信度。第一是理解AI概念本身，这一点我们在本书前面已经广泛涵盖。第二是理解AI如何帮助某些领域取得成功。考虑到本书当前部分聚焦于构建AI原生产品，我们将重点讨论AI产品经理在着手构建新AI产品时如何实现这一点。\n\
  \n根据你所处的行业，你需要足够深入地了解你所处的领域，以便知道你的直接和间接竞争对手是谁。这可能相对直接，也可能不是，具体取决于你工作和竞争的领域。Gartner有一个很好的工具叫魔力象限。象限的四个区域如下：\n\
  \n- **领导者：** 市场中已经确立地位、最为可靠和普遍的老牌参与者。他们展示了最完整的愿景以及执行该愿景的最高能力。\n- **挑战者：** 威胁给定市场中领导者主导地位的新进入者。他们的愿景完整度还比不上领导者，但他们能够在执行层面竞争。\n\
  - **远见者：** 这一群体拥有很多愿景，但执行能力有限，因此他们与领导者竞争，但无法同样快速或全面地执行。\n- **利基参与者：** 这一群体能够专注于有限的用例，并为该特定群体提供良好服务。他们不会扩展产品套件以实现更高的愿景，也不会积极争夺更高的市场份额。他们满足于自己的利基市场。\n\
  \n![](img/a0c9f9a2ba06a06d309ce21d890a47c6_203_0.png)\n\n图8.1：改编自Gartner魔力象限\n\n\
  作为在你所处领域构建新颖AI产品的AI产品经理，你需要了解你所选领域或空间中所有四类竞争对手。这四个象限本身建立在基于愿景完整度的x轴和基于执行能力的y轴上。我们鼓励你将Gartner的魔力象限作为资源，来评估你的组织在市场中的位置，以及你最大竞争对手的位置。你衡量自己处于这些分界线何处的能力，将为你带着新的AI产品进入市场做好最充分的准备，尤其是在如今许多AI产品仍处于早期阶段的情况下。\n\
  \n在构建AI原生产品时，大量初期工作需要投入到构思和产品定位上，因为它太新了，而且正进入一个新市场。考虑到启动和运行AI产品的成本和投资，你需要在构建投资时深思熟虑。在接下来的小节中，我们将重点讨论如何为你的市场恰当地定位产品，理解你的产品设计如何真正服务于该市场，以及如何构建一个最适合你市场的AI产品策略。\n\
  \n## 理解你的市场\n\n对于任何特定领域，Gartner的魔力象限帮助公司识别并参照执行力和愿景与竞争对手进行定位。进行竞争分析以理解你今天在产品及AI能力方面的位置，以及你感知中他人在该方面的位置，将有助于你确定产品或产品组合的未来战略。让我们来看看不同类别：\n\
  \n- **领导者：** 领导者展示了执行最完整愿景的成熟历史。他们能向你展示哪些做法有效，以及该领域主要市场参与者正在主要解决哪些需求。这有助于你了解可寻址市场真正希望从其服务公司那里获得什么。领导者也善于向他们的领域展示可持续解决领域痛点的样貌，因为他们已经存在很久，同行产品经理可以从他们发布的产品以及多年来整体市场的接受程度中学习。当你作为产品经理进入一个新领域时，领导者提供了极好的研究基础。在这一部分，你会发现像微软（Azure\
  \ AI）、谷歌云（AI和机器学习）和IBM Watson这样的公司，它们提供全面的AI工具、广泛的采用和市场主导地位、创新，以及经得起时间考验的可扩展解决方案。\n\
  \n\n\n\n- **挑战者：**尽管象限中的挑战者在愿景完整性上稍显不足，但他们能够很好地满足市场需求，从而从领导者手中夺走一部分市场份额。当你思考自己的产品时，了解这一动态会很有帮助。如果挑战者能够从各自领域的领导者手中夺取市场份额，那就意味着存在可以利用的潜在断层线。这些断层线正是领导者未能充分满足市场需求的地方，而最成功的挑战者能在这些断层线中找到机会。在本节中，你会看到像\
  \ AWS、Oracle 和 Salesforce 这样的公司，它们在 AI/ML 平台上执行力很强，但在创新方面并未引领潮流。\n\n- **利基厂商：**利基厂商在愿景完整性或执行能力上并不超群，但这恰恰是他们的超能力所在，因为利基厂商能向你展示边缘用例可能出现在哪里。这有助于你在构建和设计产品时，识别出一些已被证明成功的特性或用例。这些边缘用例可能非常小众，以至于挑战者和领导者本身都不认为将它们纳入现有产品套件具有战略意义，但对于新兴产品而言，这些知识可能很有价值。了解你的领域内存在哪些利基市场，将为你揭示目前尚未开发或服务不足的潜在增长领域。在本节中，你会看到像\
  \ H2O.ai、SAS 和 Cloudera 这样专注于特定垂直领域和用例的公司。\n\n- **远见者：**这些厂商对其产品套件乃至整个领域都有很强的愿景。远见者能向你展示所选领域中的产品可以实现哪些可能，并很可能包含你在该领域所能找到的一些最前沿的功能。作为\
  \ AI 产品经理，你在这里会看到大多数直接竞争对手，因为 AI 功能在大多数领域仍然采用较慢，而且我们敢打赌，这些厂商大多都开始尝试 AI 能力了。在本节中，你会看到像\
  \ DataRobot、UiPath 和 Palantir 这样的公司，它们提供了强大的愿景，但范围更为有限。\n\n如果你刚开始在所在领域应用 AI，并且有幸从一开始就参与产品战略，那么了解所在领域的新兴远见者将是一个很好的起点。今天的远见者可能就是明天的领导者，所以你需要熟悉所选领域中这一类别里的名字。\n\
  \n你可以自己进行市场调研，但无论如何，你都需要对自己所在领域的格局有所了解，以便尽可能全面地理解你的竞争对手、他们试图解决的问题，以及你所在领域的客户。与营销团队合作，或者全面了解你的竞争格局，是构建\
  \ AI 原生产品的关键一环。要想构建有价值的东西，你必须解决客户最深的痛点，也就是你试图用 AI 来解决的问题。你可以使用下面的清单来确定你今天是谁，以及你明天想在市场中成为谁：\n\
  \n- **确定关键参与者：**在四个象限中，将你的关键竞争对手与自己进行对比，以了解各自的优势和劣势。你的竞争对手在试图解决什么问题？哪些客户构成了你的目标市场？\n\
  - **研究当前趋势：**分析新兴技术和趋势的影响，以了解哪些因素对你的整体市场影响最大。现有工具中存在哪些空白？\n- **评估你的定位：**审视四个象限及其中所在市场的参与者，以确定你当前的产品和公司战略是否与所见情况一致。如果不一致，想想如何达到你想要的位置。\n\
  - **盘点能力和优势：**在你的市场中，哪些产品或功能对参赛公司而言最突出？这些是否与你希望公司未来的发展方向相关？\n- **客户反馈分析：**基于象限，你的竞争对手在感知优势方面是否存在空白或痛点？你的产品与之相比如何？\n\
  - **分析市场份额：**对于你最主要的竞争对手，他们的市场份额和增长轨迹如何？\n- **市场细分：**你的竞争对手最常服务哪些细分市场？这些细分市场与公司重点关注的是竞争关系还是互补关系？\n\
  - **功能层面：**在产品层面，将你的产品与四个象限中竞争对手的产品在功能、能力和价格上进行对比。你是否注意到可以对路线图进行调整？\n- **战略合作伙伴：**你能在四个象限内识别出潜在的合作伙伴和协作者吗？是否有可以互补的合作伙伴可以合作？\n\
  - **寻找颠覆者：**四个象限中哪些公司可能对你的公司或产品构成最大风险？你可以引入哪些元素来限制这种风险？\n\n除了痛点本身，你的产品还将开始收集客户数据。这意味着你不仅在构建一个解决客户问题的产品；你还在利用产品从客户处收集的数据来改进产品功能。我们将在\
  \ UEBA 部分进一步讨论这一点，但请记住，理解收集多少客户数据、何种客户数据，以及如何使用这些客户数据，将是你进行市场调研、全面理解你要服务的市场时需要完成的工作的一部分。\n\
  \n对于许多 AI 产品经理来说，你可能已经在自己的领域积累了一定的熟悉度和信誉。通过为你的公司、组织或行业带来新颖的东西，你可以在所选领域中提升自己的声誉。AI\
  \ 为实现这一目标提供了工具，但你首先必须对为什么想要使用 AI 有一个清晰的答案，这个答案要超越营销噱头，这样你才能在竞争中脱颖而出。确保你了解市场需求，了解你的产品如何具体满足这些需求，并构建和传达一条将所有这些整合成清晰路径的产品战略，将是确保\
  \ AI 正确定位到所选领域的好方法。\n\n同样，这将是你构思产品设计和战略早期阶段的先决条件。请随时参考*第 2 章*，我们在其中讨论了**新产品开发（NPD）**阶段，以及*第\
  \ 6 章*，我们在其中扩充了 AI 产品开发阶段的相关想法。\n\n## 理解你的产品设计将如何服务于你的市场\n\n当你感觉自己已经了解了领域、主要参与者、他们利用\
  \ AI 的方式，以及你在所选领域中想要解决的一些主要客户痛点后，你就准备好开始构思你的产品了。这将带来一连串的活动。在绘制线框图、构建产品战略第一版以及制定路线图之前，你需要非常清楚为什么用\
  \ AI 来服务这个市场。在构建 AI 产品来服务市场时，如果对为什么需要 AI 来解决这个问题没有清晰的理解，很容易浪费你辛苦筹集到的资金。\n\n确实，市场会引发轰动，许多初创公司只是为了融资而拥抱\
  \ AI，但仅凭这一点并不足以让你负责任地构建一个能在市场上表现良好的 AI 产品。在你去打造一个用 AI 力量解决所有客户问题的神奇产品之前，你需要先解决一个根本问题：为什么用\
  \ AI？\n\n一旦你清楚了自己为什么用 AI 来解决客户的问题，你就拥有了营销信息的基本构件。因为我们正处于 AI 产品的关键时期，仅凭带有 AI 功能进入市场，就足以让你不得不在自己的领域内宣传\
  \ AI。当然，正如我们将在下一节中介绍的，一些行业和领域已经出现了大量 AI 功能，但总体而言，你很可能属于先行者，所以“为什么要用 AI”这个问题会不断出现，来自客户、坚持自己产品更优越的竞争对手，或者来自你内部的设计与构建团队。\n\
  \n当你开始构思时，需要把这一答案以及客户的主要问题放在首位，这样才能始终以客户为中心，并坚持你的信息传播。在构建产品初始版本时，要不断问自己：AI 是如何帮助你解决客户最棘手、最关键的需求的？作为产品经理，你是公司内部一股激励力量。这意味着，你构思并构建一个对所有人都有效的解决方案，同时也是为了激发你的领导团队。你专注于“为什么用\
  \ AI”以及你所服务客户的主要问题，也意味着你让领导团队保持专注。\n\n未来十年将向我们展示以特定领域为目标的应用 AI 的新方式。如果目前还不存在出色的解决方案，看看你是否能自己构想出来。如果你能做到，你的领域将回报你以思想领导力的炫耀资本、不断增长的客户名单，以及你能够在荒野中打造出令人难忘之物的成就感。许多人仍将应用型\
  \ AI 视为“蛮荒西部”，因为技术专家们知道，到 2030 年，我们会回顾一些我们至今尚未想到的惊人突破和 AI 用例。在这个新兴领域，保持这种好奇心和创造力的精神至关重要。\n\
  \n这适用于无论你身处哪个领域。就 AI 采用而言，一些领域将更为先进，这会使你作为 AI 产品经理的工作或多或少变得困难，因为 AI 的每个进阶水平都有一系列独特的挑战和机遇，但流程都是一样的。如果你所在的领域在\
  \ AI 采用方面较为先进，你会更关注竞争对手正在使用哪些 AI 功能来满足特定需求，并在完善产品战略时决定这是否是你想要走的方向。如果你所在的领域较不先进，你就需要从其他行业寻找\
  \ AI 采用方面的灵感，并且你更有机会用自己的产品在市场上引起更引人注目的反响。\n\n\n\n无论采用哪种方式，只要你能够将所学的一切以一种为你的领域提供现有产品中所缺失的东西的方式加以应用，你就能成功进入市场。作为AI产品经理，你不需要成为AI所有领域的专家，但你需要对你的市场以及能够最好地服务于你试图应用AI的特定用例的AI能力/策略/算法有足够的理解。\n\
  \n让你的领导团队、市场推广（GTM）营销/业务拓展/销售团队以及开发团队与你的客户以及你带来的AI解决方案保持一致，意味着你在帮助整个利益相关者团队专注于你的主要目标，即构建一个最能满足市场需求的人工智能产品。这看起来是显而易见的一点，但正如许多产品经理所知，一旦你开始通过不同的冲刺周期进行产品构建和演进的日常工作，丢失主要目标比看起来更容易。AI产品经理需要许多专业技能，所以当你开始深入设计细节、选择使用哪些AI算法等时，保持这种专注非常重要。以下是一份供你启动工作的考虑事项和问题清单：\n\
  \n- 你旨在解决哪些具体的客户痛点？\n- 这些痛点目前对客户体验有什么影响？\n- 为什么AI是这些痛点的正确解决方案？\n- AI能够带来哪些传统方法所不具备的独特能力？\n\
  - 你市场中的主要竞争对手目前如何使用AI来解决类似问题？\n- 他们的产品中存在哪些你的产品可以填补的空白？\n- 你将如何教育和向客户及利益相关者解释你的AI解决方案的好处？\n\
  - 在你的产品中使用AI可能会产生哪些潜在挑战？\n- 是否有计划来解决与数据隐私、模型偏见和AI伦理应用相关的问题？\n- 你的产品中是否有战略性的AI里程碑？\n\
  - 你的AI产品将如何助力公司的整体业务目标？\n- 你将选择哪些AI算法和模型，为什么？\n- 这些选择如何支持你解决客户问题的目标？\n- 在整个产品开发过程中，你如何确保自己始终关注这些主要目标？\n\
  - 在冲刺期间，你如何限制范围蔓延和干扰？\n\n如需更多关于设计的讨论，请随时跳到第9章，我们将在那里更深入地探讨AI原生产品的产品设计；以及第15章，我们将在那里讨论当传统软件产品随着AI功能和能力演进时设计的角色。\n\
  \n## 构建你的AI产品战略\n\n一旦你完成了设计一个解决你和市场主要痛点（你想用AI解决的）的产品的相关工作，你就具备了开始构建整体产品战略的条件。显然，你的产品MVP会从某个地方起步，但在此之后，你的产品愿景需要有一个发展方向。还记得Gartner魔力象限中的愿景完整度是x轴吗？原因在于，可寻址市场具有各种各样的需求，复杂度各不相同。你的产品MVP只能解决其中很小一部分需求。你的领导和公司目标可能无法解决市场的所有需求，但你需要与领导团队合作，定义你总体上希望为市场做什么，因为这将直接指导你的产品战略。\n\
  \n请记住，构建产品战略是产品经理的职责，而制定公司目标则是领导层的职责。你可以将你的领导团队视为为你提供关键输出（公司目标），这些输出是你构建与公司业务目标相一致的稳健产品战略、愿景和路线图所需要的。这是一个重要的区分。产品经理可能会给自己施加很大压力，这也是我自己早年在产品经理生涯中错误内化的事情。作为产品经理，并不意味着所有宏伟的想法都必须由你提出。依靠你的领导团队来指导你的工作。\n\
  \n他们应该做的工作是定义公司的总体愿景、使命和目标。如果这些没有明确界定，你将很难制定任何真正的产品战略，因为将没有任何依据。一旦你能够将这些总体公司目标转化为产品愿景、战略和路线图，你就可以将其传达给开发团队，并开始构建实际产品的工作，这将产生一个让所有相关利益相关者引以为傲的MVP，它满足了你的公司带着产品进入市场所需的最低解决方案。\n\
  \n为了构建一个能够随市场共同成长的产品战略和愿景，你需要了解市场一直在如何变化，并尽可能全面地理解这个市场将走向何方。每天都有无数关于特定行业和领域趋势的文章发布。作为AI产品经理，你更需要领先于这些文章，以便清晰地了解你的市场正在如何变化和演进。\n\
  \n你的许多内部利益相关者以及客户都会期待你在思想领导力和沟通方面发挥作用，介绍你的公司或产品套件如何随市场成长。保持对这些市场趋势的了解，尤其是那些与你的AI战略一致的趋势，对于你在一个稳健、不断演变且不可预测的世界中负责任地持续完善产品战略将是必要的。\n\
  \n如今，特定领域可能拥有成百上千的竞争对手。尤其是现在，许多初创公司可以迅速崛起并首先推行远程办公，我们看到越来越多的公司进入几乎每个领域。作为AI产品经理，你的挑战和机遇在于：能够以贴合客户实际情况的方式传达公司的产品，使用他们熟悉的技术语言或行话，并能够通过AI向他们展示为什么你的产品是最佳选择。\n\
  \n虽然在继续本章的过程中我们会讨论一些常见用例，但在完成本节之前，我们确实想强调一个重要观点：AI具有令人难以置信的可定制性。它的基本构建模块是数据，而你选择用这些数据做什么，才是真正赋予AI力量的原因。如果你是一位在AI领域充满热情、才华横溢的产品经理，并且热衷于通过你正在帮助构建的新颖产品解决客户的主要问题，那么你可以构建出针对客户特定需求高度可定制的东西。\n\
  \n以下是一份供你启动工作的考虑事项和问题清单：\n\n- 领导层设定的总体公司目标是什么？\n- 这些目标如何转化为具体的产品目标？\n- 产品的长期愿景是什么？\n\
  - 这一愿景如何与公司目标和市场需求保持一致？\n- 你市场中的关键痛点随时间如何演变？\n- 正在涌现哪些趋势？\n- 你的主要竞争对手如何定位他们的AI产品？\n\
  - 哪些AI功能或能力使你的产品与他们的产品区分开来？\n- 你的目标客户有哪些具体需求？\n- 你的客户群中是否有其他细分市场需要更量身定制的解决方案？\n\
  - 哪些近期的文章或报告可以作为你所在行业趋势的来源？\n- 你会定期查看哪些内容以保持对市场的把握？\n- 这些报告的洞察如何为你的产品战略提供信息？\n-\
  \ 你将如何向利益相关者传达你的产品愿景和好处？\n- 哪些信息最能引起你的目标客户或细分客户的共鸣？\n- 你如何确保产品营销和开发团队之间保持一致？\n-\
  \ 你会设立哪些定期会议、渠道或方法来确保持续开放沟通？\n- 你推出产品的市场推广（GTM）战略是什么？\n- 你如何鼓励团队内部产生创造力和探索新想法与创新？\n\
  \n如需更深入地讨论产品战略，请随时参阅第10章，我们会在那里详细阐述与产品战略相一致的性能基准和指标。你也可以跳到第14章，我们会在那里讨论在将传统软件产品演变为AI产品的背景下产品战略。\n\
  \n既然我们已经花了一些时间探讨如何最好地为你的市场定位产品，以及构建一个服务于你试图吸引的客户的AI战略的考虑因素，我们可以看看AI最流行的一些垂直领域。每个垂直领域都会有一系列我们反复看到的常见用例，这可以揭示AI能给某些垂直领域带来的一些最大好处。\n\
  \n\n\n\n## 垂直领域——若干关键领域的考察\n\n在上一节中，我们讨论了通用领域，以理解 AI 如何在您所选领域中进行定位。在本节中，我们将着眼于几个关键的垂直领域——即金融科技、医疗保健、营销、制造业、教育和网络安全——这些领域的\
  \ AI 采用率显著提升，以便通过这些示例充分展示 AI 主要发展领域的趋势。了解 AI 在这些垂直领域中如何被采用以及为何被采用，可以为我们提供有价值的洞见，帮助我们理解\
  \ AI 如何应用于其他领域。让我们一同探索 AI 在这些关键垂直领域中的采用情况。\n\n## 金融科技\n\n或许最迅速、最显著的 AI 变革发生在金融科技领域，其原因也不难理解。将\
  \ AI 应用于特定用例，若运用得当，可以带来可观的收入节省或增长。根据 UnivDatos Market Insights 最近的一份报告，“得益于欺诈检测、虚拟助手及便捷交易、以及用于快速即时查询解决方案的聊天机器人的需求增长，AI\
  \ 在金融科技市场的规模预计将以约 30% 的稳定速度增长。”\n\n让我们来看看金融科技领域一些最引人注目的 AI 用例，它们推动了 AI 在该领域的快速采用。\n\
  \n### 聊天机器人与虚拟助手\n\n聊天机器人或对话式 AI 使用自然语言处理（NLP），通过所谓的情感分析来处理客户服务。尤其是在当下，随着大语言模型及连接它们的\
  \ API 日益普及，这些能力也变得更加易于获取。这些语言模型被用来发现终端用户询问中的模式，从而为集中式知识库、常见问题解答页面提供信息，或帮助公司通过客户调查的形式更深入地了解其客户及其需求。在机器学习和深度学习处理数据点的地方，NLP\
  \ 中的数据点就是词语本身，而被优化的正是这些词语的指向和排列方式。\n\n金融科技领域的参与者能够利用聊天机器人来优化其他方面，例如收集其金融科技应用的客户反馈、实现流程自动化以及缩短等待时间。它们还非常擅长捕捉代际情绪，例如不愿快速打电话——这是年轻一代越来越重视的偏好，他们更倾向于以数字化方式与品牌互动。美国银行（BoA）凭借其聊天机器人\
  \ Erica 取得了巨大成功，并计划增强其 AI 能力，因为 Erica 对用户而言非常易于使用。Erica 可以帮助用户管理账户、跟踪支出并提供个性化财务建议。Erica\
  \ 于 2018 年推出，迄今为止已超过 10 亿次交互，并帮助美国银行自推出以来收益增长了 19%。超过 3200 万客户受益于 Erica 的洞察和通知。其他例子包括\
  \ Cleo——利用聊天机器人帮助客户分析消费习惯并提供财务洞察，以及 Sage 的会计聊天机器人——帮助使用其会计软件的客户处理财务问题和任务。\n\n尽管这些优势可能十分显著，但聊天机器人也有其局限性。因语言细微差别而可能产生的误解，会导致客户感到沮丧。虽然聊天机器人全天候可用在紧急情况下确实很有帮助，但它们依赖预定义的脚本，这使得它们难以处理复杂查询。这催生了由\
  \ AI 驱动的虚拟助手，它们本质上是由生成式 AI 模型驱动、并与 NLP 模型协同工作的聊天机器人。\n\n### 欺诈检测\n\n这是一个重要用例，尤其是因为当账户出现欺诈活动时，许多金融机构都会面临风险。因此，金融科技领域广泛采用的主要\
  \ AI 用例之一与更有效地发现欺诈有关，这也就不足为奇了。在此用例中，AI 被用于账户内的异常检测，以便银行和其他金融机构在发现超出现有客户行为模式的活动时能更快收到警报。这同样用于打击洗钱和其他非法活动。\n\
  \n**欺诈检测**作为用例并不像构建聊天机器人那样直接，因为很可能有多层 AI 工具协同工作才能实现。它更有可能是多种工具的组合：\n\n- 首先，某种形式的持续数据挖掘在发挥作用，以发现客户数据中是否存在总体性的、易于检测的模式。\n\
  - 还可能存在一个基于规则的系统，用于在扫描数据和寻找异常时进行挖掘。\n- 在此之上，可能还有无监督的机器学习模型，用于在挖掘之外寻找模式，并将活动分组为聚类以供后续分析。\n\
  - 通常还会使用神经网络，从已被证实确属欺诈的既有可疑模式中学习。\n\n由于当前网络安全领域的技术复杂程度，欺诈可能来自多种来源。欺诈可能来自客户本人、冒充客户的人、对抗性机器人攻击、网络钓鱼攻击以及其他诈骗。金融科技机构需要借助多层次的\
  \ AI 来应对所有这些潜在的网络犯罪。建立这种深层次的操作体系成本高昂，但与金融科技每年因欺诈损失的 5100 万美元相比，运行此类系统的成本微不足道。就欺诈检测而言，欺诈还具有时间特性，因此金融科技机构通常要关注：发现已发生的欺诈、发现正在发生的欺诈，以及在欺诈发生之前发现并阻止它。\n\
  \n像 PayPal 这样的公司利用 AI 进行欺诈检测，借助机器学习、深度学习和图技术来分析交易模式，并检测可能表明欺诈的异常情况。万事达卡在其决策智能能力中使用预测分析、机器学习和专有循环神经网络，实时评估交易的风险水平。Zest\
  \ AI 使用机器学习和高级分析来增强其信贷风险和欺诈检测能力，以服务贷款业务。\n\n尽管利用 AI 进行欺诈检测的公司能够节省潜在的损失，但这些应用也面临挑战。在误报与漏报之间取得平衡是一场持续的斗争。如果偏向误报，客户在进行真实购买时可能会感到沮丧；如果偏向漏报，企业则不得不在追回成本上花费更多。此外，随着欺诈者利用不断演变的欺诈手段变得更加狡猾，企业也需要不断适应，以匹配其升级的技能。\n\
  \n### 算法交易与预测分析\n\n在需要与**高频交易（HFT）**等竞争的高速交易速度和更高准确性方面，AI 大有助益。机器学习模型被用于更快速地有效预测市场走势，帮助算法进行出价、预测一天中最佳的交易时间，并利用历史数据构建预测模型，以了解价格何时可能上涨。除了为客户做出更好、更有利可图的交易这一主要驱动力之外，该\
  \ AI 用例被广泛采用的另一个重要原因是，算法交易也有助于限制因情绪化或心理受压的交易员所导致的错误，从而降低交易波动性。\n\n尽管算法交易依赖于一组指令来执行决策，而且市面上已有许多此类解决方案，但其背后的支持技术基于预测分析。金融科技参与者能够处理海量数据，并且他们如此致力于改进机器学习模型，以至于即便准确率或精确度仅提升几个百分点，也可能带来数百万美元的收入节省或利润最大化。无论是一家希望转化潜在客户的新创公司，还是一家希望根据信用评分提供贷款的银行，金融科技都在利用预测分析不断从新数据和历史数据中学习，为大多数决策提供支持，从而了解一笔潜在客户交易从长远来看对自己有多大价值。\n\
  \n像高盛这样的公司使用机器学习和深度学习来分析海量市场数据，以识别交易机会、优化交易策略，并预测股价走势。AQR 资本管理公司使用机器学习和量化分析来优化投资组合构建、管理投资风险，并评估各种投资因素的价值。Citadel\
  \ Securities 最近与 Google Cloud 合作，优化其量化研究技术平台，该平台使用机器学习、高级分析和时间序列分析来为实时交易决策提供信息，并同时进行风险管理。\n\
  \n尽管利用 AI 进行算法交易和预测是有益的，但管理来自不同数据源的数据质量标准却是一个持续的挑战。所有模型都有其局限性，在不可预测的金融市场中尤其如此，因为市场往往会对不可预见的事件和现实世界的混乱做出反应。市场变化的速度要求模型频繁且快速地适应不断变化的环境。以这种方式利用\
  \ AI/ML 的金融机构需要保持竞争力，并不断创新，才能在这个竞争高度激烈的领域中占据优势。\n\n\n\n\n\n## 药物发现与研究\n\n药物发现和研究历史上一直\
  \ notoriously 耗时耗力。过去可能需要数年甚至数十年的流程，如今在 AI 的帮助下可以加速。我们都曾共同见证 AI 以这种方式应用于应对 COVID-19\
  \ 大流行并加速疫苗发现，并且根据美国国家医学图书馆的说法，“AI 已成功用于识别疾病集群、监测病例、预测未来疫情、死亡风险、COVID-19 诊断、通过资源分配进行疾病管理、促进培训、记录维护以及对研究疾病趋势进行模式识别。”\n\
  \n像 AbCellera 这样的公司使用 ML 来预测结合亲和力并在药物发现中开发单克隆抗体。他们分析免疫反应的数据，根据序列和结构信息识别潜在的抗体候选物，这些信息可以与各种疾病相关的蛋白质结合。BenevolentAI\
  \ 使用 ML 通过利用历史数据和生物学见解来重新利用药物，以寻找现有药物的新用途，从而加快开发新解决方案的过程。他们还使用 ML 通过分析基因、蛋白质和疾病之间的关系来识别新的药物靶点，以及通过识别合适的患者群体来优化临床试验。BioXcel\
  \ Therapeutics 凭借其 BioXcel AI 平台在药物发现领域蓬勃发展，该平台通过分析基因组、蛋白质组、化学和临床数据来识别潜在的药物候选物，并预测其安全性特征和疗效。他们使用\
  \ DL 挖掘科学文献、临床试验和生物数据库，以优先考虑未来研究以解决中枢神经系统疾病的靶点。他们还使用计算机视觉分析高通量筛选的图像，以识别细胞反应并评估化合物对细胞形态的影响，以用于药物候选物。\n\
  \nAI 应用于药物发现和研究领域的挑战与监管合规问题有关，因为 AI 药物开发的监管环境仍在不断演变；合规可能难以实现，监管标准复杂且耗时。高计算需求也使得小型组织难以参与\
  \ AI 辅助的药物发现和研究。与算法交易 AI 应用类似，生物学环境的不断变化意味着模型可能很快过时。疾病的生物学因素复杂且可能随时间演变，使得 AI/ML\
  \ 模型难以适应。\n\n## 营销 — 分割\n\n公司长期以来一直使用数据通过营销工作来吸引我们的思想和心灵，但今天这种做法在 AI 的使用下得到了进一步放大。以用户最想接收的方式在正确的时间向正确受众传达信息是一门艺术，并且需要大量数据来完善这种艺术。因为营销人员通常试图为转化建立行为基线，以及他们如何改进这种行为，所以这是一个非常适合\
  \ AI 实施的领域。虽然营销用例中 AI 的应用方式多种多样，从定位、广告、情感分析、内容生成和分析，我们将重点关注分割，因为它是营销几乎每个方面的基础。\n\
  \n分割不仅允许对现有客户进行分组，还允许对潜在客户进行分组。分割用于通过分析大型消费者数据集来确定偏好和模式，从而针对广告进行定位。\n\nAI 可以帮助建立这些群体，从这些群体中收集见解和偏好，甚至帮助生成与这些群体相关的内容。这里的所有数据源都可能相关，包括人口统计、浏览历史和\
  \ cookie、购买行为以及来自社交媒体互动的互动，都可以纳入考虑，以根据这些数据创建潜在用户/客户的各种档案。\n\n这种分割也使得大规模个性化成为可能。如果您可以使用画像数据来了解用户，那么就可以进一步将分割提升到个性化，以增强与品牌的互动。生成式\
  \ AI 模型和 NLP 现在使得个性化内容的生成变得极其快速。它们甚至可以通过调整产品描述、电子邮件活动、社交媒体内容和博客内容的语言来帮助指导整体营销策略。\n\
  \n像 Sephora 这样的公司使用聚类算法和回归模型根据购买行为、偏好和参与度对客户进行细分，以向特定群体传递有针对性的营销信息。他们还使用神经协同过滤进行个性化推荐。Spotify\
  \ 使用基于内容的协同过滤来了解用户的音乐偏好，并为细分用户推荐新音乐和个性化播放列表。H&M 使用聚类算法和预测建模来分析客户数据并结合趋势预测，以使其营销策略与各种细分群体的库存水平保持一致。\n\
  \nAI/ML 应用于营销和分割的挑战包括确保遵守 GDPR、CCPA 等数据保护法规的合规性，这可能产生法律影响，也可能对消费者信任产生负面影响。数据质量问题也可能导致营销活动不相关，从而降低参与率并对品牌产生负面影响。此外，在许多情况下，细分用户可能会发现自己处于某种回音室中，AI\
  \ 推荐只向他们展示某些类别的内容，这可能会限制他们发现新偏好的体验。个人偏好始终可能发生变化或受到流行文化和其他外部影响，因此采用 AI 应用的营销团队需要找到一种方法来捕捉新的不断演变兴趣，即使分割做得很好。\n\
  \n## 制造 — 预测性管理\n\n我们在制造环境中看到了 AI 的务实和功利性方法。在这里，AI 被用于从质量控制到供应链再到机器人的各个方面，最终目标是优化时间和资源的使用。特别是在今天，全球供应链可能对市场波动和全球地缘政治影响敏感时，AI\
  \ 可用于平滑中断。\n\n制造业的一个优势是，如果基础设施设置得当，它能够产生大量自己的干净数据来学习历史趋势。AI 可以从实时生产数据中学习，以了解效率低下和瓶颈所在，以便管理层可以解决这些问题。基于\
  \ AI 系统从中学习到的效率低下问题，它们可以帮助预测流程中某个地方可能何时发生潜在故障。由于今天使用的许多设备可能具有传感器或物联网设备，我们也可以预测工厂线的某些部分何时可能需要维护。\n\
  \n预测性维护还有助于推进设施本身的整体管理。管理人员可以利用 AI 的预测能力更好地规划资源分配、计划装配线的停机时间和中断、为维护成本和投资预算，以及跟踪运营的整体生产率。这不仅增强了生产力提升，还提供了安心感，因为可以主动以计划、受控的方式进行管理。\n\
  \n像 Avathon 这样的公司专注于 AI 驱动的预测性维护解决方案，优化制造流程，并检测设备故障的早期迹象。他们的制造 AI 产品套件，被称为工业 AI\
  \ 套件，使用 AI/ML 在发生前预测潜在的机器故障，帮助石油和天然气、航空航天以及制造业最大限度地减少非计划停机时间和维护成本。Uptake 是一家专注于卡车车队的预测性维护公司，其平台围绕风险管理和停机时间最小化构建，作为使用其产品的核心价值主张。\n\
  \n## 教育 — 个性化学习\n\n我们都有不同的写作风格，而一刀切的学习方法导致大多数学生最终获得次优的学习体验。教育非常适合 AI 的提升，以帮助学习路径和策略变得更广泛地可供来自许多不同背景的学生使用。看到这一点令人鼓舞，特别是因为今天在美国和世界各地从事教育工作的现实已经使许多善意的教育工作者感到疏远。学生迫切需要满足他们当前需求并能随他们成长的学习路径，而不会给他们已经超负荷工作的教师增加额外负担！\n\
  \n今天，有如此多的 AI 用例可以帮助教育平台适应他们所服务的学生的学习风格。了解最终用户/学生的偏好、弱点和优势有助于为个别学生量身定制个性化学习体验。这些定制学习路径的结果是，学习可以自定进度，内容可以量身定制，并且需要改进的知识差距可以为每个学生优先考虑。在许多情况下，这还增加了额外的好处，即保护学生免受同龄人潜在评判的影响，因为学生可以在不被单独指出的情况下自信地学习。适应性学习还使得学生可以根据其接受学习的能力进步。难度水平可以调整，个性化的练习可以帮助填补空白，并且随着学生沿着路径进步，基础概念可以不断得到强化。\n\
  \n像 Duolingo 这样的公司使用 LSTM（RNN）模型进行语音识别和发音反馈，以及使用强化学习根据用户在先前练习和课程中的表现来定制课程。Squirrel\
  \ AI 使用知识图谱来建立概念之间的关系并跟踪学生掌握情况，以及使用强化 DL 来预测学生学习成果并优化问题的难度水平。\n\n\n\n\n人工智能在教育领域的应用可能面临一些独特的挑战。如果学习路径过于个性化，实际上可能会挫伤学生的学习积极性，因为系统可能偏向他们的薄弱环节，并用难度压垮他们。学习内容还必须符合本地、国家或国际的本地化和文化标准。偏见问题也需要优先处理，这样模型就不会在与学习群体代表性不足的数据上进行训练，否则可能对某些学生造成不公平或不平等的学习结果。甚至教师也可能构成挑战，尤其是当他们怀疑人工智能或担心失业时。\n\
  \n## 网络安全——异常检测以及用户和实体行为分析\n\n网络犯罪呈上升趋势，而网络安全仍然是我们最常见的人工智能/机器学习采用领域之一，这得益于网络犯罪分子的顽固和狡猾。网络安全的性质不断变化，这意味着，随着时间推移，企业需要与潜在对手保持同步。感觉我们每天都会听到新的数据泄露事件，而网络安全中最令人担忧的部分或许是那些你没有听说过的攻击数量。在本节中，我们将讨论网络安全中两个常见的用例：异常检测以及用户和实体行为分析（UEBA）。\n\
  \n发现模式以及这些模式的变化是异常检测的核心。在网络安全领域，这种既定基线及其偏差正是异常检测用例的由来。然而，异常检测的范围相当广泛，因为它可以指识别任何系统、网络或数据集中的离群值或异常事件。网络安全的领域可涵盖网络流量、系统日志，甚至用户行为。任何不规则的流量激增、异常的数据传输或与历史数据不符的系统行为都是很好的候选。异常检测常用于网络安全中，以抵御DDoS攻击或潜在的数据泄露。一旦检测到异常并且系统需要采取行动，我们就可以设法进行某种程度的修复。通常，网络攻击来自网络内部，并采用巧妙的方式隐藏踪迹，但借助用于异常检测的高级模式识别，人工智能系统可以发现某个行为者/用户的行为方式对正常用户而言不合理。\n\
  \n在我们梳理各个垂直行业的用例时，你可能会看到一些自己的模式浮现，这些模式涉及驱动那些AI应用的基础技术。其中一个总括性的用例体现在UEBA中，它在很多方面构成了我们所讨论的许多用例的底层脉络。作为AI产品经理，如果你能理解UEBA的强大之处，以及如何将其应用到你的产品乃至更广泛的领域，这将非常有帮助，尤其是在你处于运营阶段，随着时间推移构建日益强大的功能时。\n\
  \n你可以将UEBA视为一个洞察网络，它基本上汇集了所有用户的行为以及每天由这些行为产生的后续数据。一旦所有这些数据被集中和分析，它就能为你提供深刻的洞察，不仅为单个用户，也同时为你的所有用户建立一个基线。这使得发现异常或新模式（无论何种变化）变得更加容易，因为你可以建立触发器或操作，在有需要关注的事情发生时提醒你的用户或内部工作人员。\n\
  \n如今，企业需要比以往任何时候都更加警惕，而且许多企业没有足够的人手或预算来真正应对这种潜在风险，这就是数据泄露事件不断出现的原因。这也是网络安全如此轻易采用AI的一个重要原因：时机已经成熟。当用例以资金不足和人员不足而著称时，AI就有机会得到采用并真正大放异彩。\n\
  \n像Darktrace这样的公司结合使用有监督和无监督的机器学习，通过模式识别对企业内的每个设备、用户和网络进行行为建模。Varonis被金融领域的公司用于防止敏感数据泄露。他们使用机器学习和行为分析来发现数据访问和使用中的异常，从而发现受损账户或内部威胁。他们还使用NLP，让客户通过其数据安全平台的Athena\
  \ AI（生成式AI）层来调查和分析泄露事件。Exabeam的高级分析平台使用机器学习创建异常用户行为的详细时间线，以进行威胁检测并识别对敏感数据的访问。\n\n\
  然而，这种行为画像分析确实存在误报问题，因为并非所有异常都是恶意的，即使是系统更新等常规活动也可能被标记。总的来说，这些AI应用会产生过多警报，而警报疲劳是这些公司必须应对的一个用户痛点。警报过少，则面临暴露风险；但警报过多，又可能导致用户脱离参与。\n\
  \n## 思想领导力——向同行学习\n\n在本章开头，我们讨论了在自身领域内打下基础、尽可能了解领域内特定痛点的理念，目的是构建一个能够在未来多年服务于该领域的AI产品。打造一款运行良好、契合客户需求并采用现代技术的产品，是快速建立信誉的途径，而这种信誉对于在领域内传播思想领导力至关重要。\n\
  \n你可能会选择在自身领域内承担领导角色，以便在行业中定位为领导者。如今，知识中心、白皮书和产品一页纸介绍比比皆是，公司出于多种原因扮演行业思想领袖角色也很常见。也许是为了营销、入站线索、荣誉，或者仅仅是因为他们慷慨地分享自己的知识和成功。你是否愿意在在线社区中公开你的产品和专有信息，甚至可能取决于你的产品和品牌战略。这是否为你的最终用户、客户和粉丝打开了跟随你旅程的通道？它是否有助于培养更粘性、更忠诚的客户群？\n\
  \n对于公司的决策和重大障碍，你希望保持多大程度的开放和透明，这将由你和领导团队决定。你会选择成为行业中其他参与者的榜样吗？还是选择保持沉默，将你的算法秘方、丑闻和成功故事都秘而不宣？如果你不谨慎控制泄露的信息量，成为行业真正意义上的思想领袖可能会付出财务和设计上的代价。与所有有风险的努力一样，有时我们需要敞开心扉接受风险，才能同时获得透明度带来的礼物。\n\
  \n正如我们多次提到的，应用型AI产品这一时期仍处于起步阶段。即使生成式AI领域热度高涨，我们仍然只是触及了企业和用户将如何采用这些技术的表面。归根结底，除非我们看到它们在实际行动中证明自己的价值，否则我们不知道它们会有多大用处和开创性。我们尚需了解那些能使企业获得最大成长和成功的未来用例。创新和技术进步的精神源自榜样的激励。每个用例和应用示例都有能力激励我们发现新的用例。AI的新颖性也带来了一种对可能性的兴奋感。\n\
  \n尤其是在许多人对AI能否且应否解决我们所有重大难题心存疑虑的时期，或许需要企业、产品经理、技术专家和企业家来体现这种精神的协作品质。AI产品将科学、数据、技术和人性融为一体，已经展现出巨大的前景。如果你选择开放并分享你在经验中遇到的示例，无论是直接还是间接的，随之而来的礼物不仅会惠及你或你的组织；它们将惠及我们所有人，并且首要地服务于你业务的最崇高理想：最好地服务你的客户和市场。\n\
  \n## 案例研究\n\n### 市场\n\n考虑到Waterbear作为一家公司的规模和资源限制，我们的案例研究稳居“远见者”类别。在这里，Waterbear最大的优势在于它是一个目标远大的应用：不通过外部资源，而是通过内在反思，为用户提供强大的心理健康支持。尽管你可以自由地与治疗师、朋友、伴侣或任何其他外部第三方分享这个应用，但它本质上是一段通过你自己的日记提示进行的个人旅程。Waterbear的目标从一开始就极具远见，因为其领导团队没有发现其他任何竞争产品在用户体验中以个人仪表盘的形式利用NLP。这使其从竞争对手中脱颖而出，后者通常要么是简单的情绪追踪器，要么是心理健康网络和治疗师的连接器。为其用户带来整体体验意味着他们可以逐周、逐月或逐年追踪自己的进展。Waterbear的创始人认为，在市场上的心理健康与健康应用中，长期向健康进步、设定目标并实现成就的可持续性是严重缺失的。深度也缺乏。构建一个不仅捕捉情绪，还能捕捉广泛以人为中心的目标和追求的应用体验并不容易，但非常值得。\n\
  \n### 产品设计与战略\n\n对于Waterbear来说，“为什么用AI”这个问题很容易解决。你需要一个擅长处理非结构化、未标注文本数据的AI。虽然产品体验的某些方面能够与最终用户一起确立，但NLP算法在后台运行的最实质性工作围绕着目标设定、情绪分析和进度追踪展开。\n\
  \n\n\n\n这类工作需要人工智能，因为每个使用应用的人都各不相同。他们表达方式不同，同样的词对不同的人含义也不同，而对某些词的反应或情绪甚至每天都会变化。训练一个能够捕捉这种弹性，并能注意到日常波动和漂移的\
  \ AI 非常重要。通过他们的产品 Akeira，Waterbear 必须深入研究与特定女性群体相关的语言细微差别。在这种情况下，这些人群体不仅涉及年龄或种族背景，甚至还包括代际身份和亚文化。\n\
  \n因此，他们专注于为每位用户单独训练每个模型，并将合并后的数据用于总体趋势和洞察，而不用来影响模型性能。这意味着他们定制自己专有的预训练语言模型，并克隆这些模型，以便独立地针对来自每位最终用户的输入数据进行进一步训练。由于日记提示输入非常个性化，将训练过程保持在用户级别分开并优化，意味着他们可以在个性化仪表板中捕捉到这些细微差别。\n\
  \n## 思想领导力\n\n由于透明度、信任和真实性对 Waterbear 很重要，他们在产品策略上以真实性为导向。Akeira 产品团队公开谈论他们如何构建和训练模型，并与用户群体和在线社区分享这些信息。他们专注于草根营销活动，以最大化自然用户，并发现他们越能坦诚地分享自己的挑战，客户和最终用户就越信任他们。\n\
  \nAkeira 的 AI 产品经理在公司页面上维护了一个产品博客，经常讨论他们乐于与在线社区分享的重要产品决策，以便更广泛地展示他们的选择与决策。这实现了几个关键目标：扩大了反馈圈子，让困难且有时具有争议性的决策得到更多关注和讨论，为\
  \ Akeira 和 Waterbear 整体带来了品牌知名度，并且最重要的是，将公司定位为思想领袖。他们的 AI 产品经理经常在会议和行业活动中演讲，Akeira\
  \ 这种更广泛的曝光度也赢得了行业奖项和认可的关注。所有这些活动都带来了大量的入站线索和对他们工作的咨询。\n\n## 总结\n\n本章聚焦于 AI/ML 产品的市场、定位和常见用例。我们看到了\
  \ AI 如何针对特定领域和市场进行优化，以及在 AI 产品饱和度较高的各种垂直行业中 AI 通常如何被利用。通过这些用例，我们看到了公司如何利用 AI 来最大化利用他们拥有的数据。作为\
  \ AI/ML 产品经理，你不会在真空中构建你的 AI 原生产品。你会定期研究市场和竞争，以确保你带来的 AI 用例真正让你脱颖而出。\n\n在下一章中，我们将讨论有助于\
  \ AI 原生产品成功的设计原则和要素。\n\n## 参考文献\n\n- *AI 与 COVID-19 疫苗：Moderna 的 Dave Johnson*：https://sloanreview.mit.edu/audio/ai-and-the-covid-19-vaccine-modernas-dave-johnson/\n\
