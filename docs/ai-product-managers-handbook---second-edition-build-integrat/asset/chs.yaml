  \n\n\n\n### 加入我们的Discord\n\n与广大用户、AI专家和本书作者一起阅读本书。\n\n提出问题，为其他读者提供解决方案，通过“问我任何问题”活动与作者聊天，还有更多内容等你发现。\n\
  \n扫描二维码或访问以下链接加入社区。\n\nhttps://packt.link/aipm\n\n![](img/a0c9f9a2ba06a06d309ce21d890a47c6_89_0.png)\n\
  \n其思路是，你会在模型中多次运行这些步骤，直到对性能感到满意为止。还记得 *第1章* 中有监督学习和无监督学习的区别吗？由于MLP使用反向传播，通过调整权重来最小化错误率，因此MLP是一种有监督的深度学习算法——基于标签数据，它们能准确知道自己与正确结果之间的差距。这些算法也常用于与其他ANN集成，作为最后的优化阶段，因为它们在处理表格数据中的复杂非线性关系方面具有很强的能力。在业务用例中，它们最适合分类问题，如客户细分与个性化、欺诈检测、预测、预判和评分。\n\
  \n### 案例研究\n\n一家金融服务公司希望更新其信用评分系统，因为现有模型基于传统统计模型，正迅速过时。鉴于市场数据的涌入和复杂性，其旧系统已变得效率较低。该公司正在寻找一种更先进的模型，既能处理海量数据以及各种数据类型和来源，又能改进信用风险的预测。如果新模型能够降低违约率（首要目标）并提高优质客户的批准率（次要目标），那么这笔投资就是成功的。以下是AI产品经理团队在测试的深度学习模型中选择MLP的原因：\n\
  \n- MLP可以轻松集成到现有系统中，并能处理复杂、多样化的数据集。因此，这是一个实用的选择，因为它与公司现有基础设施顺利集成。\n- MLP擅长对特征之间的非线性交互进行建模，这使得它有助于捕捉信用风险的复杂性。\n\
  - 该公司拥有多样化的数据，包括交易历史、信用行为、人口统计数据以及附加的外部数据源，这意味着他们必须投资于一种能够优雅处理高维数据的深度学习模型。MLP在数据处理上表现出很强的通用性，并能有效识别高风险客户，从而实现了首要目标。\n\
  \n以下是其他经过测试但最终未被选中的深度学习模型列表：\n\n- CNN：由于公司的数据主要是表格数据，包括交易记录和信用评分，因此CNN并非很好的选择。\n\
  - RNN：这些模型更适合时间序列或序列数据，因此它们无法充分捕捉公司数据的复杂性。\n- 自动编码器：这些模型帮助公司识别高维数据中的相关特征，但最终，该模型更多是在指出关联性，而非对某人是否构成信用风险进行分类。不过，在最终确定使用MLP之前，用自动编码器进行实验还是很有用的。\n\
  \n部署了新的深度学习驱动系统后，该公司的违约率降低了18%，优质客户的批准率提高了10%。这意味着产品团队的首要目标和次要目标均已达成。\n\n## 径向基函数网络\n\
  \n径向基函数网络（RBFN）于1988年伴随着D.S. Broomhead和David Lowe的论文《多变量函数插值与自适应网络》而问世。RBFN与本章中将要介绍的大多数其他ANN不同，它们只有三层。大多数ANN（包括前面讨论的MLP）都有输入层和输出层，并在期间包含若干隐藏层，而RBFN只有一个隐藏层。另一个关键区别是，在RBFN中，输入层不是计算层，仅将数据传递到隐藏层，因此这种ANN速度极快。这些深度学习算法是前馈网络，因此计算实际上只经过两个层：隐藏层和输出层。\n\
  \n将这些网络看作类似于我们在前一章中讨论的KNN算法会很有帮助，该算法旨在根据目标值周围的数据点来预测数据点。原因是RBFN试图根据点之间的距离、半径或欧几里得距离来逼近值，并将数据以圆形或球形的形式聚集成簇，以便更好地理解复杂的多变量数据集，这与*第1章*中K-means聚类算法的做法相似。这是一种高度通用的算法，既可用于分类问题，也可用于回归问题，既支持有监督方式，也支持无监督方式。\n\
  \n## 自组织映射\n\n自组织映射（SOM）由Teuvo Kohonen在20世纪80年代提出，是另一种无监督竞争性学习ANN的示例，算法将多变量数据集降维为一张二维“地图”。每个节点都会与其他节点竞争，以确定是否应激活自身，因此它本质上就是一场大规模竞争，这就是它如何实现自组织的。然而，在结构上，SOM与大多数ANN非常不同。除输入层外，只有一个层或节点，称为Kohonen层。节点本身之间的连接方式也与更传统的ANN不同。\n\
  \nSOM的训练方式反映了我们大脑自组织并映射输入的能力。当我们感知到某些输入时，大脑会将这些输入组织到适合我们看到、听到、感觉、闻到或尝到的特定区域。SOM也会将数据点聚类到特定分组中。其实现方式是通过一个学习/训练过程：算法将数据通过输入层和权重发送出去，随机选择输入数据点与节点进行测试，直到根据节点与数据点之间的距离选出一个节点，然后更新该节点的权重。这一过程会重复进行，直到训练集完成并选出最优节点。\n\
  \nSOM也属于K-means或前面提到的RBFN这类聚类算法，它们都可用于在未标记或尚未发现的数据集中寻找关系和分组。\n\n与前面使用前馈函数的CNN示例不同，RNN以循环方式工作。数据不是从输入层通过隐藏层最终到达输出层，而是来回循环往复，这正是其短期记忆的保留方式。这意味着数据先经过输入层，然后在隐藏层中循环，最后才传递到输出层。务必注意，RNN只有短期记忆，因此才需要LSTM网络。下一节将详细介绍。\n\
  \n本质上，RNN实际上有两个输入：\n\n- 第一个是初始数据，它穿过神经网络。\n- 第二个其实是网络沿途获取的信息和上下文。\n\n这种工作流程也是它有效将自身权重调整为适应当前和先前输入的框架，因此它会在循环过程中不断修正方向。这种追溯调整权重以最小化错误率的过程称为反向传播，你会在*第1章（深度学习简史）*中回忆到，这是一项重大进步，帮助深度学习取得了如此大的成功。\n\
  \n可以这样想象：RNN实际上是一组神经网络，通过反向传播不断重新训练并优化准确性，因此它也被视为一种有监督学习算法。由于RNN是一种非常强大、稳健的深度学习算法，我们可以看到它被广泛应用于图像描述与理解、时间序列预测、自然语言处理和机器翻译等任务。\n\
  \nRNN擅长处理序列数据，并且非常重视上下文，因此特别适合时间序列数据、DNA和基因组数据、语音识别以及语音转文本等功能。\n\n### 长短期记忆网络\n\n\
  长短期记忆（LSTM）网络基本上就是具有更强记忆能力的RNN。通常，它们以LSTM网络群的形式出现，因为它们会将RNN层连接起来，从而能够跨滞后期或更长时间保留输入。与计算机非常相似，LSTM可以对其所拥有的记忆进行写入、读取或删除操作。因此，它们能够学习在一段时间内需要保留哪些数据。正如RNN不断调整权重并优化性能一样，LSTM也通过自身的权重为存储或删除的数据分配重要程度，从而实现同样的目标。\n\
  \nLSTM通过LSTM单元模仿我们自身随时间丢弃无关或琐碎信息的能力；这些单元可以让信息作为输入进入、被完全遗忘或排除，或者让其通过并影响输出。这些分类方式被称为门控，它们使LSTM能够通过反向传播进行学习。\n\
  \n\n\n\n\n由于其在不同应用和用例中的灵活性，生成式AI模型被用于从面部识别、数据增强与合成、异常检测、超分辨率成像与增强，以及内容创作（无论是视频、声音、图像还是文本）等方方面面。在接下来的章节中，我们将探讨当前广泛使用的几类主要生成式AI模型，以及它们的一些优势和缺点。\n\
  \n## 生成对抗网络\n\n生成对抗网络（GANs）是我最喜欢的ANN类型，因为它本质上由两个相互对抗的神经网络（生成器和判别器）组成，因此得名，它们竞争的目标是生成能够以假乱真的新数据。正是由于这种生成能力，GANs被用于图像、视频和语音生成。它们最初也用于无监督学习，因为其具备生成和自我调节能力，但它们同样可以用于监督学习和强化学习。它们的工作方式是：其中一个神经网络被称为生成器，另一个是判别器，两者在这一生成过程中相互竞争。\n\
  \nGANs首次发表于2014年Goodfellow等人的一篇突破性论文中，标题为*Generative adversarial networks*，文中指出GANs“同时训练两个模型：一个生成模型G，用于捕获数据分布；一个判别模型D，用于估计样本来自训练数据而非G的概率。G的训练过程是最大化D出错的概率。”\n\
  \n我们可以将判别模型和生成模型看作一枚硬币的两面。判别模型着眼于某类图像可能具有的特征，例如，寻找模型当前正在学习的所有狗的图像之间的关联。生成模型则从类别本身出发，向外扩展该类别在图像中可能具备的潜在特征。以“太空小猫”这一类别为例，生成模型可能会查看提供给它的示例数据，并推断出如果它要生成一张图像，就应该生成涉及太空和小猫的内容。随后，判别模型会接收生成模型创建的图像，并根据自身学习确认“太空小猫”类别中的任何图像都必须同时包含小猫和太空作为特征。\n\
  \n另一种解释方式是，生成模型将标签映射到潜在特征，而判别模型将特征映射到标签。对我们来说，GANs最有趣的地方在于，它们实际上是在通过自己版本的图灵测试——无论通过还是失败。你如何知道是否通过？如果GAN正确地将生成的图像识别为伪造图像，那么它算是通过（或未通过？）了自己的测试。这实际上取决于你如何看待这一通过或失败。如果它将伪造/生成的图像错误地标记为“真实”图像，则意味着生成模型相当强大，因为它自己的判别器未能正确判别。但反过来，由于这是一枚双面硬币，这也意味着判别器需要加强，以具备更强的辨别能力。GANs确实非常“元”。\n\
  \nGAN运行其过程的步骤如下：\n\n1. 首先，一个生成器神经网络接收数据并返回一张图像。\n2. 然后，该图像与来自真实世界数据集的其他图像一起被输入判别器。\n\
  3. 接着，判别器输出介于0和1之间的数值，作为其判别的每张图像的概率，其中0表示伪造，1表示真实的真实世界图像。\n4. GANs还使用反向传播，因此每次判别器做出错误判断时，GAN都会从之前的错误中学习，以修正其权重并优化准确性。\n\
  \n由于GANs的对抗性质，将两个神经网络相互对抗所产生的效果为我们提供了一种能够生成最逼真图像的工具。但GANs擅长的不仅仅是图像；它们也非常擅长生成合成数据。神经网络需要海量数据，因此创建合成数据往往是充分喂饱它们的最佳方式，但缺点是，如果生成的合成数据过多，模型会自我崩溃。GANs在图像转换方面也很出色，所以你经常会看到它们被用于从卫星图像生成地图，或用于允许你编辑艺术风格、在图像之间切换滤镜，甚至提升模糊图像分辨率的产品中。由于它们非常擅长生成多样化的输出，它们也被用于改进**自然语言处理**（NLP）。GANs的超能力在于，通过使用它们可以派生出多样化的图像、文本和视频。\n\
  \n![](img/a0c9f9a2ba06a06d309ce21d890a47c6_99_0.png)\n\n> 在深度学习的语境下，合成数据是指人工生成而非从真实世界事件和观察中收集的数据。它对于训练、验证和测试深度学习模型很有价值，尤其是在获取足够真实世界数据具有挑战性、耗时或成本高昂的情况下。\n\
  \n然而，如果GANs没有足够多样化的数据样本可供学习，它们也会像任何ANN一样受到影响。生成的图像往往存在缺陷，每当生成的图像给某人的手添加第六根手指时，你就能看到这些缺陷。这些模型试图根据给定的提示预测用户要求的输出，因此当输出过于残缺以至于不真实时，我们经常会看到生成图像或视频的局限性。它们也难以训练，且可能不稳定。在伦理方面，由于GANs常常如此专注于图像生成，并且其图像生成如此清晰，它们可能被那些试图通过宣传和虚假信息影响政治、经济、社会或文化格局的人用于恶意目的。\n\
  \n## 自编码器\n\n自编码器模型是我们将要介绍的最简单的生成式AI模型，因为它们主要存在是为了减少数据中的噪声，并学习如何重建所获数据中的基本模式。因此，它最常用于无监督学习任务，如数据压缩、去噪和特征提取，以识别数据样本中最重要的特征，这意味着它通常与其他模型一起作为更大模型流水线的一部分使用。让我们分解其层级结构：\n\
  \n- 自编码器的第一部分称为**编码器**。这部分模型有一个输入层，输入数据从这里流入。这些输入流经两个隐藏层，从而降低数据的维度。编码器阶段正是如其名称所示：将接收到的输入数据转换为代码，传递给第二部分。\n\
  \n![](img/a0c9f9a2ba06a06d309ce21d890a47c6_101_0.png)\n\n在OpenAI的Prafulla Dhariwal和Alex\
  \ Nichol撰写的一篇题为*Diffusion models beat GANs on image synthesis*的论文中，作者将许多优势归功于扩散模型，并让我们了解到它们如此成功的一个重要原因，他们表示：“GANs目前凭借FID、Inception\
  \ Score和Precision等样本质量指标，在大多数图像生成任务上保持着最先进的水平。然而，其中一些指标并未完全涵盖多样性，并且已经证明GANs捕获的多样性不如最先进的基于似然的模型（扩散模型）。此外，GANs通常难以训练，如果没有精心选择的超参数和正则化器，就会崩溃。虽然GANs保持最先进水平，但它们的缺点使其难以扩展并应用于新的领域。因此，人们已经做了大量工作，以实现具有GAN级样本质量的基于似然的模型。虽然这些模型捕获了更多多样性，并且通常比GANs更容易扩展和训练，但它们在视觉保真度方面仍有不足。此外，除了VAE之外，从这些模型中进行采样的墙钟时间比GANs更慢。”\n\
  \n我们在上述段落中看到了许多优势，涉及训练难度、输出多样性、模型崩溃和可扩展性。不过，他们接着说，尽管他们“相信扩散模型是生成建模的一个极具前景的方向，但它们在采样时仍然比GANs慢，因为需要使用多个去噪步骤。”取决于扩散模型的大小，速度将是一个问题，因为每个去噪步骤的训练时间可能比GANs长五到二十倍。\n\
  \n## Transformer模型\n\n虽然许多**大型语言模型**（LLMs）是使用其他ANN（如我们在本章前一节中提到的RNN和LSTM）创建的，但该领域的最新进展来自Transformer模型。Transformer已成为NLP领域的宠儿，很大程度上归功于它们出色的处理序列数据的能力。可以想象，一个能够整体理解上下文并回应用户提示的模型，在语言理解方面堪称重大突破。流行的Transformer模型包括Stable\
  \ Diffusion、GitHub的Copilot、Quora的Poe、微软的MS Copilot、Anthropic的Claude、谷歌的BERT、T5和Gemini模型，以及OpenAI的GPT模型。\n\
  \nTransformer于2017年首次由一组谷歌研究人员在一篇题为*Attention is all you need*的论文中提出，它使模型能够分析整段文本，而不是尝试按顺序理解文本。这意味着，Transformer模型不是逐个单词地理解，而是能够对整个提示进行更全局的理解。它通过为试图分析或生成的文本中的不同单词分配权重或不同级别的“注意力”来实现这一点。这是通过一种称为并行化的过程完成的。\n\
  \nTransformer模型的另一个重大进步是，与RNN或LSTM相比，它能够在海量数据集上进行训练，同时还能支持如此大量的参数。目前世界最先进的LLM——GPT-4由OpenAI所有，目前拥有1.8万亿个参数。你可以将参数视为模型从训练数据中学习到的单个“经验”或变量。请注意，这与超参数不同，超参数是机器学习工程师可以用来校准或微调模型的一组不同工具。\n\
  \n\n\n\n话虽如此，判定何为“伤害”或“AI系统”的标准一直在变化，而且将继续变化，正如我们在本书**第2章**中介绍当前的法规和立法运动时所看到的那样。公司、技术人员、领导者以及组织高管往往要等到伤害造成之后才会受到审查或问责。并非每个人都以道德指南针行事，许多人可能会支持建造他们明知会造成伤害的产品。许多人会主动选择视而不见。\n\
  \n如果你正在以某种可能对他人造成伤害的方式使用机器学习（ML）或深度学习（DL），如果存在明显的偏见，影响到代表性不足或少数群体（无论种族、性别还是文化），请回到构思阶段。无论这种伤害是直接的还是下游的，情况都是如此。这是机器学习对我们所有人构成的普遍风险：我们将社会偏见编码到AI中，却没有采取必要的预防措施来确保我们提供给算法的数据真正无偏。\n\
  \n构建人工神经网络（ANN）的工程师无法深入内部真正解释ANN是如何做出决策的。正如我们在前面（尽管是浅显的）关于深度学习算法的解释中所看到的，ANN结构建立在现有的机器学习算法之上并进行扩展，因此几乎任何人都无法真正解释这些网络是如何得出某些结论的。然而，欧盟提出的一些最令人鼓舞的立法——即**第2章**中讨论的《人工智能法案》——正是为了解决这个问题。该法案坚持要求公司不仅要证明其AI系统所构成的风险水平，还要以白皮书的形式证明其发现，明确阐述潜在危害，从而解决困扰深度学习模型的主要问题。更进一步，他们还希望提出要求，传达用于创建AI系统的训练方法，这可以在AI的发展过程中带来更大的信任和透明度。这对于推动AI监管和安全来说，是令人鼓舞的、积极的一步。\n\
  \n深度学习算法通常被称为黑盒，因为它们拒绝对其工作逻辑的基础进行真正深入的分析。所有深度技术模型都是如此，包括最流行、最有效的生成式AI模型。由于人工神经网络的性质和复杂性，深度学习天然具有不透明性。请记住，ANN实际上只是对影响其各层内每个神经元的权重进行微调。它们基本上是复杂的模式发现器，利用数学和统计来优化其权重系统。在多次训练迭代中，它们对每个数据点都要进行数百次这样的操作。我们根本没有足够的脑力或语言来解释这一点。\n\
  \n你也不必非得是DL工程师才能真正理解你的产品如何影响他人。如果你作为一名产品经理（PM），无法充分阐明DL在你的产品中是如何被使用的，而且至少无法证明你的DL产品输出不会对他人造成伤害，那么这可能不是一个你应该全力投入的产品。既然我们已经看到DL通过流行的生成式AI模型变得更加易用，我们也看到了DL的不透明性可能加剧，并在市场上引发更多不信任。虽然DL目前更容易获得，但它仍处于研究阶段，许多PM在将其纳入产品时应该谨慎，因为存在可解释性问题。我们敦促PM在尝试涉足DL时要谨慎。在对待像DL这样复杂且充满潜力的事物时，如果缺乏对同行和客户的管理意识和责任感，只会给世界增添更多混乱和伤害。\n\
  \nAI产品经理在确保其构建的AI系统在设计、部署和监控过程中充分考虑伦理方面发挥着关键作用。以下是一份最佳实践清单，旨在帮助AI产品经理检查是否已覆盖所有基本要点：\n\
  \n-   定期安排对AI系统的审计，通过解决训练数据集和模型预测中的偏差，确保某些群体不会受到歧视。像IBM的Fairness 360工具包和TensorFlow的“公平性指标”指南等工具可以提供帮助。\n\
  -   建立工具来跟踪预测和用户交互，以便在出现可能暗示伦理问题的异常模式时触发系统警报。\n-   为AI系统创建易于访问的文档，使用户/开发者能够提问或提出疑虑。\n\
  -   通过用户调查和反馈表主动征求反馈，以获取有关系统性能和伦理问题的信息。\n-   定期审查训练数据和模型输出，以确保公平性和包容性。\n-   在整个开发生命周期中记录伦理考量和决策，尤其是关键决策，并使用**可解释AI（XAI）**方法（如LIME或SHAP）来记录模型的可解释性和决策过程。DataCamp有一个很好的资源，可在此处找到：https://www.datacamp.com/tutorial/explainable-ai-understanding-and-trusting-machine-learning-models\n\
  -   与法律团队定期审查AI法规和立法变化，并在组织内设立AI伦理审查委员会，以展示对伦理问题的尽职调查。\n-   如果你的组织还没有跨职能的治理和伦理委员会，请帮助组建一个，确保领导层、技术和法律利益相关者都有代表，以便你们可以共同讨论战略决策。\n\
  -   从一开始就将伦理原则嵌入设计过程，确保**公平性、问责制和透明度（FAT）**在你的产品团队或组织内始终保持不变。采用IEEE或OECD等伦理框架，这些框架概述了负责任的AI开发。\n\
  \n我们是否总是必须如此谨慎？未必。如果DL应用在通过检测癌症拯救生命方面变得非常出色，或者在应用于机器人技术时效果更好，我们岂能阻碍进步？然而，DL模型的医疗应用在准确性和安全标准方面受到严格审查。随着时间的推移，我们将看到对AI系统的法律、立法和监管监督只会越来越多，而不是更少。与传统ML模型相比，DL模型的复杂性和深度使得追踪某些决策或预测是如何做出的变得困难。如果你是一名AI产品经理，你必须帮助组织准备好应对这种模糊性。\n\
  \n-   *通过反向传播误差来学习表征*：https://www.iro.umontreal.ca/~vincent/ift3395/lectures/backprop_old.pdf\n\
  -   *变分问题的数值解*：https://www.sciencedirect.com/science/article/pii/002247X62900045\n\
  -   *感知机：一种感知和识别自动机*：https://websites.umass.edu/brain-wars/1957-the-birth-of-cognitive-science/the-perceptron-a-perceiving-and-recognizing-automaton/\n\
  -   *神经活动中内在思想的逻辑演算*：https://www.cs.cmu.edu/~epxing/Class/10715/reading/McCulloch.and.Pitts.pdf\n\
  -   *AI教育*：https://aiindex.stanford.edu/wp-content/uploads/2021/03/2021-AI-Index-Report_Chapter-4.pdf\n\
  -   *扩散模型在图像合成上胜过GANs*：https://arxiv.org/abs/2105.05233\n-   *注意力就是你所需要的一切*：https://arxiv.org/pdf/1706.03762\n\
