- '# Managing the Evolving AI Product


  在本书第 2 部分中，我们介绍了与 AI 原生产品上市相关的方面，以及从产品设计和产品管理角度来看，新产品进入市场的复杂性。在第 3 部分中，我们涵盖了相同的主题。只是这里是通过从传统软件产品向
  AI 产品过渡的视角。本章旨在总结我们在第 3 部分中已经讨论过的元素，重点关注管理演进 AI 产品的日常体验。我们将涵盖演进 AI 产品产品管理的各个领域，以及将现有软件产品转变为已具备以下条件的产品所涉及的考虑因素：


  - 已建立的客户群

  - 支持其开发的内部团队

  - 已建立的运营基础设施

  - 目前支持现有产品成功的友好市场


  这与我们在第 2 部分中看到的考虑因素有所不同，第 2 部分并未围绕上述重点领域建立文化和标准流程。这说明了为什么 AI 转型对公司来说很难做好。好吧，在新市场推出新产品具有挑战性。当然，当你在新市场推出新产品时，有很多需要做对的考虑。然而，用
  AI 功能和能力重新推出现有产品带来了独特的挑战，因为你已经为传统软件产品的现有版本建立了基础设施、文化规范和标准程序。


  当你进行 AI 转型并使现有产品拥抱 AI 时，许多事情都需要改变。首先，产品愿景、战略和路线图都必须重新构想，以适应向 AI 产品的过渡。这意味着，除了在市场上推出产品并确保其商业成功之外，你还在与内部以前的做法惯性作斗争。当你原生构建
  AI 时，你不必担心这个问题；那里的一切都是新的。然而，当你重新推出现有产品时，情况并非如此。


  - 运营能力

  - 满足客户期望


  当你用新的 AI 能力和功能重新推出现有产品时，这些是你将重新审视的领域。正如我们之前提到的，在产品演进时重新审视产品愿景和目标很重要，因为你希望确保你构建的原因没有改变。AI
  转型涉及很多因素。也许是市场影响促使了演进。也许你的 CEO 在 AI 大会上受到了启发。也许你的客户要求某些效率或自动化。产品经理必须认识到，整合 AI 可能会如此彻底地改变产品体验，以至于它应该被视为一个全新的产品。完全有可能，你的传统产品所解决的问题在整合
  AI 后会消失。定义 AI 转型的目的、AI 如何解决原始产品中的差距，以及这种转型如何与公司的愿景和目标保持一致，都将是产品组织需要主导的重要对话。


  当你已经拥有人们熟悉并使用的成熟产品时，你冒着以威胁你已经建立的成功的新改进产品进入市场的风险。新版本可能不值得炒作。它可能会给你的产品体验带来新的问题，让用户感到不快。你面临着新的挑战：将演进的产品定位为满足你不断发展的市场和用户群需求的最佳解决方案。很有可能，如果你考虑将
  AI 添加到现有产品中，你的竞争对手也在考虑。这意味着现在，你的市场可能有很多新的改进的 AI 驱动竞争产品可供选择。所有竞争对手以一种或另一种方式相互影响，因此新创新会导致格局发生变化。你的客户和用户通过重新审视和完善他们对可供选择的产品的期望来回应这些新选择。


  即使在内部，不同工作岗位的员工可能对 AI 转化对他们支持的产品意味着什么以及它将如何最终改善客户和用户的生活有不同的期望。因此，保持一致性的工作实际上是确保每个人都支持你重新推出的产品的新的价值主张。战略一致性将深刻影响市场如何接受你的
  AI 演进产品。反过来，接受、采用以及满足和超出期望将导致新 AI 演进产品的长期成功。


  管理一致性的持续工作是 AI 产品经理工作的核心，因为在这个角色中，你不断关注你的竞争格局以及你的产品在该格局中的地位。你的工作是了解 AI 技术如何增强你的产品体验，以及如何最好地向内部和外部利益相关者传达这种优势。在第
  15 章中，我们讨论了回到起点的概念；即设计一种新的产品体验，对你的产品体验提出重大改进，以增加它成为你市场中强大参与者的机会。


  以下是推荐的反馈循环和最佳实践列表，以确保你持续保持适当的产品一致性：


  - **User feedback:** 无论你是通过持续的正式 **user experience (UX)** 研究调查和用户访谈，还是非正式的应用程序内调查和民意调查来实现这一目标，你的目标都是收集用户对你添加的
  AI 功能及其有效性的意见，并以有意义的方式分析这些发现。找到以小方式纳入反馈的方法，例如在平台中直接对功能进行评分或以最少的按键报告问题，也有助于作为早期信号和脉搏检查，了解你的新功能如何被用户接受。将你的用户反馈数据视为冰山一角。用户可能没有确切的词语来表达他们真正需要和感受的东西。因此，当你确实收到任何反馈时，要知道能够传达任何内容都是重要的。

  - **Analytics:** 如果你能设置产品分析来了解用户在应用程序中的行为，你就可以在不必直接与用户互动的情况下做出判断。这不应取代直接的用户反馈，但应作为补充的反馈机制。如果你的分析可以证实直接来自用户的故事，你就有可以依靠多年的证据。监控行为分析和功能采用率将使你能够看到哪些
  AI 功能受到欢迎，哪些被忽略，以便你以后做出更明智的决策。分析帮助你了解哪些功能和能力真正被最重视，因为它们基于应用程序中的实际行为。

  - **Support data:** 特别是在发布后初期，你应重点关注投诉和问题被上报到支持的情况。客户服务互动和支持票据显示了你的产品体验最令人困惑的地方。如果用户花时间写票据或致电你的客户服务号码，这就很说明问题。作为用户，我个人会避免在不需要时与任何人交谈。面对产品中的缺点和局限性是不愉快的，但越早发现它们，就越早可以限制
  AI 功能出错的风险。作为 AI 产品经理，你不会负责回复支持票据，但你应该对了解用户持续抱怨最多的哪些问题感兴趣。分析支持票据和客户服务互动的内容是找到因 AI
  转化而引入到产品体验中的常见问题和担忧的好方法。这随后给你一个机会通过营销资料、思想文章，或至少更新产品的常见问题解答或知识库来解决这些问题。

  - **Competitive feedback:** 了解你的行业如何随着 AI 发展对保持市场一致性很重要。定期进行市场研究以了解竞争对手为其产品添加了哪些功能。确保你的持续
  AI 功能具有竞争力和相关性。这并不意味着你必须做竞争对手正在做的事情。这意味着你了解他们的行动如何与你的行动竞争。如果你能通过使用基准标准将你的产品的 AI
  功能和性能与竞争格局中的其他产品进行定位，那就更好了。





  AI和数据素养在很大程度上能够消除人们对AI以及岗位被取代的恐惧，因为随着时间的推移，他们会遇到越来越多由AI驱动的产品。他们也会开始将更多AI产品融入自己的工作流程，无论你在自己的产品中添加了哪些AI功能。因为AI转型终将影响大多数产品，你永远不知道新功能的想法可能来自何方。帮助弥合AI素养方面的差距，也有助于提升其他领域的素养，比如认识到数据质量的重要性。


  应当将向AI转型和采用AI的举措在内部和外部都传达为一个机遇，因为它确实是。对外，它代表你的产品在为用户和市场服务方面所能实现的演进。对内，它代表内部团队成长以适应新产品的机会。这将产生大多数人还无法预见的连锁反应，因此最好将重点放在积极方面，尽可能减少负面影响。是的，AI转型是一项艰巨的任务，需要在文化上和功能上成功实施，需要投入大量时间和精力。但是，越是能带着愉悦和安全感去推进，整个组织就越能从中受益。以下是一系列最佳实践和建议，帮助你与你最宝贵的资源——那些构建和支持你产品的人——一同最好地应对AI转型：


  - 围绕AI素养构建文化战略，从一次AI全员大会开始，以了解内部利益相关者可能如何受到AI及其所代表的含义的威胁。主题可以包括AI对公司意味着什么、他们计划如何与之协作，以及AI可能如何改造公司现有产品的兴趣领域。

  - 然后，围绕这些问题和关切举办一系列AI工作坊和培训。这旨在象征一种拥抱AI的文化转变，因此这些会议应由多位领导者主持。沟通和推广AI的重任绝不应只落在AI产品经理一个人身上。

  - 确保团队拥有一份外部资源清单，以便他们在此基础上进一步提升自己的知识。

  - 创建一个流程，让利益相关者能够表达他们对拓展技能或岗位职责以向AI方向发展的兴趣。

  - 识别技能差距，以了解哪些团队的哪些角色需要AI技能，并实施培训计划以帮助他们达到要求。

  - 让团队了解偏见、漂移和公平性对AI和机器学习的影响，以便公司中每个人都能为合乎道德的AI产品做出贡献。

  - 对团队开展AI系统安全以及针对AI模型的潜在对抗性攻击形式的教育。


  产品经理的人员管理方面可能并不存在一条固定的分界线。许多产品经理在组织中是独立贡献者。然而，在文化层面，你将充当AI及其如何影响产品的核心纽带；所以，无论你是否愿意，你都将是组织中许多人的AI向导。部分原因是，很多关于当前进展的沟通都会落在你身上。但也许更重要的是：你身边有越多了解AI转型是什么以及它对他们的工作意味着什么的人，你的处境就越好。这将确保你始终保持正确的视角，并且在下游执行AI驱动的路线图时，更容易应对各种高潮与低谷。


  因为你在支持现有产品的演进，这意味着你也需要围绕已经存在的基础设施来创建AI系统。这意味着一个独特的挑战将是理解如何将你的AI系统集成到你目前已经构建的现有软件、基础设施、工具和数据管道中。要让新功能与现有系统找到兼容性，同时避免或限制对现有产品体验的干扰，这也会成为AI产品经理（将传统软件产品演进为AI产品）的挑战。从技术角度重新设计你的产品以支持AI系统，将带来新的工作流程和自动化，以帮助你管理该系统，或者至少为那些从事产品工作的人腾出尽可能多的时间来处理最重要的事情。你需要考虑培训团队成员使用这些新工作流程。至少，他们需要接受协作工具的培训，以帮助大家管理需要完成的工作。从技术角度讲，要支持一款传统软件产品向AI产品演进的持续工作，涉及许多方面。


  这项工作需要与工程部门紧密合作。在任何公司，AI产品经理都不会单独负责这项工作，因为这超出了该角色的职责范围。然而，AI产品经理需要意识到这项工作必须完成，并应尽自己的一份力量，影响和鼓励这项工作取得进展。虽然最终所有这些工作都将由工程师来完成，但AI产品经理需要提出要解决的问题以及需要完成工作的优先级。AI产品经理将组织并把结果呈现给所有相关的利益相关者和领导层。以下是一些最佳实践，可以用来更好地让你的组织为建立AI系统所需的数据和基础设施需求做好准备：


  - 进行现状分析，了解当前既定基础设施的限制和能力。初始阶段需要改动越少越好。尽可能提高效率。

  - 测试当前基础设施的可扩展性，特别是支持你提议的AI功能所需的计算和存储需求。

  - 盘点当前的数据源、数据表、数据转换和管道。

  - 收集你提议的AI功能将产生的要求或数据需求，并确认你拥有支持这些功能需求所需的所有数据。如果存在数据缺口，制定填补缺口的计划。

  - 尽可能利用可调整、灵活的云服务。大多数云服务按实际使用量收费，这在早期有助于应对存储、AI微服务和处理能力需求的波动。

  - 构建健壮的数据管道，用于数据收集、处理、存储和挖掘。


  尽早周密地考虑数据和基础设施需求，将让你能够更好地预见并持续满足AI系统未来的需求。记住，你总在做增量改进。维护你的产品和驱动它的AI系统将是一项持续的工作。尤其是在扩展时，你将进行必要的改进，以确保产品按预期运行。接下来，我们将探讨维护工作的各个方面，这些工作将补充你目前管理传统软件产品所做的工作。


  - 将AI集成到他们现有的项目管理产品中，意味着冲刺周期必须更新。仅将产品开发拆分为 ProjectABZ 各个产品领域的 Epic 已经不够了；他们现在还必须加入围绕数据收集、模型训练和模型迭代等领域的新的
  Epic。即使在发布后，这些 Epic 也不是一成不变的，因为AI产品管理工作是持续迭代的。


  重新发布之前，ProjectABZ 是一台运转良好的机器。它已经在市场上发布了至少九年，是一个成熟的产品，不需要像其新近演进的AI驱动版本那样需要同等程度的监督。正因如此，他们从三周冲刺改为每周冲刺，以涵盖重新发布过程中持续进行的各项工作。更频繁的冲刺也使他们能够快速响应不断演进的AI组件，以及将其集成到现有系统时出现的挑战。


  - 重新发布的最后一个重大变化围绕他们正在纳入的用户反馈。在集成AI之前，ProjectABZ 产品团队自九年前最初发布以来，一直能够自然地获得用户反馈。他们有合作伙伴、用户访谈和重要客户，这些都能持续提供反馈，而他们的方法不那么系统化。然而，对于这次重新发布，他们不能冒这个险；风险太高了。


  ProjectABZ 的产品团队知道，他们必须重新将精力集中于从调查、测试版用户和深度用户访谈中获取反馈。他们还增加了对用户体验研究的关注，以管理持续、定期分析从这些群体获得的反馈。随后，这些反馈经常与内部利益相关者和团队讨论，以进一步完善AI算法，并在发布后改善用户体验。


  ## 管理层对齐


  在完成 ProjectABZ 的工作（在第15章的案例研究部分概述）后，产品团队得以与领导团队合作，更新了 ProjectABZ 的战略愿景，强化了其作为AI项目管理工具的市场地位。他们更新了产品路线图，以反映在设计研究阶段商定的新AI功能、能力、增强和集成。通过深入的产品战略会议，探讨了演进后的
  ProjectABZ 产品体验如何体现公司的总体业务目标和价值观，从而实现了战略对齐。这些会议由AI产品经理主持，并纳入了大量市场研究和分析，这些研究和分析是当初证明集成AI合理性的依据。





  他们还纳入了大量客户反馈和研究，以了解产品在哪些方面已无法满足预期。这形成了一个反馈循环，也增强了他们的运营准备度和 AI 集成能力。通过将产品体验中当下的差距定位为
  AI 集成的机会，产品团队得以强化 ProjectABZ 的 AI 转型，使其成为一项具有战略相关性的事业。他们花费了大量时间通过营销活动来构建市场定位，这些活动以一种使其与市场中的竞争对手区别开来的方式强调了新的
  AI 能力。他们还确保这些对外沟通内容被内部利益相关者团队充分理解，以确保向外界传达的内容也在组织内部得到内化。他们将沟通重点放在新的价值主张上：新的 AI 功能将如何减少项目延误并影响用户的工作效率。


  ## 人才协同


  ABCDZCo 已意识到技能差距和 AI 素养要求，他们需要为此投资，以确保整个组织为重新发布做好准备。这意味着他们制定了一套全面的培训计划，帮助现有员工提升技能，更好地理解
  AI 和机器学习的需求和要求。他们聘请外部人才从事应用 AI 工作，如模型开发和研究。然而，他们认识到仍需加强组织整体对 AI 采用的准备度。


  ABCDZCo 还理解，他们首次涉足 AI 是聚焦于产品 ProjectABZ，但他们还销售其他产品。ProjectABZ 充当了 AI 进化的首个用例。因此，他们愿意试点再培训计划，因为他们知道可以通过优先投资于人才的工作来留住和提升人才。他们看到
  AI 集成将导致文化转变，并希望通过直面问题来抢占 AI 导致失业的恐慌，强化没有人会失业的信息。如果有的话，他们将获得 AI 生产力提升和新技能升级的好处。


  仅是 AI 的概念就在 ABCDZCo 内部引发了一场文化革命，与 ProjectABZ 产品团队无关，在 ABCDZCo 内部形成并培育了一种持续学习和创新的文化。这也使其在人才吸引力方面变得更具吸引力。培训和研讨会被开发出来，涵盖应用
  AI 基础、AI 伦理和偏见缓解，以及针对营销、销售和运营的专题研讨会。


  最后，AI 重新发布实际上导致了公司范围内的跨学科、跨职能协作增加。由于 AI 带来的协作需求增加，产生了额外的好处，打破了 AI 之前开发团队与运营团队之间存在的壁垒。由于许多人都在提升技能并更多地协作，这意味着知识共享会议对
  ProjectABZ 产品团队以及支持 ABCDZCo 其他产品的团队变得更加常见。AI 创新、突破、发展和最佳实践在利益相关者团队之间被常规分享。


  ## 运营协同


  从运营角度来看，ABCDZCo 公司层面的领导者和 ProjectABZ 产品层面的领导者都理解，AI 重新发布意味着重大的财务投入。计算资源、云服务、AI 处理硬件以及增加的
  AI 专注人力都增加了维护试点 AI 计划的成本。然而，为 ProjectABZ 建立适当的支持基础设施意味着 ABCDZCo 随后可以使用同一基础设施来支持他们在
  ProjectABZ 规模扩大并提高利润率时扩展的其他产品。数据管道也必须更新和优化，以确保高质量、干净的数据流能够为其 AI 模型提供数据。


  从维护角度来看，必须创建新的工作流程来处理为模型提供数据的新的数据供应。AI 模型训练、验证、部署和持续监控必须拥有各自建立的工作流程。团队还必须构建自动化来处理重复性任务，并设置标志和日志来监督为支持和监控新的
  AI 计划而必须创建的所有新工作流程和活动，特别是与 AI 模型性能、异常检测和故障排除相关的内容。这意味着必须有定期使用最新、更新数据的模型再训练计划，以及加强和保护其数据和
  AI 模型免受入侵和对抗性攻击的安全协议。


  ## 结果与成果


  重新发布九个月后，这导致 ProjectABZ 取得了以下产品成果：


  - **效率提升：** 演进后的产品导致项目延误减少 43%，任务管理更高效。自动化的资源分配帮助项目团队做出更明智的决策，项目成功率提升 18%。

  - **用户体验提升：** 产品内摘要反映出与产品原版相比，用户满意度水平提升了 36%，围绕新 AI 功能的积极反馈，用户认为它们智能、直观且在帮助他们工作方面很有价值。新的聊天机器人功能还帮助用户将平台上的管理时间减少了惊人的
  63%。

  - **差异化提升：** ProjectABZ 在市场上获得了竞争优势，新的功能帮助吸引了此前流失到其他竞争对手的客户。他们能够重新吸引过去三年中 22% 的流失客户。重新发布还帮助
  ABCDZCo 重新品牌定位为面向未来、具有前瞻性的公司。ABCDZCo 因其处理 AI 产品集成带来的文化影响方式，员工流失率也减少了 45%。

