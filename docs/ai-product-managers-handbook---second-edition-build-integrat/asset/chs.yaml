  \ AI/ML PM，请确保您与客户成功团队保持温暖开放的关系，因为他们是您在第一线最大的知识来源。他们是真正与您的客户交谈的人！\n\n## 营销/销售/面向市场团队\n\
  \n这另一个很可能在您产品开发之旅的开始和整个过程中参与的团队。我们将销售和营销归为面向市场，因为这本质上就是此功能所做的。它向您的市场传达信息：您潜在客户的整个格局。在这里，您将结合您的技能组合来优化您的产品语言契合度或市场将看到的关于您产品的消息。您将使用您的面向市场会议来决定以下事项：\n\
  \n- 关于您产品的术语\n- 您将在市场上如何定位它\n- 您将允许您的销售团队在演示中与潜在客户讨论多少专有技术和算法魔法\n- 您将提供多少可解释性\n\
  - 您将如何传达您对产品做出的技术决策\n- 出于竞争精神，您将从世界上屏蔽多少关于您产品的信息\n\n随着您构建和改进产品，您的面向市场团队将与您同在，您将定期讨论如何传达即将推出的功能或版本的信息。\n\
  \n| 质量保证 QA 工程师 | 确保 AI 功能在功能、可靠性和性能方面经过测试，减少部署后问题。 | 工程 |\n| 云架构师 | 帮助扩展 AI 基础设施，优化云资源使用并处理大规模部署策略。\
  \ | 工程 |\n| 业务分析师 | 将业务需求转化为技术需求，提供额外的清晰度和利益相关者一致性。 | 分析 |\n| 伦理与合规官 | 评估模型在伦理考虑、偏见和监管合规方面的情况。\
  \ | 法律/合规 |\n\n表 6.1：关键和非关键角色\n\n现在您熟悉了梦想团队可能的样子，让我们来看下一个关键组成部分——您的技术栈。\n\n## 投资您的技术栈\n\
  \n了解将为您提供最大灵活性的技术栈和语言，是开始您的技术栈之旅最重要的部分。作为 PM，您会定期思考构建某物的价值与构建它所需的成本或工作量之间的关系。这就是为什么您不能忽视您的技术栈。可能很诱人将它留给\
  \ CTO 决定投资哪个技术栈，但如果此技术栈以任何方式直接涉及您产品的构建，就不是那么容易外包。赋能您的利益相关者会影响您 AI 产品的工作量和成本，因此您希望确保参与这些关键决策的制定。\n\
  \n您还希望通过培养对技术栈何时对您的产品构成限制的理解，与您的技术 counterparts 建立信任。如果您需要为增加复杂性以实现产品成功或客户获取而提出案例，应该由您提出。您将与您的数据科学和数据工程团队密切合作，创建适当的渠道，以可靠的方式将相关数据传递到您的模型中，以便参与构建您产品的其他利益相关者可以信任现有的基础设施。以下是您作为\
  \ AI PM 应该牢记的一些关键因素：\n\n- 技术栈中最大的考虑是关注适当设置您的基础设施，以处理随着业务增长您的数据规模。构建能够处理数据清洗、存储、安全、准备和监控的正确技术栈，将是支持您的\
  \ AI 项目或产品团队的基础。这与构建您的数据战略密不可分。\n- 除此之外，您将寻求为 AI 项目中的许多角色创造协作环境，以便参与其中。在分析师、数据科学家、ML\
  \ 工程师、更广泛的工程团队以及您纳入 AI 团队组建的任何领导者和顾问之间，您希望为所有这些不同成员创建沟通和协作的渠道。\n\n\n\n\n- 与许多 AI\
  \ 程序一样，你也会寻找自动化流程和工作流的方法。AI/ML 技术在不断变化和改进，因此当你投资将自动化应用于 AI 程序本身时，你会获得很大的进展。利用你才华横溢员工的智慧来做更高层次的决策，并运用他们解决复杂问题的能力。任何可以自动化、刷新或标准化的事情都应该这样做。这与敏捷和精益开发的原则一致。重构代码和进行优雅的改进应该主动进行，因此请确保负责任地将其规划到你的迭代中，并利用你的技术栈优势来帮助团队取得成功。\n\
  \n尽管团队会使用 R、Java 和 C++ 进行机器学习，但 Python 是目前用于机器学习应用最广泛的编程语言。主要原因之一是它是一种相对简单的语言，拥有丰富的库和工具来帮助机器学习和数据分析。Python\
  \ 还有像 pandas 和 NumPy 这样的库，用于数据处理和操作等任务，以及像 Matplotlib 和 Seaborn 这样的数据可视化库。还有其他流行的机器学习库，如\
  \ TensorFlow、PyTorch、scikit-learn 和 Keras，可进一步扩展你的机器学习模型。由于 Python 被如此广泛地使用，如果 AI\
  \ 产品经理要在私营部门工作，他们应该对它相对熟悉。\n\n管理机器学习实验本身就是一项艰巨的任务，我们已经看到诸如 MLflow、Weights & Biases\
  \ 和 Neptune.ai 等工具用于管理版本和实验。你还可以使用 Cloudera Data Science Workbench、Seldon、Dataiku、DataRobot、Domino、TensorFlow\
  \ Extended、Kubeflow 和 SageMaker 等工具，为你的数据科学家提供一个工作站，用于构建、实验、部署和训练机器学习模型。让我们看看一些对完整模型管理最有用的工具，这涉及很多方面：\n\
  \n- 在生产环境中使用机器学习时，你需要跟踪每个模型的版本，以及该模型的代码、元数据和配置。\n  **工具：** MLflow、Data Version Control（DVC）和\
  \ Weights & Biases（W&B）。\n\n- 你还需要将每个训练好的模型打包到某个可部署的容器中，以便在准备好将特定模型部署到生产环境时使用。\n\
  \  **工具：** Docker、TensorFlow Serving 和 Seldon。\n\n- 由于你经常处理大量不同的模型，你需要将所有版本存储在某种中央存储库中，以便轻松检索不同的版本。\n\
  \  **工具：** Model Registry（MLflow）和 Amazon SageMaker Model Registry。\n\n- 根据你使用的模型以及每个模型的需求，你需要一种更自动化的方式，用新数据重新训练你保存的模型。\n\
  \  **工具：** Kubeflow、Airflow 和 Tecton。\n\n## 将 AI 驱动的输出产品化——AI 产品管理的不同之处\n\n在本节中，我们将探讨传统产品与\
  \ AI/ML 产品在产品管理上的差异。乍一看，AI/ML 产品似乎与传统产品没有太大区别。我们仍然在创建价值、用途、性能和功能方面的基线，并尽可能优化该基线。这对每个产品以及更广泛的产品管理实践都是如此，并且不会因为我们的产品使用\
  \ AI 而改变。\n\nAI 产品真正的区别在于，你本质上是在将一个服务产品化。请想一想。为了让 AI 发挥作用，它必须从你（或你的客户）的数据中学习。不同的模型可能在不同类型的数据上表现更好。不同的数据集对你的模型会需要不同的超参数。这就是\
  \ AI/ML 的本质。在某种程度上，这意味着你可能会发现自己的产品构建和结构方式甚至可能因客户而异，尤其是在初期客户很少的时候。\n\n这实际上意味着你要了解所有客户如何从你为他们提供的\
  \ AI/ML 服务中受益，并建立一个标准流程来重现该过程，以便所有客户都能获得最大收益。将服务产品化的一般建议是首先找到一个利基市场或特定的客户群。我们在本章前面介绍了\
  \ UI/UX 设计师/研究员角色；这些人将帮助你充分利用你的客户群及其偏好。如果你能理解 AI 如何通过你的产品最大程度地帮助客户，并且能够专注于对客户成功至关重要的价值，那么你就迈出了产品化的第一步。\n\
  \n然后，主要焦点将是如何最好地构建你的产品和内部流程，这样你就不必在每位客户身上从头开始。起初这将是探索性的。也许某些模型在某些客户的数据上比其他模型效果更好。也许有些特定用例直到某位客户提出需求才出现。产品化的基本理念是找到有价值的东西，并通过头脑风暴来了解还可以在哪些地方利用之前的项目、成果或流程，以造福所有人。不浪费，则不匮乏。如果你能为了所有客户的利益而循环利用某些东西，这将增加产品的成功以及产品所获得的集体喜爱。\n\
  \n将服务产品化在咨询领域是一个熟悉的概念，咨询顾问们一个项目接一个项目地工作，往往不得不几乎从零开始与客户建立新的合作。但鉴于我们的大脑是模式检测机器，最终我们会开始看到类似的请求或类似的用例出现。为特定类型的客户、垂直领域、画像或用例创建可重复的流程，正是产品化的精髓。这正是我们在\
  \ AI/ML 产品上所做的。这也是一种更好地预测客户为何以及如何专门来找你和你的产品的方式，这样你就知道如何分享与客户直接相关的成功案例和案例研究。产品化的行为也将极大地赋能你的营销、销售、客户成功以及更广泛的\
  \ GTM 团队。\n\n在许多方面，“产品化”机器学习的工作发生在工程团队内部，他们负责构建应用程序来管理数据科学和机器学习工程师为工程师提供的模型。无论你是否在构建\
  \ AI 产品，你都需要工程师和开发人员；这些建设者将伟大的想法、愿景甚至路线图转化为你可以体验到的切实产品。他们还负责确保整个产品能够扩展、足够健壮以承受各种用户行为，并确保产品与各种平台和技术兼容。\n\
  \n正如我们在本节中所看到的，AI/ML 产品整合关乎在模型输出与这些输出试图服务的用例或群体之间找到平衡。许多产品经理在构建 AI/ML 产品的经验中发现，他们可能需要针对特定群体定制自己的产品。因此，接下来，让我们探讨一下\
  \ AI 定制的需求（如果出现的话）。\n\n## AI 定制\n\n通过产品化的行为，你可能会开始为产品创建分组或群体。你可能会发现某些模型最适合某些类型的客户，并围绕这一点构建结构。将你的产品提供分组为用例，并以不同或最优的方式与这些群体沟通，这是在从产品化中获得的智慧的基础上建立的。更进一步，你会自然而然地开始进行垂直化。\n\
  \n了解商业模式、垂直领域和特殊客户群体的各种考虑因素，将是你产品进入市场方式的重要组成部分。例如，如果你支持的是 B2C 或消费型产品，你会希望在信息收集方面投入更多，在构思阶段获取更多终端用户的直接反馈。因为你要创建的产品可能会被数百万用户使用，你需要牢牢把握这些终端用户的偏好和期望，以便让产品最大程度地符合客户的声音。这类产品还可以受益于快速实验和迭代，这样你就可以在产品推出后开始收集反馈，甚至在\
  \ AI/ML 模型本身达到你期望的性能水平之前。\n\n如果你支持 B2B 或面向企业的应用程序，你可能会在产品构思和部署上花更多时间，以便专注于你希望争取到的特定客户群体。对于商业应用程序，你可能会创建一个非常复杂的产品，它执行许多重叠的操作，但面向的是非常小众的用户群体。你还可能拥有各种文档完备的工具，为客户提供类似的解决方案，因此保持与市场的功能对等可能是这类产品更需要考虑的因素。\n\
  \n你的企业规模也会影响你作为 AI 产品经理在组织中的角色定位。例如，如果你的组织足够大，可能会为前面提到的产品周期的每个阶段分配一个独立的产品经理。也可能有多个产品经理支持\
  \ AI 产品功能的不同方面。还可能有一个产品经理专门负责产品的 AI 功能，并由更高级别的产品经理或产品总监监督整个产品组合。在较小的组织中，可能只有一个 AI\
  \ 产品经理在产品生命周期的所有阶段监督整个产品，或者进行构思以持续维护该产品。\n\n\n\n公司规模的另一个差异在于**数据**本身。根据公司规模的大小，获取数据的难易程度或数据质量会有所不同。作为产品经理，让数据可用并处于可用状态可能比在初创公司更困难，也会占用更多时间，因为你需要访问需要管理治理权限的孤立数据组。甚至让这些数据整合在一起也可能很困难，这取决于每个数据孤岛的约定。相反，初创公司可能连积累足够用户都很困难，还会遇到数据量的问题。数据可用性和质量对大公司和小公司来说都是公认的难题。\n\
  \n如果你的产品是**高度垂直化的**，这也会影响你作为AI产品经理的工作表现。例如，一个专门面向医疗保健、金融科技或教育领域的产品，可能需要一位对这些不同垂直领域具备领域知识和专业技能的产品经理。即使同一位产品经理为这些垂直领域维护同一产品，你也可能会看到产品的三个不同版本，因为这些特定垂直领域的权重、阈值和性能指标很可能大相径庭。根据你所提供的产品类型，你甚至可能会看到一种超专业化现象，产品甚至为每一位客户都进行了大幅定制！高度定制化的机器学习产品必须适配客户的数据，就可能出现这种情况。\n\
  \n归根结底，为特定受众构建和打磨产品，其核心在于创造一款畅销的产品。我们需要了解我们的受众——产品的购买者和使用者——才能打造出真正为他们服务的东西。在下一节中，我们将讨论销售的概念，以及从产品管理的角度来看这意味着什么。\n\
  \n## 销售AI——产品管理是更高阶的销售\n\n在AI产品管理中，销售体现在多个方面。传统意义上的销售是：创造一款市场愿意购买的产品。这是任何传统产品经理角色中固有的部分。你对市场、产品和销售团队的理解，使你对推向市场的解决方案、解决方案的性能，以及销售团队阐述你所构建解决方案价值的能力充满信心。此外，AI带来了机遇和挑战：即销售AI功能本身的能力。\n\
  \n在本书前面部分，我们提到AI/ML项目在部署到生产环境时面临的困难；造成这一情况的原因有很多，但最主要的原因之一是无法向更广泛的组织推销AI的价值。这对于任何希望从事AI产品工作的产品经理来说都非常重要，因为你需要培养这种理解力和能力，既要向外部市场推销你的产品，也要向内部利益相关者和领导者推销。无论你是在大型组织还是小型初创公司工作，情况都是如此。\n\
  \nWaterbear公司正在构建一款旗舰产品Akeira，旨在帮助应对因Covid-19疫情而加剧的心理健康问题，特别是针对18岁以上的女性。最初，这只是一个帮助人们更好地了解自己的构想，如今已变成一款实用产品，人们用它来更清晰地了解自己的情绪和心境如何随时间变化。该产品利用NLP扫描用户在应用内输入的日志条目，帮助用户设定想要努力的目标和重点领域，并推荐活动和问题，以更好地帮助他们实现个人目标。\n\
  \n尽管早期在融资和获取用户方面遇到了困难，他们现在已达到一个里程碑。他们获得了A轮融资，并已获得必要的资源来拓展新客户和建设内部团队。他们帮助个人更好地了解自己、克服心理障碍的使命正在顺利推进。Waterbear的方法是全面性的；他们希望建立一个职能无缝整合的组织，不仅确保高效的产品生命周期，还能为公司扩展和员工福祉保持健康的节奏。\n\
  \n基于本章讨论的概念，我们将详细分析该产品如何走过AI产品开发周期的各个阶段，各职能如何协同运作来运营该产品，他们的技术栈是什么样的，哪些AI输出对产品影响最大，他们目前如何实现产品的垂直化，以及他们当前的GTM策略是什么。\n\
  \n### AI产品开发周期\n\n首先，让我们回顾一下本章前面介绍的产品开发生命周期的各个阶段，看看Akeira的情况如何：\n\n- **构思：** Akeira产品团队首先分析了用户如何能在心理健康工具中找到价值，从而提供实时情绪支持、分析和安慰。他们考虑了各种AI功能，如情绪分析、用于治疗会话的**自然语言理解（NLU）**，以及通过对话数据进行情绪追踪。团队还进行了可行性研究，以确保数据需求与潜在的解决方案和模型相匹配，这些模型需要支持心理健康情境所需的复杂语言理解，例如识别痛苦或语气。\n\
  - **数据管理：** 团队获取了与心理健康相关的对话数据集、匿名治疗记录、情绪追踪日志以及相关的社交媒体互动数据，用于支持所训练和使用的AI/ML模型。情绪基调和情感被分类和标注，为第三阶段将要测试的AI/ML模型提供输入准备。\n\
  - **研发（R&D）：** 团队尝试了多种语言模型，但最终选择了谷歌的BERT模型。上一阶段收集并标注好的心理健康数据被用来针对特定任务微调BERT，例如识别对话中的心理健康线索。在集成到可工作的原型或MVP（称为Akeira）之前，BERT还经过了理解上下文、意图和情绪情感的阈值测试。之后，该原型被分享给了一小组测试版用户。\n\
  - **部署：** Akeira被整合进一款同名心理健康应用，并设置了监控工具来追踪它在实时交互中识别情绪线索并作出回应的表现。在测试版用户积极使用该应用后，团队建立了维护和监控机制，确保测试版用户正确使用应用并获得益处。反馈机制也到位了，用于收集用户的顾虑和问题。这些反馈机制成为应用的主要特色，确保Akeira能够定期收集关于其反应准确度和敏感性的反馈，以便相应调整未来的迭代版本。\n\
  \n### 团队构成\n\n让我们来看看Akeira团队可能是什么样的：\n\n**产品：** 公司最早做出的一项招聘决定，是为其梦寐以求的创始首席产品经理职位找到一位合适人选。他们寻找的是有构建专注于NLP的AI工具经验的人，但他们也看重热情。一旦找到一位在构建帮助人们的产品方面有良好记录、并对心理学和福祉有个人兴趣的人，他们就能信任这个人来定义公司旗舰产品的战略、愿景和路线图。\n\
  \n由于这个人过去构建过AI产品，他们能够与领域专家、治疗师、数据科学家、机器学习工程师、测试人员、客户成功人员和设计师良好合作，将产品提升到新的水平。他们能够将这些内部工作与研究、竞争分析、用户反馈和外部数据源结合起来，了解产品未来可能存在哪些机会。他们明白，自己的目标不仅是让产品保持相关性，还要不断创新，并与所服务市场的需求保持一致。\n\
  \n**数据科学与机器学习：** 服务于该产品的数据科学和机器学习团队任务艰巨。他们负责构建和训练为Akeira提供支持的模型。\n\n数据科学家定期从用户数据中收集洞察，以更好地了解哪种用户行为能带来产品的最佳使用效果。他们的工作主要集中在各种模型的A/B测试上，并使用统计、概率和预测方法来处理NLP，以持续改进他们的AI模型，同时定期与产品和机器学习同事分享发现。他们还花费大量时间，用来自合作治疗师的专业技术数据来增强各种**大型基础模型（LFMs）**，以确保产品的可行性。他们的大部分时间都花在探索数据、为模型进行特征工程、选择最佳部署模型，以及利用知识和专业知识解释模型结果上。他们主要使用Python编程，并将这些模型作为输出移交给合作的机器学习工程师。\n\
  \n\n\n\n- **数据与机器学习：**\n  - 使用 Amazon S3 存储桶存储海量数据\n  - 使用 Amazon Athena 查询和分析他们的数据\n\
  \  - 使用 Apache Spark 对模型进行预处理和特征工程\n  - 使用 Jupyter Notebook 进行机器学习模型自研\n  - 使用 GitHub\
  \ 管理模型版本\n  - 使用 Amazon SageMaker 全面管理其机器学习管道（构建、训练和部署）\n  - 使用 SageMaker Ground\
  \ Truth 作为标注服务，用于与用户仪表板相关的所有组件，以捕捉诸如实体识别、文本分类和情感分析等内容\n  - 使用 SageMaker Clarify\
  \ 作为其自然语言处理模型的去偏工具\n  - 使用 Amazon EKS（Elastic Kubernetes Service）将与 Akeira 相关的所有自然语言处理应用容器化\n\
  - **工程：**\n  - 使用 AWS Lambda 函数处理来自用户的新的数据的预处理和后处理，以便快速将数据输入生产中的模型\n  - 使用 Amazon\
  \ API Gateway 处理连接驱动产品的自然语言处理模型的 API\n  - 使用 Amazon CloudWatch 监控性能日志\n  - 使用 AWS\
  \ X-Ray 调试自然语言处理服务的 issues\n  - 使用 AWS KMS（密钥管理服务）进行数据保护和数据加密\n  - 使用 AWS IAM（身份和访问管理）控制对特定用户的访问\n\
  \  - 使用 GitLab 进行代码管理\n  - 使用 Jenkins 进行 CI/CD\n- **其他团队：**\n  - 使用 Intercom 进行用户反馈、支持票据和应用内调查\n\
  \  - 使用 InVision 设计一页纸文档、产品营销材料和白皮书\n  - 使用 Google Forms 进行用户调查\n  - 使用 Lookback\
  \ 进行大规模的正式调查\n\n## AI 输出\n\n关于 Waterbear 的 Akeira 产品，用户日志会被记录并整合到用户在日常生活中可以参考的仪表板中。以下是在应用中可能出现的示例：\n\
  \n![](img/a0c9f9a2ba06a06d309ce21d890a47c6_175_0.png)\n\n图 6.2：带有日志和个人数据的 Akeira\
  \ 仪表板\n\n由于该应用是面向消费者的移动应用，终端用户分享的文本将被分析和选择关键词。应用首先会以聊天的形式来了解终端用户，因此 Akeira 的首要目标——确保与之交谈的人被看见、被理解并得到认可得以实现。自然语言处理模型不仅会分析明确分享的文本，还会根据用户意愿连接社交媒体和其他文本输入，以建立对其整体状况的全面理解。这些就是输入。\n\
  \n消费者看到的输出将显示在仪表板和目标模块之间的切换中。仪表板模块能够展示各种可用于衡量整体健康和福祉的指标。整体的 Akeira 评分将作为特定时期内整体情绪状态的视觉指标进行分享。\n\
  \n其他关键绩效指标和可视化也会包含在仪表板中。在这里，你可以考虑诸如情绪追踪器、应用参与度及其与情绪的相关性、带有进度条的自我关怀指标、与身体活动相关的可视化、感恩分数以反映终端用户可以培养对其生活中进展顺利的方面感激的领域，以及社交追踪器，让用户从鸟瞰视角了解其社交健康：\n\
  \n![](img/a0c9f9a2ba06a06d309ce21d890a47c6_176_0.png)\n\n*图 6.3：显示可用程序的 Akeira 仪表板*\n\
  \n第二个切换项是其已建立的目标模块，该模块专门涵盖通过自然语言处理模型建立并经用户确认的目标；这些目标更具具体性，并根据终端用户对 Akeira 的具体使用量身定制。目标将有既定的成功标准，以便一旦朝着目标取得进展，就能记录并庆祝。\n\
  \n最后，所有这些各种指标和关键绩效指标将为每个终端用户带来高度个性化的洞察，例如反馈展示、鼓励自我反思、正念或甚至身体和心理健康的行动提示。如果人工智能产品的目标是通过数据传递价值，那么应用体验就需要有一种表达这种价值并将其反映回终端用户的方式。这就是\
  \ Akeira 和 Waterbear 与其客户群沟通的方式。\n\n## GTM 策略和垂直化\n\nWaterbear 在完成原型后，早期向一小群测试用户开放，以更好地了解像\
  \ Akeira 这样的产品的兴趣和可行性。目标市场最初是 18 岁以上的成年女性，并专注于真实且有机营销活动，让用户在他们所在的地方相遇：无休止地在线滚动。由于\
  \ Waterbear 的两位创始人都是女性，她们能够通过 Women in AI 的初创加速器建立早期潜在投资者和顾问网络。\n\n像 Akeira 这样的产品的市场也是一种蓝海市场。虽然存在\
  \ Woebot、Wysa、Moodnotes 和 Pacifica 等直接竞争对手，但大多数都是简单的情绪追踪器或聊天机器人，并没有完全捕捉到 Akeira\
  \ 所能提供的复杂性。其他间接竞争对手如 Talkspace、BetterHelp 和 Cerebral 只能将你与该领域的心理健康专业人士联系起来。由于 Akeira\
  \ 是直接和间接竞争对手的结合，它能够通过产品驱动的方法聚集一批忠诚的专用用户。\n\n使用基于心理健康应用市场状况的 **总可用市场（TAM）** 0.6 十亿的保守估计，Waterbear\
  \ 能够发现针对女性的心理健康应用的共享 **可服务可寻址市场（SAM）** 刚刚超过 3.5 亿美元。由于他们在专注于扩展之前优先考虑了单一旗舰产品的缓慢、有机增长，他们最初的\
  \ **可服务可获得市场（SOM）** 刚刚超过 500 万美元。\n\n最后，虽然 Akeira 最初是为直接面向消费者而创建的，但 Waterbear 的\
  \ GTM 团队发现，有大量用户可能来自正在寻找可交付给员工的对话式人工智能解决方案的企业，以帮助提升他们的创造力、幸福感和福祉。\n\nAkeira 未来的探索将扩展到其他垂直领域，如不同年龄段、性别以及超越单纯福祉的使用案例。请在第\
  \ 2 部分的后续章节中关注我们的 Waterbear 案例研究，我们将为示例增加更多复杂性。\n\n## 总结\n\n产品经理的工作永无止境。总是会有更多声音、观点和需要考虑的因素。协调所有利益相关者、技术、领导层、市场分析、客户反馈以及对产品的热情并不是一件容易的任务。在本章中，我们介绍了人工智能产品开发生命周期的各个阶段以及可能构成人工智能产品梦之队的各种角色。我们还介绍了可以帮助该团队构建产品的技术栈，以及帮助产品脱颖而出并与将购买和使用产品的群体产生共鸣的各种重点领域。希望本章能帮助你理解在着手构建人工智能原生产品时最重要的因素。\n\
  \n# 7\n\n# 产品化机器学习服务\n\n在 *第 6 章* 中，我们简要提到了产品化的概念以及这对人工智能输出意味着什么，见 *产品化人工智能驱动的输出\
  \ – 人工智能产品管理有何不同* 部分。我们将在本章中扩展这一概念，探索在构建人工智能产品时可能出现的种种挑战和磨难。与其将人工智能产品视为传统软件产品，不如将其视为你正在学习产品化的服务。**产品化**\
  \ 是将服务、流程、技能或想法转化为一种向更广泛市场呈现的方式的过程。\n\n首先，我们将了解产品化的一些基本原则，以及人工智能产品与传统软件产品之间的差异和相似之处。虽然我们在之前的章节中已经涵盖了一些这些要素，但我们将在本章中进一步扩展这些想法。接下来，我们将探讨产品化如何根据商业模式本身而变化。我们将研究\
  \ **人工智能运维（AIOps）** 和 **机器学习运维（MLOps）** 在产品化中在管理各种产品及其性能比较方面所发挥的作用。最后，我们将以产品化循环如何通过反馈不断刷新结束。\n\
  \n到本章结束时，你将了解以下主题：\n\n- 产品化原则\n- 理解人工智能与传统软件产品之间的差异\n- B2B 与 B2C – 产品化商业模式\n- 一致性和\
  \ AIOps/MLOps – 依赖和信任\n- 性能评估 – 测试、再训练和超参数调优\n- 反馈循环 – 关系建立\n\n## 产品化的基础\n\n产品化是一个在咨询中经常出现的概念，其中服务提供被固化为可以有效定制和转售的明确实体。这指的是能够创建一致的工作流程，你可以依靠它以传统产品所要求的方式交付一致的结果。\n\
  \n\n\n\n\n在深入探讨产品管理原则及其与 AI/ML 服务的特殊性之间的对齐之前，让我们先解决一些基本概念，即产品化本身意味着什么。以下流程图通过四个主要领域展示了“产品化”的过程：定义你最终得到的产品的范围，将品牌和包装与该范围保持一致，以支持该范围；培训你的销售和交付团队以适当传达产品的范围；以及建立反馈循环来告知你的工作范围（或建立新的产品化服务）。\n\
  \n![](img/a0c9f9a2ba06a06d309ce21d890a47c6_180_0.png)\n\n图 7.1：产品化基础\n\n由于 AI/ML\
  \ 模型和输出本质上就是被产品化的对象，这意味着需要为以下内容设定标准，如前述流程图所示：\n\n- **Scope:** 定义范围确立了你的产品将为客户和用户提供的边界。这就是你定义功能、功能性、可交付成果以及终端用户可以期望的输出的地方。范围还指导内部团队更好地理解优先级和期望。它也有助于为未来的迭代和变体创建路线图。你可以在此阶段提出的一些问题是：\n\
  \  - 你作为产品提供的功能、可交付成果和输出是什么？\n  - 你的客户可以从你的产品中持续期望什么？\n  - 你是否会有针对不同客户的不同模型？\n \
  \ - 每个客户的数据是否会保持分离以训练独立的模型，还是你会一次性将模型训练在所有客户的数据上？\n- **Branding and packaging:**\
  \ 你设定的任何范围都会影响你的品牌和包装选择。如果你将模型和可交付成果分组为队列，你实际上需要将它们作为单独的产品进行品牌化，每个产品都有自己的营销资料（白皮书、一页纸、博客文章等）、合同和**服务水平协议（SLAs）**、文档、品牌形象和信息传递。你可以提出的一些问题是：\n\
  \  - 该产品的核心价值主张是什么？\n  - 品牌声音如何与该产品保持一致？\n  - 该产品最好如何视觉呈现？\n  - 品牌和营销工作是否与该产品的目标市场保持一致？\n\
  \  - 品牌和营销工作是否需要在各种目标客户群中进行定制？\n- **Sales and delivery:** 你的销售团队需要接受你各种产品的培训，无论它们如何形成。他们需要了解如何谈论每个产品以及每个产品的能力和价值主张。你在这里也需要就交付方法达成一致。你可以提出的一些问题是：\n\
  \  - 是否有一个平台或门户可以管理并交付每个产品？\n  - 它是手机上的应用程序吗？\n  - 你将在交付架构中嵌入多少自动化水平？\n  - 产品将如何定价？会有分层吗？\n\
  \  - 销售推介或演示中解决的关键痛点是什么？\n  - 如何在销售周期中传达价值？\n  - 上线流程会是什么样的？\n- **Feedback:** 你需要某种方式来衡量你的产品在受众和队列群体中的反响。你希望这样做是为了确保你有满意的客户，他们的需求正被你的产品满足，但你也希望反馈能被纳入产品未来的*scope*：\n\
  \  - 客户反馈将如何收集、使用和分析？\n  - 负面反馈将如何被解决并为未来的迭代和产品更新确定优先级？\n  - 存在什么沟通计划来与客户分享改进和更新？\n\
  \  - 将跟踪哪些客户成功指标？\n\n现在我们已经回顾了产品化的一些基础知识，让我们探讨这些方面如何根据上下文而变化。\n\n## AI 与传统软件产品管理\n\
  \n理解传统软件与 AI 产品之间的差异，并不是简单地比较两组不同的产品。虽然这很有帮助，但这是一个宏观趋势，而理解两者的最大原因是为了预测所有产品将如何随着\
  \ AI 而演进。从产品经理的角度来看，传统软件产品和 AI/ML 产品之间存在许多差异。在本节中，我们将首先介绍它们的不同之处，然后指出两者之间的相似之处，以便我们对产品管理\
  \ AI/ML 产品时应期望的情况有一个全面的认识。这将帮助我们建立一个基线，以及与传统产品管理工作的偏差。\n\n### 产品有何不同？\n\n虽然 AI 产品在很大程度上建立在传统软件开发的基础上，但作为产品经理，你应该意识到它们有许多关键差异。AI\
  \ 能够发展传统软件产品，你会在产品圈听到这被称为应用 AI。这指的是在研究环境或实验室之外对 AI 的应用，用于构建技术产品。基本上，将 AI/ML 付诸使用、测试和优化模型的准确性和精确度，并通过反馈循环随着时间的推移对其进行演进，这构成了应用\
  \ AI。\n\n以下部分将涵盖传统软件产品与 AI 产品之间最大的差异，包括可扩展性、利润率和不确定性。\n\n### 可扩展性\n\n应用 AI 产品与传统软件产品之间的主要差异之一在于可扩展性领域。由于\
  \ AI 对训练数据的质量和特殊性非常具体和敏感，你很可能会遇到扩展此类产品的问题，因为你可能会遇到如此多的边缘情况，以至于不得不重新设计或开始在用户群内创建队列。这导致\
  \ AI Forum 所称的集体 AI 疲劳，这种疲劳来自直接从事 AI 开发的人员，以及领导层和整个市场本身，都源于将 AI 应用于商业用途时的可扩展性问题。\n\
  \n这个问题不仅在于 AI 对准确性的挑战；事实上，你需要大量数据才能使高级 ML 和深度学习（DL）模型良好运行并提供良好的性能，但你也需要这些模型足够健壮，能够适用于一般化的用户群体、情况、上下文和位置。在传统软件产品中，你可能不需要这种程度的粒度就能取得成功，但对于应用\
  \ AI 产品，你可能会认为需要为每个用户或用例提供高度个性化的模型。\n\n这种感觉可能并不远离最优现实。这也意味着 AI 对边缘案例的概念特别敏感，而对于\
  \ AI 产品而言，构成边缘案例的阈值可能比其传统软件对应产品更低。虽然边缘案例会影响所有软件产品，但传统软件公司在迭代方面具有固有的优势，因此一旦你构建并发布产品，你就可以在无需大量定制的情况下将其销售给几乎所有客户。\n\
  \n我们将在本章后面讨论商业模式的差异，但可扩展性问题会因你的商业模式选择而加倍受影响。例如，如果你是一家 B2B 公司，你的 AI 产品在不同客户之间可能会表现截然不同，因为他们的训练数据差异可能太大。如果我们将其与\
  \ B2C 公司进行对比，你可能是在非常具有代表性和多样性的数据上训练你的模型，但你的个人消费者与产品的互动方式可能会大不相同。\n\n无论是训练数据问题还是终端用户使用产品的方式问题，问题都是一样的：你必须考虑来自外部影响的如此多视角和对产品的需求，以至于在保持一致的产品构建的同时，使所用模型的扩展几乎不可能。甚至就可接受的产品性能水平达成一致也可能在时间、成本和精力上效率低下，更不用说实际获得你需要的准确性水平，以便最终拥有足够一致的产品，可以作为最小可行产品出售。\n\
  \n要达到客户信任的水平，让最早的客户看到产品价值并持续使用它，需要大量的前期工作，而且你无法保证这种高强度的客户获取会像传统软件产品那样随着时间推移而消退。对于应用\
  \ AI 产品，获取和留住客户的过程可能会保持在持续的艰苦节奏中，这进一步加剧了可扩展性问题，直到一定程度。然而，人们正在努力构建和发现改进模型的方法，这些方法对海量数据依赖性较低。\n\
  \n根据 AI Forum 的说法，“数据收集成本高昂，需要标注和标记（在医疗保健中由临床医生完成）、清理和准备，这可能占 AI 训练成本的 50%。需要数据所有者（例如患者）的同意才能使用其私人数据，有时还需要为数据管理者提供额外激励以共享数据。数据隐私和安全法律可能为共享、存储、访问和处理数据带来障碍。”\n\
  \n这强化了这样一个观点：与传统软件产品相比，数据本身的数量对于可扩展 AI 产品的商业成功而言是次要的，训练数据的质量和多样性更为重要。它不仅需要在数据样本中以统一的方式标准化；它还需要有足够具有代表性的数据点来涵盖用户的多样性——其理念是，你的数据越多样化，就越能够预测一旦部署到公众中，一般用户将体验到的需求和使用情况。\n\
  \n获得干净的数据说起来容易做起来难。大多数现实世界的数据集都充斥着数据卫生问题。Tableau（https://www.tableau.com/learn/articles/what-is-data-cleaning）提供了如何解决这一问题的精彩总结：“数据清洗是修复或删除数据集中不正确、损坏、格式不正确、重复或不完整数据的过程。在合并多个数据源时，数据被重复或错误标记的机会很多。如果数据不正确，结果和算法不可靠，即使它们看起来正确。没有一种绝对的方式来规定数据清洗过程中的确切步骤，因为流程会因数据集而异。”\n\
  \n\n\n\n\nAI/ML 产品对数据的质量尤其敏感，而这种敏感性因蓄意篡改或数据投毒问题而进一步加剧，在这种情况下，最终用户会攻击 AI/ML 系统，以故意操纵为其提供动力的训练数据。\n\
  \n## 利润率\n\n我们已经讨论过构建 AI 组织相关的成本，如果你要构建应用型 AI 产品，就必须这样做。这些成本是传统软件产品与应用型 AI 产品之间最大的差异因素之一。由于开发、数据和维护成本可能非常高，它们会影响你的利润率。为了说明可能出现什么问题，我们找到的最佳例子来自《哈佛商业评论》(https://hbr.org/2022/03/how-to-scale-ai-in-your-organization)，其中提到“...一家金融机构在\
  \ 10 分钟内损失了 20,000 美元，因为其中一个机器学习模型开始出现异常。由于无法了解根本原因——甚至无法识别出哪个模型出现故障——公司别无选择，只能切断系统。所有模型都被回滚到更早的版本，这严重降低了性能并抹去了数周的努力。”想象一下在如此短的时间内损失如此多的钱，却仍然无法知道问题出在哪里！\n\
  \n话虽如此，应用型 AI 的某些方面比其他方面更盈利，这取决于时间范围：\n\n- 根据 Forbes (https://www.forbes.com/sites/forbesfinancecouncil/2020/09/01/past-the-ai-hype-when-is-ai-actually-profitable/)\
  \ 的说法，我们在应用型 AI 上看到的最快的短期回报是当它支持客户行为时，这是有道理的，因为它直接影响销售，是收入驱动因素之一。这将是应用型 AI 的用例，例如产品推荐、规模化定价算法或广告个性化/优化，它们可以为你的网站带来更多流量，或帮助客户根据其特定的支出和购买习惯、成本意识或品味和偏好选择更多产品。\n\
  - 应用型 AI 的中期回报更多的是当 AI 用于改进产品或以某种方式改善用户体验时。这可能看起来像提升用户生产力的产品自动化。对于本书的大部分内容，我们一直在讨论这些\
  \ AI 应用，因为它们直接影响单个产品及其性能。作为一名产品经理，这很可能是你关注应用型 AI 的主要领域，也是就产品性能和在客户以及更广泛市场中的地位而言最适合它发挥作用的地方。由于这本质上是一种中期回报，而且你的\
  \ AI 成本在很大程度上会提前投入，你将需要从收入和性能两个角度管理工程、领导层和面向客户团队的期望。\n- 应用型 AI 最重大的长期回报是当它影响公司的声誉时。这意味着\
  \ AI 的应用方式提升了公司在声誉上的信任度，特别是与竞争对手和同一领域的同行相比。但获得这种水平的 AI 领先地位需要大量时间，这也揭示了 AI 的双刃剑本质。最终，你的竞争对手会跟上并也会付费进入你的领域。这就是竞争的本质，作为产品经理，我们理解我们的产品在市场上受到审视，而且理应如此。也就是说，这些盈利领域并不完全是孤立的。我们刚刚讨论的\
  \ AI 短期优势如果你的产品专注于营销、推荐系统或广告等，也可能渗透到这一领域。\n\n我们讨论的 AI 长期优势也可以适用于将应用型 AI 集成到你的产品中，如果产品提供的优质\
  \ AI 如此出色，以至于影响了你在所选市场或垂直领域中的声誉地位。作为产品经理、技术人员或企业家，你将不得不应对 AI 带来的成本以及其优势，并制定计划，说明你希望如何开始利用应用型\
  \ AI。在起步时，最好的方法之一是首先了解 AI 可以为你的产品和公司整体带来的好处，然后起草你自己的计划版本并向领导层提出。传达 AI 的有效性以及你对它将如何影响盈利能力的理解，将有助于你在组织内部建立信誉。它还将为利益相关者提供一个途径，使他们能够理解挑战和机遇，并最终为计划做出贡献。\n\
  \n一旦你有了这个计划，你就可以开始跟踪 AI 应用于各个领域的相对盈利能力，并在组织内部拥有拥护者/支持者来保持 AI 的可见性。如果你能就 AI 支出和利润率容忍阈值达成一致的特定承受能力，将更容易在继续应用型\
  \ AI 之旅时驾驭 AI 的水域，因为这将迫使你在有数据、经济回报和保持热情的情况下投资 AI。它也会让你的财务团队感到满意。\n\n## 不确定性\n\n\
  最后一个重大差异是概念性的。AI 为产品管理的工作带来了大量不确定性。对于产品经理来说，这可能是迄今为止本书中最重要的部分。应用电子商务、银行、旅游和社交媒体等领域已知产品管理模式的产品经理，在构建\
  \ AI 产品时只能走这么远。产品经理需要适应他们的思维和他们的方法，以应对 AI 可能引入到其产品中的不确定性。\n\n对于传统软件产品，其确定性特征是硬编码的。算法仍然存在，但它们不会随着时间的推移而改进或学习；它们是静态的。但对于\
  \ AI 产品而言，这些特征更具流动性。必须由构建者和使用者明确或直觉地就期望设定和性能达成一致。如果由于模型训练不足而没有达到该性能水平，就必须进行更多训练。如果无论投入多少训练都无法获得性能，你最终可能就没有产品可售！这种不确定性在传统软件中得到缓冲，因为你的性能目标并不像构建\
  \ AI 产品时那样是不断变化的目标。\n\n我们在这里提出 AI 产品与传统软件产品之间的差异，是因为我们希望所有有投资和意愿创建 AI 产品的人都能为成功做好准备。如果你能在构建新产品时预见到潜在的障碍，你就能更好地为团队准备好克服这些障碍。\n\
  \n## 产品有何相似之处？\n\n传统软件产品和 AI 产品之间存在许多相似之处，因为从根本上说，AI 产品实际上是内置了产品化 AI/ML 服务的传统软件产品。因此，我们在这里概述的相似之处涉及敏捷产品开发以及数据。原生\
  \ AI 产品以及支持它们的 AI 管道输出遵循与大多数传统软件产品相同的构建流程。它们也是以驱动它们的重点数据为重点构建的。对于传统软件产品来说，这仍然是事实。\n\
  \n### 敏捷开发\n\n在传统软件开发中，你遵循某种方法论来构思、跟踪工作并保持与某个框架或计划的一致性。如今，大多数软件公司不再使用瀑布方法，而是选择使用敏捷、Scrum、看板或精益方法论的某种版本。这意味着大多数软件公司采用迭代和实验性方法来构建和发布产品。它们将宏大的业务目标转化为具体的任务，这些任务最终会在任何一次冲刺结束时形成交付成果。一旦完成这些交付成果，它们就会经过评估流程，以确保它们通过测试满足各种期望。\n\
  \n这种方法核心是*敏捷性*。当你随着时间的推移构建产品的特性时，你有时间在功能和概念上测试这些特性。这是在产品或特性上花费时间和精力、资源的一种经济方式，然后看看它在客户群和更广泛市场中的反响。这种敏捷性使科技公司能够取得成功：当他们发现产品或特性与用户群体没有共鸣时，他们能够在构建过程中进行更改和调整。无论你的产品是否支持\
  \ AI/ML 功能，这都将是事实。\n\n我们甚至会更进一步说，AI/ML 将这种敏捷性的核心提升到了下一个层次。因为 AI/ML 产品持续从之前的形态构建，它们不断演进并适应对性能、准确性或速度的新需求。你不能在真空中构建\
  \ AI 产品。随着时间的推移，AI 产品将经历多次转变，正因如此，它们始终处于更新或升级以满足其输出期望的状态。对于生成式 AI 产品来说尤其如此，因为驱动它们的深度神经网络具有不透明性。\n\
  \n由于工程师无法真正解释生成模型为何产生某些输出，因此必须通过外部影响，如重新训练并通过提示调优和用户反馈加强训练，持续地对模型进行更改。提示工程本身需要在公司为生成式\
  \ AI 产品准备市场的方式中成为永久性要素，因为提示本身指导了生成过程。如果没有持续不断地进行调整的方式，特别是在这一领域，你就不会知道哪些提示策略最有效。敏捷性必须成为常态。\n\
  \n\n\n\n同样值得注意的是，传统软件产品与AI产品之间的界限正变得越来越模糊。这是因为大多数软件公司已经开始将AI/ML集成到现有产品中，或推出了AI原生产品。管理各类产品的产品经理（PM）都希望加深对AI/ML的了解，以便在自己的领域内保持竞争力，无论他们是否打算深入AI领域。接下来，让我们把注意力转向AI/ML产品如何根据其商业模式，尤其是B2B和B2C产品，进行定位和构建。\n\
  \n## B2B与B2C——产品化商业模式\n\n在构建和交付产品时，B2B与B2C商业模式之间的一些最大差异包括领域知识和实验程度。在本节中，我们将重点讨论这两个方面，因为它们对这两种商业模式下AI/ML产品产品化的形态影响最大。如果深入探讨AI/ML产品更像服务这一观点，那么这两种商业模式的预期最终结果将有所不同，因为它们服务不同类型的客户和不同的整体需求：\n\
  \n-   对于B2B产品，一个强烈的需求是展示高度的*领域知识*并聚焦于此。由于B2B产品通常服务于已被验证的商业利基市场，它们必须经常证明自己在该利基市场中具备专业知识。\n\
  \n-   对于B2C产品，我们看到的是对*实验*的关注，因为这些产品并非利用已存在的商业需求，而是试图挖掘其客户群自身可能尚未意识到的更集体性的需求。这需要高度的实验。\n\
  \n在接下来的章节中，我们将进一步阐述这些观点。\n\n## B2B产品的领域知识——理解你的市场需求\n\n首先，在B2B产品中，领域知识至关重要。这是因为用例极其具体，产品本身解决的是特定行业和领域所特有的细分业务问题。产品经理要在B2B领域发挥作用，就必须与客户的需求、工作流程和主要痛点紧密相连，因为他们的产品解决的是非常具体的用例。这并不是说该领域的产品经理必须来自他们所服务的特定行业，但他们确实需要投入大量时间与用户群体建立共情，以便在以下方面发挥作用：\n\
  \n-   **建立可信度：** 这一耗时的过程可以体现为多种形式；进行客户访谈、紧跟行业趋势、了解竞争格局以及竞争对手为客户提供的价值和功能，都是为产品所竞争领域建立可信度的工作的一部分。这也是理解产品将要服务的各类用户的初步工作。如果你是该领域的产品经理，并花时间建立清晰的购买者和用户画像，确保自己了解他们的个人需求、问题和“待完成工作”，那么你就是在为成功铺路。\n\
  \n-   **销售周期：** B2B客户的期望门槛很高，因为这个领域很可能充斥着大量可供选择的竞争产品。在许多情况下，这些客户会经历多轮**征求建议书（RFP）**和深入的**概念验证（PoC）**流程，以确保他们购买的产品符合其用例。对于AI/ML产品而言，这些PoC可能使你的组织付出高昂成本，因为你需要从客户那里获取足够大的样本，使用这些数据训练模型，并在其性能达到可接受水平、能够展示给潜在客户时，向他们展示你的产品及其能力。\n\
  \n-   **在生态系统中构建：** 这意味着这些产品往往备受关注，每一双关注的眼睛都可能对产品抱有自己的期望和异议，因此在构建B2B产品时，你确实需要意识到多种视角。这也意味着在构建产品的过程中，你规划发布日程时要考虑到每个版本都可能包含影响客户个人工作流程的功能，因此你往往需要注意发布到生产环境的频率和负载。这一点尤为重要，因为B2B产品通常需要集成到现有的企业工具、API或其他平台中，所以你已经在某种既定框架内工作。\n\
  \n这种领域知识会逐步积累，直到你作为产品经理以及你的整个组织成为所服务领域的思想领袖。由于B2B领域是一个小世界，一旦某个产品及其领导团队引起轰动，消息就会在专业领域内传开。在内部和外部建立可信度，从根本上与所获取的行业专业水平成正比。\n\
  \n这进一步印证了对AI/ML B2B产品的期望相当高。你的用户和购买者会审视你的AI产品所依托的技术栈，以及其性能和准确性。他们会希望你提供可解释性的证据，说明产品为何有效，这可能会让使用生成式AI或深度学习模型构建的AI产品变得棘手。与此同时，他们还会测试和试用其他可用的AI/ML解决方案来与之比较。这意味着你必须对发布极为谨慎，确保在推向生产时不会有任何性能滞后，同时要清楚其他企业正依赖你的产品。\n\
  \n以一家AI公司为例，该公司希望开发一种预测性维护工具，在设备故障发生前进行预测，以避免制造环境中的停机。开发该工具的AI工程师需要了解不同类型的机械及其遭遇的特定故障模式。AI模型需要了解某些设备的运行限制，才能正确解读传感器数据。还需要领域专家来识别振动、温度或压力等关键数据点，帮助AI产品团队决定哪些数据与预测故障最相关。在B2B环境中，不同客户的需求可能千差万别，因此产品团队需要深入了解将使用其工具的客户公司，以及与其环境最相关的复杂细节和定制化需求。\n\
  \n客户旅程的每个阶段都需要管理期望。B2B产品存在于庞大的生态系统中，使用某一产品的公司可能会将该产品的输出传递给其他工作流程或自己的客户。B2B产品经常与其他软件解决方案集成，以简化工作流程或增强运营。例如，项目管理工具可能从时间跟踪应用中获取数据来生成报告。这些报告的数据可以输入团队协作平台，以确保利益相关者及时了解情况，依此类推。\n\
  \n这使得B2B公司有责任维护公司和产品的声誉，并在营销工作中更加透明。长期关系建设是B2B产品成功的基础，因为合同往往是多年的，有时销售周期也很长。这给AI/ML产品团队带来了更多压力，要求他们远离黑盒算法，销售能够对自己的输出负责的产品，因为人们更需要透明度、责任感和可解释性。如果B2B产品未能实现性能或预期结果，企业希望了解原因，通常是通过正式的现场会议。B2B公司客户拥有巨大的议价能力，因为各方风险都很高，合同成本也很高。B2B产品受益于参与度高的客户，这些客户希望产品达到一定的性能水平，而反馈和协作有助于改进产品。\n\
  \n## B2C产品的实验——发现你目标群体的需求\n\n对于B2C产品，由于不会对所服务的领域如此高度聚焦，你所服务市场的压力会稍小一些，但这会带来另一种压力：构建一个能够普遍吸引更广泛受众的产品的压力。撒一张更大的网会带来其他需要关注的领域，以下是一些关键考虑因素：\n\
  \n-   **获取客户洞察：** 作为在B2C环境中构建产品的产品经理，你会以更具实验性的方式对待你的产品和所服务的市场，并通过跟踪客户与产品的互动和使用行为，来获得关于什么对客户最有用的洞察。你可以组织焦点小组、培养测试版用户，或通过产品内调查对客户进行访谈，但由于你无法像B2B产品那样进行客户访谈，你只能通过客户在产品内的行为来理解他们对产品的印象。\n\
  \n-   **提升客户体验：** 这种商业模式还将所有用户和购买者画像合而为一，因为通常情况下，使用产品的人也正是购买产品的人。理解客户群的主要驱动力、渴望、希望和梦想变成了一项非常模糊的任务，因为你要捕捉的是同时适用于所有用户的潜在需求、痛点和愉悦时刻。这使得产品经理难以与其终端用户产生共情。由于大多数用户不会签署B2B产品那种年度合同，持续吸引消费者的压力始终存在，因为他们随时可能离开。这给产品、领导层和开发团队带来了压力，要求他们持续为客户群提供留下并选择他们的理由。创建一种精简、直观、标准化的体验是一回事，但决定在所有体验中优先选择哪一种则是另一回事。\n\
  \n\n\n\n- **投资于数据分析：** 由于B2C产品要求其构建者具备鸟瞰式视角，这意味着产品经理必须对数据分析和指标保持高度敏锐。投资于理解客户终身价值和客户获取成本，并跟踪这些指标，是在B2C领域保持盈利和可持续经营的重要一环。B2C为产品经理提供了一个便捷的途径，可以将AI/ML应用于客户获取与留存，因为他们与产品最终用户的接触点非常少。消费领域的产品经理还需要深入研究消费者的人口统计特征和个性化特质，以便更好地决定该构建什么。如果你发现某个地理区域、性别、世代或子类型的人群对你的产品最感兴趣，那么你可能会在未来的路线图中，围绕他们来规划新功能和版本发布。\n\
  \n我们多次提到，AI/ML产品本质上具有实验性，因为你希望以最能显著影响产品的方式利用AI/ML，才能值得其所需的重投入。这在B2C产品中更是如此，因为你构建和使用AI是为了交付能够节省消费者金钱或让他们感到愉悦的东西，同时利用产品产生的数据来决定如何调整产品方向。B2C产品经理依赖数据和数据分析来定期对其产品做出全局决策。尽管这种情况在很大程度上正在改变，但传统上在B2B领域，市场营销工作主要面向买家，因为他们是最终的决策者。这与B2C领域形成鲜明对比，因为在B2C领域，你的市场营销工作直接与你能从数据中提取和推断出的集体信息相关联。\n\
  \n让我们考虑一家AI公司，它希望提供一款个性化造型工具，根据客户的偏好、购买历史和反馈向他们推荐服装。由于该工具将同时适用于所有用户，通过微调性能和优化用户体验进行实验将是成功的关键。这可能需要进行不同算法、学习范式或过滤方法的实验，以找到能最好捕捉用户群体偏好和行为的最佳组合。A/B测试和对个性化标准的迭代将使产品团队能够为用户和客户尝试不同的推荐格式、风格和解释，以最大化购买量、客户满意度或正面反馈。然后，可以找到最有效的方法并推广到所有用户。\n\
  \n实验在某种程度上是有趣的，但归根结底，它必须产生成果。到目前为止，这对AI/ML消费产品施加的最大压力是表现良好、维持庞大用户基础并让消费者满意的压力。这意味着消费者希望使用一款能说到做到，并且界面美观的应用。由于他们不像B2B客户那样关心使用产品的下游风险，消费者并不特别关心它为什么有效，只关心它确实有效。这意味着可解释性问题在B2C领域被最小化，黑盒或深度学习算法的使用受到较少的审视。\n\
  \nB2B和B2C商业模式各有其独特的挑战组合，但归根结底，两种商业模式中的参与者都必须足够了解客户，才能创造出真正为他们带来价值的产品。一旦你为客户构建了有价值的东西，你就进入了一个新阶段。这一阶段的关键在于持续交付这种价值，不仅赢得客户，而且长期留住他们。在下一节中，我们将深入探讨在MLOps或AIOps的帮助下持续交付价值所需的关键要素。两者在本节中将互换使用。\n\
  \n## 使用AIOps/MLOps\n\n在内部产品团队以及客户群体中维持信任、信赖和一致性，需要致力于特定的仪式化实践。将获取干净数据、跟踪基础设施中的数据流、跟踪模型训练、版本和实验、设置部署计划以及监控推送到生产环境的管道等工作仪式化，都是确保你掌控AI/ML管道来龙去脉所必需的工作。这种仪式化实践被称为MLOps或AIOps。在接下来的几节中，我们将探讨与AIOps和MLOps相关的一些重要考量。\n\
  \n## 一致性与AIOps/MLOps——依赖与信任\n\nMLOps对你的业务最大的贡献，在于维持构建一个持久AI/ML产品所需的一致性。让我们探讨AIOps/MLOps的优势，以及它们如何帮助你保持一致：\n\
  \n- **管理ML管道：** 如果你正在管理ML管道，你需要学会如何依赖MLOps团队，并为你的团队成功做好准备。你不想陷入10分钟内损失2万美元（正如本章前面“利润率”部分所看到的那样），却对问题根源毫无头绪的境地。至少，你应该对问题出在哪里有一些线索。MLOps能够帮助创建和管理ML管道本身、扩展这些管道，以及在大规模下移动敏感数据。最终，损害客户对产品依赖和信任的风险是巨大的。\n\
  - **将AI/ML产品化：** 我们本章中已经详细讨论了产品化以及它在AI产品管理的不同语境下是什么样子，但MLOps实际上才是产品化功能发生的地方。将一项服务拆分成更小的部分，并管理、标准化为可复现、可规范化的片段，这就是“产品化”的工作。就此而言，MLOps确实是我们真正将AI/ML产品化的载体。为了建立客户期望产品具备的一致性和可信度，MLOps的仪式需要固化到你的流程中。你永远不知道何时需要回滚到特定版本的模型，或者精确找到某个具备正确因素组合的实验。MLOps创造了你的团队所必需的组织性和专注力，以便掌控如此繁多的实验。\n\
  \nSplunk、Dynatrace和Moogsoft等工具用于AIOps，提供分析和监控工具，帮助IT团队分析机器数据和日志。这些是用于应用程序和基础设施的AI驱动监控解决方案，用于确保你的AI程序正常运行。在许多情况下，它们还具有主动监控功能以及事件响应和管理功能，以帮助在出现问题时（以及问题持续多久）进行故障排除。\n\
  \nMLflow、Kubeflow、数据版本控制（DVC）、Seldon和Weights & Biases等工具用于MLOps，管理从实验到部署的AI/ML生命周期。管理和扩展ML工作流、维护AI/ML项目版本、A/B测试、管理不同部署策略以及可视化性能指标，这些工具都能为ML、工程和数据科学团队提供这些功能。\n\
  \n既然我们已经介绍了创建MLOps组织以帮助跟踪AI/ML管道的一些好处，让我们探讨如何在该管道基础上构建并评估所用模型的状态。在下一节中，我们将重申一些关于测试、重新训练和超参数调优的概念，以确保你的AI/ML管道能够定期刷新并优化性能。\n\
  \n## 性能评估——测试、重新训练与超参数调优\n\n如果没有一个定期验证、训练和重新训练的完善AI/ML管道，你将无法很好地掌控产品的性能。在AI/ML性能评估中，为信任、依赖和一致性建立基线以及具体基准，对于构建有效的AI/ML运营至关重要。AI产品经理可以预期围绕这一点帮助建立标准和基准。如何定义你的标准取决于你，但最重要的是你确实以某种方式定义了它。以下是你可以潜在地应用于AI/ML项目中的一些典型MLOps标准：\n\
  \n- **准确率：** 保持一个与精确率和召回率相平衡的准确率阈值，以确保你的模型不会偏向假阳性或假阴性。你也可以设定一个模型性能标准，确保在定义的时间段内，95%的模型预测都在可接受的误差范围内。\n\
  - **延迟：** 为实时应用建立延迟阈值，这样如果你的AI产品试图在某个时间窗口内检测欺诈，你就能在适当的时间内从模型获得响应。\n- **审计跟踪：** 保留模型版本和性能评估的记录。\n\
  - **信任指标：** 你可以采用用户调查来建立信任评分，确保超过80%的用户对你的模型或产品的预测感到有信心。\n- **方差：** 监控你的模型性能，确保在定义的时间段内，关键指标（如准确率或召回率）的方差不超过5%，以证明你的产品是一致的。\n\
  \n\n\n\nMLOps 帮助我们强调重新训练和超参数调优模型以交付性能的重要性。以下是你的 MLOps 团队可能会执行的一些任务：\n\n- 你的 MLOps\
  \ 团队基本上将由数据科学家以及 ML 和 DL 工程师组成，他们的任务是调整模型构建的超参数、测试这些模型，并在需要时重新训练它们。这需要与管理用于测试的数据以及产品界面的代码库协同完成。\n\
  - 除了测试和验证模型以及清理和探索数据之外，MLOps 团队成员通常还会进行软件测试，例如代码测试、单元测试和集成测试。\n- 在许多情况下，你的 AI 产品实际上将是传统软件产品，在更广泛生态系统的子集中融入\
  \ AI/ML 功能，这与传统软件开发是一致的。这意味着 MLOps 在许多情况下可以确保你的整体产品与 AI/ML 交付物和输出一起正常运作。对于生成式 AI\
  \ 模型也是如此，这些模型需要定期评估多样性、连贯性、困惑度和事实准确性。在竞争激烈的情况下，保持性能标准尤为重要。\n- MLOps 非常适合的另一个主要领域是最大程度地降低数据漂移和系统性能下降的风险。我们在本书前面的章节中介绍了几种不同类型的漂移，但这里要重申的是，这是一种可能悄然来袭的风险。模型性能下降可能由多种原因导致，影响所有\
  \ AI/ML 模型，包括生成模型。也许训练和生产阶段对数据所做的假设存在差异；也许数据本身发生了变化；也许训练数据中存在从未被发现的隐藏偏见。无论原因如何，通过\
  \ MLOps 对生产环境中的模型进行持续监控，将是你捕捉这些细微差别和 AI/ML 输出变化的最佳防御手段，从而尽可能降低 ML 管道中任何问题所带来的风险。\n\
  \n在本书的第 1 章和第 2 章中，我们介绍了持续维护的概念，包括**持续集成（CI）**、**持续部署（CD）**和**持续训练（CT）**。MLOps 的这些基本领域与\
  \ DevOps 相对应，而 DevOps 在传统软件开发中很常见。主要区别如下：\n\n- CI：在 MLOps 中，CI 不仅仅是测试和验证代码，还涉及验证和测试模型、数据模式以及数据样本本身。\n\
  - CD：CD 不仅仅是在 MLOps 中部署软件包，而是培养一种自动化的 ML 管道部署流程，该流程经过优化，用于部署模型预测服务，或在前面出现问题时自动回退到更早的版本。\n\
  - CT：在 MLOps 中，CT 不仅仅是测试软件包本身，而是重新训练和测试正在被积极依赖的模型。\n\n## 案例研究\n\n基于第 6 章中的案例研究示例，在本章中，我们将加深对\
  \ Waterbear 及其旗舰 B2C 产品 Akeira 的理解，以更好地理解本章概述的一些原则，以及它们如何出现在我们的工作示例中。我们将使用图 7.1\
  \ 所示的流程图，来指导我们如何在案例研究示例中分解本章的原则：\n\n![](img/a0c9f9a2ba06a06d309ce21d890a47c6_198_0.png)\n\
  \n图 7.2：Akeira 的产品化基础\n\n以下是所涉及的步骤：\n\n- 范围：在这里，该产品是一款 B2C 移动应用，使用自然语言处理（NLP）来消化用户输入到仪表盘中的数据，该仪表盘用于跟踪他们既定目标的进展。终端用户可以预期，每次他们在应用中提交新内容时，仪表盘都会定期刷新。Waterbear\
  \ 目前向 18 岁以上的女性提供 Akeira，但正在为 18 岁以下的女孩、18 岁以下的男孩、18 岁以上的男性、18 岁以下的非二元性别者以及 18 岁以上的非二元性别者创建不同的用例。每一个都将是一个不同的产品。目前，他们的语言模型正在基于每个客户的数据进行训练，不过他们正在测试一个混合模型，该模型将把较小的本地化语言模型与来自整个客户池的训练数据合并起来。\n\
  - **品牌与包装**：尽管 Waterbear 确实有一个整合的博客，但他们计划根据其不同产品的角色来建立独立的品牌标识。Akeira 是他们的旗舰产品，她被描绘为女性，以反映其目标用户群体。由于用户通过应用分享有关他们生活和情绪状态的个人信息，Waterbear\
  \ 希望通过围绕 Akeira 的身份构建个性和氛围来个性化体验。Akeira 的许多最终用户是 Z 世代和千禧一代女性，因此 Akeira 的感觉、外观和声音都迎合了这一用户群体。\n\
  - **销售与交付**：对于 Akeira 和 Waterbear 而言，交付是通过所有主要设备平台的应用商店进行的。由于它是一个以产品为主导的组织中的消费品，大部分销售来自营销工作、易于安装、易于使用以及基于客户满意度的续订。Akeira\
  \ 通过订阅模式运营，消费者按月付费。\n- **反馈**：目前，Akeira 拥有超过 20 万月活跃用户，其产品团队管理客户反馈的唯一可持续方式主要是通过应用内调查。他们的客户成功专家团队还会通过社交媒体网站（如\
  \ Reddit、TikTok、Instagram、Facebook 和 X（前身为 Twitter））在线回应反馈。偶尔，他们会在主要城市举办快闪活动。所有反馈也会通过\
  \ Waterbear 的 NLP 能力进行处理，以便发现持续改进的领域和新功能。他们就是这样发现了新的用例和用户群。根据现有用户和尚未符合条件但具有潜力的用户的反馈，他们发现还有大量用户群体会从他们的产品中受益匪浅。\n\
  \n## 总结\n\n在本章中，我们了解到产品化行为涉及将一个概念、一项服务或一项技术开发成适合你希望吸引的客户的商业产品。正如我们在本章中所看到的，这项工作不仅仅是让你的产品运行起来，并创建一个潜在客户能神奇找到的落地页。产品化需要批判性地理解你所处的商业模式，以及你为之构建的最终受众。请记住，AI\
  \ 产品可以看作是被构建到传统软件产品中的 AI/ML 服务。这意味着，AI 产品产品化的另一个重要部分是以一种对内部运营团队以及将依赖你产品的客户都可重复和可预测的方式，对\
  \ AI/ML 服务进行标准化和常态化。\n\n如果你能够理解你的市场，建立内部结构以确保 AI/ML 管道输出的一致性，并通过营销工作和产品的持续性能来传达这种一致性，那么你就成功地完成了产品化。但仅仅产品化可能还不够。根据你所服务市场的具体情况，你可能需要针对特定的用例、垂直领域、客户细分和其他同类群体进一步定制你的产品。由于\
  \ AI/ML 模型性能高度依赖于训练数据，因此可能存在某些数据集合在针对一个模型运行时表现不同。可能需要进行进一步的专门化。如果你发现这适用于你的产品和市场，请继续阅读第\
  \ 8 章，我们将在那里深入探讨定制化的概念。\n\n## 参考资料\n\n- *超越 AI 炒作：AI 何时才能真正盈利？*：https://www.forbes.com/sites/forbesfinancecouncil/2020/09/01/past-the-ai-hype-when-is-ai-actually-profitable/\n\
