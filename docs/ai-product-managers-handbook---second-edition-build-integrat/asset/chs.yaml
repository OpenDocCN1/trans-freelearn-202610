- "# Part 2\n\n# 构建 AI 原生产品\n\n了解管理 AI 项目所需的工作是 AI 产品管理的先决条件。现在我们已经在第 1 部分中介绍了这些基础知识，我们就可以继续在构建原生\
  \ AI 产品时，将该 AI 项目的输出进行情境化。\n\n本部分包含六章，涵盖了从一开始就用 AI 构建新产品上市时涉及的各个相关领域。我们将介绍创建 AI\
  \ 原生产品的基础知识，如何将为其提供动力的 AI/ML 服务产品化，如何为不同群体定位该产品，构建时可以采用的 AI/ML 选项，以及所有这些如何与性能基准测试、成本和增长相关。我们将在本部分结束时了解设计、发布和管理\
  \ AI 原生产品的战术和战略考虑。我们将借助一个案例研究来帮助情境化所有这些概念，该案例研究将贯穿本部分的所有章节。\n\n本部分包含以下章节：\n\n- 第\
  \ 6 章，了解 AI 原生产品\n- 第 7 章，产品化 ML 服务\n- 第 8 章，为垂直领域、客户和同行群体定制\n- 第 9 章，AI 原生产品的产品设计\n\
  - 第 10 章，基准测试性能、增长黑客和成本\n- 第 11 章，管理 AI 原生产品\n\n- 产品化 AI 驱动的输出——AI 产品管理有何不同\n- 为群体定制——垂直领域和客户分组的考虑\n\
  - 销售 AI——产品管理作为销售的更高层次\n\n## AI 产品开发阶段\n\n无论您的组织是否足够健全，可以为 AI 产品开发的各个阶段支持多个产品团队，还是足够精简，以至于由一支精简团队在每个阶段推动产品，您都希望了解这些不同阶段，以便能够在每个阶段定义成功。\n\
  \n关于产品管理是什么或应该是怎样的，存在各种观点。很少有大学在本科或研究生课程中开设产品管理课程。由于产品世界仍处于萌芽阶段并每天都在发展，我甚至可以说，PM\
  \ 的角色在公司之间在期望、角色和职责方面有所不同。我们将在此尽力以最佳方式描述各个阶段，以概括 AI 产品开发的核心方面。\n\n无论如何，作为 AI PM\
  \ 或 AI 产品的负责人，您希望考虑您的产品与这些阶段的关系，以便识别产品当前所处的阶段，以及需要做什么才能使其完全成熟。以下是 AI 产品开发关键阶段的定制版本：\n\
  \n![](img/a0c9f9a2ba06a06d309ce21d890a47c6_150_0.png)\n\n图 6.1：AI 产品开发阶段\n\n###\
  \ 阶段 1 — 构思\n\n正如传统的软件产品生命周期一样，作为 PM，您会参与构思阶段。您可能会看到它被称为创新或设计阶段。无论您怎么称呼它，这都是功能头脑风暴发生的阶段，而作为\
  \ PM，您是影响产品方向的关键利益相关者。这也是您权衡纳入各种功能的成本/收益的阶段，以及确定产品的不可妥协之处。\n\n传统软件开发与 AI 产品开发在此阶段的一个区别是，在继续之前对构思的关注更为重要，因为投资\
  \ AI 产品的成本很高。因此，您希望在产品开发生命周期中继续之前，高度关注此阶段。您不希望在产品开发深入进行后才回到起跑线，意识到自己对如何利用 AI 为产品服务有了更好的想法，然后不得不浪费数月的工作、特定技术栈的集成时间、存储以及昂贵的人力成本。\n\
  \n理想情况下，构思阶段的工作会产生产品外观的图景，使用 UX  mockups/线框图和调查，以及收集您需要的要求，以便正确规划 MVP 的范围。作为 PM，您角色中最重要的部分可能是理解您正在解决的实际机会或问题。这对市场角度和\
  \ ML 角度都是如此。\n\n就 ML 而言，您使用 AI 来解决以下类型的问题：\n\n- **异常检测：** 应用 AI/ML 来识别不符合预期行为模式的罕见或不寻常模式（例如，欺诈检测）\n\
  - **聚类/同行分组：** 应用 AI/ML 根据相似性将数据点分组为不同的集合（例如，用户细分）\n- **分类：** 应用 AI/ML 根据既定类别集为数据分配标签（例如，垃圾邮件检测）\n\
  - **回归：** 应用 AI/ML 根据训练数据预测数值（例如，预测房价）\n- **推荐：** 应用 AI/ML 根据既定偏好建议相关项目或内容（例如，购物车推荐）\n\
  - **排序：** 根据标准对项目进行排序或优先排序（例如，搜索引擎结果）\n- **优化：** 从一组潜在解决方案中找到最佳解决方案（例如，驾驶路线优化）\n\
  - **生成：** 基于输入示例/提示创建新数据/示例（例如，图像生成器）\n\n明确您在市场上要解决的带大写 P 的 Problem，以及根据我们刚才讨论的八项能力列表，您要解决的\
  \ ML 问题，将是您作为 PM 最重要的任务。其余一切都是次要的。\n\n\n\n\n\n## Phase 2 — Data management\n\n一旦你对自己正在构建的内容和原因有了清晰的认识，你就会投入资源为产品成功奠定基础。在整本书中，我们提到\
  \ AI、ML 和深度学习（DL）产品，但重要的是要记住这些产品的原始口语说法是：数据产品。从核心来看，任何以任何方式利用 AI/ML 的产品首先都是数据产品，而且没有大量高质量、干净的数据，任何数据产品都无法做好任何事情。在构思之后，对支持所有数据的所需基础设施进行组织和扩展是第一个应用步骤。你需要了解支持数据收集和数据处理所需的系统的要求、约束和词汇，因为这些数据处理将使你的\
  \ AI 产品正常运行，而你将在帮助做出这些决策方面发挥核心作用。\n\n在这个阶段，你也在定义在 AI/ML 模型中使用的最佳特征。我们在前几章讨论了特征工程。简单回顾一下，这是指你在数据集中寻找用于训练模型的主要方面或特征。你可以将特征视为在模型准备和训练中包含最重要的单个数据列。你也不希望将此完全留给你的数据科学家、工程师和架构师。作为产品经理，你需要深入参与并了解将被选为训练模型中最相关和最终输入的各种特征，这些模型将构成你的产品。\n\
  \n一旦确定，这就是为支持此数据馈送而建立数据管道的阶段。对你如何为组织和产品建立健全的数据收集和准备、数据存储以及数据管道实践有良好的把握，在此步骤中也至关重要。这些数据实践将使你能够利用数据用于内部用例和传统分析，它们也将成为你的\
  \ AI 产品的真正基础。虽然通常会有数据团队处理这些问题，但 AI 产品经理了解这些决策如何从资源管理和规划的角度影响其产品的效能和成本是很重要的。\n\n\
  到本阶段结束时，你应该能够回答以下问题：\n\n- **我们需要什么样的数据才能使这个 MVP 成功？**\n  确定用于训练和模型开发所需的数据类型，以确保你最终选择的模型能够为高性能和高准确度做好准备。\n\
  - **组织目前是否没有投资于支持此 MVP 成功的基础设施需求？**\n  确保组织的数据管道和存储解决方案足以处理 MVP 需要的适当支持的数据量和种类。哪些约束或限制会影响你的数据基础设施？\n\
  \n到本阶段结束时，你应该具备以下内容：\n\n- **已测试的方法和模型的文档：** 这应包括经过评估的强力模型候选者，以及用于评估其性能的指标。用于选择最终模型或模型集合的标准应明确定义导致选择的业务和技术因素。包括这些模型是如何被测试的，以及是否存在可能无法在真实条件下良好扩展或泛化的担忧。这还应包括任何\
  \ A/B 测试结果、队列分析以及用于各种模型的置信区间的文档。\n- **MVP 的明确可接受性能阈值：** 包括内部利益相关者和终端用户都可接受的精度、准确度和其他性能指标的阈值。这将有助于确保\
  \ MVP 在部署后表现良好，并且在性能低于此阈值时集成触发器、日志和警报，将确保你的团队在出现性能问题时保持主动。识别潜在风险，例如偏差或随时间推移的性能下降。\n\
  - **数据科学家和 ML 工程师为使 MVP 成功所需工具、资源或基础设施：** 除了支持数据管理所需的基础设施外，还需要支持 AI/ML 团队的基础设施。确保你的技术团队拥有开展有效研发所需的一切，包括平台、计算能力和支持其工作的其他工具。\n\
  - **将模型选择和性能与业务目标和客户需求联系起来的产品需求和用户故事：** 通常，当我们构建和思考技术投资和限制时，我们正在优化资源。但请记住将技术与最重要的事情联系起来：为目标用户提供价值。围绕正在进行的研究创建一个叙述，并说明它如何影响客户、用户以及整体业务的成功。\n\
  - **完善和迭代 MVP 的计划：** 请记住 MVP 只是起点。从那里开始，你对产品进行未来迭代。MVP 如何持续改进？你的模型将如何重新训练？多久一次？新数据和性能反馈将开始围绕你的\
  \ MVP 形成动力，因此请制定计划来把握这一动力。\n\n## Phase 4 — Deployment\n\n我们在这里使用部署作为一个总称，指的是研发阶段之后发生的一切。此时，你已经确定了一个或一组模型，该模型满足你的产品构思和\
  \ MVP 要求，并得到数据基础设施的支持，并且经过了彻底的测试。现在，你准备好构建支持基础设施，以确保该模型及其输出可以集成到最终用户将体验到的更广泛产品中。这是部署阶段，你将数据科学家和\
  \ ML 工程师的工作与全栈开发人员的工作结合起来，并将其真正集成到将支持这些 AI/ML 输出的更大产品中。\n\n你的产品可能有许多 *features*，其中只有几个是\
  \ AI 功能，或者你的产品的核心可能是 ML。无论你的产品在 AI 方面的根基如何，你都需要将从投入时间构建的模型中得出的 ML 发现部署在更大的 UI/UX\
  \ 上下文中。由于必须在你的 AI/ML 代码和生产代码之间进行这种整合的舞蹈，你也可能会经历自己的部署研发阶段。选择合适的 ML 模型和技术是一个独立的过程，与选择展示和使用该\
  \ ML 研发输出的合适方式以及如何维护这些输出是分开的。\n\n部署阶段的更广泛背景实际上是创造 ML 输出的连续性和交付。这也是你将围绕产品持续维护和交付创建流程和结构的地方，这些流程和结构已在第\
  \ 2 章中概述。\n\n以下是本阶段你应该已处理的一些方面：\n\n- **将 MVP 集成到你的产品或平台中的考虑：** 确保前端和后端系统完全集成到你的\
  \ MVP 中，以便 AI 功能和 UI/UX 无缝融合。记录部署过程和模型如何集成到 MVP 中的细节，以便知识得以保留并易于转移。\n- **生产基础设施已为模型服务做好设置：**\
  \ 生产中使用的模型需要保持可扩展、可靠和响应迅速。维护适当的微服务、API、容器或平台，以保持模型在生产中的部署顺畅。\n- **模型监控和维护的自动化：**\
  \ 设置触发器、日志和标志来监控生产中的模型，并在性能低于你设定的阈值时提醒你。跟踪性能和检测潜在问题可以触发在最需要时进行模型再训练或更新。确保你的 MVP\
  \ 建立了管道，以确保为其提供动力的模型随着新数据的收集和使用而保持相关性。通过压力测试模型来保持性能标准，以确保生产性能指标与第 3 阶段设定的预期一致。\n\
  - **生产后来自客户和用户的反馈循环：** 无论是通过产品调查、问卷、客户电话还是焦点小组，拥有收集和应用对 MVP 的用户反馈的方法将有助于识别改进领域并最大限度地减少边缘情况或非预期偏差。\n\
  \n现在我们已经介绍了 AI 产品开发生命周期的各个阶段，让我们关注首先让魔术发生的人：AI 产品团队。为新的 AI 产品组建新团队很棘手，而且很难为产品的需求充分招聘。每种产品和公司都有不同的需求，因此我们将在本节中尽可能保持客观。\n\
  \n\n\n\n\n## AI/ML/data 策略师/架构师\n\n这对大多数公司来说将更像是一个咨询性角色。理想情况下，此人将帮助获取人才，并制定方法论和工作流程，以支持您的\
  \ AI/ML 功能/团队的整体运作。这可能是您在 AI/ML 之旅开始时聘请的角色，以帮助做出关于为 AI 项目或产品团队的各个角色招聘谁、您的技术栈应包含什么，以及与实验和部署相关的某些工作流程应如何设置的关键决策。\n\
  \n此人可能在您的产品开发的规划和初始阶段（前 6–8 个月）留任，也可能在资源更充足的环境中作为产品经理留任。此人理想情况下也应精通 AI 伦理原则。如果您是一家初创公司，并且从零开始创建公司和产品，这可能是您的技术联合创始人，能够担任您的技术决策者。此角色也可能被称为数据架构师角色。\n\
  \n## 数据工程师\n\n我们已经有了 AI 产品/项目团队如何运作的架构师；现在，我们将根据与 AI 策略师合作得出的蓝图，由数据工程师开始为我们的数据管道奠定基础。如果您从零开始建立\
  \ AI 产品，请寻找能够帮助支持您团队数据工程理念选择的数据工程师。请注意，此人不应向 AI 产品经理寻求正确的数据设置。相反，他们将向 AI 产品经理说明各种数据工程选择对\
  \ AI MVP 的意义。\n\n您将使用数据网格、数据织物、数据湖还是数据仓库？由于您正从头开始为 AI/ML 原生产品建立此功能，您希望聘请一位有信心和经验来指导您进行适当设置的人。迁移和更改您的数据架构可能代价高昂且耗时。如果您在开始时就获得所需的帮助，将为您节省潜在的麻烦，并为您提供可持续、可扩展的基础设施，让您充满信心地成长。\n\
  \n## 数据分析师\n\n许多公司的路径是在开始用 ML 扩展这些分析之前，先在已建立的数据分析基础上进行建设。传统的操作顺序是通过首先聘请出色的数据分析师来获得对数据的清晰度和控制权，他们将迅速弄清楚您已有数据中哪些内容有趣且值得探索。在此角色中，您正在寻找能够以好奇心和探索精神快速分析您的大量数据的人。\n\
  \n此人可能是您的专家查询制作人员，与您的数据工程师协同工作，通过您建立的工作流程传递查询，以驱动您的 AI/ML 产品。这些招聘还将改进您内部使用的分析，以改进内部流程，以及您通过产品或平台的仪表板\
  \ UI/UX 向客户传递的分析。\n\nUI/UX 的全部内容是如何最有效地为终端用户提供价值。最大限度地减少挫败感来源并激发愉悦时刻是此功能的主要关注点。优秀的\
  \ UI/UX 设计师或研究人员将指导您产品可见的更改，您的终端用户将体验到这些更改。此角色是 AI 产品经理的关键合作伙伴，因为它可以帮助验证客户痛点或市场战略决策。虽然面向市场和产品团队可能会基于数据做出决策，但\
  \ UX 研究可以提供客观的第三方视角。我们建议让此功能保持持续参与，以便您在构建产品进一步迭代时从用户那里学习，这些迭代最符合您的用户——以及由此延伸的他们的买家——的认可。\n\
  \n## 客户成功专家\n\n通过 UI/UX 设计和研究进行倾听的适当渠道很重要，但最终，您的客户希望您也能回应——而不只是通过产品本身。如果您正在创建 B2C\
  \ 产品，您可能不需要庞大的客户成功团队，但如果您向其他企业销售 AI/ML 产品，您肯定需要。客户成功团队的存在是为了确保您的客户正确使用您的产品并从中获得预期价值。\n\
  \n他们也是您数据和 AI/ML 功能的绝佳反馈来源。客户成功专家为 AI/ML 产品提供反馈循环，使其能够随着时间的推移而构建和改进。他们在帮助扩展产品功能以及与产品协作确定终端用户可能非常喜欢看到的潜在新功能方面也非常有帮助。如果您是\
  \ AI/ML 产品经理，请确保您与客户成功团队保持温暖开放的关系，因为他们是您在第一线最大的知识来源。他们是真正与您的客户交谈的人！\n\n## 营销/销售/面向市场团队\n\
  \n这另一个很可能在您产品开发之旅的开始和整个过程中参与的团队。我们将销售和营销归为面向市场，因为这本质上就是此功能所做的。它向您的市场传达信息：您潜在客户的整个格局。在这里，您将结合您的技能组合来优化您的产品语言契合度或市场将看到的关于您产品的[content]\n\
