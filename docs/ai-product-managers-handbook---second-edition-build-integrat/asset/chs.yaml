  \n- 跟上 AI 世界的步伐并保持学生心态\n- 扩大你的社区并回馈他人\n- 深化你在专业网络中的足迹\n- 预测 AI 产品经理职业路径中的未来趋势\n\n\
  我们将以一个案例研究示例结束，展示一位资深 AI 产品经理为保持其在该领域的地位可以采取的实际步骤。\n\n## Projecting — what’s your\
  \ ideal AI PM roadmap?\n\n当你继续经历拥抱挑战、反思它们、从他人那里获得反馈并最终与他人分享你的经验教训时，你会开始在困难周围形成一种厚茧。经历足够多的挫折并在之后取得胜利后，它们不会再像以前那样影响你。你不会再对周围的经历那么有反应。然后你就能完全主动地拥抱未知。从完全拥抱成长心态中形成的厚茧将使你具有职业韧性和坚持不懈地朝着你真正想要的职业努力的决心。这就是乐趣开始的地方！根据你的雄心程度，你会开始感受到你想要移动的速度有多快以及方向如何。\n\
  \n挑战能教给我们很多东西，而那些能够拥抱挑战、对经历进行自我反思、寻求并整合反馈、并与他人分享知识的人将建立足够的韧性和对自己的理解，从而规划他们在 AI 产品经理职业中的方向。建立\
  \ AI 产品经理路线图是关于探索你专业思维和工作的演变。最初，你可能会对挑战感到抵触和反应，但随后你会成长为一个更具好奇心的自己。在更高级的阶段，你会更主动地掌控自己的职业并更具体地塑造自己的未来。\n\
  \n在以下各节中，我们使用了级别来确定职业里程碑，你可以用它们作为建议来开始构建自己的 AI 产品经理职业路线图。\n\n## Level 1 — building\
  \ a foundation\n\n在这个级别，你正在为你的教育背景和技能建立基础。我们在第 17 章中涵盖了很多这些领域。请随意参考该章节以了解有关如何开始\
  \ AI 产品经理职业路径的更多背景。这个级别完全是关于选择你想要踏上的学习或教育路径，以及你将如何获得早期实践经验。它塑造了你对该领域的理解，并帮助你获得在其中发展的必备能力。在这个级别，这很可能看起来像是一次实习或你的第一个初级职位。你也将在此开始形成你的专业网络的早期阶段。\n\
  \n以下是一些入门建议：\n\n- 选择你是否想要走正式或在线课程路线来获得技术技能。思考你的预算、时间限制和个人学习风格，以了解你在更结构化或更易获取的环境中是否更能茁壮成长。\n\
  - 寻找与你的价值观和职业抱负产生共鸣的公司的实习机会，以获得实践经验并了解在技术环境中工作的动态。\n- 考虑像产品分析师或初级产品经理这样的初级职位，它们可以为你提供进入产品管理或数据分析的温暖介绍。\n\
  - 加入专注于数据、AI 或产品管理的专业团体，开始形成你的专业社区。\n- 寻找在 AI 产品管理或相关领域有经验的导师，他们可以分享经验并指导你如何推进职业生涯。\n\
  - 建立你的专业品牌并在 LinkedIn 上与人建立联系。向他们询问他们的工作、日常职责、职业路径以及对行业及其发展方向的看法。\n- 以好奇心和决心拥抱这个阶段！开始总是困难的，但如果你以正确的能量去做，你的努力会得到回报。\n\
  \n## Level 2 — strategic growth\n\n到第 2 级时，你已经在 AI 产品经理职业路径中工作了好几年。此时，你已经积累了一些经验，并准备好承担更高级的课程或更复杂的\
  \ AI 产品。你还通过所承担的角色深化了你的产品经理技能。由于你拥有更多应用型产品管理经验，你在制定战略计划、路线图、市场分析和用户研究方面更加游刃有余。此时，你还拥有一个丰富的案例研究、贡献、项目和你支持过的产品的作品集。你对自己的能力更有信心，并且对更复杂的挑战感到兴奋。\n\
  \n以下是确保你继续成长的建议：\n\n- 确定你的技术知识可以在哪些领域扩展或加深，无论是与 AI/ML 模型和算法、数据分析工具，还是与你正在从事的工作相关的\
  \ AI 框架有关。\n- 如果你正在从事的工作在 NLP、计算机视觉或云计算等领域越来越专业化，请考虑更专注的认证或课程来扩展你的知识。\n- 决定是否有任何项目你可以承担，以帮助你获得更深入的技术专业知识或给你更多与数据科学或机器学习工程团队合作的经验。\n\
  - 盘点你需要加强的产品管理技能。参考第 18 章中涵盖的工作帽，以帮助你评估你希望改进的 AI 产品经理角色的哪些方面。\n- 当你积累经验时，重要的是要在作品集、LinkedIn\
  \ 或其他公共网站上记录你所有的产品/项目/案例研究，以证明你作为 AI 产品经理的技能、成长和贡献。\n- 保持与你建立的专业社区的积极联系，并寻求参与 AI\
  \ 产品经理论坛、工作坊和聚会的機會，以更深入地与你的同行和导师建立联系。\n\n\n\n\n## 第三级——专精与领导\n\n在第三级，你可能已经在AI的某一领域或特定行业实现了专精。在这一级别，你对团队管理的意义有了更深的理解，工作的范围也更广。你的关注点已转向在组织内构建围绕AI和产品管理的文化。你可能接受过领导力培训，或培养了软技能，以应对潜在冲突和高层谈判。你还在战略举措中扮演更积极的角色，并通过在会议上的演讲或知识分享机会与专业社区公开互动。在这里，你工作的影响力和辐射范围显著扩大。\n\
  \n以下是一些扩大影响力的建议：\n\n-   反思你对当前所处的行业/人工智能技术方向是否满意，以及你现在的道路是否符合长期的职业抱负。当然，你随时可以做出改变，所以请思考工作中哪些方面最让你快乐或最有意义。\n\
  -   盘点一下其他让你感兴趣的行业或AI专业方向。研究趋势，或是参加行业或专业方向的会议和活动，与他人建立联系。\n-   寻找领导力培训机会，让自己成为更有效的沟通者、谈判者和冲突解决者。\n\
  -   寻找关于情商、团队动态和战略决策的领导力培训项目或工作坊，以打造有效领导团队的工具和技能。\n-   从你尊重和信任的人那里寻求关于你在大型项目、范围和产品上有效性的建设性反馈。\n\
  -   根据反馈识别你在能力或技能上的差距，并以此为依据制定你的职业发展计划。\n-   在职场中主导战略举措，让你的工作更可见，并展示你管理复杂项目和推动组织变革的能力。\n\
  -   想办法与你的职业网络分享你的工作，在会议上发言、参加小组讨论，或尽你所能为你尊敬的出版物撰写文章。\n\n## 第四级——照亮他人的光\n\n在这一级别，你已成为大师。你的专业能力得到了认可。你可能会经常与他人分享你的想法和最佳实践，并围绕你的AI产品经理工作建立了一个品牌。你甚至可能获得了更高的学位，或因工作成果而发表过文章。也许你甚至创办了自己的出版物。你的重心已转向扩大你在AI专业领域或行业的思想领导力和影响力。你还很可能经常在大型会议和活动上发言，并担任小型科技公司的董事会成员。你深度参与专业社区，并为下一代AI产品经理提供指导。\n\
  \n以下是一些保持精通的建议：\n\n-   在发表的论文、博客、书籍或演讲活动中，找到可以纠正人们对AI产品本质、AI伦理考量或AI产品经理角色的假设或误解的地方。\n\
  -   寻找能激励初级AI产品经理的有效话题，并为他们提供真正反映其可能性的指导。\n-   与你的职业社区和学员分享你的历程、遇到的挑战，以及助你成功的策略。\n\
  -   考虑创建你自己的导师计划、工作坊或网络研讨会，专注于为正在探索自己道路的他人提供实用建议。\n-   运用你成熟的技能、知识和专长，为那些为世界带来真实且美好价值的初创企业做出贡献！\n\
  -   以慷慨的精神和提携他人的愿望拥抱这一阶段。你展现了奉献精神和干劲才走到这里。向他人展示如何享受自己的成就。成为他人的灯塔！\n\n## 学习——保持信息灵通与灵感\n\
  \n我们在第17章中讨论了在初入职场时提升技能和建立技术知识的重要性。但一旦你在职业中成熟起来，你就不再是“提升技能”了。你是在保持知识，并让自己在领域中保持相关性。在本节中，我们将探讨如何在你AI产品经理职业生涯进入更成熟阶段时，以可持续且富有灵感的方式继续学习。这里的关键词是“可持续”。这个领域恰好总在快速变化，这意味着总有你可以做的事情来保持领先。我们将探讨各种方法，让你以可控且可持续的方式跟上AI和产品管理的最新进展，从而在工作中持续获得灵感。\n\
  \n随着你在AI产品经理职业生涯中不断成熟，你需要关注的关键领域包括技术技能、产品管理技能和软技能。所有这些都可以通过三个主要途径来拓展：通过思想领导力建立你的职业品牌，通过认证和学位增强知识，以及通过职业发展磨炼技能。在接下来的章节中，我们将审视各种方法，让你能够在所有这三个领域学习和保持信息灵通，以维持作为AI产品经理的全方位背景。\n\
  \n### 思想领导力\n\n我们每个人都会将不同的兴趣、价值观和技能带入AI产品经理的角色。建立一小批你强烈认同的思想领袖，是一种基于他们的想法与领域内其他人建立联系的方式。这是人类体验中最美好的概念之一：我们仅仅通过他人思想的质量，就能跨越时空与之产生连接。当你作为AI产品经理逐渐成熟，你会对自己接受的信息更具辨别力。在刚刚起步时，很难判断谁值得追随。\n\
  \n在网上、大学或会议上，不乏AI、数据、机器学习、产品管理或领导力的影响者和思想领袖。他们中的许多人会重复许多相同的观点，希望借此获得关注和名声。但当你定期阅读AI、产品或科技行业的通讯、博客、文章和白皮书时，你会开始发现少数脱颖而出的人。记下那些启发你的人。确保他们是信誉良好的专业人士，你觉得他们确实有真知灼见。\n\
  \n一位激励我的AI产品经理思想领袖是米拉·穆拉蒂（Mira Murati）。穆拉蒂一直是AI伦理影响的积极倡导者，并强调开发者创建安全、透明、符合人类价值观的系统的重要性。她监督了ChatGPT和DALL-E等强大AI模型的开发，她围绕负责任AI使用、凸显AI风险和社会影响的公开讨论令人钦佩，尤其是考虑到她推向市场的产品已经取得巨大成功并被广泛使用。她曾在特斯拉和OpenAI担任多个重要职位，并在一个以男性为主的行业中展现出驾驭这些动态的力量，最终在萨姆·奥尔特曼短暂离职期间出任OpenAI的临时CEO。穆拉蒂作为AI领导者和实践者激励着我，她是科技领域可能性的光辉典范。\n\
  \n你允许进入内心世界的思想领袖，会对你自己的人生观和工作观产生影响。他们会影响你在工作经历中的决策方式，并最终在你职业生涯塑造中发挥作用。让好奇心引导你，并养成每周或每月关注他们的文章和最新作品的习惯。你永远不知道：随着职业发展，你最终可能与他们建立联系、会面，甚至共事。为了周全起见，在AI产品经理角色的各个层面——领导力、沟通、产品管理、数据和AI——都要拥有你认可的、乐于连接的思想领袖。\n\
  \n### 认证与学位\n\n随着你不断成长和探索想从事的AI/ML领域，获取更多认证和课程可能是填补你技术背景或软技能理解方面空白的绝佳方式。如果你想在AI的新领域深化知识或专长，你甚至还可以参加更多训练营或攻读更高的学位。\n\
  \n我认识一位AI产品经理，他离开了企业职位，去攻读深度学习博士学位，在学术界待了几年，然后回到私营部门专注于深度科技初创企业。虽然这听起来有点曲折，但这位人士在从繁忙中抽身休息后重返职场，感觉焕然一新。学位和专业认证也可以在AI产品经理角色的转型中发挥作用。也许你想成为一名更专注于以用户为中心的设计或市场策略的AI产品经理。或者你确信自己想参与AI产品经理团队的高层管理。当你希望在职业轨迹中让某个重要领域或重点更加突出时，可以利用这些工具。\n\
  \n\n\n\n![](img/a0c9f9a2ba06a06d309ce21d890a47c6_453_0.png)\n\n一提到深化知识，我想到的是课程和学位；但一提到精进技能、获取工具，我想到的是职业发展。你可以把它们看作目标各异的不同领域。职业发展主要围绕工作坊、研讨班和会议展开——这些都是深化专业能力、提升工作效能的方式。虽然认证和学位侧重于通过学术空间来深化应用性、技术性技能并建立公信力，但职业发展更偏向行业导向。\n\
  \n## 职业发展\n\n你当然不必只靠集训营和学位来保持技能精进。还有很多更容易消化的方式，帮你填补职业背景中的技能或领域空白。或许你可以参加一次工作坊或研讨班，向专家学习；或许你只是去参加一场会议，了解AI产品经理领域中那些你之前从未想过的新方向；甚至你也可以加入一个读书会。此外，还有线上学习课程、讲座和网络研讨会，你可以报名参加，获取新技能和洞见。\n\
  \n随着职业发展越来越深入，你也可以开始自己组织这类活动。在我职业生涯早期，做的最有益的事情之一就是开始组织围绕“AI领域的女性”相关活动。有些活动是AI创业者的演讲；有些则是业内女性从业者的分享。偶尔，这些分享会变成完整的工作坊——演讲者会概述他们做过的项目，并分步骤讲解他们如何收集产品需求、数据和反馈，以部署和发布某个具体的AI应用场景。\n\
  \n投入一个工作日或偶尔一个周末来做这类事情，会产生更大的长期影响，因为你的视野会一次次被拓宽。它们也是检验你想强化哪些领域的好方法。有没有某些你一直好奇但尚未投入太多时间的技术技能？你是否对领导力感兴趣，却缺乏信心或沟通技巧去尝试？让职业发展体验保持适当频率，意味着你会有充足的时间把从这些小型活动中获得的信息和洞见，融入到你自己作为AI产品经理的工作中。小小的种子蕴含着巨大的潜力，所以不妨从小处着手，看看它们是否能激励你为职业发展采取更具体的行动。\n\
  \n下面是一些你可以采取的实际行动，以保持一条适合你自己的学习路径：\n\n- 设定短期和长期目标。你想学习一套新技能、一门编程语言、一个工具或框架吗？你想在AI的某个特定领域获得专长吗？明确你想学什么，以及它为什么会对你的职业有帮助。\n\
  - 建立一个可持续的计划。你能按周或按月持续学习吗？\n- 明确哪些学习路径适合你。你更喜欢慕课（MOOC）还是攻读高级学位？\n- 寻找鼓舞人心的阅读材料。有没有什么书籍、博客、学术期刊或研究团队能够引起你的共鸣？\n\
  \n## 建立人脉——深化你与专业社区的互动\n\n与你的专业社区保持联系有两个目的：\n\n- 它能让你通过他人的工作和洞见不断学习和成长。\n- 它也能让你与那些最懂你的人分享你自己的洞见、成功与失败。\n\
  \n多年来，“建立人脉”这个词已经背上了一些不好的名声。它让人想到闷热的房间里挤满了陌生人，在那里你必须强装勇敢和自信来“四处周旋”。也许你给自己定一个可量化的目标：“今天认识五位新的AI产品经理。”或许你确实和他们聊了天，交换了几句话，但并没有产生什么有意义或特别实质的内容。你做了该做的事：你出了门，见了五个陌生人，然后从待办清单上勾掉了“建立人脉”这一项。这些联系充其量只是温吞水，整个过程最终也毫无满足感可言。\n\
  \n但那不是真正的建立人脉。那只是打着建立人脉旗号的个人品牌传销。真正的建立人脉，是与那些能真正引起你共鸣的人建立联系，形成一张安全网。这张安全网应该建立在真实、真诚的基础上。这些人应该是当你感到困惑、沮丧、害怕、好奇或受到启发时可以求助的对象。你不必和他们成为挚友，但你应该能与他们分享一些脆弱之处。如果一个专业人脉网在你需要指引或安慰时无法支持你，那它还有什么意义呢？\n\
  \n当你开始与同行建立真诚的关系时，要制定那些让你感觉自然的策略，并超越纯交易式的人脉往来。先从给予开始。也许你可以在不求回报的情况下，为你认识的人提供背书或推荐。或者你可以主持一场分享会，在组织或人脉中组织一次关于成功与经验教训的交流活动。在这个人们常常被有所求的人接近的世界里，通过先付出价值再提出请求来展现情商，会让你脱颖而出，并为持久而有意义的专业关系奠定基础。\n\
  \n随着你越来越自信，并开始通过自己的渠道分享更多工作内容，你的专业人脉网会让你保持真诚。当你开始围绕自己的工作打造面向公众的品牌时，其中许多人会成为你最坚定的支持者。以下是关于如何逐步参与专业社区的一些建议：\n\
  \n- **线上社区：** LinkedIn、Slack和Discord是支持各类小众群体的强大平台。维持专业社区的一个简单方法，就是经常发帖和评论。除了发帖和评论，你还可以推广自己的文章、作品集，或你所参与的活动。你可以把这些看作漏斗中最大的部分。当然，随着时间推移，你可能会在这里建立一些更深层的联系，但如果你不设法让这些联系融入自己的生活，许多联系会越来越弱。\n\
  - **会议：** 行业活动和知名会议是在同一屋檐下同时见到很多人的绝佳方式。因为你是亲自到场，所以在会议上结识人并自然建立联系的机会更大。你去得越多，就越可能遇到以前见过的人。特别是如果你正在线上与人保持联系，你可以确保腾出时间与那些线上认识的人见面，把他们拉回当下。会议是聆听同行资深从业者演讲的好机会。而且会议通常还有官方日程之后的欢乐时光、余兴派对和音乐活动，所以你与人建立更深层私人联系的机会也更高。\n\
  - **线下聚会：** 定期的线下聚会，尤其是在大城市，非常普遍。通过线下聚会，你可以在不必面对人山人海的情况下获得会议的部分好处。你能获得许多面对面见人的社交收益，而且无需花费那么多钱。它们还提供了更深层联结的机会，因为你常常会一次次见到同样的面孔。在本地线下聚会中，归属感的机会最高，因为你知道自己是在与住在附近的人建立联系。\n\
  - **导师关系：** 随着你在整个职业生涯中通过上述各种途径不断扩大人脉网络，你最终会开始与一些人建立更紧密的关系。其中许多紧密关系会承担导师的角色。导师并不需要在职业上比你有显著成就。有时他们甚至可以和你处于同一层级。但他们是当你需要指引时可以求助的人。你不可能把自己的所有职业联系都变成真正的导师，但从本质上讲，那些你允许进入核心圈子的人有能力为你提供指导。把那些你信任和尊重的人留在身边，并在力所能及时回馈他们。\n\
  \n## 成长——学生成为老师\n\n作为学生学习和成长是一回事，但将那些知识和指导转化为真正的智慧又是另一回事。在很大程度上，作为AI产品经理，你将一直在学习。但到了某个阶段，你将能够回馈。成长就是利用亲身经验来提升自己作为AI产品经理和作为人的能力。在本节中，我们将探讨成长心态，以及对其应用贡献最大的几个领域。\n\
  \n### 拥抱挑战\n\n随着你在AI产品经理职业道路上不断成熟，你最终会遇到重大挑战。也许你一直在开发的产品就是无法达到满足客户和用户期望所需的性能目标。或者更糟，也许它达到了目标，但你仍然在努力实现产品市场契合度，或建立稳定的用户基础。也许你从市场或竞争研究中学到的主要教训之一，是关于为即将到来的功能整合一种你尚未使用过的新型机器学习方式。无论挑战是什么，保持好奇心并拥抱挑战，才是穿越困境的道路。\n\
  \n\n\n\n\n我明白这说起来容易做起来难，尤其是在你需要在种种纷扰中平衡领导者的期望来保住工作时。AI 产品经理的角色面临着来自各方的挑战和压力。平衡伦理考量、技术限制、监管合规、高用户期望、AI\
  \ 系统的复杂性以及技术创新，给 AI 产品经理带来了巨大的负担。AI 系统的复杂性往往会带来不可预测的结果、数据偏差以及可解释性问题，这增加了开发和部署的难度。\n\
  \n但将这些挑战视为机遇会带来变革性的效果。把它们作为催化剂来培养新技能或提升你的问题解决能力。做的越多，当它们出现时你就越有韧性。拥抱成长型思维意味着你相信自己能够通过挑战变得出色并取得成功。坚持、学习和努力是变得更有能力的方式这一理念非常强大。这意味着你不会让失败定义你。我甚至要说，在挑战发生时保持乐观，是产品经理的基础技能之一。\n\
  \n想想看；当他们沮丧时，你经常需要成为激励和鼓舞你工作伙伴的人。但在你的组织里，谁能为你做到这一点？在许多情况下，企业环境可能很残酷；我们往往不得不成为自己的啦啦队长。但这不一定是坏事。如果我们从未经历过挑战，我们就会止步不前，我们的工作会始终出色但枯燥。追求只有在风险很高时才有意义。冠军都是在挣扎中锻造出来的。你主宰这种挣扎的能力，不让它吞噬你或强化你的无能，才会让你不断成长。\n\
  \n要想找到 AI 产品经理如何掌握拥抱挑战的艺术的强大范例，我们可以看看李飞飞，她是斯坦福大学人机交互人工智能研究所的联合主任，也是 Google Cloud\
  \ 前 AI/ML 首席科学家。李飞飞是一位令人鼓舞的 AI 领导者，她拥抱并克服了 AI 开发中的重大挑战。她在医疗领域产生影响的有效方式之一是通过与湾区的医院和养老院合作。李飞飞找到了解决与手部卫生相关的行为监测问题的方法，手部卫生是医院感染的主要原因之一。\n\
  \n通过她在开发“环境智能”系统方面的工作，一系列能够追踪医务人员手部卫生的传感器和计算机视觉模型，她能够构建出实时响应人类需求同时最大限度减少因人类观察者带来的偏差的\
  \ AI 系统。得益于她在医院环境中的工作，李飞飞能够防止患者死亡和感染，使 AI 在医院环境中的使用民主化，并找到一种方法将自动驾驶汽车中使用的部分相同能力重新包装以拯救生命。\n\
  \n## 反思\n\n反思是一个强大的过程，它始于拥抱挑战。我们不让挑战定义我们或让我们陷入下行螺旋；我们将其作为反思的机会。我们不能害怕直面我们经历的不足。这意味着回避问题，而这会阻止你做出那些将带来突破的改变和转向，无论是个人还是职业。让自己有勇气去分析和反思你所面临的挑战，以便汲取其中的智慧。了解出了什么问题以及如何防止其再次发生，这就是成长的方式。\n\
  \n无论结果如何，让它把你带向你的专业社区，以对你最有意义的形式。它可以是一篇博客文章、一条 LinkedIn 帖子、一个案例研究或文章、一次演讲，或在科技会议上的展示。与专业社区分享你在\
  \ AI 复杂环境中导航的挣扎和经验教训，是你为专业社区做出真实且切实贡献的一种方式。即使你认为你的挣扎很常见，或者其他 AI 产品经理也遇到过同样的挑战，请记住，没有人是你。你的独特视角具有价值。你永远不知道你遇到的障碍可能会帮助山路上走得没那么远的人。分享你的真实生活经历可以建立人与人之间强大的联系，这些联系可能在未来带来新的合作、工作项目或合作伙伴关系。\n\
  \n以下是在你构建 AI 产品经理职业反馈循环时可以牢记的一些策略和建议：\n\n- 从广泛的利益相关者、导师和同行那里寻求反馈。确保包括数据科学家、机器学习工程师、客户/终端用户、团队负责人以及你尊重并重视其意见的领导团队成员。\n\
  - 记录你收到的反馈以及你为回应反馈而采取的行动。记录你观察到的见解和模式，并反思你如何随着时间的推移在工作或职业中应用它们。让这来指导你与他人分享的职业叙事，最重要的是，与你自己分享的职业叙事。\n\
  - 优先考虑具体且可操作的反馈。模糊或主观的反馈会让你产生更多疑问而不是答案，并可能模糊你作为 AI 产品经理的自我反思。\n- 在对自己能力的自信与认识到成长空间的谦逊之间找到平衡。努力保持这种平衡将增强你的可信度，并激励他人在他们挣扎时与你坦诚交流。\n\
  - 将反馈视为你自身 AI 产品经理职业迭代的必要部分，并在他人与你分享坦诚时真诚地表示感激。\n- 积极成为线上和线下的 AI 和产品经理社区成员，以扩大你的反馈循环影响范围，并寻找有意义地为讨论做出贡献的方式。\n\
  - 与同行或同事合作，共同撰写文章、白皮书或案例研究，解决 AI 产品经理领域的挑战和创新。\n\n## 下一步？世界是我们的蚌\n\nAI 产品经理职业道路的前景充满希望。正如我们在本章中所探讨的，我们讨论了很多关于作为\
  \ AI 产品经理成长和成熟的话题。虽然知道这些很有帮助，但最终，学习不如选择来得重要。我们每个人都拥有自己的一套价值观、兴趣和世界观。随着我们更深入地将 AI\
  \ 整合到产品中，我们将开始看到 AI 方法论的许多重叠。产品将进入市场，采用多学科的方式运用各种 AI 模型。我们将体验到模拟现实与 AI 之间界限的模糊。\n\
  \n我的建议是，尽量不要偏离你认为*应该*存在于世界上的产品。构建无偏见、无害的合乎伦理的 AI 产品和系统，推出符合法规并有益于世界的产品，是集体的责任。创造以人为中心的产品和体验意味着强调用户需求，并以直观、可靠、可信且有益的方式构建\
  \ AI，如果我们要构建一个充满希望的未来，这必须是前进的方向。\n\n随着 AI 转型的继续，我们迫切需要能够证明自己是 AI 负责任管理者的领导者。作为 AI\
  \ 产品经理，我们希望为世界贡献的工作能让我们感到自豪，尤其是在这个关头，许多立法努力都在努力获得所需的立足点，以妥善遏制 AI 的非预期不良后果。归根结底，AI\
  \ 产品经理的角色关乎战略、创新、领导力和激励。这代 AI 产品经理正处于将 AI 整合到重新定义我们生活和工作方式的产品的前沿。\n\n我们应该利用我们的影响力，将增强人类体验而非削弱它们的\
  \ AI 产品推向市场。我们有幸通过我们的工作解决我们这个时代最紧迫的挑战之一。我们可以利用巨大的机遇来建立信任并为世界带来真正的价值。AI 不仅仅是被 relegated\
  \ 到科技行业象牙塔的技术。AI 转型现在无处不在，遍及各行各业，AI 产品经理有独特的机会引领这场转型。世界真正是我们的蚌。\n\n随着我进一步拓展自己的 AI\
  \ 产品经理职业，我希望我的下一章专注于帮助构建解释性 AI 产品，创造个性化、公平的数字体验。我希望我的工作专注于有意义、以同理心为导向的产品设计，以增强人类创造力和生产力。想象一下可能性：在跨职能创新实验室中合作实验\
  \ AI 能力，参与 AI 伦理委员会或 AI 政策塑造。通过构建在高影响力功能与以用户为中心价值观之间取得平衡的 AI 原生框架，我们可以为真正改善人们生活的数字体验做出贡献。我致力于从事与我的价值观和热情一致的产品，我可以全身心投入的产品——你想致力于什么？\n\
  \n## 案例研究\n\nAstrid 是一名拥有超过 20 年科技行业经验的 AI 产品经理，她已成功领导了医疗、金融和零售行业的多个 AI 产品。她通过项目管理和**用户体验（UX）**等前期角色进入\
  \ AI 产品经理领域，其学术背景是商业管理。她的优势包括对市场动态、用户需求、客户旅程、预算和商业战略的深刻理解，以及领导跨职能团队的能力。20 年的从业后，她对所承担的角色更加挑剔，她仍在作为\
  \ AI 产品经理学习和成长。目前，她是专注于各种工作优化工具的科技公司的产品高级副总裁。在本例中，我们将探讨 Astrid 在继续沿着 AI 产品经理的兔子洞前行时可能采取的行动，以及这些行动的影响。\n\
  \n\n\n\n\n## 投射\n\n在职业生涯的投射阶段，Astrid 正在寻找在周围世界产生更有意义影响的方式。随着她作为 AI 产品经理的成熟，她逐渐明确了自己想要从事的工作类型，同时她也能够为下一代\
  \ AI 产品经理提供指导和智慧，例如以下途径：\n\n- **跨职能团队建设：**\n  - **行动：** 随着 Astrid 在现任组织中的晋升，她组建并领导了多个跨职能团队。她营造了一个协作环境，让数据科学家、工程师、设计师和领域专家能够以产品套件为重点，在小组团队中协同工作。\n\
  \  - **影响：** 这使 Astrid 在组织内部确立了受人尊敬且胜任的产品领导者地位，因为它打破了开发、AI 团队和领域专家之间原有的壁垒。通过围绕产品套件聚焦角色，这些跨职能团队能够围绕其关注领域建立团队认同感。\n\
  \n- **发展指导计划：**\n  - **行动：** 由于她的产品组织在她担任高级副总裁时已经变得非常庞大，Astrid 创建了一个指导计划，帮助初级产品经理提升技能，并让他们接触之前未曾涉足的新产品领域。\n\
  \  - **影响：** 这增强了她产品组织整体能力和集体技能。它还为团队中刚刚进入产品领域的人提供了一种培养和成长自身职业路径的方式。\n\n## 学习\n\n\
  在本章前面“学习 – 保持知情和受启发”部分，我们重点关注了 AI 产品经理可以探索的三个主要学习领域，以加深其专业知识。思想领导力、认证和学位以及职业发展都是你在\
  \ AI 产品经理职业生涯中不断进步时保持学习者心态的途径。让我们探索 Astrid 在其学习路径中采取的行动及其影响：\n\n- **AI 技能提升：**\n\
  \  - **行动：** Astrid 必须通过 Coursera 和 edX 等 MOOC 平台报名参加高级 AI 和机器学习课程来补充她的 AI 知识。课程包括深度学习、强化学习和\
  \ AI 伦理的认证。她每两年完成一门新课程。\n  - **影响：** 随着 AI 的持续演进，Astrid 通过每两年一次的学习保持其技术知识的相关性和新鲜度。即使在\
  \ 10 年后，她仍然觉得自己有更多东西需要学习，并将其作为职业生活的优先事项。\n\n- **建立 AI 创新实验室：**\n  - **行动：** 鉴于 Astrid\
  \ 拥有 10 年的职业生涯，她已在组织内部晋升，并在过去几年里领导产品经理团队。作为产品经理主管，她鼓励团队尝试不熟悉的 AI 工具并学习新框架。她还创建了一个流程，让团队能够快速为其\
  \ AI 创新实验室的想法开发 MVP 进行测试。\n  - **影响：** 这在 Astrid 的组织和团队内部催生了创新和实验的文化。它使他们保持敏捷，并对新的\
  \ AI 发展和趋势保持警觉，以便在实验室中进行测试。它还为她的产品组织创造了大量的心理安全感。他们信任她，感觉她是其职业发展和成功的共同创造者。这也鼓励了许多创新想法和解决方案，对公司的收入和用户留存目标产生了积极贡献。\n\
  \n## 网络\n\n更舒适地进行网络拓展是确保你不断扩大同行、导师和潜在合作者生态系统的一种有效方式。职业生涯需要持续的社会机会供给，因为我们的热情在与他人的协作中得以激发。找到一种有意义且真实的网络方式是一种微妙的平衡，但做得正确时，付出是值得的。让我们探索\
  \ Astrid 如何找到网络机会并拓展其专业圈子：\n\n- **积极参与 AI 会议圈：**\n  - **行动：** Astrid 定期参加 AI 会议，并在会议上结识了行业专业人士社区。\n\
  \  - **影响：** 这让她在职业道路上拥有强烈的社区归属感。它帮助她抵御冒名顶替综合征，并定期激励她，因为她与认识超过八年的人保持联系。在劳动力市场艰难时，这为\
  \ Astrid 提供了安全网。多年来，她通过自己选择的 AI 产品经理大家庭获得了多次工作机会，因为她与认识的人建立了信任，始终如一地与他人保持联系，随着时间的推移建立了自然的联系，甚至多次在这些会议上发表演讲。\n\
  \n- **通过学术合作建立富有启发的合作伙伴关系：**\n  - **行动：** 有一天，Astrid 在当地大学参加了一场 AI 讲座，并结识了一位担任大学专业合作伙伴负责人的人。最初，他们谈论的是实习项目，但这促成了战略合作伙伴关系的建立，使她的\
  \ AI 创新实验室能够与大学的研究团队就特别联合项目进行合作。\n  - **影响：** 这为她组织内的 AI 创新实验室提供了所需的动力，以发现将 AI 应用于各种产品用例的新颖独特方式。它创造了一个新兴初级人才的渠道，这些人才在文化上是合适的。该合作伙伴关系还在工程团队需要时为复杂项目提供了额外的\
  \ AI 资源。\n\n## 成长\n\n在职业成熟度的成长阶段，你更专注于扩展你的认知。你寻找机会加深对 AI 专业领域的理解，你希望如何专业成长，以及可能存在哪些盲点。拥抱挑战、反思和扩展反馈循环都是你更深入地探索自身职业的方式。Astrid\
  \ 通过以下行动加深了她对创业世界的参与，并发现了 AI 伦理中的未开垦领域：\n\n- **参与医疗保健初创公司 MVP 工作：**\n  - **行动：**\
  \ Astrid 帮助构思、开发并发布了一款用于医疗保健初创公司的预测分析工具，该工具利用 NLP 预测患者再入院情况。她在此产品之前从未在医疗保健领域工作过，并在参加一次\
  \ AI 创业欢乐时光时遇到了正在寻找具有她 AI 背景的人的初创公司创始人后承担了这一角色。\n  - **影响：** 产品发布后，它已在她所在地区的三家医院实施。她能够积极影响当地社区，为真实的人改善患者结果，并展示她将知识和专业技能应用于新领域空间的能力。\n\
  \n- **设定伦理 AI 标准：**\n  - **行动：** Astrid 主导制定了一项新的伦理 AI 最佳实践标准，供产品管理、数据科学、机器学习和开发团队在为其组织开发\
  \ AI 产品时遵循。推广还延伸到非技术团队，使他们即使在非技术层面也能标记 AI 伦理冲突。她制定的指南涉及公平、偏见、透明度和问责制等议题，适用于所有 AI\
  \ 产品。\n  - **影响：** Astrid 能够通过对伦理 AI 标准的投入来降低可能损害公司品牌的风险。她通过围绕伦理创建基础设施来支持团队，使没有人单独承担伦理\
  \ AI 监督的责任。她还能够使 AI 及其潜在危险对组织内的非技术人员更易于理解。已发布 AI 产品的模型性能和公平性略有改善，这也增强了客户和用户的信任。\n\
  \n## 下一步？\n\nAstrid 的下一步重大举措是找到一种方法，将她在职业生涯各个领域涉及的许多元素结合起来，创办一个属于她自己的创业项目。由于她在 AI\
  \ 创新实验室、AI 会议参与和学术合作方面的工作，Astrid 决定创办自己的 AI 咨询业务。她意识到自己已经通过多年来进行的各种演讲和会议积累了大量人脉。\n\
  \n\n\n\n\n她还与学术界以及参与实验室的团队进行了协作。Astrid 见识过大量项目多样性，并在自己公司构建道德 AI 标准的过程中学到了很多。\n\n\
  由于她对改善患者结果充满热情，Astrid 希望她的咨询业务专注于医疗保健领域。参与基于 NLP 的 MVP 工作让她对自己的工作更有信心，她意识到有很多初创公司她可以像这样帮助。有时一次经历就能点燃新生的目标感。与初创公司合作让\
  \ Astrid 拓宽了视野，了解到赋能团队的新方式。在 MVP 之前，她习惯于更僵化、更企业化的环境，并且没有考虑过当她多年经验应用于能够真正受益于她的初创公司时，她的工作会有多么宝贵。\n\
  \n总体而言，这些各种行动和影响促进了 Astrid 在其领域作为 AI PM 领导者的有效性。首先，它让她保持对学习和作为从业者成长的投入。但这些集体行动也为她下属的其他人学习和成长创造了途径。她能够定期保持团队的敏捷性和灵感。跨职能团队学会了相互信任，这导致了对业务问题的更有启发性的解决方案。这也让每个人，包括\
  \ Astrid，变得更有韧性。Astrid 对持续学习、创新领导力、道德 AI 实践、团队管理和战略的承诺使她成为 AI PM 的成功案例。因此，她能够在自己的领域保持相关性和竞争力。\n\
  \n## Summary\n\n我们从本章开始介绍了随着你通过各个 AI PM 成熟阶段成长时，成长看起来是什么样子的，并看到了你在这些阶段中进步时学习的几个不同领域。我们介绍了有效\
  \ networking 的主题以及它在保持长期职业生涯充满活力的作用。我们以能够在高级阶段提供成长来源的做法和习惯作为结束。\n\n当我们结束本书时，请记住，在\
  \ AI PM 职业路径中达到成熟不仅仅是成为 AI 产品技术方面的专家——从构思到部署；它还在于培养将定义你成为这一不断发展领域真正领导者的韧性、愿景和适应能力。不断磨练你的技术敏锐度与培养你需要支持成功和道德产品发布所需的技能之间将始终存在持续的舞蹈。你越是进步，挑战就越感觉不像障碍，而更像是通向对你的工作和你自己更深见解的途径。\n\
