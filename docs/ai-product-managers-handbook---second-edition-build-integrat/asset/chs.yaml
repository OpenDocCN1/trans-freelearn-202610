  \ PDF 和其他福利发送到您的电子邮件。\n\n## 1\n\n## 了解构建 AI 产品的的基础设施和工具\n\n人工智能产品的前沿看起来很像我们的宇宙：不断扩张。随着我们更深入地以新的方式概念化我们所参与的产品、组织和行业，每年扩张的速度都在加快。奠定坚实的基础是理解这一转型的必不可少的一部分，这也是本书的目标。由于我们生活的几乎每个方面都预计会以某种方式受到\
  \ AI 的影响，我们希望您在经历这一过程后，对 AI 采用将如何影响您支持的产品或希望有一天构建的产品更有信心。\n\n本书的第一部分将作为全景概览。我们将涵盖术语、基础设施、AI\
  \ 算法类型以及做得好的产品，到本部分结束时，您将了解在尝试构建 AI 策略时需要考虑的各种因素，无论您是希望创建原生 AI 产品还是为现有产品添加 AI 功能。我们将在第一部分介绍理论概念，并将在第二部分和第三部分用于更实用的内容，在那里我们将更具体地看到这些理论概念的应用。在第四部分，我们将讨论您如何构建和发展您的\
  \ AI 产品经理职业生涯。\n\n管理 AI 产品是一个高度迭代的过程，产品经理的工作是帮助您的组织发现基础设施、培训和部署工作流程的最佳组合，以在目标市场中最大化成功。AI\
  \ 产品的性能和成功在于理解管理 AI 管道的所需基础设施，其输出随后将被集成到产品中。在本章中，我们将涵盖从数据库到部署策略再到您可以用来管理 AI 项目的工具的一切，以及如何衡量产品的有效性。\n\
  \n本章将作为第一部分后续章节的高层次概述，但首先它将提供术语的定义，这在当今营销主导的 AI 竞争格局中往往很难获得。这些天，感觉每个产品都是 AI 产品，营销部门对这个术语的使用毫不犹豫，使其几乎毫无用处。我想写这本书的一个重要原因是我自己在希望尝试理解各种“AI”产品时在竞争格局中导航的挑战。\n\
  \n我觉得如果我在使用 AI 时难以理解市场上产品的构建方式，鉴于我对机器学习的熟悉，那么其他人又有什么希望呢？我怀疑这在短期内不会改变，但消费者和客户对 AI\
  \ 的能力和具体细节的流利度越高，**机器学习 (ML)**、**深度学习 (DL)** 和数据科学，我们就越应该看到关于产品如何构建和优化的清晰度。了解 AI\
  \ 的背景对于任何考虑构建或支持 AI 产品的人都很重要。\n\n在本章中，我们将涵盖以下主题：\n\n+   - 定义 – AI 是什么以及不是什么\n+ \
  \  - 旧的 – 探索 ML\n+   - 新的 – 探索 DL\n+   - ML 与 DL – 理解差异\n+   - ML 中的学习范式\n+   -\
  \ 顺序 – 最优流程是什么以及流程的每个部分位于何处？\n+   - DB 101 – 数据库、仓库、数据湖和湖仓\n+   - 管理项目 – IaaS\n\
  +   - 部署策略 – 我们对这些输出做什么？\n+   - AI 中的成功 – 管理良好的 AI 公司如何正确处理基础设施\n+   - AI 的承诺 –\
  \ AI 将带我们走向何方？\n\n## 定义 — AI 是什么以及不是什么\n\n1950 年，一位数学家和第二次世界大战英雄 Alan Turing 在他的论文\
  \ *Computing Machinery and Intelligence* 中提出了一个简单的问题，这个问题是，*机器能思考吗？* 今天，我们仍在努力解决同一个问题。也许现在更甚，因为我们拥有像\
  \ ChatGPT 和 Claude 这样易于访问、功能强大的 **大型语言模型 (LLMs)** 来模糊界限。视你问谁而定，AI 可以是许多东西。互联网上存在许多地图来定义\
  \ AI 的广泛类别，从医疗保健和金融中使用的专家系统到更简单的 ML 形式再到像神经网络这样更先进的模型。随着我们继续本章，我们将涵盖 AI 的许多方面，特别是那些适用于当今市场上出现的产品的方面。就跨行业产品中应用的\
  \ AI 而言，在本书中，我们将主要关注 ML 和 DL 模型的各种应用，因为这些通常在任何营销中使用 AI 时在生产中使用。我们将使用 AI/ML 作为涵盖\
  \ ML 应用范围的统称，我们将涵盖大多数人会认为的 ML 的主要领域，例如 DL、计算机视觉、自然语言处理和人脸识别。这些是大多数人在行业中会遇到的应用 AI\
  \ 的方法，熟悉这些应用将服务于任何希望进入 AI 的产品经理。如果可以的话，我们希望帮助任何希望从另一个产品管理背景扩展到该领域的人选择最吸引他们的 AI 领域。\n\
  \n\n\n\n\n首先，让我们看看什么是机器学习，什么不是机器学习。我们能表达得尽可能简单的方式是：如果一台机器从过去的行为中学习，并且由于这种学习，其成功率有所提高，那就是机器学习！学习是主动的元素。没有模型是完美的，但我们确实从使用模型中学到了很多。大多数模型都会有一些超参数调优的元素，但所有模型在训练过程中都会有学习的参数。每个模型的使用都会产生一定的性能结果，数据科学家和机器学习工程师会用这些结果来衡量性能并加以改进。\n\
  \n如果存在固定不变的硬编码规则，那就不是机器学习。人工智能是计算机科学的一个领域，而所有程序员本质上都在做同样的事情：给计算机提供一套指令让其执行。如果你的当前程序在任何方面都不会从过去学习，而只是按照硬编码的指令执行，我们就不能称之为机器学习。相反，你可能在其他程序中听说过\
  \ *规则引擎* 或 *专家系统* 这样的术语。它们被视为人工智能的一种形式，但它们不是机器学习，因为虽然它们是人工智能的一种形式，但规则本质上是在复制人的工作，而系统本身并不会自行学习或改变。\n\
  \n我们正处于人工智能采用的棘手时期，很难在网上找到关于什么构成了人工智能产品的信息。营销部门急于给产品贴上人工智能标签，但市场上仍然没有一个基准来解释这意味着什么。这进一步让消费者和技术人员都对人工智能这个术语感到困惑。如果你对这些术语感到困惑，特别是当它们被应用到你在网上看到的推广产品时，你绝对不是一个人。\n\
  \n另一个令人困惑的领域是人工智能这个通用术语。对大多数人来说，人工智能的概念让人想起 1980 年代的 *终结者* 系列、2013 年的电影 *Her* 中失控的操作系统，以及其他关于不可避免的技术毁灭的未来主义描绘。虽然我们今天使用的\
  \ AI 确实可能带来很多伤害，但上述电影中的描绘代表的是被称为 *强人工智能* 或 *通用人工智能* 的概念。AGI 是一种理论化的、潜在的未来人工智能状态，在这种状态下，机器可以在没有任何人工监督或干预的情况下执行高价值的经济任务。我们距离\
  \ AGI 这样先进的东西还有一段路要走，但我们已经拥有了被称为 *人工狭窄智能* 或狭窄人工智能 的东西。\n\nANI 也常被称为 *弱人工智能*，这就是你在网上看到的产品上贴满“AI”一词时通常所指的意思。ANI\
  \ 正如其名所示：人工智能的狭窄应用。也许它擅长与你交谈、预测某些未来价值，或整理事物；也许它在这些方面是专家，但其专业知识不会渗透到其他领域。例如，GPT-4\
  \ 是一种为最广为人知的对话式人工智能之一 ChatGPT 提供动力的模型，它可能具有先进的理解和对话能力，但它不能进行脊柱手术。如果它能做到这一点，它就不再是\
  \ ANI 了。这些人工智能的主要领域在与人类智能相比时被称为“强”和“弱”。\n\n但即使这也可能是一个有争议的观点。微软研究团队于 2023 年 4 月发表了一篇论文，详细介绍了他们对\
  \ GPT-4 及其接近 AGI 的程度的探索，题为 *Sparks of artificial general intelligence: Early experiments\
  \ with GPT-4*。\n\n- 第一个群体与通过统计模型不断进步的模型的出现有关。\n- 第二个群体与试图模仿我们自身自然神经智能的模型的出现有关。\n\
  \n口语上，这些分别被称为传统机器学习和深度学习模型。在本节中，我们将研究传统的统计机器学习模型，以便了解机器学习模型的历史相关性和普及程度。一些最可靠和最流行的机器学习模型已经存在了很长时间。**线性回归**模型可以追溯到\
  \ 1800 年代末，并通过英国数学家卡尔·皮尔逊和弗朗西斯·高尔顿爵士的工作而流行起来。他们的贡献催生了今天使用最广泛的机器学习算法之一，尽管不幸的是，两人都是著名的优生学家。卡尔·皮尔逊还被认为在\
  \ 1901 年发明了**主成分分析**，这是一种减少数据集中维度的方法。\n\n![](img/a0c9f9a2ba06a06d309ce21d890a47c6_33_0.png)\n\
  \n在数据集的上下文中，维度是你用来描述和分析数据的类别或变量。可以把它们想象成“标签”或“属性”，为数据集中包含的元素提供上下文。例如，客户数据库可能包括年龄、性别和位置等维度\n\
  \n一种流行的机器学习方法，**朴素贝叶斯分类器**，在 1960 年代出现，但它们基于英国统计学家托马斯·贝叶斯的工作及其条件概率定理，该定理来自 1700\
  \ 年代。逻辑函数由比利时数学家皮埃尔·弗朗索瓦·维尔休斯特在 1800 年代中期引入，而**逻辑回归**模型由英国统计学家大卫·考克斯于 1958 年推广。\n\
  \n一种用于分类和回归的最简单机器学习模型之一，**KNN 算法**，源于 1951 年统计学家埃velyn Fix 和 Joseph Lawson Hodges\
  \ Jr. 代表美国武装部队与伯克利大学合作完成的技术分析报告。K-means 聚类，一种机器学习聚类方法，最早由 UCLA 的数学家 James MacQueen\
  \ 于 1967 年提出。正如你所见，今天在机器学习模型中最常用的许多算法的根源可以追溯到我们现代历史的很早之前。它们的简洁性和优雅性增加了它们今天的相关性。\n\
  \n## 深度学习的简史\n\n1943 年，Warren S. McCulloch 和 Walter Pitts 发表了一篇论文，*A logical calculus\
  \ of the ideas immanent in nervous activity*，通过创建一个基于我们大脑中固有的神经网络的计算机模型，将数学与神经学联系起来，该模型基于算法的组合来创建一个“阈值”，以模仿我们如何通过自身的生物神经元网络传递信息。然后，在\
  \ 1958 年，Frank Rosenblatt 发表了一篇论文，被广泛认为是神经网络的祖先，名为 *The Perceptron: A Perceiving\
  \ and recognizing automaton*。这在本质上是第一个、最简单、最古老的 ANN。\n\n然后，在 1997 年，Sepp Hochreiter\
  \ 和 Jürgen Schmidhuber 发表了他们的开创性工作，题为 *Long Short-Term Memory*，这有效地使深度学习能够“解决以前的循环网络算法从未解决过的复杂的人工长时滞任务”。这一发展之所以如此重要，是因为它使序列的概念对于深度学习问题保持相关性。由于神经网络涉及隐藏层，很难让时间的概念保持相关性，这使得许多问题难以解决。例如，传统的循环神经网络可能无法像\
  \ **长短期记忆** 那样自动完成句子，因为它不理解完成句子所涉及的时间序列。\n\n今天，大多数深度学习模型需要大量的数据，这意味着为深度学习提供动力的神经网络需要大量的示例来理解某物例如是狗还是马。如果你仔细想想，这实际上与我们大脑的工作方式关系不大。一个刚刚出现并学习关于世界的幼儿可能只需要提醒一两次狗和马的区别，但你可能不会提醒他们这种区别数千或数百万次。在这种意义上，深度学习正在朝着需要越来越少的示例来学习的方向发展。当然，如今我们能够为深度学习模型收集大量的数据，但模型本身也在不断发展，以在不需要太多数据的情况下改进，最终目标是能够用少量数据训练的深度学习模型。\n\
  \n到目前为止，我们已经介绍了塑造机器学习和更具体地说是深度学习领域的某些历史和影响。虽然我们还没有深入探讨太多技术概念，但这为我们提供了一个良好的基础，以便了解机器学习和深度学习如何随着时间的推移而发展，以及为什么它们变得如此突出。在下一节中，我们将更深入地实践，更好地理解深度学习。\n\
  \n## 新的——探索深度学习\n\n我们在本书中概念上将机器学习和深度学习分开的部分意图，实际上是为了在你的脑海中建立对这些概念的关联。对于该领域的绝大多数技术人员来说，当你看到产品描述为机器学习或深度学习时，会出现特定的模型和算法。这里快速提醒一下，深度学习是机器学习的一个子集。如果你对这两个术语感到困惑，只需记住深度学习是机器学习的一种形式，它已经发展和演变形成了自己的生态系统。我们的目标是尽可能地揭开这个生态系统的神秘面纱，以便你作为产品经理能够自信地理解深度学习产品中存在的动态。\n\
  \n深度学习的基础思想围绕着我们自身的生物神经网络，深度学习使用通常是 ANN 的总称来解决复杂问题。正如我们将在下一节中看到的那样，深度学习中形成的生态系统很大程度上受到了我们自身大脑的启发，而“原始”神经网络就存在于大脑中。这种灵感不仅来自人类大脑的功能，特别是通过示例学习的概念，也来自其结构。\n\
  \n\n\n\n由于这并不是一本面向深度学习（DL）工程师的过度技术性书籍，我们将避免深入探讨与深度学习相关的术语和数学知识。不过，对人工神经网络（ANN）有一个基本了解将会很有帮助。在我们阅读本节时，请记住，神经网络由人工神经元或节点组成，这些节点在层中彼此相邻堆叠。通常有三种类型的层：\n\
  \n- 输入层\n- 隐藏层\n- 输出层\n\n虽然我们将介绍各种类型的人工神经网络，但这些深度学习算法的工作原理有一些基础知识需要掌握。要从层和节点的角度来思考。本质上，数据通过每一层的每个节点传递，基本思想是每个节点和层都有权重和偏置在传递。人工神经网络通过处理训练数据，得出最有助于解决当前问题的模式。一个至少有三层的人工神经网络（即输入层、输出层以及至少一个隐藏层）就足够“深”，可以被归类为深度学习算法。\n\
  \n这就解决了层的问题，但节点呢？最简单的模型之一（我们将在本章后面详细讨论）是线性回归模型。你可以把每个节点看作一个微型线性回归模型，因为这就是人工神经网络中每个节点内部发生的计算。除此之外，每个节点所做的不仅仅是线性回归计算，它还会对结果应用一个非线性激活函数。这个激活函数将非线性引入模型，使人工神经网络能够捕捉到线性回归无法捕捉的数据中的复杂模式和关系。每个节点都有自己的数据、该数据的权重，以及用于衡量的偏置或参数，最终得出一个输出。所有这些节点大规模执行这些计算，其综合效果让你对人工神经网络的工作方式有所了解。如果你能想象一个有数百层的大规模网络，每一层内都有许多节点，你就开始能够理解为什么人工神经网络得出某些结论会是难以理解的。\n\
  \n深度学习通常被称为黑盒技术，这正触及了其背后的核心原因。凭借我们的数学能力，人类可以解释为什么一个简单的线性回归模型中会出现特定的错误率或损失函数。我们可以概念化一个拟合曲线的模型可能出错的方式。当我们向模型展示真实世界的数据时，我们也能理解它所面临的挑战，因为这些数据不会呈现完美的曲线。但如果我们将规模扩大，试图概念化可能数以十亿计、每个都代表一个线性回归模型的节点，我们的大脑就会开始吃不消。\n\
  \n尽管深度学习经常被视为尖端技术进展，但正如我们在前一节中所看到的，这段旅程也很早就开始了。\n\n## 无形的影响\n\n理解影响机器学习和深度学习的内在关系以及两者相关的历史是很重要的。这是故事叙述的基础部分，也有助于更好地理解这项技术与周围世界的关系。对许多人来说，理解AI/ML概念可能令人困惑，除非你来自技术或计算机科学背景，否则这些主题本身可能看起来很吓人。许多人充其量只能获得对这项技术及其由来的初步了解。\n\
  \n我们希望通过让更深层次的理解更容易获得，来赋能任何有兴趣探索这项将塑造未来众多产品和内部系统的底层技术的人。事实上，似乎已经存在一种偏见——大多数深入了解机器学习和深度学习的人已经来自计算机科学背景，无论是通过正规教育，还是通过训练营和其他技术培训项目。这意味着，在大多数情况下，有机会接触这些知识并在这一领域进行学习和创业的人，传统上以白人和男性为主。\n\
  \n除了人口统计学特征外，从学术角度来看，对这些技术的投资水平也有所上升。让我们来看一些数字。斯坦福大学的AI指数显示，全球顶尖大学研究生阶段的AI投资增长了41.7%。在本科阶段，这一数字跃升至102.9%。此外，在过去十年中，48%的AI博士获得者为了追求私营部门的高薪而离开了学术界。另外，十年前计算机科学博士中只有14.2%与AI相关，而现在这一数字已超过23%。尤其是美国，正在留住它所培养和吸引的人才。来美国攻读AI博士学位的外国学生，留在美国的比例为81.8%。\n\
  \n这幅图景所描绘的，是一个急需AI/ML人才和技能的世界。对AI/ML技能组合的高需求，特别是对人口统计学上多样化AI技能组合的需求，使得人们很难留在学术界，因为私营部门对那些离开学术界的人给予了丰厚的回报。在创业圈中，许多风险投资家和投资者在知道一家公司拥有AI博士员工后，就能自信地巩固他们的投资，无论该公司的产品是否需要这种重度的专业知识。对拥有这些抢手技能的人力资源给予高度重视的趋势，很可能不会很快消失。\n\
  \n另一个需要记住的关键点是机器学习团队与产品团队之间的关系。如何选择、构建、调优和维护模型以获得优化性能，是数据科学家和机器学习工程师的工作。利用这些性能知识来优化产品体验本身，则是产品经理（PM）的工作。如果你在AI产品管理领域工作，你将与数据科学和机器学习团队密切合作（我们将在本书后面更详细地了解具体角色）。\n\
  \n我们还希望对你作为AI产品经理将与之共事的人员做一个区分。取决于你的组织，你要么与数据科学家和开发人员合作部署机器学习，要么与机器学习工程师合作，他们既能训练和维护模型，也能将其部署到生产环境。我们强烈建议与所有这些受影响的团队以及DevOps保持牢固的关系。\n\
  \n我们梦想着这样一个世界：来自不同能力和背景的人都能进入AI领域，因为多样性是迫切需要的，而我们面前的机会如此之大，不应让一直以来的守门行为继续占上风。不仅AI的构建者需要理解底层技术及其应用如此强大的原因，对于利用这项技术能力的业务利益相关者来说，同样重要的是也要理解摆在他们面前的选择和能力。归根结底，没有什么事情是复杂到无法简单解释的。\n\
  \n## 机器学习与深度学习——理解二者的区别\n\n在本节中，我们将探讨机器学习与深度学习之间的关系，以及它们如何为构建者和用户带来各自的期望、解释和阐明。无论你是在开发融入了自20世纪50年代以来就存在的机器学习模型的产品，还是在使用近期涌现的尖端模型，你都需要理解这两种情况的影响。将机器学习或深度学习整合到你的产品中会产生不同的后果。大多数情况下，当你看到产品上的AI标签时，它是用机器学习或深度学习构建的，因此，我们希望你在读完本章后，能够坚定地理解这些领域之间的差异，以及这种差异将对你未来的产品产生什么切实的影响。\n\
  \n作为产品经理，你需要与技术同行建立大量信任，以便共同构建一个在技术上尽可能出色的产品。我们将在这里介绍一些基础知识，并在后面详细阐述这些概念。首先让我们看一下我们将讨论的一些关键概念是如何相互关联的：\n\
  \n![](img/a0c9f9a2ba06a06d309ce21d890a47c6_38_0.png)\n\n图1.2：机器学习的子类别\n\n\n\n\n\
  ## DL\n\nDL 是 ML 的一个子集，但这两个术语在口语中常被几乎当作独立的表达来使用。其原因在于 DL 基于神经网络算法，而 ML 可以被视为...其余的算法。DL\
  \ 指的是具有神经网络的模型，而所有其他模型（包括语言模型和计算机视觉模型）都被称作 ML。在前面介绍 ML 的章节中，我们研究了获取数据、用其训练模型，并使用该训练好的模型预测新的未来数据点的过程。每次使用模型时，你都会通过了解误差率来看到它与正确答案的偏差程度，从而可以反复迭代，直到拥有一个足够好用的模型。每次，你都是基于具有某些模式或特征的数据来创建模型。\n\
  \n这一过程在 DL 中是相同的，但 DL 的关键区别之一在于模型的深度——数据中的模式或特征很大程度上是通过所谓的特征学习或通过分层系统进行的特征工程，由 DL\
  \ 算法捕捉。以下是其工作原理的示意图：\n\n![](img/a0c9f9a2ba06a06d309ce21d890a47c6_40_0.png)\n\n图\
  \ 1.3：ANNs 的工作原理\n\n我们将在第 3 章详细讨论所使用的各种算法，因为它们有一些细微差别，但随着你继续加深对现有 ML 类型的理解，你也会开始将构成这些\
  \ AI 主要领域（ML 和 DL）的各种模型进行归类。出于营销目的，你在很大程度上会看到诸如 ML、DL/神经网络，或只是使用 DL 算法时的通用总称 AI\
  \ 等术语被引用。\n\n了解这些术语在实践中和模型层面的含义有何不同，以及它们如何被非技术利益相关者传达非常重要。作为 AI PM，我们在两个世界之间走钢丝：工程正在构建什么，以及营销正在传达什么。如前所述，每当你听到\
  \ **黑盒模型** 这一术语时，它指的是神经网络模型，即 DL。其原因在于 DL 工程师 often 无法确定他们的模型是如何得出某些结论的，从而对模型正在做什么产生不透明的看法。这种不透明性是双向的，既针对工程师和技术人员，也针对下游体验这些模型效果的客户和用户，而他们并不知道模型如何做出某些判定。\n\
  \n对于 AI PM 来说，DL 对可解释性构成挑战，因为我们几乎无法理解模型是如何以及为何得出结论的。根据产品背景，可解释性的重要性可能有所不同。销售团队可能面临的最大反对意见之一是客户无法购买黑盒模型产品；在我们自己的一些工作经历中，这也经常出现。另一个固有挑战是这些模型本质上是自主学习的，因为它们不需要工程师为其选择数据中最相关的特征；神经网络本身执行特征选择。它们在工程师的很少干预下学习。将模型视为\
  \ *是什么*，而下一节的学习范式则视为 *如何*。\n\n## ML 中的学习范式\n\n在本节中，我们将介绍监督学习、无监督学习、半监督学习和强化学习之间的差异，以及所有这些学习类别如何应用。再次强调，学习类型与是否对数据进行标注以及用于奖励模型良好性能的方法有关。最终目标是了解哪种学习模型能为你提供在考虑是否将其用于产品时所需的那种性能和可解释性。\n\
  \n### 监督学习\n\n如果人类在标注数据（也称为结构化数据），并且机器也希望正确标注当前或未来的数据点，那就是监督学习。因为我们人类知道机器试图得出的答案，所以我们可以看出它们与正确答案的偏差程度，并继续训练和重新训练模型，直到找到我们满意的模型性能水平。\n\
  \n监督学习模型的应用包括分类模型，其目的是像垃圾邮件过滤器那样对数据进行分类，或回归模型，其目的是寻找变量之间的关系以预测未来事件并发现趋势。请记住，所有模型都只能工作到一定程度，这就是为什么它们需要不断训练和更新的原因，AI\
  \ 团队经常使用集成建模或尝试各种模型并选择表现最好的一个。无论如何它都不会完美，但随着足够的指导，它会让你越来越接近真相。\n\n## LLMs、NLP、GANs\
  \ 和生成式 AI\n\n正如“AI”是一个总称术语，“生成式 AI”也是如此。正如其名称所暗示的，生成式 AI 是 AI 的一个领域，全部关于生成新内容，无论是文本、图像，甚至是代码。驱动生成式\
  \ AI 的 ML 模型创建的输出与它们从中学习的训练数据非常相似。\n\n当你想到生成式 AI 时，主要想到的是先进的 DL 模型；这些模型可以分为三大类：\n\
  \n- **潜在变量模型：** 这些模型试图从给定的训练数据中破译隐藏因素（潜在变量）。从它们接收到的可见数据中，它们试图理解隐藏在该数据中的决定因素。潜在变量模型的例子包括\
  \ **变分自编码器（VAEs）** 和 **基于能量的模型（EBMs）**。使用这类模型制作的工具的例子包括 Artbreeder、NSynth（Google\
  \ Magenta）、AutoCAD 的生成式设计和 DeepLog。Netflix 的推荐系统也部分由 VAEs 支持。\n- **对抗模型：** 这些模型更像是一场游戏，即有两个对抗模型“协同作战”以获得最佳结果。一个模型生成数据，而另一个模型评估其生成的内容，以确保其足够优秀以作为输出提供。对抗模型的例子包括\
  \ **生成对抗网络（GANs）** 和对抗 EBMs。使用这类模型制作的工具的例子包括 DeepArt、Jukebox（OpenAI）、Adobe Photoshop（内容感知填充）、DALL-E、GANimation、GameGAN（NVIDIA）、FaceApp\
  \ 和 Prisma。\n- **序列模型：** 这些模型擅长按序列预测输出，并且能够在上下文中使用之前元素。它们为长文本生成铺平了道路，因为它们能够一步一步生成，同时考虑生成输出之前的所有内容。序列模型的例子包括自回归模型、Transformer\
  \ 模型和扩散模型。使用这些模型制作的工具的例子包括为 ChatGPT 提供动力的 GPT 模型（OpenAI）、Smart Compose（Google）、MuseNet（OpenAI）、PixelCNN\
  \ 和 Google Translate。\n\n进入市场的最著名生成式 AI 模型之一 ChatGPT，由 OpenAI 训练，于 2022 年 11 月才推出，在此之前几乎有十年的时间由庞大的开源开发者和科学家社区完成的工作。现在它已经发布，许多科技巨头正试图在市场上推出类似产品展开竞争。即使他们在\
  \ ChatGPT 在市场上占据主导地位的情况下难以创造真正有竞争力的产品，一些竞争产品也已出现，包括 Google 的 Bard 和 Gemini、Microsoft\
  \ 的 Bing Chat，以及 Anthropic 的 Claude 和 Mistral。想想看：这些模型如此复杂，需要如此多的计算能力和数据，以至于即使对于比大多数国家\
  \ GDP 还要富裕的科技公司来说，也是一个难以匹敌的挑战。\n\n\n\n\n\n这些模型之所以特别，是因为它们是可以被对 AI 和深度技术几乎一无所知的人使用的\
  \ DL 模型。原因在于它们在发布到市场时，是由提示驱动的。这意味着你必须真正向它提出一个问题或给出一个“提示”才能得到结果。由于数据的数量庞大，其中大部分是书面文本、图像和网页内容，它们擅长理解某人想要什么，以及某人可能想要阅读或看到什么。这些\
  \ DL 模型理解问题并生成响应的过程被称为 **自然语言处理 (NLP)**。\n\n**聊天机器人** 或 **对话式 AI** 是设计用来模拟人类对话的计算机程序。它们使用\
  \ NLP 来理解并响应用户发出的文本或语音输入。把它们想象成虚拟助手，可以以不同方式处理客户服务任务，例如回答问题、提供推荐或提供客户支持。NLP 由两个部分组成：\n\
  \n- **自然语言生成 (NLG)**：AI 通过识别词语背后的含义、识别已知实体以及理解用户消息背后的意图，来解释并理解接收到的文本或语音。\n- **自然语言理解\
  \ (NLU)**：AI 然后根据其使用 NLU 所理解的内容，[content]\n\n这些模型之所以特别，是因为它们是可以被对 AI 和深度技术几乎一无所知的人使用的\
  \ DL 模型。原因在于它们在发布到市场时，是由提示驱动的。这意味着你必须真正向它提出一个问题或给出一个“提示”才能得到结果。由于数据的数量庞大，其中大部分是书面文本、图像和网页内容，它们擅长理解某人想要什么，以及某人可能想要阅读或看到什么。这些\
  \ DL 模型理解问题并生成响应的过程被称为 **自然语言处理 (NLP)**。\n\n**聊天机器人** 或 **对话式 AI** 是设计用来模拟人类对话的计算机程序。它们使用\
  \ NLP 来理解并响应用户发出的文本或语音输入。把它们想象成虚拟助手，可以以不同方式处理客户服务任务，例如回答问题、提供推荐或提供客户支持。NLP 由两个部分组成：\n\
  \n- **自然语言生成 (NLG)**：AI 通过识别词语背后的含义、识别已知实体以及理解用户消息背后的意图，来解释并理解接收到的文本或语音。\n- **自然语言理解\
  \ (NLU)**：AI 然后根据其使用 NLU 所理解的内容，生成连贯且上下文适当的响应，例如简单的确认、更详细的说明，或更深入的信息。\n\n利用这种 NLP\
  \ 能力的模型被称为 LLM。大多数 LLM 使用结合了无监督、监督和强化学习的训练过程。以 ChatGPT 为例，该模型是在包含非结构化数据的海量数据集上进行预训练的。\n\
  \n对于有兴趣了解无监督预训练步骤中使用示例数据集的人，可以在这里探索：https://pile.eleuther.ai/。\n\n涉及的阶段如下：\n\n1.\
  \ 它的第一阶段是无监督学习。\n2. 训练过程的下一阶段是监督微调，在此阶段它会经历一个纠正阶段，人类评审员会介入告诉它何时做对了。\n3. 在最后的学习阶段，它会进行强化学习，以便在反馈回路中引入奖励系统，从而进一步提高其性能。\n\
  \n我们将在本书后面的章节中进一步深入探讨生成式 AI 模型及其所依赖的 DL 模型的相关性和细节。但就目前而言，这就是关于生成式 AI 基础知识的简明总结。在我们讨论\
  \ ML 流程的最佳流程之前，让我们看看在 AI 领域取得成功需要什么。\n\n## Succeeding in AI — how well-managed AI\
  \ companies do infrastructure right\n\nML 系统的复杂性体现在，许多严重依赖 ML 的大型科技公司都设有专门的团队和平台，专注于构建、训练、部署和维护\
  \ ML 模型。以下是构建 ML/AI 项目时可选择的几个示例：\n\n- **OpenAI Platform from OpenAI：** OpenAI 的\
  \ AI 管理平台涵盖了用于开发、部署和管理 AI 模型的工具和系统。这包括他们用于支持 GPT-4 等模型以及其他 AI 技术的创建和运营的训练基础设施、部署管道和监控系统。\n\
  - **MLflow from Databricks：** MLflow 是 Databricks 开发的开源平台，可帮助企业管理完整的 ML 生命周期。它允许你使用任何库、框架或语言运行体验并进行协作。主要优势是：\n\
  \  - 实验跟踪让你可以看到模型在实验之间的表现。\n  - 模型管理帮助你在团队成员之间管理模型的所有版本。\n  - 模型部署让你在工具中快速查看部署情况。\n\
  - **TensorFlow Extended (TFX) from Google：** 这是 Google 基于 TensorFlow 构建的最新产品，是一个用于部署生产级\
  \ ML 管道的端到端平台。它为你提供以下优势：\n  - 团队内部和团队之间的协作\n  - 用于可扩展、高性能环境的强大功能\n- **Michelangelo\
  \ from Uber：** Uber 是公司内部为协作和部署创建自己的 ML 管理工具的绝佳例子。之前，他们使用不同的语言、模型和算法，团队各自为政。在实施\
  \ Michelangelo 后，他们能够做到以下几点：\n  - 将不同的技能和能力整合到一个系统下。\n  - 使用可靠、可重现且标准化的管道，以规模化创建、管理和预测及部署其数据。\n\
  - **FB Learner Flow from Meta：** Meta 也为管理其众多 AI 项目创建了自己的系统。由于 ML 是其产品的基础部分，Meta\
  \ 需要一个平台来实现以下功能：\n  - 每个已实施一次的 ML 算法都能在以后被他人重复使用。\n  - 每位工程师都能编写可重复使用的训练管道。\n  -\
  \ 使模型训练变得简单且自动化。\n  - 每个人都能轻松搜索过去的项目和实验。\n\n## Step 1 — Definition\n\n虽然本书的大部分内容将仅关注与产品管理相关的\
  \ AI，但你可以使用此流程来实现任何 AI 系统，即使它没有专门集成到你的产品中。正如任何 PM 所知，你不会在没有先解决要解决的问题的情况下就开始寻找解决方案。无论你的\
  \ AI 系统的用途如何，你都希望阐明你想用 AI 解决的具体问题以及你希望通过它实现的目标。这使你能够将该问题与其实解决方案可能带来的业务影响联系起来。将 AI\
  \ 系统与业务影响以及它如何帮助实现业务目标保持一致是第一步，因为你将要求你的组织为建立 AI 系统投入大量投资。\n\n在他们批准你的请求之前，他们会有很多问题。弄清楚如何回答这些问题以及如何建立成功标准将是你的主要任务。规划大部分工作并建立需求和约束将是你创建\
  \ AI 系统的前期投资的一部分。作为 AI PM，能够识别与基础设施、数据可用性和计算能力相关的限制和需求，将确保你为自己做好充分准备。你需要的不仅是领导层的批准，还需要利益相关者的批准。在大多数情况下，你需要与关键利益相关者进行协商，以便对你试图解决的问题提供合理且审慎的答案。\n\
  \n## Step 2 — Data availability and centralization\n\n本质上，你需要一个中央位置来存储你的 AI/ML 模型和算法将从中学习的数据。根据你投资的数据库或使用的遗留系统，你可能需要一个提取、转换、加载\
  \ (ETL) 管道和数据工程，以便使数据和元数据层可供你的生产化 AI/ML 模型摄取并从中提供洞察。把这想象成为你的 AI/ML 系统创建所需的管道。确定你需要训练和测试\
  \ AI 模型的数据类型和数量，以便你能从各种来源收集正确的数据，从而建立你的集中式、集成训练数据集。\n\nAI 以数据为食，如果你的数据交付系统笨重或缓慢，你将在生产中后期遇到问题。选择你喜欢的数据存储方式本身就很棘手。你不知道随着规模扩大你的技术栈会如何演变，因此选择一种经济高效且可靠的解决方案本身就是一项任务，就像清理和处理你决定使用的数据一样。你还希望将数据集拆分为训练集、验证集和测试集。根据你选择的模型和目的，你可能还选择用生成的数据点或外部数据源来增强你的数据集。\n\
  \n例如，当我们在之前合作的一家网络安全公司开始增加越来越多的客户时，我们注意到某些面向客户的仪表板的加载时间滞后了。问题的一部分是客户数量及其元数据过大，无法支持我们已有的管道。\n\
  \n\n\n\n\n## Step 5 – Deployment\n\n根据产品组织的规模，你很可能拥有数据科学家，他们会与机器学习工程师协同工作，后者会将模型方面所做的工作转化为成功部署到生产环境中的成果。这就是部署环境为训练好的模型准备就绪，以便将其集成到已在生产中运行的现有系统或应用程序中的阶段。模型通常通过\
  \ API 或 Web 服务集成到这些系统中。这也是设置持续跟踪模型性能和运行状态的日志的地方。\n\n如果你不使用工具来监控响应时间、准确率和错误等性能指标，以及系统健康状况和性能，就无法了解模型的表现情况。这也是实施安全措施以确保模型及其使用的数据保持加密、安全并仅可供授权用户访问的地方。\n\
  \n## Step 6 – Continuous maintenance\n\n此时，你已经拥有模型和算法，并且选择了向其提供数据的方式。现在，你将进入不断维护该系统的流程。在\
  \ DevOps 中，这被称为持续集成（CI）/持续交付（CD）。在后面的章节中，我们将介绍 IT 运营人工智能（AiOps）的概念，但就目前而言，以下是针对\
  \ AI 流水线持续维护量身定制的阶段列表。以下是持续维护流程的四个主要组成部分：\n\n- **CI：** 测试/验证代码和组件，以及数据、数据模式和模型。\n\
  - **CD：** 对模型进行代码更改或更新会持续传递，以便一旦你做出更改，它们就会在进入生产环境之前被安排在测试环境中出现，且不会中断。\n- **CT：**\
  \ 我们提到过持续学习对机器学习很重要，而**持续训练**将这一过程产品化，以便随着新数据馈送的刷新，你的模型能够持续从新数据中训练和学习。\n- **CM：**\
  \ 我们不能让机器学习/人工智能模型持续运行，而不使用**持续监控**来确保不会出现严重问题。\n\n如果你不不断迭代流程，或不勤勉地记录此流程的每一步，就无法负责任地管理人工智能项目。你的模型和超参数会变得陈旧。你的数据也会变得陈旧，而当这种迭代过程停滞时，它将不再有效。你的文档本身也会变得陈旧。性能是你需要不断保持更新的东西，因为性能不足是显而易见的，无论是否面向客户。话虽如此，事情也可能出错。\n\
  \n保持对人工智能系统管理的关注具有严重的伦理原因。根据产品的用途和用途，性能滞后或模型刷新频率可能导致人们失业、无法获得有竞争力的抵押贷款利率，或被判不公平的监禁。由不当的模型维护引起的下游影响可能导致严重后果。我们建议探索本章末尾的\
  \ *Additional resources* 部分，以了解更多示例和信息，了解停滞的人工智能系统如何对环境和人们造成破坏。\n\n你可能还会遇到 lakehouse\
  \ 这个术语。市面上有许多数据库、数据仓库和数据湖。然而，我们所知唯一的湖仓是由 Databricks 公司推广的，它提供类似数据湖的东西，但具有数据仓库的一些功能，即能够展示数据，使其可供非技术内部用户使用和摄取，并用其创建仪表板。这里最大的优势在于，你可以提前存储数据并为存储付费，同时能够在下游访问和操作数据。\n\
  \n## Data pipelines\n\n无论你使用什么技术来维护和存储数据，你仍然需要建立流水线，以确保数据在流动，你的仪表板能够根据业务需求及时刷新，并且数据能够按需流动。处理和传递数据的方式也有多种。你可能以批处理（批处理）的方式进行，以在不同时间间隔移动大量数据，或使用实时流水线，以便数据在生成后立即实时获取。如果你希望利用预测分析、启用报告，或建立一个用于移动、处理和存储数据的系统，数据流水线可能就足够了。然而，根据你的数据用途和所需的转换程度，你很可能同时使用数据流水线以及更具体地说是\
  \ ETL 流水线：\n\n![](img/a0c9f9a2ba06a06d309ce21d890a47c6_55_0.png)\n\nFigure 1.4:\
  \ The ETL process (icons obtained from Flaticon.com)\n\nETL 代表 extract, transform,\
  \ and load，因此你的数据工程师将为更高级的系统创建特定的流水线，例如将所有数据集中到一个地方、添加数据或数据丰富、将数据与 CRM 工具连接，甚至在系统之间转换数据并为其添加结构。这是因为在使用数据仓库或数据库时这是必要的步骤。如果你只使用数据湖，你将拥有所有必要的元数据来分析它并按需获得洞察。在大多数情况下，如果你正在使用\
  \ AI/ML 产品，你将与数据工程师合作，他们将为你的产品成功提供所需的数据流，因为你很可能同时使用关系数据库和数据仓库。启用 AI/ML 功能所需的分析很可能需要由专注于\
  \ ETL 流水线的数据工程师来支持。\n\n管理和维护该系统也将是数据工程师的工作，我们鼓励每个产品经理与支持其产品的工程师保持密切关系。ETL 流水线通常以批处理方式更新，而不是实时更新。例如，如果你使用\
  \ ETL 流水线来更新有关客户如何使用你的产品以便在平台中提供面向客户的洞察的历史每日信息，则每天更新两次批处理可能是最佳选择。然而，如果你需要内部业务用户使用的仪表板实时获取洞察，而这些用户依赖该数据做出日常决策；那么你可能需要使用持续更新的数据流水线。\n\
  \n现在我们了解了存储数据的不同可用选项以及如何为业务选择合适的选项，让我们讨论如何管理我们的项目。\n\n## Managing projects — IaaS\n\
  \n如果你希望在组织中创建 AI/ML 系统，你必须将其视为一个需要不断维护的生态系统。随着时间的推移，我们将看到越来越多的托管服务和**基础设施即服务（IaaS）**\
  \ 方案出现，尤其是在人工智能在公司内部用于优化以及产品优化的兴起。随着行业向 Determined AI 和 Google 的 AI Platform 流水线工具等公司转变，以满足市场需求，这一转变正在进行中。这一需求的核心是希望减轻公司在开始构建人工智能系统这一庞大任务时感到困惑的负担。\n\
  \n正如 DevOps 团队随着大规模软件开发而变得流行，这是数十年错误的结果，我们将看到 MLOps 和 AIOps 出现类似的情况。开发解决方案和将其投入运营是两个需要协同工作的关键领域。对于\
  \ AI/ML 系统来说更是如此。现在的趋势是 IaaS。根据 Gartner 的说法，生成式人工智能和应用现代化是 “IaaS is forecast to\
  \ experience the highest end-user spending growth at 25.6%” 的原因（2024 年），预计 2025\
  \ 年将增长 29.1%。理解这一概念很重要，因为许多刚接触人工智能的公司往往不了解正确进行人工智能所需的成本、存储、计算能力和投资，特别是对于需要大量数据进行训练的深度学习\
  \ AI 项目。\n\n> **Artificial intelligence operations (AIOps)** focus on using ML and\
  \ AI to automate and enhance IT operations and infrastructure for things like issue\
  \ detection and predictive analytics to prevent outages, manage incidents, analyze\
  \ root causes, or optimize system performance.\n> \n> **Machine learning operations\
  \ (MLOps)** focus on optimizing and managing the life cycle of ML models from development\
  \ and deployment to monitoring and maintenance. The goal is to ensure models are\
  \ efficiently integrated into production environments.\n\n![](img/a0c9f9a2ba06a06d309ce21d890a47c6_56_0.png)\n\
  \n\n\n\n目前，大多数公司并没有连续数十年运行 AI/ML 项目的经历，也没有专门的团队。像 Meta、亚马逊、苹果、Netflix 和谷歌这样的科技公司正在引领管理\
  \ AI/ML 的文化规范，但大多数需要拥抱 AI 的公司并不属于科技行业，而且对于采用 AI 将给其工程团队带来的技术债务，它们大多毫无准备。管理并整合遗留系统与新的\
  \ AI 技术和能力，围绕 AI/ML 生命周期构建结构，首先引入足够的技术技能来实现这一切，确定计算资源和存储需求的范围，管理云服务和本地服务及基础设施，以及管理成本，这些都是\
  \ AI 产品经理需要考虑和准备的复杂问题。\n\n为让 AI 项目落地而采取的捷径，将需要代码重构或改变数据的存储和管理方式，这也是为什么为采用 AI 制定战略和规划如此关键。除了规划和成本之外，AI\
  \ 产品经理还需要帮助组织衡量其正在规划的 AI 项目的成败，特别是当这些 AI 项目直接支持其产品时。设置性能指标、衡量对业务的影响、建立采用和满意度模式，并将其与投资回报率（ROI）挂钩，这些都是\
  \ AI 产品经理工作的重要方面。这就是为什么现在涌现出这么多 IaaS 服务，也是为了帮助工程团队在未来需要变更时保持敏捷。随着时间推移，维持 AI 团队正常运行所需的基础设施也会发生变化，而使用\
  \ IaaS 提供商的好处在于，你可以运行所有项目，并且只为 AI 开发人员实际使用数据训练模型的时间付费。\n\n## 部署策略——我们如何处理这些输出？\n\
  \n一旦你对所选模型（包括其性能和错误率）感到满意，并且有良好的基础设施来支持你的产品和所选 AI 模型的用例，你就可以进入流程的最后一步，将这些代码部署到生产环境。维护一个适合你的产品和组织的部署策略，将是我们上一节所述的持续维护的一部分。你需要考虑诸如需要多久重新训练模型、刷新训练数据以防止模型衰减和数据漂移等问题。你还需要一个持续监控模型性能的系统，因此这个过程将非常特定于你的产品和业务，尤其是因为这些重新训练时期需要你的系统停机。\n\
  \n> 随着时间的推移，如果用于训练 ML 模型的数据中的底层模式或关系发生变化，ML 模型的性能可能会逐渐下降。这被称为模型衰减。\n>\n> 当 ML 模型使用的数据发生变化或偏离模型最初训练所用的数据时，由于模式已经改变，模型的预测可能会变得不太准确。这被称为数据漂移。\n\
  \n例如，一家电商公司想要尝试一种新的定价算法，以了解它是否会对销售产生影响，它可以将用户分为两组。一组看到旧的定价模式，另一组体验新的定价算法。由于这两组会反映真实的定价和购买决策，因此可以在一段时间内对两组的结果进行比较。这将使公司能够监控网站，并比较两组客户的销售业绩、用户参与度和转化率，从而了解新定价算法的真实影响。\n\
  \n## 金丝雀部署策略\n\n在这里，我们看到一种更渐进的部署方法，你实际上会创建用户子集，让他们体验你的新模型部署。在这里，我们看到接触新模型的用户数量随时间逐渐增加。这意味着你可以在不同用户组之间留出缓冲时间，以了解他们对这个新模型的反应和互动。本质上，你是在向新一批用户发布之前，用自己不同的用户组作为测试者，从而也能逐步捕获错误。如果你有耐心和勇气，这是一个缓慢但有回报的过程。\n\
  \n例如，如果一个照片分享社交媒体应用想要测试一项新的照片编辑功能，它可能只将该新功能部署到一个小型的测试组，也就是“金丝雀”组。他们可以监控这个小组的性能、采用情况和反馈，以识别该功能可能存在的更大问题，然后再将其推广到整个用户群。用较小的群体测试功能，可以最大程度地降低更大范围推出时可能存在的潜在风险。在初始实验成功后，他们有机会根据反馈进行更改或改进，然后再向更广泛的受众开放。\n\
  \n还有更多策略可供选择，但请记住，这些策略的选择将取决于以下因素：\n\n- 你的产品性质\n- 预算，这是你的客户和用户最关心的\n- 你的指标和性能监控\n\
  - 你的技术能力和知识\n- 时间线\n\n除了部署之外，你还需要帮助你的企业了解他们应该多久进行一次代码重构和分支管理。\n\n## 示例\n\n让我们以一个食品配送服务为例，它希望为应用程序推出一项新功能，以改进配送时间预测。他们在金丝雀、A/B\
  \ 测试和影子部署方法之间进行了权衡，并考虑了以下优缺点：\n\n- **影子部署：** 将新的配送时间功能与当前的配送时间功能并行运行。新功能会收集客户互动数据，但只有当前的配送时间功能会实际向用户显示配送时间。让我们看看这种方法的优缺点：\n\
  \  - **优点：** 产品团队可以在真实条件下测试新功能，而不会真正影响用户。\n  - **缺点：** 由于用户实际上不会与新配送时间功能互动，产品团队将无法真正了解用户会如何受到该功能的影响，以及它是否会影响用户参与度或用户行为。\n\
  - **A/B 测试：** 产品团队会将用户分成两组，第一组使用当前的配送时间功能，第二组使用新的配送时间功能。优缺点如下：\n  - **优点：** 产品团队可以比较当前功能和新功能在预测配送时间方面的有效性，以及它们对用户、用户行为和参与度的影响。\n\
  \  - **缺点：** 对这些功能的测试需要仔细考量和设计，以确保两组用户能够公平比较。产品团队还需要注意不要意外地让用户重叠。\n- **金丝雀：** 产品团队可以仅对其\
  \ 5% 的用户测试新的配送时间功能，并监控他们的反应。以下是优缺点：\n  - **优点：** 这使产品团队能够监控任何对用户行为和参与度的不利反应，并在更多用户体验到问题之前修复任何问题。\n\
  \  - **缺点：** 小规模用户组可能无法反映其整个客户群。一些不在金丝雀组中的用户细分可能对新功能更敏感。\n\n最终，产品团队决定采用 *A/B 测试部署*策略，因为他们不想冒金丝雀组未知情况的风险，也不想像影子部署策略那样，在没有任何用户直接体验变化的情况下推出功能。他们希望一次性获得新功能对用户参与度、用户行为和配送准确性的清晰、可比较的衡量结果。看到发布将如何在真实场景中影响用户，并与现有功能进行直接比较，是至关重要的。由于公司拥有适当处理\
  \ A/B 测试的基础设施以及全面分析结果的手段，他们决定对其配送时间预测功能进行 A/B 测试。\n\n现在我们已经讨论了不同的部署策略，让我们从宏观视角看看\
  \ AI 将把我们带向何方。\n\n\n\n\n## AI的承诺——AI将带我们走向何方？\n\n那么，这个AI应用时代将走向何方，对所有行业又意味着什么？在这一点上，我们看到的是一股具有地缘政治影响力的行业力量，一个在技术上显而易见的决策，伴随着巨大的责任、成本和机遇。只要公司和产品经理意识到妥善维护AI项目所需的风险、成本与投资水平，将其作为好奇心的源泉，并将AI/ML应用到能早日成功并从这些知识中积累经验的项目上，那些投资于AI的企业就会发现他们正体验到AI的承诺。这一承诺植根于将预测和优化进行量化。以下是一些例子：\n\
  \n- 亚马逊35%的销售额来自其个性化和推荐引擎，因为它能根据用户的行为、偏好和过往购买记录有效地推荐产品。由于这占其总收入的35%，这对他们AI投资的ROI以及整体营收都产生了重大影响。\n\
  - Netflix的内容推荐引擎能够个性化推荐，提升用户参与度和留存率，每年带来10亿美元的价值。通过减少流失并提高客户留存率，公司能够降低获取新客户的成本以及因客户流失而损失的营收。\n\
  - Shopify使用AI在其交易中检测和防止欺诈，帮助其整个商家社区感到平台安全。这些工具帮助公司避免了退款和损失，并通过拦截超过2000万次欺诈性授权，显著降低了欺诈成本。\n\
  \n当你的三分之一收入来自AI算法时，几乎没有什么可争论的。无论你在AI/ML上投入多少，都要确保通过合理规划和制定策略、寻找了解该领域及潜在危险的有能力人才，以及选择可扩展的合适基础设施来限制重构，从而最大程度地发挥其效用。\n\
  \n只要你的AI/ML项目直接与影响成本节约或收入的结果挂钩，如果你在监督这些项目，你就很可能会在自己的职业生涯中取得成功。从小处着手、将其应用于明确的业务目标、跟踪该目标并展示其效果的建议是一种明智的策略，因为本章详细介绍了维护AI项目的众多领域，以及可能遇到障碍的潜在领域。如果你无法向甚至最犹豫不决的高管传达AI的力量和能力，那么证明时间、人力投入和基础设施支出的合理性将面临挑战。\n\
  \n这对你的*技术资源*（数据科学家、数据工程师和ML工程师）以及*业务利益相关者*也至关重要。了解你将使用的ML算法，或获得一些关于如何最好地存储数据的建议是一回事，但如果你不通过自己的项目进行迭代，并从中不断积累哪些方法最有效的知识，你就无法真正具备在组织内成为变革推动者所需的熟悉度和流畅度。我们通过迭代来学习，通过成功完成任务来建立信心。作为产品经理，你也将如此。\n\
