- '# AI的上升潮流


  通过本章，我们开始本书的第三部分，该部分将重点关注演进现有产品，使其目前不使用机器学习（ML）也能利用人工智能（AI）。我们将这些产品称为非AI原生产品。在上一部分中，我们探讨了如何构建AI原生产品，以及该过程如何在数据、公司和战略角度上以最佳方式展开。运用同样的视角，我们现在将比较和对比该过程对于目前不利用AI的产品是如何展开的。


  更具体地说，本章将重新介绍第四次工业革命的概念。它将作为我们作为为产品和组织做好充分准备拥抱AI的企业家或产品经理的提醒和蓝图。因为本章介绍了本书的第3部分，该部分重点关注将AI集成到传统软件产品中，所以它很好地提醒了公司将获得什么。我们将重申AI即将到来的转变的重要性，以及它在各行业中的意义。对于那些已经处于可以拥抱AI的位置的人，我希望提供一个计划，让你在向前推进、向你的产品和更广泛的组织宣扬AI时感到自信。对于那些仍然持怀疑态度的人，我希望它能激发你的斗志，并提供一个清晰的未来愿景，以便你开始做准备工作。对于那些对AI持怀疑态度的人，我希望能让你一窥如果你的公司不采用AI，其成功将是什么样子。


  随着我们继续本章，第一部分将深入探讨AI演进对企业和产品意味着什么，以便在行业层面最好地传达拥抱AI的竞争优势。我们随后将在第二部分介绍公司在利用AI采用浪潮时可用的便捷选项。最后一部分将重点关注产品经理层面的AI采用心态和态度，以及产品经理如何在其组织内传达AI采用。我很荣幸能与你一起踏上这段旅程，我希望接下来的文字能在关于AI及其采用的错误信息和虚假信息泛滥的格局中为你带来慰藉。


  在本章中，我们将涵盖以下主题：


  - 进化或死亡——当变化是唯一不变时

  - 第四次工业革命的结构性变化

  - 恐惧不是答案——可获得的收益多于损失（或支出）

  - 预测潜在风险

  - 大语言模型如何演进


  我们将在本章末尾的案例研究帮助下具体化这一点。


  ### 进化或死亡——当变化是唯一不变时


  我喜欢将AI将要求所有行业发生的演进称为竞争性必然，因为我们用来描述这一范式转变的语言需要更加紧迫，如果要充分为人们准备即将发生的事情的话。每个行业都是其自身的一个宇宙，一旦行业内的公司开始通过AI采用看到成功，这种采用将加速。我之前提到过，产品管理本质上是一个商业角色，因为作为PM或领导者，你肩负着产品的商业成功。推广AI产品所带来的竞争优势和营销轰动是不可否认的。


  但除营销之外，AI还能让所有行业以更切实的方式前进。所有经济和社会领域都将随着AI而改变，从医疗保健到科技，再到教育和政府。随着向AI采用的过渡，行业与原材料的关系以及规划、预测和构建产品的方式将发生变化。世界经济论坛（WEF）将我们目前所处的工业革命定义为“以技术融合为特征，模糊了物理、数字和生物领域的界限”。我喜欢这个描述，因为它将AI和ML牢牢地置于这些领域的中心。为了应对物理层面，我们需要一种将物理世界转化为数据的方式。这些数据可能关于我们之外的世界中的任何事物，也可能关于我们自己。这种数据的收集和处理不可避免地将在某种程度上与AI和ML交互，以便以某种方式变得可操作，一旦这个球开始滚动，我们人类凭借无限的创造力和灵感，将想出超越我们今天所见用例的新组合和表达方式。


  我们生活以可见和不可见的方式发生变化，影响了许多技术领域，而不仅仅是AI。我们目前正在这些领域看到巨大的突破，WEF继续说道，“数十亿人通过移动设备连接、拥有前所未有的处理能力、存储容量和知识获取能力所带来的可能性是无限的。这些可能性将通过人工智能、机器人技术、物联网、自动驾驶汽车、3D打印、纳米技术、生物技术、材料科学、能源储存和量子计算等领域的出现技术突破而倍增。”这正是我们这个时代见证这一切如此令人感激的原因。实际上，一场技术文艺复兴正在发生，我们每次阅读新闻、下载白皮书或找到一项研究时，都在实时见证这场文艺复兴的展开。我不断提醒自己，当前的技术进步是多么令人兴奋，考虑到15年前，我还没有智能手机。


  即使在我们正在经历突破的领域之外，伤亡或负面外部性，例如工作岗位流失，也伴随着所有这些进步。工作的自动化将取代例行任务和工作，而几乎所有工作都包含某种例行。这一切都是不可避免的。这也是为什么有些人害怕AI时代，因为他们担心AI会取代他们的工作。毕竟，如果一家公司可以通过自动化、购买产品或使用某种形式的AI取代人类工人来完成工作，那么它为什么不这样做呢？有一些人在运营、采购或财务部门工作，他们的整个工作就是寻找为公司省钱的方法，甚至这些人自己的工作也可能被自动化！最终，转变将会到来，在此期间，我们将一次又一次地通过头条新闻读到它。


  但更可能的是，AI将被用来在某种程度上协助几乎所有工人的工作。我不想淡化AI带来的集体损失。数据录入和制造业中的一些工作永远不会回来，你也可以说它们不应该回来。但AI可能会使所有这些争论变得无关紧要，通过自动化我们希望通过提高最低工资来提升的工作。我们听过AI将取代令人不愉快、令人麻木和压迫的工作的说法。我们也听过AI将允许人类利用他们的好奇心并通过从事将创意、复杂问题解决和批判性思维技能置于首位的工作赚取更多钱的说法。这假设大多数人想要这样，并且不想要一份他们可以日复一日轻松完成并过着远离复杂思想的平静生活的工作。那些了解情况并能预见到工作因AI而如何变化的人可以更好地为此做准备，他们可能会因为拥抱这种变化而赚得更多。其他人可能会发现他们的工作被自动化到不存在。这几乎是确定的。


  抛开所有厄运和阴霾，仍有积极的一面。未来人们将从事的许多工作目前尚不存在。根据戴尔和未来研究所（IFTF）的一份报告，到2030年将存在的85%的工作目前还不存在。这令人难以置信。或许更令人难以置信的是，我们所有人随着时间的推移都在共同发现这一切。就在15年前，如果有人告诉我们他们是社交媒体经理，我们会感到困惑。即使在我自己的职业生涯中，我也看到以前被称为客户经理的角色转变并演变成更侧重销售的客户主管角色，或更侧重绩效的角色，如客户成功经理。数据分析师和数据科学家这两个术语也在不久前进入了主流意识。两者角色的功能已经存在一段时间了，但这些角色的正式化和它们在特定时间点所代表的意义是一个新的发展。在不久的将来，我们可能会比现在更经常听到远程外科医生、数据经纪人、无人机经理和VR技术员等说法。


  AI采用将要求我们进行的演进将产生积极和消极的影响，就像任何技术采用一样。我们现在能否说我们因为学校、办公室、医院和家庭的墙壁里通电而变得更好？我们如何量化对我们生活和工作方式的如此巨大变化的社会和经济净收益？电力贡献者如何能知道，最终他们的突破将为互联网和AI提供动力？如果你能穿越时空回去告诉他们，他们甚至不会理解你向他们解释的严重性。首先，保持对风险的关注很重要。






  我们希望看到政府和企业携手拥抱这场技术变革，并看到各大产业部门认识到需要能够帮助他们打造下一代产品的熟练工人，以及通过带薪实习、培训项目和领导力项目来培养这波工人，让更多工人进入有前景且充实的职业。我经常在关于技能提升和职业转型的演讲中提到，我反复提醒听众，他们对技能提升的兴趣、投入和承诺对整个社会都极有帮助。数据分析师、数据科学家和机器学习工程师供不应求，存在巨大的技能缺口。这些领域缺乏足够熟练、受过培训且经验丰富的工人来满足企业日益增长的需求。如果你踏上这段学习之旅，你最终会取得成功，并且会获得一份终身职业，让你保持兴趣。我们只能希望我们的更大机构能够看到帮助个人承担技能提升负担的积极意义，并投资使其过渡更顺畅，因为这确实是一项社会和经济投资，对所有人都有利。


  ## 第四次工业革命的变化


  当一家公司及其领导层开始开放拥抱人工智能的能力和潜力时，了解人工智能可能提供的全部机会范围非常重要。了解人工智能采用对贵公司和领导团队的范围和竞争优势意味着什么至关重要。产品功能并不是人工智能唯一能够帮助的领域。


  你的战略还将决定你如何开展人工智能项目开发。在以下章节中，我们将简要探讨在文化和结构方面的预期变化，然后讨论与人工智能战略相关的主要投资领域，以便你为企业选择最佳行动方案。我推荐的最佳实践是累积使用这些方法。如果你从咨询开始然后逐步推进，你将为企业在人工智能采用和战略方面取得成功奠定基础。


  ## 文化和结构变化


  由于人工智能极度依赖数据，并且进展源于性能基准测试，你首先必须在整个组织中拥有健康的*数据驱动文化*。如果你没有一致的基线，就很难看到人工智能如何帮助你。在实施人工智能项目和在产品中加入人工智能功能之前，建立指标和
  KPI 来跟踪你的绩效，对于衡量和传达成功至关重要。建立这种文化必须自上而下进行，我邀请所有阅读此书的领导者投资于建立这种文化，以便最大程度地看到人工智能采用带来的成功。


  在本节中，我想强调的第二个文化影响是拥有一种*愿意、开放和好奇*的人工智能文化。据《哈佛商业评论》报道，80% 的人工智能项目失败，这一数字几乎是十年前 IT
  项目失败率的两倍。这很大程度上是因为组织在人工智能采用方面没有为成功做好适当准备。用压力和紧张淹没你的数据科学、机器学习和产品团队并不是让他们取得成功的办法。能够迭代、实验并在人工智能方面承担一定风险，以便你的团队感到安全去尝试各种用例，对于让人工智能在你的组织内获得最佳机会至关重要。


  在你取得早期成功之前，保持健康的怀疑态度并适度管理对人工智能活动的期望很重要。当这些早期成功出现时，大声、骄傲地在整个组织中庆祝它们更为重要。


  很难夸大人工智能采用对所有行业和所有工作角色意味着什么的严重性，技术角色和非技术角色之间的界限也将开始改变。目前，人工智能在商业文章中大多被提及为一种日益增长的趋势或浪潮，但这股浪潮正在迅速变成海啸。为了保持与同行的竞争力，所有行业的所有公司都将发现自己在为人工智能的数字化转型而争相努力。随着越来越多的公司这样做并成功推进人工智能采用，我们也将看到对数据中心角色的需求增加，原因很简单，大多数产品、内部运营和客户讨论都将随着公司的人工智能采用战略而演变。


  我们也已经开始看到自动机器学习（autoML）公司和产品开始增长。像 DataRobot 和 H2O.ai 这样创建 autoML 产品的公司开始越来越多地出现。这将使任何人，甚至那些不主动从事数据科学家和机器学习工程师工作的人，都能够使用、调整、测试和部署机器学习模型以实现性能。这意味着随着时间的推移，人工智能采用将变得更容易被那些选择吞下红药丸的人所接受。


  这也引出了一个问题：数据科学家和机器学习工程师会怎样？这些角色的需求预计不会随着时间推移而下降。随着越来越多的公司拥抱和规划其人工智能战略，即使是起步较早的公司也会发现自己在寻找合适的资源来推动发展。你的商业战略将影响你如何涉足机器学习和高级分析。最终，你的预测、市场战略和增长战略将影响你以多快的速度以及以何种方式开展内部人工智能项目的创建、延续和增长。你可能会决定从产品开始，但你也可以从人工智能在人力资源或财务等内部职能中的应用开始。如果你回忆一下我们在第
  6 章中列出的人工智能用例，你通常会使用人工智能来解决八种主要类型的问题：


  - **异常检测：** 应用人工智能/机器学习来识别不符合预期行为模式的罕见或异常模式（例如，欺诈检测）

  - **聚类/同伴分组：** 应用人工智能/机器学习根据相似性将数据点分组到不同的集合中（例如，用户细分）

  - **分类：** 应用人工智能/机器学习根据既定类别集为数据分配标签（例如，垃圾邮件检测）

  - **回归：** 应用人工智能/机器学习基于训练数据预测数值（例如，预测房价）

  - **推荐：** 应用人工智能/机器学习根据既定偏好建议相关项目或内容（例如，购物车推荐）

  - **排序：** 根据标准对项目进行排序或优先排序（例如，搜索引擎结果）

  - **优化：** 从一组潜在解决方案中找到最佳解决方案（例如，驾驶路线优化）

  - **生成：** 基于输入示例/提示创建新数据/示例（例如，图像生成器）


  所有这些用例都可以应用于你的产品或内部流程。随意跳到本章末尾查看我们的案例研究示例，其中演示了如何将回归、优化、推荐和异常检测潜在地实现为传统软件产品的新人工智能功能，以集成人工智能。也许你想预测你销售的某些产品的需求量以用于库存目的。也许你想看看你的某些客户的购买是否欺诈。也许你正试图将你的客户分组到有针对性的类别中。所有这些问题都可以用人工智能来帮助解决。同样，你也可以选择在产品开发中使用某些算法来帮助你的产品为客户做出预测，向他们展示他们与同行相比的表现，或为他们提供其表现异常的洞察。人工智能适用于内部和面向客户的表达。这里有一个值得思考的问题——这些用例中哪些与你相关，你会选择哪种方法？


  > 人工智能初创公司的数量、风险投资公司的年度投资额、职位空缺预测、年度人工智能专利数量以及已发表的人工智能论文数量都在上升。根据 Crunchbase 的数据，2024
  年 35% 的所有初创企业投资都流向了人工智能公司，创下历史最高纪录。预测显示，到 2030 年人工智能市场将增长 28.46%，届时全球将达到 8267 亿美元。目前全球有
  70,717 家人工智能初创公司。这意味着我们正在经历人工智能需求和投资的巨大爆发，而这仍然只是开始。


  ## 与人工智能顾问合作


  如果你只是涉足人工智能，一个可以开始的领域就是寻求顾问的帮助。在自行研究该领域时，了解你面前可选择的范围可能会令人望而生畏。这些选项可以涵盖从数据准备到模型部署和人工智能项目优化的一切。如果你在此领域缺乏专业知识，与顾问合作可以帮助你驾驭可供选择的方案。你还必须就想要的基础设施类型做出一些决定，你的高科技项目的报告结构会是什么样，以及在你的组织内实现最大可见性的数据或人工智能项目的最容易应用领域在哪里。我总是建议公司从一个高影响力的项目小规模开始，因为你第一次尝试人工智能很可能会遇到犹豫或抵制。


  这是一种未知事物，对于什么是成功还没有建立基线。顾问在首次项目中非常出色，特别是如果公司在将人工智能计划与组织的战略和资源保持一致方面遇到困难，或者只是帮助你建立正确的<|message|>
  基础设施和工作流程来实现目标。许多公司会尝试在没有外部顾问和战略家的帮助下自行构建人工智能管道，但如果你对如何管理人工智能项目没有良好的理解基础，你可能会在没有经过充分思考的决策上花费大量资金。






  以下是顾问可以处理的任务：


  - 识别 AI 用例

  - 制定与公司目标和使命一致的 AI 路线图

  - 数据评估和盘点

  - 数据准备以及数据收集、清洗和标注的最佳实践

  - 实施数据治理策略以管理数据访问、隐私和合规

  - 构建 AI 技术栈的基础设施、工具和平台建议

  - 设置和配置 AI 基础设施


  ## 与第三方合作


  也许你想与一家咨询公司合作来帮助你，而不是只找一个人。这与我们在上一节讨论的内容类似，但具有以下关键优势：


  - 你将获得咨询团队或公司的额外帮助，该团队或公司过去做过类似的工作，与众多公司合作过，并且拥有良好的声誉。

  - 第三方也倾向于垂直化，因此你可以在专门从事你特定行业或用例的咨询公司生态系统中进行搜索。了解你自己的目标与行业同行的关系，是确保你从竞争角度朝着正确方向前进的一种方式。

  - 与一群顾问合作还能让你从一群人身上学习，这些人随后会与你的员工合作并对其进行教育。

  - 许多公司也难以找到真正拥有所需经验的合适候选人。AI 是一个广阔的领域，取决于你产品的专业化程度，可能很难仅凭现有的人才在内部提供足够的支持。咨询公司拥有自己的
  AI 人才网络，因此与你信任的公司建立合作伙伴关系意味着你可以拥有一方第三方，随着你 AI/ML 需求的变化为你提供指导。这是一种对冲风险的方式，避免做出后来被证明是错误选择的基础设施或业务投资。

  - 这也是确保你能够获得真正符合你需求的人才库的一种方式。


  使用第三方的注意事项是，它最推荐用于高层组织教育或真正精选的概念验证。如果你使用顾问来做你的产品或某些内部职能，并且认为他们会为你创建一个很棒的 ML 产品，然后让你的工程师接手，你会感到失望，你的
  ML 项目很可能因结果糟糕而无法获得公司或领导层的赞助。也许你还没有准备好聘请员工。


  也许你有优秀的开发人员，他们可以定期调优、重新训练和部署模型，但不具备建立算法或选择模型的能力，你需要有人具备更强的统计背景来为你的用例创建最佳模型。你可能会想诱惑地只使用咨询公司让你达到第一阶段。避免这种诱惑。如果你积极寻求从数据战略和
  AI 开始，使用顾问来教育自己并就如何推进做出决定，然后投资于真正从内部了解你业务的人来接手。


  ## 首个招聘


  这就引出了首个招聘。你的首个招聘将是足够全面的通才，能够像顾问一样为你列出所有选择，但他们全职为你工作，因此如果他们的领导团队同意建议，他们可以跟进想法。在你评估和面试这个人时，要明确告诉他们你希望在业务的哪个领域加入
  AI、自动化、先进分析或 ML。我也会明确该职位的目标，你真正需要帮助的地方，以及你所处的阶段。如果你只能聘请一个人来启动，我也会确保你对第一个项目是什么样达成一致，这样另一方不会感到意外。


  你应该对你的数据和 AI 战略有相当清晰的认识，这样就不会给这个人施加不切实际的压力。AI 产品经理、ML 工程师、数据科学家、数据工程师和数据分析师各有专长，几乎不可能找到数据通才。能够告诉你数据的最佳基础设施和工作流程，实际构建这些管道，清理所有数据，将其加载到模型中，适当训练这些模型，部署这些模型，最后以对业务有意义的方式传达所有这些工作的成功的人是不可能找到的。你也不想一开始就聘请整个团队，而没有有意义地应用他们工作的方式。这些角色都不便宜，因此在你真正了解如何使用他们之前就投资团队，就像在你获得驾照之前就买潜水艇一样。AI
  是对你业务的巨大投资，因此在开始招聘之前请确保你对自己进行教育并利用顾问的帮助，这样你就不会浪费钱。这是一个生态系统，每个人在其中都有自己的位置，原因充分。


  ## 首个 AI 团队


  现在假设你对从哪里开始有了很好的想法，你为你的数据和 AI 人员准备了一些不错的早期项目，并且你已经在 AI 应用中看到了一些成功。兴奋感在你的业务中蔓延，你有许多部门联系你，询问他们是否可以启动自己的
  ML 项目。突然，你唯一的 数据科学家或 ML 工程师被工作压得不堪重负。你开始投资一个团队，本质上是一个全新的部门。在第 6 章中，我们讨论了 ML 工程师、数据科学家、数据工程师和数据分析师的产品经理角色——这就是你的
  AI 团队。这是能够让你负责任地建立 AI 功能并优化你的基础设施、数据管理、工作流程、数据管道、建模、训练、部署以及与业务沟通的团队。为此设立专门团队是最佳且合乎道德的做法，因为
  AI 管理需要大量的工作和维护。如果你负担得起，你知道如何最好地利用你的员工，并且你知道如何让他们保持快乐和投入，他们将为你的产品和业务创造大量机会和成功。


  ## 恐惧不是答案——可获得的收益多于损失（或支出）


  相信并梦想成功是 AI PM 的重要技能。角色的很大一部分围绕着构建产品愿景、使命和战略等概念，最终利用这些工具创建将这些更模糊概念具体化的路线图。作为 PM，你必须训练自己进行可视化。


  如果你不保持对目标的清晰度和专注，就无法进行可视化。一切都关乎一致性。你可能会发现自己一次又一次地说：“我们有共识吗？”作为 PM，以至于你会发现 TikTok
  视频嘲笑 PM 说这句话说得太多。也许这之所以如此有趣，是因为一致性对角色至关重要，以至于工作职能本身可以浓缩为这一个词。你在各方面创造一致性。你让领导层、营销、销售、客户成功、运营、财务、工程以及无数其他受影响的业务职能围绕产品达成一致，并帮助构建所有这些团队都可以为之自豪的成功事物。


  这是角色的情感部分，我觉得有必要在本节中提出这一点，因为许多 AI PM 可能会发现自己面临处理 AI 的繁重任务，而他们一开始可能对它知之甚少。这种由此产生的恐惧正是促使我写这本书的本质。在我担任
  AI PM 的第一个角色中，我感到恐惧在我心中涌现。我对自己对 AI 的了解感到不安全。我在担任第一个正式的 ML 角色之前就有数据科学和 ML 背景，我仍然有这种恐惧和不确定性。我开始管理一个关于数据科学、AI
  和 ML 书籍的读书俱乐部，以抵御这种恐惧。在读完每一本书后，38 本及以后，我发现自己对该主题越来越自信。然后我开始撰写和分享自己的文章，以管理我在管理这些产品时产生的复杂情绪。


  当我客观地看待这些情绪时，我认为很有趣的是我仍然对自己的知识和技能有所保留。毕竟，并没有太多 PM 来自数据科学和 ML 领域。首先，因为这一点，取决于他们的信心水平，我敢说大多数
  AI PM 很可能会发现自己在处理我所感受到的许多情绪。特别是在前几节中，重点是非 AI 原生产品，我想解决 AI 产品管理的情感方面，并进一步深入了解如何将
  AI 和 ML 的力量置于情境中，以保持恐惧不被激发。


  如果我们把情感方面缩小并从鸟瞰视角来看待待办事项，什么是真正的对齐？我们在上一节讨论了许多首批战略招聘，诱惑是列出这些角色可能完成的任务清单。但最终，任何角色都可以完成这些任务中的任何数量。很多恐惧会在我们冒险进入未知领域并被关于正确前进方向的相互矛盾的信息淹没时产生。我认为更有益的是思考你作为
  AI PM 将在哪些层面上工作的一致性，这将保持你的恐惧不被激发。以下是你从一开始就会处理的对齐领域列表：


  - **规划和路线图：** 在早期，你将识别 AI 可以为你的产品或组织增加最大价值的领域。你将与你的技术对应方合作，找到提高运营效率、增强客户体验或实现新业务的领域。这将以
  AI 采用的结构化计划的形式正式化；它将包括成功所需的步骤和里程碑。

  - **数据战略和管理：** 你将与可以帮助你评估数据的质量、可用性和结构的人合作，并为你提供如何填补你所拥有的任何差距以及收集、清理、转换和访问你的数据以确保其足以用于任何
  AI/ML 建模的指导。






  甚至我们现在看待角色定义的方式也将开始改变。目前，你可能会看到诸如 AI PM 或 ML PM 之类的角色，这些角色明确了对 AI 或 ML 产品的关注。随着时间的推移，我的预测是，随着所有
  PM 角色因采用 AI 而成熟，这种限定词将逐渐消失。正如你在本书中一再看到的那样，就像所有公司都将在这个十年末成为 AI 公司的观点一样，对于 PM 来说也是如此。很可能在
  10 年内，你必须对 AI 有所适应并熟悉，才能成为一名 PM。


  我最后想在这部分谈及的是，为了研究、开发、测试和管理你的 AI 活动而建立相应 AI 项目所涉及的成本。作为 AI PM，你不一定要时刻关注如何在你公司处理这项职能的成本和决策，但你需要熟悉投入到你产品中的成本。如果你正在积极开发
  AI 功能，这将是你构建产品时需要跟踪的一个领域。作为 PM，你的部分工作是比较某些功能开发的成本与投资这些功能带来的潜在收益。你选择用来证明你所投资功能的价值和**投资回报率（ROI）**的指标，将构成你的商业论证。


  记住，AI 游戏仍然相对早期。除了顶级科技公司之外，AI 的采用率还不高。这意味着在这个阶段，至少在未来几年内，那些为产品推出 AI 功能的公司仍然领先于潮流，这可以说是发布
  AI 功能的最佳时机。带着 AI 功能进入市场意味着你能够在竞争对手产生同样想法并发出同样的营销信息之前，更快地争取更多的市场份额：“我们是唯一由 AI 驱动的
  X”这种说法只能持续一段时间。在许多行业中，AI 功能本身就是营销差异化因素。保持一致并控制我们在上述领域中的角色，将使我们能够自信地进入市场。除了营销之外，如果实施得当，AI
  功能应该会给你带来一个更强大、更智能的产品。实际的产品功能和结果将拓展你产品的声誉，并带来自然增长。如果你利用 AI 功能的方式能帮助你的产品为客户省钱、省时或更快地赚钱，那么它就应该从有效的方法中学习。AI/ML
  的内在承诺在于这个等式：数据加模型等于更多数据和更好的模型。如果你的数据是干净的，并且你的模型定期更新，你的表现就会提高。当你越来越熟悉这个过程时，你对你所在市场中产品的功能和性能的直觉会得到微调。当你开始看到
  AI 功能为你的产品增加的规模和洞察力取得进展时，你就会开始预判 AI 产品可能出现的问题。这就是在你的 AI PM 角色中需要适当保持一些适度担忧的地方。


  ## 预判潜在风险


  当前 AI PM 形式中的一部分专业化就是对可能出错之处的了解。你的 AI 功能可能对客户数据进行某些越界使用，而作为 PM，你的工作就是预判你的产品可能给用户带来的潜在风险。作为
  PM，你要解决用户在产品上遇到的最重要的业务问题，但也要尽量将潜在的负面影响降到最低。


  AI 不应该是一颗银弹。仅仅为了获得竞争优势而贴上 AI 标签并不是成功策略，因为如果 AI 没有显著改善你的产品，只是作为一个虚荣功能出现，你最终会发现那些恰当地利用
  AI 的产品会超越你。了解要扩展哪些 AI 功能以及它们如何改进你的产品，将使你作为 AI PM 的工作更轻松，而且随着时间的推移，你会越来越清楚这一点。发挥你的好奇心和实验精神，承担明智的风险。弄清楚如何最好地支持你的公司，以及
  AI/ML 的局限性和好处，将为你确定功能优先级和规划产品战略的成功做好准备。了解你的 AI 投资可能在下游造成的潜在危害，将帮助你在公司内部以及行业外部建立信誉。


  作为 AI PM，你在为你的组织宣扬 AI。这种间接影响的很大一部分实际上是创造意识，并理解 AI 不仅为你产品和业务，也为你经常合作的其他利益相关者带来的增长、风险和固有机遇。随着时间的推移，所有角色都会受到
  AI 的影响。从某种意义上说，你只是领先于潮流，因为你的角色与 AI 及其潜力联系最紧密，你可以利用这些第一手知识来引导你的同行完成这一转型。


  ## LLM 的演变与开源 LLM 能力的崛起


  随着生成式 AI 和大语言模型（LLM）的兴起，我们正以前所未有的方式接近 AI 的大规模市场采用。OpenAI 成立于 2015 年，他们花了近 7 年的研发时间才发布了第一个版本的
  ChatGPT。但 LLM 已经酝酿了一段时间。在我们今天所知的 LLM 之前，有许多早期语言模型使用其他名称：


  -   **N-gram 模型**自 2000 年代初以来就能够预测句子中的下一个词。

  -   **前馈神经网络**自 2003 年以来一直作为概率语言模型工作。

  -   我们在*第 1 章*中介绍的两种模型，**循环神经网络（RNNs）**和**长短期记忆（LSTM）**模型，自 2010 年代中期以来就能够处理更长的提示和响应序列。

  -   **Transformer** 模型于 2017 年问世。

  -   Transformer 为构建更大的预训练模型奠定了很大一部分基础，例如谷歌的 **BERT** 和 OpenAI 的 **GPT** 系列，这些模型于
  2018 年发布。


  现在，这些预训练模型已经让我们看到了这项技术可以走多远，新兴趋势更加关注专业化这些能力并最大化效率。我们已经看到结合文本、图像、音频和视频功能的产品进入市场，但我们也看到有些模型能够以一小部分参数或
  LLM 所需的计算量匹配更大模型的性能。


  对于许多公司来说，将 LLM 融入其业务、在线体验或产品的一个简单方法就是提供聊天机器人。这导致了公司用知识库以及专业领域和任务来增强预训练模型的做法。调整 LLM
  并改进它们的微调将使我们走得更远，因为它们的潜力会更专注的方式被利用。


  我们还不完全清楚这种采用将如何影响市场。对一些人来说，包括 LLM 在内的生成式 AI 模型的威胁关乎存亡。其他人则将 LLM 视为可以用来让工作更轻松的工具。我们知道它将支持各种岗位上的员工，并且会让使用生成式模型的员工更高效。但我们仍然不知道最终结果会怎样。


  如今，许多公司正在利用 LLM 的热潮来剥夺员工自主权，在某些情况下还会裁员。一些公司鼓励员工使用生成式模型，而另一些公司则惩罚使用这些模型的行为。我们仍处于生成式技术采用的初期，但如果我们看一下数据，就会发现采用率依然强劲。根据
  iOPEX 的一篇文章，“67% 的组织已将 LLM 纳入其工作流程，并利用 GenAI 能力来解锁前所未有的洞察、自动化任务和优化流程。”另一家名为 Amperly
  的公司进行了一项 LLM 调查，发现 37.3% 的参与者每天使用 ChatGPT 等 AI 工具工作。大约 46% 的近半数人表示，他们每周使用几次。


  LLM 仍在经历炒作周期，即使在最初的兴奋感消退后，OpenAI 也在努力让用户持续回归。我们不知道持续使用会是什么样子，但我们确实知道，这类工具为开源社区的蓬勃发展提供了条件，并促使它们找到进一步推动
  LLM 能力的创新方法。Hugging Face、EleutherAI、BigScience、Turing-NLG、Cohere.ai、斯坦福 NLP 小组和
  OpenAI GPT API 社区等社区，都在鼓励以各自方式形成新的创新聚集地。


  这些空间是 AI 实践者可以找到预训练模型库、用于训练和评估模型的数据集集合、讨论论坛、GitHub 仓库、研究项目、Discord 服务器、API 访问资源、工作坊、活动、文档、教育资源和库的地方。随着我们逐步逼近
  LLM 的下一个前沿，许多下一个创新很可能来自开源社区。到目前为止，它们已经取得了以下成就：


  -   它们帮助实现了这些技术的民主化，使我们能够比以前更快地进步。

  -   它们使上面列出的各种模型和资源更容易被更多人获取，并通过提供预训练模型的访问权限分担了成本负担，这在以前是很难获得的。

  -   它们还允许快速原型设计，因此如果你有一个想法，你可以迅速与他人验证这个想法，并获得反馈来迭代下一个版本。

  -   开源社区还允许 LLM 的多样化使用。由于模型是在不同语言或领域开发的，它们促成了更多创造性使用 LLM 的出现。





  开源社区为创新带来光明，因为有众多目光关注着它们，而且它们的工作是公开发布的。由于许多开源项目遵循并推广合乎伦理的AI实践，它们能够对整个AI领域产生积极影响。


  需要记住的重要一点是，这些工具的可用性不会在短期内消失。为这一领域带来更多透明度和伦理规范，将让更多未来用例通过社区监督与协作进入市场。如果致力于生成式AI创新的专业社区能够携手帮助审计、识别和解决偏见，我们就能更安全地探索未来的AI潜力。用你的时间、知识、精力和想法投资开源社区，将让下一代技术专家在畅想AI新可能时，拥有更广泛的用例和应用可供使用。我们也很可能看到新的初创企业通过开源社区成长起来，与当今扼制AI创新的大型巨头竞争。如果大语言模型（LLM）的未来是开放且多样的，这将为市场带来巨大的价值。


  ## 案例研究


  在本案例研究中，我们将了解一家虚构的绿色科技公司 GreenCo123，该公司专注于优化商业建筑的能源消耗。他们正在开发下一代能源管理系统 GridOS。最新版本将包含AI功能。这个不断演进的产品旨在通过预测能源需求并自动化HVAC系统、照明及其他高能耗操作，帮助企业降低能源成本、减少碳排放并提升建筑的可持续性。


  GreenCo123 研究了以下功能，以增强 GridOS 的AI能力：


  - **能源需求预测**：使用LSTM进行时间序列分析和预测建模，以处理基于历史使用数据、占用模式和运营计划来预测建筑能源需求的时间相关数据。这些内部数据还补充了天气预测等外部数据。

  - **自动能源控制**：使用强化学习模型动态控制HVAC系统、照明和其他设备，以在所有占用水平下优化能源消耗。

  - **异常检测**：使用无监督学习模型检测能源使用中的异常，以帮助发现设备故障或触发异常消耗模式，从而实现主动维护。


  ## 实施


  起初，GreenCo123 与一家绿色科技咨询公司合作，以帮助他们了解如何让 GridOS 显著更强大、从而在新兴的AI进化市场中竞争的选择。随后，他们又与这家咨询公司共同定义系统需求，以支持他们一起确定的AI功能。他们还与公司内部的数据科学家及其他利益相关者协作，开发了系统架构、数据管道和最初用于驱动上述功能的机器学习模型。


  当 GridOS 上线并在几栋试点建筑中部署后，GreenCo123 组建了一个内部AI团队，以支持他们创建的AI系统，并进一步开发和满足 GridOS 的需求。他们原本就有一位具备绿色能源领域专业知识的数据科学家，负责审批每个功能所使用的模型，并与咨询公司合作，因此交接相对顺利。但在试点地点开始部署后，他们继续推进团队建设策略，该策略分阶段进行：


  - **第一层：** 试点结束后，由一个核心团队负责 GridOS 的日常运营，成员包括他们原有的数据科学家、一名负责维护数据管道的数据工程师，以及一名负责维护
  GridOS 试点项目的工程师。他们还聘请了一位AI产品经理来统筹所有活动，并为 GridOS 带来专注与目标。

  - **第二层：** 随着规模扩大，团队增加了数据科学和机器学习工程人员，以应对模型规模以及跨多栋建筑和地点的部署规模。

  - **第三层：** 在第三层，他们成立了独立团队来支持前面讨论的每个主要功能。一个团队专注于能源需求预测的预测建模，另一个团队专注于自动控制的强化学习模型，第三个团队负责异常检测活动。


  ## 风险


  对 GreenCo123 来说，集成AI是一次经过深思熟虑的风险决策。他们必须为绿色科技咨询公司以及支持 GridOS 中AI功能所需的数据工程、数据准备和基础设施开发预留资金。以下是可能影响下一代
  GridOS 的风险，以及AI产品经理如何应对这种新增的复杂性：


  - **系统可靠性与安全性：** 自动能源控制功能给 GridOS 带来了一个问题。如果它出现故障，或者让楼内人员暴露在不适宜的环境中怎么办？AI产品经理必须提前应对，不仅要实施严谨彻底的测试流程，还要引入手动后备机制，以便在出现问题时可以轻松覆盖AI系统。

  - **数据质量与标准化：** 由于运行 GridOS 所需的大量数据来自不同建筑，而这些数据的一致性程度参差不齐，AI产品经理必须确保建立稳健的数据治理框架。这样，来自多个来源的数据才能在进入模型训练之前得到标准化和清洗。

  - **适应性：** GridOS 管理的每栋建筑都有其独特的能源使用模式、特征和设备。AI产品经理与机器学习工程师合作，优先开发可适配的模型，以便轻松针对每栋建筑进行定制，从而提前解决了这些问题。


  在本章中，我们将介绍以下主题：


  - AI集成增长最快的领域

  - 低垂的果实——AI赋能中最容易取得的快速胜利

  - 乘上生成式AI的浪潮


  ## AI集成增长最快的领域


  首先，我们将了解一些最知名的研究和咨询机构所提出的AI增长领域。理解这些信号所传达的信息，能让我们获得动力和远见，从而预见未来的一些重大机遇。这在企业或产品向AI转型的背景下尤其有用，因为许多产品经理和技术专家可能对于应从产品或服务的哪些具体领域开始增强AI能力存在分歧。


  根据 Statista 的数据，2024年全球AI市场增长超过1840亿美元，较2023年增加500亿美元，按保守估计预计到2030年将超过8000亿美元。Research
  & Markets 的一份报告给出了更乐观的预测，认为到2030年市场规模将超过1.1万亿美元，其中北美和亚太市场将带来最大的增长。


  Gartner 的AI应用曲线识别出组织在实施AI时会经历的几个阶段：


  - **规划阶段：** 组织在此阶段识别可行的AI用例并进行实验。示例包括医疗保健初创公司或零售商，它们在进行大规模实施之前，先利用AI进行试点项目和用例验证。

  - **实验阶段：** 公司将在受控环境中测试AI以评估影响。区域性金融机构、银行和物流公司可能会先小规模测试AI工具，然后再将其扩展到更广泛的业务中。

  - **扩展阶段：** 组织在此阶段超越试点并规模化AI用例。较大的零售连锁和电信公司可能在初步试点和小规模推广显示出潜力和投资回报率后扩大规模。

  - **优化/转型阶段：** 组织在此阶段全面整合AI，将其作为竞争优势。科技巨头、大型汽车公司和大型金融机构已将AI深度融入产品和运营，展现出成熟的AI应用能力。


  截至本书发布时，Gartner 预测到2027年，全球24%的组织仍将处于AI应用的规划阶段，而36%的组织将处于实验阶段。推动这一应用趋势的是AI增强型软件产品的兴起，尤其是软件公司扩展AI功能与能力的趋势，以及用于创建其他AI产品和应用的AI工具的增加，还有AI原生产品本身的兴起。Forrester、Gartner
  和 McKinsey 在过去一年发布的研究中，一个共同主题是过去几年组织在AI转型方面的实验性质。总体来看，各组织都在报告趋势的转变。如果说过去几年是理解用例并实验新模型、新应用和新方法，那么未来几年将是应用这些经验教训来推动实际影响和增长。





  伦理 AI 实践的增长数据也令人鼓舞，表明随着经验和投资的增长，个人和公司正认真对待 AI 所带来的伦理和责任问题。Forrester 预测 25% 的科技高管将需要向董事会报告其
  AI 治理活动，以涵盖“可解释性、对高影响算法决策的公平性审计，以及对 AI 环境影响的核算（绿色 AI）”。这也表明董事会和高层决策者意识到，如果没有妥善考虑
  AI 可能对客户、用户和组织造成的潜在危害所带来的风险。


  基于他们在该领域自己的研究，Gartner 曾预测到 2023 年，任何被聘用于 AI 系统开发和培训工作的人都需要证明其在伦理和负责任 AI 方面的专业知识。不幸的是，目前尚不清楚这种情况是否属实。他们对他们所认为的因果
  AI，即能够展示可解释性并传达因果关系的能力的 AI 的展望要长得多。Gartner 认为，因果 AI 可能需要长达十年的时间才能实现主流采用，但最终将对业务产生“变革性影响”。在这里，我们也看到了信任与责任相辅相成的关系，公司理解可解释性和沟通风险影响甚至那些在公司内担任高职的人。


  Gartner 将 AI 信任、风险和安全管理（AI TRiSM）列为 2023 年的战略技术趋势，指出在美国、英国和德国，41% 的组织曾经历过 AI 隐私泄露或安全事件。这进一步凸显了世界仍非常需要渗透到隐私和安全领域的负责任
  AI 实践，它们非常需要并且将继续保持相关性。看到研究机构中的这些指标令人鼓舞，但这只是对未来的预测，而非现实体现。


  随着公司继续构建和投资其 AI 产品，它们不仅需要以值得信赖的方式为用户利益构建产品，而且还应认识到不这样做可能会威胁到他们花费大量时间和金钱、耐心构建的 AI
  技术投资。


  麦肯锡的《2022 年技术趋势展望》报告也强调了嵌入式/应用 AI 中的可信度和可解释性是将其纳入产品时最需要考虑的因素之一。随着 AI 用例的扩展，能够对冲风险尤其令人担忧。遵守法律、在伦理方面保持警惕，以及以社会稳健的方式构建
  AI 是他们为减少伤害而构建的建议。他们还指出，可解释性与此密切相关，进一步强调随着模型变得越来越复杂并部署在高风险用例上，可解释性问题将保持关键。


  麦肯锡将可解释性列为三方面：


  - 解释模型实际的工作方式

  - 组织展示因果可解释性，即解释为什么某些输出来自输入。

  - 信任诱导的可解释性，即解释为什么你可以信任并部署一个模型，这也许是最重要的


  构建 AI/ML 产品并将传统软件产品升级为 AI 产品将是一个持续的过程，不断强化其在多个领域的信任度、可靠性和安全性。这让我很有信心，这三家著名的咨询机构给予伦理
  AI 应有的重视，因为我们继续利用这些强大的工具构建未来。


  # GenAI — 沉浸式应用


  另一个主题围绕着 GenAI 的快速采用和成功。获取宝贵的经验并利用 GenAI 的力量付诸实践，会带来证明投资回报率和为组织展示切实价值的压力。我想鼓励你们作为
  AI 产品经理，效仿这种做法，为你们的产品规划大胆的路线图，并通过优先考虑最终为客户、用户和内部利益相关者带来真正价值的用例来避免分心。但请记住，GenAI 模型才民主化了几年。根据
  Forrester 的 2024 年第二季度 AI 脉搏调查，“49% 的美国生成式 AI 决策者表示其组织预计在一年到三年内对 AI 投资实现投资回报率，44%
  表示在三年到五年内。”


  由于 AI 技术格局不断演变，开发周期长，以及构建 AI 产品资源密集，期望在三年或五年内实现真正的投资回报率仍然雄心勃勃。AI 产品经理需要帮助其组织在证明投资回报率的压力与平衡短期和长期投资回报率机会的创新、大胆路线图之间取得平衡。围绕将带来短期投资回报率的功能和能力所获得的收益再投资到长期项目中来制定战略，是建立在
  AI 成功基础上的好方法。


  麦肯锡的 *《2024 年技术趋势展望》* 报告强调了 GenAI 和 LLM 的上下文窗口，该窗口从 10 万个 token 增长到 200 万个 token。这意味着随着生成模型的采用数量创纪录地增长，它们处理越来越复杂提示的能力已大规模扩展。现在我们看到
  LLM 从文本摘要和图像生成发展到通过视频、图像、音频和文本实现更复杂的能力。这意味着随着强大 GenAI 模型的能力增长，它们正被更积极地集成到软件工具和面向客户的应用中。


  生成式 AI 应用在 2022 年至 2023 年期间度过了美好的一年。采用率强劲，公众蜂拥至市场中涌现的生成工具以尝试新技术。好奇心和实验精神很强。但正如我们从前面提到的公开试验中发现的那样，由
  2023 年 SAG-AFTRA 罢工引发，2024 年对 GenAI 来说是更加令人清醒的一年。除了前面提到的公开法律战之外，还有很多。名单今天相当长。最知名的
  GenAI 公司目前都面临诉讼，而对大多数公司来说，问题在于模型本身所训练的创造力。公众对 GenAI 及其用途的看法将继续波动，因为我们正在努力应对这些强大的模型能够访问大量人类创造力的含义。


  - **Domino''s Pizza** 在其 AI 推出方面采取了战略性做法，通过 DOM Assist 聊天机器人和预测性订购算法利用 AI 优化运营以及客户体验。通过开发干净的数据管道、采用持续数据转换，以及围绕
  AI 集成设定组织期望并启动 Project 3TEN，该计划旨在让披萨在三分钟内准备好送出，并在十分钟内送达客户，他们能够发挥最大效用。

  - **Capital One** 在其移动应用体验和欺诈检测系统中使用 AI。他们在构建必要的支持 AI 努力的数据管道和支持基础设施方面的切实挑战，以及培训团队使用
  AI 的工作，甚至培养对 AI 决策的信任。他们甚至进一步推出技能发展计划，为其产品经理配备有效支持 AI 部署并与他们合作的数据科学家一起成为模型所有者的正确技能。


  这些例子凸显了公司在 AI 集成方面最成功时，会优先考虑其数据管道和基础设施需求，并在通过设定期望、培训、研讨会或其他提升技能机会在文化上为团队做好准备时。


  从核心来看，AI 使能其实都与数据有关。找到最有效的方式收集、标记和整理大量非结构化数据，是使模型性能持续改进的原因。改进该数据管道，保持其清洁，并确保有稳定的供应用于训练目的，是赋予
  AI/ML 管道能力的原因。确保进行正确的数据转换并具备适当的数据质量水平，是 AI 使能的最终目标。这是因为 AI 对数据的依赖程度极高。


  AI 使能或 AI 就绪的最佳组合来自于拥有支持对 AI 投资的支持性强劲用例，拥有可用于支持这些用例的干净数据的强大网络，以及明确的治理策略，说明谁可以访问什么以及组织内部角色如何划分，以展示所有权、控制和安全措施，确保您的
  AI 投资尽可能成功。我们将在下一章更深入地探讨这些概念。


  # 乘上 GenAI 浪潮


  现在让我们把注意力转向 GenAI 模型和工具。LLM 和生成模型的兴起有助于使 AI 民主化，将能力带给各种规模的公司，而无需他们最初为扩展产品所需的巨额投资。变得更易获取的并非模型本身，而是将这些模型投入生产所需的基础设施。鉴于在生产中训练和部署
  AI 应用的成本高昂，**基础设施即服务（IaaS）** 平台今天存在以帮助推动创新和采用。其用途包括：


  - **充当知识库**：自从像 ChatGPT 这样流行的 LLM 问世以来，我们看到它们被部署为各种产品和公司网站上的聊天机器人和虚拟助手。在许多情况下，它们充当集中的知识库。虽然通用方法可能有助于扩展支持时间或覆盖范围，但最具创新性的聊天机器人公司能够将聊天机器人活动映射到特定的用例，从而减少或限制对内部呼叫中心和支持团队的依赖。





  ## 本章小结


  本章主要围绕人工智能应用的趋势与见解展开，这些内容来自一些在这方面最具权威性的公司。我们了解了他们关于未来几年乃至几十年AI应用的一些见解和预测。在许多方面，构建AI原生产品比将产品从传统软件开发过渡到AI产品更为直接。


  在本章中，我们想要奠定基础，并讨论AI应用的一些高增长领域，因为对许多公司来说，知道从哪里开始往往是最困难的部分。一旦你进入状态，就能更好地预判接下来会发生什么，但当你站在重大范式转变的悬崖边时，会遇到很多阻力。梳理增长领域、数据和常见用例，并为AI赋能奠定基础，是一个直觉性的选择，目的是确保AI产品经理们了解采用AI对其产品可能意味着什么。这是一项重大的责任和任务，理应如此对待。


  在下一章中，我们将深入探讨产品采用AI转型时的许多实际考量，以及这对你的产品团队或组织具体意味着什么。


