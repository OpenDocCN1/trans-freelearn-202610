  表 11.1：产品团队的重要行动


  这绝不是一个详尽的清单，但它是促成 Akeira 创始 AI 产品经理团队成功的实践清单。清单上的大部分项目都是有助于产品组织情感和文化健康的行动。这是因为创始产品团队知道，当他们尽最大努力支持其利益相关者、客户和潜在客户时，他们的产品就会取得成功。他们已经知道自己拥有一个优秀的技术团队。产品组织与支持它的机器学习和数据团队之间已经建立了大量信任。这意味着他们许多的努力和行动都集中在确保他们周围的其他人也知道这一点。


  鉴于 Akeira 的成功和采用情况，很明显创始产品团队的直觉和价值观是正确的。他们之所以专注于价值观和建立信任，是因为 Waterbear 的创始人已经知道对话式
  AI 会遇到阻力。市场充斥着对话式 AI，而且人们对 AI 公司的数据存储实践已经存在很多不信任。即使消费者并非天生怀疑或意识到这些问题，普通消费者也会向 AI
  敞开心扉仍然感觉像是一件遥不可及的事。这就是为什么他们早期的大量努力都集中在过度沟通上，并围绕信任和安全建立品牌形象。


  ## Summary


  在本章中，我们讨论了在领导层、利益相关者团队和日常运营之间管理一致性对 AI 产品经理成功的至关重要性。我们了解到，建立清晰的产品愿景、战略和路线图以反映公司的整体目标是必要的，因为
  AI 技术的应用必须通过跨职能团队协作来解决以用户为中心的问题。脱节可能导致在如此敏感的环境中代价过高的低效率。AI 产品经理还必须应对技术、市场需求、多样化的人格以及相互竞争的优先事项的波动性，才能有效地开展工作，正如我们在本章中所学到的。我们进一步了解到，通过培养好奇心和开放的协作与实验文化，AI
  产品经理可以对可能影响其 AI 产品开发周期的众多熵源进行对冲。


  本章结束了本书第 2 部分关于 AI 原生产品的讨论。到目前为止，我们有机会从团队、技术栈、产品化、定制化和定位的角度了解 AI 原生产品。我们讨论了构建 AI
  原生产品的诸多方面，并深入探讨了 AI 原生产品的基准测试、增长黑客和讲故事。我们还探讨了针对 AI 产品经理面临的独特挑战量身定制的最重要的产品设计和产品管理考虑因素。


  在第 3 部分，我们将探讨将 AI 能力和功能构建到现有传统软件产品中会是什么样子，并介绍一个新的案例研究示例，该示例将演示我们在第 3 部分中讨论的概念，就像我们在第
  2 部分中所做的那样。我们将从第 12 章开始第 3 部分，该章将重点关注 AI 的兴起以及产品团队如何为在已建立的情况下与 AI 合作的需求做好准备。


