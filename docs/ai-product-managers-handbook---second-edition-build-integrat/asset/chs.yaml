  \n## 本书面向的读者\n\n本书面向有志成为AI产品经理、AI技术专家和创业者的人，也适合那些对将AI产品变为现实的相关考虑感兴趣的人。如果你已经在从事产品管理工作，并对构建AI产品有好奇心，本书将对你有所帮助。如果你已经以某种身份从事AI开发工作，并希望将这些概念引入产品管理领域、承担更偏向业务的角色，本书同样适合你。尽管书中有些章节更偏技术，但所有技术内容都可视为入门级，人人都能理解。\n\
  \n本书的第1部分旨在概述AI领域的整体格局、该领域中可能存在的产品类型，并纵览整个行业。第2部分将提供更多关于AI原生工具产品管理的实用、应用型内容。第3部分延续这一格式，但重点是将传统软件产品转型为AI产品。在这两个部分中，你会看到更多适合手册使用的图表、流程图、清单和可视化辅助材料。最后，第4部分作为本书的最新部分，将聚焦于AI职业本身的管理，作为一份帮助你在PM角色中成长并探索发展路径的手册。\n\
  \n## 本书涵盖内容\n\n第1章《理解构建AI产品的基础设施与工具》概述了管理AI产品的基础设施的主要概念和领域。\n\n第2章《AI产品的模型开发与维护》深入探讨了模型开发与维护的细微差别。\n\
  \n第3章《机器学习和深度学习深度剖析》更广泛地讨论了传统深度学习和深度学习算法之间的差异及其用例。\n\n第4章《AI产品的商业化》讨论了我们在市场上看到的AI产品的主要领域，以及有助于商业化的伦理和成功因素的示例。\n\
  \n第5章《AI转型及其对产品管理的影响》探讨了未来AI如何融入主要市场领域。\n\n第6章《理解AI原生产品》概述了推动AI原生产品成功所需的战略、流程和团队建设。\n\
  \n第7章《将ML服务产品化》探索了从零开始构建AI产品时可能遇到的艰辛与考验。\n\n第8章《面向垂直行业、客户和同行群体的定制化》讨论了AI产品如何随着不同类型的垂直行业、客户类型和同行群体而变化和演进。\n\
  \n\n\n\n*第 11 章《管理 AI 原生产品》*回顾了与领导力和愿景、以及以 AI 原生方式构建的产品利益相关者和运营对齐相关的持续 AI 产品经理考量。\n\
  \n*第 12 章《AI 的涨潮》*重新审视了第四次工业革命的概念以及针对目前尚未利用 AI 的产品的蓝图。\n\n*第 13 章《行业趋势与洞察》*深入探讨了我们看到的\
  \ AI 在各行业中的各种发展趋势，以及产品团队在实现 AI 时可以采取的可及路径\n\n*第 14 章《将产品演进为 AI 产品》*是关于如何交付 AI 功能并升级产品的现有逻辑以成功实现\
  \ AI 商业成功的实用指南。\n\n*第 15 章《AI 产品设计的角色》*重新聚焦应用于产品团队的 AI 设计和沟通基础，这些团队希望通过 AI/ML 功能演进传统软件产品。\n\
  \n*第 16 章《管理不断演进的 AI 产品》*回顾了与领导力和愿景、以及采用 AI 功能和能力的传统软件产品的利益相关者和运营对齐相关的持续 AI 产品经理考量。\n\
  \n*第 17 章《开启 AI 产品经理职业生涯》*带领渴望从事 AI 产品经理职业的读者经历理论和应用基础的旅程，以为其萌芽的职业生涯奠定成功基础。\n\n\
  *第 18 章《成为一名优秀的 AI 产品经理意味着什么？》*分解了 AI 产品经理的各个方面，以及希望在该角色中脱颖而出的人在技术、业务、沟通、领导力和问题解决方面的考量。\n\
  \n*第 19 章《作为 AI 产品经理的成熟与成长》*探讨了 AI 产品经理可以通过规划理想的 AI 产品经理路线图、通过学习路径保持信息更新、建立网络以加深联系以及与他人分享经验和智慧来在职业生涯中成熟的各种方式。\n\
