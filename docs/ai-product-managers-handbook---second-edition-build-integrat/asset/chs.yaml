  \n\n\n\n# 4 将 AI 产品商业化\n\n现在我们正处于 **人工智能**（AI）整合的时期，我们看到 AI 的用例在各行各业中不断 proliferate。在我们管理\
  \ AI 产品的工作中，我们确实一直依赖 AI 顾问和博士级顾问来帮助我们进行建模并 orchestrate 我们的数据战略，以支持全规模的 AI 运营。然而，随着\
  \ AI 这一不断上涨的巨浪继续渗透到各个公司和用例中，我们看到对通过先进模型取得突破的依赖减少了。现在最重要的，是熟悉即使是简单、可靠模型的用法。专业化有其时间和地点。数据科学和\
  \ AI 是庞大的 umbrella 术语，但基于我作为产品经理的经验，我看到对数据和 AI 通才的真实需求，他们能够理解用例本身以及它们如何与商业视角相关联。\n\
  \n在智能手机之前的 AI 突破时代，我们没有广泛的用例选择，因为数据并不像现在这样丰富。生成式 AI 模型的兴起也在数据可用性方面有所帮助，因为许多 ANN\
  \ 需要大量训练数据来训练和优化这些模型。在许多情况下，神经网络也被用来创建合成数据。现在数据丰富了，我们看到了一种深刻的转变——重点不再是研究和发现最前沿的算法，而是获取足够的人才来使用经过验证的模型和算法。\n\
  \n我们特别喜欢的正是 AI 民主化的概念，或者说 AI 正在变得更容易被研究和大型科技公司之外更多群体所接受。尤其是在 2024 年，生成式 AI 模型在用例和应用方面席卷了整个\
  \ landscape。仅 ChatGPT API 就现在负责了市场上今天存在的众多生成式应用的 proliferate。\n\n作为一名产品经理，你对这一点的哲学将真的取决于你问谁。一些产品经理认为，创造最佳产品的方法是从\
  \ AI 角度进行自己的突破性研究。其他产品经理认为，你可以用已经普及或存在很长时间的模型，比如回归模型，取得很多进展。这仍然是事实，甚至在生成能力方面更加相关。其原因在于训练生成内容的复杂\
  \ ANN 的成本可能高得令人望而却步，因此在目前，我们将看到市场向由资金雄厚、开源组织训练的模型开放。\n\n产品经理的目标是帮助实现一个产品，它不仅是商业上的成功，也是工业上的\
  \ triumph。我们到底用工业 triumph 指什么？如果我们能促使你将一个真正能为世界提供新颖、必要且有用的产品的产品推向市场，我们就实现了撰写本书的核心目标。我们也会认为那是一次\
  \ triumph。\n\n可解释性是产品经理非常感兴趣的一个大领域。当你处理公众或敏感主题时，或者如果你有高知名度或企业客户可能在下游面临风险时，能够轻松解释你的\
  \ AI 产品、它如何得出某些结论以及其内部运作机制的想法变得非常重要。我们不想说服你应该成为什么样的产品经理；相反，我们想为你提供可供考虑的选项。\n\n本章的目的是突出近年来\
  \ AI 产品中的一些 promising 发展，以提供多种视角，说明 AI 如何在多种不同的商业模式中得到利用。这不是关于模仿其他公司，而是更多地欣赏 AI\
  \ 哲学、行为、伦理和实践如何从一种商业模式转变到另一种商业模式。对我们来说，这对于部门层面的产品管理至关重要。作为产品经理，你负责产品的商业成功，理解 AI\
  \ 如何与你的商业模式相关对你的风险管理很重要。\n\n有了这些，让我们探索 AI 产品管理做得最好的例子，并看看这种成功如何在所有领域、预期和意外的领域影响业务。在本章中，我们将通过不同商业模式和产品提供的\
  \ lens 来审视一些 AI 公司的例子，包括 **企业对企业（B2B）** 例子和 **企业对消费者（B2C）** 例子。我们还将审视在未饱和和服务不足的市场（蓝海）以及饱和和竞争激烈的市场（红海）中蓬勃发展的公司。本章的目的是突出企业在将\
  \ AI 产品推向市场方面蓬勃发展的几个关键领域。\n\n本章将涵盖以下主题：\n\n- 专业人士 – B2B 产品做得对的例子\n- 艺术家 – B2C 产品做得对的例子\n\
  - 先驱者 – 蓝海产品的例子\n- 反叛者 – 红海产品的例子\n- GOATs – 差异化颠覆性和主导战略产品的例子\n\n### 专业人士 – B2B 产品做得对的例子\n\
  \n专业人士是分组产品的一个很好的起点。AI 首先会 gravitate 向能够盈利并允许研究和优化的用例。因为 B2B 产品是为其他企业制作并由其他企业使用的产品，其用例完全面向商业世界。这影响到从营销方式到购买、销售、使用和谈判的一切。许多\
  \ B2B 产品都谈到产品可以为客户在多个层面满足的业务影响。这是一个学习 AI 可能有用的应用的绝佳方式。\n\n随着 AI 公司供应量的增加，它们需要数据来训练。其中一个与数据和\
  \ AI 产品扩张相关的伦理挑战是，能够提供大量数据而不泄露可以识别你为个人的信息，也称为 *私人个人信息（PPI）* 或 *个人身份信息（PI）*。总部位于英国的\
  \ AI 公司 Hazy 就为其客户提供这一点：利用合成数据派生洞察、理解信号并共享数据的能力。由于数据饥渴的深度学习模型的特性，合成数据在训练神经网络时是首选，因此\
  \ Hazy 拥有光明的未来。在最初的 300 万美元种子融资轮之后，它在 2023 年 3 月由 Conviction VC 领投的 A 轮融资中获得了 900\
  \ 万美元的融资。其最近一轮融资包括来自 UCL Technology Fund 和微软风险投资基金 M12 的资金。\n\n一家成功的 B2B 公司的本质在于其为其支持的企业创造成功的能力，尽管我们坚定地处于大数据丰富时代，机器学习和深度学习仍然需要大量的数据来定期学习和再训练。Hazy\
  \ 在缓解企业在数据可用性方面的痛点方面做得非常出色，这在客户群的忠诚度中显而易见。Hazy 保持这种忠诚度的另一种方式是通过教育客户了解传统匿名化或屏蔽现有真实数据方式的伦理和法律影响。\n\
  \n在生成式 AI 和 LLM 的世界里，Mistral AI 正在成为 OpenAI 的 ChatGPT 产品的一个强劲竞争对手。他们最强大的 B2B 产品是\
  \ Mistral Large，该产品已以超过 1500 万美元的价格售予微软，以支持其 Azure 平台。他们的另一款产品 Mistral 7B，是其基础模型的开源版本，也已被\
  \ Hugging Face 等公司使用，并且可免费使用。像 Mistral AI 这样的公司正在将强大的 LLM 的概念并将其定制用于更专业的用途。这是在 AI\
  \ 民主化方向上的重要一步，因为它允许那些想要采用 AI 而无需承担开发自己的 LLM 的巨大成本、承诺和时间的公司。当像微软这样的大公司接受第三方这种类型的合作伙伴关系时，很明显这是一种可以帮助改变\
  \ B2B 格局的解决方案，使生成式 AI 变得更易于访问。\n\n另一个在 B2B 市场推动成功的 AI 公司的绝佳例子是总部位于加州的游戏公司 GGBP。虽然他们不自己创建游戏，但他们使用\
  \ AI 来减少游戏文化中的毒性，并为游戏公司提供一个仪表板，让他们可以从 moderation 角度看到用户表现。随着游戏公司持续更认真地审视其游戏社区的安全和健康，他们将越来越依赖\
  \ GGBP 等公司来确保所有用户都感到安全。Moderation 一直是社交媒体公司和游戏公司共同讨论的话题，很高兴看到一家 AI 公司在这个领域取得成功。\n\
  \nGGBP 在 2023 年 7 月由 SK Telecom Ventures 和 Samsung Ventures 领投的最近一轮融资中获得了 1000 万美元的融资。他们的成功作为积极提醒，强调了在特定领域利用\
  \ AI 而非人类工人的重要性。雇佣人类审核员的最大问题首先是它对他们心理健康的情感 toll，因为他们一天到晚进行扫描。扫描有害或暴力语言不是胆小者的事，持续不断地发现图形或仇恨内容可以让最强壮的人也泄气。可以为\
  \ AI 在伦理上帮助我们解决我们作为人类宁愿不被指派的问题而提出强有力的论据。\n\n\n\n\n现在，让我们把目光转向另一款令人上瘾的应用。这一次，它鼓励的可能是一种更健康的瘾：对知识的渴求！总部位于宾夕法尼亚州的多邻国（Duolingo）利用深度学习，以一种更高效、更具针对性的方式帮助人们学习语言。这款游戏化、个性化的应用月活跃用户超过3亿，提供30多种语言。\n\
  \n多邻国的主要理念是它与你一同学习，并根据它判断你即将遗忘的单词为你提供重复练习。这种重复模仿了我们自然学习的方式，而应用中基于积分的游戏化行为则为你提供了情感上的鼓励，让你每天坚持15分钟。\n\
  \n另外，多邻国一开始并不是一家人工智能公司。它成立于2009年，一旦开始尝试个性化和A/B测试，便迅速意识到应该开始使用机器学习进行测试。在本书后面，我们将讨论如何为现有的非AI产品添加AI功能。多邻国为我们提供了一个成功做到这一点的公司案例。具体来说，多邻国使用RNN进行单词排序和翻译，使用LSTM识别文本中的长期依赖关系，使用CNN进行特征提取和提升文本理解，使用像BERT和GPT这样的Transformer模型来理解和生成自然语言并提供上下文反馈，以及使用强化学习来个性化学习体验，并根据用户的进度和行为调整内容。\n\
  \n最后，生成式人工智能热潮中最引人注目的成功案例之一是名为Midjourney的图像生成应用。在科技界罕见的是，该公司以40名员工和0融资实现了2亿美元的收入。自2021年公司成立以来，Midjourney的创始人戴维·霍尔兹（David\
  \ Holz）一直被投资者的融资提议所淹没。它通过Discord聊天应用运行，这使得易用性和可及性成为其成功的标志之一。它已成为希望测试生成式人工智能能力的创意爱好者和专业人士的首选工具。公司专注于可持续、有机的增长，这也是其受欢迎的重要原因，订阅价格在10美元到120美元之间。\n\
  \n我们想在本章中加入Midjourney的另一个原因是其令人鼓舞的劳工实践。通过采用民主、扁平的组织结构，并在其公认屈指可数的员工中推行利润分享模式，他们能够通过提供许多美国公司无法提供的东西——真正的同志情谊——来留住忠诚的员工。甚至他们对融资的漠不关心，也有助于为那些建立了公司的人提供有形和无形的回报。许多有前途的初创公司被风险投资家抢购，而这些风投往往有着与所投资初创公司相冲突的目标和优先事项，因此看到一家公司逆势而行并取得成功是件好事。初创公司的创始人常常觉得不融资就无法成功，可一旦获得融资，却眼看着公司的愿景和使命被妥协。在Midjourney，我们看到功能强大的生成式AI模型以极低的成本提供给人们，其明确目的就是把创意AI能力交付给艺术家。\n\
  \n我们决定将这一群体称为*艺术家*，因为艺术捕捉了时代精神和社会集体中涌动的各种能量。这与市场“看不见的手”的理念非常契合。产品-市场契合的概念也同样模糊。市场想要什么就要什么，我们都直接或间接地构成了市场，而创造真正艺术的公司会在市场所在之处与它会面。例如，人们对外语学习感兴趣并不奇怪。\n\
  \n世界日益全球化。全球就业市场支持着世界各地可以远程或本地工作的人们，因此，在过去10到15年里，人们似乎越来越想要移居或仅仅出于好奇而学习一门语言。\n\n\
  人们普遍想要自我表达，尤其是在共同经历新冠疫情的集体退缩时期，这支持了这样一个想法：一个全球性的社交媒体应用可以帮助你几乎毫不费力地创作内容。TikTok和多邻国以某种方式捕捉到了集体的需求，为数百万人带来了宽慰和轻松。对于Midjourney，我们还看到一款应用，它专注于消除“生成式AI将取代艺术家”的恐惧，坚定而经济地将AI能力交付给艺术家本身。但这并非没有争议。像Midjourney和OpenAI这样的公司正被艺术家集体起诉，指控其侵犯版权，因为这些模型在未经艺术家知情或同意的情况下，使用了真实艺术家的作品进行训练。\n\
  \nB2C应用的本质就是挖掘大众的集体需求。消费者与那些和其他企业打交道的人不同。这里不会有成群的潜在把关者妨碍你找到能买且愿买的客户。当你向消费者销售产品时，你只需要赢得一个人的心智。在某种程度上，你会忍不住想对所有人都面面俱到。但要迎合数百万种潜在观点是不可持续的。我们可以想象，也很难选择和优先排序功能。但捕捉到一种能激励并吸引数百万用户的情感需求，就会像钟声般回响，每个听到回声的人都会感受到它的光辉。多么有艺术感啊！\n\
  \n## 先行者——蓝海产品的范例\n\n当我们想到先行者时，我们会想到那些带着好奇心进入未知领域并因勇敢而获得回报的人。蓝海尤其难以驾驭，因为你是在为产品创造需求，本质上是在创造一个市场。要在这种市场的不确定性中生存下来所需的信念和远见，很少有人能长期坚持。布道、实验和使命建设使先行者脱颖而出。被开辟出的第一条道路本身就带着内在的价值。所有后续道路都要感谢你奠定基础。\n\
  \n对于先行者，我们想关注的是一些正在为其产品寻找新类别或新用例的公司。这些公司正在开辟新路径，为它们提供的东西创造需求，并且它们以多种方式为自己创造需求。这就是所谓的**蓝海**：一个仍在形成中的竞争格局，（目前）竞争还不多，而且必须为自己的需求大声疾呼。在红海中探索市场相对简单，因为已经开辟了如此多的路径，已经有了一个蓬勃发展的生态系统可供学习和航向。但先行者必须为获得这些知识付出努力。\n\
  \n## 反叛者——红海产品的范例\n\n先行企业所做的布道工作，有一部分也适用于竞争格局。当你处于蓝海时，竞争对手是你的朋友，因为他们证明了你的产品和解决方案存在的合理性。你的竞争对手越多，你作为一家企业的可信度就越高，你就越能帮助创建一个由少数关键参与者组成的支持性生态系统。在许多方面，先行者正在向各个方向拓展和开垦新天地。\n\
  \n红海是指那些已经变得不宜生存的市场，竞争格局完整、成熟且发达。在这种环境中，许多路径已经形成，你必须选择其中一条来立足和耕耘。你仍然可以选择创造新事物，也可以采用许多策略来击败竞争对手并实现专业化，但你的挑战在于要有足够的直觉看清下一步该怎么走。拥有如此多元且蓬勃发展的竞争对手生态系统的挑战之一是，很难知道自己真正想朝哪个方向前进，或者哪些竞争对手真正在抢走你的业务。\n\
  \nIntercom 是一家创立于爱尔兰、总部位于旧金山的公司，已成长为全球客户沟通与支持软件领域的重要参与者。在竞争高度激烈的红海环境中，他们面对的是一个拥挤的市场，其中不乏\
  \ Zendesk、Drift、HubSpot 等成熟平台。这些竞争对手提供类似的客户互动解决方案，如实时聊天、聊天机器人、AI 驱动的工作流、自动化消息、CRM\
  \ 集成以及客服工单追踪。功能趋同、价格敏感以及对现有需求的聚焦，意味着他们在自己所处的红海中差异化时，策略空间有限。\n\n为了脱颖而出，Intercom 强调了其\
  \ AI 能力，例如聊天机器人和预测工具，以简化客户互动并提供更直观的客户体验。由于他们强调以人为中心、对话式的客户服务方式，他们也成为了以客户为中心的选择。其他优势，如易用性、统一平台、强大的集成和\
  \ API 生态系统以及社区管理，也帮助巩固了他们的市场地位。他们在 AI 和自动化方面的大量投资，使他们能够自动化处理日常任务，如回答常见支持问题和筛选潜在客户，从而让客户和用户专注于解决更复杂的问题。\n\
  \n另一个红海竞争格局中的典型例子是 Lilt，一家同样位于加利福尼亚的机器翻译公司。本地化和翻译行业也经历过不少内耗；这是一个充满翻译服务和技术提供商的市场，而\
  \ Lilt 将两者结合起来。从 AI 的角度看，Lilt 的特别之处在于，据其首席执行官斯宾塞·格林（Spence Green）称，它是“世界上第一个也是唯一的交互式、自学习神经机器翻译系统”。其创始人在\
  \ Google Translate 工作期间看到了机器翻译的不足，于是创建了 Lilt 作为回应，他们的努力获得了回报。该公司最近的一轮 C 轮融资于 2022\
  \ 年 4 月筹集了超过 5500 万美元，截至撰写本文时，总融资额已超过 9000 万美元。\n\n\n\n\nAI 医学影像领域迅速发展，因为医疗保健和生物医学领域一直是\
  \ AI 应用的巨大兴趣（和资金）领域。其中脱颖而出的是一家公司 Gleamer AI。他们的产品 AI Copilot、BoneView、ChestView\
  \ 和 BoneMetrics 已能够对各种发现进行图像解读、检测和分析。来自法国，他们的市场渗透令人难以置信，已被超过 1,200 家医疗机构信赖，遍布 34\
  \ 多个国家，并在一年内协助完成了超过 1500 万例患者检查。\n\n当我们想到叛逆者时，我们想到的是勇气。在竞争激烈的市场中竞争需要很大的勇气。竞争对手众多，很容易分心并精疲力竭。每个竞争对手都代表着你产品可能成长的一个潜在方向。如果专注度足够高，其他机会可能难以捉摸，而试图成为所有人所需一切的公司都会因这种缺乏专注而受苦。产品经理和领导层需要共同努力，确保产品有清晰的愿景，并且公司能够作为一个团队围绕这一愿景团结起来。对我们来说，叛逆者是无所畏惧的，探索这种无畏可能有助于理解在红海中发现的成功公司。也许这种无畏来自于一家公司在市场上不断面对众多对手时所培养出的实践勇气。最终，你会停止为小事而焦虑，并获得激光般聚焦视野的礼物。\n\
  \n## The GOATs — examples of differentiated disruptive and dominant strategy products\n\
  \n现在，我们将把注意力转向主要市场策略，并查看每个策略的 *有史以来最伟大*，或 *GOAT*，示例。市场策略指导你的以产品为导向团队的努力。你将追求拥有太多选择还是不够选择的客户？你将创建一个比竞争对手更有效或更差的产品？在制定商业计划时，这些似乎是显而易见的问题，但一旦公司开始运营并开始获得一些客户，这些决定可能就不像公司成立之初那样具体了。\n\
  \n我们从初创企业世界中学到的最伟大教训之一是，习惯于提出那些似乎已深植于公司使命和理念、因此显得显而易见的问题。我们在之前的经历中曾不情愿地提出这些问题，但现在不会了。如果公司足够心动，它们可以改变策略，但每次改变都可能给公司带来潜在风险。市场策略影响从你如何构建产品到如何销售产品的方方面面。对市场策略这些方面的缺乏清晰认识可能导致构建出不合适的产品。对产品沟通和销售缺乏清晰认识可能导致获取不适合公司的客户。\n\
  \nWes Bush 在其著作 *Product Led Growth* 中的以下图表为我们展示了公司在增长中可以使用的四种策略的四个象限：\n\n此前，西班牙快时尚公司\
  \ Zara 在创建和交付系列方面的最快周转时间为 3 周。SHEIN 将其缩短至 3 天的新最佳水平——这确实是 AI 和机器学习的令人钦佩的应用。尽管可能有效，但这个例子也很复杂，因为它突出了\
  \ AI 有效性与世界整体之间的冲突。快时尚本身就加剧了环境影响以及对使用 AI 的伦理担忧。快速周转和低成本导致不可持续的做法、过度浪费和恶劣的劳动条件。但重要的是要记住，虽然\
  \ AI 可以提高运营效率，并且它确实为 SHEIN 带来了提升，但它并不能从根本上解决快时尚造成的根本问题。为了缓解这些担忧，公司必须将 AI 与道德和可持续的做法结合使用。\n\
  \n另一家主导高度竞争生态系统的公司是 Hugging Face，它不仅为小型公司提供机器学习代码库、模型、数据集和用于演示 AI 驱动产品的网络应用，而且通过开源社区来实现这一点。他们还最近与\
  \ AWS 合作，为其开源社区提供机器学习能力，而这些功能通常仅对能够负担得起的 AWS 客户可用。该公司可行性的证明在于融资；它在 2023 年 8 月的 D\
  \ 轮融资中筹集了超过 2.35 亿美元。\n\n主导策略是一种通过做得更好且成本更低来削弱市场竞争的策略。这很有效，因为它在两端都最大化了回报。它既能获得想要工作做得更好的客户，也能获得只想付更少钱的客户。这是你赢得的相当大一块蛋糕。做得好的话，采用这些策略的公司基本上可以印钱。但权力越大责任越大。始终应讨论伦理与财务成功之间的权衡，所有规模的公司都需要警惕自己对世界产生的影响。\n\
  \n## The disruptive strategy\n\n在颠覆性策略中，你仍然以更少的钱出售产品，但它也提供更少的东西。谁想要这个？那些服务过度、被选项轰炸，但实际上只需要相对简单工具的人，而与他们必须选择的竞争选项相比，这些工具更简单。我们找不到比\
  \ Canva 更好的例子了。你可以使用 Canva 编辑照片并创建从社交媒体帖子到简历的任何内容，其工具极其用户友好且简单。\n\n这家澳大利亚创意平台利用\
  \ AI 为客户提供更多他们正在寻找的模板和内容。他们通过使用 CNN 进行图像处理任务，如背景去除和对象识别，使用 BERT 和 GPT 等 Transformer\
  \ 模型自动生成设计建议和从图像中提取文本，使用 GAN 创建新的设计元素和增强图像质量，以及使用强化学习优化设计推荐和布局建议来实现这一点。虽然它提供的功能少于\
  \ Adobe 的 Photoshop 或 Microsoft Office 套件，但它确实提供了其用户特别需要的东西，而且使用免费或便宜。\n\n它迅速成长为独角兽，因为它\
  \ expertly 满足了客户的需求。Canva 通过进行广泛的市场研究来了解潜在用户的需求和痛点，并分析现有设计工具以识别市场差距和发现改进领域来实现这一点。它还根据设计复杂性、行业特定需求以及用户是否为专业或非专业用户对受众进行细分，使公司能够为不同用户群体量身定制产品。Canva\
  \ 成功的最大贡献者之一是 Freemium 模式，吸引了广泛的用户。那些有更具体需求的人可以通过付费功能来解决，但 Freemium 模式使 Canva 能够在用户设计旅程的不同阶段满足用户。\n\
  \n颠覆性策略最有趣之处在于能够通过向潜在客户展示不同角度来影响他们。颠覆改变了市场中现有权力结构的范式，一个新的品味制定者出现，激励其竞争对手和客户尝试有关他们如何请求和使用产品的新事物。这种范式转变为整个市场带来了新颖性和专业化的礼物。也许工作做得更差，但这对一群新的潜在客户是有益的。也许这个新群体是其他竞争对手从未想过要服务的。Canva\
  \ 也让我们一窥颠覆性策略可能面临的潜在危险。最近，这家独角兽公司在新闻中因将其面向企业的订阅服务年费提高 300% 或更多而被报道，导致用户威胁要放弃该软件转投竞争对手，并声称它不再是让他们最初购买的“简单且负担得起的替代品”。Canva\
  \ 的回应是，新价格反映了其新 AI 驱动产品体验的真实价值。在这种情况下，Canva 似乎正在放弃其颠覆性策略，转而采用更……差异化策略。这个例子也提醒我们，投资\
  \ AI 很可能产生成本，而你的公司随后必须将其转嫁给用户和客户。这一决定反过来可能会影响你的以市场为导向的策略。\n\n## The differentiated\
  \ strategy\n\n在差异化策略中，你可能会销售一种在某个细分市场中专业化的优质产品，但你也会为这种专业化收取更高的费用。我的差异化策略示例是一家与我关系密切的公司：一家我曾合作过的英国基于机器学习的房地产科技公司\
  \ Beekin。Beekin 并不是一家比竞争对手提供更便宜服务的房地产技术平台，但当时，它提供了一个其他房地产科技公司无法提供的下一代平台。我们构建了一个机器学习原生平台，从进行市场评估到预测未来行为，以为租户提供最佳价格。我们的客户在竞争工具方面没有太多选择，因为他们的替代方案是拥有陈旧规则引擎的房地产科技巨头，而房地产科技领域的竞争格局才刚刚被\
  \ AI 颠覆。\n\n\n\n\n*   TikTok 如何使用机器学习？：https://dev.to/mage_ai/how-does-tiktok-use-machine-learning-5b71\n\
  *   Canva：https://www.lifecatcanva.com/en\n*   Lilt 公司信息：https://www.crunchbase.com/organization/lilt\n\
  *   Hugging Face：https://huggingface.co/\n*   Mistral AI：https://mistral.ai/\n*\
  \   Gleamer AI：https://www.gleamer.ai/\n*   Midjourney：https://www.midjourney.com/home\n\
  *   Canva 称其 AI 功能值得 300% 的价格涨幅：https://www.theverge.com/2024/9/3/24234698/canva-price-increase-300-percent-ai-features\n\
  \n## 在 Discord 上加入我们\n\n与其他读者、AI 专家和作者本人一起阅读这本书。\n\n提出问题、为其他读者提供解答、通过 Ask Me Anything（AMA）活动与作者交流，以及更多互动。\n\
  \n扫描二维码或访问链接，加入社区。\n\nhttps://packt.link/aipm\n\n![](img/a0c9f9a2ba06a06d309ce21d890a47c6_125_0.png)\n\
  \n## 局限性及采用不均\n\nAI/ML 的使用仍存在一些局限，包括：数据不完整、不一致、不可靠且过时；模型透明度常常是一个监管问题；源于模型训练数据的偏见与公平性问题；伦理问题；以及模型对历史数据过度拟合，从而无法很好地泛化到当前数据。目前，建模的使用方式仍需要大量人工投入。\n\
  \n2023 年，美国证券交易委员会（SEC）提出了一系列 AI 规则，并对 AI 模型的开发和使用展开调查。尽管 SEC 自身也在使用 AI 分析复杂数据，评估市场风险和潜在欺诈，但他们仅将\
  \ AI 用于帮助经济与风险分析部（DERA）确定检查的优先级；如需了解更多详情，可参阅 https://perkinscoie.com/insights/blog/artificial-intelligence-sec-proposals-and-concerns。尽管存在这些趋势，且越来越多具有竞争力的大语言模型（LLM）涌入市场，我们仍看到\
  \ AI 在金融领域的采用陷入停滞，但有两个显著例外：\n\n- 资产管理\n- 共同基金\n\n这些领域之所以例外，是因为 AI 在金融科技中的采用并不均衡，而这两个领域受到了青睐。资产管理和共同基金采用量化策略，是高度数据驱动的领域，能够受益于\
  \ AI 处理和建模复杂金融数据的能力。金融的其他领域则可能面临监管、安全和数据隐私问题。根据《哈佛商业评论》最近的一篇文章，在该领域，由“技术和数据主导”带来的重大颠覆，最有利于“被动型”基金经理的崛起，而不是历史上“主动型”基金经理的趋势。这意味着，随着时间的推移，数据和\
  \ AI 的影响力让基金经理更信任指数的成长与繁荣，而不是那些凭借“信息优势”进行“选股”并收取高额费用的基金经理。也就是说，在宏观层面，规模化分析更多数据所带来的收益，正在超越传统上那种更深入、微观层面分析所带来的收益。\n\
  \n从金融交易到股票交易，再到通过个性化提升客户留存率，再到金融活动监管和风险管理，我们在这一部分已经看到了几个 AI 如何影响整个行业的例子。随着更易获得的生成式\
  \ AI 应用和试点项目的兴起，我们将看到 AI 在合规、客户体验、欺诈检测、风险评估和金融分析中发挥越来越重要的作用，这些都是与金融行业活动密切相关的内容。\n\
  \n## 产品视角\n\n最后，我们想从产品视角出发，以更具哲学意味的方式来探讨 AI 的采用对价值、财富和金钱这些概念本身意味着什么。如果你从事金融科技工作并支持金融产品，你可能不仅关心这将为客户带来的价值，还会关注产品商业化面临的风险。本节中的金融案例提醒我们，在构思用例和产品时，最重要的是把传递价值放在首位。\n\
  \n无论你从事 Web3 与区块链技术、传统银行业务，还是金融产品监管，你都在寻求以一种让你的产品帮助用户改善某种结果的方式，来利用 AI/ML。帮助的形式多种多样。当你正处于构思的苦战中，希望提供市场需要的东西时，请考虑那些能帮助人们更快、更轻松或以其他更高效方式得出结论的产品。也许是让你的客户获得更高利润，或是最大限度地降低他们的成本；也许是帮助你的客户预测未来的不确定性；也许是为他们提供一条扩大家族财富、实现财务独立的途径；也许你的产品正在利用\
  \ AI/ML，通过个性化来更好地了解你的客户。这同样具有巨大的价值。\n\n如果你正在思考如何最好地利用 AI/ML 来打造你的金融科技产品，请从如何为最终用户和你的企业带来最大收入和价值的角度来思考。以下是一些可以采用的方法：\n\
  \n-   你可以在多大程度上为客户提供个性化服务以建立忠诚度？无论是提供投资或投资组合建议的 AI 驱动顾问、定制化的银行产品与服务、个性化的贷款方案、储蓄计划，还是信用卡推荐，在原本信息密集且令人眼花缭乱的市场中，你很可能有某种方式向客户传递价值。\n\
  \n-   你如何创造更好的客户体验，从而让客户更加信任你？客户可以极大地受益于智能体和聊天机器人，它们能处理客户咨询、提供支持、自动化任务、增强客户服务、主动推荐解决方案、提供市场分析、发送定向营销活动、提供个性化奖励、忠诚度计划和预测性分析，或分析客户的行为和交易模式。\n\
  \n-   你可以在哪些方面为自己和其他企业提升运营效率？自动化后台运营、合规检查、文档处理、交易对账、数据管理、报告、风险评估、交易监控、欺诈预防和异常检测，都是可供\
  \ AI 集成的选项。\n\n现在，让我们来看另一个领域：医疗保健。\n\n## 疾病与健康——AI 与纳米技术在整个医疗保健领域带来的益处\n\nAI 在医疗和保健行业中的应用持续取得巨大成功，例如在革新诊断、个性化治疗方案和运营用例等方面。AI\
  \ 工具正被用于分析 X 光、MRI 和 CT 扫描等医学影像，其效率和准确性均超过人类水平。AI 在检测肿瘤、骨折和心脏疾病等方面的用例之所以成功，是因为它们能够及早发现异常，从而帮助许多国家本已人手不足、资源捉襟见肘的医疗系统。\n\
  \n我们还看到，AI 在个性化方面取得了长足进展。根据个体的遗传、环境和生活方式因素量身定制治疗方案已经取得成功，这得益于 AI 分析基因组序列等大型数据集的能力。专注于肿瘤学和癌症研究的\
  \ AI 应用，正通过为个体优化治疗路径，帮助减少癌症治疗选择中“一刀切”的做法。甚至药物发现与开发的路径也被缩短了，这得益于那些专注于分析生物数据、预测新化合物如何与人体相互作用的\
  \ AI 应用。\n\n\n\n\n- **残疾医疗保健：** 必要性是发明之母，而残疾也是 AI 已服务一段时间的大型医疗保健领域。 结合机器人技术、计算机视觉、语音辅助、音频辅助、语音转文本和智能家居技术，我们一直在并将继续在\
  \ AI 应用于能够帮助与视力、听力、嗅觉、味觉、触觉、行动能力、心理健康、理解、沟通和学习相关的残疾人士的情境中应用。\n\nParrots 公司创建了一款名为\
  \ Polly 的医疗辅助 AI，正在帮助患有神经系统疾病的人。Polly 帮助其客户通过 360 度视觉更好地物理地看到周围的世界，并在家中或户外导航，通过分析眼动追踪技术进行实时预测以预判需求，并帮助他们向周围的人传达需求、想法和愿望。\
  \ 本质上，它是一个特定用例的单一平台上的整套产品。Wheelmap 是一款众包导航应用，帮助你找到轮椅可达的路线，通过参与反馈循环的用户社区不断积累知识。Biped\
  \ 是一家生产智能背带的公司，已开发出一种像背包一样佩戴的产品，帮助盲人和视力受损者在导航世界时避免潜在的碰撞风险。\n- **心理健康和自杀预防：** 这些是我们看到\
  \ AI 应用投入巨大资金的领域。 我在 2020 年与数据科学项目的一位同事合作，创建了我梦想的产品。 它是一款专注于心理健康的对话式 AI，能够了解你、与你共同制定目标并记录你的情绪。\
  \ 我们有兴趣利用 AI 作为实时日记和自我反思仪表板，并可选择在你选择与治疗师合作时分享这些数据和仪表板。\n\n在构建想法和 MVP 的过程中，我们进行了研究，发现了其他以各自方式解决心理健康和自杀预防问题的公司。\
  \ 最初，我们希望面向所有消费者，但发现如果语言模型要有效，就必须根据更特定群体的需求进行相当大的定制。 例如 ResolveX 这类公司正在利用 AI 与自杀热线合作，消除人工和行政任务，以便工作人员能够专注于电话另一端的人。Woebot\
  \ 开发了一款使用认知行为疗法技术的聊天机器人，帮助与抑郁和焦虑作斗争的人。\n- **视力增强：** Google 的 DeepMind 因其利用 AI 对视网膜图像进行分析来帮助检测视网膜疾病和心血管风险因素的能力而声名鹊起。Be\
  \ My Eyes 公司与 OpenAI 合作，将其 GPT-4 模型整合到其 Virtual Volunteer 产品中，这是一款面向盲人或视力低下的 AI\
  \ 驱动视觉助手。 自 2015 年成立以来，Be My Eyes 已将其惊人的 630 万志愿者与用户联系起来，帮助他们完成日常任务，但现在他们已将基础模型或\
  \ LLM 整合到产品中，他们正朝着实现“全球改善‘可访问性、可用性和信息获取’”的目标迈进 (https://www.bemyeyes.com/blog/introducing-be-my-eyes-virtual-volunteer)。\n\
  - **无线植入物：** 2024 年 2 月，一枚 Neuralink 芯片成功植入 29 岁瘫痪男子 Nolan Arbaugh 的大脑中，使其成为首个植入人体受试者的无线\
  \ AI 产品。这一里程碑为那些因身体行动能力受限而遭受严重健康状况的人带来了可及性。 当被问及它是如何工作的时，他将其比作在《星球大战》电影中使用“原力”来操控光标\
  \ (https://www.wsj.com/tech/neuralink-shows-first-patient-using-its-brain-implant-device-67a8b03a)。\n\
  \n## 产品视角\n\n在医疗保健领域，我们看到从构思、MVP 到发布周期中同样具有使命驱动的元素，但所有人的福祉再次成为主要焦点，因为正如经常发生的那样，如果产品本身没有经过彻底测试，并且使用这些产品的下游影响没有得到研究，这些产品可能会对用户和客户产生重大影响。\
  \ 虽然始终重要的是要提出正确的想法并将你的想法的可行版本推向市场以供用户测试，但在医疗保健用例中，至关重要的是所有领域都得到充分考虑，因为你处理的是人们的健康和安全。\n\
  \n根据本节讨论的示例，在诊断、发现、研究和护理质量之间，AI 可以帮助我们改善在世界范围内提供健康和福祉的方式。 正如我们在 2020 年全球大流行中所见，并在随后几年中继续看到，服务于我们今天的医疗保健系统和应用在许多国家变得越来越低效和脆弱，无论其发展状况如何。\
  \ 如果你正在思考如何最好地利用 AI/ML 为你的医疗保健产品提供支持，请考虑如何增强性能、缩短患者的护理时间并改善患者结果。 在构思该领域的产品时，你可以采用以下一些方法：\n\
  \n- 你可以在 AI 用例中融入多大程度的个性化，以帮助改善患者结果和患者体验？ 个性化目前正被用于通过在个人和集体层面分析患者数据来优化个性化治疗。 你能帮助患者识别新的治疗方案或计划，特别是对于癌症或罕见疾病等复杂疾病吗？\
  \ 专注于你的 AI 应用如何帮助预测未来健康风险或帮助预防性护理的方式。\n\n- 你如何更好地改善像药物发现和研究这样的长期医疗保健流程？ 降低研发成本并缩短新药和疗法上市时间是让产品进入市场的好方法，这些产品对客户、用户和患者具有高投资回报率和采用成果。\n\
  \n- 是否有办法帮助整个医疗系统提高运营效率？ 在保险公司、提供者、诊所和医院系统之间，有足够的官僚主义繁文缛节，而通常是行政人员、医生和患者本人承担了满足其保险需求和成本的大部分工作。\
  \ 如果你的产品可以减轻这些主要参与者的负担，市场肯定会奖励你。\n\n有一整套音乐应用使用 AI 生成新音乐，例如 SOUNDRAW、OpenAI 的 Jukebox\
  \ 和 Boomy，或生成歌词，例如 Audoir。 或者，也许我们可以探索 AI 如何以多种方式改变我们优化电影档期、推广电影、预测电影成功、编辑电影甚至制作电影的方式。\
  \ AI 生成内容在 2023 年美国编剧工会 WAG 和 SAG-AFTRA 罢工期间的谈判中占据了很大一部分。 长达数月的时间里，无数人聚集在一起抗议那些试图削弱演员和编剧劳动和创造力的网络，而演员和编剧正是好莱坞大片得以实现的人。\
  \ 几乎没有哪个创意行业在未来不会受到 AI 的影响，而这一趋势随着生成式 AI 模型的兴起和普及而只会加剧。 LLM 和其他生成式 AI 模型的兴起不仅带来了丰富的可访问创造力，而且极大地加快了\
  \ AI 有效说服你的能力。 这些强大的模型为我们作为技术人员、AI 产品经理和客户提供的能力是与一台不像机器的机器互动的能力。 随着 AI 应用变得更加社交，这些新模型和能力的使用将在未来变得更加普遍。\
  \ 我们已经超越了生成式 AI 模型生成长篇文本的先前限制的阈值，这是一个巨大的进步。\n\n到目前为止，生成式模型已经存在足够长的时间，我们都见过 AI 生成的自拍、图像、视频和歌曲。\
  \ 对新奇的眼光来说，它们可能短暂地令人娱乐和着迷。 但看过几个之后，你就都看过了。毫无疑问，随着模型的改进，输出质量会提高。 但我坚持认为，看到艺术家像使用任何其他媒介一样使用\
  \ AI，不仅将艺术带入世界（并为该艺术获得适当的报酬），比起制作一部像布拉德·皮特那样疲惫、公式化的 AI 生成电影更有趣。\n\n我们在本节中提到的所有产品都始于一个创造产品的想法，该产品可以为消费者带来生活的丰富性，并且这些产品团队从这些开创性的想法中构建了\
  \ MVP。\n\n## 产品视角\n\nMVP 应该迅速发布到市场，以便你开始收集用户如何与之产生共鸣和工作的反馈，从而让你在生产过程中进一步迭代。 在我们刚刚讨论的许多示例中，公司构建了\
  \ MVP，然后对其进行了测试，他们发现目标市场有压倒性的意愿和好奇心，以至于现在每个上述领域都有许多竞争产品。 构建一个可以快速测试和改进的 MVP 不仅有助于你自己的业务，而且还创造了一个更大的市场，吸引更多竞争对手。\n\
  \n为了最好地利用 AI/ML 构建 MVP，你可以采用以下一些方法：\n\n- 从 AI 的狭窄用例开始，并将该用例与你的业务需求保持一致\n- 在可以的情况下利用来自开源库或\
  \ AI 平台（如 TensorFlow、Hugging Face 或 Google Cloud AI）的预建 AI 模型\n- 就 MVP 的数据需求达成一致，并在其上线后持续收集用户如何与之互动的数据，以微调产品体验并不断改进\n\
  \n\n\n\n\n- 上线 MVP 后，定期利用客户反馈来指导你的产品开发周期\n- 就 MVP 如何得出结论或判断的解释性达成基准，你将把这些解释传递给用户和客户\n\
  - 在可能的情况下利用自然语言来促进采用。如果人们可以选择使用自然语言并用自己的母语有效地与技术交流，他们会乐意采用。\n\n构建 MVP 是一种工具，可以让你及早获得信号，确认你拥有正确的想法、市场和目标客户群。这有助于你快速有效地平衡客户需求与自身的商业成功。我们也可以称之为产品市场契合。然而，当应用于政府部门时，这会如何改变？我们将在下一节中探讨这个问题。\n\
  \n## 政府与自主性——AI 将如何塑造我们的边界和自由\n\n使用 AI 并非全是乐趣。海量数据的可得性以及 AI 的同时出现，使我们面临威权主义风险和压迫抬头的危险，也带来了集体赋权以对抗全球民主威胁的能力。当前，我们看到权力与保护以非常不同的方式被行使，基于一套共享的社会价值观体系，存在一些鲜明的矛盾。政府将越来越需要专注于保护本国生态系统以及应对气候变化带来的后果，并且在此关注下，也需要一定程度的投资。私营部门只能做到有限的事，我们希望政府机构能够利用其影响力造福公民。让我们看看\
  \ AI 将如何在政府职能中被利用，以及这对我们所有人作为消费者和创造者意味着什么。\n\n以投票为例，至少在美国，投票在最近几届总统选举中占据了众多头条。微软等公司正在开发电子投票系统，如\
  \ ElectionGuard，作为其捍卫民主计划的一部分，以实现未来安全、可信且可验证的投票流程。\n\nAI 在政策制定本身也发挥着作用。AI 和大数据可以在立法过程中被利用的阶段有几个。我们看到\
  \ AI 在立法和政策层面可以发挥帮助作用的多种用例：\n\n- 模式检测和识别选民最希望解决的话题：\n  - 英国政府设有数据科学校园，利用 AI 分析社交媒体和其他来源以检测模式并识别公众最关心的关键问题。这使政府能够了解公众对各种话题的情绪并协助政策制定（https://datasciencecampus.ons.gov.uk/）。\n\
  \  - 新加坡政府启动了“智慧国”计划，利用 AI 分析来自各种来源的数据，包括直接来自公民的反馈，以检测新兴趋势和公众关切话题，从而针对相关公共参与策略（https://www.smartnation.gov.sg/）。\n\
  - **在颗粒度层面创建分析和预测：**\n  - 爱沙尼亚的 e-Residency 项目利用 AI 帮助非爱沙尼亚人在线启动和管理企业，以吸引更多境外电子居民和投资者（https://www.e-resident.gov.ee/）。\n\
  \  - 澳大利亚的“国家地图”分析地理和社会经济数据，以帮助实现更好的城市规划、资源分配和灾害管理，通过为举措和响应提供实时洞察（https://nationalmap.gov.au/）。\n\
  - **生成数据以支持研究结果：**\n  - 美国人口普查局利用 AI 处理和分析其开展的人口普查和调查产生的海量数据，以便提供准确的人口估计和人口统计数据，支持政策决策和资源分配（https://www.census.gov/data/data-tools.html）。\n\
  \  - 加拿大的“开放政府”数据计划帮助处理、生成并使来自各种公共来源的数据可用，以增强透明度并鼓励公众参与政府（https://open.canada.ca/en）。\n\
  - **实施和诊断反馈以了解某些政策的执行情况：**\n  - 荷兰“AI for Government”项目利用 AI 监控和评估政策的实施情况，并提供诊断反馈以评估其有效性，帮助改善举措和立法的效果（https://nlaic.com/en/about-nl-aic/）。\n\
  \  - 韩国“数字政府”项目利用 AI 跟踪和分析各种政策和项目的绩效，并帮助提高公众对政策成果的满意度（https://www.dgovkorea.go.kr/）。\n\
  - **评估某些政策的最终有效性：**\n  - 新西兰的“政策项目”利用 AI 通过提供模拟和预测建模来评估各种政策的影响，以帮助完善政策并增强经济成果（https://www.dpmc.govt.nz/our-programmes/policy-project）。\n\
  \n如果政府选择与私营部门合作或投资自身开发 AI 应用以应对政策制定，我们很可能会看到民主进程的扩展。\n\n在更广泛的社会层面，我们可以看到一些 AI 的新颖应用，这些应用很可能会持续到未来。缓解偏见是\
  \ AI 可以在政府层面帮助解决的问题，因为政策影响着不同的人口群体及其经历的交叉性。Algorithm Audit 等公司正是通过其偏见检测工具做到这一点。其产品首先分析用于训练和测试模型的数据。它还使用各种统计方法来评估和可视化不同类型的偏见，以检查某些群体是否被模型不公平地代表或对待。最后，它提供建议和补救措施以减轻偏见并随时间监控模型。\n\
  \n使用 AI 的伦理困境的一部分在于算法偏见问题，这一话题最近由麻省理工学院媒体实验室研究员 Joy Buolamwini 在 Netflix 纪录片 *Coded\
  \ Bias* 中广为人知。Joy 已将她的工作向前推进，通过建立自己的组织（并有效地建立了自己的运动）——算法正义联盟，来继续倡导算法偏见。我们也开始看到 Pipeline\
  \ Equity 等公司倡导薪酬透明度和跨人口群体的公平，以缩小薪酬差距并为组织提供坚实的商业证明，说明为何应投资薪酬公平。他们通过开发利用数据检测和分析招聘、**多元化、公平和包容性（DEI）**、晋升和薪酬公平中的偏见的\
  \ AI 工具来有效实现这一点。他们还通过开发指南、最佳实践、研究以及监管框架的标准，并建立培训资源来传播意识和教育人们了解 AI 中的风险和偏见，从所积累的数据中学习。\n\
  \n就政府机构而言，AI 无疑是房间里的大象。特别是自主武器和大规模监控的使用因可理解的原因而最具争议。人们希望感到安全，但他们也不希望隐私被滥用。我有幸在 2020\
  \ 年参加 Women in Trusted AI 的一次虚拟会议上，与美国陆军人工智能特遣部队首席 AI 伦理官、美国军事学院英语与哲学系教授兼副主任 Dave\
  \ Barnes 上校进行了交谈。那次对话的最大收获是承认每个国家仍在努力如何最负责任和有效地使用 AI 并理解潜在的危害和风险。很明显，政府之间还有很多工作要做，以设定限制并理解\
  \ AI 被利用的全部能力。我们看到更多关于如何限制 AI 在 *国防* 中负面外部性的讨论。关于自主武器，美国国防部的人工智能原则如下：负责任、公平、可追溯、可靠且可治理。这种情绪或许最好由联合人工智能中心主任、空军中将\
  \ Jack Shanahan 表达：“*战争的复杂性和速度将随着我们建设未来的人工智能就绪力量而改变。我们欠美国人民和我们军队的男女同胞以反映我们自由开放社会的国家价值观的人工智能伦理原则。*”\
  \ 如果社会被控制和压迫，就不会自由或开放。\n\n大规模监控亦然。AI 可被用来赋能政府压迫和控制其公民，也可被用来保护他们。大规模监控也在渗透到私营部门，许多私营公司选择使用面部识别，这几乎无法选择退出，即使是去电影院或酒吧这样简单的事。最近的\
  \ AI 全球监控（AIGS）指数显示，全球 AI 监控的使用正在增加。\n\n以下摘自 Steven Feldstein 的 *The Global Expansion\
  \ of AI Surveillance*（https://carnegieendowment.org/research/2019/09/the-global-expansion-of-ai-surveillance?lang=en）：\n\
  \n\n\n“指数显示，51% 的先进民主国家部署了 AI 监控系统。相比之下，37% 的封闭独裁国家、41% 的选举独裁/竞争性独裁国家，以及 41% 的选举民主/非自由民主国家部署了\
  \ AI 监控技术。自由民主政府正积极使用 AI 工具来巡逻边境、抓捕潜在罪犯、监控公民的不良行为，并从人群中揪出疑似恐怖分子。这并不一定意味着民主国家在非法使用这项技术。决定政府是否会将这项技术用于压制性目的的最重要因素是其治理质量——是否存在侵犯人权的历史模式？是否存在强大的法治传统和独立的问责机构？这应该能为居住在民主国家的公民提供一定的安心。”\n\
  \n随着生成式 AI 模型的兴起，政府将不得不投资于 *数据合成与评估* 的监管，以确保对来自 LLM 和其他形式的生成式 AI 的监控数据的责任。虽然这些模型在生成新数据方面尤其出色，但确保生成的数据正确、安全且合法又是另一回事。我们越来越多地看到\
  \ LLM 提供商因违反知识产权法而被起诉的问题，这是一种很可能持续下去的趋势，并将影响艺术家和创作者，他们的内容被用于训练 LLM，而这些内容也可能包含在与用户共享的输出中。像\
  \ CloudFactory 这样的公司正在推广“Human-in-the-loop AI solutions”，以对抗长期、可扩展 AI 系统缺乏问责的问题。\n\
  \n这对 AI PM 意味着什么？首先，如果你身处 *authoritarian tech* 领域，无论你的政治立场如何，生意都蒸蒸日上！更重要的是，这意味着我们作为\
  \ AI PM 有责任支持并创造我们相信的产品。我们参与构建这些产品的投入和参与会产生巨大的影响，具体取决于受众以及你是否将目标锁定在政府或军事抱负上。你应该批判性地思考你推向市场的产品，看看如何将公共利益与自身的成功结合起来。这些政府案例也经历了从构思\
  \ MVP 到发布并获取反馈的过程。唯一的区别是这些产品在影响公众的领域中实施，而我们认为在潜在影响如此巨大的情况下，负责任地使用和开发这些产品是最难做对的事情。\n\
  \n## Basic needs — AI for Good\n\n在我职业生涯起步于销售和客户管理时，我理所当然地认为它具有竞争力。但我第一次加入 AI/ML\
  \ 社区时，最让我震惊的是它有多么协作和仁慈。你可以参与的开源项目非常多。你可以将项目发布在 Kaggle 上并赢得比赛。你可以在 Stack Overflow\
  \ 上找到几乎无限的问题解决方案。我发现通过联系在 AI 领域分享观点的<|message|>\n\n\n\n\n- *Biofourmis*: https://biofourmis.com/\n\
