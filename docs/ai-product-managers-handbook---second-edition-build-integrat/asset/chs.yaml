  ## 加入我们的 Discord\n\n与其他用户、AI 专家和作者本人一起阅读这本书。\n\n提问、为其他读者提供解决方案、通过 Ask Me Anything\
  \ 环节与作者聊天，以及更多内容。\n\n扫描二维码或访问链接加入社区。\n\nhttps://packt.link/aipm\n\n![](img/a0c9f9a2ba06a06d309ce21d890a47c6_223_0.png)\n\
  \n\n\n\n\n# 9\n\n# AI 原生产品的产品设计\n\n到目前为止，在本书的第二部分中，我们已经涵盖了许多与构建和维护 AI 原生产品相关的领域。但我们还没有涉及产品设计，以及产品经理应该在多大程度上精通设计。在本章中，我们正是要解决这个问题：理解最能助力原生\
  \ AI 产品成功的那些设计要素。我们将深入探讨设计原则和优先级水平，这些对于构建任何产品都至关重要，并且我们将聚焦于当你从头开始原生构建 AI 产品时需要重点关注其中的哪些要素。\n\
  \n通常，当我们讨论 AI 的崛起时，我们会想象一个许多人类任务将被自动化的世界。这让很多人不禁思考，在近年来持续进行的技术进步中，我们人类的位置究竟在哪里。并非所有的产品设计师都知道如何成为产品经理，但所有产品经理如果想要有效地完成工作，就必须对设计有一定的理解。设计或许是产品管理学科中最令人兴奋和最迷人的部分，在这里，功能、创造力和用户体验汇聚在一起。解决复杂的、以人为本的问题并不是一件容易自动化的事情，而你对设计的理解将对你的产品产生巨大影响。\n\
  \n设计一个产品不仅仅是发挥创意。它还关乎你如何打造一种体验，这种体验不仅能让最终用户的生活更轻松或更愉快，还能以一种有意义的方式传达你的产品可以带给他人的价值。产品设计是心理学的、跨学科的、包罗万象的。它不仅仅是制造一个在实用性角度上运转良好的产品；它还关乎构建一些能与你的最终用户产生情感共鸣的东西，并让他们不断回来使用。在本章中，我们将：\n\
  \n- 回顾一般产品设计的基础\n- 审视当我们将 AI 加入其中时，这些基础如何受到挑战\n- 学习如何使用工具来帮助我们平衡设计优先级\n- 看看我们如何将这些优先级融入伴随我们产品的叙事之中\n\
  \n最后，我们将像本节其他章节一样，对我们的案例研究示例进行产品设计概述。\n\n## 常见产品设计术语回顾\n\n**客户旅程：** 客户与公司或产品之间从初始认知到产品上线的完整互动系列，映射关键的想法、情绪、痛点和接触点，直至购买。\n\
  \n**用户旅程：** 用户使用产品时所经历的完整互动系列，包括发现、参与和持续使用，在生命周期的每个阶段映射关键的想法、情绪、痛点和接触点。\n\n**用户界面（UI）：**\
  \ UI 涵盖数字产品的所有视觉元素和交互功能（屏幕、按钮、图标、菜单），侧重于美学、布局和视觉元素。\n\n**用户体验（UX）：** UX 涵盖整个用户体验，包括\
  \ UI、功能性、可访问性以及整体易用性、满意度和情绪反应。\n\n**UI 与 UX 设计：** UI 设计侧重于产品的视觉呈现和表层交互，而 UX 设计则涵盖整个用户体验，包括外观和感受、用户研究、内容结构和交互流程，以确保无缝且令人满意的体验。\n\
  \n**UX 研究与市场研究：** UX 研究以产品为中心，侧重于用户行为、需求和动机，以改进产品交互。市场研究的范围更广，侧重于市场格局、竞争对手、趋势、人口统计数据和偏好，为整体业务战略和产品定位提供依据。\n\
  \n**客户旅程与用户旅程：** 客户旅程涵盖更广泛的购前和购后体验，包括营销、客户服务和品牌认知，而用户旅程则侧重于导航和使用产品的特定功能性和任务导向的体验。\n\
  \n## 产品设计要素入门\n\n在第 6 章中，我们介绍了 AI 产品开发的各个阶段。你可能会在这里看到类似的概念，但重要的是要注意，开发产品和设计产品是两回事。当然，两者之间存在相互作用；两者都是将产品推向市场所必需的。产品开发是指构建产品的整个过程。产品设计则侧重于创造产品的用户体验和产品本身的形式。如果你回顾第\
  \ 6 章，你可以将产品设计视为产品开发过程的阶段 1（构思）和阶段 3（研究与开发）中将涵盖的领域之一。当你迭代你的想法并用研究和反馈来强化它们时，你实际上是在做着完善产品设计的工作。\n\
  \n以下是一个视觉指南，帮助你组织产品设计要素并供日后参考。请记住，这些阶段在构建过程中可能会发生变化，但它们通常遵循以下顺序。当你在处理将 AI 原生产品推向市场的任务时，你会在不同的时间重新访问各个阶段。\n\
  \n在此阶段你可以向潜在最终用户提出的一些问题是：\n\n- 在当前的工作流程或日常生活中，你面临的最大挑战是什么？\n- 你目前有哪些解决方案选项来应对这些挑战？\n\
  - 关于这些现有选项，你喜欢和不喜欢的地方分别是什么？\n- 是否存在一个“完美的解决方案”？如果有，对你来说它会是什么样？\n- 你通常如何发现并决定使用新产品？\n\
  - 你的核心用户需求是什么？\n\n## 定义问题\n\n一旦你收集了足够多的关于客户和最终用户的信息，你就会开始对这些发现进行分组，并确定你试图解决的实际问题。在许多情况下，前两个步骤会被颠倒，即最终用户的视角是在问题被考虑之后才被引入的。技术人员、产品经理和善意的企业家可能会在这件事上过早行动。他们可能已经是他们想要将新产品推向的领域的资深人士。他们可能已经觉得自己理解了问题，然后用采访的最终用户提供的证据来验证那个问题——如果他们确实这样做了的话。在某些情况下，他们可能会对所解决的问题做出假设，并只挑选那些支持其潜在假设的用户访谈。\n\
  \n这样做也许能暂时满足你的自尊心，但当你后来发现这个问题实际上比你最初想象的更复杂或多面时，它会在下游给你带来更多的工作。产品设计的工作平衡了艺术和科学。当然，你需要创造性地思考产品应该如何组合才能满足客户的需求，但你也必须收集证据，看看这些证据与你当前对问题的理解相比如何。请放心让自己被用户研究的结果所引导。留出足够的空间，让你对发现的成果感到惊喜。你不需要知道一切。但你确实需要确保尊重产品设计的准则，并始终以最终用户为中心进行构建。\n\
  \n以下是你应该能够回答的一些关键问题：\n\n- 你能用三句话定义这个具体问题吗？你能用一句话定义它吗？\n- 你如何知道这个问题是重要的并且值得解决？\n\
  - 最终用户分析是否支持这个问题的重要性？\n- 这个问题的不同方面是什么？不同的最终用户群体如何体验这些方面？\n- 关于这个问题做了哪些假设，这些假设是如何被验证或被推翻的？\n\
  \n\n\n\n## 实验阶段\n\n现在到了有趣的环节。对产品中要包含哪些想法和概念进行实验，能让你利用目前收集到的数据去了解最终用户、验证问题，并将其转化为可以处理和塑造的形式。你不会想仓促完成这一步。在这一步，你可以开展一系列头脑风暴会议和工作坊，为最终的原型提供依据。让你的创造力在此自由驰骋，同时确保与你一起构建产品的团队能够自在地提出一些并不太好的想法。事实上，在一开始，甚至不要担心这些想法是好是坏。让团队的创造力自由发挥。这里唯一的限制是，要确保所有想法都真正针对第一部分中确定的客户需求。有关团队角色和职责的更多信息，可随时参考第\
  \ 6 章。\n\n当你已经找到几个有足够信心进入原型制作阶段的选项后，就可以把那些效果不太好的想法丢弃。这一阶段旨在挖掘思维的各个角落，找出产品利益相关者和设计师在构建产品时认为需要考虑的所有想法和概念。让它们的结构保持松散，因为这是产品设计中最自由流动的阶段。你希望所有参与者都处于心流状态，这意味着你希望他们从视觉和体验的角度进行思考。在这里，思考形式可以是白板练习、粗略模型、草图和情绪板。你要先把团队中涌现的所有想法都表达出来，然后再把所有人聚在一起，更具批判性地审视这些想法，并至少就\
  \ 2-3 个原型达成一致。\n\n一旦你有了几个最具吸引力的产品想法，就可以把它们转化为将要验证和测试的原型。原型制作会把头脑风暴中的元素串联起来，形成几种你愿意带给潜在客户的产品体验。这让你能够将产品可视化：从无形的想法世界跃入有形的形态世界。这些原型要有多正式，取决于你自己的偏好，但请确保它们以草图或线框图的形式呈现产品的视觉表达。在这个阶段，你实际上还没有构建或开发任何东西。你仍处于为已定义问题构思潜在解决方案的早期阶段，只不过这些解决方案已经可以分享，并且你可以开始从潜在最终用户那里获得反馈。\n\
  \n在这一阶段，你应该能够回答以下问题：\n\n- 头脑风暴会议中涌现出的所有潜在想法和概念是什么？\n- 你最终确定的 2-3 个原型与第一阶段确定的客户需求之间有何关联？\n\
  - 所探索的想法是否足够广泛？是否考虑了大量非常规或“跳出框架”的想法和潜在解决方案？\n- 是否有一些想法偏离核心用户需求太远？\n- 所有参与头脑风暴过程的团队成员是否都能自在地充分表达自己的想法？\n\
  - 在头脑风暴会议期间，所有想法是否都被记录和归档？\n- 你确定下来的原型是否足够详细以传达主要功能，同时又足够灵活以便迭代？\n- 这些想法和原型是否符合公司的整体产品愿景和战略目标？\n\
  \n## 验证阶段\n\n既然你有了可以展示给人们看的东西，就可以开始收集反馈，这些反馈将直接影响产品的方向和呈现方式。在这个阶段，你要把原型展示给真实的用户，他们可能有一天会购买你的产品，或者代表将购买产品的用户群体。在这里，你要检查反馈是否与第一阶段收集的初步反馈一致。同时，你还要确认原型是否被准确理解，用户即使面对的是原型，也能理解其可用性，并觉得它能解决自己的痛点。这一阶段还应为你提供一些新想法，帮助你把产品做得更好。\n\
  \n在这个阶段，你不仅要确认原型是否合乎要求，还要看它是否捕捉到了第一轮用户反馈中你可能没有想到或没有意识到的额外复杂性。在这么早的阶段，还有很大的改进空间，你会对需要进行多少轮测试和验证产生直觉判断。随着你不断完善和优化产品，你的测试和验证需求也会随之成熟。在某些情况下，你要测试的不仅是想法和原型，最终还包括可靠性、性能和合规性。请记住，这些阶段是设计原则，并不完全是一套按顺序执行的步骤。随着每一个新迭代从这些阶段中产生，你都会再次回来进行测试和验证。\n\
  \n这一阶段可以提出的关键问题有：\n\n- 这一阶段用户的反馈是否与第一阶段初步用户研究的结果一致？两者之间是否存在显著差异？\n- 用户是否按照预期理解了原型的用途和功能？\n\
  - 用户在原型中完成核心任务时，在导航或操作上是否存在困难？\n- 用户是否觉得原型能够高效且有效地解决他们的痛点？\n- 用户认为哪些功能最有意义、最有用或最具吸引力？哪些功能最令人困惑、最不必要或适得其反？\n\
  - 在验证阶段，这第二轮用户反馈中是否出现了新的想法、需求或建议？是否存在任何边缘情况、使用场景或意料之外的复杂性？\n\n## 迭代阶段\n\n从测试和验证阶段中产生的每一次产品迭代，都代表着产品在成熟度和成长性上的一个水平。迭代阶段的核心目标是确保产品沿着正确的方向发展，仍然能引起潜在最终用户和客户的共鸣，并吸收他们提出的反馈。真正会使用你产品的人参与得越多，你就越能设计出为他们量身打造、把他们关切放在首位的产品。每一次迭代都会让你更接近这样一种用户体验：与大多数客户和最终用户对产品的期望高度契合。\n\
  \n你需要让产品的美学风格与整体品牌形象保持一致，以确保公司价值观能够像产品功能一样得到有效传达。这一阶段旨在确保多个层面的一致性和连贯性，因为一旦产品进入市场，感知就是一切。在美学与产品功能之间取得平衡，是一种向最终用户、潜在客户乃至整个市场传达信息的方式：你确实花了精力，打造了一款在功能、手感和观感上都经过精心设计的产品。有些人可能觉得美学次于功能，但即便如此，人们在真正使用产品之前，首先看到的是它的外观。\n\
  \n这一阶段可以提出的问题有：\n\n- 产品的视觉设计是否与整体品牌形象和价值观一致？是否整合了可识别的统一配色方案、字体和视觉元素？\n- 视觉元素是增强了用户体验，还是干扰了用户体验？\n\
  - 美学与功能之间是否平衡？产品外观是否具有吸引力，并且这种吸引力是否使其更易于使用？\n- 所使用的设计元素是否具有包容性，并对所有用户都可访问（无障碍）？\n\
  - 你是否发现了视觉上不一致的地方，或需要优化以形成更统一外观的领域？\n- 视觉设计元素在多大程度上传达了产品的价值主张和独特卖点？\n- 产品发布需要哪些最终的视觉元素或营销材料（产品视频、落地页和图片）？\n\
  \n## 文档阶段\n\n在发布之前，你要重点构建足够的内容，尽最大努力确保你的客户能够为成功做好准备。当然，建立这种支持的工作是持续不断的，但你需要准备足够的内容，以便安心地发布产品，并尽可能确保发布后公司不会被大量问题和疑虑淹没。记录产品当然很重要，但同样关键的是，要为那些在产品发布后购买产品的客户准备好资源。在这一阶段，需要处理所有与技术支持文档、产品文档、市场营销、分销以及客户成功知识库相关的内容。请记住，这只是产品设计的一个阶段。它旨在伴随你的产品，并且其品牌、外观和感受应与产品体验保持一致。\n\
  \n这些内容也会随着时间推移而演变。随着你不断收集越来越多的客户反馈，尤其是发布后的反馈，你需要确保配套文档和营销材料与你不断演进的产品保持一致。不要将文档视为独立于产品之外的东西，因为它并不是。文档是产品的喉舌，最终用户和客户将依赖它来了解你产品的功能和价值。如果你的文档和营销材料未能充分做到这一点，你就没有清晰地与潜在客户群对话。文档还会移交给正在构建产品的开发团队，因此请确保在这一阶段同时拥有面向客户和面向内部的文档。\n\
  \n\n\n\n\n以下是此阶段需要考虑的一些关键问题：\n\n- 面向客户的文档中需要涵盖哪些核心特性和功能？你愿意在文档中透露多少细节？\n- 你是否创建了清晰的指南，详细说明原型设计元素和开发原理，以便开发人员在开始开发时可以回溯参考？是否有内部知识库供开发团队了解产品架构和验证流程？\n\
  - 你是否有一个系统，可以在每次迭代后捕获并共享原型升级/变更（以及随后的产品文档）？\n- 是否有详细的用户故事、工作流和用例记录在案，以帮助相关团队理解原型的功能和用户体验？\n\
  - 文档问题、缺口或痛点将如何处理？如何利用反馈机制来确保有途径接收内外部对文档的反馈？\n\n## 是什么让AI原生产品设计过程与众不同？\n\n鉴于AI对我们工作流程和产品的巨大影响，我们看到它正在对设计过程本身产生变革性的影响。在这里，我们不仅看到AI对产品设计行为的影响，还看到它对直观地设计AI产品以及采用以人为本的方法的影响。整合AI最有趣的地方或许并不在于技术本身，而在于它让过程中需要人工干预的部分变得更加重要。考虑到用户需求、兴趣和挑战在产品设计中的核心作用，当AI参与设计过程时，这一点会更加凸显。\n\
  \n在本节中，我们将介绍AI产品为产品设计过程带来的一些独特考量，以及在设计AI原生产品时如何应对这些考量。\n\n### 用户至上\n\n无论是利用AI更好地理解和预测用户行为、根据过去与产品的交互建立用户画像和模式，还是发现新的用户偏好和优先级，AI产品相比传统软件产品能取得相当大的进步，因为借助AI可以收集到更深层次的知识。在传统软件产品中，我们仍然能够收集大量关于使用情况和客户需求的数据。这是产品设计的本质，正如我们在本章第一节中所讨论的。但通过AI产品，我们能够将产品设计原则与AI算法对齐，并从收集的数据中获得更多洞察。\n\
  \n由于理解用户需求如此重要，它成了AI产品的首要要求。有了更多关于用户的信息，你就能设计出极具吸引力且“粘性”十足的产品体验，这意味着它对最终用户具有持久吸引力。积累如此多的产品信息不仅仅影响整体美学、用户体验和形态，还为你创造了为不同用户群体甚至单个用户创造不同产品体验的机会。你在产品设计中的最终目标不仅是创造一款运行良好且外观精美的产品；你还试图创造一种直观且与最终用户产生情感联系的产品体验。\n\
  \n在传统软件产品中，你可能有一个阈值，达到这个阈值后你就会停止构建，因为你和你的市场推广团队可能觉得产品终于达到了适合大众消费的水平。当然，你可能会根据持续的反馈逐步增加更多功能并调整产品设计。但总体而言，你的产品体验本身是统一的。AI产品则不同，量身定制的体验才是常态。在第7章中，我们讨论了“产品化”机器学习服务的概念。AI产品设计中的用户至上理念强化了这一概念，因为如果你有无限的时间和资源，并且你真的愿意，你可以为每个用户设计不同的产品。AI不仅开启了个性化的概念，还拓展了产品的用例。\n\
  \n这不仅是了解你的用户，还关乎与用户互动。AI产品，尤其是当今的AI产品，往往整合了生成式能力来捕捉用户需求的细微差别。这意味着，你不再只是提供统一的、预先定义的用户体验，偶尔向一些客户发送产品调查问卷，而是实际上融入了更多与最终用户互动的机会。也许你的产品有聊天机器人、语音或视频组件，我们相信随着时间的推移，越来越多的产品会具备这些功能。你将能够获得更多反馈，理解用户的情绪，并以比传统软件产品更随意的方式与用户互动。\n\
  \n最后，你能够收集的所有数据不仅带来更好的产品体验和更高的用户参与度，还使预测未来用户需求和交互变得更加容易。这使设计过程本身更加流畅。不仅仅是机器学习算法在不断学习，你作为产品经理也在学习。理解行为和偏好的历史趋势，为产品经理和设计师提供了一种方法，让他们将产品更进一步地嵌入最终用户的心智中，从而明确地表明他们了解最终用户关心什么以及他们希望从产品中获得什么。\n\
  \n### 机器学习\n\n当然，这一点看起来相当明显。我们在本书的各章节中已经讨论了AI产品持续产品管理的要求，但在此节中仍值得重申。与传统软件产品不同，AI/ML产品不是那种“一劳永逸”的产品。你不是制定一列规则然后每季度更新和检查一次，也不是（很可能）用静态数据样本来驱动产品。你是在创建一个AI系统，它将支撑整个产品的持续维护和演进。\n\
  \n这包括驱动基础产品的数据和ML模型、处理传入活动的数据和ML模型，以及处理与产品相关的传出活动的数据和ML模型。这需要处理大量的数据和建模，这意味着你的产品会随着时间推移而演变。数据漂移、模型漂移以及不断变化的客户需求和偏好，都是需要调整支持AI产品的AI/ML算法的因素，尤其是在你扩展规模时。请记住前几章的要点：你的数据策略和管理将是AI产品管理工作的重要组成部分，因为AI系统需要大量数据才能实现最优运行。当你的产品上线并投入生产后，你的数据需求会增加，而不是减少。\n\
  \n你的产品设计团队需要应对这种变化，无论它是什么。当然，事先很难预知这种变化会是什么样子。但变化终究会存在。训练、调整、超参数调优和重新训练你的AI/ML算法，将成为产品持续维护和完善的一部分，以确保你的模型保持最新和准确，以最佳状态运行，并与不断变化的客户需求保持一致。将时间和资源分配构建到你的产品设计流程中，将是你AI产品策略的关键部分。\n\
  \n通常，AI产品还会附带提供趋势、洞察和建议仪表板的功能。将所有这些数据和模型活动转化为一个框架，以信息丰富的行动步骤的形式向客户提供这些输出，是一个不断变化的目标，但必须有办法考虑数据和模型活动中的所有调整，然后以推荐下一步行动的形式将这些调整打包给最终用户。在传统软件产品中，你的需求可能更有限，并且由外部设定。你可能会进行一些市场调研，与潜在用户交谈，得出一套产品规格，并且这些规格可能会根据持续的努力而经常变化。但对于AI产品，这项工作是持续不断的。如果你没有计划来应对这种复杂性，你的产品和客户成功团队将会不堪重负。\n\
  \n### 可解释性\n\n消费者正在发生变化，尤其是在AI以及生成式AI在让普通大众能够使用AI能力方面所发挥的作用方面。ChatGPT发布带来的显著转变，不仅影响消费者如何购买和使用产品，还影响他们如何宣传和推广这些产品。无论你是面向B2B还是B2C的产品经理，你都需要向某人进行解释，而你解释的方式将融入你的品牌战略，不管你喜不喜欢。这是因为AI伦理正逐渐融入公司的品牌形象。你打算设计哪一种产品？是由一家致力于数据隐私和AI可持续发展的公司创建的产品……还是不是？\n\
  \n消费者可能还没有足够熟悉AI，无法理解驱动他们熟知并喜爱的AI产品的各种模型。但这一天即将到来，像本书这样的书籍有助于普及这类AI知识。传统软件产品不需要像AI产品那样担心这种透明度，因为它们受到的审查更严格。或许随着产品中AI集成的兴起，围绕数据隐私的讨论加速了，因为AI系统需要大量数据，而这些数据可能造成很大的损害。随着数据泄露和网络安全攻击变得越来越普遍，建立用户信任也至关重要。许多AI系统将极易受到这类攻击。\n\
  \n\n\n\n\n即使消费者对AI没有更深的理解，他们也清楚算法会以不同的权重来考量数据点，因此，向他们分享哪些模型更看重哪些因素，对他们来说将是很有价值的信息。B2C消费者可能会出于个人使用、安全和责任方面的考虑而关注这些内容。B2B客户则希望在公司投资你的产品之前，先了解你的产品是如何运作的。如果他们不尽职调查、没有恰当地审查你的产品，还可能面临罚款或诉讼。\n\
  \n你不必透露大量信息，就能让终端用户一窥你产品的内部运作方式。尤其是在由神经网络驱动的生成式AI模型中，即便产品构建者也未必能轻易看清决策逻辑，因此必须有某种方式来揭示AI产品是如何做出特定决策的。自动决策和判定即使在最理想的情况下也可能令人不安且不够准确——即便你拥有大量干净、有代表性的数据，并且以诚信的态度构建产品。\n\
  \n许多消费者已经见识过并非如此时会发生什么。某些AI产品如果未经去偏见化处理，可能会将用户挡在潜在的工作机会或抵押贷款利率之外。作为一名产品经理，这场文化转变中与AI产品相关的最令人鼓舞的部分正是偏见问题。消费者不想信任带有偏见的AI产品，他们会奖励那些承诺尽可能透明地证明自己正以合乎伦理的方式构建产品的品牌。不久之后，我们将看到更多要求此类审计的法规出台，而且这不再仅仅是消费者驱动。建立能够证明你的产品公平、无偏见、可问责的思想领导力、沟通和文档，应该成为你AI产品设计的重要一环。你将因此获得客户、同行、终端用户以及批评者的认可。\n\
  \n设计过程需要考虑AI为产品带来的所有挑战和机遇。你不仅仅是在设计一款供用户使用的产品；你是在设计一个由多种跨职能团队、利益相关者、客户和观察者共同体验的“宇宙”。你的产品需要通过营销、客户/用户互动，以及坦率地说，通过成功来向世界传达它理解自身存在的意义。它还需要传达出你正在以负责任且合乎伦理的方式使用AI/ML。\n\
  \n在本书的许多章节中，我们反复回到的一个核心观点是：AI为本来就已经复杂的“待完成任务”生态系统增加了更多复杂性。产品管理本身就是一个多学科、复杂的角色。你已经需要身兼数职。你既要宏观审视，从高层评估产品表现；又要微观入手，思考下一个冲刺中需要纳入哪些故事点。你要与设计、开发和市场推广团队协作。对一个角色来说，这涉及太多的变量。这需要由一位直觉敏锐、深谙公司正在构建的产品的人来持续协调平衡。AI产品也是如此，但正如我们刚才所看到的，与传统软件产品相比，你需要在更多因素之间取得平衡。\n\
  \n## 明智地选择优先级\n\n我们以通用产品设计原则的概述以及影响AI原生产品设计过程的一些关键因素开启了本章。现在，让我们转向设定优先级这一核心任务，它正是AI产品经理角色的关键所在。产品管理的工作最终往往会转向对优先级的讨论。我们先做什么，为什么？这种优先级排序不仅受到你的产品策略影响，还受到领导层价值观和公司使命的影响。产品职能并非孤立存在；它是公司领导层和整个组织总体价值观的延伸。优先级排序受到组织价值观、更广泛的使命以及相互竞争的需求之间的相互作用的影响。\n\
  \n在为你的AI原生产品设定优先级时，重要的是你要保持产品清晰度，精明地平衡复杂性，并将其与你的产品、公司的更大使命和品牌保持一致。我们将在接下来的章节中讨论这些主题，但首先，让我们探讨一些优先级排序的基础性考量：\n\
  \n- **使命驱动的优先级：**确保你在自己认同的团队和组织中工作并构建产品。在个人层面，我们每个人加入某些使命都有自己的优先考量。在本书的范围内，我们谈论了很多关于产品角色以及事情应有的方式，我们也完全清楚，我们并不总是有幸按顺序、以充足的资源去做事。资源限制和时间紧迫等约束是存在的。我们可能并不总能拥有完美的领导、团队或预算，但在做出承诺之前，我们始终可以决定参与某个产品或与某个组织合作是否符合自己的价值观。\n\
  - **对领导和团队的信任：**你需要信任你的领导才能管理好他们的产品。如果你是CEO或技术专家，你需要信任为你产品工作的人才能有效工作。因此，在我们深入优先级以及如何平衡它们之前，请确保与你共事的人在你看来具备恰当的价值观和诚信的平衡，这样你才能发挥出最佳水平。无论角色如何，或者你是否在产品团队工作，这都值得作为首要的优先级。\n\
  - **沟通：**既然你与一个职能团队合作且价值观一致，你将通过围绕产品设计优先级所做的决策产生相当大的影响力。有多个考量因素，例如支撑你AI产品的AI架构、审美外观和感受、客户旅程以及产品中将包含的功能。以有目的的方式对这些方面进行优先级排序，将是指引你保持方向的明灯，即使你偶尔偏离轨道也能回归正轨。在你的产品策略会议中传达你的优先级列表，对于确保你获得领导团队的认同和一致至关重要。\n\
  \n现在，让我们看看关于清晰度、复杂性和品牌的一些考量，这些将进一步影响你如何对产品设计元素进行优先级排序。\n\n如果你无法在产品设计生命周期的各个阶段保持清晰和客观，很多事情都可能出错。这就解释了为什么用户研究和用户体验是如此重要的学科。它们为一个可能在自身主观性中迷失的过程带来了客观性。当你为项目投入大量时间、精力、金钱和资源时，现实检验非常有帮助。错误的假设代价高昂，可能让你带着一个没人需要、没人喜欢的产品进入市场。或者，你可能推出一款功能过多、让终端用户不知所措、搞不清产品实际用途的产品。\n\
  \n花时间投入到研究和探究中。了解你的用户在痛点和使用偏好方面的情感状态。为什么他们喜欢想要的东西？为什么他们不喜欢不想要的东西？然后，在此基础上，你如何设计出满足这些需求和偏好的体验？从一个简单、优雅的设计开始，总好过一开始就加入一堆没人知道怎么用的功能。少即是多。\n\
  \n弄清楚你的产品真正需要成为什么，将有助于维护终端用户所处的情境和体验。在研究上投入时间也会让你的领导对他们即将投入大量资源来投资AI产品的决定感到更有信心。当然，你也可以边做边验证。最佳实践是将产品设计师、UX设计师和UX研究员作为全职成员纳入你的产品团队。捕捉AI产品不断变化的需求需要做大量工作。但请确保你把时间花在从一开始就获得清晰度上，而不是只在推出MVP之后才这么做。从一个有缺陷的产品设计开始，会让你陷入追赶的境地，最终在后期证明代价更高。\n\
  \n## 增加复杂性\n\n最终，你会为你的产品MVP构建并添加更多功能，这又会引发另一轮优先级排序练习：*哪些功能先上？* 如果你管理的是B2B AI产品，你可能会倾向于选择最能满足你的明星客户的功能。如果你管理的是B2C产品，你可能会选择用户反馈访谈中请求最多的功能。这两种选择可能都是有缺陷的，因为它们只代表了极少数、善于表达且拥有特权视角的人的想法和意见。你在特定时期做出的选择将对尚未获得的客户——即未来将获得的客户——产生下游影响。\n\
  \n在哪里增加复杂性以及如何增加，这一决定不应草率做出。当你开始验证阶段时，每接触一个新用户或新类型的用户并征求反馈，你都会面临更多的复杂性。然后，每次你回头迭代并验证下一次迭代时，你会看到你的考量因素、功能和特性列表开始增长。你会在验证和迭代之间来回多次，最终才能做出最终原型。但你不可能考虑所有人的愿望和偏好。现实是，你只有有限的资源来打造一个“出色”的原型，因此复杂性必须受到限制。\n\
  \n无论你在什么类型的产品和市场工作，一旦你有了那个“出色”的原型，它的用户就必须学习如何使用它。总会存在某种学习曲线，你为产品每增加一定程度的复杂性，都需要配以相应的上手教学。认知负担过重、难以理解和处理的产品将面临最大的用户阻力。但你可以探索策略来抵消这种阻力。\n\
  \n\n\n\n\n让我们来看一下 AI 产品经理必须牢记的一些重要方面：\n\n- **认知负担：** 请记住，你的最终成果是原型，你的开发团队将据此构建成供终端用户使用的完整产品。即使你的原型在理论上能够捕捉到所有用户需求和偏好，最终结果可能比普通用户需求更笨重。这意味着他们可能不得不筛选太多对他们没有帮助或不适用的功能或功能，这可能导致他们感到沮丧并完全停止使用。你的产品越难理解和使用，它就会给终端用户带来越多的挫败感。\n\
  - **用户采用：** 许多公司除了客户成功团队外，还依赖社区经理或开发者倡导者来帮助在产品复杂的情况下妥善支持其用户社区。经常，这可以成为全球用户社区建立联系的来源，在其产品品牌形象周围形成一种亚文化。复杂性问题不一定必须是一个挑战。更多的复杂性可能意味着更多的功能和更多的细微差别；复杂产品不一定需要表示困难的产品。即使你的产品具有挑战性，并且在你的产品上进行入职和培训的道路很长，你仍然可以保持一个庞大、繁忙、忠诚的客户群。好事可能不会轻易到来，而掌握产品的难度可能正是促进长期采用和成功的因素。\n\
  - **成本：** 你还必须平衡组织对额外复杂性的胃口，特别是当它与更多 AI 功能有关时。存储、使用和训练更多数据或向你的产品设计中引入额外模型的决定也必须协作处理，因为\
  \ AI 基础设施的复杂性增加可能代价高昂，特别是如果存在可能影响你的产品设计可扩展性的问题。像这样的决定需要是战略性的，而且额外的复杂性需要比仅仅为了竞争优势而向你的产品添加更多锦上添花的东西带来更大的价值增添。\n\
  - **风险影响：** 额外的复杂性也意味着你的 AI 产品出错的机会更多。我们在本章前面讨论了 AI 的伦理考虑，这一点也很重要，再次在此提及，特别是当这种增加的复杂性是另一个\
  \ AI 功能时。\n\n增加复杂性的优先级是必须与客户、成本和风险影响相平衡的。你可能会发现自己不得不回答诸如以下问题：\n\n- 增加的复杂性是否会阻碍支持你的产品设计的\
  \ AI 系统中的偏见工作？\n- 它是否会引入新的风险，从而限制或限制受保护人群/用户群体的决定？\n- 在你推出该功能并看到其对真实客户群的影响之前，是否有办法对此进行测试？\n\
  - 这种增加的复杂性的影响在你的整个客户群中是否公平？\n- 增加的复杂性是否会引入数据隐私问题？\n\n所有这些考虑都有其作用，而在你向产品中引入更多复杂性时优先考虑伦理和风险，将有助于你以合乎道德和负责任的方式构建产品。\n\
  \n## 品牌\n\n将品牌纳入优先因素清单似乎很奇怪，但品牌无处不在。我们都有个人品牌，无论我们是否意识到。我们的部门和团队都有品牌形象，就像我们工作的公司一样。当你为产品设计确定最重要的因素时，你必须思考品牌在其中扮演的角色，以及该品牌是否与你在产品设计阶段美学阶段做出的选择保持一致。在基础层面，你正在设计的产品必须遵守公司花费时间创建的品牌形象。\n\
  \n这是因为品牌影响着一切，从影响你的用户和客户、与他们建立信任、以及在市场上区分你的价值，到与你的受众进行情感互动、你在市场上的公司和产品形象，以及你在伦理和社会责任方面扮演的角色。当我们在构建和发布产品时，许多直觉性的决定都得到了我们用来指导我们的分析和指标的支持。我们实施产品\
  \ KPI 和指标来让我们知道我们是否走在正确的轨道上。\n\n在缺乏正式指标的情况下，我们通常可以退回到**品牌形象**作为我们的指南。在构建过程中，品牌将具有情感元素，并且这些元素无论我们是否知道都会通过我们的产品闪现。品牌形象是我们将向终端用户和客户传达公司和产品价值观的载体。\n\
  \n即使你做对了所有事情，你的产品如何融入你的品牌形象仍然可能是一个挑战。你打造了一个无可挑剔的设计，你验证了所有的猜测，你让公司最好的头脑加入进来，你觉得你的产品足够连贯，其目的和价值都很清晰……而你的产品仍然可能与你的品牌形象不一致。特别是在今天，AI\
  \ 产品无处不在，将产品与你的品牌和价值观保持一致是与将购买和使用它们的人建立情感联系的重要方式。\n\n品牌并不是一个那么模糊的概念。当你思考它时，它是一种声音，一种语气，某些颜色，以及某些价值观和角色。它有助于让你的公司和产品在泛滥的灰色物质中显得特别。随着\
  \ AI 的持续采用，越来越多的公司会屈服于使用生成式 AI 进行营销和沟通工作的诱惑。外包创造力给 AI 既方便又便宜，但最终它会让那片灰色海洋变得更大。因此，请记住，随着我们一起继续\
  \ AI 之旅，展现更多你的个性、身份和价值观将至关重要，因为你不是向 AI 销售；你是在向人类销售。\n\n我们已经讨论了建立信任的概念，它与 AI 伦理和数据隐私有关，但我们也需要在这里重新回到这个想法。通过你的品牌推广工作建立一个强大、可信赖且有区别的声音，将在你的\
  \ AI 产品中建立信任和信誉。许多 AI 产品已经存在于所有垂直行业和行业中，随着十年的继续，这个空间将继续饱和。通过你与社区沟通的方式，有意地区分你的公司和产品将是关键。\n\
  \n随着越来越多的 AI 产品挤入这个空间，你在做出产品设计决策时会发现自己不断回到同一个问题。“这个产品设计决策是否与我们的品牌形象一致？” 如果维护道德标准、避免偏见和歧视、尊重用户隐私、以及促进透明度和问责制是你的品牌形象的一部分，你将希望通过你的产品设计和沟通工作以各种方式发出信号。\n\
  \n产品设计决策影响着从你如何设置基础设施和组建团队，到你如何打造用户体验、你将优先考虑哪些伦理考虑、以及你希望如何与终端用户和客户进行情感互动等方方面面。这些都将是与你在开始产品设计流程时确定的所有关键利益相关者进行讨论的大问题，因为它们影响着你的产品将被如何感知和参与。一个设计良好、运行良好且有价值的产品将在市场上拥有良好的声誉。如果它是由一家成立且受人尊敬的公司制造的，这一点尤其正确。它将导致来自用户冠军的有机增长，这将推动需求并保持你的采用率高。你的\
  \ UI、语言、整体 UX 设计、颜色、视觉元素、设计元素和工作流程都是在你的产品设计中打造视觉品牌形象的一部分。这些是你将用来为你的终端用户和客户创造一种体验的工具，这种体验会长期地建立对你的产品的信任和忠诚。\n\
  \n我不会告诉你哪个优先级是正确的；没有一本书可以做到。这是一项只有你和你的团队可以共同达成的协作努力。但我们已经有一个可供参考的蓝图。基于我们第一部分的产品设计原则，你已经有一个起点：你的终端用户和市场。除此之外，我们还讨论了当\
  \ AI 参与时增加产品设计过程复杂性的因素，以及你在优先考虑产品设计工作时可以考虑的一些因素。这些旨在成为你在开始将 AI 原生产品推向市场并最初踏上设计之旅时可以部署的工具。但这段旅程将继续，如果它要是一段长期的旅程，你需要向你的社区传达你从哪里开始以及为什么。\n\
  \n今天就想想这个问题。为什么你的公司已经投资于为自己的团队配备资源？肯定有令人信服的理由说明你的职位在公司中存在，或者为什么你的公司决定全力以赴推出这个新的\
  \ AI 产品。深入了解那个叙述的本质并找到导致这些决定的热情，是将构成你的故事的核心。传达这个故事将是人们购买你的产品的一个重要原因。\n\n## 你在讲述什么故事？\n\
  \n每个人都喜欢科技创始人如此相信他们的产品以至于在车库里建立公司的故事。经常这些故事是虚假的或有缺陷的，投射出一个通过热情、奉献和独自自筹资金而克服逆境的单一创始人形象。最终，他们会幸运地遇到正确的人看到他们所做的事情的价值，并受到启发，全力以赴并资助他们的崇高抱负。这当然是一种神话，而人类几千年来一直对神话感兴趣。\n\
  \n\n\n\n\n讲故事就像大脑的糖果；它帮助我们穿透生活中的各种干扰，从内心深处享受某件事。这种享受让我们能够做很多事情。首先，它可以帮助我们更好地理解像\
  \ AI 产品这样学习曲线陡峭的复杂事物。此外，吸引用户并传达你的产品为何重要，正是你开始与用户建立关系的方式，而当你能够利用这种参与度让你的产品更易消化，并为其工作原理以及为何以这种方式构建提供更多背景时，这种关系会被提升到下一个层次。\n\
  \n由于你围绕产品创造了一个叙事，这也使你的产品更具人情味和亲和力。根据尼尔森的一项研究，人们购买产品很大程度上出于情感原因。无论你是在 B2B 还是 B2C\
  \ 环境中销售，讲故事都提供了一种作弊代码，能有效传达购买和使用我们产品的价值和情感利益。正如我们在本章前面部分讨论的那样，你将通过产品设计的各个元素找到与终端用户在情感上产生共鸣的方法。但伴随你的产品的讲故事也会做到这一点。拥有并在引人入胜的故事上不断建设，将使他人真正地在多个层面与你的产品想要实现的目标产生共情。\n\
  \n投资讲故事也有非常实际的原因。通过倾听故事，我们能够记住比在情绪未被调动时更多细节。一些科学家发现，当我们被讲述故事时，我们的大脑会释放皮质醇、多巴胺和催产素等化学物质。这些化学物质有助于形成记忆，调节我们的情绪反应以保持参与度，并增强我们的同理心以帮助建立和维持关系。\n\
  \n特别是在 AI 产品的背景下，可能涉及多个用例，基于讲故事的构建是一种确保客户不仅理解我们的产品，还能看到它们在多个情境中发挥作用的方式。不仅如此，他们还会发现这些不同的情境同样令人难忘。我们在本章中讨论了维护\
  \ AI 产品的伦理问题，而讲故事也是创造围绕为何这对你的公司、品牌和产品重要的叙事的绝佳方式。这样做将确保你的品牌认知与你对以合乎道德和负责任的方式构建 AI\
  \ 的承诺相联系。\n\n讲故事可以是很多种形式。它可以是你的 CEO 或领导团队在会议和活动中宣扬公司的工作。它可以是博客文章、白皮书、特别报告，或是你公司网站/产品页面上的内容。它可以是你评论和与在线社区互动的方式。它可以是你自己的社交媒体策略、语言和帖子。或者它可以融入产品设计和用户体验本身。\n\
  \n现在我们已经谈到了讲故事的益处和动态，让我们看看它们如何应用于产品设计本身。融入讲故事的元素将有助于以下几点：传达产品的价值和相关性，吸引你的用户和客户群体，并为与产品互动的人提供情感连接。构建一个让客户和用户更亲近并保持他们参与度的叙事，将确保你为你的\
  \ AI 产品培养忠实的追随者。让我们探索讲故事的元素在嵌入到你的产品设计工作中时可能是什么样子。我最喜欢使用的产品之一是 Duolingo，我将使用该应用作为公司如何在其\
  \ AI 产品的交付中使用讲故事的积极例子。\n\n## Set the stage\n\nDuolingo 不断围绕产品存在的理由和它如何帮助人们创造叙事。我知道我为什么使用\
  \ Duolingo，但我不一定知道为什么或如何帮助他人。设定场景很重要，因为从体验上讲，它不断强化某件事对我而言为何相关。这种框架持续帮助我理解该应用价值的重要性。随着我继续使用该应用，我经常被提醒\
  \ Duolingo 对他人有多有效，我在完成任务或里程碑时处于哪个百分位，以及我何时遇到痛点或庆祝时刻。上下文是关键，而且这些叙事并不过于压倒性或持续不断，但它们持续提醒我自己在产品中的定位。\n\
  \n## Characters\n\n我们经常在 AI 产品中看到这一点。无论是聊天机器人功能还是语音，总有一些角色参与其中，这使 AI 拟人化。在 Duolingo\
  \ 中，有许多不同年龄的角色会出来与我互动，每一个都为产品体验带来不同的能量或视角。角色的多样性也在应用的游戏化中发挥作用，游戏化本身就旨在让我想要获胜……顺便学法语。角色也让我感觉我确实是在与一个团队一起玩，并且有许多其他实体在那里见证我的成功。是的，如果这意味着我能进入下一级，我可以足够地暂时搁置怀疑来投入这个幻想。\n\
  \n## Progression\n\n每个好故事都有引人入胜的开头、缓慢积累到高潮，以及一个结局。你可以想象你的产品以与你构建设计时相同的方式展开。也许你不想同时向用户展示所有功能，以免他们被能力淹没。也许某种成就可以解锁其他功能。如果你的客户和用户能体验到某种进展，它会产生他们与你同在旅途中的效果，并且他们的行动和在此旅途中的表现很重要，具有真正的后果。对于所有科技产品，包括\
  \ AI 产品，防止认知负荷过重是棘手的。\n\n在我们的 Duolingo 例子中，该应用通过向我展示我在旅程中即将进行的确切步骤来做到这一点。我可以看到所有学习课程都以逐步路线图的形式列出。我可以决定想要多快前进，并在我推进时看到接下来会发生什么。让用户踏上这样的旅程也有助于他们在发现或解锁某些内容时感到愉悦和惊喜。这也提升了参与度。你在产品设计过程中讲故事的渐进性质量也会捕捉用户在继续旅程时的里程碑。当你的用户达到目标、满足要求、庆祝完成某事、遇到困难时期，或被给予反馈以帮助他们改进时，为这些时刻构建叙事组件，都是你展示他们在持续使用产品时所经历的进展的方式。它也传达了你理解他们作为用户和作为一个人。\n\
  \n## Knowledge\n\n构建一个强大的知识库来传达产品体验的预期用途和特殊福利，也是提升参与度的关键。特别是在早期，当你的客户和用户正在入职或成为一个繁忙社区的一部分时，你希望有足够关于你的产品设计、UI\
  \ 和 UX 的材料来满足那些渴求知识的人。保持一个强大的知识库是让讲故事在你的用户群中保持活跃的一种方式。\n\n在 Duolingo 的例子中，有许多文章、资源和部分涵盖了学习语言的各个方面，并且它们会提醒我当应用中有新内容时。我们在本章前面讨论过文档，这就是它的延伸。所有面向客户的资源和文档都是你宣布新功能、突出核心产品和概念、并强化你希望用户进行的互动的机会。拥有可以作为故事消化的教程或入职材料，将使你的用户能够学习、记住并强化你的品牌和产品对他们的重要性。\n\
  \n## Call to action\n\n通常，AI 产品在结尾会包含某种号召性用语。也许是推荐、下一步，或是对其所做的某种确定性质量的解释。你可以在向客户传达号召性用语时使用叙述，为他们提供更多背景并更好地解释你的\
  \ AI 为何做出该决定。这会带来两件事：\n\n- 它使基于 AI 的决定更具人性化和可理解性。\n- 它为你的客户和用户提供了更多相信你的产品的理由。\n\n\
  由于与 AI 产品建立信任非常重要，特别是现在当许多人仍然对 AI 出错的恐惧记忆犹新时，将叙述融入与客户和用户沟通的各个方面，是强化你花费大量时间建立的信任的一种方式！Duolingo\
  \ 提供了许多让你行动起来的方式。他们可能会让你参与朋友任务，因此你会被击败友好对手的动力所激发。如果你经常犯某些错误，他们会给你一个简短的时间窗口来理解概念，然后再给你下一个课程。如果你进展良好，他们也会提醒你如果保持良好工作可以获得的潜在新奖项和徽章。所有这些都是\
  \ AI 功能和驱动应用的机制被用来影响行为的方式。\n\n\n\n\n\n## 案例研究\n\n在我们关于 Waterbear 的案例研究中，我们看到许多这样的叙事元素活跃其中，与\
  \ Duolingo 非常相似。Waterbear 创始团队希望为用户提供一种游戏化的体验，尤其是因为他们觉得这有助于平衡使用心理健康应用时的一些沉重感。尽管游戏化是有效的，并且能够提升用户参与度，正如我们在\
  \ Duolingo 身上看到的那样，但它也可能削弱应用体验。创始团队很早就发现，他们产品的第一个迭代版本实际上并没有引起最终用户的强烈共鸣，因为用户觉得游戏化对于该应用本应达成的目的来说过于轻松了。绝大多数反馈是：尽管他们很欣赏这款应用会像玩游戏一样“鼓励”你，但这种感觉显得不合时宜。毕竟，用户并不是在玩游戏，而是在与一个试图了解他们的对话式\
  \ AI 分享深刻、感性，有时甚至令人难以承受的话题。这是 Waterbear 在产品设计上学到的众多教训之一。\n\n让我们根据本章前面提到的产品设计元素来探讨一些经验教训：\n\
  \n- 1. 从真正了解最终用户开始——真的！\n\n    最初，Waterbear 创始团队曾怀有将心理健康护理完全外包给 AI 的远大梦想。AI 是一颗银弹，他们过度认同了这种炒作！他们认为自己的产品可以解决世界上治疗师不足、心理健康支持需求旺盛的问题。但事实证明，取代人类治疗师并非易事。专业人士可以从事的治疗学科有许多，而单一模型不可能在不自相矛盾的情况下涵盖所有学科。最终，他们开始与\
  \ Akeira 的真实潜在最终用户交流，并发现了相当令人惊讶的事情，这让他们更容易定义问题。\n\n- 2. 在问题定义你之前，先定义问题。\n\n    他们发现，没有一位潜在最终用户真正想用\
  \ Akeira 取代自己的治疗师，或将其用作治疗师的替代品。他们只希望 Akeira 能成为一双友善的耳朵，以及一个可以集中所有心理活动的地方。他们不想被诊断，也不想被心理分析。他们只想要一个安全的地方来分享。其中一个强烈的痛点是：很难找到一个固定一致的场所，单纯地倾诉心理健康问题并试图理解它们。\n\
  \n- 3. 试验：从几个原型开始，然后确定一个。\n\n    通过一个更以用户为中心的视角来定义问题，帮助 Akeira 产品团队明确了在确定最终原型之前可以试验和验证的解决方案类型。但他们过早地敲定了一个\
  \ Akeira 原型，没有引入足够多元的视角，也没有考虑至少两到三个原型。第一个原型包含日记功能、仪表板功能和聊天功能。鉴于第一个原型就有如此的复杂程度，产品团队很难从测试用户那里获得一致的反馈。\n\
  \n以下是 Akeira 产品团队为构建最终原型而制作的一个线框示例：\n\n![](img/a0c9f9a2ba06a06d309ce21d890a47c6_248_0.png)\n\
  \n图9.2：Akeira 的参考线框图\n\n- 4. 验证：测试假设。\n\n    一些用户觉得聊天功能非常有用，但日记功能却很别扭。有些人喜欢仪表板，但另一些人觉得它令人困惑，因为他们认为它不够清晰，也不够明确。Akeira\
  \ 测试组给出的最强烈反馈之一是，他们希望 Akeira 成为一种伴侣工具；当他们想要敞开心扉时，可以把它分享给治疗师或亲人。这仍然处于非常早期的阶段，公司在其产品设计之路上也还算顺利，但这很好地提醒了我们：如果在真正经过最终用户充分验证之前过早做出某些假设，会发生什么。\n\
  \n- 5. 迭代是关键。\n\n    当 Waterbear 开始推出其旗舰产品 Akeira 时，领导层和产品团队知道他们想带着一款以心理健康为重点的应用进入市场，但最初他们设想的是使用\
  \ ChatGPT API 构建一个 MVP。在利用其他公司的其他基础模型（LLM）对产品进行几次迭代之后，他们发现 BERT 模型的性能比 ChatGPT 的模型更好。他们发现\
  \ ChatGPT 产生的幻觉比 BERT 更多，因此决定选择更保守的模型，因为应用主题是以心理健康为重点。他们不希望模型说出任何煽情或引发情绪波动的内容，尤其是面对那些在技术面前展现脆弱、信任其产品设计选择的人。\n\
  \n- 6. 美学不一定要由公司内部决定。\n\n    Akeira 产品团队还希望把部分产品决策发布到博客上，让自己正在建立的忠实社区了解其中一些决策。这样做的原因有二：既可以在\
  \ AI 相关问题上展示公司的透明度，也可以从那些渴望成为构建过程基础一部分的热心客户那里获得早期信号。事实证明，他们的在线社区非常欣赏这种透明度，以至于社区成员开始在社交媒体上分享这些见解，从而吸引了更多潜在客户。在那篇博客发布后的三个月内，Akeira\
  \ 的**月活跃用户数（MAUs）**翻了一番。\n\n    这部分源于客户有种被透露了秘密的感觉。通过收到这样一篇专门的博客文章，他们感到自己受到信任和重视。但他们也觉得自己可以从中学习。通过当天发布的博客，他们感到自己的智慧受到了赞赏，而非侮辱。这些并不是对\
  \ AI 特别感兴趣的最终用户，但这种坦诚不仅让他们对 AI 产生了兴趣，也让他们对 Waterbear 本身产生了兴趣。由于对品牌产生了强烈的认同感，并感觉自己被引入了一座充满可能性的秘密花园，他们发现自己对这家公司更加忠诚。其他公司可能不会选择如此透明，但在\
  \ Waterbear 的案例中，它产生了激励人心的影响，尤其因为这种做法如此罕见。\n\n- 7. 文档化：让客户参与文档化和产品设计选择会带来回报。\n\n\
  \    前文提到的博客举措带来的部分热度，延伸到了 Waterbear 潜在的新产品领域。最终，围绕该公司及其产品选择的讨论足够多，以至于 Akeira 目标人群之外的潜在客户开始要求获得属于他们自己的产品。Akeira\
  \ 是为 18 岁以上女性打造并针对这一群体的产品，但一些线上讨论也来自男性和 18 岁以下的女孩。Waterbear 尚未推出任何新产品，但它已经开始产品设计生命周期的研究阶段，着手为女孩和男性开发新产品。针对\
  \ 18 岁以下男孩的初步讨论也已启动，但该领域尚未开始任何产品设计活动。\n\n最终，Akeira 产品团队找到了一种方法，在未知与他们安心回归的恒定要素之间实现了完美的平衡。他们从一开始就知道，要围绕用户的实际价值和身心健康打造产品体验。他们也保持谦逊，不断回来寻求反馈和迭代，直到他们认为自己实现了这一目标。\n\
  \n## 总结\n\n在本章中，我们涵盖了产品设计的各个阶段，以了解基础设计元素，这些元素将决定 AI 产品如何被构想，并通过原型开发推向市场。我们还探讨了使\
  \ AI 原生产品设计尤其具有挑战性的领域，重点关注提出以用户为中心的解决方案的具体细节，以及机器学习和可解释性方面的挑战。我们讨论了 AI 产品经理在产品设计过程中如何确保目标清晰且保持一致，最后探讨了叙事及其对产品设计的影响。这些都是相关因素，将在确保你初生的\
  \ AI 产品成功并获得采用方面发挥至关重要的作用，因为它们有助于传达产品为谁而设计，以及它将如何陪伴用户一路前行的故事。\n\n产品设计就是构建一份蓝图，让它随着时间发展成功能完善、可管理且成熟的产品。这一章内容非常密集，为原型发布后的下一阶段——为你的原型建立性能指标——奠定了基础。当你准备好构建完整产品并进入开发周期时，你将纳入这些指标。\n\
