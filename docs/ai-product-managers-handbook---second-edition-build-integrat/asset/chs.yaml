  \n\n\n\n# 10\n# 基准测试性能、增长黑客与成本\n\n在本章中，我们将了解衡量产品在各种形式下成功所需的基准测试。我们将从产品和增长的角度来看待性能指标。这些指标包括**价值指标、北极星指标、关键绩效指标（KPI）以及目标与关键结果（OKR）**，公司可以利用它们来提前判断其产品战略是否成功，并是否能够带来增长黑客效应。我们还将讨论公司如何做好准备，以便在产品与其他产品进行比较时捍卫自己的产品。\n\
  \n谈到产品的成功，归根结底取决于你能否有效地向潜在客户传达其价值，并接受检验。在销售团队与客户对话之间周旋时，你需要确保AI产品能为客户带来的切实利益成为销售过程中的重要部分。当客户来找你并给你展示的机会时，你是否有可靠的演示可供展示？你是否能够展示你的产品在各种数据集上的表现，还是它只在使用你自有数据时表现良好？你能否谈论你所使用的方法或算法，而不必诉诸于*专有配方*这种不便讨论的安全地带？你能否自信地让他们联系合作伙伴或客户，以获得推荐？在你开始为销售或投资推介跟踪产品性能之前，你需要在你所处的生态系统中建立信任。如果没有坚实的根基，传达成功只会显得空洞。\n\
  \n随着本章的继续，我们讨论如何衡量和传达产品的成功，以及如何确定合适的成本结构时，我们必须记住一个基本事实：归根结底，成本并不重要。当然，保持在可接受的范围内很重要。价格是否与产品的价值主张一致？与市场上同类解决方案相比，它是否具有竞争力？有些客户会比其他人更注重成本，但归根结底，客户不一定因为价格标签而放弃强大的产品。如果它有效，并且比其他产品更有效，他们通常会设法挤出预算。\n\
  \n如果你在B2B公司担任AI产品经理，你很清楚购买软件是一件棘手的事情，因为采购决策通常涉及多个利益相关者。在概念验证、预算讨论、与潜在供应商的无数次会面、投入自己的技术资源来评估环境中的每个工具、功能比较、管理内部利益相关者，以及最终就公司认为最适合其用例的产品达成一致的过程中，整个过程可能会令人精疲力竭和沮丧。如果你是B2C公司的AI产品经理，你仍然会遇到这些障碍，只是需要兼顾的业务利益相关者较少。这为产品经理提供了巨大的机会，既可以减轻客户的负担，又能让自己的产品脱颖而出。\n\
  \nB2B环境下的决策过程可能很长，涉及多层审批，因此比B2C场景更为复杂。AI产品经理必须在产品购买前评估过程中专注于提升用户体验、解决客户痛点以及管理摩擦点。为了有效做到这一点，他们必须定义衡量产品成功和有效性的指标，以便了解产品的市场接受度，无论产品是B2B还是B2C。\n\
  \n通过建立价值指标，AI产品经理可以确保他们所做的决策在客观上得到数据的支持。这意味着他们可以更好地证明在AI/ML能力和第三方工具上的投资是合理的，同时解决成本方面的担忧，并向客户和用户展示价值。如果AI产品经理能够构建一款能立即展现价值的产品——一款能够帮助加快决策、减少用户摩擦的产品——他们就能打造一个极具说服力的用例，与客户产生深刻共鸣，并让达成共识和采购的道路更加顺畅。\n\
  \n接下来，让我们进入本章。我们将涵盖以下主题：\n\n- 价值指标——北极星指标、KPI和OKR指南\n- 增长黑客——产品驱动增长\n- 技术栈——早期信号\n\
  - 管理成本与定价——AI很昂贵\n\n## 价值指标——北极星指标、KPI和OKR指南\n\n在本节中，我们将从哪些内容最适合留在企业内部、哪些内容最适合向外传达的角度来讨论价值指标、KPI和OKR。所有关系都建立在信任之上，这包括公司/产品经理与客户和市场之间的关系。假设你已经找到了一种在你的产品周围建立良好信任圈的方法，那么作为产品经理，你的职责就是确保这种关系持续增长和发展，理想情况下是通过纳入市场的反馈。\n\
  \n一个很好的方法就是传达产品的价值，并不断构建和引用这种增长与演变。做到这一点的方法是使用工具来跟踪和确认产品的进展。关键问题是：你会选择跟踪什么？你会特别关注哪些指标？这是所有公司都难以做对的事情，因为人们很容易将所有追求与收入挂钩，并将其作为最重要的价值指标，但这往往无法让我们看到全貌。\n\
  \n选择指标，尤其是北极星指标，是一项严谨细致的工作，最好在协作环境中进行。在做出这些基础性决策时，你需要听到多样化的声音。这些决策不应掉以轻心，因为在很多方面，这些规范的建立会产生下游涟漪效应，以这样或那样的方式触及几乎所有内部团队。\n\
  \n所有公司和组织在任何时候都在对抗一定程度的熵。熵是一种给业务开展方式带来无序、不确定性或随机性的力量，也是我们在定义成功和设定目标时所对抗的核心力量。我们在前面章节中已经讨论过漂移的概念，这个概念在这里同样适用。你可以将熵视为组织漂移。这是因为随着日子、星期和月份的推移，优先级可能会发生变化。有时这是有充分理由的。但如果你规划得当、制定好了战略，就应该抵制环境变化，确保执行你制定好的产品战略。\n\
  \n在产品或组织层面构建OKR，是抵御这种熵的一种工具。它确保你坚持创办公司和打造产品时所希望践行的价值观、信念和宗旨。建议公司设定3-4个产品或组织OKR，以确保一致性不被破坏。OKR是公司做出的战略选择，用于优先考虑某些成果而非其他成果。它们应该是合理、可实现的目标，与产品战略保持一致，并反映公司的目标和优先级。\n\
  \n我们在本章中重点关注的KPI主要涉及你的整体产品KPI，以及它们与你的总体产品战略之间的关系。你的产品战略是产品愿景的延伸，它所确立的KPI和指标不仅要反映你的产品为用户设定的目标，还要反映用户认为产品最有价值的地方。\n\
  \n找到一种方式来表达这种价值，并在内部和外部环境中持续沟通，这或许是让你的市场参与进来的最重要方面，因为它影响你如何看待和倾听客户，并最终影响你如何与他们交谈。让我们深入探讨吧！\n\
  \n### 北极星指标\n\n为你的产品选择北极星指标，是让产品战略与实现关键目标保持一致的重要部分。大多数产品通常会以公司用来跟踪进展的一个首要指标为导向。选错了指标，或者根本不选，都会对团队的建设、引导和衡量方式产生混乱的影响。它还可能导致一个不幸的意外后果：让你无法全面了解客户方面的情况。这对于新兴的AI/ML原生产品尤其重要，因为你希望尽早获得关于哪些有效、哪些无效的信号，以便更快地改进产品。\n\
  \n根据你的产品所涉及的各种力量，你会受到某些影响。这可能意味着来自投资者和领导层的影响，也意味着来自产品构建者和使用者的影响。当然，我们依靠反馈来做出产品决策。但将用户和客户的声音置于产品战略的核心并非理所当然。许多产品团队会自称以客户为中心，但真正践行这种口头承诺的却寥寥无几。\n\
  \n\n\n\n这就是为什么选择北极星指标在结构上与你的产品战略和公司的价值观紧密相连。它还可能对你如何衡量整个产品的成功产生颠覆性影响。这是因为北极星指标是你的主要\
  \ KPI。它不仅让整个公司围绕一个共同目标团结起来，还能传达公司整体的表现如何。使用它可以让内部和外部的人了解整体情况是否良好（或不佳）。如果你做得正确，你将拥有一个能够优雅地反映收入、表现和参与度等指标的数据指标。\n\
  \n采取自由放任的方法可能很有吸引力。毕竟，传统上产品往往以构建和发布的数量来衡量。然而，确立北极星指标是一个战略选择，有利于产品在公司内部的功能和影响力。对于人工智能公司来说尤其如此，因为人工智能具有新颖性且在当今市场具有战略重要性。确立北极星指标是一种向整个组织展示产品团队从根本上是与业务成功保持一致的方式，并强化了这样的理念：公司是以产品为导向，而不是以销售为导向。\n\
  \n这样做的好处有三重：\n\n-   你让整个组织与你的产品团队保持一致。\n-   你还为你的产品团队提供了一个标准，让他们保持负责并接受衡量。\n-  \
  \ 这两个系统协同工作，形成一个反馈循环，使你组织中的任何人都能在很大程度上确定这艘船是否在按照应有的方式航行。这为市场营销、销售、物流、财务、产品和客户成功团队之间以及各自团队内部的讨论提供了信息。\n\
  \n如果你是产品经理，尤其是正在开创一种新颖的人工智能产品的产品经理，我们强烈建议你推动北极星指标的建立。很有可能，如果你从根本上参与了构建产品战略和创建产品愿景，你已经对这个指标会是什么有了清晰的认识，因为它与产品的最终价值最为一致。如果你想在如何建立北极星指标方面获得更多指导，我们建议你参考\
  \ Growth Academy 这一资源，但现在，这里有一些问题可以帮助你开始：\n\n-   我的产品打算做什么？\n-   我如何知道它是否实现了预期功能？\n\
  -   哪些活动能带来最佳的产品体验？\n-   我的客户最看重我产品的哪些方面？\n-   在我的客户旅程中，是否有一个时刻能吸引他们？\n-   除了*注册*或*购买*之外，未来收入的指标有哪些？\n\
  -   我的目标是让客户更高效、吸引他们的注意力，还是让他们购买东西？\n-   我希望客户采取特定行动还是各种各样的行动？\n-   成功是通过客户使用我产品的频率或效率来衡量吗？\n\
  \n每家公司都会有不同的方法来制定北极星指标，因为它从根本上以商业模式为中心，这就是为什么确立北极星指标是整体产品战略讨论的一部分。它还将基于你理想的客户旅程，因为你正在优化某个最符合客户期望的时刻，并将该时刻与公司成功最重要的因素对齐。\n\
  \n> 注意\n> \n> 如果你的商业模式和成功需要采用多方面的方法，你可能希望拥有不止一个北极星指标。\n\n以下是一些著名的数字产品公司及其北极星指标：\n\
  \n-   *Airbnb* 关注的是预订的夜晚数量。\n-   *Uber* 的最终目标是提高乘客量，因此他们关注预订的行程次数。\n-   *HubSpot*\
  \ 希望整个团队都能积极参与其平台，以确保其软件被定期依赖，因此他们使用每周活跃团队这一指标。\n-   *Amazon* 不仅仅关注总销售额——他们关注所有用户的行为模式，因此他们使用每位用户的月度购买量。\n\
  -   *LinkedIn* 可能不是你会每天使用的社交媒体工具，但如果你是在职专业人士，你很可能有理由每个月回来一次，因此他们专注于月度活跃用户。\n-  \
  \ *BlueApron* 是少数拥有两个北极星指标的公司之一，因此他们关注每位客户的订单量以及订阅模式下的活跃订阅者。\n-   *Facebook* 和 *Instagram*\
  \ 希望让你的注意力产生日常依赖，因此他们关注每日活跃用户。\n-   *Netflix* 最终希望鼓励人们观看他们所有的电影和节目，并且他们保持简单，专注于观看时长。\n\
  -   *Spotify* 也有两个北极星指标，一方面通过月度活跃用户关注回访用户，另一方面通过流媒体播放时长关注其平台上的音乐消费。\n-   *Duolingo*\
  \ 有三个北极星指标——每日活跃用户、学习时长和成功——强化了他们对活跃学习者经常回来并花费大量时间学习且看到这种投入带来积极成果的期望。\n-   *Quora*\
  \ 保持简单，专注于回答问题的数量。\n\n还有一系列现成的北极星指标类别可供你考虑，尤其当你在产品套件中开始一个新奇产品，或者你正在创办一家公司时。同样，要对这些指标保持极高的辨别力，并对其进行检验。与你的市场推广/销售/领导团队进行头脑风暴并开展研讨会。假设这些指标都已到位，尝试构想一个完整的愿景。问问自己：如果我们以此作为北极星指标，一年、五年或十年后我们的业务会是什么样？\n\
  \n## KPI 与其他指标\n\n上一节关于北极星指标的内容为我们提供了一些关于可追踪的各种指标的好例子。这是一个很好的方式，用来归组你将要追踪的各种KPI，除了你确定为北极星指标的那个之外，因为指标的目标是让我们快速洞察产品的优势和成功。然而，这些数字并不是孤立存在的。如果你的收入很高，但仅来自两个客户，那有什么意义呢？如果你的客户安装了你的产品却从未积极使用，那又有什么意义呢？\n\
  \n拥有全面多样的KPI组合是负责任的。尽你所能，探索客户和用户与产品互动的各种方式，这不仅有助于你的产品成功地为客户传递价值，还能让你的产品组织了解在功能方面的潜在改进和扩展领域。对于人工智能产品来说尤其如此，它可能具有传统软件产品所没有的隐患。使用KPI来追踪多种行为和性能基准，是让客户与产品之间的反馈循环保持活力的方式。\n\
  \n> 在本章中，我们混用 KPI 和指标这两个术语，但有一个关键区别。指标（metric）更偏向一个通用术语，适用于可以量化衡量的任何事物。而 KPI 则与特定的、可以追踪并对照关键业务目标进行衡量的内容相关。并非你的所有指标都会与首要业务目标相关，但你的所有\
  \ KPI 都会是指标。使用这些工具的目的是查看你的产品采用率需要在哪些方面实现新的增长。也许你的北极星指标追踪得很好，但你的其他 KPI 出现了下降。这表明可能存在需要关注的新产品领域。\n\
  \nKPI 和其他指标的使用旨在向产品经理和领导者发出早期预警信号，提示他们产品的优势、成功和可用性，但除此之外，它们还旨在描绘出为什么某些事情进展不顺的叙事。这就是为什么协调你的KPI和指标是一个需要大量思考的过程。\n\
  \n你需要使用你的指标来帮助排除出现的问题，例如错误或页面问题，同时也需要利用它们来帮助发现产品体验中不理想的领域。你需要了解产品在构建方式上是否存在问题，以及产品在部署方式上是否存在暂时性问题。对于人工智能产品经理来说，使用多种指标来衡量整体产品体验是一种最佳实践。以下是一些常见KPI和指标的列表，供你参考，并附有描述：\n\
  \n-   **年度/月度经常性收入**：衡量一个月或一年内可预测的收入\n-   **收入增长**：与上一时期相比的收入增长百分比\n-   **付费用户**：所有活跃订阅者/购买者的数量\n\
  -   **每用户平均收入**：总收入除以总用户数\n-   **客户终身价值 (CLTV)**：每个获客客户所产生的收入\n-   **客户获取成本 (CAC)**：与每个获客客户相关的营销、销售和广告总成本\n\
  \n\n\n\n\n- **推荐率：** 来自现有客户推荐的新客户所占的百分比\n- **应用下载量：** 每周或每月应用的下载和安装数量\n- **客户参与度指标：**\
  \ 产品、应用或网站用户互动深度的衡量指标，例如网站停留时间和跳出率\n\n建立具体且可衡量的指标是理所当然的，但它们也必须高度相关才有意义。拥有大量独立访客、会话或社交媒体粉丝看起来可能很不错，但这些指标从长远来看并不能真正帮助你，因为它们不可操作。如果你那些独立访客是偶然到达或因出了问题而离开，如果会话是意外点击或标题党，或如果社交媒体粉丝是机器人，那么这些信息就无处可去。\n\
  \n你可能也听说过“虚荣指标”这个词，这对领导者和产品经理来说都是一个需要警惕的点。**虚荣指标**是令公司看起来很体面的指标，但实际上并不能真正传达成功或绩效的基础。它们也无法告诉你应该改进什么。确保你使用的任何指标，无论是北极星指标还是其他，都能为公司提供重要的洞察。\n\
  \n当你希望建立指标和 KPI 时，请记住以下问题：\n\n- 这个指标如何影响我们的业务/产品决策？\n- 这个指标实际上告诉我们关于产品/客户行为的什么？\n\
  - 这个指标的数据是否真实反映了现实？\n- 这个指标是否与我们开始衡量后可以改进的某个特定流程环节相关？\n\n## OKRs 和产品战略\n\n我们在 *第\
  \ 6 章* 中介绍了 OKRs。让我们帮你回忆一下——**OKRs** 背后的想法是将某些结果与公司或团队的整体目标联系起来。通常会有组织层面的 OKR，但各个团队甚至个人也可以拥有\
  \ OKR。OKR 由一个与多个关键结果相一致的目标组成，这些关键结果反映了该目标的达成和成功。它们源于明确、定义好的目标，并与一系列成功标准相匹配，以构成该目标的完成。你先看你要实现什么，然后设定达成时的判断标准。\n\
  \n所有建立北极星指标并将其与其他组织指标和 KPI 关联的工作，都服务于你最高层级的 OKR，最终服务于整体的产品战略。所有这些协调工作都是必须完成的深入工作，以使组织增长与产品成功保持一致。这样做不仅强化了产品团队对公司的影响力和战略输入，还使整个组织以高度的专注和一致性保持一致。\n\
  \n让所有团队致力于并以某些组织范围内的目标为导向，并追踪支持这些目标的指标，可以使公司以数据为驱动，同时也让产品团队能够根据产品使用情况及其对整体底线的整体影响做出数据驱动的决策。OKR\
  \ 旨在具有雄心壮志，并旨在拓展组织或团队的能力。\n\n创建可衡量、以指标驱动的产品战略是最佳选择，特别是对于 AI 产品，因为你需要尽可能多地了解客户对产品的体验，以便知道该如何改进和优化。到目前为止我们讨论过的一切——你的产品愿景、你的北极星指标、你的支持性\
  \ KPI 和指标，以及你的 OKR——都应支持你整体的产品战略。\n\n我们喜欢 ProductPlan 呈现的图表，因为它突出了产品愿景与战略之间的关系，以及该战略如何在推动产品前进的各个支持团队中得到应用。根据发布在\
  \ ProductPlan 网站上的 *Product Strategy* 博客，产品战略是高层次的。它是一项计划，描述了企业希望通过其正在构建的产品实现什么。产品成为企业整体目标的载体。因为它是一项计划，所以它应解决产品将服务的用户角色和客户细分、它将如何使这些细分受益，以及公司在开发开始后对产品的目标。产品战略与本章中我们涵盖的所有指标保持一致，影响产品与客户以及企业内部团队的互动方式、相对于竞争产品的构建方式，以及它将如何与宏观趋势相关联，目标是建立产品路线图。你可以将产品战略视为整体计划，而对指标和\
  \ OKR 的追踪、衡量和改进则是你实施该计划的具体、可触摸的方式。\n\n在本节中，我们涵盖了构建产品战略所涉及的几个关键要素以及如何衡量该战略的进展。公司对此有几种选择。公司或产品团队所采取的方向高度取决于组织的战略、商业模式、市场战略、竞争格局以及整体市场状况。\n\
  \n接下来，我们将介绍一些增长黑客的元素，以便新兴的 AI/ML 原生公司或产品能够获得早期信号，了解其产品是否满足客户期望，这将有助于实现产品市场契合和商业成功。\n\
  \n## Hacking — 产品驱动增长\n\n如今，人们对公司应以营销驱动、销售驱动还是产品驱动存在哲学争论。取决于你在公司生态系统中的位置，你可能会偏向于青睐自己的定位。作为产品经理，我们也可能有这种偏见，但如果我们将营销驱动或销售驱动增长推向其自然结论，我们可能会面临困境。让我们先看一下这些不同的观点：\n\
  \n- **营销** 制定可能与受众产生美妙共鸣的信息，但可能与正在构建的内容并不真正一致。营销驱动增长专注于通过广告、内容创作和品牌建设等营销工作推动业务增长。吸引、培育和将潜在客户转化为客户是主要重点。虽然这种策略可能带来快速的品牌知名度并吸引客户，但获取这些客户的成本可能很高，并且可能使业务依赖营销支出来实现增长。\n\
  - **销售** 可能会为公司挑选理想的旗舰客户，但他们将被迫根据少数客户偏好被动地决定应该构建什么产品。销售驱动增长专注于组建专门团队，通过直接销售外联、销售赋能以及通过网络和合作伙伴关系建立关系来与潜在客户互动。虽然这是高价复杂销售周期的有效策略，但它资源和成本密集。\n\
  - **产品驱动增长** 是让产品本身成为获取、留存和扩展的主要驱动力，通过允许用户通过免费增值或试用模式直接体验产品价值来实现。这里的重点是通过自助服务、产品内体验、产品分析和客户反馈循环来赋能潜在客户和用户。优化产品体验和投资产品开发是相关的重大成本，并且这种策略对于需要高度定制的产品来说可能成本过高。\n\
  \n产品团队的角色是多方面的和跨学科的，他们与营销和销售的参与是其自身工作的延伸。产品不能单独存在。如果产品被构建但没有人听说或购买它，它甚至存在吗？必须在研究、市场分析和理解竞争格局以及市场真正需求方面做大量工作，才能构思并构建一个有机会的产品。经常，产品管理处于这些活动的核心，并从一开始就参与其中。\n\
  \n这并不是说营销和销售没有花费大量时间来了解市场。他们确实如此，但产品团队以一种优先考虑构建什么并将某物实体化以供营销和销售推广和销售的方式来为一切提供背景。构建产品战略、选择最佳指标和\
  \ KPI、并获得领导团队和主要利益相关者的认可的最终目标是使你的产品成功——换句话说，最终实现 **产品市场契合**。产品驱动增长与此有何关系？\n\n最佳的因素组合是产品职能吸收来自组织中营销和销售职能的反馈\
  \ [以及众多其他反馈来源]，消化这些信息并将其应用于正在构建的内容。然后，一旦经过这一波，产品职能会发出新的沟通和更新，说明信息传递和产品如何可以改进和优化。理想情况下，这一过程应基于产品体验本身。对于\
  \ AI/ML 产品经理来说，培养支持在业务内追求产品驱动增长的环境的重要性不言而喻。\n\n在 Epsilon 2018 年的一项研究中，我们可以看到 80%\
  \ 的消费者在品牌为他们提供个性化体验时更有可能坚持使用该品牌。最近的麦肯锡研究显示，71% 的消费者开始期望个性化，而 77% 的人在没有个性化时会感到沮丧。那些个性化做得好的公司不仅仅是在满足客户期望上带来愉悦，而且因此增长速度快了\
  \ 40%。根据 Forrester 的说法，“68% 的 B2B 买家更喜欢在线做生意而不是与销售人员打交道，而且当他们与销售人员互动时，他们希望这种体验以更解决问题、咨询的方式进行。”\n\
  \n\n\n\n- 确保仪表板能够处理你最相关的产品 KPI 和指标，并确保自定义报告能够帮助你深入了解用户行为和产品表现的特定方面。\n\n## A/B 测试工具\n\
  \n我们在这些章节中详细讨论了优化的概念，以及实验精神，这对一个不断成长的 AI/ML 驱动型产品组织来说是最佳的。这一点或许最能通过 A/B 测试来体现，我们在第\
  \ 1 章首次引入了这一概念。虽然在构建具有 AI/ML 功能的产品时，你可能需要比较所使用的模型类型，但你还需要对不同用户群体测试产品的某些版本。你可能会对各种事物进行\
  \ A/B 测试——产品的外观和感觉、功能放置的位置、如何引导用户、如何跟踪指标以及实际跟踪哪些指标——以激发那种让用户自愿为你宣传的产品采用率。\n\n在设计产品时，很难就什么最能吸引用户群做出具体决定，尤其是当它是一款面向市场发布的新型\
  \ AI/ML 产品时。A/B 测试让你能够收集数据，了解哪些迭代比其他迭代更成功。你可以通过许多途径来优化产品使用、个性化程度，并最终决定哪些迭代最能带来转化和更多收入。投资\
  \ A/B 测试工具不仅能强化实验文化，还能帮助你跟踪无数次测试，并为你存储这些测试中获得的洞察。\n\n你可以再次选择将这些数据发送到数据仓库，进一步挖掘洞察，并将其与\
  \ BI 工具中其他工具的实验方法相结合；或者你也可以将其存储在你所选工具的仪表板上。无论哪种方式，A/B 工具都能让你组织并跟踪工作成果，如果需要，你可以进行数百次\
  \ A/B 测试。你可以使用这些工具对任何事物进行 A/B 测试，无论是营销活动、功能、按钮、链接、颜色、字体，还是任何你能从中获得定量和定性反馈的东西。知名的\
  \ A/B 测试工具包括 VWO、Optimizely、AB Tasty、Google Optimize 和 Five Second Test。让我们来看看在选择\
  \ A/B 测试产品时需要牢记的一些考虑因素：\n\n- 确保工具支持多种实验类型，以满足不同的测试需求。\n- 考虑基于行为、人口统计、细分群体和其他条件对用户进行分群的选项，以了解个性化定制能力的程度。\n\
  - 检查与你可能在其他地方进行的个性化活动的集成，看看能否在平台内整合这些工作。\n- 评估实施、上手和设置第一个实验需要多少技术专业知识，以及你是否拥有应对这些所需的内部专业能力。\n\
  - 查看用于分析实验结果的统计方法。\n- 确认测试所需的最低样本量，确保你能开展能够产生统计显著结果的实验。\n- 确认工具在测试期间能否根据你的需求为实验分配流量。\n\
  \n## 数据仓库\n\n数据仓库是一种关系型数据库，它允许你像 CDP 一样集中管理数据，但这里的主要优势在于它会对数据进行格式化、转换和标准化，以便将数据提供给诸如我们之前讨论的\
  \ CDP，以及我们接下来要看的 BI 工具等使用。你可能还记得我们在第 1 章中讨论了数据仓库的重要性。可以这么说，你很可能需要一个数据仓库，因为它充当着所有相关公司数据（无论是客户数据还是其他数据）的支柱。可以把它看作是将数据推送到各种工具的主动脉。它还能让你查询已有数据，从而从中获得洞察。\n\
  \n你的数据仓库将是一个中立的场所，当数据没有通过直接查询或通过你连接的其他工具被主动调用时，数据就存放在这里。当你管理一个原生 AI/ML 产品时，你也会以中立的方式思考产品的成功，因为事实是，成功来自一系列事件的集合。你的产品需要与客户和用户沟通，但它也需要以直接解决他们问题的方式构建。你的数据仓库将作为主要的事实来源，将数据适当地发送给负责沟通的团队，以及负责构建的团队。\n\
  \n请记住，如何存储数据将是一个相当重大的财务和战略决策。你可能会选择数据湖或其他不被视为数据仓库的关系型/非关系型数据库——其他角色的人（如解决方案架构师、数据工程师和顾问）可能会做出这个决定。作为\
  \ AI PM，我们建议你成为这一对话的基础组成部分，因为数据的存储方式和位置会对后续事项产生下游影响，例如你最终会采用哪些其他增长黑客工具，以及最终你能从数据中收集到多少洞察。\n\
  \n如果你的数据在数据湖中，你可能不会经常与它交互。数据仓库是为了精炼数据并使其易于推送至其他环境而专门构建的。值得考虑的数据仓库包括 Snowflake、Amazon\
  \ Redshift、Google BigQuery 和 Databricks。以下是选择数据仓库时需要牢记的一些考虑因素：\n\n- 确保你打算使用的数据仓库能够随数据量、处理需求和存储需求扩展，特别是如果你第一次建立数据仓库。\n\
  - 了解你对查询速度的需求，特别是如果你为了高级分析和机器学习而设置它，以支持快速决策。\n- 寻找内置的 ETL 工具来精炼数据；如果不存在，请确认它们是否集成了第三方\
  \ ETL 工具，因为你需要精炼数据，使其可用于数据仓库中的表。\n- 评估数据建模选项，确保数据仓库支持你当前的数据结构、模式、查询需求以及数据类型（结构化、非结构化、半结构化等）。\n\
  - 了解数据仓库的总拥有成本，其中应包括上手、设置、存储、计算和其他服务。\n- 确保与你将用于从数据中提取洞察的 BI 工具兼容。\n- 确认备份和恢复选项，以防发生事件、宕机或数据泄露时丢失数据。\n\
  \n## 商业智能（BI）工具\n\n虽然你的 CDP 和数据仓库会以某种方式组织数据供你使用，但它们可能还不够强大，无法让你有效地探索数据。虽然 CDP 很适合建立一些模式、了解用户角色的旅程等，但它们并非用于对数据进行详尽探索。从技术上讲，你也可以直接从数据仓库查询数据，但你无法直接在数据仓库中可视化或处理这些数据。这就是\
  \ BI 工具的用武之地。\n\nBI 工具让你能够获取数据仓库中的所有数据——这些数据来自各种地方——并真正对其进行分析。BI 工具的目的是帮助你回答关于数据的重要业务问题。数据本身处于静止状态时，既无帮助，也无法带来洞察。你必须分析它才能获得宝藏，在这种情况下，宝藏以趋势、洞察和知识的形式呈现。将数据从静止、分散的状态中提取出来，进行统一和处理，是一个繁琐的过程，没有\
  \ BI 工具很难完成。BI 工具还允许你为团队创建仪表板，以便他们定期对我们本章前面列出的指标进行健康检查。\n\n虽然你的数据仓库可能是你的事实来源，但你会使用\
  \ BI 工具来了解该事实是否真的反映现实，因为它几乎是你唯一能真正看到现实的地方。借助 BI 工具，你不仅检查数据的有效性和可视化表达——你还建立了一套依赖数据驱动决策的体系。新产品或新业务的创造和表达总是存在一定的风险。你不知道结果会如何。BI\
  \ 工具帮助我们尽可能清晰地看到我们所知道的东西，并帮助我们降低这种风险。\n\nBI 工具不仅在内部极具价值。它们还让我们能够创建数据的可视化表示，我们可以通过客户仪表板或关于产品的营销和销售资料来传达这些可视化内容。如果你制作信息图、销售演示文稿，并推动涉及数据图表的客户沟通，这些内容很可能都是通过\
  \ BI 工具制作的。\n\n从本质上讲，BI 工具就像一个数据炼油厂，让你能够进一步打磨想要对外发送的信息，以及想要在内部反思的信息。值得注意的 BI 工具包括\
  \ Power BI、Tableau、Sisense、ThoughtSpot 和 Looker。以下是选择 BI 工具时需要牢记的一些考虑因素：\n\n- 评估你的\
  \ BI 工具需要达到怎样的易用性。它是需要让技术水平较低的人也能使用，还是可以由团队中技术更强的成员使用？\n- 了解你在仪表板、可视化和报告定制方面的需求，特别是如果你对仪表板有细分或特定需求。并非所有\
  \ BI 工具都能让你以统一的方式展示数据。在如何展示数据方面，某些工具比其他工具更好。要盘点部门层面的不同需求，因为有些部门的需求可能与其他部门不同，但该工具需要适用于所有人。\n\
  \n\n\n\n\n- 检查 BI 工具提供的数据准备和清洗级别。这将与你的数据仓库集成，如果任一工具都无法支持你的特定数据 ETL 需求，你就需要独立处理。\n\
  - 如果交互式仪表板和嵌入对你很重要，请询问工具将如何处理这些功能，因为这些不是默认功能。如果你需要深入数据以获得更深入的洞察，你可能无法在某些工具中使用此功能。如果这些功能可用但需要额外付费，请充分了解这些成本。\n\
  - BI 工具允许数据为各种目的共享和导出，因此要了解你有哪些选项可以与团队成员和外部利益相关者共享报告和仪表板。\n- 评估你的 BI 工具将提供的高级分析或\
  \ NLP 功能级别，以便在平台上查询你的数据，特别是对于技术能力较弱的用户。\n- 寻找拥有强大社区的 BI 工具，以便于用户指南、教程以及来自高级用户的定制技巧和窍门。在许多情况下，如果你内部没有技术能力，BI\
  \ 工具没有足够专门的人员来帮助你设置这些工具。\n\n## Growth-hacking tools\n\n实现快速成功不仅是 AI/ML 产品经理的当务之急，也是所有产品经理和企业家的当务之急。弄清楚最好的赚钱方式、提高品牌知名度以及寻找优质线索，这就是增长黑客的全部内容。虽然大多数产品不会一夜之间爆红，但在我们之前部分提到的工具上投资还是有一定方法的。它们都能让你更接近做出当前和未来决策所需的信息，这种决策是基于什么有效以及你的客户真正想要什么而做出的。\n\
  \n你可以将增长黑客视为你的上市策略和团队的一部分，通常它被讨论为帮助扩展和增长产品采用的一套策略。想法是你尝试一套实践和技术，看看它们是否对你的指标和采用率产生早期影响。你通常会尝试一系列策略，看看哪种影响最大，这包括相当大的实验程度。这使你的营销和业务开发团队能够在他们的工作方法上变得富有创造性、战略性和敏捷性，并促使他们跳出思维定式。\n\
  \n增长黑客可以意味着很多事情。有时，它可能涉及使用产品分析来衡量某些策略相对于绩效或参与度的成功程度。其他时候，它可能意味着测试不同的营销渠道、信息或社交媒体策略，以了解哪种信息传递方式最能引起你目标的客户和用户群共鸣。\n\
  \n我们之前讨论了一些广泛的产品类别，它们肯定有助于增长黑客和实现你的 AI/ML 产品成功，但还有很多有价值的工具并不严格属于这些类别：\n\n- 产品如 Expandi\
  \ 允许你使用 LinkedIn 进行社交销售活动。\n- Crystal Knows 使用 AI 制作个性画像，以提供行为和情感洞察。\n\n鉴于运营成本高昂，你会希望确保你的产品能尽快满足市场和客户的需求。请记住，管理\
  \ AI/ML 项目的成本可能很高，但也取决于你为产品构建了多少 AI 功能，特别是如果驱动整个产品的底层逻辑是由 AI/ML 驱动的。你在黑暗中运营的时间越长，你在产品上花费的资源就越多。这意味着你会更晚而不是更早知道它是否与客户产生共鸣。\n\
  \n让我们先从 AI/ML 资源本身的成本开始。根据 WebFX，大多数 AI 顾问的收费在每小时 200 美元至 350 美元之间，而定制 AI 解决方案的成本在\
  \ 6,000 美元到 300,000 美元之间。使用第三方 AI 软件的成本每年在 0 美元到 40,000 美元之间。实际成本会根据人才可用性、声誉和地点而变化，但就目前而言，这些是可靠的大致范围。\n\
  \n围绕顾问构建 AI/ML 原生产品可能很诱人，但这不是最佳实践。一旦出现问题，你将花费大量资金修复甚至是微不足道的问题。如果你想聘请内部人员并避免使用外部帮助，你需要为纽约市的机器学习工程师支付平均\
  \ 160,000 美元以上的年薪。如果你想聘请某人管理机器学习工程师团队，你需要在纽约市支付平均 200,000 美元以上的年薪。\n\n然后，还有 AI 使能技术栈。运行、维护、训练、查询、存储和处理数据和\
  \ AI 系统都伴随着成本。这还不包括我们已经提到的许多增长黑客工具，其价格也各不相同。管理所有各种供应商关系、合同、价格区间和上限，以确保你的使用量不会天文数字般增长，可能还需要额外的人力。管理\
  \ AI/ML 基础设施并使产品团队能够扩展和成长以满足其服务的市场，这是一项昂贵的事业，但这并不意味着它不值得追求！\n\n> 我们在这里不会涉及太多具体细节，因为你的\
  \ AI 策略将在很大程度上决定你为哪些工具、平台、合作伙伴以及招聘哪些角色。你将与关键利益相关者合作，根据你的具体用例和预算决定合适的选项。\n\n## Case\
  \ study\n\n让我们再次回到我们的 Waterbear 案例研究，看看基准测试、绩效、增长黑客和成本如何平衡，以生产其旗舰产品 Akeira。早在此章中，我们查看了一份\
  \ KPI 和价值指标清单。在本节中，我们将扩展其中一些指标，并讨论这些指标是如何被审查、选择和优先排序的。我们还将深入探讨推动组织管理 Akeira 绩效的\
  \ OKR。\n\n### North star metrics\n\nAkeira 的产品管理团队考虑了多个指标作为北极星指标。这些指标包括：\n\n- 参与度指标如\
  \ **daily** 和 **monthly active users**（DAU 和 MAU）\n- 互动指标如使用频率和每个用户的条目数\n- 质量指标如用户满意度和推荐相关性\n\
  - 影响指标如自我报告的结果\n\n但最终，他们选择了一个与公司使命和价值观高度一致的指标作为其北极星指标：**monthly mental health improvement\
  \ index (MMHII)**。这也与其产品策略一致，即让 Akeira 的体验以产品为导向。对于 Akeira 来说，这意味着收集基于产品在功能上如何改善用户生活的在应用内反馈。\n\
  \nWaterbear 的创始人希望选择一个可以基于此做出产品决策的北极星指标，他们成立公司的明确目的就是改善用户生活。他们在选择北极星指标时体现了这一点，该指标围绕个人\
  \ MMHII 以及集体 MMHII 展开。\n\n这一选择在战略上也是有意义的，因为它将应用内体验与结果和福祉区分开来。所有科技公司都希望基于用户偏好和行为打造世界级的应用体验，让用户不断回访。但如果应用体验很棒却不能在功能上改善用户生活，这意味着什么？选择\
  \ MMHII 意味着他们优先考虑经过验证的结果而非应用内体验。这样做也意味着他们可以将内部决策和外部沟通围绕经过验证的心理健康结果进行对齐，这与他们的客户和用户群高度共鸣。他们通过这样做直接与社区对话。\n\
  \n### KPIs\n\n其他被重点跟踪的 KPI 是用户参与度、用户互动、质量、影响和留存指标。这些指标能够将产品体验拆分为各个领域以评估绩效和成功，并有助于在产品在某一领域出现危险时提供早期信号。这些领域也都遵循北极星指标的定位。如果用户没有参与产品并且不定期与之互动，鉴于影响我们心理健康的反馈循环的性质，他们不会在心理健康方面看到积极的结果。\n\
  \n如果他们在应用中互动的质量不高，他们的参与度将受到影响。如果他们的心理健康改善的影响无法在各个领域量化并定义，我们就不能声称以有意义的方式积极影响他们的 MMHII。最后，如果用户无法留存，这也意味着他们的心理健康得不到服务。这里的关键词是“服务”。如果你的\
  \ KPI 不服务于你的北极星指标，它们只会代表表面上的成功，应该被视为虚荣指标。虚荣指标可能会欺骗不成熟的投资者并带来短期成功，但它们不是可持续增长的策略。\n\
  \n\n\n\n\n以下是本章中从产品角度看到的已建立的 Akeira KPI 概览：\n\n- **用户参与度指标：** 参与度指标使产品团队能够证明 Akeira\
  \ 是以产品为核心的，因为它们建立了用户返回平台进行会话的行为模式。稳步增长表明 onboarding 有效，并且用户在应用中找到了持续的价值。更长的会话表明用户认为内容和功能具有吸引力。使用频率有助于\
  \ Akeira 产品团队细分不同类型的用户，并为不同年龄和背景的用户打造更个性化的体验。以下是该类别的一些指标：\n  - **DAU/MAU：** 每日/每月使用\
  \ Akeira 写日记的唯一用户数量\n  - **会话时长：** 每个唯一用户每次会话在应用中花费的平均时间\n  - **使用频率：** 随着时间的推移他们多久返回应用一次（每日、每周、每月）\n\
  \n- **用户互动指标：** 用户互动指标帮助产品团队证明产品的有效性。他们将这些用户与提交支持工单的用户进行交叉比对，以确认应用直观地引导大多数用户、留住用户，并通过留存率证明了有机增长。跟踪条目数量有助于确认应用帮助用户养成写日记的习惯，从而服务于北极星指标，而条目的平均长度则体现了用户与\
  \ Akeira 建立联系的深度。以下是该类别的关键指标：\n  - **条目数量：** 每个 Akeira 用户创建的日记条目数量\n  - **条目平均长度：**\
  \ 每个 Akeira 用户每个日记条目的平均字数和字符数\n  - **留存率：** 随着时间的推移继续使用 Akeira 的用户百分比（每日、每周、每月）\n\
  \  - **支持工单频率：** 活跃用户开具的支持工单数量\n\n- **互动质量指标：** 互动质量指标主要围绕证明为 Akeira 提供动力的机器学习模型的有效性，尤其是自然语言处理模型和为建议提供动力的推荐引擎。这些指标也有助于确认用户对\
  \ Akeira AI 能力的信任。高用户满意度指标意味着应用具有推荐潜力，增加用户向朋友推荐 Akeira 的可能性，这也促进了有机增长。该类别中的关键指标包括：\n\
  \  - **用户满意度：** 基于应用内调查构建，用于衡量用户满意度以及每个用户向朋友推荐 Akeira 的可能性。\n\n- **NLP 分析准确性：**\
  \ 这些指标建立在 Akeira 底层 NLP 的奖励系统之上。它们衡量 Akeira 在每个用户处进行情感分析、主题提取和实体识别的准确性。\n- **建议相关性：**\
  \ 这些指标评估 Akeira 在用户反思时提供的建议或提示的性能。\n- **影响指标：** 影响指标名称恰如其分，因为它们对 MMHII 产生了最大影响，而\
  \ MMHII 有助于 Akeira 实现其向用户承诺的目标。这是因为证明用户转变对于证明有意义的改善至关重要。自我报告的结果还为量化指标如 MMHII 提供了定性数据，其中大部分被整理和分析用于构建引人注目的营销故事和信息。让我们看看重要的影响指标：\n\
  \  - **已建立的行为变化：** 这些指标捕捉了基于日记条目分析，随着时间的推移用户在行为、态度或情绪上的变化。它们得到了用户的强化和确认。\n  - **自我报告结果：**\
  \ 在上述指标的确认过程中，用户被要求提供开放式反馈，以进一步了解写日记对其福祉、自我意识和个人成长的感知影响。\n  - **目标达成：** 尽管 Akeira\
  \ 试图自行推荐和注意到目标，但这些目标由用户确认。一旦确认，Akeira 会根据日记提示证明实现这些目标的进展，并在目标达成后与用户一起庆祝这些成就。\n-\
  \ **留存指标：** 留存指标帮助 Akeira 产品团队了解导致客户离开平台的功能或挑战是什么，以便他们能够专注于为其他客户最大程度地减少这些挑战。来自客户的直接反馈使团队能够解决用户期望可能超过应用功能的问题。一些关键的留存指标是：\n\
  \  - **流失率：** 在特定时期内（周、月）停止使用 Akeira 的用户百分比。\n  - **流失原因：** 为了最好地为产品改进和留存策略提供信息，Akeira\
  \ 向希望提供反馈以帮助改善应用体验的人提供了调查。\n\n## OKRs\n\n接下来，让我们看看 Akeira 的 OKRs：\n\n- 目标：改善心理健康结果\n\
  \n这与 Akeira 的北极星指标保持一致，后者再次反映了 Waterbear 将其产品战略与其为衡量产品成功而设定的目标保持一致。通过将最高 OKR 聚焦于\
  \ MMHII，并将心理健康改善与自我报告的情绪、焦虑、抑郁和睡眠质量进行对照，他们将重点放在了应用创建的目的上。这也是 Waterbear 集中其营销工作的领域，无论是博客文章、深度解析、炉边谈话还是白皮书。通过定义心理健康结果以及成功是什么样的并分享出来，他们确保其产品战略以其价值观为先导。以下是与此目标相关的关键结果：\n\
  \n- KR1：在一年内将每个用户的平均 MMHII 提高 30%。\n- KR2：在未来六个月内将报告情绪改善的用户比例提高 25%。\n- KR3：在一年内实现用户自我报告的焦虑和抑郁症状减少\
  \ 15%。\n- KR4：在未来九个月内将报告睡眠质量改善的用户比例提高 30%。\n\n- 目标：增强对话有效性\n\n此 OKR 专注于为应用体验提供动力的技术。这里，完成率指的是用户互动中成功“完成”的互动，而不会因为用户觉得不值得而放弃讨论。会话式\
  \ AI 应用管理起来可能很棘手，即使它们有效，也难以保留用户互动。通过将对话有效性置于第二优先级别，Waterbear 向用户和内部利益相关者传达了一个强有力的信息：如果产品无效，如果为其提供动力的底层技术没有随着时间的推移而改进，我们就不配维持该产品。以下是预期的关键结果：\n\
  \n- KR1：在未来两个季度内将完成率提高到 70%。\n- KR2：始终保持用户满意度评分在 4 分（满分 5 分）或以上。\n- KR3：到年底将平均问题解决时间减少到\
  \ 1 分钟以内。\n\n### 目标：提高用户参与度\n\n最后，第三个 OKR 是你可能会在许多传统软件应用中看到的典型例子：确保用户参与并持续返回。通过将其作为第三个\
  \ OKR，公司向内部和外部所有人发出信号，表明应用参与度是次于已证实的心理健康结果和增强技术有效性的。我们经常看到科技公司通过在应用创建的初衷成果之前优先考虑应用内用户参与度来蚕食自己的成功。这为虚荣指标的建立提供了肥沃的土壤。鉴于即使领导层保持一致，塑造公司文化也很困难，一个组织很难从文化上恢复过来。关键结果是：\n\
  \n- KR1：在未来一个季度内将 DAU 提高 20%。\n- KR2：到年底将平均会话时长提高 15%。\n- KR3：在 Akeira 使用的第一个月内实现\
  \ 40% 的用户留存率。\n\n## Growth hacking\n\n在早期的案例研究部分，我们讨论了 Waterbear 在扩大产品规模之前专注于 beta\
  \ 用户和测试者。在本节中，我们将讨论这一时期在实践中是什么样的，因为这是 Akeira 最关注增长黑客的时期。在用一小群朋友、同事和为使用技术解决影响全球的心理健康危机这一使命而注册的\
  \ beta 测试者测试产品后，Waterbear 开始着手用更广泛的受众测试假设和信息，以了解什么最能引起共鸣。\n\n他们希望推动有机增长，因此他们通过专注于激励推荐计划开始了增长黑客之旅，该计划为加入的朋友的朋友提供相当大的折扣。Waterbear\
  \ 对各种功能、慈善捐赠和加入成本削减进行了大量的 A/B 测试，以了解什么最能引起该用户群的共鸣。通过利用社会认同，他们能够围绕应用的有效性建立声誉。由于市场上没有太多类似的应用，而现有的应用只能处理\
  \ Akeira 某些能力而不是全套功能，社会认同取得了成效。\n\n其社会认同策略的一部分建立在社交媒体参与度之上。通过鼓励用户在 TikTok、Reddit\
  \ 和 Instagram 上分享他们的故事，尤其是在早期，他们能够围绕应用的有效性和成功建立一个社区。这在他们的小而强大的社区中建立了大量信任，增长来自有机方式。基于社会影响，他们还在社交媒体上创建了一个趋势，用户在其中分享他们最喜欢\
  \ Akeira 的地方，进一步人格化了应用体验。这为 Akeira 赋予了品牌身份和个性，对当前和未来的 Akeira 用户而言，这本身就成为 Waterbear\
  \ 的吉祥物。\n\n\n\n\n\n这种社区影响力通过与那些同样围绕心理健康和“利用技术服务于人类整体成长，而非让人服务于技术”这一理念建立个人品牌的影响者合作而进一步扩大，也引起了广泛关注。这对Akeira的产品经理团队来说始料未及，但它掀起了一波影响者和社交媒体用户对科技公司的批评浪潮，批评那些没有服务于其所宣称市场的科技公司。基于真实和透明来培育社区，是Waterbear增长黑客武器库中迄今最强大的工具。它还让用户得以发现使用Akeira的新方式，并将反馈分享给其产品经理团队。\n\
  \n请记住，增长黑客不仅仅是为了获取更多用户，甚至也不只是为了赚更多钱。它关乎建立一个可持续性和增长的反馈循环，帮助公司实现规模化。在Akeira的案例中，增长黑客确实带来了更高的用户参与度和销量。但同时也带来了另一个灵感源泉：有价值的用户反馈，使应用体验提升了十倍。\n\
  \n## 总结\n\n在本章中，我们重点关注了AI/ML产品的跟踪、营销、推广和销售。我们涵盖了AI产品经理可以使用指标和KPI来基准测试和跟踪产品及其成功的各种方式，以及这对更大范围的组织和产品在用户群体中成功采用意味着什么。我们还将这些基准测试置于总体的产品战略和愿景背景下，这些战略和愿景决定了什么该被跟踪和衡量。所有这些活动帮助产品经理获得内部信号，以了解他们构建的产品是否对活跃客户和用户有效。\n\
  \n然后，我们讨论了如何利用增长技术栈中直接连接用户体验的各种工具，来获取关于什么有效、什么无效的外部信号这一更重要的工作。我们回顾了增长黑客的要素。无论你是想优化如何获取、吸引还是留住客户，你都必须找到一种方法来收集数据、分析数据，并据此做出关于如何添加、删除或改进功能的真实决策。组织日益数据导向和数据驱动的总体长期趋势，已成为在软件世界创造新文化的巨大影响力驱动力。\n\
  \n客户越来越追求一种体验，这种体验不仅感觉直观和自然，而且一再向他们强化：他们来对了地方，他们正在交互的产品就是适合他们的工具。他们不想与真人客服交谈，甚至不一定想要营销人员推销给他们的东西。他们希望直接与产品交互，通过自己的探索来看到其内在价值是否显而易见。这与过去产品的构建和销售方式相比是一个巨大的转变，这意味着我们作为AI产品经理的责任是提供一种与客户希望被对待的方式相一致的体验。\n\
  \n## 加入我们的Discord\n\n与其他用户、AI专家和作者本人一起阅读本书。\n\n提出问题、为其他读者提供解决方案、通过“问我任何事”环节与作者交流，以及更多精彩内容。\n\
  \n扫描二维码或访问链接加入社区。\n\nhttps://packt.link/aipm\n\n![](img/a0c9f9a2ba06a06d309ce21d890a47c6_278_0.png)\n"
- '# 11. 管理AI原生产品


  在第6章中，我们讨论了AI原生产品开发周期的不同阶段、将为你的AI原生产品提供动力的梦之队，以及你如何定位和销售该产品。我们还在第8章中涵盖了产品愿景、战略和路线图的建立。在本章中，我们将扩展其中一些概念，以更好地理解产品发布后的管理生命周期是什么样的。管理AI原生产品本身就是一门学科，也正是让产品经理工作充满挑战的地方。从零开始构建并进入一个市场是一回事，在此之后维护和管理产品则是另一回事。


  通常情况下，当产品经理具有工程背景时，招聘经理和 recruiter 会松一口气，因为他们觉得这意味着产品经理能更好地同理心理解支持其产品的开发团队。虽然这很好，而且对于更偏技术的产品经理角色确实有帮助，但这只是故事的一小部分。在组建团队时，尤其是作为AI产品经理，我强烈建议你寻找那些能展示技术之外优势的候选人。


  理解支撑产品选择的战略要素——从领导层到内部部门反馈，再到市场的无形之手——比你的技术能力更重要。与同事建立信任，那些你将依赖他们来执行你共同建立的路线图、战略和待办事项的人，也比你的技术能力更重要。很可能，如果你在管理一个AI产品，你对AI概念的技术理解已经相当扎实。如果你要和一支机器学习工程师团队合作，你需要理解各种模型及其工作原理。但当你踏上管理AI产品的旅程时，你会不断发现这些技能是次要的，而非首要的。


  有些人可能会对这一说法感到惊讶。他们可能认为作为产品经理，他们的工作很大一部分涉及解决技术问题、理解技术债或工作范围。这没错；你的很多工作确实会集中在这方面。但如果你的产品经理工作主要投入在这些领域，而忽视了我们将要讨论的其他方面，那你实际上是在把自己降级为DevOps角色，而不是真正的产品经理角色。产品经理的核心技能是沟通、市场研究、用户研究、战略思维、分析能力、领导力、客户参与和协作能力。


  我们将在以下部分探讨这些技能如何体现在产品经理工作的各个方面：


  -   头脑——管理对齐

  -   内心——管理人员与价值观

  -   胆识——管理其他一切


  ### 头脑——管理对齐


  定义产品愿景、战略和路线图都是创建对齐工作的一部分。在第8章中，我们讨论了将你的产品愿景和战略与领导团队的愿景和战略相结合的概念。这是因为你建立的对齐需要反映公司的对齐。产品对齐对AI原生产品很重要，因为AI技术是价值交付的核心。AI产品需要为客户解决正确的问题，而且它们高度跨职能。这意味着所有参与开发和战略的团队都需要确保他们朝着相同的以客户为中心的目标努力。


  如果不能做到这一点，开发AI系统这种资源密集型的过程就会变得低效，意味着大量时间、金钱和脑力的浪费。我们不是在真空中工作。公司招聘新人才时在职业页面列出核心价值观是有原因的。公开呈现的内容需要反映更大结构的利益、价值观和信念。必须有一种方式来让自己脱颖而出，同时也能辨别组内的新人。在本节中，我们将扩展第8章中涵盖的一些原则，并看看它们在实践中是如何运用的。


  ### 愿景


  所有组织无论是否意识到，都会在内部和外部放大某些价值观。如果你知道如何去观察，这些价值观就隐含在公司的品牌、信息传递和各种沟通中。一些公司比另一些公司更擅长以与其愿景和价值观相协调的方式来精心打造这些沟通。但无论他们是否擅长，这个过程都在后台发生。当你加入一家公司并处于管理产品的工作流程中时，情况依然如此。甚至可以说，当你作为公司的AI产品经理时，这一点变得更加突出，因为你的一项主要任务是为一个充满固有复杂性、伦理考量和长期关注的过程带来清晰度和安心感。


  许多公司的汇报结构和角色定义各不相同，但无论你的公司如何看待（以及如何薪酬对待）你，AI产品经理始终是一个愿景家。你必须如此！愿景家能在别人看不到的地方发现潜力和机会，而AI产品肩负着沉重的愿景思考负担，因为你经常要驾驭新兴技术、复杂环境，以及常常是未知的用户体验。因为这些产品是AI原生的，所以很难预测用户将如何与AI/ML互动。使用你初出茅庐的产品会出现哪些新的痛点或好处？随着你的产品或其采用的技术成熟，用户需求可能会如何演变？






  - 新数据或改进的算法将如何提升你的 AI 产品？

  - 你的产品将如何学习和适应？

  - 你的产品的目标受众是谁？

  - 你的产品如何通过 ML 增强他们的工作流程、决策或体验？

  - 你的产品是否解决了他们当前痛点，并通过预测分析或个性化洞察预见未来需求？

  - 你的用户将如何变化和发展？

  - 你的 AI 产品如何通过适应用户行为或偏好的变化而随之演进？

  - 你的产品是否与整体公司使命/愿景保持一致并做出贡献？

  - 你的产品是否支持公司战略目标，如扩展运营、提高效率或推动创新？

  - 你的 AI 产品是否合乎道德？合乎良心？

  - 你的产品如何尊重隐私、避免偏见，或遵循公平和透明的标准？

  - 这些对你的品牌和公司使命重要吗？

  - 你的产品是否通过保持合乎道德的 AI 实践并确保可解释性，来培养用户之间的信任和忠诚度？


  一旦你对产品有了清晰的愿景，你就需要量化它是否被有效传达和执行：


  - 你能否自信地说其他利益相关者理解你 AI 产品的愿景以及它如何利用 AI/ML？

  - 你是否收集了利益相关者的反馈并将其观点纳入你的 AI 产品愿景？

  - 你所制定的指标、KPI 和 OKR 是否反映了产品愿景的成功？

  - 你的领导团队是否认同产品愿景，特别是在 AI 能够带来的长期战略价值方面？

  - 你公司里的每个人是否都理解你的产品为何存在于市场中，其在 AI 能力方面的竞争优势是什么，以及它将如何提升用户体验？

  - 你的产品在方法上有什么特别之处？

  - 是否有专有算法、高级数据处理或专门的 AI 功能使你与众不同？

  - 你的产品在 AI 性能、准确性、可扩展性或创新性方面与竞争对手相比如何？

  - 你的产品愿景是否解决了市场上尚未被任何竞争对手服务的空白，特别是在 AI 用于解决问题的方式上？

  - 你的产品愿景是否能让用户及其数据保持安全？

  - 已采取了哪些防护措施来保护用户及其隐私？

  - 是否有里程碑和交付成果来指导产品的开发，确保与你已制定的产品愿景保持一致？


  我们不会因为在 LinkedIn 上读到某篇观点文章觉得听起来不错，就为我们的产品建立清晰的愿景。我们这样做是为了从强势地位运作。执行并不容易。你必须基于坚实的战略制定计划，因为在执行过程中总会出现各种问题。从强有力的愿景中建立基础是一种防止这些问题让你偏离轨道的方式，以确保你的工作可衡量、合乎道德，并与公司的目标和市场需求保持一致。


  ## Communication


  阅读上一节内容可能会让一些人产生强烈共鸣。对其他人来说，它听起来像抽象和胡言乱语。但事实并非如此。AI PM 需要能够在已知与未知的模糊灰色地带中导航，尤其是在快速发展的
  AI/ML 领域。他们必须围绕 AI 的潜力和局限性建立战略和直觉，并不断向利益相关者、团队和终端用户社区传达这些概念。


  AI PM 存在的理由是有原因的。你需要构建机器学习模型和解决 AI 特定问题的技能集，与你需要将产品从愿景到部署进行管理的技能集是不同的。AI PM 的角色是将复杂的
  AI 世界转化为产品路线图；是在技术可能性与业务目标和用户需求之间取得平衡。归根结底，AI PM 的工作涉及大量的沟通。无论是向非技术利益相关者解释 AI 能力与优势，还是让工程师与以用户为中心的结果保持一致，或是确保
  AI 产品以合乎道德和负责任的方式构建，你的工作几乎触及公司方方面面。人们注意力短暂。他们有自己的工作要专注！这意味着你需要持续强化想法和概念，不断传达你所定义的愿景，并定期向所有利益相关者提供更新。沟通不仅仅意味着在与利益相关者的会议中发言，尽管其中也有很多。


  你通过多种渠道进行沟通：产品文档、博客文章、思想文章、白皮书、用户故事和更新日志。你的日历是你优先事项的一种沟通方式。你会定期与终端用户和客户直接或间接沟通。你会定期与领导团队沟通，以确保任何对
  AI 产品战略和愿景的威胁或风险都得到讨论。你的产品营销工作向潜在客户传达产品的价值和可行性。你最终确定的路线图传达了哪些功能和能力会被纳入产品，哪些不会。这些决策传达了你
  AI 产品的战略和愿景。


  沟通是关键！作为 AI PM，你需要确保自己意识到你的想法、观点、言语和行动如何服务于你的产品沟通。这也是与你将定期沟通的所有相关利益相关者建立信任的一种方式。


  ## Safety


  培养心理安全文化对于任何协作工作环境都很重要。我们很多时候与同事相处的时间比与家人还多，因此与我们信任并感到安全的人一起工作对所有员工都至关重要。AI PM 的角色是从各方收集输入，并以最好服务于其产品的方式消化它们。但这些反馈的质量如何？如果我们的利益相关者、合作者和团队成员不感到舒适地分享真实想法、提问、表达有争议的意见，或在不担心他人反应如何的情况下提出担忧，反馈就不会很有用。它也会疏远你需要建立信任并良好合作的人。有效的
  AI PM 深知这一点，并帮助创造一种基于尊重、包容、协作、沟通和信任的文化。


  说起来容易做起来难。PM 中可能产生一种自负，尤其现在 AI 达到举足轻重的影响力。这种自负可能因多种原因而产生。由于角色包罗万象，平衡众多观点、会议和资源带来的累积效应可能导致一种精神环境，让你感到不堪重负和不受重视。一些
  PM 可能会对他人产生怨恨或优越感，导致信任和安全感的恶性循环。


  请记住，作为 AI PM，你很可能会吸收利益相关者在你收集反馈时表达的任何批评、分歧和怨恨。事情不会总是完美。有时我们会失望，因为我们非常想要的功能没有进入产品，或做出了不利于我们的决定，无论我们是
  AI PM 还是关键利益相关者。无论是销售人员真的需要某个功能来让其最大客户购买，还是机器学习工程师不同意其同事做出的建模决策，他们通常会首先找 AI PM。随着时间的推移，这些因素带来的认知负荷会累积。


  我们的首要任务始终应该是我们自己，因为如果我们自己不先感受到安全和赋权，就无法创造安全和赋权的文化。我敦促所有 AI PM 建立强大的自我关怀实践。你会一次又一次地对他人产生共情。吸收太多会让你感到枯竭。吸收太少会让你难以与你依赖来构建和发布产品的人建立真实的关系。你处于一个庞大生态系统的核心，你的健康会辐射到该生态系统中。


  当我们觉得某些人比其他人更值得或更有能力时，谦逊就无法存在。它来自于理解每个人都基于自己的技能和投入，在共同创造伟大事物中发挥作用。作为 AI PM，你必须平衡许多不同的技能和知识才能有效履行你的角色。但在很大程度上，真正“做工作”的主要是其他人。机器学习和开发方面的同事将进行开发工作来构建和发布你的产品。营销和销售方面的同事将基于你的协作来传达你的产品。你的领导层在参加会议时将宣传你的产品。没有人能独自完成任何事。你需要他们，他们也需要你！






  ## 3. 错误分析


  在将它们对齐后，我们分析了翻译模型产生的语义错误，因为这些类型的错误对翻译质量至关重要。


  从错误分析中可以观察到，语义错误（涉及语义、话语和语用层面）是最普遍且持续存在的。


  我们分析了每个存在语义错误的句子，并根据 MTS 错误（Vilar 等人，2006 年）——一种著名的机器翻译错误分类法——对其进行分类。具体来说，对于每个句子，我们首先在词、短语和句子层面检测并归类语义错误。


  | 错误类型 | 示例 | 分析 |

  | --- | --- | --- |

  | 语义（缺词） | 英文：A 65-year-old woman ... | 缺少了……这个词 |

  | 话语（搭配） | 英文：... get 2 silver medals... | 用词不当…… |

  | 语用（多余词） | 英文：The police are still looking for... | 插入了多余的词…… |


  图3：基于 MTS 分类法的语义错误示例。


  以下是一些相关问题：


  - 在评估或优先处理 AI 功能时，你是否采用任何评分方法？

  - 你是否向利益相关者传达了用于对产品待办事项、路线图或史诗进行优先级排序的方法？

  - 在评估功能优先级时，你是否考虑其伦理影响和潜在偏见？


  ### 建模


  获得对你正在帮助创建的文化认同的最好方法，是首先亲自示范。当你与利益相关者开会时，你为这些会议的进行方式设定了标准。如果你正在主持一个定期会议、研讨会或头脑风暴会议，想办法体现实验精神、好奇心和对你产品的承诺。即使只是承认自己犯了一个错误或做了一个假设这样简单的事情，也能产生深远的影响。这表明即使你有时错了，你仍然是有能力且受尊敬的。为了成为一名有效的
  AI 产品经理，你必须成为组织可信的事实来源。如果你不身体力行，就无法培养可信度。


  以下是一些相关问题：


  - 你是否觉得自己与为产品团队设定的文化目标保持一致？

  - 你是否体现了你要求他人具备的价值观和优势？

  - 你上一次毫无羞愧地公开承认错误是什么时候？


  ### 认可


  作为 AI 产品经理，你能够以广阔的视角看到对产品影响最大的贡献者。随着你允许更多观点影响产品，你自然会开始看到人们展现出奉献精神、一致性和成就。这是一个利用你的有利位置来认可这些贡献的机会。这会让人们感到被欣赏，并帮助他人认同你试图创造的文化。仅仅说你提倡协作的工作文化，并不等同于体现这种协作精神并认可他人的协作精神。这也有助于强化你说到做到、言行一致的观念，而这种观念通常供不应求。要适时地这样做。当你的同事的贡献对你的
  AI 项目产生影响时，要认可并庆祝他们。


  以下是一些相关问题：


  - 你还记得上一次公开认可某人对 AI 项目或功能的贡献是什么时候吗？

  - 你还记得上一次你的工作得到认可是什么时候，以及它如何影响了你的动力吗？

  - 你能将认可融入定期的团队会议或沟通中，以强化欣赏和感恩的文化吗？


  以下是一些相关问题：


  - 在您的定期会议中，利益相关者是否愿意表达道德或安全问题？

  - 您的组织如何促进关于 AI 产品开发中的道德、数据隐私和算法偏见的公开讨论？

  - 公司是否鼓励员工提升技能或接受 AI 培训，以及其他促进数据和 AI 素养的努力？


  ### 创新


  一旦你进入日常例行工作，可重复序列的惯性就会产生。对于面临紧迫截止日期或忙于各种里程碑的组织来说，摆脱这种惯性可能很困难。这样做可能很诱人。没有什么比清单更能让人感到自己有用且有能力。但通常，我们会在努力让自己感觉有用的过程中陷入制造紧迫感和稀缺感的陷阱。试着在你的组织中为实验创造空间，让它蓬勃发展。也许你可以召集一小群人，或鼓励他们花费
  10% 的工作时间探索新想法。或者你可以设立一个 AI 创新实验室，将其作为每月一天的活动，让研究、AI、数据和产品团队能够合作开发创新的新产品。考虑通过为团队建立专门的时间来集思广益和开发新想法，从而培养创新文化。我们在
  AI 采用方面仍处于早期阶段，优先考虑这一点的组织将获益良多。这样做将有助于促进好奇心文化，这将使你的组织能够构想出原本不会存在的新的可能性。


  以下是一些相关问题：


  - 你和你的团队上一次感到有足够的思维空间和自由，进行真正打破常规、聚焦于 AI 创新的头脑风暴会议是什么时候？

  - 你的领导团队是否将创新视为对公司未来的值得的投资？

  - 在 AI 产品开发周期中，新想法和实验是如何被确定优先级的？

  - 有哪些结构来确保头脑风暴会议中产生的创新想法被捕获并有效执行？


  ### 边界


  在 AI 的世界里，总有新奇有趣的东西可以阅读或发现。你可能需要夜以继日地工作。但促进积极的工作文化必须是产品经理的优先事项。你不应该在非工作时间发送通讯，也不应该在假期工作。我们要以身作则；这样做会向同事和利益相关者传达一种信息：这种行为是可以接受的，他们也应该这样做。倦怠很难恢复，作为
  AI 产品经理，你应该不惜一切代价避免倦怠。我们不是机器；我们是有生命的生物，如果要承担具有挑战性的角色，就需要休息和明确的边界。如果你不能为自己设定边界并滋养自己的健康，你就无法对任何人有效。这样做会向他人发出一个有力的信息：他们也应该这样做。组织将从充满活力、敬业的员工队伍中获益十倍。


  以下是一些相关问题：


  - 你是否感到责任压得喘不过气，还是它们是兴奋和动力的来源？

  - 你的职业道德是否让他人感到被支持，并鼓励他们维护自己的边界？

  - 你用什么策略来断开连接并充电？


  在一个优先考虑并投资于员工的组织中工作是令人充满力量的。我们都应该寻求为那些重视并示范这种行为的组织工作，因为正是这些组织受益于敬业、专注的员工队伍。当人们感到被赋权时，他们会感到自己强大而勇敢。这给了他们以爱和无畏向前推进的能量。


  ## 核心部分——管理其余事项


  在 AI 产品经理的世界里，管理“其余事项”包括了应对技术和市场需求不可预测性所需的韧性和适应性。应对随时出现的挑战，主动识别影响产品成功的风险和机会，以及管理
  AI 产品的日常功能运营，是一项沉重的负担。AI 产品经理经常需要利用数据来指导决策，根据用户反馈快速迭代，并时刻关注行业趋势和竞争对手动态以保持效率。培养实验心态并接纳错误，是管理
  AI 产品时实现创新和可持续性的垫脚石。正如机器从过去的错误中学习，我们也一样。培养韧性和适应性的直觉，将有助于管理 AI 产品的复杂性，使团队在长期内保持一致和动力。让我们回顾一下在
  AI 产品经理工作中将管理的各个领域，这将帮助我们以自信和创造力应对挑战：


  - **数据：** 所有 AI 产品都需要有效的数据管理策略才能正常运行。理解与数据收集、清洗、预处理、抓取和隐私相关的要素，将确保你有效管理 AI 产品中的数据方面。数据管理问题最终会影响数据质量，重大问题会使你的
  AI 系统变得无用。不当的数据管理和维护还可能让你面临法律风险，尤其是如果你不遵守数据隐私法规。随着时间的推移，我们可能会看到更多的数据隐私法规和立法，因此请确保你优先处理这项工作。


  以下是一些相关问题：


  - 你如何确保 AI 产品整个生命周期中的数据质量、完整性和治理？

  - 你是否审查了适用于你的 AI 产品的所有相关数据隐私、收集和处理法规？

  - 你会自豪地公开谈论你的数据管理实践吗？

  - 你采用什么策略来监控和改进你的数据管理实践？






  - 你是否建立了涵盖 AI 模型中偏见和公平性考量的伦理数据使用框架？

  - 是否有流程来纳入数据科学家和机器学习工程师关于数据管理挑战/机会的反馈？


  ## Centralize

  管理 AI 系统时由于 AI 开发的跨职能性质，大量沟通是异步进行的，因此拥有一个中央存储库供人们找到协作和沟通的方式非常棒。像 Confluence、Notion、Jira、Trello
  和 Asana 这样的工具都充当知识库或人们聚集在一起提问的场所，涉及跟踪 AI/ML 模型开发、管理数据管道进度和用户研究洞察等特定领域。它们还传达了在何时正在进行哪些产品领域的工作。这最具挑战性的部分是让人们持续使用并依赖它们，但一旦他们这样做，你就减少了对同步面对面更新的需求。这也意味着当你确实同步会面时，你能最大化利用时间进行更实质性、更深入和更具战略性的对话。


  以下是一些相关问题：


  - AI/ML 和数据科学团队是否在你们的集中化工具中有效地记录模型实验、指标和决策？

  - 你如何确保 AI、数据和产品团队之间的沟通失误降到最低，尤其是在尝试新模型或数据集时？

  - 是否有你们投资的工具是团队不喜欢或不愿使用的？

  - 你们使用的工具能否帮助自动化例行沟通，如提醒或任务更新，以减少团队的手工工作？


  ## Training

  人们往往不使用某些工具或不遵守某些实践，因为他们没有得到适当的培训。不是每个人都会对采用新工具或学习新方法感到兴奋。惯性是真实存在的，大多数人希望尽可能简化工作。学习新事物往往会阻碍这一点，因此鼓励你的团队和周围的利益相关者参加培训课程，以更好地理解
  PM 流程和工具。培训也是让各团队了解新趋势、AI 最佳实践或最近进入市场的全新 AI 工具的好方法。


  以下是一些相关问题：


  - 你是否有办法衡量人们对某些工具的兴趣或满意度，特别是那些具有 AI 功能的工具？

  - 当前技术栈中是否有任何工具使用起来过于困难、耗时或繁琐？

  - 非技术利益相关者是否接受关于数据科学、伦理、偏见检测、公平性和模型解释的 AI 概念培训，以弥合任何差距？


  这正是公司起步的基础部分；创始人知道他们想在心理和心理健康背景下使用 AI。公司的使命很简单：“在 AI 的帮助下，认识自己。” 这经常是他们营销活动和路演演示的一部分。他们想要一些能引起深感不安人群共鸣的东西，尤其是面临工作与个人生活平衡挑战的女性。这在女性权利受到审视、社会中女性在没有完全身体自主权的情况下承受越来越多压力的背景下尤其相关。出于这个原因，Waterbear
  制定了以下产品愿景声明，将其 AI 产品围绕其展开：“Waterbear 使用 AI 来赋能全球个人，提供洞察以解锁更深层次的自我理解和个人成长。”


  Waterbear 希望其产品愿景声明的重点强调赋能个人，以传达一种能动性和个人力量的感觉，以及他们希望解决的问题的全球性质。突出洞察和更深层次的自我探索反映了产品的核心目的，即以自我驱动的方式激发重大的个人启示。声明中的愿景部分源于对个人成长的关注，而个人成长是一段永不真正结束且对每个人而言可能不同的旅程。它也简洁、清晰，易于在各渠道记忆和传达。


  这种影响，加上疫情带来的心理健康危机，创造了一个环境，让 Waterbear 的创始人准备全力投入其产品愿景，并开始为其旗舰产品 Akeira 组建团队。Akeira
  的创始产品团队希望专注于 AI 产品经理角色的核心能力：AI 素养、沟通、市场研究、用户研究、战略思维、分析、领导力、客户参与和协作。秉持这种精神，他们做的第一件事之一是进行用户研究试验，并开始寻找可以开始合作的治疗师。一旦组建了这个团队，他们就开始了迭代的试错工作，以发现哪些因素的组合能为用户带来最佳的产品体验。


  该产品（Akeira）与公司的愿景和使命保持一致。它帮助女性 specifically 认识自己，并赋能她们更快实现目标。Waterbear 知道这只是开始，因此目标是吸引更多用户群体，并最终为他们提供自己的
  AI 连接。他们知道他们希望从 Akeira 的经验中学习，并将其带到一个可以推出他们引以为傲的 MVP 与其 Beta 用户分享的地步。一旦完成，他们知道他们的产品团队和整个组织将投入奉献来服务忠实的客户群。发布后，一段美丽的发现之旅开始了。


  以下是创始产品团队在开始这段旅程时最重大的行动清单，以及它们的影响：


  ### The head – managing alignment


