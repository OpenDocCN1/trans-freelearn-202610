  '
- "# 一个优秀的 AI 产品经理意味着什么？\n\n在上一章中，我们初步了解了入门 AI 产品经理岗位所需的内容。我们讨论了人们如何进入 AI 产品经理角色、需要培养哪些技能才能被考虑担任该角色，以及在首次担任\
  \ AI 产品经理岗位时最终取得成功的原因。在本章中，我们将扩展这些概念，并进一步探讨构建 AI 产品经理职业长期发展的坚实基础所需的内容。\n\n我们将用本章的大部分篇幅讨论\
  \ AI 产品经理如何才能有效。AI 产品经理是一个多样的职位族，我们将回顾其众多方面，帮助你更好地理解角色中哪些部分你可能最喜欢，以及哪些部分你可能需要努力发展。我们还将探讨不同的人基于其以往经验在该角色中会面临的不同挑战，以及所有\
  \ AI 产品经理如何为持续成长奠定职业基础。\n\n由于 AI 产品经理角色的特殊性，除了我们在前几章讨论过的技术能力、舒适度和专业知识之外，还有更多细微之处需要深入探讨。如果您还记得，在上一章中，我们强调了\
  \ AI 产品经理需要证明其在五个方面的能力：技术熟练度、商业敏锐度、沟通能力、领导力和解决问题的能力。我们将在本章中在此基础上进一步发展，强化在中级职业阶段展示这些能力的表现。随着章节的推进，我们将涵盖以下内容：\n\
  \n- AI 产品经理需要扮演的各种角色相关的实际压力和期望\n- 核心能力成熟的业绩记录是什么样的\n- 从 AI 产品经理的角度来看，可访问性沟通意味着什么\n\
  - AI 产品经理在职业上升过程中常见的挑战和机遇\n- AI 产品经理在不断扩展时如何照顾好自己\n\n我们将以案例研究示例对上述内容进行情境化示例，并一如既往地对本章进行总结。AI\
  \ 产品经理的职业道路充满挑战但也回报丰厚。任何人都可以建立成功的、长期的 AI 产品经理职业生涯，因为随着 AI 的普及，这一专业领域将迎来更多增长，只要他们愿意为自己的产品、市场和组织服务而努力。\n\
  \n正如我们在第 17 章所看到的，当前 AI 产品经理的整体情况倾向于符合某种特征。但我希望像这样一本书能激励你即使不符合这种刻板印象也能进入该领域，并以你独特的经验和价值观组合丰富这一角色。任何人只要足够渴望就能做到，这意味着你也可以做到。如果你读到这里感到犹豫，因为内心深处你觉得自己没有这个能力，我挑战你去反驳自己内心的那一面。我们都有权利围绕着让我们感到兴奋和启发的事情来建立职业生涯。如果作为\
  \ AI 产品经理工作让你感到兴奋和启发，或者它听起来只是谋生的好方法，这将推动你取得成功。对于那些不太确定的你们，本章的其余内容可能会让你打消念头。这也没关系，也很有价值！做出明智的决定总比因为冒名顶替综合征而从未尝试要好。\n\
  \n## 一个多面手的职位族\n\n在本节中，我们将根据我们在第 17 章介绍的能力——技术熟练度、商业敏锐度、沟通能力、领导力和解决问题的能力——来探讨 AI\
  \ 产品经理的诸多实际压力和期望。我将为这五项能力中的每一项使用一个总称，以便本节更易于消化，但你会注意到每个能力下都有一个长长的职责清单。我们可以将每个能力视为技能和责任的集中体现，而不仅仅是独立的技能。让我们开始吧！\n\
  \n请记住，列出这些能力并不是为了在每项能力上都追求卓越，而是为了展示你在成长和成熟为 AI 产品经理职业生涯的过程中可以探索的技能和能力的全范围。\n\n##\
  \ 技术熟练度\n\nAI 产品经理的技术熟练度涵盖了在将 AI 能力与业务目标保持一致、确保负责任的数据使用以及在产品中保持高质量方面很重要的各种角色。AI\
  \ 产品经理利用技术洞察力解决现实世界问题，并记录这些工作以追踪其对业务的影响。通过学术学位、认证和训练营进行持续学习可以帮助 AI 产品经理了解不断发展的技术和机器学习模型，并进而将复杂的\
  \ AI 概念翻译给非技术受众，并通过研讨会和沟通创造可访问性。技术熟练度不仅仅局限于机器学习模型，还扩展到数据管理、产品质量控制和数据分析等领域，因为 AI\
  \ 产品经理需要确保其 AI 系统中使用的数据、产品的性能以及来自用户和客户的使用模式都支持其产品。\n\n**推荐步骤：** 每当你有机会时，都为非技术受众撰写你所支持的\
  \ AI 解决方案的文章，并在适用时在内部以及与你的更广泛网络中分享这些内容。对于特别困难的团队，你可以考虑围绕 AI 功能、用例和战略影响设计 AI 研讨会环节，以便受众更好地理解\
  \ AI 在产品中的作用。这也可以作为利益相关者提问并增强他们对 AI 产品理解和信心的空间。\n\n## 数据管家\n\n在这一角色中，你负责建立数据治理标准，并确保用于训练模型的内部数据准确、相关、干净且无偏见。你的角色影响着产品输出的质量和可信度，以及模型的准确性、公平性和合规性。训练数据的完整性使你能够减轻与有偏见、不完整或不准确的数据集相关的风险。\n\
  \n**推荐步骤：** 撰写关于你的治理标准以及确保用于训练模型的内部数据准确、相关、干净且无偏见时所面临挑战的文章。定期向你的领导团队传达数据管理对实际业务成果和用户体验产生积极或消极影响的具体案例，有助于强化数据管家作为\
  \ AI 生命周期中至关重要组成部分的论点，并重申投资于适当数据管理的重要性。\n\n## 数据策略师\n\n虽然数据管家可能专注于数据日常挑战，数据策略师角色则鼓励对数据管理采取高层次的方法，通过制定长期的数据收集、管理、使用和部署策略在生产环境中实施。围绕有效数据实践构建策略不仅能增强产品\
  \ AI 能力和功能的性能，还能优化数据管道本身。数据策略师专注于数据获取和使用的战略、长期规划。\n\n**推荐步骤：** 定期组织可见的数据策略会议，并确保关键利益相关者和领导者从一开始就参与其中。维护与组织数据收集、预处理、转换和质量保证相关的数据策略文档。确保其对所有相关利益相关者可访问，以便他们在一个中心位置了解数据处理协议和血缘关系，并在那里提问并提出问题，以建立更广泛的数据流利文化，特别是随着业务目标的演变。\n\
  \n## 质量控制员\n\n当产品在发布前需要满足质量和性能标准时，你是最后一道防线。AI 产品经理确保所有 AI 功能和功能在发布前达到高质量和安全标准。这意味着要精通随持续质量保证而来的严格测试实践，如压力测试、负载测试和可用性测试。AI\
  \ 产品经理必须通过评估技术标准和用户期望来确保产品已准备好发布，特别是对于 AI 产品而言，数据和用户输入可能存在显著差异。\n\n\n\n\n\n**推荐步骤：**\
  \ 与相关利益相关方和领导者分享持续的产品改进策略和 QA 最佳实践。让利益相关方了解测试结果和 QA 情况，可以展示改进如何为产品价值做出贡献。在你的 QA\
  \ 最佳实践中纳入边界情况测试、偏见分析和公平性监控。\n\n## 分析师\n\n作为一名 AI 产品经理，你会定期使用产品分析数据和用户/客户行为画像来做出明智决策，了解什么真正引起了他们的共鸣。你会持续监控和解读使用模式、参与度指标和反馈趋势的变化，为你的产品中对所服务用户影响最大的功能或功能提供可操作的洞察。这有助于你根据用户和市场不断变化的需求调整产品。\n\
  \n**推荐步骤：** 定期向组织更新用于衡量 AI 产品成功情况的趋势、KPI 和指标。与跨职能团队和领导层分享这些方面的报告，以展示用户参与模式和改进领域，确保你在后续进行方向调整时获得支持。使用分析数据衡量\
  \ AI 功能的表现如何以及它们如何影响产品的战略目标和愿景。\n\n## 商业敏锐度\n\nAI 产品经理角色的这一方面关注的是将产品与所服务的商业环境和市场连接起来的职能。AI\
  \ 产品经理负责定义产品愿景并将其与公司目标保持一致，强调产品的财务影响和市场表现。确保这种表现的重要部分是建立围绕产品的合作伙伴关系和协作，以确保其拥有成功的适当分销渠道。AI\
  \ 产品经理角色的商业方面还要求对想要构建或维护的产品所在的市场条件和准备情况有深入的理解。这意味着 AI 产品经理需要精通他们所处的竞争格局，以便了解如何最好地定位产品并为未来的创新提供信息。\n\
  \n## 策略家\n\n在这一角色中，AI 产品经理定义产品愿景和战略，并确保其与公司的整体目标保持一致。这是一个关键角色，因为它塑造了产品的发展方向，并为利益相关方阐明该方向。阐明清晰、有说服力的愿景并制定指导产品开发的可执行战略，为团队提供方向，并激励组织各地的利益相关方相信产品的独特价值主张以及它如何满足市场及其用户和客户的需求。\n\
  \n**推荐步骤：** 设立季度或半年一次的全体会议，在会上公开传达公司的产品愿景和战略，并明确将其与公司的整体目标联系起来。定期举行每两周或每月一次的产品战略会议，与领导层或你的\
  \ GTM 团队一起回顾进展、讨论市场趋势，并在适用时调整战略。将市场分析和反馈纳入战略讨论，以分析竞争对手、评估用户洞察并了解行业变化。\n\n**推荐步骤：**\
  \ 通过你可以内部和外部分享的报告记录你的市场研究活动，以确立你在该领域的专家地位。包括成功的市场定位策略和对产品产生积极作用的结果。在适用情况下，通过在线平台和社区或通过直接用户反馈和产品调查直接与目标受众互动。\n\
  \n## 竞争分析师\n\n虽然市场研究人员分析市场的各个组成部分，但在这里你专注于竞争，通过分析竞争对手的战略来保持对产品竞争力的了解，以便了解如何超越他们。对竞争产品的优势和劣势进行持续评估，使你能够在快速变化的\
  \ AI 格局中保持竞争优势。这种分析不仅能让你完善产品供应，还能让你预测市场变化并主动应对。\n\n**推荐步骤：** 记录你的竞争分析并突出产品相对于竞争对手的优势领域和弱势领域。在有重大更新时与你的领导团队分享。针对每个主要竞争对手进行\
  \ SWOT（优势、劣势、机会、威胁）分析，以了解产品如何保持竞争力。通过将产品的关键指标与行业标准和竞争产品进行比较，建立绩效基准。\n\n## 沟通\n\n\
  有效沟通在大多数职能中都很重要，因此对于 AI 产品经理来说，这一角色方面至关重要。AI 产品经理必须与多个跨职能团队协作，以保持项目、路线图和冲刺按计划进行。在整个产品生命周期中传达所有主要\
  \ AI 功能和能力并培养透明度意味着利益相关方以有意义的方式参与其中。所有重大的产品变更和更新都必须通过 AI 产品经理进行沟通，而当这些更新未被充分理解或重视时，就由他们出面以最合适的方式解决差距。沟通不仅需要具有功能性；对\
  \ AI 产品经理来说，它还具有战略目的。传达风险并减轻潜在损失对于保持产品经理与领导团队之间的沟通渠道畅通至关重要。\n\n## 项目经理\n\nAI 产品经理需要具备强大的组织技能，以便与跨职能团队协调，确保项目、路线图和冲刺保持在正轨上。吸纳工程、设计、营销和销售的观点，并通过定期检查、状态更新和冲刺计划会议整合这些观点，可保持产品活动之间的强力一致。AI\
  \ 产品经理不仅要确保在各个产品领域保持一致，还要以遵守之前制定的路线图和时间表的方式及时管理这些影响。这里的重点是以任务保持按计划进行的方式管理资源。在许多情况下，AI\
  \ 产品经理在重大冲刺或史诗完成后也会进行事后分析，以改进未来的工作。\n\n**推荐步骤：** 通过撰写关于你的 AI 产品如何以合乎道德的方式开发和部署以及在出现偏见、公平或透明度问题时如何缓解这些问题的文章来展示思想领导力。与你的网络和同行分享这些文章。鼓励更广泛地讨论\
  \ AI 伦理的重要性并参与这些对话，以将自己定位为一位博学的倡导者。\n\n## 团队领导\n\n你通过确保所有利益相关方都了解自己的角色及其对产品团队的重要性来担任团队领导。这涉及创造一个包容的环境，让团队成员无论你是否有直接的管理角色，都能感受到被赋予权力向你提出问题或疑虑。保持开放的沟通渠道培养信任并鼓励人们以富有成效、动态的方式协作。\n\
  \n**推荐步骤：** 向你的领导团队或直接经理传达你如何领导团队、促进协作或在出现时解决冲突。突出你如何促进团队合作并分享团队绩效、面临的挑战和实现的目标的更新。\n\
  \n## 讲故事者\n\n作为讲故事者，你的角色是定期向利益相关方团队传达产品愿景、战略、价值主张以及这些事物将带来的益处。你还讲述你的产品故事以及它能为你的市场、客户和用户做什么。优秀的\
  \ AI 产品经理知道，有效的讲故事是关于清晰地阐述与受众产生情感共鸣的叙事，以保持他们的投入。通过以相关且引人入胜的方式连接产品的益处，讲故事可以激励内部团队和用户采取行动。当你将故事编织到各种产品资料或推广机会中时，你会完善自己自然而真实地传达信息的技巧。\n\
  \n**推荐步骤：** 在每次重大冲刺、产品更新或方向转变时，定期向利益相关方团队传达产品愿景、战略、价值主张以及这些事物将带来的益处。通过将你的故事线编织到各种沟通渠道中来提升你的讲故事技巧，如演示文稿、通讯、面向客户的更新日志、博客文章、会议、正式演讲、播客、文章、欢乐时光对话或任何其他适用方式。\n\
  \n## 激励者\n\n当团队失去灵感，当他们忘记自己在做什么以及为什么要做时，你就是那个帮助他们记住辛勤工作是为了什么的人。繁琐和不堪重负的感觉会在你全职工作时出现。如果没有能够让团队重回工作核心目的影响力的影响力，停滞和幻灭感就会出现。通过保持大局观，你提醒每个人他们努力背后的影响和意义。鼓励和视角可以重新点燃动力，帮助他人以更新的目的和乐观态度克服障碍。这是工作更具情感的一方面，优秀的\
  \ AI 产品经理具有情商，能够识别团队中缺少这一重要要素的时刻。\n\n\n\n\n\n**推荐步骤：** 当他人似乎迷失、沮丧、幻灭或困惑时，肯定产品愿景和目标。视情况公开或私下认可个人和团队的贡献，以增强士气并强化他们辛勤工作的价值。\n\
  \n## 知识分享者\n\n你将通过营造持续学习和知识共享的文化来以身作则，内容涉及 AI、市场或与你的产品相关的领域。因为成功的 AI 产品经理已经在为自身卓越而获取和强化知识的过程中，这一角色在于分享和应用这些知识给他人。这里的目标是传播信息。通过积极寻找分享见解、资源和产品知识的时机，你确保团队和利益相关者保持充分知情并有能力做出自己的决策。这有助于组织整体的成长和专业知识，并赢得同事们的信任和信赖。\n\
  \n**推荐步骤：** 维护一个公开的知识分享会、培训和资源的公开日历，并在产品知识库有贡献时发布公开公告。\n\n## 问题解决\n\nAI 产品经理角色的这一方面涵盖了该角色的各种职责。解决问题是关于考虑各种潜在解决方案并承担选择一个将带来最大益处的方案的责任。AI\
  \ 产品经理必须筛选各种问题，从客户反馈到监管和合规；必要的技术调整到可能出现的一般冲突。公司的问题从不缺少，但有效的解决问题者却很稀缺。许多组织面临与沟通中断、资源限制和不断变化的市场需求相关的挑战。培养你的解决问题能力以应对复杂性、识别根本原因并促进协作，将在许多情况下助益你。\n\
  \n## 客户倡导者\n\n作为客户倡导者，你经常处于筛选各种客户反馈渠道并寻找优化产品开发机会的位置，以服务于用户和客户持续反馈给产品组织的重大趋势。你优先考虑用户需求和痛点，以确保你的产品对他们最有意义的事情产生真正的影响——确保它真正解决那些会积极影响他们生活的改进。你\
  \ empathize with 终端用户的旅程并打造 AI 产品体验，以满足他们的需求并通过持续、以价值为驱动的改进培养忠诚度。\n\n**推荐步骤：** 制定引人注目的案例研究，展示你的产品如何为客户/用户创造价值。收集并向利益相关者展示主要的用户反馈、评论、推荐和调查结果，以强化产品与用户优先事项的一致性，并为未来的产品迭代建立基于证据的支持。\n\
  \n## 合规执行者\n\n虽然你的组织可能有法律团队更关注监管监督和为审计目的而遵守框架，但随着你越来越多地将 AI 整合到产品体验中，你很可能需要与这些团队合作。这意味着要熟悉并及时了解法律标准和监管框架，以确保你的工作与之保持一致且不构成潜在风险。通过了解与你的产品相关的相关及时法律法规，你还可以识别出可以为产品增值的机会并使其获得竞争优势。\n\
  \n**推荐步骤：** 定期了解与你的产品相关的相关及时法律法规；率先标记合规这些法规对产品成功可能带来的潜在风险和机会。记录你预期未来可能影响产品决策或长期战略方向的见解和潜在监管或立法里程碑。\n\
  \n## 协调者\n\n我们之前在这份清单中讨论过 *知识分享者、利益相关者管理者* 和 *项目经理*，但这些都未触及协调者真正做事的核心。协调者的主要重点是创造一个环境，让跨不同团队的协作能够蓬勃发展，并消除可能阻碍这一最终目标的任何障碍。你会定期与利益相关者团队保持一致，尽可能防止摩擦，并解决问题以防止其首先发生。协调者引导讨论以确保所有观点都被听取，并且当团队协作和开会时，不会在必要的对话流程中出现空白。协调者还帮助团队在误解变得严重威胁或阻碍之前解决它们。主动管理群体动态、识别错位领域并鼓励开放对话可能是其他角色的方面，但它们不是主要重点。\n\
  \n**推荐步骤：** 与所有主要利益相关者团队保持定期节奏，定期让他们了解产品目标、里程碑和变化。不要临时与他们会面。当会议确实发生时，确保议程代表该会议的目标，并且所有相关声音都有自由和安全公开发言。\n\
  \n## 数据驱动决策者\n\n之前，我们讨论了 *分析师* 角色，其重点是在战术上发现集中在用户行为和参与度指标的数据趋势。虽然这本身就是一套技能，但对这些趋势和见解采取行动并权衡如何前进的选择，这就是这个角色的核心所在。你使用数据和指标为你的产品及其定位做出正确的决策，基于来自各利益相关者的相互竞争的优先事项。将决策与整体产品目标和优先事项保持一致意味着产品将基于全面的数据洞察而演进。在此角色中，AI\
  \ 产品经理促进与领导层和利益相关者关于将塑造产品长期方向和定位的决策的讨论。\n\n这就是很多角色。很可能还有更多未列入此清单。也许我们可以为第三版延长此清单，冒着吓跑更多好奇的潜在\
  \ AI 产品经理的风险。尽管此清单相当长，但它充分可视化了 AI 产品经理角色的影响和复杂性。它还强调了我们在上一章中提出的重要观点：技术专长并不构成角色的主要部分。我会认为它更像是一个先决条件。清单上的大部分项目在本质上是非技术的。AI\
  \ 产品经理角色的核心在于批判性思维和人际关系。接下来，我们将探讨如何利用批判性思维和人际关系在 AI 产品经理角色中出类拔萃。\n\nAI 产品经理在角色中挣扎最多的原因之一是，其他人往往并不了解他们为产品所做的服务。我们都希望生活在一个无需承担让他人明显看到的世界中就能因所做的工作而获得奖励和庆祝。\n\
  \n但我们并不生活在那个世界里。如果你无法明显地定位你所做的工作，你的上级、领导团队、利益相关者和专业网络的日常压力和挑战将使他们对你的有效性视而不见。我们尽量不要对此感到个人化。但如果我们不理解这一点，我们可能会觉得我们做了很多却没有必要的支持和认可来支撑我们走长远路。驾驭核心能力并通过它们为业务倡导你的贡献，将最大程度地促进你作为\
  \ AI 产品经理的真实和 perceived 成功。\n\n这些行动乍一看可能令人不知所措。但这强化了结构在 AI 产品经理日常生活中重要性的认识。将对你作为\
  \ AI 产品经理的真实和 perceived 有效性做出最大贡献的活动组织成每周、每月、每季度和每年的类别。我已尽力在上面的要点中包含你应该多久与各个团队和利益相关者沟通，但最终决定权在你。你最了解你的领导、GTM\
  \ 和利益相关者团队。只要记住，与其事后难以找到与人共处的时间，不如先预订时间然后决定不需要它。主动进行你在 AI 产品经理角色中建立的结构。让这些结构为你服务。你将建立的一个主要结构以实现角色成功是沟通渠道。我们接下来将探讨这些看起来是什么样的。\n\
  \n## AI 诠释者和沟通易懂性的作用\n\n我无法足够强调让 AI 对你将合作的各种非技术利益相关者变得可及的重要性，因此这值得单独一个章节。作为 AI 产品经理，大部分产品沟通将直接落在你身上。你可能在组织中有庞大的产品团队，但这并不意味着这一角色不会落在你身上。无论你为大公司还是小公司工作，无论你所在的团队规模如何，如果你负责向组织传达你的产品愿景、战略和路线图，你将承担这一负担。\n\
  \n\n\n\n\n## 职业发展过程中的常见挑战与机遇\n\n对于任何希望建立一段长久、可持续职业生涯的人来说，明确自己希望从AI产品经理的职业生涯中获得什么，以及希望走向何方，都至关重要。在沿着AI产品经理道路前进的过程中，你会受到启发去尝试不同的方向，但为职业方向设定一条清晰的路径（如果你愿意，也可以称之为路线图）将帮助你把握机遇，并为职业成长中即将面临的挑战做好准备。正如本书前几章所讨论的，以下是你随着职业发展可能遇到的一些挑战与机遇，以便你在AI产品经理职业生涯成长过程中更好地预判它们：\n\
  \n- **技术格局：** AI产品经理职业道路上最大的障碍之一，就是要跟上人工智能技术日新月异的步伐。这要求很高，许多人因此产生冒名顶替综合征，因为他们可能只对某些特定的方法论或模型较为熟悉。然后，因为他们是“AI产品经理”，他们可能觉得自己需要了解AI的所有领域，才能自信地接受这个头衔。但事实并非如此。是的，你需要尽可能跟上行业的最新进展，但你也只是在AI的某一个领域工作，掌握这个领域很可能就足以满足你的产品和公司需求。人们常常很难在深度技术知识的需求与其他AI模型和能力的广泛认知之间取得平衡。解决之道在于明确自己想要专攻AI的哪个领域，并在这个领域深耕下去。\n\
  - **对齐：** 如果不了解每个群体对产品的意图以及对AI的认知水平，就很难与利益相关者保持对齐。这对许多AI产品经理来说是一个障碍，因为它最容易导致沟通破裂。首先要与这些团队建立信任，这样你才能了解他们的目标是什么，以及他们对产品价值的理解是什么。一旦做到了这一点，你就可以利用这些反馈来制定你将呈交给公司的路线图。如果你把这一过程中的每一步都当作一个独立的步骤来对待，就能避免日后的沟通不畅。不先评估他人的基准期望，你就无法设定现实的期望。因为你是AI产品经理，你要评估他们对所支持产品以及AI能做什么的理解和期望。这两者都需要加以解决和澄清。\n\
  - **市场：** AI领域的竞争非常激烈，而且随着越来越多的玩家进入AI赛道，这种竞争还将持续。进入该领域的产品经理对AI也越来越熟悉，情况同样如此。你并不是在真空中存在——你身边有那些应该被激励来帮助你的人。试着通过消化研究中得到的发现来应对来自市场的压力，然后围绕这些发现组织战略研讨会议和专题工作坊。作为AI产品经理，你的工作是让所有相关的声音汇聚一堂，并从领导团队那里获得指导。他们才是承担了建设公司和参与市场竞争的责任与投入的人。让他们引领你。\n\
  - **资源：** 我们在本书前面已经谈过维护AI系统的成本；作为AI产品经理，你经常需要根据预算或时间限制做出某些决策。设定不切实际、过于宏大的AI产品目标，是让你作为AI产品经理的可信度迅速蒸发的好办法。就像你要与上述利益相关者建立信任并了解他们对AI的认知一样，你也需要与数据科学、机器学习和开发团队做同样的事情。尽早了解技术团队的能力基线，弄清他们的开发速度。在充分了解你的技术团队能做什么之前，不要做出任何承诺。\n\
  - **伦理：** 许多AI产品经理可能认为，评估产品是否存在偏见、漂移和公平性问题应由数据科学团队来标记，但这是不负责任的。诚然，你的数据科学和机器学习团队应当能安心地提出对训练数据偏见或模型在不同用户群体中的性能问题的担忧。但你不能把这些都留给他们。你应该是你产品的专家，如果你不主动制定计划来发现与偏见和伦理相关的潜在问题，这些问题可能会被遗漏。此外，透明度对客户和用户来说越来越重要。如果不对产品性能如何随各种因素变化进行全面评估，你就无法透明地说明是什么让你的产品有效。\n\
  \n我们已经介绍了AI产品经理随着时间推移在职业成熟过程中可以拓展的诸多领域。对于刚开始的人而言，要在一份工作中考虑这么多因素似乎令人望而生畏。确实如此！我们不会时时刻刻在角色的每个方面都表现出色。取决于你所在的公司或特定产品角色的期望，我们目前介绍的某些方面会比其他方面更受重视和赞赏。随着你作为AI产品经理逐渐成熟，你将建立一些策略，帮助自己找到公司、角色期望和个人偏好之间的最佳组合，从而让你绽放出最耀眼的光芒。以尽可能愉快、优雅的方式可持续地发展我们的职业生涯，是最重要的工作。下一节，我们将讨论可持续职业成长的最大功臣：自我关怀。\n\
  \n## 自我关怀的重要性\n\n在面对AI产品经理职业（实际上任何产品经理角色都是如此）所带来的损耗时，拥有一个自我关怀的支持体系至关重要。正如本章前两节所述，从事这类工作身兼数职，要满足各种角色的需求，需要采取大量推荐行动。如果没有适当的支撑体系来维持能力、生产力和灵感，人们很快就会精疲力竭，因为这个角色通常具有很高的能见度、期望和压力。\n\
  \n这很大程度上是因为对AI产品经理的投入很高。业务面临的风险很大，他们需要找到真正能胜任这项工作的人。请记住，作为AI产品经理，你负责组织的AI引入与理解、AI项目本身、产品战略与愿景、该战略的执行，当然还有用户采用情况和满意度。即使每个项目只有一个人负责，这些也都是要求很高的项目，更不用说让一个人负责所有工作了。\n\
  \n采取措施不仅保持你的注意力和精力水平，还要维持你的情感投入，这样才能让你持续充电。很多时候，让我们更疲惫的不是工作的实际要求，而是情绪上的抵触。要想对抗这一点，尽量选择与直属经理、直接下属以及支持性强、鼓舞人心的领导团队紧密配合的职位。我明白这并不总是可能的，但你与他人合作的融洽程度将直接影响你作为AI产品经理的成功。你获得的情感支持越多，你的思路就越清晰，能力也就越强。\n\
  \n与那些削弱你能力或暗中破坏你的人共事，会让你逆着强大的阻力之流而行。仅仅以逻辑和理性为傲，也只能让你走到这一步。最终，工作的要求会压倒你冷漠的外表，你会发现自己很难找到继续做好工作的动力。尽早帮自己一个忙，在身边建立支持性的团队，帮助你保持强烈的情感归属感和目标感。当我们的理性和内心出于正确的理由投入时，我们的承诺会更加坚定。\n\
  \n保持强大的心理和身体健康对所有人来说都很重要，但对于AI产品经理的角色而言，这应被视为先决条件。AI产品经理的角色压力大、要求高，因此要确保自己能够有效管理压力，防止职业倦怠。心理健康和身体健康之间有着公认的联系。整天坐在屏幕后、一个接一个地开会、从来见不到太阳，这对你自己或你的产品组织都没有任何好处。你可以通过关注以下几点来主动保持健康：\n\
  \n- 养成规律锻炼的习惯，如散步、瑜伽，或去健身房/参加健身课程，以缓解压力并保持健康。\n- 通过全天规律进食、保持均衡饮食来平衡情绪和注意力。\n- 保证充足睡眠！不要熬夜，也不要在清晨加班。如果你能合理安排日程，每周工作40小时就足以高效完成工作。\n\
  - 冥想！与你的待办事项清单保持距离，每天从鸟瞰视角重新审视它。\n- 白天要适时进行脑力休息。见见阳光。不要把会议连续排在一起。\n- 在身边建立牢固的情感纽带。定期与朋友、家人或心理治疗师见面，让自己有发泄压力的渠道。没有哪份职业值得用孤立和过度劳累带来的不适来换取。\n\
  - 保持爱好、个人项目和第三空间活动的参与。我们不只是一份工作，我们远比那丰富得多。\n- 对工作进行优先级排序，确保先处理最重要或最紧急的事项。\n- 尽可能委派任务。\n\
  - 休假时不要工作。\n- 设定明确的工作时间，并坚持执行。\n- 通过线上或线下方式建立专业人脉。\n- 找到一位AI产品经理导师，一个你信任的人，一个你觉得真正为你利益着想的人。\n\
  \n\n\n\n\n预测你将如何成长和改变，以便为自己的职业成熟度制定路线图，但也要记住是什么造就了你。思考一下你真正热爱并且最适合的角色方面。虽然不断努力成长和挑战自己是件好事，但我相信我们最深层的力量来自于了解自己和我们真正看重的东西。只有这样，我们才能吸引与我们是谁以及我们在世界上想要从事的工作类型产生深刻共鸣的机会。如果我要思考与我、我的兴趣和我的技能组合最契合的角色方面，我最喜欢的是\
  \ *有远见的、激励者的、客户倡导者、战略家和冲突解决者*。\n\n当我通过不同的体现形式、渠道和讨论来传达产品愿景并将其与公司的使命保持一致时，我会感到自己有用且受人重视。对我来说，帮助他人重新回到核心目标并专注于对客户和用户产生最大影响的事情是很有意义的。当我能够成功解决可能阻碍产品团队发挥最佳水平的冲突时，我会感到一种深深的使命感。作为一名\
  \ AI 产品经理，对我来说很重要的一点是，我要建立一份让我感到有用、受人重视、有意义且目标驱动的职业。找到适合你的因素组合，并自己做练习，以了解你希望在职业轨迹中融入哪些价值观和考量。\n\
  \n## Summary\n\n记住“好”因人而异。所有 AI 产品经理都将受到其所处环境的制约。你的直接主管、领导团队、企业文化以及同行关系都会影响你的工作被如何看待。我们在本章中讨论的一切都应被视为最佳实践的一种形式。我们不可能事事兼顾，如果一个人要照顾到本章讨论的每一个方面，他们可能会发现自己处于不可持续的工作状况。与其采取详尽的行动去戴上每一个“帽子”，不如最好以系统的方式思考。你可以建立哪些系统，以便你至少能以一定的规律性覆盖\
  \ AI 产品经理“帽子”的某些方面？记住，这是一种对冲，而不是保证。\n\n围绕你的工作建立结构和系统并不是要制定教条式的规则，而是要创造健康的边界，以免我们做得太多而导致倦怠。从倦怠中恢复要比完全避免它困难得多，所以请尽可能善待自己。你同时在平衡许多人的意志、意图、挫折和冲突，这就是\
  \ AI 产品经理的角色。如果你不小心，你可能会发现问题来自四面八方。但你可以以一种具有支持性的方式设置护栏和边界。因此，你将多年享受这份职业带给你的所有馈赠。\n\
  \n在下一章中，我们将探讨 AI 产品经理职业路径中的成熟度和成长是什么样的。\n\n## Leave a Review!\n\n感谢你从 Packt Publishing\
  \ 购买本书——我们希望你喜欢它！你的反馈对我们改进和成长非常宝贵。阅读完成后，请花一点时间在 Amazon 上留下评论；这只会花费一分钟，但对像你这样的读者来说意义重大。\n\
