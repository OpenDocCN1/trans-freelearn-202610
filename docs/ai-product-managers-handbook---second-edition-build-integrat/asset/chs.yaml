  - *2024年AI指数报告：* https://aiindex.stanford.edu/report/\n\n## 加入我们的Discord\n\n与其他用户、AI专家和作者本人一起阅读本书。\n\
  \n提出问题、为其他读者提供解决方案、通过“问我任何事”环节与作者聊天，以及更多精彩内容。\n\n扫描二维码或访问链接加入社区。\n\nhttps://packt.link/aipm\n\
  \n![](img/a0c9f9a2ba06a06d309ce21d890a47c6_64_0.png)\n\n在每个阶段，我们都会涵盖主要的基础领域，从构思到发布一个可接受的产品初版。这些步骤是逐步展开的：\n\
  \n- 1. 在**发现**阶段，你进行头脑风暴，思考你想要满足的市场需求，以及为什么这个需求需要由AI来增强。\n- 2. 在**定义**阶段，你引入产品的产品需求。\n\
  - 3. 在**设计**阶段，你引入最终产品的视觉和体验元素。\n- 4. 在**实施**阶段，你将其构建出来。\n- 5. 在**营销**阶段，你为更广泛的受众构思信息。\n\
  - 6. 在**培训**阶段，你测试你的产品，确保其按预期使用。\n- 7. 最后，在**发布**阶段，你将产品发布给更广泛的受众以获取反馈。\n\n这可以通过以下框架来说明：\n\
  \n![](img/a0c9f9a2ba06a06d309ce21d890a47c6_66_0.png)\n\n*图2.1：新产品开发（NPD）阶段*\n\n\
  让我们在接下来的章节中更详细地了解这些阶段。\n\n# 第1步 – 发现\n\n在这个阶段，你正在构思。你试图确定你要解决的特定问题，而在机器学习（ML）产品的背景下，第一阶段的关键部分是首先理解为什么你要用ML来解决这个特定问题。借用西蒙·斯涅克（Simon\
  \ Sinek）的畅销书《从“为什么”开始》中的一句话，这就是你“找到你的为什么”的地方。在这个阶段，你要思考当前问题的基本要素，并试图确定问题中最紧迫的部分，以便日后解决未满足的需求或服务不足的客户。\n\
  \n这需要收集关于你所面临特定问题的定性和定量客户反馈，以及进行市场和竞争分析，以了解当前有哪些潜在解决方案。这里最大的重点是创造力——进行头脑风暴，提出潜在的解决方案，然后你可以分析并进一步探索（或丢弃）这些方案。并非所有问题都能用AI/ML解决，在使用新兴技术时，培养辨别力并审慎批判地考虑何时使用它们非常重要。在某些情况下，可能没有足够高质量或多样化的数据来让AI/ML成为你试图解决问题的合理方案。或者，非常简单，规则和公式可能就足以解决你的问题，而无需训练ML算法。在许多情况下，与其可能带来的收益相比，ML可能是成本过高的解决方案。\n\
  \n```\nfrom sklearn import neighbors\nfrom sklearn import neighbors\nfrom numba\
  \ import jit\nimport numpy\nimport matplotlib.pyplot as pyplot\nimport seaborn\n\
  from sklearn.datasets import make_regression\nfrom sklearn.model_selection import\
  \ train_test_split\nfrom sklearn.neighbors import KNeighborsRegressor\n\n# Build\
  \ our model.\nknn = neighbors.KNeighborsRegressor(n_neighbors=6)\nknn.fit(X_train,\
  \ Y_train)\nknn.score(X_test, Y_test)\n```\n\n![](img/a0c9f9a2ba06a06d309ce21d890a47c6_78_0.png)\n\
  \n![](img/a0c9f9a2ba06a06d309ce21d890a47c6_78_1.png)\n\n尽管这似乎有悖常理，但获得如此高的分数很可能意味着我们的模型运行得并不好，或者它特别适合训练数据，但在新的数据集上表现不佳。虽然这似乎有些矛盾，尽管模型试图尽可能接近1，但过于接近是非常可疑的。这是因为我们总是预期模型会有缺陷——总会有一些损失。当模型在训练数据上表现得异常出色并获得高分时，这可能只意味着模型被校准到了该数据样本，而在新的数据样本上表现不会那么好。\n\
  \n这种现象被称为**过拟合**，它是数据科学和ML圈子里的一大话题。原因在于，从根本上看，所有模型都是有缺陷的，除非你尽职尽责地选择了最佳模型，否则不能轻易信任。这种选择正确模型、训练它并让其投入实际使用的博弈，必须在严格监督下进行。如果你正在为产品或服务收费，并试图赢得那些未来会为你和你的产品背书的客户的信任，这一点尤其重要。如果你是AI/ML产品经理，你应该寻找随着时间推移逐步变得更好的良好性能，并且应该对一开始就出现的出色模型表现高度警惕。我曾有过一次经历，训练期间的模型表现被视为理所当然，直到我们已经向客户公司售出一份合同后，我们才发现该模型在应用于客户真实数据时表现非常糟糕。结果，我们不得不回到原点，重新训练一个新模型，以便在将该模型部署到客户工作流程之前获得我们所期望的性能。\n\
  \n\n\n\n\n关于神经网络的简要说明：虽然训练生成式 AI 模型会因主题和模型用途的不同而有所差异，但其过程仍会遵循相似的流程。你仍然需要优先考虑干净且多样化的数据样本，你仍然需要深思熟虑选择哪种神经网络最适合你想要的性能，并且你仍然需要尽力考虑（并优化）你的损失函数。这个过程将通过各种训练和验证的循环持续进行，直到你有足够的信心认为你的生成式\
  \ AI 模型能够基于你提供的训练示例生成新的输出。你为性能调整超参数、在可能的情况下最小化损失、并积累足够的数据来让模型取得成功这一目标，与其他机器学习模型的目标保持一致。\n\
  \n一旦你拥有了全面且具有代表性的数据来训练你的模型，并且你已多次训练这些模型并相应地调整它们以获得你所寻求（并向客户承诺）的性能，你就可以继续前进！\n\n\
  现在我们已经回顾了模型训练的一些主要方面，我们可以继续讨论部署会是什么样子。请记住，从构思产品、选择在产品中使用的合适模型，到根据训练效果评估该模型的性能，整个过程都是协作性的。这种协作在你训练完模型后不会结束，而是会加剧。这是因为你现在需要考虑如何将这些模型集成到产品的基础设施中以供客户使用。让我们在以下部分深入探讨这一点。\n\
  \n# 部署 – 训练后会发生什么？\n\n在 *第 1 章* 中，我们讨论了在生产环境中管理你的 AI/ML 产品时可使用的部署策略。在本节中，我们希望你能从\
  \ DevOps 角度了解可用的途径，在那里你最终会在训练工作区或训练环境之外在生产环境中使用和部署模型。也许你正在使用类似 GitLab 的工具来管理代码仓库的分支，以用于产品中\
  \ AI/ML 的各种应用并在那里进行实验。然而，一旦你准备好在重新训练后更改或更新你的模型，你将定期将新模型推送到生产环境。这意味着你需要一条能够定期支持这种实验、重新训练和部署的管道。本节将主要关注我们将一个完成的机器学习模型投入生产（实时环境）后需要考虑的问题，在该环境中它将被终端用户访问。\n\
  \n你如何管理这些未来的部署将因你的 AI/ML 产品是 **企业对企业（B2B）** 还是 **企业对消费者（B2C）** 而有很大差异：\n\n- 如果你管理的是\
  \ B2C 产品，你可能会分阶段进行更改，并且你可能会使用 *第 1 章* 中概述的部署策略来管理更新后产品被接收的方式以及哪些用户群体何时会看到新的更新模型。这就是\
  \ B2C 产品的本质：一个产品面向成千上万甚至数百万的个人消费者，而你的一个产品对不同的用户意味着不同的东西。\n- 如果你的产品是 B2B 产品，那么你通常在客户层面管理期望。一个客户使用你的\
  \ AI/ML 产品的体验可能与另一个客户不同。你使用的模型也可能因客户而异，因为你用于训练模型的数据对每个客户来说都是不同的。\n\n在本节中，我们涵盖了在生产环境中测试和排查模型使用情况时最重要考虑因素的一些内容，以及定期监控以保持监督水平的重要性，不仅是为了跟上模型的<|message|>\n\
  技术性能和稳健性，也是为了保持合乎道德。在下一节中，我们将更专注于在构建包含 AI/ML 组件的产品时应注意的伦理考虑，以负责任地构建并借鉴一些行业最佳实践。\n\
  \n### 伦理再训练 – 我们更新模型的频率的伦理问题\n\n当我们思考人类所拥有的惊人力量时，我们为权衡不同选择或决定是否信任某人而采用的复杂大脑运作，我们可能会觉得难以或不可能相信我们可以用机器完成我们思维能力的哪怕一小部分。我们中的大多数人在没有完全理解驱动这些体验的机制的情况下做出选择、筛选和判断。然而，就机器学习而言，除了神经网络之外，我们可以理解驱动某些判定和分类的底层机制。我们喜欢机器学习能够反映我们得出结论的能力这一想法，并且我们可以使用批判性思维技能来确保该过程尽可能地摆脱偏见。\n\
  \nAI/ML 的力量使我们能够自动化重复、枯燥、缺乏灵感的行动。例如，我们宁愿用算法取代内容审核员，这样人类就不需要每天承受在互联网上标记令人不安内容之苦。然而，机器学习模型尽管有其美妙的能力，但却无法像我们一样进行推理。当有偏见的自动化结构或随着时间推移而退化的结构以直接影响人类的方式部署，并且部署未被密切且定期地监控性能时，它们就有可能造成大量伤害。这种在规模上、在所有\
  \ AI/ML 的实时部署中可能造成的伤害，正是让伦理学家和未来学家夜不能寐的原因。\n\n然而，AI/ML 的部分危险在于自动化过程本身。我们在上一节中讨论过的漂移类型会影响模型从其学习的训练数据中推导出意义的方式。生成式\
  \ AI 模型尤其可能对这种停滞特别敏感，因为它们的目的非常概括。由于每天都有新数据不断产生，保持对它们进行训练的诱惑非常大。但成本也同样高昂。通常，大型语言模型在特定时期进行预训练，然后这些预训练模型被打包并出售给公司，公司再用自己的特定数据样本进行自己的训练以创建更专业的模型。\n\
  \n值得注意的是，尽管 ChatGPT 已推出一段时间，但截至 2024 年 3 月，其最后一次知识更新实际上是 2022 年 1 月。虽然英语本身自 2022\
  \ 年 1 月以来可能没有显著变化，但我们所知的世界已经发生了变化。人们越来越多地使用像 ChatGPT 这样的 LLM 来了解周围的世界，并且他们将这些模型输出解读为事实。让我们以一位使用\
  \ ChatGPT 并将其输出视为事实的 AI 产品经理为例。这可能会通过导致决策偏见而影响其角色和职责，从而导致基于不准确信息的决策。基于错误信息的决策可能导致产品功能误导、目标不一致或策略无效。\n\
  \n关于生成式 AI 模型，特别是 LLM 的伦理，需要考虑到对这些模型的依赖度增加。我最近与一位招聘人员会面，他告诉我像南新罕布什尔大学这样的学校正在裁员，因为他们使用\
  \ ChatGPT 等工具生成课程内容。虽然我们可以说他们很可能（希望如此）有人工编辑来检查课程内容的准确性，但如果他们有足够的信心用 LLM 取代员工，这并不会降低\
  \ LLM 管理者以伦理方式在考虑到对其依赖度增加的情况下最优维护其模型的重要性。\n\n### 问责制的现状\n\n即使性能和维护看起来正常，这也不意味着模型没有在行事放纵，从而对终端用户或可能在终端用户下游受到影响的人类造成现实世界的伤害，无论他们是否实际与模型交互。这是一个常见的例子是面部识别软件的普遍且不必要的应用。\n\
  \n2022 年 2 月，拜登总统签署了两项扩大美国 AI 问责制的立法：《2021 年军事人工智能法案》和《2021 年 AICT 法案》。*Fortune*\
  \ 杂志的 Will Griffin 写道：*\"虽然这项立法远不及与欧盟模式一致、并为许多 AI 伦理界人士所期望的监管呼吁，但它为深思熟虑且不可避免的 AI\
  \ 伦理监管制度播下了种子。\"* 重要的是要记住，AI 伦理和法规因居住地而异。在美国，我们在为遏制 AI 不当行为而制定的立法方面，以及在执行现有法律方面，都落后于欧洲标准。\n\
  \n2023 年 10 月 30 日，拜登总统签署了一项关于“安全、可靠和值得信赖的人工智能”的行政命令，旨在尽量减少 AI 的风险。该行政命令指导的新标准要求开发\
  \ AI 系统的开发人员透明地与美国政府分享测试结果和“关键信息”，并授权 **国家标准与技术研究院**（NIST）在 AI 系统发布前制定测试和安全标准，限制\
  \ AI 设计的生物材料，并通过水印限制 AI 生成内容。该行政命令的其他值得注意方面围绕着保护美国公民数据的隐私、打击算法偏见和歧视、消费者保护、减轻 AI\
  \ 带来的工人伤害，以及促进 AI 创新和竞争。\n\n虽然行政命令很好，但其效果可能各不相同，目前尚不清楚它们将如何向前执行。它们是朝着正确方向迈出的一步，10\
  \ 月 30 日的行政命令冗长且周到，但这正是使其容易被解读的原因。在没有精确定义的立法和硬性法规的情况下，它们可能变得几乎毫无意义。行政命令也容易受到后续总统上任后限制其措辞或完全撤销它们的影响，如果它们不符合当前政府的优先事项。\n\
  \n\n\n\n从立法角度来看，人工智能仍被视为一片“蛮荒西部”，随着本十年中人工智能产品的应用场景日益扩展，我们很可能会看到在进一步界定人工智能如何与我们互动方面取得长足进展。AI产品经理需要了解地方和全球层面立法如何变化，以便更好地为AI产品的概念构思、构建和管理方式的潜在变化做好准备。近期，美国在发布《人工智能权利法案蓝图》方面取得了进展，该蓝图涵盖以下领域：\n\
  \n- 安全有效的系统\n- 算法歧视保护\n- 数据隐私通知与解释\n- 人工替代、考量和后备\n\n目前，我们将采用欧洲标准来框定AI/ML产品经理应如何思考其产品，因为即使没有强制执行AI伦理的专门法律，企业家和技术人员仍可能因其算法选择而面临风险，例如失去客户、遭遇负面报道或被起诉。\n\
  \n欧盟委员会将以下四个关键领域列为伦理原则：\n\n- **尊重人的自主性：** “AI系统不应无正当理由地使人类处于从属地位、胁迫、欺骗、操纵、条件化或驱赶。相反，它们应被设计为增强、补充和赋能人类的认知、社交和文化技能。人类与AI系统之间的功能分配应遵循以人为本的设计原则，并为人类选择留有有意义的机会。”\n\
  - **防止伤害：** “AI系统不应造成或加剧伤害，也不应以其他方式对人类产生不利影响。这要求保护人类尊严以及心理和身体的完整性。”\n- **公平性：**\
  \ “虽然我们承认对公平有许多不同的解释，但我们认为公平既有实质性维度，也有程序性维度。实质性维度意味着承诺：确保利益和成本得到平等公正的分配，确保个人和群体免受不公平偏见、歧视和污名化的影响。”\n\
  - **可解释性：** “这意味着流程需要透明，AI系统的能力和目的需要公开传达，并且决策——在可能的范围内——需要向直接或间接受影响的人解释清楚。如果没有这些信息，决策就无法得到应有的质疑。关于模型为何产生特定输出或决策（以及哪些输入因素组合导致了该结果）的解释并不总是可能的。这些情况被称为‘黑箱’算法，需要特别关注。”\n\
  \n![](img/a0c9f9a2ba06a06d309ce21d890a47c6_85_0.png)\n\n更多详情，请参阅 Danilo Bruschi\
  \ 和 Nicla Diomede 所著的《*评估AI伦理及其在网络安全中应用的框架*》一文，网址为 https://doi.org/10.1007/s43681-022-00162-8。\n\
  \n2024年2月2日，欧盟成员国代表一致投票通过了《欧盟人工智能法案》，使其成为全球首部全面的人工智能法律框架。其影响不仅限于欧盟成员国，还将波及全球无数公民。《AI法案》首先将AI系统分为多个类别：\n\
  \n- 最小风险\n- 有限风险\n- 高风险\n- 不可接受风险\n\n这一概念在当今的任何护栏中明显缺失。根据AI系统的级别或类别，责任将包括风险评估、技术文档和记录保存、透明度和披露，以及依照该法案所包含框架的合规要求。这也是一项具有强制力的立法，对于违规的公司/个人，将根据其各自产品的AI类别处以巨额罚款。\n\
  \n![](img/a0c9f9a2ba06a06d309ce21d890a47c6_86_0.png)\n\n# 在组织中实施伦理标准\n\n许多公司可能会倾向于在公司内部设立AI伦理岗位，将其变成那个人的问题，或者在未能达到某些标准时将其当作替罪羊。但如果你所做的仅止于此，那便是管理AI项目伦理的一种懒惰且不道德的方式。更好的做法是，培训并赋能所有参与构建AI/ML产品的人员，让他们意识到相关的伦理问题，以及可能对客户或与产品交互的第三方造成的潜在伤害。\n\
  \n虽然我们必须认识到，正如本章前面所讨论的，持续更新模型对于在ML和AI方面保持良好伦理至关重要，但同样重要的是，要审视你的产品可能如何影响到那些甚至不使用你的产品的下游人群。\n\
  \n我们并非存在于真空中。正如我们在本章前几节中看到的，许多因素已经在与AI/ML产品中使用的算法作对，即使只是为了应对数据持续输入输出所造成的自然混乱，你也必须时刻保持跟踪。模型对各种漂移的自然倾向正是要求我们关注伦理的原因。根据TechTarget的《*今日所学*》播客近期一期的内容，信用报告与分析供应商FICO开展了一项针对AI用户的调查，结果显示67%的受访者不监控其模型的准确性或漂移，这相当令人震惊。这些AI用户是直接负责构建和维护AI系统的人，这说明不道德的AI/数据实践所带来的问题已成为常态。\n\
