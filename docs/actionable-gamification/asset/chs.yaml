  '
- '# 第4章：将游戏化置于合适位置


  在我们通过8个核心驱动力进一步深入体验与参与设计之前，我想花点时间解决一些关于各种游戏化活动的紧迫问题。


  虽然游戏化这个主题令人兴奋且富有成效，但许多行业新手很难理解游戏化的含义以及如何对其分类。


  如果我们的员工不想玩游戏怎么办？把某件事称为“任务”算不算游戏化？BlendTech用于推广其搅拌机的游戏化方式，与eBay使其平台令人上瘾的游戏化方式是否相同？我如何知道哪种游戏化适合我的公司？


  所有这些对普通读者来说都可能相当困惑（当然，你不是普通读者）。由于“游戏化”是一个包罗万象的术语，意为“让事物具有游戏感”（顺便说一句，维基百科流行的定义是“在非游戏情境中使用游戏思维和游戏机制”¹²），它几乎没有任何边界。这使得游戏化可以远达各个领域和行业。然而，它也招致了许多批评者，他们对这个术语过于宽泛感到不满。他们特别批评，由于术语的宽泛性，游戏化爱好者把一切好的、有趣的、激励人心的或沉浸式的东西都宣称是他们专业水平的工作。


  在继续阅读之前，我想声明：本章并不教你如何将体验游戏化以获得更好的结果，而只是探讨该领域内的语言和语义问题以及我个人的看法。我不能保证对“什么算游戏化、什么不算”的争论给出最终结论，但我确实希望你在读完本章后，能对这个领域有更全面的理解。





  There are many more fascinating topics on human behavior and good design that excite
  me more in the chapters to come. Even though it breaks my heart to spend precious
  time writing about this non-productive topic, I don’t want my readers to be unaware
  of the greater “Gamification World.”


  ## The War on Words


  Back in 2011, gamification notables Gabe Zichermann and Sebastian Deterding had
  a public debate on gamification concepts.


  Some background info: Gabe Zichermann is a brilliant marketer, speaker, CEO of the
  largest Gamification conference in the industry, the GSummit, and is one of the
  leading evangelists of Gamification and its commercial use.


  Sebastian Deterding is the Ph.D. academic that studies the deep theories and motivations
  of game design and Gamification. He is considered one of the most respected thought
  leaders in the space.


  In this debate of epic proportions, Sebastian Deterding publicly examined each chapter
  of Gabe Zichermann’s book *Gamification by Design*, and explained why he considered
  each chapter to be flawed and/or inaccurate¹³. Hyperbolically speaking, his blog
  post on the subject was almost longer than the book itself.


  One of Deterding’s critiques was that, contrary to what Zichermann states in Gamification
  by Design, serious games and advergames should not be considered examples of Gamification.
  For those who are unfamiliar with these terms, Wikipedia defines serious games as,
  “a game designed for a primary purpose other than pure entertainment.” In other
  words, games that are generally built for a productive purpose, such as training,
  education, healthcare, and the like (Hence, the term “serious”).¹⁴.


  BusinessDictionary.com defines advergames as, “A video game which in some way contains
  an advertisement for a product, service, or company.”¹⁵ These are games that basically
  act as interactive advertisement campaigns which draw potential customers onto a
  website or into a business. When I refer to “shoot-the-duck banner ads” as early
  and embarrassing forms of marketing gamification, those banner ads are technically
  classified as Advergames.


  As you can see, both definitions have the word “a [video] game” in them, which seems
  to go against the core essence of what “gamifying” something means. In my own writings,
  I talk about how you can gamify anything that involves human motivation, as long
  as it is not already a game, just like how you can’t liquefy liquid. You can however,
  apply better game design to games.


  So because advergames and serious games are “games,” by that standard you can’t
  really gamify them. Right?


  ## Semantics vs. Value


  To me this discussion is non-productive. I would rather spend my time learning about
  and harnessing the power of games to change the world for the better, instead of
  debating over classifications of terms. What good have you created in the world
  when you spend your day arguing if something is “a game made for traveling” or “travel
  gamified”?


  But there are people who would say, “No. That great example is a serious game! Gamification
  is just limited to these things that are really lame.” Why do people first define
  gamification as something lame, and then call it lame? For many years I have also
  worked on serious game projects and advergames, and if I can utilize that knowledge
  and experience to help the world, why limit what I can do as a gamification professional
  just because of some definitions?


  I’ll share a little secret with you: For the most stringent academics out there,
  though I claim to have twelve years of gamification experience, I’m actually a fraud.
  Technically, I have three years of *serious games* experience, three years of *loyalty
  program* experience, and six years of *gamification* experience, consisting of two
  distinct periods. Throughout the entire time, I was driven by the exact same vision
  of applying game principles to impact the world. Call me lazy, but I’d rather just
  refer to my work as gamification and start producing results that make a difference
  in the world instead of arguing about what I can and cannot do as a gamification
  professional.


  I’ve written about how I (along with many “gamification professionals”) am not a
  big fan of the word “Gamification.” This is mostly the term that the industry has
  adopted. I have preferred the term “Human-Focused Design” (as opposed to Function-Focused
  Design), which is a design process that remembers the human motivations within the
  system.


  On a similar note, I also dislike the term “serious games,” as it implies that pure
  games are not serious – something that millions of serious gamers out there would
  heavily disagree with. Think how many sports athletes would be offended if they
  played basketball for a charitable cause, and people called that the “Serious Sports”
  industry.


  Then there are the more “corporate-appealing” terms like Motivational Design, Behavioral
  Economics, or Loyalty Programs, which have many blends and overlaps with the vague
  term “gamification.” Many out there claim that Loyalty Programs are not considered
  gamification but would then argue that airline reward miles are one of the best
  examples of gamification.


  Further following the battle semantics, many game-based solution enthusiasts like
  Sebastian Deterding and Jane McGonigal disagree with so many principles from most
  of the “mainstream” gamification experts and platforms, that they came out and expressed
  that, if that was gamification, they wanted nothing to do with it. They prefer the
  term “Gameful Design” to the word Gamification, which they sometimes regard as the
  ascended form of gamification¹⁶¹⁷. Along with Deterding and McGonigal, many other
  critics of gamification claim that implementations of mainstream gamification are
  uninspiring and manipulative.


  At the end of the day, instead of arguing about what is and isn’t included in umbrella
  terminologies, wouldn’t it be much more productive for everyone to say, “Lets make
  everything better with the lessons we’ve learned through so many hours of game-play
  in our lives”?


  Of course, people inevitably have long discussions on semantics, and therefore it
  makes sense to have a structured way of thinking through the entire conversation
  so you can communicate with your colleagues or superiors.


  ## Tomato: Fruit or Vegetable


  In my opinion, serious games and advergames should actually be included in gamification,
  as they are utilizing game design to achieve a non-game productive result.


  There’s often a blurry line between the “is a game” versus the “is not a game” spectrum.
  For instance, sometimes it is difficult to say whether something is a “game” that
  trains people, or rather just “training that is gamified.” You could say that a
  game that trains employees to have good conduct is a “serious game,” but you can
  also say that they decided to gamify their training program. According to my own
  definition, it feels like you could “gamify” training by introducing a “serious
  game,” but you can’t gamify that very serious game once it is created. Now since
  it is already a game, you can only apply better game design to it instead of “gamifying”
  it. You can see how this conversation can quickly become non-constructive.


  In my own TEDx talk in Lausanne, Switzerland, I brought up 8 world-changing concepts
  in gamification, each representing one of the Core Drives in the previous chapter¹⁸.
  I mentioned that my favorite gamification example for Core Drive 3: Empowerment
  of Creativity & Feedback was the “Serious Game” FoldIt. To some, that statement
  might have caused a heart attack.


  My example for Core Drive 5: Social Influence & Relatedness was DragonBox, which
  is a learning game; for Core Drive 8: Loss & Avoidance, it was “Zombies, Run!” which
  is a fitness game to motivate you to run more. Some don’t consider them gamification
  examples since they are already games (as opposed to just plastering badges on something
  boring).


  Again, if there is a way to utilize things we have learned from games to make the
  world better, why work so hard to limit yourself in how you approach it? The audience
  clearly did not care and were inspired about the



  将我们生活中的一切演变成有趣、动态或更游戏化的潜力。


  顺带一提，从生物学分类来看，番茄是水果，但在烹饪中被当作蔬菜。这一点可能对专业园艺学家更重要，而不是对那些只在乎准备和享用健康美味餐点的人。


  ## 显性游戏化：实现非游戏目的的游戏


  抛开什么算游戏化、什么不算游戏化的争论，我认为更有成效的做法是，根据执行方式以及不同类型玩家对它们的反应，将游戏化分为两类。我在自己工作中采用的两种游戏化实现方式分别是“隐性游戏化”和“显性游戏化”。


  *显性游戏化*指的是采用明显具有游戏感的应用策略。用户清楚自己正在玩游戏，通常需要主动选择参与。一个例子是*迪肯贝·穆托姆博的四个半月拯救世界*[^19]。这是Old
  Spice推出的一个有趣又古怪的“广告游戏”，一位著名的篮球传奇人物试图在2012年“世界末日”来临之前，在一个8位视频游戏世界中完成一系列挑战来拯救世界。当然，Old
  Spice的强化道具和植入广告会在游戏中反复出现。这不仅是在营销中运用游戏设计技巧的典型案例，更是直接用游戏本身来做营销。


  *麦当劳大富翁游戏*也是显性游戏化的一个好例子[^20]。每个人都知道自己在玩游戏，但游戏的核心目的是让人们再次光顾麦当劳，吃更多薯条——这一点毫不隐晦。我们将在第9章中结合游戏技巧第16条“收集套装”来更详细地审视麦当劳大富翁游戏。


  其他有趣的显性游戏化例子还包括著名的严肃游戏*FoldIt*，它推动了艾滋病研究[^21]，以及AutoDesk的*Undiscovered Territory*[^22]，这是一款为销售其非常昂贵的3D成像软件而创建的游戏。还有一些显性游戏化的例子，比如*Repair
  the Rockaways*[^23]，这是一款类似于Farmville的游戏，但可获得的砖块数量取决于为支持飓风桑迪灾后重建而捐赠的金额。


  再说一次，这些例子都是人们参与并主动选择投入的*游戏*，因此被称为“显性”游戏化。为显性游戏化设计的好处在于，产品通常更有趣味性，也让设计师拥有更大的创作自由。缺点则是它可能被某些目标用户视为幼稚、不严肃或令人分心，例如企业、银行或制造企业。一些企业管理者看到图形化的游戏画面时，会立刻产生反感；但如果设计得当，这种交互式“游戏”能让目标用户保持更长时间的投入，从而带来更好的业务成果。此外，要实现优秀的显性游戏化，通常往往需要投入更多资源来打造高质量的游戏。


  ## 隐性游戏化：利用游戏元素的人本设计


  *隐性游戏化*是一种将游戏化技巧和八角行为分析的八大核心驱动力巧妙地融入用户体验的设计形式。隐性游戏化技巧充满了游戏设计元素，有时甚至让用户完全察觉不到。这就像门把手一样，最好的设计是那些你甚至没有意识到，但顺手就用它开门的设计。


  隐性游戏化的例子常在游戏化文献中被讨论，例如LinkedIn的进度条[^24]、驱动维基百科的内在动机[^25]、通过eBay进行的竞价和反馈系统[^26]、Opower中的社会比较和激励[^27]，以及Woot!中的不可预测性和稀缺性[^28]。


  看到LinkedIn上的进度条时，大多数人不会说：“啊，他们在让我玩游戏！我不想玩游戏。”进度条只是温和地构建了一个胜利状态，让用户看到它，并激励他们离目标越来越近。当然，许多积分、徽章、排行榜和等级也常见于隐性游戏化中。


  隐性游戏化的优点在于技术实现上更容易，并且适用于大多数场景。隐性游戏化的缺点是，这种太过便捷的实现方式常常会导致“偷懒”的设计——微妙的游戏动力被错误地设计，粗制滥造地拼凑在一起。这会导致一些完全不成形或在驱动业务指标方面毫无效果的结果。


  ## 显性游戏化与隐性游戏化


  归根结底，一种游戏化类型并不天生优于另一种。合理运用隐性游戏化还是显性游戏化，取决于项目的目的以及你的目标市场。有些群体喜欢参与游戏；有些则不喜欢。有些人在购买时想要那种肾上腺素飙升的快感，而另一些人则想扩展创造力并掌握学习曲线。当然，所有八大核心驱动力都可以应用到隐性游戏化和显性游戏化的活动中，我们将在后面的章节中探讨。


  虽然争论游戏化的包含与排除范围并无意义，但根据目标、情境背景和文化期望，理解哪种实现方式最适合你的设计项目却非常重要。再次强调，归根结底，游戏化绝不应该是一种“一刀切”的解决方案。所有游戏都有游戏元素和游戏机制，但大多数游戏并不成功，只有少数精心设计的游戏才会极具吸引力。游戏化需要精妙的设计才能真正有效，并在玩家与游戏创造者之间建立持久的关系。


  ## 游戏化的四大应用领域


  既然我们已经介绍了游戏化的不同实现方式，接下来我们将探讨游戏化在几个行业中的各种应用。


  总的来说，我的大多数客户分布在四个领域，这些领域不断推陈出新，显示出巨大的应用潜力和增长空间：


  - 产品游戏化

  - 职场游戏化

  - 营销游戏化

  - 生活游戏化


  ## 产品游戏化


  产品游戏化是通过游戏设计，让线上或线下的产品更具吸引力、更有趣、更能激发灵感。大多数公司都难以创造出让客户喜爱、持续使用并热情分享给朋友的产品。其中一些产品具有出色的“功能性”用途，但没有关注用户的动机和核心驱动力。


  在过去的时代，消费者缺乏足够的信息，习惯了延迟满足。再加上创办新公司的巨大门槛，只要产品营销得当，公司即使仅仅假设客户会使用自己的产品，也不会带来太大的坏处。然而，如今人们通过互联网被即时满足所宠坏，通过游戏获得沉浸式赋权和实时反馈，并与社交网络保持持续连接。你的用户、客户和员工对未考虑其动机的糟糕设计产品越来越难以容忍，尤其是当他们可以从众多竞争性替代品中做出选择时。


  许多企业和初创公司兴奋地告诉我：“我们的产品很棒！用户可以做到这个；用户可以做到那个；他们甚至还可以做这些！”而我的回答是：“是的，你告诉了我你的用户能做哪些事情。但你还没有向我解释，用户为什么要这么做。”


  这就是大多数公司产品的问题所在——技术先进、功能齐全，却没有吸引力。人们没有理由非要费心去使用这个产品。有时候，一位创业公司创始人会告诉我：“嘿，



  Yu-kai，“人们没理由不用我们的产品。我们帮他们省钱，帮他们省时间，让他们的生活变得更好。”在幸运的日子里，客户自己也会说，“是的，没理由我不用你们的产品。它帮我省钱，帮我省时间，让我的生活更好。我明天一定会注册。”


  对于那些曾经经营过初创公司或推出过产品的人来说，你知道整句话的关键部分是结尾。当人们说他们会“明天”做某事时，更多时候意味着“永远不会”。这是因为在这一点上，他们的动力来自核心驱动力
  8：损失与规避，具体来说就是我称之为现状懒惰（游戏技巧 #85）的东西——他们在回避自己习惯和行为的改变。


  还记得我们谈过游戏化实际上是源自数十年甚至数个世纪的游戏设计经验的人本设计吗？当你推出新产品时，其动机地位与游戏非常相似。没人必须玩游戏。你必须缴税；你必须去上班；你也应该去健身房。但你永远不必玩游戏，而且说实话，很多时候你也不应该玩。


  因为游戏投入了惊人的创造力、创新和资源来弄清楚如何让人们更愿意在上面花费更多时间，所以你绝对可以从游戏中学习很多优秀的经验来应用到自己的产品中。这里的关键是让产品如此令人兴奋，以至于客户对使用你的产品上瘾，并迫不及待地想向朋友分享他们多么令人兴奋的体验。


  ## 工作场所游戏化


  工作场所游戏化是创造环境和系统的工艺，以激励和激发员工投入工作。更常见的是，员工每天上班只是为了赚取薪水（核心驱动力 4：拥有与占有）和不丢掉工作（核心驱动力
  8：损失与规避）。因此，员工只会努力工作到足以赚到薪水并保住工作为止（如果你还记得，核心驱动力 4 和 8 是左脑、外在和黑帽动机的绝佳例子）。


  事实上，盖洛普的 142 国研究显示，只有 13% 的员工被归类为对工作“投入”²⁹。与之相比，24% 的劳动力被归类为“积极不投入”，这意味着他们对工作如此不满，以至于会降低生产力、传播负面情绪，甚至破坏需要他们做更多工作来保住工作的生产性努力。


  这真的是件令人害怕的想法。这意味着，很可能，你的公司四分之一的人是有毒的！如果一个有机体的 24% 由癌细胞组成，它怎么能在任何事情上保持竞争力呢？


  与流行的自我否认相反，员工脱离投入并不是他们的错。像 Zappos 和 Google（尤其是在过去）这样的公司以让员工每天都对工作感到有动力、驱动和兴奋而闻名³⁰³¹。我坚信每个人都有能力和渴望为值得他们付出的事业而变得有动力和驱动。是糟糕的环境和文化设计让好员工变成了有毒的细胞。


  当然，你不需要盖洛普的研究就知道员工在工作上有多脱离投入。只要想想你身边的人有多常抱怨他们的工作或他们的老板。想想电影《办公室空间》，这部关于美国典型单调、僵化和压抑的公司生活的经典喜剧³²。这部电影如此受欢迎并成为邪典经典，正是因为人们能够真正体会到电影中角色的挫败感和脱离投入（这是一个很好的“关联”在核心驱动力
  5 中发挥作用的例子）。


  为什么这很重要？因为研究表明，平均而言，那些拥有脱离投入和缺乏动力的员工的公司，与拥有投入和有动力的员工的公司相比，仅能获得 50% 的利润和 40% 的收入增长。³³
  如果我告诉你，你可以通过仅仅让工作场所更具吸引力和激励性，而无需开拓新市场，也无需引入新的突破性技术，就能将利润翻倍并将收入增长提高 250%，你会这么做吗？大多数人会说会。但根据我自己的亲身经历，


  仍然会有人说不，仅仅因为，“我不想让我的员工玩游戏。这会分散注意力！”


  工作场所游戏化对于当今经济和未来创造性创新至关重要。进入劳动力市场的 Y 世代（他们现在三十岁了）习惯于身处提供史诗意义、关联性、自主性等的环境中。随着更年轻的世代进入劳动力市场，这种情况只会变得更糟，因此公司明智的做法是尽早建立正确的动机系统，以避免出现劳动力过剩但人才短缺的灾难。


  ## 营销游戏化


  营销游戏化是创造整体营销活动的艺术，让用户参与到为产品、服务、平台或品牌设计的有趣且独特的体验中。没多久以前，人们会点击在线广告，因为更多时候他们无法区分广告和内容。但如今，用户在过滤不需要的推广方面变得更加精明，降低了许多广告活动的有效性（很大程度上要归功于广告拦截应用）。


  然后你还有电视广告，每个人都只是调出声、换台，或如果他们有 TiVo 就快进。至于其他传统方法，如广告牌或报纸上的广告……别让我开始了。


  在过去十年中，搜索引擎营销（SEM）和搜索引擎优化（SEO）已被证明是获得曝光和提高销售的有效技术。事实上，搜索引擎只是一个大型排行榜，而搜索引擎优化行业本质上就是攀登该排行榜顶部的游戏。这之所以有效，是因为
  1）你可以针对正在搜索你确切解决方案的合适人群，2）你可以在他们搜索的正确时间针对他们。


  然而，SEO 和 SEM 在在线营销中仍然缺乏*信任*成分。如果你信任并关注了两年的网站出售你需要的东西，你可能不会去搜索引擎上搜索随机网站来购买。


  于是出现了社交媒体营销。通过博客、Facebook、Twitter 和 Youtube 等平台，品牌能够与潜在客户建立关系、创造独特价值，并建立信任以带来未来的参与。不幸的是，社交媒体平台只是传递引人入胜内容的渠道；它们本身并不能激励或成功地与用户互动。


  这就是游戏化发挥作用的地方。营销游戏化特别利用游戏元素和策略贯穿玩家的旅程，首先关注用户为何会与你互动。营销不应只是营销者做一个动作、客户做出一个回应的单向行为，而应是一个完整的生态系统，在其中营销者和客户都能够体验乐趣并通过各种互动持续保持投入。


  营销游戏化利用上述平台和载体以及其他方式：SEO、社交媒体、博客、电子邮件营销、线上/线下竞赛、病毒式传播策略和奖励计划，以在引人入胜且游戏化的体验中持续吸引用户。


  ## 生活方式游戏化


  我在第一章提到，我的生活在意识到我应该把一切都当作游戏时完全改变了。既然游戏化擅长激励人们从事某些活动，为什么不将其应用于激励自己呢？


  生活方式游戏化涉及将游戏化原则和 8 个核心驱动力应用于日常习惯和活动，例如管理你的待办清单、更频繁地锻炼、按时起床、吃得更健康，或学习一门新语言。


  也有许多技术推动因素使生活方式游戏化变得更受欢迎，包括大数据、可穿戴技术、量化自我和物联网³⁴ 等大热趋势。所有这些趋势有趣的地方在于，它使你的所有活动能够



  可以被追踪，从而让你能够管理你的反馈机制和触发器。


  游戏历史上一直能够追踪玩家做出的每一个动作。游戏会自动知道这位特定玩家处于第三关，她拾取了这四件物品，学会了这三项技能，和这六个角色交谈过，但没有和那另外三个角色交谈过，正因为如此，这扇门对玩家来说无法打开。


  游戏会记住你所做的一切，并基于此定制你的体验。在现实生活中，你的大部分“数据”都没有被记录，因此很难打造一个优化的生活方式。随着可穿戴技术和量化自我的趋势，我们终于能够在日常生活中追踪更多自己的行为。当然，即使是声称掌握大数据能力的公司，其定制化程度也还远不及玩家理所当然的游戏水平。许多公司仍然坚持使用概括性的人口统计数据和无法操作的报告，而不是实时为每个用户创造独特的体验³⁵。


  生活方式游戏化分支到多个领域，如职业游戏化、健康游戏化、生产力游戏化以及教育游戏化。它可以用来游戏化宏大的活动，例如实现你的生活目标，也可以用来游戏化非常战术性的活动，例如使用骰子来决定你应该如何奖励自己（这源自核心驱动力
  7：不可预测性与好奇心）。


  由于生活方式游戏化从根本上改变了我的生活，我对它如何帮助人们通过以下方式实现梦想充满热情：1. 找到他们的游戏，2. 分析他们的初始属性，3. 制定他们的技能树，4.
  与盟友建立联系，5. 找到合适的任务，以及 6. 打败游戏。由于这是一个庞大的主题，值得一本书来阐述，我不会在本書中花费时间详细讨论这个话题。


  到目前为止，我们已经铺开了一个涵盖许多术语、概念、核心驱动力、体验阶段、动机本质以及设计实现的大网。不要感到不知所措。在接下来的几章中，我们将开始深入探讨我们已经谈到的所有内容，这将使你对八角框架的基础有更好的把握。


