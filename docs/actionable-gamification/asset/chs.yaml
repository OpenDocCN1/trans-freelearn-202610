  - **简单：** 想想你收集过或对之有独特拥有感的东西。你是否觉得“很有趣”能花时间与它相处，即使从旁观者角度看，你似乎什么也没做？

  - **简单：** 想想你生活中出现的阿尔弗雷德效应。它们是如何实现的，你又是在什么时候意识到该效应已经生效？它能否被设计成让用户更早意识到？

