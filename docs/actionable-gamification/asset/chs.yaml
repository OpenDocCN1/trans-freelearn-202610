  Let''s examine two of the most successful commercials in history - both from Apple.


  ## The Crazy Ones in 1984


  The first Apple commercial that reached massive fame and success, is the “1984”
  commercial, aired in 1984’s Super Bowl XVIII on CBS³⁹.


  Neither of these campaigns actually talks about computers or electronics. They don’t
  talk about specs, RAM, color screens, or computers. You’re not even sure what they
  sell if you are unfamiliar with the company.


  They sold a vision.


  When people connect with a statement like, “Because of Apple Computers, 1984 will
  not be like Nineteen Eighty-Four,” many started to think, “Wow! That’s amazing!
  I don’t know what they do, but I want to be part of this!”


  How do you “be part of it”? You buy the Macintosh computer.


  Similarly, when people hear the deep wise voice concluding with, “Because the people
  who are crazy enough to think they can change the world, are the ones who do,” they
  become inspired and think, “Yes! I’ve always been hiding my true passions to conform
  with what people expected of me. I want to be one of the crazy ones that changes
  the world!” And of course, the way to think different and change the world is to
  buy an iPod and have a thousand songs in your pocket.


  See the power of Epic Meaning & Calling? When every other company is selling how
  amazing their computers are, Apple sells a vision worth believing in. Interestingly,
  when Apple was developing the Think Different campaigns, the first rule was that
  there would be no products in the commercials. This is so counterintuitive, yet
  so *Human-Focused*.


  As long as Apple can continue to make people think that it is a vision worth believing
  in, their customers will continue to be “Apple People” and buy Apple products. But
  if one day Apple does something stupid and breaks the trust of being a vision worth
  believing in, people will stop blindingly purchase their products and will begin
  to look at the specs again.


