  Winston Wang 不仅作为针灸师保护我的健康，而且在我情绪脆弱的时刻始终在我身边，成为我最亲密的朋友。


  我想再次感谢 Ping-Hsiang Chen 在五年级时教会了我关于魅力型领导力的第一课。没有你，我可能在整个学生生涯中都会成为欺凌的目标。我想感谢 Yi Chou
  以他对弹吉他不断追求更好的执着态度激励了我，并展示了一种更具核心驱动力 6 风格的个人魅力。我想感谢 Chris Schedler 坚持不懈地把我带向基督，尽管我连续六周给他尴尬的拒绝。我希望有一天我能拥有你曾经在我身上拥有的那种勇气。


  我想感谢 Todor Gogov 让我在堪萨斯做外国人不仅可以忍受，而且令人愉快。我想感谢 Curtis Lo 帮助我在南帕萨迪纳高中坚持度过最后一学期。令人惊讶的是，那是我一生中最困难的学术学期。我想感谢
  Jun Loayza 在 UCLA 期间以及我大部分职业生涯中成为我的好朋友。你改变了我的生活，就像我改变了你的生活一样。我想感谢 Stephen Johnson
  让我得以成为科技企业家，并与他一起真正开创了一些最早的游戏化概念。我一生中最美好的（也 arguably 最糟糕的）一些时刻都是与你一起度过的。我还要感谢 Joris
  Beerda，我的学生转任的合伙人兼 Octalysis Group 的董事总经理，在我试图完成这本书时一直保持着公司的平稳运营。


  我想感谢 Frank Jwong 是第一个相信我并作为天使投资人写下我第一张支票的人，以及 Vicki Young 敢于对像我这样的年轻企业家进行第一次大胆投资。我想感谢
  DJ Martin 在我生命中最黑暗的时期作为投资人给予我最大的情感支持。我将尽我所能用余生帮助你。我想感谢 Bernie Grohsman 教我如何成为更有说服力的顾问，并在我从科技企业家转型为全职顾问时把我扶起。


  我想感谢 Wayne Silby 成为我的榜样并指导我生命中许多道德选择。我希望有一天我能在这个世界上创造出与你一样多、甚至今天仍在创造的积极影响。最后，我要感谢我的信仰之神耶稣基督对我的一切。


  显然，我旅程中还有大量的人需要感谢，我无法全部列出。但我的心意献给你们每一个人，我希望我也为你们的生活带来了积极的改变。永远不要犹豫联系我，寻求我能帮助你的任何事情。


  最后但绝对是最重要的，我要感谢你，读者，阅读我的书，让我两年的专注磨砺变得真正有意义。感谢你将宝贵的时间投入到我的话语中。我希望它对你来说也同样具有冲击力和意义。


  谢谢。


