  ## Your Parents are Bigger Than You!


  ![](img/dc8d9e3cff6b1fc564373e52e04f2347_74_0.png)


  Some people mistake Octalysis and Gamification as technology solutions that are
  expensive to implement. In reality, they are design systems focused on motivation.
  So if the activity relates to motivation, you can apply gamification to it. Just
  like games – you can play with a complex 3D Virtual World technology like World
  of Warcraft, or you can play Hide-And-Seek, something that requires no technology
  at all. Children these days have both World of Warcraft and Hide-And-Seek available,
  and the last time I checked they still enjoy Hide-And-Seek.


  Because of that, we can even apply Octalysis Gamification to things a bit more abstract,
  such as parenting. Parents often use two main Core Drives to motivate their children
  to behave well - Core Drive 2: Development & Accomplishment (reward when the child
  behaves), as well as Core Drive 8: Loss & Avoidance (punish/ground when the child
  does not behave).


  However, the Chinese culture has “figured out” how to implement Core Drive 1: Epic
  Meaning & Calling into parenting, through the meaning behind a term known as “孝”.
  Pronounced “Sheeow,” (or “Xiao” in correct Pinyin spelling, but most people don’t
  know what to do with the X). It has no direct English translation, but it is a concept
  that translates into a belief that since the first day of your birth, you are indebted
  to your parents who you owe your life and existence to. As a result, “孝” mandates
  that you need to do everything possible to honor them and lift them up.


  There are even popular expressions and idioms in Chinese literature such as “不孝之子,
  天地不容,” which means, “For a son without ‘孝,’ there is no space/tolerance for him
  in heaven or earth.” This means that if you do not have “孝,” you are such an epic
  scumbag you don’t even deserve to have ever existed; both the heaven and the earth
  are so disgusted by your existence they are literally spitting you out of their
  presence.


  Some sources translate the character “孝” to mean “Filial Piety” – “a virtue of respect
  for one’s parents and ancestors.” Yet, having grown up with this term I feel it
  goes a long way beyond the word “respect.” When I was little and just started to
  comprehend the world, I remember reading or listening to the thrilling and sometimes
  gruesome stories of the well-known children of “孝” in Ancient China. These children
  would fight tigers to protect their parents, warm up their parents’ mattresses before
  bedtime, or cut off their own flesh in order to feed their hungry parents. In one
  story, a sixty year old man of “孝” pretends to play on the ground in a humorous
  way in order to entertain his eighty-year-old parents. (Note: regardless of the
  tactics to educate such Epic Meaning & Calling, “孝” is truly a great virtue that
  is slowly being lost in a globalized “flat world” of instant gratification and self-centeredness).


  Other examples of “孝” in the 24 Paragons of Filial Piety⁴⁷ include:


  - a man sells himself into slavery to pay for his father’s funeral

  - a man tastes his sick father’s stool to understand the health of his father

  - a woman cooks part of her own liver to feed her mother

  - an eight year old boy attracts mosquitoes to suck his blood so they won’t bother
  his parents

  - a father decides to bury his three year old son so he can afford to care for his
  own mother. While digging the hole, he finds treasure and doesn’t have to kill his
  son.


  While some of these actual stories are disturbing, it illustrates how important
  “孝“ is as a value within the culture. Of course, parents aren’t just hypocritically
  manipulating their children. The children who see their parents treat their grandparents
  poorly, regardless of whether these stories are told to them, will most likely not
  buy into the Epic Meaning of 孝. This is an important factor in using the motivation
  elicited through Core Drive 1 - it must feel authentic.


  In Traditional Ancient Chinese Culture, when one’s parents pass away, they need
  to dress in mourning attire, abstain from all entertainment and sometimes meat,
  as well as exclude social relationships for three entire years to express his grief.
  This act is called “守孝”, which literally means “guarding 孝” and was traditionally
  set to be three years because Confucius stated that it takes three years for us
  to leave our parents’ arms; hence, it is proper to spend three years mourning for
  them. Of course, in today’s modern society, much of the three-year mourning is lost
  and reduced to days or weeks as a symbolic gesture to honor one’s parents.


  And because of this culture of “孝,” Asian children grow up feeling that they have
  to do a lot for their parents – they have to study hard, they have to get into a
  good school that their parents can be proud of, they have to support their parents
  throughout life, they should live with their parents to always be available and
  make sure everything is taken care of for their parents’ life-long wellbeing. As
  an example, I have a close relative in his fifties who has left his wife and son
  in the United States for close to a decade now - so he could live with and take
  care of his aged mother in Taiwan; only visiting his immediate family a few times
  each year.


  In contrast, in many Western societies where the concept of “孝” is not as prevalent,
  people still respect their parents immensely. However, once they form their own
  families, they generally become more disconnected and simply bring their children
  to grandpa and grandma once or twice a year, instead of constantly making life decisions
  that are tailored to their parents.


  Even today, if my parents told me I don’t have 孝 because of any behavior, it would
  crush me emotionally and motivate me towards almost anything to amend for it. Just
  because I understand the nature of the motivation does not mean I am exempt from
  it. It is something deeply ingrained within me and my values. In similar faith,
  my parents have never made that accusation towards me, because it would be one of
  the greatest insults a parent could give a child. It is that serious and tangible
  when it comes to this type of motivation.






  ## 游戏技巧在史诗意义与使命中的运用


  现在你已经了解了核心驱动力 1：史诗意义与使命的主要概念，问题是如何将其实现到你的体验中。下面我将介绍几种游戏技巧，如果设计得当，可以激发史诗意义与使命的感觉。请记住，在我的术语中，当我提到游戏技巧时，我指的是结合游戏元素（包括游戏机制）来驱动动机的技巧。


  你还会注意到，每个提到的游戏技巧后面都跟着许多“游戏技巧编号（#s）”。这些游戏技巧编号是源自我的网站 YukaiChou.com 的寻宝游戏的一部分。我的读者会尝试收集所有编号，这些编号最终将在未来为
  Octalysis 带来一些令人着迷的应用。


  需要记住的一个关键点是，Octalysis 设计框架的整个前提是，不应过于执着于游戏机制、游戏技巧或设计的任何外在表现。相反，应专注于核心驱动力以及它如何以可操作的方式激发动机。游戏技巧以及相关的编号都只是优秀动机设计的点缀。如果不专注于核心驱动力，它只会拥有一个引人入胜的游戏的外壳，而非本质。


  ### 叙事（游戏技巧 #10）


  大多数游戏都以一个叙事开始，为玩家提供**为什么**应该玩游戏的背景。许多叙事都与拯救世界、公主、破案有关，甚至只是帮助一只龙或鳄鱼洗澡。那么为什么不利用叙事为其他事物提供背景呢？


  将史诗意义与使命灌输给用户群体的更有效方式之一是通过引人入胜的叙事。这使你能够引入一个故事，通过与你的公司、产品或网站的互动，为人们提供更高意义的背景。


  Zamzee，一家为儿童提供“可穿戴技术”的公司，利用叙事为儿童灌输史诗般的幻想，以激励他们多锻炼。通过其在线软件界面，Zamzee 为孩子们提供幻想任务，例如成为一名巫师学徒。为了学习你的第一个咒语，你需要上下楼梯跑
  15 次。即使该行为本身与叙事脱节，仅让他们假装具有魔法的意义就能激励孩子们多锻炼，因为他们现在受自己想象力的驱动。Zamzee 表明，参与这些想象任务的孩子比不参与的孩子多运动
  59%。48


  ### 人类英雄（游戏技巧 #27）


  如果你能将世界使命融入你的产品中，就能在入职过程中获得更多认同。有一家公司在灌输人类英雄感方面做得非常出色，那就是 TOM’s Shoes，每当你向他们下单时，他们就会向第三世界国家的儿童寄送一双鞋子49。你每次购买都能帮助弱势儿童的想法极具激励性。此外，当顾客穿着这些鞋子时，他们会让他人知道自己正在帮助世界，这就是核心驱动力
  5：社会影响与归属感中的奖杯架（游戏技巧 #64）的一种形式。


  *FreeRice* 是另一个利用人类英雄技巧的例子。FreeRice.com 是一个网站，每当你在其网站上正确回答教育问题时，就会捐赠 10 粒大米。资金来自广告以及回答问题所产生的页面浏览量。迄今为止，FreeRice
  已捐赠了 6100 公吨大米，共计 930 亿粒大米，足以养活 1000 万人。50


  通常，如果你能将你的系统与许多人关心的事业联系起来，你就可以建立一个以他人善意为基础的整个业务。


  ### 精英主义（游戏技巧 #26）


  允许你的用户或客户基于种族、信仰或共同兴趣形成自豪的群体，也会让他们觉得自己是更大事业的一部分。精英主义灌输群体自豪感，这意味着每个成员都会通过采取特定行动来维护群体的自豪感。群体还会试图挫败其对手，这可能导致双方为了击败竞争对手而加大行动力度。


  这就是为什么大学竞争如此引人入胜。当我在 UCLA（加州大学洛杉矶分校）就读时，很难不感受到对 USC（南加州大学）的强烈竞争。从大一新生入学指导（入职）开始，就不乏内容和笑话来营造与
  USC 的竞争氛围。在体育赛季期间，这种竞争达到顶峰，双方会激烈地、甚至暴力地互相侮辱。甚至还有印有文字的 T 恤：“我最喜欢的两支球队是 UCLA，以及正在与
  USC 比赛的球队。”


  ![](img/dc8d9e3cff6b1fc564373e52e04f2347_79_0.png)


  双方都认为这种竞争大于自身，并凭借新灌输的精英主义感，参与许多不理智的活动，因为他们“应该”作为该校的自豪代表这样做。


  即使竞争对学生来说引人入胜甚至有趣，谁从这些竞争中获益最多？更常见的是，大学本身。创造一个学生“应该痛恨”的外部敌人，会创造更多的“学校精神”，学生们会团结在一起并在狂热中做出*期望的行为*。与


  相信上帝只是为了善待同胞，因此他们也增加了捐款。同样，双方的贡献都比原本会做的更多，仅仅因为他们觉得自己是在为比自己更大的目的而做——保护他们群体的声誉。 （免责声明：我本人是基督教信仰者）。


  ### 新手运气（游戏技巧 #23）


  新手运气专注于史诗意义与使命中的*使命*部分。使命让人们认为自己注定要做某事。与新手运气一起，人们会觉得自己是少数被选中采取行动的人——这使得他们更有可能采取行动。如果一名游戏玩家在玩游戏的第一天，随机获得游戏中其中一把最强大的剑，甚至资深玩家也难以轻易获得，那么他很可能不会在第一天就退出。他很可能会用那把强大的剑疯狂地杀怪，直到游戏中的下一个钩子出现。


  游戏设计师很可能会通过设计奖杯架（游戏技巧 #64）来加入社会影响与归属感（核心驱动力 5），奖杯架是允许用户隐式展示他们引以为傲之物的机制。如果游戏设计师还通过护城河（游戏技巧
  #67）加入稀缺与不耐烦（核心驱动力 6），告诉用户他只有在击败某个特别困难关卡的所有对手后才能装备这把剑，那么用户现在就会痴迷并想尽一切办法征服该关卡。


  ### 免费午餐（游戏技巧 #24）


  沿着“使命”主题，给特定人群提供 normally not free 的免费赠品，并以将其与更大主题联系起来的方式赠送，可以让客户感到特别并鼓励他们采取进一步行动。


  例如，Spoleto 是一家巴西连锁餐厅，在巴西、西班牙和墨西哥拥有超过 200 家餐厅，它在国际妇女节之际，向任何告诉他们自己很漂亮的女性提供了一顿真正的免费午餐。52
  这有助于推广积极的信息并让女性


  活动背后的目的，并当正确引入时加强其他七个核心驱动力。在后面的章节中，我们还将探讨一些公司如何利用史诗意义与使命（以及其他白帽游戏化核心驱动力）来激励员工更有激情地工作，并在其他公司提供更大金钱激励时仍留在组织中。


  核心驱动力 1：史诗意义与使命的弱点在于实施可信度的难度，以及动机中缺乏紧迫性。虽然人们不断渴望成为更大事物的一部分，并在真正采取行动时会感到很棒，但他们往往会拖延和推迟这些行动。因此，为了创造期望的行为，游戏化设计师需要
  Octalysis 中其他核心驱动力的帮助。


