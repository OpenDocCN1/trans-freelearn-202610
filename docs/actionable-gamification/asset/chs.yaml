- '# 第 15 章：用 Octalysis 理解其他游戏化和行为框架


  到目前为止，我们已经涵盖了 Level I Octalysis 设计中几乎需要学习的一切。我写这本书的目标是深入探讨一种方法论和框架（也就是我自己的框架），然后在掌握这个框架之后，用它来理解其他框架。


  2012 年，当我参加全球最大的游戏化会议——年度 GSummit 时，我对那些知识渊博的专家小组成员和演讲者留下了深刻印象。然而，我猜想普通与会者可能会被会议上呈现的各种演讲和框架弄得不知所措——从
  Richard Bartle 的四种玩家类型、Mihaly Csikszentmihalyi 的心流理论、Nicole Lazzaro 的 4Keys2Fun，以及其他大量框架！


  归根结底，虽然与会者对于游戏化改变世界的潜力感到兴奋和鼓舞，但他们可能仍然对下一步该做什么感到困惑。所有这些框架放在一起，似乎传达了关于大脑的抽象知识。但如何以整体反映我们思维的方式将它们连接起来，这个问题很难回答。当人们需要为各种项目确定使用哪个框架时，这就变得更加困难。


  正因为如此，我希望我的读者能够深入理解我自己的模型，而不是对不同概念只有肤浅的了解。但我也希望我的读者了解其他著名的游戏化理论以及动机心理学和行为经济学中的关键模型，这些理论本身都很出色。因此，在本章中，我们将讨论这些概念，并用我们的“Octalysis
  眼镜”来审视它们。


  我喜欢 Octalysis 框架的一点是，它通过将其他专家的研究和发现置于适当的视角，帮助我更好地理解他们的工作。既然我们都拥有相同的大脑，我相信关于大脑和动机的各种研究可以相互融合，提供更丰富的理解。


  希望你对 Octalysis 的理解能帮助你快速领会这些其他框架。当然，如果你想深入了解那些框架，有很多优秀的书籍值得推荐。


  ### 科学研究与游戏研究


  偶尔会有人问我，我的 Octalysis 框架是否是基于对我在本书中提到的所有文献和科学研究的深入研究而创建的。


  事实上，Octalysis 100% 来源于我玩游戏的体验和对游戏的研究。我希望它有一个更令人印象深刻的起源，但实际上，创建 Octalysis 框架所需的一切，都来自我多年玩游戏和分析游戏的经验。这就是为什么我把它视为一个游戏化框架，而不仅仅是像其他人认为的那样，是独立于游戏的单纯心理学和行为学研究。


  框架创建后，我开始研究行为经济学、动机心理学和神经生物学，以确认（或扩展）核心驱动力背后的原理。我知道这些核心驱动力在激励我们，但直到很久以后，我才有科学出版物来支持这一点。幸运的是，大多数听说了我在
  Octalysis 方面工作的人，都能联想到自己的个人经历和观察。这促使他们在我用科学证明*为什么*它有效之前，选择暂且相信我的观点。这是核心驱动力 5 在*关联感*上的一次胜利。


  关于这一点，让我解释一下为什么我认为研究游戏足以获得对动机理论和行为预测的全面理解——欢迎反驳我，我不会生气。


  正如前几章反复提到的，游戏的一个重要方面是你从来*不必*去玩。再说一次，你*必须*去上班，*必须*报税。这些事可能非常令人痛苦，但你仍然只能硬着头皮坚持下去。我称之为“被污染的动力”。


  但是在游戏中，没有人*必须*去玩。一旦游戏不再有趣，人们就会离开去做或去玩别的东西。


  在某种意义上，每个游戏都可以被视为一个关于动机和行为的实验。


  我们获得的大部分行为心理学理解，来自于参与者（通常是五十到两百名大学生）被置于受控环境中，并根据某些变量测试其反应的实验。这些经过同行评审的实验结果成为合法的科学研究，让我们深入了解人类思维。


  另一方面，每个游戏都可以被视为一个培养皿，成千上万（甚至数亿）的“测试对象”自愿根据环境变化调整自己的行为。这些大规模的“实验”自然而然地告诉我们，某些体验和机制在影响人类行为方面是有效的还是无效的。


  我喜欢做的事情之一就是研究游戏的“克隆品”，以理解为什么有些克隆品无人问津，而另一些却比原作更成功。当两个游戏看起来几乎相同，但一个（有时是不那么吸引人的那一个）成为爆款，而另一个却失败时，这就创造了一个绝佳的机会去研究设计中那些产生巨大差异的细微元素。有时差异微小到消息弹出前的秒数、挑战引入的顺序，或者经济系统中稀缺性控制得多好。


  从我自己的研究来看，这些细微差异在游戏化甚至游戏设计文献中并未得到充分覆盖。但我发现它们对体验的成功最为重要——比图形、动画甚至主题都更重要。归根结底，问题不在于是否


  还记得之前我们谈到游戏是如何结合行为经济学、动机心理学、神经生物学、用户体验/用户界面（UX/UI）设计、技术平台，以及显而易见的游戏设计动力学的吗？同样，你需要所有这些元素来创造一款伟大的游戏。


  ![](img/dc8d9e3cff6b1fc564373e52e04f2347_337_0.png)


  在本章中，我们将看到Octalysis如何应用于各种行为心理学和游戏设计理论。对于刚接触游戏化或行为设计的人来说，本章可能有点深奥。如果你不记得或不懂所有其他框架，别担心。如果将来你再遇到它们，本章会帮助你以最全面的方式消化它们。


  ## Octalysis视角下的自我决定理论


  到目前为止，我们已经多次提到Ryan和Deci的自我决定理论。自我决定理论是一种关于动机的理论，用以理解我们以有效和健康的方式行事的自然或内在倾向²⁶⁹。该理论表明，人们并非纯粹通过奖励和惩罚获得激励，实际上更多是通过三个要素获得激励：*能力*、*关联性*和*自主性*。


  *能力*是对自我效能感和精通体验的需求。*自主性*是成为自己生活的动因并控制自己选择的渴望。*关联性*是普遍存在的与他人互动、建立联系并感受被关爱的需求。


  构成学生动机自我决定理论的三种先天心理需求


  ![](img/dc8d9e3cff6b1fc564373e52e04f2347_338_0.png)


  来源：Deci, E.L. & Ryan, R.M. (2000). The "What" and "Why" of goal pursuits: Human
  needs and the self-determination of behaviour. Psychological Inquiry, 11, 227-268.


  如果你从Octalysis的角度来看这个理论，你会注意到能力与核心驱动力2：发展与成就感一致。按照同样的思路，自主性对应于核心驱动力3：创意授权与反馈，而关联性自然归属于核心驱动力5：社交影响与关联性。


  在《驱动力》（*Drive*）一书中，丹尼尔·平克为这一理论补充了第四个要素：*目的*。（他还用了更有吸引力的表述“精通”来重新定义能力²⁷¹。）如果我们戴上Octalysis眼镜，目的可以被视为直接与核心驱动力1：史诗意义与使命感相关联。


  ![](img/dc8d9e3cff6b1fc564373e52e04f2347_339_0.png)


  上图以图表方式展示了自我决定理论对应的核心驱动力。图中非常清楚的是，这些元素也被视为白帽核心驱动力。通过强调*关联性*，自我决定理论也通过核心驱动力5：社交影响与关联性融入了右脑（内在）动机。


  自我决定理论是一个非常好的模型，它认识到积极、白帽和内在动机背后的力量。然而，它并不一定能解释为什么人们会沉迷于赌博，或者为什么排他性本身常常驱动我们的行为。尽管该理论涵盖了动机中的所有积极情绪，但它并未包括行为的“阴暗面”，后者以黑帽核心驱动的形式呈现（通常被视为“非自我决定”的动机²⁷²）。


  考虑到自我决定理论专注于激励员工和学生，尤其是朝向创造性工作，这实际上很有道理。为此，该理论是一个强大的框架，可帮助引导公司为员工创造长期白帽激励环境。


  从第14章我们了解到，由于员工激励需要长期投入，我们通常应在设计中应用白帽核心驱动力。尽管如此，公司也会使用一些黑帽激励技术来激发员工短期生产力爆发（例如机会稀缺、截止日期、社会压力、竞争）。自我决定理论并不关注这些，因为如果应用不当，这类动机可能会导致长期倦怠。


  话虽如此，像Octalysis这样的框架能让你把自我决定理论放在更广阔的视野中，理解它涵盖了什么、没有涵盖什么，从而扩展和微调你对人类行为的理解。


  ## 理查德·巴特尔的四种玩家类型


  游戏设计领域中另一项非常著名的研究是理查德·巴特尔的四种玩家类型²⁷³。理查德·巴特尔是一位游戏研究者，他在20世纪70年代发明了第一个MUD（多用户地牢）游戏，这种游戏后来演变为我们今天所知的角色扮演游戏（RPG）。他意识到，在虚拟环境中，通常有四类主要玩家人群在进行四种不同类型的活动。


  有*成就者*，他们试图掌握游戏系统内所有可做的事。有*探索者*，他们只想出去探索世界中的一切内容，不太专注于克服挑战。有*社交者*，他们进入虚拟世界只是为了彼此互动、交谈和建立友谊。然后是*杀手*——这些玩家不仅力求登顶，还以在过程中击败竞争对手为荣。此外，他们需要沐浴在胜利中，并被所有人钦佩。


  ![](img/dc8d9e3cff6b1fc564373e52e04f2347_341_0.png)


  许多从事游戏化和游戏设计工作的人都在理查德·巴特尔的四种玩家类型基础上进行发展。游戏设计师艾米·乔·金以使用理查德·巴特尔的玩家类型而闻名，并将其演变成为金的社交行动矩阵。在这个模型中，金为各种玩家类型分配动词和行为，以确定如何在游戏中设计一个有趣且引人入胜的环境。这些行为动词变成了：*探索、创造、竞争*和*协作*。（试着看看这些行为动词如何对应各种核心驱动力。）


  ![](img/dc8d9e3cff6b1fc564373e52e04f2347_341_1.png)


  安德烈·马尔切夫斯基也是游戏化领域的一位影响者，他进行了广泛研究，在理查德·巴特尔的玩家类型基础上为企业工作场所构建模型。他得出了六种用户类型以供设计：颠覆者、慈善家、自由灵魂、社交者、成就者和玩家。这些用户类型中的每一种都会受到不同活动和体验的更多激励。


  ![](img/dc8d9e3cff6b1fc564373e52e04f2347_342_0.png)


  这一模型通常被推荐用于工作场所环境，因为理查德·巴特尔本人曾说过，他的玩家类型可能不适用于自愿虚拟世界之外的环境。[^279]


  为简单起见，让我们用Octalysis的视角来审视理查德·巴特尔的四种玩家类型，以了解哪些核心驱动力激励每种玩家类型。这将帮助你确定如何更好地为这些玩家类型进行设计。


  *成就者*主要受核心驱动力2：发展与成就感以及核心驱动力6：稀缺性与急迫感驱动。他们总是在努力完成下一个目标，完成时便感到成就感。当然，在某种程度上，他们也在乎运用创造力克服挑战，以及积累成功的结果（核心驱动力3和4）。


  *探索者*主要受核心驱动力7：未知性与好奇心驱动，这促使他们去发现以前从未见过的新奇内容。其中也包含核心驱动力2、3和6的种子。他们不断运用创造力寻找新方法来测试所有限制他们的边界，当他们成功时，会有一种成就感。


  *社交者*主要受核心驱动力5：社交影响与关联性驱动。他们喜欢与他人交往和建立联系。在较小程度上，他们也会受驱动去思考巧妙的办法更多地吸引他人（核心驱动力3），他们喜欢新的或不可预测的信息，甚至八卦（核心



  Drive 7)，有时会对朋友产生领地意识（Core Drive 4）。


  最后，*Killers* 主要由 Core Drive 2：发展与成就 和 Core Drive 5：归属感的社会影响 的混合体所驱动。他们不仅需要为高目标而努力，还需要他人认可他们的成就并承认他们的优越性。从更小的角度来看，他们也驱动于想出击败竞争对手的最佳方式（Core
  Drive 3）、避免被杀或被视为自己软弱（Core Drive 8），最终，统计他们的胜利和成就（Core Drive 4）。


  ![](img/dc8d9e3cff6b1fc564373e52e04f2347_343_0.png)


  通过上图，我们可以更好地理解这些玩家类型独特的动机，并为他们设计合适的游戏技巧。在你 Octalysis 之旅的后面，你将开始投入大量精力来定义你自己的玩家类型，并利用
  Level 3 Octalysis 设计出独特吸引他们的系统。（不幸的是，我们无法在本书记载的范围内涵盖这一点。）


  那么那些上面未涵盖的其他核心驱动力，尤其是史诗意义与召唤，以及在某种程度上损失与回避，又如何呢？


  Core Drive 1：史诗意义与召唤 可以被任何玩家类型利用：为了实现达到更高目标、被朋友更尊重、探索新区域，以及击败较弱玩家的目标。它只是身处游戏环境本身的背景。但由于
  Richard Bartle 正在创建一个开放的虚拟世界，似乎并没有超越虚拟世界理想主义的更高使命的真正意义。


  有时在虚拟世界中，用户为了他们相信的更高使命而团结起来时，会产生一种较小的史诗意义与召唤感。但这与这里研究的玩家类型无关。


  在 Andrzej Marczewski 的模型中，工作场所中有一个独特的 user 类型叫做 *Philanthropists*，他们从帮助他人中获得快乐，因而获得游戏感。他们受
  Core Drive 1：史诗意义与召唤 的驱动，公司应该鼓励 Philanthropists 的行为，以确保更多的协作努力和更强的团队合作。不幸的是，大多数公司环境惩罚
  Philanthropists，同时奖励那些只追求自身外在回报的人。这些在 Andrzej Marczewski 模型中的 *Players*，高度受 Core
  Drive 4：拥有与占有 的驱动，其目的是最大化他们的奖金、奖励、晋升和加薪。


  就 Core Drive 8：损失与回避 而言，在任何事业中不成功的威胁始终存在。尤其是，如前所述，当 *Killers* 试图避免被羞辱时。然而，并没有真正专注于避免坏事的玩家类型。正如我们所学到的，如果你只受黑帽驱动力的驱动，你根本就不想身处一个开放且自愿的虚拟世界中。这在工作场所往往是另一回事。


  归根结底，这八个核心驱动力在某种程度上驱动着我们所有人，因为我们普遍渴望这些核心驱动力，只是程度和时间不同。Octalysis 框架使我们能够理解某些核心驱动力在某些人身上是否更强，以便我们能够意识到并适当为这些差异设计。


  ## Nicole Lazzaro 的 4 Keys To Fun


  ![](img/dc8d9e3cff6b1fc564373e52e04f2347_345_0.png)


  *4 Keys to Fun* 是另一项由游戏设计师和 XEODesign 总裁 Nicole Lazzaro[280] 创建的设计框架。Lazzaro 花了多年时间研究和设计引人入胜的游戏。基于她的经验，她得出了四种在游戏中吸引人的乐趣类型。


  4 Keys to Fun 是：*Hard Fun, Easy Fun, People Fun,* 和 *Serious Fun.*


  *Hard Fun* 是从克服挫折并实现 Win-State 中获得的快乐。这使玩家处于 *Fiero* 状态，即克服逆境后的胜利感。


  *Easy Fun* 是做有趣活动时获得的乐趣，你不需要很努力就能简单地享受放松和游戏的体验。这在孩子与父母一起玩的游戏中很常见，例如桌游或绘画。


  *Serious Fun* 是因为它对现实世界产生影响而引人入胜的乐趣，例如提升自我、赚更多钱或对环境产生影响。


  最后，People Fun 是因为你与其他人互动并建立关系而获得的乐趣。


  ![](img/dc8d9e3cff6b1fc564373e52e04f2347_346_0.png)


  如果你再次戴上你的 Octalysis 眼镜来理解这一点，你会看到 Hard Fun 是 Core Drive 2：发展与成就 以及 Core Drive 6：稀缺与不耐烦
  的结合——达到 Win-State 的难度和挫折感正是驱动用户动机的原因，以及实现它后的成就感。


  Easy Fun 就像 Core Drive 3：创造力赋能与反馈 以及 Core Drive 7：不可预测性与好奇心 的结合。它就像玩黏土或乐高，你可以随心所欲地做任何事，也不会真正失败。无论你做什么，你都在赢，因为你在享受时光并看到你创造力的反馈。


  具有固有随机性的情况也会激发好奇心，让事情变得有趣和轻松。玩 Yahtzee 或看卡通片让我们在不需要投入太多努力和专注的情况下享受时光。事实上，在游戏设计行业中，人们都知道，使游戏更容易的一种最佳方式（惩罚硬核竞争玩家但惠及主流休闲玩家）是在游戏中增加更多随机性和偶然性281。父亲可以认真地和他五岁的女儿玩骰子游戏而不总是赢，但如果他和她下棋，他可能需要对她手下留情。


  另一方面，*Serious Fun* 可以被解释为 Core Drive 1：史诗意义与召唤 以及 Core Drive 4：拥有与占有 的结合。


  史诗意义与召唤是在一个人从事某项活动是因为他们看到了其在世界上的真实影响时产生的。在每次参与都能让你赚钱的令人振奋的活动中，这是 Core Drive 4：拥有与占有
  的结果。


  *People Fun* 通常是明显的 Core Drive 5：社会影响与归属感 以及在某种程度上 Core Drive 8：损失与回避 的结合。


  这是因为当你与他人协作时，你会承受更大的压力，同时你试图避免表现糟糕、说错话、被排斥，或在排行榜上失去位置。*People Fun* 也延伸出有趣的竞争，而 *hide-and-seek*
  或 *catch* 的刺激往往源于适度的 Core Drive 8：损失与回避。


  当然，我受到了“完整性”感（Core Drive 4）的驱动，才将全部 8 个核心驱动力与 4 Keys To Fun 模型中的每种乐趣类型对应起来。如果你觉得
  Core Drive 8：损失与回避 并非 People Fun 所独有，我也愿意接受这一点。


  ## Mihaly Csikszentmihalyi 的 Flow 理论


  我认为现在是时候转向 Mihaly Csikszentmihalyi 的 *Flow Theory* 了。Csikszentmihalyi 是心理学和管理科学领域的世界知名学者，以创建结合用户技能水平与挑战难度的
  *Flow Theory* 而闻名。


  ![](img/dc8d9e3cff6b1fc564373e52e04f2347_349_0.png)


  The Flow。After Mihaly Csikszentmihalyi, The Flow (1990), p. 74


  正如你在这里看到的，Flow 顶部的区域是挑战远比玩家能承受的更困难。这受 Core Drive 8：损失与回避 的驱动，用户实际上只是努力求生。正如我们已经知道的，这使人们处于极度焦虑的状态。


  现在如果你稍微降低难度相对于用户技能水平，我们现在进入 Core Drive 6：稀缺与不耐烦 的区域。此时用户感到受挑战并偶尔感到沮丧。然而，只要他们迅速采取行动并通过技能或计划跨越一道护城河（Game
  Technique #67），他们就有机会克服挑战并实现 Win-State。


  在 Core Drive 6 下方我们有 Core Drive 2：发展与成就。这是挑战适中且用户感到有成就感和胜任的区域。用户处于 Flow 中，他们感觉自己正在实现目标并建立信心。


  再往下一点我们有 Core Drive 3：创造力赋能与反馈。这是 Flow 的核心，用户再次发挥创造力并调整策略以发现更好的做事方法。这个过程使许多人处于 Flow
  状态，尤其是在 Core Drive 3 和 Core Drive 2 之间快速轮换时——当他们的创造力带来成就时。






  从核心驱动 3 再往下走一级，你会得到核心驱动 4：拥有与占有，这通常是无意识地收集东西、整理东西、把东西拼凑起来的行为——你在类似《农场游戏》那样的游戏中经常会做的事。相对于用户技能水平而言，这通常在难度上要容易得多，并且会让大脑放松。


  大多数情况下，为了满足拥有与占有核心驱动，用户所需要做的只是花更多时间在上面，根据适度的计划采取行动，或是整理他们的系统。没有任何焦虑感。如果设计不当，这有时甚至会产生无聊感。想想那些只是为了薪水而做数据录入工作的员工；任务并不困难，但参与度也不强。


  核心驱动 4 之下是核心驱动 5：社会影响与归属感。这基本上就像去一个聊天室。你不需要太多技能，你只需说出你想表达的任何内容，甚至可以戏弄他人。这在我们第九章讨论过的“水冷器”游戏技巧中经常可以看到。该活动仍然可能很有趣，但它大多非常容易。即使你看不到来自你机智评论的反馈（核心驱动
  3）并给他人留下深刻印象（核心驱动 2），与他人相关的归属感、接纳感和联结感也会让体验变得愉快和放松。


  如果再往下看一个层级，你可以说核心驱动 7：不可预测性与好奇心处于心流的最低层级。我们之前提到过，增加随机性和偶然性是让游戏变得更容易的好方法。大多数赌博游戏、抽奖和彩票不需要任何技能。你基本上只是参与其中，采取期望行为，然后等待结果。这也是为什么玩涉及随机性的游戏，如《大富翁》或《大富翁》（包括机会卡）时，往往比纯技能型游戏如国际象棋产生更多笑声。


  现在你可以争辩说，被核心驱动 7：不可预测性与好奇心所吸引的人并不真的处于“无聊”状态，尤其是当他们在看电影或试图读完一本书时。然而，当你从技能与挑战的视角（心流图表）来看时，用户并不是因为技能使用而享受该活动。他们是以另一种方式被娱乐，这种方式驱动着愉悦感。


  在 Csikszentmihalyi 的一张图表中，如下所示，他将“放松”作为一种状态，即技能远远超过挑战的结果。核心驱动 7 因此不会导致无聊，而是适当的放松。


  ![](img/dc8d9e3cff6b1fc564373e52e04f2347_351_0.png)


  你可以在这里看到，在 *Flow* 模型中，唯一缺失的核心驱动是核心驱动 1：史诗意义与使命。那是因为核心驱动 1 完全超出了玩家技能水平与挑战难度这一背景，因为当涉及到承诺比自己更大的事物时，这两个因素是无关紧要的。核心驱动
  1 并不能真正融入 *Flow* 模型，但它推动了人们为何首先参与任何体验的原因。


  ## 雾行为模型


  斯坦福大学人类行为学教授 BJ Fogg 创建了一个模型，将所有行为归结为三个因素：*动机*、*能力* 和 *触发器*。


  *动机* 是个人想要采取行动或获得期望结果的程度。*能力* 是个人在采取该行动方面的配备程度；换句话说，对用户执行该行动来说有多容易或多方便。第三个因素是 *触发器*，或提醒用户采取行动的东西。


  激励和吸引人。事实上，最受尊敬的 *游戏* 定义之一是“自愿尝试克服不必要的障碍”<sup>285</sup>


  Fogg 本人说，随着你完成你的微小习惯，你的动机会增加，因为你感到有所成就，这反过来又形成了一个积极循环，不断建立在自身之上。最终做更多俯卧撑感觉更容易了，你不需要太多动机来维持这种更高的活动水平。这种思维方式与我们对核心驱动
  2 的理解一致。


  Fogg 通过说，与其“激励”人们去做他们不想做的事，公司应该专注于人们已经想做的事情，只是让它变得更容易，来支持他专注于 *能力* 的策略。


  这很有道理。然而，从我自己的设计经验来看，我们发现即使用户有成为健康的动机，他们不一定有使用你特定健康应用的动机。即使人们想与朋友联系，仍然没有激励他们与朋友分享你的产品的动力，除非你为此设计。而且即使人们已经想做伟大的工作，他们也不一定愿意为一个对待他们很差的微观管理老板而努力工作。在这些情况下，提高老板如何激励员工的方式（通过赞赏、自主性、明确目的等方法）会更有成效，而不是试图让他们令人厌恶的工作变得更容易。


  微小习惯对于个人层面的自我提升目标非常有效，但有时在员工参与或病毒式营销系统方面效果就不那么理想了。如果你只是专注于让事情变得更容易，用户可能无法或无法产生足够的动机来执行你想要创造的新行为。


  产生动机的另一面是通过让事情变得更困难。 从核心驱动 6：稀缺与不耐烦 的角度来看，我们已经通过许多例子看到，当某件事太容易时，人们不一定会欣赏它。


  如果将“让事情变容易”的策略用于约会怎么办？ 假设你想让某个人成为你的伴侣（期望行为），


  所以你邀请那个人出去（一个 *触发器*），但此时他们的动机仍然非常低，因为他们只是在试图弄清楚你是否是一个理想的伴侣。 在这种情况下，如果你尽一切努力让那个人与你约会变得极其容易，比如每周任何一天都随时有空，或每天发送几十条短信让对方可以轻松回复（*触发器*
  和 *能力* 提升）——根据我自己的经历……我的意思是，我的观察来看，这不会很成功。嘘。别笑。


  有时适度收敛会增加期待和悬念，从而产生动机。 结果是，尽管期望行为的难度增加，稀缺性却创造了更多期望行为。 我们在之前的章节中已经看到，给用户制造不便或从交易中退出（如果做得正确），也可以严重提升动机和行动。


  所以虽然 Fogg 的行为模型本身在理解行为及其影响方面极其有用，但 Fogg 和我对改善流程的可行步骤得出了略有不同的结论。 具体来说，Fogg 专注于他模型中的
  *能力* 方面，而我专注于 *动机* 方面。 当然，我也在努力提高每个期望行为的易用性，我相信 Fogg 也会花时间提高动机；我们的优先事项似乎只是不同。


  话虽如此，确实大多数产品都过于复杂和难以使用，让用户感到愚蠢和沮丧（反核心驱动 2）。 这在入职阶段尤其是一个问题，当用户没有足够的动机去投入大量精力弄清楚事情时。
  因此，让活动变得如此简单，以至于用户不需要费力思考是否要执行行动，仍然是一个高优先级。


  就 *动机* 而言，Fogg 指出动机源于六个因素：寻求愉悦、避免痛苦、寻求希望、避免恐惧、寻求社会接纳、避免社会排斥286。 这是核心驱动 2、4、5、7、8
  以及隐藏核心驱动 9：感官 的混合。287






  对于像核心驱动力 6：稀缺性与不耐烦这样的驱动力，以及核心驱动力 4：拥有与占有中的禀赋效应，这些在其他行为模型中往往没有被解释。它们是我们大脑中采取的心理捷径，在学术上被称为
  *认知偏差* 和决策 *启发式*^288^。有一份包含数十种启发式^289^ 的清单，包括锚定（在我脑中一切都是相对的）、虚幻优越感（我肯定高于平均水平）、宜家效应（我珍视我所建造的东西）以及损失厌恶（我不会冒着损失
  10 美元的风险去赚取 15 美元），我们在之前的几章中讨论过这些。


  将 Fogg 的六个动机要素加上行为启发式的清单结合起来，就构成了一个相当完整的行为全景图；尽管它们可能无法解释我们为何有时会为更大的事业而死——史诗意义与召唤。对我自己的设计工作而言，我更倾向于拥有一个更具包容性的通用框架，能够涵盖我们的心理核心驱动力以及它们如何促进并相互作用。与其在设计引人入胜的体验时思考一长串例外情况，不如简单地使用一个框架来得容易。


  最后，如果我们通过 Octalysis 来审视 *触发* 要素，那就是 Octalysis 策略仪表板中的反馈机制的作用——这是我们在未来的文章中会更深入探讨的内容^290^。反馈机制允许用户关注他们需要做什么，通常通过收到的电子邮件或短信、显示可操作信息的用户界面，或朋友对你新
  Facebook 照片的“点赞”，从而促使你返回网站。这些都是由反馈机制传递的触发。


  所有反馈机制也都在其内部融入了各种动机核心驱动力，取决于触发本身是什么。积分和徽章是核心驱动力 2 的触发，倒计时器是核心驱动力 6 的触发，旋转幸运轮是核心驱动力
  7 的触发，而好友点赞则是核心驱动力 5 的触发。当你为反馈机制或触发进行设计时，你需要了解它们是旨在驱动用户的求知欲、成就感、内在社交压力，还是其他核心驱动力。如果不是，反馈机制就会变成空洞的信号，无法触发任何期望的行为。


  ## Jane McGonigal 的理论


  作为本章的最后基石，我们将来看 Jane McGonigal 的理论。McGonigal 是一名游戏设计师，也是书籍 *Reality is Broken*²⁹¹
  的作者。她最著名的是在现实世界中关于游戏力量的两场 TED 演讲。


  McGonigal 描述了游戏让人们变得更好、更有韧性的四个要素：*史诗意义*、*紧迫乐观*、*愉悦生产力* 和 *社会结构*。


  其中有几个要素我们可以很容易地与 Octalysis 对应起来。史诗意义当然呼应了核心驱动力 1：史诗意义与召唤——让你感觉自己正在改变世界。社会结构显然与核心驱动力
  5：社会影响与归属感相符，这关乎人们在共同承担任务时之间建立的信任纽带。


  *紧迫乐观* 通过 Octalysis 眼镜来看则稍显难以理解。在 *Reality is Broken* 中，McGonigal 将紧迫乐观定义为，“我们成功成为现实之前的希望时刻，我们感到有动力竭尽全力、做到最好。”²⁹²
  在我自己的解读中，这是一种只要你立即行动，就能完成目标并达成胜利状态的感觉。在这种意义上，玩家始终信任游戏设计师会提供获胜的方法，只要玩家在朝着明显设计好的目标采取迅速行动。


  现在戴上我们的 Octalysis 眼镜，*紧迫乐观* 通常是核心驱动力 2：发展与成就 以及核心驱动力 6：稀缺性与不耐烦 的结合。核心驱动力 2 存在是因为玩家乐观地认为自己有能力达成胜利状态并感到成就感。另一方面，核心驱动力
  6 也会发挥作用，因为玩家不能无限期等待去执行期望行为——他们必须现在就做，因为这是紧迫的。因此，这些左脑核心驱动力的白帽与黑帽组合会让玩家真正投入其中。


  最后一个要素是 *愉悦生产力*²⁹³，最初由印第安纳大学的一组计算机科学家在研究《魔兽世界》玩家异常高的耐力时提出。


  McGonigal 将愉悦生产力定义为“沉浸于能产生即时且明显成果的工作中的感觉”。


  在我看来，愉悦生产力是你随着在某件事上花费更多时间而感到自己在成长、积累或改进某物的感觉。有时任务本身可能有点单调，但只要玩家感觉到有进展，这个过程就会产生愉悦和喜悦的感觉。


  这通常是核心驱动力 2：发展与成就、核心驱动力 3：创造力赋能与反馈 以及核心驱动力 4：拥有与占有 的结合。用户正在积累、成长或组织某物（核心驱动力 4），并且会持续获得关于这些活动的反馈，以便调整、优化并感到成就。


  正如你所见，这些四个核心驱动力组合非常出色，能够让用户深度享受游戏以及游戏之外的体验。随着你深入 Octalysis 游戏化学习之旅，你将开始识别并定义出远超这四个要素的更多核心驱动力组合，并作为体验设计师开创自己的工作。例如，从上述分析中我们可以看到核心驱动力
  7：不可预测性与好奇心 并不是很突出，我们可以思考如何在体验中加入更多悬念、惊喜和不可预测性，超越这四个要素。


  ## 世界是你的游乐场


  我们都有同样的脑子，所以关于我们动机和行为的所有可靠研究都应该能够相互融合。本章的主要观点并不是 Octalysis 优于任何其他框架，但至少对我而言，它可以是一个非常有用的工具，帮助理解和驾驭行为科学、游戏和游戏化中的其他模型。在我自己的经验中，能够使用一个框架来分析它们所有并帮助完善我们对行为设计的理解，既方便又令人满意。


  基于核心驱动力 7 的营销材料中的触发。在终局阶段，触发变为内部触发，用户通过核心驱动力 4 和 8 得到激励。）尝试将你的 Octalysis 理解完全沉浸到
  Hook 模型中。


  在 Twitter 或你偏好的社交网络上分享你的成果，使用标签 #OctalysisBook 并查看其他人的想法。


  ## 开始设计


  你即将接近本书的结尾，现在是开始设计你自己的项目的时机。构思一个与人类动机相关、你想要改进的项目。


  思考你想要改进的 *可量化指标* 是什么。你要针对的 *用户* 是谁，他们由哪些核心驱动力驱动？你需要他们执行哪些 *期望行为*？你可以通过哪些媒介与他们沟通，向他们展示反馈机制并展示触发？最后，你可以为用户提供哪些
  *奖励和激励*？


  合在一起，这就构成了 Octalysis 策略仪表板，它在任何游戏化设计活动中都很有用。这将成为第 17 章的良好基础。有关 Octalysis 策略仪表板的更多信息可以在我的博客上找到：


  *http://www.yukaichou.com/gamification-study/the-strategy-dashboard-for-gamification-design/*

  '
- '# 第 16 章：第一层 Octalysis 实践


  现在我们已经考察了第一层 Octalysis 的所有各种要素，让我们看看一切如何结合起来。一般来说，使用 Octalysis 有两种方法：


  第一种方法是分析现有产品，以确定它们在朝着期望行为产生动机方面的优势和劣势。它使我们能够识别出哪种动机薄弱，从而可以在体验中引入新的改进，通常以游戏设计技巧的形式出现。这通常被称为
  Octalysis 审计。


  第二种方法是基于 Octalysis 和 8 个核心驱动力创建一个全新的体验。通过一个非常系统的过程，我们可以创造一个引人入胜的体验，满足体验设计师的目标。


  让我们先来看前者。


  ### Facebook 的 Octalysis 评测


  使用 Octalysis 作为工具的第一步是破译体验中存在的动机核心驱动力。在第 3 章中，我们简要地通过 Octalysis 的视角审视了 Facebook。让我们利用你对
  8 个核心驱动力的新熟悉程度，更仔细地看一下。






  ![](img/dc8d9e3cff6b1fc564373e52e04f2347_361_0.png)


  一般来说，Facebook在大多数核心驱动力上都表现得相当强劲，因此才取得了如今的巨大成功。Facebook的核心是核心驱动力5：社交影响与关联感。人们总是希望与他人保持联系，分享自己的经历，同时了解别人在做什么。Facebook运用了大量社交提示、社交宝藏和从众锚点，来营造更具参与感的体验。


  另一方面，这种体验中也有大量的核心驱动力7：不可预测性与好奇心。用户每次登录Facebook，都在寻找值得浏览和分享的新奇内容。


  《上瘾》作者尼尔·埃亚尔甚至暗示，每次我们打开Facebook（或Twitter）的信息流，或者“下拉”刷新信息更新，就像拉下老虎机的拉杆——他称之为“狩猎奖励”。294每当我们执行期望行动时，都是在试图看看自己是否会被奖励更多有趣的内容。如果我们没有“赢”，就会再次拉动拉杆，看看下一次会不会更幸运。


  Facebook内部还有强烈的核心驱动力4：所有权与占有感。Facebook上的核心活动之一是积累和整理更多朋友与经历的照片。此外，由于许多人的Facebook个人资料代表他们的社交身份，人们对这些资料有强烈的所有权感。这符合核心驱动力4的特性。


  由于这些公益项目或群组每天都会变化，并且会包含他们正在经历的具体细节，人们至少会感到在每天访问Facebook时能更了解世界的问题。通过大幅提高对群组的捐赠，Facebook可以真正地说，他们不仅改变世界，而且随着用户每天登录，他们还在*拯救*世界。


  最后，如果Facebook能够让用户轻松找到并寻求导师或学习伙伴的帮助，这可能会让Facebook受益。这会让人认为使用Facebook非常“高效”，从而减少他们对它的抵触情绪。


  ## 八角评分是个烟雾弹


  多年来，很多人喜欢问我八角行为分析（Octalysis）的评分代表什么。当你看一些八角图表时，你可能也有同样的疑问。我们知道，分数往往能吸引人们的兴趣，每个人都想了解它们。然而，我通常尽量避免花太多时间解释八角评分，因为它在八角行为分析领域中实际上是最不具备可操作性的元素。


  有用的做法是，使用八角图表来确定哪些核心驱动力薄弱并需要改进，同时理解主导核心驱动力在白帽/黑帽和左脑/右脑方面的性质。八角评分本身在某种程度上只是有趣和花哨的。但既然人们不断问起，我想我应该分享一下我是如何得出这些数字的。


  通常，对于每个核心驱动力，我们根据“该核心驱动力在多大程度上激励用户采取期望行动”来设定一个0到10之间的数字。0意味着该核心驱动力在体验中不作为激励因素存在。在标尺的最高端，10通常意味着该核心驱动力已经无法进一步改进，而且几乎所有接触过该核心驱动力的人都会采取期望行动。


  之后，我将八个数字分别平方并相加。这意味着八角评分的最高可能值是800（10的平方乘以8），最低是0。在我自己的评分中，大多数成功的游戏都在350分以上，而大多数非游戏产品在150分以下。事实上，大多数不注重以人为本的设计的产品都会低于50分。


  然而，由于评分相对主观，不同的人会对同一产品给出不同的分数。当人们问我如何知道每个动机的具体分数时，我只是说这是基于*体验*系统后的直觉感受。然而，正如我之前提到的，精确数字其实没那么有用，只要你的分数偏差不太大就行。无论你给某个核心驱动力打2分还是3分，只要你知道它不是7分或8分，就不会对你的设计产生什么影响。正如我所说，八角行为分析是一种让人们基于自己的正确判断进行更好设计的工具。（毕竟，所有模型都需要正确判断，无论是*SWOT分析*295、BJ
  Fogg的*B=MAT*，还是波士顿咨询集团的*BCG矩阵*296）。


  在我看来，真正重要的是你能够在概念上认识到这些事情：例如，你的体验中没有*不可预测性*，或者你严重依赖黑帽核心驱动力。一般来说，只要知道哪些核心驱动力强、哪些弱，就能让你针对体验进行恰当的设计，而不是把宝贵的时间浪费在纠结精确数值上。


  从八角评分公式中可以得出一个见解：与其在各个方面都有一点，不如在少数几个核心驱动力上做到极强。八个核心驱动力各得1分，八角评分只有8分；而两个核心驱动力各得9分，八角评分则达到162分。这就是为什么在游戏化设计中选择具有所需特性的*正确*核心驱动力如此重要。如果你只需要挑选几个核心驱动力，就要确保你基于具体场景选择最有效的那些。


  话虽如此，如果一个核心驱动力完全缺失，通常比已经很强的核心驱动力更容易改进。在没有不可预测性、社交性或稀缺性时，增加一点点通常是相当容易的。但如果已经存在很高的社交影响力，那么进一步增强它就困难得多


  这个概念最初由旧金山的Kevin Richardson向The Fun Factory提出，2010年由总部位于瑞典斯德哥尔摩的瑞典国家道路安全协会实施。超速摄像头彩票设备利用现有的交通摄像头和速度抓拍技术，检测所有经过的驾驶员的速度，并拍摄他们的车牌照片。


  LED显示屏向每位经过的驾驶员显示车速，并配以竖起大拇指或拇指向下的标志，表示他们是否守法。被拍照的超速者会收到罚单，罚款收入将进入现金池。另一方面，遵守限速规定的驾驶员也会被记录，然后参加抽奖，有机会赢取超速者缴纳的部分罚款。


  许多游戏化行业内的人士都看过这个案例研究，人们常常感叹：“这真是一个有创意的解决方案！我怎样才能想出这样的创意解决方案来解决我自己的问题呢？”


  在这里我们可以看到，通过八角行为分析流程，人们有可能想出超速摄像头彩票等创意解决方案，甚至更多。


  ## 问题：让人们低于限速行驶


  在每一个游戏化活动中，首先必须定义要解决的问题以及如何衡量成功。如果我们把减少超速驾驶者作为一个持续进行的活动，那么就可以通过八角行为分析的8个核心驱动力来分析它。


  一般来说，在没有人为干预的情况下，在限速内驾驶只由核心驱动力1：史诗意义与使命感驱动——安全、负责任的驾驶是为了比自我更伟大的事业。这无疑促使许多人对自己的驾驶速度施加了某种限制，使道路整体上更加安全。


  问题是，大多数人并不总是将开快车等同于“危险”驾驶。对许多人来说，如果回报是更快到达目的地的即时满足感或体验快速行驶的快感，那么忽视限速仍然是值得的。因此，大多数



  政府引入了核心驱动力8：损失与规避——当人们被发现超速驾驶时，会对他们进行罚款。人们希望避免因快速驾驶而被罚款，因此切实降低了车速。这就是大多数人避免危险驾驶的原因。


  然而，执法是一种非常昂贵的解决方案，尤其是当它需要无处不在的时候。而且，由于超速时被抓住的几率相对较低，许多人仍然不会因偶尔超速的习惯而却步。


  随后，另一种解决方案被引入，它利用了核心驱动力3：创意授权与反馈。你可能见过那些不会给超速者开罚单、而只是显示他们行驶速度的超速探测器。由于驾驶员能够控制自己的“分数”并看到即时反馈，这鼓励许多人在发现车速过高时进一步减速。


  这里的问题是，胜利状态（Win-State）对驾驶员来说仍然不太清晰。限速是多少来着？我是超过还是低于？请记住，人们通常不愿意在不必要时使用他们活跃的大脑去思考。如果人们需要自行计算自己是否达到胜利状态，许多人会变得懒惰而不去理会。此外，事实证明，有些人还会做出与期望行为相反的事情，试图看看自己在反馈设备上能记录到的最高速度是多少，这完全违背了设计的初衷。


  ## 超速摄像头彩票的创新


  因此，超速摄像头彩票应运而生。超速摄像头彩票增加了四个额外的核心驱动力来解决这个问题。


  - 核心驱动力4：所有权与占有感。通过超速摄像头彩票，玩家现在如果表现良好并达到胜利状态，就有机会“赚到”钱。在这种情况下，实实在在的现金奖励本身就是一种相当强的激励，使人们有兴趣参与。

  - 核心驱动力7：不可预测性与好奇心。我们知道，只要存在彩票或抽奖系统，就涉及核心驱动力7。有10%的机会赢得100美元，往往比必然获得10美元更能吸引人们参与，因为他们会不断思考自己是否会赢。这种期待让事情变得更加激动人心和引人入胜。

  - 核心驱动力2：发展与成就感。超速摄像头彩票不再是模糊地显示驾驶员是否达到胜利状态，而是当驾驶员达到胜利状态时显示明显的绿色竖起大拇指，未达到时显示红色大拇指向下。通过以绿色显示等于或低于限速的速度，以红色显示超速，进一步强化了这一点。这种即时反馈机制让用户达到胜利状态时能直观地感到更有成就感和满足感。

  - 核心驱动力5：社会影响与关联性。在展示超速摄像头彩票的爆款YouTube视频中，我们看到超速摄像头彩票被实施在一条繁忙的街道上，附近有许多其他驾驶员和乘客。除了渴望表现出色并赢得一些钱之外，驾驶员会意识到周围每个人都能看到他们是得到拇指朝上还是朝下。尽管大多数观众只是陌生人，但我们自然不希望别人认为我们是违反法律的“拇指朝下失败者”。我们更希望别人看到我们是获得绿色拇指朝上的守法公民。


  超速摄像头彩票将四个额外的核心驱动力融入体验中，使其在试点期间能够将过往驾驶员的平均速度降低20%以上。尽管由于缺乏终局（Endgame）设计，超速摄像头彩票并非万无一失的解决方案，但我们可以看到，通过将八角行为分析（Octalysis）和8个核心驱动力应用于现有问题，我们能够创新并设计出强化期望行为的新体验。


  如果说我希望读者从这本书中带走一样东西，那就是不断思考动机和8个核心驱动力，而不是特性、功能和系统。当你从以人为中心的设计（而非以功能为中心的设计）开始时，我相信你设计的任何东西都会更吸引人、更令人愉快、更成功。


  ## Waze导航应用的八角行为分析


  除了对体验进行高层次的八角行为分析概述之外，我们还可以在玩家旅程的4个体验阶段分别分析体验：发现、上手、搭建和终局。


  与超速摄像头彩票有些类似，“游戏化驾驶”领域的另一个案例是导航应用Waze。如第5章所述，Waze是一款极受欢迎的GPS应用，它通过众包实时交通和道路状况数据，正在改变我们导航交通的方式。它经常获得成千上万用户平均五星的评价，其粉丝将平凡的驾驶体验转变为一种愉快的沉浸式冒险，并带来有回报的社交体验。


  让我们通过将八角行为分析应用于其设计和机制，更深入地了解Waze是如何实现这一点的。


  ![](img/dc8d9e3cff6b1fc564373e52e04f2347_370_0.png)


  大多数导航系统只是将提供路线作为达到目的的手段（以功能为中心）。它们主要通过两个核心驱动力来激励我们：


  - 核心驱动力2：发展与成就感。用户不断看到朝向目的地的进展，并在高效达到胜利状态时感到非常胜任。

  - 核心驱动力8：损失与规避。用户避免迷路或感到困惑的挫败体验。


  但所有导航系统都满足这两个核心驱动力，只是有些做得更好。作为行业的新进入者，Waze需要在体验中融入更多核心驱动力，以创造差异化的成功。


  Waze通过启用社交组件来创建本地化的驾驶员社区。虽然公司拥有地图权，但实际的导航系统是由众包用户数据驱动的，驾驶员不断贡献更新。这些更新包括路况、碎片、交通、警察的位置，以及其他对使用该应用的驾驶员有帮助的特定细节。这有点类似于维基百科社区参与背后的精神。


  Waze的目标不仅仅是给人们提供路线。他们想要创造愉快而有趣的驾驶*体验*，为用户日常通勤带来更多乐趣。


  让我们深入探讨Waze如何在4个体验阶段中吸引用户，涵盖8个核心驱动力。


  ### Waze的发现阶段体验


  发现阶段是用户决定开始尝试某种体验的阶段。许多其他游戏化/游戏设计框架将其第一阶段定义为*上手*或*身份*³⁰⁰，即用户注册体验之时。然而，我认为服务的用户体验不是从人们注册服务时开始的，而是从他们第一次听说它时开始的。他们如何听说它、在什么背景下、受哪些核心驱动力激励，都会影响用户在上手和搭建阶段的行为。因此，我们希望仔细分析和设计我们正在设计的任何服务的发现体验。


  许多人发现Waze应用是因为一种温和的核心驱动力7：不可预测性与好奇心。他们从某处听说它，通过在线媒体网站读到它，或者只是在应用商店中偶然发现它。Waze通过展示可爱的图形来吸引用户，并激发人们对用户生成导航应用的好奇心。由于大多数GPS应用都是集中编程的，看起来过于严肃，这激发了用户对其他人无法获得的信息的好奇心，以便更好地在交通中穿行。


  另一个在搭建阶段开始增强的关键核心驱动力是核心驱动力4：所有权与占有感。当用户使用Waze驾驶时，它收集关于用户习惯和驾驶行为的具体数据。因此，该应用能够对用户形成深入而个性化的理解，并定制他们的体验。


  作为第9章讨论的阿尔弗雷德效应（Alfred Effect）的一个例子，Waze可能会问驾驶员：“您现在想去上班吗？”因为它知道驾驶员在工作日上午8:30去上班。但在周三晚上8点，Waze可能会问：“您想去健身房吗？”因为它知道周三晚上是这个用户的健身之夜。个性化的“阿尔弗雷德效应”激励用户保持与该应用的互动和忠诚度，即使其他更先进的技术出现。相比于更聪明的系统，用户更愿意坚持使用了解自己的系统。


  Waze在搭建阶段的另一个强大核心驱动力是核心驱动力7：不可预测性与好奇心。当用户收到路边有故障车辆的警报时，他们的思维会突然变得投入。“它会在那里吗？它会在那里吗？”这就是我所说的神谕效应（游戏技巧#71），即对未来的预测导致用户充分投入，以查看“预言”是否会成真。通常用户会保持专注，直到“哇！”他们看到那辆无法行驶的汽车停在路肩上——预言应验了！即使车子不在那里，用户也会想：“真扫兴。也许下次我能亲眼看到警报中的事件。”当你拉动老虎机的杠杆时，有时赢，有时输。这种好奇心在Waze体验中增加了一层额外的乐趣。


  在某个时刻，在持续看到并受益于他人贡献的可靠信息后，用户也开始考虑运用他们的核心驱动力3：创意授权与反馈。突然，用户开始分享一些自己的道路信息，在驾驶时点击几个大图标，分享有一个警察藏在陡坡底部。（注意：这不一定安全。）这给了



  用户因此感受到一种“自主感”，因为他们觉得自己能够自主地向有用的数据池贡献自己想要的内容。


  我们知道，要让核心驱动力 3 生效，它还需要快速的“反馈”，而且如果这种反馈与核心驱动力 5：社会影响与归属感混合，反馈往往会更强。Waze 的情感回报之处在于，经常当你与社区分享信息时，几秒钟后你可能会收到几条弹出提示，显示有人在感谢你。（同样，这对分享者或感谢者来说并不一定安全；游戏化设计师需要认真思考其设计的后果）。当用户似乎从其他欣赏他们的用户那里获得即时反馈时，他们会感到愉悦，并且更倾向于未来继续分享。每次期望的行为之后都必须有一个令人愉悦的时刻。


  当然，系统中仍然存在一些核心驱动力 6：稀缺与不耐烦的设计，因为该应用仍然 dangling 一条通往精通的路径，成为“Waze 皇室”。然而，由于解锁的奖励并不会赋予用户更有用的能力，也实际上并不代表对他人而言令人印象深刻的地位，从我的观察来看，它并不会大幅改变用户行为。


  对于核心驱动力 8：损失与规避，人们讨厌为汽油、啤酒或杂货等商品支付过高的价格，因此导航服务确实可以帮助人们避免支付过高的价格，通过将路线引导至沿途最便宜的地点。此外，当某人试图在前往目的地的途中搜索餐厅时，大多数导航应用会显示位置或绕行路线，这些路线实际上离路很远。


  Waze 通过在用户前往目的地时显示更便宜的加油站和更短的绕行路线，使用户能够避免这些痛苦。它甚至会在用户承诺前往任何地点之前告诉用户绕行与原路线相比需要多长时间。这最终会带来更多核心驱动力
  2：发展与成就，因为人们会觉得自己很聪明，没有浪费太多时间和金钱去寻找加油站或吃饭的地方。


  ## Waze 的终局阶段


  终局阶段开始于用户已经长时间经历活动循环，并且在其自身认知范围内已经做完了所有能做的事情。这时我们评估他们为何仍想留在系统中并承诺更多期望的行为。


  幸运的是，对于 Waze 来说，导航功能本身就是许多人日常需要的实用目的。因此，人们很难像对待游戏那样轻易退出。然而，如果没有细致的设计，仍可能没有任何东西阻止用户迁移到提供类似功能导向收益的其他导航服务。这就是良好的终局设计变得非常重要之处。


  在终局阶段，长期参与的核心用户开始更自豪地成为社区的一部分，这加强了核心驱动力 1：史诗意义与使命。正如我们所知，核心驱动力 4 中的阿尔弗雷德效应会持续增长，这也增强了核心驱动力
  8：损失与规避，因为用户不希望离开并失去所获得的系统智能以及系统中保存的地址和“收藏”。


  此外，在这个阶段，一些核心驱动力 3：创造力赋能可以被利用，因为人们开始实际使用可用的在线地图编辑器来更新地图并进行改进。当然，由于物理世界在比喻上是“坚不可摧”的，因此可以从这个过程中获得的创造力仍然有限。此外，说“这里有一块垃圾或一辆警车”的方式也只有那么几种（任何超出最简单的方式都会对驾驶构成危险），因此对于资深用户来说，核心驱动力
  3 仍然非常有限。


  另一方面，只要 Waze 继续提供比其他竞争对手更快的路线，核心驱动力 2：发展与成就在终局阶段很可能会保持强劲。然而，许多其他导航应用都在宣称它们在寻找更快路线以避开交通方面同样智能或更智能。无论这种说法是否准确，这种可能性带来的感知以及一些黑帽发现阶段设计，都可能迅速将用户从
  Waze 夺走，如果他们仅依赖这一点的话。


  关于核心驱动力 5：社会影响与归属感，即使 Waze 中的轻度社交互动在终局阶段仍然有趣，互动和关系的深度也不一定会扩展。因为人们在驾驶时，每次友谊互动都基于轻触，人们偶尔会以“Beep-Beep”或快速消息的形式向你发送社交提示。友谊的程度并不一定会通过
  Waze 变得更深或更有意义。


  核心驱动力 6：稀缺与不耐烦以及核心驱动力 7：不可预测性与好奇心也减弱了，因为用户已经解锁了高等级头像，新奇因素（包括由于变化甚微而产生的预言效应）很可能已经降低。这意味着
  Waze 在终局阶段并没有太多黑帽动机。当然，Waze 中的头像等级是“基于百分位”的，这意味着如果你停止使用 Waze 而其他人勤勉追赶，你可能会失去头像等级。这意味着当资深用户因使用缓慢而掉级时，仍有动力继续使用。这里我们看到这种游戏化设计的另一个潜在副作用可能是，人们会为了保持等级而更多地使用
  Waze 驾驶，即使根本不需要驾驶。这可能会无意中对环境产生负面影响。


  从上面的分析可以看出，Waze 的终局体验主要集中在核心驱动力 1、2、3、4 和部分 8 上。这并不一定是坏事，因为我们知道白帽核心驱动力会刺激更长的参与度。只要人们喜欢这种体验，减少黑帽核心驱动力设计是可以的。然而，Waze
  长期成功的关键在于它们如何吸引核心驱动力 2——用户是否真的觉得使用 Waze 比使用其他导航应用更聪明——以及核心驱动力 3——是否有更多方式利用创造力并获得反馈，同时不危及安全驾驶。当然，如果
  Waze 能在终局设计中扩展核心驱动力 5：社会影响与归属感，那将使其体验更具吸引力。


  ## 下一步：为 Waze 识别潜在改进


  一旦我们分析了 Waze 的渐进式体验，下一步就是提出新的创意想法来增强这 8 个核心驱动力。为简单起见，我们将只进行一次简单的十分钟一级 Octalysis
  头脑风暴，这会很有启发性，但绝非详尽无遗。免责声明：截至本文撰写时，我从未与 Waze 合作过，所以这不是真正的咨询建议，而仅仅是使用 Octalysis 框架进行的一种有趣的头脑风暴。


  ![](img/dc8d9e3cff6b1fc564373e52e04f2347_378_0.png)


  通过这次快速分析，Waze 首先需要改进的是更强调核心驱动力 1：史诗意义与使命。我之前提到过，“交通怪兽”的 onboarding 图像在早期存在，但后来已被更多与社交相关的信息所取代。即使公司想强调核心驱动力
  1 的“ playful fantasy”部分，他们也应该在脚手架和终局体验中持续提供“帮助社区战胜交通”的史诗意义。不幸的是，Onboarding 是许多反馈机制元素存在的唯一地方。


  为了改进核心驱动力 2：发展与成就，Waze 应该考虑让每次到达目的地都成为更大的胜利状态。播放胜利的曲调，显示一个兴奋的弹出窗口，写着“你已安全到达。太棒了！”也许甚至像其他一些导航应用那样显示目的地的图像，以便用户知道该寻找什么。所有这些都比平淡的
  GPS 语音“您已到达目的地”要好得多。我可能会更频繁地使用 Waze，如果每次我到达目的地时，有 25% 的几率机械女声会说，“您已到达目的地。你很棒。”当然，这也加入了一丝核心驱动力
  7 复活节彩蛋设计的融合。


  对于核心驱动力 4：所有权与占有，我们提到过 Waze 的一大优点是阿尔弗雷德效应，因为它开始提供个性化



  suggestions. 问题是，大多数用户在脚手架阶段后期之前并不知道 Waze 正在智能地学习他们的偏好。如果更多用户知道这一点，也许在他们意识到该功能存在之前，流失的人会更少。应用可以考虑为自己添加一个“智能分数”，每次你使用
  Waze 驾驶时，其智能分数都会随着它对你偏好的了解越来越多而上升。这可能比单纯的积分更具上下文意义，并为体验中即将发生的事情营造一些期待。


  另一个关于核心驱动力 4 的想法是开始展示可爱的图形和图表，反映用户的驾驶行为。图表可以反映诸如，“你知道你今年去了 105 次健身房，总共停留了 5,775
  分钟吗？”或者，“你知道你去年通勤上班花费了 9,422 分钟吗？”这些确实可以在体验中加入更多核心驱动力 4。


  即使这些信息不一定有用，人们也喜欢它，因为它反映了他们的身份，并让他们更好地理解自己的行为。这将增加他们更频繁使用 Waze 的欲望，以确保数据以及由此产生的洞察具有更高的完整性并变得更有趣。


  核心驱动力 3：创造力赋能与反馈实际上很难设计，因为导航应用的目的是尽可能高效地让用户到达目的地。几乎没有空间让用户进行创造性选择和有意义的选择，这些选择可能会使用户分心或浪费时间。然而，一个潜在的想法是引入一个名为“Accelerwaze”的功能，允许用户尝试击败
  Waze 预先设定的“预计到达时间”。


  当你为 Waze 设置目的地时，它会告诉你到达目的地的最佳方式，以及如果你走那条路线时的“预计到达时间”。用户可以选择“挑战”Waze，说：“我相信如果我走另一条路线，我会比
  Waze 的预计到达时间更快到达。”这将使驾驶体验变得更有趣、更动态，同时也允许 Waze 了解新的驾驶路线以升级其自身系统。人们甚至可能想在他们完全知道如何到达的目的地上使用
  Waze，例如他们每天通勤上班的路线。


  当然，这里存在潜在风险，为了证明他们的路线更快，司机可能会更鲁莽地驾驶并闯红灯。对于你设计的每个激励功能，你都必须在实施之前考虑意想不到的后果和负面影响。希望这些“Accelerwaze”司机在经过许多测速摄像头彩票时，会减速以赢得奖品。


  Octalysis 允许你提出正确的问题，并利用 8 个核心驱动力来设计动机。但仅仅因为你有一堆有趣的想法并不意味着它们都是合理的想法。判断哪些功能是合理的，哪些需要进一步完善，取决于设计师的判断。


  记住，我们之前提到过 Waze 的游戏化系统可能会激励人们不必要地多开车并伤害环境？幸运的是，核心驱动力 5：社会影响与归属感中也有一些想法可以帮助减少驾驶。既然
  Waze 知道谁每天通勤到哪里，他们就可以潜在地引入拼车匹配服务，让个人节省汽油、能源和环境。 同时结交新朋友。Waze 可以通过声明的兴趣、行业，甚至同一家公司来匹配人们，定期一起通勤。


  如果他们真的想这样做，Waze 甚至可以创建一个约会服务，并将第一次约会安排为拼车。当然，这里的玩笑是几乎每个人都会有第二次约会，因为潜在的情侣至少要一起拼车返回通勤。只是不要成为那个糟糕到对方会叫朋友来接他们，这样他们就不用再忍受和你一起坐车的痛苦的人。


  对于核心驱动力 7：不可预测性与好奇心，他们可以为终局用户添加有趣而愉快的体验，例如随机告诉用户正在进行闪电快闪，并询问他们是否想参与。如果用户点击“是”，它可以将他们的汽车重新路由到海滩等地点，许多其他
  Wazer 会在那里聚集。他们可以实施有趣的主题，例如，“弄清楚我们为什么把你们所有人带到这里。”也许在几次对话后，人们会意识到他们都每天去健身房两次，并且是硬核的健康爱好者。一旦他们弄明白了，


  正如你所见，通过 Octalysis，你能够彻底分析你自己的产品或体验，同时也能利用它来集思广益，提出其他创造性想法来改善体验。当然，你很少想实施所有计划的功能，但它允许你的思考朝着推动期望行为的方向深入，同时让用户享受过程。


  ### 为了充分利用这本书，立即选择以下其中一个选项来做：


