  - 303 有时，我会收到评论说，我提到《圣经》让人反感，仿佛我试图将自己的信仰强加于人。我并无此意。最初我成长为一个好辩的无神论者，而现在的信仰是我非常重要的一部分，我从中领悟到许多宝贵教训，并乐于与他人分享。奇怪的是，如果我自称是“瑜伽爱好者和佛陀追随者”，那些感到冒犯的人反而更容易接受。我们都应有权捍卫自己内心所信，并且在没有真正冒犯他人的行为时不被评判。为此，我感谢马尔科姆·格拉德威尔，他作为一位不惧公开宣称基督信仰的畅销书作家，给了我坚定信念的勇气。

  - 304 在《圣经》中，奇迹似乎是由我们的信心驱动的。耶稣说，只要我们有像芥菜种那样大小的信心，就能移山。甚至当耶稣医治人时，他会说“你的信心医治了你”，而不是“我医治了你”。因此，在一个没有信心的城镇，即使是耶稣也不施行他在别处大量施行的奇迹。

