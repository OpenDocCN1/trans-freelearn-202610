  counter_evidence:
  - 1. 标题格式为 `## 使用多摄像机制作动画`（二级标题），而全书其他章标题（第 10、11、12、14 章）均为 `# 第 X 章`（一级标题），层级不一致。
  - 2. 缺少章序号“第 13 章”，与前后章节编号（12、14）不连贯，违反序号连贯性规则。
  - 3. 虽文中出现‘在本章中’，但‘章’在中文技术书籍中常被宽泛用于‘节/单元’，不能作为唯一依据覆盖格式特征。
  - 4. 位于‘第 3 部分’之下，更可能是该部分下的一个顶层节而非独立章节。
  keep_split: false
