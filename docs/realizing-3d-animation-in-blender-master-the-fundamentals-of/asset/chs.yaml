- "# 第 12 章：刚体物理\n\n在这本书中，我花了不少篇幅谈论物理——我们世界中的物体如何倾向于下落并相互弹开。这也指导了我们动画中的物体应如何表现，但作为动画师，我们通常刻意地为这种行为设置关键帧。第\
  \ 2 章中的球看起来似乎受物理定律支配，但那是我们费尽心力让它看起来那样的——我们才是掌控者。但如果我们*不*想掌控呢？如果我们的目标是*混乱与破坏*呢？\n\
  \n比如，如果一个角色掀翻一张桌子，或撞碎一堵砖墙？用常规技术，这需要费大力气为大量东西制作动画，但如果我们不特别在意桌上的物体或墙上的砖块最终落在哪里，我们可以直接让程序替我们干活。\n\
  \n**刚体物理**是一项模拟刚体在空间中移动和碰撞物理特性的功能——岩石、玻璃球、汤罐头——字面上任何硬物。通过将场景中的物体指定为刚体，它们将表现得遵循许多自然物理定律，如重力、惯性和摩擦力，而无需我们直接干预。\n\
  \n在本章中，我们将探讨以下主题：\n\n* 刚体入门\n* 提高刚体的准确性和性能\n* 控制动画刚体\n\n## 技术要求\n\n要跟随本章操作，你只需要\
  \ Blender 的默认场景。你可以删除灯光和相机，但我们需要那个立方体。那将是我们的第一个 `Rigid Body`。\n\n## 创建刚体世界\n\n`Rigid\
  \ Body` 中的关键词“rigid”（刚性）将该模拟与其他物理模拟（如 `Fluid` 流体、`Cloth` 布料或 `Soft Body` 柔体）区分开来。拿起某物扔出去——如果它不飞溅、不弯曲、不晃动，你就可以把它视为刚体物体。\n\
  \n刚体物理入门之简单可能会让你惊讶。我们将从创建最简单的刚体模拟开始。\n\n### 我们的第一个刚体模拟\n\n当场景中有一个或多个物体是刚体时，刚体物理模拟会自动启用。场景中的任何网格物体都可以成为刚体。\n\
  \n这些设置位于选中网格物体的 `Physics Properties`（物理属性）选项卡中：\n\n![图 12.1：物理属性](img/B17149_12_1.jpg)\n\
  \n图 12.1：物理属性\n\n> **重要提示**\n> 除非物体被赋予特定的 `Physics Properties`（如 `Rigid Body`），否则它们不会影响模拟。\n\
  \n点击 `Rigid Body` 将选中的物体指定为刚体。现在试试：\n\n1. 选择默认立方体。\n2. 在 `Physics Properties` 选项卡中进入立方体的物理设置。\n\
  3. 点击 `Rigid Body`。\n\n忽略刚出现的设置，从第 `1` 帧播放动画。这就有了——一个立方体在空旷空间中下落！\n\n![图 12.2：没了！](img/B17149_12_2.jpg)\n\
  \n图 12.2：没了！\n\n这不是最令人兴奋的模拟，但请耐心往下看。为了理解发生了什么，让我们回顾一下你的场景和刚刚变成刚体的物体所发生的一些关键变化。\n\
  \n#### 刚体\n\n与 `Fluid`、`Cloth` 或 `Soft Body` 模拟中的物体不同，`Rigid Body` 的网格不会改变。相反，整个物体会在重力和其他刚体等力的作用下移动（现在我们可以看到重力对立方体的影响；其他刚体稍后再谈）。\n\
  \n\n\n默认情况下，一旦为物体启用了 `Rigid Body`（刚体）物理属性，我们就会失去对它的控制。移动它只能决定模拟开始时的初始起点，在此之后，它就不再受我们控制了。\n\
  \n**重要提示**\n\n基于上述原因，你应该在模拟的起始帧（默认为第 `1` 帧）或之前编辑你的刚体物体。在模拟开始后的帧上编辑物体会倒退时间，可能导致意想不到的结果。\n\
  \n与其他动画一样，模拟结果是非破坏性的；当我们回到第 `1` 帧时，立方体会回到它开始的位置。这是件好事——否则，每次它掉下去我们都得亲自去捡回来！\n\n\
  ## 刚体模拟中的帧\n\n与 Blender 中的其他物理类型一样，刚体模拟仅在动画播放时工作。播放动画时，模拟会实时执行。\n\n请注意 `Timeline`（时间轴）区域中出现的细黄条：\n\
  \n![Figure 12.3: The cached frames of the simulation](img/B17149_12_3.jpg)\n\n图\
  \ 12.3：模拟的缓存帧\n\n这表示 Blender 已存储（或 `cached` 缓存）了所选物体的物理模拟结果的帧，与模拟的整个帧范围相比。\n\n缓存是为了性能原因；播放缓存帧比首次计算它们要快。模拟会自动缓存，并且每当我们更改模拟中的某些内容时都会被清除。\n\
  \n**重要提示**\n\nBlender 必须知道第一帧的模拟状态，才能计算第二帧会发生什么，然后是第三帧，以此类推。因此，每当你想查看更改效果时，都应该允许动画从第\
  \ `1` 帧开始播放。如果你在 `Timeline` 中跳转到未缓存的帧，不要指望在 `3D Viewport`（3D 视图）中获得准确的结果。\n\n##\
  \ 刚体世界设置\n\n每个刚体都有单独的属性，点击 `Rigid Body` 时会出现，我们马上就会讲到。在此之前，你应该了解我们 `Rigid Body World`（刚体世界）的*全局*参数，它们影响整个模拟，位于\
  \ `Scene Properties | Rigid Body World`（场景属性 | 刚体世界）：\n\n![Figure 12.4: Rigid Body\
  \ World settings](img/B17149_12_4.jpg)\n\n图 12.4：刚体世界设置\n\n显而易见，`Gravity`（重力）也会影响你的刚体：\n\
  \n![Figure 12.5: Gravity](img/B17149_12_5.jpg)\n\n图 12.5：重力\n\n这里看到的大多数默认值很少需要更改，但知道我们可以让物体变得失重……甚至让它们向上或向侧面掉落，这很好！\n\
  \n**提示**\n\n大物体通常看起来下落得异常缓慢。默认立方体宽 2 米，与我们习惯抛掷的现实世界物体相比相当大。为了获得外观准确的模拟，请注意场景的比例，并确保物体尺寸逼真（且具有逼真的\
  \ `Mass` 质量）。你也可以将 `Gravity` 或 `Speed` 乘以给定因子，这实际上等同于缩放整个模拟空间。\n\n另请注意 `Rigid Body\
  \ World | Cache` 下的 `Simulation Start` 和 `End` 属性，以防你希望模拟的帧范围不是默认的 `1` 到 `250`：\n\
  \n![Figure 12.6: Simulation Start and End frames](img/B17149_12_6.jpg)\n\n图 12.6：模拟起始和结束帧\n\
  \n现在你知道所有东西在哪里了，我们准备让这个模拟变得更有趣一些。\n\n## 主动和被动刚体\n\n我们的场景需要一个地板；否则，所有东西都会掉进无限虚空。为了排斥落在上面的刚体并阻止它们掉进无限虚空，我们的地板也必须是一种刚体，但它本身不会掉进无限虚空（无限虚空似乎是这里的默认设置）。\n\
  \n让我们首先创建地板。\n\n### 创建地板\n\n你可能会认为平面或网格足以作为地板，但这次不行。地板需要具有非零厚度；否则，我们模拟中的其他刚体可能会直接穿过它。那不是你想要在场景里（或你家里）的地板。\n\
  \n我们刚刚转换为刚体的默认立方体将很好地充当地板：\n\n1. 在 `X` 和 `Y` 轴上缩放立方体，使其覆盖大面积区域。\n2. 在 `Z` 轴上将立方体向下移动\
  \ `-1.0`，使其顶面与“地板”应有的位置对齐。\n3. 将立方体重命名为 `Floor`。\n4. 为了让如此大的物体不那么显眼，转到 `Object Properties\
  \ | Viewport Display`（物体属性 | 视口显示），并将 `Display As` 设置为 `Wire`（线框）。\n\n这些步骤大多是为了方便我们；重要的是我们要把地板做得又大又平。各方向几十米应该足够了：\n\
  \n![Figure 12.7: Floor](img/B17149_12_7.jpg)\n\n图 12.7：地板\n\n这是一个不错的地板大小的地板，但播放模拟时它仍然会掉下去。同样，这不是你想要在场景或家里的地板。接下来我们终于来看看那些我们一直忽略的\
  \ `Rigid Body` 属性来修复它。\n\n### 被动刚体\n\n别搞错了——我们的地板确实需要是一个刚体，只是不是 `Active`（主动）类型。\n\
  \n刚体有两种类型。默认情况下，刚体是 `Active`，这是一种花哨的说法，意思是物理模拟器会让它四处移动：\n\n![Figure 12.8: Rigid\
  \ body types](img/B17149_12_8.jpg)\n\n图 12.8：刚体类型\n\n相反，`Passive`（被动）刚体固定在空间中。它会影响其他\
  \ `Active` 刚体，而自身不受它们或模拟中任何其他事物的影响。这正是我们想要的地板效果。\n\n**提示**\n\n让 `Active` 刚体实际上变为被动的另一种方法是禁用\
  \ `Rigid Body | Settings | Dynamic`。你可以为这个属性制作动画，以启动和停止单个主动刚体。\n\n让我们把地板设为 `Passive`\
  \ 刚体，然后添加一些 `Active` 刚体，以便看到效果：\n\n1. 在 `Floor` 物体的 `Rigid Body` 属性顶部，将 `Type` 从\
  \ `Active` 改为 `Passive`。\n\n现在我们的地板表现得像地板该有的样子：什么都不做。但它会阻挡其他刚体！让我们在场景中添加一些来看看实际效果。\n\
  \n2. `Add`（`Shift + A`）几个你选择的实体 `Mesh` 物体到场景中，并将它们放在地板上方：\n\n![Figure 12.9: Some\
  \ primitive mesh objects that can be rigid bodies](img/B17149_12_9.jpg)\n\n图 12.9：可作为刚体的基础网格物体\n\
  \n1. 像第一个那样，将这些新物体中的每一个都设为 `Rigid Body`。\n\n你的新刚体将下落，撞击地板，并以惊人的真实感翻滚。现在我们可以看到刚体物理的真谛了：让一堆垃圾掉下去！\n\
  \n![Figure 12.10: Just like dropping a 2-meter monkey head in real life!](img/B17149_12_10.jpg)\n\
  \n图 12.10：就像在现实生活中扔一个 2 米高的猴子头模型！\n\n我估计刚体物理至少 60% 的用例只是让垃圾掉下去。继续玩吧；这非常有趣！\n\n玩够了的话，继续下一节，我们将介绍*我*眼中的乐趣：学习一堆关于刚体的技术细节。哦，耶！\n\
  \n## 刚体碰撞\n\n这是关于刚体物理你需要知道的最重要的事：一切关乎 `collisions`（碰撞）。你可能已经注意到你的主动刚体在发生碰撞——相互撞击并以一种逼真的方式做出反应，如果手动动画制作会非常耗时。重力等力很容易模拟——呵，我们只需两个关键帧和二次插值就能模拟重力——但碰撞？碰撞才是事情变得有趣的地方。\n\
  \n\n\n## 将垃圾拼凑在一起的算法\n\n看看这堵由砖块组成的墙，其中每块砖都是一个主动刚体。推倒砖墙是个有趣的练习；我们很快就要自己制作一个了：\n\n\
  ![图 12.11：第 1 帧上简单的砖墙](img/B17149_12_11.jpg)\n\n**图 12.11：第 1 帧上简单的砖墙**\n\n看起来挺不错，对吧？它会保持直立，直到我们用别的东西把它撞倒，对吧？\n\
  \n错！它炸了，因为你对碰撞不够小心：\n\n![图 12.12：同一堵墙，第 12 帧](img/B17149_12_12.jpg)\n\n**图 12.12：同一堵墙，第\
  \ 12 帧**\n\n这种情况发生的频率比你想象的要高，这只是你在模拟中可能遇到的众多问题的一个例子。只要我们掌握一些关于碰撞的知识，就能避免许多此类问题。\n\
  \n刚体碰撞的工作原理如下：在每一帧，物理引擎检查主动刚体是否正在与另一个刚体碰撞（或即将碰撞）。当这种情况发生时，会施加一个冲量，在下一帧改变刚体的运动，使其远离碰撞物体。碰撞越剧烈，冲量越大。\n\
  \n例如，在第 `1` 帧获取一个主动刚体，将其嵌入地板一半：\n\n![图 12.13：嵌入地面的刚体球体](img/B17149_12_13.jpg)\n\n\
  **图 12.13：嵌入地面的刚体球体**\n\n引擎认为这个刚体正在与地板*剧烈碰撞*。模拟开始时，它会像从大炮发射一样飞向空中。这就是为什么如果我们不小心，模拟可能会在开头“爆炸”。\n\
  \n> **提示**\n>\n> 两个 `Passive` 刚体发生碰撞无所谓，所以你可以随意把它们粘在一起。它们是被动的。它们能去哪儿呢？\n\n那么物理引擎如何高效检测两个刚体是否碰撞？这引出了我们的下一个话题……\n\
  \n## 碰撞形状\n\n在碰撞检测中考虑的不是刚体的网格，而是 `Shape`。注意 `Shape` 是本章中的一个特定技术术语。每个刚体都有一个 `Shape`\
  \ 属性，可在 `Rigid Body` | `Collision` | `Shape` 下找到：\n\n![图 12.14：碰撞形状](img/B17149_12_14.jpg)\n\
  \n**图 12.14：碰撞形状**\n\n这些形状是物理引擎唯一关心的形状！\n\n## 基本碰撞形状\n\n刚体的形状旨在或多或少地类似于物体本身，但经过简化。`Box`、`Sphere`、`Capsule`、`Cylinder`\
  \ 和 `Cone` 是最简单的形状，强烈建议将其用于外观类似这些形状的物体。更简单的形状更容易计算，因此对性能和稳定性更有利，尽管这会以准确性为代价，即刚体的\
  \ `Shape` 属性偏离我们实际看到的网格对象的“形状”处：\n\n![图 12.15：像完美球体一样滚动的猴子头](img/B17149_12_15.jpg)\n\
  \n**图 12.15：像完美球体一样滚动的猴子头**\n\n> **重要提示**\n>\n> 当使用 `Box`、`Sphere`、`Capsule`、`Cylinder`\
  \ 或 `Cone` 时，形状会在 `3D Viewport` 中以线框显示，以便你将其与关联的对象网格进行比较。\n>\n> 形状的大小会根据网格的尺寸自动缩放。某些形状与局部\
  \ `Z` 轴对齐，因此你可能需要编辑对象，使其局部 `Z` 轴与其较长的尺寸对齐。\n\n球体、盒子、胶囊体、圆柱体和圆锥体是方便的形状，因为测试它们是否碰撞所需的几何公式很简单。不过其他形状怎么办呢？\n\
  \n## 网格和凸包\n\n默认形状是 `Convex Hull`，这是直接从网格复制的形状，但有一个重要区别：由于计算考虑，它必须是凸的。如果你能看到刚体的\
  \ `Convex Hull`，它看起来会像包裹着收缩膜的物体。这是一个很好的通用形状，适用于大部分是凸形的物体。\n\n不过有时 `Convex Hull`\
  \ 还不够好。注意似乎覆盖着这个碗的“隐形收缩膜”：\n\n![图 12.16：弹珠无法进入碗中](img/B17149_12_16.jpg)\n\n**图 12.16：弹珠无法进入碗中**\n\
  \n如果你必须准确模拟凹面物体的物理效果，总有 `Mesh` 形状，它尽可能忠实地复制网格本身，包括所有凹面部分：\n\n![图 12.17：使用 Mesh 形状进行精确凹面碰撞](img/B17149_12_17.jpg)\n\
  \n**图 12.17：使用 Mesh 形状进行精确凹面碰撞**\n\n此选项是最准确的选择，但也是最慢且最不稳定的。检测凹面网格的碰撞比你想象的更难！因此，最好少用\
  \ `Mesh` 形状，如果可能的话，仅将其用于 `Passive` 刚体。\n\n> **提示**\n>\n> 高细节层级的 `Mesh` 或 `Convex\
  \ Hull` 形状会不必要地拖慢模拟。但请记住：物体不必是自己的刚体。你可以改用*代理*——一个具有相同基本形状的不可见刚体——然后将更复杂的物体设为其子级。\n\
  \n## 复合父级\n\n最后是 `Compound Parent`，这是一个被低估的形状，它组合了刚体所有子级的形状。通过组合简单形状，你可以制作各种自定义形状，甚至性能远超\
  \ `Mesh` 或 `Convex Hull` 形状的凹面形状：\n\n![图 12.18：用于制作哑铃的复合形状](img/B17149_12_18.jpg)\n\
  \n**图 12.18：用于制作哑铃的复合形状**\n\n现在我们已经了解了所有可用的碰撞形状，让我们看看能否在模拟中使用其中一种或多种。\n\n## 选择刚体碰撞形状\n\
  \n最明显的处理对象是地板，因为它是 `Box` 形状。简单的形状总是更好！\n\n1. 对于地板，将 `Rigid Body` | `Collisions`\
  \ | `Shape` 设置为 `Box`。\n2. 为其余刚体选择最合适的碰撞形状。\n\n给我们平坦的地板一个漂亮的平坦形状，将帮助我们避免各种神秘的、不需要的行为。至于你一直在玩的那些其他刚体，尝试不同的形状看看它们的效果！此外，你可以查看\
  \ `Settings` | `Mass`、`Surface Response` | `Friction` 和 `Surface Response` | `Bounciness`\
  \ 等属性如何影响模拟。\n\n然后，当你玩够了，把你的主动刚体放在一边。是时候收起这些幼稚的东西……改玩积木了！\n\n## 摧毁一堵墙\n\n我最喜欢的部分来了：\n\
  \n![图 12.19：粉碎！](img/B17149_12_19.jpg)\n\n**图 12.19：粉碎！**\n\n我还需要多说吗？我们要用刚体砖块建一堵墙，然后把它撞倒！\n\
  \n## 建墙\n\n首先，我们将一砖一瓦地建墙。每块砖都是一个独立的刚体，所以诀窍在于确保我们正确堆叠砖块，并且它们具有正确的 `Rigid Body` 设置。\n\
  \n### 砖块\n\n每堵墙都从一块砖开始，所以让我们先制作一块：\n\n1. **添加** (`Shift` + `A`) 一个 `Cube` 到场景中。\n\
  2. 在 `Edit Mode` 中，将立方体缩放到砖块的大致尺寸。\n3. 确保砖块平放，不悬空也不与地板相交。\n4. 将物体命名为 `Brick`。\n\n\
  > **重要提示**\n>\n> 具有更改过的对象 `Scale` 值（即在 `Object Mode` 中缩放）的主动刚体将表现不正确，就好像它们比实际更大或更小。这又是一个在\
  \ `Edit Mode` 中缩放事物的理由。你也可以使用 `Apply` (`Ctrl` + `A`) | `Scale`。\n\n现在我们有了一块砖。我给我的砖添加了一个新材质和一个\
  \ `Bevel` 修改器，以便更好地看到每块砖：\n\n\n\n\n![Figure 12.20: A brick](img/B17149_12_20.jpg)\n\
  \n图 12.20：一块砖\n\n在我们大量复制这块砖来砌墙之前，我们应该先把它设置为一个具有所有正确参数的**刚体**。\n\n## 刚体停用\n\n我们需要为砖块启用的设置之一是启用\
  \ `Deactivation`（停用），这是一项在静止时自动激活和停用刚体模拟的功能：\n\n![Figure 12.21: Deactivation settings](img/B17149_12_21.jpg)\n\
  \n图 12.21：停用设置\n\n这不仅能提高性能，还能确保墙中的砖块像砖块该有的样子那样保持静止，直到我们让东西撞向它们时才开始“模拟”。\n\n让我们在调整砖块设置时利用这一功能：\n\
  \n1.  将 `Brick` 设为 `Active`（主动）`Rigid Body`（刚体）。\n2.  将 `Brick` 的 `Collision`（碰撞）|\
  \ `Shape`（形状）设为 `Box`（盒子）。\n3.  启用 `Dynamics`（动力学）| `Deactivation`（停用）。\n4.  启用\
  \ `Deactivation`（停用）| `Start Deactivated`（开始时停用）。\n\n现在 `Brick` 被计算为 `Box` 形状，虽然它是一个\
  \ `Active Rigid Body`（主动刚体），但它在模拟开始时不会移动。这不是最令人兴奋的事情，但砖块嘛，就是这样。\n\n这解决了 `Brick`\
  \ 所有必要的 `Rigid Body` 设置。`Brick` 的每个副本都将具有相同的 `Rigid` `Body` 属性。\n\n**提示**\n\n如果你需要一次性调整许多刚体的属性（例如在复制砖块*之后*调整所有砖块），有一种方法可以做到：全选它们，然后在编辑属性时按住\
  \ `Alt` 键。这个方便的小技巧对许多其他属性也同样有效！\n\n## 砌墙\n\n现在我们准备好复制这块砖并堆叠起来砌墙了：\n\n1.  选择 `Brick`\
  \ 并使用 `Duplicate Linked`（链接复制）（`Alt` + `D`）多次来制作一层砖块。\n2.  选择这一层砖块，复制它，并将新层放在旧层上方一个砖块高度的位置。\n\
  3.  将新层砖块向一侧移动半个砖块宽度。\n4.  选择两层，复制它们，并按两块砖的高度堆叠。\n5.  重复*步骤 4*，直到得到一堵像样的墙。删除最后一块悬空的砖。\n\
  \n**提示**\n\n使用 `Snapping`（吸附）来完美对齐砖块。\n\n现在我们有了一堵墙！\n\n![Figure 12.22: Example of\
  \ a wall](img/B17149_12_22.jpg)\n\n图 12.22：墙的示例\n\n这堵墙到底有多大或多宽并不重要。反正它也撑不了多久……\n\
  \n## 摧毁墙壁\n\n现在到了有趣的部分——破坏和混乱！我们将创建另一个刚体并用它来摧毁墙壁。只要你玩得开心，你可以把你的破坏球做成任何你喜欢的大小和形状：\n\
  \n![Figure 12.23: A wrecking monkey](img/B17149_12_23.jpg)\n\n图 12.23：一个破坏猴头\n\n\
  一旦我们做了一个又大又重的东西，我们需要让它撞向墙壁。为此，我们将学习如何通过关键帧直接控制它。\n\n### 创建破坏球\n\n首先，让我们把破坏球（或立方体，或猴头）添加到场景中：\n\
  \n1.  向场景中添加一个实体网格物体。\n2.  将你的新物体设为 `Rigid Body`（刚体）。\n3.  选择一个合适的 `Collision`（碰撞）|\
  \ `Shape`（形状）。\n4.  启用 `Settings`（设置）| `Animated`（动画）。\n\n现在我们有了一个撞倒墙壁的东西，让我们谈谈刚才启用的最后一个设置。\n\
  \n### 直接控制刚体\n\n我们如何让刚体做点什么？一直以来，我们主要是通过将刚体放在地板上方，看着它们的势能随着落地而耗尽来进行“玩耍”。为了从一侧撞倒墙壁，也许我们可以把破坏球放在斜坡顶端，像这样：\n\
  \n![Figure 12.24: A contraption for making the rigid body do what we want](img/B17149_12_24.0.jpg)\n\
  \n图 12.24：一个让刚体听话的装置\n\n这种设置场景并看着重力处理其余事情的过程很有趣，但这不完全是动画制作，对吧？\n\n`Rigid Body`（刚体）|\
  \ `Settings`（设置）| `Animated`（动画）是一个关键属性，它允许我们直接控制刚体，无论它是主动还是被动。禁用时，模拟不会对刚体的动画做出反应。启用后，刚体可以像其他物体一样被制作动画，并会影响模拟中的其他物体。\n\
  \n#### 实时与刚体交互\n\n就刚体物理而言，`Animated` 并不严格意味着某物被*制作了动画*（即设置了关键帧）。它涵盖任何非由模拟内部引起的运动，例如约束，或在本例中，在动画播放时手动移动物体。\n\
  \n你可以试一下：\n\n1.  播放动画。\n2.  在动画播放时，`Move`（移动）（`G`）你的破坏球撞向砖墙。\n\n这有点像电子游戏……差不多。虽然很好玩，在快速测试中也有其用处，但这种交互功能是有限的。我们的小游戏只是个游戏，它只持续模拟的帧范围那么长，然后就会重置。\n\
  \n接下来，让我们做最显而易见的事！\n\n### 为破坏球制作动画\n\n我们想把这里的项目称为动画，而不仅仅是一个每次播放 250 帧的奇怪物理沙盒。你猜到了——是时候给破坏球制作动画了。\n\
  \n这么做会发生什么，不会让你感到惊讶：\n\n![Figure 12.25: A destroyed wall](img/B17149_12_25.0.jpg)\n\
  \n图 12.25：一堵被摧毁的墙\n\n缺少了某些东西，那就是模拟对破坏球本身的影响。看它就在那里悬浮着。东西对它有反应，但它表现得像个**主宰者**，除了我们愚蠢地告诉它去哪里，它不对任何东西做出反应。它的\
  \ `Mass`（质量）可能是 `1000` kg 或 `0.001` kg，不管怎样都无所谓。如果它能和其他东西一起落在瓦砾中，或者在撞出一个凹痕后弹开滚走，那该多好。但\
  \ `Animated` 刚体始终是 `Passive`（被动）的，即使它是 `Active`（主动）的。\n\n……真是这样吗？虽然刚体可能无法同时受其 `Transform`（变换）属性和模拟的影响，但我们可以通过对\
  \ `Animated` 属性本身设置关键帧，在两者之间切换。\n\n这是我想展示的最后一个技巧：\n\n1.  为你的破坏球制作动画，使其以令人满意的速度冲破墙壁。\n\
  2.  对 `Animated` 属性设置关键帧，使其在破坏球撞击墙壁前刚好关闭。\n\n如果你对破坏球对墙壁的效果不满意，也可以调整破坏球的 `Mass`（质量）：\n\
  \n![Figure 12.26: The result of a wrecking ball with low mass](img/B17149_12_26.0.jpg)\n\
  \n图 12.26：低质量破坏球的结果\n\n这是最后一部分！现在我们抛出了破坏球，允许它撞向墙壁，同时表现得像其他任何刚体一样。\n\n![Figure 12.27:\
  \ Final result](img/B17149_12_27.0.jpg)\n\n图 12.27：最终结果\n\n继续玩转你的模拟，直到你对结果满意。接下来，我们将学习如何保存我们的工作（更准确地说，是\
  \ Blender 完成的工作）。\n\n## 烘焙模拟\n\n到目前为止，我们一直在“即时”模拟。每当我们对场景进行微小更改，缓存都会自动清除并重新计算模拟，以便我们查看更改的效果。当模拟轻量且我们在不断实验时，这很有趣，但最终我们会认为自己完成了。模拟结果将是完美的，然后我们希望保持原样，而不必担心意外的微小更改会清除缓存并改变结果。我们当然不想毁了所有的破坏成果！\n\
  \n这就是为什么烘焙模拟很重要：\n\n![Figure 12.28: Bake, and other operators for updating the cache](img/B17149_12_28.0.jpg)\n\
  \n图 12.28：烘焙，以及用于更新缓存的其他操作符\n\n\n\n\n`Bake` 是一个广泛的术语，出现在许多应用程序中，甚至在 Blender 中指代多个功能。烘焙模拟是指预先计算并保存结果。对于\
  \ `Fluid`（流体）或 `Cloth`（布料）等模拟，这通常需要很长时间，在这种情况下，这是计算模拟最可靠的方法。你可以把烘焙想象成一种渲染，只不过处理的不是图像，而是数据。\n\
  \n当你对模拟结果满意时，使用 `Rigid Body World`（刚体世界） | `Cache`（缓存） | `Bake`（烘焙）。模拟数据将与 `.blend`\
  \ 文件一起保存，并在你关闭项目后依然保留。点击 `Delete Bake`（删除烘焙）可“取消烘焙”并恢复编辑模拟。\n\n## 总结\n\n说到 Blender\
  \ 的刚体物理，Blender 使用了许多与其他应用程序提供的物理模拟相同的原理和术语（在某些情况下甚至可能是相同的代码）。这包括一些游戏引擎。\n\n我真希望能为每种物理模拟都写一章，但那本身就是一整本书的内容了。我们还有更多东西要制作动画，还有更多摄像机来观察它们！具体来说，我们将学习如何在动画中使用多个摄像机，并从各个角度捕捉动作。\n\
  \n## 问题\n\n1.  判断下列物体是否为刚体：雨滴。铅笔。棒球。袜子。卷饼。冷冻卷饼。马。\n\n2.  什么是刚体世界？你现在身处刚体世界吗？你能逃离吗？\n\
  \n3.  如何调整刚体世界的全局缩放？\n\n4.  不移动的刚体有什么意义？\n\n5.  想象一个马克杯放在桌子上。在 Blender 和现实生活中，说马克杯正在与桌子*碰撞*，这在技术上准确吗？\n\
  \n6.  凹面形状在刚体物理中如此棘手的技术原因是什么？\n\n7.  `Active`（激活）仅仅意味着刚体会移动，还是有更具体的含义？`Dynamic`（动态）意味着同样的事吗？`Animated`（动画）呢？\n\
  \n8.  当不可阻挡的力量遇到不可移动的物体时会发生什么？这不是禅宗公案或反问句——认真地说，在 Blender 中这样做会发生什么？\n\n## 使用多摄像机制作动画\n\
  \n在实拍电影制作中，摄像机可能是昂贵的设备。然而，在计算机图形学的世界里，没有这样的成本阻碍我们！作为动画师，我们可以在场景中拥有任意数量的摄像机。我们可以在特定时间用特定摄像机渲染，并通过其他摄像机查看场景。更重要的是，我们可以像插入关键帧一样轻松地控制摄像机之间的切换时机。\n\
  \n很难想象有哪种动画用不上这个功能。你有没有看过一部看起来像是一镜到底、只在一个摄像机前表演的电影？好吧，我也看过，但这并不常见！对于我们的动画项目来说，如果它们不是短片、教程练习或前卫的电影实验，我们就需要学习如何在多个摄像机之间进行选择。事实上，我们将学习如何让*时间*本身为我们选择摄像机，一个接一个。然后，我们将抛开刚才告诉时间做的事，一次性用所有摄像机进行渲染。\n\
  \n在本章中，你将探索以下内容：\n\n*   使用多个摄像机预览场景\n*   在 `Timeline`（时间轴）中切换摄像机\n*   在 `Video Sequencer`（视频序列编辑器）中切换摄像机\n\
  \n## 技术要求\n\n在几乎任何动画中拥有多个摄像机都很有用，因此这是一个开放式的章节。要跟随练习，你可以使用 Blender 中你喜欢的任何动画，无论是本书的练习还是你正在做的其他项目。\n\
  \n作为示例，我将使用一个包含两个角色对话的场景：\n\n![Figure 13.1: A scene with two characters](img/B17149_13_01.jpg)\n\
  \nFigure 13.1: 一个包含两个角色的场景\n\n在实拍制作中，此类场景通常在布置有两个或更多摄像机的棚内录制。在 Blender 中也不必有太大不同。\n\
  \n## 准备摄像机二号\n\n如果一个独眼人说，“我盯着你呢”，我们知道他说的是哪只眼睛。对于眼睛不止一只的人，我们需要他们指明。这里说的是哪只眼睛？如果我们把\
  \ Blender 中的摄像机想象成眼睛，如果我们有不止一个，就需要回答一个类似的问题。\n\n首先，让我们确保场景中有一些摄像机。\n\n### 设置多个摄像机\n\
  \n向场景添加摄像机简直太简单了。如果你知道如何用 `Add`（添加）（`Shift` + `A`）| `Camera`（摄像机）添加第一个摄像机，那么你也就知道如何用\
  \ `Add`（`Shift` + `A`）| `Camera` 添加第二个摄像机。添加第三个摄像机，我们使用 `Add`（`Shift` + `A`）| `Camera`，添加第四个摄像机就像使用\
  \ `Add`（`Shift` + `A`）| `Camera` 一样简单……你懂了。\n\n这是我的场景，有三个摄像机：\n\n![Figure 13.2:\
  \ A scene with three cameras](img/B17149_13_02.jpg)\n\nFigure 13.2: 一个包含三个摄像机的场景\n\
  \n默认情况下，每个摄像机对象使用自己唯一的 `Camera Data`（摄像机数据）——如 `Focal Length`（焦距）和 `Aperture`（光圈）等属性。因此，除了位于不同位置、指向不同物体外，你的多个摄像机在这方面还可以有各种设置。和许多其他事物一样，给摄像机起个具体的名字，而不仅仅是\
  \ `Camera.001`、`Camera.002` 等，也会有所帮助。\n\n一旦你的场景中至少有两个摄像机，你就需要知道如何实际通过第二个摄像机观察，或让它渲染出任何东西。\n\
  \n### 活动摄像机\n\n在场景中使用多个摄像机时，我们的主要关注点是知道哪个是 `active camera`（活动摄像机）——即默认用于渲染和查看场景的摄像机。通过导航到\
  \ `View`（视图） | `Viewpoint`（视点） | `Camera`（摄像机）（`Numpad 0` 小键盘 0），你将通过活动摄像机观察：\n\n\
  ![Figure 13.3: Camera view through the active camera](img/B17149_13_03.jpg)\n\n\
  Figure 13.3: 通过活动摄像机查看的摄像机视图\n\n同样，为了达到相同的结果，你可以走 `Render`（渲染） | `Render Frame`（渲染帧）（`F12`）这条路。如果你只有一个摄像机，那几乎肯定就是活动摄像机，你不必再多想。如果你从零个摄像机开始并添加一个，它会自动变为活动摄像机。同一时间只能有一个活动摄像机。\n\
  \n在第一个之后，我们添加到场景中的每个额外摄像机都将是非活动的：\n\n![Figure 13.4: One active camera and several\
  \ non-active cameras](img/B17149_13_04.jpg)\n\nFigure 13.4: 一个活动摄像机和几个非活动摄像机\n\n\
  请注意，在 3D 视口中，活动摄像机与非活动摄像机的绘制方式有细微差别。除非我们将其中一个设为活动摄像机，或在本章后面将学习的其他上下文中专门选择它们，否则这些额外的摄像机不会查看或渲染任何内容。\n\
  \n以下是将非活动摄像机设为活动摄像机的方法：\n\n1.  选择一个摄像机。\n2.  点击 `View`（视图） | `Cameras`（摄像机） | `Set\
  \ Active Object as Camera`（将活动对象设为摄像机）（`Ctrl` + `Numpad 0` 小键盘 0）。\n\n> **Tip**\n\
  > 活动摄像机是 `Scene`（场景）的一个属性，也可以通过 `Scene Properties`（场景属性） | `Scene`（场景） | `Camera`（摄像机）访问。\n\
  \n现在我可以通过另一个摄像机查看和渲染场景：\n\n![Figure 13.5: Camera view through a second camera](img/B17149_13_05.jpg)\n\
  \nFigure 13.5: 通过第二个摄像机查看的摄像机视图\n\n> **Tip**\n> 你可能会意外发现，任何类型的对象——不仅仅是摄像机——都可以被设为活动摄像机。虽然这用处有限，但偶尔可能会派上用场，例如当你希望从\
  \ `Spot Light`（聚光灯）的视角查看场景时。\n\n好吧，很好，但刚才还是活动摄像机的第一个摄像机现在变成非活动的了。和以前一样，我们仍然用一个活动摄像机查看和渲染场景，而多个非活动摄像机什么也不做。这引出了一个问题：这有什么用？让我们来找出答案。\n\
  \n### 在时间轴中切换摄像机\n\n\n\nAfter discussing all that deep knowledge about keyframes,\
  \ armatures, and object relationships, the time has finally come to perform the\
  \ most basic technique of film editing in animation: cutting from one camera to\
  \ another.\n\nRecall what I said earlier: only one camera can be active at a time.\
  \ Using the `Timeline`, we can determine which camera is active at any given frame.\n\
  \nWe can achieve this not with keyframes, but by using `Markers`:\n\n![Figure 13.6:\
  \ Markers in the Timeline bound to different cameras](img/B17149_13_06.jpg)\n\n\
  Figure 13.6: Markers in the Timeline bound to different cameras\n\n`Markers` are\
  \ interesting things. Usually, they are used to \"mark\" a frame for the animator's\
  \ own reference, and we don't have to use them if we don't want to... unless they\
  \ are the kind of markers that switch the active camera, in which case they are\
  \ indispensable!\n\nTo create a marker in the `Timeline` that changes the active\
  \ camera, we must `Bind` that camera to the marker. Here is how:\n\n1.  Go to the\
  \ frame where you want the active camera to change.\n\n2.  Select the camera.\n\n\
  3.  In the `Timeline`, use `Marker` | `Bind Camera to Markers` (`Ctrl` + `B`).\n\
  \n    This inserts a camera-shaped marker at the current frame and binds the camera\
  \ of the same name to that marker.\n\n4.  Repeat these steps for another camera\
  \ on another frame.\n\n**Tip**\n\nIt is best to use `Bind Camera to Markers` on\
  \ the very first frame of the animation to establish which camera is the starting\
  \ active camera.\n\nWhen a camera is bound to a marker, it becomes the active camera\
  \ for all frames after that marker until another marker bound to a different camera\
  \ is encountered. When the animation is rendered, using markers to switch cameras\
  \ is faithfully executed, just like playing the animation in the `Camera View`.\n\
  \nSince markers can be selected, moved, and duplicated just like keyframes, we can\
  \ easily create a large number of cuts and adjust exactly where each cut happens:\n\
  \n![Figure 13.7: Lots of camera switching in the Timeline](img/B17149_13_07.jpg)\n\
  \nFigure 13.7: Lots of camera switching in the Timeline\n\nKnowing this method of\
  \ switching cameras gives us a technique used in almost every film and TV show!\n\
  \nHowever, using only the active camera to view and render a scene has its limitations.\
  \ After all, there can only be one active camera at a time, and sometimes that is\
  \ not enough. For these situations, we have some additional features available.\n\
  \n## 相机覆盖\n\nKnowing what the active camera does and how to change it isn't the\
  \ whole story. What if we want to view or render the scene with something other\
  \ than the active camera? There are reasons and ways to do this.\n\n## 使用本地相机查看\n\
  \nWhen we play the animation in the `Camera View`, the playback faithfully switches\
  \ cameras at those cuts, so we can see in real-time what the rendered animation\
  \ will look like. However, depending on the situation, this camera switching might\
  \ not be what we want to see all the time. Suppose we have a non-active camera,\
  \ but we still want to review a part of the animation through that camera. Or perhaps\
  \ we need to look through that camera to decide exactly when to cut to it.\n\nIn\
  \ these cases, you can always set a camera as the `Local Camera`. To set a camera\
  \ to this mode for a given viewport, open the `3D Viewport` Sidebar (`N`) and go\
  \ to `View` | `View` | `Local Camera`:\n\n![Figure 13.8: The Local Camera feature\
  \ in the View tab](img/B17149_13_08.jpg)\n\nFigure 13.8: The Local Camera feature\
  \ in the View tab\n\n**Tip**\n\nThe `Local Camera` property is \"local\" to each\
  \ specific `3D Viewport` it is set on. You can customize the user interface to contain\
  \ as many such viewports as your computer can handle.\n\nNow we know a handy trick\
  \ for sticking to a single camera in the `3D Viewport`. Next, we will look at a\
  \ completely different kind of camera override.\n\n## 在视频序列编辑器中使用多个相机\n\nNow that\
  \ we know how to view the scene without the active camera, consider another scenario:\
  \ what if we want to *render* the scene without the active camera? Doing so allows\
  \ us to render the same moment from multiple angles, among other uses:\n\n![Figure\
  \ 13.9: A single jumping animation seen from different cameras](img/B17149_13_09.jpg)\n\
  \nFigure 13.9: A single jumping animation seen from different cameras\n\nTo achieve\
  \ this, we must turn once again to our old friend the `Video Sequencer`.\n\n###\
  \ 使用场景条带\n\nStarting from an animation scene with multiple cameras, let's give ourselves\
  \ a Video Sequence containing that scene as a `Scene Strip`:\n\n1.  Add a new scene\
  \ to the project (scenes are added and selected via the field in the top-right of\
  \ the window).\n\n2.  Name the scene something like `Sequence` to remember its purpose.\n\
  \n3.  Open the `Video Sequence` Editor in the UI.\n\n4.  In the `Video Sequence`\
  \ Editor, go to `Add` (`Shift` + `A`) | `Scene` to add the original scene as a `Scene\
  \ Strip`.\n\n5.  Find the `View Type` setting in the `Video Sequencer` header and\
  \ set it to `Sequencer & Preview`.\n\nYou should now have a scene strip in the Sequencer:\n\
  \n![Figure 13.10: A scene strip in the Video Sequencer](img/B17149_13_10.jpg)\n\n\
  Figure 13.10: A scene strip in the Video Sequencer\n\nScene strips are a powerful\
  \ and underestimated feature. They represent the frames of a given scene waiting\
  \ to be rendered and can be edited just like `Movie` or `Image/Sequence` strips,\
  \ allowing us to perform video editing techniques and add effects to one or more\
  \ scenes before rendering. The scene in a scene strip is automatically rendered\
  \ on demand when the Sequence scene is rendered, saving us the step of having to\
  \ render each scene first and import it back into Blender as a `Movie` or `Image/Sequence`.\
  \ While editing in the `Video Sequencer`, the scene's live `Camera View` stands\
  \ in for rendered frames to generate what is seen in the `Preview` area.\n\n**Tip**\n\
  \nIn the Sidebar (`N`), you can go to `View` | `Scene Strip Display` | `Shading`\
  \ to choose how scene strips are previewed in the `Video Sequencer`. Don't expect\
  \ `Rendered` to be fast.\n\nIf a project has multiple animation scenes, we can sequence\
  \ these scenes as scene strips in any order, along with transitions and effects,\
  \ and render the whole thing at once. But even with just one scene, we can use the\
  \ Sequencer to take advantage of multiple cameras in the scene.\n\n### 为场景条带选择相机\n\
  \nA useful feature of scene strips is found in the `Video Sequencer` Sidebar (`N`)\
  \ under `Strip` | `Scene`:\n\n![Figure 13.11: Camera property of a scene strip](img/B17149_13_11.jpg)\n\
  \nFigure 13.11: Camera property of a scene strip\n\nBy default, a scene strip uses\
  \ the scene's active camera for rendering, just like rendering normally from inside\
  \ the scene. However, when not empty, the scene strip's `Camera` property overrides\
  \ the active camera and renders the scene using the selected camera instead.\n\n\
  No longer constrained by linear time or the active camera setting, we can use this\
  \ feature to render from any camera in the scene, in any order, at any time. To\
  \ do this, follow these steps:\n\n1.  Duplicate (`Shift` + `D`) the scene strip\
  \ once for each camera you want to use from the scene.\n\n2.  Open the `Video Sequencer`\
  \ Sidebar (`N`) and find `Strip` | `Scene` | `Camera`.\n\n3.  For each strip in\
  \ the sequence, select the strip and choose a different camera for the `Camera`\
  \ property.\n\n4.  Use `Move` (`G`) or any tools you like to edit the sequence as\
  \ needed.\n\n\n\n\n即使场景中同一时间只能有一个活动摄像机，这也不再阻碍我们。现在我们可以从多个摄像机角度即时重播同一时刻。\n\n这只是开始；视频序列编辑器在叠加场景条带方面开启了各种可能性。在本例中，使用\
  \ `Wipe` 过渡，不是为了从一个条带过渡到下一个，而是使用两个不同的摄像机将帧在两个同步条带之间分割：\n\n![Figure 13.12: Split-screen\
  \ effect in the Video Sequencer](img/B17149_13_12.jpg)\n\nFigure 13.12: 视频序列编辑器中的分屏效果\n\
  \n你会想出什么效果？\n\n## 总结\n\n我不是在开玩笑，实拍摄像机非常昂贵。最好的租金要数千美元，外加一大笔押金。那只是摄像机本身；你还需要三脚架、起重机、滑轨和稳定器等安装设备，以支撑这台通常非常沉重的摄像机。然后你得雇佣一名受过专门训练的操作员来操作摄像机，他得有午休时间，否则会累得把摄像机摔了，你就损失押金了（你绝*不*想损失押金）。\n\
  \n好消息是这与我们无关！在 Blender 中，摄像机比泥土还便宜，比空气还轻，我们不需要付给任何人工会工资来操作它们。顺便说一句，这正是 3D 动画本世纪如此普及的一个重要原因，但那是另一个话题。\n\
  \n至于本书的最后一章，你可能还记得前面提到的线性时间，特别是关于不需要受其约束。这是否暗示我们的动画不必是线性的，甚至可能存在非线性动画编辑器？答案可能会让你大吃一惊！\n\
  \n## 练习题\n\n1.  为什么我们可能想要在场景中使用多个摄像机？\n\n2.  如果我们不能使用多个摄像机，如何绕过这一限制并仍能实现摄像机切换的动画效果？这样做可能会产生什么并发症？\n\
  \n3.  为什么该操作符称为 `Bind Camera to Markers`，如果它创建一个标记，而且只创建一个标记？\n\n4.  “活动摄像机是用于查看和渲染场景的摄像机。”上述说法是否总是正确的？\n\
  \n5.  有多少种不同的方法可以愚弄一个认为他们正在用活动摄像机渲染当前场景一帧的 Blender 用户？\n\n6.  如果我们想用不同的摄像机渲染同一帧段，但不能使用视频序列编辑器，还能做什么？\n\
  \n7.  如何将 `Sequence` 场景本身作为场景条带用于另一个序列中？\n\n8.  如果你渲染一个包含场景条带序列的序列编辑器场景的一帧，其中一个条带是另一个包含场景条带序列的序列编辑器场景，第二个序列中的场景条带能否是第一个序列中场景条带所在的同一场景，但帧不同？\n\
  \n9.  什么是段错误？你刚才遇到一个了吗？\n"
- "# 第 14 章：非线性动画\n\n关键帧存在哪里？在时间轴？图表编辑器？动作编辑器？当然，这三个编辑器都可以访问关键帧进行编辑，但关键帧真的在那里吗？也许真正的关键帧在动画属性的滑块上，每当它变黄时；又或许它们藏在\
  \ Blender 用户界面后面，每当你最小化窗口时就像蟑螂一样四散。*也许现在就有一个关键帧在你身后。*\n\n事实是这些都是愚蠢的答案，但“关键帧存在哪里？”是一个严肃的问题，有真实的答案。关键帧存在于\
  \ F-Curve 中，F-Curve 与动画通道是同一回事。动画通道存在于动作中，而直接影响动画的动作则存在于 `Nonlinear Animation editor`\
  \ 中。\n\n也称为 `NLA`，`Nonlinear Animation editor` 是 Blender 中每个动画的执行总部。使用此编辑器，整个动作可以加速、减速、组合和重叠，同时完全绕过时间轴、动作编辑器和图表编辑器中显示的内容。这使其成为我所谓的“更高层级”角色动画的绝佳工具，这意味着不使用关键帧，而是同时使用多个动作进行动画制作！\n\
  \n在本章中，我们将利用 `NLA` 的功能让 Rain 同时行走和说话，结合我们之前创建的两个动作。\n\n你将学习如何执行以下操作：\n\n*   将之前制作的动作导入新动画\n\
  *   在 `NLA` 中延长和重复动作\n*   在 `NLA` 中分层多个动作\n*   动态控制动作的时间\n\n## 技术要求\n\n`Nonlinear\
  \ Animation editor` 非常适合在单个角色动画中组合多个动作。要尝试这一点，请创建一个包含我们最喜欢的角色绑定 Rain 的新项目，就像我们自\
  \ *Chapter 6* 以来在每个角色动画练习中所做的那样。\n\n此外，我们需要两个适合组合的动作。如果你完成了 *Chapter 8* 和 *Chapter\
  \ 9* 的练习并保存了工作，那么你已经有了两个这样的动作：一个对口型动作和一个走循环动作：\n\n![Figure 14.1: Rain walking, Rain\
  \ talking](img/B17149_14_1.jpg)\n\nFigure 14.1: Rain 行走，Rain 说话\n\n使用 `Nonlinear\
  \ Animation editor`，我们将非破坏性地组合这些动作，让 Rain 同时行走和说话。\n\n# 复用动作\n\n动作是一种有趣的数据块类型。它们存储物体的所有动画通道；我们从本书开始就一直在创建它们，却几乎不需要考虑它们。动作会自动创建，通常整个动画中每个物体只有一个动作。当我们在\
  \ *Chapter 1* 中首次为 `Cube` 设置位置关键帧时，会自动创建一个名为 `CubeAction` 的动作。此后，属于 `Cube` 的每个属性的每个关键帧都存储在名为\
  \ `CubeAction` 的动作中，就这样了。Blender 从未提示过我们。我们为什么需要它提示？\n\n我们处理的所有其他动画也是如此，包括角色 Rain\
  \ 的动画。每次我们在新项目中为 Rain 制作动画时，都会为她创建一个动作，只考虑该动作中的关键帧，从未将动作本身视为动画数据的容器。然而，有时我们确实想考虑动作本身，这在角色动画中经常发生，特别是特定的动作……比如走循环。\n\
  \n## 追加走循环\n\n角色的走循环可能是项目中最可复用的单个动作。我们将通过导入在 *Chapter 8* 中创建的走循环（应名为 `Rain Walkcycle`）到新动画中来开始此练习。\n\
  \n让我们将走循环从另一个 `.blend` 文件追加到我们的新项目中：\n\n1.  使用 `File` | `Append` 并导航到你为走循环练习创建的\
  \ `.blend` 文件。\n2.  追加 `Rain Walkcycle` 动作。\n\n使用 `Append` 而不是 `Link` 可以避免在两个 `.blend`\
  \ 文件之间创建另一个依赖关系，并使在当前 `.blend` 文件中编辑走循环变得更容易。`Link` 仍然是一个可行且有时必要的选项。正如我们稍后将看到的，`Nonlinear\
  \ Animation editor` 允许我们使用追加和/或链接的动作来控制动画，而不改变动作本身。\n\n使用 `Append` 后，你不会立即看到变化，但\
  \ `Rain Walkcycle` 可供我们分配给角色。\n\n## 在动作编辑器中分配动作\n\n\n\n仅仅因为我们追加了走路循环，并不意味着 Rain\
  \ 就会开始走路。我们必须将该动作专门分配给 Rain 的骨架。动作可以在 `Action Editor`（动作编辑器）中分配，它基本上就像 `Dope Sheet`（动作表）一样，只不过它一次只编辑一个动作，并且在标题栏中间提供了这个非常重要的字段：\n\
  \n![Figure 14.2: The Active Action for the active object](img/B17149_14_2.jpg)\n\
  \nFigure 14.2: The Active Action for the active object\n\n此字段为空是因为 Rain 尚未制作动画。或者可以说，正是因为此字段为空，Rain\
  \ 才尚未制作动画。无论哪种情况，现在让我们来改变这一点：\n\n1.  选择 Rain 的骨架对象 `RIG-rain`。\n2.  通过进入 `Dope Sheet`\
  \ 并将 `Editing Context`（编辑上下文）更改为 `Action Editor` 来调出 `Action Editor`。\n3.  在 `Action\
  \ Editor` 的标题栏中，选择动作 `Rain Walkcycle`。\n\n现在 Rain 应该会像以前一样准确地走路了……\n\n![Figure 14.3:\
  \ A completely normal walk cycle](img/B17149_14_3.jpg)\n\nFigure 14.3: A completely\
  \ normal walk cycle\n\n嗯，也许不完全是。我们稍后会修复这个问题。\n\n### 隐藏动作\n\n当你从可用动作中选择 `Rain Walkcycle`\
  \ 时，你可能会注意到列表中挤满了其他一大堆动作：\n\n![](img/B17149_14_4.jpg)\n\nFigure 14.4: List of actions\n\
  \nFigure 14.4: List of actions\n\n我们不记得创建过这些，甚至不记得追加过它们！\n\n那是因为这些其他动作是在 Rain 绑定时制作的。并非所有动作都旨在直接用于动画中。这些额外的动作被\
  \ Action Constraints（动作约束）使用——这是一种特殊的约束，用于控制 Rain 骨架的各个部分。该动作通过一个或多个目标骨骼的移动来“播放”，从而使这些骨骼能够控制更复杂的运动。\n\
  \n我说角色绑定很复杂可不是开玩笑！话虽如此，让我们弄清楚为什么 Rain 现在走起路来一团糟。\n\n## 关于遗忘设置的惨痛教训\n\n我们看到的问题在分配动作时很常见。回想一下，在走路循环练习开始时，我们调整了\
  \ Rain 绑定中的一些重要属性，例如她的 `FK/IK Switch`（FK/IK 切换）设置。但我们并没有为这些属性插入关键帧，对吧？对于我们摆姿势的任何骨骼或更改的任何数值，如果我们没有为其插入关键帧，该动作就与它无关；我们对该属性所做的任何操作都不会带入新场景。没有它的动画数据，而动画数据是动作拥有的唯一东西！\n\
  \n这意味着我们必须手动修复这些被遗留的属性。为此，请执行以下步骤：\n\n1.  前往 Rain 的 `CloudRig` 设置。\n    在 `CloudRig\
  \ | Settings | FK/IK Switch` 下，将 Rain 的手臂设置为使用 `FK`，脊柱设置为使用 `IK`。\n2.  将 `Face Settings\
  \ | Eye Target Parent` 设置为 `Torso_Loc`（**2**）。\n\nRain 再次像我们记忆中那样走路了：\n\n![Figure\
  \ 14.5: Rain, with restored settings](img/B17149_14_5.jpg)\n\nFigure 14.5: Rain,\
  \ with restored settings\n\n> **Tip**\n>\n> 为了从一开始就避免这个问题，你只需要记住为任何必须摆姿势的特定骨骼或必须设置的属性插入一帧关键帧，以使动作按预期工作。为姿势/属性添加关键帧会将其存储在动作中，以便当动作被追加时，它能随其他动画数据一同携带。\n\
  \n在追加了走路循环动作并将其分配给 Rain 后，它的工作方式与自动创建的任何动作（当插入第一帧关键帧时创建）相同。现在我们已经修正了原始 `.blend`\
  \ 文件中遗留的任何剩余设置，这几乎就等同于我们在当前文件中创建了走路循环。使用 `Timeline`（时间轴）、`Dope Sheet` 或 `Graph Editor`（图表编辑器），我们可以像往常一样编辑和插入关键帧。\n\
  \n不过问题是——我们不需要编辑这个动作。事实上，我们将以一种方式使用它，使得在基本不改变其数据的情况下，轻松添加额外的动作并同时控制它们。\n\n## 动作条\n\
  \n考虑一下我们可能想对 Rain 的走路动画做的一些基本操作：\n\n*   在时间上偏移走路循环\n*   加快或减慢 Rain 的步伐\n*   开始/停止走路循环（换句话说，让循环重复有限的次数）\n\
  \n对于所有这些任务，我们已经知道一种解决方案：编辑关键帧！换句话说，选择关键帧，然后根据需要移动、缩放或复制它们。这通常是一个完美的解决方案，但并非总是如此。编辑关键帧意味着编辑动作，如果你链接了该动作，或者你不想复制或覆盖它，这就会有问题。\n\
  \n这就是 `Nonlinear Animation`（非线性动画）编辑器派上用场的地方。\n\n## 非线性动画编辑器简介\n\n虽然你可能认为你的动画完全由\
  \ `Dope Sheet`、`Timeline` 和 `Graph Editor` 中出现的关键帧控制，但 Blender 中的另一个区域一直在幕后操控一切：\n\
  \n![Figure 14.6: All the animation editors](img/B17149_14_6.jpg)\n\nFigure 14.6:\
  \ All the animation editors\n\n你是否曾好奇最后一个编辑器是做什么的？这里有一个简短的解释。\n\n当你移动关键帧时，你是在编辑动作，因为关键帧存在于动作内部。这不仅适用于\
  \ `Action Editor`；事实上，`Action Editor` 之所以这么叫，只是因为它一次编辑一个动作。`Dope Sheet`、`Graph Editor`\
  \ 和 `Timeline` 都在编辑动作。到目前为止，我们所称的所有动画都可以被认为是“动作编辑”，就像 3D 建模可能被称为“物体编辑”一样。\n\n但问题是：`NLA`\
  \ **不**编辑动作。相反，`NLA` 通过将动作作为一个离散元素来控制，从而编辑动画。\n\n### 查看非线性动画编辑器\n\n乍一看，我们可以看到 `NLA`\
  \ 为每个具有动画数据的对象显示一行：\n\n![Figure 14.7: The Nonlinear Animation editor, or NLA](img/B17149_14_7.jpg)\n\
  \nFigure 14.7: The Nonlinear Animation editor, or NLA\n\n正如预期的那样，这包括 `RIG-rain`，但也包括一些我们不记得制作过动画的对象：这是因为\
  \ Rain 自带许多驱动器，而驱动器也算作动画数据（尽管 `NLA` 不显示那些驱动器）。还记得我们看到的一堆不记得创建的动作吗？当角色绑定被链接/追加时，它会带来大量意想不到的数据。\n\
  \n但这并不意味着我们非得看它！我们只关心 `RIG-rain` 的动画，所以让我们去 `NLA` 隐藏其他所有东西：\n\n1.  调出 `Nonlinear\
  \ Animation` 编辑器。\n2.  在标题栏中，禁用 `Include Missing NLA`。\n\n这会清除所有那些空行。现在，只剩下 `RIG-rain`\
  \ 这一行，这正是我们所需要看到的一切：\n\n![Figure 14.8: A cleaner NLA showing Rain’s animation data](img/B17149_14_8.jpg)\n\
  \nFigure 14.8: A cleaner NLA showing Rain’s animation data\n\n最初，`NLA` 中没有太多东西，除了无法选择的一行关键帧，以及右侧边栏（`N`）中一些似乎没什么用的属性。让我们弄清楚这里发生了什么。\n\
  \n## NLA 中的动作\n\n当你展开 `RIG-rain` 的 `NLA` 行时，你会看到 `Rain Walkcycle` 中的关键帧，当我们在 `Action\
  \ Editor` 中为 Rain 选择它时，它成为了 `Active Action`（活动动作）。`Active Action` 是一个对象的动作，它暴露在除\
  \ `NLA` 之外的所有其他动画编辑器中。到目前为止，我们在本书中创建的每一个动作都是 `Active Action`；这是 Blender 中另一个一直伴随我们却不需要我们去思考的东西。\n\
  \n在 `Nonlinear Animation` 编辑器中，仅凭 `Active Action` 我们能做的事情不多。当我们将 `Active Action`\
  \ 转变为所谓的 `action strip`（动作条）时，`NLA` 才变得有用。\n\n### “下推”动作\n\n\n\n## NLA 中的动作条\n\n\
  动作条是一种可以在时间轴上移动并在非线性动画编辑器中操作的动作，这很像 Blender 视频序列编辑器中的不同条带。\n\n创建一个动作条后再解释它的作用会更容易，我们可以利用当前的\
  \ `Active Action`（活动动作）来创建。你只需前往 NLA 左侧边栏，点击 `Push Down Action`（下推动作）按钮——就是活动动作名称旁边的那个小按钮：\n\
  \n1.  在左侧边栏中，展开 `RIG-rain` 下的动画轨道。\n2.  点击活动动作的 `Push Down Action` 按钮。\n\n下推动作会将其转换为动作条，并将其放入属于该动作的对象的新\
  \ NLA 轨道中。\n\n`Rain Walkcycle`（雨行走循环）动作现在变成了一个动作条：\n\n![Figure 14.9: An action strip\
  \ in the NLA](img/B17149_14_9.jpg)\n\n图 14.9：NLA 中的动作条\n\n我们刚才所做的彻底改变了动画的工作方式，这是我们以前从未见过的。去打开任何其他动画编辑器——你将不再在时间轴、图表编辑器或动作编辑器中看到\
  \ `Rain Walkcycle` 的关键帧。关键帧似乎消失了……但 Rain 依然在动画！\n\n发生的情况是 NLA 接管了动画。从现在起，如果我们想了解\
  \ Rain 运动的情况，必须参考 NLA，它使用一个或多个动作条来控制角色的动画。\n\n接下来，我们将了解这个动作条能做什么。\n\n## 使用动作条\n\n\
  动作条到底是什么？简单来说，你所看到的是将整个动作包装成一个单一的离散对象，可以沿着轨道在时间上移动。向任一方向移动动作条，Rain 就会开始更早或更晚地行走。\n\
  \n这类似于一次性选择并移动所有关键帧，但有一个重要区别：移动的是动作条，而不是单个关键帧。就像坐在行驶列车上的乘客，关键帧在动作内部保持原位不动，作为一个数据块，动作本身保持不变。这类似于在\
  \ `Object Mode`（物体模式）下移动物体；物体作为一个整体移动，而其数据——顶点、边和面——固定在物体上。\n\n对于当前的练习，我们可以让 `Rain\
  \ Walkcycle` 动作条保持原位，但有一个迫切问题：动作条时长只有 24 帧，即一个行走“循环”，导致 Rain 走两步就停下了。这并不比之前好多少，但很容易修正。\n\
  \n### 延长循环动作\n\n动作条在右侧边栏 (`N`) 中也有各种属性，其中包括允许我们延长条带，使循环动画持续我们想要的时长：\n\n![Figure\
  \ 14.10: Action Clip properties](img/B17149_14_10.jpg)\n\n图 14.10：动作片段属性\n\n通常我们会使用\
  \ `Strip | Action Clip | Repeat`（条带 | 动作片段 | 重复）来实现，但在 `Rain Walkcycle` 的情况下，直接增加\
  \ `End`（结束）帧以填满整个动画长度会更好：\n\n1.  在非线性动画编辑器中选择 `Rain Walkcycle` 动作条。\n2.  在右侧边栏 (`N`)\
  \ 中找到 `Strip | Action Clip`（条带 | 动作片段）。\n3.  编辑 `End` 帧以将条带延长至动画的最后一帧。\n\n虽然行走循环不再无限重复，但它持续的时间与动画一样长，效果实际上是一样的：\n\
  \n![Figure 14.11: Extended action strip](img/B17149_14_11.jpg)\n\n图 14.11：延长的动作条\n\
  \n这样延长 `Rain Walkcycle` 之所以有效，是因为我们已经将大多数动画通道设为循环，包括一些骨骼通道，它们被设定为沿 `Y` 轴持续移动。增加\
  \ `End` 帧更可取，因为它允许这些骨骼继续移动，而不是每 24 帧就弹回原位。\n\n如果你还没这么做，可以将导致 `ROOT_Child` 向后移动的\
  \ `Y Location`（Y 位置）通道静音，从而让 Rain 的其余部分向前移动。但这需要编辑动作……\n\n### 微调动作条\n\n动作从其他动画编辑器中消失了——尽管它仍通过\
  \ NLA 影响动画——你可能会想：怎么找回它？想回去编辑一些关键帧难道这么疯狂？一点也不！如果下推动作是不可逆的，那简直是错误的，简直是不道德的。\n\n编辑在\
  \ NLA 中用作动作条的动作称为*微调*。操作方法：选择条带，点击 `Edit | Start Tweaking Strip Actions`（编辑 | 开始微调条带动作），或者直接按\
  \ `Tab` 键：\n\n![Figure 14.12: action strip being tweaked](img/B17149_14_12.jpg)\n\
  \n图 14.12：正在微调的动作条\n\n这会使相关动作重新出现在所有其他动画编辑器中，关键帧可以像往常一样再次插入和编辑。\n\n完成后，你可以在 NLA\
  \ 中再次按 `Tab`，或选择 `Edit | Stop Tweaking Strip Actions`（编辑 | 停止微调条带动作）。这很像在 `Object\
  \ Mode` 和 `Edit Mode` 之间切换，只不过是针对动作的！\n\n> **提示**\n>\n> 要完全恢复到开始使用 NLA 之前的状态，你随时可以删除所有动画轨道，并在动作编辑器中找回该动作。\n\
  \n有了动作条，我们可以用全新的方式思考动作，但我们还没看到最精彩的部分，那就是引入不止一个动作时。\n\n## 分层动作\n\n在 *第 8 章* 和 *第\
  \ 9 章* 的前几个练习中，我们制作了两个动画：Rain 行走和 Rain 说话。这两个练习创建了两个动作，其中一个我们已经追加了。我们的目标是追加第二个动作，并将其与第一个结合，让\
  \ Rain 在一个镜头中又走又说。这种情况在大型制作中并不罕见；例如，团队中的两名动画师可能分别为同一角色制作不同的动作，然后由第三名动画师将它们合并。又或者在游戏制作中，角色需要一个预制动作库（跑、跳、射击等），这些动作必须经过组合或紧凑序列测试。\n\
  \n如何结合两个动作？显而易见的方法是将关键帧从一个动作复制粘贴到另一个，创建一个巨大的*超级*动作。这通常是不可避免的，但也是破坏性且不灵活的。如果我们稍后想修改或偏移其中一个动作怎么办？又或者——这正是\
  \ NLA 大放异彩的地方——如果两个动作包含针对同一事物的动画通道怎么办？\n\n非线性动画编辑器解决了这些问题。在本节中，我们将学习如何使用 NLA 以非破坏性方式将两个或多个动作作为动作条进行组合。\n\
  \n## 追加第二个动作\n\n首先，我们需要找到在 *第 9 章* 中创建的对口型动作：\n\n1.  点击 `File | Append`（文件 | 追加），导航到你为对口型练习制作的\
  \ `.blend` 文件。\n2.  追加 `Rain Lipsync`（雨对口型）动作。\n3.  调整动画长度以适应新动作。\n4.  如果愿意，去视频序列编辑器添加对口型练习中使用的相同音频。\n\
  \n现在我们有了第二个动作，对口型动作可以在动作编辑器中分配给 Rain，就像我们在 NLA 中下推之前分配行走循环动作一样。但分配动作的方法不止一种……\n\n\
  ### 在 NLA 中添加动作\n\n如果我们在动作编辑器中为 Rain 选择新动作，它将成为新的活动动作，当我们返回 NLA 时可以看到这一点：\n\n![Figure\
  \ 14.13: Active Action alongside an action strip](img/B17149_14_13.jpg)\n\n图 14.13：活动动作与动作条并存\n\
  \n注意这不会替换现有的动作条！稍后详述。\n\n然后我们可以像处理第一个动作那样下推第二个动作，从而得到两个动作条供我们使用：\n\n\n\n![图 14.14：两个动作条](img/B17149_14_14.jpg)\n\
  \n图 14.14：两个动作条\n\n我们可以那样做，也可以通过直接在`Nonlinear Animation editor`中将动作添加为条带来节省几次按键。要执行此操作，请遵循以下步骤：\n\
  \n1. 前往`Nonlinear Animation editor`，确保选中`RIG-rain`。\n2. 使用`Add Action`（`Shift +\
  \ A`），选择你刚刚追加的对口型动作。\n3. 如有需要，将新动作条移动到正确的时间点。\n\n有两个动作条同时影响 Rain，我们终于能看到是什么让 NLA\
  \ 如此特别了！\n\n![图 14.15：两个动作条让 Rain 走路和说话](img/B17149_14_15.jpg)\n\n图 14.15：两个动作条让\
  \ Rain 走路和说话\n\n我们之前制作的那两个动作已被合成为一个完整的动画，同时将这两个动作保留在单独的轨道中——这使得它们更容易独立控制、调整，或作为链接库进行引用。现在，Rain\
  \ 可以在真正移动的同时说出她的台词了！\n\n## 动画条带时间\n\n这里还有一个我们可以用 NLA 做的技巧：控制时间本身！通过为一个简单的值制作动画，我们可以控制动作条的时间评估方式，从而模拟慢动作、延时摄影，甚至倒转时间让动作反向播放。\n\
  \n它是如何工作的？想象一下，你通过来回刷帧来玩弄你的动画，随着鼠标左右移动让 Rain 跳一小段舞。结果本身就是一种动画。本质上，你是在为当前帧号制作动画，这几乎正是我们在本节即将做的事情。\n\
  \n## Strip Time 属性\n\n我知道你在想什么：我们难道不能已经控制时间了吗？只需随意拖动一些关键帧，直到所有东西以我们想要的速度移动。这不就是动画吗？\n\
  \n不再是这样了！以这种方式编辑关键帧是破坏性且粗糙的，而且我们现在正在`Nonlinear Animation editor`中！我们已经超越了编辑那些繁琐的小关键帧的需求。\n\
  \n相反，我们只需要为`Strip Time`属性制作动画：\n\n![图 14.16：Strip Time 属性](img/B17149_14_16.jpg)\n\
  \n图 14.16：Strip Time 属性\n\n`Strip Time`属性决定当前帧，不是针对场景本身，而只是针对动作条。换句话说，我们可能位于帧`50`，但我们具体想看`Rain\
  \ Walkcycle`的哪一帧？现在由我们决定！\n\n### 为 Strip Time 属性设置关键帧\n\n让我们开始为`Rain Walkcycle`的`Strip\
  \ Time`属性设置关键帧：\n\n1. 在`Nonlinear Animation editor`中，选择 Rain 的走路循环动作条。\n2. 在右侧边栏（`N`）中，启用`Strip`\
  \ | `Active Strip` | `Animated` `Strip Time`。\n\n   启用此属性最初会冻结动作条。无论场景本身位于哪一帧，动作都认为它是`Strip\
  \ Time`指示的那一帧。必须有意地为该值制作动画，才能让事物再次移动。\n3. 在帧`0`处，为`Strip Time`值设置关键帧。\n4. 转到动画的最后一帧，将`Strip\
  \ Time`值设为不同的帧号，并设置关键帧。\n\n现在，为`Strip Time`值制作动画是让动作条时间前进的唯一方式，根据你如何为该值制作动画，走路循环的时间可能移动得非常慢或非常快。\n\
  \n在我们开始控制时间结构本身之前，通常最好先让时间正常流动，通过为`Strip Time`制作动画以匹配当前帧。这将帮助我们理解该功能的工作原理，并更容易选择确切的时间和方式来弯曲时间的流动。\n\
  \n### 从线性 Strip Time 开始\n\n让我们看看`Strip Time`的`F-curve`。在我的情况下，我在帧`0`设置了值`0.0`，在帧`250`设置了值`250.0`，所以我知道`Strip\
  \ Time`值将在这两个关键帧处匹配帧号：\n\n![图 14.17：Strip Time 的初始动画](img/B17149_14_17.jpg)\n\n\
  图 14.17：Strip Time 的初始动画\n\n但仍有插值的问题，它会产生加速和减速 Rain 步伐的有趣效果。\n\n让我们尝试使其完全线性：\n\n\
  1. 前往`Graph Editor`，找到你刚刚设置关键帧的`Strip Time`动画通道。\n2. 编辑`Strip Time`的关键帧，使其值等于帧号。\n\
  3. 将`F-curve`段设为`Linear`。\n\n现在我们回到了最无聊的线，字面上就是`X = Y`：\n\n![图 14.18：线性函数](img/Image96542.jpg)\n\
  \n图 14.18：线性函数\n\n这个一对一函数使`Strip Time`匹配当前帧，动作条再次表现正常。\n\n我发誓这么做是有原因的。现在，我们有一个合适的起点可以偏离，如这个例子中\
  \ Rain 直接走进慢动作区域：\n\n![图 14.19：线性时间变为子弹时间再变回](img/B17149_14_19.jpg)\n\n图 14.19：线性时间变为子弹时间再变回\n\
  \n仅用走路循环做这事不算最刺激，但你明白了——这就是事情真正变得非线性的部分。我们可以在一个镜头中让 Rain 减速、加速和倒放，而无需接触动作数据本身。我们可以让\
  \ Rain 处于慢动作中，而其他一切像延时摄影一样移动。如果我们也为 Rain 对口型动作的`Strip Time`值设置关键帧，我们可以让她在向前走时倒着说话，反之亦然。想象一下，当你添加更多自己的动作和角色时，你能做什么！\n\
  \n## 总结\n\n想象你在读一本关于 Blender 的书，指导你在每个练习中只建模一个且仅一个物体。直到最后一章你才学到什么是物体，以及如何使用所谓的`Object\
  \ Mode`将多个物体组合在一起。这就是教授`Nonlinear Animation editor`的感觉！\n\nNLA 有点晦涩难懂。截至写作时，真正理解如何使用它的人不多——基本上就我、阿姆斯特丹的十几个人、亚洲和澳大利亚的半打人，还有三个来自南美叫\
  \ Pablo 的不同家伙。我只开半玩笑。但现在你知道了 NLA 的作用和用法，你可以算作这个独家精英俱乐部的成员了！\n\n我们开始这本书学习如何为立方体制作动画，最后我们学会了如何为动画制作动画。这算是开始和结束旅程的不错方式。我想说你终于成为动画师了，但你不记得了吗？当你完成本书的*第\
  \ 1 章*时，你已经是动画师了。你当然仍是学生，但这很好——我也是学生，你知道吗。我将永远学习和制作动画，希望你也一样。谢谢阅读。\n\n## 问题\n\n\
  1. 动画师想要链接动作而不是使用`Append`的一些原因是什么？\n2. 动作中存储了什么数据？\n3. 为什么你可能想在为骨骼摆好姿势后只插入一帧关键帧，即使它不打算移动？\n\
  4. 为什么我们这个练习的`.blend`文件包含我们从未创建的动作？\n5. Blender 中哪个编辑器用于编辑动作？\n6. 为什么叫“下推”？\n7.\
  \ 当动作条移动时，动作会发生什么？\n8. 为什么`Strip Time`的`F-curve`不能包含在动作中？\n9. `Nonlinear Animation\
  \ editor`的“非线性”体现在哪里？\n10. 你能给“animate”、“animated”和“animation”这几个词多少个不同的技术定义？\n"
