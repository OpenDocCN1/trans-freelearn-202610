- '# Blender 3D 动画实现：Blender 3D 动画基础入门指南——从关键帧到角色动作


  本书献给我的妻子 Elina、我的父母 Mike 和 Charlotte，以及多年来教导我、激励我、并让我参与他们精彩艺术创作的 Blender 社区的众多成员。


  – Sam Brubaker


  ## 贡献者


  ## 作者简介


  **Sam Brubaker** 是一位艺术家、3D 动画师和 Blender 专家。2004 年偶然发现 Blender 后，Sam 立志成为一名动画师，2006
  年他的短片获得了 Blender 基金会颁发的 Suzanne 奖最佳动画奖。2012 年，Sam 从北卡罗来纳州立大学毕业，获得艺术与设计学士学位，随即开始了自由动画师的职业生涯，随后担任
  Blender 讲师。此后，他一直作为自由职业者和教育工作者生活在美国东西两海岸。他现在与妻子 Dr. Elina Thomas 定居在中西部。


  ## 审稿人简介


  **Daniele Daldoss** 是一位创意设计师，专注于将经典设计转化为动态图形和 3D 动画。他的工作范围从一次性艺术项目到全规模品牌开发，并额外在流程中融入数字技术。他的客户既有小企业，也有大型跨国公司。


  一年前，他受聘于一家国际公司，担任动态图形团队负责人。


  自 2005 年进入美术学院第一年起，他就开始从事 3D 设计。2014 年，在同事建议下改用 Blender，因为该软件更符合他的工作方式。他立刻爱上了它。如今，他全职使用
  Blender，无比开心。


  **Jonathan Daniel** 此时已使用 Blender 超过 6 年，是一位狂热的飞机和坦克爱好者，经常在 Blender 中将这些军用车辆建模作为爱好。


  ## 前言


  当有人对学习 3D 动画产生兴趣时，他们通常问的第一个问题是：“我该用什么软件？”


  根据最聪明、最有经验的动画师的回答，争论这个问题是浪费时间。应用程序只是工具，不是让你成为动画师的原因。重要的是动画师的创意、耐心和学习意愿。每一分钟花在纠结“哪个软件最好”上，都是在分散你实际制作动画的注意力，所以直接选一个开始吧！


  我喜欢这个答案，你呢？不管怎样，正确答案是 Blender。


  让 Blender 成为最好的不是它出色的功能和极具竞争力的价格（$0）。这个古怪的免费程序自 2004 年我作为青少年下载的版本以来已发生巨大变化。它作为动画师行业工具的适用性不再像过去那样有争议。但让它成为最佳
  3D 程序的原因丝毫未变——Blender 根据 GNU 通用公共许可证作为自由软件授权。不仅是免费如 $0，而是*真正*自由。该程序及其源代码可供任何人免费下载、修改和分享，并依法规定永远保持如此。它不会被其他公司收购。它永远不会向你收取订阅费。如果你打算在一个程序上投入数小时乃至数小时的时间和创造力，这一“特性”应是你最看重的。


  Blender 另一个未变的特点是教学的乐趣。Blender 向来充满用户偶然发现的功能。社区像学者分享晦涩知识一样互相分享这些“秘诀”。通过本书，我希望能与你分享一点这种魔力。


  ## 适读人群


  如果你是 3D 动画新手，想要开始使用最好的 3D 动画程序，本书适合你。凭借我培训各年龄和技能水平 3D 动画师的经验，我将从*第 1 章*早期就把你从新手摸索者转变为真正的动画师。仅需要对
  Blender 有最基本的入门熟悉度。


  也许你已经是合格的 Blender 用户，却尚未真正涉足动画领域；或者你是想转向开源流程的资深动画师；又或是刚读完本书*第 1 部分*的人。如果这听起来像你，你会在角色动画章节和进阶主题章节中找到有用的练习、技巧和评论。


  ## 入门所需


  本书不附赠电脑！要跟随练习并制作自己的 3D 动画，你需要 Blender、一台可运行它的合适电脑和互联网连接。


  | **书中涵盖的软件/硬件** | **操作系统要求** |

  | --- | --- |

  | Blender | Windows、macOS 或 Linux |


  让我们更详细地看看这一点。


  ### 你的动画工作站


  运行 Blender 的最低和推荐系统要求可在 Blender 官方网站找到：


  `https://www.blender.org/download/requirements/`


  几乎所有新款笔记本和台式电脑都能满足这些标准。即使你的机器不再是最新款，也很有可能完美运行 Blender。


  #### 硬件


  如果你在为 3D 动画专门选购新电脑或升级，我建议将预算投向独立的 NVIDIA 或 AMD 显卡。高性能 GPU 是确保动画在 Blender 中流畅播放的最关键电脑部件。


  你还需要鼠标和键盘。Blender 几乎利用键盘上每个键作为热键，因此带有所有功能键和小键盘的全尺寸键盘最有帮助。至于鼠标，这是不可商量的。你需要一只带有左键、右键和中间可点击滚轮的鼠标。触控板不行！


  #### 操作系统


  Blender 运行在 Windows、macOS 和 Linux 上。如果你有选择权且对 Linux 好奇，那恰好是 Blender 的最佳操作系统。现在是尝试的绝佳时机！





  简单来说，Blender 拥有 3D 视频游戏的所有技术要求。如果你有一台能运行最新游戏的电脑、一个能下载游戏的网络连接，以及一个反应够快能通关游戏的鼠标，那你大概率已经拥有制作
  3D 动画所需的所有硬件了。


  ## 先决知识


  虽然本书是为初学者编写的，但我们将跳过最基础的入门知识，直接在第一章开始制作动画。这意味着你需要对 Blender 和计算机有一定的初步了解。


  ### 计算机基础知识


  你必须知道什么是文件，因为我们会将文件保存到文件夹中。稍后，我们需要点击这些文件夹，找到之前保存在那里的文件。


  ### Blender 基础操作


  你可以是 Blender 新手，但不能是从未见过 Blender 的人。你知道如何在 Blender 中导航 3D 空间并从各个角度查看默认立方体吗？选中立方体并沿特定轴将其移动到不同位置怎么样？你能删除立方体并用球体替换它吗？如果这些任务听起来不太难，你就已经具备了攻克本书的能力。


  最后，你必须能够自行下载并安装 Blender。


  ## Blender


  Blender 可免费下载，安装简便。最新版本可从官方网站 [blender.org](https://blender.org) 下载，但所有历史版本也均可获取。


  针对本书，我建议在此处下载并安装 4.0.2 版本：


  [`download.blender.org/release/Blender4.0/`](https://download.blender.org/release/Blender4.0/)


  下载与你的操作系统匹配的安装包并进行安装。使用此版本将确保你屏幕上看到的内容与本书中的 Blender 说明和截图保持一致。


  Blender 由 Blender 基金会的开发者和全球社区共同维护。尽管软件更新频繁，但基金会会保留所有历史版本供下载。Blender 的向后/向前兼容性相当不错，因此
  Blender 的后续版本（如 4.1、4.2 等）也可能适用于本书中的练习。不过这种情况会随着时间的推移逐渐改变。


  ## 本书内容概览


  - **第 1 章：时间轴中的基础关键帧** – 为了循序渐进地引入关键帧主题，涵盖了如何使用默认立方体和 Blender 最基础的动画编辑器 `Timeline`（时间轴）创建一个基础动画。

  - **第 2 章：`Graph Editor`（图表编辑器）** – 探讨 Blender 的 `Graph Editor`（图表编辑器），它是创建复杂运动不可或缺的工具。为了领会该工具的实用性和重要性，我们将用它制作一个弹跳球动画。

  - **第 3 章：`Bezier Keyframes`（贝塞尔关键帧）** – 探讨 `Bezier keyframes`（贝塞尔关键帧）。这些多功能的关键帧提供了对
  `F-Curve`（F 曲线）形状的直接控制，让动画师能直接“绘制”动画。这将用于我们的第三个练习：制作独轮车动画！

  - **第 4 章：深入了解对象关系** – 通过考察对象被父子化、约束和驱动的方式，教会我们如何让对象在不直接制作动画的情况下精确移动。

  - **第 5 章：渲染动画** – 探讨渲染。你的动画不能永远只存在于 `.blend` 文件中。你会想将其渲染为一系列静态帧，并将这些帧导出为可与他人分享的视频文件。

  - **第 6 章：链接与摆姿势角色** – 探讨角色的链接与摆姿势。有志成为动画师的人应熟悉使用专业级骨架进行角色动画制作。在本章中，你将认识 Rain，这是一个由
  Blender 基金会免费提供的优秀骨架。

  - **第 7 章：基础角色动画** – 探讨角色动画，这需要为单个场景管理数百甚至数千个关键帧。为了高效完成此任务，需要用到 Blender 中的两个新区域：`Dope
  Sheet`（动作表）和 `Action Editor`（动作编辑器）。

  - **第 8 章：走路循环** – 探索让角色走路，这至关重要但也很棘手！我们必须更加仔细、精确地运用前几章的工具和技术。在此过程中，我们将学习一些确保动画对称和脚步平滑的额外技巧。

  - **第 9 章：声音与对口型** – 将指导你完成导入配音音频文件并制作 Rain 嘴部动画以匹配语音的过程。

  - **第 10 章：道具交互与动态约束** – 涵盖道具交互。拾起物体并扔出去是在现实生活中简单却难以制作动画的众多动作之一。我们需要添加自己的约束，在精确的时间应用其效果，甚至为其影响力制作动画。

  - **第 11 章：`F-Curve Modifiers`（F 曲线修改器）** – 回到 `Graph Editor`（图表编辑器）。`Graph Editor`
  还有更多不为人知的功能！`F-Curve modifiers`（F 曲线修改器）允许动画师在无需无尽关键帧的情况下生成无限运动！制作时钟动画将是我们应用这一实用功能的练习。

  - **第 12 章：刚体物理** – 探索刚体物理。既然电脑能代劳，为什么还要手动为大量对象制作动画？在本章中，我们将制作一个拆迁球摧毁墙壁的动画——这是使用
  Blender 刚体模拟功能的绝佳机会。

  - **第 13 章：多摄像机动画制作** – 涵盖在一个动画中使用多个摄像机对象的各种方法。大多数电影和电视剧都是用多台摄像机拍摄的。3D 动画没有理由不采用同样的方式。

  - **第 14 章：非线性动画** – 探索 Blender 可能最神秘、最晦涩的功能：`Nonlinear Animation Editor`（非线性动画编辑器），它允许你为你的动画制作动画。


  ## 充分利用本书


  本书每一章都包含一个带有指导说明的动画练习。我建议你坐在电脑前阅读，并在 Blender 中跟着操作！这才是初衷——当然你也可以决定不按顺序阅读章节，或自担风险地不遵循说明。这只是一本书，又不是教书先生。


  每章的“*Technical requirements*”（技术要求）部分会告诉你跟随练习所需的其他内容。有些章节要求你下载由笔者专门为本书准备的特定文件。其他章节可能需要用到你之前创建的资产，所以请务必记得在练习结束时保存你的工作！


  最后，每章末尾都有一个“*Questions*”（问题）部分，用于检验你的学习成果。这些可不是普通的小测验！有些问题很直接，答案在前文中给出。其他问题旨在让你进行批判性思考或在
  Blender 中自行探索。少数是玩笑或陷阱题，但最难的问题是那些听起来像陷阱实则不然的……如果你能答对其中任何一个，你就得 A+ 了。


  ## 分享你的想法


  读完《Realizing 3D Animation in Blender》后，我们非常期待听到你的想法！请[点击此处前往亚马逊评论页面](https://packt.link/r/1801077215)为本书留下反馈。


