- '# 第 1 章：时间轴中的基础关键帧


  对于我们在 Blender 中的第一个动画，我们将为默认立方体制作动画。它总得有点用处！这可能看起来枯燥乏味，但我们最初必须保持简单，即使是简单的物体也能讲述故事。我们的故事将是一个关于年轻立方体的
  5 秒史诗：它向东冒险进入未知领域，随后转身，返回家园，最终在旅途的许多帧中磨砺得休息下来。


  本练习将作为 Blender `Timeline`（时间轴）以及 `keyframes`（关键帧，任何动画的构建基块）的入门介绍。我们将使用 `keyframes`
  来确定立方体在不同时间点的位置、旋转和颜色。


  虽然本章面向对 Blender 动画系统零基础的读者，但您需要具备一些 Blender 基础功能的使用经验。这包括在 3D 视口中导航、编辑数值，以及在 3D
  空间中选择和移动物体。


  在本章中，我们将涵盖以下主要主题：


  * 导航时间轴

  * 使用关键帧创建简单移动

  * 在时间轴中编辑关键帧

  * 为 Blender 中几乎任何属性制作动画


  ## 技术要求


  要跟随练习，您只需要在满足最低系统要求的计算机上运行 Blender 4.0。更高版本的 Blender 也可能适用于本书，仅有细微差别，尽管无法保证。


  ![图 1.1：Blender 4.0 中的默认场景，此处显示为“打印友好”主题](img/B17149_01_1.jpg)


  图 1.1：Blender 4.0 中的默认场景，此处显示为“打印友好”主题


  如果您已经对用户偏好设置或启动文件进行了重大更改，请转到 `File`（文件） | `Defaults`（默认值） | `Load Factory Settings`（加载出厂设置）以恢复图
  1.1 所示的相同环境。


  > **提示**

  >

  > 暂时无需点击屏幕顶部的 `Animation`（动画）选项卡，也无需切换到任何其他 `workspace`（工作区）。本章的所有内容都可以在默认的 `Layout`（布局）工作区中完成。请记住，工作区只是为您方便而预设的窗口配置。它们并非各自标记任务所必需的。由于
  Blender 的界面非常灵活，我通常忽略它们或自行创建。


  ## 导航时间轴


  在 Blender 中打开一个新文件，看看 3D 视口正下方底部的编号区域。这个区域称为 `Timeline`（时间轴），是动画工作最基础的编辑器：


  ![图 1.2：时间轴](img/B17149_01_2.jpg)


  图 1.2：时间轴


  `Timeline` 显示您的 `keyframes`（关键帧），并包含用于播放和基本 `keyframe` 编辑的控件。动画制作的大量工作将涉及此窗口和/或
  Blender 的其他几个动画编辑器之一。


  ### 在时间中移动


  您在 Blender 中学到的第一件事可能是如何导航 3D 视口，使用中键和各种键盘快捷键在 3D 空间中移动视角。出于同样的原因——您在实际建模前需要学会导航——您必须在制作动画前学会在时间中导航。


  在 `Timeline` 的 `header`（页眉，带有菜单的部分）中，您将看到一些菜单、播放控件，最后是一些整数属性：


  ![图 1.3：从左到右——当前帧、起始帧和结束帧属性](img/B17149_01_3.jpg)


  图 1.3：从左到右——当前帧、起始帧和结束帧属性


  这些是您场景的 `Current Frame`（当前帧）、`Start Frame`（起始帧）和 `End Frame`（结束帧）属性。其中最关键的是 `Current
  Frame`。


  `Current Frame` 是一个非常特殊的属性，它决定了场景显示的帧，即时间点。正如您必须从许多不同角度查看 3D 模型一样，作为动画师，您在工作时必须穿梭于时间中，在许多不同的帧上查看您的动画场景。


  更改 `Current Frame` 值会在动画中向后和向前移动时间。有多种方法可以做到这一点：


  * 直接在 `Timeline` 的页眉中编辑 `Current Frame` 值

  * 点击 `Timeline` 帧号行上的任意位置

  * 点击键盘上的左右方向键

  * 按住 `Alt` 键的同时滚动鼠标滚轮


  > **提示**

  >

  > `Timeline` 中标记当前帧的垂直蓝线称为 `playhead`（播放头/当前帧指示线）。拖动 `playhead` 左右移动的技术称为 `scrubbing`（擦洗/拖动预览），这对于审查和检查动画至关重要。


  试试这些方法。当您调整 `Current Frame` 值时，`Timeline` 中 `playhead` 的水平位置会随之移动。请记住，因为我们还没有制作任何动画，所以
  Blender 中没有其他东西会移动。


  ### 设置帧范围


  Blender 中的默认场景 `Start Frame` 值为 `1`，`End Frame` 值为 `250`。这意味着动画将从第 `1` 帧开始，到第 `250`
  帧结束，总时长为 250 帧。在默认的每秒 24 `frames per second`（`FPS`，帧率）下，这将产生一个略长于 10 秒的动画。


  > **提示**

  >

  > 您动画的 `Frame Rate`（帧率）设置位于 `Properties Editor`（属性编辑器）中 `Output Properties`（输出属性）的
  `Dimension`（尺寸）面板里。然而，在本书的其余部分，我们将坚持使用每秒 `24` 帧，这是一个很好的可整除数字，且通常与胶片般或“电影感”的外观相关联。






  ## 设置结束帧


  对于我们的第一个动画来说，`250` 帧实在太多了，所以让我们缩短一下工作范围。将 `End Frame`（结束帧）属性从 `250` 调低到 `120`：


  ![Figure 1.4: End Frame set to 120](img/B17149_01_4.jpg)


  图 1.4：结束帧设置为 120


  这将动画时长缩短为 `120` 帧，正好 5 秒。足够我们进行这场史诗般的三幕冒险了！


  ## 调整时间轴视图


  虽然我们已将动画设置为在第 `120` 帧结束而非第 `250` 帧，但时间轴显示的帧号范围仍然是 `0` 到 `250`。我们不再关心 `120` 之后的任何帧，所以让我们调整视图，以更有效地利用该区域的水平跨度：


  1. 在时间轴中按住中键并向右拖动，将帧范围 `0` 到 `120` 大致移动到区域中心。

  2. 使用滚轮或按住 `Ctrl` 加中键进行缩放，使时间轴仅显示感兴趣的范围 `0` 到 `120`。


  正如你所见，更改时间轴视图的控制方式与 Blender 中几乎所有其他区域都大同小异：


  ![Figure 1.5: The Timeline, adjusted to show only frames 0 to 120](img/B17149_01_5.jpg)


  图 1.5：调整后的时间轴，仅显示第 0 到 120 帧


  > **提示**

  >

  > 如果你在时间轴中迷失了方向（实际上几乎在任何其他编辑器中也是如此），请按 `Home` 键或前往 `View | Frame All`（视图 | 全部帧）。这与我们刚才所做的效果相同，恢复编辑器视图，使所有可见内容完美居中。


  在后续章节中，随着动画变得更复杂，我们将需要四处滚动，在不同关键帧处放大缩小。但对于本章的其余部分，我们可以保持时间轴视图原样。


  ## 动画播放


  **播放**控制和跳转到特定帧的控制位于时间轴标题栏的中心：


  ![Figure 1.6: Timeline playback buttons](img/B17149_01_6.jpg)


  图 1.6：时间轴播放按钮


  按下 `spacebar`（空格键）或点击 `Play`（播放）按钮将播放你（目前非常无聊的）动画，以既定的帧率快速递增 `Current Frame`（当前帧）数值。按下
  `Ctrl` + `Shift` + `Spacebar` 或点击向后的 `Play`（播放）按钮将倒放动画。除非停止，否则动画将循环播放，到达 `End Frame`（结束帧）后跳回
  `Start Frame`（开始帧）。


  你可以通过再次按下 `spacebar`（空格键）或按下时间轴上的 `Pause`（暂停）按钮，在当前帧**立即停止**动画。按下 `Esc` 将停止动画并返回播放开始时的原始帧。请记住，在尝试编辑任何内容之前先停止动画。


  > **提示**

  >

  > 播放和停止动画是如此频繁的操作，以至于我几乎总是使用键盘快捷键而不是点击这些按钮。播放的热键在每个编辑器中都有效，所以你不必总是打开时间轴。


  ## 使用关键帧创建简单移动


  在第一幕中，我们的主角 `Cube`（立方体）将无畏地从西向东大步前行。我们将使用关键帧来实现这一点，这是一种源自传统手绘动画流程的技术。


  在手绘动画中，主管动画师绘制镜头中最重要的帧，即“关键帧”，它们决定了角色和物体在关键时间点的位置和表情。这些关键帧随后交给“中间绘制师”，由他们绘制中间的其余帧，以创造出平滑的运动外观。


  在 Blender 和其他动画应用程序中，关键帧扮演着相似但简单得多的角色：*确定某个属性在给定帧上的数值*。亲自动手比阅读更容易理解，所以让我们直接开始吧！


  ## 为初始位置设置关键帧


  首先，我们要给主角 `Cube` 一个合适的起始位置：


  1. 前往第 `10` 帧。

  2. 选择 `Cube`。

  3. 在 `Z` 轴上将 `Cube` 向上移动 `1` 个单位，使其在 3D 视口中静止于“地板”上。

  4. 在 `X` 轴上将 `Cube` 向左移动 `-5` 个单位。

  5. 现在，让我们插入第一个关键帧！保持 `Cube` 选中状态，并将鼠标光标放在 3D 视口中，按下 `I` 键。


  这将弹出 `Insert Keyframe`（插入关键帧）菜单，这是插入位置关键帧的几种方法之一：


  ![Figure 1.7: The Insert Keyframe menu](img/B17149_01_7.jpg)


  图 1.7：插入关键帧菜单


  这里显示的是所选物体部分（并非全部）可设为关键帧的属性列表。点击 `Location`（位置）以插入位置关键帧。


  > **重要提示**

  >

  > 从现在开始，请时刻注意你选中了什么以及当前处于哪一帧，尤其是在插入关键帧时。


  ## 已设关键帧的属性


  我们刚刚在第 `10` 帧为 `Cube` 的位置插入了一个关键帧。这意义重大！未来我们将一次性插入和编辑数十个这样的关键帧，但目前，让我们细细品味一下发生了什么变化。


  首先，时间轴中出现了一个小菱形。如果一开始没看到，向上滚动或按 `Home` 键；它可能藏起来了：


  ![Figure 1.8: New keyframe on frame 10](img/B17149_01_8.jpg)


  图 1.8：第 10 帧上的新关键帧


  就时间轴而言，这就是我们的关键帧。它的水平位置标记了你为 `Cube` 的某个属性“设置关键帧”的那一帧。虽然在时间轴中还看不出来，但它也包含了设置关键帧时 `Cube`
  的 `Location`（位置）属性的 `X`、`Y` 和 `Z` 值。


  > **提示**

  >

  > 默认情况下，时间轴仅显示选中物体的关键帧；当你选择不同物体时，它们会隐藏。在后续章节中，我们将探讨更适合同时显示多个物体关键帧的其他编辑器。


  其次，看看 `Cube` 的 `Transform`（变换）属性：


  ![Figure 1.9: The keyed Location property](img/B17149_01_9.jpg)


  图 1.9：已设关键帧的位置属性


  `Location`（位置）数值现已高亮显示，并由右侧的一小组关键帧形状的图标加以区分。这表明它们已被“设为关键帧”。


  > **提示**

  >

  > 当当前帧上有该属性的关键帧时，动画属性高亮显示为黄色；在其他帧上为绿色；手动更改时为橙色。


  尝试再次移动 `Cube`，然后切换帧。`Cube` 将立即“弹回”其设关键帧的位置。该属性已被其关键帧“接管”。从现在起，除非你为它插入另一个关键帧，否则你对立方体位置所做的任何手动更改都只能是暂时的。


  > **重要提示**

  >

  > 单个属性不能在同一帧上拥有两个关键帧。如果你在已有关键帧的地方插入关键帧，新关键帧将直接替换旧关键帧。


  ## 为第二个位置设置关键帧


  播放动画并仔细观察 `Cube` 发生了什么。什么也没发生！现在，倒放动画。会发生什么？同样什么也没发生——但现在是倒着发生的。


  我们的一个关键帧仅仅决定了 `Cube` 必须在第 `10` 帧位于某个特定位置，但一个关键帧不足以创造运动。在我们添加第二个位置关键帧之前，`Cube` 将保持在同一个位置——不仅在第
  `10` 帧，而且在其他所有帧上也是如此。


  让我们添加第二个关键帧：


  1. 前往第 `40` 帧。

  2. 在 `X` 轴上将 `Cube` 向右移动 `10` 个单位。

  3. 按 `I` 并插入另一个 `Location`（位置）关键帧：


  ![Figure 1.10: The Cube on frames 10 and 40](img/B17149_01_10.jpg)


  图 1.10：第 10 帧和第 40 帧上的立方体


  现在，播放动画。`Cube` 动了！仅仅两个关键帧就足以创造运动。现在让我们仔细看看这两个关键帧之间发生了什么。


  ## 关键帧设置原则





  ## Blender 中的关键帧动画


  注意，我们从未向 `Cube` 发出任何“命令”来使其移动。例如，我们并未编码任何事件，如“在第 `10` 帧开始移动”，或“在第 `40` 帧后停止移动”。这是初学者常有的一种误解。通过插入这些关键帧，我们只是声明在第
  `10` 帧时 `Cube` 应位于某特定位置，而在第 `40` 帧时应位于另一位置。


  此外，观察当你切换帧时 `Cube` 的 `X Location` 值会发生什么变化：


  ![Figure 1.11: The Location property on frame 20](img/B17149_01_11.jpg)


  **图 1.11：** 第 20 帧上的 Location 属性


  虽然我们可能会说我们“给 `Cube` 做了动画”，但更准确的说法是我们只给 `Cube` 的一个属性（`Location`）做了动画，即便如此，该属性的三个分量中也只有一个真正发生了变化（即
  `X Location`）。目前，`Cube` 的其他一切（例如其 `Rotation` 和 `Scale`）均保持不变。


  最后，请注意，我们无需干预第 `10` 帧和第 `40` 帧之间的另外 29 帧，就能让 `Cube` 平滑地从一处移动到另一处。Blender 会自动处理这一过程，为我们充当了“中间帧绘制员”的角色。这可以说是数字动画相较于传统动画所提供的最大优势。


  > **Tip**

  >

  > 一个值过渡到另一个值的方法称为**插值**。我们将在下一章探讨几种不同的插值模式。


  ## 关键帧旋转


  在我们这部史诗般的 120 帧动画的第二幕中，`Cube` 思乡心切，*转过身来*，准备踏上漫漫归途回到诞生地。我们将通过关键帧 `Rotation` 属性而非
  `Location` 属性来制作这部分动画。


  正如你所料，我们可以遵循与之前相同的流程，使用 `Insert Keyframe`（`I`）菜单。既然你已经有了一些练习，我们可以更快地讲完这部分：


  1.  前往第 `45` 帧。

  2.  确保 `Cube` 仍处于选中状态。

  3.  按 `I` 唤起 `Insert Keyframe` 菜单并点击 `Rotation`。

  4.  前往第 `55` 帧。

  5.  在 `Z` 轴上将 `Cube` 旋转 `180` 度（顺时针或逆时针均可，随你喜好）。

  6.  重复*步骤 3* 以插入第二个旋转关键帧。


  现在 Timeline（时间轴）中应该显示有四个关键帧：两个用于立方体的位置，两个用于其旋转。目前，仅凭观察 Timeline 无法分辨哪个是哪个，但请放心，它们是截然不同的。我们将在下一章学习如何更仔细地查看它们的内容。


  现在当你播放动画时，`Cube` 将从西向东移动，停顿 5 帧，然后利索地旋转 10 帧以面向相反方向。


  ## 在 Timeline 中编辑关键帧


  我们准备好为惊心动魄的第三幕大结局制作动画了！在背弃了东方的边境后，我们的主角 `Cube` 将踏上归途，带着旅途的疲惫，回到生命开始的原点休息。


  为了制作这最后一部分动画，我们可以继续沿用一直在练习的技巧——前往新帧、移动物体、插入关键帧，等等——但还有其他可用的动画制作方式，你有必要了解一下。


  事实上，Timeline 不仅仅是一个显示关键帧的窗口。我们还可以用它来编辑关键帧！在本节中，我们将暂时搁置所学的使用 `Insert Keyframe`（`I`）菜单插入新关键帧的方法，转而使用
  Timeline 来利用我们已经制作好的关键帧。


  ### 基础关键帧编辑


  如何编辑关键帧？目前你只需了解以下操作：


  *   在 Timeline 中选择关键帧，用你惯用的鼠标按键点击即可。按住 `Shift` 并点击可选择多个关键帧。

  *   使用 `Grab`（`G`）在时间轴上移动选中的关键帧。你也可以用选择时用的同一个鼠标按键点击并拖动关键帧。

  *   要**复制**关键帧，请使用 `Duplicate`（`Shift` + `D`）。复制的关键帧会“吸附”在光标上，就像你对它们使用了 `Grab`（`G`）一样。


  如果你觉得这只是一堆你已经熟知的控制方式，你完全正确！如果你知道如何在 3D 视口中选择、移动和复制物体，那么你就已经知道如何在 Timeline 中选择、移动和复制关键帧了。*控制方式完全相同。*


  许多其他操作和控制方案也是如此。如果在 3D 视口中有效，那么它大概率也适用于 Timeline 和其他动画编辑器。


  > **Tip**

  >

  > 选中的关键帧会以黄色高亮显示。新插入的关键帧会自动被选中。在复制关键帧等操作前，请确保你的选择中没有不需要的关键帧。如果操作的关键帧比你打算的多，很容易搞乱一切！


  ### 复制关键帧


  直接编辑关键帧的一个常见用途是复制动画的特定片段以节省时间。要让 `Cube` 回到原位，我们不必亲自移动它回去；只需复制我们之前制作的一个关键帧即可：


  1.  选择我们在第 `10` 帧创建的关键帧。

  2.  按 `Shift` + `D` 复制它。

  3.  将复制的关键帧移动到第 `90` 帧。


  > **Tip**

  >

  > 编辑关键帧的控制方案真的非常类似于你在 Blender 3D 视口中习惯使用的那些。例如：在此处的*步骤 3* 中，你可以输入数值 `80`，将复制的关键帧从第
  `10` 帧精确移动 80 帧到第 `90` 帧。


  我们已经为 `Cube` 设定了最终安息地的关键帧！现在，它在第 `90` 帧的位置将与第 `10` 帧相同，但现在我们的动画看起来有点奇怪……


  ### 保持位置


  观察 `Cube` 如何移回起点。看起来多么缓慢笨拙！紧接在第 `40` 帧之后，它就开始向西移动；甚至来不及转身就已经开始移动了。


  这是一个常见错误，也是动画未完成的标志。我们制作的最后一个位置关键帧在第 `40` 帧。然后，我们把下一个关键帧直接放到了第 `90` 帧，却未考虑这会如何影响之前的所有帧。


  第 `40` 帧之后，我们希望 `Cube` 像之前那样静止一会儿。这不需要任何特殊的“保持静止型”关键帧。相反，我们只需复制第 `40` 帧的另一个位置关键帧：


  1.  选择 `Cube` 物体在第 `40` 帧的位置关键帧。

  2.  按 `Shift` + `D` 复制它。

  3.  将复制的关键帧移动到第 `60` 帧。


  现在第 `60` 帧有一个与第 `40` 帧相同的位置关键帧，因此这两帧之间位置不会发生变化。因为我们只编辑了位置关键帧，立方体的旋转动画未受影响：


  ![Figure 1.12: The Timeline with six keyframes](img/B17149_01_12.jpg)


  **图 1.12：** 包含六个关键帧的 Timeline


  ### 编辑动画的时机


  按照这些分步说明插入关键帧，可能会让你误以为我们应该预先知道在何时何地插入关键帧。事实恰恰相反——动画师极少能在第一次尝试时就把所有关键帧都插在正确的帧上。当你独立制作动画时，你肯定需要在添加关键帧后调整它们的时机。


  以我们当前的动画为例。在第 `90` 帧的最后一个关键帧之后，场景结束前还有 30 帧的静止时间。为什么不放慢节奏，给动画留出更多呼吸空间，以便利用完场景的整个帧范围呢？


  下一步将更加开放，以便你可以实验并观察不同的关键帧位置如何影响动画结果：





  1. 转到第一个和最后一个关键帧之间的任意一帧。


  2. 仅选择 `Current Frame`（当前帧）之后的关键帧。


  3. 抓取选中的关键帧并将它们向右移动 `20` 帧。


  **提示**


  尝试按 `]`（右中括号键）来执行*步骤 2*。相应地，`[` 和 `]` 是 `Before Current Frame`（当前帧之前）和 `After Current
  Frame`（当前帧之后）的快捷键，它们有助于快速选择当前帧之前或之后的所有关键帧。


  如果你还没弄明白，将关键帧向右移动会延迟它们，拉大这些关键帧与被留下的关键帧之间的时间间隔，从而减慢动画的一部分。动画的哪一部分会被减慢，取决于关键帧之间的额外间隙是在哪里产生的。


  例如，移动最后两个关键帧会让 `Cube`（立方体）在返回西边之前似乎犹豫了一下：


  ![图 1.13：移动最后两个关键帧后的时间轴](img/B17149_01_13.jpg`)


  图 1.13：移动最后两个关键帧后的时间轴


  移动最后三个关键帧会让立方体的 180° 旋转耗时更长：


  ![图 1.14：移动最后三个关键帧后的时间轴](img/B17149_01_14.jpg`)


  图 1.14：移动最后三个关键帧后的时间轴


  此外，移除第一个关键帧以外的所有关键帧（即移动除第一个以外的所有关键帧）会让立方体的初始启程比返回旅程稍慢一些：


  ![图 1.15：移动最后五个关键帧后的时间轴](img/B17149_01_15.jpg`)


  图 1.15：移动最后五个关键帧后的时间轴


  在不改变这些关键帧顺序的前提下，请随意继续尝试调整它们的时机。


  既然已经赋予了 `Cube` 运动，我们这章也就接近尾声了！我们仅让它的两个属性随时间变化，就让一个简单的物体有了冒险的一生。


  三维物体的三个空间属性——位置、旋转和缩放——可能是你在三维动画中最常打交道的三个属性，但动画远不止这些。正如我们在下一节将看到的，关键帧可用于影响几乎任何属性。


  ## 在 Blender 中为几乎任何属性制作动画


  我们的奥德赛以主角安息告终，它终于从惊心动魄的海外冒险中回到了家。我们的英雄是凯旋而归，还是满怀悲伤与悔恨？难以言说（毕竟它是个立方体），但有一点是肯定的：事情永远不会再一样了。是世界变了吗？恰恰相反；除非英雄被世界改变，否则没有英雄的旅程是完整的。一个立方体离开了，一个不同的立方体（从隐喻的角度来说）回来了。


  在本节中，我们将为 `Cube` 的另一个属性——颜色——设置关键帧，以演示 Blender 中几乎任何东西都可以制作动画。


  ### 其他设置关键帧的方法


  到目前为止，我们一直在使用 `Insert Keyframe`（插入关键帧）菜单来插入初始关键帧，但这个菜单纯粹是为了方便，并不是 Blender 中所有可设关键帧属性的完整列表。首先，它就不包含
  `Color`（颜色）。


  幸运的是，我们不需要那个菜单。当你找到想要制作动画的属性时，Blender 的界面提供了多种方法直接在原地为其设置关键帧：


  *   右键点击该属性，然后从上下文菜单中点击 `Insert Keyframe`（插入关键帧）。

  *   将鼠标光标直接悬停在该属性上并按 `I`。

  *   点击属性右侧的小圆点（注意，这个圆点只是为了单击方便；没有圆点的属性仍然可能是可设关键帧的）。


  这些方法每一种达到的结果都完全相同。


  **提示**


  对于每一种插入关键帧的方法，你都能找到类似的方式来删除它。例如，尝试按 `Alt` + `I` 代替 `I`。


  ### 为材质颜色设置关键帧


  让我们试着为 `Cube` 的颜色设置关键帧：


  1.  选择 `Cube` 并前往 `Material Properties`（材质属性）以编辑立方体的默认材质 `Material`。

  2.  找到 `Base Color`（基础颜色）属性：


  ![图 1.16：基础颜色属性](img/B17149_01_16.jpg`)


  图 1.16：基础颜色属性


  1.  转到第 `1` 帧。

  2.  为起始 `Base Color` 选择任何你喜欢的颜色。

  3.  使用前面提到的任意一种方法为 `Base Color` 设置关键帧。

  4.  转到第 `120` 帧。

  5.  为结束 `Base Color` 选择一个不同的颜色。

  6.  再次为 `Base Color` 设置关键帧。

  7.  将 `Viewport Shading`（视口着色）模式切换为 `Rendered`（渲染）或 `Material Preview`（材质预览），以便在
  3D 视口中查看结果：


  ![图 1.17：视口着色设置为材质预览模式](img/B17149_01_17.jpg`)


  图 1.17：视口着色设置为材质预览模式


  除了移动之外，`Cube` 现在将在其旅程过程中逐渐从一种颜色变为另一种颜色。就我个人而言，我让我的立方体从愉快的绿色变成了深沉悲伤的紫色：


  ![图 1.18：第 1 帧和第 120 帧上的立方体](img/B17149_01_18.jpg`)


  图 1.18：第 1 帧和第 120 帧上的立方体


  **提示**


  数值并不是唯一可以设置关键帧的属性类型。复选框和开/关按钮，也就是 `Boolean`（布尔）属性，也可以设置关键帧来开启和关闭。除其他用途外，这对于让物体出现和消失很有帮助。


  ## 总结


  如果你读到了这里，恭喜你——你现在是一名动画师了。惊讶吗？你不应该惊讶——动画师就是制作动画的人，而你刚才做了什么？仅凭时间轴、默认立方体和不到十几个关键帧，你就制作了一部史诗般的冒险动画！


  好吧，我承认——也许我们的第一部动画没那么史诗，但它很重要！我们把枯燥的东西变成了充满潜力的精彩事物。当然，立方体只是一个带有面和顶点的网格，但你最喜欢的 3D
  动画电影中的角色和物体也是如此。而那些花哨的角色和物体，正是用一堆像你刚才制作的关键帧赋予了生命。


  唯一的区别？主要是关键帧的*数量*。未来我们将需要*多得多*的关键帧。我们还需要更多地了解这些关键帧的真实本质，为了本章的简洁起见，这一直被保密。事实上，时间轴并不是高级关键帧编辑的理想工具。在下一章中，我们将需要一个完全不同的编辑器来打开那些关键帧并深入探究……


  ## 问题


  1.  场景的哪两个属性决定了动画的长度（以帧为单位）？

  2.  如果我们的帧率是每秒 30 帧，我们的动画将持续多少秒？

  3.  什么是帧？*转到*某一帧是什么意思？

  4.  在传统手绘动画中，关键帧是一种特定类型的帧。这在 3D 动画中也适用吗？它们有何不同？

  5.  说位置关键帧让物体*去*某地，还是让物体*在*某地，哪个更准确？

  6.  仅通过在时间轴中查看关键帧，你能了解到关于它的哪些信息？

  7.  是否需要按顺序从头到尾为所有东西设置关键帧？

  8.  如何判断给定的属性是否已制作动画？

  9.  在 Blender 中随机挑选一个属性，看看它能否制作动画。如果可以，为该属性制作动画可能有什么用处或趣味？

  10. 什么是属性？在 Blender 中，属性属于什么事物？

  '
- "# 第 2 章：图表编辑器\n\n在上一章中，我们创建了一个基础动画，同时将关键帧编辑局限在 Blender 的时间轴中。虽然这对于最初保持简单是必要的，但我们为了简洁起见隐藏了一些重要的动画工作流程。对于大多数动画来说，仅使用时间轴会让人非常沮丧！\n\
  \nBlender 中三维动画的下一个最重要工具是 `Graph Editor`（图表编辑器）。除了能做时间轴几乎能做的所有事情外，图表编辑器还在二维图表上显示关键帧的时间和数值，以及它们影响的最终动画属性。\n\
  \n\n\n\n\n## 简介\n\n为了了解图表编辑器及其强大之处，我们将在本章中通过实践来学习——制作动画行业中最流行的案例研究之一：弹跳球。\n\n近百年来，弹跳球一直是二维和三维动画中公认的学习练习。如果我们想让弹跳球看起来真实，就需要密切关注其\
  \ `velocity`（速度）和 `acceleration`（加速度）——而图表编辑器正是处理这些属性不可或缺的工具。\n\n在本章中，我们将涵盖以下主要主题：\n\
  \n*   制作滚动球的动画\n*   导航图表编辑器\n*   设置插值和缓动类型\n*   制作弹跳运动的动画\n*   设置外推模式\n\n## 技术要求\n\
  \n要跟随本章进行操作，你需要 Blender，以及一个标准尺寸足球（也称为 soccer ball）的合适模型。\n\n你可以在此处下载此类模型：\n\n`https://github.com/PacktPublishing/Realizing-3D-Animation-in-Blender`\n\
  \n你可以打开下载的文件并立即开始工作，或者如果你愿意，也可以自己建模一个足球：\n\n![图 2.1：左侧——足球模型，右侧——我用一分钟建模的一个可用的球](img/B17149_02_1.jpg`)\n\
  \n图 2.1：左侧——足球模型，右侧——我用一分钟建模的一个可用的球\n\n任何球体都可以，只要它的直径为 0.7 米，静置在场景的网格地板上，并且是多色的，以便你能轻松看到它在滚动。\n\
  \n## 让球滚起来\n\n在进入图表编辑器之前，我们需要像上一章那样插入一些初始关键帧。一般来说，最好在添加细节之前先 `block out`（分步定出/布局）物体最重要的位置，因此我们的前两个关键帧将只是让球从左向右滚动。\n\
  \n滚动只是旋转与位移完美同步。我们所要做的就是在相同的帧上为球的位置和旋转设置关键帧，确保根据球移动的距离，按精确的数学公式旋转球。在让球滚动之后，我们将使用图表编辑器让它弹跳。\n\
  \n让我们为球设置初始位置的关键帧。为了节省时间，我们可以一次性为球的位置和旋转设置关键帧：\n\n1.  转到第 `10` 帧。\n2.  选择球，并沿 `X`\
  \ 轴向左移动 `-5` 个单位。\n3.  按 `I` 调出 `Insert Keyframe`（插入关键帧）菜单，选择 `Location & Rotation`（位置和旋转）。\n\
  \n    这会同时插入旋转和位置关键帧，而无需我们调出菜单两次。\n\n    接下来，让我们准备插入第二组位置和旋转关键帧：\n\n4.  转到第 `90`\
  \ 帧。\n5.  沿 `X` 轴向右移动球 `10` 个单位。\n\n    现在我们已经确定了球在 80 帧的跨度内将移动多远，我们只需要计算它应该旋转多少才能真实地滚动。如果我们设置的旋转过多或过少，球看起来就会像在地面上滑动。\n\
  \n    那么，我们应该旋转多少度，绕哪个轴旋转？虽然有一些很好的公式可以计算出来，但这对于本章来说有点太高级了。目前，让我们稍微“作弊”一下，直接输入一些“魔法数字”：\n\
  \n6.  绕 `Y` 轴旋转球 `1164` 度。\n7.  像*步骤 3* 中那样插入位置和旋转关键帧。\n\n当你播放动画时，球现在应该能平滑地从左向右滚动，而不会出现滑动或打滑的现象。这个简单的运动将伴随我们稍后添加的弹跳关键帧。\n\
  \n## 导航图表编辑器\n\n在跟随上一章操作时，你可能会想知道动画师该如何在 `Timeline`（时间轴）中识别那些看起来一模一样的关键帧。我们是否总得记住哪些是位置关键帧，哪些是旋转关键帧？如果旋转和位置关键帧存在于同一帧上（就像在我们当前的动画中那样），你该如何单独编辑它们？\n\
  \n话虽如此，你如何辨别关键帧内部的*任何*数值？在 `Timeline` 中，一个让物体向下移动几英寸的关键帧，看起来和一个让它向上飞入外太空一百英里的关键帧没有任何区别。\n\
  \n因此，`Timeline` 是一个不足以编辑整个动画的工具。这就是图表编辑器等工具发挥作用的地方。\n\n## 调出图表编辑器\n\n进入图表编辑器的一个便捷方法是使用当前放置\
  \ `Timeline` 的界面区域。图表编辑器需要比 `Timeline` 更多的垂直空间才能发挥作用，所以我们只需拖动 `Timeline` 和 `3D Viewport`（3D\
  \ 视口）之间的边框向上，使该区域变高。之后，就可以轻松地将 `Timeline` 切换为图表编辑器了：\n\n1.  找到 `3D Viewport` 和 `Timeline`\
  \ 之间的边框（当鼠标悬停在其上方时，光标会变为箭头）。\n2.  向上拖动边框，将下方区域调整到整个屏幕高度的一半左右。\n3.  使用 `Ctrl + Tab`\
  \ 或 `Editor Type`（编辑器类型）菜单将该区域切换为图表编辑器。\n\n现在我们准备好开始在图表编辑器中工作了！\n\n![图 2.2：带有图表编辑器的用户界面](img/B17149_02_2.jpg`)\n\
  \n图 2.2：带有图表编辑器的用户界面\n\n该编辑器将动画属性显示为二维图表中的线条，将关键帧显示为这些线条上的点，从而允许你直观地编辑关键帧的时间和数值。\n\
  \n**重要提示**\n\n与 `Timeline` 一样，图表编辑器的默认设置是仅显示所选物体的关键帧。请确保选中了球，否则图表编辑器将显示为空白。\n\n\
  对于从未见过该编辑器的人来说，它可能令人困惑，所以让我们花点时间思考一下我们到底在看什么。\n\n**提示**\n\n在我的示例中，我禁用了 `View | Show\
  \ Cursor`（视图 | 显示光标），以停止在图表编辑器中显示一条额外的水平线，因为它用处有限。\n\n## 图表编辑器中的 X 轴和 Y 轴\n\n`Timeline`\
  \ 中的关键帧只能左右移动——即在时间上前后移动。既然这使得 `Timeline` 本质上是一个一维编辑器，你可以把图表编辑器想象成一个*二维时间轴*。\n\n\
  就像在 `Timeline` 中一样，你会看到图表编辑器顶部有一排帧号——就像在 `Timeline` 中一样，也可以点击它们来拖动和浏览时间。在图表编辑器中沿\
  \ `X` 轴左右移动关键帧，会使它们在时间上前后移动，就像在 `Timeline` 中一样。因此，我们可以理所当然地认为，图表编辑器中的 `X` 轴代表以帧为单位的时间……就像在\
  \ `Timeline` 中一样。\n\n然而，与 `Timeline` 不同的是，我们现在有了一个垂直轴，关键帧可以沿着它上下移动。这个 `Y` 轴代表每个单独属性的数值。根据属性的不同，这可以是任何单位——米、度、瓦特，无论什么。只要它是动画化的，图表编辑器就会显示它。\n\
  \n**重要提示**\n\n不要将图表编辑器中的 `X` 轴和 `Y` 轴与 `3D Viewport` 中的 `X`、`Y` 和 `Z` 轴混淆。三维物体的属性（如\
  \ `Location`、`Rotation` 和 `Scale`）都有 `X`、`Y` 和 `Z` 分量，分别对应三维场景中的 `X`、`Y` 和 `Z` 轴。然而，在图表编辑器中查看时，这些分量都只是映射到同一个\
  \ `Y` 轴上的数字，与其他属性一样。\n\n看看你图表编辑器中那条从左向右平滑向上弯曲的红线。通过结合 X 轴和 Y 轴上指示的数字来观察这条曲线，你可能能猜出它代表哪个动画属性。其他线条呢？如果你不确定也没关系；我们马上就会消除关于哪些线条代表哪些属性的猜测。\n\
  \n## 动画通道\n\n\n\n\n\n## 图表编辑器\n\n在图表编辑器的左侧，你会看到一个包含三个嵌套列表的面板：\n\n![图 2.3：物体、动作和通道组的字段](img/B17149_02_3.jpg)\n\
  \n图 2.3：物体、动作和通道组的字段\n\n`Ball` 物体包含 `BallAction` 动作，后者又包含 `Object Transforms` 通道组。\n\
  \n点击 `Object Transforms` 行左侧的小三角形以展开它。这将显示我们刚刚创建的所有 `animation channels`（动画通道）的列表：\n\
  \n![图 2.4：动画通道](img/B17149_02_4.jpg)\n\n图 2.4：动画通道\n\n这些动画通道包含所选物体所有拥有关键帧的属性，并按垂直列表组织。每个独立的通道包含其分配属性的所有关键帧。\n\
  \n**提示**\n\n当你首次插入关键帧时，动作和通道组会自动创建。你可以将它们视为物体动画通道的嵌套“文件夹”。暂时忽略它们。除非你在做高级角色动画，否则通常永远不需要重新组织通道组，也不需要为每个动画物体使用多个动作。\n\
  \n对于每个动画通道，在图表编辑器的主区域都会显示一条对应的线图，称为 `F-curve`（F-曲线）。你可以把这些 F-曲线想象成股市走势图；每一条都是一条线，代表一个属性随时间变化的值。点击左侧面板中的通道名称将选择该通道并高亮显示其\
  \ F-曲线。\n\n**重要提示**\n\n在图表编辑器中，术语 `curve`（曲线）、`F-curve`（F-曲线）和 `channel`（通道）可以互换使用。它们本质上指代同一事物。\n\
  \n### 六个关键帧合而为一\n\n目前，我们的动画有六个通道。如果六个通道看起来很多，请记住，空间属性（如位置和旋转）各自都是一组三个数值——分别对应三维空间中\
  \ `X`、`Y` 和 `Z` 三个轴。\n\n当你在 `Insert Keyframe`（插入关键帧）菜单中点击 `Location & Rotation`（位置与旋转）时，你实际上一次性插入了不是一个，而是六个关键帧！既然做了两次，你现在总共有\
  \ 12 个关键帧，尽管时间轴似乎只显示了 2 个：\n\n![图 2.5：带有两个关键帧的时间轴](img/B17149_02_5.jpg)\n\n图 2.5：带有两个关键帧的时间轴\n\
  \n事实上，不存在单个 `Location & Rotation` 关键帧这种东西。这些 `summary keys`（汇总关键帧）实际上是同一帧上所有关键帧的分组，可以在时间轴中选中，并像它们是一个关键帧一样进行编辑。这就是我们在上一章编辑动画的方式。然而在本章中，我们需要明确具体要编辑哪个通道的关键帧。\n\
  \n**提示**\n\n通过拖动打开默认隐藏的左侧面板，也可以在时间轴中访问单个动画通道。这允许你在不切换到其他编辑器的情况下编辑单个通道。然而，时间轴仍然不是以这种方式编辑关键帧的理想工具；这一荣誉属于\
  \ Dope Sheet（动作编辑器/逐帧编辑器），我们将在 *第 6 章* 中介绍。\n\n### 隐藏、锁定和删除 F-曲线\n\n让我们浏览一下小球的每个动画通道，并思考哪些与我们的弹跳球动画相关：\n\
  \n*   `X Location`（X 位置）：这是让小球从左向右移动的通道。该通道的 F-曲线在图表编辑器中清晰可见；它是那条从第 **10** 帧值为 **-5**\
  \ 到第 **90** 帧值为 **5** 的红线。\n*   `Y Location`（Y 位置）：我们不需要在 `Y` 轴上移动小球，所以该通道可以丢弃。\n\
  *   `Z Location`（Z 位置）：向该通道添加更多关键帧将使小球上下移动。我们绝对需要这个来让小球弹跳！\n*   `X Euler Rotation`（X\
  \ 欧拉旋转）：如果我们为这个制作动画，小球看起来会有点怪。考虑到小球当前的移动方向，它只需要绕 `Y` 轴旋转才能看起来像在滚动。如果它向其他方向旋转，会破坏效果！\n\
  *   `Y Euler Rotation`（Y 欧拉旋转）：我们为这个值制作了动画，使小球在沿 `X` 轴移动时看起来令人信服地滚动。你可以看到该 F-曲线在第\
  \ **10** 帧处急剧向上，随后超出图表编辑器的视图边界消失不见。\n*   `Z Euler Rotation`（Z 欧拉旋转）：我们也不需要为这个值制作动画。\n\
  \n已经有这么多通道和关键帧需要跟踪了！如果我们不小心，可能会搞不清哪个通道是哪个，或者意外编辑错误的关键帧。当许多关键帧重叠时，这特别容易发生。\n\n幸运的是，我们可以隐藏、锁定，甚至删除不想查看或编辑的通道。每个通道都有一个眼形切换按钮来开关其可见性，还有一个锁形切换按钮来防止其被编辑。\n\
  \n如果我们永远不打算使用某个通道，也可以直接删除它。现在让我们在不需要的动画通道上试一下：\n\n1.  通过左键点击一个通道名称，然后按住 `Shift`\
  \ 点击另外两个，选择 `Y Location`、`X Euler Rotation` 和 `Z Euler Rotation` 通道。\n2.  按 `X`\
  \ 或前往 `Channel`（通道）| `Delete Channels`（删除通道）来删除选中的通道。这也会删除该通道的所有关键帧。\n3.  通过点击“眼形”或“锁形”切换按钮来隐藏或锁定\
  \ `Z Location` F-曲线。我们稍后会回到这个通道。\n\n![图 2.6：剩余的三个动画通道](img/B17149_02_6.jpg)\n\n\
  图 2.6：剩余的三个动画通道\n\n好多了！现在没有多余的 F-曲线碍事了。\n\n**提示**\n\n锁定或隐藏的 F-曲线将继续像往常一样影响动画结果。如果你想在不删除的情况下禁用\
  \ F-曲线，可以尝试那个勾号形状的切换按钮，它可以“静音” F-曲线。静音的 F-曲线可能仍在图表编辑器中可见，但不会对任何东西产生影响。\n\n## 调整图表编辑器视图\n\
  \n看看图表编辑器中剩余的 F-曲线。你能看到所有内容吗？虽然 `X Location` F-曲线的红线恰好在视图中心显示得很不错，但 `Y Euler Rotation`\
  \ F-曲线大部分仍在视图区域之外。该属性的值从第 **10** 帧的 **0** 一路上升到第 **90** 帧的 **1164**，所以你能看到它的一个关键帧，但看不到另一个。\n\
  \n大多数 Blender 专家都同意，在编辑之前先看清东西很有帮助。正如我们需要在 3D 视口中移动来操作 3D 元素一样，我们也需要在图表编辑器中移动，以便在不同时间点和不同缩放级别下查看不同的关键帧。\n\
  \n### 在图表编辑器中平移和缩放\n\n你会很快发现，你在 Blender 其他区域使用的导航控件在图表编辑器中同样适用。按住中键拖动可向四个方向平移视图，而滚动滚轮可放大和缩小。然而，你也会很快注意到，仅用滚轮缩放在图表编辑器中是远远不够的。\n\
  \n我们来试一下。在图表编辑器中使用滚轮缩小，使 `Y Euler Rotation` F-曲线的整条曲线可见。现在我们可以看到整条 F-曲线了……勉强算：\n\
  \n![图 2.7：Y Euler Rotation F-曲线的缩小视图](img/B17149_02_7.jpg)\n\n图 2.7：Y Euler Rotation\
  \ F-曲线的缩小视图\n\n我们缩小得足以让曲线的垂直范围可见，但同时也将图表水平轴的帧范围缩小到了完全无用的程度。我们整个动画的帧范围太窄了，播放头几乎把它盖住了！\n\
  \n\n\n\n## 浏览图表编辑器\n\n当我们在 2D 编辑器中使用滚轮缩放时，我们会让视图在水平和垂直方向上按相同比例缩放。这对于放大缩小图像纹理等操作来说没问题，但这并不是我们在图表编辑器中所需要的。\n\
  \n## 缩放 X 轴和 Y 轴\n\n我们在这里需要的是能够以不同于 `Y` 轴的方式对 `X` 轴进行“缩放”。试试这个：\n\n1.  按住 `Ctrl`，在图表编辑器中小心地点击并向右拖动中键，直到图表编辑器的水平范围主要局限于\
  \ `Y 欧拉旋转` F 曲线的“弯曲”部分。\n2.  使用中键平移视图，使曲线保持在图表编辑器的中心位置。\n3.  根据需要重复上述操作，直到 `Y 欧拉旋转`\
  \ F 曲线填满整个显示范围，如下所示：\n\n![图 2.8：一个更合适的 F 曲线框架](img/B17149_02_8.jpg)\n\n图 2.8：一个更合适的\
  \ F 曲线框架\n\n按住 `Ctrl` 和中键可以独立缩放图表编辑器的 `X` 轴和 `Y` 轴，向上向下移动光标缩放 `Y` 轴，向左向右移动光标缩放 `X`\
  \ 轴。这个操作可能需要一些时间来适应。请记住，这不会影响动画；我们只是在改变图表编辑器显示的范围。\n\n了解如何做到这一点是必不可少的，因为图表编辑器的 `X`\
  \ 轴和 `Y` 轴并不像 Blender 中的其他编辑器那样成比例地相互关联。动画属性可以用各种单位表示，有的为负，有的为正，有的非常大，有的非常小，所有这些都映射到图表编辑器中的同一个\
  \ `Y` 轴上。你动画中的某些值会在极短的时间内大幅上升和下降，而其他值则需要很长时间才能移动极小的一段距离。对于每种情况，你都需要相应地调整图表编辑器中的视图。\n\
  \n所以，现在你可以清楚地看到两个 `Y 欧拉旋转` 关键帧了，我们要专门编辑它们吗？不，这只是为后面的练习做准备，但看——现在还有另一个问题可以练习修复！\n\
  \n## 归一化 F 曲线视图\n\n看看 `X 位置` F 曲线发生了什么。它现在看起来几乎是平的！通过调整视图以适应一条 F 曲线，我们让辨认另一条曲线的形状变得非常困难。\n\
  \n默认情况下，位置以一定数量的米表示，而旋转以一定数量的度表示，两者都映射到图表编辑器的 `Y` 轴。我们的球必须旋转 **1164** 度才能滚动 **10**\
  \ 米，因此一个简单的滚动动画会使 `Y 欧拉旋转` F 曲线的高度远超 `X 位置` F 曲线。如果我们想同时跟踪这两条 F 曲线，这会很不方便。这就是 `归一化`\
  \ 功能派上用场的地方。\n\n启用后，`归一化` 会在 `Y` 轴上“挤压”所有 F 曲线，使它们都显示在 `-1` 到 `1` 的相同数值范围内。当多条数值范围差异巨大的\
  \ F 曲线需要一起编辑时，这很有帮助，尽管这也可能使读取它们的实际数值变得更难。\n\n请继续在图表编辑器的页眉中启用 `归一化`：\n\n![图 2.9：图表编辑器中的归一化视图](img/B17149_02_9.jpg)\n\
  \n图 2.9：图表编辑器中的归一化视图\n\n好多了！注意 `X 位置` 和 `Y 欧拉旋转` F 曲线现在看起来一模一样，所以一条 F 曲线会藏在另一条后面。如果我们需要选择一条\
  \ F 曲线的关键帧而不选中另一条，这可能是个问题，但这也是因祸得福；我们现在可以检查这两个属性是否保持完美同步。但请记住，图表编辑器 `Y` 轴上显示的数值不再直接对应动画属性的真实数值；每条\
  \ F 曲线的最低点和最高点现在只是映射到 `-1` 和 `1`。\n\n既然你已经移除了所有不必要的 F 曲线并掌握了浏览图表编辑器的基础知识，你就差不多准备好开始编辑关键帧了！\n\
  \n## 插值与缓动\n\n仔细观察 `X 位置` 和 `Y 欧拉旋转` F 曲线，注意第 **10** 帧和第 **90** 帧关键帧之间的线段会发生什么。线条平缓地开始上升，在第\
  \ **50** 帧达到最陡峭的点并继续上升，然后在顶部平缓地变平。\n\n每个关键帧规定了某个属性在某个时间等于某个值。当该关键帧后面跟着一个数值不同的关键帧时，随着动画随时间向前播放，该属性的值必须从一个变为另一个。在中间的所有帧上，我们可以把属性本身看作是从一个值“移动”到下一个值。\n\
  \n一种值过渡到另一种值的方式称为**插值**。这在上一章中简要提到过；这就是为什么我们只需在两个不同的帧上制作两个关键帧，就能在中间的所有帧上获得平滑的运动。像定格动画这样的动画技术要求动画师在每一帧上手动增量调整，而数字动画工具则采用插值算法为我们完成大量工作。插值是一种作用于所有数值的数学过程。Blender\
  \ 不关心属性是什么；如果它是一个会变化的数字，它的变化就可以被插值。\n\n有各种类型的插值。我们目前看到的只是默认类型。它是一条简单、好看的曲线，但不适合弹跳球的运动。在本节中，我们将探索\
  \ Blender 中可用的所有不同插值模式。一旦你尝试过这些，你就会更清楚该为这个动画使用哪些模式。\n\n## 设置插值模式\n\nBlender 中有多种类型（或模式）的插值可用。对于\
  \ F 曲线中的每个关键帧，你可以指定一个插值模式，它将决定该关键帧之后的 F 曲线形状。现在我们已经打开了图表编辑器且只显示相关的 F 曲线，我们可以在滚动球上尝试所有插值模式，并同时查看它们如何影响\
  \ F 曲线和动画结果。\n\n> **提示**\n>\n> 就像在时间轴中一样，你不需要被提醒图表编辑器中选择和编辑关键帧的大多数控制方式。只要假装你在选择和编辑网格的顶点即可！\n\
  \n现在让我们来玩转插值：\n\n1.  选择球的 `X 位置` 和 `Y 欧拉旋转` 动画通道的前两个关键帧（第 **10** 帧上的那些）。\n2.  按\
  \ `T` 或转到 `关键帧 | 插值模式` 以 `设置关键帧插值`。\n\n![图 2.10：可用插值模式的菜单](img/B17149_02_10.jpg)\n\
  \n图 2.10：可用插值模式的菜单\n\n3.  选择一个插值模式并播放动画以查看结果！\n\n有趣，对吧？这些玩起来很有意思。虽然我们可以在 Blender\
  \ 的任何动画编辑器中设置选定关键帧的插值模式，但图表编辑器是唯一显示该插值形状的编辑器。\n\n以下是不同插值模式的简要概述：\n\n* **常量**：这种插值模式实际上根本不插值；数值保持不变，直接“跳跃”或“突变”到后续关键帧的数值。\n\
  * **线性**：这是最简单的插值类型；它在关键帧之间画一条直线。结果是以单一速度运动，没有任何加速或减速。\n\n\n\n\n\n*   `Bezier`：默认的插值模式，此模式将关键帧转变为带有可编辑手柄的贝塞尔节点，这些手柄会影响关键帧前后\
  \ `F-curve` 的轨迹。你可能在曲线对象和许多矢量图形应用程序中见过此类节点。贝塞尔关键帧功能强大但棘手；我们将在下一章详细了解它们。\n\n*   `Easing\
  \ (by strength)`（缓动[按强度]）：别搞错了——这些也是插值类型，但属于特殊类型，必须设置为 `ease in`（缓入）、`ease out`（缓出）或两者兼有。我们马上就会了解这意味着什么。\n\
  \n*   `Dynamic Effects`（动态效果）：这些是独特的模式，会让 `F-curve` 朝交替方向运动；当你想要简单的弹跳或弹性运动，但不需要太多精确控制时，这很不错。它们也被设置为缓入或缓出。\n\
  \n继续尝试不同的插值模式，直到你至少观察过每种模式的一个示例。\n\n![Figure 2.11: Constant, Linear, Bezier, Easing,\
  \ and Dynamic interpolation](img/B17149_02_11.jpg)\n\n图 2.11：常量、线性、贝塞尔、缓动和动态插值\n\
  \n当你在动画中尝试不同的插值模式时，请密切关注 `F-curve` 的形状如何与球的运动相关联。注意 `F-curve` 的斜率或陡峭程度如何表达属性值的变化率，这反过来决定了物体的速度。\n\
  \n## 设置缓动类型\n\n如果你尝试几种 `Easing` 插值模式，你会注意到它们都表现出相同的行为——开始缓慢，稳定加速，然后在结束关键帧处突然停止。如果我们希望物体减速而不是加速怎么办？这就是\
  \ `easing types`（缓动类型）发挥作用的地方。缓动可以被视为插值的一个子类型，它决定插值函数是缓入、缓出，还是两者兼有。我们可以通过亲自尝试来了解这意味着什么。\n\
  \n设置缓动类型就像设置插值一样简单：\n\n1.  使用前面描述的步骤，在 **`Easing`** 或 **`Dynamic Effects`** 列下选择一种插值模式。\n\
  \n2.  使用 `Ctrl + E` 或转到 `Key | Easing Type` 来设置所选关键帧的缓动类型。\n\n![Figure 2.12: The\
  \ Easing Type menu](img/B17149_02_12.jpg)\n\n图 2.12：缓动类型菜单\n\n1.  从菜单中选择一种缓动类型并查看其结果。\n\
  \n以下是可用缓动类型及其功能的简要说明：\n\n*   `Automatic Easing`（自动缓动）：基本没用，这仅意味着对所有 `Easing` 插值模式使用\
  \ `Ease In`，对 `Dynamic Effects` 模式使用 `Ease Out`。\n\n*   `Ease In`（缓入）：`F-curve`\
  \ 开始缓慢并加速，在结束关键帧处突然停止。\n\n*   `Ease Out`（缓出）：与 `Ease In` 相反，这开始时很快并减速，在结束处趋于平缓。\n\
  \n*   `Ease In and Out`（缓入缓出）：`F-curve` 在两端都平滑地趋于平缓，在两个关键帧之间的中间帧达到最快点。\n\n你可以跳过\
  \ `Automatic Easing`，但请务必看看列表中其他三种缓动类型。\n\n![Figure 2.13: Ease In, Ease Out, and\
  \ Ease In and Out](img/B17149_02_13.jpg)\n\n图 2.13：缓入、缓出和缓入缓出\n\n**重要提示**\n\n`Interpolation\
  \ Mode`（插值模式）和 `Easing Type`（缓动类型）是关键帧的属性，即使效果出现在 `F-curve` 的其余部分，而不是关键帧本身。对于两个关键帧之间\
  \ `F-curve` 的每个片段，*是开始处的关键帧决定了插值* *和缓动*。\n\n很酷吧，但这些有什么用？你马上就会发现；现在你知道了什么是插值和缓动以及如何设置它们，你已经准备好让球弹起来了！\n\
  \n## 让球弹起来\n\n球应该怎么弹？不同于我们在上一章制作动画的那个会神奇变色的立方体，弹跳的球是你在现实生活中见过的东西。这让它稍微有点挑战性——我们脑海中已经有一个弹跳球应该是什么样子的概念，所以实现这种效果有正确和错误的方法。\n\
  \n为了寻求指导，我们将求助于物理定律，它们主宰着弹跳球等事物的运动。既然我们是动画师而不是物理学家，这些定律只是我们可以遵循或忽略的指南——例如，这个特定的球最终将被设置为永远弹跳和滚动。尽管如此，了解一点物理学将帮助我们预判作用力并为我们的\
  \ `F-curve` 确定最佳插值模式。\n\n根据牛顿第一定律，*除非受到外力作用，运动的物体将保持运动状态*。这意味着需要力来改变物体的方向或速度。那么，弹跳球涉及哪些力？\n\
  \n我们想要模拟的最明显的力是重力，它将物体向下拉。第二个不太明显的力是我们想象中的地板的作用力，它（假设是水平的）会在每次撞击时将球向上弹回。所以，一个向下的力，一个向上的力。上和下——嘿，这些都在同一个轴上。多方便啊！为了模拟这两个力作用在球上，我们将在\
  \ `Z Location` `F-curve` 上进行最花哨的关键帧操作。那么另外两条 `F-curve` 呢？\n\n## 空中物体的线性插值\n\n如果你玩过或看过任何涉及球的运动，你会注意到被踢或扔出的球在空中时，会以恒定的速率旋转和水平移动。除了鸟或强风，空气中没有什么会显著改变球旋转或水平移动的速度。这对我们意味着\
  \ `X Location` 和 `Y Euler Rotation` `F-curve` 应该显示线性运动，速度不发生任何变化。\n\n这当然是 `Linear`（线性）插值模式的理想用途：\n\
  \n1.  选择球的 `X Location` 和 `Y Euler Rotation` 动画通道上 **第 10 帧** 的两个关键帧。\n\n2.  将关键帧插值设置为\
  \ `Linear`。\n\n这可能是最不令人兴奋的插值模式之一，但它是这些特定 `F-curve` 最合理的选择。\n\n![Figure 2.14: A Linear\
  \ F-curve segment](img/B17149_02_14.jpg)\n\n图 2.14：线性 F-curve 片段\n\n我们的动画在 **第 10\
  \ 帧** 和 **第 90 帧** 仍然存在速度突变，但我们将在最后解决这个问题。让我们开始制作弹跳效果吧！\n\n## 在图表编辑器中添加弹跳关键帧\n\n\
  给球的 `X Location` 和 `Y Euler Rotation` 动画通道添加关键帧很简单（无意双关），但我们的 `Z Location` `F-curve`\
  \ 看起来将完全不同。我们还需要仔细选择一些不同的插值模式来模拟作用的物理力。\n\n仿佛 Blender 中插入关键帧的方法还不够多似的，我们还将利用这一节作为示例，展示如何仅使用\
  \ `Graph Editor`（图表编辑器）进行动画制作。不离开这个编辑器，我们将添加单次弹跳所需的关键帧，然后确定它们的插值。\n\n**重要提示**\n\n\
  你需要确保 `Z Location` 已解锁且未隐藏，以进行下一部分操作。还记得如何切换 `F-curve` 的可见性和编辑保护吗？你可能还想隐藏或锁定其他两个通道，并可能禁用\
  \ `Normalize`（归一化），但这由你决定。从现在开始，你将负责我们迄今为止学到的 `Graph Editor` 中的视图和显示设置。\n\n### 在图表编辑器中插入关键帧\n\
  \n一次弹跳将在 `Z Location` `F-curve` 上需要三个关键值——球在网格地板上的最低点、弹跳的最高点，以及再次落到地板上的最低点。这将需要三个关键帧（如果你使用贝塞尔手柄则只需两个，但你还不知道这一点）。这些关键帧将位于\
  \ **第 10 帧**、**第 20 帧** 和 **第 30 帧**，给我们一个漂亮的 20 帧弹跳周期。\n\n\n\n\n\n## 添加第二个关键帧\n\
  \n我们已经有了第一个 **Z Location** 关键帧；现在让我们添加第二个：\n\n1. 选择 `Z Location` 通道。\n2. 转到第 **20**\
  \ 帧。\n3. 将鼠标光标放在图表编辑器中，按 `I` 键。请注意，这会弹出一个与上一章使用的不同的菜单：\n\n![图 2.15：在图表编辑器中插入关键帧的菜单](img/B17149_02_15.jpg)\n\
  \n图 2.15：在图表编辑器中插入关键帧的菜单\n\n1. 从菜单中选择 `Only Selected Channels`（仅选中通道）。\n\n通过使用此菜单仅在\
  \ **Z Location** F 曲线上插入关键帧，我们只添加了一个关键帧，而不是像以前那样添加一组三个或六个。这对我们其他的两条 F 曲线**零影响**。何必在不需要的地方插入额外的关键帧呢？\n\
  \n这个第二个关键帧可用于确定球弹跳的最高点。当然，现在它仍在地板上……\n\n## 编辑关键帧的值\n\n我们将利用这个机会移动刚刚创建的关键帧，以便你能体验直接在图表编辑器中编辑关键帧的值。我们将把第二个关键帧向上移动\
  \ 1 米，这恰好是 20 帧弹跳的一个美观高度。\n\n现在就让我们来做：\n\n1. 选择第 **20** 帧上的 `Z Location` 关键帧。\n\
  2. 按 `G` 和 `Y`，将其向上移动约 **1** 个单位。\n\n当你在图表编辑器的 `Y` 轴上移动该关键帧时，请注意 3D 视口中发生的情况：\n\n\
  ![图 2.16：在第 20 帧将关键帧向上移动](img/B17149_02_16.jpg)\n\n图 2.16：在第 20 帧将关键帧向上移动\n\n如果你仍停留在第\
  \ **20** 帧，你会看到球向上移动！通过编辑 **Z Location** 关键帧的值，我们正在从图表编辑器内部影响球在 `Z` 轴上的位置！\n\n>\
  \ **提示**\n>\n> 在图表编辑器中所做的更改会根据它们如何影响当前帧的 F 曲线，立即反映在其他区域中。你不必跳转到关键帧所在的帧来编辑它，但这通常是个好主意。\n\
  \n现在我们已经有了一条显示明确变化的 **Z Location** F 曲线，弹跳动画已完成了一半。球从地板开始，然后向上——接下来，我们只需要让球落下来。\n\
  \n## 在图表编辑器中复制关键帧\n\n上去的终究要下来。让球落下的任务将由该序列中的第三个 **Z Location** 关键帧来完成，我们马上就要添加它。\n\
  \n这个关键帧的值（即 `Y` 轴位置）应该是多少？答案是与第一个关键帧相同的值，那时球正接触地板。我们假想的地板是平的，自从球在第 **10** 帧离开后，它就没去过别的地方。那个关键帧的值恰好是\
  \ **0.35**。这很简单。弄清这个关键帧的时间（即 `X` 轴位置）也不难。如果球用 10 帧弹起 1 米，那么落回原始高度也应该用 10 帧。第 20\
  \ 帧之后的 10 帧会将我们的关键帧放在第 **30** 帧。\n\n我们确切知道第三个关键帧需要放在哪里，在 Blender 中有很多方法可以把它放在那里。例如，我们可以简单地在第\
  \ **10** 帧插入另一个关键帧并将其移下。这样做没问题，但还有个更快的方法——我们可以直接复制第 **10** 帧的关键帧并将其移至第 **30** 帧。它已经处于完全正确的高度了！\n\
  \n你已经知道如何在时间轴中移动和复制关键帧。在图表编辑器中这样做的方法相同，但多了一个额外步骤：\n\n1. 选择第 **10** 帧上的 `Z Location`\
  \ 关键帧。\n2. 按 `Shift + D` 复制选中的关键帧。\n3. 按 `X`。\n4. 将复制的关键帧移动到第 **30** 帧。\n\n![图 2.17：三个关键帧在\
  \ Z Location F 曲线上形成一个“驼峰”](img/B17149_02_17.jpg)\n\n图 2.17：三个关键帧在 Z Location F\
  \ 曲线上形成一个“驼峰”\n\n你注意到我提到的那个额外步骤了吗？我们必须按 `X`。这与我们在抓取关键帧向上移动后必须按 `Y` 是同一个原因。图表编辑器中的关键帧可以沿两个轴移动，而不是仅一个——这些轴映射到完全不同的事物。当我们在不锁定\
  \ `X` 轴的情况下左右移动关键帧时，它们可能会稍微上下移动，从而改变其值。即使这个第三个关键帧的值有微小差异，稍后也可能给我们带来奇怪的结果。\n\n> **重要提示**\n\
  >\n> 对于上一段中的示例，当在图表编辑器中移动关键帧时，我们经常希望将变换锁定到 `X` 或 `Y` 轴。只需记住按 `X` 或 `Y` 即可！\n\n**Z\
  \ Location** 通道上的前三个关键帧现在让球上去又下来。不过，看看 F 曲线的形状——这个“驼峰”算弹跳吗？播放动画亲自看看吧。\n\n> **提示**\n\
  >\n> 如果你从正面在 3D 视口中查看动画，可以观察到球的路径如何完美地模仿 **Z Location** F 曲线的形状，从左向右移动。\n\n如果你觉得这已经足够好了，那你肯定住在水底。在这里的旱地上，球不会做正弦波运动。它不会在离开地板后匀速向上加速，也不会在再次触地前减速。要完成这个弹跳，我们需要用到之前学到的插值和缓动知识。\n\
  \n## 弹跳球的正确插值与缓动\n\n我们如何改进这个“弹跳”的运动？问题不在于我们三个 **Z Location** 关键帧在图表编辑器中的位置；我们知道球必须从地板开始，知道它需要达到一个高点，然后知道它应该在相同的时间内落下来。这些关键帧的帧数和数值都没问题。问题在于这些关键帧之间\
  \ F 曲线的形状。我们就是不能忽视插值！\n\n那么，这里需要什么样的插值？你能从 `Set Keyframe Interpolation`（设置关键帧插值）菜单中挑出来吗？别说\
  \ `Bounce`（弹跳）——那是作弊，而且你会发现它对高度、速率和弹跳次数等几乎没有控制力。\n\n记住，我们是在模拟重力！重力被观测为恒定的向下加速度，加速度是速度的变化率，而速度是位移（即位置）的变化率。因此，我们需要创建的那种线，其*变化率本身具有恒定的变化率*。\n\
  \n我就不继续上这物理课了。这本质上意味着我们需要一个具有二次函数的斜率。现在让我们找到那个插值模式：\n\n1. 选择第 **10** 帧和 **20** 帧上的前两个\
  \ **Z Location** 关键帧。\n2. 将 `Set Keyframe Interpolation` 设为 `Quadratic`（二次）。\n\n\
  这完成了一半，但弹跳的前半段仍然不对劲：\n\n![图 2.18：一个不太理想的、鲨鱼鳍状的 F 曲线片段](img/B17149_02_18.jpg)\n\n\
  图 2.18：一个不太理想的、鲨鱼鳍状的 F 曲线片段\n\n它是*缓入*的，而我们需要该片段做相反的事。好在我们知道如何更改缓动类型：\n\n1. 选择第 **10**\
  \ 帧上的第一个 **Z Location** 关键帧。\n2. 将 `Set Keyframe Easing Type` 设为 `Ease Out`（缓出）。\n\
  \n现在我们有了一个弹跳！\n\n![图 2.19：Z Location F 曲线中的一个正确弹跳](img/B17149_02_19.jpg)\n\n图 2.19：Z\
  \ Location F 曲线中的一个正确弹跳\n\n只剩一件小事——球只弹跳了一次。\n\n## F 曲线外推\n\n\n\n\n目前，小球只会弹跳一次，这不太有趣。它还会在第\
  \ `10` 帧之前和第 `90` 帧之后保持静止，这看起来也不太好。为了修复这个问题，我们可以简单地将弹跳关键帧复制几次，并缩短场景的帧范围。不过，还有更好的方法——一种能让小球永远弹跳和滚动下去的方法。我们可以使用一个叫做\
  \ `extrapolation`（外推）的功能轻松实现这一点。\n\n要理解外推，请想象 F 曲线在其第一个和最后一个关键帧之间有一段有限的“主”段。现在，试着看看它的其余部分，也就是它结束的地方。你得缩放很久。F\
  \ 曲线是永恒的；`it has no beginning or end`（它没有开始也没有结束）。它不会仅仅因为没有关键帧了就消失！它必须始终有一个确定的值，即使在动画开始之前，以及在动画结束很久之后。外推就是我们用来描述\
  \ F 曲线在其余时间里应该做什么的术语。\n\n默认情况下，所有 F 曲线都具有 `Constant Extrapolation`（常量外推），它只是将曲线平坦地延伸，导致值停止变化。这对大多数情况都适用，但不适用于我们现在的\
  \ F 曲线。在为这些曲线选择不同的外推模式后，你就能拖动 `End Frame`（结束帧）值，如果你愿意，甚至可以让场景持续一小时，看着小球弹跳着滚向地平线彼端。\n\
  \n## 线性外推\n\n让我们先处理让小球滚动的前两条 F 曲线——`X Location`（X 位置）和 `Y Euler Rotation`（Y 欧拉旋转）。我没有让你在场景的开始帧和结束帧为这些曲线添加关键帧，而是让你在帧\
  \ `10` 和 `90` 添加，这样问题就更容易看出来了。\n\n如果我们想让小球继续滚动怎么办？我们得用关键帧把这些 F 曲线进一步向上和向外延伸。要延伸多远？如果你不确定动画到底该在何时结束，这会变得难以控制。幸运的是，那些关键帧就留在原地就好。\n\
  \n我们要做的只是设置一种不同的外推模式：\n\n1.  选择 `X Location` 和 `Y Euler Rotation` 动画通道。\n\n2.  按\
  \ `Shift` + `E` 或前往 `Channel`（通道）| `Extrapolation Mode`（外推模式）。\n\n3.  选择 `Linear\
  \ Extrapolation`（线性外推）。\n\n`Linear Extrapolation` 会让 F 曲线沿着线性斜率继续延伸，该斜率源自前两个和后两个关键帧。由于这些\
  \ F 曲线上各只有两个关键帧，且它们都已经使用 `Linear`（线性）插值，因此以这种方式外推时，F 曲线将显示为完美的直线：\n\n![Figure 2.20:\
  \ Linear extrapolation for the X Location and Y Euler Rotation F-curves](img/B17149_02_20.jpg`)\n\
  \n图 2.20：X 位置和 Y 欧拉旋转 F 曲线的线性外推\n\n注意这对我们的动画有什么影响。小球不仅会继续滚动，`it now always has`\
  \ `been rolling`（它现在一直都在滚动）。\n\n## 循环外推\n\n现在让我们看看 `Z Location`（Z 位置）F 曲线。为了让小球反复弹跳，我们可以利用已有的知识，把那三个弹跳关键帧复制一百次左右……但我们不这么做。还有另一种外推模式能更干净利落地帮我们完成所有工作。\n\
  \n现在来看看它：\n\n1.  选择 `Z Location` 动画通道。\n\n2.  按 `Shift` + `E` 或前往 `Channel` | `Extrapolation\
  \ Mode`。\n\n3.  选择 `Make Cyclic (F Modifier)`（制作循环 [F 修改器]）。\n\nF 曲线现在有了所谓的循环外推。F\
  \ 曲线的关键段现在将无限重复。等等！好像不对劲：\n\n![Figure 2.21: A bounce-and-roll kind of F-curve](img/B17149_02_21.jpg`)\n\
  \n图 2.21：一种弹跳加滚动式的 F 曲线\n\n这是个奇怪的模式。这是怎么回事？\n\n记住，循环外推会重复 F 曲线的整个关键段——也就是第一个和最后一个关键帧之间的所有内容。这条曲线的最后一个关键帧在哪里？远在帧\
  \ `90` 那边！我们在本章一开始就加了它，然后把它忘了。这种事在动画师身上常有发生。\n\n我们想重复的是 20 帧的弹跳，而不是 80 帧的弹跳加滚动。那个讨厌的关键帧搞乱了我们\
  \ F 曲线的循环周期！让它见鬼去吧：\n\n1.  选择帧 `90` 上的 `Z Location` 关键帧。\n\n2.  按 `X` 删除它。\n\n啊，这下好多了。\n\
  \n![Figure 2.22: Properly repeating bounces](img/B17149_02_22.jpg`)\n\n图 2.22：正确循环的弹跳\n\
  \n现在只剩下我们的三个弹跳关键帧，下一次弹跳会紧接在上一次之后，给我们带来清脆、干净的弹跳效果。\n\n你已经完成了弹跳球动画！如果你愿意，继续玩玩看吧——也许把\
  \ `End Frame` 设为 `10,000`，看着你的作品奔向世界：\n\n![Figure 2.23: Come back!](img/B17149_02_23.jpg`)\n\
  \n图 2.23：回来啊！\n\n大功告成！\n\n## 总结\n\n通过将所有动画属性显示为线图，`Graph Editor`（图表编辑器）揭示了 3D 动画的真相——它归根结底只是一堆数字。你场景中的所有参数和每个\
  \ 3D 物体的所有属性——它们都是随时间变化的数字。你让某些数字在一帧上是一个值，然后让这些相同的数字在另一帧上是另一个值。一直搞下去，直到它不再难看。\n\n\
  就是这样。这就是 3D 动画。结束了。\n\n好吧，也许不完全是。我们还得写一整本书，讲那些美妙的数字，它们是什么，为什么需要它们，在哪里找到它们，以及如何让它们完全按照我们的意愿行事。\n\
  \n我们只是刚刚触及了 `Graph Editor` 功能的皮毛。比如你见到的那些 `Bezier keyframes`（贝塞尔关键帧）……那些有什么用？继续读下去，看看我们如何直接雕刻动画中的\
  \ F 曲线！\n\n## 问题\n\n1.  当你从 `Insert Keyframe`（插入关键帧）菜单中选择 `Location`（位置）时，实际上插入了多少个单独的关键帧？`Location\
  \ & Rotation`（位置和旋转）呢？`Location, Rotation, & Scale`（位置、旋转和缩放）呢？\n\n2.  当你删除一个动画通道时，它的关键帧会发生什么？如果你删除\
  \ F 曲线上的所有关键帧会怎样？\n\n3.  在 `Graph Editor` 中，`X` 轴和 `Y` 轴是不同的。在 `3D Viewport`（3D\
  \ 视口）中，`X` 轴和 `Y` 轴也是不同的。但这两种差异有何不同？\n\n4.  在 `Graph Editor` 中移动关键帧时，上、下、左、右等方向意味着什么？\n\
  \n5.  启用 `Normalize`（归一化）时，`Graph Editor` 的 `Y` 轴上的 -1 代表什么？\n\n6.  为什么在 `Graph\
  \ Editor` 中复制关键帧后通常建议按 `X`？\n\n7.  从一条完全平坦的 F 曲线中你能推断出什么？\n\n8.  具有 `Linear`（线性）插值的\
  \ F 曲线段显示速度吗？显示加速度吗？\n\n9.  F 曲线的哪些部分受外推影响？\n\n10.  我们在 `Graph Editor` 中学到了哪些具体操作是\
  \ `Timeline`（时间轴）无法完成的？\n"
- "# 第 3 章：贝塞尔关键帧\n\n此时，应该不用多说，关键帧是一种帧，就像地址是一种裙子……也就是说，它不是。在 Blender 中，关键帧更像是一个小物体，它影响你\
  \ 3D 场景中某物体的某个属性。它存在于 `3D Viewport` 之外的多个区域；在 `Graph Editor` 中表现为曲线上的一个点，在 `Timeline`\
  \ 和其他编辑器中表现为菱形形状。它的主要属性是值和时间，它们决定了指定帧上所分配属性的值，但它还拥有插值和缓动等属性，这些有助于确定两个关键帧之间的插值。\n\
  \n还有一类特殊的关键帧拥有自己独特的属性，我们在上一章中留待探索：`Bezier keyframes`（贝塞尔关键帧）。\n\n\n\n\n## 简介\n\n\
  这些关键帧非常强大且可能令人困惑，值得在本书中拥有独立的一章。从技术上讲，`Bezier` 是在 `设置关键帧插值` (`T`) 菜单中找到的一种插值模式，但将这种类型的关键帧放在一组单纯的插值模式中似乎并不合适。`Bezier`\
  \ 关键帧改变了游戏规则。以前，我们只是从菜单中选择不同的插值模式和缓动类型来塑造 `F 曲线`；使用 `Bezier` 关键帧，我们可以直接对其建模，创建出其他任何插值模式都无法实现的\
  \ `F 曲线`。\n\n在本章中，您将学习以下内容：\n\n*   在 `图表编辑器` 中自由插入关键帧的方法\n*   `Bezier` 关键帧手柄类型及其设置方法\n\
  *   如何编辑“手动”关键帧手柄\n*   `F 曲线` 中拐点的意义\n*   如何（以及为何）将关键帧从一个通道复制到另一个通道\n\n## 技术要求\n\
  \n本章需要一个独轮车场景，可在此处下载：\n\n`https://github.com/PacktPublishing/Realizing-3D-Animation-in-Blender`\n\
  \n该独轮车专为本练习设置，场景包含一个简短的障碍赛道以增加趣味性。在 Blender 中打开 `Unicycle.blend` 文件，让我们开始吧！\n\n\
  ## 一位疲惫的动画师\n\n哦，对了——我们要制作独轮车动画。\n\n![图 3.1：独轮车](img/B17149_03_01.jpg)\n\n图 3.1：独轮车\n\
  \n制作独轮车动画将比上一章的球更具挑战性。它可以弹跳和滚动，但也需要转向并向运动方向倾斜。它还由多个可移动部件组成，因此您需要更密切地关注所选内容。\n\n\
  这辆特定的独轮车将在没有骑手的情况下沿提供的赛道移动。想象它自行获得了生命，或者可能有一个隐形人坐在车座上。即使没有骑手，独轮车本身仍可被视为一个角色！\n\n\
  ## 独轮车的连接部件\n\n我们的独轮车模型由四个对象组成。这些对象通过 `父子关系` 和 `约束` “连接”在一起，我们将在下一章详细介绍该主题。目前，您只需知道对象\
  \ `Left Pedal`（左踏板）和 `Right Pedal`（右踏板）都设为 `Wheel`（车轮）的子级，而 `Wheel` 本身又约束于 `Seat`（车座）对象。\n\
  \n车座去哪里，车轮及其踏板就会跟随到哪里。这使其成为我们的*根*对象。就本章而言，移动此对象即视为移动独轮车，尽管没有名为“独轮车”的单一对象。我们将花费大部分时间为\
  \ `Seat` 制作动画。之后，我们将为 `Wheel` 的旋转制作动画，使其正常滚动。两个踏板可以保持不动。\n\n## 为赛道检查点设置关键帧\n\n本章的动画将比以前更灵活。为开始，我将给出一些在前几个关键帧上插入关键帧的精确指令，它们将作为您动画其余部分的基础。稍后您将自行放置更多关键帧。\n\
  \n**提示**\n\n场景和以下关键帧的设置允许您在移动对象 `Seat` 到指定位置时按住 `Ctrl` 键。这会将您的移动吸附到 1 米增量，有助于保持操作快速且精确。在其他章节中，“米”可能简称为“单位”，在\
  \ Blender 中二者实际上是同一回事。\n\n准备好添加更多位置和旋转关键帧吧！\n\n1.  转到第 **1** 帧。\n2.  选择对象 `Seat`。\n\
  3.  将独轮车向上、向后、向左移动，使其位于赛道顶部的起跑线上。\n4.  绕 *Z* 轴旋转 **90** 度，使其面向赛道的桥梁方向。\n5.  通过 `插入关键帧`\
  \ (`I`) | `位置和旋转` 设置位置和旋转关键帧。\n\n![图 3.2：第 1 帧的独轮车](img/B17149_03_02.jpg)\n\n图 3.2：第\
  \ 1 帧的独轮车\n\n仅仅一个帧就需要这么多步骤！让我们加快速度，完成接下来的几个关键帧。\n\n1.  独轮车有 5 秒时间通过第一个检查点。在第 **120**\
  \ 帧，沿 *X* 轴向右移动独轮车，使其与安全锥筒对齐。设置位置和旋转关键帧。\n\n![图 3.3：第 120 帧的独轮车](img/Image96409.jpg)\n\
  \n图 3.3：第 120 帧的独轮车\n\n1.  现在独轮车必须绕过安全锥筒向右转。在第 **150** 帧，沿 *Y* 轴向前移动独轮车到锥筒另一侧。绕\
  \ *Z* 轴向右旋转 **\\-180** 度，使其面向台阶。设置位置和旋转关键帧。\n\n![图 3.4：第 150 帧的独轮车](img/B17149_03_04.jpg)\n\
  \n图 3.4：第 150 帧的独轮车\n\n1.  在第 **160** 帧，沿 *X* 轴移动独轮车 **\\-1** 米至台阶顶端。这将是它的第一个起跳点。设置位置和旋转关键帧。\n\
  \n![图 3.5：第 160 帧的独轮车](img/B17149_03_05.jpg)\n\n图 3.5：第 160 帧的独轮车\n\n1.  在第 **200**\
  \ 帧，将独轮车带回场景“地面”高度的台阶底部。它应看起来静止在 *Y* 轴网格线上。设置位置和旋转关键帧。\n\n![图 3.6：第 200 帧的独轮车](img/B17149_03_06.jpg)\n\
  \n图 3.6：第 200 帧的独轮车\n\n1.  最后冲刺！转到第 **250** 帧，沿 *X* 轴向左移动独轮车约 **\\-15** 米。设置位置和旋转关键帧。\n\
  \n![图 3.7：第 250 帧的独轮车](img/B17149_03_07.jpg)\n\n图 3.7：第 250 帧的独轮车\n\n**提示**\n\n\
  插入这些关键帧后，使用键盘上的 `上` 和 `下` 方向键快速查看独轮车在各关键帧处的位置。如果您觉得在任何步骤中出错，不要害怕删除或覆盖现有关键帧并重试。\n\
  \n这就结束了本章的“填色游戏”部分。如果此时动画看起来不太好，不要气馁。重要的是我们的主要位置已经分镜定稿，这使我们能更轻松地继续在 `图表编辑器` 中添加和编辑更多关键帧来完善动画。\n\
  \n## 在图表编辑器中插入关键帧的新方法\n\n说到 `图表编辑器`，为什么不把它打开呢：\n\n![图 3.8：初见图表编辑器](img/B17149_03_08.jpg)\n\
  \n图 3.8：初见图表编辑器\n\n天哪！这与上一章使用的截然不同。您可能希望隐藏此处的一些通道，但请勿删除任何通道。我们需要该对象的所有六个动画通道。回想起来，那个弹跳球显得多么简单！\n\
  \n**重要提示**\n\n本章将展示大量 `F 曲线` 图片。由于这是一本包含静态图像的书，您需要在自己的屏幕上观看动画结果。请记住保持 `3D 视口` 与\
  \ `图表编辑器` 同时打开，并在进行更改后始终播放和擦洗动画以查看您创建的内容。\n\n让我们关注 `X 位置` 通道的前 120 帧：\n\n![图 3.9：X\
  \ 位置 F 曲线的第一部分](img/B17149_03_09.jpg)\n\n图 3.9：`X 位置` `F 曲线` 的第一部分\n\n有点无聊，对吧？我们将通过在这一段插入几个更多关键帧来丰富\
  \ `X 位置` `F 曲线` 的运动。这些关键帧究竟该放在哪里？为什么不由您决定？为什么不利用这段作为机会，让您自由表达，在喜欢的地方添加几个关键帧？是的，让我们拆掉辅助轮！独轮车本来就没有辅助轮。\n\
  \n顺便，我们将学习一种在 `图表编辑器` 中任意插入关键帧的有趣方法：\n\n1.  在 `图表编辑器` 中，选择对象 `Seat` 的 `X 位置` 通道。\n\
  \n\n\n\n2. 按住 `Ctrl` 并用非选择鼠标按钮点击，即可在鼠标光标位置直接插入一个 `X Location` 关键帧。\n\n3. 重复此操作，直到你在第\
  \ 1 帧和第 120 帧之间添加了 3 或 4 个新的 `X Location` 关键帧。\n\n4. 通过选择并按 `G` 抓取这些新关键帧来按你的喜好进行调整。结果应使你的独轮车速度和方向平滑变化。避免制造离谱的陡峭斜率和峰值，那会导致独轮车移动得突兀地快或冲出赛道。\n\
  \n重要提示\n\n当你想要选择并抓取贝塞尔关键帧时，请确保抓取的是关键帧本身（中间的点），而不仅仅是它的手柄（关键帧两侧伸出的那两个小“天线”）。我们将在下一节学习手柄。\n\
  \n我选择添加四个关键帧，使独轮车在最开始时向后移动一次，随后再向后移动一次：\n\n![图 3.10：X Location F 曲线示例](img/B17149_03_10.jpg)\n\
  \n图 3.10：X Location F 曲线示例\n\n你的 F 曲线可能看起来不同。这没关系！如果你只是复制我在图表编辑器中看到的内容，那就不是你的动画了。\n\
  \n现在我们已经为我们的分步动画添加了自己的个人风格，看起来……依然很糟糕。别担心；我们马上就要利用贝塞尔手柄的魔力来改善它。\n\n## 贝塞尔手柄类型\n\n\
  在 Blender 的图表编辑器中，`Bezier` 被归类为一种关键帧插值模式。此模式可在 `设置关键帧插值` (`T`) 菜单中找到，但本练习无需调出该菜单，因为\
  \ `Bezier` 是默认的插值模式。你所有的关键帧已经是贝塞尔关键帧了！\n\n区分贝塞尔关键帧和其他类型的关键帧很容易。贝塞尔关键帧具有**手柄**：\n\
  \n![图 3.11：带有可见手柄的贝塞尔类型关键帧](img/B17149_03_11.jpg)\n\n图 3.11：带有可见手柄的贝塞尔类型关键帧\n\n\
  关键帧本身是 F 曲线上的中间点。手柄是关键帧左右两侧延伸出的两个点，由线条连接，这些线条在关键帧处与曲线*相切*。\n\n如果你用过任何类型的矢量图形应用程序，你会认出这些是什么，它们的功能也不会让你感到惊讶。贝塞尔手柄弯曲曲线，将其轨迹推向手柄的方向。手柄越长，对该曲线段的影响越强。在\
  \ Blender 的图表编辑器中，我们可以直接编辑这些手柄，或利用特定手柄类型的自动行为来创建其他插值模式无法实现的 F 曲线形状。\n\n在继续之前，我们必须采取一个重要步骤，以帮助这些手柄更易于查看和选择。\n\
  \n## 显露关键帧手柄\n\n你可能已经注意到，只有选中的关键帧似乎有手柄。默认情况下，必须先选择关键帧，其贝塞尔手柄才会出现在图表编辑器中。多么不方便的工作方式啊！对于本练习，我们希望能看到并选择所有手柄，而无需先选择关键帧：\n\
  \n1. 转到图表编辑器的 `视图` 菜单。\n\n2. 取消勾选 `仅选中关键帧手柄`。\n\n现在我们可以看到所有手柄了！好多了。\n\n![图 3.12：图表编辑器中所有手柄均可见](img/B17149_03_12.jpg)\n\
  \n图 3.12：图表编辑器中所有手柄均可见\n\n提示\n\n图表编辑器的 `视图` 菜单中还隐藏着一些其他实用功能。另一个你可能考虑启用的有用功能是 `显示滑块`，它会直接在动画通道列表中显示每个动画属性的当前值。在图表编辑器中编辑这些滑块是插入关键帧的另一种方式！\n\
  \n## 贝塞尔手柄类型概览\n\n在上一章中，我们从 `设置关键帧缓动类型` (`Ctrl` + `E`) 菜单中选择了不同的缓动类型，这在使用任何 `缓动`\
  \ 或 `动态效果` 插值模式时是必要的。相比之下，贝塞尔关键帧没有缓动类型。它们改为拥有手柄类型，通过 `设置关键帧手柄类型` (`V`) 菜单进行设置：\n\
  \n![图 3.13：设置关键帧手柄类型菜单](img/B17149_03_13.jpg)\n\n图 3.13：设置关键帧手柄类型菜单\n\n这些类型决定了手柄应具有何种自动行为（如果有）。以下是所有类型的简介：\n\
  \n*   `Free`（自由）：最“手动”的贝塞尔手柄，可自由且独立地移动。这会在 F 曲线中产生尖锐角度，从而导致物体速度或方向发生剧烈变化。`Free`\
  \ 手柄忠实地保持调整后的状态，不受相邻关键帧影响。\n\n*   `Aligned`（对齐）：这种手柄几乎可以自由移动。它不对任何事物做出反应，除了关键帧另一侧的“同胞”手柄，它必须与之保持对齐。当你仍希望\
  \ F 曲线在关键帧处保持平滑时，可用于手动控制。\n\n*   `Vector`（矢量）：一个略具误导性的名称（技术上讲所有贝塞尔手柄都是矢量），这些手柄自动指向相邻关键帧或其曲线段的顶点。一排多个\
  \ `Vector` 手柄将创建一条外观与线性插值完全相同的 F 曲线。\n\n*   `Automatic`（自动）：这些手柄自动旋转和缩放，以生成尽可能平滑的\
  \ F 曲线。`Automatic` 手柄非常适合松散且自然的运动，但如果粗心使用，容易产生“漂移”和“超调”，搞得一团糟。\n\n*   `Auto Clamped`（自动钳制）：默认手柄类型，也是迄今为止最实用、最常见的。像\
  \ `Automatic` 手柄一样，它们也试图制作平滑曲线，但倾向于在可能的情况下保持水平，以避免不必要的运动。\n\n重要提示\n\n使用 `设置关键帧手柄类型`\
  \ (`V`) 并不是更改贝塞尔关键帧手柄类型的唯一方法。手动编辑任何手柄都会导致其类型变为 `Free` 或 `Aligned`。因此，在 Blender 中很容易意外更改手柄类型！\n\
  \n我们将有机会在动画中利用这些手柄类型中的每一个。让我们从最简单的一个开始！\n\n## Automatic 和 Auto Clamped 贝塞尔手柄\n\n\
  当你移动带有 `Auto Clamped` 手柄的贝塞尔关键帧时，你可能已经注意到手柄会相对于相邻关键帧自动移动。`Auto Clamped` 和 `Automatic`\
  \ 关键帧手柄的相似之处在于它们不由动画师直接控制。这些所谓的“手柄”根本就不打算被“手动操作”！相反，手柄会根据相邻关键帧的位置和轨迹自动反应，以生成最优平滑的\
  \ F 曲线。在拥有数千个关键帧的动画中，我们不想逐个编辑每个手柄，此功能必不可少。\n\n让我们回到 `X Location` F 曲线的第一部分，即第 1\
  \ 帧到第 120 帧之间，我们刚刚添加了一些随机关键帧使其更有趣。结果应该看起来相当平滑，但还可以更平滑。\n\n让我们试用 `Automatic` 手柄类型：\n\
  \n1. 选择第 120 帧之前的所有 `X Location` 关键帧。\n\n2. 按 `V` 调出 `设置关键帧手柄类型` 菜单。选择 `Automatic`。\n\
  \n3. 完成此操作后，你可能希望进一步微调这些关键帧的位置，以适应它们奇特的新行为。\n\n`X Location` F 曲线和生成的动画现在看起来应该比以前稍微平滑一些：\n\
  \n![](img/Image96509.jpg)\n\n图 3.14：带有“全自动”关键帧的 F 曲线\n\n\n\n\n将你新的 `Automatic` 关键帧手柄与之前的\
  \ `Auto Clamped` 手柄进行对比。`Auto Clamped` 手柄更为保守；它们倾向于尽可能保持平坦，将 `F 曲线` 的数值范围限制在每一对相邻关键帧之间。\n\
  \n![Figure 3.15: Top – Auto Clamped keyframes; bottom – Automatic keyframes](img/B17149_03_15.jpg)\n\
  \nFigure 3.15：上 – `Auto Clamped` 关键帧；下 – `Automatic` 关键帧\n\n另一方面，`Automatic` 手柄则狂野不羁，毫无顾忌。它们让\
  \ `F 曲线` 像蜿蜒的河流一样流动，赋予自己所需的任何方向和幅度，使穿过关键帧点的曲线尽可能平滑。在 `图表编辑器` 中移动它们时，人们不必过多关注其精确的\
  \ `XY` 位置，而应更多地关注生成的 `F 曲线` 形状。这种行为使得 `Automatic` 手柄非常适合厚重、摇晃、扭动的运动，在这些情况下物体保持动画状态且不需要高精度。\n\
  \n### 为什么不到处都用 `Automatic` 关键帧？\n\n`Auto Clamped` 之所以是默认选项，是有原因的。看看如果我们给所有关键帧都设置\
  \ `Automatic` 手柄，我们的 `Y 位置` `F 曲线` 会变成什么样：\n\n![Figure 3.16: Y Location F-curve\
  \ with all Automatic keyframes](img/B17149_03_16.jpg)\n\nFigure 3.16：所有关键帧均为 `Automatic`\
  \ 的 `Y 位置` `F 曲线`\n\n这是之前提到的 `漂移` 效应的一个绝佳例子。在这里，独轮车会偏离整个赛道！我们从未想让它在 `Y` 轴上移动那么多。\n\
  \n`Automatic` 手柄太狂野了，很难让它们在你想要平坦的地方保持平坦。这种同类效应还会导致“超出”，产生不可预测的极值，或 `F 曲线` 上不在关键帧处的“峰值”，使\
  \ `F 曲线` 更难控制。\n\n相比之下，`Auto Clamped` 关键帧手柄更加明智。无论在 `F 曲线` 上哪里有两个这样的关键帧，你都可以确信该\
  \ `F 曲线` 段上的数值将保持在这两个关键帧数值的范围内，且不会改变方向。曲线的平坦段将保持平坦，峰值将始终固定在关键帧的时间和数值上。在接下来的练习中，我们将继续使用\
  \ `Auto Clamped` 关键帧手柄作为默认值，仔细且刻意地选择要更改为其他类型的手柄。\n\n我们已经充分了解了 `Automatic` 和 `Auto\
  \ Clamped` 的区别。让我们继续学习另外两种手柄类型。\n\n## Vector 和 Aligned 手柄\n\n还有大量工作要做！暂时，我们将搁置独轮车在\
  \ `120` 帧和 `150` 帧之间微弱的“转弯”，因为独轮车尚未“绕过”任何东西，转而关注 `X 位置` `F 曲线` 中另一个需要我们注意的部分。\n\n\
  ![Figure 3.17: X Location F-curve from frame 160 to 200](img/B17149_03_17.jpg)\n\
  \nFigure 3.17：`160` 到 `200` 帧的 `X 位置` `F 曲线`\n\n在 `160` 帧和 `200` 帧之间，我们希望独轮车在下楼梯时能一级级地“跳跃”前进。就像我们弹跳球练习那样，这意味着独轮车在这一部分大部分时间不接触地面，因此它应该保持恒定的水平速度——即\
  \ `X 位置` `F 曲线` 上的线性插值。\n\n我们可以使用 `Linear` 插值模式来实现，但让我们尝试使用 `Vector` 手柄：\n\n1. 选择\
  \ `Seat` 在 `160` 帧和 `200` 帧上的两个 `X 位置` 关键帧。\n2. 按 `V` 并将 `设置关键帧手柄类型` 设为 `Vector`。\n\
  \n现在，两个关键帧相对的手柄直接指向对方，形成了一条完美的直线段：\n\n![Figure 3.18: A linear segment made using\
  \ Vector handles](img/B17149_03_18.jpg)\n\nFigure 3.18：使用 `Vector` 手柄创建的线性段\n\n\
  如果你认为这与 `Linear` 插值模式完全相同，你是对的！与其他手柄类型相比，这些 `Vector` 手柄的用处有限。不过，我们可以利用它们做一个小技巧……\n\
  \n## 组合 Vector 和 Aligned 手柄\n\n你知道单个 `贝塞尔关键帧` 可以拥有两种不同的手柄类型吗？对于某些手柄组合这是成立的，在以下情况下可能很有用。要更改单个手柄的类型而不是两个，你只需选择单个手柄而不是整个关键帧。\n\
  \n让我们用刚才编辑的关键帧试一下：\n\n1. 选择 `160` 帧 `X 位置` 关键帧的**左侧**手柄。\n2. 按住 `Shift` 选择 `200`\
  \ 帧 `X 位置` 关键帧的**右侧**手柄。\n3. 将两个关键帧的手柄都设为 `Aligned`。\n\n注意 `Aligned` 手柄现在如何与其同胞\
  \ `Vector` 手柄刚性对齐。如果你尝试拖动它们，它们可以被缩放，但无法自行改变方向：\n\n![Figure 3.19: Bezier keyframes\
  \ with a combination of Vector and Aligned handles](img/B17149_03_19.jpg)\n\nFigure\
  \ 3.19：组合了 `Vector` 和 `Aligned` 手柄的 `贝塞尔关键帧`\n\n通过将 `Aligned` 手柄与 `Vector` 手柄结合使用，我们能够消除最初那些尖锐的拐角，保持平滑的\
  \ `F 曲线`，同时不影响线性段。结果是在 `160` 和 `200` 帧之间的恒定速度前实现了缓入和缓出。\n\n虽然巧妙，但这只是 `Aligned` 手柄较少见的用例之一。在下一节，为什么不通过直接编辑它们来多练习一下呢？\n\
  \n## 编辑贝塞尔手柄\n\n在上一节中，我们尝试了所有不由动画师直接控制的 `贝塞尔` 手柄类型：`Auto Clamped`、`Automatic` 和\
  \ `Vector`。这些类型都具有某种“自动”行为，会受相邻关键帧影响。\n\n剩下的类型 `Aligned` 和 `Free` 没有这种自动行为。它们固定在关键帧的中心点，除非直接编辑，否则不会移动。如果我们不学会如何直接编辑，就无法继续前进！\n\
  \n在 Blender 中编辑 `贝塞尔` 手柄与编辑其他元素几乎没有区别。以下是主要操作符：\n\n* `旋转` (`R`)：这会改变所选手柄的方向，从而改变关键帧点处曲线的轨迹。\n\
  * `缩放` (`S`)：这会改变手柄的大小（幅度），从而改变其方向影响的强度。\n* `抓取` (`G`)：抓取手柄可自由移动它，同时影响其方向和大小。\n\n\
  毫不意外！不用太担心选择或旋转；在大多数情况下，你只需使用 `抓取` (`G`) 即可。点击拖动也行。\n\n了解了这些，让我们继续处理我们的 `X 位置` `F\
  \ 曲线`。\n\n## 使用 Aligned 手柄实现平滑运动\n\n`X 位置` `F 曲线` 还有一个部分需要我们紧急关注：`120` 和 `150` 帧之间的掉头：\n\
  \n![Figure 3.20: Undesirably flat section of the X Location F-curve](img/B17149_03_20.jpg)\n\
  \nFigure 3.20：`X 位置` `F 曲线` 中不理想的平坦段\n\n为了让独轮车真正绕过安全锥，我们需要做些什么来推高曲线的这一部分，使得在 `135`\
  \ 帧时，独轮车位于安全锥之外而不是穿过它。虽然我们不需要在 `135` 帧插入关键帧来实现这一点。相反，我们可以编辑现有关键帧的手柄。这次我们不需要将手柄类型改为\
  \ `Aligned`。当我们编辑手柄时，这会自动发生：\n\n1. 选择 `Seat` 在 `120` 帧 `X 位置` 关键帧的**右侧**手柄。\n2.\
  \ 使用 `抓取` (`G`) 将其向上移动。\n3. 对 `150` 帧 `X 位置` 关键帧的**左侧**手柄做同样的操作。\n4. 继续编辑这两个关键帧，直到在\
  \ `120` 和 `150` 帧之间获得一个漂亮、对称、拱形的形状，且两侧极少有“褶皱”：\n\n\n\n\n\n## X 位置 F 曲线调整\n\n![Figure\
  \ 3.21: The improved X Location F-curve](img/B17149_03_21.jpg)\n\nFigure 3.21: 改进后的\
  \ X 位置 F 曲线\n\n我们之所以避免添加额外关键帧，并非出于固执。有时，确实尽可能少用关键帧就能实现平滑运动。结果应该让独轮车绕过安全锥，沿着一个略呈椭圆的路径行驶。\n\
  \n我们即将完成这条 F 曲线了！让我们做最后一次调整来收尾。为什么独轮车要在第 `250` 帧减速停下？如果它看起来像是在动画结束后还将继续巡航，会少些枯燥感。\n\
  \n让我们调整最后那个关键帧，使独轮车加速（并保持）巡航速度，直到最后一帧：\n\n1.  选中第 `250` 帧关键帧的 `左侧` 手柄并 `抓取` (`G`)，向上移动。\n\
  2.  你可能还需要 `缩放` (`S`) 第 `200` 帧上 `对齐` 的 `右侧` 关键帧手柄。\n3.  重复操作，直到独轮车以令人满意的方式达到令人满意的速度。\n\
  \n![Figure 3.22: Final part of the X Location F-curve](img/B17149_03_22.jpg)\n\n\
  Figure 3.22: X 位置 F 曲线的最后部分\n\n我们对 `X 位置` F 曲线的工作现在完成了。请记住，并非所有（甚至大多数）动画都会这样制作（即一次做一条\
  \ F 曲线），但目前能完成一整条 F 曲线还是很不错的。现在继续下一条！\n\n## 使用自由手柄制作弹跳\n\n在 `Seat` 对象的动画通道列表中向下看，我们现在可以关注\
  \ `Z 位置` 了。`Y 位置` 恰好可以保持原样。\n\n![Figure 3.23: The current Z Location F-curve](img/Image96595.jpg)\n\
  \nFigure 3.23: 当前的 Z 位置 F 曲线\n\n我们的主要关注点是第 `160` 帧到 `200` 帧之间的 F 曲线部分。在这 40 帧的区间内，我们希望独轮车跳下那段短楼梯。如果我们使用带有\
  \ `自由` 手柄的关键帧，就能用极少的额外关键帧实现这一点。\n\n我们的路线恰好在这 40 帧内有 4 级台阶要通过，所以独轮车必须跳 4 次——即每跳 10\
  \ 帧。通过在第 `170`、`180` 和 `190` 帧插入关键帧，我们将 F 曲线分成了 4 个片段，每个长 10 帧。然后我们可以编辑所有关键帧的手柄，手动创建每一次向上的弹跳。\n\
  \n这次，你可以用任何喜欢的方法插入关键帧：\n\n1.  在第 `170`、`180` 和 `190` 帧为 `Seat` 插入 `Z 位置` 关键帧。\n\
  2.  调整每个新关键帧的数值，使独轮车在每一帧都接触到一个台阶（提示：台阶每级下降半米）。\n3.  选中第 `160` 到 `200` 帧之间的所有 `Z\
  \ 位置` 关键帧（包括第 `160` 和 `200` 帧上的）。\n4.  将选中的关键帧转换为 `自由` 手柄类型。\n5.  向上调整手柄，在 `Z 位置`\
  \ F 曲线中创建四个“跳跃”，如下所示：\n\n![Figure 3.24: Downstairs-hopping motion along the Z Location\
  \ F-curve](img/B17149_03_24.jpg)\n\nFigure 3.24: Z 位置 F 曲线上的下楼跳跃运动\n\n`自由` 手柄可以像老式电视机的天线一样独立移动，这使它们非常适合这种类型的动作。注意，我们实际上不需要在弧顶放关键帧；两个关键帧相对的手柄就足以创建运动了。\n\
  \n回顾一下目前动画的状态，并对 `Seat` 的 `位置` F 曲线做任何你喜欢的其他微调。当你满意时，我们将以此为基础，在后续章节中为座椅和车轮的旋转制作动画。\n\
  \n## 朝向、重心与平衡\n\n让我们回顾一下 `Seat` 还需要我们关注的其余动画通道：\n\n*   `X 欧拉旋转` 让独轮车座椅前后摇晃，这对于在独轮车前后移动时表现重心和平衡是必要的。\n\
  *   `Y 欧拉旋转` 让独轮车左右倾斜。当独轮车从第 `120` 帧到 `150` 帧向右转时，我们希望它向右倾斜。\n*   `Z 欧拉旋转` 控制独轮车转向，决定其朝向（或者至少是它应有的朝向）。我们已经从第\
  \ `120` 帧到 `150` 帧给它做了一点动画，但还需要调整。\n\n为了让独轮车表现出令人信服的平衡、重心和方向，所有这些通道都需要在图表编辑器中制作动画和/或修正动画。我们具体如何制作动画，将取决于对已创建的现有运动进行仔细研究。\n\
  \n## 运动路径作为视觉指南\n\n独轮车在 `X` 或 `Y` 轴上该倾斜多少在某种程度上是主观的。另一方面，它在 `Z` 轴上该指向哪里可不是口味问题；它可能是辆魔法独轮车，但它必须指向其运动的方向！因此，我们不按旋转分量的字母顺序依次处理，而是先处理\
  \ `Z 欧拉旋转` F 曲线。反正它也快完成了，因为它只需要在第 `120` 到 `150` 帧之间变化。\n\n然而，请密切观察这些帧之间发生的情况。有些帧中，独轮车的表观朝与其实际运动方向不完全一致。它的朝向略微歪斜，导致它看起来像是在斜向滑动。如果你从上方查看独轮车并在这些帧间刷帧，会更容易发现这一点。\n\
  \n> **提示**\n>\n> 你一直在刷帧，对吧？你必须刷帧！为了制作精准的动画，必须通过在 3D 视口从各个角度查看动作、在动画编辑器中拖动帧来审查动画。只需点击并拖动任何动画编辑器顶部的帧号行。这有助于揭示实时播放时难以诊断的动画问题。\n\
  \n如果你还是不信，有个方法能让错误更易看清，并利用 `运动路径` 进行修正：\n\n1.  选中 `Seat`，在 `属性` 区域前往 `对象属性` 选项卡。\n\
  2.  找到并展开 `运动` `路径` 面板。\n\n![Figure 3.25: The Motion Paths panel](img/B17149_03_25.jpg)\n\
  \nFigure 3.25: 运动路径面板\n\n1.  点击 `计算`，然后点击 `确定`（此处的默认设置即可）。\n\n现在你能真正看到独轮车的路径了：\n\
  \n![Figure 3.26: Motion path of the unicycle](img/B17149_03_26.jpg)\n\nFigure 3.26:\
  \ 独轮车的运动路径\n\n> **重要提示**\n>\n> 此运动路径纯粹是视觉参考，无法直接编辑。它仅显示物体原点在每一帧的位置。如果你对动画做出会影响路径的更改，必须点击\
  \ `更新路径` 才能看到这些变化的反映。\n\n从上方查看时，问题现在显而易见。甚至一张静态图就能看出独轮车并没有指向它该指向的方向：\n\n![Figure\
  \ 3.27: The motion path viewed from above](img/B17149_03_27.jpg)\n\nFigure 3.27:\
  \ 从上方查看的运动路径\n\n有了这个视觉辅助，我们可以更有信心地修正 `Z 欧拉旋转` F 曲线：\n\n1.  找到 `Seat` 的 `Z 欧拉旋转`\
  \ F 曲线。\n2.  尽可能少用关键帧，编辑 F 曲线，使独轮车在第 `120` 到 `150` 帧之间的每一帧都指向其运动方向。\n\n你自己的解决方案将取决于你在前几节中如何为\
  \ `Seat` 的 `X 位置` 和 `Y 位置` 制作的动画。在我的例子中，我发现只需缩小关键帧手柄以获得近乎线性的形状，就能得到不错的结果：\n\n![Figure\
  \ 3.28: Example corrected Z Euler Rotation F-curve and its result](img/B17149_03_28.jpg)\n\
  \nFigure 3.28: 修正后的 Z 欧拉旋转 F 曲线示例及其结果\n\n\n\n\n\n## 转弯时的倾斜\n\n一旦你对独轮车的转向感到满意，我们就可以继续处理下一个通道，以使转弯看起来更完整。\n\
  \n> **提示**\n>\n> 运动路径有时可以作为有用的参考，但有时也会分散注意力，弄乱 3D 视口。完成本节后，你可以通过在 3D 视口的 `Viewport\
  \ Overlay`（视口覆盖层）设置中禁用 `Motion Paths`（运动路径）来隐藏为 `Seat`（座位）创建的运动路径，或者通过点击对象 `Object\
  \ Properties`（对象属性）选项卡中 `Motion Paths` 面板上的 `X` 按钮将其彻底删除。\n\n如果你会骑自行车，你就会知道你需要向转向的方向倾斜，否则很快就会摔倒。独轮车也不例外。在本节中，我们将编辑\
  \ `Y Euler Rotation`（Y 欧拉旋转）`F-curve`（F 曲线），使独轮车倾斜，从而让转弯更逼真。\n\n独轮车该倾斜多少度？该在转弯前多久开始倾斜？我建议\
  \ 20 度和 10 帧，但这只是我的看法。你是动画师——由你决定什么看起来好。顺便说一句，这里使用什么贝塞尔手柄类型以及如何编辑它们，也由你决定。\n\n让我们试一试：\n\
  \n1.  在第 `110` 帧为 `Seat` 插入一个 `Y Euler Rotation` 关键帧，即大致在转弯（第 `120` 帧）前 10 帧的位置。\n\
  2.  编辑第 `120` 帧和第 `150` 帧现有 `Y Euler Rotation` 关键帧的数值和手柄，使独轮车在转弯方向倾斜，然后再恢复直立。\n\n\
  我的尝试如下图所示：\n\n![Figure 3.29: An example Y Euler Rotation F-curve](img/B17149_03_29.jpg)\n\
  \n图 3.29：Y Euler Rotation F 曲线示例\n\n但等等——既然我们第一次让独轮车倾斜了，现在发现这导致车轮不再接触地面：\n\n![Figure\
  \ 3.30: The rotated unicycle, now hovering slightly above ground](img/B17149_03_30.jpg)\n\
  \n图 3.30：旋转后的独轮车，略微悬浮在地面上方\n\n随着独轮车倾斜，我们希望它保持贴地。我们必须再次编辑 `Z Location`（Z 位置）`F-curve`，将整个独轮车向下微移一点以进行补偿：\n\
  \n1.  在第 `110` 帧插入一个 `Z Location` 关键帧（或在你插入额外 `Y Euler Rotation` 关键帧的任意帧）。\n2. \
  \ 编辑 `Z Location` 关键帧，使独轮车在倾斜时向下微移，以保持车轮接触路面。\n\n你可能已经猜到，`Z Location` `F-curve`\
  \ 的这一部分应该模仿 `Y Euler Rotation` `F-curve`。当在 `Graph Editor`（图表编辑器）中放大 *Y* 轴时，两者看起来应该非常相似：\n\
  \n![Figure 3.31: Example correction of the Z Location F-curve, with the result](img/B17149_03_31.jpg)\n\
  \n图 3.31：Z Location F 曲线修正示例及结果\n\n这种方法不需要（也不必）完美精确，所以不必担心把它调得完全正确。\n\n现在我们的独轮车在转弯时会倾斜，它开始看起来更像一个真实的物体，而不是被上方一根绳子吊着直立的东西。为了完成这种重量感和平衡感的假象，只剩下最后一个通道需要制作动画了。\n\
  \n## 深入倾斜\n\n我们把 `X Euler Rotation`（X 欧拉旋转）通道留到了最后。出于独轮车转弯时需要绕 *Y* 轴倾斜的同一个原因，当座位前后移动时，它也需要绕\
  \ *X* 轴倾斜。当你观察独轮车在第 `1` 帧到第 `120` 帧之间从左向右移动时，这一点尤为明显。\n\n每当 `Seat` 的 `X Euler Rotation`\
  \ 为正值时，独轮车前倾；每当为负值时，独轮车后倾。独轮车何时该前倾，何时该后倾？你可能会想：“*简单*，它向前移动时前倾，向后移动时后倾。向前或向后移动得越快，朝该方向倾斜得就越厉害。*”\
  \ 这很接近，但不完全正确。\n\n我们不应关注独轮车*移动的方向*，而应关注其*加速度的方向*。一般来说，当独轮车向前加速时应前倾，向后加速时应后倾。加速度越大，为显得平衡，它就应朝加速度方向倾斜得越厉害。\n\
  \n> **重要提示**\n>\n> 这里的“加速”既包含“减速”，也包含“增速”。例如，当在空中时，弹跳球因重力始终向下加速，即使它此时仍在向上运动。\n\n\
  ## 识别拐点\n\n我们独轮车的大部分水平移动发生在全局 *X* 轴上，因此我们主要可以通过检查 `Seat` 的 `X Location`（X 位置）`F-curve`\
  \ 来推断独轮车的加速度。加速度体现在 `F-curve` 斜率的变化，即“弯曲”处。每当 `X Location` `F-curve` 显示向前加速时，`X\
  \ Euler Rotation` 就应为正值；每当显示向后加速时，`X Euler Rotation` 就应为负值。`X Location` 曲线弯曲方向发生改变的帧被称为**拐点**。\n\
  \n以下是我 `X Location` `F-curve` 上的拐点。注意它们不一定出现在关键帧上：\n\n![Figure 3.32: Each circle\
  \ indicates an approximate point of inflection in the X Location F-curve](img/B17149_03_32.jpg)\n\
  \n图 3.32：每个圆圈表示 X Location F 曲线上的一个大致拐点\n\n我们将在另一条曲线上用关键帧标记这些拐点。在 `X Location` `F-curve`\
  \ 出现拐点的每一帧，`X Euler Rotation` 都应为零，使 `Seat` 在切换前倾或后倾的瞬间直立一帧。这意味着 `X Location` `F-curve`\
  \ 上的每个拐点都将伴随 `X Euler Rotation` `F-curve` 上的一个 `x-intercept`（即数值为 `0` 的点）。\n\n你的\
  \ `X Location` `F-curve` 包含你个人的风格，你在第 `1` 帧到第 `120` 帧之间添加了一些额外关键帧来丰富动作，所以我无法明确告诉你在哪里添加接下来的几个关键帧。相反，你必须仔细观察你的\
  \ `X Location` `F-curve` 来亲自寻找拐点：\n\n1.  调整 `Graph Editor` 的通道可见性设置，使 `X Location`\
  \ 和 `X Euler Rotation` `F-curve` 同时可见。\n2.  选中 `X Euler Rotation` `F-curve`。\n3.\
  \  在 `X Location` `F-curve` 出现拐点的每一帧，使用 `Insert Keyframe`（插入关键帧，快捷键 `I`）| `Only\
  \ Selected Channels`（仅选中通道）来插入一个 `X Euler Rotation` 关键帧，保持 `X Euler Rotation` 的值为\
  \ `0`。\n\n当然，你的 `X Euler Rotation` `F-curve` 此时仍是平的，但现在它拥有了关键帧，将确保无论我们接下来插入什么其他关键帧，`F-curve`\
  \ 在所有正确的帧上数值都为 `0`。\n\n## 完成平衡的假象\n\n在用 `X Euler Rotation` 关键帧标记了所有 `X Location`\
  \ 拐点后，我们现在可以沿 `F-curve` 添加正负关键帧：\n\n1.  从动画开始到第 `120` 帧，插入非零 `X Euler Rotation`\
  \ 关键帧（在上一步骤生成的每个旧关键帧之间至少插入一个），使 `Seat` 按 `X Location` `F-curve` 弯曲指示的加速度方向倾斜。\n\
  2.  在第 `120` 帧到第 `160` 帧之间，独轮车绕 *Z* 轴旋转，并在 *X* 和 *Y* 轴上都有一些移动。保持这部分 `F-curve` 相对平坦，或者用尽可能少的帧做成你看起来好的样子。\n\
  3.  在第 `160` 帧到第 `200` 帧之间，独轮车的 `X Location` 以恒定速度移动，没有加速度。保持这部分 `X Euler Rotation`\
  \ `F-curve` 大体平坦。\n\n\n\n\n\n## 步骤 4-6\n\n4. 对 **X Euler Rotation** F-curve 重复*步骤\
  \ 3*，范围从第 **200** 帧到结束。注意独轮车已掉头，因此 **X Location** F-curve 上的“向下”现在意味着向前而非向后。\n\n\
  5. 根据需要对 **X Euler Rotation** F-curve 进行进一步调整，直到你对结果满意。你可以考虑使用更多 `Automatic` 关键帧，旋转部分\
  \ `x-intercept` 关键帧，或根据加速度大小改变独轮车的倾斜程度。\n\n6. 这是我最终的 **X Euler Rotation** F-curve，与\
  \ **X Location** F-curve 一起显示，以便你查看前者如何受后者影响：\n\n![Figure 3.33: Example X Euler\
  \ Rotation and X Location F-curves](img/B17149_03_33.jpg)\n\nFigure 3.33: Example\
  \ X Euler Rotation and X Location F-curves\n\n这可能是我们迄今为止最难制作动画的通道！这种技术——在制作一个 F-curve\
  \ 动画时检查另一个 F-curve——适用于各种动画物体和角色。\n\n`Seat` 对象现已完全制作动画，独轮车在倾斜、转弯和穿越赛道时表现出逼真的平衡。至于组成独轮车的其余元素，还有一个显而易见的对象需要赋予生命。\n\
  \n## 将关键帧复制到另一通道\n\n骑真实独轮车时，你必须蹬踏板，旋转车轮使独轮车前进或后退。具有讽刺意味的是，在本练习中，我们先为独轮车其余部分制作了动画，最后才弄清楚车轮该如何旋转！\n\
  \n本章的最后任务是为 `Wheel` 对象的旋转制作动画。到目前为止，`Wheel` 一直被 `Seat` 拖拽跟随。如果我们正确制作其旋转动画，它将看起来像与地面有摩擦力，甚至看起来像是驱动独轮车其余部分的部件。要显得正确，`Wheel`\
  \ 的旋转必须与 `Seat` 的运动紧密相关——紧密到我们可以**复制并粘贴**关键帧。\n\n关键帧可使用常规的 `Copy Keyframes` (`Ctrl`\
  \ + `C`) 和 `Paste Keyframes` (`Ctrl` + `V`) 操作符进行复制和粘贴。这是 `Duplicate` (`Shift` +\
  \ `D`) 的一个有用替代方案，但有一个特殊优势：关键帧可从一个通道复制并粘贴到另一个通道。\n\n在 Blender 中复制粘贴关键帧的过程绝不局限于贝塞尔关键帧，但在\
  \ Graph Editor 中这是一个有用的技巧，将在我们完成本章动画时节省大量时间！我还会展示几个我们之前错过的其他动画技巧。\n\n## 复制关键帧\n\n\
  正如你可能猜到的，我们将从 `Seat` 的 **X Location** F-curve 复制关键帧，因为独轮车几乎所有水平移动都发生在场景的全局 *X* 轴上：\n\
  \n1. 在 Graph Editor 中找到 `Seat` 的 **X Location** F-curve。\n2. 仅选择所有 **X Location**\
  \ 关键帧。\n3. 使用 `Copy Keyframes` (`Ctrl` + `C`)。\n\n> **Tip**\n> 你可以通过双击通道名称，或选择 F-curve\
  \ 上的一个关键帧并使用 `Select Linked` (`L`) 来快速选择一个通道中的所有关键帧。确保复制的选择中没有来自其他通道的关键帧；否则粘贴时可能会出现问题。\n\
  \n选中的关键帧现已复制到“剪贴板”——这个复制数据等待粘贴的不可见中转站。接下来，我们必须创建将成为它们永久归宿的通道。\n\n## 为单个属性插入关键帧\n\
  \n仅需为 `Wheel` 的一个属性制作动画：**X Euler Rotation**。复制的关键帧无法粘贴到尚不存在的 F-curve 中，因此粘贴前必须先为该属性插入关键帧。这将在\
  \ Graph Editor 中创建一个 **X Euler Rotation** F-curve。\n\n以下是仅为一个空间属性而非所有三个轴插入关键帧的方法：\n\
  \n1. 选择 `Wheel` 对象。\n2. 在 **Transform** 面板中找到 `Wheel` 的 **Rotation** 属性。该面板位于 **Properties**\
  \ 编辑器的 **Object Properties** 中，或 3D Viewport 侧边栏的 **Item** 选项卡中。\n3. 右键点击 **Rotation**\
  \ 属性的 **X** 分量，从上下文菜单中选择 `Insert Single Keyframe`。\n\n这将仅为单个属性插入关键帧，而非为每个轴插入三个：\n\
  \n![Figure 3.34: Keyed X Euler Rotation property](img/B17149_03_34.jpg)\n\nFigure\
  \ 3.34: Keyed X Euler Rotation property\n\n`Wheel` 的 **X Euler Rotation** 通道现在应在\
  \ Graph Editor 中可见，我们甚至不必删除任何不必要的通道。这个关键帧将作为临时占位符，稍后粘贴时会被替换。\n\n## 粘贴关键帧\n\n现在我们可以将复制的关键帧粘贴到新通道：\n\
  \n1. 选择 `Wheel` 的 **X Euler Rotation** 通道。\n2. 使用 `Paste Keyframes` (`Ctrl` + `V`)。\n\
  \n    某些操作符（如上一个）具有可在 **operator** 面板中修改的参数，该面板在操作符执行后出现在编辑器角落。我们现在需要调整这些参数。\n\n\
  3. 打开 Graph Editor 左下角的 `Paste Keyframes` 操作符面板。\n4. 将 **Offset** 改为 **No Offset**，将\
  \ **Type** 改为 **Overwrite All**。\n\n![Figure 3.35: The Paste Keyframes operator\
  \ panel](img/B17149_03_35.jpg)\n\nFigure 3.35: The Paste Keyframes operator panel\n\
  \n这些新操作符设置确保粘贴的关键帧与原始关键帧具有相同的时序，并移除之前的临时关键帧。\n\n注意粘贴的关键帧似乎被**放大**了，其数值范围比复制的原始关键帧大得多。这是因为\
  \ Blender 中旋转值以弧度存储但以度数显示。当位置关键帧被复制粘贴到旋转通道时，名义值实际上乘以了 *180/π*。在我们的例子中，这种自动**放大**实际上使数值更接近所需位置。我们只需再稍微放大一点……\n\
  \n## 缩放关键帧数值\n\n你能明白为什么要复制那些关键帧吗？只要独轮车仅在 *X* 轴上移动，`Wheel` 的 **X Euler Rotation**\
  \ 就可视为 `Seat` **X Location** 的函数。这不是复杂函数，而是线性函数；独轮车前进时车轮朝一侧滚动，后退时朝另一侧滚动。这就是为什么关键帧可以直接从一个通道复制到另一个通道！\n\
  \n通过在第 **1** 到 **120** 帧间擦洗并近距离观察独轮车，检查 `Wheel` **X Euler Rotation** F-curve 的效果。它看起来像在滚动吗？有点像，但不完全是。虽然复制粘贴了正确的关键帧，但仍有一个变量未被考虑：车轮相对于独轮车位置必须旋转的程度（字面上的度数）。这个因子（字面上的因子）取决于车轮直径。如果车轮小得多，它需要旋转更多以跟上独轮车的移动；如果大很多倍，它可能不转一整圈就能过桥。\n\
  \n我们的下一个任务是乘以 `Wheel` 的 **X Euler Rotation** 数值，以考虑车轮的相对大小。我们可以通过在 Graph Editor\
  \ 的 *Y* 轴上缩放关键帧来实现：\n\n1. 选择 `Wheel` 的所有 **X Euler Rotation** 关键帧。\n2. 按 `Scale`\
  \ (`S`)，按 `Y`，输入 **3.33**，将 F-curve 在 Graph Editor *Y* 轴上放大 3.33 倍。\n\n车轮现在具有正确的旋转——至少前\
  \ 120 帧是这样：\n\n![Figure 3.36: The X Euler Rotation F-curve for Wheel](img/B17149_03_36.jpg)\n\
  \nFigure 3.36: The X Euler Rotation F-curve for Wheel\n\n\n\n\n## 总结\n\n当我们旋转时间并使其在图表上从左向右流动时，会发生有趣的事情。可以说一条线会“去”到某些地方，平坦变成静止，陡峭变成快速，F\
  \ 曲线的平滑度变成物体运动的平滑度。\n\n从一堆线图中解读动画，你是否觉得奇怪？在某种意义上，F 曲线有点像乐谱；起初，很难看出五线谱上的音符如何形成旋律，或者\
  \ F 曲线的关键帧手柄如何创造物体在空间中的运动。然而信息就在那里，经过一些练习，就能轻松“视奏”，仅通过观看图像就能在脑海中听到音乐或看到运动。完成了两章关于图表编辑器的内容后，你已经掌握了足够的知识，可以随心所欲地弯曲这些线条，并用你自己的作品进行创作。\n\
  \n在使用 `Bezier` 关键帧的过程中，我们还研究了一个事物的位置或旋转如何受另一个事物影响的方式，例如座椅的旋转如何取决于其水平加速度，或者车轮的旋转如何取决于座椅的水平移动。不过，想想如果车轮没有被约束在座椅上，动画制作会难多少；我们得把关键帧复制到不止一个通道！正如我们在下一章将看到的，对象之间的这些关系可以由不仅仅是精心设计的\
  \ F 曲线来决定。\n\n## 问题\n\n1. `Bezier` 在何种意义上是一种插值模式？\n2. `Bezier` 关键帧具有什么属性来代替缓动类型？\n\
  3. `Bezier` 手柄对 F 曲线有什么作用？\n4. 何时使用 `Vector` 手柄会很有用？\n5. 为什么不能让 F 曲线形成循环？如果形成了会发生什么？\n\
  6. `Free` 手柄是自己自由移动，还是由用户自由移动？这是谁的自由定义？你自由吗？\n7. 填空：*slope* 之于 *velocity*，如 *bend*\
  \ 之于 \\_\\_\\_\\_\\_。\n8. x 截距、峰值和拐点有什么区别？它们有何相似之处？\n9. 在上一节中，我们在图表编辑器的 `Y` 轴上将\
  \ `Wheel` 的 `X Euler Rotation` F 曲线缩放了 `3.33` 倍。这个数字从何而来？提示：搜索它的倒数。\n10. 如果我们在图表编辑器的\
  \ `X` 轴上缩放 F 曲线，动画会发生什么变化？\n"
- '# 第 4 章：探究对象关系


  我们很容易忽视宇宙中事物之间是如何相互关联的。地球围绕太阳永恒运转，被引力向内吸引。地球自身的引力将你拉向中心，而坚实的地面托住你，使你的运动被限制在行星表面，随着它在宇宙中旋转。磁铁通过相互吸引和排斥来关联。你走动时裤子留在腿上。


  在 3D 动画的世界里，我们不能把这种关系视为理所当然。如果我们不自己完成大自然的工作，空间中的物体就不会相互作用，事物会分崩离析并穿过固体物质，角色的裤子会在腿走开后仍停留在空间中的固定点（这种情况发生的频率比你想象的要高得多）。


  在本章中，我们将暂时搁置迄今为止所学的大部分关于直接使用关键帧为对象制作动画的知识。相反，我们将学习使用各种对象关系来间接为对象制作动画——这些设置控制一个对象的属性如何由另一个对象决定。这与其说是一堂动画课，不如说是一堂关于如何构建场景以便有效地为其中的对象制作动画的课。


  以下练习将指导你如何为沿轨道行驶的、具有多个移动部件的玩具火车制作动画。在设置好对象之间的关系后，你只需要一条 F 曲线就能为整个火车制作动画！


  在本章中，你将学习如何执行以下操作：


  - 移动对象的原点

  - 将对象附加到其他对象

  - 复制对象的旋转

  - 沿精确路径为对象制作动画

  - 使用驱动器控制旋转


  ## 技术要求


  本章练习的玩具火车场景可在此处下载：


  https://github.com/PacktPublishing/Realizing-3D-Animation-in-Blender


  在 Blender 中打开下载的 `.blend` 文件并开始：


  ![图 4.1：玩具火车场景](img/B17149_04_1.jpg)


  图 4.1：玩具火车场景


  与上一章中可以直接制作动画的独轮车不同，组成玩具火车部件的对象之间没有任何关系。火车的任何部分都不跟随其他对象……目前还没有。这正是本练习的全部内容！


  ## 理解对象原点


  这里有个建议——如果你想拥有一段健康的关系，首先得完善自己。关系需要大量的投入，所以在我们为对象分配关系之前，需要确保它们已准备就绪。如果一个对象存在未解决的问题，最好现在就修复，以免它们成为另一个对象的问题。


  我们的玩具火车部件有一个共同的小问题。选择火车的任意部件对象，看看能否找到它的 `origin`：


  ![图 4.2：场景中心的车轮对象原点](img/B17149_04_2.jpg)


  图 4.2：场景中心的车轮对象原点


  Blender 中的每个对象似乎都有一个 `origin`，它是空间中的一个点，当对象被选中时，在 3D 视口中显示为一个小橙点。它通常被认为是对象的“中心”，尽管它不一定非要位于任何东西的中心。


  在我们的例子中，似乎每个火车部件的 `origin` 都位于场景的全局中心。对象原点为什么重要？看看如果我们尝试旋转任意一个车轮会发生什么：


  ![图 4.3：使用未居中原点旋转车轮](img/B17149_04_3.jpg)


  图 4.3：使用未居中原点旋转车轮


  真是离谱！想象一下试图为这种东西制作动画。`origin` 决定了网格几何体旋转和缩放的空间点。如果我们任何一个车轮的 `origin` 偏离了其旋转中心应有的位置，它就无法正常旋转。在这种情况下，车轮的
  `origin` 偏离太远，以至于车轮甚至不旋转——它们在公转！


  我保证我不是恶意制造这个问题；这是一个常见问题，当你从其他格式导入 3D 模型到 Blender，或将单个网格的部件分离为多个对象时可能会遇到。几何体似乎位于所有正确的位置，但原点却都在别处的同一个位置。


  为了解决这个问题，我们只需移动原点，对吧？


  ### 关于对象和原点的真相





  ### 起源与物体


  所以你想“移动原点”，是吗？但不移动物体？如果原点的位置可以不同于物体的位置，那么物体的位置究竟是什么？让我们看看其中一个轮子的位置：


  ![图 4.4：其中一个轮子物体的位置](img/B17149_04_4.jpg)


  图 4.4：其中一个轮子物体的位置


  这不对劲，对吧？`[0.0, 0.0, 0.0]` 是场景的全局中心，也就是原点所在的位置。那么物体在哪里？物体和原点到底有什么区别？我们一直在给物体做动画，但你真的确定知道什么是物体吗？


  准备好面对真相了吗？再看看那个橙色的点。**那才是物体。**


  ![图 4.5：物体](img/B17149_04_5.jpg)


  图 4.5：物体


  原点和物体本质上是同一回事。Blender 中的物体仅仅是空间中的一个点，带有一个名称和基本属性，如位置、旋转和缩放。这些点是在大多数物体关系中唯一被考虑的事物。我们从
  *第 1 章* 起就一直在移动原点！


  每当我们提到所谓的原点时，我们专门指的就是那个点，别无其他。附着在该点上的其他一切都是物体的数据。对于像我们的轮子和车厢这样的网格类物体，这意味着网格几何体（即在
  `编辑模式` 中暴露给你的所有顶点、边和面）。


  **提示**


  `空物体` 是 Blender 中一种特殊的物体类型，它没有数据。就像删除了所有顶点的网格物体一样，它本质上只是一个原点。“空物体”可以像其他任何物体一样用于关系中，但永远不会被渲染。你可以通过
  `添加` | `空物体` 来添加一个。


  因此，你无法将原点与物体分开移动，因为术语 *物体* 和 *原点* 之间没有任何有意义的区别。这个任务是空的。无意义的。甚至比不可能还要不可能。


  然而，**相对于其几何体反向移动物体**，则完全没有问题。


  ## 将原点居中


  Blender 提供了一些操作和设置，将原点视为与物体不同的东西，可以“单独”移动。这对我们很方便，但它掩盖了一个更复杂的操作，即两样东西同时移动——物体向一个方向移动，网格几何体向相反方向移动。


  让我们回到那些轮子。有 12 个轮子，但只有 6 个轮子物体。每一个都是一对具有左右对称性的轮子。如果这六对轮子中的每一对都要围绕六根假想的车轴正确旋转，我们必须（某种程度上）“将原点移动”到旋转中心应在的位置。


  这可以通过单个操作符完成：


  1.  选中所有六个轮子物体。

  2.  点击 `物体` | `设置原点` | `原点到几何体`。


  ![图 4.6：轮子物体的六个居中原点](img/B17149_04_6.jpg)


  图 4.6：轮子物体的六个居中原点


  现在每个轮子物体都在正确的位置，与其几何体完美居中。所有轮子现在都可以在 `X` 轴上正确旋转。


  **提示**


  计算网格中心时，操作符 `原点到质量中心（表面）` 和 `原点到质量中心（体积）` 有时能在复杂模型上产生更理想的结果。在我们的例子中，对于几何体简单的轮子，这没有任何区别。


  看起来我们是将“原点移动”到了每对轮子的中心，但我们其实并没有！相反，对于每对轮子，计算了网格几何体的全局中心，物体本身被移动到了该点，而其网格几何体被向反方向移动。就好比我们在
  `物体模式` 下移动了物体，然后进入 `编辑模式`，全选所有内容，再把它移回去。


  这种效果看起来就像只有原点移动了。然而，我们懂得更多！


  **提示**


  除了下一节的技术，你还可以通过将 3D 游标移动到所需位置，然后使用 `物体` | `设置原点` | `原点到 3D 游标`，将原点重新定位到任何地方。


  ## 抓取原点


  Blender 界面中某些操作和设置的标签暗示 Blender 真的希望我们相信物体拥有一个可以单独移动的原点。虽然我们懂得更多，但我们将继续纵容开发者的幻想，让他们以为骗过了我们。当然，让我们再“移动”一些“原点”。


  让我们把注意力转向火车的三个主要组件，稍后我们将它们约束到轨道上——前部的 `Engine` 物体、中间的 `Car` 和后部的 `Caboose`。与轮子不同，它们的原点不必完全位于其几何体的中心；事实上，如果我们保持它们在地面上并精确间隔
  **3** 米，会让事情对我们更容易。使用 `设置原点` 操作符之一来居中原点只会使事情复杂化，因为每节车厢的几何体都不同。


  `Car` 物体已经完全位于它需要的位置。我们只需要移动 `Engine` 和 `Caboose`，使它们的原点以相同的方式位于各自网格的下方。要做到这一点，只需在像往常一样抓取物体之前启用一个设置：


  1.  在 3D 视口的页眉中，转到 `选项` | `变换` | `仅影响` 并启用 `原点`。


  ![图 4.7：3D 视口中启用了“仅影响 | 原点”](img/B17149_04_7.jpg)


  图 4.7：3D 视口中启用了“仅影响 | 原点”


  1.  选中物体 `Engine`。

  2.  使用 `移动` (`G`)，按 `Y`，将原点在 `Y` 轴上向前移动 **\-3** 个单位，使其位于火车头网格下方。

  3.  选中物体 `Caboose`。

  4.  使用 `移动` (`G`)，按 `Y`，将原点向后移动 **3** 个单位，使其位于守车网格下方。

  5.  完成后，记得禁用 `选项` | `变换` | `仅影响` | `原点`。


  这三个物体现在均匀地间隔 3 个单位：


  ![图 4.8：三节火车车厢的原点](img/B17149_04_8.jpg)


  图 4.8：三节火车车厢的原点


  请记住，我们并没有真正以你可能被誤导的方式“仅移动原点”。我们刚才所做的就是像往常一样移动物体，只是这一次，当我们这样做时，那些火车车厢的网格也被向相反方向移动了。这就像在跑步机上走路——你相对于传送带向前移动，但在全局位置保持不动。当启用
  `仅影响` | `原点` 时，我们的变换操作同时影响物体和网格数据。我们根本没有“仅影响”一样东西；我们影响的比平时更多！


  我们已经修正了所有物体原点——或者更准确地说，我们修正了物体的位置及其各自网格的相对偏移。接下来，我们将探索一种方法——在某种意义上——让一个物体成为另一个物体的原点。


  ## 父子关系物体


  如果说术语 *原点* 指的是物体相对于其自身数据的位置，那么在本节中，我们将学习两个不同物体之间最基本的关系——`父级` 和 `子级` 的关系。


  在 Blender 中，父子关系是指将一个或多个物体“附加”到另一个物体上，从而允许父级物体及其所有子级作为一个整体被移动和制作动画。


  可以使用 `设置父级到` 菜单 (`Ctrl` + `P`) 将物体设为其他物体的父级：


  ![图 4.9：设置父级到菜单](img/B17149_04_9.jpg)


  图 4.9：设置父级到菜单


  **重要提示**





  在执行 `Set Parent To` (`Ctrl+P`) 之前，你需要选中多个物体——至少一个作为子物体，一个作为父物体。活动物体（即你最后选择的那个物体）将成为父物体。为避免搞混父子关系，请记住：你想设为父物体的那个物体必须最后被选中。


  这非常适合将车轮连接到车厢上：


  1.  同时选中 `Wheels A` 和 `Wheels B`。

  2.  按住 `Shift` 并选中 `Engine`（最后选中 `Engine` 可确保它是活动物体）。

  3.  使用 `Set Parent To` (`Ctrl+P`) | `Object`。


  我们已经将车轮设为火车头的子物体了！让我们对另外两节车厢的车轮重复此方法：


  1.  将 `Wheels C` 和 `Wheels D` 设为 `Car` 的子物体。

  2.  将 `Wheels E` 和 `Wheels F` 设为 `Caboose` 的子物体。


  如果你抓取 (`G`) 任意一节车厢，你会看到它的车轮现在已经连接上了。你还会在 3D 视口中看到一些细细的虚线，连接着子物体的原点和父物体的原点：


  ![Figure 4.10: Wheels parented to the train car](img/B17149_04_10.jpg)


  Figure 4.10: 车轮已设为车厢的子物体


  **Tip**


  你可以抓取 (`G`)、旋转 (`R`) 或缩放 (`S`) 物体来测试它们的关系。别害羞——把东西拿起来晃晃看看什么连在一起了！你随时可以右键点击取消操作。


  现在每节车厢物体都是两个车轮物体的“骄傲父母”了。想象一下这能为我们节省多少时间，现在我们可以移动车厢而无需担心车轮的位置！


  ## 父/子关系


  Blender 中的任何物体都可以是父物体或子物体。一个物体可以拥有无限数量的子物体，但不能拥有超过一个父物体。


  你可以通过在大纲视图中检查物体来查看其所有子物体。子物体显示为父物体“文件夹”中的“文件”：


  ![Figure 4.11: Parent and child objects in the Outliner](img/B17149_04_11.jpg)


  Figure 4.11: 大纲视图中的父子物体


  同样，你也可以在 `Object Properties`（物体属性）中的 `Relations`（关系）面板里查看某物体的父物体是谁：


  ![Figure 4.12: The Relations panel of one of the wheel objects](img/B17149_04_12.jpg)


  Figure 4.12: 其中一个车轮物体的 Relations 面板


  **Important note**


  你可以通过编辑 `Relations` 面板中的 `Parent` 字段来为物体选择不同的父物体，但这不一定能产生与使用 `Set Parent To` (`Ctrl+P`)
  | `Object` 操作符相同的结果，后者会自动执行额外的变换偏移以保持子物体的全局位置不变。


  父子关系是一个应用极广的功能，比如当你需要把一个东西“粘”到另一个东西上时（它真的非常有用）。在许多情况下，其实际效果等同于选中多个网格物体并使用 `Join`
  (`Ctrl+J`) 将所有东西融合成一个单一网格。


  但请思考一下我们为什么没对车轮物体那样做。即使设置了父子关系，每个车轮仍然是一个独立的物体，依然可以制作动画。为这些车轮物体准备动画将是我们下一主要章节“约束”的任务。


  ### 依赖关系


  Blender 中的父/子关系是一种 **dependency**（依赖关系）；子物体的全局位置取决于其父物体的位置。这些关系可以是 *nested*（嵌套的），即一个物体的子物体本身又可以是其他物体的父物体。然而，这是一种严格的单向关系。父物体影响子物体，但子物体的任何操作都无法影响父物体。从某种意义上说，父物体甚至“不知道”自己有子物体。


  这里是我们目前创建的关系的简单可视化，灰色箭头从每个子物体指向其依赖的父物体：


  ![Figure 4.13: A visualization of the current parent/child dependencies](img/B17149_04_13.jpg)


  Figure 4.13: 当前父/子依赖关系的可视化


  随着我们继续创建依赖关系，这个图表将变得越来越复杂……


  现在，让我们继续学习约束。


  ## 理解约束


  我们的玩具火车有 12 个车轮，我们希望它们随着火车沿轨道移动而旋转。因为它们都属于同一列火车、同一组轨道，这些车轮可能会同步旋转。火车一侧的每个车轮都与另一侧对应的车轮连接，总共六个车轮物体。这比
  12 个要好，但对我们来说制作动画仍然很多。使用 `constraints`（约束）会让我们的任务轻松得多。


  约束是一种物体关系，类似于父子关系，但更高级。一个物体可以拥有多个约束，即使它已经有父物体了。有多种约束类型可供选择：


  ![Figure 4.14: The Add Object Constraint menu](img/B17149_04_14.jpg)


  Figure 4.14: Add Object Constraint（添加物体约束）菜单


  在本节中，通过使用 `Copy Rotation`（复制旋转）约束，我们可以让五个车轮物体复制其中一个的旋转——这比为所有六个车轮设置关键帧（或驱动器）要容易得多。


  ## 添加约束


  我们将首先给后面的车轮添加 `Copy Rotation` 约束，以前面的车轮组作为 `Target`（目标）：


  1.  选中 `Wheels F`。

  2.  在 `Properties Editor`（属性编辑器）中，前往 `Object Constraint Properties`（物体约束属性）选项卡。

  3.  点击 `Add Object Constraint` 并选择 `Copy Rotation`。

  4.  在新建的 `Copy Rotation` 约束的设置中，选择物体 `Wheels A` 作为 `Target`。


  `Wheels F` 现在将复制 `Target` `Wheels A` 的旋转。当 `Wheels A` 旋转时，`Wheels F` 会做同样的动作。


  **Important note**


  每个约束都“归属于”它直接影响的那个物体。大多数约束需要第二个物体作为 `Target`。这是另一种依赖关系，类似于父/子关系。约束影响的是拥有者，而非目标。


  在将此约束复制到除目标以外的所有其他车轮之前，我们需要确保其所有设置都正确。


  ## 世界空间 与 局部空间


  如果我们只想让车轮绕 `X` 轴旋转，当前的约束设置似乎能给我们想要的结果。然而，我们的相互关联的物体系统还需要沿轨道行驶，所以需求更复杂。


  例如，如果我们绕 `Z` 轴旋转火车头，可以预览火车转弯时会发生什么：


  ![Figure 4.15: Wheels F “breaking” when Engine is rotated](img/B17149_04_15.jpg)


  Figure 4.15: 旋转 Engine 导致 Wheels F “断裂”


  `Copy Rotation` 约束似乎让 `Wheels F` 过于忠实地复制了 `Wheels A` 的旋转，导致 `Wheels F` 脱离了它假想的车轴。之所以发生这种情况，是因为约束在
  `World Space`（世界空间）中评估目标和拥有者的旋转，即你 3D 场景的绝对全局坐标空间。从某种意义上说，约束并不“在乎”任一物体是否有父物体；它读取目标的全局旋转并用它来覆盖拥有者的全局旋转。


  一种更合理的方法是在 `Local Space`（局部空间）中评估这两个物体：


  1.  在 `Wheels F` 的 `Copy Rotation` 约束属性面板中，找到 `Target` 和 `Owner` 的评估空间属性。

  2.  将 `Target` 和 `Owner` 都从 `World Space` 改为 `Local Space`。


  约束的最终设置应如下所示：


  ![Figure 4.16: The correct settings for the Copy Rotation constraint](img/B17149_04_16.jpg)


  Figure 4.16: Copy Rotation 约束的正确设置


  现在车轮工作正常了。一个车轮仍然复制另一个的旋转，但不会“断裂”。这是怎么回事呢？





  ## 跟随路径


  ## 世界空间与局部空间


  想象一下，你正坐在一辆行驶中的火车上。从某种意义上说，你被“父级绑定”到了这节车厢上。在`World Space`（世界空间）中，你的移动速度与车厢完全一致，随车厢转弯，从车站移动到车站。然而在`Local
  Space`（局部空间）中，你却坐得纹丝不动，面朝前方，原地不动。如果你站起来在车厢里走动，你在`Local Space`中将以步行速度移动，同时在`World
  Space`中仍大致保持火车的速度。


  我们玩具火车的车轮也是以同样的方式作为“乘客”存在的；它们的旋转可以在`World Space`这个绝对域中评估，也可以在它们各自的`Local Space`这个相对域中评估。通过在`Local
  Space`中评估`Wheels A`（车轮 A）`Target`（目标）对象的旋转，约束将只读取其相对于其父对象 `Engine`（车头）的相对旋转。然后，该旋转会应用到所有者
  `Wheels F`（车轮 F）的局部空间中，相对于其自己的父对象 `Caboose`（车尾）。


  > **重要提示**

  >

  > 对象将始终拥有自己的变换属性，但如果它有父级或约束，这些属性可能不再直接关联到对象在`World Space`中的位置。它们可能仅对最终结果有贡献，甚至可能完全不再产生任何影响。因此，这些属性的值通常被称为*名义*变换值（“仅挂个名而已”).


  现在此约束已具备所有正确设置，可将其复制到剩余的四个车轮对象上。


  ## 复制约束


  既然已经为 `Wheels F` 完善了 `Copy Rotation`（复制旋转）约束的设置，我们希望 `Wheels E`、`Wheels D`、`Wheels
  C` 和 `Wheels B` 各自拥有完全相同的 `Copy Rotation` 约束。


  与其再四次添加并调整相同的约束，Blender 提供了一个操作符，可快速将约束从一个对象复制到另一个对象：


  1.  选择 `Wheels B`、`Wheels C`、`Wheels D` 和 `Wheels E`。

  2.  按住 `Shift` 并选择 `Wheels F`。

  3.  使用 `Object`（对象） | `Constraints`（约束） | `Copy Constraints to Selected Objects`（复制约束到选中对象）。


  这会将活动对象拥有的约束复制到所有其他选中的对象上。现在所有五个车轮对象都拥有相同的约束，只需旋转剩余的前一对车轮 `Wheels A` 即可旋转所有车轮。


  > **技巧**

  >

  > 那些连接所有对象到其父级和约束目标的虚线可能会分散注意力，有时甚至具有误导性。可以考虑在 `Viewport`（视口） `Overlays`（重叠显示）菜单中禁用
  `Relationship Lines`（关系线）来隐藏它们。


  这是我们迄今为止建立关系的更新可视化图。细灰线代表约束，它们具有与父子关系相同的单向依赖性：


  ![Figure 4.17: The dependency chart with lines for constraints](img/B17149_04_17.jpg)


  Figure 4.17: 带有约束线的依赖关系图


  我们已经完成了将车轮父级绑定到车厢并赋予它们适当约束的工作。这列火车已准备好驶上轨道！


  ## 编辑动画路径


  如果任何一节车厢在移动时哪怕稍微偏离轨道，我们的动画看起来都会很糟糕。若要使用前几章学到的方法为火车制作动画，我们必须同时调整每节车厢所有六条位置和旋转 F 曲线，以便在轨道弯曲时让车轮始终保持在铁轨上。


  让我们为即将面临的、无疑是迄今为止最繁琐、最令人沮丧的任务做好准备，并添加第一批 `Location & Rotation`（位置与旋转）关键帧：


  1.  其实，咱们别这么干。

  2.  不要插入位置或旋转关键帧。

  3.  那太荒谬了。


  你能想象那有多难吗？上一章给独轮车做动画已经够麻烦了，那东西只用转一次弯。`Follow Path`（跟随路径）约束是沿路径精确制作对象动画的更好方式，尤其是当路径在空间中沿多个轴弯曲扭转时。


  本节将使用的路径与上一章使用的 `Motion Path`（运动路径）功能截然不同，后者仅是一个视觉指南。这种路径不仅可以直接编辑，而且已经存在于你的场景中。


  检查对象 `Track`（轨道），你会发现它不是网格对象。它是一个 `curve`（曲线）对象，这是一种在建模和动画中都很有用的多功能对象类型。这条特定的曲线被设置为沿其长度挤出
  `Rail Profile`（铁轨轮廓）的形状，从而创建出两条平行铁轨。它也是修改器的目标，这些修改器复制并弯曲对象 `Ties`（枕木），从而创建出横跨铁轨的木制枕木。巧妙的是，这同一个决定火车轨道路径的曲线对象，同样可以决定被约束到它身上的对象的路径。


  更棒的是——这种特定类型的曲线是贝塞尔样条线，而你已经知道如何编辑贝塞尔样条线。该曲线对象的控制点与 F 曲线中的贝塞尔关键帧完全相同。这就像在编辑一个三维的
  F 曲线！


  ![Figure 4.18: Rails in Edit Mode](img/B17149_04_18.jpg)


  Figure 4.18: 编辑模式下的铁轨


  在对象被约束到路径后再编辑动画路径会更困难，所以我们要趁此机会个性化铁路，让火车的路径比现在的简单椭圆更有趣些。


  除了用于选择和变换的标准控制和操作符外，还有几个其他的你应该了解，以便编辑 3D 贝塞尔曲线：


  *   `Segments`（段） | `Subdivide`（细分）在两个或多个选中的相邻控制点之间插入控制点。

  *   `Tilt`（倾斜）（`Ctrl` + `T`）在选中的控制点处扭曲曲线，允许你在路径中加入倾斜转弯和螺旋线。

  *   `Toggle Cyclic`（切换循环）（`Alt` + `C`）移除连接首尾控制点的线段，如果你想要一条不循环的路径。

  *   `Set Handle Type`（设置手柄类型）（`V`）设置手柄类型，与贝塞尔关键帧完全一样！


  让我们试用一下这些控制：


  1.  选择对象 `Track` 并进入 `Edit Mode`（编辑模式）。

  2.  沿任意轴按你的喜好编辑路径。

  3.  仅使用 `Automatic`（自动）和 `Aligned`（对齐）贝塞尔手柄类型，并确保没有过于急促的转弯，以免火车车厢难以通过。火车无论路径如何都会跟随，但我们希望它看起来可信！


  > **重要提示**

  >

  > 你可以在 `Edit Mode` 中将曲线对象 Rails 弯曲成几乎任何你喜欢的形状，但请避免在 `Object Mode`（对象模式）下变换对象本身。这可能会使给车厢添加约束变得更加困难。


  我决定大胆发挥，为自己的轨道创建了一种过山车般的效果：


  ![Figure 4.19: An example of an edited Rails object](img/B17149_04_19.jpg)


  Figure 4.19: 编辑后的 Rails 对象示例


  一旦你对铁路感到满意，就可以退出 `Edit Mode`。是时候把火车放上轨道了！


  ## 添加跟随路径约束


  `Follow Path`（跟随路径）约束是少数几个不仅评估目标对象变换的约束之一。目标必须是曲线类型对象，其数据（即我们刚编辑的样条线）将被评估，从而使约束所有者实际上被父级绑定到样条线上的某个点。


  有趣的是，我们不需要手动移动任何车厢到轨道上。添加 `Follow Path` 约束时，它会为我们完成大部分工作：


  1.  选择任意一节车厢对象 `Engine`（车头）、`Car`（车厢）或 `Caboose`（车尾）。

  2.  前往 `Object Constraint Properties`（对象约束属性）并添加 `Follow Path` 约束。

  3.  在新约束的属性中，将 `Target`（目标）改为 `Track`，将 `Forward Axis`（前向轴）改为 `-Y`，并启用 `Follow Curve`（跟随曲线）。

  4.  将约束复制到剩余的车厢对象上。


  > **重要提示**

  >

  > `Animate Path`（动画化路径）按钮听起来很有用，其实没那么有用。别按它。





  所有三节车厢都应该有一个如下所示的约束：


  ![Figure 4.20: The Follow Path constraint settings](img/B17149_04_20.jpg)


  Figure 4.20: The Follow Path constraint settings


  与此同时，车厢本身*几乎*都在轨道上。


  ### 修正路径偏移


  如果你在添加约束后，车厢恰好被放置在轨道的弯曲部分，实际上只有其中一节 `Car` 会在轨道上。其他两节车厢似乎只是从中间那节伸出来，就好像整个东西是一节笔直的车厢：


  ![Figure 4.21: Train cars displaced from rails](img/B17149_04_21.jpg)


  Figure 4.21: Train cars displaced from rails


  在目前的困境下，这列火车无法正确地绕过轨道弯曲。为什么会发生这种情况，我们该如何修复？


  考虑一下当你添加第一个 `Follow Path` 约束时发生了什么。车厢似乎自动吸附到了 `Track` 样条线上的某个点。目前，这个不可见的点位于路径的起始位置（如果曲线是循环的，这个位置多少有点任意）。这个点在曲线上的位置可以制作动画（稍后会制作），而
  `Follow Path` 约束的拥有者实际上会被父级设定到该点。被约束物体相对于曲线上该点的偏移量，等于约束拥有者与目标曲线物体之间的变换差异，是在约束效果生效前计算的。


  现在考虑一下车厢在被约束之前的位置。`Engine`、`Car` 和 `Caboose` 的名义位置分别为 `[0, -3, 0]`、`[0, 0, 0]` 和
  `[0, 3, 0]`。曲线物体 `Track` 的原点位于 `[0, 0, 0]`。因此，只有 `Car` 的原点会被正确地约束在曲线上，而其他两节车厢在局部
  `Y` 轴上“伸出”了 3 个单位，一节向前，一节向后。


  我们的解决方案是将那两节车厢的位置数值“重置”，并改用它们 `Follow Path` 约束的偏移值来调整其在曲线上的相对位置：


  1. 选择物体 `Engine`。

  2. 使用 `Object`（物体） | `Clear`（清除） | `Location`（位置）（`Alt` + `G`）将物体的名义位置重置为 `[0, 0,
  0]`。

  3. 调整 `Follow Path` 约束的 `Offset`（偏移）值，使 `Engine` 再次以适当的距离与 `Car` 连接。具体数值将取决于你编辑的路径总长度。

  4. 对 `Caboose` 重复*步骤 2* 和 *3*。正确的 `Offset` 值极有可能是 `Engine` 那个值的精确反数。


  现在每节车厢的原点都精确地位于曲线上：


  ![Figure 4.22: Correctly offset train cars](img/B17149_04_22.jpg)


  Figure 4.22: Correctly offset train cars


  现在可以用单个属性为车厢沿轨道的位置制作动画了。不过，该属性可能不在你预期的位置……


  ## 为路径制作动画


  你可能猜到我们会为物体 `Engine` 制作动画，并约束其他两节车厢跟在后面，就像现实生活中的火车一样。完全不是那么回事。相反，三节车厢现在共享同一个约束目标
  `Track`。我们将通过为目标数据的单个属性制作动画，来为整列火车制作动画。


  **重要提示**


  上一句中的术语 `data`（数据）至关重要。物体及其数据是两个不同的数据块，拥有各自的属性，分别位于属性编辑器的不同选项卡中。物体 `Track` 是一个名为
  `Track` 的曲线数据的用户。这些名称是任意的，不必匹配。


  选中曲线物体 `Track` 后，我们要找的属性位于属性编辑器中 `Object Data Properties`（物体数据属性）选项卡的 `Path Animation`（路径动画）面板里：


  ![Figure 4.23: The Path Animation panel](img/B17149_04_23.jpg)


  Figure 4.23: The Path Animation panel


  这些属性与任何使用该曲线作为目标的 `Follow Path` 约束协同工作。`Frames`（帧数）属性定义了受约束物体遍历曲线总长度所需的“帧”数。这里的“帧”加引号是因为，在此语境下，“帧”指的是
  `Evaluation Time`（求值时间）属性的任意单位，我们可以以任何喜欢的速率为其制作动画。


  事实上，这些属性与帧或时间没有必然联系。`Evaluation Time` 是分子，`Frames` 是分母，相除的结果等于受约束物体在路径总长度上的相对位置。如果我们将
  `Frames` 的值保留为 `100`，我们可以把 `Evaluation Time` 看作百分比！


  ### 为 Evaluation Time 插入关键帧


  这些 `Path Animation` 属性的功能是人为设计的，且标签标注不当。甚至工具提示文本似乎都在撒谱。这就是开源项目令人愉快的怪癖所在。


  让我们开怀大笑一下，然后插入最初的两个关键帧：


  1. 选择物体 `Track`，在属性编辑器的 `Object Data Properties`（物体数据属性）选项卡中找到 `Path Animation`（路径动画）面板。

  2. 转到第 `0` 帧（是的，第 `0` 帧）并为 `Evaluation Time` 插入关键帧。

  3. 转到第 `250` 帧（结束帧），将 `Evaluation Time` 改为 `100`，并插入另一个关键帧。


  现在你可以观看火车沿轨道总长度移动了！


  ### 优化火车速度


  取决于你的轨道长度，你可能会发现默认的 250 帧动画时长不足以让火车以不过快的速度覆盖轨道长度，又或许 250 帧太长了，导致火车移动太慢。


  如果你对火车速度和动画时长感到满意，可以跳过此步骤。否则，让我们调整一些设置以获得我们想要的大致速度：


  1. 使用 `Linear`（线性）插值或 `Vector`（矢量）贝塞尔柄，使 `Evaluation Time` F 曲线变为线性。这让我们能以火车的平均速度观看其经过。

  2. 抓取（`G`）第二个 `Evaluation Time` 关键帧并将其移动到新帧，赋予火车不同的速度。

  3. 调整 `End Frame`（结束帧）的值，使动画在你刚移动的第二个关键帧所在的帧结束。

  4. 重复*步骤 2* 和 *3*，直到你对火车的平均速度感到满意。


  一旦确定了动画的最佳时长且火车以适当的平均速度移动，根据其遵循的路径形状插入更多关键帧来改变速度就会更容易。


  ### 峰值处的拐点


  如果你的轨道有起伏，你可能希望改变 `Evaluation Time` F 曲线以相应地改变火车速度。我们希望火车下坡时加速，上坡时减速。这意味着每次上下坡方向的变化（即山峰或山谷）都应伴随
  F 曲线上的一个拐点。


  使用带有 `Aligned`（对齐）贝塞尔柄的关键帧，我们可以创建自己的拐点，使 F 曲线在路径峰值处变平：


  ![Figure 4.24: A keyframe at a high point in the example path](img/B17149_04_24.jpg)


  Figure 4.24: A keyframe at a high point in the example path


  并使其在山谷处变快：


  ![Figure 4.25: A keyframe at a low point in the example path](img/B17149_04_25.jpg)


  Figure 4.25: A keyframe at a low point in the example path


  现在轮到你了：


  1. 在 `Graph Editor`（图表编辑器）中擦洗浏览你的动画。

  2. 找到火车位于轨道峰值或谷值的每一帧，通过在 `Evaluation Time` F 曲线上插入关键帧来标记它。

  3. 将所有关键帧转换为 `Aligned`（对齐）贝塞尔关键帧。

  4. 旋转（`R`）关键帧以配合路径形状，使其在峰值处变平、在谷值处更垂直。





  5. 继续调整关键帧的旋转和时间，直到你对结果满意。尽量让动画中至少有一小段火车移动得非常缓慢。


  看看我们仅用一条 `F-curve` 就创造了多少运动！这个动画快完成了。剩下的就是让车轮转动起来！


  ## 驱动器


  因为我们给六个车轮对象中的五个添加了约束，所以我们只需要关注火车头部剩下的那一对车轮 `Wheels A`。无论这个车轮如何旋转，它后面的其他车轮也会跟着如此旋转。


  那么该如何让它旋转呢？`Wheels A` 的 `X Euler Rotation`（X 欧拉旋转）值应该是 `Track` 的 `Evaluation Time`（求值时间）属性的一个简单乘法函数。这应该会让你想起上一章中的独轮车车轮。然而这一次，我们不需要复制粘贴任何关键帧。那样做只是暗示了两个属性之间的关系。通过使用
  `driver`（驱动器），我们可以将这种关系编码化，使其自动生效。


  驱动器与其说是对象关系，不如说是一个属性与一个或多个其他属性之间的关系。我们将在 `Wheels A` 的 `X Euler Rotation` 属性上使用驱动器，并将
  `Track` 的 `Evaluation Time` 属性作为驱动它的输入变量。


  ## 添加驱动器


  任何可添加关键帧的属性都可以被驱动，给属性添加驱动器很简单：


  1. 选择对象 `Wheels A` 并找到其 `Transform`（变换）属性。


  2. 右键点击 `X Rotation`（X 旋转）属性，从上下文菜单中选择 `Add Driver`（添加驱动器）（`Ctrl` + `D`）。


  被驱动的属性会以紫色高亮显示：


  ![Figure 4.26: The driven X Euler Rotation property](img/B17149_04_26.jpg)


  图 4.26：被驱动的 X 欧拉旋转属性


  与关键帧属性一样，驱动器“接管”了 `Wheels A` 的 `X Euler Rotation` 属性。该属性的值不再能被直接编辑，甚至连临时编辑都不行！


  重要提示


  已添加关键帧的属性不能被驱动，被驱动的属性不能添加关键帧。


  该属性现在已被驱动。很好。但由什么驱动呢？回答这个问题意味着要解开添加驱动器时同时弹出的那个谜题盒子的谜题。


  ## 编辑驱动器


  添加新驱动器时会出现 `Edit Driver`（编辑驱动器）区域，一旦移开鼠标光标就会消失。随时可以通过右键点击被驱动属性并从上下文菜单中选择 `Edit Driver`
  来将其调回。


  这些驱动器设置决定了将影响驱动器值的变量以及它们如何被求值：


  ![Figure 4.27: The Edit Driver region](img/B17149_04_27.jpg)


  图 4.27：编辑驱动器区域


  如果你看到这里有错误消息，意味着你犯错了。开玩笑的！驱动器刚添加时是不工作的。让驱动器工作起来比添加它要棘手一些。


  ### 驱动器类型


  驱动器中的每个变量都是一个数值。因为驱动器可以使用多个变量，所以有几种方法来求值这些不同的值并返回一个单一数字来决定驱动器值：


  ![Figure 4.28: Driver types](img/B17149_04_28.jpg)


  图 4.28：驱动器类型


  默认驱动器类型是 `Scripted Expression`（脚本表达式），这是最强大的方法。此类型提供一个 `Expression`（表达式）字段，你可以在其中输入使用多个输入变量的
  Python 表达式来计算驱动器值。不过对于这个特定的驱动器，我们只需要一个输入变量，且不需要在表达式中使用它。


  让我们使用一种更简单的驱动器类型：


  1. 调出 `Wheels A` 的 `X Euler Rotation` 驱动器的 `Edit Driver` 区域。


  2. 将驱动器 `Type`（类型）从 `Scripted Expression` 改为 `Averaged Value`（平均值）。


  因为我们在这个驱动器中只会使用一个变量，所以无论我们使用平均值、求和、最小值还是最大值都没有区别。变量本身的 `Name`（名称）也不再重要。


  提示


  每个脚本表达式都是一小段必须反复执行的 Python 代码。这可能导致崩溃、性能问题，甚至安全漏洞，因此如果不必要，最好避免使用 `Scripted Expression`
  类型的驱动器。


  ### 驱动器变量


  现在我们稍微简化了驱动器，可以把注意力转向唯一的变量 `var`，它单独决定驱动器值。变量必须从场景中的其他东西获取其值。这可以是几乎任何东西，范围从两个对象之间的变换差异到当前文件中几乎任何数据块的数值属性。


  我们想为目标使用单个属性。可选属性很多，所以让我们缩小范围：


  1. 将输入变量 `var` 的 `Type` 从 `Transform Channel`（变换通道）改为 `Single Property`（单个属性）：


  ![Figure 4.29: The input variable types](img/B17149_04_29.jpg)


  图 4.29：输入变量类型


  1. 我们要找的属性技术上属于曲线数据块，而非对象。在 `Prop` 行，将 `ID Type` 从 `Object` 改为 `Curve`：


  ![Figure 4.30: The available ID types](img/B17149_04_30.jpg)


  图 4.30：可用的 ID 类型


  1. 现在选择我们用来制作火车动画的那条曲线！点击 `ID` 字段并选择 `Track` 曲线。


  ![Figure 4.31: The variable using the Track ID block](img/B17149_04_31.jpg)


  图 4.31：使用 Track ID 块的变量


  我们现在步入正轨（双关语）了，将使用属于曲线数据块 `Track` 的单个属性来驱动 `Wheels A` 的 `X Euler Rotation`。只剩最后一个字段需要填写——决定实际使用哪个属性的那个字段！


  ### 复制数据路径


  我们必须在驱动器输入变量的 `Path`（路径）字段中输入内容，以指定我们要使用 `Evaluation Time`，即我们在上一节中制作动画的 `Track`
  的属性。这只是一个文本字段。点击它不会给我们任何菜单。那么我们怎么知道该写什么呢？


  答案可以通过返回 `Evaluation Time` 属性来找到：


  1. 在 `Properties Editor`（属性编辑器）中找到曲线数据 `Track` 的 `Evaluation Time` 属性。


  2. 右键点击该属性并从上下文菜单中选择 `Copy Data Path`（复制数据路径）。


  3. 返回对象 `Wheels A` 的 `X Euler Rotation` 属性驱动器的 `Edit Driver` 区域。


  4. 点击输入变量 `var` 的 `Path` 字段并粘贴（`Ctrl` + `V`）复制的文本。


  字符串 `eval_time` 是 `Evaluation Time` 属性在 Blender Python API 中的标识符。完整数据路径是 `bpy.data.curves[''Track''].eval_time`。你可以把这些数据路径想象成
  Blender 内部属性的网址或 URL。


  提示


  在你的 `User Preferences`（用户偏好设置）中，进入 `Interface` | `Display` | `Tooltips` 并启用 `Python
  Tooltips`（Python 提示）。现在你可以通过将鼠标悬停在任何属性上来查看其 Python 数据路径。这对于在 Blender 中创建驱动器或任何类型的
  Python 脚本很有帮助。


  你的驱动器设置现在应该看起来像这样：


  ![Figure 4.32: The final settings for the X Euler Rotation driver](img/B17149_04_32.jpg)


  图 4.32：X 欧拉旋转驱动器的最终设置


  注意错误消息消失了。终于，我们的驱动器有了一个有效的输入变量！驱动器值现在等于目标属性，车轮将随着火车沿轨道移动而自动旋转。不过，它们的滚动速度正确吗？


  ## 驱动器 F-curve






  ## 显示驱动器 F 曲线


  可以通过在用户界面的某个区域打开 `Drivers Editor`（驱动器编辑器），或者右键点击被驱动属性并从上下文菜单中选择 `Open Drivers Editor`（打开驱动器编辑器）来找到驱动器
  F 曲线。该区域提供了场景中所有驱动器的完整概览。你也可以在右侧边栏的 `Drivers`（驱动器）选项卡中找到我们刚刚编辑的所有参数。


  这是我们的驱动器编辑器：


  ![Figure 4.33: The Drivers Editor](img/B17149_04_33.jpg)


  图 4.33：驱动器编辑器


  它看起来很像图表编辑器，不是吗？在大多数方面，它*就是*一个图表编辑器，但有一个本质区别——该图表的 `X` 轴不映射到时间。相反，这个 `X` 轴映射到驱动器的驱动值，即基于求值变量计算出的数字。图表的
  `Y` 轴映射将要传递给被驱动属性的最终值。我们驱动器的 F 曲线本身就是一种函数——它是调节目标属性 `Track` 的 `Evaluation Time`（求值时间）如何影响被驱动属性
  `Wheels A` 的 `X Euler Rotation`（X 欧拉旋转）的最后一个环节。


  > **Tip**

  >

  > `Edit Driver`（编辑驱动器）中的所有设置也可以在驱动器编辑器中找到，位于右侧边栏的 `Drivers`（驱动器）选项卡中（`N`）。


  默认的驱动器 F 曲线是一条带有线性外推的对角线，这使其成为一个 1:1 的函数，能有效地将驱动值直接传递给被驱动属性。在许多情况下，你可以忽略它。然而在我们的案例中，我们必须编辑这条
  F 曲线的斜率，以调整车轮自动旋转的速率。请记住，旋转值以弧度存储和求值，仅以度数表达/显示，因此我们的 `X Euler Rotation` 驱动器的 F 曲线看起来可能已经具有相当陡峭的斜率。你很可能还需要让它更陡峭。


  ## 编辑驱动器 F 曲线


  `Wheels A` 的 `X Euler Rotation` 驱动器 F 曲线的斜率将取决于 `Track` 的总长度。我无法告诉你你自己的铁路长度，所以这一次你必须通过试错来找出最适合你的驱动器
  F 曲线的斜率：


  1.  找到一个火车移动非常缓慢的帧范围。

  2.  在其中一帧中，在 3D 视口中近距离放大查看火车的车轮。

  3.  在界面的另一个区域，打开驱动器编辑器。

  4.  选择 `X Euler Rotation` 驱动器 F 曲线的任意一个关键帧。

  5.  抓取（`G`）选中的关键帧并移动它以调整 F 曲线的斜率。

  6.  拖动帧在帧间切换，在 3D 视口中查看驱动器的新效果。

  7.  持续调整，直到火车车轮看起来像是在轨道上具有牵引力（不打滑）。


  一旦火车车轮旋转正确，你就完成了：


  ![Figure 4.34: The corrected driver F-curve and animated train](img/B17149_04_34.jpg)


  图 4.34：修正后的驱动器 F 曲线和动画火车


  以这种方式使用驱动器，与我们建立的其他对象关系有一个共同的优势——如果我们选择回头修改 `Evaluation Time` 的动画，不需要复制任何关键帧，也不需要调整火车的任何其他方面。这是一个优雅的解决方案！


  ## 最终对象关系图


  为了理清我们为何能用如此少的动画通道驱动如此多的事物，请看这张展示我们创建的所有复杂关系网络的图表：


  ![Figure 4.35: The final relationship chart – the dotted black line represents the
  driver](img/B17149_04_35.jpg)


  图 4.35：最终关系图——虚线黑线代表驱动器


  我们创建了一个相当庞大的对象家族树，彼此相互影响！沿着各种依赖关系的方向，你可以看到一切最终都指向对象 `Track`。


  > **Important note**

  >

  > 在任何相关对象系统中，想象沿着关系图按箭头方向从一个对象走到下一个对象，绝不后退。最终，你应该会到达一个没有依赖关系的对象，在此之后无法继续前进。图表中任何可以绕回同一位置两次的部分被称为**循环依赖**或**依赖循环**，通常会导致错误。


  我违背了承诺——严格来说，我们确实不得不编辑不止一条 F 曲线来完成这个动画。尽管如此，如果我们从简化的意义上理解动画，即直接为每个属性插入关键帧，那么从如此少量的“动画”产生如此多的运动，实在是令人惊叹！


  ## 总结


  完成这个练习并让火车动起来后，你可能感觉更像个机械师或工程师，而不是动画师，但动画是一个广泛的类别，包含整个系统的逻辑构建。你构建场景的方式、对象及其属性之间的关系，可能与动画通道中的所有关键帧一样重要。


  我们在这里涉及的主题可能看起来很复杂，但还有更多东西要学！所有那些不同的约束、变量类型、依赖链、坐标系、Python 表达式、驱动器 F 曲线……在这些外表简单的“功能”之下，轰鸣着一个神秘的逻辑与数学洞穴。如果我们在旋转话题上走得太远，就永远无法回头完成本书的其余部分。


  我们将在本书的*第 2 部分*中，当我们在角色动画中运用父子关系、约束和驱动器时，了解更多关于它们的知识。然而在此之前，我们将简短地转向一个更紧迫的问题——如何将我们完成的所有工作转换为视频文件！


  ## 问题


  1.  什么是对象原点？在什么情况下我们将其称为原点？

  2.  使用 `Affect Only`（仅影响）| `Origins`（原点），我们实际上影响对象的方面是否比正常移动其原点时更少？

  3.  你如何判断一个对象是否为其他对象的父对象？（至少有三种方法。）

  4.  在现实生活中，大多数孩子有两个父母。在 Blender 中，对象也可以这样吗？

  5.  从实际角度出发，一个对象可以成为祖父母吗？

  6.  约束所有者和约束目标有什么区别？哪一个受约束影响？

  7.  检查后车轮之一的 `Transform`（变换）属性。它在移动和旋转，那么为什么这些滑块中的数值似乎没有变化？

  8.  驱动器的 `Type`（类型）决定了什么？

  9.  在什么意义上火车车轮是“被动画化”的？在什么意义上它们*没有*被动画化？

  '
- '# 第 5 章：渲染动画


  我们到目前为止真正*完成*本书中的任何动画了吗？我们辛苦工作的成果只是几个 `.blend` 文件。当然，我们可以在 Blender 中打开一个，点击播放，观看对象运动，但这真的是动画该被观看的方式吗？


  不是，人们期望将动画作为 `video`（视频）观看，即一系列 2D 图像快速连续显示，格式化为与现代网站和媒体播放器兼容的数字文件。他们还期望视频的每一帧看起来都很美观，有灯光、着色等，且没有网格线或光标碍事。要生成这样的视频文件，我们必须
  `render`（渲染）动画。





  对于一本关于 Blender 的书来说，在提到渲染之前走到这一步是不常见的。渲染是 3D 动画的最后一步，它生成将被他人看到的成品图像或帧。在这个 3D 动画的最后且至关重要的阶段，我们利用场景中的
  3D 数据输出一系列 2D 图像，每一幅都是给定帧下场景的“快照”。渲染生成的高质量 `image sequence` 随后将提供视频的帧，这将成为我们的最终产品。


  在本章中，我们将涵盖以下主题：


  *   设置相机

  *   为渲染准备动画场景

  *   将动画渲染为图像文件序列

  *   将图像导入 Blender 的 `Video Sequencer` 并渲染为视频文件


  ## 技术要求


  本章的练习比其他章节更加开放。你只需要一个包含完整动画的 `.blend` 文件。前四章中的任何项目都可以。作为示例，我选择使用我来自 第 3 章 的独轮车动画：


  ![图 5.1：处理后的独轮车动画渲染帧](img/B17149_05_01.jpg)


  图 5.1：处理后的独轮车动画渲染帧


  决定要渲染哪一章的练习，并在 Blender 中打开它。


  渲染会生成一系列高质量图像文件，这可能会占用大量文件空间，因此你还需要确保计算机文件系统上有足够的存储空间。要渲染前几章中的某个动画，1 GB 的可用空间应该足够了。


  ## 设置相机


  你可以使用 `Render | Render Image` (`F12`) 渲染单帧，也可以使用 `Render | Render Animation` (`Ctrl
  + F12`) 渲染所有帧。


  不过别急！你的场景里有 `camera` 吗？


  ![图 5.2：相机对象](img/B17149_05_02.jpg)


  图 5.2：相机对象


  如果没有，当你尝试渲染时会收到此错误消息：


  ![图 5.3：尝试在没有相机的情况下渲染时的错误消息](img/B17149_05_03.jpg)


  图 5.3：尝试在没有相机的情况下渲染时的错误消息


  相机是一个关键对象。如果我们把 3D 场景想象成电影布景，把动画对象想象成演员，那么我们的相机就可以被认为是摄像机。这不是一个深奥的类比。就像真实的相机一样，我们的场景将通过这台虚拟相机的“镜头”被捕捉。


  你为本书第一部分练习下载的场景没有相机，这使得它们无法进行渲染。现在让我们添加一个并进行设置。


  ## 向场景添加相机


  你可以在 `3D Viewport` 中使用 `Add | Camera` (`Shift + A`) 添加相机对象。


  重要提示


  一个场景可能有多个相机，但在任何给定时间点只能有一个 `active camera`。这是用于渲染和查看场景的相机。如果场景中只有一个相机对象，它通常就是活动相机。


  ![图 5.4：初始相机位置](img/B17149_05_04.jpg)


  图 5.4：初始相机位置


  别担心——相机是可以像其他对象一样移动的对象，并且它们附带一些额外的技巧，我们可以用来快速设置它们。


  ## 相机取景


  无论是渲染还是现实生活中的摄影，你想用相机做的第一件事就是透过它观看。在 Blender 中，这被称为 `camera view`。你可以通过点击 `3D Viewport`
  右上角的相机小部件，使用 `View Camera` (`` ` ``, `1`)，或使用 `View | Viewpoint | Camera` (`numpad
  0`) 来切换相机视图：


  ![图 5.5：相机视图](img/B17149_05_05.jpg)


  图 5.5：相机视图


  相机视图为我们提供了最终产品外观的重要预览。在矩形的实线范围内，我们可以看到相机所见的内容。范围外的任何内容将不会被*直接*渲染，但仍可能发光、投射阴影或以其他方式间接影响结果。


  提示


  如果你的电脑屏幕有空间，你可以考虑将界面分割为多个 `3D Viewport`，并将其中一个保持在 `camera view` 中。这使你可以在一个视口中工作，同时在另一个视口中预览相机所见的内容。


  现在我们可以透过相机观看了，我们可以有意义地调整它的位置和其他属性。


  ### 定位相机


  大多数电影制作人会建议你将相机对准你想让观众看到的东西。在你的情况下，除非你为自己的作品感到羞愧，那指的就是你制作动画的东西。你需要重新定位新相机，使其在场景中正确构图动画对象。


  以下是几种方法：


  *   像操作其他东西一样直接抓取并旋转你的相机！你甚至可以在 `camera view` 中透过相机观看时选择并移动它。

  *   使用标准的 `3D Viewport` 导航控制找到你喜欢的视角，然后使用 `Align Active Camera to View` (`Ctrl +
  Alt + Numpad 0`)。这会将活动相机对齐以匹配你的视图。

  *   默认情况下，在 `3D Viewport` 中使用中键会退出 `camera view`，留下相机原地不动。不过，如果你愿意，可以去侧边栏 (`N`)
  的 `View` 选项卡，启用 `View Lock | Lock | Camera to View`。现在 `camera view`——连同相机——将跟随你，当你用中键调整视图时。


  以下是我点击几下后的相机视图：


  ![图 5.6：调整后的相机视图](img/B17149_05_06.jpg)


  图 5.6：调整后的相机视图


  这些方法都只影响相机 `object`，具体来说是它的位置和旋转。这些肯定是最重要的属性，但还有一个属于相机 `data` 的属性（如果你还记得对象及其数据之间的区别），也会显著影响渲染结果。


  ### 相机镜头


  选中相机后，我们可以去 `Properties` 编辑器中的 `Object Data Properties` 选项卡，它现在有一个看起来像电影摄像机的图标。可以说最重要的相机数据属性在
  `Lens` 面板中：


  ![图 5.7：相机数据的镜头属性](img/B17149_05_07.jpg)


  图 5.7：相机数据的镜头属性


  调整 `Focal Length` 具有*缩放*进出的效果，其数值对应真实相机变焦镜头的数值。


  ![图 5.8：放大后的相机视图](img/B17149_05_08.jpg)


  图 5.8：放大后的相机视图


  为了补偿这种效果，你可以尝试通过抓取相机的局部 `Z` 轴来 `dollying` 相机，在保持居中的同时将其推近或推远主体。这里有三个可能的视图，展示了缩放和推拉镜头如何对镜头外观产生显著影响：


  ![图 5.9：远距离缩放、正常、近距离缩小](img/B17149_05_09.jpg)


  图 5.9：远距离缩放、正常、近距离缩小


  当你为相机找到合适的位置和焦距后，别忘在 `camera view` 中播放动画。镜头在某一帧看起来可能不错，但在每一帧上看起来怎么样呢？


  ## 动画相机


  在动画结束时，动画对象还在你留下的相机前面吗？


  ![图 5.10：第 125 帧的相机视图……和第 250 帧](img/B17149_05_10.jpg)


  图 5.10：第 125 帧的相机视图……和第 250 帧


  我们的动画对象是有生命的东西，它们不一定会为我们停留在一个地方。因此，我们的相机也必须变成有生命的东西。


  给相机制作动画和给其他东西一样简单。我可以通过为其旋转和焦距设置关键帧，让我的相机跟随独轮车：




  ## 渲染基础


  在虚拟场景中设置好虚拟相机后，你就可以按下它上面的虚拟快门释放按钮，拍一张虚拟照片了。换句话说，你可以渲染一帧画面！


  ## 到底什么是渲染？


  渲染是 3D 图形学中的一个基本过程，艺术家让程序完成大部分工作——模拟透视、颜色、阴影和反射等现象，这些现象同样影响着现实世界中的光线如何被我们的眼睛或相机感知。


  渲染出的图像应该比我们在 3D 视口 中看到的效果更好（至少初衷是这样）。然而，这种质量的提升是有代价的：它可能需要花费一段时间。


  ![Figure 5.12: The image on the right took 20 minutes to render](img/B17149_05_12.jpg)


  **图 5.12：** 右侧的图像渲染耗时 20 分钟


  渲染可能是一个耗时的过程，艺术家必须坐在那里等待计算机处理数据并输出每一帧图像，且并不总能预知结果会怎样。取决于渲染内容和硬件配置，渲染单张图像可能需要从几毫秒到一个月不等的时间。在动画的情况下，这个过程必须为每一帧重复执行！


  ### 关于渲染引擎的简短说明


  3D 应用程序中专门执行渲染的部分称为 **渲染引擎**。渲染引擎非常先进，有时它们会被打包成独立的应用程序。在开始新项目时，3D 艺术家通常会在正式开工前先选择打算使用的引擎。


  Blender 自带多个渲染引擎，位于 **渲染属性** 选项卡的最顶端：


  ![Figure 5.13: Render engines in Blender](img/B17149_05_13.jpg)


  **图 5.13：** Blender 中的渲染引擎


  **Cycles** 和 **Eevee** 是用于渲染高质量图像的两大主流引擎。这两个渲染引擎功能都很强大，且相辅相成。


  **Cycles** 和 **Eevee** 的区别快速总结：**Cycles** 真实但不一定快，需要仔细调整设置以在不牺牲质量的前提下加快渲染速度。相比之下，**Eevee**
  快但不一定真实，需要额外工作来提升图像质量，同时又不能牺牲太多性能。


  本章我们将继续使用 **Eevee** 渲染引擎，因为它默认速度快得多，更适合快速渲染你的第一个动画。


  ### “渲染”视口着色模式


  **渲染** 是一个容易混淆的术语，含义多样。严格来说，如果要在计算机屏幕的 2D 像素网格上显示 3D 数据，必须以某种方式对其进行渲染。当我们工作时，3D
  视口会使用针对性能优化的各种 **视口着色** (`Z`) 方法实时渲染场景。如果不这样做，我们就无法看到正在处理的内容！


  此示例展示了三个 3D 视口，每个使用不同的视口着色方法——**线框**、**实体** 和 **材质预览**：


  ![Figure 5.14: Three realtime Viewport Shading methods](img/B17149_05_14.jpg)


  **图 5.14：** 三种实时视口着色方法


  这引出了本章最重要的视口着色方法。要获得场景最高质量的交互式预览，请查看 3D 视口中的 **渲染** (`Z`, `8`) 视口着色模式。该模式使用我们选定的渲染引擎直接在
  3D 视口中渲染场景：


  ![Figure 5.15: 3D Viewport using the Rendered method](img/B17149_05_15.jpg)


  **图 5.15：** 使用渲染模式的 3D 视口


  这种方法是我们在 3D 视口中预览渲染结果的最接近方式。结合相机视角使用时尤其有用。你也可以在这种着色模式下播放动画，尽管结果不一定总能以可接受的帧率回放。


  请记住，**渲染** 仍然是一种着色模式，就像 **线框**、**实体** 或 **材质** 一样。它不完全等同于执行渲染操作。对于那些在视口和渲染时具有不同数值的属性，将使用视口数值，这倾向于较低的数值，就像
  3D 视口中的大多数其他事物一样，偏向性能而非质量。它也无法预览视频编辑器或合成节点完成的任何后期处理。


  总而言之，你在 **渲染** 模式下看到的，不一定就是你执行 *渲染* 时得到的……


  ## 渲染控制


  在大多数情况下，*渲染* 的含义比 3D 视口中的一个设置更具体：它是指执行一项操作，根据 **渲染属性** 和 **输出属性** 确定的参数，从活动相机的视角渲染活动场景。这将生成一张图像或一系列图像，它们可能成为视频的帧。


  ![Figure 5.16: The Render menu](img/B17149_05_16.jpg)


  **图 5.16：** 渲染菜单


  在动画项目中，研究单个渲染帧以评估其质量非常重要。以下是渲染单帧的主要操作符/控制：


  - **渲染** → **渲染图像** (`F12`) 在当前帧渲染场景，并在图像编辑器中显示结果。

  - **图像** → **保存** (`Alt` + `S`) 可用于在图像编辑器中将图像保存为文件。

  - 随时按 `Esc` 可取消正在进行的渲染，再按一次可离开渲染时调用的图像编辑器。

  - **渲染** → **查看渲染结果** (`F11`) 返回图像编辑器，显示上一次渲染的图像。它不会渲染任何新内容。


  > **重要提示**

  >

  > 首次按下 **渲染图像** (`F12`) 后，新手用户往往会兴奋地询问如何在图像编辑器中播放或环绕查看结果。别指望了。请记住，图像编辑器中的图像只是一张
  *图像*：一个静态的二维彩色像素网格。


  最后，以下是渲染动画的操作符：


  - **渲染** → **渲染动画** (`Ctrl` + `F12`) 按顺序从 **起始帧** 到 **结束帧** 为动画中的每一帧渲染并输出一张图像。除非按
  `Esc` 取消，否则该过程将持续到渲染完最后一帧。

  - **渲染** → **查看动画** (`Ctrl` + `F11`) 在输出路径中搜索本应已渲染好的视频或图像序列，并尝试（成功率不一）按指定帧率播放。


  > **重要提示**

  >

  > 使用 **渲染图像** (`F12`) 渲染的某一帧，与使用 **渲染动画** (`Ctrl` + `F12`) 渲染的同一帧是完全相同的。唯一的区别在于
  Blender 是否在渲染完一帧后停止！


  此时使用 **渲染动画** 将无法得到好的结果。首先，我们还没检查 **输出属性**。此外，还有一个更宏观的原因说明为什么我们不应好高骛远。


  ### 为什么我们现在不应该渲染整个动画？


  在渲染所有帧之前，不如先渲染一帧试试？


  这是我使用 **渲染** → **渲染图像** (`F12`) 得到的结果：


  ![Figure 5.17: Rendered frame without lights, sky, or ground](img/B17149_05_17.jpg)


  **图 5.17：** 无灯光、天空或地面的渲染帧


  通过仅渲染一帧，我可以看到我的场景缺少一些东西，包括适当的照明和地面。如果我等整个动画渲染完成后再检查效果，我也会发现同样的问题，但那时我已经浪费了文件空间和几分钟的渲染时间。




  当然，这只是一帧而已。也许场景中每隔一帧渲染出来看起来都不错。不过我可不敢打包票。渲染就是这样：在渲染完成之前，我们无法绝对确定最终成品的样子，但我们仍然可以根据在
  3D 视口和单个渲染帧中看到的情况进行推断。


  当你进行下一节时，请记住同时使用 3D 视口中的 `渲染` (`Z`, `8`) 模式和 `渲染图像` (`F12`) 在不同帧上进行检查，以监控我们对场景及其属性的更改如何影响渲染结果。


  ## 为渲染设置场景


  我们在 Blender 中所做的一切最终都是为了渲染；它们或直接或间接地贡献于渲染成品。除此之外皆为徒劳。这意味着在 Blender 中几乎没有哪个话题能让我们断言：“这与渲染章节毫无关系。”


  灯光、环境、着色：这些内容足以填满其他好几本书，对于制作静态图像的 3D 艺术家来说，它们与 3D 动画师同样重要。既然动画是我们的首要任务，本节将略过这些话题中的大部分，仅涵盖足以让场景能够顺利渲染的内容。


  ### 添加天空和地面


  为求简单，你为第 1 部分练习下载的 `.blend` 文件中不包含任何灯光对象。这种缺乏灯光的情况会导致渲染场景出现业内专业人士所谓的“太暗”问题，其原因过于高深，不宜在本书中解释。我只能引用业内另一句行话：“放个灯进去，别那么暗了。”


  顺便一下，我们不妨用一个合适的天空来完善场景，而不是沿用现在的默认灰色背景。一个完整的场景还应该有地面，这样看起来才不像其他所有东西都漂浮在太空中：场景中心的一个简单网格对象就很合适。


  现在让我们添加这些基本元素：


  1.  通过 `添加` (`Shift` + `A`) | `灯光` | `阳光` 向场景中添加一个太阳。试着稍微旋转一下它以投射出更长的阴影。

  2.  前往属性编辑器的 `世界属性` 选项卡。给场景背景设置一个漂亮的颜色，甚至可以用一个 `天空纹理`：


  ![图 5.18：背景天空纹理设置示例](img/B17149_05_18.jpg)


  图 5.18：背景天空纹理设置示例


  3.  使用 `吸附` (`Shift` + `S`) | `光标到世界原点` 和 `添加` (`Shift` + `A`) | `网格` | `网格` 来添加一个平坦的网格，作为场景的地板或地面。

  4.  将地板对象 `缩放` (`S`) 至至少 **100** 倍。


  现在我们有了光源、天空，以及用于接收阴影的地面！


  ![图 5.19：带有光照、天空和地面的场景](img/B17149_05_19.jpg)


  图 5.19：带有光照、天空和地面的场景


  ### 一些快速简便的渲染设置


  `渲染属性` 选项卡包含 Eevee 中各种功能的设置，启用它们可能会增强渲染的真实感。以下是几个值得考虑的选项。


  启用 `环境光遮蔽` 通过加深几何体之间的缝隙来提高真实感：


  ![图 5.20：启用环境光遮蔽的场景](img/B17149_05_20.jpg)


  图 5.20：启用环境光遮蔽的场景


  启用 `屏幕空间反射` 后，光滑材质看起来会更好：


  ![图 5.21：启用屏幕空间反射的独轮车特写](img/B17149_05_21.jpg)


  图 5.21：启用屏幕空间反射的独轮车特写


  最后，`运动模糊` 是动画的一项绝佳功能。启用后，几何体会沿着其移动方向产生模糊，就像真实相机一样：


  ![图 5.22：启用运动模糊的渲染帧](img/B17149_05_22.jpg)


  图 5.22：启用运动模糊的渲染帧


  这结束了我们关于灯光和渲染设置的教程——与其说是大师课，不如说是在漆黑的浴室里摸索开关。能说什么呢？这是一本动画书！只要动画物体在渲染时清晰可见，那就足够了。


  既然这是一个开放式练习，鼓励你根据喜好对场景做尽可能多的额外改进。如果在静态图像中看起来不错，在动画中通常也会同样不错，尽管渲染时间可能会更长。


  ### 渲染分辨率


  还有一个至关重要的场景属性关系到渲染。即使我们在本书剩余练习中不需要编辑它，你仍应了解它，因为它影响图像质量、渲染时间，甚至场景中的相机。


  `分辨率 X`、`分辨率 Y` 和 `分辨率 %` 位于 `输出属性` 的 `尺寸` 面板中：


  ![图 5.23：分辨率设置](img/B17149_05_23.jpg)


  图 5.23：分辨率设置


  这些属性决定了渲染图像的像素尺寸。将 `分辨率 %` 分别应用于 `分辨率 X` 和 `分辨率 Y`，然后相乘：这就是 Blender 每帧将渲染的像素数量。


  不用说，高分辨率图像被认为质量更高。然而，这种提升伴随着渲染时间的相应增加。同样，低分辨率图像渲染速度会更快。


  > **提示**

  > `分辨率 %` 提供了一种便捷的方式来缩放渲染分辨率，而无需成比例地编辑 `X` 和 `Y` 值。分辨率 **1920** x **1080** 在 **50%**
  时将以 960 x 540 渲染，且耗时约为 1/4！以较低分辨率渲染是艺术家更快预览渲染结果的另一种技巧。


  碰巧的是，Blender 默认的 **1920** x **1080** 分辨率在大多数情况下都很合适。这是一个不错的分辨率，在现代格式、网站和媒体播放器中拥有普遍支持。如果你选择其他分辨率，最好选择标准分辨率，例如你电脑显示器的分辨率。


  更多信息请参阅此处的常见分辨率列表：


  [`en.wikipedia.org/wiki/List_of_common_resolutions`](http://en.wikipedia.org/wiki/List_of_common_resolutions)


  ## 预测和管理渲染性能


  查看渲染图像时，请注意显示区域左上角的那串信息：


  ![图 5.24：渲染帧的相关信息](img/B17149_05_24.jpg)


  图 5.24：渲染帧的相关信息


  **Time** 旁边的数值是渲染该帧所花费的时间。随着我们在场景中添加对象并启用渲染功能，这个数字会上升。用渲染一帧所需的 **Time** 乘以动画的总帧数，你就能得到整个动画渲染所需时间的粗略估计。


  一帧渲染用 2 秒而不是 1 秒重要吗？可能很重要，如果动画有 3,000 帧，且 1 小时后就要交付！3D 艺术家在渲染复杂场景并追求高质量时，必须做平衡。如果在场景中塞入太多物体或把某些设置调得太高，Blender
  可能会花费难以接受的漫长时间来完成渲染。甚至可能会崩溃！


  你的艺术品味、硬件规格和耐心都是你自己的，所以你必须决定愿意等待渲染完成多久。


  > **提示**

  > 使用 `图像查看器` 标题栏中的 `槽位` 功能，可以存储多张渲染图像以便对比。图像槽位还会保留顶栏的渲染信息，因此你可以连同图像本身一起对比渲染时间。


  始终建议在不同帧使用 `渲染图像` (`F12`) 测试场景。当你确信动画中的所有帧看起来都良好且能在可接受的时间范围内渲染完成时，你就准备好迈出下一大步了！





  ## 渲染图像序列


  随着我们越来越接近查看最终产品，我们一直通过两种方式之一来预览它：在相机视图中观看动画播放，或使用 `Render Image` (`F12`) 渲染静态图像。这意味着我们不得不在低质量下观看动画，和/或查看一些不移动的高质量帧，然后靠想象力来填补空白，以期待最终视频的样子。好吧，不必再期待了！是时候渲染你的动画了。


  渲染动画很像渲染静态图像，只是这一次，动画中的*每一*帧都必须被渲染。当调用 `Render Animation` (`Ctrl` + `F12`) 时，Blender
  将渲染并自动输出（保存）场景帧范围内每一帧的图像，从 `Start Frame`（起始帧）开始，一直持续到 `End Frame`（结束帧）保存为止。


  此操作的结果将是一个图像序列：存储在你电脑上的一个文件夹，其中包含你动画中的每一帧作为单独的图像文件。


  ## 为什么输出图像序列而不是视频？


  当我们在 Blender 中渲染动画时，我们可以使用 `Format`（格式）设置来选择输出一系列图像文件，还是仅输出一个视频文件。既然我们需要的是视频文件，为什么不直接渲染成那个格式呢？


  诚然，我们可以这么做！就实际情况而言，本书中的项目简短且简单，足以任由两种方式输出。然而，本章旨在教授渲染动画的最佳实践。这意味着先渲染成图像序列，然后在 Blender
  或其他应用程序中将该图像序列转换为视频。


  以下是我们的理由：


  *   在保存序列中的图像文件时可能发生的任何错误，都将仅限于那一个文件，而视频中的单个损坏帧可能会影响其余帧并毁掉整个视频。

  *   如果你在渲染过程中遇到崩溃或断电，或者不得不使用 `Esc` 取消正在进行的渲染，图像序列使得从最后一帧完成的帧恢复渲染变得容易得多。

  *   除了 Blender，大多数专业视频编辑器和合成软件都能很好地处理图像序列——有时甚至比处理视频文件更好。

  *   根据视频的发布方式，它可能需要以各种格式、质量级别和分辨率进行编码。在这种情况下，你反正都得把渲染出的东西转换成另一种视频格式。


  总结一下：视频文件很麻烦。如果你直接渲染成视频文件，总有一天你会后悔的，所以让我们趁此机会把事情做对。


  ## 输出设置


  当你使用 `Render Image` (`F12`) 渲染图像时，Blender 会将其暂时保存在图像编辑器中，让你决定是否使用 `Image` | `Save`
  (`Alt` + `S`) 来保存它。另一方面，Blender 无法在内存中保存整个动画的每一帧图像，因此 `Render Animation` (`Ctrl`
  + `F12`) 必须在每帧渲染完成后自动将其保存到某处。这意味着我们必须在启动渲染前建立合适的输出设置。


  这些属性属于场景，可在 `Properties Editor`（属性编辑器）的 `Output Properties`（输出属性）选项卡中的 `Output`（输出）面板中找到：


  ![Figure 5.25: File output settings](img/B17149_05_25.jpg)


  Figure 5.25: File output settings


  ### 设置输出路径


  `Output` 面板中的第一个属性是 `Output Path`（输出路径）。此字段决定了渲染出的图像将自动保存到你电脑上的哪个位置。


  默认情况下，图像将保存到一个名为 `tmp` 的文件夹中。那是个保存图像的蠢地方！让我们找个更好的：


  1.  点击 `Output Path` 字段右侧的小文件夹图标。这将启动一个文件浏览器，使设置路径更加容易。

  2.  导航到你电脑文件系统中一个稍后容易找到的位置。我建议使用包含你正在处理的 `.blend` 文件的同一个文件夹。

  3.  点击 `Add New Directory`（添加新目录）按钮以添加一个新文件夹。给它一个你稍后会记住的名字。

  4.  双击新文件夹进入，然后点击 `Accept`（接受）。


  这个全新的文件夹将成为我们即将生成的几百个图像文件的容器。有这么多文件，将它们保存在自己的容器中非常重要，否则事情会变得一团糟！


  > **Tip**

  >

  > 除了使用文件浏览器，还可以直接编辑 `Output Path` 文本字段。路径中尚不存在的任何文件夹将在保存第一帧时自动创建。


  ### 输出文件格式


  与在任何其他程序中保存图像一样，我们必须选择一种特定的格式。图像格式是编码图像的标准，以便在不占用过多带宽或文件空间的情况下保留足够的数据。


  选择图像格式时要考虑的主要因素如下：


  *   保存图像的大小

  *   图像质量和数据保留

  *   图像读写的速度

  *   与其他应用程序的兼容性


  Blender 可以读取它能输出的任何图像，所以对于本章来说，最后那个因素不成问题。然而，其他因素仍然很重要，特别是在渲染图像序列时。所有那些帧加起来很快，所以我们需要选择一种在保持图像质量的同时性能良好、且不会不必要地占用电脑文件系统空间的格式。


  点击 `File Format`（文件格式）属性，从支持的图像和视频格式列表中选择：


  ![Figure 5.26: Output file formats](img/B17149_05_26.jpg)


  Figure 5.26: Output file formats


  以下是支持的图像格式简介：


  *   `PNG` (`.png`) 和 `TIFF` (`.tif`) 都是*无损*图像格式，意味着它们采用的压缩方法在不降低图像质量的情况下减小文件大小。这些格式在其他应用程序中得到良好支持。

  *   `OpenEXR` (`.exr`) 是一种 `high dynamic range` (`HDR`)（高动态范围）格式，它为每个通道编码 32 位浮点值（而不是通常的
  8 位或 16 位整数）。它是唯一能保留渲染图像中所有颜色数据的格式，包括大多数其他格式无法编码亮度的高光部分。`Multilayer EXR` 是一种 `.exr`
  图像类型，可以编码多个图像层。`.exr` 文件非常适合高级合成流程，但对于本书来说有些大材小用。

  *   `JPEG` (`.jpg`) 是一种有损图像格式，能以牺牲质量为代价将图像数据有效压缩到方便的小文件大小。`Quality`（质量）滑块决定了倾向于图像质量还是小文件大小的程度。`.jpg`
  图像文件通常比 `.tif` 或 `.png` 小，但即使在 100% 质量下，也总会有一些数据丢失。

  *   `JPEG 2000` (`.jp2`) 是作为 `JPEG` 的继任者开发的。它比 `.jpg`、`.tif` 和 `.png` 有许多优势，但在 Blender
  中的读/写性能不尽如人意，其他应用程序采用它的速度也很慢。

  *   `Radiance HDR` (`.hdr`) 是另一种 HDR 格式，但保真度低于 OpenEXR。它通常用作环境（天空）纹理的格式。

  *   `BMP`、`Iris`、`Targa`、`Targa Raw`、`Cineon` 和 `DPX` 保留下来是为了与旧程序或专业流程兼容。用这些格式编码的图像文件相比上述其他格式没有显著优势，而且可能只是不必要地巨大。

  *   `WebP`：这其实是个非常好的格式，但不知为何，如果你用它，大家都会讨厌你。


  那么，我们应该用哪种格式？如果有一个适用于所有情况的确定答案，Blender 就不会提供这么多选择了。不过，就本书的目的而言，我推荐 TIFF，因为它像 PNG
  一样是无损的，但在 Blender 中输出似乎快得多。





  将 `File Format`（文件格式）更改为 `TIFF` 后，其余设置可保留默认值：


  ![Figure 5.27: Example output settings](img/B17149_05_27.jpg)


  Figure 5.27：输出设置示例


  **Tip**（提示）


  禁用 `Overwrite`（覆盖）时，如果 `Output Path`（输出路径）中已存在该帧的文件，Blender 将跳过该帧的渲染。这对于恢复部分完成的渲染任务非常有用。


  ## 预渲染清单


  3D 动画师常见的烦恼是渲染数小时后，才发现犯了个错，不得不重新渲染整个动画——这有点像烤蛋糕时少放了一种配料。这种情况迟早会发生在每个人身上，但为了尽可能避免，在渲染动画前我们应核实以下事项：


  *   我们已在 3D 视口的相机视图中多次观看动画

  *   至少有一帧，使用 `Render Image`（渲染图像）（`F12`）渲染时效果良好，且渲染时间不算太长

  *   在 `Output Properties`（输出属性）中，`Format`（格式）正确，且 `Output Path`（输出路径）是我们能识别且稍后能找到的路径

  *   `.blend` 文件已保存


  如果以上全部属实，你就可以开始渲染动画了！


  **Important note**（重要提示）


  渲染就像把汽车油门踩到底，这是一个资源密集型过程，会将电脑硬件推向其性能极限。请确保电脑处于通风良好的凉爽环境中，以防过热。如果你在笔记本电脑上渲染，请保持连接电源。渲染消耗笔记本电池的速度简直无与伦比！


  ## 渲染动画


  准备好了吗？按下 `Render Animation`（渲染动画）（`F12`）。


  你现在正在渲染动画。如前所述，此过程需要一些时间。由于我们使用的是 `Eevee`，所以不会花费太久，但也不会瞬间完成。


  **Tip**（提示）


  渲染时 Blender 的界面不会“锁死”，因此你仍可点击其他窗口中的内容并检查设置。不过，在恢复正常工作前，请务必取消或完成渲染。


  使用操作系统的文件浏览器，你可以导航到 `Output Path`（输出路径）设定的位置，看着它慢慢被图像文件填满：


  ![Figure 5.28: File Browser showing thumbnails of each image in sequence](img/B17149_05_28.jpg)


  Figure 5.28：文件浏览器显示序列中每张图像的缩略图


  请注意，每个图像文件的文件名中都带有帧号。稍后我们将图像作为单个序列导回 Blender 时，这将非常重要。


  当动画的最后一帧被保存时，渲染即告完成。


  ## 查看渲染帧


  Blender 自带内部媒体播放器，可播放刚渲染好的图像序列。我们可通过 `Render`（渲染）| `View Animation`（查看动画）（`Ctrl`
  + `F11`）调用它。调用时，此操作会在输出路径中搜索本应已渲染的内容。当然，这仅在你已渲染过内容时有效。如果找到目标内容，Blender 的内部媒体播放器将尝试播放最近输出的视频或图像序列。


  以这种方式查看图像序列有助于我们快速预览渲染结果，以便在转换为视频文件前判断其是否合格。不过，如果生成的视频出现卡顿或抖动，请不要惊慌——Blender 这款可爱的小播放器并不总能以最佳性能播放所有内容。它甚至没有时间轴，但它已经尽力了！


  **Tip**（提示）


  预览最终成品后，通常会想做些修改并再次渲染动画。第二次渲染与第一次一样简单，但如果不想覆盖旧序列，请考虑设置新的输出路径。


  现在我们已完成将场景渲染为图像序列的繁重工作，接下来可以将这些图像转换为单个视频。


  ## 将图像序列转换为视频


  如果我们能用 `View Animation`（查看动画）（`Ctrl` + `F11`）播放图像序列，我们不就已经有视频了吗？嗯，是也不是——视频或许只是一系列图像，但单独的图像文件序列无法被大多数媒体播放器识别，且体积过大、难以处理，不便于上传网络或发送给他人。合规的视频文件将所有帧包含在单个文件中，并能应用空间和时间压缩方法，使视频文件大小远小于图像序列。


  许多专业视频编辑/编码应用程序可将图像序列转换为视频文件。例如，我可以使用视频编码工具 `FFmpeg`，通过一条命令将我的 `.tif` 文件序列转换为 `.mp4`
  文件：


  ```

  ffmpeg -r 24 -i render/%04d.tif my_video.mp4

  ```


  不过，你不必为了制作第一个视频而下载新程序或学习全新的命令行语法。这是一本 Blender 书，Blender 已内置了我们所需的一切！


  ## 视频序列编辑器


  Blender 自带 `Video Sequencer`（视频序列编辑器），与专业视频编辑应用相比，它既强大又基础（能打开多层 EXR 序列，但不总能全速播放）。


  ![Figure 5.29: Example project in the Video Sequencer](img/B17149_05_29.jpg)


  Figure 5.29：视频序列编辑器中的示例项目


  你可以通过将屏幕某区域的 `Editor Type`（编辑器类型）切换为 `Video Sequencer`（视频序列编辑器）来访问它。如果你愿意，也可以点击屏幕顶部的
  `+` 标签页，选择 `Add Workspace`（添加工作区）| `Video Editing`（视频编辑）| `Video Editing`（视频编辑）来添加一个
  `Video Editing` 工作区。


  我们将涉足此领域，以便导入刚渲染的图像序列。将图像序列作为条带导入视频序列编辑器后，我们便可渲染为视频文件，这将是我们的最终成品。


  ### 创建用于视频编辑的场景


  为避免图像序列与生成它的 3D 场景混淆，我们应在 `.blend` 文件中使用单独的场景进行视频编辑。为简化操作，我们可以添加一个新场景，其初始设置与现有场景相同：


  1.  找到屏幕右上角附近的 `Scene`（场景）选择器。

  2.  点击 `New Scene`（新建场景）按钮并选择 `Copy Settings`（复制设置）。

  3.  将新场景重命名为有意义的名称（如 `Sequence`），而非 `Scene.001`。

  4.  如果尚未打开，在 UI 中调出视频序列编辑器。


  ![Figure 5.30: New scene with an empty Video Sequencer](img/B17149_05_30.jpg)


  Figure 5.30：带有空白视频序列编辑器的新场景


  使用 `Copy Settings`（复制设置）会使新场景拥有与前一个场景相同的 `Output Properties`（输出属性）——这是确保两个场景具有相同帧范围和分辨率的快捷方式。`Render
  Properties`（渲染属性）也将相同，但正如我们即将看到的，那些属性不再与我们相关。


  ### 导入图像序列


  虽然我们通常将 Blender 中的场景视为包含 3D 物体、可在 3D 视口查看的 3D 空间，但它也可以仅作为视频序列编辑器中序列的容器。


  Blender 视频序列编辑器中的元素称为条带。现在让我们添加图像序列 `strip`（条带）：


  1.  转到 `Start Frame`（起始帧）（应为帧 `1`）。这样可确保添加条带时从帧 `1` 开始，就像原始场景中的动画一样。

  2.  在视频序列编辑器中，使用 `Add`（添加）（`Shift` + `A`）| `Image Sequence`（图像序列）。

  3.  在调出的文件浏览器中，导航到包含图像序列的目录。

  4.  选中序列中的所有图像，点击 `Add Image Strip`（添加图像条带）。


  **Tip**（提示）


  视频序列编辑器中导航和移动条带的控制方式，与 `Timeline`（时间轴）的控制方式基本相同。





  ## 从视频序列器渲染一帧


  您的视频序列器现在应该有一个图像序列条带，其时长覆盖场景的帧范围：


  ![图 5.31：视频序列器中的图像序列条带](img/B17149_05_31.jpg)


  **图 5.31：** 视频序列器中的图像序列条带


  本章所需的排序工作就这些！


  那么，我们如何设置 Blender 使用视频序列器中的图像序列呢？这是个陷阱问题——我们不需要做任何额外的事情！在场景的 `Output Properties`（输出属性）中的
  `Post Processing`（后期处理）下，视频序列器的使用默认已启用：


  ![图 5.32：后期处理设置](img/B17149_05_32.jpg)


  **图 5.32：** 后期处理设置


  `Sequencer`（序列器）在视频序列器为空时没有任何效果，但一旦我们添加图像或视频条带，Blender 就会绕过活动场景的 3D 部分，转而渲染视频序列器中的内容。


  您现在可以尝试用 `Render Image`（`F12`）自己试试。这些帧的渲染速度似乎比上一个场景快得多，不是吗？那是因为我们并不是以我们理解的方式在“渲染”。虽然我们技术上使用的是相同的
  `Render Image`（`F12`）命令，但这次没有评估任何 3D 数据。因为我们当前的序列只是一个没有特效的图像序列条带，Blender 实际上只是向我们显示已经渲染好的图像。


  > **重要提示**

  >

  > 请注意您所在的场景，因为很容易将初始场景中的渲染帧与序列场景中的“渲染”帧混淆。


  暂时不要使用 `Render Animation`（`Ctrl` + `F12`）！因为我们的序列场景仍然与初始场景具有相同的 `Output Path`（输出路径）和
  `Format`（格式），这样做会用图像覆盖图像本身。完全没用！我们需要设置一个新的 `Output Path` 并选择合适的视频格式。


  ## 视频导出的输出设置


  现在我们的视频序列器已准备好输出所需的帧，让我们再次回到属性编辑器中 `Output Properties`（输出属性）选项卡的 `Output`（输出）面板。这一次，我们将调整设置以输出视频文件。


  ### 设置输出路径（再次）


  1. 再次点击 `Output Path`（输出路径）旁边的文件夹图标以调出文件浏览器。

  2. 在文件系统中为即将创建的视频文件选择一个方便的位置。

  3. 为视频选择一个文件名（随意）并点击 `Accept`（接受）。


  我建议使用父目录（包含图像序列文件夹的文件夹）。这样，视频文件就可以与帮助创建它的序列文件夹放在一起。


  现在 `Output Path` 已设置好，我们的最后任务是选择合适的视频格式。


  ### 使用内置 FFmpeg


  乍一看，`File Format`（文件格式）菜单似乎提供的视频格式选项很少，但当我们选择 `FFmpeg Video` 时，可用设置会展开。


  将 FFmpeg 称为一种格式有点名不副实。FFmpeg 实际上是一个流行的命令行实用程序，用于读写广泛的视频格式。别担心——您不需要自己学习任何命令；Blender
  内置的 FFmpeg 实现会为我们处理这些。


  FFmpeg 的参数在 `Encoding`（编码）子面板中：


  1. 在 `Output Properties`（输出属性）中，选择 `FFmpeg Video` 作为 `File Format`（文件格式）。

  2. 打开 `Encoding`（编码）子面板，将 `Container`（容器）设置为 `MPEG-4`。


  所有其他属性的默认值可以保持不变。这些设置将创建一个 `.mp4` 视频，它很可能可以在大多数网站和媒体播放器上播放：


  ![图 5.33：视频输出设置](img/B17149_05_33.jpg)


  **图 5.33：** 视频输出设置


  ## 输出视频


  按 `Render`（渲染）| `Render Animation`（渲染动画）（`Ctrl` + `F12`）。


  就这么简单！因为这次我们是在“渲染”一个预渲染的图像序列，这项工作应该不超过一两分钟。


  > **提示**

  >

  > 您可以尝试不同的容器、编解码器和质量设置，以找到适合您需求的质量、文件大小以及跨平台和设备支持的最佳组合。


  您完成了！您如何处理最终的视频文件由您决定，但我建议让其他人观看。这通常是欣赏动画最令人满足的方式。否则，我们根本不会费心渲染任何东西！


  ## 总结


  如果您以前在 Blender 中渲染过静态图像，本章涵盖的大部分内容可能看起来多余。事实证明，如果您知道如何在 Blender 中渲染一帧并将其保存为图像，那么再渲染几百帧并将它们转换为视频并不难。视频实际上就是——一堆快速连续显示的帧，创造出运动的外观。仔细想想，动画也是如此。


  在结束本书第一部分时，您已完成在 Blender 中制作动画和渲染最终产品的技术要点。通过领会动画的核心概念——仅仅是逐帧变化的数字和图像，您理论上可以为任何东西制作动画……理论上。实际上，您可能想继续阅读下一章，那里介绍的主题非常庞大，填满了整个第二部分！


  ## 问题


  1. 是什么让相机对渲染至关重要？

  2. 为什么渲染引擎有名字？它们有什么特别之处？

  3. 有哪些减少渲染时间的方法？

  4. `Render Image`（`F12`）产生的图像与 `Render Animation`（`Ctrl` + `F12`）产生的图像看起来不同吗？

  5. 有损图像格式丢失了什么？我们能恢复吗？

  6. 图像和图像文件有什么区别？在 Blender 的哪些地方可能会遇到图像但不是图像文件？

  7. 为什么我们要在转换为视频之前额外输出图像序列这一步？

  8. 之前我们将“渲染”定义为从 3D 数据生成 2D 图像。在 Blender 中，什么情况下它意味着其他含义？

  9. 在本章中，我们渲染的是动画、场景、帧、图像还是图像序列？

  '
- '# 第二部分：角色动画


  您知道如何走路吗？如何说话？您知道如何站立、坐下，或用手拿起东西吗？您知道此刻您的面部表情是什么吗？您确定不奇怪吗？


  如果您对其中任何问题回答“是”，我不信。当然，我相信您能做这些事。我相信您走路、说话、站立、坐下、拿东西、做不奇怪的表情非常擅长；您太擅长了，以至于不假思索就能做到，这才是问题所在。您没有在思考。我们做了很多不知道原理的事情。没有哪个领域比角色动画更能体现这一点。


  3D 角色是一个相互依赖的运动部件的复杂系统，没有任何部件是靠本能、反射或肌肉记忆移动的。每个部件都必须由动画师刻意定位并设置关键帧，就像我们在第一部分为动画对象所做的那样，只是这次数量成百上千。如果我们做得好，角色看起来会栩栩如生，仿佛她的动作和我们自己的一样自发自然，但这要求我们思考，真正思考身体如何逐帧移动。这意味着尝试让角色走路……并意识到我们其实不知道怎么走路。


  本部分包含以下章节：


  - 第 6 章，*链接和摆姿势角色*

  - 第 7 章，*基础角色动画*

  - 第 8 章，*走路循环*

  - 第 9 章，*声音和对口型*





  > *第 10 章，动态约束下的道具交互*

  '
- "## 链接与摆姿势角色\n\n本书之前的所有练习都在为这一刻铺垫。你现在已准备好学习如何为角色制作动画！\n\n什么是角色？在文学中，它是文本中表达出行为、思想或言语的任何人物或生物。在电影制作中，角色是由演职人员饰演的任何人。在现实生活中，可能是你的叔叔。他真是个人物！\n\
  \n在 3D 动画中，**角色** 有着更具体的定义：由 **骨架** 控制的 3D 模型。骨架与真实骨骼有许多相似之处，是一种特殊对象，由多根 **骨骼**\
  \ 组成；移动这些骨骼会变换或变形关联的模型。骨架及其控制的所有对象共同位于一个 **集合** 中，构成了角色或 **角色绑定**。角色动画的工作在于让角色骨架中的骨骼协同运动，使角色行走、跳跃、跳舞，或做任何我们想让他们做的事。\n\
  \n为 3D 动画创建角色是一个独立于制作动画的项目，且难度不亚于动画制作本身！角色建模是一个足以单独成书的高级主题，搭建骨架又能写成另一本书，而将模型绑定到骨架上甚至可能值得再写第三本书。\n\
  \n幸运的是，我们已经有了一个现成的角色。准备好跟 Rain 打招呼吧……\n\n在本章中，你将学习如何执行以下操作：\n\n*   将角色链接到场景中\n*\
  \   使用角色绑定的脚本化界面\n*   为角色摆姿势\n*   复制和保存角色姿势\n\n## 技术要求\n\n无需从零开始制作角色 —— Blender\
  \ Studio 已提供一个专业制作的角色供任何人下载使用。\n\n该角色名为 **Rain**：\n\n![Figure 6.1: Rain](img/Figure_06.01_B17149.jpg)\n\
  \n图 6.1：Rain\n\nRain 即拿即用，拥有专业动画师对人类角色绑定所期待的所有功能，同时设计得也适合新手动画师使用。Rain 采用 *Creative\
  \ Commons CC-BY* 许可证，这意味着我们可以在作品中将其用于任何目的，只需署名 Blender 基金会，如下所示：\n\n*Rain Rig ©\
  \ Blender Foundation* | [`studio.blender.org/welcome/`](https://studio.blender.org/welcome/)\n\
  \n可在此免费下载：[`github.com/PacktPublishing/Realizing-3D-Animation-in-Blender`](https://github.com/PacktPublishing/Realizing-3D-Animation-in-Blender)。\n\
  \n开始前，请使用上述 URL 下载 Rain 的 `.zip` 文件，并将内容解压到文件系统中方便的位置。\n\n> **重要提示**\n>\n> 解压 `.zip`\
  \ 文件时，请确保将 `maps` 文件夹和 `rain_v2_6_packt.blend` 一起解压到同一位置。你可以打开 `rain_v2_6_packt.blend`\
  \ 查看，但请勿保存对它的任何更改，因为这些更改将来可能会影响其他文件！\n\n## 在新场景中链接角色\n\n在深入交互 Rain 的骨架并让她摆出各种姿势之前，我们必须先探索一些更令人兴奋的主题：**链接库**\
  \ 和 **文件依赖关系**。多有趣啊！\n\n与之前章节直接打开下载的 `.blend` 文件并在其中工作不同，我们不会直接在 Rain 的 `.blend`\
  \ 文件上工作。如果那样做，每次在动画中使用 Rain 都必须制作一份完整的副本 —— 无论是 Rain 本人还是她的 `.blend` 文件。正如我们将了解到的，对于像\
  \ Rain 这样复杂且宝贵的资产，这是不良做法。\n\n相反，我们将创建一个新文件来引用包含 Rain 的文件。这将使 `rain_v2_6_packt.blend`\
  \ 成为一个链接库。\n\n### 链接库\n\n在 Blender 中，**链接库** 指包含被另一个 `.blend` 文件引用数据的 `.blend` 文件，通过\
  \ `File`（文件）| `Link`（链接）实现。专业工作室（包括 Blender Institute）在制作中使用像角色这样的大型或重要资产时，都会应用链接库这一技术流程。\n\
  \n每个 `.blend` 文件都包含可被链接或追加的数据，即 **数据块**。这些数据块按类型组织成不同类别：\n\n![Figure 6.2: Some datablock\
  \ types that appear when linking](img/Figure_06.02_B17149.jpg)\n\n图 6.2：链接时出现的部分数据块类型\n\
  \n角色由多个对象组成 —— 如果角色创建者做得够细致，这些对象会为方便链接而存在于单个 **集合** 中。对于 Rain，该集合名为 `CH-rain`。\n\
  \n现在让我们链接该集合：\n\n1.  在 Blender 中通过 `File`（文件）| `New`（新建）(`Ctrl` + `N`) | `General`（通用）创建新文件。\n\
  2.  删除对象 `Cube`（立方体）。\n3.  转到 `File`（文件）| `Link`（链接）。\n4.  在调出的文件浏览器中，找到并选择 Rain\
  \ 的文件 `rain_v2_6_packt.blend`。\n5.  进入标记为 `Collection`（集合）的文件夹。\n6.  选择并 `Link`（链接）集合\
  \ `CH-rain`。\n\n在默认设置下，这会将对象集合 `CH-rain` 链接到当前文件，并自动插入一个 **集合实例**。现在 Rain 就在我们的场景中了！\n\
  \n![Figure 6.3: The linked collection instance of Rain in the 3D Viewport](img/Figure_06.03_B17149.jpg)\n\
  \n图 6.3：3D 视口中 Rain 的链接集合实例\n\n如果她乍看有点怪别担心 —— 稍后我们会修正。\n\n> **重要提示**\n>\n> 集合实例像大多数新对象一样添加在\
  \ 3D 游标处。如果链接 Rain 时 3D 游标不在中心，她也不会居中。使用 `Object`（对象）| `Clear`（清除）| `Location`（位置）(`Alt`\
  \ + `G`) 使其居中。\n\n我们的当前文件现在正使用 `rain_v2_6_packt.blend` 作为链接库。注意这不会直接影响文件 `rain_v2_6_packt.blend`；只是意味着我们必须比追加集合时更小心地对待它。\n\
  \n### 链接与追加\n\n如果你用过 `File`（文件）| `Append`（追加），就知道另一种将内容从一个 `.blend` 文件带入另一个的方法。乍看之下，`Link`\
  \ 和 `Append` 功能似乎相同，实则不然。两者有本质区别，可能让粗心用户措手不及：**链接** 创建依赖关系，而 **追加** 创建冗余副本。\n\n\
  追加类似于复制。若我们追加 Rain 到新场景而非链接，`rain_v2_6_packt.blend` 的所有数据都会被复制到新文件。这意味着复制每一个数据块，连\
  \ Rain 鞋带的材质也不例外！\n\n![Figure 6.4: Visualization of data in both .blend files](img/Figure_06.04_B17149.jpg)\n\
  \n图 6.4：两个 .blend 文件中的数据可视化\n\n在新文件中，我们可随意修改 Rain 的任何部分（包括鞋带），并忘掉她的来源文件。我们实际上拥有了两个\
  \ Rain 而不是一个。\n\n另一方面，通过链接 Rain，新文件依赖于旧文件。它必须始终引用 `rain_v2_6_packt.blend` 中 Rain\
  \ 的数据：\n\n![Figure 6.5: Visualization showing dependency between files](img/Figure_06.05_B17149.jpg)\n\
  \n图 6.5：显示文件间依赖关系的可视化\n\n除非编辑原始文件，否则无法对 Rain 做永久更改。若原始文件丢失，Rain 也会从当前场景中消失。\n\n\n\
  \n\n\n## 链接与追加\n\n`Append`（追加）看起来似乎比 `Link`（链接）更方便，但追加通常更适合从其他项目中复用次要资产，例如材质或简单模型。对于像\
  \ Rain 这样复杂的作品，追加是一种杂乱的工作方式。我们将在*第 2 部分*中创建的场景，只需存储我们在姿势和关键帧方面所做的工作；我们不需要在每个场景中都拥有\
  \ Rain 鞋带材质的唯一版本。充其量，这只会让我们的文件变得不必要地庞大；最坏的情况是，它会暴露 Rain 的所有数据，使她容易受到难以修复的错误影响。在我们的角色动画章节中，我们将坚持链接\
  \ Rain，而不是追加她。\n\n尽管链接库通常是最优雅的解决方案，但使用链接库确实伴随着一项重要责任：为了避免破坏我们新文件的链接库，我们需要确保一个文件始终能使用它记忆中的\
  \ `file path`（文件路径）找到另一个文件。\n\n> **重要提示**\n>\n> 文件路径很像网址，如果你随意移动或删除文件，它们也会同样轻易地失效。无论是图像、声音还是链接库，如果文件路径指向一个不存在的文件，其数据将从依赖它的\
  \ `.blend` 文件中丢失。\n\n### 文件路径——绝对路径与相对路径\n\n如果 `rain_v2_6_packt.blend` 中的数据在我们的当前文件中被链接，但未存储在其中，Blender\
  \ 将如何从我们的当前文件中去查找必要的数据？\n\n答案可以通过前往 `Outliner`（大纲视图）中的 `Blender File`（Blender 文件）来查看：\n\
  \n![Figure 6.6: The Outliner showing an absolute path to Rain’s .blend file](img/Figure_06.06_B17149.jpg)\n\
  \n图 6.6：大纲视图显示指向 Rain 的 .blend 文件的绝对路径\n\n在表示链接库的链条图标旁边，你会看到你电脑文件系统中 `rain_v2_6_packt.blend`\
  \ 的文件路径。如果你还没有保存当前文件，这将是一个**绝对文件路径**——一个从你电脑文件系统根目录开始的完整地址。\n\n> **技巧**\n>\n> 在\
  \ Mac 和 Linux 中，根目录由文件路径开头的 `/` 表示。在 Windows 中，它将是一个盘符，例如 `C:` 或 `D:`。\n\n绝对文件路径可能相当长，且包含文件夹名称，这些名称在每个用户之间可能不同。另一方面，相对文件路径从引用它的文件的位置开始。例如，为了加载她的图像纹理，Rain\
  \ 使用相对文件路径指向 `maps` 文件夹中的图像文件。\n\n> **技巧**\n>\n> Blender 中的相对文件路径以 `//` 开头，也可能包含一个或两个\
  \ `../`。`../` 使地址“向外”进入父文件夹一级。如果你在文件路径中看到太多 `../`，可能表明组织结构不佳。\n\nBlender 默认倾向于使用相对文件路径，但它们只有在当前文件已保存时才有效。让我们保存当前文件以查看其带来的差异：\n\
  \n1.  点击 `File` | `Save As`（`Shift` + `Ctrl` + `S`）。\n2.  将当前文件保存在与 `rain_v2_6_packt.blend`\
  \ 相同的目录中。\n\n现在我们使用一个短得多的**相对文件路径**：\n\n![Figure 6.7: The same link but with a relative\
  \ path](img/Figure_06.07_B17149.jpg)\n\n图 6.7：相同的链接但使用相对路径\n\n因为我们将当前文件保存到了与库文件相同的目录，相对路径只需包含文件名——即\
  \ `rain_v2_6_packt.blend`。只要我们将这些文件保存在同一个文件夹中，就不必担心破坏这样一个简单的路径。\n\n> **技巧**\n>\n\
  > 你可以通过在 Blender 的 `File Browser`（文件浏览器）侧边栏（`N`）中启用或禁用 `Relative Path`（相对路径）来选择使用哪种类型的文件路径。\n\
  \n现在我们已经了解了当前文件与其依赖文件之间的显式关系，我们可以将注意力完全集中在当前文件上。\n\n## 创建库覆盖\n\n目前，Rain 是一个“黑盒”。她的链接数据无法被修改，她的肢体也无法被移动。这是链接对象集合实例的默认状态，这些实例本质上只是设置为实例化集合的\
  \ Empty 类型对象。我们可以像移动棋子一样移动她，但如果我们想按预期对 Rain 进行姿势摆设和动画制作，我们需要访问她的骨架对象 `RIG-rain`。\n\
  \n要从集合实例内部访问此对象，我们必须创建一个所谓的**库覆盖**：\n\n1.  选择对象 `CH-rain`。\n2.  前往 `Object` | `Library\
  \ Override` | `Make`。\n\n注意覆盖库的数据块旁边出现的独特图标：\n\n![Figure 6.8: Library Override](img/Figure_06.08_B17149.jpg)\n\
  \n图 6.8：库覆盖\n\n**库覆盖**允许我们选择链接集合中的特定对象并操纵其属性。我们现在能够选择 Rain 的骨架对象 `RIG-rain`。Rain\
  \ 的设计初衷是仅使用 `RIG-rain` 进行控制，因此我们不需要选择她集合中的任何其他对象。\n\n我们几乎准备好开始为 Rain 摆姿势了，但她看起来还有点怪。像许多功能齐全的角色绑定一样，Rain\
  \ 有一些小怪癖，需要再走几步来修复。\n\n### 重启 Rain\n\n因为我们刚刚链接了 Rain，她看起来不如在她的原始文件中那样好。取决于你的 3D\
  \ 视口设置，她的材质可能全黑，或者她的眼睛可能看起来全是高光。虽然她的 Python 脚本随她一起被自动链接了，但它们并未自动执行，所以我们在她的骨架中还看不到有用的\
  \ `CloudRig` 界面。\n\n在创建 Rain 集合的库覆盖后，请按照以下步骤访问 Rain 的 Python 脚本界面并改善她在 3D 视口中的外观：\n\
  \n1.  **保存**（`Ctrl` + `S`）你的 `.blend` 文件。\n2.  关闭并重新打开你的文件，或使用 `File` | `Revert`（还原）。\n\
  \n> **重要提示**\n>\n> 当你重新加载文件时，Python 脚本可能会被 Blender 阻止，这将导致 Rain 失去功能。为了保持它们运行，如果\
  \ Blender 提示，请点击 `Allow Execution`（允许执行）。更好的做法是，前往 `User Preferences`（用户偏好设置）并启用\
  \ `Save & Load` | `Auto Run` `Python Scripts`（自动运行 Python 脚本）。\n\n这应该是你唯一需要重启文件的时候。现在\
  \ Rain 看起来好多了：\n\n![Figure 6.9: Rain in the 3D Viewport](img/Figure_06.09_B17149.jpg)\n\
  \n图 6.9：3D 视口中的 Rain\n\n> **技巧**\n>\n> Rain 的眼睛有一层高光几何体，这使得在某些 `Viewport Shading`（视口着色）设置下它们看起来很奇怪。暂时切换到\
  \ `Material Preview`（材质预览）视口着色模式，或继续阅读以在 Rain 的 `Outfits`（服装）面板中找到 `Dummy Eyes`（虚拟眼睛）属性。\n\
  \n我们完成了链接 Rain 的所有繁琐工作；现在她已完全准备好作为角色在我们的场景中使用！\n\n## 理解 Rain 的骨架\n\n完成将 Rain 链接到场景的所有步骤后，我们现在可以访问她的骨架，用它来弯曲她的肢体、为她的脸部应用表情，并以其他方式移动她。骨架是一个复杂的对象——可能是动画师必须处理的最复杂的东西。在我们开始直接使用她的骨架之前，我们需要了解骨架到底是什么，以及在哪里能找到能帮助我们简化\
  \ Rain 的 Python 脚本界面。\n\n## Rain 绑定的艺术\n\n骨架也可以被称为**绑定**。为角色模型创建绑定的工作被称为**绑定**，由**绑定师**完成。一个好的绑定师是动画师最好的朋友，因为一个好的绑定不仅仅是一个变形模型的骨架——它是动画师的完整界面。\n\
  \n每个角色绑定都不同。绑定的设计和复杂度因角色风格、生物类型、绑定师的个人选择以及将为其制作动画的动画师的需求而异：\n\n![Figure 6.10: Some\
  \ different character rigs in Blender](img/Figure_06.10_B17149.jpg)\n\n图 6.10：Blender\
  \ 中的一些不同角色绑定\n\n\n\n\n尽管如此，绑定还是有一些通用约定。之所以选择 Rain 作为本书的角色，不仅因为她能让你轻松上手角色动画，还因为她的绑定是你可能遇到的其他双足角色绑定的一个相当典型的例子。\n\
  \n**提示**\n\n全球 Blender 社区中有大量由个人创建并发布在各个网站上的其他角色绑定可供使用。其中许多像 Rain 一样，可以免费下载和使用。不过要当心——业余爱好者绑定的角色在制作动画时可能会让人欲哭无泪。\n\
  \n## 一切皆骨骼\n\n在 Blender 中，骨架中的元素都被称为 `bones`，即使它们看起来不像骨头。Rain 的骨架拥有 2000 多根骨骼；所有骨骼都组织在一个复杂的父子关系、约束和驱动系统中：\n\
  \n![Figure 6.11: All of Rain’s bones](img/Figure_06.11_B17149.jpg)\n\n图 6.11：Rain\
  \ 的所有骨骼\n\n这比真人骨骼的数量多了 10 倍！谢天谢地，其中大部分被绑定师隐藏了；我们不需要用到所有骨骼。\n\n供动画师使用的骨骼已经过建模、着色，并被分类整理以方便使用。这些本质上是控制骨骼，它们间接移动\
  \ Rain，就像木偶线末端的控制杆。\n\n那么，这些控制骨骼有多少呢？答案是略少于 400 根：\n\n![Figure 6.12: All of Rain’s\
  \ control bones](img/Figure_06.12_B17149.jpg)\n\n图 6.12：Rain 的所有控制骨骼\n\n这仍然是很多骨骼！即使当前可见的那些少量骨骼也可能让人感到不知所措。我们应该稍微简化一下。继续阅读以了解如何显示\
  \ Rain 的所有控制骨骼，再往后读一点会了解如何再次隐藏它们。\n\n## CloudRig 界面\n\nRain 自带一个名为 `CloudRig` 的脚本，它在\
  \ 3D 视口的侧边栏 (`N`) 中提供了一个实用的控制面板：\n\n![Figure 6.13: Rain with the CloudRig interface\
  \ on the right](img/Figure_06.13_B17149.jpg)\n\n图 6.13：右侧带有 CloudRig 界面的 Rain\n\n\
  只要 Rain 的骨架是活动对象，就可以访问 `CloudRig` 选项卡。无论选中哪根骨骼，其所有可用的按钮、功能和属性都可见。\n\n此类脚本控制面板通常随高级角色绑定提供，其布局和功能因绑定而异。虽然\
  \ Rain 工作不需要 `CloudRig`，但它方便地组织了 Rain 的功能和属性，否则这些功能和属性会分散在各个骨骼和界面区域中。\n\n**重要提示**\n\
  \n`CloudRig` 不是插件，也不连接任何“云”。它是从一个文本数据块执行的，该数据块随 Rain 的集合其余部分一起链接。\n\n使用此面板中的功能，你可以执行以下操作：\n\
  \n*   切换 Rain 模型各部分的可见性\n*   切换不同骨骼组的可见性\n*   更改某些骨骼的行为、它们的关系以及它们对 Rain 模型的影响\n\n\
  现在，关于那些骨骼——我们想隐藏 Rain 的大部分骨骼，直到我们准备好为它们摆姿势，所以我们将从隐藏它们开始。\n\n### 骨架层\n\n值得再次强调的是，Rain\
  \ 的骨架有大量骨骼。为了动画师的理智着想，Rain 的骨骼已按类别组织到不同的 `armature layers`（骨架层）中。在工作时，你需要根据想专注于\
  \ Rain 的哪个部分来切换这些不同图层的可见性。\n\n通常，为此我们必须前往 `Properties Editor`（属性编辑器）中骨架的 `Object\
  \ Data Properties`（对象数据属性），然后点击此处的图层列表：\n\n![Figure 6.14: Rain’s “Bone Collections”](img/Figure_06.14.0_B17149.jpg)\n\
  \n图 6.14：Rain 的“骨骼集合”\n\n**重要提示**\n\n从 Blender 4.0 开始，骨架层现在称为 `Bone Collections`（骨骼集合），但本书其余部分仍将其称为层。\n\
  \n`CloudRig` 在 `Layers`（图层）面板中为我们提供了对其中最重要图层的更便捷访问：\n\n![Figure 6.15: Rain’s armature\
  \ layers, labeled](img/Figure_06.15.0_B17149.jpg)\n\n图 6.15：Rain 的骨架层（已标注）\n\n当然，这并非所有的骨架层——只是供动画师使用的那些。你为\
  \ Rain 摆姿势所需的每一根骨骼（还有一大堆你可能永远不需要碰的骨骼）都在其中某一层中。如果你在找的骨骼不在这里，要么是绑定师失职，要么就是你陷得太深了！\n\
  \n如果你对这些层中的所有骨骼长什么样感到好奇，如*图 6.12*所示，你不妨继续点击此面板中的所有图层。你会很快明白为什么隐藏骨架层如此有帮助。骨骼*非常多*。随着进程推进，我们会讲解它们的功能和行为。在此之前，让我们暂时隐藏除\
  \ `IK`（`Inverse Kinetics`，反向动力学的缩写）层之外的所有图层：\n\n1.  在侧边栏 (`N`) 的 `CloudRig` 选项卡中找到\
  \ `Layers` 面板。\n2.  禁用除 `IK` 之外的所有骨架层。\n\n当我们开始为 Rain 摆姿势时，这应该会让事情在最初变得更容易一些。\n\n\
  **重要提示**\n\n隐藏/显示骨架层纯粹是为了我们工作时的方便。无论骨骼是否隐藏，它们都会继续影响模型，但只要它们可见，我们就可能意外选中它们并潜在地移动错误的东西。\n\
  \n为了让事情更简单，我们将使用 Rain 的另一个功能来隐藏她的一些几何体。\n\n### 准备 Rain 在 3D 视口中的外观\n\n看看 `CloudRig`\
  \ 中的第一个面板 `Outfits`（服装）：\n\n![Figure 6.16: The Outfits panel](img/Figure_06.16.0_B17149.jpg)\n\
  \n图 6.16：Outfits 面板\n\n这个面板听起来比实际好玩；Rain 目前除了穿在身上的那套之外没有其他服装。尽管如此，我们确实有一些有用的设置，用于确定\
  \ Rain 不同部分的可见性。\n\n在某些情况下，隐藏 Rain 的这些部分可以让我们更容易地为她摆姿势和制作动画。例如，Rain 的头发和围巾是她模型中可摆姿势的部分，很像她的手臂和腿，但既然衣服和头发除了挂在那儿没什么动静，我们通常最后才为它们摆姿势和制作动画。在那之前，它们是视觉干扰。\n\
  \n**重要提示**\n\n`Outfits` 中的属性，虽然看起来像是用*整数*表示的，但本质上是*布尔值*。把它们当作复选框；`1` 表示启用，`0` 表示禁用。\n\
  \n现在让我们隐藏一些东西：\n\n1.  找到 `CloudRig` | `Outfits` 面板。\n2.  禁用 `Scarf`（围巾）、`Hair Strand`（发丝）和\
  \ `Hair Ponytail`（马尾辫）。\n\n    Rain 的新短发和没有围巾意味着在我们对她的姿势进行初步工作时，需要担心的松散部分更少了：\n\n\
  ![Figure 6.17: Rain with less hair and no scarf](img/Figure_06.17.0_B17149.jpg)\n\
  \n图 6.17：头发变少且无围巾的 Rain\n\n1.  我们可以通过启用 `Mask Arms`（遮罩手臂）进一步简化。\n\n现在我们*真正*简化了 Rain\
  \ 的模型：\n\n![Figure 6.18: They’re gone!](img/Figure_06.18.0_B17149.jpg)\n\n图 6.18：它们没了！\n\
  \n隐藏手臂和/或腿的能力似乎是一个奇怪的功能，但你会惊讶于在准备好为它们摆姿势之前隐藏这些部分有多么有用。\n\n**提示**\n\n考虑也启用 `Dummy\
  \ Eyes`（虚拟眼睛）。这些“假”眼睛在渲染时不如 Rain 的“真”眼睛好看，但它们确实让我们在使用 `Solid`（实体）视口着色方法处理她的面部表情时，更容易看到她的视线方向。\n\
  \n我们已按需简化了 Rain。至于 `CloudRig` 界面的其余部分，当我们让 Rain 摆出第一个姿势时，学习那些功能会更容易！\n\n## 为骨架摆姿势\n\
  \n\n\n正如我们在前几章中制作动画的物体一样，骨架中的所有骨骼都具有位置、旋转和缩放属性。直接变换一个或多个骨骼被称为**姿态设定**，这是角色动画的第一步。在某一时间点，骨架中骨骼的给定位置组合在一起，被称为一个**姿态**。在后续章节为\
  \ Rain 制作动画时，我们会让她摆出一个姿态，为刚设定姿态的那些骨骼的属性插入关键帧，然后在另一帧进入下一个姿态，为那些骨骼的属性插入关键帧，以此类推。\n\
  \n这就是角色动画。它与物体动画并没有太大区别！只不过这次我们的物体是骨骼，数量有成百上千个，而且它们连接成一个复杂的系统，乍看之下可能不太直观。简单，对吧？也许并不。在为\
  \ Rain 制作动画之前，我们最好花一两节的时间专门学习如何为她设定姿态。\n\n我们的第一个练习将让 Rain 从 *T* 姿态过渡到一个闲置的、自然的站立姿势：\n\
  \n![Figure 6.19: Resting “T pose” to idle standing pose](img/Figure_06.19.0_B17149.jpg)\n\
  \nFigure 6.19: 静止“T 姿态”到闲置站立姿态\n\n如果想让它看起来自然，即使是简单的站立姿态也需要操纵大量骨骼。\n\n## 姿态模式\n\n\
  要开始为 Rain 设定姿态，请选择她的骨架，并在 3D 视口中进入 `Pose Mode`（`Ctrl` + `Tab`）：\n\n![Figure 6.20:\
  \ Pose Mode in the Interaction Mode menu](img/Figure_06.20.0_B17149.jpg)\n\nFigure\
  \ 6.20: 交互模式菜单中的姿态模式\n\n在 `Pose Mode` 中，骨骼的选择和变换方式与 `Object Mode` 中的普通物体非常相似，使用相同的标准控制进行\
  \ `Move`（`G`）、`Rotate`（`R`）和 `Scale`（`S`）操作。\n\n在 `Pose Mode` 中为骨架设定姿态，在技术上不同于绑定师所做的在\
  \ `Edit Mode` 中编辑骨架。我们无法编辑链接骨架物体中的骨骼，在制作动画时也不应该需要这样做。\n\n**重要提示**\n\n在 `Pose Mode`\
  \ 下，你无法添加或选择其他物体；必须返回 `Object Mode` 才能进行这些操作。\n\n由于 Rain 的控制骨骼具有复杂的关系，且不会直接变形其网格，因此变换某个特定骨骼的结果并不总是可预测的。虽然某个骨骼的形状及其在\
  \ Rain 身体上的位置能提供关于该骨骼功能的线索，但了解骨骼功能的唯一可靠方法是移动它并观察会发生什么。\n\n**提示**\n\n不要害怕移动某个骨骼来查看其功能。你随时可以\
  \ `Undo`（`Ctrl` + `Z`），或在确认变换前使用右键或 `Esc` 取消变换。此外，在下一节中，我将向你展示如何重置在 `Pose Mode`\
  \ 下对骨骼所做的任何更改。\n\n### 设定躯干和臀部的姿态\n\n我们从哪根骨骼开始？在最初为角色设定姿态时，通常最好从控制躯干整体位置的骨骼开始。对于\
  \ Rain 来说，这是 `MSTR-Pelvis_Parent`。如果你难以找到它，它是 Rain 臀部周围那根四叶草形状的骨骼。\n\n**提示**\n\n\
  要一目了然地查看 Rain 的骨骼名称，请前往骨架的 `Object Data Properties` 区域，找到 `Viewport Display` 面板，并启用\
  \ `Show` | `Names`。稍后当我们取消隐藏更多骨架层时，你可能想要禁用此选项。\n\n我们将使用 `MSTR-Pelvis_Parent` 给 Rain\
  \ 的腿留出一点弯曲空间：\n\n1.  进入 `Pose Mode` 并选择 `MSTR-Pelvis_Parent`。\n2.  沿全局 *Z* 轴向下移动\
  \ `MSTR-Pelvis_Parent` 约 **-0.02** 米。\n\n现在让我们使用名为 `MSTR-Hips` 的马鞍形骨骼将 Rain 的臀部向右摆动：\n\
  \n1.  选择 `MSTR-Hips`。\n2.  沿全局 *Y* 轴旋转 `MSTR-Hips` 约 **10** 度。\n\n仅仅对这两根骨骼进行这些细微的改动，Rain\
  \ 看起来就更放松、更自然了。她开始不再像一个模特人台，而更像一个真实的人！\n\n![Figure 6.21: Subtle difference in pose](img/Figure_06.21.0_B17149.jpg)\n\
  \nFigure 6.21: 姿态的细微差别\n\n请注意，`MSTR-Pelvis` 和 `MSTR-Hips` 都会移动 Rain 的臀部，但其中一个是另一个的子骨骼，影响范围更局部。这个极端的例子展示了两者的区别：\n\
  \n![Figure 6.22: Making Rain squat with MSTR-Pelivs versus MSTR-Hips](img/Figure_06.22.0_B17149.jpg)\n\
  \nFigure 6.22: 使用 MSTR-Pelvis 与 MSTR-Hips 让 Rain 下蹲的对比\n\n骨骼能动并不总意味着它就该动！话虽如此，你大可放心尝试。在姿态模式下，对骨骼的所有更改都是可逆的，没有意外删除或破坏任何东西的危险。如果有骨骼弯曲得太过分，只需记住以下操作符来重置它……\n\
  \n### “取消姿态”已设定姿态的骨骼\n\n每根骨骼都有一个**休息位置**——即在我们于 `Pose Mode` 中变换它之前的初始位置。设定完骨骼姿态后，我们稍后经常想将它们重置为休息位置。这对于在进入下一个姿态前“放松”骨骼使其脱离当前姿态很有用，以确保\
  \ Rain 不会带着任何轻微脱臼的关节四处走动，或者只是在胡闹一番后恢复理智……\n\n![Figure 6.23: There’s an easy way\
  \ to fix this](img/Figure_06.23.0_B17149.jpg)\n\nFigure 6.23: 有简单的方法可以修复这个问题\n\n\
  在前面的例子中，我把 `MSTR-Pelvis` 放在了一个荒谬的位置。要修复这个问题，无需尝试手动把 `MSTR-Pelvis` 放回原处，也无需数值化地重置其所有变换数值。我只需选择有问题的骨骼，然后执行\
  \ `Pose` | `Clear Transform`：\n\n![Figure 6.24: Clear Transform operators](img/Figure_06.24.0_B17149.jpg)\n\
  \nFigure 6.24: 清除变换操作符\n\n使用 `Pose` | `Clear Transform` | `All` 可将 `MSTR-Pelvis`\
  \ 恢复到初始位置，从该位置重新开始设定姿态会更容易。\n\n**提示**\n\n除了 `Pose` | `Clear Transform` | `All`，三个主要的\
  \ `Pose` | `Transform` 操作符（`Move`（`G`）、`Rotate`（`R`）和 `Scale`（`S`））各自都有对应的 `Pose`\
  \ | `Clear Transform` 操作符：`Location`（`Alt` + `G`）、`Rotation`（`Alt` + `R`）和 `Scale`（`Alt`\
  \ + `S`）。它们的工作方式与 `Object Mode` 中的 `Object` | `Clear` 操作符相同，但在角色动画中特别有用。\n\n既然我们知道如何快速重置任何骨骼，在设定姿态时尝试各种操作就毫无顾虑了。我们在\
  \ `Pose Mode` 中所做的任何更改，无论多么荒谬或扭曲，都可以撤销。\n\n## IK 骨骼\n\n看看 Rain 的脚，注意当我们移动她的臀部和躯干时，她的脚保持静止，导致膝盖弯曲。目前，Rain\
  \ 的脚由 `MSTR-Foot_Parent.L` 和 `MSTR-Foot_Parent.R` 骨骼控制，它们默认独立于我们之前移动的那些骨骼。\n\n**提示**\n\
  \n因为人和生物在 *X* 轴上往往是对称的，所以许多骨架骨骼成镜像对出现——一根用于左侧，一根用于右侧。这些对中的骨骼名称相同，仅后缀为 *L* 或 *R*\
  \ 有所不同。\n\n让我们看看移动左脚骨骼会发生什么：\n\n1.  选择 `MSTR-Foot_Parent.L`（这是 Rain 左脚鞋周围那根鞋形骨骼）。\n\
  2.  沿全局 *Z* 轴向外旋转该骨骼约 **20** 度。\n3.  沿全局 *X* 轴向 Rain 的左侧移动该骨骼约 **0.2** 米。\n4.  沿全局\
  \ *Y* 轴向后移动该骨骼约 **0.1** 米。\n\n再加上几处不对称调整，就构成了 Rain 姿态那种放松的外观：\n\n![Figure 6.25:\
  \ A casual, natural-looking leg stance](img/Figure_06.25.0_B17149.jpg)\n\nFigure\
  \ 6.25: 休闲、自然的腿部站姿\n\n\n\n你注意到了吗？每次我们移动这些骨骼时发生的小小奇迹？这不关乎我们移动的骨骼，而是关乎那些我们**不必**直接移动的骨骼：确切地说，是腿部本身的骨骼。在一种特殊约束的帮助下，每条腿中一串隐藏的相连骨骼利用髋部和脚部的相对位置，来确定腿部会如何在膝盖处伸展或弯曲。\n\
  \n这种机制被称为 `IK`，没有它，为跳跃或行走等“简单”动作制作动画将会是一场不小的噩梦。有了 `IK`，我们可以设定两个作为独立控制点的骨骼的位置，然后让绑定自动弯曲或拉伸中间的骨骼。想象一下，如果不得不微调大腿骨和小腿骨的旋转，仅仅为了在躯干移动时防止脚部在地面上滑动，那该多麻烦。这足以让大多数动画师想放弃！\n\
  \n## IK 手部\n\nRain 的骨架有五条 `IK 链` —— 也就是说，她有五个主要部位可以通过 `IK` 机制来控制。前两条控制她的左腿和右腿；可以说这些是最需要\
  \ `IK` 的肢体。另外两条在手臂上，通过手和肩膀的相对位置来弯曲手肘。最后，第五条可用于利用髋部和胸部的相对位置来弯曲或拉伸脊柱。\n\n和腿部一样，Rain\
  \ 手臂的 `IK` 机制默认是启用的。她的手正好停留在我们之前隐藏其几何体时的位置：\n\n![Figure 6.26: Rain's arms, unhidden](img/Figure_06.26.0_B17149.jpg)\n\
  \nFigure 6.26: Rain's arms, unhidden\n\n有点分心……现在你明白为什么有时保持部位隐藏会有帮助了。\n\n现在让我们取消隐藏\
  \ Rain 的手臂，并用另一根 `IK` 骨骼让她的手搭在髋部上：\n\n1.  前往 `Outfits` 面板并禁用 `Mask Arms`。\n2.  选中\
  \ `IK-Hand_Parent.R`（Rain 右手周围那根马鞍形状的骨骼）。\n3.  移动并旋转 `IK-Hand_Parent.R`，使 Rain 右手的手背舒适地搭在她的右髋部上。\n\
  \n现在 Rain 的右大拇指应该朝向她的身后：\n\n![Figure 6.27: Rain's new hand pose](img/Figure_06.27.0_B17149.jpg)\n\
  \nFigure 6.27: Rain's new hand pose\n\n这是一个舒适姿势的开端，但 Rain 的右手腕，连同她右臂的其余部分，看起来一点也不舒服。\n\
  \n### IK 极点目标\n\n驱动 `IK` 约束的算法被称为 `IK 求解器`，因为中间的骨骼必须为 `IK 链` 两端的两个独立目标点的相对位置提供一个关于它们“应该”如何弯曲的“解决方案”。在我们移动\
  \ Rain 的手后，`IK` 求解器确实给出了这样一个解决方案，尽管这次不是个好方案。在将手肘弯曲到恰到好处的程度后，`IK` 求解器还留下了一件模棱两可的事：手肘应该朝哪个方向？\n\
  \n这个问题可以用 `IK 极点目标` 来回答：\n\n1.  选中 `IK-Pole_Forearm.R`（那根末端连着一条线、看起来像在“拉”右手肘的骨骼）。\n\
  2.  向外和向前移动这根骨骼，使 Rain 的手肘向她的右侧弯出：\n\n![Figure 6.28: A relaxed-looking elbow pose](img/Figure_06.28.0_B17149.jpg)\n\
  \nFigure 6.28: A relaxed-looking elbow pose\n\n这看起来好多了 —— 更像你自己尝试做同一个姿势时手臂的样子。事实上，为什么不现在就试着做一下作为参考？\n\
  \n我们的待机姿势正在成型，但剩下最明显的问题是 Rain 的另一只手臂。接下来，我们要让那只手臂自然下垂，但不使用 `IK` 骨骼。\n\n## FK 骨骼\n\
  \n我们并不总想用 `IK` 层中的骨骼来为 Rain 的每个肢体摆姿势。`IK` 求解器解决的每个问题，往往都伴随着同等的缺点。例如，如果我们想让 Rain\
  \ 的左臂只是直直下垂怎么办？如果我们不在乎 Rain 左手的确切位置，`IK` 求解器就是不必要且笨重的。我们只想让它悬垂在 Rain 左臂的末端。我们更关心左手肘的角度，而不是左手的位置；我们希望它保持伸直，不弯曲、不拉伸\
  \ —— 这与右臂遇到的问题截然相反！\n\n作为一个高级角色绑定，Rain 有多种方式来为肢体摆姿势。我们需要的不是 `反向运动学`，而是 `正向运动学`，即\
  \ `FK`。Rain 绑定中的五条 `IK 链`，每条都有一条对应的 `FK 骨骼链` 可供替代使用。\n\n当我们移动第一根 `FK` 骨骼时，将很容易看出\
  \ `IK` 和 `FK` 的区别，但我们首先需要取消隐藏它们并启用它们的影响力。让我们把注意力转回到我们最初隐藏的 `FK` 层中的那些骨骼上。\n\n###\
  \ 从 IK 切换到 FK\n\n就移动一串相连骨骼而言，`IK` 和 `FK` 是逻辑完全相反、无法调和的两种方法。两套系统都需要单独的隐藏骨骼链。要让一条链控制肢体，就必须剥夺另一条链的控制权。\n\
  \n默认情况下，Rain 的手臂和腿完全由 `IK` 骨骼控制，与之对应的 `FK` 骨骼将不起任何作用。要确定某个肢体受其 `FK` 还是 `IK` 骨骼影响，请使用\
  \ `CloudRig` 界面中的以下属性：\n\n![Figure 6.29: The FK/IK Switch panel](img/Figure_06.29.0_B17149.jpg)\n\
  \nFigure 6.29: The FK/IK Switch panel\n\n1.  启用 `FK` 骨骼层。\n2.  在 `Settings` 面板中找到\
  \ `FK/IK` 部分。\n3.  将 `FK/IK Switch` | `Left Arm` 设为 `0.0`。\n\n你应该能看到 Rain 的左臂从跟随一组骨骼切换为跟随另一组。这条手臂现在变成了\
  \ `FK` 手臂，我们准备好使用它的 `FK` 骨骼了。\n\n> **Tip**\n>\n> `FK/IK Switch` 的值通常是 `0.0` 代表 `FK`，或\
  \ `1.0` 代表 `IK`。中间值主要用于在属性动画时，在 `FK` 和 `IK` 之间进行短暂、平滑的过渡。你极少需要设置像 `0.3` 这样的值。\n\n\
  ### 摆放 FK 骨骼\n\n现在，我们可以用 `FK` 为 Rain 的左臂摆姿势了：\n\n1.  选中 `FK-Upperarm_Parent.L`（那根看起来像套在\
  \ Rain 左上臂上的护臂形状的骨骼）。\n2.  绕全局 `Y` 轴向下旋转 `FK-Upperarm_Parent.L` 约 `75` 度。\n\n现在\
  \ Rain 的左手应该触碰或悬停在她的左大腿上：\n\n![Figure 6.30: Left arm pose](img/Figure_06.30.0_B17149.jpg)\n\
  \nFigure 6.30: Left arm pose\n\n这很简单！使用 `FK` 通常比 `IK` 更简单。`FK` 骨骼给我们提供关节的直接控制，且关系直观；`FK-Upperarm_Parent.L`\
  \ 是 `FK-Forearm.L` 的父级，后者又是 `FK-Hand.L` 的父级，以此类推。\n\n> **Tip**\n>\n> 与 `IK` 骨骼（大多用于移动和旋转）不同，Rain\
  \ 绑定中的 `FK` 骨骼通常**只**用于旋转。虽然有时也可以移动它们，但我们通常只应这样做以进行细微修正。\n\n#### FK 脊柱\n\n沿着 Rain\
  \ 躯干延伸的 `FK` 骨骼默认是启用的。现在让我们用它们给她的脊柱增加一些弯曲，从链条开始处的 `FK` 骨骼开始向上操作：\n\n1.  选中 `FK-Spine`（Rain\
  \ 髋部周围的腰带）。\n2.  绕全局 `Y` 轴旋转 `FK-Spine` 约 `5` 度。这会让 Rain 最初向左倾斜。\n3.  选中 `FK-RibCage`（上面那根）并绕全局\
  \ `Y` 轴向相反方向旋转约 `-5` 度。\n4.  继续向上，绕全局 `Y` 轴旋转 `FK-Chest` 约 `-5` 度。\n5.  绕全局 `Y`\
  \ 轴再旋转 `FK-Neck` 约 `-5` 度。\n6.  最后，绕全局 `Y` 轴旋转 `FK-Head` 约 `5` 度，将她的头向左倾回。\n\n这给\
  \ Rain 的站姿带来了一个漂亮的 S 形曲线：\n\n![Figure 6.31: Effect of posing the spine](img/Figure_06.31.0_B17149.jpg)\n\
  \nFigure 6.31: Effect of posing the spine\n\n\n\n\n然而，我们在摆姿势让 Rain 的左臂下垂所做的努力付诸东流了——它不再像以前那样自然下垂。我们可以利用\
  \ Rain 的另一个功能来解决这个问题。\n\n## 肩部与 FK 铰链\n\n父子关系中的元素不仅具有依赖性，还具有**继承性**；即子级从父级继承变换。这对骨骼和物体都适用，但在我们这种情况下，这对\
  \ `FK` 骨骼尤为重要。\n\n当使用 `FK` 时，上臂会从肩部间接继承旋转。当我们旋转 Rain 的左肩（或导致其旋转）时，它会刚性地带动左臂旋转，就好像它们属于同一条\
  \ `FK` 链。这在某些情况下是可取的，在另一些情况下则不然，因此绑定师赋予了我们选择某些 `FK` 骨骼是否应继承旋转的能力。\n\n### 使用铰链\n\n\
  当 `FK` 骨骼不再从链条上方的父级继承旋转时，这种效果被称为**铰链**。试着耸耸自己的肩膀作为参考；即使你刚刚旋转了锁骨，你的手臂仍大致保持着下垂的角度。\n\
  \n这就是 `FK 铰链`。让我们在 Rain 身上试一下：\n\n1.  在 `CloudRig` 界面的 `Settings` 面板中找到 `FK Settings`\
  \ 部分。\n2.  将 `FK Hinge` | `Left Arm` 设置为 `1.0`。\n\nRain 的左臂恢复到了原来的位置（右臂仍在使用 `IK`，因此它毫无问题地处理了我们对脊柱的所有更改）。`FK\
  \ 铰链` 很有用，因为它允许我们调整角色的脊柱和肩部，而不影响其 `FK` 手臂的旋转。\n\n### 肩部——“身体的眉毛”\n\n现在两只手臂都不再从肩部继承旋转，我们可以更自由地摆姿势肩部骨骼：\n\
  \n1.  将 `MSTR-Clavicle.R` 稍微向下和向前旋转一点，以放松 Rain 的右肩。\n2.  将 `MSTR-Clavicle.L` 稍微向上旋转一点，以平衡她的右肩并强调她姿势中的曲线。\n\
  \n现在 Rain 的整体姿势完成了！\n\n![Figure 6.32: A nearly finished pose](img/Figure_06.32.0_B17149.jpg)\n\
  \nFigure 6.32: 一个近乎完成的姿势\n\nRain 绑定中庞大的骨骼数量和额外的骨架层可能令人望而生畏，但事实证明，仅 `IK` 和 `FK` 骨骼就能让我们完成完成姿势的一半以上工作。\n\
  \n## 手指、面部和其他配件\n\n在为角色摆姿势或制作动画时，一个通用的经验法则是从角色中心开始，向外扩展。从解剖学角度来看，这意味着从 Rain 位于骨盆处的重心开始，然后摆姿势脚、手和头。现在，我们准备摆姿势细节，如手指和面部表情，最后是\
  \ Rain 的“非生命”特征——她的头发和围巾。\n\n> **Tip**\n>\n> Blender 的 `Object Gizmos`（特别是 `Move`\
  \ 和 `Rotate`）有助于消除在变换骨骼时该使用哪个局部轴的猜测，并且对于快速摆姿势大量小骨骼非常方便，这正是我们在本节将要做的。考虑前往 3D 视口 `Header`\
  \ 区域的 `Viewport Gizmos` 菜单并启用它们。\n\n### 摆弄手指\n\n让我们继续处理 `Fingers` 层中的骨骼：\n\n![Figure\
  \ 6.33: Rain's finger controls](img/Figure_06.33.0_B17149.jpg)\n\nFigure 6.33: Rain\
  \ 的手指控制器\n\nRain 的手指控制器相当简单；每个手指一条 `FK` 链，包含每个指骨和掌骨的骨骼。虽然每只手可能总共有 19 根骨骼，但如果你知道一些快捷键，摆姿势并不难。\n\
  \n> **Important note**\n>\n> 从这一点开始，你需要负责显示和隐藏骨架层。好在绑定师贴心地给它们加上了标签！\n\n#### 使用各自的局部轴\n\
  \n取消隐藏手指骨骼后，让我们启用一些设置，以便一次性轻松摆姿势多根手指骨骼：\n\n1.  在 3D 视口 `Header` 区域，将 `Transform\
  \ Orientation` 改为 `Local`。\n2.  将 `Transform Pivot Point` 改为 `Individual Origins`：\n\
  \n![Figure 6.34: New transform settings in the 3D Viewport Header area](img/Figure_06.34.0_B17149.jpg)\n\
  \nFigure 6.34: 3D 视口 Header 区域的新变换设置\n\n有了这些设置，我们可以在每根骨骼各自的局部轴上同时旋转多个指骨。\n\n> **Important\
  \ note**\n>\n> 请密切注意你应该在 `global XYZ` 轴还是某个 `local XYZ` 轴上变换物体。注意 Rain 的手指骨骼相对于任何全局轴都是错位的；现在如果在单一全局轴上旋转它们毫无益处。由于我们旋转了依赖链上方的父骨骼，许多其他骨骼也是这种情况。\n\
  \n#### 弯曲指骨\n\n有了我们启用的设置，弯曲 Rain 手指中所有的 `FK` 骨骼只需两步：\n\n1.  选择 `Fingers` 层中的每一根骨骼（掌心的掌骨除外——它们不该弯曲太多）。\n\
  2.  在局部 `X` 轴上稍微旋转选择集，使手指放松，而不是笔直伸出：\n\n![Figure 6.35: A casual hand pose](img/Figure_06.35.0_B17149.jpg)\n\
  \nFigure 6.35: 一个随意的手部姿势\n\n这可是一次性摆姿势 30 根骨骼的好方法！如果你愿意，可以回去微调几根单独的骨骼以增加韵味：\n\n![Figure\
  \ 6.36: An even more casual hand pose](img/Figure_06.36.0_B17149.jpg)\n\nFigure\
  \ 6.36: 一个更加随意的手部姿势\n\n暂时这样就够了；当我们让 Rain 拿起物体时，我们将有大量时间来摆弄她的手指。\n\n### 面部表情，或“摆姿势面部骨骼”\n\
  \n当我们启用 `Face Primary` 层时，迎接我们的骨骼数量比前三个骨架层的总和还要多：\n\n![Figure 6.37: Rain's \"face\
  \ bones\"](img/Figure_06.37.0_B17149.jpg)\n\nFigure 6.37: Rain 的“面部骨骼”\n\n骨骼的存在并不意味着我们必须摆姿势它，所以别担心！别难过！笑一个！微笑比皱眉用的肌肉少，而在\
  \ Rain 的面部绑定中，让 Rain 微笑所需的骨骼甚至更少。\n\n让我们试着摆一个放松的微笑：\n\n1.  控制嘴角的两根骨骼是黄色的盒子 `ACT-Lips_Corner.L`\
  \ 和 `ACT-Lips_Corner.R`。分别选中它们，并将它们向 Rain 的耳朵方向移动一小段距离。\n2.  选中 Rain 的两根上眼睑骨骼 `ACT-Eyelid_Upper.L`\
  \ 和 `ACT-Eyelid_Upper.R`，并在它们的局部 `Y` 轴上向下移动一小点。\n\n> **Tip**\n>\n> 真实的微笑会将嘴角向后拉向颧骨，而不是直接向上或向外。如果是真心的大笑，还会提升面颊并降低下眼睑。\n\
  \n仅此而已，就能从中性面部变为平静、快乐的面部：\n\n![Figure 6.38: A gentle smile](img/Figure_06.38.0_B17149.jpg)\n\
  \nFigure 6.38: 一个温和的微笑\n\n> **Tip**\n>\n> 在 3D 视口中暂时禁用 `Show Overlays`，以便在没有骨骼干扰的情况下更好地观察\
  \ Rain。\n\n如果你愿意，继续完善表情，从主要的黄色骨骼开始，然后微调次要的绿色骨骼。对 Rain 眉毛稍作调整，似乎勾起了她的好奇心：\n\n![Figure\
  \ 6.39: Further adjustment of the eyebrows](img/Figure_06.39.0_B17149.jpg)\n\nFigure\
  \ 6.39: 眉毛的进一步调整\n\n一些面部骨骼（如眼睑骨骼）受到绑定师的约束，使其无法摆得太“错”。然而，其他骨骼可以自由移动，如果不小心操作它们，会造成噩梦般的后果：\n\
  \n![Figure 6.40: Aaaaaagh!](img/Figure_06.40.0_B17149.jpg)\n\nFigure 6.40: 啊啊啊啊！\n\
  \n前面的例子甚至还不算最糟！至少她的眼睛目前还朝着正确的方向……\n\n#### 眼球目标\n\n角色视线的方向（即他们在看什么）在角色动画中至关重要。这由几根骨骼控制，你可能没注意到它们，因为它们漂浮在\
  \ Rain 脸前约一臂远的地方：\n\n![Figure 6.41: The eye target bones](img/Figure_06.41.0_B17149.jpg)\n\
  \nFigure 6.41: 眼球目标骨骼\n\n\n\n\n我们可以使用**眼球目标**来确定 Rain 眼球的朝向，而不必直接旋转眼球。这在 Rain 需要注视特定物体时，能让姿势摆设和动画制作变得更容易。\n\
  \n要了解其工作原理，让我们回到 **FK** 层中的一根骨骼：\n\n1.  找到并选中 `FK-Head`。\n2.  在全局 `Z` 轴上旋转 `FK-Head`，将\
  \ Rain 的头稍微转向一侧。\n\n注意 Rain 的视线始终锁定在眼球目标骨骼上，导致她斜眼看我们：\n\n![图 6.42：Rain 保持注视眼球目标](img/Figure_06.42.0_B17149.jpg)\n\
  \n图 6.42：Rain 保持注视眼球目标\n\n至此，你已了解眼球目标骨骼的工作原理，甚至不需要移动它！只需确保这些骨骼始终位于 Rain 面部前方；否则，她最终会看向自己的后脑勺。\n\
  \n> **提示**\n>\n> 如果不想在 Rain 头部移动时操心眼球目标骨骼，可以前往 `Face Settings` 面板，将 `Eye Target\
  \ Parent` 改为 `Head`。该面板还允许你调整 Rain 眼球旋转对眼睑和周围皮肤的影响程度。\n\nRain 的姿势已近完成——剩下的只是摆放之前隐藏的配饰。\n\
  \n### 最后的配饰\n\n取消隐藏 Rain 的头发和围巾后，我们发现还有一点工作要做：\n\n![图 6.43：Rain 的围巾和马尾，未摆姿势](img/Figure_06.43.0_B17149.jpg)\n\
  \n图 6.43：Rain 的围巾和马尾，未摆姿势\n\n头发和宽松衣物不像其他部位那样对角色姿势有贡献。它们没有自己的肌肉，只是垂在那里，对重力、Rain 的动作以及风做出反应。难怪我们想在完成其他所有姿势之前先隐藏这些部分。\n\
  \n让我们把配饰还给 Rain，并让它们自然下垂：\n\n1.  取消隐藏 `Hair` 和 `Clothes` 骨架层，并在 `Outfits` 面板中启用\
  \ `Scarf`、`Hair Strand` 和 `Hair Ponytail`。\n2.  摆放 Rain 的马尾，使其看起来自然下垂。从头部向外旋转红色的\
  \ `FK` 骨骼开始，然后使用球形拉伸骨骼微调结果。\n3.  用相同方法摆放 Rain 的围巾（本例中发丝可保持不动）。\n\n现在 Rain 的站立姿势完成了。比她最初的\
  \ `T` 姿势好多了！\n\n![图 6.44：完成的站立姿势](img/Figure_06.44.0_B17149.jpg)\n\n图 6.44：完成的站立姿势\n\
  \n虽然我们的第一个姿势表面上看很简单，但即使是这一个也花了一些时间，并要求我们利用 Rain 的许多功能。随着练习的深入，给角色摆姿势会变得越来越容易！\n\n\
  话虽如此，让我们之前的工作白费可不划算。为此，我将展示如何保存和复用我们制作的任何姿势，以便在后续动画中使用。\n\n## 创建姿势库\n\n角色动画本质上只是一系列经过精炼的姿势，因此通过创建更多姿势进行练习，我们能学到很多。传达动作、重量、力量、张力、思考和情感的姿势，都是制作引人入胜的动画的要素。而且因为制作一个姿势可能需要一段时间，你可能想在后续动画中复用其中一些！\n\
  \n让我们学习如何保存姿势，以便保留当前姿势供后续练习使用。\n\n## 资产浏览器\n\n除了模型和材质，Blender 的新 `Asset Browser`\
  \ 还能存储我们为角色制作的姿势。\n\n现在打开它。为了自动为每个姿势创建缩略图，我们还需要在场景中添加一个摄像机：\n\n1.  切换到 `Object Mode`，按\
  \ `Shift` + `A` 添加一个 `Camera` 对象到场景中。\n2.  将摄像机对准 Rain。\n3.  在新区域中打开 `Asset Browser`\
  \ 区域。\n4.  在左侧 `Source List`（`T`）区域中，将 `Asset Library` 从 `All` 改为 `Current File`。\n\
  5.  点击 `+` 创建一个 `New Asset Catalog` 项。\n6.  将其命名为 `Rain Poses`。\n\n现在我们有了一个空目录：\n\
  \n![图 6.45：资产浏览器中的目录（当前为空）](img/Figure_06.45.0_B17149.jpg)\n\n图 6.45：资产浏览器中的目录（当前为空）\n\
  \n我们制作的任何喜欢的姿势都可以存在这里。让我们从已制作的站立姿势开始。\n\n## 创建姿势资产\n\n要将姿势存储为资产，请按以下步骤操作：\n\n1.\
  \  选中姿势涉及的所有骨骼。\n2.  在 `Asset Browser` 区域中，点击 `Asset` | `Create Pose Asset`。\n3.\
  \  在 `Asset Browser` 区域右侧边栏（`N`）中更新 `Name` 属性，给姿势起一个更具描述性的名称。\n\n点击 `Create Pose\
  \ Asset` 时，所选骨骼所在的位置，就是该姿势日后应用时的位置。\n\n“姿势涉及的所有骨骼”指我们希望在将该姿势应用到新项目中的 Rain 时受影响的所有骨骼。这包括我们摆过姿势的所有骨骼，但也可能（或不妨）包括一些未摆姿势的骨骼。对于当前的站立姿势，我们可以直接选中已用图层中的所有骨骼。对于更局部的姿势，可以使用更窄的骨骼选择。例如，仅选面部骨骼做表情，或仅选手指骨骼做“手部姿势”（如握拳）。\n\
  \n> **重要提示**\n>\n> 存储 `CloudRig` 属性（如 `IK/FK Switch`）的骨骼不在可见图层上，因此不会作为姿势的一部分被保存。我们得自己记得调整这些设置。\n\
  \n试一下。这是我们在 `Asset Browser` 区域中的第一个姿势：\n\n![图 6.46：保存为资产的站立姿势](img/Figure_06.46.0_B17149.jpg)\n\
  \n图 6.46：保存为资产的站立姿势\n\n> **提示**\n>\n> 你可以随时在右侧边栏（`N`）的 `Preview` 面板中更新资产的缩略图。\n\n\
  保存当前姿势后，我们准备制作另一个！你可以选中所有摆过姿势的骨骼，使用 `Pose` | `Clear Transform` | `All` 将 Rain 重置为原始休息姿势；或者，如果你愿意，也可以基于现有姿势在下一节中制作新姿势。\n\
  \n## 练习姿势\n\n我们不再按部就班地摆姿势了；你现在对骨架图层、`CloudRig` 功能以及在姿势模式下操控骨骼已有足够了解，可以自行创建更多姿势。每次创建一个喜欢的姿势，都可以用\
  \ `Create Pose Asset` 存入 `Asset Browser` 区域。\n\n> **提示**\n>\n> 摆姿势时以自己的身体为参考；离开电脑，试着做出你想重现的姿势！有时镜子对面部表情很有帮助。\n\
  \n### 更多简单姿势\n\n尝试制作任意数量的常见姿势。如果保存下来，说不定日后在动画中会用得上。\n\n#### 站立\n\n站立不止一种方式。基于刚才制作的现有姿势，我们可以探索脚、手臂和脊柱的替代位置：\n\
  \n![图 6.47：站立姿势——倾斜、交叉双臂、合十双手](img/Figure_06.47.0_B17149.jpg)\n\n图 6.47：站立姿势——倾斜、交叉双臂、合十双手\n\
  \n接下来，我们尝试对 Rain 容易但对我们稍具挑战的事：坐着！\n\n#### 坐着和/或躺着\n\n试着用立方体作为椅子和桌子的简单参考。对于完全躺卧的姿势，可以对所有肢体使用\
  \ `FK`：\n\n![图 6.48：躺卧姿势](img/Figure_06.48.0_B17149.jpg)\n\n图 6.48：躺卧姿势\n\n坐着或睡着的角色与地面和/或家具有更多接触点。所以具有讽刺意味的是，角色越放松，我们要做的工作越多。\n\
  \n现在让我们看看在面部表情上能有多大创意。\n\n### 面部表情\n\n以下是几个可尝试的面部表情示例。记住，先尽可能利用 `Face Primary` 图层中的黄色骨骼，再用其他骨骼微调表情：\n\
  \n\n\n"
- "## 第 7 章：基础角色动画\n\n## 进阶姿势\n\n说实话，这些姿势并没有什么“进阶”的。狂野、夸张的姿势实际上可能比平常的姿势更容易做！\n\n![图\
  \ 6.51：一些更进阶的姿势](img/Figure_06.51.0_B17149.jpg)\n\n图 6.51：一些更进阶的姿势\n\n你还能做出多少其他姿势？继续练习；姿势制作需要大量的工作和练习，我们甚至还没添加任何关键帧呢！Rain\
  \ 的骨架非常先进，以至于我们不得不专门用一整章的篇幅来讲解如何使用她的骨架。本练习将是我们进行的最后一个非动画练习。\n\n请记得保存此文件，以便我们稍后复用站立姿势。\n\
  \n## 总结\n\n其他关于角色动画的书籍和教程，往往会试图在教你制作动画之前，先拖着你走过一段漫长的角色绑定章节。如果你偷瞄过 Rain 隐藏的骨架层，或者在\
  \ `Outliner`（大纲视图）区域查看过她所有的骨骼，你就能开始理解为什么我们跳过了那项特定任务。依我之见，在学会动画之前先学绑定，就像非得先造一辆自行车才能学骑车——总得有人造，但那个人不该是你。光是学会如何给\
  \ Rain 摆姿势就花了不少时间，要是还得自己给每根骨头命名，那可就更久了！\n\n提到角色绑定时，**Anatomy（解剖结构/解剖学）** 一词有双重含义。它可以指角色的形状和尺寸，也可以指骨架骨骼之间不可见的关系。一个高级角色绑定本身就是一个有机体；一个拥有自己“超解剖结构”的生物，其人形外表只是一种投影。Rain\
  \ 体内的结构不是人类的；它更像是两只蜘蛛、一只章鱼，外加一艘 17 世纪护卫舰的索具的混合体。我们爱死这个怪物了；它让制作动画变得有趣！\n\n既然已经学会了如何给\
  \ Rain 摆姿势，我们就准备好开始让她动起来了。正如之前提到的，3D 角色动画本质上是一个摆姿势、设关键帧、再摆姿势、再设关键帧……如此循环的过程。过不了多久，这就会创建出一个拥有成千上万个关键帧的动画，但这对\
  \ 3D 动画师来说不是问题。如果你知道如何使用它们，一千个关键帧和半打关键帧一样好用，这将在下一章中介绍。\n\n## 思考题\n\n1.  为什么组成角色的物体应该被组织到一个集合中？\n\
  2.  如果 Rain 已经在我们当前的 `.blend` 文件中，为什么这个文件比她来源的那个文件要小？\n3.  为什么像 `FK` 这样的绝对文件路径……？（注：原文句子似乎不完整或有误，直译为“Why\
  \ is an absolute file path like `FK`?”）\n4.  我们在哪里能找到那些不该制作动画的隐藏骨骼？\n5.  “Inverse\
  \ Kinematics（反向运动学）”中的“Inverse（反向）”可能意味着什么？\n6.  为什么 `IK` 对腿部比对手臂更关键？\n7.  尝试旋转\
  \ Rain 脚踝后方那些小小的圆形 `IK` 骨骼之一。那可能有什么用？\n8.  为什么我们应该最后摆姿势头发和围巾？我们最初为什么要隐藏这些东西？\n9.\
  \  如果 Rain 的骨骼更少，给她制作动画会更容易吗？\n\n## 技术要求\n\n和以前一样，要完成本章的练习，你当然需要 Blender（免费开源的 3D\
  \ 应用程序）和 Rain（免费的 Blender 角色绑定）。请参阅上一章获取 Rain 的下载链接，以及如何将她链接到场景中的详细说明。\n\n在上一章的练习中，我们还创建了一个站立姿势，并将其保存为资产。我们将在本章中复用该姿势，但如果你没有它或无法追加它，你可以像往常一样通过给\
  \ Rain 摆姿势来简单地重新创建它。\n\n## 在新场景中准备 Rain\n\n本章的动画将从第 6 章中为 Rain 制作的站立姿势开始。首先，当然，我们需要创建一个包含\
  \ Rain 的新场景。你还记得怎么做吗？\n\n### 关于将 Rain 链接到新项目的简要回顾\n\n这将是另一个 120 帧的动画，场景中除了 Rain\
  \ 什么都没有。如果你忘记了我们在 `Chapter 6` 开头为了将 Rain 引入新项目做了什么，这里有个快速复习。每次我们开始一个新的 Rain 角色动画时，请记住这些步骤：\n\
  \n1.  在 Blender 中启动一个新文件，前往 `File`（文件）| `Link`（链接）。\n2.  在调出的文件浏览器中导航到 Rain 的 `.blend`\
  \ 文件。\n3.  进入 `Collection`（集合）文件夹，选择集合 `CH-rain` 进行链接。\n4.  在场景中选中集合实例 `CH-rain`，前往\
  \ `Object`（物体）| `Relations`（关系）| `Make Library Override`（创建库覆盖）。\n5.  保存文件（`Ctrl`\
  \ + `S`），然后通过 `File`（文件）| `Revert`（恢复）重新加载它。\n6.  要开始摆姿势，选择 Rain 的骨架并进入 `Pose Mode`（姿势模式）（`Ctrl`\
  \ + `Tab`）。\n\n现在我们准备好再次给 Rain 摆姿势了：\n\n![图 7.1：Rain，刚链接进新场景](img/B17149_07_01.jpg)\n\
  \n图 7.1：Rain，刚链接进新场景\n\n我们还有大量的摆姿势工作要做，但为了在 Rain 的初始姿势上节省一点时间，我们可以调用上一章制作的那个姿势。\n\
  \n### 使用姿势资产\n\n就像 Rain 的物体集合和 Blender 中大多数其他形式的数据一样，我们之前制作的姿势是一个可以从一个 `.blend`\
  \ 文件链接或追加到另一个文件的 **datablock（数据块）**。我们将追加该姿势，以便它能在我们当前的动画中提供帮助。\n\n> **重要提示**\n\
  > 使用我们的站立姿势资产可以节省一些时间，但节省的不多。如果由于任何原因你无法正确应用我们要找的姿势，这也不是阻碍。就按第 6 章学到的方法手动再摆一遍姿势，然后继续下一节。\n\
  \n#### 将你的姿势添加到资产浏览器\n\n请遵循以下步骤检索站立姿势。这也将使上一练习中保存为资产的任何其他姿势可用：\n\n1.  前往 `User Preferences`（用户偏好设置）|\
  \ `File Paths`（文件路径）| `Asset Libraries`（资产库）。\n2.  点击 `Add Asset Library`（添加资产库）的加号（`+`）。\n\
  3.  找到包含你在上一章创建的文件的文件夹。\n4.  给新资产库起个更好的名字。\n\n现在我们有了一个新的资产库：\n\n\n\n\n![图 7.2：用户偏好设置中的新资产库](img/B17149_07_02.jpg)\n\
  \n图 7.2：用户偏好设置中的新资产库\n\n对于所选文件夹中的所有 `.blend` 文件，任何标记为资产的内容都将显示在 `Asset Browser`（资产浏览器）中：\n\
  \n![图 7.3：资产浏览器中的姿势](img/B17149_07_03.jpg)\n\n图 7.3：资产浏览器中的姿势\n\n让我们退出 `User Preferences`（用户偏好设置），现在前往那里。\n\
  \n## 从资产浏览器应用姿势\n\n要应用我们在上一章创建的站立姿势，请执行以下操作：\n\n1. 在 `Asset Browser`（资产浏览器）中，找到包含我们为\
  \ Rain 创建的站立姿势的 `Asset Library`（资产库）和 `Catalog`（目录）。\n2. 确保你处于 Rain 骨架的 `Pose Mode`（姿势模式），并且所有骨骼都已取消选择。\n\
  3. 双击上一章的站立姿势以应用它。\n4. 为了完成姿势，对 Rain 的 `CloudRig` 属性进行任何必要的调整，这些属性是从原始姿势中丢失的（例如她的\
  \ `FK/IK` `Switch`（切换）设置）。\n\n**重要提示**\n\n如果在应用姿势时骨架上的任何骨骼被选中，则所有其他骨骼将被忽略。为确保我们的站立姿势应用于整个骨架（包括隐藏骨骼），请务必在事先取消选择所有骨骼。\n\
  \n使用来自姿势库的姿势，我们可以迅速让 Rain 摆脱枯燥的 T 姿，并将她恢复到放松、自然的站立位置：\n\n![图 7.4：上一章中 Rain 的站立姿势](img/B17149_07_04.jpg)\n\
  \n图 7.4：上一章中 Rain 的站立姿势\n\n我们甚至不需要选择任何一个骨骼（至少目前还不需要）！\n\n我们现在在制作角色动画吗？严格来说，不是。从\
  \ `Asset Browser`（资产浏览器）应用的姿势不会与当前动画集成；它们只是一次性将属性应用到许多骨骼上，就好像我们刚刚自己为 Rain 摆姿势一样。\n\
  \n离开资产浏览器后，我们可以随心所欲地继续调整这里看到的姿势。有了 Rain 的良好起始姿势，我们几乎准备好插入第一组关键帧了。我们只需要再仔细检查一些设置，以确保我们的首次角色动画体验顺利进行。\n\
  \n## 为动画设置骨骼关系\n\nRain 骨骼的静态位置看起来不错，但有时它们的关系（或缺乏关系）会在骨骼开始移动时给我们带来麻烦。\n\n### IK Parents（IK\
  \ 父级）\n\n如前所述，你可以通过在 `3D Viewport`（3D 视口）中抓取骨骼并晃动它来测试骨骼。看看当我们移动 `MSTR-Pelvis_Parent`\
  \ 时会发生什么（或不会发生什么）：\n\n![图 7.5：移动 Rain 的躯干导致手被甩在身后](img/B17149_07_05.jpg)\n\n图 7.5：移动\
  \ Rain 的躯干导致手被甩在身后\n\n`IK-Hand_Parent.R` 骨骼保持在空间中固定，而不是粘附在她的臀部上。一旦我们开始认真制作动画，这可能会给我们带来麻烦。我们或许能够一起选择、摆姿势并为\
  \ `MSTR-Pelvis_Parent` 和 `IK-Hand_Parent.R` 设置关键帧，但这种方法可能很笨拙，且发生的任何意外位移都会显而易见。\n\
  \n如果一个骨骼成为另一个骨骼的父级会怎样？事实上，Rain 的每个 `IK` 目标骨骼都装配了一组有限的骨骼，如果动画师需要，它们可以充当其父级。\n\n你可以在\
  \ `CloudRig` 界面的 `IK Settings`（IK 设置）面板下的 `IK Parents`（IK 父级）中找到此功能：\n\n![图 7.6：CloudRig\
  \ 中的切换父级功能](img/B17149_07_06.jpg)\n\n图 7.6：CloudRig 中的切换父级功能\n\n**重要提示**\n\n使用 `Switch\
  \ Parent (Keep Transform)`（切换父级[保持变换]）操作符与仅更改 `IK Parents`（IK 父级）属性的值是不同的。使用此操作符会更改有效父级，并调整骨骼的名义变换值以补偿该更改，使其在视觉上保持静止。这类似于我们在\
  \ *第 4 章* 中设置物体原点时发生的情况，这是另一个在某一方面改变变换以便在另一个意义上“保持”它们的奇怪案例！\n\n最好现在就在插入关键帧之前进行此更改，而不是之后：\n\
  \n1. 在 `CloudRig` 界面中，找到 `IK Settings` | `IK Parents`（IK 设置 | IK 父级）。\n2. 点击 `Right\
  \ Arm`（右臂）属性旁边的菜单按钮。\n3. 在 `Switch Parent (Keep Transform)`（切换父级[保持变换]）对话框中，选择 `Torso`（躯干）。\n\
  4. 对于此动画，让我们确保 `CloudRig` 界面中的每一个其他 Parent（父级）设置的值均为 `0`（`Root`[根骨骼]）。\n\n现在我们可以自由地为\
  \ Rain 的躯干摆姿势和制作动画，她的手将始终保持在臀部上，即使她的肩膀移动也是如此。这是一个极端示例：\n\n![图 7.7：IK 目标帮助将 Rain\
  \ 的手保持在应有位置](img/B17149_07_07.jpg)\n\n图 7.7：IK 目标帮助将 Rain 的手保持在应有位置\n\n多么神奇的骨骼约束用法啊！不过，如果我们希望那只手在动画过程中离开她的身体侧面，该怎么办呢？\n\
  \n### 应用视觉变换\n\n如果你想寻找额外的挑战，你可以选择在下一节让 Rain 使用右臂挥手，而不是使用已经自由悬垂的左臂。\n\n不过，用 `FK`\
  \ 来做挥手动作比用 `IK` 更好，因此这将要求我们为右臂的 `FK/IK Switch`（FK/IK 切换）设置制作动画，使其在我们的动画过程中从 `1.0`（`IK`）变为\
  \ `0.0`（`FK`）。这样，Rain 的右臂将在适当的时候由其 `FK` 骨骼控制。\n\n看看当我们更改该属性时会发生什么：\n\n![图 7.8：从\
  \ IK 切换到 FK](img/B17149_07_08.jpg)\n\n图 7.8：从 IK 切换到 FK\n\n我们没有把那些 `FK` 骨骼放在一个很好的位置，对吧？\n\
  \n从 `IK` 到 `FK`（反之亦然）的“交接”是两个竞争方之间微妙的权力移交，应以一种不引人注目的方式微妙地处理。为了获得最佳效果，我们应该将 `FK`\
  \ 骨骼移动到与 `IK` 骨骼完全相同的位置，以便它们提前准备好接管对手臂的控制权。这样，变化就不会那么……剧烈。\n\n为了快速做好这一准备，我们可以在 `FK`\
  \ 骨骼仍受约束于 `IK` 链时应用其视觉变换：\n\n1. 确保 `CloudRig` | `FK Settings` | `FK Hinge` | `Right\
  \ Arm`（FK 设置 | FK 铰链 | 右臂）设置为 `1.0`。\n2. 选择右臂的 `FK` 骨骼：`FK-Upperarm_Parent.R`、`FK-Forearm.R`\
  \ 和 `FK-Hand.R`。\n3. 使用 `Pose` | `Apply`（`Ctrl` + `A`）| `Apply Visual Transform`\
  \ `to Pose`（应用视觉变换到姿势）。\n\n如果使用得当，该操作符似乎什么也没做，但当你将右臂从 `IK` 切换到 `FK` 时，右臂仍将保持在同一位置！\n\
  \n`Apply Visual Transform to Pose`（应用视觉变换到姿势）是一个方便的操作符，它会自动调整所选骨骼的名义变换值，以确认这些骨骼约束的视觉效果。换句话说，骨骼现在“想要”处于其约束将它们放置的位置，因此当约束稍后被禁用时，手臂将保持原位。然后可以从该起始位置为\
  \ `FK` 骨骼制作动画。\n\n现在，我们的初始姿势拥有所有正确的参数，包括那些效果尚不可见的变换，它几乎准备好为动画设置关键帧了！\n\n## 隐藏骨骼\n\
  \n我们的初始动画遍历将集中在 Rain 两个最重要的骨架层中的骨骼上：`IK` 和 `FK`。我们还将启用 `Face Primary`（主要面部）和 `Fingers`（手指）层，以便我们也可以练习为这些部分摆姿势。\n\
  \n这有助于缩小我们需要担心的骨骼范围，但我们可以更进一步。这些层仍然包含一些在本练习中绝对不需要制作动画的骨骼。例如，我们不需要 Rain 的腿部和脚部骨骼；走路对于本章来说太高级了！\n\
  \n现在隐藏一些骨骼，我们可以预先清理 `3D Viewport`（3D 视口）和显示所有关键帧的动画编辑器中的杂乱内容：\n\n\n\n\n1.  启用骨架层\
  \ `IK`、`FK`、`Fingers` 和 `Face Primary`。禁用所有其他层。\n\n2.  选择 Rain 腿部和脚部所有可见的骨骼。\n\n\
  3.  使用 `Pose`（姿势）| `Show/Hide`（显示/隐藏）| `Hide Selected`（隐藏选中项）(`H`)。\n\n4.  对本动画中不需要移动的其他几根骨骼重复步骤\
  \ 2 和 3：`ROOT`、`MSTR-Chest_Parent`、`IK-Hand_Parent.L`、`IK-Pole_Forearm.L`、`TGT-Eyes.L`\
  \ 和 `TGT-Eyes.R`。\n\n重要提示\n\n隐藏的骨骼稍后始终可以使用 `Reveal Selected`（显示选中项）(`Alt` + `H`)\
  \ 来显示。不用担心为什么它叫“`Reveal Selected`”，也不用担心在显示之前如何选择一根隐藏的骨骼。\n\n现在 Rain 的骨架看起来如下所示。请注意，我还利用上一章学到的\
  \ `Outfits`（服装）功能隐藏了 Rain 的头发和围巾物体：\n\n![Figure 7.9: The remaining visible bones\
  \ for our initial animation pass](img/B17149_07_09.jpg)\n\n图 7.9：我们初始动画通道的剩余可见骨骼\n\
  \n我们刚隐藏的骨骼并没有消失，但它们不再能在 3D 视口中被看到或选中。这对我们很方便，因为我们马上就要通过选择所有剩余骨骼来为第一个姿势设置关键帧了！\n\n\
  ## 为姿势骨骼设置关键帧\n\n在本练习的 5 秒动画中，Rain 将从站立待机开始。几秒钟后，屏幕外的某人会引起她的注意，Rain 将凝视远方以辨认此人。当她认出是朋友时，Rain\
  \ 会兴奋地向对方挥手。\n\nRain 到底看到了谁，留给大家想象。Rain 不会与任何东西互动，也不会去任何地方。她的手不会碰到任何东西，脚将保持着地。这不是一个宏大的场景，但即使是如此短的镜头也需要细致的关注。\n\
  \n那么，从哪里开始？从头开始？也许吧，但也不一定……\n\n## 定格动画或动画草稿\n\n在整个角色动画过程中，我们应牢记两条准则：\n\n*   **首先创建并设置最重要姿势的关键帧。**\
  \ 这些是“极限”姿势，单独来看就能清晰地传达角色所感所做的动作序列。你不总能确切知道每个姿势应设在哪一帧，但这没关系。在为这些姿势设置关键帧后，你可以调整它们的时机、编辑插值，并插入额外的关键帧，以优化角色从一个姿势过渡到下一个姿势时的运动。\n\
  \n*   **从角色中心向外制作动画。** 这意味着确立 Rain 躯干的位置和运动，比对头部、手臂和腿部做同样的事更重要，而后者又比手指和面部优先级高。最后，头发和衣服等应最后制作动画。请记住，你可以使用\
  \ `CloudRig` 界面在工作时临时隐藏 Rain 的某些部分，以免分心。\n\n在某种意义上，这两条准则是同一个想法的实用变体；即，我们应该在返回添加任何细节之前，先完成动画的粗略通道，无论是在解剖学意义上还是时间意义上。请注意，“从头开始”并不是准则之一，尽管在我们的例子中，没有理由从别处开始。\n\
  \n考虑到这一点，让我们看看本练习将制作的三个主要姿势。我们称它们为 `idle`（待机）、`looking`（注视）和 `waving`（挥手）：\n\n![Figure\
  \ 7.10: Three key poses: idle, looking, and waving](img/B17149_07_10.jpg)\n\n图 7.10：三个关键姿势：待机、注视和挥手\n\
  \n我们已经完成了第一个姿势。现在让我们为它设置关键帧。\n\n### 为“待机”姿势设置关键帧\n\n我们可以通过选择四个最重要图层上所有剩余骨骼，一次性为它们的变换属性设置关键帧，从而为整个姿势设置关键帧：\n\
  \n1.  转到第 `1` 帧。\n\n2.  全选 (`A`) 所有可见骨骼。\n\n3.  调用 `Insert Keyframe Menu`（插入关键帧菜单）(`I`)\
  \ 并选择 `Location, Rotation, & Scale`（位置、旋转和缩放）。\n\n4.  如果你打算让 Rain 挥动目前放在臀部的那只手，它稍后需要从\
  \ `IK` 切换到 `FK`。转到 `CloudRig` 界面，在 `1.0` (`IK`) 处为 `Right Arm FK/IK Switch`（右臂 FK/IK\
  \ 切换）数值设置关键帧。\n\n只需点击几下，我们就为那四个图层上每一根骨骼的 `Location`（位置）、`Rotation`（旋转）和 `Scale`（缩放）设置了关键帧。你目前还看不到它们，但这比本书迄今为止制作的所有其他动画的关键帧总数还要多！\n\
  \n为什么一次为这么多骨骼设置这么多关键帧？此后，我们是否有义务在每次插入新关键帧时都考虑每根骨骼的 `Location`、`Rotation` 和 `Scale`？不一定。虽然确实我们设置的关键帧比技术上所需的要多，但本章的工具将允许我们按骨骼查看动画通道，而不是按该骨骼的每个动画属性查看。稍后详述。\n\
  \n重要提示\n\n现在这么多骨骼的位置都已设置关键帧，你对它们所做的任何更改也必须设置关键帧；否则，当你切换到不同帧时，更改将会丢失。忘记为动画属性插入关键帧是导致挫败感的常见原因，尤其是在角色动画中，可能会花费大量时间只在一个姿势上。为了防止意外丢失工作，在完成姿势之前通过插入关键帧来“保存”姿势无伤大雅。\n\
  \n现在 Rain 的初始姿势已在第 `1` 帧设置关键帧，我们可以继续下一个姿势了。\n\n### “注视”姿势\n\n该创建一个完全不同的姿势了！在挥手之前，Rain\
  \ 必须凝视远方，看看是谁或什么引起了她的注意。\n\n一次性为这么多骨骼设置关键帧的一个好处是，我们省去了猜测在此阶段该为哪些骨骼设置姿势和关键帧的麻烦。我们用于制作动画的主要精力可以只集中在\
  \ `IK`、`FK`、`Fingers` 和 `Face Primary` 图层上（如果你对后两个图层偷懒我也不介意）。\n\n新手动画师在创建动画中的第二个姿势时往往胆小怕事，过度小心不让它与第一个姿势差异太大。不要害羞；关键姿势*就是*要看起来不同！如果它们之间的精确连贯性很重要，它们就不是关键姿势了。鼓励你重置并重新摆放你看到的任何骨骼。专注于让这个新姿势单独来看尽可能好。稍后我们有大把时间来纠结姿势之间的过渡。\n\
  \n开始工作吧：\n\n1.  转到第 `50` 帧并开始设置姿势。\n\n    在这一帧的姿势中，Rain 应直视一侧的某个隐形人物，并用整个躯干强烈地向对方倾斜。\n\
  \n    手臂通常平衡躯干的运动。在这种情况下，Rain 的手臂和肩膀应朝与她倾斜相反的方向僵硬地伸展。\n\n2.  使用 `Face Primary` 图层中的骨骼，将\
  \ Rain 的面部表情改为不确定的神情，眯起眼睛，因为在这一帧中她努力辨认所见之人。为 Rain 的眼球目标找个好位置，因为这将标记她所见之人的位置。\n\n\
  3.  再次为所有相同骨骼的 `Location`、`Rotation` 和 `Scale` 设置关键帧。也请记得为你更改的任何其他属性设置关键帧，例如 `FK/IK\
  \ Switch`。\n\n现在我们有两个姿势了！它们在一起如下所示：\n\n![Figure 7.11: \"Idle\" and \"Looking\" poses,\
  \ overlapped for contrast](img/B17149_07_11.jpg)\n\n图 7.11：重叠对比的“待机”和“注视”姿势\n\n\
  目前这两个姿势之间的过渡看起来会缓慢且别扭，但我们马上就会处理。我们还剩最后一个关键姿势。\n\n### “挥手”姿势\n\n我们的第三个姿势是 Rain 认出所见之人后的欣喜反应。和之前一样，我们希望这个关键姿势看起来几乎完全不同，仅保持\
  \ Rain 双脚着地的位置和视线方向。这意味着你应该保留的唯一可见骨骼就是眼球目标。\n\n\n\n\n## 重要提示\n\n尝试从`插入关键帧`菜单（`I`）中使用`可用`关键帧集，它仅为已有关键帧的选中骨骼/物体的属性插入关键帧。如果你稍后决定删除某些动画通道且不想意外地再次为这些属性添加关键帧，这将很有用。你在\
  \ CloudRig 界面看到的大多数属性属于隐藏骨骼，因此你仍需单独为它们添加关键帧。\n\n不要害怕在这里夸张；稍后放松姿势比加强姿势容易得多。你甚至可以让\
  \ Rain 的四肢稍微伸展一点点：\n\n1.  前往**第 80 帧**。\n2.  对于这个姿势，Rain 应该直立站立，并将一只手尽可能高地举起，手指伸直。确保执行此动作的手臂正在使用\
  \ `FK`。\n3.  无论你选择举起哪只手臂，都要让肩膀和脊柱的曲线跟随动作。特别是，举起手臂的那侧肩膀本身也应该大幅抬高。\n4.  认出朋友后，Rain\
  \ 的面部表情应该是兴奋的。\n5.  像之前一样为所有内容添加关键帧。\n\n这是我的最终姿势与前两个的对比：\n\n![图 7.12：重叠的“待机”、“观望”和“挥手”姿势](img/B17149_07_12.jpg)\n\
  \n图 7.12：重叠的“待机”、“观望”和“挥手”姿势\n\n这些关键姿势至关重要，所以我们要确保它们正确无误。\n\n## 复查我们的关键姿势\n\n完成后，检查你的三个关键姿势是否有错误。让你作为动画师的判断力成为向导。如果某个骨骼在姿势中的位置看起来“不对劲”，就修复它并重新插入其关键帧。趁早做这件事比等到关键帧可能被移动后再做要容易得多。只需确保你位于想要覆盖的现有关键帧所在的同一帧上；否则，你只会在时间轴上紧邻它的位置添加一个新关键帧！\n\
  \n> **提示**\n>\n> 除了使用键盘上的`左`和`右`方向键来逐帧前进外，你还可以使用`上`和`下`方向键在选中物体/骨骼的关键帧之间跳转。这对于专注于关键姿势而不被中间帧干扰很有用。\n\
  \n你的作品可能与我的不同，甚至可能更好！Rain 可能看向不同的方向、做出不同的表情，或用另一只手挥手。只要这三个姿势讲得通且在你看来效果良好，目前这才是最重要的。\n\
  \n至于实际动画，那是另一回事。是时候使用一个新工具来完善 Rain 的动作了。\n\n## 动作编辑器\n\n我们的三个姿势看起来不错，但动画目前还谈不上出色。Rain\
  \ 不会“保持”姿势，看起来不自然。在这个阶段，我们可以开始调整关键帧，复制它们以确定每个姿势应保持多久才过渡到下一个。\n\n让我们在`图表编辑器`中查看整个动画：\n\
  \n![图 7.13：图表编辑器](img/B17149_07_13.jpg)\n\n图 7.13：图表编辑器\n\n这看起来不错。开玩笑的！你能想象吗？角色动画以及其他复杂类型的动画会产生太多`F\
  \ 曲线`，我们无法在图表编辑器中一次性直观地查看所有曲线。从技术上讲我们可以使用它，但我们还是别这么做了。\n\n对于包含大量动画通道的动画进行宏观控制，我们改用`动作编辑器`。它的名字源自传统动画师用来规划镜头时长的曝光表，`动作编辑器`可以追踪我们动画中任意/所有关键帧的位置（在时间上）。\n\
  \n## 动作编辑器简介\n\n你可以通过更改界面中某个区域的编辑器类型，或者直接切换到窗口顶部的`动画`工作区标签页来打开`动作编辑器`。\n\n让我们打开一个。此外，我们需要确保`动作编辑器`显示所有动画数据，包括可能隐藏的骨骼的关键帧：\n\
  \n1.  在用户界面中打开一个`动作编辑器`编辑器。\n2.  在`动作编辑器`的标题栏中，禁用`仅显示选中`并启用`显示隐藏`：\n\n![图 7.14：动作编辑器中的可见性设置](img/B17149_07_14.jpg)\n\
  \n图 7.14：动作编辑器中的可见性设置\n\n对于拥有大量动画骨骼的双足角色，我发现将 3D 视口和`动作编辑器`并排放置很有用。这是我的界面布局：\n\n\
  ![图 7.15：竖屏尺寸下的动作编辑器和 3D 视口](img/B17149_07_15.jpg)\n\n图 7.15：竖屏尺寸下的动作编辑器和 3D 视口\n\
  \n有了`动作编辑器`，我们可以看到插入的所有关键帧整齐地按每个通道排列成行。它有点像没有 Y 轴的`图表编辑器`；通过牺牲一些关键帧信息并将它们组织成行，我们可以一次性轻松管理大量动画属性的关键帧。\n\
  \n### 等等，这不就是时间轴吗？\n\n是的，它们实际上是同一个编辑器，只是标题栏不同：\n\n![图 7.16：放在时间轴上方的动作编辑器](img/B17149_07_16.jpg)\n\
  \n图 7.16：放在时间轴上方的动作编辑器\n\n最初，Blender 的`时间轴`仅用于播放和跳转帧，无法直接编辑关键帧。后来，为了方便，一些功能从`动作编辑器`复制到了`时间轴`。这确实让*第\
  \ 1 章*容易多了！\n\n我们即将在`动作编辑器`中进行的许多操作在`时间轴`中也能行得通。不过别搞混了；就编辑关键帧而言，`时间轴`能做的事，`动作编辑器`都能做得更好。首先，`时间轴`仅显示选中物体和/或骨骼的通道，而`动作编辑器`在筛选通道可见性方面拥有与`图表编辑器`相同的灵活性。\n\
  \n`时间轴`的核心功能（即`动作编辑器`不具备的功能）都位于其标题栏中，我们可以在那里找到播放、帧范围等设置。其标题栏以下的部分可以视为“快速访问”版的`动作编辑器`。因此，你可能希望在界面中同时显示`动作编辑器`和`时间轴`，以便同时使用两者的功能。\n\
  \n既然澄清了这一点，我们可以回到主题，看看是什么让`动作编辑器`（在某些情况下也包括`时间轴`）如此有用。\n\n### 动画通道（再谈）\n\n看看`动作编辑器`左侧面板的内容，它包含所有动画通道的嵌套列表：\n\
  \n![图 7.17：以每根骨骼命名的通道组列表](img/B17149_07_17.jpg)\n\n图 7.17：以每根骨骼命名的通道组列表\n\n最顶端是一个标记为`摘要`的项，包含所有动画物体。接着是\
  \ Rain 的骨架物体，然后是动作。我们的场景只有一个动画物体，且只有一个动作，所以顶部这前三个通道是冗余的。你无需费心区分它们。\n\n动作内的动画通道会自动组织成通道组。对于角色动画，通道组会自动以每根骨骼命名。在适用的情况下，点击通道组会选中对应的骨骼，反之亦然。\n\
  \n如果展开一个通道组，你会看到该骨骼每个动画属性的单独通道：\n\n![图 7.18：单根骨骼的单独动画通道](img/B17149_07_18.jpg)\n\
  \n图 7.18：单根骨骼的单独动画通道\n\n这看起来应该很熟悉。这就像我们之前在`图表编辑器`中看到的一样，在`时间轴`中也能找到。不过这一次，我们的动画拥有比以往更多的通道和关键帧。每次我们为前四层中的每根骨骼插入`位置`、`旋转`和`缩放`关键帧时，都会创建一整列关键帧，每个姿势就有\
  \ 1000 多个。\n\n\n\n这么多通道和关键帧让你感到困扰吗？我也是！让我们使用 `Collapse Channels`（`Numpad -`），或者点击\
  \ `Summary` 行旁边的小箭头，这样我们就不用去想它们了：\n\n![Figure 7.19: Collapsing the animation channels](img/B17149_07_19.jpg)\n\
  \nFigure 7.19: 折叠动画通道\n\n现在只有三个关键帧，每个姿势一个！毕竟这不是什么复杂的动画。\n\n## 在 Dope Sheet 中编辑关键帧\n\
  \n仅仅因为我们看不见那些其他数据，并不意味着它们不存在；只是在我们准备好之前，不必去想它们。目前，我们可以在 Dope Sheet 中编辑这三个姿势的时机，就好像它们是三个孤立的关键帧一样。\n\
  \n**重要提示**\n\n以下操作需要影响我们所有的关键帧。Dope Sheet 无法编辑隐藏通道的关键帧，因此请确保在执行后续步骤前，你已禁用 `Only\
  \ Show Selected` 并启用了 `Show Hidden`。\n\n另一方面，折叠通道组内的通道不算作隐藏。无论通道是折叠还是展开，在功能上都没有区别。\n\
  \n在控件和键盘快捷键方面，Dope Sheet 没有什么惊喜。让我们从使用 `Duplicate`（`Shift + D`）开始，让 Rain 保持她的前两个姿势：\n\
  \n1. 在 Dope Sheet 的 `Summary` 行中，选择第 1 帧上的关键帧。\n2. 复制选择，将新关键帧移动到第 40 帧。\n3. 对第 50\
  \ 帧上的关键帧做同样的操作，将新关键帧移动到第 70 帧。\n\n我们刚刚稍微调整了一下动画的时机，让 Rain 在过渡到下一个姿势之前，每个姿势都保持一会儿。复制关键帧是实现这一目的的常用方法，就像我们在\
  \ *Chapter 1* 中为立方体制作动画时那样。\n\nDope Sheet 中关键帧之间的阴影给了我们一个视觉线索，指示动作发生在何处。相同关键帧之间的长灰条表示无变化，而关键帧之间未变灰的区间则是运动发生的地方：\n\
  \n![Figure 7.20: “Held” keyframes in the Summary row of the Dope Sheet](img/B17149_07_20.jpg)\n\
  \nFigure 7.20：Dope Sheet 的 Summary 行中的“保持”关键帧\n\n尽管还有大量信息隐藏着。这是五个关键帧，还是 5,000 多个？我们到底有多少个关键帧？\n\
  \n## Summary 或“分组”关键帧\n\n如果我们使用 `Expand Channels`（`Numpad +`），就能看到 `Summary` 行中的关键帧实际上是如何工作的。看看当我们选择其中一个时会发生什么：\n\
  \n![Figure 7.21: Selection of keyframes](img/B17149_07_21.jpg)\n\nFigure 7.21：关键帧的选择\n\
  \n每一个可见的关键帧（或者如果通道展开后会变得可见的关键帧）都会出现在 `Summary` 行中。对于接下来的两行也是如此，但对于我们的目的来说它们是多余的。\n\
  \n如果两个或更多关键帧共享同一帧，它们就会在 summary 行中折叠成一个代表它们全部的关键帧。我称之为“summary keys”（摘要关键帧），但你可以叫它们“meta-keys”（元关键帧）、“grouped\
  \ keys”（分组关键帧），甚至“fool’s keyframes”（愚人关键帧）；对于它们叫什么，并没有达成一致的术语。\n\n让我们在层级中进一步向下，选择一个骨骼的\
  \ summary key：\n\n![Figure 7.22: Selection of all the keyframes for one bone](img/B17149_07_22.jpg)\n\
  \nFigure 7.22：一个骨骼所有关键帧的选择\n\n每个骨骼的通道组就像它自己的摘要通道，包含着能够有效编码多个通道数值的 summary keys。对于许多骨骼，我们可能永远不需要单独编辑各个\
  \ `Location`、`Rotation` 和 `Scale` 通道的关键帧。相反，我们可以在更抽象的层面上工作，一次为一个完整的“姿势”制作所有这些属性的动画。既然有这么多骨骼要操心，我们需要尽可能多的抽象！我们甚至可能需要比现有的更多。\n\
  \n## 整理 Dope Sheet\n\n仅靠在一行中编辑整个角色动画的关键帧，我们能完成的工作有限。随着工作的进行，我们必须为特定骨骼插入和编辑关键帧，而不是整个姿势。\n\
  \n这里只有一个障碍：在 Dope Sheet 中展开动作通道感觉更像是爆炸而不是展开。即使隐藏了许多其他骨骼以免它们被加关键帧，这个列表里的骨骼实在太多了。它们从上到下的顺序也不太讲得通。\n\
  \n在继续制作动画之前，让我们先整理这些通道组。这会让我们后续的工作进行得更顺利。\n\n### 重新分组通道\n\n即使通道组是折叠的，Dope Sheet\
  \ 中仍有显眼的大量行，足以让我们的工作比必要时更难。看看这些通道组的名称，并考虑它们对应的骨骼：\n\n![Figure 7.23: Too long of\
  \ a list](img/B17149_07_23.jpg)\n\nFigure 7.23：列表太长了\n\n看看 Rain 的手指和面部那些小骨骼有多少通道组！其中一些骨骼不需要制作动画，但很多需要，所以我们不能直接删除这些数据。不过，我们真的需要看到每个手指和面部骨骼的关键帧吗？真的那么重要吗？非要为\
  \ `FK-Pinky2.L` 和 `FK-Pinky3.L` 设置单独的通道组，以便区分 Rain 左手小指两节末节骨之间的时机差异？也许以后会用到，但这次动画不需要。\n\
  \n相反，我们可以使用 `Channel | Group Channels`（`Ctrl + G`）操作符，将 Rain 手指和面部骨骼的众多通道合并为仅仅几个通道组。\n\
  \n首先，我们应该剔除一些可见的骨骼和通道：\n\n1. 隐藏 `IK` 和 `FK` 骨架层，仅保留 `Fingers` 和 `Face Primary` 层可见。\n\
  2. 在 Dope Sheet 中启用 `Show Only Selected`。\n\n这应该能减少选错骨骼或无意中对通道分组的风险。\n\n**重要提示**\n\
  \n在 Dope Sheet 中对通道分组前，请确保你的选择无误。如果你不小心对错误的通道进行了分组，除了 `Undo`（`Ctrl + Z`）之外，没有自动方法能恢复它们最初的分组方式。\n\
  \n#### 对手指骨骼通道分组\n\n现在使用 `Channel | Group Channels`（`Ctrl + G`）对我们想要的通道进行分组更容易了。让我们从手指开始：\n\
  \n1. 在 3D 视口中，选择 Rain 左手可见的手指骨骼。这会使它们在 Dope Sheet 中可见。\n2. 在 Dope Sheet 的通道列表中，确保所选骨骼的所有通道组本身都已通过\
  \ `Select All`（`A`）选中。\n3. 使用 `Channel | Group Channels`（`Ctrl + G`），并将新组命名为 `Fingers.L`。\n\
  4. 对右手的手指骨骼重复步骤 1-3，并将通道组命名为 `Fingers.R`。\n\n我们现在只有两个通道组（每只手一个），而不是 38 个（每个手指骨骼一个）：\n\
  \n![Figure 7.24: Two channel groups for the fingers](img/B17149_07_24.jpg)\n\nFigure\
  \ 7.24：手指的两个通道组\n\n这些通道组中的 summary keys 也会按预期工作。如果我们保持通道组折叠，并继续为所有手指一起加关键帧，我们可以把每只手当作一个独立的角色，用编码每个“手指姿势”的\
  \ summary “finger keyframes”来制作动画。\n\n这比处理 38 个单独骨骼的 summary keys 容易得多，也比处理这些骨骼的\
  \ 342 个单独 `Location`、`Rotation` 和 `Scale` 通道容易得多（顺便说一句，那些通道仍然存在）：\n\n![Figure 7.25:\
  \ Aargh! Put it away!](img/B17149_07_25.jpg)\n\nFigure 7.25：啊！收起来！\n\n正如你所见，通道组无法嵌套。我真希望它们能。去问问开发者吧。我们不能把通道组放进其他通道组里；我们只能清空它们各自的动画通道，并将那些通道放入一个新的通道组中。\n\
  \n**重要提示**\n\n\n\n由于多个骨骼的通道组在展开时会变得非常混乱，除非我们确定大部分时间都能将它们保持折叠状态，否则我们将避免对通道进行分组。\n\
  \n我们在 `Dope Sheet`（动作编辑器）中的通道显示变得更加精简了！现在，只剩下面部骨骼的动画通道。\n\n## 面部骨骼通道分组\n\n将所有内容归入一个“面部”通道固然诱人，但未免过于激进。面部上半部分在说话等动作中通常会与下半部分不协调地移动，而眼睑等面部部分需要眨动，独立于眉毛移动。\n\
  \n不过，这并不意味着每根眉毛骨骼都需要单独制作动画！为了在保留面部各部分一定独立性的同时折叠更多通道，我们将把所有这些杂乱的通道整理成四个基本通道组：`Mouth`（嘴巴）、`Nose`（鼻子）、`Eyebrows`（眉毛）和\
  \ `Eyes`（眼睛）。\n\n**重要提示**\n\n我们给通道组起的名称是任意的，不会改变受影响的骨骼或属性。这由每个单独动画通道的数据路径决定，除非变为孤儿通道，否则数据路径是不可变的。\n\
  \n这里没有新知识点。只是重复我们之前做过的操作，但这次针对面部：\n\n1. 在 `Dope Sheet`（动作编辑器）中选择 Rain 眉骨线上的骨骼，随后选择与之关联的通道。\n\
  2. 使用 `Group Channels`（分组通道，`Ctrl` + `G`），并将新组命名为 `Eyebrows`。\n3. 对 Rain 的鼻子和内侧颧骨重复步骤\
  \ 1 和 2，将通道组命名为 `Nose`。\n4. 对 Rain 的嘴巴和剩余的颧骨执行相同操作，将通道组命名为 `Mouth`。\n5. 现在，对控制 Rain\
  \ 眼睛和眼睑（但不包括眼球目标）的骨骼执行相同操作。将新组命名为 `Eyes`。\n\n将所有这些动画通道收集到仅有的几个通道组后，我们便可以重新启用 `FK`\
  \ 和 `IK` 骨架层，并恢复 `Dope Sheet` 的过滤设置，使其再次显示所有动画数据。\n\n**技巧**\n\n你可以（也应该）继续利用 Rain\
  \ 的骨架层设置和 `Dope Sheet` 中的过滤设置，在处理动画的不同区域时限制骨骼及其通道的可见性。聪明工作，别笨干；如果不需要看某部分，就想办法把它隐藏起来！\n\
  \n运气好的话，完整的通道组列表甚至能在一个屏幕上显示完全！现在，如果它们的顺序也能讲得通就好了……\n\n## 重新排序通道组\n\n我们剩下的大多数通道组都是以单个骨骼命名的默认组。这本身没问题，但它们从上到下的列出顺序毫无逻辑可言。\n\
  \n这对动画结果没有任何影响，但确实让我们在工作时查找特定骨骼的通道变得不必要地困难。我们在尝试制作动画时每一秒花在整理杂乱通道上的时间都会累积，让过程变得不那么愉快，所以让我们利用\
  \ `Channel | Move…`（通道 | 移动……）中的这些操作符：\n\n![Figure 7.26: Operators for re-ordering\
  \ selected channels](img/B17149_07_26.jpg)\n\n图 7.26：重新排序所选通道的操作符\n\n每次都要点击菜单上百次非常恼人，所以一定要善用\
  \ `Page Up` 和 `Page Down` 热键。此外，请注意，如果以骨骼命名的通道组对应的骨骼被隐藏了，则无法选中这些通道组。\n\n关于通道组应如何排序没有严格的约定，但我建议遵循以下准则：\n\
  \n1. 根据前缀将通道组归类在一起。将 `MSTR-` 骨骼放在顶部，其次是 `IK-` 骨骼和 `FK-` 骨骼。\n2. 在每个具有相同前缀的“通道组组”内，注意每个通道组的骨骼控制骨架的哪一侧。位于骨架中心的骨骼应排在最前，然后是左侧骨骼，最后是右侧骨骼。\n\
  3. 对于每个肢体，按解剖学顺序从近端到远端组织 `FK` 骨骼的通道组（例如 `FK-Upperarm_Parent.L`、`FK-Forearm.L`，然后是\
  \ `FK-Hand.L`）。\n4. 按解剖结构、重要性或任何对你有意义的方式对剩余的通道组进行排序。\n\n这是我排序后的 `Dope Sheet`：\n\n\
  ![Figure 7.27: Fully re-organized Dope Sheet](img/B17149_07_27.jpg)\n\n图 7.27：完全重新组织的\
  \ Dope Sheet\n\n请记住，我们刚才所做的一切都不影响动画本身；它只影响在 `Dope Sheet` 中查看时动画数据的组织方式。正确排序的通道组将使我们在深入为该角色制作动画时工作更少挫败感。\n\
  \n话虽如此，让我们更深入地为这个角色制作动画吧！\n\n## 更深入地为这个角色制作动画\n\n动画能让秒数感觉像天数。在 Rain 保持姿势的那些帧里——不是我们关键姿势之间的运动间隔，而是那些间隔之间漫长的灰色间隔——Rain\
  \ 的身体如雕像般静止。我们的动画仍然是一系列离散的全身姿势的简单序列，每个姿势都编码在一列关键帧中。因此，Rain 产生的运动还不算太好，但我们会像雕塑家对待石头一样，不断地雕琢它。随着我们赋予作品形态，我们将见证\
  \ Rain 变得更加栩栩如生。\n\n我们的下一阶段涉及为特定骨骼设置关键帧，而不是一次性为整个角色设置关键帧；实现那些需要更多关注其与前后姿势关系的姿势。这个动画的中间阶段比分镜阶段更详细，但离我们所谓的“细化”还远得多。有人可能称之为分解阶段，但我更喜欢叫它，嗯，制作动画！\n\
  \n## 两个额外的中间姿势\n\n在我们现有的三个姿势之间，考虑一下我们即将为 Rain 的头部添加的两个额外姿势。我们将它们称为 `Glancing`（瞥视）和\
  \ `Recognizing`（辨认）：\n\n![Figure 7.28: Idle, Glancing, Looking, Recognizing, and\
  \ Waving](img/B17149_07_28.jpg)\n\n图 7.28：待机、瞥视、注视、辨认和挥手\n\n这些姿势将有助于改善和清晰化我们目前在主要姿势之间过于平滑的过渡，并让观众更清晰地读懂\
  \ Rain 的内心思维过程。\n\n### 瞥视\n\n仔细想想，Rain 不应该直接从待机状态变为凝视状态。要引起 Rain 的注意，她的眼睛必须先看到它。感知发生在反应*之前*——不是*期间*，更不是*之后*。\n\
  \n我们将通过在帧 `40` 覆盖一些关键帧来制作瞥视姿势。一些姿势只需复制一个或多个现有的关键帧即可完成：\n\n1. 在 `Dope Sheet`（动作编辑器）中，选择帧\
  \ `50` 上 `TGT-Eyes` 的关键帧。\n2. 复制（`Shift` + `D`）所选关键帧到帧 `40`。这将覆盖现有的关键帧。\n3. 转到帧\
  \ `40`。\n\n现在，Rain 的眼睛正“瞥视”着 10 帧后她将要“注视”的同一个东西，尽管眼睛提前那么远看过去看起来不太舒服：\n\n![Figure\
  \ 7.29: Ortho view of Rain’s eyeballs turning a bit too much](img/B17149_07_29.jpg)\n\
  \n图 7.29：Rain 眼球转动过度的正交视图\n\n我们对角色的共情很重要：如果一个姿势看起来很痛苦，看起来就会让人难受。Rain 需要转动更多身体，朝同一方向移动头部，以便虹膜仍然可见。\n\
  \n让我们继续摆姿势：\n\n1. `Rotate`（旋转，`R`）`FK-Head` 朝向眼球目标方向，这样 Rain 的眼球看起来就不奇怪了。\n2. 如有需要，将\
  \ `FK-Neck` 和 `FK-Chest` 朝同一方向稍微旋转一点以补偿头部运动。\n\n在为 Rain 的头部动作设置关键帧之前不要离开帧 `40`，否则你会丢失这些修改！既然\
  \ `Dope Sheet` 触手可及，我们就借此机会介绍另一种插入关键帧的方法。\n\n#### 在 Dope Sheet 中插入关键帧\n\n`Dope Sheet`（动作编辑器）有自己的\
  \ `Insert Keyframes`（插入关键帧，`I`）功能：\n\n![Figure 7.30: The Insert Keyframe menu](img/B17149_07_30.jpg)\n\
  \n\n\n## 动画关键帧工作流\n\n图 7.30：插入关键帧菜单\n\n我们之前在图表编辑器中见过这个菜单。当你想为现有的动画通道插入关键帧，而不必在界面的其他地方查找并选择其对应的所有者时，这非常有用。\n\
  \n让我们用它来为我们刚刚在帧 `40` 上对姿势所做的更改设置关键帧：\n\n## 为瞥视姿势插入关键帧\n\n1.  在动作编辑器中，使用 `Key` |\
  \ `Insert` `Keyframes` (`I`)。\n\n2.  选择 `All Channels`。请注意，在这一帧上设置“过多”的关键帧无伤大雅，因为它已经为每根骨骼都设置了关键帧。\n\
  \n    现在，动作编辑器清楚地显示了哪些通道受到了影响。注意某些骨骼缺少灰色条带。不过，帧 `1` 和 `40` 之间的这段动作间隔太慢了，所以让我们把它加快：\n\
  \n3.  选择“瞥视”姿势的已更改关键帧（这些是帧 `40` 上 `TGT-Eyes`、`FK-Head`、`FK-Neck` 和 `FK-Chest` 的关键帧）。\n\
  \n4.  复制 (`Shift` + `D`) 所选内容到帧 `35`。\n\n5.  选择同一组骨骼在帧 `1` 上对应的关键帧。\n\n6.  将所选内容复制到帧\
  \ `30`。\n\n现在，Rain 的转头动作看起来更好了，并在她仔细观察前，给了她额外的五帧来初步捕捉所见内容：\n\n![Figure 7.31: Rain’s\
  \ new pose, along with the Dope Sheet](img/B17149_07_31.jpg)\n\n图 7.31：Rain 的新姿势，以及动作编辑器\n\
  \n这段动画目前看起来还可以。让我们添加下一个姿势。\n\n## 识别\n\n与瞥视姿势类似，我们想在观看和挥手之间添加另一个表情：识别。这更清晰地反映了 Rain\
  \ 的思维过程；Rain 内部状态的变化先于她站起来兴奋挥手的决定。\n\n对于这个面部表情，我们将从帧 `70` 之前一点点开始：\n\n1.  转到帧 `68`。\n\
  \n2.  为 Rain 创建一个新的面部表情，一种惊讶/欣喜的识别表情。\n\n    这个表情有很多可能性。这是我做的：\n\n![Figure 7.32:\
  \ The recognizing pose](img/B17149_07_32.jpg)\n\n图 7.32：识别姿势\n\n现在让我们为这个表情设置关键帧。既然我们重新组织了面部骨骼的通道，在动作编辑器中做这件事很容易：\n\
  \n1.  选择通道组 `Eyebrow`、`Eyes`、`Nose` 和 `Mouth`。\n\n2.  使用 `Key` | `Insert Keyframes`\
  \ (`I`) | `Only Selected Channels`。这会在帧 `68` 为该表情插入新的关键帧。\n\n3.  我们不再需要帧 `70` 上的旧表情了，所以让我们覆盖它。将帧\
  \ `68` 上的关键帧复制到帧 `70`。\n\n4.  在帧 `50` 上，选择帧 `68` 关键帧之前的关键帧，并将它们复制到帧 `64`。\n\n现在，Rain\
  \ 从帧 `50` 到帧 `64` 保持着观看表情。相比之下，她的识别表情相对短暂：\n\n![Figure 7.33: The sequence of keyframes\
  \ for Rain’s face](img/B17149_07_33.jpg)\n\n图 7.33：Rain 面部的关键帧序列\n\n为什么这次我们以稍微不同的顺序设置关键帧？没什么原因；这只是为了重申我们可以按任何我们觉得方便的顺序插入、复制和覆盖关键帧。\n\
  \n## 用于姿势的中间帧操作符\n\n在 3D 视口中，我们可以访问一些特殊的姿势操作符。其中一些显示在工具栏中作为工具，但我更喜欢直接在 `Pose` |\
  \ `In-Betweens` 中调用它们：\n\n![Figure 7.34: The in-between operators](img/B17149_07_34.jpg)\n\
  \n图 7.34：中间帧操作符\n\n称这些操作符为 `In-Betweens` 让它们听起来比实际更重要。我们不一定需要它们；它们只适用于姿势模式下的骨骼，而最后几个只适用于已制作动画的骨骼。尽管如此，它们还是有用处的；可以将它们视为考虑了休息姿势或相邻关键帧等上下文的变换操作符。\n\
  \n例如，`Pose Breakdowner` (`Shift` + `E`) 会在所选骨骼的前一关键帧和后一关键帧之间构想一个线性插值。然后根据因子调整姿势到中间某处，创建一个分解姿势：\n\
  \n![Figure 7.35: The breakdown pose between two different poses at 0%, 50%, 80%,\
  \ and 100%](img/B17149_07_35.jpg)\n\n图 7.35：两个不同姿势之间在 `0%`、`50%`、`80%` 和 `100%`\
  \ 处的分解姿势\n\n让我们在 Rain 的 `IK` 和 `FK` 骨骼上使用它，在帧 `40` 和 `70` 之间创建这样一个分解姿势：\n\n1.  转到帧\
  \ `50`。\n\n2.  选择所有可见的 `IK` 和 `FK` 骨骼（面部和手指除外）。\n\n3.  使用 `Pose` | `In-Betweens`\
  \ | `Pose Breakdowner` (`Shift` + `E`)。向左或向右移动鼠标会沿着相邻关键帧的连续体插值姿势，这在 3D 视口标题栏的水平条中可视化。\n\
  \n4.  选择约 `90`% 的因子并确认。\n\n5.  为你的更改设置关键帧。\n\n我们在这里所做的是稍微“放松”姿势，使得在帧 `50` 时，Rain\
  \ 几乎完成了前倾，但继续持续到帧 `70`。此类技巧虽微妙，但有助于消除动画早期阶段的“停滞感”。\n\n这类似于擦洗到帧 `48`，设置关键帧，然后将那些关键帧移回我们想要的帧\
  \ `50` 位置。然而，通过使用该操作符，我们可以停留在想要的帧上，并获得一个原本可能不易获得的分解姿势。\n\n**提示**\n\n`Push Pose from\
  \ Breakdown` (`Ctrl` + `E`) 和 `Relax Pose to Breakdown` (`Alt` + `E`) 也是有用的操作符，但除非当前姿势与\
  \ Blender 认为的分解姿势有显著差异，否则它们不会有太大效果。\n\n## 挥手\n\nRain 动画的最后一部分仍然明显未制作动画。Rain 需要真正挥动手臂，而不仅仅是举起来！我将向你展示在动作编辑器中针对这类动作的一个巧妙技巧。一旦你尝试过，你就会开始看到它如何应用于各种动作和身体部位。\n\
  \n我们将首先把 Rain 的抬起手臂视为一个只有三根 `FK` 骨骼的独立角色。对我来说，它们是 `FK-Upperarm_parent.R`、`FK-Forearm.R`\
  \ 和 `FK-Hand.R`。这是它们的关键姿势：\n\n![Figure 7.36: Rain’s arm waving to one side and to\
  \ the other](img/B17149_07_36.jpg)\n\n图 7.36：Rain 的手臂向一侧和另一侧挥动\n\n三根骨骼和两个姿势；这应该很容易：\n\
  \n1.  在帧 `83` 上，将抬起的手臂向内摆过 Rain 的头顶并设置关键帧。确保上臂、前臂和手都朝同一方向弯曲。\n\n2.  在帧 `86` 上，将手臂摆向另一侧，远离\
  \ Rain 的身体。让 Rain 伸直肘部，并让其他关节朝与之前相反的方向弯曲。\n\n    这给了我们制作单次“挥手”所需的所有关键帧。接下来，我们复制它们以重复动作。\n\
  \n3.  选择你刚在帧 `83` 和 `86` 上创建的关键帧。\n\n4.  复制所选关键帧，将新关键帧向前移动六帧。\n\n5.  持续复制直到超过帧 `120`（我们可能在那里结束动画）。\n\
  \n复制了这个简单的关键帧序列后，Rain 就以每六帧交替两个姿势的方式做了一个相当基础的挥手动作：\n\n![Figure 7.37: Repeating keyframes\
  \ for Rain’s arm](img/B17149_07_37.jpg)\n\n图 7.37：Rain 手臂的重复关键帧\n\n自己看看吧。我觉得看起来还可以，但通过在动作编辑器中使用一个简单的技巧，我们可以让它看起来更好。\n\
  \n### 错开关键帧\n\n这里就是我一直等着要展示给你的技巧。通过错开 `FK` 骨骼的关键帧，我们可以在 Rain 的手臂上创建一个更具视觉美感的运动弧线：\n\
  \n**提示**\n\n要选择一长排多个关键帧，请尝试 `Box Select` (`B`)。查看动作编辑器中的 `Select` 菜单，了解其他一些一次性选择大量关键帧的便捷方法。\n\
  \n\n\n\n### 偏移手臂关键帧\n\n1.  选择 `FK` 前臂骨骼（`FK-Forearm.L` 或 `FK-Forearm.R`）的所有挥手关键帧，并将它们向右\
  \ `移动` (`G`) 一帧。\n\n2.  选择 `FK` 手部骨骼（`FK-Hand.L` 或 `FK-Hand.R`）的所有挥手关键帧，并将它们向右 `移动`\
  \ (`G`) 两帧。\n\n现在，上臂的运动领先于前臂，前臂领先于手腕。最初那两个手臂姿势便于一次性为所有三根骨骼设定极限位置的关键帧，但最后一步是将它们的关键帧分开。\n\
  \n假设你的通道组堆叠顺序和我一样，以下是在 Dope Sheet（动作编辑器）中的显示效果。如果是这样，你会看到按这种顺序排列有多么有用：\n\n![Figure\
  \ 7.38: Staggered keyframes](img/B17149_07_38.jpg)\n\n**Figure 7.38: Staggered keyframes（错开的关键帧）**\n\
  \n我们在这里所做的，是在手臂的 `FK` 骨骼链上创建了骨骼运动的延迟。Rain 不仅是在字面上挥手，她四肢的运动本身就像一波浪，从肩膀传递到指尖！\n\n\
  像这样偏移骨骼的运动看起来更好，并有助于表现连接身体部位之间惯性的假象。这在 Dope Sheet 中操作也比在 Graph Editor（图表编辑器）中容易得多。我们将在\
  \ Rain 动画的各个领域看到这一原则的应用，从她的脖子和四肢到头发和围巾。\n\n## 润色动画\n\n弄清成千上万个关键帧的时机是一个迭代过程，涉及相互关联的因素。起初，我们根据关于事物应该发生什么以及何时发生的宽泛、有时甚至武断的决定来设定初始姿势的关键帧。随着工作的继续，额外关键帧的时机由我们已经制作的关键帧决定，以此类推。\n\
  \n最后，我们达到了一个可以细化单个骨骼运动的阶段，在某些地方平滑它们的运动，在另一些地方增加细节。我们还将为一些迄今为止未曾动过的骨骼设置关键帧。\n\n>\
  \ **Tip（提示）**\n>\n> 除了我们学到的另外两条准则，我还有一条建议送给这部分练习：**没有什么是神圣不可侵犯的！** 在工作过程中，删除任何似乎碍事的不必要关键帧，并且不要害怕编辑任何你想编辑的关键帧，即使它会打破那些关键姿势的长列。\n\
  \n让我们首先拜访一下我们的老朋友 Graph Editor。\n\n## 在骨骼上使用 Graph Editor\n\n我们不会对每一根单独的骨骼都使用 Graph\
  \ Editor，但如果有任何骨骼值得如此关注，那一定是 `MSTR-Pelvis_Parent`，这根移动 Rain 所有躯干的骨骼。回想一下我们关于从中心向外动画的准则；如果我们把这根骨骼的运动做对，Rain\
  \ 动画的其余部分就会随之而来。\n\n> **Tip（提示）**\n>\n> 使用 `Ctrl` + `Tab` 在 Dope Sheet 和 Graph Editor\
  \ 之间快速切换。\n\n这是我的 `MSTR-Pelvis_Parent` 动画在 Graph Editor 中的样子：\n\n![Figure 7.39:\
  \ F-curves for pelvis bone (Normalize enabled)](img/B17149_07_39.jpg)\n\n**Figure\
  \ 7.39: F-curves for pelvis bone (Normalize enabled)（启用归一化的骨盆骨骼 F 曲线）**\n\n当然，这些都是带有自动钳制手柄的贝塞尔关键帧。难怪它们是默认设置；它们表现得太出色了，以至于直到现在我们根本不需要考虑关键帧手柄和/或特定的插值模式。\n\
  \n### 精细调整躯干运动\n\n我们能做些什么来改善这根骨骼的运动？首先，站立角色的身体绝不应保持完全静止；像活人一样，它应该始终至少稍微呼吸和摇晃一下。当她所有的\
  \ F 曲线都是平的时，Rain 看起来就像个蜡像，即使只有几帧。\n\n在下面的处理中，我在开头和结尾添加了一些随机关键帧来解决这种静止，主要是在 `X Location`\
  \ 和 `Y Location` F 曲线上：\n\n![Figure 7.40: Some subtle variation added](img/B17149_07_40.jpg)\n\
  \n**Figure 7.40: Some subtle variation added（添加了一些细微变化）**\n\n这种偷懒的技巧感觉不像是在做动画，而更像是“消除静止”，但即使是一丁点额外的运动，也能在雕像\
  \ Rain 和可信的角色 Rain 之间产生天壤之别。\n\n从某种意义上说，躯干骨骼也是“最重”的骨骼；它的运动看起来应该承载大量动量。可以通过在所有关键帧上使用\
  \ `Key`（关键帧） | `Handle Type`（手柄类型） (`V`) | `Automatic`（自动）来实现这种效果：\n\n![Figure 7.41:\
  \ Automatic Bezier keyframes](img/B17149_07_41.jpg)\n\n**Figure 7.41: Automatic\
  \ Bezier keyframes（自动贝塞尔关键帧）**\n\n嗯，也许不是全部……我们需要更有选择性地决定哪些关键帧放手。我们也可以使用 `Aligned`（对齐）类型手动设置一些手柄，添加更多关键帧，并向任何方向移动它们，无论什么能给我们想要的\
  \ F 曲线。\n\n> **Tip（提示）**\n>\n> 插值在两个方向上都起作用，所以要当心过早开始的运动。这对于自动关键帧尤其如此。例如，在前一个例子中，Rain\
  \ 的躯干会在 `40` 帧很久之前就“蓄力”，为下一个姿势做准备。这说不通；Rain 的身体不应该为了她还不知道即将要做的事情而提前移动。\n\n这是我的最终处理：\n\
  \n![Figure 7.42: Final F-Curves for MSTR-Pelivs_Parent](img/B17149_07_42.jpg)\n\n\
  **Figure 7.42: Final F-Curves for MSTR-Pelivs_Parent（MSTR-Pelivs_Parent 的最终 F 曲线）**\n\
  \n现在轮到你了：\n\n1.  选择 `MSTR-Pelvis_Parent` 并在 Graph Editor 中找到它的关键帧。\n\n2.  为 F 曲线的平坦段落添加一些细微运动；`X\
  \ Location` 和 `Y Location` 将受益最大。你可以忽略其余部分。\n\n3.  在特定关键帧上使用自动贝塞尔手柄，以及你喜欢的任何其他方法，直到你对\
  \ Rain 躯干的整体运动感到满意。\n\n我们已经三次检查 `MSTR-Pelvis_Parent` 的动画了，一次是在分镜阶段，一次在第二动画阶段，最后一次在\
  \ Graph Editor 中！\n\n## 为 Rain 的配饰制作动画\n\n仅通过为骨骼层 `IK`、`FK`、`Face Primary` 和 `Fingers`\
  \ 中的骨骼制作动画，我们就已经走了很远，但其他层中还有大量用于动画的骨骼。我们没有义务为所有东西制作动画，但在 `Hair`（头发）和 `Clothes`（衣服）层进行一些快速工作是接下来最明显的步骤。仅仅因为我们在开始制作动画时没有为那些骨骼设关键帧，并不意味着我们现在不能做。我们可以在任何时候为任何我们想要的东西添加动画，只要我们觉得方便！\n\
  \n当我们为这些最后的部分制作动画时，Rain 剩余的松散部分将栩栩如生，我们的动画最终将完成：\n\n![Figure 7.43: Animating Rain’s\
  \ hair and scarf bones](img/B17149_07_43.jpg)\n\n**Figure 7.43: Animating Rain’s\
  \ hair and scarf bones（为 Rain 的头发和围巾骨骼制作动画）**\n\n1.  启用骨骼层 `Hair` 和 `Clothes` 并禁用其余层。此外，如果你之前隐藏了\
  \ Rain 的 `Hair` 和 `Scarf` 网格，请取消隐藏。\n\n2.  为了不被我们即将添加的所有新通道淹没，在 Dope Sheet 中禁用 `Show\
  \ Hidden`（显示隐藏项）。\n\n3.  找到一帧 Rain 站立相对静止的地方（例如第 `1` 帧），为她的头发和围巾摆姿势，确保它们根据基本重力定律看起来是垂直向下悬挂的。为所有可见骨骼设置\
  \ `location`（位置）和 `rotation`（旋转）关键帧。\n\n4.  刷新浏览你的动画。在 Rain 姿势发生每次重大变化的前后，为围巾和头发骨骼设置关键帧，使它们看起来指向正确的方向（向下）。\n\
  \n你还能添加什么其他细节？眼皮的眨动、手指的抽动、手臂和手腕的摆动；可能性太多，本章无法一一涵盖。但这并不意味着你必须停下来！\n\n## Summary（总结）\n\
  \n\n\n\n\n## 走路循环\n\n由于关键帧数量众多，我们在本练习中使用的关键帧需要在“动作表” 中查看，它们呈现出的外观与在“图表编辑器” 中截然不同。此外，在学习这个新工具的同时，我们还必须同时应对在复杂角色绑定中摆姿势和关键帧设置的所有特殊性。这可能会让人误以为角色动画在本质上与（比如说）立方体动画是完全不同的过程，但这只是一种错觉。关键帧依然是关键帧，而骨骼只是那些拉扯着隐形木偶线的古怪小物体罢了。\n\
  \n另一个我希望你不会陷入的错觉是，认为本练习是角色动画的正式流程，而非“动作表”速成课程以及一小撮专用于姿态骨骼的操作符。本章没有硬性规则，只有指导原则。你将要制作的每一个角色动画（和角色）都会不同，并带来独特且多样的挑战，你将为之发现属于你自己的解决方案。自由思考，发挥创造，别忘了享受乐行！\n\
  \n好了，现在赶紧把乐子享受完，因为下一个练习**才是**有硬性规则的正式流程！这是一个单一的、长期的挑战，你可能会在独自尝试解决它的过程中发疯！别自由思考了；抛弃所有创造力并开始恐慌吧……因为在下一章，我们要做**走路循环**。\n\
  \n## 问题\n\n1.  一个姿势中有多少根骨骼？单根骨骼能有一个姿势吗？\n\n2.  使用 Rain 的 `CloudRig` 界面，哪些骨骼可以充当我们\
  \ `IK` 骨骼的父级？在什么情况下每根骨骼作为父级可能会有用？\n\n3.  动作表 和 时间轴 有什么区别？\n\n4.  在图表编辑器 中我们能做什么，而在动作表\
  \ 中做不到？\n\n5.  既然图表编辑器 显示关于关键帧的更多信息，为什么还要使用动作表 ？\n\n6.  为什么我们要这么多次地编辑/覆盖关键帧？为什么不一开始就做对？\n\
  \n7.  对于 `Push Pose from Breakdown` 或 `Relax Pose to Breakdown` 等中间帧操作符，“Breakdown（分解帧/中间帧）”是什么意思？\n\
  \n8.  为什么头发和衣物之类的东西应该最后制作动画？\n\n## 技术要求\n\n要跟随本章操作，你需要在 Blender 中打开一个新场景。该场景应包含\
  \ Rain，即我们一直在使用的角色绑定。如果你需要下载 Rain，或者忘记了如何将她链接到新场景中，请遵循 *第 6 章* 开头的说明。\n\n## 准备走路循环场景\n\
  \n想象一下，你独自走在一条笔直、平坦的走廊里。没有绊脚石，没有干扰，你的走路动作倾向于重复自身——左脚、右脚、左、右、左、右——直到你到达目的地。走廊是几米长还是一英里长并不重要；在给定的一段时间内，你的动作看起来会像任何其他时间段一样。话虽如此，这对齐步走、慢跑、跑步、跳绳——任何用双腿重复自身的运动——也同样适用。\n\
  \n在动画世界里，这种东西被称为 `walk cycle`（走路循环）——一种周期性的走路动画，可以根据动画师的需要无限重复。走路循环不仅仅是一项技术练习，它是一项宝贵的资产，可以在任何角色直线行走的场景中复用。\n\
  \n为了为这种动画设置场景，我们将首先在时间轴 中标记一些帧。然后我们将调整 Rain 绑定中的一些设置，以便她做好持续向前走的准备。\n\n### 走路循环的时间轴\n\
  \n常言道：“千里之行，始于足下”，但咱们别操之过急——*整整一步？！* 为第一步制作动画是件大事，而为两步制作动画几乎就是我们的整个旅程。要实现如此崇高的目标，我们必须耐心且周密地提前规划。\n\
  \n#### 走路循环的周期性\n\n单步应该占多少帧？这取决于角色的解剖结构和你想让他们走多快。对于本练习，我将直接为我们选定一个数字：每步 12 帧。\n\n\
  这意味着 Rain 有 12 帧的时间将一只脚向前迈出，如下所示：\n\n![Figure 8.1: Frames 0 and 12 of Rain’s walk\
  \ cycle](img/B17149_08_1.jpg)\n\n图 8.1：Rain 走路循环的第 0 帧和第 12 帧\n\n……并用另外 12 帧以相同的方式将另一只脚向前迈出：\n\
  \n![Figure 8.2: Frames 12 and 24 of Rain’s walk cycle](img/B17149_08_2.jpg)\n\n\
  图 8.2：Rain 走路循环的第 12 帧和第 24 帧\n\n前 12 帧将是后续 12 帧关于 `X` 轴的左右镜像，因此整个走路循环的**周期**为 24\
  \ 帧。如果我们正确地设置了关键帧，Rain 在第 `0` 帧的姿势将与第 24 帧完全一致，周期的结束将完全等同于开始（当然，除了 Rain 向前移动了一米——稍后详述）。\n\
  \n结果将赋予 Rain 一种悠闲、不疾不徐的步伐。更重要的是，我们喜欢 12 和 24 这样的数字。任何能被 4 整除的数字简直太棒了。\n\n我们已经确定了单步应占多少帧，但在这些帧中需要发生很多事！再次强调，我们绝不能急于求成完成第一步，所以让我们把它分解成更小的部分。\n\
  \n#### 走路循环的阶段\n\n虽然动画师对单步中的阶段有许多不同的称呼（以及关于哪个阶段应排在第一的相互竞争的理论），但以下是我们将使用的阶段，从左脚在前开始：\n\
  \n![Figure 8.3: The key poses of our walk cycle, from left to right](img/B17149_08_3.jpg)\n\
  \n图 8.3：我们走路循环的关键姿势，从左到右\n\n以下是逐姿势的细分说明：\n\n*   `Contact`（触地/着地）：前脚脚跟触地。着地的脚将在接下来的\
  \ 12 帧中保持着地，承担角色的重量，直到下一个触地阶段。\n*   `Low`（低点/下沉）：由于早先的向下动量，躯干在此阶段左右达到最低点。着地的脚现在平贴地面，另一只脚被抬起并向前摆动。\n\
  *   `Passing`（交叉/经过）：向前摆动的空中腿经过着地的腿。\n*   `High`（高点/抬起）：躯干在此达到最高点。原本在后的脚现在移至前方，并将很快着地进入下一个触地阶段。\n\
  \n这是一只脚的 4 个姿势，接着是同 4 个姿势（关于 `X` 轴镜像）在另一只脚上，然后回到初始姿势。24 帧周期内的 8 个姿势意味着这些姿势中的每一个可以间隔\
  \ 3 帧，因为 24 是个能被整除的好数字。从 0 开始，我们走路循环中最关键的帧因此是 0、3、6、9、12、15、19、21 和 24。\n\n\n\n\n\
  正如你可能猜到的，我们的许多关键帧将位于这些帧上，因此给它们加上标签会很有帮助。这就是下一个功能的用武之地。\n\n## 时间轴标记\n\n标记是动画编辑器中的小三角形，允许我们给重要帧加标签，以免丢失它们。这些在复杂工作中特别有用，例如制作走路循环动画。\n\
  \n### 添加标记\n\n现在让我们插入标记：\n\n1. 转到帧 `0`（是的，帧 `0`）。\n2. 在时间轴中，使用 `Marker | Add Marker`（`M`）。\n\
  3. 每 3 帧添加一个标记，直到到达帧 `24`。\n\n你现在应该在帧 `0`、`3`、`6`、`9`、`12`、`15`、`18`、`21` 和 `24`\
  \ 上有标记：\n\n![Figure 8.4: Markers in the Timeline](img/B17149_08_4.jpg)\n\n图 8.4：时间轴中的标记\n\
  \n**提示**\n\n标记可以像关键帧一样被选择、移动、复制和删除。执行这些操作时，请记住将鼠标光标保持在标记区域内，否则可能会意外操作到关键帧。\n\n新标记会根据添加时的帧号自动命名。这不是特别有用，如果你将标记移动到不同的帧，会让人困惑。我们最好给标记起一些有用的名字。\n\
  \n### 标记标签\n\n让我们重命名标记，使其对应走路循环的各个阶段：\n\n1. 使用 `Marker | Rename Marker`（`F2`）将帧\
  \ `0`、`3`、`9` 和 `12` 上的标记分别重命名为 `Left Contact`、`Left Low`、`Left Passing` 和 `Left\
  \ High`。\n2. 对帧 `12`、`15`、`18` 和 `21` 上的标记重复此操作，将它们命名为 `Right Contact`、`Right Low`、`Right\
  \ Passing` 和 `Right High`。\n3. 帧 `24` 上的最后一个标记应命名为 `Left Contact`，就像帧 `0` 上的那个一样。\n\
  \n我们的标记现在显示更有用的标签：\n\n![Figure 8.5: Renamed markers in the Timeline](img/Image96433.jpg)\n\
  \n图 8.5：时间轴中重命名后的标记\n\n**重要提示**\n\n帧 `0` 和 `24` 的标记同名绝非巧合。完成后，这两帧将呈现为同一个姿势。它们之间的任何视觉差异都可能表明走路循环中存在故障或卡顿。\n\
  \n我们刚添加的标记不仅会出现在时间轴中，还会出现在大多数其他基于时间的编辑器中，包括图表编辑器和 Dope Sheet。虽然标记还有一些额外功能，比如切换活动摄像机，但那是另一章的主题。在本练习中，我们的标记不赋予任何功能；它们只是参考点，防止我们忘记在给定帧上应该发生什么。\n\
  \n## 让 Rain 准备好走路\n\n像往常一样，像 Rain 这样的高级角色绑定会有一些参数需要预先设置，以应对我们即将进行的工作。我们需要非常具体地说明哪些肢体使用\
  \ `IK`，哪些使用 `FK`。\n\n### 专注于 IK 骨骼\n\n`反向运动学` 对任何类型的走路动画都是不可或缺的。没有 Rain 脚部的 `IK`\
  \ 骨骼，制作走路循环将极其繁琐。\n\n光是为走路循环制作 `IK` 骨骼动画就已经够难了，还要受那些烦人的其他骨骼干扰，所以让我们隔离该图层，并确定 Rain\
  \ 的哪些额外部位应该使用 `IK`：\n\n1. 如果还没做，将 Rain 链接到场景中，就像我们在第 6 章和第 7 章中做的那样。\n2. 在 `CloudRig\
  \ | Layers` 中，启用 `IK` 骨架图层并禁用其余图层。\n3. Rain 的脚默认设置为使用 `IK`，但让我们也尝试对 Rain 的脊柱使用 `IK`\
  \ 而不是 `FK`。转到 `CloudRig | Settings | FK/IK Switch` 并将 `Spine` 设置为 `1.0`。\n\n选择对脊柱使用\
  \ `IK` 而不是 `FK` 对我们的走路循环并非至关重要，但它将让我们仅使用 `MSTR-Chest_Parent` 骨骼就能制作 Rain 胸部的动画。这样，直到我们开始制作\
  \ Rain 手臂动画时，才需要处理 `FK` 骨骼。\n\n![Figure 8.6: Rain with just her IK bones](img/B17149_08_6.jpg)\n\
  \n图 8.6：仅显示 IK 骨骼的 Rain\n\n我们暂时隔离了 `IK` 骨架图层，但这并不意味着所有肢体都应该使用 `IK`。\n\n### 不留下任何骨骼\n\
  \nRain 将沿 `Y` 轴持续向前行走。如果某个骨骼没有被制作动画以向前移动，或者它没有直接或间接地成为另一个向前移动的骨骼的子级，Rain 就会把那个骨骼甩在后面。被甩在后面的骨骼最好不要对\
  \ Rain 有可见影响，否则她走几步后可能会看起来灾难性地不同！\n\n正如我们之前学到的，通过自己移动骨骼（当然不确认变换）来预览制作动画时会发生什么，这很有帮助。Rain\
  \ 的主躯干骨骼 `MSTR-Pelvis_Parent` 肯定需要向前移动，如果我们希望她能走到任何地方，所以让我们抓住它做个粗略诊断：\n\n![Figure\
  \ 8.7: MSTR-Pelvis_Parent moving forward on the Y axis](img/B17149_08_7.jpg)\n\n\
  图 8.7：MSTR-Pelvis_Parent 沿 Y 轴向前移动\n\n从下到上，Rain 的脚粘在地板上，但这是我们想要的。使用独立的 `IK` 目标，脚在我们想要它们移动前不得向前移动。然而，Rain\
  \ 的手没什么重要的地方可去。它们只需要从肩膀摆动，所以它们真的应该用 `FK` 而不是 `IK`。我们最后制作它们的动画。最后，Rain 的眼球在头里向后翻了。\n\
  \n现在让我们修复这些问题：\n\n1. 在 `FK/IK Switch` 面板中，将 `Left Arm` 和 `Right Arm` 都设置为 `0.0`。\n\
  2. 既然我们不需要它们，可以隐藏 Rain 手臂的 `IK` 骨骼。它们是 `IK-Hand_Parent.L`、`IK-Hand_Parent.R`、`IK-Pole_Forearm.L`\
  \ 和 `IK-Pole_Forearm.R`。选择它们并使用 `Hide`（`H`）。\n3. 想来，为什么不把她的手臂完全隐藏呢？转到 `CloudRig\
  \ | Outfits` 并暂时将 `Mask Arms` 设置为 `1`。像以前一样隐藏 Rain 的头发和围巾也是个好主意。\n4. 为防止 Rain 的眼球在眼窝里向后翻，转到\
  \ `CloudRig | Settings | Face Settings` 并将 `Eye Target Parent` 设置为 `Torso_Loc`（`2`）。这将使骨骼\
  \ `TGT-Eyes` 保持在 Rain 前方，当她远离根骨骼行走时。\n\n如果没有这些设置，骨骼 `IK-Hand_Parent.L`、`IK-Hand_Parent.R`\
  \ 和 `TGT-Eyes` 都必须制作动画以向前移动，连同 `MSTR-Foot_Parent.L`、`MSTR-Foot_Parent.R` 和 `MSTR-Pelvis`。正如我们即将看到的，任何必须制作动画以持续向前移动的骨骼，都需要我们仔细关注其\
  \ `Y Location` F 曲线。限制这种情况的骨骼数量会让我们的工作更轻松。\n\n![Figure 8.8: Rain simplified and\
  \ ready to walk forward](img/B17149_08_8.jpg)\n\n图 8.8：简化后的 Rain，准备好向前走\n\n通过提前规划、标记帧以及在插入任何关键帧前调整\
  \ Rain 的设置，我们避免了不少潜在事故。然而，走路是如此复杂的动画，我们仍需谨慎！现在 Rain 准备好仅用三根骨骼向前走，这三根骨骼及其向前移动将成为下一节的唯一焦点。\n\
  \n## 沿 Y 轴向前移动\n\n再次，是时候开始摆姿势和插入关键帧了！在上一章中，我们一次用许多骨骼为主要姿势设关键帧来制作动画，但在这个练习中，我们将从仅为三个骨骼的位置设关键帧开始：`MSTR-Foot_Parent.L`、`MSTR-Foot_Parent.R`\
  \ 和 `MSTR-Pelvis`。在对 Rain 的 `CloudRig` 界面中的属性进行调整后，这三根骨骼将全权负责 Rain 在 `Y` 轴上的向前移动。必须特别注意它们的\
  \ `Y Location` F 曲线。\n\n\n\n事实上，目前我们唯一关心的就是这些骨骼沿 `Y` 轴的前向移动！忘掉摆动手臂、扭动臀部，甚至抬起脚；目前唯一重要的是先移动一只脚向前，然后是另一只脚，最后是身体的其余部分。\n\
  \n**重要提示**\n\n本章中的“前向”是指从 Rain 的视角向前，这要求我们骨骼的 `Y` 轴 `Location`（位置）数值发生负向变化。\n\n\
  在我们完成极其基础的前向移动关键帧后，我们将学习如何让一切正确循环。这要求我们解决一个悖论：Rain 的走路循环必须以开始时的姿势结束，但她也绝不能停留在原地……\n\
  \n## 确定步幅长度\n\nRain 在 24 帧内将移动多远？每只脚将在何时摆动向前，而另一只脚保持着地？我们可以通过大致关键第一个 `contact`（触地）姿势来回答这些问题。这些是至关重要的时刻：前脚触地以支撑\
  \ Rain 的重量，而后脚准备抬起并摆动向前。\n\n**重要提示**\n\n我称这些为“粗略”姿势，因为我们目前只关心骨骼在 `Y` 轴上的位置。尽管如此，每根骨骼的\
  \ `Y` 位置必须严格按照以下说明中的数字输入精确录入。哪怕是最微小的偏差，例如将一只脚变换 `\\-0.99` 米而不是 `\\-1.0` 米，都会随时间累积，导致我们的独立骨骼在走路循环重复时逐渐分离。\n\
  \n### 关键初始前向步幅\n\n对于第一个姿势，我为 Rain 的左脚 `Left Contact`（左触地）姿势准备了一些“魔法数字”。请务必精确输入：\n\
  \n1.  转到第 `0` 帧（`Left Contact`）。\n2.  将 `MSTR-Foot_Parent.L` 在 `Y` 轴上精确移动到 Rain\
  \ 前方 `\\-0.2` 米处。\n3.  将 `MSTR-Foot_Parent.R` 在 `Y` 轴上精确移动到 Rain 后方 `0.3` 米处。\n\
  4.  为 `MSTR-Foot_Parent.L`、`MSTR-Foot_Parent.R` 和 `MSTR-Pelvis_Parent` 插入位置关键帧。\n\
  \n这与你之前看到的触地姿势相去甚远，但暂时够用了：\n\n![Figure 8.9: Rain putting one foot forward](img/B17149_08_9.jpg)\n\
  \n图 8.9：Rain 迈出一只脚\n\n重要的是我们已经确定了 Rain 双脚在 `Y` 轴上的距离。如果一只脚在前方 -0.2 米，另一只脚在后方 0.3\
  \ 米，总距离就是半米。翻倍后，你就得到了后脚在后续触地姿势中必须覆盖的距离，以便像前脚一样领先于对侧脚。\n\n这就是所谓的走路循环的 `stride length`（步幅长度），这个值不亚于走路循环周期的关键。步幅长度和周期共同决定了角色在世界空间中的整体移动速度。碰巧的是，我们的步幅长度是\
  \ 1 米，行走速度为每 24 帧 1 米。整齐划一，对吧？\n\n### Rain 的两小步\n\n现在，迈出我们真正的第一步！我们将跳到第 `12` 帧并关键\
  \ `Right Contact`（右触地）姿势：\n\n1.  转到第 `12` 帧（`Right Contact`）。\n2.  将 `MSTR-Foot_Parent.R`\
  \ 在 `Y` 轴上精确向前移动 `\\-1.0` 米。\n3.  为两只 `IK` 脚骨插入位置关键帧（但不包括躯干）。\n\n好了，我们的第一步完成了！暂时别管它看起来怎么样：\n\
  \n![Figure 8.10: Right foot forward 1 meter](img/B17149_08_10.jpg)\n\n图 8.10：右脚向前\
  \ 1 米\n\n现在让我们把左脚向前移动以关键最终的 `Left Contact` 姿势。我们还需要将躯干向前移动 1 米以跟上其他部分：\n\n1.  转到第\
  \ `24` 帧（另一个 `Left Contact`）。\n2.  将 `MSTR-Foot_Parent.L` 和 `MSTR-Pelvis_Parent`\
  \ 在 `Y` 轴上精确向前移动 `\\-1.0` 米。\n3.  为这三根骨骼全部插入位置关键帧。\n\n有了这些最后的关键帧，我们在第 `24` 帧结束走路循环，姿势与第\
  \ `0` 帧开始时完全一致，但有一个重大变化——这三根骨骼每根都向前移动了 1 米：\n\n![Figure 8.11: Rain on frame 24](img/Image96487.jpg)\n\
  \n图 8.11：第 24 帧的 Rain\n\n让我们在图表编辑器中检查 `Y Location`（Y 位置） F 曲线：\n\n![Figure 8.12:\
  \ Y Location F-curves of forward-moving bones](img/B17149_08_12.jpg)\n\n图 8.12：前向移动骨骼的\
  \ Y 位置 F 曲线\n\n脚骨交替出现的平坦段代表每只脚着地支撑的时间，此时对侧脚摆动向前，身体其余部分向前移动。这些平坦段必须保持平坦，否则脚在本应保持原地时会发生滑动。\n\
  \nEt voila（瞧），两步走完——我们的走路循环实际上已经完成了！\n\n![Figure 8.13: Three initial key poses](img/B17149_08_13.jpg)\n\
  \n图 8.13：三个初始关键姿势\n\n怎么说呢？我同意，它看起来 terr...ific（棒极了）！确实是个极好的走路动画。好到我们已经准备好让它永远循环下去了。\n\
  \n## 循环动画\n\n我们需要 Rain 继续行走（好吧，是拖着脚走）下去，但到目前为止，我们只有这两步。要想真正成为一个走路循环，Rain 必须像我们在\
  \ *第 2 章* 中扔出去的那个弹跳球一样，持续移动到时间的尽头。\n\n让我们先让这三根骨骼的运动变得循环：\n\n1.  在图表编辑器中，选择所有三根骨骼\
  \ `MSTR-Foot_Parent.L`、`MSTR-Foot_Parent.R` 和 `MSTR-Pelvis_Parent` 的所有 F 曲线。\n2.\
  \  使用 `Set Keyframe Extrapolation`（设置关键帧外推）（`Shift` + `E`）| `Make Cyclic`（设为循环）。\n\
  \n**重要提示**\n\n虽然我们目前专注于 `Y Location` 通道，但请记住也要将所有其他 F 曲线设为循环。\n\n我们似乎有进展了，但 Rain\
  \ 原地不动。这是生成的 `Y Location` F 曲线，已缩放以便我们看到第一秒动画之外的走向：\n\n![Figure 8.14: Cyclic F-curves](img/B17149_08_14.jpg)\n\
  \n图 8.14：循环 F 曲线\n\n呃，我真讨厌那些丑陋的垂直悬崖！它们很少是好兆头。这种周期性导致 Rain 的骨骼每 24 帧就弹回初始位置——这是首尾关键帧不相等的循环\
  \ F 曲线导致的结果。技术上讲它在重复，但不是我们想要的那种重复。 Rain 去不到任何地方，而我们需要她在 24 帧后移动 1 米，48 帧后移动 2 米，以此类推。\n\
  \n`Linear Extrapolation`（线性外推）能解决问题吗？那对躯干管用，但无法重复脚部的运动：\n\n![Figure 8.15: Extrapolated\
  \ F-curves](img/B17149_08_15.jpg)\n\n图 8.15：外推 F 曲线\n\n我们需要的是外推和重复的结合。我们需要 F 曲线能够复合，即每次重复都在其首尾关键帧的数值偏移基础上累加；如果你愿意，可以称之为\
  \ `repeat with offset`（带偏移重复）。\n\n### 偏移循环\n\n循环属性属于 F 曲线的一个 `F-curve modifier`（F\
  \ 曲线修改器）。F 曲线修改器作为非破坏性效果工作，非常像网格物体上的修改器。活动 F 曲线的修改器位于图表编辑器右侧边栏的 `Modifiers`（修改器）选项卡中：\n\
  \n![Figure 8.16: Cycles modifier](img/B17149_08_16.jpg)\n\n图 8.16：循环修改器\n\n原来 `Make\
  \ Cyclic` 操作只是给选中的 F 曲线添加了一个 `Cycles` 修改器！\n\n**重要提示**\n\n此处的“Cycles”仅指循环。该词与 Cycles\
  \ 渲染器无关。\n\n`Cycles` 修改器面板包含一些我们迫切需要的额外设置。你必须一个修改器一个修改器地手动更改它们，好在只有三条 F 曲线需要这种处理：\n\
  \n1.  导航到图表编辑器右侧边栏（`N`）的 `Modifiers` 选项卡。\n2.  将三条 `Y Location` F 曲线的 `Cycles` 修改器的\
  \ `Before Mode`（前向模式）和 `After Mode`（后向模式）都改为 `Repeat with Offset`（带偏移重复）。\n\n这是我们现在的\
  \ Y Location F 曲线：\n\n\n\n![图 8.17：使用“带偏移重复”的 F 曲线](img/Image96543.jpg)\n\n图 8.17：使用\
  \ `Repeat with Offset` 的 F 曲线\n\n这更像样了。现在 Rain 持续向前蹒跚而行，就像我们一直知道她能成为的马拉松蹒跚者一样。\n\
  \n重要提示\n\n正如循环 `F 曲线` 的周期由首尾关键帧之间的总时间决定一样，使用 `Repeat with Offset` 的循环 `F 曲线` 的偏移量也由这些关键帧之间的数值变化决定。无论如何，首尾关键帧都非常重要。小心别不小心移动了它们！\n\
  \nRain 的走路循环现在超过 24 帧了，但不用说它仍需打磨。我们稍后会处理，但所有这种前向移动带来的一个直接问题是——很难操作！\n\n## 让 Rain\
  \ 跑步机上走\n\n播放时，如果 Rain 一直走远离我们，我们要在动画上工作会很恼人。让动画播放足够长的时间，Rain 甚至会离开屏幕：\n\n![图 8.18：嘿，你去哪了？！](img/B17149_08_18.jpg)\n\
  \n图 8.18：嘿，你去哪了？！\n\n回顾 3D 动画循环的真言：一切必须回到起点。但由于每 24 帧有 -1.0 米的偏移，我们的走路循环有一个恼人的非循环方面。是的，我们确实想让\
  \ Rain 向前移动，但不希望是以这种方式工作！\n\n要在不撤销已完成工作的情况下修复此问题，我们可以选择一个作为其他三根骨骼父级的骨骼，然后让它沿 Rain\
  \ 行走方向的反方向移动动画。这将产生让 Rain 原地行走的效果，就像她在跑步机上行走一样。\n\n### 反转步幅偏移\n\n用于此目的最明显的骨骼是 `ROOT`\
  \ 骨骼，所有其他骨骼实际上都父级于它。然而，在 Rain 的 `IK` Secondary 骨架层中藏着一个更好的选择——一根名为 `ROOT_Child`\
  \ 的骨骼：\n\n![图 8.19：ROOT_Child 骨骼，比 ROOT 稍小](img/B17149_08_19.jpg)\n\n图 8.19：`ROOT_Child`\
  \ 骨骼，比 `ROOT` 稍小\n\n`ROOT_Child` 是 `ROOT` 的直接子骨骼，充当 `ROOT` 和大多数其他骨骼之间的中间父级。\n\n\
  现在让我们为它制作动画。我假设你知道如何创建一条直线 `F 曲线`：\n\n1.  启用 `IK Secondary` 骨架层并找到骨骼 `ROOT_Child`。\n\
  \n2.  为 `ROOT_Child` 制作动画，使其持续且反向于 Rain 的步幅移动。这将产生一条斜率为每 24 帧 1.0 米的线性 `Y Location`\
  \ `F 曲线`。\n\n3.  你可以像以前一样禁用 `IK Secondary` 层。\n\nRain 的步幅已被抵消。现在她行走时将保持原地，形成完美的视觉循环：\n\
  \n![图 8.20：ROOT_Child 的线性动画使 Rain 保持原地](img/B17149_08_20.jpg)\n\n图 8.20：`ROOT_Child`\
  \ 的线性动画使 Rain 保持原地\n\n如果稍后我们想让 Rain 自由行走，像以前一样在世界空间中向前移动，我们只需将 `ROOT_Child` 的 `Y\
  \ Location` `F 曲线` 静音即可。\n\n此技术也适用于 `ROOT`，但使用 `ROOT_Child` 有一些小优势。即它让 `ROOT` 骨骼保持空闲，以便将来如果需要可用于其他目的。\n\
  \n### 为什么要大费周章？\n\n让 Rain 通过向 `Y Location` `F 曲线` 添加特殊循环修改器持续向前移动，然后又全部抵消掉，这有什么意义？我们难道不能一开始就直接为接触姿势设关键帧，而不按步幅长度偏移它们吗？那样我们就不需要让根骨骼向后动画来抵消\
  \ Rain 的前向移动，只需让它向前动画即可。\n\n这听起来不错，但让我们看看 `IK` 脚的 `Y Location` `F 曲线` 需要是什么样子：\n\
  \n![图 8.21：行走 IK 脚的替代 Y Location F 曲线](img/B17149_08_21.jpg)\n\n图 8.21：行走 `IK` 脚的替代\
  \ `Y Location` `F 曲线`\n\n在这个例子中，跑步机效果被“烘焙”进了 `IK` 脚的运动中。每条 `Y Location` `F 曲线` 的那些平坦段变成了对角线，需要专门编辑的贝塞尔关键帧手柄。如果我们编辑这样的\
  \ `F 曲线`，就必须格外小心，始终保持这些对角线段的斜率，否则脚会产生不希望的滑动。这不是一种有趣的工作方式。\n\n现在无论我们的播放范围是什么，Rain\
  \ 都将原地行走！\n\n## 使用预览播放范围\n\n如果我们让动画一直播放到第 250 帧，我们会看到动画有个跳跃，因为播放头从第 250 帧跳回第 1 帧。为了让动画播放时正确循环，我们场景的结束帧值应该是\
  \ 24 的倍数，比如 240 或 120。\n\n其实，完全没必要让动画播放超过第 24 帧。一旦我们看完了第 1 到 24 帧，我们就全看完了，因为我们已经确保最重要的\
  \ `F 曲线` 正确循环。缩短工作播放范围还有助于防止在走路循环范围之外意外插入关键帧，这可能会干扰周期性。\n\n我们已经知道如何使用 `Timeline`\
  \ 中的 `Start` 和 `End` 帧属性设置动画的播放范围，但这次我们将使用另一个小功能：\n\n1.  在 `Timeline` 的标题栏中，启用 `Use\
  \ Preview Range`。这是 `Start` 和 `End` 帧设置旁边带有秒表图标的按钮。\n\n2.  使用替代的 `Start` 和 `End`\
  \ 属性（就在 `Timeline` 中原来属性的位置），将场景的预览帧范围设置为从 1 到 24。\n\n我们现在正在一个临时的“预览”帧范围内工作：\n\n\
  ![图 8.22：替代的开始和结束帧](img/B17149_08_22.jpg)\n\n图 8.22：替代的开始和结束帧\n\n新范围仅影响播放，且仅在 `Use\
  \ Preview Range` 启用期间有效。场景仍保留其旧的 `Start` 和 `End` 帧号。此功能对于在不更改整个场景“官方”范围的情况下专注于较长动画中的一小段帧很有用。\n\
  \n提示\n\n你可以切换 `Use Preview Range` 的开关，并应偶尔这样做，以检查第 24 帧之后 Rain 动画的错误。\n\n我们现在可以播放动画，并随心所欲地观看走路循环无缝循环。\n\
  \n现在看起来不怎么样，但技术上它确实是一个走路循环！我们先做了难的部分，满足了一个非常重要的技术要求：建立腿部 `IK` 链中独立骨骼的循环前向运动。而计算机辅助动画的伟大之处在于我们可以回头迭代改进！在下一节，我们将做\
  \ exactly that，从 Rain 的躯干开始。\n\n## 添加更多周期性运动\n\n我们将保持 Rain 的脚原地蹒跚，将注意力转回 `MSTR-Pelvis_Parent`\
  \ 的运动上。从躯干向外工作，我们将使用 `MSTR-Hips` 和 `MSTR-Chest_Parent`（臀部和胸部的骨骼）添加一些简单的扭转。\n\n重要提示\n\
  \n本节你不再需要输入我的精确数值，请随意实验。唯一的硬性规则是你必须对自己的数值精确，以确保走路循环中没有不对称。\n\n完成后，Rain 的走路循环将开始看起来有点可信（只要你不看她的手臂或腿）！\n\
  \n## 躯干运动\n\n完成 `MSTR-Pelvis_Parent` 的 `Y Location` `F 曲线` 后，我们可以处理躯干应沿其移动的其他两个轴。这些\
  \ `F 曲线` 将正常循环，无任何偏移，但正如我们将看到的，一些 `F 曲线` 只需要半长度的周期。\n\n这是处理后我的 `F 曲线` 的样子：\n\n![图\
  \ 8.23：MSTR-Pelvis_Parent 的 F 曲线](img/B17149_08_23.jpg)\n\n\n\n## 躯干动画基础\n\n## 上下弹动\n\
  \n图 8.23：`MSTR-Pelvis_Parent` 的 F 曲线\n\n现在轮到你了。\n\n在 `Y Location` 之后，`MSTR-Pelvis_Parent`\
  \ 的下一个最重要的动画通道是 `Z Location`，它控制人行走时身体的上下运动。这就是 `High`（高点）和 `Low`（低点）走循环阶段名称的由来；躯干通常在前脚接触地面前达到最高点，在接触地面后立即达到最低点。\n\
  \n现在试试：\n\n1. 找到 `MSTR-Pelvis_Parent` 的 `Z Location` F 曲线。\n2. 在第 `3` 帧（`Left Low`）插入一个关键帧，使\
  \ Rain 的躯干达到低点，约 -2 厘米（`-0.02` 米）。\n3. 在第 `9` 帧（`Left High`）插入一个关键帧，使 Rain 的躯干达到略高于零的高点，约\
  \ 0.5 厘米（`0.005` 米）。\n4. 为了让 Rain 的低点持续时间稍短一些，在第 `6` 帧（`Left Passing`）添加一个关键帧，将躯干抬高一点点，比原本略高。\n\
  5. 通过将最后一个关键帧从第 `24` 帧移动到第 `12` 帧，缩短 F 曲线的周期。\n\n注意，这种上下运动在一个周期内需要发生两次——每一步各一次。我们没有复制关键帧，而是直接将该\
  \ F 曲线的周期设为 12 帧，而不是 24 帧。\n\n## 左右摇摆\n\n除了沿 `Z` 轴的上下运动，行走时的躯干也会倾向于在 `X` 轴上左右摇摆，因为躯干的重量交替地不平衡地支撑在一只脚或另一只脚上。\n\
  \n> **提示**\n> 位于 `Graph Editor`（图表编辑器）右侧边栏的 `Active Keyframe`（活动关键帧）面板，便于检查关键帧的确切数值。\n\
  \n使用你喜欢的任何方法为该运动添加关键帧：\n\n1. 找到 `MSTR-Pelvis_Parent` 的 `X Location` F 曲线。\n2. 在两个\
  \ Passing 帧插入关键帧，使 Rain 的整个躯干在 `Left Passing` 时向左摇摆，在 `Right Passing` 时向右摇摆。\n\n\
  该波动的振幅应很细微，任一方向约 1 厘米（0.01 米）。请参考上图。\n\n仅在两条 F 曲线上添加一些细微的关键帧就能让角色栩栩如生，这难道不神奇吗？事实上，最后那条\
  \ `X Location` F 曲线简直就是一条正弦波。等着看看更多这样的波动会给 Rain 的臀部和胸部带来什么效果吧！\n\n## Action Editor（动作编辑器）\n\
  \n从现在开始，我们添加到动画中的每一条 F 曲线都需要是循环的，但 F 曲线默认不是循环的。一件令人烦恼的事是，每创建一条新的 F 曲线都要执行 `Make\
  \ Cyclic`（设为循环）。\n\n在为更多骨骼添加关键帧之前，我们将在一个听起来没那么令人兴奋的编辑器中解决这个问题：`Action Editor`（动作编辑器）。\n\
  \n## Action Editor 简介\n\n还记得动作吗？它们是包含每个动画对象的多个动画通道和通道组的数据块。Rain 的整个走循环就包含在其中一个动作中；当我们插入初始关键帧时，它会自动创建并被赋予一个通用名称。\n\
  \n动作具有一些基本元数据，可通过动作编辑器访问，方法是转到 Dope Sheet（逐帧编辑器）并更改编辑上下文：\n\n![图 8.24：Dope Sheet\
  \ 中的 Action Editor](img/B17149_08_24.jpg)\n\n图 8.24：Dope Sheet 中的 Action Editor\n\
  \n`Action Editor` 与标准 `Dope Sheet` 几乎相同。其主要区别在于它一次只显示一个动作：所选对象的当前动作。它还允许我们编辑动作的其他属性，例如名称。\n\
  \n## 重命名动作\n\n首先，让我们使用 `Action Editor` 重命名 Rain 当前的动作：\n\n1. 打开 `Dope Sheet`。\n\
  2. 将 `Dope Sheet` 的 `Editing Context`（编辑上下文）更改为 `Action Editor`。\n3. 将动作重命名为你容易记住的名称。\n\
  \n重命名此动作将使其更易于查找，以便我们在未来的动画中将其作为资产重用：\n\n![图 8.25：“Rain Walkcycle”是个完美的名字](img/B17149_08_25.jpg)\n\
  \n图 8.25：“Rain Walkcycle”是个完美的名字\n\n> **提示**\n> 从现在开始，你可以一直打开 `Action Editor` 而不是默认的\
  \ `Dope Sheet`。区别不大，因为我们不会为其他对象制作动画，也不会处理除 Rain 骨架当前动作之外的任何动作。\n\n除了重命名动作，`Action\
  \ Editor` 还能做另一件事——甚至可能是两件别的事！让我们用它来启用一些属性，将整个动作设定为循环。\n\n## 将动作设定为循环\n\n在 `Action\
  \ Editor` 右侧边栏中可以找到一些额外的动作元数据。修改此处的某些属性将使我们的工作更轻松：\n\n1. 在 `Action Editor` 的右侧边栏（`N`）中找到\
  \ `Action`（动作）面板。\n2. 启用 `Manual Frame Range`（手动帧范围），并确保动作的 `Start`（开始）和 `End`（结束）帧分别为\
  \ `0` 和 `24`。\n3. 启用 `Cyclic Animation`（循环动画）。\n\n注意，这些设置不会直接改变 F 曲线或影响动画结果：\n\n\
  ![图 8.26：为动作启用了 Cyclic Animation](img/B17149_08_26.jpg)\n\n图 8.26：为动作启用了 Cyclic\
  \ Animation\n\n我们所做的只是更改关于动作的一些上下文信息，以便其他功能知道它应该是循环的。\n\n### 启用循环感应关键帧\n\n为了让这些设置生效，我们需要在\
  \ Timeline（时间轴）中启用 `Cycle Aware Keying`（循环感应关键帧），方法如下：\n\n1. 打开 `Timeline` 头部的 `Keying`（关键帧）弹出菜单。\n\
  2. 启用 `Cycle Aware Keying`。\n\n现在，添加到 `Rain Walkcycle` 动作中的所有未来 F 曲线将自动变为循环，并拥有\
  \ 24 帧的周期：\n\n![图 8.27：Timeline 中启用了 Cycle-Aware Keying](img/B17149_08_27.jpg)\n\
  \n图 8.27：Timeline 中启用了 Cycle-Aware Keying\n\n让我们在更多骨骼上试试。\n\n## 更多带正弦波的躯干动画\n\n\
  臀部、胸部和肩膀也是走循环的一部分。对这些骨骼进行一些非常简单的关键帧操作，将大大放松 Rain 的动作，使她的走循环更可信。\n\n## 在触地姿势下扭转躯干\n\
  \n我们将从 `Contact`（触地）姿势下的 `Z` 轴旋转开始。因为在走循环的 `Contact` 阶段，双脚通常距离最远，臀部会旋转以帮助跨越这段距离（毕竟它们直接连接到腿部）。因此，胸部和肩膀应反向旋转以平衡该运动：\n\
  \n![图 8.28：旋转臀部、胸部和肩膀的 Contact 姿势俯视图](img/B17149_08_28.jpg)\n\n图 8.28：旋转臀部、胸部和肩膀的\
  \ Contact 姿势俯视图\n\n试一下：\n\n1. 转到第 `0` 帧（`Left Contact`）。\n2. 将 `MSTR-Hips` 绕 `Z`\
  \ 轴旋转约 `-10` 度，方向朝向 Rain 的步幅方向（左侧向前，右侧向后）。\n3. 将 `MSTR-Chest_Parent` 绕 `Z` 轴向相反方向旋转约\
  \ `5` 度。\n4. 延续躯干的动作到 Rain 的肩膀，将 `MSTR-Clavicle.L` 向外旋转、将 `MSTR-Clavicle.R` 向内旋转，绕\
  \ `Z` 轴各几度。\n5. 为这些骨骼插入旋转关键帧。\n\n注意，启用了 `Cycle-Aware Keying` 后，关键帧也已在第 `24` 帧添加。这省去了我们在两个\
  \ `Left Contact` 姿势处重复添加关键帧的麻烦。F 曲线也已自动设为循环。\n\n现在我们只需为 `Right Contact` 姿势插入关键帧，就完成了！\n\
  \n### 镜像躯干旋转\n\n`Paste Flipped Pose`（粘贴翻转姿势）（`Ctrl` + `Shift` + `V`）不仅适用于以 `L` 或\
  \ `R` 结尾的骨骼；它对于镜像矢状面上的骨骼位置（即角色中间没有 L/R 后缀的骨骼，如臀部和胸部）也很有用。\n\n现在试试以节省一点时间：\n\n1.\
  \ 选择 `MSTR-Hips`、`MSTR-Chest_Parent` 和两个 `MSTR-Clavicle` 骨骼。\n2. 复制姿势。\n\n\n\n3.\
  \ 转到对侧的经过姿势帧（第 `12` 帧）并粘贴翻转后的姿势。\n\n4. 再次为所有四根骨骼插入旋转关键帧。\n\nRain 的走路循环看起来越来越好了。甚至开始显得——我敢说——自然了！\n\
  \n## 相位偏移\n\n让我们尝试另一种制作正弦波的技术，这次作用于 `MSTR-Hips` 的 `Y Euler Rotation`（Y 欧拉旋转）F 曲线：\n\
  \n1. 找到 `MSTR-Hips` 骨骼的 `Y Euler Rotation` F 曲线。\n\n2. 选中第 `0` 帧和第 `24` 帧的关键帧，并将它们向上移动\
  \ `5`。\n\n3. 选中第 `12` 帧的关键帧，并将其向下移动 `-5`。\n\n    这使得 Rain 的臀部在不止一个轴上摆动。到目前为止不错，但这波的波峰实际上应该位于经过姿势帧，以便臀部能帮助抬起每一只向前摆动的经过脚。\n\
  \n4. 选中 `Y Euler Rotation` F 曲线的所有关键帧。\n\n5. 将选中内容向右移动 `6` 帧。\n\n生成的 F 曲线波形与我们之前为\
  \ `MSTR-Pelvis_Parent` 的 `X Location` 制作的波形颇为相似，但这次只需要三个关键帧：\n\n![Figure 8.29: Rotation\
  \ F-curves of MSTR-Hips](img/B17149_08_29.jpg)\n\nFigure 8.29: MSTR-Hips 的旋转 F 曲线\n\
  \n将循环 F 曲线的所有关键帧向前移动四分之一周期，如果我们想显得专业一点，这叫作 *90° 相位偏移*。不过我们不想那么专业，所以我只说：如果我们愿意，走路循环中的关键帧可以移出初始帧范围。\n\
  \n> **Tip**\n>\n> 想试验一下走路循环？在动画播放时，你可以在图表编辑器中沿 *X* 轴移动 F 曲线的关键帧来改变相位，或缩放关键帧数值以增强或减弱其强度。这种试验能帮你改进结果或产生新点子。\n\
  \n看看 Rain 现在怎么走！只需一些非常简单的关键帧工作，就真正呈现出了走路的外观。我们还通过确保未来添加的所有 F 曲线都将自动变为循环，为自己省去了一些点击操作。\n\
  \n如果我们是在为腰部以上的镜头制作 Rain 的动画，我们可以跳过脚部动画，那就几乎完成了。这通常是 3D 动画师节省时间的方法：\n\n![Figure 8.30:\
  \ Example camera view above Rain’s legs](img/B17149_08_30.jpg)\n\nFigure 8.30: Rain\
  \ 腿部上方的示例相机视角\n\n但我们的目标是制作一个完整的走路循环，所以让我们把注意力转向 Rain 的脚部。\n\n## 进阶脚部动作\n\n我们知道脚部动画不仅仅是让脚向前滑动——现在到了让它们真正“走”起来的部分！许多动画师在这部分会遇到麻烦，但通过像我们一直在做的那样，将流程分解为合乎逻辑的步骤，我们可以让事情变得简单得多。\n\
  \n我们将从为左脚制作整个周期的动画开始，从第 `0` 帧到第 `24` 帧。然后，左脚所做的一切，右脚可以在 `12` 帧之后（或之前）完成。既然我们已经为双脚的\
  \ `Y Location` F 曲线设置了关键帧，最棘手的部分就已搞定。\n\n> **Important note**\n>\n> 本节几乎所有工作都可以（也应该）在\
  \ 3D 视口的正交侧视图中完成。不再需要数值精度，但要密切关注脚部姿势如何影响膝盖。\n\n## 脚部滚动\n\n在走路循环的前半段，左脚保持与地面接触，但这不意味着它完全静止。以下是我们要找的姿势：\n\
  \n![Figure 8.31: The positions of the left foot at frames 0, 6, and 12](img/B17149_08_31.jpg)\n\
  \nFigure 8.31: 第 0、6、12 帧左脚的位置\n\n最初，左脚以前脚掌着地的方式落在 Rain 身前。脚的其余部分随即迅速拍击地面。平躺几帧后，它将开始向前枢转，但枢转点不同，这次是以前脚掌为支点屈曲，将整个脚踝向上抬起。\n\
  \n这些脚部动作通俗地称为后脚跟滚动和前脚掌滚动，统称脚部滚动。你可能会猜这很难制作动画，如果 Rain 的每只脚没有装配滚动骨骼，你就猜对了！\n\nRain\
  \ 的滚动骨骼名为 `ROLL-Foot_Control.L` 和 `ROLL-Foot_Control.R`。它们是位于 Rain 脚踝后方、处于 `IK`\
  \ 层的旋转箭头形状骨骼：\n\n![Figure 8.32: Roll bone of the left foot](img/B17149_08_32.jpg)\n\
  \nFigure 8.32: 左脚的滚动骨骼\n\n沿 *X* 轴旋转其中一根骨骼，会激活脚部神奇的隐形装配机制，使复杂的脚部滚动动作仅通过一个控制骨骼即可实现。\n\
  \n### 为滚动骨骼设置关键帧\n\n现在让我们为左脚的滚动骨骼制作动画：\n\n1. 选中 `ROLL-Foot_Control.L`。\n\n2. 在第\
  \ `0` 帧（*左脚着地*）设置约 `-40` 度的 `X Rotation`（X 旋转）关键帧。\n\n3. 在第 `3` 帧（*左脚下压*）和第 `6`\
  \ 帧（*左脚经过*）设置 `0` 的 `X Rotation` 关键帧。\n\n4. 在第 `12` 帧（*右脚着地*）设置约 `40` 度的 `X Rotation`\
  \ 关键帧。\n\n这是生成的 F 曲线。稍后我们会微调它：\n\n![Figure 8.33: X Euler Rotation F-curve of ROLL-Foot_Control.L](img/B17149_08_33.jpg)\n\
  \nFigure 8.33: ROLL-Foot_Control.L 的 X Euler Rotation F 曲线\n\n这根骨骼很棒吧？我们仅通过为一个属性设置关键帧，就产生了所有那些动作。\n\
  \n这完成了左脚 24 帧周期的前半段。在第 `12` 帧，右脚落地（待我们制作动画后），左脚准备起脚！\n\n## 抬脚\n\n在走路循环周期的前 12 帧中，左脚停留在地面上，支撑\
  \ Rain 的重量。在随后的 12 帧中，左脚将不再以任何有意义的方式接触地面；相反，它必须抬起，以便向前摆动而不刮蹭地面。\n\n完全抬起脚离地，可以通过编辑脚部主\
  \ `IK` 骨骼的 `Z Location` F 曲线来实现。\n\n1. 找到 `MSTR-Foot_Parent.L` 的 `Z Location` F\
  \ 曲线。\n\n2. 在第 `15` 帧和第 `21` 帧，添加可抬起 Rain 左脚的 `Z Location` 关键帧。\n\n3. 在第 `18` 帧（*右脚经过*）给曲线添加一个凹陷，比相邻关键帧低，但仍高于\
  \ `0.0`，这样脚在经过时贴近地面摆动。\n\n4. 像弹跳球一样，脚在触地前不会减速，所以确保第 `24` 帧几乎没有或完全没有缓出。\n\n生成的 F\
  \ 曲线看起来有点像双峰骆驼。你可以根据喜好微调它：\n\n![Figure 8.34: Z Location of MSTR-Foot_Parent.L](img/B17149_08_34.jpg)\n\
  \nFigure 8.34: MSTR-Foot_Parent.L 的 Z Location\n\n当脚在空中时，我们之前制作动画的滚动骨骼可以负责将脚稳定地旋转回原位，以便在第\
  \ `24` 帧再次触地。\n\n因此，单只脚的动画循环几乎完成了！不过，膝盖处的运动看起来还有点别扭。在我们决定将左脚的 F 曲线复制给右脚之前，必须完善我们的工作，使整条腿平滑移动。\n\
  \n## 修正腿部运动\n\n直到现在，我们制作左脚动画时，把它当成一个独立的小角色，很少考虑它如何与 Rain 的身体其他部分连接。简直就像我们认为脚和臀部是完全分离的身体部位一样！\n\
  \n从某种意义上说，这并没有错。`IK` 链的末端本意就是作为空间中的独立点来摆姿势和制作动画。骨盆放在一处，脚放在另一处，`IK` 约束会为我们完成其余工作。大腿骨和小腿骨（它们不直接摆姿势或制作动画）完全受制于这些起点和终点。Rain\
  \ 的腿甚至会伸缩，以便无论距离多远都能始终触达其 `IK` 目标。\n\n\n\n\n虽然方便，但在某些情况下，这种方法会产生奇怪的效果，就像我们走路循环中的腿一样。它们在\
  \ Rain 行走时似乎会弯曲和抖动。随着我们完成左脚的动画制作，我们已无法再忽视这个问题。\n\n## 膝盖弯曲\n\n在本节中我们处理左脚时，你可能已经注意到，我们缩短了脚踝与髋部大腿根部之间的距离。当\
  \ `IK` 链中的大腿骨和小腿骨不再需要拉伸时，它们会在膝盖处弯曲，这通常是我们想要的效果。\n\n麻烦在于，当 `IK` 腿伸直或接近伸直时，只需极小的变化就会导致\
  \ Rain 的膝盖“弯曲”：\n\n![图 8.35：脚部的微小变化导致膝盖的巨大差异](img/B17149_08_35.jpg)\n\n图 8.35：脚部的微小变化导致膝盖的巨大差异\n\
  \n走路循环中的腿有大量时间处于拉伸与弯曲之间的这个“最佳区间”。这导致了 Rain 腿部抖动的运动，在膝盖处最为明显。\n\n为了更好地诊断问题，我们将利用运动路径，这是我们在\
  \ *第 3 章* 中学到的功能。\n\n## 骨骼运动路径\n\n你知道可以查看单个骨骼的运动路径吗？用于此操作的面板位于骨架对象的 `Object Data\
  \ Properties`（对象数据属性）中（而非对象属性）。\n\n![图 8.36：运动路径面板](img/B17149_08_36.jpg)\n\n图 8.36：运动路径面板\n\
  \n我们只需选择一根骨骼来使用它。位于膝盖的任何骨骼都可以。`IK` 层中没有，但在别处有：\n\n1. 启用骨架层 `Stretch`（拉伸）。\n2. 选择\
  \ Rain 左膝的拉伸骨骼。\n3. 在 `Properties Editor`（属性编辑器）的 `Object Data Properties` 选项卡中找到\
  \ `Motion Paths` 面板。\n4. 为选中的骨骼生成运动路径。你可能需要调整 `Calculation Range`（计算范围）设置，以使所有帧都显示在路径中。\n\
  \n**提示**\n\n考虑为 `Update All Paths`（更新所有路径）操作创建一个快捷键。你会频繁使用它！\n\n这是我的运动路径。注意我已开启帧号显示并再次隐藏了\
  \ `Stretch` 层：\n\n![图 8.37：膝盖的运动路径](img/B17149_08_37.jpg)\n\n图 8.37：膝盖的运动路径\n\n\
  这路径看起来真难看！难怪走路循环在膝盖处看起来很别扭。\n\n## 调整动画以改善膝盖的运动路径\n\n通过擦洗动画并查看左膝的运动曲线，我们可以看到腿在哪些帧表现异常，然后将注意力集中在调整这些帧的\
  \ `F-curves`（F 曲线）上。\n\n例如，如果运动曲线包含难看的尖峰或之字形折线，那么 Rain 的膝盖很有可能在其中一帧或多帧被“锁死”。这可以通过编辑动画来纠正，使脚踝稍微靠近大腿根部。\n\
  \n只需对影响 `IK` 链的一个或多个 `F-curves` 进行非常微小的更改即可。我建议从本节刚制作的 `F-curves` 入手，因为它们提供了最大的宽容度。如果能让膝盖看起来更好，谁说脚不能抬得稍快或稍慢呢？\n\
  \n亲自试试：\n\n1. 从你刚处理的 `MSTR-Foot_Parent.L` 和 `ROLL-Foot_Control.L` 的 `F-curves` 开始，调整动画以平滑膝盖的运动路径。\n\
  2. 你可能还需要调整髋部和/或躯干的动画，以缩短腿部 `IK` 链两端的距离，从而避免 Rain 的腿锁死。\n3. 如果以上都无效，你可以为影响 `IK`\
  \ 链的其他骨骼添加动画，甚至直接为膝盖的拉伸骨骼制作动画！\n\n经过一点调整后，我的运动路径及其关联的运动看起来好多了：\n\n![图 8.38：改善后的膝盖运动路径](img/B17149_08_38.jpg)\n\
  \n图 8.38：改善后的膝盖运动路径\n\n一旦你对 Rain 左腿的完整动画感到满意，就可以准备将你的工作复制到右腿了。\n\n## 从左脚复制动画到右脚\n\
  \n在 24 帧的走路循环周期中，左脚和右脚的工作相差 12 帧。当一只脚在空中向前摆动时，另一只脚必须着地支撑 Rain 的身体，反之亦然。每 12 帧，双脚互换角色。我们刚刚完成了单只脚上骨骼这两种对立且交替的运动；现在只是将我们所做的复制并粘贴到另一侧的骨骼上。\n\
  \n### 复制多条 F 曲线\n\n你已经知道如何使用 `Copy`（`Ctrl + C`）和 `Paste`（`Ctrl + V`）将关键帧从一条 `F-curve`\
  \ 复制到另一条，但你知道我们可以一次性对多条 `F-curves` 执行此操作吗？当跨多个动画通道的关键帧被复制时，粘贴操作可以将这些关键帧粘贴到属于其他骨骼或对象的、同名的选定动画通道中。这在目前非常方便，因为我们想要复制粘贴的动画数据属于两个不同骨骼的两条\
  \ `F-curves`。\n\n**重要提示**\n\n两个 `IK` 脚骨的 `Y Location`（Y 位置）通道（我们在开头附近添加了关键帧）是特殊的。一者的关键帧不应复制到另一者。像往常一样，复制时注意重要上下文（如你的选择），粘贴时注意当前帧。\n\
  \n复制粘贴关键帧可在 `Graph Editor`（图表编辑器）、`Timeline`（时间轴）和/或 `Dope Sheet`（动作编辑器）中进行！现在就试试，以节省一些时间：\n\
  \n1. 复制本节中你处理的左脚 `F-curves` 的所有关键帧。它们是 `ROLL-Foot_Control.L` 的 `X Euler Rotation`（X\
  \ 欧拉旋转）和 `MSTR-Foot_Parent.L` 的 `Z Location`（Z 位置）`F-curve`。\n2. 如果目标 `F-curve`\
  \ 不存在则无法粘贴，而我们尚未为 `ROLL-Foot_Control.R` 的 `X Euler Rotation` 添加关键帧。转到第 `0` 帧并添加。\n\
  3. 选择 `MSTR-Foot_Parent.R` 和 `ROLL-Foot_Control.R` 对应的动画通道并粘贴复制的关键帧。\n\n确保右脚上的新关键帧与左脚上的原始关键帧匹配并观看动画。如果你复制粘贴出错，动画看起来会不对劲，但如果一切正确……\n\
  \n![图 8.39：左右脚同步的滚动/抬起](img/B17149_08_39.jpg)\n\n图 8.39：左右脚同步的滚动/抬起\n\n……动画看起来仍然不对劲。目前看来，Rain\
  \ 似乎长了两只左脚。右脚还需要一次调整！\n\n### 相位偏移\n\n右脚和左脚的交替对立运动必须相差 12 帧（半个周期）。我喜欢称之为 `180° phase-shift`（180°\
  \ 相位偏移），但你可能更喜欢叫它 `moving some keyframes`（移动一些关键帧）：\n\n1. 选择刚才粘贴的所有关键帧。这些是属于 `MSTR-Foot_Parent.R`\
  \ 和 `ROLL-Foot_Control.R` 的所有内容，但不包括任何 `Y Location` 关键帧。\n2. 将选中内容移动 `12` 帧。\n\n\
  你可能会问，“向哪个方向移动 12 帧？”这无所谓！结果是一样的：\n\n![图 8.40：左右脚正确的滚动/抬起](img/B17149_08_40.jpg)\n\
  \n图 8.40：左右脚正确的滚动/抬起\n\n**重要提示**\n\n与给左脚制作动画时类似，你可能仍会在右膝看到一些不规则的“抖动”，这可能需要额外调整。有时即使我们竭尽全力保持动画完美对称，也无法避免这种情况。\n\
  \n现在我们可以说 Rain 真的在走路了！我们完成了走路循环中迄今为止最复杂的任务；我们建立了脚骨和骨盆骨独立的前进运动，为躯干添加了自然的节奏，然后制作了脚部复杂的滚动和抬起动画。还有更多工作要做，但从这里开始，一切都将一帆风顺。\n\
  \n## 完成走路循环\n\n\n\n\n## FK 脚趾\n\n在宣称 Rain 的双脚已完全完成动画制作之前，我们还得通过制作脚趾动画来画上句号。我们要让脚趾在脚后跟触地时向后伸展：\n\
  \n![Figure 8.41: Toe of front foot extending and flattening](img/B17149_08_41.jpg)\n\
  \n**图 8.41：** 前脚脚趾伸展并压平\n\n在后续的某些帧中，你会注意到由于脚掌滚动的效果，Rain 的脚趾会自动弯曲。这在脚被抬起之前看起来很不错，但抬起后显得有点怪异。我们可以让脚趾骨向相反方向卷曲，以在脚离地后抵消这一效果：\n\
  \n![Figure 8.42: Toes of the rear foot going straight, relative to the rest of the\
  \ foot](img/B17149_08_42.jpg)\n\n**图 8.42：** 后脚脚趾相对于脚部其余部分变直\n\n现在试一下。脚趾的骨骼位于 `FK`\
  \ 层中：\n\n1.  启用 `FK` 骨架层。\n2.  使用 `FK-Toe.L`，在 `24` 帧的周期内制作 Rain 脚趾屈曲和伸展的动画。\n3.\
  \  将关键帧复制到另一侧脚趾，并向后移动 `12` 帧，就像你在上一节为双脚所做的那样。\n\n这是我的 F 曲线。你的可能需要稍微额外调整一下，以便在脚趾卷曲时不让它们在紧接着的帧中穿透地面：\n\
  \n![Figure 8.43: X Euler Rotation of FK-Toe.L](img/B17149_08_43.jpg)\n\n**图 8.43：**\
  \ `FK-Toe.L` 的 X 欧拉旋转\n\n随着 Rain 下半身工作的告一段落，我们可以着手处理章节开头隐藏的肢体了。\n\n## FK 手臂\n\n\
  在走路循环中，手臂在身体两侧摆动，与双腿的动作相反：\n\n![Figure 8.44: Initial key poses of the arms, seen\
  \ from above](img/B17149_08_44.jpg)\n\n**图 8.44：** 手臂的初始关键姿势，俯视图\n\n与许多使用 `FK` 手臂的动作一样，动作的时机应从肩膀开始，像延迟信号一样沿着手臂向下传递。回想一下上一章我们做的挥手动作。\n\
  \n1.  前往 `CloudRig` | `Outfits` 取消隐藏 Rain 的手臂。\n2.  在 `CloudRig` | `FK Settings`\
  \ | `FK Hinge` 中，将 `Left Arm` 和 `Right Arm` 设为 `1.0`。\n3.  在第 `3` 帧（`Left Low`，左腿低点），为手臂的\
  \ `FK` 骨骼在其极限旋转处设置关键帧，右臂向前，左臂向后。\n4.  在第 `15` 帧（`Right Low`，右腿低点），为手臂设置翻转后的姿势关键帧。\n\
  5.  使用 `Dope Sheet`（动作编辑器）交错调整手臂骨骼的动作，直到满意为止。\n\n> **提示**\n>\n> Rain 的手摆动时会穿透身体吗？前往发生穿透的那一帧，再设置一个关键姿势将它们向外推开。看看能否在修正后保持\
  \ F 曲线尽可能平滑。\n\n## 最后润色？\n\n走路循环还需要什么？如果你跟我一样，你会想放松 Rain 手部的姿势，修整她的头发和围巾，或者给她的脖子和肩膀加个\
  \ `12` 帧的小弹跳。你也可以探索一下她的其他辅助骨骼如何在不影响现有 F 曲线的情况下叠加额外的动作。\n\n也许你对双腿的效果仍不满意，或者想看看更快或更慢的走路循环是什么样的。如果是这种情况，请在编辑动画时牢记以下规则。\n\
  \n对于名称中带有 `.L` 和 `.R` 的骨骼对，同步编辑它们的关键帧：\n\n![Figure 8.45: Adjusting the Z Location\
  \ animation for both IK feet](img/B17149_08_45.jpg)\n\n**图 8.45：** 调整两只 `IK` 脚的\
  \ `Z Location`（Z 位置）动画\n\n你可以改变步幅，但你需要找到初始阶段我们设置关键帧的所有 `Y Location` 通道，并在 `Graph\
  \ Editor`（图表编辑器）的 Y 轴上将它们全部一起缩放：\n\n![Figure 8.46: Scaling the stride length in\
  \ the Graph Editor](img/Figure_08.46_B17149.jpg)\n\n**图 8.46：** 在 `Graph Editor`（图表编辑器）中缩放步幅\n\
  \n如果你想改变整个走路循环的周期，选中所有关键帧并在 X 轴上缩放它们：\n\n![Figure 8.47: Slowing down the walk cycle\
  \ by scaling everything in the Dope Sheet](img/B17149_08_47.jpg)\n\n**图 8.47：**\
  \ 通过在 `Dope Sheet`（动作编辑器）中缩放所有内容来放慢走路循环\n\n还有一件事：记得保存你的工作！稍后我会展示如何将这个走路循环整合到其他动画中。\n\
  \n## 总结\n\n希望这个练习对你进行得很顺利。在实际工作中，你可能会为各种场景中的许多不同角色创建自己的循环——爬行循环、跑步循环、骑行循环等等——你的流程可能与此大相径庭。\n\
  \n不过，无论你自己的“____ 循环”有多么不同，你都可以从这堂课中带走一条一致的规则：*弄清楚哪些骨骼不会回来*，即哪些骨骼的位置值会随着循环重复而趋向无穷大。一旦弄清楚这一点，就只专注于那些特定的动画通道。先完成难的部分，其余一切自然会就位……\n\
  \n……除非不行。你和我一样，自己的尝试都将充满错误和修改。你得猜测属于你自己的步幅和周期“魔法数字”，随后意识到它们需要修改。这不代表你是新手；这恰恰证明你是专业人士！\n\
  \n在下一章中，我们将把所有走路用的骨骼放在一边，探索另一件我们大多视为理所当然的事情：说话！\n\n## 思考题\n\n1.  如果我们走路循环的第一个姿势在帧\
  \ `0` 设置关键帧，为什么播放范围不应也从帧 `0` 开始？\n2.  是什么让数字 `24` 如此重要？\n3.  在正常的走路循环中，为什么我们选择对手臂使用\
  \ `FK` 骨骼，对脚使用 `IK` 骨骼？你能想到需要相反设置的动画吗？\n4.  是什么让我们前三个设置关键帧的骨骼的 `Y Location` F 曲线如此特别？\n\
  5.  是什么决定了 F 曲线的周期？\n6.  我们走路循环中的大多数 F 曲线需要 `24` 帧的周期，但至少有一个是 `12` 帧周期。是哪一个，为什么？\n\
  7.  将关键帧粘贴到右脚骨骼后，你在动画编辑器中将它们向左或向右移动了 `12` 帧。为什么在这种情况下方向无关紧要？\n8.  在其他一些角色绑定中，`IK`\
  \ 脚有一个称为“脚趾滚动”的额外功能。你猜这有什么作用？\n9.  是什么让走路的角色像独轮车？\n"
- '## 声音与对口型


  电影或视频的视觉成分——无论是动画还是实拍——仅构成成品的一半。另一半是声音。观众听到的内容不亚于他们看到的内容，所以每当动画师在项目中把音频当作事后补充时，我都会感到不寒而栗；仿佛声音只是拍在一个主要视觉媒体上的补充感官层。如果有什么区别的话，情况恰恰相反！


  只要适用，我坚持在开始制作动画前拥有完成的配乐和/或旁白，无论是从客户处获取、与音频工程师合作，还是自行制作音频。音频对于确立动画的节奏和时机至关重要，而在对口型——让角色嘴部动作与预录台词同步——这一任务中，这一点体现得最为淋漓尽致。


  通过在本章让 Rain 进行对口型练习，我们将习惯在 Blender 中使用声音，练习细致的面部动画，并亲身体会声音为何对动画如此重要。


  我们将学习如何做以下工作：


  *   在 Blender 的 `Video Sequencer`（视频序列编辑器）中导入和处理音频

  *   制作 Rain 头部和面部动画，使其与音频同步表演

  *   制作 Rain 嘴部动画


  ## 技术要求






  正如本书这一部分的其他章节一样，要完成以下练习，我们需要在 Blender 中创建一个包含角色 Rain 的新场景。


  不过，这一次我们还需要一些音频来制作 Rain 说话的动画。我录制了一段完美的音频片段供使用：由一位女配音演员说的一句台词——简短、可供解读且无版权限制。


  你可以在此处下载：


  [`github.com/PacktPublishing/Realizing-3D-Animation-in-Blender`](https://github.com/PacktPublishing/Realizing-3D-Animation-in-Blender)[](http://worldsday.org/download/Packt_RainMonologueSample.wav%0D)


  你也可以自行提供音频文件，而不使用提供的 `.wav` 文件，方法包括录制你自己的声音或他人的声音，或者从视频、电影或播客中采样说话声。如果你知道如何操作，这样做也完全可行。


  > **提示**

  >

  > Blender 支持大多数常见的声音文件格式，如 `.mp3`、`.ogg`、`.flac` 和 `.wav`，甚至可以从支持的视频文件中提取音频流。其中
  `.wav` 格式较好，因为它是无损的，且解码所需的处理很少。


  Blender 做不到的一件事是录制音频。为此，你需要像 Audacity 这样免费开源的应用程序：


  [`www.audacityteam.org/`](https://www.audacityteam.org/)


  最后，确保你有一套正常工作的扬声器或耳机来试听选定的音频片段。你会反复试听它，所以我建议使用耳机，以尽量减少让附近的人抓狂的数量。


  ## 在 Blender 中使用声音


  我们的首要任务是将音频导入 Blender，以便在播放动画时能听到它。能在同一个用于制作动画的程序中听到音频是必不可少的，尤其是对于制作人物说话的动画而言。


  在下一节中，我们将学习如何将音频导入场景，然后学习如何编辑它（如果你选择使用提供的配音文件，甚至可能不需要编辑）。一旦我们对音频满意，我将揭示一个容易被忽视的设置，它能确保音频与动画同步播放。


  ## 将音频文件导入视频序列编辑器


  首先将声音文件导入场景。注意，这**不需要**在 3D 空间中添加 `Speaker`（扬声器）对象！


  ![图 9.1：不必要的 Speaker 对象](img/B17149_09_1.jpg)


  图 9.1：不必要的 Speaker 对象


  那些东西用于模拟特定的声源，根据 `Speaker` 对象相对于活动摄像机的位置进行声像平移和淡入淡出。很酷，但超出了我们的需求。


  相反，让我们使用 `Video Sequencer`（视频序列编辑器），它同时也可作为音频序列编辑器：


  1.  打开 `Video Sequencer`（视频序列编辑器）。

  2.  确保你位于 `frame 1`（第 1 帧），因为音频将插入在当前帧。

  3.  使用 `Add`（添加）（`Shift + A`）| `Sound`（声音）。

  4.  在调出的文件浏览器中，找到并选择你想要的声音文件。


  这会将音频作为声音条带插入：


  ![图 9.2：视频序列编辑器中的声音条带，右侧为属性](img/B17149_09_2.jpg)


  图 9.2：视频序列编辑器中的声音条带，右侧为属性


  当你点击 `Play Animation`（播放动画）时，你应该能听到音频，而无需调整任何额外参数。


  > **提示**

  >

  > 如果你听不到声音或音质很差，且你确定问题出在 Blender 上，请检查 `Preferences | System | Sound`（偏好设置 | 系统
  | 声音）下的设置。这可能是默认 `Audio Device`（音频设备）的问题。


  ## 使用声音条带


  声音条带可以像 `Video Sequencer`（视频序列编辑器）中的任何其他条带一样进行编辑。当然，Blender 没有真正的多轨音频编辑套件那样的功能，但它提供的功能比你从一个
  3D 应用程序中预期的要多！


  ### 声音条带属性


  声音条带有一些独特的属性，可以在 `Video Sequencer`（视频序列编辑器）右侧边栏（`N`）中找到。编辑这里的几个属性可以改善我们的体验：


  1.  选择声音条带，转到边栏 `Strip`（条带）选项卡下的属性。

  2.  启用 `Sound | Display Waveform`（声音 | 显示波形）。

  3.  启用 `Source | Caching`（来源 | 缓存）。


  缓存能让音频处理稍微快一点点（也许），但更重要的是启用 `Display Waveform`（显示波形）。启用后，我们就能像在其他音频程序中那样看到声波的峰值：


  ![图 9.3：声音条带中可见的声波](img/B17149_09_3.jpg)


  图 9.3：声音条带中可见的声波


  在声音条带中看到波形，使得查找特定声音发生的精确帧变得容易得多。除其他外，这使得在需要时编辑声音条带变得更容易。


  > **提示**

  >

  > 如果你调整 `Video Sequencer`（视频序列编辑器）中的视图大小，使一个音频条带填满空间，你可以自定义界面，以便在工作时看到音频峰值。尝试在 Timeline（时间轴）和
  `Video Sequencer`（视频序列编辑器）中都启用 `View | Sync Visible Range`（视图 | 同步可见范围）来对齐它们。


  ### 裁剪音频长度


  如果你选择使用提供的音频片段，几乎不需要编辑它。只需确保它从 `frame 1`（第 1 帧）开始。另一方面，如果你导入了自己的音频，可能需要将其裁剪或调整其在时间轴上的位置。


  这是另一个声音条带的示例，直接源自一整期播客节目。注意它是如何超过一小时标记的：


  ![图 9.4：一个长得多的声音条带](img/B17149_09_4.jpg)


  图 9.4：一个长得多的声音条带


  如果我要使用这段音频，我需要直接跳到我喜欢的那个有趣片段；绝不可能为整个节目做动画。我可以在 Audacity 等专用程序中裁剪音频，但 Blender 也能做到。


  声音条带可以像 `Video Sequencer`（视频序列编辑器）中的任何其他条带一样进行编辑。我发现使用 `Strip | Time | Hold Offset`（条带
  | 时间 | 保持偏移）属性能最快地定位到我想要的音频片段：


  1.  编辑声音条带，使其仅包含你想要用于场景的音频片段。

  2.  在 Timeline（时间轴）中，调整场景的帧范围以适应音频的长度。


  务必从头播放音频并一直听到结尾，以确认你的选择。你现在听到的内容将决定动画的时机，并且——假设你不再做进一步更改——将是你在最终视频中听到的内容。


  ## 处理声音的时间轴设置


  如果你曾尝试过将音频和视频一起编辑，或者在一些可疑的盗版网站上看过编码糟糕的电视剧集，你就会知道音频与视频不同步有多么令人抓狂。如果我们要制作一个看起来像是说话声来源的角色动画，我们必须精确掌握这些词语发生的帧。


  当我们点击 `Play Animation`（播放动画）时，Blender 会同时播放动画和音频，但这并不一定意味着两者是同步的。默认情况下，Blender 设置为按顺序
  `Play Every Frame`（逐帧播放），即使帧率滞后。另一方面，音频平滑播放且不跳帧，从点击 `Play Animation`（播放动画）的那一帧开始。结果类似于看无声电影同时听留声机；视频和音频的时机之间没有保证不会漂移。例如，你可能在
  3D 视口中看到 `frame 161`（第 161 帧），却听到来自 `frame 164`（第 164 帧）的音频。


  总体而言，使用 Blender 默认的 Timeline（时间轴）设置，很难准确判断特定声音发生在哪一帧。让我们使其更适合我们的目的：


  1.  打开 Timeline（时间轴）标题栏中的 `Playback`（播放）菜单。

  2.  将 `Sync`（同步）设置为 `Sync to Audio`（同步到音频）。

  3.  启用 `Audio Scrubbing`（音频擦洗/刮擦预览）。





  ## `Sync to Audio`


  `Sync to Audio` 确保我们在播放期间于 `3D Viewport` 中看到的内容与音频保持同步，以免影响我们对动画同步程度的判断：


  ![图 9.5：时间轴中的音频播放设置](img/B17149_09_5.jpg)


  图 9.5：时间轴中的音频播放设置


  此外，我们还启用了 `Audio Scrubbing`。现在，每当我们擦洗或更改帧时，都会听到该帧上播放的微小音频片段。


  试一试！很烦人，对吧？但也挺有用。在擦洗时使用此功能，我们无需一直盯着音频波形，就能准确听到每个单词开始的时间。


  **提示**


  保持同步和条理清晰的另一种方法是在每个单词或短语的开头添加标记。我喜欢将这些标记重命名以反映正在说的台词。


  关于音频的部分到此结束！既然确保了声音位置正确，我们就可以开始制作动画了，因为知道音频将与动画同步。好吧，也许我们目前还无法确定这一点——但如果不同步，至少我们知道该怪谁。


  ## 不说话也能表演


  以音频为指引，我们可以消除对动画时机的所有疑虑。我们确切地知道 Rain 将说什么词、何时说这些词，以及说这些词需要多长时间。


  但这是否意味着我们应该从制作她的嘴部动画开始？未必！事实上，如果我们只先制作那部分动画，看起来会有点怪。嘴巴发出的所有那些小音素和音节都是细节，我们不能从细节入手。此外，角色不仅仅用嘴说话。在本练习中，我们将从让
  Rain 用整张脸“说话”开始。


  ## 关键面部表情


  如果你想得比较远，可能已经听了几遍 Rain 的台词，并在桌前或镜子前自己默念了几遍。这很棒。继续这样做。作为动画师，我们可以通过让配音演员通过我们、通过我们自己的身体来“说话”，在她附身于
  Rain 这具最终的躯体之前，预演角色即将做的动作。


  在听了音频并“给自己做动画”几遍后，再试一次，但这次不要动嘴唇太多。这迫使你用脸部其他部位来表演。Rain 会看向哪里？她会点头还是摇头？会微笑还是皱眉？眉毛会怎么动？这些决定将构成我们动画的第一遍，但尽量别想太多——通过表演出来去感受它！


  以下是我第一遍中的一些关键面部姿势：


  ![图 9.6：Rain 说话时的面部表情](img/B17149_09_6.jpg)


  图 9.6：Rain 说话时的面部表情


  尽管我们将对口型同步推迟到后面的章节，但这并不意味着我们不应在姿势中包含嘴巴。但请注意，我们应避免为颈部以下的任何部位设置关键帧，因为这可能会与稍后将此动画与之前的走路循环相结合的练习产生冲突。请遵循以下步骤：


  1.  启用 Rain 的 `Face Primary` 骨架层。`FK` 层也应该可见，但我们只需要 `FK-Head` 和 `FK-Neck`——你可以隐藏其他
  `FK` 骨骼。

  2.  选择一帧并为其创建一个面部姿势。不必从开头开始，但要尝试熟练使用大量可用骨骼来实现你想要的外观。

  3.  就像我们初次尝试角色动画时那样，选择所有可见骨骼并为其 `Location, Rotation & Scale`（位置、旋转和缩放）设置关键帧。我们稍后随时可以删除不必要的动画通道。

  4.  继续！继续在不同帧为整个头部和面部设置关键帧，直到获得一个大致遵循 Rain 应有面部表情顺序的漂亮序列。

  5.  你可能还希望通过在 `Dope Sheet`（动作编辑器/逐帧编辑器）中选择单个骨骼的通道组并使用 `Channel | Group Channels`（通道
  | 通道分组）（`Ctrl + G`）来合并它们，尽管我建议不要像我们在 第 7 章 中那样激进地操作。例如，这一次我们需要将下巴的关键帧与嘴唇的关键帧区分开：


  ![图 9.7：带有自定义通道组的动作编辑器示例](img/B17149_09_7.jpg)


  图 9.7：带有自定义通道组的动作编辑器示例


  完成后，你应该能看到 Rain 和她的声音之间形成了一种连贯感。她离真正的“说话”还远着呢，但至少她在“感受”所说的内容。别担心如果很乱；在这个阶段，有总比没有强。


  ## 自动关键帧和关键帧集


  需要制作动画的小骨骼太多，插入关键帧变得繁琐。摆好姿势后，你必须记得全选并插入关键帧，否则姿势会重置，你的工作就会白费。这些额外的点击和按键累积起来很可观！


  ### 关键帧集


  到现在，你可能已经厌倦了每次调出 `Insert Keyframe`（插入关键帧）菜单（`I`）时都要选择要设置关键帧的属性。这就是 `Keying Sets`（关键帧集）派上用场的地方。


  你可以在 `Timeline`（时间轴）的 `Keying`（关键帧）菜单中选择 `Active Keying Set`（活动关键帧集）类型：


  ![图 9.8：可用的关键帧集](img/B17149_09_8.jpg)


  图 9.8：可用的关键帧集


  你以前见过这个——这是在 `Insert Keyframe`（插入关键帧）菜单（`I`）中弹出的同一个列表。


  选择关键帧集后，`Insert Keyframe`（`I`）将使用该关键帧集，而不是显示 `Insert Keyframe` 菜单。例如，如果你从此菜单中选择
  `Location`（位置），在 `3D Viewport`（3D 视口）中按 `I` 将绕过常规菜单，立即为所选内容插入 `Location` 关键帧。如果你想挑剔地选择要设置关键帧的属性，这并不是特别有用，因此，我几乎总是选择
  `Available`（可用），这是一个特殊的关键帧集，仅为所选骨骼/物体的现有动画通道设置关键帧。


  ### 自动关键帧


  如果你仍觉得按 `I` 插入关键帧多敲了一次键，请看看那个可以自动插入关键帧的按钮。它看起来像 `Timeline`（时间轴）标题栏中的录制按钮：


  ![图 9.9：自动关键帧](img/B17149_09_9.jpg)


  图 9.9：自动关键帧


  `Auto Keying`（自动关键帧）会在当前帧为所选骨骼或物体插入关键帧，每当它们被变换时——之后无需按 `I`。我一直对这个功能保持沉默，直到现在，因为如果不小心，它会迅速把事情搞砸！


  让我们启用 `Auto Keying`，然后选择一个合适的关键帧集：


  1.  启用 `Auto Keying`。

  2.  打开 `Auto Keying` 按钮旁边的菜单并启用 `Only Active Keying Set`（仅活动关键帧集）。

  3.  转到 `Keying | Active Keying Set`（关键帧 | 活动关键帧集）并选择 `Available`（可用）。


  有了这些设置，我们就不再需要手动插入关键帧了。此外，如果我们在工作中选择删除任何多余的动画通道，`Available` 关键帧集可确保它们不会被意外创建 again。


  当然，即使启用了 `Auto Keying`，在需要为未变换的骨骼/物体设置关键帧的情况下，按 `I` 手动插入关键帧仍然是必要的。还要记住，`Available`
  关键帧集无法创建新的动画通道——如果你尝试为尚未制作动画的骨骼设置关键帧，将会报错。


  最后一点：小心！`Auto Keying` 的一个缺点是很容易意外覆盖关键帧或弄乱 `Dope Sheet`。


  ### 使用自动关键帧优化面部姿势


  让我们在动画的下一遍中试用这些新设置：


  1.  使用 `Dope Sheet` 和 `Pose | In Between`（姿势 | 中间帧）操作符来保持姿势并在已制作的关键帧之间创建分解动作。你可能会惊讶于通过关键姿势之间快速的“缓出”式过渡，你能走多远。

  2.  使用 `Graph Editor`（图表编辑器）来最终确定颈部和头部的运动。





  ### 当你对头部的运动感到满意后，继续处理眉毛，最后是眼睛。


  正如你所见，不用嘴巴也能做大量的“说话”动作！当你对雷恩鼻子以北（注：指面部上半部分）的所有情感和感觉表现范围感到满意时，就可以着手制作嘴部动画了。


  ## 对口型的科学原理


  到了本练习最精彩的部分：制作雷恩嘴部的动画。这将让她“开口说话”（这么说吧）。


  就像走路一样，说话是我们每天都能看到人们做的事情。正如我之前提到的，这会让动画制作变得更难，而不是更容易！因此，先解构我们说话时嘴巴在做什么，这会有所帮助。


  ## 给动画师的语音学知识


  幸运的是，有效的对口型制作不需要完整的语音学课程。我们不需要学习如何说话——只需了解说话这个动作在观察者眼中是什么样子的。


  以下是我们应该了解的语音基本要素——我称之为**嘴型**。当这些下颌、嘴唇、牙齿和舌头的位置按顺序执行时，就是我们说话的方式，也是让角色看起来在说话的方式。大多数单词——甚至短单词——都由多个嘴型组成，因此这些嘴型的切换速度会比我们迄今为止制作动画的任何其他姿势序列都要快。


  ### 元音


  让我们从元音开始：嘴巴张开时发出的基本声音。在英语中，这些通常被称为由字母 *a*、*e*、*i*、*o* 和 *u* 代表的发音。


  英语中的简单元音发音，以及产生它们的嘴型，存在于一种频谱之中，起始于 *see* 中的 *ee*，终于 *root* 中的 *oo*：


  ![Figure 9.10: ee, eh, ah, oh, oo](img/B17149_09_10.jpg)


  图 9.10：ee, eh, ah, oh, oo


  试着把它们连成一个词发出来：*eeeeaaaaaaooooouuuu*。


  注意，颚骨在频谱中间的张开程度比两端大；像 *hot* 中的 *ah* 和 *boat* 中的 *oh* 这样的声音，需要口腔内宽敞、共鸣的空间。同时，也要注意嘴角从
  *ee* 到 *oo* 稳步向内收拢。


  **提示**


  *ee* 的嘴型看起来很像微笑，不是吗？事实上，它们非常相似，在现实生活中，它们使用的是同一组肌肉。但这并不意味着雷恩说 "cheese" 时必须开心。皱眉的角色只需“微笑”足够长的时间以发出正确的
  *ee* 音，然后嘴巴再恢复到不那么开心的姿势即可。同样，微笑的角色也只能做 *oo* 嘴型足够长的时间来完成 *yous* 和 *whos* 的发音，然后 *ee*
  状的微笑就会回到他们的嘴唇上。


  除了频谱上展示的元音外，还有像 *comma* 和 *tuna* 这类单词结尾处的弱 *uh* 音，它发音松散，看起来有点像雷恩下颌只张开一半时的样子。最后，任何元音都可以被“r
  音化”以发出 *r* 音；这主要靠舌头完成，但在外观上，看起来像是上唇微微噘起：


  ![Figure 9.11: “uh” and “er”](img/B17149_09_11.jpg)


  图 9.11：“uh” 和 “er”


  #### 组合元音


  这些元音发音的发声动作融合流畅，能产生更多声音。像 *face* 中的 *a* 和 *ice* 中的 *i* 这样的元音是双元音——分别是 *eh* + *ee*
  和 *ah* + *ee* 的复合音。如果你仔细想想，“辅音” *w* 和 *y* 其实更像元音。


  仅使用我们迄今为止看到的嘴型，我们就可以为 *I*、*our*、*way*、*where* 和 *you* 等单词制作动画。但这些还不足以组成一个完整的英语句子，所以让我们继续讲辅音。


  ### 辅音


  辅音是语言中所有其他的声音——位于元音之间的那些——它们需要以某种方式限制气流通过口腔。为了发出这些声音，下颌倾向于稍微闭合——尽管不一定完全闭合——以便嘴唇、牙齿和/或舌头的某些组合能够接触。


  #### 嘴唇


  我们先从辅音 *b*、*m* 和 *p* 开始。这些很重要，因为它们是**唯一**需要嘴唇完全闭合的辅音，这使它们在对口型制作中最为显眼：


  ![Figure 9.12: The bilabial phoneme](img/B17149_09_12.jpg)


  图 9.12：双唇音素


  虽然它们听起来不同，但从我们的视角来看，它们长得很像。就我们的目的而言，*mum*、*bum* 和 *pub* 这些词基本上会以同样的方式制作动画。


  **提示**


  要发出 *b*、*m* 和/或 *p* 音，嘴唇必须合拢，短暂形成一个气密封闭。但这并不意味着整个下颌都需要闭合。还要考虑到，这是角色嘴唇**必须**这样做的唯一情况。其他时候，嘴巴在单词之间、句子前后通常保持张开状态。


  三个字母，一个嘴型——简单！现在，让我们继续讲点更难的。


  #### 牙齿


  辅音 *f* 和 *v*（如在 *five* 中）看起来也很像。发这些音要求下唇接触上齿：


  ![Figure 9.13: The “f” or “v” sound](img/B17149_09_13.jpg)


  图 9.13：“f” 或 “v” 音


  #### 舌头


  为了让事情变得更难，*th* 音要求我们调出舌头的骨骼，对于雷恩来说，这些骨骼在一个完全不同的骨架层中：


  ![Figure 9.14: Using the tongue bones in Face Extras to make the “th” mouth pose](img/B17149_09_14.jpg)


  图 9.14：使用 `Face Extras` 中的舌头骨骼制作 “th” 嘴型


  舌头的另一个重要用途是发 *l*（小写 *L*）音，如在 *like* 中。为了做出令人信服的 *l*，可能需要看到舌头接触上颚，如下所示：


  ![Figure 9.15: The “l” mouth pose](img/B17149_09_15.jpg)


  图 9.15：“l” 嘴型


  #### 所有其他声音


  英语中还有太多音素需要涵盖了！辅音如 *d*、*g*、*j*、*k*、*n*、*s*、*t* 和 *z*，以及 *ch* 和 *sh*……


  总之，它们看起来都差不多像这样：


  ![Figure 9.16: All the other phonemes](img/B17149_09_16.jpg)


  图 9.16：所有其他音素


  如果它们看起来还有样子的话！复杂的声道发声动作用于其余这些声音——舌头不同部位接触口腔不同部位，等等——但这些都隐藏在视线之外。因此，对我们动画师来说，它们不那么重要。在许多情况下，你只需稍微晃动一下下颌，让它看起来像在动，这就足够了。


  我们现在掌握的语音学知识足以开始制作对口型动画了！


  ## 制作嘴部动画


  制作雷恩嘴部动画与制作比如她手臂的动画没什么两样。制作手臂动画时，你从肩膀和肘部开始，然后是手，最后是手指。这条 `FK` 链虽然不那么明显，但仍然存在于控制雷恩嘴巴的骨骼中。


  最重要的骨骼是 `MSTR-Jaw`，它控制雷恩下颌的张合。如果雷恩打算说话，她就得张合这个东西。接下来是嘴角以及控制上下嘴唇的控制骨骼，它们几乎同等重要。最不重要（但仍有点重要）的是舌头，它有点像嘴巴的小指。


  注意，这与我们刚才介绍人类语音基本音素的顺序相符！首先，元音的类型决定了下颌骨应该张开多远，以及嘴角大致应该有多宽。接下来是由嘴唇和牙齿发出的辅音，最后是舌头。


  大致按这个顺序为雷恩嘴部的各部分设置关键帧，仔细聆听拖动帧时的声音，确保动作在恰当的时间设置了关键帧，以便与声音同步。不知不觉中，你就完成了雷恩说话的动画！


  **提示**





  通常，配音中单词的开头会正好落在两帧之间，你会不知道到底在哪一帧设置关键帧，以让相关动作看起来像是声音的原因。面对这种两难局面时，试着让动画*极微弱地*先于声音。


  与光不同，声音有可感知的缓慢性。我们从观看闪电和烟花等又响又远的视听事件中就知道这一点。仅在 50 英尺（约 15 米）的距离上，某人的声音大约需要 1/24
  秒（1 帧）才能传到你耳边。


  你现在拥有让 Rain 说话所需的所有工具和知识。试一试吧！


  1.  先为一些单词设置关键帧，主要关注 `MSTR-Jaw`，这是张合嘴巴最重要的骨骼，以及嘴角。


  2.  一旦 Rain 的下巴随着配音上下同步运动，继续处理嘴唇形成的较小形状；即第一步中遗漏的那些快速的小音节。


  3.  最后，启用 `Face Extras` 骨架层，为舌头可见（或本应可见）的剩余语音片段制作动画。


  4.  使用 `Action Editor`，将动作重命名为类似 `Rain Speaking` 的名称，并保存你的工作以供后续练习使用。


  只要放置好几个关键帧，就会有“豁然开朗”的感觉，我们听到的词语会仿佛是由 Rain 自己说出来的一样！


  ## Summary


  当我们最初将音频导入场景并播放时，Rain 只是站在那里一动不动，而词语却从别人的嘴里冒出来。现在，经过大量工作，我们可以说是 Rain 在说那些台词！这就像让木偶看起来会说话一样。尽管是我们在拉所有的线，但动画师们却有一种狂喜的满足感，让自己被自己的作品欺骗。


  想象一下，如果没有配音作为参考来做这个动画会有多难；让 Rain 在无声中张嘴说出同样的台词会有多难。后来，配音演员不得不观看你制作的内容，并将他们的表演与你的作品同步，而不是反过来。这个过程称为配音（dubbing），早期许多动画都采用这种方式，但在我看来，效果从来不太对劲。如果可能，一定要先拿到音频。


  作为完成本练习的额外收获，我们现在在 Rain 的小型角色动画作品集中有了两个互补的动作：一个用于说话，另一个用于走路。稍后，我们将使用 Blender 中最后一个、也是最神秘的动画编辑器来组合这些动作。


  我们即将完成本书的角色动画部分。延续“寻常事物难以制作动画”这一主题，下一章将讲解制作最寻常动作的动画，因此也是最棘手的动作之一：*拿起* *东西*。


  ## Questions


  1.  Blender 的 `Video Sequencer` 除了编辑视频序列外还能做什么？


  2.  当你更改场景帧率时，声音条会发生什么？


  3.  Blender 的默认播放设置是 `Play Every Frame`。在哪些情况下这不太理想？


  4.  何时适合使用 `Auto Keying`？


  5.  你会说英语以外的语言吗？有没有一些你用嘴发出的声音或做出的形状在英语中不存在？


  6.  哪个口腔部位在现实生活中说话不可或缺，但在动画中却不那么重要？


  7.  声音快还是光快？这对动画师为什么重要？


  8.  完成这个动画后，想象有人让你替换音频。导演决定他们更喜欢另一个版本，词语和时机略有不同。你有多恼火？

  '
- '# 第 10 章：使用动态约束进行道具交互


  与环境互动是……存在的一个重要方面。我喜欢触摸物体、拿着物体、捡起它们又放下、重新安排周围的世界，以及总体上拥有一个坚实的躯体。我打赌你也喜欢做这些事，你的角色也想做这些事！


  为这制作动画的难度范围可以从显而易见到极其困难。如果我们想让 Rain 戴帽子，可以将帽子父级绑定到她头部的一个骨骼上，然后照常继续；如果她要坐在椅子上，我们只需制作她坐下的动画，不让她穿过椅子即可；如果
  Rain 踢球，我们可以在恰当的时刻制作球飞向空中的动画。


  到目前为止一切顺利——但如果她要用手捡起球并扔出去呢？这需要制作一个*动态*约束——一个在 Rain 触碰球时开始生效、在球离开手时结束的动画约束。首先，我们需要把
  Rain 的手放在球上。接下来，我们要对齐一些东西并创建约束。就约束而言，这个很容易理解。具有挑战性的是为它制作动画……


  在本章中，你将学习如何执行以下操作：


  *   摆姿势让 Rain 用手指抓住物体

  *   使用约束和特殊骨骼“抓取”物体

  *   为约束的影响设置关键帧

  *   将约束的效果应用到物体上


  ## 技术要求


  这没什么惊喜的——要跟着做这个角色动画练习，你需要三样东西：


  *   Blender

  *   Rain

  *   一个包含 Rain 的 Blender 新场景


  这些要求现在对你来说应该讲得通了。如果你不记得 Rain 是谁或如何在 Blender 中使用她，请回到 `Chapter 6`。如果你不记得 Blender
  是什么，可能需要回到 `Chapter 1`！


  ## 触碰物体


  在此动画中，Rain 将用右手捡起一个球，拿一会儿，然后扔出去。这涉及使用约束在 Rain 的骨架和球之间建立对象关系，这与我们在 `Chapter 4` 中看到的不无相似，但增加了一些复杂性。


  让 Rain 手里拿球的第一步是创建一个球并把她的手放上去。非常简单！这将是练习中最简单的部分。之后，事情会变得有点棘手……


  ### 设置镜头


  我们需要建模一个球，并把它放在 Rain 容易够到的地方。比如桌子上正对着她的位置？


  ![Figure 10.1: Rain, with props](img/B17149_10_1.jpg)


  图 10.1：Rain，带道具


  顺便说一句，让我们添加两个新物体：一个球和一张桌子。你可能不是 3D 建模师，这也绝不是一本建模书，所以给球“建模”可能仅仅是添加一个球体，而你的“桌子”可以只是一个盒子。我觉得任何
  3D 动画师都能搞定！


  > **提示**

  >

  > 如果你似乎无法添加、选择或编辑物体，可能是因为你仍处于 `Pose Mode`。你需要处于 `Object Mode` 才能添加新物体，处于 `Edit Mode`
  才能编辑它们。我们有一阵子没用这些其他模式了。


  ### 创建简单道具


  你的桌子可以是任何齐腰高的平坦表面，比如钢琴——最好是三角钢琴：


  ![Figure 10.2: Piano model with 40,000 vertices](img/B17149_10_2.jpg)


  图 10.2：拥有 40,000 个顶点的钢琴模型


  开玩笑的！用一个立方体。


  至于球，任何球体都可以，只要它足够小能放进 Rain 的手里。`0.1 m` 是个合适的直径。随意设置颜色/纹理。


  我给球添加了一个材质，以便更容易地看到它的旋转：


  ![Figure 10.3: Ball](img/B17149_10_3.jpg)


  图 10.3：球


  > **重要提示**

  >

  > 移动和缩放球时请留意当前模式。如果你在 `edit mode` 下一次性移动所有顶点，会将球的几何体从原点处移开；如果你在 `object mode` 下缩放球，会将其对象缩放值从
  `[1.0, 1.0, 1.0]` 修改掉。这两种情况日后都可能导致一些奇怪的行为。




  ## 设置物体到骨骼的关系


  这甚至勉强能称得上建模，但请继续为 Rain 建模这些物体，并将它们组装在一个方便的位置：


  1.  建模一个能放进 Rain 手中的球。

  2.  在 Rain 面前建模一张简单的齐腰高的桌子。

  3.  将球放在桌子上靠近 Rain 右手的位置，这样她就不需要伸得太远就能抓到它。

  4.  将这些物体命名为 `Ball` 和 `Table`。


  现在我们拥有镜头所需的所有物体。如图 10.1 所示，我的桌子遮住了 Rain 的腿，而球离 Rain 足够近，以至于我甚至不需要制作她弯腰捡球的动画。任务本身已经够有挑战性了！


  有了场景中所需的所有物体，我们准备好将注意力转移到 Rain 的绑定上。


  ## IK 手臂的用途


  为了预演她将要执行的动作，我们将再次调整 Rain 绑定中的一些设置以适应此场景。一如既往，我们的目标是让 Rain 更容易制作动画，而在本例中，我们将让事情变得比以往更简单。面部动画和脚步动作等细节在本章中并不重要。


  本练习专注于 Rain 的手与球之间的关系，因此以下调整将为我们简化操作：


  1.  使用 Rain 的 `CloudRig` | `Outfits` 界面隐藏她的马尾辫和其他干扰性配饰。

  2.  启用 `IK`、`FK` 和 `Fingers` 层。

  3.  在 `FK/IK Switch` 设置中，将 `Left Arm` 设置为使用 `FK`，但保持 `Right Arm` 为 `1.0` 以使其使用 `IK`。

  4.  在 `FK Settings` | `FK Hinge` 下，将 `Left Arm` 和 `Right Arm` 都设置为 `1.0`。

  5.  将 `Face Settings` | `Eye Target Parent` 设置为 `Head` (`3`)。

  6.  你可以选择并 `隐藏` (`H`) Rain 髋部以下的所有骨骼。


  这是隐藏了多余骨骼和身体部位后的 Rain：


  ![Figure 10.4: Rain with just enough bones to grab a ball](img/B17149_10_4.jpg)


  图 10.4：只有抓球所需骨骼的 Rain


  也许你能猜到为什么我们要做这些其他更改。首先，将眼球目标父级设置为头部意味着我们可以在本章剩余部分忽略所有面部骨骼——包括眼球目标。


  这里最重要的决定是让 Rain 的右臂由 `IK` 而非 `FK` 控制。我们准备开始制作动画了，马上就会看到这让我们的下一个任务轻松多少。


  ## 伸手去拿物体


  现在我们将从第 `1` 帧到第 `30` 帧实现动画的第一部分：


  ![Figure 10.5: Rain standing versus Rain grasping the ball](img/B17149_10_5.jpg)


  图 10.5：站立的 Rain 与抓球的 Rain


  既然我们可以按任何方便的顺序制作动画，那就先从更重要的姿势开始吧。


  ### 手放在球上


  让我们从第 `30` 帧让 Rain 抓住球开始。这将是球与 Rain 皮肤接触、且我们在骨骼与新物体之间建立关系的关键时刻。


  一件让这项任务变得更容易的事是抓取手使用了 `IK`。当我们确切知道手需要放在哪里时，只需移动和定向 `IK-Hand_Parent.R` 即可，而不必操作整条手臂的
  `FK` 链：


  ![Figure 10.6: Rain’s palm on the ball](img/B17149_10_6.jpg)


  图 10.6：Rain 的手掌放在球上


  之后，还需要让手指恰到好处地贴合球面。Blender 中没有神奇的操作符能替我们完成这部分；我们只需把 Rain 的手放在球上，放大视图，从多个不同角度仔细观察，并在调整姿势时反复检查：


  1.  前往第 `30` 帧。

  2.  调整 Rain 的躯干、颈部和头部骨骼，使她注视并倾向球体。让她的左臂自然下垂，处于舒适角度（本章它不会做太多其他动作）。

  3.  使用 `IK-Hand_Parent.R` 将 Rain 的右手放在球上，使其舒适地贴合手掌。如有需要，调整肩部和 `IK` 极点目标。

  4.  摆姿势 Rain 右手的手指骨骼，使其抓住球。从最靠近手掌的骨骼开始，沿着 `FK` 链向下依次调整。

  5.  为所有可见骨骼的位置和旋转插入关键帧。


  大功告成——一个舒适、自然的抓握姿势：


  ![Figure 10.7: Rain’s whole hand on the ball](img/B17149_10_7.jpg)


  图 10.7：Rain 的整只手放在球上


  让角色真实地抓住东西可能很棘手，对吧？如果你在这里遇到困难，我将简要解释让两个元素接触的细节。


  #### 关于让物体接触


  当为角色持物摆姿势时（实际上无论何时你试图让两个 3D 物体相互接触），你可能会发现自己把视图放得*非常*大——执着地试图让手的一部分越来越靠近物体，却永远不让它们真正“接触”。如果它们接触了，网格就会相交，这往往感觉像是一个不可接受的错误。这似乎让“两物接触”在
  3D 中成为技术上的不可能。在“空隙”和“穿模错误”这条剃刀般细微的边界上，该怎么办？


  在大多数情况下，答案是最好让物体稍微相交一点。在这个极端的特写中，你可以看到 Rain 手指上的皮肤从球体内部戳出了球的表面：


  ![Figure 10.8: View from inside the ball](img/B17149_10_8.jpg)


  图 10.8：从球内部看去的视角


  假设没有人会从这个视角看球，这种微妙的“穿模”通常比物体之间的一层薄薄空气更不易察觉，甚至可能改善视觉效果。只是别让任何手指完全陷进球里……


  ### 手离开球


  我们已经为重要姿势插入了关键帧，那么回到第 `1` 帧，为图 10.5 中展示的第一个简单站立姿势插入关键帧吧。


  当然，如果我们只在这两个姿势之间插值，Rain 的手会完全穿过桌子和球：


  ![Figure 10.9: Frame 16 without any breakdown keying](img/B17149_10_9.jpg)


  图 10.9：未添加任何分解关键帧的第 16 帧


  所以，我们也得解决这个问题。在这里，我们要确保 Rain 的手指不穿过任何东西。角色动画可能不是我们的重点，但我们也不能马虎：


  1.  前往第 `1` 帧，为 Rain 在伸手去拿球前的闲置站立姿势插入关键帧。

  2.  在第 `1` 帧到第 `30` 帧之间，为 `IK-Hand_Parent.R` 再插入一两个姿势关键帧，使 Rain 的手不穿过球或桌子。

  3.  对 Rain 的右手做同样的处理，使她在手抓住球之前先伸直手指、张开手掌。


  这是我制作的 Rain 抓球完整动画：


  ![Figure 10.10: Rain on frames 1, 15, 25, and 30](img/B17149_10_10.jpg)


  图 10.10：第 1、15、25 和 30 帧的 Rain


  有了这个动作，我们初步的角色动画阶段就完成了。最后那个手指姿势对后续很重要，Rain 会保持这个手指姿势直到该松开球的时候。


  一旦 Rain 在第 `30` 帧牢牢抓住球，就目前而言，动画制作只能进行到这一步了。在继续制作动画之前，我们需要在 `Ball` 物体和 Rain 的骨骼之间建立关系。


  从视觉上讲，你可能会说 Rain 的手和球之间已经有关系了。我的意思是，在第 `30` 帧，看起来确实像 Rain 在拿着它（见图 10.7），但球并不知道这一点，如果我们继续制作
  Rain 拿起球的动画，球会固执地停留在原地：


  ![Figure 10.11: What does she think she’s looking at?](img/B17149_10_11.jpg)


  图 10.11：她以为她在看什么？


  本节的目标是将那个球附着到 Rain 骨骼中的某个东西上，这样当 Rain 把它捡起来时，它真的会被捡起来。





  ## 虚拟骨骼 —— 更聪明的绑定方式


  “简单，”你可能会想，“只要把球设为 Rain 手部某根骨骼的子级就行。”许多绑定都是这么工作的，但父子关系是一种“永恒”的关系——它无限延伸向前和向后的时间轴。Rain
  永远都会拿着球。她永远不会放下它，必须像额头上那缕卷发一样把它戴在手上。对于某些场景这或许可以接受，但我们的不行。


  不，Rain 不能成为这个球的父级——反正她年纪太小还做不了母亲。如果球需要被捡起再放下，球与手的关系就需要有明确的开始和结束。为此，我们需要一些约束和一根特殊的骨骼。


  如果你查看 Rain 骨架中的 `IK Secondary` 层，会发现一些特殊的骨骼，其中一些贴心地命名为“dummy:”


  ![Figure 10.12: Dummy bones at the base of Rain’s armature](img/B17149_10_12.jpg)


  **图 10.12：** Rain 骨架底部的虚拟骨骼


  想知道这些骨骼有什么特别之处吗？没有！它们什么都不做，这正是它们如此特别的原因。**虚拟骨骼**没有依赖对象，动画师可以随意使用它们。通常提供它们是为了让道具能依附其上，并作为同一套绑定的一部分进行动画制作。


  > **提示**

  >

  > “虚拟骨骼”是一个实用称呼，而非技术术语。如果一根骨骼在默认情况下移动它不会引发任何动作，它就可以是虚拟骨骼。它们很像**空物体**。如果你正好使用的绑定没有提供虚拟骨骼，你可以用一个**空物体**代替虚拟骨骼，效果是一样的。


  我们要找的虚拟骨骼在 Rain 手边，名字里带有“grab”。你能猜到它是做什么的吗？


  ## 寻找抓取骨骼


  我们要的骨骼在 Rain 的右手边，名为 `GRAB-Hand_Child.R`。为了方便，我们称这根特定的虚拟骨骼为*抓取骨骼*：


  ![Figure 10.13: “Grab” bones for the right hand](img/B17149_10_13.jpg)


  **图 10.13：** 右手的“抓取”骨骼


  如果/当这根骨骼在球内部时可能很难定位，所以我们应该启用**显示骨骼 X 射线**功能，以便更轻松地查看和选择它。可以通过 `切换 X 射线` (`Alt` +
  `Z`) 启用该功能。也可以在 3D 视口标题栏的视口绘制选项中找到它。


  让我们选择这根骨骼：


  1.  启用 `IK Secondary` 层。

  2.  使用 `切换 X 射线` (`Alt` + `Z`) 查看那些原本难以看见的骨骼。

  3.  选择骨骼 `GRAB-Hand_Child.R`，它就在其父级 `GRAB-Hand.R` 内部。

  4.  你可以隐藏 `GRAB-Hand.R` 以及 `IK Secondary` 层上的所有其他骨骼；我们不需要它们。


  > **重要提示**

  >

  > 确保选择的是子级抓取骨骼 `GRAB-Hand_Child.R`，而不是其父级 `GRAB-Hand.R`。父级上有预先存在的约束，会干扰我们添加和应用额外约束，所以我们就不管它，改用它的子级。这又是嵌套父子骨骼关系有用的一个例证。


  注意这根骨骼的名字，它如何漂浮在手掌正前方，以及它实际上是如何作为 Rain 手部的子级的。简直就像绑定师打算让我们用这根骨骼来抓取物体一样！尽管看起来是 Rain
  的手——她的手指、手掌等——捡起了球，但从技术上讲，是这根虚拟骨骼在负责提起。


  现在我们有了这根特殊骨骼，让我们学习将用于它的新约束。


  ## 复制变换约束


  虽然它自称“抓取”骨骼（我承认我也叫它特殊骨骼），但 `GRAB-Hand_Child.R` 本身没有任何特殊的抓取功能。我们得用一个新约束自己加上去。


  简单来说，`复制变换` 约束让一个物体完全处于另一个物体所在的位置。我们想在物体 `Ball` 上使用它，以 `GRAB-Hand_Child.R` 骨骼作为球约束的目标：


  ![Figure 10.14: The Copy Transforms constraint](img/B17149_10_14.jpg)


  **图 10.14：** 复制变换约束


  这就像把 `复制位置`、`复制旋转` 和 `复制缩放` 全都打包在一个约束里！


  只有一个问题——如果我们马上创建那个约束，球会从 Rain 手中的位置弹开：


  ![Figure 10.15: Incorrect bone position causes incorrect ball position](img/B17149_10_15.jpg)


  **图 10.15：** 错误的骨骼位置导致错误的球位置


  ……所以别急着建那个约束！


  我们的抓取骨骼不在正确位置；我们从未调整过它。在给球添加 `复制变换` 约束*之前*，抓取骨骼需要先处于正确位置——*正是球当前所在的位置。*


  怎么做？当然用另一个 `复制变换` 约束！


  ### 将抓取骨骼吸附到球的位置


  像 Rain 手里的其他骨骼一样，我们必须定位 `GRAB-Hand_Child.R` 以适应被抓取的物体。然而，与其他骨骼不同的是，这根骨骼的摆姿势必须完美。手动移动它到看起来对的位置是不够的。


  一种有效方法是在骨骼上使用一个 `复制变换` 约束，然后应用它。


  你知道吗？骨骼可以有**骨骼约束**？现在你知道了！


  ![Figure 10.16: Bone constraint for GRAB-Hand_Child.R](img/B17149_10_16.jpg)


  **图 10.16：** GRAB-Hand_Child.R 的骨骼约束


  骨骼约束的工作原理与物体约束完全一样，只是针对骨骼。像 Rain 这样高级的骨架会用到大量骨骼约束；它们是绑定中不可或缺的功能。


  > **重要提示**

  >

  > 确保点击属性编辑器中的**骨骼约束**选项卡（带骨骼图标的那个），而不是常规的**约束**选项卡。如果你不小心给 Rain 的整个骨架物体加了约束，会立刻发现错误！


  给抓取骨骼添加 `复制变换` 约束：


  1.  找到 `GRAB-Hand_Child.R` 的**骨骼约束属性**区域。

  2.  添加一个 `复制变换` 约束。

  3.  约束的**目标**选择 `Ball` 物体。


  激活该约束后，抓取骨骼占据与球相同的空间位置，并具有相同的朝向：


  ![Figure 10.17: The bone is exactly where it should be](img/B17149_10_17.jpg)


  **图 10.17：** 骨骼正好在它该在的位置


  不过这层关系不打算长久！


  #### 应用约束


  做这么多的目的是把球约束到抓取骨骼，而不是抓取骨骼约束到球。所以在建立*那个*约束之前，必须先应用现有的约束，如下所示：


  ![Figure 10.18: Using the Apply operator for a constraint](img/B17149_10_18.jpg)


  **图 10.18：** 对约束使用应用操作


  创建约束时处于哪一帧无所谓，但应用约束时帧数很重要，所以做这一步时确保你在正确的帧上：


  1.  转到第 `30` 帧。

  2.  应用 (`Ctrl` + `A`) 刚才创建的 `复制变换` 约束。


  约束没了，但骨骼还在原地——正好在球的位置。就像我们神奇地知道该把骨骼移动旋转到哪里，而且第一次就精准到位。


  > **重要提示**

  >

  > 两个骨骼/物体不能互为对方的约束目标。如果我们不应用或移除前一个约束就创建下一个，会导致*循环依赖*——一个不可接受的错误。


  我们用一个 `复制变换` 约束把抓取骨骼精准放置在球的位置，以球为目标。接下来的 `复制变换` 约束，我们反向再做一遍！


  ### 给球添加约束





  我们刚预览了 `Copy Transforms`（复制变换）约束的功能。现在，正式环节开始了。让我们给球添加一个该约束，并将刚才变换过的抓取骨骼作为其目标（见图
  10.14）。


  **提示**


  在球和 Rain 的姿态骨骼之间切换选择，同时也需要在 `Object Mode`（物体模式）和 `Pose Mode`（姿态模式）之间切换。如果你厌倦了频繁这样做，可以尝试禁用
  `Edit`（编辑）| `Lock Object Modes`（锁定物体模式）。你也可以在大纲视图区域选择这些元素。


  要将骨骼用作约束目标，我们必须首先指定骨架物体 `RIG-rain` 作为目标。这样做会显示一个次级字段，你可以在其中指定要使用哪根骨骼，而不是骨架物体本身。


  **重要提示**


  在可用作目标的物体列表中，你可能会看到不止一个版本的 `RIG-rain`。选择那个是 `Library Override`（库覆盖）的版本（其旁边的链接图标上穿过一支箭头）。


  让我们继续创建这个至关重要的约束：


  1. 选择物体 `Ball` 并前往其 `Object`（物体）`Constraint Properties`（约束属性）。

  2. 添加一个 `Copy Transforms`（复制变换）约束。

  3. 对于约束的 `Target`（目标），选择物体 `RIG-rain`。

  4. 将目标 `Bone`（骨骼）指定为 `GRAB-Hand_Child.R`。


  如果你在创建此约束时仍停留在帧 `30`，看起来将好像什么也没发生。这是件好事——这意味着目标 `GRAB-Hand_Child.R` 当前处于完美位置。我们马上就能看到
  Rain 移动手时的效果。


  ### 观察新约束的实际效果


  准备好继续角色动画了吗？让我们回到骨架并为下一个姿态设置关键帧，看看新约束为我们做了什么：


  ![Figure 10.19: Rain, looking at the ball in her hand](img/B17149_10_19.jpg)


  图 10.19：Rain 注视着手中的球


  我们也将保持这个姿态 20 帧，给 Rain 一个思考的时间：


  1. 前往帧 `40`。

  2. 为 Rain 拾起球的姿态设置关键帧。

  3. 将该姿态的所有关键帧复制到帧 `60`。


  在帧 `30` 之后播放动画，我们可以看到预期的效果。Rain 抬起手，球也随之上升。目前看起来就像我们把球父级绑定到了 Rain 的手上。


  恭喜，你让 Rain 拾起了球！但现在，球粘在 Rain 手上，她无法放下。球太“粘人”了！这层关系需要调整。


  ## 具有动画影响力的约束


  让 Rain 抓住球是我们的第一个目标，我们实现了。干得好！事实上，你做得 *有点过头了*。我们的下一个目标，具有讽刺意味的是，让 Rain *不* 抓住球，我的意思不仅仅是指她扔球的时候。


  让我们回到动画的开头。这不是我们想要的：


  ![Figure 10.20: The ball stuck to Rain''s hand at frame 1](img/B17149_10_20.jpg)


  图 10.20：第 1 帧时球粘在 Rain 手上


  虽然约束在 Rain 抓住球后生效，但它在她抓住球 *之前* 也生效了；球不再像应该的那样静止在桌子上。我们需要某种方法关闭约束，并等到合适的时刻再开启它。


  正是为此，约束拥有 `Influence`（影响力）属性，并且它们可以像其他任何东西一样制作动画。


  ## 为约束的影响力设置关键帧


  约束的 `Influence`（影响力）属性非常直观。值为 `1.0` 时，约束处于“全强度”状态；值为 `0.0` 时，就好像根本没有约束一样。


  因此，为了修复前 30 帧的问题，我们只需为球约束的 `Influence` 属性设置关键帧，如下所示：


  1. 找到属于 `Ball` 的 `Copy Transforms`（复制变换）约束的 `Influence` 值。

  2. 在帧 `30` 将 `Influence` 设为 `0.0` 并设置关键帧，在帧 `31` 设为 `1.0` 并设置关键帧。


  我们现在通过为一个重要属性设置关键帧修正了球的行为。前 30 帧的动画恢复正常，直到我们希望它在帧 `31` 生效之前，Rain 的手不会影响球。太棒了！当我们观看动画时，终于能看到
  Rain 拾起物体的完整动作了。


  接下来，我们要让 Rain 抛掉球，结束这层关系。正如你所料，这意味着我们需要在合适的时刻将球约束的 `Influence` 再次动画化回 `0.0`，但这还不是全部。


  ## 释放球


  有些关系注定不长久。该是 Rain 放手、球继续前行的时候了！首先，我们将为 Rain 制作投掷动画，随后在她张开手指时让球离开手。


  除其他外，这要求我们应用（并设置关键帧）约束对一些事物的效果。


  ## 制作投掷/抛掷动画


  好吧，事情是这样的：要制作球离开 Rain 手的动画，我们需要确定她释放球那一刻球在全局空间中的位置：


  * 为此，我们需要制作 Rain 手臂投掷的动画。

  * 为此，我们需要通过为右臂的 `FK/IK Switch`（FK/IK 切换）属性设置关键帧，从使用 `IK` 过渡到使用 `FK`。

  * 为此，我们必须为 `FK` 骨骼的视觉旋转设置关键帧，以便当我们切换到它们时，手臂不会变成这样：


  ![Figure 10.21: FK bones for the right arm, still in their original pose](img/B17149_10_21.jpg)


  图 10.21：右臂的 FK 骨骼，仍处于原始姿势


  哇！让我们从这些 `FK` 骨骼开始。


  ### 视觉变换关键帧简介


  幸运的是，Rain 在拾起球后从帧 `40` 保持姿态到 `60`。这给了我们一个绝佳机会，可以在无人察觉的情况下为 `FK/IK Switch` 属性设置关键帧。


  你可能还记得如果我们随意更改此值会发生什么。Rain 的 `FK` 骨骼自带约束，因为我们从未为它们设置过姿势，右臂的 `FK` 骨骼想要回到它们原始的 T 型姿势。为了无缝过渡，我们需要为它们在
  *我们视角中显示的位置* 设置关键帧，而不是它们 *想要去的位置*。


  这就是 `visual keying`（视觉关键帧）的用武之地。视觉关键帧的选项位于 `Insert Keyframe`（插入关键帧）菜单（`I`）底部附近：


  ![Figure 10.22: Visual keying options in the Insert Keyframe menu](img/B17149_10_22.jpg)


  图 10.22：插入关键帧菜单中的视觉关键帧选项


  让我们尝试设置 `Visual Rotation`（视觉旋转）关键帧。一旦我们这样做，`FK/IK Switch` 值就可以制作动画了：


  1. 选择 Rain 右臂的 `FK` 骨骼。它们是 `FK-Upperarm_Parent.R`、`FK-Forearm.R` 和 `FK-Hand.R`。

  2. 前往帧 `40`。

  3. 使用 `Animation`（动画）| `Insert Keyframe`（插入关键帧）（`I`）| `Visual Rotation`（视觉旋转）。

  4. 在帧 `60` 再次执行此操作（或直接将新关键帧复制到帧 `60`）。

  5. 在帧 `40` 和 `60` 之间，为 `FK/IK Switch` | `Right Arm` 值制作动画，使其从 `1.0` 变为 `0.0`。


  如果你正确地为 `FK` 骨骼设置了视觉旋转关键帧，当 `FK/IK Switch` 值在帧 `40` 和 `60` 之间变化时，Rain 的手臂看起来不会移动。


  **提示**


  骨架上的视觉关键帧，其工作原理就如同我们在为骨骼常规设置关键帧之前，使用了 `Pose`（姿态）| `Apply`（应用）（`Ctrl+A`）| `Apply
  Visual Transform to Pose`（将视觉变换应用到姿态）。重要的部分不是关键帧设置本身，而是将约束应用到设置了关键帧的属性上。


  如果你仍不确定这里发生了什么，当我们为球制作动画时，我们将有另一次机会使用此功能。


  ### 用两个姿势为投掷设置关键帧


  在第 `60` 帧之后，我们现在可以使用 Rain 右臂的 `FK` 骨骼来制作投掷/抛掷动作。


  这里有一个制作令人信服的投掷动画的技巧：从“蓄力”姿势开始……


  ![Figure 10.23: Rain winding back to toss the ball at frame 70](img/B17149_10_23.jpg)


  图 10.23：Rain 在第 70 帧蓄力准备抛球


  ……但随后，*不要* 为 Rain 释放球的那一刻设置姿势：





  ![Figure 10.24: Rain releasing the ball at frame 75](img/B17149_10_24.jpg)


  Figure 10.24: Rain 在第 75 帧释放球


  这是物体关系结束的时候，但不是 Rain 动作结束的时候。跳过这部分，关键帧“随动”：


  ![Figure 10.25: Frame 80. Try and pretend the ball isn’t there](img/B17149_10_25.jpg)


  Figure 10.25: 第 80 帧。试着假装球不在那里


  关键帧“随动”姿势后，我们可以回到“释放”帧，根据需要调整手和手指：


  1.  在第 `70` 帧，为 Rain 关键帧一个“蓄力”姿势。

  2.  在第 `80` 帧，为 Rain 关键帧一个“随动”姿势。

  3.  关键帧手指和其他区域的任何必要调整，以确保球能在第 `75` 帧后顺利离开 Rain 的手。


  完成 Rain 手臂的动作后，我们可以继续制作球的动画。我们快完成了！


  ## 为投掷出的球制作动画


  我们将让球在第 `75` 帧左右离开 Rain 的手，但在我们禁用给它的 `Copy Transforms`（复制变换）约束之前，那东西不会自己去任何地方。所以，只需将
  `Influence`（影响力）值从 `1.0` 关键帧回 `0.0`，我们就完成了，对吧？


  差不多，但不完全是：


  ![Figure 10.26: The ball, at frame 75, is back to where it was at frame 1](img/B17149_10_26.jpg)


  Figure 10.26: 球在第 75 帧时，回到了第 1 帧的位置


  也许你期望约束在我们禁用其影响力后，将其“历史”赋予球的变换属性——就好像球会自动到达不同位置，取决于我们是在帧 `75`、`72` 还是 `80` 结束关系。并非如此。如果你相信这一点，那可能是因为你在第
  `30` 帧做得太好，以至于被自己的把戏骗了！


  将 `Influence` 设为 `0.0`，会释放球，就好像它从未有过任何约束……但它该去哪里？回到我们留下它的地方，带着它从未改变的原始物体变换数值。球可能一直在动，但那些数值没动。它们什么也没感觉到。通过视觉关键帧，我们可以让数值知道它们“睡着”时发生了什么。


  ### 关键帧物体的视觉变换


  让我们更深入地了解视觉关键帧。我们已经在 Rain 的 `FK` 手臂上尝试过一些视觉关键帧，但骨骼相当复杂，而且我们不是自己绑定的 Rain。球将作为一个更好的例子。


  球的位置和旋转需要在两个非常重要的帧上关键帧：


  *   第 `30` 帧，确定它被捡起前的位置。

  *   第 `75` 帧，确定它释放后的位置。


  使用传统的插入关键帧方法，为骨骼或物体关键帧变换属性，只会关键帧我们在该骨骼/物体的 `Location`（位置）、`Rotation`（旋转）或 `Scale`（缩放）属性中看到的名义数值——即
  `Transform`（变换）面板中恰好出现的任何数字。通常这没问题——我们可以像往常一样在第 `30` 帧关键帧球。


  然而，当骨骼或物体被约束时（就像球目前在第 `75` 帧那样），那些看似重要的数字更像是礼貌的*建议*，随后被粗鲁地忽略：


  ![Figure 10.27: These numbers have nothing to do with where the ball is](img/B17149_10_27.jpg)


  Figure 10.27: 这些数字与球在哪里毫无关系


  第 `30` 帧后，被约束球的名义 `Transform` 数值在此没有任何效果，也不受任何约束影响。它们完全没变，所以像平常那样关键帧它们没多大用处。我们这里需要做的是关键帧
  `visual transforms`（视觉变换）——即计入约束效果后，物体位置、旋转和缩放的数值。


  **重要提示**


  此处的“视觉”并不表示一个独特的属性——例如，物体和骨骼除了 `Location` 属性外，并没有 `Visual Location` 属性。它只是指在关键帧之前，将物体约束的效果应用到变换属性的数值上。这完全等同于我们使用
  `Object`（物体）| `Apply`（应用）(`Ctrl` + `A`) | `Visual Transform`（视觉变换），然后像往常一样关键帧位置和旋转。使用视觉关键帧方便地一次性执行这两个操作。


  这次，我们将关键帧 `Visual Location & Rotation`（视觉位置和旋转）：


  1.  选择球。

  2.  转到第 `30` 帧。

  3.  关键帧球的 `Location & Rotation`（视觉与否无所谓——这一帧无所谓）。

  4.  转到第 `75` 帧。

  5.  关键帧球的 `Visual Location & Rotation`。


  关键帧视觉变换属性后，我们的动画看起来似乎没有任何变化。尽管如此，我们刚刚插入了一些非常重要的关键帧——如果你不信，检查一下你的 F 曲线。不过，那些 F 曲线目前还没多大作用——在我们禁用球的
  `Copy Transforms` 约束之前，无法继续为球制作动画。这带我们进入下一步……


  ### 结束物体关系


  最后，我们准备好在第 `75` 帧禁用球的约束。这将有效地结束关系，从今往后允许球像正常一样制作动画。


  这部分非常简单。我们将以在第 `31` 帧“启用”它的相同方式，在第 `75` 帧“禁用”约束：


  1.  再一次，找到 `Ball` 物体的 `Copy Transforms` 约束。

  2.  在第 `74` 帧将 `Influence` 关键帧为 `1.0`，在第 `75` 帧关键帧为 `0.0`。


  注意当你调低其约束的 `Influence` 值时，球没有去任何地方。多亏了视觉关键帧，它保持在原地。


  #### “那时是我背着你走……”


  看看球的 F 曲线，包括其 `Copy Transforms` 约束 `Influence` 的 F 曲线：


  ![Figure 10.28: F-curves of the ball](img/B17149_10_28.jpg)


  Figure 10.28: 球的 F 曲线


  正如你可能猜到的，那些 F 曲线并没有讲完球运动的全部故事。在所有 `Influence` 值为 `1.0` 的帧上，球的 `Copy Transforms`
  约束（因此是 `GRAB-Hand_Child.R` 骨骼）才是控制者。我们在第 `30` 帧和 `75` 帧之间使用什么插值并不重要。但球不知道这一点。就好像它以为自己全靠自己到了那里。多可爱！


  第 `75` 帧后，球自由了，但它保持静止。把球送完剩下的路程取决于我们。


  ### 为投掷出的球制作动画


  这下一部分不难。你从 *第 2 章* 就知道如何为球制作动画了！然而，这次我们必须考虑投掷球的手。球释放前一瞬间手移动有多快，方向是什么？我们希望球释放的那一刻看起来尽可能平滑。方向或速度的任何显著视觉变化都无法传达被投掷的效果。


  让我向你展示一个在释放瞬间捕捉此信息的巧妙技巧。我们将再次关键帧球的视觉变换——不是再次在第 `75` 帧，而是在第 `74` 帧，然后关键帧。这将在 `Graph
  Editor`（图表编辑器）中揭示一些宝贵的见解：


  ![Figure 10.29: F-curves of the ball between frames 74 and 75](img/B17149_10_29.jpg)


  Figure 10.29: 第 74 帧和 75 帧之间球的 F 曲线


  我们刚创建的那个额外的“凸起”发生在球仍被约束时，所以它不直接影响球。相反，我们可以用它作为参考，来确定如何塑造其后的 F 曲线段。


  通过保持每条 F 曲线后续部分与这些段平滑衔接，我们可以保持球的速度和航向，其运动看起来就会很自然：


  ![Figure 10.30: F-curves continued after frame 75](img/B17149_10_30.jpg)


  Figure 10.30: 第 75 帧后继续的 F 曲线


  为什么不试试看？





  1. 在第 `74` 帧应用球的视觉变换并插入关键帧。


  2. 以生成的 F 曲线片段为指引，使用 `图表编辑器` 继续制作球离开 Rain 手后的运动。


  3. 最后，如果我们愿意，可以使用运动路径来检查我们的工作：


  ![Figure 10.31: The motion path of the ball](img/B17149_10_30.jpg)


  Figure 10.31: 球的运动路径


  看起来不错！只是为了好玩，我选择让我的球弹走，但你可能有别的主意。最重要的是球离开场景的那一刻，而是它离开曾约束它的那只手的那些关键帧。一旦球令人信服地做到了这一点，我们就可以宣布胜利——我们与约束进行的三部曲史诗般的战斗结束了！


  ## 总结


  当我们需要一个物体在不同帧上具有不同关系时，这很有挑战性，但没有什么是不可能的。我们只需要做一些仔细的规划，以确定什么影响什么，以及何时影响。我们在这些关系之间的过渡有点像舞台魔术；事物在眨眼间发生变化，观众看不到为设置镜头而进行的所有仔细规划。


  不要认为我们刚学到的技术是唯一的方法！例如，我们可以做完全相反的事情——即将球父级设为抓取骨骼，然后在球*不在* Rain 手中的那些帧上，使用一些目标指向其他虚拟骨骼的
  `复制变换` 约束。


  在其他情况下，我们可能只使用两个相同的球——其中只有一个父级设为手。然后，我们可以在适当的时间让它们出现或消失。这完全取决于具体的镜头和动画师的偏好。


  本章结束了我们动画之旅中的角色动画部分。如果你坚持读到了这里，我印象深刻且真心感激。你已经完全准备好在接下来的几章中学习一些高级技术和功能了！


  ## 问题


  1. 为什么在将 Rain 的手放在球上时，使用 `IK` 比 `FK` 更好？


  2. 为什么抛球时 `FK` 可能比 `IK` 看起来更好？


  3. 为什么虚拟骨骼类似于空物体？


  4. 什么是视觉变换？在什么情况下它们与名义变换不同？


  5. 在第 `30` 帧，我们可以给球的 `旋转和位置` 或其 `视觉位置和旋转` 设关键帧——选哪个都无所谓。为什么？


  6. “Visual”（视觉）表示感知或仿像；某种低于现实的东西。那么，如果它们比名义变换更真实，为什么还叫它们视觉变换？


  7. 为球创建 `复制变换` 约束时，如何确保在第 `30` 帧将其目标设为骨骼 `GRAB-Hand_Child.R` 时，没有任何事情发生？


  8. 在为 `FK` 骨骼设置视觉位置和旋转关键帧后，为什么当我们通过 `FK/IK 切换` 切换到使用它们时，没有任何事情发生？


  9. 为什么球的变换属性在第 `31` 到 `75` 帧之间不起作用？如果它们不起作用，为什么还要在这些帧中为它们制作动画？


  10. 为什么我们总是希望*没有任何事情发生*？这种*无事发生*的*发生*为什么对我们的工作如此重要？

  '
- '# 第 3 部分：高级工具与技术


  如果你一直按顺序阅读这些章节，恭喜你坚持到了这里！在我看来，你已经是“高级”用户了。


  这最后一部分涵盖了我们之前无法涵盖的动画杂项主题，以及无法放在其他地方的额外功能。*第 11 章*、*第 12 章* 和 *第 13 章* 并不像你想象的那么有挑战性；无论你目前的进度如何，请随意跳过去尝试。唯一有先决条件的是
  *第 14 章*。要学习最后那一章，你需要完成 *第二部分* 练习中的另外两个特定角色动画。


  本部分包含以下章节：


  *   *第 11 章**、F 曲线修改器*


  *   *第 12 章**、刚体物理*


  *   *第 13 章**、多摄像机动画*


  *   *第 14 章**、非线性动画*

  '
- '# 第 11 章：F 曲线修改器


  随着我们的角色动画之旅告一段落（大部分），让我们回到基础——但不是太基础！这些最后几章是*高级*基础。这一次，我们将访问 `图表编辑器` 来学习另一个功能：`F
  曲线修改器`。


  *修改器* 是一个在 Blender 中多次出现的术语。你可能熟悉 `属性编辑器` 中更突出的修改器，它们修改你 3D 场景中网格物体的几何体。F 曲线修改器基于类似的想法；它们修改一条
  F 曲线，方便地减少了我们为了达到特定结果而需要插入的关键帧数量。在我们的例子中，它们甚至会完全取代 F 曲线！


  在本章中，你将学习以下主题：


  *   F 曲线修改器在哪里


  *   使用 F 曲线修改器制作周期性运动


  *   我最喜欢的修改器——`噪波`


  *   限制 F 曲线修改器的帧范围


  ### 技术要求


  要开始此练习，请下载以下文件并在 Blender 中打开它：


  [`github.com/PacktPublishing/Realizing-3D-Animation-in-Blender`](https://github.com/PacktPublishing/Realizing-3D-Animation-in-Blender)


  这是一个落地钟！


  ![Figure 11.1: Grandfather clock scene](img/B17149_11_1.jpg)


  Figure 11.1: 落地钟场景


  除了 `摄像机` 物体，此场景中还有几个我们可以纯粹使用 F 曲线修改器来制作动画的东西。


  ### 在哪里找到 F 曲线修改器


  对于这个练习，我们将仅使用 F 曲线修改器为场景中的所有东西制作动画。我希望能说我们完全不需要关键帧，但如果我们要修改 F 曲线，我们需要一些 F 曲线来工作，而要创建那些
  F 曲线，我们需要为每条曲线至少插入一个关键帧。在哪一帧？其实无所谓！一旦我们创建了 F 曲线，修改器就可以接管并完成其余工作。


  我们的第一个任务是为钟的秒针制作动画，其次是它的摆锤。制作动画时，这两个物体都将绕 *Y* 轴旋转。


  让我们开始创建它们的 F 曲线并访问它们：


  1.  为物体 `Second Hand`（秒针）和 `Pendulum`（摆锤）插入旋转关键帧。


  2.  在 `图表编辑器` 中调出这些物体的 F 曲线。


  3.  除了 `Y Euler Rotation`（Y 轴欧拉旋转）F 曲线外，隐藏或删除所有其他曲线。


  > **提示**

  > 你可以通过右键单击属性并选择 `插入单个关键帧`，一次只为一个变换轴插入关键帧。


  在隔离 `Y Euler Rotation` 通道后，剩下的是两条最无聊的 F 曲线：


  ![Figure 11.2: Two animation channels; not even worth screen-shotting](img/B17149_11_2.jpg)


  Figure 11.2: 两个动画通道；甚至不值得截图


  如果我们想让这里发生任何事情，通常至少要再插入一个关键帧。但这次不是这样！


  #### 添加我们的第一个 F 曲线修改器


  时钟的部件具有简单、精确、可预测的运动。这使得它们的动画非常适合使用 F 曲线修改器。选中 F 曲线的修改器可以在右侧边栏的 `修改器` 选项卡中找到：


  ![Figure 11.3: Adding a modifier in the sidebar of the Graph Editor](img/B17149_11_3.jpg)


  Figure 11.3: 在图表编辑器的边栏中添加修改器





  我们的第一个修改器将添加到对象 `Second Hand`（秒针）的 `Y Euler Rotation`（Y 欧拉旋转）F 曲线上。这部分需要根据精确公式无限期旋转。为此，我们可以使用
  `Generator`（生成器）修改器。该修改器基于多项式函数“生成”一条 F 曲线，其中 `X` 是帧号，可编辑的值是系数。在我们的例子中，我们需要最简单的可用函数，它给我们一条永不结束的上升直线。


  当我们最初添加修改器时，它确实给了我们这条线，但有一个小问题：


  ![Figure 11.4: Extremely steep line function](img/B17149_11_4.jpg)


  图 11.4：极其陡峭的线性函数


  正如你所见，默认公式 `y = 1x + 0` 创建了一条对于大多数用途来说荒谬地陡峭的线。它更像是圆锯的旋转速度！公式中默认的 `1.0` 值是线的斜率，如果它要产生秒针的旋转，则需要小几个数量级。


  亲自试一试：


  1. 选择对象 `Second Hand` 的 `Y Euler Rotation` F 曲线。

  2. 在图表编辑器右侧边栏中找到 `Modifiers`（修改器）选项卡。

  3. 点击 `Add Modifier`（添加修改器）| `Generator`（生成器）。

  4. 对于 `x¹` 系数，输入一个能让秒针旋转慢得多的值。


  你在*步骤 4* 中输入的任何值可能并不完全正确。目前这没关系。让秒针每分钟恰好转一圈需要一点算术运算，我稍后会解释。在此之前，让我们继续添加修改器！


  ## 玩转 F 曲线修改器


  在本节中，我们将了解另外几个 F 曲线修改器，以及如何准确获取参数以实现类时钟周期性的实用解释。


  ## Stepped Interpolation（阶跃插值）修改器


  我们的秒针动画缺少几个关键特性。首先，它不像应该的那样“滴答”走动。`Stepped Interpolation` 修改器可以解决这个问题：


  ![Figure 11.5: Stepped Interpolation modifier](img/B17149_11_5.jpg)


  图 11.5：Stepped Interpolation 修改器


  此修改器使 F 曲线“分级”，以便每隔特定帧数才产生一次运动。如果我们将该帧数编辑为与我们的每秒帧率（`24`）相同，时钟的秒针将每秒顺时针精确前进一步。


  修改器的效果是“叠加”的，因此我们可以在现有的 `Generator` 修改器之后，为同一条 F 曲线添加 `Stepped Interpolation` 修改器：


  1. 为 `Second Hand` 的 `Y Euler Rotation` F 曲线添加一个 `Stepped Interpolation` 修改器。

  2. 将 `Step Size`（步长）值设置为 `24`。


  简单！每次滴答的旋转角度可能还不像真正的时钟那样工作，但至少它像真正的时钟指针那样在滴答走动了。在我们调整设置使其完美之前，让我们也关注一下编辑器中的另一条 F
  曲线。


  ## Built-In Function（内置函数）修改器


  `Built-In Function` 修改器用一小部分数学函数来修改或替换 F 曲线。看看可用的各种函数，猜猜哪两个可用于制作摆动的摆锤（提示：不是 `Tangent`
  正切）：


  ![Figure 11.6: Some built-in functions](img/B17149_11_6.jpg)


  图 11.6：一些内置函数


  最初，我们默认得到一个正弦波函数，这非常适合摆动运动（技术上讲，如果你想耍帅，也可以用 `Cosine` 余弦）：


  ![Figure 11.7: Default sine wave created by the modifier](img/B17149_11_7.jpg)


  图 11.7：修改器创建的默认正弦波


  和以前一样，我们仍需对修改器进行一些调整，以便时钟的摆锤在其盒子内合理摆动，而不是不受控制地振动。


  现在让我们用这个修改器来制作摆锤动画：


  1. 选择 `Pendulum`（摆锤）的 `Y Euler Rotation` F 曲线。

  2. 添加一个 `Built-In Function` 修改器。

  3. 调整修改器正弦函数的 `Amplitude`（振幅），使摆锤在时钟内摆动。

  4. 通过减小 `Phase Multiple`（相位倍数）值来减慢波函数。


  如果你仔细想想，这些修改器的命名并不太贴切。毕竟，`Generator` 修改器本身就使用内置函数，而 `Built-In Function` 修改器也“生成”一条
  F 曲线。尽量别为此烦恼。


  **提示**


  F 曲线修改器也可用于驱动器。这就是那些更怪异的内置函数（如 `Tangent`）派上用场的地方。以这种方式使用时，你可以用数学公式驱动一个值，而无需使用任何
  Python 表达式。


  创建并调整完我们迄今为止介绍的所有修改器后，你应该会得到一个乍一看似乎正常工作的时钟。尽管如此，还有让它像真正的时钟那样工作的问题。


  ## 用数学设定时钟


  也许你的时钟秒针走得有点太快，或者不够快。摆锤也是如此。这对某些镜头可能没问题，但我有点完美主义，所以我们将做一点三角学运算，让这个时钟精准运行。


  这比听起来容易得多，因为 Blender 中的任何数字字段都可以输入数学表达式。我们甚至不需要计算器！


  ### 摆锤的周期性


  摆锤时鰐的一件巧妙之处在于，摆锤的摆动通常决定了 1 秒的确切时长。我们目前的摆锤就是这种情况，它摆向左边需要 1 秒，摆向右边又需要 1 秒。这给我们留下了一个迫切的问题：为了实现这一点，`Built-In
  Function` 修改器的 `Phase Multiple` 属性应输入的确切数字是多少？


  对于 `Built-In Function` 修改器的 `Sine`（正弦）、`Cosine`（余弦）和 `Tangent`（正切）函数，当前帧号与 `Phase
  Multiple` 属性相乘，然后由 `Sine`/`Cosine`/`Tangent` 函数解析为 `radians`（弧度）。实际上，这意味着 `Phase
  Multiple` 值应被视为 `pi`（3.14159）的分数。决定半个波周期应持续多少帧（在我们的例子中是 24）。用 `pi` 除以该数，我们就得到了答案：


  ![Figure 11.8: Perfect wave function in the Graph Editor](img/B17149_11_8.jpg)


  图 11.8：图表编辑器中的完美波函数


  ### 给秒针设定时间


  与摆锤一样，秒针也有一个 F 曲线修改器，我们需要为其一个属性提供精确值。`Generator` 修改器的 `x¹` 系数决定了 F 曲线的线性斜率。如果我们把这个值设得恰到好处，时钟的秒针将每分钟转一圈——每
  30 秒转半圈——从而精准计时。


  同样像摆锤一样，这要求我们用弧度思考，即使 `Generator` 修改器不使用三角函数。这是因为 `Euler Rotation` 值本身就是按弧度计算的，尽管它们在
  `Graph Editor` 中显示为度数！


  因此，我们需要计算秒针半圈旋转应持续多少帧。对我们来说，那是 30 秒乘以每秒 24 帧。然后用 `pi` 除以该数：


  ![Figure 11.9: Ideal Generator modifier for the rotation of the second hand](img/B17149_11_9.jpg)


  图 11.9：秒针旋转的理想 Generator 修改器


  ### 直接在数字字段中输入表达式


  回顾一下，以下是完善我们的 F 曲线修改器设置的步骤。请注意，我们不需要进行任何计算，因为可以直接将任何喜欢的数学表达式输入数字字段，Blender 会处理其余的工作。





  你甚至可以直接输入 `pi` 作为 `pi`：


  1. 找到我们为 `Pendulum`（摆锤）的 `Y Euler Rotation`（Y 欧拉旋转）F 曲线创建的 `Built-In Function`（内置函数）修改器。

  2. 在 `Phase Multiple`（相位倍数）属性字段中输入 `pi/24`。

  3. 找到我们为 `Second Hand`（秒针）的 `Y Euler Rotation`（Y 欧拉旋转）F 曲线创建的 `Generator`（生成器）修改器。

  4. 在 `x¹` 系数字段中输入 `pi/(30*24)`。


  这就完成了：一个完美精准的座钟。可能比真实的还要精准……至少如果我们也给分针和时针做动画的话……


  别担心——那太无聊了。谁想盯着时钟看整整一小时？相反，在本章的后半部分，我将向你展示我最喜欢的 F 曲线修改器以及我最喜欢用它做的事情。


  ## 使用 Noise 修改器


  这无疑是 Blender 提供的最有用的 F 曲线修改器：


  ![图 11.10：Noise 修改器](img/B17149_11_10.jpg)


  图 11.10：Noise 修改器


  `Noise` 修改器会沿着 F 曲线生成 `pseudorandom noise`（伪随机噪声），这是一种花哨的说法，意思是它 `deterministically
  randomizes`（确定性地随机化）F 曲线，这又是一种花哨的说法，意思是它让 F 曲线 `go all wiggly`（变得弯弯曲曲）。这和“嘈杂”音频波形的形状没太大区别。任何时候我们想要创建抖动的随机运动，而不需要手动插入一堆随机关键帧时，这都非常棒。


  在本练习中，我们将把 `Noise` 修改器用于其最常见的用例：模拟相机抖动。


  ## 添加 Noise 修改器


  当有人在没有支架或三脚架的情况下操作摄像机时，他们的手会自然地轻微抖动。这种效果可以在录制的视频中看到。在 3D 动画中，我们必须刻意模拟这一点，使相机看起来像是被角色或真人手持的。我们可以通过在动画相机的每个
  `Rotation`（旋转）和 `Location`（位置）F 曲线上添加 `Noise` 修改器来在 Blender 中实现这一点。


  > **重要提示**

  >

  > 当你在 `Graph Editor`（图表编辑器）中处理相机的 F 曲线时，你还应该让一个 3D 视口处于 `Camera View`（相机视图）模式，以便你可以通过相机预览结果。


  让我们首先创建相机所需的所有 F 曲线。和以前一样，你在哪一帧插入这些关键帧并不重要；只需确保相机指向时钟。然后，我们将添加初始的 `Noise` 修改器：


  1. 为对象 `Camera` 插入 `Location & Rotation`（位置和旋转）关键帧。

  2. 在 `Graph Editor` 中，选择相机的 `X` `Location` F 曲线。

  3. 添加一个 `Noise` 修改器。


  我们现在有了第一个可用的 `Noise` 修改器，但天哪！


  ![图 11.11：剧烈抖动的 F 曲线](img/B17149_11_11.jpg)


  图 11.11：剧烈抖动的 F 曲线


  ### 调整 Noise 修改器


  与我们之前添加的 F 曲线修改器一样，`Noise` 修改器的默认设置速度太快了。这在其他情况下可能是可取的，但不适合我们的情况。


  我们需要使用修改器的 `Scale`（缩放）属性来降低抖动速度，并用 `Strength`（强度）属性稍微衰减其整体效果。为了弥补噪声减速过多的问题，我们还将使用
  `Depth`（深度）来增加其细节：


  1. 将 `Noise` 修改器的 `Scale` 调高到约 50.0。

  2. 将修改器的 `Strength` 调低到一个小得多的值——比如 `0.5`。

  3. 将 `Depth` 值增加到 `2` 或 `3`。


  现在，我们的噪声看起来更适合手持相机那种缓慢、微妙的抖动。一旦我们将这个修改器复制到其他 F 曲线，效果将出奇地真实！


  > **提示**

  >

  > 虽然 `Noise` 修改器的 `Blend Type`（混合类型）设置显示为 `Replace`（替换），但它实际上并不会替换 F 曲线或其关键帧。所有内容仍可像往常一样编辑。


  ## 复制修改器


  要为剩下的两个位置 F 曲线添加噪声，我们不需要重复所有步骤。相反，我们可以复制刚才创建的 `Noise` 修改器并将其粘贴到另外两个 F 曲线上。


  修改器的 `Copy`（复制）和 `Paste`（粘贴）操作符位于 `Modifiers`（修改器）选项卡顶部的那两个小剪贴板图标按钮中：


  1. 点击 `Copy F-Modifiers`（复制 F 修改器）按钮以复制 `Noise` 修改器。

  2. 选择 `Y` `Location` F 曲线。

  3. 点击 `Paste F-Modifiers`（粘贴 F 修改器）按钮将复制的修改器粘贴到 `Y` `Location` F 曲线。

  4. 对 `Z` `Location` F 曲线再做一次相同操作。


  > **重要提示**

  >

  > `Copy F-Modifiers` 和 `Paste F-Modifiers` 操作符会复制和粘贴一个 F 曲线堆栈中的所有修改器。如果你只需要复制/粘贴其中的一个修改器，你将需要复制/粘贴所有修改器，然后稍后删除不需要的那些。


  我们现在有了三个设置理想的相同 `Noise` 修改器，而且我们不需要为每一个修改 `Scale`、`Strength` 和 `Depth` 设置。不幸的是，我们不希望
  `Noise` 修改器完全相同！还有一两个设置我们必须调整。


  ### 让随机化更随机


  为每个 F 曲线使用相同的噪声会使相机沿着一条直的对角线抖动，这有点毫无意义。这就是伪随机函数的麻烦所在——随机性可能有点太可预测了！


  我们需要每个 F 曲线以不同的方式随机。为了解决这个问题，我们将使用 `Phase`（相位）属性，它可以平滑地改变噪声函数的种子。`Offset`（偏移）属性也可以通过按给定帧数在时间上偏移波形来帮助实现这一点。


  为每个 `Noise` 修改器稍微修改这些属性有一些有趣的应用。但在我们的例子中，我们只希望这些值 `completely`（完全）不同。点击属性并疯狂地向任一方向拖动鼠标，或者用拳头砸键盘输入一些你自己的随机数！重要的是每个
  F 曲线看起来都不同，尽管它们仍将具有相同的 `Scale`、`Strength` 和 `Depth`。


  我们还将为旋转 F 曲线添加一些 `Noise` 修改器，并对它们做同样的处理：


  1. 对于每个 `Noise` 修改器，更改 `Phase` 和/或 `Offset` 属性，使没有两条 F 曲线看起来相同。

  2. 继续制作相机抖动效果，为其中一条 `Euler` `Rotation` F 曲线创建一个类似的 `Noise` 修改器。

  3. 对于我们的相机，旋转属性对噪声的“敏感度”比位置更高，因此你需要相应地调整新修改器的 `Strength`，以免相机抖动过度。

  4. 将修改器复制并粘贴到其他 `Euler` `Rotation` F 曲线。

  5. 最后，也更改这最后三个 `Noise` 修改器的 `Phase` 和/或 `Offset` 属性，使它们彼此毫无相似之处。


  就这样——我们得到了六个不同的噪声 F 曲线！


  ![图 11.12：F 曲线中完成的相机抖动效果](img/B17149_11_12.jpg)


  图 11.12：F 曲线中完成的相机抖动效果


  在 `Camera View`（相机视图）中播放动画以查看效果！它应该看起来像这样：


  ![图 11.13：相机视图（地板未隐藏）](img/B17149_11_13.jpg)


  图 11.13：相机视图（地板未隐藏）


  哦，对了——印刷页面无法播放动画。就把书举在手臂长度的前面，好吗？这就是我们要追求的效果。


  如果有什么看起来不对劲，继续调整设置，直到获得你看起来不错的那种抖动感。


  ## Noise 修改器的更多妙用


  我希望你从这些练习中学到了东西，因为我得承认——这是一个无聊的动画。谁想看一个愚蠢的时钟，哪怕只有 10 秒？这算什么——某种前卫媒体装置？我们在 `Tate
  Modern`（泰特现代美术馆）吗？！




  ## 第 11 章：F 曲线修改器的更多妙用


  不妨给我们的小项目增添些刺激？比如……画外来个爆炸。那肯定能让事情“摇晃”起来。


  ## 使用 `Noise` 修改器模拟爆炸


  默认情况下，`Noise` 修改器非常嘈杂，会导致动画物体表现得反复无常。这未必是坏事！使用具有不同设置的额外 `Noise` 修改器，我们可以让相机剧烈抖动，仿佛被画面外的爆炸震动一样。


  来吧，现在添加一个新的：


  1. 给相机的 `Z Euler Rotation`（Z 欧拉旋转）F 曲线添加另一个 `Noise` 修改器。

  2. 在这个新修改器上，保持 `Scale` 不变，但将 `Strength` 降至约 `0.2`（那应该足够强了）。


  好了——现在相机真的在抖动了！肯定发生了什么疯狂的事……而且一直在发生，持续发生，不断发生：


  ![图 11.14：额外的 Noise 修改器](img/B17149_11_14.jpg)


  图 11.14：额外的 Noise 修改器


  当然，爆炸本应是一次性事件，而不是永远持续下去的东西。接下来，我们将学习如何通过给这个修改器设定开始和结束来控制爆炸的时机。


  ## 限制修改器的帧范围


  所有 F 曲线修改器都带有 `Restrict Frame Range`（限制帧范围）功能。启用后，我们可以定义修改器何时开始和/或结束。我们还可以让修改器“淡出”，使其以巨大的效果开始，然后逐渐消失。


  现在试试：


  1. 为新的 `Noise` 修改器启用 `Restrict Frame Range`。

  2. 在 `Restrict Frame Range` 参数下，将 `Start` 帧设为 `50`，`End` 帧设为 `80`。

  3. 将 `Blend Out` 值调高到 `30`（修改器的总时长）。


  调整 `Phase` 属性——或任何你喜欢的其他属性——直到效果令你满意。你可能还想考虑给 `X Location` 和 `Y Location` F 曲线添加类似的修改器，就像本例中我所做的那样：


  ![图 11.15：具有帧限制噪声的多条 F 曲线](img/B17149_11_15.jpg)


  图 11.15：具有帧限制噪声的多条 F 曲线


  要查看最终效果应是什么样子，请回顾图 11.13，但这次真正地左右摇晃这本书。


  ## 总结


  `Noise` 修改器还有无数其他用途——地震、闪烁的灯光、随风摇曳的物体——在紧要关头，甚至可以用在角色的骨骼上，让他们站在那里时看起来更生动。多么棒的功能！哦——我们学过的那些其他修改器也很酷，我想。


  另一件很酷的事是，除了开头不得不插入的强制性关键帧外，我们几乎不用任何关键帧就能完成这么多工作。添加修改器后，甚至那些关键帧也可以删除，F 曲线仍会保留（不过别那么做）。就我个人而言，我喜欢极少甚至不需要打关键帧的程序化动画技术。但请记住，修改器不必取代常规动画流程；它们也可以作为我们想让
  F 曲线做的任何其他事情的补充。


  有时放手不管，几乎不加关键帧，让 Blender 为我们程序化地制作动画，也挺有趣的，对吧？如果你同意，下一章你会玩得很开心……


  ## 问题


  1. 如果网格修改器在三个维度工作，F 曲线修改器在几个维度工作？

  2. 对于将被修改的 F 曲线，为什么（有时）我们在哪里插入初始关键帧无关紧要？

  3. `Generator` 修改器还可以使用二次和三次多项式函数生成 F 曲线。这些可能有什么用？

  4. 在什么情况下 `pi` 是 F 曲线修改器中的重要数字？为什么？

  5. 一些修改器有 `Additive` 选项。启用它允许我们做什么？

  6. 如果在修改器栈中，我们练习中的 `Stepped Interpolation` 修改器位于 `Generator` 修改器之前，会发生什么？

  7. 当你尝试为 F 曲线修改器的属性制作动画时，会发生什么？

  8. 既然现代相机和视频软件都试图从实拍素材中消除抖动，为什么还要费心在动画中模拟相机抖动？

