- 'no': 3507
  overturn_probability: 0.1
  alternative: 正文小标题
  counter_evidence:
  - 标题采用 Markdown 二级标题（##）格式而非全书章标题惯用的一级标题（#），层级上可能属于章内小节；
  - 标题仅为数字“6”加主题，缺少“第 X 章”的完整章序表述，编号特征不够明确；
  - 标题后紧跟正文概述段落，未立即出现 X.Y 形式的子节，不符合章标题后通常跟随子节的上下文特征
  keep_split: true
- 'no': 4511
  overturn_probability: 0.05
  alternative: 部分标题
  counter_evidence:
  - 标题包含括号和英文缩写（LDVs），字符长度较长，不符合简短章标题的常规长度；
  - 部分标题与随后的章标题（## 处理大数据量）紧密相连，可能被视为同一逻辑块的引言而非独立分章点；
  - 该部分内容在文档后半部分，可能属于附录或补充说明性质的部分说明
