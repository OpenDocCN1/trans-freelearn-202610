- pgno: 110
  md: '# Data best practices


    It’s no exaggeration if we say data is increasingly becoming one of the most important
    assets an organization has. We looked at an example earlier of how poor data can
    lead to time loss and cost companies significant amounts of unrealized revenue.
    There are processes and tools that you can use to ensure that your data stays
    as clean as possible and viable for continued use in your company. Keep in mind
    that these are best practices and should be considered within the context of your
    Salesforce organization, business needs, and drivers. In the following sub-sections,
    we will look at the guidance that you can use for data in your organization.


    # Leads and contacts


    Ensure that leads and contacts have valid information in them. This can be done
    by running reports to check whether at the minimum either an email or phone number
    exists. Keep in mind that this a guideline only and for your company, it may be
    a set of criteria rather than one field. Do the same thing for contacts but apply
    more rigor to contacts than you did for leads. This is because, in most Salesforce
    implementations, Accounts and Contacts are mastered in Salesforce and you want
    to make sure that your data is reliable especially if it will be fed to downstream
    systems such as BI systems.


    # Inactive owners


    Ensure that records are owned by active owners. Having records owned by inactive
    users can cause issues with data visibility, scheduled reports, and dashboards.
    Salesforce has tools to mass transfer records to a new record owner when the current
    owner needs to be deactivated. One tip is to freeze the user account, perform
    the transfer, and then completely deactivate the account. When doing record transfers,
    also ensure that any default owner fields are also updated. This will ensure that
    any processes running under the current owner don’t error out and, by freezing
    the user account, it protects the system from unauthorized access by the user.
    Default owner fields are a catch-all that prevents records from falling through
    the cracks and allow processing to continue smoothly; for example, Default Workflow
    User, which is displayed when the user that triggered the rule is not active.
    Or, in the example of cases, a Default Case Owner, which Salesforce automatically
    assigns as the case owner when a case doesn’t match any criteria defined in the
    Case Assignment Rule.'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# Orphaned contacts


    Unless you are using personal accounts, there is no reason to have contacts that
    don''t have a corresponding account. When this happens, Salesforce considers that
    contact as a private contact and allows access to the contact owner and administrators
    only. I suggest creating a dummy account, *Account for UNKNOWN Contacts*, and
    link any contact that doesn''t have an account to this dummy account. That way,
    users will have visibility regarding these contacts and can work their way through
    either linking them to the correct account or deleting them from the system.


    # Contacts that move


    Ensure that you have a well-documented plan on how to handle contacts that move
    companies. This can be a real source of pain for marketing and problematic for
    sales as well. Ensure that you have a good process in place and then enforce it.
    Options include using the **Contacts to Multiple Accounts** functionality, prefixing
    the contact with *MOVED COMPANY* or *NOT VALID*, or some indication that the contact
    is not valid. I don''t recommend merely updating the contact''s info, including
    the customer account information, because that can lead to all sorts of problems.
    When that''s done, all the contact history, notes, events, and tasks get moved
    to the new account, which can be very confusing for someone who is referring to
    the contact later.


    # Record types


    When you have existing records on an object and then you create a new record type,
    existing records will not be assigned the record type. Instead, going forward,
    new records will have the record type assigned depending on how many record types
    there are and the default record type. Make sure that you update existing records
    and assign the appropriate record type because otherwise, this can lead to a host
    of other problems with business logic tools, such as Process Builder and validation
    rules.


    # Naming conventions


    Have a naming standard for your organization for key data elements. A very common
    example is *opportunity*, and there are numerous ways in which you can name an
    opportunity within the same organization but implement a consistent process, train
    your users, and remind them frequently. For a company that sells machines and
    focuses on categorizing its customers based on an industry such as mining, construction,
    and government, a good naming convention could be *MIN-ABC Inc-2020* to indicate
    that the customer is in the mining industry, the customer''s name, and then the
    year when the opportunity was created.'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'If Salesforce is the master for accounts, consider having a standard to use
    for names; for example, using legal names where possible. This may not be possible
    at the beginning of the sales process when an account is created from lead conversion
    but, at the time of the quote, this can easily be enforced when you can ask the
    prospect to provide their exact legal entity name. Be careful though because data-enhancing
    services may not use the precise legal name, so do your analysis beforehand and
    understand what data they have and how it will impact your existing data. Another
    benefit of using proper account names is that it helps in duplication rules. For
    example, a sales rep created an account, *Harley Davidson*, and another one created
    an account called *Harley* or *Harleys*. Assuming that the duplicate rule is set
    to an exact match, it will not run and consequently lead to duplicates in your
    organization.


    Don''t underestimate the importance of naming conventions because they help in
    keeping the data organized, deliver consistency, and make it easier for admins
    to manage data. This can also help to keep your data accessible to others when
    a sales representative leaves the company. Consider a company where sales representatives
    don''t enter full contact information, including names, but rather enter some
    random strings in the last name field to keep the contact information to themselves,
    so no one knows exactly who they are talking to. Now, if they leave the company,
    there may be unfinished business with the customer or, worse yet, they may take
    this customer''s contact information to their next company, depriving the company
    they left of potential future revenue.


    We have discussed metadata and data management quite extensively, but this discussion
    will not be complete without talking about backup and recovery strategies and
    some tools for doing that.


    # ## Introducing data backup and recovery


    Backing up your data should be a critical part of your business continuity plan.
    In the Salesforce ecosystems, many organizations don''t have consistent backup
    processes and tools implemented. The thinking usually goes that *Salesforce is
    backing up my data, so I don''t have to.* This is a myth because Salesforce doesn''t
    provide data backup and recovery services. I believe some people confuse Salesforce''s
    near real-time data replication with providing backup services. Real-time replication
    is Salesforce''s way of ensuring high availability for customers, and for maintenance
    and compliance purposes due to hardware failures or power outages.'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'When you log in to Salesforce, your instance is actively served from a location
    referred to as the active site. At the same time, any transactions that are happening
    are replicated to another instance in real time, but at a completely different
    physical location. This instance is referred to as *the ready site*. If the active
    site goes down, Salesforce seamlessly directs customers to the ready site. Because
    the data is replicated in near real time, the chances of customers losing data
    if the active site fails are very low. If a customer loses data due to human error
    or a flow deletes data, Salesforce will replicate that over to the ready site
    as well, so data replication should not be viewed as a data backup service.


    Salesforce did have a data backup recovery service that was discontinued in July
    2020. This was a costly service ($10,000 per incident) and took a lengthy amount
    of time (around 6–8 weeks) to provide the data. Even then, Salesforce couldn''t
    guarantee the recovery of 100% of the data, which highlights the need to have
    your own fully implemented and tested data backup strategy. Salesforce provides
    tools that you can use to back up your data, but it is up to you to implement
    these tools and test your backups on a regular basis.


    Although we have discussed data here to mean records in `Account` and `Contact`
    objects, and records in other standard and custom objects, backing up metadata
    is no less important. This is because admins and developers with the right level
    of permissions can inadvertently update configuration changes, such as fields,
    field types, page layouts, Apex code, and other developers'' metadata. Salesforce
    doesn''t track a lot of these metadata type changes and if you don''t have a backup,
    you won''t be able to restore to prior metadata.


    Before we do a deep dive into data backup, we need to understand why it''s important
    and the benefits of backing up your data.


    # ## Reasons to back up data


    As mentioned earlier, some Salesforce users have misunderstood that Salesforce
    completely protects their data because it''s in the cloud. No doubt, Salesforce
    has implemented robust processes and tools to back up and recover data in case
    of a catastrophic event, but it doesn''t cover all the reasons why data could
    be lost in the first place. Ultimately, the customer is the custodian of their
    data, and not Salesforce, just as you would be responsible for the data if you
    had it in a data center.


    This and other reasons below will elaborate on why it''s important to back up
    your data and not rely solely on Salesforce.'
  merge: -1
  img_proc: true
- pgno: 114
  md: '# Human errors


    Most data loss errors happen because of **human errors**. This can result in the
    permanent deletion of your data without the person doing it even realizing what
    they have done. A few years ago, a Reddit post mentioned a user trying to update
    a few thousand records but they forgot to set the desired record type on those
    records. The platform automatically sets all the uploaded records to the default
    record type. When the person realized that the uploaded records had the incorrect
    record type, they proceeded to run a report for the default record type and subsequently
    deleted all of the records under the default record type.


    The problem was that there were a large number of records with the default record
    type that also got deleted. The user then uploaded the initial load again with
    the correct record type. The mistake wasn''t realized until the next day when
    it was discovered that a large number of records were missing. These and other
    scenarios like this can happen and can be very costly to the business.


    # Retired Salesforce data recovery service


    As mentioned in an earlier section, if you were counting on having your data recovered
    by Salesforce, the data recovery service has not been available since July 2020.
    In this case, if you don''t have a backup of your data and lose data, you will
    have to either rely on old backups (provided you have some) or rekey the data
    from other sources, for example, invoices and orders, but that may not be possible
    for leads or for data that is not in other systems. Even if the data recovery
    service was available, it was a less than optimal solution because Salesforce
    couldn''t guarantee data recovery; it was just limited to transactional records,
    metadata was not included, and it would take 6–8 weeks to recover that data. The
    data was also in CSV format, not to mention that it would cost your organization
    $10,000 per incident.


    # The Recycle Bin


    Salesforce does have the Recycle Bin, with which you can restore records in the
    event of adversity, but the Recycle Bin shouldn''t be considered a backup solution
    because it can restore deleted records. If you have unintentionally updated records
    and want to restore those records, the Recycle Bin will not help you.


    It''s also worth pointing out that the Recycle Bin holds records for 15 days,
    after which point, they are deleted automatically. With the Salesforce data recovery
    service retired, once this happens, there is practically no way to restore that
    data.'
  merge: -1
  img_proc: true
- pgno: 115
  md: '# Salesforce outages


    Salesforce outages can lead to data loss, and this has happened in the past. In
    2019, an unruly script gave view and modify all data permissions to instances
    that had integrated with Pardot. This incident came to be known as Permageddon,
    and caused admins to lose permissions in their orgs. The reason was Salesforce
    deleted all permissions that were affected to protect customers'' data. It was
    a rude awakening for companies that didn''t have metadata backups in place and
    admins had to manually recreate profiles and permission sets for their organization.


    In another instance in 2016, a crash on one of the instances, NA14, caused a few
    hours of customers'' data to be lost and it could not be restored. Salesforce
    has an excellent track record of protecting its customers'' data but, despite
    the best of intentions, things can happen, and customers should be prepared for
    all scenarios.


    # Salesforce recommends backing up


    In this help article (https://help.salesforce.com/articleView?id=000334121&type=1&mode=1),
    Salesforce recommends that customers develop a strategy as part of data management
    and back up their data regularly, and the platform has tools that can be used
    for this purpose. These tools are designed to execute data imports, updates, deletions,
    and so on, but there are lots of third-party tools that specialize in data backup
    and recovery and make the process simple and easy to implement.


    # Quick recovery from catastrophic events


    When a catastrophic event happens, leading to potential data loss, your priority
    is to restore your business operations to provide an ongoing service to your customers.
    Having a data backup strategy that is well thought out and tested gives you the
    peace of mind that recovery will be quick.


    # Migrating data


    When migrating data, having backups gives you the ability to restore data if the
    migration goes south. In certain situations, it can also provide you with the
    ability to retry your loads in a sandbox environment before executing the data
    migration in a production environment. For example, if you have large amounts
    of data for a new application that you want to load test before promoting to production,
    you would need to use the full sandbox, which can only be refreshed every 30 days.
    If you need to run your migration a few times after tweaking and refining it each
    time, you can use your backups to restore data in the full sandbox and conduct
    your testing.'
  merge: -1
  img_proc: true
- pgno: 116
  md: '# Compliance and regulatory policies


    Depending on the nature of the business, the jurisdiction, and its laws, there
    may be requirements to retain data for a certain period of time. You could take
    a backup of data and store it in an offsite or cloud location and reference it
    when needed. A company had more than a decade of invoicing data in its system
    and required 7 years'' worth of data for compliance purposes. They still wanted
    to keep the rest of the data, but not on the platform, and used backups in CSV
    format to back up data that was older than 7 years and stored it in a cloud location.
    They then performed a few iterations of testing to ensure that their processes
    and the tools they were using if they needed to reference that data were meeting
    expectations and then proceeded to remove the data from the platform.


    # Threats becoming more sophisticated and malicious


    As technology becomes more prevalent and AI becomes more common, data-related
    attacks will continue to evolve and become more sophisticated and malicious. In
    2019, the Global Risk Report listed data theft and fraud in the top five global
    risks. Having a robust and well-tested backup strategy can help with these threats
    and ensure the continued operation of your business. An Small to Medium-sized
    Business (SMB) in 2014 got hit with a ransomware attack, where its previous estimates
    for the last 10 or so years that were on a senior estimator''s computer were lost.
    There was no backup of the data and therefore no way to recover it, except to
    pay the ransom, which the company decided not to pay. Given that the company operated
    in an industry where there were a handful of very large multi-billion dollar customers,
    and it was critical to have estimates available from previously completed similar
    jobs, this was a significant hit to the company.


    # Reputational risk


    There is a real cost associated with reputational risk, just as there is a monetary
    value linked with goodwill. It can be a bit challenging to put a direct cost on
    this, but studies show that customers start to move away from companies that they
    cannot trust. Imagine if, during Permageddon, Salesforce decided not to delete
    the affected permissions to protect customer data and users had access to unauthorized
    data, would that be a worse outcome or the fact that the admins had to rebuild
    permissions for their organization?'
  merge: -1
  img_proc: true
- pgno: 117
  md: '# Data loss via integration


    Consider a scenario where a company has been preparing for months to launch a
    product globally with multi-country advertising campaigns and then, just days
    before the launch date, an integration runs and corrupts some of the data that
    was to be used for the campaign. Not only would it lead to productivity loss to
    recover that data from backups (assuming they are there), but it would also delay
    the launch of the product, thereby impacting timelines and costing the company
    money and lost revenue.


    # Natural disasters


    Although this is less likely to happen and something that Salesforce has thought
    of and is responsible for, natural disasters can, and do, happen. When a natural
    disaster strikes, you want to have your own peace of mind that your data is backed
    up and available for restoration.


    # Point-in-time recovery


    One additional benefit of doing backups is that you can do data comparisons to
    understand what has changed. For example, field history tracking keeps data for
    up to 24 months, but if you need to compare data prior to that, that won''t be
    available unless you are using Field Audit Trail, which retains historical data
    for up to 10 years.


    Now that we have looked at the reasons why you should back up your data, we will
    dive into how you go about doing that.


    # Devising a strategy for data backup


    A key item to determine as part of a backup strategy is to have a rough idea of
    how much it''s going to cost if access to some or all of the data was lost, and
    the cost of replacing that data if it is lost permanently. This is where the **Recovery
    Point Objective** (RPO) and **Recovery Time Objective** (RTO) are important. The
    RPO defines the amount of data you can lose before a successful restore happens,
    whereas the RTO defines the amount of time a business can be without access to
    the data. The first one is a key driver in determining how frequently the backup
    should be running and the RTO is a key consideration for how much downtime you
    can afford when you don''t have access to your data. It is important to note that
    the RTO and RPO mentioned here refer to the portion of the data and metadata that
    the customer is responsible for. Disasters that happen in the infrastructure for
    which Salesforce is responsible have very efficient RPOs and RTOs because their
    infrastructure is set up in a redundant configuration.'
  merge: -1
  img_proc: true
- pgno: 118
  md: 'There are other factors that will influence your strategies, such as data security,
    scalability (think large data volumes), compliance, and regulatory policies. The
    backup strategy is also driven by the nature of the business. Consider, for example,
    the fact that RTOs and RPOs for a global e-commerce site will be very sensitive
    compared to those for a website for a small single-branch laundry business.


    In this section, we will review some of the key considerations for a backup solution.
    This is intended to be used as a guideline and, depending on the industry of your
    organization, you may have some other considerations when selecting a backup solution.
    There are many backup solutions on the market and unless you have very specific
    requirements that cannot be met by these, chances are you will be implementing
    an off-the-shelf solution (the buy versus build principle). I have listed the
    considerations here, bearing this in mind.


    # Costs


    This is usually the first aspect that comes to mind when looking for a backup
    solution. Although it’s an important factor, you should really look at the cost
    from an investment point of view, in other words, what is it going to cost me
    to make an investment to protect my data? Some backup solutions require a simple
    setup, but others may require expertise that you may need to pay for, so take
    that into consideration. Another factor related to cost is understanding the technical
    and contractual limits of the solution. For example, are there any limits and
    associated costs for going over a certain storage limit? Do you need to purchase
    API calls from Salesforce in case you are using a Professional edition or if you
    reach limits with an API call? Also ascertain whether there are any infrastructure-type
    investments you need to make, for example, buying additional Amazon or Google
    storage to host your backups.


    # Security


    This should be a top concern when choosing a backup solution because you want
    to ensure compliance with all federal, local, and any policies defined by regulatory
    bodies. Some other things to consider include whether the backup is encrypted
    at rest and whether you use your own encryption keys. The location of where the
    backup is stored is another important consideration. Usually, government agencies
    in Canada prefer not to have their data stored in the USA due to certain US laws
    that allow access to that data.


    Another important factor is whether the data is stored on-premises or in the cloud.
    If you are using a third party recommended by Salesforce, does the said third
    party maintain its own data centers or procure services from another vendor. Physical
    access to the data is another factor, so you would want to consider who can access
    your data and what controls are in place to protect this data from unauthorized
    access.'
  merge: -1
  img_proc: true
- pgno: 119
  md: 'Can you readily access audit logs, not just for internal controls, but also
    for when your systems are audited? What is the retention period for backups, and
    does it align with local laws and policies defined by your organization''s privacy
    officer? What authentication mechanisms are in place to access the backup and
    do they align with your enterprise''s security policies?


    # Service levels


    You want to ensure that the solution is capable of taking backups in a reasonable
    amount of time. In large organizations with users spread across time zones, if
    the backup is taking too long and is not properly optimized, performance can be
    impacted and slow down operations for business users. What are the RPOs and RTOs
    defined for the service, and do they align with your disaster recovery plans?


    Another consideration is support, whether you are using a third-party backup solution
    or hosting your backups in a data center. What are the SLAs around that and do
    they align with your organization''s expectations? When using a third-party solution,
    what kind of monitoring is in place to ensure that backups are not failing due
    to, for example, infrastructure issues?


    # Ease of use


    These are considerations related to the use of the solution. You want to understand
    how much manual intervention is required for the backup because ideally, you want
    to set it up once and then review your configuration and perform any necessary
    tweaks once every few months.


    Another key consideration is the frequency of backups. Can you set up on-demand,
    hourly, daily, weekly, monthly, or annual backups, and how much involvement would
    this require from you? This can be useful when you back up your production environment
    before a Salesforce release is applied to it. Given that the dates for the next
    three releases are published in advance, you can easily set up your schedules
    to take place specifically before the release gets applied to your organization.


    You also want to understand the architecture of how the backup solution you are
    planning to implement operates, because typically they require external fields
    on the objects you want to back up. Would you need to create these fields or does
    the solution create the fields for you? Although Salesforce makes allowance for
    a large number of external fields (25 at the time of writing) per object, you
    still want to confirm that there aren''t any objects in the organization that
    have reached the limit or will exceed it if your selected solution is implemented.'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'The key users of your backup solution are Salesforce administrators, and you
    want to make sure that the solution is intuitive enough and not overly technical
    so that admins without in-depth technical knowledge can still use it. Another
    consideration is the availability of material to train new admins and understanding
    the ramp-up required to train new users.


    One important factor is that the solution should be able to detect metadata changes
    on the Platform automatically or with minimal effort. For example, if new fields
    are added to an object, the solution should be able to add those fields for backup
    without requiring extensive intervention. This now brings us to versioning, which
    is a key factor when restoring data. For example, you made a change to a field
    from a text to a number and then to a phone type, and each time you took a backup
    before making the change. You now have a need to revert the field to text, along
    with the data that was there. This example demonstrates the need to have robust
    versioning available with the solution that you implement. Ask the solution vendor
    how they support versioning over multiple API versions, especially over releases.


    # Solution comprehensiveness


    This is related to understanding how complete the solution is with respect to
    its offering. We will discuss in more detail the types of backup and restores
    in later sections, but things to consider here include whether the solution can
    back up data and metadata:


    +   **Data and metadata backups**: Some solutions only offer data backups, which
    then necessitates the need to get another solution or develop one internally for
    metadata backup. Similarly, can the solution perform both data and metadata restores,
    and how complete are they? Are big objects supported in the backup, and so on?
    One solution I reviewed in the past offered limited metadata restore capabilities,
    which meant that we had to implement processes for the metadata types that didn’t
    back up for a comprehensive restore strategy.


    +   **Multi-orgs and Salesforce releases**: You will also want to consider how
    the solution works with multi-orgs if that is your requirement and how it works
    with Salesforce releases. Understanding the process your solution vendor takes
    to ensure its product will work with the next release is crucial as well. I have
    been in a situation where a vendor for a DevOps tool took more than 4 weeks following
    a major Salesforce release and during that time, automated processes for **Continuous
    Integration (CI)** stopped working. The chances of this happening are less with
    a backup solution due to API backward compatibility, but you should review this
    thoroughly with your backup solution provider.'
  merge: -1
  img_proc: true
- pgno: 121
  md: '+   • **Solution completeness**: Another very important consideration is the
    completeness of the solution in terms of backing up records and relationships.
    For example, can the solution back up accounts and associated objects that are,
    in turn, parents to other child objects. How many levels deep can you go for backup
    and restore? This is crucial if you have a complex custom application or if you
    are using Salesforce CPQ (Configure, Price, Quote), which has many levels of nested
    relationships.


    +   • **Data restore**: Understand any limitations in terms of the scope of objects
    that the solution can back up and restore. Do not assume that just because the
    solution can back up a certain item of data or metadata, it can also restore it.
    Document and validate any assumptions you make with the provider. Discuss with
    the vendor how the solution can be tested and perform different tests, such as
    backing up and restoring your production organization in a full sandbox organization.
    Attempt other tests, such as restoring a single record or data for a specific
    application. Again, discussing your requirements with the solution vendor will
    allow them to advise on what tests you should perform and the areas to focus on.
    When evaluating the solution, ensure that you are keeping your **Disaster Recovery
    (DR) plan** at the forefront because you want to align your solution with it.
    For example, does the RPO or RTO of the solution fall within the values specified
    by the DR plan?


    +   • **Version comparison**: Another aspect that can be valuable is to understand
    whether the tool offers organization comparisons, both in terms of data and metadata.
    This can be very handy in syncing organizations, but also in warning you in the
    event there are major differences in the metadata that would cause the backup
    to fail. Another consideration when choosing a backup tool is to check whether
    the tool allows you to seed sandboxes, which can alleviate the need to have another
    tool just for that purpose. Once a restore has been completed or a sandbox seeded,
    you also want to understand whether the tool has reports or logs allowing you
    to compare your data in the organization versus data that was in the backup.


    # Performance


    This is a critical factor when choosing a solution and, as we mentioned earlier,
    you want to minimize any performance issues for your end users when they are actively
    using the organization. This can be a challenge in very large organizations that
    have users in multiple time zones because there is no real *downtime* when the
    organization is not being used at its peak and most users are offline. You could
    easily overlook data to be backed up in this case because users are still creating
    new records in the system.'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'For example, you started a backup at 09:00 GMT and a user in another region
    created an account and a contact. The contact record will have a missing account
    ID because when the backup starts for contacts, it won''t find the relevant account
    for the contact. Your solution must be able to support the fine tweaking of the
    backup processes to prevent the adverse performance of the organization. This
    can include the ability to execute parallel backup processes, tweaking the degree
    of parallelization, the number of fields and records, and so on.


    Most backup solutions these days use the Bulk API, which is optimized for large
    data volumes and can process millions of records per hour, but there are limits
    and you want to ensure that the solution can adequately support your backup and
    restore requirements. Another factor is whether the solution uses Bulk API 1.0
    or 2.0. There are differences in limits between the two versions that could be
    material for your purposes.


    The solution should also give you some measure of how many API calls will be used
    and you will want to ensure that it is within the range of calls you have available.
    Just because a solution uses the Bulk API doesn''t mean that it is architected
    the same way, so you want to guarantee a solution that can adequately meet your
    needs, not just today, but also in the future, as data volumes scale.


    In the next section, we will review the different types of backup.


    # Types of backup


    In this section, we will look at the different types of backup and the use cases
    for them. There are three types of backup that can be performed:


    +   • Full backup: The scope of this is all data, including metadata. This backup
    provides the peace of mind that all your data is backed up. The downside is that
    because it''s a full database, restoring a subset of data can take a lot of time.


    +   • Incremental backup: The scope of this type of backup is that any data that
    has not been backed up since the last full backup will be included in an incremental
    backup. In this type of backup, it is much quicker to retrieve data from a certain
    point in time. If this is restored, the system may not have all the related data
    and, in order to recreate that, a full backup restore would be required. Then,
    all the subsequent incremental backups would need to be applied to get to the
    point just prior to the data loss. This also depends on the frequency of data
    backups, as backup jobs are running 24/7, but rather are scheduled jobs. This
    approach would also be adopted when doing a major deployment to production and
    you want to mitigate risk by taking a backup of your data and metadata.'
  merge: -1
  img_proc: true
- pgno: 123
  md: '+   **Partial backup**: This is a very specific type of backup that aims to
    back up a subset of data, for example, all open opportunities. This is ideal for
    archiving purposes, but the downside is that it may not have all the related data
    with it; for example, in the case of opportunities, products that were part of
    those opportunities may not be included.


    Organizations usually use a combination of these backup methods, for example,
    schedule full backups on a weekly basis but incremental backups daily. To archive
    data and keep the operational part of Salesforce manageable, they may schedule
    a partial backup.


    Now that we have looked at the different types of backup, let''s review data restore,
    some considerations relating to it, and nuances when restoring data.


    # Restoring data


    We have discussed the considerations and the types of backup, but without an effective
    recovery strategy, your data backup is of little use. There are different options
    when restoring data and you will need to determine which restore approach is the
    most appropriate for your use case. For example, if data on the Contact object
    became partially corrupted on a certain date, you don''t need to do a full data
    restore for that. Instead, you could just do a partial restore from your backup
    of that date.


    Let''s first look at some use cases of when a data restore can be handy.


    # Missing data


    This is the most obvious use case for data recovery. When your data gets corrupted
    and you need to restore it, data recovery will be handy. Some tools will allow
    you to go back in your backup versions, pick the date of the backup, and simply
    restore the data from that date. This can be really handy when data has been incorrectly
    updated or deleted.


    # Sandbox seeding


    During projects when you have a need to seed your sandboxes, in particular, developer
    and developer pro-type sandboxes, you can simply restore data from your backup
    into your sandbox. Compared to using tools such as Data Loader and figuring out
    relationships and the order of insertion, this can save a lot of time and effort.'
  merge: -1
  img_proc: true
- pgno: 124
  md: '# Citizen development


    If you have citizen development at your company, most of the time, citizen developers
    will need a sandbox environment that has some data to start with. Having the ability
    to selectively restore data from a backup can be very effective and make the citizen
    development process efficient. Certain tools can back up and restore data with
    very complex relationships. For example, **Configure, Price, Quote (CPQ)** applications
    have complex data models that sometimes have circular references for certain objects
    and deep parent-child relationships. In one scenario, I was working with very
    capable business users who had previously worked with Salesforce and one was even
    certified, but our citizen development process was slowed down because we couldn''t
    seed a sandbox with CPQ reference data that the business could work with.


    We will discuss the different types of data restores, but let''s understand what
    happens during the restore process.


    # Nuances of the restore process


    One of the challenges of a restore process is that you will not have all your
    data restored like for like. This is because the Salesforce system is not a point-in-time
    static system, but a dynamic system and, by design, the data in your backup versus
    the data that gets restored will not be the same. For example, the values for
    the `CreatedDate` and `LastModifiedDate` fields will be different as data transformation
    will happen (Salesforce now allows a way to migrate exact values from the source
    system for these two fields). Let''s look at some of the transformations that
    are possible:


    +   - **Audit fields**: `CreatedBy` and `LastModifiedFields` are two fields that
    can change, but `SystemModStamp`, which is recommended to be used for integrations,
    will also change.


    +   - **IDs**: Record IDs will also change, along with the user ID type fields.
    Therefore, `CreatedBy` and `LastModifiedBy`, assuming the restore is being done
    in a different environment, will also change. Any automation that is running off
    these fields will need to be updated if it has hardcoded values in it.


    +   - **Autonumber fields**: If you have `Autonumber` fields on the object, when
    a restore is done, those numbers will change and could have an impact on downstream
    systems if these fields were referenced.


    +   - **Automation**: Any automation you have in your organization, such as triggers,
    validation rules, and workflow rules, can make changes to your records. Some of
    these can cause the recovery process to fail, so it''s important to take measures
    to ensure that the restore completes automatically.'
  merge: -1
  img_proc: true
- pgno: 125
  md: 'The goal should be to minimize these transformations as much as possible so
    as to have a reliable data restore. The overall recovery process should be viewed
    as a multi-step process and at each step, certain things must get done to ensure
    an accurate and reliable data restore. Here, we go into each of these in more
    detail:


    +   Establish your dataset: This is the first step and an important one. You want
    to make sure you have a very clear idea of what you want to restore and what the
    end result should look like. What are the from and to dates for the data restore?
    From your selected dataset, are there any exceptions to the records that shouldn''t
    be restored? For example, when restoring Opportunity records, you want to restore
    only those that are in the pricing negotiation stage.


    +   Pre-processing: This step involves adjusting any settings that could cause
    data transformation or cause the restore process to fail; for example, turning
    off triggers or deactivating validation rules. Some of the things that can be
    done in this step are as follows:


    +   Turning off validation rules: Turn off validation rules on the objects that
    you are trying to restore data for. That will help to speed up the process and
    eliminate any chances of the restore process failing due to the hard stops when
    validation rules are triggered.


    +   Turning on audit fields: These refer to the CreatedDate, LastModifiedDate,
    CreatedBy, and LastModifiedBy fields, which are used to reflect when a record
    was initially created and updated. The last two fields reflect who created the
    initial record and the user who updated it last. When restoring data, you want
    to ensure that the Create Audit Fields permission is turned on so that data gets
    restored with the correct audit field values. This is important if you have, let''s
    say, workflow rules or process builders running off of the CreatedDate field.
    Loading data with the current CreatedDate field, which is the default behavior,
    can impact your business processes. Keep in mind that the audit fields cannot
    be updated once entered and are only available through the APIs.


    +   Synchronizing metadata: Often, a restore would fail because the data and metadata
    do not align between the backup and the organization in which the restore is being
    done. For example, an opportunity stage value was deactivated in the environment
    recently, whereas in the restore, the data still exists for that stage. At the
    time of restore, it will try to restore that stage, but when it cannot locate
    it in the environment, it will throw an error.


    +   Turning off automation tools: Make sure to turn off automation tools such
    as workflow rules, process builders, flows, and triggers that can cause significant
    transformation when data is being restored.'
  merge: -1
  img_proc: true
- pgno: 126
  md: '- **Changing autonumber fields**: This is another area that can cause the restored
    data to be transformed. Make sure to change your **Autonumber** fields to the
    **Text** type before starting the restore as that will ensure that the data gets
    written the same way it is in the restore.


    +   * **Data restore**: This is the execution step where data will be written
    back into the organization. Having the right tool to do the job at this stage
    can be of tremendous help. Imagine if you had to do a simple restore for Accounts,
    Contacts, and Opportunities and had half a million records in total. This can
    be done via Data Loader, but it can turn out to be a very cumbersome and painful
    process.


    +   * **Post-processing**: This step involves reverting those settings that were
    made in the pre-processing step, specifically, settings such as activating validation
    rules, turning on triggers, process builders, and flows. You will also want to
    flip the **Autonumber** field back to **Auto**, making sure that you give it the
    correct format and a starting value. You will also want to ensure that the **Create
    Audit Fields** permission is removed from the profile or the permission set.


    +   * **Verification**: This is the final step and involves verifying your data
    restore. Barring the items that we know would have changed, for example, formula
    fields, you will want to focus on whether the total number of records from the
    backup and the restored data matches. Then you can filter down on the restored
    dataset and compare a few other fields, such as **Stage** if it is opportunities,
    the **Status** field for cases, and so on. Again, having a tool that assists with
    verification activities can be a huge time saver, otherwise, be prepared to spend
    hours verifying the restore before it can be declared successful and operations
    can return to normal.


    Let''s look at some tools we can use to help us with data backups and restores
    in the next section.


    # Backup and recovery – tools of the trade


    In this section, we will discuss some tools that are widely used for backing up
    and restoring data. As you will see, some of these are native and free from Salesforce,
    while others are third-party AppExchange applications. These are just a handful
    of tools and the list is not exhaustive by any means, nor is it an endorsement
    of any one tool. We have already discussed factors that may influence your decision-making,
    including costs, and those should be used as a guide to determine the most optimal
    tool for your organization. Note that I didn''t say _best_ or _cheapest_, but
    rather _optimal_, which means balancing the needs of your organization with practical
    constraints such as costs, the nature and size of your business, and data volumes.


    Let''s start with the native tools from Salesforce.'
  merge: -1
  img_proc: true
- pgno: 127
  md: '# Data Export Service


    This is a UI-based tool within **Setup** that allows you to either schedule or
    manually run backups of your data. It allows you to select the objects you want
    to back up and is limited to data only; metadata is not included in this. The
    on-demand export can be run every 7 days. Limitations include not being able to
    run an export from a sandbox environment and there is no restore mechanism, so
    you will need another tool to restore the generated .csv file to the org. Export
    files are held by Salesforce for 48 hours only (excluding weekends) and then they
    are deleted.


    # Data Loader


    This is another free tool from Salesforce that can be used for both backups and
    restores. You can run this on-demand or schedule it using the command-line interface.
    Data Loader is a powerful tool that supports the Bulk API and can be used to export
    up to 5 million records. Beyond that, Salesforce recommends using an AppExchange
    partner for backups and restores. It is also limited to data only and metadata
    is not covered. Other limitations include an inability to export attachments,
    so you will need to use Data Export Service or another tool for that, and you
    cannot export compound fields with Data Loader. Remember that compound fields
    are fields that are a combination of other fields, for example, address or location
    fields. Data Loader can export individual fields that make up the address or location
    fields.


    # Odasava


    This is an AppExchange partner tool that was designed by a **Salesforce Certified
    Technical Architect (CTA)** and is a robust tool that can be scaled and used in
    small to very large Salesforce organizations. It provides both data and metadata
    backup and restore capabilities and supports the Bulk API along with other Salesforce
    APIs.


    # OwnBackup


    This is another well-known backup tool that supports both data and metadata backups
    and restores. It also supports the Bulk API and other Salesforce APIs for backup
    and restores.


    I have mentioned just a few here, but there are many other companies, including
    Skyvia and Spanning, that offer these services. Again, when evaluating these solutions,
    consider the factors we discussed earlier to ensure that your requirements will
    be adequately met.'
  merge: -1
  img_proc: true
