    +   • Apex: Since Apex is used in many ways (triggers, classes, controllers, and
    web services) on the platform, I will cover some of the more common components
    here.


    +   - QuoteAttribute – Indicates a class name.


    +   - QuoteAttributeSvc – Use the suffix Svc to indicate a service class.


    +   - AttributeTrigger – The name of an individual trigger used on an object called
    Attribute. Use the suffix Trigger for a trigger.


    +   - AttributeTriggerHandler – Indicates that this is a trigger handler for the
