- pgno: 79
  md: 'Notice how, when the metadata of the field on the Task object is viewed using
    the Developer Workbench, it has polymorphicForeignKey set to true.


    # ## Currency fields


    These are used to store currency data, for example, the Amount field on the Opportunity
    object. When the multi-currency feature is turned on in an organization, another
    field called CurrencyIsoCode on the object determines the currency the field will
    be shown in. For example, if CurrencyIsoCode is GBP, then all currency fields
    will have values shown in GBP.


    Salesforce has a multiple currencies feature that enables you to use currencies
    other than your organization''s default currency. You can enable selected currencies
    that you do business in and the org''s administrator can then maintain the conversion
    rates for those currencies. Another feature is advanced currency management, which
    allows you to manage dated currency rates in Salesforce. This feature stores historical
    currency rates allowing accurate reporting. Advanced currency management has some
    limitations and should be enabled after a careful review of its capabilities and
    your business requirements.


    # ## JunctionIdList fields


    This field type is used to query and optionally use the returned results in Apex
    to modify a many-to-many relationship directly. This field type is enabled when
    Shared Activities is turned on through Setup.


    # ## Summary


    In this chapter, we learned about the different types of objects in Salesforce
    and we looked at their usages and limitations. We then reviewed some specific
    field types and investigated details regarding their usage.


    We explored database concepts including normalization and denormalization and
    what data modeling is. You also learned why Salesforce is different from other
    relational databases, at least from a tenant''s perspective, and how it has been
    optimized for read operations. Next, we looked into some important design principles
    to consider when designing your data model.


    We investigated the different relationships and their usages, limitations, and
    use cases. Next, we took a deep dive into Salesforce''s multi-tenancy architecture,
    its different components, and how they come together to generate a virtual application
    at runtime that we, as users, interact with.'
  merge: -1
  img_proc: true
- pgno: 80
  md: "This chapter should have provided you with a solid foundation to be able to\
    \ understand multi-tenancy architecture, and if you come from a relational database\
    \ background, some things that didn’t make sense earlier should now start to make\
    \ a lot more sense. The data architectural principles learned in this chapter\
    \ will help you design more scalable and efficient business applications, and\
    \ understanding data modeling concepts and the different types will allow you\
    \ to communicate effectively with different audiences. Understanding why having\
    \ a cohesive data model that has objects linked with one another using relationships\
    \ will help you adhere to the Salesforce click versus code methodology and allow\
    \ you to frame conversations with different stakeholders in the right context.\n\
    \nIn the next chapter, we will look at data management – what it is and its different\
    \ facets. The knowledge acquired in this chapter will have set the stage to understand\
    \ the upcoming topics with ease and clarity.\n\n# Questions\n\n+   1. Precision\
    \ Printers has an `Applicant` object that has many rows in it and users are reporting\
    \ slow performance when running reports on this object. As the resident data architect,\
    \ you have been asked to investigate this and suggest a solution. What can you\
    \ suggest?\n+   \n+   a) View the filters used in the report and tweak them to\
    \ use indexes on the report.\n+   \n+   b) Just create an index on the database\
    \ table and use that in the report.\n+   \n+   c) Do nothing; it’s probably just\
    \ a temporary issue and will go away by itself.\n\n+   2. Precision Printers has\
    \ promoted a new integration to the production environment recently. It runs every\
    \ 12 hours and transfers records from the `Account` object that have changed to\
    \ an ERP system. The administrator is noticing that records are being transferred\
    \ to the ERP even when there hasn’t been an apparent change made on the record.\
    \ What could be causing this problem?\n+   \n+   a) No action is needed; the integration\
    \ will correct itself and the correct records will start to sync into the ERP.\n\
    +   \n+   b) Take an inventory of the records in Salesforce that should have not\
    \ been synched and then manually remove these records from the ERP.\n+   \n+ \
    \  c) The criterion for determining records that have changed is based on `SystemModStamp`.\
    \ Changing the criterion to `LastModifiedDate` will fix the issue.\n+   \n+  \
