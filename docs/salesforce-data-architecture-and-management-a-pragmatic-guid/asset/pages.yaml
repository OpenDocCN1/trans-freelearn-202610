- pgno: 53
  md: 'The Campaign Member object in the preceding screenshot has yet another field
    for email. So far, we have seen three **Email** fields on three different objects
    – Lead, Contact, and Campaign Member. Repeating the **Email** field three times
    would be considered unacceptable in a normalized database, but because Salesforce
    is tuned for read operations, it makes sense to have redundant fields, so a minimum
    number of joins are needed to return the query results and improve the query performance.


    Another advantage of denormalization is that although duplicated, data is there
    for you to report on. Think of the example of the lead mapping process. In a nutshell,
    we have the data on the Lead object, which is mapped over to Account, Contact,
    and Opportunity, so when a Lead record is converted, data is copied over from
    the Lead object to the Account, Contact, and Opportunity objects. This gives us
    the ability to report on data in the Lead object. For example, what Lead sources
    (ad words, website, blog, and other) of Lead records returned the highest revenue
    on opportunities? How effective are the marketing qualification and sales qualification
    processes? And so forth...


    # Design principles for data modeling


    Design principles form the rules that you must adhere to and should not be violated
    unless there is a clear and compelling reason to do so. This is because they form
    the foundation that you design your system on. They are typically based on industry
    experiences, best practices, and learned experiences and provide a solid foundation
    on which to build your data model. Since Salesforce is optimized for read operations,
    understanding design principles will help us to deliver scalable and maintainable
    solutions in the long run. Here are some key principles to consider when designing
    the data model.


    # User experience


    You want your users to use the application you designed or built. If the user
    finds that they have to navigate to five different screens in order to retrieve
    one piece of data, that may impact buy-in from your customers and reduce system
    usage. A common mistake is to create too many fields on the object and place them
    on the page layout. You want to design your data model in a crisp manner and create
    fields that are needed. If you truly need many fields on the object, consider
    using record types, which we will talk about later. You can also use dynamic forms
    to control fields that appear on the UI when specified conditions are met.


    # Analytics


    Reporting is an important requirement and you want to make sure that your data
    model can support performant reports, dashboards, and list views. Since you cannot
    do joins in SOQL, you will need to write Apex to pull the data you need and marry
    it together.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# Security


    Security is another consideration when designing the data model. Who will have
    access to your data, is it accessible internally, or are external users accessing
    the data through Salesforce communities? By having an excessive number of objects
    with no relationships, you will need to define complex security rules requiring
    Apex. Also, are you solving one problem of making the `Account` object private
    so sales users can see their own accounts, but inadvertently encouraging the duplication
    of data?


    # Relationships


    Aim to design your data model to have relationships between objects. We will discuss
    relationships in a later section, but having complex data models that are not
    well connected will lead to writing very complex queries that then require in-memory
    Apex operations to be joined and used.


    If you determine that relationships will not be possible, for example, when bringing
    in external data, you can use external fields that allow for efficient SOQL queries
    and **Data Manipulation Language (DML)** operations.


    # Performance


    Relationships are a great way to design a data model that will perform well, but
    the caveat is that as your data volume grows, you will start noticing a decline
    in performance. This is because more joins are needed in the database to query
    data. There are multiple techniques that can be used to handle that, for example,
    using skinny tables, creating indexes on certain fields (skinny tables and creating
    indexes can be achieved by contacting support), or using certain field types that
    automatically create indexes.


    # Scalability


    As your business grows and evolves, you will need to extend the data model. Keeping
    scalability in mind when designing the data model will ensure that you don''t
    run into issues when extending the data model. Whenever you are designing the
    data model, ask yourself this question – what will I need to do in order to extend
    this data model 5 years down the road?'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# Avoiding object proliferation


    Think about the *why* when you want to create a new object. Ask yourself whether
    you can use an existing object that has similar functionality. Can you use record
    types perhaps on an existing object and extend it for the enhancement request?
    If an object is no longer required, consider archiving the data and deleting it
    from the system. For example, a custom application that is used to track quote
    requests for different divisions within the company has its own custom objects.
    This could have easily been avoided by having a single object with record types
    for each division. Let''s look at record types and what they are in the next section.


    # Record types


    In our recruitment application example that we used in *Chapter 1, Data Architect-Roles
    and Responsibilities*, we had the Job object, which had details about the job,
    description, grade, perhaps the hiring manager, and so on. The recruitment app
    is used by the two recruiting teams in the company based on the type of recruitment
    they do. One team is focused on hiring executives and jobs that are office-based,
    and the other team hires for union positions. The job requirements are different
    for each type of role; for example, union positions require mentioning the local
    union that the job is part of, hourly rate, ticket requirements, and so on. These
    are not applicable for jobs that the executive hiring department posts. This is
    a good use case to leverage record types that essentially delineate the object
    based on business usage. You could easily create one record type for Executive
    and another for Union and link them to different page layouts. That way, you can
    control the fields that the Executive hiring team will see versus those that the
    Union team will see. They also allow you to control picklist value fields.


    # Click versus code


    One marketing strategy and one that works in practice is the easy way you can
    create and extend business applications to serve your customers using Salesforce.
    This is made possible because of Salesforce''s click model, which encourages the
    use of UI tools to build your applications. The key to this being successful in
    your org is that your data model is simple, rational, and hangs together nicely.
    If you have objects that are related to each other with appropriate relationship
    types, then tools such as Workflow Rules, Lightning Process Builder, and Lightning
    Flows will work elegantly.'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'Conversely, if your data model is scattered with a lot of objects with no relationships,
    you will need to write a lot of code to even run queries on your data, let alone
    build your business functionality using clicks.


    I am not saying that you should have few objects and that they must be related,
    but rather encouraging you to think hard and from multiple angles to ensure that
    you have a very good justification to have a very complex data model with few
    relationships.


    Now that we have looked at the design principles and we''ve mentioned relationships
    a few times, let''s dive into the different types of relationships we have in
    Salesforce and how we can leverage them during data modeling.


    # # Reviewing object relationships


    In a relational database, you would define primary and foreign keys to link up
    two tables; for example, in an Order Management application, you will have order
    and order line item tables in which the Order Line object will have a foreign
    key referencing the Order table. In Salesforce, because we don''t get access to
    the underlying tables, we must establish relationships explicitly using the relationship
    types provided by Salesforce. In the following screenshot, three different types
    of relationship are shown:


    ![](img/782d45700e093b3d82b348c0ccc8ccba_56_0.png)


    Figure 2.9 – Three common types of relationship in Salesforce


    As can be seen in the preceding screenshot, a **Lookup Relationship** creates
    a loosely coupled relationship, a **Master-Detail Relationship** is useful for
    tightly linking the two objects together, whereas an **External Lookup Relationship**
    allows data from an external system to be linked up with data in Salesforce.


    # # Lookup relationship


    Like a **Parent-child** field, a **Lookup** field establishes a parent-child relationship,
    but it differs in many ways. The relationship is loosely coupled, so the record-level
    security is not inherited from the parent, but the child can have its own independent
    record-level access, which means a user accessing the parent cannot necessarily
    access the child record unless the configuration allows that. Unless enforced
    by configuration, you can have a **Lookup** field that''s blank. This is a key
    difference between **Lookup** and **Parent-child** because in the latter, you
    don''t have the option to leave the field blank.'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'A disadvantage of **Lookup** fields is that they don''t allow roll-up **Summary**
    fields out of the box. You would need to write Apex to do roll-up-type operations
    or use AppExchange add-ons to achieve the functionality. There is no cascade delete
    with a lookup relationship. Instead, you have two options – allow the **Lookup**
    field to remain blank, or prevent the deletion of the parent record. Both settings
    are available via the UI:


    ![](img/782d45700e093b3d82b348c0ccc8ccba_57_0.png)


    Figure 2.10 – Creating a lookup relationship


    Notice how, since a lookup creates a loosely coupled relationship, you can either
    make it required or leave it optional, in which case the field can be left blank.
    Optionally, you can specify the behavior if the lookup value is deleted.


    # Self-relationship


    This is a type of lookup relationship, but rather than the parent-child being
    on different objects, the lookup relationship is on the same object. A good example
    of this is the Job object, which is used to store jobs that are posted in our
    recruitment app. If the recruitment team wanted to record similar jobs to the
    one being posted, they could create a **self-lookup** field that would allow them
    to record another similar job.


    # External lookup relationship


    As the name implies, this type of relationship is used to relate to data that
    is outside of your organization and is another type of lookup but for external
    objects. Use this field when the lookup is an external object.'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# Indirect lookup relationship


    This type of lookup relationship is used to link an external child object to a
    standard or custom parent object. You must specify the parent object field and
    the child object field that will match each other. Suppose a background check
    is performed for each candidate who has passed the first stages of the interview.
    Then, the external provider (child object) can be linked with the Candidate object
    using an indirect lookup field.


    # Hierarchical relationships


    This is a special lookup relationship that is available for the User object and
    is used to associate a user with another user. It is handy when, for instance,
    you are developing an application that uses approvals, but they are not based
    on the direct manager field, which already exists on the User object, but rather
    a different user needs to be assigned as the approver. That is where you will
    use this type of field:


    ![](img/782d45700e093b3d82b348c0ccc8ccba_58_0.png)


    Figure 2.11 – Example of a hierarchical relationship


    As can be seen in the preceding screenshot, this type of relationship is only
    available if you are linking up to the User object.


    # Master-detail/parent-child relationship


    This type of relationship defines a closely coupled relationship between the parent
    and child object, which means, among other things, that this field must be populated,
    and you cannot leave it blank. This field is created on the child object and inherits
    record-level security from its parent. This means that a user accessing the parent
    record has access to the child record as well. You can also create Roll-Up Summary
    fields on the parent object, which is one of the big advantages of master-detail
    fields.


    Roll-up summary fields allow you to have aggregate data from your child records;
    for example, if you want to know the total number of opportunities won on the
    account record, you can use a roll-up summary field and count the won opportunities.
    Similarly, if you were interested in remoting the total revenue generated from
    an account, you could create a summary field that sums up the amounts from all
    the won opportunities. Roll-up summary fields also have filters that let you limit
    the scope of data you are interested in.


    By default, cascade delete is also set on the field, meaning that when the parent
    record is deleted, the child is automatically deleted as well. The Organization-Wide
    Default (OWD) on the child is set based on the parent and is non-editable:'
  merge: -1
  img_proc: true
- pgno: 59
  md: '![](img/782d45700e093b3d82b348c0ccc8ccba_59_0.png)


    Figure 2.12 – Creating a master-detail relationship


    We can define a master-detail relationship with different options as seen above
    by specifying what level of access to the master record is required in order to
    create, edit, or delete detail records.


    # Junction objects


    Remember that parent-child and lookup relationships allow us to define one-to-many
    relationships, which means that there is one parent record and multiple child
    records, but what if we have a need to define a many-to-many relationship where
    we have many parent records associated with many child records. This is where
    a Junction object comes in.


    A Junction object is a special type of object that lets us define a many-to-many
    relationship using two parent-child relationships on the object. In our recruitment
    app, we have a Job object and a Candidate object. The Job object is used to post
    new jobs, and the Candidate object is used to store information about candidates
    that are applying for a job. If we use a parent-child or lookup relationship,
    our candidate can apply for a single job at a time, which is not practical.


    Our business requirement is that a candidate must be able to apply for multiple
    jobs at a time. For that, we will need another object, called Applicant, which
    will be a child to the Job and Candidate objects. The Applicant object will allow
    the candidate to apply for multiple jobs at a time. In other words, multiple jobs
    can be associated with multiple candidates and multiple candidates can be associated
    with multiple jobs via the Applicant object:


    ![](img/782d45700e093b3d82b348c0ccc8ccba_59_1.png)


    Figure 2.13 – Applicant is a Junction object. In the user interface (UI), you
    will notice on the Applicant record one field each to enter the Job and Candidate
    data'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'As can be seen from the preceding diagram, a candidate can apply for multiple
    jobs by creating an applicant record each time a job is applied for.


    When defining a Junction object, it is important to think diligently about which
    object the first parent-child relationship will be created with. This is important
    because the look and feel of the Junction object are determined by the first parent
    object. Look and feel here refers to the color and icons of the detail and edit
    page of the Junction object.


    The record ownership is also inherited from the first parent object as the Junction
    object doesn''t have its own ownership. Another implication is that of record
    access. For either of the parent objects, you can define the sharing setting at
    the time of creating the field on the Junction object. The sharing setting can
    be either Read Only or Read/Write. Both options allow full access to the child
    record. But if the OWD on either parent is Public Read Only, and the sharing setting
    on the Junction object is defined as Read/Write, the user will not be able to
    access the record.


    If either parent record is deleted, the child record is also deleted, but if both
    parent records are deleted, the child is permanently deleted. In the former scenario,
    the record can be restored from the Recycle Bin, but not when both parents have
    been deleted.


    If, at a later stage, you decide to delete the primary parent relationship or
    convert it to a lookup, the second parent object becomes the primary. Based on
    all these implications, it is important to think hard in terms of which object
    will become the primary parent.


    Now that we have reviewed the various types of relationships in Salesforce, let''s
    look at some of the differences between SQL and SOQL in the next section.


    # # Differences between SQL and SOQL


    We have reviewed the different types of fields and the relationships that can
    be created in Salesforce. Often, you will need to pull in data using the Developer
    Console, Developer Workbench, or some other tool using SOQL. SOQL is a very easy
    language that can be used to easily query data from Salesforce. It is even easier
    if you have used SQL in the past. You will notice the striking similarity between
    SQL and SOQL, but they are fundamentally different. We will discuss the Salesforce
    platform architecture in the next section, but for now, just remember the following:


    +   - Salesforce customers do not get access to the underlying tables of the Saleforce
    database.

    +   - You can *indirectly* index your fields in SOQL, rather than doing so *directly*,
    as in SQL, using a DML statement.'
  merge: -1
  img_proc: true
- pgno: 61
  md: '+   - Some field types are automatically indexed for you, for example, external
    fields, and using SOQL, you cannot create new indexes.


    +   - Triggers can also be written, just like you would on a database table, but
    Salesforce triggers are different in that you are basically sending instructions
    to the application layer to process your Apex code.


    Some of the differences between SQL and SOQL are as follows:


    +   - You cannot issue a `select * from SObject (Sobject referring to a Salesforce
    object)` in SOQL.


    +   - SOQL is read-only and cannot be used to manipulate data, unlike SQL.


    +   - When SOQL is used in Apex, it also protects you from inadvertent schema
    changes as SOQL cannot be used to change data types or field names on the fly.
    You can either do that through the UI or use specific metadata APIs to make changes
    to the underlying schema.


    Now that we have reviewed the fundamentals of data modeling and denormalization,
    let’s take a dive into the Salesforce architecture and understand how it operates
    beneath the hood.


    # # Understanding Salesforce architecture


    Since we are going to be talking about Salesforce, let’s try to understand the
    Salesforce architecture as that will help us think in the correct context and
    understand why things are done the way they are in Salesforce.


    Trust is the number one value at Salesforce and can be seen in the way the core
    architecture of Salesforce has been designed. Considering that there are billions
    of transactions happening on the platform, it is no small task to ensure that
    customer data is properly secured and protected from numerous attack vectors used
    by bad actors.


    In this section, we will be familiarizing ourselves with the salient features
    of the Salesforce platform, such as multi-tenancy and major releases. Then we
    will review in more detail the major components of the platform that form the
    engine behind it. Let’s start with multi-tenancy and dig deeper into what it is
    and how it benefits users.'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# Multi-tenancy


    Salesforce works on a SaaS (Software as a Service) model, where customers pay
    a subscription fee for the services they use provided by Salesforce. If you have
    used email services such as Hotmail, behind the scenes there is no dedicated database
    server or an application server. Rather, Microsoft has designed the system such
    that hundreds of thousands of users can use the same hardware and software.


    With SaaS, rather than having individual users, you will have multiple groups
    of users that access Salesforce. Think of these groups of users as individual
    companies that subscribe to Salesforce and what they are accessing at Salesforce
    is an org aptly named organization. The key aspect of SaaS is multi-tenancy, which
    means groups of users share resources. Behind the scenes, they use the same hardware
    and storage, but their data is kept separate by the software.


    Another aspect of multi-tenancy is that since the resources are shared, no one
    tenant can be allowed to monopolize the system, jeopardizing the resources that
    could potentially impact performance or, worse, bring down entire instances. Salesforce
    employs governor limits and general good practices to encourage its users to write
    efficient queries and code. One of the things that I missed when I started to
    work on the platform was the use of the following SOQL query:


    ```

    select * from TABLE_NAME

    ```


    It never made sense to me why it wasn''t allowed until I truly dived deep into
    how multi-tenancy works. In case you are wondering, the preceding query would
    return all columns along with all the rows in a typical relational database, but
    it won''t run in Salesforce because it would like you to name the fields (columns)
    that you need and only return those along with a limit on the number of rows it
    will return.


    Thousands of customers trust Salesforce with their business-critical data, and
    it is no small feat to ensure that customer A cannot access another customer''s
    data. This is done by org ID, which is a unique ID that is assigned to every Salesforce
    customer''s org. Whenever a database call is made to the platform to access data,
    the org ID is automatically included in it to prevent unauthorized access.'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'Salesforce customers also enjoy the benefit of being up to date with product
    release versions. There is always a single version of the platform running across
    all Salesforce orgs. This means that customers don''t have to worry about upgrading
    or regression testing because all that heavy lifting is done by Salesforce.


    The Salesforce platform architecture is complex, comprising many databases and
    application servers along with a multitude of services that perform different
    functions, such as searching, business logic execution, caching, and event management.
    We are not going to discuss these, but rather focus our attention on the data
    management aspect of the platform, which runs on a relational database.


    Let''s take a brief look at how the underlying architecture of this all works
    seamlessly in Salesforce.


    # # Metadata-driven architecture


    A multi-tenant platform such as Salesforce, which is cloud-based, has its own
    challenges in terms of scalability, reliability, and security that must be overcome.
    Most important of all, how do you make sure that a tenant''s data cannot be accessed
    by other tenants. Also, since there is only one version of the software in production,
    applying updates without significant downtime to the platform is another challenge,
    especially when done three times a year. We talked about test classes and we will
    discuss how Salesforce runs the Hammer later in this chapter, but what happens
    when a tenant customizes an app that they built or customizes the out-of-the-box
    sales application to meet business requirements? Do their customizations get written
    when Salesforce updates the production instance? Does the tenant have to reapply
    their customizations? What happens when a customer stores large amounts of data
    on the platform? Does the system slow down for other customers? To answer these
    and other related questions, we will look at what the **metadata-driven architecture**
    is.'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'As can be seen in the following diagram, Salesforce uses an architecture that
    delineates between the system kernel – the main engine that does the virtualization,
    which we will talk about soon, the database, and the tenant application, which
    must be polymorphic in nature, in other words, dynamic, to meet the varying needs
    of different clients:


    ![](img/782d45700e093b3d82b348c0ccc8ccba_64_0.png)


    Figure 2.14 – Salesforce metadata-driven architecture


    As can be seen in the preceding diagram, the runtime engine generates the application
    at runtime using metadata and data that belongs to the tenant.


    Any updates applied to the kernel will not affect other layers of the architecture.
    Similarly, when a change is made to the common metadata, tenant-specific metadata
    is not affected, nor is the tenant’s data. At runtime, the kernel or the runtime
    engine constructs the tenant’s application using the common metadata, tenant-specific
    metadata, and data. In the following subsections, we will be looking at key components
    of the metadata-driven architecture. This is not an exhaustive discussion, but
    rather pointers for us to understand the key components to know about from a data
    architecture perspective.'
  merge: -1
  img_proc: true
- pgno: 65
  md: '> **Important note**

    > I am using the term *customization* here in a general sense to mean any changes
    to the platform, whether done through clicks or code.


    # The kernel


    **The kernel**, or the runtime engine, is the core of the platform that is made
    up of multiple services that work together to deliver services.


    Since metadata is used as a key component to generate the client application at
    runtime, the platform uses a metadata cache to improve performance, otherwise,
    the system would not be able to scale with high loads. The metadata cache stores
    the frequently used metadata in memory, which reduces the need for performance-impacting
    expensive calls to the database.


    The bulk data processing engine processes large amounts of data and works on performing
    data modifications in bulk. The engine has built-in fault tolerance that allows
    it to automatically retry bulk operations for records that can be processed successfully.


    The platform also has a full-featured search engine service that optimizes access
    to full search capabilities. This service processes data updates asynchronously
    in the background. You may have noticed this when uploading large volumes of data
    and immediately afterward searching for the data. Because the engine runs asynchronously,
    you may have to wait up to 15 minutes before your search returns any results.
    This is different from a traditional database, where background processes run
    on the actual database tables and update indexes.


    When you open a page or issue an API call to query data, in traditional databases,
    a query plan is created and the most optimal method to execute the query is determined
    by the optimizer and executed. This type of optimizer would not work with Salesforce
    because of its multi-tenant nature, in other words, physical tables in the database
    have data for tens of thousands of clients and the results from the query optimizer
    would not be accurate or efficient. This is where the multi-tenant query optimizer,
    which is a smart optimizer that *knows* the multi-tenant nature of Salesforce,
    comes into play. It determines the most efficient query paths by considering the
    user executing the query, and then uses the tenant-specific metadata maintained
    in the UDD, along with some other key tables, to execute optimized data operations
    on the database.'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# The Universal Data Dictionary (UDD)


    The physical database at Salesforce looks very different from what you see when
    you look at an object''s metadata in **Setup** or run a `describeSObject` method
    from the backend. This is because Salesforce employs an abstraction layer in the
    application server, which, at runtime, reads data from the database and applies
    other logic resulting in the shape of your organization, in other words, objects,
    fields, relationships, list views, and so on. This layer, called the **Universal
    Data Dictionary**, or **UDD** for short, is declarative, meaning that object names,
    their attributes, and relationships are stored and not generated through code.
    What you see in the org is the result of the kernel acting on the UDD since the
    kernel acts as a mapping layer between the UDD and what you see in your org. The
    following is a diagram of the UDD and its components:


    Shared Database

    Pivot Tables

    Metadata Tables (UDD)

    Data Tables


    Metadata Cache

    Bulk Data Processing Engine

    Runtime Application Generator

    Query Optimizer

    Full-Text Search Engine


    Tenant-Specific Screens

    Common Application Screens

    Objects (Tables)

    Virtual Application Components at Runtime'
  merge: -1
