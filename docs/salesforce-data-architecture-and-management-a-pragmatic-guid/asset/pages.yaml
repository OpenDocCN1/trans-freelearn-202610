- pgno: 43
  md: '# # 2 Understanding Salesforce Objects and Data Modeling


    In this chapter, we will look at data modeling and the concept of **normalization**.
    This will give us a foundation for understanding how Salesforce is different from
    conventional relational databases that we may have experience of working with
    in the past. We will review why Salesforce goes against the convention of data
    normalization and why data is **de-normalized**, along with the benefits of doing
    that on the Salesforce Platform. We will also cover the different types of relationships
    in Salesforce and other features of Salesforce that are associated with data modeling.
    Having a solid understanding will lay the foundation for upcoming chapters when
    we discuss APIs and **Large Data Volumes (LDVs)**.


    **Salesforce Platform**

    Throughout this book, at various places I will be referring to Salesforce as the
    Salesforce Platform or Platform. When I do that, I am referring to the core Salesforce
    services including hardware and software that is used by the Sales Cloud or Service
    Cloud. This is important because there are other Salesforce services that are
    provided on different infrastructure such as Heroku, Mulesoft, and others.'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'In this chapter, we will also review the Salesforce Platform architecture.
    What we will have learned in this chapter will help us understand why the Platform
    architecture is the way it has been designed. Understanding this is crucial if
    we want to utilize the Platform in an effective, yet scalable, manner.


    At the end of the chapter, we will review the different types of objects that
    are available in Salesforce and when they should be used, along with a review
    of the different field types that are available for use. This will provide an
    understanding of the deeper capabilities of the Platform as far as objects and
    fields go, as well as the relationships that can be defined on the Platform.


    To summarize, we will look at these topics in particular:


    +   • Exploring data modeling

    +   • Understanding the Salesforce platform architecture

    +   • Introducing Salesforce objects


    Let''s get started with understanding data modeling.


    # Exploring data modeling


    **Data modeling** is the process of analyzing data requirements that are needed
    to support business requirements in the information systems of an organization.
    This involves analyzing the various data objects and the relationships between
    them. Data modeling provides a visual representation of data and how data elements
    associate with each other. Let''s look into what a data model is in more detail
    as well as the different types of data models and the benefits of data modeling.


    # What is a data model?


    A data model is a visual representation of data elements, their relationships,
    and the properties they have; for example, a laptop is a data element, a motherboard
    is another data element, RAM is another example, and so on and so forth. Whether
    the laptop has one or more than one RAM stick would be defined as the relationship
    between the two. In most laptops, there is one, and only one, motherboard, which
    is another relationship between the motherboard and the laptop, but also a constraint
    that is stating that one laptop will only have one motherboard. In the following
    diagram, we have three objects that are related to one another:'
  merge: -1
  img_proc: true
- pgno: 45
  md: '![](img/782d45700e093b3d82b348c0ccc8ccba_45_0.png)


    Figure 2.1 – Example of a 1-to-1 and 1-to-many relationship


    The motherboard and laptop have a 1-to-1 relationship with each other, whereas
    the laptop and RAM entities have a 1:M relationship, meaning a laptop can have
    one or more RAMs.


    Data models are important and help in communicating with stakeholders, but let’s
    take a deeper look at the benefits of data models. I offer a word of caution in
    that the benefits mentioned here are generic in nature and may not fully apply
    to Salesforce. This is because Salesforce has its own sophisticated way of managing
    databases, which we will touch upon later.


    +   * Estimating complexity: A data model provides a good way to estimate complexity
    in software and valuable understanding in estimating the effort and associated
    risk involved in developing or enhancing an application. Consider an application
    that has 5 database tables versus one that has 35 tables. It is reasonable that
    the application with 35 tables will be more complex and enhancing it will require
    a cautious approach and some analysis to reduce the risk of introducing regressions
    in the finished product.


    +   * Optimal design: Data models also help in building applications that respect
    system boundaries. System boundaries here refer to designing the component with
    items where they most optimally fit; for example, a developer may attempt to enforce
    uniqueness on a field using code in the application, whereas using a data model,
    you could easily enforce that at the database level. This results in less code
    and system maintenance.


    +   * Standardization: Data models provide a standardized way to document your
    applications that can facilitate long-term maintenance and assists in training
    new personnel.


    +   * Risk management: Data models reduce the risk to the enterprise in situations
    where a few people with long tenures have a more in-depth knowledge of the application
    and its database structure. Having an up-to-date data model can keep the enterprise
    competitive and respond to change quickly.


    +   * Costs: Data models reduce costs by capturing errors and issues that will
    manifest later in the finished application. During the software development life
    cycle, it always costs less and is easier to fix issues early on, rather than
    later when the application has been developed. Once an application has been developed,
    fundamental changes to a data model can be very costly, time-consuming, and requires
    intense periods of impact analysis to ensure that existing integrations and functionality
    will not break.'
  merge: -1
  img_proc: true
- pgno: 46
  md: '+   • **Quality assurance**: Data models result in applications that are high
    in quality because it avoids the typical mistake of jumping into coding straight
    away, which is the source of many software projects failing. A well-thought-out
    data model provides an opportunity to consider the different ways in which entities
    can relate to each other and design an optimal data model.


    +   • **Solution buy-in**: A well-defined data model that is collaboratively developed
    with different stakeholders creates buy-in and trust within teams that directly
    impacts team engagement and motivation. Everyone involved feels they have a stake
    and take responsibility for their tasks, which also results in higher-quality
    work.


    +   • **Time-to-market**: Data models can reduce the time to market for new applications.
    During the COVID-19 pandemic, many software companies that develop healthcare
    applications rushed to develop applications that could be used by health authorities
    for contact tracing or to enable companies to facilitate a return to work for
    their employees. Time to market was a clear differentiator, and if an application
    was developed but without a sound data model, it would run into many issues and
    cause the company to miss out on revenue opportunities.


    +   • **Facilitate integrations**: As companies grow, the number of systems they
    use grows and, as a result, the need to integrate these systems also grows. Having
    a data model can drastically cut down on the time it can take to integrate these
    different systems.


    As seen above, there is a multitude of benefits associated with data modeling
    that can help organizations remain responsive to changing market conditions. Communication
    is a constant challenge within organizations and data modeling can help alleviate
    some of that, along with providing a platform that can be used to create buy-in
    from different stakeholders.


    In the next section, we will look at the different types of data models and their
    purpose.


    # Types of data models


    There are three types of data model, each of which has its own distinct features
    and purpose:


    +   • The conceptual data model

    +   • The logical data model

    +   • The physical data model


    Understanding these can help us determine which level to use to optimally serve
    our needs. Let’s look at these one by one.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# Conceptual data model


    This data model is the most abstract visual representation of the entities and
    relationships between them in an application. It is commonly used to communicate
    with business users as it is straightforward and is not associated with any specific
    database or technology. Using the recruitment app example introduced in Chapter
    1, Data Architect - Roles and Responsibilities, an entity represents the Job or
    Candidate object and the relationship defines how the entities relate to each
    other. In our example, the Candidate entity is related to the Job entity via the
    Applicant object. Applicant is a Junction object that we will discuss in later
    sections. A conceptual data model showing a Junction object is shown in the following
    diagram:


    ![](img/782d45700e093b3d82b348c0ccc8ccba_47_0.png)


    Figure 2.2 – Example of a conceptual diagram showing a junction object


    As can be seen in the preceding diagram, in a conceptual data model, just the
    names of the entities are listed.


    # Logical data model


    This is the next level to the conceptual data model in that it has more details,
    including attributes and their types. For example, using our recruitment app example,
    the Candidate entity (object) will have Name, Email, Phone, and other attributes
    for each candidate.


    Similarly, the Job entity can have Job Description, Job Title, and Grade as attributes.
    Sometimes, the data type and length of each attribute are also defined; for example,
    Name can be 100 characters, Phone can be 10 characters in length, and so on. This
    is also developed by a data architect or business analyst sometimes and can be
    used to communicate with business stakeholders easily. Like the conceptual model,
    this type of data model is also database-agnostic. The following diagram shows
    an example of a logical data model:


    ![](img/782d45700e093b3d82b348c0ccc8ccba_47_1.png)


    Figure 2.3 – Example of a logical data model'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'As can be seen in the preceding diagram, the logical data model has more details,
    including the names of the attributes (fields in Salesforce). Sometimes, the data
    type and length of each attribute are also listed.


    # Physical data model


    This is the most detailed level in data modeling and is primarily used for the
    actual build of the database. At the physical level, entities are really tables
    and attributes are columns in those tables. When visually representing this type
    of data model, the convention is to use the actual database names of the tables,
    and columns along with the data type of each attribute. This level also includes
    indexes, triggers (different to the triggers we build in Salesforce, although
    the idea is similar), and constraints. I won''t present examples of this type
    to avoid causing confusion because when you create an object using the frontend
    in Salesforce, you are really sending a command to create a table in the database
    with its column, primary keys, and constraints. We will look at how all that works
    later in this chapter. Here is an example of a physical data model for our recruitment
    app:


    ![](img/782d45700e093b3d82b348c0ccc8ccba_48_0.png)


    Figure 2.4 – Example of a physical data model


    The physical data model, as shown in the preceding diagram, shows the actual attribute
    (field) names as well as the data type and length of each attribute. Now that
    we understand data models, let''s look at the concepts of normalization and denormalization.


    # Normalization


    **Normalization** is a database technique for organizing data where large tables
    are divided into smaller manageable tables while linking them using relationships.
    The reason this is done is to maintain data integrity and eliminate data redundancy.
    The theory of normalization covers the different normalization forms starting
    from 1 Normal Form (1NF), 2NF, 3NF, up to 5NF, but a detailed discussion on normalization
    is beyond the scope of this book.'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'However, I want to look at a few examples of why this is used extensively,
    and most applications will achieve optimal normalization at 3NF. Understanding
    this will give you a solid understanding to dive into the Salesforce architecture
    and appreciate the power of the platform.


    Normal forms

    Repeating data in a database is inefficient, causes the size of the database to
    increase, and can cause data inconsistency during database operations such as
    insertion, deletion, and so on. Database normal forms are the answer to this problem
    and at its core, attempt to minimize data redundancy in the database.


    With normal forms, the idea is that a fact is in one place and that the fact needs
    to be inserted once, and then updated or deleted at a single place without duplicating
    it across the database.


    3NF (Third Normalized Form) is a database design approach in which the goal is
    to reduce data duplication and achieve data integrity. The 3NF approach defines
    that any attribute in the table should not be dependent on a non-primary key.
    To read more about 3NF, refer to the Data Management Book of Knowledge (DMBOK)
    or search on the internet.


    To understand this example, we will need to look at it in a non-Salesforce context
    so we can apply some of the normalization principles. Using our recruitment app
    example, imagine you have the following Job table, which has details of the job
    that is posted:


    | Unique ID | Job Title | Hiring Manager | Hiring Manager Telephone | Hiring Manager
    Location |

    | :--- | :--- | :--- | :--- | :--- |

    | 123 | SQL Architect | James Murthy | (232) 232-2323 | Chicago |

    | 345 | .NET Developer, Technical Lead, Lead Consultant | James Murthy | (232)
    232-2323 | Chicago |

    | 897 | UI Developer | James Murthy | (232) 232-2323 | Chicago |

    | 231 | Business Analyst | Grant Simpson | (301) 545-4454 | New York |


    Figure 2.5 – An anti-normalization example'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'As can be seen in the preceding table, values for **Hiring Manager**, **Hiring
    Manager Telephone**, and **Hiring Manager Location** are repeated for the first
    three records. This is data redundancy and undesirable in an optimally normalized
    database. It will also cause anomalies related to insertion, updating, and deletion,
    with a real risk of causing data loss. Let''s look in more detail at these different
    anomalies and understand why they are undesirable in a normalized data model:


    +   **Insertion anomaly**: Let''s say in the preceding example that another job
    was posted for James Murthy, but a new recruiter didn''t enter the hiring manager''s
    telephone and location. Unless these fields are mandatory at the database level
    or application level, you will now have a row with two columns blank. Also notice,
    if James had 20 new postings, we would be repeating the last columns (Hiring Manager,
    Hiring Manager Telephone, and Hiring Manager Location) 20 times, which is a clear
    waste of resources.


    +   **Update anomaly**: Assume that James Murthy leaves the company, and so now
    we will need to update 23 records with the new hiring manager and their details.
    If we miss any records, we will have data quality issues.


    +   **Deletion anomaly**: If we were to delete records from the Job table after
    7 years, we would lose not only the job detail data but also details pertaining
    to the hiring manager.


    We have looked at normalization and why it''s used. Let''s now spend some time
    understanding denormalization and why it''s used in Salesforce.


    # Denormalization


    If you have worked in a relational database, you know that data redundancy is
    not desirable, and the normalization forms are used to ensure that databases are
    free of redundant data and anomalies that we discussed earlier. By way of contrast
    to that, **denormalization** is the process of improving the read performance
    over the write performance in a database. As we will see later, this is done by
    adding redundant data to the database in an organized manner to improve the read
    performance.


    As an example, an email for a customer is going to be stored once in a table and
    then, using what''s called a **join**, it will be meshed up with rows from other
    tables. However, in Salesforce, the **Email** field is replicated across objects.
    This is intentional because Salesforce is optimized for read operations, so when
    you run a **Salesforce Object Query Language (SOQL)**, open a list view, or open
    a contact, these are querying the database. Designing for read operations primarily
    results in quick loading of the data, whereas normally, other databases are optimized
    for write operations. And because read operations on a 3NF database would require
    a lot of joins that are costly in terms of performance, Salesforce has a flat
    database structure.'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'The characteristic of a flat database is that you will have data elements duplicated
    – a clear violation of normalization principles. How Salesforce achieves this
    is truly impressive, but we will defer that discussion to a later section in this
    chapter.


