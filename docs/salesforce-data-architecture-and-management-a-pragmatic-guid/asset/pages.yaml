- pgno: 294
  md: "# Large Data Volumes (LDVs)\n\nLDVs in Salesforce don't have a strict formal\
    \ definition, and if you ask an experienced architect what constitutes an LDV\
    \ scenario, more than likely the answer you will get will be, It depends. The\
    \ reason is that you could have an LDV scenario even with a much lower number\
    \ of records than the general guideline that Salesforce provides. The general\
    \ guideline is that once you have more than 1 million records in any object, you\
    \ have an LDV scenario and you may start seeing the implications of LDVs.\n\n\
    Although the number of records is a consideration in determining whether an LDV\
    \ scenario exists, that is not the only consideration. There could be several\
    \ other factors that could create an LDV scenario even when the number of records\
    \ is less than the generally recommended threshold, which is more than 1 million\
    \ records. These factors include the following:\n\n+   - **Transaction volume\
    \ and complexity:** This is related to how much data is moving in and out of the\
    \ organization. If you have integrations that are syncing data with external systems\
    \ such as an ERP, and hundreds and thousands of records are being transferred\
    \ into the system, that may not meet the recommended guidelines of an LDV scenario.\
    \ But let’s say you have three of these integrations that run at the same time\
    \ – now you would have exceeded the general guideline limits of an LDV.\n+   \n\
    +   Another aspect is the complexity of the transactions. An integration that\
    \ brings in and updates account records from an ERP is going to run much quicker\
    \ than an integration that brings in product data from the ERP and forms bundles\
    \ on the fly in Salesforce CPQ. Similarly, when data is being transferred out\
    \ of Salesforce, a simple export of opportunity data is going to be much quicker\
    \ than an integration that updates the ERP with contract, order, or quote data\
    \ from Salesforce.\n+   \n+   - **Data skew:** We will discuss the different types\
    \ of data skews and why they impact performance in a later section.\n+   \n+ \
    \  - **Org complexity:** The complexity of the org in terms of numbers, the complexity\
    \ of sharing rules, and the role hierarchy can have an impact and create an LDV\
    \ scenario. Consider a scenario where, when records are inserted into the Account\
    \ object, there are no sharing rules versus when an integration runs, and the\
    \ org has complex Apex sharing rules. In the second scenario, each time the record\
    \ is inserted, record visibility has to be determined, which can cause issues\
    \ when a large number of records are being processed."
  merge: -1
  img_proc: true
- pgno: 295
  md: 'The number of records by itself is obvious, but also a combination of the factors
    we discussed here will result in an LDV scenario. This should highlight the importance
    of properly analyzing your org before finalizing an integration or migration approach.
    Failure to do so can result in issues down the road that will be both costly and
    time-consuming to fix. Let’s understand the implications of LDVs if they are not
    properly accounted for in the architecture.


    # # Knowing the implications of LDVs


    You will likely see the effects of LDVs assuming they were not properly accounted
    for in the architecture. Here are some of the critical impacts when a system is
    not optimally architected considering LDV scenarios. This is one of the reasons
    why, when you are implementing enhancements or new applications in Salesforce,
    it is critical to ask questions, understand the answers, and design things based
    on the anticipated growth of data for the next 3–5 years.


    +   * Reports and list views: These will most likely be the first things you hear
    from your users when you have hit an LDV scenario. Reports and list views will
    start to slow down, and users will complain about how a report used to run in
    a few seconds and now it takes forever to run it. Worse yet, these may start to
    time out because of the volume of data that the database has to sift through to
    return results.


    +   * Search: Search results are going to take much longer if the search engine
    has to query millions of records. This is another area where users will quickly
    figure out that something is amiss and that it takes much longer than usual to
    return results. This is especially evident if a custom UI is being used for a
    search and the search engine has to query multiple objects and multiple wildcards
    are used.


    +   * SOQL: Lightning components or Visualforce pages that use SOQL to return
    results will start to slow down or run into query timeout issues when the query
    has been running for more than 120 seconds. Regardless of whether the query runs
    for so long, you should always write optimized SOQL queries that return results
    quickly without having the user wait for a very long time.'
  merge: -1
  img_proc: true
- pgno: 296
  md: '+   - **Sharing calculations**: Sharing rules are calculated whenever record
    ownership is updated. With LDVs, this can take a long time to run. This needs
    to be considered, especially for scenarios that involve data migration or integration,
    because as new records are inserted or existing records have their owners updated,
    sharing calculations will run automatically and, in an LDV scenario, slow down
    the system.


    +   - **Related lists**: Users would start to notice slowness on a related list
    for some records. This is related to ownership skew, which we will discuss later,
    but this can happen in scenarios when the detail side in a master-detail relationship
    has a large number of records. For example, a fast-paced **Business to Consumer
    (B2C)** company has hundreds of thousands of customers and some loyal customers
    have frequent orders that have resulted in a large number of records getting generated
    in the *Order* object. A company such as Amazon, which has customers that use
    Amazon Prime and order almost every single item from their online store, could
    end up having hundreds of thousands of records in the *Order* object. The related
    list on the Person Account record can take a long time to load.


    We have taken a detailed look at the multi-tenant architecture of Salesforce,
    but let’s review that and the search architecture from the perspective of LDVs.


    # Multitenancy and search architecture


    In Chapter 2, Understanding Salesforce Objects and Data Modeling, we took a detailed
    look at the multitenancy architecture of Salesforce. Refer to that chapter to
    refresh your memory, but in a nutshell, multitenancy is a way of providing services
    to multiple unrelated customers using the same hardware-software stack. A software
    layer or a runtime engine separates each customer’s customizations and data from
    being viewed or accessed by another customer. At runtime, the engine materializes
    virtual tables by considering the customer’s metadata.


    Whenever you create a new Salesforce application using standard or custom objects
    that then have standard or custom fields, Salesforce does not create a physical
    database table for, let’s say, the custom object with the fields in it as columns
    on the table. This would not be scalable as hundreds of tenants are usually hosted
    on an instance and would require immense resources to manage the database changes
    being made by the tenants. Rather, the platform manages virtual database structures
    using a set of metadata, data, and pivot tables (tables that define relationships,
    unique fields, and indexes).


    There are a multitude of places in Salesforce where the **search** feature is
    used, with perhaps the most common being **Global Search**, but it’s also used
    when doing lookups and duplicate record processing. Searching architecture in
    Salesforce is based on its own data store and is optimized for search.'
  merge: -1
  img_proc: true
- pgno: 297
  md: 'Knowing how the underlying architecture works will help us understand why we
    cannot do certain things that were at our disposal with traditional databases.
    For example, you can optimize the underlying **Structured Query Language (SQL)**,
    run database statistics at will, or create indexes to optimize database performance.
    You could also run index update jobs after a large volume of data was loaded if
    it was deemed important to make the data available to users right away.


    With Salesforce, because it''s a shared environment with multiple tenants, we
    don''t have access to the underlying database and have to plan our integrations
    and data migrations properly. For example, a search on the platform runs every
    15 minutes and could take a long time to complete if a large data migration was
    just performed. We will need to time this appropriately if a 24/7 call center
    of an organization is reliant on it. Similarly, database statistics are run on
    a nightly basis on the platform, which means that your SOQL queries may be slow
    if you try to access data following an LDV migration.


    Let''s review some key considerations when migrating or designing integrations
    for LDVs.


    # Considerations for integrating or migrating LDVs


    Several considerations must be kept at the forefront when designing LDV integrations
    or migrations. This is because, although requirements for LDVs are not much different
    than a typical integration or migration, the caveat lies in understanding the
    impacts of LDVs, so mitigations can be incorporated in the design to avoid running
    into issues. Some of these considerations also apply to non-LDV integrations and
    migrations but are mentioned here because they have a large impact on LDVs.


    # A greenfield versus a brownfield org


    A greenfield org is an org that is brand new, and you are setting it up from scratch.
    Usually, when they are starting with Salesforce, organizations set up CRM, the
    org slowly evolves over time, and other applications are built on it. A brownfield
    org, on the other hand, is one that is already live and is in active use for business
    operations.


    An LDV migration in a brownfield is more complicated than a greenfield org. The
    reason is that you have more factors to consider, the first and foremost being
    minimizing any disruption to ongoing business operations. LDV operations can take
    a long time to run and can have a visible performance impact, which can impact
    operations. As an example, the last thing you want to see is, while your LDV process
    to load Case records is running, your customer support users waiting for Case
    records to open while they are with the customer on the phone.'
  merge: -1
  img_proc: true
- pgno: 298
  md: 'With greenfield orgs, you don''t run into these types of issues and have a
    lot more flexibility to run your LDV operations. Always make sure of and think
    through the implications from a users'' perspective of running LDV operations.
    Many businesses have critical applications running on the Salesforce platform
    and the Account object is the center of the universe in the Salesforce ecosystem.
    This is because it is used by almost every application that''s built on the platform
    and any LDV operations impacting Account records will slow down the system for
    everyone on the platform.


    When working with a global brownfield org, another challenge is time zone differences.
    LDVs can take a lot of time depending on how much volume is being loaded, but
    you may find it challenging that downtime is required to run your operations.
    One time zone where users may be offline may not necessarily mean that it''s a
    good time to load data because users in a different time zone may be in the middle
    of their data fully utilizing the system. To prevent these types of issues, LDVs
    can be run on weekends, but that can still be challenging if you have a 24/7 call
    center running on the platform.


    # Data modeling


    As mentioned in the last section, the Salesforce data model has the Account object
    as the key object and other objects are related to it via master-detail or lookup
    relationships. When migrating from other systems, ensure that you have an understanding
    of the source system''s data model. This is because, contrary to your assumptions,
    the source system may have a different data model than you were expecting. For
    example, in Siebel, the S_PARTY table is the main table that has contacts, users,
    employees, and accounts (companies). Other records and other tables are extended
    from it to identify whether the record belongs to an employee, contact, or user.
    As seen, the data model is different than what you have in Salesforce, and understanding
    the data model will help you in determining what transformations will be needed
    to successfully load the data.


    Keep in mind that the Salesforce platform is optimized for read operations, contrary
    to traditional databases, which are optimized for write operations. This means
    that you would want to pay attention to denormalizing the data as much as possible.
    For example, an account may have multiple addresses, such as billing, shipping,
    and legal. In a traditional-type database, these are stored in a separate table
    in a primary-foreign key relationship, but in Salesforce, the Account object has
    shipping and billing addresses on it. You will want to create new fields for additional
    addresses that you want to store on the object.'
  merge: -1
  img_proc: true
- pgno: 299
  md: 'An overlooked benefit of denormalization is that it reduces the number of records
    that would need to get loaded and therefore results in a faster and more performant
    load and requires less validation in terms of the total number of rows that need
    validation. From our preceding example, let''s assume that there are four types
    of addresses – billing, shipping, legal, and sold-to addresses. These would be
    four records in the address table, but in Salesforce, we would just create the
    additional two addresses on the Account object, thereby reducing the number of
    rows to load from four to one. The following diagram shows an example to demonstrate
    this:


    | ID | Name |

    |---|---|

    | 1 | Precision Printing |

    | 2 | MPath Logistics |


    # Account table


    | ID | Type | Address |

    |---|---|---|

    | 1 | Sold-to | 123 Main St, Vancouver BC |

    | 1 | Billing | 1 Mission St, Vancouver BC |

    | 1 | Shipping | 2411 Royals Road, Vancouver BC |

    | 1 | Legal | 541 Sheppard St, Toronto ON |

    | 2 | Billing | ... |


    # Address table


    # Figure 7.5 – Example showing how addresses would be stored in a normalized database


    The Type column in the Address table is usually another table that has all the
    address types defined, but that are combined here for clarity’s sake. When the
    data is denormalized and ready to be loaded into Salesforce, the Address table
    will not need to be created as a separate object, but rather the different address
    types will get created on the Account object.


    Figure 7.6 shows the equivalent of Figure 7.5. As can be seen, the different types
    of addresses are stored with the account name and other relevant details about
    the account (not shown here for the sake of brevity):


    | ID | Name | Billing Address | Shipping Address | Sold-to Address | Legal Address
    |

    |---|---|---|---|---|---|

    | 1 | Precision Printing | 1 Mission St, Vancouver BC | 2411 Royals Road, Vancouver
    BC | 123 Main St, Vancouver BC | 541 Sheppard St, Toronto ON |

    | 2 | MPath Logistics | 234 Quadra St, Chicago IL | 234 Quadra St, Chicago IL
    | 77 Jasper Ave, Calgary AB | 901 Bay Street, Toronto ON |


    # Figure 7.6 – Visual representation of how different types of address will be
    stored on the Account object in Salesforce'
  merge: -1
  img_proc: true
- pgno: 300
  md: 'We have seen how data modeling is important and how normalized versus denormalized
    creates transformation requirements that must be taken into account when designing
    data migrations and integrations.


    # Tooling


    **Extract, Transform, Load (ETL)** tools can extract data from the source system,
    transform, and then load the data into the destination, that is, Salesforce objects.
    While these are very useful for most migrations, LDVs can take advantage of integration
    tools such as MuleSoft. The reason is that integration tools offer a more robust
    set of functionalities, which makes it easier to migrate or integrate LDVs. For
    example, ETL tools can transform the data but, in an example where you want to
    insert a batch and then update it based on a certain criterion, you cannot chain
    the two with most ETL tools. An integration tool, on the other hand, can easily
    do that and gives you the flexibility, in our example, to let the insert operation
    complete and then run the update operation if the previous operation was successful.
    Chaining events like this can be a big time saver because it takes away the need
    for manual intervention and allows you to run your batches with more flexibility.


    Do not underestimate the importance of chaining because it can be a big time saver
    and save you from a lot of headaches. The reason is that LDVs are different from
    regular loads where you are loading a few hundred, thousands, or hundreds of thousands
    of records. Even if 0.5% of records fail in a batch of 100,000 records, you would
    need to manually fix 500 records, which is a significant number if not gigantic.
    With LDVs, a batch of 1 million records that has 0.5% records failing means 5,000,
    which is a very large volume if it has to be fixed manually. Integration tools
    provide the capability to re-run failed records and you can orchestrate the flow
    of steps so the number of records needing any type of manual intervention is kept
    to a minimum.


    When migrating into live brownfield orgs, you may find a need to export existing
    data from Salesforce, transform it in some way, and then load it back into Salesforce.
    An integration tool can be handy here as well because once you are comfortable
    with the setup you configured for the tool, you can automate it. For example,
    if you were to merge two orgs, org A and org B, where org B will be decommissioned
    following the merger, the chances are that you have a high overlap between CRM
    data, in which case you will want to extract data from org A, transform the data,
    including adding new attributes from org B, and then load it back into Salesforce.'
  merge: -1
  img_proc: true
- pgno: 301
  md: '# Timing your operation


    If possible, consider taking a staggered approach when migrating data rather than
    relying on a weekend to do it. Loading 10 million cases into Salesforce, along
    with a million Account records and 3 million Contact records, despite your best
    efforts, can be a lot of work. Stagger your migration by splitting the large volume
    of data into manageable chunks. That way, at the time of data migration cutover,
    you will have a smaller delta of records remaining to be loaded.


    As you run the batches in a full copy sandbox, benchmarking the time it takes
    for your load to run will give you an idea of how long it will take to run the
    loads in production. This is important because you want to ensure that your communications
    with impacted users are immaculate and they know what, how, and when to expect
    the impacts on their day-to-day use of the platform.


    # Iterate, iterate, iterate...


    I cannot stress this point enough: iterate your loads multiple times to iron out
    any kinks. Start with a Developer Pro sandbox and a few thousand records, fix
    any issues, and reiterate the batch. Incrementally start increasing the number
    of records and load the data. Once you have exceeded the limit of the number of
    records in the Developer Pro sandbox, move on to a Partial Copy sandbox, which
    provides 5 GB of storage space. Eventually, you will want to perform any user
    acceptance testing in a full copy sandbox that is identical to production.


    # Transformations


    As you are well aware, data migrations and integrations are usually not simple
    to extract and load operations but instead involve significant transformation
    before getting loaded into the destination. With LDVs, transformation becomes
    more resource-intensive because of the volume of data. As recommended earlier,
    transformations should be done outside of Salesforce rather than relying on the
    automation tools there to speed up the loads and to prevent running into issues.


    Transformations can be any number of things, from using formulas to concatenate
    and create new values to adding missing values or replacing values in the destination
    based on certain criteria. Another type of transformation that you need to keep
    in mind is the data type transformation to the field type in Salesforce. By data
    type, I mean that traditional databases such as SQL Server, Oracle, and others
    have data types defined for each column of the table in the database, so a column
    can be decimal, text, or something similar.'
  merge: -1
  img_proc: true
- pgno: 302
  md: 'In Salesforce, because we don''t get access to the database directly, we have
    field types, so to store a number, whether it''s an integer or decimal, you create
    a new field with the type as **Number**. When you want to migrate a number value
    from SQL Server, you would need to type case that into a corresponding type in
    Salesforce.


    You will also need to transform picklist values from the source into Salesforce
    and, similarly, other transformations as per your business requirements. The important
    point is that there can be significant transformations taking place and the tool
    should be able to handle the loads without slowing down the overall process.


    # User involvement and validation


    Involve your users who are intimately familiar with the data from the outset of
    the project. Validation of whether a data load was successful has multiple facets,
    one of which is to involve your power users who know their data. Set the expectations,
    timelines, and how much and when they will be needed to validate the loads. It''s
    one thing to know that the total number of records from the source matched the
    total number of records loaded into Salesforce, but that doesn''t necessarily
    mean that all the data elements came across fine, especially when there is a transformation
    step in between.


    Your users will help find the gaps with respect to fields that appear blank, or
    strategic accounts that are missing. These records with issues may not necessarily
    show up in your error logs, but the data is not accurate from a usability perspective.
    Guide your users to select random samples of data to validate the data, but also
    focus on the ones that are most critical to the business.


    Another way to accomplish validation, depending on the objects, is to validate
    the aggregate counts or sums of fields. For example, if your business requirement
    is to load opportunity data for the current fiscal year, then compare the sum
    of the **Amount** field for all opportunities in the current fiscal year with
    the values from the source system. This can get hairy if the opportunities cannot
    be compared 1:1 (due to different **Stage** field values, for example) and may
    require some additional work.


    In the next section, we will discuss that LDV scenarios should be avoided, if
    possible, in the first place.


    # Preventing LDV scenarios


    OK, the title of this section may sound a bit extreme and LDVs are not a malady
    either, but the point is that if you can, you should avoid running into LDV scenarios.
    I want to stress that the criterion discussed in the last section doesn''t mean
    that you should automatically start thinking of an LDV scenario unless it''s absolutely
    needed.'
  merge: -1
  img_proc: true
- pgno: 303
  md: 'There are ways to prevent an LDV scenario and where it makes sense, they should
    be employed. To be clear, large orgs will have LDV scenarios and cannot be avoided,
    but my intent here is to again stress that not every LDV scenario is materialized
    organically. Rather, some can be outright prevented, for example, when the organization
    has no archiving strategy in place and has been storing years and years’ worth
    of data in Salesforce, resulting in an LDV situation. In cases such as these,
    you should give serious thought to moving data off the platform. Let’s discuss
    some of the options available to move data off the platform for better scalability
    and performance.


    # Data archiving


    Regular data archiving using automated tools can be a good strategy to prevent
    growing your data massively on the platform. Remember that the core Salesforce
    platform, although capable, is not meant for storing massive volumes, but rather
    for optimal transactional loads. Archiving data improves reports, list views,
    and dashboard performance. It also improves SOQLs because the database has to
    look up a smaller dataset.


    Data archiving can be used to retain older data that is not actively needed but
    is required to be held either for auditing or regulatory compliance purposes.
    It can help with keeping only active data in the org that is needed for operations.
    For example, inactive customer accounts and contacts who have not been subscribers
    for more than 5 years and haven’t responded to marketing campaigns may be marked
    for archival. Let’s briefly look at some of the ways in which you can archive
    Salesforce data:


    +   * **Middleware-centric**: This leverages a middleware to orchestrate the archival
    process and store data in a data store. For retrieval purposes, you can either
    use Lightning Connect or use the middleware to retrieve the data into, say, a
    Lightning component in Salesforce.


    +   * **AppExchange partner**: Another method is to rely on a third-party AppExchange
    app to archive the data. There are numerous apps on AppExchange that do this and
    provide a range of features that can be leveraged to meet your data archiving
    requirements.


    +   * **Heroku**: Organizations utilizing Heroku can leverage it for archiving
    data as well. This leverages the Postgres database along with Lightning Connect,
    Heroku Connect, and custom web services to initiate the archival processes.


    +   * **Big objects**: This is another way of archiving data off from the main
    Salesforce objects into special objects that are designed to hold large volumes
    of data, but they also have limitations that must be considered. We will discuss
    big objects in more detail later in this chapter.'
  merge: -1
  img_proc: true
- pgno: 304
  md: 'Now that we have reviewed archiving methods briefly, let''s continue our discussion
    on other ways in which we can prevent LDV scenarios.


    # Deleting


    Deleting data that has been confirmed to be of no value to the organization and
    doesn''t require storage due to regulatory or compliance reasons is a good candidate
    for permanent deletion. This can free up storage and reduce potential LDV scenarios.


    What needs to be understood is the difference between soft and hard delete. When
    records are soft deleted, performance improvements will not be realized because
    the data is still on the platform and remains in the Recycle Bin for 15 days.
    The platform has to explicitly exclude these records from queries and other operations.


    If you know that you won''t need the delete, using the Bulk API with the Hard
    Delete option will allow you to delete the records immediately without being stored
    in the Recycle Bin. It is recommended to use this option for deleting large volumes
    of data and for immediate performance improvements.


    # Mashups


    This is a type of data virtualization where the data is stored on an external
    system and the application is made available in the Salesforce User Interface
    (UI). This essentially creates a loosely coupled integration that is not reliant
    on any proprietary method to integrate the two applications. The downside is that
    it is optimal for use cases where small amounts of data are needed in real time.


    # External object


    This is another form of data virtualization where the data is stored in the source
    system, but using OData connectors, data can be made available in Salesforce on
    demand. For example, assume that you have order data in Microsoft Dynamics. Rather
    than integrating Salesforce and Microsoft Dynamics in a traditional integration,
    you could use Salesforce Connect to link up the two systems. When a user pulls
    up the order-related list on the Account record, a real-time call is made through
    the connector and the results are returned and displayed in the related list.


    In the next section, we will look at the different ways we can optimize performance
    for LDV operations.'
  merge: -1
  img_proc: true
- pgno: 305
  md: '# # Optimizing LDV operations


    There are multiple ways to optimize the performance of LDV operations and we will
    cover these in the upcoming subsections. Rather than trying all of these things
    at once if you are experiencing performance issues, try to implement these techniques
    and note the performance while continuing to monitor and tweak further as required.
    This can help you to pinpoint the exact cause of the performance issue and may
    help solve other similar issues.


    # ## Data skew


    When you have more than 10,000 child records that are all linked with the same
    parent record, a data skew situation arises. This is undesirable, and the key
    to preventing data skew is to keep the number of child records per parent below
    the 10,000 threshold and distribute these new child records across accounts. There
    are three types of skews:


    +   * Account data skew


    Account data skew happens when a large number of child records are associated
    with the same account record. For example, more than 10,000 opportunity records
    have the same parent account. This usually happens when a generic account is used
    as a parent for unassigned contacts. Account data skew can cause the following
    issues:


    +   a) Record locking: When updating a large number of child records, for example,
    opportunities under the same account in multiple threads, the same account would
    need to be locked for data integrity. The locks are held for a very short amount
    of time, but it is possible that the previous update is still holding the lock
    and, therefore, will fail the update. Remember in a parent-child relationship
    that when the child is updated, it also locks the parent record to maintain data
    integrity in the database.


    +   b) Sharing issues: Depending on sharing configuration, simple changes such
    as changing ownership on an account may require examining every child record for
    that account and adjust sharing as well. In a scenario involving a large number
    of records, this can take a lot of time and cause issues.'
  merge: -1
  img_proc: true
- pgno: 306
  md: '# **Ownership skew**


    This happens when a single user owns a large number of records, typically more
    than 10,000 records. For example, an integration user is assigned all the accounts
    from the external system. When the skewed owner exists in the role hierarchy,
    operations such as delete or owner changes cause the system to remove sharing
    from the old owner and all parent users within the hierarchy, and from users who
    have access through sharing rules. For this reason, ownership changes are the
    costliest transactional changes in the system.


    If you do need to assign a large number of child records to a parent record, determine
    whether you can have multiple parent accounts that the child records can be distributed
    to, thereby avoiding the ownership skew scenario. Remember that every record in
    Salesforce should have an owner, irrespective of whether it’s a user or a queue.


    In situations where ownership cannot be avoided, the skewed owner can be made
    such that they don’t have a role in the hierarchy. That way, the system doesn’t
    have to make any sharing calculations associated with the skewed user’s records.


    # **Lookup skew**


    This happens when a large number of records are associated with a single lookup
    record; for example, you have a custom quote object that has a lookup to a custom
    facility object that indicates where the repair for the component will be done.
    If there are an excessive number of quotes associated with a single facility record,
    you will run into lookup skew issues.


    Lookups are basically foreign key relationships in database terms, and when a
    record is being inserted/updated, the associated lookup record must also be locked
    to maintain data integrity. This is the reason why lookup skews are not good for
    performance.'
  merge: -1
  img_proc: true
- pgno: 307
  md: 'Lookup skews can still happen even if multiple objects have a lookup to the
    same object; for example, objects x, y, and z each have a lookup to object a.
    If record ID ax1 on object a is the parent record for say 50,000 records on object
    x, 10,000 records on object y, and 20,000 records on object z, you will still
    have a lookup skew situation. Lookup skews can be avoided by employing some of
    the following methods:


    **Improving record save performance** – This can be done by doing the following:


    +   a) Increasing the performance of your synchronous Apex code – tune your triggers
    for peak performance by consolidating code into a single trigger object.


    +   b) Removing unnecessary workflows, process builders, or flows or consolidating
    into existing trigger code. Keep in mind that these automations lengthen the lock
    duration, which can cause increased lock failures. Removing or consolidating workflows
    into Apex can improve performance.


    +   c) Processing only what''s required synchronously and moving the rest of the
    code to asynchronous processing since locks are held for the full duration of
    the custom code execution.


    **Distributing the skew** – Consider adding additional values to the lookup to
    avoid the skew or leaving it blank, if possible. This is because lookup issues
    are caused when many records have a lookup relationship to a single record. For
    example, a business provides quick budgetary quotes to walk-in customers without
    taking all of their details and creating an account in Salesforce. A generic account
    record has been created for this purpose. Over time, as quotes get created under
    this generic account, a lookup skew situation will arise that can then start to
    impact performance.


    **Using a picklist field** – If there are a few lookup values, consider using
    a picklist value. By using a picklist value, you eliminate the locks associated
    with lookups and, hence, any locking issues.


    As can be seen, something as innocuous as a lookup can lead to serious performance
    issues. This is a good reminder that we need to consider the consequences of our
    design and design for scalability and performance.'
  merge: -1
  img_proc: true
- pgno: 308
  md: '# List views and reports


    List views and reports are usually the first places where users start noticing
    performance issues. This is because almost every user of the platform will either
    have reports, list views, or both, so they can focus on the work they need to
    do:


    +   **Limit the number of fields:** The first thing I recommend is to educate
    your users to use fields on both list views and reports that they truly need.
    On many occasions, when creating reports, users pull fields on them to get a feel
    for what data is available but never get rid of them when saving the report. There
    is much less value in having reports with data that won''t be used by users, and
    not only that, but it also impacts performance as well. The best strategy that
    I find works is to not just tell users what to do when creating reports but explain
    the rationale behind why it''s important that this is done and how it can impact
    them down the road.


    +   **Use filters:** Use filters as much as possible to narrow down the result
    set for reports. In the last chapter, when we discussed query plans and query
    costs, we discussed how a table scan is less efficient than using indexes. Try
    to use fields in your reports and list views as filters that are indexed to ensure
    performance.


    Also, using relative dates, rather than exact date values, will result in better
    performance. For example, using **LAST WEEK** in your list view to filter all
    the leads from last week will be more performant, all things being equal, than
    entering **From** and **To** dates.


    The use of **CONTAINS**, != is also discouraged as it prevents the Salesforce
    platform from using indexes and therefore negatively impacts performance. If you
    are unsure about how a report that you are creating for your users will perform,
    I sometimes find it helpful to write the query behind the report or list view
    and run it in the query plan. This can give you a sense of how your query will
    perform in the report or list.


    +   **Unused reports:** Salesforce provides the ability to schedule reports and
    dashboards so users can automatically get the report or dashboard emailed to them.
    Ensure that you do a frequent cleanup of reports and dashboards that are scheduled.
    In one instance, a shared mailbox used by admins had multiple reports emailed
    that had been requested as one-time requests from executives, but they were never
    deleted from the platform.'
  merge: -1
  img_proc: true
- pgno: 309
  md: '+   - **Governance**: Implement at a minimum some level of governance around
    reports. Report proliferation is a real thing and can get out of control really
    quickly if not dealt with properly. One way that I find useful is to create report
    folders for each business department and give users in the department full access
    to the folder. Alternatively, you can designate 1-2 power users and give them
    **Manager** access, with the remaining users having **Editor** access to the folder.


    # ## SOQL best practices


    Every time we press a Visualforce page that shows us some data, runs a report,
    or runs an interface to update data using Data Loader, chances are that we are
    querying some data from the database and running a query behind the scenes, whether
    we realize it or not. Acknowledging that some of the data is also cached for performance
    reasons, but assuming we run the aforementioned operations first time, a query
    will be running behind the scenes.


    Because the Salesforce platform is multi-tenant and customers don''t get access
    to the database directly, when you run a report, SOQL, and list view, your request
    is sent to what''s called a **Query Optimizer**. This is a layer above the database
    that then converts your SOQL into a SQL query that the database can understand.
    The Query Optimizer understands *sharing rules*, including *with sharing*, in
    Apex classes as these have a direct impact on the results of a SOQL statement
    or when a report is run. The Query Optimizer is designed to optimize the SOQL
    into SQL for the database to run. *Optimize here refers to whether a full table
    scan or index will be performed as well as the order in which the joins will be
    performed. Some of the practices mentioned in the List views and reports section
    are applicable to SOQL queries as well and so I won''t be repeating them here.*


    Let''s review some of the best practices related to running SOQL queries:


    +   - **Using indexes**: This is very useful for ensuring that your queries will
    run efficiently. There are two types of indexes in Salesforce – standard and custom:

    +   Standard indexes include fields such as RecordId, fields marked as external
    IDs, Name, LastModifiedDate, CreatedDate, RecordTypeId, Division, Email (for Contact
    and Lead objects only), lookup, and master-detail relationships.'
  merge: -1
  img_proc: true
- pgno: 310
  md: 'You can ask Salesforce Support to create custom indexes on formula fields and
    fields containing nulls. **Formula** fields calculate values on the fly and, by
    default, they don''t have indexes, which typically means that a table scan would
    be required. If you decided to create custom **Indexes** on **Formula** fields,
    the function that defines the **Formula** field must be deterministic. Examples
    of non-deterministic **Formula** fields include the following:


    +   - They contain a reference to another field, for example, lookup.

    +   - They reference another **Formula** field.

    +   - They use dynamic dates and time functions, for example, NOW, TODAY, and
    others.

    +   - They have owner, auto number, division, and audit fields (excluding **CreatedDate**
    and **CreatedByID**).

    +   - They reference other fields that cannot be indexed, for example, multi-select
    picklists, currency, long text area fields, and binary fields, including encrypted
    fields.


    Standard fields with special functions, for example, on the **Opportunity** object,
    the **Amount** and **TotalOpportunityQuantity** fields.


    Null fields are not indexed by default and, therefore, a null field would require
    a full table scan. A two-column index, including a null field, can be created
    on request to Salesforce. In this case, the second column can be null, but not
    the first column.


    # Divisions


    This feature facilitates the partitioning of data, thereby improving query performance.
    You could have Salesforce enable this functionality and create divisions based
    on regions, but other values are also allowed. Each record then has a value for
    the **Division** field. For example, *division* values can be based on regions
    such as North America, Europe, Australia, and the like.


    If you have the **Affected by Division** permission, then your search results,
    list views, and other functionality in Salesforce provide the option to select
    the division that you want to return results from. For example, you can only show
    records specific to a division if, at the time of creating or editing the list
    view, you specify the division you are interested in. Similarly, you can specify
    the division in report options to return results from a specific division, otherwise
    records from all divisions will be shown.'
  merge: -1
  img_proc: true
- pgno: 311
  md: '# Dedicated integration user


    I think most, if not all, companies that are integration heavy and have large
    volumes use a dedicated integration user for these operations, but I would like
    to reiterate the need to use a dedicated integration user whenever possible. This
    helps in identifying who made the changes and whether they are related to these
    processes, but also helps with avoiding any type of conflicts when an active platform
    user is doing work in the org and their username is being used for integrations
    or data migrations.


    # Setting appropriate org-wide defaults


    Salesforce stores access to records in Sharing tables. Whenever records are inserted
    or the ownership changes, the platform has to insert/update these Sharing tables.
    Setting the Organization-Wide Default (OWD) to Private creates the additional
    burden of maintaining these Sharing tables. It is recommended, if possible and
    it''s a greenfield org, to use Public Read/Write settings during data loads and
    then update the OWD to other settings as needed. This will allow the platform
    to insert data without inserting records in the Sharing tables at the same time.


    # Parallel sharing rule re-calculations


    As organizations grow naturally or through mergers, acquisitions, or a reorganization,
    expect to see changes to your role hierarchy. And if there are sharing rules that
    allow access via sharing rules, changes to the role hierarchy mean that rules
    may need to be updated and re-run.


    In LDV scenarios, these rules can take a great amount of time to complete and
    cause issues such as the process taking a long time to run and users needing access
    to use the system. If the rules are still running and the tables haven''t been
    updated, users will not have access to the data or may have more access than they
    should.


    The other issue is that due to the way these sharing rules are calculated, there
    is not much information in terms of how long the process will take to complete,
    and meanwhile, if Salesforce applies a path or a release is being applied, these
    processes are aborted and must be re-run again.


    Once the parallel sharing calculation feature is enabled by Salesforce Customer
    Support, the updates happen asynchronously via a background processing queue.
    This allows for multiple execution threads to be created and placed in the queue,
    resulting in the quick completion of the process, and since jobs are placed in
    a job queue, interruptions due to patching or release application don''t impact
    these jobs.'
  merge: -1
  img_proc: true
- pgno: 312
  md: '# Disabling automation and logic consolidation


    A good general practice is to disable automation and data quality tools that you
    may have set up in the org. These include triggers, flows, process builders, workflow
    rules, and validation rules. The reason is that they are meant to ensure data
    quality or transformation. Doing these operations outside of Salesforce when loading
    large volumes of data will help with preventing timeouts and other performance
    issues with your org. A good practice commonly adopted is to have some sort of
    a flag on triggers that is accessible to administrators via **Custom Settings**
    or **Custom Metadata** types. Just by turning the switch to **Off**, all triggers
    can be turned off for the duration of the LDV operation. This should be extended
    to click-based tools, such as process builders, flows, and validations rules as
    well so that they can be temporarily disabled.


    Another factor to consider is the complexity of the org. Does it have multiple
    workflow rules or process builders on the same object? Is the Apex code properly
    bulkified? Is there custom code that is heavily dependent on synchronous operations?
    If the answer is _yes_ to any of these, you may want to take the appropriate action
    by bulkifying Apex code. In other cases, you will want to consolidate the business
    logic that is on multiple process builders into a trigger. An even better option
    in an LDV scenario could be to move the processing into an asynchronous model.
    The idea is to avoid synchronous operations unless they are absolutely needed.


    Consolidation can also take the form of reducing the number of automation tools
    you are using and moving them to a single logical place. For example, if you have
    a workflow rule, a process builder, a trigger, and a flow on an account, from
    an LDV perspective, I would recommend consolidating them and moving into a trigger
    or employing asynchronous techniques if the results are not needed right away
    by the user.


    # Deferred sharing rules calculation


    When making a large number of changes to roles, territories, public groups, users,
    and account ownerships that are part of sharing rules, they can automatically
    trigger a rule recalculation. This recalculation can take a long time to run,
    especially in LDV scenarios, and impact performance, but that may also lead to
    time-outs.


    For these situations, it is recommended to make all the changes and defer the
    recalculation of rules to a later time, perhaps when the users are offline or
    a relative period when there is less load on the org. The deferred sharing rules
    calculation simply defers the automatic calculation of the sharing rules and requires
    manual intervention when you have completed your work and are ready to let the
    calculations run. This feature is not available by default, and you need to contact
    Salesforce Customer Support to have it available in your org.'
  merge: -1
  img_proc: true
- pgno: 313
  md: '**Group membership and sharing calculations**

    Sharing calculations usually have groups to grant access to users. A group in
    Salesforce can be an individual user or another group of users in a particular
    role or hierarchy. Groups are used in Salesforce to set up default sharing access,
    record sharing with users, and so on. Refer to this link to read more about the
    groups in Salesforce: https://developer.salesforce.com/docs/atlas.en-us.securityImplGuide.meta/securityImplGuide/users_group_member_types.htm.


    # Granular locking


    Just like when a child record in a master-child relationship is being updated
    and the system automatically locks the parent record to prevent any data integrity
    issues, when roles or group membership updates are done, the entire group membership
    table is locked. This happens regardless of whether the updates are being through
    the API or using the frontend. When a large number of updates are being undertaken,
    as in an LDV scenario, or other integrations are running that update roles or
    group memberships, you may receive could not acquire locks errors.


    Granular locking allows group maintenance operations to proceed as long as there
    are no hierarchical or other relationships between the roles and the groups that
    are being updated. This concurrency allows for large updates to happen quickly,
    while preventing any locking errors.


    # Update versus upsert operations


    During an insert or an update operation, a row is simply inserted or updated based
    on the record ID or an external ID. With upsert, however, the platform has to
    determine whether a record already exists, and, based on the result of that query,
    it will either do an insert or an update. It is recommended to not use upserts
    especially for LDV scenarios as that can result in a quite notable performance
    degradation.


    # Roll-up summary (RUP) fields


    When doing LDV migrations, you can also defer the creation of any RUP fields once
    the data has been loaded. This is because, as data is loaded into the system,
    if you have multiple RUP fields, the platform will try to calculate them as the
    data is getting loaded since they are calculated almost instantly. To reduce any
    chances of performance slowdown, it is recommended to defer RUP fields once all
    the data has been migrated successfully.'
  merge: -1
  img_proc: true
- pgno: 314
  md: 'There are several measures that we can take to ensure that LDVs in Salesforce
    can be handled without having to be overly concerned about performance. The key
    thing is to design for performance and scalability right from the get-go. Performance
    issues don''t manifest overnight, but rather they are the consequences of bad
    design choices or architectural oversights that accumulate over time and impact
    performance in the org. With proper planning and architectural design, these issues
    can be avoided and a scalable, performant solution can be delivered to your users.


    Not all data needs to be brought into Salesforce, and there are use cases where
    the data can continue to reside in an external system but is made available to
    users on demand. This is where Salesforce Connect and external objects come into
    the picture. Let''s discuss them in more detail.


    # # Salesforce Connect and external objects


    We briefly discussed external objects in the LDV section, but let''s take a deeper
    dive in this section. Salesforce Connect is a point-and-click solution to integrate
    external systems with Salesforce without the need for writing complex code or
    requiring a middleware to move data across the systems. Data is queried from the
    external system on demand and made available to users in Salesforce. This way,
    you can easily integrate ERPs such as Oracle, SAP, or Microsoft, along with several
    other systems that support the OData protocol.


    **OData protocol**


    Short for **Open Data Protocol**, **OData** is a standard that''s used for integrating
    disparate systems or databases. The Odata protocol allows for the easy consumption
    of the interoperable RESTful (REST) APIs. The standardization of OData is its
    advantage given that you don''t have to worry about the formats of different systems.
    Since both source and destination systems support the OData protocol, this means
    that they can communicate easily using an agreed-upon data format.


    By using Salesforce Connect, which leverages external objects, users can not only
    read data from source systems but also write, delete, and update data. I have
    seen it being used to query and display order fulfillment data that was stored
    in an Azure database. External objects are like custom objects.'
  merge: -1
  img_proc: true
- pgno: 315
  md: '# Ways to connect


    There are multiple ways in which to use Salesforce Connect, one of which is to
    use an OData connector. Let''s review each of these briefly:


    +   * **OData adapter**: OData 2.0 or 4.0 adapters can be used to integrate with
    systems that support the protocol. One of the common use cases is in organizations
    that use both Microsoft SharePoint and Salesforce and want to display SharePoint
    data in Salesforce. Since Microsoft supports OData, you can integrate the two
    systems without writing any code or doing any testing.


    +   * **Custom adapters**: There may be cases where the OData adapter may not
    satisfy requirements and a custom solution is required. In that case, Salesforce
    Connect provides the flexibility to code your own adapter by using the Apex Connector
    Framework. This is not as quick as a point-and-click solution that the OData adapter
    uses, but nonetheless provides greater flexibility to meet business requirements.


    Having looked at some of the ways that Salesforce Connect can be used, let''s
    take a look at the benefits of external objects.


    # Benefits of external objects


    External objects are an awesome tool in any architect''s toolbox as they provide
    numerous benefits, including the following:


    +   * **Ease of setup**: External objects can be set up using the UI in Salesforce
    and don''t require any coding skills. This can be a huge time saver and it also
    makes it easy for Salesforce admins with no coding skills to set up an integration
    with external systems.


    +   * **Data virtualization**: External objects provide a good mechanism to virtualize
    data. This means that you could have the data stored in an external system and
    you can make it available for your users on demand whenever they need it. Storage
    is expensive in Salesforce and external objects can be used to make data available
    for your users without storing it in Salesforce.


    +   * **Read and write operations**: External objects provide the ability to not
    only read the data from external systems, but also the ability to write back into
    the source system. This is a powerful feature that enables Salesforce users to
    update another system without ever needing to leave Salesforce.'
  merge: -1
  img_proc: true
- pgno: 316
  md: '+   • **Real-time data**: Another benefit of external objects is that the data
    is available on demand. Whenever you open a tab that is associated with an external
    object, a REST call is made to the endpoint and the results are returned in real
    time. This is a huge benefit for use cases where data is required by users right
    away but is hosted in external systems. This eliminates the need for a middleware
    tool to track the records that have been moved and/or are waiting to be moved
    over to the destination; that is, it eliminates the need for syncing between systems
    since the data is never stored in Salesforce and is fetched in real time.


    +   • **Standard functionality**: There are some limitations to external objects
    regarding features such as free text search, record views, and list views, and
    these will be discussed in the Considerations for external objects section. This
    makes it easier for users to leverage external objects'' data because of the familiar
    UI that they are accustomed to in Salesforce.


    +   • **Mobile data**: External objects'' data is also available with mobile devices.
    So, your users are not limited to viewing the data only when they are in front
    of their desktops, but rather, they can access external objects anywhere and anytime
    they have an internal connection.


    Let''s now take a look at some of the considerations for using external objects.


    # Considerations for external objects


    Since external objects provide a means to virtualize data and are similar to custom
    objects in some cases, there are limitations to consider before using external
    objects. Some of these limitations include the following:


    +   • **Limited standard functionality**: Standard functionality that you get
    with most custom objects is not available for external objects. For example, workflow
    rules, approval processes, record types, field history tracking, and notes are
    not available for external objects. That''s why it is critical that you have a
    very clear understanding of the business requirements and the business objective
    that you are trying to achieve as external objects may not meet requirements and
    other options may be more suitable.


    +   • **Limited custom fields**: Custom fields, such as auto-number, currency,
    formula, and master-detail relationship, are not available for external objects.
    Similarly, if you are planning to do roll-up summary calculations using RUP fields,
    they are not available for external objects.'
  merge: -1
  img_proc: true
- pgno: 317
  md: '+   - Reporting considerations: There are reporting considerations for external
    objects as well. Since data is fetched in real time from the external system,
    it can take a while for reports to run. Cross filters are also not supported on
    external objects. When the report is run, including an external object, a callout
    is made to the external system that counts toward the total callout limit allowed.
    For example, for the Enterprise, Performance, and Unlimited editions, 20,000 OData
    callouts can be made in an hour.


    Carefully consider the limitations for external objects before deciding to use
    them for your solution. For a complete list of limitations, refer to this link
    from Salesforce: https://help.salesforce.com/articleView?id=sf.platform_connect_considerations_reports.htm&type=5.


    We have discussed how external objects are a useful tool in our toolkit for making
    data available in Salesforce without the need for a middleware or writing code.
    Although a powerful feature of Salesforce, carefully review your use cases alongside
    the limitations of external objects to ensure that your business needs will be
    sufficiently met with external objects.


    Now, we will review big objects, which are another feature in Salesforce that
    can be used to store hundreds of millions of records.


    # Introducing big objects


    Standard and custom Salesforce objects are designed to hold hundreds of thousands
    to millions of records, but organizations are generating new data at an exponential
    pace. Salesforce customers were no exceptions to this and were generating data
    at a rapid pace. Originally not designed for massive data volumes, the limits
    of standard and custom objects were being reached, forcing customers to look at
    other non-Salesforce options. Managing big data is challenging as it requires
    a specialized skill set and dedicated infrastructure to manage effectively.


    Realizing these challenges and the business needs of its customers, Salesforce
    released the big objects feature a few years ago. Big objects can store millions
    of records, reaching up to the 1 billion mark and more. This data can then be
    accessed in the Salesforce platform or by any external application as well. The
    big object architecture is different from the main Salesforce platform, which
    most people are familiar with. Big objects run on a non-relational database architecture,
    which allows for greater scalability and consistent performance.'
  merge: -1
  img_proc: true
- pgno: 318
  md: 'As we saw earlier in the chapter, non-relational databases are not intended
    for transactional operations, but instead are optimized for large storage. The
    big objects architecture is no different and has specialized ways to insert and
    retrieve data. Regular SOQL queries will not work efficiently with big objects
    as the query will time out and, therefore, Async (Asynchronous) SOQL is used to
    query big object data.


    With this brief introduction out of the way, let''s now review the benefits of
    big objects.


    # ## Benefits of big objects


    The big objects feature helps resolve specific problems that customers were facing
    when this feature was not around. Let''s try to understand the benefits of big
    objects:


    +   - **End user experience**: If you have an org with millions of records in
    objects and users are starting to complain about slow reports, list views, or
    Apex processes taking a long time to complete, big objects may be the option to
    look at. You can offload older data from the platform into big objects, thereby
    improving SOQL performance, which translates into higher internal and external
    user satisfaction.


    +   - **Learning curve**: Even though big objects have their own quirks with respect
    to how indexes are created and used in Async SOQL, you can use the API or the
    UI to create big objects and use Async SOQL to query the data. Async SOQL is very
    similar to SOQL and if you already have SOQL, transitioning over to Async SOQL
    is not very difficult.


    +   - **Low-cost storage option**: Compared to storage on the platform, big objects
    are a cheaper option for storing large volumes of data. Once you have established
    the process and the tools are in place to automatically archive data, you can
    be hands-off knowing that you don''t have to worry about performance or getting
    approvals for buying more storage on the platform. Salesforce also uses big objects
    to store field history data in the `FieldHistoryArchive` object. This object can
    store field history data for up to 10 years.


    +   - **Analytics**: Reporting on massive volumes of data can be challenging,
    but with big objects, using Async SOQL can make the job easier. Summarizing big
    object data into custom objects can enable users to use familiar tools such as
    Salesforce Report Builder and dashboards for analytics. Additionally, **Einstein
    Analytics (EA)** supports big object data, so you can use the features of EA to
    quickly visualize your data.'
  merge: -1
  img_proc: true
- pgno: 319
  md: '+   • **Integrations**: Big objects work with **Platform Events (PE)** and
    this is a big advantage because you can simply publish your event and consume
    it in big objects. For example, whenever a quote is approved and converted into
    an order, you can publish order details using PE and insert records in big objects
    to be used by EA reports.


    +   • **Audit and compliance data**: For businesses in industries that generate
    gigantic volumes of data and are required to keep them for a certain period for
    audit or regulatory compliance purposes, big objects provide a lot of flexibility.
    The data remains within highly secured Salesforce data centers and the solution
    is scalable, so the organization doesn’t have to worry about moving data off of
    big objects.


    Now, let’s look into some considerations for big objects. These are important
    because understanding them and considering them when designing solutions for dealing
    with big data can impact your choice of solution.


    # Considerations for big objects


    As with anything, there are several architectural considerations to keep in mind
    when deciding to use big objects. Some of these are as follows:


    +   • **SOQL and Async SOQL**: Big objects can be worked with more effectively
    as a result of using Async SOQL. This is because these objects are created in
    a certain way and regular SOQL queries are not optimized to work with big objects.


    +   • **Absence of UI**: Unlike standard and custom objects, once you have created
    the metadata for your big object, there is no UI screen where your users can go
    and work with big objects. You will have to create your own custom UI, either
    using Visualforce or Lightning components.


    +   • **Number of big objects**: You are limited to creating 100 objects, along
    with a limit on the number of fields that you can create in each object. The number
    of fields that you can create is dependent on your org’s license type. For example,
    you can create 800 fields on your big object if you have the Performance edition,
    whereas 500 fields are allowed if you have the Enterprise edition.


    +   • **Salesforce Connect**: Big objects don’t support the use of Salesforce
    Connect and external objects. This means that you cannot store your data in big
    objects and pull it into Salesforce.'
  merge: -1
  img_proc: true
- pgno: 320
  md: "+   - **Consistency over availability**: Big objects are designed to hold billions\
    \ of records and are architected in such a way that they deliver consistency over\
    \ availability. Consistency here refers to the fact that on a multi-node system,\
    \ every node will provide the exact same response, whereas availability ensures\
    \ that all nodes will provide a response.\n+   \n+   Since big objects architecture\
    \ prefers consistency, when working with big objects using APIs, ensure that you\
    \ have retry mechanisms to rewrite complete batches until you have a response\
    \ from the API. In practical terms, this means that, unlike other database transactions,\
    \ where the platform or your code can do rollbacks, there are no rollbacks with\
    \ big objects and therefore a retry mechanism must be in place for complete batches.\n\
    \n+   - **Sandboxes**: Big objects are copied when a sandbox is created. However,\
    \ the data is not, so you will need to populate the sandbox yourself.\n\n+   -\
    \ **Fields**: Unlike the wide assortment of fields that you can create on a standard\
    \ or custom object, big objects have limitations in terms of the types of fields\
    \ you can create. At the time of writing, the following fields are supported:\n\
    +   - Date/Time\n+   - Lookup relationship\n+   - Email\n+   - Number\n+   - Phone\n\
    +   - Text\n+   - Text area (long)\n+   - URL\n\nThis is an important consideration\
    \ because if you plan on deploying big objects for, let’s say, data archiving\
    \ purposes and offload data from the platform, you will need to consider any field\
    \ transformations that may need to happen before the data can be stored in Salesforce.\
    \ Another important consideration is that big objects don’t support standard fields\
    \ such as CreatedDate, LastModifiedBy, and CreatedBy.\n\n+   - **Encryption**:\
    \ If you are storing sensitive data that has been encrypted, big objects don’t\
    \ support that currently and any encrypted data from standard or custom objects\
    \ will be stored as clear text on the big object."
  merge: -1
  img_proc: true
- pgno: 321
  md: '+   - **Automation tools**: Big objects are meant to support lots and lots
    of data, and features such as triggers, flows, and process builders are not supported
    on big objects because these features are meant for business processes that facilitate
    transactional systems. And big objects architecture is not meant to be used as
    a transactional system.


    +   - **Security**: Depending on your use case, this is another important consideration
    to keep in mind when thinking of using big objects since there are limited security
    options with it. You can enforce object- and field-level permissions, but sharing
    rules are not supported. This means that you will have to carefully analyze how
    user access would be mapped from the platform to big objects.


    +   - **Reporting**: Due to the high volumes that big objects are intended for,
    currently there is no support for search, reports, and dashboards. However, you
    have the option to summarize the data in the big object using Async SOQL and move
    it to a custom object on the platform. Then you can search, report, and create
    dashboards just like you would do with any other standard or custom object.


    Now that we have reviewed the considerations for big objects, let''s look at some
    of the use cases for big objects.


    # ## Use cases for big objects


    Generally, any time you have large volumes of data that are not actively required
    for transactional or analytical purposes, big objects can be a good option to
    use. The key thing is to understand the requirements of the business, including
    how frequently data is needed, analytics, security, and how the data is going
    to be accessed. Let’s take a look at some use cases for big objects.


    # ## Regulatory requirements


    Regulatory requirements typically require that you have robust auditing mechanisms
    in place. And auditing even a small number of fields can generate a lot of data.
    There is a good reason why Salesforce limits the number of fields on which you
    can activate Audit History. You can generate tremendous amounts of data, for example,
    with a single Opportunity record, let alone records created from other objects.


    Different regulatory bodies have different requirements in terms of how long organizations
    are required to keep data, thereby requiring organizations to archive it and make
    it available if and when an audit happens. The banking and health industries are
    heavily regulated and have stringent requirements for data retention and retrieval.'
  merge: -1
  img_proc: true
- pgno: 322
  md: 'Big objects can easily meet the demands of these types of organizations as
    they can be scaled horizontally without requiring the customer to do anything
    additional on their end and, at the same time, avoid any performance impact on
    end users.


    # Archiving


    Given that Salesforce is a multi-tenant environment, there are limits imposed
    on how much storage you can use. With standard and custom objects, you can easily
    store millions of rows of data, but additional storage is expensive on the platform.
    Big objects are a good option for offloading data from the main platform to free
    up space and are a cheaper storage option.


    The advantage of big objects is that they are readily available to be used in
    Salesforce without any expensive integration work. You don’t have to worry about
    authentication or row-level security, and there is one less integration to worry
    about as big objects eliminate the need for these factors, which are essential
    for any integration.


    You can schedule reports to run frequently, perhaps on a quarterly basis, to determine
    whether there is certain data that is not being updated and that can be a good
    candidate for archival. Think of your main platform storage as the primary area
    where data that is actively used or referenced should reside, whereas big objects
    are a secondary area where less frequently used data or data that is required
    to be kept for regulatory purposes should reside. One such example is tasks in
    Salesforce, which are frequently used, and records are created at a rapid pace.
    Rather than deleting old tasks, you can simply archive them and use them for trend
    analysis and reporting.


    # 360-degree view of customer


    Organizations need to have a complete view of the customer as much as possible.
    All the touchpoints that customers have with the business’ digital assets and
    any interaction offline with the business are important sources of information
    for marketing. This can generate large amounts of data, especially in the retail
    industry, and storing all of that in the Salesforce platform can be a recipe to
    run out of storage quickly.


    Customers are now looking for a personalized experience and this can be provided
    based on predictive analytics. By bringing your data into one centralized location
    and leveraging Salesforce Einstein Analytics, you can offer your customers personalized
    offers based on their preferences or send them a special offer based on certain
    times of the year depending on their shopping history.'
  merge: -1
  img_proc: true
