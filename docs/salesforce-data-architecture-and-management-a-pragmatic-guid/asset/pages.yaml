- pgno: 269
  md: 'Imagine, if you had a complex business process that involved multiple DML statements,
    SOQL queries, and other operations, how this number could change. This is what
    I mean by not all tools are created equal. If your users are complaining of performance
    issues, this is one area that you cannot ignore and must take into consideration
    when troubleshooting.


    We compared a workflow rule with a Lightning Flow, but the same principle applies
    to other tools as well. Should you use a trigger, a Process Builder, or perhaps
    an asynchronous queueable process to deliver your solution? These are the kinds
    of questions you want to ask yourself during the design phase, but also during
    troubleshooting if you find out that Lightning Flow is taking too long and letting
    it run is no longer an option. You may have to resort to other options immediately
    to ensure that business operations continue to run with minimal interruption.


    # Performance in LEX


    The first interface of Salesforce was the Salesforce Classic interface that was
    geared more toward data entry and retrieval. As web technologies matured over
    the last few years, Salesforce decided to develop and release a new interface
    based on web standards and one that was geared toward providing a platform for
    developers to build rich applications that are responsive and performant.


    A salient feature of LEX is that the bulk of the work is done on the client side,
    that is, your browser. Pages are loaded progressively component by component to
    reduce load times. This is different to Salesforce Classic, where the page was
    generated by the server and then rendered in the browser. Because LEX is based
    on modern web standards that promote component-based designs for reusability,
    a Lightning component in Salesforce can call child components.


    As LEX does more processing on the client side, it is sensitive to the environment
    of the user and the performance of the application can be impacted by a few factors.
    The hardware that the user is using and the browser have an impact on the user’s
    experience.


    Another factor is the quality of the network that the user is on because data
    has to move between the user’s browser and Salesforce servers. Increased network
    latency will cause the performance to be slow. We have discussed some of these
    causes in earlier sections, but we should be cognizant by now that performance-related
    issues in LEX are more dependent on the user’s machine compared to Salesforce
    Classic.'
  merge: -1
  img_proc: true
- pgno: 270
  md: '# Technical requirements for LEX


    LEX is becoming the norm in more and more organizations and those organizations
    that are still using the Classic interface will eventually need to migrate from
    that interface to LEX. I briefly want to mention the minimum as well as the recommended
    requirements from Salesforce for an acceptable user experience. Keep in mind that
    these values should be used as guidance only and that you should do testing with
    users in different regions to ensure that they can perform their roles with acceptable
    levels of performance when using business applications on the Salesforce Platform.


    For the minimum requirements, Salesforce recommends the following benchmarks:


    +   * A network latency of 200 ms or less

    +   * An Octane score of 20,000 or greater

    +   * A download speed of 1 Mbps or greater

    +   * 5 GB of RAM with 2 GB available for browser tabs


    Salesforce’s recommended configuration is as follows:


    +   * A network latency of 150 ms or less

    +   * An Octane score of 30,000 or greater

    +   * A download speed of 3 Mbps or greater

    +   * 8 GB of RAM with 3 GB available for browser tabs


    These benchmarks are for desktops and laptops. The minimum required benchmark
    numbers for tablets and phones are different and should be referenced in Salesforce’s
    documentation.


    In the next section, we will go into more detail on Experienced Page Time (EPT).


    # Understanding EPT


    Page load time in Lightning Experience is measured by EPT. This is the time it
    takes for the page to load so it is available to the user in a useable state where
    they can meaningfully interact with the page. This sounds simple but there are
    nuances to what EPT actually is.


    We discussed earlier that the key difference between Salesforce Classic and LEX
    was that pages are generated by the server in the former, whereas in LEX, pages
    are made of components that are rendered progressively. Progressive loading means
    that the component might load other sub-components later, so knowing exactly when
    the page is available to the user is not straightforward.'
  merge: -1
  img_proc: true
- pgno: 271
  md: 'Other factors that can impact this metric include error handling, caching,
    and implementation details of the page, which, if not handled properly, can negatively
    impact EPT.


    To accommodate these factors, Salesforce calculates EPT as the time from the page
    start until no more activity has happened for 2 frames (roughly 33 ms). Accounting
    for these two frames allows any asynchronous calls such as **XML HTTP Request
    (XHR)** activity, storage activity, or other client-side work to complete.


    In the next section, we will look at Experience Cloud and what can be done to
    ensure optimal performance for your external-facing websites hosted on Salesforce.


    # ## Salesforce Experience Cloud


    Experience Cloud is the new rebranded name for Community Cloud and refers to external-facing
    websites that your customer or partners may use. Ensuring that they are performant
    is critical from a revenue as well as a reputational perspective. It is said that
    customers usually spend less than 15 seconds on a website page before leaving
    it. This means that you have more than 15 seconds to capture their attention and
    have them spend more meaningful time on your website, preferably leading to a
    purchase (assuming it’s an e-commerce site).


    Imagine if a potential customer visited your website and the product page was
    taking too long to load or it crashed – the prospect will most likely leave rather
    than wait for the page to load and will go to your competitor instead. In the
    *Conducting performance testing in Salesforce* section, we will look at Costco’s
    example, which is estimated to have cost the company around $11 million in revenue
    with just a few hours of outage.


    Salesforce provides the **Page Optimizer tool**, which can analyze your site and
    identify potential issues that might impact performance. The Page Optimizer is
    a downloadable Google Chrome browser extension. The tool shows the network performance
    of the page, evaluates the pages based on the web standards used in the Lightning
    framework, and suggests actions that can help improve page performance.


    The number of customizations you have on your Experience Cloud site, along with
    the number of page views per month, logins per month, and traffic patterns are
    some of the common causes of performance issues on Experience Cloud sites.


    The recommendation is to ensure that you have run scale and performance tests
    on your site before going live as very heavy loads on the site can cause performance
    issues. Heavy use of Apex, SOQL, and SOSL can also cause slowness on the site,
    so try to stick with using standard features as much as possible.'
  merge: -1
  img_proc: true
- pgno: 272
  md: 'We discussed earlier the use of CDNs, which can improve the performance and
    scalability of the site due to static resources and other frequently accessed
    content getting offloaded onto these networks. Another feature that Salesforce
    offers is the use of waiting rooms, which allow users to be queued into a waiting
    area and then slowly passed into the main website in a controlled manner. This
    allows sites that experience heavy spikes in traffic to manage this load properly
    without the risk of slowdowns or crashing under the load.


    In this section, we extensively covered the reasons why performance issues happen
    and looked at the multitude of tools at our disposal to monitor performance in
    Salesforce. Utilizing these tools, we can methodically rule out the reasons why
    these issues may be happening and arrive at the root cause.


    In the next section, we will discuss performance testing your Salesforce implementation.


    # Conducting performance testing in Salesforce


    The Salesforce Platform serves several billion transactions per day and is designed
    to be highly scalable. Given that Salesforce provides its platform as a service,
    they conduct extensive testing and monitoring to ensure that their platform can
    withstand the load that can be placed on the infrastructure.


    Performance testing has two components:


    +   - Stress testing: Stress testing is used to measure system performance under
    extreme conditions using loads that are beyond the maximum expected load. The
    goal of stress testing is to determine the maximum limit the system can stretch
    to without crashing.


    +   - Load testing: Load testing, on the other hand, is measuring the performance
    of a system under expected loads. The goal here is to ensure that acceptable levels
    of service can be provided, or if there are formal SLAs, that they can be met.


    An application that doesn’t perform well under heavy loads can crash the system
    and potentially cost an organization millions of dollars in lost revenue. In 2019,
    the Costco Wholesale website crashed for less than a day on Thanksgiving. Business
    Insider reported that the crash cost the company about $11 million in lost sales.
    This is just one example, but the costs can be enormous both in terms of financial
    and reputational losses.'
  merge: -1
  img_proc: true
- pgno: 273
  md: 'Unlike traditional on-premises systems where performance testing was an essential
    part of the software engineering process, since Salesforce proactively monitors
    its cloud services, we don''t have to worry about whether the system will scale
    or not. The Salesforce Platform has proven itself to be scalable beyond doubt;
    in 2013, a staggering 1.3 billion transactions were executed on the platform every
    day. That number is much higher today; to be fair, the Salesforce Platform will
    perform, but would the custom solution that you built in-house using your developer
    resources perform? (Note that if you are using out-of-the-box features and have
    only lightly customized the system, you will not reap huge benefits from investing
    time and resources in conducting a performance test.)


    Where performance testing matters is when you have custom applications with relatively
    complex business logic running for a large or even a limited number of users.
    In these scenarios, you can get peace of mind by deciding to do performance testing
    to ensure that the application will not crash. You may decide to just focus on
    stress testing the application to understand its limits.


    Another reason you may want to consider performance testing your application is
    to test integrations. In many cases, Salesforce is integrated with several systems,
    especially **Enterprise Resource Planning (ERP)** systems, and, depending on the
    integration, large volumes of data can be pushed to Salesforce. For example, in
    a quick sales type environment, the inventory system may have to push large volumes
    of inventory data into Salesforce every hour. You will want to ensure that Salesforce
    will still perform well when that integration is running and hundreds of users
    are actively using Salesforce. Large volumes of data import or export can also
    strain the system and impact performance. This is another area where you want
    to do a performance test and ensure that the system is capable of handling large
    data loads.


    We must be cognizant of the fact that Salesforce is a multi-tenant environment
    and the resources, including software and hardware, are shared across hundreds
    of clients. Performance testing in general is resource-intensive and involves
    large volumes of data. Therefore, proper care should be taken to ensure that your
    testing will not hog the resources. Salesforce has robust monitoring mechanisms
    in place to ensure fair resource use and can throttle your usage if abnormal activity
    is observed.'
  merge: -1
  img_proc: true
- pgno: 274
  md: 'There are several reasons why Salesforce’s Site Reliability (SR) team may throttle
    the system. Normally, these are applied automatically when a certain threshold
    is exceeded. The most common reasons for triggering a throttle include inefficient
    SOQL queries, a high number of inbound synchronous requests, or even asynchronous
    jobs. Performance testing is another reason why the org may get throttled. Salesforce
    has instituted a process to coordinate performance testing that includes getting
    prior approval from the Salesforce team. Refer to the Performance Test FAQs help
    article that goes into more detail on the roles and responsibilities of both the
    customer and Salesforce for performance testing. You should never, under any circumstances,
    conduct a performance test in a production environment and should always use a
    sandbox, preferably a full sandbox, for performance testing.


    In the next section, we will look at how to approach performance testing on Salesforce
    applications.


    # # Approaching performance testing in Salesforce


    Performance testing must be done in a very well-planned manner, ensuring that
    the scope of the testing is known, and that the goals of the tests are clear.
    Here is an approach that you can use to successfully conduct a performance test.


    # # Planning


    The first thing to do is to plan the performance test. Be very specific on what
    exactly you want to test and measure. Is it the page load times that are being
    tested? Does it include API testing as well? You will get the most value by narrowing
    down your tests to the most critical aspects of your business application. These
    can be pages in the application that run complex business logic and have been
    performing relatively slowly compared to other pages during unit testing or functional
    testing.


    # # Test model


    Once you have identified the requirements in the planning step, the next step
    is to define the test model. The test model defines the multitude of variables
    that will need to be defined and loaded to mimic reality. Let’s discuss some of
    these for more clarity.'
  merge: -1
  img_proc: true
- pgno: 275
  md: 'Certain transactions occur more frequently than others; for example, creating
    an order happens less often than searching for contacts, so your test distribution
    will need to have a good number of scenarios for search testing. Think time is
    another factor and is defined as the time between when the user receives the last
    packet of data to the point that they take the next action on the website, for
    example, clicking Next on the page. If your scripts are running test steps right
    after one another, that wouldn''t be realistic because human users generally take
    a break, process the information, and then proceed to the next step. Therefore,
    it would not be realistic to run automated tests that don''t consider think time
    because your conclusions from the performance testing will not be accurate.


    Usage patterns are another factor that must be considered, taking into account
    when the system is expected to be used the most. For example, visitor numbers
    for Thanksgiving sales are going to be much larger than the number of visitors
    on any other day.


    You should also consider the fact that Salesforce is not a regular website where
    content is served and users interact with it in different ways. Rather, as we
    mentioned earlier, when a LEX page loads, multiple things happen, and merely measuring
    the page load time using regular tools will lead to inaccurate conclusions. That''s
    the reason why Salesforce recommends using EPT as the metric for measuring performance
    for LEX as well as Experience Cloud. The reason is that EPT considers the unique
    underlying architecture of LEX in which individual components can communicate
    with the server. By using EPT, we can be sure that we are getting an accurate
    page load time.


    You can also measure the server side of things with Salesforce, but as mentioned
    in the Conducting performance testing in Salesforce section, that is less important
    because the platform is proactively managed for performance and scalability. If
    you still need to test performance, Shield Event Monitoring provides detailed
    metrics that can be used to gauge performance. If you don''t use this, you can
    also use the Developer Console to get some of these details, but they won''t be
    as detailed as the measures available from Shield Event Monitoring.


    With Salesforce, you will be interested in measuring the throughput and response
    times. Throughput is defined as the number of units of work that the system can
    process in a given amount of time. Examples of throughput are the number of records
    created in a minute, and the number of searches per hour. Response time is defined
    as the amount of time it takes for the system to process the request. Examples
    are the number of milliseconds it takes to generate a document from a document
    generation tool, and the number of milliseconds it takes to load a page.'
  merge: -1
  img_proc: true
- pgno: 276
  md: '# Test plan


    Define the test strategy and plan and include the test cases and tools that will
    be used for the test. The test plan will also need to have details related to
    environments that will be needed for testing and where all the test defects will
    be logged. You also need to ensure that you have sufficient resources to cover
    all aspects of testing, and this should be in the test plan.


    Ensure that you have considered the schedule for when the tests will be performed,
    the scenarios that will be tested, the success criteria, and the responsibilities
    of the resources that will be part of the test. One tip that I find useful is
    to include a one-pager system-level diagram that shows the different systems that
    will be part of the test. These will show your different load-generating servers,
    your Salesforce org, and other systems that may be used in testing, such as a
    visualization system for visualizing test results. This diagram helps in communicating
    with internal stakeholders and Salesforce.


    Don''t go overboard with what needs to be tested, but rather spend the time thinking
    through where you will get the most value from. If you have 10,000 users and a
    mission-critical application being launched that will only be used by 500 concurrent
    users and will grow to a maximum of 1,000 concurrent users in 5 years, there is
    little value in load testing the application by simulating 10,000 concurrent users.
    If, for any reason, you cannot simulate the test by having 500 virtual users,
    you can engage a few users to conduct the tests and then extrapolate the results.


    Salesforce recommends doing performance testing in a full sandbox, which is identical
    to the production environment in terms of data, but the data is point in time,
    meaning that since it is cloned at a given point in time, any changes in production
    after that point are not reflected in the sandbox. Another thing to keep in mind
    is that although the full-copy sandbox is similar to production, it is not identical
    with respect to the infrastructure it is hosted on.


    Once you have finalized your decisions for the tools and the test cases that are
    in your scope, you will then want to develop the test scripts that will be run
    during the testing. Your test cases must take into consideration the realities
    of how actual users will be using the system so that the results are as close
    to reality as possible. The previous test model discussion will help you in determining
    which factors you would need to consider for your test scripts.'
  merge: -1
  img_proc: true
- pgno: 277
  md: '# Test execution


    In this step, you will execute your test scripts and record the results. Make
    sure to coordinate your testing with Salesforce. They will want to know the details
    beforehand, including who the key contact is that Salesforce can reach out to
    in case of any problems, your expected **transactions per second (TPS)**, any
    details about the tests and the tools to be used, and so on. The Salesforce team
    cannot validate your testing strategy or provide debug services for any problems
    that may happen during test execution.


    TPS


    **TPS** is the number of transactions executed per second. For example, if 10,000
    users are running a single (1) business process that has 2 transactions in it
    in 1 hour, then the TPS would be the following:


    10,000 x 1 x 2 = 20,000 per hour


    TPS is 20,000/(60*60) = ~ 5.5 transactions, rounded up to 6


    Salesforce recommends setting that to double for testing purposes, that is, 12
    transactions per second.


    # Distributing results and rectifying problems


    Once you have run through the test scripts, it’s time to distribute the results.
    Aggregate the results for easier understanding and to prevent any misinterpretation
    of the results. If I am not presenting the results to a live audience, I like
    to provide an explanatory note for each table and graph so the reader can review
    the results with a better understanding of the context.


    With the wealth of testing data that you will have, there are going to be areas
    that will need to be improved. We reviewed techniques to improve performance in
    an earlier section. Here, I would suggest using the Pareto principle and focus
    on solving those performance constraints that will reap the biggest benefits.
    For example, if the opportunity page is too slow and takes a long time to load,
    then prioritize that over a Visualforce page that is extremely slow but used by
    a handful of internal users for keeping track of the company’s fleet. Since the
    former is used by the sales team and is directly tied to revenue, solving that
    performance constraint should take priority.'
  merge: -1
  img_proc: true
- pgno: 278
  md: "In the next section, we will discuss some of the key attributes of a successful\
    \ performance test.\n\n# Conducting a successful performance test\n\nIn this section,\
    \ I want to review a few things that you can do to ensure a successful performance\
    \ test. These are not in any specific order and are meant to be used as guiding\
    \ principles, following which you will be able to ensure a comprehensive and successful\
    \ performance test with your Salesforce implementation:\n\n+   **Coordinating\
    \ with Salesforce**: Your test will generate a lot of data and the spike will\
    \ get noticed by the monitoring teams at Salesforce, so it is never too early\
    \ to open a case and start sharing your test plan with them. Not only will this\
    \ increase the chance of you getting your desired dates for testing (yes, you\
    \ present a schedule to Salesforce, but they have the final say in agreeing or\
    \ disagreeing with the dates), but your correspondence with Salesforce can also\
    \ help you to identify any gaps and work on those before you start your testing.\n\
    \n+   **Governor limits**: We know governor limits are in place to ensure that\
    \ no one customer hogs resources, depriving others in the same instance of reasonable\
    \ performance expectations from their Salesforce subscription. Performance testing\
    \ can trigger governor limits, which is a good thing to know before you find that\
    \ out in production, but it also makes the testing complicated. What you want\
    \ to do is check your code and ensure that any potential areas where governor\
    \ limits may get triggered during testing are taken care of before conducting\
    \ your performance test.\n\n+   **LEX**: If you are testing LEX, make sure that\
    \ you have appropriate tools to test the LEX interface. This is because LEX cannot\
    \ be tested headlessly, unlike the Visualforce interface. It will require a tool\
    \ that can test the **GUI (Graphical User Interface**).\n\n> **Headless testing**\n\
    > \n> This is a method of testing where browser UI testing is conducted without\
    \ the *head*, meaning that there is no browser interface, and the tests are run\
    \ behind the scenes. This saves on resources that would otherwise be needed; for\
    \ example, in a real browser window, memory is required to run the operation and\
    \ the more tabs or windows you have open, the more memory you will need. This\
    \ skews upward the results of the performance testing.\n> \n> In LEX, headless\
    \ testing using traditional load testing tools is not possible because a large\
    \ chunk of the work is done by the browser and components can have child components\
    \ that may communicate with the server. New tools such as Flood Element, in conjunction\
    \ with Puppeteer, can now enable headless testing of LEX."
  merge: -1
  img_proc: true
- pgno: 279
  md: '+   * **Experienced resources:** There is a multitude of testing that is done
    in the software industry, and having expertise in one type of testing doesn''t
    necessarily translate into having expertise in other kinds. For example, a test
    lead that has extensive experience in large-scale off-the-shelf ERP (Enterprise
    Resource Planning) systems may not necessarily know how to set up and conduct
    performance testing. Make sure you have the right expertise for the job because
    that plays a significant role in the success of your testing.


    +   * **Load generation:** If you are testing the LEX interface, then, as mentioned
    in this section, you will need a tool that can do that. But for performance testing,
    you will also need to set up load generating servers that will generate the data
    that the tool can test with. Ensure that your load generation setup is compatible
    with the tool and can produce a sufficient load to adequately conduct a performance
    test.


    +   * **Test with different browsers:** When testing the LEX interface, make sure
    you have considered different browsers that users may use in real life. In the
    example I mentioned earlier, an organization may have Internet Explorer as their
    corporate supported browser, but users may be using a different browser, so if
    you test with Internet Explorer only, your test may run and return results, but
    will not be realistic.


    +   * **Multi-tenancy challenges:** Because the environment in which Salesforce
    is run is shared by many customers and Salesforce doesn''t provide statistics
    on benchmark numbers of the environment, your performance results could vary widely
    depending on the time of the test, the load on the instance, and so on. To overcome
    this hurdle, you can run tests at different times, initially with a single user.
    That data can then be averaged to use as a benchmark for full-on performance testing.
    That should give you a good idea of what performance will be like in production.


    When changes or bug fixes are introduced to the environment, make sure to take
    new measurements to ensure that you are comparing your performance testing results
    with the new values.


    We have learned the approach that we can take to performance test our applications
    in Salesforce and what steps we can take to ensure that the performance tests
    we conduct are successful and meet the business goals. It can be a costly and
    time-consuming exercise to set up the resources to conduct performance tests,
    but by following these guidelines, you can reduce the risk of failure and increase
    your chances of success.


    In the next section, we will look at monitoring, the available tools, and what
    to monitor to ensure your org keeps running smoothly.'
  merge: -1
  img_proc: true
- pgno: 280
  md: '# # Monitoring performance


    In this section, we will discuss the tools that we can use to monitor our Salesforce
    orgs proactively. Remember our discussion from *Chapter 3, Understanding Data
    Management*: preventing a problem from happening costs $1 compared to remediating
    it once it has materialized, which costs $10. If the remediation doesn''t happen
    in time and a failure happens, it could cost $100 to fix. In the next section,
    we will discuss what to monitor, and in the subsequent sections, we''ll look at
    some of the tools that are available for monitoring your Salesforce org.


    # ## What to monitor?


    There are tens of benchmarks to measure, but are there a few that we can measure
    that will provide the most value to us? The short answer is yes; you can track
    and monitor performance on the following metrics. For some of these, you will
    need to consult your networking team to suggest the best tools available for the
    job. Be prepared to explain how Salesforce works, its multitenant architecture,
    and the fact that organizations don''t get direct access to the underlying databases
    and application servers:


    +   * **Page load time**: This is an obvious one as usually, users will start
    to complain as they see their pages take longer to load. LEX pages are made up
    of multiple components and when reviewing the results, you would want to see the
    component load sequencing along with the load time. This is important from a diagnostic
    perspective because then you can assess which component is causing the issue.
    The issue can be any number of things, such as network latency, third-party host
    issues, or CDN issues.


    You can run automated tests for Salesforce pages to record the page load time
    (EPT in LEX). There are tools now that can log them, send alerts if they are below
    a certain threshold, and run scheduled reports for trend analysis. These tests
    can provide detailed data on the execution time for each component, the sequences
    in which the component was loaded, and other details about the component.


    +   * **Network**: These tests provide details about the performance of the network
    layer. These details include latency, packet loss, the number of hops, and other
    data such as communication between network devices as the packet travels from
    the source (client''s web page) to the destination, that is, the Salesforce servers.'
  merge: -1
  img_proc: true
- pgno: 281
  md: 'Another aspect of this test is collecting **Hypertext Transfer Protocol (HTTP)**
    performance data, which includes the **Domain Name Service (DNS)** resolve time,
    the time to negotiate **Secured Socket Layer (SSL)** connections, and server response
    codes. For mission-critical applications, monitoring these and getting alerted
    when problems start to arise is very important. For example, a ferry company using
    Salesforce as a crew scheduling system needs to ensure that for legal compliance
    purposes, the ship is staffed with appropriately skilled crew members. Once the
    scheduling is complete, the terminal from where the ship will sail needs to then
    print that and ensure that the crew has checked in and is ready to sail. If they
    have issues connecting with Salesforce due to networking issues such as latency
    and packet loss, that can lead to severe problems, including delaying the sailing
    time and potentially getting hit with penalties in cases where the service is
    considered essential.


    +   - **User experience**: You can also proactively collect performance data from
    the users’ perspective, meaning gathering stats such as wireless signal performance,
    for example. This can also include users from a certain geographical area that
    may be experiencing issues, or it could be a remote location that doesn’t have
    high-speed internet service. This data can then be viewed for any specific locations
    that need attention, or perhaps be shared with the network team so that they can
    take corrective action before users raise any tickets related to performance issues.


    We have learned about the important data points that we can monitor as far as
    performance is concerned. With this knowledge and the tools we have discussed
    in this chapter, an effective strategy can be developed to diagnose and fix performance-related
    issues.


    # ## Summary


    We started the chapter by discussing the importance of why we should be concerned
    with performance in the first place. I hope that this will give you food for thought
    regarding why it’s a bad idea to start developing a solution in Salesforce without
    properly thinking through design and architectural considerations. The Salesforce
    Platform is powerful and allows customers to build applications that shorten the
    software development life cycle time, but that strength turns into a weakness
    when solutions are haphazardly put together.


    Our discussion of the reasons why performance issues happen in the first place
    is hopefully a checklist that you can use to ensure that the applications or integrations
    you are building don’t have those problems. A challenge with performance issues
    is that they show up over time, but knowing why they happen will let you avoid
    most of them in the first place.'
  merge: -1
  img_proc: true
- pgno: 282
