- pgno: 327
  md: '# # 8 Best Practices for General Data Migration


    Data migration is a common task that Salesforce admins, developers, and architects
    are asked to complete. Understanding best practices on how best to approach data
    migration will ensure that costly mistakes are avoided, and the data migration
    is complete and accurate.


    In this chapter, we will discuss some of the tools available to us for data migration
    and their advantages and disadvantages. Most of the time, for large and complex
    data migrations, a third-party tool is used as the standard tools provided by
    Salesforce may be sufficient but not very efficient in terms of effort.


    In the later part of the chapter, we will touch base on the different APIs that
    Salesforce provides in the context of data migration and integration. You will
    learn about the general architecture of the APIs as well as ideal use cases for
    the APIs. Since this book is about data and use cases for large volumes of data
    are becoming more common, I will be discussing the Bulk API in much more detail
    compared to the rest of them.'
  merge: -1
  img_proc: true
- pgno: 328
  md: 'The topics covered in this chapter include the following:


    +   - Assessing data

    +   - The Preparation phase

    +   - The Execution phase

    +   - Tools for loading data into Salesforce

    +   - Understanding APIs


    # Assessing data


    In any business, data is key, and it grows fast, resulting in the use of various
    databases and data stores that are used to securely store that data. Sometimes
    the data is in different formats, and it needs to be worked on to bring it into
    the same format to avoid confusion. But before we go into a deep discussion on
    data, let’s first understand the differences between data migration, conversion,
    and integration:


    +   - **Data migration**: Data migration is the process of moving data from one
    system or application to another. This is usually the result of retiring a system
    to upgrade to a new system that provides improved business functionality. As more
    businesses move from on-premises systems to cloud infrastructure, they realize
    that the data must be moved alongside the application for continued business operations.

    +   - **Data conversion**: Conversion is the process of transforming data from
    one format into another. Each application has its own set of standards it follows
    in terms of the formatting of data, data types, or the length of fields. For example,
    in a legacy system, it is possible for the Stage field in an Opportunity object
    to be a number field. During the conversion process, we are required to map these
    number-based Stage values to the text-based Stage values in Salesforce. This usually
    entails doing some transformation work in a staging area before the data is loaded
    into the destination. To avoid confusing data conversion and migration, it is
    important to understand that the former entails data transformation whereas the
    latter is geared more towards the processes and the tools used to move the data
    from one system to another.'
  merge: -1
  img_proc: true
- pgno: 329
  md: '+   - Data integration: This involves combining data from different sources
    to provide a unified view to the user. For example, a business is using Salesforce
    as its Customer Relationship Management (CRM) tool but Systems, Applications,
    and Products (SAP) as the order fulfillment tool. In the absence of any self-service
    tools where the customer can check the status themselves, sales representatives
    would need to know the order status so they can keep the customer updated. In
    this scenario, as the order goes through the different stages in SAP and the status
    changes, the status can be reflected in Salesforce.


    With the definitions out of the way, let''s look into the need for assessing data
    migration.


    # # Components of a data migration assessment


    Data migration should not merely be a single line item in the project plan because
    it is nuanced and requires careful planning and execution. Having it as a minor
    line item in the project plan is a sure way to run into issues when running the
    migration into the production environment. Rather, it should be treated as a major
    component of any project with its own detailed schedule, tasks, and dependencies.


    With a proper assessment, you can gauge the landscape and provide realistic time
    and budgetary estimates that can ensure a quality data migration. Let''s discuss
    some of the integral components of a sound data migration assessment:


    +   - Volume of data: This is usually the first thing that most project teams
    think about during data migration discussions. It is an important consideration
    since migrating 50,000 records will require a different approach than migrating
    100 million records. For example, the choice of APIs, whether to use the Bulk
    or the REST API, will make more sense for the latter use case (migrating 100 million
    records) rather than the former.


    +   - Type of data: Another consideration is the type and format of data that
    you are planning to migrate. For example, migrating leads from the legacy system
    will be much less work than migrating accounts, contacts, opportunities, and products.
    This is because of the potential relationships between these objects in the legacy
    system and the different data types and formats of the fields. More effort will
    be required if the Stage values, for example, are different in the legacy system
    than in Salesforce.'
  merge: -1
  img_proc: true
- pgno: 330
  md: '+   **Number of systems**: What is the number of systems involved in the migration
    – are we migrating data from one source system or multiple source systems into
    Salesforce? For example, in a consolidation type data migration, you could have
    Oracle NetSuite and/or Microsoft Dynamics as the source systems, each with its
    own data types and standards. Migrating this into Salesforce will be much more
    involved than, say, simply migrating data from Oracle NetSuite. This may also
    necessitate that a staging database is introduced in the landscape where de-duplication
    and transformation can take place before loading the data into Salesforce.


    +   **Privacy**: With new privacy regulations getting introduced around the world
    and existing ones getting revised, what are the considerations for data migration
    during the preparation phase. Can offshore teams have access to it? Where should
    the infrastructure used during data migration be located – can it be in a country
    that may not have very robust privacy laws or doesn’t enforce them effectively?
    These are all considerations that could have an impact on the duration as well
    as the cost of the data migration project. Understanding this and any restrictions
    in accessing the data, whether they’re based on the client requirements or for
    compliance reasons, will help you plan for and address these requirements properly.


    +   **Data retention**: Not all data from the legacy system may need to be brought
    over into Salesforce but the business may have requirements around data retention
    for compliance purposes. Working with architects and other stakeholders, the project
    team would need to provide solutions to identify the optimal ways to stay in compliance
    and provide continued data access to the business.


    +   **Resource availability**: Data migration is never an exercise in isolation
    where the data migration team goes away, works on the project, and returns with
    a finished product that when executed in production will flawlessly migrate data.
    It must involve business resources who are intimately familiar with the data and
    can guide the team and validate the data migration as well as the production run.
    Understanding upfront what the business resource constraints are can help in identifying
    potential risks and provide the opportunity to put in place an effective mitigation
    strategy.


    +   **Current landscape**: This involves assessing whether all systems under consideration
    are in the cloud or on-premises. Are there any special considerations with respect
    to access to these systems, and where are the regular planned outage schedules?
    On-premises systems usually require more configuration because of the need to
    reach into the internal network. This would also include coordination with any
    third-party vendor resources whose assistance may be required during the migration.'
  merge: -1
  img_proc: true
- pgno: 331
  md: '+   * **Communication**: A good migration project will always have a solid
    communication plan that considers the needs of different stakeholders and how
    they like to be communicated. Depending on the scope, complexity, and the number
    of stakeholders in the data migration project, the communication plan can be very
    extensive. That shouldn’t deter you from creating a well-thought-out communication
    plan as it provides a roadmap of how other stakeholders will be kept up to date
    and what is expected of them during the project.


    +   * **Document data transformations**: Once you have identified your source
    data and mapped it field by field to the destination fields, ensure that this
    is sufficiently documented. Ensure that you have mapped both the tables from the
    source to objects in Salesforce and the fields from the source table to fields
    in Salesforce. This document becomes a critical document for any issues down the
    road that may be due to incorrect field mappings. It also forms the basis for
    any transformations that are required and can be used by the testing team to validate
    your test loads.


    +   * **Recurring exercise**: It should be made clear right from the get-go that
    data migration is a recurring exercise. It means that during the execution phase,
    multiple iterations will need to be conducted to get to a stage where the team
    feels comfortable with pulling the trigger in the production environment.


    +   * **Data quality**: Data quality issues are a common problem in today’s systems
    and hardly any system is immune from it. When migrating data into Salesforce,
    consider the data quality issue of the source systems. This will help you understand
    how much effort will be required to cleanse the data before it can be loaded into
    Salesforce. Since data is used for decision-making and, among other things, automating
    business processes, the data quality of the source systems is of utmost importance
    during this assessment phase.


    The preceding discussion is not intended to be exhaustive but lists some of the
    more critical aspects of the assessment phase. Each data migration project is
    unique and properly assessing the requirements and understanding the variables
    will increase your chances of successful data migration.


    Let''s now review the preparation phase of data migration.


    # # The Preparation phase


    In this phase, you are prepping everything that’s needed for the next phase, which
    is the execution phase. Armed with the trove of information that was gathered
    in the previous phase, you are set to act on it and prep for successful data migration.


    Let''s discuss the best practices that apply to this phase.'
  merge: -1
  img_proc: true
- pgno: 332
  md: '# # Best practices


    You have developed a sound understanding of the current landscape along with understanding
    the type of data that is in scope, the source systems and their constraints, and
    the business requirements of the data migration. Now it''s time to put all of
    this into action by following the best practices described as follows:


    +   **Analysis**: Carefully analyze the result of the exercise from the assessment
    phase. Seemingly minor details that are skipped during analysis can cause a lot
    of rework sometimes down the road. For example, assuming that a legacy system
    has good data quality; without vetting this assumption with the users or sampling
    the data to validate it can cause the data cleansing exercise to be a prolonged
    and expensive effort.


    +   **Set up data migration environments and tools**: Based on the requirements
    gathered so far and the analysis performed, set up the environment and the tools
    that are to be used to migrate the data. This will include any staging databases,
    data cleansing tools, de-duplication tools, sandboxes, and so on.


    +   **Test plan**: This is a critical aspect of the preparation phase because
    you want to have a clear idea of what is going to be tested (the scope of the
    test and the use cases to test), how it will be tested, and where (tools for testing
    and applicable sandbox environments), who will do the testing, and what the dependencies
    for testing are.


    +   **External IDs**: These are your best friends, so make use of them for easier
    data migrations. External IDs provide not only a method to keep track of records
    from the source system but also the ability to leverage the Upsert functionality
    in Salesforce.


    +   **Respect the loading sequence of objects**: This pertains to ensuring that
    your parent object is loaded first before the child object can be loaded. This
    means that if you are using spreadsheets to transform data as a staging area,
    you need to load accounts before contacts or opportunity records can be loaded.


    +   **Hardcoding IDs**: Record IDs in Salesforce change by environment and therefore,
    you should avoid using any hardcoded values in your loads. For example, a record
    type ID for an opportunity in a sandbox will be different from the ID in the production
    instance. If you must store IDs, have a configuration type file that is referenced
    during the runs. This gives you the ability to update the ID once in a centralized
    place that is then referenceable for all runs. Otherwise, you would need to update
    the record IDs for individual rows as you move through each environment.'
  merge: -1
  img_proc: true
- pgno: 333
  md: '+   - **Record ownership**: Every record in Salesforce has an owner and this
    must be kept in mind when prepping for data loads. The system will not migrate
    data if the record owner is missing or invalid. Your legacy system may have records
    whose owners are ex-employees and are inactive in the source system. You will
    want to ensure that if those records are in scope for migration, appropriate record
    owner names are provided to avoid the records erroring out.


    +   - **Salesforce setup**: Since the next phase will entail running the migration,
    ensure that the appropriate setup has been completed in Salesforce. This will
    include things such as role hierarchy, profiles, permission sets, page layouts,
    and the definition of picklist values. This is an important step. Otherwise, when
    you run your test loads, you will get bogged down by errors caused not by the
    data migration process but by an incomplete setup in the destination org.


    +   - **Updates to sandboxes**: As you work on your project, the day-to-day business
    operations continue, which means that continuous changes in the form of break
    fixes and enhancements should be made, and other projects will keep getting applied
    to the production environment. Make sure to take these into account and work with
    your Salesforce team to coordinate that changes being applied to the production
    environment also get applied to the project sandboxes. This will prevent any surprises
    later due to different configurations and code bases when you are running dry
    runs in a shared environment such as a UAT sandbox.


    +   - **Ability to disable business logic**: You have the option to let your business
    logic get applied to the data as it’s getting loaded in the destination, but this
    is not recommended. The best practice is to transform your data and apply any
    business rules outside of Salesforce and load the finalized dataset into Salesforce.
    This helps with performance and reduces the chances of running into data-related
    issues. With this approach, though, you would want to ensure that your declarative,
    as well as code-based, automation logic has built-in disable flags that can easily
    be disabled at the time of the load. These flags should be built as part of the
    design when these features are introduced but if they are not there, assess whether
    it would make sense to include them before running the production run.


    +   - **Go directly to the source**: Whenever possible, read data directly from
    the source. This is because each intermediary system has its own way of formatting
    and storing data, and this could lead to data loss while it passes through this
    intermediary layer. For example, when data is exported to Microsoft Excel from
    the source system, text fields with numbers may get converted to number fields
    with decimals or, sometimes, leading zeros in a column may get dropped. This can
    lead to errors when the data is loaded into Salesforce.'
  merge: -1
  img_proc: true
- pgno: 334
  md: '+   - **Error handling**: When pulling data directly from a source database,
    it makes rerunning the migration process much easier if, say, the IDs of the new
    records in Salesforce are written back to the source table. That way, in the next
    run, you can simply filter on the records that don''t have the Salesforce ID column
    populated and rerun them. Generally speaking, regardless of what the source of
    the data is, ensure that you have a plan to handle errors and the ability to retry
    the runs because it is inevitable that retries will be needed.


    +   - **Backup the data**: At this phase, you will also want to make sure that
    backups of the data are in place and tested procedures are already in place should
    a data restore be required. Don''t underestimate this step as nothing is worse
    than losing customer data even if it''s not your fault. Make sure that the client
    is aware and has proper backup processes, and has tested those backups in restore
    scenarios as well.


    My experience is that this is often the most rushed phase because we want to get
    to the execution phase as soon as we can. Make sure that you have enough time
    allocated for this phase as rushing this phase leads to issues and doing work
    again.


    In the next section, we will look at the meat of any data migration project, the
    execution phase.


    # # The Execution phase


    This is the phase where the rubber meets the road and all the work done in the
    previous phase gets tested. By this phase, you will have achieved a good understanding
    of the scope, the type of data, assumptions, and constraints you are dealing with.
    Let''s discuss the best practices that can be applied in this phase.


    # # Best practices


    Your mapping document is ready and the tool that you will use along with any staging
    databases are all set and ready for that moment of truth. You are eager to click
    the **Run** button and see how the first dry run with some preliminary data goes.
    To be clear, the execution phase here refers to running your data loads in a sandbox
    environment and is not limited to production runs. We will discuss specific production
    environment runs in a later section. Here are some best practices that will increase
    your chances of success with this phase:


    +   - **Start small**: Start with small loads and iron out any issues before trying
    large loads. This keeps the effort required to re-validate the batch reasonable
    as you go and refine your code or tweak the configuration in the migration tool
    to fix any issues.'
  merge: -1
  img_proc: true
- pgno: 335
  md: '+   - Follow the steps: By now, you should have a deployment document that
    lists the steps required to run the dry runs along with notes on any additional
    steps needed for the production run. As you test and further tweak your code and
    the migration too, make sure that the document is up to date. Follow the steps
    in this document every time you are running a dry run. This will ensure that the
    document is up to date and develops the document as you get ready for the final
    full load for UAT.


    +   - Duplicate rules: Disable any duplicate management rules that you have set
    up in Salesforce. These could be out-of-the-box Salesforce functionality you are
    using or if you are using a third-party solution, rules that have been set up
    by that tool. You don''t want your loads to error out because of duplicate rules
    and any such concerns should be handled outside of Salesforce before the data
    gets loaded into it.


    +   - Disable automations: Ensure that you have disabled any relevant automations
    such as triggers, Process Builder, and workflows before you run your loads. Again,
    any type of transformation to the data should already have been done outside of
    Salesforce before loading into the system.


    As part of the execution phase, there are some specific best practices regarding
    sandbox testing. Let''s review those in the next section.


    # Sandbox testing


    No matter how seemingly _simple_ a load looks, I never recommend running it directly
    in a production environment. Always run it in a sandbox first and get a _feel_
    for how it may run in production and always validate the results. Here are some
    best practices related to sandbox testing:


    +   - Restorable sandboxes: Data migration is a recurring process, and you will
    find that you are running multiple test loads to the point you are ready for UAT
    testing. Setting up a sandbox takes time, especially when considering that Salesforce
    has limits on how often certain types of sandboxes can be refreshed. For example,
    if you are using a Developer Pro org, you can refresh it on alternate days. You
    will be constrained if you need to fix and rerun a test load on the same day.


    To avoid running into these types of constraints and to save time by avoiding
    having to set up the environment again, use a data backup tool that can easily
    restore data as well. This will also eliminate the need to rely on an admin with
    a system administrator in production to do a sandbox refresh. With your admin
    credentials (assuming you have been granted those), you can easily kick off the
    restore and have a working environment available to you within a short period.'
  merge: -1
  img_proc: true
- pgno: 336
  md: '+   • **Full-copy sandbox**: When you are ready for UAT and to have the business
    testing team validate your setup/code, ensure that you have a full-copy sandbox
    set up for this purpose. Running a full migration in this type of sandbox will
    give some very good data, for example, how long it would take to run the migration
    in the production environment. This is because full-copy sandboxes have similar
    (not the same) hardware and results extrapolated are typically valid for production
    as well.


    Another benefit is that full-copy sandboxes have the same data as a production
    environment, so you are working with an environment that very closely resembles
    a production environment. Of course, if this is a greenfield implementation, then
    the production environment will not have any data, but in the case of a brownfield
    implementation, this can be an advantage.


    To re-iterate, sandbox testing is a must regardless of how simple or complex the
    data migration is. For simpler migrations, it seems like an extraneous step, but
    I think it’s worth the time and the effort rather than going back and trying to
    restore data in the production org in the case of a brownfield org.


    Let’s now review best practices related to the production run.


    # Production run


    You have conducted multiple dry runs and had business testing validate your results
    in a full cycle UAT. It’s time to press the trigger and run the data migration
    in the production environment. Some of the best practices for this phase include
    the following:


    +   • **Production freeze**: Ensure that you have communicated to other stakeholders
    that there should be a change freeze for metadata in the production environment.
    This is to avoid running into any issues due to enhancements that were not applied
    to the sandbox environments. Break-fixes cannot be avoided but if there are any
    that are not a high priority, it is recommended to postpone them until you have
    completely migrated your data.


    A change freeze should usually kick in when you move to the full-copy environment
    and are conducting UAT testing there. To avoid holding up other projects or teams,
    try to minimize the time between the change freeze and the production run of your
    migration. I should mention that for simpler migrations, such extensive measures
    may not be needed but nonetheless, it’s a good practice to follow to avoid any
    unexpected issues.'
  merge: -1
  img_proc: true
- pgno: 337
  md: '+   • **Backup data**: Back up the data before you run your final production
    run. Ideally, you will have baked in a rollback process if the production run
    fails but in cases where that''s not possible, due to the tool or for other reasons,
    it makes sense to back up your data before changing any data en masse in production.
    To be clear, even if you have a rollback mechanism built into your code, it is
    still a good practice to make a backup of the production data.


    +   • **Timing of the run**: Another factor to consider is the timing of the run.
    You will have figured out the total time it will take for the migration process
    when you ran it in the full-copy sandbox. Taking that into account, you would
    want to minimize any disruption to business users and reduce the amount of time
    they would need to not use Salesforce. This is not a problem in a greenfield org
    but is a critical consideration for global brownfield orgs that have users spread
    out in multiple time zones. In those situations, there is no ideal outage time.
    You will want to pick a time where the disruption is minimal for users across
    the different time zones.


    +   • **Validation**: Once the migration process has successfully been completed
    in the production environment, ensure that you have business users who can validate
    the data loaded. This can be as varied as sample testing a few records to pre-selecting
    more strategic records (that is, the latest accounts) along with other methods
    of validating that data. Ensure that the business team is available and has a
    clear understanding of what to do when they are called to validate the load.


    We have looked at the different phases of a data migration project and the best
    practices to use for each phase. Now let’s look at some of the tools available
    that could assist with the data migration process itself.


    # # Tools for loading data into Salesforce


    Tools are just that, tools, and there are a number of them that can be used to
    get the job done. Having the right tool for the job will make it smoother and
    easier to get the job done whereas using the wrong tool will lead to issues and
    will prolong the job. For example, using the standard Data Import Wizard (DIW),
    which is part of the standard CRM, for a complex data migration job that requires
    extensive transformation and error handling will not work and you will hit the
    limits of DIW very quickly.


    These days, many third-party tools are available that have advanced capabilities
    such as a retry mechanism, error logging, and others. Modern middleware products
    usually have an Extract, Transform, Load (ETL) component to them and can be used
    to migrate data. In this section, however, we will discuss the standard DIW and
    the Data loader.'
  merge: -1
  img_proc: true
- pgno: 338
  md: '# Data Import Wizard (DIW)


    Salesforce provides a user interface-based tool called Data Import Wizard to import
    data. This tool is accessed through the Setup menu. Some features and limitations
    of DIW include the following:


    +   - It can be used for accounts, contacts, leads, and custom objects.

    +   - It imports up to 50,000 records at a time.

    +   - It cannot be used to automate the import process.

    +   - A limited number of objects are supported, for example, `Product2` object
    records cannot be imported using `DIW`.

    +   - It cannot be used to connect directly with the source system to query data.

    +   - It uses Microsoft Excel **Comma-Separated Values (CSV)** files as the input
    for import jobs.


    **CSV files**


    When importing CSV files with special characters, you may see the data imported
    but with gibberish characters. This is due to the way the file was encoded at
    the time of saving as a CSV. When saving the file using Microsoft Excel, the encoding
    is set to the machine-specific ANSI encoding setting. You could also open the
    file in a text editor and then save it with the CSV extension with the encoding
    set to UTF-8.


    As noted, you will need to split your loads into 50,000 records each as DIW is
    limited, not to mention the limited number of objects it can support. DIW is ideal
    for use cases where end users need access to load data into Salesforce and need
    an intuitive way to do that. For more complex use cases, it’s not used or considered.


    # Salesforce Data loader


    This is a client application tool that can be used to import a large number of
    records. It also supports records from files or database connections. Some of
    the features and limitations of the Data loader are the following:


    +   - The client application needs to be downloaded and installed.

    +   - It can import up to 5 million records at a time.

    +   - It supports files or database connections for importing data.

    +   - It can be accessed through the user interface or command line.'
  merge: -1
  img_proc: true
- pgno: 339
  md: "+   - It supports the automation of the import process.\n+   - It can be used\
    \ to load import data into objects that DIW does not support.\n+   - It uses the\
    \ SOAP API to process records. It also supports the use of the Bulk API for faster\
    \ processing.\n\nSalesforce Data loader can be used to query data from other sources\
    \ but only in batch mode, which is further limited by its support for Windows\
    \ only. Non-Windows users cannot use batch mode and make use of some of the advanced\
    \ features of the Data loader.\n\n> **Java Software Development Kit (SDK)**\n\
    > \n> For Data loader to work, Java is required, and it used to be bundled with\
    \ Data loader. Salesforce has stopped doing that and you need to now install the\
    \ open source Zulu OpenJDK to ensure Data loader works. Here is a link that will\
    \ help you install the JDK: https://help.salesforce.com/articleView?id=installing_the_data_loader.htm&type=5.\n\
    \nFor simpler data migrations, Data loader can be a viable option but anything\
    \ involving multiple objects that are related via parent-child or lookup can be\
    \ a hassle as the records need to be manually linked. For this reason, and with\
    \ the availability of more advanced tools, Data loader is not used for complex\
    \ data migrations.\n\nIn the next section, we will review the backbone of data\
    \ migrations, that is, APIs that Salesforce provides. There are multiple options\
    \ for which one to choose and each in its own right is suitable for certain use\
    \ cases more than other APIs.\n\n# Understanding APIs\n\nA salient feature of\
    \ Salesforce is that it takes an API-first approach. What that means is that Salesforce\
    \ internal teams focus on building a rich set of functionalities into the API\
    \ before designing and developing the user interface. The reason this is important\
    \ is that it gives Salesforce customers the flexibility in using a custom-developed\
    \ user interface should they desire. This is pretty common in Salesforce Experience\
    \ Cloud where some customers tend to use the standard templates provided by Salesforce\
    \ to provide a self-service experience to their customers and partners, whereas\
    \ others build entirely custom frontends that are powered by Salesforce user interfaces."
  merge: -1
  img_proc: true
- pgno: 340
  md: 'Salesforce provides a variety of APIs meant for different purposes, such as
    manipulating page layouts, deploying code, querying Einstein Analytics data, or
    general-purpose APIs that are used to manipulate data. In this section, we will
    discuss the four main APIs that pertain to data manipulation and are considered
    the core data APIs. I will be showing detailed steps on how to use the SOAP and
    REST APIs because they are more commonly used than the Bulk or Streaming APIs.


    # # The SOAP API


    The **Simple Object Access Protocol (SOAP)** is an industry-wide standard protocol
    used for data transfers. It uses **Web Services Description Language (WSDL)**
    to define parameters to access data and supports the XML format. The WSDL is used
    as a formal contract between the API and the consumer; this API is ideal to use
    for server-to-server integrations.


    Salesforce provides two types of WSDLs to use with the SOAP API – Enterprise WSDL
    and Partner WSDL. The former is tightly tied to the configuration of the org and
    should be used for a single Salesforce org. The latter is more generic and can
    be used to integrate with multiple Salesforce orgs. *Figure 8.1* shows how an
    external app can access Salesforce resources using the SOAP:


    ![](img/782d45700e093b3d82b348c0ccc8ccba_340_0.png)


    Figure 8.1 – Critical steps to access SOAP resources in Salesforce'
  merge: -1
  img_proc: true
- pgno: 341
  md: 'As seen in *Figure 8.1*, the WSDL is consumed on the client side and methods
    in the WSDL are then used to log in and retrieve the session ID. Once the session
    has been established, other methods can be called to query data or run DML statements
    in Salesforce.


    # The Bulk API


    This is a RESTful API that is used to query and load large volumes of data. The
    Bulk API is asynchronous, meaning that data processing only happens when system
    resources are available. Supported data formats for the Bulk API include CSV,
    XML, and JSON or binary attachment for ingest operations. For querying data out
    of Salesforce in bulk, bulk queries can be used that can retrieve up to 15 GB
    of data.


    Bulk jobs can be processed in serial or parallel mode. Serial mode is not optimized
    because a single batch is processed at a time but operations in parallel mode
    (parallelism) are optimized, meaning that more than one batch can be processed
    at any given time. You may think that the more parallelism you have, the more
    throughput you will get, but that may not be the case. In fact, having a higher
    level of parallelism can backfire and slow down the process if it''s not architected
    properly. Things such as the tool being used or how well-tuned the code that''s
    running the process is can also affect parallelism.


    # Designing a Bulk API solution


    Although DIW uses the Bulk API behind the scenes, there is no user interface provided
    by Salesforce to work with the API. You are expected to write your own client
    program to work with it. This client can be a C++ or Java program, or in another
    programming language that will then call the Bulk API in Salesforce.'
  merge: -1
  img_proc: true
- pgno: 342
  md: 'The client creates a Salesforce Bulk API job and then batches are created within
    that job so the data can be processed by Salesforce servers in an asynchronous
    mode. The client can check for the job status using methods provided with the
    API. The client application can also retrieve results as batches get completed
    but the status can also be checked using the user interface on the Monitor Bulk
    Data Load Jobs page. Figure 8.2 shows the major steps of how a Bulk API operation
    is processed:


    ![](img/782d45700e093b3d82b348c0ccc8ccba_342_0.png)


    Figure 8.2 – A typical Bulk API operation


    Figure 8.2 shows the major steps for using the Bulk API. A job is created, which
    then has batches created in it. These batches are processed asynchronously by
    Salesforce and the results are saved. These results can be retrieved by the client
    application to check on batch stastuses.


    When deleting data using APIs, a soft delete happens, which means the data remains
    in the system available to be recovered, if needed. The Bulk API is the only API
    that can run a hard delete operation, which permanently deletes data from the
    system. Another consideration is that the Bulk API has its own governor limits,
    which are different from other APIs.'
  merge: -1
  img_proc: true
- pgno: 343
  md: 'The Bulk API can also be used to query large volumes of data and sometimes
    there is a need to query all data from an object. A typical SOQL query will most
    likely error out because of governor limits but the Bulk API can be used for such
    a purpose. The Bulk API also has a functionality called **PK (Primary Key)** chunking,
    which allows querying data from objects in chunks based on sequential primary
    key IDs. You can specify the record chunk size (the default is 100,000 records)
    on the job request header and the platform will automatically run the query and
    return results for each chunk.


    It should also be noted that sharing recalculations and Bulk API jobs share the
    same pool of asynchronous processing threads. If both are running at the same
    time, it can take a long time for the jobs to complete. Keep this in mind during
    the design phase as you may need to use the deferred sharing rule calculations
    feature to avoid any conflicts with the Bulk API process.


    # Lock contention


    Record locking happens when an operation is in progress and has locked the record
    for data integrity purposes. Bulk API jobs, like other APIs that are used to process
    data, are prone to locking issues and can cause job failures or reduced throughput.


    > **Throughput**

    > This is a measure of performance and measures how many records can be processed
    per second. The higher the throughput, the better the performance of the job is
    going to be.


    There are several reasons why lock contentions may happen and those are discussed
    as follows:


    +   • **Master-detail relationships**: When an object is in a master-detail relationship
    with another object, Salesforce locks the master object to ensure referential
    integrity. If detail records (referring to the same master record) are inserted
    in parallel processing in different batches, the insert operation would fail due
    to multiple threads attempting to lock the master record. Locks on this type of
    relationship can be prevented by ordering the detailed records that belong to
    the same master records in a single batch. This is because, during parallel processing,
    multiple batches may try to lock the same master record, thereby causing lock
    contention.'
  merge: -1
  img_proc: true
- pgno: 344
  md: "Referential integrity\nReferential integrity refers to the consistency of data\
    \ within a relationship, for example, an invoice line-item object would have a\
    \ master-child relationship with the invoice object being the master. Invoice\
    \ line items each refer to the invoice record 12345. If the record 12345 was deleted,\
    \ the five invoice line items would become orphaned. Referential integrity prevents\
    \ these types of scenarios from occurring.\n\n+   Lookup relationships: These\
    \ are very similar to master-detail relationships in that if the record being\
    \ looked up to (the target) is attempted to be locked, a lock contention may arise\
    \ causing the insertion/update to fail. Use the same aforementioned techniques\
    \ described for master-detail to avoid lock contention.\n+   \n+   When a lookup\
    \ is defined, you have the option to select either one of the following:\n+  \
    \ i) Clear the value of this field. You can’t choose this option if you make this\
    \ field required\n+   \n+   ii) Don’t allow deletion of the lookup record that’s\
    \ part of a lookup relationship\n+   \n+   This may seem trivial but during large\
    \ data loads, what you have selected on your lookup definition may cause loads\
    \ to fail. This is because Salesforce treats the two differently. When the former\
    \ is selected, that is, Clear the value of this field. You can’t choose this option\
    \ if you make this field required, Salesforce just ensures that the lookup value\
    \ on the target object exists. When the latter is selected, it locks the target\
    \ lookup record, possibly leading to a lock contention situation.\n\n+   Triggers:\
    \ When loading records that fire a trigger, the trigger logic may cause the system\
    \ to attempt a lock on a record other than the trigger-originating record and\
    \ cause lock contention. To avoid lock contention, disable triggers or have logic\
    \ in your trigger code to avoid such situations.\n\n+   Workflow rules: Salesforce\
    \ locks the records when a workflow rule triggers a field update and if multiple\
    \ threads are attempting to lock the same record, lock exceptions can happen;\
    \ for example, a workflow rule that’s attempting to update the same parent record\
    \ in multiple threads will cause lock contention. To avoid these locks, disable\
    \ the workflows before loading."
  merge: -1
  img_proc: true
- pgno: 345
  md: '+   - Group membership locks: There are a few operations that cause an org-wide
    lock. This means that you cannot use parallel processing in this case because
    once a lock has been acquired on the group membership tables, no other updates
    can be made unless the lock is released. Some of these operations are as follows:

    +       - Adding users who are assigned to roles

    +       - Changing user roles

    +       - Adding a role to the role hierarchy or territory to the territory hierarchy

    +       - Adding/removing members from the public or personal groups, roles, territories,
    and queues

    +       - Changing the owner of an account to a new owner while this new owner
    has a different role than the original account record owner. This applies to accounts
    that have a community role or portal roles associated with them


    Ensure that your code executes in such a way that the lock on group membership
    objects is minimal and other code is not causing the locks to be prolonged. When
    group membership type operations are executing, the run must be in serial mode
    due to the org-wide record locking when these operations are run.


    +   - Overlapping runs: Multiple running jobs that overlap can cause unintended
    lock contention on objects, code, and workflow rules that Salesforce runs as part
    of the job. Ensure that there is sufficient time between jobs so that the previous
    one has run completely before the subsequent job.


    +   - Roll-up summary fields: When records on the detail side are being updated,
    the master record is also locked to ensure that the roll-up summary is updated.
    This can cause lock contention and, if possible, these should be removed before
    loading data. If that is not possible, then consider using summary reporting on
    the detail object if it has all the data that''s required or a report that spans
    the master and detail objects. If that is not an option, then order your master
    object records and avoid having the same master record in multiple batches.


    As seen, there are many considerations for efficiently using the Bulk API compared
    to the other APIs and, usually, the complexities associated with the Bulk API
    are abstracted by third-party applications that leverage the API. Nonetheless,
    the Bulk API is the API of choice for data migrations and integrations when large
    volumes of data are under consideration.'
  merge: -1
  img_proc: true
- pgno: 346
  md: '# The REST API


    The REST API is a web services API that can be used to interact with data in Salesforce.
    It is considered a lightweight API that uses the request and response framework
    and is widely used for web and mobile applications.


    This API uses the same underlying Salesforce data model for accessing data that
    the SOAP API uses and unlike the Bulk API (also RESTful based), which has its
    own limits, the limits for the REST API are the same as the SOAP API.


    REST API operations are performed by interacting with Uniform Resource Identifiers
    (URIs) that access Hypertext Transfer Protocol (HTTP) methods such as GET, HEAD,
    and POST. You can use these URLs to perform queries, update records, or run describe
    operations on objects. Figure 8.3 shows the critical steps of how a REST-based
    application interacts and accesses resources within Salesforce:


    ![](img/782d45700e093b3d82b348c0ccc8ccba_346_0.png)


    Figure 8.3 – Critical steps to access REST resources using an external application


    The REST API is a widely used API that is secure and is used for lightweight applications
    that are not data intensive. When used with OAuth as the authentication mechanism,
    it is more secure than SOAP as it eliminates the need to store any credentials
    and the token in the client app.


    # The Streaming API


    The Streaming API is used for custom integrations or near real-time applications
    and is not meant for data migrations. This API is based on Event-Driven Architecture
    (EDA), meaning that data updates are published to a messaging bus. Subscribers
    to those updates can consume the event on their end. This approach is different
    than the SOAP or REST API approaches where data is pulled from the system.'
  merge: -1
  img_proc: true
- pgno: 347
  md: 'In EDA, messages or events are published to a central location; in this case,
    it’s the **Enterprise Messaging Bus (EMS)** and systems that are interested in
    those events subscribe to it. Whenever an event is published, it is published
    on the bus and all consumers that subscribed to it can use it. This type of architecture
    decouples systems that produce these events from systems that consume these events,
    leading to a scalable architecture. Figure 8.4 shows how EDA works:


    ![](img/782d45700e093b3d82b348c0ccc8ccba_347_0.png)


    Figure 8.4 – Event-Driven Architecture


    The enterprise messaging bus is part of the technology on which the Streaming
    API is based. This is called **CometD** and uses the messaging bus to publish
    and subscribe to events. The Streaming API has multiple flavors; two of the most
    commonly used ones are **Platform Events** and **Change Data Capture (CDC)**.
    The earlier flavors of the Streaming API were **Generic** and **PushTopic**, both
    of which required code for publishing or subscribing to an event. With Platform
    Events and CDC, there is more flexibility as they are supported both by code and
    other declarative features in Salesforce, such as Salesforce Flow or Process Builder.'
  merge: -1
  img_proc: true
- pgno: 348
  md: '**CometD**


    Visit the CometD website at CometD.org to learn about the features and detailed
    documentation about CometD.


    In this section, we reviewed the four most commonly used APIs from a data perspective,
    learning about optimal use cases for them and how they work. We discussed in detail
    the Bulk API because that is the API of choice when dealing with large volumes
    of data, a topic that we covered extensively in *Chapter 7, Working with Large
    Volumes of Data*.


    # # Summary


    Data migration is an exciting topic because regardless of whether you are migrating
    1,000 records or 1,000,000 records, there are certain things that you must keep
    in mind for smooth data migration. Best practices related to the different phases
    of data migration that you learned will help you to conduct a successful migration
    without running into any major obstacles. The key thing is to spend time doing
    proper analysis before jumping into the execution phase of the data migration.
    That will save you a lot of headaches and wasted effort down the road.


    You also learned about the standard Salesforce tools available to us for data
    migration along with their constraints. As mentioned earlier, for simple migrations,
    these may be sufficient, but for complex migrations, more sophisticated third-party
    tools are available that make the job much easier and smoother.


    We concluded the chapter by discussing APIs that are provided by Salesforce. Although
    there are a lot of other APIs that Salesforce provides, we covered the ones that
    are pertinent to data migrations and integrations. You learned about the general
    architecture of each API and how to use them, alongside a detailed discussion
    on the Bulk API. We also covered EDA during our review of the Streaming API and
    how the Streaming API supports scalability and near real-time integrations.


    Congratulations on getting through the last chapter! I hope that you had fun reading
    it while also learning new concepts and techniques that you can use to add value
    to your organization.'
  merge: -1
  img_proc: true
- pgno: 349
  md: "# Questions\n\n+   1. **Precision Printing (PP) has recently acquired another\
    \ company and is looking to migrate CRM data into their main Salesforce instance\
    \ and decommission the legacy CRM system. The legacy system has 7 million records.\
    \ What API should be used to load this data into Salesforce? (Select one answer)**\n\
    +   \n+      a) REST\n+      b) Streaming\n+      c) SOAP\n+      d) Bulk\n\n\
    +   2. **The Salesforce team at Centauri Logistics is looking to integrate an\
    \ external text messaging-based notification system with Salesforce. A text message\
    \ will be sent to the customer as the shipment is received at a location. Drivers\
    \ scan a location-specific barcode as they arrive at the location. The team anticipates\
    \ other systems in the future may be interested in this data as well. Which API\
    \ should be used for this integration? (Select one answer)**\n+   \n+      a)\
    \ Streaming\n+      b) Bulk\n+      c) SOAP\n+      d) Metadata\n\n+   3. **The\
    \ team at PP has been hard at work and has designed a solution to load 7 million\
    \ records into Salesforce. They start the run but immediately run into failed\
    \ records with locking errors. The team is confused because the API is being run\
    \ in parallel mode. What can the data architect suggest to fix these errors? (Select\
    \ one answer)**\n+   \n+      a) They should run the load in serial mode.\n+ \
    \     b) They should ensure that parent and child records are in the same batch.\n\
    +      c) They should switch over to use the SOAP API.\n+      d) They should\
    \ open a case with Salesforce requesting that support allocates more CPU and memory\
    \ resources to the server."
  merge: -1
