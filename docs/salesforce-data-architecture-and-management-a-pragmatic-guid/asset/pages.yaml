    We’ve learned that although, individually, the filter returns a lower number of
    records

    (200,000 and 300,000, respectively), when combined, they exceed the selectivity
    threshold

    limit and therefore the query is not considered selective.


    In the next section, we will review how we can understand the results from the
    Query

    Plan tool and used those to adjust our queries for better performance.


    # Interpreting results from the Query Plan tool


    Now that we have run some queries in the previous section, let’s run a query and

    understand how the tool works. Figure 6.17 shows the result of a Query Plan that
    was

    run on the Account object that returned a single record. Let’s analyze closely
    what the

    various numbers mean:'
  merge: -1
  img_proc: true
- pgno: 251
  md: '![](img/782d45700e093b3d82b348c0ccc8ccba_251_0.png)


    # Figure 6.17 – The Query Plan tool


    This query is selective as seen from the result when the Query Plan tool is run.
    If the value in the **Cost** column is above 1, this means that the query is not
    selective. In this case, the index will be used since the filter is considered
    selective.


    Let''s go through some definitions of the columns seen in the Query Plan tool
    result in _Figure 6.17_:


    +   * **Cardinality**: Estimated number of records returned by the leading operation.

    +   * **Fields**: The indexed field(s) used by the Optimizer. In our example,
    the **Id** field is shown because that is the field used by the Optimizer.

    +   * **Leading operation type**: Primary operation type used by the Optimizer
    to optimize the query. Some values include the following:

    +       - **Sharing**: Salesforce will use an index based on the sharing rules
    associated with the user running the query.

    +       - **Index**: The query will use the index on the queried object.

    +       - **TableScan**: Will query all rows in the table.

    +       - **Other**: The query will use optimizations internal to Salesforce.'
  merge: -1
  img_proc: true
- pgno: 252
  md: '+   - **Cost**: The cost of the query compared to Force.com''s Query Optimizer''s
    selectivity threshold. The cost value is derived from database statistics on the
    tables and values. The plan with the lowest value is used.

    +   - **sObject cardinality**: Approximate record count for the queried object.

    +   - **sObject type**: Name of the queried object.


    The plan is only shown for operations that are supported, including operations
    such as `NOT EQUAL TO`, comparisons with null values such as `Name = '' ''`, leading
    wildcards, or references to non-deterministic formula fields.


    It is important to keep in mind that due to the multitenant-driven architecture
    of Salesforce, the platform has its own SOQL Query Optimizer that considers multitenant
    statistics. Statistics are gathered on a nightly basis, but the Optimizer can
    also perform dynamic pre-queries which has its results cached for an hour. Salesforce''s
    Query Optimizer also keeps track of candidates for customer indexes internally
    and automatically creates one-column indexes that it determines could help with
    selectivity.


    Note that soft-deleted records can have a significant impact on query performance,
    so the `IsDeleted = false` filter may be used in your query. This will exclude
    all the soft-deleted records. Keep in mind that the deleted records count toward
    statistics, so make sure that you have a process to hard-delete records.


    When a field is indexed in Salesforce, that may not necessarily mean that it is
    available right away – rather, it can take up to 15 minutes for the index table
    to be updated by the indexing server because it executes asynchronously. This
    is important because say you have a large table, and by working with Salesforce
    Support, you determine that a custom index would help. The index is created on
    the field, but the performance is still slow. It could be because the index table
    has not been updated yet.


    Now that we have reviewed some of the tools that can be used for monitoring, let’s
    look at the techniques we can use to improve application performance.


    # Improving performance


    We have looked at a variety of tools that can be used to diagnose and monitor
    performance-related issues. The next obvious step is to fix these performance
    bottlenecks depending on where the issue is. The technique or the tool to rectify
    the problem will also be different. For example, if there are multiple triggers
    per object, page performance could get impacted, and to fix this, you will need
    to refactor the code to use a single trigger per object. Another example that
    we will review later as well involves using multiple Process Builder flows on
    a single object – fixing that would require determining the tool that will provide
    optimal performance.'
  merge: -1
  img_proc: true
- pgno: 253
  md: 'Let''s look at some of the actions we can take to improve performance once
    we have identified the issue. This should not be taken as an exhaustive list,
    but rather as pointers that can help you quickly improve the performance of your
    application. For example, multiple actions can be taken to improve Visualforce
    page performance, but I mention only a couple of them in the following sections.


    # Browser caching


    This is a simple setting from the UI that can significantly improve page performance
    by avoiding extra server calls by securely caching the most frequently used data
    on the client, that is, a browser. This setting is turned on by default and Salesforce
    discourages turning it off. Some exceptions to this include situations where the
    company’s security policy doesn’t allow the caching of secure data, and in sandboxes
    when you want to immediately see the effects of your configuration or code changes
    without emptying the cache.


    # Using a Content Delivery Network


    A **Content Delivery Network (CDN)** is a collection of server-based infrastructure
    that speeds up the performance of websites. When a website is loaded, the images
    and other content hosted with the website get loaded as well. If you are accessing
    the website from a different continent than where the website is hosted, you will
    see latency and a delayed response compared to a user located within the same
    city or region as the web hosting.


    With a CDN, the content is copied to servers across the CDN, which then serves
    from the closest location to the customer visiting the website. This helps in
    reducing response times to the customer and provides a great customer experience.
    In Salesforce, static content from the Lightning Component framework and other
    applications is served from Akamai’s CDN servers located across the world. This
    results in improved application load times as static assets, including image files,
    **CSS (Cascading Style Sheets)**, JS, and font files, and other libraries are
    cached and served to the user from the most appropriate CDN location. Using a
    CDN doesn’t cache any metadata or data in your org.


    # Network issues


    Once you have run some basic commands such as `traceroute` or `ping` and notice
    something that requires further investigation, involve your networking team right
    away to perform a more in-depth investigation. Don’t delay involving your team
    if you have gone through all the things related to Salesforce and have ruled out
    the fact that a Salesforce-related issue is causing performance issues because
    that will delay the incident resolution process. The networking team will need
    time as they won’t have answers right away and will need to troubleshoot on their
    end, and only once they have found the root cause can they then start the remediation
    process.'
  merge: -1
  img_proc: true
- pgno: 254
  md: 'However, by running the traceroute or ping commands, you can give them a jump
    start. So, let’s take a slightly deeper look into these commands and what information
    they reveal.


    # Ping


    This is a widely used command to check whether there is connectivity with the
    host, which in our case is the Salesforce server. The command sends four packets
    to the server and if the server responds with four packets, then that means connectivity
    exists and there is no packet loss. If the server doesn’t respond, then that could
    mean that there is an issue with the server. Let’s look at an example to understand
    this better. If we ping login.salesforce.com, we can see in Figure 6.18 that the
    server at this location responded and there was no packet loss:


    ![](img/782d45700e093b3d82b348c0ccc8ccba_254_0.png)


    Figure 6.18 – Server response of a ping operation


    As in Figure 6.18, the server at login.salesforce.com responded, and therefore,
    there is connectivity between our devices and the server.


    If the same number of packets were not received as were sent, or the packet loss
    amounts to more than 10% of the total packets that should have been received,
    we would know that packet loss has occurred and that further investigation is
    required. The **Round-Trip Time (RTT)** is the cumulative time it takes for a
    data packet to travel to the destination and then return to the sender.'
  merge: -1
  img_proc: true
- pgno: 255
  md: 'Salesforce''s recommendation is to capture ping results with multiple packet
    sizes and durations. Running the following commands is recommended:


    ```

    ```

    p ping -f -n 25 -l 1200 login.salesforce.com

    ping -f -n 25 -l 1300 login.salesforce.com

    ping -n 25 -l 1400 login.salesforce.com

    ```

    ```


    Run the same set of commands but with your instance as the destination. For example,
    if your org is on NA111, then run the commands as follows:


    ```

    ```

    p ping -f -n 25 -l 1200 na111.salesforce.com

    ping -f -n 25 -l 1300 na111.salesforce.com

    ping -n 25 -l 1400 na111.salesforce.com

    ```

    ```


    The -n switch indicates the number of echo requests to send, with the default
    of 4, and the -l switch indicates the buffer size, so when we state 1200, that
    means 1,200 bytes of data should be sent. Make sure to let the previous command
    finish before running the next one. Ensure that you save the results for your
    internal networking team as well as the Salesforce Support team.


    If we were to ping a location that doesn''t exist, we will get the output as shown
    in Figure 6.19. Sometimes, firewalls block ping requests due to security reasons,
    resulting in total packet loss, in which case it cannot be definitively established
    that the server is down:


    ![](img/782d45700e093b3d82b348c0ccc8ccba_255_0.png)


    Figure 6.19 – Pinging a location or a device that doesn''t exist results in a
    100% packet loss


    Minimum, maximum, and average RTT numbers that are close to each other indicate
    there is not much variance over the time of the test, as seen in Figure 6.18,
    but a large variance between the minimum and maximum RTTs would indicate latency
    issues that require further investigation.'
  merge: -1
  img_proc: true
- pgno: 256
  md: "# # Traceroute\n\nThis command is used to track the real-time path of a data\
    \ packet from the source to the destination. It records all the IP addresses of\
    \ the network devices it passes through to get to the destination and the time\
    \ between each hop. As you can imagine, the more routers the packet has to move\
    \ through, the longer it takes because each device has to process the packet and\
    \ forward it to the next router.\n\nThe tracert command, by default, sends three\
    \ packets to each hop so you will see RTTs per hop in the results. For example,\
    \ running `tracert na111.salesforce.com` gives us the following result:\n\n```\n\
    C:\\Users\\Ahsan>tracert na111.salesforce.com\n\nTracing route to na111-ph2.r.salesforce.com\
    \ [13.110.36.70]\nover a maximum of 30 hops:\n\n  1    17 ms    17 ms    16 ms\
    \  192.168.1.254\n  2    18 ms    18 ms    24 ms  10.139.190.1\n  3    42 ms \
    \   43 ms    42 ms  154.11.12.203\n  4    73 ms    73 ms    75 ms  six.salesforce.net\
    \ [206.81.80.33]\n  5    74 ms    73 ms    73 ms  eth1-1--spn3-ncg0-phx3.net.sfdc.net\
    \ [13.110.5.200]\n  6    78 ms    70 ms    77 ms  dcl1-ncg0-phx3.na111-ph2.salesforce.com\
    \ [13.110.36.70]\n\nTrace complete.\n```\n\nFigure 6.20 – Result of the tracert\
    \ command run on the NA111 instance\n\nAs seen in the preceding screenshot, the\
    \ destination is shown along with its IP address, and we can see that a maximum\
    \ of 30 hops will be used in the test. As mentioned earlier, the three numbers\
    \ in each line represent the time it takes to get to each hop. These numbers are\
    \ cumulative and do not represent the time it takes for individual packets to\
    \ travel to the destination. One cause of confusion that perplexes a lot of people\
    \ running traceroute to destination is that the subsequent hops time are sometimes\
    \ lower than the previous ones. For example, in Figure 6.20, hop 5 took 73 ms,\
    \ whereas hop 4 took 75 ms. This is because the command sends separate packets\
    \ for each hop and it's not the same packet that is being tracked from hops 1\
    \ to 6. The conditions on the network are constantly changing and therefore it\
    \ is entirely possible that there was network congestion when the packet for hop\
    \ 4 was sent versus the packet for hop 5.\n\nSometimes, you might see asterisks\
    \ in traceroute results – this doesn’t necessarily indicate a problem, but as\
    \ mentioned earlier, some networks do not respond to these packets (referred to\
    \ as ICMP packets) due to security or network traffic reasons."
  merge: -1
  img_proc: true
- pgno: 257
  md: '# # Skinny tables


    Database table joins are expensive operations. Depending on how complex the query
    is, it can take considerable amounts of time and database resources to return
    results.

    If you have such a situation, using skinny tables can help speed up the performance.

    Skinny tables are special tables created by Salesforce that have frequently accessed
    fields.

    Remember from Chapter 3, Understanding Data Management, where we discussed the

    Salesforce architecture, all standard fields are stored in a table, whereas all
    custom fields

    are stored in another table. For example, if you have custom fields on the Account
    object,

    those are stored in a different table and when you run a report containing those
    custom

    fields, Salesforce has to do a join behind the scenes and return the results.


    When a skinny table is used, standard and custom fields that are frequently used
    are

    stored in the table to eliminate the need for expensive joins, as seen in Figure
    6.21. As the

    data changes in the source tables, the skinny table is kept up to date automatically
    without

    requiring any intervention from the customer. Another advantage of using skinny
    tables is

    that the platform will automatically use the skinny table in reports and list
    views, among

    others, thereby improving overall performance for users:


    ![](img/782d45700e093b3d82b348c0ccc8ccba_257_0.png)


    Figure 6.21 – As shown, data for the user is queried from the skinny table directly
    rather than from the

    standard and custom fields, thereby avoiding expensive join operations'
  merge: -1
  img_proc: true
- pgno: 258
  md: 'It''s important to note that skinny tables can be used for read-only operations
    and can be created on both standard and custom objects. There are certain limitations
    on what types of fields can be created; for example, neither **Roll-Up Summary**
    fields nor **Formula** fields are supported. The customer cannot create skinny
    tables themselves, but rather they have to open a case with Salesforce Customer
    Support to get them created.


    There are some limits for skinny tables that must be kept in mind when considering
    them as a solution. One of the major limitations is that you cannot use them across
    different objects, that is, each skinny table can only have data from a single
    object. For example, a skinny table cannot be created for the `Opportunity` object
    that also has data from the `Opportunity Team Member` object.


    You can have up to 100 fields in a skinny table and any time a new field is added
    to the object, you will need to contact Salesforce to get it added to the skinny
    table. They also support encrypted fields and encrypted indexes. Skinny tables
    are copied over to full-copy sandboxes at the time of sandbox creation or refresh,
    but for other types of sandboxes, a request must be submitted to Salesforce Customer
    Support.


    # # Query filters, indexes, and negative operators


    Ensure that you are using filters in your SOQL query as much as possible as that
    helps the Optimizer narrow down the records when certain conditions are met. For
    example, this developer org has 39 `Account` records, so let''s try to query all
    the records and view the query cost. As seen in Figure 6.22, the query cost with
    no filters is greater than 1, which we know is inefficient:


    ![](img/782d45700e093b3d82b348c0ccc8ccba_258_0.png)


    Figure 6.22 – The cost is a high 2.78, which is very inefficient for a query'
  merge: -1
  img_proc: true
- pgno: 259
