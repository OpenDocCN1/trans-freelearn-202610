- pgno: 67
  md: 'As seen here, the UDD has multiple different components that come together
    to deliver

    the application at runtime.


    When you create an object in Salesforce, you are not creating that object as a
    database

    table, with the object''s attributes as columns, and the data that goes into the
    table as rows.

    If you have worked in a database, you use **Data Definition Language (DDL)** to
    create

    tables, add columns/rows, delete rows, and so on. This is not what happens when
    an

    object is created in Salesforce because you are interacting with the intermediary
    layer and

    not directly with the database. Of course, there is some object-related data stored
    in the

    database but, as mentioned before, a physical table with columns as fields for
    your object

    gets created. One of the reasons this is done is to scale the system and allow
    for this multi-

    tenancy model to operate efficiently. Another reason is to prevent the database
    locking of

    the table, which happens when a DDL is run for data integrity purposes. This is
    the reason

    you can''t run a DDL directly on the database, such as `create table as APPLICANT`.


    Because of this intermediary layer, you will not have indexes, foreign keys, or
    the ability

    to run query plans on your SOQL queries because it will not return actionable
    data as

    all of that is handled by the intermediary layer. Keep in mind that the UDD stores
    all the

    metadata defined by the tenant, be it through the UI or using APIs.


    Since metadata is used as a key component to generate the client application at
    runtime,

    the platform uses a metadata cache to improve performance, otherwise, the system

    would not be able to scale with high loads. The metadata cache stores the frequently
    used

    metadata in memory, which reduces the need for performance-impacting expensive
    calls

    to the database.'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'All application data is stored in a few very large tables in the platform and
    the kernel materializes virtual tables at runtime. We will look at some of the
    key tables in the following sections, but the premise is that when the tenant
    creates, for example, custom objects in their org, the fields, any relationships
    between them, and other attributes are stored in the UDD. This metadata, along
    with data tables (tables that hold the tenant''s transactional type data) and
    a few specialized pivot tables maintain the data in a denormalized format. This
    makes the architecture optimized and very functional for quickly presenting the
    virtual structure that we can then view from the UI. Some of the key tables are
    given here:


    ![](img/782d45700e093b3d82b348c0ccc8ccba_68_0.png)


    Figure 2.16 – Key tables in the UDD'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'As can be seen in the preceding diagram, all custom objects and custom fields
    are defined in tables and there are no physical database tables created. We next
    take a look at the key specialized tables that form this architecture.


    # Objects metadata table


    This table stores the custom objects that have been defined in the org. The key
    attributes of this table are as follows:


    +   - ObjID: Unique identifier of the object

    +   - OrgID: Unique identifier of the organization

    +   - ObjName: Name of the object


    # Fields metadata table


    This table contains data pertaining to the custom fields that are defined for
    the custom object:


    ![](img/782d45700e093b3d82b348c0ccc8ccba_69_0.png)


    Figure 2.17 – Fields metadata table


    All custom field metadata is stored in the preceding table. Also notice the presence
    of OrgID in all tables to ensure data partitioning and security for each tenant.


    Key fields include the following:


    +   - FieldID: Unique identifier of the custom field

    +   - ObjID: Unique identifier of the object

    +   - OrgID: Organization that owns the custom field

    +   - FieldName: Name of the custom field'
  merge: -1
  img_proc: true
- pgno: 70
  md: '+   - **Data type** (for example, string, number): Data type of the custom
    field

    +   - **IsIndexed**: Boolean value to indicate whether the field is indexed

    +   - **FieldNum**: Position of the field in the object


    Next, we will look at the data table.


    # Data table


    As seen in Figure 2.18, this table contains data for all custom fields that are
    defined for custom objects:


    | GUID | OrgID | ObjID | ...other columns... | Val0 |

    | :--- | :--- | :--- | :--- | :--- |

    | a01...1 | Org1 | a01 | ... | Up |

    | a01...2 | Org1 | a01 | ... | Flat |

    | a02...1 | Org1 | a02 | ... | 20201201 |

    | a02...2 | Org1 | a02 | ... | 20210101 |

    | a03...1 | Org1 | a03 | ... | 91.23012 |

    | a03...2 | Org1 | a03 | ... | -10.35 |


    Figure 2.18 – Data table where custom field data resides


    Notice that this table has a limit of 500 columns, which is also the limit for
    custom fields on a custom object.


    Key fields include the following:


    +   - **GUID**: Global unique identifier for each field

    +   - **ObjID**: Unique identifier of the object

    +   - **OrgID**: Organization that owns the custom field

    +   - **Field name**: Natural name of the field


    Another 300 fields are allowed from managed packages. These columns, called flex
    columns, can store data from multiple data types since, in the end, it all gets
    stored as a string data type. All fields in an object are stored in a different
    column and no two fields are stored in the same column. This table also has the
    four audit fields, which we will discuss later on in the chapter, and an IsDeleted
    column (not shown) to indicate when data has been deleted.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# # Character Long Objects (CLOBs) table


    This is a CLOB table used to store fields that have been defined as long text
    fields of up to 32,000 characters. The platform also stores CLOBs outside the
    database for efficient searches.


    # ## Indexes pivot table


    Relational databases use indexes to locate data when a search request is made.
    However, given that in the data table, different types of data types can be stored
    in a flex column, to get around this, the platform uses an independent table called
    Indexes that stores values for fields that have been identified to be indexed
    in the data table. It does this by synchronously copying field data marked for
    indexing to an appropriate column in the data table. The following diagram shows
    the Indexes table:


    ![](img/782d45700e093b3d82b348c0ccc8ccba_71_0.png)


    Figure 2.19 – Indexes table


    As we can see, the Indexes table stores the indexes defined on objects. Some field
    types are automatically indexed, for example, external fields, and lookup or master-detail
    relationship fields.


    # ## Unique fields pivot table


    For the same reason that indexes cannot be stored in the data table, this table
    is used to store unique fields defined in the object, so when you designate a
    field as unique in Salesforce, that field gets stored in this table. The metadata
    architecture at runtime checks this field and enforces uniqueness across data
    in the object.'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# Relationships pivot table


    This table stores relationships that have been defined on an object. When a field
    is created with one of the relation types discussed in an earlier section, the
    platform maps the field to a value in the data table and uses this field to store
    the Obj ID of a related object. The relationships table is shown here:


    ![](img/782d45700e093b3d82b348c0ccc8ccba_72_0.png)


    Figure 2.20 – Relationships table


    In the preceding diagram, notice how relationship type fields are stored in this
    table that refer to the data table we looked at earlier.


    # FallbackIndex table


    This is used if the external search engine fails to return a result. A fallback
    search is then performed. This is done by implementing a direct database query
    referencing the names of the target application objects. To enable this type of
    search, all object names are defined in this table, so the database has access
    to the most up-to-date information.


    # NameDenorm table


    This table stores the Obj ID and name of each field in the data table. This is
    primarily used to provide hyperlinks to records for objects that are in a parent-child
    relationship.


    # HistoryTracking table


    This table stores changes to fields that have been identified by the tenant for
    auditing. It stores the old and new values of the field along with when and who
    made the change.'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'Now that we have looked at the core architecture, let''s briefly touch base
    on the innovation aspect of Salesforce and how it has been successful in releasing
    three releases per year.


    # New releases


    Salesforce has been consistently ranked as one of the world''s most innovative
    companies. One of the reasons for this is its extraordinary pace of innovation.
    One of the ways this has manifested itself is in the **three major releases a
    year** that Salesforce does. These releases include tens and sometimes hundreds
    of new features being introduced every year. The question then arises as to how
    Salesforce ensures that the configuration/customization of each of the thousands
    of customer orgs doesn''t break with each new release.


    This is where the **Hammer** comes in. The Hammer refers to the time period before
    every release when Salesforce implements an internal change freeze a few weeks
    prior to updating its sandboxes with the new release. The Hammer runs all unit
    tests that exist in customer orgs twice – once before the application of the release
    and after the release has been applied to a test environment. The results are
    then compared with the expectation that all tests that passed or failed prior
    to the release will still give the same result once the release has been applied.


    Of course, things don''t always go as planned in the software world and any discrepancies
    identified as regressions must be fixed quickly. An automated application analyzes
    the before and after results to ensure that the results have been scrubbed clean
    of any confidential data before being sent to the Salesforce team for taking action.
    This exercise is collectively referred to as the *Hammer* because of the massive
    effort it requires considering that it''s not only Apex but Visualforce, and other
    metadata components as well. Now we can see why it''s important to write test
    classes that actually test your code as they are also used by Salesforce prior
    to each release to run these millions of combined tests to ensure that the release
    is not going to break anything. This means that if in a new release your code
    was to break, Salesforce would detect that when running the Hammer and fix the
    code. But if test classes were poorly written, or with a view to merely passing
    the 75% test coverage requirement, then these may not get detected when the Salesforce
    team is running tests and you would then need to invest resources to fix your
    code.


    With this introduction to Salesforce architecture, let''s take a deep dive into
    Salesforce objects.'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# # Introducing Salesforce objects


    In this section, we will look at the foundational data structure in Salesforce
    – objects. This includes looking at what Salesforce objects are, their properties,
    and their usage. I will be suggesting best practices and principles to keep in
    mind when working with both standard and custom objects and other types of objects
    available on the platform. Applying these best practices when working with objects
    will help us keep our organizations scalable for that next enhancement or major
    project and deliver increased usability for our end users. The intent here is
    to briefly review the different objects and field types in Salesforce before we
    go into a detailed discussion of data modeling. This will make it easier to understand
    and grasp the data model concepts and provide a good foundation as regards when
    to use the different relationship types.


    We will start with standard objects, which are the most commonly used and familiar
    to us, and then review other objects in Salesforce as well.


    # ## Standard objects


    These are objects that come out of the box with Salesforce. Common ones include
    Account, Contact, Opportunity, and Lead, to name a few. Your license type and
    the version of Salesforce you are using will define which ones you can use in
    your organization.


    # ## Custom objects


    These are objects created to support the business requirements of your company.
    Examples include the Job, Applicant, and Candidate objects that we looked at in
    our recruitment app in the last chapter. AppExchange applications will also have
    custom objects in them.


    # ## Big objects


    This is a unique object because it can hold massive volumes of data from hundreds
    of millions of rows to billions of rows. They are well suited for archiving data
    or bringing in data from external sources. However, they are also limited compared
    to standard and custom objects. Some of the key features of big objects that differentiate
    them from regular objects are given here:


    +   - They can only be created using metadata.

    +   - They are prefixed with __b.

    +   - They cannot have triggers, nor can they be reported on.'
  merge: -1
  img_proc: true
- pgno: 75
  md: "+   - They support limited numbers of data types, such as **Text**, **Number**,\
    \ **Date Time**, **Lookup**, and **Text Area**.\n\n+   - They cannot track record\
    \ field history, nor can they be used to track activity.\n\n> **Important note**\n\
    > \n> Salesforce is making continuous updates to its big object functionality,\
    \ so please refer to the latest release documents for up-to-date information.\n\
    \n# ## External objects\n\nThese are objects that are used to bring external data\
    \ into Salesforce. In our recruitment app, let’s say we use an external service\
    \ to do candidate background checks. Instead of bringing those results into Salesforce,\
    \ we could simply use external objects and make them available to our users as\
    \ required.\n\nIn the next section, we will look at some special field types in\
    \ Salesforce and their use cases. Parent-child and lookup relationships will be\
    \ dealt with in the next section in more detail, so we won’t cover them here.\n\
    \n# ## Fields in Salesforce\n\nThere are many different types of fields that are\
    \ available in Salesforce. In this section, we will cover the special fields in\
    \ Salesforce.\n\n# ## The Name field\n\nThis is the name of the record and is\
    \ different from the record ID. This can be an auto-number or text field. This\
    \ field is usually short and used by users to reference the record rather than\
    \ using the long 15-character or 18-character (char) record ID. Most objects have\
    \ this field except for the Case object, which doesn’t have this. The Case object\
    \ only has an auto-number field.\n\n> **The Autonumber field**\n> \n> This is\
    \ a special field that uses a system-generated unique number that is incremented\
    \ every time a new record is created. You can define the format of the field along\
    \ with a starting number, for example, for invoices, you could define the field\
    \ to generate invoice numbers in the format INV-012345.\n> \n> This is also the\
    \ field that shows up as a clickable option in list views, search results, and\
    \ reports. Salesforce does allow this field to be text-based as well, which means\
    \ that multiple records can exist with the same value since the system is not\
    \ incrementing the number sequence anymore."
  merge: -1
  img_proc: true
- pgno: 76
  md: '# The ID field


    This is the primary key (in relational database lingo) for the object and uniquely
    identifies a Salesforce record. This is an entirely unique field and no two records
    can have the same ID. The record ID can either be 15 or 18 characters long and
    the former is case sensitive; for example, if 0030000000000BcA is changed to 0030000000000bCa,
    Salesforce will throw an error. It is important that the 18-char ID is used in
    external applications because they may consider these two IDs the same, whereas
    Salesforce considers them distinct.


    # Audit fields


    These audit fields are used for compliance, recording, and reporting on changes
    made to the data, as well as in Salesforce’s process automation tools such as
    Workflow Rules, Lightning Process Builder, Flows, and Integrations. The most commonly
    used audit fields are as follows:


    +   - CreatedBy

    +   - CreatedDate

    +   - LastModifiedbyID

    +   - LastModifiedDate


    There is another field called SystemModStamp, which is updated when an automated
    process updates a record. Automated process here refers to Salesforce internal
    code. Whenever a user, automation tools such as Workflow Rules, Lightning Flow,
    or Process Builder, an API, or a DML statement updates a record, both the LastModifiedDate
    and SystemModStamp dates will get updated. This means that these two dates can
    be different, and it is a best practice to not use the SystemModStamp date for
    integration purposes. Except for the SystemModStamp field, all four audit fields
    can be updated using Data Loader or a similar tool. The use of audit fields is
    helpful when migrating data so as not to lose important audit information and
    should be carefully used to protect data integrity.


    # Compound fields


    These are complex data types that are created by grouping together multiple primitive
    data types. This is done to simplify the code that handles these fields. If you
    have used the Account object, the Address field is a compound field composed of
    fields such as Street, StateCode, State, PostalCode, City, Country, and a few
    other fields. Compound fields are read-only, and changes can only be made to the
    underlying individual field. The compound version of the fields is only accessible
    through the SOAP or REST APIs.'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'Another example of a compound field is Geolocation, which is a combination
    of the latitude and longitude fields. These are available by default on Account,
    Contact, Quote, and User objects and when an address is populated, Salesforce
    automatically populates the Geolocation field. In the following screenshot, you
    can see that the data type of the Billing Address field is Address:


    ![](img/782d45700e093b3d82b348c0ccc8ccba_77_0.png)


    # Figure 2.21 – Billing Address field


    In the following screenshot, we have queried the same compound field using SOQL:


    ![](img/782d45700e093b3d82b348c0ccc8ccba_77_1.png)


    # Figure 2.22 – Billing Address Compound field


    The BillingLatitude and BillingLongitude fields form the BillingAddress compound
    field, which can also be queried. Note how it shows [object Object] under BillingAddress,
    which indicates that this is a complex data type.


    # AnyType fields


    These are polymorphic fields that return string, Boolean, date, number, URL, email,
    or other data types. These are used when querying data through the APIs and are
    commonly used in history objects. A polymorphic field can be used to get information
    about related objects where these related objects can be of different types.'
  merge: -1
  img_proc: true
