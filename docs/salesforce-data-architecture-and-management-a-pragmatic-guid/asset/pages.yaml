- pgno: 260
  md: 'While looking for opportunities to improve performance, scan your queries to
    see whether they reference a negative operator such as NOT EQUAL TO (!=) as these
    can result in very inefficient queries. The following example queries all Account
    records that don’t have Account Site as null:


    ![](img/782d45700e093b3d82b348c0ccc8ccba_260_0.png)


    Figure 6.25 – As seen, simply using a single negative operator can cause the query
    to perform poorly


    When looking to improve performance, review your SOQL queries because poorly written
    queries can cause a significant drag on resources and impact performance for users.


    # Deleted records in the recycle bin


    This seems very innocuous, but deleted records can play a significant role in
    impacting performance. The reason is that when you simply delete records from
    the UI or through an API, they are marked for soft deletion, which means they
    are moved to the Recycle Bin and kept there for 15 days or until the size limit
    is reached. When you run a query, there is an associated overhead from filtering
    out soft-deleted records, thereby causing performance issues.


    Ensure that you don’t have a large number of soft-deleted records, which can easily
    be done by ensuring that the recycle bin is emptied frequently, either from the
    UI or by using the Bulk API, which has a hard-delete option that removes records
    permanently from the database. Keep in mind that this option doesn’t move the
    records to the recycle bin, so use it carefully.


    # Archive


    Ensure that data archiving is a component of every project dealing with data (how
    many projects are there that don’t?) rather than an afterthought once you start
    to run into issues. Orgs that have years and years of data in the database can
    cause major performance issues. Imagine querying an object that has 500,000 records
    and the database having to run a full table scan to fetch a few thousand records.'
  merge: -1
  img_proc: true
- pgno: 261
  md: 'There are multiple ways to archive your data, all the way from building your
    own custom solution using the Bulk API to using Heroku or deploying a ready-made
    AppExchange solution. What tool you use will depend on your business and regulatory
    requirements. The important thing is to understand that not all data is equal,
    and you will want to carefully analyze and categorize your data and implement
    solutions to meet your requirements. For example, a small software company may
    not find it useful to keep quote records that are more than 3 years old, whereas
    a heavily regulated health insurance provider may be required to keep patient
    records for a minimum of 7 years.


    # Lazy loading


    This is a feature that is used in Visualforce pages to speed up performance, and
    if you are still using Visualforce, you can look at implementing this. The idea
    is that the page first loads essential features so the user can start interacting
    with it, delaying the rest until the user performs an action, such as clicking
    a button, or until a brief period has passed, and then the rest of the page is
    loaded.


    Another aspect of improving performance is to enable separate loading of related
    lists on the page. This is a UI-level setting that enables users to interact with
    the page while the related lists are still being loaded. This allows the user
    to interact with the page until all components, including related lists, have
    loaded, of which there can sometimes be a large amount, especially on the **Account**
    page. This is because the **Account** object is a key object in Salesforce and
    a large number of objects usually have a lookup or parent-child relationship with
    it.


    # Standard features in Visualforce


    Try to use standard features as much as possible unless you have thought through
    the pros and cons of each approach and the custom approach turns out to be better.
    For example, you may want to use jQuery for pagination purposes in your Visualforce
    page, but when the page is loaded, it will take time to query the data and present
    it on the page, whereas using the standard server-side pagination option might
    be quicker, but the processing is done on the server side.


    The former may be more suitable when the dataset is small, but occasionally there
    may be a large dataset, and the user is happy to wait for the page to load occasionally.
    The server-side option, on the other hand, is more appropriate for larger datasets
    and when the performance of the page is very important.'
  merge: -1
  img_proc: true
- pgno: 262
  md: '# # Use with sharing Apex classes


    Apex code, by default, runs in system mode, which means it has access to _everything_:
    it can access all objects and their fields, and field-level security and sharing
    rules don''t apply. Check to make sure that your classes are using the `with sharing`
    keyword because that respects field-level security and sharing rules. The net
    result of this is that smaller result sets are returned, which can help improve
    performance.


    # ## Devices and browsers


    As discussed earlier in this chapter, the Octane score is a good measure of the
    browser''s performance. The higher the score, the better the performance is expected
    to be. Since the Octane score takes into consideration the user''s device as well,
    it is important to confirm that the device supports the minimum requirements required
    for the smooth operation of Salesforce. If the user''s device is running at the
    minimum recommended hardware specifications, upgrade the device with additional
    memory and processing power.


    Another thing is to confirm that the device is charged or is not being throttled
    in some way. Devices usually switch to low-power mode when they are close to running
    out of power or users may have inadvertently changed the settings, causing the
    device to operate in a low-powered mode.


    If you determined in your initial investigation that the issue is specific to
    a user, check their browser. Currently, Chrome is the most optimal browser for
    running Salesforce Lightning. I highly recommend not using Internet Explorer with
    Salesforce LEX as your users will run into many problems. If the browser is Chrome,
    then check for its version and whether the version is supported by Salesforce.


    Disabling any extensions or plugins in the browser can also help with performance
    significantly as they actively consume memory and processing resources. If nothing
    works, then restarting the browser can also help with performance-related issues
    as resources that are tied up by previous processes are freed.


    # ## Visualforce pages


    You should have standards on where most development is going to happen, be it
    Visualforce or Lightning. But considering that Visualforce is the older UI and
    a lot of custom development has been done in Visualforce, I suggest revisiting
    the previous release notes and determining whether the custom functionality provided
    by the Visualforce page is now available through out-of-the-box functionality
    or by using declarative tools.'
  merge: -1
  img_proc: true
- pgno: 263
  md: 'When you have to resolve a performance-related issue on an immediate basis
    for a Visualforce page, I suggest reviewing **View State**. **View State** is
    an encrypted string that stores a collection of values comprising field values,
    controller state, and components’ state in a hidden form element. Very large view
    states require large amounts of processing time because the string has to be serialized/deserialized
    and encrypted/decrypted depending on the type of request.


    If you notice the issue is with the size of **View State**, you can reduce the
    number of variables that are included in **View State** by declaring them as `transient`.
    Doing this will not include these variables in **View State**, but make sure these
    are variables that are not needed for maintaining the page state. If **View State**
    is large because controllers and controller extensions have a large number of
    fields, consider filtering out any extraneous fields that might not be needed.


    # Debug mode


    Salesforce uses the production mode by default that optimizes and minifies JS
    code to reduce its size. This means that the JS code in the browser is obfuscated,
    and this only applies to framework code – custom code is never minified and obfuscated.
    This debug flag should always be turned off in production because otherwise, it
    can significantly slow down performance for the users it has been turned on for.


    # Page redesign


    Having many fields on the page can also impact performance, so you want to make
    sure that only fields that are actually used are available on the page. Use tools
    such as **Field Trip**, for example, to identify fields that are not frequently
    used and remove them from the page and eventually from your org.


    Keep a minimal number of fields that are deemed most important on the primary
    page and less used fields on another tab. Do the same for components, placing
    them on second or even third tabs if they are not the most important. The reason
    is that components that are on the primary page are rendered at the time of initial
    page load, whereas other components are loaded on demand.


    If you notice many related lists on the primary page, move them to other tabs.
    Salesforce recommends having fewer than three related lists on a tab. For the
    primary page, place the most important related lists on it.'
  merge: -1
  img_proc: true
- pgno: 264
  md: '# Solution tool selection


    Not every tool is created equal and that means you must be cognizant of the tool
    that you are using to deliver your solution. The performance of a Workflow Rule
    versus a Lightning Flow may be different and can be a factor in deciding which
    tool to use. This is a design-time consideration, but it can break your business
    process down the road as volumes increase or more automation is put in place.


    I want to explain this point in depth because usually, we don''t pay much attention
    to how the choice of our tool is going to impact performance, and our decision
    making in most cases is limited to whether the solution choice is declarative
    versus being code-based. To illustrate my point, let''s use an example of simple
    automation that is used to update an **Account** record when an opportunity has
    been won. We will update the **Type** field from **Prospect** to **Customer –
    Direct**. As our tool of choice for this example, we will define **Workflow Rule**
    and **Lightning Flow** and measure the performance using the **Developer Console**.


    Before we set up the workflow rule, let''s first ensure that our debug log levels
    are set up appropriately. Follow the next steps to turn on debug logs:


    +   1. Navigate to **Setup | Environments | Logs | Debug Logs**.


    +   2. Set up the debug level details as shown in **Figure 6.26**. Once you have
    set up the debug level, make sure to turn on debugging by updating the start and
    stop times and ensuring that you have debugging turned on for the correct user:


    ![](img/782d45700e093b3d82b348c0ccc8ccba_264_0.png)


    Figure 6.26 – Note the level of detail for each debug element; by default, other
    categories are turned on as well, but we want to focus on performance results,
    so we turned on Database, Workflow, and Apex Profiling'
  merge: -1
  img_proc: true
