- pgno: 173
  md: '# # 5 Implementing Data Governance


    In this chapter, we will do a detailed review of data governance: the need for
    it and the risks associated with improper data governance. You will learn the
    differences between data governance and management. You will also learn the key
    principles for a successful data governance program and some key steps that you
    can take to ensure your initiative is successful. We will then get more specific
    and discuss what we can do to govern data in Salesforce.


    We will learn about doing a current state assessment so next time you are tasked
    with one, you can easily assess the current state and make recommendations to
    rectify any problems or improve the current state. You will also learn about relevant
    metrics that can be put in place to ensure that you are tracking progress.


    Data privacy is a topic that''s gaining more and more visibility as regulatory
    bodies around the world enact laws to protect personal data. There is a slew of
    regulatory laws depending on the jurisdictions an organization operates in but
    we will look at two of them – **General Data Protection Regulation (GDPR)** and
    the **California Consumer Privacy Act (CCPA)**. You will learn the key definitions
    of these laws and the principles behind them, which can then be applied in the
    context of the Salesforce Platform.'
  merge: -1
  img_proc: true
- pgno: 174
  md: 'The key topics of this chapter include the following:


    +   * Enterprise data governance

    +   * Assessing the current state of data governance

    +   * GDPR compliance and CCPA

    +   * Putting it all together


    So, let''s dive right into enterprise data governance.


    # # Enterprise data governance


    Every organization, whether small or large, collects data, usually from multiple
    sources, and is responsible for ensuring that processes are in place to handle
    data in a consistent manner. It must do that in such a way that is compliant with
    data-related regulations and laws that the organization is subject to.


    Organizations also make decisions about data, for example, where to store data,
    who can access it, and how long to keep it, but some organizations consciously
    put in the effort and formalize this decision-making process while others may
    not do so. Those that do this in a formal manner realize more value over a period
    of time while also minimizing their exposure to the risk caused by informal data
    governance processes.


    In the next few sections, we will start by defining data governance, clearly articulating
    the business drivers behind it, the benefits of formal data governance, and other
    related aspects of data governance.'
  merge: -1
  img_proc: true
- pgno: 175
  md: '# What is data governance?


    You would find a multitude of definitions if you did a simple search for the phrase
    data governance. This is an indication that there is no one agreed-upon definition
    and this complicates matters when communicating with stakeholders. The definition
    I prefer is that data governance can be defined as a collection of principles
    and practices that govern data from its inception to its archival/purge, that
    is, throughout the data life cycle.


    Data governance is an overarching discipline that permeates almost every aspect
    of businesses today because data is now considered an asset. This is due to the
    heightened awareness among businesses that data can be used as a competitive differentiator
    in an increasingly dynamic and competing market. For example, before the advent
    of machine learning and artificial intelligence and myriad other advanced tools
    available now, gaining insights from, say, sales data was very challenging. This
    was because it required manual number crunching, which was a time-consuming and
    error-prone process. It also cost a company hard dollars to undertake these types
    of activities and, typically, only small sets of data were ever collected for
    analysis. These days, it’s almost become the norm to receive a survey in your
    inbox once your ticket has been resolved by a call center agent. This allows proactive
    organizations to act on your feedback before it’s too late and customers start
    to take their business to competitors. Simply put, data governance enables organizations
    to create value with their data.


    It’s important to also understand that data governance and Information Technology
    (IT) governance are not the same. IT governance is focused on making decisions
    on the software, the hardware assets of the organization, and the technical architecture
    of those assets. Data governance is focused on governing data assets with the
    focus being on data. Having said that, there will be crossover during decision
    making; for example, data governance policies in a health insurance organization
    could dictate at the field level who should have access to sensitive fields. As
    this would require the ability to manage field-level security in the application,
    at the time of solution selection, this will be an important consideration and
    impact the decision-making process.'
  merge: -1
  img_proc: true
- pgno: 176
  md: '# # Understanding the need for data governance


    We have discussed the value of data throughout previous chapters and that data
    is now a critical asset for organizations. Perhaps, in the future, we might start
    to measure data quality, governance processes, and other attributes just like
    we measure business goodwill today. Businesses are realizing the value of digital
    transformation and adapting to it; especially with the COVID-19 pandemic, some
    businesses have moved their operations completely digital and others are pragmatically
    assessing the functions that they can digitize. This means that more data will
    be created that will need to be properly governed. Let''s discuss some of the
    key drivers for data governance:


    +   • **Revenue growth via process improvement**: Every business function in the
    organization is interconnected and will reap the benefits of data governance in
    its own way. For example, top management can reliably use analytics to explore
    opportunities for revenue growth; finance can accurately report on the financial
    health of the company; sales and marketing can derive valuable insights about
    customer behaviors and preferences; the supply chain can focus on areas for cost
    reduction and introducing operational efficiencies. All in all, having well-governed
    data inspires confidence in data-driven decision making and creates trust within
    the organization and with external stakeholders. When you have robust data governance
    practices, you can confidently let your customers know how their data is stored,
    processed, and discarded, which can lead to increased customer trust translating
    into more revenue.


    +   • **Regulatory compliance**: This is probably the most common driver for data
    governance programs, especially for heavily regulated industries such as banking
    and healthcare. This also applies to countries or regions like the **European
    Union (EU)** that may have their own set of rules that businesses operating in
    those jurisdictions will need to comply with. Non-compliance with these regulations
    can result in heavy penalties and, more importantly, reduce trust in the organization''s
    brand.


    +   • **Data quality**: It is critical to have accurate and complete data. Organizations
    need to ensure data quality so the data can be trusted throughout the organization
    and can be used to make critical decisions. Without this trust in data, organizations
    find it challenging to leverage data to make decisions leading to missed opportunities,
    inefficiencies, and ultimately a loss of revenue.


    +   • **Data standardization**: Nowadays, organizations often have tens if not
    hundreds of systems in use. Each of these systems come with their own data formats
    and standards. This may seem trivial but it often leads to inconsistencies and
    the misinterpretation of data resulting in sub-optimal decision making and potential
    loss of revenue.'
  merge: -1
  img_proc: true
- pgno: 177
  md: '+   * **Data security:** One of the top priorities for organizations today
    is data protection and ensuring policies and tools are in place to protect the
    data from unauthorized access. This also includes how, when, and what data is
    going to be distributed internally or to external stakeholders.


    Now that we have looked at the drivers of data governance, let''s briefly touch
    on the benefits of data governance.


    # Benefits of data governance


    A good data governance program will reap many benefits over a period of time,
    some of which we will discuss in this section. However, it must be remembered
    that data governance is not a project with a defined start and end date; rather,
    it is a continuous process where the output, that is, quality data that is usable
    for operational and analytical purposes, feeds into further refining the inputs
    just like a feedback loop. As companies start to see the results of data governance
    processes and policies, they can further tweak them to ensure that the desired
    data output is achieved. Here are some of the benefits of data governance:


    +   * **Data discovery:** Proper data governance leads to the easy discovery of
    data within the organization and increases the adoptability of data across the
    organization. Data governance practices drive consistency and adherence to agreed-upon
    standards, leading to data being more readily discoverable. This also means that
    data is understood and can be easily accessed by authorized parties when needed.


    +   * **Data security:** Cybersecurity-related threats are a major cause of concern
    for a lot of organizations. When governance processes are implemented with clearly
    defined roles and responsibilities, it reduces the risk of data getting lost,
    stolen, or accessed by unauthorized parties. Data governance practices drive the
    identification of critical assets and the controls that are needed to protect
    those assets.


    +   * **Brand trust:** Implementing data governance processes will improve your
    data governance maturity level over time, which increases trust not only within
    the organization but also with your external stakeholders. Customers are more
    willing to do business with organizations that can clearly demonstrate they have
    adequate processes to maintain and protect consumer data.'
  merge: -1
  img_proc: true
- pgno: 178
  md: '+   - **Integrations**: It is becoming the norm to have multiple business applications
    and systems running in organizations today. For example, a marketing system would
    need to integrate with the **Customer Relationship Management** (**CRM**) system
    to send over marketing qualified leads, whereas a CRM may need to integrate with
    an **Enterprise Resource Planning** (**ERP**) system for order fulfillment once
    a quote has been approved in the CRM. Not having properly governed data can lead
    to the proliferation of bad data in downstream applications, making the job of
    maintaining a certain level of data quality that much more difficult. Imagine
    a data warehouse having inaccurate data that is then used in data marts. How would
    that impact decision making? Or say the CRM sends the wrong address into the order
    fulfillment system, which then ships the order to this incorrect address. How
    will that impact your relationship with the customer and ultimately your revenue
    goals?


    +   - **Efficient use of resources**: Not all data is useful, and you don''t want
    to be collecting data that will not provide value to your organization; you''d
    rather put your resources to better use. Having data governance provides the ability
    to closely analyze and collect data that will actually provide value. Remember,
    it''s always easier to prevent unwanted data from getting into your organization
    rather than bringing it in and then removing it after having determined that it
    is of no value to you.


    +   - **Handling complexity**: The number of sources that data can be gathered
    from is increasing along with the volume. Good data governance will provide the
    ability to manage these data sources and volumes of data, making it easy to respond
    to internal and external requests for data and comply with privacy regulations.


    +   - **Analytics**: More companies are using data science, machine learning,
    and artificial intelligence to drive insights for optimal decision making and
    identifying risk. Sound data governance practices and a foundation are imperative
    if any of these disciplines are to yield useful results that are reliable and
    trustworthy.


    # Understanding the difference between data governance and data management


    Many people confuse data governance and data management practices. Although they
    are linked, understanding the distinction is important. Data management practices
    are IT practices to ensure data accessibility, reliability, and security at the
    tactical level, whereas data governance is more of a business strategy that is
    used to securely leverage data to create value and reduce the risk to the organization.'
  merge: -1
  img_proc: true
- pgno: 179
  md: 'IT teams focus on data management aspects when they implement processes and
    tools to collect, store, organize, and process data to maintain data quality and
    trust in data, whereas data governance focuses on identifying data and the associated
    data assets so the company can reap the benefits of data. This is not to say that
    data governance doesn''t use any tools to achieve its purpose, but what it means
    is that the tools used for data governance serve a broader purpose. For example,
    a Salesforce admin decides to implement Dun & Bradstreet''s Optimizer tool for
    continuous data cleansing and data enrichment. This is an example of data management.
    But if a business decided to implement a data catalog of business entities or
    define roles and responsibilities associated with managing data in the organization,
    such as data stewards and approvers, that would be an example of data governance
    in action.


    Another way to look at this is the way auditors define and implement policies
    and procedures and financial management execute these policies, the same way data
    governance pertains to defining the process in relation to data and the people
    who will interact in some way with that data. In the construction industry, the
    blueprint of how a building should be erected is analogous to data governance,
    and the construction of that building is analogous to data management. Data governance
    also includes the technology to achieve the goals of governance, for example,
    data governance tools that help users build a business data catalog, including
    defining business terms, any synonyms for those terms, and related business attributes.
    Some tools have capabilities to score and evaluate data quality while others may
    have capabilities related to data access policies and the ability to connect with
    different systems to consistently apply your data governance policies.


    Part of data governance is also defining the metrics to measure the performance
    of governance policies and procedures. Some metrics that typically get measured
    in the beginning include the completeness of data, accuracy, and the percentage
    of duplicate data records. Having even some preliminary metrics is important to
    measure the effectiveness of your policies and how well they are being adhered
    to. Keep in mind that these metrics are not merely technical but have an impact
    on business metrics as well.


    For example, Days Sales Outstanding (DSO) is a metric used to measure the financial
    health and cash flow of the company. If the DSO will be high due to incorrect
    or incomplete customer addresses, external stakeholders such as an analyst may
    see this as a sign of weakness and downgrade the company''s outlook. This can
    result in increased costs for the company to borrow capital to run operations.


    This example is a good way to demonstrate the linkage between data governance
    metrics and business metrics. This is another difference between data management
    and data governance – since data management is the execution side of data, it
    may not have its own data-related metrics but will need to meet the metrics defined
    by data governance.'
  merge: -1
  img_proc: true
- pgno: 180
  md: "DSO\nDSO is the average number of days it takes a company to receive payment\
    \ once\na sale has been made.\n\nIn the next section, we will understand metadata\
    \ management – an essential component\nof data governance.\n\n# Metadata management\n\
    \n**Metadata** is *data about data*, meaning it provides the necessary context\
    \ for data. For\nexample, you have a **Formula** field called **Days between Stage**\
    \ defined in Salesforce to\ncalculate the number of days between each stage on\
    \ the Opportunity object. The value\nin the field is the data that needs to be\
    \ managed but the fact that this field is of the type\n**Formula** with a return\
    \ type of **Number** and the actual formula definition to calculate the\nresult\
    \ are all examples of metadata.\n\nThis is the technical aspect of metadata, but\
    \ metadata encompasses the business definition\nas well. In a comprehensive metadata\
    \ document, you will notice that it answers the *five Ws*\nand *the How* question.\
    \ Let’s use our example from the previous section and see how we\nwould drill\
    \ deeper to understand the metadata of this field in more detail:\n\n+   • **Why?**:\
    \ This is related to understanding the rationale of why we are storing this data.\n\
    +   This is the most important question to ask. For our example, the reason why\
    \ we are\n+   storing this data is so we can report on the number of days it takes\
    \ to move between\n+   stages.\n+   \n+   • **What?**: Another question we need\
    \ to ask is the purpose of the field and the drivers\n+   behind using it. This\
    \ pertains to the business definition of the data and the business\n+   rules\
    \ applicable to it. For our example, the business definition could be *calculate\
    \ the\n+   number of days between the current stage and the previous stage for\
    \ an Opportunity\n+   record*. Another question answered is what are the business\
    \ rules for this data? For\n+   example, when the Opportunity record is in the\
    \ Initial Discovery stage (the very\n+   first stage in the Stage picklist), the\
    \ value of this field will be blank.\n\nAnother aspect of this question is to\
    \ ask what the acronyms or abbreviations for\nthis field are. For us, it could\
    \ be **NoD (Stage)** referring to **Number of Days** for the\n**Stage** field\
    \ or **NDS** referring to **Number of Days** for the **Stage** field. The database\n\
    field name is also mentioned here, which in our example is Number_of_Days_\nStage__c,\
    \ where **Field Type** is **Formula** with the return type as **Number** and 0\n\
    decimal places."
  merge: -1
  img_proc: true
- pgno: 181
  md: 'Typically, security-related questions will also be answered here, such as what
    the privacy level of this field is. Salesforce provides a number of fields related
    to data privacy, such as **Compliance Categorization** and **Data Sensitivity
    Level**, which can be used to properly classify data. **Number of Days (Stage)**
    is an internal-use field only so we will select **Internal** for it. Other options
    are **Public**, **Confidential**, **Restricted**, and **Mission Critical**.


    Referring to the *what?* question, we can now say that the purpose is to report
    on the average sales cycle period for comparison with industry and peer averages.
    The business driver is to identify the bottlenecks and remove those, so the average
    sales cycle time periods become consistent and comparable with the company’s operating
    industry and peer metrics.


    +   • **When?**: This answers the question of when the data is created and updated
    and when it can be archived or purged from the system. In our example, the **Number
    of Days (Stage)** field is populated initially when the opportunity is created
    and updated when the **Stage** field on the Opportunity record is changed. The
    field is copied to a data warehouse on a nightly basis along with other data and
    removed from Salesforce after 3 years from when the data in the Opportunity record
    was set to Closed/Won or Closed/Lost.


    +   • **How?**: This answers the question of how many places this data is stored
    in and how long it should be stored. In our example, the field is stored in Salesforce
    but also in a data warehouse for analytical reporting. It is archived from Salesforce
    after 3 years and deleted from the warehouse after 7 years. Since we use a third-party
    AppExchange app for backing up data, it is also stored in their data centers.
    In this case, the data is stored in three different places.


    +   • **Who?**: This answers the questions who created this data, who the user
    of the data is, who the owner of the data is, who can modify the data, who the
    data steward is, and who can impact this data either internally or externally?
    For our example, sales **representatives (reps)** are the users of this data and
    the data is automatically created by the system based on the sales reps’ actions.
    It can be indirectly modified by the sales reps as well as their direct managers
    and the sales operations team when they update the Stage and save the record.
    The data can be influenced by internal executive-level staff or externally by
    an investment firm that partially owns the company by demanding that the sales
    cycle be shortened to increase cash flow and revenue.'
  merge: -1
  img_proc: true
- pgno: 182
  md: '+   • Where?: This pertains to where the data is stored, where the data is
    used and shared, and where the data backup is. In our example, our data is stored
    primarily in Salesforce but also in the data warehouse. It is used in Salesforce
    reports and dashboards but also shared with partners via Salesforce communities.
    The data is backed up by Salesforce in its data centers but the company also backs
    up the data using a third-party AppExchange tool, which should be considered in
    terms of whether it''s compliant with regulations such as GDPR or CCPA.


    Metadata management is an important aspect of data management and using this technique,
    you can easily define your metadata in a comprehensive manner.


    In the next section, we will review core guiding principles that can be applied
    for a successful data governance program.


    # # Guiding principles for data governance programs


    Everyone understands the value of data, especially now that we have so many examples
    of data being used in innovative and creative ways. The problem is we also need
    some signposts along the way to keep us on track on our data governance journey.
    Data governance principles are these signposts that help us in making decisions
    and ensure that although the paths to get to a quality data state may be different,
    the result will be the same. Here are some key guiding principles for a successful
    data governance program.


    # ## Data is everyone''s business


    Most data that organizations have today is shareable across the enterprise. Depending
    on the type of data, multiple business functions are usually interested in it
    and, nonetheless, if an organization has matured analytical and data science practices,
    the data scientists will be interested in that data. For data to become valuable
    across the organization, it needs to be understood by its users. This requires
    that the data is consistently defined with unambiguous and agreed-upon definitions.'
  merge: -1
  img_proc: true
- pgno: 183
  md: 'Wider access to data leads to a more efficient, data-driven organization, making
    it easier to provide great customer service whether it’s internal or external
    customers. In most cases, it is more cost-effective to have a single source of
    data that can provide the information in a timely manner rather than multiple
    sources that need to then be integrated and translations performed to standardize
    it for consistent use across the organization. Data must also be protected from
    unauthorized access and policies and procedures implemented to prevent data-related
    incidents. All of these things require that everyone in the organization considers
    and feels the responsibility to treat data as an asset just like organizations
    treat physical assets. This is no different than when managing a company’s financials:
    it’s not only the Chief Financial Officer’s (CFO’s) responsibility to manage them
    but the onus is also on every employee to use the organization’s resources effectively.


    Having siloed data and implementing your own divisional system not only costs
    more at the organization level but also leads to problems trying to integrate
    that data, such as determining where fields are mastered in a scenario where multiple
    systems are updating data records. Not having proper policies and procedures in
    place to protect data can, for example, lead to treating data with a casual mindset,
    exposing the organization to serious reputational and financial repercussions.


    Another aspect of data governance is that it should not be seen as an IT initiative
    – because it is not. Data governance is rather a partnership between IT and business.
    This is important because, traditionally, many businesses see the IT function
    as the owner and custodian of data and it can lead to data quality issues and
    the inability to see the value of data and how it can add value to the business.


    # Data must be appropriately managed


    This pertains to consciously implementing the management of the data life cycle
    from the point of its inception to the point it’s archived or purged. It is always
    easier and cheaper to implement measures for good data quality rather than in
    downstream processes and systems. This was the idea behind manufacturing techniques
    such as 5S and Kanban that realized fixing a defect early in the process is much
    cheaper than fixing it once the product has been shipped.'
  merge: -1
  img_proc: true
- pgno: 184
  md: 'Let’s have a look at a simple example to demonstrate this. If a web-to-lead
    form has the **Country** field that doesn’t match with the country picklist values
    enabled in Salesforce and a prospect fills out the form and enters a country that’s
    not on the list, the lead will not get inserted into Salesforce. Rather, an email
    to the system administrator will be sent with the lead information and they can
    then enter the lead manually in Salesforce. They can opt not to do anything in
    this case and wait until the next time a lead with the same country value is entered
    and the process is repeated, or they can add it and ensure that the correct country
    exists matching the values on the website. It’s obvious that the latter approach
    is more appropriate than having to manually add the leads, notwithstanding the
    fact that if the email is missed or, for some reason, not delivered to the admin,
    the lead could get completely missed, costing the company potential revenue.


    Managing data also encompasses having data quality standards that are well defined
    so data can be appropriately measured and reported on for its quality. Data stewards
    should help define data definition standards and what constitutes quality data
    for their domain. Accountability for data quality, standard definitions, security,
    privacy, and standardization must be owned by designated roles in the organization.
    These roles must ensure that the data is used consistently with the internal policies
    of the organization and also complies with any external regulations.


    # Data must be recognized as a strategic asset


    Data must be recognized as an enterprise asset by all levels of the organization
    starting with executive buy-in. It must be communicated that data is a shared
    resource that is critical to the foundation of data-driven decision making. This
    needs to be done frequently so the strategic value of data doesn’t get forgotten
    as time passes or as new employees join the company. When an organization’s culture
    starts to value data as an asset, it prompts discussions and the need to treat
    it just like physical assets are treated. For example, does the data comply with
    regulatory requirements, how can it be tied to achieving organizational goals,
    and how reliable, timely, accurate, and complete is it?


    Another benefit of treating data as a strategic asset is that it changes the conversation
    from “my” data to “our” data as teams become more willing to share their domain
    data and assist in managing the data. For example, sometimes there are perceived
    or genuine concerns on how another division will use the data if it’s shared with
    them. Would they start marketing to my existing customers when I am also marketing
    to the same customers or start cold calling them? These types of doubts and suspicions
    can slow down the sharing of data but having a clear objective of what you want
    to get out of that data and how it’s going to be done can put these concerns to
    rest.'
  merge: -1
  img_proc: true
- pgno: 185
  md: '# Single source of truth


    IT landscapes today comprise multiple systems and databases all playing their
    role in the smooth operation of the business, but this leads to complexity by
    having multiple copies of the same data. With data-driven decision making taking
    the front seat, it has never been more important to have reliable and trustworthy
    data. Sometimes business functions within organizations debate and defend the
    data that their function produces, all of which leads to confusion and doubt about
    data. Data governance initiatives must strive to always have a single version
    of the truth that is reliable and trusted by everyone in the organization.


    # Data governance is a marathon, not a sprint


    Some may not consider this to be a principle, arguing that it’s too soft and intangible,
    but my argument is that the majority of the employee population is used to working
    on projects with a defined start and end date and expect the same with data governance
    initiatives. Although data governance will have projects as part of it with a
    start and end date and KPIs, it is an ongoing initiative. This mindset enables
    you to properly plan, allocate funding, and provide the necessary exposure and
    buy-in for data governance programs.


    In the next section, we will look at some key things to keep in mind to ensure
    a successful data governance program.


    # The keys to the kingdom – making your data governance program successful


    Data governance can seem like a daunting task given the volumes of data that organizations
    have and the number of sources this data originates from. The best approach is
    to use the crawl, walk, and run methodology. Here are some key things you can
    do to ensure a successful data governance program in your organization:


    +   • Crawl, walk, and run: This is probably the most important thing you can
    do to ensure success with your data governance program. Many companies fail with
    their initiatives because they take on more than they can handle. The opportunities
    that await once you have mature data governance programs are exciting and can
    lead to setting unrealistic targets. Do yourself a favor and focus on those things
    in data governance first that are low-hanging fruit and can result in quick wins.
    This will be beneficial in a couple of ways:

    +   - Firstly, as people start seeing results of data governance initiatives,
    it will motivate the teams that were working on them.'
  merge: -1
  img_proc: true
- pgno: 186
  md: '+   - Secondly, it will give you data for your business case for the next data
    governance initiative. As a result, your business end users who use that data
    will start demanding more, making your job even easier to get that next business
    case approved.


    +   • **Metrics:** Before embarking on any data governance initiative, ensure
    you define metrics that can be used to measure the success of your work. In the
    beginning, this doesn''t have to be very elaborate, but simple things such as
    defining the business data catalog for three domains or defining a quality standard
    for x number of domains. This gives you not only something tangible and objective
    to measure progress but also the ability to communicate the value that your data
    governance initiative is creating for the organization.


    +   • **Metadata management and data stewardship:** Since metadata provides a
    framework to ensure data is aligned with business objectives and data standards
    and policies are adhered to, the importance of metadata management must not be
    underestimated for a successful data governance program. Metadata management and
    data governance go hand in hand because metadata management provides that linkage
    between the business objectives and data. This implies that effective metadata
    management is a key responsibility of the data steward. The data steward ensures
    that the metadata gets created and that it delivers the value that the business
    wants to realize from its data.


    +   • **Iterative approach:** I mentioned earlier in this section to take baby
    steps, and one way to do that is to have a planned iterative approach. This means
    having a few weeks to a cycle when reasonable, otherwise, they might need to be
    longer, and deliver something at the end of the period. This could be something
    as simple as a catalog of business terms defined, standardized, and approved by
    all functions of the business or designating and appointing key roles such as
    identifying and training data stewards for your selected domains.


    In the next section, we will look at some of the key elements to administer data
    quality.'
  merge: -1
  img_proc: true
- pgno: 187
  md: '# # Data quality


    Since we have been discussing keys to successful data governance, it is prudent
    to briefly discuss the key aspects of ensuring data quality as well. These can
    be used by the business to comprehensively cover all aspects of data quality,
    which is a key concern for data governance. The reason I discuss this here is
    that I want to make sure that we don''t forget the connection between data governance
    and data management. The following aspects of data management provide a tangible
    connection and clarity when you are planning your governance initiative:


    +   - **Data profiling**: This is the process of reviewing source data and understanding
    its structure, content, and relationships between data. In a nutshell, it’s really
    about understanding your data. For example, in Salesforce, this would be a list
    of data sources and the fields where the data is stored. It also involves identifying
    issues with your data, such as duplicate fields on different objects that allow
    entry in both fields rather than using a relationship between objects to pull
    the data from one object and populate it into the other using an automation tool.
    A good example of this is, say, a legal address field is created on the account
    and another field on the quote, and both allow edit permissions. This means that
    these fields could be out of sync very easily. An optimal way would have been
    to make one set of fields read-only and populate them using an automation tool
    such as Process Builder or a trigger.


    +   - **Cleansing**: This involves fixing the anomalies identified in the profiling
    stage, for example, ensuring that the fields we used as an example in the profiling
    stage have the same values. Other examples include cleaning up any legacy fields
    that are not used or fixing typos in the data or errors that have been introduced
    during imports. The last one usually happens with the Opportunity stages when
    you do an import of records from another system. If the stages are not matched
    properly, the values from the other system will automatically get inserted in
    Salesforce. You will then need to fix them using the **Replace** function for
    picklists.


    +   - **Standardize**: This step includes the standardization of data so that
    the matches between data are performed optimally. The scope for this could be
    structured or unstructured data. For example, a sales rep may have entered the
    street address as 457 S Gate St; when standardized using established business
    rules, this may get updated to 457 South Gate Street. The use of single or multi-select
    picklists is another example of standardization and is commonly used throughout
    the platform. For example, when an opportunity is lost, sales managers want to
    know why it was lost, so rather than providing a freeform text field, you can
    provide the values in a picklist that the sales rep can choose from. As a bonus,
    you can make a freeform text field available should they wish to provide additional
    details.'
  merge: -1
  img_proc: true
- pgno: 188
  md: '**Caution with multi-select picklists**


    Multi-select picklists are a great way to standardize data in your environment
    but you must also be aware of the downsides of using them. Reporting can be really
    tedious and limited, with multi-select picklists requiring the use of CONTAINS,
    INCLUDES, or EXCLUDES operators, which can severely impact performance for large
    datasets. The grouping of data can also be very challenging with multi-select
    picklists. For example, if you have selected Edmonton, Calgary, and Toronto in
    one record, Edmonton and Toronto in a second record, and just Toronto in the third
    record, you will not be able to group the records to show those that have just
    Toronto in them as the chosen value.


    A major limitation is also that you cannot track changes on these types of fields,
    for example. Unlike most other field types that show you the old and new values,
    multi-select picklists only show that the field has changed - not exactly what
    changed. They also work with a very limited number of functions in a formula.
    Refer to this Salesforce Help article to review the complete list:

    https://help.salesforce.com/articleView?id=sf.tips_for_using_picklist_formula_fields.htm&type=5.


    +   - **Match and merge**: In this stage, you would apply the different techniques
    available (probabilistic or deterministic) to determine matches and merge the
    records. You apply data survivorship rules to arrive at that single record that
    is the most accurate and complete.


    +   - **Monitor**: Once you have gone through the previous steps, you now need
    to monitor the health of your data using various processes and tools that are
    available. This is especially when data governance processes and the data steward
    role become very important. The data steward can use reports and dashboards to
    monitor the state of data along with third-party or customer tools that can help
    make their job easier.


    There are many tools that can be used to ensure data quality, some of which are
    free. RingLead''s Field Trip app is one that has very good reviews and is well-liked
    by the admin community. Salesforce also offers an app called Data.com Assessment
    App v3.2, which is privately listed on AppExchange (https://appexchange.salesforce.com/listingDetail?listingId=a0N3000000puBxEAI).
    Another offering from Salesforce is their accelerators. These are sessions with
    a Salesforce expert that would guide you on your specific use cases for data quality
    and governance. I would suggest contacting your account executive to get help
    on which ones you should start with. If you are a Premium Support customer, these
    are included free of charge with your subscription.'
  merge: -1
  img_proc: true
- pgno: 189
  md: 'In this section, we reviewed the key items to implement a successful data governance
    program. In the next section, we will discuss key elements of a Salesforce data
    governance program.


    # Successfully governing Salesforce


    So far, we have discussed what data governance is, its benefits, and principles
    to keep in mind when implementing data governance. In this section, I want to
    delve deeper into governance in general from a Salesforce perspective because
    merely having data governance policies and procedures laid out will not help;
    rather, all of the five components discussed in this section need to come together
    to produce results that a world-class organization would hope to realize.


    Many customers somehow form the notion that because Salesforce is in the cloud,
    changes can be made directly in production or do not have sufficient input and
    involvement from IT. In other cases, customers may have worked with traditional
    on-premises systems and desire a platform that can keep pace with the changes
    that the business requires and view Salesforce as a platform that requires little
    or no governance. Salesforce, just like other platforms, whether on-premises or
    in the cloud, requires governance for the continuous optimal operation of the
    platform.


    The five components we will discuss in the following subsections are not meant
    for an academic discussion but rather positioned as practical steps that you can
    take to govern your Salesforce implementation effectively.


    # Vision


    You may have worked on those projects where the project team painstakingly worked
    to deliver a great solution only for it to be rejected by the business in the
    end because it didn''t meet the expectations. This is the why (the goals) of the
    initiative or project. It attempts to answer the rationale of the initiative,
    the strategy to realize those goals, and the benefits that the company hopes to
    realize from the initiative. Vision also provides clear and objective KPIs to
    measure whether the benefits have been achieved by the company or how closely
    the company is tracking those objectives. Keep in mind that every Salesforce initiative
    should align with a business goal that is going to be achieved. For example, if
    major releases require extensive testing and the architect is requesting funding
    approval for an automated test tool, there must be a business benefit that should
    be achieved from this. In this example, it could be that business resources have
    to have been involved in testing for major releases requiring them to be pulled
    from their daily jobs or other projects. Therefore, we will eliminate the need
    to pull in five resources for a week for user acceptance testing at the time of
    every major release.'
  merge: -1
  img_proc: true
- pgno: 190
  md: 'There are multiple benefits of documenting the vision. A major benefit is that
    it facilitates decision making because stakeholders have agreed on the vision
    and the strategy. Therefore, high-priority items that align with the vision can
    be delivered first. Sometimes, despite following project management methodologies
    and practices, there is still a communication gap and stakeholders are not aligned.
    In such cases, having a documented vision and strategy benefits you by removing
    that ambiguity and giving everyone the opportunity to align themselves and their
    expectations with the vision.


    By defining well-thought-out KPIs upfront, project leaders can evaluate the success
    of ongoing and delivered initiatives and, of course, correct them if needed. It
    eliminates the mistake that many companies make where a project is launched with
    a vague understanding of business goals that the company wishes to realize. In
    some cases, the goals are such that they cannot be measured objectively. And once
    the delivery is complete, there is no measure of whether the business objectives
    are being achieved or not.


    Another benefit is that it creates alignment between business and IT and gives
    the business a sense of ownership, increasing the chances of the solution getting
    adapted by the business, driving the success of the project. Let''s look at the
    steps in creating a vision document.


    # Creating a vision document


    There are a few steps in creating a vision document:


    +   • **Identify stakeholders and business goals**: This step involves identifying
    all of your internal and external stakeholders that will be impacted by the initiative.
    Part of identification is also doing a stakeholder analysis, which is to understand
    each stakeholder.


    Stakeholder analysis

    A key component of stakeholder management, stakeholder analysis is the process
    of identifying internal and external stakeholders that have an interest in the
    project and can influence it. It helps in understanding the needs of the different
    stakeholders and allows the project team to balance competing priorities and a
    way to address stakeholder interests. It also includes stakeholders'' preference
    for mode of communication and how frequently they would like to be informed of
    the project progress.'
  merge: -1
  img_proc: true
- pgno: 191
  md: 'Once the stakeholders have been identified, you will want to collaborate with
    them and identify the business goals and the strategies that have been defined
    to achieve those goals. You may find that some stakeholders may not have a clear
    idea of how to achieve their vision, in which case, they may also need to define
    their strategies.


    +   Identify operating principles: Consider principles as a set of rules that
    will be used in the decision-making process. For example, it is important to identify
    whether the project will be run using the Agile methodology or the company is
    expanding rapidly via acquisitions and scalability for painless operations in
    the future. Another one could be that customer experience is a top priority to
    expand the service part of the business and that will an important factor in decision
    making.


    +   KPIs: Ensure that you have discussed and agreed upon a set of KPIs that will
    be used to measure progress and benefit what was initially proposed. Ensure that
    you have two to three KPIs at most and make sure they can be objectively measured.
    In fact, I recommend defining the method by which these KPIs will be measured
    in the document as well. That way, there is no ambiguity on how the KPIs should
    be measured.


    Once you have the vision document defined, the next thing you will want to define
    is to have a solid communication strategy.


    # Communicating with stakeholders


    The communication strategy creates the alignment between stakeholders, especially
    from a user''s perspective as they understand the need for the new tool, how they
    will be impacted, and the benefits that the system will bring to them. You should
    consider forming personas for communication that will help you tailor your communication
    and these could be based on the roles that constitute your stakeholders; for example,
    a persona could be built for executives, senior managers, and analysts. Having
    communication profiles created is immensely helpful because it lets you tailor
    your communication and provide just the right level of detail to each stakeholder
    profile.


    A good communication strategy will proactively address questions that could be
    asked by executives down to the end user and ensure that your stakeholders can
    provide candid feedback without any fear of repercussions. If this is not possible,
    encourage them to contact you directly and ensure you take action and provide
    updates back to the stakeholder. Expect some resistance if your project is truly
    transformational in nature, but it’s better to hear objections and concerns at
    this point than hearing it when the solution is developed and ready for production
    deployment.'
  merge: -1
  img_proc: true
- pgno: 192
  md: 'A communication strategy document also helps cut through the noise given the
    volume of information that everyone is bombarded with but having a well-articulated
    strategy that is understood by all levels will greatly increase the success of
    your implementation.


    # # Creating a communication strategy


    A communication strategy involves answering the five Ws and the How question:


    +   - **Why?**: Give the details of why the initiative is being undertaken. Explain
    the business value to the organization and try to link it with departmental, team,
    and personal goals, if applicable. This is a good way to motivate and create buy-in
    for your project.

    +   - **What?**: What is being done and what will be done differently going forward.
    This question also addresses the channels that will be used to communicate with
    stakeholders, for example, email, group chat messages, and meetings.

    +   - **When?**: This is about communicating when the change will impact them.
    This should be well understood and communicated. For instance, sales teams usually
    dislike system changes at the end of a quarter or a major change being introduced
    close to the year end.

    +   - **Where?**: This addresses the question of where stakeholders can go for
    more information, concerns, questions, or feedback.

    +   - **Who?**: This is about who is being impacted: the business functions, regions,
    or divisions? This can also define the roles and responsibilities of the teams
    that are part of the project, which can help communicate exactly the resources
    that have been allocated to the project and identify any stakeholders that may
    have been missed.

    +   - **How?**: This addresses the frequency of the communication, that is, is
    it daily, weekly, monthly, or some other frequency that suits the recipients.


    Do not underestimate the importance of communication as that can be a deal-breaker
    to the success of your initiative regardless of how well the solution is built.


    # # Data architecture and governance


    As we have been discussing in previous chapters, data is an asset that must be
    managed just like physical assets that organizations have. This requires understanding
    and documenting how data is architected and flows through systems in the organization.'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'An important aspect in defining data architecture is to keep the business architecture
    at the forefront because the latter reveals the structure of an organization in
    terms of its processes, capabilities, and information. Since information forms
    a key component of business architecture, you need to make sure you are aligned
    with the goals of business architecture when developing your data architecture.


    Once the business architecture is understood and the data architecture is defined,
    you move on to the ongoing treatment of data, that is, how new data will be brought
    and cleansed and how existing data will remain in good quality. A very important
    component of this is data backup and archiving.


    Data architecture and governance make it easy to maintain the reliability of your
    data over the long term and provides a clear understanding and guidance, since
    the physical state of data is also defined and available, on how to treat data
    anomalies or scenarios where there are large volumes of data. Having the data
    architecture drives easier integrations with other systems, prevents technical
    debt in the organization, and improves the user experience because there are clear
    guidelines on treating data as it passes through the data life cycle. For example,
    archiving opportunities once 3 years have passed from the time of the Close Date
    field on the Opportunity object will run reports quickly or the list views will
    load in a timely manner.


    Let''s discuss the practical steps in creating the artifacts to define and understand
    data architecture in the context of data governance.


    # Creating data architecture and governance


    The result of doing this exercise could be a combination of artifacts but what''s
    more important is spending the time and thoroughly going through these steps to
    understand the business intent. Then we can translate it into a workable solution
    that will facilitate the needs of the business rather than slowing them down:


    +   • Business architecture and roadmap: It is imperative that the business architecture
    and the roadmap are defined and considered. It ensures viability from a cost perspective
    and scalability to accommodate future needs of the business when the data architecture
    is defined.


    +   • Physical data architecture: This is the detailed database-level architecture
    that should be defined keeping the business architecture in view. The physical
    data architecture is what makes it easy to integrate systems and quickly conduct
    impact analysis when changes to existing data architecture are required. Not having
    this leads to spending hours and hours deciphering and making fundamental mistakes
    when defining the physical data model.'
  merge: -1
  img_proc: true
- pgno: 194
  md: '+   - **Data governance**: This defines what data will be managed and identifies
    the processes, policies, and roles that are needed to ensure data quality and
    the protection of data. With so many sources of data and huge volumes of data
    generated every day, it is imperative to have clear policies, roles, and responsibilities
    on how to treat data during its life cycle. It also defines when access to data
    should be provided, to whom, and for how long.

    +   - **Data backup and archiving**: This defines the policies, procedures, and
    tools needed for data backup and archiving. From a Salesforce Platform perspective,
    this is probably the most overlooked area because until problems start to happen
    with data, no one will even notice it.


    In the next section, we will review technical change control.


    # Technical change control


    This pertains to applying software engineering processes and industry best practices
    when developing and maintaining software solutions. This involves processes and
    policies around the development of the solution, environment management. It also
    involves details about where different types of tests will be conducted; for example,
    full testing of the solution should be done on a full copy sandbox. Having an
    effective technical change control mechanism will assist in the goal of maintaining
    metadata management effectively. This is because technical changes will go through
    a known process and get communicated and documented on their way to the production
    environment.


    Another aspect of technical change control is technical governance. For instance,
    how the solution is built, whether it follows best practices, whether it respects
    governor limits, whether it''s scalable for future expansion, and how paintable
    the solution is. This would also include the release cadence for releases. A critical
    break-fix type release needs to be put into production on the same day versus
    a new initiative that is ready for production; promotion may need to follow the
    usual bi-weekly or monthly cadence. All of these details should be laid out clearly
    to avoid confusion and prevent any mistakes from happening that could adversely
    impact the production environment.


    In the beginning, it may seem like a lot of work, but it makes IT more responsive
    to change requests from the business. Remember, businesses have to change at a
    rapid pace today to remain competitive and if IT cannot keep pace, the business
    will abandon the use of the solution or, worse yet, turn to other siloed solutions
    that may not be aligned with the business goals and architecture of the organization.
    It also minimizes the impact on end users since they are aware when changes are
    promoted to production, and an additional benefit is that it establishes trust
    with IT because they are following a controlled process for changes.'
  merge: -1
  img_proc: true
- pgno: 195
  md: '# Implementing technical change control


    Effective technical change control will increase velocity, reduce risk, and prevent
    resources from getting overwhelmed with the amount of change that they have to
    deal with. Start with the following steps to implement a technical change control
    process:


    +   1. **Document current state**: This step pertains to documenting your process
    of solution design, the principles used to make decisions in design, tools and
    methodologies used for development, development standards, and best practices.
    Documenting this allows you to communicate with other stakeholders and to compare
    your practices with Salesforce recommended practices.


    +   2. **Gap analysis and future state**: This involves doing a gap analysis of
    where you are with respect to industry and Salesforce best practices. For example,
    in an organization that is heavy on developers, most things are done through code
    rather than doing an analysis of whether the same could be achieved with configuration.


    +   3. Once you are done with the gap analysis, the next step is to determine
    the optimal future state. Notice I didn''t say ideal but rather optimal because
    this is a continuous improvement process and as Salesforce evolves, you will need
    to evolve your organization and, therefore, there is no constant ideal state.


    +   4. **Plan and move to an optimal future state**: This involves planning and
    moving from the current state to your optimal future state. A key ingredient for
    success here is to ensure that you are taking small steps rather than making a
    big jump towards your future state.


    +   5. **Monitor and tweak**: No plan is perfect and this will not be perfect
    either so once you have moved to the new state, monitor how things are panning
    out and seek feedback internally, but also check what others are doing in similar
    industries. Then make incremental changes to improve your current process and
    remember this is a journey, so continue to do so as you gain more insight into
    what''s working and what''s not working.


    Let''s review the last foundational piece of the puzzle, that is, the business
    backlog.


    # Business backlog


    The **business backlog** is dependent on the business roadmap. A roadmap should
    be created taking into account all current and anticipated projects with each
    project mapped to a business objective. This roadmap is reviewed regularly based
    on changes in organization priorities, re-organizations, or after a major Salesforce
    release.'
  merge: -1
  img_proc: true
- pgno: 196
  md: 'The backlog is created from the roadmap in partnership with IT based on the
    business priorities that will return the most **Return on Investment (ROI)** and
    that align with the vision and strategy of the organization. Having a business
    backlog provides a path for alignment between different business units and transparency
    as everyone involved understands the importance of the prioritized items in the
    backlog and how they contribute to the organization’s strategic goals.


    A business backlog will also allow the business to optimize its investment and
    realize optimal ROI. By clearly mapping the backlog items with business objectives,
    it introduces objectivity in the process, thereby reducing or eliminating altogether
    any chances of internal politics to influence decision making.


    # Creating a business backlog


    Before you can start creating a business backlog, ensure you have a roadmap created.
    This is done by understanding the business vision and strategy and communicating
    with the executive stakeholders to understand what’s on their minds. Then you
    create a roadmap of the initiatives identifying any dependencies between projects
    so they can be acted upon appropriately. The following are the points to consider
    while creating a business backlog:


    +   - **Understand Salesforce''s capability roadmap**: This involves understanding
    the capability roadmap of Salesforce for the initiatives identified in the roadmap.
    This is important for the backlog because you may be planning to implement something
    in the next 2–3 months, but Salesforce may be releasing the same functionality
    in its next major release. Knowing what’s upcoming in the next releases will help
    you guide the prioritization for the roadmap, thereby optimizing the organization’s
    investment.


    +   - **Developer backlog**: Once you have the roadmap defined and understand
    the Salesforce roadmap, the next step is to meet and discuss with the stakeholders
    to start identifying the top priority items for the backlog. Once again, this
    priority should be based on the vision and strategy document and it should clearly
    identify the value that the business wishes to realize from the initiative.


    +   - **Refine backlog**: Once you have the first pass completed, develop the
    backlog, review it with the business stakeholders again, and refine it. Usually,
    at this time, new items that got missed last time around pop up.


    +   - **Communicate**: Ensure you inform the stakeholders once the backlog is
    complete. Ensure that you are reviewing the roadmap and the backlog on a regular
    basis and especially as major changes happen within the company, such as re-organizations,
    acquisitions, and switches to a multi-org strategy. As updates are made to the
    roadmap, ensure that the backlog is aligned with it as well.'
  merge: -1
  img_proc: true
- pgno: 197
  md: 'We have discussed in this section governance in Salesforce holistically, including
    data

    governance. This should have provided a foundation that you can use to implement

    this learning at your organization. The key learning is to start small and focus
    on the

    low-hanging fruit. This helps showcase the benefits achieved and builds momentum
    that

    can then be used toward larger, more complex data governance initiatives.


    In the next section, we will discuss assessing the current state of data governance
    and the

    tools available to assist in the process.


    # # Assessing the current state of data governance


    We have discussed data governance and how it’s different from data management
    and the

    ways to implement data governance policies with respect to Salesforce. But before
    we start

    to implement data governance policies and tools, it’s recommended to do a current
    state

    assessment. The reason is that every organization has some form of data governance
    in

    place and there is no need to scrap these practices. Rather, we need to understand
    what

    these are and identify the gaps. After we validate and realize that the existing
    policies are

    adequate, we can turn our attention to these gaps and ensure they are taken care
    of.


    In the following sections, we will discuss what a data governance assessment is,
    some of

    the challenges that we may face in an assessment, and high-level steps on how
    to go about

    doing it.


    # # Assessing the current landscape


    The goal behind a data governance assessment is to document the knowledge, skills,

    and attitude about data governance. The following are some questions that will
    help you

    understand the data managing environment:


    +   - How much awareness is there within the organization with regard to clean
    data and

    +     its importance?

    +   - Does everyone interacting with data understand the impact of their actions?

    +   - Does the organization take measures to ingest accurate and clean data right
    at the

    +     source or does it wait until it gets the data and then reactively validate
    the data?

    +   - Is there a clear understanding of which fields are updated by the marketing
    tool

    +     versus which are mastered in Salesforce, or are the account records updated
    by

    +     multiple departments leading to inadvertent data loss and accuracy issues?'
  merge: -1
  img_proc: true
- pgno: 198
  md: 'These are all examples of what a current state assessment would help to flush
    out and get documented.


    # Challenges with data governance assessments


    There are some challenges with doing assessments attributable to a few factors.
    These are related to the depth of assessments, the type of organization being
    assessed, and, in general, the lack of a robust set of standards when it comes
    to assessing the organization, which introduces the risk of subjectivity.


    A common issue with assessments is that they are done as a result of a knee-jerk
    reaction. This is usually when a significant data-related incident happens, and
    the focus turns to data. These are usually short-lived and don’t create the necessary
    buy-in that is required for data governance initiatives. The sequence of events
    unfolds such that the assessment is done in the heat of the moment and then there
    is no meaningful action taken. That is why it is important to recognize data as
    a strategic asset so long-term investments can be made in data governance-type
    initiatives and the organization can fully reap data-related benefits.


    When doing an assessment, you would want to evaluate against defined metrics but
    when there are no metrics available, then that makes it challenging for an objective
    assessment. I would recommend exploring the organization’s industry and determining
    what other companies in the same industry are doing. Industry-focused associations
    can also provide data that can be used as a basis for metrics, such as the **National
    Automobile Dealers Association (NADA)**, which represents new car and truck dealerships,
    or the National Association of Realtors in the **United States (US)**. These types
    of associations collect data from their members for improving their services,
    advocacy, and other reasons and since data is becoming such a critical asset,
    they may also have data that can be used as a metric.


    Another challenge worth mentioning is performing an assessment using internal
    resources. This is not to cast a doubt on the skills and experience of internal
    teams, but blind spots are mostly discovered when an external party does an assessment.
    Another benefit of having an external assessor is that they’ll presumably have
    the experience and the skills necessary to perform such an assessment after having
    done it for multiple other clients and industries.


    Let’s look at the steps to go about doing an assessment.'
  merge: -1
  img_proc: true
- pgno: 199
  md: '# Conducting an assessment


    In this sub-section, we will discuss the high-level steps on how to conduct an
    assessment. Keep in mind that you may need to tailor these to suit your needs
    and the type of organization you are doing the assessment for:


    +   * Stakeholder analysis: Complete a stakeholder analysis by asking the key
    contact(s) at the organization about the team members and their roles who will
    be part of the assessment. Try to gather as much detail as possible about these
    team members, including their areas of expertise, skills, and experience in the
    organization. This will help you put things into context when you are reviewing
    the documentation. Since data governance is a business and IT partnership, ensure
    you have good representation from each area.


    +   * Review documentation: Review existing documentation to understand the current
    practices and tools that are in use today. Make sure that you start with reviewing
    the organization''s strategic objectives and short-term goals as they will help
    form the context for current state documentation.


    +   * Business requirements: Once you have reviewed the current state documentation,
    it is time to start interviewing the key members that were identified earlier.
    Ask questions to clarify your understanding of their current state and identify
    their requirements and pain points.


    When you are interviewing your users, your users will also share scenarios of
    data quality issues. It is best to document them in a data quality issue log to
    pass on to the relevant stakeholders so they can take remediating actions.


    +   * Assessment report: Create your assessment report highlighting existing practices,
    business requirements, pain points, and the gaps that you identified. Make recommendations
    on how to fill in the gaps and alleviate the pain points that the stakeholders
    shared with you. Use the metrics that the business already has, identify metrics
    that the business should be targeting, or use the metrics that are suggested in
    the next section. The recommendations should be in the light of our discussion
    in the Successfully governing Salesforce section.'
  merge: -1
  img_proc: true
- pgno: 200
  md: '# Common data governance metrics


    In this section, we will discuss some of the common metrics that can be used to
    measure the maturity of your data governance initiatives. These are grouped into
    categories to provide a more holistic approach to measuring success rather than
    just having metrics that focus on one aspect of data governance, that is, data
    quality:


    +   • Data quality: Perhaps the most common data governance metric, the following
    are the key attributes of data quality:


    +   a) Completeness: This relates to how comprehensive the data is. Suppose that
    you ask a customer for their cell phone, home phone, and work phone numbers and
    the customer provides their cell phone number only, but from a practical standpoint,
    the data is complete. Metrics for this include the percentage of data fields that
    include the needed information.


    +   b) Accuracy: This data attribute reflects how much the data reflects reality.
    For example, if the CRM has the contact''s email but the contact has changed companies
    and has a new email, that record would not be considered accurate. This would
    also include typos that make their way into the system during data entry. Metrics
    for this include measuring the ratio of data to errors, so a high ratio would
    mean that the data is clean whereas a smaller number would signify problems with
    the data.


    +   c) Auditability: This pertains to ensuring that changes made to data are auditable
    and can be traced back to where, what, and who made the change. Some example metrics
    include the percentage of untraceable data with respect to changes and the percentage
    of data that has been altered.


    +   d) Timeliness: Data is available in a timely manner when needed. If you make
    a request to your sales operations team for a copy of a contract for a specific
    customer so that you can negotiate an up-sell opportunity better, you will expect
    to receive the data in a timely manner. The metric for this attribute is the timely
    availability of data, which measures how quickly the data is available after a
    request is made. The request could be manual or automatic but regardless of the
    medium, care must be taken to set reasonable expectations around this metric.
    One executive may be fine getting the data in a 3–4 hour window after a request
    has been made whereas another executive may expect the results to arrive within
    minutes of submitting a request.'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'e) Validity: This measures whether the data is actually valid. For example,
    the data may be available in a timely manner and is auditable, accurate, and complete
    but if it’s not in the correct format, it may be useless. Consider the example
    of date fields and whether a date of birth is entered in the field; does 02/03/1999
    mean March 2, 1999, or February 3, 1999? Metrics for this attribute include the
    percentage of fields that follow the defined standard.


    f) Uniqueness: This attribute is concerned with how many copies exist for the
    data. Having two duplicate contacts, for example, can be very confusing because
    you don’t know which one is the real one that the sales team is working with.
    Metrics for this attribute include measuring the percentage of duplicate data
    in the objects. The higher the percentage, the more duplicate records there are
    in the system.


    g) Consistency: This relates to how much consistency there is with respect to
    data across the organization. For example, if the CRM has Peter Simpson as a contact
    with a free email account but there is a contact in the ERP by the name Peter
    Simpson with an official work email, are these two records referring to the same
    person or different people? A metric for this includes measuring the consistency
    of records between systems and applications.


    Let’s continue reviewing the other metrics for data governance.


    +   Data controls: This measures compliance with the controls that the company
    has put in place with respect to data. Metrics in this category can include the
    percentage of completed metadata (such as description fields populated for objects,
    fields, Process Builder, and the like), frequency of data backups, and the number
    of data security-related issues rectified.


    +   Organization: This measures the skills, training, and overall organization’s
    maturity in terms of data governance. Metrics for this include the percentage
    of employees trained in data governance practices and the number of business owners
    identified and assigned to each business domain (such as sales, finance, and supply
    chain).


    +   Infrastructure: This is related to measuring progress on the physical infrastructure
    supporting data-related activities. Metrics for this include the number of systems
    using MDM and the consolidation of systems resulting in a percentage decrease
    in the total cost of ownership.'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'We discussed in this section the benefits of current state assessments, the
    challenges, and how to go about doing an assessment. I also presented some metrics
    that can be used as a starting point for your data governance initiatives. It
    should be noted that there are other metrics that can be used as well such as
    data security, data accessibility, data encryption, and others. It''s up to the
    organization to decide what is important to track and measure but always start
    with a select few metrics and work your way upwards as data governance practices
    mature in the organization.


    I want to end the section by briefly discussing the importance of maturity models,
    which can provide a good foundation for objectively assessing your data governance
    practices. I will not go into the details of each model because that is outside
    the scope of this book, but I provide a few pointers in the next section so that
    you can do your own research and determine whether they''re something you would
    like to use.


    # Need for data governance maturity models


    We have looked at how managing data can be challenging due to various factors
    such as increasing sources of data, the volume of data, decentralized operating
    models, and others. There are also organizational and cultural barriers and conflicting
    agendas that can make data governance programs challenging to implement. Another
    challenge is that funding is limited and because the fruits of data governance
    efforts take time to bear, it is not straightforward to prove the ROI. Especially,
    funding models in organizations lean toward project-based work whereas data governance
    is a program requiring continuous effort with appropriate resources and funding
    to realize the true value of data.


    Capability maturity models provide a framework through which assessing the current
    state of data is made easier along with deriving objects that the organization
    can use to work toward higher capability. These models were traditionally applied
    to software development processes but have been applied to processes governing
    data as well. These models also provide a framework to determine what level of
    data maturity is required by an organization and what would be required to move
    to the next level.


    Here are a few other reasons why organizations might decide to invest in a data
    maturity model:


    +   - **Strategy**: Implementing a data governance program may seem like a daunting
    task with a lot of areas to address. A data governance maturity model can be the
    bridge between feeling lost and where to start implementing governance to a blueprint
    that can be used to start implementing data governance processes.'
  merge: -1
  img_proc: true
- pgno: 203
  md: '+   • **Benchmarking**: Businesses are interested in intelligence related to
    their competitors or just generally their industry. This can be a good way to
    justify the business case for data governance initiatives especially when you
    are not performing as well as your competitors or the industry that you operate
    in.


    Another reason why benchmarking can be important is to assess the performance
    of regional or country-wide units for the same business. Keep in mind that even
    in the same company, practices related to data governance will be different, especially
    in a decentralized operating model.


    +   • **Acquisitions and mergers**: Maturity models also provide a tool to have
    objectivity in assessing another business that you may be acquiring or merging
    with. Data issues are a significant source of issues that, if very significant,
    can prevent companies from proceeding with mergers or acquisitions. When making
    these transactions, you can use the maturity models to not only assess but also
    get a high-level understanding of what you would need to do to integrate the two
    companies if that fits with your Mergers and Acquisitions (M&A) strategy.


    +   • **Regulatory compliance**: Depending on the nature of the business, there
    might be certain regulatory constraints that the organization must comply with
    in terms of data governance and management. Maturity models provide a framework
    for regulatory bodies to assess organizations and require them to meet certain
    requirements in order to qualify or maintain compliance. They may not necessarily
    say that you need to be at a certain level. Suppose that the business must be
    at level 4 but provide guidance that makes the organization achieve that level.


    +   • **Progress tracking**: A framework is also a way to report progress and
    communicate the roadmap to achieving mature data governance practices. Most maturity
    models have a numbering system that represents levels within the model and indicates
    the level of maturity, therefore making it easier to communicate the current state
    and vision for data governance.


    There are many capability maturity models, such as Oracle’s data governance maturity
    model, Garter, and then there are others from educational institutes such as Stanford
    University and Open Universiteit Nederland. You can read about these on the internet.
    There are many considerations and nuances to consider when choosing a maturity
    model and my recommendation is to consult with a data governance specialist who
    can guide you through this process.


    In the next section, we will discuss privacy regulations and the tools in Salesforce
    to stay compliant with privacy laws.'
  merge: -1
  img_proc: true
- pgno: 204
  md: '# # Data privacy and privacy laws


    There is a growing trend in the business community to collect data and then use
    it for trends, reporting, forecasts, and various other things. But with the growing
    data collection, consumers have also become wary of how their data is stored and
    used and for how long. A growing number of well-established companies have also
    been hit by bad actors that have hacked into systems and stolen millions of consumer
    records, putting them at risk, including the Yahoo data breach a few years ago,
    which resulted in a whopping 3 billion user accounts being compromised.


    Governments around the world have been enacting legislation and enforcing them
    to ensure consumer data is protected with an expectation for the transparency
    of this data. These regulations significantly impact how businesses can collect,
    store, and handle consumers'' personal information. This legislation is intended
    to provide transparency of how consumer data is used but also legal recourse for
    consumers in situations when there is non-compliance.


    This means that organizations that are not proactively assessing and implementing
    measures to comply with these regulations may be exposing themselves to hefty
    fines and penalties from regulatory bodies. Not only that, but it also exposes
    these organizations to massive reputational risk if they are the subject of a
    cyber-attack. In the last few years, many well-known businesses have been targeted
    and their users'' data exposed, eventually forcing them to pay millions of dollars
    in penalties and rebuild a tarnished brand. For example, British Airways was fined
    around $30 million following a data breach that resulted in exposing the personal
    and credit card data of 400,000 users in 2018.


    Over the years, governments have proactively, and other times reactively, enacted
    regulations to protect the personal information of consumers. While it is out
    of the scope of this book to discuss all of these, I will mention a few to provide
    context and then delve into more detail about regulations, specifically GDPR and
    CCPA:


    +   * **GDPR**: At the moment, GDPR is probably the most comprehensive and toughest
    privacy legislation enacted to protect consumers. It was developed by the **European
    Union** (EU) for citizens of the EU and companies that deal with data for individuals
    living in the EU.


    +   * **CCPA**: This was enacted and came into effect in 2020. Its main purpose
    is to protect the data of California residents and enable residents to decline
    the sale of their personal information or to know what data the business has collected
    about them, among other things. Although not as stringent as GDPR, it can still
    charge heavy penalties for non-complying businesses.'
  merge: -1
  img_proc: true
- pgno: 205
  md: '+   • Gramm-Leach-Bliley Act (GLBA): Enacted in 1999, it deals with companies
    that provide consumer loans, financial advice, and other financial products. The
    law requires that companies explain their data sharing and protection policies
    to consumers along with putting in controls to protect consumers'' data that these
    types of companies have.


    +   • Payment Card Industry Data Security Standards (PCI-DDS): This is not a government
    regulation per se but an independent body; the PCI Security Standards Council
    enforces this for companies that accept, store, or transmit credit card data.
    An interesting thing about PCI-DDS is that it even applies to businesses that
    use third-party vendors for their credit card processing. So, it is up to the
    business to ensure that the vendors they use for payment processing comply with
    PCI-DDS.


    +   • Nevada''s Senate Bill 220: This came into effect in 2019 after Nevada followed
    California''s lead in enacting the bill. Although it has similar provisions to
    the CCPA, one key distinction is that individuals under the Nevada bill cannot
    take legal action against companies, but the attorney general can impose fines
    for non-compliance.


    In the coming sections, we will discuss in more detail the need for privacy laws,
    understand the difference between data privacy and security, and delve into more
    details of GDPR and CCPA.


    # Understanding the need for privacy laws


    Unbeknown to many, the right to privacy is part of Article 12 of the Universal
    Declaration of Human Rights (UDHR), which means that it is a basic human right
    to have privacy. Technological advancements in the last few decades have made
    it easier for governments and corporations to exploit data and use it for surveillance
    or commercial purposes, respectively. This was especially brought to light when
    Edward Snowden blew the whistle on the National Security Agency''s (NSA''s) spying
    programs. This highlighted the need for legislative bodies to have oversight and
    governance to ensure programs such as these don''t poach an individual''s right
    to privacy.


    An example of private entities using consumer data to benefit commercially is
    the Cambridge Analytica scandal, which used the data of Facebook consumers without
    their consent to influence voting in the US 2016 elections. With stringent privacy
    laws in place and their enforcement in full effect, private corporations know
    where the boundaries are and what the repercussions could be should they violate
    them.'
  merge: -1
  img_proc: true
- pgno: 206
  md: 'People when they are young sometimes post content online that may not be deemed
    appropriate and reduce their chances of employment later in life. Another aspect
    of this is the posting of explicit and intimate images of people by former romantic
    partners for the purpose of exacting revenge. This can potentially lead to destroying
    a person''s life. Having privacy policies in place provides a way to remediate
    and prevent these types of incidents from happening. The GDPR''s right to be forgotten
    law gives individuals the ability to request the complete removal of their information
    from the entity that is storing their data.


    Freedom of expression is another right that is protected because of privacy laws.
    Imagine being tracked for everything that you say or write and then that information
    being used against you by employers, banks, or other public institutions. Having
    privacy laws protects this freedom of expression and also gives you control over
    your data. They let you decide where, when, and how your data can be used and
    prevent your data from being exploited by powerful corporations and individuals.


    Another aspect of freedom of expression is the right to engage freely in politics.
    Privacy laws protect that right by allowing you to vote based on your political
    viewpoint without any negative repercussions. This is the reason why vote casting
    is considered confidential and you are not obliged to tell anyone who you voted
    for, including your employer. This is also very important for family members as
    well where one member may not necessarily agree with the political viewpoint of
    another and vote differently.


    A fundamental value to function in society is trust. Privacy laws help form and
    grow that trust. What bank would you choose to do business with? One that sells
    your data for commercial reasons to a multitude of data gathering companies that
    sell it to interested parties or one that has policies and procedures in place
    and is transparent with you about how they protect and treat your data? That''s
    one reason why laws such as PCI-DDS exist, to protect your personal data from
    being misused as well as protecting your financial information. You may have noticed
    many websites prompting you to subscribe by entering your email and displaying
    a message to the effect that your data is never sold but only used for such and
    such purpose. They are trying to be transparent with you and assure you that your
    data is not used for anything other than the stated purpose.


    In the next section, we will review the difference between data privacy and security.


    # Securing data versus the privacy of data


    It is important to understand the difference between data security and privacy.
    They are not the same but are interlinked and crucial for an organization to protect
    data. It may be worth mentioning that protection is not the sole responsibility
    of the IT department, but rather a holistic, organization-wide approach is needed
    with proper training and accountability so everyone feels and acts in ways that
    can ensure the protection of data.'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'Data security is concerned with protecting your data from unauthorized access
    and malicious use. The way this is achieved varies from organization to organization
    and depends on the volume, type of data, and other factors that will drive the
    need for appropriate tooling and procedures. Data privacy, on the other hand,
    deals with policies and processes that define how you can collect, use, share,
    and discard data that is in your purview. Compared to data security, it is more
    universal since the laws apply to a wider base. However, there may be laws or
    rules that are imposed on certain industries or associations that the business
    is part of. For example, the PCI Security Standards Council is a private entity,
    but it imposes rules regarding data that member organizations must follow to gain
    or maintain their compliance with the standard.


    # Understanding the business risks


    As a data architect, you must be cognizant that when organizations start collecting
    and processing personal data, there are inherent risks that the organization is
    undertaking that must be properly understood to put risk mitigation strategies
    in place. It is your responsibility as a data architect to point these out so
    appropriate team members (for example, the privacy law officer) can be pulled
    into these conversations so the risks are discussed and appropriate action is
    taken to address them.


    Keep in mind that the privacy laws are not there to stifle businesses but rather
    to attempt to balance the need for data by businesses versus respecting and protecting
    individuals'' data privacy. Here are a few common risks that businesses are generally
    exposed to when dealing with personal data:


    +   - **Lack of control around data access**: Some organizations lack control
    around who can access personal data and whether it''s required for them to access
    it based on their job function; that is, access to personal data must be based
    on a *need-to-know* basis. This also ties into ensuring processes are in place
    that when the authorized individual leaves the company, their access to personal
    information is discontinued immediately to prevent any untoward data incidents.

    +   - **Lack of processes to deal with requests**: Privacy laws such as GDPR require
    organizations to remove personal data as part of the *right to be forgotten* clause
    of the law. Not having processes in place to respond to or completely remove the
    information as required by the law can result in the organization being exposed
    to heavy penalties.

    +   - **Transparency around sharing data**: Some laws require that the organization
    must spell out how the personal data collected is used, including sharing with
    third parties. Failure to do so can result in the company being found to be in
    violation of the law.'
  merge: -1
  img_proc: true
- pgno: 208
  md: '+   **Responding to data loss:** Companies usually will tend to disclose whether
    there has been a theft or unauthorized access of personal data, but some laws
    mandate that victims are informed in a timely manner. This requires the company
    to have the appropriate processes and procedures in place to react to such situations.


    +   **Application and system vulnerability:** Insufficient security around systems
    and web applications, whether on-premises or in the cloud, can result in data
    breaches. There has been a number of breaches in the last few years, some involving
    very large, well-known businesses. For example, about 148 million users were impacted
    when a breach happened at Equifax in 2017. In a breach at Adobe in 2013, about
    152 million users were impacted because encryption was weak and although passwords
    were stored with encryption, password hints had been stored in plain text.


    Another aspect of this is to protect data not only at rest but also in transit
    between systems and applications. There are technical standards that when fully
    complied with can ensure the secure transmission of data.


    +   **Collect more data than needed:** Organizations should focus on collecting
    only the data that is required. The more data you collect, the more responsibility
    you take to ensure that the data is properly stored and processed. If a business
    offers chiropractor services, it can collect data for the patient that is used
    for diagnostic purposes, but if it decides to collect data about the family of
    the patient, it then has more data than it needs to ensure is properly protected.
    The rule of thumb should be to only acquire data that you truly need for your
    business process. If you anticipate needing the data in the future, your business
    processes and technical architecture should be designed in a way to acquire and
    protect that additional data properly.


    +   **Using data for things other than its purpose:** When collecting data, ensure
    that your organization is fully transparent and clear with the individual on how
    the data will be used. Using data for one purpose but then repurposing it for
    something else can represent a compliance violation. Privacy laws usually require
    the extent of personal data collection and how it''s used. Laws such as GDPR require
    that when requested, the organization must inform the requestor of all the information
    it has on the individual. This obviously requires policies and procedures in place
    to ensure responses are given in a timely manner because failure to do so can
    result in non-compliance with the law.'
  merge: -1
  img_proc: true
- pgno: 209
  md: 'Now that we have discussed the importance of data privacy and why it''s important
    for businesses, let''s do a deep dive into GDPR. Privacy laws such as GDPR and
    CCPA are complicated and require specialized expertise and tools to properly implement
    in organizations. The following discussions are not meant to be exhaustive but
    should be viewed as a means to introduce you to some of the key components of
    the laws and set a foundation for deeper discovery at a later time.


    # # Global Data Protection Regulation (GDPR)


    For a number of years now, Europe has led the way with privacy laws. It introduced
    the initial EU Data Protection Directive that came into law in 1995 that required
    companies and organizations to properly protect personal data and have a clear,
    legitimate use for that data. Recently, though, in 2018, a more comprehensive
    privacy law called **GDPR** came into effect. GDPR is more comprehensive in nature
    than its predecessor and significantly expands the rights of individuals to privacy
    and obligates organizations that meet the defined criteria to comply with this
    law.


    Its primary purpose is to give individuals control of how their personal data
    can be used and to consolidate and provide a single privacy act to make it easy
    for organizations to implement it. It is worth noting that GDPR applies to organizations
    beyond the borders of the EU as long as they are dealing with data belonging to
    EU citizens, which means that whether the organization has a physical presence
    in the EU is irrelevant. Violating GDPR laws can result in hefty fines of 20 million
    euros or 4% of annual global revenue, whichever is greater depending on the extent
    of the breach and the damage it caused.


    In the next few sub-sections, we will try to understand what GDPR requires, and
    then in another section, we will discuss the CCPA.


    # ## Understanding GDPR terms


    Before we can do a deep dive into understanding what GDPR requires and how we
    can use Salesforce for compliance, let''s first understand some of the terms used
    in GDPR:


    +   - **Data subject**: A person who can be identified from some attribute such
    as name, location data, or social security number.

    +   - **Personal data**: Any and all information related to a data subject that
    is associated with that data subject, for example, age, gender, or physical address.

    +   - **Sensitive personal data**: Personal data associated with a data subject
    that identifies their political views, religious affiliation, health information,
    or ethnicity, for example, a member of such and such party, or a fingerprint scan.'
  merge: -1
  img_proc: true
- pgno: 210
  md: '+   - **Controller**: This is an entity that determines the purpose of processing
    personal data. For instance, an employer collecting data for the purpose of providing
    employment to an individual becomes the controller of that data.

    +   - **Processor**: Any entity that processes personal data based on the direction
    of the controller. For example, Salesforce becomes the processor of data when
    the employer enters the demographic details of the candidate into Salesforce.

    +   - **Pseudonymous data**: This is considered data that cannot be tied to a
    data subject without tying it to additional information that is stored elsewhere.
    For example, when the candidate visits the company pages, the website tracks the
    candidate and stores their IP address, which, when linked with other information
    available about the candidate, can result in identifying the data subject.


    Let''s discuss the key principles that form the underlying requirements of GDPR.


    # The underlying foundation of GDPR requirements


    There are many requirements in the GDPR privacy law. Understanding the underlying
    principles will help you understand the essence of these requirements and, to
    an extent, the intent of the law. Keep in mind, though, that you should consult
    with a qualified person who has the necessary knowledge and experience in this
    area before interpreting the law yourself. Fines for violations under GDPR are
    hefty and negatively impact the reputation of a business:


    +   - **Fairness and transparency**: Organizations must process personal data
    fairly and transparently. In our earlier example of the candidate applying for
    a job, the employer must be transparent on what information is being collected
    about the candidate and also how that information will be used by the employer.

    +   - **Purpose of data collection**: This relates to collecting personal data
    only for the specified purpose and it cannot be used for any other purpose other
    than the expressed explicit purpose stated at the time of data collection. For
    example, a data gathering company that sells data for individuals gathers candidate
    data for a job posting. The personal data collected is for hiring purposes and
    therefore cannot be sold for commercial gain.

    +   - **Data minimization**: This principle states to collect personal data only
    to the extent that it is needed and relevant to the stated purpose. For example,
    the employer cannot ask whether the candidate owns their home, what vehicles they
    drive, and their plate numbers as those details are not relevant to the decision-making
    process in most cases. A common example of this is phone apps where some of those
    apps require more access than is needed for the purpose of the application.'
  merge: -1
  img_proc: true
- pgno: 211
  md: '**Accuracy:** Personal data must be accurate and kept up to date. For example,
    the candidate gets the job in our example and 6 months later, moves to a new home.
    They send an email to HR informing them of their new address. The company must
    ensure that the address gets updated in their systems. Doing this in a timely
    manner is important because the employee may have moved to a tax-free designated
    zone and the local tax authority must be informed of that change.


    **Deletion of data:** Personal data must only be kept for as long as the need
    is there for the original purpose. As stated earlier, repurposing the data for
    some other use without consent is not allowed. For example, if the prospect was
    interviewed and not given the job, their data with the company must be removed.


    **Data security:** This principle states that organizations must implement appropriate
    technical and organizational measures to protect personal data from unauthorized
    access and use. Depending on the sensitivity of the data being collected, it recommends
    the use of a few techniques such as encryption, pseudonymization, and anonymization.
    When using the pseudonymization technique, GDPR requires that the additional data
    that can be used to identify the subject is stored separately. Search for AOL
    search data leak for an example of how the pseudonymization of data without proper
    safeguards caused a data breach leading to some people getting identified from
    their search history. Here is a story that New York Times ran back in 2006: https://www.nytimes.com/2006/08/09/technology/09aol.html.


    # Definitions


    **Anonymization:** This involves completely removing attributes from the data
    subject that can identify a personal subject. A key aspect of anonymization is
    that the data subject cannot be identified in any way if the data is further processed.


    **Pseudonymization:** This involves removing personal data and replacing it with
    pseudonyms, hence the term pseudonymization. While anonymized data can never be
    restored to the original state, pseudonymized data is different and with further
    processing can be used to identify the data subject.


    **Encryption:** This involves converting the original representation of data into
    an alternative form that is then accessible by authorized parties only. Although
    data can still be intercepted during transit, encryption provides the assurance
    that it cannot be read by the interceptor due to the need for encryption keys
    that allow the message to be read.


    In the next section, we will discuss the key rights of the data subject.'
  merge: -1
  img_proc: true
- pgno: 212
  md: '# # Rights of the data subject


    GDPR provides rights to data subjects that they can use to control the usage of
    their data by data controllers. These rights can help us to understand the GDPR
    law better but also assist us with thinking about a technical plan on how to implement
    the requirements stemming from these rights in Salesforce:


    +   * **Data access**: This gives the data subject the right to confirm with the
    data controller whether their information is being processed. The controller then
    must provide details about how the data is being processed, the purpose of processing,
    and whether it has been shared with third parties.

    +   * **Objection to data processing**: This gives the data subject the right
    to object to the processing of their data, especially if it''s being processed
    for marketing purposes.

    +   * **Data rectification**: This gives the subject the right to request corrections
    to the data that is being processed by the controller.

    +   * **Restrict processing**: The data subject can request that the data controller
    halts the processing of their data, at which point the controller is obliged to
    action the request and ensure data processing stops.

    +   * **Data portability**: This gives the data subject the ability to request
    access to their data in structured, commonly used formats so they can transmit
    it to another company or store it for their own record-keeping purposes.

    +   * **Data erasure**: The data subject can ask the controller to stop processing
    and remove their data in certain situations, such as when the data subject withdraws
    their consent or the original purpose of the data has been served and it''s no
    longer needed.


    Let''s look at where we can start to implement a GDPR compliance program.


    # # Complying with GDPR


    Salesforce has committed to complying with privacy laws and has worked closely
    with EU authorizers to ensure compliance. This is evident by the certifications
    that Salesforce has received from a multitude of organizations certifying that
    Salesforce is compliant with some of the well-known privacy laws, such as GDPR
    and Health Insurance Portability and Accountability Act (HIPAA), among others.'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'Organizations that are starting out must remember that Salesforce is the data
    processor and they are the data controller. This means that they have responsibilities
    as a data controller that must be understood and, as a result, processes put in
    place for compliance with the law:


    +   **Building the team**: Salesforce recommends starting off with the executives
    and getting their buy-in to comply with GDPR. The risks of not complying and the
    consequences can be highlighted to ensure that risks are properly understood and
    appreciated. After you have identified that your organization is subject to GDPR,
    this is probably the most important step. This is because gaining compliance takes
    substantial financial investment and requires staffing resources so the buy-in
    from leadership is of utmost importance.


    Then comes the step to form the core team, which can be done by appointing a key
    person who is accountable for delivery and then having each of the departments
    designate one or two people for the initiative. This forms the core team, which
    can then identify project champions within their respective areas that will serve
    as advocates and potentially as testers as the changes are implemented.


    +   **Current state assessment**: Once the team has been formed, analyze your
    existing privacy policies and documentation because there could be areas where
    synergies exist with what GDPR requires and what you have already implemented.
    The next step is to make an inventory of all the data stores that have personal
    data stored in them. Keep in mind that this analysis of personal data also needs
    to account for the employee, candidate, customer, vendor, and prospects. You want
    to capture the data store, the type of data being stored, the origin of that data,
    the usage of the data, who has access to it, how it is secured, any integrations
    with other systems including third-party systems, and how long it''s kept in the
    system.


    A word of caution here is that large companies have siloed technology tools and
    sometimes departments or teams decide to use tools that are easy to sign up and
    can be set up by a business team member effectively bypassing IT. That''s why
    it is important to have representation from each business area, otherwise these
    undocumented shadow IT systems can unnecessarily jeopardize the company''s reputation
    and financial standing.


    Identify high-risk activities involving data processing from the inventory you
    created. Carry out a data protection impact analysis to determine the actions
    needed to ensure that the personal data is properly protected.'
  merge: -1
  img_proc: true
- pgno: 214
  md: "> **Data Protection Impact Analysis (DPIA)**\n> \n> DPIA is required under\
    \ GDPR whenever an activity is undertaken that is considered a high risk to personal\
    \ data. DPIA is conducted before the activity is undertaken so the organization\
    \ can understand and proactively take proper steps to protect personal data. It\
    \ is also used as evidence that the organization is taking steps to comply with\
    \ GDPR.\n\n+   * **Establish controls**: Salesforce recommends creating a roadmap\
    \ of operational and technical changes required to implement controls and processes\
    \ for data protection. We already discussed DPIA earlier but some other artifacts\
    \ and processes to ensure compliance include the following:\n+       a) **Privacy\
    \ notices**: These are meant for data subjects and should clearly inform the subject\
    \ of the personal data being collected.\n+       b) **Usage limitations**: These\
    \ are controls put in place to ensure that the personal data is used solely for\
    \ the original purpose that was identified at the time of acquiring the data.\n\
    +       c) **Security**: These are measures implemented to prevent unauthorized\
    \ access, use, and the modification or disclosure of personal data.\n+       d)\
    \ **Data subject rights**: These are processes put in place to respond to requests\
    \ from the data subject. These could be requests for complaints and requests for\
    \ data or the rectification or deletion of personal data of the data subject.\
    \ It also includes managing the preferences of the data subject.\n+       e) **Vendor\
    \ management**: It's important to manage contracts with vendors, affiliates, and\
    \ other third-party providers to ensure that their collection and use of personal\
    \ data is legal and falls within the boundaries set by GDPR.\n+       f) **Incident\
    \ response**: These are processes to respond to security breaches, including taking\
    \ remediation steps and informing the affected parties as required by GDPR.\n\
    +       g) **Training**: This should be planned early on with the view that employees\
    \ and external parties whose personal data is shared understand the need for privacy\
    \ policies, how they have been implemented, and the consequences to the company\
    \ should the law be violated. Tools can be provided to report misuse of data or\
    \ to seek clarification on activities related to data processing."
  merge: -1
  img_proc: true
- pgno: 215
  md: '+   * **Audit frequently**: Once you have implemented the processes and tools
    to comply with the law, it is important to conduct frequent internal audits to
    ensure continued compliance. Many organizations will find that they are subject
    to multiple privacy laws and it is best to have an internal auditor trained in
    privacy law to conduct your audits so problems can be spotted before they materialize.


    +   * **Document compliance**: Once the initial baseline has been established
    and the processes and tools are in place, the organization can start to document
    compliance activities. These can be in the form of DPIAs, data inventory, a data
    processing register, and other artifacts and documentation related to compliance.
    The organization may also decide to appoint a **Data Protection Officer (DPO)**
    who is responsible for overseeing the organization''s data protection strategy
    and its implementation so that the organization is compliant with GDPR.


    Most organizations choose to do periodic DPIAs or audits to ensure that the data
    protection program continues to be compliant. This is especially important as
    new sources of data come into existence and volumes of data being collected are
    growing exponentially.


    Now that we have learned the important terms and the principles of GDPR, it will
    be easier for us to assist in implementing these in our organizations within the
    context of data architecture and also to provide guidance to other stakeholders
    such as developers and analysts.


    Let''s discuss the other privacy law, which was recently introduced in California,
    the CCPA.


    # # California Consumer Protection Act (CCPA)


    The US passed the Privacy Act in 1974, becoming one of the first countries in
    the world to adopt a privacy law. This act restricted federal agencies in the
    use of data collection. Given the governance system in the US, individual states
    can also pass laws governing the use of personal data for their residents.


    The US state of California passed a privacy law recently called the CCPA to protect
    the private data of its residents. The CCPA came into effect on January 1, 2020,
    and gives California residents much more control over the collection and use of
    their personal information. We will look into some of the specifics of the law
    later in this section. What we need to understand is that it gives consumers the
    right to know what type of personal information a business is storing about them
    and whether the business is sharing their personal information and with which
    entities. It also has other provisions that give consumers the right to access
    or request the removal of their personal information.'
  merge: -1
  img_proc: true
- pgno: 216
  md: 'Let''s look at some of the terms that CCPA uses in the next section.


    # Understanding CCPA terms


    Let''s look at the terms that are used in CCPA to better understand the discussion
    that will follow. These terms, although they look very simple and are commonly
    understood, have very specific meanings in the eyes of the law. These terms and
    the later discussion around the specifics of the law are listed here as a general
    reference and not legal advice. Always ensure you consult with a qualified person
    who is trained and has the necessary experience:


    +   - **Business**: CCPA defines any entity that either has an annual revenue
    of $25 million or more or collects information on 50,000 users annually or earns
    more than half of its revenue from selling personal information as being subject
    to this law. It must be noted that business here refers to any entity anywhere
    in the world that is dealing with California residents'' personal information.

    +   - **Consumer**: A person who is a natural resident of California.

    +   - **Personal information**: Any information that identifies or could be reasonably
    linked to a particular consumer. This includes commercial, biometric, internet,
    or other electronic network information, and geolocation data.

    +   - **Processing**: Any operation performed on personal data, whether manual
    or automated.

    +   - **Service provider**: The entity processing data on behalf of the business
    and to which the business has disclosed personal data of consumers for a legal
    purpose agreed to in a contract. This means that a business does not need to collect
    personal information from consumers for the law to be considered applicable. If
    a business receives personal information from another business and falls under
    the definition of the business, then regardless of how that personal information
    was obtained, the business will still be subject to CCPA.


    Let''s look into some of the details of the law from the perspective of a business.'
  merge: -1
  img_proc: true
- pgno: 217
  md: '# # Key requirements for organizations


    In this sub-section, we will discuss some of the key requirements for businesses
    to be compliant with CCPA:


    +   * **Honoring consumer rights**: The CCPA imposes certain obligations on businesses
    that include responding to disclosure requests, honoring opt-out requests, and
    responding to data deletion requests, among other provisions of the law. The law
    also imposes requirements on businesses to develop two or more methods for consumers
    to submit requests.


    It should be noted that consumer requests for the deletion of personal data need
    to be carefully analyzed before fulfilling the requests in cases where the data
    may be required by law enforcement. In these types of cases, the business is not
    required to accede to the consumer’s request.


    +   * **Consent**: The law requires businesses to provide clear and conspicuous
    links for consumers to opt out of the sale of their personal information. The
    business must make it such that creating an account is not required for opting
    out of the sale of their personal data.


    +   * **Training**: This requirement ensures that businesses must provide adequate
    training to their personnel involved in handling matters related to CCPA and providing
    information to consumers on how to exercise their rights under CCPA.


    +   * **Disclosure**: This requires that businesses must disclose the categories
    of personal information collected before or at the time of collection of the information.
    The disclosure must be detailed, encompassing the categories of personal information
    collected, categories of sources from where information is collected, the purpose
    of information collection, and any third parties that will be accessing the collected
    information.


    The law also requires that businesses provide this disclosure on their public
    privacy policy page. If a page is not maintained, then the disclosure must be
    made on the website and these disclosures must be updated annually. These disclosures
    must also be made available to individual consumers when they request access to
    them directly by contacting the business.


    +   * **Vendor compliance**: The CCPA law requires that service providers handling
    personal information must also comply with the law. The law stipulates that the
    business must sign a contract with the service provider requiring them to limit
    the processing of the data to the business purpose of the contract. It also requires
    the service provider to certify the contract and state that they understand the
    restrictions and will comply with them.'
  merge: -1
  img_proc: true
- pgno: 218
  md: 'As mentioned earlier, these are not all the provisions of the law and as you
    can probably appreciate by now, the law has exceptions and nuances that require
    specialized expertise in law.


    Now that we have looked at the key requirements for the business to comply with
    CCPA, let''s review some of the rights of individuals under the CCPA.


    # Consumer rights


    The Privacy Act''s scope was to govern the collection, use, and dissemination
    of data by federal agencies in the US. The CCPA''s mandate is to enhance privacy
    rights and consumer protection for the citizens of California. Let''s briefly
    review these rights one by one:


    +   • **Right to know**: Under this right, the consumer is entitled to receive
    clear and transparent information about the categories and types of personal information
    the business is collecting, and the purpose this data is being collected for.
    This must be done prior to or at the time of collection of the personal information.
    A salient feature of this right is that the identification of the third parties
    that this data is shared with must also be disclosed. This closes a big loophole
    where, previously, third-party identity was not required to be disclosed and it
    could be anyone''s guess how many, and which, third parties had access to your
    data.


    +   • **Right to access**: Under this right, consumers can request that a business
    discloses the categories of personal information that the business has about them,
    categories of sources from where the personal information is collected, the purpose,
    third parties that the personal information is shared with, and specific data
    elements such as email addresses and phone numbers that the business holds about
    the consumer.


    It should be noted that while this right may seem straightforward and disclosing
    this information will not be hard, challenges will arise with unstructured data
    where personal information may exist, for example, texts and emails.


    +   • **Right to opt out**: Consumers have the right to request businesses stop
    selling their personal information with the general rule being that the sale of
    data on children under 16 are prohibited except in certain situations.


    +   • **Right to request deletion**: This right grants the consumer the ability
    to request that the business deletes their personal information. Of course, there
    are exceptions under the law when the business doesn''t have to comply with these
    requests. For example, the business detects a security incident or the prosecution
    of those who partake in malicious activities such as fraudulent, deceptive, or
    malicious activity.'
  merge: -1
  img_proc: true
- pgno: 219
  md: '+   • Right to equal services and pricing: This right ensures that the consumer
    is not treated differently in terms of being charged a different price or a change
    in the quality of service if the consumer has exercised their rights under the
    CCPA.


    Now that we have looked at the key consumer rights under the CCPA, let''s look
    at some considerations for implementing CCPA in your organization.


    # Implementing CCPA


    CCPA is a relatively new law that was passed a couple of years ago at the time
    of writing this book. It has gone through many amendments and more changes are
    expected to be made by the California Attorney General as time passes. This poses
    a challenge for businesses as they have to be vigilant and keep up to date with
    new changes as they get introduced in the law.


    I would suggest starting off by following the same steps that are recommended
    in the Complying with GDPR section, tailoring them to fit your needs. The key
    is to have an expert resource who can guide you throughout this process.


    Now that we have looked at GDPR and CCPA in more detail, in the next section,
    we will look at how these can be implemented and what tools Salesforce provides
    to assist in enforcing these privacy laws.


    # Salesforce tools for implementing privacy laws


    We have reviewed GDPR and CCPA privacy laws but there are others as well. For
    example, the Personal Information Protection and Electronic Documents Act (PIPEDA)
    in Canada or Personal Information Protection Act (PIPA) in Japan. The underlying
    principles for these laws are the same, that is, balancing the needs of businesses
    for data so they can provide products and services versus protecting consumers''
    data and giving control to consumers on how they want their data to be used.


    Given that Salesforce is used globally by a multitude of companies in different
    industries, Salesforce provides tools on the platform that can be used to meet
    these privacy requirements rather than specific solutions for each law. This provides
    more flexibility as no two businesses operate the same way and some businesses
    may not be subject to these laws.'
  merge: -1
  img_proc: true
- pgno: 220
  md: 'We will briefly review these tools, using examples to gain a better understanding,
    but note that the tools used for each platform may be different. For example,
    the implementation for data deletion requests for Commerce Cloud will be different
    than a deletion request for Sales Cloud. In the following discussion, we will
    be looking at a Sales Cloud example because that is more commonly used, and the
    intention is to not have an exhaustive discussion here but rather provide pointers
    on how to go about complying with the laws. You will need to work with your privacy
    officer as an architect to understand the law’s requirements and then implement
    the solutions appropriate to your business and the platform you are using. Let’s
    take a look at some of the requests related to privacy laws and how they can be
    handled within Salesforce:


    +   • **Personal data deletion requests:** Privacy laws will usually require that
    you delete data when it’s not needed for the original purpose it was intended
    for or a customer requests that it is deleted. Make sure that you consider all
    sources where the customer’s personal data may be, for example, full copy sandboxes
    or developer sandboxes that may have been seeded with production data (data for
    sandboxes should be anonymized unless there is a real business justification to
    have production data).


    When a delete request is received, consider all the records that could hold personal
    data. If it’s a prospect, start with the lead record, contact, tasks, calendar
    events, and any freeform text fields. Add-on packages such as CPQ or additional
    features such as Sales Cloud Einstein will require special consideration as merely
    deleting data from records in Sales Cloud will not remove it from them. For example,
    in CPQ, you would need to delete records from additional objects such as Quotes,
    Contracts, Invoices, and Orders.


    +   • **Consent management:** Consent management is tracking your users’ requests
    on how they want to interact with your organization. This includes honoring opt-out
    requests or removing data when consent is withdrawn after being given initially.


    For these types of scenarios, ensure that you have searched through contact and
    lead records and remove personal information in the fields. These typically include
    phone, email, and mailing addresses. Email Opt Out and Do Not Call fields are
    present on the Lead and Contact objects. These should be checked. Care should
    be taken that merely checking these fields will not preemptively stop sending
    emails that are sent via custom processes, for example, if you don’t use a dedicated
    marketing tool and use Lightning Flow and email prospects. You will want to ensure
    that your processes check these flags and act appropriately.'
  merge: -1
  img_proc: true
- pgno: 221
  md: 'If you are using Sales Cloud Einstein and your customer doesn’t want you to
    use their data in machine learning models, there is a custom field, AI__HasOptedOutProfiling__c,
    that you can create on the object that has personal information and mark it as
    TRUE for the specific customer record. This will ensure that the customer’s data
    is not used in machine learning models. If you are using Salesforce Inbox, Einstein
    Activity Capture, or Einstein Automated Contacts, you can simply exclude the email
    under Setup and then Data Policies.


    +   - Data processing restrictions: This relates to restricting the processing
    of customers’ data. This can happen in cases where the customer finds out that
    their data is incorrect and requests that the company stops further processing
    the data. For example, a customer finds out that there is a problem with their
    credit report and calls the credit management agency to request them to put any
    further processing on hold until the data has been corrected.


    In cases like these, you can export the data out of Salesforce using the Data
    Export feature or your tool of choice for exporting data and delete the record
    if needed from Salesforce. If that is challenging due to technical reasons, consider
    putting some kind of a flag that gets checked whenever the data is used by another
    Salesforce application or if it is integrated with an external system. This will
    prevent the record from being processed.


    +   - Data requests: Some laws require that you provide data to customers when
    they request it. An example of when this could materialize is when a prospect
    decides to stop any further communication on the opportunity and asks for access
    to the data the organization has about the individual. In some cases, law enforcement
    or courts may request access to data that the business is holding.


    These types of requests can easily be catered to by using Data Export. For features
    such as Salesforce Inbox or Einstein Activity Capture, you will need to create
    a case with Salesforce Support to request access to read receipts for emails sent
    to customers or feedback that was provided by a sales rep for Einstein email insights.


    As discussed in this section, there is a multitude of different scenarios that
    can materialize and require flexibility on the platform to ensure that they can
    be catered to without disrupting the regular operations of the business. To make
    it easy for organizations to manage these privacy policies and comply with them,
    Salesforce introduced a tool called Customer 360 Privacy Center. We will briefly
    discuss that in the next section.'
  merge: -1
  img_proc: true
- pgno: 222
  md: '# # Customer 360 Privacy Center


    As mentioned earlier, the core focus of Customer 360 Privacy Center is to make
    it easier for organizations to comply with privacy laws. It does that by de-identifying
    the data, deleting it, or enabling the portability of data after a customer request
    has been received. As customers become more conscious of data privacy, data portability
    is becoming more important as customers will migrate to platforms that offer superior
    data privacy protection with comparable functionality.


    Customer 360 Privacy Center also provides organizations with the ability to set
    up policies to manage the retention of customer data in the organization and also
    allows setting up the anonymization of data at the record or field level to comply
    with *right to be forgotten* requests.


    The Privacy Center tool can also be used to securely transfer personally identifiable
    information to your customer. The tool’s data portability feature includes a policy
    creator that can identify and compile where the personal information of a customer
    exists. Then an API can be used to generate the file that has this data and share
    it with your customer.


    As discussed here, Customer 360 Privacy Center can simplify complying with privacy
    laws using a single tool rather than having to worry about compliance as your
    org updates. Another benefit is that since the tool is managed by Salesforce,
    they will keep it updated as the laws evolve.


    With the knowledge covered in this section, you can kickstart conversations on
    what to implement in terms of these privacy laws in conjunction with Salesforce
    but also consult with your legal department to confirm your understanding and
    what you are implementing. Salesforce provides tools that can be leveraged to
    assist in compliance but don’t underestimate the importance of defining and improving
    business processes as well. The best technology will fail if the business process
    it is intended to support is not defined or if it is defined, it is not streamlined.


    # # Putting it all together


    Let’s put all the learnings of this chapter in a case study and see how these
    learnings would be practically applied. We are working with a hypothetical company
    called, **Alpha Mobility Services (AMS)**, which is a large global telecommunications
    company providing mobile and internet services to both B2B and B2C customers in
    31 countries.'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'AMS has grown naturally as well as via acquisitions, resulting in a multitude
    of CRM, marketing, and ERP systems within its technology landscape. The data architect
    team has worked to consolidate the various CRMs into Salesforce and Salesforce
    is now globally used. The company uses multiple web-to-lead forms to capture data
    from prospects and create lead records in Salesforce. A team of **Sales Development
    Representatives (SDRs)** also creates leads in the system and routes them to the
    sales team.


    AMS has upward of 3 million leads and 1 million opportunities in its system. For
    support purposes, AMS has implemented Service Cloud and uses communities to support
    customers. It also has a Social Customer Service setup that allows customers to
    open cases with the company via Twitter and Facebook. It also uses web chat, allowing
    customers to create a case when the regional customer support center is offline.
    The last count revealed that there are a large number of open cases in the system.
    A preliminary analysis concluded that some of these were attributable to duplicate
    cases that were erroneously created.


    # Problem


    Various teams that use the system have been complaining for months now about incomplete
    data that is critical for marketing or sales teams finding out that contact records
    are stale and not reliable except for new customers that have been onboarded.
    In some extreme cases, sales reps have reached out to a contact only to find out
    that they have moved and are not with the company anymore. This is causing delayed
    sales cycles, reduced upsell opportunities, and difficulty retaining customers,
    leading to higher customer churn rates that are much higher than the industry
    average.


    Duplicate data is rampant in Salesforce, leading to a single customer having their
    billing and order data spread over multiple accounts. This causes issues with
    any meaningful reporting related to customer spend, retention, and where the company
    should focus its energies to increase revenue. Due to this and the data quality
    issues mentioned earlier, automated processes that run are also aggravating the
    situation since they are working off of data that is not very reliable. A data
    architect has been hired to present a plan and implement a governance structure
    to rectify these issues.


    # The solution approach


    The new data architect has had initial meetings with different business teams
    as well as the management team to understand the issues and what could be causing
    them. The data architect has also had implementation documentation on the CRM
    consolidation project and the initial setup document when Salesforce was implemented
    7 years ago shared with them.'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'Armed with all this information and after reviewing the documentation, the
    data architect plans to approach the problem in two steps. Step 1 will be to conduct
    an assessment of the current state and document and present the assessment report.
    Step 2 will be to fix existing issues and put governance processes and tools in
    place to prevent and minimize data quality issues in the future.


    # Step 1 – assessing the current state


    The data architect wants to ensure that there is a clear scope defined for what’s
    included in the assessment. Based on the information gathered so far, they put
    together a scope document outlining the boundaries of the assessment, the exit
    criteria, the assessment team, the approach they will take to conduct the assessment,
    and any assumptions and constraints that you have identified so far.


    Once the scope document has been reviewed and approved by the management team,
    the data architect conducts a stakeholder analysis exercise identifying the business
    users, their interests and influence on the project, and the best ways to communicate
    with these users.


    The architect has already reviewed the provided documentation and plans to conduct
    1:1 meetings and run some surveys with the identified users. After reviewing the
    survey results and the notes taken in these meetings, the architect decides to
    create a business requirements log that will have all of the requirements identified
    along with the pain points that the users mentioned.


    The data architect prepares the assessment report outlining the pain points, the
    business requirements, and the suggested approach to eliminate the pain points
    and meet the business requirements. The architect has also suggested some metrics
    associated with measuring data completeness and accuracy that can be used to measure
    success in the next phase.


    # Step 2 – fixing current issues and implementing a plan


    The data architect has recommended a de-duplication tool on an immediate basis
    to fix the existing duplicate records. The recommended tool also has the functionality
    to set up duplicate rules that will help prevent new duplicate records from being
    created. Another tool has been recommended by the architect to enrich the data
    from data management companies that provide data enrichment services.


    The data architect has put together a vision document that outlines the business
    objectives of the governance plan, the approach, the teams, and the responsible
    roles to see the plan through success. They have also suggested some metrics to
    ensure success is continuously measured throughout.'
  merge: -1
  img_proc: true
- pgno: 225
  md: 'The data architect is also working with the internal communications and training
    teams to devise a plan on how to communicate the value of data and emphasize that
    data is everyone''s responsibility. In parallel to that, the architect worked
    with the Salesforce administrators to identify opportunities to streamline page
    layouts and introduce validation rules so data is correctly entered at the source.
    Another critical aspect that the architect noted was that there was a lack of
    proper backup and recovery strategy for Salesforce. The architect has recommended
    a tool for that and suggested an approach to the Salesforce admins to ensure that
    backups are taken regularly and restores can be done when needed.


    The data architect has engaged the enterprise architect team to put in place a
    process to ensure that a business architecture for the existing landscape as well
    as a roadmap is defined. It was found during these discussions that business requirements
    and enhancement requirements for existing Salesforce applications were not recorded
    in a central place. To fix this problem, the architect has recommended implementing
    a business backlog along with a recurring meeting with business users to prioritize
    the backlog and report on progress.


    With these changes in place, the architect has created several Salesforce reports
    and uses reports by the tools implemented to gauge the quality of data and reports
    these along with the agreed-upon KPIs to the management team. Phase 1 of the project
    is complete, and users are already reporting increased satisfaction with the data
    they are working with along with a decrease in duplicate records, which they were
    frequently coming across earlier. With the data enrichment tool in place, contact
    and lead records have more up-to-date and accurate data in them, reducing the
    time sales reps had to spend earlier to find that information.


    # Summary


    We have discussed a lot of topics in this chapter. We started off with enterprise
    data governance and explained what it is and what''s different about it with respect
    to data management. My hope is that our discussion on data governance benefits
    and the risks of not having it provided you with a deep understanding and appreciation
    of its importance to any organization regardless of its size. We also highlighted
    why metadata management, an essential component of data governance, is important
    and how not having effective governance around metadata management can hinder
    our ability to govern data efficiently.'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'Once we understood the importance of data governance, the next logical step
    was where we go from there and that’s what was covered: assessing your current
    state of data governance. We discussed some challenges with current state assessments,
    and I provided practical steps that you can take to conduct a successful assessment
    exercise. We ended the section by discussing some common metrics that can help
    you evaluate your current state and also set targets for the future state.


    In the final section of the chapter, we discussed privacy laws in detail. My hope
    is that after reading that, you have developed an appreciation of how critical
    these are to businesses not only for compliance reasons but also for protecting
    the customer’s information and to establish trust in them. Because we live in
    a global economy, GDPR and now the CCPA are probably the most commonly applied
    laws. GDPR because it covers the massive economic region of the EU, and the CCPA
    because it is one of the largest economies in the world. Additionally, we discussed
    tools and techniques that you can use right away in Salesforce to design and implement
    compliance with these laws.


    In summary, this chapter should have provided you with the knowledge and the tools
    needed to implement data governance initiatives, what they entail, and how they
    can be implemented. Starting off with the suggested approach for the current state
    assessment will enable you to focus on the areas that need the most attention.
    Data privacy laws are becoming more important and our discussion on those should
    give you the confidence to have those conversations and implement them at your
    organization.


    In the next chapter, we will discuss performance on the Salesforce Platform and
    the different tools that are available for monitoring performance, and how we
    can use them to design solutions to ensure that our applications are scalable
    and performant.


    # Questions


