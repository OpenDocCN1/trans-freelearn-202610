    +   \n+   a) The team must define multiple survivorship rules, one for each system,\
    \ to arrive at the Golden Record.\n+   \n+   b) Survivorship rules cannot be used\
    \ for this scenario because they are not intended for duplicate management.\n\
    +   \n+   c) The project team needs to define the specific criteria that can be\
    \ used to arrive at the Golden Record.\n+   \n+   d) The project team needs to\
    \ set up probabilistic rules to determine the Golden Record."
  merge: -1
  img_proc: true
