- pgno: 229
  md: '# # 6 Managing Performance


    In previous chapters, we have talked a lot about data management and governance.
    That all made sense, but if the applications you build on the platform are slow
    or crash under heavy loads, you will not build a trusted relationship with your
    users, whether they are internal or external customers accessing applications
    through the Salesforce Experience Cloud.


    In this chapter, we will start by exploring the topic of performance within Salesforce
    and understand why performance-related issues happen in the first place. Of course,
    we need tools to determine whether we are, in fact, facing performance issues
    and whether we require further diagnosis. So, we will discuss some of the tools
    that are available to further investigate and resolve issues.


    Once we have built a foundation around the causes using the tools available, we
    will look at the things that we can do to improve performance on the platform.
    Since performance can be impacted by a wide variety of factors, and therefore
    a wide range of activities can be undertaken to improve them, we will cover some
    of the more common performance improvement techniques that we can use to improve
    it. A very important aspect of performance management is ensuring that you have
    tested your applications before they get into the production environment. So,
    we will have a thorough discussion on the importance of performance testing and
    how to conduct such tests successfully on the Salesforce Platform.'
  merge: -1
  img_proc: true
- pgno: 230
  md: 'Once you have brought your application up to an acceptable level of performance,
    you want to make sure that it continues to run in an optimal manner, which requires
    an understanding of performance monitoring, so we will wrap up the chapter with
    a discussion on monitoring the platform.


    The key topics that we''ll cover in this chapter are the following:


    +   - Salesforce Platform performance

    +   - Performance tools

    +   - Improving performance

    +   - Conducting performance testing in Salesforce

    +   - Monitoring performance


    So, let''s dive right into understanding performance on the Salesforce Platform.


    # # Salesforce Platform performance


    Over time, data in your organization will grow. If this growing data is not managed
    properly, it can cause issues, including performance issues, storage limits, and
    low adaption of the system. One of the best ways to manage data over the long
    run is to incorporate data archiving and data management practices as part of
    every new implementation. When this is not done, data archiving and stewardship
    activities become afterthoughts and require more work to implement. This is regardless
    of factors including having sufficient storage for the next few years, good performance,
    a lack of performance-related complaints from customers, or thinking that you
    will never hit the limits.


    Good architecture means thinking ahead about performance and minimizing, where
    it makes sense, the use of available resources. In this section, we will review
    why performance matters and some of the more common reasons that cause performance
    issues. We will also be reviewing performance-related tools and how to execute
    performance tests on the Salesforce Platform.


    Let''s try to first understand why it''s important to keep an eye on the performance
    of your organization.


    # # Importance of performance monitoring


    Salesforce is used widely across sales and marketing organizations, and it''s
    become a critical business platform. With its ease of use and the capabilities
    provided to extend the platform, it is used by a wide arrange of teams. From Support
    to Sales operations, Finance to Legal and **Human Resources (HR)**, different
    teams use it to conduct their business on the platform.'
  merge: -1
  img_proc: true
- pgno: 231
  md: 'The Salesforce AppExchange store also provides a massive 3,000+ business applications
    portfolio that also makes it easy to tailor the platform to multiple different
    use cases. Another reason why it’s widely used is the numerous integration tools
    that can be hooked up with the platform. And because the platform is widely used,
    many Independent Software Vendors (ISVs) have built easy-to-use connectors that
    can quickly and easily integrate their products with Salesforce.


    All of these present a great opportunity but also a challenge because of the need
    to maintain a performant business platform. This is especially true on the new
    Lightning Experience (LEX) User Interface (UI), which is heavily dependent on
    client-side processing and, overall, it is more dependent on network quality for
    providing an optimal user experience. Generally, Software as a Service (SaaS)
    and Platform as a Service (PaaS) are harder to monitor because the infrastructure
    is not owned by the customer. Tools such as networking and application monitoring
    tools, for example, capturing packets for analysis, don’t work outside of your
    own environment. Thankfully, some tools can assist in pinpointing these types
    of issues. We will review some of these tools later, but now, let’s understand
    the reasons why it’s important to monitor performance on the Salesforce Platform
    in the first place:


    +   • Revenue generation and productivity: Sales teams need to be continuously
    selling and, to achieve that objective, organizations typically spend significant
    amounts of capital to implement and configure Salesforce, so it’s tailored for
    their business. Many organizations also invest in third-party tools such as AppExchange
    applications to make their sales teams as effective as possible. Besides technology,
    organizations also spend time training their sales representatives in perfecting
    their pitches and slide decks and offering call script guidance and myriad other
    tools to help them close deals. Technology and these tools, along with optimized
    business processes, result in a well-oiled selling machine. A performance problem
    in Salesforce can severely impact the productivity of your sales team, which could
    potentially lead to lost revenue.


    +   • Trust: If you have a system that’s slow frequently, or on which users cannot
    do their day-to-day activities, soon you will have unhappy users who will lose
    trust in the system. Users talk with each other and share their experiences and
    once a negative trend starts to develop, it is not easy to reverse it. Having
    processes and tools in place to ensure the system performs at an optimal level
    is crucial to ensuring a continued positive return on your organization’s investment.'
  merge: -1
  img_proc: true
- pgno: 232
  md: '+   * **System health**: Issues related to performance usually point to underlying
    issues that should be reviewed and rectified. If not rectified, these can affect
    other areas of the application or increase the effort required to extend the application.
    For example, a report is running slow and the architect, after investigating,
    finds out that the organization has many complex sharing rules. Each time the
    report is run, the sharing rules must be evaluated, thereby slowing down a report
    that otherwise would have performed well. Another area that this could impact
    is if your customer has integrations that run on a nightly basis to bring in data
    say from an ERP. Having complex sharing rules can slow down the process because
    the system has to recalculate data access. This can be a problem in very large
    global orgs where users are logged in and using the system in multiple time zones.
    In these situations, other techniques can be used to ensure a smooth data import
    and minimize the impact on users.


    +   * **Service Level Agreements (SLAs)**: System performance is important not
    just from the perspective of internal users, but also of customers. Your SLAs
    with customers outline the response times and the level of service the customer
    can expect to receive. If your org is non-performant, your customer SLAs can be
    adversely impacted. For instance, in a large car dealership, a commitment is made
    to customers that their vehicles will be serviced within a certain period, and
    if that time period is missed, then an automatic 15% discount is applied to the
    entire bill. Salesforce is used to manage work orders and submit orders for auto
    parts. Let’s say a technician is attempting to query the parts for a specific
    make and model so they can order them, but the system is slow, which is taking
    the technician longer than expected to order relevant parts. As a result, work
    will not get completed on time and cost the company revenue in the form of the
    15% discount it now has to give to the customer.


    +   * **Continuous improvement**: Organizations try to compete and maintain their
    competitive advantage and use different techniques to do so. Proactively monitoring
    your performance enables you to ensure that mistakes made in the past are not
    repeated and lessons learned in the past are incorporated for future design and
    build. The net result of this is an overall improvement in customer service and
    an assurance for internal users that the organization is taking data seriously
    and is vested in it.


    Now that we have looked at the reasons for monitoring performance, in the next
    section, we will review why performance issues happen in the first place, followed
    by a discussion on some of the tools that can be used to measure and improve performance.'
  merge: -1
  img_proc: true
- pgno: 233
  md: '# Reasons for performance-related issues


    We established earlier that Salesforce is a critical business application and
    is increasingly used for more business functions than just CRM. There is a multitude
    of factors that could impact performance and affect business operations and therefore,
    we must understand these factors.


    The first thing to do when your users report a performance-related issue is to
    check the Salesforce Trust site and ensure that the problem is not on the Salesforce
    side. You can also subscribe to alerts from this site. To check the status of
    your instance, visit `status.salesforce.com` and enter your instance ID as shown
    in the following steps. First, let’s review the steps to find your instance ID:


    +   1. Navigate to **SETUP** and then **COMPANY INFORMATION** to find your org’s
    Instance ID, as shown in the following screenshot:


    ![](img/782d45700e093b3d82b348c0ccc8ccba_233_0.png)


    Figure 6.1 – The Company Information page showing the instance ID, which is NA49
    in this example'
  merge: -1
  img_proc: true
- pgno: 234
  md: '2. Once you have the instance ID, go to status.salesforce.com and enter your
    instance ID:


    ![](img/782d45700e093b3d82b348c0ccc8ccba_234_0.png)


    Figure 6.2 – All features are operating without any issues for instance NA49


    You can also click on the **HISTORY** tab to see historical records for any issues
    that have arisen on this instance, and the **MAINTENANCE** tab shows the patches
    and releases applied on the instance, including upcoming releases. This can be
    a very helpful tool for planning purposes ahead of each release, as well as planning
    for in-flight or upcoming projects.


    One challenge with performance issues is that there is a wide spectrum of factors
    that can impact performance, and therefore it is important to narrow things down
    quickly to the most likely culprit. A good way to start on that is to cast a wide
    net and ask questions such as the following:


    Does it affect everyone who is using Salesforce?


    +   * Are users in different locations experiencing similar performance issues?

    +   * What browsers are they using?

    +   * Is the performance issue experienced while using other browsers?'
  merge: -1
  img_proc: true
- pgno: 235
  md: "Having the answers to these questions can help you narrow down the issues to\
    \ the two or three most probable possibilities, which can then be explored further.\
    \ Let's look at the reasons for performance-related issues:\n\n+   * **Leisure\
    \ network traffic**: Many users these days carry devices that connect to the office\
    \ wireless access points and stream high-definition video and audio, which can\
    \ result in the office networking bandwidth getting constrained. A way to mitigate\
    \ this could be to provide a separate access point for these users so leisure\
    \ network traffic passes through that access point and critical applications,\
    \ including Salesforce, can run on the regular network, leaving plenty of bandwidth\
    \ free. You will need to determine a way to prevent users’ devices from getting\
    \ on the network; this can usually be done through **Media Access Control (MAC)**\
    \ filtering so only authorized MAC addresses can get on the regular network.\n\
    \n> **MAC addresses**\n> \n> A MAC address is a unique identification number that\
    \ uniquely identifies hardware on the network. Every MAC is unique in a network\
    \ and no two MAC addresses will ever be the same. This is ensured by the nomenclature\
    \ used for MAC addresses, a topic outside the scope of this book. Read more about\
    \ MAC addresses at https ://www.pcmag.com/encyclopedia/term/mac-address.\n\n+\
    \   * **Bandwidth quality**: Low bandwidth can be a problem and your users will\
    \ notice if you try to resolve it, but adding more bandwidth to fix performance-related\
    \ issues will not always result in desired outcomes. This is because the quality\
    \ of the bandwidth is also important. An increase of a few percentage points in\
    \ package loss can impact performance in a noticeable way.\n\n+   * **Location**:\
    \ Salesforce has several hundred instances globally where all the orgs are run\
    \ from. Your proximity relative to the instance that hosts your org can also be\
    \ a factor in performance-related issues. If the physical distance is significant\
    \ and there are many hops to get to the instance, this can result in slow performance.\
    \ Salesforce instances are spread throughout the world in multiple regions and\
    \ the org is assigned by Salesforce based on where the users are located. Before\
    \ signing up, you should consult with your account executive if you would like\
    \ your org to be in a region where most of your users will be based, rather than\
    \ in the region where the contract will be executed."
  merge: -1
  img_proc: true
- pgno: 236
  md: '**Hop**

    Hop is a networking term that refers to the number of network devices a packet
    has to pass through to reach the destination. These network devices can be routers,
    switches, repeaters, and so on.


    Each device receives the packet, processes the information in it, and then forwards
    it on to its destination. Each time a device does that, this takes time and can
    have an impact on the performance when millions of packets are transmitted. In
    Windows, you can use the `tracert` command in **Command Prompt** to see the number
    of hops. For example, from my laptop to `salesforce.com` is 9 hops.


    Keep in mind that a lower hop count doesn''t necessarily mean a faster connection
    because other factors contribute to the connection speed as well.


    +   - **Inefficient configuration or code**: Performance issues can also be caused
    by incorrectly configured applications or code that is sub-optimal. These can
    be a massive drain on system resources, thereby impacting performance. If a problem
    keeps happening in a specific Visualforce page or a Lightning component, you will
    want to review the code and ensure that it follows best practices. Another possibility
    is an incorrectly configured application. Earlier, we discussed the example of
    sharing rules. If there are too many sharing rules, that can slow down reports
    or data queries in general because every time a query is executed, the system
    has to run the sharing rules to ensure that the data security is protected in
    line with these rules.


    +   - **AppExchange packages**: Many AppExchange packages add business value to
    your processes, but some of the packages also communicate back and forth with
    the ISV servers and can impact performance. For example, if you are using a digital
    signature solution and install the managed package, there may be bandwidth being
    utilized by the package, resulting in poor performance. Admins should frequently
    review and assess managed packages to ensure they are still useful and provide
    the value that they were initially installed for in the org.


    +   - **Browsers**: The unsung heroes of the cloud world, browsers play a critical
    role in users’ experiences. As a browser is used over time, it accumulates a lot
    of data. This can include the browser accumulating a large number of cookies and
    caches resulting in an impact on performance. It is also recommended to have the
    browsers updated to the latest release, as browser vendors are continuously releasing
    new patches to fix not only security vulnerabilities but also to improve performance.


    Using browsers that are supported by Salesforce is another important factor. For
    example, an organization was using Internet Explorer 11 and kept running into
    issues and therefore, users started to use Google Chrome. The issue was that whenever
    users ran into problems with Salesforce or in general, corporate support teams
    would not provide support since Internet Explorer 11 was the supported corporate
    browser.'
  merge: -1
  img_proc: true
- pgno: 237
  md: 'Running multiple browser windows at the same time or having multiple tabs open
    in the same window can seriously downgrade performance. This is because each window
    and tab that is open consumes memory and Central Processing Unit (CPU) cycles.


    Another aspect of browsers is the ability to add plugins and extensions. I recommend
    disabling all plugins and extensions during diagnoses if a specific user is reporting
    a problem. This can easily be done by opening the browser in Incognito or Private
    Browsing mode.


    +   Technical debt: This can play a significant part in slowing down performance
    if a close eye is not kept on it. Simply defined, technical debt is the debt you
    take on when expediently delivering solutions. Pay attention to the word debt,
    which means that it needs to be paid back promptly or it will demand payment with
    interest. Technical debt is not necessarily a bad thing as long as there are processes
    and tools in place to ensure the technical debt is taken care of.


    Technical debt in the world of Salesforce includes anything from abandoned custom
    fields, workflow processes, reports, and triggers, to workarounds put in place
    to meet business requirements. When Salesforce provides a solution to fill a gap
    in its solution, usually as part of its three releases per year, or the organization
    decides to go for a third-party solution or improve its own solution, on many
    occasions, the old solution or workaround is left as is in the org, contributing
    to technical debt. As time passes and technical debt accumulates, if no action
    is taken, users will start seeing performance issues.


    +   Hardware and software requirements: There are certain hardware and software
    requirements that are needed in order for Salesforce to run optimally. For example,
    8 GB of RAM is recommended to run LEX. The minimum required is 5 GB of RAM, but
    depending on your application''s need for resources, users may experience performance
    problems due to minimum RAM requirements. Performance issues can be caused by
    these requirements not being met. Salesforce will not block customers from using
    unsupported software and hardware, so this should also be checked so that potential
    hardware and software problems can be ruled out right at the beginning of the
    diagnostic process.


    +   Network topologies: Some customers, due to the nature of their business, may
    have very strict requirements in terms of which Internet Protocol (IP) addresses
    their Salesforce org can be accessed from. Sometimes, they will require their
    users to log in to Salesforce via a VPN (Virtual Private Network) and that can
    cause network traffic delays because all communication has to be tunneled through
    the VPN.'
  merge: -1
  img_proc: true
- pgno: 238
  md: '+   - **API limits**: Almost every Salesforce org has some type of AppExchange
    package installed or integration with another system. For larger orgs, sometimes
    there can be tens of AppExchange packages installed along with many other integrations.
    All the integrations and some of the AppExchange packages, depending on what the
    app is about, utilize API calls. Since Salesforce imposes limits to ensure quality
    for other customers on the instance, there are limits placed on these calls. Hitting
    the limits means that you either wait for 24 hours to pass (the period after which
    the limits get reset) or purchase additional API calls from Salesforce. The interruption
    caused by API limits is a serious problem as it can impact direct revenue-generating
    activities or customer service. For example, if your marketing automation tool
    cannot communicate with Salesforce, then any high-value leads coming into the
    tool cannot be pushed over to Salesforce.


    > **Governor limits**

    > Certified managed packages are managed packages that have passed the security
    review for AppExchange. They have their own set of governor limits in addition
    to the customer''s org limits. For example, the per transaction DML limit in the
    customer org is 150; a certified managed package will get its own 150 DML limit
    per transaction. Refer to the Per-Transaction Certified Managed Package Limits
    section at this link: https://developer.salesforce.com/docs/atlas.en-us.apexcode.meta/apexcode/apex_gov_limits.htm.


    Now that we have discussed the reasons for performance-related issues, in the
    next section, we will discuss some of the tools that can be used to address performance-related
    issues.


    # # Performance tools


    There is a multitude of tools that are available to monitor and diagnose performance-related
    issues. The discussion in this section is not meant to be exhaustive, detailing
    each tool that is available and its capabilities, but rather providing pointers
    so you can understand and put them to use when you run into performance-related
    issues.


    It must be mentioned that for business-critical applications, performance must
    be placed at the forefront right from the outset. It’s not a good practice to
    design an application and leave performance considerations to the end, or worse
    yet, until the app goes into production and users start to report problems. This
    is the reason that performance tests should be performed to gauge the application’s
    ability to scale up to the higher threshold of the range of the number of expected
    users. We will discuss performance testing and how to conduct it for Salesforce
    in more detail in the *Conducting performance testing in Salesforce* section.'
  merge: -1
  img_proc: true
- pgno: 239
  md: 'Let’s discuss some of the tools at our disposal to monitor performance in Salesforce.


    # URL suffixes


    This is a technique to view your page load times for LEX. It is done by adding
    ?optVisible=1 to the end of the URL. For example, when I add this to the **Account**
    page for a specific record, the result shows me that the page was loaded in **4.49**
    seconds. We will discuss the details related to LEX performance in the *Performance
    in LEX* section.


    We can see in the top right of **Figure 6.3** that the **Account** page took **4.49**
    seconds to load:


    ![](img/782d45700e093b3d82b348c0ccc8ccba_239_0.png)


    Figure 6.3 – The EPT (Experienced Page Time) value is shown as 4.49 seconds


    This is a handy tool to quickly get some preliminary data on how the page is performing
    without going through any extensive setup.


    # Speedtest


    This is a test to measure performance and provides different metrics to gauge
    **JavaScript (JS)** speed and the connection speed to Salesforce servers. To use
    this, simply append /speedtest.jsp to the URL while logged in to your org. For
    example, in my case, I have https://curious-wolf-q1n89f-dev-ed.my.salesforce.com/speedtest.jsp.'
  merge: -1
  img_proc: true
- pgno: 240
  md: "Then, on the resulting page, run the test. As shown in Figure 6.4, this produces\
    \ the Octane score, the download and upload speeds, and other pertinent information.\
    \ In this case, the Octane score is well below the minimum score required by Salesforce,\
    \ so the user should expect to experience performance issues:\n\n![](img/782d45700e093b3d82b348c0ccc8ccba_240_0.png)\n\
    \nFigure 6.4 – The Octane score\n\nAs seen in Figure 6.4, Speedtest has other\
    \ information that is useful for troubleshooting, such as upload/download speeds,\
    \ instance ID, and other pertinent details relating to the browser and the operating\
    \ system.\n\n> **Octane score**\n> \n> The Octane score, developed by Google,\
    \ is a measure of how JS in the browser is performing. Higher Octane scores correspond\
    \ to faster load times. It is important to note that the Octane score factors\
    \ in hardware and the type of browser as well. Salesforce requires a minimum Octane\
    \ score of 20,000 and recommends an Octane score of more than 30,000 for optimal\
    \ performance."
  merge: -1
  img_proc: true
- pgno: 241
  md: '# # Salesforce Optimizer


    This is a free tool from Salesforce that can be run either as a PDF report or
    as an app and provides details on a bunch of metrics covering usage, unused fields,
    custom code, reports, and dashboards. Not only does the tool scan and highlight
    problematic areas in your org, but it makes recommendations on how to solve those
    issues. It also provides an estimate of the effort of rectifying each issue that''s
    analyzed, along with additional resources if you drill down into the item, as
    shown in Figure 6.5. The report or the app can be run from Setup by searching
    for Optimizer.


    I prefer running the app since it covers more features than the report and provides
    a sorting feature with which you can sort the list view. Salesforce recommends
    running this report or app at a regular cadence. This can enable you to catch
    issues before they materialize. Figure 6.5 shows the results after Salesforce
    Optimizer has been run:


    | Feature | Type | Estimated Effort | Status |

    |---|---|---|---|

    | User Logins | User Management | < 30 minutes | Immediate Action Required |

    | Insecure Default External Access Levels | Improve Org Security | > 2 hours |
    Immediate Action Required |

    | Pending Release Updates | Improve Org Security | > 2 hours | Action Required
    |

    | Unassigned Roles | User Management | < 30 minutes | Review Required |

    | API Versions | Custom Code | 1 - 2 hours | Review Required |

    | Profile Assignments | User Management | 1 - 2 hours | Review Required |

