- pgno: 244
  md: '# # Salesforce Page Optimizer


    This is a tool specifically designed to monitor the performance of Salesforce
    Communities. It is provided as a plugin for Google Chrome and provides actionable
    insights into how the page is performing. We will discuss this in more detail
    later.


    # # Salesforce Lightning Inspector


    This is another Google Chrome extension that helps to diagnose performance bottlenecks.
    It can be used to inspect different aspects of an application, such as events
    that fired and client-side storage details. The **Performance** tab shows details
    of how long components are taking to get executed and where the potential bottlenecks
    are.


    # # Salesforce reports


    Salesforce has out-of-the-box tools and reports that can be used to monitor the
    limits on API calls. We established earlier that API limits can create serious
    issues for business-critical applications that rely on external systems via integrations
    or AppExchange packages.


    Out of the box, you can use the System Overview page, which shows the API calls
    for the last 24 hours as seen in the next screenshot. You should also consider
    setting up API usage notifications that send an email every _x_ number of hours
    when the API usage reaches a certain threshold. The system keeps on sending emails
    until the API usage goes below the specified threshold:


    ![](img/782d45700e093b3d82b348c0ccc8ccba_244_0.png)


    Figure 6.10 – The total number of API calls made in the last 24 hours; in this
    case, 20'
  merge: -1
  img_proc: true
- pgno: 245
  md: 'Another way to review the usage is to run a report called API Usage Last 7
    Days, which shows the usage for the last 7 days as seen in the following screenshot.
    This report is only available in the Classic view:


    ![](img/782d45700e093b3d82b348c0ccc8ccba_245_0.png)


    Figure 6.11 – The report is showing the number of API calls that have been made
    in the last 7 days


    These reports can be a useful tool to gain insight on how APIs are being used
    in your org and whether any proactive intervention is required to prevent API
    limit-related errors.


    # Query Plan tool


    This is used to access query plans for Structured Object Query Language (SOQL)
    and Salesforce Object Search Language (SOSL) queries, reports, and list views
    to optimize them for performance. This is a valuable resource at your disposal
    that you can use to proactively avoid problems or quickly rule out SOQL queries
    as the cause of performance issues. The Query Plan tool is accessed from the Developer
    Console and helps in tuning SOQL queries. You can use the tool to understand the
    different query plans and whether your indexed query filters will be used by the
    Query Optimizer or whether it will perform a full table scan.


    > Query plan

    > A query plan is essentially the map showing a sequence of steps that can be
    used to access data from the database. The Query Optimizer, upon submission of
    a query, evaluates some of the different approaches it can take to fetch the data
    and returns the plan with the least cost. This means that the returned plan will
    get the data in the least amount of time.'
  merge: -1
  img_proc: true
- pgno: 246
  md: 'Since most custom code-based applications use SOQL, this is a very handy tool
    to test how your SOQL queries will perform. Let''s also understand what a full
    table scan is before we deep dive into the Query Plan tool.


    # Full table scan


    A full table scan is when the database table is scanned row by row and every row
    is examined to check whether it matches the query''s where clause. Performance-wise,
    this is an expensive operation, and the use of filters is encouraged in SOQL queries:


    ```

    SELECT name FROM Account WHERE name = "Star Wars Innovations";

    ```


    The filter is the part after the where clause in the SOQL query. The name = "Star
    Wars Innovations" part is the filter, which will cause the index to be used since
    the name field is indexed in the Account object.


    There is a certain set of criteria that Salesforce uses to determine whether a
    full table scan or an index will be used, leading to a performant query. As shown
    in Figure 6.12, indexes play a key role along with the number of rows that are
    expected in the query result:


    ![](img/782d45700e093b3d82b348c0ccc8ccba_246_0.png)


    Figure 6.12 – High-level diagram showing the criteria that Salesforce uses to
    determine whether the query filter is selective, or whether a full table scan
    will be used'
  merge: -1
  img_proc: true
- pgno: 247
  md: 'The Query Optimizer determines a query to be selective when it has a selective
    filter in it. Selective filters help the query engine in terms of how it gets
    the results, whereas a non-selective filter (and therefore, a non-selective query)
    will require that a full table scan is performed, which is a costly operation.
    This is determined by the following:


    +   - The filter has a standard or a custom field.


    +   - Some standard fields are indexed automatically. These are as follows:


    +   - Primary keys (Id, Name, and OwnerId)


    +   - Relationship fields (lookup or master-detail fields – CreatedById, and LastModifiedById)


    +   - Audit fields (CreatedDate and SystemModStamp)


    +   - Record types for standard and custom objects


    +   - If a Custom field is set as Unique or External, it is automatically indexed.


    +   - Once it is determined that a filter is indexed, the number of rows returned
    is then determined. For standard indexed fields, 30% of the first 1 million records
    and 15% of the remaining records are determined. If this is fewer than 1 million
    rows in total, then the filter is selective and used by the optimizer.


    +   - For custom indexed fields, 10% of the first 1 million records and 5% of
    the remaining records are considered, and if this is less than 333,333 rows in
    total, then the filter is considered selective and used by the optimizer.


    +   - If an AND operator is used in the filter, then the query targets less than
    the following:


    +   - Twice the index selectivity thresholds for each filter


    +   - The index selectivity thresholds for the intersection of the fields


    +   - If the OR operator is used, then the query targets less than the following:


    +   - The index selectivity thresholds for each filter


    +   - The index selectivity thresholds for the sum of those fields


    +   - If the LIKE operator is used and doesn’t have a leading wildcard, for example,
    LIKE `Star%, the Optimizer samples the first 100,000 rows for selectivity.


    Salesforce has an upper limit on how many records would be indexed in the table
    and the 1 million records for a standard index and 333,333 records for custom
    indexes are reflective of that limit. If all indexes in the filter are standard,
    then the standard selectivity threshold is used, otherwise, the custom selectivity
    threshold will be used.'
  merge: -1
  img_proc: true
- pgno: 248
  md: 'Let''s look at some examples to determine whether an index will be used in
    the following SOQL queries.


    # Example 1


    Here we have a filter clause on the **SystemModStamp** field, which is indexed:


    ```

    SELECT name FROM Account WHERE SystemModStamp >

    2019-01-01T00:00:00Z

    ```


    The details pertaining to the object are given in the following table:


    | Total Records in Object | 4,000,000 |

    | Filter has Indexed Field | Yes |

    | Records Returned | 500,000 |

    | Selectivity Threshold | 750,000 |

    | Number of Records Returned is Lower than Threshold | Yes |

    | Query is Selective | Yes |


    Figure 6.13 – Criteria that will be used by Salesforce to determine whether the
    query is selective


    The query is selective in this case because the selectivity threshold will not
    be exceeded when the query is run.


    # Example 2


    In the following example, a custom field is being used as the index. Notice that
    the selectivity threshold is much lower for queries having custom index fields:


    ```

    SELECT name FROM Account WHERE LastEmailedDate__c >

    2019-01-01T00:00:00Z

    ```


    Figure 6.14 shows the details of the object and how the query will behave:


    | Total Records in Object | 4,000,000 |

    | Filter has Indexed Field | Yes |

    | Records Returned | 200,000 |

    | Selectivity Threshold | 250,000 |

    | Number of Records Returned is Lower than Threshold | Yes |

    | Query is Selective | Yes |


    Figure 6.14 – Selective query with the selectivity threshold met'
  merge: -1
  img_proc: true
- pgno: 249
  md: 'Once again, the query is considered selective because the number of records
    returned is much lower than the number of records in the selectivity threshold.


    # # Example 3


    In the following example, the use of two filters with the AND operator causes
    the query to be selective:


    ```

    ```

    SELECT name from Account where RecordTypeId = ''xxxxxxxxxxxxxxxx''

    AND LastEmailedDate__c > 2019-01-01T00:00:00Z

    ```

    ```


    Figure 6.15 shows the behavior when two filters are used in the query, causing
    it to become a selective query:


    | Total Records in Object | 4,000,000 |

    | Filter has Indexed Fields | Yes |

    | 1st Filter Returns (''RecordTypeId = ''xxxxxxxxxxxxxxxx'''') | 200,000 |

    | 2nd Filter Returns (LastEmailedDate__c > 2019-01-01T00:00:00Z) | 300,000 |

    | Records Returned | 150,000 |

    | Selectivity Threshold | 800,000 |

    | Record Returned Lower for Individual Filter and Lower for Intersection of Filters
    | Yes |

    | Query is Selective | Yes |


    Figure 6.15 – Multiple filters having indexed fields results in the query becoming
    selective


    In this example, multiple query filters were used, both of which had indexed fields,
    resulting in a lower number of records being returned than the selectivity threshold,
    and thus making the query selective.


    # # Example 4


    In the next example, the use of two filters with the OR operator causes the query
    to be selective:


    ```

    ```

    SELECT name from Account where RecordTypeId = ''xxxxxxxxxxxxxxxx''

    OR LastEmailedDate__c > 2019-01-01T00:00:00Z

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 250
