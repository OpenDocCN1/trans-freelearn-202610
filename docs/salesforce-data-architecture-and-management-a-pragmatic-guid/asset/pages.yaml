  md: '# # Contributors


    # ## About the author


    Ahsan Zafar is Salesforce Technical Architect. He is 15x Salesforce certified
    and is a Salesforce Certified Technical Architect (CTA) candidate. He has spent
    around two decades working with different aspects of data, including data architecture,
    master data management, and data migrations. Ahsan has also had stints as a Business
    Analyst, Project Manager, and Salesforce consultant on various projects that gave
    him a unique understanding of how data is perceived by different roles. He has
    also worked as a developer and as a technical lead, spending almost a decade implementing
    Oracle ERP systems that typically involved migrating significant volumes of data
    from legacy systems.'
