- pgno: 292
  md: '+   • **Graph data stores**: This type of data store manages entities, which
    is the data itself, but also the relationships between these entities. Entities
    are called **nodes**, whereas the relationships are called **edges**. This type
    of database places relatively more emphasis on how entities are connected to each
    other compared to relational databases. This type of database allows for extremely
    fast queries to understand complex entities and their relationships (nodes). Figure
    7.3 shows an example of a graph data store:


    ![](img/782d45700e093b3d82b348c0ccc8ccba_292_0.png)


    Figure 7.3 – An example of a graph database showing nodes and edges for travelers


    Operations to access nodes and their edges are very efficient in graph data stores
    and are commonly used for use cases where large amounts of data exist and complex
    relationships need to be explored. For example, financial systems that are designed
    for fraud detection use graph data stores to analyze beyond the individual data
    points and form reasonable conclusions.


    +   • **Document data stores**: These data stores are designed to store named
    string fields and values in an entity called a **document**. The format these
    documents use is JSON format and provides flexibility so that every stored record
    can be different than the other. Figure 7.4 shows an example of a document data
    store:'
  merge: -1
  img_proc: true
