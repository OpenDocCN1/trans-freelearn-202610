- pgno: 83
  md: '# Understanding Data Management


    In this chapter, we will look at the importance of managing data and the risk
    and challenges related to data management. We will also discuss some principles
    of data management, the different types of data, the data life cycle, and the
    relationship between data management and data governance. This is going to provide
    you with a foundational understanding of why it is critical to manage data and
    some of the challenges that you will come across when managing your data. We will
    look at some strategies on how to overcome those challenges by applying some commonly
    used principles.


    We will also review best practices related to data management, where we will discuss
    strategies related to managing data and metadata. Learning these best practices
    will allow you to use these in your organization to implement tools and processes
    that will enable optimal data management and efficient use of resources. We will
    also review backup and restore strategies, why they are critical to business,
    and how to go about implementing the tools that will help you manage your data.
    Given that Salesforce stopped providing data restore services in 2020, this section
    aims to equip you with the necessary knowledge to effectively implement backup
    and restore procedures right out of the gate. At the end, we will discuss some
    popular Salesforce tools and third-party tools that can be used to manage data,
    including backing up and restoring it.'
  merge: -1
  img_proc: true
- pgno: 84
  md: 'The topics covered in this chapter include the following:


    +   - What is data?

    +   - What is data management?

    +   - Aspects of data management

    +   - Data backup and recovery

    +   - Tools of the trade


    # What is data?


    I have come across many projects where the terms *data* and *information* were
    used interchangeably, and this was fine in most cases, but in the same way that
    we established a common understanding of the term *architecture*, it would be
    prudent to do the same here.


    Data is a representation of facts that are either stored digitally or on other
    media, such as physical photos or paper. It is important to acknowledge that not
    everything presented as data is factual, with *factual* here meaning that because
    it''s the truth when seen in combination with other data elements, it will convey
    the full picture of the truth. Data shouldn’t be reviewed without considering
    the context of the data, because data without context causes confusion and opens
    the door to misinterpretation. Consider how many ways there are in which dates
    can be presented. In fact, it is a common source of confusion when you see a date
    written like 12-09-2020. Are the first two characters representing the month or
    the day? When you have the context, perhaps on the paper form you are filling
    out, or the web form that instructs you to write the date in the MM-DD-YYYY format,
    that''s when you know that the first two characters are representing the month.
    Therefore, presenting data in context is important, otherwise, it loses its value
    and effectiveness.


    Data is sometimes referred to as the raw material for information and information
    as data within context. There is quite a bit of discussion ongoing regarding this
    that is beyond the scope of this book, but for our purposes, we will stick with
    the definition of data as mentioned earlier. In the next section, we will ask
    the question of whether data is really valuable and whether we should devote so
    much energy to managing it properly.'
  merge: -1
  img_proc: true
- pgno: 85
  md: '# Is data valuable?


    Data is and should be considered an organizational asset. This is now easy to
    understand given how social media users have had their data aggregated and sold
    to marketers in the past. Every organization, for-profit and not-for-profit alike,
    realizes the importance of data and tries to harvest it to gain valuable insights
    that can drive decision-making. For example, until a decade or so ago, very few
    mining companies had the knowledge or the expertise to understand fuel consumption
    and usage of their heavy-duty machinery, but today that data is sent through onboard
    sensors to centralized databases where it is aggregated and analyzed for fuel
    consumption. This helps the company to understand which machine is idling excessively
    versus those that may be using too much fuel, which could be an indication of
    an imminent breakdown. Proactively servicing the machine could save the company
    hundreds of thousands of dollars in downtime and maintenance costs.


    Similarly, for a non-profit organization, understanding its donor base, their
    interests, and demographics are all vital for the organization’s continued operations.
    Using data in its system, it can analyze the data to determine which channels
    to focus their ads on if they are targeting a specific demographic. Similarly,
    data can also be used to determine which areas need the most help traditionally
    so the organization can focus its energy on those areas.


    As the science of AI matures and gains traction, data will continue to gain importance
    and form the backbone of many new businesses and existing businesses will continue
    to look for ways to adopt it. AI is the science of training systems that can simulate
    tasks based on data. These systems continue to self-learn and refine their decision-making
    capabilities as new data becomes available. For example, Tesla uses internal and
    external sensors on its cars that send data back to its data centers and can then
    be used to show the average increase in speed over certain patches of road, determining
    hazardous locations that are causing drivers to take sudden action. Tesla accords
    data collection and analysis a high level of importance, going as far as parsing
    its online forum for insights.


    Now that we understand the value of data, we will look at what data management
    is and why it''s important in the next section.'
  merge: -1
  img_proc: true
- pgno: 86
  md: '# # Introducing data management


    Data management is the discipline of collecting, storing, and using data effectively
    and in a cost-effective manner. The key goal of data management is to put in measures
    to ensure that data remains viable and fit for its intended purpose and that when
    it has ceased to be useful, it is appropriately discarded or archived. Earlier,
    we established that data is a valuable resource and an asset to any company, but
    let''s look at some of the benefits of data management.


    # # Benefits of data management


    Data is critical to businesses regardless of their size, revenue, or industry.
    From a small mom-and-pop donut shop that serves locally to very large businesses
    that serve millions of customers every day, proper data management practices,
    processes, and tools are essential. Of course, a small business will not need
    to implement a Master Data Management (MDM) solution to manage its data, but a
    large organization will not be able to operate efficiently without it.


    Let''s now review the benefits of data management more holistically:


    +   * **Realizing cost efficiencies**: Think about how much time you have spent
    searching for the travel policy on the company portal, spending time looking for
    an expense reimbursement form, or simply looking up a non-standard abbreviation
    that''s just used internally in the company. A 2011 survey by Gartner reports
    a 20% reduction in labor productivity due to data quality issues. However, organizations
    that have effective data management report spending less because of data being
    readily available.


    +   * **Avoiding costly mistakes**: Mistakes happen, and they are part of any
    job function you are in. Whether you are a doctor, lawyer, architect, or cashier,
    everyone makes mistakes, but some mistakes can be costly. For example, if you
    were excited about your start-up, which was banking on foothall and certain demographics,
    but that data was incorrect, your start-up''s existence could become questionable.
    In more extreme scenarios, consider a physician who just finished his 12-hour
    shift in ER and updates a patient''s file with instructions and medication. The
    problem is that this patient has the same last name as another patient for whom
    these instructions are intended. Barring the fact that this is caused by a human
    error, nonetheless, the consequences could be life-threatening in this scenario.'
  merge: -1
  img_proc: true
- pgno: 87
  md: '+   - Improving decision-making: Effective data management leads to improved
    and effective decision-making with accurate, up-to-date data being available for
    decision-makers. For example, having access to reliable data helps organizations
    forecast their sales more accurately and proactively take measures in case forecasts
    show a downward trend in the market.


    +   - Creating more buy-in: When decision-makers and other users of the data have
    access to reliable data that translates into more revenue, reduced costs, or both,
    people using the data feel more confident about it and are willing to learn and
    use the system more effectively, as well as to adopt new system enhancements.
    Conversely, when data is not managed properly, consumers of that data lose confidence
    in it and start to use other means to complete their tasks. For example, a quoting
    system was implemented at a large dealership with integration from the **Enterprise
    Resource Planning (ERP)** system feeding the quoting system, with prices for the
    products added onto the quote. A few weeks after going live, it was found that
    sales representatives from the trucking division were not using the system compared
    to their peers in other divisions because the prices pulled onto the quotes were
    not accurate. An emergency meeting was called with the IT support team and, after
    determining the root cause, a fix was introduced to rectify the problem.


    +   - Reduced security risks: An effective data management policy ensures the
    security of your data. A 2020 *Cost of a Data Breach Report* (https://www.ibm.com/security/data-breach)
    by IBM reported that the average cost of a data breach is 3.86 million US dollars
    and takes about 280 days to identify and contain. The 2019 *Global Risks Report*
    from the World Economic Forum rated cybersecurity as the top threat facing society.
    A key aspect of cybersecurity is protecting data so business operations can continue
    to run smoothly.'
  merge: -1
  img_proc: true
- pgno: 88
  md: '+   - **Reduced reputational risk**: Trust and reputation are key ingredients
    for any business to maintain and grow its customer base. Customers will trust
    organizations that will manage their data properly and do the right thing if their
    data does get mismanaged. The *Cambridge Analytica* scandal was the last straw
    for many Facebook users who quit the service after the scandal became public.
    Having a robust data management plan inspires confidence not only internally within
    the organization, but also with stakeholders because they know the organization
    has its bases covered if a situation like that was to happen.


    +   - **Maintaining a competitive advantage**: If you are a company in the hi-tech
    industry and spend millions on R&D, having your intellectual property exposed
    to unscrupulous actors could be devastating and may lead to the demise of the
    company. In certain situations, it may be deemed a national security risk. This
    was the case with the Equifax breach in 2017 when roughly 147 million customers
    had their data stolen by alleged foreign actors. The fear was that the data could
    be mined and intelligence operatives who were in financial distress could be manipulated
    by foreign actors.


    We have looked at the benefits of data management, so now let''s look at the challenges
    associated with managing data.


    # Challenges of data management


    Most organizations have volumes of data that keep on increasing, not only in size
    but also in terms of the sources of the data. Let’s take the example of data from
    the Internet of Things (IoT) or social media. Neither of these was a source of
    data prior to this century, but nowadays they are probably among the top sources
    of data. These changes not only opened myriad opportunities for organizations
    to make the data meaningful and translate it into revenue but also brought challenges
    with it. Here are some of the challenges that organizations face today:


    +   - **Putting data to good use**: Many organizations are collecting data and
    storing it, but just doing that is not good enough because data, by itself, doesn’t
    provide any value unless something is done with it. Figuring out what to do with
    that data once it is collected is a time-consuming process and doesn’t happen
    by itself. It requires dedicated resources and funds to make the data useful.
    With the advent of tools such as Salesforce’s Einstein Analytics, organizations
    will be able to reduce the effort but nonetheless, the point is that data needs
    to be worked on in order to make it valuable.'
  merge: -1
  img_proc: true
- pgno: 89
  md: '+   - **Lack of executive sponsorship**: Data management should be woven into
    the organizational culture, so everyone is made responsible for data and takes
    ownership in their respective areas. This requires executive buy-in, in other
    words, resources both in the form of human resources and funding that can be made
    available. This also requires that executives support and use data in their own
    decisions. However, this can be a challenge in more traditional types of organizations
    that have been operating successfully for a long time and don''t see the need
    to invest resources and time in data management activities. With new industry
    disruptors such as Uber, Tesla, and Airbnb, it is not so farfetched that new data-driven
    technology can significantly uproot traditional business models and threaten their
    very existence. Many companies are realizing at the executive level that data
    is a key component to continued success and growth and have started to hire Chief
    Data Officers (CDOs), but this is still a relatively new phenomenon.


    +   - **Compliance with regulations**: Regulations related to data management
    are complex and vary across jurisdictions; moreover, new regulations keep getting
    introduced while existing ones get updated. This is a challenge for organizations
    to keep pace with and to continue to be on the lookout for any non-compliance.
    Non-compliance penalties are not only hefty but pose a serious reputational risk
    to organizations.


    +   - **Understanding what data is already there**: It used to be that organizations
    created data from several systems, analyzed and reported on that data, archived
    it, and eventually purged it when it was not needed. With smart devices, sensors,
    and social media becoming increasingly adopted and accepted in our societies,
    data continues to grow exponentially, quickly filling up databases. According
    to an estimate, every day, 2.5 quintillion (1 quintillion = 1,000,000,000,000,000,000,000)
    bytes of data are created. IDC, a reputable market intelligence firm, reports
    that worldwide shipments of smart devices alone are forecast to exceed 1.4 billion
    units by the year 2024 (https://www.idc.com/getdoc.jsp?containerId=prUS47567221).
    It can be a gigantic task to keep tabs on all this data and knowing what data
    is available. This also leads to a reactionary approach to data issues, which
    get addressed only when problems arise. Understanding the data also involves knowing
    which processes are data-driven and how critical data is for those processes to
    continue running.'
  merge: -1
  img_proc: true
- pgno: 90
  md: '+   - **Lack of effective communication**: Communication is very important
    and must happen if any meaningful change needs to happen within the organization.
    Strategic efforts, such as data management initiatives, cannot succeed without
    an effective communication strategy that helps stakeholders understand why data
    management is important and what is in it for them. Communication needs to be
    tailored for different functions in the organization to ensure that the message
    will get across and is appropriate for that function. Finance, for example, has
    different needs and requirements to HR as regards data.


    +   - **Interoperability of data**: We have established that there are multiple
    sources of data and, when it ends up in organizational stores, it can end up in
    data lakes, data warehouses, or other databases. With these data stores having
    their own nomenclature and formats, data first needs to be transformed so that
    it can be easily consumed for analysis and reporting.


    +   - **Lack of a holistic view of the data**: The ownership of data is sometimes
    fragmented, meaning data management may be the responsibility of a select few
    in a department or company. This is especially true in a decentralized operating
    model, which we will discuss in the Data management operating models section.
    This can lead to silos, resulting in the data being viewed at a department or
    function level rather than looking at it holistically from a company''s perspective.
    This tunnel vision view leads to intra-office politics and slows down initiatives
    that are put in place to reap the benefits from this data.


    +   - **Inadequate processes and systems**: Some organizations understand the
    importance of data but lack the processes and systems to derive benefits from
    this data. They may even have some processes to manage their data, but these may
    be insufficient in number or lacking in optimization, resulting in a lack of confidence
    in the output from that data. This can trigger a downward spiral effect where
    users are not confident in the data that they are receiving, resulting in a downward
    trajectory that can also result in key roles associated with managing the data
    losing motivation in terms of continuing to maintain their data.


    In this section, we reviewed, what data management is, and understood the need
    for it and the challenges associated with having an effective data management
    strategy and its implementation. Now that we have looked at the benefits and challenges
    of data management, in the next section, we will review the data life cycle and
    other aspects of data management.'
  merge: -1
  img_proc: true
- pgno: 91
  md: '# Introducing the data life cycle


    In this section, we will look at the data life cycle and then look at an example
    within the context of Salesforce. The data life cycle provides a high-level overview
    of data from the time it is created to the time it is purged. Having clarity regarding
    how data gets created and moves throughout the life cycle helps in understanding
    where the activities that we perform daily fit, from an operational point of view,
    and how they are important. There are five stages a specific element of data will
    go through in its lifetime:


    +   1. Data creation

    +   2. Storage

    +   3. Usage

    +   4. Archival

    +   5. Purge


    We will now look at each of these in more detail.


    # Data creation


    This is the first phase of the data life cycle. In this phase, data is created
    or acquired, which can happen in many ways. Consider the example of Dun & Bradstreet,
    which provides data enrichment capabilities for Salesforce. A more common example
    is the use of an IT application to create data; for example, creating a product
    catalog in an ERP. In other instances as well, companies may use devices to create
    data; for example, the use of scanners to scan multiple paper invoices and create
    the data directly in an invoice management system.


    # Storage


    This is the second phase of the life cycle and pertains to safely storing the
    data that has been created. This is where database security, network security,
    and levels of security come into play to ensure that the data is adequately protected.
    A backup and recovery process is also implemented to ensure that the data can
    be recovered in case of issues.


    # Usage


    This is the phase where data is actually put to use. It can be viewed, updated,
    moved to another data store, transformed, and have analytic processes run on it
    to generate insights from the data. Data can also be shared with outside organizations;
    for example, an organization submits quarterly tax reports to the federal tax
    agency.'
  merge: -1
  img_proc: true
- pgno: 92
  md: '# # Archival


    Just like you may come across a job offer email from 3 years ago when searching
    for other emails and decide to archive it, data has a useful life of its own,
    after which time it needs to be archived. Archival is usually done when the organization
    determines that the data may not be very useful after a certain time frame, but
    is needed for regulatory or audit purposes. Occasionally, an organization may
    find a need to refer back to the archived data. For example, a large **Customer
    Relationship Management(CRM)** implementation project decided not to bring in
    all the data from the legacy system into Salesforce, but to ensure continued access
    to the data in case it was needed, it closed access to the legacy system for everyone
    except for the admin. This way, the company saved time and money by avoiding bringing
    in data that was not of very high value but also made sure that its business operations
    were not adversely impacted.


    # # Purge


    In the *Challenges of data management* section, we looked at how fast data grows,
    and it is not feasible nor useful to keep every bit of data forever. Depending
    on the industry of the organization, regulatory laws may dictate a data retention
    period, after which point it must be purged. Purging involves removing the data
    from your systems completely. This is especially important because laws such as
    the **General Data Protection Regulation** (GDPR) demand that when a subject whose
    information is being stored requests a *right to be forgotten*, their data must
    be completely and irreversibly removed from all the systems of the organization.


    Now that we have looked at the data life cycle, let''s briefly apply these to
    a Salesforce example.


    # # Data life cycle – A Salesforce example


    Let''s walk through an example in the context of Salesforce to better understand
    how the data life cycle can be applied and the benefits of categorizing data like
    this. A hypothetical company, Magnum Health Services, based in the United States,
    is using the service cloud to capture its customers'' health claims. Magnum has
    a large customer base of 60 million customers and growing. It receives about 10
    million cases every year. The company is expecting 5% annual growth in its customer
    base and forecasts the caseload to increase to 11 million every year. Let''s review
    how each phase of the data life cycle would apply in this scenario.'
  merge: -1
  img_proc: true
- pgno: 93
  md: '# Data creation


    Customers can create cases by calling the hotline or by email. Magnum’s admins
    have also set up their system so that social media posts that mention the company
    on Facebook and Twitter are automatically created as cases in the service cloud.
    In a nutshell, Magnum has multiple channels of communication, which means that
    there are multiple sources from which data is being created.


    # Storage


    All the cases that are created get stored in the Salesforce Platform and are protected
    by multiple layers of security, including IP restrictions, profiles, and other
    measures that Salesforce takes to protect its infrastructure, including databases,
    servers, and networks.


    # Usage


    This data is available to internal as well as external users, in other words,
    customers. Internally, case owners can view, update, and delete cases; for example,
    a Facebook post that was automatically created as a case but doesn’t need any
    response from the company. Managers and executives can run reports and view dashboards.
    Externally, customers can interact with their case by providing more details,
    uploading files, or simply marking the case as resolved through the Customer Community.


    # Archival


    Because Magnum is dealing with customer health data, it needs to make sure that
    it is compliant. Salesforce is compliant with the **Health Insurance Portability
    and Accountability Act (HIPAA)**-compliant and provides the tool to ensure that
    its customers set up the platform to be compliant with health acts. Magnum has
    set up a **Field Audit Trail**, which is part of Salesforce Shield and automatically
    archives data as defined by law.


    # Purge


    Magnum has developed custom processes that are run to delete data from archive
    objects once the required retention period has passed. This way, Magnum can meet
    its obligations to keep customer data safe and frees up Magnum resources to be
    used for the next set of records that can be archived.


    Now that we have looked at the data life cycle, let’s review the operating models
    of data management in detail and understand the pros and cons of each.'
  merge: -1
  img_proc: true
- pgno: 94
  md: "# Data management operating models\n\nYou cannot have an effective data management\
    \ strategy implemented if there is a lack of ownership, decision-making, and oversight.\
    \ Having an effective operating model helps in establishing roles and responsibilities\
    \ and accountability from the point data is created to the point it is purged\
    \ in an organization. The most common operating models are the following:\n\n\
    +   * Centralized\n+   * Decentralized\n+   * Hybrid\n\nWe will review these models\
    \ in the sub-sections below.\n\n> **Definition**\n> \n> An **operating model**\
    \ is a representation of how an organization operates. In the context of data\
    \ management, it allows us to visually represent how an organization manages its\
    \ data-related processes with appropriate checks and balances.\n\n# Centralized\
    \ operating model\n\nThe **centralized operating model** is a formalized operating\
    \ model that has a data management lead responsible for decision-making and providing\
    \ vision and direction for the organization. Because there is a single individual\
    \ accountable to lead the change, decision-making is swift and the role, due to\
    \ it having proximity to the executive, yields significant influence and can lobby\
    \ for resourcing and funding at the executive level.\n\nThe flip side is that\
    \ this requires a significant shift in roles and new hires to form this type of\
    \ data organization, resulting in longer times and increased costs. It can also\
    \ result in excessive red tape because approvals must be sought for initiatives.\
    \ This type of operating model can also have the data governance lead become overly\
    \ influenced by enterprise-level targets, rather than also keeping the individual\
    \ business units and the associated business process nuances in the decision-making\
    \ process."
  merge: -1
  img_proc: true
- pgno: 95
  md: '# # Decentralized operating model


    The **decentralized operating model** is the opposite of the centralized model
    and decision-making is done by consent through committees. In this model, data
    management activities are the responsibility of individual business units or lines
    of businesses. Because each **Line Of Business** (**LOB**) understands its business
    very well, this model is relatively easy to implement because generally, data
    issues are very well understood, and because there is individual LOB ownership,
    they can be quickly addressed as well.


    The challenge though is that it can be difficult to gain consensus in this model;
    for example, data management priorities for one LOB may not be the same for another
    LOB. Compared to the centralized model, it can be challenging to sustain this
    model over time because of a lack of clear accountability and ownership. One way
    to deal with this is to have ownership of data management initiatives rotate among
    the LOBs, but have a clear vision and guiding principles to guide the decision-making
    process.


    # # Hybrid operating model


    The **hybrid operating model** is a combination of centralized and decentralized
    operating models. In this model, a **Center of Excellence** (**COE**) operates
    under the direction and oversight of the steering committee, which comprises stakeholders
    that represent key business units in the organization. The COE guides in terms
    of tools and best practices and drives the vision of the organization. The steering
    committee has executive and senior-level managers that can drive decision-making
    and ensure that the vision is understood by the COE. The benefit of this model
    is that it grants autonomy to business units, but also has the oversight that''s
    required to realize the data management vision. Business units also benefit from
    the expertise of dedicated resources that are part of the COE.


    Although the hybrid model provides a good combination of benefits from the centralized
    and decentralized models, it does require additional **Full-Time Equivalents**
    (**FTEs**) to run the COE, which can increase the initial costs in setting this
    up up. Sometimes, overly influential or outspoken executives that are part of
    the steering committee may drive the committee decisions that are not well thought
    through and may be perceived as self-serving. Another factor is that progress
    and meeting KPIs are dependent on self-reporting from business units, which can
    complicate oversight.


    Now that we have looked at some of the common operating models in a data-driven
    organization, next we will review best practices for data management.'
  merge: -1
  img_proc: true
- pgno: 96
  md: '# Learning data management best practices


    In this section, we will be learning data management best practices within the
    context of Salesforce. You probably already realize that Salesforce is increasingly
    being used for more than just CRM, and companies are using it for critical business
    functions. Even if it was only used as a CRM, data would be very important and
    require continuous data management.


    In my opinion, gone are the days when you could go to your production org and
    add or modify existing functionality because a user requested it. With more intra-dependencies
    between applications built on the platform and inter-dependencies between external
    systems and Salesforce, changes concerning data and metadata, in particular, must
    be thought through. I am not proposing spending hours and days analyzing what
    impact adding a new list view is going to have, but pragmatically approaching
    changes to your production environment based on the size of the change and how
    interlinked it is with other applications or integrations. For example, adding
    a new field to the object would not require as much analysis as changing the type
    of field from a multi-select picklist to a single-select picklist.


    We must understand that data management is a marathon and not a sprint. It demands
    constant management by tweaking processes and tools and communication at all levels
    within the organization to remind users how important it is to the organization
    and for the user''s own decision-making. Imagine a B2C business that sends out
    personalized thank you notes with special discounts to 50,000 top customers, but
    5,000 of those didn''t reach the intended recipients because the addresses were
    incorrect and the company hadn''t provided easier ways for its customers to update
    their addresses when they moved. Not only did the company waste money by sending
    those brochures to incorrect addresses, but also lost potential revenue. In addition
    to that, the company also risked unhappy customers because when some or all of
    those 5,000 customers find out that they didn''t get those notes along with the
    discounts, it will also undermine customers'' trust in the company. It may cause
    them to think that they don''t know – or worse – care about their customers.'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'The 1-10-100 data quality rule is another reason why data management is important.
    This rule states that problems caused by data issues will cost you $1 in prevention,
    $10 in remediation after an issue has materialized, and $100 after a failure.
    It must be remembered that the dollar amounts are relative numbers, but the principle
    still applies. Taking our earlier example, sending out 5,000 notes to the wrong
    address is in the failure section (see next figure), and will cost a lot more
    to fix. Let’s say we knew about this problem and cleaned and validated our data
    by hiring some data entry clerks, then the cost would have been much less. The
    best scenario would have been to put tools and processes in place at the prevention
    stage, but companies either lack the will or consider it an expense to fund these
    tools and processes rather than an investment. In the following diagram, as we
    go down the pyramid, the cost of fixing a problem grows exponentially:


    ![](img/782d45700e093b3d82b348c0ccc8ccba_97_0.png)


    Figure 3.1 – Relative cost of prevention versus remediation and failure


    The diagram demonstrates that resources spent preventing a problem from materializing
    cost much less than remediating them or rectifying them when a major failure happens.
    In the following sections, we will look at some data management best practices
    related to both data and metadata.'
  merge: -1
  img_proc: true
- pgno: 98
  md: '# ## Understanding data and metadata


    Just as data is important for businesses, metadata is even more important because
    it forms the foundation of your organization. Think of metadata as the foundation
    and framework of a house, both of which cannot be seen once a house has been completed,
    but which form an integral part of the house. Another benefit of implementing
    data management best practices is that they facilitate development of metrics,
    which can be used to assess your organization against an objective criteria. Typically,
    when you ask someone how good the data management practices are, the answer is
    *pretty good, not great*, or something similar that is based more on a gut feeling
    rather than solid **Key Performance Indicators (KPIs)** that can be reported.
    If you are an employee working for a Salesforce customer, you can use these to
    continuously monitor your organization for metadata and data quality or, if you
    are a consultant, then use these as a basis to assess the state of the organization
    and to recommend steps to bring it to an optimal state with respect to both data
    and metadata. Knowing and adhering to these best practices will help maintain
    your organization and allow you to scale with ease while facilitating an optimal
    experience for users when they are working in your Salesforce org.


    In the next section, we will do a deep dive into best practices related to metadata.


    # ## Metadata best practices


    As mentioned earlier, metadata must be managed continuously as well. Think of
    unused fields and objects that have data and are no longer used because an AppExchange
    package has now replaced the functionality. These are just some examples. What
    follows below are guidelines and best practices that will ensure that your organization
    remains scalable and consequently, your data is valid and useful. I do want to
    mention that some of these, by themselves, may seem very innocuous, but combined
    they can seriously hinder velocity and slow down development. Remember, speed-to-value
    is a critical factor in the continued growth and success of any business in the
    global economy today. You will want to make sure that you have processes in place
    to respond quickly to changing market conditions so as to derive benefits from
    possible opportunities or reduce your exposure to risk, which can jeopardize your
    business'' existence.


    # ## Required fields


    Required fields are a great way to reduce data quality issues, but should be used
    prudently. An excessive number of required fields will slow down data entry for
    users and encourage behavior that is not congruent with a data-driven organization.
    For example, users would start entering random text in free-form text fields just
    to get through the form. My suggestion is to have no more than 5–7 required fields
    on a page layout.'
  merge: -1
  img_proc: true
- pgno: 99
  md: "Unless you are absolutely sure they are needed, try not to have the required\
    \ fields at the object level. The reason is that any integrations that you put\
    \ in will now need to populate the required fields as well. This may not work\
    \ well for scenarios where the required field must be populated when a user is\
    \ doing data entry but is not required when data is brought in via integration\
    \ from another system.\n\n# Formulas and roll-up summary fields\n\nThis is another\
    \ one where you don't want to be excessive with it, but also too few of these\
    \ fields indicate that things may be being done in code. During assessments, I\
    \ will look for key objects, such as `Account`, `Opportunity`, `Quote`, and, if\
    \ it's a custom application, objects that are on the parent side in a parent-child\
    \ relationship, as well as roll-up summary fields.\n\n> **Limits**\n> \n> There\
    \ is a limit on the number of parent-child or master-detail fields you can have\
    \ on an object. There is a performance cost associated with these fields, and\
    \ therefore, you want to be careful and use these only when it's absolutely needed.\
    \ There are similar limits on roll-up summary fields, which out of the box only\
    \ work with master-detail fields.\n\nSimilarly, look out for formulas on objects\
    \ that are critical to the application and review the code to check whether there\
    \ is logic in the code that could have been more suited to formulas.\n\n# Record\
    \ types\n\nRecord types are one of the many powerful features that the platform\
    \ provides, but being excessive may be detrimental. This is because record types\
    \ control picklist values and, depending on how many picklist fields you have,\
    \ it can quickly become cumbersome to maintain these for too many record types\
    \ in particular. I recommend having no more than 5–7 record types per object.\
    \ Having excessive record types in the org usually means there are as many page\
    \ layouts for the object, which can be an administrative overhead to maintain.\n\
    \n# Profiles\n\nAt the outset, the best practice is to control access via permission\
    \ sets. It may be very tempting to create profiles to control access, but a large\
    \ number of profiles can become an admin's nightmare. Consider an organization\
    \ where you have 15 profiles and 100 fields on 10 objects. The initial setup alone\
    \ for read-only access can involve a review of 15,000 checkboxes and another 15,000\
    \ for editing."
  merge: -1
  img_proc: true
- pgno: 100
  md: 'One good reason for creating profiles is for page layout assignments that can
    only be controlled through profiles and not permission sets. Even in this case,
    I suggest taking a good look at your design and seeing whether there are other
    ways in which you can achieve your business requirements.


    # # Removing unused fields and objects


    This is a straightforward one but, surprisingly, I have seen organizations where
    the admin created an object with a few fields in production to *try out a quick
    **Proof of Concept** (POC)* and never got to remove the object completely once
    they were done. You should make a habit of not doing these types of POCs or enhancements
    in production in any case, but if you have to for any reason, maintain a list
    of fields and objects you are creating so that you can remove them if they are
    not required.


    The same guideline applies to fields as well. Unused fields are no fun and cause
    confusion for end users in reporting, and especially if they are on the page layout,
    cause integration problems and just generally lead to a cluttered organization.
    Remove them if they are not used. Aim for no unused objects and fewer than 15%
    unused fields, which you need to put on your backlog for removal.


    # # Report proliferation


    Try to establish a robust framework on how reports will be managed. The ease with
    which reports can be created in Salesforce is a double-edged sword. It is easy
    for end users to create their own reports in a matter of minutes, but without
    any guidelines and governance, this can lead to report duplication, a plethora
    of unused reports, and reports with no description so no one knows what they do.


    Run the following query to assess when a report was last run. For example, have
    a rule that says if a report has not been run in the last 18 months, mark it for
    deletion after discussing it with the report owner. You can have any time period
    you want, but I recommend 18 months because that would cover the calendar year
    start and end dates and non-calendar fiscal year dates as well. This would cover
    your bases in cases where a report is specifically run at certain times of the
    year:


    ```

    SELECT Id, Name, Description, LastRunDate, LastModifiedBy.Name

    FROM Report

    WHERE LastRunDate < 2019-06-01T00:00:00Z

    ORDER BY LastRunDate DESC

    LIMIT 50

    ```'
  merge: -1
  img_proc: true
- pgno: 101
  md: 'Also question the value of reports created by users who are no longer active.
    Check whether the report is being used as a first step, and if it is, ask the
    person or the function running the report to create their own copy of it and then
    delete the report created by an inactive user.


    Another thing to mention under reports is custom report types. Completely eliminate
    the fact that your existing custom report types cannot meet the reporting need
    before creating new report types. Large numbers of report types confuse end users
    when they are creating new reports and cause a maintenance nightmare because,
    for example, when a new field is added to the object, custom report types don’t
    automatically get updated and require that you update the report type, field by
    field.


    Create report folders and give access to your users through roles or other options
    that are available for sharing reports. If there is no folder structure, users
    will be creating reports in public folders, which makes it difficult to find the
    report a user needs to run. One approach for report management using folders is
    to create folders for each function, for example, marketing, sales, pre-sales,
    and finance. Another approach could be to create folders based on hierarchy, for
    example, an executive reports folder has all the files that executives need, with
    another one for directors, senior managers, managers, and so on.


    # Using multiple business logic tools for an object


    Another metadata management practice to keep in mind is to avoid mixing a lot
    of tools on a single object. Take, for example, a workflow on a custom object,
    which already has two process builders, a flow and a trigger that has a `before
    update` trigger to validate data before it gets saved to the database. All of
    these can cause a real challenge in understanding the flow of data and cause unexpected
    errors. Depending on the use case, consolidate your business logic in a single
    trigger that can gracefully handle your business requirements. This is one of
    the few places where code should be used rather than clicks.'
  merge: -1
  img_proc: true
- pgno: 102
  md: '# App proliferation


    Pay attention to creating too many apps. Look for synergies between apps where
    possible and use permission sets to control access. For example, if there is a
    special price request, consider consolidating this with your sales app. Requiring
    users to switch between apps diminishes a great user experience and confuses them.
    In one organization, there were more than 20 apps for the sales team that were
    used in different parts during the sales process, but required additional training
    for users, not to mention the maintenance that was required for their upkeep.
    In rare situations, I found some apps had overlapping functionality, too, because
    they were developed over a period of time, and analysis to ascertain that a similar
    functionality didn''t already exist wasn''t undertaken.


    # Multiple triggers on single objects


    This is not supposed to be a discussion of development best practices, but I feel
    this one item needs to be mentioned. Do not put multiple triggers on the same
    object. Instead, use trigger handlers or other frameworks to handle your logic.
    The reason I mention this point here is the sequence of when these triggers run
    cannot be controlled and it can lead to many data issues. For example, if you
    have a couple of developers independently working on multiple business requirements
    that are deemed to be best met via a trigger on the Opportunity object when a
    developer is done with their part, they promote their trigger to production and,
    after a few weeks, the second developer gets their trigger promoted to production.
    If the business logic depends on one trigger firing before the other, there is
    no way to control that. Sometimes, a trigger coded by the first developer may
    fire first and other times, the trigger coded by the second developer may fire.
    Another downside is that governor limits will be shared by both triggers, thereby
    raising the possibility of the code erroring out due to query or timeout limits.


    # External IDs


    External IDs, if used properly, can be a very powerful tool for managing data.
    Use them when integrating Salesforce with external systems. They allow you to
    have a single version of the record between Salesforce and the external system.
    For example, when integrating products from SAP into Salesforce, the unique product
    ID in SAP can be stored in an external ID field in Salesforce. Any subsequent
    updates to the product in Salesforce can easily be made using that external ID.
    This avoids creating duplicates in Salesforce and makes pushing updates into Salesforce
    easy.'
  merge: -1
  img_proc: true
- pgno: 103
  md: "# # Naming conventions for metadata\n\nNaming conventions are applicable to\
    \ both data and metadata. If possible, have naming conventions and standards developed\
    \ before implementing your Salesforce org. If this is not possible, try implementing\
    \ naming conventions for configuration and development going forward, and, in\
    \ the case of existing metadata, make a point to add this to your backlog and\
    \ slowly work through it. Having standardization across this can reap many benefits\
    \ and increases velocity. Consider, for example, a complex flow that has no description\
    \ and the name is so ambiguous that it doesn't give any indication of what it\
    \ does. Just to get the gist of what it does can take a significant amount of\
    \ time. Similarly, if a class is named such that it doesn't give any indication\
    \ of what it does, or worse, has no header comments that give the purpose of the\
    \ class, you would need to look through the code just to get the gist of the class.\n\
    \nAs mentioned, this can be very time-consuming, and note that any analysis or\
    \ design work to fix the bug or enhance the flow or the class hasn't even started\
    \ yet. Hereunder, I offer guidance on how best to name components in Salesforce.\
    \ I will provide a general guideline, followed by an example of how not to name\
    \ these components and then an example of how to name them. This is so it becomes\
    \ crystal clear in terms of what to do compared with what not to do:\n\n+   *\
    \ **Lightning Flow (LF) and Process Builders (PB):** Lightning flows and process\
    \ builders should be prefixed with LF and PB, respectively. Then, proceed with\
    \ the triggering object name and, in the case of an autorunning flow, use Auto\
    \ and then give the process a descriptive name that's specific and conveys the\
    \ gist of the process. As a rule of thumb, use verbs to describe the actions that\
    \ your components are used for rather than nouns; for example, set field, create\
    \ lead record, and so forth, rather than lead record creation, acceptance email,\
    \ and so on.\n+   \n+   **Do:** PB – Opportunity Set Custom Forecast Field, LF\
    \ – Lead Update Lead Owner, LF – Auto Send Survey – Clear names that denote whether\
    \ the flow is a process builder or lightning flow, along with the functionality\
    \ of the process.\n+   \n+   **Avoid:** Update fields, Set forecast__c, Create\
    \ child record v3 – Unclear names that don't reflect the intent of the application.\
    \ It is unclear how the process is triggered.\n\n+   * **Public groups:** Ensure\
    \ group names are meaningful, complete, and specify the application name where\
    \ applicable. Use the application name followed by the specific group of users\
    \ or roles that the group contains.\n+   \n+   **Do:** Data Governance – Midwest\
    \ Data Stewards, Data Governance – Director and Above Approvers – Denotes the\
    \ application, along with the users or roles that are in the group."
  merge: -1
  img_proc: true
- pgno: 104
  md: "Avoid: Public Group 1, Role Groups – It is unclear who the users are or what\
    \ application the group is used with.\n\n+   • Email templates: Email template\
    \ names should be complete, meaningful, and have the application name they are\
    \ used in referenced in the email template name. Use folders to group your templates\
    \ for applications rather than storing them in the public folder. Start with the\
    \ application name followed by the purpose of the template and the subject of\
    \ the email template. If the email subject is very long, use a shortened version.\n\
    +   \n+   Do: Data Governance – New Account Request – Inform Data Steward – Clearly\
    \ identifies the application and the purpose of the email template, followed by\
    \ its subject.\n+   \n+   Avoid: Template 1, Send email, Inform record owner –\
    \ These are all examples where the intent and purpose of the email template are\
    \ unclear.\n\n+   • Permission sets: Where possible, permission sets should be\
    \ used over profiles as a best practice. Given that permission sets are used to\
    \ open access to objects, system permissions, or application permissions, the\
    \ name should reflect that as well. For objects, it may not be possible to list\
    \ all the objects in the name, in which case the permission set description should\
    \ be used. Try to use a verb at the beginning and indicate the essence of the\
    \ permission set. If it's an application-specific permission set, use the name\
    \ of the application and the role of the user the permission set will be assigned\
    \ to.\n+   \n+   Salesforce has recently released a new feature called permission\
    \ set groups, which allow you to group permission sets for easier administration.\
    \ Similar considerations should be applied when naming permission set groups that\
    \ are applied for permission sets.\n+   \n+   Do: View Setup, Read Only Sales\
    \ App, Create Leads, Data Governance Stewards, Invoicing Administrator – Different\
    \ examples of naming permission sets providing the gist of the permission set.\n\
    +   \n+   Avoid: Permission Set Western Region, Quote Permission Set – Use of\
    \ the phrase permission set is not needed as we already know it is a permission\
    \ set. It is unclear who the users are or what application the permission set\
    \ applies to.\n\n+   • Report and dashboard folders: Ensure that you have really\
    \ good controls regarding report and dashboard naming conventions and general\
    \ administration of these components because things can quickly spiral out of\
    \ control with them. Train your users and encourage them to use report filters,\
    \ rather than creating multiple copies of reports for each quarter, fiscal year,\
    \ and so on."
  merge: -1
  img_proc: true
- pgno: 105
  md: 'Unless there is confidential data, encourage the use of report sharing between
    business functions. This way, users don''t need to create new reports unless it''s
    required and it increases collaboration between business functions. This can be
    done using folders. You can name them by business function or by usage. Another
    tip is to keep all reports that are used on a dashboard in a single folder for
    quick access, troubleshooting, and enhancements. Here are some guidelines for
    report folder naming conventions:


    Do: Data Governance – Records Management, Corporate Marketing Reports – These
    represent clear names based on the application or the general purpose of the reports
    in the folder.


    Avoid: All Reports, General Reports, Europe Reports – It is not very clear in
    terms of what reports are stored in the folder and who uses them.


    +   Profiles: Typically, profiles are named using the role that they would be
    assigned to. That makes it easier to get an idea of what the profile does just
    by looking at it. As mentioned earlier, use permission sets as much as possible
    in favor of profiles, unless they are absolutely required.


    Do: Sales Operations, Service Supervisor – Clear and ambiguous names that indicate
    what the profile does.


    Avoid: Custom Profile for Users, New Profile – Ambiguous names that don''t convey
    any idea of what the profile is about. Also, there is no need to mention the term
    profile because we already know what the profile does.


    +   Validation rules: There is a limit to how many characters can be in the validation
    rule name, so you may want to abbreviate some of the terms but ensure not to do
    that at the expense of the name. The guideline for validation rules is to use
    the field name followed by a phrase to sum the purpose of the validation rule,
    followed, in turn, by the condition when the validation rule should be triggered
    in brackets.


    Do: Loss Reason Required (Stage=Lost) – Clearly indicates that the loss reason
    field is required when the stage is set to Lost.


    Avoid: Validation Rule for Opportunity Record, VR for Account Object – Unclear,
    repetitive, and ambiguous names that don''t convey meaningful information.


    +   Roles: The key thing to remember as regards roles is that they don''t need
    to reflect the business'' HR hierarchy; rather, the role hierarchy controls data
    visibility and certain aspects of reporting, for example, the My Team hierarchy.
    Roles must never be named after a user''s name.'
  merge: -1
  img_proc: true
- pgno: 106
  md: '# Do:


    +   - Manager, BDR – Clearly identifies that the role is for a manager in the
    **Business Developer Representatives (BDR)** team.

    +   - Sales Rep, Western Region – Identifies the region that the sales rep is
    assigned to. It is meaningful and indicates that there are possibly other roles
    under this role reporting to it and that would assist in figuring out any data
    visibility issues.


    # Avoid:


    +   - Sales Rep 1 – Generic and doesn''t convey any meaningful information.

    +   - Strategic Operations and Research VP or Business Applications Analyst –
    An HR job title that should be avoided in roles.


    +   **Custom objects:** When naming custom objects, avoid the use of acronyms
    and abbreviations and, for application-specific objects, specify the application
    abbreviation or short name at the beginning.


    Always avoid naming a custom object the same as an existing object because that
    can cause a lot of confusion during configuration and later use by end users as
    well. If you have to use a name that matches an existing standard or custom object,
    suffix the name with an asterisk (*) to indicate that it''s a custom object. The
    system will not let you save a custom object API name if one already exists, but
    it won''t do that for labels, so ensure that the labels are distinct as well.
    Also, make sure to populate a description every time and provide sufficient details
    on what the object''s intent is. Also, keep in mind that the label is for the
    user and the API name is used by admins and developers, so they should be appropriately
    worded.


    # Do:


    +   - Quote* – Indicates that it''s a duplicate version of another object, standard,
    or custom. For example, you may find that the standard quote object doesn''t meet
    the needs of the business and a custom quote object is required.

    +   - DG Meeting Requests – Indicates the abbreviation of the application, in
    other words, data governance and the object name.


    # Avoid:


    +   - Local – Ambiguous and doesn''t give any indication of what the object is
    for.

    +   - Svc Defs – Meant to indicate that the object stores service definitions,
    but the name is ambiguous and unclear.'
  merge: -1
  img_proc: true
- pgno: 107
  md: '+   • Custom fields: These follow some of the same rules for custom objects.
    The API name can be long and descriptive and is preferred over using abbreviations
    and acronyms. Always use clear descriptions that provide sufficient detail of
    what the field is about. To provide guidance to users, fill in a value in the
    help text attribute of the field.


    # Do:


    +   - External ID – A short name, but conveys the information that the field is
    an external ID field.

    +   - Platforms Used – Provides clear information as to what the field is used
    for.


    # Avoid:


    +   - New Field – A label that doesn’t provide any meaningful information.

    +   - FTL – Ambiguous and unclear as to what this means. If you must use abbreviations,
    then enter the expanded form in the help text attribute and the description attribute.


    +   • Workflow rules: The name of the workflow should be defined as the object
    the workflow is on and the triggering event of the workflow. Avoid acronyms as
    much as possible and use whole words. Use the description field to elaborate on
    what the workflow rule is and the actions it performs. Avoid putting actions that
    the workflow performs in the workflow name field as those can change, which would
    require an update to the name rather than the Description field being used.


    # Do:


    +   - Opportunity – Stage Changed – Notice how the name has the object that the
    workflow rule is on and the triggering event. Just by looking at it, you can tell
    that the workflow is triggered when the Stage field changes. If you have multiple
    fields triggering the workflow, it may not be possible to write all the field
    names, in which case use the field that is the most important in the process.

    +   - Sends an onboarding email to the customer when the Stage field value is
    set to “Won” and checks off the "Onboarding Completed" checkbox on the account
    record – This is an example of a description that describes what the workflow
    actually does.


    # Avoid:


    +   - Send email and update record – This is an example of the name of the workflow.
    It’s very generic and doesn’t provide sufficient meaningful information. Also,
    the workflow actions are described in the name.'
  merge: -1
  img_proc: true
- pgno: 108
  md: "- Sends an email and updates the record – This description is again generic\
    \ and doesn't provide any specifics unless the workflow is explored further. It\
