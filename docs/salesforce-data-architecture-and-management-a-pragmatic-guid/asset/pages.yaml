  md: 'Let''s now work on the Lightning flow and set up the same process. Here is
    what our Lightning flow definition looks like:


    ![](img/782d45700e093b3d82b348c0ccc8ccba_268_0.png)


    Figure 6.32 – Lightning Flow that fetches the Account record ID and then updates
    the Type field when the Opportunity record is set to Closed Won


    Now, let''s do an update on an Opportunity record, but before that, make sure
