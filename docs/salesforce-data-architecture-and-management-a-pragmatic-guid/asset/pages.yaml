    the query plan again, we see that even though a full table scan is still required,
    the query is very efficient:


    ![](img/782d45700e093b3d82b348c0ccc8ccba_259_0.png)


    Figure 6.23 – Cardinality shows 4, meaning four records will be returned that
    have Industry as apparel


    Notice how using a filter improved performance. The notes about IsDeleted and
    Industry simply mean that these fields cannot be used for optimization because
    they are not indexed


    Indexes will behave similarly and result in even more performant queries. In this
    example, we are using the Id field as an index:


    ![](img/782d45700e093b3d82b348c0ccc8ccba_259_1.png)


    Figure 6.24 – Using an index in the query results in a very efficient query'
