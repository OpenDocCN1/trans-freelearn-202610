  \ | | |\n| 编辑 | 活动 | Campaign | Lookup(Campaign) | | |\n| 编辑 | 清洁状态 | CleanStatus\
  \ | 选取列表 | | ✓ |\n| 编辑 | 公司 | Company | Text(255) | | ✓ |\n| 编辑 | 公司 D-U-N-S 编号\
  \ | CompanyDunsNumber | Text(9) | | |\n| 编辑 | 创建者 | CreatedBy | Lookup(User) | |\
  \ |\n| 编辑 | D&B 公司 | DandbCompany | Lookup(D&B 公司) | | ✓ |\n| 编辑 | Data.com 密钥 |\
  \ Jigsaw | Text(20) | | |\n| 编辑 | 描述 | Description | 长文本区域(32000) | | |\n| 编辑 |\
  \ 不要来电 | DoNotCall | 复选框 | | |\n| 编辑 | 电子邮件 | Email | 电子邮件 | | ✓ |\n\n图 2.6 – Lead\
  \ 对象上的 Email 字段\n\n\n\n\n\n注意，线索对象上带有电子邮件字段。在以下截图中，联系人对象上也带有电子邮件字段：\n\n### 联系人字段\n\
  \n此页面允许您指定可出现在“联系人”页面上的字段。您最多可创建 500 个联系人自定义字段。\n\n请注意，删除自定义字段将删除使用该自定义字段的任何筛选器。它还可能更改依赖于自定义字段数据的分配规则或升级规则的结果。\n\
