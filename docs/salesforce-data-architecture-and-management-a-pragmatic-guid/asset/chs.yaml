  \ 长文本区域(32000) | | |\n| 编辑 | 拒绝来电 | DoNotCall | 复选框 | | |\n| 编辑 | 电子邮件 | Email |\
  \ 电子邮件 | | ✔ |\n\n![](img/782d45700e093b3d82b348c0ccc8ccba_52_0.png)\n\n前面的截图中的联系人对象带有电子邮件字段。到此，您将注意到电子邮件字段被重复了两次。在以下截图中，电子邮件字段再次出现，这次出现在活动成员对象上：\n\
  \n### 活动成员字段\n\n此页面允许您指定可出现在“活动成员”页面上的字段。您最多可创建 500 个活动成员自定义字段。\n\n请注意，删除自定义字段将删除使用该自定义字段的任何筛选器。它还可能更改依赖于自定义字段数据的分配规则或升级规则的结果。\n\
  \n| 操作 | 字段标签 | 字段名 | 数据类型 | 控制字段 | 已索引 |\n| :--- | :--- | :--- | :--- | :--- |\
