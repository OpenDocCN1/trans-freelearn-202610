- '# 第 1 部分：数据架构与数据管理基础


  本部分结束时，您将了解数据架构师的角色以及在该角色中取得成功所需的技能。您将了解什么是数据建模，如何在 Salesforce 中应用数据建模概念，以及它们与 Salesforce
  中的对象和字段的关系。将讨论与数据管理相关的概念和数据管理的不同方面。还将讨论备份和归档策略以及用于管理数据的一些工具，并附有动手练习。


  本部分包含以下章节：


  - 第 1 章，数据架构师——角色与职责

  - 第 2 章，了解 Salesforce 对象和数据建模

  - 第 3 章，了解数据管理

