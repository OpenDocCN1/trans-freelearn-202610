  # 第 2 部分：Salesforce 数据治理与主数据管理


  This section will discuss master data management, the quest for the golden record,
  and how to align your MDM strategy with CRM. Later on, data governance, its multiple
  facets, and how GDPR compliance can be achieved with Salesforce will be considered.
  The latter parts of this section will discuss performance in Salesforce and how
  to use the query plan tool to understand how your data will perform on the platform.


