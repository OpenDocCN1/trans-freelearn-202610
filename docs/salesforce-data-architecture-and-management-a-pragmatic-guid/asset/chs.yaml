  \ Salesforce 社区性能的工具。它作为 Google Chrome 插件提供，并提供关于页面性能的可操作洞察。我们将在后文详细讨论此工具。\n\n###\
  \ Salesforce Lightning 检查器\n\n这是另一个 Google Chrome 扩展程序，有助于诊断性能瓶颈。它可以用于检查应用程序的不同方面，例如已触发的事件和客户端存储详细信息。**性能**选项卡显示组件执行所需时间以及潜在瓶颈所在的位置的详细信息。\n\
  \n### Salesforce 报表\n\nSalesforce 提供开箱即用的工具和报表，可用于监控 API 调用限制。此前我们已确定，API 限制可能会对依赖通过集成或\
  \ AppExchange 包使用外部系统的业务关键型应用程序造成严重问题。\n\n开箱即用，你可以使用系统概览页面，该页面显示过去 24 小时的 API 调用，如下一张截图所示。你还应该考虑设置\
  \ API 使用通知，当 API 使用量达到一定阈值时，每隔 _x_ 小时发送一封电子邮件。系统会一直发送电子邮件，直到 API 使用量低于指定阈值：\n\n\
  ![](img/782d45700e093b3d82b348c0ccc8ccba_244_0.png)\n\n图 6.10 – 过去 24 小时内进行的 API\
  \ 调用总数；在此示例中为 20\n\n另一种查看使用情况的方法是运行名为“API Usage Last 7 Days”的报表，该报表显示过去 7 天的使用情况，如下一张截图所示。此报表仅在经典视图中可用：\n\
  \n![](img/782d45700e093b3d82b348c0ccc8ccba_245_0.png)\n\n图 6.11 – 报表显示过去 7 天内进行的\
  \ API 调用数量\n\n这些报表可以作为有用的工具，帮助了解你的组织中如何使用 API，以及是否需要采取主动干预措施以防止与 API 限制相关的错误。\n\n\
  ### 查询计划工具\n\n此工具用于访问结构化对象查询语言（SOQL）和 Salesforce 对象搜索语言（SOSL）查询、报表及列表视图的查询计划，以便针对性能进行优化。这是你可用的宝贵资源，可用于主动避免问题，或快速排除\
  \ SOQL 查询作为性能问题的原因。查询计划工具从开发者控制台访问，并有助于优化 SOQL 查询。你可以使用该工具了解不同的查询计划，以及你的索引查询过滤器是否会被查询优化器使用，或者是否会执行全表扫描。\n\
  \n> 查询计划\n> 查询计划本质上是显示可用于从数据库访问数据的一系列步骤的地图。提交查询时，查询优化器会评估其可用于获取数据的不同方法，并返回成本最低的计划。这意味着返回的计划将以最少的时间获取数据。\n\
  \n由于大多数基于自定义代码的应用程序都使用 SOQL，因此这是一个非常实用的工具，可用于测试你的 SOQL 查询的性能。在深入探讨查询计划工具之前，我们先了解一下什么是全表扫描。\n\
  \n### 全表扫描\n\n全表扫描是指按行扫描数据库表并检查每一行，以确定其是否匹配查询的 where 子句。从性能角度来看，这是一项开销较大的操作，并且在\
  \ SOQL 查询中鼓励使用过滤器：\n\n```\nSELECT name FROM Account WHERE name = \"Star Wars Innovations\"\
  ;\n```\n\n过滤器是 SOQL 查询中 where 子句之后的部分。name = \"Star Wars Innovations\" 部分就是过滤器，由于\
  \ Account 对象中的 name 字段已编制索引，因此会使用索引。\n\nSalesforce 使用一组特定的标准来确定是使用全表扫描还是索引，从而实现高性能查询。如图\
  \ 6.12 所示，索引与查询结果中预期的行数共同发挥着关键作用：\n\n![](img/782d45700e093b3d82b348c0ccc8ccba_246_0.png)\n\
  \n图 6.12 – 高级图表，显示 Salesforce 用于确定查询过滤器是否具有选择性，或是否会使用全表扫描的标准\n\n\n\n\n\n查询优化器在查询包含选择性筛选条件时，会将其判定为选择性查询。选择性筛选条件有助于查询引擎确定如何获取结果，而非选择性筛选条件（因此也是非选择性查询）则需要执行全表扫描，这是一项代价高昂的操作。判定依据如下：\n\
  \n- 筛选条件包含标准字段或自定义字段。\n- 某些标准字段会自动编制索引。这些字段如下：\n  - 主键（Id、Name 和 OwnerId）\n  - 关系字段（查找或主从关系字段\
  \ – CreatedById 和 LastModifiedById）\n  - 审计字段（CreatedDate 和 SystemModStamp）\n  -\
  \ 标准对象和自定义对象的记录类型\n- 如果自定义字段设置为唯一（Unique）或外部（External），则会自动对其编制索引。\n- 一旦确定筛选条件已编制索引，就会确定返回的行数。对于标准索引字段，将确定前\
  \ 100 万条记录的 30% 和剩余记录的 15%。如果总计少于 100 万行，则该筛选条件为选择性筛选条件，并由优化器使用。\n- 对于自定义索引字段，将考虑前\
  \ 100 万条记录的 10% 和剩余记录的 5%，如果总计少于 333,333 行，则该筛选条件被视为选择性筛选条件，并由优化器使用。\n- 如果筛选条件中使用了\
  \ AND 运算符，则查询的目标是少于以下内容：\n  - 每个筛选条件的索引选择性阈值的两倍\n  - 字段交集的索引选择性阈值\n- 如果使用了 OR 运算符，则查询的目标是少于以下内容：\n\
  \  - 每个筛选条件的索引选择性阈值\n  - 这些字段总和的索引选择性阈值\n- 如果使用了 LIKE 运算符且没有前导通配符，例如 `LIKE `Star%，`\
  \ 优化器会对前 100,000 行进行选择性采样。\n\nSalesforce 对表中可编制索引的记录数量有上限，标准索引的 100 万条记录和自定义索引的\
  \ 333,333 条记录反映了该上限。如果筛选条件中的所有索引都是标准索引，则使用标准选择性阈值；否则，将使用自定义选择性阈值。\n\n让我们通过一些示例来确定以下\
  \ SOQL 查询是否会使用索引。\n\n### 示例 1\n\n此处在 **SystemModStamp** 字段上有一个筛选子句，该字段已编制索引：\n\n\
  ```\nSELECT name FROM Account WHERE SystemModStamp >\n2019-01-01T00:00:00Z\n```\n\
  \n有关该对象的详细信息如下表所示：\n\n| 对象中的总记录数 | 4,000,000 |\n| 筛选条件包含索引字段 | 是 |\n| 返回的记录数 | 500,000\
  \ |\n| 选择性阈值 | 750,000 |\n| 返回的记录数是否低于阈值 | 是 |\n| 查询是否为选择性查询 | 是 |\n\n图 6.13 – Salesforce\
  \ 用于确定查询是否为选择性查询的标准\n\n在这种情况下，查询是选择性查询，因为运行查询时不会超过选择性阈值。\n\n### 示例 2\n\n在以下示例中，自定义字段用作索引。请注意，对于带有自定义索引字段的查询，选择性阈值要低得多：\n\
  \n```\nSELECT name FROM Account WHERE LastEmailedDate__c >\n2019-01-01T00:00:00Z\n\
  ```\n\n图 6.14 显示了对象的详细信息以及查询的行为：\n\n| 对象中的总记录数 | 4,000,000 |\n| 筛选条件包含索引字段 | 是 |\n\
  | 返回的记录数 | 200,000 |\n| 选择性阈值 | 250,000 |\n| 返回的记录数是否低于阈值 | 是 |\n| 查询是否为选择性查询 |\
  \ 是 |\n\n图 6.14 – 满足选择性阈值的选择性查询\n\n同样，查询被视为选择性查询，因为返回的记录数远低于选择性阈值中的记录数。\n\n### 示例\
  \ 3\n\n在以下示例中，使用 AND 运算符的两个筛选条件会导致查询成为选择性查询：\n\n```\nSELECT name from Account where\
  \ RecordTypeId = 'xxxxxxxxxxxxxxxx'\nAND LastEmailedDate__c > 2019-01-01T00:00:00Z\n\
  ```\n\n图 6.15 显示了在查询中使用两个筛选条件时的行为，这使其成为选择性查询：\n\n| 对象中的总记录数 | 4,000,000 |\n| 筛选条件包含索引字段\
  \ | 是 |\n| 第 1 个筛选条件返回 ('RecordTypeId = 'xxxxxxxxxxxxxxxx'') | 200,000 |\n| 第 2\
  \ 个筛选条件返回 (LastEmailedDate__c > 2019-01-01T00:00:00Z) | 300,000 |\n| 返回的记录数 | 150,000\
  \ |\n| 选择性阈值 | 800,000 |\n| 单个筛选条件和筛选条件交集的返回记录数较低 | 是 |\n| 查询是否为选择性查询 | 是 |\n\n\
  图 6.15 – 多个带有索引字段的筛选条件导致查询成为选择性查询\n\n在此示例中，使用了多个查询筛选条件，两者都带有索引字段，导致返回的记录数低于选择性阈值，从而使查询成为选择性查询。\n\
  \n### 示例 4\n\n在下一个示例中，使用 OR 运算符的两个筛选条件会导致查询成为选择性查询：\n\n```\nSELECT name from Account\
  \ where RecordTypeId = 'xxxxxxxxxxxxxxxx'\nOR LastEmailedDate__c > 2019-01-01T00:00:00Z\n\
  ```\n\n图 6.16 显示了使用与之前示例中相同数量的行但使用 OR 运算符的查询结果：\n\n| 对象中的总记录数 | 4,000,000 |\n|---|---|\n\
  | 筛选条件包含索引字段 | 是 |\n| 第 1 个筛选条件返回 (RecordTypeId = 'xxxxxxxxxxxxxxx') | 200,000 |\n\
  | 第 2 个筛选条件返回 (LastEmailedDate__c > 2019-01-01T00:00:00Z) | 300,000 |\n| 返回的记录数\
  \ | 200,000 |\n| 选择性阈值 | 250,000 |\n| 单个筛选条件和筛选条件交集的返回记录数较低 | 否 |\n| 查询是否为选择性查询\
  \ | 否 |\n\n图 6.16 – 在使用 OR 运算符时用于确定查询是否为选择性查询的标准\n\n我们了解到，尽管单独来看，每个筛选条件返回的记录数较低（分别为\
  \ 200,000 和 300,000），但合并后超过了选择性阈值限制，因此查询不被视为选择性查询。\n\n在下一节中，我们将回顾如何理解查询计划（Query\
  \ Plan）工具的结果，并使用这些结果调整查询以获得更好的性能。\n\n### 解读查询计划工具的结果\n\n既然我们在上一节中运行了一些查询，现在让我们运行一个查询并了解该工具的工作原理。图\
  \ 6.17 显示了在 Account 对象上运行并返回单条记录的查询计划结果。让我们仔细分析各个数字的含义：\n\n![](img/782d45700e093b3d82b348c0ccc8ccba_251_0.png)\n\
  \n图 6.17 – 查询计划工具\n\n从运行查询计划工具时的结果可以看出，此查询是选择性查询。如果 **Cost** 列中的值高于 1，则表示查询不是选择性查询。在此示例中，由于筛选条件被视为选择性筛选条件，因此将使用索引。\n\
  \n让我们逐一了解 _图 6.17_ 中查询计划工具结果所显示列的定义：\n\n- **Cardinality**：主操作返回的预计记录数。\n- **Fields**：优化器使用的索引字段。在本示例中，显示了\
  \ **Id** 字段，因为这是优化器使用的字段。\n- **Leading operation type**：优化器用于优化查询的主要操作类型。一些值包括：\n\
  \  - **Sharing**：Salesforce 将基于运行查询的用户关联的共享规则使用索引。\n  - **Index**：查询将使用查询对象上的索引。\n\
  \  - **TableScan**：将查询表中的所有行。\n  - **Other**：查询将使用 Salesforce 内部的优化。\n- **Cost**：与\
  \ Force.com 查询优化器的选择性阈值相比的查询成本。成本值源自表和值的数据库统计信息。将使用值最低的计划。\n- **sObject cardinality**：查询对象的近似记录数。\n\
  - **sObject type**：查询对象的名称。\n\n计划仅针对受支持的操作显示，包括诸如 `NOT EQUAL TO`、与 null 值（如 `Name\
  \ = ' '`）的比较、前导通配符或对非确定性公式字段的引用等操作。\n\n请牢记，由于 Salesforce 的多租户驱动架构，该平台拥有自己的 SOQL\
  \ 查询优化器，该优化器会考虑多租户统计信息。统计信息每晚收集一次，但优化器还可以执行动态预查询，其结果会缓存一小时。Salesforce 的查询优化器还会在内部跟踪客户索引的候选项，并自动创建其确定可能有助于选择性的单列索引。\n\
  \n请注意，软删除记录可能会对查询性能产生重大影响，因此查询中可能会使用 `IsDeleted = false` 筛选条件。这将排除所有软删除记录。请牢记，删除的记录会计入统计信息，因此请确保您有硬删除记录的流程。\n\
  \n当在 Salesforce 中为字段编制索引时，这不一定意味着它立即可用，而是索引服务器可能需要长达 15 分钟来更新索引表，因为它是异步执行的。这一点很重要，因为假设您有一个大表，并通过与\
  \ Salesforce 支持合作确定自定义索引会有所帮助。索引已在该字段上创建，但性能仍然缓慢。可能是因为索引表尚未更新。\n\n既然我们已回顾一些可用于监控的工具，现在让我们看看可以使用哪些技术来改进应用程序性能。\n\
  \n### 改进性能\n\n我们已查看可用于诊断和监控性能相关问题的各种工具。下一步是根据问题所在的位置修复这些性能瓶颈。用于修复问题的技术或工具也会不同。例如，如果每个对象有多个触发器，页面性能可能会受到影响，要修复此问题，您需要重构代码以每个对象使用单个触发器。我们稍后还将回顾的另一个示例涉及在单个对象上使用多个流程构建器（Process\
  \ Builder）流程——修复此问题需要确定将提供最佳性能的工具。\n\n\n\n\n\n一旦发现问题，让我们来看看可以采取哪些措施来提升性能。这不应被视为详尽无遗的列表，而应作为可帮助您快速改善应用程序性能的指引。例如，可以采取多项措施来提升Visualforce页面性能，但我在以下各节中仅提及其中一部分。\n\
  \n### 浏览器缓存\n\n这是一个来自UI的简单设置，可以通过在客户端（即浏览器）上安全地缓存最常用的数据，从而避免额外的服务器调用，显著提升页面性能。此设置默认处于开启状态，Salesforce不建议将其关闭。例外情况包括：公司安全策略不允许缓存安全数据的场景，以及在沙箱中希望无需清除缓存即可立即查看配置或代码更改效果的情况。\n\
  \n### 使用内容分发网络\n\n**内容分发网络（CDN）**是一组基于服务器的基础设施，可加速网站性能。加载网站时，与网站一起托管的图片和其他内容也会被加载。如果您从与网站托管所在大洲不同的大洲访问网站，与位于与网络托管相同城市或地区的用户相比，您会看到延迟和响应延迟。\n\
  \n使用CDN时，内容会被复制到CDN中的服务器上，然后从访问网站的客户最近的位置进行服务。这有助于缩短客户的响应时间并提供出色的客户体验。在Salesforce中，Lightning\
  \ Component框架和其他应用程序的静态内容由遍布全球的Akamai CDN服务器提供服务。这改善了应用程序加载时间，因为包括图片文件、**CSS（层叠样式表）**、JS和字体文件在内的静态资源以及其他库都被缓存，并从最合适的CDN位置提供给用户。使用CDN不会缓存您组织中的任何元数据或数据。\n\
  \n### 网络问题\n\n运行`traceroute`或`ping`等基本命令后，如果发现需要进一步调查的情况，请立即联系您的网络团队进行更深入的调查。如果您已排查完所有与Salesforce相关的事项，并确定不是Salesforce相关问题导致性能问题，请不要拖延联系您的团队，因为这会延迟事件解决过程。网络团队需要时间，因为他们无法立即给出答案，需要在其端进行故障排除，只有在找到根本原因后才能开始修复过程。\n\
  \n然而，通过运行traceroute或ping命令，您可以为他们提供一个良好的开端。因此，让我们深入了解这些命令及其揭示的信息。\n\n### Ping\n\n\
  这是一种广泛使用的命令，用于检查是否与主机（在本例中为Salesforce服务器）存在连接。该命令向服务器发送四个数据包，如果服务器响应四个数据包，则表示存在连接且没有数据包丢失。如果服务器不响应，则可能表示服务器存在问题。让我们通过一个示例来更好地理解这一点。如果我们ping\
  \ login.salesforce.com，可以在图6.18中看到该位置的服务器已响应且没有数据包丢失：\n\n![](img/782d45700e093b3d82b348c0ccc8ccba_254_0.png)\n\
  \n图6.18 – ping操作的服务器响应\n\n如图6.18所示，login.salesforce.com上的服务器已响应，因此，我们的设备与服务器之间存在连接。\n\
  \n如果接收到的数据包数量与发送的数量不一致，或者数据包丢失量超过应接收的总数据包数的10%，则我们知道已发生数据包丢失且需要进一步调查。**往返时间（RTT）**是数据包传输到目的地再返回发送方所需的累计时间。\n\
  \nSalesforce的建议是使用多个数据包大小和持续时间捕获ping结果。建议运行以下命令：\n\n```\nping -f -n 25 -l 1200 login.salesforce.com\n\
  ping -f -n 25 -l 1300 login.salesforce.com\nping -n 25 -l 1400 login.salesforce.com\n\
  ```\n\n运行同一组命令，但将您的实例作为目标。例如，如果您的组织位于NA111，则按以下方式运行命令：\n\n```\nping -f -n 25 -l\
  \ 1200 na111.salesforce.com\nping -f -n 25 -l 1300 na111.salesforce.com\nping -n\
  \ 25 -l 1400 na111.salesforce.com\n```\n\n-n开关表示要发送的回显请求数量，默认值为4，-l开关表示缓冲区大小，因此当我们指定1200时，表示应发送1200字节的数据。请确保在运行下一命令之前让上一命令完成。请确保将结果保存给您的内部网络团队以及Salesforce支持团队。\n\
  \n如果我们ping一个不存在的位置，将得到如图6.19所示的输出。有时，防火墙出于安全原因会阻止ping请求，导致完全数据包丢失，在这种情况下无法确定服务器是否宕机：\n\
  \n![](img/782d45700e093b3d82b348c0ccc8ccba_255_0.png)\n\n图6.19 – ping不存在的位置或设备会导致100%的数据包丢失\n\
  \n最小值、最大值和平均RTT数值彼此接近，表明测试期间方差不大，如图6.18所示，但最小RTT和最大RTT之间存在较大方差则会表明存在需要进一步调查的延迟问题。\n\
  \n### Traceroute\n\n此命令用于跟踪数据包从源到目标的实时路径。它会记录到达目标所经过的所有网络设备的IP地址以及每跳之间的时间。您可以想象，数据包需要经过的路由器越多，所需时间就越长，因为每个设备都必须处理数据包并将其转发到下一路由器。\n\
  \ntracert命令默认向每跳发送三个数据包，因此您会在结果中看到每跳的RTT。例如，运行`tracert na111.salesforce.com`会给出以下结果：\n\
  \n```\nC:\\Users\\Ahsan>tracert na111.salesforce.com\n\nTracing route to na111-ph2.r.salesforce.com\
  \ [13.110.36.70]\nover a maximum of 30 hops:\n\n  1    17 ms    17 ms    16 ms \
  \ 192.168.1.254\n  2    18 ms    18 ms    24 ms  10.139.190.1\n  3    42 ms    43\
  \ ms    42 ms  154.11.12.203\n  4    73 ms    73 ms    75 ms  six.salesforce.net\
  \ [206.81.80.33]\n  5    74 ms    73 ms    73 ms  eth1-1--spn3-ncg0-phx3.net.sfdc.net\
  \ [13.110.5.200]\n  6    78 ms    70 ms    77 ms  dcl1-ncg0-phx3.na111-ph2.salesforce.com\
  \ [13.110.36.70]\n\nTrace complete.\n```\n\n图6.20 – 在NA111实例上运行tracert命令的结果\n\n\
  如前面的截图所示，目标及其IP地址会显示出来，并且我们可以看到测试最多会使用30跳。如前所述，每行中的三个数字表示到达每跳所需的时间。这些数字是累计的，不表示单个数据包到达目标所需的时间。很多人在运行traceroute到目标时感到困惑的一个原因是，后续跳的时间有时会早于前一跳。例如，在图6.20中，跳5耗时73\
  \ ms，而跳4耗时75 ms。这是因为命令为每跳发送单独的数据包，并非跟踪从跳1到跳6的同一数据包。网络条件在不断变化，因此发送跳4数据包时与发送跳5数据包时相比，完全可能存在网络拥塞。\n\
  \n有时，您可能会在traceroute结果中看到星号——这不一定表示存在问题，但如前所述，某些网络出于安全或网络流量原因不会响应这些数据包（称为ICMP数据包）。\n\
  \n\n\n\n\n### 精瘦表\n\n数据库表连接是昂贵的操作。根据查询的复杂程度，返回结果可能需要花费大量时间和数据库资源。\n\n如果您遇到这种情况，使用精瘦表可以帮助加快性能。\n\
  \n精瘦表是由 Salesforce 创建的特殊表，包含经常访问的字段。\n\n请回顾第 3 章“了解数据管理”中讨论的 Salesforce 架构：所有标准字段都存储在一个表中，而所有自定义字段都存储在另一个表中。例如，如果您在账户对象上有自定义字段，这些字段存储在不同的表中，当您运行包含这些自定义字段的报表时，Salesforce\
  \ 需要在后台执行连接操作并返回结果。\n\n当使用精瘦表时，经常使用的标准字段和自定义字段会存储在该表中，以消除昂贵连接操作的需求，如图 6.21 所示。随着源表中数据的变化，精瘦表会自动保持最新，无需客户进行任何干预。使用精瘦表的另一个优势是，平台会在报表和列表视图等场景中自动使用精瘦表，从而提升用户的整体性能：\n\
  \n![](img/782d45700e093b3d82b348c0ccc8ccba_257_0.png)\n\n图 6.21 – 如图所示，用户的数据直接从精瘦表查询，而不是从标准字段和自定义字段查询，从而避免了昂贵的连接操作。\n\
  \n需要注意的是，精瘦表可用于只读操作，并可在标准对象和自定义对象上创建。可创建的字段类型有一定限制；例如，不支持**汇总汇总**字段或**公式**字段。客户无法自行创建精瘦表，而是需要与\
  \ Salesforce 客户支持开启案例来创建它们。\n\n在将精瘦表作为解决方案时，必须牢记一些限制。主要限制之一是无法跨对象使用，也就是说，每个精瘦表只能包含来自单个对象的数据。例如，不能为\
  \ `Opportunity` 对象创建同时包含 `Opportunity Team Member` 对象数据的精瘦表。\n\n精瘦表最多可包含 100 个字段，每当向对象添加新字段时，都需要联系\
  \ Salesforce 将其添加到精瘦表中。它们还支持加密字段和加密索引。精瘦表会在沙盒创建或刷新时复制到全副本沙盒中，但对于其他类型的沙盒，需要向 Salesforce\
  \ 客户支持提交请求。\n\n### 查询筛选器、索引和负运算符\n\n请尽可能在 SOQL 查询中使用筛选器，因为这有助于优化器在满足特定条件时缩小记录范围。例如，此开发者组织有\
  \ 39 条 `Account` 记录，因此让我们尝试查询所有记录并查看查询成本。如图 6.22 所示，未使用筛选器时的查询成本大于 1，我们知道这效率低下：\n\
  \n![](img/782d45700e093b3d82b348c0ccc8ccba_258_0.png)\n\n图 6.22 – 成本高达 2.78，对于查询来说效率非常低\n\
  \n如果我们在未编制索引的 **行业** 字段上使用筛选器，并再次运行查询计划，我们会看到即使仍然需要全表扫描，查询也非常高效：\n\n![](img/782d45700e093b3d82b348c0ccc8ccba_259_0.png)\n\
  \n图 6.23 – 基数显示 4，表示将返回四条行业为服装的记录\n\n请注意使用筛选器如何提升了性能。关于 IsDeleted 和 行业 的注释仅表示这些字段无法用于优化，因为它们未编制索引。\n\
  \n索引的行为类似，并会产生更高效的查询。在此示例中，我们使用 Id 字段作为索引：\n\n![](img/782d45700e093b3d82b348c0ccc8ccba_259_1.png)\n\
  \n图 6.24 – 在查询中使用索引会产生非常高效的查询\n\n在寻找改进性能的机会时，扫描您的查询以查看它们是否引用了负运算符，例如 NOT EQUAL TO（!=），因为这些可能导致非常低效的查询。以下示例查询所有账户站点不为\
  \ null 的账户记录：\n\n![](img/782d45700e093b3d82b348c0ccc8ccba_260_0.png)\n\n图 6.25 –\
  \ 如图所示，仅使用单个负运算符就会导致查询性能不佳\n\n在旨在提升性能时，请检查您的 SOQL 查询，因为编写不良的查询会对资源造成显著拖累并影响用户性能。\n\
  \n### 回收站中的已删除记录\n\n这看起来非常无害，但已删除的记录可能会对性能产生显著影响。原因是，当您通过 UI 或 API 简单删除记录时，它们会被标记为软删除，这意味着它们会被移动到回收站并保留\
  \ 15 天，直到达到大小限制为止。运行查询时，筛选掉软删除记录会带来相关开销，从而导致性能问题。\n\n请确保没有大量软删除的记录，这可以通过频繁清空回收站来轻松实现，可以通过\
  \ UI 或使用具有硬删除选项的 Bulk API 来完成，该选项会从数据库中永久删除记录。请记住，此选项不会将记录移动到回收站，因此请谨慎使用。\n\n###\
  \ 归档\n\n请确保数据归档是每个处理数据的项目的一个组成部分（有哪些项目不处理数据呢？），而不是在开始遇到问题后才临时考虑。数据库中拥有多年数据的组织可能会导致重大性能问题。想象一下查询一个拥有\
  \ 500,000 条记录的对象，而数据库需要运行全表扫描来获取几千条记录。\n\n有多种方法可以归档数据，范围从使用 Bulk API 构建自定义解决方案，到使用\
  \ Heroku 或部署现成的 AppExchange 解决方案。使用哪种工具将取决于您的业务和法规要求。重要的是要理解并非所有数据都一样，您需要仔细分析和分类数据，并实施解决方案以满足您的要求。例如，小型软件公司可能没有必要保留超过\
  \ 3 年的报价记录，而受监管严格的健康保险提供商可能需要保留患者记录至少 7 年。\n\n### 延迟加载\n\n这是一种用于 Visualforce 页面以提升性能的功能，如果您仍在使用\
  \ Visualforce，可以考虑实现此功能。其理念是页面首先加载基本功能，以便用户可以开始与之交互，其余部分被延迟，直到用户执行某个操作（例如单击按钮）或经过一段短暂时间，然后页面的其余部分才会加载。\n\
  \n提升性能的另一个方面是启用页面上相关列表的单独加载。这是一个 UI 级别设置，允许用户在相关列表仍在加载时与页面交互。这使用户可以在所有组件（包括相关列表）加载完毕之前与页面交互，而相关列表有时数量很大，尤其是在\
  \ **账户** 页面上。这是因为 **账户** 对象是 Salesforce 中的关键对象，大量对象通常与它具有查找或父子关系。\n\n### Visualforce\
  \ 中的标准功能\n\n请尽可能多地使用标准功能，除非您已仔细权衡每种方法的优缺点，并且自定义方法证明更好。例如，您可能希望在 Visualforce 页面中使用\
  \ jQuery 进行分页，但页面加载时，查询数据并在页面上呈现需要时间，而使用标准的服务器端分页选项可能更快，但处理是在服务器端完成的。\n\n前者在数据集较小时可能更合适，但偶尔可能会有大数据集，用户也乐意偶尔等待页面加载。另一方面，服务器端选项更适合较大的数据集以及页面性能非常重要的情况。\n\
  \n\n\n\n\n### 将 Apex 类用于共享\n\nApex 代码默认在系统模式下运行，这意味着它可以访问 _一切_：它可以访问所有对象及其字段，字段级安全性和共享规则不适用。请检查确保您的类使用\
  \ `with sharing` 关键字，因为它会遵守字段级安全性和共享规则。这样做的净结果是返回的结果集更小，这有助于提高性能。\n\n### 设备和浏览器\n\
  \n如本章前面所述，Octane 分数是衡量浏览器性能的良好指标。分数越高，预期的性能越好。由于 Octane 分数也会考虑用户的设备，因此确认设备支持流畅运行\
  \ Salesforce 所需的最低要求非常重要。如果用户的设备运行在最低推荐硬件规格上，请通过增加内存和处理能力来升级设备。\n\n另一件事是确认设备已充电，或者没有以某种方式被限制性能。当设备电量即将耗尽时，设备通常会切换到低电量模式，或者用户可能无意中更改了设置，导致设备以低电量模式运行。\n\
  \n如果您在初步调查中确定问题仅特定于某个用户，请检查其浏览器。目前，Chrome 是运行 Salesforce Lightning 的最佳浏览器。我强烈建议不要将\
  \ Internet Explorer 与 Salesforce LEX 一起使用，因为您的用户会遇到许多问题。如果浏览器是 Chrome，请检查其版本以及该版本是否受\
  \ Salesforce 支持。\n\n禁用浏览器中的任何扩展程序或插件也能显著提升性能，因为它们会主动消耗内存和处理资源。如果无效，重启浏览器也有助于解决与性能相关的问题，因为之前进程占用的资源会被释放。\n\
  \n### Visualforce 页面\n\n您应制定标准，规定大部分开发将在哪里进行，无论是 Visualforce 还是 Lightning。但考虑到 Visualforce\
  \ 是较旧的 UI，且大量自定义开发已在 Visualforce 中完成，我建议重新查看之前的发行说明，并确定 Visualforce 页面提供的自定义功能是否现在可以通过开箱即用的功能或使用声明式工具来实现。\n\
  \n当您需要立即解决 Visualforce 页面的性能相关问题时，我建议查看 **视图状态**。**视图状态**是一个加密字符串，用于存储包含字段值、控制器状态和组件状态的值集合，存储在隐藏表单元素中。非常大的视图状态需要大量处理时间，因为该字符串必须根据请求类型进行序列化/反序列化和加密/解密。\n\
  \n如果您发现问题在于 **视图状态** 的大小，可以通过将变量声明为 `transient` 来减少包含在 **视图状态** 中的变量数量。这样做不会将这些变量包含在\
  \ **视图状态** 中，但请确保这些变量不是维护页面状态所需的变量。如果 **视图状态** 之所以大是因为控制器和控制器扩展包含大量字段，请考虑过滤掉可能不需要的任何多余字段。\n\
  \n### 调试模式\n\nSalesforce 默认使用生产模式，该模式会优化并缩小 JS 代码以减小其大小。这意味着浏览器中的 JS 代码被混淆，并且这仅适用于框架代码——自定义代码从未被缩小和混淆。此调试标志在生产环境中应始终关闭，否则，它会显著降低已开启该标志的用户的性能。\n\
  \n### 页面重新设计\n\n页面上有许多字段也会影响性能，因此您要确保页面上仅提供实际使用的字段。例如，使用 **字段巡查** 等工具来识别不常使用的字段，并将其从页面中删除，最终从您的组织中删除。\n\
  \n在主页面上保留数量最少的最重要字段，将使用频率较低的字段放在另一个选项卡上。对组件也做同样的操作，如果它们不是最重要的，请将其放在第二个甚至第三个选项卡上。原因是主页面上的组件在初始页面加载时呈现，而其他组件则按需加载。\n\
  \n如果您发现主页面上有许多相关列表，请将其移至其他选项卡。Salesforce 建议一个选项卡上少于三个相关列表。对于主页面，将最重要的相关列表放在上面。\n\
  \n### 解决方案工具选择\n\n并非每种工具都一样，这意味着您必须意识到用于交付解决方案的工具。工作流规则与 Lightning 流程的性能可能不同，并且可能是决定使用哪种工具的一个因素。这是一种设计时考虑因素，但随着数据量增加或更多自动化到位，它可能会在以后破坏您的业务流程。\n\
  \n我想深入解释这一点，因为通常，我们不太关注工具选择将如何影响性能，而且在大多数情况下，我们的决策仅限于解决方案选择是声明式的还是基于代码的。为了说明我的观点，让我们使用一个简单的自动化示例，该自动化用于在商机赢得时更新\
  \ **账户** 记录。我们将把 **类型** 字段从 **潜在客户** 更新为 **客户 – 直销**。作为本示例的工具选择，我们将定义 **工作流规则**\
  \ 和 **Lightning 流程**，并使用 **开发者控制台** 来衡量性能。\n\n在设置工作流规则之前，请先确保我们的调试日志级别设置得当。按照以下步骤打开调试日志：\n\
  \n- 1. 导航至 **设置 | 环境 | 日志 | 调试日志**。\n- 2. 按照 **图 6.26** 所示设置调试级别详细信息。设置调试级别后，请务必通过更新开始和结束时间并确保为正确用户启用调试来打开调试：\n\
  \n![](img/782d45700e093b3d82b348c0ccc8ccba_264_0.png)\n\n图 6.26 – 请注意每个调试元素的详细级别；默认情况下，其他类别也已启用，但我们希望专注于性能结果，因此我们启用了数据库、工作流和\
  \ Apex 性能分析\n\n下面是工作流规则的设置方式。工作流规则关联一个操作，用于将关联的账户记录上的类型字段更新为客户 – 直销。图 6.27 显示工作流规则的设置：\n\
  \n![](img/782d45700e093b3d82b348c0ccc8ccba_265_0.png)\n\n图 6.27 – 工作流规则设置\n\n在以下屏幕截图中，我们展示了字段更新操作的设置方式：\n\
  \n![](img/782d45700e093b3d82b348c0ccc8ccba_265_1.png)\n\n图 6.28 – 我们的字段更新操作的设置\n\
  \n调试日志已开启，工作流规则也已设置好，请继续将商机更新为已关闭已赢。检查账户记录以确认类型字段已正确更新。确认后，转到开发者控制台。在开发者控制台中，单击日志\
  \ 选项卡，如下屏幕截图所示：\n\n![](img/782d45700e093b3d82b348c0ccc8ccba_266_0.png)\n\n图 6.29\
  \ – 事务已被记录\n\n双击日志记录，将打开执行日志页面（此处未显示）。日志打开后，转到调试 菜单，单击切换透视图，然后单击分析（预定义）选项，如下屏幕截图所示：\n\
  \n![](img/782d45700e093b3d82b348c0ccc8ccba_266_1.png)\n\n图 6.30 – 切换透视图和分析（预定义）菜单选项\n\
  \n在分析（预定义）透视图中，单击性能树 选项卡：\n\n![](img/782d45700e093b3d82b348c0ccc8ccba_267_0.png)\n\
  \n图 6.31 – 我们事务的结果\n\n您可以看到，总处理时间为 104 毫秒 (ms)，而工作流规则 工具执行耗时 17.71 ms。该过程未执行任何 DML，因此页面后半部分的限制\
  \ 选项卡没有任何信息。\n\n\n\n\n让我们现在来处理 Lightning 流并设置相同的流程。以下是我们 Lightning 流定义的样子：\n\n![](img/782d45700e093b3d82b348c0ccc8ccba_268_0.png)\n\
  \n图 6.32 – Lightning Flow，在 Opportunity 记录设置为 Closed Won 时获取 Account 记录 ID 并更新 Type\
  \ 字段\n\n现在，让我们对一个 Opportunity 记录进行更新，但在此之前，请确保我们之前创建的工作流规则已被停用，并且调试日志已开启。遵循与处理工作流规则时相同的流程，我们看到以下结果：\n\
  \n![](img/782d45700e093b3d82b348c0ccc8ccba_268_1.png)\n\n图 6.33 – 显示 Lightning Flow\
  \ 更新关联 Account 记录上的 Type 字段所需时间的结果\n\n结果令人惊叹：工作流规则完成耗时 17.71 ms，而 Lightning Flow\
  \ 花费了 411.84 ms 才给出相同的结果。Lightning Flow 更新 Account 对象上的一个简单字段大约花了 23 倍的时间。\n\n想象一下，如果你有一个涉及多个\
  \ DML 语句、SOQL 查询和其他操作的复杂业务流程，这个数字会如何变化。我的意思是，并非所有工具都具有同等性能。如果你的用户在抱怨性能问题，这是在排查问题时不可忽视且必须考虑的一个方面。\n\
  \n我们将工作流规则与 Lightning Flow 进行了比较，但同样的原则也适用于其他工具。你是应该使用触发器、Process Builder，还是也许使用异步\
  \ Queueable 进程来交付你的解决方案？在设计阶段，你都会问自己这样的问题；同样，在排查问题时，如果发现 Lightning Flow 耗时过长且让其继续运行已不再是选择，也需要自问这样的问题。你可能不得不立即采用其他选项，以确保业务运营以最小中断继续运行。\n\
  \n### LEX 中的性能\n\nSalesforce 的第一个界面是 Salesforce Classic 界面，该界面更侧重于数据输入和检索。在过去几年中，随着\
  \ Web 技术的成熟，Salesforce 决定开发并发布一个基于 Web 标准的新界面，旨在为开发者提供一个构建响应式且高性能丰富应用程序的平台。\n\n\
  LEX 的一个显著特点是大部分工作在客户端完成，即你的浏览器中。页面按组件逐步加载，以减少加载时间。这与 Salesforce Classic 不同，后者中页面由服务器生成并在浏览器中呈现。由于\
  \ LEX 基于促进可重用性的基于组件的设计的现代 Web 标准，Salesforce 中的 Lightning 组件可以调用子组件。\n\n由于 LEX 在客户端进行更多处理，它对用户环境敏感，应用程序性能可能受到几个因素的影响。用户使用的硬件和浏览器会影响用户体验。\n\
  \n另一个因素是用户所在的网络质量，因为数据需要在用户浏览器和 Salesforce 服务器之间传输。网络延迟增加会导致性能变慢。我们在前面的章节中讨论过其中的一些原因，但到现在应该意识到，与\
  \ Salesforce Classic 相比，LEX 中的性能相关问题更多依赖于用户的计算机。\n\n### LEX 的技术要求\n\nLEX 正在越来越多的组织中成为标准，而仍在使用\
  \ Salesforce Classic 界面的组织最终也需要从该界面迁移到 LEX。我简要地提一下 Salesforce 为获得可接受的用户体验所推荐的最低要求和建议要求。请记住，这些值仅应作为指导，你应该与不同地区的用户进行测试，以确保他们在使用\
  \ Salesforce 平台上的业务应用程序时能以可接受的性能水平履行职责。\n\n对于最低要求，Salesforce 推荐以下基准：\n\n- 网络延迟为\
  \ 200 ms 或更低\n- Octane 得分为 20,000 或更高\n- 下载速度为 1 Mbps 或更高\n- 5 GB RAM，其中 2 GB 可用于浏览器标签页\n\
  \nSalesforce 的推荐配置如下：\n\n- 网络延迟为 150 ms 或更低\n- Octane 得分为 30,000 或更高\n- 下载速度为 3\
  \ Mbps 或更高\n- 8 GB RAM，其中 3 GB 可用于浏览器标签页\n\n这些基准适用于台式机和笔记本电脑。平板电脑和手机所需的最低基准数字不同，应参考\
  \ Salesforce 的文档。\n\n在下一节中，我们将详细介绍体验页面时间 (EPT)。\n\n### 了解 EPT\n\nLightning Experience\
  \ 中的页面加载时间由 EPT 衡量。这是页面加载并处于用户可以与页面进行有意义交互的可用状态所需的时间。这听起来很简单，但 EPT 实际上包含一些细微差别。\n\
  \n我们之前讨论过，Salesforce Classic 和 LEX 的关键区别在于，前者的页面由服务器生成，而后者的页面由逐步呈现的组件组成。渐进式加载意味着组件可能会稍后加载其他子组件，因此确切知道页面何时对用户可用并不简单。\n\
  \n其他可能影响此指标的因素包括错误处理、缓存以及页面的实现细节，如果处理不当，可能会对 EPT 产生负面影响。\n\n为了考虑这些因素，Salesforce\
  \ 将 EPT 计算为从页面开始直到 2 个帧（大约 33 ms）内没有更多活动的时间。考虑这两个帧允许任何异步调用，例如 **XML HTTP Request\
  \ (XHR)** 活动、存储活动或其他客户端工作完成。\n\n在下一节中，我们将了解 Experience Cloud 以及可以采取哪些措施来确保托管在 Salesforce\
  \ 上的面向外部的网站获得最佳性能。\n\n### Salesforce Experience Cloud\n\nExperience Cloud 是 Community\
  \ Cloud 的新重新品牌名称，指的是你的客户或合作伙伴可能使用的面向外部的网站。确保其性能良好，从收入和声誉的角度来看都至关重要。据说，客户通常在离开网站页面前在上面花费的时间不超过\
  \ 15 秒。这意味着你有 15 秒以上的时间来吸引他们的注意力，并让他们在你的网站上花费更多有意义的时间，最好是促成一次购买（假设是电子商务网站）。\n\n\
  想象一下，如果一个潜在客户访问了你的网站，而产品页面加载时间太长或崩溃了，该潜在客户很可能会离开而不是等待页面加载，并转而去你的竞争对手那里。在 *在 Salesforce\
  \ 中进行性能测试* 部分，我们将了解 Costco 的例子，据估计，仅几小时的停机时间就给该公司造成了约 1100 万美元的收入损失。\n\nSalesforce\
  \ 提供了 **Page Optimizer 工具**，可以分析你的网站并识别可能影响性能的潜在问题。Page Optimizer 是一个可下载的 Google\
  \ Chrome 浏览器扩展程序。该工具显示页面的网络性能，根据 Lightning 框架中使用的 Web 标准评估页面，并提出有助于改善页面性能的操作建议。\n\
  \n你的 Experience Cloud 网站上的自定义数量，以及每月页面浏览量、每月登录次数和流量模式，都是 Experience Cloud 网站上性能问题的一些常见原因。\n\
  \n建议是，在上线前确保你已对网站进行了规模和性能测试，因为网站上的非常大的负载可能会导致性能问题。大量使用 Apex、SOQL 和 SOSL 也会导致网站变慢，因此请尽可能坚持使用标准功能。\n\
  \n\n\n\n我们之前讨论过使用 CDN，可以通过将静态资源和其他频繁访问的内容卸载到这些网络上来提高站点的性能和可扩展性。Salesforce 提供的另一个功能是使用等候室，它允许用户排队进入等候区，然后以受控方式缓慢引入主网站。这使得经历流量激增的站点能够妥善管理负载，而不会因负载过大而面临卡顿或崩溃的风险。\n\
  \n在本节中，我们广泛介绍了性能问题产生的原因，并探讨了可用于监控 Salesforce 性能的众多工具。利用这些工具，我们可以有条不紊地排除这些问题可能发生的原因，并找到根本原因。\n\
  \n在下一节中，我们将讨论对 Salesforce 实现进行性能测试。\n\n### 在 Salesforce 中进行性能测试\n\nSalesforce 平台每天处理数十亿笔交易，并设计为高度可扩展。鉴于\
  \ Salesforce 以平台即服务的方式提供其平台，他们进行广泛的测试和监控，以确保其平台能够承受基础设施上可能施加的负载。\n\n性能测试包含两个组件：\n\
  \n- 压力测试：压力测试用于在超出最大预期负载的负载下，在极端条件下测量系统性能。压力测试的目标是确定系统在不崩溃的情况下能够承受的最大限度。\n- 负载测试：另一方面，负载测试是在预期负载下测量系统性能。这里的目标是确保能够提供可接受的服务水平，或者如果存在正式的\
  \ SLA，则能够满足它们。\n\n在重负载下表现不佳的应用程序可能会导致系统崩溃，并可能使组织损失数百万美元的收入。2019 年，Costco Wholesale\
  \ 网站在感恩节当天崩溃了不到一天。商业内幕报道称，此次崩溃使公司损失了约 1100 万美元的销售额。这只是一个例子，但在财务和声誉损失方面，成本可能都非常巨大。\n\
  \n与传统的本地部署系统不同，在传统系统中性能测试是软件工程过程的重要组成部分；由于 Salesforce 主动监控其云服务，我们不必担心系统是否会扩展。Salesforce\
  \ 平台已经证明其可扩展性毋庸置疑；2013 年，平台每天执行惊人的 13 亿笔交易。如今，这个数字要高得多；公平地说，Salesforce 平台会运行良好，但您使用开发资源在内部构建的自定义解决方案会运行良好吗？（请注意，如果您使用的是开箱即用功能且仅对系统进行了轻微定制，那么投入时间和资源进行性能测试将不会带来巨大收益。）\n\
  \n性能测试重要的地方在于，当您拥有运行相对复杂业务逻辑的自定义应用程序，且用户数量庞大甚至有限时。在这些场景下，您可以决定进行性能测试，以确保应用程序不会崩溃，从而获得安心。您可以决定仅专注于对应用程序进行压力测试以了解其极限。\n\
  \n您可能还希望考虑对应用程序进行性能测试的另一个原因是测试集成。在许多情况下，Salesforce 与多个系统集成，尤其是 **企业资源计划 (ERP)**\
  \ 系统，并且，具体取决于集成方式，大量数据可以推送到 Salesforce。例如，在快速销售类环境中，库存系统可能需要每小时将大量库存数据推送到 Salesforce。您会希望确保当该集成正在运行且数百名用户正在积极使用\
  \ Salesforce 时，Salesforce 仍能运行良好。大量数据导入或导出也可能给系统带来压力并影响性能。这是另一个您需要进行性能测试并确保系统能够处理大量数据负载的领域。\n\
  \n我们必须意识到，Salesforce 是一个多租户环境，包括软件和硬件在内的资源在数百个客户之间共享。一般来说，性能测试资源密集且涉及大量数据。因此，应采取适当措施，确保您的测试不会独占资源。Salesforce\
  \ 拥有强大的监控机制，以确保公平使用资源，如果观察到异常活动，可以限制您的使用。\n\nSalesforce 的站点可靠性 (SR) 团队可能会限制系统的原因有几个。通常，当超过某个阈值时，这些限制会自动应用。触发限制的最常见原因包括低效的\
  \ SOQL 查询、大量入站同步请求，甚至是异步作业。性能测试是组织可能会被限制的另一个原因。Salesforce 已建立协调性能测试的流程，其中包括事先获得\
  \ Salesforce 团队的批准。请参阅性能测试常见问题帮助文章，详细了解客户和 Salesforce 在性能测试中的角色和职责。您绝不应该在任何情况下在生产环境中进行性能测试，而应始终使用沙箱，最好是完全沙箱，进行性能测试。\n\
  \n在下一节中，我们将探讨如何对 Salesforce 应用程序进行性能测试。\n\n#### 对 Salesforce 中性能测试的方法\n\n### 规划\n\
  \n首先要做的是规划性能测试。要非常明确您想要测试和衡量的具体内容。是测试页面加载时间吗？是否还包括 API 测试？通过将测试范围缩小到业务应用程序最关键的部分，您将获得最大价值。这些可以是应用程序中运行复杂业务逻辑的页面，并且在单元测试或功能测试期间与其他页面相比运行速度相对较慢的页面。\n\
  \n### 测试模型\n\n在规划步骤中确定需求后，下一步是定义测试模型。测试模型定义了需要定义和加载的众多变量，以模拟现实。让我们讨论其中一些，以便更加清晰。\n\
  \n某些事务比其他事务发生得更频繁；例如，创建订单的频率低于搜索联系人，因此您的测试分布需要包含大量搜索测试场景。思考时间是另一个因素，定义为用户收到最后一包数据到在网站上采取下一操作（例如，在页面上单击“下一步”）之间的时间。如果您的脚本一个接一个地运行测试步骤，那将不现实，因为人类用户通常会休息一下、处理信息，然后再进行下一步。因此，运行不考虑思考时间的自动化测试并不现实，因为您从性能测试中得出的结论将不准确。\n\
  \n使用模式是另一个必须考虑的因素，需要考虑系统预计使用最多的时间。例如，感恩节促销的访问者数量将远大于任何其他天的访问者数量。\n\n您还应考虑这样一个事实，即\
  \ Salesforce 不是一个普通网站，内容被分发，用户以不同方式与之交互。相反，正如我们之前提到的，当 LEX 页面加载时，会发生多种情况，仅使用常规工具测量页面加载时间会导致不准确的结论。这就是为什么\
  \ Salesforce 建议使用 EPT 作为衡量 LEX 以及体验云 (Experience Cloud) 性能的指标。原因是 EPT 考虑了 LEX 独特的底层架构，其中单个组件可以与服务器通信。通过使用\
  \ EPT，我们可以确保获得准确的页面加载时间。\n\n您也可以使用 Salesforce 衡量服务器端的情况，但正如在“在 Salesforce 中进行性能测试”一节中提到的，这不那么重要，因为平台在性能和可扩展性方面被主动管理。如果您仍需要测试性能，Shield\
  \ 事件监控提供可用于评估性能的详细指标。如果您不使用它，也可以使用开发者控制台获取其中一些详细信息，但它们不如 Shield 事件监控提供的指标详细。\n\n\
  在 Salesforce 中，您将有兴趣衡量吞吐量和响应时间。吞吐量定义为系统在给定时间内可以处理的工作单元数量。吞吐量的示例包括每分钟创建的记录数量和每小时的搜索次数。响应时间定义为系统处理请求所需的时间。示例包括从文档生成工具生成文档所需的毫秒数，以及加载页面所需的毫秒数。\n\
  \n\n\n\n\n### 测试计划\n\n定义测试策略和计划，并包含测试中将使用的测试用例和工具。测试计划还需要包含测试所需环境的相关详细信息以及记录所有测试缺陷的位置。你还需要确保拥有足够的资源来覆盖测试的所有方面，并且这应包含在测试计划中。\n\
  \n确保已考虑测试执行的时间表、将要测试的场景、成功标准以及将参与测试的资源的职责。我发现一个有用的技巧是包含一张单页系统级图表，显示将参与测试的不同系统。这些图表将展示不同的负载生成服务器、你的\
  \ Salesforce 组织以及测试中可能使用的其他系统，例如用于可视化测试结果的可视化系统。该图表有助于与内部利益相关者和 Salesforce 进行沟通。\n\
  \n不要对需要测试的内容过度追求，而应花时间思考在哪里能获得最大价值。如果你有 10,000 名用户，且即将上线的关键任务应用程序仅将由 500 名并发用户使用，并在\
  \ 5 年内增长到最多 1,000 名并发用户，那么通过模拟 10,000 名并发用户对应用程序进行负载测试的价值很小。如果出于任何原因，你无法通过 500 个虚拟用户来模拟测试，可以请几名用户进行测试，然后推算结果。\n\
  \nSalesforce 建议在全沙箱中进行性能测试，该沙箱在数据方面与生产环境相同，但数据是时间点数据，意味着由于它在给定时间点克隆，因此该时间点后生产环境中的任何更改都不会反映在沙箱中。另一个需要记住的事是，尽管全复制沙箱与生产环境相似，但其托管基础设施并不完全相同。\n\
  \n一旦你最终确定了工具和测试范围内的测试用例，则需要开发在测试期间将运行的测试脚本。你的测试用例必须考虑到实际用户使用系统的现实情况，以便结果尽可能接近现实。之前的测试模型讨论将帮助你确定测试脚本需要考虑的因素。\n\
  \n### 测试执行\n\n在此步骤中，你将执行测试脚本并记录结果。请确保与 Salesforce 协调你的测试。他们希望事先了解详细信息，包括 Salesforce\
  \ 在出现问题时可以联系的关键联系人是谁、你预期的 **每秒交易数 (TPS)**、关于测试和将使用的工具的任何详细信息等等。Salesforce 团队无法验证你的测试策略，也无法为测试执行期间可能发生的任何问题提供调试服务。\n\
  \n### TPS\n\n**TPS** 是每秒执行的交易数量。例如，如果 10,000 名用户在 1 小时内运行一个包含 2 个交易的单个 (1) 业务流程，那么\
  \ TPS 将如下：\n\n10,000 x 1 x 2 = 20,000 每小时\n\nTPS 是 20,000/(60*60) = ~ 5.5 个交易，向上取整为\
  \ 6\n\nSalesforce 建议将其设置为测试目的的两倍，即每秒 12 个交易。\n\n### 分发结果和修复问题\n\n一旦你运行完测试脚本，就该分发结果了。汇总结果以便于理解并防止对结果的任何误解。如果我不是向现场观众展示结果，我喜欢为每个表格和图表提供说明性注释，以便读者能更好地理解上下文来审查结果。\n\
  \n随着你将拥有的大量测试数据，将会存在需要改进的领域。我们在前一部分中回顾了改进性能的技术。这里，我建议使用帕累托原则，专注于解决那些能带来最大收益的性能瓶颈。例如，如果机会页面加载太慢且需要很长时间，那么应将其优先于一个速度极慢但仅由少数内部用户用于跟踪公司车队的\
  \ Visualforce 页面。由于前者由销售团队使用且直接关系到收入，解决该性能瓶颈应当优先。\n\n在下一部分中，我们将讨论成功进行性能测试的一些关键属性。\n\
  \n### 成功进行性能测试\n\n在本节中，我希望回顾一些你可以采取的措施，以确保性能测试成功。这些措施没有特定顺序，旨在作为指导原则，遵循这些原则，你将能够确保\
  \ Salesforce 实施的全面且成功的性能测试：\n\n- **与 Salesforce 协调**：你的测试将产生大量数据，测试峰值将被 Salesforce\
  \ 的监控团队注意到，因此尽早创建案例并开始与他们共享测试计划并不为时过早。这不仅会增加你获得理想测试日期的机会（是的，你向 Salesforce 提出时间表，但他们有权决定同意或不同意这些日期），而且你与\
  \ Salesforce 的通信还可以帮助你识别任何差距并在开始测试之前解决这些问题。\n\n- **governor 限制**：我们知道 governor 限制的存在是为了确保没有单个客户会独占资源，从而剥夺同一实例中其他客户对\
  \ Salesforce 订阅的合理性能预期。性能测试可能会触发 governor 限制，在生产环境中发现这一点之前了解这一点是好事，但这也会使测试变得复杂。你需要做的是检查你的代码，并确保在进行性能测试之前，处理掉测试期间可能触发\
  \ governor 限制的任何潜在区域。\n\n- **LEX**：如果你在测试 LEX，请确保你拥有适当的工具来测试 LEX 界面。这是因为与 Visualforce\
  \ 界面不同，LEX 无法进行无头测试。它将需要一个能够测试 **GUI (图形用户界面)** 的工具。\n\n> **无头测试**\n>\n> 这是一种在没有\
  \ *头* 的情况下进行浏览器 UI 测试的方法，意味着没有浏览器界面，测试在后台运行。这可以节省原本需要的资源；例如，在真实浏览器窗口中，运行操作需要内存，你打开的标签页或窗口越多，所需内存就越多。这会使性能测试结果向高端偏差。\n\
  >\n> 在 LEX 中，使用传统负载测试工具进行无头测试是不可能的，因为大部分工作是由浏览器完成的，并且组件可能具有与服务器通信的子组件。像 Flood Element\
  \ 这样的新工具，配合 Puppeteer，现在可以实现 LEX 的无头测试。\n\n- **有经验的资源**：软件行业进行大量测试，一种测试类型的专业知识不一定能转化为其他测试类型的专业知识。例如，一名在大型现成\
  \ ERP (企业资源计划) 系统方面拥有丰富经验的测试负责人可能不一定知道如何设置和进行性能测试。确保你为工作拥有合适的专业知识，因为这对测试的成功起着重要作用。\n\
  \n- **负载生成**：如果你在测试 LEX 界面，那么如前所述，你需要一个能够执行此操作的工具。但对于性能测试，你还需要设置负载生成服务器，这些服务器将生成工具可以用于测试的数据。确保你的负载生成设置与工具兼容，并能产生足够的负载以充分进行性能测试。\n\
  \n- **使用不同的浏览器进行测试**：在测试 LEX 界面时，请确保已考虑用户在现实生活中可能使用的不同浏览器。在我之前提到的示例中，一个组织可能将 Internet\
  \ Explorer 作为其企业支持的浏览器，但用户可能正在使用不同的浏览器，因此如果你仅使用 Internet Explorer 进行测试，你的测试可能会运行并返回结果，但不会具有现实性。\n\
  \n- **多租户挑战**：由于 Salesforce 运行的环境由许多客户共享，且 Salesforce 不提供环境基准数量的统计数据，因此你的性能测试结果可能会因测试时间、实例负载等因素而有很大差异。为了克服这一障碍，你可以在不同时间运行测试，最初使用单个用户。然后可以对该数据取平均值，作为全面性能测试的基准。这应该能让你很好地了解生产环境中的性能情况。\n\
  \n当环境中引入更改或错误修复时，请确保进行新的测量，以确保你正在将性能测试结果与新值进行比较。\n\n我们已经了解了可以在 Salesforce 中对应用程序进行性能测试的方法，以及可以采取哪些步骤来确保我们进行的性能测试成功并符合业务目标。设置资源以进行性能测试可能是一项耗时且昂贵的工作，但通过遵循这些指南，你可以降低失败风险并提高成功的机会。\n\
  \n在下一部分中，我们将介绍监控、可用工具以及需要监控的内容，以确保你的组织平稳运行。\n\n\n\n\n\n### 监控性能\n\n本节将讨论可用于主动监控我们\
  \ Salesforce 组织的工具。请回顾我们在*第 3 章，了解数据管理*中的讨论：预防问题发生的成本为 1 美元，而问题发生后进行补救的成本为 10 美元。如果补救没有及时进行并发生故障，修复成本可能高达\
  \ 100 美元。下一节将讨论监控什么内容，在随后的章节中，我们将介绍一些可用于监控 Salesforce 组织的工具。\n\n### 监控什么内容？\n\n\
  有数十个可衡量的基准，但有没有几个可以衡量并为我们带来最大价值的指标呢？简短的回答是肯定的；您可以跟踪并监控以下指标的性能。对于其中一些指标，您需要咨询您的网络团队，以获取他们建议的最佳工具。请准备好解释\
  \ Salesforce 的工作原理、其多租户架构，以及组织无法直接访问底层数据库和应用服务器这一事实：\n\n- **页面加载时间**：这是一个显而易见的指标，因为通常用户会在发现页面加载变慢时开始抱怨。LEX\
  \ 页面由多个组件组成，在查看结果时，您希望看到组件加载顺序及其加载时间。这从诊断角度非常重要，因为这样您可以评估哪个组件导致了问题。问题可能由多种因素引起，例如网络延迟、第三方主机问题或\
  \ CDN 问题。\n\n  您可以为 Salesforce 页面运行自动化测试来记录页面加载时间（LEX 中的 EPT）。现在有一些工具可以记录这些时间，在低于某个阈值时发送警报，并运行定时报表以进行趋势分析。这些测试可以提供每个组件的执行时间、组件加载顺序以及组件的其他详细信息。\n\
  \n- **网络**：这些测试提供关于网络层性能的详细信息。这些详细信息包括延迟、丢包率、跳数以及其他数据，例如数据包从源（客户端网页）到目的地（即 Salesforce\
  \ 服务器）过程中网络设备之间的通信。\n\n本测试的另一个方面是收集**超文本传输协议 (HTTP)** 性能数据，其中包括**域名系统 (DNS)** 解析时间、协商**安全套接字层\
  \ (SSL)** 连接的时间以及服务器响应代码。对于关键任务应用程序，监控这些指标并在问题开始出现时收到警报非常重要。例如，一家使用 Salesforce 作为船员排班系统的渡轮公司需要确保出于法律合规目的，船上配备了具备适当技能的船员。排班完成后，船只将从中出发的码头需要打印该排班表，并确保船员已登船并准备好出航。如果由于网络问题（例如延迟和丢包）导致与\
  \ Salesforce 连接出现问题，可能会导致严重后果，包括推迟出航时间，并在服务被视为必要服务的情况下可能面临处罚。\n\n- **用户体验**：您还可以从用户角度主动收集性能数据，即收集诸如无线信号性能等统计信息。这也可以包括某个地理区域的用户，他们可能遇到了问题，或者是高速网络服务不足的偏远地区。然后可以针对需要关注的任何特定位置查看这些数据，或者将其与网络团队共享，以便他们在用户提交与性能问题相关的工单之前采取纠正措施。\n\
  \n关于性能方面可以监控的重要数据点，我们已经了解了。利用这些知识和本章讨论的工具，可以制定有效的策略来诊断和修复与性能相关的问题。\n\n### 总结\n\n\
  本章开篇讨论了我们为什么应该关注性能的重要性。我希望这能让您思考，为什么在 Salesforce 中开发解决方案之前不经过深思熟虑的设计和架构考量是个坏主意。Salesforce\
  \ 平台功能强大，允许客户构建缩短软件开发生命周期时间的应用程序，但当解决方案被草率地拼凑在一起时，这种优势就会变成弱点。\n\n我们关于性能问题发生原因的讨论，希望能成为一份检查清单，供您使用，以确保您构建的应用程序或集成不会出现这些问题。性能问题的一个挑战在于它们会随着时间的推移而显现，但了解其原因将能让您从一开始就避免大多数问题。\n\
  \n我们广泛讨论了可用于提高性能的各种工具，以及可用于确保应用程序性能可接受的一些原则。了解这些工具，并在沙盒或开发者组织中尝试使用它们，以了解其优缺点，这样在需要时，您就知道为工作选择正确的工具了。\n\
  \n性能测试在 Salesforce 圈子中通常不被讨论，但它可以成为非常有价值的工具，用于衡量您是否会在生产环境中遇到性能问题。尽管其关注范围有限，但对于应用程序推广到成千上万用户或更多用户的大型组织，以及组织非常复杂且对其在负载下的表现存在疑问的情况，性能测试很有用。它们尤其应该用于面向外部客户的\
  \ Experience Cloud 站点，以确保站点在高负载下的性能在可接受范围内。\n\n在下一章中，我们将讨论大数据量的话题，这正成为一个热门话题，因为组织的数据正在呈指数级增长，需要适当的管理方式。\n\
  \n### 问题\n\n- 1. 精准打印 (PP) 在机会对象中有大量记录，用户一直抱怨报告运行时间非常长，列表视图加载时间更长。数据架构师可以提出哪些建议来改进这些报告和列表视图的性能？选择两个答案：\n\
  \n  - a) 要求用户检查其网络并升级到更高速的连接。\n\n  - b) 减少列表视图中查询的字段数量。\n\n  - c) 将报告设置为自动运行，这样用户无需等待其完成。\n\
  \n  - d) 分析报告，确定报告和列表视图中最常用的字段。联系 Salesforce 客户支持，在机会对象上创建一个精简表。\n\n- 2. 精准打印 (PP)\
  \ 正在为其 50,000 多名 Salesforce 用户部署一个应用程序。分配到该项目的架构师提出，在应用程序推广到生产环境之前应进行性能测试。与质量保证\
  \ (QA) 负责人和项目经理合作，团队在 Salesforce 中进行性能测试时需要考虑哪些事项？选择两个答案：\n\n  - a) 性能测试必须在专为性能测试设计的\
  \ Salesforce 预配沙盒上进行。\n\n  - b) Salesforce 必须批准测试方法，且测试用例必须在运行测试前提交。\n\n  - c) 没有必要进行性能测试，因为应用程序会在生产环境中自动进行测试。团队可以待命以解决出现的任何问题。\n\
  \n  - d) 在平台上进行性能测试时，必须事先征得 Salesforce 的批准。\n\n  - e) 全副本沙盒可用于性能测试，因为它在硬件方面接近生产环境，并且在创建沙盒时，它可以拥有与生产环境相同的数据。\n\
  \n- 3. 数据组合 (DC) 是一家数据分析公司，依赖 Salesforce 进行其销售和营销流程。DC 大量定制了其销售应用程序。该公司目前使用经典 UI，但计划很快迁移到\
  \ LEX。用户一直在报告账户记录页面加载非常缓慢。架构师可以提出哪些建议来改善这种情况？选择两个答案：\n\n  - a) 告诉用户耐心等待，因为迁移到 LEX\
  \ 将解决大多数这些性能问题。\n\n  - b) 运行报告以分析页面布局中字段的使用频率。从页面布局中删除未使用的字段。\n\n  - c) 通过在页面布局上实现一个按钮来启用延迟加载，该按钮配备一个组件，用于从外部源查询数据，而不是在页面加载时加载数据。\n\
  \n  - d) 联系 Salesforce，要求他们在页面布局上可见的字段上创建自定义索引。\n\n### 延伸阅读\n\n- 闪电体验技术要求: https://help.salesforce.com/articleView?id=sf.technical_requirements.htm&type=5\n\
  \n- 性能测试简介: https://developer.salesforce.com/blogs/2020/09/introduction-to-performance-testing.html\n\
  \n- 性能测试常见问题: https://help.salesforce.com/articleView?id=000335652&type=1&mode=1&language=en_US\n\
  \n\n\n\n- [Salesforce 平台每日处理 13 亿+ 笔交易的内部机制](https://developer.salesforce.com/blogs/engineering/2013/10/under-the-hood-how-the-salesforce-platform-handles-1-3-billion-transactions-per-day.html)\n\
  \n- [Experience Cloud 性能与扩展最佳实践](https://help.salesforce.com/articleView?id=sf.networks_perf_scale_best_practices.htm&type=5)\n"
- '# 第 3 部分：大数据量 (LDVs) 和数据迁移


  在本部分中，您将了解 LDVs——它们是什么，以及如何在搜索和 SOQL 查询中使用它们。还将讨论与加载 LDV 相关的主题，并通过示例演示如何高效加载数据而不出现问题。在最后一章中，将讨论数据迁移的最佳实践和
  API 的使用。


  本部分包含以下章节：


  - 第 7 章，处理大数据量

  - 第 8 章，常规数据迁移的最佳实践

  '
- "## 处理大数据量\n\n在本章中，我们将讨论在 Salesforce 中处理大数据。Salesforce 已被组织使用很长时间，越来越多的组织已从实施和稳定阶段转入更成熟的增长阶段，其重点是利用实施阶段引入的功能来增加收入并降低成本。业务增长意味着数据也在增长，需要妥善管理，以防止对业务造成任何中断。\n\
  \n我们将简要了解不同类型的数据库，然后深入探讨**大数据量 (LDVs)**，这个话题因其独特的挑战而引起我的兴趣。我们将探讨什么是 LDV 场景，并讨论在可能的情况下如何避免这些场景。当我们确实需要处理\
  \ LDVs 时，我们将了解为取得成功所需考虑的因素，以及优化加载或集成 LDV 的技术。\n\n无需始终使用涉及中间件的点对点集成与 Salesforce 进行集成：这就是\
  \ Salesforce Connect 和外部对象发挥作用的地方。我们将回顾外部对象、其限制以及使用外部对象的优势。当处理数以亿计甚至数十亿行的海量数据时，大对象可以提供帮助。我们将讨论大对象的优势及其注意事项，然后结束本章。\n\
  \n本章涵盖的主题包括：\n\n- 再探数据库\n- **大数据量 (LDVs)**\n- Salesforce Connect 和外部对象\n- 大对象简介\n\
  \n通过本次讨论，我们将了解在处理大数据时可用的选项，以及根据我们所处理的用例选择哪种选项。\n\n### 再探数据库\n\n在深入探讨 LDV 及相关主题之前，让我们简要回顾一下历史。了解关系型数据库和非关系型数据库将帮助我们理解\
  \ Salesforce 提供的不同类型的解决方案，并根据要求协助确定使用哪一种。在现代计算的早期，磁带被用于存储，第一个数字磁带存储系统 IBM Model\
  \ 726 可以在单盘数据中存储 1.1 **MB**（兆字节）。为了进行比较，如今，一盒磁带可容纳高达 15 **TB**（太字节）。Model 726 是一种非关系型数据库，因为它是由相互链接的自由格式记录组成的。\n\
  \n随后出现了关系型数据库，它提供了一种更有条理的方法来存储、检索和搜索数据。数据按照规范化原则存储在多个表中，并使用称为**主键**和**外键**的唯一标识符在逻辑上链接在一起。有关规范化的更深入讨论（带有示例），请参阅\
  \ *第 2 章，理解 Salesforce 对象和数据建模*。\n\n### 关系型数据库\n\n**关系型数据库**为事务型和分析型应用程序提供了理想的媒介，当今广泛用作**企业资源计划\
  \ (ERP)** 系统、**客户关系管理 (CRM)** 系统和分析应用程序的存储骨干。关系型数据库的以下四大特性（简称 **ACID**）（**原子性**、**一致性**、**隔离性**、**持久性**）使其非常适合这些用途：\n\
  \n- **原子性**：关系型数据库内置了非常强大的事务控制机制。这意味着，如果事务在任何时候失败，它将被回滚，将值切换回较早的值，以确保数据保持准确。这防止数据库中的某些值因事务失败而被部分更新，而其他值保持不变。用于演示原子性的常见示例是银行账户之间的资金转账。原子性属性确保完整事务（即借记一个账户并贷记另一个账户）已完成，否则完整事务必须失败，以使数据库保持一致状态。\n\
  \n- **一致性**：这意味着数据库中定义的检查和约束必须在每个事务中得到满足。例如，如果表中的某列被定义为保存整数值，则数据库不应允许事务插入字符或 **二进制大对象**（或\
  \ **BLOBs**，通常用于 Oracle 数据库中存储图像和音频文件）。另一个示例是，在保存客户主数据的表中需要客户姓名。每当输入空值并尝试保存时，列上定义的约束将生效并阻止保存完成。\n\
  \n- **隔离性**：此属性与事务对系统其他用户和进程的可见性相关。它确保访问相同数据的事务不会与另一个事务并发运行。这一点很重要：假设一个银行账户余额为 1,000\
  \ 美元，并发起两笔转账，每笔向不同账户转账 200 美元。这应该是两个独立的事务，但如果它们并发运行，两者都将读取余额为 1,000 美元，而第二个事务本应读取余额为\
  \ 800 美元（在第一笔 200 美元转账到另一个账户后）。\n\n- **持久性**：此属性与确保事务完成后，事务结果必须能够经受住任何系统故障相关。数据库管理员可以采取措施确保其数据库具有持久性，包括定期备份数据，而\
  \ Oracle 和 SQL Server 等现代数据库具有内置机制，可以应对灾难性故障并仍保持数据持久性。\n\n回顾了关系型数据库后，让我们在下一节中了解非关系型数据库。\n\
  \n### 非关系型数据库\n\n您可能已经从名称中猜到，非关系型数据库不使用关系（以关系型数据库中的主键、外键为例），因此不使用带有列和行的表。\n\n非关系型数据库使用针对数据库中将存储的数据类型进行优化的存储。例如，如果将存储\
  \ JavaScript 对象表示法 (JSON) 数据，则针对 JSON 存储进行优化的文档数据存储可能合适。非关系型数据库通常称为 NoSQL 数据库。这是因为它们不使用\
  \ SQL 来查询数据，而是使用其他方法来查询数据。让我们简要讨论一些 NoSQL 数据库：\n\n- **列式数据存储**：此类存储表面上与关系型数据库很相似，但它以非规范化格式存储数据。这些数据库具有列族（类似于关系型数据库中的表），列族中有行，行中有列。这些列中的值本质上是键值对的元组。列族包含在逻辑上相关的数据列，通常作为一个单元进行查询和操作。图\
  \ 7.1 展示了一个列族示例：\n\n\n![](img/782d45700e093b3d82b348c0ccc8ccba_291_0.png)\n\n图 7.1\
  \ – 列式数据库示例\n\n在列式数据库中，并非所有列都需要填充，且每行的列数也可以不同。在前面的示例中，仅显示了一行：\n\n- 键值数据存储：这些数据库将数据存储为键值对，键充当标识符，值是存储的数据。值使用适当的\
  \ **哈希函数** 进行存储。无需深入讨论哈希（超出本书范围），哈希函数只是使用数学函数将变长输入转换为压缩的数值固定长度输出。下面展示了一个键值存储示例：\n\
  \n| 键 | 值 |\n|---|---|\n| 123 | ('Hi', 'Bob', '544-3434', 10000) |\n| 343 | ('Hello',\
  \ 'John', '434-9241', 5751) |\n| 569 | ('Howdy', 'Tim', '979-3111', 50311) |\n\n\
  图 7.2 – 键值数据库示例\n\n键值存储针对使用键查询数据进行了优化，与关系型数据库不同，它们不适合使用非键值检索数据。\n\n- 图数据存储：这种数据存储管理实体（即数据本身），也管理实体之间的关系。实体称为\
  \ **节点**，关系称为 **边**。与关系型数据库相比，这种数据库更强调实体之间的连接方式。这种数据库允许进行极快速查询，以理解复杂实体及其关系（节点）。图\
  \ 7.3 展示了一个图数据存储示例：\n\n![](img/782d45700e093b3d82b348c0ccc8ccba_292_0.png)\n\n图\
  \ 7.3 – 显示旅行者节点和边的图数据库示例\n\n在图数据存储中，访问节点及其边的操作非常高效，通常用于存在大量数据且需要探索复杂关系的场景。例如，用于欺诈检测的金融系统使用图数据存储来分析超出单个数据点的内容并形成合理结论。\n\
  \n- 文档数据存储：这些数据存储旨在将命名字符串字段和值存储在称为 **文档** 的实体中。这些文档使用 JSON 格式，并提供灵活性，使得每个存储记录可以彼此不同。图\
  \ 7.4 展示了一个文档数据存储示例：\n\n```\n[\n  {\n    \"year\" : 2020,\n    \"make\" : \"Tesla\"\
  ,\n    \"model\" : \"Model S\",\n    \"info\" : {\n      \"Parts sourced from\"\
  \ : [ \"Mexico\", \"China\", \"Brazil\"],\n      \"First delivery date\" : \"2010-01-07T00:00:00Z\"\
  ,\n      \"Consumer product rating\" : 7.2,\n      \"image_url\" : \"http://imageURL_Models\"\
  \n    }\n  },\n  {\n    \"year\" : 2021,\n    \"make\" : \"Lucid\",\n    \"model\"\
  \ : \"Air\",\n    \"info\" : {\n      \"Parts sourced from\" : [ \"Mexico\", \"\
  China\"],\n      \"First delivery date\" : \"2021-03-07T00:00:00Z\",\n      \"Consumer\
  \ product rating\" : 8.1,\n      \"image_url\" : \"http://imageURL_LucidAir\"\n\
  \    }\n  }\n]\n```\n\n图 7.4 – 电动车辆示例文档存储\n\n这种类型的数据存储适用于关系型数据库提供的严格结构不那么重要的场景。相反，更倾向于以文档形式存储和检索数据的灵活性，例如允许用户创建个人资料的高流量网站。\n\
  \n无论是关系型还是非关系型数据库，各有其优缺点，使其适用于特定场景。非关系型数据库适合存储结构较少的大量数据。由于只需最小结构，它们能更灵活地适应变化的业务条件。当需要更多结构、复杂业务逻辑以及\
  \ ACID 事务来确保准确性、完整性和数据完整性时，关系型数据库绝对是更好的架构选择。Salesforce 平台将关系型数据库用作其基础数据存储，但也存在其他使用非关系型数据库的服务。\n\
  \n您可能不需要参与决定使用关系型还是非关系型数据库，但了解其背后的理念能让我们以更有意义的方式与之交互，因为我们了解其优缺点。这一点尤其适用，因为我们中的大多数人，如果不是所有人，都以一种或另一种方式使用基于云的服务。既然我们更好地理解了不同类型的数据库，并了解它们在提供我们所使用的服务中所起的关键作用，让我们深入了解\
  \ LDV。\n\n### 大数据量（LDV）\n\nSalesforce 中的 LDV 没有严格的正式定义，如果您向经验丰富的架构师询问什么构成 LDV 场景，您很可能得到的答案是：这取决于具体情况。原因是，即使记录数量远低于\
  \ Salesforce 提供的一般指南，也可能存在 LDV 场景。一般指南是，一旦任何对象中的记录超过 100 万条，即构成 LDV 场景，您可能会开始看到\
  \ LDV 的影响。\n\n虽然记录数量是判断是否存在 LDV 场景的一个考量因素，但并非唯一考量因素。即使记录数量低于通常推荐的阈值（即超过 100 万条记录），也可能有几个其他因素导致\
  \ LDV 场景。这些因素包括：\n\n- **事务量和复杂性：** 这与组织中进出的数据量有关。如果您有与 ERP 等外部系统同步数据的集成，并且成百上千条记录正在传输到系统中，这可能不符合\
  \ LDV 场景的推荐指南。但是，假设您有三个此类集成同时运行——现在您将超出 LDV 的一般指南限制。\n\n  另一个方面是事务的复杂性。从 ERP 导入并更新账户记录的集成将比从\
  \ ERP 导入产品数据并在 Salesforce CPQ 中动态形成捆绑包的集成运行得快得多。同样，当数据从 Salesforce 传出时，简单的机会数据导出将比使用\
  \ Salesforce 中的合同、订单或报价数据更新 ERP 的集成快得多。\n\n- **数据偏斜：** 我们将在后续章节讨论不同类型的数据偏斜及其对性能的影响。\n\
  \n- **组织复杂性：** 组织在规模、共享规则复杂性和角色层次结构方面的复杂性可能会产生影响并创建 LDV 场景。考虑一种场景，当记录插入 Account\
  \ 对象时没有共享规则，与集成运行且组织具有复杂 Apex 共享规则的情况相比。在第二种场景中，每次插入记录时都必须确定记录可见性，在处理大量记录时这可能会导致问题。\n\
  \n单靠记录数量显而易见，但我们在这里讨论的因素组合也会导致 LDV 场景。这应强调在最终确定集成或迁移方法之前正确分析组织的重要性。未能这样做可能会导致日后修复成本高昂且耗时的问题。让我们了解如果\
  \ LDV 在架构中未得到妥善考虑，其影响是什么。\n\n### 了解 LDV 的影响\n\n如果架构中未妥善考虑 LDV，您可能会看到 LDV 的影响。以下是当系统未针对\
  \ LDV 场景进行最优架构设计时的一些关键影响。这是在 Salesforce 中实施增强功能或新应用程序时，必须提出问题、理解答案并基于未来 3–5 年的预期数据增长进行设计的原因之一。\n\
  \n- 报表和列表视图：当遇到 LDV 场景时，这些最有可能是用户首先反映的内容。报表和列表视图会开始变慢，用户会抱怨说报表以前几秒钟就能运行，现在却需要很长时间。更糟糕的是，由于数据库需要筛选大量数据才能返回结果，这些操作可能会开始超时。\n\
  \n- 搜索：如果搜索引擎需要查询数百万条记录，搜索结果将花费更长时间。这是另一个用户会很快发现异常、结果返回速度比平时慢得多的领域。如果搜索使用自定义 UI，且搜索引擎需要查询多个对象并使用多个通配符，这一点尤其明显。\n\
  \n- SOQL：使用 SOQL 返回结果的 Lightning 组件或 Visualforce 页面在查询运行超过 120 秒时会开始变慢或出现查询超时问题。无论查询是否运行那么久，您都应该始终编写优化的\
  \ SOQL 查询，快速返回结果，而不必让用户等待很长时间。\n\n\n\n\n\n- **共享计算**：每当记录所有权更新时，就会计算共享规则。在 LDV 场景下，这可能需要很长时间才能运行。这一点需要予以考虑，尤其是涉及数据迁移或集成的场景，因为当插入新记录或更新现有记录的所有者时，共享计算会自动运行，并且在\
  \ LDV 场景下会减慢系统速度。\n\n- **相关列表**：用户会开始注意到某些记录的相关列表变慢。这与所有权偏斜有关，我们将在后面讨论，但当主从关系中从表一侧拥有大量记录时，也可能发生这种情况。例如，一家节奏快速的\
  \ **面向消费者（B2C）** 公司拥有数十万客户，一些忠诚客户的频繁订单导致 *Order* 对象中生成了大量记录。像 Amazon 这样拥有使用 Amazon\
  \ Prime 并几乎从其在线商店订购每一件商品的客户的公司，最终可能在 *Order* 对象中拥有数十万条记录。人员账户记录上的相关列表可能需要很长时间才能加载。\n\
  \n我们已详细了解了 Salesforce 的多租户架构，但让我们从 LDV 的角度来回顾一下多租户架构和搜索架构。\n\n### 多租户和搜索架构\n\n在第\
  \ 2 章“了解 Salesforce 对象和数据建模”中，我们详细了解了 Salesforce 的多租户架构。请参阅该章节以刷新你的记忆，但简而言之，多租户是一种使用相同硬件-软件栈为多个无关客户提供服务的方式。软件层或运行时引擎将每个客户的自定义内容和数据与其他客户隔离，防止其被查看或访问。在运行时，引擎会根据客户的元数据实例化虚拟表。\n\
  \n每当使用标准对象或自定义对象创建新的 Salesforce 应用程序，并为其添加标准字段或自定义字段时，Salesforce 都不会为（比如说）将字段作为列的自定义对象创建物理数据库表。这样做不可扩展，因为通常有数百个租户托管在一个实例上，管理租户所做的数据库更改需要大量资源。相反，平台使用一组元数据、数据和透视表（定义关系、唯一字段和索引的表）来管理虚拟数据库结构。\n\
  \nSalesforce 中有大量地方使用了 **搜索** 功能，最常见的或许是 **全局搜索**，但查找和重复记录处理时也会用到。Salesforce 的搜索架构基于其自身的数据存储，并针对搜索进行了优化。\n\
  \n了解底层架构的工作原理将有助于我们理解，为什么无法执行传统数据库中曾可用的某些操作。例如，你可以优化底层 **结构化查询语言 (SQL)**，随意运行数据库统计信息，或创建索引以优化数据库性能。如果在加载大量数据后认为有必要立即使用户可用，你也可以运行索引更新作业。\n\
  \n在 Salesforce 中，由于它是多租户共享环境，我们无法访问底层数据库，必须妥善规划集成和数据迁移。例如，平台上的搜索每 15 分钟运行一次，如果刚刚进行了大规模数据迁移，可能需要很长时间才能完成。如果组织的\
  \ 24/7 呼叫中心依赖于此，我们需要恰当安排时间。同样，平台上的数据库统计信息每晚运行一次，这意味着在 LDV 迁移后尝试访问数据时，你的 SOQL 查询可能会很慢。\n\
  \n让我们回顾一下迁移或为 LDV 设计集成时需要考虑的一些关键事项。\n\n### 集成或迁移 LDV 的注意事项\n\n在设计 LDV 集成或迁移时，必须将多个注意事项放在首位。这是因为，尽管\
  \ LDV 的要求与典型集成或迁移并无太大不同，但关键在于了解 LDV 的影响，以便在设计中纳入缓解措施，避免出现问题。其中一些注意事项也适用于非 LDV 集成和迁移，但这里予以提及是因为它们对\
  \ LDV 有重大影响。\n\n### 绿地组织与棕地组织\n\n绿地组织是一个全新的组织，你需要从零开始进行设置。通常，当组织开始使用 Salesforce\
  \ 时，他们会设置 CRM，组织会随着时间的推移慢慢发展，并在此基础上构建其他应用程序。另一方面，棕地组织是指已经上线并正在用于业务运营的组织。\n\n在棕地组织中进行\
  \ LDV 迁移比在绿地组织中更复杂。原因是需要考虑的因素更多，首要因素是尽量减少对正在进行的业务运营的任何干扰。LDV 操作可能需要很长时间才能运行，并且可能会产生可见的性能影响，从而影响运营。例如，你最不希望看到的情况是，当加载\
  \ Case 记录的 LDV 进程正在运行时，你的客户支持用户正在与客户通话，却在等待 Case 记录打开。\n\n对于绿地组织，你不会遇到这类问题，在运行 LDV\
  \ 操作时拥有更多灵活性。务必始终站在用户的角度，确保并深入思考运行 LDV 操作的影响。许多企业在 Salesforce 平台上运行关键应用程序，而 Account\
  \ 对象是 Salesforce 生态系统的中心。这是因为几乎所有在平台上构建的应用程序都使用它，任何影响 Account 记录的 LDV 操作都会减慢平台上所有人的系统速度。\n\
  \n在使用全球棕地组织时，另一个挑战是时区差异。LDV 所需时间取决于加载的数据量，但你可能会发现，需要停机来运行操作会很棘手。某个时区的用户可能离线，但这不一定意味着是加载数据的好时机，因为不同时区的用户可能正在充分使用系统。为防止这类问题，LDV\
  \ 可以在周末运行，但如果平台上运行着 24/7 呼叫中心，这仍然可能具有挑战性。\n\n### 数据建模\n\n如上一节所述，Salesforce 数据模型将\
  \ Account 对象作为关键对象，其他对象通过主从关系或查找关系与其关联。从其他系统迁移时，请确保了解源系统的数据模型。这是因为，与你的假设相反，源系统的数据模型可能与你预期的不同。例如，在\
  \ Siebel 中，S_PARTY 表是包含联系人、用户、员工和账户（公司）的主表。其他记录和其他表是从它扩展而来，用于标识记录属于员工、联系人还是用户。如你所见，该数据模型与\
  \ Salesforce 中的不同，了解数据模型将有助于你确定为成功加载数据所需的转换。\n\n请记住，Salesforce 平台针对读取操作进行了优化，而传统数据库则针对写入操作进行了优化。这意味着你应尽可能注意对数据进行反规范化。例如，一个账户可能有多个地址，如账单地址、送货地址和法律地址。在传统型数据库中，这些地址存储在主外键关系的单独表中，但在\
  \ Salesforce 中，Account 对象上直接包含送货地址和账单地址。你希望为要在对象上存储的其他地址创建新字段。\n\n\n\n\n\n反规范化的一个被忽略的好处是，它减少了需要加载的记录数量，从而实现了更快、性能更好的加载，并且在需要验证的总行数方面需要较少的验证。从我们前面的示例来看，假设存在四种类型的地址——账单地址、送货地址、法律地址和售往地址。这些将在地址表中形成四条记录，但在\
  \ Salesforce 中，我们只需在 Account 对象上创建额外的两个地址，从而将需要加载的行数从四行减少到一行。下图展示了一个示例来演示这一点：\n\n\
  | ID | 名称 |\n|---|---|\n| 1 | Precision Printing |\n| 2 | MPath Logistics |\n\n\
  ### 账户表\n\n| ID | 类型 | 地址 |\n|---|---|---|\n| 1 | 售往 | 123 Main St, Vancouver BC\
  \ |\n| 1 | 账单 | 1 Mission St, Vancouver BC |\n| 1 | 运输 | 2411 Royals Road, Vancouver\
  \ BC |\n| 1 | 法律 | 541 Sheppard St, Toronto ON |\n| 2 | 账单 | ... |\n\n### 地址表\n\n\
  ### 图 7.5 – 展示地址在规范化数据库中如何存储的示例\n\n地址表中的“类型”列通常是另一个表，其中定义了所有地址类型，但此处为清晰起见将其合并。当数据反规范化并准备加载到\
  \ Salesforce 时，地址表不需要作为单独的对象创建，而是会在 Account 对象上创建不同的地址类型。\n\n图 7.6 显示了与图 7.5 等效的内容。可以看到，不同类型的地址与账户名称及其他相关账户详细信息一起存储（此处为简洁起见未显示）：\n\
  \n| ID | 名称 | 账单地址 | 运输地址 | 售往地址 | 法律地址 |\n|---|---|---|---|---|---|\n| 1 | Precision\
  \ Printing | 1 Mission St, Vancouver BC | 2411 Royals Road, Vancouver BC | 123 Main\
  \ St, Vancouver BC | 541 Sheppard St, Toronto ON |\n| 2 | MPath Logistics | 234\
  \ Quadra St, Chicago IL | 234 Quadra St, Chicago IL | 77 Jasper Ave, Calgary AB\
  \ | 901 Bay Street, Toronto ON |\n\n### 图 7.6 – 不同类型的地址将在 Salesforce 账户对象上如何存储的可视化表示\n\
  \n我们已了解数据建模的重要性，以及规范化与反规范化如何在设计数据迁移和集成时产生必须考虑的转换要求。\n\n### 工具\n\n**提取、转换、加载 (ETL)**\
  \ 工具可以从源系统提取数据，进行转换，然后将数据加载到目标（即 Salesforce 对象）中。虽然这些工具对大多数迁移非常有用，但 LDV 可以利用 MuleSoft\
  \ 等集成工具。原因是集成工具提供了一组更强大的功能，这使得迁移或集成 LDV 更加容易。例如，ETL 工具可以转换数据，但在你想要插入一个批次，然后根据某个标准对其进行更新的场景中，大多数\
  \ ETL 工具无法将两者链接起来。另一方面，集成工具可以轻松做到这一点，并在我们的示例中为你提供灵活性，即让插入操作完成，并在前一个操作成功后运行更新操作。以这种方式链接事件可以节省大量时间，因为它消除了手动干预的需求，并允许你以更多灵活性运行批次。\n\
  \n不要低估链接的重要性，因为它可以节省大量时间并让你免受许多麻烦。原因是 LDV 与常规加载不同，常规加载可能涉及几百、几千或几十万条记录。即使在 100,000\
  \ 条记录的批次中有 0.5% 的记录失败，你也需要手动修复 500 条记录，如果不是巨大的话，这也是一个相当大的数字。对于 LDV，100 万条记录的批次中有\
  \ 0.5% 的记录失败意味着 5,000 条，如果需要手动修复，这将是一个非常大的数据量。集成工具提供了重新运行失败记录的功能，你可以编排步骤的流程，以使需要任何类型手动干预的记录数量保持在最低限度。\n\
  \n在迁移到活跃的棕地组织时，你可能需要将现有数据从 Salesforce 导出，以某种方式对其进行转换，然后再将其加载回 Salesforce。集成工具在此处也很有用，因为一旦你熟悉为工具配置的设置，就可以对其进行自动化。例如，如果你要合并两个组织（org\
  \ A 和 org B），其中 org B 将在合并后停用，那么你很可能在 CRM 数据之间有高度重叠，在这种情况下，你将希望从 org A 提取数据，转换数据（包括从\
  \ org B 添加新属性），然后将其加载回 Salesforce。\n\n### 为操作定时\n\n如果可能，在迁移数据时考虑采用分阶段方法，而不仅仅依赖一个周末来完成。尽管你已尽最大努力，将\
  \ 1000 万个案例加载到 Salesforce，以及 100 万个账户记录和 300 万个联系人记录，也可能是大量工作。通过将大量数据拆分为可管理的块来分阶段进行迁移。这样，在数据迁移切换时，你将剩余较少的增量记录需要加载。\n\
  \n在全副本沙盒中运行批次时，对加载运行所需时间进行基准测试，将让你了解在生产环境中运行加载需要多长时间。这一点很重要，因为你希望确保与受影响用户的沟通无懈可击，并且他们知道平台日常使用受到影响的内容、方式和时间。\n\
  \n### 迭代，迭代，再迭代...\n\n我再怎么强调这一点都不为过：多次迭代你的加载以消除任何问题。从 Developer Pro 沙盒和几千条记录开始，修复任何问题，然后重新运行批次。逐步增加记录数量并加载数据。一旦超过了\
  \ Developer Pro 沙盒中记录数量的限制，请转到 Partial Copy 沙盒，它提供 5 GB 的存储空间。最终，你希望在与生产环境完全相同的全副本沙盒中执行任何用户验收测试。\n\
  \n### 转换\n\n如你众所周知，数据迁移和集成通常不是简单的提取和加载操作，而是在加载到目标之前涉及重大的转换。对于 LDV，由于数据量大，转换变得更加资源密集。如前所述，转换应在\
  \ Salesforce 之外完成，而不是依赖那里的自动化工具来加快加载速度并防止出现问题。\n\n转换可以是各种事情，从使用公式来串联和创建新值到添加缺失值或根据某些标准在目标中替换值。你需要记住的另一种转换类型是转换为\
  \ Salesforce 中的字段类型。我所说的数据类型是，SQL Server、Oracle 等传统数据库在数据库中为每个表列定义了数据类型，因此一个列可以是小数、文本或类似的类型。在\
  \ Salesforce 中，由于我们无法直接访问数据库，我们拥有字段类型，因此要存储数字（无论是整数还是小数），你需要创建一个类型为 **数字** 的新字段。当你想要从\
  \ SQL Server 迁移数字值时，你需要将其类型转换为 Salesforce 中的相应类型。\n\n你还需要将源中的选项列表值转换为 Salesforce，同样，还需要根据业务要求进行其他转换。重要的是，可能会发生重大转换，工具应能够处理加载而不会拖慢整个过程。\n\
  \n### 用户参与和验证\n\n从项目一开始就让熟悉数据的用户参与进来。验证数据加载是否成功有多个方面，其中之一是让了解其数据的高级用户参与进来。设定期望、时间表，以及他们需要在多大程度上和何时验证加载。知道源中的记录总数与加载到\
  \ Salesforce 中的记录总数匹配是一回事，但这不一定意味着所有数据元素都传输正确，特别是在中间有转换步骤时。\n\n你的用户将帮助发现字段看起来为空白或缺少战略账户等方面的缺口。这些有问题的记录不一定会出现在你的错误日志中，但从可用性角度来看，数据不准确。指导你的用户选择随机数据样本进行验证，但也要关注对业务最关键的数据。\n\
  \n根据对象，实现验证的另一种方法是验证字段的聚合计数或总和。例如，如果你的业务要求是加载当前财政年度的机会数据，那么将当前财政年度所有机会的 **金额** 字段总和与源系统中的值进行比较。如果机会无法一对一比较（例如，由于\
  \ **阶段** 字段值不同），这可能会变得棘手，并且可能需要一些额外工作。\n\n在下一节中，我们将讨论，如果可能，应尽量避免 LDV 场景。\n\n###\
  \ 防止 LDV 场景\n\n好了，本节的标题可能听起来有点极端，LDV 也并非一种疾病，但要点是，如果可能，你应该避免遇到 LDV 场景。我要强调的是，上一节讨论的标准并不意味着除非绝对必要，否则你就应该自动开始考虑\
  \ LDV 场景。\n\n\n\n\n\n有防止 LDV 场景的方法，在合理的情况下应当采用。需要澄清的是，大型组织会出现 LDV 场景且无法避免，但我在这里再次强调，并非每个\
  \ LDV 场景都是自然形成的。相反，有些可以直接预防，例如，当组织没有归档策略，并且在 Salesforce 中存储了多年的数据，导致 LDV 情况时。在这种情况下，你应认真考虑将数据移出平台。让我们讨论一下可用于将数据移出平台以实现更好可扩展性和性能的选项。\n\
  \n### 数据归档\n\n使用自动化工具定期归档数据，可以防止平台数据大规模增长，是一个不错的策略。请记住，核心 Salesforce 平台功能虽然强大，但并非用于存储海量数据，而是用于最佳事务负载。归档数据可以改进报表、列表视图和仪表板性能。它还能改进\
  \ SOQL，因为数据库需要查找的数据集更小。\n\n数据归档可用于保留不再活跃但因审计或监管合规目的需要保留的旧数据。它可以帮助组织中仅保留运营所需的活跃数据。例如，不活跃的客户账户和联系人，如果已超过\
  \ 5 年未订阅且未响应营销活动，可标记为归档。让我们简要看看可以用于归档 Salesforce 数据的一些方法：\n\n- **面向中间件**：这利用中间件来编排归档过程并将数据存储在数据存储中。为检索目的，你可以使用\
  \ Lightning Connect，或使用中间件将数据检索到（例如）Salesforce 中的 Lightning 组件。\n\n- **AppExchange\
  \ 合作伙伴**：另一种方法是依赖第三方 AppExchange 应用来归档数据。AppExchange 上有许多此类应用，提供一系列功能可用于满足你的数据归档需求。\n\
  \n- **Heroku**：使用 Heroku 的组织也可以利用它来归档数据。这利用了 Postgres 数据库，以及 Lightning Connect、Heroku\
  \ Connect 和自定义 Web 服务来启动归档过程。\n\n- **大对象**：这是将数据从主 Salesforce 对象归档到专为存储大量数据而设计的特殊对象的另一种方式，但它们也有必须考虑的限制。我们将在本章后面更详细地讨论大对象。\n\
  \n简要回顾归档方法后，让我们继续讨论预防 LDV 场景的其他方式。\n\n### 删除\n\n删除已确认对组织无价值且因法规或合规原因不需要存储的数据，是永久删除的良好候选。这可以释放存储空间并减少潜在的\
  \ LDV 场景。\n\n需要理解的是软删除和硬删除之间的区别。当记录被软删除时，不会实现性能改进，因为数据仍在平台上，并且会在回收站中保留 15 天。平台必须显式地将这些记录从查询和其他操作中排除。\n\
  \n如果知道不再需要已删除的数据，使用带有硬删除选项的 Bulk API 将允许你立即删除记录，而不将其存储在回收站中。建议对大量数据删除和即时性能改进使用此选项。\n\
  \n### 混搭\n\n这是一种数据虚拟化，数据存储在外部系统中，应用在 Salesforce 用户界面 (UI) 中提供。这本质上创建了一种松耦合的集成，不依赖任何专有方法来集成两个应用程序。缺点是它最适合需要实时获取少量数据的场景。\n\
  \n### 外部对象\n\n这是另一种数据虚拟化形式，数据存储在源系统中，但使用 OData 连接器，数据可以在 Salesforce 中按需提供。例如，假设你在\
  \ Microsoft Dynamics 中有订单数据。与其进行传统集成来集成 Salesforce 和 Microsoft Dynamics，不如使用 Salesforce\
  \ Connect 将两个系统链接起来。当用户在 Account 记录上打开订单相关列表时，将通过连接器进行实时调用，结果返回并在相关列表中显示。\n\n在下一节中，我们将探讨优化\
  \ LDV 操作性能的不同方式。\n\n### 优化 LDV 操作\n\n优化 LDV 操作性能有多种方式，我们将在即将到来的子章节中介绍这些方式。如果你遇到性能问题，不要一次性尝试所有这些方法，而是尝试实施这些技术并记录性能，同时继续根据需要监控和微调。这可以帮助你精确定位性能问题的原因，并可能有助于解决其他类似问题。\n\
  \n### 数据偏斜\n\n当拥有超过 10,000 条全部关联到同一父记录的子记录时，就会出现数据偏斜情况。这是不希望看到的，防止数据偏斜的关键是将每个父记录的子记录数量保持在\
  \ 10,000 阈值以下，并将这些新子记录分布到不同的账户中。偏斜有三种类型：\n\n### 账户数据偏斜\n\n账户数据偏斜发生在大量子记录关联到同一账户记录时。例如，超过\
  \ 10,000 条机会记录具有相同的父账户。这通常发生在使用通用账户作为未分配联系人父记录时。账户数据偏斜可能导致以下问题：\n\n- a) 记录锁定：在多线程下更新大量子记录（例如同一账户下的机会）时，为保持数据完整性，需要锁定同一账户。锁持有时间很短，但可能之前的更新仍持有锁，导致当前更新失败。请记住，在父子关系中，更新子记录时也会锁定父记录，以维护数据库中的数据完整性。\n\
  \n- b) 共享问题：根据共享配置，简单的更改（例如更改账户所有权）可能需要检查该账户的每条子记录并调整共享。在涉及大量记录的场景中，这会耗费大量时间并导致问题。\n\
  \n### 所有权偏斜\n\n这是指单个用户拥有大量记录（通常超过 10,000 条）时发生的情况。例如，集成用户被分配了外部系统中的所有账户。当偏斜所有者存在于角色层次结构中时，删除或所有者更改等操作会导致系统从旧所有者、层次结构中的所有父用户，以及通过共享规则拥有访问权限的用户处移除共享。因此，所有权更改是系统中代价最高的事务性更改。\n\
  \n如果确实需要将大量子记录分配给父记录，请确定是否可以让子记录分布到多个父账户，从而避免所有权偏斜场景。请记住，Salesforce 中的每条记录都应有所有者，无论它是用户还是队列。\n\
  \n在无法避免所有权的情况下，可以让偏斜所有者在层次结构中没有角色。这样，系统就不需要对偏斜用户的记录进行任何共享计算。\n\n### 查找偏斜\n\n这是指大量记录关联到单个查找记录时发生的情况；例如，你有一个自定义报价对象，其中包含指向自定义设施对象的查找，用于指示组件维修地点。如果单个设施记录关联了过多报价，就会遇到查找偏斜问题。\n\
  \n从数据库术语来看，查找本质上是外键关系，在插入/更新记录时，关联的查找记录也必须被锁定以维护数据完整性。这就是查找偏斜不利于性能的原因。\n\n\n\n\n\
  \n即使多个对象都查找同一个对象，查找偏斜仍然可能发生；例如，对象 x、y 和 z 各自都有一个指向对象 a 的查找。如果对象 a 上的记录 ID ax1 是对象\
  \ x 上约 50,000 条记录、对象 y 上 10,000 条记录以及对象 z 上 20,000 条记录的父记录，则仍然会出现查找偏斜情况。可以采用以下一些方法来避免查找偏斜：\n\
  \n**改进记录保存性能** – 可通过以下方式实现：\n\n- a) 提高同步 Apex 代码的性能 – 通过将代码合并到单个触发器对象中，优化触发器以达到最佳性能。\n\
  \n- b) 删除不必要的工作流、流程构建器或流程，或将其合并到现有触发器代码中。请记住，这些自动化会延长锁定持续时间，可能导致锁定失败增加。将工作流删除或合并到\
  \ Apex 中可以提高性能。\n\n- c) 仅同步处理所需内容，并将其余代码移至异步处理，因为锁定会在自定义代码执行的整个期间保持。\n\n**分散偏斜**\
  \ – 考虑向查找添加更多值以避免偏斜，或尽可能将其留空。之所以会出现查找问题，是因为许多记录与单个记录具有查找关系。例如，一家企业为来访客户提供快速预算报价，而不会收集所有详细信息并在\
  \ Salesforce 中创建账户。为此目的已创建了一个通用账户记录。随着时间的推移，随着报价在该通用账户下创建，将出现查找偏斜情况，这可能会开始影响性能。\n\
  \n**使用选择列表字段** – 如果查找值较少，请考虑使用选择列表值。通过使用选择列表值，可以消除与查找相关的锁定，从而避免任何锁定问题。\n\n由此可见，看似无害的查找也可能导致严重的性能问题。这提醒我们需要考虑设计的后果，并为可扩展性和性能而设计。\n\
  \n### 列表视图和报表\n\n列表视图和报表通常是用户开始注意到性能问题的首要位置。这是因为平台上几乎每个用户都有报表、列表视图或两者兼有，以便专注于需要完成的工作：\n\
  \n- **限制字段数量：** 我首先建议教育用户在列表视图和报表中只使用他们真正需要的字段。在许多情况下，创建报表时，用户会添加字段来了解可用的数据，但在保存报表时从不删除它们。拥有用户不会使用的数据的报表价值较低，不仅如此，它还会影响性能。我认为最有效的策略不仅是在创建报表时告诉用户该做什么，还要解释这样做的重要性以及它可能对未来的影响。\n\
  \n此外，使用相对日期而不是精确日期值可以获得更好的性能。例如，在列表视图中使用 **上周** 来筛选上周的所有线索，在其他条件相同的情况下，比输入 **起始**\
  \ 和 **结束** 日期性能更好。\n\n不鼓励使用 **CONTAINS** 和 !=，因为这会阻止 Salesforce 平台使用索引，从而对性能产生负面影响。如果您不确定为用户创建的报表性能如何，有时编写报表或列表视图背后的查询并在查询计划中运行它会很有帮助。这可以让您了解查询在报表或列表中的性能。\n\
  \n- **未使用的报表：** Salesforce 提供了安排报表和仪表板的功能，以便用户可以自动通过电子邮件接收报表或仪表板。请确保经常清理已安排的报表和仪表板。在一个示例中，管理员使用的共享邮箱收到了多个报表的电子邮件，这些报表最初是高管的一次性请求，但从未从平台上删除。\n\
  \n- **治理：** 至少要对报表实施一定程度的治理。报表泛滥是真实存在的问题，如果不妥善处理，可能会迅速失控。我发现一种有用的方法是为每个业务部门创建报表文件夹，并授予该部门用户对文件夹的完全访问权限。或者，您可以指定\
  \ 1-2 个高级用户并授予他们 **管理器** 访问权限，其余用户对文件夹拥有 **编辑器** 访问权限。\n\n### SOQL 最佳实践\n\n每当我们打开显示数据的\
  \ Visualforce 页面、运行报表或使用 Data Loader 运行更新数据的接口时，很可能正在从数据库查询数据并在后台运行查询，无论我们是否意识到。虽然承认有些数据出于性能原因被缓存，但假设我们第一次运行上述操作，后台将运行查询。\n\
  \n因为 Salesforce 平台是多租户的，客户无法直接访问数据库，所以当您运行报表、SOQL 和列表视图时，请求会发送到所谓的 **查询优化器**。这是数据库之上的一个层，它将\
  \ SOQL 转换为数据库可以理解的 SQL 查询。查询优化器理解 Apex 类中的 *共享规则*，包括 *with sharing*，因为这些直接影响 SOQL\
  \ 语句的结果或报表运行时的结果。查询优化器旨在将 SOQL 优化为数据库运行的 SQL。*此处的优化是指是否会执行全表扫描或索引，以及连接的执行顺序。* 列表视图和报表部分中提到的一些做法也适用于\
  \ SOQL 查询，因此我此处不再赘述。\n\n让我们回顾一下与运行 SOQL 查询相关的一些最佳实践：\n\n- **使用索引：** 这对于确保查询高效运行非常有用。Salesforce\
  \ 中有两种索引类型 – 标准索引和自定义索引：\n\n标准索引包括 RecordId、标记为外部 ID 的字段、Name、LastModifiedDate、CreatedDate、RecordTypeId、Division、Email（仅适用于\
  \ Contact 和 Lead 对象）、查找和主从关系等字段。您可以要求 Salesforce 支持在公式字段和包含空值的字段上创建自定义索引。**公式**字段会实时计算值，默认情况下没有索引，这通常意味着需要进行表扫描。如果您决定在\
  \ **公式** 字段上创建自定义 **索引**，则定义 **公式** 字段的函数必须是确定性的。非确定性 **公式** 字段的示例包括：\n\n- 它们包含对另一个字段的引用，例如，查找。\n\
  - 它们引用另一个 **公式** 字段。\n- 它们使用动态日期和时间函数，例如 NOW、TODAY 等。\n- 它们具有所有者、自动编号、区划和审计字段（排除\
  \ **CreatedDate** 和 **CreatedByID**）。\n- 它们引用其他无法索引的字段，例如，多选选择列表、货币、长文本区域字段和二进制字段（包括加密字段）。\n\
  \n具有特殊函数的标准字段，例如 **Opportunity** 对象上的 **Amount** 和 **TotalOpportunityQuantity**\
  \ 字段。\n\n默认情况下不索引空字段，因此空字段需要全表扫描。可以应要求向 Salesforce 创建包含空字段的两列索引。在这种情况下，第二列可以是空值，但第一列不可以。\n\
  \n### 分区\n\n此功能有助于分区数据，从而提高查询性能。您可以让 Salesforce 启用此功能并根据区域创建分区，但也允许其他值。每个记录随后都会为\
  \ **Division** 字段赋值。例如，*分区* 值可以基于北美、欧洲、澳大利亚等区域。\n\n如果您拥有 **受分区影响** 权限，那么 Salesforce\
  \ 中的搜索结果、列表视图和其他功能将提供选择要返回其结果的分区的选项。例如，您可以在创建或编辑列表视图时指定感兴趣的分区，从而仅显示特定分区的记录。同样，您可以在报表选项中指定分区以返回特定分区的结果，否则将显示所有分区的记录。\n\
  \n\n\n\n### 专用集成用户\n\n我认为大多数，如果不是全部，集成密集型且数据量大的公司都会为这些操作使用专用集成用户，但我想重申在可能的情况下使用专用集成用户的必要性。这有助于识别是谁做出了更改以及这些更改是否与这些流程相关，但也有助于避免任何类型的冲突，当活跃平台用户正在组织中工作并且其用户名正在用于集成或数据迁移时。\n\
  \n### 设置适当的组织范围默认值\n\nSalesforce 在共享表中存储对记录的访问权限。每当插入记录或所有权发生变化时，平台都必须插入/更新这些共享表。将组织范围默认值\
  \ (OWD) 设置为私有会增加维护这些共享表的额外负担。建议，如果可能并且是新建组织，在数据加载期间使用公共读/写设置，然后根据需要将 OWD 更新为其他设置。这样将允许平台插入数据，而无需同时在共享表中插入记录。\n\
  \n### 并行共享规则重新计算\n\n随着组织自然增长或通过合并、收购或重组，预计会看到角色层次结构的变化。如果存在允许通过共享规则访问的共享规则，角色层次结构的更改意味着规则可能需要更新并重新运行。\n\
  \n在 LDV 场景中，这些规则可能需要花费大量时间才能完成，并导致诸如进程运行时间长和用户需要访问系统等问题。如果规则仍在运行且表格尚未更新，用户将无法访问数据或可能拥有超出应有权限的访问权限。\n\
  \n另一个问题是，由于这些共享规则的计算方式，关于进程需要多长时间才能完成没有太多信息，与此同时，如果 Salesforce 应用补丁或正在应用发布，这些进程会被中止并必须重新运行。\n\
  \n一旦 Salesforce 客户支持启用了并行共享计算功能，更新将通过后台处理队列异步发生。这允许创建多个执行线程并放入队列，从而快速完成进程，并且由于作业被放置在作业队列中，补丁或发布应用导致的中断不会影响这些作业。\n\
  \n### 禁用自动化和逻辑整合\n\n一个良好的通用做法是禁用您在组织中可能设置的自动化和数据质量工具。这些包括触发器、流程、流程构建器、工作流规则和验证规则。原因在于它们旨在确保数据质量或转换。在加载大量数据时在\
  \ Salesforce 外部执行这些操作将有助于防止组织出现超时和其他性能问题。一个常用的良好做法是在触发器上设置某种管理员可通过 **自定义设置** 或 **自定义元数据**\
  \ 类型访问的标志。只需将开关切换到 **关闭**，即可在 LDV 操作期间关闭所有触发器。这也应扩展到基于点击的工具，例如流程构建器、流程和验证规则，以便它们可以临时禁用。\n\
  \n需要考虑的另一个因素是组织的复杂性。它是否在同一对象上有多个工作流规则或流程构建器？Apex 代码是否已正确批量化？是否有高度依赖同步操作的自定义代码？如果对其中任何一个问题的回答是\
  \ _是_，您可能希望通过批量化 Apex 代码采取适当措施。在其他情况下，您希望将多个流程构建器上的业务逻辑整合到触发器中。在 LDV 场景中，一个更好的选择可能是将处理移至异步模型。其想法是避免同步操作，除非绝对必要。\n\
  \n整合也可以表现为减少您正在使用的自动化工具数量并将它们移至单一逻辑位置。例如，如果您在账户上有一个工作流规则、一个流程构建器、一个触发器和一个流程，从 LDV\
  \ 角度来看，我建议将它们整合并移至触发器中，或者如果用户不需要立即看到结果，则采用异步技术。\n\n### 推迟共享规则计算\n\n当对共享规则的一部分角色、地区、公共组、用户和账户所有权进行大量更改时，它们可能会自动触发规则重新计算。这种重新计算可能需要很长时间才能运行，尤其是在\
  \ LDV 场景中，并影响性能，但也可能导致超时。\n\n对于这些情况，建议进行所有更改并将规则重新计算推迟到稍后时间，也许是在用户离线或组织负载较低的相对时期。推迟共享规则计算只是推迟共享规则的自动计算，并在您完成工作并准备好让计算运行时需要手动干预。此功能默认不可用，您需要联系\
  \ Salesforce 客户支持才能在您的组织中使用它。\n\n### 组成员资格和共享计算\n\n共享计算通常有组来授予用户访问权限。Salesforce\
  \ 中的组可以是单个用户，也可以是特定角色或层次结构中的另一组用户。Salesforce 中的组用于设置默认共享访问权限、与用户共享记录等等。请参阅此链接以了解有关\
  \ Salesforce 中组的更多信息：https://developer.salesforce.com/docs/atlas.en-us.securityImplGuide.meta/securityImplGuide/users_group_member_types.htm。\n\
  \n### 细粒度锁定\n\n就像在主子关系中更新子记录时，系统会自动锁定父记录以防止数据完整性问题一样，在进行角色或组成员资格更新时，整个组成员资格表都会被锁定。无论更新是通过\
  \ API 还是使用前端进行的，都会发生这种情况。当正在进行大量更新（如 LDV 场景中）或其他正在更新角色或组成员资格的集成正在运行时，您可能会收到无法获取锁的错误。\n\
  \n细粒度锁定允许组维护操作继续进行，只要正在更新的角色和组之间没有层次结构或其他关系。这种并发性允许大量更新快速发生，同时防止任何锁定错误。\n\n### 更新与\
  \ upsert 操作\n\n在插入或更新操作中，一行会根据记录 ID 或外部 ID 简单地插入或更新。然而，对于 upsert，平台必须确定记录是否已存在，并基于该查询的结果，要么执行插入，要么执行更新。建议不要使用\
  \ upsert，尤其是在 LDV 场景中，因为这可能会导致相当显著的性能下降。\n\n### 汇总字段 (RUP)\n\n在进行 LDV 迁移时，您还可以推迟创建任何\
  \ RUP 字段，直到数据加载完成后。这是因为，在数据加载到系统时，如果您有多个 RUP 字段，平台会尝试在数据加载过程中计算它们，因为它们几乎是即时计算的。为了减少性能减速的可能性，建议在所有数据成功迁移后再推迟\
  \ RUP 字段。\n\n我们可以采取多种措施，以确保 Salesforce 中的 LDV 可以在不必过度担心性能的情况下处理。关键是从一开始就为性能和可扩展性设计。性能问题不会一夜之间出现，而是糟糕的设计选择或架构疏忽的结果，这些问题随时间累积并影响组织中的性能。通过适当的规划和架构设计，可以避免这些问题，并向用户交付可扩展且高性能的解决方案。\n\
  \n并非所有数据都需要导入 Salesforce，有些用例中数据可以继续驻留在外部系统中，但按需提供给用户。这就是 Salesforce Connect 和外部对象发挥作用的地方。让我们更详细地讨论它们。\n\
  \n### Salesforce Connect 和外部对象\n\n我们在 LDV 部分简要讨论了外部对象，但让我们在本部分深入探讨。Salesforce Connect\
  \ 是一种点击式解决方案，可在不需要编写复杂代码或需要中间件来跨系统移动数据的情况下，将外部系统与 Salesforce 集成。数据从外部系统按需查询并提供给\
  \ Salesforce 中的用户。这样，您可以轻松集成 Oracle、SAP 或 Microsoft 等 ERP，以及支持 OData 协议的几个其他系统。\n\
  \n### OData 协议\n\n**开放数据协议** 的缩写是 **OData**，它是一种用于集成不同系统或数据库的标准。OData 协议允许轻松使用互操作的\
  \ RESTful (REST) API。OData 的标准化是其优势，因为您不必担心不同系统的格式。由于源系统和目标系统都支持 OData 协议，这意味着它们可以使用事先商定的数据格式轻松通信。\n\
  \n通过使用利用外部对象的 Salesforce Connect，用户不仅可以从源系统读取数据，还可以写入、删除和更新数据。我曾见过它用于查询和显示存储在 Azure\
  \ 数据库中的订单履行数据。外部对象就像自定义对象。\n\n\n\n\n### 连接方式\n\n使用 Salesforce Connect 有多种方式，其中之一是使用\
  \ OData 连接器。让我们简要回顾一下每种方式：\n\n- **OData 适配器**：OData 2.0 或 4.0 适配器可用于与支持该协议的系统进行集成。常见的用例是同时使用\
  \ Microsoft SharePoint 和 Salesforce 的组织，并希望在 Salesforce 中显示 SharePoint 数据。由于 Microsoft\
  \ 支持 OData，您可以在不编写任何代码或进行任何测试的情况下集成这两个系统。\n\n- **自定义适配器**：可能存在 OData 适配器无法满足要求且需要自定义解决方案的情况。在这种情况下，Salesforce\
  \ Connect 提供了使用 Apex Connector Framework 编写自定义适配器的灵活性。这不如 OData 适配器使用的点击式解决方案快速，但仍能提供更大的灵活性以满足业务需求。\n\
  \n了解了 Salesforce Connect 的一些使用方式后，让我们看看外部对象的优势。\n\n### 外部对象的优势\n\n外部对象是任何架构师工具箱中的强大工具，因为它们提供了许多优势，包括以下几点：\n\
  \n- **易于设置**：可以使用 Salesforce 中的 UI 设置外部对象，无需任何编码技能。这可以大大节省时间，也使得没有编码技能的 Salesforce\
  \ 管理员可以轻松设置与外部系统的集成。\n\n- **数据虚拟化**：外部对象提供了一种虚拟化数据的良好机制。这意味着您可以将数据存储在外部系统中，并在用户需要时随时为用户提供数据。Salesforce\
  \ 中的存储成本高昂，外部对象可以用于为用户提供数据，而无需在 Salesforce 中存储数据。\n\n- **读写操作**：外部对象不仅能从外部系统读取数据，还能将数据写回源系统。这是一项强大功能，使\
  \ Salesforce 用户可以在无需离开 Salesforce 的情况下更新另一个系统。\n\n- **实时数据**：外部对象的另一个优势是数据可按需获取。每当您打开与外部对象关联的标签页时，就会向端点发出\
  \ REST 调用，并实时返回结果。对于用户需要立即获取但数据托管在外部系统中的用例，这是一项巨大的优势。这消除了对中间件工具的需求，用于跟踪已移动和/或等待移动到目标的记录；也就是说，它消除了系统间同步的需求，因为数据永远不会存储在\
  \ Salesforce 中，而是实时获取。\n\n- **标准功能**：外部对象在自由文本搜索、记录视图和列表视图等功能方面存在一些限制，这些将在“外部对象注意事项”部分中讨论。由于用户习惯于\
  \ Salesforce 中熟悉的 UI，这使得用户更容易利用外部对象的数据。\n\n- **移动数据**：外部对象的数据也可在移动设备上使用。因此，您的用户不仅限于在桌面前查看数据，而是可以在有内部连接的任何时间、任何地点访问外部对象。\n\
  \n让我们现在看看使用外部对象的一些注意事项。\n\n### 外部对象的注意事项\n\n由于外部对象提供了一种虚拟化数据的方式，在某些情况下类似于自定义对象，因此在使用外部对象之前需要考虑一些限制。这些限制包括以下几点：\n\
  \n- **标准功能有限**：大多数自定义对象提供的标准功能不适用于外部对象。例如，工作流规则、审批流程、记录类型、字段历史记录跟踪和注释不适用于外部对象。这就是为什么非常清楚您要实现的业务需求和业务目标至关重要，因为外部对象可能无法满足要求，其他选项可能更合适。\n\
  \n- **自定义字段有限**：自动编号、货币、公式和主从关系等自定义字段不适用于外部对象。同样，如果您计划使用 RUP 字段进行汇总摘要计算，它们也不适用于外部对象。\n\
  \n- **报告注意事项**：外部对象也有报告注意事项。由于数据从外部系统实时获取，报告运行可能需要一段时间。外部对象也不支持交叉筛选器。运行包含外部对象的报告时，会向外部系统发出回调，该回调计入允许的总回调限额。例如，对于\
  \ Enterprise、Performance 和 Unlimited 版本，一小时内可发出 20,000 个 OData 回调。\n\n在决定为您的解决方案使用外部对象之前，请仔细考虑外部对象的限制。有关限制的完整列表，请参阅\
  \ Salesforce 的此链接：https://help.salesforce.com/articleView?id=sf.platform_connect_considerations_reports.htm&type=5。\n\
  \n我们已讨论过，外部对象是我们工具包中的有用工具，可在无需中间件或编写代码的情况下使数据在 Salesforce 中可用。虽然 Salesforce 是一项强大功能，但请仔细审查您的用例以及外部对象的限制，以确保您的业务需求能够通过外部对象得到充分满足。\n\
  \n现在，我们将回顾 big objects，这是 Salesforce 的另一项功能，可用于存储数亿条记录。\n\n### big objects 简介\n\n\
  标准和自定义 Salesforce 对象旨在容纳数十万到数百万条记录，但组织生成新数据的速度呈指数级增长。Salesforce 客户也不例外，数据生成速度很快。最初并未针对大量数据设计，标准和自定义对象的限制正在达到，迫使客户寻找其他非\
  \ Salesforce 选项。管理大数据具有挑战性，因为它需要专门的技能和专用基础设施来有效管理。\n\n认识到这些挑战及其客户的业务需求后，Salesforce\
  \ 几年前推出了 big objects 功能。big objects 可以存储数百万条记录，可达到 10 亿条及以上。然后，这些数据可以在 Salesforce\
  \ 平台上或通过任何外部应用程序访问。big object 架构与大多数人熟悉的主 Salesforce 平台不同。big objects 运行在非关系型数据库架构上，这允许更大的可扩展性和一致的性能。\n\
  \n正如我们在本章前面所见，非关系型数据库不用于事务性操作，而是针对大容量存储进行了优化。big object 架构也不例外，具有插入和检索数据的专门方式。常规\
  \ SOQL 查询与 big objects 配合使用效率不高，因为查询会超时，因此使用 Async（异步）SOQL 来查询 big object 数据。\n\n\
  简要介绍完毕后，让我们现在回顾 big objects 的优势。\n\n### big objects 的优势\n\nbig objects 功能有助于解决客户在该功能出现前面临的特定问题。让我们尝试了解\
  \ big objects 的优势：\n\n- **最终用户体验**：如果您的组织中对象中有数百万条记录，且用户开始抱怨报告、列表视图缓慢或 Apex 进程运行时间过长，big\
  \ objects 可能是值得考虑的选项。您可以将旧数据从平台卸载到 big objects 中，从而提高 SOQL 性能，这转化为内部和外部用户的更高满意度。\n\
  \n- **学习曲线**：尽管 big objects 在创建和使用 Async SOQL 中的索引方面有其自身特点，但您可以使用 API 或 UI 创建 big\
  \ objects 并使用 Async SOQL 查询数据。Async SOQL 与 SOQL 非常相似，如果您已经掌握 SOQL，过渡到 Async SOQL\
  \ 并不太困难。\n\n- **低成本存储选项**：与平台上的存储相比，big objects 是存储大量数据的更便宜的选择。一旦您建立了流程并配备了自动归档数据的工具，您就可以放手不管，无需担心性能或购买更多平台存储的审批问题。Salesforce\
  \ 还使用 big objects 在 `FieldHistoryArchive` 对象中存储字段历史记录数据。该对象可以存储长达 10 年的字段历史记录数据。\n\
  \n- **分析**：报告大量数据可能具有挑战性，但使用 big objects，使用 Async SOQL 可以使工作更容易。将 big object 数据汇总到自定义对象中，可以使用户使用\
  \ Salesforce Report Builder 和仪表板等熟悉的工具进行分析。此外，**Einstein Analytics (EA)** 支持 big\
  \ object 数据，因此您可以使用 EA 的功能快速可视化数据。\n\n\n\n\n\n- **集成**: 大型对象与**平台事件 (PE)**协同工作，这是一个巨大的优势，因为您可以简单地发布事件并在大型对象中消费它。例如，每当报价获批并转换为订单时，您可以使用\
  \ PE 发布订单详情，并在大型对象中插入记录，供 EA 报表使用。\n\n- **审计和合规数据**: 对于那些产生海量数据且需为审计或合规目的保留特定时间的行业，大型对象提供了很大的灵活性。数据保留在高度安全的\
  \ Salesforce 数据中心内，且解决方案可扩展，因此组织无需担心将数据从大型对象迁出。\n\n现在，让我们来看看大型对象的一些注意事项。这些都很重要，因为在设计处理大数据的解决方案时，理解并考虑这些因素可能会影响您的解决方案选择。\n\
  \n### 大型对象的注意事项\n\n与任何事物一样，在决定使用大型对象时，有几个架构方面的注意事项需要牢记。其中一些如下：\n\n- **SOQL 和 Async\
  \ SOQL**: 使用 Async SOQL 可以更有效地处理大型对象。这是因为这些对象是以特定方式创建的，常规 SOQL 查询未针对大型对象进行优化。\n\n\
  - **无 UI**: 与标准对象和自定义对象不同，一旦您为大型对象创建了元数据，就没有 UI 界面可供用户前往处理大型对象。您需要自行创建自定义 UI，可使用\
  \ Visualforce 或 Lightning 组件。\n\n- **大型对象数量**: 您被限制创建 100 个对象，且每个对象中可创建的字段数量也有限制。您可创建的字段数量取决于您组织的许可证类型。例如，如果您拥有\
  \ Performance 版，可在大型对象上创建 800 个字段，而 Enterprise 版则允许 500 个字段。\n\n- **Salesforce Connect**:\
  \ 大型对象不支持使用 Salesforce Connect 和外部对象。这意味着您无法将数据存储在大型对象中并将其拉取到 Salesforce。\n\n- **一致性优先于可用性**:\
  \ 大型对象旨在存储数十亿条记录，其架构设计是优先保证一致性而非可用性。这里的一致性是指，在多节点系统中，每个节点都会提供完全相同的响应，而可用性则确保所有节点都会提供响应。\n\
  \n由于大型对象架构偏好一致性，在使用 API 处理大型对象时，请确保您有重试机制，以重写完整的批次，直到收到 API 的响应。从实际角度来看，这意味着，与其他数据库事务不同，平台或您的代码无法执行回滚，大型对象中没有回滚，因此必须为完整批次设置重试机制。\n\
  \n- **沙箱**: 创建沙箱时会复制大型对象。但是，数据不会复制，因此您需要自己填充沙箱。\n\n- **字段**: 与您在标准对象或自定义对象上可以创建的各种字段不同，大型对象在可创建的字段类型方面存在限制。截至撰写本文时，支持以下字段：\n\
  \  - 日期/时间\n  - 查找关系\n  - 电子邮件\n  - 数字\n  - 电话\n  - 文本\n  - 长文本区域\n  - URL\n\n这是一个重要的注意事项，因为如果您打算为（例如）数据归档目的部署大型对象并将数据从平台卸载，则需要考虑在数据存储到\
  \ Salesforce 之前可能需要进行的任何字段转换。另一个重要注意事项是，大型对象不支持 CreatedDate、LastModifiedBy 和 CreatedBy\
  \ 等标准字段。\n\n- **加密**: 如果您存储的是已加密的敏感数据，大型对象当前不支持该功能，标准对象或自定义对象中的任何加密数据在大型对象上都将以明文形式存储。\n\
  \n- **自动化工具**: 大型对象旨在支持海量数据，因此触发器、流程和流程构建器等功能不支持在大型对象上使用，因为这些功能用于促进事务系统的业务流程。而且，大型对象架构不打算用作事务系统。\n\
  \n- **安全性**: 取决于您的用例，在考虑使用大型对象时，这是另一个需要牢记的重要注意事项，因为其安全选项有限。您可以强制执行对象级和字段级权限，但不支持共享规则。这意味着您需要仔细分析如何将平台上的用户访问权限映射到大型对象。\n\
  \n- **报表**: 由于大型对象面向海量数据，目前不支持搜索、报表和仪表板。但是，您可以使用 Async SOQL 汇总大型对象中的数据，并将其移动到平台上的自定义对象。然后，您就可以像使用任何其他标准对象或自定义对象一样进行搜索、创建报表和构建仪表板。\n\
  \n在回顾了大型对象的注意事项之后，让我们来看看大型对象的一些用例。\n\n### 大型对象的用例\n\n一般而言，只要您拥有大量且无需用于事务或分析目的的活跃数据，大型对象都是一个不错的选择。关键在于了解业务的要求，包括数据所需的频率、分析、安全性以及数据的访问方式。让我们来看看大型对象的一些用例。\n\
  \n### 法规要求\n\n法规要求通常要求建立健全的审计机制。审计哪怕少量字段也会产生大量数据。Salesforce 限制可启用审计历史记录的字段数量是有充分理由的。例如，仅凭单个机会记录就能产生海量数据，更不用说其他对象创建的记录了。\n\
  \n不同的监管机构对组织需要保留数据的时间有不同的要求，因此组织需要将其归档，并在审计发生时随时可用。银行和医疗行业受到严格监管，对数据保留和检索有严格要求。大型对象可以轻松满足这类组织的需求，因为它们可以水平扩展，而无需客户在其端执行任何额外操作，同时还能避免对最终用户造成任何性能影响。\n\
  \n### 归档\n\n鉴于 Salesforce 是多租户环境，对可用存储量有限制。使用标准对象和自定义对象，您可以轻松存储数百万行数据，但平台上的额外存储空间很昂贵。大型对象是将数据从主平台卸载以释放空间的好选择，也是一种更经济的存储方式。\n\
  \n大型对象的优势在于无需任何昂贵的集成工作即可在 Salesforce 中直接使用。您无需担心身份验证或行级安全性，而且无需再担心集成问题，因为大型对象消除了这些对任何集成都至关重要的因素的需求。\n\
  \n您可以安排报表频繁运行（例如按季度），以确定是否存在未更新且适合归档的特定数据。将主平台存储视为活跃使用或引用的数据应驻留的主要区域，而大型对象则是不太频繁使用的数据或出于合规目的需要保留的数据应驻留的次要区域。Salesforce\
  \ 中的任务就是一个这样的示例，任务使用频繁且记录创建速度快。与其删除旧任务，不如简单地将其归档，并用于趋势分析和报表。\n\n### 360 度客户视图\n\n\
  组织需要尽可能全面地了解客户。客户与企业数字资产的所有接触点以及与企业的任何离线交互都是营销的重要信息来源。这可能会产生大量数据，尤其是在零售行业，而将所有这些数据存储在\
  \ Salesforce 平台上很快就会耗尽存储空间。\n\n客户现在寻求个性化体验，这可以基于预测分析提供。通过将数据汇集到一个集中位置并利用 Salesforce\
  \ Einstein Analytics，您可以根据客户偏好提供个性化优惠，或根据其购物历史在一年中的特定时间发送特别优惠。\n\n\n\n\n随着使用 Salesforce\
  \ 的客户产生前所未有的数据量，大数据正在成为现实。在阅读本节讨论后，您应该对处理这种超大数据量的可用策略和工具更有信心。\n\n### 摘要\n\n我们首先讨论了数据库的类型，以概述现有的数据库。我们都知道，Salesforce\
  \ 平台在很大程度上建立在关系型数据库之上，更具体地说是 Oracle 数据库，但 Salesforce 生态系统中的并非所有内容都托管在关系型数据库上。\n\n\
  关于如何判断是否处于 LDV 场景的讨论，希望在您下次遇到类似情况时，能彻底评估可能导致 LDV 场景的各种因素，即使未达到百万记录的粗略阈值也是如此。此外，LDV\
  \ 的注意事项不仅对 LDV 场景很重要，其中一些讨论也与常规数据迁移和集成相关。我知道防止 LDV 场景这一节标题颇具挑衅性，但其背后的想法是，存在防止 LDV\
  \ 场景的方法，同时也承认当您拥有 500 万个账户记录和 700 万个联系人记录时，这可能并不总是可行。即使您处于 LDV 场景中，也并非一无所有，因为 Salesforce\
  \ 提供了许多优化 LDV 操作的选项。\n\n我们还研究了 Salesforce Connect 和外部对象。依我之见，这可能是使用率最低的集成选项之一。诚然，外部对象缺少我们习惯用于标准对象和自定义对象的功能，但它们是一项功能强大的特性，可以大幅缩短构建生产就绪集成所需的时间。大对象是另一项相对较新但拥有多个稳健用例的功能。下次您考虑归档或释放空间时，请考虑使用大对象，因为它们易于使用，并且可以与\
  \ Salesforce Einstein 配合使用，这使得数据对 Salesforce 用户来说更加易于访问。\n\n总之，在深入探讨这些话题后，您应该对在\
  \ Salesforce 环境中处理大数据话题更有信心。您已了解 Salesforce 中各种可用选项的最佳用例，并结合您的业务需求，在仔细权衡每个可用选项的优缺点后，您将能够轻松做出良好选择，决定采用哪个选项。\n\
  \n在下一章中，我们将讨论常规数据迁移实践、一些可用的工具，以及 Salesforce 为集成和数据加载提供的 API。\n\n### 问题\n\n1. **精密打印（PP）**\
  \ 正在实施 Salesforce 并使用 SAP 的订单管理模块进行订单履行。由于订单位于 SAP 中，销售团队无法访问订单状态数据。PP 的架构师可以推荐什么来满足此要求？（选择一个答案。）\n\
  - a) 实施一个中间件工具，当 SAP 端发生更改时，该工具可使用订单状态数据更新 Salesforce。\n- b) 开发一个点对点集成，使用 Salesforce\
  \ API，并在 SAP 中订单状态更改时更新数据。\n- c) 配置 Salesforce Connect 并使用外部对象在 Salesforce 中更新数据。\n\
  - d) 雇佣一名数据录入员，在 SAP 中订单状态更改时在 Salesforce 中输入数据。\n\n2. 几年前，PP 启动了一个新的 B2C 部门，拥有超过\
  \ 1,000,000 个账户记录的全球客户群。PP 在此对象上运行着多种自动化工具，包括多个触发器、流程构建器和流程。过去几周来，用户一直在抱怨报告运行时间过长，以至于某些报告需要超过一分钟才能完成。数据架构师可以提出什么建议来纠正此问题？（选择两个答案。）\n\
  - a) 考虑在对象上使用自定义索引，并通过与 Salesforce 客户支持开立案例来探索使用瘦表。\n- b) 将触发器合并为单个触发器以遵循最佳实践。\n\
  - c) 删除一些账户记录，以便数据库需要读取的记录更少。\n- d) 分析并从报告中删除一些未使用的列。\n\n3. **全球自行车和电动滑板车（GCS）**\
  \ 是一家面向全球骑行爱好者销售自行车和电动滑板车的 B2C 企业。该公司有兴趣将 **机会** 字段历史记录保留在 Salesforce 提供的 18 个月（通过\
  \ API 可达 24 个月）以上，并通过 Einstein 报告使数据可用。该公司不感兴趣购买允许其保留字段历史记录长达 10 年的额外功能。架构师在这种情况下可以推荐什么？（选择一个答案。）\n\
  - a) 将数据导出为 **逗号分隔值（CSV）** 文件，并将 CSV 文件存储在外部存储设备上。提供 CSV 文件以便用户可以基于它们进行报告。\n- b)\
  \ 制作一个自动化流程，将 18 个月以上的数据归档到大对象，并使用 Einstein Analytics 进行报告。\n- c) 创建一个 Microsoft\
  \ SQL 数据库，并将数据归档到其中。使用 Microsoft 报告工具对数据进行报告。\n- d) 将数据从 **机会历史记录** 表迁移到自定义 Salesforce\
  \ 对象，并使用 Salesforce 报告对数据进行报告。\n\n### 延伸阅读\n\n- *数据存储的未来仍是（依然是）磁带*: https://spectrum.ieee.org/computing/hardware/why-the-future-of-data-storage-is-still-magnetic-tape\n\
  - *Salesforce 围绕数据构建*: https://engineering.salesforce.com/salesforce-is-all-about-data-d6fdf57cc8eb\n\
  - *在 Salesforce 中管理查找偏斜以避免记录锁定异常*: https://developer.salesforce.com/blogs/engineering/2013/04/managing-lookup-skew-to-avoid-record-lock-exceptions.html\n\
  - *适用于 Salesforce Connect 的 Salesforce 兼容性注意事项——所有适配器*: https://help.salesforce.com/articleView?id=sf.platform_connect_considerations_compatibility.htm&type=5\n"
- "## 常规数据迁移的 8 个最佳实践\n\n数据迁移是 Salesforce 管理员、开发人员和架构师常被要求完成的任务。了解如何最佳地处理数据迁移的最佳实践，可以确保避免代价高昂的错误，并使数据迁移完整且准确。\n\
  \n在本章中，我们将讨论可用于数据迁移的一些工具及其优缺点。大多数情况下，对于大型和复杂的数据迁移，会使用第三方工具，因为 Salesforce 提供的标准工具可能足够，但在精力方面并不十分高效。\n\
  \n在本章后半部分，我们将简要介绍 Salesforce 在数据迁移和集成环境中提供的不同 API。您将了解 API 的一般架构以及 API 的理想用例。由于本书关于数据，且大数据量用例变得越来越常见，我将比其他\
  \ API 更详细地讨论 Bulk API。\n\n本章涵盖的主题包括：\n\n- 评估数据\n- 准备阶段\n- 执行阶段\n- 将数据加载到 Salesforce\
  \ 的工具\n- 了解 API\n\n### 评估数据\n\n在任何企业中，数据都是关键，并且增长迅速，导致使用各种数据库和数据存储来安全地存储这些数据。有时数据格式不同，需要进行处理以统一格式，避免混淆。但在深入讨论数据之前，让我们先了解数据迁移、转换和集成之间的区别：\n\
  \n- **数据迁移**：数据迁移是将数据从一个系统或应用程序移动到另一个系统或应用程序的过程。这通常是退役旧系统并升级到提供改进业务功能的新系统的结果。随着越来越多的企业从本地系统迁移到云基础架构，他们意识到数据必须随应用程序一起移动，以继续业务运营。\n\
  \n- **数据转换**：转换是将数据从一种格式转换为另一种格式的过程。每个应用程序都有自己遵循的一套标准，涉及数据格式、数据类型或字段长度。例如，在旧系统中，Opportunity\
  \ 对象的 Stage 字段可能是数字字段。在转换过程中，我们需要将这些基于数字的 Stage 值映射到 Salesforce 中基于文本的 Stage 值。这通常需要在数据加载到目标之前，在暂存区域进行一些转换工作。为了避免混淆数据转换和迁移，重要的是要了解，前者涉及数据转换，而后者更多地侧重于用于将数据从一个系统移动到另一个系统的流程和工具。\n\
  \n\n\n\n- 数据集成：这涉及将来自不同来源的数据合并，为用户提供统一视图。例如，某企业使用 Salesforce 作为其客户关系管理（CRM）工具，但使用\
  \ Systems, Applications, and Products (SAP) 作为订单履行工具。在没有任何自助工具让客户自行查询状态的情况下，销售代表需要知道订单状态，以便及时向客户通报。在此场景中，随着订单在\
  \ SAP 中经历不同阶段且状态发生变化，状态可以反映在 Salesforce 中。\n\n在厘清定义之后，让我们来看看评估数据迁移的必要性。\n\n### 数据迁移评估的组成部分\n\
  \n数据迁移不应仅仅是项目计划中的单一条目，因为它很复杂且需要仔细规划和执行。将其作为项目计划中的次要条目，无疑会在将迁移运行到生产环境时引发问题。相反，它应被视为任何项目的主要组成部分，拥有自己的详细进度、任务和依赖关系。\n\
  \n通过适当的评估，您可以评估现状并提供现实的时间和预算估算，从而确保高质量的数据迁移。让我们讨论一下稳健的数据迁移评估的几个关键组成部分：\n\n- 数据量：这通常是大多数项目团队在数据迁移讨论中首先考虑的问题。这是一个重要的考量因素，因为迁移\
  \ 50,000 条记录与迁移 1 亿条记录需要不同的方法。例如，API 的选择，是使用 Bulk API 还是 REST API，对于后者用例（迁移 1 亿条记录）而言更合理，而不是前者。\n\
  \n- 数据类型：另一个需要考虑的是您计划迁移的数据的类型和格式。例如，从旧系统迁移线索的工作量远小于迁移账户、联系人、商机和产品。这是因为旧系统中这些对象之间可能存在潜在关系，且字段的数据类型和格式各不相同。例如，如果旧系统中的\
  \ Stage 值与 Salesforce 中的不同，则需要投入更多精力。\n\n- **涉及的系统数量**：迁移涉及多少个系统——我们是将数据从一个源系统还是多个源系统迁移到\
  \ Salesforce？例如，在整合型数据迁移中，源系统可能是 Oracle NetSuite 和/或 Microsoft Dynamics，每个系统都有自己的数据类型和标准。将此类数据迁移到\
  \ Salesforce 会比简单地从 Oracle NetSuite 迁移数据复杂得多。这还可能需要在环境中引入一个暂存数据库，以便在将数据加载到 Salesforce\
  \ 之前进行去重和转换。\n\n- **隐私**：随着世界各地新隐私法规的出台和现有法规的修订，在准备阶段进行数据迁移时需要考虑哪些问题？离岸团队可以访问数据吗？数据迁移期间使用的基础设施应位于何处——可以位于隐私法律不够完善或未能有效执行的国家吗？所有这些考量都可能影响数据迁移项目的持续时间和成本。了解这些以及访问数据的任何限制（无论是基于客户要求还是出于合规原因），都将帮助您正确规划和应对这些要求。\n\
  \n- **数据保留**：旧系统中的并非所有数据都需要迁移到 Salesforce，但企业可能出于合规目的对数据保留有要求。项目团队需要与架构师和其他利益相关者合作，提供解决方案以确定保持合规的最佳方式，并为企业提供持续的数据访问。\n\
  \n- **资源可用性**：数据迁移绝非孤立的练习，即数据迁移团队离开、着手项目，然后带回一个成品，在生产环境中执行即可完美迁移数据。它必须涉及对数据了如指掌的业务资源，他们可以指导团队并验证数据迁移以及生产运行。提前了解业务资源限制有助于识别潜在风险，并提供采取有效缓解策略的机会。\n\
  \n- **当前环境**：这涉及评估所有待考虑的系统是位于云端还是本地。访问这些系统是否有任何特别注意事项，常规计划停机时间表在哪里？本地系统通常需要更多配置，因为需要访问内部网络。这还包括与迁移期间可能需要协助的任何第三方供应商资源进行协调。\n\
  \n- **沟通**：一个良好的迁移项目始终会有一个稳健的沟通计划，考虑不同利益相关者的需求以及他们喜欢的沟通方式。根据数据迁移项目的范围、复杂性和利益相关者的数量，沟通计划可能非常详尽。但这不应阻止您制定一个周密的沟通计划，因为它为其他利益相关者在项目期间如何保持最新状态以及对他们的期望提供了路线图。\n\
  \n- **文档化数据转换**：一旦您确定了源数据并将其字段映射到目标字段，请确保对此进行充分文档化。确保您已将源中的表映射到 Salesforce 中的对象，并将源表中的字段映射到\
  \ Salesforce 中的字段。此文档将成为日后可能因字段映射不正确而导致的任何问题的关键文档。它还构成所需转换的基础，并可供测试团队用来验证测试加载。\n\
  \n- **重复性练习**：应从一开始就明确，数据迁移是一项重复性练习。这意味着在执行阶段，需要进行多次迭代，以便团队对在生产环境中执行迁移感到放心。\n\n\
  - **数据质量**：数据质量问题是当今系统中的常见问题，几乎没有哪个系统能免疫。在将数据迁移到 Salesforce 时，需考虑源系统的数据质量问题。这将帮助您了解在将数据加载到\
  \ Salesforce 之前需要投入多少精力来清洗数据。由于数据用于决策制定以及（除其他外）自动化业务流程，因此源系统的数据质量在此评估阶段至关重要。\n\n\
  上述讨论并非旨在详尽无遗，而是列举了评估阶段的一些更关键方面。每个数据迁移项目都是独特的，正确评估需求并理解变量将提高成功数据迁移的可能性。\n\n现在让我们来回顾数据迁移的准备阶段。\n\
  \n### 准备阶段\n\n在此阶段，您将为下一阶段（即执行阶段）所需的一切做好准备。凭借上一阶段收集的大量信息，您已准备好采取行动，为成功的数据迁移做好准备。\n\
  \n让我们讨论适用于此阶段的最佳实践。\n\n### 最佳实践\n\n您已对当前环境、范围内的数据类型、源系统及其约束以及数据迁移的业务需求有了深入了解。现在是时候通过遵循以下描述的最佳实践来将所有这些付诸行动：\n\
  \n- **分析**：仔细分析评估阶段练习的结果。分析过程中跳过的看似微不足道的细节，日后可能会导致大量返工。例如，假设旧系统数据质量良好；如果没有与用户核实这一假设或对数据进行抽样验证，可能会导致数据清洗工作变得漫长且昂贵。\n\
  \n- **设置数据迁移环境和工具**：根据迄今收集的需求和已进行的分析，设置用于迁移数据的环境和工具。这将包括任何暂存数据库、数据清洗工具、去重工具、沙箱等。\n\
  \n- **测试计划**：这是准备阶段的一个关键方面，因为您需要清楚了解将测试什么（测试范围和要测试的用例）、如何测试以及在哪里测试（测试工具和适用的沙箱环境），由谁进行测试，以及测试的依赖项是什么。\n\
  \n- **外部 ID**：它们是您的得力助手，因此请利用它们来实现更轻松的数据迁移。外部 ID 不仅提供了一种跟踪源系统记录的方法，还提供了利用 Salesforce\
  \ 中 Upsert 功能的能力。\n\n- **尊重对象加载顺序**：这涉及确保在加载子对象之前先加载父对象。这意味着，如果您使用电子表格作为暂存区来转换数据，则需要先加载账户，然后才能加载联系人或商机记录。\n\
  \n- **硬编码 ID**：Salesforce 中的记录 ID 会随环境而变化，因此您应避免在加载中使用任何硬编码值。例如，沙箱中商机的记录类型 ID 与生产实例中的\
  \ ID 不同。如果必须存储 ID，请创建一个在运行期间引用的配置类型文件。这样，您可以在一个集中位置更新一次 ID，该 ID 可供所有运行引用。否则，在每个环境中移动时，您需要逐个更新行的记录\
  \ ID。\n\n\n\n\n\n- **记录所有权**：Salesforce 中的每条记录都有所有者，准备数据加载时必须牢记这一点。如果记录所有者缺失或无效，系统不会迁移数据。您的旧系统中可能存在所有者为前员工且在源系统中已停用的记录。您需要确保，如果这些记录在迁移范围内，提供适当的记录所有者姓名，以避免记录报错。\n\
  \n- **Salesforce 设置**：由于下一阶段将涉及运行迁移，请确保在 Salesforce 中已完成适当的设置。这将包括角色层次结构、配置文件、权限集、页面布局和选项列表值定义等内容。这是一个重要步骤。否则，在运行测试加载时，您将因目标组织中设置不完整而导致的错误（而非数据迁移过程本身）而陷入困境。\n\
  \n- **沙盒更新**：在进行项目工作的同时，日常业务运营仍在继续，这意味着应持续进行以修复和增强为形式的更改，且其他项目也会不断应用到生产环境中。请务必考虑到这些，并与您的\
  \ Salesforce 团队协调，确保应用到生产环境的更改也同步应用到项目沙盒。这样可以防止在共享环境（例如 UAT 沙盒）中运行干运行时，因配置和代码库不同而出现意外情况。\n\
  \n- **禁用业务逻辑的能力**：您可以选择在数据加载到目标时让业务逻辑应用到数据上，但不建议这样做。最佳实践是在 Salesforce 外部转换数据并应用任何业务规则，然后将最终数据集加载到\
  \ Salesforce。这有助于提升性能并降低遇到数据相关问题的可能性。不过，采用此方法时，您需要确保声明式以及基于代码的自动化逻辑都内置了禁用标志，这些标志可在加载时轻松禁用。这些标志应在引入功能时作为设计的一部分构建，但如果不存在，则在运行生产迁移前应评估是否有必要加入它们。\n\
  \n- **直接从源头读取**：尽可能直接从源头读取数据。这是因为每个中间系统都有自己的格式化和存储数据的方式，数据在通过这个中间层时可能会导致数据丢失。例如，当数据从源系统导出到\
  \ Microsoft Excel 时，包含数字的文本字段可能会转换为带小数的数字字段，或者列中的前导零有时会被丢弃。这可能导致数据加载到 Salesforce\
  \ 时出现错误。\n\n- **错误处理**：当直接从源数据库拉取数据时，如果（例如）将 Salesforce 中新记录的 ID 写回到源表，将大大简化重新运行迁移流程。这样，在下一次运行时，您只需筛选出\
  \ Salesforce ID 列未填充的记录并重新运行即可。一般而言，无论数据源是什么，都要确保有处理错误的计划和重新运行的能力，因为重试是不可避免的。\n\n\
  - **备份数据**：在此阶段，您还需确保已建立数据备份，并且已测试相应的恢复流程，以便在需要恢复数据时使用。不要低估这一步骤，因为无论是否属于您的责任，丢失客户数据都是最糟糕的情况。请确保客户知晓并拥有适当的备份流程，并且已在恢复场景中测试过这些备份。\n\
  \n根据我的经验，这通常是最匆忙的阶段，因为我们都希望尽快进入执行阶段。请确保为该阶段分配足够的时间，因为仓促进行此阶段会导致问题并需要重新做工作。\n\n在下一部分，我们将探讨任何数据迁移项目的核心——执行阶段。\n\
  \n### 执行阶段\n\n这是“纸上谈兵”见真章的阶段，也是之前阶段所有工作接受检验的阶段。到本阶段时，您将对所处理的范围、数据类型、假设和约束有良好的了解。让我们讨论一下可以在本阶段应用的最佳实践。\n\
  \n### 最佳实践\n\n您的映射文档已准备就绪，将要使用的工具以及任何暂存数据库也都已就绪，准备迎接那关键时刻。您迫不及待地想要点击 **运行** 按钮，看看使用一些初步数据的首次干运行效果如何。要说明的是，此处的执行阶段是指在沙盒环境中运行数据加载，而不仅限于生产运行。我们将在后续部分讨论特定的生产环境运行。以下是一些可以提高本阶段成功率的最佳实践：\n\
  \n- **从小批量开始**：先从小批量加载开始，在尝试大批量加载之前先解决任何问题。这样可以在逐步完善代码或调整迁移工具配置以修复任何问题时，将重新验证批次所需的工作量保持在合理范围内。\n\
  \n- 遵循步骤：到现在为止，您应该已经有一份部署文档，列出了运行干运行所需的步骤，并附有生产运行所需额外步骤的说明。在测试并进一步调整代码和迁移工具时，请确保文档保持最新。每次运行干运行时都要遵循本文档中的步骤。这将确保文档保持最新，并在您为\
  \ UAT 的最终全量加载做准备时不断完善文档。\n\n- 重复规则：禁用在 Salesforce 中设置的所有重复管理规则。这些规则可能是您正在使用的 Salesforce\
  \ 原生功能，或者如果您使用的是第三方解决方案，则是该工具设置的规则。您不希望加载因重复规则而报错，任何此类问题都应在数据加载到 Salesforce 之前在\
  \ Salesforce 外部处理。\n\n- 禁用自动化：在运行加载之前，请确保已禁用任何相关的自动化，例如触发器、流程构建器和工作流。同样，任何类型的数据转换都应在加载到系统之前在\
  \ Salesforce 外部完成。\n\n作为执行阶段的一部分，关于沙盒测试还有一些特定的最佳实践。让我们在下一部分回顾这些内容。\n\n### 沙盒测试\n\
  \n无论加载看起来多么 _简单_，我都不建议直接在生产环境中运行。始终先在沙盒中运行，了解它在生产环境中可能的运行情况，并始终验证结果。以下是一些与沙盒测试相关的最佳实践：\n\
  \n- 可恢复的沙盒：数据迁移是一个重复性的过程，您会发现自己运行了多次测试加载，直到准备好进行 UAT 测试。设置沙盒需要时间，特别是考虑到 Salesforce\
  \ 对某些类型沙盒刷新频率有限制。例如，如果您使用的是 Developer Pro 组织，可以隔天刷新一次。如果您需要在同一天修复并重新运行测试加载，您将会受到限制。\n\
  \n为避免遇到此类限制并节省重新设置环境的时间，请使用一个也能轻松恢复数据的数据备份工具。这还将消除对依赖拥有生产环境系统管理员权限的管理员进行沙盒刷新的需求。使用您的管理员凭据（假设已获授予），您可以轻松启动恢复，并在短时间内获得一个可用的工作环境。\n\
  \n\n\n\n\n- **全副本沙盒**：当您准备好进行UAT并让业务测试团队验证您的设置/代码时，请确保为此目的设置了全副本沙盒。在此类沙盒中运行完整迁移将提供一些非常有用的数据，例如，运行迁移在生产环境中需要多长时间。这是因为全副本沙盒具有相似（非相同）的硬件，且推断的结果通常对生产环境也有效。\n\
  \n另一个好处是，全副本沙盒与生产环境具有相同的数据，因此您正在使用一个与生产环境非常相似的环境。当然，如果这是绿地实施，则生产环境将没有任何数据，但在棕地实施的情况下，这可能是一个优势。\n\
  \n再次强调，无论数据迁移是简单还是复杂，沙盒测试都是必须的。对于较简单的迁移，这似乎是一个多余的步骤，但我认为花费时间和精力是值得的，而不是在棕地组织的情况下回头尝试在生产组织中恢复数据。\n\
  \n让我们现在回顾与生产运行相关的最佳实践。\n\n### 生产运行\n\n您已经进行了多次预演，并让业务测试在完整的UAT周期中验证了您的结果。是时候按下扳机并在生产环境中运行数据迁移了。此阶段的一些最佳实践包括以下内容：\n\
  \n- **生产冻结**：确保您已向其他利益相关者传达，生产环境的元数据应实行变更冻结。这是为了避免因未应用到沙盒环境的增强功能而出现任何问题。紧急修复无法避免，但如果存在任何非高优先级的紧急修复，建议将其推迟到您完全迁移数据之后。\n\
  \n变更冻结通常应在您迁移到全副本环境并在该处进行UAT测试时生效。为避免耽误其他项目或团队，请尽量缩短变更冻结与迁移生产运行之间的时间。我应该提到，对于较简单的迁移，可能不需要如此广泛的措施，但尽管如此，遵循这一做法以避免任何意外问题仍然是一个良好的实践。\n\
  \n- **备份数据**：在运行最终生产运行之前备份数据。理想情况下，您已经内置了回滚流程以应对生产运行失败的情况，但在因工具或其他原因无法做到这一点的情况下，在批量更改生产数据之前备份数据是明智的。明确地说，即使您的代码中内置了回滚机制，备份生产数据仍然是一个良好的实践。\n\
  \n- **运行时间**：需要考虑的另一个因素是运行的时间。当您在全副本沙盒中运行迁移时，您已经了解了迁移过程所需的总时间。考虑到这一点，您希望最大限度地减少对业务用户的干扰，并减少他们无法使用Salesforce的时间。在绿地组织中这不是问题，但对于拥有分布在多个时区用户的全球棕地组织来说，这是一个关键考量。在这些情况下，没有理想的停机时间。您希望选择一个对不同时区用户干扰最小的时间。\n\
  \n- **验证**：一旦迁移过程在生产环境中成功完成，请确保有业务用户可以验证加载的数据。这可以从对少量记录进行样本测试到预选更具战略意义的记录（即最新的账户）以及其他验证数据的方法，形式多种多样。请确保业务团队可用，并在被要求验证加载时清楚知道该做什么。\n\
  \n我们已了解数据迁移项目的不同阶段以及每个阶段应使用的最佳实践。现在让我们来看看一些可用于协助数据迁移过程本身的工具。\n\n### 将数据加载到 Salesforce\
  \ 的工具\n\n工具就是工具，有许多工具可用于完成工作。使用合适的工具会让工作更顺畅、更容易完成，而使用不合适的工具会导致问题并延长工作时间。例如，使用标准数据导入向导（DIW，属于标准CRM的一部分）来处理需要进行大量转换和错误处理的复杂数据迁移工作将无法正常工作，并且您很快就会遇到DIW的限制。\n\
  \n如今，有许多第三方工具可用，具有重试机制、错误日志记录等高级功能。现代中间件产品通常具有提取、转换、加载（ETL）组件，可用于迁移数据。但是，在本节中，我们将讨论标准DIW和数据加载器。\n\
  \n### 数据导入向导（DIW）\n\nSalesforce提供了一个名为数据导入向导的用户界面工具来导入数据。该工具可通过设置菜单访问。DIW的一些功能和限制包括以下内容：\n\
  \n- 可用于账户、联系人、线索和自定义对象。\n- 每次最多可导入50,000条记录。\n- 不能用于自动化导入过程。\n- 支持的对象数量有限，例如，`Product2`对象记录无法使用`DIW`导入。\n\
  - 不能直接连接到源系统以查询数据。\n- 使用Microsoft Excel **逗号分隔值（CSV）**文件作为导入作业的输入。\n\n### CSV文件\n\
  \n当导入带有特殊字符的CSV文件时，您可能会看到数据被导入但出现乱码字符。这是由于将文件另存为CSV时的编码方式所致。使用Microsoft Excel保存文件时，编码设置为特定于机器的ANSI编码设置。您也可以在文本编辑器中打开文件，然后将编码设置为UTF-8并以CSV扩展名保存。\n\
  \n如所述，您需要将负载分割为每次50,000条记录，因为DIW有限制，更不用说它支持的对象数量有限。DIW适用于最终用户需要访问将数据加载到Salesforce且需要一种直观方法的场景。对于更复杂的用例，则不使用或不考虑DIW。\n\
  \n### Salesforce 数据加载器\n\n这是一个客户端应用程序工具，可用于导入大量记录。它还支持来自文件或数据库连接的记录。数据加载器的一些功能和限制如下：\n\
  \n- 客户端应用程序需要下载并安装。\n- 每次最多可导入500万条记录。\n- 支持使用文件或数据库连接来导入数据。\n- 可以通过用户界面或命令行访问。\n\
  - 支持自动化导入过程。\n- 可用于将导入数据加载到DIW不支持的对象中。\n- 它使用SOAP API处理记录。它还支持使用Bulk API以进行更快的处理。\n\
  \nSalesforce数据加载器可用于从其他来源查询数据，但仅限批处理模式，而此模式进一步受限于仅支持Windows。非Windows用户无法使用批处理模式，也无法使用数据加载器的一些高级功能。\n\
  \n> **Java软件开发工具包（SDK）**\n> \n> 数据加载器要正常工作需要Java，以前Java会与数据加载器捆绑在一起。Salesforce已不再这样做，您现在需要安装开源Zulu\
  \ OpenJDK以确保数据加载器正常工作。这里有一个链接可以帮助您安装JDK：https://help.salesforce.com/articleView?id=installing_the_data_loader.htm&type=5。\n\
  \n对于较简单的数据迁移，数据加载器可能是一个可行的选择，但涉及多个通过父子关系或查找关系相关联的对象时，可能会很麻烦，因为记录需要手动关联。出于此原因，并且随着更先进工具的可用性，数据加载器不用于复杂的数据迁移。\n\
  \n在下一节中，我们将回顾数据迁移的核心，即Salesforce提供的API。有多种可选方案，每种方案本身都比其他API更适合某些特定用例。\n\n### 了解\
  \ API\n\nSalesforce的一个显著特点是其采用API优先方法。这意味着Salesforce内部团队专注于在设计和开发用户界面之前，先将一套丰富的功能构建到API中。这样做之所以重要，是因为它赋予Salesforce客户灵活性，以便在需要时使用自定义开发的用户界面。这在Salesforce\
  \ Experience Cloud中非常常见，一些客户倾向于使用Salesforce提供的标准模板，为其客户和合作伙伴提供自助服务体验，而另一些客户则构建完全由Salesforce用户界面驱动的完全自定义前端。\n\
  \n\n\n\n\nSalesforce 提供了多种用于不同目的的 API，例如操作页面布局、部署代码、查询 Einstein Analytics 数据，或用于操作数据的通用\
  \ API。在本节中，我们将讨论与数据操作相关的四种主要 API，这些 API 被视为核心数据 API。我将展示如何使用 SOAP 和 REST API 的详细步骤，因为它们比\
  \ Bulk 或 Streaming API 更常用。\n\n### The SOAP API\n\nThe **Simple Object Access Protocol\
  \ (SOAP)** 是一种行业范围内的标准协议，用于数据传输。它使用 **Web Services Description Language (WSDL)**\
  \ 来定义访问数据的参数，并支持 XML 格式。WSDL 用作 API 和消费者之间的正式合同；此 API 非常适合用于服务器到服务器的集成。\n\nSalesforce\
  \ 提供两种可与 SOAP API 一起使用的 WSDL——Enterprise WSDL 和 Partner WSDL。前者与组织的配置紧密绑定，应仅用于单个\
  \ Salesforce 组织。后者更通用，可用于与多个 Salesforce 组织集成。*Figure 8.1* 展示了外部应用如何使用 SOAP 访问 Salesforce\
  \ 资源：\n\n![](img/782d45700e093b3d82b348c0ccc8ccba_340_0.png)\n\nFigure 8.1 – 在 Salesforce\
  \ 中访问 SOAP 资源的关键步骤\n\n如 *Figure 8.1* 所示，WSDL 在客户端被使用，随后使用 WSDL 中的方法登录并检索会话 ID。一旦会话建立，就可以调用其他方法来查询数据或在\
  \ Salesforce 中运行 DML 语句。\n\n### The Bulk API\n\n这是一个用于查询和加载大量数据的 RESTful API。Bulk\
  \ API 是异步的，意味着只有在系统资源可用时才会进行数据处理。Bulk API 支持的数据格式包括 CSV、XML、JSON，以及用于摄取操作的二进制附件。要批量查询\
  \ Salesforce 中的数据，可以使用可检索多达 15 GB 数据的批量查询。\n\n批量作业可以串行或并行模式处理。串行模式未经优化，因为一次只处理一个批次，但并行模式（并行度）的操作已针对优化进行了处理，意味着在任何给定时间可以处理多个批次。您可能认为并行度越高，吞吐量就越大，但事实未必如此。实际上，如果架构设计不当，更高的并行度可能会适得其反并减慢进程。所使用的工具或运行进程的代码调优程度等因素也会影响并行度。\n\
  \n### Designing a Bulk API solution\n\n尽管 DIW 在幕后使用 Bulk API，但 Salesforce 没有提供用于处理该\
  \ API 的用户界面。您需要编写自己的客户端程序来使用它。此客户端可以是 C++ 或 Java 程序，或其他编程语言，然后调用 Salesforce 中的 Bulk\
  \ API。\n\n客户端创建 Salesforce Bulk API 作业，然后在该作业中创建批次，以便数据可以由 Salesforce 服务器以异步模式处理。客户端可以使用\
  \ API 提供的方法检查作业状态。客户端应用程序也可以在批次完成时检索结果，但也可以使用“监控批量数据加载作业”页面上的用户界面检查状态。Figure 8.2\
  \ 展示了处理 Bulk API 操作的主要步骤：\n\n![](img/782d45700e093b3d82b348c0ccc8ccba_342_0.png)\n\
  \nFigure 8.2 – 典型的 Bulk API 操作\n\nFigure 8.2 展示了使用 Bulk API 的主要步骤。创建一个作业，然后在其中创建批次。这些批次由\
  \ Salesforce 异步处理，并保存结果。客户端应用程序可以检索这些结果以检查批次状态。\n\n使用 API 删除数据时，会发生软删除，这意味着数据保留在系统中，如有需要可以恢复。Bulk\
  \ API 是唯一可以运行硬删除操作的 API，该操作会从系统中永久删除数据。另一个需要考虑的因素是，Bulk API 有其自身的 Governor 限制，这些限制与其他\
  \ API 不同。\n\n### Lock contention\n\n当操作正在进行且为保证数据完整性而锁定记录时，会发生记录锁定。与其他用于处理数据的 API\
  \ 一样，Bulk API 作业容易出现锁定问题，并可能导致作业失败或吞吐量降低。\n\n> **吞吐量**\n> 这是衡量性能的指标，用于衡量每秒可以处理多少条记录。吞吐量越高，作业性能越好。\n\
  \n锁争用可能发生的原因有多种，将如下讨论：\n\n- **主细关系**：当一个对象与另一个对象处于主细关系时，Salesforce 会锁定主对象以确保参照完整性。如果在不同批次的并行处理中插入了引用同一主记录的明细记录，则由于多个线程尝试锁定主记录，插入操作将失败。可以通过将属于同一主记录的明细记录放在单个批次中排序来防止这种类型关系上的锁定。这是因为，在并行处理期间，多个批次可能会尝试锁定同一主记录，从而导致锁争用。\n\
  \n### 参照完整性\n\n参照完整性是指关系中数据的一致性，例如，发票明细行项目对象将与以发票对象为主的主子对象存在关系。发票明细行项目各自引用发票记录 12345。如果记录\
  \ 12345 被删除，则五个发票明细行项目将成为孤儿记录。参照完整性可防止发生此类情况。\n\n- 查找关系：这些与主细关系非常相似，即如果尝试锁定正在查找的记录（目标），可能会出现锁争用，导致插入/更新操作失败。请使用上述描述的用于主细关系的相同技术来避免锁争用。\n\
  \n- 定义查找字段时，可以选择以下选项之一：\n  - i) 清除该字段的值。如果将此字段设为必填，则无法选择此选项\n\n  - ii) 不允许删除查找关系中的查找记录\n\
  \n  这可能看起来微不足道，但在大批量数据加载期间，查找定义中选择的内容可能导致加载失败。这是因为 Salesforce 对两者的处理方式不同。当选择前者（即清除该字段的值。如果将此字段设为必填，则无法选择此选项）时，Salesforce\
  \ 仅确保目标对象上的查找值存在。当选择后者时，它会锁定目标查找记录，可能导致锁争用情况。\n\n- 触发器：加载会触发触发器的记录时，触发器逻辑可能导致系统尝试锁定除触发器源记录以外的记录，从而引起锁争用。为避免锁争用，请禁用触发器，或在触发器代码中添加逻辑以避免此类情况。\n\
  \n- 工作流规则：当工作流规则触发字段更新且多个线程尝试锁定同一记录时，Salesforce 会锁定记录，可能会发生锁定异常；例如，尝试在多个线程中更新同一父记录的工作流规则会导致锁争用。为避免这些锁，请在加载前禁用工作流。\n\
  \n\n\n\n\n- 组成员锁：有少数操作会导致组织范围锁定。这意味着在这种情况下你不能使用并行处理，因为一旦在组成员表上获取了锁，除非释放锁，否则无法进行其他更新。这些操作如下：\n\
  \  - 添加分配给角色的用户\n  - 更改用户角色\n  - 将角色添加到角色层次结构或将地区添加到地区层次结构\n  - 从公共或个人组、角色、地区和队列中添加/删除成员\n\
  \  - 将账户所有者更改为新所有者，而此新所有者与原始账户记录所有者具有不同的角色。这适用于与之相关联的具有社区角色或门户角色的账户\n\n确保你的代码以这种方式执行，即组成员对象上的锁最小化，且其他代码不会导致锁延长。当组成员类型操作正在执行时，由于这些操作运行时的组织范围记录锁定，运行必须处于串行模式。\n\
  \n- 重叠运行：多个重叠的运行作业可能会导致 Salesforce 作为作业一部分运行的对象、代码和工作流规则上出现意外的锁争用。确保作业之间有足够的时间，以便前一个作业完全运行完毕后再运行后续作业。\n\
  \n- 汇总字段：当详细信息一侧的记录正在被更新时，主记录也会被锁定以确保汇总字段被更新。这可能导致锁争用，如果可能，在加载数据之前应将这些字段删除。如果不可能，那么考虑在详细信息对象上使用汇总报告（如果它拥有所需的所有数据）或跨越主记录和详细信息对象的报告。如果那不是一个选项，那么按主对象记录排序并避免在多个批次中出现相同的主记录。\n\
  \n由此可见，与其他 API 相比，高效使用 Bulk API 有许多需要考虑的问题，而且，通常与 Bulk API 相关的复杂性由利用该 API 的第三方应用程序抽象化。尽管如此，当考虑大量数据时，Bulk\
  \ API 仍然是数据迁移和集成的首选 API。\n\n### REST API\n\nREST API 是一个 Web 服务 API，可用于与 Salesforce\
  \ 中的数据进行交互。它被认为是一个轻量级 API，使用请求和响应框架，并广泛用于 Web 和移动应用程序。\n\n此 API 使用与 SOAP API 用于访问数据相同的底层\
  \ Salesforce 数据模型，并且与（也是基于 REST 的）具有其自身限制的 Bulk API 不同，REST API 的限制与 SOAP API 相同。\n\
  \nREST API 操作是通过与访问超文本传输协议（HTTP）方法（如 GET、HEAD 和 POST）的统一资源标识符（URI）进行交互来执行的。你可以使用这些\
  \ URL 执行查询、更新记录或在对象上运行描述操作。图 8.3 显示了基于 REST 的应用程序如何与 Salesforce 中的资源进行交互和访问资源的关键步骤：\n\
  \n![](img/782d45700e093b3d82b348c0ccc8ccba_346_0.png)\n\n图 8.3 – 使用外部应用程序访问 REST\
  \ 资源的关键步骤\n\nREST API 是一个广泛使用的 API，安全，并用于非数据密集型的轻量级应用程序。当与 OAuth 作为身份验证机制一起使用时，它比\
  \ SOAP 更安全，因为它消除了在客户端应用程序中存储任何凭据和令牌的需求。\n\n### 流式 API\n\n流式 API 用于自定义集成或近实时应用程序，不适用于数据迁移。此\
  \ API 基于事件驱动架构（EDA），意味着数据更新被发布到消息总线。这些更新的订阅者可以在其端消费该事件。这种方法与数据从系统中拉取的 SOAP 或 REST\
  \ API 方法不同。\n\n在 EDA 中，消息或事件被发布到中央位置；在此例中，它是**企业消息总线 (EMS)**，有兴趣的系统订阅它。每当发布事件时，它就会在总线上发布，所有订阅了它的消费者都可以使用它。这种架构将生成这些事件的系统与消费这些事件的系统解耦，从而形成可扩展的架构。图\
  \ 8.4 显示了 EDA 的工作原理：\n\n![](img/782d45700e093b3d82b348c0ccc8ccba_347_0.png)\n\n\
  图 8.4 – 事件驱动架构\n\n企业消息总线是流式 API 基于的技术的一部分。这称为 **CometD** 并使用消息总线来发布和订阅事件。流式 API\
  \ 有多种变体；其中最常用的两种是 **平台事件** 和 **变更数据捕获 (CDC)**。流式 API 的早期变体是 **通用** 和 **PushTopic**，两者都需要代码来发布或订阅事件。使用平台事件和\
  \ CDC，有更多灵活性，因为它们既由代码也由 Salesforce 中的其他声明式功能支持，例如 Salesforce Flow 或 Process Builder。\n\
  \n### CometD\n\n访问 CometD.org 网站了解 CometD 的功能和详细文档。\n\n在本节中，我们从数据角度回顾了四种最常用的 API，了解了它们的最佳用例以及它们的工作原理。我们详细讨论了\
  \ Bulk API，因为在处理大量数据时，它是首选 API，这是一个我们在 *第 7 章，使用大量数据* 中广泛讨论过的主题。\n\n### 摘要\n\n数据迁移是一个令人兴奋的话题，因为无论你是迁移\
  \ 1,000 条记录还是 1,000,000 条记录，都有某些你必须牢记的事项才能实现平稳的数据迁移。你所学到的与数据迁移不同阶段相关的最佳实践将帮助你在不遇到任何重大障碍的情况下进行成功的迁移。关键在于在跳入数据迁移的执行阶段之前花时间进行适当的分析。这将为你节省日后大量的麻烦和浪费的精力。\n\
  \n你还了解了适用于我们的数据迁移的标准 Salesforce 工具及其限制。如前所述，对于简单的迁移，这些可能就足够了，但对于复杂的迁移，有更复杂的第三方工具可用，能让工作变得更容易、更顺畅。\n\
  \n我们通过讨论 Salesforce 提供的 API 来结束本章。虽然 Salesforce 提供了许多其他 API，但我们涵盖了与数据迁移和集成相关的 API。你了解了每个\
  \ API 的一般架构以及如何使用它们，同时还详细讨论了 Bulk API。我们还在回顾流式 API 期间涵盖了 EDA，以及流式 API 如何支持可扩展性和近实时集成。\n\
  \n恭喜你读完最后一章！希望你在阅读时也学习了新概念和技术，可以用来为你的组织增加价值，并且玩得开心。\n\n### 问题\n\n1. **精密打印 (PP)\
  \ 最近收购了另一家公司，并希望将 CRM 数据迁移到其主 Salesforce 实例并停用旧版 CRM 系统。旧版系统拥有 700 万条记录。应该使用哪个 API\
  \ 将此数据加载到 Salesforce？(选择一个答案)**\n\n   - a) REST\n   - b) Streaming\n   - c) SOAP\n\
  \   - d) Bulk\n\n2. **Centauri Logistics 的 Salesforce 团队希望将外部短信通知系统与 Salesforce\
  \ 集成。当货物到达某个位置时，将向客户发送一条短信。司机到达位置时扫描位置特定的条形码。团队预计未来其他系统也可能对这些数据感兴趣。应该使用哪个 API 进行此集成？(选择一个答案)**\n\
  \n   - a) Streaming\n   - b) Bulk\n   - c) SOAP\n   - d) Metadata\n\n3. **PP 的团队一直努力工作，并设计了一个将\
  \ 700 万条记录加载到 Salesforce 的解决方案。他们启动运行，但立即遇到带有锁定错误的失败记录。团队感到困惑，因为 API 正在并行模式下运行。数据架构师可以提出什么建议来修复这些错误？(选择一个答案)**\n\
  \n   - a) 他们应该以串行模式运行加载。\n   - b) 他们应确保父记录和子记录在同一批次中。\n   - c) 他们应该切换到使用 SOAP API。\n\
  \   - d) 他们应该与 Salesforce 开立案例，请求支持向服务器分配更多 CPU 和内存资源。\n\n\n\n\n\n### 进一步阅读\n\n\
