- "## 4 Making Sense of Master Data Management\n\n## 4 梳理主数据管理\n\nIn the last chapter,\
  \ we looked at data management, its importance, and the different aspects of data\
  \ management. There are many types of data and not all of them are treated the same\
  \ way. This is especially true now, given that sources of data have been increasing\
  \ steadily over the last few years. Earlier data was mostly structured and easily\
  \ manageable, but with social data, machine-generated **Internet of Things (IoT)**\
  \ data, sound and video data, and much more, it is becoming increasingly important\
  \ to ensure that the data that is core to your business is identified and managed\
  \ properly. In this chapter, we will discuss **Master Data Management (MDM)**, different\
  \ types of MDM data, its attributes, and why MDM is important.\n\n在上一章中，我们探讨了数据管理、其重要性以及数据管理的不同方面。数据有多种类型，并非所有数据都以相同方式处理。这一点在当今尤其明显，因为过去几年数据来源稳步增加。早期的数据大多是结构化且易于管理的，但随着社交数据、机器生成的\
  \ **物联网 (IoT)** 数据、声音和视频数据等不断增加，确保对核心业务数据进行正确识别和管理变得越来越重要。在本章中，我们将讨论 **主数据管理 (MDM)**、不同类型的\
  \ MDM 数据、其属性以及 MDM 为何重要。\n\nWe will also be discussing the Golden Record – the much\
  \ sought-after record that accurately and comprehensively provides a single customer\
  \ view. Next up will be the MDM and CRM strategy and the different ways that you\
  \ can ensure that your **System of Record** and MDM can interface with each other.\
  \ We will close the chapter by discussing Customer 360, the suite of products from\
  \ Salesforce that tries to solve the MDM problem, along with other tools to deliver\
  \ a complete and accurate picture of the customer.\n\n我们还将讨论“黄金记录”——一种备受追捧的记录，能够准确且全面地提供单一客户视图。接下来是\
  \ MDM 与 CRM 策略，以及如何确保您的 **系统记录源** 与 MDM 能够相互对接的不同方法。我们将通过讨论 Customer 360 来结束本章，这是\
  \ Salesforce 提供的一套产品，旨在解决 MDM 问题，并借助其他工具提供客户的完整准确图景。\n\nThe topics covered in this\
  \ chapter include the following:\n\n本章涵盖的主题包括：\n\n- Understanding master data\n\
  - 了解主数据\n- The Golden Record\n- 黄金记录\n- MDM and CRM strategy\n- MDM 与 CRM 策略\n-\
  \ Customer 360\n- Customer 360\n\nBy the end of this chapter, you will have a solid\
  \ understanding of master data, its importance, and why the Golden Record is critical\
  \ for data management and for organizations in understanding the customer's relationship\
  \ with the organization. You will understand the correlation between the MDM and\
  \ CRM strategy and the suite of tools that Salesforce provides to help achieve these\
  \ business goals.\n\n本章结束时，您将对主数据、其重要性以及“黄金记录”对数据管理和组织理解客户与组织关系的重要性有扎实的理解。您将理解 MDM\
  \ 与 CRM 策略之间的关联，以及 Salesforce 提供的用于帮助实现这些业务目标的工具套件。\n\n### Understanding master\
  \ data\n\n### 了解主数据\n\nIn this section, we will first start with the definition\
  \ of master data, the need to identify and manage master data, and the different\
  \ types of master data. This is going to help us in our later discussion of the\
  \ Golden Record and in the MDM and CRM strategy sections.\n\n在本节中，我们将首先从主数据的定义、识别和管理主数据的必要性，以及主数据的不同类型入手。这将有助于我们稍后讨论“黄金记录”以及\
  \ MDM 与 CRM 策略部分。\n\nSo, let's dive right in and define master data.\n\n那么，让我们直接开始并定义主数据。\n\
  \n### What is master data?\n\n### 什么是主数据？\n\nMaster data can be defined as the data\
  \ that describes the core entities of the business. This can include customers,\
  \ suppliers, locations, leads, and so on. A good indication of whether a data element\
  \ is master data is to review its use across multiple business functions, processes,\
  \ or systems in the organization. For example, leads that funnel into the marketing\
  \ team, once qualified, will flow down to the sales team. Once a deal has been won,\
  \ the same lead, which is now a customer, will flow down to sales operations and\
  \ in this instance, eventually into the ERP's contracts module as a customer. Sharing\
  \ master data eliminates the need for each function to maintain its own list and\
  \ facilitates uniformity across business areas.\n\n主数据可定义为描述业务核心实体的数据。这可以包括客户、供应商、地点、线索等。判断某个数据元素是否为主数据的一个良好指标是，检查其在组织内多个业务职能、流程或系统中的使用情况。例如，线索进入营销团队，一旦合格，就会流向销售团队。一旦交易成交，同一个线索（现在是客户）就会流向销售运营，并在此示例中，最终作为客户流入\
  \ ERP 的合同模块。共享主数据消除了每个职能维护自己的列表的需求，并促进了业务领域之间的统一性。\n\nWe should note that master\
  \ data is owned by the organization and not by a particular business function or\
  \ department. This is important because master data requires stewardship, and this\
  \ sets the context to communicate the right mindset in the organization, implying\
  \ that everybody is responsible for master data. Otherwise, specific area or data\
  \ specialists are left to clean up the data and ensure its accuracy, while users\
  \ creating the data don't feel the same level of ownership and accountability.\n\
  \n应当注意，主数据由组织拥有，而非由特定业务职能或部门拥有。这一点很重要，因为主数据需要数据管理，这为在组织中传达正确的心态设定了背景，意味着每个人都对主数据负责。否则，特定领域或数据专家将不得不清理数据并确保其准确性，而创建数据的用户则不会感受到同样的所有权和责任感。\n\
  \n### The need for master data management\n\n### 主数据管理的必要性\n\nWe established in\
  \ earlier chapters that the volume of data has been growing and organizations are\
  \ finding it challenging to keep pace with the volume as well as the sources of\
  \ data. A typical organization will have dozens of different systems spread out\
  \ and with their own proprietary data formats and ways to allow access to data.\
  \ This is especially true for large organizations that are siloed and don't have\
  \ effective master data management tools and processes in place. This can lead to\
  \ the following challenges:\n\n我们在前面章节中已经确定，数据量一直在增长，组织发现很难跟上数据量及其来源的步伐。典型的组织会分布着数十个不同的系统，拥有自己的专有数据格式和数据访问方式。这对于数据孤岛严重且没有建立有效的主数据管理工具和流程的大型组织尤其如此。这可能导致以下挑战：\n\
  \n- **Data governance**: Master data management and data governance go hand in hand.\
  \ You cannot implement an effective data governance strategy unless you have identified\
  \ and fixed any issues with master data. For example, a company has five **Customer\
  \ Relationship Management** (CRM) systems across three regions as a result of acquisitions\
  \ over the years. Some of the customers exist in multiple CRMs, with slight differences\
  \ in addresses, phone numbers, and so on. Unless you can identify which is the most\
  \ accurate and comprehensive record, enforcing data governance rules will not make\
  \ a difference.\n\n- **数据治理**：主数据管理与数据治理密不可分。除非您已识别并修复主数据中的任何问题，否则无法实施有效的数据治理策略。例如，一家公司因多年来的收购，在三个地区拥有五个\
  \ **客户关系管理 (CRM)** 系统。某些客户在多个 CRM 中存在，地址、电话号码等略有不同。除非您能识别出哪个是最准确、最全面的记录，否则执行数据治理规则将不会产生任何影响。\n\
  \n- **Reporting**: In the example stated in the previous point, how do we know who\
  \ our high-value customers are if they have the same names, but with slight variations.\
  \ For example, is Precision Printers LLC the same as Precision Printers Inc or PP\
  \ Inc? Another example is if we have, say, five subsidiaries of a company but they\
  \ are not identified as related to each other via an account hierarchy, and that\
  \ knowledge sits in someone's head. Unless that person is around, we may be duplicating\
  \ our marketing efforts and wasting time and money sending the same marketing brochure\
  \ five times.\n\n- **报告**：如前一点所述的示例，如果高价值客户名称相同但略有变化，我们如何知道他们是谁？例如，Precision Printers\
  \ LLC 是否与 Precision Printers Inc 或 PP Inc 相同？另一个示例是，如果一家公司有五家子公司，但它们未通过账户层级被识别为相互关联，且相关知识只存在于某个人的脑中。除非该人在场，否则我们可能会重复营销努力，浪费时间和金钱，五次发送相同的营销手册。\n\
  \n- **Integrations**: Integrations can become challenging when there is no consistent\
  \ and accurately identified master data because, in a downstream system, which record\
  \ are we going to send? For example, downstream call center software requires customer\
  \ contact information. Based on the caller's phone number, the application matches\
  \ it with the customer information sent by the upstream system and displays it to\
  \ the call center agent, along with support levels and some other pertinent information.\
  \ The customer contact information is held in CRM, but also manually entered in\
  \ the ERP system. If we haven't defined which system is the source of truth and\
  \ has the most accurate customer data, chances are we will be sending the incorrect\
  \ customer contact to the call center system unless we incorporate additional logic\
  \ in the interface that can send the correct information to the downstream system.\n\
  \n- **集成**：当没有一致且准确识别的主数据时，集成可能会变得具有挑战性，因为在下游系统中，我们将发送哪个记录？例如，下游呼叫中心软件需要客户联系信息。根据来电者的电话号码，应用程序将其与上游系统发送的客户信息进行匹配，并将其以及支持级别和其他相关信息显示给呼叫中心坐席。客户联系信息既保存在\
  \ CRM 中，也在 ERP 系统中手动输入。如果我们没有定义哪个系统是事实来源且拥有最准确的客户数据，那么除非我们在接口中加入额外逻辑以向下游系统发送正确信息，否则我们很可能会将不正确的客户联系信息发送到呼叫中心系统。\n\
  \n\n\n\n\n### 下游和上游系统\n\n在集成语境中，下游和上游分别指目标系统和源系统。例如，如果某 ERP 将产品数据馈入 Salesforce CRM，而\
  \ Salesforce 与呼叫中心系统有集成，那么从 Salesforce 的角度来看，ERP 被视为上游系统，呼叫中心系统是下游系统。\n\n- **客户服务**：如前文所述的呼叫中心示例中，客户服务差可能是缺乏有效主数据管理的直接后果。在此场景下，如果客户致电，而呼叫中心软件将其匹配到错误的客户名称或优先级，客户与呼叫中心的体验将不尽理想，如果软件显示的\
  \ SLA 不正确，可能会导致客户不满。\n\n- **实现收入目标**：想象你去一家大型量贩店购买笔记本电脑，却发现店内的价格标签与你收到的传单价格不同。通常，商店会按照传单上的价格进行匹配，但你是否曾想过这最初为什么会发生？这很可能是印刷错误，但也可能是主数据问题。如果传单上的产品定价来源于与商店使用的不同系统，就可能出现定价不一致。现在想象一下，如果传单上的价格本不应低\
  \ 20%，公司就损失了收入，对于大宗商品商店来说，这很容易转化为数十万美元甚至更多的损失。\n\n- **维护和增强客户信任**：缺乏有效的主数据及其周围的控制会导致客户信任降低。例如，由于缺乏有效的主数据管理实践，各分支机构通过为相同的零部件和维修服务提供不同价格来达到销售目标，从而侵蚀了公司自身的业务。结果，客户信任度降低，当他们需要维修时，会致电三到五家不同的分支机构以获取最低报价。之所以会发生这种情况，是因为制造商一直在更新零部件定价并发送给经销商，而经销商则负责将其发送到各分支机构，分支机构再更新其费率表。有时，费率表几周都不会更新，导致定价不一致，从而给业务带来收入损失。\n\
  \n- **法规合规**：有效的主数据管理也可以防止监管报告和合规问题。例如，如果你没有建立有效的主数据管理流程来首先识别该人员的所有可能实例，那么在收到*被遗忘权*请求后，如何确保已有效删除该特定人员的所有数据？不遵守这些法规对组织来说可能代价高昂，不仅在底线收入方面，而且在声誉方面也是如此。\n\
  \n- **数据质量**：当数据存储在多个系统中并采用多种不同格式，且这些格式无法集成时，该数据的可用性会降低。建立有效的主数据管理实践可确保你的数据对用户来说始终可行且可信。数据质量的另一个方面是重复数据。建立主数据可确保你已处理重复项，并且正在访问唯一最准确的记录。例如，如果某业务职能在客户经过客户信贷团队审核后在\
  \ ERP 中录入客户，而销售团队也在 CRM 中录入同一客户，那么该数据必然会出现问题。通过主数据管理，你可以纠正这类问题并合并记录，从而实现良好的数据质量。\n\
  \n- **沟通**：当主数据识别缺乏一致性时，部门间的沟通可能变得困难。在产品型业务中这种情况很常见，一个业务部门称产品为某个名称，而另一个职能部门则倾向于用另一个名称来称呼它。\n\
  \n现在我们已经了解了主数据管理不当所带来的挑战，让我们来看看组织拥有的数据类型。\n\n### 数据类别\n\n关于主数据有多少种类型，一直有很多讨论。有人说是三种，有人说是五种，但无论如何，我们已经确定主数据对业务运营至关重要，并且通常分布在整个组织中，这意味着一个系统可能拥有所有客户联系人，而另一个系统可能拥有该组织销售的所有产品，而另一个系统可能拥有所有引用类型数据，包括货币等。典型公司将拥有以下五种数据类型：\n\
  \n- **事务数据**：这是由业务活动生成的数据，例如销售订单、报价单和发票。此数据对公司很重要，用于历史报告、分析、法律或法规合规目的。\n\n- **元数据**：这是关于数据的数据。在\
  \ Salesforce 中，这包括标准字段和自定义字段、工作流规则、触发器、报表定义、单点登录设置等。\n\n- **层次数据**：这是存储数据之间关系的数据；例如，科目表和组织层次结构。\n\
  \n- **引用数据**：这是定义一组有效值并被其他数据引用的数据，例如国家列表、货币、付款条件等。这也可能是由国际、地区或行业标准定义并在组织中使用的数据。\n\
  \n- **主数据**：这是企业内描述围绕其开展业务运营的业务实体的核心数据。此数据相对静态，不具有事务性质。通常，主数据涵盖的关键领域包括产品、客户、地点，以及由合同和权利组成的第四个领域。\n\
  \n### 了解引用数据和主数据\n\n引用数据是用于为组织中其他数据设置上下文的数据。例如，机会对象上的 Stage 字段与事务数据（机会本身）或机会可能使用的不同货币一起使用。货币、阶段、状态和国家都是引用数据的示例。引用数据不仅为事务数据（机会对象上的阶段）提供上下文，也为主数据提供上下文；例如，在产品上，一个用于识别产品是否处于活动状态的选取列表值，或者联系人对象上的\
  \ Salutation 字段。\n\n引用数据与主数据之间的一个关键区别在于，在理想情况下，前者不需要记录链接，这意味着相似记录的多个实例不需要被解决，而主数据则不然。在现实中，引用数据可能有多个来源；但是，应尽一切努力识别单一真实来源，以避免混淆和错误数据的泛滥。例如，客户名称（主数据）可能来自三个不同的系统，需要将其链接在一起以提供更清晰的数据图景。通常不需要为引用数据执行此操作，因为它更稳定且变化较少。这并不意味着引用数据没有相关挑战。引用数据可能来自组织外部，因此使用该数据的组织无法对其施加任何影响。例如，邓白街标（D&B）提供数据丰富服务。\n\
  \n它维护最新数据，集成后可以向 Salesforce 推送自动更新。例如，如果某组织将客户对象上的 **行业** 字段与 D&B 同步，而后者决定更改特定行业，这可能会对组织内部产生潜在的下游影响。\n\
  \n### 通过主数据管理解决问题\n\n此前，我们回顾了组织在未妥善管理主数据时面临的挑战。在本节中，我们将回顾一些示例，以便更清楚地了解主数据管理在哪些方面能发挥巨大价值。请记住，拥有\
  \ 50 个客户且以回头客为主的小型企业不需要广泛的主数据管理解决方案。这是因为，正如您将在下一节中看到的，它们不会面临相对较大组织或数据量不断增长的企业所面临的问题。然而，这不应被误解为小型组织不需要管理其主数据，而是说它们可能不需要大型组织所需的广泛工具和流程。在接下来的部分中出现的示例里，我们将重点关注客户数据，但其他主数据（例如产品）也存在类似问题。\n\
  \n### 重复数据\n\n这是一个常见问题，通常出现在**并购**场景中。当一家公司收购另一家公司时，除非被收购公司位于另一个大洲或处于不同的业务领域，否则大多数情况下，两家公司之间的客户会有重叠。例如，一家汽车经销商收购了同一地区内另一家经销商的三家分店。两家经销商都使用相同的\
  \ CRM，但公司现在必须处理冗余数据并决定如何处理。实施强大的主数据实践和工具可以帮助缓解这类问题。\n\n### 真实来源记录\n\n在 Salesforce\
  \ 中，如果共享模型没有经过深思熟虑，并且被锁定到销售代表在创建新客户之前无法搜索数据库中可能已存在的客户，这种情况很容易发生。结果，您可能会在 CRM 中看到创建的客户，例如\
  \ IBM、IBM Ltd.、IBM USA (Consulting)、IBM USA (Health) 和 IBM Healthcare Management\
  \ Solutions。\n\n\n\n\n\n### 数据标准化\n\n当存在多个 CRM 且，比如说，行业字段在每个 CRM 中有不同值，或者账户对象上的客户优先级字段在一个\
  \ CRM 中有高、正常、低，而在另一个 CRM 中有铂金、金、银时，这种情况很常见。\n\n### 层次结构\n\n当数据已在 CRM 或多个 CRM 中录入，但对定义客户账户层次结构未给予足够重视时，就会出现此问题。例如，一家大型全球公司可能在不同业务线下拥有数百家子公司。作为该全球品牌（包括其子公司）的主要供应商，一个组织如何确定该账户产生的总收入是多少？来自某个区域、某条业务线或某个销售区域的收入是多少？除非定义了某种恰当链接子公司与母公司的层次结构，否则得出这些数字需要大量手动工作。除此之外，层次结构还提供一些进一步的好处，包括：\n\
  \n- 收入机会：在 Salesforce 中，我们了解账户层次结构，但我想深入探讨层次结构的概念及其重要性。此前，我们探讨了层次结构如何帮助我们回答谁是我们的顶级客户等问题。某个区域或销售区域的顶级客户是谁？不过，层次结构的好处不限于此。\n\
  \n在拥有全面视图时，我们可以寻找机会，以及客户及其子公司可能承担的任何信用风险。例如，Precision Printers 是一家在 150 多个国家提供打印机和复印机的全球供应商，拥有\
  \ 47 家子公司。你正在与该公司谈判续签另一份 10 年合同，并注意到其中一家子公司在过去几年中一直持续订购大量复印机。你建议在合同中为该子公司包含一项特殊交易，即如果他们每年订购最低数量的复印机，则按折扣价提供。没有账户层次结构，这种洞察将无法实现。\n\
  \n- 产品洞察：鉴于可以存在多种不同类型的层次结构，包括产品、供应商和位置层次结构，为这些实体形成层次结构可以为业务带来益处。例如，产品层次结构可以帮助识别仅通过产品本身无法实现的洞察。例如，对于销售重型建筑机械并提供零件和维护服务的经销商来说，机器的斗式附件是一种产品，它汇总到轮式装载机（另一种产品），而轮式装载机又汇总到建筑机械类别。立即，您可以看到斗式附件与装载机及建筑机械类别的关系。\n\
  \n这些信息可以为我们提供关键问题，例如：我们是否应将斗式附件作为装载机的一部分销售，或者将其作为单独的附加组件销售是否有更多收入机会？我们的装载机与竞争对手的装载机相比如何？他们是否已将斗式附件计入机器的基础价格？\n\
  \n- 准确报告：另一项好处是，层次结构可以在系统之间提供比较基准。例如，在 ERP 中，您可能将斗式附件和装载机作为两种不同的产品，但在报价系统中，您将它们作为一种产品，价格相加得出列表价格。在您的商业智能（BI）工具中，您将两个销售区域中所有机器的价格相加，减去机器的平均全国成本，以得出每个区域的最终利润。您未考虑的是，制造商为将斗式附件运送到某个偏远区域而增加的附加费。这可能会导致数据偏差，从而影响您的销售和营销工作。\n\
  \n明确地说，创建和维护层次结构的工作也可以手动完成，一些公司确实如此，但这很乏味且容易出错。例如，您的数据团队从 ERP、CRM 和其他系统导入数据，然后转换数据以进行有效比较。使用\
  \ SDM，一旦设置完成，该过程即为自动化，MDM 工具承担原本由数据团队完成的繁重工作。但需要注意的是，拥有 MDM 并不能完全使组织免于人工干预，因为会出现数据管理员需要做出决定以确认记录匹配和合并的场景，但总体过程将更加高效。\n\
  \n在下一节中，我们将回顾有助于识别数据元素是否应被视为主数据的因素。\n\n### 决定哪些数据是主数据\n\n公司应非常关注识别什么才是真正的主数据，因为标准定义松散可能导致管理不那么有价值的数据，从而浪费精力和时间。某些类型的数据可以明确定义为主数据，例如账户和联系人，但其他类型的数据可能不那么明确。此处定义的标准在这些情况下将有所帮助，并应作为在您的组织中决定什么是主数据、什么不是主数据的指南：\n\
  \n- **行为数据**：当对数据子集进行分析以观察其与其他数据的交互方式时，即为行为数据。例如，在事务系统中，主数据与事务数据交互。例如，考虑客户购买产品（主数据），或合作伙伴请求添加新位置（主数据）。主数据与事务数据之间的关系可以视为动词/名词结构，其中事务数据构成动词，名词捕获主数据。在我们之前的示例中，购买产品的行为或跟踪合作伙伴添加新位置的请求将构成事务数据，相关记录也将是事务数据。主数据将是正在购买的产品或正在添加到系统中的位置。\n\
  \n- **生命周期**：主数据也可以通过对其执行的 **CRUD**（创建、读取、更新、删除）操作来描述。例如，出于确保主数据准确完整创建的需要，一些公司会制定严格的流程来创建客户账户。审查强调创建某些类型数据的业务流程有助于识别主数据。\n\
  \n- **基数**：基数是集合中元素的数量，如果集合中只有少数元素，则该元素为主数据的概率较低。例如，如果一个组织只有三个客户，那么在需要 MDM 解决方案的背景下，这将不被视为主数据。这并不降低客户的价值，因为它们对于任何企业生存都至关重要，但它有助于决定将哪些数据视为主数据。相比之下，拥有数千个客户和多个源系统的组织肯定可以使用\
  \ MDM 解决方案。\n\n- **生命周期长度**：与事务数据相比，主数据更稳定、波动性更小；例如，合同通常被归类为事务数据。一家从事为期 2 周管道工作的\
  \ HVAC（供暖、通风、空调）公司可能只是将其合同视为事务数据，但在与大型商业客户合作时，他们可能决定将其视为主数据。公司也可能决定将为期 2 周的工作视为主数据，仅仅是因为在日常业务中处理起来更容易，而不是将其分离出来。同样，工单估算可能被视为主数据，因为在处理回头客时它们能提供有价值的历史情报。\n\
  \n- **复杂性**：这是另一个有助于确定元素是否应被视为主数据的因素。元素越不复杂，越不太可能被视为主数据；例如，一家只生产一种通用校包并向 Walmart\
  \ 或 Target 等大型零售商供货的制造商，更关心现有包的数量而非类型及其他详细信息。由于只有一种类型和颜色，在主数据管理方面不需要管理太多内容。\n\n\
  - **价值**：这一类别略带主观性，将数据集是否应被承认为主数据的考量留给拥有它的实体。例如，如果公司认为无论持续时间和价值如何，所有合同都很重要，并对它们都高度重视，那么最有可能，合同将被视为主数据进行管理。\n\
  \n- **可重用性**：数据的可重用性通常是将一组元素作为主数据进行管理的驱动力。一个非常常见的例子是客户数据，因为公司致力于拥有客户数据的一致定义，并在组织内广泛使用。\n\
  \n现在我们已了解一些有助于识别数据元素是否为主数据的因素，在下一节中，我们将回顾 Salesforce 数据架构师面临的一个常见场景，即当组织中存在多个 Salesforce\
  \ 组织时，设计管理解决方案来管理主数据和事务数据。\n\n\n\n\n\n### 多组织场景\n\n在使用 Salesforce 的组织中，常见的情况是使用多个\
  \ Salesforce 组织，这可能导致对客户和其他数据的视图不完整。多组织场景可能是合并和收购的结果，或者是拥有众多销售和营销团队的大型组织，在这种情况下拥有独立的\
  \ Salesforce 组织是合理的。这里不是讨论多组织策略何时合适的地方，但决定采用多组织不应轻率对待。请参考 Salesforce 的一篇博客文章，其中详细阐述了此主题：https://developer.salesforce.com/blogs/developer-relations/2014/10/enterprise-architecture-multi-org-strategy.html。\n\
  \n如前所述，客户数据可见性不佳会导致销售和服务方面的机会错失。在销售方面，可能是组织中不同的销售代表使用互不连通的组织联系客户；同样，在提供服务时，分散的组织无法提供客户的完整视图，往往导致客户从服务代理那里获得相互冲突的信息。\n\
  \n在 MDM 场景中，多个组织可以接入 MDM 系统，以便处理来自不同系统的记录、清理它们，如果是共存型 MDM 实现，还可以将它们推送回源系统（我们将在后面讨论）。不言而喻，在没有\
  \ MDM 的情况下，仍必须实施流程和工具，以确保数据不仅仅是从一个组织移动到另一个组织，而是确保数据是干净的。\n\n但是，在系统架构中没有 MDM 的情况下，本节讨论的问题会显现出来，并且需要一个解决方案来确保业务顺利运行。在接下来的几个部分中，我们将回顾一些策略，以管理源于多组织场景的挑战，同时交付用于报告和分析所需的整合数据。然而，必须理解，虽然本讨论发生在主数据管理的背景下，但不应将其视为仅与主数据相关。在多组织场景中，您仍希望确保不仅主数据，而且事务数据都得到妥善管理。\n\
  \n### 主报告组织\n\n此方法需要将一个 Salesforce 组织指定为主报告组织，其中源组织的数据将汇总以供分析用途。图 4.1 以图表形式描绘了此方法：\n\
  \n![](img/782d45700e093b3d82b348c0ccc8ccba_145_0.png)\n\n图 4.1 – 主报告组织\n\n此主组织不会将数据发送回源组织和报告，而是用于获取单一客户记录视图。此方法的优点如下：\n\
  \n- 对源组织所需的更改很小，因为所有工作都在主组织中完成。\n- 它会产生一个专用组织，其中拥有用于分析目的的干净和整合的数据。\n\n此方法的一些缺点如下：\n\
  \n- 手动和自动化流程仍从源组织运行，无法受益于报告组织中存在的高质量数据。\n- 购买和维护另一个 Salesforce 组织会带来额外成本。\n- 集成组织所需的中间件会带来额外成本。\n\
  \n由此可见，由于需要维护额外的组织，这可能成本高昂，但它比其他模型具有优势。接下来，我们将查看父组织模型。\n\n### 父组织\n\n在这种安排中，将一个组织指定为主组织，用于业务流程和报告。子组织向主组织报告，数据在组织之间同步。前提是，在任何给定时间，所有组织中的数据都同步。此方法的一些优点包括以下内容：\n\
  \n- 所有业务处理的单一组织。\n- 子组织中也存在清洗后的数据，从而导致 MDM 和源系统中的数据一致。\n\n此方法的一些缺点如下：\n\n- 这涉及简单的同步，可能导致低质量数据在系统中流传。\n\
  - 为保持组织同步而产生的集成流程和工具的额外成本。\n- 可能需要为每个组织维护多个业务流程。\n\n如图所示，父组织和子组织之间的数据是同步的：\n\n![](img/782d45700e093b3d82b348c0ccc8ccba_146_0.png)\n\
  \n图 4.2 – 父组织模型\n\n此方法的最大好处是能够保持所有组织同步，但需要进行微调和分析，以确保自动化流程在组织之间运行。\n\n### 整合组织\n\
  \n此方法要求除一个 Salesforce 组织外的所有组织被停用，数据整合到主组织中。此方法的一些优点包括以下内容：\n\n- 提供客户的单一视图\n- 易于维护\n\
  - 通过整合各个组织实现成本效率\n- 对主组织进行有效的集中控制\n\n此方法的一些缺点包括以下内容：\n\n- 可能会更早达到组织限制。\n- 当业务用户移动到整合组织时，可能会对业务用户造成中断，尤其是考虑到\
  \ Salesforce 用户名是唯一的。\n- 它需要在整合组织中重新创建业务流程。\n- 大量数据需要多轮测试，以确保数据可以验证准确性和完整性。\n- 整合型项目在短期内风险高且成本高。\n\
  \n如图 4.3 所示，将一个组织指定为父组织，其他组织合并到其中：\n\n![](img/782d45700e093b3d82b348c0ccc8ccba_148_0.png)\n\
  \n数据从子组织迁移到父组织，随后将其停用\n\n图 4.3 – 子组织迁移到父组织，然后停用\n\n无论选择哪种方法，请确保在您的技术系统架构和业务优先事项的背景下考虑了每种方法的优缺点。如果报告和分析是关键，那么主报告组织模型可能更合适；而如果业务流程是优先事项，那么单一整合组织模型可能产生最大价值。\n\
  \n### 定义主数据管理 (MDM)\n\nMDM 是确保主数据在整个企业中协调的技术、工具和流程。它提供了组织和业务合作伙伴可用的数据的一致、准确和完整的视图。\n\
  \n在下一节中，我们将回顾在进行 MDM 项目时对内外部沟通有帮助的基本概念。清晰地理解这些概念将使您能够更精确地定义业务需求，并为选择适合您组织的最佳解决方案提供基础。\n\
  \n### 回顾数据质量基础\n\n在思考不良数据时，您脑海中会浮现什么？是 **电话** 字段中的值格式相同，还是下拉列表受到限制，无法输入其他值？您可能会对所有或大部分问题回答\
  \ *是*；确保数据一致且格式正确的这些做法通常被称为标准化和格式化。这些是现代 MDM 系统不可或缺的一部分。MDM 系统将允许您根据行业和业务实践为每个源系统定义标准。让我们更详细地回顾这些做法：\n\
  \n- **预防**：预防胜于治疗的格言同样适用于主数据，我们应该注意防止不良数据在最初被录入的机会。这些通常更容易实现，可以用于强制执行某些数据标准。例如，Salesforce\
  \ 中的验证规则可用于强制执行良好的数据录入实践，例如确保如果机会设置为 **已关闭/丢失**，则必须填写自定义 **损失原因** 字段。在此示例中，如果未输入丢失原因，而销售代表在将机会设置为\
  \ **已关闭/丢失** 后尝试保存机会，他们会收到错误。同样，Salesforce Platform 上非常常见的预防方法是使用下拉列表。当您选中了 **将下拉列表限制为值集中定义的值**\
  \ 复选框时，用户无法通过 **用户界面 (UI)** 或通过 API 添加新值。此的第三个示例是在字段中设置默认值，以便在用户未在字段中输入值的情况下，存在默认值。\n\
  \n- **审计**：管理数据的另一种方式是通过审计。审计通常用于频繁评估和改进数据质量，是管理主数据的一种有效形式。缺点是，审计是在数据已保存到数据库之后进行的，并且可能已被用于报告或集成等其他目的。但是，这不应阻止我们频繁审计数据，现有一些开箱即用的工具可用于此，或者\
  \ AppExchange 应用程序可帮助进行审计。例如，在 Salesforce 中设置重复规则后，您可以运行报告来检测数据中的任何重复项并采取适当措施。\n\
  \n\n\n\n\n**纠正**: 另一种在数据录入过程中常用的方法是纠正，但其使用频率低于预防，主要因为需要定义并一致应用规则。例如，线索对象上的自定义字段用于捕获正在处理线索的销售工程师，在转换时，它会被读取并输入到机会的**机会团队成员**相关列表中。一个简单的触发器，或更可取的是流程构建器流，可以用来完成此操作。另一个示例是，一旦机会设置为**已成交\
  \ - 已赢**，就将账户对象上的**类型**字段从**潜在客户**更新为**客户**。如您所注意到，需要为每种情况定义规则，并且至少在这些示例中，它们依赖于在其他地方存在某个值后才能输入正确值。\n\
  \n**去重**: 这是使用Salesforce的组织中常见的业务问题。这是因为CRM系统的性质决定了它必须拥有多个数据录入点进入系统。例如，考虑Web-to-Lead、营销工具以及销售代表将电子表格上传到系统，以及手动创建记录。所有这些都是进入系统的不同数据渠道。有时，即使是单一渠道也会导致重复；例如，当线索多次提交Web-to-Lead表单时，这可能会在Salesforce中创建重复记录。我们之前提到，如果Salesforce记录级访问安全性未正确设置且组织过度限制，且代表搜索账户并在系统中找不到它时，他们将创建一个新账户，从而建立重复记录。这假设系统中已经存在一条记录。\n\
  \n重复记录的一个关键挑战是重复记录可能具有众多变体，使得正确识别重复记录变得困难得多。例如，考虑地址为123 Main St, Detroit MI的**约翰·史密斯**联系人记录，第二条记录为地址Number\
  \ 123 main street, Detroit Michigan的**J·史密斯**，第三条为地址123 Main st, unit 7, Michigan的**约翰·S**。这些是重复记录还是不同的记录？仔细审查记录后，我们可以安全地得出结论，这些是重复记录，但你将如何定义规则，以便计算机软件在审查这些记录时能正确识别重复记录？如本示例所示，正确识别重复记录可能相当具有挑战性，尤其是当记录量达到数十万条时。\n\
  \nMDM解决方案的关键功能之一是识别和解决重复数据，因为这是实现主数据清洁和可信状态的关键步骤。这一关键功能在不同来源的数据汇总到MDM后立即启动。\n\n\
  此过程的第一步是识别重复项，也称为匹配。通常，有两种方法——确定性方法和概率性方法：\n\n- **确定性方法：** 在此方法中，寻找数据元素之间的精确匹配并分配一个分数。此方法通常会产生较少的匹配。如果捕获了唯一值，例如社会安全号码和社会保险号码，这是理想的选择，但考虑到这是机密数据，除非要求，否则客户不愿意共享它们。因此，最常用的字段包括电话号码、地址、电子邮件地址等等。此方法还引入了复杂性，因为要匹配的数据元素数量增加，这意味着需要更多的匹配规则。过多的匹配规则可能导致性能下降和昂贵的持续维护循环。\n\
  \n- **概率性方法：** 在此方法中，匹配基于多个标准，例如语音、出现的可能性和细微差别。此方法使用权重来计算匹配分数，并使用阈值来确定匹配。此方法在匹配记录方面更准确。它更适合可用于匹配的更广泛的数据元素集。\n\
  \n一旦记录被识别为重复项，下一步是合并重复项以创建黄金源，即单一事实来源。此阶段的关键挑战是哪些数据元素来自多条记录需要存续以形成黄金记录。这需要在MDM工具中构建一些*智能*，以确定哪些元素应该存续。\n\
  \n### MDM计划的关键要素\n\n理解MDM不是解决业务问题的技术方案至关重要。虽然它会有所帮助，但它不会解决所有问题。如果不认识到这一点，这种心态可能导致MDM项目失败。一旦我们实施了MDM工具，所有数据问题都会自行解决的想法根本不现实。一个强大的MDM计划具有必须实施和遵守的关键要素，以便组织的MDM投资继续产生效益并提供高投资回报率。\n\
  \nMDM计划策略的关键要素应如下：\n\n- **治理：** 这是一套指导组织机构、政策、原则和素质的指令，以促进对准确和一致主数据的访问。\n\n- **衡量：**\
  \ 这涉及设置**关键绩效指标**（KPI）来衡量和持续改进数据。\n\n- **组织：** 这定义了将形成数据管家、数据所有者以及治理委员会成员的人员和团队。\n\
  \n- **政策：** MDM计划应遵循的要求、政策和程序。\n\n- **技术：** MDM计划技术组件的选择、实施和管理。\n\n一旦组织定义了什么被视为主数据，下一步是实施MDM计划。实施MDM计划的关键步骤包括以下内容：\n\
  \n- **识别主数据来源：** 此步骤涉及识别所有主数据来源。这是一个关键步骤，应该彻底进行，因为毫不奇怪，可能有多个主数据来源，包括私有存储的Excel电子表格、Word文档等等。\n\
  \n- **识别主数据生产者和消费者：** 此步骤涉及了解谁生产数据以及谁是其消费者。生产者和消费者可以是IT系统或人。\n\n- **分析关于您数据的元数据：**\
  \ 此步骤涉及确定与主数据关联的属性及其含义。这可能是一个广泛的步骤，特别是如果分散的地区或业务领域对数据有不同的定义；例如，什么定义了组织中的客户，或者新客户何时成为现有客户，因为可能存在与客户是新客户还是现有客户相关的流程。可分析的主数据属性示例可能包括以下内容：\n\
  \n  - 属性名称\n  - 数据类型\n  - 允许值\n  - 约束\n  - 默认值\n  - 依赖项\n  - 数据所有者\n\n- **指定数据管家：**\
  \ 这些人理想情况下应对数据有深刻理解，并可以协助未来维护主数据。\n\n- **实施数据治理委员会：** 该组有权决定如何维护主数据、包含什么、保留多久以及如何授权更改。\n\
  \n- **开发主数据模型：** 这包括决定主数据的外观，包括其属性、大小和数据类型、允许哪些值等等；例如，在大型重型设备经销商中，零件部门偏好使用零件号来查找零件，而技术人员偏好使用旧零件号，因为他们记熟了，即使已经发布了取代旧零件的新零件号。\n\
  \n- **选择工具：** 这是您将选择用于数据清洗、转换和合并数据的工具的地方。这些工具将支持查找数据质量问题，例如重复项和缺失或不完整的数据。通常，这些工具还将具有版本控制机制，以跟踪主数据上的更改历史。\n\
  \n- **创建和测试主数据：** 一旦您选择了工具，下一步是创建主数据并对其进行测试。您希望从小数据子集开始，确保规则配置正确，并且生成的主数据集确实是所期望的。一旦您确认规则配置正确并生成所需数据，就可以开始加载其余数据。\n\
  \n### 创建主数据\n\n创建主数据涉及两个基本步骤：\n\n- **清洗和标准化数据：** 在开始清洗数据之前，您必须了解数据模型。您已将主数据的每个属性映射到源系统。一些数据清洗功能包括以下内容：\n\
  \n  - **规范化数据函数：** 确保字段具有相同的数据和一致的格式；例如，电话号码仅包含数字且不包含文本。\n  - **替换缺失值：** 插入缺失值、默认值，并利用Dun\
  \ & Bradstreet等服务来填补数据中的空白。\n  - **标准化值：** 将测量值转换为商定的系统，将价格转换为共同的企业货币，等等。\n  - **映射属性：**\
  \ 将联系人姓名解析为名和姓，并将“零件号（part #）”和“零件编号（part no）”移动到**零件号**字段。\n\n\n\n\n\n- 2. **匹配数据**：在此步骤中，您将匹配数据记录以消除重复项。此步骤需要大量的分析和考虑，因为您可能会不经意地丢失数据；例如，*John\
  \ C King* 和 *John King*（在人员账户设置中是完全不同的联系人）被视为相同，导致重要历史数据丢失。\n\n关键是对多个属性进行匹配，并建立一个算法来计算一条记录与另一条记录相同的可能性。当匹配分数较高并达到或超过阈值时，您可以肯定地说该记录确实是匹配的。\n\
  \n在下一部分中，我们将探讨不同类型的 MDM 实施模式，以及它们各自的优势和劣势。\n\n### 实施 MDM\n\n在本节中，我们将探讨如何实施 MDM 以及不同\
  \ MDM 样式的注意事项。MDM 中使用四种实施样式，主要取决于数据是由中央集线器控制，还是由数据源同步到集线器。之所以这一点很重要，是因为组织需要拥有单一真实版本。在\
  \ MDM 实施中，重点在于提高数据质量、建立数据治理规则，并确保数据易于管理且在各业务中可用。您选择的样式取决于您组织的性质、业务流程和公司目标：\n\n-\
  \ **登记簿样式**：此样式为多个系统中的记录分配全局唯一标识符，这些标识符随后可用于定义单一真实版本。该系统不会将数据发送回源系统，因此主数据继续通过源系统创建。它匹配并清理识别的交叉引用数据，并依赖源系统自行维护数据质量。当需要单一真实版本时，它使用引用系统来构建记录的完整图景。当您拥有大量源系统并希望尽量减少对源系统的干扰和重大变更时，此样式很有用。在需要记录的只读副本且不存在覆盖源系统中任何信息的风险，并且避免\
  \ MDM 集线器和源系统中数据重复的情况下，此样式也很有用。它提供了一种高效的方法来删除数据重复项并获得数据的一致视图。其低成本、相对快速的实施以及对源系统的最小更改，使其成为一个有吸引力的选项。下图展示了一种登记簿样式的\
  \ MDM：\n\n![](img/782d45700e093b3d82b348c0ccc8ccba_155_0.png)\n\n### 图 4.4 – 登记簿样式\
  \ MDM 实施\n\n图 4.4 显示用户正在向每个 CRM 读取和写入数据。从 MDM 指向 CRM 的细箭头描绘了 MDM 在接收到查询时必须执行的读取操作。\n\
  \n此样式的最大好处是源系统所需更改极少，因此可以在相对较短的时间内实施。\n\n- **汇总样式**：在此样式中，数据从多个系统汇总到中央 MDM 集线器。然后对其进行转换、清洗和匹配，从而产生单一真实来源（黄金记录），并将其提供给下游系统供其他系统使用。此样式通常用于报告和分析。汇总样式实施的示例如下：\n\
  \n![](img/782d45700e093b3d82b348c0ccc8ccba_156_0.png)\n\n### 图 4.5 – 汇总样式模型\n\n\
  如图 4.5 所示，MDM 集线器成为下游系统的单一真实来源。对黄金记录的任何更新也会写回源系统。但是，源系统不得操纵该主数据。\n\n顾名思义，这是一个非常复杂的过程，需要进行数据转换、清洗和匹配，并且需要大量测试。\n\
  \n- **共存样式**：此实施样式与汇总样式非常相似，但允许源系统对主数据进行更改。这意味着将黄金记录发回每个源系统，从而实现 MDM 与源系统之间的实时同步。共存样式在下图中描绘：\n\
  \n![](img/782d45700e093b3d82b348c0ccc8ccba_157_0.png)\n\n### 图 4.6 – 共存样式 MDM 实施\n\
  \n如图 4.6 所示，此样式与汇总样式实施非常相似，但此样式允许在源系统中直接进行更改的灵活性。\n\n在此样式中，源系统也会与 MDM 集线器一起更新，从而使跨系统的数据保持一致。缺点是任何数据错误也会在整个系统中传播。\n\
  \n- **事务/集中式集线器实施样式**：在此样式中，主数据集线器成为单一真实来源和记录系统，任何需要访问数据的系统都必须订阅集线器以获取最新数据。除集线器以外的系统不得创建或修改数据。相反，它们从单一来源（即集线器）获取最新数据。实施此样式需要资源和时间，因为删除功能以防止在源系统中创建主数据可能代价高昂且需要大量测试：\n\
  \n![](img/782d45700e093b3d82b348c0ccc8ccba_158_0.png)\n\n### 图 4.7 – 集中式集线器样式 MDM\
  \ 实施\n\n这种样式提供了更多控制和更清洁的数据，因为只有一个数据输入点，但实施成本高昂，并且会减少其他系统可能实现的效益（如果数据直接输入到相应系统中的话）。\n\
  \n无论您选择哪种 MDM 实施，您能做的最重要的事情之一就是彻底理解并定义您希望通过 MDM 实施来解决的业务挑战。清楚了解您希望通过 MDM 达到的最终目标至关重要，因为实施错误的样式并撤回可能代价高昂且令人沮丧。\n\
  \n在回顾了不同的 MDM 实施样式及其各自的优势和劣势之后，接下来，我们将探讨选择 MDM 解决方案的注意事项。\n\n### 选择 MDM 解决方案的注意事项\n\
  \n市场上有众多 MDM 工具，为您的组织选择最合适的工具似乎是一项艰巨的任务。我推荐的一个关键步骤是花时间，以相当详细的方式定义您希望通过实施 MDM 解决方案实现的目标。一个常见问题是，公司会立即开始选择\
  \ MDM 解决方案，而不真正了解他们正在尝试解决哪些业务问题，它如何与组织的短期和长期愿景相契合，以及路线图上的哪些其他项目可能会对 MDM 解决方案的实施产生重大影响。\n\
  \n确保您已定义并优先排序业务需求，这将帮助您稍后评估解决方案。这真的可以帮助您剔除供应商演示和销售话术中的花哨内容，并防止我所说的*花哨功能陷阱*，即解决方案选择委员会被那些锦上添花的功能所打动，而不是那些能为业务增加真正价值的核心功能。\n\
  \n通过制定解决方案选择计分卡，可以轻松避免这一陷阱，该计分卡根据优先排序的业务需求为每项所需的关键功能打分。例如，计分卡中一个重要的标准应该是易于维护，以及支持性。您不希望一个解决方案针对看似微小的问题就需要投入大量精力和专业技能，同时还要考虑供应商为该解决方案提供的支持类型。\n\
  \n在选择 MDM 解决方案时，我推荐以下一些关键功能和技术能力：\n\n- **集成连接器**：解决方案支持开箱即用的连接器以与不同应用程序（包括 Salesforce）对接非常重要，否则您可能会发现自己花费时间构建\
  \ MDM 接口。例如，解决方案是否有用于与 SAP 对接的连接器（以 Salesforce 术语来说，即通过点击操作），或者是否需要从头开始编写？\n\n-\
  \ **部署选项**：有些 MDM 解决方案仅提供本地部署或基于云的解决方案。请寻找能够同时支持两者并已将其集成的供应商。原因是由于主数据的特性，公司仍不愿将其主数据完全迁移到云端，混合方法可能效果较好。\n\
  \n- **多领域**：解决方案应支持多个领域，而不仅仅是一个或几个领域；例如，请确保解决方案可以支持产品、客户、位置以及其他已被识别为主数据的领域。\n\n\n\
  \n\n\n- **可扩展解决方案**：了解该解决方案在水平（即所支持的主数据性质）和垂直（即解决方案可支持的数据量）方向上的扩展能力如何。\n\n- **总体拥有成本（TCO）**：深入了解实施少量精选用例所需的投入，并随时间逐步构建解决方案。您的目标应是证明\
  \ MDM 的价值，这将有助于获得利益相关方的支持和意愿，以实施更多用例。增强 MDM 实施需要哪些技能？这些技能容易找到吗，还是高度专业化，因此成本高昂？\n\
  \n- **许可模式**：无论如何强调这一点都不为过，因为有些供应商会随数据增长而收取更多费用，因此在选择解决方案前，请务必进行容量规划练习，以了解您的存储需求类型。随着\
  \ MDM 规模的增长，您的许可将受到什么影响，是否存在需要了解的技术或合同限制？\n\n- **技术路线图**：了解解决方案的路线图及其未来几年的发展方向。确保其与您的\
  \ MDM 策略以及现有和未来的系统环境保持一致。\n\n- **架构模型**：如前所述，MDM 解决方案可实现的拓扑结构有多种（共存、整合、注册表等）。您希望确保所选解决方案支持不同的拓扑结构，而非将您锁定在特定拓扑中。这为您提供了更多操作空间，以便正确评估并选择最符合您业务需求的拓扑结构。它还使您能够在新收购中利用该工具，而该收购可能与您系统环境的复杂性相似。\n\
  \n- **支持性**：了解供应商如何支持其产品。鉴于 MDM 因其提供的关键服务而构成业务支柱，请询问服务级别协议（SLA）以及过去计划内和非计划停机（用于维护和修补）的详细信息。如果可能，查看现有客户的推荐，并询问对他们有效和无效的方面。\n\
  \n现在我们已经了解了选择 MDM 解决方案的一些标准，在下一节中，我们将介绍黄金记录、其重要性及其部分用例。\n\n### 黄金记录\n\n黄金记录，有时也称为单一客户视图，被定义为捕获有关数据元素所需所有必要信息的单个数据点。它是组织拥有的最准确的真实来源。例如，Acme\
  \ Inc.（一家假设公司）的客户记录可能存在于多个数据库中，而拥有那个*最*准确和完整的记录正是 MDM 所追求和期望的。\n\n基于业务规则的匹配方法论决定保留哪条记录和丢弃哪些记录。通常使用三种确定方法：\n\
  \n- **最近**：在此方法中，带有最新日期戳的记录被认为是最准确的，并被视为黄金记录。\n- **最频繁**：此方法定义，如果相同的信息存在于多条记录中，则该记录可被视为合格的幸存记录。\n\
  - **最完整**：此方法将字段完整性作为最可行记录的标准。\n\n使用这些幸存方法论的问题在于，它们更多依赖于数据的表面属性，而非对数据的深入理解。\n\n\
  例如，您可能有两条相似的客户联系记录，其中一条比另一条更新，但它有一个无效的电话号码。在这种情况下，选择最新的记录会导致黄金记录包含无效的数据元素。\n\n另一个例子是，假设同一联系人存在三个客户联系记录，其中两条被认为是最频繁的，因为它们具有相同的数据元素。假设两者都有无效的电话号码，而第三条记录（被认为不常见但具有有效的电话号码）会导致黄金记录拥有无效的电话号码。这些例子说明，同时使用可信的第三方数据源来验证和丰富您的数据也很重要。\n\
  \n### 为什么黄金记录很重要？\n\n虽然我们之前在主数据管理的背景下看过一些示例，但我还想在这里再看一个示例，以便我们了解黄金记录的重要性。假设一位名为\
  \ Tony Alex 的客户走进一家电子商店并购买了一台游戏机。支付设备费用时，他们提供的名字是 T Alex，以及他们的地址。回到家后，他们在商店网站上创建一个帐户，并使用全名注册以接收商店的更新和特别优惠。后来，商店决定给\
  \ Tony 邮寄一份特别节日优惠，但由于商店没有黄金记录，Tony 收到了两份特别节日优惠，一份寄给 T Alex，另一份寄给 Tony Alex。Tony\
  \ 只能使用其中一份，因为商店政策要求出示身份证，并且只有名称与身份证匹配的优惠券才被接受。\n\n这是一个只有两个输入点且导致此不一致的简单示例。如果 Tony\
  \ 还访问了网站以访问受限内容并提供了 Tony A 作为他们的名字，会怎样呢？那么将会有分布在不同数据库中的三条记录，我们该用什么来获得唯一的真实版本呢？在这个简化的示例中，我们只有一个人的记录，但在现实场景中，我们可能面临数十万或数百万条记录。在这个示例中，企业浪费了时间和宝贵资源，这些资源本可以用在其他地方，只是因为主数据不可靠。\n\
  \n到目前为止，我们从收入角度讨论了黄金记录的价值，但实现并维持拥有单一真实记录的状态，从监管角度来看也同样重要。诸如《一般数据保护条例》（GDPR）和《加州消费者隐私法案》（CCPA）等政策涉及消费者访问请求——消费者有权请求并接收组织持有的其所有数据的完整披露。如果没有良好的主数据管理实践来实现黄金记录，这根本不可能做到。不遵守这些法规可能会导致高额罚款和处罚，从而影响公司的利润。\n\
  \n### 黄金记录的反对者\n\n虽然黄金记录理念被广泛接受和实施，但如果不讨论一种反对观点，围绕它的讨论就不会完整，该观点认为追求黄金记录并非必要，且它是一个需要修订的有缺陷的概念。这是一个理论讨论，但尽管如此仍具有考虑价值。此论点的前提是基于存在封闭和开放**信息系统（ISes）**的基础。封闭\
  \ ISes 是组织自行开发或负责维护的系统，而开放 ISes 是由独立供应商开发和维护的系统。当今组织正从使用封闭系统转向开放系统，这意味着数据联合变得具有挑战性，因为数据的格式、结构和其他特征各不相同。除此之外，非结构化数据的额外来源也在出现，例如数字传感器、社交媒体和物联网设备。\n\
  \n在封闭 IS 中，组织精确了解数据，包括数据实体、属性及其在不同系统之间的依赖关系。集成相对容易构建，因为通过每个系统的数据模型已知很多信息。换句话说，数据可以通过利用集成系统的数据模型来轻松进行接口和联合。**数据联合**是指将来自多样化和分布式系统的数据带入单个数据存储，同时实施通用数据模型。\n\
  \n当今许多组织依赖本地和云系统的组合，并在各种系统中拥有各种类型的主数据，例如与客户、供应商和产品相关的数据，导致数据存储碎片化。当然，MDM 试图通过将所有这些数据集中在一个位置、去重并删除任何不一致来解决此问题，但系统数量不断增加（这些系统可能部分是**记录系统（SORs）**）的问题也使这些工作复杂化。此外，由于混合了同步和异步系统，或者在不同时间运行的自动化流程，数据联合也变得具有挑战性，并可能影响数据联合流程。\n\
  \n黄金记录方法指出的另一个缺陷是，它假设记录的单一真实版本，而忽略了记录的上下文信息或元数据。这是因为实现黄金记录涉及匹配和合并数据记录，这些记录对于保留该数据的上下文可能至关重要。\n\
  \n\n\n\n\n有人认为，上下文很重要，并适用于产生数据的业务领域，但在试图获得可供组织范围使用的“金色记录”时，我们正在牺牲该组织中那些业务孤岛曾经有用的重要上下文。金色记录的另一个假设是，尽管各个系统可能具有不同的数据模型，但有可能为数据共享开发单一数据模型。协调数据的这一想法构成了金色记录理念的支柱。\n\
  \n相反的观点认为，数据的含义是上下文相关的，并会随时间而变化。例如，MDM 系统中存在客户的金色记录，但客户是指进行购买的人、交付产品的用户，还是支付账单的人？因为这些可能是三个不同的人。这种上下文将存在于\
  \ CRM 和 **应收账款（AR）** 系统中。\n\n如果进行购买并将商品送到其地址的人是同一个人，但产品用户不同，在 MDM 中您将看到两条记录——一条用于进行购买或将商品送到其地址的人（因为他们会被匹配和合并），另一条可能用于产品用户，但在\
  \ MDM 中没有任何上下文。\n\n为了澄清这一点，另一个示例是将医疗数据用于患者诊断。假设患者数据（包括处方、住院记录、疫苗接种、过敏史以及其他自我报告数据，如体育锻炼和体温）存储在数据存储中。随后，它使用金色记录理念联合到下游诊断辅助系统，该系统由医疗提供者用于查看过去数据并协助诊断。\n\
  \n我们可以看出，这可能导致严重错误的诊断，因为医生可能会看到体温读数的平均值，却不知道读数是在什么时间采取的、读数采取时患者的状况，以及读数前进行的任何活动，而其他相关的上下文细节也可能缺失。\n\
  \n一个需要始终牢记的重要现实是，客户交互通常涉及多个领域。例如，当企业销售产品并签订合同时，客户主数据以及产品和合同（如果被视为主数据）都会受到影响。如果是基于佣金的销售，员工（也是主数据）也会受到影响，因为需要支付佣金。\n\
  \n根据金色记录的批评者的说法，组织一直在尝试实施 MDM 并达到金色记录，成功程度不一，结果参差不齐。这可能是因为人们渴望获得该记录的单一组织视图，而不是在保持上下文的同时利用数据。\n\
  \n### 修复缺陷\n\n金色记录理念的批评者建议考虑流程或活动的所有主数据，而不仅仅是单一领域，如 *金色记录的批评者* 部分示例中的客户记录所示。该新框架的拥护者主张理解数据属性之间的各种含义和链接。因此，允许多种数据解释/上下文，并将其视为\
  \ *全局主数据* 的一部分。\n\n在此模型中，每个系统都有自己的主数据注册表，用于保留应用程序中数据的上下文。中央 MDM 系统具有与其相应的元数据描述的可互操作属性，当检测到任何联邦系统的主数据发生变化时，MDM\
  \ 将使用已知元数据和属性填充数据。\n\n请记住，这种方法的基础仍然植根于 MDM，但改进了当前广泛使用的金色记录理念。其主张是，数据在任何给定时间可能有几种不同的上下文相关含义，而不是一个元数据描述（这就是金色记录所基于的），这一观点有分量，并可以为通过各种上下文查看和报告数据打开大门。以下是在实际环境中这种情况的示意图：\n\
  \n![](img/782d45700e093b3d82b348c0ccc8ccba_165_0.png)\n\n图 4.8 – 修复传统 MDM 架构中的缺陷\n\
  \n在下一节中，我们将探讨 MDM 与 CRM 之间的关联、CRM 的挑战，以及如何使用 MDM 缓解其中一些挑战。我们还将简要提及组织在云端实施 MDM 解决方案时面临的挑战。\n\
  \n### MDM 和 CRM 策略\n\nMDM 和 CRM 策略应当并重，因为 CRM 通常是客户数据的入口。大型公司也有多个 CRM 系统，这些系统内通常存在客户数据重叠。此外，还需要管理客户层次结构，而典型的\
  \ CRM 系统并未针对管理层次结构进行优化。\n\n具体挑战包括以下几点：\n\n- 存在多个版本的事实真相，且没有匹配和合并规则。如前所述，CRM 系统未针对层次结构管理进行优化，且在没有标准化层次结构的\
  \ CRM 系统中存在多个客户记录，这使得报告变得具有挑战性。\n- 在 **并购（M&A）** 过程中，许多 CRM 中可能存在多个客户记录副本，导致出现多个版本的事实真相，既没有匹配和合并规则，也没有明确识别特定数据元素的来源。\n\
  - 多个记录系统还会导致数据重复，而未识别正确版本，当这些数据流向下游系统时，可能会影响业务决策、客户参与度和保留率。\n- 不正确的数据还会导致非标准化数据，客户在一个系统中可能被标识为制造业等行业，而在另一个系统中，因为其部分业务是零售业，所以被标识为零售业。\n\
  \n实施 MDM 可以通过提供整合且可信的客户数据（即备受追捧的金色记录）来解决 CRM 中的一些缺陷。它可以提高整体数据质量，并提供一种简单的机制来管理客户层次结构。\n\
  \n我们应该承认，由于主数据的性质及其构成业务支柱的方式，一些组织出于对数据隐私的担忧、对数据控制不足的感知以及对基于云的解决方案安全性的担忧，不愿实施基于云的\
  \ MDM 解决方案。Salesforce Customer 360 解决了一些这些问题，我们将在下一节中回顾。\n\n### 客户 360\n\n您可能已经注意到，企业的组织结构通常体现在数字化转型的讨论和实施方式中。每个人都意识到需要跟上不断变化的业务和监管环境，并转型业务以保持竞争力。然而，在实施时，例如，销售大型采矿卡车的部门会实施自己的报价解决方案，尽管施工部门已经有一个解决方案。理由可能是施工业务与采矿业务大不相同，需要自己的报价解决方案。随着越来越多的组织意识到业务和企业架构的重要性，我们可能会看到这种场景减少，但尽管如此，它们仍然是现实，并很好地展示了孤岛是如何形成的，并最终体现在公司创建的数字产品中。\n\
  \nIT 系统的这种孤岛化导致多个数据库和应用程序以及技术的分散使用，这使得很难获得单一且最准确的客户视图。您可能会问，这为什么重要，尤其是公司这样运营了数十年并一直在获利。答案是，随着市场竞争日益激烈，仅仅销售产品/服务并交付已经不够。客户要求更多，期望更多，而一流的公司正在满足这些期望。客户希望在即将获得的产品/服务之外，还能获得一种体验。除非公司了解客户旅程以及与其数字或实物资产的多个接触点，否则无法充分提供这种客户体验。总而言之，缺乏完整的客户视图将阻碍这一目标。\n\
  \n如何实现这一视图？这需要连接销售、服务、市场、供应链、商务及其他系统，但说起来容易做起来难，因为这些系统有时使用专有数据模型，这使得它们难以集成，或者使用旧技术，不便于轻松集成。构建单一客户视图的目标已经存在很长时间，但由于本节前面讨论的原因，实现起来并不容易。Salesforce\
  \ 的 Customer 360 承诺通过实施云信息模型（CIM）来实现该目标，但有关该模型的更多内容将在后面介绍。首先，让我们了解 Customer 360\
  \ 包含什么。它是一组工具和服务，可使客户提供智能且高度个性化的客户服务。\n\n\n\n\n\nCustomer 360 包含四个要素：\n\n- **Customer\
  \ 360 Data Manager**：这是关键组件，允许公司连接并提供 Salesforce 及其他企业系统中客户记录的单一真实数据源。它通过创建用于表示客户的单一通用\
  \ Salesforce ID 来实现这一点。这使公司能够为客户提供个性化体验，并在内部，使公司能够通过 Salesforce Einstein 获得关于客户行为的独特洞察。\n\
  \n- **Salesforce Identity for Customers**：此组件允许公司为客户提供统一、一致的登录体验。客户不再需要多个密码来登录并访问不同的公司资产（例如移动应用、网站和电子商务网站），客户可以使用启用了多因素身份验证的一个登录名安全地访问这些资源。\n\
  \n- **Customer 360 Audiences**：此功能可在网站访问、第一方 ID、电子邮件等方面创建多个客户档案，并允许公司创建客户旅程并获得 AI\
  \ 驱动的洞察。**第一方 ID** 是与第一方 Cookie 关联的 ID。第一方 Cookie 是 Cookie（小型文本文件），当用户访问网站时会放置在用户的设备上。第一方\
  \ Cookie 与第三方 Cookie 不同，第一方 Cookie 只能由您正在访问的网站主机放置。例如，如果您访问 `google.com`，它可以在您的设备上放置\
  \ Cookie，但 `youtube.com` 不能。第一方 Cookie 通常被认为更注重隐私安全。\n\n- **Salesforce Privacy and\
  \ Data Governance**：这允许公司收集并强制执行其系统中的客户隐私偏好。其中还包括数据分类标签，该标签现可应用于 Salesforce 中的字段。这有助于公司确保其符合隐私法律。\n\
  \n### 常用信息模型（CIM）\n\nCIM 是一种开源数据模型，用于标准化系统之间的数据互操作性。它是一种允许连接不同格式和结构的数据源的数据模型。它构成了\
  \ Customer 360 架构的基础。当数据源连接到 Customer 360 时，数据本质上是从这些源映射到规范数据模型。\n\n规范数据模型（CDM）：这是一种可以包含源系统可能具有的不同数据模型中所有数据的数据模型；例如，假设我们的系统环境中有\
  \ MS Dynamics、SAP 和 Salesforce。这三者都会有自己的数据存储方式，而在 CDM 中，我们将能够获取这些数据、将其转换、存储，并轻松将其映射回源系统。因此，在上述示例中，我们将能够引入来自\
  \ MS Dynamics、SAP 和 Salesforce 的数据，使其他系统可以轻松使用这些数据，而无需自行进行转换或翻译。\n\n### 数据湖\n\n\
  通常，当您在数据存储中存储数据时，需要将其结构化为特定格式。数据湖是不要求数据以任何严格格式存储的数据存储，并允许用户存储结构化数据和非结构化数据。\n\n在\
  \ Salesforce 中，CIM 暴露到平台上，因此您可以针对它运行 SOQL 查询、构建触发器或创建 Lightning Web 组件（LWC）。Customer\
  \ 360 的优势在于，无需将大量数据移动到数据湖中；相反，使用指向源的唯一引用允许数据保留在原位。这也意味着，无需更改源系统来适应集成。\n\n### 摘要\n\
  \n我们从基础知识开始，回顾了主数据及其在任何组织（无论大小）中的重要性。我们回顾了不同类型的数据，特别是在 Salesforce 语境下比较了主数据和参考数据。当大多数人谈论主数据时，他们通常指的是主数据范畴下的这两个类别。我们详细讨论了什么是主数据以及它帮助我们解决哪些业务问题。这应该能让您认识到，为什么应该投入足够的资源和时间来识别主数据，并制定一个坚实的计划来妥善管理它，以确保业务运营的顺利和持续。\n\
  \n我们讨论了主数据管理（MDM），从其定义开始，以建立对该术语的基准理解，然后简要讨论了如何实施 MDM 计划。围绕实施 MDM 的不同风格的讨论，让您很好地了解哪种风格适合您的组织，随后讨论了选择\
  \ MDM 解决方案时的标准。我们还讨论了金色记录（Golden Record）、其重要性以及金色记录理念的反对者的观点。在讨论金色记录时，这应该能提供一种平衡的方法，牢记其优势以及在实施\
  \ MDM 解决方案时可以缓解的感知劣势。\n\n最后，我们讨论了 Salesforce 的新产品 Customer 360 及其组件。Customer 360\
  \ 是 Salesforce 为解决当今组织面临的主数据问题而做出的尝试，但它不止于此。它更进一步，通过 Salesforce Identity for Customers\
  \ 为客户提供统一登录体验，将客户也带入讨论中，并通过 Customer 360 的 Salesforce Privacy and Data Governance\
  \ 组件确保客户数据得到妥善治理，并能妥善处理客户关于组织持有的其数据的请求。\n\n在下一章中，我们将讨论企业数据治理以及 GDPR 和 CCPA 等隐私法案，同时讨论如何从数据治理角度评估我们当前的状态。\n\
  \n### 问题\n\n- 1. 精密打印机（PP）在每个地区都有多个 CRM，并决定实施 MDM 系统来整合记录并生成金色记录。项目团队决定使用幸存者规则来选择合并操作期间需要保留的记录。在这种情况下，数据架构师和项目团队需要考虑什么？\n\
  \n- a) 团队必须为每个系统定义多个幸存者规则，以生成金色记录。\n\n- b) 幸存者规则不能用于此场景，因为它们不用于重复管理。\n\n- c) 项目团队需要定义可用于生成金色记录的具体标准。\n\
  \n- d) 项目团队需要设置概率规则来确定金色记录。\n\n- 2. 阿尔法大箱公司（Alpha Big Box Inc.）拥有多个系统，每个系统都被确定为记录系统（system\
  \ of record），拥有与账户和联系人相关的部分主数据，也就是说，数据被输入或更新，对于这些特定的数据点，更新这些数据点的系统被视为记录系统。一个 CRM\
  \ 正在迁移到 Salesforce，并被定义为未来账户和联系人的真实数据源（source of truth）。一个 MDM 也已近期实施，正在从 Salesforce\
  \ 提取数据。\n\n用户发现 MDM 中的一些记录存在空白或错误值，例如“Test Contact”。问题的根本原因可能是什么？（选择两个答案）：\n\n-\
  \ a) Salesforce 中用户验收测试（UAT）期间生成的测试数据仍然存在且未被删除。\n\n- b) 项目团队应立即关闭 MDM 接口，删除 MDM\
  \ 中的所有数据，然后重新启动所有集成。\n\n- c) 所有数据尚未迁移到 Salesforce，但它已被过早定义为账户和联系人的记录系统，导致 MDM 为某些记录提取了这些特定字段。\n\
  \n- d) 始终只能有一个系统是记录系统；此配置无效，是问题的根源。\n\n- 3. 酷乐箱公司（Koolio Box Inc.）是一家采用 B2C 模式的消费品零售商。它在\
  \ Salesforce 中拥有 2000 万条人员账户记录，且每年增长 5%。酷乐管理层担心这些记录并非唯一，并且由于存在多个数据输入渠道（例如 Web-to-Case、Web-to-Lead\
  \ 和外部营销活动），如果不优先处理，情况会变得更糟。他们聘请了一名数据架构师来推荐解决方案。数据架构师应该推荐什么？\n\n- a) 雇佣几名实习生，让他们在\
  \ Excel 中手动筛选记录并确定重复记录。从系统中删除这些记录。\n\n- b) 开发一个使用 API 和 Lightning Web 组件（LWC）的自定义解决方案，以帮助基于有限数量的标准（例如电子邮件和电话号码）确定潜在重复项。\n\
  \n- c) 使用 AppExchange 包来清理现有数据，并利用它持续确保数据质量。\n\n- d) 使用邓白白街（Dun & Bradstreet，D&B）服务来清理数据。\n\
  \n\n\n"
- "## 5 实施数据治理\n\n在本章中，我们将详细回顾数据治理：其必要性以及不当数据治理相关的风险。您将了解数据治理与管理之间的区别。您还将了解成功数据治理计划的关键原则，以及可以采取的一些关键步骤来确保您的计划取得成功。然后，我们将更具体地讨论可以在\
  \ Salesforce 中对数据进行治理的措施。\n\n我们将学习如何进行现状评估，这样下次您被指派此类任务时，可以轻松评估现状并提出建议，以纠正任何问题或改进现状。您还将了解可以建立的相关指标，以确保您跟踪进度。\n\
  \n数据隐私是一个日益受到关注的话题，因为世界各地的监管机构正在制定法律以保护个人数据。组织运营所在的司法管辖区不同，适用的监管法律繁多，但我们将重点介绍其中两项——**一般数据保护条例（GDPR）**和**加州消费者隐私法案（CCPA）**。您将了解这些法律的关键定义及其背后的原则，这些原则随后可应用于\
  \ Salesforce 平台的上下文中。\n\n本章的关键主题包括：\n\n- 企业数据治理\n- 评估数据治理的现状\n- GDPR 合规性与 CCPA\n\
  - 将所有内容整合在一起\n\n那么，让我们立即深入了解企业数据治理。\n\n### 企业数据治理\n\n每个组织，无论大小，都会收集数据，通常来自多个来源，并有责任确保建立以一致方式处理数据的流程。其做法必须符合组织所受约束的数据相关法规和法律。\n\
  \n组织还会就数据做出决策，例如数据存储位置、谁可以访问数据以及保留数据的时间，但有些组织会有意投入精力并正式化这一决策过程，而其他组织可能不会这样做。以正式方式这样做的组织在一段时间内能实现更多价值，同时也将其因非正式数据治理流程而面临的风险降至最低。\n\
  \n在接下来的几个部分中，我们将首先定义数据治理，清晰阐述其背后的业务驱动因素、正式数据治理的好处以及数据治理的其他相关方面。\n\n### 什么是数据治理？\n\
  \n如果您简单搜索“数据治理”这个短语，会发现大量定义。这表明并没有一个公认的定义，这在与利益相关方沟通时会带来复杂性。我偏好的定义是：数据治理可以定义为一套原则和实践，用于从数据诞生到其归档/删除（即整个数据生命周期）对数据进行治理。\n\
  \n数据治理是一门渗透到当今企业几乎方方面面的综合性学科，因为数据现在被视为一项资产。这是因为企业越来越意识到，在日益动态和竞争激烈的市场中，数据可以作为竞争差异化因素。例如，在机器学习、人工智能以及当今可用的无数其他高级工具出现之前，从销售数据等数据中获得洞察非常具有挑战性。这是因为这需要手动进行数字计算，这是一个耗时且容易出错的过程。此外，开展此类活动还会使公司花费真金白银，通常只会为分析收集少量数据。如今，当呼叫中心代理解决您的工单后，收到收件箱中的调查问卷几乎已成为常态。这使得主动的组织能够在为时已晚、客户开始将业务转移到竞争对手之前，采取行动回应您的反馈。简单来说，数据治理使组织能够利用数据创造价值。\n\
  \n还需要了解，数据治理与信息技术（IT）治理并不相同。IT 治理侧重于就组织的软件、硬件资产及其技术架构做出决策。数据治理侧重于治理数据资产，其重点在于数据。话虽如此，决策过程中会存在交叉；例如，健康保险组织的数据治理政策可能会在字段层面规定谁应该有权访问敏感字段。由于这需要能够在应用程序中管理字段级安全性，因此在解决方案选择时，这将是一个重要考虑因素，并会影响决策过程。\n\
  \n### 了解数据治理的必要性\n\n我们在前面的章节中讨论了数据的价值，数据现在已成为组织的关键资产。也许，在未来，我们可能会像今天衡量商业信誉一样，开始衡量数据质量、治理流程和其他属性。企业正在认识到数字化转型的价值并加以适应；尤其是在\
  \ COVID-19 大流行期间，一些企业已将运营完全数字化，而另一些企业则在务实评估可以数字化的职能。这意味着将创建更多数据，需要对其进行适当治理。让我们讨论一下数据治理的一些关键驱动因素：\n\
  \n- **通过流程改进实现收入增长**：组织中的每个业务职能都相互关联，并将以其自身方式从数据治理中受益。例如，高层管理层可以可靠地使用分析来探索收入增长机会；财务部门可以准确报告公司的财务状况；销售和市场部门可以获得关于客户行为和偏好的宝贵洞察；供应链可以专注于成本降低和引入运营效率的领域。总的来说，拥有管理良好的数据可以增强对数据驱动决策的信心，并在组织内部及与外部利益相关者之间建立信任。当您拥有强大的数据治理实践时，您可以自信地让客户了解其数据如何存储、处理和销毁，这可以带来客户信任度的提升，进而转化为更多收入。\n\
  \n- **监管合规**：这可能是数据治理计划最常见的驱动因素，尤其是对于银行和医疗保健等受严格监管的行业。这也适用于像**欧盟（EU）**这样的国家或地区，它们可能拥有自身的一套规则，在这些司法管辖区运营的企业需要遵守。不遵守这些法规可能会导致高额罚款，更重要的是，会降低人们对组织品牌的信任。\n\
  \n- **数据质量**：拥有准确且完整的数据至关重要。组织需要确保数据质量，以便数据在整个组织中可信，并可用于做出关键决策。如果没有对数据的信任，组织将难以利用数据进行决策，从而导致机会错失、低效率，最终导致收入损失。\n\
  \n- **数据标准化**：当今，组织通常在使用几十个甚至上百个系统。这些系统各自都有自己的数据格式和标准。这看似微不足道，但常常会导致数据不一致和误读，从而导致次优决策和潜在的收入损失。\n\
  \n- **数据安全：** 当今组织的首要任务之一是数据保护，确保制定政策和使用工具来保护数据免受未经授权的访问。这还包括内部或向外部利益相关者分发数据的方式、时间和内容。\n\
  \n在了解了数据治理的驱动因素后，让我们简要探讨一下数据治理的好处。\n\n### 数据治理的好处\n\n一个良好的数据治理计划在一段时间内会带来许多好处，我们将在本节中讨论其中的一些。然而，必须记住，数据治理不是一个有明确开始和结束日期的项目；相反，它是一个持续的过程，其中的输出（即可用于运营和分析目的的高质量数据）会反馈以进一步完善输入，就像反馈循环一样。当公司开始看到数据治理流程和政策的结果时，他们可以进一步调整它们，以确保实现所需的数据输出。以下是数据治理的一些好处：\n\
  \n- **数据发现**：适当的数据治理有助于在组织内轻松发现数据，并提高数据在组织内的采用率。数据治理实践推动一致性和遵循商定的标准，使数据更容易被发现。这也意味着数据被理解，并且在需要时可以轻松被授权方访问。\n\
  \n- **数据安全：** 与网络安全相关的威胁是许多组织关注的主要问题。当治理流程在明确定义的角色和职责下实施时，可以降低数据丢失、被盗或被未经授权的方访问的风险。数据治理实践推动关键资产的识别以及保护这些资产所需的控制措施。\n\
  \n- **品牌信任**：实施数据治理流程会随着时间的推移提高您的数据治理成熟度水平，这不仅会增加组织内部的信任，还会增加外部利益相关者的信任。客户更愿意与能够明确证明其拥有足够流程来维护和保护消费者数据的组织开展业务。\n\
  \n\n\n\n- **集成**：当今组织中运行多个业务应用程序和系统已成为常态。例如，营销系统需要与**客户关系管理**（**CRM**）系统集成，以发送营销合格线索，而CRM可能需要与**企业资源计划**（**ERP**）系统集成，以便在CRM中批准报价后进行订单履行。如果没有得到妥善治理的数据，可能导致下游应用程序中劣质数据泛滥，使维持一定数据质量水平的工作变得更加困难。想象一下，一个数据仓库中存在不准确的数据，然后被用于数据集市。这将如何影响决策？或者说，CRM将错误地址发送到订单履行系统，然后系统将订单发送到这个错误地址。这将如何影响您与客户的关系，并最终影响您的收入目标？\n\
  \n- **资源高效利用**：并非所有数据都有用，您也不希望收集对组织没有价值的数据；您宁愿将资源用在更好的地方。拥有数据治理提供了仔细分析和收集实际能提供价值的数据的能力。请记住，防止不需要的数据进入组织总是比将其引入然后在确定其对您无价值后将其删除要容易得多。\n\
  \n- **处理复杂性**：数据可以收集的来源数量正在与数据量一起增加。良好的数据治理将提供管理这些数据源和数据量的能力，使响应内部和外部数据请求并遵守隐私法规变得容易。\n\
  \n- **分析**：越来越多的公司使用数据科学、机器学习和人工智能来推动最佳决策和识别风险，以获得洞察。如果这些学科要产生可靠且可信的有用结果，则健全的数据治理实践和基础是必不可少的。\n\
  \n### 理解数据治理与数据管理的区别\n\n许多人将数据治理和数据管理实践混淆。虽然它们相关联，但了解区别很重要。数据管理实践是战术层面的IT实践，用于确保数据的可访问性、可靠性和安全性，而数据治理更多是一种业务策略，用于安全地利用数据来创造价值并降低对组织的风险。\n\
  \nIT团队在实施流程和工具以收集、存储、组织和处理数据以维护数据质量和对数据的信任时，关注数据管理方面；而数据治理则专注于识别数据及其关联数据资产，以便公司能够获得数据的益处。这并不是说数据治理不使用任何工具来实现其目的，而是意味着用于数据治理的工具服务于更广泛的目的。例如，Salesforce管理员决定实施Dun\
  \ & Bradstreet的Optimizer工具以进行持续的数据清洗和数据丰富。这是数据管理的示例。但是，如果企业决定实施业务实体数据目录，或定义与管理组织中数据相关的角色和职责（例如数据管家和审批人），那将是数据治理在行动中的示例。\n\
  \n另一种看待此问题的方式是，审计员定义和实施政策和程序，财务管理执行这些政策，同样，数据治理涉及定义与数据以及将以某种方式与该数据交互的人员相关的流程。在建筑行业，建筑物应该如何建造的蓝图类似于数据治理，而该建筑物的建设类似于数据管理。数据治理还包括实现治理目标的技术，例如，帮助用户构建业务数据目录的数据治理工具，包括定义业务术语、这些术语的任何同义词以及相关业务属性。一些工具具有对数据质量进行评分和评估的功能，而其他工具可能具有与数据访问策略相关的功能，并能够连接不同系统以一致地应用您的数据治理策略。\n\
  \n数据治理的一部分还包括定义用于衡量治理政策和程序性能的指标。起初通常会衡量的一些指标包括数据的完整性、准确性以及重复数据记录的百分比。即使只有某些初步指标，也很重要，可以衡量您的政策的有效性以及它们被遵守的程度。请记住，这些指标不仅仅是技术性的，而且也会影响业务指标。\n\
  \n例如，销售未收款天数（DSO）是用于衡量公司财务状况和现金流的指标。如果由于客户地址不正确或不完整而导致DSO较高，外部利益相关者（如分析师）可能会将其视为公司软弱的迹象并下调公司的前景。这可能导致公司为运营筹集资金的借款成本增加。\n\
  \n这个示例是展示数据治理指标与业务指标之间关联的好方法。这是数据管理与数据治理之间的另一个区别——由于数据管理是数据的执行端，它可能没有自己的数据相关指标，但需要满足由数据治理定义的指标。\n\
  \nDSO\n\nDSO是公司完成销售后收到付款所需的平均天数。\n\n在下一节中，我们将了解元数据管理——数据治理的一个基本组成部分。\n\n### 元数据管理\n\
  \n**元数据**是*关于数据的数据*，意味着它为数据提供了必要的上下文。例如，您在Salesforce中有一个名为**Days between Stage**的**公式**字段，用于计算机会对象上每个阶段之间的天数。字段中的值是需要管理的数据，但该字段的类型为**公式**，返回类型为**数字**，以及计算结果的实际公式定义，都是元数据的示例。\n\
  \n这是元数据的技术方面，但元数据还包括业务定义。在全面的元数据文档中，您会注意到它回答了*五个W*和*How*问题。让我们使用上一节中的示例，看看如何更深入地了解此字段的元数据：\n\
  \n- **为什么？**：这与理解存储此数据的理由有关。这是最重要的问题。就我们的示例而言，存储此数据的原因是为了我们可以报告在各阶段之间移动所需的天数。\n\n\
  - **是什么？**：我们需要问的另一个问题是字段的目的以及使用它的驱动因素。这涉及数据的业务定义和适用的业务规则。就我们的示例而言，业务定义可以是*计算机会记录当前阶段与上一阶段之间的天数*。另一个被回答的问题是，此数据的业务规则是什么？例如，当机会记录处于初始发现阶段（阶段选择列表中的第一个阶段）时，此字段的值将为空白。\n\
  \n这个问题的另一个方面是询问此字段的缩写或简称是什么。对于我们来说，可能是**NoD (Stage)**，指**阶段**字段的**天数**，或者**NDS**，指**阶段**字段的**天数**。数据库字段名称也在此处提到，在我们的示例中是Number_of_Days_Stage__c，其中**字段类型**是**公式**，返回类型为**数字**，小数位数为0。\n\
  \n\n\n\n\n通常，与安全相关的问题也会在此处解答，例如该字段的隐私级别是什么。Salesforce 提供了若干与数据隐私相关的字段，例如 **合规性分类**\
  \ 和 **数据敏感度级别**，可用于正确分类数据。**天数（阶段）** 仅为内部使用字段，因此我们将为其选择 **内部**。其他选项包括 **公共**、**机密**、**受限**\
  \ 和 **关键任务**。\n\n针对 *什么？* 问题，我们现在可以说，目的是报告平均销售周期，以便与行业和同行平均值进行比较。业务驱动因素是识别瓶颈并将其消除，从而使平均销售周期时间与公司所在行业和同行指标保持一致并可比。\n\
  \n- **何时？**：这回答了数据何时被创建和更新，以及何时可以从系统中归档或清除的问题。在我们的示例中，**天数（阶段）** 字段在机会创建时最初填充，并在机会记录上的\
  \ **阶段** 字段更改时更新。该字段连同其他数据每天晚上复制到数据仓库，并在机会记录中的数据设置为 Closed/Won 或 Closed/Lost 后 3\
  \ 年从 Salesforce 中删除。\n\n- **如何？**：这回答了数据存储在多少个地方以及应存储多长时间的问题。在我们的示例中，该字段既存储在 Salesforce\
  \ 中，也存储在用于分析报告的数据仓库中。它在 Salesforce 中保留 3 年后归档，并在数据仓库中保留 7 年后删除。由于我们使用第三方 AppExchange\
  \ 应用来备份数据，因此它也存储在其数据中心中。在此情况下，数据存储在三个不同的地方。\n\n- **谁？**：这回答了谁创建了此数据、谁是数据的用户、谁是数据的所有者、谁可以修改数据、谁是数据管家，以及谁可以在内部或外部影响此数据等问题。在我们的示例中，销售\
  \ **代表（reps）** 是此数据的用户，且数据由系统根据销售代表的操作自动创建。当销售代表及其直属经理和销售运营团队更新阶段并保存记录时，也可以间接修改该数据。该数据可能受到内部高管层人员的影响，也可能受到部分拥有该公司的投资公司的外部影响，后者要求缩短销售周期以增加现金流和收入。\n\
  \n- 在哪里？：这涉及数据存储在哪里、数据在哪里使用和共享，以及数据备份在哪里。在我们的示例中，我们的数据主要存储在 Salesforce 中，同时也存储在数据仓库中。它在\
  \ Salesforce 报表和仪表板中使用，同时也通过 Salesforce 社区与合作伙伴共享。数据由 Salesforce 在其数据中心中备份，但公司也使用第三方\
  \ AppExchange 工具备份数据，应考虑该工具是否符合 GDPR 或 CCPA 等法规的要求。\n\n元数据管理是数据管理的一个重要方面，使用此技术，您可以轻松全面地定义元数据。\n\
  \n在下一节中，我们将回顾可应用于成功数据治理计划的核心指导原则。\n\n### 数据治理计划的指导原则\n\n每个人都理解数据的价值，尤其是现在我们有如此多的数据以创新和创造性方式使用的示例。问题是，我们还需要沿途的一些路标，以使我们在数据治理之旅中保持正确方向。数据治理原则正是这些路标，它们帮助我们做出决策，并确保尽管通往高质量数据状态的路径可能不同，结果将是相同的。以下是成功数据治理计划的一些关键指导原则。\n\
  \n### 数据是每个人的事\n\n当今组织拥有的大多数数据都可以在企业范围内共享。根据数据类型，多个业务职能通常对其感兴趣，并且，如果组织拥有成熟的分析和数据科学实践，数据科学家也会对该数据感兴趣。为了使数据在整个组织中变得有价值，其用户需要理解数据。这要求数据使用明确且达成一致的定义进行一致定义。\n\
  \n更广泛的数据访问有助于构建更高效、数据驱动的组织，无论是面向内部客户还是外部客户，都能更轻松地提供出色的客户服务。在大多数情况下，拥有一个能够及时提供信息的单一数据源，比拥有多个需要集成并进行转换以标准化以便在整个组织中一致使用的数据源更具成本效益。数据还必须防止未经授权的访问，并实施政策和程序以防止数据相关事件。所有这些都要求组织中的每个人都认为并感到有责任将数据视为资产，就像组织对待实物资产一样。这与管理公司财务无异：不仅首席财务官（CFO）有责任管理它们，每位员工也有责任有效利用组织的资源。\n\
  \n拥有孤岛数据并实施您自己的分部系统不仅在组织层面成本更高，还会导致试图集成该数据时出现问题，例如在多个系统正在更新数据记录的场景中确定字段在哪里受主控。如果没有适当的政策和程序来保护数据，例如，可能会导致以随意心态对待数据，使组织面临严重的声誉和财务后果。\n\
  \n数据治理的另一个方面是，它不应被视为一项 IT 举措——因为它不是。数据治理更多是 IT 与业务之间的合作伙伴关系。这一点很重要，因为传统上，许多企业将 IT\
  \ 职能视为数据的所有者和保管人，这可能导致数据质量问题，以及无法看到数据的价值以及它如何为业务增加价值。\n\n### 数据必须得到妥善管理\n\n这涉及有意识地从数据产生之初到归档或清除之时实施数据生命周期管理。在下游流程和系统中实施良好数据质量措施，始终比从一开始就实施更容易、更便宜。5S\
  \ 和看板等制造技术背后的理念正是意识到，在流程早期修复缺陷远比在产品交付后修复要便宜得多。\n\n让我们看一个简单的示例来演示这一点。如果 Web 到线索表单具有\
  \ **国家/地区** 字段，该字段与 Salesforce 中启用的国家/地区选项列表值不匹配，并且潜在客户填写表单并输入列表中不存在的国家，则该线索不会被插入\
  \ Salesforce。相反，将向系统管理员发送一封包含线索信息的电子邮件，然后他们可以在 Salesforce 中手动输入该线索。在这种情况下，他们可以选择不采取任何操作，并等到下次输入相同国家值的线索并重复该过程，或者他们可以添加该国家，并确保存在与网站上的值匹配的正确国家。很明显，后一种方法比手动添加线索更合适，尽管如果电子邮件被错过或因某种原因未送达管理员，线索可能会被完全遗漏，从而使公司损失潜在收入。\n\
  \n数据管理还包括拥有定义明确的数据质量标准，以便可以适当地衡量和报告数据质量。数据管家应帮助定义其领域的数据定义标准和构成高质量数据的内容。数据质量、标准定义、安全性、隐私和标准化的问责制必须由组织中指定的角色承担。这些角色必须确保数据与组织的内部政策一致使用，并且还符合任何外部法规。\n\
  \n### 数据必须被视为战略资产\n\n数据必须从高层支持开始，被组织各级视为企业资产。必须传达数据是一种共享资源，对数据驱动决策的基础至关重要。这需要经常进行，以免随着时间的推移或新员工加入公司而忘记数据的战略价值。当组织文化开始将数据视为资产时，就会引发讨论，并需要像对待实物资产一样对待数据。例如，数据是否符合法规要求，如何将其与实现组织目标联系起来，以及数据的可靠性、及时性、准确性和完整性如何？\n\
  \n将数据视为战略资产的另一个好处是，当团队更愿意共享其领域数据并协助管理数据时，对话会从“我的”数据转变为“我们”的数据。例如，有时如果将数据共享给另一个部门，会对该部门如何使用数据存在感知上的或真正的担忧。他们是否会在我也在向相同客户进行营销时开始向我的现有客户做营销，或者开始对他们进行冷电销售？这些疑虑和猜疑会减缓数据共享的进程，但明确您希望从该数据中获得什么以及如何实现，可以消除这些担忧。\n\
  \n\n\n\n\n### 单一真实数据源\n\n当今的 IT 环境包含多个系统和数据库，它们各自在业务的平稳运行中发挥作用，但这也导致了同一数据的多个副本，从而增加了复杂性。随着数据驱动的决策成为首要任务，拥有可靠且值得信赖的数据比以往任何时候都更加重要。有时，组织内的业务职能部门会争论并捍卫其职能所产生的数据，所有这些都会导致对数据的困惑和怀疑。数据治理举措必须始终致力于拥有一个可靠且得到组织内所有人信任的单一版本的真相。\n\
  \n### 数据治理是一场马拉松，而非短跑\n\n有些人可能不认为这是一个原则，认为它太过软性和无形，但我的观点是，大多数员工习惯于在有明确开始和结束日期的项目上工作，并期望数据治理举措也是如此。尽管数据治理将包含有开始和结束日期以及\
  \ KPI 的项目，但它是一项持续的举措。这种思维方式使您能够妥善规划、分配资金，并为数据治理计划提供必要的曝光度和支持。\n\n在下一节中，我们将探讨一些需要牢记的关键事项，以确保数据治理计划取得成功。\n\
  \n### 王国的钥匙 – 使您的数据治理计划取得成功\n\n考虑到组织拥有的数据量以及数据来源的数量众多，数据治理可能看起来是一项艰巨的任务。最好的方法是使用爬行、走、跑方法论。以下是一些您可以采取的关键措施，以确保您组织的数据治理计划取得成功：\n\
  \n- 爬行、走、跑：这可能是您为确保数据治理计划成功所能做的最重要的事情。许多公司在其举措中失败，是因为他们承担了超出自身处理能力的事情。一旦拥有成熟的数据治理计划，等待着您的机会令人兴奋，并可能导致设定不切实际的目标。请您先关注数据治理中那些容易实现且能快速取得胜利的事项。这在几个方面将有所帮助：\n\
  \  - 首先，当人们开始看到数据治理举措的结果时，这将激励参与其中的团队。\n  - 其次，这将为您下一项数据治理举措的商业论据提供数据。因此，使用这些数据的业务最终用户将开始提出更多需求，使您更容易获得下一个商业论据的批准。\n\
  \n- **度量指标：** 在开始任何数据治理举措之前，请确保定义可用于衡量您工作成效的度量指标。起初，这不需要非常复杂，简单的事情如为三个领域定义业务数据目录，或为\
  \ x 个领域定义质量标准即可。这不仅为您提供了可衡量进度的具体且客观的指标，还能让您向组织传达数据治理举措所创造的价值。\n\n- **元数据管理和数据管治：**\
  \ 由于元数据为确保数据与业务目标保持一致以及遵循数据标准和政策提供了框架，因此对于成功的数据治理计划而言，元数据管理的重要性不容忽视。元数据管理与数据治理密不可分，因为元数据管理提供了业务目标与数据之间的链接。这意味着，有效的元数据管理是数据管治员的关键职责。数据管治员确保元数据被创建，并能够交付业务希望从其数据中实现的价值。\n\
  \n- **迭代方法：** 我在本节前面提到过采取小步快跑的方法，其中一种方式是制定有计划的迭代方法。这意味着在合理的情况下，以几周为一个周期，否则周期可能需要更长，并在周期结束时交付成果。这可以简单到为业务所有职能定义、标准化并批准的业务术语目录，或指定和任命关键角色，例如为您选定的领域识别和培训数据管治员。\n\
  \n在下一节中，我们将探讨管理数据质量的一些关键要素。\n\n### 数据质量\n\n由于我们一直在讨论成功数据治理的关键，因此简要讨论确保数据质量的关键方面也是明智的。这些方面可用于全面覆盖数据质量的所有方面，而数据质量是数据治理的一个关键关注点。我在此处讨论这个问题，是为了确保我们不忘记数据治理与数据管理之间的联系。数据管理的以下方面在规划治理举措时能提供切实的联系和清晰度：\n\
  \n- **数据分析：** 这是审查源数据并理解其结构、内容以及数据之间关系的过程。简而言之，这实际上是关于理解您的数据。例如，在 Salesforce 中，这将是数据源列表以及存储数据的字段。它还涉及识别数据中的问题，例如不同对象上的重复字段允许在两个字段中填写，而不是使用对象之间的关系从一个对象拉取数据并使用自动化工具填充到另一个对象中。一个很好的例子是，假设在账户上创建了一个法定地址字段，在报价单上又有一个字段，两者都允许编辑权限。这意味着这些字段很容易不同步。最佳方式应该是将一组字段设置为只读，并使用自动化工具（如\
  \ Process Builder 或触发器）填充它们。\n\n- **清理：** 这涉及修复分析阶段识别出的异常，例如，确保我们在分析阶段使用的字段具有相同的值。其他示例包括清理任何不再使用的旧字段，或修复数据中的拼写错误以及导入过程中引入的错误。最后一种情况通常发生在您从另一系统导入记录时的机会阶段。如果阶段未正确匹配，另一系统中的值将自动插入\
  \ Salesforce。然后，您将需要使用选择列表的 **替换** 函数来修复它们。\n\n- **标准化：** 此步骤包括对数据进行标准化，以便数据匹配能够最优地执行。其范围可能是结构化或非结构化数据。例如，销售代表可能输入街道地址为\
  \ 457 S Gate St；使用既定业务规则进行标准化后，这可能会更新为 457 South Gate Street。使用单选或多选选择列表是标准化的另一个示例，在整个平台上都很常用。例如，当机会丢失时，销售经理想知道丢失的原因，因此您可以提供一个销售代表可以选择的选择列表值，而不是提供自由文本字段。作为额外好处，如果他们希望提供更多细节，您可以提供一个自由文本字段。\n\
  \n#### 多选选择列表的注意事项\n\n多选选择列表是标准化环境中数据的绝佳方式，但您也必须意识到使用它们的缺点。报告可能非常繁琐且受限，多选选择列表需要使用\
  \ CONTAINS、INCLUDES 或 EXCLUDES 运算符，这会严重影响大型数据集的性能。使用多选选择列表对数据进行分组也可能非常具有挑战性。例如，如果您在一个记录中选择了埃德蒙顿、卡尔加里和多伦多，在第二个记录中选择了埃德蒙顿和多伦多，在第三个记录中只选择了多伦多，您将无法将记录分组以显示仅将多伦多作为所选值的那些记录。\n\
  \n另一个重大限制是，您无法跟踪此类字段的更改，例如。与大多数其他字段类型不同，多选选择列表仅显示字段已更改，而不显示具体更改了什么。它们在公式中也只能与极少数的函数一起使用。请参阅此\
  \ Salesforce 帮助文章以查看完整列表：\nhttps://help.salesforce.com/articleView?id=sf.tips_for_using_picklist_formula_fields.htm&type=5。\n\
  \n- **匹配和合并：** 在此阶段，您将应用不同的可用技术（概率性或确定性）来确定匹配项并合并记录。您应用数据幸存规则，以得出最准确和最完整的那条单一记录。\n\
  \n- **监控：** 一旦您完成了前面的步骤，现在需要使用各种可用的流程和工具来监控数据的健康状况。特别是当数据治理流程和数据管治员角色变得非常重要时。数据管治员可以使用报告和仪表板来监控数据状态，同时结合第三方或客户工具，这些工具可以帮助他们的工作更轻松。\n\
  \n有许多工具可用于确保数据质量，其中一些是免费的。RingLead 的 Field Trip 应用程序是一个评价很好且深受管理员社区喜爱的应用程序。Salesforce\
  \ 还提供一个名为 Data.com Assessment App v3.2 的应用程序，该应用在 AppExchange 上私有列出（https://appexchange.salesforce.com/listingDetail?listingId=a0N3000000puBxEAI）。Salesforce\
  \ 的另一项产品是其加速器。这些是与 Salesforce 专家的会话，他们将根据您的特定用例为您在数据质量和治理方面提供指导。我建议联系您的客户经理以获取关于应该从哪些开始的帮助。如果您是高级支持客户，这些内容包含在您的订阅中，免费提供。\n\
  \n\n\n\n\n在本节中，我们回顾了实施成功的数据治理计划的关键事项。在下一节中，我们将讨论 Salesforce 数据治理计划的关键要素。\n\n###\
  \ 成功管理 Salesforce\n\n迄今为止，我们已经讨论了数据治理是什么、其优势以及在实施数据治理时需要牢记的原则。在本节中，我希望从 Salesforce\
  \ 的角度更深入地探讨一般治理问题，因为仅制定数据治理政策和程序并没有帮助；相反，本节讨论的所有五个组成部分需要协同工作，才能产生世界级组织所期望实现的结果。\n\
  \n许多客户莫名其妙地认为，因为 Salesforce 在云端，所以可以直接在生产环境中进行更改，或者没有得到 IT 的足够投入和参与。在其他情况下，客户可能使用过传统的本地系统，并希望有一个能够跟上业务变化步伐的平台，并将\
  \ Salesforce 视为几乎不需要治理的平台。Salesforce 与其他平台一样，无论是本地还是云端，都需要治理才能实现平台的持续最优运行。\n\n我们将在下一小节中讨论的五个组成部分并非用于学术讨论，而是定位为您可以采取的切实步骤，以有效管理您的\
  \ Salesforce 实现。\n\n### 愿景\n\n您可能参与过此类项目：项目团队辛辛苦苦交付了一个出色的解决方案，但最终因未达到预期而被业务方拒绝。这就是该计划或项目的“why”（目标）。它试图回答计划的依据、实现这些目标的策略，以及公司希望从该计划中实现的利益。愿景还提供清晰且客观的\
  \ KPI，用于衡量公司是否已实现这些利益，或者公司跟踪这些目标的程度如何。请记住，每个 Salesforce 计划都应与即将实现的业务目标保持一致。例如，如果主要版本需要进行大量测试，而架构师正在申请批准自动化测试工具的资金，那么从中必须能够实现某种业务利益。在此示例中，可能是业务资源一直参与主要版本的测试，因此需要将其从日常工作或其他项目中抽调出来。因此，我们将消除在每次主要版本发布时抽调五名资源进行为期一周的用户验收测试的需求。\n\
  \n记录愿景有多方面的好处。一个主要好处是它能促进决策，因为利益相关者已对愿景和策略达成一致。因此，与愿景一致的高优先级事项可以优先交付。有时，尽管遵循了项目管理方法论和实践，仍然存在沟通差距，利益相关者未达成一致。在这种情况下，拥有文档化的愿景和策略可以帮助您消除这种模糊性，并让每个人都有机会将自己及其期望与愿景保持一致。\n\
  \n通过预先定义经过深思熟虑的 KPI，项目领导者可以评估正在进行和已交付计划的成功，并在需要时对其进行纠正。这消除了许多公司犯下的错误，即项目在对公司希望实现的业务目标只有模糊认识的情况下启动。在某些情况下，目标无法客观衡量。交付完成后，也没有衡量业务目标是否实现的标准。\n\
  \n另一个好处是，它能在业务与 IT 之间创建一致性，并让业务方产生归属感，从而增加解决方案被业务采纳的可能性，推动项目的成功。让我们来看看创建愿景文档的步骤。\n\
  \n### 创建愿景文档\n\n创建愿景文档有几个步骤：\n\n- **识别利益相关者和业务目标**：此步骤涉及识别受计划影响的所有内部和外部利益相关者。识别的一部分还包括进行利益相关者分析，即了解每个利益相关者。\n\
  \n**利益相关者分析**\n利益相关者分析是利益相关者管理的关键组成部分，是识别对项目感兴趣并能够影响项目的内部和外部利益相关者的过程。它有助于了解不同利益相关者的需求，并使项目团队能够平衡竞争性优先级，并提供一种解决利益相关者利益的方法。它还包括利益相关者对沟通方式的偏好以及他们希望了解项目进度的频率。\n\
  \n一旦识别出利益相关者，您就需要与他们合作，识别业务目标以及为实现这些目标而制定的策略。您可能会发现，某些利益相关者不清楚如何实现其愿景，在这种情况下，他们可能还需要定义自己的策略。\n\
  \n- **识别运行原则**：将原则视为决策过程中使用的一组规则。例如，重要的是要识别项目是将使用敏捷方法论运行，还是公司正在通过并购迅速扩张，并需要可扩展性以实现未来的无痛运营。另一个例子可能是，客户体验是扩展业务服务部分的首要任务，这将是决策中的一个重要因素。\n\
  \n- **KPI**：确保您已讨论并商定一组将用于衡量最初提议的进度和利益的 KPI。确保最多拥有两到三个 KPI，并确保它们可以客观衡量。事实上，我建议在文档中也定义这些\
  \ KPI 的衡量方法。这样一来，就不会对 KPI 应如何衡量存在歧义。\n\n定义愿景文档后，接下来要定义的是制定一个稳固的沟通策略。\n\n### 与利益相关者沟通\n\
  \n沟通策略在利益相关者之间创建一致性，尤其是从用户的角度来看，他们了解新工具的必要性、他们将如何受到影响，以及系统将为他们带来的利益。您应考虑创建沟通用户画像，这将帮助您定制沟通内容，并且这些画像可以基于构成利益相关者的角色；例如，可以为高管、高级经理和分析师创建用户画像。创建沟通概况非常有帮助，因为它可以让您定制沟通内容，并向每个利益相关者概况提供恰当的细节程度。\n\
  \n良好的沟通策略会主动解决从高管到最终用户可能提出的问题，并确保您的利益相关者能够毫无顾虑地提供坦诚反馈。如果无法做到，请鼓励他们直接与您联系，并确保您采取行动并向利益相关者提供更新。如果您的项目确实具有变革性，请预料到会有阻力，但现在听到反对意见和顾虑，总比在解决方案开发完成并准备部署到生产环境时再听到要好。\n\
  \n沟通策略文档还能帮助您在每个人都面临海量信息干扰的情况下脱颖而出，但拥有一个所有层级都能理解的清晰策略，将极大提高您实现的成功率。\n\n### 创建沟通策略\n\
  \n沟通策略涉及回答五个 W 和 How 问题：\n\n- **Why?**：介绍启动该计划的详细原因。向组织阐述业务价值，并尽可能将其与部门、团队和个人目标联系起来。这是激励并为您的项目争取支持的好方法。\n\
  - **What?**：正在做什么以及今后将如何做不同。此问题还涉及将用于与利益相关者沟通的渠道，例如电子邮件、群聊消息和会议。\n- **When?**：这是关于传达变更将在何时影响他们的问题。这应该被充分理解并传达。例如，销售团队通常不喜欢在季度末或年底临近时进行系统更改或引入重大变更。\n\
  - **Where?**：这是关于利益相关者可以去哪里获取更多信息、提出疑虑、提问或反馈的问题。\n- **Who?**：这是关于谁受到影响的问题：业务职能、地区或部门？这还可以定义项目团队的角色和职责，有助于明确传达分配给项目的资源，并识别可能被遗漏的任何利益相关者。\n\
  - **How?**：这是关于沟通频率的问题，即沟通是每天、每周、每月，还是其他适合接收者的频率。\n\n不要低估沟通的重要性，因为无论解决方案构建得多么出色，沟通都可能决定您的计划成败。\n\
  \n### 数据架构与治理\n\n如前几章所讨论的，数据是一项资产，必须像组织拥有的实物资产一样进行管理。这需要理解和记录数据在组织系统中的架构和流动方式。\n\
  \n\n\n\n\n在定义数据架构时，一个重要的方面是始终将业务架构放在首位，因为后者从组织的流程、能力和信息等方面揭示了组织的结构。由于信息是业务架构的关键组成部分，在开发数据架构时，您需要确保自己与业务架构的目标保持一致。\n\
  \n一旦理解了业务架构并定义了数据架构，您就进入数据的持续处理阶段，即如何引入和清洗新数据，以及如何保持现有数据的高质量。这其中一个非常重要的组成部分是数据备份和归档。\n\
  \n数据架构和治理能够长期轻松维护数据的可靠性，并提供清晰的理解和指导，因为数据的物理状态也已定义并可用，从而说明如何处理数据异常或大数据量场景。拥有数据架构可以推动与其他系统更轻松的集成，防止组织中的技术债务，并改善用户体验，因为在数据通过数据生命周期时，有关如何处理数据有明确的指导原则。例如，归档机会对象中\
  \ Close Date 字段时间已过去 3 年的机会，将使报告运行速度更快，或者列表视图能够及时加载。\n\n让我们讨论在数据治理背景下，创建用于定义和理解数据架构的工件的实际步骤。\n\
  \n### 创建数据架构和治理\n\n完成此练习的结果可能是一系列工件的组合，但更重要的是花时间彻底执行这些步骤以理解业务意图。然后我们可以将其转化为一个可行的解决方案，以促进业务需求，而不是拖慢业务速度：\n\
  \n- 业务架构和路线图：有必要定义并考虑业务架构和路线图。这确保了从成本角度的可行性，以及在定义数据架构时，能够容纳业务未来需求的可扩展性。\n\n- 物理数据架构：这是应在考虑业务架构的前提下定义的详细数据库级架构。物理数据架构使系统集成更加容易，并在需要更改现有数据架构时能够快速进行影响分析。如果没有它，在定义物理数据模型时，将花费大量时间来解读，并可能犯下根本性错误。\n\
  \n- 数据治理：这定义了将管理哪些数据，并确定了为确保数据质量和数据保护所需的流程、政策和角色。由于每天都有如此多的数据来源和海量数据生成，必须制定明确的政策、角色和职责，规定如何在数据生命周期中处理数据。它还规定了何时提供数据访问权限、提供给谁以及提供多长时间。\n\
  \n- 数据备份和归档：这定义了数据备份和归档所需的政策、流程和工具。从 Salesforce 平台的角度来看，这可能是最容易被忽视的领域，因为直到数据开始出现问题，才会有人注意到它。\n\
  \n在下一节中，我们将回顾技术变更控制。\n\n### 技术变更控制\n\n这涉及在开发和维护软件解决方案时应用软件工程流程和行业最佳实践。这包括解决方案开发、环境管理方面的流程和政策。它还涉及不同类型测试将在哪里进行的详细信息；例如，解决方案的完整测试应在全副本沙箱上进行。拥有有效的技术变更控制机制将有助于有效维护元数据管理的目标。这是因为技术变更将经过已知的流程，并在其流向生产环境的过程中进行沟通和记录。\n\
  \n技术变更控制的另一个方面是技术治理。例如，解决方案如何构建、是否遵循最佳实践、是否遵守 governor 限制、是否可扩展以供未来扩展，以及解决方案的可维护性如何。这还包括发布节奏。关键的紧急修复类发布需要在当天投入生产，而准备投入生产的新举措；升级可能需要遵循常规的每两周或每月一次的节奏。应明确列出所有这些细节，以避免混淆并防止发生任何可能对生产环境产生不利影响的错误。\n\
  \n起初，这可能看起来工作量很大，但它使 IT 能够更快地响应业务的变更请求。请记住，当今企业必须快速变化以保持竞争力，如果 IT 无法跟上步伐，业务将放弃使用该解决方案，或者更糟的是，转向其他可能与组织业务目标和架构不一致的孤岛式解决方案。它还可以最大限度地减少对最终用户的影响，因为他们知道何时将变更提升到生产环境，另一个好处是它建立了与\
  \ IT 的信任，因为他们正在遵循受控的变更流程。\n\n### 实施技术变更控制\n\n有效的技术变更控制将提高速度、降低风险，并防止资源被必须处理的变更数量压垮。要实施技术变更控制流程，请从以下步骤开始：\n\
  \n- 1. **记录当前状态**：此步骤涉及记录您的解决方案设计流程、设计决策中使用的原则、开发所使用的工具和方法论、开发标准以及最佳实践。记录这些内容可让您与其他利益相关者沟通，并将您的做法与\
  \ Salesforce 推荐的做法进行比较。\n\n- 2. **差距分析和未来状态**：这涉及就与行业和 Salesforce 最佳实践相比的当前状况进行差距分析。例如，在开发人员较多的组织中，大多数事情都是通过代码完成的，而不是分析是否可以通过配置来实现相同的结果。\n\
  \n- 3. 完成差距分析后，下一步是确定最佳未来状态。请注意，我说的是“最佳”而非“理想”，因为这是一个持续改进的过程，随着 Salesforce 的发展，您需要不断发展您的组织，因此不存在固定的理想状态。\n\
  \n- 4. **规划并移至最佳未来状态**：这涉及从当前状态规划并移至您的最佳未来状态。这里成功的关键成分是确保您采取小步快跑，而不是朝着未来状态大跨步前进。\n\
  \n- 5. **监控和调整**：没有任何计划是完美的，这一点也不会完美，因此一旦您转入新状态，请监控事情的进展并内部征求反馈，同时也查看类似行业中其他人在做什么。然后对当前流程进行渐进式更改以进行改进，并请记住这是一段旅程，因此在您获得更多关于哪些有效、哪些无效的洞察时，请继续这样做。\n\
  \n让我们回顾拼图的最后一块基础内容，即业务积压。\n\n### 业务积压\n\n**业务积压**取决于业务路线图。应创建一个路线图，考虑所有当前和预期的项目，并将每个项目映射到业务目标。此路线图会根据组织优先级的变化、重组或重大\
  \ Salesforce 版本发布后定期进行审查。\n\n\n\n\n\n待办事项列表是基于业务优先级，与 IT 合作从路线图中创建而来，这些优先级将带来最 **高投资回报率（ROI）**\
  \ 并与组织的愿景和战略保持一致。建立业务待办事项列表为不同业务单元之间的协调提供了路径，并提供了透明度，因为所有参与者都了解待办事项列表中优先事项的重要性，以及它们如何为组织的战略目标做出贡献。\n\
  \n业务待办事项列表还将使企业能够优化其投资并实现最佳 ROI。通过将待办事项与业务目标清晰地映射起来，该流程引入了客观性，从而减少或完全消除内部政治影响决策的任何机会。\n\
  \n### 创建业务待办事项列表\n\n在开始创建业务待办事项列表之前，请确保您已创建路线图。这是通过理解业务愿景和战略，并与高管利益相关者沟通以了解他们的想法来完成的。然后，您会创建一份举措路线图，识别项目之间的任何依赖关系，以便能够适当采取行动。创建业务待办事项列表时需要考虑以下几点：\n\
  \n- **了解 Salesforce 的功能路线图**：这涉及了解路线图中所识别举措的 Salesforce 功能路线图。这对于待办事项列表非常重要，因为您可能计划在未来\
  \ 2–3 个月内实现某项内容，但 Salesforce 可能会在其下一个主要版本中发布相同的功能。了解即将发布的版本中有哪些内容，将有助于您指导路线图的优先级排序，从而优化组织的投资。\n\
  \n- **开发者待办事项列表**：一旦您确定了路线图并理解了 Salesforce 路线图，下一步是与利益相关者会面并讨论，开始识别待办事项列表中的高优先级事项。同样，此优先级应基于愿景和战略文档，并应明确识别业务希望从该举措中实现的价值。\n\
  \n- **细化待办事项列表**：完成第一轮后，开发待办事项列表，再次与业务利益相关者审查并对其进行细化。通常，这时会出现上次遗漏的新事项。\n\n- **沟通**：确保在待办事项列表完成后通知利益相关者。确保您定期审查路线图和待办事项列表，尤其是在公司发生重大变化时，例如重组、收购以及切换到多组织策略。随着路线图的更新，请确保待办事项列表也与其保持一致。\n\
  \n在本节中，我们全面讨论了 Salesforce 中的治理，包括数据治理。这应该为您提供了一个基础，以便在您的组织中实施这些学习。关键的学习是从小事做起，专注于容易实现的目标。这有助于展示已取得的益处，并建立可用于更大规模、更复杂的数据治理举措的势头。\n\
  \n在下一节中，我们将讨论评估数据治理的当前状态以及可用于协助该过程的工具。\n\n### 评估数据治理的当前状态\n\n我们已经讨论了数据治理，它与数据管理的区别，以及如何针对\
  \ Salesforce 实施数据治理政策。但在开始实施数据治理政策和工具之前，建议进行当前状态评估。原因是每个组织都有某种形式的数据治理，没有必要推翻这些做法。相反，我们需要了解这些做法是什么，并识别差距。在验证并意识到现有政策足够充分后，我们可以将注意力转向这些差距，并确保得到处理。\n\
  \n在以下各节中，我们将讨论什么是数据治理评估，评估过程中可能面临的一些挑战，以及如何执行评估的高级步骤。\n\n### 评估当前环境\n\n数据治理评估的目的是记录关于数据治理的知识、技能和态度。以下是一些有助于您了解数据管理环境的问题：\n\
  \n- 组织内部对干净数据及其重要性的意识程度如何？\n- 所有与数据交互的人是否了解其行为的影响？\n- 组织是否采取措施在源头就摄入准确且干净的数据，还是在获取数据后才被动地对数据进行验证？\n\
  - 是否清楚了解哪些字段由营销工具更新，哪些字段在 Salesforce 中主管，或者账户记录是否由多个部门更新，导致意外的数据丢失和准确性问题？\n\n这些都是当前状态评估有助于揭示并记录下来的示例。\n\
  \n### 数据治理评估中的挑战\n\n进行评估时存在一些挑战，归因于几个因素。这些因素与评估的深度、被评估的组织类型，以及通常缺乏一套用于评估组织的强健标准有关，这引入了主观性的风险。\n\
  \n评估的一个常见问题是，它们是作为一种冲动反应而进行的。这通常发生在重大数据相关事件发生后，焦点转向数据。这些评估通常是短暂的，无法为数据治理举措创造所需的支持。事件序列的发展方式是，评估在激动时刻进行，然后没有采取有意义的行动。这就是为什么将数据视为战略资产很重要，这样就可以在数据治理类举措上进行长期投资，并且组织可以充分获取数据相关的收益。\n\
  \n进行评估时，您希望根据定义的指标进行评估，但当没有可用指标时，客观评估就会变得困难。我建议探索组织所在的行业，并确定同行业中其他公司正在做什么。面向行业的协会也可以提供可用作指标基础的数据，例如\
  \ **美国汽车经销商协会（NADA）**，它代表新车和卡车经销商，或者 **美国（US）房地产经纪人协会**。这类协会会从其成员处收集数据，用于改进服务、游说等目的，并且由于数据正在成为如此关键的资产，它们也可能拥有可用作指标的数据。\n\
  \n值得提及的另一个挑战是使用内部资源进行评估。这并非要对内部团队的技能和经验表示怀疑，但盲点大多是在外部方进行评估时被发现的。聘请外部评估员的另一个好处是，想必他们已为多个其他客户和行业完成了此类评估，因此可能拥有执行此类评估所需的经验和技能。\n\
  \n让我们来看看如何进行评估的步骤。\n\n### 进行评估\n\n在本小节中，我们将讨论如何进行评估的高级步骤。请记住，您可能需要根据您的需求以及您正在为之进行评估的组织类型来调整这些步骤：\n\
  \n- 利益相关者分析：向组织中的关键联系人询问将参与评估的团队成员及其角色，以完成利益相关者分析。尽可能收集这些团队成员的详细信息，包括他们的专业领域、技能以及在组织中的经验。在审查文档时，这将有助于您将事情置于上下文中。由于数据治理是业务与\
  \ IT 的合作伙伴关系，请确保每个领域都有良好的代表。\n\n- 审查文档：审查现有文档，以了解当前使用的实践和工具。请确保您先从审查组织的战略目标和短期目标开始，因为它们将有助于形成当前状态文档的上下文。\n\
  \n- 业务需求：审查当前状态文档后，就可以开始采访先前识别的关键成员了。提出问题以澄清您对当前状态的理解，并识别他们的需求和痛点。\n\n在采访用户时，用户还会分享数据质量问题的场景。最好将这些问题记录在数据质量问题日志中，以便传递给相关利益相关者，以便他们可以采取补救措施。\n\
  \n- 评估报告：创建您的评估报告，突出显示现有实践、业务需求、痛点以及您识别出的差距。提出如何填补差距并缓解利益相关者与您分享的痛点的建议。使用企业已有的指标，确定企业应针对的指标，或使用下一节中建议的指标。建议应以我们在“成功管理\
  \ Salesforce”部分中的讨论为基础。\n\n\n\n\n\n### 常见数据治理指标\n\n在本节中，我们将讨论一些可用于衡量数据治理计划成熟度的常见指标。这些指标分为几类，以提供更全面的衡量成功的方法，而不仅仅是关注数据治理某一方面的指标，即数据质量：\n\
  \n- 数据质量：或许是最常见的数据治理指标，以下是数据质量的关键属性：\n  - 完整性：这涉及数据的全面程度。假设你向客户询问其手机号码、家庭电话和工作电话，而客户只提供了手机号码，但从实际角度来看，数据是完整的。此类指标包括包含所需信息的数据字段百分比。\n\
  \  - 准确性：此数据属性反映数据反映现实的程度。例如，如果 CRM 中有联系人的电子邮件，但该联系人已更换公司并有了新电子邮件，则该记录不被视为准确。这还包括数据输入过程中进入系统的拼写错误。此类指标包括衡量数据与错误的比率，较高的比率意味着数据干净，而较小的数字则表明数据存在问题。\n\
  \  - 可审计性：这涉及确保对数据所做的更改可审计，并可以追溯到在哪里、更改了什么以及由谁更改。示例指标包括相对于更改的不可追溯数据的百分比以及已更改数据的百分比。\n\
  \  - 及时性：数据在需要时能够及时获得。如果你向销售运营团队请求特定客户的合同副本，以便更好地谈判追加销售机会，你会期望及时收到数据。此属性的指标是数据的及时可用性，它衡量在提出请求后数据可用的速度。请求可以是手动或自动的，但无论媒介如何，都必须谨慎设定围绕此指标的合理预期。一位高管可能接受在提出请求后\
  \ 3–4 小时窗口内收到数据，而另一位高管可能期望在提交请求后几分钟内收到结果。\n  - 有效性：这衡量数据是否实际上有效。例如，数据可能及时可用，并且可审计、准确且完整，但如果格式不正确，可能无用。考虑日期字段的示例以及出生日期是否输入在字段中；02/03/1999\
  \ 是表示 1999 年 3 月 2 日，还是 1999 年 2 月 3 日？此属性的指标包括遵循定义标准的字段百分比。\n  - 唯一性：此属性关注数据存在多少副本。例如，有两个重复联系人可能会非常令人困惑，因为你不知道哪一个是销售团队正在使用的真实联系人。此属性的指标包括衡量对象中重复数据的百分比。百分比越高，系统中的重复记录就越多。\n\
  \  - 一致性：这涉及组织内数据的一致性程度。例如，如果 CRM 中有名为 Peter Simpson 的联系人，使用免费电子邮件账户，但 ERP 中也有一个名为\
  \ Peter Simpson 的联系人，使用正式的工作电子邮件，那么这两条记录是指同一个人还是不同的人？此类指标包括衡量系统和应用程序之间记录的一致性。\n\n\
  让我们继续审查数据治理的其他指标。\n\n- 数据控制：这衡量公司针对数据所建立的控制措施的合规性。此类别中的指标可以包括已完成元数据的百分比（例如对象、字段、Process\
  \ Builder 等的描述字段已填充）、数据备份频率以及已纠正的数据安全相关问题数量。\n- 组织：这衡量组织在数据治理方面的技能、培训和整体成熟度。此类指标包括接受过数据治理实践培训的员工百分比，以及为每个业务领域（如销售、财务和供应链）确定并分配的业务负责人数量。\n\
  - 基础设施：这与衡量支持数据相关活动的物理基础设施进展有关。此类指标包括使用 MDM 的系统数量以及系统整合导致总拥有成本降低的百分比。\n\n本节讨论了当前状态评估的好处、挑战以及如何进行评估。我还介绍了一些可作为数据治理计划起点的指标。应当注意，还有其他可用的指标，例如数据安全、数据可访问性、数据加密等。组织应自行决定跟踪和衡量什么很重要，但始终应从少量指标开始，并随着组织中数据治理实践的成熟逐步扩展。\n\
  \n我希望通过简要讨论成熟度模型的重要性来结束本节，这些模型可以为客观评估数据治理实践提供良好的基础。我不会详细介绍每个模型，因为这超出了本书的范围，但我在下一节中提供了一些指引，以便你自行研究并确定是否希望使用它们。\n\
  \n### 数据治理成熟度模型的必要性\n\n我们已经了解到，由于数据来源增加、数据量大、分散式运营模式等多种因素，数据管理可能面临挑战。此外，组织和文化障碍以及相互冲突的议程也会使数据治理计划难以实施。另一个挑战是资金有限，而且由于数据治理工作的成果需要时间才能体现，因此很难直观地证明投资回报率（ROI）。尤其是，组织的资金模式倾向于基于项目的工作，而数据治理是一个需要持续投入、配备适当资源和资金才能实现数据真正价值的计划。\n\
  \n能力成熟度模型提供了一个框架，通过该框架，评估数据的当前状态变得更加容易，并可以推导出组织可用于朝着更高能力努力的目标。这些模型传统上应用于软件开发流程，但也已应用于数据治理流程。这些模型还提供了一个框架，用于确定组织需要的数据成熟度水平，以及进入下一级所需的条件。\n\
  \n组织可能决定投资于数据成熟度模型的其他几个原因如下：\n\n- **策略**：实施数据治理计划可能看起来是一项艰巨的任务，涉及许多需要解决的领域。数据治理成熟度模型可以成为从感到迷茫、不知从何开始实施治理到拥有可用于开始实施数据治理流程的蓝图之间的桥梁。\n\
  - **基准比较**：企业对竞争对手或所在行业的相关情报感兴趣。这是一种为数据治理计划辩护的好方法，尤其是在你的表现不如竞争对手或所在行业时。\n\n基准比较之所以重要，还有另一个原因是评估同一业务中地区或全国范围单位的绩效。请记住，即使在同一家公司中，与数据治理相关的实践也会有所不同，尤其是在分散式运营模式下。\n\
  \n- **并购**：成熟度模型还提供了一种工具，以便在评估可能收购或合并的另一家企业时保持客观性。数据问题是问题的重要来源，如果非常严重，可能会阻止公司进行合并或收购。在进行这些交易时，你可以使用成熟度模型不仅进行评估，还能高层次了解如果符合你的并购（M&A）策略，整合两家公司需要做些什么。\n\
  - **法规合规性**：取决于业务性质，组织在数据治理和管理方面可能必须遵守某些监管约束。成熟度模型为监管机构提供了一个框架，用于评估组织并要求其满足特定要求，以便获得或保持合规性。它们不一定要求你必须达到某个级别。假设企业必须达到第\
  \ 4 级，但会提供指导以帮助组织达到该级别。\n- **进度跟踪**：框架也是一种报告进度并传达实现成熟数据治理实践路线图的方式。大多数成熟度模型都有一个编号系统，用于表示模型中的级别并指示成熟度水平，因此更容易传达数据治理的当前状态和愿景。\n\
  \n存在许多能力成熟度模型，例如 Oracle 的数据治理成熟度模型、Gartner，以及来自斯坦福大学和 Open Universiteit Nederland\
  \ 等教育机构的其他模型。你可以在互联网上阅读这些内容。在选择成熟度模型时，需要考虑许多因素和细微差别，我的建议是咨询数据治理专家，由其指导你完成此过程。\n\n\
  在下一节中，我们将讨论隐私法规以及 Salesforce 中用于遵守隐私法律的工具。\n\n\n\n\n\n### 数据隐私与隐私法律\n\n商业社区中收集数据并将其用于趋势分析、报告、预测以及各种其他用途的趋势日益增长。但随着数据收集的增加，消费者对其数据如何存储、使用以及保留多长时间也日益感到担忧。越来越多的老牌公司也遭到恶意行为者的攻击，他们入侵系统并窃取数百万条消费者记录，使其面临风险，其中包括几年前的雅虎数据泄露事件，导致高达30亿个用户账户被泄露。\n\
  \n世界各国政府一直在制定并执行立法，以确保消费者数据得到保护，并期望数据的透明度。这些法规显著影响企业收集、存储和处理消费者个人信息的方式。这些立法旨在提供消费者数据使用的透明度，同时也为消费者在不合规情况下提供法律追索权。\n\
  \n这意味着，那些不主动评估并实施措施以遵守这些法规的组织，可能会面临监管机构处以高额罚款和处罚的风险。不仅如此，如果这些组织成为网络攻击的目标，还会面临巨大的声誉风险。在过去几年中，许多知名企业遭到攻击，其用户数据被泄露，最终被迫支付数百万美元的罚款并重建受损的品牌。例如，英国航空在2018年发生数据泄露事件后被处以约3000万美元的罚款，该事件导致40万名用户的个人和信用卡数据被泄露。\n\
  \n多年来，政府有时是主动地，有时是被动地制定法规，以保护消费者的个人信息。虽然讨论所有这些法规超出了本书的范围，但我将提及其中几条以提供背景，然后详细介绍法规，特别是GDPR和CCPA：\n\
  \n- **GDPR**: 目前，GDPR可能是为保护消费者而制定的最全面、最严格的隐私立法。它由**欧盟**（EU）针对欧盟公民以及处理欧盟境内个人数据的公司制定。\n\
  \n- **CCPA**: 该法案于2020年制定并生效。其主要目的是保护加州居民的数据，并使居民能够拒绝出售其个人信息或了解企业收集了关于他们的哪些数据，等等。虽然不如GDPR严格，但它仍可对不合规企业处以重罚。\n\
  \n- Gramm-Leach-Bliley Act (GLBA): 该法案于1999年制定，适用于提供消费贷款、财务建议和其他金融产品的公司。该法律要求公司向消费者解释其数据共享和保护政策，并采取控制措施保护此类公司持有的消费者数据。\n\
  \n- Payment Card Industry Data Security Standards (PCI-DSS): 这并非严格意义上的政府法规，而是一个独立组织；PCI安全标准委员会为接受、存储或传输信用卡数据的公司执行该标准。关于PCI-DSS的一个有趣之处是，它甚至适用于使用第三方供应商进行信用卡处理的企业。因此，企业有责任确保其用于支付处理的供应商符合PCI-DSS要求。\n\
  \n- 内华达州参议院第220号法案: 该法案于2019年生效，当时内华达州效仿加州制定了该法案。虽然其条款与CCPA类似，但一个关键区别是，内华达法案下的个人不能对企业提起法律诉讼，但总检察长可以对不合规行为处以罚款。\n\
  \n在即将到来的章节中，我们将更详细地讨论隐私法律的必要性，了解数据隐私与安全之间的区别，并深入了解GDPR和CCPA的更多细节。\n\n### 理解隐私法律的必要性\n\
  \n许多人并不知晓，隐私权是《世界人权宣言》（UDHR）第12条的一部分，这意味着隐私是一项基本人权。过去几十年的技术进步使得政府和公司更容易分别利用数据进行监控或商业用途。这一点尤其在爱德华·斯诺登揭露国家安全局（NSA）的间谍计划后被曝光。这凸显了立法机构需要监督和治理，以确保此类计划不会侵犯个人的隐私权。\n\
  \n私营实体利用消费者数据谋取商业利益的一个例子是剑桥分析丑闻，该事件未经Facebook消费者同意使用其数据，以影响美国2016年大选的投票。在实施严格的隐私法律并全面执行的情况下，私营公司知道边界在哪里，以及如果违反这些法律可能面临的后果。\n\
  \n年轻人有时会在网上发布可能被视为不恰当的内容，这可能会降低他们日后的就业机会。另一个方面是，前任浪漫伴侣出于报复目的发布某人的露骨和私密图像。这可能会毁掉一个人的生活。制定隐私政策可以为补救和防止此类事件发生提供一种方式。GDPR的“被遗忘权”赋予个人请求存储其数据的实体完全删除其信息的能力。\n\
  \n隐私法律还保护言论自由这一权利。想象一下，你所说或写的一切都被追踪，然后这些信息被雇主、银行或其他公共机构用来对付你。隐私法律保护这种言论自由，也让你掌控自己的数据。它们让你决定数据在何时、何地以及如何被使用，并防止你的数据被强大的公司和个人利用。\n\
  \n言论自由的另一个方面是自由参与政治的权利。隐私法律通过允许你基于政治观点投票而不面临任何负面后果来保护这一权利。这就是为什么投票被视为保密行为，你没有义务告诉任何人你投给了谁，包括你的雇主。对于家庭成员来说，这也非常重要，因为一个成员未必认同另一个成员的政治观点，并可能投出不同的票。\n\
  \n信任是社会运作的一项基本价值。隐私法律有助于建立和增强这种信任。你会选择与哪家银行做生意？是那种出于商业原因将你的数据出售给众多数据收集公司（这些公司又将数据转卖给感兴趣方）的银行，还是那种制定了政策和程序，并对你透明地说明他们如何保护和处理你数据的银行？这就是PCI-DSS等法律存在的原因之一，即保护你的个人数据不被滥用，同时也保护你的财务信息。你可能注意到，许多网站提示你通过输入电子邮件来订阅，并显示一条类似“你的数据绝不会出售，仅用于特定目的”的消息。他们正在努力对你保持透明，并向你保证你的数据不会用于声明目的之外的任何用途。\n\
  \n在下一节中，我们将回顾数据隐私与安全之间的区别。\n\n### 数据安全与数据隐私\n\n理解数据安全与隐私之间的区别很重要。两者并不相同，但相互关联，对组织保护数据至关重要。值得一提的是，保护数据不仅仅是IT部门的职责，而是需要一种全面的、全组织范围的方法，配合适当的培训和问责制，让每个人都感到并以确保数据保护的方式行事。\n\
  \n\n\n\n数据安全旨在保护您的数据免受未经授权的访问和恶意使用。实现此目的的方式因组织而异，取决于数据量、数据类型以及其他将驱动对合适工具和流程产生需求的因素。另一方面，数据隐私涉及定义您如何收集、使用、共享和丢弃您管辖范围内数据的政策和流程。与数据安全相比，数据隐私更具普遍性，因为法律适用范围更广。但是，可能会有针对企业所属某些行业或协会施加的法律或规则。例如，PCI\
  \ 安全标准委员会是一个私营实体，但它对成员组织必须遵守以获得或维持其合规性的数据施加了规则。\n\n### 了解业务风险\n\n作为数据架构师，您必须意识到，当组织开始收集和处理个人数据时，组织正在承担固有风险，必须妥善了解这些风险，以制定风险缓解策略。作为数据架构师，您有责任指出这些风险，以便让相应的团队成员（例如，隐私法律官员）参与这些讨论，从而讨论风险并采取适当措施来解决它们。\n\
  \n请记住，隐私法律并非旨在扼杀企业，而是试图在企业对数据的需求与尊重和保护个人数据隐私之间取得平衡。以下是企业在处理个人数据时通常面临的几种常见风险：\n\n\
  - **围绕数据访问缺乏控制**：有些组织缺乏对谁可以访问个人数据以及是否根据其职能需要访问该数据的控制；也就是说，访问个人数据必须基于 *需知* 原则。这也与确保建立流程相关，即当授权人员离开公司时，其对个人信息的访问应立即停止，以防止发生任何不良的数据事件。\n\
  \n- **缺乏处理请求的流程**：GDPR 等隐私法律要求组织作为法律 *被遗忘权* 条款的一部分删除个人数据。如果没有建立流程来响应或根据法律要求完全删除信息，可能会导致组织面临重大罚款。\n\
  \n- **围绕共享数据的透明度**：一些法律要求组织必须明确收集的个人数据如何使用，包括与第三方共享。未能做到这一点可能会导致公司被认定违法。\n\n- **应对数据丢失**：公司通常倾向于披露个人数据是否被盗或未经授权的访问，但一些法律规定必须及时通知受害者。这要求公司建立适当的流程和程序来应对此类情况。\n\
  \n- **应用程序和系统漏洞**：无论是本地还是云端，系统和 Web 应用程序周围的安全性不足都可能导致数据泄露。过去几年中发生过多起泄露事件，其中一些涉及非常大的知名企业。例如，2017\
  \ 年 Equifax 发生泄露时，约有 1.48 亿用户受到影响。2013 年 Adobe 发生泄露时，约有 1.52 亿用户受到影响，因为加密较弱，尽管密码经过加密存储，但密码提示以明文形式存储。\n\
  \n这方面的另一个方面是不仅要保护静态数据，还要保护系统和应用程序之间传输过程中的数据。有技术标准，完全遵守这些标准可以确保数据的安全传输。\n\n- **收集超过所需的数据**：组织应专注于仅收集所需的数据。您收集的数据越多，承担确保数据得到妥善存储和处理的责任就越大。如果一家企业提供脊医服务，它可以收集用于诊断目的的患者数据，但如果它决定收集患者家庭数据，那么它拥有的数据就超过了需要妥善保护的数据。经验法则应该是仅获取业务流程真正需要的数据。如果您预计未来需要该数据，则应设计业务流程和技术架构，以便正确获取和保护这些额外数据。\n\
  \n- **将数据用于非其目的**：收集数据时，请确保您的组织与个人充分透明且清晰地说明数据将如何使用。将数据用于某一目的，但随后将其用于其他目的，可能构成合规违规。隐私法律通常要求个人数据收集的范围及其使用方式。GDPR\
  \ 等法律要求，在请求时，组织必须告知请求者其持有的关于个人的所有信息。这显然需要建立政策和程序，以确保及时给出回复，因为未能做到这一点可能导致不合规法律。\n\
  \n现在我们已经讨论了数据隐私的重要性及其对企业的重要性，让我们深入了解 GDPR。GDPR 和 CCPA 等隐私法律很复杂，需要专业知识和工具才能在组织中正确实施。以下讨论并非旨在穷尽，而应被视为向您介绍法律的一些关键组成部分并为今后更深入的探索奠定基础的一种方式。\n\
  \n### 全球数据保护条例（GDPR）\n\n多年来，欧洲一直在隐私法律方面处于领先地位。它引入了最初的欧盟数据保护指令，该指令于 1995 年成为法律，要求公司和组织妥善保护个人数据，并对该数据有明确、合法的用途。然而，最近，在\
  \ 2018 年，一项名为 **GDPR** 的更全面的隐私法律生效。GDPR 比其前身更全面，大大扩展了个人隐私权，并有义务让符合定义标准的组织遵守该法律。\n\
  \n其主要目的是让个人控制其个人数据的使用方式，并整合并提供单一隐私法案，以便组织轻松实施。值得注意的是，只要组织处理属于欧盟公民的数据，GDPR 就适用于欧盟境外的组织，这意味着组织是否在欧盟拥有实体存在是无关紧要的。违反\
  \ GDPR 法律可能会导致高额罚款，即 2000 万欧元或年全球收入的 4%，以较高者为准，具体取决于违规程度及其造成的损害。\n\n在接下来的几个小节中，我们将尝试了解\
  \ GDPR 的要求，然后在另一节中，我们将讨论 CCPA。\n\n### 了解 GDPR 术语\n\n在深入了解 GDPR 的要求以及如何使用 Salesforce\
  \ 进行合规之前，让我们先了解 GDPR 中使用的一些术语：\n\n- **数据主体**：可根据姓名、位置数据或社会安全号码等属性识别的人员。\n\n- **个人数据**：与数据主体相关的任何和所有信息，例如年龄、性别或实际地址。\n\
  \n- **敏感个人数据**：与数据主体相关的个人数据，用于识别其政治观点、宗教信仰、健康信息或种族，例如，某某政党的成员，或指纹扫描。\n\n- **控制者**：这是确定处理个人数据目的的实体。例如，为了向个人提供就业而收集数据的雇主成为该数据的控制者。\n\
  \n- **处理者**：根据控制者的指示处理个人数据的任何实体。例如，当雇主将候选人的详细人口统计信息输入 Salesforce 时，Salesforce 成为数据的处理者。\n\
  \n- **假名数据**：这被视为无法在不将其与存储在其他地方的其他信息关联的情况下关联到数据主体的数据。例如，当候选人访问公司页面时，网站会跟踪候选人并存储其\
  \ IP 地址，当该 IP 地址与关于候选人的其他可用信息关联时，可以识别出数据主体。\n\n让我们讨论构成 GDPR 要求基础的关键原则。\n\n### GDPR\
  \ 要求的基础\n\nGDPR 隐私法律中有许多要求。了解这些基础原则将帮助您理解这些要求的本质以及法律意图的一定程度。请记住，在自行解释法律之前，您应该咨询在这一领域具备必要知识和经验的合格人员。GDPR\
  \ 下违规罚款高昂，并对企业声誉产生负面影响：\n\n- **公平性和透明度**：组织必须公平且透明地处理个人数据。在我们之前的候选人申请工作的示例中，雇主必须对收集的关于候选人的信息以及雇主将如何使用这些信息保持透明。\n\
  \n- **数据收集目的**：这与仅为指定目的收集个人数据有关，且不能用于数据收集时说明的明确目的以外的任何其他目的。例如，一家为个人出售数据的数据收集公司会为招聘启事收集候选人数据。收集的个人数据用于招聘目的，因此不能为了商业利益而出售。\n\
  \n- **数据最小化**：该原则规定仅收集与所述目的所需且相关的个人数据范围。例如，雇主不能询问候选人是否拥有自己的住宅、驾驶什么车辆以及车牌号码，因为在大多数情况下，这些细节与决策过程无关。这的一个常见示例是手机应用程序，其中一些应用程序需要比应用程序目的所需的更多访问权限。\n\
  \n\n\n\n**准确性：** 个人数据必须准确并保持最新。例如，在我们的示例中，候选人获得了工作，6个月后搬到了新家。他们向人力资源部发送电子邮件告知其新地址。公司必须确保其系统中的地址得到更新。及时这样做很重要，因为员工可能已搬至免税指定区，当地税务机关必须被告知这一变化。\n\
  \n**数据删除：** 个人数据仅应在为原始目的存在需求的期间保留。如前所述，未经同意将数据用于其他目的不被允许。例如，如果候选人接受了面试但未获录用，则公司必须删除其数据。\n\
  \n**数据安全：** 这一原则规定，组织必须实施适当的技术和组织措施，以保护个人数据免受未经授权的访问和使用。根据所收集数据的敏感程度，它建议使用加密、去标识化和匿名化等几种技术。使用去标识化技术时，GDPR\
  \ 要求可用于识别数据主体的附加数据必须单独存储。搜索 AOL 搜索数据泄露，了解没有适当保障措施的数据去标识化如何导致数据泄露，从而使一些人根据其搜索记录被识别出来。以下是《纽约时报》2006\
  \ 年报道的一个故事：https://www.nytimes.com/2006/08/09/technology/09aol.html.\n\n### 定义\n\
  \n**匿名化：** 这涉及从数据主体中完全删除可识别个人主体的属性。匿名化的一个关键方面是，如果数据被进一步处理，数据主体无法以任何方式被识别。\n\n**去标识化：**\
  \ 这涉及删除个人数据并将其替换为假名，因此称为去标识化。虽然匿名化的数据永远无法恢复到原始状态，但去标识化的数据不同，经过进一步处理后可用于识别数据主体。\n\
  \n**加密：** 这涉及将数据的原始形式转换为一种替代形式，只有授权各方才能访问。虽然数据在传输过程中仍可能被拦截，但加密提供了保证，即拦截者无法读取，因为需要加密密钥才能读取消息。\n\
  \n在下一节中，我们将讨论数据主体的关键权利。\n\n### 数据主体的权利\n\nGDPR 赋予数据主体权利，供其控制数据控制者对其数据的使用。这些权利可帮助我们更好地理解\
  \ GDPR 法律，并协助我们与**：这些是响应安全漏洞的过程，包括采取补救措施以及根据 GDPR 要求通知受影响各方。\n  - **培训**：应尽早规划此事，让员工以及共享其个人数据的外部各方理解隐私政策的必要性、其实施方式，以及违反法律对公司造成的后果。可提供工具以举报数据滥用或就与数据处理相关的活动寻求澄清。\n\
  \n\n\n\n- **频繁审计**：一旦您已实施符合法律要求的流程和工具，开展频繁的内部审计以确保持续合规非常重要。许多组织会发现自己受到多部隐私法律的约束，最好是聘请一名接受过隐私法律培训的内部审计员来执行审计，以便在问题出现之前发现它们。\n\
  \n- **记录合规性**：一旦初始基准已建立且流程和工具已就位，组织即可开始记录合规活动。这些活动可以采取DPIA、数据清单、数据处理登记册以及其他与合规相关的制品和文档的形式。组织还可以决定任命一名**数据保护官（DPO）**，负责监督组织的数据保护策略及其实施，以确保组织符合GDPR要求。\n\
  \n大多数组织选择定期进行DPIA或审计，以确保数据保护计划持续符合要求。随着新数据来源的出现以及所收集数据量呈指数级增长，这一点尤其重要。\n\n现在我们已了解GDPR的重要术语和原则，在数据架构的背景下协助组织实施这些原则，并向开发者和分析师等其他利益相关者提供指导，将会更加容易。\n\
  \n让我们讨论一下最近在加利福尼亚州引入的另一部隐私法，即CCPA。\n\n### 加州消费者隐私法案（CCPA）\n\n美国于1974年通过了隐私法案，成为世界上最早采用隐私法律的国家之一。该法案限制了联邦机构在数据收集方面的使用。鉴于美国的治理体系，各个州也可以通过法律来规范其居民个人数据的使用。\n\
  \n美国加利福尼亚州最近通过了一项名为CCPA的隐私法，以保护其居民的私人数据。CCPA于2020年1月1日生效，赋予加州居民对其个人信息的收集和使用拥有更大的控制权。我们将在本节后面探讨该法律的一些具体细节。我们需要理解的是，它赋予消费者了解企业正在存储其哪类个人信息，以及企业是否共享其个人信息和与哪些实体共享的权利。它还有其他条款，赋予消费者访问或请求删除其个人信息的权利。\n\
  \n让我们在下一节中查看CCPA使用的一些术语。\n\n### 了解 CCPA 术语\n\n让我们查看CCPA中使用的术语，以便更好地理解后续讨论。这些术语虽然看起来非常简单且通常被理解，但在法律眼中具有非常具体的含义。这些术语以及随后关于法律具体内容的讨论在此作为一般参考列出，而非法律建议。请务必始终咨询经过培训并具备必要经验的合格人员：\n\
  \n- **企业**：CCPA将任何符合以下条件的实体定义为受该法律约束：年收入2500万美元或以上，或每年收集50,000名用户的信息，或其超过一半的收入来自出售个人信息。必须指出的是，此处的企业是指世界上任何处理加州居民个人信息的实体。\n\
  \n- **消费者**：加州的自然居民。\n\n- **个人信息**：可识别特定消费者或可合理与其关联的任何信息。这包括商业信息、生物识别信息、互联网或其他电子网络信息，以及地理位置数据。\n\
  \n- **处理**：对个人数据执行的任何操作，无论是手动还是自动。\n\n- **服务提供商**：代表企业处理数据，且企业已基于合同中商定的合法目的向其披露消费者个人数据的实体。这意味着，企业无需直接从消费者处收集个人信息，该法律也可被视为适用。如果企业从另一家企业接收个人信息，且符合企业的定义，那么无论该个人信息是如何获得的，该企业仍将受CCPA约束。\n\
  \n让我们从企业的角度了解该法律的一些细节。\n\n### 组织的关键要求\n\n在本小节中，我们将讨论企业遵守CCPA的一些关键要求：\n\n- **尊重消费者权利**：CCPA对企业施加了若干义务，包括响应披露请求、尊重退出请求以及响应数据删除请求等法律中的其他条款。该法律还要求企业为消费者提供两种或更多方法来提交请求。\n\
  \n应当注意的是，在涉及数据可能被执法机关要求的情况下，企业在履行消费者的个人数据删除请求前需要仔细分析。在这类情况下，企业无需满足消费者的请求。\n\n- **同意**：法律要求企业为消费者提供清晰且显著的链接，以便他们退出个人信息的出售。企业必须确保消费者退出个人数据出售时无需创建账户。\n\
  \n- **培训**：该要求确保企业必须为参与处理CCPA相关事务并向消费者提供如何行使CCPA下权利信息的人员提供充分的培训。\n\n- **披露**：这要求企业必须在收集信息之前或收集时披露所收集的个人信息类别。披露必须详细，涵盖所收集的个人信息类别、信息来源的类别、信息收集目的以及将访问收集信息的任何第三方。\n\
  \n法律还要求企业在其公开的隐私政策页面上提供此披露。如果未维护此类页面，则必须在网站上进行披露，并且这些披露必须每年更新。当消费者通过联系企业直接请求访问时，这些披露也必须向其提供。\n\
  \n- **供应商合规**：CCPA法律要求处理个人信息的服务提供商也必须遵守该法律。法律规定，企业必须与服务提供商签订合同，要求其将数据处理限制在合同约定的业务目的范围内。它还要求服务提供商证明合同并声明其理解限制并将遵守这些限制。\n\
  \n如前所述，这些并非法律的所有条款，并且您可能已明白，该法律有例外和细微差别，需要专业的法律知识。\n\n现在我们已经了解了企业遵守CCPA的关键要求，让我们回顾一下CCPA下个人的部分权利。\n\
  \n### 消费者权利\n\n隐私法案的范围是规范美国联邦机构对数据的收集、使用和传播。CCPA的任务是加强加州公民的隐私权利和消费者保护。让我们逐一简要回顾这些权利：\n\
  \n- **知情权**：根据此权利，消费者有权获得关于企业正在收集的个人信息类别和类型、以及收集该数据目的的清晰、透明的信息。这必须在收集个人信息之前或收集时完成。此权利的一个显著特点是，还必须披露共享数据的第三方身份。这堵住了一个巨大的漏洞，以前不需要披露第三方身份，没人能知道有多少、哪些第三方可以访问您的数据。\n\
  \n- **访问权**：根据此权利，消费者可以要求企业披露其持有的关于消费者的个人信息类别、个人信息收集来源的类别、目的、共享个人信息的第三方，以及企业持有的关于消费者的具体数据元素（例如电子邮件地址和电话号码）。\n\
  \n应当注意的是，虽然这项权利看起来很简单，披露这些信息也不困难，但对于可能存在个人信息的非结构化数据（例如文本和电子邮件）会带来挑战。\n\n- **退出权**：消费者有权要求企业停止出售其个人信息，一般规则是禁止出售16岁以下儿童的数据，除非存在特定情况。\n\
  \n- **请求删除权**：此权利赋予消费者要求企业删除其个人信息的能力。当然，法律下存在例外情况，企业不必遵守这些请求。例如，企业检测到安全事件，或涉及起诉参与欺诈、欺骗或恶意活动等恶意行为的人员。\n\
  \n\n\n\n- 平等服务与定价权：该权利确保消费者不会因行使 CCPA 下的权利而在被收取不同价格或服务质量发生变化方面受到不同对待。\n\n现在我们已经了解了\
  \ CCPA 下的关键消费者权利，让我们来看看在贵组织中实施 CCPA 时的一些注意事项。\n\n### 实施 CCPA\n\nCCPA 是一项相对较新的法律，在撰写本书时该法律是在几年前通过的。它经历了许多修正案，预计随着时间的推移，加州总检察长还会做出更多变更。这对企业来说是一个挑战，因为它们必须保持警惕，并及时了解法律中新引入的变更。\n\
  \n我建议首先遵循“遵循 GDPR”章节中推荐的相同步骤，并根据您的需求进行调整。关键是要有专家资源在整个过程中为您提供指导。\n\n现在我们已经更详细地了解了\
  \ GDPR 和 CCPA，在下一节中，我们将了解如何实施这些法规，以及 Salesforce 提供哪些工具来协助执行这些隐私法。\n\n### 实施隐私法律的\
  \ Salesforce 工具\n\n我们已经审查了 GDPR 和 CCPA 隐私法，但还有其他法律。例如，加拿大的《个人信息保护和电子文件法》(PIPEDA)\
  \ 或日本的《个人信息保护法》(PIPA)。这些法律的基本原则是相同的，即在企业为提供产品和服务所需的数据与保护消费者数据、让消费者控制其数据使用方式之间取得平衡。\n\
  \n鉴于 Salesforce 被不同行业的众多公司在全球范围内使用，Salesforce 在平台上提供了可用于满足这些隐私要求的工具，而不是为每项法律提供特定的解决方案。由于两家企业的运营方式都不相同，且某些企业可能不受这些法律约束，这提供了更大的灵活性。\n\
  \n我们将简要回顾这些工具，并通过示例更好地理解它们，但请注意，各平台使用的工具可能不同。例如，Commerce Cloud 的数据删除请求实现将与 Sales\
  \ Cloud 的删除请求不同。在以下讨论中，我们将查看 Sales Cloud 示例，因为它更常用，这里的意图不是进行详尽的讨论，而是提供如何遵守法律的指导。作为架构师，您需要与隐私官合作以了解法律要求，然后实施适合您的业务和所用平台的解决方案。让我们来看看与隐私法律相关的一些请求以及它们在\
  \ Salesforce 中如何处理：\n\n- **个人数据删除请求：** 隐私法通常要求在数据不再用于其原始用途或客户请求删除时删除数据。请确保考虑客户个人数据可能存在的所有来源，例如，可能已用生产数据填充的全副本沙箱或开发者沙箱（沙箱数据应匿名化，除非有真实的业务理由使用生产数据）。\n\
  \n收到删除请求时，请考虑所有可能包含个人数据的记录。如果是潜在客户，请先从线索记录、联系人、任务、日历事件以及任何自由文本字段入手。CPQ 等附加包或 Sales\
  \ Cloud Einstein 等附加功能需要特别考虑，因为仅从 Sales Cloud 记录中删除数据并不会将其从这些包或功能中删除。例如，在 CPQ 中，您需要从报价、合同、发票和订单等其他对象中删除记录。\n\
  \n- **同意管理：** 同意管理是跟踪用户希望如何与贵组织交互的请求。这包括尊重退出请求，或在最初给予同意后同意被撤销时删除数据。\n\n对于这类场景，请确保已搜索联系人和线索记录，并删除字段中的个人信息。这些通常包括电话、电子邮件和邮寄地址。电子邮件退出和拒绝致电字段存在于线索和联系人对象上。应检查这些字段。请注意，仅检查这些字段不会阻止通过自定义流程发送的电子邮件，例如，如果您不使用专门的营销工具，而是使用\
  \ Lightning Flow 向潜在客户发送电子邮件。您需要确保流程检查这些标志并适当处理。\n\n如果您正在使用 Sales Cloud Einstein，且客户不希望将其数据用于机器学习模型，则可以在包含个人信息的对象上创建一个名为\
  \ `AI__HasOptedOutProfiling__c` 的自定义字段，并为特定客户记录将其标记为 TRUE。这将确保客户的数据不会用于机器学习模型。如果您使用的是\
  \ Salesforce Inbox、Einstein Activity Capture 或 Einstein Automated Contacts，只需在“设置”下的“数据策略”中排除该电子邮件即可。\n\
  \n- 数据处理限制：这涉及限制对客户数据的处理。例如，当客户发现其数据不正确并要求公司停止进一步处理数据时，就会发生这种情况。例如，客户发现其信用报告存在问题，并致电信用管理机构，要求其在数据更正之前暂停任何进一步处理。\n\
  \n在这种情况下，您可以使用数据导出功能或首选的数据导出工具将数据从 Salesforce 导出，并在需要时从 Salesforce 删除记录。如果由于技术原因这具有挑战性，请考虑设置某种标志，每当数据被另一个\
  \ Salesforce 应用程序使用或与外部系统集成时都会检查该标志。这将防止记录被处理。\n\n- 数据请求：某些法律要求在客户请求时向其提供数据。例如，当潜在客户决定停止有关机会的任何进一步沟通，并要求访问组织持有的关于该个人的数据时，就会出现这种情况。在某些情况下，执法机构或法院可能会要求访问企业持有的数据。\n\
  \n可以通过使用数据导出轻松满足这类请求。对于 Salesforce Inbox 或 Einstein Activity Capture 等功能，您需要与 Salesforce\
  \ 支持创建一个案例，以请求访问发送给客户的电子邮件的已读回执，或销售代表为 Einstein 电子邮件洞察提供的反馈。\n\n如本节所讨论，可能出现多种不同的场景，并需要平台具有灵活性，以确保在不影响业务常规运营的情况下满足这些需求。为了让组织更轻松地管理这些隐私政策并遵守它们，Salesforce\
  \ 推出了一款名为 Customer 360 Privacy Center 的工具。我们将在下一节简要讨论该工具。\n\n### Customer 360 隐私中心\n\
  \n如前所述，Customer 360 隐私中心的核心重点是让组织更容易遵守隐私法律。它通过在收到客户请求后对数据进行去标识化、删除或启用数据可移植性来实现这一点。随着客户对数据隐私的意识增强，数据可移植性变得越来越重要，因为客户会迁移到提供与可比功能相当的更优数据隐私保护的平台。\n\
  \nCustomer 360 隐私中心还为组织提供设置策略来管理组织中客户数据保留期的功能，并允许在记录或字段级别设置数据匿名化，以符合 *被遗忘权* 请求。\n\
  \n隐私中心工具还可用于将个人身份识别信息安全地传输给客户。该工具的数据可移植性功能包括一个策略创建器，可以识别和汇总客户个人信息所在的位置。然后可以使用 API\
  \ 生成包含该数据的文件，并将其与客户共享。\n\n如本节所讨论，Customer 360 隐私中心可以使用单一工具简化隐私法合规，而无需在组织更新时担心合规问题。另一个好处是，由于该工具由\
  \ Salesforce 管理，他们会随着法律的演变保持其更新。\n\n利用本节涵盖的知识，您可以就如何结合 Salesforce 实施这些隐私法律开展对话，同时还应咨询法律部门以确认您的理解和实施内容。Salesforce\
  \ 提供可用于协助合规的工具，但请不要低估定义和改进业务流程的重要性。如果其旨在支持的业务流程未定义，或已定义但未精简，那么再好的技术也会失败。\n\n###\
  \ 把所学内容综合起来\n\n让我们将本章的所有学习内容整合到一个案例研究中，看看这些学习内容如何在实践中应用。我们正在与一家名为 **Alpha Mobility\
  \ Services (AMS)** 的假设公司合作，该公司是一家大型全球电信公司，在 31 个国家为 B2B 和 B2C 客户提供移动和互联网服务。\n\n\n\
  \n\n\nAMS 通过自然增长和收购双重方式发展，其技术版图中形成了大量的 CRM、营销和 ERP 系统。数据架构师团队一直致力于将各种 CRM 整合到 Salesforce\
  \ 中，目前 Salesforce 已在全球范围内使用。公司使用多个网页到线索表单来捕获潜在客户数据并在 Salesforce 中创建线索记录。**销售开发代表（SDRs）**团队也在系统中创建线索，并将其路由到销售团队。\n\
  \nAMS 系统中的线索超过 300 万条，商机超过 100 万条。为了支持目的，AMS 已实施 Service Cloud 并使用社区来支持客户。它还设置了社交客户服务，允许客户通过\
  \ Twitter 和 Facebook 与公司开启案例。它还使用网页聊天，允许客户在区域客户支持中心离线时创建案例。最后一次统计显示系统中存在大量未关闭的案例。初步分析得出结论，其中一些案例是由于错误创建的重复案例造成的。\n\
  \n### 问题\n\n使用该系统的各团队已持续数月抱怨数据不完整，而这些数据对市场营销或销售团队至关重要。他们发现联系人记录已过时且不可靠，除非是新入职的客户。在一些极端情况下，销售代表联系某位联系人后发现，该人员已搬家且不再任职于该公司。这导致销售周期延长、追加销售机会减少，以及留住客户变得困难，进而导致客户流失率远高于行业平均水平。\n\
  \nSalesforce 中重复数据泛滥，导致单个客户的账单和订单数据分散在多个账户中。这会导致任何与客户支出、留存以及公司应将精力集中在何处以增加收入相关的有意义报告出现问题。鉴于此以及前面提到的数据质量问题，正在运行的自动化流程也加剧了局势，因为它们依赖的数据并不十分可靠。公司已聘请一名数据架构师来制定计划并实施治理结构，以纠正这些问题。\n\
  \n### 解决方案方法\n\n新聘的数据架构师已与不同的业务团队以及管理团队进行了初步会议，以了解问题及其可能原因。数据架构师还获得了 CRM 整合项目的实施文档以及\
  \ 7 年前实施 Salesforce 时的初始设置文档。\n\n掌握所有这些信息并审阅文档后，数据架构师计划分两步解决问题。步骤 1 是对当前状态进行评估，记录并提交评估报告。步骤\
  \ 2 是修复现有问题，并建立治理流程和工具，以防止并尽量减少未来的数据质量问题。\n\n### 步骤 1 - 评估当前状态\n\n数据架构师希望确保对评估包含的内容有明确的范围定义。根据目前收集的信息，他们制定了一份范围文档，概述了评估的边界、退出标准、评估团队、他们将采用的评估方法，以及迄今识别出的任何假设和约束。\n\
  \n范围文档经管理团队审阅并批准后，数据架构师会进行利益相关者分析练习，识别业务用户、他们对项目的利益和影响，以及与这些用户沟通的最佳方式。\n\n架构师已审阅提供的文档，并计划与识别出的用户进行\
  \ 1:1 会议并开展一些调查。审阅调查结果和会议记录后，架构师决定创建一个业务需求日志，其中将包含识别出的所有需求以及用户提到的痛点。\n\n数据架构师准备了一份评估报告，概述了痛点、业务需求以及消除痛点并满足业务需求的建议方法。架构师还建议了一些与衡量数据完整性和准确性相关的指标，这些指标可用于衡量下一阶段的成功。\n\
  \n### 步骤 2 - 修复当前问题并实施计划\n\n数据架构师建议立即采用去重工具来修复现有的重复记录。推荐的工具还具有设置重复规则的功能，这有助于防止创建新的重复记录。架构师还推荐了另一种工具，用于从提供数据增强服务的数据管理公司丰富数据。\n\
  \n数据架构师制定了一份愿景文档，概述了治理计划的业务目标、方法、团队以及负责将计划付诸实施的角色。他们还建议了一些指标，以确保在整个过程中持续衡量成功。\n\n\
  数据架构师还在与内部沟通和培训团队合作，制定沟通数据价值的计划，并强调数据是每个人的责任。与此同时，架构师与 Salesforce 管理员合作，识别精简页面布局和引入验证规则的机会，以便在源头正确输入数据。架构师指出的另一个关键方面是，Salesforce\
  \ 缺乏适当的备份和恢复策略。架构师为此推荐了一种工具，并向 Salesforce 管理员提出了方法，以确保定期进行备份，并在需要时执行恢复。\n\n数据架构师已与企业架构师团队合作，建立一个流程，以确定现有版图的业务架构和路线图。在这些讨论中发现，现有\
  \ Salesforce 应用程序的业务需求和增强需求并未记录在集中位置。为了解决这个问题，架构师建议实施业务积压项，并与业务用户定期召开会议以优先排序积压项并报告进度。\n\
  \n在实施这些变更后，架构师已创建多个 Salesforce 报表，并使用已实施工具的报表来衡量数据质量，同时将这些报表连同商定的 KPI 一起报告给管理团队。项目第一阶段已完成，用户已经报告说，他们正在处理的数据满意度有所提高，重复记录也减少了，而这些重复记录以前他们经常遇到。有了数据增强工具，联系人和线索记录中的数据更加最新和准确，减少了销售代表以前为了查找这些信息所花费的时间。\n\
  \n### 摘要\n\n本章我们讨论了许多话题。我们从企业数据治理开始，解释了它是什么，以及它与数据管理有何不同。我希望我们关于数据治理的益处和缺乏数据治理的风险的讨论，能让您深入理解并认可其对任何组织（无论规模大小）的重要性。我们还强调了元数据管理（数据治理的重要组成部分）为何重要，以及围绕元数据管理缺乏有效治理如何阻碍我们高效治理数据的能力。\n\
  \n一旦我们理解了数据治理的重要性，下一步逻辑就是我们该去往何处，而这正是本章所涵盖的内容：评估您当前的数据治理状态。我们讨论了当前状态评估的一些挑战，并提供了您可以采取的实际步骤来进行一次成功的评估练习。我们最后讨论了一些常见指标，这些指标可以帮助您评估当前状态，并为未来状态设定目标。\n\
  \n在本章的最后一部分，我们详细讨论了隐私法律。我希望阅读后，您能认识到这些法律对企业至关重要，不仅出于合规考虑，还为了保护客户信息并建立客户信任。由于我们生活在全球经济中，GDPR\
  \ 和现在的 CCPA 可能是应用最广泛的法律。GDPR 是因为它覆盖了欧盟这个巨大的经济区域，而 CCPA 是因为它是世界上最大的经济体之一。此外，我们还讨论了可以在\
  \ Salesforce 中立即使用的工具和技术，以设计和实施遵守这些法律的合规性。\n\n总之，本章应该为您提供了实施数据治理计划所需的知识和工具，包括这些计划涉及的内容以及如何实施。从当前状态评估的建议方法开始，将使您能够关注最需要关注的领域。数据隐私法律变得越来越重要，我们关于这些法律的讨论应该让您有信心进行那些对话并在您的组织中实施它们。\n\
  \n在下一章中，我们将讨论 Salesforce 平台上的性能以及可用于监控性能的不同工具，以及我们如何利用它们设计解决方案，以确保我们的应用程序可扩展且高性能。\n\
  \n### 问题\n\n- 1. **精准印刷（PP）**一直面临严重的数据问题，最近聘请了一名数据架构师来帮助清理其销售主数据。架构师运行了报表，并在分析数据后提交了一份报告，指出了数据中的主要问题。数千条记录被识别为重复或不完整。数据架构师可以建议哪些步骤来清理数据并保持良好状态？（选择三个答案）\n\
  \n  - a) 雇佣实习生，让他们识别重复记录并手动删除。\n  - b) 使用第三方工具验证数据。\n\n\n\n\n- c) 实施重复管理规则以检测重复项，并向用户显示警告或错误消息。\n\
  - d) 评估安全设计，如有需要则调整共享规则。\n\n2. Frugal Budgets 是一家全球服装公司，并决定实施数据治理计划以监控和改进数据质量。数据架构师可以推荐哪些步骤来实现此目标？（选择两个答案）\n\
  \n- a) 实施 Lightning Flow 流程以查询记录并识别重复项，然后向管理员发送报告。\n- b) 实施数据质量仪表板，以直观地向用户展示数据质量。\n\
  - c) 评估字段数据类型并确保其符合字段用途；例如，如果需要从用户那里捕获电子邮件，则应使用电子邮件类型字段，而不是文本字段。\n- d) 开发自定义解决方案，实施\
  \ Apex 触发器以进行外部调用，然后比较并更新来自外部数据验证网站的数据。\n\n3. Precision Printing (PP) 拥有全球客户群，约\
  \ 45% 的客户位于欧盟以外。已聘请一名数据架构师来制定 Salesforce 中的数据治理计划。数据架构师应在数据治理计划中包含什么？（选择两个答案）\n\n\
  - a) 数据字典\n- b) 数据质量指标\n- c) 角色和职责\n- d) 组织中所有 Salesforce 流程的列表\n\n### 延伸阅读\n\n\
  - • 欧盟隐私法律基础知识: https://trailhead.salesforce.com/en/content/learn/modules/european-union-privacy-law-basics/get-to-know-eu-privacy-law\n\
  - • 加州消费者隐私法案 (CCPA): https://trailhead.salesforce.com/content/learn/modules/california-consumer-privacy-act-basics/\n"
- "## 6 管理性能\n\n在前几章中，我们已经大量讨论了数据管理和治理。这一切都很合理，但是如果你在平台上构建的应用程序在负载很大时运行缓慢或崩溃，你就无法与用户建立信任关系，无论这些用户是通过\
  \ Salesforce 体验云访问应用程序的内部客户还是外部客户。\n\n在本章中，我们将首先探讨 Salesforce 中的性能主题，并了解性能相关问题最初发生的原因。当然，我们需要工具来确定我们是否确实面临性能问题，以及是否需要进一步诊断。因此，我们将讨论一些可用于进一步调查和解决问题的工具。\n\
  \n一旦使用可用工具围绕原因建立了基础，我们将探讨可以采取哪些措施来改进平台上的性能。由于性能可能受到多种因素的影响，因此可以开展一系列活动来改进性能，我们将介绍一些可以用来改进性能的更常见的性能改进技术。性能管理的一个非常重要的方面是确保在应用程序进入生产环境之前对其进行测试。因此，我们将彻底讨论性能测试的重要性，以及如何在\
  \ Salesforce 平台上成功进行此类测试。\n\n一旦你将应用程序的性能提升到可接受的水平，你就希望确保它继续以最佳方式运行，这需要了解性能监控，因此我们将以讨论平台监控来结束本章。\n\
  \n本章将介绍的关键主题如下：\n\n- Salesforce 平台性能\n- 性能工具\n- 改进性能\n- 在 Salesforce 中进行性能测试\n-\
  \ 监控性能\n\n那么，让我们立即深入了解 Salesforce 平台上的性能。\n\n### Salesforce 平台性能\n\n随着时间的推移，组织中的数据将会增长。如果这些增长的数据没有得到妥善管理，可能会导致问题，包括性能问题、存储限制和系统采用率低。从长远来看，管理数据的最佳方法之一是将数据归档和数据管理实践作为每个新实施的一部分。如果不这样做，数据归档和管理活动将变成事后补救措施，并且实施起来需要更多工作。无论是否拥有未来几年足够的存储空间、性能良好、没有来自客户的性能相关投诉，或者认为永远不会达到限制，情况都是如此。\n\
  \n良好的架构意味着提前考虑性能，并在合理的情况下尽量减少可用资源的使用。在本节中，我们将回顾为什么性能很重要，以及导致性能问题的一些更常见的原因。我们还将回顾与性能相关的工具以及如何在\
  \ Salesforce 平台上执行性能测试。\n\n让我们先来了解为什么关注组织的性能很重要。\n\n### 性能监控的重要性\n\nSalesforce 在销售和营销组织中广泛使用，并已成为关键业务平台。凭借其易用性和扩展平台的功能，各种团队都在使用它。从支持到销售运营，从财务到法律和\
  \ **人力资源 (HR)**，不同团队使用它在平台上开展业务。\n\nSalesforce AppExchange 商店还提供了庞大的 3,000 多个业务应用程序组合，这也使得根据多种不同用例定制平台变得容易。广泛使用的另一个原因是可以与平台连接的众多集成工具。由于平台使用广泛，许多独立软件供应商\
  \ (ISVs) 已经构建了易于使用的连接器，可以快速轻松地将其产品与 Salesforce 集成。\n\n所有这些都带来了巨大的机遇，但也带来了挑战，因为需要维护一个高性能的业务平台。这一点在新的\
  \ Lightning Experience (LEX) 用户界面 (UI) 中尤其明显，该界面高度依赖客户端处理，并且总体上更依赖网络质量来提供最佳用户体验。通常，软件即服务\
  \ (SaaS) 和平台即服务 (PaaS) 更难以监控，因为基础设施不由客户拥有。网络和应用程序监控工具（例如，捕获数据包进行分析）之类的工具在您自己的环境之外不起作用。幸运的是，有些工具可以帮助定位这类问题。我们稍后将回顾其中一些工具，但现在，让我们了解为什么监控\
  \ Salesforce 平台上的性能很重要：\n\n- • 收入创造和生产力：销售团队需要持续销售，为了实现这一目标，组织通常会投入大量资金来实施和配置 Salesforce，以使其适合其业务。许多组织还投资于第三方工具，例如\
  \ AppExchange 应用程序，以使其销售团队尽可能高效。除了技术之外，组织还会花时间培训其销售代表，完善他们的推销词和幻灯片演示文稿，并提供通话脚本指导以及大量其他工具来帮助他们促成交易。技术和这些工具，加上优化的业务流程，构成了一台运转顺畅的销售机器。Salesforce\
  \ 中的性能问题可能会严重影响销售团队的生产力，这可能导致收入损失。\n\n- • 信任：如果系统经常运行缓慢，或者用户无法进行日常活动，很快就会出现不满的用户，他们会对系统失去信任。用户之间会互相交流并分享经验，一旦负面趋势开始形成，就很难扭转。制定流程和工具以确保系统以最佳水平运行，对于确保组织投资持续获得正回报至关重要。\n\
  \n\n\n\n- **系统运行状况**：与性能相关的问题通常指向应审查和纠正的底层问题。如果不纠正，这些问题可能会影响应用程序的其他区域或增加扩展应用程序所需的工作量。例如，报告运行缓慢，架构师在调查后发现该组织有许多复杂的共享规则。每次运行报告时，都必须评估共享规则，从而减慢原本运行良好的报告。另一个可能受影响的领域是，如果您的客户有每晚运行以从\
  \ ERP 等系统导入数据的集成。复杂的共享规则会减慢该过程，因为系统必须重新计算数据访问权限。在用户登录并处于多个时区使用系统的非常大的全球组织中，这可能会成为问题。在这些情况下，可以使用其他技术来确保数据导入顺利并最大限度地减少对用户的影响。\n\
  \n- **服务级别协议 (SLAs)**：系统性能不仅从内部用户的角度重要，从客户角度也同样重要。您与客户的 SLA 概述了响应时间和客户预期可获得的服务水平。如果您的组织性能不佳，客户\
  \ SLA 可能会受到不利影响。例如，在一家大型汽车经销商中，向客户承诺其车辆将在特定时间内得到维护，如果错过了该时间段，则整个账单会自动打 15% 折扣。Salesforce\
  \ 用于管理工单并提交汽车零件订单。假设技术人员正在尝试查询特定品牌和型号的零件以便下单，但系统运行缓慢，导致技术人员下单相关零件所需的时间比预期长。结果，工作无法按时完成，并因公司现在必须给予客户\
  \ 15% 折扣而损失收入。\n\n- **持续改进**：组织努力竞争并保持其竞争优势，并使用不同的技术来实现这一目标。主动监控性能可让您确保过去犯下的错误不再重复，并将过去吸取的教训纳入未来的设计和构建中。净结果是整体改进客户服务，并向内部用户保证组织正在认真对待数据并对其投入重视。\n\
  \n现在我们已经了解了监控性能的原因，在下一节中，我们将回顾性能问题最初发生的原因，然后讨论可用于测量和改进性能的一些工具。\n\n### 性能相关问题的原因\n\
  \n此前已确定，Salesforce 是关键业务应用程序，并且越来越多地用于 CRM 以外的更多业务功能。有许多因素可能会影响性能并影响业务运营，因此，我们必须了解这些因素。\n\
  \n当用户报告性能相关问题时，首先要做的是查看 Salesforce Trust 网站，确保问题不出在 Salesforce 侧。您也可以订阅该网站的警报。要检查实例状态，请访问\
  \ `status.salesforce.com` 并输入您的实例 ID，如下列步骤所示。首先，让我们回顾查找实例 ID 的步骤：\n\n- 导航到 **SETUP**，然后进入\
  \ **COMPANY INFORMATION** 以查找您组织的实例 ID，如以下屏幕截图所示：\n\n![](img/782d45700e093b3d82b348c0ccc8ccba_233_0.png)\n\
  \n图 6.1 – 公司信息页面显示实例 ID，本示例中为 NA49\n\n- 获取实例 ID 后，访问 status.salesforce.com 并输入您的实例\
  \ ID：\n\n![](img/782d45700e093b3d82b348c0ccc8ccba_234_0.png)\n\n图 6.2 – 实例 NA49\
  \ 的所有功能均正常运行，没有任何问题\n\n您也可以点击 **HISTORY** 选项卡以查看该实例上出现的任何问题的历史记录，而 **MAINTENANCE**\
  \ 选项卡显示应用于该实例的补丁和发行版，包括即将发布的版本。这在每个版本发布前的规划中，以及为正在进行或即将开始的项目规划时，都是非常有用的工具。\n\n性能问题的一个挑战是，可能影响性能的因素范围很广，因此迅速将问题范围缩小到最可能的原因非常重要。一个很好的起点是广泛地询问以下类似问题：\n\
  \n是否影响所有使用 Salesforce 的人？\n\n- 不同位置的用户是否遇到类似的性能问题？\n- 他们使用什么浏览器？\n- 在使用其他浏览器时是否遇到性能问题？\n\
  \n了解这些问题的答案可以帮助您将问题范围缩小到两三个最可能的可能性，然后可以进一步探讨。让我们来看看性能相关问题的原因：\n\n- **休闲网络流量**：如今许多用户携带连接到办公室无线接入点的设备并流式传输高清视频和音频，这可能导致办公室网络带宽受限。缓解此问题的一种方法可以是为这些用户提供一个单独的接入点，使休闲网络流量通过该接入点，而包括\
  \ Salesforce 在内的关键应用程序可以在常规网络上运行，留出大量带宽。您需要确定一种方法防止用户设备接入网络；通常可以通过 **媒体访问控制 (MAC)**\
  \ 过滤来完成，这样只有授权的 MAC 地址才能进入常规网络。\n\n> **MAC 地址**\n> \n> MAC 地址是网络上唯一标识硬件的唯一识别号。网络中的每个\
  \ MAC 地址都是唯一的，不会有两个相同的 MAC 地址。这是由 MAC 地址使用的命名法保证的，该主题超出了本书的范围。有关 MAC 地址的更多信息，请参阅\
  \ https://www.pcmag.com/encyclopedia/term/mac-address。\n\n- **带宽质量**：带宽低可能是一个问题，用户会注意到您尝试解决它，但增加更多带宽来修复性能相关问题并不总能带来理想结果。这是因为带宽质量也很重要。丢包率增加几个百分点会以明显方式影响性能。\n\
  \n- **位置**：Salesforce 在全球拥有数百个实例，所有组织都运行在这些实例上。您距离托管您组织的实例的远近也可能是性能相关问题的一个因素。如果物理距离很大，并且到达该实例需要经过许多跳点，这可能导致性能缓慢。Salesforce\
  \ 实例分布在世界各地的多个区域，组织由 Salesforce 根据用户所在位置分配。在注册之前，如果您希望组织位于大多数用户所在的区域，而不是执行合同的区域，则应咨询您的客户经理。\n\
  \n#### 跳点\n\n跳点是一个网络术语，指数据包到达目的地必须经过的网络设备数量。这些网络设备可以是路由器、交换机、中继器等等。\n\n每个设备接收数据包，处理其中的信息，然后将其转发到目的地。每当设备执行此操作时，都会花费时间，并且在传输数百万个数据包时可能会影响性能。在\
  \ Windows 中，您可以在 **命令提示符** 中使用 `tracert` 命令来查看跳点数量。例如，从我的笔记本电脑到 `salesforce.com`\
  \ 是 9 个跳点。\n\n请记住，跳点数较低不一定意味着连接更快，因为其他因素也会影响连接速度。\n\n- **低效的配置或代码**：性能问题也可能由配置不当的应用程序或次优代码引起。这些可能会大量消耗系统资源，从而影响性能。如果某个特定的\
  \ Visualforce 页面或 Lightning 组件中问题不断出现，您会希望审查代码并确保其遵循最佳实践。另一种可能性是配置不当的应用程序。此前，我们讨论了共享规则的示例。如果共享规则过多，会减慢报告或数据查询的速度，因为每次执行查询时，系统都必须运行共享规则以确保数据安全性符合这些规则。\n\
  \n- **AppExchange 包**：许多 AppExchange 包为您的流程增加业务价值，但某些包也会与 ISV 服务器进行来回通信，可能会影响性能。例如，如果您正在使用数字签名解决方案并安装托管包，该包可能会占用带宽，导致性能不佳。管理员应经常审查和评估托管包，以确保它们仍然有用，并提供最初在组织中安装时的价值。\n\
  \n- **浏览器**：浏览器是云世界中默默无闻的英雄，在用户体验中起着关键作用。随着浏览器使用时间的增长，它会积累大量数据。这可能包括浏览器积累大量 Cookie\
  \ 和缓存，从而影响性能。还建议将浏览器更新到最新版本，因为浏览器供应商不断发布新补丁，不仅修复安全漏洞，还改进性能。\n\n使用 Salesforce 支持的浏览器是另一个重要因素。例如，一个组织一直在使用\
  \ Internet Explorer 11，并且不断遇到问题，因此用户开始使用 Google Chrome。问题是，每当用户遇到 Salesforce 方面或一般问题时，企业支持团队都不会提供支持，因为\
  \ Internet Explorer 11 是受支持的企业浏览器。\n\n\n\n\n\n同时运行多个浏览器窗口或在同一窗口中打开多个标签页会严重降低性能。这是因为每个打开的窗口和标签页都会占用内存和中央处理器（Central\
  \ Processing Unit，CPU）周期。\n\n浏览器的另一个方面是可以添加插件和扩展。如果特定用户报告问题，我建议在诊断期间禁用所有插件和扩展。可以通过以无痕（Incognito）或隐私浏览（Private\
  \ Browsing）模式打开浏览器来轻松完成此操作。\n\n- 技术债务：如果不加以密切监控，这会在拖慢性能方面发挥重要作用。简单来说，技术债务是指为了快速交付解决方案而承担的债务。请注意“债务”一词，这意味着它需要及时偿还，否则将需要支付利息来偿还。只要有流程和工具来确保妥善处理技术债务，技术债务不一定是一件坏事。\n\
  \n在 Salesforce 世界中，技术债务包括从废弃的自定义字段、工作流流程、报告和触发器，到为满足业务要求而设置的权宜之计等任何内容。当 Salesforce\
  \ 提供解决方案来弥补其解决方案中的差距时（通常作为每年三次发布的一部分），或者组织决定采用第三方解决方案或改进其自身解决方案时，在许多情况下，旧解决方案或权宜之计会保持原样留在组织中，从而导致技术债务。随着时间的推移和技术债务的累积，如果不采取行动，用户将开始出现性能问题。\n\
  \n- 硬件和软件要求：Salesforce 要正常运行需要满足某些硬件和软件要求。例如，运行 LEX 建议配置 8 GB 内存。最低要求是 5 GB 内存，但取决于您的应用程序对资源的需求，用户可能会因最低内存要求而遇到性能问题。如果未满足这些要求，可能会导致性能问题。Salesforce\
  \ 不会阻止客户使用不受支持的软件和硬件，因此也应检查这一点，以便在诊断过程一开始就排除潜在的硬件和软件问题。\n\n- 网络拓扑：由于业务性质，一些客户可能对其\
  \ Salesforce 组织可从中访问的 Internet Protocol（IP）地址有非常严格的要求。有时，他们会要求用户通过 VPN（虚拟专用网络）登录\
  \ Salesforce，这可能会导致网络流量延迟，因为所有通信都必须通过 VPN 隧道传输。\n\n- **API 限制**：几乎每个 Salesforce\
  \ 组织都安装了某种类型的 AppExchange 包或与其他系统集成。对于较大的组织，有时可能会安装几十个 AppExchange 包以及许多其他集成。所有集成和一些\
  \ AppExchange 包（取决于应用程序的内容）都会利用 API 调用。由于 Salesforce 施加限制以确保实例上其他客户的质量，因此对这些调用设置了限制。达到限制意味着您要么等待\
  \ 24 小时（限制重置的周期）过去，要么从 Salesforce 购买额外的 API 调用。API 限制造成的中断是一个严重问题，因为它可能影响直接产生收入的活动或客户服务。例如，如果您的营销自动化工具无法与\
  \ Salesforce 通信，那么进入该工具的任何高价值潜在客户都无法推送到 Salesforce。\n\n> **governor 限制**\n> 已认证的托管包是通过\
  \ AppExchange 安全审查的托管包。除了客户组织限制之外，它们还拥有一组自己的 governor 限制。例如，客户组织中的每个事务 DML 限制为 150；已认证的托管包将获得每个事务\
  \ 150 个自身的 DML 限制。有关详细信息，请参阅此链接中的 Per-Transaction Certified Managed Package Limits\
  \ 部分：https://developer.salesforce.com/docs/atlas.en-us.apexcode.meta/apexcode/apex_gov_limits.htm.\n\
  \n既然我们已经讨论了性能问题的原因，在下一部分中，我们将讨论一些可用于解决性能问题的工具。\n\n### 性能工具\n\n有多种工具可用于监控和诊断性能问题。本节的讨论并非旨在详尽详述每个可用工具及其功能，而是提供指引，以便您在遇到性能问题时能够理解并使用它们。\n\
  \n必须指出，对于业务关键型应用程序，性能必须从一开始就放在首位。设计应用程序后将性能考虑留到最后，或者更糟的是，等到应用程序投入生产且用户开始报告问题时再考虑，这不是良好的做法。这就是为什么应该执行性能测试，以衡量应用程序扩展到预期用户数量范围较高阈值的能力。我们将在\
  \ *在 Salesforce 中进行性能测试* 部分更详细地讨论性能测试及其在 Salesforce 中的实施方法。\n\n让我们讨论一下可用于在 Salesforce\
  \ 中监控性能的一些工具。\n\n### URL 后缀\n\n这是一种查看 LEX 页面加载时间的技术。方法是在 URL 末尾添加 ?optVisible=1。例如，当我将其添加到特定记录的\
  \ **账户** 页面时，结果显示页面加载耗时 **4.49** 秒。我们将在 *LEX 中的性能* 部分讨论与 LEX 性能相关的详细信息。\n\n可以在 **图\
  \ 6.3** 的右上角看到，**账户** 页面加载耗时 **4.49** 秒：\n\n![](img/782d45700e093b3d82b348c0ccc8ccba_239_0.png)\n\
  \n图 6.3 – 显示的 EPT（体验页面时间）值为 4.49 秒\n\n这是一个方便的工具，可以在无需进行大量设置的情况下快速获取页面性能的初步数据。\n\n\
  ### 速度测试\n\n这是一项用于衡量性能的测试，提供不同指标来衡量 **JavaScript (JS)** 速度以及到 Salesforce 服务器的连接速度。要使用此工具，只需在登录组织时将\
  \ /speedtest.jsp 附加到 URL。例如，在我这边，我有 https://curious-wolf-q1n89f-dev-ed.my.salesforce.com/speedtest.jsp。\n\
  \n然后，在生成的页面上运行测试。如图 6.4 所示，这将生成 Octane 得分、下载和上传速度以及其他相关信息。在此示例中，Octane 得分远低于 Salesforce\
  \ 要求的最低得分，因此用户应预期会遇到性能问题：\n\n![](img/782d45700e093b3d82b348c0ccc8ccba_240_0.png)\n\
  \n图 6.4 – Octane 得分\n\n如图 6.4 所示，Speedtest 还有其他有用于故障排除的信息，例如上传/下载速度、实例 ID 以及与浏览器和操作系统相关的其他详细信息。\n\
  \n> **Octane 得分**\n> \n> Octane 得分由 Google 开发，用于衡量浏览器中 JS 的性能。Octane 得分越高，对应的加载时间越快。需要注意的是，Octane\
  \ 得分还会考虑硬件和浏览器类型。Salesforce 要求最低 Octane 得分为 20,000，并建议 Octane 得分超过 30,000 以获得最佳性能。\n\
  \n### Salesforce 优化器\n\n这是 Salesforce 提供的一款免费工具，可以作为 PDF 报告或应用程序运行，并提供涵盖使用情况、未使用字段、自定义代码、报告和仪表板的多种指标的详细信息。该工具不仅可以扫描并突出显示组织中的问题区域，还会就如何解决这些问题提供建议。它还提供分析每个问题所需工作量的估计值，以及如果深入查看该项目，还可提供其他资源，如图\
  \ 6.5 所示。该报告或应用程序可以通过在设置中搜索 Optimizer 来运行。\n\n我更喜欢运行应用程序，因为它比报告涵盖更多功能，并提供排序功能，可用于对列表视图进行排序。Salesforce\
  \ 建议定期运行此报告或应用程序。这样您可以在问题出现之前发现它们。图 6.5 显示了运行 Salesforce Optimizer 后的结果：\n\n| 功能\
  \ | 类型 | 预计工作量 | 状态 |\n|---|---|---|---|\n| 用户登录 | 用户管理 | < 30 分钟 | 需要立即采取行动 |\n\
  | 不安全的默认外部访问级别 | 改进组织安全性 | > 2 小时 | 需要立即采取行动 |\n| 挂起的版本更新 | 改进组织安全性 | > 2 小时 | 需要采取行动\
  \ |\n| 未分配的角色 | 用户管理 | < 30 分钟 | 需要审查 |\n| API 版本 | 自定义代码 | 1 - 2 小时 | 需要审查 |\n\
  | 配置文件分配 | 用户管理 | 1 - 2 小时 | 需要审查 |\n| 不完整的 Chatter 配置文件 | 使用情况 | < 30 分钟 | 需要审查\
  \ |\n| 不活跃的 Chatter 用户 | 使用情况 | 30 - 60 分钟 | 需要审查 |\n| 每个对象的多个 Apex 触发器 | 自定义代码\
  \ | 1 - 2 小时 | 需要审查 |\n| 字段使用情况 | 字段 | 30 - 60 分钟 | 需要审查 |\n| 未分配的自定义配置文件 | 用户管理\
  \ | < 30 分钟 | 需要审查 |\n| 未使用的报告 | 报表和仪表板 | < 30 分钟 | 需要审查 |\n\n图 6.5 – 优化器应用的结果\n\
  \n您可以深入查看每个项目，并以更详细的方式查看结果，以及预计工作量和其他资源，以帮助您修复问题。\n\n### Salesforce Shield 的事件监控\n\
