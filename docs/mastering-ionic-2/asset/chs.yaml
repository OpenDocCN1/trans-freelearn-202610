  \        this.submitted = true;\n\n        if (form.valid) {\n            // registering\
  \ new user\n            this.auth.signup(this.signup).then(() => {\n           \
  \     // user is now registered\n                this.navCtrl.push(LoginPage);\n\
  \            }, (err: DetailedError<string[]>) => {\n                for (let e\
  \ of err.details) {\n                    if (e === 'conflict_email') {\n       \
  \                 alert('Email already exists.');\n                    } else {\n\
  \                        // handle other errors\n                    }\n       \
  \         }\n            });\n        }\n    }\n}\n```\n\n\n\n\n## Ionic DB\n\n\
  Ionic DB 是 Ionic Cloud 服务中最新增加的功能。IonicDB 用于安全地将应用程序数据远程存储。它与 Auth 集成得很好，因此用户可以安全地存储数据并实时检索。我们将在应用程序中从\
  \ IonicDB 获取数据，因为我们已经安装并配置了云客户端，所以可以直接集成。IonicDB 的一些重要特性如下：\n\n- JSON 风格文档存储\n-\
  \ 实时数据更新\n- 身份验证和权限管理读写权限。\n\n我们将从在仪表板中为应用程序创建数据库并添加特定集合开始。集合是一组文档，通过存储在 id 字段中的唯一键来标识。你也可以将集合类比为关系数据库中的表。我们将创建一些初始集合：categories、parent_categories、popular_products\
  \ 和 products，这些将在应用程序的不同视图中使用。你还会发现 user 集合，这是在我们集成 Auth 时自动创建的：\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_230_0.png)\n\
  \n我们将在应用程序的多个视图中使用 Ionic DB，因此我们创建了一个 DataService 提供者，它将直接与 Ionic DB 通信，并将数据返回给调用该服务的视图。这将帮助我们避免大量代码重复。在开始之前，让我们先了解一下\
  \ Ionic DB 的工作原理以及它是如何获取数据的：\n\n```\n// src/providers/data-service.ts\n\nimport\
  \ { Injectable } from '@angular/core';\nimport { Storage } from '@ionic/storage';\n\
  import { Database } from '@ionic/cloud-angular';\nimport { Observable } from 'rxjs/Observable';\n\
  \nimport 'rxjs/add/operator/map';\nimport 'rxjs/add/operator/catch'\n\n@Injectable()\n\
  export class DataService {\n\n  cartItems: any[];\n\n```\n\n```\nloading: any;\n\
  \nconstructor(public db: Database) {\n    // Establish Initial connection\n    this.db.connect();\n\
  }\n\npublic getCategories(): Observable<any> {\n    const categories:any = this.db.aggregate({\n\
  \        name: \"testing\",\n        categories: this.db.collection('categories'),\n\
  \        parent_categories:\n            this.db.collection('parent_categories')\n\
  \    })\n    return categories.fetch();\n}\n\npublic getPopularProducts(): Observable<any>\
  \ {\n    const popular_products:any =\n        this.db.collection('popular_products');\n\
  \    return popular_products.order(\"price\",\n    \"ascending\").fetch();\n}\n\
  }\n```\n\n在从 IonicDB 集合获取数据之前，我们需要与数据库建立初始连接，之后我们才能创建集合。你可以从前面的代码中看到，我们在构造函数中建立了连接，之后我们声明了多个从数据库获取数据的函数。\n\
  \n集合支持多种读写操作。在我们的 getPopularProducts() 函数中，我们使用了 order() 方法，它按价格从低到高检索产品。在某些场景下，我们需要查询多个集合并将结果合并为单个\
  \ JSON 响应。在 categoriesPage 上，我们同时获取 categories 和 parent_categories。因此，我们可以准备一棵树在\
  \ UI 端相应地显示。aggregate() 方法将多个数据库查询的结果合并为一个结果。你可能已经注意到，这里我们使用了 fetch() 方法，而不是我们在\
  \ getPopularProducts() 函数中使用的 watch() 方法。watch() 和 fetch() 的区别在于，watch() 会实时更新数据：\n\
  \n```\n// src/pages/home/home.ts\n\nimport { DataService } from '../../providers/data-service';\n\
  \nexport class HomePage {\n    constructor(public data: DataService) {\n       \
  \ this.data.getPopularProducts().subscribe((popular) => {\n            this.products\
  \ = this.arrayToMatrix(popular, 2);\n            console.log(this.products)\n  \
  \      }, (error) => {\n            console.error(error);\n        });\n    }\n\
  }\n\n// src/pages/categories/categories.ts\n\nthis.data.getCategories().subscribe((data)\
  \ => {\n    for (var i = 0; i < data.categories.length; ++i) {\n        let p_id\
  \ = data.categories[i].parent_id;\n        for (var j = 0; j < data.parent_categories.length;\n\
  \            ++j) {\n            if(data.parent_categories[j].id == p_id)\n    \
  \        {\n                data.parent_categories[j].child.push(data.categories[i])\n\
  \            }\n        }\n    }\n    this.categoryList = data.parent_categories;\n\
  \n```\n\n```\n}, (error) => {\n    console.error(error);\n});\n```\n\n所有读写操作都返回\
  \ RxJS observable。subscribe 是 observable 上的一个方法，它接收三个函数作为参数：\n\n- next(result)：接收集合数据的回调方法\n\
  - error(error)：接收错误数据的回调方法\n- complete()：当结果集迭代完成时执行的回调\n\n如果你想停止接收数据流，可以调用 unsubscribe()\
  \ 方法。我们在移动应用程序中主要使用读取方法从数据库检索数据。不过，我们也有多种写操作，也可以用于以用户为中心的应用，比如待办事项应用。\n\n让我们也看看一些写操作以及如何使用它们。虽然在我们的\
  \ vPlanet 应用程序中没有使用写操作，但让我们演示如何为待办事项应用使用一些写操作：\n\n```\nconst todoItems = this.db.collection(\"\
  items\");\n\n// Insert a todo item document\n\nlet dateTime = new Date().toLocaleString();\n\
  \ntodoItems.insert({\n  id: \"1\",\n  user: this.user.id,\n  text: \"Prepare project\
  \ presentation\",\n  status: \"pending\"\n  timestamp: dateTime\n});\n\n// Update\
  \ todo item\n\nlet dateTime = new Date().toLocaleString();\n\ntodoItems.update({\n\
  \  id: \"1\",\n  user: this.user.id,\n  text: \"Prepare project presentation\",\n\
  \  status: \"completed\"\n  timestamp: dateTime\n});\n```\n\n现在我们对 IonicDB 的读写操作有了很好的了解。IonicDB\
  \ 仍在积极开发中，因此你可能会遇到一些问题，但到目前为止，我在开发 vPlanet 应用程序的过程中一直很顺利。\n\n## 身份验证与权限\n\nIonic\
  \ DB 集成了现有的认证服务，默认情况下该服务是禁用的，因为在我们的 vPlanet 应用程序中，我们不需要启用认证，因为大多数数据应该是公开可访问的。对于待办事项应用，我们需要在\
  \ IonicDB 中启用认证，这将要求用户在使用 Ionic Auth 登录后才能连接到数据库。这样，用户只有通过认证后才能访问数据。要启用认证，我们需要更新\
  \ `app.module.ts` 中的一些设置：\n\n```\n```typescript\n// src/app/app.component.ts\n\n\
  const cloudSettings: CloudSettings = {\n  'core': {\n    'app_id': 'APP_ID'\n  },\n\
  \  'database': {\n    'authType': 'authenticated'\n  }\n};\n```\n```\n\n另外，重要的一点是，确保仅在调用登录方法之后或用户已经过认证之后才建立数据库连接：\n\
  \n```\n```typescript\nif(this.auth.isAuthenticated()){\n  // Connect DB after checking\
  \ user authentication\n  this.db.connect();\n} else {\n  // Need to login\n  this.auth.login('basic',\
  \ details).then( () => {\n    // Now it is safe to connect\n    this.db.connect();\n\
  \  });\n}\n```\n```\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_234_0.png)\n\n权限允许你限制对数据库集合的访问。我们可以控制用户能读取和写入哪些数据。权限基于白名单机制，当从仪表板启用权限后，默认情况下我们将无法访问数据。我们需要为每个集合创建权限，并将其定义为默认组或认证组。默认组权限适用于所有用户，无论他们是否经过认证。认证组权限仅适用于经过认证的用户。让我们回到待办事项应用演示，现在我们还有另一个关注点，即只有数据是\n\
  \n\n\n与用户相关的数据应由该用户访问。由一个用户登录创建的待办事项不应对其他用户有权限。因此基本上应根据当前用户进行过滤。为此我们使用自定义权限，例如，在插入项目时我们指定了与该项目关联的\
  \ `userId`：\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_235_0.png)\n\n因此现在在获取项目时我们将传递当前的\
  \ `userId`，这将在当前用户上下文中检索数据：\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_235_1.png)\n\
  \n```javascript\ntodoItems.findAll({user:this.user.id}).watch().subscribe( (items)\
  \ => {\n  // this will only fetch items that\n  // login user have created\n  console.log(items);\n\
  })\n```\n\n我们在这里尝试触及 IonicDB 可用的每个可能部分并附带一些示例代码。这将真正简化初始学习曲线，并让你直接开始使用 IonicDB 构建应用程序。使用\
  \ IonicDB 我们也可以将其集成到我们的后端 NodeJS 应用程序中。\n\n## Ionic push\n\nIonic push 允许你向用户的设备发送消息和警报。即使应用程序关闭也可以触发推送通知。推送通知现在已经存在很长时间，并且在每个应用程序中都很常见。你们中的许多人可能已经在过去整合\
  \ GCM 和 APNS 时拥有良好的经验。所以这里我们的主要兴趣是如何从 Ionic push 服务使用这些服务。Ionic push 允许你从单个界面或 API\
  \ 向两个平台发送通知。使用 Ionic push 服务我们可以发送通知到：\n\n- 目标用户\n- 安排通知\n- 发送上下文内容\n- 将媒体附加到通知\n\
  - 在自定义逻辑上自动发送通知\n- 使用后台通知触发应用事件\n\n在我们能够从 Ionic push 服务发送通知之前，我们需要设置 FCM 项目和 API\
  \ 密钥。我们可以在 firebase 控制台设置和云消息传递选项卡中找到 FCM 服务器密钥和发送者 ID：\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_237_0.png)\n\
  \n- 下一步是生成 keystore 文件，我们将在为应用程序创建安全配置文件时与其他详细信息一起上传。在创建 keystore 时它会先要求 Keystore\
  \ 密码，并在输入其他详细信息后要求别名的 Key 密码。只要确保你记住这一点，因为在创建安全配置文件时需要它：\n\n```\nkeytool -genkey\
  \ -v -keystore vplanet.keystore -alias vplanet-alias -keyalg RSA -keysize 2048 -validity\
  \ 10000\n```\n\n- 现在我们已准备好创建安全配置文件。来自 Firebase 控制台的 FCM 服务器密钥，附加生成的 vplanet.keystore\
  \ 文件，别名及其各自的密码：\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_238_0.png)\n\n- 我们将使用\
  \ phonegap 的 push 插件接收推送通知。在安装插件时你需要传递 `SENDER_ID`，你可以在 Firebase 控制台设置中的同一位置获取它：\n\
  \n```bash\n// Install Cordova Push Plugin\n$ionic cordova:plugin add phonegap-plugin-push@1.9.4\
  \ --variable\n    SENDER_ID=76xxxxxxxxx --save\n\n// NPM package\n$ npm install\
  \ @ionic-native/push --save\n```\n\n我们现在需要在代码中的 `app.module.ts` 中更新我们的云配置：\n\n```typescript\n\
  // src/app/app.module.ts\n\nconst cloudSettings: CloudSettings = {\n  'core': {\n\
  \    'app_id': 'f8fec798'\n  },\n  'push': {\n    'sender_id': '76xxxxxxxxx',\n\
  \    'pluginConfig': {\n      'ios': {\n        'badge': true,\n        'sound':\
  \ true\n      },\n      'android': {\n        'iconColor': '#343434'\n      }\n\
  \    }\n  }\n};\n```\n\n我们现在必须注入 push 并将其集成到我们的应用程序中。我们将调用 `Push.init()`，它将创建 Push\
  \ 类的实例。我们将使用此 push 实例来监听注册和通知事件：\n\n```typescript\n// src/app/app.component.ts\n\
  \nimport { Push } from '@ionic-native/push';\n\nplatformReady() {\n  // Call any\
  \ initial plugins when ready\n  this.platform.ready().then(() => {\n    this.initPushNotification();\n\
  ```\n\n```javascript\n}\n\ninitPushNotification() {\n  console.log(\"calling push\"\
  );\n  let push = Push.init({\n    android: {\n      senderID: \"762350093850\"\n\
  \    },\n    ios: {\n      alert: \"true\",\n      badge: false,\n      sound: \"\
  true\"\n    },\n    windows: {}\n  });\n\n  push.on('registration', (data) => {\n\
  \    console.log(\"device token ->\", data.registrationId);\n    //TODO - send device\
  \ token to server\n  });\n\n  let self = this;\n\n  push.on('notification', function(data)\
  \ {\n    TextToSpeech.speak({text: data.message, locale: 'en-IN', rate: 0.75})\n\
  \      .then(() => console.log('Success'))\n      .catch((reason: any) => console.log(reason));\n\
  \n    if (data.additionalData.foreground) {\n      // if application open, show\
  \ alert\n      alert(data.message);\n    }\n    //if user NOT using app and push\
  \ notification comes\n    // for demo purpose for every push message we push\n \
  \   // to AboutPage\n    // Although you can apply logic and according to API\n\
  \    // data\n    // you can push to specific page\n    self.nav.push(AboutPage,\
  \ {message: data.message});\n\n    push.finish(function() {\n      console.log(\"\
  processing of push data is finished\");\n    }, function() {\n      console.log(\"\
  something went wrong with push.finish for ID = \" + data.additionalData.notId)\n\
  \    }, data.additionalData.notId);\n  });\n}\n```\n\n现在我们需要在发送推送通知之前注册设备。由于我们使用\
  \ Ionic auth，建议在登录后调用 `register()` 方法，以便将 Push 令牌保存到已认证用户：\n\n```typescript\n//\
  \ src/pages/login/login.ts\n\nthis.auth.login('basic', this.login).then((result)\
  \ => {\n  // user is now registered\n  // Push Notification register\n  this.push.register().then((data:\
  \ PushToken) => {\n    return this.push.saveToken(data);\n  }).then((data: PushToken)\
  \ => {\n    console.log('Token saved:', data.token);\n  });\n}, (err: IDetailedError<string[]>)\
  \ => {\n  console.log(err);\n  loading.dismiss();\n  this.showToast(err)\n});\n\
  ```\n\n同样，我们将在用户注销时注销设备：\n\n```javascript\nlogout() {\n    this.auth.logout();\n\
  \    this.push.unregister();\n    this.events.publish('user:logout');\n    return\
  \ true;\n}\n```\n\n让我们从仪表板发送推送通知；发送消息时有多个选项可用。发送通知时有三个步骤和多个选项可用：\n\n- 活动名称、通知主题、消息、负载（键/值对）和设备选项\n\
  - 针对特定用户细分或所有用户\n- 安排推送立即发送、稍后发送或基于某些触发器发送。还有要发送通知的哪个配置文件\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_240_0.png)\n\
  \n下一步可以是将 Push API 集成到我们的后端代码库中，如果需要的话。这样就可以有多种可能性和条件来发送通知。只要确保你不要向用户的设备发送太多通知，因为很多时候这就是用户卸载应用程序的原因。\n\
  \n## Ionic deploy\n\nIonic deploy 服务为你提供实时部署的访问权限，这有助于你将 HTML、CSS 和 JS 等网络资源直接发布给用户，而无需每次都上传到\
  \ Play Store。使用这种实时部署方法你将有许多优势：\n\n- 按需实时更新\n- 节省应用商店审批时间\n- 通过将不同快照上传到不同渠道进行 A/B\
  \ 测试\n\n在开始之前，让我们安装 deploy 插件，它将在 Android 和 iOS 设备上更新你的应用程序：\n\n```\n$ ionic cordova:plugin\
  \ add ionic-plugin-deploy -save\n```\n\n我们将在 `app.component.ts` 中注入 `Deploy` 方法，因此每次打开应用程序时都会检查新更新：//\
  \ src/app/app.component.ts\n\n```typescript\nimport { AlertController } from 'ionic-angular';\n\
  import { Deploy } from '@ionic/cloud-angular';\n\nconstructor(\npublic deploy: Deploy,\n\
  public alertCtrl: AlertController\n) {\n\n// checks if new snapshot available\n\
  this.deploy.check().then((snapshotAvailable: boolean) => {\nif (snapshotAvailable)\
  \ {\nlet alert = this.alertCtrl.create({\ntitle: 'Update Available !',\nmessage:\
  \ 'Do you want to update the application now ?',\nbuttons: [\n{\ntext: 'Later',\n\
  role: 'cancel',\nhandler: () => {\nconsole.log('Cancel clicked');\n}\n},\n{\ntext:\
  \ 'Update',\nhandler: () => {\nthis.deploy.download().then(() => {\n```\n\n\n\n\n\
  ```\nthis.deploy.extract()\n}).then(() => {\nthis.deploy.load()\n});\n}\n}\n]\n\
  });\nalert.present();\n});\n}\n}\n```\n\ncheck() 方法用于检查是否有可用更新。如果有可用更新，我们会显示一个提示对话框，询问用户是现在还是稍后更新应用程序。\n\
  \n下一步是使用 NOTE 和 CHANNEL_TAG 部署快照。可用于部署的渠道主要有三个：production、staging 和 dev。如果需要，我们可以创建更多渠道，默认情况下部署服务会检查\
  \ production 快照。如果需要更改，我们需要按如下方式设置 channel 属性：`this.deploy.channel = 'staging';`\n\
  \n如果发现无效渠道，则会回退到 production 渠道。另外，请确保在调用 check() 方法之前更新 channel 属性：\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_243_0.png)\n\
  \n值得一提的是，每当我们打包代码时，代码也会上传到服务器。但要让部署生效，我们需要传递渠道标签：\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_243_1.png)\n\
  \n我们可以通过做一些小的 HTML 更改，然后将其上传到服务器来测试部署。只需确保运行 Ionic server，以便 `src` 文件夹被转译并复制到 `www`\
  \ 文件夹。\n\n## Ionic package\n\nIonic package 是另一种云服务，可简化不同平台的原生构建流程。基本上，`ionic package`\
  \ 在云端构建 Cordova 应用。对于需要在 Windows 或 Linux 上构建 iOS 应用的人来说，这是一个绝佳的选择。使用 `ionic package`\
  \ 服务的一些优点如下：\n\n- 将构建版本发送给他人\n- 为不支持的平台构建应用\n- 生成 `.apk` 和 `.ipa` 文件，可直接上传到应用商店\n\
  \n由于我们已经设置了安全配置文件和凭据，我们现在就可以直接开始。这里我们为 `PLATFORM_TAG` Android 和 `PROFILE_TAG` prod\
  \ 构建应用：\n\n```\ngaurav@gaurav-thinkpad:~/projects/ionic/vplanet-commerce$ ionic\
  \ package build android --profile prod --release\nThe resources folder already exists.\
  \ We will not overwrite your files unless you pass the --force argument.\nRunning\
  \ with the force flag will overwrite your resources directory and modify your config.xml\
  \ file\nPreparing your resources...\nsplash ios Default-Portrait@ipadpro.png (2048x2732)\
  \ skipped, source image splash.png (2208x2208) too small\nsplash ios Default-Landscape@ipadpro.png\
  \ (2732x2048) skipped, source image splash.png (2208x2208) too small\nUploading\
  \ your project to Ionic...\nSubmitting your app to Ionic Package...\nYour app has\
  \ been successfully submitted to Ionic Package!\nBuild ID: 5\nWe are now packaging\
  \ your app.\n```\n\n现在，你可以从可用的包构建列表中查看构建状态，并通过 ID 下载它们：\n\n```\n$ ionic package\
  \ list\n```\n\n| id | 状态 | 平台 | 模式 | 开始时间 | 完成时间 |\n|----|--------|----------|------|---------|----------|\n\
  | 5 | 成功 | android | 发布 | Mar 9th, 2017 3:52:54 | Mar 9th, 2017 3:53:46 |\n| 4 |\
  \ 成功 | android | 调试 | Mar 9th, 2017 3:35:00 | Mar 9th, 2017 3:35:48 |\n| 3 | 失败\
  \ | android | 调试 | Mar 9th, 2017 3:21:46 | |\n| 2 | 失败 | android | 调试 | Mar 9th,\
  \ 2017 3:14:12 | |\n| 1 | 失败 | android | 调试 | Mar 9th, 2017 2:59:09 | |\n\n显示你最新的\
  \ 5 个构建。\n\n要下载，你只需指定 `BUILD_ID`：\n\n```\n$ ionic package download 4\n```\n\n很多时候，我们在添加\
  \ cordova 插件时没有使用 `--save` 标志，因此没有在 `config.xml` 中生成条目。为了确保 Ionic package 服务知道你需要的插件，请执行\
  \ `ionic plugin save`，这样所有插件条目都会写入 `config.xml` 中。\n\n> 注意：Ionic CLI 3 beta 发布后，package、upload、setup、share\
  \ 等许多命令已被移除。这些命令在 Ionic CLI v2 中可以正常工作，但如果你计划升级，请在 v3 中寻找替代命令。另外，由于 v3 仍处于测试阶段，我们并不完全清楚这些命令的替代方案。\n\
  \n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_246_0.png)\n\n## Ionic View、Creator 和\
  \ Playground\n\n到目前为止，我们已经介绍了几乎所有重要的 Ionic 服务，但仍有一些对 Ionic 应用非常有用的 Ionic 工具。其中一些工具包括\
  \ Ionic View、Creator 和 Playground。让我们看看这些工具如何帮助我们。\n\n### Ionic View\n\nIonic View\
  \ 可以让你轻松地与应用团队成员或客户分享应用，而无需在 iOS 上使用 TestFlight 或在 Android 上进行 beta 测试。我们可以轻松地与任何人分享应用，无需复杂的\
  \ beta 配置。第一步是上传我们的应用，系统会要求输入你的 Ionic 账户登录凭据：\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_250_0.png)\n\
  \n现在你可以在门户中看到 ID 为 f8fec798 的应用。你可以使用 Ionic share 命令分享你的应用；一旦你将应用分享给某个账户，他们就可以下载和预览你的应用。目前，大约支持\
  \ 27 个插件，你可以在 https://docs.ionic.io/tools/view/ 查看。\n\n> 有可能你的应用在 Ionic View 中无法完全正常工作，因为许多原生插件不受支持。\n\
  \n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_251_0.png)\n\n与我共享应用的合作者或账户将能够在其应用列表中看到该应用，并可以直接点击预览应用。这里还有多个选项可用，如清除数据、同步最新版本或删除应用：\n\
  \n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_251_1.png)\n\n### Ionic Creator 和 Playground\n\
  \n还有另外两个 Ionic 平台提供的工具：Ionic Creator 和 Playground。Ionic Creator 是用于原型设计和制作 UI 线框图的好工具，可以让我们快速可视化应用的外观。目前，在免费计划下，我们只能拖放组件、创建页面/视图、预览、分享和下载代码。不过，Ionic\
  \ 团队已经推出了许多专业功能，可在付费计划中使用，例如代码编辑、主题化和打包 Creator 应用。\n\n这里，我们尝试使用 Ionic Creator 为货币转换器应用制作一个线框原型：\n\
  \n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_254_0.png)\n\n我们从组件部分添加了三个选项卡。通过简单的拖放\
  \ UI，我们可以轻松添加项目。在右侧，你会看到特定页面或组件的属性，这些属性是从左侧选择的。例如，如果我们点击左侧的 List Page，它将显示页面的属性，如标题、路由\
  \ URL、背景颜色以及左/右页眉按钮。同样，每个组件都有不同的属性。有些组件和属性仅在专业版中可用：\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_254_1.png)\n\
  \n让我们看看预览应用时的效果。有四种设备选项可用于预览：iPhone、iPad、Android 手机和 Android 平板：\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_255_0.png)\n\
  \nIonic Playground 是一个简单的 HTML、CSS 和 JavaScript 编辑器，它使得与全世界任何人分享 Ionic 演示变得非常容易。你可以将\
  \ Playground 视为 Ionic 的 jsfiddle 或 plnkr。我们可以分叉并预览正在开发的应用。Playground 对 Ionic 开发者的教育和培训可以产生很大影响。出于调试目的，我们也可以使用\
  \ Playground；另一个用例是快速原型和演示。目前，Ionic Creator 和 Playground 都基于 Ionic 1，而我们的主要关注点是\
  \ Ionic 3，因此我们不会过于详细地讨论这些主题。你可以在 http://docs.usecreator.com/ 了解更多关于 Ionic Creator\
  \ 的信息，并在 http://play.ionic.io/ 开始使用你的第一个 playground 应用。\n\nIonic 生态系统包括 Ionic Market、Ionic\
  \ Jobs、Ionic Forum、Ionic Shop 和 Ionic Showcase。让我们简要了解一下这一切是如何运作的：\n\n- **Ionic\
  \ Market：** 在这里你可以找到许多免费和付费的 Ionic 主题和插件。如果你构建了一些对其他开发者有用的有趣主题或插件，你也可以在 Ionic Market\
  \ 上提交你的作品。\n- **Ionic Jobs：** 查找 Ionic 职位列表的最佳场所。\n- **Ionic Forum：** 在这里你可以与其他开发者互动、提问，并分享你的演示和想法。这是消除疑惑和查看你是否遇到类似问题的最佳场所。\n\
  - **Ionic Showcase：** 你可以在这里提交已投入生产的工作，并分享应用商店链接和截图。\n\n\n\n\n\n## 摘要\n\n随着 Ionic\
  \ 团队正在开发的服务和工具数量不断增加，你可以看到 Ionic 作为一个社区和产品都在以良好的速度发展。我们已经讨论了 Ionic 生态系统的所有服务，从 Ionic\
  \ Cloud 服务开始，再到可用于快速原型制作的工具。将这些服务结合起来会非常有帮助；认证和 Ionic DB 一起可以为你的应用提供更多定制化的选择。\n\n\
  IonicDB 等 Ionic 服务是一个很有意思的补充。有计划称 Ionic 未来会随时推出新的测试工具。下一件大事将是使用 Electron 将同一代码库部署为桌面应用，从而实现平台连续性。\n\
  \n在第5章 *认证、授权与安全* 中，我们将探讨 Ionic 应用的一些安全方面。从一些常见的安全实践，到在我们的应用中集成认证和授权，以及如何保护我们的私有视图免遭未经认证用户的访问。我们将探讨安全地存储敏感数据以及通过网络读写数据，以免被他人截获。此外，我们还会看到在将应用发布到应用商店之前应考虑的一些基本安全要点。\n"
- "# 认证、授权与安全\n\n现在我们将探讨构建企业应用的另一个重要方面：安全性。许多应用包含用户敏感内容，我们不希望将所有内容暴露给所有人。这正是认证和授权发挥作用的地方。不过，在本章中，我们将更侧重于\
  \ Ionic 的 Angular 部分，因为大部分工作将是用 Angular 编写代码。\n\n此外，Ionic 社区提供了大量关于此主题及其用法的信息，因此我们将探讨所有这些内容。本章另一个重要部分是保护应用程序的安全，因为在将应用部署到生产环境之前，我们必须考虑许多事项，确保没有人能轻易进入你的代码。\n\
  \n在对混合应用的安全性及其与原生应用的区别进行研究时，我发现了这样一句话：“无论你使用原生代码还是混合代码，如果一个人足够执着，他们仍然可以绕过并看到你的源代码。”最终，我们能在多大程度上增加其被攻击的难度，取决于我们自己，同时还要注意不要在代码库中分享或放置敏感信息。我们将在本章中探讨所有这些内容：\n\
  \n- 认证\n- 保护 Ionic 应用\n- 在 Ionic 中演示授权\n\n## 认证\n\nAngular 是 Ionic 的核心，与认证和授权相关的大部分工作将在代码中处理。对于前端应用，实现服务器端认证主要有两种方式。你可以将\
  \ Ionic 应用视为 Angular 前端应用。我们将介绍的所有内容都可以视为通用内容，既可用于 Web，也可用于基于 Ionic 的混合应用。通常我们处理认证主要有两种方式：\n\
  \n- 基于令牌（Token）\n- 基于 Cookie\n\n### 基于令牌的认证\n\n基于令牌的认证是许多 Web 应用中较新的认证方式。在这种方式下，当用户通过传递其用户令牌向服务器证明其有效性时，认证即成功，服务器会验证该令牌。在开始基于令牌的方式之前，让我们快速了解使用这种方式的一些好处：\n\
  \n- 无状态\n- 移动端友好\n- 性能\n- 更安全\n- 基于标准的 JWT\n- 使用基于令牌的方式还有其他许多好处，例如你可以通过 CDN 提供所有静态资源（HTML、CSS\
  \ 和 JS），而服务器端只是一个 API，这将提高性能\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_263_0.png)\n\
  \n在基于令牌的方式中，你首先需要获取一个有效令牌，在许多应用中，通常可以通过登录请求的响应获得。以 Facebook Connect API 为例，每次通过\
  \ Facebook 登录时，响应中都会返回一个令牌。该令牌将来会被用来从 Facebook 获取一组用户信息；Facebook 使用该令牌验证用户身份，验证通过后提供相关信息。\n\
  \n对于 Ionic 应用，我们可以将该令牌存储在本地存储或会话存储中供以后使用。我们需要扩展默认的 HTTP 类，以便为 Ionic 应用发出的每个传出的请求设置授权头。你可以看到基于令牌的认证使用起来非常简单；你不需要担心如\
  \ CSRF 等安全问题，因为你没有依赖 Cookie。\n\n以前几乎所有 Web 应用都基于 Cookie，并通过 Cookie 处理用户会话。它们要求服务器在每个请求上验证用户的\
  \ Cookie。随着我们转向现代的基于令牌的认证方式，仍有一些应用使用基于 Cookie 的认证方式。虽然我们可以在 Ionic 应用中实现同样的基于 Cookie\
  \ 的认证，但不建议这样做。这里我们将主要介绍基于令牌的方式，并在应用中演示它。\n\n## CORS\n\n**跨域资源共享（CORS）** 的设计初衷是跨域访问资源。跨域策略不适用于\
  \ Cordova，因此在设备上测试时我们无需过多考虑。但在浏览器中运行同一个应用时，如果从跨域访问资源，可能会出现 CORS 错误。当你运行 `ionic serve`\
  \ 命令时，就会看到这个问题。有四种方法可以绕过它：\n\n- 禁用 Chrome 安全策略\n- 浏览器扩展\n- 代理服务器\n- 最简单且方便的方法是在\
  \ Google Chrome 中使用以下标志运行应用：`--disable-web-security`：\n\n```\n$ google-chrome --disable-web-security\n\
  $ chromium-browser --disable-web-security\n```\n\n对于 chromium 浏览器，你也可以运行同样的命令。请确保在运行此命令前已关闭正在运行的\
  \ google-chrome 或 chromium。当你启用禁用 Web 安全策略打开浏览器时，会在浏览器中看到一条警告消息：“您正在使用一个不受支持的命令行标志：--disable-web-security。稳定性和安全性将受到影响。”\n\
  \n另一种方法是安装允许/禁用 CORS 的浏览器扩展。通常，这些插件在开启时会内部更改任何 XHR 请求的响应头。有许多可用的扩展，例如 **CORS toggle**\
  \ 和 **Force CORS**。\n\n## 为 Ionic 应用设置代理服务器\n\n搭建代理服务器会花费一些时间，并且仅在你想要运行 `ionic serve`\
  \ 和 `ionic run -l` 时才需要。我们将看到 Ionic CLI 如何提供一个易于配置的代理服务器。\n\n这里的代理服务器将充当中介，处理从客户端到服务器的所有请求。它会接收客户端请求，向服务器发出新请求，然后在收到服务器响应后，将响应转发回客户端。由于服务器是向你的目标地址发送新请求，因此不存在来源（origin），也就不需要\
  \ CORS。需要特别注意，浏览器会添加 Origin 头。\n\n要设置代理服务器，我们需要进行以下更改：\n\n- 在 `ionic.config.json`\
  \ 中设置代理\n- 设置 Angular 常量\n- 在 Angular 服务中使用常量\n\n让我们从在 `ionic.config.json` 文件中设置代理配置开始。代理配置在\
  \ proxies 数组中包含两个重要属性：`path` 和 `proxyUrl`。你可以在该数组中配置多个代理：\n\n```\n{\n  \"name\"\
  : \"ionic2-auth\",\n  \"app_id\": \"\",\n  \"v2\": true,\n  \"proxies\": [\n   \
  \ {\n      \"path\": \"/api\",\n      \"proxyUrl\": \"http://api.yourwebsite.com/api\"\
  \n    }\n  ]\n}\n```\n\n现在，你在 `ionic.config.json` 中指定了：每当访问 `http://localhost:8100/api`\
  \ 时，它将代表你代理到 `http://api.yourwebsite.com/api` 的请求。这将解决 CORS 问题。为了设置 API 端点，我们创建了\
  \ `constants` 文件，并在其中声明了一个常量 `API_URL`：\n\n```\n// src/providers/constants.ts\n\
  // While deploying application we switch to real URL\nexport const API_URL: string\
  \ =\n  'http://localhost:8100/api';\n```\n\n构建应用时，我们可以将其替换为真实的 `API_URL`，也就是我们提到的\
  \ `proxyUrl`：\n\n```\n// src/providers/data-service.ts\n\nimport { Injectable }\
  \ from '@angular/core';\nimport { HttpClient } from './http-client';\nimport { Observable\
  \ } from 'rxjs/Observable';\nimport 'rxjs/add/operator/map';\nimport { API_URL }\
  \ from './constants';\n\nexport class DataService {\n  constructor(public http:\
  \ HttpClient, public storage: Storage) {}\n\n  login(data): Observable<any> {\n\
  \    return this.http.post(API_URL + '/login', data).map(res => res.json());\n \
  \ }\n}\n```\n\n\n\n\n\n## CSRF\n\n**跨站请求伪造 (CSRF)** 许多服务器都具有此安全功能。我们也可以在基于 Ionic\
  \ 的应用程序中保留此功能。CSRF 是一种攻击，当恶意代码在用户已通过身份验证时，主要使用用户自己的 cookie 在受信任的网站上执行不需要的操作时就会发生。为了防止\
  \ Angular 和 Ionic 中的 CSRF，你需要使用特定的 cookie 名称设置正确的 CSRF 头。这将阻止黑客嗅探你的 cookie 会话数据并冒充已认证用户发起请求。\n\
  \n这将为不在 `allowedMethods` 中的任何请求类型设置 CSRF 请求头，使其等于 CSRF cookie 的当前值。\n\n因此，要在 Angular\
  \ 中启用基于 cookie 的身份验证，你必须处理另一件重要的事情，将 AJAX 的 `withCredentials` 标志设置为 true。该标志设置在低级的\
  \ AJAX 对象上，但在 Angular 中我们必须使用我们的 `Http` 方法进行配置。\n\n**示例代码片段**\n\n```typescript\n\
  import { Http, Headers, RequestOptions } from '@angular/http';\n\nsendData() {\n\
  \  let headers = new Headers();\n  headers.append('X-CSRF-Token', token.token);\n\
  \  let options = new RequestOptions({ headers: headers,\n    withCredentials: true\
  \ });\n  this.http.post(\"URL\", <stringified_data>, options)\n}\n```\n\n虽然许多开发者在重新启动应用程序时遇到\
  \ cookie 过期的情况，如果你遇到类似问题，请确保你的 cookie 已设置过期时间。实际上，浏览器会在关闭时清除没有过期时间的 cookie。\n\n\
  ## 保护 Ionic 应用程序\n\n通过身份验证和授权，你已经保护了所有数据，但在构建企业级 Ionic 应用程序时，仍有一些安全事项需要确保。这里我们将围绕\
  \ Cordova 来保护我们的应用程序。由于安全是一个深奥且复杂的话题，最重要的是保持更新并尝试使用最新版本的 Cordova 和 Ionic。通常，如果在\
  \ Cordova 中发现某些安全漏洞，你很快就会看到补丁并得到修复。\n\n## 白名单\n\n域名白名单是一种安全模型，用于控制对外部域的访问。Cordova\
  \ 提供可配置的安全策略来定义要访问哪些站点。对于 Cordova 4.0 及更高版本，我们应使用 `cordova-plugin-whitelist`，因为它提供更好的安全性和配置设置。目前\
  \ `cordova-plugin-whitelist` 支持 Android 4 以上。对于我们的平台，我们必须在 `config.xml` 文件中配置安全：`<access\
  \ origin=\"*\" />`\n\n在创建项目时，默认情况下所有域名都被列入白名单，这意味着你将可以访问所有域名。此外，域名白名单在 Android API\
  \ 10 及以下不可用。因此，这也是需要注意的重要事项，即将你的 `min-target-sdk` 设置在 10 以上。此外，Ionic 本身支持 Android\
  \ 4.4 以上版本。它可以在旧设备和 SDK 上运行，但可能会有性能和其他问题。此外，我们在 Android 4.4 以下设备的市场份额并不大。因此，为了构建面向未来的应用程序，我们可以忽略一部分市场份额，以使你的应用程序更安全、性能更好。随着新技术的出现，例如\
  \ BLE 支持的应用程序，甚至许多原生应用程序也只支持最新版本。\n\n我们已经在 [第 3 章，*Ionic Native 和插件*] 中介绍过白名单插件，因此你已经了解如何轻松配置各种设置并列入白名单资源。插件中的新内容安全策略使你能够控制哪些网络请求（图像、XHR\
  \ 等）允许通过 webview 直接发出：\n\n```\n<!-- Allow everything but only from the same origin\
  \ and foo.com -->\n<meta http-equiv=\"Content-Security-Policy\" content=\"default-src\
  \ 'self' foo.com\">\n```\n\n```\n<!-- Allows XHRs only over HTTPS on the same domain.\
  \ -->\n<meta http-equiv=\"Content-Security-Policy\" content=\"default-src 'self'\
  \ https:\">\n```\n\n```\n<!-- Allow iframe to https://cordova.apache.org/ -->\n\
  <meta http-equiv=\"Content-Security-Policy\" content=\"default-src 'self'; frame-src\
  \ 'self' https://cordova.apache.org\">\n```\n\n你可以在白名单插件的官方文档中找到各种其他配置示例，如上所述：https://cordova.apache.org/docs/en/latest/reference/cordova-plugin-whitelist/。\n\
  \n## 启用 SSL\n\n如果你通过网络向服务器传输安全数据，这是最重要的要点之一，在将应用程序上传到各种商店之前，你应该使其生产就绪并为所有安全请求启用\
  \ SSL。由于大多数 Ionic 应用程序使用 REST API 向服务器获取或发布数据，我们应该确保所有安全请求都是 HTTPS。同时，如果你的应用程序没有任何关键数据，那么对于这种情况也可以使用\
  \ HTTP。\n\n对于生产应用程序，不建议使用自签名证书。如果你想引入 SSL，请确保你的服务器具有由知名证书颁发机构正确签名的证书。原因在于接受自签名证书会绕过证书链验证，这会使任何服务器证书都被设备视为有效。这会使通信暴露于中间人攻击。数据将被加密，但中间人可以用中间人的密钥解密它。你可以将其视为一个普通的\
  \ Web 应用程序，在其中你始终确保所有安全信息以加密形式发送到服务器，以便没有人能在中间窃取它。为了确保这一点，购买由知名证书颁发机构颁发的 SSL 证书非常重要。\n\
  \n## 应用程序外的敏感数据\n\n在我们的应用程序中，可能有一些外部 API 用于获取第三方内容到我们的应用程序中。对于此，你将获得一些特定于你账户的 `secret_keys`，当你访问他们的服务器时会使用它们。在这里，我们必须确保不要将这些密钥放在你的\
  \ Ionic 应用程序中，因为有人可以很容易地从你的代码库中提取出来。\n\n这里最好的方法是，在你的服务器上进行代理请求或在你的服务器端代码中进行自定义请求，该请求会将密钥添加到\
  \ API 调用中。因此，你将调用你的服务器，然后你的服务器会将请求连同 `secret_key` 一起传递给第三方服务。在响应中，相同的响应可以从第三方服务通过服务器传递回客户端：\n\
  \n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_279_0.png)\n\n如果例如你有用户特定的密钥，那么你必须要求用户首先在你的应用程序中登录，这将验证用户，然后来自你的服务器的下一个\
  \ API 调用可以获取相应的 `user_keys`，然后可用于与他们的第三方服务器进一步通信。此外，请确保你的应用程序中没有任何业务逻辑，你可以在服务器端轻松处理。不要假设你的源代码是安全的，因为基于\
  \ Cordova 的 Ionic 应用程序是由打包在原生容器中的 HTML 和 JavaScript 资源构建的。任何人都可以逆向工程进入你的代码，因此我们永远不会在你的代码中放置任何敏感信息。\n\
  \n同样，对于 BaaS 服务，如 Ionic Cloud 和 Firebase，你必须将密钥放在客户端以直接调用这些平台 API。尽管如此，如果我们有适当的访问控制并通过身份验证和登录保护保护了应用程序，那么只有经过身份验证的用户才能向\
  \ API 发出请求。这将防止黑客试图耗尽你账户的 API 调用次数。\n\n\n\n\n\n## 安全存储\n\n在 Ionic 应用中，许多开发者严重依赖通过\
  \ Cordova 插件使用 localStorage 或 SQLite。很多时候，我们必须存储机密信息，如用户名、密码、令牌、证书或任何其他敏感信息。在这种情况下，我们可以使用\
  \ secure storage 原生插件，它在 iOS 上使用钥匙串（keychain）加密数据，而在 Android 上，该插件会加密数据并将其存储在 SharedPreference\
  \ 中。在 Ionic 应用内部，localStorage 会将数据沙箱化，仅对你的应用可见。其他任何应用都无法从外部访问这些数据。如果你将 SQLite 用作应用数据库，可以利用\
  \ SQLcipher 插件来加密 SQLite 中的数据：\n\n```bash\n$ ionic cordova:plugin add cordova-plugin-secure-storage\n\
  $ npm install --save @ionic-native/secure-storage\n```\n\n下面看一个示例，即存储用户的手机号码：\n\n\
  ```typescript\nimport { SecureStorage, SecureStorageObject } from '@ionic-native/secure-storage';\n\
  \nconstructor(private secureStorage: SecureStorage) { }\n\nthis.secureStorage.create('user_data')\n\
  .then((storage: SecureStorageObject) => {\n\nstorage.get('mobile_number')\n.then(\n\
  data => console.log(data),\nerror => console.log(error)\n);\n\nstorage.set('mobile_number',\
  \ '+917813123123')\n.then(\ndata => console.log(data),\nerror => console.log(error)\n\
  );\n\nstorage.remove('mobile_number')\n.then(\ndata => console.log(data),\nerror\
  \ => console.log(error)\n);\n});\n```\n\n同样，尽管你在加密数据方面做了这么多工作，我们仍必须注意：绝不应在应用存储中保存密码和其他关键信息。即使在原生应用中也不推荐这样做，因为如果攻击者足够执着，他们仍然可以解密你的数据。\n\
  \n## 通用安全要点\n\n大多数移动操作系统都提供硬件级加密。这为设备在锁定时提供了额外的保护。因此，我们必须确保始终使用最新的 SDK，而 Ionic 2\
  \ 仅支持 Android 4.4 及更高版本。除此之外，还有一些适用于 iOS 和 Android 的安全存储插件，它们分别使用 keychain（iOS）和\
  \ AES 加密（Android）。另一个插件是 PrivacyScreenPlugin，可用于在 Android 和 iOS 的应用切换器中隐藏敏感信息。用户将在任务切换器中看到启动屏幕，如果没有检测到该插件，则会显示黑屏。\n\
  \n逆向工程是许多开发者的另一个担忧，他们认为自己的应用代码很容易被提取出来，与某些恶意代码重新打包进应用中，然后再次上传到 Play Store。虽然这种做法在原生应用中同样可行，但在\
  \ Ionic 应用中，我们可以通过在运行时下载 JavaScript，并在应用关闭时将其删除来绕过这一安全问题。不过，我们需要思考是否真的需要这样做，因为这也会带来性能问题。另一方面，用\
  \ Java 或 Objective-C 实现这一点并动态存储代码库非常困难。\n\n混淆、精简和压缩是在 Ionic 应用中保护代码的几种方法。我们可以使用许多开源工具在将源代码打包到各个应用商店之前对其压缩和混淆。一些流行的工具包括\
  \ YUI compressor 和 UglifyJS，它们可用于混淆你的 JavaScript 资源。此外，你应该始终压缩所有 JavaScript 和 CSS\
  \ 资源，这将提高 Ionic 应用的性能，并减小 APK 文件的大小。还有一些企业级工具可用，例如 Jscrambler，它使用专有解决方案进行各种压缩和混淆。\n\
  \n以下是在发布应用之前，你可以针对安全方面关注的几个要点：\n\n- 任何敏感的业务逻辑都应在服务器端执行\n- 使用 uglify 混淆和压缩你的 JavaScript\
  \ 资源，或使用 Jscrambler\n- 不要使用低于 4.0 的 Android 操作系统\n- 对外部链接使用 InAppBrowser\n- 验证 HTML\
  \ 表单的用户输入\n- 不要缓存敏感数据\n- 不要使用 eval()，除非你清楚自己在做什么\n- 不要认为你的源代码始终是安全的\n- 尽量在 iOS 上使用\
  \ keychain 插件\n\n需要指出的是，安全是一个关键主题，开发者应始终关注 Cordova 的最新改进，以便在下次向应用商店发布应用时改进我们的应用。同时，确保不要牺牲性能。\n\
  \n### 在 Ionic 中演示授权\n\n现在，让我们构建一个同时处理身份验证和授权的 Ionic 应用。授权是指决定谁被允许做什么的规则。身份验证和授权是保护应用安全的核心部分：\n\
  \n*身份验证* = *登录* + *密码*（你是谁）\n\n*授权* = *权限*（允许你做什么）\n\n在本节中，我们将了解如何保护 Ionic 应用中需要登录才能访问的视图。我们将处理以下要点：\n\
  \n- `HomePage` 将是公开的\n- `ArticlesPage` 受保护，只有登录后才能访问\n- 菜单也会根据认证状态动态更新\n- 一旦用户登录，`LoginPage`\
  \ 将不可访问\n- 登录后，每次请求都会传递 Authorization 头\n\n让我们从创建应用开始，我将其命名为 `ionic2-auth`：\n\n\
  ```bash\n$ ionic start ionic2-auth sidemenu -v2\n$ ionic platform add android\n\
  $ npm install @ionic/storage --save\n$ ionic generate page articles\n$ ionic generate\
  \ page home\n$ ionic generate page login\n```\n\n我们将使用所有最新的库和当前的 Ionic 版本。此外，我们现在有了分屏（split\
  \ pane）和响应式网格，这使得 Ionic 应用更接近支持桌面应用。我们主要使用三个视图：可公开访问的 `HomePage`、受保护的 `ArticlesPage`\
  \ 以及 `LoginPage`。我们已将 `HomePage` 设置为 rootPage，因为它是公共视图。接下来，让我们看看动态菜单和登录/登出事件，这些将在\
  \ `app.component.ts` 中处理：\n\n```typescript\n// src/app/app.component.ts\n\nimport\
  \ { Component, ViewChild } from '@angular/core';\nimport { Nav, Platform, MenuController,\
  \ Events } from 'ionic-angular';\nimport { StatusBar, Splashscreen } from 'ionic-native';\n\
  import { ArticlesPage } from '../pages/articles/articles';\nimport { LoginPage }\
  \ from '../pages/login/login';\nimport { HomePage } from '../pages/home/home';\n\
  import { DataService } from '../providers/data-service';\nimport { Storage } from\
  \ '@ionic/storage';\n\n@Component({\n  templateUrl: 'app.html'\n})\nexport class\
  \ MyApp {\n  @ViewChild(Nav) nav: Nav;\n\n  rootPage: any = HomePage;\n\n  pages:\
  \ Array<{title: string, component: any}>;\n\n  constructor(public platform: Platform,\n\
  \    public storage: Storage,\n    public data: DataService,\n    public menu: MenuController,\n\
  \    public events: Events\n) {\n\n  this.initializeApp();\n  // used for an example\
  \ of ngFor and navigation\n  this.pages = [\n    { title: 'Home', component: HomePage\
  \ },\n    { title: 'Articles', component: ArticlesPage }\n  ];\n\n  this.listenToLoginEvents();\n\
  \n  // decide which menu items should be hidden\n  // by current login status stored\
  \ in indexedDB\n  this.data.isAuthorised().then((status) => {\n    this.enableMenu(status\
  \ === true);\n  });\n}\n}\n\ninitializeApp() {\n  this.platform.ready().then(()\
  \ => {\n    // Okay, so the platform is ready and our plugins\n    // are available.\n\
  \    // Here you can do any higher level native things\n    //     you might need.\n\
  \    StatusBar.styleDefault();\n    Splashscreen.hide();\n  });\n}\n\nlogin() {\n\
  \  this.nav.push(LoginPage);\n}\n\nlogout() {\n  this.events.publish('user:logout');\n\
  }\n\nopenPage(page) {\n  // Reset the content nav to have just this page\n  // We\
  \ wouldn't want the back button to show in this\n  // scenario\n  // Make sure to\
  \ catch the error here else\n  // you will get error\n  this.nav.setRoot(page.component).catch(()\
  \ => {\n    console.log(\"Page didnt load\")\n  })\n}\n\nlistenToLoginEvents() {\n\
  \  this.events.subscribe('user:login', (result) => {\n    this.enableMenu(true);\n\
  \    this.storage.set('user', result);\n  });\n\n  this.events.subscribe('user:logout',\
  \ () => {\n    this.enableMenu(false);\n    this.storage.remove('user');\n    this.nav.setRoot(HomePage).catch(()\
  \ => {\n      console.log(\"Page didnt load\")\n    })\n  });\n}\n\nenableMenu(loggedIn:\
  \ boolean) {\n  this.menu.enable(loggedIn, 'loggedInMenu');\n  this.menu.enable(!loggedIn,\
  \ 'loggedOutMenu');\n}\n}\n```\n\n\n\n\n\n我们在这里使用了 Events 类来处理我们的登录和登出事件，这是一个发布-订阅事件系统。一旦用户在\
  \ `LoginPage` 上登录成功，它就会调用登录事件。我们已将用户对象存储在 Ionic storage 中，因此之后进行 HTTP 请求时，我们可以使用它在请求中发送授权头。此外，我们还使用\
  \ `enableMenu()` 函数在这里启用特定的菜单：\n\n```html\n// src/app/app.html\n\n<ion-split-pane>\n\
  \  <ion-menu id=\"loggedOutMenu\" [content]=\"content\">\n    <ion-header>\n   \
  \   <ion-toolbar>\n        <ion-title>Menu</ion-title>\n      </ion-toolbar>\n \
  \   </ion-header>\n\n    <ion-content>\n      <ion-list>\n        <button menuClose\
  \ ion-item *ngFor=\"let p of pages\"\n          (click)=\"openPage(p)\">\n     \
  \     {{p.title}}\n        </button>\n        <button menuClose ion-item (click)=\"\
  login()\">\n          Login\n        </button>\n      </ion-list>\n    </ion-content>\n\
  \  </ion-menu>\n\n  <ion-menu id=\"loggedInMenu\" [content]=\"content\">\n    <ion-header>\n\
  \      <ion-toolbar>\n        <ion-title>Menu</ion-title>\n      </ion-toolbar>\n\
  \    </ion-header>\n\n    <ion-content>\n      <ion-list>\n        <button menuClose\
  \ ion-item *ngFor=\"let p of pages\"\n          (click)=\"openPage(p)\">\n     \
  \     {{p.title}}\n        </button>\n        <button menuClose ion-item (click)=\"\
  logout()\">\n          Logout\n        </button>\n      </ion-list>\n    </ion-content>\n\
  \  </ion-menu>\n\n  <!-- Disable swipe-to-go-back because it's poor UX to\n    \
  \   combine STGB with side menus -->\n  <ion-nav [root]=\"rootPage\" main #content\n\
  \    swipeBackEnabled=\"false\"></ion-nav>\n</ion-split-pane>\n```\n\n在前面的代码中是我们的\
  \ `app.html` 页面，我们在这里有 `rootPage`，并且也使用了 split pane 功能。你可以看到我们在同一侧有多个 ion-menus，我们可以根据传入的\
  \ id 来启用和禁用它们。让我们查看我们的 `LoginPage` 和 `ArticlesPage`，在那里我们调用了 API 请求并保护了路由：\n\n```typescript\n\
  // src/pages/login/login.ts\n\nonLogin(form: NgForm) {\n  this.submitted = true;\n\
  \n  if (form.valid) {\n    // start loader\n    let loading = this.loadingCtrl.create({\n\
  \      content: \"Login wait...\",\n      duration: 20\n    });\n    loading.present();\n\
  \    this.data.login(this.login).subscribe((result) => {\n        this.events.publish('user:login',\
  \ result);\n        this.navCtrl.setRoot(HomePage);\n        loading.dismiss();\n\
  \        this.showToast(undefined);\n    })\n  }\n}\n\nionViewWillEnter() {\n  \
  \  //Check if already authenticated\n    this.data.isAuthorised().then(res => {\n\
  \    if(res)\n        this.navCtrl.setRoot(HomePage);\n    else\n        console.log(\"\
  Please Login\");\n    })\n}\n```\n\n在这里你可以看到我们调用了服务方法进行登录，之后我们发布了 user: Login 事件，以便根据认证状态更新我们的应用程序。生命周期事件方法\
  \ ionViewWillEnter() 也被使用，在其中我们检查用户是否已授权，如果已授权则我们不会路由到 HomePage。Nav Guards 用于控制进入和离开视图，我们将在\
  \ ArticlesPage 上使用它：\n\n```\n// src/pages/articles/articles.ts\nexport class ArticlesPage\
  \ {\n    articles: Array<any>;\n    constructor(\n        public navCtrl: NavController,\n\
  \        public navParams: NavParams,\n        public toastCtrl: ToastController,\n\
  \        public data: DataService) {\n    }\n\n    ionViewDidLoad() {\n        console.log('ionViewDidLoad\
  \ ArticlesPage');\n        /*\n        Fetching Data after View Loaded\n       \
  \ Don't put this request in constructor\n        As, it will call the API irrespective\
  \ of\n        what ionViewCanEnter will return\n        */\n        this.fetchArticles();\n\
  \    }\n\n    fetchArticles() {\n        this.data.getArticles().subscribe(articles\
  \ => {\n            this.articles = articles;\n        })\n    }\n\n    ionViewCanEnter()\
  \ {\n        console.log(\"in ionViewCanEnter\")\n        var self = this;\n   \
  \     return new Promise((resolve, reject) => {\n            self.data.isAuthorised().then(res\
  \ => {\n                if(!res) {\n                    let toast = self.toastCtrl.create({\n\
  \                        message: \"Please Login to access this view\",\n      \
  \                  duration: 1500\n                    });\n                   \
  \ toast.present();\n                    reject(true);\n                } else {\n\
  \                    resolve(true);\n                }\n            })\n       \
  \ });\n    }\n}\n```\n\n在这里在 `ionViewCanEnter()` 方法内部我们检查用户是否已授权，并据此拒绝或解析 promise。你会看到当用户未\
  \ `loggedIn` 时我们将无法访问 `ArticlePage`。在这种情况下，我们的 API 甚至不会被调用，因为我们已在 `ionViewDidLoad()`\
  \ 方法内部调用了 `fetchArticles()` 方法，而该方法只有在 `ionViewCanEnter` 被解析时才会被调用：\n\n```\n// src/providers/data-service.ts\n\
  import { Injectable } from '@angular/core';\nimport { HttpClient } from './http-client';\n\
  import { Observable } from 'rxjs/Observable';\nimport 'rxjs/add/operator/map';\n\
  \nimport { Storage } from '@ionic/storage';\nimport { API_URL } from './constants';\n\
  \n@Injectable()\nexport class DataService {\n\n  constructor(public http: HttpClient,\
  \ public storage: Storage) {}\n\n  login(data): Observable<any> {\n    return this.http.post(API_URL\
  \ + '/users/login', data).map(res => res.json());\n  }\n\n  getArticles(): Observable<any>\
  \ {\n    return this.http.get(API_URL + '/articles?filter[limit]=10').map(res =>\
  \ res.json());\n  }\n\n  isAuthorised(): Promise<any> {\n    return this.storage.get(\"\
  user\").then((val) => {\n      console.log(val)\n      if(val) {\n        return\
  \ true;\n      }\n    })\n  }\n}\n```\n\n在 `data-service.ts` 内部我们放置了各种 API 和 `isAuthorised()`\
  \ 方法，该方法检查 Ionic storage 中的用户数据并据此返回。此外，我们还将在这里使用 `http-client` provider 来封装我们的\
  \ HTTP API 调用。我们使用它在成功登录后为每个请求设置授权头：\n\n```\n// src/providers/http-client.ts\nimport\
  \ { Injectable } from '@angular/core';\nimport { Http, Headers } from '@angular/http';\n\
  import { Storage } from '@ionic/storage';\nimport { Observable } from 'rxjs/Rx';\n\
  \n@Injectable()\nexport class HttpClient {\n\n  constructor(public http: Http, public\
  \ storage: Storage) {}\n\n  buildHeaders(){\n    let headers = new Headers({\n \
  \     'Accept': 'application/json',\n      'Content-Type': 'application/json; charset=utf-8'\n\
  \    })\n\n    return this.storage.get(\"user\").then(\n      (u) => {\nif(u){\n\
  \    headers.append('Authorization', u.id);\n    return headers;\n}\n}\n)\n}\n\n\
  get(url) {\n    return Observable\n        .fromPromise(this.buildHeaders())\n \
  \       .switchMap((headers) => this.http.get(url, {\n            headers: headers\
  \ }));\n}\n\npost(url, data) {\n    return Observable\n        .fromPromise(this.buildHeaders())\n\
  \        .switchMap((headers) => this.http.post(url, data,\n        { headers: headers\
  \ }));\n}\n}\n```\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_290_0.png)\n\n在这里我们有\
  \ get() 和 post() 方法，它们返回 observable，后者进一步使用 fromPromise() 方法，该方法将另一个现有 promise 包装为\
  \ observable 序列。在此之后我们使用了 switchMap() 方法，它确保 response/json 以我们想要的正确顺序返回，因为我们希望基于\
  \ headers 设置它并据此将其设置为 Http 方法。\n\nObservable 在这里是从 rxjs/Rx 引入的，而不是从 rxjs/Observable\
  \ 引入的。这样我们就可以自动获得对 fromPromise 方法的访问权限，否则它会报错。\n\n对于构建 headers，我们的 buildHeaders()\
  \ 方法检查 Ionic storage，如果 token 存在则将其附加到 authorization headers。我们已经涵盖了保护应用程序的所有重要方面。我们可以随时根据后端返回的角色进一步扩展它。这里的另一个不错的补充可以是扩展\
  \ `HTTP` 类以添加对 `401` 请求的拦截器，以便在用户 token 过期时将其从应用程序中注销。\n\n\n\n\n\n## 摘要\n\n在保护应用程序安全时，最重要的是正确保护你的服务器端\
  \ API。这样我们不会丢失任何关键数据，他人的数据也不会被公开分享。然而，当我们考虑保护代码库时，在原生的以及混合移动开发中，没有任何东西是100%安全的。不过，我们的目标应该是尽可能接近这个数字。首先限制你的暴露面，并确保不要把敏感数据和逻辑放在客户端。你应该确保尽力保护你的混合移动应用。但是，如果有人执意要破解，他们仍然可以绕过这些保护。\n\
  \n我们已经介绍了 Ionic 应用程序内部和外部的一些重要安全概念。现在我们将进一步把 Ionic 应用与 BaaS 服务（如 Firebase 和 Ionic\
  \ Cloud）集成。如果你的 Ionic 应用需求非常简单，并且没有太多服务器逻辑，你可以使用这些服务快速构建一个 Ionic 应用，而无需搭建任何服务器端代码库。我们将构建一个\
  \ **TasteBite** 应用，对菜品和餐厅进行综合评分，以便用户了解所在城市的名菜是什么，以及在哪里能品尝到做得最好的菜品。\n"
- "# Firebase 和 TasteBite 应用简介\n\n开始使用 Firebase 非常简单；这也是许多初创公司和成长型产品使用像 Firebase 这样的后端即服务平台的主要原因。我们将快速使用\
  \ Firebase 和 Ionic 创建一个 TasteBite 应用。在这个应用中，我们为使用 Firebase 的 Angular 应用集成了 AngularFire2\
  \ 包装器，不过我们也可以在应用内直接使用 JavaScript SDK。你需要在 Firebase 创建一个账户（最初可以使用免费账户；随着使用量增加，你可以轻松升级账户）。\n\
  \nFirebase 让开发者的生活更轻松，因为他们不必花时间构建后端服务器来提供简单的 API。我们可以用最少的精力轻松完成所有 CRUD 操作，并且借助 WebSocket\
  \ 支持，数据同步速度极快。此外，Firebase 还提供离线同步、用户身份验证、以及通过规则集保护数据的功能：\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_297_0.png)\n\
  \n创建账户后，你就可以在 Firebase 中创建应用；你会看到添加项目的选项。添加/创建项目后，你可以管理并进入你的应用。你会看到诸如分析、身份验证、数据库、存储、托管、通知以及许多其他选项。随着我们继续为应用创建数据，我们将使用其中的许多功能。你可以在下面的截图中看到，我们的应用中已经存储了一些数据。所有\
  \ Firebase 数据库数据都存储为 JSON 对象，不存在关系表。\n\n## 构建 TasteBite 并安装 Firebase\n\n我们首先从零开始创建一个应用，并安装此应用所需的所有插件和包。在此应用中，我们将使用\
  \ Tabs 模板并集成懒加载。我们将在应用中使用地理位置、相机和应用内浏览器插件：\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_299_0.png)\n\
  \n```\n$ ionic start tastebite tabs\n$ ionic cordova platform add android\n$ ionic\
  \ cordova plugin add cordova-plugin-inappbrowser\n$ ionic cordova plugin add cordova-plugin-geolocation\n\
  $ ionic cordova plugin add cordova-plugin-camera\n$ npm install --save @ionic-native/in-app-browser\n\
  $ npm install --save @ionic-native/geolocation\n$ npm install --save @ionic-native/camera\n\
  ```\n\n现在，我们准备在 Ionic 应用中设置 Firebase：\n\n```\n$ npm install angularfire2 firebase\
  \ --save\n```\n\n接下来，我们将在 app.module.ts 中导入 angularfire2 库：\n\n```\n// src/app/app.module.ts\n\
  \nimport { AngularFireModule } from 'angularfire2';\n\nexport const firebaseConfig\
  \ = {\n  apiKey: \"AIzaSyDnd6hMcfJDWGdGr6EOSS05NoMM2CeY2bw\",\n  authDomain: \"\
  tastebite-ec5c4.firebaseapp.com\",\n  databaseURL: \"https://tastebite-ec5c4.firebaseio.com\"\
  ,\n  storageBucket: \"tastebite-ec5c4.appspot.com\",\n  messagingSenderId: \"762350093850\"\
  \n};\n\n@NgModule({\n  declarations: [\n    Tastebite\n  ],\n  imports: [\n    BrowserModule,\n\
  \    HttpModule,\n    IonicModule.forRoot(Tastebite, {\n      preloadModules: true\n\
  \    }),\n    AngularFireModule.initializeApp(firebaseConfig)\n  ],\n```\n\n确保你如上例所示包含\
  \ `firebaseConfig`，它会有多个配置参数。此外，下一步是在初始化 Firebase 模块时注入 `firebaseConfig`。我们现在可以开始读取和写入应用中的数据了。\n\
  \n## 使用 Firebase 进行身份验证和安全\n\n我们现在来看看 Firebase 用户身份验证，以及我们如何保护数据。Firebase 在内部支持登录和身份验证，并且还提供与社交登录提供商集成的支持。大多数应用需要某种内部登录机制；使用\
  \ Firebase 设置起来非常容易。每当我们使用 Firebase 登录时，就会创建一个会话，并返回一个唯一 ID `uid`，该 ID 在所有提供者中都是唯一的，并且对于特定的已认证用户永远不会改变。这也将在以后帮助我们保护数据。\n\
  \n用户完成身份验证后，即使应用重启，其会话也会被管理和记住。Firebase 为多个平台提供用户身份验证：\n\n- **自定义** - 用于与现有身份验证系统集成\n\
  - **电子邮件** - 通过电子邮件和密码注册并验证用户。\n- **匿名** - 用于无需任何个人信息的访客账户\n- Facebook\n- Google\n\
  - Twitter\n- GitHub\n\n## 启用提供程序\n\n我们需要从应用程序的“身份验证-登录方式”选项卡中启用身份验证提供程序。我们已经为 TasteBite\
  \ 应用启用了基于电子邮件的登录和 Facebook 登录。使用基于电子邮件的登录来注册、登录和注销用户非常容易。如果我们已经有一些身份验证系统，则可以使用自定义身份验证；如果我们想允许访客登录，可以使用匿名用户身份验证。我们也将演示如何轻松集成社交登录。\n\
  \n所有社交登录都需要在社交渠道上创建的应用的客户端 ID 和客户端密钥。所有社交提供者都有不同的创建应用的方式，创建应用后，我们可以将客户端 ID 和客户端密钥放到\
  \ Firebase 应用中。我们需要确保已将 OAuth 重定向 URL 放置在 Facebook 登录产品中：https://tastebite-ec5c4.firebaseapp.com/__/auth/handler。在此之前，你必须在\
  \ Facebook 上创建一个应用程序，我们将把它的 app_id 和 app_secret 添加回 Firebase Facebook 提供者设置中。在此之后，你的后端工作就完成了，你只需从\
  \ Ionic 应用调用一个函数即可。\n\n我们现在将生成 AuthServiceProvider，它将用于 AngularFire2 身份验证：\n\n```\n\
  $ ionic g provider AuthService\n```\n\n在我们开始处理此提供程序之前，需要在 app.module.ts 文件中设置 FirebaseAuthConfig：\n\
  \n```\nimport { AngularFireModule, AuthProviders, AuthMethods } from 'angularfire2';\n\
  \nconst myFirebaseAuthConfig = {\n  provider: AuthProviders.Facebook,\n  method:\
  \ AuthMethods.Redirect\n};\n\nimports: [\n  AngularFireModule.initializeApp(firebaseConfig,\n\
  \    myFirebaseAuthConfig)\n]\n```\n\n这样我们就不必将此配置传递给基于 AngularFireAuth 的登录函数。不过，我们可以通过内部传递登录方法来覆盖此配置并使用任何其他提供程序。在上面的代码中，你可以看到\
  \ AuthMethods 选择的是 Redirect，但为了在浏览器上测试，你可以将其改为 Popup。\n\n现在让我们看看我们的 AuthService：\n\
  \n```\nimport { Injectable } from '@angular/core';\nimport { AngularFireAuth, FirebaseAuthState\
  \ } from 'angularfire2';\nimport * as firebase from 'firebase';\n\nimport { Platform\
  \ } from 'ionic-angular';\nimport { Facebook, FacebookLoginResponse } from '@ionic-native/facebook';\n\
  \n@Injectable()\nexport class AuthServiceProvider {\n\n  private authState: FirebaseAuthState;\n\
  \n  constructor(public auth$: AngularFireAuth, private fb: Facebook,\n    public\
  \ platform: Platform) {\n    this.authState = auth$.getAuth();\n```\n\n\n\n```typescript\n\
  auth$.subscribe((state: FirebaseAuthState) => {\n    console.log(state);\n    this.authState\
  \ = state;\n});\n}\n\nget authenticated(): boolean {\n    return this.authState\
  \ !== null;\n}\n\nsignInWithFacebook(): firebase.Promise<FirebaseAuthState | FacebookLoginResponse>\
  \ {\n    if (this.platform.is('cordova')) {\n        return this.fb.login(['email',\
  \ 'public_profile']).then(res => {\n            const facebookCredential = firebase.auth.FacebookAuthProvider.credential(res.authResponse.accessToken);\n\
  \            return firebase.auth().signInWithCredential(facebookCredential);\n\
  \        });\n    } else {\n        return this.auth$.login();\n    }\n}\n\nsignOut():\
  \ void {\n    this.auth$.logout();\n}\n\nauthData(): any {\n    if (this.authState\
  \ != null) {\n        return this.authState.auth;\n    } else {\n        return\
  \ '';\n    }\n}\n}\n```\n\n我们最初安装了 InAppBrowser Cordova 插件来处理此身份验证和重定向。\n\n我们还确认过，当我们在真实设备上运行时，会使用\
  \ Ionic Native 的 Facebook 插件。在这里，我们先调用 Facebook 插件，成功登录并从 Facebook 获取令牌后，再将其传递给\
  \ Firebase 的 `firebase.auth.FacebookAuthProvider` 函数进行身份验证。我们在 TasteBite 应用中使用了\
  \ Facebook 登录，不过如果需要，我们也可以实现其他提供商。\n\n## 用户认证状态\n\nFirebase 提供了一些与认证相关的 API，帮助我们获取认证状态并持久化它。为了侦测与密码更改或会话过期相关的任何认证变化，我们需要在初始化应用时监听\
  \ AngularFireAuth 类的 subscribe 函数：\n\n```typescript\nconstructor(public auth$: AngularFireAuth)\
  \ {\n  this.authState = auth$.getAuth();\n  auth$.subscribe((state: FirebaseAuthState)\
  \ => {\n    console.log(state);\n    this.authState = state;\n  });\n}\n```\n\n\
  我们将这段代码放在了 AuthServiceProvider 中；同样，如果你想停止监听这些变化，可以调用 offAuth() 函数，这样就不会再收到任何更新。在用户会话有效期间，Firebase\
  \ 会把会话保存到本地存储中；不过，如果你需要获取认证信息，可以调用 getAuth() 函数获取所有会话详情。为了减少服务器请求，我们可以使用 localStorage\
  \ 方法从存储中获取所有细节：\n\n```typescript\nsignOut(): void {\n  this.auth$.logout();\n}\n\
  ```\n\n用户会话目前会一直保持有效，直到调用 logout()（或用户清除本地存储）才会终止。最后，我们需要一个从 Firebase 注销会话的函数，可以使用\
  \ unauth()。\n\n## 使用 AngularFire2 进行 CRUD 操作与数据安全\n\n现在我们已经涵盖了与认证相关的代码，并为我们的 TasteBite\
  \ 应用搭建好了基础模块。接下来，我们将了解 Firebase Realtime Database，这是一个 NoSQL 云数据库。数据以 JSON 格式存储，并通过\
  \ WebSocket 实时同步。Firebase 数据库会将数据持久化到磁盘，这也为我们的应用提供了离线支持。我们将在这里使用两个对象：foodItems 和\
  \ rateItems，其中 foodItems 包含菜品的详细信息，而 rateItems 是一个嵌套对象，包含每个“菜品 + 城市”组合的评分和评论：\n\n\
  ![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_309_0.png)\n\n正如你所看到的，我们根据 userid 组织了 foodItem\
  \ 数据，以便区分与用户相关的数据。我们可以在仪表盘中遍历到 personalFavourite，然后访问用户数据节点。我们可以访问数据中的任何子节点。我们可以在仪表盘中将数据可视化；此外，Firebase\
  \ 团队还创建了一个名为 Vulcan 的 Chrome 插件，我们可以用它来查看数据树。\n\n由于 Firebase 中存储的数据都是对象，并且不原生支持数组。不过，为了简化开发，Firebase\
  \ 在其 SDK 中提供了将数据推送到数组的方法。Firebase 使用顺序键来存储数据：\n\n```js\n// push send this ['a',\
  \ 'b', 'c', 'd', 'e']\n// Firebase databases store this\n{0: 'a', 1: 'b', 2: 'c',\
  \ 3: 'd', 4: 'e'}\n```\n\n在 Firebase 上使用数组类型存储存在一些限制。此外，使用 Firebase 时，子节点的深度最多可达\
  \ 32 层，键长度可以为 768 字节。我们不会深入探讨 Firebase 的基础知识，因为我们可以轻松地在其官方文档中找到这些内容。\n\n## CRUD\
  \ 操作\n\n要从数据库读取或写入数据，我们需要一个数据库引用实例。虽然我们使用的是 AngularFire，这些函数已经被封装，我们直接使用 AngularFire\
  \ 库提供的函数；但有时我们也必须使用底层方法，就像稍后在该项目中要做的那样。现在，我们首先开始查询 foodItems，以便将它们显示在我们的 HomePage\
  \ 上：\n\n```typescript\n// src/pages/home/home.ts\nimport { Component } from '@angular/core';\n\
  import { IonicPage, NavController, NavParams } from 'ionic-angular';\nimport { AngularFire,\
  \ FirebaseListObservable } from 'angularfire2';\nimport { CityProvider } from '../../providers/city/city'\n\
  \n@IonicPage()\n@Component({\n  selector: 'page-home',\n  templateUrl: 'home.html',\n\
  })\nexport class HomePage {\n\n  foodItems: FirebaseListObservable<any[]>;\n  item;\n\
  \  constructor(\n    public navCtrl: NavController,\n    public navParams: NavParams,\n\
  \    public cityService: CityProvider,\n    public af: AngularFire) {\n```\n\n由于我们将按城市查询数据，因此我们使用了\
  \ cityService，它会根据我们的地理位置返回我们当前所在的城市。这样我们将只获取来自我们城市的数据：\n\n```typescript\nthis.cityService.getCityName().then(result\
  \ => {\n    let cityName = result[0]['address_components'][3].long_name;\n    this.foodItems\
  \ = af.database.list('/foodItems', {\n      query: {\n        orderByChild: 'city',\n\
  \        equalTo: cityName\n      }\n    });\n  })\n}\n\nratingPage(data:any) {\n\
  \  console.log(data);\n  // In FoodRatingPage we will be showing\n  // all the reviews\
  \ and rating for each item\n  this.navCtrl.push(\"FoodRatingPage\", data);\n}\n\
  }\n```\n\n接下来，如果用户点击任何一个菜品，它将显示与该菜品关联的所有评论和评分。\n\n如前所述，我们使用了一个城市提供者，它首先使用 Ionic\
  \ Native 地理定位插件，然后将纬度和经度传递给 Google API，Google API 会返回该地点的完整详细信息，包括街道名称、城市、州和国家。然后我们从中解析出城市名称，并在应用中使用它：\n\
  \n```typescript\n// src/providers/city/city.ts\nimport { Injectable } from '@angular/core';\n\
  import { Http } from '@angular/http';\nimport 'rxjs/add/operator/map';\n\nimport\
  \ { Geolocation } from '@ionic-native/geolocation';\n\n@Injectable()\nexport class\
  \ CityProvider {\n\n  constructor(public http: Http, private geolocation: Geolocation)\
  \ {\n    console.log('Hello CityProvider Provider');\n  }\n\n  getCityName() {\n\
  \    return new Promise(resolve => {\n      this.geolocation.getCurrentPosition().then((resp)\
  \ => {\n        let url =\n        \"http://maps.googleapis.com/maps/api/geocode/json?latlng=\"\
  \n        +resp.coords.latitude+\",\"+resp.coords.longitude\n        this.http.get(url).map(res\
  \ =>\n        res.json()).subscribe(data => {\n          resolve(data.results);\n\
  \        });\n      }).catch((error) => {\n        console.log('Error getting location',\
  \ error);\n      });\n    })\n  }\n}\n```\n\n当用户导航到下一页时，我们会传递特定的 foodItem 数据，这些数据稍后会在该页面中用于获取\
  \ foodRatings。我们将 foodRatings 和 foodItems 使用相同的 `$key` 进行存储，这样在这种情况下更容易获取数据：\n\n\
  ```typescript\n// src/pages/food-rating/food-rating\n\nimport { Component } from\
  \ '@angular/core';\nimport { IonicPage, NavController, NavParams } from 'ionic-angular';\n\
  \nimport { AngularFire, FirebaseListObservable } from 'angularfire2';\n\n@IonicPage()\n\
  @Component({\n  selector: 'page-food-rating',\n  templateUrl: 'food-rating.html',\n\
  })\nexport class FoodRatingPage {\n  item:any;\n  ratings:any;\n  foodRatings: FirebaseListObservable<any[]>;\n\
  \n  constructor(\n    public navCtrl: NavController,\n    public navParams: NavParams,\n\
  \    public af: AngularFire) {\n\n    this.item = this.navParams.data;\n    this.foodRatings\
  \ =\n      af.database.list('/rateItems/'+this.navParams.data.$key);\n  }\n\n  ionViewDidLoad()\
  \ {\n    console.log('ionViewDidLoad FoodRatingPage');\n  }\n\n  ratingPage() {\n\
  \    // Will push to RateFoodPage where we will rate this\n    // specific foodItem+city\
  \ combo\n    this.navCtrl.push(\"RateFoodPage\",\n    this.navParams.data);\n  }\n\
  }\n```\n\n\n\n\n\n现在，让我们看看如何在 Firebase 中创建一条条目。假设我们要对 `foodItem` 给出**评论**和**评级**，我们会在\
  \ `rateFoodPage` 页面上完成。这里我们再次使用同一个 `$key` 在数据库中存储新的评论。\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_313_0.png)\n\
  \n```typescript\n// src/pages/rate-food/rate-food\n\nimport { Component } from '@angular/core';\n\
  import { IonicPage, NavController, NavParams } from 'ionic-angular';\n\nimport {\
  \ AngularFire, FirebaseListObservable } from 'angularfire2';\nimport * as firebase\
  \ from 'firebase';\n\n@IonicPage()\n@Component({\n  selector: 'page-rate-food',\n\
  \  templateUrl: 'rate-food.html',\n})\nexport class RateFoodPage {\n\n  rateItems:\
  \ FirebaseListObservable<any[]>;\n  data: {name?: string, review?: string, rating?:\
  \ any} = {};\n  constructor(\n    public navCtrl: NavController,\n    public navParams:\
  \ NavParams,\n    public af: AngularFire) {\n\n    this.rateItems = af.database.list('/rateItems');\n\
  \    console.log(this.navParams.data);\n    this.data.name = this.navParams.data.name;\n\
  \  }\n\n  rate() {\n    let data = {\n      \"rating\": this.data.rating,\n    \
  \  \"review\": this.data.review\n    }\n    let url = \"rateItems/\" + this.navParams.data.$key\
  \ +\n      \"/\" +\n      this.makeid();\n    firebase.database().ref().child(url).set(data);\n\
  \    this.navCtrl.pop();\n  }\n\n  makeid() {\n    var text = \"\";\n    var possible\
  \ =\n      \"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789\";\n\
  \n    for( var i=0; i < 8; i++ )\n      text += possible.charAt(Math.floor(Math.random()\
  \ *\n        possible.length));\n\n    return text;\n  }\n}\n```\n\n我们使用了 `makeid()`\
  \ 函数为多个用户对同一 `foodItems` 的评论/评级生成随机的 `$keys`。在这里你可以看到，我们没有使用 `AngularFire` 方法，而是直接使用了\
  \ Firebase 方法，因为我们无法使用 `AngularFire` 标准函数以这种方式插入数据。\n\n除了创建和查询数据之外，我们还可以使用 `AngularFire`\
  \ 更新和删除对象。我们还没有在应用中使用这些功能，但它们实际上很容易执行：\n\n```javascript\n// Deleted the object and\
  \ handles error via promise\nconst promise = af.database.object('/item').remove();\n\
  promise\n  .then(_ => console.log('success'))\n  .catch(err => console.log(err,\
  \ 'You don\\'t have access!'));\n\n// updates data of an object\nconst itemObservable\
  \ = af.database.object('/item');\nitemObservable.update({ age: newAge });\n```\n\
  \n> 每一项技术和框架都在定期更新，因此我必须确保每个章节所关联的代码库尽可能频繁地更新。此外，很多时候章节中无法写尽所有功能，所以我已经尽最大努力在每个章节的演示项目中覆盖尽可能多的主题。因此，请务必仔细阅读代码库，只要有不一致的地方，我都会在代码中添加注释。\n\
  \n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_314_0.png)\n\n## 数据的结构与安全\n\n在 Firebase\
  \ 中存储和构建数据时，我们必须再三考虑如何为应用获取数据。这与使用任何其他 NoSQL 数据库（例如 MongoDB）时遇到的问题相同。我们应该倾向于将数据扁平化，而不是把所有内容都嵌套起来，并且在获取数据时必须将扁平化的数据重新联结在一起。\n\
  \n让我们以博客网站为例：用户创建博客文章，且所有博客文章都有评论。因此，我们更倾向于将数据拆分，而不是在 Firebase 中嵌套数据：\n\n```json\n\
  {\n  \"users\": {\n    \"user1\": {\n      \"name\": \"John Smith\",\n      \"type\"\
  : \"editor\",\n      \"blogs\": {\n        \"post1\": {\n          \"id\": 123456,\n\
  \          \"title\": \"Welcome to Ionic\",\n          \"post\": \"Ionic is an open\
  \ source SDK for hybrid apps\"\n        },\n        \"post2\": {\n          \"id\"\
  : 123457,\n          \"title\": \"Welcome to Ionic\",\n          \"post\": \"Ionic\
  \ is an open source SDK for hybrid apps\"\n        }\n      }\n    },\n    \"user2\"\
  : {\n      \"name\": \"Adam\",\n      \"type\": \"admin\",\n      \"blogs\": {\n\
  \        \"post1\": {\n          \"id\": 234567,\n          \"title\": \"Welcome\
  \ to Ionic\",\n          \"post\": \"Ionic is an open source SDK for hybrid apps\"\
  \n        }\n      }\n    }\n  }\n}\n```\n\n这种存储数据的方式在初期很容易处理，但随着数据量的增加，查询数据集会变慢，性能也会受损。因此，最佳的存储数据方式是：\n\
  \n```json\n{\n  \"users\": {\n    \"user1\": {\n      \"name\": \"John Smith\",\n\
  \      \"type\": \"editor\",\n      \"blogs\": {\n        \"123456\": true,\n  \
  \      \"123457\": true\n      }\n    },\n    \"user2\": {\n      \"name\": \"Adam\"\
  ,\n      \"type\": \"editor\",\n      \"blogs\": {\n        \"234567\": true\n \
  \     }\n    }\n  },\n  \"blogs\": {\n    \"123456\": {\n      \"title\": \"Welcome\
  \ to Ionic\",\n      \"post\": \"Ionic is an open source SDK for hybrid apps\"\n\
  \    },\n    \"123457\": {\n      \"title\": \"Welcome to Ionic 2\",\n      \"post\"\
  : \"Ionic is an open source SDK for hybrid apps\"\n    }\n  }\n}\n```\n\n现在我们已经将数据存储在\
  \ Firebase 中，下一步是获取数据并将其重新联结起来。联结扁平化数据有点困难，但这种方法带来了很多性能和模块化方面的好处。让我们看看如何获取上述数据并加以联结。\n\
  \n由于 Firebase 使用 WebSocket，通过这种方式获取数据时性能会很高，而且 Firebase 会在内部对传入和传出请求进行优化。\n\nFirebase\
  \ 还提供了一组安全规则来保护我们的数据，并帮助确定谁对数据集拥有读取和写入权限。所有安全规则都位于仪表板的**安全与规则（Security & Rules）**选项卡中。在我们的应用内部，应用数据是由用户定义并与用户关联的，因此我们相应地设置了规则：\n\
  \n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_317_0.png)\n\n共有三种类型的规则：\n\n- `.read`\
  \ - 当允许用户读取数据时\n- `.write` - 当允许写入数据时\n- `.validate` - 定义格式正确的数据，并在推送到数据库之前进行验证\n\
  \n安全规则采用 JSON 结构，正如你在前面的截图中所看到的，这使得理解和设置规则更加容易。该数据会与用户关联，因此我们相应地设置了规则。在我们的应用中，我们首先需要在注册过程中存储与用户相关的数据，例如姓名、电子邮件和其他详细信息：\n\
  \n```json\n{\n  \"rules\": {\n    \"users\": {\n      \"$user_id\": {\n        \"\
  .read\": \"$user_id === auth.uid\",\n        \".write\": \"$user_id === auth.uid\"\
  \n      }\n    }\n  }\n}\n```\n\n我们创建了一个 users 模型来存储这些详细信息。我们将数据嵌套在 `$user_id` 键中，以便创建访问控制，并且只有创建该数据集的用户才能编辑和访问它。类似地，对于\
  \ `feeds`，用户只能读取订阅源，而不能向其写入内容：\n\n```json\n{\n  \"feeds\": {\n    \".read\": true,\n\
  \    \".write\": false\n  }\n}\n```\n\nFirebase 内部提供了一些有助于提高查询数据性能的方法。例如，如果我们在一个模型中存储了学生的分数，并且需要按分数查询这些数据，那么我们可以在规则中使用\
  \ `.indexOn`，这样获取记录时的性能就会提高。你可以在此处了解更多关于保护 Firebase 中数据的信息：https://firebase.google.com/docs/database/security/。\n\
  \n## 总结\n\n将 Ionic 与 BaaS 平台结合使用，确实为初创公司减轻了很多压力，因为你可以在更短的时间内构建适用于多个平台的应用，而无需任何资源或时间来搭建后端服务器。如今，许多正在成长的公司正转向\
  \ Ionic，因为它开发速度快、成本更低。拥有良好 JavaScript 技能的小型开发团队可以构建一切，即使他们想为自定义任务建立后端，也可以使用 Node.js\
  \ 并在 JavaScript 之上构建整个技术栈。像 Firebase 这样的平台对移动应用来说非常强大，因为它使用 WebSocket，速度非常快，并提供实时数据同步。\n\
  \n接下来，我们将研究一些有趣的最新科技：物联网（IoT）。Ionic 在开发者中一直很出名，因为它可以快速构建应用，通过蓝牙或 HTTP API 控制各种物联网设备。我们将重点介绍使用\
  \ BLE 和 iBeacons 协议构建应用。我们还将了解 Google 的 Physical Web 计划，该计划使用 Eddystone 协议，实现与物理物体的物理交互。此外，市场上已有多种物联网设备，我们可以轻松地将它们与\
  \ Ionic 应用对接，解决许多问题。\n\n\n\n\n"
- "# Ionic 与物联网\n\n开发者已经开始认识到物联网（IoT）的巨大潜力。市场上物联网设备种类繁多，同时也需要相应的应用程序来远程控制这些设备。此时，Ionic\
  \ 便应运而生，帮助开发者快速且低成本地创建应用。Ionic 在构建这类应用时非常高效，同时还提供对设备功能的完整原生支持，例如通过蓝牙向物联网设备发送信号。目前已有多种设备通过蓝牙或\
  \ HTTP API 进行数据同步和执行各种操作。当前有许多令人兴奋的项目正在进行中，我们将尝试深入了解它们。下面来看看使用 Ionic 2 构建你的下一个物联网应用的一些理由：\n\
  \n- 使用 Ionic 2，我们可以通过单一代码库构建 Web 应用、Android、iOS 以及不久的将来的桌面应用。尤其对于原型开发而言，这非常有用。\n\
  - Ionic 应用使用 Web 技术构建，因此上手非常快。\n- Ionic 自带多套工具，因此你可以高效地引导应用启动并轻松部署。\n\n## Ionic\
  \ + Node = 强力组合\n\nNode.js 正在解决许多硬件和物联网设备的问题。我们可以用很多方式使用 Node.js 构建后端部分，并通过 HTTP\
  \ API 与 Ionic 应用通信。其中一个例子是使用 Ionic、Node.js、MQTT 和 Wi-Fi 模块，通过移动应用在互联网上通过 Wi-Fi 模块控制继电器。我们使用免费的在线代理\
  \ MQTT 将消息从 Node.js 服务器发送到 Wi-Fi 模块，该模块在 Arduino IDE 中设置。另一方面，我们使用 HTTP REST API\
  \ 从 Ionic 应用调用 Node.js 服务器。这样，我们就能够向 Wi-Fi 路由器发送信号并执行特定操作。\n\n用户需要某种界面来与这些物联网设备交互，这为基于\
  \ Ionic 的移动应用开辟了道路。我们将在本章后面实现一个名为 bleno 的节点模块，用于实现 BLE 外设。Noble 和 bleno 是用于 BLE\
  \ 实现的两个常用模块。Noble 扫描其附近的周边外设，bleno 作为外设进行传输。此外，还有其他多个物联网模块可作为 NPM 包使用，能让你快速上手：\n\
  \n- **Cylon.js**：主要用于机器人和物联网\n- **Node-RED**：用于将多个物联网硬件设备连接在一起的工具\n- **DeviceJS**：面向物联网的\
  \ JavaScript 引擎，物联网领域的 jQuery\n- **noduino**：用于控制 Arduino 的 Node.js 框架\n\nWebSocket\
  \ 可以像 MQTT 一样成为另一种消息传递协议。我们将在本章的演示中使用 WebSocket。我们可以做的事情是无穷无尽的。Arduino 和 Raspberry\
  \ Pi 是用于构建可与其他硬件设备交互的应用的两个著名开发板。你可以在网上找到许多在黑客马拉松或学习期间构建的示例，其中开发者使用 Ionic 应用实时点亮\
  \ LED。其中一个示例使用 Raspberry Pi GPIO 引脚和连接到它上面的面包板。Node.js 代码驻留在 Raspberry Pi 上，LED\
  \ 灯泡连接到面包板。我们可以想到的另一个示例是连接温度、GPS 等传感器。你可以在 https://github.com/arjunsk/Ionic-IoT-Monitor\
  \ 找到一个有趣的 Ionic 应用示例，它使用 MQTT 实时从传感器获取数据并在应用中可视化。\n\n可能性是无限的，随着物联网行业的发展，你会发现更多传感器和硬件设备不断涌现，以解决许多现实问题。你甚至可以考虑控制所有家庭设备并构建一个家庭自动化项目，类似于马克·扎克伯格几个月前用他的\
  \ Jarvis AI 所做的。尽管他在项目中使用 AI，但我们完全可以简单地根据我们的需求开始控制所有智能设备。作为开发者，最好的部分是，即使你只写一小段让你的生活更轻松的代码，你也会非常喜欢它。\n\
  \n## BLE、信标和物理 Web\n\nBLE 代表低功耗蓝牙（Bluetooth Low Energy）。蓝牙 4.0 为物联网行业带来了创新性的变革。曾几何时，蓝牙被视为交换文件的一种媒介，但随着技术的发展，我们已经看到健身手环和智能手表市场的增长。蓝牙智能设备功耗低，有助于延长智能手机电池寿命，并被证明对物联网行业非常有效。随着蓝牙再次渗透到市场，我们看到物联网行业中对蓝牙设备的使用率很高。\n\
  \n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_331_0.png)\n\n这是我在一次黑客马拉松期间构建的应用截图，它使用\
  \ Kontakt 信标广播 iBeacon，而我们基于 Ionic 的移动应用检测到该信标并触发本地通知。\n\n我们一直在谈论很多关于信标的内容。让我们来看看\
  \ iBeacon 是什么。iBeacon 是由 Apple 开发的一种协议，它设定了如何传输数据信号的布局。通常，BLE 广播有两种协议：iBeacon 和\
  \ Eddystone。标准的 iBeacon 广播包含 UUID、major 和 minor：\n\n```\nUUID: f7826da6-4fa2-4e98-8024-bc5b71e0893e\n\
  \nMajor ID: 65279\n\nMinor ID: 63150\n```\n\n## Eddystone 与物理 Web\n\nEddystone 是由\
  \ Google 发布的 BLE 信标协议，它是开源的且跨平台。Eddystone 包含三种数据类型帧：Eddystone-UID、Eddystone-URL\
  \ 和 Eddystone-TLM：\n\n- **Eddystone-UID**：一个唯一的 16 字节静态 ID，通常被原生应用使用\n- **Eddystone-URL**：一个物理\
  \ Web 项目，传输可直接供客户端使用的压缩 URL\n- **Eddystone-TLM**：广播信标信息，如电池电量、传感器数据和其他信息\n\n现在几乎所有主要的信标制造商都支持\
  \ iBeacon 和 Eddystone 数据格式。Google 目前正在推广信标技术，以提供更好的定位和邻近体验。目前，Eddystone-URL 帧被广泛用于物理\
  \ Web 计划中。\n\n*物理 Web 是一种开放方法，旨在实现对物理对象和位置的快速无缝交互。*\n\n物理 Web 将 URL 的力量扩展到日常物理对象上。这使你无需下载特定于设备的应用即可与任何物理设备（例如自动售货机租赁）进行交互。使用起来非常顺畅：你只需点击设备上附带的\
  \ URL，并在网络浏览器中使用它。物理 Web 是一个很小的发现服务，它提供附近的移动设备可以接收的特定 URL。这将带你进入一个完全交互式的网页，或深层链接到原生应用。\n\
  \n我们已经面临着安装多个应用会占用设备内存和存储空间的挑战。此外，管理多个应用也很头疼，这也是开发者开始考虑将移动 Web 与 PWA 结合起来的另一个原因。同样，随着物联网设备不断增加，为每台设备安装应用并不具备可扩展性。因此，物理\
  \ Web 在这里提供了帮助，你可以打开 URL 在 Web 上操作设备，而后端可以通过多种协议与设备通信。让我们想一个现实生活中的例子。如果你正在做演讲，你可以使用信标广播幻灯片\
  \ URL，并让听众打开蓝牙和定位服务来接收该 URL。\n\n我们也不需要真正的硬件信标设备来演示这一点或在会议中广播。有一个 NPM 包，名为 Eddystone-beacon，我们可以用它来广播\
  \ Eddystone URL：\n\n```\n$ npm install eddystone-beacon --save\n$ sudo node -e \"\
  require('eddystone-beacon').advertiseUrl('https://www.facebook.com/veloice');\"\n\
  ```\n\n只需确保你所使用的 Linux 笔记本电脑已启用蓝牙即可。现在启用 Android 手机上的蓝牙和定位服务，你会看到一个带有 Web URL 标题和描述的通知。\n\
  \n\n\n\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_334_0.png)\n\n这里我广播了三个不同的 URL，你可以在通知菜单中看到全部三个\
  \ URL 的详细信息。这是一个关于如何在公开场合分享 URL 的小例子。你可以在 Physical Web 网站上找到很多这样的例子（https://google.github.io/physical-web/）并看看如何从这一倡议中构建出东西。\n\
  \n我们可以用 iBeacons 和 Eddystone 执行各种功能，例如测距、区域监控和其他设置。基于 tx 和 RSSI 值，我们可以获取设备与信标之间的近似距离。借助信标，我们甚至可以进行室内地图绘制和地理围栏。\n\
  \n## 基于接近度的屏幕锁定，使用 BLE\n\n这是一直以来我想实现的东西，也是我现实生活中的一个问题。是时候研究一下使用 BLE 栈与 Ionic 应用结合是否切实可行了。在办公室工作时，我经常需要离开座位去接一些紧急电话或参加会议。大多数时候我忘记给笔记本电脑屏幕锁定。所以，我想用\
  \ BLE 和 WebSockets 构建这个基于接近度的屏幕锁定应用。\n\n让我们先看看应用程序的工作原理。基于 Ionic 的应用程序会监听笔记本电脑持续广播的\
  \ iBeacon 数据包。当我带着手机离开座位时，在某个点上它会退出笔记本电脑的广播区域。立即，它会通过网络向运行在我 Ubuntu 笔记本上的 Node.js\
  \ 应用发送一个 socket 请求，并在我的笔记本上调用屏幕锁定命令。同样地，当我重新进入广播范围时，它会发送另一个 socket 请求来解锁笔记本。\n\n\
  我们在这里使用的技术栈是：\n\n- Node.js\n- Web Sockets\n- BLE\n- Ionic\n- Bash script\n\n我们必须先准备好\
  \ Node.js 后端和 bash 脚本，才能开始我们的应用程序。在此之前，请确保已安装用于 BLE 和 Node.js 的所有 Debian 包。\n\n\
  ```\n$ sudo apt-get install bluetooth bluez libbluetooth-dev libudev-dev\n```\n\n\
  现在我们可以使用 `npm init` 命令初始化项目：\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_337_0.png)\n\
  \n我们为应用程序使用以下 NPM 包：\n\n- `app` 和 `http` - 用于创建 Web 服务器并在 5000 端口监听\n- `io` - 用于\
  \ websocket 实现\n- `bleno` - 用于实现 BLE 外设\n- `child_process` - 用于执行 bash 文件\n\n```javascript\n\
  $ npm install express http bleno socket.io   // index.js\n\nvar app = require('express')(),\n\
  \    http = require('http').Server(app),\n    io = require('socket.io')(http),\n\
  \    bleno = require('bleno');\n    exec = require('child_process').exec;\n\n//\
  \ Start advertising iBeacon\nvar uuid = '38a48d7e-05ab-11e7-93ae-92361f002671';\n\
  var major = 10; // 0x0000 - 0xffff\nvar minor = 5; // 0x0000 - 0xffff\nvar measuredPower\
  \ = -59 // -128 - 127\n\nbleno.on('stateChange', function(state) {\n    console.log('on\
  \ -> statechange: ' + state);\n    if (state === 'poweredOn') {\n        bleno.startAdvertisingIBeacon(uuid,\
  \ major, minor,\n            measuredPower);\n    } else {\n        bleno.stopAdvertising();\n\
  \    }\n});\n```\n\n最初，我们声明了用于广播 iBeacon 的属性。我们在这里监听 `stateChange` **listener**，这样在\
  \ **Bluetooth** 开启/关闭时，我们就可以分别使用 `startAdvertisingIBeacon()` 和 `stopAdvertising()`\
  \ 方法启动或停止 **iBeacon** 广播。\n\n现在我们准备好开始我们的 Ionic 应用以与后端交互。让我们使用 tabs starter 模板启动应用：\n\
  \n```\ngaurav@gaurav-thinkpad:~/projects/ionic$ ionic start lock-app tabs --v2\n\
  Creating an Ionic 2.x app in /home/gaurav/projects/ionic/lock-app based on the tabs\
  \ template.\nDownloading: https://github.com/driftyco/ionic2-app-base/archive/master.zip\n\
  Downloading: https://github.com/driftyco/ionic2-starter-tabs/archive/master.zip\n\
  Installing npm packages (may take a minute or two)...\n/ ♪ ♪ ♪ ♪  Your Ionic app\
  \ is ready to go! ♪ ♪ ♪ ♪\nSome helpful tips:\nRun your app in the browser (great\
  \ for initial development):\n  ionic serve\nRun on a device or simulator:\n  ionic\
  \ run ios[android,browser]\nShare your app with testers, and test on device easily\
  \ with the Ionic View companion app:\n  http://view.ionic.io\ngaurav@gaurav-thinkpad:~/projects/ionic$\n\
  ```\n\n由于我们已经清楚应用中将使用哪些内容，让我们安装平台、Cordova 插件和 NPM 包：\n\n```\n// add android platform\n\
  $ ionic platform add android\n\n// add ibeacon and diagnostic plugins\n$ ionic plugin\
  \ add cordova-plugin-ibeacon --save\n$ ionic plugin add cordova.plugins.diagnostic\
  \ --save\n\n// install NPM package for socket.io-client\n$ npm install socket.io-client\
  \ --save\n```\n\n我们首先通过检查蓝牙是否已启用并要求用户授予位置权限来开始，这在使用 diagnostic 插件时自 Android 6 起成为强制要求：\n\
  \n```typescript\n// src/app/app.component.ts\n\nimport { Component } from '@angular/core';\n\
  import { Platform } from 'ionic-angular';\nimport { IBeacon, Diagnostic, StatusBar,\
  \ Splashscreen } from 'ionic-native';\n\nimport { TabsPage } from '../pages/tabs/tabs';\n\
  \ndeclare var cordova: any;\n\n@Component({\n  templateUrl: 'app.html'\n})\nexport\
  \ class MyApp {\n  rootPage = TabsPage;\n\n  constructor(platform: Platform) {\n\
  \    platform.ready().then(() => {\n      // Okay, so the platform is ready and\
  \ our plugins are available.\n      // Here you can do any higher level native things\
  \ you might need.\n\n      StatusBar.styleDefault();\n      Splashscreen.hide();\n\
  \n      if (platform.is('cordova')) {\n\n        // Checks if bluetooth is enabled\n\
  \        IBeacon.isBluetoothEnabled().then((isEnabled) => {\n          console.log(\"\
  isEnabled: \" + isEnabled);\n          if (!isEnabled) {\n            // If not,\
  \ enableBluetooth() enables it\n            IBeacon.enableBluetooth();\n       \
  \   }\n        });\n\n        // Check if location is enabled\n        Diagnostic.isLocationEnabled().then((result)\
  \ => {\n          // If not, open location settings\n          if (!result) {\n\
  \            Diagnostic.switchToLocationSettings();\n          }\n        });\n\n\
  \        // Diagnostic plugin\n        // After Android 6, we need to explicitly\n\
  \        // ask for permission from the user\n        Diagnostic.requestRuntimePermissions([\n\
  \          cordova.plugins.diagnostic.permission.ACCESS_FINE_LOCATION,\n       \
  \   cordova.plugins.diagnostic.permission.ACCESS_COARSE_LOCATION\n        ]);\n\
  \      });\n  }\n}\n```\n\n最初，我们检查 isBluetoothEnabled()，它会根据状态返回一个布尔值。之后，如果返回 false，则我们调用\
  \ enableBluetooth() 方法来启用蓝牙。同样，isLocationEnabled() 用于检查位置是否已启用，如果未启用，则调用 switchToLocationSettings()\
  \ 方法，该方法会打开位置设置。\n\nDiagnostic.requestRuntimePermissions() 需要获取运行时权限，这对于运行 Android\
  \ 6 及以上版本的所有设备都是必需的。对于 BLE 的监控和测距，我们需要 ACCESS_FINE_LOCATION 和 ACCESS_COARSE_LOCATION\
  \ 权限：\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_340_0.png)\n\n```typescript\n\
  IBeacon.enableDebugNotifications();\n}\n}\nmanageLaptop(data, status) {\n    this.socket.emit('status',\
  \ status);\n}\n```\n\n`startMonitoringForRegion()` 方法开始对指定区域进行监控，该区域的 `uuid`、major\
  \ 和 minor 与我们的 Node.js 代码广播的一致。现在，当你离开座位并移出蓝牙范围时，`didExitRegion()` 方法将被调用，它会订阅并进一步调用我们的\
  \ `manageLaptop()` 方法，传入数据和锁定状态。同样，当我们返回时，`didEnterRegion()` 将被调用：\n\n```typescript\n\
  initialize() {\n    this.socket = io.connect(this.socketHost);\n\n    this.socket.on(\"\
  connect\", (msg) => {\n        console.log('on connect');\n    });\n\n    this.socket.on(\"\
  reconnecting\", (msg) => {\n        console.log('on reconnecting');\n    });\n\n\
  \    this.socket.on('disconnect', function() {\n        console.log('user disconnected');\n\
  \    });\n\n    this.socket.on(\"result\", (msg) => {\n        this.laptop_status\
  \ = msg;\n        console.log(msg, \"==received=msg===\")\n    });\n}\n```\n\n在我们的\
  \ `manageLaptop()` 方法内部，我们向服务器发出自定义事件。在此之前，我们还初始化了 `initialize()` 函数，以在后端 Node.js\
  \ 应用运行的主机上与服务器建立初始连接。\n\n这样我们的整个演示就完成了。对我个人而言，它运行得非常好，并且提供了手动锁定和解锁按钮，我也可以远程锁定我的笔记本电脑。你可以用\
  \ Ionic 和 IoT 快速构建许多小技巧和原型。\n\n\n\n\n\n## Summary\n\n信标及其应用即将在多个领域出现，尤其是在零售领域。然而，就广泛实施而言，它仍然是一种非常新的技术。零售商应尝试思考新的创新，利用新技术来提升用户体验。我们已经讨论并快速实现了许多关于如何将物联网与\
  \ Ionic 应用结合使用的用例。我一直定期关注 Ionic 博客，看到许多团队使用 Ionic 来与他们的硬件设备进行交互，其中之一就是 jewelbots，它可以在朋友靠近时启用或向你发送消息。机会是巨大的，只需要一个想法来实现它并将其带到世界。\n\
  \n我们几乎接近旅程的尾声，但仍有一个有趣的话题等待在下一节中介绍。我们在本章中讨论了为访问设备而安装多个原生应用程序的问题，而这个问题正是通过为 Ionic\
  \ 引入 PWA 支持而得到解决的。PWA 即使在低网速下也让用户体验变得沉浸式。印度许多电子商务和大型科技公司在 Flipkart 最初与 Chrome 团队合作推出其渐进式网络应用后，也推出了自己的渐进式网络应用。突然之间，我们可以看到市场正在增长，开发者正在构建平台以使当前网络应用能够启用\
  \ PWA 功能。尽管如此，它并不会终结原生应用市场，因为我们没有所有插件的能力。使用 Ionic 的最好之处在于，完全相同的代码可以同时转换为 PWA 和原生应用。\n"
- "# Ionic + PWA = Magic\n\n在移动应用之后出现的下一个大事物是面向移动网络的渐进式网络应用。**渐进式网络应用 (PWA)** 最初由\
  \ Google 于 2015 年启动，我们已经可以看到许多大型公司推出了面向移动网络的 PWA 版本。在 PWA 之前，许多开发者和公司对移动网络失去了兴趣，只专注于原生应用，但\
  \ Google 变得严格，开始惩罚那些带有下载原生应用横幅或不具备移动友好性的网站的站点。在此之后，开发者也开始着手移动网络，同时 Google Chrome\
  \ 推出了对 PWA 的支持，而 Flipkart 最初与 Chrome 团队密切合作推出了其渐进式网络应用。\n\n一切都关乎提供出色的用户体验，无论是原生应用还是\
  \ PWA，最终用户并不关心，只要他们拥有流畅的体验即可。我们将在本章中探讨以下主题：\n\n- What and why PWAs?\n- Ionic supports\
  \ PWA\n- Offline currency converter PWA\n- Future of PWAs\n\n## What and why PWA?\n\
  \nPWAs 是一种新型的网络应用。它们结合了原生应用的优势与网络的低摩擦特性。渐进式网络应用起初是简单的网站，但随着用户与其交互，它们会逐步获得超能力。它们从网站转变为更强大的东西，例如传统的原生应用。\n\
  \nPWAs 具有以下特点：\n\n- **Reliable**: PWAs 即时加载，即使在糟糕的网络条件下也不会显示恐龙。当应用从用户主屏幕启动时，服务工作者（稍后会讨论）使渐进式网络应用能够即时加载，而不管网络状态如何。\n\
  - **Portable**: 原生应用的可移植性有许多策略（包括混合应用），但与这些策略不同，PWAs 不会改变你的部署和打包模型。\n- **Engaging**:\
  \ PWAs 在设备上感觉像是一个自然的应用，具有出色的用户体验。它们可安装，可以添加到用户主屏幕，而无需任何应用商店。它们提供与原生应用相同的全屏体验，甚至可以通过网络推送通知重新吸引用户。\n\
  - **Fast**: PWAs 速度快，对交互做出快速响应并具有流畅的动画。用户总是期望网站快速流畅。根据一项调查，如果网站加载时间超过三秒，53% 的用户会放弃该网站。\n\
  \n## Advantages of PWA\n\nPWAs 相对于原生应用具有某些优势，它是未来数年内将上网的数十亿用户的未来。现在我们将谈论其优势以及它们对移动用户为何至关重要：\n\
  \n- **Install prompt**: 安装横幅非常关键，它们会增加与应用的互动。目前，开发者无法控制这一点，而是由 Chrome 决定何时提示用户显示添加到主屏幕的选项。\n\
  - **Works offline**: 许多地区的互联网连接可能非常糟糕，这就是为什么我们需要为应用提供离线支持。PWAs 有助于我们获得更好的用户体验和参与度。Cache\
  \ APIs 和 IndexedDB 是实现 PWA 离线访问的两种推荐方法。\n- **Lightweight**: 渐进式网络应用只是网页，非常轻量且安装快速。PWAs\
  \ 不会占用大量安装空间，并且会实时更新，因为它们无需通过 Play Store 审核。\n- **Linkable and discoverable**: 我们可以轻松分享\
  \ URL，并且由于 manifest 和服务工作者注册范围而被识别为应用。此外，还允许搜索引擎找到它。\n- **Web push notifications**:\
  \ 服务工作者也有助于处理网络推送通知，这有助于重新吸引用户。PWA 仅通过 HTTPS 提供服务，因此确保了安全性。\n- **Update on use**:\
  \ 与通常的原生应用更新策略不同，PWAs 的更新方式与网页相同：使用它们即可获得最新版本。\n- **Analyze before installation**:\
  \ 你无需安装即可开始使用它们。它们只是简单的网页。用户在想要时选择安装。\n\n## Disadvantages of PWA\n\nPWA 的缺点如下：\n\
  \n- **Traffic through store**: PWA 缺少通过 Play Store 或应用商店进行主要搜索的重要流量。用户可以通过移动网络被重定向到\
  \ Play Store 下载原生应用，但对于 PWA 来说则不适用。\n- **Plugin integration**: 诸如 Facebook 和 Google\
  \ 登录之类的插件无法从其应用中获取数据，我们需要在网络上单独获取。\n- **Promotion**: 随着公司制作自己的应用内浏览器，在社交媒体上推广 PWA\
  \ 体验变得越来越困难。\n- **Browser support**: 在某些设备上的某些浏览器中，PWAs 的完整支持不可用。\n\n## Ionic supports\
  \ PWA\n\nIonic 团队是渐进式网络应用的忠实粉丝，它利用现代网络 API 提供类似应用的体验。由于 Ionic 3 是用在网络浏览器中完美运行的网络技术构建的，这在你使用\
  \ Ionic 构建 PWA 时为你提供了巨大的优势，因为如果你知道如何构建 Ionic 3 应用，那么你就可以在短时间内轻松构建 PWA，你只需要添加服务工作者和一个网络清单文件。我们将构建一个具有\
  \ PWA 支持的离线货币转换器，并最终将其托管在 Firebase Hosting 上。\n\n## What makes a web application\
  \ a PWA?\n\n简单来说，PWA 意味着最终会被安装到用户的主屏幕，这意味着他们会像使用原生应用一样访问它。因此用户期望与使用原生应用时相同的体验。由于\
  \ Ionic 3 旨在使用标准网络技术创建原生应用体验，因此这已经得到处理。\n\nPWA 应该非常高效，因为 PWA 将与原生应用一起安装到主屏幕。Ionic\
  \ 3 是从一开始就以性能为目标构建的，这意味着你几乎不必为此担心。由于 PWA 将安装在用户的主屏幕上，此过程需要你的应用的网络清单。值得庆幸的是，Ionic\
  \ 3 CLI 附带了内置的清单文件。\n\n大多数原生应用在启动时可离线工作并为用户提供有限的离线体验，因此 PWA 也可以为用户做到这一点。在服务工作者的帮助下，我们现在可以让我们的网络应用在离线时工作。\n\
  \n\n\n\n```html\n<link rel=\"manifest\" href=\"manifest.json\">\n```\n\n```json\n\
  // src/manifest.json\n{\n  \"name\": \"Currency Converter PWA\",\n  \"short_name\"\
  : \"Currency\",\n  \"start_url\": \"index.html\",\n  \"display\": \"standalone\"\
  ,\n  \"icons\": [{\n    \"src\": \"assets/logo.png\",\n    \"sizes\": \"512x512\"\
  ,\n    \"type\": \"image/png\"\n  }],\n  \"background_color\": \"#db0000\",\n  \"\
  theme_color\": \"#000000\",\n  \"gcm_sender_id\": \"124917710568\"\n}\n```\n\n-\
  \   fullscreen：使用所有可用的用户区域，且不显示用户代理Chrome。\n-   display：定义开发者偏好的Web应用显示模式。\n-  \
  \ start_url：指定用户从设备启动应用时加载的URL。在我们的Ionic应用中，它始终是index.html。\n-   short_name：用于没有足够空间显示Web应用完整名称的地方。\n\
  -   name：这是用户打开应用时在启动页（splashscreen）上看到的名称。\n-   Standalone：应用在视觉和体验上都将像一个独立应用。这可以包括应用拥有不同的窗口、在应用启动器中拥有自己的图标等。\n\
  -   minimal-ui：应用在视觉和体验上像一个独立应用，但会有一组用于控制导航的最小UI元素。这些元素因浏览器而异。\n-   Browser：应用在常规浏览器标签页或新窗口中打开，具体取决于浏览器和平台。这是默认情况。\n\
  -   Icons：用于应用各种不同位置的图标数组，例如，当我们将其添加到主屏幕时，该图标会与应用短名称一起放置。\n-   background_color：Web应用的预期背景颜色。\n\
  -   theme_color：应用的默认主题颜色。\n-   gcm_sender_id：用于发送Web推送通知，代表Firebase Cloud中的sender_id：\n\
  \n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_360_0.png)\n\n你可以看到，在实现了上述部分属性后，安装应用时启动画面的外观。\n\
  \n## 服务工作线程\n\n在Ionic 3中使用服务工作线程非常简单，Ionic自带`service-worker.js`文件，该文件最初在`index.html`文件中被注释掉。我们只需取消注释该部分，你就会看到服务工作线程在浏览器中注册。\n\
  \n服务工作线程本质上充当代理服务器，位于Web应用与浏览器之间，以及浏览器与网络之间（当可用时）。它们旨在（除其他功能外）实现有效的离线体验、拦截网络请求，并根据网络是否可用以及服务器上是否有更新的资源来采取适当的行动。它们还允许访问推送通知和后台同步API。\n\
  \n服务工作线程具有生命周期和各种操作的事件。我们首先在页面上注册服务工作线程，成功的注册生命周期从install和activate事件开始。Ionic 3在`src`文件夹内的`index.html`文件中带有内置注册代码，只需取消注释即可。现在，你可以访问[chrome://serviceworker-internals/](chrome://serviceworker-internals/)并查看你的站点，来检查服务工作线程是否已启用：\n\
  \n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_362_0.png)\n\n正如你所看到的，我们在`localhost:8100`本地提供的应用已注册服务工作线程。不过，当我们部署PWA时，它必须通过安全方式提供服务（HTTPS且无证书错误）。Firebase托管和GitHub\
  \ Pages通过HTTPS托管，因此它们可以作为托管PWA应用的最佳场所。\n\n注册完成后，接下来就是安装事件以开始其工作。在install事件中，我们缓存所有静态文件。`event.waitUntil()`方法确保服务工作线程在其中的代码执行完成之前不会被安装。现在，`cache.addAll()`将静态资源缓存到缓存存储中：\n\
  \n```javascript\nvar cacheName = 'cache-v1';\n// pre-cache our key assets\nvar files\
  \ = [\n  './build/main.js',\n```\n\n```javascript\ncaches.match(request).then((response)\
  \ => {\n    if (response) {\n        return response;\n    }\n\n    //if request\
  \ is not cached, add it to cache\n    return fetch(request).then((response) => {\n\
  \        var responseToCache = response.clone();\n        caches.open(cacheName).then((cache)\
  \ => {\n            cache.put(request, responseToCache).catch((err) => {\n     \
  \           console.warn(request.url + ': ' + err.message);\n            });\n \
  \       });\n\n        return response;\n    })\n});\n```\n\n> *在sw-toolbox支持之后，我们使用sw-toolbox路由方法来获取资源，并根据可用的不同策略对其进行缓存，我们将在演示中进一步看到。*\n\
  \n服务工作线程可以执行推送事件、创建用户通知、打开特定页面或运行一些后台脚本：\n\n```javascript\nself.addEventListener('push',\
  \ (event) => {\nconsole.log('Received a push message', event);\n\nconst title =\
  \ 'Yay a message.';\nconst body = 'We have received a push notification.';\nconst\
  \ icon = 'assets/icon.png';\nconst tag = 'simple-push-demo-notification-tag';\n\n\
  event.waitUntil(\n    self.registration.showNotification(title, {\n        body:\
  \ body,\n        icon: icon,\n        tag: tag\n    })\n);\n});\n```\n\n最近，Ionic增加了对sw-toolbox的支持，这是一个`service-worker`库，它减少了很多工作量。\n\
  \n### 服务工作线程工具箱（sw-toolbox）\n\n它现在已内置到starter和conference应用中。这允许你使用高级API而不是原始Service\
  \ Worker API来定制你的服务工作线程。我们的开箱即用配置将为你的应用提供良好的、不依赖网络的体验，但你可以轻松定制以适应应用独特的用例。\n\n我们已经介绍了服务工作线程的各种事件及其工作原理。这里最重要的是使用Chrome开发者工具来调试服务工作线程，并查看服务工作线程的状态和可用缓存。如需进一步研究服务工作线程以及可以使用它们做什么，你可以查看Google和Mozilla提供的以下文档链接：\n\
  \nhttps://developer.mozilla.org/en-US/docs/Web/API/Service_Worker_API/Using_Service_Workers\n\
  https://developers.google.com/web/fundamentals/getting-started/primers/service-workers.\n\
  \n```javascript\nlocalStorage.setItem('anonKey', subKey);\n});\n})\n.catch(err =>\
  \ console.log('Error', err));\n}\n</script>\n```\n\n你可以在这里看到，成功注册后，我们从pushManager订阅推送通知。这将生成订阅端点，用于向所有用户发送通知。下一步是设置我们的`manifest.json`文件：\n\
  \n```json\n{\n  \"name\": \"Currency Converter PWA\",\n  \"short_name\": \"Currency\"\
  ,\n  \"start_url\": \"index.html\",\n  \"display\": \"standalone\",\n  \"icons\"\
  : [{\n    \"src\": \"assets/logo.png\",\n    \"sizes\": \"512x512\",\n    \"type\"\
  : \"image/png\"\n  }],\n  \"background_color\": \"#db0000\",\n  \"theme_color\"\
  : \"#000000\",\n  \"gcm_sender_id\": \"124917710568\"\n}\n```\n\n我们在上一节中讨论了所有属性，这里我们将为用户通知添加`gcm_sender_id`。你可以从云消息中的**Firebase设置**获取`gcm_sender_id`。从那里复制服务器密钥，因为稍后发送Web推送通知时会需要它。\n\
  \n服务工作线程对于渐进式Web应用至关重要。以下是我们默认的`service-worker.js`，我们根据需求进行了一些进一步修改。Ionic默认不使用`sw-toolbox`库，但该库大大减少了代码和工作量：\n\
  \n```javascript\n// src/service-worker.js\n\n'use strict';\nimportScripts('./build/sw-toolbox.js');\n\
  \nvar version = 1;\n\nself.toolbox.options.debug = true;\n\nself.toolbox.options.cache\
  \ = {\n  name: 'ionic-cache' + version\n};\n\n// pre-cache our key assets\nself.toolbox.precache(\n\
  \  [\n  './build/main.js',\n  './build/main.css',\n  './build/polyfills.js',\n \
  \ 'index.html',\n  'manifest.json',\n  '/'\n  ]\n);\n```\n\n我们从设置缓存名称开始，使用指定的版本号命名。因此，只要有新更改，我们就会更改版本，并生成新的`cacheStorage`。接下来，我们使用`precache()`方法缓存所有静态资源，并传入所有静态文件路径。你会看到，我们添加了另一个默认文件中没有的资源，因为我们的应用在浏览器`localhost:8100`上运行，如果首次加载后离线，该资源将不会被缓存，你会看到错误。如果你不想添加这个，只需刷新页面两次，因为这样可以将它缓存。\n\
  \n\n\n请求也是如此。\n\n现在我们已经缓存了静态资源，接下来看看我们如何对动态内容（如 API 调用）使用缓存策略。在 `HomePage` 和 `ListPage`\
  \ 中，我们使用了两种类型的 API，因此我们希望采用不同的缓存策略。每次获取完整列表时，我们使用 `networkFirst` 策略，而对于单一货币汇率则使用\
  \ `cacheFirst` 策略。由于这两个请求具有不同的 API 路径，我们根据这些路径应用了条件判断。此外，我们为这些请求设置了不同的 `cacheStorage`，命名为\
  \ `fixerio`，它将来自 fixer.io 的所有请求作为其源：\n\n```\nself.toolbox.router.get('/(.*)', function(request,\
  \ values, options) {\n  if (!request.url.match(\"symbols\")) {\n    console.log(\"\
  ===entire currency list API===\");\n    return self.toolbox.networkFirst(request,\
  \ values, options);\n  } else {\n    console.log(\"===specific conversion between\
  \ two currencies===\");\n    return self.toolbox.cacheFirst(request, values, options);\n\
  \  }\n}, {\n  cache: {\n    name: 'fixerio',\n    maxEntries: 10,\n    maxAgeSeconds:\
  \ 3600\n  },\n  origin: /.fixer.io$/\n});\n\n// dynamically cache any other local\
  \ assets\nself.toolbox.router.any('/*', self.toolbox.cacheFirst, {\n  cache: {\n\
  \    maxAgeSeconds: 3600\n  }\n});\n\n// for any other requests go to the network,\
  \ cache,\n// and then only use that cached resource if your user goes offline\n\
  self.toolbox.router.default = self.toolbox.networkFirst;\n```\n\n另外，我们将其他任何本地资源缓存为\
  \ `cacheFirst`，而其他任何请求则使用 `networkFirst`，它会先访问网络，如果离线则从缓存获取：\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_369_0.png)\n\
  \n您可以轻松地在 Chrome 开发者工具中调试 `cacheStorage` 和 `indexedDB` 数据。\n\n接下来我们要做的重要事情是清除旧缓存，以防新版本的\
  \ Service Worker 创建新的 `cacheStorage`。因此我们在 Service Worker 激活期间执行此操作：\n\n```javascript\n\
  // Deleting old caches\nself.addEventListener('activate', function(event) {\n  var\
  \ expectedCacheNames = Object.keys(self.toolbox.options.cache.name).map(function(key)\
  \ {\n    return self.toolbox.options.cache.name[key];\n  });\n  event.waitUntil(\n\
  \    caches.keys().then(function(cacheNames) {\n      return Promise.all(\n    \
  \    cacheNames.map(function(cacheName) {\n          if (expectedCacheNames.indexOf(cacheName)\
  \ === -1) {\n            console.log('Deleting out of date cache:', cacheName);\n\
  \            return caches.delete(cacheName);\n          }\n        })\n      );\n\
  \    })\n  );\n});\n```\n\n我们已经完成了一些订阅推送通知的工作，现在需要添加一个 EventListener，以便在发送时立即显示通知。我们有以下代码：\n\
  \n```javascript\nself.addEventListener('push', (event) => {\n  console.log('Received\
  \ a push message', event);\n\n  const title = 'Yay a message.';\n  const body =\
  \ 'We have received a push notification.';\n  const icon = 'assets/logo.png';\n\
  \  const tag = 'simple-push-demo-notification-tag';\nevent.waitUntil(\n  self.registration.showNotification(title,\
  \ {\n    body: body,\n    icon: icon,\n    tag: tag\n  })\n);\n```\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_370_0.png)\n\
  \n我们还需要请求权限，这将在 `application.component.ts` 中最初请求。这会弹出一个询问是否发送通知的弹出框，一旦您允许，就可以接收推送通知了：\n\
  \n```typescript\n// src/application/application.component.ts\n\nNotification.requestPermission().then(function(result)\
  \ {\n  if (result === 'denied') {\n    console.log('Permission wasn\\'t granted.\
  \ Allow a retry.');\n    return;\n  }\n  if (result === 'default') {\n    console.log('The\
  \ permission request was dismissed.');\n    return;\n  }\n});\n```\n\n为了演示 Web 推送通知，我们将使用\
  \ curl 请求，这需要端点（我们可以从 `localstorage` 中获取，因为我们已经保存了它）以及我们从面板复制的 Firebase 密钥：\n\n\
  ```bash\n$ curl https://android.googleapis.com/gcm/send --header \"Authorization:\
  \ key=AABBHRWs_ug:APA91bEiHIEczZzLiMJAB_-icXkT7\n```\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_371_0.png)\n\
  \n我们现在已成功发送了 Web 推送通知，下一步是将此推送 API 集成到您的后端。我们还可以在通知中发送自定义负载，但这需要添加加密，并在客户端和服务器端进行更改。由于这不在当前主题范围内，我们跳过这一点，但您可以参阅\
  \ Google 文档了解更多信息（[https://developers.google.com/web/updates/2016/03/web-push-encryption](https://developers.google.com/web/updates/2016/03/web-push-encryption)）。\n\
  \n我们已经完成了 PWA 应用所需的主要更改，现在只需开始编写代码并集成汇率 API。让我们看看 `currencyService`：\n\n```typescript\n\
  // src/providers/currency-service.ts\n\nimport { Injectable } from '@angular/core';\n\
  import { Http } from '@angular/http';\nimport 'rxjs/add/operator/map';\nimport {\
  \ StorageService } from './storage-service';\n\n@Injectable()\nexport class CurrencyService\
  \ {\n\n  constructor(public http: Http, public cache: StorageService) {\n  }\n\n\
  \  loadCurrencyList(base:String) {\n    return new Promise (resolve => {\n     \
  \ let url = \"https://api.fixer.io/latest?base=\" + base;\n      this.http.get(url).map(res\
  \ => res.json()).subscribe(data => {\n        this.cache.setObject('base_'+ base,\
  \ data);\n        resolve(data);\n      }, error => {\n        resolve(\"Data not\
  \ found\");\n      })\n    })\n  }\n}\n```\n\n为了根据基础货币获取货币列表，我们使用了 `loadCurrencyList()`\
  \ 方法，它会调用 `fixer.io` API 返回结果，并通过 Service Worker 进行缓存。我们将此类型的请求过滤为 `networkFirst`，因此每次都会从服务器获取最新数据。如果设备离线，它将返回上次缓存的结果；如果请求未被缓存，则会进入错误块，我们将其解析为\
  \ `Data not found`。同时，我们也将数据存储在 `IndexedDB` 中：\n\n```typescript\nconvert(from, to)\
  \ {\n  return new Promise(resolve => {\n    this.http.get(\"https://api.fixer.io/latest?base=\"\
  \ + from +\n      \"&symbols=\" + to).map(res => res.json()).subscribe(data => {\n\
  \        resolve(data);\n      }, error => {\n        this.cache.getObject('base_'\
  \ + from).then((value) => {\n          if(value) {\n            resolve(value);\n\
  \          } else {\n            resolve(\"Data not found in offline State\");\n\
  \          }\n        })\n      })\n  })\n}\n```\n\n在我们的 `HomePage` 上，我们获取一对一的货币转换率，为此我们使用\
  \ `convert()` 方法。这里我们采用 `cacheFirst` 策略，首先返回 `cacheStorage` 中的数据，如果没有找到，则调用 `fixer.io`\
  \ API。如果我们没有缓存特定请求且处于离线状态，则会回退到错误块，在那里我们首先检查在获取完整列表时是否已将基础货币列表存储在 `IndexedDB` 中。如果存储中有该列表，那么我们可以轻松地在列表中找到第二种货币。\n\
  \n让我们看看 `ListPage` 类，我们将从那里调用 `CurrencyService`：\n\n```typescript\n// src/pages/list/list.ts\n\
  \nimport { Component } from '@angular/core';\nimport { NavController, NavParams\
  \ } from 'ionic-angular';\nimport { CurrencyService } from '../../providers/currency-service';\n\
  \n@Component({\n  selector: 'page-list',\n  templateUrl: 'list.html'\n})\nexport\
  \ class ListPage {\n\n  baseCurrency:any = \"USD\";\n  currencyList:any;\n  queryText:'';\n\
  \n  constructor(\n    public navCtrl: NavController,\n    public navParams: NavParams,\n\
  \    public currency: CurrencyService) {\n\n    currency.loadCurrencyList(this.baseCurrency).then(val\
  \ => {\n      this.processData(val)\n    });\n\n  }\n\n  processData(data:any) {\n\
  \    console.log(data);\n    let rates = data.rates;\n    let arr = [];\n    for\
  \ (var key in rates) {\n      if (rates.hasOwnProperty(key)) {\n        arr.push({'name':key,'price':rates[key]});\n\
  \      }\n    }\n}\n```\n\n\n\n\n```javascript\nthis.currencyList = arr;\n}\n\n\
  setBaseCurrency() {\n  this.currency.loadCurrencyList(this.baseCurrency).then(val\
  \ => {\n    if(typeof val === \"object\") {\n      this.processData(val)\n    }\
  \ else {\n      alert(val);\n    }\n  });\n}\n}\n```\n\n我们将 `baseCurrency` 初始设置为\
  \ **USD**，并根据用户选择的基础货币，调用 `CurrencyService` 的 `loadCurrencyList()` 方法获取数据。我们已经讨论了渐进式\
  \ Web 应用的大部分要点和代码片段。你可以找到包含章节的完整代码库并随意修改。我们知道，只有将应用托管在 HTTPS 上，它才能完全正常运作，因此我已使用\
  \ Firebase 托管部署了 `www` 文件夹：\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_373_0.png)\n\
  \n你可以访问 [https://coastal-mender-573.firebaseapp.com/](https://coastal-mender-573.firebaseapp.com/)\
  \ 查看已托管的应用程序。当你开始频繁使用该应用时，会发现一个提示，询问你是否将其添加到手机主屏幕。添加到主屏幕后，你会看到一个图标出现在主屏幕上，点击它会打开一个独立的全屏窗口，看起来就像原生应用一样。我必须说，你们看到这个时都应该感到兴奋，现在应该尝试自己构建一个\
  \ PWA 应用。实际开发应用会比仅仅阅读概念更能提升你的技能，让你占据优势。\n\n## PWA 的未来\n\n渐进式 Web 应用为我们提供了许多可能性，如安装、发送推送通知和离线支持等能力，这些弥补了移动\
  \ Web 与原生应用之间的差距。目前的问题是，iOS 和 Safari 尚不支持 Service Worker，该问题仍在考虑之中。有人推测在 2017 年下半年，它们可能会提供\
  \ Service Worker 支持，从而帮助启用 PWA 功能。\n\n渐进式 Web 应用是改进移动 Web 的下一步。随着移动流量日益增长，这意义重大。此外，在过去一段时间里，我们看到许多网站强迫用户通过移动\
  \ Web 安装原生应用，这确实令人反感。印度著名的电商巨头之一 Flipkart 甚至曾一度通过横幅提示用户安装其原生应用，从而停用了其移动 Web 版本。后来，当他们意识到这个错误后，成为业界首批支持\
  \ PWA 的公司之一，在移动 Web 上发布了 Flipkart Lite 版本。\n\n统计数据显示，过去一年美国智能手机应用下载量下降了 20%，这表明市场已经饱和，消费者需求正在发生变化。你可以在（https://developers.google.com/web/showcase/2016/flipkart）找到大量案例研究，其中包含\
  \ PWA 如何积极影响产品增长和用户参与度的关键见解。还有许多其他 PWA，如 MakeMyTrip、Housing 等。你会发现，它们帮助我卸载了原生应用，释放了设备空间，转而使用\
  \ PWA 版本。\n\n## 总结\n\n我个人认为，在 Ionic 中支持 PWA，并在最后一章讨论这个主题，是结束我们激动人心的旅程的最佳方式。你现在已经了解了\
  \ PWA 的强大功能，也可以将其扩展到普通 Web 应用中。此外，我们不能说 PWA 会取代原生应用，因为有些底层 API 只有在使用 Cordova 构建应用并使用\
  \ Cordova 插件时才能使用。\n\n从 Ionic 团队最近的博客文章来看，似乎很快就会有对 Electron 的桌面支持。我建议每位用户或开发者订阅\
  \ Ionic 博客，这是了解 Ionic 最新动态的最佳方式。我已经竭尽全力确保每一章的内容都是最新的，但你可以看到这个项目发展得如此活跃，所以确保你也付出努力跟上最新进展。Ionic\
  \ 论坛是另一个有用的资源，在过去三年学习 Ionic 的旅程中，它一直帮助着我。大多数时候，你会发现自己遇到的问题已经在论坛中被问过，很快就能得到答案。此外，你可以随时提问，但在此之前一定要做好功课；否则你的问题可能会得不到回答。我说的功课是指，搜索论坛中的现有讨论，查看\
  \ GitHub 上的问题，因为很多时候问题可能已经被标记，你不想浪费时间。大多数时候，我们遇到的问题可能与 Angular 相关，而不是专门针对 Ionic\
  \ 组件或 API。因此，对于这类问题，请尝试在 Google 上使用关键字 Angular 而不是 Ionic 进行搜索，因为这样会得到更合适的结果。\n\n"
