- "# Ionic 3 入门\n\n多年来，Ionic 一直在不断演进；自从 Ionic v1 发布以来，这个框架一直处于持续开发和改进之中。最明智的举措之一是\
  \ Ionic 团队推出了基于 Angular 2 的 Ionic v2。最近，Ionic 3 也发布了，它基于 Angular 4 和 TypeScript\
  \ 2.2。在本书中，我们将主要深入探讨 Ionic 2 和 Ionic 3 及其高级概念。我们将涵盖构建支持蓝牙信标的商场电商应用、与 Firebase 的集成，以及\
  \ Ionic 应用对 PWA 的支持等主题。我们将从对 iOS、Android 和 Windows 这三个平台的支持开始，并将演示基于物联网的应用程序，这会非常令人兴奋。\n\
  \n在本章中，我们将了解 Ionic 的所有基础内容，这些内容将有助于构建大规模、企业级的应用程序。过去 2-3 年我们一直在使用 Ionic 1.x，在这一过程中，我们看到了框架的巨大改进和多项功能的开发。Angular\
  \ 2 发布后，框架又得到了更多改进，随后 Ionic 团队计划开发基于 Angular 2 的 Ionic 2。Ionic 3 和 Angular 4 在相似的路线上发展，并没有像我们从\
  \ Ionic v1 迁移到 v2 时那样的重大框架变更。借助 Ionic 3，你将看到性能的提升、代码复杂度的降低，以及构建可扩展应用能力的增强。Ionic\
  \ 现在面向移动 Web 和桌面应用程序，这帮助开发者在任何地方运行相同的代码库。Ionic Native 是另一个例子，展示了 Ionic 团队如何日复一日地改进产品，让开发者的生活更加轻松。我们首先会了解\
  \ Angular 和 Ionic 的一些基础知识，以及 TypeScript 如何成为构建企业级应用的重要资产。Ionic CLI 和 Ionic Cloud\
  \ 产品也在定期改进，我们可以利用它们加快开发速度，并高效地测试或分享我们的应用。在本章中，我们将涵盖：\n\n- Angular 4、Ionic 3 和 TypeScript\n\
  - 安装与设置\n- 目录结构和模块化\n- 使用 SASS 进行主题定制\n- Ionic CLI\n\n\n\n\n# Angular 4、Ionic 3\
  \ 和 TypeScript\n\n我们中的许多人从 Angular 1 来到 Angular 2 或 4，肯定都会发现这是对应用程序的彻底重写，并且学习曲线陡峭。当我最初开始使用\
  \ Ionic 和 Angular 时也有同样的感受，但随着我逐步阅读 Angular 的概念，过去在 Angular 1 中面临的许多问题都自动解决了，无需任何额外努力。最初，你会怀念\
  \ Angular 1 中的旧控制器、服务、过滤器等概念，最重要的是导航和路由。但当你深入研究这些主题时，你会发现有相应的模块，如**组件**、**提供者**和**管道**，并且它们可以以类似的方式使用。导航和路由现在也用作在不同页面之间导航的推入（push）和弹出（pop）机制。在\
  \ Ionic 2 的初始测试版中，我们没有适当的基于 URL 的路由，因为用户无法直接进入应用中的特定页面。但在稳定的 Angular 路由器发布后，它被添加到了\
  \ Ionic 2 中，这为更好地支持渐进式 Web 应用（PWA）开辟了道路，使得相同的 Ionic 应用可以以移动 Web 应用的形式发布。Ionic 3\
  \ 还增加了对响应式网格的支持，这将有助于我们构建桌面应用。懒加载（Lazy Loading）是另一个新增的重要功能，它减少了应用的初始加载时间。尽管如此，由于\
  \ Ionic 3 仍处于初期阶段，我们可以期待这些功能变得更加稳定。正如我们所知，Ionic 2 和 3 没有重大的框架变化，因此在本章中，我们首先会比较 Angular\
  \ 1 和 2，以帮助用户理解差异以及如何迁移到最新的 Ionic 版本。\n\n```\n<strong>[(property-name)]=\"expression\"\
  </strong><br/><br/><strong> <input type=\"text\" <br/> [(ngModel)]=\"model.name\"\
  \ /></strong>\n```\n\n我们仍然有双向数据绑定。不过，为了改善 Angular 的摘要循环和性能，默认情况下我们并不使用双向数据绑定。它使用单向绑定，当我们需要时，可以扩展为双向绑定。你可以参考\
  \ Angular 模板语法，以弄清 Angular 4 中所有其他语法及其用途。\n\n**Ionic 缺乏 URL 导航**是 Ionic 论坛上正在进行的另一个讨论。这种说法在一定程度上也是正确的；因为\
  \ Angular 路由器当时不够稳定，Ionic 团队决定在初始测试版中移除它。目前，Angular 路由器已经稳定，并且将会保留在 Ionic 中。Ionic\
  \ 团队深知，拥有合适的路由机制以及让开发者在转向 Ionic 3 时感到熟悉是多么重要。\n\n**升级完全重写：** Angular 2 本身是被重写了，但你不必也重写自己的应用。最初开始时，我也有同样的感觉，以为我们必须重新开发现有应用。但有很多工具和文档（http://ionicframework.com/files/Ionic2Migration.pdf）可用于从\
  \ Ionic 1 平滑升级到 Ionic 2 或 3。你只需要小心，因为如果应用很复杂，你可能需要手动完成很多事情。但有一点是肯定的：如果你具有相应的专业知识和\
  \ Angular 2 的概念，升级应用肯定比从头构建同样的应用花费的时间少得多。这背后的原因之一是，你已经有了一个正在运行的应用，只需要以不同的方式重组各个部分，因为大多数应用逻辑是相同的。\n\
  \n就我个人而言，我在学习 Ionic 的过程中并没有过多考虑升级到新版本。相反，我将其视为新 Angular 版本中带来的改进概念，旨在简化学习和理解。\n\n\
  # 将 Ionic 1 映射到 Ionic 3\n\n对于任何能够轻松理解 Angular 1 中各种概念与 Angular 4 中对应实现的开发者来说，生活将变得非常轻松。而且，我相信大多数问题都会自动得到解答。\n\
  \n## 控制器对应组件\n\n组件是 Angular 和 Ionic 应用的支柱；你会发现几乎一切都是组件。你可以将 Angular 1 中的控制器与 Angular\
  \ 4 中的组件进行对比。在控制器中，我们过去定义了大部分代码的逻辑部分，并将控制器注册到主模块。现在，以类似的方式，我们在 Angular 4 的组件中定义代码，如果需要，我们可以将其导出。\n\
  \n```\nComponent Class: // Angular & Ionic 1\n\nangular.module('wedding.controllers',\
  \ [])\n.controller('LoginCtrl',\nfunction($scope, CategoryService) {\n// controller\
  \ function and DI of CategoryService\n}\n);\n```\n\n```\n// Angular 4 & Ionic 3\n\
  \nimport {Component} from '@angular/core';\nimport {NavController} from 'ionic-angular';\n\
  \n@Component({\ntemplateUrl: 'build/pages/catalog/categories.html'\n})\nexport class\
  \ CategoryPage {\n// DI of NavController for navigation\nconstructor(private navCtrl:\
  \ NavController) {\nthis.nav = navCtrl;\n}\n}\n```\n\n在 Angular 1 中，依赖注入是通过控制器函数参数实现的，而在\
  \ Angular 4 中，我们在构造函数内部传递它。许多其他东西，例如 IIFE 语法，在 Angular 1 中我们需要定义它以使控制器代码不污染全局命名空间，但在\
  \ Angular 4 中不再需要，因为 ES 2015 模块为我们处理了命名空间。此外，如你所见，我们导出了 CategoryPage 类，现在可以在任何需要该模块的地方导入它。另一个重大变化是\
  \ `$scope` 被 `this` 关键字取代。`$scope` 存在许多性能问题，而且在 Angular 1 中开发者已经减少了 `$scope` 的使用。\n\
  \n```\n// Filter - Angular 1 <br/><td>{{movie.price | currency}}</td> <br/><br/>//\
  \ Pipes in Angular 4 <br/><td>{{movie.price | currency:'USD':true}} <br/></td>\n\
  ```\n\n出于性能原因，过滤器（filter）和 orderBy 过滤器已从管道（Pipes）中移除，不过如果类似代码在多个模板中重复使用，你随时可以构建自定义管道。\n\
  \n## 服务对应提供者\n\n服务和工厂（Factory）是 Angular 1x 的重要组成部分，我们通过它们与远程服务器通信以获取数据。我们过去在工厂函数中定义\
  \ API 调用，控制器调用这些函数来从服务器获取数据：\n\n```\n// Factory method in Angular 1x\nangular.module('wedding.services',\
  \ [])\n\n// DI of $http for HTTP calls to servers\n// $q for promises\n.factory('CategoryService',\
  \ function ($http, $q) {\nvar catalog  = {};\n\ncatalog.getCategories = function\
  \ () {\n    // here we will call APIs\n}\n})\n```\n\n现在你将看到我们如何将代码迁移到 Angular 4\
  \ 的提供者。Angular 1 中工厂里的同一个 getCategories() 方法，将移到 Angular 4 的 categoryData() 类中：\n\
  \n```\n// Provider in Angular 4\nimport { Injectable } from '@angular/core';\nimport\
  \ { Http } from '@angular/http';\n\n@Injectable()\nexport class CategoryData {\n\
  \nconstructor(private http: Http) {}\n\ngetCategories() {\n\nreturn new Promise(resolve\
  \ => {\n    // We're using Angular Http provider\n    // to request the data,\n\
  \    // then on the response it'll map the\n    // JSON data to a parsed JS object.\n\
  \    // Next we process the data and\n    // resolve the promise with the new\n\
  \    // data.\n\nthis.http.get('www.veloice.com/data.json').subscribe(res => {\n\
  \    // we've got back the raw data, now\n    // generate the core schedule data\n\
  \    // and save the data for later\n    // reference\n    this.data = this.processData(res.json());\n\
  \    resolve(this.data);\n});\n});\n}\n}\n```\n\n你会注意到 Provider 类有一个 @Injectable\
  \ 装饰器。该装饰器让 Angular 4 知道这个特定的类可以被依赖注入器使用。\n\n## TypeScript 来救援\n\nTypeScript 基本上是\
  \ Javascript 的一个超集，是一种静态类型语言。TypeScript 所做的类似于 LESS 或 SASS 对 CSS 所做的工作。TypeScript\
  \ 编译为 Javascript，并且语法几乎相同。任何来自面向对象世界的人都会对它非常熟悉，比如类、构造函数、继承和接口等概念。\n\n许多开发者会对 ES5、ES6、TypeScript、AtScript\
  \ 等这些关键字感到困惑。JavaScript 是一种社区驱动的语言，因此浏览器厂商会实现那些使用最广泛的功能。目前，ES5，即 ECMAScript 5，是\
  \ ECMA International 制定的一个标准。ES6 和 ES7 是 JavaScript 的未来标准，具有大量新特性。我们可以直接使用 Babel（一种转译器）来开发\
  \ ES6 和 ES7 应用。转译器是源到源编译器，以一种编程语言作为输入，并输出另一种语言中的等效代码。不过，推荐使用 TypeScript，因为 Ionic\
  \ 社区中的大部分工作都基于 TypeScript。而且，你很容易获得资源和社区帮助。\n\n当我们启动一个新的 Ionic 3 项目时，它会使用 TypeScript\
  \ 创建项目，尽管在 Ionic 2 和 CLI v2 中，我们也有选项可以用 TypeScript 创建项目。如前所述，我们应该使用 TypeScript，因为随着项目规模变大，维护和理解会更容易。我想在这里澄清关于\
  \ Angular 4 的一个重要点：无论是 TypeScript 还是 ES6，只要你运行 Ionic 服务器，我们的应用文件夹就会被转译成 ES5，因为这是目前所有主流浏览器都支持的目标。\n\
  \nTypeScript 提供了许多新特性，我们主要会在 Ionic 或 Angular 应用中使用它们。其中一些如下所示：\n\n- 类和模块支持\n- 静态类型检查\n\
  - 与其他面向对象语言相似的语法\n- ES6 特性，例如模板字符串支持\n- 装饰器、注解支持和依赖注入\n- 箭头函数\n\n\n\n\n\n## 安装与设置\n\
  \n在学习 Ionic 3 的过程中，大多数开发者之前已经有了 Ionic 的安装经验。我们可以通过 NPM 包安装 `ionic`；目前 Ionic CLI\
  \ v3 仍处于 beta 阶段，它彻底改变了 CLI 的工作方式，现在 Ionic 创建的默认项目基于 Ionic 3：\n\n```bash\n$ npm\
  \ install -g ionic\n```\n\n建议使用 Node 6.x 版本和 npm 3.x 版本。这个 beta 版本同时支持 Ionic 1 和\
  \ Ionic 2 项目。现在让我们开始创建一个项目：\n\n```bash\n// will create Ionic 3x project\n$ ionic\
  \ start wedding-planner sidemenu\n// will create Ionic 1x project\n$ ionic start\
  \ wedding-planner sidemenu --type ionic1\n// move to project directory\n$ cd wedding-planner\n\
  \n// run project with ionic serve\n$ ionic serve\n```\n\n**接下来的步骤将是为应用添加所需的特定平台和插件：**\n\
  \n```bash\n// For adding specific platforms\n$ ionic cordova:platform add android\n\
  \n// running application on real device\n$ ionic cordova:run android\n\n// running\
  \ inside an emulator\n$ ionic cordova:emulate android\n```\n\n**接下来，我们将了解如何开始使用\
  \ Ionic 2 应用的代码库。你需要理解每个文件和文件夹的结构及其工作方式。**\n\n## 目录结构与模块化\n\n在 Ionic 1x 中，我们并没有最佳的目录或项目结构。随着\
  \ Ionic 和 Angular 的逐步演进，开发者倾向于采用模块化方式来组织文件和文件夹。在 Ionic 1x 中，管理文件和文件夹有许多不同方式。通常，你在\
  \ Ionic 1x 构建中看到的默认结构可以用于许多小型项目（我们不需要处理大量文件）；对于基于 Ionic 1x 的项目，主要遵循两种结构：**byFolderType**\
  \ 和 **byFeatureType**。Ionic 3 的最大优点之一是项目结构以模块化方式设置，其中包含 pages、providers、pipes、theme\
  \ 文件夹，以及它们各自的下级文件夹。下面我们来了解 Ionic 3 项目中的一些重要文件：\n\n- `./src`\n\n  这里存放着我们整个应用的代码库，它是最重要的部分：\n\
  \n- `./node_modules`\n\n  这里存放着运行应用所需的全部依赖和 NPM 包：\n\n- `./platforms`\n\n  这里包含应用所使用的特定平台文件夹条目。当我们运行\
  \ `ionic platform add` 命令时，你会看到在 `platform` 文件夹内创建了相应的文件夹：\n\n- `./plugins`\n\n\
  \  应用中使用到的所有插件都存放在这里：\n\n- `./resources`\n\n  整套图标和启动屏（splash screens）都在这个文件夹中，并按不同平台和设备进行了组织：\n\
  \n- `./www`\n\n  这里存放着我们的 `index.html` 文件；`src` 文件夹中的代码库编译后，bundle、文件、图片以及 SASS\
  \ 编译生成的 CSS 文件都会被放入 `www` 中：\n\n- `./www/index.html`\n\n  这是我们的应用（也可以说是每个混合应用）的入口点。我们主要在此文件中声明运行应用所需的脚本和样式表。与\
  \ Ionic 1 中使用 ng-app 类似，在 Ionic 3 中我们要检查 `index.html` 文件中的 `<ion-app></ion-app>`：\n\
  \n- `./package.json`\n\n  该文件定义了项目元数据以及将添加到 `node_modules` 文件夹中的依赖。它还包含应用所使用的 Cordova\
  \ 平台和插件信息：\n\n- `./ionic.config.json`\n\n  该文件包含项目专属设置，如名称、ID、代理（proxies）以及其他信息：\n\
  \n- `./src/app/main.ts`\n\n  这是我们进入代码库的起点，同时我们也会在这个文件中引导启动（bootstrap）应用：\n\n- `./src/app/app.module.ts`\n\
  \n  在这个文件中，我们声明应用中使用的页面、指令和 providers：\n\n- `./src/app/app.component.ts`\n\n  我们在这里设置根页面，并且根组件会首先被调用，它控制着整个应用，类似于\
  \ Ionic 1 中 `app.js` 文件的作用。不过，这个 `component` 与应用中其他组件并无不同；它只是在 `app` 文件夹中声明。在后续章节中开始构建应用时，我们将更深入地了解如何处理所有这些文件和代码库。\n\
  \n## 自定义\n\n现在 SASS 的基础设置已经准备好了；同时，在运行 `ionic serve` 时，你可以为每个组件或页面在不同文件中添加所有自定义样式和\
  \ SASS 相关的修改。让我们先从修改 `variable.scss` 文件中默认存在的一个颜色变量开始：\n\n```scss\n/*\nTo customize\
  \ the look and feel of\n    Ionic, you can override the variables\nFor example,\
  \ you might change some of\n    the default colors:\n\n$colors: (\n    primary:\
  \    #387ef5,\n    secondary:  #32db64,\n    danger:     #f53d3d,\n    light:  \
  \    #f4f4f4,\n    dark:       #222,\n    favorite:   #69BB7B,\n    twitter:   \
  \ #53ACEB,\n    github:     #000000,\n    instagram:  #235D8D\n);\n\n// Fastest\
  \ way to change the theme of\n    your Ionic app is to set new value\n    for primary\
  \ color\n```\n\n你可以看到，我们添加了 Twitter 和 GitHub 等自定义颜色。我们还可以通过提供 base 和 contrast 属性来进一步自定义：\n\
  \n```scss\n$colors: (\n    facebook:(\n        base: #3b5998,\n        contrast:\
  \ #ffffff\n    )\n)\n```\n\n现在你可以将此颜色键用作许多组件的属性，例如 `buttons`：\n\n```html\n<button\
  \ facebook>Share on Facebook</button>\n```\n\nSASS 非常强大，它能加快 CSS 开发流程。它就像 CSS 的瑞士军刀，可以用最少的代码完成很多事情，并且只需做一些改动就能轻松改变应用的整个外观和体验。关于如何使用\
  \ SASS 有非常多的示例，但由于我们更专注于 Ionic 开发，我建议你抽时间阅读一些优秀的 SASS 文档和 Ionic 3 主题文档，这样可以获得更详细的信息。\n\
  \n**$ ionic resources**\n\nIonic 会自动裁剪、调整大小，并从源图片中为每个平台创建图标和启动屏，同时会针对手机、平板等不同设备生成不同尺寸。所有这些都是在\
  \ Ionic 的调整大小和裁剪服务器上生成的，无需在本地机器上安装库或插件，因此不会带来任何额外负担。\n\n**$ ionic resources --icon**\n\
  \n**$ ionic resources --splash**\n\n如果没有为源文件提供合适的尺寸，那么它只会创建小于源图片尺寸的资源。例如，平板或高分辨率屏幕所需的资源可能不会生成。\n\
  \n## 平台特定资源\n\nIonic 支持为各种平台和设备构建图标和启动屏资源。要构建资源，我们只需将源图片放到 resources 文件夹中，并命名为 `icon.png`\
  \ 和 `splash.png`。这样，你就能获得每个平台所需的图标和启动屏，例如 iOS 使用原生圆角图标，Android 图标则使用透明背景。\n\n总结步骤如下：\n\
  \n- 将文件添加到 resources 文件夹，并命名为 `icon.png` 和 `splash.png`。（也可以使用 `.psd` 和 `.ai` 格式）。\n\
  - 确保图标的最小尺寸要求为 192x192 px，启动屏为 2208x2208 px。\n- 从 CLI 运行 `ionic resources` 命令。\n\
  \n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_72_0.png)\n\n> 不同平台对图标样式有不同的处理方式，例如 iOS\
  \ 会自动添加圆角，因此我们建议 `Ionic` 源文件不要带圆角。此外，使用 `ionic resources` 命令至少需要 Cordova 3.6 或更高版本。\n\
  \n\n\n\n\n```\n$ ionic serve [options]\n$ ionic serve --lab\n```\n\n## 添加平台\n\n\
  `ionic platform` 命令用于添加和移除平台：\n\n```\n$ ionic cordova:platform <action> <PLATFORM>\n\
  [options]\n$ ionic cordova:platform add android\n$ ionic cordova:platform remove\
  \ ios\nRunning applications on devices\n```\n\n## 在设备上运行应用\n\n`ionic run` 命令有助于在已连接的设备上运行应用：\n\
  \n```bash\n$ ionic cordova:run [options] <PLATFORM>\n$ ionic cordova:run android\n\
  \    There is also an option of Emulate. Emulate an\n    Ionic\n    project on a\
  \ simulator or emulator.\n$ ionic cordova:emulate [options] <PLATFORM>\n```\n\n\
  Ionic CLI 中可用任务的数量一直在增加。要了解所有最新任务及其详细信息，最好的方法是使用 `ionic --help`：\n\n```bash\n$ ionic\
  \ --help\n```\n\n这会列出所有任务及其对应的选项和标志。你可以轻松地在测试项目上尝试所有这些任务，这将有助于你更深入地理解它们。\n\n## 上传与分享\
  \ Ionic 应用\n\n在开发应用时，你现在可以将应用分享给测试团队或朋友进行审查。Ionic 平台提供了这个功能，最棒的是你甚至不需要在本地构建，然后给大家发送\
  \ APK 文件。上传和分享应用并不只是几个简单步骤。Ionic for organization（Ionic 企业版）是另一项服务，可用于组织员工之间的协作。\n\
  \n```\n`$ ionic upload`\n```\n\n上传命令的参数或标志：\n\n-   - `[--deploy]`：将快照部署到特定通道\n-\
  \   - `[--note]`：用于说明上传描述的注释\n\n## 生成组件\n\n`ionic generate` 命令可以创建新的管道（pipe）、组件（component）、页面（page）、指令（directive）和提供者（provider）。同时，它还会在\
  \ `app.module.ts` 中创建条目；例如，如果你创建了一个提供者，它会被导入到 `app.module.ts` 并注入到 providers 中。一旦你创建了页面、组件、指令或管道，你会看到一个包含对应\
  \ TypeScript 文件的文件夹生成，你可以从中开始编写逻辑：\n\n```\nionic generate [type] [name]\n```\n\n\
  -   - `[--type]`：生成器的类型，如页面、指令和管道\n-   - `[--name]`：生成的组件名称\n\n```bash\n// Some\
  \ example commands\n$ ionic generate pipe NumberPipe\n$ ionic generate page About\n\
  ```\n\n## Ionic 分享\n\n在构建应用时，你可以直接在 Ionic View 应用中测试它，只要输入应用 ID，它就会自动从 `ionic.io`\
  \ 服务器（你上传应用的地方）下载你的应用：\n\n```bash\n$ ionic share <email>\n```\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_88_0.png)\n\
  \n完成上传并将应用分享给具有特定电子邮件地址的用户后，你发出邀请的人将收到一封包含应用查看链接的电子邮件。你也可以直接在 Ionic View 应用中测试你的应用，该应用可在\
  \ Google Play 商店和 Apple Store 中获取。你还可以直接分享你的应用 ID 来开始构建应用，从而在 Ionic View 应用中直接进行测试。上面的截图展示了如何添加应用\
  \ ID 并测试应用。\n\n## 总结\n\n我们已经介绍了 Ionic 的入门部分，并讨论了在构建大型应用时需要注意的各个方面。现在我们知道了在项目中组织文件和文件夹是多么重要。我们还讨论了各种设置，例如通过\
  \ SASS 定制应用、为不同平台自动创建图标和启动屏幕，以及上传/分享应用。在本章后面，我们继续介绍了许多 Ionic CLI 命令，这些命令有助于我们快速开发和调试应用。Ionic\
  \ CLI 正在日益发展，许多新功能和任务不断涌现。我们都应该定期更新 Ionic CLI 并查看新功能，以便在下一个应用中使用它们。我们现在已经准备好更深入地探索\
  \ Ionic 及其组件。在[第 2 章](#) *Ionic 组件*中，我们将熟悉各种 Ionic 组件，并进入真正的应用构建阶段，届时会使用列表、虚拟滚动、本地化、导航和许多其他组件。这将帮助我们构建需要处理多项任务的复杂应用。UI\
  \ 定制是我们将关注的另一个方面，因为几乎每个应用都有不同的设计，我们可以通过对现有 Ionic 组件稍加调整来轻松实现。另一个我们将关注的重要方面是 Ionic\
  \ 社区构建的自定义模块，我们可以直接在应用中使用它们。\n"
- "# Ionic 组件\n\n在本章中，我们将介绍构建大型应用所需的各种 Ionic 组件和 API。Ionic 提供了各种内置的 JavaScript 组件，我们可以巧妙地加以利用。Ionic\
  \ 还提供了许多我们不太了解的 API，在这里我们将学习如何在应用中高效使用这些 API，以提高应用性能并使其达到生产就绪状态。\n\n我们还将从名为 vPlanet\
  \ Commerce 的电子商务应用开始；这是我其中一个产品创意，旨在将电子商务商店带向移动端。我们将在本书后面为该应用添加渐进式 Web 应用支持，从而形成一个完整的方案。为了让本章更有趣，我会根据电子商务应用在构建过程中的需求，集成不同的\
  \ Ionic 组件和 API。这样你就能获得一个完整的电子商务应用。\n\n本章将涵盖以下主题：\n\n-   - 构建 vPlanet Commerce\n\
  -   - Ionic 3 组件\n-   - Ionic API 和自定义模块\n-   - 使用 Ionic 3 实现懒加载\n\n## 构建 vPlanet\
  \ Commerce\n\n我们一直在讨论构建电子商务应用，现在就开始吧。如前所述，它名为 vPlanet Commerce。vPlanet Commerce\
  \ 是一个电子商务应用，将展示集成在应用中的各种 Ionic 组件，以及社区构建的一些第三方组件。进入第 3 章 *Ionic Native 和插件*后，我们将集成\
  \ Ionic Cloud 服务，如身份验证（auth）、Ionic DB、部署（deploy）等。这将帮助我们完善应用，并使其看起来像专业应用。让我们使用 `sidemenu`\
  \ 模板从零开始创建应用：\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_94_0.png)\n\n现在你已经有了基于侧边菜单模板的基础应用。我采取的下一步是参考\
  \ ionic-conference-app 来构建应用的初始组件，这与 walkthrough 相同。\n\n让我们通过 CLI 创建一个 `walkthrough`\
  \ 组件来生成命令：\n\n```bash\n$ ionic g page walkthrough\n```\n\n当我们开始使用 `walkthrough`\
  \ 组件时，需要添加逻辑，使其仅在用户首次安装应用时显示：\n\n```typescript\n// src/app/app.component.ts\n//\
  \ Check if the user has already seen the walkthrough\n    this.storage.get('has\
  \ Seen Walk Through').then((has\n    Seen Walk Through) => {\n        if (has Seen\
  \ Walk Through) {\n            this.rootPage = HomePage;\n        } else {\n   \
  \         this.rootPage = WalkThroughPage;\n        }\n        this.platformReady();\n\
  \    })\n```\n\n\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_95_0.png)\n\n因此，我们在检查用户是否首次看到引导流程时存储一个布尔值。我们做的另一件重要事情是为登录和注销创建事件，这样当用户登录到应用程序时，我们可以相应地更新菜单项或执行任何其他数据操作：\n\
  \n// src/app/app.component.ts\n\nexport interface PageInterface {\n  title: string;\n\
  \  component: any;\n  icon: string;\n  logsout?: boolean;\n  index?: number;\n \
  \ tabComponent?: any;\n}\nexport class vPlanetApp {\n  loggedInPages: PageInterface[]\
  \ = [\n    { title: 'account', component: AccountPage, icon: 'person' },\n    {\
  \ title: 'logout', component: HomePage, icon: 'log-out', logsOut: true }\n  ];\n\
  \  loggedOutPages: PageInterface[] = [\n    { title: 'login', component: LoginPage,\
  \ icon: 'log-in' },\n    { title: 'signup', component: SignupPage, icon: 'person-add'\
  \ }\n  ];\n\n  listenToLoginEvents() {\n    this.events.subscribe('user:login',\
  \ () => {\n      this.enableMenu(true);\n    });\n\n    this.events.subscribe('user:logout',\
  \ () => {\n      this.enableMenu(false);\n    });\n  }\n\n  enableMenu(loggedIn:\
  \ boolean) {\n    this.menu.enable(loggedIn, 'loggedInMenu');\n    this.menu.enable(!loggedIn,\
  \ 'loggedOutMenu');\n  }\n\n  // For changing color of Active Menu\n  isActive(page:\
  \ PageInterface) {\n    if (this.nav.getActive() &&\nthis.nav.getActive().component\
  \ === page.component) {\n    return 'primary';\n}\n  return;\n}\n}\n\n接下来我们有多个 app.template.html，并且我们根据用户是否已登录或已注销拥有多个\
  \ <ion-menu> 项：\n\n// src/app/app.template.html\n<ion-split-pane>\n<!-- logged out\
  \ menu -->\n<ion-menu id=\"loggedOutMenu\" [content]=\"content\">\n\n<ion-header>\n\
  <ion-toolbar>\n<ion-title>{{'menu' | translate}}</ion-title>\n</ion-toolbar>\n</ion-header>\n\
  \n<ion-content class=\"outer-content\">\n\n<ion-list>\n<ion-list-header>\n{{'navigate'\
  \ | translate}}\n</ion-list-header>\n<button ion-item menuClose *ngFor=\"let p of\
  \ appPages\" (click)=\"openPage(p)\">\n<ion-icon item-left [name]=\"p.icon\" [color]=\"\
  isActive(p)\"></ion-icon>\n{{ p.title | translate }}\n</button>\n</ion-list>\n\n\
  <ion-list>\n<ion-list-header>\n{{'account' | translate}}\n</ion-list-header>\n<button\
  \ ion-item menuClose *ngFor=\"let p of loggedOutPages\" (click)=\"openPage(p)\"\
  >\n<ion-icon item-left [name]=\"p.icon\" [color]=\"isActive(p)\"></ion-icon>\n{{\
  \ p.title | translate }}\n</button>\n<button ion-item menuClose *ngFor=\"let p of\
  \ otherPages\" (click)=\"openPage(p)\">\n<ion-icon item-left [name]=\"p.icon\" [color]=\"\
  isActive(p)\"></ion-icon>\n{{ p.title | translate }}\n</button>\n</ion-list>\n</ion-content>\n\
  \n</ion-menu>\n\n<!-- logged in menu -->\n<ion-menu id=\"loggedInMenu\" [content]=\"\
  content\">\n\n<ion-header>\n<ion-toolbar>\n<ion-title>Menu</ion-title>\n</ion-toolbar>\n\
  </ion-header>\n\n<ion-content class=\"outer-content\">\n\n<ion-list>\n<ion-list-header>\n\
  {{'navigate' | translate}}\n</ion-list-header>\n<button ion-item menuClose *ngFor=\"\
  let p of appPages\" (click)=\"openPage(p)\">\n<ion-icon item-left [name]=\"p.icon\"\
  \ [color]=\"isActive(p)\"></ion-icon>\n{{ p.title | translate }}\n</button>\n</ion-list>\n\
  \n<ion-list>\n<ion-list-header>\n{{'account' | translate}}\n</ion-list-header>\n\
  <button ion-item menuClose *ngFor=\"let p of loggedInPages\" (click)=\"openPage(p)\"\
  >\n<ion-icon item-left [name]=\"p.icon\" [color]=\"isActive(p)\"></ion-icon>\n{{\
  \ p.title | translate }}\n</button>\n<button ion-item menuClose *ngFor=\"let p of\
  \ otherPages\" (click)=\"openPage(p)\">\n<ion-icon item-left [name]=\"p.icon\" [color]=\"\
  isActive(p)\"></ion-icon>\n{{ p.title | translate }}\n</button>\n</ion-list>\n\n\
  </ion-content>\n\n</ion-menu>\n```\n\n由于我们的应用主要从 `app.template.html` 开始，因此我们在此处声明\
  \ rootPage。最近发布了 `SplitPane` 组件，它有助于创建多视图布局，这对于在不同设备和屏幕尺寸上运行同一应用程序非常有帮助：\n\n```\n\
  <!-- main navigation -->\n<ion-nav [root]=\"rootPage\" #content swipeBackEnabled=\"\
  false\" main></ion-nav>\n</ion-split-pane>\n```\n\n让我们现在看看我们的应用中将有哪些页面、服务和过滤器。与其将其列为项目符号列表，了解它的最佳方式是通过\
  \ `app.module.ts` 文件，该文件包含所有声明、导入、`entrycomponents` 和提供者：\n\n// src/app/app.module.ts\n\
  \nimport { BrowserModule } from '@angular/platform-browser';\nimport { NgModule,\
  \ ErrorHandler } from '@angular/core';\nimport { IonicApp, IonicModule, IonicErrorHandler,\
  \ DeepLinkConfig } from 'ionic-angular';\nimport { TranslateModule, TranslateLoader,\
  \ TranslateStaticLoader } from 'ng2-translate/ng2-translate';\nimport { HttpModule,\
  \ Http } from '@angular/http';\nimport { CloudSettings, CloudModule } from '@ionic/cloud-angular';\n\
  import { Storage } from '@ionic/storage';\nimport { vPlanetApp } from './app.component';\n\
  \nimport { AboutPage } from '../pages/about/about';\nimport { PopoverPage } from\
  \ '../pages/popover/popover';\nimport { AccountPage } from '../pages/account/account';\n\
  import { LoginPage } from '../pages/login/login';\nimport { SignupPage } from '../pages/signup/signup';\n\
  import { WalkthroughPage } from '../pages/walkthrough/walkthrough';\nimport { HomePage\
  \ } from '../pages/home/home';\nimport { CategoriesPage } from '../pages/categories/categories';\n\
  import { ProductsPage } from '../pages/products/products';\nimport { ProductDetailPage\
  \ } from '../pages/product-detail/product-detail';\nimport { WishlistPage } from\
  \ '../pages/wishlist/wishlist';\nimport { ShowcartPage } from '../pages/showcart/showcart';\n\
  import { CheckoutPage } from '../pages/checkout/checkout';\nimport { ProductsFilterPage\
  \ } from '../pages/products-filter/products-filter';\nimport { SupportPage } from\
