  import { SearchPage } from '../pages/search/search';\nimport { UserService } from\
  \ '../providers/user-service';\nimport { DataService } from '../providers/data-service';\n\
  import { OrdinalPipe } from '../filters/ordinal';\n\n// 3rd party modules\nimport\
  \ { Ionic2RatingModule } from 'ionic2-rating';\n\n// import ionic native packages\n\
  import { SplashScreen } from '@ionic-native/splash-screen';\nimport { Deeplinks\
  \ } from '@ionic-native/deeplinks';\nimport { TextToSpeech } from '@ionic-native/text-to-speech';\n\
  import { AppRate } from '@ionic-native/app-rate';\nimport { GoogleAnalytics } from\
  \ '@ionic-native/google-analytics';\nimport { Camera } from '@ionic-native/camera';\n\
  import { CallNumber } from '@ionic-native/call-number';\nimport { SocialSharing\
  \ } from '@ionic-native/social-sharing';\nimport { Push } from '@ionic-native/push';\n\
  \nexport function createTranslateLoader(http: Http) {\n  return new TranslateStaticLoader(http,\
  \ './assets/i18n', '.json');\n}\n\n// Configure database priority\nexport function\
  \ provideStorage() {\n  return new Storage(['sqlite', 'indexeddb', 'localstorage'],\
  \ { name: 'vplanet' })\n}\n\nconst cloudSettings: CloudSettings = {\n  'core': {\n\
  \    'app_id': 'f8fec798'\n  }\n};\n\n// Deeplink Configuration\nexport const deepLinkConfig:\
  \ DeepLinkConfig = {\n  links: [\n    { component: HomePage, name: 'Home Page',\
  \ segment: '' },\n    { component: CategoriesPage, name: 'Categories Page', segment:\
  \ 'categories' },\n    { component: ProductsPage, name: 'Categories Product Page',\
  \ segment: 'categories/:categoryId' },\n    { component: ProductDetailPage, name:\
  \ 'Product Details Page', segment: 'products/:productId' },\n    { component: WishlistPage,\
  \ name: 'Wishlist Page', segment: 'wishlist' },\n    { component: ShowcartPage,\
  \ name: 'Showcart Page', segment: 'cart' },\n    { component: SupportPage, name:\
  \ 'Support Page', segment: 'feedback' },\n    { component: SettingsPage, name: 'About\
  \ Page', segment: 'settings' },\n    { component: AboutPage, name: 'About Page',\
  \ segment: 'about' },\n    { component: LoginPage, name: 'Login Page', segment:\
  \ 'login' },\n    { component: SignupPage, name: 'Signup Page', segment: 'signup'\
  \ },\n    { component: AccountPage, name: 'Account Page', segment: 'account' }\n\
  \  ]\n};\n\n@NgModule({\n\n\n```ts\ndeclarations: [\n  vPlanetApp,\n  AboutPage,\n\
  \  AccountPage,\n  LoginPage,\n  PopoverPage,\n  SignupPage,\n  WalkThroughPage,\n\
  \  HomePage,\n  CategoriesPage,\n  ProductsPage,\n  ProductsFilterPage,\n  ProductDetailPage,\n\
  \  SearchPage,\n  WishlistPage,\n  ShowcartPage,\n  CheckoutPage,\n  SettingsPage,\n\
  \  SupportPage,\n  OrdinalPipe,\n],\nimports: [\n  BrowserModule,\n  HttpModule,\n\
  \  IonicModule.forRoot(vPlanetApp, {locationStrategy: 'hash'}, deepLinkConfig),\n\
  \  Ionic2RatingModule,\n  TranslateModule.forRoot({\n    provide: TranslateLoader,\n\
