- "# Ionic 2 精通指南\n\n## 关于作者\n\n开源爱好者，使用 Node.js、AngularJS、electron 和 Ionic 的 JavaScript\
  \ 全栈开发者。目前正在使用 BLE 信标进行物联网项目。Gaurav 在业余时间研究 VOIP 技术、物联网和 Material Design。他还与 Apache\
  \ 软件基金会有关联，在 Apache Roller、Apache Fineract 和 Apache OFBiz 项目中担任贡献者和提交者。他曾被选为并受邀在多个会议上担任演讲者，包括\
  \ Mifos Techdays、ApacheCON、Mifos Summit 以及许多当地学院/机构。他曾于 2014 年担任 Google 夏季代码学生实习生，并在\
  \ 2016 年与 Mifos Initiative 合作指导，使用基于 AngularJS 的社区应用。他于 2014 年和 2016 年在旧金山被选为 GSOC\
  \ 峰会代表。他过去曾在 Google Adwords 和 Analytics 工作，并于 2012 年成为 Google 在线营销挑战赛的半决赛选手。\n\n\
  *我谨向我的父母和已故的叔叔 Raj 表示感谢，没有他们，我很难走到今天并写下这本书。此外，在困难时期，我最好的朋友 Seema 全力支持我继续努力工作。*\n\
  \n*特别感谢我的实习生和内容编辑，他们在本书创作过程中提供了大量帮助。与你周围的优秀人才一起工作是一种乐趣。*\n\n*最后，我想感谢大家对本书的关注，我希望我能传递我加入\
