  \    useFactory: provideStorage\n  }),\n  CloudModule.forRoot(cloudSettings)\n],\n\
  bootstrap: [IonicApp],\nentryComponents: [\n  vPlanetApp,\n  AboutPage,\n  AccountPage,\n\
  \  LoginPage,\n  PopoverPage,\n  SignupPage,\n  WalkThroughPage,\n  HomePage,\n\
  \  CategoriesPage,\n  ProductsPage,\n  ProductsFilterPage,\n  ProductDetailPage,\n\
  \  SearchPage,\n  WishlistPage,\n  ShowcartPage,\n  CheckoutPage,\n  SettingsPage,\n\
  \  SupportPage\n],\nproviders: [\n  SplashScreen,\n  Deeplinks,\n  TextToSpeech,\n\
  \  AppRate,\n  GoogleAnalytics,\n  Camera,\n  CallNumber,\n  SocialSharing,\n  Push,\n\
  \  {provide: ErrorHandler, useClass: IonicErrorHandler},\n  { provide: Storage,\
  \ useFactory: provideStorage },\n  UserService,\n  DataService\n]\n})\nexport class\
  \ AppModule {}\n```\n\n此外，我建议你查看本章中 vPlanet Commerce 应用的代码，这将有助于你很好地了解我们在应用程序中将使用哪些页面和组件。由于本章主要针对各种\
  \ Ionic 组件，我们将在应用程序中使用大量这些组件。\n\n## Ionic 组件\n\n在构建应用程序时，我们可以有效地使用许多 Ionic JavaScript\
  \ 组件。最好的做法是寻找应用程序中需要的功能。让我们从我们的电子商务应用程序的首页开始，首页上将有一个带有横幅的图片滑块。\n\n### Slides\n\n\
  Slides 组件是一个多节容器，可用于多种场景，例如教程视图或横幅滑块。`<ion-slides>` 组件包含多个 `<ion-slide>` 元素，可以左右拖动或滑动。Slides\
  \ 提供了多种配置选项，可传递给 ion-slides，例如 autoplay、pager、direction: vertical/horizontal、initial\
  \ slide 和 speed。\n\n使用 slides 非常简单，我们只需将它们包含在我们的 home.html 中；home.ts 文件中不需要任何依赖即可包含它：\n\
  \n```html\n// Banner Slider in src/pages/home/home.html\n\n<ion-slides pager #adSlider\
  \ (ionSlideDidChange)=\"logLengthTrackEvent()\" style=\"height: 250px\">\n  <ion-slide\
  \ *ngFor=\"let banner of banners\">\n    <img [src]=\"banner\">\n  </ion-slide>\n\
  </ion-slides>\n\n// Defining banners image path\n\nexport class HomePage {\n\n \
  \ products: any;\n  banners: String[];\n\n  constructor() {\n    this.banners =\
  \ [\n      'assets/img/banner-1.webp',\n      'assets/img/banner-2.webp',\n    \
  \  'assets/img/banner-3.webp'\n    ]\n  }\n}\n```\n\n正如前面的代码所示，ion-slides 可用的属性有很多，例如\
  \ pager、autoplay、direction 等：\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_104_0.png)\n\
  \n如果查看前面的截图，你可以看到我们使用了白色背景的横幅。实际上，作为一个建议，尝试在应用程序内部使用与横幅相同的背景颜色。这样横幅在低分辨率或高分辨率的手机和平板上都会显示得很好。\n\
  \n### Lists\n\n列表是许多应用程序中最常用的组件之一。在列表中我们可以显示信息行。我们将在应用程序内部多次使用列表，例如在 `categories`\
  \ 页面上，我们显示多个子类别：\n\n```html\n// src/pages/categories/categories.html\n<ion-content\
  \ class=\"categories\">\n  <ion-list-header *ngIf=\"!categoryList\">Fetching Categories\
  \ ....</ion-list-header>\n  <ion-list *ngFor=\"let cat of categoryList\">\n    <ion-list-header>{{cat.name}}</ion-list-header>\n\
  \    <ion-item *ngFor=\"let subCat of cat.child\">\n      <ion-avatar item-left>\n\
  \        <img [src]=\"subCat.image\">\n      </ion-avatar>\n      <h2>{{subCat.name}}</h2>\n\
  \      <p>{{subCat.description}}</p>\n      <button ion-button clear item-right\
  \ (click)=\"goToProducts(subCat.id)\">View</button>\n    </ion-item>\n  </ion-list>\n\
  </ion-content>\n```\n\n我们在这里使用了一个带有所属类别顶部标题的头像列表。可用的列表类型有很多，例如多行、缩略图和滑动列表。我们将在本章后面在\
  \ showcart 页面上集成滑动列表：\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_107_0.png)\n\n\
  正如你所见，前面的截图显示了类别页面上头像列表的外观。我们应该确保在计划在应用程序中使用列表之前查看文档，因为这有助于我们可视化哪种类型的列表可以在各种不同的应用程序中得到最佳利用。\n\
  \n### Loading and Toast\n\nLoading 组件可用于指示某些活动，同时阻止任何用户交互。使用 Loading 组件最常见的情况之一是向服务器的\
  \ HTTP 调用，因为我们知道从服务器获取数据需要时间，在此期间为了良好的用户体验我们可以显示一些内容显示 Loading ...，或 Login wait\
  \ ...，用于登录页面。\n\nToast 是一个提供反馈的小弹出窗口，通常在用户执行某些操作时使用。Ionic 3 现在将其 toast 组件作为其库的一部分提供；之前我们必须使用原生的\
  \ Cordova 插件来实现 toasts，现在也可以使用。\n\nLoading 和 toast 组件都具有 `create` 方法。我们在创建这些组件时必须提供选项：\n\
  \n```ts\n// src/pages/login/login.ts\nimport { Component } from '@angular/core';\n\
  import { NgForm } from '@angular/forms';\nimport { NavController, LoadingController,\
  \ ToastController, Events } from 'ionic-angular';\nimport { SignupPage } from '../signup/signup';\n\
  import { HomePage } from '../home/home';\n\nimport { Auth, IDetailedError } from\
  \ '@ionic/cloud-angular';\n\nimport { UserService } from '../../providers/user-service';\n\
  \n@Component({\n  selector: 'page-user',\n  templateUrl: 'login.html'\n})\nexport\
  \ class LoginPage {\n  login: { email?: string, password?: string } = {};\n\n  submitted\
  \ = false;\n\n  constructor(public navCtrl: NavController,\n    public loadingCtrl:\
  \ LoadingController,\n    public auth: Auth,\n    public userService: UserService,\n\
  \    public toastCtrl: ToastController,\n    public events: Events) { }\n\n  onLogin(form:\
  \ NgForm) {\n    this.submitted = true;\n\n    if (form.valid) {\n      // start\
  \ Loader\n      let loading = this.loadingCtrl.create({\n        content: \"Login\
  \ wait...\",\n        duration: 20\n      });\n      loading.present();\n\n    \
  \  this.auth.login('basic', this.login).then((result) => {\n          // user is\
  \ now registered\n          this.navCtrl.setRoot(HomePage);\n          this.events.publish('user:login');\n\
  \          loading.dismiss();\n          this.showToast(undefined);\n        },\
  \ (err: IDetailedError<string[]>) => {\n          console.log(err);\n          loading.dismiss();\n\
  \          this.showToast(err)\n        });\n    }\n  }\n\n  showToast(response_message:\
  \ any) {\n    let toast = this.toastCtrl.create({\n      message: (response_message\
  \ ? response_message : \"Log In Successfully\"),\n      duration: 1500\n    });\n\
  \    toast.present();\n  }\n\n  onSignup() {\n    this.navCtrl.push(SignupPage);\n\
  \  }\n}\n```\n\n正如前面的代码所示，在代码层面创建 loader 和 toast 几乎相似。创建时提供的选项也相似；我们在这里在登录时使用了 loader，之后使用\
  \ toast 来显示所需消息。\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_111_0.png)\n\n*设置 duration\
  \ 选项是好的，因为如果 loader 被 dismiss 或在代码中未正确处理，那么我们将阻止用户对应用进行任何进一步交互。在向服务器的 HTTP 调用中，我们可能会遇到连接问题或失败情况；在这种情况下可能会导致用户被阻塞。*\n\
  \n\n\n\n## 标签页与分段控件\n\n标签页是在不同视图之间切换并在较高层级组织内容的最简单方式。另一方面，分段控件是一组按钮，可以将其视为特定组件内部的局部切换标签，主要用于筛选。借助标签页，我们可以在页脚构建一个快速访问栏，在其中放置菜单选项，例如首页、收藏和购物车。这样，我们就能一键访问这些页面或组件。另一方面，我们可以在账户组件中使用分段控件，将显示的数据划分为三个分段：个人资料、订单和钱包。\n\
  \n```html\n// src/pages/account/account.html\n<ion-header>\n  <ion-navbar>\n   \
  \ <button menuToggle>\n      <ion-icon name=\"menu\"></ion-icon>\n    </button>\n\
  \    <ion-title>Account</ion-title>\n  </ion-navbar>\n  <ion-toolbar [color]=\"\
  isAndroid ? 'primary' : 'light'\" no-border-top>\n    <ion-segment [(ngModel)]=\"\
  account\" [color]=\"isAndroid ? 'light' : 'primary'\">\n      <ion-segment-button\
  \ value=\"profile\">\n        Profile\n      </ion-segment-button>\n      <ion-segment-button\
  \ value=\"orders\">\n        Orders\n      </ion-segment-button>\n      <ion-segment-button\
  \ value=\"wallet\">\n        Wallet\n      </ion-segment-button>\n    </ion-segment>\n\
  \  </ion-toolbar>\n</ion-header>\n\n<ion-content class=\"outer-content\">\n  <div\
  \ [ngSwitch]=\"account\">\n\n    <div padding-top text-center *ngSwitchCase=\"'profile'\"\
  >\n      <img src=\"http://www.gravatar.com/avatar?d=mm&s=140\">\n      <h2>{{username}}</h2>\n\
  \n      <ion-list inset>\n        <button ion-item (click)=\"updatePicture()\">Update\
  \ Picture</button>\n        <button ion-item (click)=\"changePassword()\">Change\
  \ Password</button>\n        <button ion-item (click)=\"logout()\">Logout</button>\n\
  \      </ion-list>\n\n    </div>\n\n    <div padding-top text-center *ngSwitchCase=\"\
  'orders'\">\n      // Order List data to be shown here\n    </div>\n\n    <div padding-top\
  \ text-center *ngSwitchCase=\"'wallet'\">\n      // Wallet statement and transaction\
  \ here.\n    </div>\n\n  </div>\n</ion-content>\n```\n\n标签页有许多可用属性，例如 `mode`、`color`、`tabsPlacement`\
  \ 和 `tabsLayout`。同样，我们也可以在配置层级配置一些标签页属性；你可以在 https://ionicframework.com/docs/v2/api/config/Config/\
  \ 找到哪些属性可以全局配置或针对特定平台配置。\n\n## 警报\n\n警报是 Ionic 提供的组件，用于显示触发警报、确认、提示或某些特定操作。可以从 `ionic-angular`\
  \ 导入 `AlertController`，它允许我们以编程方式在应用内创建并显示警报。这里需要注意的一点是，这些是 JavaScript 弹出窗口，而不是原生平台弹出窗口。有一个名为\
  \ `cordova-plugin-dialogs` 的 Cordova 插件（https://ionicframework.com/docs/v2/native/dialogs/），如果你需要原生对话框\
  \ UI 元素，可以使用它。\n\n目前，在 Ionic 应用中可以显示五种类型的警报：基本警报、提示警报、确认警报、单选警报和复选警报。\n\n在 `src/pages/products/products.html`\
  \ 中，单选警报用于对产品进行排序：\n\n```html\n<ion-buttons>\n  <button ion-button full clear (click)=\"\
  sortBy()\">\n    <ion-icon name=\"menu\"></ion-icon>Sort\n  </button>\n</ion-buttons>\n\
  \n// onClick we call sortBy method\n// src/pages/products/products.ts\nimport {\
  \ NavController, PopoverController, ModalController, AlertController } from 'ionic-angular';\n\
  \nexport class ProductsPage {\n\n  constructor(\n    public alertCtrl: AlertController\n\
  \  ) {}\n\n  sortBy() {\n    let alert = this.alertCtrl.create();\n    alert.setTitle('Sort\
  \ Options');\n\n    alert.addInput({\n      type: 'radio',\n      label: 'Relevance',\n\
  \      value: 'relevance',\n      checked: true\n    });\n    alert.addInput({\n\
  \      type: 'radio',\n      label: 'Popularity',\n      value: 'popular'\n    });\n\
  \    alert.addInput({\n      type: 'radio',\n      label: 'Low to High',\n     \
  \ value: 'lth'\n    });\n    alert.addInput({\n      type: 'radio',\n      label:\
  \ 'High to Low',\n      value: 'htl'\n    });\n    alert.addInput({\n      type:\
  \ 'radio',\n      label: 'Newest First',\n      value: 'newest'\n    });\n\n   \
  \ alert.addButton('Cancel');\n    alert.addButton({\n      text: 'OK',\n      handler:\
  \ data => {\n        console.log(data);\n        // Here we can call server APIs\
  \ with sorted data\n        // using the data which user applied.\n      }\n   \
  \ });\n\n    alert.present().then(() => {\n      // Here we place any function that\n\
  \      // needs to be called as the alert is opened.\n    });\n  }\n}\n```\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_118_0.png)\n\
  \n这里是“取消”和“确定”按钮。我们在此处使用它来根据相关性、价格或其他排序值对产品进行排序。\n\n我们还可以准备自定义警报，在其中指定多个选项。如前一个示例所示，我们有五个单选选项；同样，我们甚至可以添加一个文本输入框来接收一些输入并提交。除此之外，在创建警报时，请记住\
  \ `AlertController` 组件（https://ionicframework.com/docs/v2/api/components/alert/AlertController/）中所有警报都存在警报、输入和按钮选项属性。\n\
  \n以下是一些警报选项：\n\n- `title: // string`：警报的标题\n- `subTitle: // string (可选)`：弹出窗口的副标题\n\
  - `Message: // string`：警报的消息\n- `cssClass: // string`：自定义 CSS 类名\n- `inputs: //\
  \ array`：警报的输入集合\n- `buttons // array (可选)`：按钮数组\n\n```html\n// src/pages/home/home.html\n\
  <br/><br/>\n<ion-card>\n  <br/>\n  <img [src]=\"prdt.imageUrl\"/>\n  <br/>\n  <ion-card-content>\n\
  \    <br/>\n    <ion-card-title no-padding>\n      <br/>\n      {{prdt.productName}}\n\
  \      <br/>\n    </ion-card-title>\n    <br/>\n    <ion-row no-padding class=\"\
  center\">\n      <br/>\n      <ion-col>\n        <br/>\n        <b>{{prdt.price\
  \ | currency }} &nbsp; </b>\n        <span class=\"discount\">{{prdt.listPrice |\
  \ currency}}</span>\n        <br/>\n      </ion-col>\n      <br/>\n    </ion-row>\n\
  \    <br/>\n  </ion-card-content>\n  <br/>\n</ion-card>\n\n<ion-badge width=\"25\"\
  >4.1</ion-badge>\n```\n\n## Ionic API 与自定义模块\n\n到目前为止，我们已经使用了多个 Ionic 组件。为了支持这些组件，我们为\
  \ checkbox、toggle、item 等类提供了组件 API，这些 API 展示了如何使用它们。在使用组件时，我们已经使用了许多 API。现在，我们将进一步研究所有可用于我们电子商务应用的有用\
  \ API。此外，另一个重要方面是使用自定义模块，通过添加本地化、创建自定义管道等进一步增强应用。\n\n## 复杂网格\n\n我们将从许多开发者在 Ionic\
  \ 网格系统中构建应用时常见的难题之一开始。Ionic 网格系统基于 flexbox（http://www.w3.org/TR/css3-flexbox/），这是一个所有设备都支持的\
  \ CSS3 特性。网格包含三个组件：网格（grid）、行（row）和列（col）。关于网格系统，有几点需要特别注意：\n\n- `ion-grid` 和 `ion-col`\
  \ 默认有 5px 的内边距，但 `ion-row` 没有内边距和外边距。\n- 可以添加 `no-padding` 属性来移除该内边距。\n- 使用十二列布局，类似于\
  \ Bootstrap 网格系统中的布局。\n- 在 `ion-col` 中使用 `column` 属性来设置宽度，例如 `<ion-col col-3>`，默认为\
  \ `col-12`。此外，默认情况下，列在所有设备和屏幕上都占据行内相同的宽度。\n- 有五个网格层级：`col-xs`、`col-sm`、`col-md`、`col-lg`\
  \ 和 `col-xl`，它们对应不同的屏幕尺寸。\n- `offset` 是一个用于设置偏移的属性，该属性会增加 * 列的左边距，例如 `<ion-col offset-1>`\n\
  - 我们可以在行中对齐列，例如 `align-self-center` 可使列居中。更多属性详情请查看 https://ionicframework.com/docs/api/components/grid/Col/。\n\
  - 类似地，我们还有行属性，默认情况下列会拉伸以填满行的整个高度。更多属性详情请查看 https://ionicframework.com/docs/api/components/grid/Row/。\n\
  \n在应用设计中，我们必须使用网格来设计不同的布局。最简单的布局可以使用 `width` 和 `offset` 属性构建。我们已经为电子商务应用的主页构建了一个布局，其中一行有两张卡片：\n\
  \n```html\n<ion-grid no-padding>\n  <ion-row>\n    <ion-col no-padding col-6 col-md-3\
  \ *ngFor=\"let product\n    of products;\">\n      <ion-card>\n        <img [src]=\"\
  product.imageUrl\"/>\n        <ion-card-content>\n          <ion-card-title no-padding>\n\
  \            {{product.productName}}\n          </ion-card-title>\n          <ion-row\
  \ no-padding class=\"center\">\n            <ion-col>\n              <b>{{product.price\
  \ | currency }} &nbsp; </b><span\n                class=\"discount\">{{product.listPrice\
  \ |\n                currency}}</span>\n            </ion-col>\n          </ion-row>\n\
  \        </ion-card-content>\n      </ion-card>\n    </ion-col>\n  </ion-row></ion-grid>\n\
  ```\n\n借助新的网格系统，开发者的生活变得非常轻松。以前，仅仅为了在一行中排列两张卡片并进行迭代，我们不得不在行和列上使用多个 `*ngFor` 进行迭代。现在，这个网格系统的灵感高度源于我们都非常熟悉的\
  \ Bootstrap 网格系统。因此，在小型屏幕上我们一行有两张卡片，而在中号及以上屏幕上，我们一行将有四张卡片：\n\n\n\n| 商品 | 价格1 | 价格2\
  \ |\n| --- | --- | --- |\n| 纯银 ... | USD5.28 | USD6.28 |\n| 纯银 ... | USD6.63 | USD7.95\
  \ |\n| 9K金CZ Cr... | USD15.20 | USD22.25 |\n| 9K金CZ Cr... | USD7.60 | USD11.25 |\n\
  \n```\n// src/filters/ordinal.ts\n\nimport { Pipe, PipeTransform } from '@angular/core';\n\
  \n@Pipe({name: 'ordinal'})\n\nexport class OrdinalPipe implements PipeTransform\
  \ { \n transform(value: number, args: string[]): any { \n\n if (!value) return value;\n\
  \n if(isNaN(value) || value < 1) { \n return value;\n } else { \n var lastDigit\
  \ = value % 10;\n\n if(lastDigit === 1) { \n return value + 'st' \n } else if(lastDigit\
  \ === 2) { \n return value + 'nd' \n } else if (lastDigit === 3) { \n return value\
  \ + 'rd' \n } else if (lastDigit > 3) { \n return value + 'th' \n } \n } \n } \n\
  }\n\n// using pipe in template\n\n<p> {{ data.value | ordinal }} </p>\n\nimport\
  \ { OrdinalPipe } from './filters/ordinal';\n\n@NgModule({ \n\n declarations: [\
  \ \n . \n . \n . \n OrdinalPipe, \n Settings \n ] \n\n})\n\n<p>{{ data.created_at\
  \ | date | uppercase }}</p>\n```\n\n```typescript\n// src/pages/login/login.ts\n\
  import { NavController, LoadingController, ToastController, Events } from 'ionic-angular';\n\
  \nconstructor(public navCtrl: NavController, public loadingCtrl: LoadingController,\
  \ public auth: Auth, public userService: UserService, public toastCtrl: ToastController,\
  \ public events: Events) { }\n\nthis.auth.login('basic', this.login).then((result)\
  \ => {\n  // user is now registered\n  this.navCtrl.setRoot(HomePage);\n  this.events.publish('user:login');\n\
  \  loading.dismiss();\n  this.showToast(undefined);\n}, (err: IDetailedError<string[]>)\
  \ => {\n  console.log(err);\n  loading.dismiss();\n  this.showToast(err)\n});\n\n\
  <ion-buttons end>\n  <button ion-button (click)=\"goToCart()\">\n    <ion-icon ios=\"\
  ios-cart\" md=\"md-cart\"></ion-icon>\n  </button>\n</ion-buttons>\n\n// src/pages/categories/categories.ts\n\
  import { NavController, PopoverController } from 'ionic-angular';\nimport { ShowcartPage\
  \ } from '../showcart/showcart';\n\nexport class CategoriesPage {\n  constructor(public\
  \ navCtrl: NavController) { }\n\n  goToCart() {\n    this.navCtrl.push(ShowcartPage);\n\
  \  }\n}\n```\n\n这里你可以看到我们已经推送了 ShowcartPage 组件。我们还可以将数据作为 push 函数的下一个参数传递到下一页，并在下一页使用\
  \ navParams 类及其 get 方法来获取数据。\n\n## 从覆盖组件进行导航\n\n最近，在从弹出框导航到页面时，我遇到了一个问题。每次我点击弹出框内的链接并直接推送下一个组件，应用就会冻结。我们将实现弹出框组件，并在其中导航到\
  \ SettingsPage 和 SupportPage：\n\n```\n// src/pages/popover/popover.ts\nimport {\
  \ Component } from '@angular/core';\nimport { ViewController, NavController, App,\
  \ ModalController } from 'ionic-angular';\n\nimport { SupportPage } from '../support/support';\n\
  import { SettingsPage } from '../settings/settings';\n\n@Component({\n  template:\
  \ ` \n    <ion-list>\n      <button ion-item\n      (click)=\"goToPage('SettingsPage')\"\
  >Settings</button>\n      <button ion-item\n      (click)=\"goToPage('SupportPage')\"\
  >Support</button>\n      <button ion-item\n      (click)=\"close('http://ionicframework.com/docs/v2/getting-started')\"\
  >Learn Ionic</button>\n    </ion-list>\n  `;\n})\nexport class PopoverPage {\n\n\
  \  classes: any;\n\n  constructor(\n    public viewCtrl: ViewController,\n    public\
  \ navCtrl: NavController,\n    public app: App,\n    public modalCtrl: ModalController\n\
  \  ) {\n\n    this.classes = {\n      'SettingsPage': SettingsPage,\n      'SupportPage':\
  \ SupportPage\n    }\n\n  }\n\n  goToPage(page:any) {\n    // Navigating from Overlay\
  \ Components\n    // https://ionicframework.com/docs/v2/api/navigation/NavController/\n\
  \    // If you simply push it will freeze the UI\n    this.viewCtrl.dismiss();\n\
  \    this.app.getRootNav().push(this.classes[page]);\n  }\n\n  close(url: string)\
  \ {\n    window.open(url, '_blank');\n    this.viewCtrl.dismiss();\n  }\n}\n```\n\
  \n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_128_0.png)\n\n如你所见，我们没有直接推送 Page 组件，而是先通过\
  \ getRootNav() 方法获取应用中 rootNav 的引用。\n\n## 生命周期事件与导航守卫\n\n生命周期事件在 Ionic 1 中就已经存在，原生平台也有结构完善的生命周期，这让我们能够在导航的各阶段执行操作。目前有六个页面事件和两个导航守卫可用：\n\
  \n- ionViewDidLoad: 页面加载完成时\n- ionViewWillEnter: 页面即将进入时\n- ionViewDidEnter: 页面完全进入时\n\
  - ionViewWillLeave: 页面即将离开时\n- ionViewDidLeave: 页面结束离开时\n- ionViewWillUnload: 页面即将被销毁时\n\
  - ionViewCanEnter: 视图进入前运行\n- ionViewCanLeave: 视图退出前运行\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_131_0.png)\n\
  \nionViewCanEnter 和 ionViewCanLeave 是两个导航守卫，用于控制视图的进入和离开。例如，如果我们正在填写表单，不小心点击了某个按钮或菜单项，用户已填写的数据会立即被清除。为了保护数据，我们可以像在\
  \ support 页面上那样应用 ionViewCanLeave：\n\n```typescript\n// src/pages/support/support.ts\n\
  \n// If the user enters text in the support question and\n// then navigates\n//\
  \ without submitting first, ask if they meant to leave\n// the page\nionViewCanLeave():\
  \ boolean | Promise<boolean> {\n// If the support message is empty we should just\n\
  // navigate\nif (!this.supportMessage ||\nthis.supportMessage.trim().length ===\
  \ 0) {\nreturn true;\n}\n\nreturn new Promise((resolve: any, reject: any) => {\n\
  let alert = this.alertCtrl.create({\n    title: 'Leave this page?',\n    message:\
  \ 'Are you sure you want to leave this page? Your support message will not be submitted.'\n\
  });\nalert.addButton({ text: 'Stay', handler: reject });\nalert.addButton({ text:\
  \ 'Leave', role: 'cancel',\nhandler: resolve });\n\nalert.present();\n});\n}\n```\n\
  \n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_132_0.png)\n\n导航对于我们构建的任何应用来说都是重要组成部分，因此我个人的建议是，认真阅读并理解导航组件的所有重要主题，无论大小。我最初犯的一个错误是没有通读全部文档，由于之前提到的冻结问题，这几乎浪费了我一整天。你可以通过\
  \ [https://ionicframework.com/docs/v2/api/navigation/NavController/](https://ionicframework.com/docs/v2/api/navigation/NavController/)\
  \ 查看导航 API。\n\n## 国际化与本地化\n\n当我们需要构建一款影响世界各地用户生活的全球化应用时，我们必须考虑国际化与本地化等多个方面。我们将把它集成到我们的电商应用中，以便添加多语言支持。\n\
  \n我们首先安装 `ng2-translate` npm 模块：\n\n```\nnpm install ng2-translate --save\n```\n\
  \n接下来，我们将在 `app.module.ts` 中引入所需模块和方法：\n\n```\n// /src/app/app.module.ts\nimport\
  \ { TranslateModule, TranslateLoader, TranslateStaticLoader } from 'ng2-translate/ng2-translate';\n\
  \nexport function createTranslateLoader(http: Http) {\n  return new TranslateStaticLoader(http,\
  \ './assets/i18n', '.json');\n}\n\n@NgModule({\n  imports: [\n    IonicModule.forRoot(vPlanetApp),\n\
  \    TranslateModule.forRoot({\n      provide: TranslateLoader,\n      useFactory:\
  \ createTranslateLoader,\n      deps: [Http]\n    }),\n    CloudModule.forRoot(cloudSettings)\n\
  \  ]\n})\n\nexport class AppModule {}\n```\n\n我们创建了一个独立函数 `createTranslateLoader`，在其中定义了\
  \ `i18n/` 文件夹，该文件夹包含每种语言的 JSON 文件。现在我们可以使用该模块了，并在 `app.component.ts` 中初始化 `TranslateService`，以确定使用哪种语言：\n\
  \n```\nimport {TranslateService} from 'ng2-translate/ng2-translate';\n\n@Component({\n\
  \  templateUrl: 'app.template.html',\n  providers: [TranslateService]\n})\n\nexport\
  \ class vPlanetApp {\n\n  constructor(\n    public translate: TranslateService\n\
  \  ) {\n\n    this.initializeTranslateServiceConfig();\n\n  }\n\n  // We are using\
  \ the user default language\n  // and set that default locale\n\n  initializeTranslateServiceConfig()\
  \ {\n    var userLang = navigator.language.split('-')[0];\n    userLang = /(en|es)/gi.test(userLang)\
  \ ? userLang :\n    'en';\n    this.translate.setDefaultLang('en');\n    this.translate.use(userLang);\n\
  \  }\n}\n```\n\n\n\n\n现在我们可以像使用管道一样在模板中使用它。因为我们在电商应用中有循环渲染的侧边菜单列表项，所以我们首先会在侧边菜单上实现翻译：\n\
  \n```\n<ion-list>\n    <ion-list-header>\n        {{'navigate' | translate}}\n \
  \   </ion-list-header>\n    <button ion-item menuClose *ngFor=\"let p of appPages\"\
  \ (click)=\"openPage(p)\">\n        <ion-icon item-left [name]=\"p.icon\" [color]=\"\
  isActive(p)\"></ion-icon>\n        {{ p.title | translate }}\n    </button>\n</ion-list>\n\
  ```\n\n一旦设置了区域设置，它就会从 `/assets/i18n` 文件夹中的 JSON 文件提取对应的标签。目前我们在该应用中只实现了 `en` 和 `es`\
  \ 两种区域设置，但我们可以通过为电商应用想要支持的每种语言添加更多 `locale.json` 文件来轻松扩展：\n\n```\n// es.json\n{\n\
  \    \"menu\": \"Menú\",\n    \"home\": \"Casa\",\n    \"navigate\":\"Navegar\"\
  ,\n    \"categories\":\"Categorías\",\n    \"cart\":\"Carrito de compras\",\n  \
  \  \"wishlist\":\"Lista de deseos\",\n    \"about\": \"Acerca de\",\n    \"categories\"\
  :\"Categorías\",\n    \"login\": \"Iniciar sesión\",\n    \"logout\":\"Cerrar sesión\"\
  ,\n    \"account\":\"Cuenta\",\n    \"signup\":\"Regístrate\",\n    \"popular\"\
  :\"Productos Populares\",\n    \"settings\":\"Ajustes\",\n    \"feedback\":\"Realimentación\"\
  \n}\n```\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_136_0.png)\n\n上面是一个 `es.json`\
  \ 示例，其中我们放置了不同的标签，用于进行内容翻译。接下来，如果你想翻译 TypeScript 文件中的任何 JavaScript 值，可以使用 `translateService`\
  \ 及其 `get` 方法，它会订阅 observable 并返回翻译后的字符串：\n\n```\ntranslateService.get('HELLO').subscribe(\n\
  \  value => {\n    // value returned is translated\n    console.log(value);\n  }\n\
  )\n```\n\n最初设置和翻译该模块可能会花费一些时间，因为涉及多个部分，开发人员在设置时可能会忽略一些要点。为应用添加国际化功能将产生巨大的影响，并拓宽你能够吸引的用户群；这有助于你在\
  \ Play Store 上获得更好的评分。\n\n## ItemSliding 和下拉刷新\n\n在现代应用中，动画和手势是必不可少的，它们能够在用户使用应用功能时提升用户体验。你会在大多数\
  \ iOS 应用中找到 `ItemSliding` 功能，而下拉刷新通常用于获取最新数据，就像 Facebook 应用一样，你会用它来获取最新的信息流。\n\n\
  `ItemSliding` 是一个可滑动的列表，可以向左或向右滑动以显示操作按钮。我们将在收藏夹页面使用可滑动列表，在该页面中，我们可以对产品执行从列表中删除或添加到购物车的操作：\n\
  \n```\n// src/pages/wishlist/wishlist.ts\n<ion-content>\n  <ion-list>\n    <ion-list-header>\n\
  \      4 Items in your Wishlist (Swipe for options).\n    </ion-list-header>\n\n\
  \    <ion-item-sliding *ngFor=\"let product of products\">\n      <ion-item>\n \
  \       <ion-avatar item-left>\n          <img [src]=\"product.image\">\n      \
  \  </ion-avatar>\n        <h2>{{product.name}}</h2>\n        <h3>{{product.price\
  \ | currency}}</h3>\n        <p>{{product.rating}} stars and 420 reviews</p>\n \
  \     </ion-item>\n      <ion-item-options side=\"right\">\n        <button danger>\n\
  \          <ion-icon name=\"trash\"></ion-icon>\n          Remove\n        </button>\n\
  \        <button secondary>\n          <ion-icon name=\"cart\"></ion-icon>\n   \
  \       Add Cart\n        </button>\n      </ion-item-options>\n    </ion-item-sliding>\n\
  \  </ion-list>\n</ion-content>\n```\n\n让我们来看看 `itemSliding` 上可用的一些属性：\n\n- 滑动方向可以是向右或向左；两者都会显示操作按钮。我们可以使用\
  \ `<ion-item-options side=\"right\">` 来设置右滑选项\n- 在滑动列表项时，可以使用 `IonDrag` 和 `ionSwap`\
  \ 事件来监听或调用某些函数\n- 图标可以放在按钮文本的上方或左侧，例如 `<ion-item-options icon-left>`\n- 也可以导入 `ItemSliding`\
  \ 类来访问 `close()` 方法\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_139_0.png)\n\n如你所见，上面的截图展示了\
  \ `itemSliding` 列表的外观。下拉刷新是另一个组件，主要用于我们需要刷新现有内容并从后端服务器获取新数据时。`refresher` 模块会检测垂直滑动，并在调用\
  \ `refresh` 函数时显示加载图标。虽然我们在应用中没有确切的用例需要使用它，但实现 `refresher` 非常简单：\n\n```html\n<ion-content>\n\
  \    <ion-refresher (ionRefresh)=\"updateFeed($event)\">\n        <ion-refresher-content\n\
  \            pullingText=\"Updating Feed\"\n            refreshingSpinner=\"circles\"\
  \n            refreshingText=\"Updating...\">\n        </ion-refresher-content>\n\
  \    </ion-refresher>\n    <h4>User Feed</h4>\n</ion-content>\n```\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_139_1.png)\n\
  \n`ion-refresher` 组件具有 `ionRefresh` 属性，当刷新器被垂直拉动到一定程度时会调用该属性。之后，正如你在 `ion-refresher-content`\
  \ 中看到的，有多组属性实际上充当着刷新器的配置设置，具有多种选项：\n\n```typescript\nimport { Http } from '@angular/http';\n\
  \nexport class FeedPage {\n    constructor(public http: Http) {}\n\n    updateFeed(refresher)\
  \ {\n\n        // Calling a web service to fetch new feeds\n            result\n\
  \            this.http.get('path/to/data.json')\n                .map(res => res.json())\n\
  \                .subscribe(data => {\n                    // After the callback\
  \ we will\n                        complete the refresher\n                    \
  \    // and update the data inside the view.\n                        refresher.complete();\n\
  \                });\n        }\n}\n```\n\n在我们调用 `ionRefresh` 函数后，一旦从服务器获取到数据，就需要关闭刷新过程。当来自服务器的异步请求完成时，会调用\
  \ `complete()` 方法。我们必须确保调用此方法，否则加载图标将不会消失。\n\n## 虚拟滚动和无限滚动\n\n虚拟滚动和无限滚动是两个重要的组件，它们同样广泛应用于不同的应用中，以处理列表中大量的项目。虚拟滚动用于实现一次渲染可能会过长而无法完成的列表，例如包含数千个联系人的联系人列表。如果我们尝试加载整个列表并进行渲染，将会阻碍我们应用的性能，并且在向下滚动列表时会感到卡顿。让我们来看看如何在我们的产品页面中实现虚拟滚动：\n\
  \n```\n// src/pages/products/products.html\n<ion-content class=\"products\">\n<ion-list>\n\
  <ion-item>\n<ion-note item-left>\nDuplicate products for VirtualScroll demo\n</ion-note>\n\
  </ion-item>\n</ion-list>\n<ion-grid [virtualScroll]=\"products\" approxItemHeight=\"\
  40px\">\n<ion-row *virtualItem=\"let product\" (click)=\"goToProductDetail(product)\"\
  >\n<ion-col width-33>\n// Important to use ion-img rather than img tag\n// this\
  \ will lazy load the images as we scroll downwards\n// Also, image sizes should\
  \ not vary after its loaded\n<ion-img class=\"v-img\" [src]=\"product.image\">\n\
  </ion-img>\n</ion-col>\n<ion-col width-67>\n<p>{{ product.name }}</p>\n<ion-badge\
  \ item-right>4.1</ion-badge> 340 ratings\n<p class=\"price\"> {{ product.price |\
  \ currency: 'INR' }} </p>\n</ion-col>\n</ion-row>\n</ion-grid>\n</ion-content>\n\
  ```\n\n在使用虚拟滚动组件时，需要注意的一些重要点是：在列表加载后，我们不应进行任何 DOM 操作或更改数据集，因为这需要重置或刷新整个列表，这是一项对内存消耗很大的操作。为了虚拟滚动能够流畅工作，需要指定列表内项目的近似宽度和高度。默认值为\
  \ 40px。\n\n\n\n\n高度，虽然不一定要给出确切数字，但接近确切高度会更好。\n\n无限滚动是指在用户滚动到指定距离后，页面内容会被动态追加。在无限滚动中，会调用一个函数来异步获取新数据并追加到列表中：\n\
  \n```html\n<ion-content>\n  <ion-list>\n    <ion-item *ngFor=\"let product of products\"\
  >\n      {{product.name}}</ion-item>\n  </ion-list>\n\n  <ion-infinite-scroll\n\
  \    (ionInfinite)=\"getNewProducts($event)\">\n    <ion-infinite-scroll-content></ion-infinite-scroll-content>\n\
  \  </ion-infinite-scroll>\n</ion-content>\n```\n\n`ionInfinite` 属性用于调用 `getNewProducts()`\
  \ 函数，该函数最终会获取新数据：\n\n```typescript\nexport class ProductsPage {\n\n  constructor()\
  \ {}\n\n  getNewProducts(infiniteScroll) {\n    // Call an HTTP function or service\n\
  \    // fetches new data and append to the products array list.\n    // Make sure\
  \ to call complete method to close the loader icon.\n    infiniteScroll.complete();\n\
  \  }\n}\n```\n\n正如你所看到的，虚拟滚动和无限滚动在模板及其方法方面几乎是相同的。你可以在两个组件中找到相似的属性，在其中可以声明 `loadingText`\
  \ 和 `loadingSpinner`。如果需要，我们可以进一步使用自定义的 SVG 和 CSS 动画来定制虚拟滚动和无限滚动的设计。\n\n## Ionic\
  \ 评分\n\nIonic 评分是一个用于可视化评分条的第三方模块。我们将在应用的商品详情页中使用这个模块。该模块以 NPM 模块的形式提供，因此集成起来非常快速简单：\n\
  \n```bash\n$ npm install --save ionic2-rating\n```\n\n```typescript\n// src/app/app.module.ts\n\
  \nimport { Ionic2RatingModule } from 'ionic2-rating';\n\nimports: [\n    IonicModule.forRoot(vPlanetApp),\n\
  \    Ionic2RatingModule,\n    TranslateModule.forRoot({\n        provide: TranslateLoader,\n\
  \        useFactory: createTranslateLoader,\n        deps: [Http]\n    }),\n   \
  \ CloudModule.forRoot(cloudSettings)\n],\n\n// src/pages/product-detail/product-detail.html\n\
  <rating [(ngModel)]=\"rate\" readOnly=\"false\" max=\"5\"></rating>\n```\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_145_0.png)\n\
  \nIonic 社区在过去三年中发展迅速；GitHub 上有多个第三方组件可用，你可以在应用中间巧妙地使用它们，就像我们在电商应用中使用 ionic-rating\
  \ 插件一样。其中一些组件包括：\n\n-   [Ionic 评分](https://github.com/andrucz/ionic2-rating)\n-\
  \   [图片缓存和加载器](https://github.com/zyra/ionic-image-loader)\n-   [强制安装](https://github.com/NextFaze/ionic-manup)\n\
  -   [地理围栏](https://github.com/tsubik/ionic2-geofence)\n-   [手风琴组件](https://github.com/mahmoudissmail/ionic2Accordion)\n\
  -   [日历组件](https://github.com/twinssbc/Ionic2-Calendar)\n\n寻找这些优秀代码的最佳方式是在 GitHub\
  \ 上搜索并查看星标数最高的 Ionic 项目。我一直在使用这种技巧来了解开发者们在 Ionic 上默默做着什么或正在研究什么。大多数情况下，这些项目都采用 MIT\
  \ 许可证，因此你可以在应用中自由使用它们。\n\n## 使用 Ionic 3 实现懒加载\n\n懒加载是 Ionic 3 最近发布的一个备受期待的功能。懒加载将改善应用的启动时间，减少打包体积，并消除在每个类中包含相同组件路径的麻烦，从而简化设置\
  \ Ionic 路由的过程。让我们看看需要做哪些更改，以及你的应用将如何改进。另外，在第 5 章“身份验证、授权与安全”中，应用演示将实现懒加载。\n\n目前，懒加载组件存在一些已知的缺陷，Ionic\
  \ 团队正在积极解决。此外，设置懒加载会覆盖 `IonicModule.forRoot` 中定义的 `DeepLinkConfig`。我们将为每个组件引入 `IonicPageModule`，并在每个页面组件中添加一个新的\
  \ `module.ts` 文件。请务必持续关注 Ionic 博客以及任何可能带来更多缺陷修复和新功能的新版本。\n\n以前，我们在 `app.module.ts`\
  \ 中一次性导入所有页面，而现在我们只初始化加载 `app.component.ts`。因此，像 `HomePage` 这样的所有组件都从 declarations\
  \ 和 entryComponents 中移除。接下来，在我们的 `src/pages/home` 目录中，我们引入了另一个文件 `home.module.ts`，类似于我们在\
  \ `app.module.ts` 中的文件。现在，如果你使用 Ionic CLI 生成一个页面，你会发现创建了四个文件：\n\n```text\nhome.html\n\
  \nhome.module.ts\n\nhome.scss\n\nhome.ts\n\n// src/pages/home/home.ts\n\nimport\
  \ { Component } from '@angular/core';\n\nimport { IonicPage, NavController } from\
  \ 'ionic-angular';\n\n@IonicPage()\n\n@Component({\n    selector: 'page-home',\n\
  \    templateUrl: 'home.html',\n})\n\nexport class HomePage {\n    constructor(public\
  \ navCtrl: NavController) {}\n\n    moveTo(data: any) {\n        this.navCtrl.push(\"\
  ContactPage\", data);\n    }\n}\n```\n\n此外，现在如果我们想导航到（push）或返回（pop）任何其他组件，不再需要导入它。我们可以直接将其作为字符串处理；在构建过程中，会生成知道如何处理该字符串的深层链接。该字符串实际上是对\
  \ `@IonicPage` 装饰器的 `name` 属性的引用，该属性默认为类名字符串。如果我们将该 `name` 属性改为其他值，还需要更新在其他地方使用的引用。你可以在这里（http://ionicframework.com/docs/v2/nightly/api/navigation/IonicPage/）找到关于\
  \ `IonicPage` 及其支持字段的更多信息。\n\n## 小结\n\nIonic 组件和相关资源是任何 Ionic 应用的基础。通过智能使用组件和可用的第三方组件，我们可以获得更好的性能，并使我们的应用对用户更友好。在正确的位置选择正确的组件是很讲究的，最有趣的部分是我们必须从最终用户的角度以及最终用户对应用体验的角度去思考。我们必须确保用户不会感觉自己处于一个不同的世界，不会脱离原生体验，这种情况经常发生。我们可以在本章中涵盖尽可能多的重要组件和重点，但更建议的是持续关注社区动态，并寻找可以轻松用于应用的可用资源。接下来，我们将转向应用内插件的集成。由于几乎每个应用都使用某种插件，因此正确集成插件对于生产级应用至关重要。相机、GPS、文件系统和网络插件是常用的插件。我们将集成这些常用插件，以及一些许多开发者在集成时遇到问题的复杂插件。Ionic\
  \ 团队已经发布了一个很棒的项目——Ionic Native，它简化了 Cordova 插件的使用流程。Ionic Native 是一个基于许多插件的包装库，因此我们可以轻松地将其集成到基于\
  \ Angular 的 Ionic 应用中。\n"
- "# Ionic Native 和插件\n\n现在我们已经了解了 Ionic 中的一些高级组件和 API。构建混合移动应用的另一个重要部分是 Cordova 插件。插件在原生\
  \ API 和 JavaScript 之间建立了桥梁，帮助我们使用相机、GPS、文件等原生 API。插件由特定平台的原生库代码和用于调用相应原生平台方法的 JavaScript\
  \ 接口组成。Ionic 依赖 Cordova 来构建、调试和发布应用。在本章中，我们将涵盖有关 Cordova 插件、Ionic Native 以及一些常见和高级插件的几乎所有内容。起初，Ionic\
  \ 团队推出了基于 Angular 1.x 的 ngCordova，但后来我们有了支持 Ionic 1、2 和 3 应用的 Ionic Native。ngCordova\
  \ 绑定于 Ionic 1，而 Ionic Native 与框架无关：\n\n-   Cordova 以及插件的工作原理\n-   Ionic Native\n\
  -   常用 Cordova 插件（相机、GPS、通讯录）\n-   构建音乐播放器\n-   Cordova 与 PhoneGap 的对比\n\n\n\n\n\
  ## Cordova 与插件的工作原理\n\nCordova 是一个使用 HTML、CSS 和 JavaScript 在单一代码库中构建原生移动应用的平台。Cordova\
  \ 提供对多个平台和插件的支持。Cordova 插件允许 Cordova 的 Web 视图与原生平台通信，而我们的 Ionic 应用运行在 Web 视图中，因此我们可以访问平台\
  \ API，如相机、地理位置等。\n\n### 什么是 Cordova？\n\n关于 Cordova，官方描述如下：\n\n> *Apache Cordova\
  \ 是由 Apache 组织维护的一个项目。Cordova 是一组设备 API，允许移动应用开发者通过 JavaScript 访问相机或加速度计等原生设备功能。结合\
  \ Ionic 等框架，只需使用 HTML、CSS 和 JavaScript 即可开发智能手机应用。*\n\n我们都可能在自己的应用中使用过 Cordova，也了解一些\
  \ Cordova 官方支持的常见插件。下面我将列出一些有助于理解 Cordova 的常见要点：\n\n- Cordova 是一个应用容器\n- Cordova\
  \ 帮助为每个平台构建原生应用\n- Cordova 提供对原生设备 API 的访问，例如相机、通讯录、GPS 等\n- 还可以编写和支持自定义插件\n- Cordova\
  \ 是 Adobe PhoneGap 背后的引擎\n- Cordova 开源且免费使用\n\n如前所述，Cordova 官方支持多个平台和插件。我们可以看到许多新插件正在涌现，例如用于指纹、热点等功能的插件，我们可以利用它们来构建高级混合应用。大多数第三方插件都支持\
  \ iOS 和 Android 平台，因为这两个平台在设备市场中占据主要份额。最近，一些第三方 Cordova 插件也开始支持诸如蓝牙信标等新兴技术。在本书的后续内容中，我们将构建一个应用程序并使用这项技术。\n\
  \n### 构建和使用 Cordova 插件\n\n开发者使用 CLI 命令在项目中构建或添加 Cordova 插件。你也可以通过 plugman 发布自己的插件并与社区共享。我们还将快速了解如何构建和发布插件。\n\
  \n```\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<plugin xmlns=\"http://www.phonegap.com/ns/plugins/1.0\"\
  \ id=\"cordova-eddyblue\" version=\"1.0.0\">\n\n<name>Custom Plugin</name>\n<description>\
  \ Cordova custom bluetooth plugin \n</description>\n<author>Gaurav Saini</author>\n\
  <license>Apache 2.0</license>\n\n<keywords>Eddystone, Beacons</keywords>\n\n\n<engines>\n\
  <engine name=\"cordova\" version=\">=3.4.0\" /> <!-- Needs cordova version greater\
  \ than 3.4.0 -->\n</engines>\n\n<!-- Javascript module and file path -->\n<js-module\
  \ src=\"www/eddyblue.js\" name=\"eddyblue\">\n<clobbers target=\"eddyblue\" />\n\
  </js-module>\n\n<!-- android platform -->\n<platform name=\"android\">\n\n<config-file\
  \ target=\"res/xml/config.xml\" parent=\"/*\">\n<feature name=\"Scan\">\n<param\
  \ name=\"android-package\" \nvalue=\"com.eddyblue.plugin.scan\"/>\n</feature>\n\
  </config-file>\n\n<source-file src=\"src/android/Eddyblue.java\" target-dir=\"src/com/eddyblue/plugin/\"\
  />\n</platform>\n\n<!-- ios platform -->\n<platform name=\"ios\">\n\n<config-file\
  \ target=\"config.xml\" parent=\"/widget\">\n<feature name=\"Scan\">\n<param name=\"\
  ios-package\" value=\"HWPEddyblue\" \n/>\n</feature>\n</config-file>\n\n<header-file\
  \ src=\"src/ios/HWPEddyblue.h\" target-dir=\"Eddyblue\"/>\n<source-file src=\"src/ios/HWPEddyblue.m\"\
  \ target-dir=\"Eddyblue\"/>\n</platform>\n\n</plugin>\n```\n\n```\nmodule.exports\
  \ = {\n  scan: function (name, successCallback, errorCallback) {\n    cordova.exec(successCallback,\
  \ errorCallback, \"Scan\", \"start\", [name]);\n  }\n};\n```\n\n```\npackage com.eddyblue.plugin;\n\
  \nimport org.apache.cordova.*;\nimport org.json.JSONArray;\nimport org.json.JSONException;\n\
  \npublic class Scan extends CordovaPlugin {\n\n @Override\n public boolean execute(String\
  \ action, JSONArray data, CallbackContext callbackContext) throws JSONException\
  \ {\n\n if (action.equals(\"start\")) {\n String message = \"data to be sent\";\n\
  \ callbackContext.success(message);\n return true;\n } else {\n return false;\n\
  \ }\n }\n}\n```\n\n我们现在已经简要介绍了插件的工作原理。你现在可以轻松地与社区共享你的插件，并使用 plugman 将其添加到注册表中。有关插件开发的更多细节，你可以参阅\
  \ Cordova 官方文档，它会提供进一步的指导。\n\n## Ionic Native\n\n开发混合应用的开发者已经在 Ionic 1 中使用 ngCordova\
  \ 一段时间了。现在，随着使用 ES6 和 TypeScript 构建的 Ionic 3 的出现，我们需要一个面向 ES6 或 TypeScript 的包装库，这正是\
  \ Ionic Native 的作用。它是基于 Cordova API 构建的 ES5/ES6/TypeScript 包装器集合，便于集成到 Ionic 应用中。Ionic\
  \ 团队最初是应社区成员的功能请求而启动这个项目的。它最初只是一个实验，但由于插件集成时常常面临文档缺失和 API 混乱的问题，它获得了大量支持。这些 AngularJS\
  \ 包装器简化了集成过程，并且也符合 Angular 的语法。目前，Ionic Native 支持大约 120+ 个 Cordova 插件，而且数量还在不断增加。\n\
  \n### 安装 Ionic Native\n\n我们可以将 Ionic Native 添加到任何现有的 Ionic 项目中。在任何使用 Ionic 3 创建的入门项目中，你都会默认找到\
  \ `ionic-native`。如果由于某种原因需要安装它，推荐的方式是通过 NPM 包：**$ npm install @ionic-native/core\
  \ --save**\n\n如果你使用 ES6/TypeScript 构建 Ionic 3 应用，则无需在 `index.html` 文件中包含任何脚本标签。只需在文件中导入特定的\
  \ `ionic-native` 包即可：\n\n```typescript\nimport { SplashScreen } from '@ionic-native/splash-screen'\n\
  import { StatusBar } from '@ionic-native/status-bar';\n```\n\n如果你使用的是 Ionic 1，则需要在\
  \ `index.html` 文件中添加 `ionic.native.js` 文件：\n\n```html\n<script src=\"ionic.native.js\"\
  ></script>\n```\n\n我们必须将大多数插件调用包装在设备就绪事件中。因此，要检查设备是否已完全加载应用且插件可用，请使用 `Splashscreen`\
  \ 插件的以下代码：\n\n```typescript\nconstructor(platform: Platform, private\n  splashScreen:\
  \ SplashScreen, statusBar: StatusBar)\n  {\n    this.platform.ready().then(() =>\
  \ {\n      // platform is ready to use available plugins.\n      this.statusBar.styleDefault();\n\
  \      this.splashScreen.hide();\n    });\n  }\n```\n\n### 在浏览器中测试插件\n\n目前 Cordova\
  \ 插件最大的问题之一是我们无法在浏览器中测试应用。Ionic 团队一直专注于改进 Ionic 工具，以便我们可以直接在浏览器中模拟应用的大部分功能。不过，对于当前的开发，有一个非常好的\
  \ Chrome 插件——Cordova mocks，它由 Paolo Bernasconi 创建，他是之前 ngCordova 项目的核心贡献者之一。安装该插件后，你就可以像在手机上测试一样开始测试应用。目前，此扩展支持大约十二个插件。这个\
  \ Chrome 插件在某些情况下可能很有效，可以帮助你在浏览器中测试受支持的插件。\n\n### 常用的 Cordova 插件\n\n每当你启动一个新的 Ionic\
  \ 项目并添加平台时，你会看到有一些默认安装的插件。当你添加 Android 或 iOS 平台时，Ionic 会安装以下提到的插件：\n\n- ionic-plugin-keyboard\n\
  - cordova-plugin-console\n- cordova-plugin-device\n- cordova-plugin-splashscreen\n\
  - cordova-plugin-whitelist\n- cordova-plugin-statusbar\n\n让我们开始了解上述插件及其用途吧。\n\n\n\
  \n\n\n## 设备插件\n\n设备插件在获取所有设备相关的硬件和软件信息方面非常有帮助。设备对象在全局作用域中可用，但仅在设备就绪后可用。\n\nIonic\
  \ Native 通过 devices 支持此插件，它有六个静态成员来访问数据：\n\n- `Device`: 返回包含 Cordova、model、platform、UUID\
  \ 和 version 的对象，例如，`Device.uuid`\n- `cordova`: 返回包含特定 Cordova 版本的字符串\n- `Model`:\
  \ 返回包含设备型号名称的字符串\n- `platform`: 返回包含操作系统名称的字符串\n- `uuid`: 返回包含设备的 **通用唯一标识符** (**UUID**)\
  \ 的字符串\n- `version`: 返回包含操作系统版本的字符串\n- `isVirtual`: 检查设备是否在模拟器上运行\n- `serial`: 获取硬件序列号\n\
  - `manufacturer`: 获取设备的制造商\n\n```typescript\nimport { Device } from '@ionic-native/device';\n\
  \nconstructor(platform: Platform, private device: Device)\n{\n  this.platform.ready().then(()\
  \ => {\n    console.log(this.device.version);\n  });\n}\n```\n\n## 启动画面插件\n\n启动画面插件用于在应用程序启动时显示和隐藏启动画面。使用\
  \ Ionic 应用程序时，您将获得默认的 Ionic 启动画面。您可以使用 Ionic CLI 命令 Ionic resources 在向相应资源文件夹添加新屏幕后轻松更改它。\n\
  \n启动画面由 Ionic Native 支持，它有两个方法：\n\n- `this.splashScreen.show()`: 显示启动画面\n- `this.splashScreen.hide()`:\
  \ 隐藏启动画面\n\nURL blocked by whitelist: http://maps.google.com\n\n```xml\n<access\
  \ origin=\"*\" /> // Allow all URLs\n```\n\n```xml\n<!-- Allow links to google.com\
  \ -->\n<allow-navigation href=\"http://google.com/*\" />\n\n<!-- Wildcards are allowed\
  \ for the protocol, as a\n     prefix to the host, or as a suffix to the path\n\
  \     example maps.google.com, mail.inbox.com -->\n<allow-navigation href=\"*://*.google.com/*\"\
  \ />\n```\n\n```xml\n<allow-intent href=\"http://*/*\" />\n<allow-intent href=\"\
  https://*/*\" />\n<allow-intent href=\"sms:*\" />\n<allow-intent href=\"tel:*\"\
  \ />\n\n<!-- Allow all unrecognized URLs to open installed apps\n     *NOT RECOMMENDED*\
  \ -->\n<allow-intent href=\"*\" />\n```\n\n\"No Content-Security-Policy meta tag\
  \ found. Please add one when using the cordova-plugin-whitelist plugin.\"\n\n```xml\n\
  <!-- Allow requests to gauravsaini.me -->\n<meta http-equiv=\"Content-Security-Policy\"\
  \ content=\"default-src 'self' gauravsaini.me\">\n\n<!-- Enable all requests, inline\
  \ styles, and eval() -->\n<meta http-equiv=\"Content-Security-Policy\" content=\"\
  default-src *; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'\
  \ 'unsafe-eval'\">\n\n<!-- Allow XHRs via https only -->\n<meta http-equiv=\"Content-Security-Policy\"\
  \ content=\"default-src 'self' https:\">\n\n<!-- Allow iframe to https://cordova.apache.org/\
  \ -->\n<meta http-equiv=\"Content-Security-Policy\" content=\"default-src 'self';\
  \ frame-src 'self' https://maps.google.com\">\n```\n\n```\n}});\n    console.log('Clicked\
  \ to update picture');\n  }\n}\n// src/pages/account/account.html\n\n<img alt=\"\
  profileImage\" [src]=\"base64Image\">\n```\n\n对于从图库获取图像，您可以将 sourceType 更改为 photolibrary。传递给\
  \ getPicture 方法的选项有多种。让我们检查一下我们可以使用的所有选项：\n\n- quality: 保存图像的质量，可以在 0-100 范围内或默认为\
  \ 50。\n- destinationType: DATA_URL(base64 编码)、FILE_URL(file URI) 和 NATIVE_URL。\n\
  - sourceType: photolibrary、camera 和 savephotoalbum。\n- allowEdit: 允许在选择图像前进行简单编辑。\n\
  - encodingType: JPEG 或 PNG。\n- targetWidth: 缩放图像的宽度（像素）。宽高比保持不变。（数字）\n- targetHeight:\
  \ 缩放图像的高度（像素）。宽高比保持不变。（数字）\n- mediaType: 要选择的媒体类型为 picture、video 或 all media，它仅在\
  \ PictureSourceType 为 photolibrary 或 savephotoalbum 时有效。\n- correctOrientation:\
  \ 在捕获期间旋转图像以校正设备的方向。（布尔值）\n- saveToPhotoAlbum: 在捕获后将图像保存到设备的照片库中。（布尔值）\n- popoverOptions:\
  \ iOS 专用选项，指定 iPad 上的弹出框位置。\n- cameraDirection: 选择使用的摄像头为前置或后置，默认为后置。\n\n在 destinationType\
  \ 为 FILE_URL 的情况下，要从临时存储中删除相机拍摄的照片，请使用以下代码：\n\n```\nthis.camera.cleanup().then(...);\
  \ // only for FILE_URI\n```\n\n通过更改 sourceType 从图库中选择的照片不会被降质，即使指定了 quality 参数也是如此。为了避免常见的内存问题，请将\
  \ camera.destinationType 设置为 FILE_URI 而不是 DATA_URL。\n\n## 地理位置插件\n\n地理位置插件利用设备的\
  \ **全球定位系统 (GPS)** 并获取位置信息，例如经度和纬度。它还尝试从其他来源获取设备位置，包括 Wi-Fi 网络和移动网络 IP 地址，尽管准确性不会很高。此插件由\
  \ Apache Cordova 官方支持，它有一个全局可访问的对象 `navigator.geolocation`，该对象同样需要在使用其功能时有 `deviceready`\
  \ 事件可用。\n\n让我们通过以下方式开始安装插件：\n\n```bash\n$ ionic cordova:plugin add cordova-plugin-geolocation\n\
  $ npm install @ionic-native/geolocation --save\n```\n\n此插件中主要有三个方法可用：\n\n- `getCurrentPosition`\n\
  - `watchPosition`\n- `clearWatch`\n\n`getCurrentPosition` 返回当前位置的位置：\n\n```javascript\n\
  let options = {\n  timeout :3000,\n  enableHighAccuracy: true,\n  maximumAge : 1000\n\
  };\n\nthis.geolocation.getCurrentPosition(options).then(( position) => {\n  // on\
  \ success\n  let coordinates = position.coords.latitude\n  +\",\"+position.coords.longitude\n\
  }).catch((err) => {\n  // on error\n  console.log(err.message);\n});\n```\n\n正如您从前面的示例中看到的，我们向\
  \ `getCurrentPosition()` 函数传递了选项。类似的选项也提供给 `watchPosition()` 函数。`watchPosition()`\
  \ 监视位置变化，当设备检索到新位置时，回调会使用包含最新位置数据的 position 对象执行：\n\n```javascript\nlet watchOptions\
  \ = {\n  timeout : 3000,\n  enableHighAccuracy: false // may cause errors if true\n\
  };\nlet watch = this.geolocation.watchPosition(watchOptions);\n\nwatch.subscribe((position)\
  \ => {\n  let lat = position.coords.latitude\n  let long = position.coords.longitude\n\
  });\n\n// Clearing the watch\nwatch.clearWatch()\n```\n\n**此外，我们可以轻松清除 watch 方法；这将停止监视设备位置的变化**\n\
  \n## 社交分享插件\n\n与社交媒体分享内容是推广应用程序及其内容的绝佳营销工具，有助于您获得新用户。因此，拥有一个分享插件将是我们应用程序的非常有益的功能。您可以使用此插件通过\
  \ Facebook、Twitter、电子邮件、SMS、WhatsApp 等分享图像、文本、消息。它使用 Native share 插件来分享内容，并会自动显示您设备上所有可用的分享选项：\n\
  \n```bash\n$ ionic cordova:plugin add cordova-plugin-x-socialsharing\n$ npm install\
  \ @ionic-native/social-sharing --save\n```\n\nSocialSharing 有多个方法可在我们的应用程序中使用。最常用的方法是\
  \ SocialSharing.share，它会打开默认的平台对话框，其中包含所有可用的分享应用程序：\n\n```typescript\n// src/pages/about/about.ts\n\
  \nimport { SocialSharing } from '@ionic-native/social-sharing';\n\nexport class\
  \ AboutPage {\n\n  constructor(public popoverCtrl: PopoverController, private socialSharing:\
  \ SocialSharing) { }\n\n  shareViaFacebook() {\n    // recommended to use canShareVia\
  \ before using shareVia\n    this.socialSharing.canShareVia(\"facebook\", \"Veloice:Intelligent\
  \ Business Telephony\", \"Real time Voice\", \"http://veloice.com/images/banner.png\"\
  ).then(() => {\n      this.socialSharing.shareViaFacebook(\"Veloice:Intelligent\
  \ Business Telephony\", \"http://veloice.com/images/banner.png\");\n    }).catch(()\
  \ => {\n      alert(\"Cannot share on Facebook\");\n    });\n  }\n\n  shareViaWhatsApp()\
  \ {\n    // recommended to use canShareVia before using shareVia\n    this.socialSharing.canShareVia(\"\
  whatsapp\", \"Veloice:Intelligent Business Telephony\", \"Real time Voice\", \"\
  http://veloice.com/images/banner.png\").then(() => {\n      this.socialSharing.shareViaWhatsApp(\"\
  Veloice:Intelligent Business Telephony\", \"http://veloice.com/images/banner.png\"\
  );\n    }).catch(() => {\n      alert(\"Cannot share on Whatsapp\");\n    });\n\
  \  }\n\n  shareViaEmail() {\n    // recommended to use canShareVia before using\
  \ shareVia\n    this.socialSharing.canShareViaEmail().then(() => {\n      this.socialSharing.shareViaEmail(\n\
  \        'Veloice:Intelligent Business Telephony', // Message\n        'Veloice',\
  \ // Email Subject\n        ['toperson@xyz.com', 'tosecond@xyz.com'], // TO: must\
  \ be null or an array\n        ['cc@xyz.com'], // CC: must be null or an array\n\
  \        null, // BCC: must be null or an array\n        ['http://veloice.com/images/banner.png']\
  \ // FILES: can be null, a string, or an array\n      );\n    }).catch(() => {\n\
  \      alert(\"Cannot share on Email\");\n    });\n  }\n\n  share() {\n    this.socialSharing.share(\"\
  Veloice:Intelligent Business Telephony\", \"Real time Voice\", \"http://veloice.com/images/banner.png\"\
  , \"http://veloice.com\");\n  }\n\n}\n```\n\n\n```html\n// src/pages/about/about.html\n\
  \n<ion-fab right bottom>\n  <button ion-fab><ion-icon name=\"help\"></ion-icon></button>\n\
  \  <ion-fab-list side=\"top\">\n    <button (click)=\"callNow()\" ion-fab><ion-icon\
  \ name=\"call\"></ion-icon></button>\n    <button (click)=\"shareViaEmail()\" ion-fab><ion-icon\
  \ name=\"mail\"></ion-icon></button>\n    <button (click)=\"shareViaFacebook()\"\
  \ ion-fab><ion-icon name=\"logo-facebook\"></ion-icon></button>\n    <button (click)=\"\
  shareViaWhatsApp()\" ion-fab><ion-icon name=\"logo-whatsapp\"></ion-icon></button>\n\
  \    <button (click)=\"share()\" ion-fab><ion-icon name=\"share\"></ion-icon></button>\n\
  \  </ion-fab-list>\n</ion-fab>\n```\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_189_0.png)\n\
  \n之前列出的是分享插件提供的所有方法。你可以在代码中看到，我们在使用的 `shareViaFacebook` 方法时，将其包裹在 `canShareVia`\
  \ 方法周围，以预先检查 Facebook 应用是否已安装。同样，我们也可以将其用于 Twitter、Instagram 和 WhatsApp。分享通过 SMS\
  \ 和电子邮件的示例也存在，因此我们也可以直接使用这些方法进行分享。分享插件还支持通过数组进行多张图片分享。`SaveToPhotoAlbum` 方法也在插件核心代码中可用，但到目前为止\
  \ Ionic Native 尚未为其提供任何包装器。因此你需要这样使用它：\n\n```javascript\nwindow.plugins.socialsharing.saveToPhotoAlbum(\n\
  \  ['http://veloice.com/icon.png', 'www/veloice.jpg'],\n  onSuccess, // optional\
  \ success function\n  onError // optional error function\n);\n```\n\n我们现在已经涵盖了一些最常用的插件。我们将继续查看需要详细示例的更复杂的插件，例如\
  \ Facebook 和 SQLite。我们的主要重点是继续紧密地坚持 Ionic Native 并充分利用它。\n\n```typescript\n// src/pages/about/about.ts\n\
  \nimport { CallNumber } from '@ionic-native/call-number';\n\nconstructor(private\
  \ call: CallNumber) { }\n\ncallNow() {\n  this.call.callNumber(\"+919989887765\"\
  , true)\n    .then(() => console.log('Launched dialer!'))\n    .catch(() => console.log('Error\
  \ launching dialer'));\n}\n```\n\n## Text to speech\n\n`text-to-speech` 插件的功能如其名，它将文本合成为语音。该插件在\
  \ iOS 上使用 `AVSpeechSynthesizer`，在 Android 上使用 `android.speech.tts.TextToSpeech`\
  \ 包。让我们开始安装 `cordova` 插件和相应的 `npm` 包：\n\n```bash\n$ ionic cordova:plugin add cordova-plugin-tts\n\
  $ npm install @ionic-native/text-to-speech --save\n```\n\n我们在应用程序中使用它来朗读 `push notification`\
  \ 消息，每当服务器发送 `push` 消息时：\n\n```typescript\n// src/app/app.component.ts\n\nimport\
  \ { TextToSpeech } from '@ionic-native/text-to-speech';\nconstructor(private tts:\
  \ TextToSpeech) { }\npush.on('notification', function(data) {\n  this.tts.speak({text:\
  \ data.message,\n    locale: 'en-GB', rate: 0.75})\n    .then(() => console.log('Success'))\n\
  \    .catch((reason: any) => console.log(reason));\n});\n```\n\n## AppRate\n\nAppRate\
  \ 插件用于提示用户现在、稍后或永不为应用评分。每个应用程序都需要此插件来获取客户的评论和评分：\n\n```bash\n$ ionic cordova:plugin\
  \ add cordova-plugin-apprate\n$ npm install @ionic-native/app-rate --save\n```\n\
  \nAppRate 集成起来非常容易，因为显示提示和其他设置的逻辑都由插件管理。我们只需要相应地设置首选项即可：\n\n```typescript\n// src/app/app.component.ts\n\
  \nimport { AppRate } from '@ionic-native/app-rate';\n\nplatformReady() {\n  // Call\
  \ any initial plugins when ready\n  this.platform.ready().then(() => {\n    Splashscreen.hide();\n\
  \n    if (this.platform.is('cordova')) {\n      // App rate plugin\n      AppRate.preferences.customLocale\
  \ = {\n        title: \"Rate vPlanet Commerce\",\n        message: \"Would you mind\
  \ taking a moment to rate it? It won't take more than a minute. Thanks for your\
  \ support!\",\n        cancelButtonLabel: \"No, Thanks\",\n        laterButtonLabel:\
  \ \"Remind Me Later\",\n        rateButtonLabel: \"Rate It Now\"\n      };\n   \
  \   AppRate.preferences.storeAppURL = {\n        android: 'market://details?id=com.vPlanetcommerce.demoionicpwa'\n\
  \      };\n      AppRate.promptForRating(false);\n\n      // Initiate Push\n   \
  \   this.initPushNotification();\n    }\n  });\n}\n```\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_194_0.png)\n\
  \n如果我们将 `promptForRating()` 设置为 false，则它不会立即提示。它将使用 `usesUntilPrompt` 首选项，该首选项在显示对话框之前计算应用程序的运行次数。你可以参考官方文档了解更多选项：https://ionicframework.com/docs/v2/native/app-rate/。\n\
  \n## Google Analytics\n\n分析是任何成功应用程序的关键；它有助于了解哪些屏幕访问量最大，哪些产品最受用户关注。我们可以跟踪用户在使用应用程序时所做的许多不同事件：\n\
  \n```bash\n$ ionic cordova:plugin add cordova-plugin-google-analytics\n$ npm install\
  \ @ionic-native/google-analytics --save\n```\n\n让我们首先在 `app.component.ts` 中初始化插件，在这里我们将设置\
  \ GoogleAnalytics 跟踪 ID，这将使我们开始：\n\n```typescript\n// src/app/app.component.ts\n\
  import { GoogleAnalytics } from '@ionic-native/google-analytics';\nconstructor(private\
  \ ga: GoogleAnalytics) { }\nplatformReady() {\n  // Call any initial plugins when\
  \ ready\n  this.platform.ready().then(() => {\n    Splashscreen.hide();\n\n    //\
  \ Google Analytics\n    return this.ga.startTrackerWithId(\"UA-92660667-1\")\n \
  \     .then(() => {\n        console.log('Google analytics is ready now');\n   \
  \     return this.ga.enableUncaughtExceptionReporting(true)\n      }).then((_success)\
  \ => {\n        console.log(\"startTrackerWithId success\")\n      }).catch((_error)\
  \ => {\n        console.log(\"enableUncaughtExceptionReporting\", _error)\n    \
  \  });\n  });\n}\n```\n\n下一步是将 Analytics 插件集成到页面中，以便我们可以跟踪活动：\n\n```typescript\n\
  // src/pages/home/home.ts\n\nimport { GoogleAnalytics } from '@ionic-native/google-analytics';\n\
  \nconstructor(public platform: Platform, private ga: GoogleAnalytics) {\n  this.platform.ready().then(()\
  \ => {\n    this.ga.trackView(\"Home Page\");\n  });\n}\n\ntrackEvent() {\n  let\
  \ active = this.slider.getActiveIndex();\n  this.platform.ready().then(() => {\n\
  \    this.ga.trackEvent(\"Slider\", \"Slider-Changed\", \"Label\", active);\n  });\n\
  }\n```\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_198_0.png)\n\n我们已初始化 `trackView()`\
  \ 方法并传入我们所在的特定页面名称。此外，如果有人手动更改滑块的幻灯片，我们也会跟踪事件。同样，我们可以在应用程序内跟踪购买的交易。还有多种方法可供根据需求使用。有关最新更新的方法，请查看插件的官方文档：[https://ionicframework.com/docs/v2/native/google-analytics/](https://ionicframework.com/docs/v2/native/google-analytics/)。\n\
  \n## Ionic deeplinks\n\nIonic deeplinks 插件处理 Android 和 iOS 的自定义 URL 方案和通用应用链接。我们需要确保不要将其与处理基于\
  \ URL 注册和显示视图的 deeplinker API 混淆。我们需要认为导航不是由 URL 控制的；它们主要用作面包屑。这在我们将 Ionic 应用转换为\
  \ PWA 时主要很有用，因为 Web 应用需要 URL 用于 SEO 和直接导航目的。\n\n我们将同时使用 deeplink 插件和 DeepLinker\
  \ API，分别用于在原生应用程序和 Web 应用程序中直接打开自定义 URL。让我们先看看如何安装 deeplink 插件：\n\n```bash\n$ ionic\
  \ cordova plugin add ionic-plugin-deeplinks --variable URL_SCHEME=vplanet --variable\
  \ DEEPLINK_SCHEME=https --variable DEEPLINK_HOST=vplanetcommerce.com --variable\
  \ ANDROID_PATH_PREFIX=/\n\n$ npm install @ionic-native/deeplinks --save\n```\n\n\
  我们使用 deeplink 插件和 DeepLinker API 在应用程序中分别用于在原生应用程序和 Web 应用程序中直接打开自定义 URL。让我们先看看如何安装\
  \ Deeplink 插件：\n\n```typescript\n// src/app/app.component.ts\nimport { Deeplinks\
  \ } from '@ionic-native/deeplinks';\nconstructor(private deeplinks: Deeplinks) {\
  \ }\nthis.platform.ready().then(() => {\n  Splashscreen.hide();\n\n  // Convenience\
  \ to route with a given nav\n  this.deeplinks.routeWithNavController(this.nav, {\n\
  \    '/about-us': AboutPage,\n    '/categories': CategoriesPage,\n    '/wishlist':\
  \ WishlistPage,\n    '/cart': ShowcartPage,\n    '/login': LoginPage,\n    '/settings':\
  \ SettingsPage,\n    '/categories/:categoryId': ProductsPage,\n    '/products/:productId':\
  \ ProductDetailPage\n  }).subscribe((match) => {\n    // match.$route - the route\
  \ we matched\n    // match.$args - the args passed in the link\n    // match.$link\
  \ - the full link data\n    console.log('Successfully routed', match);\n  }, (nomatch)\
  \ => {\n    console.warn('Unmatched Route', nomatch);\n  });\n})\n```\n\n让我们看看如何为\
  \ Web 应用程序配置 `DeepLinkConfig`。如前所述，这些只是用作面包屑，尽管使用相同的 `NavController` 实例 `push` 和\
  \ `pop` 操作在应用程序内部进行导航：\n\n```typescript\n// src/app/app.module.ts\n\nimport { IonicApp,\
  \ IonicModule, IonicErrorHandler, DeepLinkConfig } from 'ionic-angular';\nimport\
  \ { APP_BASE_HREF } from '@angular/common';\n\nimports: [\n  IonicModule.forRoot(vPlanetApp,\
  \ {locationStrategy: 'hash'}, deepLinkConfig),\n  Ionic2RatingModule,\n  TranslateModule.forRoot({\n\
  ```\n\n\n\n\n\n```\nprovide: TranslateLoader,\nuseFactory: createTranslateLoader,\n\
  deps: [Http]\n})\n],\nproviders: [\n{ provide: ErrorHandler, useClass: IonicErrorHandler},\n\
  { provide: Storage, useFactory: provideStorage },\n{ provide: APP_BASE_HREF, useValue:\
  \ '/'},\nUserService,\nDataService\n]\n\n// Deeplink Configuration\nexport const\
  \ deepLinkConfig: DeepLinkConfig = {\nlinks: [\n{ component: HomePage, name: 'Home\
  \ Page', segment: '' },\n{ component: CategoriesPage, name: 'Categories Page', segment:\
  \ 'categories' },\n{ component: ProductsPage, name: 'Categories Product Page', segment:\
  \ 'categories/:categoryId' },\n{ component: ProductDetailPage, name: 'Product Details\
  \ Page', segment: 'products/:productId' },\n{ component: WishlistPage, name: 'Wishlist\
  \ Page', segment: 'wishlist' },\n{ component: ShowcartPage, name: 'Showcart Page',\
  \ segment: 'cart' },\n{ component: SupportPage, name: 'Support Page', segment: 'feedback'\
  \ },\n{ component: SettingsPage, name: 'About Page', segment: 'settings' },\n{ component:\
  \ AboutPage, name: 'About Page', segment: 'about' },\n{ component: LoginPage, name:\
  \ 'Login Page', segment: 'login' },\n{ component: SignupPage, name: 'Signup Page',\
  \ segment: 'signup' },\n{ component: AccountPage, name: 'Account Page', segment:\
  \ 'account' }\n]\n};\n```\n\n现在，类似于你用唯一 URL 打开特定链接的方式，你也可以通过自定义 URL 方案访问特定视图。这样我们的应用程序就可以通过\
  \ vplanet://wishlist 访问，它将直接打开应用程序的 wishlistPage。\n\n## Facebook 连接\n\nFacebook\
  \ 插件是社交集成中最受欢迎且使用最广泛的插件之一。借助 Ionic Native 和改进的文档，现在在你的应用程序中集成 Facebook Connect 插件变得非常容易。Facebook\
  \ 插件允许你在 Cordova 应用程序中使用与在 Web 应用程序中相同的 JavaScript 代码。该插件最好的地方在于它使用原生的 Facebook\
  \ 应用为用户执行单点登录。如果未安装 Facebook 原生应用，则登录会优雅地降级为使用标准对话框式身份验证。目前该插件仅支持 iOS 和 Android。在安装此插件之前，你需要通过\
  \ developers.facebook.com 创建一个 Facebook 应用，然后复制 appId 和 appName，在添加插件时需要用到：\n\n\
  ![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_203_0.png)\n\n我们现在准备为 Facebook 安装插件，该插件需要\
  \ APP_ID 和 APP_NAME：\n\n```\n$ ionic cordova:plugin add cordova-plugin-facebook4\
  \ --variable APP_ID=\"419376571536241\" --variable APP_NAME=\"chatApp\"\n```\n\n\
  除此之外，还需要对特定平台进行一系列需求检查。对于 Android，你需要在 res/values/facebookconnect.xml 文件中用你的 fb_app_id\
  \ 配置项目：\n\n```\n<resources>\n    <string name=\"fb_app_id\">419376571536241</string>\n\
  \    <string name=\"fb_app_name\">chatApp</string>\n</resources>\n```\n\n对于 iOS，你需要更改以下内容：\n\
  \n- 将 FacebookAppID 更改为项目 Info.plist\n- 将 URL 方案更改为 fb<YOUR APPID>：例如，fb 419376571536241\n\
  \n你现在就可以使用 $cordovaFacebook 模块提供的 Facebook 插件方法了。以下是我们使用 Ionic Native 提供的一些方法：\n\
  \n- login(permissions): 一个字符串数组，例如 ['public_profile', 'email']\n- showDialog(options):\
  \ 一个包含三个键的 JSON 对象；method、link 和 caption\n- api(path, permissions): 一个 Facebook\
  \ API 路径查询，例如 api(\"me\", [\"public_profile\"])\n- getLoginStatus(): 检查用户是否已登录\n\
  - getAccessToken(): 获取当前登录会话的访问令牌\n- logout(): 从 Facebook 注销\n\n要在浏览器中进行测试，你仍需要在应用程序配置中做一些更改：\n\
  \n```\nlet appID = 419376571536241;\nlet version = \"v2.0\"; // 或留空，默认是 v2.0\n\n\
  constructor() {\n  Facebook.browserInit(appID, version);\n}\n```\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_204_0.png)\n\
  \n此外，你还必须设置重定向 URL，其外观如下。由于 Ionic 服务器运行在 8100 端口，你可以给出 http://localhost:8100 作为重定向\
  \ URL：\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_204_1.png)\n\n## 构建音乐播放器\n\n\
  我们现在将构建一个媒体播放器应用程序，其中你将拥有音频和视频流以及下载选项，将文件保存到你的手机。我们将主要集成用于通过 `ionic-audio` 包进行音频流的媒体插件，使用\
  \ `StreamingMedia` 插件播放视频，并使用 `FileTransfer` 插件将文件下载到本地系统目录。让我们先创建一个应用程序\n\n```\n\
  gaurav@gaurav-thinkpad:~/projects$ ionic start jingle-app tabs --v2\nCreating an\
  \ Ionic 2.x app in /home/gaurav/projects/jingle-app based on the tabs template.\n\
  \nDownloading: https://github.com/driftyco/ionic2-app-base/archive/master.zip\n\
  Downloading: https://github.com/driftyco/ionic2-starter-tabs/archive/master.zip\n\
  Installing npm packages (may take a minute or two)...\n\n♫♫♫♫ Your Ionic app is\
  \ ready to go! ♫♫♫♫♫\n\nSome helpful tips:\n\nRun your app in the browser (great\
  \ for initial development):\n  ionic serve\n\nRun on a device or simulator:\n  ionic\
  \ run [android,browser]\n\nShare your app with testers, and test on device easily\
  \ with the Ionic View companion app:\n  http://view.ionic.io\ngaurav@gaurav-thinkpad:~/projects$\n\
  ```\n\n我们将使用 tabs 模板：\n\n我们只需要添加 **ionic platform add android** 平台，我们就可以准备好集成插件并构建我们的\
  \ jingle 应用程序。\n\n## 媒体、流媒体和传输插件\n\n我们将从一个简单的音乐播放器应用程序开始，它将演示不同插件的使用，但这里的可能性是无穷无尽的。你可能会考虑构建一个音乐推荐应用程序，根据你的输入、情绪或其他因素播放音乐，尽管为此你需要准备一个良好的后端应用程序来支持推荐。正如我们已经决定了应用程序的主要功能，我们现在需要主要安装三个\
  \ Cordova 插件，我们现在就安装它们：\n\n```\n$ ionic cordova:plugin add cordova-plugin-media\n\
  $ ionic cordova:plugin add cordova-plugin-file-transfer\n$ ionic cordova:plugin\
  \ add cordova-plugin-streaming-media\n```\n\n下一步将是安装它们各自的 NPM 包和 ionic-audio 模块，我们将用于音频播放器：\n\
  \n```\n$ npm install @ionic-native/media @ionic-native/filetransfer @ionic-native/streaming-media\
  \ ionic-audio --save\n```\n\n让我们集成 ionic-audio 模块，该模块会根据环境自动在 WebAudioProvider 和\
  \ CordovaMediaProvider 之间切换，这在测试应用程序时非常有帮助，因为我们可以轻松地在浏览器本身中验证应用程序：\n\n```\n// src/app/app.module.ts\n\
  import { IonicAudioModule, AudioProvider, WebAudioProvider, audioProviderFactory\
  \ } from 'ionic-audio';\nimport { NgModule, ErrorHandler, CUSTOM_ELEMENTS_SCHEMA\
  \ } from '@angular/core';\nimport { IonicApp, IonicErrorHandler, IonicModule } from\
  \ 'ionic-angular';\n\n@NgModule({\n  imports: [\n    IonicModule.forRoot(MyApp),\n\
  \    IonicAudioModule.forRoot({ provide: AudioProvider,\n      useFactory: audioProviderFactory\
  \ })\n  ],\n  schemas: [ CUSTOM_ELEMENTS_SCHEMA ]\n})\n```\n\n我们有三个标签视图，HomePage、MusicPage\
  \ 和 VideoPage。音频播放器集成在 MusicPlayerPage 上。我们将注入 AudioProvider 来控制音频播放器及其功能：\n\n```\n\
  // app/pages/music-player/music-player\n\nimport { AudioProvider } from 'ionic-audio';\n\
  \nexport class MusicPlayerPage {\n\n  source: string;\n  img: string;\n  singleTrack:\
  \ any;\n  allTracks: any[];\n  selectedTrack: number;\n\n  constructor(\n    public\
  \ platform: Platform,\n    public navParams: NavParams,\n    public viewCtrl: ViewController,\n\
  \    private _audioProvider: AudioProvider) {\n```\n\n\n\n```\nthis.source = this.navParams.get('url');\n\
  this.img = this.navParams.get('img');\n\nthis.singleTrack = {\n  src: this.source,\n\
  \  artist: this.source.slice(25,-4),\n  title: this.source.slice(25,-4),\n  art:\
  \ this.img,\n  preload: 'metadata' // tell the plugin to preload metadata such as\
  \ duration for this track, set to 'none' to turn off\n};\n\nngAfterContentInit()\
  \ {\n  // get all tracks managed by AudioProvider so we can\n  // control playback\
  \ via the API\n  this.allTracks = this._audioProvider.tracks;\n}\n\nplaySelectedTrack()\
  \ {\n  // use AudioProvider to control selected track\n  this._audioProvider.play(this.selectedTrack);\n\
  }\n\npauseSelectedTrack() {\n  // use AudioProvider to control selected track\n\
  \  this._audioProvider.pause(this.selectedTrack);\n}\n\nonTrackFinished(track: any)\
  \ {\n  console.log('Track finished', track)\n}\n}\n\n// src/pages/music-player/music-player.html\n\
  \n<ion-content padding>\n  <ion-card>\n    <img [src]=\"img\"/>\n    <ion-card-content>\n\
  \      <ion-card-title>\n        {{ source | trimurl }}\n      </ion-card-title>\n\
  \n      <audio-track #track [track]=\"singleTrack\">\n        <ion-item [audioTrack]=\"\
  track\">\n          <ion-thumbnail item-left>\n            <img src=\"{{track.art}}\"\
  >\n            <audio-track-play light [audioTrack]=\"track\">\n              <ion-spinner></ion-spinner>\n\
  \            </audio-track-play>\n          </ion-thumbnail>\n\n          <div item-content\
  \ style=\"width:100%\">\n            <p><strong>{{track.title}}</strong> ◦ <em>{{track.artist}}</em></p>\n\
  \            <audio-track-progress-bar duration progress [audioTrack]=\"track\"\
  ></audio-track-progress-bar>\n            <em style=\"font-size:.5em\">Track ID:\
  \ {{track.id}}</em>\n          </div>\n        </ion-item>\n      </audio-track>\n\
  \    </ion-card-content>\n  </ion-card>\n</ion-content>\n```\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_210_0.png)\n\
  \n我们为 `ionic-audio` 插件添加了一个相应的组件。接下来，我们将能够通过 `FileTransfer` 插件下载歌曲：\n\n```\n// src/pages/music/music.ts\n\
  import { Transfer, TransferObject } from '@ionic-native/filetransfer';\n\ndeclare\
  \ var cordova: any;\n\n@Component({\n  selector: 'page-music',\n  templateUrl: 'music.html'\n\
  })\nexport class MusicPage {\n\n  constructor(private transfer: Transfer);\n\n \
  \ download(song) {\n    const fileTransfer: TransferObject = this.transfer.create();\n\
  \    let url = song.url;\n\n    fileTransfer.download(url,\n      cordova.file.externalRootDirectory\
  \ +\n      song.name).then((entry) => {\n      alert('download complete: ' + entry.toURL());\n\
  \    }, (error) => {\n      // handle error\n    });\n  }\n}\n```\n\n请确保在 `@Component`\
  \ 装饰器之前声明 `cordova` 变量。此外，我们需要创建一个 `Transfer()` 方法的实例，然后将 URL 和路径传递给它，它将在此路径下保存文件。目前我们设置了\
  \ `rootDirectory` 作为文件保存的位置。\n\n接下来，我们将使用 Streaming 插件在应用程序内播放视频。Streaming 插件使用原生媒体播放器，它非常流畅，而不是在\
  \ `HTMLAudioElement` 内播放：\n\n```\n// src/pages/video-player/video-player\nimport\
  \ { Component } from '@angular/core';\nimport { NavController, NavParams } from\
  \ 'ionic-angular';\nimport { StreamingMedia, StreamingVideoOptions } from '@ionic-native/streaming-media';\n\
  \n@Component({\n  selector: 'page-video-player',\n  templateUrl: 'video-player.html'\n\
  })\n\nexport class VideoPlayerPage {\n\n  source: string;\n\n  constructor(public\
  \ navCtrl: NavController, public navParams: NavParams) {\n\n    this.source = this.navParams.get('url');\n\
  \n    // Playing a video.\n    let options: StreamingVideoOptions = {\n      successCallback:\
  \ () => { console.log('Video played') },\n      errorCallback: (e) => { console.log('Error\
  \ streaming') },\n      orientation: 'landscape'\n    };\n\n    StreamingMedia.playVideo(this.source,\
  \ options);\n  }\n\n  ionViewDidLoad() {\n    console.log('ionViewDidLoad VideoPlayerPage');\n\
  \  }\n\n}\n```\n\n我们可以进一步扩展音乐播放器，增加更多功能，例如将歌曲添加为收藏、创建播放列表，甚至添加音乐控制插件，该插件将显示带有播放/暂停、上一首和下一首操作的媒体通知。随着\
  \ Cordova 插件的快速发展，可用的可能性是无限的。\n\n到目前为止，我们主要关注的是 Ionic Native 封装器提供的功能，而不是官方插件。这样做是为了利用开发以及与现有\
  \ Ionic 应用程序集成的便利性。我建议大家都查阅官方插件文档，以查看任何新的改进和变化。此外，有时官方仓库的位置可能会发生变化，所以这样我们总能保持更新。Ionic\
  \ 框架发布后，混合开发一直在稳步发展，Cordova 插件的开发也是如此，因此最好始终查看官方插件文档以了解新功能。\n\n## Cordova 与 phonegap\n\
  \n关于 Cordova 和 phonegap，一直存在很多困惑和疑问。此外，许多人询问在 Ionic 中应该使用哪一个。虽然 Ionic 使用 Cordova，但我们肯定也可以使用\
  \ phonegap。许多人仍然不了解 Cordova，因为 phonegap 早于 Cordova 出现。让我们快速回顾一下它的历史：phonegap 是由\
  \ Nitobi 于 2009 年创建的。后来在 2011 年，Adobe 收购了 Nitobi 以及 phonegap 平台的权利。该平台的开源核心代码被捐赠给\
  \ Apache 组织以进行进一步开发。phonegap 也是免费且开源的。起初，Cordova 和 phonegap 之间几乎没有区别，但慢慢地 Adobe\
  \ 开始在 phonegap 周围构建一套专有服务。PhoneGap Build 就是这些服务之一。Cordova 是驱动 phonegap 的引擎，类似于 webkit\
  \ 是 Chrome 浏览器的引擎。关于使用哪个平台一直存在长期争论，开发者之间也存在利益冲突。许多人批评 phonegap 是 Cordova 的修补版本，只是利用\
  \ phonegap 的远程构建等功能。最终，这与 Ionic 无关，并且独立于这场争论。作为开发者，你可以自由使用其中任何一个。\n\n如果你仍然想使用 phonegap\
  \ 并利用其内置服务，那么在使用 phonegap 构建项目时可以轻松选择它。Ionic CLI 命令使用 Cordova，因此你需要安装和使用 Cordova。\n\
  \n## 总结\n\nCordova 插件将不断演进，我们需要确保跟上所引入的最新功能。随着 Ionic 进入市场，过去几年混合应用程序和插件的开发显著增加。这是因为更多人对其感兴趣，并且为了跟上最新技术，开发者开发了许多自定义插件。一个类似例子是蓝牙信标，以及开发者为了支持其不同格式而开发的多个插件。我们现在已经涵盖了插件开发，这是开发复杂混合应用程序的另一个重要方面。我们现在可以利用插件的力量来构建需要访问原生\
  \ API 的高级混合应用程序。在本章稍后部分，我们继续介绍了许多 Ionic CLI 命令，这些命令帮助我们快速开发和调试应用程序。Ionic CLI 日新月异，许多新功能和任务即将推出。我们都应该定期更新\
  \ Ionic CLI 并查看新功能，以便在下一个应用程序中加以利用。\n\n在第4章，*Ionic 平台与服务*中，我们将介绍 Ionic 服务和工具。在过去两年中，Ionic\
  \ 发展了很多，Ionic 团队构建了非常实用的工具，加速了开发时间。Ionic CLI 是最常用和最重要的工具之一。Ionic 作为一个平台提供 Ionic\
  \ Push、Ionic Deploy、Ionic Analytics 和 Ionic Lab，以及 Creator 和 Playground 帮助快速构建原型。Ionic\
  \ 团队正在非常努力地为我们带来所有这些很棒的东西，帮助我们为用户创新应用程序。\n\n\n\n"
- "# Ionic 平台和服务\n\n到目前为止，我们已经查看了构建企业级应用几乎所有的关键组件。Ionic 平台是一套精美的工具和服务，能加快开发流程并将构建、测试、调试和部署应用等一切工作流线化到单一平台上。随着\
  \ Ionic 团队持续改进 Ionic 平台和工具，你在不久的将来会看到更多内容。我们将涵盖 Ionic 提供的几乎所有服务和工具，以便你能利用你的项目：\n\
  \n- Ionic Cloud\n- Ionic Auth\n- Ionic DB\n- Ionic push\n- Ionic deploy\n- Ionic\
  \ package\n- Ionic View, Creator, and Playground\n\n## Ionic Cloud\n\nIonic 最初是一个名为\
  \ Ionic framework 的框架，现在随着 Ionic.io 和相关工具与服务的推出，它已成为一个完整的平台。Ionic.io 或 Ionic Cloud\
  \ Platform 提供了丰富且专注于混合应用的后端服务和工具，使开发过程更轻松，并帮助以快速的速度构建企业级应用。目前 Ionic 平台已脱离 beta 阶段，他们已在一些付费订阅模式下推出服务，这是维持和为\
  \ Ionic 团队产生收入所必需的。但 Ionic framework 将始终保持开源；只是后端服务会有一些定价计划。开始使用 Ionic 平台非常简单，只需注册一个账户即可。之后，你将能够共享、上传并使用平台提供的所有其他服务。\n\
  \n### 安装 Ionic Cloud\n\n设置 Ionic Cloud 非常简单；我们需要安装 Ionic Cloud npm 包并关联 Ionic 账户，这只是使用\
  \ Ionic 服务所必需的。我们将把云服务集成到我们现有的 vPlanet-commerce 应用中。最近，Ionic CLI v3 已推出，目前处于 beta\
  \ 阶段，它改变了很多东西并更改了命令：\n\n```bash\n$ npm install @ionic/cloud-angular --save\n$ ionic\
  \ login\n$ ionic link\n```\n\n> 请务必不要混淆 Ionic CLI v3 和 Ionic v3，它们完全不同。Ionic CLI\
  \ 包含用于开发 Ionic 应用的主要工具。\n\n**要将基于 Ionic 2 或 3 的项目更新为与 Ionic CLI v3 兼容，我们必须运行以下命令。**\n\
  \n```bash\n$ npm install --save-dev @ionic/cli-build-ionic-angular@beta @ionic/cli-plugin-cordova@beta\n\
  ```\n\n现在，当你将项目链接到现有项目或创建新项目时，请确保你已登录到 Ionic Cloud，它会要求输入 Ionic 账户的用户名和密码，你可能已在\
  \ `ionic.io` 创建。之后你可以将你的快照上传到 Ionic Cloud。\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_221_0.png)\n\
  \n下一步是在我们的 `app.module.ts` 中导入 `cloudSettings`：\n\n```typescript\n// src/app/app.module.ts\n\
  \nimport { CloudSettings, CloudModule } from '@ionic/cloud-angular';\n\nconst cloudSettings:\
  \ CloudSettings = {\n  'core': {\n    'app_id': 'f8fec798'\n  }\n};\n\n@NgModule({\n\
  \  declarations: [ ... ],\n  imports: [\n    IonicModule.forRoot(vPlanetApp),\n\
  \    Ionic2RatingModule,\n    TranslateModule.forRoot({\n      provide: TranslateLoader,\n\
  \      useFactory: createTranslateLoader,\n      deps: [Http]\n    }),\n    CloudModule.forRoot(cloudSettings)\n\
  \  ],\n  bootstrap: [IonicApp],\n  entryComponents: [ ... ],\n  providers: [ ...\
  \ ]\n})\n```\n\n我们现在已成功将 vPlanet-Commerce 应用上传到 ionic.io。我们现在准备开始使用 Ionic 服务，例如\
  \ Push、Deploy、DB 等。你可以在 Dashboard (https://apps.ionic.io/apps) 上找到所有你的应用：\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_222_0.png)\n\
  \n你可以在 Settings 选项卡内找到有关应用的所有信息。点击你的特定项目后，你将能够看到有关特定项目的详细信息。目前，我们的 vPlanet-Commerce\
  \ 应用使用的是免费计划，提供约 5000 次部署、10,000 条推送通知和 100 次包构建。你可以随时升级计划，当你看到应用用户增加且流量增长时。最好的地方在于，我们将从用于用户登录和注册流程的\
  \ Auth 开始，集成每一个 Ionic Cloud 服务。Ionic DB 作为我们的应用数据库、推送通知、Package 和 Deploy：\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_222_1.png)\n\
  \n另外，还有一个重要点需要注意，当你完成 Ionic Cloud 的设置后，你会在 .io-config.json 中找到 app_id 和 api_key，而一些其他应用详情则在\
  \ ionic.config.json 中：\n\n```json\n// .io-config.json\n{\"app_id\":\"f8fec798\"\
  , \"api_key\":\"5b22exxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx68e\"}\n\n// ionic.config.json\n\
  {\n  \"name\": \"vplanet-commerce\",\n  \"app_id\": \"f8fec798\",\n  \"v2\": true,\n\
  \  \"typescript\": true\n}\n```\n\n完成本章后，你将几乎处于书籍的中段，在 halfway 你现在就能使用 Ionic 构建应用、集成各种\
  \ Ionic 组件、Cordova 插件并能够集成 Ionic Cloud 服务，最后将应用部署到 Play Store。\n\n```typescript\n\
  }\n}\n\nshowToast(response_message:any) {\n    let toast = this.toastCtrl.create({\n\
  \        message: (response_message ? response_message : \"Log In Successfully\"\
  ),\n        duration: 1500\n    });\n    toast.present();\n}\n\nonSignup() {\n \
  \   this.navCtrl.push(SignupPage);\n}\n}\n```\n\n我们已将其与一个登录表单集成，该表单以对象形式获取数据，我们将其传递给\
  \ this.auth.login() 方法，如前面的代码所示。这将返回 token 和各种其他数据，默认情况下存储在本地存储中。在下面的截图中，你可以看到主要保存了三个键/值对，ionic_auth、ionic_insights_session\
  \ 和 ionic_user：\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_226_0.png)\n\n接下来，我们将其与一个登录表单集成，该表单以对象形式获取数据，我们将其传递给\
  \ this.auth.login() 方法，如前面的代码所示。这将返回 token 和各种其他数据，默认情况下存储在 Local Storage 中。在前面的截图中，你可以看到主要三个键/值对。用户数据主要存储在\
  \ ionic_user 中，你会在其中找到用户名、电子邮件和其他详细信息。现在让我们看看如何在我们的应用中注册新用户。我们将在 SignupPage 中集成它：\n\
  \n```typescript\n// src/pages/signup/signup.ts\n\nimport { Component } from '@angular/core';\n\
  import { NgForm } from '@angular/forms';\nimport { NavController } from 'ionic-angular';\n\
  import { LoginPage } from '../login/login';\nimport { Auth, UserDetails, IDetailedError\
  \ } from '@ionic/cloud-angular';\n\n@Component({\n    selector: 'page-user',\n \
  \   templateUrl: 'signup.html'\n})\nexport class SignupPage {\n\n    signup: {name?:\
  \ string, email?: string, password?: string} = {};\n\n    details: UserDetails =\
  \ {\n        \"name\": this.signup.name,\n        \"email\": this.signup.email,\n\
  \        \"password\": this.signup.password\n    };\n\n    submitted = false;\n\n\
  \    constructor(\n        public navCtrl: NavController,\n        public userService:\
