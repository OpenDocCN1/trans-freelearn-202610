    # # Introduction to Firebase and TasteBite apps


    Getting started with Firebase is really simple; that is the main reason many startups
    and growing products use all these Backend as a Service platforms like Firebase.
    We will quickly start by creating a TasteBite application with Firebase and Ionic.
    In this application we integrated an AngularFire2 wrapper for Angular applications
    using Firebase, although, we can simply use the Javascript SDK also inside our
    application. You need to create an account at Firebase (initially you can have
    a free account; as your consumption increases you can upgrade your account easily).


    Firebase has made the life of developers easier as they don''t have to spend time
    building backend server to build simple APIs. We can easily do all CRUD operations
    with minimum effort and with Web socket supports it''s super fast in syncing data.
    Also, Firebase offers offline sync, user authentication, and features for securing
    the data with sets of rules:


    ![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_297_0.png)


    As, soon as you create an account you create an app inside Firebase; you will
    find an option to add a project. After you add/create a project you can now manage
    and enter your applications. You will see many options such as Analytics, Authentication,
    Database, Storage, Hosting, Notification and many other options. We will use many
    of them in our application as we move forward creating data for our application.
    You can already see in the following screenshot that we have some data stored
    in our application. All Firebase database data is store as JSON objects and no
    relational tables exist.'
