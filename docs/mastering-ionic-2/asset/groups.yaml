  mdcn: "\n\n## Ionic 平台和服务\n\n到目前为止，我们已经查看了构建企业级应用几乎所有的关键组件。Ionic 平台是一套精美的工具和服务，能加快开发流程并将构建、测试、调试和部署应用等一切工作流线化到单一平台上。随着\
    \ Ionic 团队持续改进 Ionic 平台和工具，你在不久的将来会看到更多内容。我们将涵盖 Ionic 提供的几乎所有服务和工具，以便你能利用你的项目：\n\
    \n- Ionic Cloud\n- Ionic Auth\n- Ionic DB\n- Ionic push\n- Ionic deploy\n- Ionic\
    \ package\n- Ionic View, Creator, and Playground\n\n## Ionic Cloud\n\nIonic 最初是一个名为\
    \ Ionic framework 的框架，现在随着 Ionic.io 和相关工具与服务的推出，它已成为一个完整的平台。Ionic.io 或 Ionic Cloud\
    \ Platform 提供了丰富且专注于混合应用的后端服务和工具，使开发过程更轻松，并帮助以快速的速度构建企业级应用。目前 Ionic 平台已脱离 beta\
    \ 阶段，他们已在一些付费订阅模式下推出服务，这是维持和为 Ionic 团队产生收入所必需的。但 Ionic framework 将始终保持开源；只是后端服务会有一些定价计划。开始使用\
    \ Ionic 平台非常简单，只需注册一个账户即可。之后，你将能够共享、上传并使用平台提供的所有其他服务。\n\n## 安装 Ionic Cloud\n\n\
    设置 Ionic Cloud 非常简单；我们需要安装 Ionic Cloud npm 包并关联 Ionic 账户，这只是使用 Ionic 服务所必需的。我们将把云服务集成到我们现有的\
    \ vPlanet-commerce 应用中。最近，Ionic CLI v3 已推出，目前处于 beta 阶段，它改变了很多东西并更改了命令：\n\n```bash\n\
    $ npm install @ionic/cloud-angular --save\n$ ionic login\n$ ionic link\n```\n\n\
    > 请务必不要混淆 Ionic CLI v3 和 Ionic v3，它们完全不同。Ionic CLI 包含用于开发 Ionic 应用的主要工具。\n\n**要将基于\
    \ Ionic 2 或 3 的项目更新为与 Ionic CLI v3 兼容，我们必须运行以下命令。**\n\n```bash\n$ npm install\
    \ --save-dev @ionic/cli-build-ionic-angular@beta @ionic/cli-plugin-cordova@beta\n\
    ```\n\n现在，当你将项目链接到现有项目或创建新项目时，请确保你已登录到 Ionic Cloud，它会要求输入 Ionic 账户的用户名和密码，你可能已在\
    \ `ionic.io` 创建。之后你可以将你的快照上传到 Ionic Cloud。\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_221_0.png)\n\
    \n下一步是在我们的 `app.module.ts` 中导入 `cloudSettings`：\n\n```typescript\n// src/app/app.module.ts\n\
    \nimport { CloudSettings, CloudModule } from '@ionic/cloud-angular';\n\nconst\
    \ cloudSettings: CloudSettings = {\n  'core': {\n    'app_id': 'f8fec798'\n  }\n\
    };\n\n@NgModule({\n  declarations: [ ... ],\n  imports: [\n    IonicModule.forRoot(vPlanetApp),\n\
    \    Ionic2RatingModule,\n    TranslateModule.forRoot({\n      provide: TranslateLoader,\n\
    \      useFactory: createTranslateLoader,\n      deps: [Http]\n    }),\n    CloudModule.forRoot(cloudSettings)\n\
    \  ],\n  bootstrap: [IonicApp],\n  entryComponents: [ ... ],\n  providers: [ ...\
    \ ]\n})\n```\n\n我们现在已成功将 vPlanet-Commerce 应用上传到 ionic.io。我们现在准备开始使用 Ionic 服务，例如\
    \ Push、Deploy、DB 等。你可以在 Dashboard (https://apps.ionic.io/apps) 上找到所有你的应用：\n\n\
    ![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_222_0.png)\n\n你可以在 Settings 选项卡内找到有关应用的所有信息。点击你的特定项目后，你将能够看到有关特定项目的详细信息。目前，我们的\
    \ vPlanet-Commerce 应用使用的是免费计划，提供约 5000 次部署、10,000 条推送通知和 100 次包构建。你可以随时升级计划，当你看到应用用户增加且流量增长时。最好的地方在于，我们将从用于用户登录和注册流程的\
    \ Auth 开始，集成每一个 Ionic Cloud 服务。Ionic DB 作为我们的应用数据库、推送通知、Package 和 Deploy：\n\n\
    ![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_222_1.png)\n\n另外，还有一个重要点需要注意，当你完成 Ionic\
    \ Cloud 的设置后，你会在 .io-config.json 中找到 app_id 和 api_key，而一些其他应用详情则在 ionic.config.json\
    \ 中：\n\n```json\n// .io-config.json\n{\"app_id\":\"f8fec798\", \"api_key\":\"\
    5b22exxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx68e\"}\n\n// ionic.config.json\n{\n  \"name\"\
    : \"vplanet-commerce\",\n  \"app_id\": \"f8fec798\",\n  \"v2\": true,\n  \"typescript\"\
    : true\n}\n```\n\n完成本章后，你将几乎处于书籍的中段，在 halfway 你现在就能使用 Ionic 构建应用、集成各种 Ionic 组件、Cordova\
    \ 插件并能够集成 Ionic Cloud 服务，最后将应用部署到 Play Store。\n\n```typescript\n}\n}\n\nshowToast(response_message:any)\
    \ {\n    let toast = this.toastCtrl.create({\n        message: (response_message\
    \ ? response_message : \"Log In Successfully\"),\n        duration: 1500\n   \
    \ });\n    toast.present();\n}\n\nonSignup() {\n    this.navCtrl.push(SignupPage);\n\
    }\n}\n```\n\n我们已将其与一个登录表单集成，该表单以对象形式获取数据，我们将其传递给 this.auth.login() 方法，如前面的代码所示。这将返回\
    \ token 和各种其他数据，默认情况下存储在本地存储中。在下面的截图中，你可以看到主要保存了三个键/值对，ionic_auth、ionic_insights_session\
    \ 和 ionic_user：\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_226_0.png)\n\n接下来，我们将其与一个登录表单集成，该表单以对象形式获取数据，我们将其传递给\
    \ this.auth.login() 方法，如前面的代码所示。这将返回 token 和各种其他数据，默认情况下存储在 Local Storage 中。在前面的截图中，你可以看到主要三个键/值对。用户数据主要存储在\
    \ ionic_user 中，你会在其中找到用户名、电子邮件和其他详细信息。现在让我们看看如何在我们的应用中注册新用户。我们将在 SignupPage 中集成它：\n\
    \n```typescript\n// src/pages/signup/signup.ts\n\nimport { Component } from '@angular/core';\n\
    import { NgForm } from '@angular/forms';\nimport { NavController } from 'ionic-angular';\n\
    import { LoginPage } from '../login/login';\nimport { Auth, UserDetails, IDetailedError\
    \ } from '@ionic/cloud-angular';\n\n@Component({\n    selector: 'page-user',\n\
    \    templateUrl: 'signup.html'\n})\nexport class SignupPage {\n\n    signup:\
    \ {name?: string, email?: string, password?: string} = {};\n\n    details: UserDetails\
    \ = {\n        \"name\": this.signup.name,\n        \"email\": this.signup.email,\n\
    \        \"password\": this.signup.password\n    };\n\n    submitted = false;\n\
    \n    constructor(\n        public navCtrl: NavController,\n        public userService:\
    \ UserService,\n        public auth: Auth) {}\n\n    onSignup(form: NgForm) {\n\
    \        this.submitted = true;\n\n        if (form.valid) {\n            // registering\
    \ new user\n            this.auth.signup(this.signup).then(() => {\n         \
    \       // user is now registered\n                this.navCtrl.push(LoginPage);\n\
    \            }, (err: DetailedError<string[]>) => {\n                for (let\
    \ e of err.details) {\n                    if (e === 'conflict_email') {\n   \
    \                     alert('Email already exists.');\n                    } else\
    \ {\n                        // handle other errors\n                    }\n \
    \               }\n            });\n        }\n    }\n}\n```\n"
