    \  const tag = 'simple-push-demo-notification-tag';\nevent.waitUntil(\n  self.registration.showNotification(title,\
    \ {\n    body: body,\n    icon: icon,\n    tag: tag\n  })\n);\n```\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_370_0.png)\n\
    \nWe need to request for permission also, which we will be asking in `application.component.ts`\
    \ initially. This will prompt a popup asking to send notifications and as soon\
    \ as you allow it you are now ready to receive push notifications:\n\n```typescript\n\
    // src/application/application.component.ts\n\nNotification.requestPermission().then(function(result)\
    \ {\n  if (result === 'denied') {\n    console.log('Permission wasn\\'t granted.\
    \ Allow a retry.');\n    return;\n  }\n  if (result === 'default') {\n    console.log('The\
    \ permission request was dismissed.');\n    return;\n  }\n});\n```\n\nFor demonstration\
    \ of web push notifications, we will be using curl requests, which need the endpoint,\
    \ which we can get from the `localstorage` as we saved it and the Firebase key\
    \ that we copied from the panel:\n\n```bash\n$ curl https://android.googleapis.com/gcm/send\
    \ --header \"Authorization: key=AABBHRWs_ug:APA91bEiHIEczZzLiMJAB_-icXkT7\n```\n\
    \n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_371_0.png)\n\nWe have successfully\
    \ sent a web push notification now and, next step from here would to integrate\
    \ this push API to integrate to your backend. We can also send custom payload\
    \ in notifications, but for that we need to add encryption and make changes on\
    \ the client side and server side. As it's not in the scope of the current context\
    \ we are skipping this, but you can follow this Google documentation for more\
    \ information ([https://developers.google.com/web/updates/2016/03/web-push-encryption](https://developers.google.com/web/updates/2016/03/web-push-encryption)).\n\
    \nWe are done with the major changes that we have to do in our PWA application,\
    \ we now just have to start writing our code and integrate the exchange rate APIs.\
    \ Let's look into our `currencyService`:\n\n```typescript\n// src/providers/currency-service.ts\n\
    \nimport { Injectable } from '@angular/core';\nimport { Http } from '@angular/http';\n\
    import 'rxjs/add/operator/map';\nimport { StorageService } from './storage-service';\n\
    \n@Injectable()\nexport class CurrencyService {\n\n  constructor(public http:\
    \ Http, public cache: StorageService) {\n  }\n\n  loadCurrencyList(base:String)\
    \ {\n    return new Promise (resolve => {\n      let url = \"https://api.fixer.io/latest?base=\"\
    \ + base;\n      this.http.get(url).map(res => res.json()).subscribe(data => {\n\
    \        this.cache.setObject('base_'+ base, data);\n        resolve(data);\n\
    \      }, error => {\n        resolve(\"Data not found\");\n      })\n    })\n\
    \  }\n}\n```\n\nFor fetching the currency according to the base currency we used\
    \ the `loadCurrencyList()` method, which then calls the `fixer.io` API to return\
    \ the results and also cache it using service worker. We have filtered this type\
    \ of request to be `networkFirst`, so everytime it will fetch the latest data\
    \ from the server. In case a device is offline, it returns the last cached result\
    \ and if in case the request was not cached it will go to the error block and\
    \ we will resolve it as `Data not found`. At the same time we are also storing\
    \ the data in `IndexedDB`:\n\n```typescript\nconvert(from, to) {\n  return new\
    \ Promise(resolve => {\n    this.http.get(\"https://api.fixer.io/latest?base=\"\
    \ + from +\n      \"&symbols=\" + to).map(res => res.json()).subscribe(data =>\
    \ {\n        resolve(data);\n      }, error => {\n        this.cache.getObject('base_'\
    \ + from).then((value) => {\n          if(value) {\n            resolve(value);\n\
    \          } else {\n            resolve(\"Data not found in offline State\");\n\
    \          }\n        })\n      })\n  })\n}\n```\n\nOn our `HomePage` we fetch\
    \ the one-to-one currency conversion rate and for that we use the `convert()`\
    \ method. Here our approach is `cacheFirst` and we will return the `cacheStorage`\
