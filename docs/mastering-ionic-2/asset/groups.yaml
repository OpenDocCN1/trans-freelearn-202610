    \  </ion-list>\n\n  <ion-infinite-scroll\n    (ionInfinite)=\"getNewProducts($event)\"\
    >\n    <ion-infinite-scroll-content></ion-infinite-scroll-content>\n  </ion-infinite-scroll>\n\
    </ion-content>\n```\n\nThe `ionInfinite` attribute is used to call the `getNewProducts()`\
    \ function, which will eventually fetch the new data:\n\n```typescript\nexport\
    \ class ProductsPage {\n\n  constructor() {}\n\n  getNewProducts(infiniteScroll)\
    \ {\n    // Call an HTTP function or service\n    // fetches new data and append\
    \ to the products array list.\n    // Make sure to call complete method to close\
