  - "[PAGE 285]\n\n# # Demonstrating authorization in Ionic\n\nLet's now build an\
    \ Ionic application that will handle both authentication and authorization. Authorization\
    \ refers to rules that determine who is allowed to do what. Authentication and\
    \ authorization are central parts of securing an application:\n\n*Authentication*\
    \ = *login* + *password* (who you are)\n\n*Authorization* = *permissions* (what\
    \ you are allowed to do)\n\nIn this section, we will see how we can secure views\
    \ of the Ionic application that are login protected. We will be working on the\
    \ following points:\n\n+   - `HomePage` will be public\n+   - `ArticlesPage` is\
    \ protected and will only be accessed after login\n+   - Menu is also dynamically\
    \ updated on auth status\n+   - `LoginPage` will be inaccessible once a user is\
    \ loggedIn\n+   - Authorization header will be passed after login for each request\n\
    \nLet's start by creating the application and I have named it as `ionic2-auth`:\n\
    \n```\n```bash\n$ ionic start ionic2-auth sidemenu -v2\n$ ionic platform add android\n\
    $ npm install @ionic/storage -save\n$ ionic generate page articles\n$ ionic generate\
    \ page home\n$ ionic generate page login\n```\n```\n\nWe will be using all the\
    \ latest libraries and current Ionic version. Also, we now have split pane and\
    \ responsive grid, which will make the Ionic applications closer to supporting\
    \ desktop applications. We will mainly be using three views, `HomePage`, which\
    \ is publicly accessible, `ArticlesPage`, which is protected, and `LoginPage`.\
    \ `HomePage` we have set as rootPage as that is the public view. After this, let's\
    \ look at the dynamic menu and login/logout events, which we will be handling\
    \ inside `app.component.ts`:\n\n```\n```typescript\n// src/app/app.component.ts\n\
    \nimport { Component, ViewChild } from '@angular/core';\nimport { Nav, Platform,\
    \ MenuController, Events } from 'ionic-angular';\nimport { StatusBar, Splashscreen\
    \ } from 'ionic-native';\nimport { ArticlesPage } from '../pages/articles/articles';\n\
    import { LoginPage } from '../pages/login/login';\nimport { HomePage } from '../pages/home/home';\n\
    import { DataService } from '../providers/data-service';\nimport { Storage } from\
    \ '@ionic/storage';\n\n@Component({\n  templateUrl: 'app.html'\n})\nexport class\
    \ MyApp {\n  @ViewChild(Nav) nav: Nav;\n\n  rootPage: any = HomePage;\n\n  pages:\
    \ Array<{title: string, component: any}>;\n\n  constructor(public platform: Platform,\n\
    \    public storage: Storage,\n    public data: DataService,\n```\n```"
  - "[PAGE 286]\n\n```\n```typescript\npublic menu: MenuController,\npublic events:\
    \ Events\n) {\n\n  this.initializeApp();\n  // used for an example of ngFor and\
    \ navigation\n  this.pages = [\n    { title: 'Home', component: HomePage },\n\
    \    { title: 'Articles', component: ArticlesPage }\n  ];\n\n  this.listenToLoginEvents();\n\
    \n  // decide which menu items should be hidden\n  // by current login status\
    \ stored in indexedDB\n  this.data.isAuthorised().then((status) => {\n    this.enableMenu(status\
    \ === true);\n  });\n}\n```\n```\n\nHere we have initialized the application,\
    \ set the menu pages, and checked the auth status so we can enable menu items\
    \ accordingly:\n\n```\n```typescript\ninitializeApp() {\n  this.platform.ready().then(()\
    \ => {\n    // Okay, so the platform is ready and our plugins\n    // are available.\n\
    \    // Here you can do any higher level native things\n    //     you might need.\n\
    \    StatusBar.styleDefault();\n    Splashscreen.hide();\n  });\n}\n\nlogin()\
    \ {\n  this.nav.push(LoginPage);\n}\n\nlogout() {\n  this.events.publish('user:logout');\n\
    }\n\nopenPage(page) {\n  // Reset the content nav to have just this page\n  //\
    \ We wouldn't want the back button to show in this\n  // scenario\n  // Make sure\
    \ to catch the error here else\n  // you will get error\n  this.nav.setRoot(page.component).catch(()\
    \ => {\n    console.log(\"Page didnt load\")\n  })\n}\n\nlistenToLoginEvents()\
    \ {\n  this.events.subscribe('user:login', (result) => {\n    this.enableMenu(true);\n\
    \    this.storage.set('user', result);\n  });\n\n  this.events.subscribe('user:logout',\
    \ () => {\n    this.enableMenu(false);\n    this.storage.remove('user');\n   \
    \ this.nav.setRoot(HomePage).catch(() => {\n      console.log(\"Page didnt load\"\
    )\n    })\n  });\n}\n\nenableMenu(loggedIn: boolean) {\n  this.menu.enable(loggedIn,\
    \ 'loggedInMenu');\n  this.menu.enable(!loggedIn, 'loggedOutMenu');\n}\n}\n```\n\
