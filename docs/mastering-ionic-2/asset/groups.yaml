    - Future of PWAs


    ## What and why PWA?


    PWAs are a new breed of web applications. They combine the benefits of a native
    application with the low friction nature of the Web. Progressive web applications
    start off as simple websites, but as the user interacts with them, they progressively
    gain super powers. They transform from a website into something much more, such
    as a traditional native application.


    PWAs are:


    - **Reliable**: PWAs load instantly and never show the dinosaur, even in bad network
    conditions. When an application is launched from the user''s home screen, service
    workers (will be discussed later) enable a progressive web application to load
    it instantly, regardless of the network state.

    - **Portable**: There are many strategies for native application portability (including
    hybrid applications), but unlike those strategies PWAs don''t change your deployment
    and packaging model.

    - **Engaging**: PWAs feel like a natural application on the device, with a great
    user experience. They are installable, they can be added to the user home screen,
    without the need for any application store. They offer full screen experience
    like a native application and even re-engage users with web push notifications.

    - **Fast**: PWAs are fast and respond quickly to interactions with smooth animations.
    Users always expect sites to be fast and smooth. According to a survey, 53% of
    users will abandon a site if it takes more than three seconds to load.


    ## Advantages of PWA


    PWAs have certain advantages over native applications, it''s the future for the
    next billion users who will come online in the coming few years. Now we will talk
    about the advantages and why they are crucial to mobile users:


    - **Install prompt**: Install banners are really crucial and they increase the
    engagement with the application. Currently, this can''t be controlled by developers,
    but Chrome decides when to prompt the user to show the option of Add to Home Screen.

    - **Works offline**: Internet connections can be really poor in many areas, which
    is why we need offline support for our application. PWAs help us gain better user
    experience and engagement. Cache APIs and IndexedDB are the two recommendations
    for enabling offline access to your PWA.

    - **Lightweight**: Progressive web applications are just web pages and really
    lightweight and quick to install. PWAs do not consume large space for installation
    and are updated in real time, as they don''t have to go via Play Store approvals.

    - **Linkable and discoverable**: We can easily share URLs and is identifiable
    as an application due to manifest and service worker registration scope. Also,
    allows search engine to find it.

    - **Web push notifications**: Service workers also help in handling the web push
    notifications, which help to re-engage users. PWA are served only over HTTPS,
    so they ensure security.

    - **Update on use**: Unlike the usual native application update strategy, PWAs
    are updated like web pages: using them gets you the latest version.

    - **Analyze before installation**: You don''t need to install them to start using
    them. They are simple web pages. Users choose to install when they want to.


    ## Disadvantages of PWA


    The following are the disadvantages of PWA:


    - **Traffic through store**: PWA miss significant traffic who use Play Store or
    application store for their primary search. Users can be redirected to Play Store
    to download the native application using mobile web, but it doesn''t work in case
    of PWA.

    - **Plugin integration**: Plugins such as Facebook and Google login cannot fetch
    data from their applications, we need to fetch it separately on the Web.

    - **Promotion**: It is getting difficult to promote PWA experience on social media
    as companies are making their own in-application browsers.

    - **Browser support**: Full support for PWAs are not available in some browsers
    varying on devices.


    ## Ionic supports PWA


    The Ionic team are great fans of the progressive web application, which offers
    an application-like experience using modern web APIs. Since Ionic 3 is built with
    web technologies that work perfectly in web browsers, this gives you a huge advantage
    when building your PWA with Ionic, because if you know how to build an Ionic 3
    application, then you can easily build a PWA in a short period of time, you just
    have to add service workers and a web manifest file. We will be building an offline
    currency converter with PWA support and will finally host it on Firebase hosting.


    ## What makes a web application a PWA?


    In simple words, a PWA is meant to be eventually installed to the user''s home
    screen, which means they will access it exactly like a native application. So
    users expect the same experience as when using a native application. Since Ionic
    3 is designed to create a native application experience with standard web technologies,
