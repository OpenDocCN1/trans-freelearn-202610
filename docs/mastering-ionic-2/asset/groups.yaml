    # # Token based authentication


    Token based authentication is a newer approach of authentication in many web applications.
    In this approach authentication is successful when a user proves the server of
    their validity by passing the user token, which then is verified by the server.
    Before getting started with the token-based approach, let''s quickly see some
    benefits of using this approach:


    +   - Stateless

    +   - Mobile-ready

    +   - Performance

    +   - More secure

    +   - Standard based JWT

    +   - There are many other benefits of using the token based approach, such as
    you can serve all your assets (HTML, CSS, and JS) via CDN and your server side
    is just an API, which will improve the performance


    ![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_263_0.png)


    In a token based approach you first need to get a valid token, which you usually
    will get as a response of login request in many applications. Let''s take an example
    of the Facebook connect API. Every time you login via Facebook it returns a token
    in the response. The token then will be used in future to get a set of user information
    from Facebook; Facebook uses that token to validate the user and on validation
    provides the information.


    For an Ionic application, we can store that token to local storage or session
    storage for future use. We need to extend the default HTTP class for setting an
    authorization header for every outgoing request from our'
  - '[PAGE 264]


    Ionic application. You can see how easy it''s working with token based authentication;
    you don''t need to think about security issues such as CSRF as you are not relying
    on cookies.


    Almost all of the web applications previously were based on cookies and they handle
    user sessions in cookies. These require the server to authenticate the user cookies
    on every request. As we are moving towards a modern token based authentication
    approach, there are still some applications using a cookie-based authentication
    approach. Although we can implement the same cookie-based authentication on our
    Ionic application, it is not recommended. We will cover mainly the token based
    approach here and will demonstrate it in an application.'
