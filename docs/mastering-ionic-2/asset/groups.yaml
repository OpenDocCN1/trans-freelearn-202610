  - '[PAGE 215]


    # Summary


    There will be a continuous evolution of Cordova plugins and we need to take care
    that we are updated with the latest features that are introduced. With Ionic coming
    into the market, the last few years have seen increased development of hybrid
    applications and plugins. This is because more people are interested in using
    it and multiple custom plugins are developed for keeping in touch with the latest
    technology. One similar example is Bluetooth beacons and multiple plugins developed
    by developers for supporting its different formats. We have now covered plugin
    development, which is another important aspect of developing complex hybrid applications.
    We can now leverage the power of plugins for building advance hybrid applications
    that require access to Native APIs. Later in the chapter, we went on to cover
    many Ionic CLI commands that help us quickly develop and debug applications. Ionic
    CLI is advancing day by day and many new features and tasks are coming. What we
    all should do is regularly update Ionic CLI and check for new features so that
    in our next applications we can take advantage of that.


    In the Chapter 4, *Ionic Platform and Services*, we will look at Ionic services
    and tools. Over the last two years, Ionic has evolved a lot and the Ionic team
    has built really useful tools that speed up development time. Ionic CLI is one
    of the most used and important tools. Ionic as a platform offers Ionic push, Ionic
    deploy, Ionic analytics, and Ionic lab, along with creator and playground help
    to build prototypes quickly. The Ionic team is working really hard to bring us
    all this awesome stuff that helps us to make innovative applications for users.'
