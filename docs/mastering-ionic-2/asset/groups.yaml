    # # Splash screen plugin


    The splash screen plugin is used to display and hide splash screen on the launch
    of the application. With Ionic applications you will get a default Ionic splash
    screen. You can easily change that with the Ionic CLI command Ionic resources
    after adding a new screen to the respective resources folder.


    Splash screen is supported by Ionic Native and it has two methods:


    +   - `this.splashScreen.show()`: Displays splash screen

    +   - `this.splashScreen.hide()`: Hides splash screen'
