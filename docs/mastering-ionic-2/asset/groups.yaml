  - "[PAGE 230]\n\n# Ionic DB\n\nIonic DB is the most recent addition in Ionic Cloud\
    \ services. IonicDB is used to securely store your application data remotely.\
    \ It integrates well with Auth so users can securely store their data and retrieve\
    \ it in real time. We will be fetching data in our application from IonicDB and\
    \ for that we all set to integrate it directly as we have already installed and\
    \ configured cloud client. Some important features of IonicDB are:\n\n+   - JSON\
    \ style document storage\n+   - Real-time data updation\n+   - Authentication\
    \ and permission manages the read/write privileges.\n\nWe will start with creating\
    \ a database for our application in the dashboard and adding specific collections\
    \ to it. Collections are a group of documents that are identified by a unique\
    \ key stored in the id field. You can also think collections similar to what we\
    \ have tables in relational database. We will be creating some initial collections\
    \ categories, parent_categories, popular_products, and products, which we will\
    \ be using inside our application in different views. You will also find user\
    \ collection, which is automatically created as we have integrated Auth in our\
    \ application:\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_230_0.png)\n\nWe will\
    \ be using Ionic DB inside multiple views in our application, so for this we have\
    \ created a DataService provider, which will be directly communicating with Ionic\
    \ DB and returning data to the views from where the service will be called. This\
    \ will help us save a lot of code duplicity. Before we get started let's first\
    \ check out the process of how the Ionic DB works and fetches the data:\n\n```\n\
    // src/providers/data-service.ts\n\nimport { Injectable } from '@angular/core';\n\
    import { Storage } from '@ionic/storage';\nimport { Database } from '@ionic/cloud-angular';\n\
    import { Observable } from 'rxjs/Observable';\n\nimport 'rxjs/add/operator/map';\n\
    import 'rxjs/add/operator/catch'\n\n@Injectable()\nexport class DataService {\n\
    \n  cartItems: any[];\n```"
  - "[PAGE 231]\n\n```\nloading: any;\n\nconstructor(public db: Database) {\n    //\
    \ Establish Initial connection\n    this.db.connect();\n}\n\npublic getCategories():\
    \ Observable<any> {\n    const categories:any = this.db.aggregate({\n        name:\
    \ \"testing\",\n        categories: this.db.collection('categories'),\n      \
    \  parent_categories:\n            this.db.collection('parent_categories')\n \
    \   })\n    return categories.fetch();\n}\n\npublic getPopularProducts(): Observable<any>\
    \ {\n    const popular_products:any =\n        this.db.collection('popular_products');\n\
    \    return popular_products.order(\"price\",\n    \"ascending\").fetch();\n}\n\
    }\n```\n\nBefore fetching data from IonicDB collections we need to establish an\
    \ initial connection with the database, after that, we will be able to create\
    \ collections. You can see in the preceding code that we have established a connection\
    \ in our constructor method and after that we have declared multiple functions\
    \ for fetching data from the database.\n\nThere are multiple read and write operations\
    \ available for collections. Inside our getPopularProducts() function, we have\
    \ the order() method, which is retrieving products that are according to low to\
    \ high price. There can be a scenario where we need to query multiple collections\
    \ and combine the result into a single JSON response. On categoriesPage we are\
    \ doing the same fetching categories and parent_categories at the same time. So\
    \ we can prepare a tree to display it accordingly on the UI side. The aggregate()\
    \ method combines the results of multiple DB queries into one result. You may\
    \ have noticed that we have used the fetch() method here rather than the watch()\
    \ method, which we used for the getPopularProducts() function. The difference\
    \ between watch() and fetch() is that watch() updates the data in real time:\n\
    \n```\n// src/pages/home/home.ts\n\nimport { DataService } from '../../providers/data-service';\n\
    \nexport class HomePage {\n    constructor(public data: DataService) {\n     \
    \   this.data.getPopularProducts().subscribe((popular) => {\n            this.products\
    \ = this.arrayToMatrix(popular, 2);\n            console.log(this.products)\n\
    \        }, (error) => {\n            console.error(error);\n        });\n   \
    \ }\n}\n\n// src/pages/categories/categories.ts\n\nthis.data.getCategories().subscribe((data)\
    \ => {\n    for (var i = 0; i < data.categories.length; ++i) {\n        let p_id\
    \ = data.categories[i].parent_id;\n        for (var j = 0; j < data.parent_categories.length;\n\
    \            ++j) {\n            if(data.parent_categories[j].id == p_id)\n  \
    \          {\n                data.parent_categories[j].child.push(data.categories[i])\n\
    \            }\n        }\n    }\n    this.categoryList = data.parent_categories;\n\
    ```"
  - "[PAGE 232]\n\n```\n}, (error) => {\n    console.error(error);\n});\n```\n\nAll\
    \ the read and write operations return the RxJS observable. subscribe is a method\
    \ on observable, which takes three functions as parameters:\n\n+   - next(result):\
    \ callback method that receives collection data\n+   - error(error): callback\
    \ method that receives error data\n+   - complete(): callback executed when the\
    \ result set is iterated completely\n\nIf you want to stop receiving emissions\
    \ you can call the unsubscribe() method. We will be mostly using read methods\
    \ from our mobile application to retrieve data from the database. Although, we\
    \ also have multiple write operations that can also be used for user centric applications\
    \ such as to-do applications.\n\nLet's see some write operations also and how\
    \ we can use it. Although, in our vPlanet application we haven't used write operations,\
    \ but let's demonstrate how we can use some write operations for a to-do application:\n\
    \n```\nconst todoItems = this.db.collection(\"items\");\n\n// Insert a todo item\
    \ document\n\nlet dateTime = new Date().toLocaleString();\n\ntodoItems.insert({\n\
    \  id: \"1\",\n  user: this.user.id,\n  text: \"Prepare project presentation\"\
    ,\n  status: \"pending\"\n  timestamp: dateTime\n});\n\n// Update todo item\n\n\
    let dateTime = new Date().toLocaleString();\n\ntodoItems.update({\n  id: \"1\"\
    ,\n  user: this.user.id,\n  text: \"Prepare project presentation\",\n  status:\
    \ \"completed\"\n  timestamp: dateTime\n});\n```\n\nWe now have a good idea of\
    \ how read and write operations work with IonicDB. IonicDB is still in active\
    \ development, so you can expect some issues, but until now I have had a smooth\
    \ journey developing vPlanet applications."
