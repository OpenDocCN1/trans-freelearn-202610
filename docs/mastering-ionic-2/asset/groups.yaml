  - "[PAGE 68]\n\n# Customizing\n\nNow the basic setup is ready for SASS and also\
    \ while running `ionic serve` you will add all custom styling and SASS related\
    \ changes in all different files for each of the components or pages. Let's start\
    \ with changing one of the color variables by default present in the `variable.scss`\
    \ file:\n\n```\n/*\nTo customize the look and feel of\n    Ionic, you can override\
    \ the variables\nFor example, you might change some of\n    the default colors:\n\
    \n$colors: (\n    primary:    #387ef5,\n    secondary:  #32db64,\n    danger:\
    \     #f53d3d,\n    light:      #f4f4f4,\n    dark:       #222,\n    favorite:\
    \   #69BB7B,\n    twitter:    #53ACEB,\n    github:     #000000,\n    instagram:\
    \  #235D8D\n);\n\n// Fastest way to change the theme of\n    your Ionic app is\
    \ to set new value\n    for primary color\n```\n\nYou can see that we have added\
    \ custom colors such as Twitter and GitHub. We can further customize it by supplying\
    \ base and contrast properties:\n\n```\n$colors: (\n    facebook:(\n        base:\
    \ #3b5998,\n        contrast: #ffffff\n    )\n)\n```\n\nYou can now use this color\
    \ key as a property to many components, such as `buttons`:\n\n```\n<button facebook>Share\
    \ on Facebook</button>\n```\n\nSASS is really powerful and it speeds up the CSS\
    \ development process. It acts as a Swiss army knife for CSS, where we can do\
    \ multiple things with minimum lines of code and then with just some changes we\
    \ can easily change the entire look and feel of the application. There are so\
    \ many examples of how we can use SASS, but as we are more into Ionic development,\
    \ I recommend going through some good SASS documentation and Ionic 3 theming docs\
    \ once so that detailed information will be provided."
  - '[PAGE 69]


    **$ ionic resources**


    Ionic automatically crops, resizes, and creates icons and splash screens from
    source images for each platform and it does this in different sizes for different
    devices such as mobiles, tablets, and so on. All these are generated on Ionic''s
    resizing and cropping servers without any overload from installing libraries or
    plugins on local machines.'
  - '[PAGE 70]


    `<strong>$ ionic resources --icon</strong><br/><strong>$ ionic resources --splash</strong>`


    If a proper size is not provided for the source files, this will only create resources
    that are less than the size of the source image. For example, there might be chances
    that resources for tablets or high resolution screens are not generated.'
