  - '[PAGE 281]


    # Secure storage


    In Ionic application, many developers heavily depends upon localStorage or SQLite
    via Cordova plugin. Many times we have to store secret such as usernames, passwords,
    tokens, certificates, or any other sensitive information, In this case we can
    use secure storage Native plugin which uses keychain to encrypt data in iOS and
    in Android this plugin encrypts data to store it in SharedPreference. Inside an
    Ionic application, localStorage sandboxes the data only for your app. No, other
    application can access the data from outside, In case you are using SQLite as
    you application database, you can take advantage of SQLcipher plugin for encrypting
    the data inside SQLite:


    ```

    $ ionic cordova:plugin add cordova-plugin-secure-storage

    $ npm install --save @ionic-native/secure-storage

    ```


    Let’s see one such example can be storing user’s mobile number:


    ```

    import { SecureStorage, SecureStorageObject } from ''@ionic-native/secure-storage'';


    constructor(private secureStorage: SecureStorage) { }


    this.secureStorage.create(''user_data'')

    .then((storage: SecureStorageObject) => {


    storage.get(''mobile_number'')

    .then(

    data => console.log(data),

    error => console.log(error)

    );


    storage.set(''mobile_number'', ''+917813123123'')

    .then(

    data => console.log(data),

    error => console.log(error)

    );


    storage.remove(''mobile_number'')

    .then(

    data => console.log(data),

    error => console.log(error)

    );

    });

    ```


    Again, for all you are doing for encrypting the data we have to take are that
    we should never save passwords and other critical information inside application
    storage. Even in native applications it is not recommended because if someone
    is dedicated enough, they can still decrypt your data.'
