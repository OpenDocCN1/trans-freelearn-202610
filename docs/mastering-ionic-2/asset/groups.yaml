  - '[PAGE 153]


    # Ionic Native and Plugins


    We have now gone through some advanced components and APIs in Ionic. Another important
    part of building hybrid mobile applications are Cordova plugins. Plugins create
    a bridge between Native APIs and JavaScript, which help us to use Native APIs
    such as camera, GPS, files, and so on. Plugins are comprised of platform-specific
    Native library code and a JavaScript interface to call respective Native platform
    methods. Ionic is dependent on Cordova to build, debug, and release applications.
    We will be covering almost everything regarding Cordova plugins, Ionic Native,
    and some common and advanced plugins in this chapter. Initially, the Ionic team
    came up with ngCordova, which was based upon Angular 1.x, but moving forward,
    we have Ionic Native, which supports both Ionic 1, 2, and 3 applications. ngCordova
    was bound to Ionic 1 and Ionic Native is framework agnostic:


    +   - Cordova and how plugins work

    +   - Ionic Native

    +   - Commonly used Cordova plugins (camera, GPS, contacts)

    +   - Building a music player

    +   - Cordova versus phonegap'
