  md: "\n## Secure storage\n\nIn Ionic application, many developers heavily depend\
    \ upon localStorage or SQLite via Cordova plugin. Many times we have to store\
    \ secrets such as usernames, passwords, tokens, certificates, or any other sensitive\
    \ information. In this case we can use secure storage Native plugin which uses\
    \ keychain to encrypt data in iOS and in Android this plugin encrypts data to\
    \ store it in SharedPreference. Inside an Ionic application, localStorage sandboxes\
    \ the data only for your app. No other application can access the data from outside.\
    \ In case you are using SQLite as your application database, you can take advantage\
    \ of SQLcipher plugin for encrypting the data inside SQLite:\n\n```bash\n$ ionic\
    \ cordova:plugin add cordova-plugin-secure-storage\n$ npm install --save @ionic-native/secure-storage\n\
    ```\n\nLet's see one such example can be storing user's mobile number:\n\n```typescript\n\
    import { SecureStorage, SecureStorageObject } from '@ionic-native/secure-storage';\n\
    \nconstructor(private secureStorage: SecureStorage) { }\n\nthis.secureStorage.create('user_data')\n\
    .then((storage: SecureStorageObject) => {\n\nstorage.get('mobile_number')\n.then(\n\
    data => console.log(data),\nerror => console.log(error)\n);\n\nstorage.set('mobile_number',\
    \ '+917813123123')\n.then(\ndata => console.log(data),\nerror => console.log(error)\n\
    );\n\nstorage.remove('mobile_number')\n.then(\ndata => console.log(data),\nerror\
    \ => console.log(error)\n);\n});\n```\n\nAgain, for all you are doing for encrypting\
    \ the data we have to take care that we should never save passwords and other\
    \ critical information inside application storage. Even in native applications\
    \ it is not recommended because if someone is dedicated enough, they can still\
    \ decrypt your data.\n\n## General security points\n\nMost mobile operating systems\
    \ provide hardware level encryption. This gives the devices extra protection when\
    \ the device is locked. So we have to make sure that we always use the latest\
    \ sdks and Ionic 2 only supports Android 4.4 and higher versions. Other than this\
    \ there are some secure storage plugins for iOS and Android, which use keychain\
    \ in case of iOS and for Android AES encryption. Another plugin is PrivacyScreenPlugin,\
    \ which can be used for hiding sensitive information to be shown in app switchers\
    \ in case of Android and iOS. Users will see splash screen in task switcher and\
    \ if it is not detected it will show a black screen.\n\nReverse engineering is\
    \ another concern of many developers who think that their application code can\
    \ easily be extracted and repackaged in the application with some malicious code\
    \ and uploaded back onto the Play Store. Although this same practice can be done\
    \ in the case of Native applications, we can bypass this security concern in case\
    \ of Ionic applications by downloading JavaScript at runtime and deleting it when\
    \ the app closes. Although we need to think if we really require this as this\
    \ will come with performance issues also. On the other hand, it's very difficult\
    \ to do this in Java or objective-C and store your code base dynamically.\n\n\
    Obfuscation, minification, and compression are some of the ways you can secure\
    \ your code within your Ionic application. We can use many open-source tools to\
    \ minify and uglify your source before you package them to various app stores.\
    \ Some popular tools are YUI compressor and UglifyJS, which can be used to uglify\
    \ your JavaScript resources. Also, you should always minify all your JavaScript\
    \ and CSS resources, which will improve the performance of your Ionic application\
    \ and lower your APK file size. Some enterprise tools are also available such\
    \ as Jscrambler, which does all kinds of minification and obfuscation using its\
    \ proprietary solutions.\n\nThe following are some quick points that you can look\
    \ into before you release your application for security context:\n\n- Any sensitive\
    \ business logic should be executed on the server\n- Obfuscate and minify your\
    \ JavaScript assets with uglify or use Jscrambler\n- Do not use Android OS less\
    \ than 4.0\n- Use InAppBrowser for external links\n- Validate user inputs for\
    \ HTML forms\n- Don't cache sensitive data\n- Don't use eval() unless you know\
    \ what you are doing\n- Don't assume your source code is always secure\n- Try\
    \ to use keychain plugin for iOS\n\nIt's important to note that security is a\
    \ critical topic and one should always be updated with new improvements in Cordova\
    \ so we can improve our application in our next app release to app stores. Also,\
    \ make sure that you don't lose any performance.\n\n### Demonstrating authorization\
    \ in Ionic\n\nLet's now build an Ionic application that will handle both authentication\
    \ and authorization. Authorization refers to rules that determine who is allowed\
    \ to do what. Authentication and authorization are central parts of securing an\
    \ application:\n\n*Authentication* = *login* + *password* (who you are)\n\n*Authorization*\
    \ = *permissions* (what you are allowed to do)\n\nIn this section, we will see\
    \ how we can secure views of the Ionic application that are login protected. We\
    \ will be working on the following points:\n\n- `HomePage` will be public\n- `ArticlesPage`\
    \ is protected and will only be accessed after login\n- Menu is also dynamically\
    \ updated on auth status\n- `LoginPage` will be inaccessible once a user is loggedIn\n\
    - Authorization header will be passed after login for each request\n\nLet's start\
    \ by creating the application and I have named it as `ionic2-auth`:\n\n```bash\n\
    $ ionic start ionic2-auth sidemenu -v2\n$ ionic platform add android\n$ npm install\
    \ @ionic/storage --save\n$ ionic generate page articles\n$ ionic generate page\
    \ home\n$ ionic generate page login\n```\n\nWe will be using all the latest libraries\
    \ and current Ionic version. Also, we now have split pane and responsive grid,\
    \ which will make the Ionic applications closer to supporting desktop applications.\
    \ We will mainly be using three views, `HomePage`, which is publicly accessible,\
    \ `ArticlesPage`, which is protected, and `LoginPage`. `HomePage` we have set\
    \ as rootPage as that is the public view. After this, let's look at the dynamic\
    \ menu and login/logout events, which we will be handling inside `app.component.ts`:\n\
    \n```typescript\n// src/app/app.component.ts\n\nimport { Component, ViewChild\
    \ } from '@angular/core';\nimport { Nav, Platform, MenuController, Events } from\
    \ 'ionic-angular';\nimport { StatusBar, Splashscreen } from 'ionic-native';\n\
    import { ArticlesPage } from '../pages/articles/articles';\nimport { LoginPage\
    \ } from '../pages/login/login';\nimport { HomePage } from '../pages/home/home';\n\
    import { DataService } from '../providers/data-service';\nimport { Storage } from\
    \ '@ionic/storage';\n\n@Component({\n  templateUrl: 'app.html'\n})\nexport class\
    \ MyApp {\n  @ViewChild(Nav) nav: Nav;\n\n  rootPage: any = HomePage;\n\n  pages:\
    \ Array<{title: string, component: any}>;\n\n  constructor(public platform: Platform,\n\
    \    public storage: Storage,\n    public data: DataService,\n    public menu:\
    \ MenuController,\n    public events: Events\n) {\n\n  this.initializeApp();\n\
    \  // used for an example of ngFor and navigation\n  this.pages = [\n    { title:\
    \ 'Home', component: HomePage },\n    { title: 'Articles', component: ArticlesPage\
    \ }\n  ];\n\n  this.listenToLoginEvents();\n\n  // decide which menu items should\
    \ be hidden\n  // by current login status stored in indexedDB\n  this.data.isAuthorised().then((status)\
    \ => {\n    this.enableMenu(status === true);\n  });\n}\n}\n\ninitializeApp()\
    \ {\n  this.platform.ready().then(() => {\n    // Okay, so the platform is ready\
    \ and our plugins\n    // are available.\n    // Here you can do any higher level\
    \ native things\n    //     you might need.\n    StatusBar.styleDefault();\n \
    \   Splashscreen.hide();\n  });\n}\n\nlogin() {\n  this.nav.push(LoginPage);\n\
    }\n\nlogout() {\n  this.events.publish('user:logout');\n}\n\nopenPage(page) {\n\
    \  // Reset the content nav to have just this page\n  // We wouldn't want the\
    \ back button to show in this\n  // scenario\n  // Make sure to catch the error\
    \ here else\n  // you will get error\n  this.nav.setRoot(page.component).catch(()\
    \ => {\n    console.log(\"Page didnt load\")\n  })\n}\n\nlistenToLoginEvents()\
    \ {\n  this.events.subscribe('user:login', (result) => {\n    this.enableMenu(true);\n\
    \    this.storage.set('user', result);\n  });\n\n  this.events.subscribe('user:logout',\
    \ () => {\n    this.enableMenu(false);\n    this.storage.remove('user');\n   \
    \ this.nav.setRoot(HomePage).catch(() => {\n      console.log(\"Page didnt load\"\
    )\n    })\n  });\n}\n\nenableMenu(loggedIn: boolean) {\n  this.menu.enable(loggedIn,\
    \ 'loggedInMenu');\n  this.menu.enable(!loggedIn, 'loggedOutMenu');\n}\n}\n```\n"
  mdcn: "\n\n## 安全存储\n\n在 Ionic 应用中，许多开发者严重依赖通过 Cordova 插件使用 localStorage 或 SQLite。很多时候，我们必须存储机密信息，如用户名、密码、令牌、证书或任何其他敏感信息。在这种情况下，我们可以使用\
    \ secure storage 原生插件，它在 iOS 上使用钥匙串（keychain）加密数据，而在 Android 上，该插件会加密数据并将其存储在\
    \ SharedPreference 中。在 Ionic 应用内部，localStorage 会将数据沙箱化，仅对你的应用可见。其他任何应用都无法从外部访问这些数据。如果你将\
    \ SQLite 用作应用数据库，可以利用 SQLcipher 插件来加密 SQLite 中的数据：\n\n```bash\n$ ionic cordova:plugin\
    \ add cordova-plugin-secure-storage\n$ npm install --save @ionic-native/secure-storage\n\
    ```\n\n下面看一个示例，即存储用户的手机号码：\n\n```typescript\nimport { SecureStorage, SecureStorageObject\
    \ } from '@ionic-native/secure-storage';\n\nconstructor(private secureStorage:\
    \ SecureStorage) { }\n\nthis.secureStorage.create('user_data')\n.then((storage:\
    \ SecureStorageObject) => {\n\nstorage.get('mobile_number')\n.then(\ndata => console.log(data),\n\
    error => console.log(error)\n);\n\nstorage.set('mobile_number', '+917813123123')\n\
    .then(\ndata => console.log(data),\nerror => console.log(error)\n);\n\nstorage.remove('mobile_number')\n\
    .then(\ndata => console.log(data),\nerror => console.log(error)\n);\n});\n```\n\
    \n同样，尽管你在加密数据方面做了这么多工作，我们仍必须注意：绝不应在应用存储中保存密码和其他关键信息。即使在原生应用中也不推荐这样做，因为如果攻击者足够执着，他们仍然可以解密你的数据。\n\
    \n## 通用安全要点\n\n大多数移动操作系统都提供硬件级加密。这为设备在锁定时提供了额外的保护。因此，我们必须确保始终使用最新的 SDK，而 Ionic\
    \ 2 仅支持 Android 4.4 及更高版本。除此之外，还有一些适用于 iOS 和 Android 的安全存储插件，它们分别使用 keychain（iOS）和\
    \ AES 加密（Android）。另一个插件是 PrivacyScreenPlugin，可用于在 Android 和 iOS 的应用切换器中隐藏敏感信息。用户将在任务切换器中看到启动屏幕，如果没有检测到该插件，则会显示黑屏。\n\
    \n逆向工程是许多开发者的另一个担忧，他们认为自己的应用代码很容易被提取出来，与某些恶意代码重新打包进应用中，然后再次上传到 Play Store。虽然这种做法在原生应用中同样可行，但在\
    \ Ionic 应用中，我们可以通过在运行时下载 JavaScript，并在应用关闭时将其删除来绕过这一安全问题。不过，我们需要思考是否真的需要这样做，因为这也会带来性能问题。另一方面，用\
    \ Java 或 Objective-C 实现这一点并动态存储代码库非常困难。\n\n混淆、精简和压缩是在 Ionic 应用中保护代码的几种方法。我们可以使用许多开源工具在将源代码打包到各个应用商店之前对其压缩和混淆。一些流行的工具包括\
    \ YUI compressor 和 UglifyJS，它们可用于混淆你的 JavaScript 资源。此外，你应该始终压缩所有 JavaScript 和\
    \ CSS 资源，这将提高 Ionic 应用的性能，并减小 APK 文件的大小。还有一些企业级工具可用，例如 Jscrambler，它使用专有解决方案进行各种压缩和混淆。\n\
    \n以下是在发布应用之前，你可以针对安全方面关注的几个要点：\n\n- 任何敏感的业务逻辑都应在服务器端执行\n- 使用 uglify 混淆和压缩你的 JavaScript\
    \ 资源，或使用 Jscrambler\n- 不要使用低于 4.0 的 Android 操作系统\n- 对外部链接使用 InAppBrowser\n- 验证\
    \ HTML 表单的用户输入\n- 不要缓存敏感数据\n- 不要使用 eval()，除非你清楚自己在做什么\n- 不要认为你的源代码始终是安全的\n- 尽量在\
    \ iOS 上使用 keychain 插件\n\n需要指出的是，安全是一个关键主题，开发者应始终关注 Cordova 的最新改进，以便在下次向应用商店发布应用时改进我们的应用。同时，确保不要牺牲性能。\n\
    \n### 在 Ionic 中演示授权\n\n现在，让我们构建一个同时处理身份验证和授权的 Ionic 应用。授权是指决定谁被允许做什么的规则。身份验证和授权是保护应用安全的核心部分：\n\
    \n*身份验证* = *登录* + *密码*（你是谁）\n\n*授权* = *权限*（允许你做什么）\n\n在本节中，我们将了解如何保护 Ionic 应用中需要登录才能访问的视图。我们将处理以下要点：\n\
    \n- `HomePage` 将是公开的\n- `ArticlesPage` 受保护，只有登录后才能访问\n- 菜单也会根据认证状态动态更新\n- 一旦用户登录，`LoginPage`\
    \ 将不可访问\n- 登录后，每次请求都会传递 Authorization 头\n\n让我们从创建应用开始，我将其命名为 `ionic2-auth`：\n\n\
    ```bash\n$ ionic start ionic2-auth sidemenu -v2\n$ ionic platform add android\n\
    $ npm install @ionic/storage --save\n$ ionic generate page articles\n$ ionic generate\
    \ page home\n$ ionic generate page login\n```\n\n我们将使用所有最新的库和当前的 Ionic 版本。此外，我们现在有了分屏（split\
    \ pane）和响应式网格，这使得 Ionic 应用更接近支持桌面应用。我们主要使用三个视图：可公开访问的 `HomePage`、受保护的 `ArticlesPage`\
    \ 以及 `LoginPage`。我们已将 `HomePage` 设置为 rootPage，因为它是公共视图。接下来，让我们看看动态菜单和登录/登出事件，这些将在\
    \ `app.component.ts` 中处理：\n\n```typescript\n// src/app/app.component.ts\n\nimport\
    \ { Component, ViewChild } from '@angular/core';\nimport { Nav, Platform, MenuController,\
    \ Events } from 'ionic-angular';\nimport { StatusBar, Splashscreen } from 'ionic-native';\n\
    import { ArticlesPage } from '../pages/articles/articles';\nimport { LoginPage\
    \ } from '../pages/login/login';\nimport { HomePage } from '../pages/home/home';\n\
    import { DataService } from '../providers/data-service';\nimport { Storage } from\
    \ '@ionic/storage';\n\n@Component({\n  templateUrl: 'app.html'\n})\nexport class\
    \ MyApp {\n  @ViewChild(Nav) nav: Nav;\n\n  rootPage: any = HomePage;\n\n  pages:\
    \ Array<{title: string, component: any}>;\n\n  constructor(public platform: Platform,\n\
    \    public storage: Storage,\n    public data: DataService,\n    public menu:\
    \ MenuController,\n    public events: Events\n) {\n\n  this.initializeApp();\n\
    \  // used for an example of ngFor and navigation\n  this.pages = [\n    { title:\
    \ 'Home', component: HomePage },\n    { title: 'Articles', component: ArticlesPage\
    \ }\n  ];\n\n  this.listenToLoginEvents();\n\n  // decide which menu items should\
    \ be hidden\n  // by current login status stored in indexedDB\n  this.data.isAuthorised().then((status)\
    \ => {\n    this.enableMenu(status === true);\n  });\n}\n}\n\ninitializeApp()\
    \ {\n  this.platform.ready().then(() => {\n    // Okay, so the platform is ready\
    \ and our plugins\n    // are available.\n    // Here you can do any higher level\
    \ native things\n    //     you might need.\n    StatusBar.styleDefault();\n \
    \   Splashscreen.hide();\n  });\n}\n\nlogin() {\n  this.nav.push(LoginPage);\n\
    }\n\nlogout() {\n  this.events.publish('user:logout');\n}\n\nopenPage(page) {\n\
    \  // Reset the content nav to have just this page\n  // We wouldn't want the\
    \ back button to show in this\n  // scenario\n  // Make sure to catch the error\
    \ here else\n  // you will get error\n  this.nav.setRoot(page.component).catch(()\
    \ => {\n    console.log(\"Page didnt load\")\n  })\n}\n\nlistenToLoginEvents()\
    \ {\n  this.events.subscribe('user:login', (result) => {\n    this.enableMenu(true);\n\
    \    this.storage.set('user', result);\n  });\n\n  this.events.subscribe('user:logout',\
    \ () => {\n    this.enableMenu(false);\n    this.storage.remove('user');\n   \
    \ this.nav.setRoot(HomePage).catch(() => {\n      console.log(\"Page didnt load\"\
    )\n    })\n  });\n}\n\nenableMenu(loggedIn: boolean) {\n  this.menu.enable(loggedIn,\
    \ 'loggedInMenu');\n  this.menu.enable(!loggedIn, 'loggedOutMenu');\n}\n}\n```\n\
    \n"
