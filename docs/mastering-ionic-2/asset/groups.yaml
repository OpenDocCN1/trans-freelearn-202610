    \ http function or service\n    // fetches new data and append to the products\
    \ array\n    list\n    // Make sure to call complete method to close the\n   \
    \ loader icon\n    infiniteScroll.complete();\n  }\n}\n```\n\nAs you can see,\
    \ both virtual and infinite scroll are almost the same with respect to the template\
