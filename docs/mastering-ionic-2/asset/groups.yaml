    \ src/pages/account/account.html\n\n<img alt=\"profileImage\" [src]=\"base64Image\"\
    >\n```\n\nFor fetching the image from the gallery you can change the sourceType\
    \ to photolibrary. There are multiple options passed to the getPicture method.\
    \ Let's check all the options that we can use:\n\n- quality: Quality of the saved\
    \ image, which can be in the range of 0-100 or default 50.\n- destinationType:\
    \ DATA_URL(base64 encoded), FILE_URL(file URI), and NATIVE_URL.\n- sourceType:\
    \ photolibrary, camera, and savephotoalbum.\n- allowEdit: Allows simple editing\
    \ of images before selection.\n- encodingType: JPEG or PNG.\n- targetWidth: Width\
    \ in pixels to scale images. Aspect ratio remains constant. (Number)\n- targetHeight:\
    \ Height in pixels to scale image. Aspect ratio remains constant. (Number)\n-\
    \ mediaType: Type of media picture, video, or all media to select and it only\
    \ works when PictureSourceType is photolibrary or savephotoalbum.\n- correctOrientation:\
    \ Rotate the image to correct the orientation of the device during capture. (Boolean)\n\
    - saveToPhotoAlbum: Save the image to the photo album on the device after capture.\
    \ (Boolean)\n- popoverOptions: iOS-only options that specify popover location\
    \ in iPad.\n- cameraDirection: Choose the camera to use front or back, default\
    \ is back.\n\nIn case of destinationType FILE_URL, for removing photos taken by\
    \ the camera from temporary storage, use the following code:\n\n```\nthis.camera.cleanup().then(...);\
    \ // only for FILE_URI\n```\n\nPhotos selected from the gallery via changing sourceType\
    \ are not downscaled to a lower quality, even if a quality parameter is specified.\
    \ To avoid common memory problems, set camera.destinationType to FILE_URI rather\
    \ than DATA_URL.\n\n## Geolocation plugin\n\nThe Geolocation plugin leverages\
    \ the device's **Global Positioning System (GPS)** and fetches location information\
    \ such as latitude and longitude. There are other sources also from which this\
    \ plugin tries to get a device's location including Wi-Fi network and mobile network\
    \ IP address, although this will not have high accuracy. This plugin is officially\
    \ supported by Apache Cordova and it has a global accessible object `navigator.geolocation`,\
    \ which again needs a `deviceready` event available for using its features.\n\n\
    Let's get started by installing the plugin via:\n\n```bash\n$ ionic cordova:plugin\
    \ add cordova-plugin-geolocation\n$ npm install @ionic-native/geolocation --save\n\
    ```\n\nThere are mainly three methods available in this plugin:\n\n- `getCurrentPosition`\n\
    - `watchPosition`\n- `clearWatch`\n\n`getCurrentPosition` returns the position\
    \ of the current position:\n\n```javascript\nlet options = {\n  timeout :3000,\n\
    \  enableHighAccuracy: true,\n  maximumAge : 1000\n};\n\nthis.geolocation.getCurrentPosition(options).then((\
    \ position) => {\n  // on success\n  let coordinates = position.coords.latitude\n\
    \  +\",\"+position.coords.longitude\n}).catch((err) => {\n  // on error\n  console.log(err.message);\n\
    });\n```\n\nAs you can see from the preceding example, we have passed options\
    \ to the `getCurrentPosition()` function. Similar options are provided to the\
    \ `watchPosition()` function. `watchPosition()` watches the location changes and\
    \ when the device retrieves a new location, callback executes with the position\
    \ object having the latest location data:\n\n```javascript\nlet watchOptions =\
    \ {\n  timeout : 3000,\n  enableHighAccuracy: false // may cause errors if true\n\
    };\nlet watch = this.geolocation.watchPosition(watchOptions);\n\nwatch.subscribe((position)\
    \ => {\n  let lat = position.coords.latitude\n  let long = position.coords.longitude\n\
    });\n\n// Clearing the watch\nwatch.clearWatch()\n```\n\n**Also, we can easily\
    \ clear the watch method; this will stop watching for changes in the device's**\n\
    \n## Social sharing plugin\n\nSharing content with social media is a great tool\
    \ for marketing your application and its content, which helps you gain new users.\
    \ So having a share plugin will be a really fruitful feature for our applications.\
    \ You can share images, text, messages via Facebook, Twitter, e-mail, SMS, WhatsApp,\
    \ and so on using this plugin. It uses the Native share plugin to share content\
    \ and will automatically show all sharing options that you have in your device:\n\
    \n```bash\n$ ionic cordova:plugin add cordova-plugin-x-socialsharing\n$ npm install\
    \ @ionic-native/social-sharing --save\n```\n\nSocialSharing has multiple methods\
    \ that we can use in our application. The most commonly used method is SocialSharing.share,\
    \ which opens the default platform dialog with all the available sharing applications:\n\
    \n```typescript\n// src/pages/about/about.ts\n\nimport { SocialSharing } from\
    \ '@ionic-native/social-sharing';\n\nexport class AboutPage {\n\n  constructor(public\
    \ popoverCtrl: PopoverController, private socialSharing: SocialSharing) { }\n\n\
    \  shareViaFacebook() {\n    // recommended to use canShareVia before using shareVia\n\
    \    this.socialSharing.canShareVia(\"facebook\", \"Veloice:Intelligent Business\
    \ Telephony\", \"Real time Voice\", \"http://veloice.com/images/banner.png\").then(()\
    \ => {\n      this.socialSharing.shareViaFacebook(\"Veloice:Intelligent Business\
    \ Telephony\", \"http://veloice.com/images/banner.png\");\n    }).catch(() =>\
    \ {\n      alert(\"Cannot share on Facebook\");\n    });\n  }\n\n  shareViaWhatsApp()\
    \ {\n    // recommended to use canShareVia before using shareVia\n    this.socialSharing.canShareVia(\"\
    whatsapp\", \"Veloice:Intelligent Business Telephony\", \"Real time Voice\", \"\
    http://veloice.com/images/banner.png\").then(() => {\n      this.socialSharing.shareViaWhatsApp(\"\
    Veloice:Intelligent Business Telephony\", \"http://veloice.com/images/banner.png\"\
    );\n    }).catch(() => {\n      alert(\"Cannot share on Whatsapp\");\n    });\n\
    \  }\n\n  shareViaEmail() {\n    // recommended to use canShareVia before using\
    \ shareVia\n    this.socialSharing.canShareViaEmail().then(() => {\n      this.socialSharing.shareViaEmail(\n\
    \        'Veloice:Intelligent Business Telephony', // Message\n        'Veloice',\
    \ // Email Subject\n        ['toperson@xyz.com', 'tosecond@xyz.com'], // TO: must\
    \ be null or an array\n        ['cc@xyz.com'], // CC: must be null or an array\n\
    \        null, // BCC: must be null or an array\n        ['http://veloice.com/images/banner.png']\
    \ // FILES: can be null, a string, or an array\n      );\n    }).catch(() => {\n\
    \      alert(\"Cannot share on Email\");\n    });\n  }\n\n  share() {\n    this.socialSharing.share(\"\
    Veloice:Intelligent Business Telephony\", \"Real time Voice\", \"http://veloice.com/images/banner.png\"\
    , \"http://veloice.com\");\n  }\n\n}\n```\n"
