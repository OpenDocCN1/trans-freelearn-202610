    # # Summary


    We''ve now covered the get started part of Ionic and have gone through various
    aspects of what to take care of while building a large application. We now know
    how important it is to organize your files and folders in a project. We also discussed
    various setups, such as customizing applications through SASS, automatically creating
    icons and splash screens for various platforms, and uploading/sharing applications.
    Later in the chapter we went on to cover many Ionic CLI commands that help us
    quickly develop and debug applications. Ionic CLI is advancing day by day and
    many new features and tasks are coming. What we all should do is regularly update
    Ionic CLI and check for new features so that in our next application we can take
    advantage of them. We are now prepared to dig more deeply into Ionic and its components.
    In [Chapter 2](#), *Ionic Components*, we will be going around with the Ionic
    components and this is where we will move onto real application building where
    we will be using lists, virtual scrolling, localization, navigation, and many
    other components. This will help us make complex applications where we will have
    many tasks at hand. UI customization is another aspect we will look into, as almost
    every application will have a different design and we can easily build them over
    the current Ionic components with small tweak. Another important aspect we will
    look into is the custom modules built by the Ionic community, which we can directly
    use inside our application.'
