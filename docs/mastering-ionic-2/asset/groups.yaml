    # # Ionic Cloud


    Ionic started as a framework called Ionic framework, which has now become a complete
    platform with the launch of Ionic.io and tools and services involved with it.
    Ionic.io or Ionic Cloud Platform provides rich and hybrid-focused backend services
    and tools that ease the process of development and help build enterprise applications
    at a rapid pace. Ionic platform at present is out from beta phase and they have
    launched services now on some paid subscription models as it''s necessary to sustain
    and generate revenue for the Ionic team. But the Ionic framework will always be
    open source; just the backend services will have some pricing plans. Getting started
    with the Ionic platform is as simple as signing up for an account. After this,
    you will be able to share, upload, and use all other services provided by the
    platform.'
