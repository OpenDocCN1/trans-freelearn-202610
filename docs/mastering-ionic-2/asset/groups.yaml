  - "[PAGE 183]\n\n```\n}});\n    console.log('Clicked to update picture');\n  }\n\
    }\n// src/pages/account/account.html\n\n<img alt=\"profileImage\" [src]=\"base64Image\"\
    >\n```\n\nFor fetching the image from the gallery you can change the sourceType\
    \ to photolibrary. There are multiple options passed to the getPicture method.\
    \ Let's check all the options that we can use:\n\n+   - quality: Quality of the\
    \ saved image, which can be in the range of 0-100 or default 50.\n+   - destinationType:\
    \ DATA_URL(base64 encoded), FILE_URL(file URI), and NATIVE_URL.\n+   - sourceType:\
    \ photolibrary, camera, and savephotoalbum.\n+   - allowEdit: Allows simple editing\
    \ of images before selection.\n+   - encodingType: JPEG or PNG.\n+   - targetWidth:\
    \ Width in pixels to scale images. Aspect ratio remains constant. (Number)\n+\
    \   - targetHeight: Height in pixels to scale image. Aspect ratio remains constant.\
    \ (Number)\n+   - mediaType: Type of media picture, video, or all media to select\
    \ and it only works when PictureSourceType is photolibrary or savephotoalbum.\n\
    +   - correctOrientation: Rotate the image to correct the orientation of the device\
    \ during capture. (Boolean)\n+   - saveToPhotoAlbum: Save the image to the photo\
    \ album on the device after capture. (Boolean)\n+   - popoverOptions: iOS-only\
    \ options that specify popover location in iPad.\n+   - cameraDirection: Choose\
    \ the camera to use front or back, default is back.\n\nIn case of destinationType\
    \ FILE_URL, for removing photos taken by the camera from temporary storage, use\
    \ the following code:\n\n```\nthis.camera.cleanup().then(...); // only for FILE_URI\n\
    ```\n\nPhotos selected from the gallery via changing sourceType are not downscaled\
    \ to a lower quality, even if a quality parameter is specified. To avoid common\
    \ memory problems, set camera.destinationType to FILE_URI rather than DATA_URL."
