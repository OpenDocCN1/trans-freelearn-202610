  mdcn: "\n\n## 本书所需的准备\n\n你需要使用 Sublime 或 Visual Studio Code 进行代码编辑。这两款软件均可免费下载。对于\
    \ BLE 演示，你需要一台支持蓝牙 4 的笔记本电脑或蓝牙 BLE 信标。\n\n## 本书的读者对象\n\n本书面向具备一定 Ionic 基础知识的中级应用程序开发者。对于那些希望将应用从\
    \ Ionic 1 迁移到 Ionic 3 的开发者，本书将非常有帮助；同时，想要获取最新技术更新（例如 Ionic 对 PWA 的支持）的开发者也能从中获益。\n\
    \n## 排版约定\n\n在本书中，你会看到多种文本样式，用以区分不同类型的信息。以下是一些样式示例及其含义说明。\n\n文中的代码词、数据库表名、文件夹名、文件名、文件扩展名、路径名、虚拟\
    \ URL、用户输入以及 Twitter 用户名将以如下格式显示：“为了设置 API 端点，我们创建了常量文件，并在其中声明了常量 `API_URL`”\n\
    \n代码块如下所示：\n\n```json\n{\n  \"name\": \"ionic2-auth\",\n  \"app_id\": \"\",\n\
    \  \"v2\": true,\n  \"proxies\": [\n    {\n      \"path\": \"/api\",\n      \"\
    proxyUrl\": \"http://yourwebsite.com/api\"\n    }\n  ]\n}\n```\n\n当我们希望引起你对代码块中某一部分的注意时，相关行或项目会以**粗体**显示：\n\
    \n```typescript\n// src/providers/constants.ts\n// 部署应用时，我们切换到真实 URL\n\nexport\
    \ const API_URL: string = 'http://localhost:8100/api';\n```\n\n任何命令行输入或输出将按如下方式书写：\n\
    \n```shell\n$ chromium-browser --disable-web-security\n```\n\n**新术语和重要词汇**以粗体显示。你在屏幕上看到的文字，例如菜单或对话框中的文字，在文中会以如下形式呈现：“Cancel\
    \ 和 OK 按钮。我们在这里使用它们来根据相关性、价格或其他排序值对产品进行排序。”\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_32_0.png)\n\
