    \ Errata 部分。\n\n### 盗版\n\n互联网上对受版权保护内容的盗版是所有媒体面临的一个持续问题。在 Packt，我们非常重视版权和许可的保护。如果你在互联网上发现任何形式的、我们作品的非法副本，请立即向我们提供地址或网站名称，以便我们采取补救措施。\n\
    \n请通过 `copyright@packtpub.com` 联系我们，并附上疑似盗版材料的链接。\n\n我们感谢你帮助保护我们的作者以及我们为您带来优质内容的能力。\n\
    \n### 问题\n\n如果你对本书的任何方面有问题，可以通过 `questions@packtpub.com` 联系我们，我们将尽最大努力解决问题。\n\n\
    ## Ionic 3 入门\n\n多年来，Ionic 一直在不断演进；自从 Ionic v1 发布以来，这个框架一直处于持续开发和改进之中。最明智的举措之一是\
    \ Ionic 团队推出了基于 Angular 2 的 Ionic v2。最近，Ionic 3 也发布了，它基于 Angular 4 和 TypeScript\
    \ 2.2。在本书中，我们将主要深入探讨 Ionic 2 和 Ionic 3 及其高级概念。我们将涵盖构建支持蓝牙信标的商场电商应用、与 Firebase\
    \ 的集成，以及 Ionic 应用对 PWA 的支持等主题。我们将从对 iOS、Android 和 Windows 这三个平台的支持开始，并将演示基于物联网的应用程序，这会非常令人兴奋。\n\
    \n在本章中，我们将了解 Ionic 的所有基础内容，这些内容将有助于构建大规模、企业级的应用程序。过去 2-3 年我们一直在使用 Ionic 1.x，在这一过程中，我们看到了框架的巨大改进和多项功能的开发。Angular\
    \ 2 发布后，框架又得到了更多改进，随后 Ionic 团队计划开发基于 Angular 2 的 Ionic 2。Ionic 3 和 Angular 4 在相似的路线上发展，并没有像我们从\
    \ Ionic v1 迁移到 v2 时那样的重大框架变更。借助 Ionic 3，你将看到性能的提升、代码复杂度的降低，以及构建可扩展应用能力的增强。Ionic\
    \ 现在面向移动 Web 和桌面应用程序，这帮助开发者在任何地方运行相同的代码库。Ionic Native 是另一个例子，展示了 Ionic 团队如何日复一日地改进产品，让开发者的生活更加轻松。我们首先会了解\
    \ Angular 和 Ionic 的一些基础知识，以及 TypeScript 如何成为构建企业级应用的重要资产。Ionic CLI 和 Ionic Cloud\
    \ 产品也在定期改进，我们可以利用它们加快开发速度，并高效地测试或分享我们的应用。在本章中，我们将涵盖：\n\n- Angular 4、Ionic 3 和\
    \ TypeScript\n- 安装与设置\n- 目录结构和模块化\n- 使用 SASS 进行主题定制\n- Ionic CLI\n\n"
