    # # About the Author


    Open-source enthusiastic, Javascript full stack developer with Node.js, AngularJS,
    electron and Ionic. Currently working on IOT projects with BLE Beacons. Gaurav
    have been researching on VOIP technologies, IOT and material design whenever he
    get time from his daily activities. Gaurav is also associated with Apache software
    foundation where he is contributor and committer to Apache Roller, Apache Fineract
    and Apache OFBiz projects. He was selected and invited as speaker at multiple
    conferences Mifos Techdays, ApacheCON, Mifos Summit and also into many local colleges/institutions.
    Gaurav was a student intern Google Summer of Code Student in 2014 and Mentored
    in 2016 with Mifos Initiative worked on AngularJs based community-app. He was
    selected as delegate for GSOC Summit in 2014 and 2016 San Francisco. He had worked
    on Google Adwords and analytics in past and was semi-finalist in Google Online
    Marketing Challenge in 2012.


    *I would like to thank my parents and my late uncle Raj, without them it would
    be really difficult for me to reach to here and write a book. Also, at difficult
    times my best friend Seema came with full support to continue working hard.*


    *A special thanks also goes to my interns and content editor as they have been
    helping alot during the course of the book. It was pleasure to work with great
    minds around you.*


    *Lastly, I want to thank you all for showing interest in this book and I hope
    that I can pass my enthusiasm to join Ionic community and take your exciting journey
    to new heights.*'
