    \ require('http').Server(app),\n    io = require('socket.io')(http),\n    bleno\
    \ = require('bleno');\n    exec = require('child_process').exec;\n\n// Start advertising\
    \ iBeacon\nvar uuid = '38a48d7e-05ab-11e7-93ae-92361f002671';\nvar major = 10;\
    \ // 0x0000 - 0xffff\nvar minor = 5; // 0x0000 - 0xffff\nvar measuredPower = -59\
    \ // -128 - 127\n\nbleno.on('stateChange', function(state) {\n    console.log('on\
    \ -> statechange: ' + state);\n    if (state === 'poweredOn') {\n        bleno.startAdvertisingIBeacon(uuid,\
    \ major, minor,\n            measuredPower);\n    } else {\n        bleno.stopAdvertising();\n\
    \    }\n});\n```\n```\n\nInitially, we are declaring the properties for the advertising\
    \ the iBeacon. We are listening to the `stateChange` **listener** here so in case\
    \ **Bluetooth** is ON/OFF we can start or stop the advertisement of **iBeacon**\
    \ with the `startAdvertisingIBeacon()` and `stopAdvertising()` methods respectively:"
