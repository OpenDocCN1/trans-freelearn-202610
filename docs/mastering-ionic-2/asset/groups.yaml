    ## Ionic View, Creator, and Playground


    We have now covered almost all important Ionic Services, yet there are some Ionic
    tools available for Ionic applications that are really useful. Some of those tools
    are Ionic View, Creator, and Playground. Let''s see how all these can help us.


    ### Ionic View


    Ionic View makes it easy to share your application with your team members or your
    clients without using TestFlight in iOS or beta testing on Android. We can share
    our application with anyone easily without complicated beta provisioning. The
    initial step is to upload our application, which will ask for the login credentials
    of your Ionic account:


    ![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_250_0.png)


    Now you will be able to see your application with ID f8fec798 in your portal.
    You can now share your application with the Ionic share command, as soon as you
    share your application with an account they will now be able to download and preview
    your application. Currently, there are around 27 plugins supported, which you
    can check out at: https://docs.ionic.io/tools/view/.


    > There could be a chance that your application doesn''t fully work inside Ionic
    View as many Native plugins are not supported.


    ![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_251_0.png)


    Collaborators or accounts with which I have shared my application with will be
    able to see the application in their app list and can simply click and preview
    the application. There are multiple options available such as clear data, sync
    latest version, or delete the app:


    ![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_251_1.png)


    ### Ionic creator and playground


    There are another two tools that the Ionic creator and playground which Ionic
    platform provides. Ionic creator can be a good tool for prototyping and preparing
    UI mockups so that we can visualize quickly how the application will look like.
    Currently, under the free plan we can only drag and drop components, create pages/views,
    preview, share, and download code. Although, the Ionic team has launched many
    pro features that are available in paid plans such as code editing, theming, and
    packaging the creator application.


    Here we have tried to make a mockup for a currency convertor application using
    Ionic creator:


    ![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_254_0.png)


    We have added three tabs from the components sections. With a simple drag and
    drop UI we can easily add items. On the right-hand side you will see specific
    page or component properties, which are selected from the left-hand side. For
    example, if we click on List Page on the left-hand side, then it will show properties
    for a page such as Title, Routing URL, Background color, and Left/Right header
    buttons. Similarly, for each component we have different properties. There are
    some components and properties that are only available in the pro version:


    ![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_254_1.png)


    Let''s see how the application will look like once we preview it. There are four
    device options available for preview, iPhone, iPad, Android phone, and Android
    tablet:


    ![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_255_0.png)


    Ionic playground is a simple HTML, CSS, and JavaScript editor, which makes it
    incredibly easy to share Ionic demos with anyone around the world. You can think
    of playground as jsfiddle or plnkr for Ionic. We can fork and preview the applications
    we are working on. Playground can have a big impact on education and training
    developers in Ionic. For debugging purposes we can also use playground, another
    use case can be for quick prototypes and demos. Currently both Ionic creator and
    playground are based on Ionic 1 and our main focus here is on Ionic 3, so we will
    not look at these topics in too much detail. You can read more about Ionic Creator
    at http://docs.usecreator.com/ and start playing with your first playground app
    at http://play.ionic.io/.


    Ionic ecosystem comprises of Ionic market, Ionic jobs, Ionic forum, Ionic shop,
    and Ionic showcase. Let''s get a brief idea about how exactly all of this works:


    - **Ionic Market:** This is the place where you will find many Ionic themes and
    plugins available both free and paid. We can also submit our work on Ionic market
    if we have built some interesting theme or plugin that can be useful for other
    developers.

    - **Ionic Jobs:** The best place to find a list of Ionic jobs.

    - **Ionic Forum:** Here you can interact with other developers, ask questions,
    and share your demos and ideas. It''s the best place to clear your doubts and
    check for similar problems you are facing.

    - **Ionic Showcase:** You can submit your production deployed work here and share
    app stores links and screenshots.

