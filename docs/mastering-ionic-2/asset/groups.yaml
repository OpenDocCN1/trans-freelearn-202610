  - '[PAGE 213]


    # Cordova versus phonegap


    There has been a lot of confusion and questions about Cordova and phonegap. Also,
    many people ask questions about which to use with Ionic. Although Ionic uses Cordova,
    we can also definitely use phonegap. Many still don''t know about Cordova as phonegap
    is before phonegap. Let''s quickly look back at its history; phonegap was created
    in 2009 by Nitobi. Later in 2011, Adobe took over Nitobi along with the rights
    to the phonegap platform. The Open source core code of the platform was donated
    to the Apache organization for further development. Phonegap is also free and
    open source. Initially, there was minimal difference between Cordova and phonegap,
    but slowly Adobe started building a proprietary set of services around phonegap.
    Phonegap build is one of those services. Cordova is the engine that powers phonegap,
    similar to webkit, which is the engine for the Chrome browser. There have been
    long debates upon which platform to use, there have been conflicts of interest
    between developers. Many criticize phonegap as a patch up version of Cordova,
    only using phonegap for its features such as the remote build option. At the end
    this is nothing to do with Ionic and it''s independent of this debate. As a developer,
    you are free to use any of these.


    If you still want to use phonegap and take advantage of the services built, you
    can easily choose that while building the project with phonegap. Ionic CLI commands
    use Cordova, so you will need to install and use Cordova.'
