  - "[PAGE 58]\n\n# Services match providers\n\nServices and Factory are important\
    \ parts of Angular 1x where we communicate with a remote server for data. We used\
    \ to define APIs call inside factory functions that controllers calls for fetching\
    \ data from the servers:\n\n```\n// Factory method in Angular 1x\nangular.module('wedding.services',\
    \ [])\n\n// DI of $http for HTTP calls to servers\n// $q for promises\n.factory('CategoryService',\
    \ function ($http, $q) {\nvar catalog  = {};\n\ncatalog.getCategories = function\
    \ () {\n    // here we will call APIs\n}\n})\n```\n\nNow you will see how we have\
    \ migrated our code to Angular 4 providers. The same getCategories() method that\
    \ was inside factory in Angular 1, will now be moved inside the categoryData()\
    \ class in Angular 4:\n\n```\n// Provider in Angular 4\nimport { Injectable }\
    \ from '@angular/core';\nimport { Http } from '@angular/http';\n\n@Injectable()\n\
    export class CategoryData {\n\nconstructor(private http: Http) {}\n\ngetCategories()\
    \ {\n\nreturn new Promise(resolve => {\n    // We're using Angular Http provider\n\
    \    // to request the data,\n    // then on the response it'll map the\n    //\
    \ JSON data to a parsed JS object.\n    // Next we process the data and\n    //\
    \ resolve the promise with the new\n    // data.\n\nthis.http.get('www.veloice.com/data.json').subscribe(res\
    \ => {\n    // we've got back the raw data, now\n    // generate the core schedule\
    \ data\n    // and save the data for later\n    // reference\n    this.data =\
    \ this.processData(res.json());\n    resolve(this.data);\n});\n});\n}\n}\n```\n\
    \nYou will notice that the Provider class has a @Injectable decorator. This decorator\
    \ lets Angular 4 know that the specific class can be used with the dependency\
    \ injector."
