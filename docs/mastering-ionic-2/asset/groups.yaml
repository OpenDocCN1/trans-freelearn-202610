  - "[PAGE 299]\n\n# Building TasteBite and installing Firebase\n\nLet's first start\
    \ by creating an application from scratch and install all the plugins and packages\
    \ required in this application. In this application we will be using the Tabs\
    \ template and integrating Lazy Loading. We will be using geolocation, camera,\
    \ and in-app browser plugins in our application:\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_299_0.png)\n\
    \n```\n$ ionic start tastebite tabs\n$ ionic cordova:platform add android\n$ ionic\
