  - "[PAGE 316]\n\n# Structuring and securing data\n\nWhile storing and structuring\
    \ data inside Firebase we have to think twice about how we will be fetching the\
    \ data for the application. This problem is the same as when we use any other\
    \ NOSQL database such as MongoDB. We should prefer flattening data rather than\
    \ nesting everything and while fetching the data we have to join the flattened\
    \ data.\n\nLet's take the example of a blogging website where users create blog\
    \ posts and all blog posts have comments. So, rather than nesting data in Firebase\
    \ we prefer to divide it:\n\n```\n\"users\": {\n    \"user1\": {\n        \"name\"\
    : \"John Smith\",\n        \"type\": \"editor\"\n        \"blogs\": {\n      \
    \      \"post1\": {\n                \"id\": 123456\n                \"title\"\
    : \"welcome of ionic\",\n                \"post\": \"Ionic is opensource SDK or\
    \ hybrid apps\"\n            },\n            \"post2\": {\n                \"\
    id\": 123457\n                \"title\": \"welcome of ionic\",\n             \
    \   \"post\": \"Ionic is opensource SDK or hybrid apps\"\n            }\n    \
    \    }\n    },\n    \"user2\": {\n        \"name\": \"Adam\",\n        \"type\"\
    : \"admin\"\n        \"blogs\": {\n            \"post1\": {\n                \"\
    id\": 234567\n                \"title\": \"welcome of ionic\",\n             \
    \   \"post\": \"Ionic is opensource SDK or hybrid apps\"\n            }\n    \
    \    }\n    }\n}\n```\n\nThis way of storing the data is initially easy to handle\
    \ but later on, as the data increases, querying the dataset will be slow and performance\
    \ will be harmed. So, the best way to store data is:\n\n```\n\"users\": {\n  \
    \  \"user1\": {\n        \"name\": \"John Smith\",\n        \"type\": \"editor\"\
    \n        \"blogs\": {\n            \"123456\" : true,\n            \"123457\"\
    \ : true\n        }\n    },\n    \"user2\": {\n        \"name\": \"Adam\",\n \
    \       \"type\": \"editor\"\n        \"blogs\": {\n            \"234567\" : true\n\
    \        }\n    }\n},\n\"blogs\": {\n    \"123456\": {\n        \"title\": \"\
    welcome of ionic\",\n```"
  - "[PAGE 317]\n\n```\n```json\n\"post\": \"Ionic is opensource SDK or hybrid apps\"\
    \n},\n\"123457\": {\n  \"title\": \"welcome of ionic 2\",\n  \"post\": \"Ionic\
    \ is opensource SDK or hybrid apps\"\n}\n}\n```\n```\n\nNow we have stored the\
    \ data inside Firebase and the next step is to fetch the data and joining back.\
    \ Joining flattened data is a bit difficult but this approach comes with a lot\
    \ of performance and modularity. Let's see how we can fetch the above data and\
    \ join it.\n\nAs Firebase uses web sockets performance will be high while fetching\
    \ the data this way and Firebase internally do optimization on incoming and outgoing\
    \ requests.\n\nFirebase also provides a set of security rules for securing our\
    \ data and help determine who has read and write permission for the data set.\
    \ All the security rules in dashboard inside the Security & Rules tab. Inside\
    \ our application our application data is user-defined and associated to the user,\
    \ so we have set the rules accordingly:\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_317_0.png)\n\
    \nThere are three types of rule:\n\n+   - `.read` - when data is allowed to read\
    \ be by users\n+   - `.write` - when data is allowed to be written\n+   - `.validate`\
    \ - defines correctly formatted data and validates before pushing to the database\n\
    \nSecurity rules are in the JSON structure as you see in the previous screenshot\
    \ and this makes it easier to understand and set rules. You will be associated\
    \ with user, so we have set the rules accordingly. In our application we first\
    \ need to store the user-related data during the signup process such as the name,\
    \ e-mail, and other details:\n\n```\n```json\n{\n```\n```"
  - "[PAGE 318]\n\n```\n\"rules\": {\n  \"users\": {\n    \"$user_id\": {\n      \"\
    .read\": \"$user_id === auth.uid\",\n      \".write\": \"$user_id === auth.uid\"\
    \n    }\n  }\n}\n```\n\nWe have created a users model to store these details.\
    \ We have nested the data inside a $user_id key so that we can create an access\
    \ control and only user who created this data set can edit and access it. Similarly\
    \ for a \"feeds\" users can only read the feeds and can't write a feed on it:\n\
    \n```\n\"feeds\": {\n  \".read\": true,\n  \".write\": false\n}\n```\n\nThere\
    \ are ways inside Firebase that help increase performance while querying data.\
    \ For example if we have score of students inside a model and we need to query\
    \ that data by score then we can use .indexOn inside the rule so that performance\
    \ while fetching records increases. You can study more about securing data inside\
    \ Firebase here: https://firebase.google.com/docs/database/security/."
