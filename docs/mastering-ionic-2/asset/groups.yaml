    # Summary


    Using Ionic with the BASS platform really ease a lot of tensions for a startup
    company as you will have the application built in less time for multiple platforms
    and without needing any resources or time for set up the backend server. Nowadays,
    a lot of growing companies are moving towards Ionic due to its development speed
    and lower cost. Small teams of developers with good JavaScript skills can build
    everything and even if they want to have a backend for custom tasks they can use
    Node.js and build an entire stack over JavaScript. Platform such as Firebase is
    really powerful for mobile application as it uses web sockets, which are really
    fast and provide real-time data synchronization.


    Next we will work on some interesting latest technology IOT. Ionic has been quite
    famous with developers for quickly preparing applications to control various IOT
    devices via bluetooth or HTTP APIs. We will focus on building applications using
    the BLE and iBeacons protocols. We will be also going through Google''s Physical
    Web initiative using the Eddystone protocol, which gives physical interaction
    with physical objects. Also, there are multiple IOT devices available on the market
    and we can interface with them easily with Ionic applications and solve many problems.'
