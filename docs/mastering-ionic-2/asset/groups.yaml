    \    )\n)\n```\n\nYou can now use this color key as a property to many components,\
    \ such as `buttons`:\n\n```html\n<button facebook>Share on Facebook</button>\n\
    ```\n\nSASS is really powerful and it speeds up the CSS development process. It\
    \ acts as a Swiss army knife for CSS, where we can do multiple things with minimum\
    \ lines of code and then with just some changes we can easily change the entire\
    \ look and feel of the application. There are so many examples of how we can use\
    \ SASS, but as we are more into Ionic development, I recommend going through some\
    \ good SASS documentation and Ionic 3 theming docs once so that detailed information\
    \ will be provided.\n\n**$ ionic resources**\n\nIonic automatically crops, resizes,\
    \ and creates icons and splash screens from source images for each platform and\
    \ it does this in different sizes for different devices such as mobiles, tablets,\
    \ and so on. All these are generated on Ionic's resizing and cropping servers\
    \ without any overload from installing libraries or plugins on local machines.\n\
    \n**$ ionic resources --icon**\n\n**$ ionic resources --splash**\n\nIf a proper\
    \ size is not provided for the source files, this will only create resources that\
    \ are less than the size of the source image. For example, there might be chances\
    \ that resources for tablets or high resolution screens are not generated.\n\n\
    ## Platform specific resources\n\nIonic provides support for building icons and\
    \ splash screen resources for various platforms and devices. For building resources,\
    \ we just need to place the source image inside the resources folder with the\
    \ name `icon.png` and `splash.png`. This way you will get the extracted icons\
    \ and splash screens for each platform, such as a Native rounded corners icon\
    \ for iOS, and transparent background for an Android icon.\n\nTo summarize the\
    \ steps:\n\n- Add files to the resources folder naming `icon.png` and `splash.png`.\
    \ (`.psd` and `.ai` can also be used).\n- Make sure the minimum size requirements\
    \ for icon are 192x192 px and for splash 2208x2208 px.\n- Run the `ionic resources`\
    \ command from the CLI.\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_72_0.png)\n\
    \n> Different platforms have different ways of styling icons, for example, iOS\
    \ will apply its rounded corners, that is why we recommend the `Ionic` source\
    \ file to be without rounded corners. Also, using the `ionic resources` command\
    \ will require at least Cordova 3.6 or more.\n"
  mdcn: "\n\n## 安装与设置\n\n在学习 Ionic 3 的过程中，大多数开发者之前已经有了 Ionic 的安装经验。我们可以通过 NPM 包安装\
    \ `ionic`；目前 Ionic CLI v3 仍处于 beta 阶段，它彻底改变了 CLI 的工作方式，现在 Ionic 创建的默认项目基于 Ionic\
    \ 3：\n\n```bash\n$ npm install -g ionic\n```\n\n建议使用 Node 6.x 版本和 npm 3.x 版本。这个\
    \ beta 版本同时支持 Ionic 1 和 Ionic 2 项目。现在让我们开始创建一个项目：\n\n```bash\n// will create Ionic\
    \ 3x project\n$ ionic start wedding-planner sidemenu\n// will create Ionic 1x\
    \ project\n$ ionic start wedding-planner sidemenu --type ionic1\n// move to project\
    \ directory\n$ cd wedding-planner\n\n// run project with ionic serve\n$ ionic\
    \ serve\n```\n\n**接下来的步骤将是为应用添加所需的特定平台和插件：**\n\n```bash\n// For adding specific\
    \ platforms\n$ ionic cordova:platform add android\n\n// running application on\
    \ real device\n$ ionic cordova:run android\n\n// running inside an emulator\n\
    $ ionic cordova:emulate android\n```\n\n**接下来，我们将了解如何开始使用 Ionic 2 应用的代码库。你需要理解每个文件和文件夹的结构及其工作方式。**\n\
    \n## 目录结构与模块化\n\n在 Ionic 1x 中，我们并没有最佳的目录或项目结构。随着 Ionic 和 Angular 的逐步演进，开发者倾向于采用模块化方式来组织文件和文件夹。在\
    \ Ionic 1x 中，管理文件和文件夹有许多不同方式。通常，你在 Ionic 1x 构建中看到的默认结构可以用于许多小型项目（我们不需要处理大量文件）；对于基于\
    \ Ionic 1x 的项目，主要遵循两种结构：**byFolderType** 和 **byFeatureType**。Ionic 3 的最大优点之一是项目结构以模块化方式设置，其中包含\
    \ pages、providers、pipes、theme 文件夹，以及它们各自的下级文件夹。下面我们来了解 Ionic 3 项目中的一些重要文件：\n\n\
    - `./src`\n\n  这里存放着我们整个应用的代码库，它是最重要的部分：\n\n- `./node_modules`\n\n  这里存放着运行应用所需的全部依赖和\
    \ NPM 包：\n\n- `./platforms`\n\n  这里包含应用所使用的特定平台文件夹条目。当我们运行 `ionic platform add`\
    \ 命令时，你会看到在 `platform` 文件夹内创建了相应的文件夹：\n\n- `./plugins`\n\n  应用中使用到的所有插件都存放在这里：\n\
    \n- `./resources`\n\n  整套图标和启动屏（splash screens）都在这个文件夹中，并按不同平台和设备进行了组织：\n\n- `./www`\n\
    \n  这里存放着我们的 `index.html` 文件；`src` 文件夹中的代码库编译后，bundle、文件、图片以及 SASS 编译生成的 CSS 文件都会被放入\
    \ `www` 中：\n\n- `./www/index.html`\n\n  这是我们的应用（也可以说是每个混合应用）的入口点。我们主要在此文件中声明运行应用所需的脚本和样式表。与\
    \ Ionic 1 中使用 ng-app 类似，在 Ionic 3 中我们要检查 `index.html` 文件中的 `<ion-app></ion-app>`：\n\
    \n- `./package.json`\n\n  该文件定义了项目元数据以及将添加到 `node_modules` 文件夹中的依赖。它还包含应用所使用的\
    \ Cordova 平台和插件信息：\n\n- `./ionic.config.json`\n\n  该文件包含项目专属设置，如名称、ID、代理（proxies）以及其他信息：\n\
    \n- `./src/app/main.ts`\n\n  这是我们进入代码库的起点，同时我们也会在这个文件中引导启动（bootstrap）应用：\n\n-\
    \ `./src/app/app.module.ts`\n\n  在这个文件中，我们声明应用中使用的页面、指令和 providers：\n\n- `./src/app/app.component.ts`\n\
    \n  我们在这里设置根页面，并且根组件会首先被调用，它控制着整个应用，类似于 Ionic 1 中 `app.js` 文件的作用。不过，这个 `component`\
    \ 与应用中其他组件并无不同；它只是在 `app` 文件夹中声明。在后续章节中开始构建应用时，我们将更深入地了解如何处理所有这些文件和代码库。\n\n##\
    \ 自定义\n\n现在 SASS 的基础设置已经准备好了；同时，在运行 `ionic serve` 时，你可以为每个组件或页面在不同文件中添加所有自定义样式和\
    \ SASS 相关的修改。让我们先从修改 `variable.scss` 文件中默认存在的一个颜色变量开始：\n\n```scss\n/*\nTo customize\
    \ the look and feel of\n    Ionic, you can override the variables\nFor example,\
    \ you might change some of\n    the default colors:\n\n$colors: (\n    primary:\
    \    #387ef5,\n    secondary:  #32db64,\n    danger:     #f53d3d,\n    light:\
    \      #f4f4f4,\n    dark:       #222,\n    favorite:   #69BB7B,\n    twitter:\
    \    #53ACEB,\n    github:     #000000,\n    instagram:  #235D8D\n);\n\n// Fastest\
    \ way to change the theme of\n    your Ionic app is to set new value\n    for\
    \ primary color\n```\n\n你可以看到，我们添加了 Twitter 和 GitHub 等自定义颜色。我们还可以通过提供 base 和 contrast\
    \ 属性来进一步自定义：\n\n```scss\n$colors: (\n    facebook:(\n        base: #3b5998,\n\
    \        contrast: #ffffff\n    )\n)\n```\n\n现在你可以将此颜色键用作许多组件的属性，例如 `buttons`：\n\
    \n```html\n<button facebook>Share on Facebook</button>\n```\n\nSASS 非常强大，它能加快\
    \ CSS 开发流程。它就像 CSS 的瑞士军刀，可以用最少的代码完成很多事情，并且只需做一些改动就能轻松改变应用的整个外观和体验。关于如何使用 SASS\
    \ 有非常多的示例，但由于我们更专注于 Ionic 开发，我建议你抽时间阅读一些优秀的 SASS 文档和 Ionic 3 主题文档，这样可以获得更详细的信息。\n\
    \n**$ ionic resources**\n\nIonic 会自动裁剪、调整大小，并从源图片中为每个平台创建图标和启动屏，同时会针对手机、平板等不同设备生成不同尺寸。所有这些都是在\
    \ Ionic 的调整大小和裁剪服务器上生成的，无需在本地机器上安装库或插件，因此不会带来任何额外负担。\n\n**$ ionic resources --icon**\n\
    \n**$ ionic resources --splash**\n\n如果没有为源文件提供合适的尺寸，那么它只会创建小于源图片尺寸的资源。例如，平板或高分辨率屏幕所需的资源可能不会生成。\n\
    \n## 平台特定资源\n\nIonic 支持为各种平台和设备构建图标和启动屏资源。要构建资源，我们只需将源图片放到 resources 文件夹中，并命名为\
    \ `icon.png` 和 `splash.png`。这样，你就能获得每个平台所需的图标和启动屏，例如 iOS 使用原生圆角图标，Android 图标则使用透明背景。\n\
    \n总结步骤如下：\n\n- 将文件添加到 resources 文件夹，并命名为 `icon.png` 和 `splash.png`。（也可以使用 `.psd`\
    \ 和 `.ai` 格式）。\n- 确保图标的最小尺寸要求为 192x192 px，启动屏为 2208x2208 px。\n- 从 CLI 运行 `ionic\
    \ resources` 命令。\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_72_0.png)\n\n> 不同平台对图标样式有不同的处理方式，例如\
    \ iOS 会自动添加圆角，因此我们建议 `Ionic` 源文件不要带圆角。此外，使用 `ionic resources` 命令至少需要 Cordova 3.6\
    \ 或更高版本。\n\n"
