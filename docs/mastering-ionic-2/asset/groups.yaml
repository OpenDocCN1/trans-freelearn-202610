  - '[PAGE 279]


    # Sensitive data outside the app


    In our application, there might be some external APIs that we are using for fetching
    third- party content into our application. For this, you will get some kind of
    `secret_keys` specific to your account, which will be used when you hit their
    servers. Here we have to make sure that we don''t place any of these keys inside
    your Ionic application as someone can easily extract that from your code base.


    Here, the best way is to make a proxy request on your server or a custom request
    on your server-side code that will add the keys to the APIs calls. So you will
    be calling your server and then your server will pass a request to a third-party
    service with `secret_key` attached to the new request. In response the same response
    can be passed back to the client via a server from the third-party service:


    ![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_279_0.png)


    If, for example you have user specific keys then you have to ask the user to first
    login inside you application, which will then validate the user and the next API
    call from your server can get the respective `user_keys`, which can then be used
    for further communication with their third-party server. Also, make sure that
    you don''t have any business logic inside you application, which you can easily
    handle on the server side. Don''t assume that your source is secure as Ionic applications
    that are Cordova-based are built from HTML and JavaScript assets packaged in a
    native container. Anyone can reverse engineer to get into your code, so that is
    why we don''t ever place any sensitive information inside code.


    Similarly, for BAAS services such as Ionic Cloud and Firebase, you have to place
    the keys on the client side for directly calling these platform APIs. Although,
    if we have proper access control and have protected the application with auth
    and login protected, then only authenticated users can make request to the APIs.
    This will secure it from hackers to exhaust your number of API calls for your
    account.'
  md: "\n## CSRF\n\n**Cross Site Request Forgery (CSRF)** and many servers have this\
    \ security feature. We can also keep this feature in our Ionic-based application.\
    \ CSRF is a type of attack that occurs when malicious code performs an unwanted\
    \ action on a trusted site mainly using the user's cookies themselves when the\
    \ user is authenticated. To prevent CSRF with Angular and Ionic you need to set\
    \ correct headers for CSRF using the specific cookie name. This will keep away\
    \ hackers from sniffing your cookie session data and making requests pretending\
    \ to be an authenticated user.\n\nThis will set the CSRF request header to the\
    \ current value of the CSRF cookie for any request type not in `allowedMethods`.\n\
    \nSo to enable cookie-based auth in Angular you have to take care of another important\
    \ thing, setting the `withCredentials` flag of AJAX as true. This flag is set\
    \ on a low-level AJAX object, but in Angular we have to configure it with our\
    \ `Http` method.\n\n**Sample code snippet**\n\n```typescript\nimport { Http, Headers,\
    \ RequestOptions } from '@angular/http';\n\nsendData() {\n  let headers = new\
    \ Headers();\n  headers.append('X-CSRF-Token', token.token);\n  let options =\
    \ new RequestOptions({ headers: headers,\n    withCredentials: true });\n  this.http.post(\"\
    URL\", <stringified_data>, options)\n}\n```\n\nWhile many developer face issues\
    \ such as cookies expiring on restarting the application, if you face a similar\
    \ issue, make sure your cookies have an expiry set. Actually, browsers clear cookies\
    \ without an expiry on close.\n\n## Securing the Ionic application\n\nWith authentication\
    \ and authorization you have already secured all your data, but there are still\
    \ some things that we need to make sure of security while building your enterprise\
    \ grade Ionic application. Many things here we will be working around Cordova\
    \ to secure our application. As security is a deep and complicated topic, the\
    \ most important thing is to stay updated and try using the latest versions of\
    \ Cordova and Ionic. Usually, if there are some security vulnerabilities found\
    \ in Cordova you will soon see a patch for that and it will get fixed.\n\n## Whitelisting\n\
    \nDomain whitelisting is a security model that controls the access to external\
    \ domains. Cordova provides a configurable security policy to define which sites\
    \ to access. For Cordova 4.0 and newer, we should use `cordova-plugin-whitelist`\
    \ as it provides better security and configuration settings. Currently `cordova-plugin-whitelist`\
    \ supports Android higher than 4. For our platforms, we have to configure security\
    \ in the `config.xml` file: `<access origin=\"*\" />`\n\nWhile creating a project,\
    \ by default all the domains are whitelisted, which means you will have access\
    \ to all domains. Also, domain whitelisting is not available on and below Android\
    \ API 10. So this is another important thing to note that you set your `min-target-sdk`\
    \ above 10. Also, Ionic itself supports above Android version 4.4. It will work\
    \ on old devices and SDK, but it may have performance and other issues. Also,\
    \ we don't have a big market share of devices with less than Android 4.4. So for\
    \ building applications for the future we can ignore some share of the market\
    \ to make your application secure and good in performance. With new technologies\
    \ coming, such as the BLE support application, even many native applications are\
    \ only supporting latest versions.\n\nWe have already covered the whitelist plugin\
    \ in [Chapter 3, *Ionic Native and Plugins*] so you already have an idea of how\
    \ we can easily configure various settings and whitelist resources. The new content\
    \ security policy in the plugin gives you control over which network requests\
    \ (images, XHRs, and so on) are allowed to be made (via web view directly):\n\n\
    ```\n<!-- Allow everything but only from the same origin and foo.com -->\n<meta\
    \ http-equiv=\"Content-Security-Policy\" content=\"default-src 'self' foo.com\"\
    >\n```\n\n```\n<!-- Allows XHRs only over HTTPS on the same domain. -->\n<meta\
    \ http-equiv=\"Content-Security-Policy\" content=\"default-src 'self' https:\"\
    >\n```\n\n```\n<!-- Allow iframe to https://cordova.apache.org/ -->\n<meta http-equiv=\"\
    Content-Security-Policy\" content=\"default-src 'self'; frame-src 'self' https://cordova.apache.org\"\
    >\n```\n\nYou can find various other examples of configurations such as the previous\
    \ ones in the official documentation of the whitelist plugin: https://cordova.apache.org/docs/en/latest/reference/cordova-plugin-whitelist/.\n\
    \n## Enabling SSL\n\nThis is one of the most important points if you are transferring\
    \ secure data over networks to servers, before uploading your application to various\
    \ stores you should make it production ready and enable SSL for all the secure\
    \ requests. As most of the Ionic applications use REST APIs to get or post data\
    \ to servers, we should make sure that all of our secure requests are HTTPS. At\
    \ the same time, if your application doesn't have any critical data then you can\
    \ use HTTP also for this case.\n\nUsing self-signed certificates for production\
    \ applications is not recommended. If you want to introduce an SSL, make sure\
    \ that your server has a certificate properly signed by a well-known certificate\
    \ authority. The reason is that accepting self-signed certificates bypasses the\
    \ certificate chain validation, which allows any server certificate to be considered\
    \ valid by the device. This opens up the communication to man-in-the-middle attacks.\
    \ The data will be encrypted, but a man-in-the-middle can decrypt it with the\
    \ middleman's key. You can look at it as a normal web application where you always\
    \ make sure that all the secure information is sent in encrypted form to the server\
    \ so that no one can hack it in the middle. To make sure of this, it is very important\
    \ that you buy an SSL certificate from a well-known certificate authority.\n\n\
    ## Sensitive data outside the app\n\nIn our application, there might be some external\
    \ APIs that we are using for fetching third-party content into our application.\
    \ For this, you will get some kind of `secret_keys` specific to your account,\
    \ which will be used when you hit their servers. Here we have to make sure that\
    \ we don't place any of these keys inside your Ionic application as someone can\
    \ easily extract that from your code base.\n\nHere, the best way is to make a\
    \ proxy request on your server or a custom request in your server-side code that\
    \ will add the keys to the API calls. So you will be calling your server and then\
    \ your server will pass a request to a third-party service with `secret_key` attached\
    \ to the new request. In response, the same response can be passed back to the\
    \ client via a server from the third-party service:\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_279_0.png)\n\
    \nIf, for example, you have user-specific keys then you have to ask the user to\
    \ first log in inside your application, which will then validate the user and\
    \ the next API call from your server can get the respective `user_keys`, which\
    \ can then be used for further communication with their third-party server. Also,\
    \ make sure that you don't have any business logic inside your application, which\
    \ you can easily handle on the server side. Don't assume that your source is secure,\
    \ as Ionic applications that are Cordova-based are built from HTML and JavaScript\
    \ assets packaged in a native container. Anyone can reverse engineer to get into\
    \ your code, so that is why we don't ever place any sensitive information inside\
    \ your code.\n\nSimilarly, for BaaS services such as Ionic Cloud and Firebase,\
    \ you have to place the keys on the client side for directly calling these platform\
    \ APIs. Although, if we have proper access control and have protected the application\
    \ with auth and login protection, then only authenticated users can make requests\
    \ to the APIs. This will secure it from hackers who try to exhaust your number\
    \ of API calls for your account.\n"
  mdcn: "\n\n## CSRF\n\n**跨站请求伪造 (CSRF)** 许多服务器都具有此安全功能。我们也可以在基于 Ionic 的应用程序中保留此功能。CSRF\
    \ 是一种攻击，当恶意代码在用户已通过身份验证时，主要使用用户自己的 cookie 在受信任的网站上执行不需要的操作时就会发生。为了防止 Angular 和\
    \ Ionic 中的 CSRF，你需要使用特定的 cookie 名称设置正确的 CSRF 头。这将阻止黑客嗅探你的 cookie 会话数据并冒充已认证用户发起请求。\n\
    \n这将为不在 `allowedMethods` 中的任何请求类型设置 CSRF 请求头，使其等于 CSRF cookie 的当前值。\n\n因此，要在 Angular\
    \ 中启用基于 cookie 的身份验证，你必须处理另一件重要的事情，将 AJAX 的 `withCredentials` 标志设置为 true。该标志设置在低级的\
    \ AJAX 对象上，但在 Angular 中我们必须使用我们的 `Http` 方法进行配置。\n\n**示例代码片段**\n\n```typescript\n\
    import { Http, Headers, RequestOptions } from '@angular/http';\n\nsendData() {\n\
    \  let headers = new Headers();\n  headers.append('X-CSRF-Token', token.token);\n\
    \  let options = new RequestOptions({ headers: headers,\n    withCredentials:\
    \ true });\n  this.http.post(\"URL\", <stringified_data>, options)\n}\n```\n\n\
    虽然许多开发者在重新启动应用程序时遇到 cookie 过期的情况，如果你遇到类似问题，请确保你的 cookie 已设置过期时间。实际上，浏览器会在关闭时清除没有过期时间的\
    \ cookie。\n\n## 保护 Ionic 应用程序\n\n通过身份验证和授权，你已经保护了所有数据，但在构建企业级 Ionic 应用程序时，仍有一些安全事项需要确保。这里我们将围绕\
    \ Cordova 来保护我们的应用程序。由于安全是一个深奥且复杂的话题，最重要的是保持更新并尝试使用最新版本的 Cordova 和 Ionic。通常，如果在\
    \ Cordova 中发现某些安全漏洞，你很快就会看到补丁并得到修复。\n\n## 白名单\n\n域名白名单是一种安全模型，用于控制对外部域的访问。Cordova\
    \ 提供可配置的安全策略来定义要访问哪些站点。对于 Cordova 4.0 及更高版本，我们应使用 `cordova-plugin-whitelist`，因为它提供更好的安全性和配置设置。目前\
    \ `cordova-plugin-whitelist` 支持 Android 4 以上。对于我们的平台，我们必须在 `config.xml` 文件中配置安全：`<access\
    \ origin=\"*\" />`\n\n在创建项目时，默认情况下所有域名都被列入白名单，这意味着你将可以访问所有域名。此外，域名白名单在 Android\
    \ API 10 及以下不可用。因此，这也是需要注意的重要事项，即将你的 `min-target-sdk` 设置在 10 以上。此外，Ionic 本身支持\
    \ Android 4.4 以上版本。它可以在旧设备和 SDK 上运行，但可能会有性能和其他问题。此外，我们在 Android 4.4 以下设备的市场份额并不大。因此，为了构建面向未来的应用程序，我们可以忽略一部分市场份额，以使你的应用程序更安全、性能更好。随着新技术的出现，例如\
    \ BLE 支持的应用程序，甚至许多原生应用程序也只支持最新版本。\n\n我们已经在 [第 3 章，*Ionic Native 和插件*] 中介绍过白名单插件，因此你已经了解如何轻松配置各种设置并列入白名单资源。插件中的新内容安全策略使你能够控制哪些网络请求（图像、XHR\
    \ 等）允许通过 webview 直接发出：\n\n```\n<!-- Allow everything but only from the same origin\
    \ and foo.com -->\n<meta http-equiv=\"Content-Security-Policy\" content=\"default-src\
    \ 'self' foo.com\">\n```\n\n```\n<!-- Allows XHRs only over HTTPS on the same\
    \ domain. -->\n<meta http-equiv=\"Content-Security-Policy\" content=\"default-src\
    \ 'self' https:\">\n```\n\n```\n<!-- Allow iframe to https://cordova.apache.org/\
    \ -->\n<meta http-equiv=\"Content-Security-Policy\" content=\"default-src 'self';\
    \ frame-src 'self' https://cordova.apache.org\">\n```\n\n你可以在白名单插件的官方文档中找到各种其他配置示例，如上所述：https://cordova.apache.org/docs/en/latest/reference/cordova-plugin-whitelist/。\n\
    \n## 启用 SSL\n\n如果你通过网络向服务器传输安全数据，这是最重要的要点之一，在将应用程序上传到各种商店之前，你应该使其生产就绪并为所有安全请求启用\
    \ SSL。由于大多数 Ionic 应用程序使用 REST API 向服务器获取或发布数据，我们应该确保所有安全请求都是 HTTPS。同时，如果你的应用程序没有任何关键数据，那么对于这种情况也可以使用\
    \ HTTP。\n\n对于生产应用程序，不建议使用自签名证书。如果你想引入 SSL，请确保你的服务器具有由知名证书颁发机构正确签名的证书。原因在于接受自签名证书会绕过证书链验证，这会使任何服务器证书都被设备视为有效。这会使通信暴露于中间人攻击。数据将被加密，但中间人可以用中间人的密钥解密它。你可以将其视为一个普通的\
    \ Web 应用程序，在其中你始终确保所有安全信息以加密形式发送到服务器，以便没有人能在中间窃取它。为了确保这一点，购买由知名证书颁发机构颁发的 SSL 证书非常重要。\n\
    \n## 应用程序外的敏感数据\n\n在我们的应用程序中，可能有一些外部 API 用于获取第三方内容到我们的应用程序中。对于此，你将获得一些特定于你账户的\
    \ `secret_keys`，当你访问他们的服务器时会使用它们。在这里，我们必须确保不要将这些密钥放在你的 Ionic 应用程序中，因为有人可以很容易地从你的代码库中提取出来。\n\
    \n这里最好的方法是，在你的服务器上进行代理请求或在你的服务器端代码中进行自定义请求，该请求会将密钥添加到 API 调用中。因此，你将调用你的服务器，然后你的服务器会将请求连同\
    \ `secret_key` 一起传递给第三方服务。在响应中，相同的响应可以从第三方服务通过服务器传递回客户端：\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_279_0.png)\n\
    \n如果例如你有用户特定的密钥，那么你必须要求用户首先在你的应用程序中登录，这将验证用户，然后来自你的服务器的下一个 API 调用可以获取相应的 `user_keys`，然后可用于与他们的第三方服务器进一步通信。此外，请确保你的应用程序中没有任何业务逻辑，你可以在服务器端轻松处理。不要假设你的源代码是安全的，因为基于\
    \ Cordova 的 Ionic 应用程序是由打包在原生容器中的 HTML 和 JavaScript 资源构建的。任何人都可以逆向工程进入你的代码，因此我们永远不会在你的代码中放置任何敏感信息。\n\
    \n同样，对于 BaaS 服务，如 Ionic Cloud 和 Firebase，你必须将密钥放在客户端以直接调用这些平台 API。尽管如此，如果我们有适当的访问控制并通过身份验证和登录保护保护了应用程序，那么只有经过身份验证的用户才能向\
    \ API 发出请求。这将防止黑客试图耗尽你账户的 API 调用次数。\n\n"
