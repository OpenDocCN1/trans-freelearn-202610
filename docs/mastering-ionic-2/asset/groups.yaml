    \ Ionic Cloud services and then the tools available for quick prototyping. Combining\
    \ all these services can be really helpful; auth and Ionic DB together gives you\
    \ a lot more options for your application to do customizations.\n\nIonic services\
    \ such as IonicDB are a really interesting addition. There have been plans that\
    \ new tools for testing will be launched by Ionic anytime in the future. The next\
    \ big thing will be deployment of the same codebase as a desktop application using\
    \ Electron bringing platform continuity.\n\nIn Chapter 5, *Authentication, Authorization,\
    \ and Security* we will be looking into some security aspects for our Ionic application.\
    \ Starting from some common security practices to integrating authentication and\
    \ authorization inside our application and how we can protect our private views\
    \ from being accessed by non-authenticated users. We will look at storing sensitive\
    \ data and read and write data through the network securely so that nobody can\
    \ intercept it. Also, we will see some basic security key points that we should\
    \ consider before publishing your application to app stores.\n\n## Authentication,\
    \ Authorization, and Security\n\nWe will now be looking at another important aspect\
    \ of building enterprise applications, which is security. There will be many applications\
    \ that have user sensitive content and we don't want to expose everything to everyone.\
    \ This is where authentication and authorization comes into play. Although, in\
    \ this chapter, we will be closer to the Angular side of Ionic as the majority\
    \ of work will be coding in Angular.\n\nAlso, the Ionic community provides a good\
    \ amount of information about it and how to use it, so we will be looking into\
    \ all these things. Another important part in this chapter will be securing the\
    \ application, as there are many things we have to take into consideration before\
    \ deploying the app to production so that no one can easily get into your code.\n\
    \nDuring my research on securing hybrid applications and how it's different from\
    \ native, I found this: \"It doesn't matter if you use native code or hybrid code,\
    \ if someone is dedicated enough, they can still work around it and see your source\
    \ code.\" At the end it's our responsibility how difficult we can make it to hack\
    \ it around. Taking into consideration that we don't share or put sensitive information\
    \ inside our codebase. We will be looking into all this in this chapter:\n\n-\
    \ Authentication\n- Securing Ionic applications\n- Demonstrating authorization\
    \ in Ionic\n\n## Authentication\n\nAngular is the core of Ionic and most of the\
    \ work with respect to authentication and authorization will be handled in code.\
    \ There are mainly two ways of implementing server-side authentication for frontend\
    \ applications. You can look at the Ionic app as an Angular frontend application.\
    \ All of what we will cover can be treated as common and can be used on the Web\
    \ as well as Ionic-based hybrid applications. Mainly there are two ways that we\
    \ can usually handle authentication:\n\n- Token-based\n- Cookie-based\n\n### Token\
    \ based authentication\n\nToken based authentication is a newer approach of authentication\
    \ in many web applications. In this approach authentication is successful when\
    \ a user proves to the server of their validity by passing the user token, which\
    \ then is verified by the server. Before getting started with the token-based\
    \ approach, let's quickly see some benefits of using this approach:\n\n- Stateless\n\
    - Mobile-ready\n- Performance\n- More secure\n- Standard based JWT\n- There are\
    \ many other benefits of using the token based approach, such as you can serve\
    \ all your assets (HTML, CSS, and JS) via CDN and your server side is just an\
    \ API, which will improve the performance\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_263_0.png)\n\
    \nIn a token based approach you first need to get a valid token, which you usually\
    \ will get as a response of login request in many applications. Let's take an\
    \ example of the Facebook Connect API. Every time you login via Facebook it returns\
    \ a token in the response. The token then will be used in future to get a set\
    \ of user information from Facebook; Facebook uses that token to validate the\
    \ user and on validation provides the information.\n\nFor an Ionic application,\
    \ we can store that token to local storage or session storage for future use.\
    \ We need to extend the default HTTP class for setting an authorization header\
    \ for every outgoing request from our Ionic application. You can see how easy\
    \ it's working with token based authentication; you don't need to think about\
    \ security issues such as CSRF as you are not relying on cookies.\n\nAlmost all\
    \ of the web applications previously were based on cookies and they handle user\
    \ sessions in cookies. These require the server to authenticate the user's cookies\
    \ on every request. As we are moving towards a modern token based authentication\
    \ approach, there are still some applications using a cookie-based authentication\
    \ approach. Although we can implement the same cookie-based authentication on\
    \ our Ionic application, it is not recommended. We will cover mainly the token\
    \ based approach here and will demonstrate it in an application.\n\n## CORS\n\n\
    **Cross-Origin Resource Sharing (CORS)** was designed mainly to access resources\
    \ from cross domains. Cross-domain policy does not apply to Cordova, so we don't\
    \ have to think much about it when testing on a device. While running the same\
    \ app on a browser it might give a CORS error while accessing resources from the\
    \ cross domain. When you run the `ionic serve` command you will see this issue.\
    \ There are four methods to bypass it:\n\n- Disable Chrome security\n- Browser\
    \ extension\n- Proxy server\n- The easiest and most convenient way is to run the\
    \ application in Google Chrome with flag: `--disable-web-security`:\n\n```\n$\
    \ google-chrome --disable-web-security\n$ chromium-browser --disable-web-security\n\
    ```\n\nYou can run the same command for chromium browser also. Make sure you have\
    \ closed the running google-chrome or chromium before you run it with this command.\
    \ When you open it with disabling web security, you will see a warning message\
    \ on the browser mentioning \"You are using an unsupported command-line flag:\
    \ --disable-web-security. Stability and security will suffer\".\n\nAnother way\
    \ would be to install a browser extension, which will allow/disable CORS. Usually,\
    \ these plugins internally change the response header for any XHR request when\
    \ they are turned on. There are many extensions available, such as **CORS toggle**\
    \ and **Force CORS**.\n\n## Proxy server for the Ionic app\n\nSetting up a proxy\
    \ server will take some time and it is only required if you want to run `ionic\
    \ serve` and `ionic run -l`. We will see how Ionic CLI provides an easily configurable\
    \ proxy server.\n\nProxy server here will act as an intermediary for all the requests\
    \ from client to server. It will take a client's request and issue a new request\
    \ to the server and then on response from the server it will forward the response\
    \ back to the client. Since the server is sending a new request to your destination,\
    \ there will be no origin and therefore, no CORS needed. It is important to note\
    \ that the browser adds the Origin header.\n\nFor setting up proxy server we have\
    \ to do the following mentioned changes:\n\n- Set up proxy in `ionic.config.json`\n\
    - Set up Angular constant\n- Use constant in Angular services\n\nLet's start with\
    \ setting up proxy settings in the `ionic.config.json` file. Proxy settings contain\
    \ two important things, `path` and `proxyUrl` inside the proxies array. You can\
    \ have multiple proxies inside that array:\n\n```\n{\n  \"name\": \"ionic2-auth\"\
    ,\n  \"app_id\": \"\",\n  \"v2\": true,\n  \"proxies\": [\n    {\n      \"path\"\
    : \"/api\",\n      \"proxyUrl\": \"http://api.yourwebsite.com/api\"\n    }\n \
    \ ]\n}\n```\n\nYou now have specified inside your `ionic.config.json` that whenever\
    \ you will access `http://localhost:8100/api` it will proxy that request to `http://api.yourwebsite.com/api`\
    \ on your behalf. So this will solve the CORS issue. For setting up the APIs endpoints,\
    \ we have created `constants` file where we have declared a constant, `API_URL`:\n\
    \n```\n// src/providers/constants.ts\n// While deploying application we switch\
    \ to real URL\nexport const API_URL: string =\n  'http://localhost:8100/api';\n\
    ```\n\nWhen building the application, we can replace it with a real `API_URL`\
    \ that we mentioned as `proxyUrl`:\n\n```\n// src/providers/data-service.ts\n\n\
    import { Injectable } from '@angular/core';\nimport { HttpClient } from './http-client';\n\
    import { Observable } from 'rxjs/Observable';\nimport 'rxjs/add/operator/map';\n\
    import { API_URL } from './constants';\n\nexport class DataService {\n  constructor(public\
    \ http: HttpClient, public storage: Storage) {}\n\n  login(data): Observable<any>\
    \ {\n    return this.http.post(API_URL + '/login', data).map(res => res.json());\n\
    \  }\n}\n```\n"
  mdcn: "\n\n## 摘要\n\n随着 Ionic 团队正在开发的服务和工具数量不断增加，你可以看到 Ionic 作为一个社区和产品都在以良好的速度发展。我们已经讨论了\
    \ Ionic 生态系统的所有服务，从 Ionic Cloud 服务开始，再到可用于快速原型制作的工具。将这些服务结合起来会非常有帮助；认证和 Ionic\
    \ DB 一起可以为你的应用提供更多定制化的选择。\n\nIonicDB 等 Ionic 服务是一个很有意思的补充。有计划称 Ionic 未来会随时推出新的测试工具。下一件大事将是使用\
    \ Electron 将同一代码库部署为桌面应用，从而实现平台连续性。\n\n在第5章 *认证、授权与安全* 中，我们将探讨 Ionic 应用的一些安全方面。从一些常见的安全实践，到在我们的应用中集成认证和授权，以及如何保护我们的私有视图免遭未经认证用户的访问。我们将探讨安全地存储敏感数据以及通过网络读写数据，以免被他人截获。此外，我们还会看到在将应用发布到应用商店之前应考虑的一些基本安全要点。\n\
    \n## 认证、授权与安全\n\n现在我们将探讨构建企业应用的另一个重要方面：安全性。许多应用包含用户敏感内容，我们不希望将所有内容暴露给所有人。这正是认证和授权发挥作用的地方。不过，在本章中，我们将更侧重于\
    \ Ionic 的 Angular 部分，因为大部分工作将是用 Angular 编写代码。\n\n此外，Ionic 社区提供了大量关于此主题及其用法的信息，因此我们将探讨所有这些内容。本章另一个重要部分是保护应用程序的安全，因为在将应用部署到生产环境之前，我们必须考虑许多事项，确保没有人能轻易进入你的代码。\n\
    \n在对混合应用的安全性及其与原生应用的区别进行研究时，我发现了这样一句话：“无论你使用原生代码还是混合代码，如果一个人足够执着，他们仍然可以绕过并看到你的源代码。”最终，我们能在多大程度上增加其被攻击的难度，取决于我们自己，同时还要注意不要在代码库中分享或放置敏感信息。我们将在本章中探讨所有这些内容：\n\
    \n- 认证\n- 保护 Ionic 应用\n- 在 Ionic 中演示授权\n\n## 认证\n\nAngular 是 Ionic 的核心，与认证和授权相关的大部分工作将在代码中处理。对于前端应用，实现服务器端认证主要有两种方式。你可以将\
    \ Ionic 应用视为 Angular 前端应用。我们将介绍的所有内容都可以视为通用内容，既可用于 Web，也可用于基于 Ionic 的混合应用。通常我们处理认证主要有两种方式：\n\
    \n- 基于令牌（Token）\n- 基于 Cookie\n\n### 基于令牌的认证\n\n基于令牌的认证是许多 Web 应用中较新的认证方式。在这种方式下，当用户通过传递其用户令牌向服务器证明其有效性时，认证即成功，服务器会验证该令牌。在开始基于令牌的方式之前，让我们快速了解使用这种方式的一些好处：\n\
    \n- 无状态\n- 移动端友好\n- 性能\n- 更安全\n- 基于标准的 JWT\n- 使用基于令牌的方式还有其他许多好处，例如你可以通过 CDN 提供所有静态资源（HTML、CSS\
    \ 和 JS），而服务器端只是一个 API，这将提高性能\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_263_0.png)\n\
    \n在基于令牌的方式中，你首先需要获取一个有效令牌，在许多应用中，通常可以通过登录请求的响应获得。以 Facebook Connect API 为例，每次通过\
    \ Facebook 登录时，响应中都会返回一个令牌。该令牌将来会被用来从 Facebook 获取一组用户信息；Facebook 使用该令牌验证用户身份，验证通过后提供相关信息。\n\
    \n对于 Ionic 应用，我们可以将该令牌存储在本地存储或会话存储中供以后使用。我们需要扩展默认的 HTTP 类，以便为 Ionic 应用发出的每个传出的请求设置授权头。你可以看到基于令牌的认证使用起来非常简单；你不需要担心如\
    \ CSRF 等安全问题，因为你没有依赖 Cookie。\n\n以前几乎所有 Web 应用都基于 Cookie，并通过 Cookie 处理用户会话。它们要求服务器在每个请求上验证用户的\
    \ Cookie。随着我们转向现代的基于令牌的认证方式，仍有一些应用使用基于 Cookie 的认证方式。虽然我们可以在 Ionic 应用中实现同样的基于 Cookie\
    \ 的认证，但不建议这样做。这里我们将主要介绍基于令牌的方式，并在应用中演示它。\n\n## CORS\n\n**跨域资源共享（CORS）** 的设计初衷是跨域访问资源。跨域策略不适用于\
    \ Cordova，因此在设备上测试时我们无需过多考虑。但在浏览器中运行同一个应用时，如果从跨域访问资源，可能会出现 CORS 错误。当你运行 `ionic\
    \ serve` 命令时，就会看到这个问题。有四种方法可以绕过它：\n\n- 禁用 Chrome 安全策略\n- 浏览器扩展\n- 代理服务器\n- 最简单且方便的方法是在\
    \ Google Chrome 中使用以下标志运行应用：`--disable-web-security`：\n\n```\n$ google-chrome\
    \ --disable-web-security\n$ chromium-browser --disable-web-security\n```\n\n对于\
    \ chromium 浏览器，你也可以运行同样的命令。请确保在运行此命令前已关闭正在运行的 google-chrome 或 chromium。当你启用禁用\
    \ Web 安全策略打开浏览器时，会在浏览器中看到一条警告消息：“您正在使用一个不受支持的命令行标志：--disable-web-security。稳定性和安全性将受到影响。”\n\
    \n另一种方法是安装允许/禁用 CORS 的浏览器扩展。通常，这些插件在开启时会内部更改任何 XHR 请求的响应头。有许多可用的扩展，例如 **CORS toggle**\
    \ 和 **Force CORS**。\n\n## 为 Ionic 应用设置代理服务器\n\n搭建代理服务器会花费一些时间，并且仅在你想要运行 `ionic\
    \ serve` 和 `ionic run -l` 时才需要。我们将看到 Ionic CLI 如何提供一个易于配置的代理服务器。\n\n这里的代理服务器将充当中介，处理从客户端到服务器的所有请求。它会接收客户端请求，向服务器发出新请求，然后在收到服务器响应后，将响应转发回客户端。由于服务器是向你的目标地址发送新请求，因此不存在来源（origin），也就不需要\
    \ CORS。需要特别注意，浏览器会添加 Origin 头。\n\n要设置代理服务器，我们需要进行以下更改：\n\n- 在 `ionic.config.json`\
    \ 中设置代理\n- 设置 Angular 常量\n- 在 Angular 服务中使用常量\n\n让我们从在 `ionic.config.json` 文件中设置代理配置开始。代理配置在\
    \ proxies 数组中包含两个重要属性：`path` 和 `proxyUrl`。你可以在该数组中配置多个代理：\n\n```\n{\n  \"name\"\
    : \"ionic2-auth\",\n  \"app_id\": \"\",\n  \"v2\": true,\n  \"proxies\": [\n \
    \   {\n      \"path\": \"/api\",\n      \"proxyUrl\": \"http://api.yourwebsite.com/api\"\
    \n    }\n  ]\n}\n```\n\n现在，你在 `ionic.config.json` 中指定了：每当访问 `http://localhost:8100/api`\
    \ 时，它将代表你代理到 `http://api.yourwebsite.com/api` 的请求。这将解决 CORS 问题。为了设置 API 端点，我们创建了\
    \ `constants` 文件，并在其中声明了一个常量 `API_URL`：\n\n```\n// src/providers/constants.ts\n\
    // While deploying application we switch to real URL\nexport const API_URL: string\
    \ =\n  'http://localhost:8100/api';\n```\n\n构建应用时，我们可以将其替换为真实的 `API_URL`，也就是我们提到的\
    \ `proxyUrl`：\n\n```\n// src/providers/data-service.ts\n\nimport { Injectable\
    \ } from '@angular/core';\nimport { HttpClient } from './http-client';\nimport\
    \ { Observable } from 'rxjs/Observable';\nimport 'rxjs/add/operator/map';\nimport\
    \ { API_URL } from './constants';\n\nexport class DataService {\n  constructor(public\
    \ http: HttpClient, public storage: Storage) {}\n\n  login(data): Observable<any>\
    \ {\n    return this.http.post(API_URL + '/login', data).map(res => res.json());\n\
    \  }\n}\n```\n\n"
