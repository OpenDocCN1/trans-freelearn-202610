    ## Ionic and IoT


    Developers have started to understand the potential of IoT, which is enormous.
    With so many different IoT devices in the market, there is also a need for applications
    to control these devices remotely. Now here comes Ionic to the rescue to help
    developers create apps quickly and inexpensively. Ionic is really efficient for
    building these apps and at the same time offers full native support to device
    features, for example, access to Bluetooth for sending signals to IoT devices.
    Already there are multiple devices that are connected over Bluetooth or HTTP APIs
    for data syncing and performing various actions. There are so many exciting projects
    currently going on and we will try to learn more about them. Let’s look into some
    of the reasons for using Ionic 2 for building your next IoT application:


    - With Ionic 2, we can have web apps, Android, iOS and soon desktop applications
    with a single code base. Especially, for a prototype purpose it’s really helpful.

    - Ionic apps are built with web technologies, so they are really quick to get
    started.

    - Ionic comes with multiple sets of tools, so you can efficiently bootstrap your
    application and deploy it easily.


    ### Ionic + Node = deadly combination


    Node.js is solving many problems for hardware and IoT devices. There are so many
    ways we can use Node.js to build the backend part which can talk with the Ionic
    app over HTTP APIs. One such example is where Ionic, Node.js, MQTT, and a Wi-Fi
    module are used, and we have a mobile app controlling a relay through the Wi-Fi
    module over the Internet. We are using the free online broker, MQTT for sending
    messages from the Node.js server to the Wi-Fi module, which is set up in Arduino
    IDE. On the other hand, we are using HTTP REST APIs to call the Node.js server
    from the Ionic app. So, this way we will be able to send signals to the Wi-Fi
    router and can perform specific actions.


    Users need some interface to interact with these IoT devices, which opens the
    path for Ionic-based mobile applications. We will be implementing one such node
    module, bleno, for implementing BLE peripherals later in the chapter. Noble and
    bleno are two such modules used for BLE implementation. Noble scans the peripherals
    around its proximity and bleno transmits as a peripheral. Also, other than this
    there are multiple IoT modules available as NPM packages, which will get you started
    really quickly:


    - **Cylon.js**: mainly used for robotics and IoT

    - **Node-RED**: tool for wiring together multiple IoT hardware devices

    - **DeviceJS**: JavaScript engine for IoT, jQuery for IoT

    - **noduino**: Node.js framework for controlling Arduino controls


    Websockets can be another messaging protocol just like MQTT. We will be using
    websockets in this chapter in our demonstration. There are endless possibilities
    that we can work on. Arduino and Raspberry Pi are two famous boards used for building
    applications which can interact with other hardware devices. There are multiple
    examples you will find online to build during hackathons or for learning purposes
    where developers turn on an LED using an Ionic application in real time. One such
    example is with Raspberry Pi GPIO pins and a breadboard connected to it. Node.js
    code is residing on a Raspberry Pi and an LED bulb is connected to a breadboard.
    Another example we can think of is to connect with sensors such as temperature,
    GPS, and so on. You can find an interesting example of Ionic applications using
    MQTT for fetching data from sensors in real time and visualizing in the application
    at https://github.com/arjunsk/Ionic-IoT-Monitor.


    The possibilities are endless and as the IoT industry is growing, you will find
    more sensors and hardware devices coming up for solving many real-life problems.
    You can even think of controlling all your home devices and building a home automation
    project, similar to what Mark Zuckerberg did some months back with his Jarvis
    AI. Although he used AI for his project, we can simply start with just controlling
    all our smart devices according to our needs. The best part as a developer here
    is that you would love it a lot even when you write only a small piece of code
    that can make your life easier.


    ## BLE, Beacons, and the Physical Web


    BLE stands for Bluetooth Low Energy. Bluetooth 4.0 has brought innovative changes
    to the IoT industry. There was a time when Bluetooth was considered as a medium
    to exchange files but now, as technology has evolved, we can already see how the
    fitness band and smart-watch market has grown. Bluetooth smart devices consume
    low energy which helps the smartphone battery last longer and proves to be effective
    for the IoT industry. With Bluetooth once again penetrating into the market, we
    are seeing high usage of Bluetooth devices inside the IoT industry.


    ![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_331_0.png)


    This is a screenshot of an application which I built during a hackathon, which
    uses Kontakt beacons for broadcasting iBeacons and our Ionic-based mobile application
    detects it and triggers a local notification.


    We have been talking a lot about beacons. Let’s look into what iBeacons are. An
    iBeacon is a protocol developed by Apple, which sets a layout about how to transmit
    data signals. Generally, there are two protocols for BLE broadcasting: iBeacon
    and Eddystone. Standard iBeacon advertisement consists of UUID, major and minor:


    ```

    UUID: f7826da6-4fa2-4e98-8024-bc5b71e0893e


    Major ID: 65279


    Minor ID: 63150

    ```


    ## Eddystone and the Physical Web


    Eddystone is a BLE beacon protocol released by Google which is open source and
    cross-platform. Eddystone contains three data frame types: Eddystone-UID, Eddystone-URL,
    and Eddystone-TLM:


    - **Eddystone-UID**: A unique 16-byte static ID, typically used by native apps

    - **Eddystone-URL**: A Physical Web project that transmits a compressed URL which
    is directly usable by the client

    - **Eddystone-TLM**: Broadcasts beacon information such as battery level, sensor
    data and other information


    Almost all the major beacon manufacturers now support both iBeacons and Eddystone
    data formats. Google is now promoting beacon technology so as to provide better
    location and proximity experiences. Currently, the Eddystone-URL frame is widely
    used in the Physical Web initiative.


    *The Physical Web is an open approach to enable quick and seamless interactions
    with physical objects and locations.*


    The Physical Web extends the power of the URL to everyday physical objects. This
    enables you to interact with any physical device such as a vending machine rental
    without the need to download the device-specific application. It’s so smooth that
    you will just tap the URL attached to the device and start using it inside your
    web browser. The Physical Web is a really small discovery service that gives specific
    URLs which nearby mobile devices can receive. This will lead you to a fully interactive
    web page or deep link to a native application.


    We are already facing the challenge of installing multiple applications which
    take up our memory and storage of devices. Again, managing multiple applications
    will be a headache and this is another reason why developers are thinking about
    the mobile web with PWA. Similarly, as the IoT devices keep on increasing, installing
    an app for each device is not scaling. So, here the Physical Web is helping out,
    where you can just open the URL and interact with the devices on the Web, which
    in the backend can talk with the device over multiple protocols. Let’s think of
    a real-life example. If you are giving a talk, you can use a beacon to broadcast
    the URL for the slides and ask the audience to turn on Bluetooth and the location
    to receive the URL.


    We also don’t need a real hardware beacon device to demonstrate this or broadcast
    during a conference. There is an NPM package available, Eddystone-beacon, which
    we can use to advertise an Eddystone URL:


    ```

    $ npm install eddystone-beacon --save

    $ sudo node -e "require(''eddystone-beacon'').advertiseUrl(''https://www.facebook.com/veloice'');"

    ```


    Just make sure that your Bluetooth is enabled on the Linux laptop which you are
    using. Now enable Bluetooth and the location on your Android mobile and you will
    see a notification with the title and description of the web URL:

    '
  mdcn: '


    ## Ionic 与物联网


    开发者已经开始认识到物联网（IoT）的巨大潜力。市场上物联网设备种类繁多，同时也需要相应的应用程序来远程控制这些设备。此时，Ionic 便应运而生，帮助开发者快速且低成本地创建应用。Ionic
    在构建这类应用时非常高效，同时还提供对设备功能的完整原生支持，例如通过蓝牙向物联网设备发送信号。目前已有多种设备通过蓝牙或 HTTP API 进行数据同步和执行各种操作。当前有许多令人兴奋的项目正在进行中，我们将尝试深入了解它们。下面来看看使用
    Ionic 2 构建你的下一个物联网应用的一些理由：


    - 使用 Ionic 2，我们可以通过单一代码库构建 Web 应用、Android、iOS 以及不久的将来的桌面应用。尤其对于原型开发而言，这非常有用。

    - Ionic 应用使用 Web 技术构建，因此上手非常快。

    - Ionic 自带多套工具，因此你可以高效地引导应用启动并轻松部署。


    ### Ionic + Node = 强力组合


    Node.js 正在解决许多硬件和物联网设备的问题。我们可以用很多方式使用 Node.js 构建后端部分，并通过 HTTP API 与 Ionic 应用通信。其中一个例子是使用
    Ionic、Node.js、MQTT 和 Wi-Fi 模块，通过移动应用在互联网上通过 Wi-Fi 模块控制继电器。我们使用免费的在线代理 MQTT 将消息从
    Node.js 服务器发送到 Wi-Fi 模块，该模块在 Arduino IDE 中设置。另一方面，我们使用 HTTP REST API 从 Ionic 应用调用
    Node.js 服务器。这样，我们就能够向 Wi-Fi 路由器发送信号并执行特定操作。


    用户需要某种界面来与这些物联网设备交互，这为基于 Ionic 的移动应用开辟了道路。我们将在本章后面实现一个名为 bleno 的节点模块，用于实现 BLE
    外设。Noble 和 bleno 是用于 BLE 实现的两个常用模块。Noble 扫描其附近的周边外设，bleno 作为外设进行传输。此外，还有其他多个物联网模块可作为
    NPM 包使用，能让你快速上手：


    - **Cylon.js**：主要用于机器人和物联网

    - **Node-RED**：用于将多个物联网硬件设备连接在一起的工具

    - **DeviceJS**：面向物联网的 JavaScript 引擎，物联网领域的 jQuery

    - **noduino**：用于控制 Arduino 的 Node.js 框架


    WebSocket 可以像 MQTT 一样成为另一种消息传递协议。我们将在本章的演示中使用 WebSocket。我们可以做的事情是无穷无尽的。Arduino
    和 Raspberry Pi 是用于构建可与其他硬件设备交互的应用的两个著名开发板。你可以在网上找到许多在黑客马拉松或学习期间构建的示例，其中开发者使用 Ionic
    应用实时点亮 LED。其中一个示例使用 Raspberry Pi GPIO 引脚和连接到它上面的面包板。Node.js 代码驻留在 Raspberry Pi
    上，LED 灯泡连接到面包板。我们可以想到的另一个示例是连接温度、GPS 等传感器。你可以在 https://github.com/arjunsk/Ionic-IoT-Monitor
    找到一个有趣的 Ionic 应用示例，它使用 MQTT 实时从传感器获取数据并在应用中可视化。


    可能性是无限的，随着物联网行业的发展，你会发现更多传感器和硬件设备不断涌现，以解决许多现实问题。你甚至可以考虑控制所有家庭设备并构建一个家庭自动化项目，类似于马克·扎克伯格几个月前用他的
    Jarvis AI 所做的。尽管他在项目中使用 AI，但我们完全可以简单地根据我们的需求开始控制所有智能设备。作为开发者，最好的部分是，即使你只写一小段让你的生活更轻松的代码，你也会非常喜欢它。


    ## BLE、信标和物理 Web


    BLE 代表低功耗蓝牙（Bluetooth Low Energy）。蓝牙 4.0 为物联网行业带来了创新性的变革。曾几何时，蓝牙被视为交换文件的一种媒介，但随着技术的发展，我们已经看到健身手环和智能手表市场的增长。蓝牙智能设备功耗低，有助于延长智能手机电池寿命，并被证明对物联网行业非常有效。随着蓝牙再次渗透到市场，我们看到物联网行业中对蓝牙设备的使用率很高。


    ![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_331_0.png)


    这是我在一次黑客马拉松期间构建的应用截图，它使用 Kontakt 信标广播 iBeacon，而我们基于 Ionic 的移动应用检测到该信标并触发本地通知。


    我们一直在谈论很多关于信标的内容。让我们来看看 iBeacon 是什么。iBeacon 是由 Apple 开发的一种协议，它设定了如何传输数据信号的布局。通常，BLE
    广播有两种协议：iBeacon 和 Eddystone。标准的 iBeacon 广播包含 UUID、major 和 minor：


    ```

    UUID: f7826da6-4fa2-4e98-8024-bc5b71e0893e


    Major ID: 65279


    Minor ID: 63150

    ```


    ## Eddystone 与物理 Web


    Eddystone 是由 Google 发布的 BLE 信标协议，它是开源的且跨平台。Eddystone 包含三种数据类型帧：Eddystone-UID、Eddystone-URL
    和 Eddystone-TLM：


    - **Eddystone-UID**：一个唯一的 16 字节静态 ID，通常被原生应用使用

    - **Eddystone-URL**：一个物理 Web 项目，传输可直接供客户端使用的压缩 URL

    - **Eddystone-TLM**：广播信标信息，如电池电量、传感器数据和其他信息


    现在几乎所有主要的信标制造商都支持 iBeacon 和 Eddystone 数据格式。Google 目前正在推广信标技术，以提供更好的定位和邻近体验。目前，Eddystone-URL
    帧被广泛用于物理 Web 计划中。


    *物理 Web 是一种开放方法，旨在实现对物理对象和位置的快速无缝交互。*


    物理 Web 将 URL 的力量扩展到日常物理对象上。这使你无需下载特定于设备的应用即可与任何物理设备（例如自动售货机租赁）进行交互。使用起来非常顺畅：你只需点击设备上附带的
    URL，并在网络浏览器中使用它。物理 Web 是一个很小的发现服务，它提供附近的移动设备可以接收的特定 URL。这将带你进入一个完全交互式的网页，或深层链接到原生应用。


    我们已经面临着安装多个应用会占用设备内存和存储空间的挑战。此外，管理多个应用也很头疼，这也是开发者开始考虑将移动 Web 与 PWA 结合起来的另一个原因。同样，随着物联网设备不断增加，为每台设备安装应用并不具备可扩展性。因此，物理
    Web 在这里提供了帮助，你可以打开 URL 在 Web 上操作设备，而后端可以通过多种协议与设备通信。让我们想一个现实生活中的例子。如果你正在做演讲，你可以使用信标广播幻灯片
    URL，并让听众打开蓝牙和定位服务来接收该 URL。


    我们也不需要真正的硬件信标设备来演示这一点或在会议中广播。有一个 NPM 包，名为 Eddystone-beacon，我们可以用它来广播 Eddystone
    URL：


    ```

    $ npm install eddystone-beacon --save

    $ sudo node -e "require(''eddystone-beacon'').advertiseUrl(''https://www.facebook.com/veloice'');"

    ```


    只需确保你所使用的 Linux 笔记本电脑已启用蓝牙即可。现在启用 Android 手机上的蓝牙和定位服务，你会看到一个带有 Web URL 标题和描述的通知。


    '
