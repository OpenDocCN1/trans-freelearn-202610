  mdcn: "\n## 标签页与分段控件\n\n标签页是在不同视图之间切换并在较高层级组织内容的最简单方式。另一方面，分段控件是一组按钮，可以将其视为特定组件内部的局部切换标签，主要用于筛选。借助标签页，我们可以在页脚构建一个快速访问栏，在其中放置菜单选项，例如首页、收藏和购物车。这样，我们就能一键访问这些页面或组件。另一方面，我们可以在账户组件中使用分段控件，将显示的数据划分为三个分段：个人资料、订单和钱包。\n\
    \n```html\n// src/pages/account/account.html\n<ion-header>\n  <ion-navbar>\n \
    \   <button menuToggle>\n      <ion-icon name=\"menu\"></ion-icon>\n    </button>\n\
    \    <ion-title>Account</ion-title>\n  </ion-navbar>\n  <ion-toolbar [color]=\"\
    isAndroid ? 'primary' : 'light'\" no-border-top>\n    <ion-segment [(ngModel)]=\"\
    account\" [color]=\"isAndroid ? 'light' : 'primary'\">\n      <ion-segment-button\
    \ value=\"profile\">\n        Profile\n      </ion-segment-button>\n      <ion-segment-button\
    \ value=\"orders\">\n        Orders\n      </ion-segment-button>\n      <ion-segment-button\
    \ value=\"wallet\">\n        Wallet\n      </ion-segment-button>\n    </ion-segment>\n\
    \  </ion-toolbar>\n</ion-header>\n\n<ion-content class=\"outer-content\">\n  <div\
    \ [ngSwitch]=\"account\">\n\n    <div padding-top text-center *ngSwitchCase=\"\
    'profile'\">\n      <img src=\"http://www.gravatar.com/avatar?d=mm&s=140\">\n\
    \      <h2>{{username}}</h2>\n\n      <ion-list inset>\n        <button ion-item\
    \ (click)=\"updatePicture()\">Update Picture</button>\n        <button ion-item\
    \ (click)=\"changePassword()\">Change Password</button>\n        <button ion-item\
    \ (click)=\"logout()\">Logout</button>\n      </ion-list>\n\n    </div>\n\n  \
    \  <div padding-top text-center *ngSwitchCase=\"'orders'\">\n      // Order List\
    \ data to be shown here\n    </div>\n\n    <div padding-top text-center *ngSwitchCase=\"\
    'wallet'\">\n      // Wallet statement and transaction here.\n    </div>\n\n \
    \ </div>\n</ion-content>\n```\n\n标签页有许多可用属性，例如 `mode`、`color`、`tabsPlacement`\
    \ 和 `tabsLayout`。同样，我们也可以在配置层级配置一些标签页属性；你可以在 https://ionicframework.com/docs/v2/api/config/Config/\
    \ 找到哪些属性可以全局配置或针对特定平台配置。\n\n## 警报\n\n警报是 Ionic 提供的组件，用于显示触发警报、确认、提示或某些特定操作。可以从\
    \ `ionic-angular` 导入 `AlertController`，它允许我们以编程方式在应用内创建并显示警报。这里需要注意的一点是，这些是 JavaScript\
    \ 弹出窗口，而不是原生平台弹出窗口。有一个名为 `cordova-plugin-dialogs` 的 Cordova 插件（https://ionicframework.com/docs/v2/native/dialogs/），如果你需要原生对话框\
    \ UI 元素，可以使用它。\n\n目前，在 Ionic 应用中可以显示五种类型的警报：基本警报、提示警报、确认警报、单选警报和复选警报。\n\n在 `src/pages/products/products.html`\
    \ 中，单选警报用于对产品进行排序：\n\n```html\n<ion-buttons>\n  <button ion-button full clear\
