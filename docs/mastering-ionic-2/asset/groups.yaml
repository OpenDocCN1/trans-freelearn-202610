  - '[PAGE 166]


    # Ionic Native


    Developers working on hybrid applications have been using ngCordova with Ionic
    1 for some time. Now with Ionic 3, which is built with ES6 and TypeScript, we
    need to have a wrapper library for ES6 or TypeScript, which is exactly what Ionic
    Native is. It''s a collection of ES5/ES6/TypeScript wrappers built on top of Cordova
    APIs, which makes it convenient to integrate into Ionic applications. The Ionic
    team started this project as a feature request from a community member. It started
    as an experiment and it gained a lot of support due to the fact that integrated
    plugins were always a pain when it comes to lack of documentation and confusing
    APIs. These Angularjs wrappers simplified the process of integration and fit with
    the Angular syntax also. Now there are around 120+ Cordova plugins supported in
    Ionic Native and still counting.'
  - '[PAGE 167]


    <!-- no content -->'
  - "[PAGE 168]\n\n# Installing Ionic Native\n\nWe can add Ionic Native to any existing\
    \ Ionic project. You will find `ionic-native` by default in any starter project\
    \ you will start with Ionic 3. If you somehow have to install it then the recommended\
    \ way is via the NPM package: **$ npm install @ionic-native/core --save**\n\n\
    If you are using ES6/TypeScript for building Ionic 3 apps, you do not need any\
    \ scripts tags to be included in the `index.html` file. Just import the specific\
    \ `ionic-native` package inside your file:\n\n```\n```typescript\nimport { SplashScreen\
    \ } from '@ionic-native/splash-screen'\nimport { StatusBar } from '@ionic-native/status-bar';\n\
    ```\n```\n\nIf you are using Ionic 1 then you need to add the `ionic.native.js`\
    \ file inside the `index.html` file:\n\n```\n```html\n<script src=\"ionic.native.js\"\
    ></script>\n```\n```\n\nWe have to wrap most of the plugin calls with the device\
    \ ready event, so to check if your device has fully loaded the application and\
    \ plugins are available, use the following code for the `Splashscreen` plugin:\n\
    \n```\n```typescript\nconstructor(platform: Platform, private\n  splashScreen:\
    \ SplashScreen, statusBar: StatusBar)\n  {\n    this.platform.ready().then(()\
    \ => {\n      // platform is ready to use available plugins.\n      this.statusBar.styleDefault();\n\
    \      this.splashScreen.hide();\n    });\n  }\n```\n```"
  - '[PAGE 169]


    <!-- no content -->'
  - '[PAGE 170]


    # Testing plugins in browsers


    One of the biggest issues currently with Cordova plugins is we can''t test our
    app inside browsers. Ionic team have been concentrating on improving Ionic tools
    so that we can simulate most of our application’s functionality directly in a
    browser. Still, for current development, there is a really nice Chrome plugin,
    Cordova mocks, which was created by Paolo Bernasconi, one of the core contributors
    to previous ngCordova projects. As soon as you install the plugin you can start
    testing your application as if you are testing it on your phone. Currently, there
    are around twelve plugins supported by this extension. This Chrome plugin can
    be effective in some cases and help you test in a browser for supported plugins.'
  - '[PAGE 171]


