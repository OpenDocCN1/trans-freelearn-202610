    # # What makes a web application a PWA?


    In simple words, a PWA is meant to be eventually installed to the user''s home
    screen, which means they will access it exactly like a native application. So
    users expect the same experience as when using a native application. Since Ionic
    3 is designed to create a native application experience with standard web technologies,
    this is already handled.


    PWA should be very performant, since PWA is going to be installed to the home
    screen right along side with native applications. Ionic 3 is built from the ground
    with performance in mind, which means you barely have to think about it. As PWA
    is going to be installed on the user''s home screen, this process requires a web
    manifest for your application. Thankfully, Ionic 3 CLI comes with a built-in manifest
    file.


    The majority of native applications works launch offline and give a limited offline
    experience to the user, so that a PWA can do for the user. With the help of service
    workers, we can now make our web application work while offline.'
