    # Ionic Components


    In this chapter, we will be going through various Ionic components and APIs that
    are necessary while building large applications. Ionic provides various built-in
    JavaScript components that we can utilize intelligently. There are many APIs provided
    by Ionic that we are not really aware of and here we will learn how we can efficiently
    use these in our application to increase the performance of the application and
    make it production ready.


    We will also be starting here with an e-commerce application named vPlanet Commerce;
    I named this as one of my product ideas where we will be taking e-commerce stores
    to mobile. We will add progressive web app support to the application later in
    this book so that we have a complete package. To make this chapter interesting,
    I will integrate different Ionic components and APIs according to what an e-commerce
    app requires while building. This way you will have an entire e-commerce application
    ready.


    The topics that we will be covering in this chapter are:


    +   - Building vPlanet Commerce

    +   - Ionic 3 components

    +   - Ionic APIs and custom modules

    +   - Lazy Loading with Ionic 3'
