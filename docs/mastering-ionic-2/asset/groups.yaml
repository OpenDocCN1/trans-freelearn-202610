    \ 的 `loadCurrencyList()` 方法获取数据。我们已经讨论了渐进式 Web 应用的大部分要点和代码片段。你可以找到包含章节的完整代码库并随意修改。我们知道，只有将应用托管在\
    \ HTTPS 上，它才能完全正常运作，因此我已使用 Firebase 托管部署了 `www` 文件夹：\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_373_0.png)\n\
    \n你可以访问 [https://coastal-mender-573.firebaseapp.com/](https://coastal-mender-573.firebaseapp.com/)\
    \ 查看已托管的应用程序。当你开始频繁使用该应用时，会发现一个提示，询问你是否将其添加到手机主屏幕。添加到主屏幕后，你会看到一个图标出现在主屏幕上，点击它会打开一个独立的全屏窗口，看起来就像原生应用一样。我必须说，你们看到这个时都应该感到兴奋，现在应该尝试自己构建一个\
    \ PWA 应用。实际开发应用会比仅仅阅读概念更能提升你的技能，让你占据优势。\n\n## PWA 的未来\n\n渐进式 Web 应用为我们提供了许多可能性，如安装、发送推送通知和离线支持等能力，这些弥补了移动\
    \ Web 与原生应用之间的差距。目前的问题是，iOS 和 Safari 尚不支持 Service Worker，该问题仍在考虑之中。有人推测在 2017\
    \ 年下半年，它们可能会提供 Service Worker 支持，从而帮助启用 PWA 功能。\n\n渐进式 Web 应用是改进移动 Web 的下一步。随着移动流量日益增长，这意义重大。此外，在过去一段时间里，我们看到许多网站强迫用户通过移动\
    \ Web 安装原生应用，这确实令人反感。印度著名的电商巨头之一 Flipkart 甚至曾一度通过横幅提示用户安装其原生应用，从而停用了其移动 Web 版本。后来，当他们意识到这个错误后，成为业界首批支持\
    \ PWA 的公司之一，在移动 Web 上发布了 Flipkart Lite 版本。\n\n统计数据显示，过去一年美国智能手机应用下载量下降了 20%，这表明市场已经饱和，消费者需求正在发生变化。你可以在（https://developers.google.com/web/showcase/2016/flipkart）找到大量案例研究，其中包含\
    \ PWA 如何积极影响产品增长和用户参与度的关键见解。还有许多其他 PWA，如 MakeMyTrip、Housing 等。你会发现，它们帮助我卸载了原生应用，释放了设备空间，转而使用\
    \ PWA 版本。\n\n## 总结\n\n我个人认为，在 Ionic 中支持 PWA，并在最后一章讨论这个主题，是结束我们激动人心的旅程的最佳方式。你现在已经了解了\
    \ PWA 的强大功能，也可以将其扩展到普通 Web 应用中。此外，我们不能说 PWA 会取代原生应用，因为有些底层 API 只有在使用 Cordova 构建应用并使用\
    \ Cordova 插件时才能使用。\n\n从 Ionic 团队最近的博客文章来看，似乎很快就会有对 Electron 的桌面支持。我建议每位用户或开发者订阅\
    \ Ionic 博客，这是了解 Ionic 最新动态的最佳方式。我已经竭尽全力确保每一章的内容都是最新的，但你可以看到这个项目发展得如此活跃，所以确保你也付出努力跟上最新进展。Ionic\
    \ 论坛是另一个有用的资源，在过去三年学习 Ionic 的旅程中，它一直帮助着我。大多数时候，你会发现自己遇到的问题已经在论坛中被问过，很快就能得到答案。此外，你可以随时提问，但在此之前一定要做好功课；否则你的问题可能会得不到回答。我说的功课是指，搜索论坛中的现有讨论，查看\
    \ GitHub 上的问题，因为很多时候问题可能已经被标记，你不想浪费时间。大多数时候，我们遇到的问题可能与 Angular 相关，而不是专门针对 Ionic\
    \ 组件或 API。因此，对于这类问题，请尝试在 Google 上使用关键字 Angular 而不是 Ionic 进行搜索，因为这样会得到更合适的结果。\n\
    \n"
