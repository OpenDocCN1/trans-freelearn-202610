  md: "\n## Summary\n\nWhen it comes to securing your application, the most important\
    \ thing is to properly secure your server-side APIs. This way we will not lose\
    \ any critical data and others' data will not get shared publicly. Although, when\
    \ we think about securing our code base, nothing is 100% secure in native as well\
    \ as hybrid mobile development. The goal should be to get as close to that number\
    \ as possible though. Start by limiting your exposure and taking care that no\
    \ sensitive data and logic should be on the client side. You should make sure\
    \ you are doing your best to secure your hybrid mobile apps. However, if someone\
    \ is dedicated enough, they can still work around it.\n\nWe have now covered some\
    \ important concepts of security inside and outside of your Ionic application.\
    \ We will now move one step ahead with integrations of our Ionic app with BaaS\
    \ services such as Firebase and Ionic Cloud. In case you have very simple requirements\
    \ for your Ionic application and don't have much server logic, you can quickly\
    \ build an Ionic application with these services without setting up any server-side\
    \ code base. We will be building a **TasteBite** application where we will be\
    \ rating food items and restaurants combined, so that users can know what the\
    \ famous dishes in their cities are and where they can find them cooked best.\n\
    \n## Introduction to Firebase and TasteBite apps\n\nGetting started with Firebase\
    \ is really simple; that is the main reason many startups and growing products\
    \ use all these Backend as a Service platforms like Firebase. We will quickly\
    \ start by creating a TasteBite application with Firebase and Ionic. In this application\
    \ we integrated an AngularFire2 wrapper for Angular applications using Firebase,\
    \ although, we can simply use the JavaScript SDK also inside our application.\
    \ You need to create an account at Firebase (initially you can have a free account;\
    \ as your consumption increases you can upgrade your account easily).\n\nFirebase\
    \ has made the life of developers easier as they don't have to spend time building\
    \ a backend server to build simple APIs. We can easily do all CRUD operations\
    \ with minimum effort and with WebSocket support, it's super fast in syncing data.\
    \ Also, Firebase offers offline sync, user authentication, and features for securing\
    \ the data with sets of rules:\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_297_0.png)\n\
    \nAs soon as you create an account, you create an app inside Firebase; you will\
    \ find an option to add a project. After you add/create a project, you can now\
    \ manage and enter your applications. You will see many options such as Analytics,\
    \ Authentication, Database, Storage, Hosting, Notification and many other options.\
    \ We will use many of them in our application as we move forward creating data\
    \ for our application. You can already see in the following screenshot that we\
    \ have some data stored in our application. All Firebase database data is stored\
    \ as JSON objects and no relational tables exist.\n\n### Building TasteBite and\
    \ installing Firebase\n\nLet's first start by creating an application from scratch\
    \ and install all the plugins and packages required in this application. In this\
    \ application we will be using the Tabs template and integrating Lazy Loading.\
    \ We will be using geolocation, camera, and in-app browser plugins in our application:\n\
    \n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_299_0.png)\n\n```\n$ ionic start tastebite\
    \ tabs\n$ ionic cordova platform add android\n$ ionic cordova plugin add cordova-plugin-inappbrowser\n\
    $ ionic cordova plugin add cordova-plugin-geolocation\n$ ionic cordova plugin\
    \ add cordova-plugin-camera\n$ npm install --save @ionic-native/in-app-browser\n\
    $ npm install --save @ionic-native/geolocation\n$ npm install --save @ionic-native/camera\n\
    ```\n\nNow, we are ready to set up Firebase in our Ionic application:\n\n```\n\
    $ npm install angularfire2 firebase --save\n```\n\nNext we will import the angularfire2\
    \ library in app.module.ts:\n\n```\n// src/app/app.module.ts\n\nimport { AngularFireModule\
    \ } from 'angularfire2';\n\nexport const firebaseConfig = {\n  apiKey: \"AIzaSyDnd6hMcfJDWGdGr6EOSS05NoMM2CeY2bw\"\
    ,\n  authDomain: \"tastebite-ec5c4.firebaseapp.com\",\n  databaseURL: \"https://tastebite-ec5c4.firebaseio.com\"\
    ,\n  storageBucket: \"tastebite-ec5c4.appspot.com\",\n  messagingSenderId: \"\
    762350093850\"\n};\n\n@NgModule({\n  declarations: [\n    Tastebite\n  ],\n  imports:\
    \ [\n    BrowserModule,\n    HttpModule,\n    IonicModule.forRoot(Tastebite, {\n\
    \      preloadModules: true\n    }),\n    AngularFireModule.initializeApp(firebaseConfig)\n\
    \  ],\n```\n\nMake sure you include `firebaseConfig` as shown in the previous\
    \ example, which will have multiple configuration parameters. Also, the next step\
    \ will be to inject `firebaseConfig` while initializing our Firebase module. We\
    \ are now ready to read and write data inside our application.\n\n### Authentication\
    \ and security using Firebase\n\nWe will now look into Firebase user authentication\
    \ and how we can secure our data. Firebase supports login and authentication internally\
    \ and also provides support for integrating with social login providers. Most\
    \ applications need some kind of login mechanism internally; with Firebase it's\
    \ super easy to set this up. Whenever we log in using Firebase, a session is created\
    \ and a unique ID, `uid`, is returned by Firebase, which is distinct across all\
    \ providers and never changes for a specific authenticated user. This will also\
    \ help us later in securing our data.\n\nOnce the user is authenticated, its session\
    \ is managed and remembered even after the application is restarted. Firebase\
    \ provides user authentication for multiple platforms:\n\n- **Custom** - for integrating\
    \ with existing authentication systems\n- **E-mail** - register and authenticate\
    \ users by e-mail and password.\n- **Anonymous** - for guest accounts without\
    \ any personal information required\n- Facebook\n- Google\n- Twitter\n- GitHub\n\
    \n### Enabling providers\n\nWe need to enable the auth provider from our application's\
    \ Authentication Sign-In Method tab. We have enabled e-mail-based login and Facebook\
    \ login for our TasteBite app. It's really easy to sign up, log in and log out\
    \ users with e-mail-based login. We can use custom auth if we already have some\
    \ authentication systems; if we want to have guest login, we can use anonymous\
    \ user authentication. We will demonstrate how easily we can integrate social\
    \ logins also.\n\nAll social logins require a client ID and client secret for\
    \ the application created on social channels. All social providers have different\
    \ ways of creating an application, and after creating an application we can put\
    \ the client ID and client secret inside our Firebase app. We need to make sure\
    \ that we have placed the OAuth redirect URL inside the Facebook Login product:\
    \ https://tastebite-ec5c4.firebaseapp.com/__/auth/handler. Before this, you have\
    \ to create an application on Facebook whose app_id and app_secret we will add\
    \ back to our Firebase Facebook provider settings. After this, your backend work\
    \ is done, and you just have to call a function from the Ionic application.\n\n\
    We will now generate AuthServiceProvider which we will use for AngularFire2 authentication:\n\
    \n```\n$ ionic g provider AuthService\n```\n\nBefore we start working on this\
    \ provider, we need to set up FirebaseAuthConfig inside our app.module.ts file:\n\
    \n```\nimport { AngularFireModule, AuthProviders, AuthMethods } from 'angularfire2';\n\
    \nconst myFirebaseAuthConfig = {\n  provider: AuthProviders.Facebook,\n  method:\
    \ AuthMethods.Redirect\n};\n\nimports: [\n  AngularFireModule.initializeApp(firebaseConfig,\n\
    \    myFirebaseAuthConfig)\n]\n```\n\nThis way we don't need to pass this config\
    \ to the AngularFireAuth-based login function. Although we can override this configuration\
    \ and use any other provider by passing a login method internally. In the code\
    \ above you can see AuthMethods is selected as Redirect, but for testing on browsers\
    \ you can change it to Popup.\n\nLet's look at our AuthService now:\n\n```\nimport\
    \ { Injectable } from '@angular/core';\nimport { AngularFireAuth, FirebaseAuthState\
    \ } from 'angularfire2';\nimport * as firebase from 'firebase';\n\nimport { Platform\
    \ } from 'ionic-angular';\nimport { Facebook, FacebookLoginResponse } from '@ionic-native/facebook';\n\
    \n@Injectable()\nexport class AuthServiceProvider {\n\n  private authState: FirebaseAuthState;\n\
    \n  constructor(public auth$: AngularFireAuth, private fb: Facebook,\n    public\
    \ platform: Platform) {\n    this.authState = auth$.getAuth();\n```\n"
  mdcn: "\n\n## 摘要\n\n在保护应用程序安全时，最重要的是正确保护你的服务器端 API。这样我们不会丢失任何关键数据，他人的数据也不会被公开分享。然而，当我们考虑保护代码库时，在原生的以及混合移动开发中，没有任何东西是100%安全的。不过，我们的目标应该是尽可能接近这个数字。首先限制你的暴露面，并确保不要把敏感数据和逻辑放在客户端。你应该确保尽力保护你的混合移动应用。但是，如果有人执意要破解，他们仍然可以绕过这些保护。\n\
    \n我们已经介绍了 Ionic 应用程序内部和外部的一些重要安全概念。现在我们将进一步把 Ionic 应用与 BaaS 服务（如 Firebase 和 Ionic\
    \ Cloud）集成。如果你的 Ionic 应用需求非常简单，并且没有太多服务器逻辑，你可以使用这些服务快速构建一个 Ionic 应用，而无需搭建任何服务器端代码库。我们将构建一个\
    \ **TasteBite** 应用，对菜品和餐厅进行综合评分，以便用户了解所在城市的名菜是什么，以及在哪里能品尝到做得最好的菜品。\n\n## Firebase\
    \ 和 TasteBite 应用简介\n\n开始使用 Firebase 非常简单；这也是许多初创公司和成长型产品使用像 Firebase 这样的后端即服务平台的主要原因。我们将快速使用\
    \ Firebase 和 Ionic 创建一个 TasteBite 应用。在这个应用中，我们为使用 Firebase 的 Angular 应用集成了 AngularFire2\
    \ 包装器，不过我们也可以在应用内直接使用 JavaScript SDK。你需要在 Firebase 创建一个账户（最初可以使用免费账户；随着使用量增加，你可以轻松升级账户）。\n\
    \nFirebase 让开发者的生活更轻松，因为他们不必花时间构建后端服务器来提供简单的 API。我们可以用最少的精力轻松完成所有 CRUD 操作，并且借助\
    \ WebSocket 支持，数据同步速度极快。此外，Firebase 还提供离线同步、用户身份验证、以及通过规则集保护数据的功能：\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_297_0.png)\n\
    \n创建账户后，你就可以在 Firebase 中创建应用；你会看到添加项目的选项。添加/创建项目后，你可以管理并进入你的应用。你会看到诸如分析、身份验证、数据库、存储、托管、通知以及许多其他选项。随着我们继续为应用创建数据，我们将使用其中的许多功能。你可以在下面的截图中看到，我们的应用中已经存储了一些数据。所有\
    \ Firebase 数据库数据都存储为 JSON 对象，不存在关系表。\n\n### 构建 TasteBite 并安装 Firebase\n\n我们首先从零开始创建一个应用，并安装此应用所需的所有插件和包。在此应用中，我们将使用\
    \ Tabs 模板并集成懒加载。我们将在应用中使用地理位置、相机和应用内浏览器插件：\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_299_0.png)\n\
    \n```\n$ ionic start tastebite tabs\n$ ionic cordova platform add android\n$ ionic\
    \ cordova plugin add cordova-plugin-inappbrowser\n$ ionic cordova plugin add cordova-plugin-geolocation\n\
    $ ionic cordova plugin add cordova-plugin-camera\n$ npm install --save @ionic-native/in-app-browser\n\
    $ npm install --save @ionic-native/geolocation\n$ npm install --save @ionic-native/camera\n\
    ```\n\n现在，我们准备在 Ionic 应用中设置 Firebase：\n\n```\n$ npm install angularfire2 firebase\
    \ --save\n```\n\n接下来，我们将在 app.module.ts 中导入 angularfire2 库：\n\n```\n// src/app/app.module.ts\n\
    \nimport { AngularFireModule } from 'angularfire2';\n\nexport const firebaseConfig\
    \ = {\n  apiKey: \"AIzaSyDnd6hMcfJDWGdGr6EOSS05NoMM2CeY2bw\",\n  authDomain: \"\
    tastebite-ec5c4.firebaseapp.com\",\n  databaseURL: \"https://tastebite-ec5c4.firebaseio.com\"\
    ,\n  storageBucket: \"tastebite-ec5c4.appspot.com\",\n  messagingSenderId: \"\
    762350093850\"\n};\n\n@NgModule({\n  declarations: [\n    Tastebite\n  ],\n  imports:\
    \ [\n    BrowserModule,\n    HttpModule,\n    IonicModule.forRoot(Tastebite, {\n\
    \      preloadModules: true\n    }),\n    AngularFireModule.initializeApp(firebaseConfig)\n\
    \  ],\n```\n\n确保你如上例所示包含 `firebaseConfig`，它会有多个配置参数。此外，下一步是在初始化 Firebase 模块时注入\
    \ `firebaseConfig`。我们现在可以开始读取和写入应用中的数据了。\n\n### 使用 Firebase 进行身份验证和安全\n\n我们现在来看看\
    \ Firebase 用户身份验证，以及我们如何保护数据。Firebase 在内部支持登录和身份验证，并且还提供与社交登录提供商集成的支持。大多数应用需要某种内部登录机制；使用\
    \ Firebase 设置起来非常容易。每当我们使用 Firebase 登录时，就会创建一个会话，并返回一个唯一 ID `uid`，该 ID 在所有提供者中都是唯一的，并且对于特定的已认证用户永远不会改变。这也将在以后帮助我们保护数据。\n\
    \n用户完成身份验证后，即使应用重启，其会话也会被管理和记住。Firebase 为多个平台提供用户身份验证：\n\n- **自定义** - 用于与现有身份验证系统集成\n\
    - **电子邮件** - 通过电子邮件和密码注册并验证用户。\n- **匿名** - 用于无需任何个人信息的访客账户\n- Facebook\n- Google\n\
    - Twitter\n- GitHub\n\n### 启用提供程序\n\n我们需要从应用程序的“身份验证-登录方式”选项卡中启用身份验证提供程序。我们已经为\
    \ TasteBite 应用启用了基于电子邮件的登录和 Facebook 登录。使用基于电子邮件的登录来注册、登录和注销用户非常容易。如果我们已经有一些身份验证系统，则可以使用自定义身份验证；如果我们想允许访客登录，可以使用匿名用户身份验证。我们也将演示如何轻松集成社交登录。\n\
    \n所有社交登录都需要在社交渠道上创建的应用的客户端 ID 和客户端密钥。所有社交提供者都有不同的创建应用的方式，创建应用后，我们可以将客户端 ID 和客户端密钥放到\
    \ Firebase 应用中。我们需要确保已将 OAuth 重定向 URL 放置在 Facebook 登录产品中：https://tastebite-ec5c4.firebaseapp.com/__/auth/handler。在此之前，你必须在\
    \ Facebook 上创建一个应用程序，我们将把它的 app_id 和 app_secret 添加回 Firebase Facebook 提供者设置中。在此之后，你的后端工作就完成了，你只需从\
    \ Ionic 应用调用一个函数即可。\n\n我们现在将生成 AuthServiceProvider，它将用于 AngularFire2 身份验证：\n\n\
    ```\n$ ionic g provider AuthService\n```\n\n在我们开始处理此提供程序之前，需要在 app.module.ts 文件中设置\
    \ FirebaseAuthConfig：\n\n```\nimport { AngularFireModule, AuthProviders, AuthMethods\
    \ } from 'angularfire2';\n\nconst myFirebaseAuthConfig = {\n  provider: AuthProviders.Facebook,\n\
    \  method: AuthMethods.Redirect\n};\n\nimports: [\n  AngularFireModule.initializeApp(firebaseConfig,\n\
    \    myFirebaseAuthConfig)\n]\n```\n\n这样我们就不必将此配置传递给基于 AngularFireAuth 的登录函数。不过，我们可以通过内部传递登录方法来覆盖此配置并使用任何其他提供程序。在上面的代码中，你可以看到\
    \ AuthMethods 选择的是 Redirect，但为了在浏览器上测试，你可以将其改为 Popup。\n\n现在让我们看看我们的 AuthService：\n\
    \n```\nimport { Injectable } from '@angular/core';\nimport { AngularFireAuth,\
    \ FirebaseAuthState } from 'angularfire2';\nimport * as firebase from 'firebase';\n\
    \nimport { Platform } from 'ionic-angular';\nimport { Facebook, FacebookLoginResponse\
    \ } from '@ionic-native/facebook';\n\n@Injectable()\nexport class AuthServiceProvider\
    \ {\n\n  private authState: FirebaseAuthState;\n\n  constructor(public auth$:\
    \ AngularFireAuth, private fb: Facebook,\n    public platform: Platform) {\n \
    \   this.authState = auth$.getAuth();\n```\n\n"
