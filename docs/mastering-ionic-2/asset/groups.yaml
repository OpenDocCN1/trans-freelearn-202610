  - "[PAGE 188]\n\n# Social sharing plugin\n\nSharing content with social media is\
    \ a great tool for marketing your application and its content, which helps you\
    \ gain new users. So having a share plugin will be a really fruitful feature for\
    \ our applications. You can share images, text, messages via Facebook, Twitter,\
    \ e-mail, SMS, WhatsApp, and so on using this plugin. It uses the Native share\
    \ plugin to share content and will automatically show all sharing options that\
    \ you have in your device:\n\n```\n$ ionic cordova:plugin add cordova-plugin-x-socialsharing\n\
    $ npm install @ionic-native/social-sharing --save\n```\n\nSocialSharing has multiple\
    \ methods that we can use in our application. The most commonly used method is\
    \ SocialSharing.share, which opens the default platform dialog with all the available\
    \ sharing applications:\n\n```\n// src/pages/about/about.ts\n\nimport { SocialSharing\
    \ } from '@ionic-native/social-sharing';\n\nexport class AboutPage {\n\n  constructor(public\
    \ popoverCtrl: PopoverController, private socialSharing: SocialSharing) { }\n\n\
    \  shareViaFacebook() {\n  // recommended to use canShareVia before using shareVia\n\
    \  this.socialSharing.canShareVia(\"facebook\", \"Veloice:Intelligent Business\
    \ Telephony\", \"Real time Voice\", \"h\n  this.socialSharing.shareViaFacebook(\"\
    Veloice:Intelligent Business Telephony\", \"http://veloice.com/images/b\n  }).catch(()\
    \ => {\n  alert(\"Cannot share on Facebook\");\n  });\n  }\n\n  shareViaWhatsApp()\
    \ {\n  // recommended to use canShareVia before using shareVia\n  this.socialSharing.canShareVia(\"\
    whatsapp\", \"Veloice:Intelligent Business Telephony\", \"Real time Voice\", \"\
    h\n  this.socialSharing.shareViaWhatsApp(\"Veloice:Intelligent Business Telephony\"\
    , \"http://veloice.com/images/b\n  }).catch(() => {\n  alert(\"Cannot share on\
    \ Whatsapp\");\n  });\n  }\n\n  shareViaEmail() {\n  // recommended to use canShareVia\
    \ before using shareVia\n  this.socialSharing.canShareViaEmail().then(() => {\n\
    \  this.socialSharing.shareViaEmail(\n  'Veloice:Intelligent Business Telephony',\
    \ // Message\n  'Veloice', // Email Subject\n  ['toperson@xyz.com', 'tosecond@xyz.com'],\
    \ // TO: must\n  be null or an array\n  ['cc@xyz.com'], // CC: must be null or\
    \ an array\n  null, // BCC: must be null or an array\n  ['http://veloice.com/images/banner.png']\
    \ // FILES: can\n  be null, a string, or an array\n  );\n  }).catch(() => {\n\
    \  alert(\"Cannot share on Email\");\n  });\n  }\n\n  share() {\n  this.socialSharing.share(\"\
    Veloice:Intelligent\n  Business Telephony\", \"Real time Voice\", \"http://veloice.com/images/banner.png\"\
    , \"http://veloice.com\");\n  }\n\n}\n```"
