    \ 一个包含三个键的 JSON 对象；method、link 和 caption\n- api(path, permissions): 一个 Facebook\
    \ API 路径查询，例如 api(\"me\", [\"public_profile\"])\n- getLoginStatus(): 检查用户是否已登录\n\
    - getAccessToken(): 获取当前登录会话的访问令牌\n- logout(): 从 Facebook 注销\n\n要在浏览器中进行测试，你仍需要在应用程序配置中做一些更改：\n\
    \n```\nlet appID = 419376571536241;\nlet version = \"v2.0\"; // 或留空，默认是 v2.0\n\
    \nconstructor() {\n  Facebook.browserInit(appID, version);\n}\n```\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_204_0.png)\n\
    \n此外，你还必须设置重定向 URL，其外观如下。由于 Ionic 服务器运行在 8100 端口，你可以给出 http://localhost:8100 作为重定向\
    \ URL：\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_204_1.png)\n\n## 构建音乐播放器\n\n\
    我们现在将构建一个媒体播放器应用程序，其中你将拥有音频和视频流以及下载选项，将文件保存到你的手机。我们将主要集成用于通过 `ionic-audio` 包进行音频流的媒体插件，使用\
    \ `StreamingMedia` 插件播放视频，并使用 `FileTransfer` 插件将文件下载到本地系统目录。让我们先创建一个应用程序\n\n```\n\
    gaurav@gaurav-thinkpad:~/projects$ ionic start jingle-app tabs --v2\nCreating\
    \ an Ionic 2.x app in /home/gaurav/projects/jingle-app based on the tabs template.\n\
    \nDownloading: https://github.com/driftyco/ionic2-app-base/archive/master.zip\n\
    Downloading: https://github.com/driftyco/ionic2-starter-tabs/archive/master.zip\n\
    Installing npm packages (may take a minute or two)...\n\n♫♫♫♫ Your Ionic app is\
    \ ready to go! ♫♫♫♫♫\n\nSome helpful tips:\n\nRun your app in the browser (great\
    \ for initial development):\n  ionic serve\n\nRun on a device or simulator:\n\
    \  ionic run [android,browser]\n\nShare your app with testers, and test on device\
    \ easily with the Ionic View companion app:\n  http://view.ionic.io\ngaurav@gaurav-thinkpad:~/projects$\n\
    ```\n\n我们将使用 tabs 模板：\n\n我们只需要添加 **ionic platform add android** 平台，我们就可以准备好集成插件并构建我们的\
    \ jingle 应用程序。\n\n## 媒体、流媒体和传输插件\n\n我们将从一个简单的音乐播放器应用程序开始，它将演示不同插件的使用，但这里的可能性是无穷无尽的。你可能会考虑构建一个音乐推荐应用程序，根据你的输入、情绪或其他因素播放音乐，尽管为此你需要准备一个良好的后端应用程序来支持推荐。正如我们已经决定了应用程序的主要功能，我们现在需要主要安装三个\
    \ Cordova 插件，我们现在就安装它们：\n\n```\n$ ionic cordova:plugin add cordova-plugin-media\n\
    $ ionic cordova:plugin add cordova-plugin-file-transfer\n$ ionic cordova:plugin\
    \ add cordova-plugin-streaming-media\n```\n\n下一步将是安装它们各自的 NPM 包和 ionic-audio 模块，我们将用于音频播放器：\n\
    \n```\n$ npm install @ionic-native/media @ionic-native/filetransfer @ionic-native/streaming-media\
    \ ionic-audio --save\n```\n\n让我们集成 ionic-audio 模块，该模块会根据环境自动在 WebAudioProvider\
    \ 和 CordovaMediaProvider 之间切换，这在测试应用程序时非常有帮助，因为我们可以轻松地在浏览器本身中验证应用程序：\n\n```\n\
    // src/app/app.module.ts\nimport { IonicAudioModule, AudioProvider, WebAudioProvider,\
    \ audioProviderFactory } from 'ionic-audio';\nimport { NgModule, ErrorHandler,\
