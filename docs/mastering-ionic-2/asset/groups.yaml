  - '[PAGE 72]


    # # Platform specific resources


    Ionic provides support for building icons and splash screen resources for various
    platforms and devices. For building resources, we just need to place the source
    image inside the resources folder with the name `icon.png` and `splash.png`. This
    way you will get the extracted icons and splash screens for each platform, such
    as a Native rounded corners icon for iOS, and transparent background for an Android
    icon.


    To summarize the steps:


    +   1. Add files to the resources folder naming `icon.png` and `splash.png`. (`.psd`
    and `.ai` can also be used).

    +   2. Make sure the minimum size requirements for icon are 192x192 px and for
    splash 2208x2208 px.

    +   3. Run the `ionic resources` command from the CLI.


    ![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_72_0.png)


    > > Different platforms have different ways of styling icons, for example, iOS
    will apply its rounded corners, that is why we recommend the `Ionic` source file
    to be without rounded corners. Also, using the `ionic resources` command will
    require at least Cordova 3.6 or more.'
