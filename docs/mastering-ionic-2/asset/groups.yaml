    Ionic 应用结合使用的用例。我一直定期关注 Ionic 博客，看到许多团队使用 Ionic 来与他们的硬件设备进行交互，其中之一就是 jewelbots，它可以在朋友靠近时启用或向你发送消息。机会是巨大的，只需要一个想法来实现它并将其带到世界。


    我们几乎接近旅程的尾声，但仍有一个有趣的话题等待在下一节中介绍。我们在本章中讨论了为访问设备而安装多个原生应用程序的问题，而这个问题正是通过为 Ionic
    引入 PWA 支持而得到解决的。PWA 即使在低网速下也让用户体验变得沉浸式。印度许多电子商务和大型科技公司在 Flipkart 最初与 Chrome 团队合作推出其渐进式网络应用后，也推出了自己的渐进式网络应用。突然之间，我们可以看到市场正在增长，开发者正在构建平台以使当前网络应用能够启用
    PWA 功能。尽管如此，它并不会终结原生应用市场，因为我们没有所有插件的能力。使用 Ionic 的最好之处在于，完全相同的代码可以同时转换为 PWA 和原生应用。


    ## Ionic + PWA = Magic


    在移动应用之后出现的下一个大事物是面向移动网络的渐进式网络应用。**渐进式网络应用 (PWA)** 最初由 Google 于 2015 年启动，我们已经可以看到许多大型公司推出了面向移动网络的
    PWA 版本。在 PWA 之前，许多开发者和公司对移动网络失去了兴趣，只专注于原生应用，但 Google 变得严格，开始惩罚那些带有下载原生应用横幅或不具备移动友好性的网站的站点。在此之后，开发者也开始着手移动网络，同时
    Google Chrome 推出了对 PWA 的支持，而 Flipkart 最初与 Chrome 团队密切合作推出了其渐进式网络应用。


    一切都关乎提供出色的用户体验，无论是原生应用还是 PWA，最终用户并不关心，只要他们拥有流畅的体验即可。我们将在本章中探讨以下主题：


    - What and why PWAs?

    - Ionic supports PWA

    - Offline currency converter PWA

    - Future of PWAs


    ## What and why PWA?


    PWAs 是一种新型的网络应用。它们结合了原生应用的优势与网络的低摩擦特性。渐进式网络应用起初是简单的网站，但随着用户与其交互，它们会逐步获得超能力。它们从网站转变为更强大的东西，例如传统的原生应用。


    PWAs 具有以下特点：


    - **Reliable**: PWAs 即时加载，即使在糟糕的网络条件下也不会显示恐龙。当应用从用户主屏幕启动时，服务工作者（稍后会讨论）使渐进式网络应用能够即时加载，而不管网络状态如何。

    - **Portable**: 原生应用的可移植性有许多策略（包括混合应用），但与这些策略不同，PWAs 不会改变你的部署和打包模型。

    - **Engaging**: PWAs 在设备上感觉像是一个自然的应用，具有出色的用户体验。它们可安装，可以添加到用户主屏幕，而无需任何应用商店。它们提供与原生应用相同的全屏体验，甚至可以通过网络推送通知重新吸引用户。

    - **Fast**: PWAs 速度快，对交互做出快速响应并具有流畅的动画。用户总是期望网站快速流畅。根据一项调查，如果网站加载时间超过三秒，53% 的用户会放弃该网站。


    ## Advantages of PWA


    PWAs 相对于原生应用具有某些优势，它是未来数年内将上网的数十亿用户的未来。现在我们将谈论其优势以及它们对移动用户为何至关重要：


    - **Install prompt**: 安装横幅非常关键，它们会增加与应用的互动。目前，开发者无法控制这一点，而是由 Chrome 决定何时提示用户显示添加到主屏幕的选项。

    - **Works offline**: 许多地区的互联网连接可能非常糟糕，这就是为什么我们需要为应用提供离线支持。PWAs 有助于我们获得更好的用户体验和参与度。Cache
    APIs 和 IndexedDB 是实现 PWA 离线访问的两种推荐方法。

    - **Lightweight**: 渐进式网络应用只是网页，非常轻量且安装快速。PWAs 不会占用大量安装空间，并且会实时更新，因为它们无需通过 Play
    Store 审核。

    - **Linkable and discoverable**: 我们可以轻松分享 URL，并且由于 manifest 和服务工作者注册范围而被识别为应用。此外，还允许搜索引擎找到它。

    - **Web push notifications**: 服务工作者也有助于处理网络推送通知，这有助于重新吸引用户。PWA 仅通过 HTTPS 提供服务，因此确保了安全性。

    - **Update on use**: 与通常的原生应用更新策略不同，PWAs 的更新方式与网页相同：使用它们即可获得最新版本。

    - **Analyze before installation**: 你无需安装即可开始使用它们。它们只是简单的网页。用户在想要时选择安装。


    ## Disadvantages of PWA


    PWA 的缺点如下：


    - **Traffic through store**: PWA 缺少通过 Play Store 或应用商店进行主要搜索的重要流量。用户可以通过移动网络被重定向到
    Play Store 下载原生应用，但对于 PWA 来说则不适用。

    - **Plugin integration**: 诸如 Facebook 和 Google 登录之类的插件无法从其应用中获取数据，我们需要在网络上单独获取。

    - **Promotion**: 随着公司制作自己的应用内浏览器，在社交媒体上推广 PWA 体验变得越来越困难。

    - **Browser support**: 在某些设备上的某些浏览器中，PWAs 的完整支持不可用。


    ## Ionic supports PWA


    Ionic 团队是渐进式网络应用的忠实粉丝，它利用现代网络 API 提供类似应用的体验。由于 Ionic 3 是用在网络浏览器中完美运行的网络技术构建的，这在你使用
    Ionic 构建 PWA 时为你提供了巨大的优势，因为如果你知道如何构建 Ionic 3 应用，那么你就可以在短时间内轻松构建 PWA，你只需要添加服务工作者和一个网络清单文件。我们将构建一个具有
    PWA 支持的离线货币转换器，并最终将其托管在 Firebase Hosting 上。


    ## What makes a web application a PWA?


    简单来说，PWA 意味着最终会被安装到用户的主屏幕，这意味着他们会像使用原生应用一样访问它。因此用户期望与使用原生应用时相同的体验。由于 Ionic 3 旨在使用标准网络技术创建原生应用体验，因此这已经得到处理。


    PWA 应该非常高效，因为 PWA 将与原生应用一起安装到主屏幕。Ionic 3 是从一开始就以性能为目标构建的，这意味着你几乎不必为此担心。由于 PWA
    将安装在用户的主屏幕上，此过程需要你的应用的网络清单。值得庆幸的是，Ionic 3 CLI 附带了内置的清单文件。


    大多数原生应用在启动时可离线工作并为用户提供有限的离线体验，因此 PWA 也可以为用户做到这一点。在服务工作者的帮助下，我们现在可以让我们的网络应用在离线时工作。


