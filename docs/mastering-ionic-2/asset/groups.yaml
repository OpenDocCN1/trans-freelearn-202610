    # # Ionic APIs and custom modules


    Until now, we have worked on multiple Ionic components. To support these components
    we have Component APIs for classes such as checkbox, toggle, or item, which show
    how to use them. We have already used many APIs while we used the components.
    Now we will look further at all the useful APIs we have that can be used inside
    our e-commerce application. Also, another important aspect is using custom modules,
    which will further enhance the application by adding localization, making custom
