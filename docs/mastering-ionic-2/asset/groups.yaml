    \n## 基于接近度的屏幕锁定，使用 BLE\n\n这是一直以来我想实现的东西，也是我现实生活中的一个问题。是时候研究一下使用 BLE 栈与 Ionic 应用结合是否切实可行了。在办公室工作时，我经常需要离开座位去接一些紧急电话或参加会议。大多数时候我忘记给笔记本电脑屏幕锁定。所以，我想用\
    \ BLE 和 WebSockets 构建这个基于接近度的屏幕锁定应用。\n\n让我们先看看应用程序的工作原理。基于 Ionic 的应用程序会监听笔记本电脑持续广播的\
    \ iBeacon 数据包。当我带着手机离开座位时，在某个点上它会退出笔记本电脑的广播区域。立即，它会通过网络向运行在我 Ubuntu 笔记本上的 Node.js\
    \ 应用发送一个 socket 请求，并在我的笔记本上调用屏幕锁定命令。同样地，当我重新进入广播范围时，它会发送另一个 socket 请求来解锁笔记本。\n\
    \n我们在这里使用的技术栈是：\n\n- Node.js\n- Web Sockets\n- BLE\n- Ionic\n- Bash script\n\n\
    我们必须先准备好 Node.js 后端和 bash 脚本，才能开始我们的应用程序。在此之前，请确保已安装用于 BLE 和 Node.js 的所有 Debian\
    \ 包。\n\n```\n$ sudo apt-get install bluetooth bluez libbluetooth-dev libudev-dev\n\
    ```\n\n现在我们可以使用 `npm init` 命令初始化项目：\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_337_0.png)\n\
    \n我们为应用程序使用以下 NPM 包：\n\n- `app` 和 `http` - 用于创建 Web 服务器并在 5000 端口监听\n- `io` -\
    \ 用于 websocket 实现\n- `bleno` - 用于实现 BLE 外设\n- `child_process` - 用于执行 bash 文件\n\
    \n```javascript\n$ npm install express http bleno socket.io   // index.js\n\n\
    var app = require('express')(),\n    http = require('http').Server(app),\n   \
    \ io = require('socket.io')(http),\n    bleno = require('bleno');\n    exec =\
    \ require('child_process').exec;\n\n// Start advertising iBeacon\nvar uuid = '38a48d7e-05ab-11e7-93ae-92361f002671';\n\
    var major = 10; // 0x0000 - 0xffff\nvar minor = 5; // 0x0000 - 0xffff\nvar measuredPower\
    \ = -59 // -128 - 127\n\nbleno.on('stateChange', function(state) {\n    console.log('on\
    \ -> statechange: ' + state);\n    if (state === 'poweredOn') {\n        bleno.startAdvertisingIBeacon(uuid,\
    \ major, minor,\n            measuredPower);\n    } else {\n        bleno.stopAdvertising();\n\
    \    }\n});\n```\n\n最初，我们声明了用于广播 iBeacon 的属性。我们在这里监听 `stateChange` **listener**，这样在\
    \ **Bluetooth** 开启/关闭时，我们就可以分别使用 `startAdvertisingIBeacon()` 和 `stopAdvertising()`\
    \ 方法启动或停止 **iBeacon** 广播。\n\n现在我们准备好开始我们的 Ionic 应用以与后端交互。让我们使用 tabs starter 模板启动应用：\n\
    \n```\ngaurav@gaurav-thinkpad:~/projects/ionic$ ionic start lock-app tabs --v2\n\
    Creating an Ionic 2.x app in /home/gaurav/projects/ionic/lock-app based on the\
    \ tabs template.\nDownloading: https://github.com/driftyco/ionic2-app-base/archive/master.zip\n\
    Downloading: https://github.com/driftyco/ionic2-starter-tabs/archive/master.zip\n\
    Installing npm packages (may take a minute or two)...\n/ ♪ ♪ ♪ ♪  Your Ionic app\
    \ is ready to go! ♪ ♪ ♪ ♪\nSome helpful tips:\nRun your app in the browser (great\
    \ for initial development):\n  ionic serve\nRun on a device or simulator:\n  ionic\
    \ run ios[android,browser]\nShare your app with testers, and test on device easily\
    \ with the Ionic View companion app:\n  http://view.ionic.io\ngaurav@gaurav-thinkpad:~/projects/ionic$\n\
    ```\n\n由于我们已经清楚应用中将使用哪些内容，让我们安装平台、Cordova 插件和 NPM 包：\n\n```\n// add android platform\n\
    $ ionic platform add android\n\n// add ibeacon and diagnostic plugins\n$ ionic\
    \ plugin add cordova-plugin-ibeacon --save\n$ ionic plugin add cordova.plugins.diagnostic\
    \ --save\n\n// install NPM package for socket.io-client\n$ npm install socket.io-client\
    \ --save\n```\n\n我们首先通过检查蓝牙是否已启用并要求用户授予位置权限来开始，这在使用 diagnostic 插件时自 Android 6\
    \ 起成为强制要求：\n\n```typescript\n// src/app/app.component.ts\n\nimport { Component\
    \ } from '@angular/core';\nimport { Platform } from 'ionic-angular';\nimport {\
    \ IBeacon, Diagnostic, StatusBar, Splashscreen } from 'ionic-native';\n\nimport\
    \ { TabsPage } from '../pages/tabs/tabs';\n\ndeclare var cordova: any;\n\n@Component({\n\
    \  templateUrl: 'app.html'\n})\nexport class MyApp {\n  rootPage = TabsPage;\n\
    \n  constructor(platform: Platform) {\n    platform.ready().then(() => {\n   \
    \   // Okay, so the platform is ready and our plugins are available.\n      //\
    \ Here you can do any higher level native things you might need.\n\n      StatusBar.styleDefault();\n\
    \      Splashscreen.hide();\n\n      if (platform.is('cordova')) {\n\n       \
    \ // Checks if bluetooth is enabled\n        IBeacon.isBluetoothEnabled().then((isEnabled)\
    \ => {\n          console.log(\"isEnabled: \" + isEnabled);\n          if (!isEnabled)\
    \ {\n            // If not, enableBluetooth() enables it\n            IBeacon.enableBluetooth();\n\
    \          }\n        });\n\n        // Check if location is enabled\n       \
    \ Diagnostic.isLocationEnabled().then((result) => {\n          // If not, open\
    \ location settings\n          if (!result) {\n            Diagnostic.switchToLocationSettings();\n\
    \          }\n        });\n\n        // Diagnostic plugin\n        // After Android\
    \ 6, we need to explicitly\n        // ask for permission from the user\n    \
    \    Diagnostic.requestRuntimePermissions([\n          cordova.plugins.diagnostic.permission.ACCESS_FINE_LOCATION,\n\
    \          cordova.plugins.diagnostic.permission.ACCESS_COARSE_LOCATION\n    \
    \    ]);\n      });\n  }\n}\n```\n\n最初，我们检查 isBluetoothEnabled()，它会根据状态返回一个布尔值。之后，如果返回\
    \ false，则我们调用 enableBluetooth() 方法来启用蓝牙。同样，isLocationEnabled() 用于检查位置是否已启用，如果未启用，则调用\
    \ switchToLocationSettings() 方法，该方法会打开位置设置。\n\nDiagnostic.requestRuntimePermissions()\
    \ 需要获取运行时权限，这对于运行 Android 6 及以上版本的所有设备都是必需的。对于 BLE 的监控和测距，我们需要 ACCESS_FINE_LOCATION\
    \ 和 ACCESS_COARSE_LOCATION 权限：\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_340_0.png)\n\
    \n```typescript\nIBeacon.enableDebugNotifications();\n}\n}\nmanageLaptop(data,\
    \ status) {\n    this.socket.emit('status', status);\n}\n```\n\n`startMonitoringForRegion()`\
    \ 方法开始对指定区域进行监控，该区域的 `uuid`、major 和 minor 与我们的 Node.js 代码广播的一致。现在，当你离开座位并移出蓝牙范围时，`didExitRegion()`\
    \ 方法将被调用，它会订阅并进一步调用我们的 `manageLaptop()` 方法，传入数据和锁定状态。同样，当我们返回时，`didEnterRegion()`\
    \ 将被调用：\n\n```typescript\ninitialize() {\n    this.socket = io.connect(this.socketHost);\n\
    \n    this.socket.on(\"connect\", (msg) => {\n        console.log('on connect');\n\
    \    });\n\n    this.socket.on(\"reconnecting\", (msg) => {\n        console.log('on\
    \ reconnecting');\n    });\n\n    this.socket.on('disconnect', function() {\n\
    \        console.log('user disconnected');\n    });\n\n    this.socket.on(\"result\"\
    , (msg) => {\n        this.laptop_status = msg;\n        console.log(msg, \"==received=msg===\"\
    )\n    });\n}\n```\n\n在我们的 `manageLaptop()` 方法内部，我们向服务器发出自定义事件。在此之前，我们还初始化了 `initialize()`\
    \ 函数，以在后端 Node.js 应用运行的主机上与服务器建立初始连接。\n\n这样我们的整个演示就完成了。对我个人而言，它运行得非常好，并且提供了手动锁定和解锁按钮，我也可以远程锁定我的笔记本电脑。你可以用\
    \ Ionic 和 IoT 快速构建许多小技巧和原型。\n\n"
