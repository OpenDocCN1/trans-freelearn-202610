    \  ProductsFilterPage,\n  ProductDetailPage,\n  SearchPage,\n  WishlistPage,\n\
    \  ShowcartPage,\n  CheckoutPage,\n  SettingsPage,\n  SupportPage\n],\nproviders:\
    \ [\n  SplashScreen,\n  Deeplinks,\n  TextToSpeech,\n  AppRate,\n  GoogleAnalytics,\n\
    \  Camera,\n  CallNumber,\n  SocialSharing,\n  Push,\n  {provide: ErrorHandler,\
    \ useClass: IonicErrorHandler},\n  { provide: Storage, useFactory: provideStorage\
    \ },\n  UserService,\n  DataService\n]\n})\nexport class AppModule {}\n```\n\n\
    Furthermore, I would suggest you look at the code in this chapter for the vPlanet\
    \ Commerce app, which will help you get a good idea of what pages and components\
    \ we will be using in our application. As this chapter mainly targets various\
    \ Ionic components, we will be using a lot of these components in our application.\n\
    \n## Ionic components\n\nThere are many Ionic JavaScript components that we can\
    \ effectively use while building our application. What's best is to look around\
    \ for features that we will need in our application. Let's get started with the\
    \ home page of our e-commerce application, which will have an image slider with\
    \ banners on it.\n\n### Slides\n\nThe slides component is a multi-section container\
    \ that can be used in multiple scenarios, such as a tutorial view or banner slider.\
    \ The `<ion-slides>` component has multiple `<ion-slide>` elements, which can\
    \ be dragged or swiped left/right. Slides have multiple configuration options\
    \ available, which can be passed in the ion-slides such as autoplay, pager, direction:\
    \ vertical/horizontal, initial slide, and speed.\n\nUsing slides is really simple\
    \ as we just have to include them inside our home.html; no dependency is required\
    \ for this to be included in the home.ts file:\n\n```html\n// Banner Slider in\
    \ src/pages/home/home.html\n\n<ion-slides pager #adSlider (ionSlideDidChange)=\"\
    logLengthTrackEvent()\" style=\"height: 250px\">\n  <ion-slide *ngFor=\"let banner\
    \ of banners\">\n    <img [src]=\"banner\">\n  </ion-slide>\n</ion-slides>\n\n\
    // Defining banners image path\n\nexport class HomePage {\n\n  products: any;\n\
    \  banners: String[];\n\n  constructor() {\n    this.banners = [\n      'assets/img/banner-1.webp',\n\
    \      'assets/img/banner-2.webp',\n      'assets/img/banner-3.webp'\n    ]\n\
    \  }\n}\n```\n\nAs you can see from the preceding code, there are multiple properties\
    \ available for ion-slides, such as pager, autoplay, direction, and so on:\n\n\
    ![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_104_0.png)\n\nIf you look at the preceding\
    \ screenshot, you can see we have used white background banners. Actually, just\
    \ as a suggestion, try to use the same background color in banners that are inside\
    \ the application. This way the banners will come up nice in low or high resolution\
    \ mobiles and tabs.\n\n### Lists\n\nLists are one of the most used components\
    \ in many applications. Inside lists we can display rows of information. We will\
    \ be using lists multiple times inside our application, such as on the `categories`\
    \ page where we are showing multiple subcategories:\n\n```html\n// src/pages/categories/categories.html\n\
    <ion-content class=\"categories\">\n  <ion-list-header *ngIf=\"!categoryList\"\
    >Fetching Categories ....</ion-list-header>\n  <ion-list *ngFor=\"let cat of categoryList\"\
    >\n    <ion-list-header>{{cat.name}}</ion-list-header>\n    <ion-item *ngFor=\"\
    let subCat of cat.child\">\n      <ion-avatar item-left>\n        <img [src]=\"\
    subCat.image\">\n      </ion-avatar>\n      <h2>{{subCat.name}}</h2>\n      <p>{{subCat.description}}</p>\n\
    \      <button ion-button clear item-right (click)=\"goToProducts(subCat.id)\"\
    >View</button>\n    </ion-item>\n  </ion-list>\n</ion-content>\n```\n\nWe are\
    \ using an avatar list here with a header on top of each category. There are multiple\
    \ types of lists available such as multi-line, thumbnail, and sliding lists also.\
    \ We will be integrating the sliding list on the showcart page further in this\
    \ chapter:\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_107_0.png)\n\nAs you can\
    \ see, the preceding screenshot shows what the avatar list will look like on the\
    \ categories page. We should make sure that, before we plan to use lists in our\
    \ application, we have a look at the documentation, as this helps us visualize\
    \ which type of list can be utilized best in various different applications.\n\
    \n### Loading and Toast\n\nThe loading component can be used to indicate some\
    \ activity while blocking any user interactions. One of the most common cases\
    \ of using the Loading component is HTTP calls to the server, as we know it takes\
    \ time to fetch data from the server, until then for good user experience we can\
    \ show some content showing Loading ..., or Login wait ..., for login pages.\n\
    \nToast is a small popup that provides feedback, usually used when some action\
    \ is performed by the user. Ionic 3 now provides the toast component as part of\
    \ its library; previously we had to use the native Cordova plugin for toasts,\
    \ which can also be used now too.\n\nLoading and toast components both have a\
    \ `create` method. We have to provide options while creating these components:\n\
    \n```ts\n// src/pages/login/login.ts\nimport { Component } from '@angular/core';\n\
    import { NgForm } from '@angular/forms';\nimport { NavController, LoadingController,\
    \ ToastController, Events } from 'ionic-angular';\nimport { SignupPage } from\
    \ '../signup/signup';\nimport { HomePage } from '../home/home';\n\nimport { Auth,\
    \ IDetailedError } from '@ionic/cloud-angular';\n\nimport { UserService } from\
    \ '../../providers/user-service';\n\n@Component({\n  selector: 'page-user',\n\
    \  templateUrl: 'login.html'\n})\nexport class LoginPage {\n  login: { email?:\
    \ string, password?: string } = {};\n\n  submitted = false;\n\n  constructor(public\
    \ navCtrl: NavController,\n    public loadingCtrl: LoadingController,\n    public\
    \ auth: Auth,\n    public userService: UserService,\n    public toastCtrl: ToastController,\n\
    \    public events: Events) { }\n\n  onLogin(form: NgForm) {\n    this.submitted\
    \ = true;\n\n    if (form.valid) {\n      // start Loader\n      let loading =\
    \ this.loadingCtrl.create({\n        content: \"Login wait...\",\n        duration:\
    \ 20\n      });\n      loading.present();\n\n      this.auth.login('basic', this.login).then((result)\
    \ => {\n          // user is now registered\n          this.navCtrl.setRoot(HomePage);\n\
    \          this.events.publish('user:login');\n          loading.dismiss();\n\
    \          this.showToast(undefined);\n        }, (err: IDetailedError<string[]>)\
    \ => {\n          console.log(err);\n          loading.dismiss();\n          this.showToast(err)\n\
    \        });\n    }\n  }\n\n  showToast(response_message: any) {\n    let toast\
    \ = this.toastCtrl.create({\n      message: (response_message ? response_message\
    \ : \"Log In Successfully\"),\n      duration: 1500\n    });\n    toast.present();\n\
    \  }\n\n  onSignup() {\n    this.navCtrl.push(SignupPage);\n  }\n}\n```\n\nAs\
    \ you can see from the preceding code, creating a loader and toast is almost similar\
    \ at code level. The options provided while creating are also similar; we have\
    \ used loader here while logging in and toast after that to show the desired message.\n\
    \n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_111_0.png)\n\n*Setting the duration\
    \ option is good, because if the loader is dismissed or not handled properly in\
    \ code then we will block the user from any further interactions on the app. In\
    \ HTTP calls to the server we might get connection issues or failure cases; in\
    \ that scenario it may end up blocking users.*\n"
