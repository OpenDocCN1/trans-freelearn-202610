    # CORS


    **Cross Origin Resource Sharing (CORS)** was designed mainly to access resources
    from cross domains. Cross-domain policy does not apply to Cordova, so we don''t
    have to think much about when testing on a device:


    While running the same app on a browser it might gave a CORS error while accessing
    resources from the cross domain. When you run the `ionic serve` command you will
    see this issue. There are four methods to bypass it:


    +   - Disable Chrome security

    +   - Browser extension

    +   - Proxy server

    +   - The easiest and most convenient way is to run the application in Google
    Chrome with flag: `--disable-web-security`:


    ```

    $ google-chrome -disable-web-security

    $ chromium-browser -disable-web-security You can run same command for chromium
    browser also. Make sure you have closed the running google-chrome or chromium
    before you ran it with this command. When you open it with disabling web security,
    you will see a warning message on the browser mentioning "You are using an unsupported
    command-line flag: --disable-web-security. Stability and security will suffer".

    ```


    Another way would be to install a browser extension, which will allow/disable
    CORS. Usually, these plugins internally change the response header for any XHR
    request when they are turned on. There are many extensions available, such as
    **CORS toggle** and **Force CORS**.'
