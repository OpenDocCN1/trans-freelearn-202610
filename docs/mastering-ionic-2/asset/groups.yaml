  - '[PAGE 172]


    # Commonly used Cordova plugins


    Whenever you start a new Ionic project and add a platform to it, you can see that
    there are some plugins that are installed by default. Ionic installs the following
    mentioned plugins when you add Android or iOS platforms:


    +   - ionic-plugin-keyboard

    +   - cordova-plugin-console

    +   - cordova-plugin-device

    +   - cordova-plugin-splashscreen

    +   - cordova-plugin-whitelist

    +   - cordova-plugin-statusbar


    Let''s get started with the previously mentioned plugins and see what they are
    used for.'
