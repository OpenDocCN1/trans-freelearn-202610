  - "[PAGE 123]\n\n# # Complex grids\n\nWe will be starting with one of the common\
    \ problems many developers face while building applications in the Ionic grid\
    \ system. The Ionic grid system is based on flexbox (http://www.w3.org/TR/css3-flexbox/),\
    \ which is a CSS3 feature that is supported by all devices. Grids contain three\
    \ components: grid, rows, and columns. Here are some important points to note\
    \ about the grids system:\n\n+   - `ion-grid` and `ion-col` have padding by default\
    \ of 5px, but the `ion-row` has no padding and no margin.\n+   - The `no-padding`\
    \ attribute can be added for removing that padding.\n+   - Twelve column layout\
    \ is used, similar to what we have in bootstrap grid system.\n+   - `column` attribute\
    \ is used in `ion-col` for setting width, such as `<ion-col col-3>` and the default,\
    \ is `col-12`. Also, by default columns take up equal width inside of a row for\
    \ all devices and screens.\n+   - There are five grid tiers: `col-xs`, `col-sm`,\
    \ `col-md`, `col-lg`, and `col-xl` which correspond to different screen sizes.\n\
    +   - `offset` is an attribute added to set offset which increases the margin\
    \ left by * columns, such as `<ion-col offset-1>`\n+   - We can align columns\
    \ in the row such as `align-self-center` which will align column in the center.\
    \ For more attributes details check https://ionicframework.com/docs/api/components/grid/Col/.\n\
    +   - Similarly we have row attributes and by default columns will stretch to\
    \ fill entire height of row. For more attributes details check https://ionicframework.com/docs/api/components/grid/Row/.\n\
    \nWe have to use grids while we design different layouts in our application. The\
    \ simplest layout can be built using `width` and `offset` attributes. We have\
    \ built a layout for our home page of the e-commerce app in which we have two\
    \ cards in a row:\n\n```\n```html\n<ion-grid no-padding>\n  <ion-row>\n    <ion-col\
    \ no-padding col-6 col-md-3 *ngFor=\"let product\n    of products;\">\n      <ion-card>\n\
    \        <img [src]=\"product.imageUrl\"/>\n        <ion-card-content>\n     \
    \     <ion-card-title no-padding>\n            {{product.productName}}\n     \
    \     </ion-card-title>\n          <ion-row no-padding class=\"center\">\n   \
    \         <ion-col>\n              <b>{{product.price | currency }} &nbsp; </b><span\n\
    \                class=\"discount\">{{product.listPrice |\n                currency}}</span>\n\
    \            </ion-col>\n          </ion-row>\n        </ion-card-content>\n \
    \     </ion-card>\n    </ion-col>\n  </ion-row></ion-grid>\n```\n```\n\nWith the\
    \ new grid system it make life of developer really easy. Previously, just for\
    \ aligning two cards in a row and iterate it we had to use multiple `*ngFor` and\
    \ iterate it on row and col. Now, this grid system is highly inspired by the bootstrap\
    \ grid system which is really familiar to all of us, So we have two cards in a\
    \ row on a small screen and for medium and above we will have four cards in a\
    \ row:"
  md: "\n## Tabs versus Segments\n\nTabs are the easiest way to switch between views\
    \ and organize content at a higher level. On the other hand, a segment is a group\
    \ of buttons and it can be treated as a local switch Tab inside a particular component\
    \ mainly used as a filter. With Tabs we can build a quick access bar in the footer\
    \ where we can place menu options such as home, favorites, and cart. This way\
    \ we can have one click access to these pages or components. On the other hand,\
    \ we can use segments inside the account component and divide the data displayed\
    \ in three segments, profile, orders, and wallet:\n\n```html\n// src/pages/account/account.html\n\
    <ion-header>\n  <ion-navbar>\n    <button menuToggle>\n      <ion-icon name=\"\
    menu\"></ion-icon>\n    </button>\n    <ion-title>Account</ion-title>\n  </ion-navbar>\n\
    \  <ion-toolbar [color]=\"isAndroid ? 'primary' : 'light'\" no-border-top>\n \
    \   <ion-segment [(ngModel)]=\"account\" [color]=\"isAndroid ? 'light' : 'primary'\"\
    >\n      <ion-segment-button value=\"profile\">\n        Profile\n      </ion-segment-button>\n\
    \      <ion-segment-button value=\"orders\">\n        Orders\n      </ion-segment-button>\n\
    \      <ion-segment-button value=\"wallet\">\n        Wallet\n      </ion-segment-button>\n\
    \    </ion-segment>\n  </ion-toolbar>\n</ion-header>\n\n<ion-content class=\"\
    outer-content\">\n  <div [ngSwitch]=\"account\">\n\n    <div padding-top text-center\
    \ *ngSwitchCase=\"'profile'\">\n      <img src=\"http://www.gravatar.com/avatar?d=mm&s=140\"\
    >\n      <h2>{{username}}</h2>\n\n      <ion-list inset>\n        <button ion-item\
    \ (click)=\"updatePicture()\">Update Picture</button>\n        <button ion-item\
    \ (click)=\"changePassword()\">Change Password</button>\n        <button ion-item\
    \ (click)=\"logout()\">Logout</button>\n      </ion-list>\n\n    </div>\n\n  \
    \  <div padding-top text-center *ngSwitchCase=\"'orders'\">\n      // Order List\
    \ data to be shown here\n    </div>\n\n    <div padding-top text-center *ngSwitchCase=\"\
    'wallet'\">\n      // Wallet statement and transaction here.\n    </div>\n\n \
    \ </div>\n</ion-content>\n```\n\nThere are many properties available for Tabs,\
