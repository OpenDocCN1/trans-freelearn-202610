    \ see, both virtual and infinite scroll are almost the same with respect to the\
    \ template and its methods. You can find similar attributes in both components,\
    \ where you can declare `loadingText` and `loadingSpinner`. If required we can\
    \ further customize both virtual and infinite scroll design with custom SVG and\
    \ CSS animations.\n\n### Ionic rating\n\nIonic rating is a third-party module\
    \ for visualizing the rating bar. We will be using this module in our application\
    \ in the product-detail page. This module is available as an NPM module, so it\
    \ will be really easy and quick to integrate:\n\n```bash\n$ npm install --save\
    \ ionic2-rating\n```\n\n```typescript\n// src/app/app.module.ts\n\nimport { Ionic2RatingModule\
    \ } from 'ionic2-rating';\n\nimports: [\n    IonicModule.forRoot(vPlanetApp),\n\
    \    Ionic2RatingModule,\n    TranslateModule.forRoot({\n        provide: TranslateLoader,\n\
