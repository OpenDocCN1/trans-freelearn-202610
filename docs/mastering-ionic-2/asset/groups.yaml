    # Ionic package


    Ionic package is another Cloud service that eases the native build process for
    different platforms. Basically, `ionic package` builds the Cordova application
    in the cloud. It is a perfect choice for someone who needs to build iOS apps,
    but works on Windows or Linux. Some advantages of using the `ionic package` service
    are:


    +   - Sends builds to others

    +   - Builds apps for platform not supported

    +   - Generates `.apk` and `.ipa` files, which can be directly uploaded to app
    stores


    As we have already set up the security profile and credentials, we can straightaway
    get started. Here we build our application for `PLATFORM_TAG` Android and `PROFILE_TAG`
    prod:


    ```

    gaurav@gaurav-thinkpad:~/projects/ionic/vplanet-commerce$ ionic package build
    android --profile prod --release

    The resources folder already exists. We will not overwrite your files unless you
    pass the --force argument.

    Running with the force flag will overwrite your resources directory and modify
    your config.xml file

    Preparing your resources...

    splash ios Default-Portrait@ipadpro.png (2048x2732) skipped, source image splash.png
    (2208x2208) too small

    splash ios Default-Landscape@ipadpro.png (2732x2048) skipped, source image splash.png
    (2208x2208) too small

    Uploading your project to Ionic...

    Submitting your app to Ionic Package...

    Your app has been successfully submitted to Ionic Package!

    Build ID: 5

    We are now packaging your app.

    ```


    You can now see from the list of package builds available, their build status,
    and download them by ID:


    ```

    gaurav@gaurav-thinkpad:~/projects/ionic/vplanet-commerce$ ionic package list

    id | status | platform | mode | started | finished

    5 | SUCCESS | android | release | Mar 9th, 2017 3:52:54 | Mar 9th, 2017 3:53:46

    4 | SUCCESS | android | debug | Mar 9th, 2017 3:35:00 | Mar 9th, 2017 3:35:48

    3 | FAILED | android | debug | Mar 9th, 2017 3:21:46 |

    2 | FAILED | android | debug | Mar 9th, 2017 3:14:12 |

    1 | FAILED | android | debug | Mar 9th, 2017 2:59:09 |

    Showing 5 of your latest builds.

    ```


    For downloading you need to just mention `BUILD_ID`:


    ```

    $ ionic package download 4

    ```


    Many times we did not apply the `-save` flag while adding a cordova plugin, which
    did not make an entry inside `config.xml`. To make sure that the Ionic package
    service knows what plugins you need do a `ionic plugin save` so that all the plugin
    entries will be made in `config.xml`.


    > Note: After the release of Ionic CLI 3 beta, commands like package, upload,
    setup, share and many other are removed. There commands will work fine with Ionic
    CLI v2 but if you are planning to upgrade so look for alternative commands in
    v3. Also, as v3 still in beta we don''t have complete clarity about alternative
    to these commands.


    ![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_246_0.png)'
