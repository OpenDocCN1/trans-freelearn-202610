    \      value: 'popular'\n    });\n    alert.addInput({\n      type: 'radio',\n\
    \      label: 'Low to High',\n      value: 'lth'\n    });\n    alert.addInput({\n\
    \      type: 'radio',\n      label: 'High to Low',\n      value: 'htl'\n    });\n\
    \    alert.addInput({\n      type: 'radio',\n      label: 'Newest First',\n  \
    \    value: 'newest'\n    });\n\n    alert.addButton('Cancel');\n    alert.addButton({\n\
    \      text: 'OK',\n      handler: data => {\n        console.log(data);\n   \
    \     // Here we can call server APIs with sorted data\n        // using the data\
    \ which user applied.\n      }\n    });\n\n    alert.present().then(() => {\n\
    \      // Here we place any function that\n      // needs to be called as the\
    \ alert is opened.\n    });\n  }\n}\n```\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_118_0.png)\n\
    \n这里是“取消”和“确定”按钮。我们在此处使用它来根据相关性、价格或其他排序值对产品进行排序。\n\n我们还可以准备自定义警报，在其中指定多个选项。如前一个示例所示，我们有五个单选选项；同样，我们甚至可以添加一个文本输入框来接收一些输入并提交。除此之外，在创建警报时，请记住\
    \ `AlertController` 组件（https://ionicframework.com/docs/v2/api/components/alert/AlertController/）中所有警报都存在警报、输入和按钮选项属性。\n\
    \n以下是一些警报选项：\n\n- `title: // string`：警报的标题\n- `subTitle: // string (可选)`：弹出窗口的副标题\n\
    - `Message: // string`：警报的消息\n- `cssClass: // string`：自定义 CSS 类名\n- `inputs: //\
    \ array`：警报的输入集合\n- `buttons // array (可选)`：按钮数组\n\n```html\n// src/pages/home/home.html\n\
    <br/><br/>\n<ion-card>\n  <br/>\n  <img [src]=\"prdt.imageUrl\"/>\n  <br/>\n \
    \ <ion-card-content>\n    <br/>\n    <ion-card-title no-padding>\n      <br/>\n\
    \      {{prdt.productName}}\n      <br/>\n    </ion-card-title>\n    <br/>\n \
    \   <ion-row no-padding class=\"center\">\n      <br/>\n      <ion-col>\n    \
    \    <br/>\n        <b>{{prdt.price | currency }} &nbsp; </b>\n        <span class=\"\
    discount\">{{prdt.listPrice | currency}}</span>\n        <br/>\n      </ion-col>\n\
    \      <br/>\n    </ion-row>\n    <br/>\n  </ion-card-content>\n  <br/>\n</ion-card>\n\
    \n<ion-badge width=\"25\">4.1</ion-badge>\n```\n\n## Ionic API 与自定义模块\n\n到目前为止，我们已经使用了多个\
    \ Ionic 组件。为了支持这些组件，我们为 checkbox、toggle、item 等类提供了组件 API，这些 API 展示了如何使用它们。在使用组件时，我们已经使用了许多\
    \ API。现在，我们将进一步研究所有可用于我们电子商务应用的有用 API。此外，另一个重要方面是使用自定义模块，通过添加本地化、创建自定义管道等进一步增强应用。\n\
    \n## 复杂网格\n\n我们将从许多开发者在 Ionic 网格系统中构建应用时常见的难题之一开始。Ionic 网格系统基于 flexbox（http://www.w3.org/TR/css3-flexbox/），这是一个所有设备都支持的\
    \ CSS3 特性。网格包含三个组件：网格（grid）、行（row）和列（col）。关于网格系统，有几点需要特别注意：\n\n- `ion-grid` 和\
    \ `ion-col` 默认有 5px 的内边距，但 `ion-row` 没有内边距和外边距。\n- 可以添加 `no-padding` 属性来移除该内边距。\n\
    - 使用十二列布局，类似于 Bootstrap 网格系统中的布局。\n- 在 `ion-col` 中使用 `column` 属性来设置宽度，例如 `<ion-col\
    \ col-3>`，默认为 `col-12`。此外，默认情况下，列在所有设备和屏幕上都占据行内相同的宽度。\n- 有五个网格层级：`col-xs`、`col-sm`、`col-md`、`col-lg`\
    \ 和 `col-xl`，它们对应不同的屏幕尺寸。\n- `offset` 是一个用于设置偏移的属性，该属性会增加 * 列的左边距，例如 `<ion-col\
    \ offset-1>`\n- 我们可以在行中对齐列，例如 `align-self-center` 可使列居中。更多属性详情请查看 https://ionicframework.com/docs/api/components/grid/Col/。\n\
    - 类似地，我们还有行属性，默认情况下列会拉伸以填满行的整个高度。更多属性详情请查看 https://ionicframework.com/docs/api/components/grid/Row/。\n\
