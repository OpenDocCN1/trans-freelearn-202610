    # # Ionic + PWA = Magic


    The next big thing coming after mobile applications are progressive web applications
    for mobile web. **Progressive web applications (PWA)** was originally started
    by Google in 2015 and we can already see many major companies came up with their
    PWA version for mobile web. Before PWA, many developers and companies lost interest
    in mobile web and were just focusing on native applications, but Google became
    strict and started penalizing sites for having banners to download native applications
    or not having mobile-friendly site. So after this developers started working on
    mobile web also and at the same time Google Chrome launched a support for PWA,
    and Flipkart initially came up with their progressive web application working
    closely with the Chrome team.


    It''s all about delivering amazing user experiences, whether it''s a native application
    or a PWA, end users don''t care as long as they have a smooth experience. We will
