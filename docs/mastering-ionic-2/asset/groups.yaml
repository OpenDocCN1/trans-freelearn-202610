    \   CloudModule.forRoot(cloudSettings)\n],\n\n// src/pages/product-detail/product-detail.html\n\
    <rating [(ngModel)]=\"rate\" readOnly=\"false\" max=\"5\"></rating>\n```\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_145_0.png)\n\
    \nThe Ionic community has evolved a lot in the last three years; there are multiple\
    \ third-party components available on GitHub, which you can smartly use inside\
    \ your application the same as we used the ionic-rating plugin for our e-commerce\
    \ application. Some of the components are:\n\n- [Ionic rating](https://github.com/andrucz/ionic2-rating)\n\
    - [Image cache and loader](https://github.com/zyra/ionic-image-loader)\n- [Mandatory\
    \ install](https://github.com/NextFaze/ionic-manup)\n- [Geofencing](https://github.com/tsubik/ionic2-geofence)\n\
    - [Accordion](https://github.com/mahmoudissmail/ionic2Accordion)\n- [Calendar](https://github.com/twinssbc/Ionic2-Calendar)\n\
    \nThe best way to find these awesome pieces of code is by searching on GitHub\
    \ and looking for the top starred Ionic projects. I have been using this hack\
    \ for learning what developers are silently doing or working on Ionic. All these\
    \ projects are MIT licensed most of the time so you can freely use them inside\
    \ your application.\n\n## Lazy Loading with Ionic 3\n\nLazy Loading is a much-awaited\
    \ feature that was recently released with Ionic 3. Lazy Loading will improve our\
    \ application's startup time, reduce the bundle size, and remove the hassle of\
    \ including the same component path in every class, which eases the process of\
    \ setting up Ionic routing. Let's look into what changes are required and how\
    \ your application will improve. Also, in Chapter 5, Authentication, Authorization,\
    \ and Security, the application demonstration will have lazy loading implemented\
    \ inside it.\n\nCurrently, lazy loading components have some known bugs which\
    \ the Ionic team is actively working upon. Also, setting this up will override\
    \ `DeepLinkConfig` defined in `IonicModule.forRoot`. We will be introducing `IonicPageModule`\
    \ in each component and a new `module.ts` file in each page component. Make sure\
    \ you actively follow the Ionic blog and any new releases which can come up with\
    \ further bug fixes and new features.\n\nPreviously, we imported all the pages\
    \ in one go inside our `app.module.ts`, and now we just load our `app.component.ts`\
    \ initially. So, all these components like `HomePage` will be removed from declarations\
    \ and entryComponents. Next, inside our `src/pages/home` directory, we have introduced\
    \ another file, `home.module.ts`, similar to what we have in `app.module.ts`.\
    \ Now if you generate a page using the Ionic CLI, you will find four files created:\n\
    \n```text\nhome.html\n\nhome.module.ts\n\nhome.scss\n\nhome.ts\n\n// src/pages/home/home.ts\n\
    \nimport { Component } from '@angular/core';\n\nimport { IonicPage, NavController\
    \ } from 'ionic-angular';\n\n@IonicPage()\n\n@Component({\n    selector: 'page-home',\n\
    \    templateUrl: 'home.html',\n})\n\nexport class HomePage {\n    constructor(public\
    \ navCtrl: NavController) {}\n\n    moveTo(data: any) {\n        this.navCtrl.push(\"\
    ContactPage\", data);\n    }\n}\n```\n\nAlso, now if we want to push or pop to\
    \ any other component, we don't require importing it. We can directly handle that\
    \ as a string; during the build process, deeplinks will be generated that know\
    \ how to handle that string. The string is actually a reference to the name property\
    \ of the `@IonicPage` decorator, which defaults to the class name as a string.\
    \ If we change that name property to something else, we'll also need to update\
    \ the reference we use elsewhere. You can find more about `IonicPage` and supported\
    \ fields here (http://ionicframework.com/docs/v2/nightly/api/navigation/IonicPage/).\n\
    \n### Summary\n\nIonic components and related resources are the backbone of any\
    \ Ionic application. With intelligent use of components and available third-party\
    \ components, we can get better performance and make our application user friendly.\
    \ Choosing the right component for the right place is tricky, and the most interesting\
    \ part is we have to think from the perspective of the end user and the end user's\
    \ experience with our application. We have to make sure that the user does not\
    \ feel as if they are in a different world and away from the native experience,\
    \ which usually happens. We can cover as many important components and important\
    \ points as we want in this chapter, but what is suggested is to stay updated\
    \ in the community and look for available resources that you can utilize easily\
    \ for your application. Next, we will be moving towards the integration of plugins\
    \ within our application. As almost every application uses one plugin or another,\
    \ it's very critical for production applications to integrate plugins correctly.\
    \ Camera, GPS, filesystem, and network plugins are commonly used plugins. We will\
    \ work on integrating these commonly used plugins and also some complex plugins\
    \ that many developers have a problem with while integrating. The Ionic team have\
    \ already launched an awesome project, Ionic Native, which eases the process of\
    \ using Cordova plugins. Ionic Native is a wrapper library written over many of\
    \ the plugins, so we can easily integrate it inside Angular-based Ionic applications.\n\
    \n## Ionic Native and Plugins\n\nWe have now gone through some advanced components\
    \ and APIs in Ionic. Another important part of building hybrid mobile applications\
    \ are Cordova plugins. Plugins create a bridge between Native APIs and JavaScript,\
    \ which help us to use Native APIs such as camera, GPS, files, and so on. Plugins\
    \ are comprised of platform-specific Native library code and a JavaScript interface\
    \ to call respective Native platform methods. Ionic is dependent on Cordova to\
    \ build, debug, and release applications. We will be covering almost everything\
    \ regarding Cordova plugins, Ionic Native, and some common and advanced plugins\
    \ in this chapter. Initially, the Ionic team came up with ngCordova, which was\
    \ based upon Angular 1.x, but moving forward, we have Ionic Native, which supports\
    \ Ionic 1, 2, and 3 applications. ngCordova was bound to Ionic 1, and Ionic Native\
    \ is framework agnostic:\n\n- Cordova and how plugins work\n- Ionic Native\n-\
    \ Commonly used Cordova plugins (camera, GPS, contacts)\n- Building a music player\n\
    - Cordova versus PhoneGap\n"
  mdcn: "\n\n高度，虽然不一定要给出确切数字，但接近确切高度会更好。\n\n无限滚动是指在用户滚动到指定距离后，页面内容会被动态追加。在无限滚动中，会调用一个函数来异步获取新数据并追加到列表中：\n\
    \n```html\n<ion-content>\n  <ion-list>\n    <ion-item *ngFor=\"let product of\
    \ products\">\n      {{product.name}}</ion-item>\n  </ion-list>\n\n  <ion-infinite-scroll\n\
    \    (ionInfinite)=\"getNewProducts($event)\">\n    <ion-infinite-scroll-content></ion-infinite-scroll-content>\n\
    \  </ion-infinite-scroll>\n</ion-content>\n```\n\n`ionInfinite` 属性用于调用 `getNewProducts()`\
    \ 函数，该函数最终会获取新数据：\n\n```typescript\nexport class ProductsPage {\n\n  constructor()\
    \ {}\n\n  getNewProducts(infiniteScroll) {\n    // Call an HTTP function or service\n\
    \    // fetches new data and append to the products array list.\n    // Make sure\
    \ to call complete method to close the loader icon.\n    infiniteScroll.complete();\n\
    \  }\n}\n```\n\n正如你所看到的，虚拟滚动和无限滚动在模板及其方法方面几乎是相同的。你可以在两个组件中找到相似的属性，在其中可以声明 `loadingText`\
    \ 和 `loadingSpinner`。如果需要，我们可以进一步使用自定义的 SVG 和 CSS 动画来定制虚拟滚动和无限滚动的设计。\n\n### Ionic\
    \ 评分\n\nIonic 评分是一个用于可视化评分条的第三方模块。我们将在应用的商品详情页中使用这个模块。该模块以 NPM 模块的形式提供，因此集成起来非常快速简单：\n\
    \n```bash\n$ npm install --save ionic2-rating\n```\n\n```typescript\n// src/app/app.module.ts\n\
    \nimport { Ionic2RatingModule } from 'ionic2-rating';\n\nimports: [\n    IonicModule.forRoot(vPlanetApp),\n\
    \    Ionic2RatingModule,\n    TranslateModule.forRoot({\n        provide: TranslateLoader,\n\
    \        useFactory: createTranslateLoader,\n        deps: [Http]\n    }),\n \
    \   CloudModule.forRoot(cloudSettings)\n],\n\n// src/pages/product-detail/product-detail.html\n\
    <rating [(ngModel)]=\"rate\" readOnly=\"false\" max=\"5\"></rating>\n```\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_145_0.png)\n\
    \nIonic 社区在过去三年中发展迅速；GitHub 上有多个第三方组件可用，你可以在应用中间巧妙地使用它们，就像我们在电商应用中使用 ionic-rating\
    \ 插件一样。其中一些组件包括：\n\n-   [Ionic 评分](https://github.com/andrucz/ionic2-rating)\n\
    -   [图片缓存和加载器](https://github.com/zyra/ionic-image-loader)\n-   [强制安装](https://github.com/NextFaze/ionic-manup)\n\
    -   [地理围栏](https://github.com/tsubik/ionic2-geofence)\n-   [手风琴组件](https://github.com/mahmoudissmail/ionic2Accordion)\n\
    -   [日历组件](https://github.com/twinssbc/Ionic2-Calendar)\n\n寻找这些优秀代码的最佳方式是在 GitHub\
    \ 上搜索并查看星标数最高的 Ionic 项目。我一直在使用这种技巧来了解开发者们在 Ionic 上默默做着什么或正在研究什么。大多数情况下，这些项目都采用\
    \ MIT 许可证，因此你可以在应用中自由使用它们。\n\n## 使用 Ionic 3 实现懒加载\n\n懒加载是 Ionic 3 最近发布的一个备受期待的功能。懒加载将改善应用的启动时间，减少打包体积，并消除在每个类中包含相同组件路径的麻烦，从而简化设置\
    \ Ionic 路由的过程。让我们看看需要做哪些更改，以及你的应用将如何改进。另外，在第 5 章“身份验证、授权与安全”中，应用演示将实现懒加载。\n\n\
    目前，懒加载组件存在一些已知的缺陷，Ionic 团队正在积极解决。此外，设置懒加载会覆盖 `IonicModule.forRoot` 中定义的 `DeepLinkConfig`。我们将为每个组件引入\
    \ `IonicPageModule`，并在每个页面组件中添加一个新的 `module.ts` 文件。请务必持续关注 Ionic 博客以及任何可能带来更多缺陷修复和新功能的新版本。\n\
    \n以前，我们在 `app.module.ts` 中一次性导入所有页面，而现在我们只初始化加载 `app.component.ts`。因此，像 `HomePage`\
    \ 这样的所有组件都从 declarations 和 entryComponents 中移除。接下来，在我们的 `src/pages/home` 目录中，我们引入了另一个文件\
    \ `home.module.ts`，类似于我们在 `app.module.ts` 中的文件。现在，如果你使用 Ionic CLI 生成一个页面，你会发现创建了四个文件：\n\
    \n```text\nhome.html\n\nhome.module.ts\n\nhome.scss\n\nhome.ts\n\n// src/pages/home/home.ts\n\
    \nimport { Component } from '@angular/core';\n\nimport { IonicPage, NavController\
    \ } from 'ionic-angular';\n\n@IonicPage()\n\n@Component({\n    selector: 'page-home',\n\
    \    templateUrl: 'home.html',\n})\n\nexport class HomePage {\n    constructor(public\
    \ navCtrl: NavController) {}\n\n    moveTo(data: any) {\n        this.navCtrl.push(\"\
    ContactPage\", data);\n    }\n}\n```\n\n此外，现在如果我们想导航到（push）或返回（pop）任何其他组件，不再需要导入它。我们可以直接将其作为字符串处理；在构建过程中，会生成知道如何处理该字符串的深层链接。该字符串实际上是对\
    \ `@IonicPage` 装饰器的 `name` 属性的引用，该属性默认为类名字符串。如果我们将该 `name` 属性改为其他值，还需要更新在其他地方使用的引用。你可以在这里（http://ionicframework.com/docs/v2/nightly/api/navigation/IonicPage/）找到关于\
    \ `IonicPage` 及其支持字段的更多信息。\n\n### 小结\n\nIonic 组件和相关资源是任何 Ionic 应用的基础。通过智能使用组件和可用的第三方组件，我们可以获得更好的性能，并使我们的应用对用户更友好。在正确的位置选择正确的组件是很讲究的，最有趣的部分是我们必须从最终用户的角度以及最终用户对应用体验的角度去思考。我们必须确保用户不会感觉自己处于一个不同的世界，不会脱离原生体验，这种情况经常发生。我们可以在本章中涵盖尽可能多的重要组件和重点，但更建议的是持续关注社区动态，并寻找可以轻松用于应用的可用资源。接下来，我们将转向应用内插件的集成。由于几乎每个应用都使用某种插件，因此正确集成插件对于生产级应用至关重要。相机、GPS、文件系统和网络插件是常用的插件。我们将集成这些常用插件，以及一些许多开发者在集成时遇到问题的复杂插件。Ionic\
    \ 团队已经发布了一个很棒的项目——Ionic Native，它简化了 Cordova 插件的使用流程。Ionic Native 是一个基于许多插件的包装库，因此我们可以轻松地将其集成到基于\
    \ Angular 的 Ionic 应用中。\n\n## Ionic Native 和插件\n\n现在我们已经了解了 Ionic 中的一些高级组件和 API。构建混合移动应用的另一个重要部分是\
    \ Cordova 插件。插件在原生 API 和 JavaScript 之间建立了桥梁，帮助我们使用相机、GPS、文件等原生 API。插件由特定平台的原生库代码和用于调用相应原生平台方法的\
    \ JavaScript 接口组成。Ionic 依赖 Cordova 来构建、调试和发布应用。在本章中，我们将涵盖有关 Cordova 插件、Ionic Native\
    \ 以及一些常见和高级插件的几乎所有内容。起初，Ionic 团队推出了基于 Angular 1.x 的 ngCordova，但后来我们有了支持 Ionic\
    \ 1、2 和 3 应用的 Ionic Native。ngCordova 绑定于 Ionic 1，而 Ionic Native 与框架无关：\n\n-  \
    \ Cordova 以及插件的工作原理\n-   Ionic Native\n-   常用 Cordova 插件（相机、GPS、通讯录）\n-   构建音乐播放器\n\
    -   Cordova 与 PhoneGap 的对比\n\n"
