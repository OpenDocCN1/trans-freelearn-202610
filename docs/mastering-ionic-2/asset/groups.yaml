    \n## Alerts\n\nAlerts are the components provided in Ionic for showing trigger\
    \ alerts, confirm, prompts, or some specific actions. AlertController can be imported\
    \ from ionic-angular, which allows us to programmatically create and show alerts\
    \ inside the application. One thing to note here is these are JavaScript popups\
    \ and not the native platform popups. There is a Cordova plugin called `cordova-plugin-dialogs`\
    \ (https://ionicframework.com/docs/v2/native/dialogs/), which you can use if native\
    \ dialog UI elements are required.\n\nCurrently there are five types of alerts\
    \ that we can show in the Ionic app, basic alert, prompt alert, confirmation alert,\
    \ radio, and checkbox alerts.\n\nA radio alert inside `src/pages/products/products.html`\
    \ is for sorting products:\n\n```html\n<ion-buttons>\n  <button ion-button full\
    \ clear (click)=\"sortBy()\">\n    <ion-icon name=\"menu\"></ion-icon>Sort\n \
    \ </button>\n</ion-buttons>\n\n// onClick we call sortBy method\n// src/pages/products/products.ts\n\
    import { NavController, PopoverController, ModalController, AlertController }\
    \ from 'ionic-angular';\n\nexport class ProductsPage {\n\n  constructor(\n   \
    \ public alertCtrl: AlertController\n  ) {}\n\n  sortBy() {\n    let alert = this.alertCtrl.create();\n\
    \    alert.setTitle('Sort Options');\n\n    alert.addInput({\n      type: 'radio',\n\
    \      label: 'Relevance',\n      value: 'relevance',\n      checked: true\n \
    \   });\n    alert.addInput({\n      type: 'radio',\n      label: 'Popularity',\n\
    \      value: 'popular'\n    });\n    alert.addInput({\n      type: 'radio',\n\
    \      label: 'Low to High',\n      value: 'lth'\n    });\n    alert.addInput({\n\
    \      type: 'radio',\n      label: 'High to Low',\n      value: 'htl'\n    });\n\
    \    alert.addInput({\n      type: 'radio',\n      label: 'Newest First',\n  \
    \    value: 'newest'\n    });\n\n    alert.addButton('Cancel');\n    alert.addButton({\n\
    \      text: 'OK',\n      handler: data => {\n        console.log(data);\n   \
    \     // Here we can call server APIs with sorted data\n        // using the data\
    \ which user applied.\n      }\n    });\n\n    alert.present().then(() => {\n\
    \      // Here we place any function that\n      // needs to be called as the\
    \ alert is opened.\n    });\n  }\n}\n```\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_118_0.png)\n\
    \nHere are the Cancel and OK buttons. We have used this here for sorting the products\
    \ according to relevance, price, or other sorting values.\n\nWe can prepare custom\
    \ alerts also, where we can mention multiple options. As in the preceding example,\
    \ we have five radio options; similarly we can even add a text input box for taking\
    \ some inputs and submit it. Other than this, while creating alerts remember that\
    \ there are alerts, input, and button options properties for all the alerts present\
    \ in the `AlertController` component (https://ionicframework.com/docs/v2/api/components/alert/AlertController/).\n\
    \nThe following are some alert options:\n\n- `title: // string`: Title of the\
