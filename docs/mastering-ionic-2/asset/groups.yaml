  - "[PAGE 268]\n\n# Proxy server for the Ionic app\n\nSetting up a proxy server will\
    \ take some time and it is only required if you want to run `ionic serve` and\
    \ `ionic run -l`. We will see how Ionic CLI provides an easily configurable proxy\
    \ server.\n\nProxy server here will act as an intermediary for all the requests\
    \ from client to server. It will take a client's request and issue a new request\
    \ to the server and then on response from the server it will forward the response\
    \ back to the client. Since the server is sending a new request to your destination,\
    \ there will be no origin and therefore, no CORS needed. It is important to note\
    \ that the browser adds in the origin header.\n\nFor setting up proxy server we\
    \ have to do the following mentioned changes:\n\n+   - Set up proxy in `ionic.config.json`\n\
    +   - Set up Angular constant\n+   - Use constant in Angular services\n\nLet's\
    \ start with setting up proxy settings in the `ionic.config.json` file. Proxy\
    \ settings contain two important things, `path` and `proxyUrl` inside the proxies\
    \ array. You can have multiple proxies inside that array:\n\n```\n{\n  \"name\"\
    : \"ionic2-auth\",\n  \"app_id\": \"\",\n  \"v2\": true,\n  \"proxies\": [\n \
    \   {\n      \"path\": \"/api\",\n      \"proxyUrl\": \"http://yourwebsite.com\
    \ /api\"\n    }\n  ]\n}\n```\n\nYou now have specified inside your `ionic.config.json`\
    \ that whenever you will access `http://localhost:8100/api` it will proxy that\
    \ request to `http://api.yourwebsite.com/api` on your behalf. So this will solve\
    \ the CORS issue. For setting up the APIs endpoints, we have created `constants`\
    \ file where we have declared a constant, `API_URL`:\n\n```\n// src/providers/constants.ts\n\
    // While deploying application we switch to real URL\nexport const API_URL: string\
    \ =\n  'http://localhost:8100/api';\n```\n\nWhen building the application, we\
    \ can replace it with a real `API_URL` that we mentioned as `proxyUrl`:\n\n```\n\
    // src/providers/data-service.ts\n\nimport { Injectable } from '@angular/core';\n\
    import { HttpClient } from './http-client';\nimport { Observable } from 'rxjs/Observable';\n\
    import 'rxjs/add/operator/map';\nimport { API_URL } from './constants';\n\nexport\
    \ class DataService {\n  constructor(public http: HttpClient, public storage:\
    \ Storage) {}\n\n  login(data): Observable<any> {\n    return this.http.post(API_URL\
    \ + '/login', data).map(res => res.json());\n  }\n}\n```"
