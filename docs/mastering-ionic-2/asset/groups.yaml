  - "[PAGE 185]\n\n# # Geolocation plugin\n\nThe Geolocation plugin leverages the\
    \ device's **Global Positioning System (GPS)** and fetches location information\
    \ such as latitude and longitude. There are other sources also from which this\
    \ plugin tries to get a device's location including Wi-Fi network and mobile network\
    \ IP address, although this will not have high accuracy. This plugin is officially\
    \ supported by Apache Cordova and it has a global accessible object `navigator.geolocation`,\
    \ which again needs a `deviceready` event available for using its features.\n\n\
    Let's get started by installing the plugin via:\n\n```\n```bash\n$ ionic cordova:plugin\
    \ add cordova-plugin-geolocation\n$ npm install @ionic-native/geolocation --save\n\
    ```\n```\n\nThere are mainly three methods available in this plugin:\n\n+   -\
    \ `getCurrentPosition`\n+   - `watchPosition`\n+   - `clearWatch`\n\n`getCurrentPosition`\
    \ returns the position of the current position:\n\n```\n```javascript\nlet options\
    \ = {\n  timeout :3000,\n  enableHighAccuracy: true,\n  maximumAge : 1000\n};\n\
    \nthis.gGeolocation.getCurrentPosition(options).then(( position) => {\n  // on\
    \ success\n  let coordinates = position.coords.latitude\n  +\",\"+position.coords.longitude\n\
    }).catch((err) => {\n  // on error\n  console.log(err.message);\n});\n```\n```\n\
    \nAs you can see from the preceding example, we have passed options to the `getCurrentPosition()`\
    \ function. Similar options are provided to the `watchPosition()` function. `watchPosition()`\
    \ watches the location changes and when the device retrieves a new location, callback\
    \ executes with the position object having the latest location data:\n\n```\n\
    ```javascript\nlet watchOptions = {\n  timeout : 3000,\n  enableHighAccuracy:\
    \ false // may cause errors if true\n};\nlet watch = this.Ggeolocation.watchPosition(watchOptions);\n\
    \nwatch.subscribe((position) => {\n  let lat = position.coords.latitude\n  let\
    \ long = position.coords.longitude\n});\n\n// Clearing the watch\nwatch.clearWatch()\n\
    ```\n```\n\n**Also, we can easily clear the watch method; this will stop watching\
    \ for changes in the device's**"
