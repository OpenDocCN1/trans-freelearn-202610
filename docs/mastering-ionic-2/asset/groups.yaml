  - "[PAGE 304]\n\n# Enabling providers\n\nWe need to enable auth provider from our\
    \ application authentication Sign-In Method tab. We have enabled e-mail based\
    \ login and Facebook login for our TasteBite app application. It's really easy\
    \ to sign up, log in and log out users with e-mail-based login. We can use custom\
    \ auth if we already have some authentication systems; if we want to have guest\
    \ login we can use anonymous user authentication. We will demonstrate how easily\
    \ we can integrate social logins also.\n\nAll social logins require a client ID\
    \ and client secret for the application created on social channels. All social\
    \ providers have different ways of creating an application and after creating\
    \ an application we can put the client ID and client secret inside our Firebase\
    \ app. We need to make sure that we have placed the Oauth redirect URL inside\
    \ the Facebook login product: https://tastebite-ec5c4.firebaseapp.com/__/auth/handler.\
    \ Before this you have to create an application on Facebook whose app_id and app_secret\
    \ we will add back to our Firebase Facebook provider settings. After this your\
    \ backend work is done and you just now have to call a function from the Ionic\
    \ application.\n\nWe will now generate AuthServiceProvider which we will use for\
