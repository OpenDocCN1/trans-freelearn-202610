  - '[PAGE 336]


    # Proximity-based screen lock using BLE


    This is something that I have been thinking of for a while to implement and is
    a real-life problem for me. It''s time to look into how practical it can be to
    use BLE stack with an Ionic application. While working in my office, I have to
    quite often had leave my seat for taking some urgent calls or to attend some meetings.
    Most of the time I forget to screen lock my laptop. So, I thought of building
    this proximity based screen lock application using BLE and Websockets.


    Let''s first look quickly look into how the application will work. Ionic based
    application listens to the iBeacon packets from the continuously broadcasting
    laptop. As, soon as I move from my seat with my mobile, at some point it will
    exit from the broadcasting region of my laptop. Immediately it will send a socket
    request over the network to the Node.js based application running on my Ubuntu
    laptop and call the screen lock command on my laptop. Similarly, as I come back
    in to within the broadcasting range it will send another socket request to unlock
    the laptop.


    The technology stacks that we will be using here are:


    +   - Node.js

    +   - Web Sockects

    +   - BLE

    +   - Ionic

    +   - Bash script


    We have to prepare our Node.js backend and bash script first, to get started with
    our application. Before this, make sure you have all the debian packages installed
    for working on BLE and Node.js.


    ```

    $ sudo apt-get install bluetooth bluez libbluetooth-dev libudev-dev

    ```


    Now we can init our project using the npm init command:'
