  md: "# Device plugin\n\nDevice plugin is really helpful in getting all the device\
    \ related hardware and software information. Device objects are available in global\
    \ scope, but only after the device is ready.\n\nIonic Native supports this plugin\
    \ with devices and it has six static members to access data:\n\n+   - `Device`:\
    \ Returns Object with Cordova, model, platform, UUID, and version, for example,\
    \ `Device.uuid`\n+   - `cordova`: Returns string with specific Cordova versions\n\
    +   - `Model`: Returns string with the device's model name\n+   - `platform`:\
    \ Returns string with the operating system name\n+   - `uuid`: Returns string\
    \ with the device's **Universally Unique Identifier** (**UUID**)\n+   - `version`:\
    \ Returns string with the operating system version\n+   - `isVirtual`: Checks\
    \ whether the device is running on a simulator or not\n+   - `serial`: Fetches\
    \ the hardware serial number\n+   - `manufacturer`: Fetches the device's manufacturer\n\
    \n```\nimport { Device } from '@ionic-native/device';\n\nconstructor(platform:\
    \ Platform, private device: Device)\n{\n  this.platform.ready().then(() => {\n\
    \    console.log(this.device.version);\n  });\n}\n```"
  merge: -1
