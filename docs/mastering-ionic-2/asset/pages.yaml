  md: "# User auth state\n\nThere are some auth-related APIs available with Firebase\
    \ that help us get the auth state and persist it. To list any changes in the auth\
    \ with regard to any change in password or session expiration, we have to listen\
    \ the subscribe function of the AngularFireAuth class when you initialize your\
    \ application:\n\n```\nconstructor(public auth$: AngularFireAuth) {\n  this.authState\
    \ = auth$.getAuth();\n  auth$.subscribe((state: FirebaseAuthState) => {\n    console.log(state);\n\
    \    this.authState = state;\n  });\n}\n```\n\nWe have placed this inside our\
    \ AuthServiceProvider; similarly if you want to stop listening to the changes\
    \ you can call the offAuth() function and you will not get any updates. Firebase\
    \ saves a session inside local storage till the user session is valid, although\
    \ if you need to get auth you can call the getAuth() function and get all the\
    \ session details. For low requests on the server we can use the localstorage\
    \ method to get all details from storage:\n\n```\nsignOut(): void {\n  this.auth$.logout();\n\
    }\n```\n\nUsers are currently always persisted until logout() is called (or the\
    \ user clears local storage). Finally, we need to have a function to log out the\
    \ session from Firebase; we can use unauth()."
  merge: -1
  img_proc: true
