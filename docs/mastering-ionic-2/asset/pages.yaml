- pgno: 138
  md: "# ItemSliding and pull-to-refresh\n\nAnimations and gestures in modern day\
    \ applications are a must and they enhance the user experience while using the\
    \ application features. You will find the `ItemSliding` feature in most iOS applications,\
    \ and pull-to-refresh is commonly used to fetch the latest data, and as in the\
    \ Facebook application, you will use this to fetch the latest feeds.\n\n`ItemSliding`\
    \ is a swipe-able list that can be swiped towards the left or right to reveal\
    \ action buttons. We will be using a swipe-able list on our wishlist page, where\
    \ we have products action to delete from the list or add to cart:\n\n```\n// src/pages/wishlist/wishlist.ts\n\
    <ion-content>\n  <ion-list>\n    <ion-list-header>\n      4 Items in your Wishlist\
    \ (Swipe for options).\n    </ion-list-header>\n\n    <ion-item-sliding *ngFor=\"\
    let product of products\">\n      <ion-item>\n        <ion-avatar item-left>\n\
    \          <img [src]=\"product.image\">\n        </ion-avatar>\n        <h2>{{product.name}}</h2>\n\
    \        <h3>{{product.price | currency}}</h3>\n        <p>{{product.rating}}\
    \ stars and 420 reviews</p>\n      </ion-item>\n      <ion-item-options side=\"\
    right\">\n        <button danger>\n          <ion-icon name=\"trash\"></ion-icon>\n\
    \          Remove\n        </button>\n        <button secondary>\n          <ion-icon\
    \ name=\"cart\"></ion-icon>\n          Add Cart\n        </button>\n      </ion-item-options>\n\
    \    </ion-item-sliding>\n  </ion-list>\n</ion-content>\n```\n\nLet's look at\
    \ some of the properties available on `itemSliding`:\n\n+   - Swipe direction\
    \ can be right or left; both reveal the action buttons. We can use `<ion-item-options\
    \ side=\"right\">` for right swipe options\n+   - IonDrag and `ionSwap` events\
    \ can be used to listen or call some function during swiping of the list item\n\
    +   - Icon placement can be on the top or towards the left of the button text,\
    \ such as `<ion-item-options icon-left>`\n+   - The `ItemSliding` class can also\
    \ be imported to access the `close()` method"
  merge: -1
  img_proc: true
