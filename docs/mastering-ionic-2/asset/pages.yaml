- pgno: 128
  md: "# Navigating from overlay components\n\nRecently, I faced a problem while navigating\
    \ from a popover to a page. Every time I click on the link inside popover and\
    \ directly push the next component, it freezes the application. We will be implementing\
    \ the popover component and inside that we will traverse to SettingsPage and SupportPage:\n\
    \n```\n// src/pages/popover/popover.ts\nimport { Component } from '@angular/core';\n\
    import { ViewController, NavController, App, ModalController } from 'ionic-angular';\n\
    \nimport { SupportPage } from '../support/support';\nimport { SettingsPage } from\
    \ '../settings/settings';\n\n@Component({\n  template: ` \n    <ion-list>\n  \
    \    <button ion-item\n      (click)=\"goToPage('SettingsPage')\">Settings</button>\n\
    \      <button ion-item\n      (click)=\"goToPage('SupportPage')\">Support</button>\n\
    \      <button ion-item\n      (click)=\"close('http://ionicframework.com/docs/v2/getting-started')\"\
    >Learn Ionic</button>\n    </ion-list>\n  `;\n})\nexport class PopoverPage {\n\
    \n  classes: any;\n\n  constructor(\n    public viewCtrl: ViewController,\n  \
    \  public navCtrl: NavController,\n    public app: App,\n    public modalCtrl:\
    \ ModalController\n  ) {\n\n    this.classes = {\n      'SettingsPage': SettingsPage,\n\
    \      'SupportPage': SupportPage\n    }\n\n  }\n\n  goToPage(page:any) {\n  \
    \  // Navigiting from Overlay Components\n    // https://ionicframework.com/docs/v2/api/navigation/NavController/\n\
    \    // If you simply push it will freeze the UI\n    this.viewCtrl.dismiss();\n\
    \    this.app.getRootNav().push(this.classes[page]);\n  }\n\n  close(url: string)\
    \ {\n    window.open(url, '_blank');\n    this.viewCtrl.dismiss();\n  }\n}\n```\n\
    \n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_128_0.png)"
