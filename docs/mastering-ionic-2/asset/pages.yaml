- pgno: 368
  md: "request also.\n\nNow that we have cache static resources, let's see how we\
    \ have used caching strategies for dynamic content, such as API calls. We have\
    \ two types of APIs used in our application on `HomePage` and `ListPage`, so accordingly\
    \ we want different strategies for caching them. Everytime if we fetch the entire\
    \ list we used `networkFirst` approach and for single currency rate we use `cacheFirst`\
    \ approach. As both requests have a different API path we have applied conditions\
    \ according to those paths. Also, we have set up different `cacheStorage` for\
    \ these requests named `fixerio`, which will have all requests from fixer.io as\
    \ its origin:\n\n```\nself.toolbox.router.get('/(.*)', function(request, values,\
    \ options) {\n  if (!request.url.match(\"symbols\")) {\n    console.log(\"===entire\
    \ currency list API===\");\n    return self.toolbox.networkFirst(request, values,\
    \ options);\n  } else {\n    console.log(\"===specific conversion between two\
    \ currencies===\");\n    return self.toolbox.cacheFirst(request, values, options);\n\
    \  }\n}, {\n  cache: {\n    name: 'fixerio',\n    maxEntries: 10,\n    maxAgeSeconds:\
    \ 3600\n  },\n  origin: /.fixer.io$/\n});\n\n// dynamically cache any other local\
    \ assets\nself.toolbox.router.any('/*', self.toolbox.cacheFirst, {\n  cache: {\n\
    \    maxAgeSeconds: 3600\n  }\n});\n\n// for any other requests go to the network,\
    \ cache,\n// and then only use that cached resource if your user goes offline\n\
    self.toolbox.router.default = self.toolbox.networkFirst;\n```\n\nAlso, we have\
    \ cached any other local assets as `cacheFirst` and for other than that any request\
    \ it will be `networkFirst`, which will go to network first and if offline then\
    \ will get from cache:"
  merge: -1
  img_proc: true
