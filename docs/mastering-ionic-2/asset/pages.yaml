- pgno: 142
  md: '# Virtual scroll and Infinite scroll


    Virtual scroll and infinite scroll are two important components that are again
    widely used across different applications to cater for the high number of items
    in lists. Virtual scroll is implementing a list of items that can be too long
    to render at once, for example contact lists with thousands of contacts. If we
    try to load the entire list and render that, it will hinder the performance of
    our application and you will find lag while scrolling down the list. Let''s look
    into how we can implement virtual scroll in our products page:


    ```

    // src/pages/products/products.html

    <ion-content class="products">

    <ion-list>

    <ion-item>

    <ion-note item-left>

    Duplicate products for VirtualScroll demo

    </ion-note>

    </ion-item>

    </ion-list>

    <ion-grid [virtualScroll]="products" approxItemHeight="40px">

    <ion-row *virtualItem="let product" (click)="goToProductDetail(product)">

    <ion-col width-33>

    // Important to use ion-img rather than img tag

    // this will lazy load the images as we scroll downwards

    // Also, image sizes should not vary after its loaded

    <ion-img class="v-img" [src]="product.image">

    </ion-img>

    </ion-col>

    <ion-col width-67>

    <p>{{ product.name }}</p>

    <ion-badge item-right>4.1</ion-badge> 340 ratings

    <p class="price"> {{ product.price | currency: ''INR'' }} </p>

    </ion-col>

    </ion-row>

    </ion-grid>

    </ion-content>

    ```


    Some important points to note while working with the virtual scroll component
    are that we should not do any DOM manipulations or changing of datasets after
    the list is loaded, as this will require the entire list to reset or refresh again,
    which is an expensive operation on memory. Approximate widths and heights of the
    items inside a list are necessary to specify for virtual scroll to work smoothly.
    The default is 40px'
  merge: -1
  img_proc: true
- pgno: 143
  md: "height, although it's not necessary to give the exact number, but it will be\
    \ better if it is close to the exact height.\n\nInfinite scroll or endless scrolling\
    \ is where the content of the page is appended dynamically after a user scrolls\
    \ a specified distance. In infinite scrolling, a function is called to asynchronously\
    \ fetch new data and append it to the list:\n\n```\n<ion-content>\n  <ion-list>\n\
    \    <ion-item *ngFor=\"let product of products\">\n      {{product.name}}</ion-item>\n\
    \  </ion-list>\n\n  <ion-infinite-scroll\n    (ionInfinite)=\"getNewProducts($event)\"\
    >\n    <ion-infinite-scroll-content></ion-infinite-scroll-content>\n  </ion-infinite-scroll>\n\
    </ion-content>\n```\n\nThe ionInfinite attribute is used to call the getNewProducts()\
    \ function, which will eventually fetch the new data:\n\n```\nexport class ProductsPage\
    \ {\n\n  constructor() {}\n\n  getNewProducts(infiniteScroll) {\n    // Call a\
    \ http function or service\n    // fetches new data and append to the products\
    \ array\n    list\n    // Make sure to call complete method to close the\n   \
    \ loader icon\n    infiniteScroll.complete();\n  }\n}\n```\n\nAs you can see,\
    \ both virtual and infinite scroll are almost the same with respect to the template\
    \ and its methods. You can find similar attributes in both components, where you\
    \ can declare loadingText and loadingSpinner. If required we can further customize\
    \ both virtual and infinite scroll design with custom SVG and CSS animations."
  merge: -1
  img_proc: true
