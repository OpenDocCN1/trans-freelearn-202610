  md: '# Slides


    The slides component is a multi-section container that can be used in multiple
    scenarios, such as a tutorial view or banner slider. The <ion-slides> component
    has multiple <ion-slide> elements, which can be dragged or swiped left/right.
    Slides have multiple configuration options available, which can be passed in the
    ion-slides such as autoplay, pager, direction: vertical/horizontal, initial slide,
    and speed.

    Using slides is really simple as we just have to include them inside our home.html;
    no dependency is required for this to be included in the home.ts file:


    ```

    // Banner Slider in src/pages/home/home.html


    <ion-slides pager #adSlider (ionSlideWillDidChange)="logLenthtrackEvent()" style="height:
    250px">

    <ion-slide *ngFor="let banner of banners">

    <img [src]="banner">

    </ion-slide>

    </ion-slides>


    // Defining banners image path


    export class HomePage {


    products: any;

    banners: String[];


    constructor() {

    this.banners = [

    ''assets/img/banner-1.webp'',

    ''assets/img/banner-2.webp'',

    ''assets/img/banner-3.webp''

    ]

    }

    }

    ```


    As you can see from the preceding code, there are multiple properties available
    for ion-slides, such as pager, autoplay, direction, and so on:


    ![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_104_0.png)


    If you look at the preceding screenshot, you can see we have used white background
    banners. Actually, just as a suggestion, try to use the same background color
    in banners that are inside the application. This way the banners will come up
    nice in low or high resolution mobiles and tabs:'
