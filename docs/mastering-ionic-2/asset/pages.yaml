  md: '# # Ionic push


    Ionic push allows you to send messages and alerts to a user''s device. Push notifications
    can be triggered even when application is closed. Push notifications have now
    been around for a long time and are commonly used in every application. Many of
    you probably already have good experience with integrating GCM and APNS in the
    past. So here our main interest is how we can use these services from the Ionic
    push service. Ionic push allows you to send notifications to both platforms from
    a single interface or API. With the Ionic push service we can send notifications
    to:


    +   - Target users

    +   - Schedule notifications

    +   - Send contextual content

    +   - Attach media to notifications

    +   - Automatically send notifications on custom logic

    +   - Trigger app events with background notifications


    Before we can send notifications from the Ionic push service we need to set up
    FCM Project and API keys. We can find the FCM server key and sender ID in the
    firebase console settings and cloud messaging tab:


    ![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_237_0.png)


    +   - The next step is to generate the keystore file, which we will be uploading
    with other details while creating the security profile for our application. While
    creating keystore it will first ask for the Keystore Password and after entering
    other details it will ask for the Key Password for alias. Just make sure you remember
    this as that will be needed while creating security profiles:


    ```

    keytool -genkey -v -keystore vplanet.keystore -alias vplanet-alias -keyalg RSA
    -keysize 2048 -validity 10000

    ```


    +   - Now we have everything ready to create a security profile. The FCM server
    Key from the Firebase console, attach the generated vplanet.keystore file, alias,
    and their respective passwords:'
