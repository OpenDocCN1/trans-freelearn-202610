  md: "```\n}, (error) => {\n    console.error(error);\n});\n```\n\nAll the read and\
    \ write operations return the RxJS observable. subscribe is a method on observable,\
    \ which takes three functions as parameters:\n\n+   - next(result): callback method\
    \ that receives collection data\n+   - error(error): callback method that receives\
    \ error data\n+   - complete(): callback executed when the result set is iterated\
    \ completely\n\nIf you want to stop receiving emissions you can call the unsubscribe()\
    \ method. We will be mostly using read methods from our mobile application to\
    \ retrieve data from the database. Although, we also have multiple write operations\
    \ that can also be used for user centric applications such as to-do applications.\n\
    \nLet's see some write operations also and how we can use it. Although, in our\
    \ vPlanet application we haven't used write operations, but let's demonstrate\
    \ how we can use some write operations for a to-do application:\n\n```\nconst\
    \ todoItems = this.db.collection(\"items\");\n\n// Insert a todo item document\n\
    \nlet dateTime = new Date().toLocaleString();\n\ntodoItems.insert({\n  id: \"\
    1\",\n  user: this.user.id,\n  text: \"Prepare project presentation\",\n  status:\
    \ \"pending\"\n  timestamp: dateTime\n});\n\n// Update todo item\n\nlet dateTime\
    \ = new Date().toLocaleString();\n\ntodoItems.update({\n  id: \"1\",\n  user:\
    \ this.user.id,\n  text: \"Prepare project presentation\",\n  status: \"completed\"\
    \n  timestamp: dateTime\n});\n```\n\nWe now have a good idea of how read and write\
    \ operations work with IonicDB. IonicDB is still in active development, so you\
    \ can expect some issues, but until now I have had a smooth journey developing\
    \ vPlanet applications."
