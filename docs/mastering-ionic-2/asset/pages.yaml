    \ {\n      return Promise.all(\n        cacheNames.map(function(cacheName) {\n\
    \          if (expectedCacheNames.indexOf(cacheName) === -1) {\n            console.log('Deleting\
    \ out of date cache:', cacheName);\n            return caches.delete(cacheName);\n\
    \          }\n        })\n      );\n    })\n  );\n});\n```\n```\n\nWe did some\
    \ of the work for subscribing to push notifications, now we have to add a EventListener,\
