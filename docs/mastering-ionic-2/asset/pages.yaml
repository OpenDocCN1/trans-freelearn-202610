    \    return response;\n    }\n\n    //if request is not cached, add it to cache\n\
    \    return fetch(request).then((response) => {\n        var responseToCache =\
    \ response.clone();\n        caches.open(cacheName).then((cache) => {\n      \
    \      cache.put(request, responseToCache).catch((err) => {\n                console.warn(request.url\
    \ + ': ' + err.message);\n            });\n        });\n\n        return response;\n\
    \    })\n});\n```\n\n> *After sw-toolbox support we use sw-toolbox router methods\
    \ for fetching the resources and caching them according to different strategies\
    \ available, which we will look at further in our demonstration.*\n\nService workers\
    \ can perform push events, to create user notifications, to open a specific page,\
    \ or to run some background script:\n\n```\nself.addEventListener('push', (event)\
    \ => {\nconsole.log('Received a push message', event);\n\nconst title = 'Yay a\
    \ message.';\nconst body = 'We have received a push notification.';\nconst icon\
    \ = 'assets/icon.png';\nconst tag = 'simple-push-demo-notification-tag';\n\nevent.waitUntil(\n\
    \    self.registration.showNotification(title, {\n        body: body,\n      \
    \  icon: icon,\n        tag: tag\n    })\n);\n});\n```\n\nRecently, Ionic added\
    \ support for sw-toolbox, which is a `service-worker` library and it reduces a\
    \ lot of work.\n\n# **Service worker toolbox (sw-toolbox)** is now built-in to\
    \ the starters and conference application. This allows you to customize your service\
    \ worker using a high-level API instead of using the raw service worker API. Our\
    \ out-of-the-box configuration will give your application a good, network independent\
    \ experience, but you can easily customize this to fit your application's unique\
    \ use cases.\n\nWe have gone through the various events of service workers and\
    \ how exactly they work. An important thing here is to use the Chrome developer\
    \ tools for debugging service works and look into the servicer worker status and\
    \ caches available. For further research on service workers and what all we can\
    \ do using them you can look into the following documentation links by Google\
    \ and Mozilla:\n\nhttps://developer.mozilla.org/en-US/docs/Web/API/Service_Worker_API/Using_Service_Workers\n\
    https://developers.google.com/web/fundamentals/getting-started/primers/service-workers."
