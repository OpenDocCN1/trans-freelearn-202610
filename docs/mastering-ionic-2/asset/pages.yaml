- pgno: 377
  md: '# Summary


    I would personally say that PWAs support for Ionic and discussing this topic in
    this last chapter is the best approach to wrap up our exciting journey. You have
    already understood now the power of a PWA, and which you can extend to your normal
    web applications also. Also, we can''t say here that PWA will replace native applications
    as there are low-level APIs that you only have while you are building your application
    with Cordova and using Cordova plugins.


    From recent blog posts from the Ionic team, it looks like we will be having desktop
    support with electron coming really soon. I would recommend every user or developer
    to the subscribe to Ionic blog, which is the best way to be up to date about what''s
    going on with Ionic. I have tried my very best to make sure that the content of
    every chapter is up to date, but you can see how actively the project is growing,
    so make sure that you put the effort in to also be up to date. The Ionic forum
    is another useful resource that has been helping me for the last three years in
    my journey to learn Ionic. Most of the time you will find that the problems you
    are facing have been already asked in the forums and instantly you have your answers.
    Also, you can ask questions anytime, but make sure that you have done your homework
    before that otherwise there can be chances that your question went unanswered.
    By homework I mean and search existing discussion in forums, check for issues
    in GitHub as many times it can be an issue that is already marked and you don''t
    want to waste your time. Most of the time we might have some issues that are related
    to Angular and are not specific to Ionic components, or APIs. So for that try
    searching on Google using the keyword Angular rather than Ionic as that will yield
    more appropriate results.'
