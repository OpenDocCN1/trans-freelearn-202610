- pgno: 50
  md: '# # Angular 4, Ionic 3, and TypeScript


    Many of us coming from the Angular 1 world to Angular 2 or 4 will surely see that
    it''s an entire rewrite of the application and a steep learning curve. I felt
    the same when I initially started Ionic and Angular, but gradually as I read about
    the concepts of Angular, many of the problems we used to face in Angular 1 were
    automatically solved without any effort. Initially you will miss the old controllers,
    services, filters, and other concepts in Angular 1 and most importantly the navigation
    and routing. But when you dive deep into the topics you will find that corresponding
    modules such as **component**, **providers**, and **pipe** are available and that
    they can be used in similar ways. Navigation and router are also now used as push
    and pop mechanisms for navigating from one page to another page. In the initial
    beta versions of Ionic 2, we don''t have proper URL-based routing as users can''t
    land on a specific page in the application. But after a stable Angular-router
    is released it has been added to Ionic 2, which has opened the path for better
    support for progressive web apps, which will allow the same Ionic apps to be shipped
    as mobile web applications. Ionic 3 also added support for responsive grids, which
    will help when we will be building desktop applications. Lazy Loading is another
    important feature added, which reduces the initial loading time of the application.
    Still, as Ionic 3 is in initial days, we can expect these features to become a
    lot more stable. As, we know Ionic 2 and 3 did not have any major framework changes,
    so initially we will be comparing Angular 1 and 2 in this chapter so it helps
    users understand the difference and how they can migrate to the latest Ionic versions.'
  merge: -1
  img_proc: true
- pgno: 51
  md: '```

    <strong>[(property-name)]="expression"</strong><br/><br/><strong> <input type="text"
    <br/> [(ngMmodel)]="model.name" /></strong>

    ```


    We still have two-way data binding. Although, to improve the Angular digest cycle
    and performance by default, we don''t use two-way data binding. It uses a unidirectional
    binding that we can extend to two-way binding when we require it. You can refer
    to Angular template syntax to demystify all other syntax''s and their uses available
    with Angular 4.


    **Ionic lack URL navigation** is another discussion going on at the Ionic forum.
    Again this is also partially correct; because Angular-router was not stable enough,
    the Ionic team decided to remove it in the initial beta version. As of now, Angular-router
    is stable and will be in Ionic. The Ionic team understands how critical it is
    to have a proper routing mechanism and to make a developer feel at home while
    moving towards Ionic 3.


    **Upgradation is entirely rewritten:** Angular 2 is itself rewritten, but you
    don''t have to rewrite your app also. Initially when I started I felt the same
    and thought that we had to redevelop our current application. But there are many
    tools and documentation (http://ionicframework.com/files/Ionic2Migration.pdf)
    available for a smooth upgrade from Ionic 1 to Ionic 2 or 3. You just have to
    be careful as if you have a complex application then you might have to do many
    things manually. But one thing is for sure that upgrading the application will
    surely not take that much time when you build the same application from scratch
    if you have proper expertise and a concept of Angular 2. One of the reasons behind
    this is that you already have a running application where you just have to assemble
    the moving parts in different ways, as most of the application logic will be same.


    Personally, my learning process with Ionic didn''t think too much about I upgrading
    to a new version. Rather I took it as new improved concepts that came in new Angular
    versions, designed to ease the learning and understanding.'
  merge: -1
  img_proc: true
