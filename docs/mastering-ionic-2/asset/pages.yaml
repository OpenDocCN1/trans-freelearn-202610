  md: '# Ionic View


    Ionic View makes it easy to share your application with your team members or your
    clients without using TestFlight in iOS or beta testing on Android. We can share
    our application with anyone easily with complicated beta provisioning. The initial
    step is to upload our application, which will ask for the login credentials of
    your Ionic account:


