- pgno: 326
  md: '# # Ionic + Node = deadly combination


    Node.js is solving many problems for hardware and IOT devices. There have been
    so many ways we can use Node.js to build the backend part which can talk with
    the Ionic app over HTTP APIs. One such example is where Ionic, Node.js, MQTT,
    and Wi-Fi module is used and we have a mobile app controlled relay through the
    Wi-Fi module over Internet. We are using the free online broker, MQTT for sending
    message from the Node.js server to the Wi-Fi module which are set up in Arduino
    IDE. On the other hand, we are using HTTP Rest APIs to call the Node.js server
    from the Ionic app. So, this way we will be able to send signals to Wi-Fi router
    and can perform specific actions.


    Users need some interface to interact with these IOT devices, which open the path
    for Ionic-based mobile applications. We will be implementing one such node module,
    bleno, for implementing BLE peripherals later in the chapter. Noble and bleno
    are two such modules used for BLE implementation. Noble scans the peripherals
    around its proximity and bleno transmits as a peripheral. Also, other than this
    there are multiple IOT modules available as NPM packages, which will get you started
    really quickly:


    +   - **CyclonJS**: mainly used for robotics and IOT

    +   - **NodeRED**: tool for wiring together multiple IOT hardware devices

    +   - **DeviceJS**: Javascript engine for IOT, Jquery for IOT

    +   - **noduino**: Node.js framework for controlling Arduino controls


    Websockets can be another messaging protocol just like MQT. We will be using websockets
    in this chapter in our demonstration. There are endless possibilities that we
    can work on. Arduino and Raspberry Pi are two famous boards used for building
    applications which can interact with other hardware devices. There are multiple
    examples you will find online to build during hackathons or for learning purposes
    where developers turn on an LED using Ionic application in real time. One such
    example is with Raspberry Pi GPIO pins and breadboard connected to it. Node.js
    code is residing on Raspberry Pi and an LED bulb connected on a breadboard. Another
    example we can think of is to connect with sensors such as temperature, GPS, and
    so on. You can find an interesting example of Ionic applications using an MQTT
    for fetching data from sensors in real time and visualizing in the application
    at https://github.com/arjunsk/Ionic-IOT-Monitor.


    The possibilities are endless and as the IOT industry is growing you will find
    more sensors and hardware devices coming up for solving many real-life problems.
    You can even think of controlling all your home devices and building a home automation
    project, similar to what Mark Zuckerberg did some months back with his Jarvis
    AI. Although he used AI for his project we can simply start with just controlling
    all our smart devices according to our needs. The best part as a developer here
    is that you would love it a lot even when you write only a small piece of code
    that can make your life easier.'
  merge: -1
