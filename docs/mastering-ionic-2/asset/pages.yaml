    let alert = this.alertCtrl.create({

    title: ''Update Available !'',

    message: ''Do you want to update the application now ?'',

    buttons: [

    {

    text: ''Later'',

    role: ''cancel'',

    handler: () => {

    console.log(''Cancel clicked'');

    }

    },

    {

    text: ''Update'',

    handler: () => {

    this.deploy.download().then(() => {

    ```

    ```'
