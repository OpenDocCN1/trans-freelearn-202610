  md: '# Ionic and IOT


    Developers have started to understand the potential of IOT, which is enormous.
    With so many different IOT devices in the market, there is also a need for applications
    to control these devices remotely. Now here comes Ionic to the rescue to help
    developers create apps quickly and inexpensively. Ionic is really efficient for
    building these apps and at the same time offers full native support to devices
    features for example, access to Bluetooth so sending signals to IOT devices. Already
    there are multiple devices that are connected over Bluetooth or HTTP APIs for
    data syncing and performing various actions. There are so many exciting projects
    currently going on and we will try to learn more about them. Let''s look into
    some of the reasons for using Ionic 2 for building your next IOT application:


    +   - With Ionic 2, we can have Web apps, Android, iOS and soon desktop application
    with a single code base. Specially, for a prototype purpose its really helpful

    +   - Ionic apps are built-in web technologies so they are really quick to get
    started

    +   - Ionic comes with multiple set of tools so you can efficiently bootstrap
    your application and deploy it easily'
