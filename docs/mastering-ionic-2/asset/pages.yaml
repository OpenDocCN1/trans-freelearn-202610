  md: '# Summary


    When it comes to securing your application, the most important thing is to properly
    secure your server-side APIs. So this way we will not lose any critical data and
    other''s data will not get shared publicly. Although, when we think about securing
    our code base, then nothing is 100% in native as well as hybrid mobile development.
    The goal should be to get as close to that number as possible though. Start by
    limiting your exposure and taking care that no sensitive data and logic should
    be on the client side. You should make sure you are doing your best to secure
    your hybrid mobile apps. However, if someone is dedicated enough, they can still
    work around it.

    We now have covered some important concepts of security inside and outside of
    your Ionic application. We will now move one step ahead with integrations of our
    Ionic app with Baas services such as Firebase and Ionic Cloud. In case you have
    very simple requirements for you Ionic application and don''t have much server
    logics you can quickly build an Ionic application with these services without
    setting up any server-side code base. We will be building a **TasteBite** application
    where we will be rating food items and restaurants combined, so that users can
    know what the famous dishes in their cities are and where they can find it cooked
    best.'
