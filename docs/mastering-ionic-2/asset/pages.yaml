  md: "# CRUD operations\n\nTo read or write data from the database, we need an instance\
    \ of database reference. Although we are using AngularFire so these functions\
    \ are wrapped and we use the function provided by AngularFire library. Sometimes,\
    \ we have to use low-level methods also like we will be doing later in the project.\
    \ Let's now first start querying the foodItems to show that on our HomePage:\n\
    \n```\n// src/pages/home/home.ts\nimport { Component } from '@angular/core';\n\
    import { IonicPage, NavController, NavParams } from 'ionic-angular';\nimport {\
    \ AngularFire, FirebaseListObservable } from 'angularfire2';\nimport { CityProvider\
    \ } from '../../providers/city/city'\n\n@IonicPage()\n@Component({\n  selector:\
    \ 'page-home',\n  templateUrl: 'home.html',\n})\nexport class HomePage {\n\n \
    \ foodItems: FirebaseListObservable<any[]>;\n  item;\n  constructor(\n    public\
    \ navCtrl: NavController,\n    public navParams: NavParams,\n    public cityService:\
    \ CityProvider,\n    public af:AngularFire) {\n```\n\nAs we will be querying data\
    \ by city, we are using cityService, which returns our current location's city\
    \ according to our geolocation. After this we will only get the data that is from\
    \ our city:\n\n```\nthis.cityService.getCityName().then(result => {\n    let cityName\
    \ = result[0]['address_components'][3].long_name;\n    this.foodItems = af.database.list('/foodItems',\
    \ {\n      query: {\n        orderByChild: 'city',\n        equalTo: cityName\n\
    \      }\n    });\n  })\n}\n\nratingPage(data:any) {\n  console.log(data);\n \
    \ // In FoodRatingPage we will be showing\n  // all the reviews and rating for\
