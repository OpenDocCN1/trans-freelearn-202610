    \ in the `AlertController` component ([https://ionicframework.com/docs/v2/api/components/alert/AlertController/](https://ionicframework.com/docs/v2/api/components/alert/AlertController/)).\n\
    \nThe following are some alert options:\n\n+   - `title: // string`: Title of\
    \ the alert\n+   - `subTitle: // string (optional)`: Sub-title of the popup\n\
    +   - `Message: // string`: Message for the alert\n+   - `cssClass: // string`:\
    \ Custom CSS class name\n+   - `inputs: // array`: Set of inputs for the alert\n\
    +   - `buttons // array (optional)`: Array of buttons"
