  md: "![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_371_0.png)\n\nWe have successfully\
    \ sent a web push notification now and, next step from here would to integrate\
    \ this push API to integrate to your backend. We can also send custom payload\
    \ in notifications, but for that we need to add encryption and make changes on\
