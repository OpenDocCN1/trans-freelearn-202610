  md: "# Facebook connect\n\nThe Facebook plugin is one of the most loved and widely\
    \ used plugins for social integrations. With Ionic Native and improved documentation,\
    \ now it's really easy to integrate the Facebook connect plugin inside your application.\
    \ The Facebook plugin allows you to use the same JavaScript code in your Cordova\
    \ application as you use in your web application. The best part about this plugin\
    \ is it uses the Native Facebook app to perform Single Sign On for the user. If\
    \ the Facebook Native app is not installed, then the sign on will degrade gracefully\
    \ using the standard dialog based authentication. This plugin just has support\
    \ for iOS and Android for now. Before installing this plugin you need to create\
    \ a Facebook app via developers.facebook.com and then copy the appId and appName,\
    \ which will be required while adding the plugin:\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_203_0.png)\n\
    \nWe are now ready to install the plugin for Facebook, which requires APP_ID and\
    \ APP_NAME:\n\n```\n$ ionic cordova:plugin add cordova-plugin-facebook4 --\nvariable\
    \ APP_ID=\"419376571536241\" --variable\nAPP_NAME=\"chatApp\"\n```\n\nOther than\
    \ this, there are a set of requirement checks that need to be done for specific\
    \ platforms. For Android you need to configure the project with your fb_app_id\
    \ in the res/values/facebookconnect.xml file:\n\n```\n<resources>\n    <string\
    \ name=\"fb_app_id\">419376571536241</string>\n    <string name=\"fb_app_name\"\
    >chatApp</string>\n</resources>\n```\n\nFor iOS, you have to change the following:\n\
    \n+   - Change FacebookAppID to project *-info.plist\n\n+   - Change the URL scheme\
    \ to fb<YOUR APPID>: for example, fb 419376571536241\n\nYou are now ready to use\
    \ Facebook plugin methods that the $cordovaFacebook module provides. The following\
    \ are some of the methods that we have with Ionic Native:\n\n+   - login(permissions):\
    \ A string of arrays, such as ['public_profile', 'email']\n\n+   - showDialog(options):\
    \ A JSON object with three keys; method, link, and caption\n\n+   - api(path,\
    \ permissions): A Facebook API path query, for example, api(\"me\", [\"public_profile\"\
    ])\n\n+   - getLoginStatus(): Checks if a user is logged in or not"
  merge: -1
  img_proc: true
- pgno: 204
