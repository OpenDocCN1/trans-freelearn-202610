- pgno: 151
  md: '# # Summary


    Ionic components and related resources are the backbone of any Ionic application.
    With intelligent use of components and available third-party components, we can
    get better performance and make our application user friendly. Choosing the right
    component for the right place is tricky, and the most interesting part is we have
    to think from the perspective of the end user and the end user''s experience with
    our application. We have to make sure that the user does not feel as if they are
    in a different world and away from the native experience, which usually happens.
    We can cover as many important components and important points as we want in this
    chapter, but what is suggested is to stay updated in the community and look for
    available resources that you can utilize easily for your application. Next, we
    will be moving towards the integration of plugins within our application. As almost
    every application uses one plugin or another, it''s very critical for production
    applications to integrate plugins correctly. Camera, GPS, filesystem, and network
    plugins are commonly used plugins. We will work on integrating these commonly
    used plugins and also some complex plugins that many developers have a problem
    with while integrating. The Ionic team have already launched an awesome project,
    Ionic Native, which eases the process of using Cordova plugins. Ionic Native is
    a wrapper library written over many of the plugins, so we can easily integrate
    it inside Angular-based Ionic applications.'
  merge: -1
  img_proc: true
