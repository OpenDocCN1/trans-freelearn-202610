  md: "# # Ionic rating\n\nIonic rating is a third-party module for visualizing the\
    \ rating bar. We will be using this module in our application in the product-detail\
    \ page. This module is available as an NPM module, so it will be really easy and\
    \ quick to integrate:\n\n```\n```bash\n$ npm install --save ionic2-rating\n```\n\
    \n```typescript\n// src/app/app.module.ts\n\nimport { Ionic2RatingModule } from\
    \ 'ionic2-rating';\n\nimports: [\n    IonicModule.forRoot(vPlanetApp),\n    Ionic2RatingModule,\n\
    \    TranslateModule.forRoot({\n        provide: TranslateLoader,\n        useFactory:\
    \ createTranslateLoader,\n        deps: [Http]\n    }),\n    CloudModule.forRoot(cloudSettings)\n\
    ],\n\n// src/pages/product-detail/product-detail.html\n<rating [(ngModel)]=\"\
    rate\" readOnly=\"false\" max=\"5\"></rating>\n```\n```\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_145_0.png)\n\
    \nThe Ionic community has evolved a lot in the last three years; there are multiple\
    \ third-party components available on GitHub, which you can smartly use inside\
    \ your application the same as we used the ionic-rating plugin for our e-commerce\
    \ application. Some of the components are:\n\n+   - Ionic rating ([https://github.com/andrucz/ionic2-rating](https://github.com/andrucz/ionic2-rating))\n\
    +   - Image cache and loader ([https://github.com/zyra/ionic-image-loader](https://github.com/zyra/ionic-image-loader))\n\
    +   - Mandatory install ([https://github.com/NextFaze/ionic-manup](https://github.com/NextFaze/ionic-manup))\n\
    +   - Geofencing ([https://github.com/tsubik/ionic2-geofence](https://github.com/tsubik/ionic2-geofence))\n\
