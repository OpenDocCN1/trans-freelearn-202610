- pgno: 234
  md: "# # Authentication and permissions\n\nIonic DB integrates existing auth services,\
    \ which is disabled by default, as in our vPlanet application we don't need authentication\
    \ to be enabled as most of the data should be publicly available. In case of to-do\
    \ applications we need to enable authentication in our IonicDB, which will require\
    \ users to log in using Ionic Auth before they can connect to the database. This\
    \ will allow users to access data only after they are authenticated. For enabling\
    \ authentication we need to update some settings in `app.module.ts`:\n\n```\n\
    ```typescript\n// src/app/app.component.ts\n\nconst cloudSettings: CloudSettings\
    \ = {\n  'core': {\n    'app_id': 'APP_ID'\n  },\n  'database': {\n    'authType':\
    \ 'authenticated'\n  }\n};\n```\n```\n\nAlso, another important point is to make\
    \ sure that you establish database connections only after the login method is\
    \ called or the user is already authenticated:\n\n```\n```typescript\nif(this.auth.isAuthenticated()){\n\
    \  // Connect DB aftere checking user authentication\n  this.db.connect();\n}\
    \ else {\n  // Need to login\n  this.auth.login('basic', details).then( () =>\
    \ {\n    // Now it is safe to connect\n    this.db.connect();\n  });\n}\n```\n\
    ```\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_234_0.png)\n\nPermissions allow\
    \ you to restrict access to the database collections. We can control what data\
    \ users can read and write. Permissions are based on white-listing, when it is\
    \ enabled from the dashboard we will not be able to access data by default. We\
    \ need to create permission for each collection and define them as default or\
    \ authenticated groups. Default group permissions are applied to all users, whether\
    \ they are authenticated or not. Authenticated group permissions are applied to\
    \ authenticated users only. Let's get back to our todo app demonstration, now\
    \ here we have another concern that only data that is"
  merge: -1
  img_proc: true
- pgno: 235
