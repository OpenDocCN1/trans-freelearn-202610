    electron and Ionic. Currently working on IOT projects with BLE Beacons. Gaurav
    have been researching on VOIP technologies, IOT and material design whenever he
    get time from his daily activities. Gaurav is also associated with Apache software
    foundation where he is contributor and committer to Apache Roller, Apache Fineract
    and Apache OFBiz projects. He was selected and invited as speaker at multiple
    conferences Mifos Techdays, ApacheCON, Mifos Summit and also into many local colleges/institutions.
