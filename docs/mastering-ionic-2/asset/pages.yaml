  md: "# # Ionic deeplinks\n\nThe Ionic deeplinks plugin handles the custom URL scheme\
    \ and universal app links for Android and iOS. We need to make sure that we don't\
    \ confuse this with the deeplinker API that handles registering and displaying\
    \ views based on URLs. We need to think that navigation is not controlled by URLs;\
    \ they are mainly used as breadcrumbs. This is mainly useful when we convert the\
    \ Ionic app to PWA, as web apps require URLs for SEO and direct navigation purposes.\n\
    \nWe will use both the deeplink plugin and deeplinked APIs for opening custom\
    \ URLs directly inside a Native application and web application, respectively.\
    \ Let's see first how to install the deeplink plugin:\n\n```\n```bash\n$ ionic\
    \ cordova plugin add ionic-plugin-deeplinks --variable URL_SCHEME=vplanet --variable\
    \ DEEPLINK_SCHEME=https --variable DEEPLINK_HOST=vplanetcommerce.com --variable\
    \ ANDROID_PATH_PREFIX=/\n\n$ npm install @ionic-native/deeplinks --save\n```\n\
    ```\n\nWe use both the deeplink plugin and deeplinked APIs inside our application\
    \ for opening custom URLs directly inside a native application and web application,\
    \ respectively. Let's see first how to install the Deeplink plugin:\n\n```\n```typescript\n\
    // src/app/app.component.ts\nimport { Deeplinks } from '@ionic-native/deeplinks';\n\
    constructor(private deeplinks: Deeplinks) { }\nthis.platform.ready().then(() =>\
    \ {\n  Splashscreen.hide();\n\n  // Convenience to route with a given nav\n  this.dDeeplinks.routeWithNavController(this.nav,\
    \ {\n    '/about-us': AboutPage,\n    '/categories': CategoriesPage,\n    '/wishlist':\
    \ WishlistPage,\n    '/cart': ShowcartPage,\n    '/login': LoginPage,\n    '/settings':\
    \ SettingsPage,\n    '/categories/:categoryId': ProductsPage,\n    '/products/:productId':\
    \ ProductDetailPage\n  }).subscribe((match) => {\n    // match.$route - the route\
    \ we matched\n    // match.$args - the args passed in the link\n    // match.$link\
    \ - the full link data\n    console.log('Successfully routed', match);\n  }, (nomatch)\
    \ => {\n    console.warn('Unmatched Route', nomatch);\n  });\n})\n```\n```\n\n\
    Let's look at how you can configure `DeeplinkConfig` for web applications. As\
    \ previously mentioned, these are just used as breadcrumbs, although the same\
    \ `NavController` instance `push` and `pop` operations are used to navigate inside\
    \ the application:\n\n```\n```typescript\n// src/app/app.module.ts\n\nimport {\
    \ IonicApp, IonicModule, IonicErrorHandler, DeepLinkConfig } from 'ionic-angular';\n\
    import { APP_BASE_HREF } from '@angular/common';\n\nimports: [\n  IonicModule.forRoot(vPlanetApp,\
    \ {locationStrategy: 'hash'}, deepLinkConfig),\n  Ionic2RatingModule,\n  TranslateModule.forRoot({\n\
    ```\n```"
