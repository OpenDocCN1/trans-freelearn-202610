    The check() method is used to check if an update is available. In case updates
    are available we present an alert dialog asking the user if they want to update
    the application now or later.


    The next step will be to deploy our snapshot with NOTE and CHANNEL_TAG. There
    are mainly three channels available for deploy, which are production, staging,
    and dev. We can create more channels if required and by default the deploy service
    will check for production snapshots. If we need to change this then we need to
    set the channel attribute as follows: this.deploy.channel = ''staging'';


    If an invalid channel is found, it will revert to the production channel. Also,
    make sure you update the channel attribute before you call the check() method:


    ![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_243_0.png)


    It is worth mentioning that whenever we package code then code is also uploaded
    to the server. But for deploy to work we need to pass the channel tag:


