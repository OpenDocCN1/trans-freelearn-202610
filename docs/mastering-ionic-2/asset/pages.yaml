  md: "![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_139_0.png)\n\nAs you can see, the\
    \ preceding screenshot shows how the `itemSliding` list will look. Pull to refresh\
    \ is another component that is mostly used when we need to refresh some existing\
    \ content and fetch new data from backend servers. The `refresher` module detects\
    \ the vertical swipe and display loader icon while calling the `refresh` function.\
    \ We don't have the exact use case for using it inside our application, but it's\
    \ really easy to implement the `refresher`:\n\n```\n```html\n<ion-content>\n \
    \   <ion-refresher (ionRefresh)=\"updateFeed($event)\">\n        <ion-refresher-content\n\
    \            pullingText=\"Updating Feed\"\n            refreshingSpinner=\"circles\"\
    \n            refreshingText=\"Updating...\">\n        </ion-refresher-content>\n\
    \    </ion-refresher>\n    <h4>User Feed</h4>\n</ion-content>\n```\n```\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_139_1.png)\n\
    \nThe `ion-refresher` component has the `ionRefresh` attribute, which is called\
    \ when the refresher is pulled vertically to some extent. After that, as you can\
    \ see inside the `ion-refresher-content`, there are multiple sets of attributes\
    \ that are actually acting as configuration settings for the refresher having\
    \ multiple options:\n\n```\n```typescript\nimport { Http } from '@angular/http';\n\
    \nexport class FeedPage {\n    constructor(public http: Http) {}\n\n    updateFeed(refresher)\
    \ {\n\n        // Calling a web service to fetch new feeds\n            result\n\
    \            this.http.get('path/to/data.json')\n                .map(res => res.json())\n\
    \                .subscribe(data => {\n                    // After the callback\
    \ we will\n                        complete the refresher\n```\n```"
