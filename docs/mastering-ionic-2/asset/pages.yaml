- pgno: 362
  md: "# # Service workers\n\nUsing service workers with Ionic 3 is really easy, Ionic\
    \ comes with the `service-worker.js` file, which is initially commented in the\
    \ `index.html` file. We just need to uncomment that section and you will see service\
    \ workers registered in your browser.\n\nService workers essentially act as proxy\
    \ servers that sit between web applications and between the browser and network\
    \ (when available). They are intended to (amongst other things) enable the creation\
    \ of effective offline experiences, intercepting network requests, and taking\
    \ appropriate action based on whether the network is available and updated assets\
    \ reside on the server. They will also allow access to push notifications and\
    \ background sync APIs.\n\nA service worker has life cycle and events for various\
    \ actions. We initially start by registering a service worker on our page, on\
    \ which successful registration life cycle initiate with install and activate\
    \ events. Ionic 3 comes with the built-in registration code in the `index.html`\
    \ file inside the `src` folder, all you need is to uncomment the code. Now you\
    \ can check that a service worker is enabled by going to [chrome://serviceworker-internals/](chrome://serviceworker-internals/)\
    \ by looking at your site:\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_362_0.png)\n\
    \nAs you can see, our locally served application at `localhost:8100` has a registered\
    \ service worker. Although, when we deploy PWAs, it must be served securely (HTTPS\
    \ without cert errors). Firebase hosting and GitHub pages host over HTTPS, so\
    \ they can be best place to host your the PWA application.\n\nNow that we are\
    \ done with the registration, it's time to install events to start its work. Inside\
    \ our install event we cache all our static files. The `event.waitUntil()` method\
    \ ensures that the service worker is not installed until the code inside it is\
    \ not executed. Now, `cache.addAll()` caches the static resources in cache storage:\n\
    \n```\n```javascript\nvar cacheName = 'cache-v1';\n// pre-cache our key assets\n\
    var files = [\n  './build/main.js',\n```\n```"
  merge: -1
  img_proc: true
