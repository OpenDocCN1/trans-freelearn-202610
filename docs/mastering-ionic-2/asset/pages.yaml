- pgno: 157
  md: '# What is Cordova?


    As mentioned about Cordova in the official line:


    > *Apache Cordova is a project maintained by the Apache organization. Cordova
    is a set of device APIs that allow a mobile app developer to access native device
    functions such as the camera or accelerometer from JavaScript. Combined with frameworks
    such as Ionic, this allows smartphone apps to be developed with just HTML, CSS,
    and JavaScript.*


    As we all might have used Cordova in our application and also know some common
    plugins that Cordova supports officially, I will lay down some of the common points
    that will help us understand Cordova:


    +   - Cordova is an application container

    +   - Cordova helps build Native applications for each platform

    +   - Cordova provides access to Native device APIs such as camera, contacts,
    GPS, and so on

    +   - Custom plugins can also be written and supported

    +   - Cordova is the engine behind Adobe phonegap

    +   - Cordova is open source and free to use


    As mentioned previously, Cordova officially supports multiple platforms and plugins.
    We can see that a lot of new plugins are coming, such as for fingerprints, hotspot,
    and so on, which we can utilize in building our advanced hybrid applications.
    The majority of the third-party plugins support iOS and Android platforms as these
    platforms have a major share in the device market. Recently, growing technology
    such as Bluetooth beacons are also supported by some third-party Cordova plugins.
    Later on in this book we will build an application and work with this technology.'
  merge: -1
  img_proc: true
