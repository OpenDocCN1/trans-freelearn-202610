  md: "# Media, streaming, and transfer plugin\n\nWe will be starting with a simple\
    \ music player application that will demonstrate the usage of different plugins,\
    \ but the possibilities here are endless. You might think of building a music\
    \ recommendation application that will play music according to your inputs, mood,\
    \ or other factors, although you will need a good backend application ready for\
    \ this to support recommendations.\nAs we have decided on the major functionality\
    \ that our application will have, we will now need mainly three Cordova plugins,\
    \ which we will install now:\n\n```\n$ ionic cordova:plugin add cordova-plugin-media\n\
    $ ionic cordova:plugin add cordova-plugin-file-transfer\n$ ionic cordova:plugin\
    \ add cordova-plugin-streaming-media\n```\n\nThe next step will be to install\
    \ their respective NPM packages and ionic-audio module, which we will use for\
    \ the audio player:\n\n```\n$ npm install @ionic-native/media @ionic-native/filetransfer\
    \ @ionic-native/streaming-media ionic-audio --save\n```\n\nLet's integrate the\
    \ ionic-audio module, this module automatically switches between WebAudioProvider\
    \ and CordovaMediaProvider according to the environment, which is really helpful\
    \ while testing the application, as we can easily verify the application inside\
    \ the browser itself:\n\n```\n// src/app/app.module.ts\nimport { IonicAudioModule,\
    \ AudioProvider, WebAudioProvider, audioProviderFactory } from 'ionic-audio';\n\
    import { NgModule, ErrorHandler, CUSTOM_ELEMENTS_SCHEMA } from '@angular/core';\n\
    import { IonicApp, IonicErrorHandler, IonicModule } from 'ionic-angular';\n\n\
    @NgModule({\n  imports: [\n    IonicModule.forRoot(MyApp),\n    IonicAudioModule.forRoot({\
    \ provide: AudioProvider,\n      useFactory: audioProviderFactory })\n  ],\n \
    \ schemas: [ CUSTOM_ELEMENTS_SCHEMA ]\n})\n```\n\nWe have three tab views, HomePage,\
    \ MusicPage, and VideoPage. Audio Player is integrated on the MusicPlayerPage.\
    \ We will inject AudioProvider for controlling the audio player and its functions:\n\
    \n```\n// app/pages/music-player/music-player\n\nimport { AudioProvider } from\
    \ 'ionic-audio';\n\nexport class MusicPlayerPage {\n\n  source: string;\n  img:\
    \ string;\n  singleTrack: any;\n  allTracks: any[];\n  selectedTrack: number;\n\
    \n  constructor(\n    public platform: Platform,\n    public navParams: NavParams,\n\
    \    public viewCtrl: ViewController,\n    private _audioProvider: AudioProvider)\
    \ {\n```"
  merge: -1
  img_proc: true
