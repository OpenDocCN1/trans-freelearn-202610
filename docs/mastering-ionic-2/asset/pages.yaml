- pgno: 277
  md: '# Enabling SSL


    This is one of the most important points if you are transferring secure data over
    networks to servers, before uploading your application to various stores you should
    make it production ready and enable SSL for all the secure requests. As most of
    the Ionic applications use REST APIs to get or post data to servers, we should
    make sure that all of our secure requests are HTTPS. At the same time, if your
    application doesn''t have any critical data then you can use HTTP also for this
    case.


    Using self-signed certificates for production applications is not recommended.
    If you want to introduce an SSL, make sure that your server has a certificate
    properly signed by a well-known certificate authority. The reason is that accepting
    self-signed certificates bypasses the certificate chain validation, which allows
    any server certificate to be considered valid by the device. This opens up the
    communication to man-in-the-middle attacks. The data will be encrypted, but man-in-middle
    can decrypt it by the key by middleman. You can look at it as a normal web application
    where you always make sure that all the secure information is sent in encrypted
    form to the server so that no one can hack it in the middle. To make sure of this
    it is very important that you buy an SSL certificate from a well-known certificate
    authority.'
  merge: -1
  img_proc: true
