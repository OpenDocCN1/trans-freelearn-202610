  md: '# Summary


    With the amount of services and tools that the Ionic team is working on you can
    see that Ionic as a community and product are both growing at a good pace. We
    have discussed all Ionic ecosystem services starting from Ionic Cloud services
    and then the tools available for quick prototyping. Combining all these services
    can be really helpful; auth and Ionic DB together gives you a lot more options
    for your application to do customizations.

    Ionic services such as IonicDB are a really interesting addition. There have been
    plans that new tools for testing will be launched by Ionic anytime in the future.
    The next big thing will be deployment of the same codebase as a desktop application
    using Electron bringing platform continuity.

    In Chapter 5, *Authentication, Authorization, and Security* we will be looking
    into some security aspects for our Ionic application. Starting from some common
    security practices to integrating authentication and authorization inside our
    application and how we can protect our private views for accessing by non-authenticated
    users. We will look at storing sensitive data and read and write data through
    the network securely so that nobody can intercept it. Also, we will see some basic
    security key points that we should consider before publishing your application
    to app stores.'
