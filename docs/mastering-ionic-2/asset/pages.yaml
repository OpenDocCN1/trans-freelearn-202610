  md: "# Tabs versus Segments\n\nTabs are the easiest way to switch between views\
    \ and organize content at a higher level. On the other hand, a segment is a group\
    \ of buttons and it can be treated as a local switch Tab inside a particular component\
    \ mainly used as a filter. With Tabs we can build, quick access bar in the footer\
    \ where we can place menu options such as home, favorites, and cart. This way\
    \ we can have one click access to these pages or components. On the other hand,\
    \ we can use segments inside the account component and divide the data displayed\
    \ in three segments, profile, orders, and wallet:\n\n```\n// src/pages/account/account.html\n\
    <ion-header>\n  <ion-navbar>\n    <button menuToggle>\n      <ion-icon name=\"\
    menu\"></ion-icon>\n    </button>\n    <ion-title>Account</ion-title>\n  </ion-navbar>\n\
    \  <ion-toolbar [color]=\"isAndroid ? 'primary' : 'light'\" no-border-top>\n \
    \   <ion-segment [(ngModel)]=\"account\" [color]=\"isAndroid ? 'light' : 'primary'\"\
    >\n      <ion-segment-button value=\"profile\">\n        Profile\n      </ion-segment-button>\n\
    \      <ion-segment-button value=\"orders\">\n        Orders\n      </ion-segment-button>\n\
    \      <ion-segment-button value=\"wallet\">\n        Wallet\n      </ion-segment-button>\n\
    \    </ion-segment>\n  </ion-toolbar>\n</ion-header>\n\n<ion-content class=\"\
    outer-content\">\n  <div [ngSwitch]=\"account\">\n\n    <div padding-top text-center\
    \ *ngSwitchCase=\"'profile'\">\n      <img src=\"http://www.gravatar.com/avatar?d=mm&s=140\"\
    >\n      <h2>{{username}}</h2>\n\n      <ion-list inset>\n        <button ion-item\
    \ (click)=\"updatePicture()\">Update Picture</button>\n        <button ion-item\
    \ (click)=\"changePassword()\">Change Password</button>\n        <button ion-item\
    \ (click)=\"logout()\">Logout</button>\n      </ion-list>\n\n    </div>\n\n  \
    \  <div padding-top text-center *ngSwitchCase=\"'orders'\">\n      // Order List\
    \ data to be shown here\n    </div>\n\n    <div padding-top text-center *ngSwitchCase=\"\
    'wallet'\">\n      // Wallet statement and transaction here.\n    </div>\n\n \
    \ </div>\n</ion-content>\n```"
