  md: '# Authentication and security using Firebase


    We will now look into Firebase user authentication and how we can secure our data.
    Firebase supports login and authentication internally and also provides support
    for integrating with social login providers. Most applications need some kind
    of login mechanism internally; with Firebase it''s super easy to set this up.
    Whenever we login using Firebase a session is created and a unique ID uid is returned
    by Firebase, which is distinct across all providers and never change for a specific
    authenticated user. This will also help us later in securing our data.


    Once the user is authenticated its session is managed and remembered even after
    the application is restarted. Firebase provides user authentication for multiple
    platforms:


    +   - **Custom** - for integrating with existing authentication systems

    +   - **E-mail** - register and authenticate users by e-mail and password.

    +   - **Anonymous** - for guest accounts without any personal information required

    +   - Facebook

    +   - Google

    +   - Twitter

    +   - GitHub'
  merge: -1
  img_proc: true
