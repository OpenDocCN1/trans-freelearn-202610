  md: '# Securing the Ionic application


    With authentication and authorization you have already secured all your data,
    but there are still some things that we need to make sure of security while building
    your enterprise grade Ionic application. Many things here we will be working around
    Cordova to secure our application. As security is a deep and complicated topic,
    the most important thing is to stay updated and try using the latest versions
    of Cordova and Ionic. Usually, if there are some security vulnerabilities found
    in Cordova you will soon see a patch for that and it will get fixed.'
