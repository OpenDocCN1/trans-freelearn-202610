- pgno: 148
  md: "# Lazy Loading with Ionic 3\n\nLazy Loading is much-awaited feature which recently\
    \ released with Ionic 3. Lazy Loading will improve our applications startup time,\
    \ reduce the bundle size and removes the hassle of including same component path\
    \ in every Class which eases the process of setting up Ionic routing. Let’s look\
    \ into what changes are required and how your application will improve. Also,\
    \ in Chapter 5, Authentication, Authorization, and Security the application demonstration\
    \ will have lazy Loading implemented inside it.\n\nCurrently, lazy Loading component\
    \ have some known bugs which Ionic team is actively working upon. Also, setting\
    \ this will override DeepLinkConfig defined in IonicModule.forRoot. We will be\
    \ introducing IonicPageModule in each component and new module.ts file in each\
    \ page component. Make sure you actively follow Ionic blog and any new releases\
    \ which can come up with further bugs fixes and new features.\n\nPreviously, we\
    \ import all the pages in one go inside our app.module.ts and now we just load\
    \ our app.component.ts initially. So, all these components like HomePage will\
    \ be removed from declarations and entry components. Next inside our src/pages/home\
    \ directory we have introduced another file home.module.ts similar to what we\
    \ have app.module.ts.\nNow if you will generate a page using Ionic CLI you will\
    \ find four files created:\n\n```\nhome.html\n\nhome.module.ts\n\nhome.scss\n\n\
    home.ts\n\n// src/pages/home/home.ts\n\nimport { Component } from '@angular/core';\n\
    \nimport { IonicPage, NavController } from 'ionic-angular';\n\n@IonicPage()\n\n\
    @Component({\n    selector: 'page-home',\n    templateUrl: 'home.html',\n})\n\n\
    export class HomePage {\n    constructor(public navCtrl: NavController)\n    moveTo(data:any)\
    \ {\n        this.navCtrl.push(\"ContactPage\", data);\n    }\n}\n```\n\nAlso,\
    \ now if we want to Push or Pop to any other Component we don’t require to import\
    \ it. We can directly handle that as string, during build process deeplinks will\
    \ be generated that know how to handle that string. The string is actually a reference\
    \ to the name property of the @IonicPage decorator, which defaults to the class"
  merge: -1
  img_proc: true
