- pgno: 318
  md: "```\n\"rules\": {\n  \"users\": {\n    \"$user_id\": {\n      \".read\": \"\
    $user_id === auth.uid\",\n      \".write\": \"$user_id === auth.uid\"\n    }\n\
    \  }\n}\n```\n\nWe have created a users model to store these details. We have\
    \ nested the data inside a $user_id key so that we can create an access control\
    \ and only user who created this data set can edit and access it. Similarly for\
    \ a \"feeds\" users can only read the feeds and can't write a feed on it:\n\n\
    ```\n\"feeds\": {\n  \".read\": true,\n  \".write\": false\n}\n```\n\nThere are\
    \ ways inside Firebase that help increase performance while querying data. For\
    \ example if we have score of students inside a model and we need to query that\
    \ data by score then we can use .indexOn inside the rule so that performance while\
    \ fetching records increases. You can study more about securing data inside Firebase\
    \ here: https://firebase.google.com/docs/database/security/."
