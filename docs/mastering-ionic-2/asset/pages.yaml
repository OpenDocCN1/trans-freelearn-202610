  md: "```\n```javascript\nlocalStorage.setItem('anonKey', subKey);\n});\n})\n.catch(err\
    \ => console.log('Error', err));\n}\n</script>\n```\n```\n\nYou can see here that\
    \ after successful registration we subscribe push notification from pushManager.\
    \ This will generate the subscription endpoint, which is responsible for sending\
    \ notifications to all the users. The next step is to set up our `manifest.json`\
    \ file:\n\n```\n```json\n{\n  \"name\": \"Currency Converter PWA\",\n  \"short_name\"\
    : \"Currency\",\n  \"start_url\": \"index.html\",\n  \"display\": \"standalone\"\
    ,\n  \"icons\": [{\n    \"src\": \"assets/logo.png\",\n    \"sizes\": \"512x512\"\
    ,\n    \"type\": \"image/png\"\n  }],\n  \"background_color\": \"#db0000\",\n\
    \  \"theme_color\": \"#000000\",\n  \"gcm_sender_id\": \"124917710568\"\n}\n```\n\
    ```\n\nWe have discussed all the properties in the last section, here we will\
    \ add our `gcm_sender_id` for user notifications. You will get the `gcm_sender_id`\
    \ from **Firebase settings** in cloud messaging. From there copy the server key\
    \ as later on it will be required to send a web push notification.\n\nService\
    \ workers are the most important for progressive web applications. Here is our\
    \ default `service-worker.js`, we made some further changes according to our requirements.\
    \ Ionic, by default, does not use the `sw-toolbox` library, which has reduced\
    \ the code and efforts a lot:\n\n```\n```javascript\n// src/service-worker.js\n\
    \n'use strict';\nimportScripts('./build/sw-toolbox.js');\n\nvar version = 1;\n\
    \nself.toolbox.options.debug = true;\n\nself.toolbox.options.cache = {\n  name:\
    \ 'ionic-cache' + version\n};\n\n// pre-cache our key assets\nself.toolbox.precache(\n\
    \  [\n  './build/main.js',\n  './build/main.css',\n  './build/polyfills.js',\n\
    \  'index.html',\n  'manifest.json',\n  '/'\n  ]\n);\n```\n```\n\nWe start with\
    \ setting up the cache name, which we name with the version number specified.\
    \ So whenever there is some new change we change the version and a new `cacheStorage`\
    \ is generated. Next we cache all our static resources here using the `precache()`\
    \ method and pass all static files paths. You will see that we have added another\
    \ resource, which is not in the default file, as our application serve on browser\
    \ at `localhost:8100` which in case went offline after first time will not cache\
    \ it and you will see an error. If you don't want to add this just refresh the\
    \ page twice as that will cache this"
