  md: "# # AppRate\n\nThe AppRate plugin is used to prompt a user to rate an app now,\
    \ later, or never. Every application needs this plugin to get reviews and ratings\
    \ from customers:\n\n```\n```bash\n$ ionic cordova:plugin add cordova-plugin-apprate\n\
    $ npm install @ionic-native/app-rate --save\n```\n```\n\nAppRate is really easy\
    \ to integrate as all the logic for showing the prompt and other settings are\
    \ managed by the plugin. We just need to set the preferences accordingly:\n\n\
    ```\n```typescript\n// src/app/app.component.ts\n\nimport { AppRate } from '@ionic-native/app-rate';\n\
    \nplatformReady() {\n  // Call any initial plugins when ready\n  this.platform.ready().then(()\
    \ => {\n    Splashscreen.hide();\n\n    if (this.platform.is('cordova')) {\n \
    \     // App rate plugin\n      AppRate.preferences.customLocale = {\n       \
    \ title: \"Rate vPlanet Commerce\",\n        message: \"Would you mind taking\
    \ a moment to rate it? It won't take more than a minute. Thanks for your support!\"\
    ,\n        cancelButtonLabel: \"No, Thanks\",\n        laterButtonLabel: \"Remind\
    \ Me Later\",\n        rateButtonLabel: \"Rate It Now\"\n      };\n      AppRate.preferences.storeAppURL\
    \ = {\n        android: 'market://details?id=com.vPlanetcommerce.demoionicpwa'\n\
    \      };\n      AppRate.promptForRating(false);\n\n      // Initiate Push\n \
    \     this.initPushNotification();\n    }\n  });\n}\n```\n```\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_194_0.png)\n\
    \nIf we set `promptForRating()` to false then it will not prompt immediately.\
    \ It will use the `usesUntilPrompt` preference, which counts the runs of an application\
    \ before the dialog will be displayed. You can refer to"
  merge: -1
