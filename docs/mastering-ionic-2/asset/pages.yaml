  md: '# # Ionic creator and playground


    There are another two tools that the Ionic creator and playground which Ionic
    platform provides. Ionic creator can be a good tool for prototyping and preparing
    UI mockups so that we can visualize quickly how the application will look like.
    Currently, under the free plan we can only drag and drop components, create pages/views,
    preview, share, and download code. Although, the Ionic team has launched many
    pro features that are available in paid plans such as code editing, theming, and
    packaging the creator application.


    Here we have tried to make a mockup for a currency convertor application using
    Ionic creator:


    ![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_254_0.png)


    We have added three tabs from the components sections. With a simple drag and
    drop UI we can easily add items. On the right-hand side you will see specific
    page or component properties, which are selected from the left-hand side. For
    example, if we click on List Page on the left-hand side, then it will show properties
    for a page such as Title, Routing URL, Background color, and Left/Right header
    buttons. Similarly, for each component we have different properties. There are
    some components and properties that are only available in the pro version:


    ![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_254_1.png)


    Let''s see how the application will look like once we preview it. There are four
    device options available for preview, iPhone, iPad, Android phone, and Android
    tablet:'
  merge: -1
