  md: '# # Ionic supports PWA


    The Ionic team are great fans of the progressive web application, which offers
    an application-like experience using modern web APIs. Since Ionic 3 is built with
    web technologies that work perfectly in web browsers, this gives you a huge advantage
    when building your PWA with Ionic, because if you know how to build an Ionic 3
    application, then you can easily build a PWA in a short period of time, you just
    have to add service workers and a web manifest file. We will be building an offline
