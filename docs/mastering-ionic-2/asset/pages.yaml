- pgno: 134
  md: "# Internationalization and localization\n\nWhen we have to build a global application\
    \ that touches the lives of people from different corners of the world, then we\
    \ have to think about many aspects such as internationalization and localization.\
    \ We will be integrating this inside our e-commerce app so that we can add multiple\
    \ language support.\n\nWe will start by installing the `ng2-translate` npm module:\n\
    \n```\nnpm install ng2-translate --save\n```\n\nNext, we will import the modules\
    \ and methods used inside `app.module.ts`:\n\n```\n// /src/app/app.module.ts\n\
    import { TranslateModule, TranslateLoader, TranslateStaticLoader } from 'ng2-translate/ng2-translate';\n\
    \nexport function createTranslateLoader(http: Http) {\n  return new TranslateStaticLoader(http,\
    \ './assets/i18n', '.json');\n}\n\n@NgModule({\n  imports: [\n    IonicModule.forRoot(vPlanetApp),\n\
    \    TranslateModule.forRoot({\n      provide: TranslateLoader,\n      useFactory:\
    \ createTranslateLoader,\n      deps: [Http]\n    }),\n    CloudModule.forRoot(cloudSettings)\n\
    \  ]\n})\n\nexport class AppModule {}\n```\n\nWe have created a separate function,\
    \ `createTranslateLoader`, in which we define the `i18n/` folder containing JSON\
    \ files for each locale. We are now ready to use the module and we now initiate\
    \ `TranslateService` inside the `app.component.ts` to which locale to use:\n\n\
    ```\nimport {TranslateService} from 'ng2-translate/ng2-translate';\n\n@Component({\n\
    \  templateUrl: 'app.template.html',\n  providers: [TranslateService]\n})\n\n\
    export class vPlanetApp {\n\n  constructor(\n    public translate: TranslateService\n\
    \  ) {\n\n    this.initializeTranslateServiceConfig();\n\n  }\n\n  // We are using\
    \ the user default language\n  // and set that default locale\n\n  initializeTranslateServiceConfig()\
    \ {\n    var userLang = navigator.language.split('-')[0];\n    userLang = /(en|es)/gi.test(userLang)\
    \ ? userLang :\n    'en';\n    this.translate.setDefaultLang('en');\n    this.translate.use(userLang);\n\
    \  }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 135
