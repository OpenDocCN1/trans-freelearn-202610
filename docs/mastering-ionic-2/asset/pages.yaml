  md: '# CRUD and securing data with AngularFire2


    We now have covered auth-related code and set up the building block for our TasteBite
    application. Next, we will look into Firebase Realtime Database, which is a NoSQL
    cloud database. Data is stored as JSON and synchronized in real time using web-sockets.
    The Firebase database persists to the disk, which gives our application offline
    support also. We will be using here two objects, foodItems and rateItems, where
    foodItems will have details about the food dish and rateItems is a nested object
    that contains ratings and reviews for each dish + city combination:


    ![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_309_0.png)


    As you can see how we have organized the foodItem data with respect to userid
    so we can differentiate user-related data. We can traverse to the personalFavourite
    and then to user data clicks on the dashboard. We can access any of the child
    nodes in the data. We can visualize the data in the dashboard; also Firebase team
    has created a Chrome plugin called Vulcan, which we can use to see the data tree.


    As, data stored inside Firebase is all objects and does not provide any native
    support for arrays. However, to ease development Firebase provides methods in
    its SDK that push data to an array. Firebase stores the data with sequential keys:
    // push send this [''a'', ''b'', ''c'', ''d'', ''e'']


    ```

    // Firebase databases store this

    {0: ''a'', 1: ''b'', 2: ''c'', 3: ''d'', 4: ''e''}

    ```


    There are restrictions with the use of array type storage on Firebase. Also, with
    Firebase you can have depth of child node till 32 level and the key length can
    be 768 bytes. We will not go into deep about Firebase basis as we can easily get
    that on its official documentation.'
  merge: -1
  img_proc: true
