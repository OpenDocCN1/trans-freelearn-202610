  md: "Now, let's see how we can create an entry in Firebase. Say we have to give\
    \ a **review** and **rating** to `foodItem`, we do that on our `rateFoodPage`.\
    \ Here again we use the same $key to store a new review in the database.\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_313_0.png)\n\
    \n```\n// src/pages/rate-food/rate-food\n\nimport { Component } from '@angular/core';\n\
    import { IonicPage, NavController, NavParams } from 'ionic-angular';\n\nimport\
    \ { AngularFire, FirebaseListObservable } from 'angularfire2';\nimport * as firebase\
    \ from 'firebase';\n\n@IonicPage()\n@Component({\n  selector: 'page-rate-food',\n\
    \  templateUrl: 'rate-food.html',\n})\nexport class RateFoodPage {\n\n  rateItems:\
    \ FirebaseListObservable<any[]>;\n  data: {name?: string, review?: string, rating?:\
    \ any} = {};\n  constructor(\n    public navCtrl: NavController,\n    public navParams:\
    \ NavParams,\n    public af: AngularFire) {\n\n    this.rateItems = af.database.list('/rateItems');\n\
    \    console.log(this.navParams.data);\n    this.data.name = this.navParams.data.name;\n\
    \  }\n\n  rate() {\n    let data = {\n      \"rating\": this.data.rating,\n  \
    \    \"review\": this.data.review\n    }\n    let url = \"rateItems/\" + this.navParams.data.$key\
    \ +\n      \"/\" +\n      this.makeid();\n    firebase.database().ref().child(url).set(data);\n\
    \    this.navCtrl.pop();\n  }\n\n  makeid() {\n    var text = \"\";\n    var possible\
    \ =\n      \"ABCDEFGHIJKLMNOPQRSTUVWXYZabcde\n      fghijklmnopqrstuvwxyz0123456789\"\
    ;\n\n    for( var i=0; i < 8; i++ )\n      text += possible.charAt(Math.floor(Math.random()\
    \ *\n        possible.length));\n\n    return text;\n  }\n}\n```"
