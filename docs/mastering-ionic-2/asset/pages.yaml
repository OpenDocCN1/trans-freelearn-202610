  md: "# # Conventions\n\nIn this book, you will find a number of text styles that\
    \ distinguish between different kinds of information. Here are some examples of\
    \ these styles and an explanation of their meaning.\n\nCode words in text, database\
    \ table names, folder names, filenames, file extensions, pathnames, dummy URLs,\
    \ user input, and Twitter handles are shown as follows: \"For setting up the APIs\
    \ endpoints we have created constants file where we declared constant `API_URL`\"\
    \n\nA block of code is set as follows:\n\n```\n```json\n{\n  \"name\": \"ionic2-auth\"\
    ,\n  \"app_id\": \"\",\n  \"v2\": true,\n  \"proxies\": [\n    {\n      \"path\"\
    : \"/api\",\n      \"proxyUrl\": \"http://yourwebsite.com /api\"\n    }\n  ]\n\
    }\n```\n```\n\nWhen we wish to draw your attention to a particular part of a code\
    \ block, the relevant lines or items are set in bold:\n\n```\n```typescript\n\
    // src/providers/constants.ts\n// While deploying application we switch to real\
    \ URL\n\nexport const API_URL: string = 'http://localhost:8100/api';\n```\n```\n\
    \nAny command-line input or output is written as follows:\n\n```\n```shell\n$\
    \ chromium-browser --disable-web-security\n```\n```\n\n**New terms and important\
    \ words** are shown in bold. Words that you see on the screen, for example, in\
    \ menus or dialog boxes, appear in the text like this: \"Cancel and OK buttons.\
    \ We have used this here for sorting the products according to relevance price\
    \ or other sorting values.\"\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_32_0.png)\n\
    \n*Warnings or important notes appear in a box like this.*\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_32_1.png)\n\
    \n*Tips and tricks appear like this.*"
