- pgno: 283
  md: '# General security points


    Most mobile operating systems provide hardware level encryption. This gives the
    devices extra protection when the device is locked. So we have to make sure that
    we always use the latest sdks and Ionic 2 only supports Android 4.4 and higher
    versions. Other than this there are some secure storage plugins for iOS and Android,
    which use keychain in case of iOS and for Android AES encryption. Another plugin
    is PrivacyScreenPlugin, which can be used for hiding sensitive information to
    be shown in app switchers in case of Android and iOS. Users will see splash screen
    in task switcher and if it is not detected it will show a black screen.


    Reverse engineering is another concern of many developers who think that their
    application code can easily be extracted and repackaged in the application with
    some malicious code and uploaded back onto the Play Store. Although this same
    practice can be done in the case of Native applications, we can bypass this security
    concern in case of Ionic applications by downloading JavaScript at runtime and
    deleting it when the app closes. Although we need to think if we really require
    this as this will come with performance issues also. On the other hand, it''s
    very difficult to do this in Java or objective-C and store your code base dynamically.


    Obfuscation, minification, and compression are some of the ways you can secure
    your code within our Ionic application. We can use many open-source tools to minify
    and uglify your source before you package them to various app stores. Some popular
    tools are YUI compressor and UglifyJS, which can be used to uglify your JavaScript
    resources. Also, you should always minify all your JavaScript and CSS resources,
    which will improve the performance of your Ionic application and lower your APK
    file size. Some enterprise tools are also available such as Jscrambler, which
    does all kinds of minification and obfuscation using its proprietary solutions.


    The following are some quick points that you can look into before you release
    your application for security context:


    +   - Any sensitive business logic should be executed on the server

    +   - Obfuscation and minification your JavaScript assets with uglify or use Jscrambler

    +   - Do not use Android OS less than 4.0

    +   - Use InAppBrowser for external links

    +   - Validate user inputs for HTML forms

    +   - Don''t cache sensitive data

    +   - Don''t use eval() unless you know what you are doing

    +   - Don''t assume your source code is always secure

    +   - Try to use keychain plugin for iOS


    It''s important to note that security is a critical topic and one should always
    be updated with new improvements in Cordova so we can improve our application
    in our next app release to app stores. Also, make sure that you don''t lose any
    performance.'
  merge: -1
  img_proc: true
