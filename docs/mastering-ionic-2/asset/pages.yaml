  md: "# # Installing Ionic Cloud\n\nSetting up Ionic Cloud is really simple; we need\
    \ to install the Ionic Cloud npm package and hook Ionic account, which is just\
    \ required for using Ionic services. We will be integrating cloud services to\
    \ our existing vPlanet-commerce application. Recently, Ionic CLI v3 has launched\
    \ and is currently in beta and it have changed a lot many things and changed the\
    \ commands:\n\n```\n```bash\n$ npm install @ionic/cloud-angular --save       \
    \ $ ionic login\n$ ionic link\n```\n```\n\n> > Be sure not to confuse Ionic CLI\
    \ v3 and Ionic v3, which are completely different. Ionic CLI contains primary\
    \ tools for the development of Ionic apps.\n\n**To update an Ionic 2 or 3 based\
    \ project to work with Ionic CLI v3, we have to run the following command.**\n\
    \n```\n```bash\n$ npm install --save-dev @ionic/cli-build-ionic-angular@beta @ionic/cli-plugin-cordova@beta\n\
    ```\n```\n\n**Now, when you will link the project to an existing project or create\
    \ a new project, make sure you have logged in to Ionic Cloud which will ask for\
    \ the username and password of the Ionic account, which you might have already\
    \ created at** `ionic.io`. **After this you can upload your snapshot to Ionic\
    \ Cloud.**\n\n![](img/c54e3488d7687ea0d26e8c2ce3cdfae3_221_0.png)\n\n**The next\
    \ step is to** import `cloudSettings` **inside our** `app.module.ts`**:**\n\n\
    ```\n```typescript\n// src/app/app.module.ts\n\nimport { CloudSettings, CloudModule\
    \ } from '@ionic/cloud-angular';\n\nconst cloudSettings: CloudSettings = {\n \
    \ 'core': {\n    'app_id': 'f8fec798'\n  }\n};\n\n@NgModule({\n  declarations:\
    \ [ ... ],\n  imports: [\n    IonicModule.forRoot(vPlanetApp),\n    Ionic2RatingModule,\n\
    \    TranslateModule.forRoot({\n      provide: TranslateLoader,\n```\n```"
