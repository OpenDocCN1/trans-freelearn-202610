  md: '# Ionic Native


    Developers working on hybrid applications have been using ngCordova with Ionic
    1 for some time. Now with Ionic 3, which is built with ES6 and TypeScript, we
    need to have a wrapper library for ES6 or TypeScript, which is exactly what Ionic
    Native is. It''s a collection of ES5/ES6/TypeScript wrappers built on top of Cordova
    APIs, which makes it convenient to integrate into Ionic applications. The Ionic
    team started this project as a feature request from a community member. It started
    as an experiment and it gained a lot of support due to the fact that integrated
    plugins were always a pain when it comes to lack of documentation and confusing
    APIs. These Angularjs wrappers simplified the process of integration and fit with
    the Angular syntax also. Now there are around 120+ Cordova plugins supported in
    Ionic Native and still counting.'
  merge: -1
  img_proc: true
