  md: '# Testing plugins in browsers


    One of the biggest issues currently with Cordova plugins is we can''t test our
    app inside browsers. Ionic team have been concentrating on improving Ionic tools
    so that we can simulate most of our application’s functionality directly in a
    browser. Still, for current development, there is a really nice Chrome plugin,
    Cordova mocks, which was created by Paolo Bernasconi, one of the core contributors
    to previous ngCordova projects. As soon as you install the plugin you can start
    testing your application as if you are testing it on your phone. Currently, there
    are around twelve plugins supported by this extension. This Chrome plugin can
    be effective in some cases and help you test in a browser for supported plugins.'
