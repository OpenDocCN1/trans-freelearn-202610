- pgno: 359
  md: '```

    <strong><link rel="manifest" href="manifest.json"></strong>


    <strong>// src/manifest.json

    {

    "name": "Currency Converter PWA",

    "short_name": "Currency",

    "start_url": "index.html",

    "display": "standalone",

    "icons": [{

    "src": "assets/logo.png",

    "sizes": "512x512",

    "type": "image/png"

    }],

    "background_color": "#db0000",

    "theme_color": "#000000",

    "gcm_sender_id": "124917710568"

    }</strong>

    ```


    +   - fullscreen: All of the available user area is used and no user agent Chrome
    is shown.

    +   - display: Defines the developers preferred display mode for the web application.

    +   - start_url: Specifies the URL that loads when a user launches the application
    from a device. In our Ionic application it will always be index.html.

    +   - short_name: This is to be used where there is insufficient space to display
    the full name of the web application.

    +   - name: This is what the user will see when they open the application on the
    splashscreen page.

    +   - Standalone: The application will look and feel like a standalone application.
    This can include the application having a different window, its own icon in the
    application launcher, and so on.

    +   - minimal-ui: The application will look and feel like a standalone application,
    but it will have a minimal set of UI elements for controlling navigation. The
    elements will vary by browser.

    +   - Browser: The application opens in a conventional browser tab or new window,
    depending on the browser and the platform. This is the default.

    +   - Icons: Array of icons used in various different places for the application,
    for example, when we add it to the home screen this icon is placed with the short_name
    of the application.

    +   - background_color: Expected background color for the web application.

    +   - theme_color: Default theme color for an application.

    +   - gcm_sender_id: Used for sending web push notifications, represents sender_id
    from Firebase Cloud:'
