    \      }, error => {\n        resolve(\"Data not found\");\n      })\n    })\n\
    \  }\n}\n```\n```\n\nFor fetching the currency according to the base currency\
    \ we used the `loadCurrencyList()` method, which then calls the `fixer.io` API\
