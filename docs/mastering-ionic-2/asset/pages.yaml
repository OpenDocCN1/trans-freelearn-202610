  md: '# Cordova and how plugins work


    Cordova is a platform for building Native mobile applications within a single
    codebase in HTML, CSS, and JavaScript. Cordova provides support to multiple platforms
    and plugins. Cordova plugins allow Cordova web view to communicate with Native
    platforms and then our Ionic application runs inside the web view, so this way
    we have access to the platform APIs, such as camera, Geolocation, and so on.'
