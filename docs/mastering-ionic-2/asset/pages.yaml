  md: "# # Google analytics\n\nAnalytics is key for any successful application; it\
    \ helps understand which screens are most visited and which products users took\
    \ interest in the most. We can track many different events that a user does while\
    \ using the application:\n\n```\n```bash\n$ ionic cordova:plugin add cordova-plugin-google-\n\
    \  analytics\n$ npm install @ionic-native/google-analytics --save\n```\n```\n\n\
    Let's start by initializing the plugin in `app.component.ts`, here we will set\
    \ the GoogleAnalytics tracking ID and this will get us started:\n\n```\n```typescript\n\
    // src/app/app.component.ts\nimport { GoogleAnalytics } from '@ionic-native/google-analytics';\n\
    constructor(private ga: GoogleAnalytics) { }\nplatformReady() {\n  // Call any\
    \ initial plugins when ready\n  this.platform.ready().then(() => {\n    Splashscreen.hide();\n\
    \n    // Google Analytics\n    return GoogleAnalyticsthis.ga.startTrackerWithId(\"\
    UA-92660667-1\")\n      .then(() => {\n        console.log('Google analytics is\
    \ ready now');\n        return GoogleAnalyticsthis.ga.enableUncaughtExceptionReporting(true)\n\
    \      }).then((_success) => {\n        console.log(\"startTrackerWithId success\"\
    )\n      }).catch((_error) => {\n        console.log(\"enableUncaughtExceptionReporting\"\
    , _error)\n      });\n  });\n}\n```\n```\n\nThe next step is to integrate the\
    \ Analytics plugin inside the pages so that we can track the activities:\n\n```\n\
    ```typescript\n// src/pages/home/home.ts\n\nimport { GoogleAnalytics } from '@ionic-native/google-analytics';\n\
    \nconstructor(public platform: Platform, private ga:\n  GoogleAnalytics) {\n \
    \ this.platform.ready().then(() => {\n    GoogleAnalyticsthis.ga.trackView(\"\
    Home Page\");\n  });\n}\n\ntrackEvent() {\n  let active = this.slider.getActiveIndex();\n\
    \  this.platform.ready().then(() => {\n    GoogleAnalyticsthis.ga.trackEvent(\"\
    Slider\", \"Slider-\n    Changed\", \"Label\", active);\n  });\n}\n```\n```"
  merge: -1
