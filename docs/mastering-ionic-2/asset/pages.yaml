  md: '# Summary


    Beacons and their applications will be emerging soon in multiple sectors , particularly
    in the retail sector. Yet, it''s really new technology as far as wide-spread implementations
    are concerned. Retailers should try to think of new innovations with new technologies
    so the user-experience can be enhanced. We have discussed and implemented many
    use cases of how we can use IOT with Ionic applications quickly. I have been following
    Ionic blogs regularly and seen so many teams using Ionic for interfacing with
    their hardware devices, one such is jewelbots which enables when a friend is nearby
    or send you an message. Opportunities are enormous, its just need an idea in mind
    to implement it and take it to the world.


    We are almost near completion of our journey, but we have another interesting
    topic still waiting to be covered next. We discussed in this chapter about the
    problem of installing multiple native applications for accessing devices, so this
    same problem is solved by the introduction of PWA support for Ionic. PWA has made
