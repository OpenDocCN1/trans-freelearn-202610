- pgno: 372
  md: "filtered this type of request to be `networkFirst`, so everytime it will fetch\
    \ the latest data from the server. In case a device is offline, it returns the\
    \ last cached result and if in case the request was not cached it will go to the\
    \ error block and we will resolve it as `Data not found`. At the same time we\
    \ are also storing the data in `IndexedDB`:\n\n```\n```typescript\nconvert(from,\
    \ to) {\n  return new Promise(resolve => {\n    this.http.get(\"https://api.fixer.io/latest?base=\"\
    \ + from +\n      \"&symbols=\" + to).map(res => res.json()).subscribe(data =>\
    \ {\n        resolve(data);\n      }, error => {\n        this.cache.getObject('base_'\
    \ + from).then((value) => {\n          if(value) {\n            resolve(value);\n\
    \          } else {\n            resolve(\"Data not found in offline State\");\n\
    \          }\n        })\n      })\n  })\n}\n```\n```\n\nOn our `HomePage` we\
    \ fetch the one-to-one currency conversion rate and for that we use the `convert()`\
    \ method. Here our approach is `cacheFirst` and we will return the `cacheStorage`\
    \ data first and if it is not found we will call the `fixer.io` API. In case we\
    \ didn't cache a specific request and we are offline then it will fallback to\
    \ error block, where we will first check if we have the base currency list already\
    \ stored in `IndexedDB` while we fetched its entire list. If we have that in our\
    \ storage then we can easily find the second currency in the list.\n\nLet's look\
    \ into our `ListPage` class from where we will be calling the `CurrencyService`:\n\
