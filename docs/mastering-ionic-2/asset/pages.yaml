    if someone is dedicated enough, they can still work around it and see your source
    code. At the end it''s our responsibility and how difficult we can make it to
    hack it around. Taking into consideration that we don''t share or put sensitive
    information inside our codebase. We will be looking into all this in this chapter:


    +   - Authentication

