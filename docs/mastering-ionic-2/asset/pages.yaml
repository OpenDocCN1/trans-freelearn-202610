- pgno: 314
  md: "We have used the `makeid()` function to generate random `$keys` for reviews/rating\
    \ of the same `foodItems` by multiple users. Here you can see we haven't used\
    \ the `AngularFire` method and rather used directly Firebase method because we\
    \ will not be able to insert data in this way using `AngularFire` standard functions.\n\
    \nOther than creating and querying data, we can update and delete objects using\
    \ `AngularFire`. We haven't used these in our application but it is really easy\
    \ to perform these functions:\n\n```\n```javascript\n// Deleted the object and\
    \ handles error via promise\nconst promise = af.database.object('/item').remove();\n\
    promise\n  .then(_ => console.log('success'))\n  .catch(err => console.log(err,\
    \ 'You dont have access!'));\n\n// updates data of an object\nconst itemObservable\
    \ = af.database.object('/item');\nitemObservable.update({ age: newAge });\n```\n\
    ```\n\nThis is one small example of how quickly we can prepare prototypes using\
    \ Firebase. We can further extend this application with uploading images and integrating\
    \ the push and analytics services of Firebase. There are multiple possibilities\
    \ available and from here you can easily start your journey.\n\n> > There have\
    \ been regular updates to every technology and framework so, I have to make sure\
