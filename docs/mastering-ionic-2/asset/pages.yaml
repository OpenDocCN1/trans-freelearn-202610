  md: "# # Building a music player\n\nWe will now build a media player application,\
    \ where you will have audio and video streaming and download options to save the\
    \ file to your mobile. We will be mainly integrating a media plugin for audio\
    \ streaming via `ionic-audio` package, a `StreamingMedia` plugin will be used\
    \ for playing the videos, and a `FileTransfer` plugin for downloading the files\
    \ to a local system directory. Let's first create an application\n\n```\ngaurav@gaurav-thinkpad:~/projects$\
    \ ionic start jingle-app tabs --v2\nCreating an Ionic 2.x app in /home/gaurav/projects/jingle-app\
    \ based on the tabs template.\n\nDownloading: https://github.com/driftyco/ionic2-app-base/archive/master.zip\n\
    Downloading: https://github.com/driftyco/ionic2-starter-tabs/archive/master.zip\n\
    Installing npm packages (may take a minute or two)...\n\n♫♫♫♫ Your Ionic app is\
    \ ready to go! ♫♫♫♫♫\n\nSome helpful tips:\n\nRun your app in the browser (great\
    \ for initial development):\n  ionic serve\n\nRun on a device or simulator:\n\
    \  ionic run [android,browser]\n\nShare your app with testers, and test on device\
    \ easily with the Ionic View companion app:\n  http://view.ionic.io\ngaurav@gaurav-thinkpad:~/projects$\n\
    ```\n\nfor which we will be using the tabs template:\n\nWe just now need to add\
    \ the **ionic platform add android** platform and we will be ready to integrate\
    \ the plugins and build our jingle application."
  merge: -1
