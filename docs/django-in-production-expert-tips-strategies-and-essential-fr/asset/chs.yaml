  urlpatterns = [\n    path('publish/', views.publish_blog)\n]\n```\n访问 [`127.0.0.1/blog/publish`](http://127.0.0.1/blog/publish)\
  \ 端点，信号应正常工作。终端中查看 **Sending email to the author logic** 消息以验证集成。\n默认 Django 信号是同步的。若任务需交互外部系统且延迟较高，建议用\
  \ Celery 创建异步信号。*第 8 章* 将讨论 Celery 及异步信号。\n下面检查生产环境使用信号的最佳实践。\n## Working with signals\
  \ in production\nDjango 信号属于高级特性。多数在线教程未覆盖生产使用或不同模式。本节介绍生产中使用 Django 信号时应注意的要点：\n\
  *   若无强需求避免使用信号。项目增长后，通过信号连接的代码难以调试。\n*   为每个 Django 应用创建单独文件如 `signals.py` 集中管理信号。虽可将信号放在\
  \ `models.py`，但项目复杂后会混乱。\n*   同理，使用 `receiver.py` 文件集中存放接收器代码。\n*   分发信号时除非用例指定，否则始终使用\
  \ `send_robust`。多个接收器可能监听同一信号，若其中一个失败会导致后续不执行。使用 `send_robust` 可确保即使前一个失败，信号仍传播给下一个接收器。\n\
  *   防止重复信号。分发代码可能多次执行，使用 `dispatch_uid` 可缓解此问题。\n*   在大型代码库中调试信号很困难，应负责任使用并为信号用例添加适当注释。\n\
  *   尽量避免 `pre_save` 和 `post_save` 信号。随着项目复杂化和多开发者协作，这些信号难以追踪。建议创建类似实现的包装信号，便于项目增长时追踪。\n\
  我们已学习使用 Django 信号的最佳实践。接下来学习 Django 中间件及如何创建自定义中间件。\n# Working with Django middleware\n\
  Django 中间件是挂载到 Django 请求/响应周期的普通 Python 类。可在视图处理请求前修改请求，或在响应发送前修改响应。每个中间件在请求/响应周期中调用两次：第一次在客户端收到请求时，第二次在响应发送回客户端时。\n\
  \n\n\n\n默认情况下，Django 提供了大量中间件，我们也在 *第三章* 中学习了 DRF 如何利用 Django 中间件框架来集成 REST API。默认的\
  \ Django 中间件主要用于身份验证，并且与安全相关。当我们创建一个新项目时，Django 会在 `settings.py` 文件中自动插入此中间件：\n\n\
  ```\nMIDDLEWARE = [\n    \"django.middleware.security.SecurityMiddleware\",\n  \
  \  \"django.contrib.sessions.middleware.SessionMiddleware\",\n    \"django.middleware.common.CommonMiddleware\"\
  ,\n    \"django.middleware.csrf.CsrfViewMiddleware\",\n    \"django.contrib.auth.middleware.AuthenticationMiddleware\"\
  ,\n    \"django.contrib.messages.middleware.MessageMiddleware\",\n    \"django.middleware.clickjacking.XFrameOptionsMiddleware\"\
  ,\n]\n```\n\n需要注意的是，这些中间件项在 `settings.py` 文件中定义的顺序，就是请求到来时被评估的顺序，而响应发送回客户端时则是相反的顺序。\n\
  \nDjango 中间件利用了简单的 Python 类概念。`middleware` 类在 Django 服务器启动时实例化，然后对于每个请求，它都会执行 `__call__`\
  \ 方法内部编写的所有代码。Django 还提供了一种创建我们自己的自定义中间件的方法，可以轻松地将其插入到系统中。让我们学习如何在 Django 中创建自定义中间件。\n\
  \n# 创建自定义中间件\n\n自定义 Django 中间件应用于执行我们希望对所有请求/响应运行的代码。例如，我们希望为所有请求/响应添加自定义头，或者我们希望为请求添加日志记录或监控。在\
  \ *第六章* 中，我们学习了如何使用自定义中间件为每个请求添加 `get user_id` 用于日志记录。在本节中，我们将学习 Django 自定义中间件的核心概念。\n\
  \n让我们现在检查如何在 Django 中创建自定义中间件：\n\n1. 创建一个名为 `custom_middleware.py` 的文件（也可以使用其他名称）。将以下代码添加到\
  \ `common/custom_middleware.py` 文件中：\n\n```\nclass CustomMiddleware:\n    def __init__(self,\
  \ get_response):\n      self.get_response = get_response\n    def __call__(self,\
  \ request):\n      print(\"custom middleware before request view\")\n      # Code\
  \ to be executed for each request\n      response = self.get_response(request)\n\
  \      # Code to be executed for each response\n      print(\"custom middleware\
  \ after response view\")\n      return response\n```\n\n在前面的代码片段中，我们有两个 `print`\
  \ 语句来描述自定义中间件。在我们的示例中，我们添加了一个 `print` 语句，但我们可以扩展此概念来实现任何逻辑。我们也可以使用中间件修改 `request`\
  \ 或 `response` 对象。例如，Django 使用默认的身份验证中间件将 `user` 属性添加到 `request` 对象。\n\n需要注意 `response\
  \ = self.get_response(request)` 代码，它负责确保我们将代码执行发送到下一个中间件或请求视图逻辑以供执行。`self.get_response`\
  \ 给出的结果是视图或前一个中间件返回的响应。\n\n2. 将自定义中间件添加到 `settings.py` 文件中的中间件配置中。我们添加中间件的顺序非常重要：\n\
  \n```\nMIDDLEWARE = [\n    \"django.middleware.security.SecurityMiddleware\",\n\
  \    \"django.contrib.sessions.middleware.SessionMiddleware\",\n    \"django.middleware.common.CommonMiddleware\"\
  ,\n    \"django.middleware.csrf.CsrfViewMiddleware\",\n    \"django.contrib.auth.middleware.AuthenticationMiddleware\"\
  ,\n    \"django.contrib.messages.middleware.MessageMiddleware\",\n    \"django.middleware.clickjacking.XFrameOptionsMiddleware\"\
  ,\n    # Custom middleware\n    \"common.custom_middleware.CustomMiddleware\",\n\
  ]\n```\n\n对于每个请求，我们的 `CustomMiddleware` 类现在将被执行。为了验证 `CustomMiddleware` 集成，运行 Django\
  \ 服务器，然后打开浏览器上的任何 [URL（例如，`http`](http://127.0.0.1:8000/blog/paginated/)**://127.0.0.1:8000/blog/paginated/**)。我们将在终端中看到以下输出：\n\
  \n```\nStarting development server at http://127.0.0.1:8000/\nQuit the server with\
  \ CONTROL-C.\ncustom middleware before request view\ncustom middleware after response\
  \ view\n[03/Dec/2023 12:27:31] \"GET /blog/paginated/?page=2&page_size=2 HTTP/1.1\"\
  \ 200 10734\n```\n\n自定义中间件会在每次向我们的 Django 服务器发出请求时打印出来。\n\n我们的自定义中间件可用于实现除我们已实现的打印之外的不同逻辑。多个第三方包使用中间件概念来修改任何\
  \ `request`/`response` 对象。虽然中间件是 Django 中非常重要的概念，但你也应该记住中间件带来的性能开销。中间件会在每个请求上执行，因此我们在编写/使用中间件之前应该了解我们的用例，否则它可能会降低我们的性能。\n\
  \n# 总结\n\n在本章中，我们学习了 Django 中的三个高级概念。我们学习了分页的不同概念，以及 Django 和 DRF 如何利用分页来改进 RESTful\
  \ API。接下来，我们学习了 Django 信号的概念，以及 Django 如何提供开箱即用的信号来解耦不同的应用程序逻辑。Django 还提供了扩展自定义信号的接口。最后，我们学习了\
  \ Django 中间件概念。Django 中间件用于修改 `request`/`response` 对象。我们还学习了如何创建自定义中间件并在我们的 Django\
  \ 项目中使用它。\n\n在本章中，我们学习了 Django 的所有高级概念，任何开发人员都应该能够舒适地实现这些概念，以便编写可扩展的 Django 应用程序。\n\
  \n在下一章中，我们将重点学习使用 Django 进行分布式任务队列编程。Celery 是最流行的 Python 框架之一，与 Django 一起使用以实现长时间运行的逻辑。随着我们构建应用程序，我们会遇到长时间运行的用例或需要调度的任务。Celery\
  \ 有助于实现这些长时间运行/周期性任务。\n\n# 8\n\n# 使用 Django 的 Celery\n\n我们在前几章中学习了 Django 和 DRF\
  \ 提供的开箱即用功能。Django 和 DRF 都为框架提供了定制和可扩展性的范围，但异步编程在 Django 中缺失了相当长一段时间。然而，随着 Django\
  \ 4 的引入，Django 开始使用不同的异步接口原生支持异步编程。这仍然无法帮助执行长时间运行的作业或按周期间隔执行的作业的需求。为了解决这一需求，我们使用\
  \ Python 中一个众所周知的第三方包 `Celery`。\n\nCelery 是一个简单、灵活且可靠的分布式系统，用于处理大量消息。它是一个任务队列，专注于实时处理，同时也支持任务调度。在本章中，我们将学习如何将\
  \ Celery 与 Django 结合使用，并使用 `celery beat` 在 Django 中执行周期性任务。由于 Celery 本身就是一个完全不同的框架，我们不会深入研究该框架，而是专注于实现细节，并提供高层次的概述来帮助你入门。\n\
  \n在本章中，我们将学习以下主题：\n\n*   使用 Django 进行异步编程\n*   使用 Django 的 Celery\n*   使用 Django\
  \ 的 `celery beat`\n\n# 技术要求\n\n在本章中，我们将介绍异步编程的一些高级概念，因此读者必须精通以下内容：\n\n\n\n\n\n*\
  \   同步编程与异步编程的区别，以及后者相对于前者的优势。\n*   消息代理和任务队列的基本概念。`Celery` 是一个用于处理任务队列和任务调度的框架。\n\
  *   如何设置 Redis 并在本地系统中使用远程 Redis 服务器（我们在 *第 6 章* 中讨论过此内容）。\n\n# Django 中的异步编程\n\n\
  Django 4 在其核心框架中引入了异步编程的概念。虽然 Django 引入了对异步视图的支持，但官方文档（[`docs.djangoproject.com/en/stable/topics/async/#performance`](https://docs.djangoproject.com/en/stable/topics/async/#performance)）指出，异步视图会导致性能下降。\n\
  \n因此，截至 Django 4.x，原生的异步编程适配尚未成熟。虽然大多数常见和基本功能不需要任何异步支持，但作为框架，Django 因此落后于 Express\
  \ 和 Spring 等其他框架。为了解决这个问题，Django 开发者使用第三方框架来实现异步支持。一般来说，当有一个可以在后台执行的长时间运行任务时，异步编程会有所帮助。例如，当我们需要发送一封电子邮件时，我们的\
  \ Django 视图会向电子邮件服务发出外部 API 调用并等待响应。整个过程可能需要一段时间，让客户端请求等待电子邮件服务是没有额外价值的；相反，更倾向于在后台执行此任务。对于此类异步的长时间运行/后台任务，可以使用\
  \ `Celery` 等框架。`Celery` 是一个分布式任务队列，用于将任务从主要请求-响应工作流中卸载。\n\n注意\n\n应该记住，`Celery` 本身是一个框架，具有自己的功能和复杂的架构。`Celery`\
  \ 的架构超出了本书的范围。我们将在本章中仅关注 `Celery` 与 Django 的集成。要了解 `Celery` 的架构和高级概念，建议您查阅 `Celery`\
  \ 官方文档 [`docs.celeryq.dev/en/stable/index.html`](https://docs.celeryq.dev/en/stable/index.html)。\n\
  \n在下一节中，我们将学习如何将 `Celery` 与 Django 一起使用，并利用 `Celery` 的功能在后台执行长时间运行的任务。\n\n# 使用 Celery\
  \ 与 Django\n\n让我们通过一个小的实际例子来了解 `Celery` 在内部是如何工作的。想象一下，你想执行 10 个不同的任务，而你只有 2 个人来完成它们。每个人一次只能处理一个特定的任务，并且新任务可能在任何时候到来。为了解决这个问题，工作人员会创建一个列表，每当有新任务进来时，他们就会将任务添加到该列表中。每当一个人完成任务时，你就会从列表中划掉该任务，然后为他们分配下一个任务。如果为你增加更多人，那么你就可以更快地完成任务。这就是\
  \ `Celery` 所做的。\n\n在 `Celery` 中，有一个任务队列跟踪所有传入的任务 - 任务队列使用 RabbitMQ 或 Redis 保存。有\
  \ `Celery` 工作进程从队列中获取任务并处理它们。Django 生成这些任务并将它们推送到任务队列，`Celery` 从中获取任务并使用 `Celery`\
  \ 工作进程执行它们。\n\n现在让我们看看如何将 `Celery` 集成到 Django 项目中。我们将使用 Redis 来创建和维护项目中的 `Celery`\
  \ 任务队列。在 *图 8**.1* 中，我们有一个简约的 `Celery`-Django 架构：\n\n![Figure 8.1: Celery architecture\
  \ with Django](img/Figure_8.1_B18867.jpg) \n\n图 8.1：Celery 与 Django 的架构\n\n在 Django\
  \ 中运行的应用服务器创建任务并将这些任务发送到 Redis 任务队列。然后 `Celery` 工作进程一个接一个地从队列中获取这些任务并运行它们。这是一个过度简化的例子，说明\
  \ `Celery` 和 Django 在内部是如何工作的，但它应该能让你对架构有一个很好的了解。\n\n现在让我们看看如何安装 `Celery` 并将其集成到我们的系统中。\n\
  \n## 集成 Celery 和 Django\n\n`Celery` 提供了多种代理集成，如 RabbitMQ、Redis 和 Amazon SQS。我们将使用\
  \ Redis 作为 `Celery` 服务的代理。在 *第 6 章* 中，我们学习了如何在本地使用远程 Redis 服务器，并且我们将在此处为我们的 `Celery`\
  \ 代理使用相同的 Redis 服务器。让我们看看将 `Celery` 集成到 Django 的步骤：\n\n1. 作为第一步，我们需要使用 `pip install\
  \ celery` 命令在项目中安装 `Celery`。\n\n2. 在与 `settings.py` 文件相同的文件夹中创建一个新的 `celery.py`\
  \ 文件，其中包含以下代码（对于我们来说，位置是 `backend/config/celery.py`）：\n\n```\nimport os\nfrom celery\
  \ import Celery\ncelery_settings_value = \"<project name>.settings\"\n# change <project\
  \ name> with folder name where your settings.py file is present.\nos.environ.setdefault(\"\
  DJANGO_SETTINGS_MODULE\", celery_settings_value)\napp = Celery(\"<project name>\"\
  )\n# change <project name> with folder name where your settings.py file is present.\n\
  app.config_from_object(\"django.conf:settings\", namespace=\"CELERY\")\napp.autodiscover_tasks()\n\
  task = app.task\n@app.task(bind=True)\ndef debug_task(self, data):\n    print(data)\n\
  ```\n\n3. 现在我们必须将 Redis 代理连接详细信息添加到 `settings.py` 文件中。你需要在 RedisLabs 中更新 Redis 连接详细信息。在此步骤中，我们告诉\
  \ `Celery` 使用 Redis 作为代理和结果后端：\n\n```\nREDIS_CONNECTION_STRING = '<user>:<pass>@<endpoint>'\n\
  # Use redis lab credentials\nCELERY_BROKER_URL = f\"redis://{REDIS_CONNECTION_STRING}\"\
  \nCELERY_RESULT_BACKEND = f\"redis://{REDIS_CONNECTION_STRING}\"\n```\n\n我们已经集成了\
  \ Django、`Celery` 和 Redis。`Celery` 使用工作进程来执行任务。现在我们需要定义工作进程。就像 Django 管理命令一样，`Celery`\
  \ 也有一个管理命令，可用于定义工作进程。\n\n4. 打开一个新终端并运行以下命令（请注意 - `<project>` 关键字需要替换为 `celery.py`\
  \ 文件所在的文件夹名称）：\n\n```\ncelery --app=<project> worker --loglevel=INFO\n```\n\n此命令创建一个可用于在本地开发环境中测试和工作的\
  \ `Celery` 工作进程。如果我们的集成成功，我们应该能够看到 *图 8**.2* 中显示的输出：\n\n![Figure 8.2: Terminal running\
  \ Celery workers](img/Figure_8.2_B18867.jpg) \n\n图 8.2：运行 Celery 工作进程的终端\n\n一旦我们确认\
  \ `Celery` 工作进程正在运行，我们就可以停止工作进程并进入 Django 集成步骤。\n\n1. 为了测试我们的集成，让我们从 Django 视图调用我们的\
  \ `Celery` 任务。将以下代码添加到 `blog/views.py` 文件中：\n\n```\nfrom config.celery import debug_task\n\
  @api_view(['GET'])\ndef verify_blog(request):\n    verify_word = request.GET.get('verify_word')\n\
  \    debug_task.delay(f\"Celery Task verification: {verify_word}\")\n    return\
  \ Response({'status': 'success'})\n```\n\n*请注意，我们从 `config.celery` 导入 `debug_task`，因为我们已在\
  \ `config` 文件夹/应用中创建了 `celery.py` 文件。你的版本可能有其他名称，因此请确保检查。*\n\n现在我们需要将视图链接到 URL。将以下代码添加到\
  \ `blog/urls.py` 文件中：\n\n```\nurlpatterns = [\n    path('verify/', views.verify_blog)\n\
  ]\n```\n\n我们已成功将 `Celery` 集成到我们的 Django 项目中。\n\n现在为了验证我们的 `Celery` 集成是否按预期工作，让我们在终端上运行\
  \ `Celery` 工作进程，运行以下命令：\n\n```\ncelery --app=config worker --loglevel=INFO\n```\n\
  \n\n\n\n\n我们应该看到与图 8.2 所示类似的输出。现在让进程运行并打开一个新的终端，在其中我们需要运行 `python manage.py runserver`\
  \ 命令。通过访问 `http://127.0.0.1:8000/blog/verify/?verify_word=abc` 在浏览器中打开 `/verify`\
  \ 端点。我们应该在浏览器上得到成功响应，并且当我们查看 Celery worker 终端时，应该看到输出显示 `Celery Task verification:\
  \ abc`，与图 8.3 所示类似：\n\n![Figure 8.3: Output from a Celery task that was initiated\
  \ in Django](img/Figure_8.3_B18867.jpg)\n\n图 8.3：由 Django 启动的 Celery 任务的输出\n\n##\
  \ 重要说明\n\nCelery 本身并不支持热重载。开发人员经常会遇到这样的问题：他们更新了代码，但在本地开发服务器中任务并没有按预期工作。请记住，当我们启动\
  \ Celery worker 时，它会将代码加载到内存中并持续运行，除非我们手动重启 Celery worker。\n\n为了解决这个问题，我们可以使用 Watchdog\
  \ 等第三方包并创建自定义命令。阅读有关 Watchdog 的更多信息请访问 [`github.com/gorakhargosh/watchdog`](https://github.com/gorakhargosh/watchdog)。\n\
  \n我们已经将 Celery 与 Django 集成。让我们现在学习如何在 Django 项目中有效地使用 Celery，并检查 Celery 提供的不同接口。\n\
  \n## Celery 的接口\n\nCelery 可用于执行 Django 应用程序需要运行的任何长时间运行的任务。每当 Django 遇到需要执行的长时间运行/后台作业时，它就会让\
  \ Celery 来处理该任务。\n\n作为良好的实践，建议在每个应用中创建单独的 `tasks.py` 文件。例如，我们的 blog 应用应该有一个 `blog/tasks.py`\
  \ 文件，其中包含与 blog 应用相关联的所有 Celery 任务。让我们考虑一个用例——每当博客发布时，我们希望向该博客的所有关注者发送电子邮件。这是一个理想的用例，我们应该让\
  \ Celery worker 处理向所有关注者发送电子邮件的任务。我们需要使用以下代码创建 `blog/tasks.py` 文件：\n\n```\nfrom\
  \ blog import private\nfrom config.celery import task\n@task(bind=True)\ndef send_email_to_followers(self,\
  \ author_id, blog_id):\n    print('Sending email to all follower logic')\n```\n\n\
  在此片段中，我们创建了一个名为 `send_email_to_followers` 的 Celery 任务，每当作者撰写新博客时，该任务就会向所有关注者发送电子邮件。\n\
  \n现在我们将此 Celery 任务集成到 Django 视图中。我们使用 `send_email_to_followers` 函数调用创建的 Celery 任务，并按需发送\
  \ `author_id` 和 `blog_id` 值：\n\n```\nFrom blog import tasks\ndef publish_blog(request):\n\
  \    blog = save_blog(request)\n    # publish blog code\n    tasks.send_email_to_followers.delay(blog.author_id,\
  \ blog.id)\n```\n\n请注意，我们使用 `.delay` 关键字来调用 Celery 任务。如果不使用 `.delay`，那么 `publish_blog`\
  \ 将像一个简单的 Python 函数一样运行，而不会由 Celery worker 执行。\n\n我们已经学习了如何创建 Celery 任务并在 Django\
  \ 中使用它们。在我们的示例中，我们使用了最基本的可配置和任务定义。随着代码规模和复杂性的增长，您可能需要集成 Celery 的更多高级功能。\n\n### 重要说明\n\
  \nCelery 本身是一个框架，拥有大量内置功能。我们仅关注高层接口和作为入门时应注意的重要点。强烈建议您阅读官方文档并了解 Celery 提供的所有高级功能。您可以在\
  \ [`docs.celeryq.dev/en/stable/userguide/index.html`](https://docs.celeryq.dev/en/stable/userguide/index.html)\
  \ 找到官方文档\n\nCelery 的高级功能超出了本书的范围。然而，我们接下来将回顾一些在生产环境中运行 Celery 和 Django 时有用的最佳实践和高级概念。\n\
  \n## 使用 Celery 的最佳实践\n\n让我们学习一些最佳实践，这些实践可以帮助我们在生产环境中编写可扩展的 Celery 任务。 （如所述，我们将专注于介绍概念，而不会深入细节）：\n\
  \n* 使用 `.delay` 调用任务是开始使用 Celery 的好方法。但随着我们开始转向 Celery 的更高级概念，我们应该开始使用 `.apply_async`\
  \ 来调用 Celery 任务。由于 `.delay` 是 `.apply_async` 的额外包装，因此抽象掉了许多可能有用的选项。\n* 在任务定义中使用\
  \ `autoretry_for` 选项。这对于让 Celery 在遇到任何故障时重试特别有帮助。\n* 在任务定义中使用 `max_retries` 选项来配置\
  \ Celery 在将任务标记为失败之前可以执行的最大重试次数。\n* 对长时间运行的任务始终使用 `time_limit`。这是一个硬性限制。超过此阈值后，Celery\
  \ 将自动终止任务。应为所有任务实现硬性限制，以防止长时间运行的任务占用所有 worker 并阻塞任务队列。\n* 始终保持任务简短——将长任务拆分为较小的任务块。例如，如果您必须向\
  \ 100 个用户发送电子邮件，请创建一个任务，该任务会再次生成多个任务以向每个用户发送单独的电子邮件。\n* 创建保证幂等性和原子行为的 Celery 任务对于创建可扩展的\
  \ Celery 系统非常重要。\n* 始终确保创建向后兼容的 Celery 任务。例如，如果一个 Celery 任务在任务定义中接受三个参数，例如 `def\
  \ add_task(a,b,c)`，现在我们想删除第三个参数，那么所有使用三个参数创建的现有任务都将开始失败。因此，我们应该确保编写向后兼容的代码，以便现有任务不会因未来更改而中断。\n\
  * 随着项目的增长，您可能会开始大量使用 Celery。Celery 使用队列数据结构来存储任务并按 `first in, first out` (`FIFO`)\
  \ 顺序执行它们，但可能存在需要优先处理某些任务而不是其他任务的用例。这可以通过使用不同的队列来实现，并且还可以通过在创建任务时设置优先级来实现。请阅读有关优先级的官方文档以获取更多详细信息，网址为\
  \ [`docs.celeryq.dev/en/stable/userguide/routing.html#redis-message-priorities`](https://docs.celeryq.dev/en/stable/userguide/routing.html#redis-message-priorities)\n\
  * Django 信号本质上是同步的，但通过使用 Celery 我们可以创建异步信号。\n* 不要将数据库对象传递给任务，因为数据库对象可能被另一个进程更新。为了避免在陈旧数据上工作，始终将对象\
  \ ID 传递给任务。这确保任务始终获取最新数据以执行操作。\n* Celery 默认使用模块和任务名称分配任务名称。虽然在您有良好的命名约定时效果很好，但在任务名称未正确添加时可能会导致调试问题。Celery\
  \ 具有 `name` 接口，可让您在需要时为 Celery 任务提供自定义名称。\n* 如果您有依赖于 Celery 的重要业务逻辑，请始终拥有定期运行的对账作业，以确保\
  \ Celery 任务已按预期执行。\n\n我们现在已经学习了如何将 Celery 集成到 Django 项目中，以及在生产环境中实现 Celery 时应遵循的最佳实践。还有一个\
  \ Celery 帮助开发人员解决的重要用例——周期性任务。 `celery beat` 是一个调度程序，它会定期检查任何周期性任务并为 worker 创建 Celery\
  \ 任务以执行。\n\n# 使用 celery beat 与 Django\n\n\n\n\n\n周期性任务是 Celery 最常见的用例之一。例如，假设你希望每周定期向用户发送电子邮件，或每周创建某些汇总报告。对于此类重复性任务，Celery\
  \ 提供了 `celery beat`，它是一个调度器，会不断检查是否有任何计划任务需要在给定时间执行，然后运行它。`celery beat` worker 会代替\
  \ Django 应用程序创建任务并将其放入 Redis 任务队列中，然后 Celery worker 从中取出任务并执行。\n\n让我们学习如何将 `celery\
  \ beat` 集成到我们的 Django 项目中：\n\n1. 创建周期性任务有多种方式，例如在设置文件中添加 `crontab` 配置，或将 beat 调度插入到\
  \ `app.conf.beat_schedule` 对象中。它们工作得很好，但缺乏易用性。真正脱颖而出的一种选择是使用 `on_after_finalize.connect`\
  \ 信号。\n\n在下面的示例中，我们创建一个每分钟运行一次并触发 `demo_task` 的周期性任务。将以下代码添加到 `author/tasks.py`\
  \ 文件中：\n\n```\nfrom config.celery import app\nfrom config.celery import task\nfrom\
  \ celery.schedules import crontab\n@app.on_after_finalize.connect\ndef setup_basic_periodic_tasks(sender,\
  \ **kwargs):\n    sender.add_periodic_task(\n       crontab(),\n       demo_task.s(\"\
  periodic task\")\n    )\n@task(bind=True)\ndef demo_task(self, value):\n    print(value)\n\
  ```\n\n我们可以通过使用 `crontab` 语法来更改间隔。有关更多详细信息，请查看 `Celery crontab` 的官方文档，网址为 [`docs.celeryq.dev/en/main/userguide/periodic-tasks.html#crontab-schedules`](https://docs.celeryq.dev/en/main/userguide/periodic-tasks.html#crontab-schedules)\n\
  \n2. `celery beat` 是一个单独的进程，会持续监控任何计划任务。我们需要在终端上运行一个新的 Celery 命令来运行 `celery beat`\
  \ 服务。请注意，`<project>` 关键字需要替换为包含 `celery.py` 文件的文件夹名称（在我们的例子中是 `config`），就像我们为 Celery\
  \ 设置时所做的那样：\n\n```\ncelery --app=<project> beat --loglevel=INFO\n```\n\n现在我们有一个正在运行的\
  \ `celery beat` 实例，它会不断检查任何周期性任务，然后将这些任务推送到 Redis 队列中，Celery worker 将从中获取任务并执行它们。因此，我们已将\
  \ `celery beat` 集成到我们的 Django 项目中以运行周期性任务。\n\n让我们验证我们的 `celery beat` 集成项目。由于我们已经创建了一个每分钟运行一次的周期性任务，我们应该能够在终端中检查输出。首先，通过在终端中运行以下命令启动\
  \ `celery beat` 服务器：\n\n```\ncelery --app=config beat --loglevel=INFO\n```\n\n让\
  \ `celery beat` 在一个终端中运行，现在打开一个新的终端并通过运行以下命令启动 Celery worker：\n\n```\ncelery --app=config\
  \ worker --loglevel=INFO\n```\n\n现在我们有两个 Celery 实例正在运行：一个运行 `celery beat` 服务，另一个运行\
  \ Celery worker。我们应该能够看到 `celery beat` 的输出，类似于 *Figure 8.4* 所示，每分钟创建一个 `demo_task`\
  \ 实例：\n\n![Figure 8.4: Logs showing celery beat creating demo_task every minute](img/Figure_8.4_B18867.jpg)\n\
  \nFigure 8.4: Logs showing celery beat creating demo_task every minute\n\n`celery\
  \ beat` 负责创建任务，但 Celery worker 负责任务的执行。我们可以检查 Celery worker 的输出，显示 `demo_task` 每分钟执行一次，如\
  \ *Figure 8.5* 所示：\n\n![Figure 8.5: Logs showing the Celery worker executing a demo\
  \ task](img/Figure_8.5_B18867.jpg)\n\nFigure 8.5: Logs showing the Celery worker\
  \ executing a demo task\n\n重要说明\n\n任何时候都应始终运行单个 `celery beat` 实例。如果我们运行多个 `celery\
  \ beat` 实例，我们会看到周期性任务的重复执行。\n\n然而，我们可能希望运行 `celery beat` 的备份实例以防止任何故障。对于此类场景，我们可以使用名为\
  \ `celery-redbeat` 的第三方包。有关更多详细信息，请查看 `celery-redbeat` 包提供的文档，网址为 [`redbeat.readthedocs.io/en/latest/index.html`](https://redbeat.readthedocs.io/en/latest/index.html)\n\
  \n`celery beat` 是用于自动化重复性任务的最强大的工具之一。我们已经了解了如何将 Django 与 Celery 和 `celery beat`\
  \ 集成。在 *Chapter 11* 中，我们将学习如何将整个 Django、Celery 和 `celery beat` 设置 Docker 化以改善整体开发体验。此外，监控\
  \ Celery worker 和 `celery beat` 服务也很重要。我们还应定期对 Celery worker 和 `celery beat` 进行健康检查。我们将在\
  \ *Chapter 14* 中讨论这些内容。\n\n# Summary\n\n在本章中，我们学习了如何使用 Celery 解决长时间运行任务的问题。在 Web\
  \ 开发中，长时间运行的任务很常见，例如当我们必须生成月度报告、向一批用户发送电子邮件、处理从上传文件中获取的数据等等。Celery 非常适合解决此类用例。同样，有很多用例需要任务调度功能。例如，如果我们希望每周向用户发送每周汇总报告、向终端用户发送提醒电子邮件等等，`celery\
  \ beat` 将是我们构建此类功能的首选工具。\n\n在 *Chapter 9* 中，我们将学习如何使用 Django 编写单元和集成测试。编写单元测试是开发周期中最重要但经常被忽视的阶段之一。我们将学习编写单元和集成测试时应遵循的所有最佳实践。\n\
  \n# 9\n\n# Writing Tests in Django\n\n在 *Chapter 8* 中，我们学习了 Celery 以及如何编写 Celery\
  \ 任务来解决我们长时间运行任务的问题。Celery 帮助我们使用 Celery Beat 实现周期性任务。因此，有了迄今为止获得的所有知识，我们可以创建解决业务用例的应用程序。我们应该始终记住的一件事是，编写代码很容易，尤其是在从头开始编写时，但困难的部分在于我们必须维护代码并在现有代码库中添加新功能/改进功能。这就是编程中最重要的概念之一进入画面的时候\
  \ – `testing`。\n\n在本章中，我们将学习测试的不同方面以及为什么测试很重要，学习如何编写可维护的测试用例，使系统不会变得脆弱，但能为您提供灵活性和信心来快速发布新功能。\n\
  \n本章将涵盖以下主题：\n\n* 介绍软件开发中的不同类型的测试\n* 为 Django 和 DRF 设置测试\n* 学习在 Django 项目中编写测试的最佳实践\n\
  \n# Technical requirements\n\n在本章中，我们将学习测试的概念；我们希望您熟悉 Django 的概念，如前几章所述。我们假设您对软件开发领域的测试有基本了解。此外，您应具备在\
  \ Python 中编写测试用例的基本知识，并具有为代码编写单元/集成测试用例的一些经验。\n\n以下是本章所有代码和说明的 GitHub 仓库：[`github.com/PacktPublishing/Django-in-Production/tree/main/Chapter09`](https://github.com/PacktPublishing/Django-in-Production/tree/main/Chapter09)。\n\
  \n重要说明\n\n\n\n\n\n在本章中，我们正在学习测试用例，并且我们将从上一章中编写/引用代码示例。由于我们涵盖的概念很多，不可能在本章中包含所有代码片段。为了更好地跟进，建议你参考保存在\
  \ GitHub 仓库中的代码示例。同时，欢迎通过 Discord 联系我以解答任何疑问：[`discord.gg/r7UDTKbgQw`](https://discord.gg/r7UDTKbgQw)。\n\
  \n# 在软件开发中介绍不同类型的测试\n\n我们所有开发者都喜欢编写代码并构建系统和应用程序。我们所有人都讨厌参加会议。开发者们讨厌的另一件事是*编写测试*。我们都经历过。当我开始我的职业生涯时，每当我的资深同事/导师要求我为代码编写测试用例时，我就会感到恐惧。为代码编写测试用例所需的时间几乎是构建该功能所需时间的两倍。\n\
  \n但*测试是必要的恶*，现在我是一名高级工程师，构建了数十个可扩展的系统，我总是更喜欢为我参与的任何项目编写测试。这给了我将代码部署到生产环境而不担心破坏现有系统的信心，并且有助于更快地交付功能。\n\
  \n当我们构建新功能时，我们总是手动测试代码。例如，如果我必须编写代码来判断一个数字是否为质数，我会编写代码，然后传递不同的值来测试它是否按预期工作。然后，假设需求更新了——我现在必须判断输入是否为质数且大于\
  \ 100。再次，我必须更新代码并通过输入不同的值手动测试我的逻辑。然后，需求再次更新——我必须找到一个大于 100 但小于 200 的质数。\n\n这在软件开发中并不罕见。随着我们开始构建系统，我们预计会收到更新的需求，并且我们必须确保我们的代码对之前的逻辑以及新逻辑都有效。我们刚刚看到了质数查找器的例子。想象一下，如果我们必须对像航班预订系统这样的大型应用程序做类似的事情。手动测试所有边界情况将是一场噩梦。这就是“自动化测试”概念发挥作用的地方。通过编写测试，我们可以确保我们的代码在所有用例中都能执行，并且我们的系统足够稳定。\n\
  \n编写单元测试的优势在项目成熟后会变得尤为突出。我在多个项目中亲身经历过。在最初的几个月里，功能开发和测试几乎是 1:1 的比例——例如，如果一名开发者花费一小时编写功能代码，他们可能需要花费同样一小时为代码编写测试用例。随着项目的增长，这一点保持一致，然后你会问的主要问题是，为什么要花费\
  \ 2 倍的时间，而团队可以在一半时间内完成同样的任务？答案在于那些不为代码编写测试用例的团队。在最初的几个月里，团队可以在一半时间内编写相同的功能，但随着项目的增长，交付功能所需的时间会呈指数级增长，因为他们必须手动测试所有用例，并且还会向生产环境引入更多\
  \ bug，这需要更多的生产代码回滚和更多的时间来调试问题。因此，编写测试用例的团队从长远来看是获胜者，具有更快的交付速度和更稳定的系统。\n\n软件开发中有多种类型的测试，例如**单元测试**、**集成测试**、**回归测试**、**安全测试**和**用户验收测试**。我们只讨论开发者应负责的主要自动化测试类型。\n\
  \n## 单元测试\n\n单元测试是一种测试方法，我们为代码的最小单元编写测试。单元测试应由开发者编写，并存储在与源代码相同的仓库中。这些是自动化测试，每当代码有更新时就会运行。例如，如果我们有一个博客应用程序，我们会为博客功能编写多个单元测试——我们为计算博客字数的函数编写单元测试。单元测试是测试的最小单元——每个方法/函数应只做一项任务，可以通过编写的单元测试轻松测试。如果你可以轻松编写单元测试，这意味着你的代码编写良好并且结构良好，拆分为更小的模块。如果无法正确编写单元测试，通常建议将应用程序代码重写为更小的解耦模块，因为定义良好的模块总是更容易编写单元测试。我们将在本章详细学习如何在\
  \ Django 中编写单元测试。\n\n## 集成测试\n\n集成测试是一种测试方法，我们测试系统的不同单元如何协同工作。它涉及端到端地测试系统的功能。例如，我们的集成测试会确保当我们将原始内容传递给函数或\
  \ API 时，可以将博客连同处理数据一起保存到我们的数据库中。集成测试是一个广泛的话题，你应该尽可能多地编写集成测试。决定开发者应在集成测试中覆盖哪些功能需要经验。\n\
  \n## E2E 测试\n\n**端到端** (**E2E**) 测试是一种测试方法，我们验证功能从开始到结束的工作情况。编写 E2E 测试用例有助于我们确保业务逻辑正确工作且系统正常运行。我们不会深入探讨如何编写\
  \ E2E 测试，但我们会让你探索编写它们的各种技术。你可以使用 Postman 编写 Postman 脚本来验证契约的 E2E 测试（[`learning.postman.com/docs/writing-scripts/test-scripts/`](https://learning.postman.com/docs/writing-scripts/test-scripts/)）。你也可以使用其他第三方工具，如\
  \ Playwright ([`playwright.dev/`](https://playwright.dev/)) 或 Puppeteer ([`pptr.dev/`](https://pptr.dev/))\
  \ 来编写 E2E 测试。\n\n现在，让我们深入探讨如何在 Django 项目中设置测试，并学习如何为我们的模块编写基本测试。\n\n# 为 Django 和\
  \ DRF 设置测试\n\n在本章中，我们将主要关注如何为 Django 和 DRF 项目编写单元测试和集成测试。在 Python 和 Django 社区中，长期以来一直存在关于以下哪个包更适合为项目编写测试的争论：\n\
  \n*   `unittest` ([`docs.djangoproject.com/en/stable/topics/testing/`](https://docs.djangoproject.com/en/stable/topics/testing/))\
  \ 与 Django 一起提供，并且也是 Python `unittest` 包的扩展\n*   `pytest-django` ([`pytest-django.readthedocs.io/en/latest/`](https://pytest-django.readthedocs.io/en/latest/))\
  \ 在内部使用 `pytest` 并提供大量抽象，处理编写测试的所有基本细微差别\n\n我们不会参与这场争论，让开发者根据自己的经验和偏好决定哪个包更好。我们将采取简单的方法，遵循\
  \ Django 官方文档的建议，使用默认的 Django `unittest` 来设置测试并学习它们。\n\n\n\n\n\n现在让我们开始在 Django\
  \ 中编写测试用例。Django 和 DRF 都使用 Python 的标准测试模块 `unittest`。在本书中，我们主要关注使用 DRF 为 Django\
  \ 应用编写 API；因此，在本节中，我们将重点关注为 DRF 编写的 API 编写测试用例。DRF 扩展了默认的 Django 测试用例类用于 API，并为我们提供了一个编写测试用例的接口。DRF\
  \ 的官方文档提到了所有可用的测试用例类（[`www.django-rest-framework.org/api-guide/testing/`](https://www.django-rest-framework.org/api-guide/testing/)）。让我们进行初始设置和配置。\n\
  \n## 结构化并命名我们的测试用例\n\n当我们在 Django 项目中创建一个 Django 应用时，Django 默认会在应用文件夹内创建一个 `tests.py`\
  \ 文件。我们不会使用 `tests.py` 文件来编写测试用例，因为在一个单一文件中编写一个应用的所有测试逻辑会很困难。相反，我们将删除此文件并在我们的 Django\
  \ 应用内创建一个名为 `tests` 的新包。在此 `tests` 包内，我们将创建包含所有测试用例的新文件，并且这些文件应以 `test` 关键字开头，例如\
  \ `test_api.py` 或 `test_public.py`，以便 Django `unittest` 框架可以自动检测测试文件。例如，在 *图 9**.1*\
  \ 中，我们可以看到如何将 `tests` 文件夹放置在 `author` 应用内，然后创建多个 `test_<>.py` 文件来包含所有相应的测试代码。我们在\
  \ `test_api.py` 中编写了 `api.py` 的测试，在 `test_public.py` 中编写了 `public.py` 的测试，以此类推。\n\
  \n![Figure 9.1: The file structure for tests in the Django app](img/B18867_09_01.jpg)\
  \ \n\n图 9.1：Django 应用中测试的文件结构\n\n重要提示\n\n我们应始终确保我们的测试文件以 `test` 开头；否则，Django `unittest`\
  \ 框架将无法自动检测测试用例。通常，开发人员会犯 *附加* `test` 而不是 *前缀* `test` 的错误。这样，开发人员会认为他们已经编写了测试并且测试已通过，但实际上，这些测试文件从未被\
  \ Django 检测到，并且其代码仍然没有测试用例。在本章的后半部分，我们讨论了如何编写自动化脚本来捕获这些问题。\n\n随着项目的成熟，测试用例会增长，拥有比原始代码大\
  \ 3x–4x 的测试用例是正常的；因此，我们也应进一步拆分测试文件。我们可以创建一个包并遵循相同的命名约定，即以 `test_<api>.py` 开头，如 *图\
  \ 9**.2* 所示。\n\n![Figure 9.2: An example of a test package, test_api](img/B18867_09_02.jpg)\
  \ \n\n图 9.2：一个测试包的示例，test_api\n\nDjango 的 `unittest` 将检测子文件夹中的所有测试并运行以 `test` 开头的测试文件。现在我们已经了解了如何创建测试文件并适当地命名它们，让我们探索设置数据库以编写测试用例。\n\
  \n## 为测试设置数据库\n\n在为 Django 应用编写大多数测试用例时，我们必须使用数据库。使用 SQLite 或类似数据库来实现更快的测试用例运行可能很诱人。然而，你应避免与生产环境有任何此类偏差，因为我们编写测试用例是为了在开发过程中尽早捕获任何问题。通过使用\
  \ SQLite 或类似数据库，我们可能会实现更快的测试执行，但我们的测试环境将与生产环境完全不同，我们可能会在生产中遇到数据完整性问题，而这些问题不会被我们的测试用例捕获。\n\
  \n对于所有需要数据库的测试，Django 会创建一个单独的数据库，并且不会使用用于常规请求的“真实”数据库。Django 创建的默认测试数据库将在 `settings.py`\
  \ 文件的 `DATABASES` 配置中提到的 `NAME` 值前加上 `test_`。\n\n然而，如果我们想为测试数据库添加特定名称，则可以通过在 `TEST`\
  \ 属性内添加 `NAME` 配置来实现：\n\n```\nDATABASES = {\n    \"default\": {\n        \"ENGINE\"\
  : \"django.db.backends.postgresql\",\n        \"USER\": \"mydatabaseuser\",\n  \
  \      \"NAME\": \"mydatabase\",\n        \"TEST\": {\n            \"NAME\": \"\
  mytestdatabase\",\n        },\n    },\n}\n```\n\n在命名测试数据库时，始终建议使用详细名称，以便工程师可以轻松找到数据库名称。默认情况下，每次运行测试后，Django\
  \ 将销毁在测试执行期间创建的数据库；无论测试是否通过或失败都会发生这种情况。如果我们想保留来自上一个测试用例的数据，应运行以下命令：\n\n```\npython\
  \ manage.py test --keepdb\n```\n\n这不是理想的方法，开发人员在添加 `keepdb` 标志时应谨慎，因为来自先前测试的数据现在存在于数据库中，并且可能会导致一些不可预测的行为。\n\
  \n重要提示\n\n注意 Django 需要在每次运行测试用例时创建和删除测试数据库。`settings.py` 文件中使用的 Postgres 连接详细信息应具有创建和删除数据库的权限。如果你使用的是\
  \ ElephantSQL，免费层不允许你创建多个数据库，并且在运行测试用例时你会遇到错误。要修复此问题，你可以使用本地 Postgres 设置或其他在线服务，例如\
  \ Neon（[`neon.tech`](https://neon.tech)）。有关使用 Neon's 详细信息，请查看 [`github.com/PacktPublishing/Django-in-Production/tree/main/Chapter09#setting-up-a-database-for-tests`](https://github.com/PacktPublishing/Django-in-Production/tree/main/Chapter09#setting-up-a-database-for-tests)\
  \ 处的说明。\n\n现在我们已经设置了数据库并了解了在哪里创建测试用例，让我们创建一个 DRF 中的基本测试用例。\n\n# 在 DRF 中编写基本测试\n\n\
  让我们为一个发送静态响应的 API 编写一个基本测试。首先，让我们有一个基本 API，它对 **GET** 请求返回 **\"hello world!\"**\
  \ 作为响应。将以下代码添加到 `blog/views.py` 文件中：\n\n```\nfrom rest_framework import status\n\
  from rest_framework.decorators import api_view\nfrom rest_framework.response import\
  \ Response\n@api_view(['GET'])\ndef basic_req(request):\n  if request.method ==\
  \ 'GET':\n    resp = {\"msg\": \"hello world!\"}\n    return Response(data=resp,\
  \ status=status.HTTP_200_OK)\n```\n\nURL 配置为 `/blog/hello-world/`，通过将以下代码添加到 `blog/urls.py`\
  \ 文件中：\n\n```\nurlpatterns = [\n    path(\"hello-world/\", views.basic_req),\n]\n\
  ```\n\n我们现在创建了一个基本 URL，它响应 **\"hello world\"** 响应。我们现在将编写一个测试用例来验证此 API 的响应。在以下示例中，我们将使用\
  \ DRF 的默认测试框架为我们的 API 编写测试：\n\n```\nfrom django.urls import reverse\nfrom rest_framework.test\
  \ import APITestCase\nfrom rest_framework import status\nclass BasicTests(APITestCase):\n\
  \  def test_basic_req(self):\n    \"\"\"\n    Test the basic url path response.\n\
  \    \"\"\"\n    #ARRANGE-Create a URL and expected response.\n    url = '/blog/hello-world/'\n\
  \    expected_data = {\"msg\": \"hello world!\"}\n    # ACT – Perform API call by\
  \ DRF's test APIClient.\n    response = self.client.get(url, format='json')\n  \
  \  # ASSERT- Verify the response.\n    self.assertEqual(response.status_code, status.HTTP_200_OK)\n\
  \    self.assertEqual(response.data, expected_data)\n```\n\n一旦我们编写了上述代码，我们就可以使用\
  \ Django 的管理命令执行测试。Django 将自动识别测试文件并执行它们：\n\n```\npython manage.py test\n```\n\n\
  运行上述命令将执行测试并显示测试用例结果。\n\n\n\n\n\n*我们不会深入讲解测试用例是如何运行的以及成功或失败的输出是什么样的，因为我们期望你已经了解\
  \ Python `test cases`*。\n\n在我们的示例中，我们遵循了最常用的测试模式之一，`Arrange-Act-Assert`：\n\n1. `Arrange`\
  \ 输入以及设置测试用例所需的一切。我们在 `arrange` 步骤中定义了 URL 和预期的响应数据。任何专门针对测试所需的数据或设置都应添加到测试用例顶部。我们首先设置\
  \ URL 并定义 `expected_data` 值。\n\n2. `Act` 于目标行为。在本节中，我们对实际应用程序代码做出适当的调用并将结果保存在每个变量中。对于我们的案例，我们使用\
  \ DRF 的 `APIClient` 测试接口向 `hello-world` 路径发出 API 调用。如果我们正在编写单元测试，则在 `act` 步骤中，我们调用函数并将返回值保存在变量中。\n\
  \n3. `Assert` 预期数据。在我们的 `act` 步骤中，我们捕获了目标 URL 的数据。现在，在此步骤中，我们验证我们的响应值是否与我们期望的相同。例如，我们\
  \ API 中期望的状态码为 `200`，响应数据消息应为 `hello world!`；我们在此步骤中验证 API 状态码和响应数据。\n\nDRF 的官方文档提供了更多针对不同\
  \ API 和用例编写测试用例的示例。阅读更多内容请访问 [`www.django-rest-framework.org/api-guide/testing`](https://www.django-rest-framework.org/api-guide/testing)。\n\
  \n让我们现在关注测试的高级实现。\n\n## 编写高级用例的测试\n\n应用程序代码绝不仅仅是一个向我们发送响应的基本 API；在现实生活中，我们的应用程序将具有各种复杂逻辑，我们将为许多高级主题编写代码。在本节中，我们将学习如何为诸如身份验证、模型、Celery\
  \ 和信号等高级用例编写测试用例。\n\n### 测试 API 身份验证\n\n大多数时候，我们创建的 API 都需要某种身份验证。当我们为 API 编写测试时，我们还需要确保我们的\
  \ API 测试身份验证和授权。DRF 的 `APIClient` 提供了不同的接口来测试身份验证：\n\n* `self.client.login(username=<string>,\
  \ password=<string>)`：这允许我们将测试客户端请求作为使用 `SessionAuthentication` 的常规登录请求进行身份验证。\n\
  \n* `self.client.credentials(HTTP_AUTHORIZATION=<header string>)`：这允许我们使用 HTTP 头对\
  \ `APIClient` 测试请求进行身份验证。我们在 *第 5 章* 中讨论了 DRF API 基于令牌的身份验证。现在，我们将通过一个示例来看如何为我们的\
  \ `APIClient` 测试编写使用 API 令牌的登录。在以下示例中，我们有 `test_unauthenticated_req`，它将向我们展示请求未登录时会发生什么。我们期望响应代码为\
  \ `401`。在 `test_authenticated_req` 中，我们使用 `self.client.credentials` 登录请求。这有助于我们断言\
  \ API 只有在头部通过正确的令牌进行身份验证时才会工作：\n\n```\nclass BasicTests2(APITestCase):\n  def test_unauthenticated_req(self):\n\
      url = '/blog/hello-world-2/'\n    response = self.client.get(url, format='json')\n\
      # Since user is not logged in it would get 401.\n    self.assertEqual(response.status_code,\
  \ status.HTTP_401_UNAUTHORIZED)\n  def test_authenticated_req(self):\n    url =\
  \ '/blog/hello-world-2/'\n    expected_data = {\"msg\": \"hello world!\"}\n    user\
  \ = User.objects.create_user( username='demouser', password='demopass')\n    token,\
  \ created = Token.objects.get_or_create(user ='demouser')\n    # Login the request\
  \ using the HTTP header token.\n    self.client.credentials(HTTP_AUTHORIZATION=\
  \ f'Token {token.key}')\n    response = self.client.get(url, format='json')\n    #\
  \ User is logged in we would get the expected 200 response code.\n    self.assertEqual(response.status_code,\
  \ status.HTTP_200_OK)\n    self.assertEqual(response.data, expected_data)\n  def\
  \ test_wrong_authenticated_req(self):\n    url = '/blog/hello-world-2/'\n    # Login\
  \ to the request using a random wrong token.\n    self.client.credentials(HTTP_AUTHORIZATION=\
  \ f'Token random')\n    response = self.client.get(url, format='json')\n    # Request\
  \ has wrong token so it would get 401.\n    self.assertEqual(response.status_code,\
  \ status.HTTP_401_UNAUTHORIZED)\n```\n\n为令牌验证添加测试失败和成功非常重要。在 `test_wrong_authenticated_req`\
  \ 中，我们验证我们的请求是否检查了正确的令牌以进行身份验证。通过添加随机令牌，我们会得到未认证的响应。这断言了我们的身份验证系统对给定 API 有效。\n\n\
  * `self.client.force_authenticate(user=<obj>, token=<obj>)`：当我们为具有复杂响应的 API 编写测试时，我们可能不想测试身份验证流程，而是强制身份验证请求。对于此类用例，DRF\
  \ 提供了 `force_authenticate` 接口。如果我们将 `user` 对象传递给 `force_authenticate` 方法，则 `user`\
  \ 对象会自动分配给 `request.user` 属性。在以下示例中，我们使用 `force_authenticate` 方法将 `a1` 用户登录到请求中，并且\
  \ `request.user` 对象将具有 `a1` 用户对象：\n\n```\ndef test_force_authenticate_with_user(self):\n\
      \"\"\"\n    Setting `.force_authenticate()` with a user forcibly authenticates.\n\
      \"\"\"\n    u1 = User.objects.create_user('a1', 'a1@abc.co')\n    url = '/blog/hello-world-2/'\n\
      # Forcefully login and update request.user\n    self.client.force_authenticate(user=u1)\n\
      response = self.client.get(url)\n    # Tests work with the login user.\n    self.assertEqual(response.status_code,\
  \ status.HTTP_200_OK)\n    self.assertEqual(response.data, expected_data)\n```\n\
  \n同样，我们可以传递 `token` 对象来更新相应的 `request.user`，或者我们可以同时传递 `user` 和 `token` 对象来更新 `request`\
  \ 对象属性。\n\n我们已经看到了 DRF 提供的三种不同方法来测试身份验证工作流程并使我们的测试请求成为已登录请求。始终记住至少编写一个测试来验证整个身份验证工作流程，并使用\
  \ `force_authenticate` 请求将请求标记为已登录。\n\n在为不同场景编写测试时，我们每次为已登录的 API 编写时都会使用 `force_authenticate`\
  \ 方法，这意味着我们必须一遍又一遍地重复相同的强制身份验证代码。为了解决这个问题，我们应该使用来自 `unittest.Testcase` 基类的 `setUp`\
  \ 方法。\n\n#### 设置和拆除测试用例\n\n每当我们为特定 API 编写测试用例时，可能需要执行相同的任务集来设置环境——例如，创建数据或登录用户。这样的任务应实现在\
  \ `setUp` 方法中。在以下示例中，我们在 `setUp` 中对客户端请求进行强制登录，因此每次从 `BasicTests` 类运行新测试时，`setUp`\
  \ 都会运行并登录请求；这有助于我们每次编写测试时都进行登录请求。同样，如果我们希望在每次执行测试后执行操作，可以使用 `tearDown` 方法。例如，如果我们希望在每次测试请求运行后注销用户，我们使用此方法：\n\
  \n\n\n\n\n```python\nclass BasicTests3(APITestCase):\n  def setUp(self):\n    self.url\
  \ = '/blog/hello-world/'\n    user = User.objects.create_user('a1', 'a1@abc.co')\n\
      self.client.force_authenticate(user=user)\n    print('Running Setup')\n  def\
  \ test_with_setup_authenticated_req(self):\n    print('test 1 running')\n    expected_data\
  \ = {\"msg\": \"hello world!\"}\n    response = self.client.get(self.url, format='json')\n\
      # User is logged in, expected 200 response code.\n    self.assertEqual(response.status_code,\
  \ status.HTTP_200_OK)\n    self.assertEqual(response.data, expected_data)\n    #\
  \ demo test\n  def test_demo(self):\n    print('test 2 running')\n    self.assertEqual(1,1)\n\
    def tearDown(self):\n    self.client.logout()\n    print('Running teardown')\n\
  ```\n\n在前面的示例中，我们添加了 `print` 语句来了解测试用例的执行顺序。我们可以看到 `setUp` 和 `tearDown` 各执行了两次，因为我们有两个测试用例。\n\
  \n在编写测试用例时，我们需要与不同的模型对象交互来编写更好的测试用例，并且创建具有外键关系的模型对象变得很棘手。此外，开发人员在创建数据库中的初始数据设置时经常遇到问题，这可以帮助他们为业务逻辑编写测试。为了解决这个问题，开发人员可能想要使用\
  \ fixtures；然而，在大规模情况下，fixtures 难以管理，因此我建议使用以下包作为 fixtures 的替代品，`factory_boy`（[`github.com/FactoryBoy/factory_boy`](https://github.com/FactoryBoy/factory_boy)）。\n\
  \n### 使用 factory_boy\n\n`factory_boy` 是一个 fixtures 替代品，可以轻松地在 Django 中创建复杂的 DB 对象。开发人员不再需要手动创建模型对象；他们可以专注于编写核心测试用例，让\
  \ `factory_boy` 在幕后创建所有所需的模型依赖项。`factory_boy` 包是 Python 中的一个通用模块，可以与不同的 Python 基于\
  \ ORM 协同工作。我们将主要关注使用 Django ORM 创建模型对象。\n\n让我们看一个如何创建具有外键关系的模型对象的示例。我们将定义两个模型工厂，`AuthorFactory`\
  \ 和 `BlogFactory`。它们直接链接到 `Meta` 类属性中定义的 Django 模型对象。请记住为每个类定义继承 `DjangoModelFactory`。我们将代码保存在\
  \ `factoryboy.py` 或任何其他相关文件名中，但一定要确保将所有 factory boy 定义代码放在单独的文件中，以便您可以清楚地将工厂代码与其它测试文件区分开来。这种文件分离也将使我们能够避免任何循环依赖问题，因为我们可能会使用\
  \ `SubFactory` 从不同应用调用其他 `factoryboy.py` 文件：\n\n```python\nfrom factory import SubFactory,\
  \ Sequence\nfrom factory.django import DjangoModelFactory\nfrom blog import models\
  \ as blog_models\nfrom author import models as author_models\nclass AuthorFactory(DjangoModelFactory):\n\
      class Meta:\n        model = author_models.Author\n    name = Sequence(lambda\
  \ n: f'Author {n}')\n    email = Sequence(lambda n: f'a{n}@gm.com')\nclass CoverImageFactory(DjangoModelFactory):\n\
      class Meta:\n        model = blog_models.CoverImage\n    image_link = Sequence(lambda\
  \ n: f'https://www.example.com/image/{n}')\nclass BlogFactory(DjangoModelFactory):\n\
      class Meta:\n        model = blog_models.Blog\n    title = Sequence(lambda n:\
  \ f'Blog {n}')\n    content = Sequence(lambda n: f'Blog content {n}')\n    author\
  \ = SubFactory(AuthorFactory)\n    cover_image = SubFactory(CoverImageFactory)\n\
  ```\n\n现在，我们将使用 `BlogFactory` 进行 API 测试：\n\n```python\nclass BlogTestCase4(APITestCase):\n\
      def test_total_blogs(self):\n        blogs = BlogFactory.create_batch(4)\n        url\
  \ = '/blog/unpaginated/'\n        resp = self.client.get(url, format='json')\n        self.assertEqual(len(resp.data['blogs']),\
  \ 4)\n```\n\n在我们的 `BlogTestCase` 中，我们使用 `BlogFactory` 创建了四个博客的批次。重要的是要理解 `factory_boy`\
  \ 会自动为每个对应的 `Blog` 创建依赖的 `Author` 和 `CoverImage` 对象。现在，开发人员可以专注于编写核心业务逻辑测试用例，而不必花费太多时间在开始编写核心测试用例之前创建数据库对象。\n\
  \n`factory_boy` 有很多可提供的内容，我们只是触及了它的冰山一角。探索官方文档以获得更深入的理解并查看不同的用例：[`factoryboy.readthedocs.io/en/stable/introduction.html`](https://factoryboy.readthedocs.io/en/stable/introduction.html)。\n\
  \n### 使用 setUpTestData\n\n使用 `factory_boy` 创建数据库对象是高效且推荐的。有可能我们需要为同一个 API 编写的多个测试创建相同的对象。诱人的是使用\
  \ `setUp` 方法来改进我们的代码质量。`setUp` 方法在每个测试用例之前运行，并且还会删除来自上一个测试用例创建的任何对象。`setUp` 方法为类的每个测试方法执行一次，这在我们有数千个测试用例时会造成性能下降。让我们看一个示例来理解这个问题；每次测试运行时，我们都会创建博客对象，然后在移动到下一个对象之前删除它：\n\
  \n```python\nclass BlogTestCase5(APITestCase):\n    def setUp(self):\n        self.blog\
  \ = BlogFactory(title='a1', content='a')\n        print('Running Setup multiple\
  \ times')\n    def test_word_count_1(self):\n        expected_count = 3\n        print('test_word_count_1\
  \ running')\n        self.assertEqual(expected_count, 3)\n    def test_title_length_1(self):\n\
          expected_length = 2\n        print('test_title_length_1 running')\n        self.assertEqual(expected_length,\
  \ 2)\n```\n\n这会使我们的测试用例在创建和删除博客条目上花费更长时间。通过添加 `print` 语句，我们可以验证 `setUp` 方法被调用了两次，因为我们有两个测试用例。\n\
  \n我们可以通过将所有通用数据创建代码移动到 `setUpTestData` 类方法来优化它：\n\n```python\nclass BlogTestCase6(APITestCase):\n\
      @classmethod\n    def setUpTestData(cls):\n        cls.blog = BlogFactory(title='a1',\
  \ content='a')\n        print('Running Setup only once')\n    def test_word_count_2(self):\n\
          expected_count = 3\n        print('test_word_count_2 running')\n        self.assertEqual(expected_count,\
  \ 3)\n    def test_title_length_2(self):\n        expected_length = 2\n        print('test_title_length_2\
  \ running')\n        self.assertEqual(expected_length, 2)\n```\n\n在我们的示例中，我们将博客对象创建移动到\
  \ `setUpTestData` 方法。通过这样做，我们在测试类实例化时只创建一次博客对象，并且博客对象存储在测试类实例中。我们的测试用例将以相同的方式运行——也就是说，在每次测试用例方法运行后，博客对象将被重置为之前的状态。在幕后，Django\
  \ 将为每次测试用例运行执行类级原子事务，并在测试用例执行后回滚，确保在每次测试用例运行后数据返回到原始状态。有关更多详细信息，您可以参考 Django 官方文档：[`docs.djangoproject.com/en/stable/topics/testing/tools/#django.test.TestCase.setUpTestData`](https://docs.djangoproject.com/en/stable/topics/testing/tools/#django.test.TestCase.setUpTestData)。\n\
  \n这种优化看起来像是微小的收益，但随着项目的成熟，这样的微小收益有助于 CI/CD 流水线运行得更快。\n\n在编写测试用例时使用 mocks 在行业中很常见，但强烈建议尽可能避免\
  \ mocking。让我们学习 mocking 的陷阱以及为什么我们应该避免使用 mocks。\n\n### 尽可能少使用 mocks\n\n\n\n\n\n\
  在编写测试用例时，你不可避免地会遇到模拟对象。`Mocking` 是测试领域最受欢迎的概念之一，开发者用它来编写单元/集成测试，随着应用程序逻辑/代码变得复杂，开发者倾向于在复杂的代码片段中使用模拟。\n\
  \n`Mock` 是 Python `unittest` 框架中的内置包。在构建 Web 应用程序时，我们会有复杂的逻辑或外部系统集成，或与应用程序不同部分交互的代码块。为此类代码块编写测试用例很困难，可能需要大量精力。使用\
  \ `mock`，我们可以将想要测试的系统的某些部分替换为模拟对象。当我们的代码与外部系统交互时，或我们的应用程序代码需要大量精力进行初始设置时，模拟是有益的。我们不会重点解释如何使用模拟，因为这是一个非常广泛的话题，我们需要单独一章来解释模拟的概念和用例。\n\
  \n阅读 Python `unittest` 官方文档中关于 Python 测试库中模拟概念的更多内容：[`docs.python.org/3/library/unittest.mock.html`](https://docs.python.org/3/library/unittest.mock.html)\n\
  \n### 主观想法\n\n经常，开发者倾向于追逐代码测试覆盖率指标，只是为了满足这些指标而编写测试。增加任何复杂代码覆盖率的最简单方法是通过编写会模拟复杂逻辑的单元测试；这会导致大量脆弱的测试或伪测试，从而放弃编写系统测试的原始用例。建议在编写测试用例时尽可能避免使用\
  \ `mock`，编写能够体现实际生产系统的实际测试。这样，你就不会仅仅为了数字而追逐覆盖率指标，测试代码覆盖率百分比代表了代码的真实状态。\n\n在现实生活中，在生产环境中，我们会看到\
  \ `mock` 的广泛使用。因此，建议开发者做出判断何时使用它，并深入理解模拟的根深蒂固的问题和概念，以便编写更好的代码。以下是一些我推荐给任何想要了解如何使用\
  \ mock 编写测试用例的人的资源：\n\n*   [`www.youtube.com/watch?v=ww1UsGZV8fQ`](https://www.youtube.com/watch?v=ww1UsGZV8fQ)：解释在编写测试时修补函数时幕后发生了什么\n\
  *   [`www.youtube.com/watch?v=rk-f3B-eMkI`](https://www.youtube.com/watch?v=rk-f3B-eMkI)：解释我们如何停止使用模拟，这可以帮助我们重新思考编写良好设计的应用程序代码的方式\n\
  *   [`www.youtube.com/watch?v=Ldlz4V-UCFw`](https://www.youtube.com/watch?v=Ldlz4V-UCFw)：解释在不过度使用模拟的情况下编写测试的不同方法\n\
  \n在下一节，让我们学习如何为我们的 Celery 应用程序编写测试用例。Celery 是我们 Django 应用程序不可或缺的一部分，因此始终建议为我们的 celery\
  \ 任务的业务逻辑编写测试用例。\n\n### 为 Celery 编写测试\n\n在 *第 8 章*，我们学习了如何使用 Celery 在 Django 中为长时间运行的代码块编写代码。Celery\
  \ 是业务用例不可或缺的一部分，因此我们应该有覆盖 Celery 任务的测试用例。Celery 任务只不过是一个普通的函数，具有额外的装饰器，将函数转换为 Celery\
  \ 任务。\n\nCelery 官方文档中有一个部分提到我们如何在 Celery 中编写任务：[`docs.celeryq.dev/en/stable/userguide/testing.html`](https://docs.celeryq.dev/en/stable/userguide/testing.html)。官方文档也建议不要对任何单元测试使用\
  \ `Eager mode`。然而，有时，使用 Eager 比官方文档建议的模拟 Celery 任务更好。因此，为 Celery 任务编写测试在很大程度上是一个选择，开发者需要在仔细考虑项目和专业知识后决定是否使用模拟或\
  \ Eager 模式。\n\n#### 主观想法\n\n由于 Celery 任务是常规任务，大多数时候我建议编写更多断言 Celery 任务业务逻辑的单元测试。为了测试任何任务的启动，我建议简单地模拟任务调用并验证模拟任务是否按预期行为被调用。\n\
  \n除了 Celery 任务之外，我们还学习了如何在 *第 7 章* 中使用 Django Signals 框架解耦我们的代码。在下一节中，我们将学习如何为 Django\
  \ 信号和接收器编写测试用例。\n\n### 为信号和接收器编写测试\n\n`Signals` 是 Django 提供的一个重要功能。Django 信号为我们提供了一个抽象层，这也是编写信号和接收器测试用例很棘手的主要原因。由于接收器是独立的函数，在任何信号上触发，因此很容易通过为\
  \ `receiver` 函数编写单元测试来为它们编写单元测试。\n\nDjango 文档中没有推荐的方法说明你应该如何测试信号。因此，不同的开发者找到了多种编写测试的方法。我通常用来测试接收器连接的一种方法是将我们想要测试的接收器函数断开连接，然后验证接收器是否已断开连接。这是什么意思？让我们举个例子，`my_handler`\
  \ 接收器连接到 `post_save` Django 模型信号。创建一个新文件 `author/receivers.py`，并添加以下代码：\n\n```\n\
  from django.db.models.signals import pre_save\nfrom django.dispatch import receiver\n\
  from author.models import Author\n@receiver(post_save, sender=MyModel)\ndef my_handler(sender,\
  \ **kwargs):\n    print('my handle receiver')\n```\n\n现在，我们想测试我们的接收器函数是否成功连接到 `Author`\
  \ 的 `post_save` 信号。我们将使用反转原则来测试此场景；接收器只有在连接到正确的信号时才能断开连接——用一个类比来说，你只能在灯泡打开时关闭灯泡。将以下代码添加到\
  \ `author/tests/tests_signals.py` 文件中：\n\n```\nclass SignalsTest(TestCase):\n    def\
  \ test_connection(self):\n        result = signals.post_save.disconnect(\n           receiver=my_handler,\
  \ sender=Author\n        )\n        self.assertTrue(result)\n```\n\n阅读有关 `disconnect`\
  \ 函数的更多信息，请参阅 Django 官方文档：[`docs.djangoproject.com/en/stable/topics/signals/#disconnecting-signals`](https://docs.djangoproject.com/en/stable/topics/signals/#disconnecting-signals)。\n\
  \n使用测试和信号的另一个重要概念是为测试用例停止 Django 信号。通过在测试用例期间在不需要时禁用信号，我们可以更快地运行测试用例。例如，如果我们编写了应用程序逻辑，其中创建\
  \ `User` 对象会自动触发模型信号，从而创建更多数据库条目并执行数据库操作。如果我们编写的单元测试不会测试或影响信号引起的逻辑更改，那么我们的测试将自动运行缓慢。\n\
  \n为了解决这个问题，我们可以使用 `factory_boy` 来静音与 Django 模型或任何额外信号相关的所有信号。我们可以使用上下文管理器与 `factory_boy`\
  \ 提供的 `mute_signals` 接口，以确保在我们创建新模型对象时不会触发任何信号：\n\n```\nfrom factory.django import\
  \ mute_signals\nclass SignalsTest(TestCase):\n    def test_demo(self):\n        with\
  \ mute_signals(signals.pre_save, signals.post_save):\n            # pre_save/post_save\
  \ won't be called here.\n            return SomeFactory(), SomeOtherFactory()\n\
  ```\n\n\n\n\n阅读更多关于如何使用 `factory_boy` 来静默信号并加快测试执行的内容：[`factoryboy.readthedocs.io/en/stable/orms.html#factory.django.mute_signals`](https://factoryboy.readthedocs.io/en/stable/orms.html#factory.django.mute_signals)。\n\
  \n我们已经学习了如何编写测试用例以及如何测试 Django 的不同功能。现在，我们将学习测试的一个高级特性，Django 运行器。Django 运行器是开发者可以用来设置测试数据库或自定义测试的高级功能。\n\
  \n## 使用 Django 运行器\n\n当我们执行 Django 管理命令来运行测试时，`python manage.py test`，Django 内部会找到运行测试的配置。此配置存在于\
  \ Django 测试运行器中，即 `DiscoverRunner` 类。就像其他任何 Django 接口一样，`DiscoverRunner` 也可以根据需求进行扩展。\n\
  \n让我们在本节中扩展默认的 `DiscoverRunner`，这应该有助于开发者处理任何自定义用例。让我们想象一下，我们希望在执行任何测试用例之前向数据库中添加数据，然后我们可以使用\
  \ `DiscoverRunner` 来加载我们的数据。我们可以创建一个新类——例如 `FillData` 类，它有一个 `setup_databases` 方法，用于填充测试用例所需的数据。然后，创建一个\
  \ `CustomRunner` 类，该类继承两个类，`FillData` 和 Django 的默认运行器 `DiscoverRunner`：\n\n```\n\
  from django.test.runner import DiscoverRunner\nclass FillData:\n    def setup_databases(self,\
  \ *args, **kwargs):\n        temp = super(FillData, self).setup_databases(*args,\
  \ **kwargs)\n        print(\"### Populating Test Cases Database ###\")\n       \
  \ # Create any data\n        print(\"### Database populated ############\")\n  \
  \      return temp\nclass CustomRunner(FillData, DiscoverRunner):\n    pass\n```\n\
  \n一旦我们创建了 `CustomRunner` 类，我们需要将其保存在给定文件中——例如，`myblog/backend/common/custom_runner.py`。现在，我们需要告诉\
  \ Django 每次测试用例配置时都使用我们的 `CustomRunner`。为此，我们需要在设置文件中设置 `TEST_RUNNER` 标志：\n\n```\n\
  TEST_RUNNER = 'common.custom_runner.CustomRunner'\n```\n\n现在，每次我们运行测试管理命令时，Django\
  \ 都会从我们定义的 `CustomRunner` 类中获取测试配置。为了验证集成，我们可以运行 `python manage.py test`，我们将看到输出，其中包含我们添加到\
  \ `CustomRunner` 中的 `print` 语句。\n\n注意\n\n我们分享的 `CustomRunner` 示例是一个高级用例，我们希望你对 MRO\
  \ 和 Python 多重继承的其他高级概念有良好的理解。\n\n以下是开发者可以为 Django 自定义测试运行器配置的几个自定义用例：\n\n*   配置\
  \ `parallel` 以便 Django 可以并行运行测试\n*   使用 `test_name_patterns` 配置测试名称模式以便高效运行测试\n\
  *   设置 `tags` 和 `exclude_tags` 以将不同测试分组在一起\n*   `failfast` 在任何一个测试用例失败时立即停止测试用例的执行\n\
  \nDjango 提供了创建自定义运行器的很大灵活性；然而，并非所有自定义都通常被开发者使用。创建自定义运行器超出了本书的范围，我们留给你去探索官方文档以获得更多理解。阅读官方\
  \ Django 文档中的更多内容：[`docs.djangoproject.com/en/stable/topics/testing/advanced/#defining-a-test-runner`](https://docs.djangoproject.com/en/stable/topics/testing/advanced/#defining-a-test-runner)。\n\
  \n现在我们已经涵盖了在 Django 中编写测试的所有用例，让我们继续下一节，我们将在其中介绍编写测试用例的最佳实践。\n\n# 学习编写测试的最佳实践\n\n\
  到目前为止，我们已经探索了编写测试用例的所有优势，以及如何为不同的 Django 组件编写它们。在本节中，我们将学习编写测试用例的最佳实践。\n\n## 更频繁地使用单元测试\n\
  \n编写测试用例总是很棘手，很难为所有场景编写测试用例。随着应用程序变得复杂，开发者可能无法编写测试用例来覆盖所有场景，因此解决此问题的最佳方法是编写尽可能多的单元测试。每当我们编写新的业务逻辑时，我们通常会添加小的函数/方法，这些函数/方法将具有新的/更新的业务逻辑，因此为此类函数编写单元测试有助于增加覆盖率。如果我们编写了模块化的代码，那么为我们的应用程序编写单元测试就很容易了，这是开发者需要理解的事情——*只有当应用程序代码不模块化且\
  \ `结构不良` 时，编写测试用例才困难*。\n\n现在问题来了，什么时候以及写多少 *集成测试*？答案是，*取决于情况*。对于更复杂的业务应用程序，最好通过集成测试覆盖\
  \ 90% 的成功场景和 30% 的失败场景。对于非关键系统，拥有较少的集成测试也可行，但我们应该有几个成功和失败场景的集成测试。\n\n## 避免定时炸弹测试失败\n\
  \n定时炸弹测试是开发者常犯的最新手错误之一。编写测试用例时，开发者可能会将当前日期时间硬编码为预期日期时间，或编写不考虑时区的逻辑。这会在午夜或一天/一夜的特定时间导致测试用例失败。\n\
  \n有一个流行的库，`Freezegun`（[`github.com/spulec/freezegun`](https://github.com/spulec/freezegun)），可以帮助我们高效地模拟日期时间，以避免任何基于时间的测试用例失败。让我们看一个例子，我们不希望用户在我们的博客应用程序中发送垃圾邮件，因此你希望将用户每天发布博客的数量限制为\
  \ 10 条。我们需要为此类场景编写测试用例，在其中我们可以模拟任何尝试获取日期时间的函数。Freezegun 可以帮助我们在装饰器或上下文管理器范围内自动模拟任何日期时间。在以下代码中，我们模拟了名为\
  \ `today` 的日期时间，然后将其更改为下一天。这有助于我们以更清晰的方式编写测试用例：\n\n```\nfrom django.utils import\
  \ timezone\nfrom freezegun import freeze_time\nfrom blog.factoryboy import BlogFactory,\
  \ AuthorFactory\nfrom blog import public\nclass BlogTests7(APITestCase):\n    def\
  \ test_blog_time_block(self):\n        today = timezone.now().date()\n        tomo\
  \ = timezone.now().date() + timezone.timedelta(days=1)\n        with freeze_time(today)\
  \ as frozentime:\n            # Post 10 blogs\n            author = AuthorFactory()\n\
  \            create_10_blogs = BlogFactory.create_batch(10, author=author)\n   \
  \         # Check if the user can post more blogs today\n            user_can_post\
  \ = public.check_if_allowed_to_publish_blog(author)\n            # Validate that\
  \ the user cannot post a blog today.\n            self.assertFalse(user_can_post)\n\
  \            # Move the date to the next day\n            frozentime.move_to(tomo)\n\
  \            # Validate that the user cannot post a blog tomorrow.\n           \
  \ result = public.check_if_allowed_to_publish_blog(author)\n            self.assertTrue(result)\n\
  ```\n\n模拟日期时间是最棘手的场景之一，但 `freezetime` 使其变得简单得多。\n\n## 避免脆弱的测试\n\n\n\n\n\n# 编写可维护的测试\n\
  \n在为应用程序代码编写测试时，我们会遇到这样的场景：应用程序代码逻辑的任何更新都会破坏单元/集成测试。这是不可避免的，这也是一个好迹象，说明你编写了良好的测试用例，当代码的预期行为发生变化时测试会失败，从而使测试用例失败。然而，随着项目的成熟，这会成为瓶颈，有时我们可能会发现更新应用程序代码只需要一个小时，但修复测试用例可能需要整整一天。这时你需要退一步重新评估你的测试用例以及开发者如何编写测试用例。没有银弹可以修复这个问题，避免编写脆弱的测试需要经验。然而，有一些指导原则可以帮助你改进：\n\
  \n* **编写更多单元测试**：通过编写更多检查核心业务逻辑的单元测试，开发者将能够轻松识别失败的测试用例及其原因。这将帮助他们更快地修复。\n* **使用动态数据**：使用动态数据有助于使测试用例更灵活。例如，使用\
  \ `factory_boy` 从返回值断言模型对象始终是首选。*请记住，测试的动态数据是一把双刃剑，如果没有适当实现，它会造成很多损害*。\n* **避免业务逻辑耦合**：我们应该编写仅测试函数/方法输出的测试；如果你开始测试实现细节和业务逻辑，那么即使输出契约保持一致，你的测试也注定会在每次业务逻辑更新时失败。\n\
  * **创建小型测试用例**：添加检查函数/方法的多个用例的测试用例很诱人，但这会导致无法识别哪个测试用例失败的问题，并且需要太多更新来识别和解决失败的测试用例。\n\
  \n这些是主观观点，应仅作为建议/指导使用；每个开发者对其系统有更好的了解，应该做出更好的判断来改进编写更好的测试。\n\n## 在测试中使用反向函数进行 URL\
  \ 路径\n\n在 Django/DRF 中编写测试时，我们必须使用 URL 来访问我们的视图和 API。直接使用定义的 URL 可能很诱人，但建议使用 `django.urls`\
  \ 包中的 `reverse` 函数来拥有能够管理 URL 路径任何更新的健壮测试用例。`reverse` 函数负责创建动态 URL，这可以帮助你专注于编写业务逻辑测试用例，而不必担心创建\
  \ URL。这也是一把双刃剑，如果为遗留代码更新 URL 路径可能会导致失败，但此类更改应在代码到达生产环境之前在代码审查期间被标记。\n\n## 使用身份验证测试\n\
  \n你可以在 DRF/Django 中的任何 API 轻松添加身份验证；同样，任何开发者都可以轻松地从 API 中移除身份验证，因此强烈建议为每个 API 编写身份验证验证测试用例。我们之前讨论过如何在\
  \ *Testing API authentication* 部分为身份验证编写测试用例。务必确保编写至少一个测试来验证 API 的 *基于令牌* 或其他任何身份验证系统。例如，编写一个测试将利用\
  \ `self.client.credentials` 方法进行登录请求。\n\n## 使用测试标签对测试进行分组\n\n随着项目的成熟，我们将拥有快速、慢速、核心或某些不同类型的测试用例。可能无法在本地或开发阶段运行所有测试，因此我们可能希望对测试进行分组以执行/跳过它们。我们可以将不同的测试用例分组到不同的段中，并根据需要运行它们。Django\
  \ 提供了一个简单的装饰器接口，可以帮助我们将类似的测试用例标记为一组。例如，在以下代码中，我们将 `SampleTestCase` 中的不同测试标记为 `fast`、`slow`\
  \ 或 `core`。这可以帮助我们一起执行所有 `core` 测试用例或 `fast` 测试用例。将以下代码添加到 `blog/tests.py` 文件中：\n\
  \n```\nfrom django.test import tag\nfrom rest_framework.test import APITestCase\n\
  class BlogTests8(APITestCase):\n    @tag(\"fast\")\n    def test_fast(self):\n \
  \       print(\"fast test running\")\n    @tag(\"slow\")\n    def test_slow(self):\n\
  \        print(\"slow test running\")\n    @tag(\"slow\", \"core\")\n    def test_slow_but_core(self):\n\
  \        print(\"slow but core test running\")\n```\n\n要运行特定组的标记测试用例，我们可以使用以下命令：\n\
  \n```\npython manage.py test --tag=core\n```\n\n此命令将只运行所有标记为 `core` 标签的测试用例——在我们的例子中是\
  \ `test_slow_but_core`。有关如何高效使用测试用例的 `tag` 概念的更多详细信息，请查看 Django 的官方文档：[`docs.djangoproject.com/en/stable/topics/testing/tools/#tagging-tests`](https://docs.djangoproject.com/en/stable/topics/testing/tools/#tagging-tests)。\n\
  \n## 使用 Postman 创建集成测试套件\n\nPostman 是一个验证 API 契约的绝佳工具。然而，很少有开发者利用 Postman 测试脚本的强大功能来编写\
  \ E2E 测试。我们可以编写 E2E 测试来验证每个 API 的契约。这可以通过编写测试脚本来实现。一旦我们有了测试脚本，我们就可以编写监控器来持续测试结果。这样，我们可以在任何预生产环境中设置\
  \ E2E 测试设置，并在任何测试失败时收到通知。以下是一些可以帮助你开始编写 Postman E2E 测试的重要链接：\n\n* 如何在 Postman 中编写测试脚本：[`learning.postman.com/docs/writing-scripts/script-references/test-examples/`](https://learning.postman.com/docs/writing-scripts/script-references/test-examples/)\n\
  * 如何创建监视器以定期检查测试是否通过：[`learning.postman.com/docs/monitoring-your-api/intro-monitors/`](https://learning.postman.com/docs/monitoring-your-api/intro-monitors/)\n\
  * 如何使用 Postman CLI 从 CI/CD 流水线运行测试用例：[`learning.postman.com/docs/postman-cli/postman-cli-overview/`](https://learning.postman.com/docs/postman-cli/postman-cli-overview/)\n\
  \n编写 Postman 测试脚本并通过 Postman 监控器定期运行它们，是为你的 API 设置任何测试套件的最简单、最快的方法之一。你也可以使用市场上可用的任何其他工具来实现此目的——例如，Insomnia\
  \ 提供了这样的测试界面（[`docs.insomnia.rest/insomnia/unit-testing`](https://docs.insomnia.rest/insomnia/unit-testing)）。\n\
  \n## 创建不同类型的测试\n\n为应用程序代码编写测试是开发项目的一部分，团队应始终计算编写测试用例所需的时间，然后提供项目的最终估算。除了编写单元测试和集成测试外，我们还应编写一些系统级测试，以帮助维护代码质量和系统的良好健康状况：\n\
  \n* **覆盖率阈值**：我们应为每个 `Pull Request` (`PR`) 设置代码覆盖率阈值。每当提出的 `PR` 降低整体覆盖率时，我们应将 CI\
  \ 流水线标记为失败的测试。\n\n\n\n\n\n## 包文件测试\n第三方包在生产环境中被广泛使用，我们应该清楚地知道哪些代码会被部署到生产环境。当开发者向仓库添加某个特定包时，他们会在将代码移至生产环境之前对该包及其\
  \ API 进行大量测试。包的测试始终基于当时可用的包版本，但如果包被更新，那么代码很可能以某种意想不到的方式运行。为了避免这种情况，建议始终编写测试来检查 `requirements.txt`\
  \ 文件中添加的 Python 包是否具有特定版本。\n\n## 静态检查测试\n自动静态检查是您应该添加到项目中的最重要的设置之一。静态检查应使用 `githooks`\
  \ 配置，例如 `commit` 和 `push`。本地 `githook` 也可能损坏，或者开发者在本地绕过了静态检查测试。为了避免此类情况，我们应在 CI\
  \ 流水线中设置静态检查测试，以便在静态检查测试失败时失败。对于静态检查，我们可以添加 `flake8`（[`pypi.org/project/flake8/`](https://pypi.org/project/flake8/)）和\
  \ `black`（[`pypi.org/project/black/`](https://pypi.org/project/black/)）。在 *第 12\
  \ 章* 中，我们将详细讨论它们的集成。\n\n## 迁移文件测试\n迁移是 Django 最受欢迎的功能之一，它负责所有与数据库相关的更改。很容易直接从应用程序代码执行任何与数据库相关的更改。在\
  \ *第 2 章* 中，我们学习到始终编写向后兼容的迁移。为了增强这一实践，我们应添加测试来检查任何执行销毁操作的迁移更改。例如，我们应有测试在出现包含 `drop\
  \ table` 命令或任何其他销毁命令的新迁移文件时失败。这样，就不会有任何意外的破坏性操作在未经人工干预的情况下进入生产环境。\n\n## 验证测试文件名\n\
  Django/Python 会自动从文件名模式检测所有测试用例——即以 `test` 开头的文件。然而，开发者可能在文件名中出现拼写错误，或将 `test` 关键字添加到文件名的末尾。在这种情况下，框架将无法检测到测试，并且测试不会自动执行。因此，我们应编写一个测试来检测所有文件名不匹配的情况。\n\
  \n这些系统级测试是使用 `githooks` 和 `CI pipelines` 添加的，我们将在 *第 12 章* 中更详细地讨论它们。\n\n## 避免测试\n\
  \n什么时候应该避免测试？虽然始终最好为每个项目添加测试，但我们都知道不可能总是编写测试用例。即使在实时紧张的情况下，我仍然建议编写一些基本的集成测试用例，以对项目提供一定的验证和信心。\n\
  \n以下是您可以决定跳过编写测试用例的几个场景，尽管这些是主观的：\n\n* **业余项目**：如果您正在做业余项目，并且确定项目不会被扩展。然而，请注意，许多业余项目已成为价值数十亿美元的公司。\n\
  * **拥有简单用例的独立开发者**：如果您是简单项目的独立开发者，该项目仅执行 CRUD 操作或非常小的功能，那么您可以避免编写测试。\n* **概念验证项目**：概念验证项目生命周期短，处于探索阶段；它们可以避免测试用例，因为项目可以轻松\
  \ pivot。\n\n大多数开发者在应用程序代码完成后才编写测试用例，而在初创公司的时间关键阶段，我们可能会在未编写测试用例的情况下将代码推送到生产环境。避免测试用例可能很诱人，但绝不应该被鼓励。\n\
  \n有一种开发流程强调先编写测试用例，然后再编写应用程序。让我们在下一节中了解更多关于 `test-driven development`（`TDD`）的内容。\n\
  \n# 探索测试驱动开发\n\nTDD 是一种开发流程，我们首先编写会失败的测试，然后编写应用程序代码，使所有失败的测试通过。这有助于我们编写更小的代码块，并对每个函数/方法应提供什么输出有一个明确的契约。TDD\
  \ 是一种思维方式，新开发者可能需要一些指导才能转变到这种思维模式。\n\n我们不会深入探讨 TDD 的细节；有一门课程详细探讨了这一点：[`www.packtpub.com/product/hands-on-test-driven-development-with-python-video/9781789138313`](https://www.packtpub.com/product/hands-on-test-driven-development-with-python-video/9781789138313)。\n\
  \n至此，我们已涵盖与在 Django/DRF 中编写测试相关的所有主题。\n\n# 总结\n\n在本章中，我们学习了不同的测试技术以及测试为开发周期和生产稳定性带来的价值。我们探讨了如何在\
  \ DRF 中设置测试并为不同场景编写测试用例。我们学习了如何使用第三方包如 `factory_boy` 来改善编写测试的开发者体验。\n\n我们看到了一些最佳实践和建议，以改善开发周期中的测试用例。Postman\
  \ 作为工具在编写测试以监控契约方面非常有帮助；我们学习了如何使用 Postman 功能为我们的 API 编写集成测试。\n\n在 *第 10 章* 中，我们将讨论在\
  \ Django 和 DRF 中开发应用程序时可以遵循的最佳实践/约定。约定和良好实践大多是主观的，来自多年编写生产级代码的经验。我将在下一章中分享我在不同 Django\
  \ 项目中工作时学到的观点和经验教训。\n\n我特别想感谢 *Adam Johnson* 编写了精彩的书籍 *Speed Up Your Django Tests*，它启发我在本章中涵盖了一些关于测试的额外主题。\n\
  \n# 10\n"
- "# 探索 Django 中的约定\n\n在之前的章节中，我们学习了 Django 的不同功能，以及如何利用这些功能构建可扩展的 Django 应用程序。Django\
  \ 被认为是有主见的；它没有给开发者太多灵活性。具有主见性导致了 Django 与开发者社区之间爱恨交织的关系，其中许多开发者喜欢 Django 有特定的实现方式，开发者不必过多思考如何使用\
  \ Django 构建 Web 服务。然而，许多开发者不喜欢 Django，因为缺乏灵活性和对代码编写方式的过于严格。\n\n在本章中，我们将学习在与 Django\
  \ 协作时可以遵循的某些约定。您应该注意，本章包含大量我在从事众多 Django 项目和为不同公司提供咨询时学到的有主见的概念。\n\n让我们看看本章将涵盖的主要主题：\n\
  \n* Django 项目的代码结构\n* 处理异常和错误\n* 使用功能标志\n* 配置 Django 部署到生产环境\n\n# 技术要求\n\n我们将学习迄今为止本书中涵盖的不同\
  \ Django 主题的约定。您应熟练掌握前面章节中解释的所有主题。\n\n以下是本章所有代码和说明的 GitHub 仓库：[`github.com/PacktPublishing/Django-in-Production/tree/main/Chapter10`](https://github.com/PacktPublishing/Django-in-Production/tree/main/Chapter10)。\n\
  \n# Django 项目的代码结构\n\n\n\n\n\n当我们在 Django 中启动一个新项目时，Django 管理命令会创建创建 Django 项目所需的基本文件。在\
  \ 第 1 章 中，我们学习了如何设置我们的 Django 项目并创建不同的 Django 应用。在本节中，我们将汇总我们在前几章中收集到的关于在 Django\
  \ 中为不同目的使用不同文件的所有信息。\n\n## 按功能创建文件\n\n作为第一次分叉的第一步，我们已经了解到，我们应该在 Django 项目中创建多个 Django\
  \ 应用。Django 应用的拆分取决于业务逻辑功能；例如，我们的博客项目可以有 `blog` 和 `author` 作为两个不同的 Django 应用。在每个应用内部，我们会将代码拆分到多个文件中。以下是我们在\
  \ Django 工作时应考虑的文件推荐列表：\n\n* `urls.py`: 每个 Django 应用都应有一个 `urls.py` 文件，其中包含该应用的所有路由逻辑。\n\
  * `api.py`: 我们应该在 `api.py` 文件中添加所有 API 的定义并将其链接到 `urls.py`。许多开发者也使用 `views.py` 来实现相同目的。\n\
  * `constants.py`: 我们应该使用 `constants.py` 文件来添加 Django 应用中使用的所有常量。\n* `models.py`:\
  \ 我们应该将所有数据库表定义放在 `models.py` 文件中。Django 已经强制要求对任何数据库定义相关代码使用 `models.py` 文件。\n\
  * `serializers.py`: 将所有 DRF 序列化器逻辑添加到 `serializers.py` 文件中。避免在模型文件中添加序列化器逻辑以保持关注点分离。\n\
  * `common.py`: 很多时候，我们可能会在同一个 Django 应用中看到逻辑的重复。最好创建一个 `common.py` 文件，其中包含应用使用的所有通用逻辑。\n\
  * `utils.py`: 在构建应用时，我们会编写很多实用函数来执行某些操作。例如，如果我们想从文章中修剪空白，我们就会为此目的创建一个 `util` 函数并将其放在\
  \ `utils.py` 文件中以便重用。`common.py` 和 `utils.py` 的主要区别在于 `common.py` 可以依赖于其他文件，例如 `models.py`，但\
  \ `utils.py` 不应依赖于其他文件。\n* `public.py`: 随着项目的成熟，我们会观察到不同 Django 应用之间的相互依赖。保持文件层次结构对于获得流畅的开发者体验非常重要。我们应该将所有需要被其他\
  \ Django 应用访问的函数和类保存在 `public.py` 文件中。\n* `_private.py`: 我们应该将只能由内部 Django 应用访问的代码保存在\
  \ `_private.py` 文件中。`public.py` 和 `_private.py` 文件的主要区别在于 public 文件的函数可以被任何其他 Django\
  \ 应用访问，而 private 函数只能被同一个 Django 应用中的文件访问。Public 函数可以在内部调用 private 函数，并且它们可以对 private\
  \ 函数进行包装以将其暴露给另一个 Django 应用。\n* `tasks.py`: 我们在 第 8 章 中学习了如何使用 Celery。正如该章所述，我们应该将所有\
  \ Celery 任务代码放在 `tasks.py` 文件中。\n* `signals.py`: 将所有自定义 Django 信号定义添加到 `signals.py`\
  \ 文件中。\n* `receivers.py`: 将所有 Django receiver 相关代码添加到 `receivers.py` 文件中。\n* `admin.py`:\
  \ 开箱即用，Django 提供了非常有用的 admin 界面。所有与 Django admin 相关的代码都应放在 `admin.py` 文件中。\n* `tests`:\
  \ 在 第 9 章 中，我们看到了如何利用 `factoryboy` 和 `tests` 文件在 Django 中编写测试。所有测试都应放在 `tests` 文件夹中。\n\
  \n我们讨论了 Django 应用内部使用的不同类型的文件。并非必须从一开始就创建所有这些文件，但将其视为构建大型可维护 Django 应用的参考。\n\n随着项目的成熟，即使有了前面列表中提到的单独文件，你也会发现维护代码变得困难。当这种情况发生时，你应该决定是否将\
  \ Django 应用拆分为更小的子应用，或将单个文件拆分为模块。例如，如果你的 `public.py` 文件有 500 多行，那么你应该考虑将文件转换为模块，通过创建\
  \ `public` 文件夹然后向其中添加 `__init__.py`。一旦将文件转换为模块，你就可以开始将 `public.py` 文件的逻辑拆分为多个更小的文件。这可以应用于本节中提到的任何文件。\n\
  \n注意\n\n根据我在业界的经验，我学到要遵循 500 行规则：如果任何文件包含超过 500 行代码，建议将文件转换为模块并将逻辑拆分为多个更小的文件。\n\n\
  在下一节中，我们将学习如何避免循环依赖以及不同文件如何帮助我们更好地规划代码结构。\n\n## 避免循环依赖\n\n随着项目的增长，循环依赖不可避免。没有单一的保证方法可以避免循环依赖。Python\
  \ 会自动提示我们代码的某个部分存在循环导入错误。以下是 Python 抛出的循环导入错误示例：\n\n```\nImportError: cannot import\
  \ name '<name>' from partially initialized module '<module>' (most likely due to\
  \ a circular import)\n```\n\n但我们可以遵循某些准则来避免这一常见问题：\n\n* 切勿从不同应用导入模型。如果需要，使用 `public.py`\
  \ 文件接口来导入不同应用的模型。这也有助于抽象出不同应用的实现细节。例如，如果在以后对表进行了任何修改，那么我们就不必更新其他 Django 应用的代码；相反，我们需要保证\
  \ `public.py` 接口的契约。\n* 始终尝试通过分派信号和使用接收器在两个 Django 应用之间进行通信。这有助于避免直接导入其他应用代码。\n\
  * 如果我们仍然遇到循环导入，最简单的解决方案是将罪魁祸首文件拆分为两个不同的部分，并确保它们不会直接相互调用。\n\n循环依赖是一个难以解决的问题，而且大多数时候需要定制的方法来解决它。本节中我们学到的概念只是一个大纲，可以帮助你在规划代码时遵循风格指南并更好地构建它。\n\
  \n## 创建一个“common”应用\n\n我们将创建一个名为 `common` 的 Django 应用。该应用将包含可在整个项目中使用的所有通用代码。例如，如果我们有一个用于保存简单配置的通用模型，那么我们应该将给定的应用添加到\
  \ `common` 应用中。`common` 应用可以被任何其他 Django 应用导入，但它永远不应导入任何其他 Django 应用。\n\n例如，如果我们需要创建一个可被多个\
  \ Django 应用用于获取配置的简单 *键值存储表*，我们可以将键值存储创建在 `common` 应用中。\n\n以下是我在不同 Django 项目中在 `common`\
  \ 应用中使用的功能列表：\n\n* 存放所有通用自定义异常类，以便其他 Django 应用可以使用它们。\n* 包含项目中通用的自定义分页类。\n\n\n\n\
  \n\n*   添加通用的日志函数，使所有日志都通过同一个函数传递。这有助于在大规模下维护日志，同时也具有灵活更新日志实现而不破坏现有系统的能力。\n\n* \
  \  创建自定义中间件。\n\n*   持有基础模型类。例如，每个模型都应具有 `created_at` 和 `updated_at` 字段。创建一个基础模型并将其放在\
  \ `common` 应用中，以便所有 Django 应用模型都继承自该基础模型类。\n\n*   使用基础 admin 和自定义 admin 混入。\n\n\
  尽管 `common` 应用非常有帮助，有助于我们遵循 `Don't Repeat Yourself` (`DRY`) 原则，但我们也应注意将什么代码放入 `Common`\
  \ 应用模块。随着项目的扩展，重新审视 `common` 应用并决定是否创建单独的应用并将所有代码逻辑移至其中可能是一个好主意。\n\n现在，让我们学习如何使用\
  \ Django 设置来设置不同的环境。\n\n## 为生产环境使用设置文件\n\n当我们创建一个新的 Django 项目时，Django 管理命令会创建一个\
  \ `settings.py` 文件，其中包含所有 Django 配置。但随着项目的增长，我们将为不同的环境，例如 `local`、`dev`、`stage`\
  \ 和 `prod`，拥有不同的配置。我们应该开始为不同的环境维护不同的文件。\n\n解决此问题的推荐方法是创建以下文件结构：\n\n*   `settings/base.py`：此文件将包含适用于所有环境的通用\
  \ Django 设置，例如 `INSTALLED_APPS`。\n\n*   `settings/local.py`：这将包含运行本地开发的 Django 的所有配置。我们需要将\
  \ `base.py` 文件中的所有设置导入到 `local.py` 中。\n\n*   `settings/prod.py`：这将包含在生产环境中运行 Django\
  \ 的所有配置。同样，我们将从 `base.py` 文件导入所有设置。\n\n我们可以根据需要创建多个设置文件。现在我们已将设置文件拆分为多个文件，我们需要告诉\
  \ Django 选择合适的设置。有多种方法可以配置 Django 服务器以选择设置文件：\n\n*   使用 `DJANGO_SETTINGS_MODULE`。我们可以从命令行将设置文件路径设置为环境变量。例如，对于\
  \ Unix，我们将使用以下命令：\n\n```\nexport DJANGO_SETTINGS_MODULE=config.settings.local\n\
  ```\n\n*   使用 `--settings` 标志传递设置文件，同时使用以下 Django 管理命令启动服务器：\n\n```\npython manage.py\
  \ runserver --settings=config.settings.local\n```\n\n我们还应记住，我们不会将任何机密硬编码或提交到代码仓库。相反，我们应始终使用环境变量在运行时导入机密值。这在将代码部署到生产环境时尤其重要。Python\
  \ 有一个 `os` 库可用于导入环境变量。例如，`os.environ.get(\"SQL_USER\", \"user\")` 将从 `os` 环境变量加载数据库用户：\n\
  \n```\nDATABASES = {\n    \"default\": {\n        \"ENGINE\": os.environ.get(\"\
  SQL_ENGINE\"),\n        \"NAME\": os.environ.get(\"SQL_DATABASE\"),\n        \"\
  USER\": os.environ.get(\"SQL_USER\", \"user\"),\n        \"PASSWORD\": os.environ.get(\"\
  SQL_PASSWORD\", \"password\"),\n        \"HOST\": os.environ.get(\"SQL_HOST\", \"\
  localhost\"),\n        \"PORT\": os.environ.get(\"SQL_PORT\", \"5432\"),\n    }\n\
  }\n```\n\n我们已了解在 Django 项目中结构化代码的重要性以及它能为我们带来的好处。在下一节中，我们将了解如何在 Django 项目中管理异常和错误处理。\n\
  \n# 处理异常和错误\n\n开发人员应始终考虑所有可能出现的边界情况并编写代码来处理所有这些边界情况。不幸的是，错误、异常和 bug 仍可能溜进生产环境，导致用户体验不佳。我们已在\
  \ *Chapter 9* 中学习到，测试用例如何帮助我们在开发阶段更早地捕获这些错误，并且为了改善用户体验，我们应在出现问题时显示适当的错误消息。例如，如果服务器期望请求体中存在\
  \ `name`，而它缺失，则我们应发送明确的错误消息，说明 `name field is missing`。\n\n以下是我们在处理异常和错误时应遵循的几点重要事项：\n\
  \n*   始终发送适当的响应状态码。如果请求体缺少某些信息，则传递 `400`，然后传递解释缺失信息的消息。\n\n*   如果错误是身份验证错误，则发送 `401`。如果我们使用\
  \ DRF，则 DRF 会自动以适当的 HTTP 状态码响应。\n\n*   如果请求错误是授权错误，则发送 `403`。\n\n*   为错误代码创建结构。例如，如果博客应用中的\
  \ API 收到错误请求，我们应创建自定义代码，`BLG0023` 或 `BLG0042`，以帮助识别代码的哪一部分出现故障并返回错误响应。在我们的示例中，通过\
  \ `BLG0023`，我们可以使用 API 错误代码识别有关服务、模块和功能的更多详细信息。这是行业中最广泛使用的策略之一；例如，你可能已注意到 ATM 上显示此类错误代码。\n\
  \n*   集成错误监控工具，如 Rollbar (`https://rollbar.com/`) 或 Sentry (`https://sentry.io/welcome/`)\
  \ 以捕获错误。我们将在 *Chapter 14* 中详细讨论集成。\n\n*   在代码中实现异常块时，我们应避免使用宽泛的异常处理并静默忽略错误。有一个详细的\
  \ Stack Overflow 回答解释了原因：`https://stackoverflow.com/questions/21553327/`。\n\n让我们举一个如何在代码库中实现更好的错误处理的例子。假设用户请求数据库中不存在的特定博客。我们应按如下方式处理这种情况：\n\
  \n```\n@api_view(['GET'])\ndef get_blog_by_id(blog_id):\n    try:\n        blog\
  \ = Blog.objects.get(id=blog_id)\n    except Blog.DoesNotExist:\n        return\
  \ Response(\n          status=status.HTTP_404_NOT_FOUND,\n          data={'error':\
  \ 'Blog does not exist',\n                'error_code': 'BLG0012'}\n        )\n\
  \    blog_data = BlogSerializer(blog).data\n    return Response({'blog': blog_data},\
  \ status=status.HTTP_200_OK)\n```\n\n在这里，我们捕获错误并发送适当的错误消息和错误代码供团队调试，同时附带正确的 HTTP\
  \ 状态码。\n\n我们在本节学习了错误处理和监控。随着我们在项目中构建新功能，我们希望对功能更有信心，同时在检测到破坏性更改时也有选项立即回滚。这就是功能标志/\
  \ kill switch 发挥作用的地方。\n\n# 使用功能标志\n\n功能标志是一种在运行时启用或禁用代码中某些功能的技术，而无需部署新代码。这有助于开发人员以更快的速度在生产环境中切换不同功能。例如，如果一家公司已在其应用中集成\
  \ Stripe 和 PayPal 支付网关，但由于某种原因 Stripe 出现故障，则团队可以快速在无需任何代码更改或部署的情况下将支付网关更改为 PayPal。这对于关键系统以及构建新系统时非常常见。\n\
  \n\n\n\n\n在下面的示例代码中，我们将支付网关配置存储在 `KeyValueStore` 数据库表中。这有助于我们在运行时控制支付网关。`KeyValueStore`\
  \ 是一个数据库模型，存储在 `common/models.py` 文件中：\n\n```\nclass KeyValueStore(models.Model):\n\
  \    key = models.CharField(max_length=255, unique=True)\n    value = models.JSONField()\n\
  \    def __str__(self):\n        return self.key\n```\n\n现在，创建一个公共接口，供其他应用使用以获取配置值。创建\
  \ `common/public.py` 文件并添加以下内容：\n\n```\nfrom common import models\ndef get_current_config(key_name):\n\
  \  try:\n    return models.KeyValueStore.objects.get(key=key_name).value\n  except\
  \ models.KeyValueStore.DoesNotExist:\n    return {}\n```\n\n现在，我们可以使用 `common` 配置函数访问存储在\
  \ `KeyValueStore` 模型中的任何值：\n\n```\nfrom common import public\ndef get_current_gateway():\n\
  \    return public.get_current_config('payment_gateway')\ndef get_payment_gateway():\n\
  \    payment_config = get_current_gateway()\n    if payment_config.get('name') ==\
  \ 'stripe':\n        return 'stripe'\n    elif payment_config.get('name') == 'paypal':\n\
  \        return 'PayPal'\n    return 'stripe'\ndef make_payment(request):\n    #\
  \ do something related to payment\n    payment_gateway = get_payment_gateway()\n\
  \    # process payment\n```\n\n功能开关对开发者学习非常重要，因为它让他们对系统更有信心。同样，该策略也有助于开发者使用 `kill\
  \ switches`，并在不依赖代码重新部署的情况下创建 A/B 测试和发布策略。使用简单的数据库和代码逻辑即可轻松实现基础的功能开关和 kill switches，但随着系统规模的增长，可以考虑使用外部系统来实现此类目的。诸如\
  \ Flagsmith（[`flagsmith.com`](https://flagsmith.com)）和 LaunchDarkly（[`launchdarkly.com`](https://launchdarkly.com)）等工具可以帮助构建复杂的功能开关和发布策略。\n\
  \n我们已经了解了功能开关及其在开发周期中的重要性。现在我们将来看一些关于如何为生产环境配置 Django 的技巧。\n\n# 为生产环境配置 Django\n\
  \n在本节中，我们将学习在部署到生产环境之前需要设置的一些关键配置。我们将首先讨论需要更新 `settings.py` 文件的配置：\n\n* 更新 `SECRET_KEY`\
  \ 值并通过环境变量传递\n* 将 `DEBUG = False` 设置为生产环境，以便在 Django 应用出现错误时，不会通过错误堆栈跟踪显示敏感信息\n\
  * 设置 `ALLOWED_HOSTS = [\"dip.com\", \"xyz.com\"]`，并列出 Django 项目将被部署的所有域名\n* 设置 `APPEND_SLASH\
  \ = True`，以便如果任何请求末尾缺少斜杠，Django 可以自动添加斜杠\n* 适当设置 `TIME_ZONE`\n\n还有一些其他配置可以根据 Django\
  \ 项目的用例进行更新。除前面提到的设置外，让我们学习另外几个需要执行的配置：\n\n* 将 Django 管理路径从 `/admin` 更改为不可猜测的路径\n\
  * 对于任何与时间相关的操作，始终使用 `timezone.now()`\n\n在本书中，我们学习了如何创建 REST API —— 除非我们纯粹为移动应用构建，否则我们需要配置\
  \ `Cross-Origin Resource Sharing`（`CORS`），这将使我们的 Django 应用可以从其他源访问。\n\n## 设置 CORS\n\
  \nCORS 是一种允许从不同源访问资源的机制。CORS 特别适用于浏览器，而非其他设备，如移动设备或物联网。有一种第三方包 `django-cors-headers`，被广泛用于为\
  \ Django 应用配置 CORS。请记住，CORS 和 `Cross-Site Request Forgery`（`CSRF`）是不同的，*Django 仅提供对\
  \ CSRF 的支持，而不提供对 CORS 的支持*。\n\n以下是如何在 Django 项目中配置 CORS 的步骤：\n\n1. 通过运行以下命令安装 `django-cors-headers`\
  \ 包：\n\n```\npip install django-cors-headers\n```\n\n2. 将 `corsheaders` 添加到 `INSTALLED_APPS`\
  \ 配置列表中：\n\n```\nINSTALLED_APPS = [\n    ...,\n    \"corsheaders\",\n    ...,\n\
  ]\n```\n\n3. 在 Django 设置的 `MIDDLEWARE` 配置中添加 `corsheaders.middleware.CorsMiddleware`：\n\
  \n```\nMIDDLEWARE = [\n    ...,\n    \"corsheaders.middleware.CorsMiddleware\",\n\
  \    \"django.middleware.common.CommonMiddleware\",\n    ...,\n]\n```\n\n4. 现在，在\
  \ `settings.py` 文件的 `CORS_ALLOWED_ORIGINS` 配置中添加你想要启用 CORS 的域名/子域名：\n\n```\nCORS_ALLOWED_ORIGINS\
  \ = [\n    \"https://example.com\",\n    \"https://sub.example.com\",\n    \"http://127.0.0.1:9000\"\
  ,\n]\n```\n\n我们已为项目配置了基本 CORS 配置。\n\n注意\n\n还有一些其他配置可以进行，但它们取决于项目的用例。请随时查阅官方文档以了解更多可应用的配置，网址为\
  \ [`github.com/adamchainz/django-cors-headers`](https://github.com/adamchainz/django-cors-headers)。\n\
  \n我们需要学习的最后一个概念是将 Django 应用部署到项目中，那就是 `Web Server Gateway Interface`（`WSGI`）。\n\n\
  ## 探索 WSGI\n\nWSGI 是 PEP 333 中规定的规范。该规范定义了 Nginx 和 Apache 等 Web 服务器与 Django 和 Flask\
  \ 等 Python Web 框架/应用之间的标准接口。WSGI 实现的细节超出了本书的范围。我们将只学习如何将 WSGI 集成到 Django 项目中。\n\n\
  Django 创建的样板代码已经生成了 `wsgi.py` 文件。这是生产环境中 Django 项目的入口点。我们需要在 `wsgi.py` 文件中添加配置以设置\
  \ `settings.py` 文件，通过在 `DJANGO_SETTINGS_MODULE` 变量中设置 `settings.py` 文件路径。例如，如果我们的设置文件位于\
  \ `config/settings/prod.py`，则应将路径设置为 `os.environ[\"DJANGO_SETTINGS_MODULE\"]=\"\
  backend.settings.prod\"`。\n\n配置完 `wsgi.py` 文件后，我们将使用 `gunicorn` 启动项目。请记住，WSGI 是规范，而\
  \ `gunicorn` 是用于 UNIX 的 Python WSGI HTTP 服务器。我们不会深入探讨 `gunicorn` 的概念，因为它本身就是一个框架。相反，我们将专注于\
  \ `gunicorn` 与 Django 项目的集成。\n\n重要提示\n\nGunicorn 不支持 Windows 环境。由于我们将使用 Linux 环境部署代码，如果你使用的是\
  \ Windows 设置，请跳过此步骤。或者，你可以使用 waitress Python 包在本地进行测试，但这在其他章节中不会使用。更多详情，请查看 *第 10\
  \ 章* 的 GitHub readme。\n\n以下是将 `gunicorn` 集成到任何 Django 项目的步骤：\n\n1. 我们已经看到了如何配置 `wsgi.py`\
  \ 文件。你可以根据本节前面提到的说明设置 `wsgi.py`。\n2. 现在，我们将在项目中使用以下命令安装 `gunicorn`：\n\n```\npip\
  \ install gunicorn\n```\n\n3. 使用 WSGI 文件启动 `gunicorn` 服务器。确保从 `manage.py` 文件所在的同一路径运行以下命令：\n\
  \n```\ngunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers=4 --max-requests=512\
  \ --max-requests-jitter=64 \n```\n\n代码片段中有很多标志。让我们现在分解每个配置：\n\n\n\n\n`config.wsgi.application`\
  \ 是我们 Django WSGI 配置的路径。这是生产环境中 Django 应用的入口点。\n\n`--bind 0.0.0.0:8000` 是将应用绑定到\
  \ `0.0.0.0:8000` 端口的配置，我们将配置 Nginx 反向代理将流量发送到端口 `8000`。\n\n`--workers=4` 是运行 `gunicorn`\
  \ 服务器的四个 worker。\n\n`--max-request=512` 是告诉 `gunicorn` 在处理了 512 个请求后重启服务器。这在应用存在内存泄漏时特别有帮助。\n\
  \n`--max-request-jitter=64` 是在重启服务器时引入抖动效果，否则我们可能会看到所有服务器在后台同时重启，导致停机。\n\nDjango\
  \ 还支持使用异步服务器网关接口 (`ASGI`) 进行部署，它为异步 Python Web 服务器、框架和应用之间提供了标准接口规范。ASGI 的实现超出了本书的范围。然而，如果你想实现它，你可以查看官方文档了解更多详细信息，网址为\
  \ [`docs.djangoproject.com/en/stable/howto/deployment/asgi/`](https://docs.djangoproject.com/en/stable/howto/deployment/asgi/)。\n\
  \n我们已经涵盖了与 Django 及构建可扩展 Django 项目所需的其他包相关的代码概念。\n\n# 总结\n\n在本章中，我们学习了可以在 Django\
  \ 项目中实现的不同约定。我们学习了如何在 Django 项目中创建不同的文件并对其进行适当的结构化，以编写可扩展且可维护的代码，并在项目扩展时避免循环依赖错误。异常和错误处理是我们本章学习的重要概念。我们了解了错误代码如何帮助我们在生产环境中正确调试。\n\
  \n我们看到了功能标志如何帮助我们更好地控制代码，并在运行时启用/禁用某些功能，而无需向服务器额外部署代码。然后，我们看到了在将 Django 应用部署到生产环境之前配置应用的一些技巧。CORS\
  \ 和 WSGI 是 Web 开发的关键规范，我们在本章中学习了它们，以及 `django-cors-headers` 和 `gunicorn` 包。我们还学习了应用开发，以及如何编写可扩展的应用。\n\
  \n在下一部分，我们将开始学习开发中使用的不同工具，如 Docker、Git 等。我们将学习使用版本控制的最佳实践，特别是 Git 和 githooks，以及如何利用持续集成\
  \ (`CI`) 流水线，如 GitHub Actions 和 GitLab CI，以获得更好的开发流程。\n"
- '# 第 3 部分 – 为 Django 应用 Docker 化并设置 CI 流水线


  在本部分，我们将学习如何将 Docker 集成到我们的 Django 项目中。我们可以使用 Docker 创建一个平台无关的 Django 应用，使生产环境的设置和部署更轻松。我们将学习如何使用版本控制软件
  (`git`) 工作并探索如何设置我们的 CI 流水线。我们将学习使用 CI 流水线的不同自动化，并了解如何为我们的 Django 应用实施代码审查流程。


  本部分包含以下章节：


  *   *第 11 章*，*Dockerizing Django Applications*

  *   *第 12 章*，*Working with Git and CI Pipelines Using Django*


  # 11

  '
- "# Dockerizing Django Applications\n\n在之前的章节中，我们讨论了如何为 Django 应用编写应用代码。在接下来的几章中，我们将探索可以用来改善开发体验、将代码部署到可扩展的生产系统以及监控生产系统的不同工具。\n\
  \n让我们开始改进我们的开发体验。在 *第 1 章* 中，在为 Django 项目设置本地开发时，我们提到了 `Docker`。我们将学习如何使用 Docker\
  \ 开发我们的 Django 应用。本章我们将主要关注使用容器在本地系统上运行所有服务的情况下，将我们的 Django 应用 Docker 化。\n\n在本书记述的之前章节中，我们在本地使用\
  \ Django 项目时使用了不同的远程服务用于 Postgres 和 Redis，以便我们不会被任何安装步骤阻塞。为了确保每个人都能轻松遵循书中给出的所有说明，而不会因可能过时的教程或本地系统配置的差异而遇到困难，我确保仅使用最少的本地系统依赖项，以便指南易于遵循。但随着项目的增长，本地设置项目将变得很重要；为此目的，Docker\
  \ 是大多数开发者的首选工具。\n\n在本节中，我们将学习如何使用 Docker 在本地系统上设置 Django、Celery、Celery Beat、Redis\
  \ 和 Postgres。由于项目的 Docker 设置仅在项目创建的初始阶段完成，我们将采用一个样板项目模板并对项目进行 Docker 化，而不深入细节。\n\
  \n让我们看看本章将涵盖的主要主题：\n\n*   学习 Docker 的基础知识\n*   为 Django 项目创建 `Dockerfile`\n*   使用\
  \ `docker-compose.yaml` 组合服务\n\n## 技术要求\n\n在本章中，我们将讨论如何将 Docker 与 Django 应用一起使用。我们不会深入\
  \ Docker 和容器的细节。我们期望你对 Docker 有基础的理解。对于本章，你需要具备以下条件：\n\n*   对容器和 Docker 的理解\n* \
  \  对如何在本地系统上安装 Docker 的理解\n*   熟悉访问 Docker 开发环境\n\n由于我们不会关注 Docker 的基础和细节，如果你不熟悉上述要求，请从以下书籍/视频中阅读/复习\
  \ Docker 的概念：\n\n*   *Docker Deep Dive, Second Edition* – By *Nigel Poulton*\n*\
  \   *Docker for Developers* – By *Richard Bullington-McGuire*, *Andrew K. Dennis*,\
  \ and *Michael Schwartz* from *Packt Publishing*\n*   *The Ultimate Docker Container\
  \ Book, Third Edition* – By *Dr. Gabriel N. Schenker* from *Packt Publishing*\n\
  *   *A Developer’s Essential Guide to Docker Compose* – By *Emmanouil Gkatziouras*\
  \ from *Packt Publishing*\n\n以下是本章所有代码和说明的 GitHub 仓库：[`github.com/PacktPublishing/Django-in-Production/tree/main/Chapter11`](https://github.com/PacktPublishing/Django-in-Production/tree/main/Chapter11)。\n\
  \n## 学习 Docker 的基础知识\n\nDocker 是一个开源容器化平台，允许开发者构建、部署和管理容器化应用。在我们深入 Docker 的概念之前，让我们学习一些将建立基础的概念：\n\
  \n*   **虚拟化** – 虚拟化的概念可以追溯到 1970 年代。它是在从实际硬件抽象的虚拟层中运行不同操作系统/软件的虚拟实例的过程。\n\n考虑一个\
  \ 10 栋别墅的类比，每栋别墅都有自己的设施，不能与邻居共享。所有业主都住在自己的别墅中，并受分配给他们的面积限制。他们可以在自己的别墅中做任何事情，但无法进入邻居的别墅。*图\
  \ 11.1* 显示了使用虚拟机的虚拟化概念示例。\n\n![Figure 11.1: Concept of Virtual machine using virtualization](img/Figure_11.1_B18867.jpg)\n\
  \n图 11.1：使用虚拟化概念的虚拟机\n\n\n\n\n\n`Virtual machine` – 虚拟机在物理机器之上运行，可以访问分配给它们的资源，并且不能访问超过其分配的资源。\n\
  \n`Hypervisor` – Hypervisor 是一种用于创建和运行虚拟机的程序。\n\n虚拟机的概念无缝工作并且在行业中仍然使用，但它也存在资源使用效率低下的问题。沿用同样的类比，为什么每栋平房都有自己的停车位？它们可以有一个停车场，供居民停车使用。\n\
  \nDocker 通过让开发者将应用程序打包成小型容器来解决这个问题，然后容器可以在机器上独立运行。沿用同样的类比，Docker 可以被视为一栋公寓楼，租户住在每个公寓里，每个租户都可以使用设施。每个公寓在停车区都有分配给他们的停车位。现在我们有了一种高效利用停车区的方法。\n\
  \nDocker 在容器之间提供逻辑隔离，每个容器在其自己的空间中独立运行，而不知道/无法访问其他容器中的数据，除非特别共享。\n\n![Figure 11.2:\
  \ Docker high-level architecture](img/Figure_11.2_B18867.jpg) \n\nFigure 11.2: Docker\
  \ high-level architecture\n\n在使用 Docker 的过程中，我们会遇到与 Docker 相关的多个术语。以下是将帮助我们更好地理解\
  \ Docker 的关键概念：\n\n*   `Dockerfile` – `Dockerfile` 是一个文本文档，为构建 Docker 镜像提供指导并详细说明容器的基础操作系统。它概述了必要的元素，例如语言、环境变量、文件路径、网络端口和其他要求，以及容器执行时预期采取的操作。\n\
  \n*   `Docker images` – Docker 镜像同时封装了可执行应用程序源代码以及应用程序容器化执行所必需的所有工具、库和依赖项。运行 Docker\
  \ 镜像会将其转换为容器的单个实例或多个实例。\n\n*   `Docker containers` – Docker 容器镜像是一个紧凑、独立、可执行的软件包，包含应用程序执行所需的一切，包括代码、运行时、系统工具、库和配置。\n\
  \n*   `Docker Engine` – Docker Engine 是一个客户端-服务器应用程序，促进构建、传输和基于容器的应用程序执行所需的过程和工作流程。它启动一个服务器端守护进程，负责管理镜像、容器、网络和存储卷。\n\
  \n*   `Docker daemon` – Docker daemon 是主机系统上幕后运行的服务，负责监督 Docker 容器的创建、执行和分发。此进程在主机的操作系统上运行，作为客户端通信的接口。\n\
  \n*   `Docker registry` – Docker registry 是 Docker 镜像的存储中心。它充当存储库，可驻留在本地供个人用户使用，也可公开，例如在\
  \ Docker Hub 上，使应用程序开发中的协作工作成为可能。团队甚至在同一组织内也可以通过将容器上传到 Docker Hub 无缝交换或分发容器——一个类似于\
  \ GitHub 的云存储库。\n\n*   `Docker Hub` – Docker Hub，自称“世界上最大的容器镜像库和社区”，充当 Docker 镜像的公共存储库。拥有超过\
  \ 100,000 个容器镜像的集合，它汇集了商业软件供应商、开源计划和个人开发者的贡献。存储库包括 Docker, Inc. 制作的镜像、Docker Trusted\
  \ Registry 的认证镜像以及许多其他镜像。Docker Hub 用户可以自由地轻松共享其镜像，并且可以轻松访问预配置的基础镜像以启动任何容器化工作。\n\
  \n*   `Docker Compose` – Docker Compose 简化了多个容器的编排，将它们集体视为单个服务。虽然独立执行每个容器，但它促进了容器之间的无缝交互和通信。\n\
  \n我们将在本章后半部分学习更多关于 Docker Compose 的内容（在 *Composing services using docker-compose.yml*\
  \ 部分）。现在让我们学习如何在本地系统上安装 Docker 并使用它。\n\n## Installing Docker\n\nDocker 是一件开源软件，可免费从官方网站下载。Docker\
  \ 可用于 Linux、Windows 和 Mac 操作系统。每个平台的安装和运行 Docker 的说明都已在官方指南中得到充分记录和解释，因此我们在此不予赘述。请按照以下说明操作：\n\
  \n*   对于 macOS 用户，请按照 [`docs.docker.com/desktop/install/mac-install/`](https://docs.docker.com/desktop/install/mac-install/)\
  \ 给出的步骤操作。\n\n*   对于 Windows 用户，请按照 [`docs.docker.com/desktop/install/windows-install/`](https://docs.docker.com/desktop/install/windows-install/)\
  \ 给出的步骤操作。\n\n*   对于 Linux 用户，请按照 [`docs.docker.com/desktop/install/linux-install/`](https://docs.docker.com/desktop/install/linux-install/)\
  \ 给出的步骤操作。\n\n一旦我们安装了 Docker，我们可以运行 `docker version` 命令来验证我们的安装。*Figure 11**.3*\
  \ 显示了运行 Docker 所需的所有 Docker 驱动程序的输出。*请注意：版本号可能因平台不同以及您 `installing Docker* 的时间而不同。\n\
  \n![Figure 11.3: Output of the docker version command](img/Figure_11.3_B18867.jpg)\
  \ \n\nFigure 11.3: Output of the docker version command\n\nDocker 安装完成后，让我们在本地系统上测试\
  \ Docker。\n\n## Testing Docker on your local system\n\n现在 Docker 已安装在我们的本地系统上，让我们尝试运行一个\
  \ Docker 容器来验证 Docker 设置。Docker 有一个示例镜像，我们可以用它来运行容器。Docker 提供了官方镜像供我们测试。`hello-world`\
  \ 镜像是一个简单的示例，开发人员用它来验证设置。\n\n通过运行以下命令，我们可以验证本地机器上的 Docker 设置：\n\n```\n> docker pull\
  \ hello-world  && docker run hello-world\n```\n\n*Figure 11**.4* 显示了我们运行 `docker\
  \ run` 命令时应该看到的输出：\n\n![Figure 11.4: The output of the hello-world Docker image](img/Figure_11.4_B18867.jpg)\
  \ \n\nFigure 11.4: The output of the hello-world Docker image\n\n现在我们已经验证了 Docker\
  \ 设置并运行了 `hello-world` Docker 镜像，让我们学习一些我们需要使用的几个重要命令。\n\n## Important commands\
  \ for Docker\n\nDocker CLI 有多个命令可用于交互和执行不同的操作。在这里我们将介绍开发人员经常使用的最常见命令：\n\n*   `docker\
  \ ps` 显示正在运行的容器的列表以及基本信息，例如容器 ID、名称和状态。这是一种快速检查当前活动容器的简便方法。\n\n*   `docker pull`\
  \ 从注册表中下载 Docker 镜像。\n\n*   `docker build` 从 `Dockerfile` 构建 Docker 镜像。\n\n*   `docker\
  \ run` 从指定镜像创建并启动新容器。它允许您自定义容器的各个方面，例如端口映射、环境变量等。\n\n*   `docker start` 启动已停止的容器。它使容器重新活跃起来，让您恢复其操作。\n\
  \n*   `docker exec` 在正在运行的容器内执行命令。对于在特定容器内执行任务或运行应用程序而不启动新容器非常方便。\n\n\n\n\n\n`docker\
  \ stop` stops a running container.\n\n`docker restart` restarts a container.\n\n\
  `docker log` displays the logs of a container.\n\nRead more\n\nFor more Docker CLI\
  \ commands, refer to [`docs.docker.com/engine/reference/run/`](https://docs.docker.com/engine/reference/run/).\n\
  \nAlternatively, check the frequently used commands from their official one-page\
  \ cheat sheet here:\n\n[`docs.docker.com/get-started/docker_cheatsheet.pdf`](https://docs.docker.com/get-started/docker_cheatsheet.pdf).\n\
  \nWe will learn how to create our own custom Docker image and work with it. But\
  \ before that, we need to learn how to manage package dependencies with the `requirements.txt`\
  \ file in a Django project.\n\n# Working with the requirements.txt file\n\nDifferent\
  \ projects can have different dependency needs to run. That’s why we use the `requirements.txt`\
  \ file to capture all the third-party packages installed and used in a project.\
  \ But as projects grow, we can realize that some of the dependency packages are\
  \ useful only while we are developing locally, some are useful in our CI pipeline,\
  \ and some are used only for production. Hence it is important that we break our\
  \ `requirements.txt` file into multiple parts.\n\nWe need to split our `requirements.txt`\
  \ file into multiple files that would be used for different purposes. This is common\
  \ in large projects and is always better to implement as soon as we create a new\
  \ project. This ensures that only the actually used packages are shipped to production.\n\
  \nHere is a structure seen in most large projects:\n\n* `requirements-base.txt`\
  \ – This file contains all the common third-party packages that are used in all\
  \ the environments. For example, Django and Celery are third-party packages that\
  \ are used across all the environments, so we should add them to the base file.\n\
  * `requirements-local.txt` – This file contains all the packages that are going\
  \ to be used in the base file and are needed to run the project locally. This can\
  \ contain a lot of mocks and also testing packages that developers use daily.\n\
  * `requirements-ci.txt` – This file contains all the packages that are going to\
  \ be used in the base file and are needed to run the project in the CI pipeline.\n\
  * `requirements-stage.txt` – This file contains all the packages similar to the\
  \ production environment but can be used to test any package upgrades without affecting\
  \ the production environment.\n* `requirements-prod.txt` – This file contains all\
  \ the packages that are going to be used in the base file and any special packages\
  \ that are needed in production.\n\nHere is an example of a `requirements-base.txt`\
  \ file that has only base packages:\n\n```\nDjango==5.0\ndjangorestframework==3.14.0\n\
  redis==5.0.1\ndjango-cacheops==7.0.2\n```\n\nNow our production packages would be\
  \ stored in the `requirements-prod.txt` file, which has all the base packages along\
  \ with the extra packages:\n\n```\n-r requirements-base.txt\ngunicorn==21.0.1\n\
  ```\n\nThe first line, `-r requirements-base.txt`, is important because it tells\
  \ Python to include all the packages from the `requirements-base.txt` file and then\
  \ add the packages mentioned in the `requirements-prod.txt` file. *Figure 11.5*\
  \ shows the `requirements.txt` concepts:\n\n![Figure 11.5: requirement.txt](img/Figure_11.5_B18867.jpg)\n\
  \nFigure 11.5: requirement.txt\n\nThere are other dependency tools in Python that\
  \ can be used for package management. For example, there are `Poetry`, `pdm`, `pipenv`,\
  \ but we will stick to `pip` and `requirements.txt` since we are using Docker and\
  \ it will simplify our setup.\n\nNow let us create our own Docker image for our\
  \ Django project code that we can run locally.\n\n# Creating a Dockerfile for a\
  \ Django project\n\nA `Dockerfile` is a text document that has all the instructions\
  \ needed to create a Docker image. We can consider a `Dockerfile` as a recipe that\
  \ we can follow to cook any item. Let us take the boilerplate `Dockerfile` example\
  \ we would need for our Django project. Create a `/myblog/backend/Dockerfile` file\
  \ with the following content:\n\n```\n# Pull the official base image\nFROM python:3.11\n\
  # Set environment variables\nENV PYTHONDONTWRITEBYTECODE 1\nENV PYTHONUNBUFFERED\
  \ 1\n# Install different Linux packages.\nRUN apt-get update \\\n&& apt-get install\
  \ gcc postgresql postgresql-contrib libpq-dev python3-dev netcat-traditional -y\
  \ \\\n&& apt-get clean\n# set working directory and install packages using pip.\n\
  WORKDIR /app\nCOPY ./requirements ./requirements\nRUN pip install -r requirements/requirements-local.txt\n\
  # Copy the Application code\nCOPY . /app/\nCOPY ./entrypoint.sh /app/entrypoint.sh\n\
  # Give permission to entrypoint.sh file as executable.\nRUN chmod +x /app/entrypoint.sh\n\
  # run entrypoint.sh\nENTRYPOINT [\"/app/entrypoint.sh\"]\n```\n\nSave the content\
  \ of the file as `Dockerfile` in `/<path to project>/<Django manage.py folder>/Dockerfile`.\
  \ Let us learn what `Dockerfile` does:\n\n* `FROM python:3.11` – We are downloading\
  \ the base Python image where we shall install all the packages. One popular idea\
  \ developers have with Docker is to use the `Alpine` image, but I strongly advise\
  \ you to stay away from the `Alpine` image because the `Alpine` image with Python\
  \ leads to longer build time, performance issues, and obscure bugs in production.\
  \ (Read more about the issues with the `Alpine` Docker image at [`pythonspeed.com/articles/alpine-docker-python/`](https://pythonspeed.com/articles/alpine-docker-python/).)\
  \ I would strongly recommend using the default Python image if you are starting\
  \ and don’t have any specific requirements and space constraints.\n* `Set Python\
  \ environment variables` – Setting `PYTHONDONTWRITEBYTECODE` to `1` tells Python\
  \ not to create the `__pycache__` folders. Setting `PYTHONUNBUFFERED` to `1` tells\
  \ Python to pass the `stdout` and `stderr` streams to be unbuffered. This helps\
  \ to get an immediate output of the logs, and the Django management command output\
  \ is instantly visible.\n* `Install Linux packages` – We use different drivers and\
  \ packages to connect to databases and other services.\n* `Install Python packages`\
  \ – We have first set the working directory, then copied all the `requirements`\
  \ files. Run the `pip` command to install all the Python packages.\n* `Copy application\
  \ code` – Copy the application code and give execution permission to the `entrypoint.sh`\
  \ file.\n* Run the `entrypoint.sh` file.\n\nOnce our Docker container is initiated,\
  \ we need to execute commands inside our container. For example, in a Django project,\
  \ we want to run our migration command every time we start our Django server. This\
  \ way, we can ensure that our database has applied all the latest database migrations.\
  \ We can perform such operations using the `entrypoint.sh` script. We need to create\
  \ an `entrypoint.sh` file. Here is an example of our `entrypoint.sh` file:\n\n```\n\
  #!/bin/sh\nif [ \"$DB_HOSTNAME\" = \"postgres\" ]\nthen\n    echo \"Waiting for\
  \ Postgres...\"\n    while ! nc -z $DB_HOSTNAME $DB_PORT; do\n      sleep 0.1\n\
  \    done\n    echo \"PostgreSQL started\"\nfi\npython manage.py migrate\nexec \"\
  $@\"\n```\n\nIn the preceding snippet of code, we are first waiting for the Postgres\
  \ database to be ready for connection. Once the database is ready to accept the\
  \ connection, we will run the Django migration commands. The last line, `exec \"\
  $@\"`, is a very important command; it takes the command from the `docker-compose.yaml`\
  \ file and replaces the parent process, rather than creating a different process.\
  \ Read more about how the `entrypoint.sh` script works and what it can do here:\
  \ [`stackoverflow.com/questions/32255814/`](https://stackoverflow.com/questions/32255814/).\n\
  \nNow run the following command to build a Docker image for your Django project:\n\
  \n```\n> docker build -f ./Dockerfile -t django-in-production .\n```\n\n\n\n\n*Figure\
  \ 11**.6* 显示了 `docker build` 命令的输出。在此步骤中，我们正在下载 Python 镜像，然后安装所有依赖的 Python 包。\n\n\
  ![Figure 11.6: Output of the docker build command](img/Figure_11.6_B18867.jpg)\n\
  \nFigure 11.6: Output of the docker build command\n\n要启动 Docker 容器，请运行以下命令：\n\n\
  ```\n> docker run -p 0.0.0.0:8000:8000 django-in-production python manage.py runserver\
  \ 0.0.0.0:8000\n```\n\n*Figure 11**.7* 显示了 `docker run` 命令的输出，其中我们将 `python manage.py\
  \ runserver 0.0.0.0:8000` 命令传递给容器，并将端口 `8000` 暴露给主机机器。\n\n![Figure 11.7: Output\
  \ of the docker run command](img/Figure_11.7_B18867.jpg)\n\nFigure 11.7: Output\
  \ of the docker run command\n\n现在我们可以看到我们的 Django 应用正在运行，并且可以通过浏览器访问。我们可以通过在浏览器中打开\
  \ `http://0.0.0.0.8000/admin/` 来验证。\n\n我们已经创建了 Django Docker 镜像，但我们仍然在使用远程服务来运行\
  \ Postgres 和 Redis。现在我们将学习如何使用 `docker-compose` 协调 Postgres 和 Redis 等不同服务并连接到我们的\
  \ Django 项目。\n\n# 使用 docker-compose.yaml 组合服务\n\n现在让我们探索如何创建一个 `docker-compose.yaml`\
  \ 文件来协调我们的 Django 项目、Celery、Celery Beat、Postgres 和 Redis 服务。向 `/myblog/docker-compose.yml`\
  \ 文件添加以下代码：\n\n```\nversion: \"3.8\"\nservices:\n  postgresql_db:\n    image: postgres:16.1\n\
      volumes:\n      - ~/volumes/proj/dip/postgres/:/var/lib/postgresql/data/\n    ports:\n\
        - 5432:5432\n    env_file:\n      - ./.env\n    environment:\n      - POSTGRES_USER=${DB_USERNAME}\n\
        - POSTGRES_PASSWORD=${DB_PASSWORD}\n      - POSTGRES_DB=${DB_NAME}\n  redis_db:\n\
      image: redis:7.2\n    container_name: redis_db\n    ports:\n      - 6379:6379\n\
      command: redis-server --requirepass ${REDIS_PASSWORD}\n    env_file:\n      -\
  \ ./.env\n    volumes:\n      - $PWD/redis-data:/var/lib/redis\n      - $PWD/redis.conf:/usr/local/etc/redis/redis.conf\n\
    blog_app:\n    build:\n     context: ./backend\n     dockerfile: Dockerfile\n\
      command: python manage.py runserver 0.0.0.0:8000\n    volumes:\n      - ./backend/:/app/\n\
      ports:\n      - 8000:8000\n    env_file:\n      - ./.env\n    depends_on:\n\
        - postgresql_db\n      - redis_db\n  celery:\n    build: ./backend\n    command:\
  \ celery --app=config worker -l info\n    volumes:\n      - ./backend/:/app/\n    env_file:\n\
        - ./.env\n    depends_on:\n      - postgresql_db\n      - redis_db\n  celery_beat:\n\
      build: ./backend\n    command: celery --app=config beat -l info -S redbeat.RedBeatScheduler\n\
      volumes:\n      - ./backend/:/app/\n    env_file:\n      - ./.env\n    depends_on:\n\
        - postgresql_db\n      - redis_db\n```\n\n让我们学习 `service` 配置的每个部分的作用（请注意，服务名称可以是任何其他名称，因为我们是根据方便来命名的）：\n\
  \n*   `postgres_db` – 运行 Postgres 数据库服务器。我们使用 `.env` 文件加载所有环境变量值，然后在 `environment`\
  \ 部分映射这些值。\n*   `redis_db` – 运行用于缓存和维护我们 Celery 异步任务队列的 Redis 数据库服务器。\n*   `blog-app`\
  \ – 运行 Django 应用。\n*   `celery` – 运行 Celery 服务以运行异步任务。\n*   `celery-beat` – 运行 Celery\
  \ Beat 服务以运行可执行的周期性任务。\n\n重要说明\n\n我们使用在 *Creating a Dockerfile for a Django project*\
  \ 部分中创建的相同 `Dockerfile` 来运行我们的 Django、Celery 和 Celery Beat 服务。`Dockerfile` 和 `entrypoint.sh`\
  \ 步骤相同；唯一的区别是我们传递给服务的命令。\n\n另一个重要步骤：在本地开发环境中运行 Docker 时，我们必须在主机文件系统中为 `entrypoint.sh`\
  \ 文件赋予执行权限。我们使用 `volumes` 配置覆盖 Docker 容器中的文件，该配置将所有文件挂载到 Docker 容器中。我们使用 `volumes`\
  \ 来为 Django 开发启用热重载。通过在 Mac 或 Linux 上在 `<project>/myblog/` 文件夹中运行以下命令，我们可以为 `entrypoint.sh`\
  \ 文件赋予适当的权限：\n\n```\n> chmod +x backend/entrypoint.sh\n```\n\n如果我们没有为 `entrypoint.sh`\
  \ 文件提供适当的权限，那么在 *Starting Django applications using Docker* 部分尝试运行 `docker-compose`\
  \ 命令时，我们会看到以下错误。在 *Figure 11**.8* 中，我们可以看到 `exec: \"/app/entrypoint.sh\": permission\
  \ denied: unknown` 错误。因此，添加适当的权限非常重要。\n\n![Figure 11.8: Error due to a bad permission\
  \ for entrypoint.sh](img/Figure_11.8_B18867.jpg)\n\nFigure 11.8: Error due to a\
  \ bad permission for entrypoint.sh\n\n要更新 `entrypoint.sh` 文件权限的 Windows 特定命令，请访问\
  \ [`www.educative.io/answers/what-is-chmod-in-windows`](https://www.educative.io/answers/what-is-chmod-in-windows)。\n\
  \n现在我们已经创建了包含 Django 应用运行所需所有服务的 `docker-compose` 文件，但每个服务的配置需要传递。为此，我们创建一个包含所有必需变量的\
  \ `.env` 文件。\n\n## 创建 .env 文件\n\n我们将创建一个包含所有配置值以及不同服务所需的敏感密钥值的 `.env` 文件。以下是 `docker-compose`\
  \ 运行所有不同服务所需的环境变量示例。创建 `/myblog/.env` 文件并添加以下代码：\n\n```\nDEBUG=True\nDJANGO_ALLOWED_HOSTS=*\n\
  DB_ENGINE=django.db.backends.postgresql\nDB_NAME=django_in_production\nDB_USERNAME=root\n\
  DB_PASSWORD=root\nDB_HOSTNAME=postgresql_db\nDB_PORT=5432\nREDIS_HOST=redis_db\n\
  REDIS_PORT=6379\nREDIS_PASSWORD=redisPassWord\n```\n\n现在我们已在 `.env` 文件中定义了所有配置值，并将\
  \ `.env` 文件保存在与 `docker-compose.yaml` 文件相同的目录中。*这些值可以不同，可以根据您的喜好进行更新*。下一步，我们必须为所有服务加载\
  \ `.env` 文件，以便在我们希望它们可访问的位置加载。以我们的 `docker-compose.yaml` 文件为例，我们按如下方式加载 `.env` 值：\n\
  \n```\nversion: \"3.8\"\nservices:\n  blog-app:\n    ... other settings\n    env_file:\n\
        - ./.env\n    ... other settings\n  celery:\n    ... other settings\n    env_file:\n\
        - ./.env\n    ... other settings\n```\n\n我们的 `blog-app` 服务和 `celery` 服务将从\
  \ `.env` 文件加载环境变量。\n\n在 Docker 中传递环境变量还有其他方法。你可以在此处阅读更多内容：[`docs.docker.com/compose/environment-variables/set-environment-variables/`](https://docs.docker.com/compose/environment-variables/set-environment-variables/)。\n\
  \n传递的环境变量需要在 Django 和 Celery 服务中访问。让我们学习如何使用 Python 在后端服务中访问环境变量值。\n\n## 在 Django\
  \ 中访问环境变量\n\n一旦添加了环境变量，我们需要在 Docker 容器中运行的 Django 应用中访问它们。环境变量可以使用 Python 的 `os`\
  \ 库访问。例如，让我们访问 `.env` 文件中设置的 `DEBUG` 标志：\n\n```\nimport os\nDEBUG = os.environ.get(\"\
  DEBUG\", False)\n```\n\n同样，我们可以访问其他环境变量，并根据 `.env` 文件中设置的值使我们的 `settings.py` 文件动态化。我们可以使用从\
  \ `.env` 文件中获取的环境变量配置 Django 设置，这样秘密值就不会添加到版本控制中。\n\n重要说明\n\n\n\n\n\n请记得将 `.env`\
  \ 文件添加到 `.gitignore` 文件中。我们不希望 `.env` 文件或任何可能导致安全漏洞的敏感值被提交到 Git 历史记录中。\n\n还有另一个可用的包，`django-environ`（[`github.com/joke2k/django-environ`](https://github.com/joke2k/django-environ)），它可以以更好的格式加载环境变量。但我会留给你阅读并决定是使用基本的\
  \ `os` 库还是 `django-environ`。就个人偏好而言，我喜欢使用基本的 `os` 库，因为使用第三方包总会增加维护开销。读取简单的环境变量不应该需要额外的包。\n\
  \n现在让我们使用 Docker Compose 启动我们的 Django 应用。\n\n## 使用 Docker 启动 Django 应用\n\n我们的 Django\
  \ 项目现在已使用 Docker 设置完成，我们可以通过执行以下命令启动项目：\n\n```\n> docker-compose -f docker-compose.yaml\
  \ up --build\n```\n\n现在 Docker 将下载镜像并构建 `docker-compose.yaml` 文件中提到的全部五个不同的服务。我们的\
  \ Django 应用现在已独立运行在本地系统上，而不依赖于任何远程服务。\n\n为了验证所有服务是否正常运行，我们可以使用以下命令：\n\n```\n> docker\
  \ ps\n```\n\n*图 11.9* 显示了 `docker ps` 命令的结果以及在本地系统上运行的全部五个容器：\n\n![Figure 11.9:\
  \ The output of the docker ps command](img/Figure_11.9_B18867.jpg)\n\n图 11.9：docker\
  \ ps 命令的输出\n\nDocker 是一个强大的工具，帮助开发者在本地系统上独立运行服务。我们已利用 Docker 的强大功能，成功使用不同的 Docker\
  \ 容器在本地运行我们的 Django 应用。\n\n# 总结\n\n在本章中，我们对如何使用 Docker 设置 Django 应用进行了高层次概述。我们使用了一个包含\
  \ Postgres、Redis、Django、Celery 和 Celery Beat 的样板模板，以使用 Docker 在本地运行服务。我们没有深入探讨这些主题，因为\
  \ Docker 本身是一个庞大的主题，并且预计你对 Docker 有一定的了解，这样你就可以将本章作为设置项目的参考。\n\n在下一章中，我们将重点介绍如何使用\
  \ GitHub Actions 实现 CI 流水线、设置 Git hooks，以及使用不同的分支策略进行版本控制。我们还将讨论有关如何设置代码评审流程的几点。\n\
  \n# 12\n"
- "# 使用 Django 进行 Git 和 CI 流水线的工作\n\n在 *第 11 章* 中，我们学习了如何将 Docker 集成到 Django 项目中。Docker\
  \ 帮助我们在任何平台上无缝运行 Django 项目。在本章中，我们将探讨如何在 Django 项目中高效使用 Git。我们将学习使用 Git 的最佳实践，以及如何将\
  \ Git hooks 集成到开发周期中以提高开发者的生产力。\n\n本章我们将学习以下主题：\n\n* 高效使用 Git\n* 使用 GitHub 并设置 GitHub\
  \ Actions\n* 设置 PR 评审和代码规范\n\n# 技术要求\n\n在本章中，我们将使用高级 Git 功能并将 GitHub Actions 集成到我们的项目中。我们期望读者对\
  \ Git 有良好的理解，并对使用 GitHub Actions 的 **持续集成**（**CI**）流水线有一定的了解。\n\n如果你不熟悉 Git，我们强烈建议你学习\
  \ Git 的基础知识，然后再回来看本章。以下是一些你可以参考的书籍和免费课程资源：\n\n* *Git for Programmers* by Jesse Liberty\n\
  * *Mastering Git* by Jakub Narębski, Jakub S Narebski\n* *Version Control with Git*\
  \ by Udacity ([`www.udacity.com/course/version-control-with-git--ud123`](https://www.udacity.com/course/version-control-with-git--ud123))\n\
  * *Pro Git* by Scott Chacon and Ben Straub ([`git-scm.com/book/en/v2`](https://git-scm.com/book/en/v2))\n\
  * *RY’s Git Tutorial* by Ryan Hodson ([`www.amazon.com/Rys-Git-Tutorial-Ryan-Hodson-ebook/dp/B00QFIA5OC`](https://www.amazon.com/Rys-Git-Tutorial-Ryan-Hodson-ebook/dp/B00QFIA5OC))\n\
  \n以下是本章所有代码和说明的 GitHub 仓库：[`github.com/PacktPublishing/Django-in-Production/tree/main/Chapter12`](https://github.com/PacktPublishing/Django-in-Production/tree/main/Chapter12)\n\
  \n# 高效使用 Git\n\n版本控制是 **软件开发生命周期**（**SDLC**）中最重要的工具之一。我们在本章中不会介绍 Git 的基础知识，而是讨论在使用\
  \ Git 时应遵循的良好实践。让我们来看一下在使用 Git 时推荐的几个良好实践：\n\n* 对于小的更改，始终为其创建新的分支。很多时候，开发者会想直接将更改提交到\
  \ `main`、`master`、`develop` 或用于默认分支的任何其他名称，这取决于他们使用的是什么。\n* 在创建项目时尽快添加 `.gitignore`\
  \ 文件。\n* 切勿允许任何人直接推送代码到默认分支。每一块代码都应通过 `pull request`（`PR`）合并到默认分支。\n* 始终确保 Git 在本地已配置，并且包含开发者的姓名、电子邮件和其他相关详细信息。\n\
  * 在合并两个分支时使用 `git merge` 命令策略，避免使用 rebase 和重写历史，除非你知道自己在做什么。我们将在下一节详细讨论这一点。\n* 始终使用有意义且详细的提交信息。创建提交信息规范，并确保开发者遵循提交信息格式。\n\
  * 始终使用 `git revert` 来执行代码回滚。切勿更改代码库已发布的历史记录。\n* 尽可能使用 Git hooks 来自动化你的工作流程。\n* 使用\
  \ Git 标签来发布项目中的新代码。我们将在本章后面部分详细讨论如何利用 Git 标签。\n* 决定一个 `Git workflow` 并确保开发者坚持执行。\n\
  \n请注意\n\n前面提到的 Git 最佳实践是主观的，并且基于具体情况。读者始终可以选择适合/解决其问题陈述的不同工作流程。我在处理不同项目时也无法遵循所有前面提到的建议。因此，与所提及的内容相比，提出不同的工作流程总是可能的。\n\
  \n现在，让我们开始深入探讨一些可以帮助你和你的团队高效工作的主题。\n\n## Git 分支策略\n\n开发者在处理代码库时应始终创建新的分支。在使用分支时，开发者应遵循一些考虑或约定。在本节中，我们将讨论软件开发者应考虑的所有约定，以使用\
  \ Git 改进其开发流程：\n\n* **分支名称**：决定分支命名约定很重要。分支名称应提供足够的信息，帮助任何人轻松识别分支中的更改。不同团队和公司遵循不同的约定，但最重要的是团队中的每个人都应遵循相同的约定。以下是行业中使用的一些示例；请随意讨论并选择适合你团队的分支约定：\n\
  \n\n\n\n\n1. `<branch type>/<ticket or issue number>/<branch name>`: 在这里，我们以分支所处理的任务类型开头，例如\
  \ `feature`、`bugfix` 和 `improvement`。然后我们添加 issue 编号或 JIRA 工单编号，后跟标准的分支名称。例如，如果我们正在做一个功能且我们的\
  \ JIRA 编号为 DJ-112，该功能将为博客添加评论功能，那么我们的分支名称应如下所示：`feature/DJ-112/integrating-comments`。\n\
  \n2. `<developer or team name/<branch type>/<branch name>`: 在这里，我们以正在处理该分支的团队或开发者名称开头，后跟任务类型，例如\
  \ `feature` 或 `bugfix`。例如，如果我正在添加评论功能，那么分支名称看起来像这样：`argo/feature/integrating-comments`。\n\
  \n开发者可以讨论并决定任何适合团队的命名约定，但重要的是选择一种特定的模式并在代码库中工作时只允许使用该模式。这可以通过本地 Git hooks 和服务器 hooks\
  \ 来强制执行。\n\n* **使用受保护分支**：项目中应有受保护分支，任何人都不能直接推送代码。代码进入这些分支的唯一方式应通过 PR。这些分支应用于生产部署或创建用于部署到生产环境的标签。\n\
  \n* **使用分支工作流**：不同公司开发了众多策略来解释分支策略。你可以阅读不同的著名分支策略并决定遵循哪种分支策略。以下是可以探索的几篇文章：\n   \
  \ 1. 这是 Git 官方网站的一篇文章：[`git-scm.com/book/en/v2/Git-Branching-Branching-Workflows`](https://git-scm.com/book/en/v2/Git-Branching-Branching-Workflows)。\n\
  \    2. 这是 *Vincent Driessen* 提出的最早的 Git 工作流之一，至今仍被各组织引用：[`nvie.com/posts/a-successful-git-branching-model/`](https://nvie.com/posts/a-successful-git-branching-model/)。\n\
  \    3. 这是 GitHub 工作流：[`docs.github.com/en/get-started/quickstart/github-flow`](https://docs.github.com/en/get-started/quickstart/github-flow)。\n\
  \    4. 这是 GitLab 工作流：[`docs.gitlab.com/ee/topics/gitlab_flow.html`](https://docs.gitlab.com/ee/topics/gitlab_flow.html)。\n\
  \n一旦我们确定了分支工作流，我们需要关注最重要的 Git 命令，`git commit`。\n\n## 使用 git commit 时遵循良好实践\n\n代码更改完成后，我们将使用\
  \ `git commit` 命令。每个 `git commit` 命令都可以被视为日志簿，可用于识别过去所做的代码更改。因此，我们必须为每次提交编写适当的提交信息，以便\
  \ Git 历史记录具有相关性，并且可以轻松识别代码更改。\n\n提交信息是 SDLC 中最重要的元素之一。它们用于识别对代码所做的任何更改。开发者必须为每次提交编写适当的提交信息，以创建可维护的代码。让我们讨论一下在行业中广泛使用的几种标准提交信息格式。\n\
  \n### Conventional Commits\n\nConventional Commits 文档说明如下：\n\n*The Conventional\
  \ Commits specification is a lightweight convention on top of commit messages. It\
  \ provides an easy set of rules for creating an explicit commit history; which makes\
  \ it easier to write automated tools on top of.*\n\nConventional Commits 指南建议提交信息应按如下结构组织：\n\
  \n```\n<type>[optional scope]: <description>\n[optional body]\n[optional footer(s)]\n\
  ```\n\n这有助于轻松识别代码更改反映了何种类型的工作，并且你还可以根据提交信息编写自动化工具和工作流。提交信息中提到的 `<type>` 有助于识别特定提交引入了何种类型的更改。`scope`\
  \ 定义了更改的范围。最后，在 `description` 块中，我们添加对整体更改的简短描述。Conventional Commit 文档提供了适当的示例来解释不同类型的提交信息。有关更多详细信息，请访问\
  \ [`www.conventionalcommits.org/`](https://www.conventionalcommits.org/)。\n\n###\
  \ 在提交信息中使用 JIRA 和 GitHub Issues\n\n项目管理工具用于跟踪开发工具的进度。例如，所有托管在 GitHub 上的开源项目都使用 GitHub\
  \ Issues 来跟踪任何功能请求/错误。当我们在提交信息中添加 GitHub issue 编号时，GitHub 会自动链接代码提交和 issue。这有助于团队协调积极跟踪给定任务的任何进展。同样，重新审视代码提交历史有助于了解任何代码更改的\
  \ what、why 和 how。\n\n如果你的团队使用 JIRA 或其他工具进行项目管理，那么在提交信息中添加 JIRA ID 有助于更快、更好地识别和标记问题。行业中使用了不同的格式，最好在团队内部讨论以确定最适合团队的提交信息格式。让我们看一下常用的格式之一：\n\
  \n```\n<type> [<JIRA ID>]: <Short description>\n```\n\nRead more\n\n有关更多详细信息，请访问\
  \ GitHub 官方文档，了解如何高效使用 GitHub Issues：[`docs.github.com/en/issues/tracking-your-work-with-issues/about-issues`](https://docs.github.com/en/issues/tracking-your-work-with-issues/about-issues)。要使用\
  \ GitHub 集成 JIRA 或其他项目管理工具，请访问 [`github.blog/2019-10-14-introducing-autolink-references/`](https://github.blog/2019-10-14-introducing-autolink-references/)。\n\
  \n随着团队的成长和项目的演进，添加可以强制执行提交信息格式的自动化工具非常重要。有一些工具可以帮助你强制执行良好的提交信息结构。建议读者阅读工具的官方文档并了解更适合自己的工具：\n\
  \n* `commitlint` ([`github.com/conventional-changelog/commitlint`](https://github.com/conventional-changelog/commitlint))\n\
  * `gitlint` ([`github.com/jorisroovers/gitlint`](https://github.com/jorisroovers/gitlint))\n\
  * `commitizen` ([`github.com/commitizen-tools/commitizen`](https://github.com/commitizen-tools/commitizen))\n\
  * `cz-cli` ([`github.com/commitizen/cz-cli`](https://github.com/commitizen/cz-cli))\n\
  \n现在，让我们学习一些可以帮助开发者更轻松地使用 Git 的工具。\n\n## 与 Git 相关的工具\n\n市场上有很多工具可以帮助我们更好地进行版本控制。让我们看看可以探索的顶级工具：\n\
  \n* `git-sim` ([`github.com/initialcommit-com/git-sim`](https://github.com/initialcommit-com/git-sim))：当你是一个初学者时，了解\
  \ Git 中不同命令的作用可能会令人望而生畏。git-sim 是一个命令行可视化工具，可以帮助初学者理解基本命令的作用。\n* **GitHub Desktop**：GitHub\
  \ Desktop 是 Git 的 GUI。它是平台无关的，可用于不同的代码托管平台，例如 GitLab 和 Bitbucket。\n* **GitKraken**：GitKraken\
  \ 是最古老的 Git GUI 之一，也是市场上最受欢迎的 GUI 工具之一。\n\n我们学习了如何创建新分支，然后进行提交。我们看到了分支名称应如何命名以及什么是良好的提交信息的最佳实践，但如何确保开发者遵循这些指南呢？这就是\
  \ Git hooks 概念发挥作用的地方。\n\n## 将 Git hooks 集成到 Django 项目中\n\n\n\n\n\nGit 有一种方法可以在\
  \ Git 中发生某些重要操作时执行自定义脚本；这些自定义事件触发器被称为 Git hooks。Git 提供了两种类型的 hooks：客户端 hooks 在开发者机器上运行，并处理诸如\
  \ `commit`、`merge` 和 `push` 等事件，而服务器端 hooks 在远程服务器上运行，并处理诸如 `pre-receive` 和 `post-receive`\
  \ 等事件。Git hooks 位于 `.git/hooks` 文件夹中。可以轻松创建 Git hooks 并将其集成，不同的框架可以帮助我们使用它们。我们不详细介绍如何手动添加自定义\
  \ hook，而是使用 `lefthook` 框架。虽然 `pre-commit` 是 Python 生态系统中最受欢迎的 Git hook 框架之一，但我们不会使用\
  \ `pre-commit`。相反，我们将学习如何使用 `lefthook`，因为它更快、更灵活。\n\n## 使用 lefthook\n\n`Lefthook`\
  \ 是一个用 Go 编写的 Git hook 管理器。由于它是一个无需依赖的二进制文件，因此易于在任何环境中安装和运行。它可以并行运行命令，这使其比 `pre-commit`\
  \ 快 3 倍，并且比大多数可用的 Git hook 管理器更快。Lefthook 文档正在不断完善，但社区非常活跃，并在解决任何阻塞问题方面提供支持。更多详情，请查看项目仓库\
  \ [`github.com/evilmartians/lefthook`](https://github.com/evilmartians/lefthook)。\n\
  \n现在，让我们看看如何将 `lefthook` 集成到我们的 Django 项目中。官方文档详细说明了如何安装它：[`github.com/evilmartians/lefthook/blob/HEAD/docs/install.md`](https://github.com/evilmartians/lefthook/blob/HEAD/docs/install.md)。\n\
  \n对于 Mac 系统，我们可以使用 `homebrew` 使用以下命令安装 lefthook：\n\n```\nbrew install lefthook\n\
  ```\n\nLinux 用户可以通过 APT 包管理器安装 lefthook：\n\n```\ncurl -1sLf 'https://dl.cloudsmith.io/public/evilmartians/lefthook/setup.deb.sh'\
  \ | sudo -E bash\nsudo apt install lefthook\n```\n\n对于 Windows 用户，可以使用 scoop（[`scoop.sh/`](https://scoop.sh/)）安装\
  \ lefthook：\n\n```\nscoop install lefthook\n```\n\n或者，Windows 用户也可以使用 winget 安装\
  \ lefthook（[`github.com/microsoft/winget-cli`](https://github.com/microsoft/winget-cli)）：\n\
  \n```\nwinget install evilmartians.lefthook\n```\n\n现在，让我们将 lefthook 集成到我们的项目中。为了学习\
  \ lefthook，我们将创建一个简单的项目：\n\n1. 创建一个 `demo-project` 文件夹并添加一个新的 `demo-project/demo_script.py`\
  \ 文件，内容如下：\n\n```\ndef hello_world():\n    print(\"hello world\")\nhello_world()\n\
  ```\n\n2. 使用以下命令向该文件夹添加 `git`：\n\n```\ngit init\n```\n\n3. 现在，我们将使用以下命令将 `lefthook`\
  \ 添加到项目中：\n\n```\nlefthook install\n```\n\n该命令将在项目文件夹中添加一个新的 `lefthook.yaml` 文件，其中包含大量被注释的示例命令。\n\
  \n4. 让我们添加一个示例 Git hook，该 hook 将检查生成的 `lefthook.yaml` 文件中的配置，其中包含示例检查：\n\n```\n\
  pre-commit:\n  commands:\n    demo-echo:\n      run: echo \"Just Demo command\"\n\
      demo-echo2:\n      run: echo \"Just Demo command 2\"\n```\n\n5. `pre-commit`\
  \ 命令在开发者进行提交时运行。因此，当我们执行 `git commit` 命令时，我们会看到 Lefthook 运行以下自定义 hooks：\n\n```\n\
  > git commit -am \"Init commit\"\n lefthook v1.5.5  hook: pre-commit\n┃  demo-echo\
  \ ❯\nJust Demo command\n┃  demo-echo2 ❯\nJust Demo command 2\n  ────────────────────────────────────\n\
  summary: (done in 0.03 seconds)\n✔️  demo-echo\n✔️  demo-echo2\n[main 30019a4] Init\
  \ commit\n 2 files changed, 9 insertions(+)\ncreate mode 100644 demo_script.py\n\
  ```\n\n所使用的 `echo` 命令可以轻松替换为我们想要执行的任何其他命令。\n\nLefthook 本质上是多功能的，可以用于在不同的编程语言中添加\
  \ Git hooks，例如 Python、Javascript 和 Shell Script。\n\n阅读更多\n\n更多详情，请访问 lefthook 的官方文档，其中解释了它提供的所有功能：[`github.com/evilmartians/lefthook/blob/master/docs/usage.md`](https://github.com/evilmartians/lefthook/blob/master/docs/usage.md)。\n\
  \nlefthook 的美妙之处在于它是语言无关的，因此我们可以使用 lefthook 为不同语言创建 Git hooks。以下是一些我通常配置的 lefthook\
  \ 脚本：\n\n* 使用 Black 和 Flake8 对所有暂存文件进行 Linting\n* 强制分支名称符合约定\n* 强制提交信息格式符合约定\n*\
  \ 阻止任何大文件被提交到仓库\n\nLefthook 有助于客户端 Git hooks。另一种类型的 Git hook 是服务器端 hook。不幸的是，GitHub\
  \ 不支持服务器端 hooks。但这种自定义逻辑可以使用 GitHub Actions 实现，并且每当开发者不遵循指南时，我们将使 GitHub Actions\
  \ 流水线失败。\n\n现在我们已经学会了如何强制开发者遵守指南，让我们专注于如何合并我们的代码更改并发布代码。\n\n## 使用 git merge 与 git\
  \ rebase\n\n`git merge` 和 `git rebase` 各有优缺点。在 *Figure 12.1* 中，我们可以看到使用 `git merge`\
  \ 或 `git rebase` 命令时提交历史如何受到影响。因此，根据使用场景，开发者应选择使用 `git merge` 还是 `git rebase`。但将该选项留给开发者也可能很危险，特别是如果你的团队有很多初级开发者。因此，我通常更喜欢在团队中创建流程时选择\
  \ `git merge` 作为默认选项，因为它易于理解，因此每个人出错的可能性都很小。\n\n使用 `git merge` 的优点如下：\n\n* 它保留完整的仓库历史\n\
  * 它使在不同分支之间解决冲突变得容易\n* 它使撤销任何代码更改变得容易\n\n![Figure 12.1: Image illustrating git merge\
  \ versus git rebase](img/Figure_12.1_B18867.jpg)\n\nFigure 12.1: Image illustrating\
  \ git merge versus git rebase\n\nGitHub 和其他类似平台在合并时通过 UI 提供了另一个选择（即 `Create a merge\
  \ commit` 或 `Squash and merge`）。两者各有优缺点，取决于情况。选择 `Squash and merge` 的最大优点是它能保持提交历史干净，但缺点是会丢失所有提交的历史记录。而\
  \ `Create a merge commit` 选项只会添加一个新的合并提交，并且过去的提交历史保持完整，我更喜欢在大多数使用场景中采用 `Create a\
  \ merge commit` 选项。\n\n一旦代码合并，我们就可以部署代码并向用户发布功能。\n\n## 执行代码发布\n\n将代码部署到生产环境是任何开发者最令人着迷的体验。看着自己的代码被数十、数千甚至数百万用户使用，绝对是一种极大的愉悦和喜悦。因此代码发布流程必须定义良好。每个团队都可以决定自己的代码发布流程；可以对每个服务器进行手动部署，也可以拥有复杂的\
  \ `continuous deployment`（`CD`）流程。\n\n我通常更喜欢为服务构建自动化的“一键部署”流程。在 *Chapter 13* 中，我们将讨论如何使用\
  \ GitHub Actions 和 AWS Elastic Beanstalk 执行一键部署。\n\n\n\n\n\n代码发布最重要的要点之一是使用 Git\
  \ 标签。我们应该始终为每次代码发布使用 Git 标签，这样我们才能识别出在服务器上运行的确切代码。每个发布都可以用版本号进行标记，行业中存在不同的版本策略，例如语义化版本控制（`<major>.<minor>.<patch>`）、构建号和日历版本控制。最常见的版本类型是语义化版本控制，大多数开源项目都使用语义化版本控制来跟踪其发布。\n\
  \n代码发布的另一个重要方面是 **changelog** 或 **release note**。Changelog 或发布说明帮助我们识别所有将进入生产环境的更改。如果我们维护良好的提交信息并跟踪在上一个发布和新发布之间合并的所有\
  \ PR，那么我们就可以轻松地汇总一份变更日志。众多工具可以帮助创建自动化的发布说明。\n\n没有开发者会故意将有 bug 的代码部署到生产环境，但不知怎么的，bug\
  \ 还是会潜入生产环境。因此，监控系统中的任何 bug 很重要。我们将在 *Chapter 14* 中学习更多关于如何进行应用监控的内容。现在让我们学习如何修复我们的代码。\n\
  \n## 对代码进行热修复\n\n修复生产环境中任何问题的第一个解决方案是 **revert**。开发者应始终先回滚自己的更改，然后再考虑修复 bug。它可能是一个单字符的更改就能修复代码，开发者可能想做小的代码更改来修复代码，但无法保证系统的稳定性。因此，始终建议先回滚对系统所做的任何代码更改，然后再尝试找到问题并解决它。开发者应始终优先考虑的是系统的稳定性以及避免影响产品的任何终端用户。\n\
  \n然而，并非总是可以回滚代码更改。在这些情况下，下一个最好的做法是从已发布的 Git 标签创建分支并在该分支上添加代码更改。不要部署任何除需要修复的代码之外的其他代码更改。\n\
  \n如果团队遵循上述步骤，那么任何代码发布都将始终顺利进行，因为团队将产品的稳定性和用户体验置于其他一切之上。\n\n现在，让我们探索如何使用 GitHub 和\
  \ GitLab 等云平台。\n\n# 使用 GitHub 和 GitHub Actions\n\nGitHub、GitLab 和 Bitbucket 等多个平台可以提供代码仓库托管解决方案。GitLab\
  \ 是一个开源项目，也可以用来托管我们自己的 GitLab 服务器。目前，GitHub 和 GitLab 是主要市场领导者。我们将在本书中讨论 GitHub，而不会涉及\
  \ GitLab；如果您使用 GitLab 或其他平台，可以跳过本节并进入本章的下一节。\n\n以下是我们希望读者在与 GitHub 协作时注意的几个重要功能/设置/配置：\n\
  \n*   **对于非个人项目，始终使用 Organization**：GitHub 提供创建组织的界面，这有助于更好地组织所有仓库。\n*   **为所有用户启用\
  \ 2FA**：代码库是组织中最敏感的组件之一，因此安全措施应是首要任务。\n*   **配置规则集**：分支规则集有助于强制执行如何使用给定分支/标签的规则。随着团队的增长，您可能不希望每个人都有权限将代码推送到特定分支。\n\
  *   **自动删除 head 分支**：这会在合并后自动删除分支。\n*   **GitHub Copilot**：GitHub Copilot 是一种 AI\
  \ 工具，可帮助开发者更快地编写代码。代码逻辑和其他关键编码概念应由开发者负责，但 Copilot 可以提高您的生产力。我一直在使用 Copilot 编写测试用例和其他低级代码，它帮助我更快地编写这些功能。\n\
  *   **使用 GitHub 代码所有者**：GitHub 代码所有者可以帮助更好地构建代码所有权。在仓库中，不同团队拥有代码的不同部分，因此使用代码所有者有助于定义所有权并改善代码审查流程。\n\
  *   **使用 GitHub Teams**：GitHub 提供团队功能；例如，前端开发者可以成为前端工程团队的一部分。\n*   **使用 Dependabot**：Dependabot\
  \ 是一个自动化的依赖更新机器人，会定期检查仓库中的安全修复。它可以被视为保护项目因所用软件包而引入的任何潜在漏洞的第一道防线。\n\nGitHub 提供了多个其他功能，每个团队对其都有不同的需求和用例。建议读者使用所有相关功能和自动化步骤，以帮助他们提高生产力。现在让我们看看如何使用\
  \ GitHub Actions 创建自己的 CI 流水线。\n\n## 使用 GitHub Actions 进行 CI 流水线\n\n作为开发者，我们不断尝试自动化所有重复性任务、简化工作流程并确保代码的顺利部署。Jenkins、CircleCI、Travis\
  \ CI 和 GitHub Actions 等工具帮助我们实现此类自动化工作流。GitHub Actions 可用于 CI/CD 流水线，可帮助我们自动化工作流，从而提高开发团队的生产力。在本节中，我们将学习如何利用\
  \ GitHub Actions 为 Django 项目自动化工作流。\n\nRead more\n\nGitHub Actions 的快速入门指南解释了如何开始使用\
  \ GitHub Actions。我们希望读者熟悉 GitHub Actions 的基础知识，或在进入下一节之前遵循该指南以快速上手：[`docs.github.com/en/actions/quickstart`](https://docs.github.com/en/actions/quickstart)。\n\
  \n现在，让我们学习如何为 Django 项目设置 CI 流水线。\n\n## 使用 GitHub Actions 为 Django 设置 CI 流水线\n\n\
  CI 被认为是软件开发的最佳实践之一，它帮助开发者将代码合并到共享分支，例如 **main** 分支，然后自动化步骤开始运行自动化测试和构建。经常被误解的是 CI\
  \ 流水线仅在我们想要自动化构建和部署时才有帮助，但实际上，CI 流水线有助于提高开发者生产力。例如，当开发者编写功能并将代码推送到其分支时，一个良好的 CI\
  \ 流水线、自动化单元和集成测试可以针对其分支运行，以尽早发现任何潜在的 bug/问题。\n\n现在，让我们学习如何创建运行 Django 项目单元测试的基本操作。\n\
  \nImportant note\n\n只有当项目父文件夹中存在 `.github` 文件夹时，GitHub Actions 才会工作。因此，本书官方 Git\
  \ 仓库中的代码示例将无法工作。请按照代码部分中提到的说明创建您的操作：[`github.com/PacktPublishing/Django-in-Production/tree/main/Chapter12#setting-up-ci-pipeline-for-django-using-github-actions`](https://github.com/PacktPublishing/Django-in-Production/tree/main/Chapter12#setting-up-ci-pipeline-for-django-using-github-actions)。\n\
  \n### 使用示例设置 GitHub Actions\n\n我们将在有人将代码推送到 GitHub 时运行 Django 单元测试。\n\n在 `.github/workflows/django-ci.yaml`\
  \ 中创建文件并添加以下代码。我们正在定义我们的操作并设置正确的环境变量：\n\n\n\n\n\n```\nname: Django CI Test Cases\n\
  on: push # Run this Action on every code push made.\nenv:\n  DB_NAME: blog_testdb\n\
    DB_USERNAME: root\n  DB_PASSWORD: root\n  DB_HOSTNAME: 127.0.0.1\n  DB_PORT: 5432\n\
    DB_ENGINE: django.db.backends.postgresql\n  REDIS_HOST: 127.0.0.1\n  REDIS_PORT:\
  \ 6379\n  REDIS_PASSWORD: redisPassWord\n```\n\n工作流的名称使用 `name` 属性定义；在此我们将工作流命名为\
  \ `CI Django Test Cases`：\n\n```\nname: CI Django Test Cases\n```\n\n`on` 属性定义工作流应何时执行。多个事件可以触发\
  \ GitHub Actions；请查阅官方文档了解更多详情：https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows：\n\
  \n```\non: push\n```\n\n`env` 部分与环境变量相同。它用于为代码仓库设置任何环境变量值。我们在此使用 `env` 属性设置 Postgres\
  \ 凭据：\n\n```\nenv:\n  DB_NAME: blog_testdb\n  ... # Other environment variables\
  \ as needed\n```\n\n现在，让我们在 `.github/workflows/django-ci.yaml` 配置文件中添加 GitHub jobs。请注意，我们是将代码追加到前一节：\n\
  \n```\njobs:\n  # Label of the container job\n  container-job:\n    runs-on: ubuntu-latest\n\
      services:\n      postgres:\n        image: postgres:latest\n        env:\n          POSTGRES_USER:\
  \ root\n          POSTGRES_PASSWORD: root\n          POSTGRES_DB: blog_testdb\n\
          ports:\n          - 5432:5432\n        # Set health checks to wait until\
  \ Postgres has started\n        options: >-\n          --health-cmd pg_isready\n\
            --health-interval 10s\n          --health-timeout 5s\n          --health-retries\
  \ 5\n      redis:\n        image: redis:latest\n        ports:\n          - 6379:6379\n\
  ```\n\n在 `job` 属性部分内，我们可以定义工作流的多个 jobs。例如，如果我们想在同一个工作流中运行 linting、单元测试和集成测试，那么我们可以创建不同的\
  \ jobs。在我们的例子中，我们创建了 `container-job`（注意 – 它可以取任何名称），它运行 Django 测试。\n\n`runs-on`\
  \ 属性定义 job 执行的基础层。除非有特定的需求或定制需求，否则建议从 `ubuntu-latest` 开始：\n\n```\nruns-on: ubuntu-latest\n\
  ```\n\n`services` 属性定义 job 所需的所有外部服务。例如，我们需要 Postgres 来运行单元测试，因为我们的 Django 应用连接了数据库。同样，我们也可以将\
  \ Redis 作为单独的服务连接到此 job。更多详情请查阅官方文档：https://docs.github.com/en/actions/using-containerized-services/about-service-containers。\n\
  \n现在让我们为我们的 actions 添加 `steps`：\n\n```\njobs:\n  container-job:\n    services:\n\
        . . . # Service config\n    steps:\n      - uses: actions/checkout@v3\n      -\
  \ name: Set up Python 3.11\n        uses: actions/setup-python@v3\n        with:\n\
            python-version: 3.11\n      - name: Install Dependencies\n        run:\
  \ |\n          cd backend\n          python -m pip install --upgrade pip\n          pip\
  \ install -r requirements/requirements-local.txt\n      - name: Run Django migrations\n\
          run: |\n          cd backend\n          python manage.py migrate\n      -\
  \ name: Running Django Test cases\n        run: |\n          cd backend\n          python\
  \ manage.py test --no-input\n```\n\n在设置好 services 后，我们现在将定义 `steps`。在 `steps` 中，我们将把\
  \ job 中需要执行的全部命令分组：\n\n```\nsteps:\n     - uses: actions/checkout@v3\n     - name:\
  \ Set up Python 3.11\n       uses: actions/setup-python@v3\n       with:\n         python-version:\
  \ 3.11\n```\n\n首先，我们使用 `uses: actions/checkout@v3` GitHub Actions job 从仓库检出代码并使其可用，然后为代码执行设置\
  \ Python 版本。\n\n下一步是通过使用 `pip install -r requirements/ci-requirements.txt` 命令安装依赖：\n\
  \n```\n     - name: Install Dependencies\n       run: |\n         cd backend\n         python\
  \ -m pip install --upgrade pip\n         pip install -r requirements/requirements-local.txt\n\
  ```\n\n`name` 属性用于为 job 中的某个步骤命名；在 GitHub Actions UI 中，使用名称可以轻松识别步骤。\n\n```\n     -\
  \ name: Run Django migrations\n       run: |\n        cd backend\n        python\
  \ manage.py migrate\n     - name: Running Django Test cases\n       run: |\n        cd\
  \ backend\n        python manage.py test --no-input\n```\n\n在我们的自定义 actions 中，我们连接了\
  \ Postgres 数据库，然后每当有人进行代码提交并将代码推送到 GitHub 时运行 Django 测试用例。在我们的示例中，我们执行了一个简单的操作，即每次开发者进行代码推送时都运行\
  \ Django 测试用例。\n\n### 测试 GitHub Actions\n\n现在，我们准备运行与 Django 相关的命令。首先，我们在 Django\
  \ 项目上运行迁移，然后执行 Django 测试用例。如果我们的测试用例通过，则我们将在 GitHub Actions 流水线中看到成功；否则，我们会看到失败的测试用例。\n\
  \n每当我们将代码更改推送到 GitHub 服务器时，我们的流水线将被自动触发。我们可以使用以下命令进行代码提交并推送代码：\n\n```\ngit commit\
  \ -am \"Test pipeline\"\ngit push\n```\n\n这将把本地更改推送到远程 GitHub 仓库并触发流水线。我们可以看到 *Figure\
  \ 12.2* 显示工作流成功运行，其标题与我们的 `git commit` 消息相同：\n\n![Figure 12.2: Showing GitHub Actions\
  \ pipeline triggered on code push](img/Figure_12.2_B18867.jpg) \n\n图 12.2：显示代码推送时触发的\
  \ GitHub Actions 流水线\n\n当我们进入工作流时，我们只能看到一个条目，因为我们只定义了一个 job。对于复杂项目，可能存在多个 jobs。*Figure\
  \ 12.3* 显示我们在推送代码时 job 的运行情况：\n\n![Figure 12.3: Showing a GitHub job](img/Figure_12.3_B18867.jpg)\
  \ \n\n图 12.3：显示一个 GitHub job\n\n当我们再次进入 `container-job` 时，我们可以看到我们在 `django-ci.yaml`\
  \ 文件中定义的所有步骤。*Figure 12.4* 显示正在运行的所有步骤：\n\n![Figure 12.4: Showing all the steps\
  \ we have configured in our django-ci.yaml file](img/Figure_12.4_B18867.jpg) \n\n\
  图 12.4：显示我们在 django-ci.yaml 文件中配置的所有步骤\n\nGitHub Actions 可以被视为一个远程服务器，可以执行开发者能够在服务器上执行的任何任务。同样，我们可以向我们的\
  \ CI 流水线添加更多 actions。以下是一些我推荐使用的 actions：\n\n*   **代码覆盖率阈值**：为每次代码推送添加代码覆盖率阈值测试将确保开发者积极追求编写单元测试，以确保系统的稳定性\n\
  \n*   **代码 linter**：应启用 Linting，这样如果开发者未设置 Git hooks 和本地 linter，则可以在 GitHub 流水线中捕获\n\
  \n*   **运行 Git hooks**：始终建议使用 GitHub Actions 重新运行所有客户端 Git hooks，这样如果某些开发者未设置或绕过检查，则可以轻松捕获\n\
  \n*   **Slack/Teams/Email 通知器**：如果你的团队使用 Slack 或 Teams，你应该将 Slack 集成到所有重要操作中，以便通知并将所有重要通信直接发送为个人消息或群组消息\n\
  \n现在，让我们学习在使用 GitHub Actions 时的一些良好实践：\n\n\n\n\n\n*   **始终使用缓存**：GitHub Actions\
  \ 支持步骤缓存；使用缓存可以提高诸如 `pip install` 这样长时间运行的重复步骤的执行时间。更多详情，请访问 [`github.com/actions/cache`](https://github.com/actions/cache)。\n\
  \n*   **创建语义化版本**：我们已经学会了如何为项目使用语义化版本控制；建议使用 GitHub Actions 来发布版本。同样，我们可以为每次发布创建自动化的发布说明。\n\
  \n*   **在本地验证 GitHub Actions**：验证 GitHub Actions 变得很具挑战性，因为 YAML 配置中的每次更新都意味着我们必须再次运行流水线。因此，更好的验证更改方式是使用\
  \ [`github.com/nektos/act`](https://github.com/nektos/act) 项目。\n\n*   **上传构建产物**：随着团队的成熟，会有使用相同构建步骤和构建产物的操作，因此与其重复相同的构建/创建过程，建议使用\
  \ `actions/upload-artifact` 在作业之间共享构建产物。更多详情，请访问 [`github.com/actions/upload-artifact`](https://github.com/actions/upload-artifact)。\n\
  \n## 推荐的 GitHub Actions 资源\n\n自 2018 年推出 GitHub Actions 以来，使用 GitHub 中的 CI 流水线的体验不断改善。每周，开发者都会创建更多面向\
  \ GitHub Actions 的开源项目，并在全球范围内与不同开发者分享。因此，在从零开始构建任何 GitHub Actions 之前，我建议先去搜索现有的\
  \ Actions，看看它们是否能解决你的使用场景。我通常会先去 [`github.com/sdras/awesome-actions`](https://github.com/sdras/awesome-actions)\
  \ 搜索相关 Actions，然后再考虑自定义构建。然而，也应检查该 Action 是否仍在维护中。我在使用任何第三方 Action 之前通常会问以下问题：\n\
  \n*   有多少用户使用过该 Actions？我们可以在 GitHub 项目仓库页面上找到此信息。\n\n*   项目中的活跃问题有哪些？社区是否积极响应 GitHub\
  \ Issues？活跃问题中是否有项目维护者未处理的 安全漏洞？\n\n*   项目上次进行代码更新是什么时候？\n\n*   该 Actions 有多少星标？\n\
  \n上述问题只能被视为一个大纲，可帮助开发者决定是否应使用第三方 GitHub Actions。\n\n现在，让我们查看一些我经常使用的顶级 Actions，除了官方的\
  \ GitHub Actions 之外：\n\n*   在代码仓库上执行某些操作时通过流水线发送 slack 消息，例如部署（[`github.com/marketplace/actions/slack-send`](https://github.com/marketplace/actions/slack-send)）\n\
  \n*   使用 GitHub Actions 执行代码规范检查（[`github.com/marketplace/actions/super-linter`](https://github.com/marketplace/actions/super-linter)）\n\
  \n*   检查代码仓库中是否意外提交了任何密钥（[`github.com/marketplace/actions/trufflehog-oss`](https://github.com/marketplace/actions/trufflehog-oss)）\n\
  \n一旦我们的功能经过测试并且所有流水线都已通过，我们接下来的任务就是执行代码审查。代码审查是任何对代码库所做代码更改的质量保证流程。它是开发周期中备受喜爱且同样令人讨厌的流程之一。如果代码审查流程得到正确实施，可以帮助为开发者创造出色的体验并加速产品开发周期。但如果代码审查流程实施不当，则可能成为公司速度的瓶颈，开发者可能会对进行代码审查感到敌意，有时甚至会造成更多问题。代码审查流程应由团队的早期成员实施，并应随着公司/产品/团队的成长而持续改进和调整。没有确定的指导方针，团队成员需要制定适合其情况的指导方针。然而，让我们来看一下业界遵循的几个代码审查指导方针。\n\
  \n# 设置代码审查指南\n\n代码审查是对代码库中任何代码更改的质量保证流程。它是开发周期中备受喜爱且同样令人讨厌的流程之一。如果代码审查流程得到正确实施，可以帮助为开发者创造出色的体验并加速产品开发周期。但如果代码审查流程实施不当，则可能成为公司速度的瓶颈，开发者可能会对进行代码审查感到敌意，有时甚至会造成更多问题。代码审查流程应由团队的早期成员实施，并应随着公司/产品/团队的成长而持续改进和调整。没有确定的指导方针，团队成员需要制定适合其情况的指导方针。然而，让我们来看一下业界遵循的几个代码审查指导方针。\n\
  \n## 上下文和描述\n\n每当代码更改被发送进行审查时，确保在 PR 中添加良好的上下文和描述有助于产生更好、更快的审查。我们可以添加以下内容：\n\n*\
  \   **What?**：代码更改打算实现什么？解释我们试图通过代码更改实现的结果。你应在此处添加所有上下文并提及所有相关的非技术文档（如果适用）。\n\n\
  *   **How?**：解决方案在代码中是如何实现的？给出代码实现的高层次概述。在此部分附上任何架构文档或设计文档也很有帮助。\n\n*   **Why?**：为什么我们要实施代码更改（如果适用）？\n\
  \n尽管本书主要关注后端更改，但代码审查指导方针可适用于不同的编码团队。我们应始终尝试在 PR 描述中附上与代码更改相关的所有截图或视频链接。\n\n## 短小的代码更改以便审查\n\
  \n创建良好的代码审查流程最关键的要素之一是确保代码更改简短。设定 PR 中最多审查 300-500 行代码的指导方针有助于创建良好的流程。\n\n但那么需要超过\
  \ 1,000-2,000 行更改的功能该如何审查呢？对于此类功能，最好始终拥有一个主功能分支，并让开发者创建较小的功能分支并将其合并到主功能分支中。通过这种方法，代码审查者将始终拥有较小的代码更改需要审查，并且一旦代码更改合并到主功能分支，更容易浏览对庞大分支所做的所有更改并进行审查。\n\
  \n## 代码准备好时再审查\n\n代码审查应在 PR 准备好审查时才进行。我们可以使用一些检查清单来帮助开发者了解他们的代码是否已准备好进行审查。以下是一些我通常遵循的检查清单项目：\n\
  \n*   删除所有调试语句或打印语句或任何注释语句（这些可以由代码规范检查工具本身处理）。\n\n*   在开发环境中测试代码更改。\n\n*   确保没有合并冲突。\n\
  \n*   单元测试和集成测试已添加到代码中，并且所有测试都已通过。另请确保代码测试覆盖率符合团队标准。\n\n*   PR 描述是自解释的。\n\n*   确保代码遵循编码规范标准。\n\
  \n每个团队都会创建一份详尽的检查清单供团队内部使用。\n\n## 良好的代码审查者\n\n一旦 PR 已勾选所有复选框，现在代码审查者的任务就开始了。代码审查者最重要的事情是确保你对请求审查的人保持同理心。以下是一些我通常在优秀代码审查者身上看到的良好品质/要点：\n\
  \n*   **尊重**：代码审查者最重要的品质是在进行代码审查时保持尊重。没有任何评论应涉及个人或贬低。\n\n*   **详细**：能够详细说明评论背后的理由的代码审查者总是更受程序员青睐。\n\
  \n\n\n\n\n*   **专门的时间**：随着项目的增长，团队自然会加入更多开发者，代码评审请求也会增多。每天分配时间进行代码评审有助于保持流程顺畅，并在规划任何工作时确保已考虑代码评审所需的时间。\n\
  \n*   **面对面交流**：如果代码变更不清晰或请求的变更足够大，最好与对方交谈并讨论变更，而不是写评论并进行过多的来回沟通。\n\n*   **关注核心问题**：代码评审者应主要关注核心问题、边界情况、错误、架构问题、代码可读性和可维护性。其他问题如糟糕的变量名和拼写错误对代码评审者指出也很重要，但这些不应是代码评审的主要议程。\n\
  \n*   **评审测试代码**：虽然很多评审者不评审测试代码，但确保代码评审者关注评审测试代码很重要，因为测试用例主要有助于及早发现错误，而拥有测试覆盖率始终能提高任何功能的开发速度。\n\
  \n*   **安全和漏洞**：代码评审者应始终询问并确认是否向代码中引入了任何安全和漏洞变更，以及它们是如何处理的。\n\n*   **制定代码评审清单**：制定代码评审清单很重要，这样代码评审者在评审代码时就能涵盖所有重要要点。\n\
  \n代码评审需要时间，这是一种需要在团队内部建立的文化。随着项目和团队的成熟，代码评审流程会得到改进。重要的是要确保团队的早期成员树立正确的文化和代码评审流程，以便新成员加入团队时易于遵循。\n\
  \n# Summary\n\n在本章中，我们学习了如何高效使用 Git。我们探索了不同的推荐良好实践，这些实践可以简化 SDLC 并有助于编写更好的可维护代码。Git\
  \ hooks 可以帮助我们自动化大量 linting，我们也学习了如何在项目中使用 Git hooks。我们还看到了如何在 Django 项目中使用 GitHub\
  \ 和 GitHub Actions，这可以帮助我们自动化多个工作流。代码评审是一个需要指导的过程，我们学习了如何为代码评审创建不同的指导方针。我们还看到了 PR\
  \ 评审的不同方面，以及如何在团队中实施 PR 评审指导方针以改善良好的编码文化。\n\n在下一章中，我们将探索如何使用 **Amazon Web Services**\
  \ (**AWS**) 将我们的 Django 代码部署到云端。AWS 目前是市场上领先的云服务提供商。我们将在下一章中讨论更多关于 AWS 的内容，并学习如何使用\
  \ AWS 部署我们的 Django 应用。\n"
- '# Part 4 – Deploying and Monitoring Django Applications in Production


  AWS 是领先的云提供商，在行业中被广泛用于托管 Web 应用。在本部分，我们将学习如何使用 AWS 部署我们的 Django 应用。我们将使用 Amazon
  RDS、Amazon ElastiCache、AWS Elastic Beanstalk 和其他 AWS 服务在生产环境中托管我们的 Django 应用。在本部分，我们还将学习如何监控我们的
  Django 应用。我们将学习如何将不同的工具集成到我们的 Django 应用中，例如错误监控工具（如 Rollbar）和 **Application Performance
  Monitoring** (**APM**) 工具（如 New Relic）。


  本部分包含以下章节：


  *   *Chapter 13*，*Deploying Django in AWS*

  *   *Chapter 14*，*Monitoring Django Applications*


  # Chapter 13

  '
- "# Deploying Django in AWS\n\n在 *Chapter 12* 中，我们学习了如何使用版本控制并使用 CI 流水线高效运行测试用例并验证我们的代码变更。在本章中，我们将朝着开发周期迈出下一步：学习如何在生产环境中部署我们的\
  \ Django 应用。虽然大多数书籍只涵盖应用代码开发，但我们将更进一步，确保学习如何在生产环境中部署我们的代码。我们将使用 **Amazon Web Services**\
  \ (**AWS**) 作为平台来部署我们的 Django 代码。还有其他云提供商可供选择，例如 Azure、**Google Cloud Platform**\
  \ (**GCP**) 和 Digital Ocean，但就所有主要云提供商而言，AWS 占据了三分之一的市场份额。这就是为什么我们将学习如何使用 AWS 来托管我们的\
  \ Django 应用。\n\n## Important note\n\nAWS 是一个庞大的主题，本身就是一本书。我们不会深入研究 AWS 的工作原理；相反，我们的主要重点是学习如何将我们的\
  \ Django 应用部署到 AWS。如果您或您的公司不使用 AWS，那么您可以跳过本章，因为本章与 AWS 紧密相关。\n\n本章将涵盖以下主题：\n\n*\
  \   学习 AWS 的基础知识\n*   集成 AWS 以部署 Django\n*   使用 GitHub Actions 和 Beanstalk 部署 Django\
  \ 应用\n*   使用 AWS 时遵循最佳实践\n\n# Technical requirements\n\n在本章中，我们将主要使用 AWS，特别是 Beanstalk、**Relational\
  \ Database Service** (**RDS**) 和 ElastiCache，因此我们期望您对 AWS 有一定的背景知识。AWS 为期 1 年的免费额度足以完成本章中提到的所有步骤。您还应拥有信用卡访问权限，以便在\
  \ AWS 创建账户，因为您需要输入信用卡详细信息。\n\n请注意，本章中使用的示例均在免费套餐范围内，因此如果您按照本书中提到的说明操作，将不会被收费。\n\n\
  如果您不熟悉 AWS，建议您在继续本章之前阅读由 *Prashant Lakhera* 所著的 *Packt Publishing* 出版的书籍 *AWS for\
  \ System Administrators*，因为我们期望您对云服务有一定经验。\n\n还有一本名为 *AWS Certified Developer –\
  \ Associate Guide* 的书籍，由 *Vipul Tankariya and Bhavin Parman*、*Packt Publishing*\
  \ 出版，涵盖了开发者如何入门 AWS 的更广泛主题。\n\n本章的代码可以在本书的 GitHub 仓库中找到，地址为 `https://github.com/PacktPublishing/Django-in-Production/tree/main/Chapter13`。\n\
  \n由于本章涉及 AWS 集成，您可能会遇到一些挑战，因此请随时在 Discord 频道提问。加入 Discord 频道的链接可以在本书的 GitHub 仓库中找到。\n\
  \n## Important note\n\n在本章中，我们将使用 AWS；所有示例和截图在我们出版本书时都是有效的。然而，AWS 不断改进并发布新功能，这可能会使说明/截图过时，因此我会尝试更新\
  \ GitHub 代码的 README 部分以提供最新说明。如果您有任何疑问，请遵循本书 GitHub 仓库中提到的说明或在 Discord 频道提问。\n\n\
  # Learning the basics of AWS\n\nAWS 是一种云服务，让我们能够在云端运行 Web 应用。AWS 拥有众多服务，可用于在网络上运行我们的应用并随着流量的增长进行扩展。在本节中，我们将介绍部署\
  \ Django 应用到生产环境所需使用的所有 AWS 服务的基础知识。\n\n## Creating an account in AWS\n\n首先，我们必须在\
  \ AWS 创建一个新账户。以下是创建 AWS 账户的简单步骤：\n\n1.  前往 `https://aws.amazon.com` 并进入 **Sign up**\
  \ 页面。\n2.  填写表单，如 *Figure 13.1* 所示：\n\n![Figure 13.1: AWS sign up page](img/Figure_13.1_B18867.jpg)\n\
  \nFigure 13.1: AWS sign up page\n\n\n\n\n\n1. 前往你的邮箱获取 AWS 发送的六位 OTP，并在下一屏幕中输入。\n\
  \n2. 填写注册表单中有关联系信息和业务信息的全部字段，如图 13.2 所示：\n\n![Figure 13.2: AWS sign up contact information](img/Figure_13.2_B18867.jpg)\
  \ \n图 13.2：AWS 注册联系信息\n\n3. 接下来，我们进入 `Billing information` 页面，如图 13.3 所示：\n\n![Figure\
  \ 13.3: Billing information with credit card details for AWS sign up](img/Figure_13.3_B18867.jpg)\
  \ \n图 13.3：AWS 注册的账单信息及信用卡详情\n\n在这里，我们需要输入信用卡详情。AWS 不会在使用服务之外收取任何费用。由于我们仅使用免费套餐服务，按照本章所述的说明操作时不应产生任何账单。然而，如果你担心账单金额，可以通过诸如\
  \ [`privacy.com`](https://privacy.com) 之类的服务创建 `virtual credit card` 并输入其信用卡详情；否则，使用余额较小的借记卡。\n\
  \n4. 通过提供有效的电话号码确认你的身份；AWS 会向其发送验证码。图 13.4 显示了验证步骤：\n\n![Figure 13.4: Entering a\
  \ phone number to verify your identity](img/Figure_13.4_B18867.jpg) \n图 13.4：输入电话号码以验证你的身份\n\
  \n5. 身份确认后，你必须选择一个支持计划。为学习目的，我们将选择 `Basic support – Free` 计划。支持计划在开发者使用 AWS 服务时需要帮助时很有用。对于在\
  \ AWS 上运行的任何生产应用程序，建议采用商业支持或企业支持，以更快地解决任何业务关键问题。在图 13.5 中，我们选择了 `Basic support –\
  \ Free` 计划。该计划可在未来升级：\n\n![Figure 13.5: Selecting an AWS support plan](img/Figure_13.5_B18867.jpg)\
  \ \n图 13.5：选择 AWS 支持计划\n\n至此，我们已完成注册并可访问 AWS 控制台。在下一节中，我们将对部署应用程序时将使用的所有 AWS 服务进行高层次概述。我们不会深入探讨任何服务，而是简要描述\
  \ AWS 服务的内容以及为何在我们的应用程序中使用它。我们将从学习 AWS 中的 `Identity and Access Management` (`IAM`)\
  \ 开始。\n\n## Identity and Access Management\n\nAWS 提供 IAM 服务来管理使用 AWS 服务的所有身份验证和授权。每当我们想向任何工程师甚至任何其他应用程序授予对\
  \ AWS 服务的访问权限时，我们需要在 IAM 中创建新用户。让我们来看一下 IAM 中使用的术语：\n\n* `User`: IAM 中的用户可以是获得 AWS\
  \ 资源访问权限的人员或应用程序。我们应为每位人员在 IAM 中创建新用户，而不是共享凭据。创建 IAM 用户是免费的。\n\n* `Group`: IAM 中的组是相似用户的集合。例如，假设我们希望客户支持的三个用户对\
  \ AWS S3 具有只读访问权限，而开发团队的 10 个用户对 AWS 服务具有读写访问权限。我们可以创建两个单独的组并将所有成员添加到各自的组中。现在，组中的每个成员都将对\
  \ AWS 服务具有统一的访问权限。\n\n* `Role`: IAM 中的角色是多个 IAM 策略的组合。一个用户可以将其多个角色附加到其 IAM 用户。例如，`EC2AdminRole`\
  \ 可以对 `Elastic Compute Cloud` (`EC2`) 服务具有读写访问权限，`RDSAdminRole` 可以对 RDS 具有读写访问权限，任何附加了这些角色的\
  \ IAM 用户都将对 EC2 和 RDS 具有读写访问权限。\n\n* `Policy`: 策略是 AWS 中的 JSON 文档，让我们可以指定谁有权访问什么资源以及允许执行何种操作。AWS\
  \ 中的策略是与角色、用户和用户组一起使用的细粒度访问控制，用于创建复杂的访问管理系统。\n\nIAM 的另一个重要方面是为终端上的任何操作设置 AWS CLI\
  \ 和 AWS SDK `boto3`。我们可以通过进入 `Security Credentials` 选项卡并点击 `Create access key` 按钮为给定用户创建新的\
  \ `Access key`。图 13.6 显示了为给定用户创建访问密钥的示例：\n\n![Figure 13.6: Using the AWS console\
  \ to get an access key from IAM](img/Figure_13.6_B18867.jpg) \n图 13.6：使用 AWS 控制台从\
  \ IAM 获取访问密钥\n\n始终将访问密钥保密。如果访问密钥 ever 泄露，请立即停用该密钥并尽快重新生成新的密钥。黑客拥有 AWS 访问密钥意味着他们可以控制你账户中的任何\
  \ AWS 服务。AWS 访问密钥绝不应提交到 Git 仓库。\n\n接下来，让我们学习最常用的 AWS 服务：EC2。\n\n## EC2\n\n`Amazon\
  \ EC2` 是一种提供云中安全、可调整大小的计算容量的 Web 服务。EC2 可被视为可用于任何计算目的的裸机服务器。这些是可根据需求配置的专用服务器。这很有帮助，因为公司无需担心硬件，如果其产品出现巨大增长，他们可以专注于代码应用程序逻辑，让\
  \ AWS 处理如何配置新服务器。AWS 对 EC2 实例采用标准且透明的按秒计费定价模型。这意味着你仅在 EC2 实例运行时才会被收费。如果它们被删除或停止，则不会产生额外费用。\n\
  \nEC2 实例可被视为任何 Web 应用程序最小的构建块。随着应用程序的增长，我们可以添加更多 EC2 实例来扩展应用程序。我们使用负载均衡器将所有此类 EC2\
  \ 实例放入一个桶中。\n\n## Elastic Load Balancer (ELB)\n\n`ELB` 是 AWS 的负载均衡服务，可将传入流量分发到多个\
  \ EC2 实例。在应用程序中使用负载均衡器可以为应用程序提供高可用性、更好的容错性和更好的可扩展性。AWS ELB 主要有三种类型的负载均衡器：\n\n* `Classic\
  \ load balancer`: 将传入应用程序流量分发到多个 Amazon EC2 实例\n\n* `Application load balancer`:\
  \ 根据内容路由 HTTP/HTTPS 流量\n\n* `Network load balancer`: 在传输层定向流量，适用于高性能场景\n\n我们将使用\
  \ AWS Elastic Beanstalk 部署我们的 Django 应用程序，而 Elastic Beanstalk 建议使用应用程序负载均衡器。在下一节中，我们将了解\
  \ AWS Elastic Beanstalk 以及为何应使用它来部署我们的 Django 应用程序。\n\n## Elastic Beanstalk\n\n\
  传统上，每当有人需要将 Web 应用程序部署到网络时，他们必须配置不同的服务器和服务。开发人员必须使用适当的基镜像配置 EC2 实例，配置 `auto-scaling\
  \ groups`，配置 `security groups`，添加 `load balancer`，然后将应用程序部署到基础设施。当我们有多个服务器时，我们必须创建蓝绿部署或使用\
  \ AWS 的 Code Deploy 等服务，以确保代码正确部署到服务器。\n\n根据 AWS 官方文档，Beanstalk 定义如下：\n\n“Elastic\
  \ Beanstalk 是一种用于部署和扩展 Web 应用程序和服务的服务。上传你的代码，Elastic Beanstalk 会自动处理部署——从容量配置、负载均衡和自动扩展到应用程序健康监控。”\n\
  \n在本章中，我们将使用 Elastic Beanstalk 将应用程序部署到生产环境。\n\n\n\n\n其他服务，例如 AWS Lightsail，可用于较轻的规模。我们有\
  \ ECS 和 EKS，它们是比 Elastic Beanstalk 更复杂的系统，对配置有更多控制。Elastic Beanstalk 有一个甜蜜点，可以处理相当大的规模，而且配置也不会太多，以至于在初始设置期间让开发人员感到不知所措。我们将在《Integrating\
  \ AWS Beanstalk to deploy Django》部分讨论如何设置和配置 Elastic Beanstalk 与 Django。\n\n现在，让我们学习如何在\
  \ AWS 中使用 Postgres。\n\n## RDS for Postgres\n\nAWS RDS 是 AWS 提供的一种托管数据库服务，可以运行 Postgres、MySQL、MariaDB、Oracle\
  \ 和 SQL 服务器，而无需涉及设置、操作和扩展数据库的额外设置。通过在 AWS 控制台上进行几次额外的点击，开发人员可以设置复制、进行备份、升级数据库版本以及扩展服务器大小。\n\
  \nRDS 免除了开发人员运行数据库服务器所需的所有基本维护和基础设施任务，使他们能够专注于应用程序构建。RDS 还开箱即用地提供安全功能，例如如何连接到数据库、加密和网络隔离。AWS\
  \ RDS 还提供增强的监控指标，可帮助我们分析 RDS 服务器的性能。\n\nAWS RDS 提供 12 个月的免费套餐，我们可以免费使用 RDS 服务——我们将在本章中利用免费套餐服务来跟随集成（在《Creating\
  \ an AWS RDS Postgres instance and connecting to Django》部分）。\n\n## ElastiCache for\
  \ Redis\n\nAWS ElastiCache 是 AWS 提供的一种托管服务，可通过 Redis 和 MemCache 提供缓存。与 RDS 类似，ElastiCache\
  \ 提供可扩展的缓存服务，开发人员可以在几分钟内设置 Redis 服务器，而无需过多涉及服务器配置的麻烦。通过使用 ElastiCache，我们可以轻松升级服务器、创建复制实例，并使用\
  \ AWS 控制台执行维护。AWS ElastiCache 提供 12 个月的免费套餐。我们将在本章中使用免费套餐服务，以便将 AWS ElastiCache\
  \ 和 Redis 集成到我们的 Django 项目中。\n\n## Security groups and network components\n\n安全组是\
  \ AWS 最重要的概念之一。AWS 中的每个服务都是隔离的。要连接到任何 AWS 服务，例如 RDS、ElastiCache、EC2 实例等，我们必须配置安全组。通俗地说，安全组是一个防火墙，可以控制流向和流出资源的流量。我们可以创建任意数量的安全组，并且是免费的。我们将在《Integrating\
  \ AWS Elastic Beanstalk to deploy Django》部分中利用 Elastic Beanstalk 创建的默认安全组，将 Django\
  \ 与 Elastic Beanstalk 集成。\n\n## AWS Secrets Manager\n\nAWS Secrets Manager 是一种机密管理服务，可帮助我们处理对应用程序、服务和资源的访问。这有助于我们轻松轮换、管理和检索数据库凭据、API\
  \ 密钥以及其他容易受到攻击且不应共享的机密。Secrets Manager 是一种付费服务，每月每个密钥收费 $0.40。AWS 还提供 1 个月的免费试用。我们将在本章中利用\
  \ 1 个月的免费试用，学习和探索如何将 AWS Secrets Manager 集成到我们的 Django 项目中。我们将使用 Secrets Manager\
  \ 保存应用程序机密，然后在《Deploying a Django application using GitHub Actions in Elastic Beanstalk》部分中检索它们。\n\
  \n## Route 53\n\nAWS Route 53 是一种域名系统 (DNS) Web 服务，可用于购买和维护域名。每个面向消费者的应用程序都需要有一个与其关联的域名，我们可以从\
  \ AWS Route 53 购买域名，或将域名转移到 Route 53，如果域名是通过其他平台购买的，例如 Godaddy、Namecheap 等。\n\n\
  AWS Route 53 具有许多附加优势。例如，它可用于流量负载均衡、DNS 故障转移以及其他有助于与其他 AWS 服务集成的功能。\n\n## The AWS\
  \ Billing console\n\nAWS Billing 控制台允许我们轻松了解与所有 AWS 服务相关的成本。开发人员需要学习如何使用 AWS Billing\
  \ 控制台来监控与 AWS 服务相关的成本。AWS 有 100 多项服务，很常见的是 AWS 账户中运行着未使用的 AWS 资源。AWS 仅对在 AWS 账户中运行的资源收费，因此我们可以使用\
  \ AWS Billing 控制台来识别所有正在运行的资源。\n\n## CloudWatch\n\nAWS CloudWatch 是一种监控服务，可用于监控在\
  \ AWS 上运行的 AWS 服务和应用程序。AWS CloudWatch 为我们提供了向 AWS 资源添加警报的能力。大多数 AWS 资源都有 Cloudwatch\
  \ 指标，并且会自动集成。从 AWS 服务推送到 CloudWatch 的所有日志都可以使用 CloudWatch 日志洞察查询进行查询。\n\n至此，我们已经了解了\
  \ AWS 提供的不同服务。协调不同的 AWS 服务并设置生产基础设施来运行 Django 需要付出大量的努力。另一方面，AWS Elastic Beanstalk\
  \ 可以在几分钟内协调所需的 AWS 服务来创建生产环境。让我们学习如何使用 AWS Elastic Beanstalk 部署 Django 应用程序。\n\n\
  # Integrating AWS Elastic Beanstalk to deploy Django\n\n在本节中，我们将学习如何使用 AWS Elastic\
  \ Beanstalk 部署 Django 应用程序。让我们看一个基本的 Django 示例来帮助说明这一点。\n\n## Integrating Beanstalk\
  \ with a basic Django app\n\n首先，按照第 1 章中提到的指南创建一个 Django 应用程序，然后按照第 11 章中提到的指南将\
  \ Django 应用程序容器化。另请按照 `https://github.com/PacktPublishing/Django-in-Production/tree/main/Chapter13#integrating-beanstalk-with-basic-django-app`\
  \ 中提到的说明进行操作。\n\n在开始 Elastic Beanstalk 集成之前，请确保通过运行 `docker compose up` 使 Django\
  \ 项目正常工作。我们可以通过访问 `http://127.0.0.1/admin` 来访问 Django 管理页面：\n\n```\ndocker compose\
  \ up -–build\n```\n\n现在我们的本地设置正在使用 Docker 运行 Django 应用程序，让我们专注于创建一个新的 Beanstalk\
  \ 环境：\n\n1. 使用以下命令安装 Elastic Beanstalk `eb` CLI 工具：\n\n```\npip install awsebcli\n\
  ```\n\n我们将使用 `eb` 命令与 Elastic Beanstalk 交互并设置我们的应用程序。\n\n2. 安装 CLI 后，我们准备好通过运行 `eb\
  \ init` 命令配置项目目录。我们需要选择应用程序将运行的 AWS 区域。选择对应于该区域的数字。在这里，我们将选择亚洲太平洋地区（孟买）– 6：\n\n\
  ```\n> eb init\nSelect a default region\n1) us-east-1 : US East (N. Virginia)\n\
  2) us-west-1 : US West (N. California)\n3) us-west-2 : US West (Oregon)\n4) eu-west-1\
  \ : Europe (Ireland)\n5) eu-central-1 : Europe (Frankfurt)\n6) ap-south-1 : Asia\
  \ Pacific (Mumbai)\n7) ap-southeast-1 : Asia Pacific (Singapore)\n...\n(default\
  \ is 3): 6\n```\n\n3. 接下来，提供访问密钥和密钥，以便 CLI 可以访问 AWS 账户并管理/创建资源。有关如何获取 AWS 安全凭证的更多详细信息，请访问\
  \ AWS 官方文档 `https://aws.amazon.com/blogs/security/wheres-my-secret-access-key/`：\n\
  \n\n\n\n\n```\nYou have not yet set up your credentials or your credentials are\
  \ incorrect.\nYou must provide your credentials.\n(aws-access-id): AKIAJOUAASEXAMPLE\n\
  (aws-secret-key): 5ZRIrtTM4ciIAvd4EXAMPLEDtm+PiPSzpoK\n```\n\n请记住不要与任何人分享 AWS 凭证。如果它们落入错误的人手中，他们可以接管你的整个\
  \ AWS 基础设施。\n\n### 4. 接下来，我们需要为我们的应用程序命名：\n\n```\nEnter Application Name\n(default\
  \ is \"eb\"): django-demo-app\nApplication django-demo-app has been created.\n```\n\
  \n### 5. Elastic Beanstalk 可以在多个平台上运行。我们的应用程序是一个在 Docker 中运行的 Django 应用程序，因此我们必须选择\
  \ Docker 平台：\n\n```\nSelect a platform.\n1) .NET Core on Linux\n2) .NET on Windows\
  \ Server\n3) Docker\n4) Go\n5) Java\n6) Node.js\n7) PHP\n8) Packer\n9) Python\n\
  10) Ruby\n11) Tomcat\n(make a selection): 3\n```\n\n### 6. 选择你希望 Beanstalk 运行的 Docker\
  \ 平台。我们将选择 `Docker running on 64-bit Amazon Linux 2023`：\n\n```\nSelect a platform\
  \ branch.\n1) Docker running on 64bit Amazon Linux 2023\n2) Docker running on 64bit\
  \ Amazon Linux 2\n3) ECS running on 64bit Amazon Linux 2\n(default is 1): 1\n```\n\
  \n### 7. 接下来，Beanstalk 会自动为我们的 AWS 实例设置 SSH 访问。我们需要选择 yes 来分配 SSH 密钥对。这将允许我们直接 SSH\
  \ 到我们的 Beanstalk 应用程序：\n\n```\nDo you want to set up SSH for your instances?\n(y/n):\
  \ y\n```\n\n### 8. Beanstalk 创建一个新的 SSH 密钥对，它将用于为 EC2 实例提供访问权限：\n\n```\nType a keypair\
  \ name.\n(Default is aws-eb):\nGenerating public/private rsa key pair.\nEnter passphrase\
  \ (empty for no passphrase):\nEnter same passphrase again:\nYour identification\
  \ has been saved in /Users/argo/.ssh/aws-eb\nYour public key has been saved in /Users/argo/.ssh/aws-eb.pub\n\
  ```\n\n至此，我们的 Beanstalk 应用程序已创建。现在，我们可以进入 AWS 控制台，找到我们的 Beanstalk 应用程序已准备就绪。*图 13.7*\
  \ 显示了我们新创建的 Beanstalk 应用程序：\n\n![Figure 13.7: The AWS console showing the newly\
  \ created Beanstalk application, django-demo-app](img/Figure_13.7_B18867.jpg)\n\n\
  图 13.7：AWS 控制台显示新创建的 Beanstalk 应用程序，django-demo-app\n\n当我们进入 AWS 控制台中的 `django-demo-app`\
  \ 应用程序时，我们不会看到环境，如 *图 13.8* 所示。这是因为我们已创建了 Beanstalk 应用程序，但尚未创建任何将在 Beanstalk 上运行\
  \ Django 应用程序的环境：\n\n![Figure 13.8: The AWS console showing the empty Beanstalk\
  \ application](img/Figure_13.8_B18867.jpg)\n\n图 13.8：AWS 控制台显示空的 Beanstalk 应用程序\n\
  \n1. 要创建环境，请进入 Django 应用程序文件夹并运行 `eb create <environment-name>` 命令。例如，如果我们将环境命名为\
  \ `prod-env`，则应使用以下命令创建 Beanstalk 环境：\n\n```\neb create prod-env\n```\n\n现在，我们可以进入\
  \ AWS Elastic Beanstalk 仪表板，查看我们的 Beanstalk 环境正在创建。此步骤通常需要 10 分钟，因为 Elastic Beanstalk\
  \ 将创建所有必需的 AWS 组件，例如 EC2 实例、`Application Load Balancer` (`ALB`)、自动扩展组、CloudWatch\
  \ 警报等：\n\n![Figure 13.9: The AWS Elastic Beanstalk dashboard showing the prod-env\
  \ environment](img/Figure_13.9_B18867.jpg)\n\n图 13.9：AWS Elastic Beanstalk 仪表板显示\
  \ prod-env 环境\n\n一旦 Elastic Beanstalk 环境准备就绪，我们将看到 `Health` 状态从 `Pending` 变为 `Ok`。这表明应用程序已准备好提供流量。在\
  \ *图 13.10* 中，我们可以看到 `prod-env` 的状态，它表明它已准备好提供流量：\n\n![Figure 13.10: AWS Elastic\
  \ Beanstalk prod-env showing a health status of Ok](img/Figure_13.10_B18867.jpg)\n\
  \n图 13.10：AWS Elastic Beanstalk prod-env 显示健康状态为 Ok\n\n*图 13.10* 中显示的 `Domain` 值是可以用于从互联网访问我们的\
  \ Django 应用程序的公共域名。在我们的例子中，它是 `http://prod-env.eba-e5mff922.ap-south-1.elasticbeanstalk.com/admin`（示例\
  \ URL）；当我们在浏览器中打开它时，我们应该能够看到初始的 Django 网页。我们可以在 *图 13.11* 中看到浏览器的输出：\n\n![Figure\
  \ 13.11: Initial Django web page](img/Figure_13.11_B18867.jpg)\n\n图 13.11：初始 Django\
  \ 网页\n\n`eb` CLI 仅适用于位于 Git 中并且至少有一个提交的项目。如果遇到如下所示的错误，请确保你的项目正在使用 Git 进行跟踪：\n\n\
  ```\n> eb create prod-env\nWARNING: Git is in a detached head state. Using branch\
  \ \"default\"\nWARNING: Git is in a detached head state. Using branch \"default\"\
  \nWARNING: Git is in a detached head state. Using branch \"default\"\nWARNING: Git\
  \ is in a detached head state. Using branch \"default\"\nERROR: CommandError – git\
  \ could not find the HEAD; most likely because there are no git commits present\n\
  ```\n\n使用我们的样板 Django 项目代码，我们已经了解了如何将应用程序部署到 Elastic Beanstalk。在我们的示例中，我们使用了基本的样板代码来部署\
  \ Django 应用程序，而不连接到数据库或运行 Web 服务所需的任何其他外部服务。现在，让我们学习如何将 Django 应用程序连接到 AWS RDS 和\
  \ ElastiCache。\n\n## 创建 AWS RDS Postgres 实例并连接到 Django\n\nElastic Beanstalk 为我们提供了为给定的\
  \ Elastic Beanstalk 环境创建 RDS 的选项。然而，我们不会使用该选项，以确保我们的 RDS 实例与 Beanstalk 解耦。\n\n现在，让我们学习如何创建一个可以连接到我们的\
  \ Beanstalk 环境的 RDS 实例并配置我们的 Django 代码。\n\n### 创建新的 RDS 环境\n\n以下是创建新 RDS 环境可以遵循的简单步骤：\n\
  \n1. 在 AWS 控制台中进入 RDS 仪表板：\n\n![Figure 13.12: Navigating to RDS on the AWS dashboard](img/Figure_13.12_B18867.jpg)\n\
  \n图 13.12：在 AWS 仪表板上导航到 RDS\n\n2. 在左侧边栏进入 `Databases` 部分，然后单击 `Create Database`\
  \ 以打开向导，如 *图 13.13* 所示：\n\n![Figure 13.13: The RDS dashboard in the AWS console](img/Figure_13.13_B18867.jpg)\n\
  \n图 13.13：AWS 控制台中的 RDS 仪表板\n\n3. 选择 `Easy Create` 选项，然后选择以下选项（或者，你可以通过使用 `Standard\
  \ Create` 选项以更多选项配置数据库。我们将在本教程中遵循 `Easy Create` 选项）：\n\n   1. 在向导中选择 `Option`。然后，在\
  \ `Engine Type` 下选择 `PostgreSQL`。\n   2. 选择 `Free tier`。\n   3. 为数据库命名。我们将其命名为 `django-demo`。\n\
  \   4. 指定主用户名。我们将使用 `django_db_user`。\n   5. 指定主密码。我们将使用 `abc^A12a*12`。\n   6. 然后，单击\
  \ `Create` 按钮。\n\n4. RDS 需要 4-5 分钟来创建数据库。创建后，我们会看到数据库的状态为 `Creating`：\n\n![Figure\
  \ 13.14: A new RDS instance being created](img/Figure_13.14_B18867.jpg)\n\n图 13.14：正在创建新的\
  \ RDS 实例\n\n至此，我们已创建了数据库。接下来，我们需要将数据库连接到 Django 代码。默认情况下，RDS 不暴露给互联网，这意味着我们无法在 AWS\
  \ VPC 网络之外连接到 RDS 实例。不将 RDS 服务器暴露给互联网是一个良好的实践。\n\n然而，这并不意味着我们的 Elastic Beanstalk\
  \ 服务器可以直接连接到 RDS 实例。要连接到 RDS 实例，我们必须配置我们的 VPC 安全组以启用连接。\n\n### 将 RDS 连接到 Django\
  \ 服务器\n\n\n\n\n\n以下是将 RDS 连接到 Django 服务器的步骤：\n\n1. 进入 `Elastic Beanstalk` 控制台并选择我们之前创建的\
  \ Django 应用。然后，选择 `prod-env` 选项并从左侧边栏选择 `Configuration` 选项。这将显示我们实例的所有配置：\n\n![Figure\
  \ 13.15: Elastic beanstalk configuration for prod-env we created earlier](img/Figure_13.15_B18867.jpg)\
  \ \n\nFigure 13.15: Elastic beanstalk configuration for prod-env we created earlier\n\
  \n2. 复制显示的 EC2 安全组——在我们的例子中，它是 `awseb-e-gtchpxnmny-stack-AWSEBSecurityGroup-14VTRXKREKCP0`。\n\
  \n3. 现在，返回 RDS 控制台并选择创建的 RDS 实例。在 `Connectivity & security` 部分，点击 `VPC security\
  \ groups` 值——在我们的例子中，它是 `default (sg-5acc5623)`：\n\n![Figure 13.16: RDS Connectivity\
  \ & security settings](img/Figure_13.16_B18867.jpg) \n\nFigure 13.16: RDS Connectivity\
  \ & security settings\n\n4. `default (sg-5acc5623)` 安全组控制哪些 AWS 资源将有权访问 RDS 实例。我们需要允许我们的\
  \ EC2 实例连接到 RDS 实例。我们必须向此安全组添加新的入站规则。默认情况下，我们不会有任何入站规则；要添加新的入站规则，我们应该点击右下角的 `Edit\
  \ inbound rules` 按钮，如 *Figure 13**.17* 所示：\n\n![Figure 13.17: RDS default security\
  \ group](img/Figure_13.17_B18867.jpg) \n\nFigure 13.17: RDS default security group\n\
  \n5. 将 `Type` 设置为 `PostgreSQL`，将 `Source` 设置为 `Custom`，然后搜索安全组，复制并粘贴我们在 *Step 2*\
  \ 中选择的值，并选择该安全组：\n\n![Figure 13.18: Updating inbound rules to allow a connection\
  \ from Elastic Beanstalk to RDS](img/Figure_13.18_B18867.jpg) \n\nFigure 13.18:\
  \ Updating inbound rules to allow a connection from Elastic Beanstalk to RDS\n\n\
  这将使在 Elastic Beanstalk 内部运行的 EC2 实例能够连接到 RDS 实例。\n\n### 配置我们的 Django 应用以使用 RDS\n\
  \n要获取 RDS 连接详细信息，请打开 RDS 控制台：\n\n![Figure 13.19: RDS dashboard showing the connection\
  \ configuration](img/Figure_13.19_B18867.jpg) \n\nFigure 13.19: RDS dashboard showing\
  \ the connection configuration\n\n从控制台找到 `Endpoint & port`，如 *Figure 13**.19* 所示。以下是我们需要将\
  \ RDS 与 Elastic Beanstalk 集成的配置：\n\n* `Endpoint`: `django-demo.cz2r2xzvhh2n.ap-south-1.rds.amazonaws.com`\n\
  * `Port`: `5432`\n* `Username`: `django_db_user`（来自 *Creating a new RDS **environment*\
  \ 部分的 *Step 3D*）\n* `Password`: `abc^A12a*12`（来自 *Creating a new RDS **environment*\
  \ 部分的 *Step 3E*）\n\n使用连接字符串更新 Django `.env` 文件：\n\n```\nDEBUG=True\nDJANGO_ALLOWED_HOSTS=*\n\
  DB_ENGINE=django.db.backends.postgresql\nDB_NAME=postgres\nDB_USERNAME=django_db_user\n\
  DB_PASSWORD=abc^A12a*12\nDB_HOSTNAME=django-demo.cz2r2xzvhh2n.ap-south-1.rds.amazonaws.com\n\
  DB_PORT=5432\nREDIS_HOST=redis_db\nREDIS_PORT=6379\nREDIS_PASSWORD=redisPassWord\n\
  ```\n\n我们还在 `settings.py` 中配置了我们的 `Django-health-check` 包，以确保我们的健康检查端点可以测试和验证数据库连接。\n\
  \n#### Important note\n\n我们已将 RDS 连接值硬编码到我们的 Django 设置文件中以供测试目的。RDS 连接值是敏感信息，不应共享或保存在应用程序代码中。我们将在\
  \ *Deploying a Django application using GitHub Actions in Elastic **Beanstalk* 部分学习如何传递此类敏感信息。\n\
  \n我们的代码已准备好部署和测试。现在，我们需要将 Django 设置文件移至 Git 暂存区。这至关重要，因为 `eb` CLI 只会部署 Git 跟踪的代码或在我们传递特殊标志\
  \ `--stage` 时处于暂存状态的代码：\n\n```\n> git add .env\n> eb deploy --staged\nCreating application\
  \ version archive \"app-8e23-231024_182626309787-stage-231024_182626309839\".\n\
