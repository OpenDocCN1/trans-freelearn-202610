- '# 第一部分 – 使用 Django 和 DRF 构建现代 Web 应用


  在本书的第一部分，我们将概述如何使用 Django 和 `Django Rest Framework` (`DRF`) 创建现代 Web 应用。我们可以预期学习与
  Django ORM 和 DRF 序列化器相关的所有概念，这些概念对于构建任何现代 Web 应用至关重要。Django 管理后台和身份验证是 Django 最受赞赏的功能之一。我们将学习在生产环境中使用
  Django 和 DRF 之前，开发者应该知道的所有最佳实践。


  本部分包含以下章节：


  *   *第 1 章*，*使用 DRF 设置 Django*

  *   *第 2 章*，*探索 Django ORM、模型和迁移*

  *   *第 3 章*，*使用 DRF 序列化数据*

  *   *第 4 章*，*探索 Django 管理后台和管理命令*

  *   *第 5 章*，*掌握 Django 身份验证和授权*

  '
- "# 使用 DRF 设置 Django\n\n在 2003 年，`Django` 项目由来自报纸网络运营公司 *World Online* 的开发者 *Adrian\
  \ Holovaty* 和 *Simon Willison* 启动，并在 2005 年夏季开源并首次发布。当 Django 最初构建时，世界仍在使用拨号调制解调器互联网连接，移动设备尚未普及，智能手机尚未面世，人们通过台式机和笔记本电脑访问网页。Django\
  \ 是那个时代构建 Web 应用所需所有功能的完美框架。\n\n在过去二十年里，技术发生了极大演变：\n\n*   我们已从拨号互联网连接转向 4G/5G 互联网连接\n\
  *   2022 年，55% 的全球互联网流量来自移动设备（[`radar.cloudflare.com/`](https://radar.cloudflare.com/)）\n\
  \n在本書中，我们将看到如何使用 Django 构建现代 Web 应用，并深入探讨开发者创建可扩展的初创公司 Web 应用所需了解的核心概念。为初创公司构建产品的开发者不仅仅是编写\
  \ Django 代码的普通开发者；他们需要开发代码、为业务逻辑编写测试、将应用部署到网络，并最终持续监控已部署的服务。在这里，我们将学习使用 Django 开发\
  \ Web 应用是多么容易，以及行业开发者，特别是初创公司开发者遵循的最佳实践，以使他们的开发周期更简单、更快。\n\n在本章中，我们将学习 Django 的基础知识以及如何设置\
  \ Django 项目并组织项目文件夹。由于我们将在本书的大部分内容中主要使用 RESTful API，因此我们将学习 REST API 的约定以及使用 `Django\
  \ Rest Framework` (`DRF`) 设置 Django 项目以创建 RESTful API 的核心。我们还将重点关注 API 版本控制以及如何使用\
  \ DRF 实现版本控制。DRF 为我们提供了创建函数式视图和基于类的视图的灵活性；我们将在本章中学习它们，以及它们的优缺点。\n\n我们将涵盖以下主题：\n\n\
  *   为什么选择 Django？\n*   使用 Django 和 DRF 创建“Hello World” Web 应用\n*   使用 DRF 创建 RESTful\
  \ 端点\n*   使用 DRF 处理视图\n*   介绍 API 开发工具\n\n## 技术要求\n\n在本章中，我们将进行基础项目设置并编写我们的第一个 Hello\
  \ World 应用。虽然本书面向已经知道如何编写基础 Web 应用的开发者，但任何具备良好编程技能的人都可以拿起本书学习如何创建可扩展的 Django Web\
  \ 应用。以下是你应具备的技能，以便跟上本章内容：\n\n*   良好的 Python 编程知识，并熟悉包以及在 Python 中编写循环、条件语句、函数和类。\n\
  *   对 Web 应用的工作原理有基本了解，并且之前编写过某种形式的 API 或 Web 应用。\n*   虽然我们将尝试从头开始涵盖大部分概念，但具备 Django\
  \ 的基础知识会更好。Django Girls 教程是学习基础的好资源：[`tutorial.djangogirls.org/en/`](https://tutorial.djangogirls.org/en/)。\n\
  \n你可以在本书的 GitHub 仓库中找到本章的代码：[`github.com/PacktPublishing/Django-in-Production/tree/main/Chapter01`](https://github.com/PacktPublishing/Django-in-Production/tree/main/Chapter01)。\n\
  \n重要提示\n\n如果你对本章或其他章节中提到的任何主题有任何疑问，欢迎创建 GitHub issue 并说明所有相关信息（[`github.com/PacktPublishing/Django-in-Production/issues`](https://github.com/PacktPublishing/Django-in-Production/issues)），或加入我们的\
  \ *Django in Production* Discord 频道提问。以下是 Discord 服务器的邀请链接，你可以直接联系我：[`discord.gg/FCrGUfmDyP`](https://discord.gg/FCrGUfmDyP)。\n\
  \n## 为什么选择 Django？\n\nDjango 是一个基于 Python 的 Web 框架，Python 是目前最受欢迎且易于学习的编程语言之一。由于\
  \ Python 是数据科学和人工智能/机器学习的首选语言，开发者可以轻松学习 Django，而无需为构建 Web 应用再学习一种额外语言。\n\nDjango\
  \ 的口号“*Django – The web framework for perfectionists with deadlines*”证明了其对更快、更高效开发的承诺，这一点进一步强调了其自带电池原则，即所有基础和广泛使用的功能都随框架一起提供，而不是我们必须安装额外的包。这使\
  \ Django 相对于其他框架，如 Flask 具有额外优势。\n\n### Django 自带了什么？\n\nDjango 在过去十年中不断发展，目前已是\
  \ 5.x 版本，拥有一些令人期待的新功能，例如异步支持。然而，Django 的核心模块仍然相同，遵循相同的原则。当新开发者想要学习 Django、组织想要为新项目选择\
  \ Django，或资源有限的初创公司想要为其技术栈选择完美框架时，他们都想知道为什么应该学习 Django。为回答这个问题，我们将了解更多关于 Django\
  \ 的功能。\n\n让我们看看 Django 开箱即提供的显著功能：\n\n*   在任何组织中，执行速度对于产品的成功非常重要。Django 的设计旨在帮助开发者以惊人的速度将应用从概念阶段带到产品阶段。\n\
  *   Django 负责用户身份验证、内容管理、站点地图、RSS 订阅以及开发者在任何框架中寻找的许多其他基础 Web 任务。\n*   安全是任何组织都非常关注的问题，Django\
  \ 帮助开发者避免常见的<|start|>安全陷阱。\n*   Mozilla、Instagram、Disqus 和 Pinterest 等网站都使用 Django\
  \ 构建，这使得 Django 成为经实战检验且可扩展的框架。\n*   Django 的多功能框架可用于不同的目的，从内容管理系统到社交网络再到科学计算平台。\n\
  \n\n\n\n\n但 Django 是否仍然相关的问题非常主观。最终，这取决于使用场景。我们知道 Django 是一个优秀的 Web 开发框架，然而，由于全球超过\
  \ 55% 的互联网流量来自使用 Android 或 IOS 应用的移动设备，你可能会想知道 Django 是否适用于为移动用户构建功能？Django 作为一个独立的框架可能不足以应对当今的现代\
  \ Web 开发，因为越来越多的组织正转向 API First 开发，但在与 `Django Rest Framework (DRF)`、`Tastypie`\
  \ 等框架集成时，Django 就成为开发者的首选框架。\n\n对于时间和资源有限的初创公司来说，选择一个框架变得更加至关重要，这样他们就不必从零开始构建每个功能，而是利用框架来完成大部分繁重的工作。\n\
  \n让我们快速了解一下 Django 使用的框架原则：MVT 框架。\n\n## 什么是 MVT 框架？\n\n我们大多数人都听说过 `MVC` 框架（*Model-View-Controller*），它代表了现代\
  \ Web 框架的一种范式，其中我们有以下内容：\n\n*   `Model` 代表数据和业务逻辑层\n*   `View` 代表数据如何在 UI/设计布局中向用户呈现\n\
  *   `Controller` 根据用户的输入更新模型和/或视图\n\nDjango 认为标准名称存在争议，因此它对 MVC 有自己的解释。在这里，我们有以下内容：\n\
  \n*   `View` 代表向最终用户展示*哪些*数据，而不是数据如何表示\n*   `Template` 代表数据如何向最终用户表示\n*   `Model`\
  \ 代表数据层\n\n这就是为什么 Django 遵循 `MVT` 框架（*Model-View-Template*）。但现在，问题是，Django 中的控制器是什么？框架本身就是控制器，因为它使用其内置功能处理整个路由逻辑。\n\
  \n重要说明\n\n你不需要深入研究 MVT 概念，因为随着你在 Django 中编写更多代码，这个概念会成为肌肉记忆。\n\nMVT 是一个使用模板的概念，但在当今世界，大多数产品都是为多个领域构建的，例如移动、物联网和\
  \ SaaS 平台。为了为所有这些领域构建产品，开发者生态系统也发生了演变；现在，组织正转向 `API-first` 开发方法（[`blog.postman.com/what-is-an-api-first-company/`](https://blog.postman.com/what-is-an-api-first-company/)）。这意味着\
  \ API 是“第一类公民”；产品的每个功能都是以 API-first 模型构建的，这有助于创建更好的客户端（移动应用、前端应用等）和服务器集成。它涉及在客户端和服务器之间建立契约，以便每个团队可以并行工作而无需太多依赖。一旦两个团队完成工作，产品的集成和开发周期就会变得更快，并且开发体验更好。\n\
  \n移动设备使用量的增长意味着构建平台无关的后端 API 很重要，这些 API 可以被任何客户端使用，Android 应用、iOS 应用、浏览器框架等等。作为一个独立的\
  \ MVT 框架，Django 能满足所有这些需求吗？不能。使用 Django 的开箱即用功能创建 API 所需的额外工作量与重新发明轮子类似。这就是为什么大多数组织在使用\
  \ Django 的同时使用 Django 的 REST 框架来创建 API。\n\n重要说明\n\n在本书中，我们将不关注模板和仅使用 Django 构建的独立\
  \ Web 应用，而是专注于使用 Django 和 DRF 创建 API。有关仅使用 Django 入门的更多信息，我最喜欢的资源之一是 Django Girls\
  \ 教程：[`tutorial.djangogirls.org/en/`](https://tutorial.djangogirls.org/en/)。\n\n\
  现在我们已经了解了 MVT 框架是什么以及 Django 如何成为 MVT 框架，让我们使用 Django 和 DRF 创建一个基本的 Hello World\
  \ Web 应用，并设置我们的项目结构和开发环境。\n\n# 使用 Django 和 DRF 创建“Hello World”Web 应用\n\n如前所述，Django\
  \ 是一个基于 Python 的 Web 框架，因此我们需要使用 Python 编程语言编写代码。如果你已经在使用 Linux 或 macOS 系统，则 Python\
  \ 已预装。然而，对于 Windows 系统，你必须按照官方 Python 网站上的说明进行安装：[`www.python.org/downloads/`](https://www.python.org/downloads/)。\n\
  \n我们还将使用 `virtualenv` 作为我们首选的工具来管理多个项目的不同环境，使我们能够创建隔离的 Python 环境。\n\n重要说明\n\n我们不会深入研究\
  \ `virtualenv`，因为我们希望你知道如何以及为什么为不同项目使用 `virtualenv`。你可以在其官方网站上找到有关 `virtualenv`\
  \ 的详细信息：[`virtualenv.pypa.io/en/latest/index.html`](https://virtualenv.pypa.io/en/latest/index.html)。\n\
  \n首先，让我们使用最新版本的 Python（最好 >3.12.0）创建一个虚拟环境。以下命令适用于 Linux/Unix/macOS；对于 Windows，请查看下一节：\n\
  \n```\npip install virtualenv\nvirtualenv -p python3 v_env\nsource /path to v_env/v_env/bin/activate\n\
  ```\n\n现在，我们将分解代码的含义：\n\n*   `pip install virtualenv` 在系统上安装 `virtualenv`。`pip`\
  \ 是随 Python 提供的内置包管理器，已在 Mac 和大多数 Linux 环境中预装。\n*   `virtualenv -p python3 v_env`\
  \ 使用名称 `v_env` 创建一个新的虚拟环境（这只是我们给虚拟环境起的名字；你可以取另一个相关名称）。`-p python3` 标志用于告诉我们应使用哪个解释器来创建虚拟环境。\n\
  *   `source /path to v_env/v_env/bin/activate` 执行 `activate` 脚本，该脚本将虚拟 Python 解释器加载为\
  \ shell 中的默认 Python 解释器。\n\n现在 Python 虚拟环境已设置好，我们将专注于管理包依赖。要安装 Django 的最新版本，请运行以下命令：\n\
  \n```\npip install Django==5.0.2\n```\n\n对于 Windows 系统，从 [`www.python.org/downloads/windows/`](https://www.python.org/downloads/windows/)\
  \ 下载 Python 3.12 或更高版本并按照向导进行安装。请记住在安装步骤中勾选 `Add python.exe to PATH` 复选框。\n\n要验证你的\
  \ Python 安装，请在终端中使用以下命令：\n\n```\nC:\\Users\\argo\\> python --version\nPython 3.12.0\n\
  ```\n\n一旦 Python 安装成功，你可以使用以下命令设置虚拟环境并安装 Django：\n\n```\npy -m pip install --user\
  \ virtualenv\npy -m venv venv\n.\\<path to venv created>\\venv\\Scripts\\activate\n\
  // to install Django\npip install Django==5.0.2\n```\n\nWindows 特定命令的解释与我们对 Linux/MacOS\
  \ 系统的解释相同。\n\n重要说明\n\n我们不使用 poetry、PDM、pipenv 或任何其他依赖和包管理工具，以避免使初始设置过于复杂。\n\n此外，我们更喜欢使用\
  \ Docker 环境来创建更多隔离并提供更好的开发体验。我们将在 *第 10 章* 中了解更多关于 Docker 的内容。*\n\n通过之前的命令，我们的本地\
  \ Python 和 Django 开发环境已准备就绪。现在，是时候创建我们的基本 Django 项目了。\n\n## 创建我们的 Django hello_world\
  \ 项目\n\n\n\n\n\n我们都喜欢 `django-admin` 命令以及在创建新项目或应用时它提供的所有样板代码。然而，在处理大型项目时，默认的项目结构就没那么有用了。这是因为当我们在生产环境中使用\
  \ Django 时，有许多其他需要整合到项目中的组件。项目结构以及与项目一起使用的其他工具总是带有主观性；你在当前项目中认为可行的方法，可能在一年后创建的下一个项目中就不适用了。\n\
  \n### 重要说明\n\n互联网上有大量资源会建议不同的项目结构。我最喜欢的一个是 `django-cookiecutter`。它为项目集成了大量工具，并提供了一个可遵循的结构，但对于任何新手来说，由于它集成了许多可能用不到的第三方工具，以及一些可能不理解的配置，开始使用起来可能会令人望而生畏。但与其担心这些，你只需跟随本书即可！\n\
  \n我们将创建自己的极简项目结构，并逐步将其他工具集成到项目中。首先，让我们使用 Django 创建 `hello_world` 项目：\n\n```\nmkdir\
  \ hello_world && cd hello_world\nmkdir backend && cd backend\ndjango-admin startproject\
  \ config .\n```\n\n这里，我们创建了项目文件夹 `hello_world`，然后在其内部创建了一个名为 `backend` 的子文件夹。我们使用\
  \ `backend` 文件夹来存放所有与 Django 相关的代码；随着我们学习更多关于 CI/CD 功能并将更多工具整合到项目中，我们将在与 `backend`\
  \ 子文件夹同一层级创建更多文件夹。最后，我们使用 Django 管理命令创建了项目。\n\n### 重要说明\n\n注意 `startproject` 命令后附加的\
  \ `.`（点）；这告诉 Django 管理命令在当前文件夹中创建项目，而不是创建一个名为 `config` 的单独文件夹来存放项目。默认情况下，如果你不添加\
  \ `.`，那么 Django 将在其中创建名为 `config` 的额外文件夹，项目结构将在其中创建。为了更好地理解，你可以尝试带 `.` 和不带 `.` 的命令，以清楚地了解它对结构的影响。\n\
  \n执行这些命令后，我们应该能看到此处所示的项目结构：\n\n![Figure 1.1: Expected project structure after executing\
  \ the commands](img/B18867_01_01.jpg) \n\nFigure 1.1: Expected project structure\
  \ after executing the commands\n\n现在项目结构已准备就绪，让我们运行 `python manage.py runserver`\
  \ 来验证我们的 Django 项目。我们应该在 shell 中看到以下输出：\n\n![Figure 1.2: The python manage.py runserver\
  \ command’s output in the shell](img/B18867_01_02.jpg) \n\nFigure 1.2: The python\
  \ manage.py runserver command’s output in the shell\n\n请忽略控制台中以红色显示的未应用迁移警告 `You\
  \ have 18 unapplied migrations(s)`；当我们在下一章学习更多关于数据库、模型和迁移的内容时，我们将详细介绍这个问题。\n\n现在，打开你的浏览器并访问\
  \ `http://localhost:8000` 或 `http://127.0.0.1:8000`（如果前者无法加载）。我们将看到如图 *Figure 1**.3*\
  \ 所示的屏幕，这验证了我们的服务器正在成功运行：\n\n### 请注意\n\n你可以使用 `http://localhost:8000` 或 `http://127.0.0.1:8000`\
  \ 在浏览器中打开 Django 项目。如果你在访问 `http://localhost:8000` 时遇到任何错误，请尝试对本书中提到的所有 URL 使用 `http://127.0.0.1:8000`。\n\
  \n![Figure 1.3: Our Django server running successfully with port 8000](img/B18867_01_03.jpg)\
  \ \n\nFigure 1.3: Our Django server running successfully with port 8000\n\n现在，让我们创建我们的第一个\
  \ `hello_world` 视图。为此，请按照以下步骤操作：\n\n1. 打开 `config/urls.py` 文件。\n2. 在 `hello_world`\
  \ 中添加一个新的 `view` 函数。\n3. 将 `hello_world` 视图函数链接到 `hello-world` 路径。\n\n我们的 `config/urls.py`\
  \ 文件应如下所示的代码片段：\n\n```\nfrom django.contrib import admin\nfrom django.http import\
  \ HttpResponse\nfrom django.urls import path\ndef hello_world(request):\n    return\
  \ HttpResponse('hello world')\nurlpatterns = [\n    path('admin/', admin.site.urls),\n\
      path('hello-world/', hello_world)\n]\n```\n\n4. 打开 `http://127.0.0.1:8000/hello-world/`\
  \ 以获取如图 *Figure 1**.4* 所示的结果：\n\n![Figure 1.4: http://127.0.0.1:8000/hello-world/\
  \ browser response](img/B18867_01_04.jpg) \n\nFigure 1.4: http://127.0.0.1:8000/hello-world/\
  \ browser response\n\n到目前为止，我们已经了解了如何创建项目文件夹结构以及如何在 Django 中创建第一个视图。我们使用的示例是最小的\
  \ Django 项目示例之一，不涉及应用。因此，让我们看看如何在 Django 中创建应用，以帮助我们更好地管理项目。\n\n## 在 Django 中创建我们的第一个应用\n\
  \nDjango 应用可以被视为在大型项目中执行单一功能的小型包。Django 提供了管理命令来在项目中创建新应用；这些是内置命令，用于执行重复且复杂的任务。Django\
  \ 社区喜欢管理命令，因为它们减少了大量手动工作并封装了许多复杂任务，例如迁移等。我们将在后续章节中学习更多关于 Django 管理命令的内容，在那里我们将创建一个自定义管理命令。然而，每当你看到\
  \ `manage.py` 后跟一个命令时，那就是一个 Django 管理命令。\n\n那么，让我们使用 Django 管理命令接口创建一个新的 `demo_app`：\n\
  \n```\npython manage.py startapp demo_app\n```\n\n运行此命令将创建此处所示的文件夹结构：\n\n![Figure\
  \ 1.5: Project structure with demo_app added](img/B18867_01_05.jpg) \n\nFigure 1.5:\
  \ Project structure with demo_app added\n\n我们可以看到，已创建了一个 `demo_app` 文件夹，其中包含 Django\
  \ 为新应用生成的样板代码。\n\n### 重要说明\n\n每当我们创建一个新应用时，必须做的一件重要事情是告诉 Django 关于这个新应用。不幸的是，使用\
  \ Django 管理命令创建新应用时，这不会自动发生。这是一个手动过程，你需要在 `settings.py` 文件中的 `INSTALLED_APPS` 列表中添加新应用的详细信息。Django\
  \ 使用它来识别添加到项目中的所有依赖应用，并检查任何数据库相关更改，甚至注册信号和接收器。\n\n虽然目前由于我们没有使用 `models` 让 Django\
  \ 自动识别任何数据库相关更改，添加新应用到 `INSTALLED_APPS` 列表不是必需的，但仍然是良好的实践。我们的 `INSTALLED_APPS` 列表应如下所示：\n\
  \n```\nINSTALLED_APPS = [\n    ...\n    'django.contrib.staticfiles',\n    'demo_app',\n\
  ]\n```\n\n请记住在每个新应用条目后加上逗号（`,`）；这是开发人员最常犯的错误之一，它会导致 Django 将两个应用名称拼接在一起，并在最终纠正之前生成语法错误。\n\
  \n### 重要说明\n\n在 Django 中，第三方应用集成也是通过 `INSTALLED_APPS` 完成的，因此我们将在以下部分看到有关如何维护 `INSTALLED_APPS`\
  \ 的最佳实践。\n\n现在我们已经使用样板代码创建了一个新的 Django 应用，我们可以将应用视图与 `urls.py` 链接起来。\n\n## 使用 urls.py\
  \ 链接应用视图\n\n在本节中，我们将链接由 Django 管理命令创建的 `views.py`。`views.py` 用于向应用端点添加业务逻辑。就像我们在上一节中添加了\
  \ `hello_world` 函数视图一样，我们可以在 `views.py` 文件中添加不同的函数式或基于类的视图。\n\n\n\n\n\n让我们在 `demo_app/views.py`\
  \ 文件中创建一个简单的 `hello_world` 函数视图：\n\n```\nfrom django.http import HttpResponse\n\
  def hello_world(request, *args, **kwargs):\n    return HttpResponse('hello world')\n\
  ```\n\n随着项目的增长和应用数量的增加，我们主要的 `urls.py` 文件会变得越来越杂乱，单个文件中有数百个 URL 模式。因此，将主要的 `config/urls.py`\
  \ 文件拆分为每个应用的较小的 `urls.py` 文件是有利的，这可以提高项目的可维护性。\n\n现在，我们将创建一个名为 `backend/demo_app/urls.py`\
  \ 的新文件，在其中添加与 `demo_app` 相关的所有路由。随后，当我们向项目添加更多应用时，我们将为每个应用创建单独的 `urls.py` 文件。\n\n\
  ### Important note\n\n`urls.py` 文件名可以是任意的，但我们保持不变以符合 Django 惯例。\n\n在 `backend/demo_app/urls.py`\
  \ 文件中添加以下代码：\n\n```\nfrom django.urls import path\nfrom demo_app import views\n\
  urlpatterns = [\n    path('hello-world/', views.hello_world)\n]\n```\n\n在这里，我们为\
  \ `hello-world` 路径定义了 URL 模式，它链接到我们之前创建的基础函数视图。\n\n### Opinionated note\n\n我们使用绝对导入来导入我们的\
  \ `demo_app` 视图。这是我们在本书中将遵循的惯例，我们也推荐在其他项目中使用。 使用绝对导入相对于相对导入的优势在于它简单明了，易于阅读。 只要看一眼，有人就能轻松判断导入了什么资源。\
  \ 此外，PEP-8 明确建议使用绝对导入。\n\n现在，让我们将 `demo_app/urls.py` 文件连接到主项目 `config/urls.py` 文件：\n\
  \n```\nfrom django.contrib import admin\nfrom django.urls import include\nfrom django.urls\
  \ import path\nurlpatterns = [\n    path('admin/', admin.site.urls),\n    path('demo-app/',\
  \ include('demo_app.urls'))\n]\n```\n\n接下来，在浏览器中打开 `http://127.0.0.1:8000/demo-app/hello-world/`\
  \ 以确保我们的 `demo-app` 视图已与 Django 链接。 你应该能在屏幕上看到 `hello world` 显示出来，就像我们在 *Figure\
  \ 1.4* 中看到的那样。\n\n到目前为止，我们一直在使用原生的 Django，但现在，我们将看看如何将 DRF 集成到我们的项目中。\n\n# Integrating\
  \ DRF\n\n在以 API 为先的开发世界中，开发人员每天为他们构建的每个功能创建 API，DRF 是一个强大且灵活的工具包，用于使用 Django 构建\
  \ API。\n\n## Important note\n\n如果你不熟悉 DRF 的基础知识，我们将在本书中讲解基础知识。 然而，你可以在这里找到更多信息：[`www.django-rest-framework.org/tutorial/quickstart/`](https://www.django-rest-framework.org/tutorial/quickstart/)。\n\
  \n现在，让我们将 DRF 集成到我们的 `hello_world` 项目中。 首先，我们需要在虚拟环境中安装 DRF：\n\n```\npip install\
  \ djangorestframework\n```\n\n现在，转到 `settings.py` 并将 `rest_framework` 添加到 `INSTALLED_APPS`。\
  \ 正如你可能还记得，当我们将 `demo_app` 集成到项目中时，我们提到随着项目的增长，`INSTALLED_APPS` 列表也会增长。 为了更好地管理，我们将\
  \ `INSTALLED_APPS` 列表拆分为三个部分：\n\n* `DJANGO_APPS`: 这将包含所有默认的 Django 应用以及我们将添加到项目的任何新的\
  \ Django 内置应用\n* `THIRD_PARTY_APPS`: 在这里，我们将维护我们集成到项目中的所有第三方应用，例如 `rest_framework`\n\
  * `CUSTOM_APPS`: 我们将把为项目创建的所有应用添加到此列表中——在我们的例子中是 `demo_app`\n\n以下是 `settings.py`\
  \ 文件中 `INSTALLED_APPS` 列表的示例：\n\n```\nDJANGO_APPS = [\n    'django.contrib.admin',\n\
  \    'django.contrib.auth',\n    'django.contrib.contenttypes',\n    'django.contrib.sessions',\n\
  \    'django.contrib.messages',\n    'django.contrib.staticfiles',\n]\nTHIRD_PARTY_APPS\
  \ = [\n    'rest_framework',\n]\nCUSTOM_APPS = [\n    'demo_app',\n]\nINSTALLED_APPS\
  \ = DJANGO_APPS + CUSTOM_APPS + THIRD_PARTY_APPS\n```\n\n到目前为止，我们一直在使用 Django `HttpResponse`。\
  \ 现在，我们将 DRF 响应集成到我们的视图中。 因此，转到 `demo_app/views.py` 文件并添加以下代码：\n\n```\nfrom rest_framework.decorators\
  \ import api_view\nfrom rest_framework.response import Response\n@api_view(['GET'])\n\
  def hello_world_drf(request, *args, **kwargs):\n    return Response(data={'msg':'hello\
  \ world'})\n```\n\nDRF 基于函数的视图集成将完全改变我们端点的 UI。 如果你打开 `http://127.0.0.1:8000/demo-app/hello-world-drf/`，它将具有更详细的\
  \ UI，比之前提供更多信息。 当我们开始处理除 `GET` 请求之外的 HTTP 请求时，这尤其有帮助。\n\n以下是我们集成了 DRF 的基础 Django\
  \ 项目：\n\n![Figure 1.6: Using the DRF response in our hello-world-drf view](img/B18867_01_06.jpg)\n\
  \nFigure 1.6: Using the DRF response in our hello-world-drf view\n\n现在我们有一个在 Django\
  \ 中运行的项目，让我们学习一些良好的实践，这些实践可以帮助你在不自己犯错的情况下更进一步，而不是从你之前犯过的错误中学习。 DRF 是最受欢迎的 Django\
  \ 包，因为它帮助开发人员创建 REST 端点。 现在，让我们看看创建 REST API 的一些良好实践。\n\n# Creating RESTful API\
  \ endpoints with DRF\n\n最流行且广泛使用的 API 是 REST API。 在整本书中，我们将使用 REST API。 REST 已存在二十多年，每个公司都有其解释和实现。\
  \ 在以下部分中，我们将尝试将行业中使用的所有最佳实践付诸实践。\n\n## Opinionated note\n\nRESTful API 不是协议； 相反，它是开发人员遵循的标准约定。\
  \ 设计 RESTful API 时没有对错之分。 由于没有强制执行的标准，我们提供的细节纯粹是主观的，来自我过去的经验。 你可以自由选择喜欢的要点，忽略你认为与实现无关的内容。\n\
  \n## Best practices for defining RESTful APIs\n\n让我们看一下开发人员在定义 RESTful 端点时在行业中使用的一些通用良好实践：\n\
  \n* 在端点路径中使用名词而不是动词，并使用适当的 HTTP 请求方法。 这里有一些例子（*请注意，这里使用的 URL 示例只是我们应该如何定义 REST URL\
  \ 的大纲，我们并没有定义 `exact code*）：\n\n```\n# To get all blogs\nAvoid GET /get-all-blogs,\
  \ rather use GET /blogs\n# To delete a particular blog\nAvoid POST /delete-blog\
  \ rather use DELETE /blogs/<blogId>\n# To create a new blog with POST request\n\
  Avoid POST /create-new-blog rather use POST /blogs\n# To update an existing blog\
  \ with a PUT request\nAvoid PUT /update-blog rather use PUT /blogs/<blogId>\n```\n\
  \n* 使用适当的 HTTP 方法来执行 CRUD 操作是首选的。 有多种 HTTP 方法，但我们只涵盖最常用的五种方法：\n  * `GET`: 用于检索实体，无论是列表还是详情\n\
  \  * `POST`: 用于创建任何新实体\n  * `PUT`: 用于更新实体\n  * `PATCH`: 用于部分更新实体\n  * `DELETE`:\
  \ 用于删除实体\n\n* 建议在端点中创建复数名词。 当你需要获取单个条目时，则在端点后使用 `id` 来检索信息。 例如，要获取博客列表，使用 `GET /blogs`，要获取一个博客的详情，使用\
  \ `GET /blogs/<blog id>`。\n\n\n\n\n\n*   为端点使用逻辑嵌套结构对于清理 API 接口和维护良好的信息架构非常重要。例如，要获取特定博客的所有评论，API\
  \ 应该是 `GET /blogs/<blog id>/comments`。\n\n*   对 API 进行版本控制很重要，因为它有助于在不破坏新系统中契约的情况下支持旧系统。例如\
  \ `/v1/blogs/` 和 `/v2/blogs`。我们将在 *Using API versioning* 部分稍后了解更多关于此的内容。\n\n*  \
  \ 服务器应根据操作发送适当的 HTTP 响应状态码，并附带消息正文（如果适用）。以下是一些最常用的 HTTP 状态码：\n    *   `2xx`：用于任何成功。例如，`200`\
  \ 用于任何请求成功返回数据，`201` 用于创建新条目，等等。\n    *   `3xx`：用于任何重定向。\n    *   `4xx`：用于任何错误。例如，使用\
  \ `400` 表示请求错误，使用 `404` 表示请求的数据未找到。\n    *   `5xx`：当服务器因任何意外请求而崩溃或服务器不可用时。\n\n*\
  \   服务器必须接受并以 JSON 响应进行响应。API 不支持其他数据类型，例如纯文本、XML 等。\n\n## 使用 DRF 创建 REST API 的最佳实践\n\
  \nDRF 是一个框架，可以帮助我们更快地创建 REST 端点。遵循最佳实践的同时编写可扩展且可维护的代码是开发人员的责任。让我们看看使用 DRF 可以实现的一些最佳实践。\n\
  \n### 使用 API 版本控制\n\n创建 API 版本可能是与客户端合作时最重要的事情之一，而这些客户端的更新不在你的控制之下。一个例子是开发移动应用。一旦终端用户安装了集成了给定\
  \ API 的移动应用，我们就必须在终端用户更新移动应用版本以使用更新的 API 之前支持该 API。\n\n在创建端点时，开发人员应考虑所有可能将来的需求以及所有边界情况。然而，就像无法预测未来一样，开发人员也无法总是预见到当前\
  \ API 设计可能需要重新设计。重新设计意味着破坏客户端和服务器之间的契约。这就是 API 版本控制重要性显现的时候。经过良好版本控制的 API 将在不破坏任何现有客户端的情况下实现新契约。\n\
  \n实现 API 版本控制有多种方式：\n\n*   `Accept` 头版本控制：由于版本通过 `Accept` 头传递，因此每当创建新版本时，客户端无需在每次创建新版本时更新任何端点：\n\
  ```\nGET /bookings/ HTTP/1.1\nHost: example.com\nAccept: application/json; version=1.0\n\
  ```\n\n*   `URL` 路径版本控制：API 版本通过 URL 路径模式传递。这是使用最广泛的 API 版本控制方法之一，因为它提供了更好的可见性：\n\
  ```\nGET /v1/bookings/ HTTP/1.1\nHost: example.com\nAccept: application/json\n```\n\
  \n*   查询参数版本控制：URL 中的查询参数包含版本。在 URL 路径版本控制之后，这是第二常见的版本控制方法，因为它具有更清晰的界面和更好的可发现性：\n\
  ```\nGET /something/?version=1.0 HTTP/1.1\nHost: example.com\nAccept: application/json\n\
  ```\n\n*   主机名版本控制：这涉及使用子域在主机名中传递 API 版本。这种类型的版本控制用于将整个服务迁移到新版本而不是单个端点时：\n```\n\
  GET /bookings/ HTTP/1.1\nHost: v1.example.com\nAccept: application/json\n```\n\n\
  DRF 开箱即支持所有四种 API 版本控制方法，并且如果需要，还提供创建自定义 API 版本逻辑的选项。我们将主要探索 `URLPathVersioning`，因为它是通过\
  \ DRF 实现版本控制的最简单和最流行的方法之一。\n\n在 URL 路径版本控制中，API 版本在 URL 路径中传递，这使得客户端和服务器都可以轻松识别。要在\
  \ DRF 中集成 `URLPathVersioning`，请在 Django `config/settings.py` 文件中添加以下内容：\n```\nREST_FRAMEWORK\
  \ = {\n    'DEFAULT_VERSIONING_CLASS': 'rest_framework.versioning.URLPathVersioning'\n\
  }\n```\n\n现在，我们必须将版本添加到 URL 路径中。重要的是将 URL 参数命名为 `<version>`，因为 DRF 默认期望它是 `<version>`。这里，`<version>`\
  \ 是 URL 的模式，这意味着任何匹配此模式的 URL 都将被链接到视图。\n\n重要提示\n\n要了解有关 `urlpatterns` 的更多信息，请访问\
  \ [`docs.djangoproject.com/en/stable/topics/http/urls/`](https://docs.djangoproject.com/en/stable/topics/http/urls/)。\n\
  \n建议在 URL 开头添加 `<version>`，因此让我们在主 `config/urls.py` 文件中这样做：\n```\nurlpatterns =\
  \ [\n    path('admin/', admin.site.urls),\n    path('<version>/demo-app-version/',\
  \ include('demo_app.urls'))\n]\n```\n\n一旦我们使用 `<version>` 配置了 URL，我们就可以尝试创建一个新视图并在视图中检索版本。将以下代码添加到你的\
  \ `demo_app/urls.py` 文件中：\n```\nfrom django.urls import path\nfrom demo_app import\
  \ views\nurlpatterns = [\n    path('hello-world/', views.hello_world),\n    path('demo-version/',\
  \ views.demo_version),\n]\n```\n\n我们将在视图中检索 API 版本并在响应中返回版本：\n```\n@api_view(['GET'])\n\
  def demo_version(request, *args, **kwargs):\n    version = request.version\n   \
  \ return Response(data={\n        'msg': f'You have hit {version} of demo-api'\n\
  \    })\n```\n\n现在，当我们打开 `http://127.0.0.1:8000/v1/demo-app-version/demo-version/`\
  \ 时，我们应该能够看到以下屏幕：\n\n![Figure 1.7: Output showing which version we have hit for\
  \ the given API](img/B18867_01_07.jpg)\n\nFigure 1.7: Output showing which version\
  \ we have hit for the given API\n\n如果我们将 URL 更改为 `http://127.0.0.1:8000/v9/demo-app/demo-version/`，那么我们会看到它返回\
  \ v9。v9 可能尚未发布，因此这可能会让访问该端点的终端用户感到困惑。为了解决这个问题，我们将看看如何自定义 DRF 的版本类，以便我们可以添加约束来帮助我们设计更好的应用程序。\n\
  \n#### 使用 DRF 中的自定义版本类\n\n让我们看看如何扩展 DRF 提供的 `URLPathVersioning` 类来解决我们刚刚提出的问题。首先，创建一个名为\
  \ `demo_app/custom_versions.py` 的文件。此文件将为每个视图包含一个自定义版本类，以及一个用于尚未具有多个版本的视图的默认类：\n\
  ```\nfrom rest_framework.versioning import URLPathVersioning\nclass DefaultDemoAppVersion(URLPathVersioning):\n\
  \    allowed_versions = ['v1']\n    version_param = 'version'\nclass DemoViewVersion(DefaultDemoAppVersion):\n\
  \    allowed_versions = ['v1', 'v2', 'v3']\nclass AnotherViewVersion(DefaultDemoAppVersion):\n\
  \    allowed_versions = ['v1', 'v2']\n```\n\n让我们看看前面的代码做了什么：\n\n*   `DefaultDemoAppVersion`\
  \ 类可用于 `demo_app` 中创建的所有视图。它具有 `allowed_versions` 属性，列出了在使用此基于类的视图时可在 URL 路径中使用的允许版本。`version_param`\
  \ 是我们用于定义版本的 URL 路径参数名称；它可以是任何名称，具体取决于你如何命名参数，但在我们的例子中，我们使用的是 `<version>`，它在 `config/urls.py`\
  \ 文件中使用。此类将默认用于 demo 应用中创建的所有视图，直到添加新版本后，我们将创建单独的类，如下所示。\n\n\n\n\n\n*   `DemoViewVersion`\
  \ 类将包含 `DemoView` 在 URL 路径中允许的所有 `allowed_versions` 属性的列表。\n\n*   `AnotherViewVersion`\
  \ 类将包含另一个类允许的所有版本。\n\n将以下代码添加到 `demo_app/views.py` 文件以集成自定义版本类（请注意，自定义 `versioning_class`\
  \ 只能链接到基于类的视图，因此我们在这里使用 `APIView`）：\n\n```\nfrom rest_framework.response import\
  \ Response\nfrom rest_framework.views import APIView\nfrom demo_app import custom_versions\n\
  class DemoView(APIView):\n    versioning_class = custom_versions.DemoViewVersion\n\
  \    def get(self, request, *args, **kwargs):\n        version = request.version\n\
  \        return Response(data={'msg': f' You have hit {version}'})\nclass AnotherView(APIView):\n\
  \    versioning_class = custom_versions.AnotherViewVersion\n    def get(self, request,\
  \ *args, **kwargs):\n        version = request.version\n        if version == 'v1':\n\
  \            # perform v1 related tasks\n            return Response(data={'msg':\
  \ 'v1 logic'})\n        elif version == 'v2':\n            # perform v2 related\
  \ tasks\n            return Response(data={'msg': 'v2 logic'})\n```\n\n让我们探索代码并了解在使用自定义版本类时幕后发生了什么：\n\
  \n*   `DemoView` 类是一个基于类的 `APIView`，我们通过 `versioning_class` 属性传递视图允许的版本。这允许请求对象具有从\
  \ URL 路径解析的 version 属性。由于我们指定了 `DemoViewVersion` 类，因此该视图仅允许 URL 路径中的 `v1`、`v2` 和\
  \ `v3` 版本。路径中的任何其他版本都将导致 `404` 响应。\n\n*   `AnotherView` 类是一个基于类的视图，我们将 `AnotherViewVersion`\
  \ 传递为 `versioning_class` 属性。在此视图中，我们通过检查不同版本并在有 `v1` 或 `v2` 请求时做出不同响应来分支请求。\n\n\
  现在，要将视图逻辑链接到 `demo_app/urls.py` 文件，请添加以下代码：\n\n```\nurlpatterns = [\n    path('hello-world/',\
  \ views.hello_world),\n    path('demo-version/', views.demo_version),\n    path('custom-version/',\
  \ views.DemoView.as_view()),\n    path('another-custom-version/', views.AnotherView.as_view())\n\
  ]\n```\n\n如果我们在浏览器中访问 `http://127.0.0.1:8000/v4/demo-app-version/custom-version/`，我们将看到如下所示的错误，如\
  \ *图 1.8* 所示，因为我们在自定义 `versioning_class` 中仅允许三个版本：\n\n![Figure 1.8: 404 error message\
  \ stating “Invalid version in URL path”](img/B18867_01_08.jpg)\n\n图 1.8：404 错误消息显示“URL\
  \ 路径中的版本无效”\n\n这满足了我们仅允许 API 的某些版本的目的；任何其他 API 版本都将导致错误响应。\n\n重要说明\n\n自定义版本控制只能附加到基于类的视图。如果您未传递任何自定义\
  \ `versioning_class`，则 Django 将从默认设置中选取 `DEFAULT_VERSIONING_CLASS`。\n\n### 避免使用\
  \ Router\n\nRuby on Rails 等框架提供将请求自动映射到给定 URL 模式的功能，具体取决于功能。DRF 借鉴了这一概念并将其作为 Routers\
  \ 功能纳入框架。虽然这是一个很棒的概念，可以学习和尝试，但开发人员应避免在生产环境中使用它，因为这违背了 Django 的原则：“*显式优于隐式*。”\n\n\
  Django 提到它不应展示太多魔法。我个人见过一些遗留系统，开发人员添加了 Router，几个月后，当另一位开发人员想要修复视图中的错误时，他们无法直接找到对应的视图，直到他们恍然大悟，识别出\
  \ Router 概念的那一刻。\n\n有见解的说明\n\n避免使用 Router 是我通过艰难的方式学到的，并且我看到许多开发人员在生产环境中避免使用它。但这也是通过糟糕的经历发展出来的一种观点；你总可以在自己的项目中尝试以更好的方式实现它。\n\
  \n如果您想了解有关 Router 的更多信息，可以在此处了解：[`www.django-rest-framework.org/api-guide/routers/`](https://www.django-rest-framework.org/api-guide/routers/)。\n\
  \n至此，我们已经学习了如何创建 RESTful API 并处理版本控制。现在，让我们学习如何使用 DRF 处理视图。我们主要在视图中编写业务逻辑。\n\n#\
  \ 使用 DRF 处理视图\n\nDRF 扩展了 Django 的视图概念，为创建 REST 端点提供更好的接口。就像 Django 中的函数式和基于类的视图一样，DRF\
  \ 也支持两者。然而，这取决于开发人员选择哪种类型的视图适合其用例。\n\n作为经验法则，当我有一个独立的端点且逻辑简单且未来不会有任何复杂性时，我总是倾向于函数式视图。基于类的视图有一个学习曲线，这阻止了开发人员最初使用它们，但一旦进入门槛被突破，开发人员很少会回到函数式视图。让我们更详细地探索这两种类型的视图。\n\
  \n## 函数式视图\n\nDjango 提供了一个简单的函数式视图接口，帮助任何开发人员更快地开始开发；这就是为什么它对任何开始 Django 的开发人员都很受欢迎。DRF\
  \ 保持了 Django 视图的简洁性，并允许开发人员使用简单的装饰器 `@api_view` 将 Django 视图转换为 DRF。我在逻辑简单或在不会变得过于复杂的简单项目上工作时更喜欢使用它。\n\
  \nDRF 为我们提供了 `@api_view` 来处理常规 Django 函数式视图。添加装饰器会将通常的 Django `HttpRequest` 转换为\
  \ `Request` 实例。装饰器接受给定函数式视图块允许的所有 HTTP 方法的列表；未列出的任何方法都不会被允许。默认情况下，如果未提及任何 HTTP 方法，则它只允许\
  \ `GET` 方法。对于视图的响应，我们应该使用 DRF 中的 `Response` 类而不是 Django 中的 `HttpResponse`；它会自动处理绕过视图的\
  \ `跨站请求伪造`（`CSRF`）并为我们提供与后端服务交互的 UI。\n\n让我们看一个 DRF 函数式视图的示例：\n\n```\nfrom rest_framework.decorators\
  \ import api_view\nfrom rest_framework.response import Response\n@api_view(['GET',\
  \ 'POST', 'PUT'])\ndef hello_world(request, *args, **kwargs):\n    if request.method\
  \ == 'POST':\n        return Response(data={'msg': 'POST response block'})\n   \
  \ elif request.method == 'PUT':\n        return Response(data={'msg': 'PUT response\
  \ block'})\n    return Response(data={'msg': 'GET response block'})\n```\n\n现在，让我们学习如何处理基于类的视图，它们在整个行业中被广泛使用。\n\
  \n## 基于类的视图\n\n如前所述，基于类的视图有一个学习曲线，因此很多开发人员最初会避免使用它。即使我也避免了几个月，直到我看到了更大的图景，但从那以后，就再也没有回头。它利用了继承属性并有助于实现\
  \ `不要重复自己`（`DRY`）原则。对于大型代码库来说，这是绝对必须的，我建议任何开始新项目的开发人员从一开始就实现它。\n\nDRF 提供了两种类型的基于类的视图：`APIView`\
  \ 和通用视图。\n\n### APIView\n\n\n\n\n\nDRF 的 `APIView` 类是 Django `View` 类的扩展。使用 `APIView`\
  \ 类会将默认的 Django `HttpRequest` 转换为 `Request` 对象，并且处理方法可以返回 DRF 的 `Response` 对象而不是\
  \ Django 的 `HttpResponse`。它支持额外的策略属性，如 `authentication_classes`、`permission_classes`\
  \ 和 `versioning_classes`，这让开发者的生活变得轻松许多。我们将在后面的章节中使用它们并详细讨论。\n\n使用 `APIView` 的接口很简单：要为给定端点实现任何\
  \ HTTP 请求方法，只需在类中创建同名的新方法；例如，`GET` 请求会有 `get` 方法，`DELETE` 请求会有 `delete` 方法，以此类推。每当针对给定\
  \ HTTP 方法发出请求时，对应的方法会被自动调用。\n\n让我们用 `APIView` 实现一个快速示例以了解更多：\n\n```\nfrom rest_framework.views\
  \ import APIView\nclass DemoAPIView(APIView):\n    def get(self, request, *args,\
  \ **kwargs):\n        return Response(data={'msg': 'get request block'})\n    def\
  \ post(self, request, *args, **kwargs):\n        return Response(data={'msg': 'post\
  \ request block'})\n    def delete(self, request, *args, **kwargs):\n        return\
  \ Response(data={'msg': 'delete request block'})\n```\n\n将实现的 `APIView` 类链接到 `urls.py`\
  \ 文件的方式与我们之前链接函数视图的方式不同。相反，我们使用 `<class name>.as_view()` 将其链接到对应的 URL：\n\n```\n\
  urlpatterns = [\n    ...\n    path('apiview-class/', views.DemoAPIView.as_view())\n\
  ]\n```\n\n随着我们学习 DRF 和 Django 周围的不同概念，我们将进一步扩展对 `APIView` 的了解。\n\n### 通用视图\n\n在构建\
  \ Web 应用时，会出现开发者在做重复性工作的单调任务的时候。这时 DRY 原则就会发挥作用，开发者会思考如何解决这种重复模式。答案是 `Generic Views`。\n\
  \n`Generic Views` 是 Django 和 DRF 中最受欢迎的功能之一，帮助开发者以闪电般的速度构建基础的 CRUD 操作 API。通用视图与\
  \ DRF 的序列化器和模型概念紧密耦合，所以我们将在学习这些概念后在后面的章节中详细讨论通用视图。\n\n主观性说明\n\n我们这里不讨论 `Viewsets`，因为它主要与\
  \ `Router` 一起使用。我们已经讨论过为什么应该避免在 Django 中使用 Router，但如果你想了解更多，你可以去 DRF 文档，那里用相关示例解释得相当好。\n\
  \n有关 `Viewsets` 的更多详情，请参阅 [`www.django-rest-framework.org/api-guide/viewsets/`](https://www.django-rest-framework.org/api-guide/viewsets/)。\n\
  \n现在我们已经看到了 DRF 的基本集成以及如何使用视图，让我们专注于如何改善开发体验。Web 开发不仅仅是写代码——还在于使用合适的工具。在整本书中，我们将为不同目的介绍更多工具。现在，让我们学习关于\
  \ API 开发工具的知识。\n\n# 介绍 API 开发工具\n\n在开发 API 时，确保端点能处理每种可能的输入非常重要，并且在将 API 交给客户端团队集成之前，我们需要手动测试\
  \ API。虽然为创建的每一块代码/API 编写单元测试和集成测试总是更有利，但我们可能无法做到。因此，API 开发工具在这一旅程中非常有用。\n\nPostman\
  \ 是开发者社区中最受欢迎的工具之一，帮助开发者在开发过程的每个阶段构建 API。虽然通常使用 Postman 来测试 API，但它的用例远不止测试 API，如下所示：\n\
  \n* 创建带有 API 契约的模拟服务器，帮助客户端团队在后端 API 开发期间独立工作\n* 为团队创建文档和 OpenAPI 规范以便使用端点\n* 创建\
  \ API 集合，可按使用场景对 API 进行分组\n* 创建可在远程服务器上定期运行的测试，以确保 API 的契约未发生变化\n\nPostman 网站上的教程系列非常直观：[`learning.postman.com/docs/getting-started/introduction/`](https://learning.postman.com/docs/getting-started/introduction/)。如果您不熟悉，请阅读教程，因为我们将在整本书中使用\
  \ Postman 来测试我们的端点。您也可以使用其他工具来实现相同目的，例如 `hoppscotch`（[`hoppscotch.io/`](https://hoppscotch.io/)）和\
  \ `testmace`（[`testmace.com/`](https://testmace.com/)）。\n\n学习新工具是一项对任何开发者成长都很重要的技能，因为这些工具让我们的开发之旅更轻松。在整本书中，我们将介绍并学习新的工具来帮助实现这一点。\n\
  \n# 总结\n\n在本章中，我们学习了如何使用 Python 的虚拟环境设置本地开发环境，并从头创建了一个 Django 项目。当我们开始新项目时，项目结构非常重要，在本章中，我们学习了如何遵循最佳实践为\
  \ Django Web 应用创建新的项目结构。\n\n在整本书中，我们将使用 REST API，因此我们提供了 REST API 的基本介绍以及创建它们的最佳实践，例如命名约定、添加版本控制以及使用适当的\
  \ HTTP 方法和状态码。我们还学习了如何将 DRF 与 Django 集成，并使用 URL、函数视图和基于类的视图创建一个基础演示应用。\n\n通过阅读本章，我们应该能够从头创建包含多个\
  \ Django 应用的 Django Web 应用，以及 URL 和视图。我们应该能够将 Django 应用添加到 `settings.py` 并使用 DRF\
  \ 创建 RESTful API。\n\n到目前为止，我们只使用静态响应工作，未涉及任何数据库。在下一章中，我们将学习如何设置数据库并将 Postgres 数据库连接到我们的\
  \ Django 项目。\n\n# 2\n"
- "# 探索 Django ORM、模型和迁移\n\n在 *第 1 章* 中，我们看到了如何创建 Django 项目并将视图集成到项目中。视图中的所有响应都是静态的，我们没有看到如何实现代码以使用数据库获取动态响应。\n\
  \n在本章中，我们将看到如何将 PostgreSQL 数据库集成到我们的 Django 项目中，以及 Django 开箱即用的对模型和数据库的支持。如果你之前使用过\
  \ `relational database management systems`（`RDBMSs`），你会知道每当模式更新时执行迁移有多痛苦。然而，Django\
  \ 提供了开箱即用的迁移支持，它将所有复杂性抽象到两个管理命令之下。\n\n之后，我们将学习在使用 Django 模型时的一些最佳实践，以及如何在大数据库表上检查性能优化。最后，我们将查看在\
  \ Django 4.1 中引入的最新的功能：Async ORM。\n\n本章将涵盖以下主题：\n\n* 使用 Django 项目设置 PostgreSQL\n\
  * 使用模型和 Django ORM\n* 理解 Django 迁移的核心\n* 探索使用模型的最佳实践\n* 学习性能优化\n* 探索 Django Async\
  \ ORM\n\n# 技术要求\n\n\n\n\n\n在本章中，我们将使用 Django 模型和数据库。要使用本章中的代码，你需要在系统中安装 Django，并具备上一章讨论的项目结构。你应该能够创建\
  \ Django 应用并将视图连接到 URL，就像我们之前学习的那样。\n\n除此之外，你的技能集中应包含以下内容：\n\n* 你应该了解 RDBMS 的基础知识以及数据库在高层面的工作原理。你还应熟悉数据库规范化和反规范化的概念。\n\
  * 你应该了解 Django ORM 的基础知识，并且之前使用过 Django 模型（你可能已经跟随并理解了上一章提到的 Django Girls 教程）。\n\
  * 你应该了解 SQL 周围的概念，并在你的系统上安装了 PostgreSQL，或拥有稳定的互联网连接以使用远程 PostgreSQL 服务器（[`www.elephantsql.com/`](https://www.elephantsql.com/)）。\n\
  * 你应该安装了 TablePlus（[`tableplus.com/`](https://tableplus.com/)）或任何数据库管理 GUI 工具。\n\
  \n本书的 GitHub 仓库，其中包含本章的所有代码，可以在 [`github.com/PacktPublishing/Django-in-Production/tree/main/Chapter02`](https://github.com/PacktPublishing/Django-in-Production/tree/main/Chapter02)\
  \ 找到。\n\n重要说明\n\n数据库和 Django ORM 涵盖的概念范围很广，本章不可能涵盖每个主题。我的个人经验表明，许多开发者不了解一些基本概念，这阻碍了他们在项目中使用高级概念，并导致他们犯下新手错误。虽然我们会尽量解释所有重要概念，但你可以查看本章中提供的信息框，它们会引导你查阅官方文档以获取额外信息。\n\
  \n重要说明\n\n在本章中，我们将使用 Django ORM 和 Django ORM 查询的代码片段。本章中使用的代码片段可能不是自足的，可能需要额外的代码才能执行。如果你对代码片段的理解有任何问题，或无法独立执行它们，请加入我们的\
  \ *Django in Production* Discord 频道并在那里提问。以下是我们 Discord 服务器的邀请链接，你可以直接联系到我：[`discord.gg/FCrGUfmDyP`](https://discord.gg/FCrGUfmDyP)。\n\
  \n# 使用 Django 项目设置 PostgreSQL\n\nDjango 默认集成了 `SQLite3` 用于初始开发目的，这有助于开发者在无需初始数据库设置麻烦的情况下开始项目。在我们的例子中，我们在\
  \ *Chapter 1* 中使用了 SQLite3。然而，它是一个基于文件的数据库，不建议在生产中使用，因为它无法扩展。\n\n相反，我们将在整本书中将 `PostgreSQL`\
  \ 作为与 Django 配合使用的数据库选择。由于始终建议尽可能让本地开发环境与生产环境保持一致，我们将为本地开发设置 PostgreSQL。\n\n重要说明\n\
  \n你可以通过在 `settings.py` 文件中做少量更改，使用其他受支持的数据库，如 MySQL、MariaDB 和 Oracle（[`docs.djangoproject.com/en/stable/ref/databases/#databases`](https://docs.djangoproject.com/en/stable/ref/databases/#databases)）。但请记住，并非所有数据库都支持所有\
  \ ORM 功能，因此如果你使用其他数据库，请查阅文档以获取更多详细信息。\n\n在本地系统上设置 PostgreSQL 有时可能是一项艰巨的任务，因此我建议为此目的使用\
  \ Docker（我们将在 *Chapter 11* 中了解更多）。然而，为了便于学习，我们将使用 ElephantSQL，一个远程 PostgreSQL 服务器，来开始。ElephantSQL（[`www.elephantsql.com/`](https://www.elephantsql.com/)）提供了一个配置有限的免费\
  \ PostgreSQL 服务器；这足以让你跟随本书中我们将学习的所有内容。\n\n那么，让我们看看如何使用 ElephantSQL 创建一个 PostgreSQL\
  \ 服务器，然后将其用于配置 Django 使用 PostgreSQL。\n\n## 创建 PostgreSQL 服务器\n\n如果你已经拥有 PostgreSQL\
  \ 服务器，可以跳到 *Configuring Django with PostgreSQL* 部分。如果没有，请按照以下步骤使用 ElephantSQL 创建你的免费\
  \ PostgreSQL 服务器：\n\n1. 前往 [`customer.elephantsql.com/login`](https://customer.elephantsql.com/login)\
  \ 并创建一个新的免费账户（不需要信用卡，任何人都可以创建）。\n2. 登录后，你将看到以下屏幕。点击 **Create New Instance**：\n\n\
  ![Figure 2.1: ElephantSQL – new user dashboard](img/Figure_2.1_B18867.jpg) \n\n\
  Figure 2.1: ElephantSQL – new user dashboard\n1. 接下来，填写以下详细信息：\n   1. **Name**：实例的名称；你可以选择任何你认为合适的名称\n\
  \   2. **Plan**：选择 **Tiny Turtle (Free)**\n   3. **Region**：你可以选择任何区域和云提供商\n2. 之后，你应该能在\
  \ ElephantSQL 仪表板上看到你的数据库实例。*Figure 2.2* 显示了我的数据库配置：\n\n![Figure 2.2: PostgreSQL\
  \ server details, as shown in the ElephantSQL dashboard](img/Figure_2.2_B18867.jpg)\
  \ \n\nFigure 2.2: PostgreSQL server details, as shown in the ElephantSQL dashboard\n\
  \n请注意 **Server**、**User & Default database** 和 **Password** 字段，我们将在下一步中使用这些信息。\n\
  1. 现在，我们将尝试使用 TablePlus（[`tableplus.com/`](https://tableplus.com/)）或任何其他数据库 GUI\
  \ 工具通过端口 `5432` 连接到 PostgreSQL 服务器。使用你刚刚收集的信息填写连接向导中的详细信息并点击 **Test**；你应该会看到以下屏幕：\n\
  \n![Figure 2.3: The PostgreSQL Connection wizard screen of TablePlus when the test\
  \ connection is successful](img/Figure_2.3_B18867.jpg) \n\nFigure 2.3: The PostgreSQL\
  \ Connection wizard screen of TablePlus when the test connection is successful\n\
  \n重要说明\n\n默认情况下，PostgreSQL 运行在端口 `5432` 上。ElephantSQL 也为终端用户通过不同应用程序连接公开了相同的端口。\n\
  1. 一旦所有字段都变绿，你可以点击 **Connect** 按钮在本地 GUI 中打开数据库。\n\n现在我们已经从本地系统建立了与远程 PostgreSQL\
  \ 服务器的连接，我们将学习如何配置 Django 使其能够连接到 PostgreSQL。\n\n## 配置 Django 使用 PostgreSQL\n\n\
  在上一章中，我们学习了如何创建 Django 项目结构；我们将继续沿用相同的结构。在整本书中，我们将使用一个博客应用的示例来理解 Django 的不同深入功能。你可以在\
  \ [`github.com/PacktPublishing/Django-in-Production`](https://github.com/PacktPublishing/Django-in-Production)\
  \ 查看项目结构。\n\n一旦你准备好 `myblog` 项目，我们就可以配置数据库。Django 中的数据库配置放在 `settings.py` 文件中。如果你打开默认的\
  \ `settings.py` 文件，你将能够找到 `DATABASES` 变量，其中已经配置了 SQLite3：\n\n```\nDATABASES = {\n\
  \    'default': {\n        'ENGINE': 'django.db.backends.sqlite3',\n        'NAME':\
  \ BASE_DIR / 'db.sqlite3',\n    }\n}\n```\n\n现在，让我们使用在 *Creating a PostgreSQL server*\
  \ 部分看到的远程 PostgreSQL 服务器配置来替换 SQLite3 设置。更新值后，`settings.py` 文件的数据库配置应如下所示：\n\n\n\
  \n\n\n```\nDATABASES = {\n    'default': {\n        'ENGINE': 'django.db.backends.postgresql',\n\
  \        'HOST': 'tiny.db.elephantsql.com',\n        'NAME': 'wcgzvqra',\n     \
  \   'USER': 'wcgzvqra',\n        'PORT': 5432,\n        'PASSWORD': 'lyuX6vWvAtrqZSY1oiPKNBMoKFkctBVn',\n\
  \    }\n}\n```\n\n添加 PostgreSQL 配置后，在终端中运行 `python manage.py runserver`。这会给出一个长错误，提示\
  \ `No module named 'psycopg2' is found`。要修复此问题，Django 需要一个额外的包 `psycopg2`，它是 Python\
  \ 的 PostgreSQL 适配器。\n\n本书中我们不会使用 `psycopg2`，因为它需要使用源代码构建。相反，我们将使用 `binary`，因为它更推荐给初学者。让我们使用以下命令安装此包：\n\
  \n```\npip install psycopg2-binary\n```\n\n这将在我们的本地 Python 环境中安装 PostgreSQL 客户端包。\n\
  \n重要说明\n\n在开发期间使用 `psycopg2-binary`，但在生产环境中尽量避免使用。有关更多信息，请参阅 [`www.psycopg.org/docs/install.html#psycopg-vs-psycopg-binary`](https://www.psycopg.org/docs/install.html#psycopg-vs-psycopg-binary)。\n\
  \n现在，再次运行 `python manage.py runserver` 命令；我们应该会看到默认的起飞屏幕，就像我们在浏览器中打开 `http://127.0.0.1:8000`\
  \ 时看到的那样（就像我们在 *Chapter 1* 中看到的那样）。\n\n重要说明\n\n在 `settings.py` 文件中硬编码数据库或任何项目相关配置并不是推荐或最优的方式。我们应该使用环境变量来执行此类操作。我们将在\
  \ *Chapter 11* 中使用 Docker 时学习更多关于使用环境变量获取项目配置的内容。\n\n现在我们已将 PostgreSQL 集成到 Django\
  \ 项目中，让我们学习如何使用模型和 Django ORM。\n\n# 使用模型和 Django ORM\n\n对于任何组织而言，数据都是 Django 中最重要的基础元素之一，而\
  \ `models.py` 文件用于结构化数据库中数据的存储方式。一个架构良好的系统将拥有坚实的 Django 模型基础，在此基础上，开发者在创建数据库模式之前花费了足够的时间并进行了适当的调研。\n\
  \n开发者在设计模式时最常见的问题之一是是否执行规范化或反规范化。答案始终是“视情况而定”。它取决于多个因素，例如数据访问模式和我们试图解决的性能瓶颈。因此，作为经验法则，始终更倾向于先从规范化的数据库模式设计开始，然后随着我们发现不同的用例，尝试通过引入缓存或索引来解决问题，最后再进行反规范化。\n\
  \n重要说明\n\n我们不会关注如何使用 Django 模型的基础知识，或如何使用 Django ORM 编写查询。如果您不熟悉 Django 模型的基础知识，请阅读官方网站上的\
  \ Django 教程或阅读官方文档 [`docs.djangoproject.com/en/stable/ref/models/querysets/`](https://docs.djangoproject.com/en/stable/ref/models/querysets/)。\n\
  \n我们不会介绍 Django ORM 的基本概念，但在下一节中，我们将把 Django 模型集成到博客应用中。\n\n## 添加 Django 模型\n\n\
  对于不同的博客应用，我们可以根据功能拥有不同类型的数据库模型。在我们的应用中，我们将从 `blog` 和 `author` 等基本功能开始。我们将创建单独的 Django\
  \ 应用来添加这些模型：\n\n```\npython manage.py startapp author\npython manage.py startapp\
  \ blog\n```\n\n现在，将应用添加到 `settings.py` 中的 `CUSTOM_APPS` 部分：\n\n```\nCUSTOM_APPS\
  \ = [\n    'blog',\n    'author',\n]\n```\n\n现在，前往 `author/models.py` 文件并添加 `Author`\
  \ 模型：\n\n```\nclass Author(models.Model):\n    name = models.CharField(max_length=100)\n\
  \    email = models.EmailField()\n    bio = models.TextField()\n    def __str__(self):\n\
  \        return self.name\n```\n\n同样，将 `Blog` 模型添加到 `blog/models.py` 文件中：\n\n```\n\
  class Blog(models.Model):\n    title = models.CharField(max_length=100)\n    content\
  \ = models.TextField()\n    author = models.ForeignKey('author.Author', on_delete=models.CASCADE)\n\
  \    created_at = models.DateTimeField(auto_now_add=True)\n    updated_at = models.DateTimeField(auto_now=True)\n\
  \    def __str__(self):\n        return self.title\n```\n\n现在，运行迁移命令以创建迁移，并将迁移应用到数据库：\n\
  \n```\npython manage.py makemigrations\npython manage.py migrate\n```\n\n至此，我们已成功使用\
  \ Django ORM 添加了基本数据库模型。现在，让我们讨论一些关于不同 Django ORM 功能的重要要点，以便我们更好地了解如何高效地使用 Django。\n\
  \n## 基本 ORM 概念\n\n在本节中，我们将学习不同的 ORM 概念，帮助 Django 开发者高效地使用 ORM 实现业务逻辑。\n\n### Null\
  \ 与 blank\n\n创建新模型字段时，`null=True` 表示允许该列存储 `null` 值，而 `blank=True` 表示 Django 管理后台将允许该字段以空字符串作为有效值。简而言之，`null=True`\
  \ 是数据库约束，而 `blank=True` 是 Django 应用约束。\n\n我们也可以同时使用 `null` 和 `blank`。例如，我们可以允许 `Author`\
  \ 模型的 `bio` 字段同时为 `null` 和 `blank`：\n\n```\nclass Author(models.Model):\n    ...\n\
  \    bio = models.TextField(null=True, blank=True)\n```\n\n### auto_now 与 auto_now_add\n\
  \n`DateTime` 字段有两个选项，允许开发者自动将当前时间保存到数据库字段中：\n\n*   `auto_now` 在有人编辑给定行时，用当前 `DateTime`\
  \ 字段更新值\n*   `auto_now_add` 仅在对象创建时添加当前时间戳\n\n现在，一个重要问题是，我们应该在什么时候使用它们？作为基本经验法则，我建议使用\
  \ `auto_now_add` 来捕获 *created at* 时间戳，并使用 `auto_now` 来捕获最后的 *updated at* 时间戳。\n\n\
  让我们学习如何在 Django ORM 中使用这些选项：\n\n```\nclass Blog(models.Model):\n    ...\n    created_at\
  \ = models.DateTimeField(auto_now_add=True)\n    updated_at = models.DateTimeField(auto_now=True)\n\
  \    ..\n```\n\n### 避免使用原始 SQL 查询\n\nDjango ORM 是数据库查询的包装器，因此，有时开发者会想直接添加 SQL 查询逻辑。Django\
  \ 为我们提供了不同的接口，例如 `connection.cursor` 上下文管理器和 `<Model>.objects.raw()` 模型 ORM 接口，通过\
  \ Django 数据库连接执行原始查询。尽量避免在 Django 中使用原始 SQL 查询，并且除非必要，请确保在应用代码中有足够的检查以防止 SQL 注入。\n\
  \n### 使用查询表达式和数据库函数\n\n查询表达式是开发者因学习曲线而避免使用的一种最被低估的功能。在构建应用逻辑时，您应始终尝试在 SQL 中执行所有数学和逻辑操作。例如，如果应用用例需要我们查找员工的平均薪资，我们应避免在\
  \ Python 中编写逻辑；相反，我们应使用 Django ORM 的 `aggregate` 来执行此操作，例如 `<model>.objects.aggregate(Avg('salary'))`。\n\
  \n重要说明\n\nDjango 文档提供了大量查询表达式和数据库函数的示例，例如 *aggregate*、*F* 和 *window* 函数，它们有助于在数据库层执行计算。这比在\
  \ Python 中编写的常规逻辑更快、更具可扩展性。\n\n\n\n\n\n请阅读以下文档以了解更多关于查询表达式和数据库函数的信息，以便更好地使用 Django\
  \ ORM 层。对于查询表达式，请查看 [`docs.djangoproject.com/en/stable/ref/models/expressions/`](https://docs.djangoproject.com/en/stable/ref/models/expressions/)。对于数据库函数，请查看\
  \ [`docs.djangoproject.com/en/stable/ref/models/database-functions/`](https://docs.djangoproject.com/en/stable/ref/models/database-functions/)。\n\
  \n### 使用反向外键查找\n\n当我们在 Model A 和 Model B 之间创建外键关系时，也会建立反向关系。例如，让我们考虑 **Author**\
  \ 和 **Blog** 模型：\n\n```\nclass Author(models.Model):\n    name = models.CharField(max_length=100)\n\
  \    email = models.EmailField()\n    bio = models.TextField()\nclass Blog(models.Model):\n\
  \    title = models.CharField(max_length=200)\n    content = models.TextField()\n\
  \    author = models.ForeignKey('author.Author', on_delete=models.PROTECT)\n```\n\
  \n在前面的代码中，我们定义了 `Author` 模型和 `Blog` 模型，它们通过 `ForeignKey` 字段关联。现在，让我们学习如何在应用程序中使用外键。\n\
  \n设置虚拟数据\n\n在运行本节中的代码片段之前，我们需要用虚拟数据填充数据库。你可以自己创建虚拟数据，也可以按照本书 GitHub 仓库中提到的说明进行操作：[`github.com/PacktPublishing/Django-in-Production/tree/main/Chapter02`](https://github.com/PacktPublishing/Django-in-Production/tree/main/Chapter02)。\n\
  \n在这个示例中，通过直接访问 `author` 对象，很容易从 `blog` 对象获取作者信息：\n\n```\n>>> from blog import models\
  \ as blog_models\n>>> author_obj = blog_models.Blog.objects.get(id=1).author\n>>>\
  \ author_obj\n<Author: John Doe>\n```\n\n但是如果我们需要从 `author` 对象获取博客信息，我们可以使用反向外键查找：\n\
  \n```\n>>> from author import models as author_models\n>>> author = author_models.Author.objects.get(email='john@gmail.com')\n\
  >>> all_blogs_by_an_author = author.blog_set.all()\n>>> selected_blog = author.blog_set.filter(title='Python\
  \ is cool')\n>>> selected_blog\n<QuerySet [<Blog: Python is cool>]>\n```\n\n这里，`blog_set`\
  \ 是自动命名的，因为我们没有设置任何 `related_name` 属性。我们可以通过使用 `.all()` 获取所选作者的所有博客，并且也可以像我们在 `filter`\
  \ 选项中所做的那样将其用作常规 QuerySet。\n\n至此，我们已经学习了一些基本概念，可以帮助我们更好地使用 ORM 和 Django 模型。现在，让我们学习如何从\
  \ Django ORM 中检索原始 SQL 查询。\n\n## 如何从 ORM 获取原始查询\n\nDjango 在 SQL 查询之上提供了大量的抽象层，使我们能够在不深入\
  \ SQL 查询复杂性的情况下执行任何数据库相关操作。然而，有时有必要查看 Django 在幕后创建的原始查询，以便进行某些优化或更深入地查看查询。\n\n在使用\
  \ QuerySet 时，检索数据库查询非常容易。例如，如果我们打印 QuerySet 的 `.query` 属性，则可以获取原始 SQL 查询：\n\n```\n\
  >>> from author import models\n>>> all_authors = models.Author.objects.filter(email__endswith='@gmail.com').values_list('name').query\n\
  SELECT \"author_author\".\"name\" FROM \"author_author\" WHERE \"author_author\"\
  .\"email\"::text LIKE %@gmail.com\n```\n\n在 Django 中，我们有一些非 QuerySet 的查询，例如 `count`。当我们尝试为非\
  \ QuerySet 对象检索查询时，会出现以下错误：\n\n```\n>>> from author import models\n>>> author_count\
  \ = models.Author.objects.filter(email='a').count()\nTraceback (most recent call\
  \ last):\n  File \"<console>\", line 1, in <module>\nAttributeError: 'int' object\
  \ has no attribute 'query'\n```\n\n要检索这些查询，我们可以使用 `ConnectionProxy` 对象，通过 `django.db\
  \ import connection` 导入它；所有数据库查询都通过此代理传递并被记录。由于连接对象会在 Django 访问数据库时记录所有数据库查询，因此它会将所有查询一个接一个地存储为列表形式，其中最新的数据库查询会被追加到列表的最后一个位置。每个连接查询有两个属性——原始\
  \ SQL 查询在 `sql` 键中，给定查询的总执行时间以秒为单位在 `time` 键中：\n\n```\n>>> from django.db import\
  \ connection\n>>> from author import models\n>>> author_count = models.Author.objects.filter(email='a').count()\n\
  >>> connection.queries[-1]\n{'sql': 'SELECT COUNT(*) AS \"__count\" FROM \"author_author\"\
  \ WHERE \"author_author\".\"email\" = \\'a\\'', 'time': '0.166'}\n```\n\n原始 SQL\
  \ 查询已突出显示。\n\n重要说明\n\n`ConnectionProxy` 对象仅在 Django 服务器以 `DEBUG=True` 模式运行时才记录日志，这意味着我们在本地开发服务器上工作时能够检索查询。对于生产环境，还有其他监控工具，例如\
  \ `newrelic`，可以帮助我们以更好的方式检索信息。我们将在 *Chapter 14* 中了解更多关于 `newrelic` 的内容。\n\n## 使用\
  \ Django ORM 进行规范化\n\n数据库模式设计是任何开发者的核心技能。设计数据库模式时没有对错之分——我们只需遵循基本原则并对某些决策进行推理。在\
  \ RDBMS 中，三种类型的关系可以满足所有用例：\n\n* 一对一关系，其中每个实体最多有一个相关实体\n* 一对多（外键）关系，其中一个实体可以有多个相关实体（反之亦然）\n\
  * 多对多关系，其中多个实体可以与多个其他相关实体相关\n\n作为经验法则，我们应该始终从规范化数据库模式开始，然后根据数据访问模式和性能瓶颈慢慢迁移到非规范化模式。让我们学习如何在\
  \ Django 中实现规范化以及何时实现。\n\n### OneToOneField\n\n正如我们刚才提到的，一对一关系意味着对于每个实体，只会有一个相关实体。例如，每个博客只会有一个封面图片与之关联，因此我们可以在这里使用\
  \ `OneToOneField` 来建立关系：\n\n![Figure 2.4: A one-to-one relationship between Blog\
  \ and CoverImage](img/B18867_02_04.jpg) \n\nFigure 2.4: A one-to-one relationship\
  \ between Blog and CoverImage\n\n在 Django 中，`OneToOneField` 类似于 `ForeignKey`，只是对\
  \ `ForeignKey` 额外添加了 `unique=True` 约束：\n\n```\nclass Blog(models.Model):\n    title\
  \ = models.CharField(max_length=200)\n    content = models.TextField()\n    author\
  \ = models.ForeignKey(Author, related_name='author_blogs', on_delete=models.PROTECT)\n\
  class CoverImage(models.Model):\n    image_link = models.URLField()\n    blog =\
  \ models.OneToOneField(Blog, related_name='blog_ci', on_delete=models.PROTECT)\n\
  ```\n\n`OneToOneField()` 可以存在于任一表中——即 `Blog` 或 `CoverImage`。另一个表中的对象可以使用反向外键查找访问相关数据，这与本章前面学到的概念相同。\n\
  \n### ForeignKey 字段\n\n`ForeignKey` 用于在两个不同模型之间表示一对多关系。例如，一位作者可以撰写多篇博客，如下所示：\n\n\
  ![Figure 2.5: ForeignKey relationship between Author and Blog](img/B18867_02_05.jpg)\
  \ \n\nFigure 2.5: ForeignKey relationship between Author and Blog\n\n在 Django 中，我们可以在\
  \ `Author` 和 `Blog` 模型之间创建 `ForeignKey` 关系：\n\n\n\n\n\n```\nclass Author(models.Model):\
  \ \n     name = models.CharField(max_length=100) \n     email = models.EmailField()\
  \ \n     bio = models.TextField()\nclass Blog(models.Model):\n    title = models.CharField(max_length=200)\n\
      content = models.TextField()\n    author = models.ForeignKey(Author, related_name='author_blogs',\
  \ on_delete=models.PROTECT)\n```\n\n在前面的代码中，每个 `author` 对象可以关联多个博客，但反过来则不行。\n\n\
  ### 重要说明\n\n我们可以通过建立自引用关系在模型中创建递归关系。这可以通过使用 `models.ForeignKey('self', on_delete=models.PROTECT)`\
  \ 约束来实现。\n\n`ForeignKey` 和 `OneToOneField` 中我们都有的一个重要属性是 `on_delete`，它决定了当父相关对象被删除时我们会做什么。Django\
  \ 提供了多种选项，但如果你不确定，始终使用 `PROTECT`；这会阻止删除操作的发生并防止你的数据损坏。\n\n### ManyToManyField\n\n\
  `ManyToManyField` 用于创建一种关系，其中一个模型的多個对象与另一个模型的多個对象相关联。例如，一篇博客可以有多个标签，而一个标签可以关联多篇博客：\n\
  \n![Figure 2.6: ManyToManyField relationship between Blog and Tag](img/B18867_02_06.jpg)\
  \ \n\nFigure 2.6: ManyToManyField relationship between Blog and Tag\n\n当我们创建 `ManyToManyField`\
  \ 时，Django 默认会创建一个中间表来在两个表之间建立映射关系。\n\n#### Customizing ManyToManyField\n\n使用 `through`，Django\
  \ 提供了接口，允许我们使用任何自定义模型在表之间创建映射关系。这是一个高级功能，你可以从官方文档中了解更多：https://docs.djangoproject.com/en/stable/ref/models/fields/#django.db.models.ManyToManyField.through.\n\
  \nDjango ORM 足够强大，可以提供大量高级数据库规范化查询。\n\n### Important note\n\nDjango 文档提到了我们在 Django\
  \ 中处理关系时可以使用的大量不同功能。我们在本节中只是触及了皮毛，因此请查看官方文档页面以了解更多关于它们的信息：[`docs.djangoproject.com/en/stable/ref/models/fields/#module-django.db.models.fields.related`](https://docs.djangoproject.com/en/stable/ref/models/fields/#module-django.db.models.fields.related)。\n\
  \n我们对每个规范化字段都使用了 `on_delete` 选项。它是 `ForeignKey` 和 `OneToOneField` 的强制选项。让我们探索 Django\
  \ 提供的 `on_delete` 的不同选项。\n\n## Exploring on_delete options\n\n在上一节中，在处理规范化数据时，我们将数据保存在多个表中，并使用数据库字段将每个条目链接到另一个条目。由于数据保存在不同的表中，如果有人删除了引用另一张表的行会发生什么？这正是\
  \ `on_delete` 关键字解决的用例。例如，我们有 `Author` 表，然后是 `Blog` 表。每篇博客都是由一位作者撰写的，所以如果我们有 `author_1`，他撰写了\
  \ 10 篇不同的博客，那么在我们的数据库中，`Author` 表中会有 `author_1` 的条目，而 `Blog` 表中会有 10 篇不同博客的条目。现在，如果有人删除了\
  \ `author_1` 条目，那么这 10 篇博客的数据将被损坏。为了解决这个问题，我们可以告诉 Django 当有人尝试删除 `author_1` 条目时如果存在相关条目该怎么做。\n\
  \nDjango 在定义模型时配置 `on_delete` 时提供了七种不同的选项，我们可以使用：\n\n*   `CASCADE`: 当相关模型对象被删除时，Django\
  \ 也会删除所有依赖的模型对象。\n*   `PROTECT`: Django 不允许删除与之关联有依赖模型对象的任何模型对象。\n*   `RESTRICT`:\
  \ 这会通过引发 `RestrictedError` 来阻止被引用对象被删除。\n*   `SET_NULL`: 这会将 `foreignkey` 值设置为 `null`。只有在\
  \ `null` 设置为 true 时才可能。\n*   `SET_DEFAULT`: 这会将 `foreignkey` 值设置为其默认值。\n*   `SET`:\
  \ 使用自定义函数为 `foreignkey` 字段生成自定义值。\n*   `DO_NOTHING`: 不采取任何操作。\n\n现在，让我们学习模型继承以及在\
  \ Django 中编码时我们应该如何利用继承。\n\n## Using model inheritance\n\n在 Django 中实现任何模型时，我们使用标准的\
  \ Python 继承概念从 `django.db.models.Model` 继承基类。在使用模型继承时，开发人员可以选择每个父模型是否通过 `multi-table\
  \ inheritance` 拥有数据库表，或者父模型是否通过 `abstract base classes` 作为没有物理数据库表的抽象模型。让我们学习 Django\
  \ 提供的不同类型的模型继承。\n\n### Abstract base classes\n\n在 Django 中构建不同的应用程序逻辑时，我们会遇到具有几乎所有字段和多个通用模型方法的模型，只剩下几个字段和属性。这些正是我们应该使用抽象模型的完美场景。\n\
  \n例如，始终在创建的所有模型对象中拥有时间戳是一个很好的实践，而不是一遍又一遍地重复相同的代码；我们可以创建一个基础时间戳抽象模型，并让所有其他模型继承它：\n\
  \n```\nclass BaseTimeStampModel(models.Model):\n    created_at = models.DateTimeField(auto_now_add=True)\n\
      updated_at = models.DateTimeField(auto_now=True)\n    class Meta:\n        abstract\
  \ = True\nclass CoverImage(BaseTimeStampModel):\n    image_link = models.URLField()\n\
  ```\n\n当我们使用此模型时，只会创建一个 `CoverImage` 模型以及 `created_at` 和 `updated_at` 字段。请注意我们在\
  \ `Meta` 类中添加的额外抽象属性：`abstract` 标志定义模型为抽象，因此如果我们不添加 `abstract` 标志，则我们的迁移将在数据库中创建实际的数据库模型表。\n\
  \n### Multi-table inheritance\n\n在多表继承中，每个模型在数据库中都会有对应的表。在这里，Django 在幕后自动创建一个 `OneToOneField`\
  \ 关系字段来支持多表继承。\n\n然而，你应该避免使用多表继承，因为每个子表都会获得一个与一对一关系关联的新父表。这会导致不必要的创建多个表，并且由于 Django\
  \ 在幕后创建关系，你对其控制非常有限。始终优先使用抽象模型或自定义 `OneToOne` 关系。简而言之，避免在生产环境中使用多表继承。\n\n### Proxy\
  \ model\n\n有时我们有 Django 模型需要暴露给不同的 Django 应用程序或仅修改模型类的 Python 行为。代理模型非常适合此类用例。它们可以被认为是\
  \ SQL 中视图概念的等价物，即 **虚拟表**，如下所示：\n\n```\nclass Author(models.Model):\n    first_name\
  \ = models.CharField(max_length=100)\n    last_name = models.CharField(max_length=100)\n\
      email = models.EmailField()\nclass BlogAuthor(Author):\n    class Meta:\n        proxy\
  \ = True\n    def perform_something(self):\n        pass\n```\n\n在这个例子中，`BlogAuthor`\
  \ 是一个代理模型，不会在数据库中创建任何表，但它是 `Author` 模型的包装器。此外，请注意我们在 `Meta` 类中设置的 `proxy` 标志，以启用模型的代理行为。\n\
  \n\n\n\n\n到目前为止，我们已经探索了 Django 模型的概念，了解了如何在 Python 中创建不同的字段和模型。接下来，我们将探索这段 Python\
  \ 代码是如何转换为数据库表的，以及 Django 如何为我们提供迁移接口。\n\n# 理解 Django 迁移的核心\n\n`Migration` 对于工程师来说是令人最畏惧的词汇之一，无论是将旧框架迁移到新框架，还是将数据从旧系统迁移到新系统，或是在我们的案例中，迁移数据库架构相关的变更。事实上，在许多早期初创公司中，开发者主要使用\
  \ NoSQL，因为业务处于如此初创的阶段；开发者不想每隔一天就进行数据库迁移，因为业务需求必须适应新的数据库架构需求。\n\n然而，Django 开箱即用地解决了数据库架构迁移问题。在本节中，我们将学习\
  \ Django 在幕后如何处理迁移，以及如何像专业人士一样使用 Django 迁移来解决抛给我们的任何挑战。\n\n## 揭秘迁移管理命令\n\n每当我们问任何开发者如何在\
  \ Django 中执行迁移时，我们得到的常见答案是，我们可以通过运行以下命令来执行迁移：\n\n```\npython manage.py makemigrations\n\
  python manage.py migrate\n```\n\n虽然这就是 Django 执行迁移的方式，但 Django 在幕后抽象了许多复杂性，只暴露了这两个管理命令。让我们深入探讨一下，当我们运行这些命令时，Django\
  \ 在幕后执行了什么以及如何执行。\n\n### makemigrations 命令\n\n一旦我们创建了新模型或更新了现有模型，我们运行 `makemigrations`\
  \ 命令来根据上一个数据库架构和模型变更后的新数据库架构创建新的迁移文件。这是通过比较应用的 `migrations` 文件夹中存在的先前迁移文件来实现的；`migrations`\
  \ 文件夹将以 `0001_initial.py` 作为第一个文件。后续文件将使用顺序文件编号创建。\n\nDjango 会根据其识别到的差异类型自动生成新的迁移文件名。Django\
  \ 的迁移系统可以使用 `migrations` 文件夹来识别当前 `models.py` 架构与现有数据库架构之间的差异。为了给新创建的迁移文件一个有意义的名称，请使用\
  \ `makemigrations --name`。\n\n我们还应该记住，Django 中生成的迁移文件不是 SQL 文件，而是 Django-Python\
  \ 脚本。\n\n重要提示\n\n我们应该将 `migrations` 文件夹提交到 VCS（例如 `git`），以便在协作期间，开发者不会遇到数据库架构不一致的情况。在协作时，常见的情况是在同一应用的\
  \ `migrations` 文件夹中出现重复的文件编号。虽然 Django 在这些情况下为我们提供了保障，但始终建议建立系统测试来标记任何此类冲突，以便我们在验证数据库相关变更后手动解决这些问题。\n\
  \n一旦迁移文件创建完成，我们需要使用 `migrate` 命令将迁移应用到数据库。\n\n### migrate 命令\n\n`migrate` 命令执行新生成的迁移文件并执行数据库架构变更。一旦数据库架构为某个迁移文件更新，它会在\
  \ `django_migrations` 表中创建一个新条目。该表由 Django 用于识别哪些迁移变更已应用到数据库，哪些是新的。例如，*图 2.7* 显示了\
  \ `django_migrations` 表的截图，其中包含三个主要列：\n\n* `app`：迁移文件所属的应用\n* `name`：`migrations`\
  \ 文件夹中被执行的文件名\n* `applied`：迁移被应用的时间戳：\n\n![Figure 2.7: The django_migrations table](img/Figure_2.7_B18867.jpg)\n\
  \n图 2.7：django_migrations 表\n\n除了这两个主要管理命令外，Django 还为我们提供了另外两个命令：\n\n* `sqlmigrate`：这会给出迁移的\
  \ SQL 语句\n* `showmigrations`：这会显示当前项目的迁移和状态\n\n现在，让我们介绍一些技巧，说明如何为不同的用例使用 Django\
  \ 迁移命令。\n\n## 像专业人士一样执行数据库迁移\n\n在本节中，我们将学习如何处理迁移，以及在处理 Django 迁移时应避免的一些事项。\n\n###\
  \ 执行反向迁移\n\n大多数时候，我们都是向前执行迁移，这意味着我们对模型做了一些更改，然后运行那两个神奇的命令，让 Django 为我们处理数据库架构变更。但当我们在功能之间工作时，我们必须在本地分支之间切换；虽然代码会更改，但我们的数据库架构不会更改，这时我们开始遇到数据库架构问题。Django\
  \ 对此问题有解决方案；就像我们可以在数据库中进行新的架构变更一样，Django 也有一种方法来还原我们执行的数据库架构变更。\n\n例如，假设 blog 应用有四个\
  \ `migrations` 文件，最后一个迁移文件是在当前工作分支中创建的。当我们切换分支到 `main` 时，`main branch` 只有三个迁移变更，所以我们希望拥有三个数据库迁移。要实现这一点，我们将使用\
  \ Django 的反向迁移。通过使用带有迁移文件编号的 Django `migrate` 命令（`python manage.py migrate <app_name>\
  \ <migration_num>`），我们可以执行反向迁移。\n\n让我们查看一个真实的反向迁移示例。在此示例中，我们正在执行反向迁移并展示我们在控制台中会收到的输出：\n\
  \n```\n~ python manage.py migrate blog 0001\nOperations to perform:\n  Target specific\
  \ migration: 0001_initial, from blog\nRunning migrations:\n  Rendering model states...\
  \ DONE\n  Unapplying blog.0002_coverimage_alter_blog_author... OK\n```\n\n前面的代码移除了我们在\
  \ `0002` 迁移中应用的数据库变更。\n\n重要提示\n\n有时，当你运行反向迁移命令时，终端可能会出现反向失败的消息。这通常是由于数据依赖或另一个应用相关的依赖所致；你必须逐案处理。解决此类问题的方案超出了本书的范围，遗憾的是，几乎没有资源可以帮助解决这个问题。\n\
  \n### 使用假迁移\n\n当我们手动应用某些数据库架构变更操作时，我们可以使用这种强大的假迁移来使我们的数据库和 Django 迁移系统重新同步。例如，假设我们需要在一个大表中创建一个新列，我们知道这可能需要很长时间来执行；我们不想通过\
  \ Django 管理命令执行此操作。相反，我们会希望让我们的 DBA 执行此操作。然后，一旦新列被添加，我们就可以使用 `fake` 标志运行 `migrate`\
  \ 命令。通过使用带有 `fake` 标志的 Django `migrate` 命令（例如 `python manage.py migrate <app_name>\
  \ <migration_num> --fake`），我们可以执行假迁移。\n\n让我们学习如何运行假迁移。要执行假迁移，我们需要新的迁移文件变更需要应用。如果我们用一些更改更新模型代码，这将创建数据库迁移。更新\
  \ author 模型以向 `name` 字段添加 `db_index` 并添加新的 `demo_field`，如下所示：\n\n```\nclass Author(models.Model):\n\
      name = models.CharField(max_length=100)\n    demo_field = models.TextField(default='demo')\n\
      email = models.EmailField(unique=True)\n    bio = models.TextField()\n```\n\n\
  \n\n\n现在，运行 `python manage.py makemigrations` 命令；我们将在 `author/migrations` 文件夹中得到一个新的假字段。我们不想将更改应用到数据库中，因此我们将伪造迁移。要伪造我们的迁移，我们将以假迁移的方式执行\
  \ `author` 应用 `0002` 的 `migrate` 命令：\n\n```\n~ python manage.py migrate author 0002\
  \ --fake\nOperations to perform:\n  Target specific migration: 0002_author_demo_field,\
  \ from author\nRunning migrations:\n  Applying author.0002_author_demo_field...\
  \ FAKED\n```\n\n这里，`0002` 迁移文件的更改被伪造了——也就是说，没有执行数据库模式更改，但我们仍然向 `django_migrations`\
  \ 表中添加了一条记录。\n\n现在，要撤消这些假数据库迁移更改，我们可以使用 `migrate` 命令：\n\n```\n~ python manage.py\
  \ migrate author 0001 --fake\nOperations to perform:\n  Target specific migration:\
  \ 0001_initial, from author\nRunning migrations:\n  Rendering model states... DONE\n\
    Unapplying author.0002_author_demo_field... FAKED\n```\n\n请记住，如果我们在回滚时不使用 `fake`\
  \ 标志，那么我们将遇到错误，因为我们尝试回滚的数据库迁移从未真正应用到数据库表中。\n\n### 重要说明\n\n在生产环境中使用假迁移更改时请务必小心。只有当数据库模式与现有\
  \ Django 模型定义相同时，才应用假迁移。\n\n### 避免为数据迁移创建自定义迁移\n\nDjango 提供了创建自定义迁移文件的方法，有时开发人员会想创建自定义迁移文件来执行数据迁移。然而，虽然这是一种很好的做法，但我始终会避免这样做。为什么呢？因为你将在生产环境中运行的数据迁移文件也会在其他开发人员的本地系统上运行，通常数据迁移文件需要数据文件；这会造成问题，因为该迁移文件与生产环境兼容，但与本地和暂存应用不兼容。\n\
  \n### 在重复迁移上创建系统检查\n\n你应该创建系统检查，以防止开发人员合并具有相同迁移文件编号的重复迁移文件。每当 Django 遇到此类重复项时，它会给你提供选择。尽管它们是完美的解决方案，但如果你已配置\
  \ CI/CD，那么可能为时已晚，无法获得这些选项。\n\n### 添加新字段\n\n始终在向现有数据库表插入新列时添加默认值。优先添加空值，因为与一些随机值相比，使用空值的数据库迁移所需时间要少得多。\n\
  \n现在我们已经了解了 Django 迁移的工作原理，让我们学习在处理模型和 ORM 时应遵循的最佳实践。\n\n# 探索模型和 ORM 的最佳实践\n\nDjango\
  \ 的官方文档是对如何使用模型和 ORM 的非常详细的指南，它可以帮助你使用 ORM 编写复杂的查询。但当你创建实际应用时，这不仅仅是编写好的查询；还有很多细枝末节是你应该知道的，或者在自己犯错后才了解的。在本节中，我们将学习所有那些小技巧，它们可以帮助我们更好地使用\
  \ Django 模型和 ORM。\n\n## 使用基础模型\n\n抽象基础模型是 Django 中最受欢迎的模型继承方式之一。我们应该在发现模型属性重复时创建通用的基础模型。我发现的最有用的基础模型之一是\
  \ `TimeStampedBaseModel`，它具有 `created_at` 和 `updated_at` 字段。使用此基础模型创建任何模型将自动添加 `created\
  \ at` 和 `updated at` 时间戳字段；例如，每当有人创建 `DemoModel` 对象或更新它时，我们将拥有相应的时间戳。让我们看一下实现：\n\
  \n```\nfrom django.db import models\nclass TimeStampedBaseModel(models.Model):\n\
      created_at = models.DateTimeField(auto_now_add=True)\n    updated_at = models.DateTimeField(auto_now=True)\n\
      class Meta:\n        abstract = True\nclass DemoModel(TimeStampedBaseModel):\n\
      name = models.CharField(max_length=100)\n```\n\n我们应该创建一个通用的 Django 应用，其中将包含所有全局基础模型，例如\
  \ `TimeStampedBaseModel`；这将使我们能够在整个项目的不同 Django 应用中使用 `TimeStampedBaseModel`。\n\n\
  ## 对任何 DateTime 相关数据使用 timezone.now()\n\n每当你处理任何 `DateTime` 相关数据时，始终使用 `django.utils.timezone.now()`\
  \ 函数。常规的 Python `datetime.now()` 函数不感知时区，因此它不会在时间戳数据库字段中保存时区信息。然而，`timezone.now()`\
  \ 为我们提供了时区信息，这将有助于我们在数据库中保存时区。\n\n### 重要说明\n\nDjango 设置中有 `TIME_ZONE` 变量，用于定义时区；默认情况下，每个\
  \ Django 项目都设置为 UTC，因此你需要将设置配置为相应的时区。你可以在这里了解更多：[`docs.djangoproject.com/en/stable/topics/i18n/timezones/`](https://docs.djangoproject.com/en/stable/topics/i18n/timezones/)。\n\
  \n## 如何避免模型中的循环依赖\n\n`Circular dependency` 是开发人员的噩梦。在成熟的代码库中出现循环依赖很常见，当它发生在模型之间时，就变得难以解决。这发生在我们有两个应用之间存在相互依赖的外键引用时。\n\
  \n例如，查看 *Figure 2.8* 中显示的示例。我们有两个应用模型相互依赖，创建了循环依赖错误：\n\n![Figure 2.8: When two apps\
  \ have circular dependency due to model reference](img/B18867_02_08.jpg) \n\nFigure\
  \ 2.8: When two apps have circular dependency due to model reference\n\nDjango 为我们提供了一种方法来避免此循环依赖错误，即通过基于字符串的外键引用。例如，在\
  \ *Figure 2.9* 中，`A1Model` 将在外键引用中使用 `app_b.B1Model`，我们无需导入 `app_b` 的模型；同样，`B2Model`\
  \ 将更新为使用 `app_a.A2Model` 作为字符串引用。在从 `models.py` 文件中删除导入后，就不会再有循环依赖错误，如下所示：\n\n![Figure\
  \ 2.9: Circular dependency resolved using a string-based reference](img/B18867_02_09.jpg)\
  \ \n\nFigure 2.9: Circular dependency resolved using a string-based reference\n\n\
  我们在 `ForeignKey` 字段中添加的模型字符串引用会在 Django 内部自动创建为 `ForeignKey` 引用。\n\n## 为所有模型定义 __str__\n\
  \n在开发阶段，经常需要在 Django shell 上工作，因此使用人类可读的字符串而不是随机 ID 来识别模型对象非常重要。作为示例，对于 author 对象，例如\
  \ `<Author: Author object (1)>`，如果我们在 author 模型定义中未定义 `__str__`，我们将得到 *Figure 2.10*\
  \ 中显示的输出：\n\n![Figure 2.10: The Author object string’s output when we don’t have\
  \ the __str__ method defined](img/B18867_02_10.jpg) \n\nFigure 2.10: The Author\
  \ object string’s output when we don’t have the `__str__` method defined\n\n现在，让我们为\
  \ `Author` 模型定义 `__str__` 方法：\n\n```\nclass Author(models.Model):\n    name = models.CharField(max_length=100)\n\
      email = models.EmailField()\n    bio = models.TextField()\n    def __str__(self):\n\
          return f'{self.name}-{self.id}'\n```\n\n使用此模型，如果我们创建一个新对象，我们将得到 `Author:\
  \ <name>-<id>` 作为输出，如 *Figure 2.11* 所示，这更易于阅读和操作：\n\n![Figure 2.11: The Author object\
  \ string’s output when we have the __str__ method defined](img/B18867_02_11.jpg)\
  \ \n\n\n\n\n\nFigure 2.11: The Author object string’s output when we have the `__str__`\
  \ method defined\n\n## Use custom model methods\n\nCreate custom model methods whenever\
  \ possible to keep your data interface clean. For example, if we have to get the\
  \ full name of an author, we should use model methods to avoid repetitive business\
  \ logic in the application layer, like so:\n\n```\nclass Author(models.Model):\n\
  \    first_name = models.CharField(max_length=100)\n    last_name = models.CharField(max_length=100)\n\
  \    email = models.EmailField()\n    bio = models.TextField()\n    def get_author_name(self):\n\
  \        return f'{self.first_name} {self.last_name}'\n    def get_short_bio(self):\n\
  \        return f'{self.bio[:200]}...'\n```\n\nHere, the `get_short_bio` and `get_author_name`\
  \ model methods help us retrieve information by just calling the object with the\
  \ method. For example, `<authorObj>.get_author_name()` would return the full name\
  \ of the author we have filtered.\n\n### Important note\n\nYou shouldn’t add too\
  \ much logic inside the model method as adding all the business logic to the model\
  \ can cause it to explode and your code will start to smell. An ideal approach would\
  \ be to keep a balance and try to identify the limit whenever your model starts\
  \ to become difficult to test.\n\nNote that model methods only work for single objects,\
  \ not on QuerySet objects; when you find yourself writing similar filter or ORM\
  \ queries again and again, you should start considering writing a custom model manager.\n\
  \nWe won’t dive into the details of how to implement model managers since the official\
  \ documentation already goes into this in detail. You can read more about it here:\
  \ [`docs.djangoproject.com/en/stable/topics/db/managers/`](https://docs.djangoproject.com/en/stable/topics/db/managers/).\n\
  \n## Keep the default primary key\n\nBy default, Django gives your auto-increment\
  \ `Integer` field, which is an `id` field, to all the models you define. For most\
  \ regular use cases, this ID should be kept as your primary key since it gives you\
  \ a couple of added advantages, such as filtering entities based on the primary\
  \ key range, sorting queries based on creation (since the primary key is always\
  \ auto-incremented), and easy human readability of the primary key.\n\nYou should\
  \ have a strong reason to use an ID field other than the regular `Integer` auto-incremented\
  \ `id` field. Most applications use UUID or some other unique identifier to replace\
  \ the existing one. Here are some of the reasons you might want to consider UUID:\n\
  \n* The total number of rows is going to outgrow the `Integer` range\n* You don’t\
  \ want users to guess the next or previous entries using ID\n\n### Important note\n\
  \nIn many data-sensitive applications, it is recommended to use both auto ID and\
  \ UUID, where the default ID can be used internally and UUID can be exposed to the\
  \ end user.\n\n## Use transactions\n\nBy default, Django ORM can commit the data\
  \ to the database whenever `create()`, `save()`, or `update()` methods are called.\
  \ When a business use case needs you to update/create multiple rows in a single\
  \ request, this might become a data corruption problem if transactions are not used.\n\
  \nFor example, when a user registers, we have to create a `User` table entry and\
  \ a `Profile` table entry. However, for some reason, the `User` table entry was\
  \ created but the backend crashed before the `Profile` table entry was created.\
  \ Since our application will need both `User` and `Profile` table entries, the user\
  \ is unable to access our application.\n\nTo avoid such scenarios, it is always\
  \ advisable to wrap queries inside transactions so that whenever there is any issue\
  \ during the whole process, the whole transaction is rolled back:\n\n```\nfrom django.db\
  \ import transaction\ndef viewfunc(request):\n    # This code executes in autocommit\
  \ mode (Django's default).\n    # do_db_stuff()\n    with transaction.atomic():\n\
  \        # This code executes inside a transaction.\n        pass\n        # do_more_db_stuff()\n\
  \        # do_one_more_db_stuff()\n```\n\nIn this example, the `do_db_stuff()` function\
  \ will perform the default auto-commit on any query written inside the function,\
  \ while the other two functions will only perform commits after both of them are\
  \ successful.\n\nRead nore\n\nDjango provides a wrapper over the database transaction\
  \ concept. A few important topics any Django developer should know about regarding\
  \ Django transactions are the `atomic` transaction decorator, `Savepoints` to manage\
  \ better commit and rollback control, and database-dependent transaction logic –\
  \ that is, PostgreSQL and MySQL have different transaction locks. You can read more\
  \ in Django’s official documentation: [`docs.djangoproject.com/en/stable/topics/db/transactions/`](https://docs.djangoproject.com/en/stable/topics/db/transactions/).\n\
  \n## Avoid generic foreign keys\n\nIn Django, `GenericForeignKey` is a concept where\
  \ one model is allowed to have a relationship with any other model in the whole\
  \ project. Though this is one of the unique features of Django ORM and we have seen\
  \ this as an interview question in a lot of companies, we should avoid using it\
  \ in production. Since no constraint is added to the table, it can cause data integrity\
  \ issues and as the data’s size increases, it causes queries to become slower and\
  \ slower. `GenericForeignKey` gives us a faster implementation advantage but in\
  \ the long run, this becomes a bottleneck.\n\n### Read more\n\nThe official documentation\
  \ doesn’t mention all the pitfalls and advantages in detail. Luke Plant, one of\
  \ the core contributors of Django, narrowed down all the pros and cons of `GenericForeignKey`\
  \ in this blog: [`lukeplant.me.uk/blog/posts/avoid-django-genericforeignkey/`](https://lukeplant.me.uk/blog/posts/avoid-django-genericforeignkey/).\n\
  \n## Use finite state machines (FSMs)\n\nMost applications will need us to maintain\
  \ some state for the data. For example, a blogging application would have multiple\
  \ stages, such as *submitted* > *reviewed* > *published*. The stages should be captured\
  \ using a database field, `state`. When a new blog is created, the `state` field\
  \ will have *submitted* as the `state` value. After the blog is thoroughly checked\
  \ and edited, the state field will have *reviewed* as its value. Finally, when published,\
  \ the `state` field will have *published* as its value. To programmatically implement\
  \ this logic in our application, we would have to implement multiple validations\
  \ and state management.\n\nWe can write our own custom logic and validation to handle\
  \ multiple corner cases, but why should we reinvent the wheel? There is a great\
  \ package that gives us an interface to just worry about the business logic while\
  \ it takes care of the underlying infrastructure. I would recommend using Django\
  \ FSM for any state management-related use case.\n\n### Read more\n\n`django-fsm`\
  \ is a Django package that helps with simple declarative state management for Django\
  \ models. Django FSM uses decorators to create a cleaner interface and introduces\
  \ a new `FSMField`, which is a specialized character field for implementing application\
  \ state management better. You can learn more about Django FSM here: [`github.com/viewflow/django-fsm`](https://github.com/viewflow/django-fsm).\n\
  \n## Break the model into packages\n\nIt is recommended to not have a lot of models\
  \ inside a single app. However, there can be legacy reasons why new apps were not\
  \ created and a single model file is 10,000+ lines of code long with 10+ different\
  \ models. Though there is no such hard limit on how many lines of code a single\
  \ file can have, it becomes a nightmare for a developer to work on such humongous\
  \ files. Luckily, Django provides a way to break `models.py` into smaller files\
  \ and have `models` as a package.\n\nTo do so, just create a folder called `models`\
  \ with an `__init__.py` file, then add all the models you want to add to the package:\n\
  \n\n\n\n\n```\n### blog_app/models/__init__.py\nfrom .comment import Comment\nfrom\
  \ .post import Post\n#### blog_app/models/comment.py\nclass Comment(models.Model):\n\
      # comment fields\n#### blog_app/models/post.py\nclass Post(models.Model):\n\
      # post fields\n```\n\n这种实现让我们可以像使用默认的单个 `models.py` 文件一样使用 `models`。\n\n重要提示\n\
  \n我们没有使用 `from .post import *` 以避免导入不必要的导入。\n\n你可以在此处阅读有关 Django 如何支持将模型组织到包中的更多信息：[`docs.djangoproject.com/en/stable/topics/db/models/#organizing-models-in-a-package`](https://docs.djangoproject.com/en/stable/topics/db/models/#organizing-models-in-a-package)。\n\
  \n现在我们已经学习了很多最佳实践，可以帮助我们像专业人士一样使用 Django ORM 和模型，让我们学习如何使用 Django 在数据层执行优化。\n\n\
  # 学习性能优化\n\n在当今的现代网络世界中，任何在 0.1 到 1 秒之间的 API 响应都被认为是一个良好的整体响应时间。在整个请求-响应周期中，数据库通常会成为瓶颈，我们会看到响应变慢，主要是由于糟糕的查询或糟糕的数据库设计决策所致。\n\
  \n因此，在本节中，我们将学习如何在 Django ORM 和数据库层检查性能优化。在之前的章节中，我们学习了如何使用模型并使用不同的规范化技术设计数据库模式，但在这里，我们的主要目标是学习如何高效地使用\
  \ Django ORM 以获得性能优化。\n\n我们应该首先理解的第一种技术，以深入了解应用程序性能，就是使用数据库查询的 `explain` 功能。\n\n\
  ## 使用 explain 和 analyze 解开性能之谜\n\n当我们在当今世界开发应用程序时，很多人可能会对我们使用 RDBMS 皱眉，因为大多数初级天真的开发者认为\
  \ SQL 本身就很慢。SQL 性能取决于我们用来访问数据的查询以及数据库模式是否设计为处理数据访问模式。SQL 为我们提供了一个强大的内置工具，称为 `explain`，帮助我们了解它在幕后将如何执行数据库查询。\n\
  \n让我们考虑你从当前位置前往给定目的地的例子。你首先要做的事情是打开 Google 地图并查找路线，它会告诉你如何旅行以及你需要旅行多远才能到达目的地。\n\n\
  将 `explain` 视为查询的 Google 地图。`Explain` 会告诉你查询将如何被执行，以及它将遵循哪些不同步骤来给出查询结果。Django ORM\
  \ 层在 `explain` SQL 接口之上提供了一个包装器，你可以在 Django 本身中使用它来获取 explain-analyze 计划：\n\n```\n\
  >>> print(Blog.objects.filter(title='My Blog').explain())\n    Seq Scan on blog  (cost=0.00..35.50\
  \ rows=10 width=12)\n      Filter: (title = 'My Blog'::bpchar)\n```\n\nDjango 为\
  \ PostgreSQL 提供了对 `explain` 接口的额外支持，通过传递 `verbose` 和 `analyze` 标志 —— 即 `explain(verbose=True,analyze=True)`。通过将这些标志传递为\
  \ `true`，我们可以获得 Django ORM 运行的 SQL 语句的详细 SQL 执行计划分析，这相当于 `explain plan`。\n\n重要提示\n\
  \n关于如何阅读 `explain analyze` 的 `explain` 和 `analyze` 结果的讨论超出了本书的范围，因为它需要大量额外的上下文。你可以在各自的数据库文档中了解它们：[`www.postgresql.org/docs/current/sql-explain.html`](https://www.postgresql.org/docs/current/sql-explain.html)。\n\
  \n现在我们已经了解了各种数据访问模式以及如何找到瓶颈，让我们考虑第一个解决方案，它可以解决大多数性能问题：为列添加 `index`。\n\n## 使用索引\n\
  \n`index` 是最广泛使用的性能优化解决方案之一。让我们尝试理解什么是索引。想象一下，你正在试图在一个公寓楼中找到 A 先生的家。该建筑可能有一个公寓编号结构，其中第\
  \ 14 层的第 2 个公寓可能被称为 1402。同样，2609 意味着你必须去 26 层并找到该层上的第 9 个公寓。如果你有公寓号，找到 A 先生就会很容易。但如果你只知道\
  \ A 先生的名字而不知道他的公寓号，你就必须敲遍建筑物里的每一扇门，直到找到他为止。\n\n现在，让我们以数据库的角度来考虑这个问题：这里，建筑物是表，公寓是每一行，公寓号是\
  \ `index`。如果有人尝试使用 `index` 查找特定行，那么他们会比尝试使用未索引的字段查找给定行获得更快的响应。在幕后，大多数数据库使用 `B-tree`\
  \ 作为存储索引的数据结构，这使我们能够以 O(logN) 时间复杂度访问任何给定行。\n\n现在我们了解了使用 `index` 的优势，让我们使用 Django\
  \ 模型向表添加 `index`。在 Django 中，我们必须使用 `Meta` 类来为列定义 `index`。例如，如果我们发现 `Author` 表在名字上有很多\
  \ ORM 过滤器，那么我们应该为 `first_name` 列添加 `index`，这有助于我们利用 `index` 获得更快的响应。以下模型定义帮助我们为\
  \ `Author` 模型的 `first_name` 列添加 `index`：\n\n```\nclass Author(models.Model):\n    first_name\
  \ = models.CharField(max_length=100)\n    last_name = models.CharField(max_length=100)\n\
      email = models.EmailField()\n    bio = models.TextField()\n    class Meta:\n\
          indexes = [\n            models.Index(fields=['first_name']),\n        ]\n\
  ```\n\n关于索引有几点重要事项：\n\n*   默认情况下，如果我们为任何模型使用默认的 `id` 字段，则它已经是索引的\n\n*   任何主键字段、外键字段和一对一字段默认都是索引的\n\
  \n*   使用 `index` 有助于我们更快地检索数据，但它会减慢向给定表写入数据的速度\n\n*   聚簇 `index` 应该在分析数据访问模式后使用\n\
  \n索引可以解决我们大多数性能问题，并且对于具有大量读取量的大表来说，应该始终用作第一个优化。如果使用正确，Django ORM 也可以帮助我们获得显著的性能提升。在下一节中，我们将学习如何像专业人士一样使用\
  \ Django ORM。\n\n## 像专业人士一样使用 Django ORM\n\nDjango 的官方文档提供了详细的列表，说明你如何使用 Django\
  \ ORM 执行任何类型的数据库相关查询。由于可用的 ORM 功能列表庞大，有时可能会让人不知所措，因此在本节中，我们将只学习少量可以执行的 Django ORM\
  \ 优化。\n\n重要提示\n\n本节的想法是为你提供一个 TL;DR 版本，说明你可以使用 Django ORM 执行的操作，并将你引导至官方文档，在那里你可以详细了解它。\n\
  \n### Exists 与 count\n\n检查数据库中是否存在给定条目是很常见的。开发人员通常选择的第一个查询是过滤查询，之后他们会检查 QuerySet\
  \ 的长度或使用 `count()` 查询。在处理小型数据集时，使用过滤器或 `count()` 查询是可以的；然而，在处理大型表时，`count` 语句可能会带来性能损失。为了获得更好的性能，当你想找出数据库中是否存在特定条目时，始终建议使用\
  \ `exists()` 查询。\n\n### 利用 QuerySets 的延迟加载\n\n\n\n\n\nQuerySets 默认是延迟加载的，因此在编写代码时应充分利用这一特性。我们可以连续添加过滤查询，Django\
  \ 在我们对其进行求值之前不会执行它们。在下面的示例中，我们在调用 `print` 语句时只用一次查询命中数据库：\n\n```\nsome_query = Book.objects.filter(author_id=1)\n\
  another_query = some_query.filter(name__startswith='a')\nyet_another_query = another_query.filter(name__endswith='s')\n\
  print(yet_another_query)\n```\n\n当我们运行 `print` 语句时，全部三个 Django ORM 过滤语句会同时被执行；在\
  \ `print` 语句之前不会触发任何数据库查询，我们只会在执行最后的 `print` 语句时才命中数据库。在处理应用程序逻辑时，我们应记住延迟加载 QuerySets，不要不必要地求值任何查询。\n\
  \n### Important note\n\n虽然延迟加载 QuerySet 有助于我们在应用程序逻辑涉及多个表时节省额外的数据库调用，但重要的是要确保我们没有让\
  \ Django 在非索引字段上创建连接。例如，如果我们从某个函数返回一个 QuerySet 并在另一个 QuerySet 中使用该结果，它会自动在两个查询之间创建连接并导致性能下降。但如果我们对结果中的\
  \ QuerySet 进行求值后再使用它，那么我们的响应会快得多。这完全取决于应用程序和使用场景，因此开发人员在编写使用 Django ORM 的查询时应牢记这一点。\n\
  \n### Using select_related and prefetch_related\n\n在创建不同的业务逻辑时，我们会遇到需要从不同表访问数据的实现。在\
  \ SQL 中，我们可以通过执行连接来从多个表中检索数据；同样，Django 也提供了 `select_related`，它在底层使用连接查询来获取来自多个表的数据。\n\
  \n让我们创建一个数据库调试装饰器来检索一些查询统计信息。`database_debug` 装饰器拦截由单个函数执行的全部查询，获取命中数据库的查询总数，并以可读格式格式化全部\
  \ SQL 查询：\n\n```\nfrom django.db import connection\nfrom django.db import reset_queries\n\
  def database_debug(func):\n    def inner_func(*args, **kwargs):\n        reset_queries()\n\
  \        results = func(*args, **kwargs)\n        query_info = connection.queries\n\
  \        print(f'function_name: {func.__name__}')\n        print(f'query_count:\
  \ {len(query_info)}')\n        queries = [f'{ query[\"sql\"]}\\n' for query in query_info]\n\
  \        print(f'queries: \\n{\"\".join(queries)}')\n        return results\n  \
  \  return inner_func\n```\n\n为了了解在使用 `select_related` 时和不使用它时的性能影响，让我们查看一下 `Author`\
  \ 和 `Blog` 的简单模型：\n\n```\nfrom django.db import models\nclass Author(models.Model):\n\
  \    name = models.CharField(max_length=100)\n    email = models.EmailField()\n\
  \    bio = models.TextField()\nclass Blog(models.Model):\n    title = models.CharField(max_length=200)\n\
  \    content = models.TextField()\n    author = models.ForeignKey(Author, on_delete=models.PROTECT)\n\
  ```\n\n现在，我们将为一组博客获取作者的全部名字：\n\n```\n@database_debug\ndef regular_query():\n   \
  \ blogs = models.Blog.objects.all()\n    return [blog.author.name for blog in blogs]\n\
  ## OUTPUT\nfunction_name: regular_query\nquery_count: 4\nqueries:\nSELECT \"blog_blog\"\
  .\"id\", \"blog_blog\".\"title\", \"blog_blog\".\"content\", \"blog_blog\".\"author_id\"\
  , \"blog_blog\".\"created_at\", \"blog_blog\".\"updated_at\" FROM \"blog_blog\"\n\
  SELECT \"author_author\".\"id\", \"author_author\".\"name\", \"author_author\".\"\
  email\", \"author_author\".\"bio\" FROM \"author_author\" WHERE \"author_author\"\
  .\"id\" = 1 LIMIT 21\nSELECT \"author_author\".\"id\", \"author_author\".\"name\"\
  , \"author_author\".\"email\", \"author_author\".\"bio\" FROM \"author_author\"\
  \ WHERE \"author_author\".\"id\" = 2 LIMIT 21\nSELECT \"author_author\".\"id\",\
  \ \"author_author\".\"name\", \"author_author\".\"email\", \"author_author\".\"\
  bio\" FROM \"author_author\" WHERE \"author_author\".\"id\" = 2 LIMIT 21\n```\n\n\
  我们表中有总共三个博客，每当我们尝试为任何博客获取作者的名字时，Django 都会进行额外的查询。考虑到这个示例，Django 进行一次查询来获取全部博客，然后进行剩余的三个查询来获取作者的名字，总共为四次查询。这清楚地表明这种查询在生产环境中是多么低效。\n\
  \n因此，让我们看看如何通过使用 Django 的 `select_related` 功能来改进：\n\n```\n@database_debug\ndef select_related_query():\n\
  \    blogs = models.Blog.objects.select_related('author').all()\n    return [blog.author.name\
  \ for blog in blogs]\n## Result\nfunction_name: select_related_query\nquery_count:\
  \ 1\nqueries:\nSELECT \"blog_blog\".\"id\", \"blog_blog\".\"title\", \"blog_blog\"\
  .\"content\", \"blog_blog\".\"author_id\", \"blog_blog\".\"created_at\", \"blog_blog\"\
  .\"updated_at\", \"author_author\".\"id\", \"author_author\".\"name\", \"author_author\"\
  .\"email\", \"author_author\".\"bio\" FROM \"blog_blog\" INNER JOIN \"author_author\"\
  \ ON (\"blog_blog\".\"author_id\" = \"author_author\".\"id\")\n```\n\n在这个示例中，我们可以看到，使用一次查询（与之前的四次查询相比）就可以实现相同的功能。根据查询，我们可以看到\
  \ Django 使用 `INNER JOIN` SQL 查询在一次查询中获取作者模型数据。\n\nDjango 提供了另一种通过 `prefetch_related`\
  \ 语法预填充数据的方法：\n\n```\n@database_debug\ndef prefetch_related_query():\n    blogs\
  \ = models.Blog.objects.prefetch_related('author').all()\n    return [blog.author.name\
  \ for blog in blogs]\n## Result\nfunction_name: prefetch_related_query\nquery_count:\
  \ 2\nqueries:\nSELECT \"blog_blog\".\"id\", \"blog_blog\".\"title\", \"blog_blog\"\
  .\"content\", \"blog_blog\".\"author_id\", \"blog_blog\".\"created_at\", \"blog_blog\"\
  .\"updated_at\" FROM \"blog_blog\"\nSELECT \"author_author\".\"id\", \"author_author\"\
  .\"name\", \"author_author\".\"email\", \"author_author\".\"bio\" FROM \"author_author\"\
  \ WHERE \"author_author\".\"id\" IN (1, 2)\n```\n\n在前述 `prefetch_related` 的代码中，Django\
  \ 在 Python 内部执行连接操作，而在 `select_related` 中，Django 执行 SQL 连接操作。\n\n在这里，我们进行了两次查询：第一个查询获取有关博客的信息，而第二个查询检索所选博客中存在的全部作者的作者信息，我们是从第一个查询中获取的。一旦我们有这两个\
  \ SQL 查询检索信息，Django 就会在 Python 内部执行连接操作。\n\n现在我们对 `select_related` 和 `prefetch_related`\
  \ 的工作原理有了基本了解，让我们学习一下关于它们的一些重要要点：\n\n* `select_related` 使用单个查询获取全部信息，并且仅适用于 `OneToOneField`\
  \ 和 `ForeignKey` 字段。\n* `prefetch_related` 使用两个查询获取全部所需信息，并且最适用于 `ManyToManyField`\
  \ 操作和反向 `ForeignKey` 查找。\n* `select_related` 使用 SQL 连接操作，而 `prefetch_related` 使用\
  \ Python 中的连接操作。\n* `prefetch_related` 也可以自定义以从另一个字段获取数据。`prefetch()` 对象用于控制 `prefetch_related`\
  \ 的操作。\n\n### Important note\n\n我们不会详细介绍 `prefetch`，因为官方文档提供了对其的详细解释以及其用例：`https://docs.djangoproject.com/en/stable/ref/models/querysets/#prefetch-objects`。\n\
  \n### Avoiding bulk_create and bulk_update\n\n\n\n\n\n在为给定表创建/更新多个条目时，你可能会想使用 `bulk_create()`\
  \ 或 `bulk_update()` 方法来优化性能。这些方法在你有一个基础应用时使用是很好的，但随着项目的增长，你会发现项目中增加了更多复杂性。模型的 `save()`\
  \ 方法不会被调用，因此 `pre_save` 和 `post_save` 信号不会被触发。这可能会导致应用程序中出现意外的行为。\n\nRead more\n\
  \n要了解有关 `bulk_create` 的更多信息，请访问 [`docs.djangoproject.com/en/stable/ref/models/querysets/#bulk-create`](https://docs.djangoproject.com/en/stable/ref/models/querysets/#bulk-create)。\n\
  \n### 使用 get_or_create 和 update_or_create\n\n`get_or_create` 和 `update_or_create`\
  \ 帮助我们创建一个幂等的 API 接口，可以在无需我们创建重复条目的情况下处理并发请求。例如，如果客户端尝试使用相同的名称创建新条目，那么我们的代码不会创建重复条目，而只有一个条目。请注意，唯一约束应该在数据库层中维护，而不是留在应用程序逻辑中。\n\
  \nRead more\n\n要了解有关 `bulk_update` 的更多信息，请访问 [`docs.djangoproject.com/en/stable/ref/models/querysets/#get-or-create`](https://docs.djangoproject.com/en/stable/ref/models/querysets/#get-or-create)。\n\
  \n## 数据库连接配置\n\n在生产环境中使用适当的数据库连接配置对于稳定且可扩展的 Web 应用程序非常重要。在本节中，我们将介绍一些你在生产环境中应使用的配置，以获得更好的性能。\n\
  \n### 使用 CONN_MAX_AGE\n\n每个 Django 服务器进程将使用单独的 TCP 连接连接到数据库。默认情况下，Django 在每次请求时创建一个新连接，并在响应返回后关闭它。如果你的应用程序有持续的流量，这种默认行为可能会导致性能下降。Django\
  \ 为我们提供了一种配置设置的方式，以在数据库和应用程序服务器之间保持一致的 TCP 连接。这可以通过向 `CONN_MAX_AGE` 添加合适的值来配置。默认情况下，它设置为\
  \ `0`，这意味着它将在每次请求时创建一个新连接。通过将其设置为正整数值，连接将保持持久指定的秒数。要使连接永久保持持久，请将值设置为 `None`。在修改这些设置之前，我们需要考虑的一个重要因素是数据库必须支持这么多连接；否则，我们将收到\
  \ `FATAL: too many connections` 的错误。\n\nRead more\n\n要了解有关为持久连接配置 Django 的更多信息，请访问\
  \ [`docs.djangoproject.com/en/stable/ref/databases/#persistent-connections`](https://docs.djangoproject.com/en/stable/ref/databases/#persistent-connections)。\n\
  \n### 使用 connect_timeout\n\n可能会出现开发人员编写了一个执行时间很长的糟糕 ORM 查询的情况。在此期间，我们的 Django 进程将被阻塞。因此，我们应该配置数据库，使其对从\
  \ Django 服务器发出的 SQL 查询设置超时，以便我们的整个应用程序不会因为一个请求命中了糟糕的查询而看到更高的延迟。\n\n在 PostgreSQL\
  \ 中，可以使用以下代码进行此配置（你需要为其他数据库更新代码中突出显示的部分）：\n\n```\nfrom django.db.backends.signals\
  \ import connection_created\nfrom django.dispatch import receiver\n@receiver(connection_created)\n\
  def setup_query_timeout(connection, **kwargs):\n    # Set Timeout for every statement\
  \ as 60 seconds.\n    with connection.cursor() as cursor:\n        cursor.execute(\"\
  set statement_timeout to 60000;\")\n```\n\n在前面的代码中，每当建立连接时，Django 将向此片段发送信号，然后它将触发一个查询，将超时设置为\
  \ 60 秒，用于 Django 服务器发送到数据库的每个查询。\n\nDjango 3.1 通过在请求-响应周期中原生支持异步行为，为 Django 视图引入了异步行为。然而，当我们需要处理\
  \ ORM 时，它仍然有丑陋的语法，如下所示：\n\n```\nfrom asgiref.sync import sync_to_async\ndef _get_blog(pk):\n\
      return Blog.objects.select_related('author').get(pk=pk)\nget_blog = sync_to_async(_get_blog,\
  \ thread_sensitive=True)\n```\n\n由于额外的包装器，并不是很多开发人员适应这种语法，但最终，在 Django 4.1 中，我们对\
  \ Django ORM 具有原生异步行为的支持。让我们学习如何利用 Django 异步 ORM。\n\n# 探索 Django 异步 ORM\n\nDjango\
  \ 异步 ORM 在 Django 4.1 中引入，以帮助开发人员利用 Python 中异步行为的原生支持。当我们在 Django 中使用异步视图或代码时，我们不能使用原生的同步\
  \ ORM。使用同步 Django ORM 意味着我们正在从异步代码中调用阻塞的同步代码，这将阻塞事件循环。Django 有一种方法可以阻止这种情况，我们将在此类操作期间看到\
  \ Django 抛出 `SynchronousOnlyOperation` 错误。\n\nRead more\n\n如果你不熟悉 Python 中的 async-await\
  \ 支持，请查看官方文档以了解 Python 如何原生支持 async-await：[`docs.python.org/3/library/asyncio-task.html`](https://docs.python.org/3/library/asyncio-task.html)。\n\
  \n我们应该将 Django 异步 ORM 与 Django 异步视图/代码一起使用。异步查询 API 将给出与原始同步 Django ORM 查询 API 相同的响应。唯一的区别是我们编写查询语法的不同。\n\
  \n例如，假设我们必须使用 `get` 查询找到一篇博客。让我们看看使用同步代码时我们的代码是什么样的：\n\n```\ndef get_blog(request):\n\
    blog_details = Blog.objects.get(id=10)\n  return JsonResponse({'title': blog_details.title})\n\
  ```\n\n现在，如果我们想使用异步代码使用相同的 `get` 操作，语法会发生变化。我们必须添加 `async-await` 关键字，并在 Django 同步接口前添加\
  \ `a`：\n\n```\nasync def get_blog(request):\n  blog_details = await Blog.objects.aget(id=10)\n\
    return JsonResponse({'title': blog_details.title})\n```\n\nDjango 的异步功能仍在积极开发中，我们希望看到更多异步支持可用于该框架。并且通过这一点，我们已经了解了\
  \ Django 异步 ORM 的语法更改有多简单。\n\nImportant note\n\n除非你有非常具体的需要要求使用异步 ORM，否则建议避免在生产环境中使用\
  \ Django 异步 ORM，主要是因为官方文档也在开发中，没有太多示例可用。有关更多详细信息，请查看官方文档：[`docs.djangoproject.com/en/stable/topics/db/queries/#asynchronous-queries`](https://docs.djangoproject.com/en/stable/topics/db/queries/#asynchronous-queries)。\n\
  \n在撰写本书时，Django 5 事务不通过异步 ORM 支持。然而，到你阅读本节时，这可能会发生变化。请访问 [`docs.djangoproject.com/en/stable/topics/db/queries/#transactions`](https://docs.djangoproject.com/en/stable/topics/db/queries/#transactions)\
  \ 以查看最新状态。\n\n现在我们已经了解了如何在 Django 项目中使用 Django 异步 ORM，这就把我们带到了 *第 2 章* 的结尾。\n\n\
  # Summary\n\n\n\n\n\n在本章中，我们学习了大量关于如何使用模型和数据库的概念。首先，我们学习了如何使用 ElephantSQL 配置 Django\
  \ 项目，这使我们能够在本地系统上使用 PostgreSQL，而无需设置 PostgreSQL 服务器的麻烦。然后，我们学习了 ORM 的基本概念，以及如何在\
  \ Django 模型中使用规范化，以及模型的继承概念。\n\n迁移是任何应用程序的关键部分，我们看到了 Django 如何简化数据库模式迁移的痛苦。我们学习了在常规开发周期中使用\
  \ Django 迁移的技巧，以及在处理它时应遵循的最佳实践。Django ORM 是框架应如何处理数据库交互的先驱之一。之后，我们在查看开发人员可以用来构建可扩展应用程序的几个性能优化技巧之前，介绍了可以遵循的\
  \ Django ORM 最佳实践。\n\nDjango 4.1 引入了 ORM 中备受期待的 Async 支持，这有助于开发人员开始构建异步应用程序。总的来说，在本章中，我们学习了所有与\
  \ Django 相关的概念，而与 DRF 无关。因此，在下一章中，我们将学习如何将 Django 模型与 DRF 序列化器连接起来。\n\n# 3\n"
- "# 使用 DRF 序列化数据\n\n在 *第 2 章* 中，我们学习了如何使用 Django 工作数据库和模型。我们学到的所有概念都与 Django 相关，以及开发人员如何充分利用\
  \ Django 框架与数据库交互。在本章中，我们将再向前迈进一步，了解 DRF 如何与 Django ORM 和模型集成，以帮助我们创建将被客户端应用程序消费的\
  \ API。\n\n我们将详细学习序列化和反序列化的概念，以及客户端如何使用 JSON 数据类型与服务器应用程序交互。验证每个输入并从多个表中获取数据对开发人员来说很常见，因此\
  \ DRF 借助序列化器帮助实现此类用例的更精简接口。DRF 提供了可以开箱即用地与 Django 模型一起使用的序列化器，可以进行自定义。最后，我们将学习如何在使用\
  \ *APIViews* 和 *Generic Views* 中使用序列化器，我们在第一章中学习过。\n\n本章将涵盖以下主题：\n\n* 理解 DRF 序列化器的基础知识\n\
  * 使用模型序列化器\n* 实现序列化器关系\n* 使用序列化器验证数据\n* 精通 DRF 序列化器\n* 使用序列化器与 DRF 视图\n\n# 技术要求\n\
  \n在本章中，我们将深入学习 DRF 序列化器以及开发人员如何在应用程序代码中充分利用序列化器。要跟上本章涵盖的概念，您应该清楚地了解 Django 模型和 ORM。我们将讨论相关字段和视图，因此您应该理解本书的前两章。虽然我们将涵盖序列化器的所有概念，但了解如何创建\
  \ DRF 序列化器会有所帮助。\n\n以下是本章所有代码和说明的 GitHub 仓库：[`github.com/PacktPublishing/Django-in-Production/tree/main/Chapter03`](https://github.com/PacktPublishing/Django-in-Production/tree/main/Chapter03)。\n\
  \n# 理解 DRF 序列化器的基础知识\n\n在上一章中，我们学习了如何使用 Django 模型和 ORM 使用数据库。然而，在 Web 应用程序的世界中，客户端和服务器之间的交互是通过\
  \ REST API 使用 JSON 请求-响应格式进行的。让我们看看客户端-服务器 API 交互的样子。\n\n客户端应用程序使用 JSON 数据格式通过 ReST\
  \ API 将信息发送到服务器。运行在 DRF 上的 Django 服务器默认使用 `JSONParser` 将数据从 JSON 格式解析为 Python 原生格式。然后，Python\
  \ 原生格式中的数据将被传递给序列化器，使用 Django ORM 将数据保存到数据库中。同样，当使用 Django ORM 从数据库检索数据时，它将通过序列化器传递以将数据反序列化为\
  \ Python 原生格式。Python 原生格式数据将通过 `JSONRenderer` 传递以将数据渲染为 JSON 格式，最终将响应发送给客户端。\n\n\
  *图 3**.1* 描述了我们讨论的数据流，为 DRF 和 Django 为客户端-服务器交互执行的底层数据转换提供了清晰的理解。\n\n![Figure 3.1:\
  \ The data workflow of the DRF JSONParser, Serializer, and JSONRenderer](img/B18867_03_01.jpg)\n\
  \n图 3.1：DRF JSONParser、Serializer 和 JSONRenderer 的数据工作流\n\n## 配置自定义解析器和渲染器\n\n通常，大多数现代客户端应用程序使用\
  \ JSON 内容类型与服务器交互。如果您发现客户端发送的数据未被 DRF 视图解析，那么您应该调查客户端发送的 `Content-Type` 标头。DRF 为您提供添加不同解析器的灵活性，并且解析器是使用定义的\
  \ `Content-Type` 标头选择的。同样，DRF 为您提供配置渲染器的灵活性。您可以通过分别在 `APIView` 类中定义 `parser_classes`\
  \ 和 `renderer_classes` 属性来配置解析器和渲染器。\n\nDRF 序列化器帮助我们将复杂数据类型（如 QuerySets 和模型实例）转换为原生\
  \ Python 数据类型，这些类型可以很容易地使用渲染器转换以向客户端返回响应。DRF 序列化器还提供反序列化接口，帮助我们将 Python 原生数据类型转换为复杂数据类型，并提供数据验证支持。\n\
  \n在本章中，我们将不讨论通用序列化器类；然而，由于大多数应用程序开发人员使用 `ModelSerializer` 类来实现业务逻辑，我们将接下来讨论它。\n\n\
  # 使用模型序列化器\n\n序列化器的最常见用例是从 Django 模型保存或检索数据。DRF 提供了 `ModelSerializer`，它帮助我们将 DRF\
  \ 序列化器集成到 Django 模型中，可以序列化和反序列化其中存在的字段。`ModelSerializers` 在可序列化字段和模型定义中存在的数据库字段之间映射。\n\
  \n让我们使用几个基本的 `ModelSerializer` 示例来理解概念。我们将使用在 *第 2 章* 中构建的相同的 `Blog` Django 模型并创建\
  \ `BlogSerializer` 来序列化数据。我们可以在任何地方定义序列化器，但为了具有可维护的代码，建议为每个应用有一个单独的 `serializers.py`\
  \ 文件，其中包含所有序列化器定义：\n\n```\n# blog/models.py\nclass Blog(BaseTimeStampModel):\n \
  \   title = models.CharField(max_length=200)\n    content = models.TextField()\n\
  \    author = models.ForeignKey(Author, related_name='author_blogs', on_delete=models.PROTECT)\n\
  # blog/serializers.py\nclass BlogSerializer(serializers.ModelSerializer):\n    class\
  \ Meta:\n        model = Blog\n        fields = '__all__'\n```\n\n现在，让我们打开 Django\
  \ shell 来探索 `BlogSerializer`。首先，我们将找到所有自动链接到我们序列化器的序列化器字段。在以下代码片段中，我们可以看到 `Blog`\
  \ 模型中存在的所有字段都已添加到我们的序列化器中：\n\n```\n>>> from blog import serializers\n>>> print(serializers.BlogSerializer())\n\
  BlogSerializer():\n    id = IntegerField(label='ID', read_only=True)\n    title\
  \ = CharField(max_length=100, validators=[<UniqueValidator(queryset=Blog.objects.all())>])\n\
  \    content = CharField(style={'base_template': 'textarea.html'})\n    created_at\
  \ = DateTimeField(read_only=True)\n    updated_at = DateTimeField(read_only=True)\n\
  \    author = PrimaryKeyRelatedField(queryset=Author.objects.all())\n```\n\n\n\n\
  \n\n序列化器用于从 Django 模型中创建、更新和检索信息。让我们检查一下如何使用 `BlogSerializer` 执行这三种操作的基础知识。\n\n\
  ## 创建新的模型对象\n\n模型序列化器通过 REST API 改善了在 Django 模型中创建新条目的整体体验。由于 `ModelSerializer`\
  \ 将 Django 模型中定义字段链接到序列化器，因此输入数据的验证会自动由 DRF 序列化器处理。\n\n例如，在以下代码片段中，我们可以看到如何将输入数据传递给序列化器。序列化器关联的验证器会通过\
  \ `<serialize instance>.is_valid()` 调用以验证输入值，返回 `True`/`False`。要将数据保存到数据库，我们需要调用\
  \ `<serialize instance>.save()` 方法（我们应该始终记住仅在调用 `is_valid()` 方法后才调用 `save()` 方法）。验证错误可以从\
  \ `<serialize instance>.errors` 属性中检索。\n\n让我们现在查看一个使用 DRF 序列化器保存新博客对象的示例。请注意，`author`\
  \ 值为 `1` 是我们想要链接到模型的 `Author` 对象的外键：\n\n```\n>>> from blog import serializers\n\
  >>> input_data = {\n...    'title': 'new blog title',\n...    'content': 'this is\
  \ content',\n...    'author': 1\n... }\n>>> new_blog = serializers.BlogSerializer(data=input_data)\n\
  >>> new_blog.is_valid()\nTrue\n>>> new_blog.save()\n<Blog: Blog object (11)>\n```\n\
  \nDRF 还为我们提供了修改默认 `create` 行为的机制。通过重写 `ModelSerializer` 的 `create` 方法，我们可以在调用 `save()`\
  \ 方法时实现自定义行为。例如，让我们在任何新对象创建调用中添加一个 `print` 语句：\n\n```\nclass BlogCustomSerializer(serializers.ModelSerializer):\n\
      def create(self, validated_data):\n        print('*** Custom Create method ****')\n\
          return super(BlogCustomSerializer, self).create(validated_data)\n    class\
  \ Meta:\n        model = Blog\n        fields = '__all__'\n```\n\n如果我们想要创建多个对象，我们可以传递新对象的列表以及一个额外的标志\
  \ `many`，该标志告诉序列化器将要创建多个对象。以下代码片段显示了创建多个对象的实现：\n\n```\n>>> from blog import serializers\n\
  >>> input_data = {\n...    'title': 'new blog title',\n...    'content': 'this is\
  \ content',\n...    'author': 1\n... }\n>>> new_blog = serializers.BlogSerializer(data=[input_data,\
  \ input_data], many=True)\n>>> new_blog.is_valid()\nTrue\n>>> new_blog.save()\n\
  *** Custom Create method ****\n*** Custom Create method ****\n[<Blog: Blog object\
  \ (12)>, <Blog: Blog object (13)>]\n```\n\n一旦我们创建了新条目，我们可能想要修改现有值；DRF 提供了使用序列化器更新现有数据库条目的干净接口。\n\
  \n## 更新现有模型对象\n\n要使用序列化器更新模型实例，我们必须将要更新的现有博客对象作为 `instance` 属性传递，如果我们只想更新特定字段，则还需要传递\
  \ `partial` 标志。以下代码片段显示了如何仅更新现有模型实例的标题的示例：\n\n```\n>>> from blog import serializers\n\
  >>> update_input_data = {\n...    'title': 'new blog title',\n... }\n>>> existing_blog\
  \ = models.Blog.objects.get(id=10)\n>>> new_blog = serializers.BlogSerializer(instance=existing_blog,\
  \ data=update_input_data, partial=True)\n>>> new_blog.is_valid()\nTrue\n>>> new_blog.save()\n\
  <Blog: Blog object (10)>\n```\n\n然后我们可以重写 `update` 方法以向序列化器使用的任何更新操作添加自定义逻辑：\n\n\
  ```\nclass BlogCustom2Serializer(serializers.ModelSerializer):\n    def update(self,\
  \ instance, validated_data):\n        print('*** Custom Update method ****')\n        return\
  \ super(BlogCustom2Serializer, self).update(instance, validated_data)\n    class\
  \ Meta:\n        model = Blog\n        fields = '__all__'\n```\n\n前面代码片段中突出显示的部分显示了我们如何重写现有的更新方法并添加了\
  \ `print` 语句。\n\n现在，让我们探索如何使用模型序列化器序列化从数据库检索的 QuerySet 信息。\n\n## 从模型对象实例检索数据\n\n\
  当我们将模型对象实例传递给模型序列化器时，它会根据字段定义将数据序列化为字典格式。在以下代码片段中，我们将单个数据库对象传递给模型序列化器类以序列化值。`blog_obj.data`\
  \ 具有来自 `Blog` 对象实例的序列化信息：\n\n```\n>>> from blog import serializers\n>>> from blog\
  \ import models\n>>> from pprint import pprint\n>>> tenth_blog = models.Blog.objects.get(id=10)\n\
  >>> blog_obj = serializers.BlogSerializer(instance=tenth_blog)\n>>> pprint(blog_obj.data)\n\
  {'author': 1,\n 'content': 'this is content',\n 'created_at': '2023-10-01T10:12:09.192181Z',\n\
  \ 'id': 10,\n 'title': 'updated_blog title',\n 'updated_at': '2023-10-02T08:21:01.422111Z'}\n\
  ```\n\n同样，当我们将 QuerySet 传递给序列化器时，我们可以序列化所有模型对象。我们需要在实例化序列化器时传递 `many` 标志，以便它识别我们正在尝试序列化多个模型对象：\n\
  \n```\n>>> from pprint import pprint\n>>> from blog import models, serializers\n\
  >>> multiple_blogs = models.Blog.objects.all()\n>>> blog_objs = serializers.BlogSerializer(instance=multiple_blogs,\
  \ many=True)\n>>> pprint(blog_objs.data)\n```\n\n现在我们已经了解了如何使用序列化器创建、更新和检索数据，让我们探索如何使用\
  \ `Meta` 类配置模型序列化器。\n\n## 探索 Meta 类\n\nDRF 序列化器遵循 Django 模型的概念来定义元数据。任何与序列化器字段定义无关的内容都应定义在内部\
  \ `Meta` 类中。\n\n让我们学习几个需要在 `ModelSerializer` 的内部 `Meta` 类上声明的重要属性：\n\n* `model`:\
  \ `ModelSerializer` 需要映射到一个 Django 模型；为此，我们使用 `model` 属性将相应的 Django 模型映射到序列化器：\n\
  \n```\nclass BlogSerializer(serializers.ModelSerializer):\n    class Meta:\n        model\
  \ = Blog\n        fields = '__all__'\n```\n\n在示例中，我们有一个 Django 模型 `Blog`，它使用 model\
  \ 属性链接到 `BlogSerializer`。\n\n* `fields`: 当我们将 Django 模型声明为 `ModelSerializer` 时，我们还必须定义序列化器要使用的相应字段。`fields`\
  \ 属性接受我们希望序列化器包含的字段名称列表作为输入。它还接受一个特殊值 `'__all__'`，这将表示应使用链接模型中的所有字段。例如，如果我们使用以下片段，`BlogSerializer`\
  \ 将具有在 `Blog` 模型中定义的所有字段：\n\n```\nclass BlogSerializer(serializers.ModelSerializer):\n\
      class Meta:\n        model = Blog\n        fields = '__all__'\n```\n\n现在，如果我们使用模型字段名称列表声明字段，我们将只能在序列化器输出中看到这些值。例如，在以下片段中，我们将只有三个定义的字段：\n\
  \n```\nclass BlogSerializer(serializers.ModelSerializer):\n    class Meta:\n        model\
  \ = Blog\n        fields = ['id', 'title', 'created_at']\n```\n\n\n\n\n\n进入`/path/to/xxx`目录，找到`xxx.json`。\n\
  \n## `exclude`\n\n在某些情况下，我们可能希望将模型的所有字段添加到序列化器中，除了少数几个字段；这时 `exclude` 属性非常有用。当我们定义\
  \ `exclude` 属性时，除了列表中定义的字段外，所有字段都会被序列化器忽略。例如，在下面的代码片段中，`Blog` 模型中存在的所有字段都会出现，除了在\
  \ `exclude` 属性中定义的 `updated_at`：\n\n```\nclass BlogSerializer(serializers.ModelSerializer):\n\
  \    class Meta:\n        model = Blog\n        exclude = ['updated_at']\n```\n\n\
  我们应该始终记住，对于 `ModelSerializer`，必须提供 `fields` 或 `exclude`。此外，`exclude` 属性仅映射到 Django\
  \ 模型类中定义的模型字段。\n\n## `read_only_fields`\n\n单个 `ModelSerializer` 可用于从数据库保存和检索数据。因此，我们会有这样的用例：我们希望某些字段仅在检索数据时序列化，而不在写入操作期间序列化。在此示例中，`updated_at`\
  \ 字段仅在我们从数据库检索数据时被序列化：\n\n```\nclass BlogSerializer(serializers.ModelSerializer):\n\
  \    class Meta:\n        model = Blog\n        fields = '__all__'\n        read_only_fields\
  \ = ['updated_at']\n```\n\n还有另一种定义只读字段的方法——即在定义字段时定义。序列化器字段定义在声明字段定义时接受一个参数 `read_only`。默认情况下，任何\
  \ `AutoField` 都设置为只读行为。\n\n## `extra_kwargs`\n\n此属性是 DRF `ModelSerializer` 提供的一个最令人困惑但功能强大的功能之一。由于\
  \ DRF 的文档中没有任何细节，因此很难理解如何使用 `extra_kwargs`，但我们将检查一些可使用 `extra_kwargs` 字典配置的基本选项：\n\
  \n* `write_only`：我们可以定义字段是否应为仅写入的布尔类型值\n* `min_length`：字段的最小长度，适用于字符串字段\n* `max_length`：给定字段的最大长度，适用于字符串字段\n\
  * `Required`：用于标记字段是否必需的布尔值\n* `Validators`：用于为给定字段设置自定义验证器\n\n除了刚刚提到的之外，还有其他属性，例如\
  \ `default` 和 `source`，我们可以根据用例进行配置。让我们看一个如何在模型序列化器中使用 `extra_kwargs` 的基本示例：\n\n\
  ```\nclass BlogSerializer(serializers.ModelSerializer):\n    class Meta:\n     \
  \   model = Blog\n        fields = '__all__'\n        extra_kwargs = {\n       \
  \     'updated_at': {'write_only': True},\n            'title': {'min_length': 100,\
  \ 'required': True},\n        }\n```\n\n每个父键将是字段名，属性应为键的值——例如，`'updated_at': {'write_only':\
  \ True}` 表示 `updated_at` 字段为仅写入。\n\n**Important note**\n\n如果字段在序列化器类中明确定义，则 `extra_kwargs`\
  \ 选项中定义的属性将被始终忽略。\n\n## `Depth`\n\nDjango 模型具有外键关系字段和其他相关字段链接。默认情况下，DRF 不会检索除外键之外的任何相关字段值。当我们定义\
  \ `depth` 属性时，它会自动遍历关系以检索所有信息，并最终以 JSON 结构表示。以下代码片段将检索所有外键关系值并返回第一级信息：\n\n```\n\
  class BlogSerializer(serializers.ModelSerializer):\n    class Meta:\n        model\
  \ = Blog\n        fields = '__all__'\n        depth = 1\n```\n\n`depth` 是一个整数值，用于确定序列化器应检索的关系深度，默认情况下\
  \ `depth` 设置为 `0`。\n\n现在我们已经了解了如何配置 Model Serializers，让我们学习序列化器的另一个重要方面——关系。\n\n\
  # Implementing Serializer relations\n\nDjango 模型有三种类型的关系字段——`ForeignKey`、`ManyToManyField`\
  \ 和 `OneToOneField`（它们都支持反向关系）。到目前为止，我们已经了解了如何有效地使用模型序列化器，但现在让我们探索如何在序列化器中处理相关字段。\n\
  \n默认情况下，当模型具有任何相关字段时，`ModelSerializer` 会将关联字段链接到序列化器定义中的 `PrimaryKeyRelatedField`。DRF\
  \ 序列化器将为所有类型的相关字段序列化器使用 `PrimaryKeyRelatedField`，并传递不同的选项。\n\n在这里，我们将学习如何创建相关字段序列化器：\n\
  \n* 对于 `ForeignKey`，DRF 模型序列化器将 `PrimaryKeyRelatedField` 分配给序列化器\n* 对于 `OneToOneField`，DRF\
  \ 模型序列化器将 `PrimaryKeyRelatedField` 分配给序列化器，并附加一个 `UniqueValidator`\n* 对于 `ManyToManyField`，DRF\
  \ 模型序列化器将 `PrimaryKeyRelatedField` 分配给序列化器，并带有两个附加标志 `many=True` 和 `allow_empty=True`\n\
  \n默认情况下，`PrimaryKeyRelatedField` 是读写字段，除非我们特别提及 `read_only=True` 标志。以下是我们如何为相应的相关模型字段使用\
  \ `PrimaryKeyRelatedField` 的示例：\n\n```\n# blog/models.py\nclass Blog(models.Model):\n\
  \    author = models.ForeignKey(\n        Author, on_delete=models.PROTECT\n   \
  \ )\n    cover_image = models.OneToOneField(\n        CoverImage, on_delete=models.PROTECT\n\
  \    )\n    tags = models.ManyToManyField(Tags)\n# blog/serializers.py\nclass BlogCustom3Serializer(serializers.ModelSerializer):\n\
  \    author = serializers.PrimaryKeyRelatedField(\n        queryset=Author.objects.all()\n\
  \    )\n    tags = serializers.PrimaryKeyRelatedField(\n        queryset=Tags.objects.all(),\
  \ many=True, allow_empty=True\n    )\n    cover_image = serializers.PrimaryKeyRelatedField(\n\
  \        queryset=CoverImage.objects.all(),      validators=[validators.UniqueValidator(CoverImage.objects.all())]\n\
  \    )\n    class Meta:\n        model = Blog\n        fields = '__all__'\n```\n\
  \n在此示例中，我们手动定义了 DRF 在幕后自动创建的所有不同类型的相关字段序列化器。\n\n`PrimaryKeyRelatedField` 中的 `QuerySet`\
  \ 参数是什么？\n\n`queryset` 参数用于在我们尝试创建新条目时验证字段输入。对于只读操作，`queryset` 不使用；因此，当我们创建具有只读相关字段的序列化器时，可以忽略它。对于任何写入操作，必须提供\
  \ `queryset` 参数，因为它将使用提供的查询集执行验证。\n\nDRF 提供了创建嵌套序列化器的灵活性，这在我们想要获取嵌套对象数据时很有帮助。我们可以使用\
  \ `depth` 配置来获取默认字段，但如果我们需要来自嵌套对象的自定义字段，则嵌套序列化器非常方便。\n\n## Working with nested Serializers\n\
  \n我们应该在想要从嵌套对象中获取选定字段时使用嵌套序列化器。例如，让我们为所有博客获取作者姓名和作者简介。`BASerializer` 仅公开作者姓名和简介，因此最终序列化的数据将仅为每个博客的作者姓名和简介。然后，`source`\
  \ 属性用于告诉序列化器它应该使用哪个数据库模型字段来传递相关对象信息：\n\n\n\n\n\n```\nclass BASerializer(serializers.ModelSerializer):\n\
      class Meta:\n        model = Author\n        fields = ['name', 'bio']\nclass\
  \ BlogCustom4Serializer(serializers.ModelSerializer):\n    author_details = BASerializer(source='author')\n\
      class Meta:\n        model = Blog\n        fields = '__all__'\n```\n\n我们也可以通过添加\
  \ `many=True` 标志，使用嵌套序列化器传递 `ManyToManyFields` 或反向关系。默认情况下，嵌套序列化器始终为只读。要将其用于写操作，我们必须更新\
  \ `create` 和/或 `update` 方法。\n\n在处理关联字段时，我们可能需要从关联表的多个层级获取字段值，并且可能不想使用过多的嵌套序列化器。DRF\
  \ 提供了两种不同的选项，使用 `source` 或 `SerializerMethodField` 来解决此用例。让我们看看如何使用 `source` 参数。\n\
  \n## 探索 source\n\n在内部，DRF 可以扫描嵌套对象并检索相关字段。`source` 属性可以被视为将特定序列化器字段和数据库字段映射的一种方式。我们可以使用\
  \ `source` 属性执行多个操作来实现以下功能：\n\n* 在不更改数据库模型的情况下，为 API 重命名给定字段\n* 添加一个序列化器只读字段，该字段在幕后访问模型方法\n\
  * 在不编写自定义代码的情况下访问对象的多个层级\n\n让我们通过示例来探索这些操作，以便更好地理解。在下面的示例中，`AuthorSerializer` 使用\
  \ `source` 属性实现了三个自定义字段：\n\n```\n# author/models.py\nclass Author(models.Model):\n\
      bio = models.TextField()\n    def fetch_short_bio(self):\n         return self.bio[:100]\n\
  # author/serializers.py\nclass AuthorSerializer(serializers.ModelSerializer):\n\
      long_bio = serializers.CharField(source='bio')\n    short_bio = serializers.CharField(source='fetch_short_bio')\n\
      class Meta:\n        model = Author\n        fields = '__all__'\n        exclude\
  \ = ['bio', 'email']\n```\n\n这里，我们使用 `source` 属性将 `bio` 模型字段重命名为 `long_bio`。然后，在\
  \ `short_bio` 字段中，我们使用 `source` 属性从 `Author` 模型访问模型方法 `fetch_short_bio`。\n\n`source`\
  \ 属性足够强大，可以访问对应模型中存在的不同属性。如果我们想要执行数据操作，那么 DRF 提供了 `SerializerMethodField`，它可以访问模型对象实例以执行任何类型的操作。\n\
  \n## 探索 SerializerMethodField\n\n`SerializerMethodField` 是一个只读字段，可以在任何序列化器类中定义。它会自动将模型实例对象传递给方法。例如，如果我们想计算特定博客的总词数，我们可以使用\
  \ `SerializerMethodField`。在这种情况下，`word_count` 字段是一个方法序列化器字段，默认情况下 DRF 会查找 `get_<field\
  \ name>` 来获取对应的方法：\n\n```\nclass BlogCustom5Serializer(serializers.ModelSerializer):\n\
      word_count = serializers.SerializerMethodField()\n    def get_word_count(self,\
  \ obj):\n        return len(obj.content.split())\n    class Meta:\n        model\
  \ = models.Blog\n        fields = '__all__'\n```\n\n如果我们想使用自定义方法名，则可以将 `method_name`\
  \ 参数传递给定义。例如，我们可以将方法命名为 `use_custom_word_count` 并将其传递给 `method_name` 以进行关联：\n\n\
  ```\nclass BlogCustom6CustomSerializer(serializers.ModelSerializer):\n    word_count\
  \ = serializers.SerializerMethodField(\n        method_name='use_custom_word_count'\n\
      )\n    def use_custom_word_count(self, obj):\n        return len(obj.content.split())\n\
      class Meta:\n        model = models.Blog\n        fields = '__all__'\n```\n\n\
  我们可以在方法中执行任何类型的操作 - 例如，访问外键字段数据或进行额外查询。\n\n重要提示\n\n默认情况下，反向外键关系不会添加到序列化器中，但我们可以使用\
  \ `source` 关键字手动添加它们。此外，在读操作中使用关联字段序列化器时要非常小心。因为默认情况下没有使用 `select_related` 或 `prefetch_related`\
  \ 查询，开发人员可能会遇到 `N+1 query problem`，导致性能下降。我们将在本章后半部分 *Avoiding the N+1 query Problem*\
  \ 中讨论如何克服这个问题。\n\n现在我们已经了解了如何使用关联字段序列化器，我们将看到 DRF 序列化器如何为验证器提供接口并使用 DRF 序列化器实现不同类型的验证。\n\
  \n# 使用序列化器验证数据\n\nDRF 序列化器最受欢迎的功能之一是它开箱即用的数据验证框架。默认情况下，每当模型被定义为模型序列化器时，它会自动选择字段类型和数据库字段验证器，并将其应用于序列化器。当我们将原始数据传递给序列化器并调用\
  \ `is_valid()` 方法时，它会根据自动生成的验证器评估数据并给我们一个布尔值。\n\n现在，让我们研究一些深入的概念以及 DRF 序列化器中验证器的实现。\n\
  \n## 自定义字段级验证\n\nDRF 序列化器字段可以具有链接到特定字段的自定义验证逻辑。通过在序列化器类中定义 `validate_<field name>`\
  \ 方法，DRF 会在调用 `is_valid()` 方法时自动执行验证器。例如，如果我们不希望标题中包含下划线，可以使用以下代码片段：\n\n```\nclass\
  \ BlogCustom7Serializer(serializers.ModelSerializer):\n    def validate_title(self,\
  \ value):\n        print('validate_title method')\n        if '_' in value:\n            raise\
  \ serializers.ValidationError('illegal char')\n        return value\n    class Meta:\n\
          model = models.Blog\n        fields = '__all__'\n```\n\n这里，`validate_title`\
  \ 会在我们调用 `is_valid` 方法时由 DRF 序列化器自动执行。\n\n每当我们创建自定义验证器时，请记住在任何无效状态下使用 `raise ValidationError`。DRF\
  \ 特别查找 `ValidationError`。\n\n## 定义自定义字段级验证器\n\n某些字段会一再添加到不同的序列化器中；因此需要相同的验证逻辑。为了避免重复相同的逻辑，我们可以定义一个验证器函数并将其传递给\
  \ `validator` 属性，使用 `extra_kwargs` 或 `field` 属性。在下面的示例中，标题和内容字段具有相同的验证器，用于检查值中是否存在无效字符：\n\
  \n```\ndef demo_func_validator(attr):\n    print('func val')\n    if '_' in attr:\n\
          raise serializers.ValidationError('invalid char')\n    return attr\nclass\
  \ BlogCustom8Serializer(serializers.ModelSerializer):\n    class Meta:\n        model\
  \ = models.Blog\n        fields = '__all__'\n        extra_kwargs = {\n            'title':\
  \ {\n                'validators': [demo_func_validator]\n            },\n            'content':\
  \ {\n                'validators': [demo_func_validator]\n            }\n        }\n\
  ```\n\n就我个人而言，我更喜欢使用 `extra_kwargs` 来定义任何自定义字段级验证器，因为它更冗长且提高了可读性。\n\n## 执行对象级验证\n\
  \n我们已经学习了如何执行字段级验证；现在，让我们学习如何执行对象级验证。这种类型的验证在我们具有涉及多个字段的某些验证时特别有帮助：\n\n\n\n\n\n\
  ``` \nclass BlogCustom9Serializer(serializers.ModelSerializer):\n    def validate(self,\
  \ attrs):\n        if attrs['title'] == attrs['content']:\n            raise serializers.ValidationError('Title\
  \ and content cannot have value')\n        return attrs\n    class Meta:\n     \
  \   model = models.Blog\n        fields = '__all__'\n```\n\nDRF 仅在所有字段级验证成功执行后才会执行对象级验证。通过在序列化器中定义自定义逻辑的\
  \ `validate()` 方法，我们可以执行对象级验证。例如，让我们添加一个验证逻辑，以阻止用户为博客的标题和内容赋予相同的值：\n\n## 定义自定义对象级验证器\n\
  \n我们可以定义可以在多个序列化器中使用的自定义对象级验证器。为此，我们需要在 `Meta` 类中声明 `validators` 属性。在这里，我们将实现与前面示例中相同的逻辑——我们希望防止\
  \ `title` 和 `content` 字段具有相同的值。`Custom_obj_validator` 是一个自定义对象验证器，我们在其中实现逻辑：\n\n\
  ```\ndef custom_obj_validator(attrs):\n    print('custom object validator')\n  \
  \  if attrs['title'] == attrs['content']:\n        raise serializers.ValidationError('Title\
  \ and content cannot have the same')\n    return attrs\nclass BlogCustom10Serializer(serializers.ModelSerializer):\n\
  \    class Meta:\n        model = models.Blog\n        fields = '__all__'\n    \
  \    validators = [custom_obj_validator]\n```\n\n我们已经看到了在字段级和对象级实现验证器的多种方法，但了解评估顺序很重要，以便我们可以高效地实现验证器；我们将在接下来讨论这一点。\n\
  \n## 验证器的评估顺序\n\n让我们探索不同验证器的评估顺序，这将帮助我们决定在哪里添加自定义逻辑；为了清晰起见，我们使用了字段级和对象级验证器的示例：\n\
  \n```\ndef func_validator(attr): # 1- Evaluates first\n    print('func val')\n \
  \   if '*' in attr:\n        raise serializers.ValidationError('Illegal char')\n\
  \    return attr\nclass BlogCustom11Serializer(serializers.ModelSerializer):\n \
  \   def validate_title(self, value): # 2-If func_validator succeeds\n        print('validate_title\
  \ method')\n        if '_' in value:\n            raise serializers.ValidationError('Illegal\
  \ char')\n        return value\n    def validate(self, attrs): # 3- If all field\
  \ validator succeeds\n        print('main validate method')\n        return attrs\n\
  \    class Meta:\n        model = models.Blog\n        fields = '__all__'\n    \
  \    extra_kwargs = {\n            'title': {\n                'validators': [func_validator]\n\
  \            }\n        }\n```\n\n在 `extra_kwargs` 中定义的验证器将始终先执行，即 `func_validator`，然后是字段级\
  \ validate 方法，即 `validate_title`。如果所有字段验证器都成功，则对象验证器 `validate()` 方法将被执行。为了更好地理解，请尝试使用不同的输入值运行上述示例——例如，提供一个无效的标题值，然后在传递对象级无效值时添加正确的标题值。\n\
  \n## 从 DRF 序列化器类中移除默认验证器\n\nDRF 序列化器具有默认验证器，它们始终检查输入值。在某些时候，我们可能有这样的用例：我们希望禁用 DRF\
  \ 生成的所有默认字段验证器。如果我们将 `validator` 属性赋值为一个空字符串，则所有自动生成的验证器将被禁用。\n\n例如，在以下代码片段中，`BlogSerializer`\
  \ 的任何自动生成的字段级验证器都被禁用，但如果我们在 `validator` 方法中定义验证，则 `validator` 方法仍然适用并将被执行以进行验证：\n\
  \n```\nclass BlogCustom12Serializer(serializers.ModelSerializer):\n    class Meta:\n\
  \        model = models.Blog\n        fields = '__all__'\n        validators = []\n\
  ```\n\n在本节中，我们学习了使用 DRF 序列化器进行数据验证的不同方法。字段级和对象级验证器各有优缺点，开发人员应根据验证需求使用它们。让我们现在开始学习\
  \ DRF 序列化器的复杂性，以及如何掌握 DRF 序列化器的不同用例。\n\n# 精通 DRF 序列化器\n\n我们已经学习了 DRF 序列化器的所有重要概念，因此在本节中，我们将学习如何高效地使用\
  \ DRF 序列化器，以及一些新的概念，这些概念可以帮助我们进一步掌握它们。\n\n## 使用 source\n\n我们之前学习了如何使用 `source` 选项执行多种类型的操作，并且今后应尽可能在序列化器字段中使用此参数。这是因为它大大减少了为诸如重命名字段、创建扁平响应结构或访问相关字段数据等基本任务编写手动代码的需求。\n\
  \n## 拥抱 SerializerMethodField\n\n`SerializerMethodField` 为我们提供了在运行时执行数据操作的很大灵活性。我们应该在需要对单个对象的多个字段进行计算，或转换数据时使用方法序列化器。\n\
  \n## 使用 validators\n\n始终尝试添加 `validators`，以便我们无需使用自定义代码来执行数据验证。我们在本章中讨论了添加验证器的多种方法，包括字段级和对象级，我们应该尝试评估适当的验证器类型并相应地实现它们。\n\
  \n## 使用 to_internal_value\n\n`to_internal_value` 方法可以在验证运行之前访问原始输入字段。如果我们想对数据执行任何操作或对整个输入数据进行操作，可以使用此方法。让我们查看一个快速示例，说明如何使用它：\n\
  \n```\nclass BlogCustom13Serializer(serializers.ModelSerializer):\n    def to_internal_value(self,\
  \ data):\n        print('before validation', data)\n        return super().to_internal_value(data)\n\
  \    class Meta:\n        model = models.Blog\n        fields = '__all__'\n```\n\
  \n在这个示例中，我们在调用 `ModelSerializer` 原生提供的 `to_internal_value` 方法的原始实现之前简单地添加了一个打印语句。`data`\
  \ 变量包含原始输入值，可以根据需要进行操作。\n\n## 使用 to_representation\n\n`to_representation` 方法接收模型对象实例并将其转换为\
  \ Python 原始数据类型。我们可以重写此方法以在序列化器实例返回的序列化数据之前执行数据操作。例如，在 `BlogCustom14Serializer`\
  \ 中，我们可以将博客的 `title` 字段转换为大写文本：\n\n```\nclass BlogCustom14Serializer(serializers.ModelSerializer):\n\
  \    def to_representation(self, instance):\n        resp = super().to_representation(instance)\n\
  \        resp['title'] = resp['title'].upper()\n        return resp\n    class Meta:\n\
  \        model = models.Blog\n        fields = '__all__'\n```\n\n在这个示例中，我们将标题字段设为大写。同样，我们可以在返回响应之前对任何字段执行任何类型的操作。\n\
  \n## 使用 context 参数传递信息\n\n在高级用例中，我们可能需要将请求对象或任何其他附加信息传递给序列化器。DRF 序列化器为此目的提供了 `context`\
  \ 参数。在序列化器初始化期间通过 `context` 参数传递的任何键值对都可在所有序列化器方法中使用。当我们想将任何请求对象数据传递给序列化器以进行自定义计算时，此功能非常方便。\n\
  \n在前述示例中，我们在初始化 `BlogSerializer` 时向 `context` 参数传递一个简单的键值对：\n\n\n\n\n\n```\nclass\
  \ BlogCustom15Serializer(serializers.ModelSerializer):\n    def to_internal_value(self,\
  \ data):\n        print('Printing context –', self.context)\n        return super().to_internal_value(data)\n\
  \    class Meta:\n        model = models.Blog\n        fields = '__all__'\n>>> input_data\
  \ = BlogSerializer(\n    data={'title':'abc'}, context={'request': 'some value'}\n\
  )\n>>> input_data.is_valid()\n# Printing context – {'request': 'some value'}\n```\n\
  \n同样的键值对也可以通过 `to_internal_value` 方法中的 `context` 访问。`self.context` 是一个对象属性；我们可以在\
  \ Serializer 的任何其他方法中访问 `self.context` 值。\n\n## 自定义字段\n\nDRF 还提供了一个清晰的接口，通过子类化 `Field`\
  \ 类或继承现有字段来创建自定义字段。官方文档解释得相当好：\n\n[`www.django-rest-framework.org/api-guide/fields/#custom-fields`](https://www.django-rest-framework.org/api-guide/fields/#custom-fields)。\n\
  \n## 向 PrimaryKeyField 传递自定义 QuerySet\n\n在创建新的关联字段时，我们可能有这样一个用例：只允许为过去由请求用户创建的字段使用\
  \ `ForeignKey`。例如，当我们为新博客添加标签时，我们希望确保只能将作者创建的标签添加到博客中。这是一个非常常见的用例，开发者通常通过在 Serializer\
  \ 外部编写自定义代码来验证输入数据来解决。\n\n然而，相反，我们可以通过使用 `context` 和前面讨论的自定义字段概念来执行此操作。在下面的示例中，我们创建了一个新的\
  \ `CustomPKRelatedField`，它重写了默认的 `get_queryset` 行为：\n\n```\nclass CustomPKRelatedField(serializers.PrimaryKeyRelatedField):\n\
  \    def get_queryset(self):\n        req = self.context.get('request', None) #context\
  \ value\n        queryset = super().get_queryset() #retrieve default filter\n  \
  \      if not req:\n            return None\n        return queryset.filter(user=req.user)\
  \ #additional filter\nclass BlogCustom16Serializer(serializers.ModelSerializer):\n\
  \    tags = CustomPKRelatedField(queryset=models.Tags.objects.all())\n    class\
  \ Meta:\n        model = models.Blog\n        fields = '__all__'\n```\n\n现在，`CustomPKRelatedField`\
  \ 将自动过滤由请求用户创建的任何标签，并对具有超出过滤条目的标签的任何输入请求抛出错误。\n\n## 构建 DynamicFieldsSerializer\n\
  \n我们已经学习了如何创建不同的序列化器字段并使用序列化器概念操作数据；然而，在我们所有的示例中，字段始终是预定义的。也许存在这样的用例，我们希望动态添加序列化器字段；DRF\
  \ 通过覆盖 Serializer 类中字段定义的常规行为来支持这种类型的自定义。\n\n阅读更多\n\nDRF 还为我们提供了一种创建动态序列化器的方法，它将即时生成字段。官方文档提供了开发者如何更好地使用此功能的示例：[`www.django-rest-framework.org/api-guide/serializers/#dynamically-modifying-fields`](https://www.django-rest-framework.org/api-guide/serializers/#dynamically-modifying-fields)。\n\
  \n## 避免 N+1 查询问题\n\nN+1 查询问题是在 Serializer + ORM 执行 *N* 个额外的 SQL 语句来获取本可以在执行主 SQL\
  \ 查询时检索到的数据时出现的性能问题。N+1 查询问题是一个巨大的性能瓶颈，会减慢大量生产环境中的应用程序，并且在使用访问关联字段的列表序列化器时相当常见。\n\
  \n我们可以通过使用 `select_related` 和 `prefetch_related` 查询集来避免这个问题。建议逐案解决这个问题，并将适当的 Django\
  \ ORM QuerySet 传递给序列化器。\n\n现在我们已经掌握了序列化器及其提供的不同配置，我们将重点关注将 DRF 序列化器与 DRF 视图集成。\n\
  \n# 使用序列化器与 DRF 视图\n\n在实际应用开发中，DRF 序列化器与 DRF 视图紧密合作以与客户端应用程序交互。让我们通过博客 API 示例学习如何将\
  \ DRF 序列化器集成到 DRF 视图中。在以下示例代码中，我们将 `BlogSerializer` 集成到 `APIView` 中，以实现博客模型的读写操作：\n\
  \n```\nclass BlogGetCreateView(views.APIView):\n    def get(self, request):\n  \
  \      blogs_obj_list = Blog.objects.all()\n        blogs = BlogSerializer(blogs_obj_list,\
  \ many=True)\n        return Response(blogs.data)\n    def post(self, request):\n\
  \        input_data = request.data\n        b_obj = BlogSerializer(data=input_data)\n\
  \        if b_obj.is_valid():\n           b_obj.save()\n           return Response(b_obj.data,\
  \ status= HTTP_201_CREATED)\n        return Response(b_obj.errors, status= HTTP_400_BAD_REQUEST)\n\
  ```\n\n在前面的示例中，当有 `get` HTTP 请求时，我们列出所有博客，而在 `post` HTTP 请求中，我们创建新的博客条目。类似地，我们可以在\
  \ `APIView` 类中为其他 HTTP 方法实现业务逻辑。\n\n## 重要说明\n\n我们将直接专注于实现高级用例。对于基本集成，请查看 DRF 教程：[`www.django-rest-framework.org/tutorial/3-class-based-views/`](https://www.django-rest-framework.org/tutorial/3-class-based-views/)。\n\
  \n## 使用通用视图\n\n每当我们创建简单的 CRUD 操作 API 时，使用通用视图总是更有利的。让我们看看如何将序列化器集成到 `GenericAPIView`\
  \ 中。`GenericAPIView` 具有 `serializer_class` 配置，通过它我们可以链接关联的序列化器。\n\n对于任何写操作，DRF 会自动处理将输入字段传递给序列化器并在数据库上执行保存操作。正如我们之前所学，对于任何读取操作，我们需要为序列化器提供一个\
  \ QuerySet。在 `GenericAPIView` 中，我们可以使用 `queryset` 属性配置链接查询，或通过自定义 `get_queryset()`\
  \ 方法。然而，使用 `get_queryset` 方法将查询集传递给序列化器始终是首选。\n\n这里有一个示例——让我们创建一个 API 来创建新博客并列出所有\
  \ ID 大于 10 的博客：\n\n```\nclass BlogGetUpdateView(generics.ListCreateAPIView):\n \
  \   serializer_class = BlogSerializer\n    def get_queryset(self):\n        blogs_queryset\
  \ = Blog.objects.filter(id__gt=1)\n        return blogs_queryset\n```\n\n`BlogGetUpdateView`\
  \ 使用通用视图抽象出获取所有博客列表和创建新博客 API 的所有实现细节。我们使用 `get_queryset` 将 `queryset` 值传递给我们的 `BlogSerializer`\
  \ 序列化器。\n\n阅读更多\n\n在实现基本的 CRUD API 时，通用视图非常有帮助且实现更快。DRF 为自定义通用视图行为的创建提供了混入。官方文档提到了\
  \ DRF 开箱即用的所有可用混入：\n\n[`www.django-rest-framework.org/api-guide/generic-views/#mixins`](https://www.django-rest-framework.org/api-guide/generic-views/#mixins)。\n\
  \n## 使用 SearchFilter 和 OrderingFilter 进行过滤\n\n我们学习了如何使用 `get_queryset` 方法为序列化器自定义查询集；此方法接口提供了对我们想要通过序列化器传递的数据的低级控制。然而，如果我们有一些通用用例，例如按某些字段对数据进行排序或执行基本搜索操作，那么我们应该使用\
  \ `filter_backends` 属性。DRF 提供了两个基本的过滤后端，`SearchFilter` 和 `OrderingFilter`，来执行基本操作。例如，让我们在\
  \ `BlogGetUpdateView` 中使用 `OrderingFilter` 按博客标题对所有结果进行排序：\n\n\n\n\n\n```\nclass\
  \ BlogGetUpdateFilterView(generics.ListAPIView):\n    serializer_class = BlogSerializer\n\
  \    filter_backends = [filters.OrderingFilter]\n    ordering_fields = ['title']\n\
  ```\n\n同样，我们可以使用 `SearchFilter` 后端。官方文档提到了如何使用不同过滤器的基本示例，以及如何创建自定义过滤器后端。\n\nRead\
  \ more\n\nDRF 还支持创建自定义过滤器并扩展现有过滤器。官方文档提供了示例，并对开发者如何最好地使用此功能进行了适当的解释：\n\n[`www.django-rest-framework.org/api-guide/filtering/#api-guide`](https://www.django-rest-framework.org/api-guide/filtering/#api-guide)。\n\
  \n在本节中，我们学习了如何将 DRF 序列化器与 DRF 视图集成。我们还看到了 DRF 如何开箱即用地支持过滤器，以及我们如何使用它们来改进开发。\n\n\
  # Summary\n\n在本章中，我们学习了如何使用 DRF 序列化器。首先，我们探索了基本 DRF 序列化器的概念，以及 DRF 如何使用 Renderer\
  \ 和 Parser 将数据从 JSON 转换为 Python 原生数据类型（反之亦然）。然后，我们学习了如何使用 DRF `ModelSerializer`\
  \ 与 Django 模型。\n\nDRF 序列化器开箱即用地提供数据验证支持。在本章中，我们学习了使用序列化器集成字段级和对象级验证的不同方法。我们还学习了如何将\
  \ DRF 序列化器集成到与 Django 关联的字段中并使用嵌套序列化器。\n\n最后，我们学习了如何将 DRF 序列化器与 DRF 视图集成，以全面了解序列化器在整体应用程序开发中的工作方式。\n\
  \n在下一章中，我们将学习如何使用 Django 管理后台以及如何使用 Django 管理命令。\n"
- "# Exploring Django Admin and Management Commands\n\n在 *Chapter 3* 中，我们学习了如何将 DRF\
  \ 序列化器与视图集成，以及客户端应用程序如何与 Django 视图交互。我们的用户将使用客户端应用程序通过 REST API 执行 CRUD 操作。但在实际应用中，我们需要创建一些额外的接口，让管理员用户执行某些\
  \ CRUD 操作。Django 开箱即用地提供了一个管理界面来满足此用例。\n\n在本章中，我们将学习如何使用 Django Admin，它提供了很大的灵活性来配置管理界面，以支持不同的业务用例。我们将学习如何探索这些配置，以及如何使用管理命令更好地与框架交互（例如执行数据库迁移或启动开发服务器）。Django\
  \ 还提供了扩展这些命令的接口，以便我们可以为自定义用例创建自定义管理命令。我们也将对此进行探讨。\n\n本章将涵盖以下主题：\n\n*   Exploring\
  \ Django Admin\n*   Customizing Django Admin\n*   Optimizing Django Admin for production\n\
  *   Creating custom management commands\n\n## Technical requirements\n\n在本章中，我们将学习如何使用\
  \ Django Admin 面板。Django Admin 与 Django 模型紧密配合，因此您需要对 Django 模型有良好的理解。\n\n本章中使用的代码片段可以在本书的\
  \ GitHub 仓库中找到，地址为 [`github.com/PacktPublishing/Django-in-Production/tree/main/Chapter04`](https://github.com/PacktPublishing/Django-in-Production/tree/main/Chapter04)。\n\
  \n## Exploring Django Admin\n\n对于任何应用程序，我们都需要某种管理 UI 来执行管理任务。Django Admin 开箱即用地提供了这种强大的功能。但在查看界面之前，像其他任何管理界面一样，我们需要用户登录凭据来访问\
  \ Django Admin。\n\n### Creating a superuser in Django\n\nDjango 为我们提供了内置的 `createsuperuser`\
  \ 管理命令来创建新的管理员用户。一旦我们在终端中运行此命令，我们将看到一个引导向导，帮助我们创建 Django 超级用户：\n\n```\npython manage.py\
  \ createsuperuser\n```\n\n按照说明并输入提供的数据后，我们将获得一个 Django 超级用户。\n\nDjango authentication\
  \ and authorization\n\nDjango 开箱即用地提供身份验证和授权支持。当我们在 Django 中创建超级用户时，我们将使用默认的 Django\
  \ 身份验证系统。我们将在 *Chapter 5* 中讨论 Django 身份验证和授权的细节。\n\n一旦我们创建了超级用户，我们就可以运行 Django 服务器以登录管理界面。默认情况下，Django\
  \ Admin 在主 `urls.py` 文件中配置为 `/admin` 路由。现在，让我们学习如何配置 Django Admin 界面以及 Django 为我们与\
  \ Django Admin 协作提供的所有功能。\n\n### Understanding the Django Admin interface\n\n当我们在浏览器中访问\
  \ `http://127.0.0.1:8000/admin` 时，我们将被重定向到管理员登录页面。UI 界面由 Django 自动生成，开箱即用。一旦我们输入之前创建的超级用户管理员的凭据，我们将能够登录管理界面，如\
  \ *Figure 4**.1* 所示：\n\n![Figure 4.1: Default Django Admin interface](img/B18867_04_01.jpg)\n\
  \nFigure 4.1: Default Django Admin interface\n\n目前，我们还没有配置任何额外内容。所以，让我们向 Django\
  \ Admin 添加一个博客表界面。每个应用都有一个 `admin.py` 文件，帮助我们为给定应用设置 Django Admin。然后，Django Admin\
  \ 模块帮助我们创建可用于向数据库添加/编辑数据的用户界面。\n\n例如，一旦我们将以下代码添加到 `blog/admin.py`，它就会将 `BlogAdmin`\
  \ 类注册到 Django Admin UI。这里，我们在代码示例中将 `BlogAdmin` 链接到 `Blog` 模型：\n\n```\nfrom django.contrib\
  \ import admin\nfrom blog import models\nclass BlogAdmin(admin.ModelAdmin):\n  \
  \  pass\nadmin.site.register(models.Blog, BlogAdmin)\n```\n\n*Figure 4**.2* 显示了带有新\
  \ **BLOG** 部分的 Django Admin UI。随着我们添加新的管理员类并注册它们，它们将开始出现在 UI 中：\n\n![Figure 4.2:\
  \ The BLOG section in the Django Admin UI](img/B18867_04_02.jpg)\n\nFigure 4.2:\
  \ The BLOG section in the Django Admin UI\n\n现在，让我们使用更多配置来配置 Django Admin，以改善 Admin\
  \ 页面的用户体验。首先，让我们看看博客模型的列表页面在 Django Admin 中是什么样子的。*Figure 4**.3* 显示了博客模型的 Django\
  \ Admin 列表页面：\n\n![Figure 4.3: The Django Admin UI for the blog model](img/B18867_04_03.jpg)\n\
  \nFigure 4.3: The Django Admin UI for the blog model\n\n在 *Figure 4**.3* 中，我们突出了\
  \ Django Admin 中负责 UI 的不同类型的配置。在以下代码片段中，我们可以看到映射到相关管理员 UI 的属性。`BlogAdmin` 类中定义的\
  \ `search_fields`、`show_full_result_count` 和 `list_filter` 字段负责屏幕上显示的 UI 元素：\n\n\
  ```\nfrom django.contrib import admin\nfrom blog import models\nclass BlogCustomAdmin(admin.ModelAdmin):\n\
  \    search_fields = ['title']\n    show_full_result_count = True\n    list_filter\
  \ = ['title']\n    list_display = ['title', 'created_at']\n    date_hierarchy =\
  \ 'created_at'\nadmin.site.register(models.Blog, BlogCustomAdmin)\n```\n\n同样，我们可以通过为\
  \ `BlogAdmin` 类定义更多属性来配置 `blog` 管理页面的详细 UI。\n\nRead more\n\n官方 Django 文档展示了我们可以用来自定义\
  \ Django Admin 体验的所有开箱即用选项：[`docs.djangoproject.com/en/stable/ref/contrib/admin/`](https://docs.djangoproject.com/en/stable/ref/contrib/admin/)。\n\
  \n\n\n\n\n到目前为止，我们已经学习了如何在 Django Admin 中显示 Django 模型字段。在下一节中，我们将学习如何使用自定义字段和其他最佳实践来自定义\
  \ Django Admin。\n\n# 自定义 Django Admin\n\n在本节中，我们将学习如何自定义 Django Admin 以改善用户体验并解决时不时出现的各种基础但棘手的需求。\n\
  \n## 添加自定义字段\n\n在创建界面时，在 Django Admin 中添加自定义字段是最常见需求之一。通过这样做，我们可以在 Django Admin\
  \ 中添加 Django 模型中不存在的字段/信息。例如，要在 Django Admin 中创建 `word_count` 字段，我们可以使用以下代码：\n\n\
  ```\nclass BlogCustom2Admin(admin.ModelAdmin):\n    list_display = ('title', 'word_count',\
  \ 'id')\n    def word_count(self, obj):\n        return obj.content.split()\nadmin.site.register(models.Blog,\
  \ BlogCustom2Admin)\n```\n\n在这个示例中，我们向 `list_display` 添加了一个名为 `word_count` 的自定义字段，该字段是使用其他字段值计算得出的。\n\
  \n## 使用 filter_horizontal\n\nDjango Admin 使我们能够在 Django Admin 中使用 `ManyToManyField`。然而，Django\
  \ Admin 提供的 `ManyToManyField` 默认界面并不友好。\n\n如 *Figure 4*.4* 所示，当我们使用默认的 admin 界面时，很难识别所选字段：\n\
  \n![Figure 4.4: Default admin interface for ManyToManyField](img/B18867_04_04.jpg)\
  \ \n\nFigure 4.4: Default admin interface for ManyToManyField\n\n为了改善 admin 用户体验，我们可以将\
  \ `tags` 字段传递给 `BlogAdmin` 类中的 `filter_horizontal` 属性。这会将 `ManyToManyField` 的 admin\
  \ 界面转换为更好的界面：\n\n```\nclass BlogCustom3Admin(admin.ModelAdmin):\n    filter_horizontal\
  \ = ['tags']\nadmin.site.register(models.Blog, BlogCustom3Admin)\n```\n\n使用 `filter_horizontal`\
  \ 属性，我们可以获得更好的界面，如 *Figure 4*.5* 所示。我们可以识别已选择的字段和可供选择的字段：\n\n![Figure 4.5: The admin\
  \ interface when we use the filter_horizontal attribute](img/B18867_04_05.jpg) \n\
  \nFigure 4.5: The admin interface when we use the filter_horizontal attribute\n\n\
  你也可以使用 `filter_vertical` 来改善界面。\n\n## 使用 get_queryset\n\nDjango Admin 界面中显示的数据是通过\
  \ QuerySet 获取的。在 *Chapter 2* 和 *Chapter 3* 中，我们看到了如何通过使用适当的查询来获得性能提升。在使用 Django\
  \ Admin 时，我们会遇到在 *Chapter 3* 中讨论的相同的 N+1 select 查询问题。为了解决这个问题，我们可以使用 `select_related`\
  \ 或 `prefetch_related` 查询来覆盖默认的 Django Admin QuerySet。\n\n在下面的示例中，我们尝试通过访问 `author.user`\
  \ 表数据来获取用户的全名：\n\n```\nclass BlogCustom4Admin(admin.ModelAdmin):\n    list_display\
  \ = ['title', 'created_at', 'author_full_name']\n    def author_full_name(self,\
  \ obj):\n        return f'{obj.author.user.first_name} {obj.author.user.last_name}'\n\
  \    def get_queryset(self, request):\n        default_qs = super().get_queryset(request)\n\
  \        improved_qs = default_qs.select_related('author', 'author__user')\n   \
  \     return improved_qs\nadmin.site.register(models.Blog, BlogCustom4Admin)\n```\n\
  \n由于 `author_full_name` 字段已添加到 `list_display`，Django Admin 将为每一行执行两次查询。例如，如果我们有\
  \ 10 篇博客文章，它将执行 20 次 DB 查询来获取作者姓名信息。当我们有数百条记录时，这会带来性能损失，因此我们覆盖默认的 `get_queryset`\
  \ 方法，通过使用 `select_related` 查询来提高性能。\n\n同样，我们可以使用不同的查询来覆盖默认的 `get_queryset` 方法以获得性能提升。强烈建议在应用程序增长时监控\
  \ Django Admin 的数据访问模式；这些小的性能瓶颈很容易解决。\n\n## 使用第三方包和主题\n\n我们可以使用多个第三方包来增强 Django\
  \ Admin 界面。虽然是否应该使用第三方包是一个有争议的话题，但我通常更喜欢在 Django Admin 用于基本 CRUD 操作以进行管理目的时使用默认界面。\n\
  \n以下 GitHub 仓库列出了所有出色的 Django Admin 资源：[`github.com/originalankur/awesome-django-admin`](https://github.com/originalankur/awesome-django-admin)。\n\
  \n## 使用 Django Admin 日志\n\n在任何应用程序中，记录用户执行的管理员操作都非常重要。Django 非常重视安全，并开箱即用地提供了管理员操作日志界面。\n\
  \n默认情况下，Django 仅在 admin 主页上显示最近记录的更改，如 *Figure 4*.6* 所示：\n\n![Figure 4.6: Showing\
  \ the Django Admin action logs](img/B18867_04_06.jpg) \n\nFigure 4.6: Showing the\
  \ Django Admin action logs\n\n一旦我们添加以下代码片段以启用 `LogEntryAdmin`，我们将允许用户执行任何只读操作并阻止任何写操作：\n\
  \n```\nfrom django.contrib.admin.models import LogEntry\n@admin.register(LogEntry)\n\
  class LogEntryAdmin(admin.ModelAdmin):\n    def has_change_permission(self, request,\
  \ obj=None):\n        return False\n    def has_delete_permission(self, request,\
  \ obj=None):\n        return False\n    def has_add_permission(self, request):\n\
  \        return False\n```\n\n我们应该确保 `LogEntryAdmin` 的访问受到限制并且是只读的。请注意，我们已覆盖 `has_<action>_permission`\
  \ 方法，以便用户只能读取操作而不能操作任何过去的操作。在内部，Django 将所有这些日志信息存储在 `django_admin_log` 表中。\n\n现在，让我们开始研究如何在生产环境中使用\
  \ Django Admin，并学习所有最佳实践和技巧，帮助我们更好地使用 Django Admin。\n\n# 为生产环境优化 Django Admin\n\n\
  在使用生产环境中的 Django Admin 时，有一些提示和技巧你应该遵循，以充分利用 Django。我亲身经历了很多挑战，因为开发人员会让 Django Admin\
  \ 承担越来越多的管理任务。因此，让我们来看一些良好的实践和优化措施，帮助我们充分发挥 Django Admin 的潜力。\n\n## 重命名 admin URL\n\
  \n默认情况下，Django Admin 配置为在 `/admin` 路径下访问。然而，Django Admin 可以访问你网站的所有数据；这就是为什么将路径从\
  \ `/admin` 移动到一些难以猜测的路径，例如 `/blog-cms` 很重要。\n\n不同的包可以让我们提高安全性。例如，`django-admin-honeypot`\
  \ ([`github.com/dmpayton/django-admin-honeypot`](https://github.com/dmpayton/django-admin-honeypot))\
  \ 是一个创建虚假 admin 页面并诱骗攻击者访问虚拟 admin 界面的包。\n\n## 为管理员用户使用双因素认证 (2FA)\n\nDjango Admin\
  \ 可由内部用户使用来执行需要额外权限的管理任务；由于这些用户拥有额外权限，保护任何安全漏洞应该是最高优先级。为 Django Admin 用户添加 2FA 在安全方面非常重要。我们不会在这里深入探讨使用\
  \ Django 实现 2FA，因为这些实现因人而异，但其中一个推荐的第三方包可以帮助你在 Django 中设置 2FA 的是 `django-otp`，你可以在这里了解更多信息：[`github.com/django-otp/django-otp`](https://github.com/django-otp/django-otp)。\n\
  \n## 使用自定义 Admin 分页器\n\n\n\n\n\nDjango Admin 界面已实现了分页。随着表格数据的增长，默认分页的性能会下降。这主要是由于对大型表执行\
  \ `count` 查询时，由于表中存在大量数据，耗时更长；查询会扫描所有行以确定条目的最终计数。我们应该用自定义分页器覆盖默认分页器，该分页器重写了 `count`\
  \ 方法。例如，我们创建了 `CustomPaginator`，它重写了 `count` 行为：\n\n```\nfrom django.core import\
  \ paginator\nfrom django.utils.functional import cached_property\n# Idea referred\
  \ from\n# https://hakibenita.com/optimizing-the-django-admin-paginator\nclass CustomPaginator(paginator.Paginator):\n\
  \    @cached_property\n    def count(self):\n        return 9999999\nclass BlogCustom5Admin(admin.ModelAdmin):\n\
  \    paginator = CustomPaginator\nadmin.site.register(models.Blog, BlogCustom5Admin)\n\
  ```\n\n现在，Django Admin 不会再对表执行数据库调用以获取总行数，并且默认返回一个巨大的数字（`9999999`），如代码中所定义。我们应该仅将此方法用于大型表，因为我们返回的是一个常量计数，可能会让最终用户感到困惑。\n\
  \n## 禁用 ForeignKey 下拉选项\n\nDjango 模型中的 `ForeignKey` 字段会在 Django 模型管理界面中自动添加下拉选项。如果我们有一个大型表，这会造成性能瓶颈，因为\
  \ Django 会尝试将所有外键对象加载到内存中并在下拉选项中显示。Django 理解这样做的性能不足之处，因此它为我们提供了 `raw_id_fields`\
  \ 接口，该接口告诉 Django 用自由文本字段替换下拉选项：\n\n```\nclass BlogCustom6Admin(admin.ModelAdmin):\n\
  \    raw_id_fields = ('author',)\nadmin.site.register(models.Blog, BlogCustom6Admin)\n\
  ```\n\n## 使用 list_select_related\n\n当我们使用 `list_display` 访问关联字段时，会遇到 N+1 查询问题。之前我们看到如何重写默认的\
  \ `get_queryset` 方法来进行优化。但 Django Admin 提供了 `list_select_related` 属性来告诉 Django 在后台使用\
  \ `select_related` 查询。如 *第 3 章* 中所述，使用 `select_related` 获取信息可以解决 N+1 查询问题。\n\n例如，在这里，我们将\
  \ `author` 和 `author__name` 作为列表值传递给 `list_select_related`，它会自动执行 select-related\
  \ 查询：\n\n```\nclass BlogCustom7Admin(admin.ModelAdmin):\n    list_display = ['title',\
  \ 'created_at', 'author_full_name']\n    list_select_related = ['author', 'author__name']\n\
  \    def author_full_name(self, obj):\n        return obj.author.name\nadmin.site.register(models.Blog,\
  \ BlogCustom7Admin)\n```\n\n请注意，如果我们尝试执行反向关系，`list_select_related` 就不起作用。因此，我们需要重写\
  \ `get_queryset` 方法，正如我们之前所学的。\n\n## 为性能重写 get_queryset\n\n我们应该使用 `get_queryset`\
  \ 来优化 Django 使用的查询。当我们有反向外键关系查找时，这尤其有帮助。我们已在 *使用 `get_queryset`* 部分讨论了如何重写 `get_queryset`\
  \ 方法。\n\n## 添加 django-json-widget\n\n由于 Postgres 和其他数据库支持 JSON 字段，你很可能会在 Django\
  \ 中使用 JSON 字段。其中许多字段将通过 Django Admin 手动访问。Django Admin 为 JSON 字段提供的默认 UI 是一个 `textarea`\
  \ UI，但这并不友好。解决此问题的最有用的第三方包之一是 `django-json-widget`（`https://github.com/jmrivas86/django-json-widget`）。该包有助于为\
  \ JSON 字段提供更好的界面。\n\n*图 4.7* 显示了管理面板中常规的 Django JSON 编辑器：\n\n![Figure 4.7: Showing\
  \ the regular Django JSON editor](img/B18867_04_07.jpg)\n\n图 4.7：显示常规的 Django JSON\
  \ 编辑器\n\n现在，如果我们使用 `django-json-widget`，我们可以使用更好的 JSON 编辑器；其结构如 *图 4.8* 所示：\n\n\
  ![Figure 4.8: Showing the django-json-widget editor](img/B18867_04_08.jpg)\n\n图\
  \ 4.8：显示 django-json-widget 编辑器\n\n## 使用自定义操作\n\n通常，管理员用户会使用管理界面执行一组重复的操作。这意味着他们必须在多个页面之间手动跳转（例如，如果我们要让博客上线，我们必须打开每个页面并为每个博客更新状态标志）。这类操作可以很容易地使用自定义操作来执行。\n\
  \n例如，让我们创建一个自定义操作来打印所选博客的标题：\n\n```\nclass BlogCustom8Admin(admin.ModelAdmin):\n\
  \    actions = ('print_blogs_titles',)\n    @admin.action(description='Prints title')\n\
  \    def print_blogs_titles(self, request, queryset):\n        for data in queryset.all():\n\
  \            print(data.title)\nadmin.site.register(models.Blog, BlogCustom8Admin)\n\
  ```\n\n这段代码片段在 Django Admin 中为我们提供了一个额外的下拉选项，称为 **Prints title**，如 *图 4.9* 所示。新的操作选项\
  \ **Prints title** 将在运行 Django 服务器的终端中打印所有博客标题：\n\n![Figure 4.9: Showing the newly\
  \ added Action option called Prints title in Django Admin page.](img/B18867_04_09.jpg)\n\
  \n图 4.9：显示 Django Admin 页面中新增的操作选项 Prints title。\n\n## 为 Django Admin 使用权限\n\nDjango\
  \ Admin 界面帮助我们通过 UI 无缝执行 CRUD 操作。这也意味着如果有人可以访问 Django Admin 面板，他们将可以不受限制地访问用户数据。Django\
  \ 原生提供组和权限，以帮助我们在 Django Admin 中实现不同权限级别。我们将在 *第 5 章* 中学习如何高效使用 Django 权限。\n\n###\
  \ 避免为功能使用 Django Admin\n\n随着项目的成熟，功能需求也会不断演变。Django Admin 最常用于为管理相关任务的 CRUD API\
  \ 创建 UI。然而，它绝不应该被用作面向客户的功能。如果你发现自己在 Django Admin 之上构建功能，那么这就是退一步并在其他框架或平台中构建 UI\
  \ 的正确时机。\n\n如果管理不当，Django Admin 很容易成为权限噩梦。始终建议在产品开发的早期阶段使用 Django Admin。随着产品/公司的成熟，你应该开始考虑将用户从\
  \ Django Admin 中迁移出去。\n\n至此，我们已经学习了如何在生产环境中使用 Django Admin，以及如何配置 Django Admin 以获得更好、更可扩展的可用性。现在，让我们学习如何在\
  \ Django 中创建自定义管理命令，这被广泛使用。\n\n# 创建自定义管理命令\n\nDjango 管理命令帮助我们无缝地与 Django 框架交互。许多繁琐的任务，如迁移、获取构建文件等，如果使用\
  \ Django 管理命令，就会变得更加顺畅。Django 原生提供了许多管理命令，可以在文档中找到：`https://docs.djangoproject.com/en/stable/ref/django-admin/`。\n\
  \n\n\n\n\n在本节中，我们将学习如何在 Django 中创建自定义管理命令。在 Django 中，每个应用程序都可以使用 `manage.py` 注册其自定义操作。要创建新的管理命令，我们需要在\
  \ Django 应用内部创建一个简单的目录结构。在给定的 Django 应用中，我们需要创建 `management/commands` 目录结构，如 *图\
  \ 4*.10* 所示。`commands` 文件夹中创建的任何文件都会被注册为 Django 管理命令，除非文件名以下划线 (`_`) 开头。\n\n在 *图\
  \ 4*.10* 所示的示例中，我们有 `publishedblogs` 和 `totalblogs` 作为两个管理命令，而 `_private` 则不会被视为管理命令：\n\
  \n![Figure 4.10: The folder structure for custom management commands](img/B18867_04_10.jpg)\
  \ \n\n图 4.10：自定义管理命令的文件夹结构\n\n请注意，只有当给定应用已添加到 `INSTALLED_APPS` 设置中时，Django 管理命令才会被注册。一旦我们创建了管理命令文件，我们需要在自定义管理命令文件中定义一个名为\
  \ `Command` 的类，该类继承自 `BaseCommand`。例如，我们的 `total_blogs.py` 文件将包含以下代码：\n\n```\nfrom\
  \ django.core.management.base import BaseCommand\nfrom blog.models import Blog\n\
  class Command(BaseCommand):\n    help = 'Returns total number of blogs'\n    def\
  \ handle(self, *args, **options):\n        total_blogs = Blog.objects.count()\n\
  \        self.stdout.write(self.style.SUCCESS(f'Total blogs: \"{total_blogs}\"'))\n\
  ```\n\n`handle` 方法计算博客表中博客的总数，并使用 `self.stdout.write()` 将其打印到终端。我们可以通过使用 `python\
  \ manage.py total_blogs` 以相同的方式执行我们的 `total_blogs` 自定义命令。\n\n有时，我们需要向自定义命令传递参数。我们可以通过向\
  \ `Command` 类添加一个名为 `add_arguments` 的新方法来实现。例如，在这里，我们添加了 `add_arguments` 方法，该方法配置了可以传递给我们的\
  \ `custom_command_info` 命令的两个参数。第一个参数 `author_ids` 是一个必需的位置参数，而 `custom` 是一个可选参数：\n\
  \n```\nclass Command(BaseCommand):\n    help = 'Returns total number of blogs'\n\
  \    def add_arguments(self, parser):\n        # Positional arguments\n        parser.add_argument('custom_inputs',\
  \ nargs='+', type=int)\n        # Named (optional) arguments\n        parser.add_argument(\n\
  \            '--custom',\n            type=int,\n            help='custom optional\
  \ param',\n        )\n    def handle(self, *args, **options):\n        print(f'Custom\
  \ inputs - {options[\"custom_inputs\"]}')\n        print(f'Custom - {options[\"\
  custom\"]}')\n        total_blogs = Blog.objects.count()\n        self.stdout.write(self.style.SUCCESS(f'Total\
  \ blogs: \"{total_blogs}\"'))\n```\n\n如果我们运行 `custom_command_info` 命令，那么我们将在终端中看到以下输出：\n\
  \n```\n> python manage.py custom_command_info 12 45 --custom 99\nCustom inputs –\
  \ [12, 45]\nCustom – 99\nTotal blogs: \"3\"\n```\n\nDjango 管理命令完全可定制，我们甚至可以用自己的逻辑覆盖默认的管理命令。有关如何自定义\
  \ Django 管理命令的更详细信息，请查看官方文档：https://docs.djangoproject.com/en/stable/howto/custom-management-commands/。\n\
  \n# Summary\n\n在本章中，我们学习了如何在项目中使用 Django Admin。Django Admin 既可定制又可扩展，如果我们使用适当的配置，就能充分发挥其功能。我们还探讨了何时应避免使用\
  \ Django Admin 以及开发人员面临的性能问题。然后，我们学习了 Django 的另一个强大功能，即创建自定义管理命令。\n\n我们简要学习了如何在\
  \ Django 中创建超级用户，但我们没有深入探讨身份验证和授权的工作原理。在下一章中，我们将探讨如何更好地使用 Django 身份验证系统以及如何扩展它以支持不同类型的身份验证，例如社交身份验证、基于令牌的身份验证等。\n\
  \n# 5\n\n# Mastering Django Authentication and Authorization\n\n在 *Chapter 4* 中，我们学习了如何使用\
  \ Django Admin 为基本 CRUD 操作自动生成 `user interface` (`UI`)。在使用 Django Admin 的过程中，我们使用了默认的\
  \ Django 身份验证和授权系统。在本章中，我们将深入 Django 身份验证系统，并学习如何使用 Django 组和权限来实现资源的授权。Django 默认提供基于\
  \ cookie 的会话身份验证，这对于基于浏览器的应用程序非常完美，但在现代 Web 应用中，更倾向于使用基于令牌的身份验证。`Django REST framework`\
  \ (`DRF`) 开箱即用地提供基于令牌的身份验证，我们将学习如何将 DRF 基于令牌的授权集成到我们的项目中以及社交登录。\n\n在本章中，我们将涵盖以下主要主题：\n\
  \n* 学习 Django 身份验证的基础知识\n* 自定义 `User` 模型\n* 使用 `OneToOneField` 与 `User` 模型的关系\n\
  * 使用 Django 权限和组\n* 使用 DRF 基于令牌的身份验证\n* 了解第三方基于令牌的身份验证包\n* 将社交登录集成到 Django 和 DRF\n\
  \n# Technical requirements\n\n您应该熟悉身份验证的基本概念以及为什么 Web 应用程序需要身份验证。我们将介绍如何在 Django\
  \ 中实现 `role-based access control` (`RBAC`)，因此您需要对 RBAC 的概念有基本的了解。您还应该熟悉 Google 和其他社交登录提供商用于为不同应用提供身份验证服务的\
  \ `OAuth 2.0` 的核心概念。\n\n以下是本章所有代码和说明的 GitHub 仓库：https://github.com/PacktPublishing/Django-in-Production/tree/main/Chapter05\n\
  \n# Learning the basics of Django authentication\n\n当今世界，任何用户在使用应用程序时最关心的问题是，*我的数据在该应用程序中安全吗？*\
  \ 这也是开发人员最应该牢记的事情——*始终开发安全的应用程序*。那么，*安全* 究竟意味着什么？安全可以分为多个层面，例如身份验证、授权、服务器安全（即应用程序运行的服务器是安全的）等等。在本章中，我们将重点关注安全的最基本部分，即\
  \ `application authentication`；即通过 `login`。Django 附带了一个内置的身份验证框架。\n\nDjango 的开箱即用方法提供了一个开箱即用的身份验证系统，它为我们提供了一个基本的\
  \ `user model`，并集成了基于会话（cookie）的身份验证。当我们创建一个新的 Django 项目时，默认情况下，Django 会在 `settings.py`\
  \ 的 `INSTALLED_APPS` 部分包含 `django.contrib.auth` 和 `django.contrib.sessions`，这为我们提供了默认的\
  \ `User` 模型和基于会话的身份验证。在 *Chapter 4* 中，我们使用了管理面板，它使用相同的基于会话的身份验证来提供用户登录工作流程。\n\n\
  Read more\n\n\n\n\n\n基于会话的身份验证本身就是一个庞大的主题，超出了本书的范围。如果你不熟悉基于会话的身份验证概念，请阅读官方文档 [`docs.djangoproject.com/en/stable/topics/http/sessions/`](https://docs.djangoproject.com/en/stable/topics/http/sessions/)。\n\
  \nDjango 默认提供了一个标准的 `User` 模型，其中包含以下字段：\n\n*   `username`：必填字段，最大长度为 150 个字符。用于登录目的。请记住——这不是电子邮件地址，因此可以使用此字段作为登录的唯一标识符。我见过组织将此字段用作电子邮件、电话号码或自定义用户名，因此请随意将此字段用作任何字段。\n\
  *   `first_name`：可选字段，最大长度为 150 个字符。\n*   `last_name`：可选字段，最大长度为 150 个字符。\n*   `email`：可选字段，可用于捕获用户的电子邮件地址。\n\
  *   `password`：必填字段，保存所设置密码的哈希值。Django 不会在数据库中存储原始密码。\n*   `is_staff`：布尔字段，用于检查用户是否可以访问管理站点。\n\
  *   `is_active`：布尔字段，用于识别用户账户是否已启用。如果将 `is_active` 字段设置为 `False`，则 Django 提供的默认\
  \ `ModelBackend` 身份验证将不允许用户登录。*请注意，如果你正在创建任何自定义登录系统，则除非你已实现自定义逻辑来检查该标志，否则它将不会被尊重。*\n\
  *   `is_superuser`：布尔字段，应谨慎使用。如果为任何用户设置此标志，则他们可以完全访问所有 Django 管理部分。\n*   `last_login`：日期时间字段，捕获用户上次登录的时间。*请注意，此字段仅在使用\
  \ `ModelBackend` 的默认登录机制时更新。*\n*   `date_joined`：日期时间字段，捕获用户账户创建时的日期时间。\n*   `groups`：与\
  \ `Group` 表的多对多关系。我们将在 *Using Django permissions and groups* 部分讨论 *groups* 概念。当我们使用\
  \ Django 授权为用户提供访问控制时，这特别有帮助。Django 使用此字段在后端提供 RBAC 支持。\n*   `user_permissions`：与\
  \ `Permission` 表的多对多关系。Django 将权限与组结合使用，以在管理门户或 API 级别权限上提供 RBAC，使用 `has_perm` 方法。我们将在\
  \ *Using Django permissions and groups* 部分讨论 *permissions* 概念。\n\n上述所有字段都是标准的，对于任何基础项目都足够了。许多组织或项目可能有自定义需求，需要与给定用户关联的额外字段，这时我们可以自定义\
  \ `User` 模型。在以下部分，我们将学习在 Django 中自定义 `User` 模型的不同方法。\n\n# 自定义 User 模型\n\n主要可以通过两种方法来自定义\
  \ `User` 模型。两者都有各自的优势，让我们一个一个地学习：\n\n*   **通过一对一关系扩展 User 模型**：每当需要向用户添加额外字段时，这是一种最简单和最好的解决方案。在这种方法中，我们将创建一个新模型，例如\
  \ `UserProfile`，然后与 `User` 模型创建一对一关系。任何新的自定义字段都将添加到 `UserProfile` 模型中。我建议大多数情况下使用这种方法，因为这是最简单、最干净的解决方案之一，不需要开发人员付出太多努力，并且满足我们的需求。\n\
  *   **使用 AbstractUser 和 AbstractBaseUser 模型扩展**：这是扩展 `User` 模型的另一种方法。在这种方法中，我们必须创建我们自己的自定义\
  \ `User` 模型并继承自 `AbstractUser` 类或 `AbstractBaseUser` 类。这些模型之间的关键区别是：\n    *   `AbstractUser`：仅当你想更新\
  \ `User` 表中的用户名字段时才使用 `AbstractUser` 模型。\n    *   `AbstractBaseUser`：如果你想从头开始在 `User`\
  \ 表中创建所有字段，请使用 `AbstractBaseUser` 模型。\n\n建议仅在你对 Django 有充分理解并熟悉登录和身份验证工作流程时才使用自定义模型方法。\n\
  \n## 使用 AbstractUser 或 AbstractBaseUser 创建自定义 User 模型\n\n现在，让我们学习如何在 Django 项目中使用\
  \ `AbstractUser` 或 `AbstractBaseUser` 模型创建自定义 `User` 模型：\n\n1. 创建一个新的 Django 应用，`custom_user`。\n\
  2. 然后，定义一个 `CustomUser` 模型，具有适当的字段，例如 `phone_no` 和 `city`，继承 `AbstractUser` 类。\n\
  3. 接下来，将 `username` 字段设置为 `None`。我们还需要从 `BaseUserManager` 定义一个自定义模型管理器：\n\n```\n\
  from django.contrib.auth.base_user import BaseUserManager\nfrom django.contrib.auth.models\
  \ import AbstractUser\nfrom django.db import models\nclass CustomUserManager(BaseUserManager):\n\
  \    \"\"\"\n    Used for updating default create user behaviour\n    \"\"\"\n \
  \   def create_user(self, phone_no, password, **kwargs):\n        # implement create\
  \ user logic\n        user = self.model(phone_no=phone_no, **kwargs)\n        user.set_password(password)\n\
  \        user.save()\n        return user\n    def create_superuser(self, phone_no,\
  \ password, **kwargs):\n        # creates superuser.\n        self.create_user(phone_no,\
  \ password)\nclass CustomUser(AbstractUser):\n    username = None\n    phone_no\
  \ = models.CharField(unique=True, max_length=20)\n    city = models.CharField(max_length=40)\n\
  \    USERNAME_FIELD = \"phone_no\"\n    objects = CustomUserManager()\n```\n\n前面的代码片段定义在\
  \ `custom_user/models.py` 文件中。在代码片段中，我们创建了一个 `CustomUser` 模型和一个 `CustomUserManager`\
  \ 模型管理器，并将 `username` 逻辑更新为 `phone_no`。这意味着，从现在开始，我们可以利用 `phone_no` 字段以及密码登录到我们的\
  \ Django 应用程序。\n\n4. 一旦我们创建了模型，我们需要告诉 Django 为任何身份验证目的使用新模型。我们需要进入 `settings.py`\
  \ 文件，然后定义一个新变量：\n\n```\nAUTH_USER_MODEL = \"custom_user.CustomUser\"\n```\n\n请注意，`\"\
  custom_user\"` 是我们自定义应用的名称，其中定义了 `CustomUser` 模型。\n\n5. 现在，运行 Django 迁移命令来创建我们的新\
  \ `User` 模型。\n6. 我们还需要更新 Django Admin 表单，以便我们的 Django Admin 工具正常工作。我们不会深入表单的细节，因为这超出了本书的范围。\n\
  \n### 阅读更多\n\nDjango 的官方文档提供了明确的示例；请在此处查看 [`docs.djangoproject.com/en/stable/topics/auth/customizing/#a-full-example`](https://docs.djangoproject.com/en/stable/topics/auth/customizing/#a-full-example)。\n\
  \n我们已经学习了 Django 如何开箱即用地提供 `User` 模型，以及如何自定义 `User` 模型以适应我们的用例。\n\n尽管我们已经学习了如何在\
  \ Django 中使用自定义 `User` 模型，但建议创建一个单独的配置文件模型来捕获所有额外的用户信息，并*使用一对一关系*与默认的 `User` 模型关联，以便\
  \ Django 可以处理所有身份验证和其他安全功能。使用这种方法，开发人员可以专注于产品功能开发，而无需过多参与身份验证的框架级更改。\n\n\n\n\n\n\
  # 使用 OneToOneField 关系与 User 模型\n\n在 Django 中存储自定义用户信息最简单的方法之一是创建新模型并与默认 `User` 模型创建新的\
  \ `OneToOneField` 关系。让我们通过一个简单示例来实现这种方法。\n\n我们需要在平台上为每个注册用户存储电话号码和城市，但 Django 默认的\
  \ `User` 模型中没有这些字段。我们应该创建一个新模型来为每个用户存储此信息。\n\n首先，创建一个新的自定义 Django 应用 `custom_user`。然后，在\
  \ `custom_user/models.py` 文件中添加新的 `UserProfile` 模型：\n\n```\nfrom django.db import\
  \ models\nclass UserProfile(models.Model):\n    user = models.OneToOneField('auth.User',\
  \ related_name='user_profile', on_delete=models.CASCADE)\n    phone_no = models.CharField(unique=True,\
  \ max_length=20)\n    city = models.CharField(max_length=40)\n    def __str__(self):\n\
  \        return self.user.username\n```\n\n在这里，我们创建了一个 `user` 字段，它与 Django 默认的 `User`\
  \ 模型具有一对一关系。每个用户的电话号码和城市信息存储在 `phone_no` 和 `city` 字段中。\n\n使用这种创建 `UserProfile` 等自定义模型的方法的最大优势在于，我们可以拥有任何不会与\
  \ Django 默认 `User` 模型行为冲突的字段和逻辑。\n\n我们看到 Django `User` 模型与 *组和权限* 具有关系。在下一节中，我们将深入探讨\
  \ `Group` 和 `Permission` 表的细节，这些表可以帮助我们为终端用户提供 RBAC 支持。\n\n# 使用 Django 权限和组\n\n\
  RBAC 是一种基于分配给单个用户的角色来限制访问的方法。Django 权限和组是我职业生涯中遇到的最深思熟虑、最详细的 RBAC 系统之一。我总是选择 Django\
  \ 来完成任何紧迫期限的项目的主要原因之一，主要是因为它开箱即用的身份验证和授权系统。在本节中，我们将对如何在项目中使用 Django 组和权限进行高层次概述。\n\
  \n## 在 Django Admin 中使用权限和组\n\n在 *第 4 章* 中，在探索 Django Admin 时，我们使用 Django `superuser`\
  \ 在管理面板中导航；因此不需要权限。但随着项目进入生产环境，我们希望根据其用例为每个用户提供受限访问。例如，支持代理只需要对所有支付模型具有 *只读* 访问权限，并且不应访问任何其他数据库。这类\
  \ RBAC 可以轻松通过 Django Admin 实现。\n\n当我们以超级用户身份登录 Django 管理面板时，我们将能够看到身份验证和授权 UI，如\
  \ *图 5**.1* 所示。`Groups` 和 `Users` 部分帮助我们为 Django 应用程序实现 RBAC：\n\n![Figure 5.1: Django\
  \ admin panel showing AUTHENTICATION and AUTHORIZATION](img/B18867_05_01.jpg) \n\
  \n图 5.1：显示 AUTHENTICATION 和 AUTHORIZATION 的 Django 管理面板\n\n默认情况下，Django 为每个模型对象创建权限对象。这些权限对象在\
  \ Django Admin 中用于检查使用 Django Admin 的特定用户是否有授权执行请求的模型操作。如果我们在 Django Admin UI 中打开\
  \ auth `User` 对象，我们将能够看到附加到特定用户的所有组和用户权限。例如，如 *图 5**.2* 所示，我们可以看到可附加到用户的全部用户权限。Django\
  \ 为项目中所有模型创建权限对象，具有 `add`、`change`、`delete` 和 `view` 等不同操作类型。我们可以选择特定模型，然后将所需权限附加到用户对象：\n\
  \n![Figure 5.2: User object view in Django Admin showing all the groups and user\
  \ permissions attached to the given user](img/B18867_05_02.jpg) \n\n图 5.2：Django\
  \ Admin 中用户对象视图，显示附加到给定用户的所有组和用户权限\n\n尽管我们始终可以将单个权限附加到用户，但最好始终使用组来为任何用户授予权限，以便所有权限都可以通过组集中管理。Django\
  \ `permissions` 帮助我们创建模型操作的精细控制，而 Django `groups` 是权限的集合，有助于我们创建角色。例如，支持代理可能只需要访问查看\
  \ author 模型和 blog 模型，因此我们将创建一个名为 `Support Agent` 的 Django 组并添加 author 和 blog 模型的只读权限，如\
  \ *图 5**.3* 所示：\n\n![Figure 5.3: Creating a new Django Support Agent group](img/B18867_05_03.jpg)\
  \ \n\n图 5.3：创建新的 Django Support Agent 组\n\n一旦我们创建了 Django `Support Agent` 组，我们将其附加到用户，如\
  \ *图 5**.4* 所示。这将允许用户通过 Django Admin 以只读方式访问 `author` 和 `blog` 表：\n\n![Figure 5.4:\
  \ Attaching the Support Agent group to a Django user](img/B18867_05_04.jpg) \n\n\
  图 5.4：将 Support Agent 组附加到 Django 用户\n\n使用 Django 组有助于我们从中央位置控制 Django Admin 界面的权限，每个用户类型各不相同。例如，如果我们想删除所有支持代理查看作者信息的能力，我们将转到\
  \ `Support Agent` 组并删除附加的作者查看权限；这将自动从所有通过 Django `Support Agent` 组获得访问权限的支持代理中移除对\
  \ author 模型的访问。\n\nDjango 开箱即用提供基本 CRUD 操作权限对象，但我们的业务用例可能需要自定义权限；例如，只有某些用户可以更新博客标题，而其他用户只能编辑博客内容。对于此类用例，Django\
  \ 允许我们创建自定义权限。\n\n## 创建自定义权限\n\nDjango 权限在模型级别。要创建自定义权限，我们必须使用 permissions 模型 `Meta`\
  \ 属性。例如，我们需要创建权限以允许某些用户仅更新博客标题，而某些用户更新博客内容：\n\n```\nclass Blog(models.Model):\n\
  \  ...\n  class Meta:\n    permissions = [\n      (\"update_title\", \"Can update\
  \ the title of the blog\"),\n      (\"update_content\", \"Can update the content\
  \ of blog\"),\n    ]\n```\n\n一旦我们在模型中定义了权限，我们就需要运行 Django 迁移来创建权限对象。\n\n仅仅创建自定义权限并不意味着我们的应用程序将实现所有自定义权限。我们需要编写自定义逻辑来使用\
  \ Django 权限强制执行授权。\n\n让我们创建一个简单的 Django 视图，该视图将使用自定义权限并检查结果：\n\n```\ndef update_blog_title(request):\n\
  \    blog_id = request.GET.get('id')\n    blog = Blog.objects.get(id=blog_id)\n\
  \    if request.user.has_perm(\"blog.update_title\"):\n        return HttpResponse('User\
  \ has permission to update title')\n    return HttpResponse('User does not have\
  \ permission to update title')\n```\n\n现在，如果我们尝试在浏览器上访问该视图，我们将收到 **User does not\
  \ have permission to update title** 消息。但如果我们将权限添加到用户然后尝试访问页面，则会收到 **User has permission\
  \ to update title** 响应。\n\n请注意\n\n如果您以超级用户身份登录 Django Admin 界面，那么您将始终看到 **User has\
  \ permission to update title**。这是因为在 Django 中，超级用户隐式拥有所有权限。然而，并非每个员工用户都具有全站权限，因此应创建一个普通员工用户并分配自定义权限来测试代码。\n\
  \n\n\n\n\nDjango 自定义权限使我们能够利用现有的 Django 权限框架，为我们的 Django 应用提供自定义的 RBAC 支持。\n\n##\
  \ 使用 Django 权限和组为 API 服务\n\nDjango 组和权限可以通过编写自定义代码用于 API。DRF 还支持自定义 `Permission`\
  \ 类，可以在内部使用 Django 权限和组：\n\n```\ndef check_permission(user, group_name):\n    return\
  \ user.groups.filter(name=group_name).exists()\n@api_view(['POST'])\ndef blog_view(request)\n\
  \    if not check_permission(request.user, 'can_view_blog')\n        return Response(status=403)\n\
  \    # perform operation\n```\n\n在前面的代码示例中，我们正在检查发出请求的 user 是否有资格评论。如果 `can_view_blog`\
  \ 组附加到 user，则他们有资格评论；否则，他们没有资格评论，我们将返回 `403` 错误。\n\n类似地，我们可以在代码中编写自定义业务逻辑来支持 DRF\
  \ API 的授权。我们也可以编写自定义 DRF 权限类来执行此类操作。\n\nRead more\n\n更多详情，请查阅官方文档了解如何在 DRF 中创建自定义权限类：[`www.django-rest-framework.org/api-guide/permissions/#custom-permissions`](https://www.django-rest-framework.org/api-guide/permissions/#custom-permissions%20)\n\
  \n## 使用权限的注意事项\n\n尽管 Django 组和权限是我遇到过的最强大的 RBAC 系统之一，但我也见过很多项目因过度使用 Django 权限框架而变得难以维护。在本节中，我们将尝试学习所有良好的实践，开发者和团队可以采用这些实践来正确地利用\
  \ Django 组和权限：\n\n*   **避免直接将权限附加到 auth user 对象**：当我们开始使用 Django 权限时，直接将权限附加到 django\
  \ auth user 可能会很诱人，但这种诱惑很快就会导致噩梦。随着我们使用更多 Django 权限，跟踪哪个 user 可以访问 Django 应用的哪个部分变得很棘手。为了解决这个问题，始终使用\
  \ Django 组将权限附加到用户。\n*   **避免创建超级用户**：我们应避免为项目创建超级用户，因为他们可以通过 Django Admin 无限制地执行任何操作。\n\
  *   **避免使用过多的 Django 自定义权限**：Django 权限附加到模型，有时开发者会不必要地将自定义 Django 权限附加到模型，而他们并不需要任何模型关系。尝试为此目的使用\
  \ Django 组。\n\n在下面的代码片段中，我们正在检查 user 是否附加到特定组以进行授权：\n\n```\nif user.groups.filter(name='custom_group').exists():\n\
  \    # perform operation\n```\n\n`custom_group` 可能没有附加任何模型权限，但基本的 Django 组可用于检查\
  \ user 是否属于特定组以进行操作。\n\n到目前为止，我们了解了 Django 权限框架以及如何使用它在 Django 应用中创建 RBAC 系统。现在，我们将研究\
  \ DRF 如何支持基于令牌的身份验证，以及如何将其集成到我们的 Django 项目中。\n\n# 使用 DRF 基于令牌的身份验证\n\n现代 Web 应用不再仅限于浏览器。事实上，*超过\
  \ 55%* 的互联网流量来自移动设备（根据这份 *Cloudflare* 报告：[`radar.cloudflare.com/traffic?range=28d`](https://radar.cloudflare.com/traffic?range=28d)）。Django\
  \ 最初是在 18 多年前构建的，当时浏览器更流行，但在当今世界，移动设备和应用的数量超过了浏览器，这需要不同类型的身份验证。DRF 开箱即支持多种身份验证类型：\n\
  \n*   基本身份验证\n*   基于会话的身份验证\n*   基于令牌的身份验证\n*   远程用户身份验证\n\n基于令牌的身份验证是当今世界最流行、最广泛使用的身份验证形式。在本节中，我们将学习如何在\
  \ Django 项目中启用和使用基于令牌的身份验证，使用基于令牌的身份验证的优势，以及另一种自定义的基于令牌的身份验证。\n\n## 将基于令牌的身份验证集成到\
  \ DRF\n\nDRF 基于令牌的身份验证使用简单的基于令牌的 HTTP 身份验证方案。DRF 创建一个新模型，为给定 user 保存已颁发的令牌，并与 `User`\
  \ 表有一对一的关系。让我们逐步查看 DRF 如何实现基于令牌的身份验证工作流程：\n\n1.  user 发出包含用户名和密码的登录请求。\n2.  Django\
  \ 从 `Auth User` 表中验证用户名和密码。\n3.  一旦 user 凭据得到验证，DRF 为给定 user 创建一个新令牌，然后将令牌作为响应发送给最终\
  \ user。\n\n之后客户端发出的所有请求现在都将已颁发的令牌附加到 HTTP 头部。\n4.  当 Django 收到带有附加到请求的 auth 令牌的请求时，Django\
  \ 然后将令牌与数据库中保存的令牌进行验证，并将 `Auth User` 对象附加到 `request.user` 属性。这会将 user 详细信息填充到 `request`\
  \ 对象中，令牌可用于识别哪个 user 发出了请求。如果令牌不匹配，则 DRF 将向客户端发送 `401` 错误。\n\n在本节中，我们在高层次上了解了 DRF\
  \ 基于令牌的身份验证的工作原理。现在，让我们看看如何使用 DRF 将基于令牌的身份验证集成到 Django 中。\n\n## 向 Django 项目添加 DRF\
  \ 基于令牌的身份验证\n\n在 DRF 中，身份验证是在视图执行之前作为第一步检查的。重要的是要理解，与 Django 基于会话的身份验证不同，DRF 身份验证*不是通过中间件实现的*。相反，DRF\
  \ 在关联的视图执行开始时检查身份验证。DRF 主要采用这种方法，以确保 DRF 是一个即插即用系统，可以轻松地与其他视图使用的其他身份验证机制共存。例如，Django\
  \ Admin Views 使用原生的 Django 基于会话的身份验证。\n\n与 Django 一样，DRF 在请求成功身份验证后也会将 `Auth User`\
  \ 对象附加到 `request.user` 属性。如果请求没有任何身份验证属性，则它会将 `Anonymous` user 附加到 `request.user`。现在让我们学习将\
  \ DRF 令牌集成到我们的 Django 项目的步骤：\n\n1.  DRF 包有一个内部应用，可在我们的数据库中创建 `Token` 表。我们需要在 Django\
  \ 设置的已安装应用中添加 `rest_framework.authtoken`，以将 `authtoken` 应用附加到我们的项目中：\n\n```\nINSTALLED_APPS\
  \ = [\n    ...\n    'rest_framework.authtoken'\n]\n```\n\n2.  运行 `python manage.py\
  \ migrate` Django 迁移命令以在我们的数据库中创建 `Token` 表。\n3.  将默认身份验证类添加到配置设置中。\n\nDRF 在视图执行开始前评估身份验证，因此我们可以为每个视图定义身份验证类。但如果开发者忘记添加身份验证，这可能会导致安全漏洞。因此，建议附加默认身份验证类。如果我们需要更改特定视图的身份验证，则始终可以在\
  \ *view* 定义中覆盖身份验证。\n\n仅仅将身份验证附加到视图是不够的；我们还需要告诉 DRF 给定视图的权限类型是什么。默认情况下，我们应该为所有视图添加\
  \ `IsAuthenticated`，以便所有视图始终可由经过身份验证的 user 访问，除非明确说明。\n\n\n\n\n\n我们需要在 `settings.py`\
  \ 文件中添加以下配置，以为我们所有的视图启用身份验证和权限：\n\n```\nREST_FRAMEWORK = {\n    'DEFAULT_AUTHENTICATION_CLASSES':\
  \ [\n        'rest_framework.authentication.TokenAuthentication',\n    ],\n    'DEFAULT_PERMISSION_CLASSES':\
  \ [\n        'rest_framework.permissions.IsAuthenticated',\n    ]\n}\n```\n\n从现在起，所有映射到\
  \ DRF 视图的请求都将经过 DRF 基于令牌的身份验证，我们将检查发出请求的<|message|>用户是否已登录。\n\n### 4. 我们需要创建一个 `login`\
  \ 视图，让用户可以获取用于身份验证的令牌。请注意，我们需要为 `login` 视图显式添加 `permission_classes` 为 `AllowAny`，否则我们会收到\
  \ `401` 错误：\n\n```\nfrom rest_framework.authtoken.models import Token\nfrom rest_framework.permissions\
  \ import AllowAny\nfrom django.contrib.auth import authenticate\n@api_view(['POST'])\n\
  @permission_classes([AllowAny])\ndef login(request)\n  username = request.DATA['username']\n\
  \  password = request.DATA['password']\n  user = authenticate(username=username,\
  \ password=password)\n  if not user:\n    return Response(status='401')\n  token\
  \ = Token.objects.get_or_create(user=user)\n  return Response(data={\"token\": token.key})\n\
  ```\n\n### 5. 生成令牌后，我们需要在对 Django 服务器发出的每个后续请求中附加该令牌。将令牌添加到 `Authorization` 头键中；该键应以\
  \ `Token` 字符串文字为前缀，两个字符串之间用空格分隔：\n\n```\nAuthorization: Token <token key>\n```\n\
  \n然后，`curl` 请求应如下所示：\n\n```\ncurl -X GET http://127.0.0.1:8000/api/example/ -H 'Authorization:\
  \ Token 9944b09199c62bcf9418ad846dd0e4bbdfc6ee4b'\n```\n\n我们现在已为项目配置了 DRF 基于令牌的身份验证。有了它，对我们\
  \ DRF 视图发出的任何请求都将始终检查基于令牌的身份验证以及请求是否已通过身份验证。DRF 还支持并行身份验证和权限类；如果我们想附加更多身份验证方法，则将它们添加为列表。例如，如果我们还希望默认的\
  \ Django 基于会话的身份验证适用于我们的 DRF 视图，则可以添加以下内容：\n\n```\nREST_FRAMEWORK = {\n    'DEFAULT_AUTHENTICATION_CLASSES':\
  \ [\n        'rest_framework.authentication.TokenAuthentication',\n        'rest_framework.authentication.SessionAuthentication',\n\
  \    ]\n}\n```\n\n使用多个 Django 身份验证可以帮助我们为 Django 项目支持多种身份验证。DRF 将尝试使用第一个身份验证类对请求进行身份验证。如果成功，则不会检查其他类并将用户附加到\
  \ `request.user` 属性，否则，它将继续尝试后续的身份验证类。\n\nRead more\n\nDRF 权限类在内部使用 Django 组和权限框架来支持模型级权限。我们不会深入探讨\
  \ Django 权限框架的细节以及如何在 DRF 项目中使用它。你可以查看 DRF 文档中提到的示例以了解更多详情：[`www.django-rest-framework.org/api-guide/permissions/#api-reference`](https://www.django-rest-framework.org/api-guide/permissions/#api-reference)。\n\
  \nDRF 还提供了一个接口来根据我们的需求创建自定义身份验证和权限类。DRF 的官方文档提到了扩展这些类的逐步流程。我们不会对这些类深入探讨，我会让大家为此目的遵循官方教程。\n\
  \nRead more\n\n对于自定义身份验证类，请遵循此链接：[`www.django-rest-framework.org/api-guide/authentication/#custom-authentication`](https://www.django-rest-framework.org/api-guide/authentication/#custom-authentication)。\n\
  \n对于自定义权限类，请遵循官方文档中提到的教程：[`www.django-rest-framework.org/api-guide/permissions/#custom-permissions`](https://www.django-rest-framework.org/api-guide/permissions/#custom-permissions)。\n\
  \n现在，让我们来看一下 DRF 基于令牌身份验证的几个局限性。\n\n## 理解 DRF 基于令牌身份验证的局限性\n\nDRF 基于令牌的身份验证是一个相当简单的实现。对于任何基本应用程序，DRF\
  \ 都能完美运行，但当你开始构建具有身份验证的复杂功能时，就会发现其中的缺陷。让我们了解 DRF 基于令牌身份验证的一些不足之处：\n\n*   **不支持多设备登录**：由于\
  \ DRF 为每个用户创建一个令牌，如果用户在多个设备上登录，则我们将在每个设备上使用相同的令牌。如果用户在不受信任的设备上登录，这是一个安全问题。用户唯一的选择是删除旧令牌；这将使用户从所有设备上注销。\n\
  *   **未加密的令牌存储在数据库中**：每当创建新令牌时，DRF 都会以原始格式保存令牌；因此如果数据库 ever 被攻破，黑客将能够访问所有用户。\n*\
  \   **无过期时间**：DRF 会跟踪每个令牌的创建时间，但它不支持令牌过期。在现代应用程序中，提供过期和刷新令牌功能非常重要。\n*   **每个请求都需要数据库查找**：对于每个请求，都将涉及一次数据库查询，以根据头中设置的令牌获取用户信息。\n\
  *   **无法通过令牌向前端发送任何数据**：现代应用程序使用令牌在不进行额外 API 调用的情况下检索有关用户的基本信息。\n*   **不支持社交登录**：用户希望通过\
  \ Google、GitHub 等社交登录平台进行一键式顺畅登录。\n\n这些是使用 DRF 基于令牌身份验证的几个常见缺点。虽然没有简单的解决方案可以解决所有这些用例，但我们可以查看一些第三方包，它们提供了不同的方法来解决这些问题。\n\
  \n# 了解第三方基于令牌的身份验证包\n\n在本节中，我们将对可用于 Django 和 DRF 以解决 DRF 基于令牌身份验证挑战的不同可用包进行高层次概述。我们不会深入探讨以下包的实现和集成；相反，我们将使开发人员了解他们可以轻松使用以解决问题而存在的开源包。\n\
  \n## django-rest-knox\n\n`django-rest-knox` 包提供了多设备登录和会话管理支持。它的架构与 DRF 基于令牌的身份验证类似，但它解决了几个问题，例如以加密格式保存令牌并为已签发的令牌提供过期时间。\n\
  \nRead more\n\n有关更多详细信息，请查看官方文档：[`jazzband.github.io/django-rest-knox/`](https://jazzband.github.io/django-rest-knox/)。\n\
  \n### djangorestframework-simplejwt\n\n`JSON Web Token` `JWT` 是一种现代的基于令牌的身份验证标准，在开发者中相当流行（阅读更多内容请访问\
  \ [`jwt.io/introduction`](https://jwt.io/introduction)）。JWT 的优点是它不需要数据库查找即可进行验证，并且我们可以将信息添加到已签发的\
  \ JWT 令牌本身中，客户端可以利用这些信息获取有关用户的信息。`djangorestframework-simplejwt` 包有助于在 DRF 项目中启用\
  \ JWT 身份验证。\n\nRead more\n\n\n\n\n\n官方文档详细介绍了如何将 JWT 集成到 Django 项目中：[`django-rest-framework-simplejwt.readthedocs.io/en/latest/getting_started.html`](https://django-rest-framework-simplejwt.readthedocs.io/en/latest/getting_started.html)\n\
  \n有许多包，例如 `django-allauth`、`djoser`、`django-rest-knox`、`dj-rest-auth` 等，提供了一套不同的认证机制，但在选择任何包之前，我们应该意识到该包带来了哪些功能，以及自己构建这些功能是否合理。这是一个需要权衡取舍的问题，因为一旦我们使用第三方包进行认证，之后再逆转这个决定将会非常困难。\n\
  \n认证的最后一个重要方面是社交登录。社交登录是当今现代 Web 应用中最常见的登录形式。让我们学习如何为我们的 Django 项目集成社交登录。\n\n# 将社交登录集成到\
  \ Django 和 DRF\n\n社交登录对于任何面向客户端的应用都至关重要。在当今世界，用户不想填写冗长的注册表单，也不想为每个网站记住密码；这些障碍都可以通过社交登录来解决。有多个服务，例如\
  \ Google、Facebook、Twitter 和 GitHub，可以接入我们的网站以启用社交登录。这些平台各自的实现细节不同，实现起来可能很棘手。我建议你使用\
  \ `python-social-auth` 第三方包将社交登录集成到 Django 应用中。\n\n我们不会深入 `python-social-auth` 的实现细节（[`python-social-auth.readthedocs.io/en/latest/configuration/django.html`](https://python-social-auth.readthedocs.io/en/latest/configuration/django.html)），因为有多种类型的服务提供商，例如\
  \ Google、Facebook、GitHub 等。你最好阅读各自平台的集成文档。\n\n# 总结\n\n在本章中，我们学习了 Django 如何开箱即用地提供认证。Django\
  \ 还借助 Django 权限和组提供了授权支持。RBAC 是现代应用所需的关键安全功能之一，Django 已开箱即用地提供。\n\n我们还学习了如何使用 DRF\
  \ 和 Django 使用基于令牌的认证。基于令牌的认证对于非浏览器客户端很有用，例如 Android、iOS 和物联网设备。社交登录是当今现代应用必备的功能，我们讨论了如何在\
  \ Django 中使用 `python-social-auth` 来集成社交登录。\n\n在下一章中，我们将学习如何在 Django 应用中实现缓存、日志记录和节流，以及它们带来的额外优势。\n"
- "# 第 2 部分 – 使用 Django 的高级概念\n\n在本部分，我们可以预期学习 Django 的高级概念，例如缓存、分页、Django 信号和中间件。Celery\
  \ 框架是用于异步任务最流行的框架之一，我们将在本部分学习如何将 Celery 集成到 Django 项目中。我们还将学习如何为 Django 项目编写测试用例，以及在与\
  \ Django 协作时软件行业使用的最佳实践和约定。\n\n本部分包含以下章节：\n\n* *第 6 章*，*缓存、日志记录和节流*\n* *第 7 章*，*使用分页、Django\
  \ 信号和自定义中间件*\n* *第 8 章*，*使用 Celery 与 Django*\n* *第 9 章*，*在 Django 中编写测试*\n* *第 10\
  \ 章*，*探索 Django 中的约定*\n\n# 6\n\n# 缓存、日志记录和节流\n\n在 *第 5 章* 中，我们学习了如何对每个请求进行认证并执行授权，以确保客户端有权访问资源。这些操作会为每个请求产生额外的数据库调用。对于大多数用例来说，这些额外的数据库调用是可以忽略的。但随着系统的构建，我们可能会遇到希望数据库读取操作响应更快的情况；缓存在此发挥重要作用。本章将学习如何在\
  \ Django 中使用缓存。节流是限制客户端在一定时期内发出请求数量的过程。日志记录和节流是我们行业中广泛使用的高级概念。\n\n在本章中，我们将学习：\n\n\
  * 使用 Django 进行缓存\n* 使用 Django 进行日志记录\n* 使用 Django 进行节流\n\n## 技术要求\n\n我们期望读者对缓存的含义及其对终端用户的益处有一个基本概念。我们期望读者熟悉与节流相关的概念以及实现节流的用例。\n\
  \n缓存和节流都需要一个额外的内存数据库：`Redis`。尽管我们将使用抽象的 Redis API 进行实现，但建议读者了解 Redis 是什么及其基本概念。除此之外，我们将学习如何在\
  \ Django 中执行日志记录操作。Django 日志框架使用并扩展了 Python 内置的 logging 模块，因此我们期望读者在高层面上了解 Python\
  \ logging 模块的工作原理。\n\n了解更多\n\n要对 Redis 有基本了解，可以查阅 Redis 的官方文档，或在 [`university.redis.com/`](https://university.redis.com/)\
  \ 参加其中一个 Redis 课程。\n\nPython 官方文档在 [`docs.python.org/3/library/logging.html`](https://docs.python.org/3/library/logging.html)\
  \ 提供了关于内置 logging 模块的简明学习指南。\n\n## 使用 Django 进行缓存\n\n缓存被认为是计算机科学中必要的恶。它有助于获得性能提升，但也使系统变得复杂。计算机科学中最重要的复杂性之一是使缓存失效。在本节中，我们将学习\
  \ Django 中缓存的实现方式，以及如何使用 Django 和 DRF 改善开发者的整体缓存体验。\n\nDjango 开箱即用地提供了不同类型的缓存策略：\n\
  \n* `本地内存缓存`：数据缓存在应用内存本身中。\n* `数据库缓存`：Django 会将缓存结果存储在数据库本身中。\n* `文件系统缓存`：缓存条目以文件形式保存在文件系统上。\n\
  * `基于内存数据库的缓存`：Django 支持使用 Memcache 和 Redis 等缓存数据库在项目中使用。我们将在本章学习如何将 Redis 集成到 Django\
  \ 项目中。\n* `自定义缓存`：开发者也可以编写自定义后端来创建自己的策略以集成到 Django。\n\n从 Django 4 开始，Django 开箱即用地支持\
  \ Redis 作为缓存的内存数据库。让我们先学习如何使用 Redis 数据库。就像 Postgres 一样，我们必须在系统上安装 Redis 才能使用它。然而，我们不想在系统上设置\
  \ Redis 的麻烦；因此，本章我们将使用 Redis 云服务。稍后，在 *第 11 章* 中，我们将学习如何使用 Docker 使用 Redis。\n\n\
  重要说明\n\n我们不会在本章深入探讨 Redis 配置和设置。我们将主要关注将 Redis 集成到 Django 项目中，以及如何在项目中使用缓存。随着项目的增长，开发者需要进一步微调缓存配置以处理规模和高级用例。\n\
  \n\n\n\n\n要在此处使用 Redis，请访问 [`app.redislabs.com/#/login`](https://app.redislabs.com/#/login)，创建一个新账户，并按照向导创建新的\
  \ Redis 数据库。*图 6.1* 显示了我们将使用的 Redis Labs 仪表板：\n\n![Figure 6.1: Redis dashboard from\
  \ RedisLabs](img/B18867_06_01.jpg)\n\n图 6.1：来自 RedisLabs 的 Redis 仪表板\n\n一旦我们创建了\
  \ Redis 数据库，我们需要从 RedisLabs 仪表板中识别以下信息：\n\n* **Public endpoint**：此项包含主机 URL 和端口的信息\n\
  * **Redis user**：对于免费计划，用户始终为 `default`\n* **Redis password**：此项在 **Default user\
  \ password** 字段中提及\n\n现在让我们检查如何使用配置并为 Django 添加 Redis 缓存支持。\n\n向 `settings.py` 文件添加以下配置：\n\
  \n```\nCACHES = {\n    'default': {\n        'BACKEND': 'django.core.cache.backends.redis.RedisCache',\n\
  \        'LOCATION': 'redis://<user>:<password>@<public endpoint>',\n    }\n}\n\
  ```\n\n除了在 `settings.py` 文件中进行配置外，我们还必须使用 `pip` 安装 `redis` 包。我们可以通过 `pip install\
  \ redis` 来完成。\n\n添加配置后，我们需要测试我们的 Redis 配置是否有效且正常工作。为此，打开 Django shell 并运行以下命令：\n\
  \n```\n>>> from django.core.cache import cache\n>>> cache.set('hello', 'World',\
  \ 600)\n>>> cache.get('hello')\n'World'\n```\n\n如果我们看到输出 `World`，则确认 Django 中的缓存配置按预期工作。\n\
  \n### Important note\n\nRedis 支持仅从 Django 4 及以上版本开始添加到 Django。如果您使用的是更低版本，可以考虑升级\
  \ Django 版本或使用 `django-cacheops`，我们在下一节中讨论过。\n\n现在我们的 Django 项目已配置为使用 Redis 支持缓存基础设施。Django\
  \ 原生支持缓存响应和不同的实用程序。DRF 使用 Django 提供的实用程序来支持缓存响应和不同的缓存功能。\n\n### Read more\n\nDjango\
  \ 的缓存框架提供了可以缓存响应的基本缓存功能。官方文档包含了实现视图级缓存的所有细节。我们不会深入探讨它们，因为此缓存接口提供了一个大多数开发人员已经了解的基本实现。\n\
  \nDjango: [`docs.djangoproject.com/en/stable/topics/cache/#the-per-view-cache`](https://docs.djangoproject.com/en/stable/topics/cache/#the-per-view-cache)\n\
  \nDRF: [`www.django-rest-framework.org/api-guide/caching/`](https://www.django-rest-framework.org/api-guide/caching/%20)\n\
  \n除了视图级缓存接口外，Django 还提供了一个低级 API 来实现我们自己的缓存接口。我们在之前的章节中学习了如何利用 DRF 构建现代应用程序，而缓存是其中的重要组成部分。我们可以使用\
  \ Django 提供的低级 API 来创建我们的缓存层，但我们必须编写大量额外的代码，这是不推荐的。因此，我建议使用额外的包：`django-cacheops`。\n\
  \n## Using django-cacheops\n\nDjango 4 提供了开箱即用的 Redis 作为缓存层的支持，但 Django 提供的默认缓存接口更适合缓存视图。随着我们在应用程序中构建复杂功能，我们需要在函数内部实现业务逻辑时实现缓存。Django\
  \ 提供了一个低级 API 接口来使用底层缓存框架并直接与 Redis 交互，但对于开发人员来说，实现缓存功能变得过于麻烦。为此，我始终建议使用 `django-cacheops`（[`github.com/Suor/django-cacheops`](https://github.com/Suor/django-cacheops)），这是一个第三方包，它抽象了使用低级缓存\
  \ API 时的所有额外开销。以下是 `django-cacheops` 包的说明：\n\n*Django cacheops is a slick ORM cache\
  \ with automatic granular event-driven invalidation.*\n\n让我们快速看看如何使用 `django-cacheops`\
  \ 配置 Redis。首先，将 `cacheops` 添加到 `settings.py` 文件中的 `INSTALLED_APPS` 列表中。现在使用我们在上一节中从\
  \ Redis Labs 获得的 Redis 服务器的相同配置：\n\n```\nCACHEOPS_REDIS = {\n    \"host\": \"<public\
  \ endpoint>\",  # Redis endpoint\n    \"port\": 15014,  # for redis lab, port is\
  \ 15014\n    \"socket_timeout\": 3,  # connection timeout in seconds, optional\n\
  \    \"password\": \"<REDIS_PASSWORD>\",\n}\n```\n\n现在我们已在项目中配置了 `django-cacheops`，让我们实现最常见且广泛使用的缓存用例。让我们尝试获取给定作者编写的所有博客：\n\
  \n```\n@cached(timeout=60*10)\ndef get_all_blogs(author_id):\n    print('Fetching\
  \ blogs from database')\n    blogs = Blog.objects.filter(author_id=author_id)\n\
  \    blogs_data = BlogSerializer(blogs, many=True).data\n    return blogs_data\n\
  @api_view(['GET'])\ndef get_blogs_by_author(request):\n    author_id = request.GET.get('author_id')\n\
  \    blogs = get_all_blogs(author_id)\n    return Response({'blogs': blogs})\n```\n\
  \n在我们的示例中，我们缓存了 `get_all_blogs` 对不同 `author_id` 的响应，缓存时间为 10 分钟。这意味着如果我们在 10 分钟内向函数传递相同的\
  \ `author_id`，输出将使用保存在 Redis 中的缓存结果返回。缓存由 `cached` 装饰器完成。为了验证我们的缓存，我们添加了一个 `print`\
  \ 语句。现在，第一次我们应该在终端中看到 `print` 语句的输出：`Fetching blogs from database`。\n\n`cached`\
  \ 装饰器接受 `timeout` 作为参数，表示以秒为单位的总时间，之后缓存值将被从 Redis 中移除。`cacheops` 还负责创建唯一的缓存键名称和其他低级实现细节，这些细节对于确保没有冲突非常重要。\n\
  \n### Important note\n\n应该确保返回的值是已求值的 QuerySet 值，而不是在进行 DB 查询之前未求值的 QuerySet。在我们的示例中，我们有\
  \ `return list(blogs)`，这意味着我们返回的是查询的值；如果我们返回 `blogs` 变量，则缓存的工作方式会不同。尽管函数会被缓存，但它会返回一个缓存的\
  \ QuerySet，该 QuerySet 在返回值时始终会命中数据库。\n\n我们还需要实现一种使缓存失效的方式，以便在我们更新数据库中的数据后不使用缓存中的陈旧数据。`django-cacheops`\
  \ 提供了简单的 `invalidate('<key>')` 接口来删除所有缓存结果。例如，如果我们必须使作者 ID 为 12 的结果失效，则需要调用：\n\n\
  ```\nget_all_blogs.invalidate(12)\n```\n\n如果我们必须使给定函数的全部缓存结果失效，则在调用 invalidate 时不要传递任何参数。例如，要删除\
  \ `get_all_blogs` 函数的所有缓存结果，我们需要不带任何参数调用 invalidate：\n\n```\nget_all_blogs.invalidate()\
  \ # removes all cached response\n```\n\n让我们现在列出在使用 `django-cacheops` 时应了解的所有功能和注意事项：\n\
  \n* 您应该使用简单的基于时间失效的缓存来优化昂贵的 DB 查询：\n\n```\n@cached(timeout=no_of_sec)\ndef some_costly_function(data_input):\n\
  \    return …\n```\n\n自动地，我们的函数现在针对特定的 `data_input` 在给定时间范围内被缓存。对于 `data_input`\
  \ 的不同值，我们将有不同的结果被计算并缓存。`timeout` 参数以总秒为单位输入，之后缓存结果将被从 Redis 中驱逐。\n\n* 实现一个手动失效接口，以便在需要时可以轻松访问：\n\
  \n\n\n\n\n```\nsome_costly_function.invalidate('abc')\n# This would invalidate the\
  \ caching for the input argument of\n# 'abc' but would have the other functions\
  \ cached\nsome_costly_function.invalidate()\n# This would invalidate the caching\
  \ for overall function.\n```\n\n* 在 auth 表上实现缓存是一把双刃剑；除非与 auth 表的数据库查询存在明显的延迟，否则应避免使用。\n\
  \n* `Cacheops` 提供了通过 `settings.py` 文件中的配置来缓存 Django 应用所有表的接口。在我看来，这是不应该做的，因为它会在模型表上形成一层\
  \ blanket 缓存，导致开发者在生产环境中看不到预期结果而产生大量困惑。我始终建议使用函数级缓存，因为这样对任何人来说都更明确、更详细，更容易检测。\n\n\
  * 如果确实需要在 DB 层实现缓存——例如，如果我们必须缓存 auth user 表的所有 get 查询——我们可以在 Django `settings.py`\
  \ 文件中配置 `cacheops`：\n\n```\nCACHEOPS = {\n    # Cache any User.objects.get() calls\
  \ for 15 minutes\n    # This also includes .first() and .last() calls,\n    # as\
  \ well as request.user or post.author access,\n    # where Blog.author is a foreign\
  \ key to auth.User\n    'auth.user': {'ops': 'get', 'timeout': 60*15},\n    # Cache\
  \ all gets and QuerySet fetches\n    # to other django.contrib.auth models for an\
  \ hour\n    'auth.*': {'ops': {'fetch', 'get'}, 'timeout': 60*60}\n}\n```\n\n* 每当你想在任何数据源更新时实现缓存结果的自动失效时，使用\
  \ `cached_as` 装饰器。例如，如果我们想在 blog 表更新时使缓存失效，我们应该使用 `cached_as` 装饰器并将模型名 `Blog` 作为参数传递：\n\
  \n```\nfrom cacheops import cached_as\n@cached_as(models.Blog, timeout=15*60)\n\
  def get_all_blogs(author_id):\n    blogs = models.Blog.objects.filter(author_id=author_id)\n\
  \    return list(blogs)\n```\n\n每当 `Blog` 模型数据有任何更新时，`get_all_blogs` 函数中的缓存将被自动失效。\n\
  \n除了上述提示和注意事项外，强烈建议阅读官方文档中提供的所有额外信息。现在让我们学习在生产环境中实现缓存时应遵循的几个良好实践。\n\n## 生产环境缓存的最佳实践\n\
  \n让我们看看在生产环境中实现缓存时我们应牢记的几点重要事项：\n\n* 生产环境中始终使用高可用性的 Redis 集群。建议使用 AWS 的 ElastiCache\
  \ 或 Redis Lab 等托管服务，并采用主-从配置用于生产。这很重要，因为如果你有一个高读系统且缓存宕机，所有读查询都会命中数据库，这可能产生连锁效应并导致整个系统宕机。\n\
  \n* 避免对每个 DB 查询都进行过早缓存。很多开发者试图节省额外的 10 ms 数据库查询调用，从而使系统变得复杂。\n\n* 缓存实现始终保持详细，并在函数上添加缓存，而不是整体视图或\
  \ DB 表。\n\n* 缓存失效是缓存实现的重要组成部分。始终在生产环境中创建用于使缓存失效的接口。我个人曾观察到由于缺乏缓存失效机制而导致的几个生产问题；例如，数据库中的特定数据已更新，但用户仍看到陈旧数据。因此，作为经验法则，如果你缓存了一些重要函数，请尽早创建失效接口以避免任何生产事故。\n\
  \n* 切勿缓存处理敏感数据的任何 API 或函数。例如，切勿缓存用户身份验证令牌。不应缓存身份验证令牌，因为我们希望每次都执行身份验证。\n\n我们已经了解了缓存以及如何在\
  \ Django、DRF 中实现缓存，并使用 `django-cacheops`。在以下部分，我们将学习节流的概念以及 DRF 如何为我们在 Django 中构建的\
  \ API 提供实现节流的接口。节流使用我们在 Django 设置配置中提到的相同默认缓存基础设施。\n\n# 使用 Django 进行节流\n\n节流是限制用户在给定时间范围内可以发出的\
  \ API 请求数量的过程。Django 本身不提供开箱即用的节流功能，但 DRF 提供。在本节中，我们将学习如何使用 DRF 结合节流。\n\n不同的系统对节流有不同的用例。对于\
  \ SaaS 产品，节流是根据其付费计划限制每个客户每分钟的 API 调用次数所必需的。Shopify 后端 API 就是一个例子。标准产品公司不希望其 API\
  \ 被任何外部客户滥用，因此会对超过特定阈值的请求进行节流。\n\n重要提示\n\n我们应该理解，在本节中我们是在应用层实现节流。这通常不是保护服务免受暴力攻击的推荐方法，因为应用级节流仍可能增加应用的请求队列并降低整体系统性能。我们应始终使用\
  \ `web application firewall` (`WAF`) 实现节流。这将保护你的系统在发生大规模暴力攻击时不会积压请求。请注意，当你构建新系统且不期望高流量时，可以将\
  \ WAF 的引入推迟到系统后期的某个时间点。DRF 提供的应用级节流应用于纳入业务层实现。\n\nDRF 使用 Django 的默认缓存框架作为后端。在设置节流之前，我们应该在\
  \ Django 中设置缓存；除了我们在上一节学到的基本 Django Redis 设置外，我们无需做任何额外工作。一旦使用 Django 后端缓存设置好 Redis，我们需要配置节流类。不建议通过\
  \ `setting.py` 中的 `DEFAULT_THROTTLE_CLASSES` 配置对所有 API 进行 blanket 节流，因为不同 API 的吞吐量不同。最好在独立评估每个端点的流量模式后为其创建单独的节流限制。我们需要在\
  \ `settings.py` 文件中定义默认节流速率。`'anon'` 键表示允许多少 *未登录请求*，而 `'user'` 键表示 *已登录请求* 的配置：\n\
  \n```\nREST_FRAMEWORK = {\n    'DEFAULT_THROTTLE_RATES': {\n        'anon': '100/day',\n\
  \        'user': '1000/day'\n        'scope': '10000/day'\n    }\n}\n```\n\nDRF\
  \ 提供了三种开箱即用的节流类，可帮助我们实现节流：\n\n* `AnonRateThrottle`：为未登录用户请求实现节流。默认情况下，节流速率将取自 `'anon'`\
  \ 默认节流速率配置的值。内部，DRF 会使用 `X-Forwarded-For` 头来识别 IP 地址并确定请求的来源。因此，配置应用转发客户端 IP 地址到该头中非常重要。\n\
  \n\n\n\n\n## `UserRateThrottle`\n为已登录用户请求实现限流。默认情况下，限流速率将取自 `'user'` 默认限流速率配置中传入的值。这对终端用户调用的总\
  \ API 数量设置了一个全局速率限制；因此，在附加 `UserRateThrottling` 时应谨慎。它将使用用户 ID 生成唯一的限流键。如果未找到，则会回退到\
  \ IP 地址。默认作用域 `'user'` 键可以通过为扩展类分配新的作用域值来覆盖。\n\n### `ScopedRateThrottle`\n对组合在一起的特定\
  \ API 实现限流。例如，如果我们想对两个 API 组合实现限流，我们应该使用具有定义作用域的 `ScopedRateThrottle`。\n\nDRF APIViews\
  \ 有一个 `throttle_classes` 属性，它接受所有限流类的列表。如果我们要在 `BlogApiView` 上附加一个 `AnonRateThrottle`，我们可以通过在以下代码片段中添加限流类来实现：\n\
  \n```\nfrom rest_framework.views import APIView\nfrom rest_framework.throttling\
  \ import AnonRateThrottle\nclass BlogApiView(APIView):\n    throttle_classes = [AnonRateThrottle]\n\
  \    ...\n```\n\n同样，我们可以将 `UserRateThrottle` 类附加到 `APIView`。对于 `ScopedRateThrottle`，我们需要传递额外的\
  \ `throttle_scope` 属性。例如，`BlogApiView` 和 `BlogDetailApiView` 都分配了相同的 `throttle_scope`，这意味着总速率限制将分配给这两个\
  \ API，而 `Blog2ApiView` 将具有独立的限制：\n\n```\nfrom rest_framework.views import APIView\n\
  from rest_framework.throttling import AnonRateThrottle\nclass BlogApiView(APIView):\n\
  \    throttle_classes = [ScopedRateThrottle]\n    throttle_scope = 'blog_limit'\n\
  \    ...\nclass BlogDetailApiView(APIView):\n    throttle_classes = [ScopedRateThrottle]\n\
  \    throttle_scope = 'blog_limit'\n    ...\nclass Blog2ApiView(APIView):\n    throttle_classes\
  \ = [ScopedRateThrottle]\n    throttle_scope = 'blog_2_limit'\n    ...\n```\n\n\
  我们可以在 `settings.py` 文件中设置限流限制，如以下片段所示：\n\n```\nREST_FRAMEWORK = {\n    'DEFAULT_THROTTLE_RATES':\
  \ {\n        'blog_limit': '1000/day',\n        'blog_2_limit': '100/day'\n    }\n\
  }\n```\n\n所有限流类都是可扩展的，可以轻松覆盖它们。也可以将多个限流类传递给一个 APIView，因此我们可以为单个 API 视图添加多个规则。如果将多个限流类附加到单个\
  \ APIView，则在执行视图主体之前，所有类都需要通过，否则会引发 `exceptions.Throttled`。\n\n有关如何创建自定义限流类并扩展现有类的更多详细信息，可以查看官方文档：[`www.django-rest-framework.org/api-guide/throttling/`](https://www.django-rest-framework.org/api-guide/throttling/)\n\
  \n## 生产环境中限流的最佳实践\n\n现在让我们来看一下在生产环境中实现限流时应遵循的几个最佳实践：\n\n* 始终优先使用 WAF 或其他组件实现限流。仅当应用程序规模较小且使用其他方法增加的复杂性超过其优势时，才应在应用层实现限流。\n\
  * 避免在 DRF 设置中添加全局应用限流。它可能在生产环境的任何时候产生反效果。\n* 为所有被限流的请求添加监控和日志记录。这有助于您监控任何意外的限流行为，或根据使用模式不时提高限流限制。\n\
  * 始终记得将客户端的正确 IP 地址传递给 `X-Forwarded-For`，以便限流后端执行预期行为。由于客户端和 Django 服务器之间存在多个组件，使用错误的\
  \ IP 地址很常见。始终 double-check 客户端 IP 是否正确传播到 Django 服务器。\n* 默认的 `UserRateThrottle`\
  \ 始终使用全局速率限制。建议通过扩展 `UserRateThrottle` 类使用自定义作用域。\n\n我们现在将学习如何在 Django 中实现日志记录，以及日志记录如何帮助我们在生产环境中更好地运行。\n\
  \n# 使用 Django 进行日志记录\n\n日志记录可以被视为编程中每个数据的记录。Django 使用 Python 内置的日志模块（[`docs.python.org/3/library/logging.html`](https://docs.python.org/3/library/logging.html)）来捕获日志。在\
  \ Django 中，日志记录作为通用 Django `django.setup()` 函数的一部分进行配置，因此除非明确禁用，否则它始终可用。Python 的日志模块提供了设置和配置日志的广泛选项；因此，使用\
  \ Django 进行日志记录时也可用所有这些配置。在本节中，我们将学习如何在 Django 中设置日志记录以及在 Django 项目中使用日志记录的最佳实践。\n\
  \n重要说明\n\nPython 中的日志记录是一个广泛的主题，有时日志记录的配置会很棘手。在本节中，我们不会详细介绍如何使用 Python 提供的所有不同选项。相反，我们将检查我已在多个项目中使用并发现非常有帮助的标准配置。\n\
  \n如果您想深入了解详细配置，请阅读 Python 日志模块官方文档和 Django 日志文档：[`docs.djangoproject.com/en/stable/topics/logging/`](https://docs.djangoproject.com/en/stable/topics/logging/)\n\
  \n## 设置日志记录\n\n默认情况下，Django 日志发送到控制台。每当我们在 Django 代码中添加 print 语句时，输出就会打印到控制台。在本地设置中工作时，开发人员首先采用这种方法来记录数据并开发应用程序。然而，这种方法在生产环境中不起作用，因为开发人员无法访问控制台。这就是将日志输出到文件很有帮助的地方。\n\
  \n让我们看看如何配置 Django 来设置日志基础设施。请注意，我们将只使用一个标准配置，它主要解决日志记录的所有标准用例。要在 Django 中启用日志记录，我们需要在\
  \ Django `settings.py` 文件中添加一个片段，如以下代码片段所示：\n\n```\nLOGGING = {\n    \"version\"\
  : 1,\n    \"disable_existing_loggers\": False,\n    \"formatters\": {\"verbose\"\
  : {\"format\": \"%(asctime)s %(process)d %(thread)d %(message)s\"}},\n    \"loggers\"\
  : {\n        \"django_default\": {\n            \"handlers\": [\"django_file\"],\n\
  \            \"level\": \"INFO\",\n        },\n    },\n    \"handlers\": {\n   \
  \     \"django_file\": {\n            \"class\": \"logging.handlers.RotatingFileHandler\"\
  ,\n            \"filename\": \"path/to/django_logs.log\",\n            \"maxBytes\"\
  : 1024 * 1024 * 10,  # 10MB\n            \"backupCount\": 10,\n            \"formatter\"\
  : \"verbose\"\n        },\n    },\n}\n```\n\n让我快速解释 `LOGGING` 对象中每一行的含义：\n\n* `version`：这意味着使用的配置版本是\
  \ `logging.config.dictConfig` *版本 `1`* 格式。\n* `disable_existing_loggers`：Django\
  \ 提供了一些默认的日志配置。`disable_existing_loggers` 标志用于启用/禁用默认日志配置设置。一般来说，保持此标志为 false。这意味着\
  \ Django 配置的默认记录器仍然处于活动状态。\n* `formatters`：格式化程序是键值对，每个键代表我们可用于记录消息的格式化程序。我们配置了一个\
  \ `verbose` 格式化程序来记录额外信息，例如时间戳、进程 ID 等。\n* `loggers`：记录器是在创建日志时使用的命名空间。一个应用程序可以有多个记录器。在我们的应用程序中，我们将自定义记录器命名为\
  \ `django_default`，每当我们需要使用此日志配置时，我们将使用此名称：\n\n\n\n\n\n进入`/path/to/xxx`目录，找到`xxx.json`。\n\
  \n在表达式`cvar = avar + bvar`中，加法运算符（`+`）将`avar`与`bvar`相加，得到它们的和`cvar`\n\n在`List.of(arg0,\
  \ arg1, arg2)`中，`List`接口的工厂方法`of()`接受一系列的元素，返回包含它们的只读列表。\n\n之后我们这样调用`cmd`命令：`cmd\
  \ arg0 arg1 arg2`。\n\n```\nif (condVar > someVal) {console.log(\"xxx\")}\n```\n\n\
  \n\n\n\n我们可能想要手动打开每个文件并阅读日志消息，但在有多台服务器的情况下，这种方法并不具备可扩展性。我们可以使用不同的日志处理栈来执行此操作。其中最常见且使用最广泛的栈是\
  \ `Elasticsearch-Logstash-Kibana` (`ELK`)，但这需要一些手动设置的工作。我建议使用 `NewRelic` 来处理和浏览日志。我们将在\
  \ *第 14 章* 学习 NewRelic 的设置以及如何使用 NewRelic 处理和访问日志。让我们学习一下在生产环境中进行日志记录时应遵循的几个最佳实践\n\
  \n## 生产环境日志记录的最佳实践\n\n我们已经学习了如何在 Django 中设置日志记录以及如何创建和访问日志消息。现在让我们学习在使用生产环境日志记录时应考虑的几个最佳实践：\n\
  \n* 不要在生产环境中使用日志记录来收集错误。我们看到的最常见错误之一是开发人员在生产环境中使用日志记录来捕获错误。虽然这对于小型项目有效，但这种方法不可扩展。应使用\
  \ `Sentry` 或 `Rollbar` 等错误监控工具来实现此目的。我们将在 *第 14 章* 了解更多关于这些工具的信息。\n* 不要使用电子邮件传输日志。相反，使用日志管理代理将生成的日志传输到日志引擎，以便更好地访问日志。使用\
  \ `NewRelic` 或 `ELK` 栈等工具来访问和浏览日志。\n* 避免将敏感信息传递给日志。我们的应用程序可能可以访问有关用户的信息，而随着我们开始使用日志来捕获不同的信息，我们应确保不会在日志中捕获敏感信息。例如，避免捕获电子邮件地址、密码、付款详情等。这可以通过使用\
  \ Python 日志模块提供的自定义日志过滤器来实现。\n* 使用前面所示的通用日志函数。这将使日志具有一致的格式，使日志代理更容易解析，并帮助我们更好地扫描它们。\n\
  * 在当前用例结束后删除日志。如果我们不删除所有旧的和不必要的日志，这可能会因日志消耗量大而产生高成本。随着应用程序的增长，您应跟踪如何删除旧的日志函数调用。\n\
  \n我们已经学习了如何在 Django 中实现日志记录以及在项目中实现日志记录的最佳实践。这可以被视为 Django 日志记录的样板设置。通过提到的设置，可以获得大部分使用日志记录的信息。但是，如果您有不同的需求，请随时访问官方文档并改进您的设置。\n\
  \n# 摘要\n\n在本章中，我们学习了如何使用 RedisLabs 设置 Redis 服务器。Redis 是一种重要的内存数据库，用于不同的应用程序，例如缓存和限流。我们学习了如何将\
  \ Redis 集成到原生 Django 中并使用 Redis 进行缓存。Django 内置的缓存支持不足以向 API 添加缓存，但 `django-cacheops`，一个第三方包，可以简化缓存实现。我们还学习了如何将\
  \ `django-cacheops` 与 Redis 设置以及在生产环境中使用它的最佳实践。\n\n除了缓存之外，Redis 还用于限流，我们学习了如何在 Django\
  \ 中设置限流以及如何创建自定义应用程序级限流。Django 中的日志记录使用 Python 内置的日志模块。对于开发人员来说，在 Django 中设置日志记录是一项艰巨的任务，因此我们学习了您可以在生产环境中使用的基本样板日志记录设置来记录消息。我们将在\
  \ *第 14 章* 再次回顾日志记录设置，在那里我们将学习如何使用 NewRelic 设置日志记录并简化浏览日志的整体体验。\n\n在 *第 7 章*，我们将学习如何在\
  \ DRF 和 Django 信号中使用分页。我们还将发现如何在 Django 中创建自定义中间件以及中间件的不同应用。\n"
- "# 使用分页、Django 信号和自定义中间件\n\n在 *第 6 章*，我们学习了如何将 Redis 集成到 Django 项目中并将 Redis 用作缓存层。缓存对于获得性能提升很重要，但有时我们希望优化发送给客户端的整体响应。这可以通过实现\
  \ `pagination` 来实现。\n\n在本章中，我们将学习如何在 Django 和 `Django Rest Framework` (`DRF`) 中实现分页。除了分页之外，我们还将重点介绍\
  \ Django 信号以及它们如何帮助开发人员在不同应用程序之间解耦逻辑。在 *第 5 章*，我们看到了 Django 身份验证和授权如何开箱即用地使用 Django\
  \ 中间件支持；现在我们将学习如何在 Django 中创建自定义中间件。\n\n本章将涵盖以下主题：\n\n* 在 Django 和 DRF 中分页响应\n*\
  \ 揭秘 Django 信号\n* 使用 Django 中间件\n* 创建自定义中间件\n\n## 技术要求\n\n在本章中，我们将学习如何在 Django 和\
  \ DRF 中实现分页。我们希望您熟悉 *pagination* 术语及其优势。Django 信号和自定义中间件也是高级主题，因此我们希望您熟悉我们在前几章中涵盖的所有概念。您应熟悉\
  \ Django 请求-响应周期，我们在 *第 3 章* 中讨论过。\n\n## 在 Django 和 DRF 中分页响应\n\n当客户端发送请求从服务器获取记录时，不建议一次性发送数据库中存在的所有条目。这就是分页概念发挥作用的时候。例如，如果我们保存了\
  \ 1,000 篇博客，一次性将所有博客发送给客户端的请求将增加页面加载时间并给系统带来性能瓶颈。为了解决这些问题，我们将引入分页的概念。\n\n### 理解分页\n\
  \n让我们举一个例子来理解分页的概念。客户端请求获取博客列表，我们的网站上发布了 1,000+ 篇博客。我们会分小批发送一些博客，例如每次 10 篇。这就是分页。用户将与\
  \ UI 交互并请求下一批博客。服务器可以为 API 实现不同类型的分页：\n\n* Cursor API 分页\n* Keyset API 分页\n* Offset\
  \ API 分页\n* 基于时间的 API 分页\n\n我们将在 *在 DRF 中使用分页* 部分学习所有这些技术。简而言之，我们可以将分页视为我们有一个条目列表，我们在将每个数据切片发送给客户端之前将列表切片成更小的部分的概念。\n\
  \n让我们学习关于可以使用 Django ORM 以最简单的方式实现的基本分页，通过创建一个 `get_blog_without_pagination` 视图，该视图返回所有博客。此视图适用于小规模，但在我们有\
  \ 1,000+ 博客时，此视图会很慢且不太有用，因为读者不期望阅读全部 1,000+ 博客。将以下代码添加到 `blog/views.py`：\n\n```\n\
  def get_blog_without_pagination(request):\n    blogs = Blog.objects.all()\n    blogs_data\
  \ = BlogSerializer(blogs, many=True).data\n    return Response({'blogs': blogs_data})\n\
  ```\n\n我们还需要将视图链接到 URL，因此将以下代码添加到 `blog/urls.py` 文件：\n\n```\nurlpatterns = [\n    .\
  \ . .\n    path('unpaginated/', views.get_blog_without_pagination),\n    . . .\n\
  ]\n```\n\n当我们打开 [`127.0.0.1/blog/unpaginated/`](http://127.0.0.1/blog/unpaginated/)\
  \ 时，我们将获得数据库中创建的所有博客的列表。随着创建更多博客，这不可扩展。\n\n\n\n\n\n为了添加分页，我们需要将响应拆分为更小的块，例如每个响应\
  \ 10 篇博客。我们可以使用 Django ORM 的 `limit` `offset` 来实现。让我们为同一个视图实现分页。使用以下代码创建新的 `get_blog_with_pagination`\
  \ 视图：\n\n```\n@api_view(['GET'])\ndef get_blog_with_pagination(request):\n\tpage\
  \ = int(request.GET.get('page', 1))\n\tpage_size = int(request.GET.get('page_size',\
  \ 10))\n\toffset = (page-1)*page_size\n\tlimit = page*page_size\n\tblogs = Blog.objects.all()[offset:limit]\n\
  \tblogs_data = BlogSerializer(blogs, many=True).data\n\treturn Response({'blogs':\
  \ blogs_data})\n```\n\n此外，我们需要通过向 `blog/urls.py` 文件添加以下代码来将视图链接到 URL：\n\n```\nurlpatterns\
  \ = [\n\t. . .\n\tpath('paginated/', views.get_blog_with_pagination),\n\t. . .\n\
  ]\n```\n\n当我们打开 [`127.0.0.1/blog/paginated/?page=1&page_size=2`](http://127.0.0.1/blog/paginated/?page=1&page_size=2)\
  \ 时，我们将获得创建的两篇博客列表。现在用户通过查询参数请求博客数据并传递需要返回博客的页码。我们的 API 调用将以 `page` 和 `page_size`\
  \ 作为输入并相应地返回博客数量。\n\n在使用 Django 构建产品功能时，我们需要实现分页。对于几乎所有用例，我们都可以使用本节讨论的自定义分页逻辑。\n\
  \nDRF 还提供了开箱即用的接口来使用不同的分页技术。让我们学习如何使用 DRF 使用分页。\n\n## 在 DRF 中使用分页\n\nDjango 开箱即用地提供了\
  \ `Paginator` 类（[`docs.djangoproject.com/en/stable/topics/pagination/`](https://docs.djangoproject.com/en/stable/topics/pagination/)），可用于实现分页。DRF\
  \ 利用相同的 `Paginator` 类为 API 提供分页支持。我们不会深入探讨 Django 提供的 `Paginator` 类的细节；相反，我们将重点关注\
  \ DRF 提供的分页类型。\n\n请注意\n\n我们没有讨论 DRF 中分页的集成，因为 DRF 的文档提供了如何设置不同类型分页的详细信息。您可以从官方文档（[`www.django-rest-framework.org/api-guide/pagination/`](https://www.django-rest-framework.org/api-guide/pagination/)）中了解实现细节。\n\
  \n在我们的 GitHub 代码仓库中，我们添加了不同的示例来为 DRF 集成分页。请查看 `Chapter07` 的 README 文件了解更多详情：[`github.com/PacktPublishing/Django-in-Production/tree/main/Chapter07`](https://github.com/PacktPublishing/Django-in-Production/tree/main/Chapter07)。\n\
  \n主要有三种分页类型可用：\n\n* `PageNumberPagination` – 这种分页在 URL 查询参数中发送页码。例如，如果我们有 100 篇博客并且我们将博客拆分为\
  \ 20 的批次，那么我们将有 5 页，每页 20 篇博客。每当客户端请求第 1 页时，我们将提供前 20 篇博客；随着客户端请求中的页码增加，我们将分享下一批博客。在这里，客户端无法控制响应中将获取多少条目。\n\
  \n* `LimitOffsetPagination` – 在这里，客户端可以完全控制响应中需要获取多少条目以及从何处偏移获取数据。这种分页类型为客户端提供了更多的数据检索控制，但也可能给\
  \ API 带来漏洞。例如，恶意用户可能会以 1,000 的限制命中 API，这会对我们的服务器造成不必要的压力。因此，为了解决这个问题，我们应该设置一个检查，以阻止客户端请求中传递的任何不切实际的\
  \ `limit` 值，从而给服务器带来负载。\n\n* `CursorPagination` – 基于游标的分页是一种有点复杂的分页技术，在实现时需要关注细节，否则很容易适得其反。基于游标的分页是大型系统中实现分页的可扩展技术。我建议开发人员在没有涉及其他方法无法解决的强扩展问题之前，避免实现基于游标的分页。有关该概念的更多详细信息，请阅读\
  \ David Carmer 关于 Disqus 如何实现基于游标分页的文章（[`cra.mr/2011/03/08/building-cursors-for-the-disqus-api/`](https://cra.mr/2011/03/08/building-cursors-for-the-disqus-api/)）。\n\
  \n就像其他 DRF 类一样，您可以轻松扩展内置的分页类，根据用例创建自定义 `Pagination` 类。\n\n在本节中，我们学习了分页如何有助于提高网站的性能，以及如何在\
  \ DRF 中使用不同的分页类。现在，让我们来看一下 Django 提供的另一个高级概念：Django 信号。\n\n# 揭秘 Django 信号\n\nDjango\
  \ 有很多开箱即用的功能，但其中一个被低估且脱颖而出的功能是 Django 信号。Django 开箱即用地包含一个“信号调度器”，它帮助开发人员编写解耦的逻辑。信号调度器会通知一组接收器某些操作已经发生。这在我们希望对单个事件执行多个操作时很有用。默认情况下，Django\
  \ 提供了一些内置信号，有助于构建常见的应用程序，如下所示：\n\n* `Model signals` – 这些是数据库操作信号，可以帮助开发人员在即将执行或已经执行某种数据库操作时触发操作。以下是针对某些\
  \ Django 模型操作事件分派的默认 Django 信号列表：\n\n  * `pre_save` 和 `post_save` – 这些信号在调用模型的 `save()`\
  \ 方法之前和之后触发。请注意，当使用 `update()` 方法时，这些信号*不会触发*。\n\n  * `pre_delete` 和 `post_delete`\
  \ – 这些信号在从 `Model` 对象或查询集调用 `delete()` 方法之前触发。\n\n  * `m2m_changed` – 当 Django 模型的\
  \ `ManyToManyField` 发生变化时触发此信号。由于此列表中之前提到的所有信号均不适用于 M2M 字段，因此每当有模型更改时都会触发 `m2m_changed`。`m2m_changed`\
  \ 发送的参数具有 `action` 数据，其值可以是以下之一：\n\n    * `pre_add` 和 `post_add` – 在一个或多个对象添加到多对多字段的关系之前和之后发送。\n\
  \n    * `pre_remove` 和 `post_remove` – 在一个或多个对象从多对多字段的关系中移除之前和之后发送。\n\n    * `pre_clear`\
  \ 和 `post_clear` – 在多对多字段的 M2M 关系被清除之前和之后发送。\n\n* `Management signals` – 这些信号在执行\
  \ `manage.py migrate` 命令时触发。我见过的一个用例是使用它来通知开发团队新的迁移更改已在生产环境中执行。以下是针对某些 Django 管理命令执行而分派的默认\
  \ Django 信号列表：\n\n  * `pre_migrate` – 在迁移过程开始时触发\n\n  * `post_migrate` – 在迁移过程完成后触发\n\
  \n* `Request/response signals` – 这些信号在 Django 应用程序接收到请求时以及响应被处理并发送回客户端时触发。以下是针对\
  \ Django 请求/响应事件分派的默认 Django 信号列表：\n\n  * `request_started` – 当 Django 从客户端接收到信号并开始处理时发送\n\
  \n  * `request_finished` – 当 Django 将 HTTP 响应交付给客户端时发送\n\n\n\n\n*   `got_request_exception`\
  \ – 每当 Django 在请求/响应周期中遇到异常时触发\n\n*   **数据库包装器** – 每当 Django 连接到数据库时，这些信号就会被触发。这有助于对\
  \ Django 数据库连接执行任何自定义操作。关于在数据库中设置查询超时的常见用例之一在 *第 2 章* 中进行了讨论。以下 Django 信号在我们建立 DB\
  \ 连接时被分发：\n\n    *   `connection_created` – 每当 Django 服务器与数据库之间建立数据库连接时就会触发\n\n\
  我们已经了解了 Django 为我们提供的可使用的默认信号。随着项目的增长，对信号的需求也在演变。因此，有时我们刚刚讨论的信号可能不足以支持所有用例。Django\
  \ 提供了创建自定义信号的方法，如以下章节所述。\n\n## Creating custom signals\n\nDjango 信号是在 Django 项目内部编写解耦逻辑的强大机制。*揭秘\
  \ Django 信号* 部分中提到的内置信号可以帮助我们处理默认用例，但如果我们有自定义用例，Django 自定义信号可以帮助我们解决它。例如，如果我们希望每当用户在我们的网站上购买产品时发送多重通信，例如电子邮件、短信和\
  \ WhatsApp，我们可以通过自定义 Django 信号来实现。我们会在每次购买时分发自定义信号，我们的接收器会监听自定义信号并对收到的每个新信号采取行动。\n\
  \n让我们现在尝试实现一个自定义信号，每当发布新博客时就会始终发送电子邮件：\n\n1.  在 `blog` 应用内部创建一个 `signals.py` 文件（可以命名为任何名称，但最好命名为\
  \ `signals.py` 以便更易于识别）。在 `blog/signals.py` 文件中添加信号的定义：\n\n```\nfrom django import\
  \ dispatch\nnotify_author = dispatch.Signal()\n```\n\n2.  我们希望在发布博客时分发 `blog_published`\
  \ 信号。我们将在 `blogs/public.py` 文件中的 `publish_blog` 方法上添加触发器：\n\n```\nfrom blogs import\
  \ signals\ndef publish_blog():\n    # publish blog logic\n    signals.notify_author.send(sender=None,\
  \ blog_id=123)\n```\n\n3.  我们现在已在发布博客时分发了信号。我们需要在应用程序中添加一个接收器来监听已分发的信号并执行操作。在 `author`\
  \ 应用中创建 `author/receiver.py` 文件：\n\n```\nfrom django.dispatch import receiver\n\
  from blog import signals\n@receiver(signals.notify_author)\ndef send_email_to_author(sender,\
  \ blog_id, **kwargs):\n    # Sends email to author\n    print('sending email to\
  \ author logic', blog_id)\n```\n\n4.  现在，我们需要确保在应用加载时注册接收器。这是[content]\n*   `got_request_exception`\
  \ – 每当 Django 在请求/响应周期中遇到异常时触发\n\n*   **数据库包装器** – 每当 Django 连接到数据库时，这些信号就会被触发。这有助于对\
  \ Django 数据库连接执行任何自定义操作。关于在数据库中设置查询超时的常见用例之一在 *第 2 章* 中进行了讨论。以下 Django 信号在我们建立 DB\
  \ 连接时被分发：\n\n    *   `connection_created` – 每当 Django 服务器与数据库之间建立数据库连接时就会触发\n\n\
