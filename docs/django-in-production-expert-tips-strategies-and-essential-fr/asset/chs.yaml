  2023-10-24 12:56:52    INFO    Environment update completed successfully.\n```\n\
  \n我们的 Django 代码可以连接到数据库。要验证这一点，请打开相同的 Elastic Beanstalk 环境 URL – [`prod-env.eba-e5mff922.ap-south-1.elasticbeanstalk.com/admin`](http://prod-env.eba-e5mff922.ap-south-1.elasticbeanstalk.com/admin)。您应该能够看到与\
  \ *Figure 13**.11* 中显示的相同页面。\n\n如果页面显示 502，则表示 Django 无法连接到 RDS 实例——可能有多种原因。请检查本书\
  \ GitHub 仓库中的 `Troubleshooting` README 部分 [`github.com/PacktPublishing/Django-in-Production/tree/main/Chapter13#troubleshooting`](https://github.com/PacktPublishing/Django-in-Production/tree/main/Chapter13#troubleshooting)。\n\
  \n至此，我们已探索了如何创建新的 RDS 并将其连接到我们的 Django 服务以连接到我们的 RDS 实例的基础知识。现在，让我们学习如何将我们的 Django\
  \ 服务连接到我们的 Redis 服务。\n\n### 创建 ElastiCache Redis 实例并将其连接到 Django\n\nElastiCache\
  \ 为我们提供了一个托管的 Redis 集群，我们可以用它进行缓存和管理 celery 服务的任务队列。在本节中，我们将创建我们的 Redis 集群。我们将使用基本配置来创建\
  \ Redis 服务器。我们将为演示目的创建一个基本集群。为此，请按照以下步骤操作：\n\n1. 进入 ElastiCache 控制台并选择 `Create Redis\
  \ Cluster`。\n2. 在向导中，选择 `Design your own Cluster` 选项。\n3. 选择 `Creating method –\
  \ Cluster Cache` 并选择 `Cluster mode – Disabled` 配置。\n4. 为集群选择一个名称；我们将其命名为 `django-demo-cache`。\n\
  5. 取消选中 `Multi-AZ and Auto-failover`。\n6. 在集群设置中，进行以下更改：\n   1. 将 `Engine version`\
  \ 设置为 `7.0` 或更高\n   2. 将 `Port` 设置为 `6378`\n   3. 将 `Node type` 设置为 `cache.t4g.micro`\n\
  \   4. 将 `Number of replicas` 设置为 `0`\n7. 保持 `Connectivity` 和 `Availability Zone\
  \ placements` 不变。\n8. 在 `Security` 部分，取消选中 `Encryption in transit`。\n9. 打开一个新标签页并进入\
  \ AWS 控制台的 `Security groups` 控制台。然后，创建一个新的安全组，该安全组将附加到 Redis 实例。\n10. 就像 RDS 安全组一样，我们需要创建一个新的入站规则，该规则将公开端口\
  \ `6379`。将 Beanstalk 安全组附加为 `Source – Custom` 并从下拉列表中选择安全组，如 *Figure 13**.20* 所示：\n\
  \n![Figure 13.20: Creating a new security group](img/Figure_13.20_B18867.jpg) \n\
  \nFigure 13.20: Creating a new security group\n\n11. 现在，返回 Redis 向导。然后，在 `Selected\
  \ Security Groups` 部分，选择我们在 *Step 10* 中创建的新安全组。\n12. 现在，选择 `Create` 选项。它需要 5-6 分钟来创建可连接的\
  \ Redis 实例。\n\n一旦 Redis 集群变为 `Available`，选择 `Primary endpoint`，然后使用 Redis 缓存配置 Django\
  \ `.env` 文件：\n\n\n\n\n\n```\nDEBUG=True\nDJANGO_ALLOWED_HOSTS=*\nDB_ENGINE=django.db.backends.postgresql\n\
  DB_NAME=postgres\nDB_USERNAME=django_db_user\nDB_PASSWORD=abc^A12a*12\nDB_HOSTNAME=django-demo.cz2r2xzvhh2n.ap-south\
  \ 1.rds.amazonaws.com\nDB_PORT=5432\nREDIS_HOST=django-demo-\ncache.dysbo0.ng.0001.aps1.cache.amazonaws.com\n\
  REDIS_PORT=6379\n```\n\n我们的代码现在已准备好连接到 ElastiCache Redis 服务器并部署到 Elastic Beanstalk。我们需要将\
  \ Django 设置文件移至 Git 暂存区——这是必不可少的，因为 `eb` CLI 仅会部署 Git 跟踪的代码，或在我们传递 `--stage` 标志时处于暂存状态的代码：\n\
  \n```\n> git add .env\n> eb deploy --staged\nCreating application version archive\
  \ \"app-8e23-231024_202626040031-stage-231024_202626040080\".\nUploading dda/app-8e23-231024_202626040031-stage-231024_202626040080.zip\
  \ to S3. This may take a while.\nUpload Complete.\n2023-10-24 14:56:27    INFO    Environment\
  \ update is starting.\n2023-10-24 14:56:30    INFO    Deploying new version to instance(s).\n\
  2023-10-24 14:56:47    INFO    Instance deployment completed successfully.\n2023-10-24\
  \ 14:56:52    INFO    New application version was deployed to running EC2 instances.\n\
  2023-10-24 14:56:52    INFO    Environment update completed successfully.\n```\n\
  \n### 3. 在浏览器中打开 `/ht/` 端点以验证数据库和缓存连接。在 *图 13.21* 中，我们可以看到当我们的 RDS Postgres 和 ElastiCache\
