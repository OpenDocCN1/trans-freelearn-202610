  # Preface


  Hey there! As the name suggests, Django in Production is a book to help developers
  put their application code into production. In today’s world, coding has become
  a profession that people get into after joining a 3–6 month boot camp. With the
  start-up boom, most of these developers are able to land a job after their boot
  camp course, since they are able to write code and hack any product together. However,
  a couple of months into the job, they want to learn about the best practices and
  understand all the aspects that senior developers in the industry know and perform,
  but most start-ups don’t have many senior developers due to budget and talent scarcity.
  This book is going to give them a too long; didn’t read (TLDR) version of software
  development best practices, which they need to know to get to the next level.


  # Who this book is for


  *This book is for any software developer who understands the basic concepts of Django
  but now needs some help putting their code to production using the right tools,
  or someone who does not have enough guidance to know how to do the work the right
  way. We are assuming you have a basic understanding of how to write code in Django
  and now want to improve **your skills.*


  # What this book covers


  *Chapter 1*, *Setting Up Django with DRF*, covers the basic project setup of Django
  and **Django Rest Framework** (**DRF**). It will also help you to understand the
  fundamentals of APIs and how to design a REST API.


  *Chapter 2*, *Exploring Django ORM, Models, and Migrations*, covers how to integrate
  Django with a database. Django ORM and migrations are powerful features; we learn
  about the core concepts and how to use them efficiently in this chapter.


  *Chapter 3*, *Serializing Data with DRF*, explores the concept of serialization
  and how developers can use DRF serializers to write better application code.


  *Chapter 4*, *Exploring Django Admin and Management Commands*, covers the core concepts
  of Django admin. This chapter covers all the best practices on how to use Django
  admin and create custom Django management commands.


  *Chapter 5*, *Mastering Django Authentication and Authorization*, covers the key
  concepts of authentication and authorization. Django provides authentication and
  authorization out of the box, and we will explain in detail how developers can use
  the built-in features of Django and DRF for authentication.






  *第 6 章*，*缓存、日志记录和节流*，涵盖了缓存的所有概念以及如何将 Redis 与 Django 集成用于缓存。日志记录是生产环境中任何 Web 应用程序的关键组件，在本章中，我们将学习如何将日志记录集成到
  Django 应用程序中。


  *第 7 章*，*使用分页、Django 信号和自定义中间件*，涵盖了 Django 的所有高级概念。开发人员可以使用 Django 信号编写解耦的代码。Django
  还提供了创建自定义中间件的灵活性，这可以帮助开发人员改进功能。


  *第 8 章*，*使用 Celery 与 Django*，展示了如何为 Web 应用程序处理异步任务。在本章中，开发人员将了解如何将 Celery 集成到 Django
  项目中。


  *第 9 章*，*在 Django 中编写测试*，涵盖了为 Django 编写测试用例的核心概念。在本章中，你将学习编写测试用例时应遵循的最佳实践，并了解为项目编写测试用例的重要性。


  *第 10 章*，*探索 Django 中的约定*，展示了在与 Django 协作时使用的所有最佳实践和约定。本章涵盖了许多有主观性的概念，你应将本章作为大纲阅读，并根据自己的判断挑选/学习相关概念。


  *第 11 章*，*Docker 化 Django 应用程序*，涵盖了如何将 Docker 与 Django 应用程序集成。


  *第 12 章*，*使用 Git 和 CI 管道与 Django 协作*，涵盖了版本控制的概念以及如何在 Django 项目中高效使用 Git。在本章中，你将学习如何集成
  GitHub Actions 来创建 CI 管道。


  *第 13 章*，*在 AWS 中部署 Django*，涵盖了如何使用不同的 AWS 服务在生产环境中部署 Django 应用程序。在本章中，你将学习如何在生产环境中部署和扩展
  Django 应用程序。


  *第 14 章*，*监控 Django 应用程序*，涵盖了如何在生产环境中监控 Django 应用程序。生产环境中需要不同类型的监控，例如错误监控、应用程序性能监控、正常运行时间监控等等。在本章中，你将学习如何集成市场上可用的不同工具来监控
  Django 应用程序。


  # 为了充分利用本书


  *你需要对 Django 有基本的了解，并且能够熟练编写基本的 Django 应用程序代码。在本书中，我们将学习 Django 的许多核心概念，你需要能够跟随这些代码示例。我们将介绍许多第三方工具/平台，可能为付费/免费，你需要在此类平台上创建账户并将它们集成到
  `Django project` 中。*


