  # 使用的约定


  本书通篇使用了多种文本约定。


  **正文中的代码**：表示正文中的代码词、数据库表名、文件夹名、文件名、文件扩展名、路径名、虚拟 URL、用户输入和 Twitter 账号。示例：“由于我们指定了
  `DemoViewVersion` 类，此视图将只允许 URL 路径中的 `v1`、`v2` 和 `v3` 版本；路径中任何其他版本将得到 `404` 响应。”


  代码块如下所示：

  ```

  urlpatterns = [

      ...

