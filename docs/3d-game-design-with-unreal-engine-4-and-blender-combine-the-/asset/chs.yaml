  ## 为什么要订阅？\n\n*   可在 Packt 出版的每本书中进行全文搜索\n*   复制粘贴、打印和书签内容\n*   按需访问，可通过 Web 浏览器访问\n\
  \n近年来独立游戏开发呈爆发式增长，许多开发者正在寻找强大且低成本的工具，以便将他们的梦想游戏推向市场。\n\nBlender 是一款被全球开发者使用的强大开源\
  \ 3D 软件包；它以易用性和活跃的社区而闻名。Unreal Engine 4 是由 Epic Games 打造的惊人 3A 游戏引擎，已成为众多大大小小游戏开发者的首选。\n\
  \n在本书中，我们将探讨如何利用 Blender 为 Unreal Engine 4 创建动态和静态游戏美术资源，以及如何将这些资源导入到我们自己的项目中。\n\
  \n### 本书内容涵盖\n\n第 1 章，*Unreal, My Friend, I'd Like You to Meet Blender*（虚幻啊，我的朋友，我想让你认识一下\
  \ Blender），将指导您安装和设置 Blender 3D 软件包。我们将讨论 Blender 的界面和工具，并开始我们的第一个项目。\n\n第 2 章，*Starting\
  \ Our First Project*（开始我们的第一个项目），带我们进入 Unreal Engine 4，开始设计项目的第一个关卡。我们将回顾一些关卡设计基础，并搭建一个供未来游戏美术资源存在的游戏关卡。\n\
  \n第 3 章，*It's Time to Customize!*（是时候进行定制了！），将让我们在 Blender 中开始创建第一个游戏资源——用于货轮关卡的太空时代货箱。我们将介绍基本建模技术，并讨论游戏资源的\
  \ UV 展开和贴图流程。\n\n第 4 章，*Getting the Assets to the Level*（将资源导入关卡），将讨论从 Blender 导出货箱并将其导入\
  \ Unreal 的流程，以便我们在货轮关卡中使用它。\n\n第 5 章，*Taking This Level Up a Notch*（让关卡更上一层楼），将让我们从货轮转向构建空间站关卡，包含完整的脚本事件以丰富玩家的情感体验。我们将探讨蓝图中更高级的脚本技术，并准备关卡以接收更高级的游戏资源。\n\
  \n第 6 章，*Monster Assets – The Level Totally Needs One of These*（怪物资源——关卡完全需要一个这样的东西），将带我们完成创建更高级游戏资源——神器的设计流程。我们将了解更多\
  \ 3D 建模工具，您将明白如何从多个组件构建游戏资源。\n\n第 7 章，*Let's Dress to Impress!*（让我们盛装以赴！），将带我们完成构成神器的所有不同部件的\
  \ UV 展开过程。我们将了解 Blender 中一些高级 UV 工具。您还将学习如何利用 Substance Painter 创建令人惊叹的纹理和材质。\n\n\
  第 8 章，*Lights, Camera, Animation!*（灯光、摄像、动画！），带我们回到 Blender 为神器创建动画。我们将讨论将动画导入 Unreal\
  \ Engine 4 的要求，以及在 Blender 中使用骨骼和绑定。\n\n第 9 章，*Bang Bang – Let's Make It Explode*（砰砰——让它爆炸吧），以创建视频游戏爆炸效果（使用声音、粒子特效和飞散碎片）作为全书的结尾。我们将通过将游戏资源导入\
  \ Unreal Engine 4 并设置其爆炸来庆祝资源的完成！\n\n### 阅读本书所需条件\n\n阅读本书需要以下硬件和软件：\n\n*   台式电脑或\
  \ Mac\n*   Windows 7 64 位或 Mac OS X 10.10 或更高版本\n*   四核 Intel 或 AMD 处理器，2.5 GHz\
  \ 或更高\n*   NVIDIA GeForce 470 GTX 或 AMD Radeon 6870 HD 系列显卡或更高版本\n*   8 GB 内存\n\
  *   一个三键鼠标\n*   Unreal Engine 4.9 或更高版本\n*   Blender 2.76 Release Candidate 3 或更高版本\n\
  *   Substance Painter 1.7 30 天免费试用版或更高版本\n\n本书提到的所有软件均免费，可从互联网下载。\n\n### 适读人群\n\n\
  本书非常适合想要创建惊人的 3D 游戏环境，并利用 Blender 与 Unreal Engine 4 的强大功能相结合的 3D 艺术家和游戏设计师。掌握 3D\
  \ 设计基础知识对于充分利用本书是必要的。有 Blender 使用经验会有帮助，但非必需。\n\n### 约定\n\n在本书中，您将看到多种文本样式，用于区分不同类型的信息。以下是这些样式的示例及其含义说明。\n\
