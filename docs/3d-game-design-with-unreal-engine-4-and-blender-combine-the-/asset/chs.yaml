  \ `Errata` 部分下。\n\n### 盗版\n\n互联网上的版权材料盗版是所有媒体持续面临的问题。Packt 非常重视版权和许可证的保护。如果您在互联网上以任何形式发现我们作品的非法副本，请立即向我们提供位置地址或网站名称，以便我们采取补救措施。\n\
  \n请通过 版权邮箱 联系我们，并附上涉嫌盗版材料的链接。\n\n感谢您帮助保护我们的作者，以及我们为您带来有价值内容的能力。\n\n### 问题\n\n如果您对本书的任何方面有疑问，可以通过\
  \ 问题邮箱 联系我们，我们将尽最大努力解决问题。\n\n作为游戏开发者，我们都有自己的梦想游戏——那款让我们兴奋不已、历经多年仍萦绕心头的游戏。对一些人来说，这意味着等待另一位游戏开发者构建类似的东西，但他们的版本永远无法完全匹配我们自己的设想。对我们大多数人来说，想要看到这款游戏诞生并亲自游玩的渴望，成为了我们开启独立游戏开发生涯的催化剂。当我们构建梦想、将心血倾注于游戏开发时，我们仍希望能在当今的游戏市场与大厂竞争，但我们没有资金购买“3A”级游戏引擎和高端\
  \ 3D 软件包的商业许可证。几年前，这一切因 `Unreal Engine` 等大型 3D 游戏引擎向独立开发者免费开放而改变。现在，小型开发者拥有了与大型开发者同等的高端工具访问权限。这些新游戏引擎赋予了我们构建梦想游戏的能力。然而，3D\
  \ 艺术软件从未真正跟进。许多行业标准创作套件（如 `Autodesk 3ds Max`）仍要花费数千美元。这种情况在 2002 年随着 `Blender Foundation`（一个致力于支持\
  \ Blender 的非营利组织）的成立而改变。Blender 是一款开源 3D 创作软件，允许像我们这样的小型开发者在商业项目中使用自己的艺术作品，而无需预先投入巨资。我们终于可以创作梦想中的\
  \ 3D 游戏，而无需为如何支付工具费用而焦虑。\n\n这就是您来到这里的原因。也许您已经是使用最新版 `Unreal Engine 4` 的独立开发者，但仍只使用他人创建的游戏资产。也许您是一位完全的新手，脑海中充满了待创建的惊人数字景观。无论哪种情况，本书都适合您。在接下来的章节中，我们将探讨如何结合使用\
  \ Blender 和 `Unreal Engine 4` 为您的游戏创建自定义关卡和游戏内容。\n\n在本章中，我们将涵盖以下主题：\n\n*   安装 Blender\n\
  *   探索界面\n*   自定义设置\n*   使用模式\n*   进入第一个项目\n*   在 `Unreal Engine 4` 中开始\n\n# 安装\
  \ Blender\n\n我们开发旅程的第一步始于 [Blender 官网](http://www.blender.org)，即 `Blender Foundation`\
  \ 的在线主页。在这里，您可以了解 Blender 的历史，与社区交流，访问培训视频等。我鼓励您有空时查看该网站，因为它提供了丰富的资源。例如，每当软件有重大更新时，也会发布一部动画短片。这些影片不仅娱乐性强，还展示了工具集的能力。\n\
  \n以下是下载 Blender 的步骤：\n\n1.  访问 [Blender 官网](http://www.blender.org/)。\n2.  点击右侧标记为\
  \ `Download Blender 2.76-rc3` 的按钮（撰写时的当前版本）：\n    ![安装 Blender](img/BO5189_01_01.jpg)\n\
  \    点击下载按钮获取最新版本的 Blender\n3.  Blender 是跨平台软件。为您的操作系统选择 64 位或 32 位镜像。大多数情况下，您的计算机将是\
  \ 64 位：\n    ![安装 Blender](img/BO5189_01_02.jpg)\n    点击离您最近且与您的操作系统对应的下载链接。大多数用户需要\
  \ 64 位版本，但如果您的内存少于 8 GB，应使用 32 位版本\n4.  下载完成后点击 `Installer`。\n5.  按照安装提示操作。它们非常简单，不需要额外配置。\n\
  \n一切安装完成后，请运行程序。您将看到启动画面。现在让我们看看界面。\n\n# 探索界面\n\n运行 Blender 时，您会看到启动画面。左侧会列出您最近处理过的文件，以及一些快速链接，指向文档、网站等各种内容。点击启动画面两侧的空白区域可将其关闭。现在让我们看看默认场景。\n\
  \nBlender 默认在场景中提供三个基本对象：一个立方体、一盏灯和一台摄像机，如下截图所示：\n\n![探索界面](img/BO5189_01_03.jpg)\n\
  \n我们的 Blender 默认设置。我们将对其进行更改以更好地配合 `Unreal 4` 工作\n\n通过右键点击对象来选择任意一个。这会将其高亮显示为橙色。尝试右键点击场景中的其他对象：\n\
  \n![探索界面](img/BO5189_01_08.jpg)\n\n我们可以通过按住中键（`MMB`）绕中心旋转视角。我们可以通过按住 `Shift` + `MMB`\
  \ 平移视角，并使用鼠标滚轮或小键盘上的 `+` 和 `-` 进行缩放。最后，小键盘也可用于查看物体的特定角度。\n\n现在让我们看看菜单：\n\n![探索界面](img/BO5189_01_04.jpg)\n\
  \nBlender 界面\n\n1.  **菜单栏**\n2.  **工具面板**\n3.  **动画时间轴**\n4.  **属性**\n5.  **场景属性**（如果未看到此菜单，请按\
  \ `N`）\n6.  **场景大纲**\n\n所有上述选项都有多种功能。我们将在此简要讨论，并在项目继续时深入探讨：\n\n*   **菜单栏**：包含 `File`、`Render`、`Window`、`Help`、`Scene\
  \ Layout` 下拉菜单、`Browse Scene` 下拉菜单和 `Render Engine` 下拉菜单选项。在大多数情况下，我们将使用 `File`\
  \ 菜单来保存、加载、更改用户偏好设置、导出文件和退出程序。\n*   **工具面板**：包含我们将用于编辑形状和塑造创作的大多数功能。\n*   **动画时间轴**：我们稍后将使用它来管理动画游戏资产。\n\
  *   **属性**：我们将频繁使用此面板来编辑场景属性、添加修改器等。\n*   **场景属性**：包含一些与场景中项目相关的特定功能，如缩放。\n\n\n\n\
  *   **场景大纲视图**：这是我们场景中每个对象的便捷列表，如果你在视觉上找不到特定对象时非常有用。虚幻引擎也有一个类似的功能。\n\n信息量很大，对吧？相信我，多练习就会变容易。为了让事情更简单，让我们自定义一些设置。\n\
  \n# 自定义你的设置\n\n如果不自定义一些设置，使用 Blender 会有点麻烦，特别是如果你有其他 3D 软件的使用经验。当我们开始在界面中移动视角时，你可能立刻就注意到了，如果你左键点击，会移动那个小靶心光标。这被称为\
  \ 3D 游标，实际上在 Blender 中有很多用途，比如确定放置新 3D 形状的位置。现在，左键点击移动这个游标并不理想，而且当你尝试选择 3D 场景中的物体时，很容易忘记这个设置，但我们可以更改它。\n\
  \n点击屏幕左上角的**文件**，然后选择**用户偏好设置**。选择**输入**选项卡，沿着左侧向下查找，直到看到**选择方式**选项。你可以看到它当前设置为右键选择物体。让我们将其改为**左键**，使其更符合虚幻引擎\
  \ 4 的操作习惯。这能避免你在两个程序之间切换时产生很多困惑。确保在做完更改后，点击左下角的**保存用户设置**按钮。第二个需要更改的设置涉及缩放。\n\n\
  下面的截图显示了 **Blender 用户偏好设置** 窗口：\n\n![自定义你的设置](img/BO5189_01_05.jpg)\n\n设置鼠标选择使用左键\n\
  \n要更改下一个设置，我们要看看**属性**面板。窗口看起来大概像这样：\n\n面板顶部有几个小标签。我们要找的是**场景**标签，由这个图标表示：\n\n![自定义你的设置](img/BO5189_01_06.jpg)\n\
  \n设置鼠标选择使用左键\n\n此面板允许我们更改与场景相关的几个选项，例如缩放。虚幻引擎 4 默认使用厘米作为度量单位，所以我们要在这里匹配该设置。这将使我们的游戏资产能直接适配关卡，而无需在游戏引擎中缩放它们。请遵循以下步骤：\n\
  \n1.  将使用的单位从**无**更改为**公制**。\n2.  将缩放比例改为 `0.01`。\n3.  场景中已有的物体（如我们的立方体）不会缩放。如果有任何你想保留的物体，将其缩放\
  \ `100` 倍。这可以通过点击左侧的**缩放**按钮，输入 `100`，然后按 `Enter` 键来完成。\n4.  这会导致物体开始穿透网格边缘。要修复此问题，我们按\
  \ `N` 打开**场景属性**栏，找到**视图**部分，然后是**裁剪**部分，最后将**结束**属性改为 `1km`。\n\n### 提示\n\n提示：通过**添加**菜单放入的某些物体可能不会被适当缩放。将这些物体缩放\
  \ 100 倍可以解决该问题。\n\n现在我们已经做了这些更改，通过**文件**菜单或按 `Ctrl` + `S` 保存你的文件。\n\n# 使用模式\n\n\
  Blender 还有一个我们还没提到的菜单。这是位于 3D 视图底部的一个小菜单栏，看起来如下所示：\n\n![使用模式](img/BO5189_01_07.jpg)\n\
  \n3D 视图底部的菜单栏。我们会经常用到它！\n\n它包含**视图**、**选择**、**添加**和**物体**菜单。它还包含模式下拉菜单。我们将在本书中使用许多不同的模式，但我们将花费大部分时间在**编辑**模式中。此模式允许我们推拉基本形状来创建新模型。Blender\
  \ 允许我们通过按 `Tab` 键在**物体**模式（默认模式）和**编辑**模式之间轻松切换。这只有在你场景中选中了一个可编辑的物体时才有效。你会注意到当你更改模式时，许多菜单都会发生变化。当我们在\
  \ 第 3 章 *是时候自定义了！* 中创建第一个物体时，我们将进一步探索这一点。\n\n### 提示\n\n提示：看起来我似乎跳过了大量信息。Blender\
  \ 的菜单包含的内容远超我能在本书一章中解释的范围，我不想用不必要的信息拖慢你的进度。如果你很好奇，可以看看 Gordon Fisher 所著的 *Blender\
  \ 3D Basics Beginner's Guide*（第二版），以获取更完整的描述。\n"
- "# 开始我们的第一个项目\n\n本书分为两个项目，我们将在 Blender 中创建自定义游戏资产，并将它们添加到在虚幻引擎 4 中构建的关卡中。第一个项目将是一个基础关卡，我在\
  \ 10 年的教学经验中教过许多学生创建：两个由走廊连接的房间，带有一些楼梯、功能性的门和一个电梯。虽然关卡本身不复杂，但我们将从构思、原型到最终产品，走完整个设计流程。稍后在本书中，我们将使用这个相同的流程来设计一个更复杂的关卡。关卡本身将以科幻恐怖主题为设计思路。拥有一个主题将统一这两个关卡，并在设计自定义关卡资产时给我们一个可遵循的美术风格。\n\
  \n那么，如何从零开始设计关卡？我们的流程将遵循几个不同的步骤：\n\n1.  所有美好的事物都始于纸上。艺术家用草图开始构思。建筑师有蓝图。关卡设计师用地图草图开始他们的关卡。我推荐使用方格纸。我们也将用草图开始我们的自定义游戏资产。\n\
  2.  在关卡编辑器中使用基本形状开始布局关卡。编写游戏流程脚本。测试关卡，看布局是否适合玩家。这被称为白盒测试，或搭建关卡框架。本质上这是一个关卡原型。\n\
  3.  一旦你的白盒关卡达到预期，利用搭建出的尺寸开始创建和添加游戏资产。这使我们能在 Blender 中制作尺寸正确、能正确填充关卡空间的资产。\n4.  添加游戏资产，调整光照，并添加特效。\n\
  5.  不要忘记在每一步都进行游戏测试，并收集玩家的意见！\n\n现在让我们在虚幻引擎 4 中启动项目。\n\n# 在虚幻引擎 4 中开始工作\n\n在开始使用虚幻引擎之前，请确保你已安装\
  \ **Epic Games Launcher**。可在 [`www.UnrealEngine.com/`](https://www.UnrealEngine.com/)\
  \ 免费获取，点击页面右上角的 **Get Unreal** 按钮即可下载。系统会要求你创建一个账户，启动器运行时会询问该信息。\n\n接下来，点击屏幕左侧的**库**按钮。在标记为**引擎版本**的部分，点击版本\
  \ 4.9.2（撰写时的最新版本）上的**启动**。如果没有可见的引擎，选择**添加版本**并按提示操作：\n\n![在虚幻引擎 4 中开始工作](img/BO5189_01_09.jpg)\n\
  \nEpic Games Launcher。点击虚幻引擎标签下的库将显示你拥有的引擎版本以及当前项目\n\n引擎加载完成后，将显示你正在处理的所有项目。对于这个项目，让我们创建一个新项目。点击顶部的**新建项目**标签，如下截图所示：\n\
  \n![在虚幻引擎 4 中开始工作](img/BO5189_01_10.jpg)\n\n新建项目标签\n\n\n\n此时，Unreal 为您提供了几个选择。引擎附带许多免费的入门项目，帮助您开始多种不同类型的项目。对于我们的项目，我们将使用\
  \ `First Person` 入门项目。确保 `Starter Content` 按钮显示为 `With Starter Content`，并为项目指定一个不含空格的唯一名称。准备就绪后，点击右下角的\
  \ `Create Project`。Unreal Engine 4 将加载，然后我们就可以开始制作关卡了。\n\n# 总结\n\n本章中，您了解了将用于实现关卡构想的工具。Blender\
  \ 是一款免费开源的创作套件，支持整个资产开发流程。Blender 使用 `Python` 编程语言创建，灵活性足以在几乎任何机器上运行，且完全跨平台；可在 Windows、Mac\
  \ 或 Linux 上运行。接着，您了解了将使用的设计流程，以及 Blender 和 Unreal Engine 4 如何融入其中。最后，您设置了 Unreal\
  \ 以开始我们的第一个项目。进入下一章时，您将构建第一个关卡，它将容纳您的第一个原创游戏资产。您能感受到兴奋吗!?\n\n## 规划您的关卡\n\n现在到了令人兴奋的环节！在推进第一个项目的构建过程中，我们将使用上一章讨论的设计流程，从关卡草图开始。您可能会忍不住直接打开\
  \ Unreal 就开始干，对吧？既然我能构建梦寐以求的精彩关卡，为什么要花时间画图呢？好吧，理由如下。避免多次修改和在重做关卡部分上浪费昂贵时间的最佳方法是提前规划。确定关卡的设定、建筑、背景和故事。考虑一下在哪里放置故事线索和道具。让朋友、玩家和团队成员过目您的想法。融合收到的反馈，然后构建关卡。这相当于关卡设计师的“三思而后行”（原谚语为“量两次，切一次”）。\n\
  \n### 关卡草图\n\n让我们看看我们的关卡草图：\n\n![开始我们的第一个项目](img/BO5189_02_01.jpg)\n\n#### 关卡概览\n\
  \n这就是我们的第一个关卡。关卡本身相当基础。我们有两个由走廊连接的房间，还有一些通往二层的楼梯。完成基本布局后，我们可以在一侧添加一个货梯和供玩家互动的工作门。我尝试以小型货船的形式布局关卡，以契合我们科幻恐怖游戏的主题。该关卡将作为设定的介绍，也是将玩家带入我们稍后将构建的闹鬼空间站环境的一种方式。\n\
  \n### 本章主题\n\n本章将涵盖以下主题：\n\n*   使用 Unreal 的 `Content Browser` 构建关卡\n*   使用不同类型的光源\n\
  *   使用 `Triggers` 和 `Blueprints` 添加交互元素\n*   测试我们的关卡\n\n# 使用内容浏览器开始构建关卡\n\n请打开 `Epic\
  \ Games Launcher`，并调出我们在上一章末尾创建的项目。Unreal Engine 4 相比引擎的上一版本是一次巨大的升级，因为它为用户提供了简单的拖放界面。这是通过界面中的两个重要面板实现的：`Modes`\
  \ 面板和 `Content Browser`。这些界面部分允许关卡设计师将元素拖入关卡并放置在需要的位置。在这两者中，我们将最多地使用 `Content Browser`：\n\
  \n![使用内容浏览器开始构建关卡](img/BO5189_02_02.jpg)\n\n`Content Browser` 包含我们将使用的所有游戏资产。\n\n\
  `Content Browser` 存放了创作中可用的所有对象、声音、材质和粒子。这些资源被分类到文件夹中，这些文件夹反映了项目存储位置的文件结构。Unreal\
  \ 这样做是为了在需要时方便移动项目文件。浏览器导航很简单。双击文件夹即可打开，而面板顶部显示的面包屑导航可以点击以返回之前的选择。我还喜欢开启来源面板；这使得导航和查找特定文件更容易。创建项目时，我们让\
  \ Unreal 包含 `Starter Content` 文件夹。该文件夹包含许多供我们入门的基础内容，例如各种基本形状、建筑部件、材质等。有了这些，我们可以开始对设计进行白盒搭建。\n\
  \n首先创建第一个房间：\n\n![使用内容浏览器开始构建关卡](img/BO5189_02_03.jpg)\n\n我们项目的第一个房间。\n\n### 提示\n\
  \n提示：接下来，我们将开始在 Unreal 中构建关卡。本书假设读者具备使用 Unreal Engine 4 的基本知识。如果您在跟随操作时遇到问题，请查看\
  \ YouTube 上的 `UnrealEngine` 频道，那里有来自 Epic Games 的一些很棒的入门教程。网址为 <https://www.youtube.com/channel/UCBobmJyzsJ6Ll7UbfhI4iwQ/>.\n\
  \n要开始构建第一个房间，我们将利用 `Architecture` 文件夹中的资产。利用其中的地板、墙壁和门，我们将组装设计中的第一个房间：\n\n1.  首先，在我们的项目中创建一个新关卡。点击顶部的\
  \ `File` 菜单，选择新建关卡。在出现的对话框中选择 `Empty Level`。\n\n2.  新关卡什么都不包含。非常适合我们的太空之旅！放入一个 `Floor_400x400`\
  \ 部件作为起点。这是通过从 `Content Browser` 点击拖拽部件到关卡中完成的。转到细节面板，确保其位置设置为 `x=0 y=0 z=0`。这将使对齐其他部件变得容易。\n\
  \n3.  复制地板五次。按住 `ALT` 并移动对象即可轻松创建副本。将它们排成 2x3 的矩形，形成一个大小合适的房间。\n\n4.  接下来，获取一些墙壁。将一个\
  \ `Wall_400x300` 拖入关卡，放在您的一个地板部件上方：\n\n    ![使用内容浏览器开始构建关卡](img/BO5189_02_04.jpg)\n\
  \n    有时我们使用四窗口视图来对齐静态网格体。\n\n5.  我们将使用四视口视图来对齐墙壁部分。在视口的右上角，有一排图标控制着网格吸附、角度吸附、缩放吸附和相机速度等项目。那些图标的最右侧是一个最小化/最大化按钮。点击它以显示四个视口。利用其中两个视口，将墙壁部分与地板的一个角落对齐。\n\
  \n6.  复制墙壁部分，并使用 `Move` 和 `Rotate` 工具将空间封闭起来。\n\n7.  最后，拿取地板部件将其作为屋顶，封闭空间以完成房间。\n\
  \n\n\n# 关卡构建演练\n\n## 添加灯光和玩家起始点\n\n此时，你肯定迫不及待想进入关卡，在新房间里跑一圈。然而，要测试我们的关卡，我们需要添加几样东西：灯光和玩家起始点。为了测试目的，让我们放入几个\
  \ `PointLights`。前往屏幕左侧的 `Modes`（模式）面板，将两个 `PointLights` 拖入你的房间。同样，使用四视口配置确保它们位于你想要的位置。其次，从同一面板拖入一个\
  \ `PlayerStart`。`PlayerStart` 从其中心伸出一支箭头。那指示了玩家生成时面朝的方向。始终尝试将 `PlayerStart` 指向你希望玩家最初前进的方向。这能确保玩家从一开始就投入游戏，并能以最小的困惑享受你的创作。最后，我们需要保存文件（使用\
  \ `File` 菜单或 `Ctrl` + `S`），并使用 `Build`（构建）按钮构建关卡。\n\n### 提示：构建按钮\n\n`Build` 按钮会烘焙灯光并最终确定所有关卡更改。这能让你最直观地了解灯光效果，也是测试游戏\
  \ AI 和其他功能的重要环节。在测试前构建关卡是个好习惯。\n\n## 测试关卡\n\n在构建过程中测试关卡是设计流程的重要组成部分。通过测试，你可以发现关卡是否存在缺陷或问题，并在情况变得过于复杂之前修复它们。要测试关卡，请按\
  \ `Play`（播放）按钮。这将在当前视口启动一个游戏会话，让你在关卡内跑动。如果你点击 `Play` 按钮旁边的小下拉箭头，将会看到打开其他类型游戏窗口的选项，例如\
  \ `New Editor Window`（新编辑器窗口）。能看到完整的游戏画面会很有帮助。现在测试关卡，确保所有东西都正确对齐。一旦你对第一个房间感到满意，让我们构建其余的设计：\n\
  \n![Using the Content Browser to start building the level](img/BO5189_02_05.jpg)\n\
  \n向灰盒关卡添加尽可能多的细节是个好习惯，这样你就能对最终设计的样子有个好印象。\n\n## 构建走廊\n\n现在让我们构建走廊。我们可以通过复制关卡中的现有部件轻松构建走廊。我还将展示如何在不删除的情况下替换关卡中的部件：\n\
  \n1. 选择第一个房间中的一个地板部件。复制它，并将其对齐到你想要放置通往走廊空间的门口的位置。\n\n2. 进入 `Content Browser`（内容浏览器）并选择\
  \ `Wall_Door_400x300`。我们将用这个部件替换其中一个墙壁部分。现在在视口中选择你想要替换的墙壁部件。右键点击它，从菜单中选择 `Replace\
  \ Selected Actors with Wall_Door_400x300`（用 Wall_Door_400x300 替换选中的 Actor）：\n\n\
  \    ![Using the Content Browser to start building the level](img/BO5189_02_06.jpg)\n\
  \n    用包含门的墙替换我们的墙壁静态网格体\n\n    这将把现有的静态网格体替换为我们选中的那个，并加入一个尺寸完美的门口。\n\n3. 再复制两次地板部分以延长走廊。别忘了确保所有部件都与现有地板正确对齐。\n\
  \n4. 复制一个墙壁部分并添加到走廊。再复制几次以封闭走廊的长度。\n\n5. 最后，复制地板以创建天花板并封闭走廊，并在里面添加一盏灯。\n\n### 提示：快速添加灯光\n\
  \n请记住，灯光可以像其他对象一样被复制。另一种快速添加 `PointLight` 的方法是按住 `L` 键，然后点击你想放置灯光的位置。\n\n构建关卡并测试一下。如果走廊感觉不够长，再添加几个部分。一旦你对目前的关卡手感满意，保存文件。现在让我们添加最后一个房间：\n\
  \n![Using the Content Browser to start building the level](img/BO5189_02_07.jpg)\n\
  \n## 构建货舱\n\n正在构建货舱\n\n对于这个房间，我们将向设计中添加一些垂直元素。我们还将构建楼梯和电梯以到达上方的走道，开始吧：\n\n1. 就像之前的添加一样，让我们从走廊复制一个地板部件并将其与门口对齐。这将是新房间的起点。这个房间将比上一个大，所以让我们在每个方向上各复制两次新地板部分，形成一排五个地板部件。\n\
  \n2. 现在按住 `Ctrl` 并点击每个部件，选择那一排的所有地板部件。复制这一行四次以创建我们的大房间：\n\n![Using the Content Browser\
  \ to start building the level](img/BO5189_02_08.jpg)\n\n通过复制墙壁创建二层\n\n3. 从走廊复制一个墙壁部分到我们的房间，并用它封闭整个空间，就像我们在走廊里做的那样。现在选择所有那些墙壁部件并复制它们。将这些部件放在原件顶部以创建二层：\n\
  \n![Using the Content Browser to start building the level](img/BO5189_02_09.jpg)\n\
  \n复制一楼部分用于天桥\n\n4. 现在让我们为二楼创建天桥。向房间后方复制一个地板部件。将其与墙顶对齐。\n\n5. 在 `Details`（细节）面板中，找到\
  \ `Scale`（缩放），在绿色框中输入 `0.7`。这将沿 `Y` 轴缩放地板部件，减小天桥的宽度：\n\n![Using the Content Browser\
  \ to start building the level](img/BO5189_02_10.jpg)\n\n使用俯视图复制天桥地板部分\n\n6. 沿着房间外侧复制走道部件，创建一个\
  \ U 形区域。这将为楼梯和电梯留出空间：\n\n![Using the Content Browser to start building the level](img/BO5189_02_11.jpg)\n\
  \n创建螺旋楼梯以便玩家进入二楼\n\n7. 该做楼梯了！从模式面板的 `BSP` 菜单中添加一个 `Curved Staircase`（弧形楼梯）。将其与我们的角落对齐，以便连接走道。然而，默认楼梯高度不够。我们可以在\
  \ `Details` 面板中调整楼梯，通过修改 `Num Steps`（阶梯数量）选项来修复。我们可以通过调整 `Step Width`（阶梯宽度）选项来调整楼梯尺寸。适合我的设置是\
  \ `Num Steps`：`15` 和 `Step Width`：`275`。\n\n8. 我们的最后一个功能是添加电梯所需的部件：\n\n![Using the\
  \ Content Browser to start building the level](img/BO5189_02_12.jpg)\n\n开始布局电梯组件\n\
  \n对于电梯，我复制了一个地板部件并将其移动到与上方走道对齐的位置。我上下移动几次以确保它合适，然后将其放在下降位置的地板上。我们将在本章后面为这个部件制作动画，使电梯运作。\n\
  \n9. 从 `Architecture`（建筑）文件夹获取一个 `Pillar_50x500` 部件并将它们围绕电梯排列，完成。\n\n### 提示：设置默认地图\n\
  \n你是否断断续续地在这个关卡上工作，并希望默认打开这个关卡而不是示例？前往 `Edit`（编辑）菜单并选择 `Project Settings`（项目设置）。选择\
  \ `Maps & Modes`（地图与模式），将 `Game Default Map`（游戏默认地图）和 `Editor Starter Map`（编辑器启动地图）更改为你的关卡文件。\n\
  \n\n\n# 为关卡添加装饰元素\n\n现在我们已经在关卡中设置了基本的关卡几何体，让我们思考一下还可以添加哪些更具装饰性的元素来帮助强化主题。科幻关卡有多种不同的风格。有些环境可能简洁明了，就像《星际迷航》宇宙中的那样。其他的可能更偏向工业风，到处都是管道和线缆，就像我们在《异形》系列中看到的那样。关卡的美学可以用来强化环境的主题并向玩家传达信息。在本例中，我们想要强化生存恐怖的氛围。为此，我将更多地倾向于工业风格。收集参考美术来帮助激发你的物品摆放灵感，可以帮助你获得正确的感觉，我强烈建议你在网上查看一些图片以获取优秀的范例。请记住，这些道具只是稍后可以创建的美术资源的占位符。准备好了吗？让我们开始制作第一个房间：\n\
  \n1.  前往 `Starter Content` 文件夹中的 `Shapes` 文件夹。该文件夹包含许多基本形状，将有助于近似表示可在 Blender 中为该关卡创建的不同道具。\n\
  \n2.  拿一个 `Shape_Cylinder` 并将其拖入房间。我设想这个第一个房间是我们小型货船的舰桥，而圆柱体可以作为飞船驾驶的平视显示器的全息投影仪。我在它上面添加了一个\
  \ `Shape_TriPyramid` 并将其缩小了一些，使其看起来更有科技感。\n\n3.  添加几个 `Shape_Cube` 并缩放它们，使其看起来像控制台。这使我们能够近似实际要制作的\
  \ 3D 模型的尺寸。\n\n4.  使用 `Shape_Pipe`、`Shape_Pipe_90` 和 `Shape_Pipe_180` 部件，在房间周围添加一些管道以增加细节。在方形空间中，一个好的经验法则是向角落添加细节以掩盖房间是方形的事实。这会让空间更有趣并提供视觉多样性。\n\
  \n5.  使用 `Shape_Trim`、`Shape_Trim_90_In` 和 `Shape_Trim_90_out` 部件，在地板和墙壁相接的地方添加一些装饰条。完成后，选择所有装饰条部件，复制它们，并将它们翻转过来，以装饰墙壁与天花板相接的区域。\n\
  \n6.  `Props` 文件夹包含几个完成的部件供我们使用，这与我们稍后在本书中将使用 Blender 制作的部件类似。拿几把椅子添加到我们的舰桥上，靠近我们的“电脑控制台”占位符形状。\n\
  \n7.  再次使用 `Shape_Cube` 部件，为后墙和侧墙增加一些变化。\n\n## 舰桥白模\n\n这是我完成的舰桥白模：\n\n![使用内容浏览器开始构建关卡](img/BO5189_02_13.jpg`)\n\
  \n*最终的舰桥白模*\n\n## 货舱白模\n\n这是我完成的货舱白模：\n\n![使用内容浏览器开始构建关卡](img/BO5189_02_14.jpg`)\n\
  \n*货舱最终白模*\n\n它开始让人感觉更像一个环境了吗？如果没有，再添加一些形状或道具，直到你的关卡感觉更自然。但是，不要过度。我们希望关卡中有一些物体来传达故事并让玩家沉浸在我们的环境中。我们不希望关卡过于拥挤，让人感觉笨重和杂乱。花些时间为走廊和第二个房间添加一些细节。在下一节中，我们将着眼于如何根据我们的主题为关卡打光。\n\
  \n# 使用不同类型的光照\n\n在整个关卡中，我们一直在使用基础灯光，只是为了给我们的进行中的工作提供一些照明。在本节中，我们将把灯光转变为更符合我们主题且能向玩家传达主题的东西。适当的灯光对于使场景或环境显得可信非常重要。它可以让观众感到焦虑或恐惧，并营造紧张感。它可以传达危险或安全。在游戏中，它甚至可以成为一种游戏机制。在我们的场景中，我们将利用灯光来传达一种神秘感和一种张力，即可能有事情正在玩家视野之外发生。\n\
  \n要创造这种感觉，让我们思考一下可能需要什么。将角落沉浸在阴影中并限制玩家的视线，可以在很大程度上让他们觉得可能有东西正在视线之外潜伏着他们。使用不同颜色的灯光来表示危险和安全，可以向玩家传达这些信息，从而产生或缓解张力。就像我们之前收集网上的图片来帮助物品摆放一样，其他游戏的图片，尤其是现实生活中的图片，可以帮助你找出适合你关卡的正确灯光。Unreal\
  \ 提供了几种不同类型的灯光来帮助我们实现这些目标。`PointLights` 是我们已经熟悉的一种灯光类型。它们从空间中的固定点向所有方向投射光线。接下来是\
  \ `SpotLights`。这些灯光以锥形向目标点投射光线。这可以用来突出环境中的特定事物。最后，我们有 `DirectionalLights` 和 `SkyLights`。这些是大型光源，可在整个关卡中创建统一的光照量。`DirectionalLights`\
  \ 通常用于在室外环境中创建太阳或月亮。对于每种类型的灯光，`Details` 面板都提供了多个选项来调整强度、阴影、衰减和颜色。准备好为我们的环境添加一些情感了吗？\n\
  \n1.  让我们通过删除每个房间中除一盏灯以外的所有灯光来开始我们的灯光制作过程。这将使我们能够从非常基础的东西开始。别忘了在进行灯光更改后构建关卡。这允许\
  \ Unreal 处理阴影的变化，并让你准确地看到你的更改。\n\n2.  选择靠近 `PlayerStart` 的灯光。我们小飞船的舰桥区域是玩家的起始位置，应该感觉至少比飞船的其他地方稍微安全一些：\n\
  \n    ![使用不同类型的光照](img/BO5189_02_15.jpg`)\n\n    *为舰桥创建绿色灯光*\n\n3.  将灯光的颜色改为淡绿色。这是通过选择灯光并点击\
  \ `Light Color` 选项来完成的。这将弹出一个色轮，允许你为灯光选择新颜色。\n\n4.  在默认级别下，灯光对于我们的目的来说太亮了。在细节面板中，找到\
  \ `Intensity` 属性并输入一个较低的值。我将我的灯光设置为 `250`。\n\n5.  灯光具有一个影响区域，由一个称为 `Attenuation`\
  \ 的属性控制。这本质上是灯光从全功率衰减到零的半径。`Attenuation` 设置为 `0` 的灯光完全没有衰减，且处于全强度。我们希望灯光的亮度不超过电脑屏幕可能发出的亮度。让我们将其设置为\
  \ `250`。\n\n6.  既然我们希望灯光发出的光线仅相当于电脑屏幕，那就把它移到我们的电脑控制台形状附近。\n\n7.  如果我们看看灯光投射的阴影，它们非常生硬且边缘锐利。这完全不是我们在现实中会看到的样子。大多数灯光倾向于产生非常柔和和漫射的阴影，我们希望在这里模仿这一点。我们通过在\
  \ `Details` 面板中添加 `Source Radius` 来实现这一点。我的设置为 `150`：\n\n    ![使用不同类型的光照](img/BO5189_02_16.jpg`)\n\
  \n    *舰桥上的最终灯光设置*\n\n8.  现在我们已经完成了灯光的所有设置，让我们将灯光复制到另一个电脑控制台上方和全息显示器上方（金字塔形状上方）。\n\
  \n9.  下面的屏幕截图显示了货舱中的最终灯光设置：\n\n    ![使用不同类型的光照](img/BO5189_02_17.jpg`)\n\n    *货舱的最终灯光设置*\n\
  \n\n\n确保构建你的关卡并运行它，以检查你完全点亮的桥梁。一旦你满意了，将我们学到的一些相同技巧应用到走廊和第二个房间——我们的货舱。记住我们要营造的是紧张感和神秘感。既然这些区域位于我们的“安全”桥梁之外，我倾向于使用红光和黄光。现在让我们通过让门和电梯运作起来，为关卡添加一些有趣的交互元素。\n\
  \n# 使用触发器和蓝图添加交互元素\n\n目前，我们的游戏关卡看起来已经相当不错了。我们给它添加了一些道具，让玩家感觉自己正徘徊在一艘小型货船的内部。通过灯光，我们向玩家传达了一种危险感和神秘感。完成这个关卡的最后一步将是添加一些基础的交互元素。为此我们将需要一个\
  \ `Blueprint`（蓝图）。\n\n`Blueprint`（蓝图）是虚幻引擎内置的可视化脚本引擎，它允许美术人员和其他非程序员在完全不接触一行代码的情况下编程游戏机制和关卡事件。我多年的教学经验也发现，这是一个让你接触编程技巧的绝佳途径，因为\
  \ `Blueprint` 使用了许多相同的术语。为了我们的目的，我们将使用 `Blueprint` 来为我们的两扇门和电梯制作动画，以便玩家有一些交互元素可以玩弄：\n\
  \n![使用触发器和蓝图添加交互元素](img/BO5189_02_18.jpg)\n\n所有的 `Blueprint` 都有一个用于启动它们的 `Event`（事件），后面跟着一个或多个\
  \ `Action`（动作）。\n\n作为关卡设计师，我们将使用的大多数基础编程都遵循相同的基本模式：一个 `Event` 导致若干个 `Action` 发生。例如，要让一扇门打开，事件可能是玩家走到门前，而动作则是将门动画移动到打开位置，然后在几秒钟后关闭。当我们构建\
  \ `Blueprint` 序列时，我们也将了解变量和数据类型。让我们开始制作门的序列吧：\n\n1.  首先我们需要一个 `Trigger`（触发器）。这是一个游戏对象，用于检测其他对象（如玩家）是否进入了某个区域。它们有几种不同的形状，且尺寸几乎可以调整以适应任何情况。在这里，我们将从\
  \ `Modes`（模式）面板中获取一个 `Box Trigger`（盒子触发器）并将其放置在门的底部。这将触发播放我们动画的事件：\n    ![使用触发器和蓝图添加交互元素](img/BO5189_02_19.jpg)\n\
  \n    通过 `Blueprints` 菜单打开 `Level Blueprint`（关卡蓝图）\n\n2.  现在开始构建我们的序列。点击 `Blueprints`\
  \ 按钮并选择 `Open Level Blueprint` 来打开 `Level Blueprint`。在 `Blueprint` 区域中导航的方法是：按住\
  \ `RMB`（右键），向某个方向拖动，并使用 `LMB`（左键）来选择事物：\n    ![使用触发器和蓝图添加交互元素](img/BO5189_02_20.jpg)\n\
  \n    创建第一个 `Event`\n\n3.  回到关卡编辑器，确保你的 `Trigger` 已被选中。现在，在 `Blueprint` 窗口中，在空白处右键点击，然后点击\
  \ `Trigger Box 1`（你的数字可能不同）的 `Add Event`（添加事件）旁边的向下箭头。点击 `Collision`（碰撞）旁边的向下箭头并选择\
  \ `Add On Actor Begin Overlap`（添加 ActorBeginOverlap 事件）。当一个 `Actor`（我们的玩家）开始与 `Trigger`\
  \ 重叠时，此事件将被触发。\n\n4.  接下来我们需要一个 `Timeline`（时间轴）。这是一个节点，允许你为数值数据类型（如浮点数或向量）制作动画。在我们的例子中，我们将用它来为门的向量位置制作动画，使其看起来像在滑动。在事件旁边的空白处右键点击，一直向下滑到列表底部。选择\
  \ `Add Timeline`。你将有机会给它起一个唯一的名字。我将我的命名为 `Door1`，这不是很有描述性，但能将其与我们将创建的任何其他 `Timeline`\
  \ 区分开：\n    ![使用触发器和蓝图添加交互元素](img/BO5189_02_21.jpg)\n\n    创建 `Timeline` 动画曲线\n\n\
  5.  通过双击节点打开 `Timeline`。既然我们要为向量（三维空间中的一个点）制作动画，我们需要点击 `Timeline` 窗口左上角的 `V+` 按钮。你将看到三条彩色线，它们分别代表\
  \ `X`、`Y` 和 `Z` 轴。我们要做的是创建对应门的重要位置的关键帧：打开和关闭。但在添加关键帧之前，我们需要确保我们只在 `X` 轴上工作，因为那是我们将滑动门的方向。我们通过图表左上角\
  \ `Y` 和 `Z` 旁边的小锁图标来实现这一点。你可能也想通过点击它们旁边的眼睛图标来隐藏这些轴。\n\n6.  在 `0` 附近，通过右键点击并选择 `Add\
  \ Key` 向 `X` 轴添加一个关键帧。如果你没有正好在零点上，可以随意点击关键帧并将 Time 和 Value 都改为零。接下来，在 2 秒处添加另一个关键帧并将其值改为\
  \ `100`。我们是在告诉门沿正 `X` 轴方向滑动 100 个单位。最后，我们可以通过右键点击第一个关键帧并将 `Key Interpolation` 设置为\
  \ `Auto` 来使滑动更逼真。你可以通过点击 `Fit Horizontal` 和 `Fit Vertical` 箭头（靠近锁图标的地方）来查看完整的曲线，以检查你的成果：\n\
  \    ![使用触发器和蓝图添加交互元素](img/BO5189_02_22.jpg)\n\n    为门制作动画的 `Blueprint`\n\n7.  通过点击其标签页返回\
  \ `Event Graph`（事件图表）。现在我们需要利用我们的动画值让门移动。我们要找的节点叫做 `Set Actor Location`（设置 Actor\
  \ 位置）。在 `Timeline` 附近右键点击，在 `Search`（搜索）框中输入这个名称。如果你在 `Windows` 菜单中启用了 `Palette`（调色板），也可以使用\
  \ `Find a Node`（查找节点）库。`Set Actor Location` 需要两条信息才能工作：`Target`（目标，即什么在移动）和新位置。现在，你可能想直接把\
  \ `Timeline` 的黄色输出连接到新位置，但这不一定行得通。我们需要考虑门现有的位置并加上我们的滑动量。为此我们需要获取门的位置。在关卡中点击门，然后在我们的\
  \ `Blueprint` 中右键点击。在搜索框中输入 `Get` `Actor` `Location`。我们还需要一个名为 `Vector + Vector`\
  \ 的节点来为我们进行数学运算。像你在上一张图片中看到的那样连接所有节点：按住节点的输出（如彩色圆点或箭头）左键拖出一根“线”，插入到下一个节点的输入端。不用太担心这部分；虚幻引擎不允许你将一个节点插入到不接受该输入的另一个节点中。\n\
  \n8.  现在，我们的 Get 和 Set 节点仍然缺少一些东西。两个节点都没有目标，所以它们不知道引用哪个对象。为此，我们需要一个 `Name` 变量。这只是对关卡中存在的某物的引用。在关卡中，点击我们想要制作动画的门。现在在\
  \ `Blueprint` 中，在 `Set Actor Location` 节点旁边右键点击，选择 `Create a Reference` to `SM_Door2`（同样，你的数字可能不同）。现在，将该变量插入到我们节点的目标端。重复此过程，为\
  \ `Get Actor Location` 节点创建一个名称变量。\n\n9.  该过程的最后一部分是回到关卡中，点击门，并在 `Details` 面板的 `Transform`\
  \ 部分选择 `Movable`。这将允许你的门制作动画。现在构建关卡并测试一下。\n\n10. 一切正常吗？太棒了！确保再次按照该流程为走廊另一端的第二扇门进行操作。\n\
  \n\n\n\n\n# 使用 Matinee 为电梯制作动画\n\n1.  创建 `Matinee` 与创建 `Timeline` 略有不同。要开始使用 Matinee，请点击\
  \ `Matinee` 按钮并选择 `Add Matinee`。Unreal 会警告你 `Undo`/`Redo` 数据将被重置。继续点击 `Continue`，这将在你的关卡中创建一个\
  \ Matinee 对象。不用担心它的位置，这个东西可以在任何地方工作。点击该对象，并在 `Details` 面板中选择 `Open Matinee`。下面的截图展示了\
  \ `Matinee` 工具：\n\n    ![Adding interactive elements using Triggers and Blueprints](img/BO5189_02_23.jpg)\n\
  \n    使用 Matinee 工具\n\n2.  回到关卡中，点击我们的电梯平台，并确保在 `Details` 面板中将其设置为 `Movable`。现在点回\
  \ `Matinee`。在 Matinee 界面的 `Tracks` 部分，我们将右键点击并从菜单中选择 `Create New Empty Group`。给它起一个唯一的名字，比如\
  \ `Elevator`。这将为我们想要为电梯制作动画的任何对象创建一个组。\n\n3.  接下来，右键点击刚创建的组，选择 `Create New Movement\
  \ Track`。这将创建实际的动画轨道，我们可以在其中添加关键帧：\n\n    ![Adding interactive elements using Triggers\
  \ and Blueprints](img/BO5189_02_24.jpg)\n\n    Matinee 界面\n\n4.  当你创建 `Movement`\
  \ 轨道时，Unreal 会在 `0` 处创建你的第一个关键帧。这将是我们的下降位置。要为上升位置创建第二个关键帧，请点击 `Matinee` 界面左上角的 `Add\
  \ Key` 按钮。右键点击该关键帧并选择 `Set Time`。在框中输入 `2` 并按 `Enter`。在第二个关键帧仍处于选中状态时，回到关卡中将电梯移动到上升位置。当我们看到一条从下降位置延伸到新上升位置的虚线生成时，就知道操作成功了。最后，通过抓取\
  \ Time Bar 底部靠近 `5` 处的红色标签并将其向下拖动到 `2`，来更改 `Matinee` 序列的总长度。完成后，关闭 `Matinee`：\n\n\
  \    ![Adding interactive elements using Triggers and Blueprints](img/BO5189_02_25.jpg)\n\
  \n    完成的电梯\n\n5.  此时，我们需要在关卡中放置一些按钮来控制电梯。前往 `Shapes` 文件夹，像以前一样，拿几个形状作为呼叫按钮。我使用了一个稍微缩小过的金字塔，以适应平台附近柱子和墙壁上的位置。我们还需要在每个按钮周围添加\
  \ `Box Triggers`，以创建一个激活区域，玩家必须进入该区域才能使用按钮：\n\n    ![Adding interactive elements\
  \ using Triggers and Blueprints](img/BO5189_02_26.jpg)\n\n    电梯的蓝图\n\n6.  所有按钮和\
  \ `Box Triggers` 就位后，是时候组装 `Blueprint` 序列了。在关卡中，选择我们将要使用的所有 Box Triggers。在 Blueprint\
  \ 窗口中，右键点击并选择 `Add Event for Selected Actors`。这将允许你同时为所有 Trigger Boxes 创建 `On Actor\
  \ Begin Overlap` 和 `On Actor End Overlap`。我们还需要搜索一个按下 `E` 键的输入事件。\n\n7.  接下来我们需要一个\
  \ `Gate` 节点。这些节点允许你控制信息在序列中的流动。信息通过 `Enter` 输入进入 Gate，仅当 `Gate` 打开时才会继续传递。在我们的电梯控制中（见前图），按下\
  \ `E` 会将信息发送到 `Gate`，但只有当玩家站在电梯控制按钮旁边时，Gate 才会打开。\n\n8.  在 `Gate` 节点之后，我们需要一个名为\
  \ `Flip Flop` 的节点。根据上一次执行的是哪个分支，该节点将执行 A 或 B。这将允许我们通过播放和反转 `Matinee` 来切换电梯的上下运动。\n\
  \n9.  现在我们要让序列 `Play` 和 `Reverse` Matinee。回到关卡中点击 `Matinee` 对象。回到 Blueprint 中右键点击，然后选择创建一个对\
  \ `Matinee Actor` 的引用。从 Matinee Actor 拖出连线并搜索 `Play` 和 `Reverse` 节点。将它们添加到 `Blueprint`\
  \ 中。\n\n10.  现在像图中那样连接 `Blueprint`，点击 `Compile` 按钮，然后测试关卡！\n\n## 提示\n\n学会阅读 `Blueprints`\
  \ 的编程逻辑，在我们开始创建前所未有的事物时将大有裨益。对于我们的电梯 `Blueprint`，我们可以从 `Event` 开始，逐步梳理每个动作来理解它。例如，我们的电梯从按下\
  \ `E` 开始。`Gate` 检查玩家是否在按钮附近。如果在，电梯 `Matinee` 将根据上次的动作选择 `Play` 或 `Reverse`。从现有的\
  \ `Blueprint` 序列中学习是极好的练习！\n\n## 测试我们的关卡\n\n设计流程的下一步是与朋友、家人，以及最重要的是将要玩我们游戏的人一起试玩我们的原型关卡。试玩是设计流程中最重要但也最容易被忽视的步骤之一。许多游戏和关卡设计师急于推进最终设计，因此错过了那些未参与游戏设计和构建的人所能提供的宝贵反馈。重要的是要记住，虽然关卡对你来说很好玩，但其他人可能会觉得困惑或缺少关键功能。通过让玩家试玩原型来获取反馈，可以帮助我们发现那些我们作为设计师理所当然认为存在的事物。\n\
  \n如果这个关卡是为商业游戏准备的，我们会花一些时间与朋友和同事测试，并在此过程中融入反馈。灯光可能太暗，或者按钮太难找。我们可能会增加更多房间或谜题，使关卡更具挑战性。如果我们持续收到玩家不理解关卡存在理由的反馈，我们甚至可以推倒重来。试玩时要记住的重要一点是：玩家的反馈不是对你或你的想法的批评。从他们那里收集的信息旨在改进你的关卡并强化你的设计，所以永远不要错过收集这一重要数据的机会！\n\
  \n## 总结\n\n在本章中，我们根据纸上草图的设计，完成了使用 `Unreal Engine 4` 构建关卡的过程。关卡本身很简单：两个房间通过走廊连接，包含门、楼梯和电梯。我们使用\
  \ `Starter Content` 文件夹中提供的一系列形状和道具来装饰空间，以契合科幻恐怖主题。我们还学习了如何在关卡中使用灯光来营造张力和传达氛围。通过\
  \ `Blueprints`，我们探索了关卡编程，为门和电梯制作了动画。最后，我们讨论了试玩的重要性，以及玩家的建设性批评只会让我们的关卡和游戏变得更好。在下一章中，我们将转向使用\
  \ `Blender`，根据白模阶段装饰飞船时使用的一些基本形状，为关卡创建一个道具。\n\n你的关卡做得怎么样？\n\n它感觉像一艘货船吗？\n\n试玩者在玩的时候感觉如何？\n\
  \n\n\n"
- "# 开始制作游戏资产\n\n请记住，灰盒搭建关卡的目的之一是了解我们需要哪些道具及其相对尺寸。如果我们要将这个关卡完整地推进开发流程（完成本章后，请随意继续完成关卡），我们会用详细的自定义游戏资产替换掉每一个基础形状。不过，这有点超出了本书的范围。我们将构建一个基础道具，让你开始接触\
  \ `Blender`，并熟悉将自定义美术资源导入 Unreal 的流程。经过一些练习，你关卡构建能力的唯一限制将只有你的想象力！在本章中，我们将涵盖以下主题：\n\
  \n*   开始制作游戏资产\n*   使用多边形建模的基本工具\n*   如何使用 UV 映射及其重要性\n*   为游戏资产展开 UV\n*   基础贴图技术\n\
  \n## 勾勒我们的第一个资产\n\n那么，在开始设计资产之前，我们要制作哪个资产？在灰盒阶段，我们使用了几个基础形状来代表潜在的游戏资产，这给了我们很多选择，比如全息投影仪、电脑控制台、管道、柱子或箱子。既然这很可能是你第一次尝试使用\
  \ `Blender`，我们将从为货船运输创建一个详细的箱子开始。箱子允许我们构建一个相当基础但仍能支持大量细节的物体。所以，拿一张方格纸，打开网页浏览器；是时候开始草拟了！\n\
  \n![开始制作游戏资产](img/BO5189_03_01.jpg)\n\n我的设计基于我在网上找到的几个不同科幻箱子的碎片，以及我从一些最喜欢的游戏和电影中记住的片段（科幻恰好是我最喜欢的类型之一）。箱子本身也被设计成有内部结构，这样我就可以在关卡中同时展示盖子打开和关闭的状态。这赋予了资产灵活性，让我能在许多不同场景中使用它，这是两个非常重要的设计考量。\n\
  \n### 提示\n\n由于构建独特环境需要大量工作，资产复用在游戏设计和开发中非常重要。Unreal Marketplace 上许多可用的建筑套装都设计为模块化，以创建各种不同的场景。这种做法可以追溯到最早的游戏作品。在\
  \ NES 上的《超级马里奥兄弟》中，云和灌木丛是完全相同的游戏资产，只是颜色不同。\n\n你可能注意到我绘制了箱子的几个不同视图。这让我们能从正面、侧面和背面查看物体，并设计出每个部分都有变化的物体。通过这样做，如果我们是设计创作者但不是在\
  \ 3D 中构建资产的人，也能将设计传达给团队中的另一位美术师。\n\n## 在 Blender 中设置文件\n\n现在让我们在 `Blender` 中设置文件（还记得第\
  \ 1 章的设置吗？）：\n\n![开始制作游戏资产](img/BO5189_03_2.jpg)\n\n**设置缩放以匹配 Unreal 4**\n\n1. \
  \ 打开 `Blender`。\n2.  在 `Properties` 面板的 `Scene` 部分，将单位制改为 `Metric`（公制）。\n3.  将 `Scale`（缩放）改为\
  \ `0.01`。\n4.  按 `N` 打开 `Scene Properties`（场景属性）面板，通过将 `View`（视图）下的 `Clip End`（剪切末端）属性改为\
  \ `1.0 km` 来修正网格。\n5.  将初始立方体缩放 `100` 倍，因为我们将使用它。\n6.  点击 `File`（文件）菜单并选择 `Save\
  \ Startup File`（保存启动文件）。这会将我们的更改保存为默认设置，确保我们今后创建的所有文件都将具有这些设置。这将为我们节省未来的时间。\n\n\
  准备好 `Blender` 文件后，是时候开始构建我们的箱子了。\n\n# 使用多边形建模的基本工具\n\n我们将从最接近我们想要的最终形状的基础体开始构建箱子。在这种情况下，我们开始时的默认立方体非常合适。那么什么是基础体，为什么我们要从它开始呢？基础形状是你的基本形状，在\
  \ `Blender` 中包括：平面、立方体、圆、球体、圆柱体、圆锥体和环面。我们从这些形状开始，因为它们是我们所见一切的基本构建块。传统艺术家绘画时也从这些形状入手。如果你向外看，可以看到这些形状：电线杆是圆柱体，建筑物是立方体，等等。这也是\
  \ Unreal 给我们提供一个装满基础体的 Shapes（形状）文件夹来供我们灰盒搭建关卡的原因。\n\n最容易学习的 3D 建模技术之一是多边形建模，简称多边建模。它涉及操作构成基础体的顶点、边和多边形，以创造出更复杂的东西。多边建模使用以下工具：\n\
  \n![使用多边形建模的基本工具](img/BO5189_03_3.jpg)\n\n## 工具面板\n\n### 挤出\n\n**挤出**：此工具允许你向内推或向外拉一个多边面，在创建物体的新部分时非常有用：\n\
  \n![使用多边形建模的基本工具](img/BO5189_03_4.jpg)\n\n### 面内插\n\n**面内插**：内插对于在物体内部创建细节很有用，例如在建筑物上创建窗户或门：\n\
  \n![使用多边形建模的基本工具](img/BO5189_03_5.jpg)\n\n### 循环切割和滑动\n\n**循环切割和滑动**：另一个添加细节的工具，它在物体上切割新的边循环。要添加的边循环数量可以通过鼠标滚轮调整：\n\
  \n![使用多边形建模的基本工具](img/BO5189_03_6.jpg)\n\n### 倒角\n\n**倒角**：位于特殊菜单中（按 `W`），**倒角**\
  \ 工具允许你圆滑边缘。要添加的额外边数量可以通过鼠标滚轮调整：\n\n![使用多边形建模的基本工具](img/BO5189_03_7.jpg)\n\n## 将立方体转变为箱子\n\
  \n是时候开始将我们的立方体转变为配得上我们关卡的东西了。首先我们需要确定箱子的基本形状：\n\n1.  选择立方体并按 `Tab` 键。这将把你从 `Object`（物体）模式切换到\
  \ `Edit`（编辑）模式。`Object` 模式用于向场景添加新物体，并使用移动、旋转和缩放工具排列这些物体。`Edit` 模式允许你操作切换模式时所选物体的顶点、边和多边面：\n\
  \n    ![使用多边形建模的基本工具](img/BO5189_03_8.jpg)\n\n    选择模式按钮\n\n2.  切换到多边面选择模式。选择模式按钮位于\
  \ 3D 窗口底部：\n\n    ![使用多边形建模的基本工具](img/BO5189_03_9.jpg)\n\n    对箱子顶部的面进行内插\n\n3.\
  \  选择顶部的面并按 `I` 使用 `Inset`（内插）工具。内插该面以创建框架形状，就像我们草图里的那样。你也可以输入数值（我用了 `0.177`）并按\
  \ `Enter`。\n\n4.  按 `E` 使用 `Extrude`（挤出）工具。向内推挤该面，给箱子顶部一个良好的边缘。\n\n5.  我们要再次 `Inset`（内插）。再次内插该面以创建控制盒的空间。我用了\
  \ `0.523` 作为数值。现在挤出这个小面向上，创建控制盒：\n\n    ![使用多边形建模的基本工具](img/BO5189_03_10.jpg)\n\n\
  \    使用循环切割和滑动创建更多细节\n\n\n\n\n## 箱子建模步骤（6–15）\n\n### 步骤 6：为接缝切割线条\n现在我们需要切割线条，以创建盖子嵌合到箱子上的接缝位置。从左侧菜单点击\
  \ `Loop Cut and Slide`（循环切割和滑移）工具，或按 `Ctrl+R`。将鼠标移至箱子上方，直到出现一条紫色线条水平穿过下部区域。点击 `LMB`（左键）；这会将线条变为橙色，并允许你沿箱子上下滑动它。当它移动到我们想要的位置时再次点击。\n\
  \n### 步骤 7：使用倒角工具分割\n使用 `Bevel`（倒角）工具分割这条新线条。按 `W` 并选择 `Bevel`。我将其分割了 `0.05`：\n\n\
  ![使用多边形建模的基本工具](img/BO5189_03_11.jpg)\n\n*使用缩放工具创建盖子接缝*\n\n### 步骤 8：缩放盖子多边形\n盖子还需一步：选择盖子外侧周围的四个多边形（按住\
  \ `Shift` 键可选择多个多边形），按 `S` 使用 `Scale`（缩放）工具将它们稍微缩小。\n\n### 步骤 9：添加垂直循环切割\n接下来我们将在侧面添加细节。沿\
  \ `Y` 轴（绿色轴），我们将使用 `Loop Cut and Slide`（循环切割和滑移）工具，在物体周围垂直切割四条线。\n\n### 步骤 10：创建四条垂直线\n\
  移动鼠标以获得沿箱子垂直的紫色参考线，然后使用鼠标滚轮直到出现四条线。点击鼠标切割线条，然后在不移动鼠标的情况下再次点击以使它们保持居中：\n\n![使用多边形建模的基本工具](img/BO5189_03_12.jpg)\n\
  \n*挤出多边形以在箱子侧面添加一些凸起区域*\n\n### 步骤 11：挤出侧面条带和底部滑轨\n现在我们将选择一些新多边形，以创建箱子侧面的条带。使用 `Extrude\
  \ Individual`（单独挤出）工具 `Extrude`（挤出）它们，并将其拉出到合适的大小。同时通过拉出两侧的外侧多边形和中间的多边形，`Extrude`（挤出）箱子底部的滑轨：\n\
  \n![使用多边形建模的基本工具](img/BO5189_03_13.jpg)\n\n*创建锁扣*\n\n### 步骤 12：添加锁扣边循环\n让我们添加锁扣。使用\
  \ `Loop Cut and Slide`（循环切割和滑移）在箱子周围添加一条水平边循环。然后在箱子前面添加两条垂直边循环：\n\n![使用多边形建模的基本工具](img/BO5189_03_14.jpg)\n\
  \n*完成锁扣*\n\n### 步骤 13：挤出锁扣\n完成锁扣是一个两步 `Extrude`（挤出）过程。选择图中所示的三个多边形并 `Extrude`（挤出）它们向外。然后选择锁扣顶部的两个多边形并\
  \ `Extrude`（挤出）它们：\n\n![使用多边形建模的基本工具](img/BO5189_03_15.jpg)\n\n*使用镜像修改器创建对称*\n\n\
  ### 步骤 14：将物体切半以进行镜像\n现在为了确保所有东西都是均匀的，我们将使用 `Mirror`（镜像）修改器。使用 `Loop Cut and Slide`（循环切割和滑移）从前向后切割一条垂直线，将物体切成两半。接下来，按\
  \ `B` 进行框选，选择箱子的一半。按 `Delete` 键并选择 `Faces`（面）以删除箱子的一半。\n\n### 步骤 15：应用镜像修改器\n最后，通过点击\
  \ `Properties`（属性）面板中的扳手图标来打开 `Modifier`（修改器）菜单，添加 `Mirror`（镜像）修改器。点击 `Add Modifier`（添加修改器）下拉菜单并选择\
  \ `Mirror`。操作设置直到成功使物体恢复完整。一切设置好后，返回 `Object`（物体）模式，并在 `Modifier`（修改器）菜单中点击 `Apply`（应用）。修改器无法在\
  \ `Edit`（编辑）模式下添加。完成了！作为我们的第一个道具，这已经很不错了。它看起来可以装下任何东西，从食物到在黑暗中猎杀你的可怕变异基因怪物。\n\n\
  # 如何使用 UV 映射及其重要性\n\n此时，我们已经确定了箱子的几何体或基本形状，但它看起来仍然不像我们在其他游戏中看到的物体。原因是纹理。为物体添加纹理将创建所有那些细节，使我们的游戏资产配得上我们构建的关卡。制作纹理并将其应用到物体上是一个两步过程。首先，我们需要告诉纹理如何表现，这需要\
  \ UV 贴图：\n\n![如何使用 UV 映射及其重要性](img/BO5189_03_16.jpg)\n\n*使用基础立方体学习展开*\n\nUV 贴图是一组坐标，告诉我们放置在游戏资产上的纹理贴图如何环绕物体。其原理是获取你的\
  \ 3D 物体并将其展平，以便我们能以一种不会撕裂或拉伸纹理的方式将图像应用到外部。这使我们能够创建详细的纹理贴图，应用诸如刮擦边缘、锈斑、油漆颜色、可视屏幕等效果。没有它，Unreal\
  \ 将不知道如何在游戏中为物体贴图。它也无法正确应用光照，因为 Unreal 使用 UV 贴图来应用光影：\n\n![如何使用 UV 映射及其重要性](img/BO5189_03_17.jpg)\n\
  \n*UV 映射菜单*\n\n那么我们在 Blender 中如何操作呢？该应用程序为我们提供了添加 UV 贴图的几种选项，其中一些比其他选项更适合我们创建的内容：\n\
  \n- **`Smart UV Project`（智能 UV 投影）**：适用于建筑和机械物体，`Smart UV Project` 根据几何体的角度变化创建自定义\
  \ UV 布局。它会尽力以合乎逻辑的方式布局所有内容，并可最大程度减少拉伸。该工具尝试合乎逻辑地布局，但可能需要稍微调整。\n- **`Cube Projection`（立方体投影）**：立方体映射将物体分解为六个面并将它们投影到平面上。这会创建六个独立的\
  \ UV 岛，可以对其进行操作。\n- **`Project From View`（从视图投影）**：根据所选内容和 3D 视图的角度创建 UV 贴图。例如，你可以选择物体左侧的所有多边形，为视口选择\
  \ `Left Side`（左视图）视图，然后使用此选项。\n- **`Lightmap Pack`（光照贴图打包）**：Unreal 和其他游戏引擎在构建过程中使用光照贴图将阴影烘焙到物体上。`Lightmap\
  \ Pack` 可以通过尽可能多地利用 UV 空间，创建更适合光照贴图的 UV 布局。这最大化了物体能承载的光照信息量，并将改善结果。\n\n# 为游戏资产进行\
  \ UV 展开\n\nUV 映射可能是一个困难的过程，但了解一些最佳实践可以帮助简化该过程：\n\n![为游戏资产进行 UV 展开](img/BO5189_03_18.jpg)\n\
  \n*UV 网格纹理贴图*\n\n1.  **在过程中使用彩色 UV 网格纹理**：这可以通过在线图片搜索轻松找到，并可在 Blender 中作为材质应用到物体上。务必找到与你想要创建的纹理尺寸相同的图片，例如\
  \ `1024 x 1024` 或 `2048 x 2048`。我使用了一张 `2048 x 2048` 的图片。\n2.  **最小化接缝和拉伸**：将 UV\
  \ 贴图的接缝隐藏在硬边或玩家看不见的隐藏区域非常重要。幸运的是，像我们的箱子这样的硬表面物体比汽车、植物或动物等具有更多有机曲线的物体更容易展开。\n3. \
  \ **保持 UV 元素方向一致**：在布局 UV 贴图时，使所有内容朝向相同方向将使布局和创建纹理贴图变得更加容易。如果纹理美术是团队中的另一位成员，这一点甚至更为重要。\n\
  4.  **小心不要浪费空间**：纹理贴图中浪费的空间越少，直接转化为纹理中像素密度的增加和整体质量的提升。\n5.  **请记住，所有这些都需要练习才能掌握**。\n\
  \n现在让我们为箱子进行 UV 展开：\n\n![为游戏资产进行 UV 展开](img/BO5189_03_19.jpg)\n\n*使用场景布局下拉菜单将视口更改为\
  \ UV 编辑预设*\n\n1.  选择箱子并进入 `Edit`（编辑）模式（如果你尚未进入）。同时确保你处于多边形选择模式。按两次 `A` 以选择箱子的所有多边形。\n\
  2.  在菜单栏中，转到 `Scene Layout`（场景布局）下拉菜单并选择 `UV Editing`（UV 编辑）。这将把视口分成两半。左侧是你的 UV\
  \ 布局，目前为空白。右侧是你的物体。你仍然可以移动和旋转它，以便选择不同的多边形。\n\n\n\n\n\n## UV 展开\n\n3. 在 3D 视口（右侧），你会注意到\
  \ `Tools` 面板已变为 `Shading/UV` 工具。在 `UVs` 标题下有一个 `UV Mapping` 选项下拉菜单。这些选项是我们开始对物体进行\
  \ UV 展开的地方。全选所有多边形后，打开菜单并选择 `Smart UV Project` 选项：\n\n   ![UV unwrapping our game\
  \ asset](img/BO5189_03_20.jpg)\n\n   使用 Smart UV Project 的基础 UV 布局\n\n4. `Smart\
  \ UV Project` 是 Blender 的自动展开工具。大多数 3D 创作套件都有类似工具，其输出结果会因物体复杂程度而异。对于像我们这样简单的箱子，效果相当不错。对于更有机的物体，或复杂的机械、建筑，可能很难获得理想结果。在\
  \ `Smart UV Project` 菜单中，我们将使用默认设置。点击 `Ok`，它就会展开你的物体。\n\n5. `Smart UV Project` 将我们的物体压平并分离成了\
  \ UV 岛。UV 岛是物体的一部分。就我们的目的而言，Blender 分离物体的方式效果很好。如果我们制作更复杂的物体，可以将每个部分分离、分组使其更合理，甚至将一些部分缝合回去。稍后在本书创建更复杂物体时，这一步将变得必要。\n\
  \n6. 为了提高贴图质量，我们可以使用 `UV Layout` 视口底部 `UVs` 菜单中的 `Pack Islands` 选项。选择此选项将调整所有 UV\
  \ 岛的大小，使其在不拉伸的前提下占据尽可能多的空间。\n\n7. 既然我们在游戏引擎中工作，就需要第二个 UV 通道（或坐标集）来存储光照信息。要添加另一个\
  \ UV 通道，我们需要返回 `Scene Layout` 下拉菜单并选择 `Default`：\n\n   ![UV unwrapping our game\
  \ asset](img/BO5189_03_21.jpg)\n\n   创建第二个 UV 贴图通道\n\n   在 `Properties` 面板中，点击 `Object\
  \ Data` 图标。在 `UV Maps` 标题下，点击加号按钮以创建另一个 UV 通道。\n\n8. 在这个第二个 UV 通道上，我们将添加光照贴图 UV。它们与用于纹理的\
  \ UV 布局不同，我们不关心所有部分是否缩放到相同数值。我们只关心它们占据尽可能多的空间以存储光影信息。Blender 的 `Lightmap Pack` 工具可以轻松完成此工作。返回\
  \ `Scene Layout` 下拉菜单中的 `UV Layout` 选项。`UV Layout` 视口右下角显示当前活动的 UV 通道。它会显示 `UVMap`。点击它并选择\
  \ `UVMap.001`。这是我们的新通道：\n\n   ![UV unwrapping our game asset](img/BO5189_03_22.jpg)\n\
  \n   使用 Lightmap Pack 工具创建虚幻 4 可用的光照贴图\n\n9. 转到 3D 视口侧边的 `Tools` 面板，从 `UV Mapping`\
  \ 菜单中选择 `Lightmap Pack`。默认选项也可以。点击 `Ok`。现在展开完成。返回 `Default` 屏幕布局：\n\n   ![UV unwrapping\
  \ our game asset](img/BO5189_03_23.jpg)\n\n   将 UV 纹理网格作为贴图添加到箱子上\n\n10. 为了测试 UV\
  \ 布局，我们可以添加之前下载的彩色 UV 纹理网格。这能轻松显示纹理是否有拉伸。如果我们手动展开，这张贴图将帮助我们拼凑 UV 贴图，确保所有元素朝向一致并最小化拉伸。点击\
  \ `Properties` 面板工具栏上的 `Textures` 按钮。在菜单的第一部分，进入 `Type` 下拉菜单并选择 `Image or Movie`。这将打开菜单的\
  \ `Image` 部分，允许你点击 `Open` 按钮。导航到存储图像的位置并选择它。\n\n11. 点击 `Properties` 面板工具栏中 `Texture`\
  \ 图标旁边的图标。这是 `Materials` 面板。剩下的就是将材质 `Assign` 给物体。点击 `Select` 选项选择所有多边形，然后点击 `Assign`。这会将材质添加到物体上。它会根据我们的\
  \ UV 贴图拉伸覆盖在物体上。\n\n12. 显然，我们不想在虚幻环境中放一个五颜六色的盒子。在下一节中，我们将讨论如何给盒子添加基础材质，以及创建细节纹理的其他技术。\n\
  \n## 基础纹理技术\n\n正如我之前提到的，纹理能让游戏物体在关卡中脱颖而出。它们可用于添加各种我们没时间建模的元素，以及颜色、磨损和光照信息。给游戏物体制作纹理有很多方法。想利用虚幻材质的基础物体可直接在关卡中应用一个。Blender\
  \ 通过其纹理绘制模式提供了程序内的绘图工具。最后，还有使用其他程序创建纹理的选项。我们的 UV 贴图可以导出到 `Adobe Photoshop` 或 `GIMP`\
  \ 等程序，在那里我们可以使用颜色工具绘制纹理，或使用照片创建逼真效果。我也想谈谈几年前出现的一种新型工具。`Substance Painter` 是一款允许你直接在\
  \ 3D 物体上绘制纹理的应用程序，很像 Blender 的纹理绘制模式，但它拥有专为数字娱乐行业打造的选项和工具：\n\n![Basic texturing\
  \ techniques](img/BO5189_03_24.jpg)\n\n展示虚幻 4 中的新箱子\n\n虚幻通过 `Starter Content` 文件夹提供了多种可用材质，既然我们的\
  \ UV 贴图会随物体一起导入，只需将材质拖放到箱子上即可。这些材质本身在箱子上看起来很棒，肯定能提供我们想要的关卡深度和特色。然而，既然材质不是专门为我们的箱子制作的，它们无法真正提供我们之前讨论的那些额外细节。下一章将物体导入虚幻时，我们将首先尝试这条路径：\n\
  \n![Basic texturing techniques](img/BO5189_03_25.jpg)\n\nBlender 的纹理绘制模式\n\nBlender\
  \ 自带纹理绘制模式。此模式可用于在物体上绘制纯色和图像。生成的纹理随后可从程序导出并在虚幻中应用。使用此模式让我们无需其他程序即可为箱子创建纹理，但因为 Blender\
  \ 不是专业的图形编辑程序，其提供的工具有限：\n\n![Basic texturing techniques](img/BO5189_03_26.jpg)\n\
  \nAdobe Photoshop 中显示的导出 UV 贴图\n\n`Adobe Photoshop` 及其开源替代品 `GIMP` 是图形编辑程序，可用于多种数字绘图、照片编辑等。通过将\
  \ UV 贴图导入这些程序，我们可以使用其绘图工具创建详细纹理，随物体一起导入虚幻。多年来这一直是创建游戏纹理最常用的方法。`Adobe Photoshop`\
  \ 可在 `http://www.adobe.com/products/photoshop.html` 申请 30 天试用订阅。`GIMP` 可在 `http://www.gimp.org`\
  \ 下载：\n\n![Basic texturing techniques](img/BO5189_03_27.jpg)\n\nAllegorithmic Substance\
  \ Painter 中的箱子\n\n\n\n\nAllegorithmic Substance Painter，以及其他类似程序（如**Quixel**工具套件），是一款\
  \ 3D 绘画程序，允许你实时将高级材质直接绘制到物体上。它拥有许多你在 Adobe Photoshop 或 GIMP 中看到的工具，例如遮罩区域和使用不同图案笔刷的能力，但已将它们完全适配于\
  \ 3D 游戏艺术家的需求。Substance Painter 目前在 Unreal 游戏引擎中拥有完整支持，是在相对较短时间内创建高端、细节丰富材质的绝佳方式。请访问[`www.allegorithmic.com/products/substance-painter`](https://www.allegorithmic.com/products/substance-painter)了解\
  \ Substance Painter。\n\n# 概要\n\n在第 3 章，*是时候定制了！*中，我们介绍了如何使用设计流程设计一个完美适配我们货轮关卡的箱子。在纸上设计好游戏资产后，我们打开\
  \ Blender，使用多边形建模技术创建 3D 模型。在 Blender 中，我们使用了挤出、内插、循环切割和滑移、倒角等工具，将基本图元形状转变为细节丰富的游戏资产。完成箱子的基本几何体后，我们打开\
  \ Blender 的 UV 映射部分并创建了 UV 贴图。UV 贴图将处理下一章我们将添加到物体上的纹理，以及光照信息，以确保物体与关卡光照完美融合。最后，我们讨论了几种将材质应用到物体的不同方法，从在\
  \ Unreal 中直接应用预制材质，到在 Blender 中绘制物体，再到在 Photoshop 或 GIMP 中绘制详细纹理。我们还展望了 Substance\
  \ Painter 带来的次世代贴图未来。在下一章，我们将从 Blender 导出物体并将其导入 Unreal，以便在关卡中使用。\n\n在上一章中，我们使用白盒关卡确定哪个简单形状将首先转变为\
  \ 3D 资产。决定将货舱中的立方体变成箱子后，我们使用 Blender 创建 3D 游戏资产并进行 UV 展开以供 Unreal 使用。但如何将其从 Blender\
  \ 转移到 Unreal？为此，我们必须经历将物体从 Blender 导出为 FBX 文件并导入 Unreal 的过程。然后我们可以将新导入的静态网格体连接到材质，添加碰撞基元，并将其作为可用物体添加到关卡中。这个过程称为**美术管线**。在本章中，我们将涵盖以下主题：\n\
  \n*   从 Blender 导出我们的物体\n*   什么是 FBX？\n*   将我们的物体导入 Unreal\n*   设置并使用我们的新 3D 游戏资产\n"
- "# 从 Blender 导出我们的物体\n\n我们构思了创作。\n我们绘制了箱子草图。\n我们在 Blender 中建模并展开 UV。\nUnreal 现在准备好接收我们的创作了。\n\
  \n在从 Blender 导出模型之前，我们可以做几件事以确保一切完美导出。Unreal 在导入物体时可能会很挑剔，只需几个步骤就能最大程度减少潜在问题。\n\n\
  让我们从应用缩放开始：\n\n![从 Blender 导出我们的物体](img/BO5189_04_01.jpg)\n\n对我们的物体应用缩放\n\n在设置场景的过程中，我们缩放了默认立方体，以便在构建箱子时将其作为起点。为确保导出过程中不出现问题，我们需要将缩放应用到物体上；这本质上是告诉\
  \ Blender 该物体不再处于缩放状态，而是真实的大小：\n\n1.  确保你处于**Object**模式。\n2.  按下`Ctrl+A`；这将打开**Apply**菜单。\n\
  3.  选择**Scale**。\n\n应用缩放后，我们可以继续准备导出物体的下一个重要步骤：设置枢轴点：\n\n![从 Blender 导出我们的物体](img/BO5189_04_02.jpg)\n\
  \n通过移动物体将原点置于箱子角落来设置枢轴点\n\n当物体在 Unreal 中使用时，它有一个枢轴点，充当网格锚点以及缩放和旋转的参考点。创建游戏资产时，我们需要考虑它们将如何被使用。例如，墙壁需要与相邻墙壁对齐，因此我们要确保其尺寸均匀且枢轴点设在角落。对于灯具之类的物体，我们可能会将枢轴点放置使物体平贴墙面以便放置。对于我们的箱子，我们需要能够对齐物体使其与地面齐平。因此我们需要将枢轴移动到接触地面的物体角落。\n\
  \n那么 Unreal 如何决定物体枢轴点的位置？当物体导入 Unreal 时，软件会查看世界原点的位置（即建模软件网格系统中的**0**、**0**、**0**），并将枢轴点放在那里。在\
  \ Blender 中，该点默认设置为起始立方体的中心。我们想要更改枢轴点位置，使其位于地面且在物体的角落：\n\n1.  按下`N`打开**Scene Properties**面板（如果尚未打开）。\n\
  2.  升高箱子使其位于网格平面上方。你可以在**Scene Properties**面板的**Transform**部分找到**Location:**进行精确设置。在那里你可以看到物体的**X**、**Y**、**Z**轴设为**0**、**0**、**0**。更改**Z**值，使箱子底部的滑轨与网格平面齐平。我的设置为`1.06m`。\n\
  3.  将**X**值改为`-1m`。\n4.  将**Y**值改为`-1m`。\n\n一切就绪！枢轴点将设置为箱子的底部角落。在导出之前，我们还需要在 Blender\
  \ 中做一件事：决定箱子的哪一面是正面：\n\n![从 Blender 导出我们的物体](img/BO5189_04_03.jpg)\n\n旋转箱子，使 Unreal\
  \ 识别箱子的正面为正面\n\nUnreal 通过检查物体哪一部分朝向正`X`轴方向来确定物体的正面。这对我们的箱子不太重要，但对角色、载具、武器等其他游戏资产非常重要。\n\
  \n通过在 Blender 中完成此步骤，我们可以节省导出后在 Unreal 中旋转物体的大量时间：\n\n1.  回顾箱子草图，两侧有两个大锁扣，因此我们的物体需要旋转。\n\
  2.  按下`R`或从**Tools**面板选择旋转。\n3.  按下`Z`锁定绕`Z`轴旋转。\n4.  输入`90`并按下`Enter`。\n\n一切就绪。我们应该不会在将物体导入\
  \ Unreal 时遇到问题。是时候将物体从 Blender 导出了。这通过`FBX Exporter`完成。\n\n## 什么是 FBX？\n\n那么 FBX\
  \ 文件格式到底是什么？（我知道，这是你一直想问的问题。）FBX 是 Kaydara 公司于 1996 年为其动画程序 Filmbox 创建的文件扩展名。Kaydara\
  \ 后来被 Autodesk 收购，该应用程序更名为 MotionBuilder。在软件开发商 Autodesk 旗下，该格式因多种原因成为游戏资产最流行的格式之一。首先，它能出色地导出几何体，并受到许多最流行\
  \ 3D 应用程序的支持。其次，它能导出材质设置。例如，当你将 FBX 文件导入 Unreal 时，可以选择带入纹理和材质信息，从而节省时间。最后，它能导出动画信息。这在稍后的第\
  \ 8 章，*灯光、摄影、动画！*中创建关卡动画资产时将变得重要。\n\n\n\n\nFBX 的缺点之一是它是一种专有文件格式。Autodesk 通过其许多产品和一个软件开发工具包向公众提供该格式。基于此，Blender\
  \ 社区的成员们已经能够创建一个导出工具，让我们能在项目中使用这种多功能的文件格式。让我们来看看 FBX 导出器。\n\n## 将物体导入 Unreal\n\n\
  是时候从 Blender 导出我们的箱子了：\n\n![将物体导入 Unreal](img/BO5189_04_04.jpg)\n\n从“文件”菜单中选择导出\n\
  \n可以通过转到 `File` 菜单，然后选择 `Export`，并选择 `FBX` 作为所需的文件格式来找到导出选项：\n\n![将物体导入 Unreal](img/BO5189_04_05.jpg)\n\
  \nFBX 导出选项菜单。选择“Mesh”选项卡。\n\n导出器有许多选项，其中有几个我们稍后会在涉及动画时用到。我们需要更改一些选项来导出我们的箱子：\n\n\
  1.  在导出器的主菜单中，选择 `Mesh`。这样，导出的唯一物体就是我们的箱子，而不会包括场景中的摄像机或灯光：\n\n    ![将物体导入 Unreal](img/BO5189_04_06.jpg)\n\
  \n    在“Geometries”选项卡中将“Smoothing”选项设置为“Face”\n\n2.  在 `Geometry` 菜单中，将 `Smoothing`\
  \ 选项更改为 `Face`。Unreal 要求平滑组必须是任何导出物体的一部分，尽管我们并没有真正用它们来创建箱子。通过选择此选项，我们可以在导入 FBX 文件时避免任何错误消息。\n\
  \n3.  更改完这些设置后，将 FBX 文件保存在易于查找的位置。\n\n接下来，我们将打开 Unreal 并将文件导入到我们的关卡中。一旦我们设置好几个选项，箱子就可以使用了。\n\
  \n## 设置并使用我们的新 3D 资产\n\n现在我们有了 FBX 文件，需要将文件导入到 Unreal 的 `Content Browser` 中。Epic\
  \ Games 使这个过程变得相对轻松。将文件导入游戏引擎后，它仍然需要两样东西。必须添加碰撞网格体，以确保玩家和其他游戏物体能与我们的新箱子正确碰撞。其次，我们必须为物体添加材质，使其具有视觉吸引力。\n\
  \n首先在 `Content Browser` 中导航到您想存放箱子的文件夹，然后点击 `Import` 按钮：\n\n![设置并使用我们的新 3D 资产](img/BO5189_04_07.jpg)\n\
  \n在文件浏览器中找到您的 FBX 文件。\n\n1.  导航到您保存 FBX 文件的文件夹并点击 `Open`：\n\n    ![设置并使用我们的新 3D\
  \ 资产](img/BO5189_04_08.jpg)\n\n    Unreal 的 FBX 导入选项菜单\n\n2.  这将打开 `FBX Import Options`。关闭\
  \ `Auto Generate Collision` 选项。虽然这将来可以节省时间，但我们将在成功导入文件后手动创建它。\n\n3.  同时关闭 `Import\
  \ Materials` 和 `Import Textures` 选项。如果您已在 3D 软件中创建了材质并希望随物体一起导入，可以使用这些选项。如果我们在此处使用它们，Unreal\
  \ 会导入我们的彩色 UV 网格。\n\n4.  更改完这些选项后，点击 `Import` 按钮。\n\n一个显示我们箱子的浅蓝色图标应该会被添加到浏览器中。双击它将带我们进入\
  \ `Static Mesh` 编辑器。在这里，我们可以设置几个不同的选项，这些选项将影响我们在关卡中使用的每一个箱子副本：\n\n![设置并使用我们的新 3D\
  \ 资产](img/BO5189_04_09.jpg)\n\nUnreal 4 中的静态网格体编辑器\n\n我们将从添加碰撞基元开始。`Collisions`\
  \ 真正是让电子游戏世界运转的关键，它是计算机判断玩家是否成功与另一个游戏物体交互的方式。作为玩家，我们经常在站在平台上向下看时看到碰撞。看起来似乎我们正漂浮在实际站立的物体上方。这是由于游戏编程实际上忽略了玩家看到的美术模型，仅使用对玩家不可见的简单碰撞基元来记录碰撞。就我们关卡构建者而言，碰撞将阻止玩家穿过箱子，并使他们能真正与其交互：\n\
  \n![设置并使用我们的新 3D 资产](img/BO5189_04_10.jpg)\n\n选择“Collision”菜单并选择“Add Simple Box\
  \ Collision”\n\n让我们看看如何为物体添加碰撞：\n\n1.  确保视口顶部的 `Collision` 选项已开启。这将使我们创建的任何碰撞基元可见。\n\
  \n2.  点击屏幕顶部菜单栏中的 `Collision` 菜单选项。从这里我们要选择最适合我们需求的最简单形状。既然我们的箱子本质上就是一个盒子，我们将选择\
  \ `Add Simple Box Collision`。您现在应该会看到一个用绿色勾勒出的盒子包围着箱子。\n\n接下来我们需要做的是为箱子选择一种材质。`Content\
  \ Browser` 中可用的任何材质都可以使用：\n\n![设置并使用我们的新 3D 资产](img/BO5189_04_11.jpg)\n\n使用 Details\
  \ 面板为盒子添加材质\n\n1.  返回 `Content Browser` 并导航到 `Starter Content` 文件夹内的 `Materials`\
  \ 文件夹。\n\n2.  点击您想用于箱子的材质。我选择了 `M_Metal_Copper`。\n\n3.  高亮显示材质后，返回 `Static Mesh`\
  \ 编辑器，点击 `Details` 面板中 `LOD 0` 部分材质球旁边的小箭头。在 Unreal Engine 中，每当您看到这样的小箭头，点击它将允许您使用在\
  \ `Content Browser` 中选中的任何内容。\n\n4.  您的材质将出现在箱子上。请随意尝试几个不同的选项，找到您认为最合适的一个。\n\n对于本书后面我们将创建的下一个游戏资产，我们将使用自定义材质，真正让物体脱颖而出。一旦完成材质设置，只还有一个设置需要更改。Unreal\
  \ 倾向于生成自己的 UV 通道来存储光照信息。然而，回在 第 3 章 *是时候自定义了！* 中，我们使用 Blender 的 Lightmap Pack 功能创建了自己的\
  \ UV，我们想告诉 Unreal 使用它，因为我们的要好得多：\n\n![设置并使用我们的新 3D 资产](img/BO5189_04_12.jpg)\n\n\
  告诉 Unreal 使用我们在 Blender 中创建的 Lightmap\n\n以下是如何为物体生成 Lightmap：\n\n1.  在 `Details`\
  \ 面板的 `LOD 0` 部分下，找到 `Generate Lightmap UVs` 选项并将其关闭。这告诉 Unreal 我们不想让它创建自己的 UV 通道来存储光照信息。\n\
  \n2.  找到 `Source Lightmap Index` 设置。这告诉 Unreal 在进行光照计算时使用哪个 UV 贴图。将此设置更改为 `1`。\n\
  \n3.  最后，转到 `Destination Lightmap Index` 并将其也更改为 `1`。这告诉 Unreal 在我们创建的 UV 通道上记录光照和阴影信息。\n\
  \n完成！我们的箱子已准备好使用：\n\n![设置并使用我们的新 3D 资产](img/BO5189_04_13.jpg)\n\n我们关卡中的最终箱子。恭喜！\n\
  \n花几分钟时间用我们的新游戏资产替换货舱中的几个立方体。为了真正增加一些变化，尝试将其中几个放大或缩小。一旦区域装饰得让您满意，请记得保存关卡并按下 `Build`\
  \ 按钮。现在进入关卡看看这个空间吧！\n\n## 总结\n\n\n\n\n在本章中，我们了解了如何使用 FBX 文件格式将游戏资产从 Blender 导出并导入\
  \ Unreal 的过程。FBX 是游戏行业中使用的一种文件格式，因其不仅能存储物体几何体的信息，还能存储纹理、材质和动画信息而广受欢迎。我们从 Blender\
  \ 导出了 FBX 文件，并使用内容浏览器将其导入 Unreal。导入后，该物体仍然需要碰撞网格体和材质。最后，我们成功将箱子放入关卡，并用全新的游戏资产替换了许多基础基元。恭喜你完成了游戏美术管线的首次完整流程！在开始下一关之前，花点时间看看是否还有其他想创建的游戏资产，为我们创建的货轮增加更多细节。在下一章中，飞船将带我们进入一个新关卡，玩家将面临新的危险，而你将面临新的设计挑战。让我们继续前进！\n\
  \n既然我们已经体验了 Unreal 的美术管线，让我们把关卡设计提升到一个新高度。在本章及后续章节中，我们将沿用之前的流程，但会融入更多元素，例如更多关卡脚本、胜利条件、动画游戏资产等。我们将进一步开发游戏故事，并通过关卡设计和环境选择向玩家传达信息。最终将呈现一个在货轮上开始构建的生存恐怖氛围基础上进一步发展的第二关。本章将涵盖以下主题：\n\
  \n*   规划更复杂的关卡\n*   通过灰盒搭建关卡以优化资产创建\n*   关卡设计原则\n*   高级脚本技术\n*   胜利与失败条件\n"
- "## 规划更复杂的关卡\n\n在货轮关卡中，我们让玩家置身于一个科幻世界，一个神秘箱子成为了通往更大冒险的门户。进入第二关时，我们需要回答几个问题：\n\n\
  *   那艘货轮来自何处？\n*   那个箱子提供了什么线索？\n*   下一个拐角后潜伏着什么危险？\n\n对我而言，答案源自我受到的娱乐作品影响。我是科幻小说的狂热读者，也喜欢\
  \ *H.P. Lovecraft* 等作家创作的智力恐怖小说。作为一名玩家，我喜欢《Dead Space》、《Mass Effect》和《FEAR》等游戏。因此，汲取这些灵感，我构思了箱子中装着从古老种族掠夺来的某件神器。这件神器以某种方式导致了我们货轮船员的失踪。然而，检查箱子后留下了一条线索：一位设在采矿空间站的进出口经纪人的名字，该空间站离玩家发现废弃货轮的地方不远。返回舰桥后，玩家将航向设定为该空间站。\n\
  \n万事开头难，我们将从纸上草图开始制作这一关：\n\n![规划更复杂的关卡](img/BO5189_05_01.jpg)\n\n就像货轮一样，我们在纸上开始设计空间站。\n\
  \n对于空间站，我们的设计核心在于向玩家传达故事，并营造紧张且令人不安的氛围。就像他们抵达的货轮一样，空间站完全空无一人，没有任何其他人类生命迹象。然而，这为我们设计师提供了通过脚本事件讲述故事的绝佳机会。\n\
  \n观察地图，我们可以提前规划，指定不同区域作为增加玩家紧张感并引导玩家走向最终目标——市场中的经纪人摊位——的节点。既然我们想避免标识和文本提示等显而易见的线索，就可以在地图上指定一些区域用于脚本事件。这些是我们将使用\
  \ `Blueprints` 与玩家沟通并给出故事下一步线索的区域。在空间站中，这些可能是广播系统的自动播报（音频线索）、因损坏而坍塌的走廊段（使用触发粒子事件），或创建供玩家观赏且能突出下一目标的景观（利用关卡几何体）。让我们看看地图。玩家从着陆舱开始，必须通过气闸和安检。在这里，我们可以利用灯光、声音和一些粒子系统制造一场玩家必须逃离的故障。这绝非致命，但确实传达了一个信息：空间站没有工作人员，例行维护可能已经有一阵子没做了。接着，玩家步入一条观景长廊。这可能是一个机会，向玩家展示更大规模空间站的全景，并突出下方经纪人店铺的位置。这会让玩家明白他们需要找到通往市场的路，并让他们觉得关卡比可游玩区域大得多。然后玩家会前往电梯，但电梯也会故障，坠落至井底，迫使玩家走楼梯。当他们最终进入经纪人的摊位时，应该已经处于紧张状态，随时准备应对一切。请随意发挥，创建你对我们脚本事件的理解，甚至再添加几个。\n\
  \n现在让我们进入灰盒搭建阶段。\n\n### 提示\n\n在本章中，我将更多地探讨设计原则，将实际的灰盒搭建留给你，读者。在完成 第 2 章 *《Starting\
  \ Our First Project》* 后，我觉得你已打下坚实基础，能够胜任关卡布局工作。\n\n## 通过灰盒搭建关卡以优化资产创建\n\n回到 第 2\
  \ 章 *《Starting Our First Project》* 中，我们使用了一种称为灰盒搭建的方法来构建关卡模型。这样做有两个原因。首先，我们想为目标玩家群体创建一个简单的模型用于测试。其次，我们想搞清楚自定义游戏资产该做多大，以及放在哪里。通过这个过程，我们能快速得到一个可工作的原型。对于这一关，我们将做同样的事，但也会关注我们希望玩家去往何处以及如何到达。这意味着要使用\
  \ `blocking volumes`。\n\n阻挡体积本质上是关卡中的隐形墙。设计师用它们确保玩家不会卡在关卡的某些部位，也不会直接跳过栏杆而错过重要的脚本事件。在我们的案例中，我们不希望玩家掉入空间站的停靠区，也不希望他们直接跳过观景长廊的栏杆。前者会导致卡住（我们只能杀死他们来解卡），后者会导致玩家跳过脚本电梯事件。通过使用阻挡体积，我们可以保证玩家获得流畅的游戏体验。\n\
  \n### 提示\n\n重要的是要考虑何时何地使用阻挡体积，并节制地使用它们。我们都玩过这样的游戏：明明看起来可以进入的区域，却被隐形墙挡住了。我至今仍记得那种挫败感……\n\
  \n让我们添加一个阻挡体积，防止玩家直接翻越栏杆：\n\n![通过灰盒搭建关卡以优化资产创建](img/BO5189_05_02.jpg)\n\n添加阻挡体积。\n\
  \n阻挡体积放入关卡的方式与 BSP 笔刷非常相似：\n\n1.  在 Unreal 中，点击 `Modes`（模式）面板中的 `Volumes`（体积）选项卡。\n\
  2.  选择 `Blocking Volume`（阻挡体积）并将其拖入关卡。\n3.  默认形状是一个盒子。让我们调整它以创建一个有效的屏障，防止玩家跳出观景长廊。在\
  \ `Details`（细节）面板的 `Brush`（笔刷）部分，将 `X` 改为 `1600`，`Y` 改为 `30`，`Z` 保持 `200` 不变。\n\
  4.  移动形状使其与栏杆顶部对齐。\n\n\n\n\n## 使用阻挡体积和 BSP 进行白盒搭建\n\n阻挡体积也可用作我们创建资产的碰撞网格体。例如，我们经常使用\
  \ `Architecture` 文件夹中的柱子资产来代表柱子或类似的从地板到天花板的构件。通过使用箱状的阻挡体积，我们可以让创建的任何自定义资产占据相同的空间，同时能够创建真正自定义的形状，例如由触手组成的柱子。\n\
  \n在白盒搭建期间，我们可以使用的另一种技术是配合 `BSP` 使用减法刷子来创建自定义形状。`BSP` 是我们熟悉的东西。当我们将一个箱子 `BSP` 刷子放入关卡时，它会创建一个箱子。这默认使用加法刷子，并在我们的关卡中创建该形状。`细节`\
  \ 面板允许我们更改箱子的大致尺寸，但别无他法。\n\n减法刷子则完全相反：\n\n![为更好的资产创建而对关卡进行白盒搭建](img/BO5189_05_03.jpg)\n\
  \n*在细节面板中将刷子从加法更改为减法*\n\n减法刷子允许我们像使用饼干切割机一样使用刷子的形状来创建门洞、孔洞等。请记住，这仅适用于加法和减法 `BSP`\
  \ 刷子。你无法使用减法刷子在静态网格体上切割孔洞。\n\n### 使用减法 BSP 刷子创建窗户\n\n让我们为安检站创建一个窗户：\n\n1.  点击 `模式`\
  \ 面板的 `BSP` 选项卡，将一个 `Box` 拖入关卡。在 `细节` 面板中，将 `X` 改为 `20`，`Y` 改为 `800`，以便覆盖两个墙体段的空间，将\
  \ `Z` 改为 `400` 以适应与墙体段相同的垂直空间。\n\n2.  将新刷子放入安检站我们想要窗户的那个墙体段位置。\n\n3.  从 `模式` 面板再拖入一个\
  \ `BSP` `Box`。对于这个刷子，我们将 `X` 设为 `30`，使其比墙体稍宽，`Y` 设为 `600`，`Z` 设为 `200`。\n\n4.  最后，将\
  \ `刷子类型` 从 `加法` 改为 `减法`：\n\n    ![为更好的资产创建而对关卡进行白盒搭建](img/BO5189_05_04.jpg)\n\n\
  \    *使用减法刷子的最终结果。现在我们有了一个窗户！*\n\n5.  拖动这个刷子使其与墙体刷子相交。这应该会创建出我们想要的孔洞。请记住，如果你想复制这个刷子在关卡的其他地方使用，必须同时选中两个刷子才能获得正确的效果。\n\
  \n## 关卡设计原则\n\n在构建游戏关卡时，了解如何使用工具很重要，但这并不是优秀关卡设计师所需知道的唯一事情。游戏关卡与玩家进行沟通，告诉他们关于故事和背景设定的信息，同时也传达目标、选项和其他游戏信息。我曾听过一位在游戏行业构建关卡多年的设计师做的一个精彩演讲。他提到，玩家应该能够在关闭游戏\
  \ HUD 的情况下导航关卡，仅依赖他们在关卡设计中发现的线索。为了让玩家能够做到这一点，关卡必须构建得清晰高效，利用清晰的视线和景观将玩家引导至最终目标。自从听到这个观点后，我尝试将这些理念融入我创建的每一个关卡中。\n\
  \n让我们谈谈其中的一些要点：\n\n![关卡设计原则](img/BO5189_05_05.jpg)\n\n*我们空间站关卡的鸟瞰图*\n\n构建清晰高效的关卡听起来很棒，但这到底意味着什么？一个清晰的关卡没有干扰元素，也没有服务于故事、环境或关卡目标没有任何实际用途的额外区域。玩家可能会觉得这些区域令人困惑，并花费时间寻找它们的重要性，而实际上根本没有。在设计和构建关卡时，始终要问自己关卡的每个部分是否增加了玩家体验，还只是为了增加关卡复杂度而存在的干扰项。效率也很重要。游戏设计有许多约束：硬件约束（如内存和处理速度）、预算约束、时间约束和生产约束。作为设计师，最大化利用资源以创造尽可能引人入胜的玩家体验非常重要。对于我们这样的小型游戏开发者，这可能意味着高效地利用时间，并找到在不牺牲质量的前提下偷工减料的方法：\n\
  \n![关卡设计原则](img/BO5189_05_06.jpg)\n\n*俯瞰市场。我们能在窗外添加什么？*\n\n构建关卡时，还必须考虑玩家在导航每个区域时所看到的内容。玩家的视线为他们提供了在我们设计的空间中导航的选项，我们可以利用它们引导玩家走过我们预定的路径。这将确保玩家按照我们设计的方式体验一切。在我们的空间站设计中，我们限制了玩家在关卡推进过程中能看到的路径。当他们进入空间站时，只知道一条通往安检站的路径，在那里他们体验我们的脚本事件。随后，他们获得了一条视线，引导他们看到外部环境和空间站市场的美丽景观。\n\
  \n在这里，他们可以自由地探索所见的一切：\n\n![关卡设计原则](img/BO5189_05_07.jpg)\n\n*探索市场。一个供玩家游玩的绝佳空间！*\n\
  \n玩家还被展示了关卡的最终目标——中介商店冒着烟的废墟，随时准备供他们随心所欲地探索。总之，视线是一种强大的工具，可以控制玩家的进度，向他们提供选项，并赋予他们到达关卡目标的能力。\n\
  \n最后再提醒一次：当你进行白盒搭建时，请记得让家人、朋友和目标受众为你试玩。他们的见解很宝贵，能增加你的游戏成功的几率！\n\n## 高级脚本技术\n\n随着关卡白盒搭建接近完成，是时候开始考虑那些脚本事件了。为关卡编写脚本事件可以极大地丰富任何关卡，可以简单到触发声音或粒子效果，也可以复杂到完全脚本化的过场动画或小游戏。虚幻引擎\
  \ 4 赋予我们使用灵活的 `Blueprint` 系统以可视化方式编程这些序列的能力。我们在 第 2 章 *开始我们的第一个项目* 中已经为简单的门和电梯使用过\
  \ `Blueprint`。现在我们将在此基础上设计和编程灵活的脚本事件。\n\n那么如何开始呢？设计脚本事件与我们之前构建的动画系统并无二致。每一个都始于一个事件，该事件导致几个不同的动作按顺序触发。诀窍在于能够理清逻辑顺序，以便获得玩家预期的效果。例如，普通的游戏爆炸包含几个不同的动作：\n\
  \n1.  等待目标对象受到伤害。\n2.  一旦伤害达到一定数值，创建伤害半径并触发烟雾、火花、火焰和爆炸粒子发射器。\n3.  播放爆炸声音！\n4.  利用飞散的粒子作为掩护删除原始对象。\n\
  5.  在原位生成原始资产的损坏版本。\n\n正如这里描述的爆炸一样，任何事件都可以分解为具体的事件并进行模拟。那么让我们思考一下安检站事件需要什么。我们需要让玩家感到受到威胁，并传达一种恐慌感。我认为我们可以通过尝试几种不同的方法来实现这一点，它们组合在一起将产生预期的效果。以下是一些不分先后顺序的想法：\n\
  \n*   灯光闪烁\n*   房间充满烟雾\n*   火花！\n*   某种巨大的噪音\n*   猛然关上门\n*   猛然关上窗\n*   着火！\n\n\
  ### 提示\n\n\n\n\n\n# 高级脚本技巧\n\n## 头脑风暴与规划\n\n使用便利贴进行头脑风暴是快速产生此类想法的绝佳方法。便利贴让想法变得可移动，以便您可以轻松地将它们按您选择的任何顺序进行组织。\n\
  \n现在有了几个很棒的想法！下一步是将它们按可编程的逻辑顺序排列。计算机无法执行我们未明确指示的任何操作，因此我们的指令必须非常清晰。以下只是我可能对指令进行排序的一个示例：\n\
  \n1.  为门窗添加关闭动画。\n2.  发出某种巨大的噪音。\n3.  触发烟雾发射器。\n4.  触发火花发射器。\n5.  给玩家播放某种线索，让他们知道该怎么做才能逃脱。\n\
  \n这看起来是个相当可靠的计划。下一步将是向我们的关卡添加那些额外元素。安检走廊的每个入口都需要一扇门，每扇窗户都需要一个百叶窗，依此类推。\n\n## 构建门与百叶窗\n\
  \n### 构建第一扇安检门\n\n![高级脚本技巧](img/BO5189_05_08.jpg)\n\n1.  对于那三扇猛然落下的安检门，我从 `Architecture`（建筑）文件夹中获取了一个\
  \ `Wall_400x200` 部件，并将 `X` 轴的 `Scale`（缩放）调整为 `0.4`，`Z` 轴调整为 `1.1`。然后我将它们分别重命名为 `Sec_Door1`、`Sec_Door2`\
  \ 和 `Sec_Door3`。请记住也要将 `Mobility`（移动性）属性设置为 `Movable`（可移动）。\n2.  我将每扇门定位在各自的门框上方，以便在事件期间能够猛然落下：\n\
  \n![构建安检百叶窗](img/BO5189_05_09.jpg)\n\n### 构建安检百叶窗\n\n3.  对于那两个安检窗百叶窗，我使用了一个 `Wall_400x400`\
  \ 部件，并将 `x` 轴的 `Scale` 属性调整为 `1.5`，`z` 轴调整为 `0.5`。我将它们的名称改为 `Sec_Win_Shutter1` 和\
  \ `Sec_Win_Shutter2` 以便于识别，并将它们的 `Mobility` 设置为 `Movable`。\n\n## 添加细节\n\n### 放置粒子发射器\n\
  \n![放置粒子发射器](img/BO5189_05_10.jpg)\n\n1.  粒子发射器是空间中发出光线、火花，甚至是静态网格体（如果我们愿意）的点。它们是使用\
  \ Unreal 的 Cascade 粒子编辑器创建的，尽管 `Starter Content`（初始内容）文件夹中的 `Particles`（粒子）子文件夹里有一些很棒的现成发射器可供我们使用。在这里，我在每扇门处使用了一个\
  \ `P_Smoke` 发射器，在左侧窗户附近使用了一个 `P_Sparks` 发射器。对于所有发射器，我在 `Details`（细节）面板中关闭了 `Auto\
  \ Activate`（自动激活）选项，以便我们能控制它们何时触发。\n\n这样的陷阱很棒，但我们仍然需要一些方法让玩家逃脱：\n\n![安检办公室视图](img/BO5189_05_11.jpg)\n\
  \n### 创建逃生路线\n\n2.  过几秒钟后，让安检室的门发生故障并爆炸，让玩家能够到达安检覆盖按钮！我在门上方放置了几个 `Point Lights`（点光源），一个红色，一个绿色，用来指示门正在打开（在\
  \ `Details` 面板中关闭红光的 `Visible`（可见）属性），并使用 `Content Browser`（内容浏览器）`Props`（道具）文件夹中的\
  \ `Box Trigger`（盒子触发器）和 `SM_MatPreviewMesh_02` 构建了覆盖按钮。为了确保线索对玩家清晰明了，我在按钮上方放置了一个\
  \ `Text Render`（文本渲染）对象，显示 `Disengage Security Lockdown`（解除安检封锁）。\n\n## 在关卡蓝图中编写事件脚本\n\
  \n所有部件就位后，我们准备开始编写事件脚本。点击视口上方的 `Blueprints`（蓝图）按钮并选择 `Open Level Blueprint`（打开关卡蓝图）来打开\
  \ `Level Blueprint`。对于这种程度的脚本编写，我们还将转到工具栏中的 `Window`（窗口）按钮并开启 `Palette`（调色板）窗口。这使我们能够访问可自定义的节点\
  \ `Favorites`（收藏夹）列表和 `Find a Node`（查找节点）搜索框，这是构建新蓝图序列时的绝佳工具：\n\n![开始关卡蓝图](img/BO5189_05_12.jpg)\n\
  \n### 开始关卡蓝图\n\n1.  选择蓝图区域中位于的两个默认节点并按 `Delete`（删除）。此序列不需要它们。\n\n### 设置触发事件\n\n\
  2.  我们需要一个事件来启动我们的序列。回到关卡中，在安检处放置一个 `Box Trigger`，大约在走廊的中间位置。将其 `Box Extents`（盒子范围）属性设置得足够大，以至于玩家无法错过。这将使玩家在完全进入走廊后触发安检封锁。在\
  \ `Level Blueprint` 内部，`Right-click`（右键点击）并选择 `Add Event for Trigger Box`（为触发盒添加事件），选择\
  \ `Collision`（碰撞），然后选择 `Add OnActorBeginOverlap`（添加 OnActorBeginOverlap）。请记住，您的触发盒编号可能与我的不同：\n\
  \n![用于交换彩灯的完整蓝图](img/BO5189_05_13.jpg)\n\n### 切换警示灯\n\n3.  现在，我们需要改变警示灯的颜色。为此，我们将添加几个不同的节点。在\
  \ `Palette`（调色板）窗格的 `Find a Node` 部分的搜索框中，输入 `Do Once`（执行一次）。此节点的工作原理类似于一个闸门，确保其后的内容仅运行一次。在这里，我们用它来确保用于启动序列的触发器不会被触发多次。接下来，搜索\
  \ `Toggle Visibility`（切换可见性）节点。将两个该节点拖入蓝图并按图所示连接。这些节点的目标将是我们的红灯和绿灯。我们要确保显示我们想要的灯并隐藏不想要的灯：\n\
  \n![收集门窗的初始位置](img/BO5189_05_14.jpg)\n\n### 收集初始位置\n\n4.  是时候让门窗猛然关闭了！这部分看起来有点复杂，但实际上就像我们在\
  \ 第 2 章 *启动我们的第一个项目* 中所做的那样。我们将使用 `Timeline`（时间轴）同时关闭我们创建的所有安检门。首先我们需要做的是保存所有要制作动画的物体的初始位置。没有这一步，门窗会猛然落下，然后继续穿过地板！为了防止这种情况发生，我们从门的初始位置制作其位置动画。首先，创建一些向量变量来保存三扇安检门和两扇窗户的数据。接下来，我们将构建一个特殊的序列来处理收集这些数据。从\
  \ `Event BeginPlay`（BeginPlay 事件）事件开始，并将其连接到每个变量的 `Set`（设置）节点。然后将 `Get Actor Location`（获取演员位置）节点连接到每个\
  \ `Set` 节点，每个门和窗作为目标。这将获取每个部件的位置，然后将其设置为变量，以便我们在下一步中为其制作动画：\n\n![用于关闭门窗的时间轴](img/BO5189_05_15.jpg)\n\
  \n### 使用时间轴为门窗制作动画\n\n5.  现在添加 `Timeline` 节点并双击打开它。我们想要使用 `Vector Track`（向量轨道）将门和窗百叶窗滑落到位。请记住，在\
  \ `Vector Track` 中，我们可以为所有三个移动轴制作动画，但这里我们只想使用 `Z` 轴，因此需要一些整理。按住 `Shift` 键并点击红线。这将在\
  \ `X` 轴上添加一个关键帧。现在点击新关键帧并将其拖出视野。对绿线做同样的操作，将 `Y` 轴拖出视野。这留给我们蓝线，即 `Z` 轴。在那里创建一个关键帧，并确保其时间和值均设置为\
  \ `0`。添加第二个关键帧并将时间设置为一个快速的值。我用了 `0.25`。将值设置为 `-210`。这将把它们滑落到位，阻挡玩家的逃生路线。在为 `Z` 轴创建关键帧后，您可以随意通过点击其他两个轴上的关键帧并按\
  \ `Delete` 键来删除它们。您也可以使用图表左上部分的按钮来锁定和隐藏这些轴。请务必勾选 `Last Keyframe`（最后一帧）复选框。这会告诉 `Timeline`\
  \ 在序列的最后一个关键帧处停止。\n\n\n\n\n\n## 使用 Set Actor Location 节点移动所有这些门和窗\n\n6. **为了完成动画**，我们需要为每个需要动画的元素，将一个\
  \ `Set Actor Location` 节点连接到 `Timeline` 的 `Update` 部分。这些节点中的每一个都需要适当的目标以及一个要动画移动到的位置。就像在\
  \ 第 2 章 *启动我们的第一个项目* 中一样，我们将使用变量获取每个元素的初始位置，并通过 `Vector + Vector` 节点将其与来自 `Timeline`\
  \ 的 `Vector Track` 相加。按照图示设置每个节点。在底部附近，我使用了一个 `Reroute` 节点来创建所有通往 `Vector + Vector`\
  \ 节点的连接。如果连线开始变得混乱，或者需要将一条连线分离为多根线以便多次使用，可以使用这些节点来重定向连线。`右键单击` 打开菜单，在底部附近找到 `Reroute`\
  \ 节点：\n\n![高级脚本技术](img/BO5189_05_17.jpg)\n\n### 使用 Activate 节点激活所有粒子效果\n\n7. **燃放烟花！**\
  \ 是时候激活我们所有的粒子效果了。我们使用……你猜对了！一个 `Activate` 节点！使用 `Find a Node` 部分搜索此节点并将其拖入蓝图。目标将是每个粒子效果。可以通过返回关卡，按住\
  \ `Ctrl` 键同时选择每一个来轻松创建目标。回到蓝图中，`右键单击` 并选择 `Create Reference to 4 Selected Actors`。将它们插入\
  \ `Activate` 节点的 `Target` 将创建转换节点（显示 `Target` 和 `Particle System Components` 的那些节点）：\n\
  \n![高级脚本技术](img/BO5189_05_18.jpg)\n\n### 使用 Play Sound at Location 播放音效\n\n8. **接下来我们将使用**\
  \ `Play Sound at Location` 来播放我们的 `Sound Cue`。此节点非常直观，它会在我们确定的位置播放从 `Content Browser`\
  \ 中选择的声音。找到此节点并将其连接到现有序列。对于我的声音，我从 `Starter Content` 文件夹的 `Audio` 部分选择了 `Collapse02`。对于位置，我使用了我们之前已存储在变量中的初始位置之一：\n\
  \n![高级脚本技术](img/BO5189_05_19.jpg)\n\n### 切换安保灯并销毁门\n\n9. **我们已进入该序列的最后冲刺阶段。** 使用\
  \ `Delay` 节点，让我们销毁安保办公室的门并切换灯光。`Delay` 节点会在预定时间内停止序列的执行。试玩序列以感受你希望玩家等待多久。`Delay`\
  \ 时间越长，产生的紧张感和恐慌感就越强！经过多次测试，我选择了 12 秒。更长显得太久，更短显得太快。接下来，再次在灯光上使用几个 `Toggle Visibility`\
  \ 节点以恢复绿灯。这个视觉提示将让玩家知道下一步去哪里。为了给玩家一个听觉提示，在通往安保办公室的门的位置播放 `Explosion01` 声音。最后，从 `Find\
  \ a Node` 部分获取一个 `Destroy` 节点。在游戏术语中，`Destroy` 只是 delete（删除）的一个花哨说法（我觉得听起来更好）。用它来删除那扇门：\n\
  \n![高级脚本技术](img/BO5189_05_20.jpg)\n\n### 编程安保覆盖按钮\n\n10. **最后，让我们为安保覆盖按钮编写程序。**\
  \ 该事件实际上包含三个事件。前两个涉及我们创建的用于使按钮工作的触发器。选择关卡并创建一个 `OnActorBeginOverlap` 事件和一个 `OnActorEndOverlap`\
  \ 事件。我们需要的最后一个事件是 `E` 键的键盘输入。可以通过在 `Find a Node` 搜索框中输入 `Input` `E` 来找到它。这些都将连线到一个\
  \ `Gate` 节点，就像我们在货船上的电梯所做的那样。这将要求玩家站在触发器内以打开 `Gate` 并使 `E` 键生效。要完成此序列，将 `Gate` 的\
  \ `Exit` 部分连线到 `Timeline Reverse` 节点。目标可以通过从 `Reverse` 的目标部分拖出连线，打开 `Class`，然后选择你的关卡，最后选择用于控制安保门和窗的\
  \ `Timeline` 来找到。\n\n**测试时间！** 试玩关卡的这一部分，确保一切正常运作。感受戏剧张力！现在是编写电梯序列脚本的时候了。与安保检查站相比，这简单多了！\n\
  \n![高级脚本技术](img/BO5189_05_21.jpg)\n\n## 为电梯序列设置组件\n\n电梯序列的工作方式很像安保检查站序列的缩短版。当玩家走进触发器时，为一扇电梯门制作动画，打开几个粒子发射器，并播放声音。让我们开始吧：\n\
  \n![高级脚本技术](img/BO5189_05_22.jpg)\n\n### 通过添加到关卡初始化序列来获取电梯门的初始位置\n\n1. **既然我们将为此序列使用\
  \ `Timeline`**，创建一个向量变量来保存我们计划制作动画的门的初始位置，并使用与获取安保门初始位置相同的技术进行设置。\n\n![高级脚本技术](img/BO5189_05_23.jpg)\n\
  \n### 编写电梯序列脚本\n\n按以下顺序连接节点：`OnActorBeginOverlap`、`Timeline`、`Set Actor Location`、`Activate`、`Do\
  \ Once`、`Play Sound at Location`。\n\n2. **启动此序列的事件是 `OnActorBeginOverlap`**，使用电梯按钮前的触发器。\n\
  \n3. **接下来，创建一个 `Timeline`** 来稍微移动其中一扇门，让玩家以为门在打开。\n\n4. **使用 `Activate` 节点** 激活电梯门处的烟雾和火花。我还在电梯井底部添加了一个火焰发射器，并稍微打开了那里的门，让玩家看到一旦到达市场，他们可能会遭遇什么。\n\
  \n5. **然后我使用了 `Do Once` 和 `Play Sound at Location` 节点** 来播放爆炸声。`Do Once` 确保音频不会尝试循环播放从而破坏我们想要的体验。\n\
  \n**全部完成！** 测试序列以确保它具有你想要的情感效果。请随意调整不同的粒子效果、声音和时间，直到感觉适合你和你的测试玩家。在下一节中，我们将讨论胜利条件以及如何将我们的两个关卡连接在一起。\n\
  \n# 胜利条件\n\n此时在本书中，我们有两个白盒关卡，每个关卡都包含起点和终点。我们还构建了一段将两者串联起来的叙事。在本节中，我将向你展示如何使用蓝图连接这两个关卡，并允许玩家通过调查货箱从货船关卡前往空间站关卡继续故事。最终，我们将拥有一个游戏演示的骨架，绝对可以通过额外的美术和玩法扩展成一个完整的游戏。\n\
  \n要连接这两个关卡，我们必须回到货船，为我们放置在那里的货箱添加一个触发事件，允许玩家调查它。此触发器将允许玩家加载空间站关卡以继续故事：\n\n![胜利条件](img/BO5189_05_24.jpg)\n\
  \n## 将货船关卡连接到空间站关卡\n\n1. **打开货船关卡并添加两样东西：** 一个围绕我们创建的货箱的 `Box Trigger` 和一个显示“按 `E`\
  \ 键进行调查”消息的 `Text Render`。\n\n\n\n\n## 编程触发关卡转换的按钮\n\n2. 打开**关卡** **蓝图**并找到一个区域开始我们的序列。点击关卡中的新**盒子触发器**并创建一个**OnActorBeginOverlap**事件和一个**OnActorEndOverlap**事件。还要在**调色板**面板中使用**查找节点**工具获取一个输入**E**事件：![胜利条件](img/BO5189_05_25.jpg`)\n\
  \n3. 到现在，这个序列应该对你很熟悉了。将我们刚创建的事件连接到一个**门**节点，以创建一个仅当你在触发区域内时才起作用的事件。\n\n4. 最后，添加**打开关卡**节点。可以使用**查找节点**搜索框找到它。此节点会将玩家传送到我们的新空间站关卡。在**关卡名称**字段中，输入空间站关卡的名称。确保输入的名称正确，否则该节点将无法工作。\n\
  \n现在试玩货船并调查来自箱子的异常读数。这应该会带你到空间站关卡的开始。如果这是一个完成的游戏，我们可能会有加载画面或一些音频在过场中解释故事。记住这样的想法！以后总有时间进行润色和改进。\n\
  \n一切是否感觉开始融会贯通了？\n\n# 总结\n\n在本章中，我们开始了白盒制作一个比之前大得多的关卡的过程，一个神秘的空间站，可能藏有货船船员失踪原因的线索。在原型阶段，我们还创建了两个脚本事件。第一个发生在从停机坪进来的安全检查站，旨在制造紧张感并增强空间站上出了问题的感觉。第二个是一个故障电梯，告诉玩家一定发生了什么事，确定的死亡可能就潜伏在拐角处。但玩家在进出口经纪人的店铺后面发现了什么？在下一章中，我们将回到\
  \ Blender 为这个问题设计答案，并为我们的关卡创建一个新的神秘复杂的游戏资产。\n\n谜团继续！此时，玩家已经回到了我们空间站市场区的进出口经纪人店铺，但他们看到了什么？我们可以走几条不同的路线，比如跨维度传送门、先进军事装备，甚至某种神秘事物。我最喜欢的作家之一一直是*H.P.\
  \ 洛夫克拉夫特*，一位 20 世纪初的恐怖小说作家。他的短篇小说常围绕禁忌知识、邪教、隐藏秘密和致疯恐怖等主题，并经常谈论来自星际之外的古老神祇。如果我们的勇敢英雄偶然发现了一个来自另一个世界的神器，与这样一个吞噬理智的无名星神有关联，会怎样？毫无疑问，繁忙空间站上的进口商可以通过向收藏家出售这种东西发大财。他为什么要关心附带的疯狂故事？那只会增加购买的诱惑力。在本章中，我们将涵盖以下主题：\n\
  \n*   设计我们的资产：灵感与概念艺术\n*   进阶工具：细分、刀切、桥接边循环等\n*   在 Blender 中使用多个形状\n*   跟踪多边形和三角形数量的重要性\n"
- "# 设计我们的资产 – 灵感与概念艺术\n\n正如我之前提到的，来自*H.P. 洛夫克拉夫特*短篇小说，特别是广受欢迎的克苏鲁神话体系中的故事，是我最喜欢的一些怪诞故事。在这些故事中，勇敢的调查员接触到源于疯狂的物体和生物，以及黑暗可怕神祇的仆从。以此为灵感，我们再次转向\
  \ Google 图片搜索更多启发性的文字和图像。快速搜索提供了有趣的想法。古老神祇在艺术中常被描绘为超凡脱俗。触手、尖叫的嘴、多只眼睛、不均匀的体格等被描绘出来，并与更多的人类元素混合。那么我们如何将这些想法融入到一个游戏资产的设计中，使其在遥远未来的空间站上看起来不突兀呢？\n\
  \n是时候绘制我们的概念草图了：\n\n![设计我们的资产 – 灵感与概念艺术](img/B05189_06_33.jpg`)\n\n神器草图\n\n我最初的想法是创建某种容器，像潘多拉魔盒，打开时释放出吞噬周围所有人的邪恶力量。与其做成像箱子或盒子那样方正，我决定创建一个更像蛋形的容器。它会立即在环境中脱颖而出并吸引玩家。神器应该能被打开，以便玩家可能意外释放内部的东西。设计在其开启机制中融入了一些蒸汽朋克元素，以致敬许多*H.P.\
  \ 洛夫克拉夫特*作品所处的时代。最后，还有深海元素，如触手把手、带刺的螃蟹壳外观和全视之眼。这绝对能吸引玩家的注意力！\n\n对于这个资产，我们必须考虑对象如何打开，因为我们将在\
  \ Blender 中为这些元素制作动画。在这个设计中，圆形元素转动并收回固定盖子的活塞，使顶部能够扭开。这些移动部件中的每一个都将被创建，从不同的基础形状开始。\n\
  \n为了确保它适合关卡内的空间，我们将创建一个接近我们使用的现有测试资产大小的资产：\n\n![设计我们的资产 – 灵感与概念艺术](img/BO5189_06_01.jpg`)\n\
  \n测试资产的半径为 60，高度为 60\n\n## 进阶工具：细分、刀切、桥接边循环等\n\n当我们构建这个新资产时，有几个新工具我们需要了解，它们将使我们能够增加神器的细节层次。\n\
  \n现在让我们看看我们将要使用的一些新工具。\n\n## 细分工具\n\n**细分**工具是一个很棒的工具，可用于向模型的某个部分添加更多连接线和多边形以增加细节。通过选择要细分的线或多边形，然后点击**工具**面板中的**细分**工具来使用它。可以通过更改屏幕左下角的**切割数量**字段来调整连接数量：\n\
  \n![细分工具](img/BO5189_06_02.jpg`)\n\n使用细分工具\n\n## 刀切工具\n\n**刀切**工具可用于对物体几何体进行自由切割，非常适合在模型的小部分创建额外的艺术细节。开始使用时，点击**工具**面板中的**刀切**工具，或按*K*。光标将变成一把小刀。点击一次开始切割，然后每次想添加线上的点时点击一下。将鼠标悬停在现有顶点上会使光标变绿，允许你将新线与现有几何体连接。按*空格键*完成切割，或按*E*开始新的切割：\n\
  \n![刀切工具](img/BO5189_06_03.jpg`)\n\n刀切工具非常适合添加细节\n\n## 桥接边循环工具\n\n**桥接边循环**工具是通过连接两条或更多边来创建新多边形的基本工具。我们在删除旧多边形后经常使用它，将几体重构为更实用的形状。使用方法：在**线**选择模式下选择线条，按*W*打开**特殊**菜单，然后选择**桥接边循环**：\n\
  \n![桥接边循环工具](img/BO5189_06_04.jpg`)\n\n桥接边循环非常适合填补形状中的孔洞\n\n## 三角化修改器工具\n\n\n\n\n\
  # 在 Blender 中使用多种形状\n\n我想提的最后一件事是我们在完成模型后将会用到的内容。当我们从 Blender 导出对象并将其导入 Unreal 时，游戏引擎会为了自己的目的将我们所有漂亮的多边形转换为三角形。在大多数情况下，这不会成为问题。Unreal\
  \ 能够很好地处理我们简单的箱子。然而，对象越复杂，Unreal 在导入文件时搞砸它的几率就越大。我们可以在从 Blender 导出之前对对象进行三角化，来协助这一过程。添加\
  \ `Triangulate`（三角化）修改器是在 `Properties`（属性）面板的 `Modifier`（修改器）菜单中完成的。请记住，你必须处于 `Object`（物体）模式才能应用任何修改器：\n\
  \n![Triangulate modifier tool](img/BO5189_06_05.jpg)\n\n`Triangulate` 至关重要，因为大多数游戏引擎反正都要求游戏资产由三角形构成。\n\
  \n有了这些额外的工具，我们应该能够创建一个惊人的神器。是时候开始构建了！\n\n### 提示\n\n别忘了像我们在 第 3 章 *是时候进行自定义了！* 中所做的那样，使用适当的设置来设置你的文件。\n\
  \n现在，让我们从一个圆柱体开始：\n\n![Using multiple shapes within Blender](img/BO5189_06_06.jpg)\n\
  \n从圆柱体开始\n\n让我们从对象的底部开始构建：\n\n1.  如果场景中有初始对象，请将其删除。转到 3D 视口底部的 `Add`（添加）菜单，选择 `Mesh`（网格），然后从选项中选择\
  \ `Cylinder`（圆柱体）。在 `Tools`（工具）面板底部，你可以看到新创建的 `Cylinder` 的选项。将 `Sides`（侧面数）设置为 `24`（使用足以保持圆形的侧面数即可），将\
  \ `Radius`（半径）设置为 `60`，将 `Depth`（深度）设置为 `60`。请记住，这些数值是基于我们在 Unreal 中对白模道具进行的测量。\n\
  \n2.  现在移动我们新创建的对象，使其看起来像是放在握柄上。这将使我们的神器在 Unreal 中拥有一个良好的枢轴点：\n\n    ![Using multiple\
  \ shapes within Blender](img/BO5189_06_07.jpg)\n\n    内插顶部\n\n3.  是时候开始塑造这个东西了。按\
  \ `Tab` 进入 `Edit`（编辑）模式。选择顶部多边形并使用 `Inset`（内插）工具开始赋予其内部结构。我将 `Inset` 值设置为约 `7.10`：\n\
  \n    ![Using multiple shapes within Blender](img/BO5189_06_08.jpg)\n\n    使用挤出来创建神器的内部\n\
  \n4.  接下来，获取由 `Inset` 创建的新多边形并将其 `Extrude`（挤出）向下延伸至底座内部。不要太深；我们想营造出内部空间很大的错觉，但不想让多边形穿透底部。\n\
  \n5.  现在让我们稍微收窄底部。抓取圆柱体的底部多边形并将其 `Scale`（缩放）变小一点。小心不要让内部多边形戳穿侧面。我将其缩放了 `0.75` 倍。\n\
  \n6.  但等等！我们仍然需要一个平坦的部分来连接锁定机制和腿！我们可以通过在中间部分创建一个新的边循环并将其缩放向外来实现这一效果：\n\n    ![Using\
  \ multiple shapes within Blender](img/BO5189_06_09.jpg)\n\n    为腿创建平坦部分\n\n7.  将选择模式更改为\
  \ `Line`（边/线）模式，并选择中间周围的所有线。这可以通过按 `B` 进行框选，旋转视角，再进行一次框选，直到选择了所有线来实现。选中后，点击 `Tools`\
  \ 面板中的 `Subdivide`（细分）工具。这将创建我们的新循环。现在选择构成该循环的所有线并向外 `Scale`（缩放），以再次使底座上部变平：\n\n\
  \    ![Using multiple shapes within Blender](img/BO5189_06_10.jpg)\n\n    倒角边缘\n\
  \n8.  让我们把它变圆润。与我们之前创建的箱子不同，我们现在创建的形状更加圆润和有机。选择构成神器顶部内外边缘的线。按 `W` 打开 `Specials`（特殊）菜单并选择\
  \ `Bevel`（倒角）。在边上使用 `Bevel` 会将其分割成两条边。通过在这两个边循环上使用它，我们可以为形状创建圆润的元素：\n\n    ![Using\
  \ multiple shapes within Blender](img/BO5189_06_11.jpg)\n\n    再次倒角以使形状圆润\n\n  \
  \  使用 `Bevel` 时要小心，我们不希望形状翻转过来！\n\n9.  再来一次 `Bevel`，这部分就算完成了。选择第 6 步中创建的边循环并给它一个\
  \ `Bevel`。这将使底部部分也获得良好的圆润形状。你现在得到的应该看起来像一个花盆的雏形，一个非常阴森的花盆。\n\n10.  看看我们的草图，顶部部分看起来与底部相似。我们可以通过复制底部零件并将其翻转来节省一些时间：\n\
  \n    ![Using multiple shapes within Blender](img/BO5189_06_12.jpg)\n\n    复制底部以创建顶部的起始形状\n\
  \n11.  在 `Object` 模式下，选择底部零件并点击 `Duplicate`（复制），或按 `Shift` + `D`。这将创建一个副本，但它会开始向各个方向移动，而我们希望保持零件对齐。按\
  \ `Z` 将移动锁定在 `Z` 轴上，并将副本向上移动一点。现在使用 `Rotate`（旋转）工具并按 `X` 将旋转锁定在 `X` 轴周围。最后，输入 `180`\
  \ 并按 `Enter` 将其翻转过来：\n\n    ![Using multiple shapes within Blender](img/BO5189_06_13.jpg)\n\
  \n    拉长神器的顶部\n\n12.  使顶部圆润将给我们带来想要的蛋形。抓取新盖子的顶部多边形并将其 `Extrude`（挤出）得更长一些。然后 `Scale`（缩放）新的顶部多边形使其变小一点。它将开始看起来更圆润。重复此步骤一两次，直到获得你想要的形状。\n\
  \n神器现在有了底部和顶部，开始看起来有点像我们的设计图了：\n\n![Using multiple shapes within Blender](img/BO5189_06_14.jpg)\n\
  \n用圆柱体开始齿轮部分\n\n在接下来的几个步骤中，我们将构建锁的第一部分，一个用爪子护身符的齿轮：\n\n1.  我们需要一个基本形状来开始这个零件。由于齿轮本质上具有圆形、扁平的形状，圆柱体应该能很好地开启工作。在\
  \ `Object` 模式下，点击 3D 视口底部的 `Add` 菜单，选择 `Mesh`，并从列表中选择 `Cylinder`。我创建的圆柱体具有 `16`\
  \ 个 `Vertices`（顶点）、`15cm` `Radius`（半径）和 `10cm` `Depth`（深度）。将其移动到模型上的位置并旋转 90 度，使其平贴在神器的底部。部分齿轮将位于神器内部。\n\
  \n2.  现在事情变得更复杂了，让我们使用 `Scene Outliner`（场景大纲视图）来命名对象并隐藏我们不正在处理的对象。点击神器的底部部分。你将在\
  \ `Scene Outliner` 中看到它被命名为 `Cylinder`，之后的一切都是 `Cylinder.001`，依此类推。如果我们双击名称，就可以将对象重命名为我们想要的任何名称。我将我的组件命名为\
  \ `Bottom`（底部）、`Top`（顶部）和 `Gear`（齿轮）。名称在这里不是**超级重要**，但你应该给它们起一些你能认出的名字。你可能还会注意到\
  \ `Scene Outliner` 中的每个对象旁边都有一个眼睛图标。点击这个眼睛会使其闭合，并在 3D 视口中隐藏该对象。这是在处理复杂游戏资产的不同部分时，防止其他零件碍事的好方法。\n\
  \n\n\n\n# 齿轮建模\n\n**3.** 现在让我们做一个 `Inset`（内插）： ![在 Blender 中使用多种形状](img/BO5189_06_15.jpg)\n\
  \n使用 `Inset` 为齿轮添加细节\n\n**4.** 进入 `Edit`（编辑）模式，我们可以开始将这个圆柱体塑造成我们需要的齿轮。隐藏神器的顶部和底部部分，以便你只能看到我们正在处理的部分。选择前面的多边形并按\
  \ `I` 进行 `Inset`（内插）操作。我做了一个 `5cm` 的 `Inset`。然后我们将再次 `Inset` `5cm`。完成后，对背面的多边形做同样的操作：\
  \ ![在 Blender 中使用多种形状](img/BO5189_06_16.jpg)\n\n删除两侧中间的多边形环\n\n**5.** 选择我们刚创建的中间多边形环并按\
  \ `Delete`（删除）。当询问删除什么时，从菜单中选择 `Faces`（面）。就像之前一样，对背面做同样的操作： ![在 Blender 中使用多种形状](img/BO5189_06_17.jpg)\n\
  \n使用 `Bridge Edge Loops`（桥接边循环）创建更多细节\n\n**6.** 是时候使用 `Bridge Edge Loops` 工具了！从\
  \ 12 点钟位置开始，选择内侧多边形上的第一条边及其对应的外侧多边形上的边。按 `W` 并选择 `Bridge Edge Loops` 工具。看那个漂亮的新多边形！现在对圆周上每隔一条边做同样的操作。和之前一样，在齿轮的背面也做同样的操作。在下一步中，我们将构建齿轮的内部多边形：\n\
  \n### 提示\n\n如果创建这些新多边形时出了问题，别担心。只需按 `Ctrl + Z` 撤销并重试！\n\n![在 Blender 中使用多种形状](img/BO5189_06_18.jpg)\n\
  \n使用 `Bridge Edge Loops` 创建齿轮形状的内部部分\n\n**7.** 为齿轮臂添加内部多边形是一个四步骤的过程。我们需要使用 `Bridge\
  \ Edge Loops` 工具在每个孔中创建四个多边形以封闭部件内部： ![在 Blender 中使用多种形状](img/BO5189_06_19.jpg)\n\
  \n挤出并缩放以在齿轮中心创建更多细节\n\n**8.** 齿轮中心旨在看起来像是托住一枚奖章或护身符，这是另一个分多步、少量进行的操作。选择齿轮正面的中心多边形并向外\
  \ `Extrude`（挤出）。接下来，将其 `Scale`（缩小）一点点，开始为将要嵌入的孔创建一个边缘： ![在 Blender 中使用多种形状](img/BO5189_06_20.jpg)\n\
  \n挤出并倒角中心以完成细节\n\n**9.** 现在，对多边形进行 `Inset`（内插）以创建边缘的顶部。通过向内挤出多边形一点并 `Scaling`（缩小）它来创建边缘的其余部分。最后，向外\
  \ `Extrude`（挤出）并对多边形进行 `Bevel`（倒角）以完成形状： ![在 Blender 中使用多种形状](img/BO5189_06_21.jpg)\n\
  \n使用单独挤出添加齿轮齿\n\n**10.** 没有齿的齿轮算什么？要创建齿，我们要 `Extrude`（挤出）齿轮外侧与内侧臂对齐的多边形。我们可以一次性选择所有多边形，并从\
  \ `Tools`（工具）面板中选择 `Extrude Individual`（单独挤出）。这允许我们挤出每个多边形，使齿轮齿大小一致。之后，只需将齿端的每个多边形\
  \ `Scale`（缩小）一点点。我将每个缩放了 `0.75`： ![在 Blender 中使用多种形状](img/BO5189_06_22.jpg)\n\n\
  将背面多边形向外挤出一点，为齿轮连接神器创建位置\n\n**11.** 到了最后润色的时候了！选择背面多边形并向外 `Extrude`（挤出）以创建一个齿轮可以旋转的柱子。这将为齿轮安装在神器底部创建一个良好的接触点。\n\
  \n为了打开，神器使用活塞来抬起盖子。设计要求在物体底部周围间隔放置七个活塞。我们在这里要偷个懒，只创建一个活塞，然后复制它来创建另外六个。\n\n### 提示\n\
  \n关于 3D 建模，我学到两件大事。第一是聪明工作比努力工作更重要。第二是有时我们构建东西只是为了让它们看起来很酷！\n\n既然活塞本身是圆的，我们再次从老朋友圆柱体开始。让我们开始吧！\n\
  \n# 活塞建模\n\n**1.** 创建一个新圆柱体。我将我的设置为 `32` 个 `Vertices`（顶点），`3.75cm` `Radius`（半径），以及\
  \ `15cm` 的 `Depth`（深度）： ![在 Blender 中使用多种形状](img/BO5189_06_23.jpg)\n\n从圆柱体开始，使用\
  \ `Loop, Cut, and Slide`（循环切割滑移）添加两个新的边循环\n\n**2.** 为了创建更宽的中间部分，选择所有中间的多边形并使用 `Loop,\
  \ Cut, and Slide` 工具在中心周围添加两个新的边循环。再次点击以确认切割。现在点击 `Tools` 面板中 `Extrude` 下拉菜单并选择\
  \ `Region (Vertex Normals)`（区域（顶点法线））。这将使所有多边形从中心向外均匀挤出。\n\n**3.** 让我们把底部弄圆。`Extrude`（挤出）活塞的底部多边形，然后对其使用\
  \ `Bevel`（倒角）工具。这应该会给我们一个漂亮的圆头： ![在 Blender 中使用多种形状](img/BO5189_06_24.jpg)\n\n为活塞添加边缘\n\
  \n**4.** 为了增加细节，给活塞顶部加个边缘，就像我们对齿轮正面做的那样。将顶部多边形 `Extrude`（挤出）一点点，然后 `Inset`（内插）一点，最后将多边形\
  \ `Extrude`（挤出）回活塞内部： ![在 Blender 中使用多种形状](img/BO5189_06_25.jpg)\n\n创建一个新圆柱体并定位它，使其看起来像是从底部活塞部件延伸出来的\n\
  \n**5.** 现在活塞必须伸展以将盖子抬得足够高，以便里面那个阴险的东西能出来。我们可以通过创建一个伸缩部分来抬起盖子来实现这一点。你可能会觉得这听起来很难，但记住，要聪明工作，别笨干。我们可以通过创建第二个圆柱体从第一部分延伸出来来创建这个部分。创建一个\
  \ `32` 个 `Vertices`（顶点），`3cm` `Radius`（半径），`13cm` `Depth`（深度）的圆柱体。将其与我们活塞的底部对齐。你可以按\
  \ `Z` 切换到线框视图以获得更好的视野。再次按 `Z` 返回实体视图： ![在 Blender 中使用多种形状](img/BO5189_06_26.jpg)\n\
  \n完成的活塞\n\n**6.** 为了将其升得足够高，我们需要给活塞添加几个更多的部分。获取第一部分并 `Duplicate`（复制）它。然后向上移动以与最后一部分的顶部对齐。最后将其缩放至\
  \ `0.75`。要制作下一部分，重复上述步骤。你会得到三个部分，当它们向下移动时，会整齐地嵌套在一起。当我们为神器开合制作动画时，我们将展开和压缩这些部分，以产生它伸缩向外的错觉。\n\
  \n**7.** 为了完成活塞，`Duplicate`（复制）我们创建的第一个部分并使其成为顶部： ![在 Blender 中使用多种形状](img/BO5189_06_27.jpg)\n\
  \n在神器周围复制活塞，使总共有七个\n\n**8.** 所有活塞部件完成后，抓取你完成的活塞并在神器周围以等距间隔 `Duplicate`（复制）它，类似于图片中的样子。\n\
  \n活塞就做完了！只剩下最后一组主要部件需要完成了，在我看来它们是最有趣的：触手！设计要求触手用作手柄和腿，赋予神器一种异世界的感觉。为了制作这些怪诞的创造物，我们将使用\
  \ `Bezier Curve`（贝塞尔曲线）和一些修改器的组合，沿着路径复制一段触手。这还有一个额外的好处，就是让它们灵活且易于摆姿势。\n\n进入下一步！触手从一个基本立方体开始：\n\
  \n![在 Blender 中使用多种形状](img/BO5189_06_28.jpg)\n\n用立方体开始触手\n\n触手时间到！让我们完成我们创作的最后一部分：\n\
  \n\n\n1. 首先创建一个**立方体**，其**半径**为`5cm`来开始制作触手；我知道它不是圆柱体，但请耐心听我解释。选择穿过立方体中心的四条线，然后点击**细分**将立方体切成两半。\n\
  \n2. 选择立方体右侧的所有多边形并删除它们。现在通过点击**属性**面板中的扳手图标来添加**镜像**修改器，以打开**修改器**菜单。点击**添加修改器**下拉菜单并选择**镜像**。与第\
  \ 2 章《开始我们的第一个项目》不同，我们暂时保持其开启状态，然后再应用它：\n![在 Blender 中使用多种形状](img/BO5189_06_29.jpg)\n\
  \n使用镜像修改器使立方体对称\n\n3. 现在我们将通过倒角立方体的角来制作触手。使用**倒角**工具给各个角添加一些圆角，直到看起来更有机一些。你的可能和我的看起来略有不同，这没关系！我用了大约八到十次倒角。\n\
  \n4. 该应用**镜像**修改器了。返回物体模式并点击**应用**：\n![在 Blender 中使用多种形状](img/BO5189_06_30.jpg)\n\
  \n创建一条贝塞尔曲线。我们的触手片段将沿着曲线复制以创建最终形状\n\n5. **贝塞尔曲线**是具有手柄的曲线，可以移动手柄来创建优雅的弯曲和曲线。这为我们的触手提供了结构。切换到**物体**模式，使用**添加**菜单，选择**曲线**，然后选择**贝塞尔**。使用**移动**和**旋转**工具将其移动到触手片段旁边。\n\
  \n6. 剩下的有趣部分都在**修改器**菜单中。在触手物体上添加一个**阵列**修改器。阵列允许我们创建物体的多个副本，通常呈形状或线条排列。在这种情况下，我们将用它沿着**贝塞尔曲线**创建更多触手段。在修改器中，将**适配类型**改为**适配曲线**，并在下一个框中选择**贝塞尔曲线**。还要勾选**合并**和**首尾**旁边的复选框；这将改善我们的结果。如果你的触手片段复制方向很奇怪，像我的一样，请更改**相对偏移**下的**X**、**Y**、**Z**数值，直到获得你想要的结果。\n\
  \n7. 为了完成触手，添加一个**曲线**修改器。在其设置的**物体**部分，选择我们的**贝塞尔曲线**。触手现在完成了！点击**贝塞尔曲线**并进入**编辑**模式。拉伸这两个点，你会看到触手随你移动它们而增长。在**场景属性**面板中，更改**变换**下的**半径**选项可以使触手末端变细。最后，如果你需要更多控制触手，选择**贝塞尔曲线**上的两个点并点击**细分**。这将添加另一个可移动的点，以便更好地弯曲和塑造你的形状：\n\
  ![在 Blender 中使用多种形状](img/BO5189_06_31.jpg)\n\n复制完成的触手，给神器加上腿！\n\n8. 最后，使用你的触手创建神器的腿。将第一个**贝塞尔曲线**点移动到与我们的底部片段接触。然后将其他点移动成你想要的形状。我每条曲线用了四个点。记住，要复制一个触手，你需要同时复制触手片段和**贝塞尔曲线**。\n\
  \n看起来怎么样？如果你在调整**贝塞尔曲线**点时遇到问题，不要放弃！它们起初可能难以操作，但结果值得所有的麻烦：\n\n![在 Blender 中使用多种形状](img/BO5189_06_32.jpg)\n\
  \n神器拥有超过 7,000 个三角面！\n\n当我们为游戏资产添加这些精彩细节时，有几件事需要留意；幸运的是 Blender 会帮我们做。在 3D 视口顶部，Blender\
  \ 会统计我们资产拥有的**面**（多边形）和**三角面**总数。这很重要，因为游戏引擎显示关卡时，资产的**三角面**越多，引擎工作就越吃力。目前，虚幻引擎中单个静态网格体的三角面限制是\
  \ 10,000，那通常是角色或武器，即玩家会近距离观察的东西。我们有些片段的三角面数相当高。在下一章，我们将在 UV 展开之前，探讨优化神器每个片段的方法。\n\
  \n# 总结\n\n在本章中，我们走过了设计和制作复杂游戏资产的艺术流程，心中有特定的叙事和背景。结果是神器，一种由被遗忘神祇的追随者创造的怪诞恐怖武器。该游戏资产使用多种形状，并考虑了功能和动画进行设计。作为设计的一部分，我们构建了齿轮和活塞，以及一些异世界的触手。这东西肯定是货船船员和我们空间站居民失踪的罪魁祸首。在下一章，我们将探讨\
  \ UV 展开如此复杂物体所需的步骤，为动画准备游戏资产并使其适配虚幻引擎。\n\n神器已准备好释放其地狱般的力量！然而，凭借默认的灰色外观，它看起来并不怎么样。就像我们在第\
  \ 3 章《是时候自定义了！》中所做的那样，我们需要对其进行 UV 展开，以便创建材质并将其带入虚幻引擎。与我们的箱子不同，神器是一个复杂得多的物体，由多个较小的物体组成。这将要求我们使用不同的技术来创建\
  \ UV 贴图，为此我们需要一些不同的工具。我们将不使用智能 UV 投影选项，而是使用自定义接缝来展平神器的不同部分。在本章中，我们将涵盖以下主题：\n\n*\
  \   展开复杂物体\n*   自定义接缝与展开工具\n*   结合其他映射工具使用智能 UV 投影\n*   结合使用不同类型的纹理贴图，以创建更逼真的外观\n"
- "# 展开复杂物体\n\n回到第 3 章《是时候自定义了！》，我们学习了一种称为智能 UV 投影的简单 UV 展开技术，这是一种可以自动展开简单物体的工具。这个过程对我们的箱子效果很好，但箱子不过是一个稍微修改过的盒子。箱子几乎没有曲线，其三角面数仅达到\
  \ 516。神器展开起来需要多费一些功夫。我们的新资产包含 42 个独立片段，拥有高达 54,000 个三角面。要展开这个庞大的游戏资产，我们需要应用几种新工具和技术。\n\
  \n## 标记接缝\n\n接缝是**展开**工具在展开过程中切割物体以将其展平的线条：\n![标记接缝](img/B05189_07_01.jpg)\n\n使用自定义接缝对基础立方体进行\
  \ UV 展开\n\n使用**标记接缝**工具，我们可以控制哪些线成为接缝，从而完全控制该过程。我们还可以使用此工具将接缝隐藏在玩家看不到的地方。这可以是通常隐藏的区域、锐角或折痕处，以及我们使用的材质发生剧烈变化的区域。\n\
  \n## 展开工具\n![展开工具](img/B05189_07_02.jpg)\n\n展开会告诉 Blender 将我们的物体压扁，在我们标记的自定义接缝处分割\n\
  \n制作好接缝后，我们需要告诉 Blender 将物体展平。这通过**基于角度的展开**工具，或简称为**展开**工具来完成。**展开**获取我们的接缝，将它们视为纸盒上的切口，然后将物体压扁。结果并不总是完美的。然而，Blender\
  \ 还有其他几个工具可以修复这些小问题。\n\n## 缝合\n![缝合](img/B05189_07_03.jpg)\n\n缝合允许我们修复展开工具可能产生的一些错误\n\
  \n\n\n# 缝合工具\n\n有时在标记接缝并使用 `Unwrap` 工具时，我们可能希望在 `UV` 贴图中重新连接几个面，例如当我们在物体上放置材质后接缝看起来很明显，我们想要移动它时。`Stitch`\
  \ 工具位于 `UV Unwrap` 窗口的 `UV` 菜单中。使用它是一个两步过程。将两个具有共享边的 `UV` 岛（`UV` 贴图中连接在一起的面的集合）移动得靠近后，我们可以通过在\
  \ `UV` 贴图中点击一条边，观察另一个橙色高亮出现在何处，来检查两个面是否有共享边。如果你点击一条边，另一条也会高亮；这两条边可以被缝合。对齐边缘后，前往\
  \ `UV` 菜单选择 `Stitch`，或按 `V` 键。工具激活后，我们有几个选项。`Tab` 键切换我们是处于边缘模式还是顶点模式进行缝合。`S` 键开启或关闭\
  \ `Snap` 模式。吸附会将第一个选中的 `UV` 岛吸附到第二个选中的岛上。我们也可以选择在中点缝合岛，通过按 `M` 开启 `Midpoint` 选项。最后，按\
  \ `I` 键将交换缝合过程中哪个岛会移动。设置好后，按 `Enter` 将完成缝合。\n\n# 平均岛缩放\n\n![Average Island Scale](img/B05189_07_04.jpg)\n\
  \n`Average Island Scale` 位于 `UV` 菜单中。\n\n有时在展开复杂物体时，展开过程会创建与地图其余部分比例不协调的 `UV` 岛。`Average\
  \ Island Scale` 可以恢复 `UV` 岛的均匀缩放，从而最小化纹理区域的拉伸和模糊。只需选择想要平均的 `UV` 岛，在 `UV Unwrap`\
  \ 窗口底部选择 `UVs` 菜单，然后选择 `Average Island Scaling` 或按 `Ctrl+A`。\n\n# 打包岛\n\n![Pack\
  \ Islands](img/B05189_07_05.jpg)\n\n`Pack Islands` 将尝试排列和缩放你的 `UV` 岛以获得最佳结果。\n\n\
  一旦我们排列好所有 `UV` 岛，就可以使用 `Pack Islands` 工具，Blender 会自动排列和缩放它们以最佳适应 `UV` 空间。这是一个完成\
  \ `UV` 贴图并充分利用 Blender `UV` 空间的绝佳工具。我们将在流程结束时使用它以尝试获得最佳结果。\n\n# 使用智能 UV 投影\n\n在开始展开神器的每个部件之前，我想再次提到智能\
  \ UV 展开器。还记得我们在 第 3 章 *是时候自定义了！* 中使用 `Smart UV Project` 为我们的箱子提供基本 `UV` 贴图吗。这个工具非常适合基本形状，在我们展开更复杂物体的过程中仍有一席之地：\n\
  \n![Using Smart UV Project](img/B05189_07_06.jpg)\n\n智能 UV 投影在我们扩展的工具箱中仍占有一席之地。\n\
  \n由于我们的神器包含 42 个不同部件，`Smart UV Project` 很可能能为其中一些提供优秀的展开方案。然后，使用 `Pack Islands`\
  \ 和 `Average Island Scale` 等工具，我们可以将那些用 `Smart UV Project` 展开的物体添加到我们的整体 `UV` 贴图中。\n\
  \n# 自定义标记接缝\n\n让我们看看如何有效使用接缝。请记住，`Unwrap` 工具本质上会将你的物体展平以进行贴图，沿着我们标记为接缝的线进行分割和展平。对于立方体和圆柱体等不同基础形状，有一些最佳实践需要注意。了解这些标准展开方法可以帮助我们在以后遇到更复杂的形状（如触手）时应对。\n\
  \n## 展开立方体\n\n![Unwrapping Cubes](img/B05189_07_07.jpg)\n\n熟能生巧！立方体和其他基础形状是磨练 UV\
  \ 展开技巧的好方法。\n\n展开立方体时，重要的是尽量减少使用的接缝数量。这就是为什么我们以十字形展开，顶面在中心。让我们试试！\n\n1. 前往 `Scene\
  \ Layout` 下拉菜单，从列表中选择 `UV Editing`。\n2. 选择场景中的默认立方体并进入 `Edit` 模式。从屏幕底部的选择模式中选择 `Line\
  \ selection` 并找到顶面。这将是我们添加接缝时的参考点。\n3. 找到前面。可以通过按小键盘 `1` 或从 `View` 菜单选择 `Front`\
  \ 来实现。这将是我们展开时的第二个参考点：\n   ![Unwrapping Cubes](img/B05189_07_08.jpg)\n   选择前面的两条边并标记为接缝。\n\
  4. 是时候创建第一批接缝了。现在我们知道顶面和前面的位置，让我们在那里添加前两条接缝。选择上图所示的两条边，点击 `Tools` 面板中的 `Shading\
  \ / UVs` 选项卡，然后点击 `Mark Seams` 按钮。这会将线变红。\n5. 现在标记背面的另外两条垂直边。这将创建我们想要的十字布局。\n6.\
  \ 最后，我们要将底面与除前面以外的所有面分离。选择连接底面与侧面和背面的三条边。将它们标记为接缝。\n7. 让我们 `Unwrap`！点击面选择模式并按 `A`\
  \ 选择立方体的所有面。现在按 `U` 键并从菜单中选择 `Unwrap`。你的 `UV` 贴图应该像我们展开的立方体一样。\n\n### 提示\n\n在 `UV\
  \ Layout` 视图中开启 `Stretch` 选项会将选中物体的 `UV` 岛着色为蓝色，使其更易查看。开启 `Keep UV and Edit mode\
  \ mesh selections in sync` 也会有帮助。\n\n## 展开圆柱体\n\n![Unwrapping Cylinders](img/B05189_07_09.jpg)\n\
  \n一个展开的圆柱体。神器的 42 个形状中有许多将与此类似。\n\n展开圆柱体甚至比展开立方体更容易。要展开这种基础形状，在顶面和底面周围创建接缝，然后创建一条从上到下的接缝。试试看，结果是否与上图类似。这有点像给汤罐头贴标签。\n\
  \n### 提示\n\n想要更多 UV 展开练习？学习展开 `Add` 菜单 `Mesh` 部分中的所有基础体是个好练习！\n\n一旦我们掌握了基本基础体的展开，就该开始逐个攻克神器了！\n\
  \n![Unwrapping Cylinders](img/B05189_07_10.jpg)\n\n展开底部的结果。\n\n让我们从底部开始：\n\n1. 在\
  \ `Object` 模式下，选择神器的底部并按 `Shift+H`。这将通过隐藏未选中的所有内容来隔离我们的选择。接下来，前往 `Scene Layout`\
  \ 下拉框并选择 `UV Layout`。这将把屏幕分成两个大视口：一个用于操作物体，另一个用于处理 `UV` 贴图：\n   ![Unwrapping Cylinders](img/B05189_07_11.jpg)\n\
  \   在神器底部标记接缝。\n\n   ### 提示\n\n   你可以通过在 `Object` 模式下选择模型的一部分并按 `Shift+H` 来隔离它。要再次显示所有内容，请使用\
  \ `Alt+H`。\n\n2. 是时候切一些接缝了。展开我们创作的这个部分与展开圆柱体并无二致。让我们先创建接缝以分离内部。通过选择 `Line` 模式，点击边循环的第一条线，按住\
  \ `Alt` 键，然后选择环的第二条线来选择顶部边循环。这将为你选择整个循环。现在前往工具面板并选择 `Shading/UVs` 选项卡。现在点击 `Mark\
  \ Seam`。这会将你选中的边循环高亮为红色，让你知道 Blender 将在你的 `UV` 展开中使用此循环作为接缝。\n3. 现在重复该过程以选择底面周围的边并将其也变为接缝。\n\
  \n\n\n\n## 解包神器零件\n\n### 底部零件\n\n4. 最后，通过选择一条垂直线上的边来完成该过程，该垂直线从顶部标记的边环向下延伸到底部边环。将其也标记为缝合线，就像我们展开圆柱体时所做的那样。\n\
  \n5. 该进行 `Unwrap`（展开）操作了！将你的 `Screen Layout`（屏幕布局）设置为 `UV Editing`（UV 编辑）。现在关闭 `Face\
  \ select`（面选择）模式并按 `A` 选择所有面。最后，按 `U` 并从菜单中选择 `Unwrap`。查看结果，看看它们是否与之前显示的 UV 贴图相似。\n\
  \n底部完成了！不难吧？我们会发现神器的许多零件展开的方式与立方体和圆柱体非常相似。这为每个零件提供了一个简单的起点，省去了摸索如何开始的麻烦：\n\n![展开圆柱体](img/B05189_07_12.jpg)\n\
  \n### 顶部零件\n\n顶部展开的结果\n\n顶部应该就像底部零件一样：\n\n![展开圆柱体](img/B05189_07_13.jpg)\n\n缝合线的标记方式就像底部部分一样，这类似于展开一个圆柱体基元\n\
  \n让我们直接开始吧：\n\n1. 抓取顶部多边形周围的边环，并将其标记为 `Unwrap` 工具的缝合线。\n\n2. 选择顶部和底部零件相接处周围的一个底部边环，并将其也标记为缝合线。\n\
  \n3. 创建一条垂直缝合线来连接另外两条缝合线，类似于我们为底部零件所做的操作。\n\n4. 最后，选择所有面并再次使用 `Unwrap` 工具。结果应该与底部的非常相似。\n\
  \n### 齿轮\n\n现在我们已经展开了顶部和底部零件，让我们换个思路来看看齿轮（switch gears，双关语，意为“换挡/换思路”）：\n\n![展开圆柱体](img/B05189_07_14.jpg)\n\
  \n我们将使用 `Smart UV Project` 来展开齿轮部分\n\n对于这个零件，我们将使用 `Smart UV Project`（智能 UV 投影）。\n\
  \n1. 在 `Object`（物体）模式下，选择齿轮并进入 `Edit`（编辑）模式。确保你的选择模式设置为 `Face`（面）选择，然后按 `A` 选择所有面。\n\
  \n2. 按 `U` 打开 `Unwrap` 菜单并选择 `Smart UV Project`。你的结果应该看起来类似于前面的截图。\n\n### 活塞\n\n\
  这只剩下最后两组物体了，活塞和触手。两者的过程将是相似的。我们将删除除一个以外的所有物体并为其制作 UV 贴图。当我们再次复制已映射的部分来替换被删除的零件时，它们将保留我们所有的\
  \ UV 映射。这才是聪明的工作方式！\n\n![展开圆柱体](img/B05189_07_15.jpg)\n\n展开活塞的底部部分\n\n现在来看看活塞：\n\
  \n1. 选择你想要展开的那组活塞零件，并删除所有其他的。我们稍后会替换它们：![展开圆柱体](img/B05189_07_16.jpg)\n\n    展开方式就像圆柱体一样！\n\
  \n2. 从活塞的底部零件开始。它的 UV 贴图将类似于圆柱体。从顶部开始，选择侧面和顶部相接处的顶部边环，并将其标记为缝合线。\n\n3. 接下来，选择底部开始向外弯曲离开侧面之前的那个边环，并将其标记为缝合线。\n\
  \n4. 最后，打开 `Unwrap` 菜单并选择 `Unwrap`！\n\n5. 现在，删除活塞的顶部并复制底部，因为顶部只是底部的副本。\n\n6. 这一部分涵盖几个步骤。对于每个较小的中间部分，它们只是简单的圆柱体，并使用我们在本章前面提到的方法进行展开。展开所有三个圆柱体部分：![展开圆柱体](img/B05189_07_17.jpg)\n\
  \n    复制活塞零件，就像我们之前做的那样\n\n7. 所有零件展开后，在 `Object` 模式下选择所有活塞零件并复制它们，以替换我们删除的活塞。恭喜！我们现在已经展开了七个活塞！\n\
  \n### 触手\n\n最后，让我们看看展开触手需要什么：\n\n![展开圆柱体](img/B05189_07_18.jpg)\n\n触手的展开。别害怕！\n\n\
  虽然它看起来可能很复杂，但它与圆柱体并没有太大区别。不过，在展开之前我们需要做一些准备工作：\n\n1. 选择一个触手零件并删除其他的。我们将展开一个并复制它：![展开圆柱体](img/B05189_07_19.jpg)\n\
  \n    删除除一个以外的所有触手\n\n2. 我们将使用 `Decimate`（抽稀）修改器来减少触手上的三角形数量。在属性面板中选择 `Modifier`（修改器）菜单（小扳手图标）。点击\
  \ `Add Modifier`（添加修改器）下拉菜单并从选项中选择 `Decimate`。在 `Decimate` 修改器本身中，开启 `Triangulate`（三角化）选项。UE4\
  \ 反正会对其进行三角化，所以为什么不让 `Decimate` 先开始呢。使用 `Decimate` 的目标是找到一个比率，在保持物体整体形状的同时，降低构成物体的三角形数量。现在，点击并拖动\
  \ `Ratio`（比率）选项。我们将通过将比率降低到 `.70` 和 `.80` 之间来 `Decimate` 我们的触手。这将移除约 20-30% 的三角形，并使整个触手更易于\
  \ UE4 处理。一旦你找到了一个看起来不错的比率，点击 `Apply`（应用）：![展开圆柱体](img/B05189_07_20.jpg)\n\n    在触手上标记缝合线。同样，它非常类似于圆柱体。\n\
  \n3. 令人惊讶的是，展开我们的触手不像展开圆柱体那样不同，我们将以大致相同的方式对待它。首先，通过点击 `Modifier` 菜单中每个修改器上的眼睛图标，关闭我们放在触手上的修改器。然后，选择顶部和底部多边形周围的边环并将它们设为缝合线。最后，创建一条垂直缝合线来连接这两条缝合线，按\
  \ `U` 调出 `Unwrap` 菜单，并选择 `Unwrap`。\n\n我们的每个零件现在都已展开并准备就绪！回到 第 3 章，*是时候自定义了！* 我们将形状从\
  \ Blender 导出为 `.FBX` 文件，然后将其导入 Unreal。这一次，我们将了解制作一流材质所涉及的不同类型的纹理贴图，并使用 Allegorithmic\
  \ 的 Substance Painter 创造出一些壮观的效果。\n\n# 使用不同的贴图创建更逼真的外观\n\nUnreal Engine 4 中的材质由几种不同的纹理协同工作组成，以提供逼真的结果。通常，游戏资产的材质至少有两到三种不同的纹理贴图，它们通过不同的数学节点进行操作。这些贴图通常是\
  \ `Diffuse map`（漫反射贴图/基础色贴图）、`Specular map`（高光贴图）和 `Normal map`（法线贴图）：\n\n![使用不同的贴图创建更逼真的外观](img/B05189_07_21.jpg)\n\
  \n神器的着色由漫反射贴图决定\n\n### 漫反射贴图\n\n漫反射贴图是我们绘制在物体上的基本颜色。Unreal 在 `Material Editor`（材质编辑器）中将这些纹理作为物体的\
  \ `Base Color`（基础颜色）接受。这些贴图通常包含直接绘制在物体 UV 副本上的颜色和图案信息，例如在 Photoshop 等程序中。简单来说，这种贴图包含了物体的表面颜色。\n\
  \n### 高光贴图\n\n接下来是高光贴图：\n\n![使用不同的贴图创建更逼真的外观](img/B05189_07_22.jpg)\n\n高光贴图控制光线照射到表面时的行为\n\
  \n高光贴图控制表面看起来有多亮或多暗淡，可以手绘或从不同的程序（如 Autodesk Mudbox）导出。这些贴图是让物体的某些部分看起来像被打磨或清洁过的绝佳方式。查看高光贴图时，贴图中较亮的区域是玩家将看到亮面的地方，而较暗的区域将显得暗淡。\n\
  \n### 法线贴图\n\n最后是法线贴图：\n\n![使用不同的贴图创建更逼真的外观](img/B05189_07_23.jpg)\n\n法线贴图可以在不增加三角形数量的情况下伪造一些细节\n\
  \n\n\n\n# 法线贴图与 PBR 贴图工作流\n\n## 理解法线贴图与 PBR\n\n法线贴图存储了游戏资产高模版本的详细信息，随后可用于在同一游戏资产的低模版本上创建细节。这些详细信息存储在三个颜色通道中——红、绿、蓝，每个颜色对应三维空间中的不同轴向。这些信息随后用于模拟深度，能让游戏资产看起来比实际更加细致。\n\
  \n如今，生成这类纹理贴图的方法有很多。漫反射贴图和高光贴图可以使用 Photoshop 和 GIMP 等程序绘制在游戏资产 UV 的副本上。法线贴图通常需要使用单独的程序创建，例如免费的\
  \ Xnormal。然而，还有一种贴图技术正迅速流行起来。该过程称为**基于物理的渲染**，旨在利用漫反射贴图、高光贴图、粗糙度值和金属度值来模拟光线的真实行为，这与传统方法形成对比。过去游戏美术需要猜测光线如何与他们的游戏角色和物体交互，而\
  \ PBR 允许他们在游戏资产上绘制材质，由计算机模拟光照。结果往往更加准确，且在大多数光照情况下表现良好。PBR 最流行的工具之一是 Allegorithmic\
  \ 的 Substance Painter。\n\n## 修复触手几何体（重拓扑）\n\n在处理 Substance Painter 之前，我们的模型有一个问题需要修复。当我们在触手上使用\
  \ `Decimate` 工具时，可能会产生一些难看的几何体，这对我们的三角形面数没有任何好处：\n\n![Using different maps to create\
  \ a more realistic look](img/B05189_07_24.jpg)\n\n**是时候简化触手的几何体了**\n\n这里有很多我们根本不需要的线条！这个过程称为重拓扑，简称重拓，简单来说就是回到物体上简化几何体，同时保持原始形状。让我们直接开始吧：\n\
  \n1. 选择触手并按 `Shift` + `H` 隔离它，然后再进入 `Edit` 模式。\n\n2. 在 `Properties` 面板的 `Modifier`\
  \ 菜单中，通过点击各自菜单中的眼睛图标，关闭 `Array` 和 `Curve` 两个修改器：\n\n   ![Using different maps to\
  \ create a more realistic look](img/B05189_07_25.jpg)\n\n   *选择许多内部线条并溶解它们*\n\n\
  3. 观察几何体，有几条线我们可以移除，同时保持基本形状。选择所有类似于上图所示选择的线条。按 `X` 或 `Delete` 键并选择 `Dissolve` Edges。这将完全移除边及其对应的顶点：\n\
  \n   ![Using different maps to create a more realistic look](img/B05189_07_26.jpg)\n\
  \n   *好了！清理完毕。*\n\n4. 对触手的每个主要面重复此过程，直到获得清晰简单的几何体！不用担心 UV 贴图，它已随我们的更改自动更新。\n\n5.\
  \ 最后，回到 `Object` 模式并重新启用修改器；我们还需要它们。我们需要将两个修改器都 `Apply` 到模型上，但顺序很重要。先应用 `Array`\
  \ 修改器，再应用 `Curve` 修改器。最后，我们可以删除用作形状引导的 `Tentacle Curve`。它不再需要了。\n\n## 为 Substance\
  \ Painter 准备 UV 贴图\n\n现在清理完毕，让我们看看如何使用 Substance Painter 为 Artifact 创建有趣的材质：\n\n\
  ### 提示\n\nSubstance Painter 提供 30 天免费试用，可在 `https://www.allegorithmic.com/products/substance-painter`\
  \ 下载。\n\n![Using different maps to create a more realistic look](img/B05189_07_27.jpg)\n\
  \n*Substance Painter 中的 Artifact*\n\nSubstance Painter 将允许我们直接在 Artifact 上绘制颜色和细节，并根据结果创建所需的所有必要纹理贴图。该过程需要几个步骤：\n\
  \n1. 首先，我们将在 Blender 中调整 UV 贴图以准备导出。\n2. 其次，我们将从 Blender 导出 FBX 文件并用它创建 Substance\
  \ Painter 项目。\n3. 第三，我们将在 Artifact 上绘制细节。\n4. 第四，我们将添加颜色。\n5. 最后，我们将从 Substance\
  \ Painter 导出纹理贴图以在 Unreal 4 中使用。\n\n这看起来是个漫长的过程，但结果绝对值得花时间。\n\n为了让 Artifact 能在 Substance\
  \ Painter 中工作，我们需要将所有部件合并并调整 UV 贴图：\n\n1. 将所有对象合并是一个相当直接的过程。在 `Scene Outliner` 中，点击列表顶部的第一个部件，然后按住\
  \ `Shift` 键选择列表中的其他部件，确保跳过触手。我们将单独为该部件制作纹理。\n\n2. 选中所有对象后，按 `Ctrl` + `J`。这将把它们合并为一个对象，并将所有\
  \ UV 贴图合并为一个。\n\n3. 转到 `Screen Layout` 下拉菜单并选择 `UV Layout` 选项。选择我们新合并的 Artifact\
  \ 并选择其所有面。我们的贴图将变得杂乱，所有展开的 UV 都开始重叠：\n\n   ![Using different maps to create a more\
  \ realistic look](img/B05189_07_28.jpg)\n\n   *将 UV 岛排列成一个大的 UV 贴图*\n\n4. 现在转到 `UV`\
  \ 菜单并选择 `Average Island Scale`。这应该会调整所有 UV 岛的相对缩放。接下来，从 `UV` 菜单选择 `Pack Islands`\
  \ 将它们全部打包到一对一的 UV 空间中。我们的结果应该类似于前面的截图：\n\n   ![Using different maps to create a\
  \ more realistic look](img/B05189_07_29.jpg)\n\n   *将 Smoothing 选项设置为 Face*\n\n\
  好了，一切准备就绪可以导出。选中 Artifact，转到 `File` 菜单导出 FBX。确保在 `Export FBX` 选项中选择 `Selected Objects`。另外，转到该菜单的\
  \ `Geometries` 部分，将 `Smoothing` 下拉菜单改为 `Face`。导出！\n\n### 提示\n\n下一节需要 Substance Painter\
  \ 的 30 天试用版以及他们在 YouTube 上的 Substance Painter 初学者贴图课程的演示文件。演示文件可在 `https://s3.amazonaws.com/alg-releases/public_releases/tutorials/scifi_crate/scifiCrate.zip`\
  \ 下载。我强烈推荐这门课程，因为它能让你很好地入门 Substance Painter 和基于物理的渲染。\n\n## Substance Painter 工作流\n\
  \n是时候打开 Substance Painter 了！对于有 Photoshop 经验的人来说，界面看起来和感觉都很相似。花几分钟探索一下信息面板。如果你觉得把它们放在别处会更好，可以像在\
  \ Unreal 中一样重新排列面板。只需抓住想移动的面板拖到新位置即可。\n\n随着我们深入，我们不会涵盖 Substance Painter 的每个功能。我只会重点介绍完成\
  \ Artifact 所需的功能。如果你想了解更多，我强烈建议利用他们在 YouTube 上的免费教程。\n\n我们需要做的第一件事是创建一个项目并导入 FBX\
  \ 文件：\n\n![Using different maps to create a more realistic look](img/B05189_07_30.jpg)\n\
  \n*将 FBX 文件导入 Substance Painter*\n\n1. 转到屏幕左上角选择 `File` 菜单。然后选择 `New`。将项目设置与前面截图中的设置匹配。点击窗口中的\
  \ `Select` 按钮将允许我们为项目选择 FBX 文件。\n\n\n\n## 为制品添加细节\n\n2. 现在我们已经设置好项目了，继续保存它。就像 Unreal\
  \ Engine 4 一样，Substance Painter 是一个复杂的程序，会占用大量计算机资源。这可能导致它有时变得不稳定并崩溃。请记得经常保存！![使用不同的贴图创建更逼真的外观](img/B05189_07_31.jpg)\n\
  \n    从 Sci Fi Crate（科幻箱子）教程的 **Alphas** 文件夹导入所有 PSD 文件\n\n3. 让我们将一些额外工具导入程序。找到你保存\
  \ Sci Fi Crate 教程资源的位置并解压文件。在 **Alphas** 文件夹中，我们会找到几个新的 Alpha，Substance Painter\
  \ 可以将它们用作细节笔刷。选择文件夹中的所有 PSD 文件，并将它们拖拽到屏幕底部 **Shelf（货架）** 窗口中的 **Alphas** 选项卡。这会将它们添加到项目中供我们使用：![使用不同的贴图创建更逼真的外观](img/B05189_07_32.jpg)\n\
  \n    创建蒙版，以便我们只为制品的特定部分上色\n\n4. 是时候开始添加细节了。Substance Painter 通过改变物体的 **Height（高度）**、**Color（颜色）**、**Roughness（粗糙度）**\
  \ 和 **Metallic（金属度）** 属性来添加细节和颜色，而无需增加任何新几何体。我们将为制品添加新特征，例如腐蚀、接缝、铆钉等。这些细节将被添加到法线贴图中，以便我们随后在\
  \ Unreal 中使用。开始之前，让我们先遮盖住想要处理的区域。按 *T* 切换到 **Quick Mask（快速蒙版）** 模式。现在点击屏幕左上角菜单栏中的\
  \ **Polygon Fill（多边形填充）**。这将允许我们通过给多边形上色来遮盖想要处理的区域。在最右侧的 **Properties（属性）** 面板中，将\
  \ **Color（颜色）** 滑块全部向左拖动。我们想要将想要保护的区域涂成黑色。剩下的白色区域将会被我们要使用的工具编辑：![使用不同的贴图创建更逼真的外观](img/B05189_07_33.jpg)\n\
  \n    遮盖除顶部和底部以外的所有部分\n\n5. 在 **Properties（属性）** 面板中选择 **UV** 按钮。这将允许我们填充整个 UV 岛。点击制品顶部和底部区域的外层外壳。接下来，按住\
  \ *Ctrl* 并使用*鼠标左键*旋转 3D 视图，以便选择位于顶部和底部的大多边形。如果制品滑出视野，使用 *Ctrl* + *鼠标中键* 移动相机。选中那些多边形后，按\
  \ *I* 键反选。现在我们可以在不接触其他部分的情况下为外部添加细节。完成遮盖后，点击菜单栏中的画笔图标返回绘画模式，并按 *T* 停止编辑 **Quick\
  \ Mask（快速蒙版）** 并开始使用它：![使用不同的贴图创建更逼真的外观](img/B05189_07_34.jpg)\n\n    让我们为最顶部添加一些细节\n\
  \n6. 在 **Alphas（Alpha）** 面板中，选择 **RT\\_Industr\\_019** alpha 并将其拖拽到 **Properties（属性）**\
  \ 面板中的 **Alpha** 选项。在 **Properties（属性）** 面板的 **Alphas** 选项下方是 **Material（材质）** 部分。点击\
  \ **Color（颜色）**、**Rough（粗糙度）** 和 **Metal（金属度）** 的按钮将它们关闭。我们只想让这些初始细节影响 **Height（高度）**\
  \ 通道。（如果看不到选项，请点击 **Layers（图层）** 面板中的 **Layer 1** 图层。）旋转相机以便看到制品的顶部多边形。你可以通过按住 *Alt*，然后按住\
  \ *Shift*，最后使用*鼠标左键*将视图旋转到顶部，以获得精确的俯视图。视图应该会吸附到俯视图。将光标移至顶部多边形的中心，按住 *Ctrl* + *鼠标右键*\
  \ 并拖动以调整工具大小以适应该面。在 **Properties（属性）** 面板的 **Material（材质）** 部分找到 **Height（高度）**\
  \ 滑块。此滑块通过 -1 到 1 之间的值控制细节是凸出于制品表面还是切入内部。-1 会像饼干切割机一样在物体上切出凹槽。1 会在物体顶部添加细节。将滑块完全向右拖动将其值设为\
  \ 1，将笔刷与顶部对齐，然后点击。如果不满意结果，撤销并重试：![使用不同的贴图创建更逼真的外观](img/B05189_07_35.jpg)\n\n   \
  \ 添加接缝可以让制品看起来更真实。对称工具能让你的工作时间减半。\n\n7. 为了节省时间，我们将开启工具栏中的 **Symmetry（对称）** 选项。开启\
  \ **Symmetry（对称）** 并使用右侧的按钮调整 **Mirror（镜像）** 轴。这里我使用的是 **Mirror Z（镜像 Z）**。\n\n8.\
  \ 回到 **Alphas（Alpha）** 面板，选择 **Bevel（倒角）** alpha 并将其拖入 **Properties（属性）** 面板。此 alpha\
  \ 创建的接缝类似于两块金属板拼接的地方。接下来，将 **Height（高度）** 滑块拖至负值范围。我将其完全向左拖动至 `-1`。使用 *Ctrl* + *鼠标右键*\
  \ 将工具大小调整得稍小一些，然后点击一次*鼠标左键*开始绘制接缝。按住 *Shift* 键允许我们从上次点击的位置创建一条直线。按住 *Shift* 并拉伸虚线，直到笔刷遇到我们的顶部细节。现在点击*鼠标左键*将从起点到物体顶部创建一条直线接缝。由于我们使用了\
  \ **Symmetry（对称）**，它也会为我们在背面创建一条接缝。\n\n9. 现在将 **Mirror（镜像）** 轴切回 *X*，并在制品侧面创建另一条接缝，类似于我们在正面和背面所做的：![使用不同的贴图创建更逼真的外观](img/B05189_07_36.jpg)\n\
  \n    铆钉让制品看起来像是由金属板制成的\n\n10. 让我们添加一些铆钉！在 **Layers（图层）** 面板中点击 **+** 按钮创建一个新图层，然后双击图层名称将其重命名为\
  \ Rivets（铆钉）。我们可能还想将 **Layer 1** 重命名为 **Seams（接缝）**。请记住命名很重要！将我们使用的 alpha 更改为 **RT\\\
  _Industr\\_010**，调整笔刷大小，开始在新“金属板”角落附近放置铆钉。记得使用 **Mirror X（镜像 X）** 和 **Mirror Z（镜像\
  \ Z）** 对称轴选项来简化流程。\n\n11. 根据需要为制品的顶部和底部区域添加任意数量的铆钉和接缝，使其个性化并独一无二。只需记住，每当你想创建一组新的细节时，就使用一个新图层。\n\
  \n12. 现在按 *T* 返回编辑 **Quick Mask（快速蒙版）**，再按 *I* 再次反选蒙版。现在为 **Gear（齿轮）** 和 **Pistons（活塞）**\
  \ 添加细节，就像我们为制品外壳所做的那样。\n\n13. 最后，让我们在 **Layers（图层）** 面板中点击小文件夹按钮创建一个文件夹。将其命名为 Height\
  \ Info（高度信息），然后将每个图层拖入其中。这样我们就能保持一切井井有条。\n\n## 应用智能材质\n\n制品看起来怎么样？使用这个神奇的工具，我们已经为原本可能有点枯燥的模型添加了一些很棒的细节。然而，我们仍然需要添加一些颜色，真正让这个游戏资产大放异彩！为了简化流程，我们将利用\
  \ Substance Painter 的智能材质——预设材质和设置的集合，它们非常适合节省我们的时间。当我们将这些与蒙版结合时，就能将这些外观出色的材质应用到制品的特定部位。\n\
  \n我们将使用智能材质在短时间内赋予制品一种阴险的外观。让我们开始吧！\n\n1. 点击切换到 **Smart Materials（智能材质）** 选项卡，向下滚动找到\
  \ **Steel dark stained（深色染色钢铁）** 材质。点击该材质并将其拖拽到 **Layers（图层）** 面板中。这会将材质应用到整个游戏资产上：![使用不同的贴图创建更逼真的外观](img/B05189_07_37.jpg)\n\
  \n    应用深色染色钢铁材质\n\n\n\n## 材质绘制进阶步骤\n\n2.  现在找到 `Silver Armor` 材质并将其拖入 `Layer` 面板。确保它在图层堆栈中位于\
  \ `Steel dark stained` 之上。\n\n3.  右键点击 `Silver Armor`，从菜单中选择 `Add White Mask`。\n\
  \n4.  回到工具栏，开启 `Polygon Fill` 工具。就像我们使用 `Quick Mask` 时一样，将 `Properties` 面板中的 `Color`\
  \ 滑块完全向左滑动，然后点击 `UV` 按钮。现在选择 Artifact 顶部和底部零件的外侧壳体。同时也选择底部多边形。这将允许底层的钢铁图层透过 `Silver\
  \ Armor` 图层显示出来。结果是齿轮和活塞现在是银色的，而外壳仍保持阴暗的金属色：\n    ![Using different maps to create\
  \ a more realistic look](img/B05189_07_38.jpg)\n\n### 使用 Satin 通用材质为 Artifact 内部上色\n\
  \n5.  还剩最后一个部分！我们要给 Artifact 内部添加缎面材质。在图层堆栈中，Smart Materials 上方创建一个新图层并命名为 `Satin`。按\
  \ `T` 创建 `Quick Mask`，遮罩掉除 Artifact 内部以外的所有部分。在 `Shelf` 的 `Materials` 选项卡中，向下滚动并选择\
  \ `Satin Generic` 材质。接下来，将 alpha 设置为 `Shape`。最后，在视图的 UV 布局侧，点击并拖动画笔绘制 Artifact 内部面。这会将材质直接绘制到\
  \ UV 贴图上，其工作方式与在模型上绘画完全相同。\n\n我们的材质制作完成了！是时候将这些很棒的纹理贴图从 Substance Painter 导出，为 Unreal\
  \ 4 做好准备。\n\n## 烘焙与导出纹理\n\n1.  我们从烘焙 `Normal` 贴图开始。点击 `TextureSet Settings` 面板中的\
  \ `Bake Textures` 按钮。关闭除 `Normal` 以外的所有选项。保持所有选项为默认值，点击窗口底部附近的 `Bake Textures`。我们现在应该能在\
  \ `Additional Maps` 列表中看到新增的法线贴图：\n    ![Using different maps to create a more realistic\
  \ look](img/B05189_07_39.jpg)\n\n### 打开 Export Textures 菜单\n\n2.  接下来，点击 `File`\
  \ 菜单并选择 `Export Textures`。点击 `Configurations` 选项卡。这里列出了几个不同的预设，根据我们的游戏资产接下来要去向哪里而定。虽然有\
  \ `Unreal Engine 4` 选项，但我们要点击窗口顶部附近的 `+` 来创建自己的预设。双击新预设并将其命名为 `Normal`。\n\n3.  这个预设将仅用于导出法线贴图，不包含我们暂时不需要的其他贴图。在窗口的\
  \ `Output Maps` 部分，点击 `RGB` 按钮为法线贴图创建一个 RGB 通道。接下来，将窗口 `Converted Maps` 部分的 `Normal\
  \ DirectX` 选项拖拽到我们刚创建的新通道中的 `RGB` 选项上。该通道将输出我们的法线贴图。最后，给该通道命名为 `Normal`。\n\n4. \
  \ 回到 `Export Textures` 菜单，切回 `Export` 选项卡。将 `Config` 下拉菜单改为我们新建的 `Normals` 选项，点击窗口底部的\
  \ `Export` 按钮。几秒后，我们应该会收到导出成功完成的消息。点击 `Open Folder` 选项以导航到我们的新法线贴图：\n    ![Using\
  \ different maps to create a more realistic look](img/B05189_07_40.jpg)\n\n### 使用生成的\
  \ Normal map 测试 Artifact 是否保留了高度信息\n\n5.  我们的法线贴图包含了存储在 `Height` 通道中的所有细节信息。在 `Shelf`\
  \ 中，切换到 `Textures` 选项卡。现在打开包含新法线贴图的文件夹，将贴图拖入 `Textures` 选项卡。最后，点击 `TextureSet Settings`\
  \ 面板 `Additional Maps` 部分的 `Normal Map`，从选项中选择我们的新法线贴图。我们可以通过前往 `Layers` 面板并关闭 `Height\
  \ Info` 文件夹来测试。如果所有细节都保留下来了，我们就万事大吉了！\n\n6.  接着，回到 `Bake Textures` 菜单，关闭除 `Ambient\
  \ Occlusion` 以外的所有选项。这种贴图能增强游戏资产凹槽和缝隙中的阴影，Unreal 4 可以利用它。\n\n7.  最后一次导出。前往 `File`\
  \ 菜单再次选择 `Export Textures`。从菜单中选择 `Unreal Engine 4 (Packed)`。最后，点击 `Export` 按钮！\n\
  \n我们终于完成了这个东西的贴图制作！现在你已经对 Substance Painter 的工作流程有了很好的感觉，我鼓励你再为触手跑一遍这个流程。Substance\
  \ Painter 有一些逼真皮肤的有趣选项，可能非常适合为我们资产的这部分带来诡异恐怖的感觉。\n\n# 总结\n\n哇，真是一段精彩的旅程！在本章中，我们探索了不同的\
  \ UV 展开技术，并将它们应用到神器的不同部分。然后我们将游戏资产的所有不同部件连接在一起，创建了一个统一的 UV 贴图。有了 UV 贴图，我们将神器导入 Substance\
  \ Painter，这是一款利用**基于物理的渲染**（PBR）技术创建逼真材质解决方案的贴图绘制程序。在这个复杂的程序中，我们直接在神器部件上绘制新细节，并为它们涂上了一层令人惊叹的漆面，以增强神器的**邪恶外观**。在下一章中，我们将探索为神器制作动画的方法，并在**虚幻引擎\
  \ 4** 中组装这个邪恶物体的最终版本。\n\n神器已经走过了漫长的道路。最初只是绘图纸上的一个想法，现在已经变成了一个完整的 3D 模型，并带有纹理。然而，我们还没有完成让这个被遗忘的遗物完全复活的工作。如果你还记得这个游戏资产的原始设计，神器必须能在玩家触碰时打开，使他们无意中成为其毁灭目的的帮凶。为此，我们需要动画！Blender\
  \ 拥有一套完整的动画工具，完全胜任这项工作。使用关键帧，我们将创建一个简单的打开动画，并准备将神器导出到我们的空间站关卡中。在本章中，我们将涵盖以下主题：\n\
  \n*   Blender 如何处理动画？\n*   绑定与使用关键帧\n*   使用 Blender 的动画工具套件\n"
- "# Blender 如何处理动画？\n\n你可能还记得在 第 2 章，*启动我们的第一个项目* 中，我们简要涉及了关键帧，那些我们用来为物体制作动画的时间记录点。Blender\
  \ 使用的工具与在 UE4 中使用 `Timeline` 和 `Matinee` 非常相似，所以让我们花一点时间建立在这些知识之上。请记住，关键帧代表动画中时间上的重要位置。就我们的门而言，就是打开和关闭的位置。对于电梯，就是上升和下降的位置。\n\
  \n这些关键帧帮助虚幻引擎和 Blender 创建所谓的 `Tweens`（补间动画）——即主要关键点之间所有那些细微的移动。连同关键帧一起，30 个关键帧组成一秒的动画。在兔八哥、飞毛腿鸟和《摩登原始人》的全盛时期，动画工作室有高级动画师，他们创建所有关键帧。然后将这些交给初级动画师手工绘制所有补间帧。这个过程曾经非常漫长且劳动密集。现在我们有计算机为我们计算所有中间帧，这个过程可以非常轻松地完成。\n\
  \n那么关键帧可以记录什么呢？\n\n![Blender 如何处理动画？](img/B05189_08_01.jpg)\n\n### 插入关键帧菜单\n\n\n\
  \n\n乍一看，`Insert Keyframe Menu`（插入关键帧菜单）给我们提供了几个选项。然而，仔细观察后我们可以发现，所有选项都是同三样东西的变体：`Location`（位置）、`Rotation`（旋转）和\
  \ `Scale`（缩放）。`Location` 将是我们使用最多的选项，用于记录各个活塞部件在移动神器盖子时的位置。我们也将使用 `Rotation` 来旋转齿轮，作为锁定机制的一部分。\n\
  \n在动画制作过程中，还有一种技巧能让我们的生活轻松许多。Dummy 对象（虚拟对象），或 Blender 称为的 `Empty`（空物体），是一种简单的对象，导出场景时不计入场景内，但在制作动画时能提供巨大帮助。可以把它们想象成木偶上的线。没人会看见它们，但它们会让控制动画变得容易得多。\n\
  \n让我们看看 `Empty` 菜单：\n\n![How does Blender handle animation?](img/B05189_08_02.jpg)\n\
  \n`Empty` 可用于简化动画制作。\n\n`Empty` 对象有多种形状，从上图所示的简单坐标轴，到箭头、球体，甚至圆锥体。我们想要制作动画的场景中的对象可以链接到这些对象上，这样我们只需移动\
  \ `Empty`，本质上就是创建了一个控制柄。它们也可用作动画约束的目标。\n\n# 绑定与使用关键帧\n\n现在我们已经清楚需要哪些工具了，让我们来谈谈创建关键帧！\n\
  \n![Rigging and using keyframes](img/B05189_08_03.jpg)\n\n`Timeline`（时间轴）用于添加关键帧，方式类似于\
  \ Unreal 4 中的时间轴。\n\n与 Unreal 4 类似，我们创建的关键帧将显示在 `Timeline` 中。该区域位于 `3D viewport`（3D\
  \ 视口）正下方。关键帧显示为简单的黄线，我们查看的时间范围可通过鼠标滚轮调整。\n\n现在让我们从一个基础立方体开始创建一些关键帧：\n\n![Rigging\
  \ and using keyframes](img/B05189_08_04.jpg)\n\n一个滑动盒子的简单动画。\n\n要制作立方体移动的简单动画，我们需要创建两个关键帧：\n\
  \n1.  选中立方体，按 `I` 打开 `Insert Keyframe Menu`，从列表顶部选择 `Location`，创建第一个关键帧。\n2.  现在将\
  \ `Timeline` 窗口中的时间滑块滑动到第 `30` 帧。可以通过在 `Timeline` 靠近 30 的位置右键点击，然后按住按钮沿 `Timeline`\
  \ 拖动来完成。图中高亮显示的框表示当前活动帧。\n3.  接下来，在 `3D viewport` 中将立方体向任意你喜欢的方向滑动。最后，按 `I` 并从菜单中选择\
  \ `Location`，就像我们为第一个关键帧所做的那样。\n4.  通过在 `Timeline` 上按住右键并拖动活动帧在 `1` 和 `30` 之间滑动来测试动画。我们应该能看到立方体在我们记录的两个位置之间滑动。\n\
  \n恭喜，我们刚刚为立方体制作了动画！现在让我们看看如何修改或删除可能稍微偏离的关键帧：\n\n![Rigging and using keyframes](img/B05189_08_05.jpg)\n\
  \n介绍 `Dope Sheet`（动作编辑器/逐帧编辑器）。\n\n有时在创建关键帧时，我们可能会在不想放的地方放下一个，或者可能需要调整动画的时间使其感觉更自然。`Dope\
  \ Sheet`（上一张截图中高亮显示的区域）允许我们用相对简单的控制来移动、复制和删除关键帧。\n\n要移动关键帧，选择想要移动的关键帧。然后点击并拖动关键帧到新的时间位置。最后，再次点击\
  \ `LMB`（左键）以确定新的时间位置。\n\n这里我们可以看到 `Dope Sheet` 的实际操作：\n\n![Rigging and using keyframes](img/B05189_08_06.jpg)\n\
  \n复制关键帧在动画必须以开始的精确位置结束时非常有用。\n\n要复制关键帧，选择想要复制的关键帧并按 `Ctrl + C`。现在右键点击并拖动时间滑块到新的期望时间。最后，按\
  \ `Ctrl + V` 粘贴关键帧。这是创建旋转或其他循环动画的绝佳技巧，因为在这些动画中物体必须精确地回到起始位置。\n\n是时候将所学应用到我们的神器上了。\n\
  \n为了给我们的部件制作动画，我们需要将其分解为几个不同的部分。基本上，如果它会动，它就必须是一个独立的部件。现在你可能会问自己，*等等。那我们为什么早前把它做成一个整体？*\
  \ 为了 UV 展开的目的，我们必须让神器作为一个整体。当我们从整体中分离出部件时，它们仍然是我们制作的 UV 贴图的一部分。当我们把整个东西导入 Unreal\
  \ 时，我们创建的材质仍会将那些很棒的纹理应用到神器的每一个部件上。\n\n让我们从分离顶部开始：\n\n![Rigging and using keyframes](img/B05189_08_07.jpg)\n\
  \n选择顶部和顶部活塞部分。\n\n1.  选择盖子外侧的一个面并按 `L`；这应该会选择组成盖子外侧的所有面。\n2.  接下来，按住 `Shift` 键选择盖子内侧的一个面。这会将该面添加到当前选择集中。按\
  \ `L` 选择盖子内侧的所有面。\n3.  现在选择最顶部的面。\n\n    现在我们将活塞添加到选择中：\n\n    ![Rigging and using\
  \ keyframes](img/B05189_08_08.jpg)\n\n    活塞的分解图。这将用于将正确的部件绑定到正确的骨骼。\n\n4.  最后，按住\
  \ `Shift`，选择一个活塞顶部区域的多边形并按 `L`。每个活塞顶部由三个不同部分组成：顶部、中部和底部内侧部分。确保在每个部分中 `Shift` 选择一个面并按\
  \ `L` 以选择该部分的所有面。\n5.  按 `P` 打开 `Separation`（分离）菜单并选择 `Selection`（选中部分）。这将把我们选中的面分离为一个新部件。记得在\
  \ `Scene Outliner`（场景大纲视图）中将其重命名为容易记住的名字，比如 `Top`。\n\n现在我们分离了顶部。对底部和齿轮重复该过程。如果你选择一个面，按\
  \ `L`，没反应，就选旁边的面再试一次。另外，按 `Z` 会开启线框模式。这将允许你穿过物体选择面。务必通过点击面中心的小黑点来选择那些面。\n\n是时候解决那些中间活塞部件了！我们的攻略计划是将它们分离成三层，因为我们将在动画中一起移动它们。底部那组部件是一层，中间那组是另一层，依此类推：\n\
  \n![Rigging and using keyframes](img/B05189_08_09.jpg)\n\n为了动画制作，有必要将活塞分解为多个部件。\n\
  \n### 提示\n\n记住你可以在 `Object`（物体）模式下使用 `Shift + H` 来隐藏未选中的所有东西！\n\n具体操作如下：\n\n1. \
  \ 选择你的活塞部件并使用 `Shift + H` 隐藏神器的其余部分。\n2.  进入 `Edit`（编辑）模式，像上一张截图那样选择每组活塞的底部部分。\n\
  3.  按 `P` 并从菜单中选择 `Selection`。在 `Scene Outliner` 中将该层重命名为 `Pistons.Bottom`。\n4.\
  \  通过点击 `Scene Outliner` 中其名称旁边的眼睛图标来隐藏它们。这将使后续过程容易得多。\n5.  对中间层重复此过程。这将为你留下分离好的顶层。\n\
  \n如果一切顺利，你的 `Scene Outliner` 应该看起来像这样：\n\n![Rigging and using keyframes](img/B05189_08_10.jpg)\n\
  \n我们将用于动画的神器的所有不同部分。\n\n\n\n\n\n# 绑定神器\n\n在所有部件分离完毕后，在开始制作动画前还有一步需要完成。因为我们要创建一个包含动画的静态网格体，神器将作为\
  \ `skeletal mesh`（骨骼网格体）导入 Unreal。骨骼网格体由两部分组成：静态网格体对象本身，以及一套用于操控网格体的骨骼系统。这意味着神器需要骨骼！\n\
  \n为了给神器制作动画，每个会移动的部件都需要一根骨骼。这些骨骼将连接到一根单独的骨骼上，Unreal 会将其识别为根骨骼。然后我们将对骨骼进行动画制作，而不是直接操作网格体本身。\n\
  \n## 添加骨骼\n\n### 第一根骨骼\n\n我们将从单根骨骼开始：\n\n![绑定与使用关键帧](img/B05189_08_11.jpg)\n\n添加第一根骨骼\n\
  \n具体操作步骤如下：\n\n1.  首先，我们需要将 3D 游标移动到底部区域的中心。选中神器的底部并按下 `Shift` + `S` 打开 `Snap`（吸附）菜单。选择\
  \ `Cursor to Selected`（游标到选中项）以将 3D 游标移至正确位置。\n\n2.  现在前往 `Add`（添加）菜单，选择 `Armature`（骨架），并添加一个\
  \ `Single Bone`（单根骨骼）。Blender 会将其直接添加在部件的底部中心。缩放骨骼，使其仅与神器的底部区域对齐，类似于你在上一个截图中看到的效果。按下\
  \ `Z` 键切换到线框模式查看可能会有所帮助。\n\n3.  选中新骨骼并进入 `Edit`（编辑）模式：\n\n![绑定与使用关键帧](img/B05189_08_12.jpg)\n\
  \n添加控制顶部的骨骼\n\n### 额外的骨骼\n\n4.  现在我们处于 `Edit` 模式，就 Unreal 而言，我们为神器的 `Armature` 添加的任何骨骼都将连接到第一根骨骼。这一点很重要，因为\
  \ Unreal 每个骨骼网格体只允许有一个骨架。点击 `Add` 菜单并选择 `Single Bone`。这会向场景中添加一根新骨骼。使用移动箭头，沿 `Z`\
  \ 轴向上拖动新骨骼，使其具有一定高度。\n\n5.  点击新骨骼的中心将其高亮，并将其移动到神器顶部区域内的合适位置。这根骨骼将控制盖子在开启时的上下移动。尝试将其对齐，使其看起来与图片中的类似。由于我们已将\
  \ 3D 游标移至神器中心，所有骨骼都应完美居中。这在制作动画时将非常重要：\n\n![绑定与使用关键帧](img/B05189_08_13.jpg)\n\n\
  这三根骨骼将控制活塞\n\n6.  该添加三根骨骼来控制活塞部件了。就像创建上一根骨骼一样，为活塞的每一层创建一根控制骨骼。记得将它们调整到与所控制部件相似的大小，并按截图所示对齐：\n\
  \n![绑定与使用关键帧](img/B05189_08_14.jpg)\n\n添加控制齿轮的骨骼\n\n7.  最后一根骨骼！创建一根小骨骼来控制齿轮。创建完成后，将其移至合适位置，然后旋转\
  \ 90 度使其平躺。这根骨骼将通过旋转来产生齿轮转动的效果。\n\n## 将骨骼绑定到网格体\n\n创建完所有骨骼后，我们现在必须将它们与神器的各个部分连接起来，以便移动骨骼时能带动其绑定的部件。在\
  \ Blender 中，这个过程称为 `Parenting`（父子绑定/设为父级）。我们还将接触一个专用于骨架的新模式：`Pose Mode`（姿态模式）！\n\
  \n## 姿态模式\n\n要进入 `Pose Mode`，选中你的 Armature 并前往模式下拉菜单：\n\n![绑定与使用关键帧](img/B05189_08_15.jpg)\n\
  \n选中一根骨骼并从模式下拉菜单中选择 Pose Mode 以进入姿态模式\n\n在那里，选择 `Pose Mode`。在此模式下，我们可以将 3D 模型的各部分绑定到新骨骼上，然后为它们设置关键帧，以创建神器开启的动画：\n\
  \n![绑定与使用关键帧](img/B05189_08_16.jpg)\n\n按下 `Ctrl` + `P` 打开“设置父级”菜单，然后选择 Bone（骨骼）。这会将底部区域绑定到其对应的骨骼\n\
  \nBlender 使 `Parenting` 过程变得快速简便：\n\n1.  选择我们想要绑定的部件。我们从底部区域开始。\n\n2.  按住 `Shift`\
  \ 键，选择你想要绑定到神器底部的骨骼。在本例中，这是我们创建的第一根骨骼。\n\n3.  按下 `Ctrl` + `P`；这将打开 `Set Parenting\
  \ To`（设置父级为）菜单。选择 `Bone` 选项。\n\n4.  最后，通过选择骨骼并向任意方向滑动它，测试该骨骼是否已连接到底部部件。神器的底部应随之滑动。按下\
  \ `Ctrl` + `Z` 将其恢复到原始位置。\n\n对每根骨骼重复此过程，将它们绑定到各自对应的部件。完成 `Parenting` 过程后，我们就可以开始制作动画了！\n\
  \n# 为神器制作动画\n\n是时候让神器“活”过来了！优秀的动画能为任何物体注入角色魅力与生命力。许多初学者动画师从迪士尼动画师 `Ollie Johnston`\
  \ 和 `Frank Thomas` 最初撰写的 `12 Basic Principles of Animation`（动画十二大基本原则）入手，我强烈建议你去了解一下。我们将为神器制作基础的机械动画。活塞将移动，齿轮将旋转。不过，我鼓励你阅读基础知识，并在后续实践中应用所学。\n\
  \n就像我们之前用立方体练习时那样，我们将创建一些关键帧，但这次我们将移动创建的骨骼，而不是神器的部件本身。结果将是一个游戏资产，我们可以在 Unreal 中触发其开启：\n\
  \n![使用 Blender 的动画工具套件](img/B05189_08_17.jpg)\n\n通过场景大纲视图中的 Armature 组操控骨骼\n\n##\
  \ 设置关键帧\n\n使用 `Pose` 模式，让我们将神器移至关闭位置：\n\n1.  为了方便操作，在 `Scene Outliner`（场景大纲视图）中选中你的\
  \ Armature，然后点击小 `+` 图标。这将列出所有绑定到你 Armature 的当前特性。查看 `Pose` 选项。对于我们创建的每根骨骼，都有一个小骨骼图标，我们可以点击它来选中或取消选中特定骨骼。随着工作的推进，这将非常方便。\n\
  \n2.  使用 `Scene Outliner`，依次选择每根骨骼并将它们向下移动，直到神器闭合。最好在 `Front`（前视图）视角下进行。\n\n3. \
  \ 一切闭合后，是时候记录我们的第一个关键帧了。选中所有骨骼，按下 `I` 打开 `Insert Keyframe Menu`（插入关键帧菜单），然后选择 `Location`（位置）选项。这将在第\
  \ 1 帧记录神器每个部件的初始位置。在 Unreal 中，这将用作我们的参考姿势或起始姿势：\n\n![使用 Blender 的动画工具套件](img/B05189_08_18.jpg)\n\
  \n为活塞伸展制作动画\n\n## 为活塞制作动画\n\n4.  现在将屏幕底部 `Timeline`（时间轴）上的时间滑块移动到第 `10` 帧。接下来，取消选中控制底部区域的骨骼。移动其他骨骼向上，直到活塞的底部区域完全伸展。按下\
  \ `I` 记录骨骼的新位置：\n\n![使用 Blender 的动画工具套件](img/B05189_08_19.jpg)\n\n伸展活塞的每一节并创建关键帧\n\
  \n5.  将时间滑块移动到第 `20` 帧，取消选中控制活塞底层的骨骼。移动剩余骨骼向上，直到活塞的中间层完全伸展。按下 `I` 记录骨骼的新位置：\n\n\
  ![使用 Blender 的动画工具套件](img/B05189_08_20.jpg)\n\n活塞完全伸展\n\n6.  最后一次移动！将时间滑块移动到第 `30`\
  \ 帧，取消选中控制活塞中间层的骨骼。移动剩余骨骼向上，直到活塞的顶层完全伸展。按下 `I` 记录骨骼的新位置。\n\n7.  在我们的关键帧之间来回拖动时间滑块，观看神器的开启与闭合。一边看一边发出些怪兽般的咆哮声吧。\n\
  \n\n\n\n8. 活塞开始工作后，让我们给齿轮添加一些旋转。将时间滑块拖至第 `5` 帧，按 `R` 键旋转控制它的骨骼 `45` 度，输入 `45`，然后按\
  \ `Enter` 键。按 `I` 键并从菜单中选择 `Rotation` 选项。将时间滑块拖至第 `10` 帧并重复操作。重复此过程，直到为齿轮骨骼记录了新的旋转关键帧，间隔为五帧。\n\
  \n9. 在整个动画范围内来回拖动时间滑块，测试效果如何。\n\n# 总结\n\n我们刚刚让神器“活”了过来！在游戏术语中，神器打开需要 1 秒钟。如果你希望该过程耗时更长或更短，请随意在\
  \ Dope Sheet（动作编辑器）中调整关键帧。如果我们想营造紧张和恐惧的氛围，更长的时间可能更合适。如果我们想让玩家感到惊讶，或给他们留下很少的反应时间，更短的时间可能效果更好。凭直觉调整关键帧，以满足游戏需求。同样可以使用此过程为触手制作动画，赋予我们的资产更多“邪恶”的生命力！\n\
  \n在本章中，我们探讨了使用 Blender 内置工具制作动画的过程。我们学习了如何使用关键帧，以及如何使用 Dope Sheet 调整这些关键帧。最后，我们为神器创建了一个骨骼装备，并利用它制作了玩家在\
  \ Unreal 中遇到神器时的打开动画。在下一章中，我们将把所有内容导入 Unreal 并组装到一起。然后我们将让玩家炸毁神器，以此完美收官！\n\n旅程走到了尽头。我们一起开始了创建一个相当不错的游戏创意的过程。我们从一个基础关卡开始，归根结底，它只是两个由走廊连接的房间，里面放着一个简单的箱子。从卑微的起点出发，我们的游戏不断成长，我们的技能也随之提升。我们简单的货轮将玩家引向一个更大的空间站关卡。该关卡包含推动故事发展的脚本事件，以及一个外观出色且会动的游戏资产。然而，我们还没有结束。我们如何终结这段旅程？把东西炸飞，就是这样！\n\
  \n## 章节主题\n\n*   使用类蓝图将所有内容整合在一起\n*   使用音效创建爆炸\n*   添加粒子特效\n"
- "# 创建类蓝图以整合所有内容\n\n我们从任何类型的数字破坏的第一步开始：创建。在过去的几章中，我们创造了一个令人不安的古老科技产品。神器作为另一个时代早已被遗忘的恐怖武器屹立不倒，不知为何被一种未知力量带了出来。但我们知道真相。那种未知力量就是我们，我们即将导入所有必要资源，在空间站甲板上实现神器。玩家们小心了！\n\
  \n看看最终效果：\n\n![创建类蓝图以整合所有内容](img/B05189_09_01.jpg)\n\n开始之前，我们需要导入神器主体、触手以及来自 `Substance\
  \ Painter` 的所有贴图。让我们先导出神器的主体。\n\n1. 在 Blender 中，打开包含完整神器的文件。FBX 文件格式允许我们在一个文件中同时导出完成的\
  \ 3D 模型和我们创建的动画。\n2. 仅选择神器。由于它现在绑定到了我们创建的骨架上，骨骼和几何体应该已经成为一个整体。\n3. 现在按 `Alt` + `S`\
  \ 重置游戏资产的缩放。这样做可以确保我们将神器导入 Unreal 时不会出现任何奇怪的缩放问题。\n4. 转到 `File`（文件）菜单并选择 `Export`（导出）。选择\
  \ `FBX` 作为文件格式。\n5. 在导出菜单的第一个选项卡上，勾选 `Selected Objects`（选中物体）复选框。这将确保我们只导出神器，而不是触手。\n\
  6. 在 `Geometries`（几何体）选项卡上，将 `Smoothing`（平滑）选项更改为 `Faces`（面）。\n7. 为文件命名并点击 `Export`（导出）！\n\
  \n好了，我们现在有了神器的最新版本，已导出为 FBX。既然在本书的学习过程中我们已经导出过几次东西了，你觉得你已经掌握这个流程了吗？试着对触手重复一遍这个过程。\n\
  \n### 提示\n\n完成本书所有练习后，不要只把它放在书架上。书中描述了各种不同的流程，它是一本极佳的参考书！\n\n该启动 Unreal 了。打开游戏引擎并加载我们的空间站关卡。距离我们上次查看它已经有一段时间了，我毫不怀疑你可能已经想到了想要添加的改进和新板块。别忘了它们！暂时先放一边。一旦我们把游戏资产放进去并让它们爆炸，你将有大把时间添加内容。\n\
  \n开始导入到 Unreal！\n\n![创建类蓝图以整合所有内容](img/B05189_09_02.jpg)\n\n导入骨骼网格体与静态网格体略有不同。\n\
  \n1. 在开始导入资源之前，让我们创建一个文件夹来存放自定义资产。在 `Content Browser`（内容浏览器）中点击 `Content`（内容）文件夹，然后右键点击它。在出现的菜单顶部，选择\
  \ `New Folder`（新建文件夹）并将其命名为 `CustomAssets`。非常重要的一点：不要使用空格或特殊字符（下划线除外）。\n2. 选中我们新建的文件夹并点击\
  \ `Import`（导入）。选择 `Artifact FBX` 文件。\n3. 在 `Import`（导入）菜单顶部，确保选中了 `Import as Skeletal`（作为骨骼导入）和\
  \ `Import Mesh`（导入网格体）。现在点击该区域底部的小箭头以打开高级选项。最后，勾选复选框，告诉 Unreal 使用 `To As Reference\
  \ Pose`（作为参考姿势）。`Reference Pose`（参考姿势）是与骨骼网格体关联的任何动画的起点。\n4. 接下来，查看菜单的 `Animation`（动画）部分。开启\
  \ `Import Animations`（导入动画），告诉 Unreal 导入我们为神器制作的打开动画。\n5. 完成所有这些后，点击 `Import`（导入）！\n\
  \nUnreal 将为神器创建一个 `Skeletal Mesh`（骨骼网格体）、一个 `Animation`（动画）、一个 `Physics Asset`（物理资产）和一个\
  \ `Skeleton`（骨架）资产。这些部分共同构成了一个功能完整的骨骼网格体，可在我们的游戏中使用。\n\n![创建类蓝图以整合所有内容](img/B05189_09_03.jpg)\n\
  \n花点时间对触手重复该过程，同样要小心，确保从 Blender 中仅导出选中的物体。接下来，我们需要导入所有来自 Substance Painter 的贴图：\n\
  \n![创建类蓝图以整合所有内容](img/B05189_09_04.jpg)\n\nSubstance Painter 将导出的贴图存储在 `Documents\\\
  \\Substance Painter\\\\export` 中。\n\n在 第 6 章 *怪物资产——关卡完全需要一个* 的最后部分，我们为神器导出了几张贴图，它们应该仍在\
  \ `Export` 文件夹中：\n\n1. 找到 `Substance Painter` 的 `Export` 文件夹。默认情况下，它位于 `Documents`\
  \ 文件夹下，然后是 `Substance Painter`，最后是 `Export`。\n2. 返回 Unreal，然后从电脑任务栏打开 `Export` 文件夹。点击并拖动我们需要的每一张贴图到\
  \ `Content Browser` 中。Unreal 会自动导入它们。\n3. 是时候将它们全部设置为可用的材质了！在 `Content Browser`\
  \ 中右键点击，从菜单的 `Create Basic Asset`（创建基础资产）部分选择 `Material`（材质）。将材质命名为 `Artifact_MAT`。这将打开一个\
  \ `Material Editor`（材质编辑器）窗口：\n\n![创建类蓝图以整合所有内容](img/B05189_09_05.jpg)\n\n\n\n\n\
  # 在虚幻引擎中使用材质和类蓝图\n\n## 材质编辑器\n\n`Material Editor`（材质编辑器）的工作方式类似于在 `Blueprint`（蓝图）中编程，并使用相似的节点结构。中心的大节点代表最终结果。\n\
  \n### 提示\n\n为电子游戏创建材质和着色器本身就是一种艺术形式。这里我将从基础角度谈论创建材质，但我建议你查阅虚幻文档，打开 `Starter Content`（初学者内容）文件夹中的一些现有材质，并开始探索这个功能高度多样化的工具。\n\
  \n## 向材质添加纹理\n\n4. 因此我们需要将纹理添加到新材质中。向任何材质添加纹理贴图的一个简单方法是，从 `Content Browser`（内容浏览器）中点击并拖拽它们进入\
  \ `Material Editor`（材质编辑器）。这将创建一个名为 `Texture Sample`（纹理采样）的节点，该节点可以插入主材质节点上的不同插槽。\n\
  \n5. 现在将每个贴图插入。从每个 `Texture Sample`（纹理采样）右侧的白色连接点拖出一根连线，连接到主材质节点上相应的插槽。`Metallic`（金属度）和\
  \ `Roughness`（粗糙度）纹理采样将插入主节点上的两个插槽。\n\n6. 让我们预览结果。回到 `Content Browser`（内容浏览器），选择\
  \ `Artifact`（神器）。然后，在 `Material Editor`（材质编辑器）的 `Preview Window`（预览窗口）中，选择最右侧的小按钮，即\
  \ **Set the Preview Mesh based on the current Content Browser selection**（根据当前内容浏览器选择设置预览网格体）。\n\
  \n![Creating a class blueprint to tie it all together](img/B05189_09_06.jpg)\n\n\
  我们导入的四张贴图中的每一张都在主材质节点上有一个对应的插槽。\n\n7. 材质出来有点太亮了。材质发出的大量高光称为镜面高光，由主材质节点上的 `Specular`（镜面反射）连接控制。如果我们查阅文档，可以看到该节点部分接受\
  \ `0` 到 `1` 之间的值。我们该如何做呢？`Material Editor`（材质编辑器）有一个 `Constant`（常量）节点，允许我们输入一个数字，然后将其插入到我们可能需要的任何地方。这非常完美！在\
  \ `Material Editor`（材质编辑器）右侧的 `Palette`（调色板）搜索框中搜索 `Constant`（常量）。将其拖入到其他节点所在的区域，然后前往\
  \ `Details`（详情）面板。在 `Value`（值）字段中，尝试 `0` 到 `1` 之间的不同值并预览结果。我最终使用了 `0.1`。保存你的更改。\n\
  \n是时候在我们的神器上试一试了！\n\n![Creating a class blueprint to tie it all together](img/B05189_09_07.jpg)\n\
  \n在 `Skeletal Mesh`（骨骼网格体）编辑器中，在 `Mesh Details`（网格体详情）面板将我们的新材质分配给神器。\n\n8. 双击 `Skeletal\
  \ Mesh`（骨骼网格体）以打开 `Skeletal Mesh`（骨骼网格体）编辑器窗口。在左侧，寻找菜单的 `LOD0` 部分。此部分有一个添加材质的选项（我在前面的图片中已将其高亮显示）。回到内容浏览器并选择我们的\
  \ `Artifact_MAT` 材质。现在选择 `LOD0` 框中的小箭头，将选择应用到神器上。\n\n效果如何？太亮了？还是不够亮？请随意调整材质节点中的\
  \ `Constant`（常量）节点，直到你获得想要的结果。当你满意后，对触手重复该过程。我们将把它作为静态网格体导入（因为它没有任何动画），并使用我们在 `Substance\
  \ Painter` 中创建的纹理贴图为它创建一个材质。\n\n## 使用类蓝图进行最终组装\n\n现在我们将使用 `Class Blueprint`（类蓝图）进行最终组装。\n\
  \n![Creating a class blueprint to tie it all together](img/B05189_09_08.jpg)\n\n\
  ### 神器类蓝图\n\n类蓝图是一种独立的蓝图形式，它允许我们将美术资源与编程结合在一个易于使用且最重要的是可复用的包中。例如，玩家角色就是一个类蓝图，因为它将玩家角色的\
  \ `Skeletal Mesh`（骨骼网格体）与蓝图代码结合在一起，帮助玩家四处移动：\n\n![Creating a class blueprint to\
  \ tie it all together](img/B05189_09_09.jpg)\n\n第一人称角色是类蓝图的一个绝佳例子。\n\n那么我们如何以及何时使用类蓝图，而不是直接将代码放在关卡蓝图中？关卡蓝图非常适合特定于该关卡的任何内容。这类内容包括以熔岩为基础的关卡中的火山，或太空站关卡背景中的飞船。类蓝图非常适合构建独立且可重复的对象，例如门、敌人或道具。这些类型的物品会被频繁使用，并在游戏的多个关卡中都有其位置。\n\
  \n## 为神器创建类蓝图\n\n让我们为神器创建一个类蓝图：\n\n1. 点击 `Blueprints`（蓝图）按钮并选择 `New Empty Blueprints`（新建空蓝图）选项卡。这将打开\
  \ `Pick Parent Class`（选择父类）菜单。既然我们要创建一个道具，而不是玩家需要直接控制的东西，请选择 `Actor Parent Class`（Actor\
  \ 父类）。\n\n2. 下一个屏幕会要求我们为新类命名并选择保存位置。我选择将其保存在我的 `CustomAssets`（自定义资产）文件夹中，并将其命名为\
  \ `Artifact_Blueprint`。\n\n3. 欢迎来到 `Class Blueprint`（类蓝图）编辑器：\n\n![Creating a class\
  \ blueprint to tie it all together](img/B05189_09_10.jpg)\n\n类蓝图编辑器拥有虚幻引擎内其他编辑器通用的几个面板。\n\
  \n4. 与虚幻引擎内的其他编辑器窗口类似，`Class Blueprint`（类蓝图）编辑器既有 `Details`（详情）面板，也有 `Palette`（调色板）。但是，有一个面板是我们新接触的。`Components`（组件）面板包含构成类蓝图的美术类型列表。这些组件是构成整个对象的各个部分。对于我们的神器，这将包括主体本身、任意数量的触手和一个碰撞箱。可以添加的其他组件包括粒子发射器、音频，甚至灯光。\n\
  \n5. 让我们添加 `Artifact`（神器）。在 `Components`（组件）部分，点击 `Add Component`（添加组件）按钮，并从下拉列表中选择\
  \ `Skeletal Mesh`（骨骼网格体）。你可以在 `Common`（常用）部分找到它。这会向视口和 `Components`（组件）列表添加一个空白的\
  \ `Skeletal Mesh`（骨骼网格体）。选中它，查看 `Details`（详情）面板。在 `Mesh`（网格体）部分有一个区域用于分配你希望它成为的骨骼网格体。回到\
  \ `Content Browser`（内容浏览器），选择 `Artifact`（神器）。最后，回到 `Blueprint Editor`（蓝图编辑器）的 `Details`（详情）面板，点击\
  \ `Skeletal Mesh`（骨骼网格体）选项旁边的小箭头以分配 `Artifact`（神器）。它现在应该出现在视口中。\n\n6. 回到 `Components`（组件）列表。让我们添加一个\
  \ `Box Collision`（盒子碰撞）。点击 `Add Component`（添加组件），并从菜单的 `Collision`（碰撞）部分选择 `Box\
  \ Collision`（盒子碰撞）：\n\n![Creating a class blueprint to tie it all together](img/B05189_09_23.jpg)\n\
  \n选择添加组件按钮并从下拉菜单中选择盒子碰撞。\n\n7. 点击它，并在 `Details`（详情）面板中增加 `Box Extents`（盒子范围）到允许玩家进入其范围内的大小。我对\
  \ *x*、*y* 和 *z* 都使用了 `180`。\n\n8. 重复最后几个步骤，使用 `Add Component`（添加组件）菜单将触手添加到神器上。我们将使用\
  \ `Static Mesh`（静态网格体）选项。设计需要三个，但如果你喜欢可以添加更多。\n\n9. 是时候给这个类蓝图添加一点编程逻辑了。我们希望玩家能走到神器前，按下\
  \ `E` 键将其打开。\n\n![Creating a class blueprint to tie it all together](img/B05189_09_11.jpg)\n\
  \n### 编程神器\n\n\n\n\n# 制品交互与爆炸设置\n\n## 步骤 10–13：制品开启机制\n\n### 步骤 10：使用盒体碰撞启用/禁用输入\n\
  \n当我们在第 2 章《开始我们的第一个项目》中为电梯创建类似类型的控制时，我们使用了 `Gate` 节点来控制蓝图中信息的流向。然而，`Gate` 节点在类蓝图中的工作方式并不相同，因此我们需要一种略微不同的方法。该过程的第一步是使用\
  \ `Enable Input`（启用输入）和 `Disable Input`（禁用输入）节点，以允许玩家在进入我们的盒体碰撞体积时使用输入键。使用位于 `Palette`（调色板）面板中的搜索框，获取一个\
  \ `Enable Input` 和一个 `Disable Input`。现在我们需要添加触发事件。点击 `My Blueprint`（我的蓝图）面板中 `Variable`（变量）部分下的\
  \ `Box`（盒体）变量。这会更改 `Details`（详情）面板，以显示可为此组件创建的所有 `Events`（事件）列表。点击 `OnComponentBeginOverlap`（组件开始重叠）和\
  \ `OnComponentEndOverlap`（组件结束重叠）事件旁边的 `+` 按钮。将 `OnComponentBeginOverlap` 事件连接到\
  \ `Enable Input` 节点，将 `OnComponentEndOverlap` 事件连接到 `Disable Input` 节点。\n\n### 步骤\
  \ 11：创建 E 键事件\n\n接下来，通过搜索并从 `Palette`（调色板）拖入，创建一个玩家按下 `E` 键的事件。\n\n![创建类蓝图以将所有内容串联起来](img/B05189_09_24.jpg)\n\
  \n*创建打开制品的切换开关*\n\n### 步骤 12：添加 Do Once 和 Play Animation 节点\n\n为此，我们将添加一个 `Do Once`（执行一次）节点。该节点的工作原理类似于\
  \ `Gate`，它限制网络中信息的流向，但它确实允许动作在关闭前发生一次。这将使玩家可以按 `E` 打开制品，但动画只播放一次。没有它，玩家可以想按多少次 `E`\
  \ 就按多少次，反复播放动画。这玩一会儿挺有趣的，因为看起来像张嘴试图吃掉你，但这不是我们的初衷（我可能花了一些时间反复按它并歇斯底里地大笑）。`Do Once`\
  \ 可以在 `Palette`（调色板）中轻松找到。最后，我们将需要一个 `Play Animation`（播放动画）节点。有两个版本，所以请务必从搜索结果的\
  \ `Skeletal Mesh`（骨骼网格体）部分获取此节点，以便其目标为 `Skeletal Mesh Component`（骨骼网格体组件）。将输入 `E`\
  \ 事件连接到 `Do Once` 节点，再将 `Do Once` 节点连接到 `Play Animation`。\n\n### 步骤 13：设置动画目标和剪辑\n\
  \n还有一件事就能完成这个序列。我们需要在 `Play Animation` 节点上设置要播放的目标和动画。因此目标将是我们的 `Skeletal Mesh`（骨骼网格体）组件。点击\
  \ `Components`（组件）列表中的 `Artifact`（制品）组件，将其拖入 `Blueprint`（蓝图）窗口，并将其插入到我们的 `Play Animation`\
  \ 的 `Target`（目标）引脚上。最后，点击 `Play Animation` 节点上 `New Anim to Play`（要播放的新动画）选项下的下拉菜单，选择制品打开的动画。大功告成！\n\
  \n让我们保存所有文件并测试一下。将 `Artifact` 拖入我们的空间站，并将其放置在进出口经纪人的商店里。构建关卡，然后放入并测试。它打开了吗？需要更多触手吗？调试并改进它，直到它完全符合你的要求。\n\
  \n## 使用音效\n\n现在我们在关卡中已经有了制品、触手和动画在工作，我们可以就此停手并宣布完成，对吧？我们可以，但给玩家一个机会反击占领我们空间站的黑暗力量，不是更有趣吗？让我们把那个制品炸飞！\n\
  \n在直接动手之前，我们需要稍作规划。这将帮助我们理清蓝图序列的编程逻辑，并规划如何构建爆炸。那么，一个很棒的游戏爆炸效果需要什么？首先必须有声音。没有扎实的爆炸音效，任何尝试都会显得平淡无奇。我们还需要火焰、烟雾和碎片才能真正让它大放异彩。必须有某种触发事件，例如时间、玩家交互或伤害。最后，大致的事件顺序可能是：事件、声音、爆炸粒子、烟雾粒子、删除物体、碎片粒子。这样，烟雾、爆炸和碎片粒子效果就会在我们删除爆炸资产时进行遮挡。幸运的是，Unreal\
  \ 的 `Starter Content`（初学者内容）文件夹里有其中的大部分素材！\n\n让我们开始在类蓝图中为爆炸做准备，添加音效并设置它们在我们需要时触发。\n\
  \n![使用音效](img/B05189_09_12.jpg)\n\n*在详情面板中关闭自动激活*\n\n### 提示\n\n声音可以用与导入其他资产相同的方式导入\
  \ Unreal。如果你觉得 `Starter Content` 的声音不适合你的爆炸，请随意搜索 `Royalty Free`（免版税）声音。这些声音可以在你的项目中免费或支付少量一次性费用后使用。`Royalty\
  \ Free` 意味着除了最初的付款外，无需再支付任何费用。\n\n### 添加音频组件\n\n1.  向类蓝图添加声音类似于添加任何其他类型的 `component`（组件），并能为我们的爆炸增添真实的深度。在\
  \ `Class Blueprint`（类蓝图）编辑器中，点击 `Add Component`（添加组件）按钮并从列表中选择 `Audio`（音频）。接下来，选中音频组件，前往\
  \ `Details`（详情）面板并找到 `Sound`（声音）选项。在这里，你会找到一个字段，我们可以通过在 `Content Browser`（内容浏览器）中选择\
  \ `Sound Wave`（声波）或 `Sound Cue`（声音提示）然后点击小箭头来分配它。或者，你可以在点击 `Add Component` 按钮之前选择想要使用的声音，Unreal\
  \ 会添加选定的声音。让我们把这个设为 `Explosion Cue`（爆炸提示）。为了确保它只在我们想要的时候触发，选中它并前往 `Details` 面板。找到\
  \ `Auto Activate`（自动激活）选项并将其关闭。\n\n    ### 提示\n\n    `Sound Wave`（声波）和 `Sound Cue`（声音提示）的区别非常类似于纹理和材质的区别。`Sound\
  \ Wave` 连同一些特殊的蓝图节点组成了 `Sound Cue`。双击 `Explosion Cue` 看看吧！\n\n### 编程倒计时时钟\n\n2.\
  \  是时候为制品的编程添加一点内容了！我知道，大家对这部分都很兴奋。让我们为爆炸增加一点乐趣，加个倒计时。\n\n    ![使用音效](img/B05189_09_13.jpg)\n\
  \n    *为爆炸编程倒计时*\n\n### 实现 Flip Flop 逻辑\n\n3.  我们将使用 `Flip Flop`（翻转）节点，从按下 `E` 键的事件分支出此功能。\n\
  \n    ![使用音效](img/B05189_09_14.jpg)\n\n    *将倒计时连接到我们之前创建的 Flip Flop 的 B 分支*\n\n\
  4.  回到第 2 章《开始我们的第一个项目》，我们使用 `Flip Flop` 节点控制货梯。本质上，该节点会先执行分支 `A`，然后执行分支 `B`，在两者之间交替。我们将用它来让\
  \ `E` 键先打开制品，然后允许玩家放置炸弹并开始倒计时。前往 `Palette`（调色板）面板中的搜索框，搜索 `Flip Flop`，并将一个拖入 `Blueprint`（蓝图）窗口。断开\
  \ `E` 事件与 `Do Once` 节点之间的连接，并按上图所示进行连接。\n\n### 设置 Print String 倒计时\n\n5.  让我们创建倒计时。对于此功能，我们将使用\
  \ `Print String`（打印字符串）节点在触发爆炸声音前打印出 5 秒倒计时。\n\n    ![使用音效](img/B05189_09_15.jpg)\n\
  \n    *在倒计时中编程 Print String 节点*\n\n\n\n\n6. 首先，我们需要一个 `Delay` 节点和一个 `Print String`\
  \ 节点。这两个节点都可以通过 `Palette` 面板中的搜索框找到。对于 `Delay` 节点，保持 `Duration` 为 `0.2` 即可。将 `Print\
  \ String` 节点上的 `In String` 选项更改为 `Explosives Armed: 5`。按住左键拖动选择这两个节点并复制/粘贴它们。在这些新节点上，将\
  \ `Delay` 节点的 `Duration` 改为 `1.0`，将 `Print String` 节点的 `In String` 改为 `Explosives\
  \ Armed: 4`。重复该过程三次以完成倒计时。序列中的最后一个节点是 `Activate` 节点。由于我们在 `Explosion Cue` 上关闭了 `Auto\
  \ Activate` 选项，该节点将激活组件并播放声音。现在所有部件都在 `Blueprint` 窗口中，像前面的图片那样将它们连接起来。\n\n7. 保存并编译我们的类\
  \ Blueprint。保存关卡并按下 `Play` 进行测试！\n\n现在我们的音效已经生效，完成爆炸效果只需几步。不过，在这个 Blueprint 中还有许多其他使用声音的机会。例如，我们可以为\
  \ Artifact 添加开启音效，或在其开启时播放一些诡异的音乐。多尝试一下，看看如何利用声音进一步增强氛围！\n\n# 使用粒子效果\n\n我们爆炸的声音效果已经就绪，Artifact\
  \ 也准备好被摧毁了！为了完成爆炸效果，我们需要一些粒子效果。我们在第 5 章 *Taking This Level Up a Notch* 中使用过各种粒子效果，来增强安检点和电梯处的脚本事件。在这里，我们将使用爆炸、火焰和烟雾来增强销毁效果，并在删除\
  \ Artifact 的不同组件时进行遮挡。让我们来看看：\n\n![Using particle effects](img/B05189_09_16.jpg)\n\
  \n在组件列表中添加一个爆炸粒子、一个火焰粒子和一个烟雾粒子。务必关闭 `Auto Activate`！\n\n在我们已经相当丰富的组件列表中，我们将添加爆炸、火焰和烟雾粒子发射器。像添加声音那样添加每个发射器，然后选中每一个，在\
  \ `Details` 面板中禁用 `Auto Activate` 选项。稍后我们将使用 Blueprint 节点 `Activate` 将它们重新开启。\n\n\
  ![Using particle effects](img/B05189_09_17.jpg)\n\n为 Artifact 的顶部和底部碎片创建两个单独的类 Blueprint。我们将在爆炸中将它们用作碎片。\n\
  \n让这次爆炸真正精彩的最后一个必要元素是添加飞散的碎块！当固体物体爆炸时，其部分碎片往往会向四面八方飞散。我们将通过让 Blueprint 生成启用了物理模拟的\
  \ Artifact 底部和顶部版本来模拟这一点，它们会四处飞散，并在 Artifact 的其余部分被销毁后留在关卡中：\n\n1. 这要求我们回到 `Blender`，将\
  \ `Top` 和 `Bottom` 作为单独的 FBX 文件导出。打开我们的 `Blender` 文件并选择 Artifact 的 `Top`。转到 `File`\
  \ 菜单并进入 `FBX Export` 界面。开启 `Selected Objects` 选项，以便仅导出 `Top`。此外，转到 `Geometries`\
  \ 选项卡并将 `Smoothing` 选项更改为 `Face`。给它起个独特的名字并导出！对 `Bottom` 碎片重复此操作，准备将它们导入 Unreal。\n\
  \n2. 将两个新的 FBX 文件作为静态网格体导入 Unreal，并将我们的 Artifact 材质应用到它们上。你会注意到，即使我们没有导入完整模型，材质依然完美工作。这是因为每个碎片的\
  \ UV 贴图仍然相同，无论我们使用完整的 Artifact 还是仅使用其部分。\n\n3. 创建两个新的类 Blueprint。通过点击 `Blueprint`\
  \ 按钮，选择 `New Empty Blueprint Class`，并选择 `Actor` 作为 `Parent Class`，为每个新的静态网格体创建一个类\
  \ `Blueprint`。我将它们命名为 `ArtifactTopChunk` 和 `ArtifactBotChunk`。\n\n4. 在每个 Blueprint\
  \ 中，添加相应的静态网格体作为组件。直接添加即可；无需移动它。这样，当我们使用 Blueprint 生成它们时，它们就会处于我们所需的确切位置。\n\n5.\
  \ 现在我们需要对它们的 `Details` 进行一些更改。 ![Using particle effects](img/B05189_09_18.jpg)\n\
  \n   为飞散的碎片应用物理模拟。\n\n6. 对于每个新 Blueprint，点击组件并在 `Details` 面板中找到 `Physics` 部分。首先，开启\
  \ `Simulate Physics`。这将允许我们的物体弹跳并受重力和外力影响。接下来，开启 `Mass in Kg`。通常，Unreal 会根据物体在关卡中的大小计算其质量。我们的两个碎片质量都在\
  \ 500 kg 左右，不太适合作为飞散的碎片。开启 `Mass in Kg` 允许我们覆盖 Unreal 的估算值，并填入我们希望的重量值。我用了 `50`\
  \ kg，但你可以随意使用任何值。稍后随时可以调整。务必对 `Top` 和 `Bottom` Artifact 碎片都执行此操作。\n\n是时候完成 Artifact\
  \ 的毁灭了。回到 Artifact 类 Blueprint，还有一个 `Component` 需要添加到我们的设置中。为了让 `Top` 和 `Bottom`\
  \ 碎片飞散，我们将使用 `Radial Impulse` 组件来模拟爆炸冲击力。通过 `Add Component` 菜单添加 `Radial Impulse`，并在\
  \ `Details` 面板中找到 `Radial Force Component` 部分。冲击力影响的半径在视口中显示为一个浅蓝色球体。增加 `Radius`\
  \ 属性的大小，直到它覆盖整个 Artifact。我用了 `250`。同样在 `Details` 面板中，找到 `Impulse` 部分并增加 `Impulse\
  \ Strength`。我用了 `2000`。最后，确保开启 `Impulse Vel Change` 选项。此选项确保 2000 单位的力直接作为速度变化施加。这将保证将我们的碎片抛得很远，甚至可能抛到玩家身上！\n\
  \n是时候进行最后的编程了！让我们看看：\n\n![Using particle effects](img/B05189_09_19.jpg)\n\n激活爆炸、火焰和烟雾粒子，然后销毁网格体部分。然后我们将使用两个\
  \ `Spawn Actor From Class` 节点生成 `Top` 和 `Bottom` 碎片。最后，触发 `Radial Impulse` 观看它们弹跳！\n\
  \n这一最后部分内容不多。我们将在倒计时部分末尾使用第二个 `Activate` 节点来激活所有粒子效果。然后使用 `Destroy Component` 节点移除爆炸中会被销毁的组件。接下来，我们将使用两个\
  \ `Spawn Actor From Class` 节点生成两个碎片，最后使用 `Fire Impulse` 节点将它们从爆炸中心抛出。最后，我们将 `Delay`\
  \ 4 秒，然后使用 `Destroy Actor` 清理整个场景。首先使用 `Palette` 中的搜索框获取 `Activate` 节点。将其放在倒计时序列的末尾，并将其连接到我们用于播放声音提示的\
  \ `Activate` 节点。`Activate` 节点需要一个或多个 `Targets` 来知道开启什么。从 `Components` 面板抓取 `P_Explosion`、`P_Smoke`\
  \ 和 `P_Fire` 组件并将它们拖入 Blueprint。将这些连接到 `Activate` 节点上的 `Target` 节点。\n\n接下来是 `Destroy\
  \ Component` 节点。我们将使用此节点删除爆炸中会被销毁的所有东西。将其连接到我们的 `Activate` 节点，并将其 `Targets` 设置为\
  \ `Artifact`、`collision box` 和所有 `tentacles`。\n\n轮到 `Spawn Actor From Class` 了！这个很棒的节点允许我们使用\
  \ Blueprint 生成其他类 Blueprint，但比 `Activate` 或 `Destroy Component` 需要更多参数。\n\n\n\n\n\
  # 完成神器爆炸效果\n\n## 爆炸序列设置\n\n![使用粒子效果](img/B05189_09_20.jpg)\n\n别忘了告诉 `Spawn Actor\
  \ From Class` 节点使用我们的顶部和底部碎片类 `Blueprint`。\n\n将 `Spawn Actor From Class` 节点放在 `Destroy\
  \ Component` 节点旁边并连接它们。我们需要告诉它的第一件事是生成什么类。点击下拉框并选择底部 `Artifact` 碎片。它需要知道的第二件事是在哪里生成。这可以通过将一个\
  \ `Get Actor Transform` 节点（在 `Palette` 的搜索框中找到）插入 `Spawn Transform` 选项来完成。现在我们准备好生成了！重复此步骤为顶部\
  \ `Artifact` 碎片设置一个 `Spawn Actor From Class` 节点。\n\n现在触发那个 `Radial Impulse`，使其成为真正的爆炸！\n\
  \n![使用粒子效果](img/B05189_09_21.jpg)\n\n对 `Fire Impulse` 节点使用这些设置。\n\n我们需要使用的节点是 `Fire\
  \ Impulse`。该节点唯一需要的是一个 `Target`。从 `Components` 面板获取我们的 `Radial Impulse` 组件并将其插入。\n\
  \n为了收尾，我们只需要做一些清理工作。在此序列的末尾，添加一个 `Delay` 和一个 `Destroy Actor` 节点。`Delay` 将设置为 `4.0`\
  \ 秒，以给声音留出播放时间，`Destroy Actor` 将以 `Self` 作为 `Target`。这将从关卡中移除所有类 `Blueprint`。然而，它会留下爆炸的碎片。尽管我们使用类\
  \ `Blueprint` 生成它们，但它们是独立的 Actor，当类 `Blueprint` 的其余部分自我删除时，它们不会被删除。\n\n确保序列按顺序连接并测试它。你应该会得到一个令人满意的爆炸，将\
  \ `Artifact` 的碎片四处抛散。如果玩家太近，甚至会将他们向后抛出！\n\n制作爆炸非常有趣，并且可以为任何体验增加一些动作感，但如果你享受构建这个序列的过程，不必止步于此。尝试添加更多爆炸粒子效果，或添加触手作为碎片以增加效果。\n\
  \n![使用粒子效果](img/B05189_09_22.jpg)\n\n最终结果！希望你们玩得和我一样开心！\n\n这难道不令人奇妙地满足吗？！为电子游戏构建一些惊人的东西，然后让玩家将其炸毁，这其中总有种独特的感觉。现在我们的游戏资产已正确设置，我们可以将其放入空间站关卡中，并将其作为目标来推动游戏玩法向前发展。在本章中，我们介绍了将我们完全贴图和动画化的\
  \ `Artifact` 引入 `Unreal` 并设置它在关卡中看起来很棒的过程。我们使用类 `Blueprint` 设置来组装零件，并创建了一种让玩家与其交互的方式，使其打开。然后我们添加了一些额外的组件和编程，允许玩家开始倒计时，并在火焰、烟雾和飞散碎片的绚丽表现中炸毁我们的游戏资产。\n\
  \n就这样，我们完成了！恭喜你读完这本书！你创建了一个很棒的游戏框架，可以在此基础上扩展，创造出一些惊人且独一无二的东西。你有两个白盒关卡，可以用在 Blender\
  \ 中创建的自定义艺术填充。你有两个游戏资产，可以进一步定制以适应你游戏的特定需求。我强烈建议你妥善完成这些关卡，并继续练习和打磨你的技能。成为你想成为的游戏设计师或游戏艺术家，我真心期待未来能玩到你独特的游戏！\n\
  \n坚持下去，继续创作游戏吧！\n"
