  \ 下载此文件。\n\n#### 勘误表\n\n\n\n### 勘误\n\n虽然我们已尽一切努力确保内容的准确性，但错误难免发生。如果您在我们的书籍中发现错误——无论是文本还是代码——我们将不胜感激如果您能向我们报告。这样做可以让其他读者免受挫折，并帮助我们改进本书的后续版本。如果您发现任何勘误，请访问\
  \ [提交勘误页面](http://www.packtpub.com/submit-errata) 报告，选择您的书籍，点击 `Errata Submission\
  \ Form` 链接，并填写错误详情。一旦您的勘误经核实，您的提交将被接受，勘误将上传到我们的网站，或添加到该书 `Errata` 部分的现有勘误列表中。\n\n\
