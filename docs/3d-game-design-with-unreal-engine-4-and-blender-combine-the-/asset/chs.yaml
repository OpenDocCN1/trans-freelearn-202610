  ### 使用粒子特效\n\n## 索引\n\n---\n\n## 致谢\n\n\n## 作者简介\n\n**Justin Plowman** 是一位游戏设计师和教育工作者，现居美国。年幼时，他发现了自己对电子游戏的热爱，以及游戏给他人带来的快乐。2005\
  \ 年，他开始教授高中生游戏开发，并乐于支持下一代开发者的梦想。他目前在西密歇根艺术与技术中心（[www.wmcat.org](http://www.wmcat.org)）教授弱势青少年游戏设计与开发；同时也在费里斯州立大学（[www.ferris.edu](http://www.ferris.edu)）的数字动画与游戏设计专业教授\
  \ Unreal Engine 开发。Justin 在教育领域使用 Unreal 技术已超过 10 年。闲暇时，他撰写与 Unreal 技术相关的各类学习教程，并通过关注近期行业新闻、学习教学与游戏开发的最佳实践来不断充实自己。可在\
  \ [`gamingbootcamp.wordpress.com/`](https://gamingbootcamp.wordpress.com/) 找到他。\n\
  \n撰写这本书对我来说是一段相当特别的旅程，因为它完全属于我从未预料到会做的事情范畴。然而，这确实是一次富有成效的经历，我无法对 *Packt Publishing*\
  \ 的各位给予我的这个机会表达足够的感谢。我想感谢我的妻子 Jennifer，感谢她帮助我在漫长的写作和开发之夜中保持专注；也要感谢我的好朋友 Jacob Pollak，感谢他提供了令人惊叹的封面艺术。最重要的是，我要感谢伟大的\
  \ Unreal Engine 在线社区，多年来它在提升和培育我的技能方面发挥了关键作用。这本书代表了我回馈社区的愿望，希望它能鼓励社区内更多的设计师和开发者也这样做。谢谢大家！\n\
  \n## 审阅者简介\n\n**Scott Hafner** 是一位拥有超过 10 年视频游戏行业经验的专业游戏设计师。在他的职业生涯中，Scott 曾担任制作人、游戏设计师和关卡设计师，涉足包括\
  \ MMO、第三人称射击游戏和 RPG 在内的多种平台和类型。\n\n我想感谢我的妻子，感谢她对我的一切所为持续给予的鼓励和支持！\n\n## 前言\n\n###\
