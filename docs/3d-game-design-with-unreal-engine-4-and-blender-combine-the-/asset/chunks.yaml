- raw: 'In this chapter, we took a look at the process of getting our game asset out
    of Blender and into Unreal using the FBX file format. FBX is a file format used
    in the game industry that is popular for its ability to not only hold information
    about an object''s geometry, but also information regarding textures, materials,
    and animation. We exported our FBX file from Blender and imported it into Unreal
    using the content browser. Once imported, the object still needed a collision
    mesh and materials. Finally, we were able to drop the crate into our level and
    replace many of our basic primitives with our brand new game asset. Congrats on
    completing your first trip through the art pipeline for your game! Before we get
    started with the next level, take some time and see if there is another game asset
    you would like to create and really add some more depth to the cargo ship we created.
    In the next chapter, the ship has taken us to a new level where the player will
    encounter new dangers and you will encounter new design challenges. Let''s press
    on!


    Now that we have experienced the art pipeline for Unreal, let''s kick our level
    design up a notch. In this chapter and the following chapters, we will be using
    the same process that we used previously, but we will be incorporating additional
    elements such as more level scripting, win conditions, animated game assets, and
    more. We will be further developing the story for our game and communicating to
    the player through level design and environment choices. The result will be a
    second level that builds off the survival horror feel we started building on the
    cargo ship. In this chapter, we will cover the following topics:


    *   Planning a more complex level


    *   Whiteboxing a level for better asset creation


    *   Level design principles


    *   Advanced scripting techniques


    *   Win and loss conditions


    # Planning a more complex level


    With the cargo ship level, we introduced the player to a sci-fi world in which
    a mystery crate becomes a gateway to greater adventure. As we move on to a second
    level, we need to answer a few questions:


    *   Where did that cargo ship come from?


    *   What clue did that crate provide?


    *   What dangers lurk behind the next corner?


    For me, the answers came from my entertainment influences. I am an avid reader
    of science fiction, as well as cerebral horror by authors like *H.P Lovecraft*.
    As a gamer, I enjoy games such as Dead Space, Mass Effect, and FEAR. So to pull
    from those influences, my thoughts turned to the crate containing some artifact
    plundered from an ancient race. This artifact somehow caused the disappearance
    of the crew of our cargo ship. However, an inspection of the crate left us with
    a clue: the name of an import/export broker based on a mining station not far
    from where the player found the abandoned freighter. Heading back to the bridge,
    the player sets a course for the space station.


    Like all good things, we will start this level with a sketch on paper:


    ![Planning a more complex level](OEBPS/Images/BO5189_05_01.jpg)


    Just like our cargo ship, we start our space station on paper


    For the space station, our design is centered on communicating the story to the
    player and providing a tense and foreboding atmosphere. Like the cargo ship they
    arrive on, the station is completely empty of any other human life. However, the
    area provides us as designers with ample opportunity to tell a story through scripted
    events.


    Looking at our map, we can plan ahead and designate different areas as points
    where we can increase the player''s sense of tension and direct the player toward
    the ultimate goal, the broker''s stall in the marketplace. Since we want to avoid
    obvious clues such as signs and text prompts, we can designate some areas on our
    map for scripted events. These are areas where we will use **Blueprints** to communicate
    to the player and give clues as to the next step of the story. In a space station,
    these might be automated announcements over the PA system (audio clues), collapsing
    corridor sections due to damage (using triggered particle events), or creating
    vistas for the player to marvel at that also highlight the next goal (using level
    geometry). Let''s take a look at the map. The player starts in the landing bay
    and has to progress through the airlock and security check. Here, we could use
    light, sounds, and some particle systems to create a malfunction that the player
    has to escape. Not deadly by any means, but it does communicate that there are
    no station staff present and that routine maintenance might have not been done
    in a while. Next, the player walks on to a promenade walkway. This could be an
    opportunity to present the player with a vista of the larger space station and
    highlight the location of the broker''s shop down below. This communicates to
    the player that they need to find a way down to the market and makes them think
    that the level is much larger than the playable area. The player will then move
    over to the elevator, but this will malfunction as well and crash to the bottom
    of the shaft and force the player to take the stairs. When they finally enter
    the broker''s stall, they should be on edge and ready for anything. Feel free
    to create your own interpretations of our scripted events and even add a few more.


    Now let''s move on to whiteboxing.


    ### Tip


    In this chapter, I will talk more about design principles and leave the actual
    whiteboxing to you, the reader. After working through [Chapter 2](#ch02.xhtml
    "Chapter 2. Starting Our First Project"), *Starting Our First Project*, I feel
    you have a strong foundation and can handle laying out the level.


    # Whiteboxing a level for better asset creation


    Back in  [Chapter 2](#ch02.xhtml "Chapter 2. Starting Our First Project"), *Starting
    Our First Project*, we used a method called whiteboxing to construct a mockup
    of our level. There are two reasons for this. First, we want to create a simple
    mock up for testing purposes with our target player base. Second, we want to get
    a good idea of how large to build our custom game assets, as well as where to
    put them. Through this process we quickly end up with a working prototype. For
    this level, we will be doing the same thing but we will also be paying attention
    to where we want the player to go and how they get there. This means using **blocking**  **volumes**.


    Blocking volumes are essentially invisible walls in your level. Designers use
    them to make sure players don''t get stuck in certain parts of the level and to
    ensure that players don''t just jump over a railing and miss an important scripted
    event. In our case, we want the player to not be able to fall into the space station''s
    docking area or just jump over the promenade railing. One would result in getting
    stuck (and we would just have to kill them to get them unstuck) and the other
    would result in the player skipping our scripted elevator event. By using blocking
    volumes, we can guarantee the player a smooth gaming experience.


    ### Tip


    It is important to consider when and where to use blocking volumes and to use
    them sparingly. We have all played games where an invisible wall has blocked an
    area that looks like it should otherwise be accessible. I still remember the frustration…


    Let''s add a blocking volume so that the player can''t just jump the railing:


    ![Whiteboxing a level for better asset creation](OEBPS/Images/BO5189_05_02.jpg)


    Adding a blocking volume


    Blocking volumes are placed into our level much in the same way as BSP brushes:


    1.  Inside Unreal, click on the **Volumes** tab located in the **Modes** panel.


    2.  Select **Blocking Volume** and drag one into the level.


    3.  The default shape is a box. Let''s adjust it to create an effective barrier
    to jumping off the promenade. In the **Brush** section of the **Details** panel,
    change the **X** to `1600`, change the **Y** to `30`, and keep the **Z** at `200`.


    4.  Move the shape to line up with the top of the railing.'
