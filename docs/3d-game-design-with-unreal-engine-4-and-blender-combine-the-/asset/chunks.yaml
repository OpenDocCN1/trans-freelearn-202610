    8. With our pistons working, let''s add some rotation to the gear. Slide the time
    slider to frame `5` and rotate the bone that controls it `45` degrees by pressing
    `R`, typing in `45`, and pressing `Enter`. Press `I` and select the `Rotation`
    option from the menu. Slide the time slider to frame `10` and repeat. Repeat this
    process until you have recorded new rotation keyframes for the gear bone and five
    frame intervals.


    9. Slide the time slider back and forth over the whole animation and test how
    it looks.


    # Summary


    We have just brought the Artifact to life! In game terms, the Artifact will take
    1 second to open. Feel free to adjust the keyframes in the Dope Sheet if you would
    like the process to take more or less time. More time might be appropriate if
    we wanted to created tension and fear. Less time might work better if we want
    to surprise the player or leave them little time to react to what happens next.
    Go with your gut and adjust the keyframes to meet your game''s needs. It is also
    possible to use this same process to animate the tentacle to give our asset more
    unholy life!


    In this chapter, we looked at the process of animating using the tools available
    inside Blender. We learned how to use keyframes and adjust those keyframes using
    the Dope Sheet. Finally, we created an armature of bones for the Artifact, which
    we were able to use to create an opening animation for when the player encounters
    it in Unreal. In the next chapter, we will import everything into Unreal and put
    all of these pieces together. We will then finish the project with a bang by having
    the player blow the Artifact up!


    Here we are. The end. Together, we''ve begun the process of creating a pretty
    good game idea. We started with a basic level that, when it comes right down to
    it, is simply two rooms connected by a hallway with a simple crate. From humble
    beginnings, our game has grown, as have our skills. Our simple cargo ship leads
    the player to a larger space station level. This level includes scripted events
    to move the story along and a game asset that looks great and animates. However,
    we are not done. How do we end our journey? We blow things up, that''s how!


    ## Chapter Topics


    *   Using class blueprints to bring it all together

    *   Creating an explosion using sound effects

    *   Adding particle effects


    # Creating a class blueprint to tie it all together


    We begin with the first step of any type of digital destruction, creation. Over
    the last few chapters, we have created a disturbing piece of ancient technology.
    The Artifact stands as a long forgotten terror weapon of another age, somehow
    brought forth by an unknown power. But we know the truth. That unknown power is
    us, and we are about to import all that we need to implement the Artifact on the
    deck of our space station. Players beware!


    Take a look at the end result:


    ![Creating a class blueprint to tie it all together](OEBPS/Images/B05189_09_01.jpg)


    To get started, we will need to import the Artifact body, the tentacle, and all
    of the texture maps from `Substance Painter`. Let''s start with exporting the
    main body of the Artifact.


    1. In Blender, open our file with the complete Artifact. The FBX file format will
    allow us to export both the completed 3D model and the animations we created,
    all in a single file.

    2. Select the Artifact only. Since it is now bound to the skeleton we created,
    the bones and the geometry should all be one piece.

    3. Now press `Alt` + `S` to reset the scale of our game asset. Doing this will
    make sure that we won''t have any weird scaling problems when we import the Artifact
    into Unreal.

    4. Head to the `File` menu and select `Export`. Choose `FBX` as our file format.

    5. On the first tab of the export menu, select the checkbox for `Selected Objects`.
    This will make sure that we get just the Artifact and not the tentacle.

    6. On the `Geometries` tab, change the `Smoothing` option to `Faces`.

    7. Name your file and click `Export`!


    Alright, we now have the latest version of the Artifact exported as an FBX. Now
    that we have exported a few things over the course of the book, do you feel like
    you have a good handle on the process? Try repeating the process with the tentacle
    now.


    ### Tip


    Once you are done working through all the exercises in this book, don''t just
    put it on a shelf. With all the different processes described in its pages, it
    makes a great reference!


    Time to bring up Unreal. Open the game engine and load our space station level.
    It''s been a while since we''ve taken a look at it, and there is no doubt in my
    mind that you''ve probably thought of improvements and new sections you would
    love to add. Don''t forget them! Just set them aside for now. Once we get our
    game assets in there and make them explode, you will have plenty of time to add
    things.


    Time to import into Unreal!


    ![Creating a class blueprint to tie it all together](OEBPS/Images/B05189_09_02.jpg)


    Importing a skeletal mesh is a bit different than a static mesh.


    1. Before we begin importing our pieces, let''s create a folder to hold our custom
    assets. Click on the `Content` folder in the `Content Browser` and then right-click
    on it. At the top of the menu that appears, select `New Folder` and name it `CustomAssets`.
    It''s very important not to use spaces or special characters (besides the underscore).

    2. Select our new folder and click `Import`. Select the `Artifact FBX` file.

    3. At the top of the `Import` menu, make sure `Import as Skeletal` and `Import
    Mesh` are selected. Now click the small arrow at the bottom of the section to
    open the advanced options. Lastly, turn on the check box to tell Unreal to use
    `To As Reference Pose`. A `Reference Pose` is the starting point for any animations
    associated with a skeletal mesh.

    4. Next, take a look at the `Animation` section of the menu. Turn on `Import Animations`
    to tell Unreal to bring in our open animation for the Artifact.

    5. Once all that is done, it''s time to click `Import`!


    Unreal will create a `Skeletal Mesh`, an `Animation`, a `Physics Asset`, and a
    `Skeleton` asset for the Artifact. Together, these pieces make up a fully functioning
    skeletal mesh that can be used within our game.


    ![Creating a class blueprint to tie it all together](OEBPS/Images/B05189_09_03.jpg)


    Take a moment and repeat the process for the tentacle, again being careful to
    make sure to export only selected objects from Blender. Next, we need to import
    all of our texture maps from Substance Painter:


    ![Creating a class blueprint to tie it all together](OEBPS/Images/B05189_09_04.jpg)


    Substance Painter stores its exported texture maps in `Documents\\Substance Painter\\export`.


    In the last part of [Chapter 6](#ch06.xhtml "Chapter 6. Monster Assets – The Level
    Totally Needs One of These"), *Monster Assets – The Level Totally Needs One of
    These*, we exported several texture maps for the Artifact that should be still
    be in the `Export` folder:


    1. Locate the `Export` folder for `Substance Painter`. By default it is located
    in the `Documents` folder, under `Substance Painter`, and finally under `Export`.

    2. Head back into Unreal and then bring up the `Export` folder from your computer''s
    task bar. Click and drag each of the texture maps we need into the `Content Browser`.
    Unreal will import them automatically.

    3. Time to set them all up as a usable material! Right-click in the `Content Browser`
    and select `Material` from the `Create Basic Asset` section of the menu. Name
    the material `Artifact_MAT`. This will open a `Material Editor` window:


    ![Creating a class blueprint to tie it all together](OEBPS/Images/B05189_09_05.jpg)

