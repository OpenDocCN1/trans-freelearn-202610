    \n7. To save us some time, we are going to turn on the **Symmetry** option in\
    \ the toolbar. Turn on **Symmetry** and adjust the **Mirror** axis with the button\
    \ to the right. Here, I am using **Mirror Z**.\n\n8. Back in the **Alphas** pane,\
    \ select the **Bevel** alpha and drag it into the **Properties** pane. This alpha\
    \ creates seams similar to where two metal plates fit together. Next, slide the\
    \ **Height** slider into the negative range. I slid mine all the way to the left\
    \ for `-1`. Adjust the size of the tool to something a bit smaller using *Ctrl*\
    \ + *right mouse button*, and click the *left mouse button* once to start our\
    \ seam. Holding the *Shift* key allows us to create a straight line from the last\
    \ place we clicked. Hold *Shift* and stretch the dotted line until the brush meets\
    \ our top detail. Clicking the *left mouse button* will now create a straight\
    \ seam from where we started to the top of the object. Since we are using **Symmetry**,\
    \ it also creates a seam for us on the back side as well.\n\n9. Now switch our\
    \ **Mirror** axis back to *X* and create another seam along the sides of the Artifact,\
    \ similar to what we did on the front and back: ![Using different maps to create\
    \ a more realistic look](OEBPS/Images/B05189_07_36.jpg)\n\n    Rivets make the\
    \ Artifact seem like it is made from metal plates\n\n10. Let's add some rivets!\
    \ Create a new layer in the **Layers** pane by clicking the **+** button and rename\
    \ it to Rivets by double-clicking the layer name. We might also want to rename\
    \ **Layer 1** to **Seams**. Remember that naming is important! Change the alpha\
    \ we are using to **RT\\_Industr\\_010**, resize your brush, and begin placing\
    \ rivets near the corners of our new \"metal plates.\" Remember to use the **Mirror\
    \ X** and **Mirror Z** symmetry axis options to make the process easier.\n\n11.\
    \ Add as many rivets and seams as you want to the top and bottom sections of the\
    \ Artifact to personalize it and make it your own. Just remember to use a new\
    \ layer each time you want to create a new group of details.\n\n12. Now press\
    \ *T* to go back to editing the **Quick Mask** and press *I* to invert the mask\
    \ again. Now add detail to the **Gear** and **Pistons**, just like we did for\
    \ the outer shell of the Artifact.\n\n13. Finally, let's create a folder in our\
    \ **Layers** pane by clicking the little folder button. Name it Height Info and\
    \ then drag each of your layers into it. This way, we can keep everything organized.\n\
    \n## Applying Smart Materials\n\nHow is the Artifact looking? Using this amazing\
    \ tool, we've been able to add some great detail to what might have been a somewhat\
    \ boring model. However, we still need to add some color and really make this\
    \ game asset shine! To simplify the process, we will take advantage of Substance\
    \ Painter's Smart Materials, collections of preset materials and settings that\
    \ are perfect for saving us time. When we combine these with a mask, we are able\
    \ to apply these great looking materials to specific parts of the Artifact.\n\n\
    We will use Smart Materials to give the Artifact a sinister look in just a short\
    \ time. Let's get started!\n\n1. Click on over to the **Smart Materials** tab\
    \ and scroll down to the **Steel dark stained** material. Click this material\
    \ and drag it into the **Layers** pane. This will apply the material to the whole\
    \ game asset: ![Using different maps to create a more realistic look](OEBPS/Images/B05189_07_37.jpg)\n\
    \n    Apply the Steel dark stained material\n"
  trans: "\n## 为制品添加细节\n\n2. 现在我们已经设置好项目了，继续保存它。就像 Unreal Engine 4 一样，Substance Painter\
    \ 是一个复杂的程序，会占用大量计算机资源。这可能导致它有时变得不稳定并崩溃。请记得经常保存！![使用不同的贴图创建更逼真的外观](img/B05189_07_31.jpg)\n\
    \n    从 Sci Fi Crate（科幻箱子）教程的 **Alphas** 文件夹导入所有 PSD 文件\n\n3. 让我们将一些额外工具导入程序。找到你保存\
    \ Sci Fi Crate 教程资源的位置并解压文件。在 **Alphas** 文件夹中，我们会找到几个新的 Alpha，Substance Painter\
    \ 可以将它们用作细节笔刷。选择文件夹中的所有 PSD 文件，并将它们拖拽到屏幕底部 **Shelf（货架）** 窗口中的 **Alphas** 选项卡。这会将它们添加到项目中供我们使用：![使用不同的贴图创建更逼真的外观](img/B05189_07_32.jpg)\n\
    \n    创建蒙版，以便我们只为制品的特定部分上色\n\n4. 是时候开始添加细节了。Substance Painter 通过改变物体的 **Height（高度）**、**Color（颜色）**、**Roughness（粗糙度）**\
    \ 和 **Metallic（金属度）** 属性来添加细节和颜色，而无需增加任何新几何体。我们将为制品添加新特征，例如腐蚀、接缝、铆钉等。这些细节将被添加到法线贴图中，以便我们随后在\
    \ Unreal 中使用。开始之前，让我们先遮盖住想要处理的区域。按 *T* 切换到 **Quick Mask（快速蒙版）** 模式。现在点击屏幕左上角菜单栏中的\
    \ **Polygon Fill（多边形填充）**。这将允许我们通过给多边形上色来遮盖想要处理的区域。在最右侧的 **Properties（属性）** 面板中，将\
    \ **Color（颜色）** 滑块全部向左拖动。我们想要将想要保护的区域涂成黑色。剩下的白色区域将会被我们要使用的工具编辑：![使用不同的贴图创建更逼真的外观](img/B05189_07_33.jpg)\n\
    \n    遮盖除顶部和底部以外的所有部分\n\n5. 在 **Properties（属性）** 面板中选择 **UV** 按钮。这将允许我们填充整个 UV\
    \ 岛。点击制品顶部和底部区域的外层外壳。接下来，按住 *Ctrl* 并使用*鼠标左键*旋转 3D 视图，以便选择位于顶部和底部的大多边形。如果制品滑出视野，使用\
    \ *Ctrl* + *鼠标中键* 移动相机。选中那些多边形后，按 *I* 键反选。现在我们可以在不接触其他部分的情况下为外部添加细节。完成遮盖后，点击菜单栏中的画笔图标返回绘画模式，并按\
    \ *T* 停止编辑 **Quick Mask（快速蒙版）** 并开始使用它：![使用不同的贴图创建更逼真的外观](img/B05189_07_34.jpg)\n\
    \n    让我们为最顶部添加一些细节\n\n6. 在 **Alphas（Alpha）** 面板中，选择 **RT\\_Industr\\_019** alpha\
    \ 并将其拖拽到 **Properties（属性）** 面板中的 **Alpha** 选项。在 **Properties（属性）** 面板的 **Alphas**\
    \ 选项下方是 **Material（材质）** 部分。点击 **Color（颜色）**、**Rough（粗糙度）** 和 **Metal（金属度）** 的按钮将它们关闭。我们只想让这些初始细节影响\
    \ **Height（高度）** 通道。（如果看不到选项，请点击 **Layers（图层）** 面板中的 **Layer 1** 图层。）旋转相机以便看到制品的顶部多边形。你可以通过按住\
    \ *Alt*，然后按住 *Shift*，最后使用*鼠标左键*将视图旋转到顶部，以获得精确的俯视图。视图应该会吸附到俯视图。将光标移至顶部多边形的中心，按住\
    \ *Ctrl* + *鼠标右键* 并拖动以调整工具大小以适应该面。在 **Properties（属性）** 面板的 **Material（材质）** 部分找到\
    \ **Height（高度）** 滑块。此滑块通过 -1 到 1 之间的值控制细节是凸出于制品表面还是切入内部。-1 会像饼干切割机一样在物体上切出凹槽。1\
    \ 会在物体顶部添加细节。将滑块完全向右拖动将其值设为 1，将笔刷与顶部对齐，然后点击。如果不满意结果，撤销并重试：![使用不同的贴图创建更逼真的外观](img/B05189_07_35.jpg)\n\
    \n    添加接缝可以让制品看起来更真实。对称工具能让你的工作时间减半。\n\n7. 为了节省时间，我们将开启工具栏中的 **Symmetry（对称）**\
    \ 选项。开启 **Symmetry（对称）** 并使用右侧的按钮调整 **Mirror（镜像）** 轴。这里我使用的是 **Mirror Z（镜像 Z）**。\n\
    \n8. 回到 **Alphas（Alpha）** 面板，选择 **Bevel（倒角）** alpha 并将其拖入 **Properties（属性）** 面板。此\
    \ alpha 创建的接缝类似于两块金属板拼接的地方。接下来，将 **Height（高度）** 滑块拖至负值范围。我将其完全向左拖动至 `-1`。使用 *Ctrl*\
    \ + *鼠标右键* 将工具大小调整得稍小一些，然后点击一次*鼠标左键*开始绘制接缝。按住 *Shift* 键允许我们从上次点击的位置创建一条直线。按住 *Shift*\
    \ 并拉伸虚线，直到笔刷遇到我们的顶部细节。现在点击*鼠标左键*将从起点到物体顶部创建一条直线接缝。由于我们使用了 **Symmetry（对称）**，它也会为我们在背面创建一条接缝。\n\
    \n9. 现在将 **Mirror（镜像）** 轴切回 *X*，并在制品侧面创建另一条接缝，类似于我们在正面和背面所做的：![使用不同的贴图创建更逼真的外观](img/B05189_07_36.jpg)\n\
    \n    铆钉让制品看起来像是由金属板制成的\n\n10. 让我们添加一些铆钉！在 **Layers（图层）** 面板中点击 **+** 按钮创建一个新图层，然后双击图层名称将其重命名为\
    \ Rivets（铆钉）。我们可能还想将 **Layer 1** 重命名为 **Seams（接缝）**。请记住命名很重要！将我们使用的 alpha 更改为\
    \ **RT\\_Industr\\_010**，调整笔刷大小，开始在新“金属板”角落附近放置铆钉。记得使用 **Mirror X（镜像 X）** 和 **Mirror\
    \ Z（镜像 Z）** 对称轴选项来简化流程。\n\n11. 根据需要为制品的顶部和底部区域添加任意数量的铆钉和接缝，使其个性化并独一无二。只需记住，每当你想创建一组新的细节时，就使用一个新图层。\n\
    \n12. 现在按 *T* 返回编辑 **Quick Mask（快速蒙版）**，再按 *I* 再次反选蒙版。现在为 **Gear（齿轮）** 和 **Pistons（活塞）**\
    \ 添加细节，就像我们为制品外壳所做的那样。\n\n13. 最后，让我们在 **Layers（图层）** 面板中点击小文件夹按钮创建一个文件夹。将其命名为\
    \ Height Info（高度信息），然后将每个图层拖入其中。这样我们就能保持一切井井有条。\n\n## 应用智能材质\n\n制品看起来怎么样？使用这个神奇的工具，我们已经为原本可能有点枯燥的模型添加了一些很棒的细节。然而，我们仍然需要添加一些颜色，真正让这个游戏资产大放异彩！为了简化流程，我们将利用\
    \ Substance Painter 的智能材质——预设材质和设置的集合，它们非常适合节省我们的时间。当我们将这些与蒙版结合时，就能将这些外观出色的材质应用到制品的特定部位。\n\
    \n我们将使用智能材质在短时间内赋予制品一种阴险的外观。让我们开始吧！\n\n1. 点击切换到 **Smart Materials（智能材质）** 选项卡，向下滚动找到\
    \ **Steel dark stained（深色染色钢铁）** 材质。点击该材质并将其拖拽到 **Layers（图层）** 面板中。这会将材质应用到整个游戏资产上：![使用不同的贴图创建更逼真的外观](img/B05189_07_37.jpg)\n\
    \n    应用深色染色钢铁材质\n"
