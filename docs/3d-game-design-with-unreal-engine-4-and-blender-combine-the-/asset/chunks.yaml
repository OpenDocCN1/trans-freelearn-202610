- raw: "Make sure to build your level and play it to check out your fully-lit bridge.\
    \ Once you are happy, apply some of the same techniques we learned to the hallway\
    \ and the second room, our cargo bay. Remember we are going for tension and mystery.\
    \ Since these areas are outside our \"safe\" bridge, I like to use red and yellow\
    \ light. Now let's add some fun interactive elements to our level by making the\
    \ doors and elevator work.\n\n# Adding interactive elements using Triggers and\
    \ Blueprints\n\nRight now, our game level is looking pretty good. We have given\
    \ it some props that make the player feel they are wandering around the insides\
    \ of a small cargo ship. Using lights, we have communicated to the player a sense\
    \ of danger and mystery. The final step in finishing this level will be to add\
    \ some basic interactive elements. For that we are going to need a **Blueprint**.\n\
    \nA Blueprint is a visual scripting engine built into the Unreal game engine that\
    \ allows artists and other non-programmers to program game mechanics and level\
    \ events without ever looking at a line of code. I have also found during my years\
    \ of teaching that it is a great way to introduce yourself to programming techniques,\
    \ as a Blueprint uses many of the same terms. For our purposes, we will use Blueprints\
    \ to animate our two doors and our elevator so that our player has some interactive\
    \ elements to play with:\n\n![Adding interactive elements using Triggers and Blueprints](OEBPS/Images/BO5189_02_18.jpg)\n\
    \nAll Blueprints have an Event to kick them off, followed by one or more Actions\n\
    \nMost of the basic programming that we will use as a level designer follows the\
    \ same basic pattern: an **Event** causes a number of **Actions** to occur. For\
    \ example, to cause a door to open, the event might be that the player walks up\
    \ to the door, and the actions would be to animate the door to the open position\
    \ and then close it after a few seconds. As we build our Blueprint sequences,\
    \ we will also learn about variables and data types. Let's get started with our\
    \ door sequence:\n\n1.  First we need a **Trigger**. This is a game object that\
    \ is used to detect if other objects, such as the player, have entered an area.\
    \ They come in a few different shapes, and the size can be adjusted for almost\
    \ any situation. Here, we will grab a **Box Trigger** from our **Modes** panel\
    \ and place it at the base of our door. This will cause the event that plays our\
    \ animation: ![Adding interactive elements using Triggers and Blueprints](OEBPS/Images/BO5189_02_19.jpg)\n\
    \n    Opening up the Level Blueprint using the Blueprints menu\n\n2.  Now it's\
    \ time to begin our sequence. Open the Level Blueprint by clicking on the Blueprints\
    \ button and selecting **Open Level Blueprint**. Navigating the Blueprint area\
    \ is done by holding the *RMB*, dragging in a direction, and using the *LMB* button\
    \ to select things: ![Adding interactive elements using Triggers and Blueprints](OEBPS/Images/BO5189_02_20.jpg)\n\
    \n    Creating the first Event\n\n3.  Go back to the level and make sure your\
    \ **Trigger** is selected. Now, in the **Blueprint** window, right-click in the\
    \ empty space and click the down arrow next to **Add Event** for **Trigger Box\
    \ 1** (your number may be different). Click the down arrow next to **Collision**\
    \ and select **Add On Actor Begin Overlap**. This event will fire when an **Actor**\
    \ (our player) begins to overlap with the **Trigger**.\n\n4.  Next we need a **Timeline**.\
    \ This is a node that allows you to animate a numeric datatype, such as a float\
    \ or a vector. In our case, we will use it to animate the vector position of our\
    \ door to make it seem like it's sliding. Right-click in the space next to your\
    \ event and go down to the very bottom of the list. Select **Add Timeline**. You\
    \ will be given the opportunity to give it a unique name. I named mine `Door1`,\
    \ which is not very descriptive, but it differentiates it from any other **Timeline**\
    \ we will create: ![Adding interactive elements using Triggers and Blueprints](OEBPS/Images/BO5189_02_21.jpg)\n\
    \n    Creating the Timeline animation curve\n\n5.  Open up the **Timeline** by\
    \ double-clicking on the node. Since we are animating a vector (a point in 3D\
    \ space), we need to click the **V+** button located in the top left of the **Timeline**\
    \ window. You will see three colored lines, which represent the **X**, **Y**,\
    \ and **Z** axes. What we are going to do is create key frames that correspond\
    \ to the important positions of a door: open, and closed. Before we add a keyframe\
    \ though, we need to make sure we are working just in the **X** axis, since that\
    \ is the direction we will be sliding our door. We do this with the little padlock\
    \ beside the **Y** and **Z** in the upper left of our graph. You may also want\
    \ to hide the axes by clicking the eye next to them as well.\n\n6.  Near **0**,\
    \ add a key by right-clicking and selecting **Add Key** to **X** axis. If you\
    \ were not exactly on zero, feel free to click the keyframe and change Time and\
    \ Value to zero. Next, add another key at 2 seconds and change its value to `100`.\
    \ We are telling the door to slide 100 units in the positive **X** axis direction.\
    \ Lastly, we can make the sliding more realistic by right-clicking on the first\
    \ key and setting **Key Interpolation** to `Auto`. You can view your handiwork\
    \ by clicking the Fit Horizontal and Fit Vertical arrows (near the padlocks) to\
    \ see the full curve: ![Adding interactive elements using Triggers and Blueprints](OEBPS/Images/BO5189_02_22.jpg)\n\
    \n    Blueprint that animates our door\n\n7.  Head back to the **Event Graph**\
    \ by clicking its tab. Now we need to take advantage of our animated value by\
    \ making our door move. The node we are looking for here is called **Set Actor\
    \ Location**. Right-click near the **Timeline** and type this in the **Search**\
    \ box. You can also use the **Find a Node** library if you have enabled your Palette\
    \ in the Windows menu. **Set Actor Location** requires two pieces of information\
    \ to work: the Target (what is moving) and the new location. Now, you might be\
    \ tempted to connect the yellow output of our **Timeline** right to the new location,\
    \ but it won't necessarily work. We need to take into account the existing location\
    \ of the door and add in our slide. For that we need to get the location of our\
    \ door. Click the door in the level and right-click in our Blueprint. In the search\
    \ box, type in `Get` `Actor` `Location`. We also need to get a node call **Vector\
    \ + Vector** to do our math for us. Connect all the nodes together, just like\
    \ you see in the previous picture, by left-clicking and holding on an output (such\
    \ as a colored dot or an arrow), then dragging out a \"wire\" and plugging into\
    \ the next node's input. Don't worry too much about this part; Unreal does not\
    \ allow you to plug a node into another node that doesn't accept that input.\n\
    \n8.  Now, our Get and Set nodes are still missing something. Neither node has\
    \ a target, so they don't know which object to reference. For that, we need a\
    \ **Name** variable. This is just a reference to something present in the level.\
    \ In the level, click on the door we want to animate. Now in the Blueprint, right-click\
    \ next to our **Set Actor Location** node and select **Create a Reference** to\
    \ **SM\\_Door2** (again, your number may be different). Now, plug that variable\
    \ into the target of our node. Repeat this process to create a name variable for\
    \ our **Get Actor Location** node.\n\n9.  The last part of the process is to go\
    \ back into the level, click on the door, and select **Movable** in the **Transform**\
    \ section of the **Details** panel. This will allow your door to animate. Now\
    \ build the level and test it out.\n\n10.  Everything working? Great! Make sure\
    \ to follow the process again for the second door at the other end of the hallway."
  fmt: "\nMake sure to build your level and play it to check out your fully-lit bridge.\
    \ Once you are happy, apply some of the same techniques we learned to the hallway\
    \ and the second room, our cargo bay. Remember we are going for tension and mystery.\
    \ Since these areas are outside our \"safe\" bridge, I like to use red and yellow\
    \ light. Now let's add some fun interactive elements to our level by making the\
    \ doors and elevator work.\n\n# Adding interactive elements using Triggers and\
    \ Blueprints\n\nRight now, our game level is looking pretty good. We have given\
    \ it some props that make the player feel they are wandering around the insides\
    \ of a small cargo ship. Using lights, we have communicated to the player a sense\
    \ of danger and mystery. The final step in finishing this level will be to add\
    \ some basic interactive elements. For that we are going to need a `Blueprint`.\n\
    \nA `Blueprint` is a visual scripting engine built into the Unreal game engine\
    \ that allows artists and other non-programmers to program game mechanics and\
    \ level events without ever looking at a line of code. I have also found during\
    \ my years of teaching that it is a great way to introduce yourself to programming\
    \ techniques, as a `Blueprint` uses many of the same terms. For our purposes,\
    \ we will use `Blueprints` to animate our two doors and our elevator so that our\
    \ player has some interactive elements to play with:\n\n![Adding interactive elements\
    \ using Triggers and Blueprints](OEBPS/Images/BO5189_02_18.jpg)\n\nAll `Blueprints`\
    \ have an `Event` to kick them off, followed by one or more `Actions`.\n\nMost\
    \ of the basic programming that we will use as a level designer follows the same\
    \ basic pattern: an `Event` causes a number of `Actions` to occur. For example,\
    \ to cause a door to open, the event might be that the player walks up to the\
    \ door, and the actions would be to animate the door to the open position and\
    \ then close it after a few seconds. As we build our `Blueprint` sequences, we\
    \ will also learn about variables and data types. Let's get started with our door\
    \ sequence:\n\n1.  First we need a `Trigger`. This is a game object that is used\
    \ to detect if other objects, such as the player, have entered an area. They come\
    \ in a few different shapes, and the size can be adjusted for almost any situation.\
    \ Here, we will grab a `Box Trigger` from our `Modes` panel and place it at the\
    \ base of our door. This will cause the event that plays our animation:\n    ![Adding\
    \ interactive elements using Triggers and Blueprints](OEBPS/Images/BO5189_02_19.jpg)\n\
    \n    Opening up the `Level Blueprint` using the `Blueprints` menu\n\n2.  Now\
    \ it's time to begin our sequence. Open the `Level Blueprint` by clicking on the\
    \ `Blueprints` button and selecting `Open Level Blueprint`. Navigating the `Blueprint`\
    \ area is done by holding the `RMB`, dragging in a direction, and using the `LMB`\
    \ button to select things:\n    ![Adding interactive elements using Triggers and\
    \ Blueprints](OEBPS/Images/BO5189_02_20.jpg)\n\n    Creating the first `Event`\n\
    \n3.  Go back to the level and make sure your `Trigger` is selected. Now, in the\
    \ `Blueprint` window, right-click in the empty space and click the down arrow\
    \ next to `Add Event` for `Trigger Box 1` (your number may be different). Click\
    \ the down arrow next to `Collision` and select `Add On Actor Begin Overlap`.\
    \ This event will fire when an `Actor` (our player) begins to overlap with the\
    \ `Trigger`.\n\n4.  Next we need a `Timeline`. This is a node that allows you\
    \ to animate a numeric datatype, such as a float or a vector. In our case, we\
    \ will use it to animate the vector position of our door to make it seem like\
    \ it's sliding. Right-click in the space next to your event and go down to the\
    \ very bottom of the list. Select `Add Timeline`. You will be given the opportunity\
    \ to give it a unique name. I named mine `Door1`, which is not very descriptive,\
    \ but it differentiates it from any other `Timeline` we will create:\n    ![Adding\
    \ interactive elements using Triggers and Blueprints](OEBPS/Images/BO5189_02_21.jpg)\n\
    \n    Creating the `Timeline` animation curve\n\n5.  Open up the `Timeline` by\
    \ double-clicking on the node. Since we are animating a vector (a point in 3D\
    \ space), we need to click the `V+` button located in the top left of the `Timeline`\
    \ window. You will see three colored lines, which represent the `X`, `Y`, and\
    \ `Z` axes. What we are going to do is create key frames that correspond to the\
    \ important positions of a door: open, and closed. Before we add a keyframe though,\
    \ we need to make sure we are working just in the `X` axis, since that is the\
    \ direction we will be sliding our door. We do this with the little padlock beside\
    \ the `Y` and `Z` in the upper left of our graph. You may also want to hide the\
    \ axes by clicking the eye next to them as well.\n\n6.  Near `0`, add a key by\
    \ right-clicking and selecting `Add Key` to `X` axis. If you were not exactly\
    \ on zero, feel free to click the keyframe and change Time and Value to zero.\
    \ Next, add another key at 2 seconds and change its value to `100`. We are telling\
    \ the door to slide 100 units in the positive `X` axis direction. Lastly, we can\
    \ make the sliding more realistic by right-clicking on the first key and setting\
    \ `Key Interpolation` to `Auto`. You can view your handiwork by clicking the `Fit\
    \ Horizontal` and `Fit Vertical` arrows (near the padlocks) to see the full curve:\n\
    \    ![Adding interactive elements using Triggers and Blueprints](OEBPS/Images/BO5189_02_22.jpg)\n\
    \n    `Blueprint` that animates our door\n\n7.  Head back to the `Event Graph`\
    \ by clicking its tab. Now we need to take advantage of our animated value by\
    \ making our door move. The node we are looking for here is called `Set Actor\
    \ Location`. Right-click near the `Timeline` and type this in the `Search` box.\
    \ You can also use the `Find a Node` library if you have enabled your `Palette`\
    \ in the `Windows` menu. `Set Actor Location` requires two pieces of information\
    \ to work: the `Target` (what is moving) and the new location. Now, you might\
    \ be tempted to connect the yellow output of our `Timeline` right to the new location,\
    \ but it won't necessarily work. We need to take into account the existing location\
    \ of the door and add in our slide. For that we need to get the location of our\
    \ door. Click the door in the level and right-click in our `Blueprint`. In the\
    \ search box, type in `Get` `Actor` `Location`. We also need to get a node call\
    \ `Vector + Vector` to do our math for us. Connect all the nodes together, just\
    \ like you see in the previous picture, by left-clicking and holding on an output\
    \ (such as a colored dot or an arrow), then dragging out a \"wire\" and plugging\
    \ into the next node's input. Don't worry too much about this part; Unreal does\
    \ not allow you to plug a node into another node that doesn't accept that input.\n\
    \n8.  Now, our Get and Set nodes are still missing something. Neither node has\
    \ a target, so they don't know which object to reference. For that, we need a\
    \ `Name` variable. This is just a reference to something present in the level.\
    \ In the level, click on the door we want to animate. Now in the `Blueprint`,\
    \ right-click next to our `Set Actor Location` node and select `Create a Reference`\
    \ to `SM_Door2` (again, your number may be different). Now, plug that variable\
    \ into the target of our node. Repeat this process to create a name variable for\
    \ our `Get Actor Location` node.\n\n9.  The last part of the process is to go\
    \ back into the level, click on the door, and select `Movable` in the `Transform`\
    \ section of the `Details` panel. This will allow your door to animate. Now build\
    \ the level and test it out.\n\n10.  Everything working? Great! Make sure to follow\
    \ the process again for the second door at the other end of the hallway.\n"
  trans: "\n确保构建你的关卡并运行它，以检查你完全点亮的桥梁。一旦你满意了，将我们学到的一些相同技巧应用到走廊和第二个房间——我们的货舱。记住我们要营造的是紧张感和神秘感。既然这些区域位于我们的“安全”桥梁之外，我倾向于使用红光和黄光。现在让我们通过让门和电梯运作起来，为关卡添加一些有趣的交互元素。\n\
    \n# 使用触发器和蓝图添加交互元素\n\n目前，我们的游戏关卡看起来已经相当不错了。我们给它添加了一些道具，让玩家感觉自己正徘徊在一艘小型货船的内部。通过灯光，我们向玩家传达了一种危险感和神秘感。完成这个关卡的最后一步将是添加一些基础的交互元素。为此我们将需要一个\
    \ `Blueprint`（蓝图）。\n\n`Blueprint`（蓝图）是虚幻引擎内置的可视化脚本引擎，它允许美术人员和其他非程序员在完全不接触一行代码的情况下编程游戏机制和关卡事件。我多年的教学经验也发现，这是一个让你接触编程技巧的绝佳途径，因为\
    \ `Blueprint` 使用了许多相同的术语。为了我们的目的，我们将使用 `Blueprint` 来为我们的两扇门和电梯制作动画，以便玩家有一些交互元素可以玩弄：\n\
    \n![使用触发器和蓝图添加交互元素](img/BO5189_02_18.jpg)\n\n所有的 `Blueprint` 都有一个用于启动它们的 `Event`（事件），后面跟着一个或多个\
    \ `Action`（动作）。\n\n作为关卡设计师，我们将使用的大多数基础编程都遵循相同的基本模式：一个 `Event` 导致若干个 `Action` 发生。例如，要让一扇门打开，事件可能是玩家走到门前，而动作则是将门动画移动到打开位置，然后在几秒钟后关闭。当我们构建\
    \ `Blueprint` 序列时，我们也将了解变量和数据类型。让我们开始制作门的序列吧：\n\n1.  首先我们需要一个 `Trigger`（触发器）。这是一个游戏对象，用于检测其他对象（如玩家）是否进入了某个区域。它们有几种不同的形状，且尺寸几乎可以调整以适应任何情况。在这里，我们将从\
    \ `Modes`（模式）面板中获取一个 `Box Trigger`（盒子触发器）并将其放置在门的底部。这将触发播放我们动画的事件：\n    ![使用触发器和蓝图添加交互元素](img/BO5189_02_19.jpg)\n\
    \n    通过 `Blueprints` 菜单打开 `Level Blueprint`（关卡蓝图）\n\n2.  现在开始构建我们的序列。点击 `Blueprints`\
    \ 按钮并选择 `Open Level Blueprint` 来打开 `Level Blueprint`。在 `Blueprint` 区域中导航的方法是：按住\
    \ `RMB`（右键），向某个方向拖动，并使用 `LMB`（左键）来选择事物：\n    ![使用触发器和蓝图添加交互元素](img/BO5189_02_20.jpg)\n\
    \n    创建第一个 `Event`\n\n3.  回到关卡编辑器，确保你的 `Trigger` 已被选中。现在，在 `Blueprint` 窗口中，在空白处右键点击，然后点击\
    \ `Trigger Box 1`（你的数字可能不同）的 `Add Event`（添加事件）旁边的向下箭头。点击 `Collision`（碰撞）旁边的向下箭头并选择\
    \ `Add On Actor Begin Overlap`（添加 ActorBeginOverlap 事件）。当一个 `Actor`（我们的玩家）开始与\
    \ `Trigger` 重叠时，此事件将被触发。\n\n4.  接下来我们需要一个 `Timeline`（时间轴）。这是一个节点，允许你为数值数据类型（如浮点数或向量）制作动画。在我们的例子中，我们将用它来为门的向量位置制作动画，使其看起来像在滑动。在事件旁边的空白处右键点击，一直向下滑到列表底部。选择\
    \ `Add Timeline`。你将有机会给它起一个唯一的名字。我将我的命名为 `Door1`，这不是很有描述性，但能将其与我们将创建的任何其他 `Timeline`\
    \ 区分开：\n    ![使用触发器和蓝图添加交互元素](img/BO5189_02_21.jpg)\n\n    创建 `Timeline` 动画曲线\n\
    \n5.  通过双击节点打开 `Timeline`。既然我们要为向量（三维空间中的一个点）制作动画，我们需要点击 `Timeline` 窗口左上角的 `V+`\
    \ 按钮。你将看到三条彩色线，它们分别代表 `X`、`Y` 和 `Z` 轴。我们要做的是创建对应门的重要位置的关键帧：打开和关闭。但在添加关键帧之前，我们需要确保我们只在\
    \ `X` 轴上工作，因为那是我们将滑动门的方向。我们通过图表左上角 `Y` 和 `Z` 旁边的小锁图标来实现这一点。你可能也想通过点击它们旁边的眼睛图标来隐藏这些轴。\n\
    \n6.  在 `0` 附近，通过右键点击并选择 `Add Key` 向 `X` 轴添加一个关键帧。如果你没有正好在零点上，可以随意点击关键帧并将 Time\
    \ 和 Value 都改为零。接下来，在 2 秒处添加另一个关键帧并将其值改为 `100`。我们是在告诉门沿正 `X` 轴方向滑动 100 个单位。最后，我们可以通过右键点击第一个关键帧并将\
    \ `Key Interpolation` 设置为 `Auto` 来使滑动更逼真。你可以通过点击 `Fit Horizontal` 和 `Fit Vertical`\
    \ 箭头（靠近锁图标的地方）来查看完整的曲线，以检查你的成果：\n    ![使用触发器和蓝图添加交互元素](img/BO5189_02_22.jpg)\n\
    \n    为门制作动画的 `Blueprint`\n\n7.  通过点击其标签页返回 `Event Graph`（事件图表）。现在我们需要利用我们的动画值让门移动。我们要找的节点叫做\
    \ `Set Actor Location`（设置 Actor 位置）。在 `Timeline` 附近右键点击，在 `Search`（搜索）框中输入这个名称。如果你在\
    \ `Windows` 菜单中启用了 `Palette`（调色板），也可以使用 `Find a Node`（查找节点）库。`Set Actor Location`\
    \ 需要两条信息才能工作：`Target`（目标，即什么在移动）和新位置。现在，你可能想直接把 `Timeline` 的黄色输出连接到新位置，但这不一定行得通。我们需要考虑门现有的位置并加上我们的滑动量。为此我们需要获取门的位置。在关卡中点击门，然后在我们的\
    \ `Blueprint` 中右键点击。在搜索框中输入 `Get` `Actor` `Location`。我们还需要一个名为 `Vector + Vector`\
    \ 的节点来为我们进行数学运算。像你在上一张图片中看到的那样连接所有节点：按住节点的输出（如彩色圆点或箭头）左键拖出一根“线”，插入到下一个节点的输入端。不用太担心这部分；虚幻引擎不允许你将一个节点插入到不接受该输入的另一个节点中。\n\
    \n8.  现在，我们的 Get 和 Set 节点仍然缺少一些东西。两个节点都没有目标，所以它们不知道引用哪个对象。为此，我们需要一个 `Name` 变量。这只是对关卡中存在的某物的引用。在关卡中，点击我们想要制作动画的门。现在在\
    \ `Blueprint` 中，在 `Set Actor Location` 节点旁边右键点击，选择 `Create a Reference` to `SM_Door2`（同样，你的数字可能不同）。现在，将该变量插入到我们节点的目标端。重复此过程，为\
    \ `Get Actor Location` 节点创建一个名称变量。\n\n9.  该过程的最后一部分是回到关卡中，点击门，并在 `Details` 面板的\
    \ `Transform` 部分选择 `Movable`。这将允许你的门制作动画。现在构建关卡并测试一下。\n\n10. 一切正常吗？太棒了！确保再次按照该流程为走廊另一端的第二扇门进行操作。\n\
    \n"
