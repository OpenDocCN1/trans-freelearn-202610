    # 在虚幻引擎中使用材质和类蓝图


    ## 材质编辑器


    `Material Editor`（材质编辑器）的工作方式类似于在 `Blueprint`（蓝图）中编程，并使用相似的节点结构。中心的大节点代表最终结果。


    ### 提示


    为电子游戏创建材质和着色器本身就是一种艺术形式。这里我将从基础角度谈论创建材质，但我建议你查阅虚幻文档，打开 `Starter Content`（初学者内容）文件夹中的一些现有材质，并开始探索这个功能高度多样化的工具。


    ## 向材质添加纹理


    4. 因此我们需要将纹理添加到新材质中。向任何材质添加纹理贴图的一个简单方法是，从 `Content Browser`（内容浏览器）中点击并拖拽它们进入 `Material
    Editor`（材质编辑器）。这将创建一个名为 `Texture Sample`（纹理采样）的节点，该节点可以插入主材质节点上的不同插槽。


    5. 现在将每个贴图插入。从每个 `Texture Sample`（纹理采样）右侧的白色连接点拖出一根连线，连接到主材质节点上相应的插槽。`Metallic`（金属度）和
    `Roughness`（粗糙度）纹理采样将插入主节点上的两个插槽。


    6. 让我们预览结果。回到 `Content Browser`（内容浏览器），选择 `Artifact`（神器）。然后，在 `Material Editor`（材质编辑器）的
    `Preview Window`（预览窗口）中，选择最右侧的小按钮，即 **Set the Preview Mesh based on the current
    Content Browser selection**（根据当前内容浏览器选择设置预览网格体）。


    ![Creating a class blueprint to tie it all together](img/B05189_09_06.jpg)


    我们导入的四张贴图中的每一张都在主材质节点上有一个对应的插槽。


    7. 材质出来有点太亮了。材质发出的大量高光称为镜面高光，由主材质节点上的 `Specular`（镜面反射）连接控制。如果我们查阅文档，可以看到该节点部分接受
    `0` 到 `1` 之间的值。我们该如何做呢？`Material Editor`（材质编辑器）有一个 `Constant`（常量）节点，允许我们输入一个数字，然后将其插入到我们可能需要的任何地方。这非常完美！在
    `Material Editor`（材质编辑器）右侧的 `Palette`（调色板）搜索框中搜索 `Constant`（常量）。将其拖入到其他节点所在的区域，然后前往
    `Details`（详情）面板。在 `Value`（值）字段中，尝试 `0` 到 `1` 之间的不同值并预览结果。我最终使用了 `0.1`。保存你的更改。


    是时候在我们的神器上试一试了！


    ![Creating a class blueprint to tie it all together](img/B05189_09_07.jpg)


    在 `Skeletal Mesh`（骨骼网格体）编辑器中，在 `Mesh Details`（网格体详情）面板将我们的新材质分配给神器。


    8. 双击 `Skeletal Mesh`（骨骼网格体）以打开 `Skeletal Mesh`（骨骼网格体）编辑器窗口。在左侧，寻找菜单的 `LOD0` 部分。此部分有一个添加材质的选项（我在前面的图片中已将其高亮显示）。回到内容浏览器并选择我们的
    `Artifact_MAT` 材质。现在选择 `LOD0` 框中的小箭头，将选择应用到神器上。


    效果如何？太亮了？还是不够亮？请随意调整材质节点中的 `Constant`（常量）节点，直到你获得想要的结果。当你满意后，对触手重复该过程。我们将把它作为静态网格体导入（因为它没有任何动画），并使用我们在
    `Substance Painter` 中创建的纹理贴图为它创建一个材质。


    ## 使用类蓝图进行最终组装


    现在我们将使用 `Class Blueprint`（类蓝图）进行最终组装。


    ![Creating a class blueprint to tie it all together](img/B05189_09_08.jpg)


    ### 神器类蓝图


    类蓝图是一种独立的蓝图形式，它允许我们将美术资源与编程结合在一个易于使用且最重要的是可复用的包中。例如，玩家角色就是一个类蓝图，因为它将玩家角色的 `Skeletal
    Mesh`（骨骼网格体）与蓝图代码结合在一起，帮助玩家四处移动：


    ![Creating a class blueprint to tie it all together](img/B05189_09_09.jpg)


    第一人称角色是类蓝图的一个绝佳例子。


    那么我们如何以及何时使用类蓝图，而不是直接将代码放在关卡蓝图中？关卡蓝图非常适合特定于该关卡的任何内容。这类内容包括以熔岩为基础的关卡中的火山，或太空站关卡背景中的飞船。类蓝图非常适合构建独立且可重复的对象，例如门、敌人或道具。这些类型的物品会被频繁使用，并在游戏的多个关卡中都有其位置。


    ## 为神器创建类蓝图


    让我们为神器创建一个类蓝图：


    1. 点击 `Blueprints`（蓝图）按钮并选择 `New Empty Blueprints`（新建空蓝图）选项卡。这将打开 `Pick Parent
    Class`（选择父类）菜单。既然我们要创建一个道具，而不是玩家需要直接控制的东西，请选择 `Actor Parent Class`（Actor 父类）。


    2. 下一个屏幕会要求我们为新类命名并选择保存位置。我选择将其保存在我的 `CustomAssets`（自定义资产）文件夹中，并将其命名为 `Artifact_Blueprint`。


    3. 欢迎来到 `Class Blueprint`（类蓝图）编辑器：


    ![Creating a class blueprint to tie it all together](img/B05189_09_10.jpg)


    类蓝图编辑器拥有虚幻引擎内其他编辑器通用的几个面板。


    4. 与虚幻引擎内的其他编辑器窗口类似，`Class Blueprint`（类蓝图）编辑器既有 `Details`（详情）面板，也有 `Palette`（调色板）。但是，有一个面板是我们新接触的。`Components`（组件）面板包含构成类蓝图的美术类型列表。这些组件是构成整个对象的各个部分。对于我们的神器，这将包括主体本身、任意数量的触手和一个碰撞箱。可以添加的其他组件包括粒子发射器、音频，甚至灯光。


    5. 让我们添加 `Artifact`（神器）。在 `Components`（组件）部分，点击 `Add Component`（添加组件）按钮，并从下拉列表中选择
    `Skeletal Mesh`（骨骼网格体）。你可以在 `Common`（常用）部分找到它。这会向视口和 `Components`（组件）列表添加一个空白的
    `Skeletal Mesh`（骨骼网格体）。选中它，查看 `Details`（详情）面板。在 `Mesh`（网格体）部分有一个区域用于分配你希望它成为的骨骼网格体。回到
    `Content Browser`（内容浏览器），选择 `Artifact`（神器）。最后，回到 `Blueprint Editor`（蓝图编辑器）的 `Details`（详情）面板，点击
    `Skeletal Mesh`（骨骼网格体）选项旁边的小箭头以分配 `Artifact`（神器）。它现在应该出现在视口中。


    6. 回到 `Components`（组件）列表。让我们添加一个 `Box Collision`（盒子碰撞）。点击 `Add Component`（添加组件），并从菜单的
    `Collision`（碰撞）部分选择 `Box Collision`（盒子碰撞）：


    ![Creating a class blueprint to tie it all together](img/B05189_09_23.jpg)


    选择添加组件按钮并从下拉菜单中选择盒子碰撞。


    7. 点击它，并在 `Details`（详情）面板中增加 `Box Extents`（盒子范围）到允许玩家进入其范围内的大小。我对 *x*、*y* 和 *z*
    都使用了 `180`。


    8. 重复最后几个步骤，使用 `Add Component`（添加组件）菜单将触手添加到神器上。我们将使用 `Static Mesh`（静态网格体）选项。设计需要三个，但如果你喜欢可以添加更多。


    9. 是时候给这个类蓝图添加一点编程逻辑了。我们希望玩家能走到神器前，按下 `E` 键将其打开。


    ![Creating a class blueprint to tie it all together](img/B05189_09_11.jpg)


    ### 编程神器


    '
