- raw: "With everything separated out, there is one more step that we need to take\
    \ before we start animating. Because we are creating a static mesh that includes\
    \ animations, the Artifact will be brought into Unreal as a **skeletal mesh**.\
    \ Skeletal meshes are created from two parts, the static mesh object itself and\
    \ a system of bones for manipulating the mesh. That means the Artifact needs bones!\n\
    \nTo animate the Artifact, each piece that moves needs a bone. These bones will\
    \ be connected to a single bone that Unreal will read as the root. We will then\
    \ animate the bones, rather than the mesh itself.\n\nWe will begin with a single\
    \ bone:\n\n![Rigging and using keyframes](OEBPS/Images/B05189_08_11.jpg)\n\nAdding\
    \ the first bone\n\nHere's how we add it:\n\n1.  First, we need to move the 3D\
    \ cursor to the center of the bottom section. Select the bottom of the Artifact\
    \ and press *Shift* + *S* to open the **Snap** menu. Select **Cursor to Selected**\
    \ to move the 3D cursor into position.\n\n2.  Now head to the **Add** menu, select\
    \ **Armature**, and add in a **Single Bone**. Blender should add it right at the\
    \ bottom center of the piece. Scale the bone so it lines up with only the bottom\
    \ section of the Artifact, similar to what you see in the previous screenshot.\
    \ It might help to press the *Z* key and look at things in wireframe mode.\n\n\
    3.  Select the new bone and head to **Edit** mode: ![Rigging and using keyframes](OEBPS/Images/B05189_08_12.jpg)\n\
    \n    Adding the bone that controls the top\n\n4.  Now that we are in **Edit**\
    \ mode, any bones that we add to the **Armature** for the Artifact will be connected\
    \ to the first bone as far as Unreal is concerned. This is important, since Unreal\
    \ only allows one armature per skeletal mesh. Click on the **Add** menu and select\
    \ **Single Bone**. This will add a new bone to the scene. Using the move arrows,\
    \ drag the new bone up in the *Z*\\-axis to give it some height.\n\n5.  Click\
    \ on the center of the new bone to highlight it and move it into position within\
    \ the top portion of the Artifact. This bone will control moving the lid up and\
    \ down during opening. Try to line it up similar to what you see in the image.\
    \ Since we moved our 3D cursor to the center of the Artifact, all of our bones\
    \ should be perfectly centered. This will be important when we animate: ![Rigging\
    \ and using keyframes](OEBPS/Images/B05189_08_13.jpg)\n\n    These three bones\
    \ will control the pistons\n\n6.  Time to add three bones to control the piston\
    \ parts. Just as we did to create the last bone, create a bone to control each\
    \ layer of the piston. Remember to size them similar to the pieces they control,\
    \ and line them up as shown in the screenshots: ![Rigging and using keyframes](OEBPS/Images/B05189_08_14.jpg)\n\
    \n    Add the bone that controls the gear\n\n7.  One last bone! Create a small\
    \ bone to control the gear. Once it has been created, move it into position and\
    \ then rotate it 90 degrees so that it is lying flat. This bone will spin to create\
    \ the rotating effect for the gear.\n\nWith all the bones created, we now have\
    \ to connect them to each section of the Artifact, so that moving the bones will\
    \ move the pieces they are tied to. In Blender, this process is called **Parenting**.\
    \ We will also be checking out a new mode that is exclusive to using Armatures:\
    \ the **Pose Mode**!\n\nTo get to **Pose Mode**, select your Armature and head\
    \ down to your modes dropdown:\n\n![Rigging and using keyframes](OEBPS/Images/B05189_08_15.jpg)\n\
    \nEnter Pose mode by selecting a bone and selecting Pose Mode from the Mode dropdown\n\
    \nFrom there, select  **Pose Mode**. In this mode, we can parent parts of our\
    \ 3D model to our new bones, and then keyframe them to create our animation of\
    \ the Artifact opening:\n\n![Rigging and using keyframes](OEBPS/Images/B05189_08_16.jpg)\n\
    \nPress Ctrl + P to open the Set Parenting To menu and then choose Bone. This\
    \ will bind the bottom section to its appropriate bone\n\nBlender makes the **Parenting**\
    \ process quick and easy:\n\n1.  Select the piece we would like to parent. Let's\
    \ start with the bottom section.\n\n2.  Holding the *Shift* key, select the bone\
    \ you would like to parent to the bottom of the Artifact. In this case, this is\
    \ the first bone we created.\n\n3.  Press *Ctrl* + *P*; this will open the **Set\
    \ Parenting To** menu. Select the **Bone** option.\n\n4.  Lastly, test that the\
    \ bone is now connected to the bottom piece by selecting the bone and sliding\
    \ it in any direction. The bottom of the Artifact should slide with it. Press\
    \ *Ctrl* + *Z* to return it to its original position.\n\nFor each bone, repeat\
    \ the process to parent them to their respective pieces. Once we have completed\
    \ the **Parenting** process, we are ready to animate!\n\n# Using Blender's suite\
    \ of animation tools\n\nTime to bring the Artifact to life! Good animation can\
    \ breathe character and vitality into any object. Many beginning animators start\
    \ with the *12 Basic Principles of Animation* originally written by Disney animators\
    \ *Ollie Johnston* and *Frank Thomas* and I highly recommend checking them out.\
    \ What we will be looking at for the Artifact is basic mechanical animation. Our\
    \ pistons will move and our gear will rotate. However, I would encourage you to\
    \ read up on the basics and apply what you've learned later on.\n\nJust like we\
    \ did earlier when we practiced with the cube, we are going to create some keyframes,\
    \ but in this case, we will be moving the bones we created and not the pieces\
    \ of the Artifact itself. The result will be a game asset that we can trigger\
    \ to open within Unreal:\n\n![Using Blender's suite of animation tools](OEBPS/Images/B05189_08_17.jpg)\n\
    \nManipulate the bones by using the Armature group in the Scene Outliner\n\nUsing\
    \ **Pose** mode, let's move the Artifact into the closed position:\n\n1.  To make\
    \ things easier, select your Armature in the **Scene Outliner** and click on the\
    \ little **+** icon. This will list all the current features tied to your Armature.\
    \ Check out the **Pose** option. For each bone that we created, there is a little\
    \ bone icon that we can click to select and deselect specific bones. This will\
    \ be very handy as we move forward.\n\n2.  Using the **Scene Outliner**, select\
    \ each bone in turn and move them down until the Artifact is closed. This is best\
    \ done from the **Front** view.\n\n3.  With everything closed, it is time to record\
    \ our first keyframe. With all the bones selected, press *I* to open the **Insert\
    \ Keyframe Menu** and select the **Location** option. This will record all of\
    \ the initial positions of each of the pieces of the Artifact in frame 1. In Unreal,\
    \ this will be used as our reference pose or starting pose: ![Using Blender's\
    \ suite of animation tools](OEBPS/Images/B05189_08_18.jpg)\n\n    Animating the\
    \ pistons extending\n\n4.  Now move the time slider in the **Timeline** at the\
    \ bottom of the screen to frame `10`. Next, deselect the bone that controls the\
    \ bottom section. Move the other bones up until the bottom section of the piston\
    \ has reached full extension. Press *I* and record the new location of the bones:\
    \ ![Using Blender's suite of animation tools](OEBPS/Images/B05189_08_19.jpg)\n\
    \n    Extend each section of the piston and then create a keyframe\n\n5.  Move\
    \ the time slider to frame `20` and deselect the bone that controls the bottom\
    \ layer of the piston. Move the remaining bones up until the middle layer of the\
    \ piston is at full extension. Press *I* and record the new location of the bones:\
    \ ![Using Blender's suite of animation tools](OEBPS/Images/B05189_08_20.jpg)\n\
    \n    The pistons at full extension\n\n6.  Last move! Move the time slider to\
    \ frame `30` and deselect the bone that controls the middle layer of the piston.\
    \ Move the remaining bones up until the top layer of the piston is at full extension.\
    \ Press *I* and record the new location of the bones.\n\n7.  Slide the time slider\
    \ back and forth across our keyframes and watch as the Artifact opens and closes.\
    \ Make some monster noises as you do so."
  fmt: '

    # Rigging the Artifact


    With everything separated out, there is one more step that we need to take before
    we start animating. Because we are creating a static mesh that includes animations,
    the Artifact will be brought into Unreal as a `skeletal mesh`. Skeletal meshes
    are created from two parts, the static mesh object itself and a system of bones
    for manipulating the mesh. That means the Artifact needs bones!


    To animate the Artifact, each piece that moves needs a bone. These bones will
    be connected to a single bone that Unreal will read as the root. We will then
    animate the bones, rather than the mesh itself.


    ## Adding Bones


    ### First Bone


    We will begin with a single bone:


    ![Rigging and using keyframes](OEBPS/Images/B05189_08_11.jpg)


    Adding the first bone


    Here''s how we add it:


    1. First, we need to move the 3D cursor to the center of the bottom section. Select
    the bottom of the Artifact and press `Shift` + `S` to open the `Snap` menu. Select
    `Cursor to Selected` to move the 3D cursor into position.


    2. Now head to the `Add` menu, select `Armature`, and add in a `Single Bone`.
    Blender should add it right at the bottom center of the piece. Scale the bone
    so it lines up with only the bottom section of the Artifact, similar to what you
    see in the previous screenshot. It might help to press the `Z` key and look at
    things in wireframe mode.


    3. Select the new bone and head to `Edit` mode:


    ![Rigging and using keyframes](OEBPS/Images/B05189_08_12.jpg)


    Adding the bone that controls the top


    ### Additional Bones


    4. Now that we are in `Edit` mode, any bones that we add to the `Armature` for
    the Artifact will be connected to the first bone as far as Unreal is concerned.
    This is important, since Unreal only allows one armature per skeletal mesh. Click
    on the `Add` menu and select `Single Bone`. This will add a new bone to the scene.
    Using the move arrows, drag the new bone up in the `Z`-axis to give it some height.


    5. Click on the center of the new bone to highlight it and move it into position
    within the top portion of the Artifact. This bone will control moving the lid
    up and down during opening. Try to line it up similar to what you see in the image.
    Since we moved our 3D cursor to the center of the Artifact, all of our bones should
    be perfectly centered. This will be important when we animate:


    ![Rigging and using keyframes](OEBPS/Images/B05189_08_13.jpg)


    These three bones will control the pistons


    6. Time to add three bones to control the piston parts. Just as we did to create
    the last bone, create a bone to control each layer of the piston. Remember to
    size them similar to the pieces they control, and line them up as shown in the
    screenshots:


    ![Rigging and using keyframes](OEBPS/Images/B05189_08_14.jpg)


    Add the bone that controls the gear


    7. One last bone! Create a small bone to control the gear. Once it has been created,
    move it into position and then rotate it 90 degrees so that it is lying flat.
    This bone will spin to create the rotating effect for the gear.


    ## Parenting Bones to Mesh


    With all the bones created, we now have to connect them to each section of the
    Artifact, so that moving the bones will move the pieces they are tied to. In Blender,
    this process is called `Parenting`. We will also be checking out a new mode that
    is exclusive to using Armatures: the `Pose Mode`!


    ## Pose Mode


    To get to `Pose Mode`, select your Armature and head down to your modes dropdown:


    ![Rigging and using keyframes](OEBPS/Images/B05189_08_15.jpg)


    Enter Pose mode by selecting a bone and selecting Pose Mode from the Mode dropdown


    From there, select `Pose Mode`. In this mode, we can parent parts of our 3D model
    to our new bones, and then keyframe them to create our animation of the Artifact
    opening:


    ![Rigging and using keyframes](OEBPS/Images/B05189_08_16.jpg)


    Press `Ctrl` + `P` to open the Set Parenting To menu and then choose Bone. This
    will bind the bottom section to its appropriate bone


    Blender makes the `Parenting` process quick and easy:


    1. Select the piece we would like to parent. Let''s start with the bottom section.


    2. Holding the `Shift` key, select the bone you would like to parent to the bottom
    of the Artifact. In this case, this is the first bone we created.


    3. Press `Ctrl` + `P`; this will open the `Set Parenting To` menu. Select the
    `Bone` option.


    4. Lastly, test that the bone is now connected to the bottom piece by selecting
    the bone and sliding it in any direction. The bottom of the Artifact should slide
    with it. Press `Ctrl` + `Z` to return it to its original position.


    For each bone, repeat the process to parent them to their respective pieces. Once
    we have completed the `Parenting` process, we are ready to animate!


    # Animating the Artifact


    Time to bring the Artifact to life! Good animation can breathe character and vitality
    into any object. Many beginning animators start with the `12 Basic Principles
    of Animation` originally written by Disney animators `Ollie Johnston` and `Frank
    Thomas` and I highly recommend checking them out. What we will be looking at for
    the Artifact is basic mechanical animation. Our pistons will move and our gear
    will rotate. However, I would encourage you to read up on the basics and apply
    what you''ve learned later on.


    Just like we did earlier when we practiced with the cube, we are going to create
    some keyframes, but in this case, we will be moving the bones we created and not
    the pieces of the Artifact itself. The result will be a game asset that we can
    trigger to open within Unreal:


    ![Using Blender''s suite of animation tools](OEBPS/Images/B05189_08_17.jpg)


    Manipulate the bones by using the Armature group in the Scene Outliner


    ## Setting Up Keyframes


    Using `Pose` mode, let''s move the Artifact into the closed position:


    1. To make things easier, select your Armature in the `Scene Outliner` and click
    on the little `+` icon. This will list all the current features tied to your Armature.
    Check out the `Pose` option. For each bone that we created, there is a little
    bone icon that we can click to select and deselect specific bones. This will be
    very handy as we move forward.


    2. Using the `Scene Outliner`, select each bone in turn and move them down until
    the Artifact is closed. This is best done from the `Front` view.


    3. With everything closed, it is time to record our first keyframe. With all the
    bones selected, press `I` to open the `Insert Keyframe Menu` and select the `Location`
    option. This will record all of the initial positions of each of the pieces of
    the Artifact in frame 1. In Unreal, this will be used as our reference pose or
    starting pose:


    ![Using Blender''s suite of animation tools](OEBPS/Images/B05189_08_18.jpg)


    Animating the pistons extending


    ## Animating Pistons


    4. Now move the time slider in the `Timeline` at the bottom of the screen to frame
    `10`. Next, deselect the bone that controls the bottom section. Move the other
    bones up until the bottom section of the piston has reached full extension. Press
    `I` and record the new location of the bones:


    ![Using Blender''s suite of animation tools](OEBPS/Images/B05189_08_19.jpg)


    Extend each section of the piston and then create a keyframe


    5. Move the time slider to frame `20` and deselect the bone that controls the
    bottom layer of the piston. Move the remaining bones up until the middle layer
    of the piston is at full extension. Press `I` and record the new location of the
    bones:


    ![Using Blender''s suite of animation tools](OEBPS/Images/B05189_08_20.jpg)


    The pistons at full extension


    6. Last move! Move the time slider to frame `30` and deselect the bone that controls
    the middle layer of the piston. Move the remaining bones up until the top layer
    of the piston is at full extension. Press `I` and record the new location of the
    bones.


    7. Slide the time slider back and forth across our keyframes and watch as the
    Artifact opens and closes. Make some monster noises as you do so.

