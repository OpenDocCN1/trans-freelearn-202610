- raw: "At first glance, the **Insert Keyframe Menu** gives us several options. However,\
    \ upon closer inspection, we can see that all of the options are variations on\
    \ the same three things: **Location**, **Rotation**, and **Scale**. **Location**\
    \ will be the option that we will use the most, to record the locations of our\
    \ various piston pieces as they move the lid of the Artifact. We will also use\
    \ **Rotation** to rotate our gear as part of the locking mechanism.\n\nThere is\
    \ one more technique we can use during our animation that can make our lives a\
    \ lot easier. A Dummy object, or what Blender calls an **Empty**, is a simple\
    \ object that is not counted as part of the scene when we export, but can be a\
    \ huge help when animating. Think of them like the strings on a puppet. Nobody\
    \ is going to see them, but they will make controlling our animation much easier.\n\
    \nLet's look at the **Empty** menu:\n\n![How does Blender handle animation?](OEBPS/Images/B05189_08_02.jpg)\n\
    \nAn Empty can be used to make animation easier\n\nEmpty objects come in a variety\
    \ of shapes, from the simple axis shown in the previous picture, to arrows, spheres,\
    \ and even cones. Objects in the scene we wish to animate can be linked to these\
    \ objects so that we only have to move the Empty, essentially creating a handle.\
    \ They can also be used as a target for an animation constraint.\n\n# Rigging\
    \ and using keyframes\n\nNow that we have a good idea what tools we will need,\
    \ let's talk about creating keyframes!\n\n![Rigging and using keyframes](OEBPS/Images/B05189_08_03.jpg)\n\
    \nThe Timeline is used to add keyframes in a similar fashion to Timelines in Unreal\
    \ 4\n\nSimilar to Unreal 4, the keyframes we create will be displayed in the **Timeline**.\
    \ This area is located directly under the 3D viewport. Keyframes are represented\
    \ as simple yellow lines, and the amount of time we are viewing can be adjusted\
    \ by using the mouse wheel.\n\nNow let's start with a basic cube and create some\
    \ keyframes:\n\n![Rigging and using keyframes](OEBPS/Images/B05189_08_04.jpg)\n\
    \nA simple animation of a sliding box\n\nTo make a simple animation where our\
    \ cube moves, we need to create two keyframes:\n\n1.  Create the first keyframe\
    \ by selecting the cube, pressing *I* to open the **Insert Keyframe Menu**, and\
    \ selecting **Location** at the top of the list.\n\n2.  Now slide the time slider\
    \ in the **Timeline** window to frame `30`. This can be done by right clicking\
    \ on the **Timeline** near 30 and then holding the button to slide it along the\
    \ **Timeline**. The box highlighted in the image shows the active frame.\n\n3.\
    \  Next, in the 3D viewport, slide your cube in any direction you like. Finally,\
    \ press *I* and select **Location** from the menu, just like we did for the first\
    \ keyframe.\n\n4.  Test your animation by clicking and holding the right mouse\
    \ button on the **Timeline** and sliding the active frame between `1` and `30`.\
    \ We should see the cube slide between our two recorded positions.\n\nCongratulations,\
    \ we just animated our cube! Now let's take a look at how to change or delete\
    \ any keyframes that might have been off a bit:\n\n![Rigging and using keyframes](OEBPS/Images/B05189_08_05.jpg)\n\
    \nIntroducing the Dope Sheet\n\nSometimes when we are creating our keyframes,\
    \ we might put one down where we didn't mean to, or we might need to adjust the\
    \ timing of our animation to feel more natural. The  **Dope Sheet** (highlighted\
    \ in the previous screenshot) allows us to move, copy, and delete our keyframes\
    \ with relatively simple controls.\n\nTo move keyframes, select the keyframes\
    \ you wish to move. Then click and drag the keyframes to their new time position.\
    \ Finally, click on the *LMB* again to finalize the new time position.\n\nHere\
    \ we can see the **Dope Sheet** in action:\n\n![Rigging and using keyframes](OEBPS/Images/B05189_08_06.jpg)\n\
    \nDuplicating keyframes is useful when an animation has to end in the exact place\
    \ it began\n\nTo copy a keyframe, select the keyframe you wish to copy and press\
    \ *Ctrl* + *C*. Now right-click and drag the time slider to the new desired time.\
    \ Finally, press *Ctrl* + *V* to copy the keyframes. This is a great technique\
    \ for creating spinning or other cyclical animations where the object has to end\
    \ exactly where it began.\n\nTime to apply what we know to our Artifact.\n\nTo\
    \ animate our piece, we will need to break it down into a few different pieces.\
    \ Basically, if it moves, it has to be its own separate piece. Now you might be\
    \ saying to yourself, *Wait. Then why did we make it all one piece earlier?* For\
    \ the purposes of UV unwrapping, we had to have the Artifact as one piece. As\
    \ we separate pieces from the whole, they are still part of the UV map that we\
    \ made. When we bring the whole thing into Unreal, the material we create will\
    \ still apply all those great textures to every piece of the Artifact.\n\nLet's\
    \ start by separating the top section:\n\n![Rigging and using keyframes](OEBPS/Images/B05189_08_07.jpg)\n\
    \nSelect the top section and top piston section\n\nThis first piece will contain\
    \ the lid and the tops of the pistons:\n\n1.  Select a face on the outside of\
    \ the lid and press *L*; this should select all the faces that make up the outside\
    \ of the lid.\n\n2.  Next, select a face on the inside of the lid while holding\
    \ the *Shift* key. This will add the face to our current selection set. Press\
    \ *L* to select all the faces on the inside of the lid.\n\n3.  Now select the\
    \ very top face.\n\n    Now we will add the pistons to the selection:\n\n    ![Rigging\
    \ and using keyframes](OEBPS/Images/B05189_08_08.jpg)\n\n    A breakdown of a\
    \ piston. This will be needed to bind the right parts to the right bones\n\n4.\
    \  Finally, holding *Shift*, select a polygon on one of the piston's top sections\
    \ and press *L*. Each piston top is made up of three different sections: the top\
    \ portion, the middle portion, and the bottom inner portion. Make sure to *Shift*\
    \ select a face in each section and press *L* to select all the faces in that\
    \ section.\n\n5.  Press *P* to open up the **Separation** menu and select **Selection**.\
    \ This will separate off the faces we selected to become a new piece. Remember\
    \ to rename it in the **Scene Outliner** to something you will remember, such\
    \ as `Top`.\n\nNow we have our top section separated. Repeat the process for the\
    \ bottom and the gear. If you select a face, press *L*, and nothing happens, just\
    \ select the face next to it and try again. Also, pressing *Z* will turn on wireframe\
    \ mode. This will allow you to select faces through your object. Be sure to select\
    \ those faces by clicking on the little black dot located at the center of the\
    \ face.\n\nTime to tackle those middle piston parts! Our plan of attack will have\
    \ us separate them into three layers, since we will be moving all of them together\
    \ for the animation. The bottom set of bits will be one layer, the middle set\
    \ will be another, and so on:\n\n![Rigging and using keyframes](OEBPS/Images/B05189_08_09.jpg)\n\
    \nIt is necessary to break the piston into parts for animation\n\n### Tip\n\n\
    Remember that you can use *Shift* + *H* in **Object** mode to hide everything\
    \ that isn't what you have selected!\n\nHere is how we do it:\n\n1.  Select your\
    \ piston parts and use *Shift* + *H* to hide the rest of the Artifact.\n\n2. \
    \ Head to **Edit** mode and select the bottom portion of each piston set, just\
    \ like in the previous screenshot.\n\n3.  Press *P* and choose **Selection** from\
    \ the menu. Rename the layer `Pistons.Bottom` in the **Scene Outliner**.\n\n4.\
    \  Hide them by clicking on the eye next to their name in the **Scene Outliner**.\
    \ This will make the rest of the process much easier.\n\n5.  Repeat this process\
    \ for the middle layer. This will leave the top layer separated for you.\n\nIf\
    \ everything went well, your **Scene Outliner** should look something like this:\n\
    \n![Rigging and using keyframes](OEBPS/Images/B05189_08_10.jpg)\n\nAll of the\
    \ different sections of the Artifact that we will use for animation"
