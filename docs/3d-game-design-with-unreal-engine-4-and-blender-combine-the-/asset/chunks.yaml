- raw: "At this point, I'm sure you are just dying to drop into the level and run\
    \ around inside your new room. However, to test our level, we need to add a couple\
    \ of things: lights and a player start. For testing purposes, let's drop in a\
    \ couple of **PointLights**. Head over to the **Modes** panel on the left-hand\
    \ side of the screen and drag two **PointLights** into your room. Again, use the\
    \ 4-viewport configuration to make sure they are where you want them to be. Secondly,\
    \ from the same panel, drag in a **PlayerStart**. The **PlayerStart** has an arrow\
    \ sticking out from its center. That is what direction the player will be facing\
    \ when they spawn. Always try to point your **PlayerStart** in the direction you\
    \ want the player to go first. This ensures that the player is engaged from the\
    \ start and can enjoy your creation with the minimum of confusion. Lastly, we\
    \ need to save the file (using the **File** menu or *Ctrl* + *S*) and build the\
    \ level using the **Build** button.\n\n### Tip\n\nThe **Build** button bakes your\
    \ lighting and finalizes all your level changes. This will give you the best idea\
    \ of what your lighting looks like and is an essential part of testing game AI\
    \ and other features. It's a good habit to build your level before testing.\n\n\
    Testing your level while it's being constructed is an important part of the design\
    \ process. Through testing, you can discover if your level has any flaws or issues\
    \ and fix them before things get too complicated. To test your level, press the\
    \ **Play** button. This will start a play session in the current viewport and\
    \ allow you to run around inside your level. If you click the little down arrow\
    \ next to the **Play** button, you will be given the option to open other types\
    \ of play windows, such as the **New Editor Window**. It can be helpful to be\
    \ able to see the whole play screen. Now test your level and make sure everything\
    \ is lined up properly. Once you feel good about your first room, let's build\
    \ the rest of the design:\n\n![Using the Content Browser to start building the\
    \ level](OEBPS/Images/BO5189_02_05.jpg)\n\nIt is a good habit to add as much detail\
    \ as you can to your whitebox level so you have a good idea of what your design\
    \ will look like\n\nNow let's build the hallway. We can easily build out our hallway\
    \ by copying existing pieces in our level. I will also show you how to swap pieces\
    \ in the level without deleting them:\n\n1.  Select one of the floor pieces in\
    \ your first room. Duplicate it and line it up with where you would like to place\
    \ the doorway into the hallway space.\n\n2.  Go into the **Content Browser** and\
    \ select **Wall\\_Door\\_400x300**. We are going to replace one of the wall sections\
    \ with this piece. Now select the wall piece that you would like to replace in\
    \ the viewport. Right-click on it and select **Replace Selected Actors with Wall\\\
    _Door\\_400x300** from the menu:\n\n    ![Using the Content Browser to start building\
    \ the level](OEBPS/Images/BO5189_02_06.jpg)\n\n    Replacing our wall static mesh\
    \ with a wall that contains a door\n\n    This will swap the existing static mesh\
    \ with the one we selected and add in that perfect-sized doorway.\n\n3.  Copy\
    \ the floor section twice more to lengthen the hallway. Don't forget to make sure\
    \ all the pieces line up properly with your existing floor.\n\n4.  Copy a wall\
    \ section and add it to your hallway. Copy that a few more times to enclose the\
    \ length of your hallway.\n\n5.  Finally, copy the floor to create the ceiling\
    \ and enclose your hallway, and add a light inside it. \n\n    ### Tip\n\n   \
    \ Remember that lights can be copied just like any other object. Another fast\
    \ way to add a **PointLight** to your level is to hold the *L* key, then click\
    \ where you would like the light to go.\n\nBuild your level and give it a test.\
    \ If the hallway does not feel long enough, add a couple more sections. Once you\
    \ are happy with the feel of your level so far, save your file. Now let's add\
    \ the final room:\n\n![Using the Content Browser to start building the level](OEBPS/Images/BO5189_02_07.jpg)\n\
    \nWorking on the cargo bay\n\nFor this room, we will add some vertical elements\
    \ to the design. We will also build both stairs and an elevator to access the\
    \ walkways above, so let's begin:\n\n1.  As we have done for previous additions,\
    \ let's copy a floor piece from the hallway and line it up with the doorway. This\
    \ will be the start of our new room. This room will be larger than the last room,\
    \ so let's copy our new floor section twice in each direction, creating a row\
    \ of five floor pieces.\n\n2.  Now let's select all the floor pieces in that row\
    \ by holding *Ctrl* and clicking on each piece. Copy this row four times to create\
    \ our large room: ![Using the Content Browser to start building the level](OEBPS/Images/BO5189_02_08.jpg)\n\
    \n    Creating the second story by duplicating the walls\n\n3.  Copy a wall section\
    \ from the hallway into our room and use it to enclose the whole space, as we\
    \ did in the hallway. Now select all of those wall pieces and copy them. Set those\
    \ pieces on top of the originals to create a second floor: ![Using the Content\
    \ Browser to start building the level](OEBPS/Images/BO5189_02_09.jpg)\n\n    Duplicating\
    \ the first floor section for the catwalk\n\n4.  Now let's create the catwalk\
    \ for the second floor. Copy a floor piece toward the back of the room. Align\
    \ it with the top of the wall.\n\n5.  Over in the **Details** panel, go over to\
    \ **Scale** and type in `0.7` in the green box. This will scale our floor piece\
    \ in the **Y** axis and decrease how wide our catwalk is: ![Using the Content\
    \ Browser to start building the level](OEBPS/Images/BO5189_02_10.jpg)\n\n    Using\
    \ the top view to duplicate our catwalk floor sections\n\n6.  Copy our walkway\
    \ piece around the outside of the room to create a U-shaped section. This will\
    \ leave space for our stairs and elevator: ![Using the Content Browser to start\
    \ building the level](OEBPS/Images/BO5189_02_11.jpg)\n\n    Creating the spiral\
    \ staircase to give the player access to the second floor\n\n7.  Time for the\
    \ stairs! Add in a **Curved Staircase** from the **BSP** menu in the Modes panel.\
    \ Align it with our corner so that it will connect with our walkway. However,\
    \ the default stairs aren't high enough. We can fix this by adding stairs in the\
    \ **Details** panel and messing with the **Num Steps** option. We can adjust the\
    \ size of our stairway by adjusting the **Step Width** option. The settings that\
    \ worked for me were **Num Steps**: `15` and **Step Width**: `275`.\n\n8.  Our\
    \ last feature will be adding in the pieces we will need for our elevator:\n\n\
    \    ![Using the Content Browser to start building the level](OEBPS/Images/BO5189_02_12.jpg)\n\
    \n    Starting to lay out our elevator components\n\n    For the elevator, I copied\
    \ a floor piece and moved it to line up with my walkway above. I moved it up and\
    \ down a few times to ensure it fit, before leaving it sitting on the floor in\
    \ its down position. We will animate this piece to make the elevator work later\
    \ in the chapter.\n\n9.  Grab a **Pillar\\_50x500** piece from the **Architecture**\
    \ folder and arrange them around our elevator, and we are done. \n\n    ### Tip\n\
    \n    Have you been working on this level on and off, and would like this level\
    \ to open by default instead of the example? Go to the **Edit** menu and select\
    \ **Project Settings**. Select **Maps & Modes** and change the **Game Default\
    \ Map** and **Editor Starter Map** to your level file."
  fmt: "\n# Level Construction Walkthrough\n\n## Adding Lights and Player Start\n\n\
    At this point, I'm sure you are just dying to drop into the level and run around\
    \ inside your new room. However, to test our level, we need to add a couple of\
    \ things: lights and a player start. For testing purposes, let's drop in a couple\
    \ of `PointLights`. Head over to the `Modes` panel on the left-hand side of the\
    \ screen and drag two `PointLights` into your room. Again, use the 4-viewport\
    \ configuration to make sure they are where you want them to be. Secondly, from\
    \ the same panel, drag in a `PlayerStart`. The `PlayerStart` has an arrow sticking\
    \ out from its center. That is what direction the player will be facing when they\
    \ spawn. Always try to point your `PlayerStart` in the direction you want the\
    \ player to go first. This ensures that the player is engaged from the start and\
    \ can enjoy your creation with the minimum of confusion. Lastly, we need to save\
    \ the file (using the `File` menu or `Ctrl` + `S`) and build the level using the\
    \ `Build` button.\n\n### Tip: Build Button\n\nThe `Build` button bakes your lighting\
    \ and finalizes all your level changes. This will give you the best idea of what\
    \ your lighting looks like and is an essential part of testing game AI and other\
    \ features. It's a good habit to build your level before testing.\n\n## Testing\
    \ Your Level\n\nTesting your level while it's being constructed is an important\
    \ part of the design process. Through testing, you can discover if your level\
    \ has any flaws or issues and fix them before things get too complicated. To test\
    \ your level, press the `Play` button. This will start a play session in the current\
    \ viewport and allow you to run around inside your level. If you click the little\
    \ down arrow next to the `Play` button, you will be given the option to open other\
    \ types of play windows, such as the `New Editor Window`. It can be helpful to\
    \ be able to see the whole play screen. Now test your level and make sure everything\
    \ is lined up properly. Once you feel good about your first room, let's build\
    \ the rest of the design:\n\n![Using the Content Browser to start building the\
    \ level](OEBPS/Images/BO5189_02_05.jpg)\n\nIt is a good habit to add as much detail\
    \ as you can to your whitebox level so you have a good idea of what your design\
    \ will look like.\n\n## Building the Hallway\n\nNow let's build the hallway. We\
    \ can easily build out our hallway by copying existing pieces in our level. I\
    \ will also show you how to swap pieces in the level without deleting them:\n\n\
    1. Select one of the floor pieces in your first room. Duplicate it and line it\
    \ up with where you would like to place the doorway into the hallway space.\n\n\
    2. Go into the `Content Browser` and select `Wall_Door_400x300`. We are going\
    \ to replace one of the wall sections with this piece. Now select the wall piece\
    \ that you would like to replace in the viewport. Right-click on it and select\
    \ `Replace Selected Actors with Wall_Door_400x300` from the menu:\n\n    ![Using\
    \ the Content Browser to start building the level](OEBPS/Images/BO5189_02_06.jpg)\n\
    \n    Replacing our wall static mesh with a wall that contains a door\n\n    This\
    \ will swap the existing static mesh with the one we selected and add in that\
    \ perfect-sized doorway.\n\n3. Copy the floor section twice more to lengthen the\
    \ hallway. Don't forget to make sure all the pieces line up properly with your\
    \ existing floor.\n\n4. Copy a wall section and add it to your hallway. Copy that\
    \ a few more times to enclose the length of your hallway.\n\n5. Finally, copy\
    \ the floor to create the ceiling and enclose your hallway, and add a light inside\
    \ it.\n\n### Tip: Adding Lights Quickly\n\nRemember that lights can be copied\
    \ just like any other object. Another fast way to add a `PointLight` to your level\
    \ is to hold the `L` key, then click where you would like the light to go.\n\n\
    Build your level and give it a test. If the hallway does not feel long enough,\
    \ add a couple more sections. Once you are happy with the feel of your level so\
    \ far, save your file. Now let's add the final room:\n\n![Using the Content Browser\
    \ to start building the level](OEBPS/Images/BO5189_02_07.jpg)\n\n## Building the\
    \ Cargo Bay\n\nWorking on the cargo bay\n\nFor this room, we will add some vertical\
    \ elements to the design. We will also build both stairs and an elevator to access\
    \ the walkways above, so let's begin:\n\n1. As we have done for previous additions,\
    \ let's copy a floor piece from the hallway and line it up with the doorway. This\
    \ will be the start of our new room. This room will be larger than the last room,\
    \ so let's copy our new floor section twice in each direction, creating a row\
    \ of five floor pieces.\n\n2. Now let's select all the floor pieces in that row\
    \ by holding `Ctrl` and clicking on each piece. Copy this row four times to create\
    \ our large room: ![Using the Content Browser to start building the level](OEBPS/Images/BO5189_02_08.jpg)\n\
    \n    Creating the second story by duplicating the walls\n\n3. Copy a wall section\
    \ from the hallway into our room and use it to enclose the whole space, as we\
    \ did in the hallway. Now select all of those wall pieces and copy them. Set those\
    \ pieces on top of the originals to create a second floor: ![Using the Content\
    \ Browser to start building the level](OEBPS/Images/BO5189_02_09.jpg)\n\n    Duplicating\
    \ the first floor section for the catwalk\n\n4. Now let's create the catwalk for\
    \ the second floor. Copy a floor piece toward the back of the room. Align it with\
    \ the top of the wall.\n\n5. Over in the `Details` panel, go over to `Scale` and\
    \ type in `0.7` in the green box. This will scale our floor piece in the `Y` axis\
    \ and decrease how wide our catwalk is: ![Using the Content Browser to start building\
    \ the level](OEBPS/Images/BO5189_02_10.jpg)\n\n    Using the top view to duplicate\
    \ our catwalk floor sections\n\n6. Copy our walkway piece around the outside of\
    \ the room to create a U-shaped section. This will leave space for our stairs\
    \ and elevator: ![Using the Content Browser to start building the level](OEBPS/Images/BO5189_02_11.jpg)\n\
    \n    Creating the spiral staircase to give the player access to the second floor\n\
    \n7. Time for the stairs! Add in a `Curved Staircase` from the `BSP` menu in the\
    \ Modes panel. Align it with our corner so that it will connect with our walkway.\
    \ However, the default stairs aren't high enough. We can fix this by adding stairs\
    \ in the `Details` panel and messing with the `Num Steps` option. We can adjust\
    \ the size of our stairway by adjusting the `Step Width` option. The settings\
    \ that worked for me were `Num Steps`: `15` and `Step Width`: `275`.\n\n8. Our\
    \ last feature will be adding in the pieces we will need for our elevator:\n\n\
    \    ![Using the Content Browser to start building the level](OEBPS/Images/BO5189_02_12.jpg)\n\
    \n    Starting to lay out our elevator components\n\n    For the elevator, I copied\
    \ a floor piece and moved it to line up with my walkway above. I moved it up and\
    \ down a few times to ensure it fit, before leaving it sitting on the floor in\
    \ its down position. We will animate this piece to make the elevator work later\
    \ in the chapter.\n\n9. Grab a `Pillar_50x500` piece from the `Architecture` folder\
    \ and arrange them around our elevator, and we are done.\n\n### Tip: Setting Default\
    \ Maps\n\nHave you been working on this level on and off, and would like this\
    \ level to open by default instead of the example? Go to the `Edit` menu and select\
    \ `Project Settings`. Select `Maps & Modes` and change the `Game Default Map`\
    \ and `Editor Starter Map` to your level file.\n"
  trans: "\n# 关卡构建演练\n\n## 添加灯光和玩家起始点\n\n此时，你肯定迫不及待想进入关卡，在新房间里跑一圈。然而，要测试我们的关卡，我们需要添加几样东西：灯光和玩家起始点。为了测试目的，让我们放入几个\
    \ `PointLights`。前往屏幕左侧的 `Modes`（模式）面板，将两个 `PointLights` 拖入你的房间。同样，使用四视口配置确保它们位于你想要的位置。其次，从同一面板拖入一个\
    \ `PlayerStart`。`PlayerStart` 从其中心伸出一支箭头。那指示了玩家生成时面朝的方向。始终尝试将 `PlayerStart` 指向你希望玩家最初前进的方向。这能确保玩家从一开始就投入游戏，并能以最小的困惑享受你的创作。最后，我们需要保存文件（使用\
    \ `File` 菜单或 `Ctrl` + `S`），并使用 `Build`（构建）按钮构建关卡。\n\n### 提示：构建按钮\n\n`Build` 按钮会烘焙灯光并最终确定所有关卡更改。这能让你最直观地了解灯光效果，也是测试游戏\
    \ AI 和其他功能的重要环节。在测试前构建关卡是个好习惯。\n\n## 测试关卡\n\n在构建过程中测试关卡是设计流程的重要组成部分。通过测试，你可以发现关卡是否存在缺陷或问题，并在情况变得过于复杂之前修复它们。要测试关卡，请按\
    \ `Play`（播放）按钮。这将在当前视口启动一个游戏会话，让你在关卡内跑动。如果你点击 `Play` 按钮旁边的小下拉箭头，将会看到打开其他类型游戏窗口的选项，例如\
    \ `New Editor Window`（新编辑器窗口）。能看到完整的游戏画面会很有帮助。现在测试关卡，确保所有东西都正确对齐。一旦你对第一个房间感到满意，让我们构建其余的设计：\n\
    \n![Using the Content Browser to start building the level](img/BO5189_02_05.jpg)\n\
    \n向灰盒关卡添加尽可能多的细节是个好习惯，这样你就能对最终设计的样子有个好印象。\n\n## 构建走廊\n\n现在让我们构建走廊。我们可以通过复制关卡中的现有部件轻松构建走廊。我还将展示如何在不删除的情况下替换关卡中的部件：\n\
    \n1. 选择第一个房间中的一个地板部件。复制它，并将其对齐到你想要放置通往走廊空间的门口的位置。\n\n2. 进入 `Content Browser`（内容浏览器）并选择\
    \ `Wall_Door_400x300`。我们将用这个部件替换其中一个墙壁部分。现在在视口中选择你想要替换的墙壁部件。右键点击它，从菜单中选择 `Replace\
    \ Selected Actors with Wall_Door_400x300`（用 Wall_Door_400x300 替换选中的 Actor）：\n\n\
    \    ![Using the Content Browser to start building the level](img/BO5189_02_06.jpg)\n\
    \n    用包含门的墙替换我们的墙壁静态网格体\n\n    这将把现有的静态网格体替换为我们选中的那个，并加入一个尺寸完美的门口。\n\n3. 再复制两次地板部分以延长走廊。别忘了确保所有部件都与现有地板正确对齐。\n\
    \n4. 复制一个墙壁部分并添加到走廊。再复制几次以封闭走廊的长度。\n\n5. 最后，复制地板以创建天花板并封闭走廊，并在里面添加一盏灯。\n\n###\
    \ 提示：快速添加灯光\n\n请记住，灯光可以像其他对象一样被复制。另一种快速添加 `PointLight` 的方法是按住 `L` 键，然后点击你想放置灯光的位置。\n\
    \n构建关卡并测试一下。如果走廊感觉不够长，再添加几个部分。一旦你对目前的关卡手感满意，保存文件。现在让我们添加最后一个房间：\n\n![Using the\
    \ Content Browser to start building the level](img/BO5189_02_07.jpg)\n\n## 构建货舱\n\
    \n正在构建货舱\n\n对于这个房间，我们将向设计中添加一些垂直元素。我们还将构建楼梯和电梯以到达上方的走道，开始吧：\n\n1. 就像之前的添加一样，让我们从走廊复制一个地板部件并将其与门口对齐。这将是新房间的起点。这个房间将比上一个大，所以让我们在每个方向上各复制两次新地板部分，形成一排五个地板部件。\n\
    \n2. 现在按住 `Ctrl` 并点击每个部件，选择那一排的所有地板部件。复制这一行四次以创建我们的大房间：\n\n![Using the Content\
    \ Browser to start building the level](img/BO5189_02_08.jpg)\n\n通过复制墙壁创建二层\n\n\
    3. 从走廊复制一个墙壁部分到我们的房间，并用它封闭整个空间，就像我们在走廊里做的那样。现在选择所有那些墙壁部件并复制它们。将这些部件放在原件顶部以创建二层：\n\
    \n![Using the Content Browser to start building the level](img/BO5189_02_09.jpg)\n\
    \n复制一楼部分用于天桥\n\n4. 现在让我们为二楼创建天桥。向房间后方复制一个地板部件。将其与墙顶对齐。\n\n5. 在 `Details`（细节）面板中，找到\
    \ `Scale`（缩放），在绿色框中输入 `0.7`。这将沿 `Y` 轴缩放地板部件，减小天桥的宽度：\n\n![Using the Content Browser\
    \ to start building the level](img/BO5189_02_10.jpg)\n\n使用俯视图复制天桥地板部分\n\n6. 沿着房间外侧复制走道部件，创建一个\
    \ U 形区域。这将为楼梯和电梯留出空间：\n\n![Using the Content Browser to start building the level](img/BO5189_02_11.jpg)\n\
    \n创建螺旋楼梯以便玩家进入二楼\n\n7. 该做楼梯了！从模式面板的 `BSP` 菜单中添加一个 `Curved Staircase`（弧形楼梯）。将其与我们的角落对齐，以便连接走道。然而，默认楼梯高度不够。我们可以在\
    \ `Details` 面板中调整楼梯，通过修改 `Num Steps`（阶梯数量）选项来修复。我们可以通过调整 `Step Width`（阶梯宽度）选项来调整楼梯尺寸。适合我的设置是\
    \ `Num Steps`：`15` 和 `Step Width`：`275`。\n\n8. 我们的最后一个功能是添加电梯所需的部件：\n\n![Using\
    \ the Content Browser to start building the level](img/BO5189_02_12.jpg)\n\n开始布局电梯组件\n\
    \n对于电梯，我复制了一个地板部件并将其移动到与上方走道对齐的位置。我上下移动几次以确保它合适，然后将其放在下降位置的地板上。我们将在本章后面为这个部件制作动画，使电梯运作。\n\
    \n9. 从 `Architecture`（建筑）文件夹获取一个 `Pillar_50x500` 部件并将它们围绕电梯排列，完成。\n\n### 提示：设置默认地图\n\
    \n你是否断断续续地在这个关卡上工作，并希望默认打开这个关卡而不是示例？前往 `Edit`（编辑）菜单并选择 `Project Settings`（项目设置）。选择\
    \ `Maps & Modes`（地图与模式），将 `Game Default Map`（游戏默认地图）和 `Editor Starter Map`（编辑器启动地图）更改为你的关卡文件。\n"
