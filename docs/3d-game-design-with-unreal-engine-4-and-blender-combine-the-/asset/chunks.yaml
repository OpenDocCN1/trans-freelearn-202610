    \ be to add those additional elements to our level. Each entrance to the security\
    \ checkpoint hallway needs a door, each window needs a shutter, and so on.\n\n\
    Let's build the doors first:\n\n![Advanced scripting techniques](OEBPS/Images/BO5189_05_08.jpg)\n\
    \nBuilding the first security door\n\n1.  For the three security doors that slam\
    \ down, I grabbed a **Wall\\_400x200** piece from the **Architecture** folder\
    \ and adjusted the **Scale** of the **X** to `0.4` and the **Z** to `1.1`. I then\
    \ changed the name for each to `Sec_Door1`, `Sec_Door2`, and `Sec_Door3`. Remember\
    \ to also set the **Mobility** property to `Movable`.\n\n2.  I positioned each\
    \ door above each door frame so that it can slam down during the event: ![Advanced\
    \ scripting techniques](OEBPS/Images/BO5189_05_09.jpg)\n\n    Building the security\
    \ shutters\n\n3.  For the two security window shutters, I used a **Wall\\_400x400**\
    \ piece and adjusted the Scale property of the x to `1.5` and the z to `0.5`.\
    \ I changed their names to `Sec_Win_Shutter1` and `Sec_Win_Shutter2` to make them\
    \ easy to identify and set their **Mobility** to **Movable**.\n\nTime to add a\
    \ few more details to really make this area perfect:\n\n![Advanced scripting techniques](OEBPS/Images/BO5189_05_10.jpg)\n\
    \nPlacing the particle emitters\n\n1.  Particle emitters are points in space that\
    \ emit light, sparks, or even static meshes if we want them to. They are created\
    \ using Unreal's Cascade Particle Editor, though the **Starter Content** folder\
    \ has some great ones we can use in the **Particles** sub-folder. Here I used\
    \ a **P\\_Smoke** emitter at each door and one **P\\_Sparks** emitter near the\
    \ window on the left. For all of them, I turned off the **Auto Activate** option\
    \ in the **Details** panel to give us control of when they fire.\n\n    A trap\
    \ like this is great, but we still need some way for the player to escape:\n\n\
    \    ![Advanced scripting techniques](OEBPS/Images/BO5189_05_11.jpg)\n\n    A\
