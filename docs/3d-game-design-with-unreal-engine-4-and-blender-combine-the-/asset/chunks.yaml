  fmt: "\n# Finalizing the Artifact Explosion\n\n## Explosion Sequence Setup\n\n![Using\
    \ particle effects](OEBPS/Images/B05189_09_20.jpg)\n\nDon't forget to tell the\
    \ `Spawn Actor From Class` nodes to use our Top and Bottom chunk class `Blueprint`s.\n\
    \nPlace the `Spawn Actor From Class` node next to the `Destroy Component` node\
    \ and link them. The first thing we need to tell it is what class to spawn. Click\
    \ the drop-down box and select the bottom `Artifact` chunk. The second thing it\
    \ needs to know is where to spawn. This can be done by plugging a `Get Actor Transform`\
    \ node (found using the search box in the `Palette`) into the `Spawn Transform`\
    \ option. Now we are set to spawn! Repeat this step to set up a `Spawn Actor From\
    \ Class` node for the top `Artifact` chunk.\n\nNow fire that `Radial Impulse`\
    \ and make this a true explosion!\n\n![Using particle effects](OEBPS/Images/B05189_09_21.jpg)\n\
    \nUse these settings for the `Fire Impulse` node.\n\nThe node we need to use is\
    \ `Fire Impulse`. The only thing this node needs is a `Target`. Grab our `Radial\
    \ Impulse` component from the `Components` panel and plug it in.\n\nTo wrap things\
    \ up we just need to do a little bit of housekeeping. At the end of this sequence,\
    \ add a `Delay` and a `Destroy Actor` node. The `Delay` will be set to `4.0` seconds\
    \ to give our sounds time to play, and the `Destroy Actor` will have `Self` as\
    \ a `Target`. This will remove all of the class `Blueprint` from the level. However,\
    \ it will leave the exploded chunks behind. Even though we used a class `Blueprint`\
    \ to spawn them, they are separate Actors and will not be deleted when the rest\
    \ of the class `Blueprint` deletes itself.\n\nMake sure the sequence is connected\
    \ up in order and test it. You should have a satisfying explosion that throws\
    \ pieces of the `Artifact` around. If the player is too close, it will even throw\
    \ them backward!\n\nExplosions are so much fun to make and can be a great way\
    \ to add a bit of action to any experience, but if you had fun building this sequence,\
    \ you don't need to stop here. Try adding more explosion particle effects, or\
    \ adding the tentacles as chunks for added effect.\n\n![Using particle effects](OEBPS/Images/B05189_09_22.jpg)\n\
    \nThe final result! I hope you all had as much fun as I did!\n\nHow oddly satisfying\
    \ was that?! There is just something about building something amazing for a video\
    \ game and then allowing our player to blow it up. With our game asset now properly\
    \ set up, we can place it in our space station level and use it as a goal to drive\
    \ our gameplay forward. In this chapter, we went through the process of bringing\
    \ our fully textured and animated `Artifact` in to `Unreal` and setting it up\
    \ to look great in the level. We used a class `Blueprint` setup to assemble the\
    \ pieces and created a way for the player to interact with it, causing it open.\
    \ We then added some additional components and programming that allowed the player\
    \ to start a countdown and blow up our game asset in a fine display of fire, smoke,\
    \ and flying chunks.\n\nAnd with that, we are done! Congratulations on finishing\
    \ the book! What you have created is a great skeleton of a game that can be expanded\
    \ on to create something amazing and uniquely your own. You have two whitebox\
    \ levels that can be filled with your own custom art created in Blender. You have\
    \ two game assets that can be further customized to fit your game's specific needs.\
    \ I would strongly encourage you to properly finish each of these levels and to\
    \ keep practicing and polishing your skills. Become the game designer or game\
    \ artist that you want to be and I truly look forward to playing your unique games\
    \ in the future!\n\nStick with it and game on!\n\n## Index\n\n### A\n- **animation**\n\
    \  - handling: [How does Blender handle animation?](#ch08.xhtml)\n- **animation\
    \ tools**\n  - using: [Using Blender's suite of animation tools](#ch08s03.xhtml)\n\
    - **asset**\n  - designing: [Designing our asset – inspiration and concept art](#ch06.xhtml)\n\
    - **Average Island Scale**: [`Average Island Scale`](#ch07.xhtml)\n\n### B\n-\
    \ **Blender**\n  - installing: [Installing Blender](#ch01.xhtml)\n  - URL: [Installing\
    \ Blender](#ch01.xhtml)\n  - object, exporting from: [Exporting our object from\
    \ Blender](#ch04.xhtml)\n  - multiple shapes, using within: [Using multiple shapes\
    \ within Blender](#ch06s03.xhtml)\n  - animation, handling: [How does Blender\
    \ handle animation?](#ch08.xhtml)\n  - suite of animation tools, using: [Using\
    \ Blender's suite of animation tools](#ch08s03.xhtml)\n- **blocking volumes**:\
    \ [Whiteboxing a level for better asset creation](#ch05s02.xhtml)\n- **Blueprints**\n\
    \  - used, for adding interactive elements: [Adding interactive elements using\
    \ Triggers and Blueprints](#ch02s03.xhtml)\n- **Bridge Edge Loops tool**: [`Bridge\
    \ Edge Loops tool`](#ch06s02.xhtml)\n\n### C\n- **class blueprint**\n  - creating:\
    \ [Creating a class blueprint to tie it all together](#ch09.xhtml)\n  - creating,\
    \ for artifact: [Creating a class blueprint to tie it all together](#ch09.xhtml)\n\
    - **complex objects**\n  - unwrapping: [Unwrapping complex objects](#ch07.xhtml)\n\
    \  - seams, creating: [Marking seams](#ch07.xhtml)\n  - unwrap tool: [`Unwrap\
    \ tool`](#ch07.xhtml)\n  - stitch: [`Stitch`](#ch07.xhtml)\n  - average island\
    \ scale: [`Average Island Scale`](#ch07.xhtml)\n  - pack islands: [`Pack Islands`](#ch07.xhtml)\n\
    \  - Smart UV Project, using: [Using `Smart UV Project`](#ch07s02.xhtml)\n- **Content\
    \ Browser**\n  - used, for start building level: [Using the Content Browser to\
    \ start building the level](#ch02.xhtml)\n- **cubes**\n  - unwrapping: [Unwrapping\
    \ Cubes](#ch07s03.xhtml)\n- **Custom Marking Seams**\n  - about: [Custom Marking\
    \ Seams](#ch07s03.xhtml)\n  - cubes, unwrapping: [Unwrapping Cubes](#ch07s03.xhtml)\n\
    \  - cylinders, unwrapping: [Unwrapping Cylinders](#ch07s03.xhtml)\n- **cylinders**\n\
    \  - unwrapping: [Unwrapping Cylinders](#ch07s03.xhtml)\n\n### D\n- **3D asset**\n\
    \  - setting up: [Setting up and using our new 3D asset](#ch04s04.xhtml)\n  -\
    \ using: [Setting up and using our new 3D asset](#ch04s04.xhtml)\n\n### F\n- **FBX**\n\
    \  - about: [What is `FBX`?](#ch04s02.xhtml)\n\n### G\n- **game asset**\n  - UV\
    \ unwrapping: [UV unwrapping our game asset](#ch03s04.xhtml)\n- **game assets**\n\
    \  - making: [Getting started making game assets](#ch03.xhtml)\n\n### I\n- **interactive\
    \ elements**\n  - adding, Triggers used: [Adding interactive elements using Triggers\
    \ and Blueprints](#ch02s03.xhtml)\n  - adding, Blueprints used: [Adding interactive\
    \ elements using Triggers and Blueprints](#ch02s03.xhtml)\n- **interface**\n \
    \ - exploring: [Exploring the interface](#ch01s02.xhtml)\n\n### K\n- **keyframes**\n\
    \  - using: [Rigging and using keyframes](#ch08s02.xhtml)\n"
  trans: "\n# 完成神器爆炸效果\n\n## 爆炸序列设置\n\n![使用粒子效果](img/B05189_09_20.jpg)\n\n别忘了告诉 `Spawn\
    \ Actor From Class` 节点使用我们的顶部和底部碎片类 `Blueprint`。\n\n将 `Spawn Actor From Class`\
    \ 节点放在 `Destroy Component` 节点旁边并连接它们。我们需要告诉它的第一件事是生成什么类。点击下拉框并选择底部 `Artifact`\
    \ 碎片。它需要知道的第二件事是在哪里生成。这可以通过将一个 `Get Actor Transform` 节点（在 `Palette` 的搜索框中找到）插入\
    \ `Spawn Transform` 选项来完成。现在我们准备好生成了！重复此步骤为顶部 `Artifact` 碎片设置一个 `Spawn Actor From\
    \ Class` 节点。\n\n现在触发那个 `Radial Impulse`，使其成为真正的爆炸！\n\n![使用粒子效果](img/B05189_09_21.jpg)\n\
    \n对 `Fire Impulse` 节点使用这些设置。\n\n我们需要使用的节点是 `Fire Impulse`。该节点唯一需要的是一个 `Target`。从\
    \ `Components` 面板获取我们的 `Radial Impulse` 组件并将其插入。\n\n为了收尾，我们只需要做一些清理工作。在此序列的末尾，添加一个\
    \ `Delay` 和一个 `Destroy Actor` 节点。`Delay` 将设置为 `4.0` 秒，以给声音留出播放时间，`Destroy Actor`\
    \ 将以 `Self` 作为 `Target`。这将从关卡中移除所有类 `Blueprint`。然而，它会留下爆炸的碎片。尽管我们使用类 `Blueprint`\
    \ 生成它们，但它们是独立的 Actor，当类 `Blueprint` 的其余部分自我删除时，它们不会被删除。\n\n确保序列按顺序连接并测试它。你应该会得到一个令人满意的爆炸，将\
    \ `Artifact` 的碎片四处抛散。如果玩家太近，甚至会将他们向后抛出！\n\n制作爆炸非常有趣，并且可以为任何体验增加一些动作感，但如果你享受构建这个序列的过程，不必止步于此。尝试添加更多爆炸粒子效果，或添加触手作为碎片以增加效果。\n\
    \n![使用粒子效果](img/B05189_09_22.jpg)\n\n最终结果！希望你们玩得和我一样开心！\n\n这难道不令人奇妙地满足吗？！为电子游戏构建一些惊人的东西，然后让玩家将其炸毁，这其中总有种独特的感觉。现在我们的游戏资产已正确设置，我们可以将其放入空间站关卡中，并将其作为目标来推动游戏玩法向前发展。在本章中，我们介绍了将我们完全贴图和动画化的\
    \ `Artifact` 引入 `Unreal` 并设置它在关卡中看起来很棒的过程。我们使用类 `Blueprint` 设置来组装零件，并创建了一种让玩家与其交互的方式，使其打开。然后我们添加了一些额外的组件和编程，允许玩家开始倒计时，并在火焰、烟雾和飞散碎片的绚丽表现中炸毁我们的游戏资产。\n\
    \n就这样，我们完成了！恭喜你读完这本书！你创建了一个很棒的游戏框架，可以在此基础上扩展，创造出一些惊人且独一无二的东西。你有两个白盒关卡，可以用在 Blender\
    \ 中创建的自定义艺术填充。你有两个游戏资产，可以进一步定制以适应你游戏的特定需求。我强烈建议你妥善完成这些关卡，并继续练习和打磨你的技能。成为你想成为的游戏设计师或游戏艺术家，我真心期待未来能玩到你独特的游戏！\n\
    \n坚持下去，继续创作游戏吧！\n\n## 索引\n\n### A\n- **动画**\n  - 处理：Blender 如何处理动画？\n- **动画工具**\n\
    \  - 使用：使用 Blender 的动画工具套件\n- **资产**\n  - 设计：设计我们的资产——灵感与概念艺术\n- **Average Island\
    \ Scale**：`Average Island Scale`\n\n### B\n- **Blender**\n  - 安装：安装 Blender\n\
    \  - URL：安装 Blender\n  - 对象，从...导出：从 Blender 导出我们的对象\n  - 多形状，在...中使用：在 Blender\
    \ 中使用多个形状\n  - 动画，处理：Blender 如何处理动画？\n  - 动画工具套件，使用：使用 Blender 的动画工具套件\n- **阻挡体积**：为更好的资产创建进行白盒关卡设计\n\
    - **Blueprints**\n  - 用于添加交互元素：使用触发器和 Blueprints 添加交互元素\n- **Bridge Edge Loops\
    \ 工具**：`Bridge Edge Loops tool`\n\n### C\n- **类 Blueprint**\n  - 创建：创建类 Blueprint\
    \ 将所有内容整合在一起\n  - 创建，用于神器：创建类 Blueprint 将所有内容整合在一起\n- **复杂对象**\n  - 展开：展开复杂对象\n\
    \  - 接缝，创建：标记接缝\n  - 展开工具：`Unwrap tool`\n  - 缝合：`Stitch`\n  - 平均岛屿比例：`Average\
    \ Island Scale`\n  - 打包岛屿：`Pack Islands`\n  - Smart UV Project，使用：使用 `Smart UV\
    \ Project`\n- **内容浏览器**\n  - 用于开始构建关卡：使用内容浏览器开始构建关卡\n- **立方体**\n  - 展开：展开立方体\n\
    - **自定义标记接缝**\n  - 关于：自定义标记接缝\n  - 立方体，展开：展开立方体\n  - 圆柱体，展开：展开圆柱体\n- **圆柱体**\n\
    \  - 展开：展开圆柱体\n\n### D\n- **3D 资产**\n  - 设置：设置和使用我们的新 3D 资产\n  - 使用：设置和使用我们的新\
    \ 3D 资产\n\n### F\n- **FBX**\n  - 关于：什么是 `FBX`？\n\n### G\n- **游戏资产**\n  - UV 展开：UV\
    \ 展开我们的游戏资产\n- **游戏资产**\n  - 制作：开始制作游戏资产\n\n### I\n- **交互元素**\n  - 添加，使用触发器：使用触发器和\
    \ Blueprints 添加交互元素\n  - 添加，使用 Blueprints：使用触发器和 Blueprints 添加交互元素\n- **界面**\n\
    \  - 探索：探索界面\n\n### K\n- **关键帧**\n  - 使用：绑定和使用关键帧\n"
