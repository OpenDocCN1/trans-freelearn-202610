- raw: '*   **Scene Outliner**: This is a convenient list of every object in our scene
    and is handy if you can''t find a specific object visually. Unreal Engine has
    one of these as well.


    A lot of information, huh? Trust me, it gets easier with practice. To make things
    even easier, let''s customize some of our settings.


    # Customizing your settings


    Without customizing some of your settings, working with Blender can be a bit of
    a chore, especially if you have any experience with another 3D software. When
    we started moving around the interface a bit, you may have noticed right away
    that if you left-click, it moves the little bullseye cursor. This is called the
    3D cursor and it is actually used for a lot of things within Blender, such as
    where to place new 3D shapes. Now, moving this when you left-click is less than
    ideal and is sometimes easily forgotten as you attempt to select things in your
    3D scene, but there is a way to change that.


    In the top-left corner of the screen, click on **File** and select **User Preferences**.
    Select the **Input** tab and look down along the left-hand side until you see
    the **Select With** option. You can see that it''s currently set to right-click
    to select objects. Let''s change that to **Left** to bring it more in line with
    Unreal Engine 4. It stops a lot of confusion later when you are going between
    the two programs. Be sure to click on the **Save User Settings** button at the
    bottom left corner once you have made this change. The second setting that needs
    to be changed involves scale.


    The following screenshot shows the **Blender User Preferences** window:


    ![Customizing your settings](OEBPS/Images/BO5189_01_05.jpg)


    Setting the mouse selection to use the LMB


    To change this next setting, we are going to take a look at the **Properties**
    pane. The window looks something like this:


    Along the top of the pane are several small tabs. We are looking for the **Scene**
    tab denoted by this icon:


    ![Customizing your settings](OEBPS/Images/BO5189_01_06.jpg)


    Setting the mouse selection to use the LMB


    This pane allows us to change several options pertaining to the scene, such as
    the scale. Unreal Engine 4 uses centimeters as its default measurement, so we
    want to match that here. This will make our game assets fit into our levels without
    the need to scale them in the game engine. Follow these steps:


    1.  Change the units used from **None** to **Metric**.


    2.  Change the scale to `0.01`.


    3.  Objects already in the scene (such as our cube) will not scale. If there is
    anything you would like to keep, scale it by `100`. This can be done by clicking
    on the **Scale** button on the left hand side, typing `100`, and pressing *Enter*.


    4.  This will cause the object to start clipping through the edge of the grid.
    To fix this, we press *N* to open the **Scene Properties** bar, find the **View**
    section, then the **Clip** section, and lastly, change the **End** property to
    `1km`.


    ### Tip


    Hint: Certain objects dropped in through the **Add** menu will not be scaled appropriately.
    Scaling these objects by 100 will fix the issue.


    Now that we have made those changes, save your file by using the **File** menu
    or pressing *Ctrl* + *S*.


    # Working with modes


    Blender has one more menu we haven''t talked about yet. This is a small menu bar
    along the bottom of the 3D view that looks like the following:


    ![Working with modes](OEBPS/Images/BO5189_01_07.jpg)


    The menu bar at the bottom of the 3d view. We will use this a lot!


    It contains the **View**, **Select**, **Add**, and **Object** menus. It also contains
    the modes drop-down. We will use many different modes throughout this book, but
    we will spend most of our time in the **Edit** mode. This mode allows us to push
    and pull basic shapes into our new creations. Blender allows us to switch between
    **Object** mode (the default mode) and **Edit** mode fairly easily by pressing
    *Tab*. This will only work if you have an object that can be edited selected in
    the scene. You will notice that many of the menus change when you change modes.
    We will explore this more when we create our first object in [Chapter 3](#ch03.xhtml
    "Chapter 3. It''s Time to Customize!"), *It''s Time to Customize!*.


    ### Tip


    Hint: It may seem like I am skipping a bunch of information. Blender''s menus
    contain way more than I can explain in one chapter of this book and I don''t want
    to bog you down with unnecessary information. If you are curious, check out *Blender
    3D Basics Beginner''s Guide*, Second Edition, by Gordon Fisher, for a more complete
    description.


    # Jumping into our first project


    This book is broken into two projects that will have us creating custom game assets
    in Blender and adding them to levels built in Unreal Engine 4. The first project
    will be a basic level that I have taught many students to create over my 10 years
    of teaching experience: two rooms connected by a hallway with some stairs, doors
    that function, and an elevator. Though the level itself is not complicated, we
    will walk through the entire design process from idea, to prototype, to the final
    product. We will then use this same process to design a more complex level later
    in this book. The levels themselves will be created with a science fiction horror
    theme in mind. Having a theme will unite the two levels and give us an art style
    to work with when the time comes to design custom level assets.


    So how do you design a level from scratch? Our process will follow a few distinct
    steps:


    1.  Every good thing starts on paper. Artists start ideas with sketches. Architects
    have blueprints. Level designers start their levels with map sketches. I recommend
    graph paper. We will start our custom game assets with sketches as well.


    2.  Begin laying out the level using basic shapes in your level editor. Script
    gameplay sequences. Test the level to see if the layout works for the player.
    This is called white boxing, or boxing out your level. It is essentially a level
    prototype.


    3.  Once your white box level is where you would like it, use the blocked out
    sizes to begin creating and adding game assets. This allows us to make assets
    in Blender that are of the correct size and fill the correct space in our level.


    4.  Add in your game assets, adjust lighting, and add special effects.


    5.  Don''t forget to playtest and gather the opinions of your players every step
    of the way!


    Now let''s get our project started in Unreal Engine 4.


    # Getting things started in Unreal Engine 4


    Before we get started with Unreal, make sure that you have installed the **Epic
    Games Launcher**. This is available for free at [https://www.UnrealEngine.com/](https://www.UnrealEngine.com/)
    and can be downloaded by clicking on the **Get Unreal** button located at the
    top right-hand corner of the page. You will be asked to create an account and
    the launcher will ask for this information when you run it.


    Next, click on the **Library** button along the left-hand side of the screen.
    In the section labeled **Engine** versions, click on **Launch** on version 4.9.2
    (the latest version as of this writing). If there are no engines visible, select
    **Add Versions** and follow the prompts:


    ![Getting things started in Unreal Engine 4](OEBPS/Images/BO5189_01_09.jpg)


    The Epic Games Launcher. Clicking Library on the Unreal Engine tab will show what
    engine version you have, as well as your current projects


    Once the engine has loaded, you will be presented with all of the projects you
    have been working on. For this one, let''s start a new project. Click on the **New
    Project** tab at the top, as shown in the following screenshot:


    ![Getting things started in Unreal Engine 4](OEBPS/Images/BO5189_01_10.jpg)


    The New Projects tab'
