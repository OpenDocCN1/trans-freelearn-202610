  trans: '

    *   **场景大纲视图**：这是我们场景中每个对象的便捷列表，如果你在视觉上找不到特定对象时非常有用。虚幻引擎也有一个类似的功能。


    信息量很大，对吧？相信我，多练习就会变容易。为了让事情更简单，让我们自定义一些设置。


    # 自定义你的设置


    如果不自定义一些设置，使用 Blender 会有点麻烦，特别是如果你有其他 3D 软件的使用经验。当我们开始在界面中移动视角时，你可能立刻就注意到了，如果你左键点击，会移动那个小靶心光标。这被称为
    3D 游标，实际上在 Blender 中有很多用途，比如确定放置新 3D 形状的位置。现在，左键点击移动这个游标并不理想，而且当你尝试选择 3D 场景中的物体时，很容易忘记这个设置，但我们可以更改它。


    点击屏幕左上角的**文件**，然后选择**用户偏好设置**。选择**输入**选项卡，沿着左侧向下查找，直到看到**选择方式**选项。你可以看到它当前设置为右键选择物体。让我们将其改为**左键**，使其更符合虚幻引擎
    4 的操作习惯。这能避免你在两个程序之间切换时产生很多困惑。确保在做完更改后，点击左下角的**保存用户设置**按钮。第二个需要更改的设置涉及缩放。


    下面的截图显示了 **Blender 用户偏好设置** 窗口：


    ![自定义你的设置](img/BO5189_01_05.jpg)


    设置鼠标选择使用左键


    要更改下一个设置，我们要看看**属性**面板。窗口看起来大概像这样：


    面板顶部有几个小标签。我们要找的是**场景**标签，由这个图标表示：


    ![自定义你的设置](img/BO5189_01_06.jpg)


    设置鼠标选择使用左键


    此面板允许我们更改与场景相关的几个选项，例如缩放。虚幻引擎 4 默认使用厘米作为度量单位，所以我们要在这里匹配该设置。这将使我们的游戏资产能直接适配关卡，而无需在游戏引擎中缩放它们。请遵循以下步骤：


    1.  将使用的单位从**无**更改为**公制**。

    2.  将缩放比例改为 `0.01`。

    3.  场景中已有的物体（如我们的立方体）不会缩放。如果有任何你想保留的物体，将其缩放 `100` 倍。这可以通过点击左侧的**缩放**按钮，输入 `100`，然后按
    `Enter` 键来完成。

    4.  这会导致物体开始穿透网格边缘。要修复此问题，我们按 `N` 打开**场景属性**栏，找到**视图**部分，然后是**裁剪**部分，最后将**结束**属性改为
    `1km`。


    ### 提示


    提示：通过**添加**菜单放入的某些物体可能不会被适当缩放。将这些物体缩放 100 倍可以解决该问题。


    现在我们已经做了这些更改，通过**文件**菜单或按 `Ctrl` + `S` 保存你的文件。


    # 使用模式


    Blender 还有一个我们还没提到的菜单。这是位于 3D 视图底部的一个小菜单栏，看起来如下所示：


    ![使用模式](img/BO5189_01_07.jpg)


    3D 视图底部的菜单栏。我们会经常用到它！


    它包含**视图**、**选择**、**添加**和**物体**菜单。它还包含模式下拉菜单。我们将在本书中使用许多不同的模式，但我们将花费大部分时间在**编辑**模式中。此模式允许我们推拉基本形状来创建新模型。Blender
    允许我们通过按 `Tab` 键在**物体**模式（默认模式）和**编辑**模式之间轻松切换。这只有在你场景中选中了一个可编辑的物体时才有效。你会注意到当你更改模式时，许多菜单都会发生变化。当我们在
    第 3 章 *是时候自定义了！* 中创建第一个物体时，我们将进一步探索这一点。


    ### 提示


    提示：看起来我似乎跳过了大量信息。Blender 的菜单包含的内容远超我能在本书一章中解释的范围，我不想用不必要的信息拖慢你的进度。如果你很好奇，可以看看
    Gordon Fisher 所著的 *Blender 3D Basics Beginner''s Guide*（第二版），以获取更完整的描述。


    # 开始我们的第一个项目


    本书分为两个项目，我们将在 Blender 中创建自定义游戏资产，并将它们添加到在虚幻引擎 4 中构建的关卡中。第一个项目将是一个基础关卡，我在 10 年的教学经验中教过许多学生创建：两个由走廊连接的房间，带有一些楼梯、功能性的门和一个电梯。虽然关卡本身不复杂，但我们将从构思、原型到最终产品，走完整个设计流程。稍后在本书中，我们将使用这个相同的流程来设计一个更复杂的关卡。关卡本身将以科幻恐怖主题为设计思路。拥有一个主题将统一这两个关卡，并在设计自定义关卡资产时给我们一个可遵循的美术风格。


    那么，如何从零开始设计关卡？我们的流程将遵循几个不同的步骤：


    1.  所有美好的事物都始于纸上。艺术家用草图开始构思。建筑师有蓝图。关卡设计师用地图草图开始他们的关卡。我推荐使用方格纸。我们也将用草图开始我们的自定义游戏资产。

    2.  在关卡编辑器中使用基本形状开始布局关卡。编写游戏流程脚本。测试关卡，看布局是否适合玩家。这被称为白盒测试，或搭建关卡框架。本质上这是一个关卡原型。

    3.  一旦你的白盒关卡达到预期，利用搭建出的尺寸开始创建和添加游戏资产。这使我们能在 Blender 中制作尺寸正确、能正确填充关卡空间的资产。

    4.  添加游戏资产，调整光照，并添加特效。

    5.  不要忘记在每一步都进行游戏测试，并收集玩家的意见！


    现在让我们在虚幻引擎 4 中启动项目。


    # 在虚幻引擎 4 中开始工作


    在开始使用虚幻引擎之前，请确保你已安装 **Epic Games Launcher**。可在 [`www.UnrealEngine.com/`](https://www.UnrealEngine.com/)
    免费获取，点击页面右上角的 **Get Unreal** 按钮即可下载。系统会要求你创建一个账户，启动器运行时会询问该信息。


    接下来，点击屏幕左侧的**库**按钮。在标记为**引擎版本**的部分，点击版本 4.9.2（撰写时的最新版本）上的**启动**。如果没有可见的引擎，选择**添加版本**并按提示操作：


    ![在虚幻引擎 4 中开始工作](img/BO5189_01_09.jpg)


    Epic Games Launcher。点击虚幻引擎标签下的库将显示你拥有的引擎版本以及当前项目


    引擎加载完成后，将显示你正在处理的所有项目。对于这个项目，让我们创建一个新项目。点击顶部的**新建项目**标签，如下截图所示：


    ![在虚幻引擎 4 中开始工作](img/BO5189_01_10.jpg)


    新建项目标签

    '
