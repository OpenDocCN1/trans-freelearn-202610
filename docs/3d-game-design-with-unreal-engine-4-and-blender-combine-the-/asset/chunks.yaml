    \ island scale / [Average Island Scale](#ch07.xhtml \"Average Island Scale\")\n\
    \n    *   pack islands / [Pack Islands](#ch07.xhtml \"Pack Islands\")\n\n    *\
    \   Smart UV Project, using / [Using Smart UV Project](#ch07s02.xhtml \"Using\
