    您是否需要即时解决 IT 疑难问题？PacktLib 是 Packt 的在线数字图书库。在这里，您可以搜索、访问并阅读 Packt 的全部图书库藏书。


    ## 为什么要订阅？


    *   可在 Packt 出版的每本书中进行全文搜索

    *   复制粘贴、打印和书签内容

    *   按需访问，可通过 Web 浏览器访问


    近年来独立游戏开发呈爆发式增长，许多开发者正在寻找强大且低成本的工具，以便将他们的梦想游戏推向市场。


    Blender 是一款被全球开发者使用的强大开源 3D 软件包；它以易用性和活跃的社区而闻名。Unreal Engine 4 是由 Epic Games 打造的惊人
    3A 游戏引擎，已成为众多大大小小游戏开发者的首选。


    在本书中，我们将探讨如何利用 Blender 为 Unreal Engine 4 创建动态和静态游戏美术资源，以及如何将这些资源导入到我们自己的项目中。


    # 本书内容涵盖


    第 1 章，*Unreal, My Friend, I''d Like You to Meet Blender*（虚幻啊，我的朋友，我想让你认识一下 Blender），将指导您安装和设置
    Blender 3D 软件包。我们将讨论 Blender 的界面和工具，并开始我们的第一个项目。


    第 2 章，*Starting Our First Project*（开始我们的第一个项目），带我们进入 Unreal Engine 4，开始设计项目的第一个关卡。我们将回顾一些关卡设计基础，并搭建一个供未来游戏美术资源存在的游戏关卡。


    第 3 章，*It''s Time to Customize!*（是时候进行定制了！），将让我们在 Blender 中开始创建第一个游戏资源——用于货轮关卡的太空时代货箱。我们将介绍基本建模技术，并讨论游戏资源的
    UV 展开和贴图流程。


    第 4 章，*Getting the Assets to the Level*（将资源导入关卡），将讨论从 Blender 导出货箱并将其导入 Unreal
    的流程，以便我们在货轮关卡中使用它。


    第 5 章，*Taking This Level Up a Notch*（让关卡更上一层楼），将让我们从货轮转向构建空间站关卡，包含完整的脚本事件以丰富玩家的情感体验。我们将探讨蓝图中更高级的脚本技术，并准备关卡以接收更高级的游戏资源。


    第 6 章，*Monster Assets – The Level Totally Needs One of These*（怪物资源——关卡完全需要一个这样的东西），将带我们完成创建更高级游戏资源——神器的设计流程。我们将了解更多
    3D 建模工具，您将明白如何从多个组件构建游戏资源。


    第 7 章，*Let''s Dress to Impress!*（让我们盛装以赴！），将带我们完成构成神器的所有不同部件的 UV 展开过程。我们将了解 Blender
    中一些高级 UV 工具。您还将学习如何利用 Substance Painter 创建令人惊叹的纹理和材质。


    第 8 章，*Lights, Camera, Animation!*（灯光、摄像、动画！），带我们回到 Blender 为神器创建动画。我们将讨论将动画导入
    Unreal Engine 4 的要求，以及在 Blender 中使用骨骼和绑定。


    第 9 章，*Bang Bang – Let''s Make It Explode*（砰砰——让它爆炸吧），以创建视频游戏爆炸效果（使用声音、粒子特效和飞散碎片）作为全书的结尾。我们将通过将游戏资源导入
    Unreal Engine 4 并设置其爆炸来庆祝资源的完成！


    # 阅读本书所需条件


    阅读本书需要以下硬件和软件：


    *   台式电脑或 Mac

    *   Windows 7 64 位或 Mac OS X 10.10 或更高版本

    *   四核 Intel 或 AMD 处理器，2.5 GHz 或更高

    *   NVIDIA GeForce 470 GTX 或 AMD Radeon 6870 HD 系列显卡或更高版本

    *   8 GB 内存

    *   一个三键鼠标

    *   Unreal Engine 4.9 或更高版本

    *   Blender 2.76 Release Candidate 3 或更高版本

    *   Substance Painter 1.7 30 天免费试用版或更高版本


    本书提到的所有软件均免费，可从互联网下载。


    # 适读人群


    本书非常适合想要创建惊人的 3D 游戏环境，并利用 Blender 与 Unreal Engine 4 的强大功能相结合的 3D 艺术家和游戏设计师。掌握
    3D 设计基础知识对于充分利用本书是必要的。有 Blender 使用经验会有帮助，但非必需。


    # 约定


    在本书中，您将看到多种文本样式，用于区分不同类型的信息。以下是这些样式的示例及其含义说明。


    文本中的代码词、数据库表名、文件夹名称、文件名、文件扩展名、路径名、虚拟 URL、用户输入和 Twitter 账号显示如下："This can be found
    by typing `Input` `E` into the Find a Node search box."（可通过在“查找节点”搜索框中输入 `Input`
    `E` 来找到它。）


    **新术语** 和 **重要单词** 以粗体显示。您在屏幕上看到的词汇（例如菜单或对话框中的内容）会在文本中以此形式显示："Click on the `Add
    Modifier` dropdown and select `Mirror`."（点击 `Add Modifier` 下拉菜单并选择 `Mirror`。）


    ### Note


    警告或重要提示会显示在这样的框中。


    ### Tip


    技巧和窍门会以这种形式显示。


    # 读者反馈


    我们始终欢迎读者的反馈。请告诉我们您对本书的看法——您喜欢或不喜欢的地方。读者反馈对我们很重要，因为它有助于我们开发出您真正能从中获益良多的书籍。


    如需发送一般反馈，请发送电子邮件至 `<feedback@packtpub.com>`，并在邮件主题中注明书名。


    如果您在某个主题上有专长，并有兴趣撰写或参与编写一本书，请参阅 [www.packtpub.com/authors](http://www.packtpub.com/authors)
    上的作者指南。


    # 客户支持


    既然您已成为 Packt 图书的荣幸拥有者，我们准备了一系列内容帮助您最大程度地利用您的购买。


    ## 下载本书的彩色图片


    我们还提供一个包含本书所用截图/图表彩色图片的 PDF 文件。彩色图片将帮助您更好地理解输出结果的变化。您可以从 [`www.packtpub.com/sites/default/files/downloads/3DGameDesignwithUnrealEngine4andBlender_coloredImages.pdf`](https://www.packtpub.com/sites/default/files/downloads/3DGameDesignwithUnrealEngine4andBlender_coloredImages.pdf)
    下载此文件。


