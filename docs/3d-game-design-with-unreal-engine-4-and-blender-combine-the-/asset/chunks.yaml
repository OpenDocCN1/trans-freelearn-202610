- raw: "Now that we have moving doors, we are going to do the same thing to our elevator,\
    \ only this time we will use a slightly different process. **Matinee** is a powerful\
    \ tool that allows animators and game designers to create high quality animations\
    \ inside Unreal. We are going to use this tool to animate our elevator:\n\n1.\
    \  Creating a **Matinee** is a bit different from creating a **Timeline**. To\
    \ start a Matinee, click on the **Matinee** button and select **Add Matinee**.\
    \ Unreal will give you a warning that **Undo**/**Redo** data will reset. Go ahead\
    \ and click **Continue** and this will create a Matinee object in your level.\
    \ Don't worry about its location, this thing works from anywhere. Click on the\
    \ object and select **Open Matinee** over in the **Details** panel. The following\
    \ screenshot shows the **Matinee** tool: ![Adding interactive elements using Triggers\
    \ and Blueprints](OEBPS/Images/BO5189_02_23.jpg)\n\n    Using the Matinee tool\n\
    \n2.  Back in the level, click on our elevator platform and make sure it is set\
    \ to **Movable** in the **Details** panel. Now click back in the **Matinee**.\
    \ In the **Tracks** section of the matinee screen, we are going to right-click\
    \ and select **Create New Empty Group** from the menu. Name it something unique,\
    \ such as `Elevator`. This creates a group for any objects we want to animate\
    \ regarding the elevator.\n\n3.  Next, right-click on the group you just created\
    \ and select **Create New** **Movement Track**. This will create the actual animation\
    \ track in which we can add our keyframes: ![Adding interactive elements using\
    \ Triggers and Blueprints](OEBPS/Images/BO5189_02_24.jpg)\n\n    The Matinee interface\n\
    \n4.  When you created the **Movement** track, Unreal created your first keyframe\
    \ at **0**. This will be our down position. To create a second key for our up\
    \ position, click the **Add Key** button located in the top left of the **Matinee**\
    \ screen. Right-click that key and select **Set Time**. Input `2` in the box and\
    \ press *Enter*. With our second key still selected, go to the level and move\
    \ our elevator into the up position. We will know that it worked when we see a\
    \ dotted line created that goes from our down position to our new up position.\
    \ Lastly, change the length of the total **Matinee** sequence by grabbing the\
    \ red tab at the bottom of the Time Bar near **5** and dragging it down to **2**.\
    \ With that done, let's close our **Matinee**: ![Adding interactive elements using\
    \ Triggers and Blueprints](OEBPS/Images/BO5189_02_25.jpg)\n\n    The completed\
    \ elevator\n\n5.  At this point, we need some buttons in our level to control\
    \ our elevator. Go ahead and head over to the **Shapes** folder, like we have\
    \ done in the past, and grab a couple of shapes we can use as call buttons. I\
    \ used a pyramid that had been scaled down a bit to fit on the pillars and walls\
    \ near the platform. We also need to add **Box Triggers** around each of our buttons\
    \ to create an activation area the player needs to be in to use the button: ![Adding\
    \ interactive elements using Triggers and Blueprints](OEBPS/Images/BO5189_02_26.jpg)\n\
    \n    The blueprint for the elevator\n\n6.  With all of our buttons and **Box\
    \ Triggers** in place, it's time to assemble the **Blueprint** sequence. In the\
    \ level, select all of your Box Triggers we will be using. In the Blueprint window,\
    \ right-click and select **Add Event for Selected Actors**. This will allow you\
    \ to create an **On Actor Begin Overlap** and an **On Actor End Overlap** for\
    \ all the Trigger Boxes at the same time. We also need to search for an input\
    \ event for pressing *E*.\n\n7.  The next node we need is a **Gate**. These nodes\
    \ allow you to control the flow of information through the sequence. Information\
    \ enters the gate through the **Enter** input and only continues if the **Gate**\
    \ is open. In our elevator control (see the preceding picture), pressing *E* will\
    \ send information into the **Gate**, but the gate will only be open if the player\
    \ is standing next to one of the elevator control buttons.\n\n8.  After the **Gate**\
    \ node, we need the aptly named **Flip Flop** node. This node will execute either\
    \ A or B, depending on which branch was last executed. This will allow us to toggle\
    \ the elevator up and down by playing and reversing our **Matinee**.\n\n9.  Now\
    \ we want to tell our sequence to **Play** and **Reverse** the Matinee. Click\
    \ on the **Matinee** object back in our level. Come back into the Blueprint and\
    \ right click, then select to create a reference to our **Matinee Actor**. Drag\
    \ a wire off the Matinee Actor and search for the **Play** and **Reverse** nodes.\
    \ Add these to the Blueprint.\n\n10.  Now wire the Blueprint like you see in the\
    \ image, click the **Compile** button, and give the level a test!\n\n### Tip\n\
    \nLearning to read the programming logic of Blueprints can be a huge help when\
    \ we begin to create things that have never been done before. For our elevator\
    \ Blueprint, we can talk it through by starting with the Event and going through\
    \ each action. For example, our elevator starts by pressing *E*. The gate checks\
    \ to see if the player is near a button or not. If it is, the elevator Matinee\
    \ will either Play or Reverse, depending on what it did last. Learning from existing\
    \ Blueprint sequences is great practice!\n\n# Playtesting our level\n\nThe next\
    \ step in our design process is to playtest our prototype level with friends,\
    \ family, and, most importantly, the people who will be playing our game. Playtesting\
    \ is one of the most important and overlooked steps of the design process. Many\
    \ game and level designers want to rush and press on toward a final design and,\
    \ by doing so, miss out on the valuable feedback that other people who are not\
    \ involved with the design and construction of your game can offer. It is important\
    \ to remember that although the level may be fun for you to play, others may find\
    \ it confusing or missing critical features. Getting feedback from players by\
    \ allowing them to try the prototype can help us see the things that we take for\
    \ granted because we are the designers.\n\nIf this level were for a commercial\
    \ game, we would spend some time testing with friends and co-workers, incorporating\
    \ feedback as we go. The lighting might be too dark or the buttons too difficult\
    \ to find. We might add more rooms or a puzzle to make the level more of a challenge.\
    \ We could even scrap the whole thing and start over if we were receiving consistent\
    \ feedback that people didn't understand the reason it was there. The important\
    \ thing to remember with playtesting is that your players' feedback is not a criticism\
    \ of you or your idea. The information you gather from them is meant to improve\
    \ your levels and strengthen your designs, so never miss an opportunity to gather\
    \ this important data!\n\n# Summary\n\nIn this chapter, we went through the process\
    \ of building a level using Unreal Engine 4, based on a design we sketched out\
    \ on paper. The level itself was simple: two rooms connected by a hallway with\
    \ doors, stairs, and an elevator. We used a selection of shapes and props that\
    \ were available in the `Starter Content` folder to decorate our space to fit\
    \ our science fiction horror theme. We also looked at how to use lights in the\
    \ level to create tension and convey mood. Through Blueprints, we were able to\
    \ explore level programming by animating our doors and elevator. Finally, we talked\
    \ about the importance of playtesting and how constructive criticism from our\
    \ players can only make our levels and games better. In the next chapter, we are\
    \ going to move into using Blender and create a prop for our level, based on some\
    \ of the basic shapes we used to decorate the ship during the whiteboxing process.\n\
    \nHow did your level turn out?\n\nDoes it feel like a cargo ship?\n\nHow did your\
    \ play testers feel while playing it?"
  fmt: "\n# Animating the Elevator with Matinee\n\n1.  Creating a `Matinee` is a bit\
    \ different from creating a `Timeline`. To start a Matinee, click on the `Matinee`\
    \ button and select `Add Matinee`. Unreal will give you a warning that `Undo`/`Redo`\
    \ data will reset. Go ahead and click `Continue` and this will create a Matinee\
    \ object in your level. Don't worry about its location, this thing works from\
    \ anywhere. Click on the object and select `Open Matinee` over in the `Details`\
    \ panel. The following screenshot shows the `Matinee` tool:\n\n    ![Adding interactive\
    \ elements using Triggers and Blueprints](OEBPS/Images/BO5189_02_23.jpg)\n\n \
    \   Using the Matinee tool\n\n2.  Back in the level, click on our elevator platform\
    \ and make sure it is set to `Movable` in the `Details` panel. Now click back\
    \ in the `Matinee`. In the `Tracks` section of the matinee screen, we are going\
    \ to right-click and select `Create New Empty Group` from the menu. Name it something\
    \ unique, such as `Elevator`. This creates a group for any objects we want to\
    \ animate regarding the elevator.\n\n3.  Next, right-click on the group you just\
    \ created and select `Create New Movement Track`. This will create the actual\
    \ animation track in which we can add our keyframes:\n\n    ![Adding interactive\
    \ elements using Triggers and Blueprints](OEBPS/Images/BO5189_02_24.jpg)\n\n \
    \   The Matinee interface\n\n4.  When you created the `Movement` track, Unreal\
    \ created your first keyframe at `0`. This will be our down position. To create\
    \ a second key for our up position, click the `Add Key` button located in the\
    \ top left of the `Matinee` screen. Right-click that key and select `Set Time`.\
    \ Input `2` in the box and press `Enter`. With our second key still selected,\
    \ go to the level and move our elevator into the up position. We will know that\
    \ it worked when we see a dotted line created that goes from our down position\
    \ to our new up position. Lastly, change the length of the total `Matinee` sequence\
    \ by grabbing the red tab at the bottom of the Time Bar near `5` and dragging\
    \ it down to `2`. With that done, let's close our `Matinee`:\n\n    ![Adding interactive\
    \ elements using Triggers and Blueprints](OEBPS/Images/BO5189_02_25.jpg)\n\n \
    \   The completed elevator\n\n5.  At this point, we need some buttons in our level\
    \ to control our elevator. Go ahead and head over to the `Shapes` folder, like\
    \ we have done in the past, and grab a couple of shapes we can use as call buttons.\
    \ I used a pyramid that had been scaled down a bit to fit on the pillars and walls\
    \ near the platform. We also need to add `Box Triggers` around each of our buttons\
    \ to create an activation area the player needs to be in to use the button:\n\n\
    \    ![Adding interactive elements using Triggers and Blueprints](OEBPS/Images/BO5189_02_26.jpg)\n\
    \n    The blueprint for the elevator\n\n6.  With all of our buttons and `Box Triggers`\
    \ in place, it's time to assemble the `Blueprint` sequence. In the level, select\
    \ all of your Box Triggers we will be using. In the Blueprint window, right-click\
    \ and select `Add Event for Selected Actors`. This will allow you to create an\
    \ `On Actor Begin Overlap` and an `On Actor End Overlap` for all the Trigger Boxes\
    \ at the same time. We also need to search for an input event for pressing `E`.\n\
    \n7.  The next node we need is a `Gate`. These nodes allow you to control the\
    \ flow of information through the sequence. Information enters the gate through\
    \ the `Enter` input and only continues if the `Gate` is open. In our elevator\
    \ control (see the preceding picture), pressing `E` will send information into\
    \ the `Gate`, but the gate will only be open if the player is standing next to\
    \ one of the elevator control buttons.\n\n8.  After the `Gate` node, we need the\
    \ aptly named `Flip Flop` node. This node will execute either A or B, depending\
    \ on which branch was last executed. This will allow us to toggle the elevator\
    \ up and down by playing and reversing our `Matinee`.\n\n9.  Now we want to tell\
    \ our sequence to `Play` and `Reverse` the Matinee. Click on the `Matinee` object\
    \ back in our level. Come back into the Blueprint and right click, then select\
    \ to create a reference to our `Matinee Actor`. Drag a wire off the Matinee Actor\
    \ and search for the `Play` and `Reverse` nodes. Add these to the `Blueprint`.\n\
    \n10.  Now wire the `Blueprint` like you see in the image, click the `Compile`\
    \ button, and give the level a test!\n\n## Tip\n\nLearning to read the programming\
    \ logic of `Blueprints` can be a huge help when we begin to create things that\
    \ have never been done before. For our elevator `Blueprint`, we can talk it through\
    \ by starting with the `Event` and going through each action. For example, our\
    \ elevator starts by pressing `E`. The `Gate` checks to see if the player is near\
    \ a button or not. If it is, the elevator `Matinee` will either `Play` or `Reverse`,\
    \ depending on what it did last. Learning from existing `Blueprint` sequences\
    \ is great practice!\n\n## Playtesting Our Level\n\nThe next step in our design\
    \ process is to playtest our prototype level with friends, family, and, most importantly,\
    \ the people who will be playing our game. Playtesting is one of the most important\
    \ and overlooked steps of the design process. Many game and level designers want\
    \ to rush and press on toward a final design and, by doing so, miss out on the\
    \ valuable feedback that other people who are not involved with the design and\
    \ construction of your game can offer. It is important to remember that although\
    \ the level may be fun for you to play, others may find it confusing or missing\
    \ critical features. Getting feedback from players by allowing them to try the\
    \ prototype can help us see the things that we take for granted because we are\
    \ the designers.\n\nIf this level were for a commercial game, we would spend some\
    \ time testing with friends and co-workers, incorporating feedback as we go. The\
    \ lighting might be too dark or the buttons too difficult to find. We might add\
    \ more rooms or a puzzle to make the level more of a challenge. We could even\
    \ scrap the whole thing and start over if we were receiving consistent feedback\
    \ that people didn't understand the reason it was there. The important thing to\
    \ remember with playtesting is that your players' feedback is not a criticism\
    \ of you or your idea. The information you gather from them is meant to improve\
    \ your levels and strengthen your designs, so never miss an opportunity to gather\
    \ this important data!\n\n## Summary\n\nIn this chapter, we went through the process\
    \ of building a level using `Unreal Engine 4`, based on a design we sketched out\
    \ on paper. The level itself was simple: two rooms connected by a hallway with\
    \ doors, stairs, and an elevator. We used a selection of shapes and props that\
    \ were available in the `Starter Content` folder to decorate our space to fit\
    \ our science fiction horror theme. We also looked at how to use lights in the\
    \ level to create tension and convey mood. Through `Blueprints`, we were able\
    \ to explore level programming by animating our doors and elevator. Finally, we\
    \ talked about the importance of playtesting and how constructive criticism from\
    \ our players can only make our levels and games better. In the next chapter,\
    \ we are going to move into using `Blender` and create a prop for our level, based\
    \ on some of the basic shapes we used to decorate the ship during the whiteboxing\
    \ process.\n\nHow did your level turn out?\n\nDoes it feel like a cargo ship?\n\
    \nHow did your play testers feel while playing it?\n"
  trans: "\n\n# 使用 Matinee 为电梯制作动画\n\n1.  创建 `Matinee` 与创建 `Timeline` 略有不同。要开始使用 Matinee，请点击\
    \ `Matinee` 按钮并选择 `Add Matinee`。Unreal 会警告你 `Undo`/`Redo` 数据将被重置。继续点击 `Continue`，这将在你的关卡中创建一个\
    \ Matinee 对象。不用担心它的位置，这个东西可以在任何地方工作。点击该对象，并在 `Details` 面板中选择 `Open Matinee`。下面的截图展示了\
    \ `Matinee` 工具：\n\n    ![Adding interactive elements using Triggers and Blueprints](img/BO5189_02_23.jpg)\n\
    \n    使用 Matinee 工具\n\n2.  回到关卡中，点击我们的电梯平台，并确保在 `Details` 面板中将其设置为 `Movable`。现在点回\
    \ `Matinee`。在 Matinee 界面的 `Tracks` 部分，我们将右键点击并从菜单中选择 `Create New Empty Group`。给它起一个唯一的名字，比如\
    \ `Elevator`。这将为我们想要为电梯制作动画的任何对象创建一个组。\n\n3.  接下来，右键点击刚创建的组，选择 `Create New Movement\
    \ Track`。这将创建实际的动画轨道，我们可以在其中添加关键帧：\n\n    ![Adding interactive elements using\
    \ Triggers and Blueprints](img/BO5189_02_24.jpg)\n\n    Matinee 界面\n\n4.  当你创建\
    \ `Movement` 轨道时，Unreal 会在 `0` 处创建你的第一个关键帧。这将是我们的下降位置。要为上升位置创建第二个关键帧，请点击 `Matinee`\
    \ 界面左上角的 `Add Key` 按钮。右键点击该关键帧并选择 `Set Time`。在框中输入 `2` 并按 `Enter`。在第二个关键帧仍处于选中状态时，回到关卡中将电梯移动到上升位置。当我们看到一条从下降位置延伸到新上升位置的虚线生成时，就知道操作成功了。最后，通过抓取\
    \ Time Bar 底部靠近 `5` 处的红色标签并将其向下拖动到 `2`，来更改 `Matinee` 序列的总长度。完成后，关闭 `Matinee`：\n\
    \n    ![Adding interactive elements using Triggers and Blueprints](img/BO5189_02_25.jpg)\n\
    \n    完成的电梯\n\n5.  此时，我们需要在关卡中放置一些按钮来控制电梯。前往 `Shapes` 文件夹，像以前一样，拿几个形状作为呼叫按钮。我使用了一个稍微缩小过的金字塔，以适应平台附近柱子和墙壁上的位置。我们还需要在每个按钮周围添加\
    \ `Box Triggers`，以创建一个激活区域，玩家必须进入该区域才能使用按钮：\n\n    ![Adding interactive elements\
    \ using Triggers and Blueprints](img/BO5189_02_26.jpg)\n\n    电梯的蓝图\n\n6.  所有按钮和\
    \ `Box Triggers` 就位后，是时候组装 `Blueprint` 序列了。在关卡中，选择我们将要使用的所有 Box Triggers。在 Blueprint\
    \ 窗口中，右键点击并选择 `Add Event for Selected Actors`。这将允许你同时为所有 Trigger Boxes 创建 `On\
    \ Actor Begin Overlap` 和 `On Actor End Overlap`。我们还需要搜索一个按下 `E` 键的输入事件。\n\n7.\
    \  接下来我们需要一个 `Gate` 节点。这些节点允许你控制信息在序列中的流动。信息通过 `Enter` 输入进入 Gate，仅当 `Gate` 打开时才会继续传递。在我们的电梯控制中（见前图），按下\
    \ `E` 会将信息发送到 `Gate`，但只有当玩家站在电梯控制按钮旁边时，Gate 才会打开。\n\n8.  在 `Gate` 节点之后，我们需要一个名为\
    \ `Flip Flop` 的节点。根据上一次执行的是哪个分支，该节点将执行 A 或 B。这将允许我们通过播放和反转 `Matinee` 来切换电梯的上下运动。\n\
    \n9.  现在我们要让序列 `Play` 和 `Reverse` Matinee。回到关卡中点击 `Matinee` 对象。回到 Blueprint 中右键点击，然后选择创建一个对\
    \ `Matinee Actor` 的引用。从 Matinee Actor 拖出连线并搜索 `Play` 和 `Reverse` 节点。将它们添加到 `Blueprint`\
    \ 中。\n\n10.  现在像图中那样连接 `Blueprint`，点击 `Compile` 按钮，然后测试关卡！\n\n## 提示\n\n学会阅读 `Blueprints`\
    \ 的编程逻辑，在我们开始创建前所未有的事物时将大有裨益。对于我们的电梯 `Blueprint`，我们可以从 `Event` 开始，逐步梳理每个动作来理解它。例如，我们的电梯从按下\
    \ `E` 开始。`Gate` 检查玩家是否在按钮附近。如果在，电梯 `Matinee` 将根据上次的动作选择 `Play` 或 `Reverse`。从现有的\
    \ `Blueprint` 序列中学习是极好的练习！\n\n## 测试我们的关卡\n\n设计流程的下一步是与朋友、家人，以及最重要的是将要玩我们游戏的人一起试玩我们的原型关卡。试玩是设计流程中最重要但也最容易被忽视的步骤之一。许多游戏和关卡设计师急于推进最终设计，因此错过了那些未参与游戏设计和构建的人所能提供的宝贵反馈。重要的是要记住，虽然关卡对你来说很好玩，但其他人可能会觉得困惑或缺少关键功能。通过让玩家试玩原型来获取反馈，可以帮助我们发现那些我们作为设计师理所当然认为存在的事物。\n\
    \n如果这个关卡是为商业游戏准备的，我们会花一些时间与朋友和同事测试，并在此过程中融入反馈。灯光可能太暗，或者按钮太难找。我们可能会增加更多房间或谜题，使关卡更具挑战性。如果我们持续收到玩家不理解关卡存在理由的反馈，我们甚至可以推倒重来。试玩时要记住的重要一点是：玩家的反馈不是对你或你的想法的批评。从他们那里收集的信息旨在改进你的关卡并强化你的设计，所以永远不要错过收集这一重要数据的机会！\n\
    \n## 总结\n\n在本章中，我们根据纸上草图的设计，完成了使用 `Unreal Engine 4` 构建关卡的过程。关卡本身很简单：两个房间通过走廊连接，包含门、楼梯和电梯。我们使用\
    \ `Starter Content` 文件夹中提供的一系列形状和道具来装饰空间，以契合科幻恐怖主题。我们还学习了如何在关卡中使用灯光来营造张力和传达氛围。通过\
    \ `Blueprints`，我们探索了关卡编程，为门和电梯制作了动画。最后，我们讨论了试玩的重要性，以及玩家的建设性批评只会让我们的关卡和游戏变得更好。在下一章中，我们将转向使用\
    \ `Blender`，根据白模阶段装饰飞船时使用的一些基本形状，为关卡创建一个道具。\n\n你的关卡做得怎么样？\n\n它感觉像一艘货船吗？\n\n试玩者在玩的时候感觉如何？\n\
    \n"
