    # Gear Modeling


    **3.** Now let''s do an `Inset`: ![Using multiple shapes within Blender](OEBPS/Images/BO5189_06_15.jpg)


    Using `Inset` to add detail to the gear


    **4.** Heading into `Edit` mode, we can start shaping this cylinder into the gear
    we need. Hide the top and bottom portions of the Artifact so you can only see
    the piece we are working on. Select the front polygon and press `I` to `Inset`
    it. I did an `Inset` of `5cm`. Then we are going to `Inset` it another `5cm`.
    Once that is done, do the same thing to the back polygon: ![Using multiple shapes
    within Blender](OEBPS/Images/BO5189_06_16.jpg)


    Delete the middle ring of polygons on both sides


    **5.** Select the middle ring of polygons we just created and press `Delete`.
    When it asks what to delete, select `Faces` from the menu. Just as before, do
    the same for the back side: ![Using multiple shapes within Blender](OEBPS/Images/BO5189_06_17.jpg)


    Use `Bridge Edge Loops` to create more detail


    **6.** Time to use the `Bridge Edge Loops` tool! Starting at the 12 o''clock position,
    select the first line on the inner polygon and its corresponding line on the outer
    polygon. Press `W` and select `Bridge Edge Loops` tool. Look at that nice new
    polygon! Now do the same for every other line all the way around the circle. As
    before, do the same on the back side of the gear. In the next step, we will build
    the inside polygons of the gear:


    ### Tip


    Don''t worry if something messes up when creating these new polygons. Just press
    `Ctrl + Z` to undo it and try again!


    ![Using multiple shapes within Blender](OEBPS/Images/BO5189_06_18.jpg)


    Using `Bridge Edge Loops` to create the inside portion of the gear shape


    **7.** Adding the inside polygons to the arms of the gear is a four-step process.
    We need to use the `Bridge Edge Loops` tool to create four polygons in each hole
    to seal up the inside of the piece: ![Using multiple shapes within Blender](OEBPS/Images/BO5189_06_19.jpg)


    Extrude and scale to create more detail in the center of the gear


    **8.** The center of the gear is meant to look like it is holding a medallion
    or talisman and is another multi-part operation done in small amounts. Select
    the center polygon on the front of the gear and `Extrude` it out. Next, `Scale`
    it down a little bit to start creating a lip for the hole that it will sit in:
    ![Using multiple shapes within Blender](OEBPS/Images/BO5189_06_20.jpg)


    Extrude and bevel the center to finish out the details


    **9.** Now, `Inset` the polygon to create the top part of the lip. Create the
    rest of the lip by extruding the polygon inward a bit and `Scaling` it down. Finally,
    `Extrude` out and `Bevel` the polygon to finish the shape: ![Using multiple shapes
    within Blender](OEBPS/Images/BO5189_06_21.jpg)


    Add the gear teeth using extrude individual


    **10.** What is a gear without teeth? To create the teeth, we `Extrude` the polygons
    around the outside of the gear that line up with the arms on the inside. We can
    select all of the polygons at once and select `Extrude Individual` from the `Tools`
    pane. This allows us to extrude each polygon so that the gear teeth are equal.
    After that, just `Scale` each polygon on the end of the teeth down a bit. I scaled
    each one by `0.75`: ![Using multiple shapes within Blender](OEBPS/Images/BO5189_06_22.jpg)


    Extrude the back polygon out a bit to create a place for the gear to attach to
    the Artifact


    **11.** Time for the finishing touch! Select the back polygon and `Extrude` it
    out to create a post on which the gear can spin. This will create a good contact
    point for the gear to mount on the bottom section of the Artifact.


    To open, the Artifact uses pistons to raise the lid. The design calls for seven
    of them spaced around the bottom section of the object. We''re going to cheat
    a little bit on this one and create just one piston, which we can just copy to
    create the other six.


    ### Tip


    There are two major things I''ve learned when it comes to 3D modelling. The first
    is that it''s important to work smarter and not harder. The second is that sometimes
    we build things just to make them look cool!


    Since the piston itself is round, we once again start with our old friend the
    cylinder. Let''s get started!


    # Piston Modeling


    **1.** Create yourself a new cylinder. I set mine to `32` `Vertices`, `3.75cm`
    `Radius`, and a `Depth` of `15cm`: ![Using multiple shapes within Blender](OEBPS/Images/BO5189_06_23.jpg)


    Start with a cylinder and use `Loop, Cut, and Slide` to add two new edge loops


    **2.** To create a wider middle section, select all of the middle polygons and
    use the `Loop, Cut, and Slide` tool to add two new edge loops around the center.
    Click again to finalize the cut. Now click the `Extrude` dropdown in the `Tools`
    pane and select `Region (Vertex Normals)`. This will extrude all of the polygons
    out from the center evenly.


    **3.** Let''s round off the bottom. `Extrude` the bottom polygon of the piston
    and then use the `Bevel` tool on it. This should give us a nice rounded end: ![Using
    multiple shapes within Blender](OEBPS/Images/BO5189_06_24.jpg)


    Adding a lip to the piston


    **4.** For an added touch, give the top of the piston a lip, just like we did
    for the front of the gear. `Extrude` the top polygon just a little bit, then `Inset`
    it a little, and finally `Extrude` the polygon back down into the piston: ![Using
    multiple shapes within Blender](OEBPS/Images/BO5189_06_25.jpg)


    Create a new cylinder and position it so that it looks like it extends out from
    the bottom piston piece


    **5.** Now the piston has to extend to raise the lid far enough so that whatever
    sinister thing is inside can get out. We can do this by creating a telescoping
    portion that lifts the lid. Now you may think that sounds difficult, but remember,
    work smarter not harder. We can create this portion by creating a second cylinder
    to extend out of the first part. Create a cylinder that is of `32` `Vertices`,
    `3cm` of `Radius`, and `13cm` of `Depth`. Line this up with the bottom portion
    of our piston. You can switch to a wireframe view by pressing `Z` to get a better
    view. Press `Z` again to go back to the solid view: ![Using multiple shapes within
    Blender](OEBPS/Images/BO5189_06_26.jpg)


    The finished piston


    **6.** To raise it up high enough, we need to add a few more sections to the piston.
    Take the first portion and `Duplicate` it. Then move it upward to line up with
    the top of the last section. Finally scale it down to `0.75`. To make the next
    section, rinse and repeat. What you get is three sections that, when moved down,
    fit neatly inside one another. When we animate the Artifact opening and closing,
    we will expand and compress the sections to give the illusion that it telescopes
    out.


    **7.** To finish off the piston, `Duplicate` the first piece we created and make
    that the top: ![Using multiple shapes within Blender](OEBPS/Images/BO5189_06_27.jpg)


    Duplicate the piston around the Artifact so that there are seven in total


    **8.** With the piston pieces all completed, grab your finished piston and `Duplicate`
    it around the Artifact at equal intervals, similar to what is in the image.


    That''s it for the pistons! There is only one major set of pieces left to complete
    and in my opinion they are the most fun: the tentacles! The design calls for the
    tentacles to be used as handles and legs to give the Artifact an otherworldly
    feel. To make these weird creations, we will use a combination of a `Bezier Curve`
    and some modifiers to copy a section of tentacle along a path. This also has the
    added bonus of making them flexible and easily posed.


    On to the next step! The tentacle begins with a basic cube:


    ![Using multiple shapes within Blender](OEBPS/Images/BO5189_06_28.jpg)


    Begin the tentacle with a cube


    It''s tentacle time! Let''s finish the last piece of our creation:

    '
