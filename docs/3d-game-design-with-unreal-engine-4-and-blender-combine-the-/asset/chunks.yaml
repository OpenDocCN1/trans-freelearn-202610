- raw: "2.  Now that we have our project set up, go ahead and save it. Much like Unreal\
    \ Engine 4, Substance Painter is a sophisticated program that uses a significant\
    \ amount of your computer's resources. This can cause it to become unstable at\
    \ times and crash. Remember to save often! ![Using different maps to create a\
    \ more realistic look](OEBPS/Images/B05189_07_31.jpg)\n\n    Import all of the\
    \ PSD files from the Alphas folder of the Sci Fi Crate tutorial\n\n3.  Let's import\
    \ some additional tools into the program. Find where you saved the Sci Fi Crate\
    \ tutorial assets and unzip the file. In the **Alphas** folder, we will find several\
    \ new alphas that Substance Painter can use as detail brushes. Select all of the\
    \ PSD files in the folder and drag them into the **Alphas** tab of the **Shelf**—the\
    \ large window that runs along the bottom of the screen. That will add them to\
    \ the project for our use: ![Using different maps to create a more realistic look](OEBPS/Images/B05189_07_32.jpg)\n\
    \n    Creating a mask so that we only color in certain parts of the Artifact\n\
    \n4.  Time to begin adding details. Substance Painter works by changing the **Height**,\
    \ **Color**, **Roughness**, and **Metallic** properties of an object to add detail\
    \ and color without adding any new geometry. We will be adding new features to\
    \ the Artifact, such as corrosion, seams, rivets, and more. These details will\
    \ be added to a normal map that we can then use in Unreal. To get started, let's\
    \ mask off the sections we would like to work with first. Press *T* to switch\
    \ to **Quick Mask** mode. Now click **Polygon Fill** in the menu bar located in\
    \ the top left of the screen. This will allow us to mask off the sections we want\
    \ to work with by coloring polygons. Over in the **Properties** pane on the far\
    \ right, slide the **Color** slider all the way to the left. We want to color\
    \ in the sections we want to protect in black. Those left white will be edited\
    \ by the tools we will use: ![Using different maps to create a more realistic\
    \ look](OEBPS/Images/B05189_07_33.jpg)\n\n    Mask off all but the top and bottom\n\
    \n5.  Select the **UV** button in the **Properties** pane. This will allow us\
    \ to fill whole UV islands. Click the outer shell of both the top and bottom sections\
    \ of the Artifact. Next, rotate the 3D view by holding *Ctrl* and using the *left\
    \ mouse button* so that you can select the large polygons located at the top and\
    \ bottom. If the Artifact slides out of view, use *Ctrl* + *middle mouse button*\
    \ to slide the camera. Once you have selected those polygons, Press the *I* key\
    \ to invert the selection. Now we can add details to the outside without touching\
    \ any of the other parts. Once we are done with masking, click back on the paintbrush\
    \ in the menu bar to head back to painting mode, and press *T* to stop editing\
    \ our **Quick Mask** and begin using it: ![Using different maps to create a more\
    \ realistic look](OEBPS/Images/B05189_07_34.jpg)\n\n    Let's add some details\
    \ to the very top\n\n6.  In the **Alphas** pane, select the **RT\\_Industr\\_019**\
    \ alpha and drag it to the **Alpha** option in the **Properties** pane. Underneath\
    \ the **Alphas** option in the **Properties** pane is the **Material** section.\
    \ Click the buttons for **Color**, **Rough**, and **Metal** to turn them off.\
    \ We only want to affect the **Height** channel with these first details. (If\
    \ you cannot see the options, click the **Layer 1** layer in the **Layers** pane.)\
    \ Rotate the camera so that you can see the top polygon of the Artifact. You can\
    \ look at an exact top view by holding *Alt*, then holding *Shift*, and finally\
    \ using the *left mouse button* to rotate the view to the top. The view should\
    \ snap to a top view. Move the cursor to the center of the top polygon, hold *Ctrl*\
    \ + *right mouse button*, and drag to resize the tool to fit the face. Over in\
    \ the **Properties** pane, find the **Height** slider in the **Material** section.\
    \ This slider controls whether we will have detail that sticks out of the Artifact\
    \ or cuts into it, by using a value between -1 and 1. -1 will cut grooves into\
    \ our object just like a cookie cutter. 1 will add detail on top of our object.\
    \ Slide the slider all the way to the right to give it a value of 1, line up our\
    \ brush with the top, and click. If you don't like the result, undo it and try\
    \ again: ![Using different maps to create a more realistic look](OEBPS/Images/B05189_07_35.jpg)\n\
    \n    Adding seams can help the Artifact seem more real. The Symmetry tool can\
    \ cut your work time in half.\n\n7.  To save us some time, we are going to turn\
    \ on the **Symmetry** option in the toolbar. Turn on **Symmetry** and adjust the\
    \ **Mirror** axis with the button to the right. Here, I am using **Mirror Z**.\n\
    \n8.  Back in the **Alphas** pane, select the **Bevel** alpha and drag it into\
    \ the **Properties** pane. This alpha creates seams similar to where two metal\
    \ plates fit together. Next, slide the **Height** slider into the negative range.\
    \ I slid mine all the way to the left for `-1`. Adjust the size of the tool to\
    \ something a bit smaller using *Ctrl* + *right mouse button*, and click the *left\
    \ mouse button* once to start our seam. Holding the *Shift* key allows us to create\
    \ a straight line from the last place we clicked. Hold *Shift* and stretch the\
    \ dotted line until the brush meets our top detail. Clicking the *left mouse button*\
    \ will now create a straight seam from where we started to the top of the object.\
    \ Since we are using **Symmetry**, it also creates a seam for us on the back side\
    \ as well.\n\n9.  Now switch our **Mirror** axis back to *X* and create another\
    \ seam along the sides of the Artifact, similar to what we did on the front and\
    \ back: ![Using different maps to create a more realistic look](OEBPS/Images/B05189_07_36.jpg)\n\
    \n    Rivets make the Artifact seem like it is made from metal plates\n\n10. \
    \ Let's add some rivets! Create a new layer in the **Layers** pane by clicking\
    \ the **+** button and rename it to Rivets by double-clicking the layer name.\
    \ We might also want to rename **Layer 1** to **Seams**. Remember that naming\
    \ is important! Change the alpha we are using to **RT\\_Industr\\_010**, resize\
    \ your brush, and begin placing rivets near the corners of our new \"metal plates.\"\
    \ Remember to use the **Mirror X** and **Mirror Z** symmetry axis options to make\
    \ the process easier.\n\n11.  Add as many rivets and seams as you want to the\
    \ top and bottom sections of the Artifact to personalize it and make it your own.\
    \ Just remember to use a new layer each time you want to create a new group of\
    \ details.\n\n12.  Now press *T* to go back to editing the **Quick Mask** and\
    \ press *I* to invert the mask again. Now add detail to the **Gear** and **Pistons**,\
    \ just like we did for the outer shell of the Artifact.\n\n13.  Finally, let's\
    \ create a folder in our **Layers** pane by clicking the little folder button.\
    \ Name it Height Info and then drag each of your layers into it. This way, we\
    \ can keep everything organized.\n\nHow is the Artifact looking? Using this amazing\
    \ tool, we've been able to add some great detail to what might have been a somewhat\
    \ boring model. However, we still need to add some color and really make this\
    \ game asset shine! To simplify the process, we will take advantage of Substance\
    \ Painter's Smart Materials, collections of preset materials and settings that\
    \ are perfect for saving us time. When we combine these with a mask, we are able\
    \ to apply these great looking materials to specific parts of the Artifact.\n\n\
    We will use Smart Materials to give the Artifact a sinister look in just a short\
    \ time. Let's get started!\n\n1.  Click on over to the **Smart Materials** tab\
    \ and scroll down to the **Steel dark stained** material. Click this material\
    \ and drag it into the **Layers** pane. This will apply the material to the whole\
    \ game asset: ![Using different maps to create a more realistic look](OEBPS/Images/B05189_07_37.jpg)\n\
    \n    Apply the Steel dark stained material"
