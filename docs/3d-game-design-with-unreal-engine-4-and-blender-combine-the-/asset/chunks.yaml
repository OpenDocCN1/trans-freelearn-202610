- raw: "At this point, Unreal provides you with a few choices. The engine comes with\
    \ many free starter projects to get you started on a number of different types\
    \ of projects. For our projects, we will use the **First Person** starter project.\
    \ Make sure that the **Starter Content** button says **With Starter Content**\
    \ and give the project a unique name with no spaces. When you are all set, click\
    \ on  **Create Project,** down in the bottom right. Unreal Engine 4 will load\
    \ and we will be all set to start our level.\n\n# Summary\n\nThroughout this chapter,\
    \ you took a look at the tools you will use to bring our level idea to life. Blender\
    \ is a freely available open source creation suite that supports the entire asset\
    \ development process. Created using the Python programming language, Blender\
    \ is flexible enough to run on almost any machine and is entirely cross-platform;\
    \ it runs in Windows, Mac, or Linux. Next, you took a look at the design process\
    \ you will use and how Blender and Unreal Engine 4 plug into it. Lastly, you set\
    \ up Unreal to begin our first project. As you move to the next chapter, you will\
    \ build your first level that will play host to your first original game asset.\
    \ Can you feel the excitement!?\n\nNow it's time for the exciting stuff! As we\
    \ move forward with building our first project, we are going to use the design\
    \ process we talked about in the last chapter and start with a level sketch. You\
    \ might be tempted to just open up Unreal and jump right in, right? Why spend\
    \ time drawing when I could be building that sweet level I've always wanted? Well,\
    \ here's why. The best way to avoid multiple revisions and costly time spent redoing\
    \ sections of your level is to plan in advance. Figure out the setting, architecture,\
    \ background, and story of your level. Put some thought into where you will place\
    \ story cues and power ups. Run your ideas by friends, players, and team members.\
    \ Incorporate the feedback you receive and then build your level. It's the level\
    \ designer's equivalent of \"measure twice, cut once\".\n\nLet's take a look at\
    \ our level sketch:\n\n![Starting Our First Project](OEBPS/Images/BO5189_02_01.jpg)\n\
    \nOur first level map!\n\nSo here is our first level. The level itself is pretty\
    \ basic. We have two rooms connected by a hallway, with some stairs that lead\
    \ up to a second tier. After we finish the basic layout, we can add a cargo elevator\
    \ off to the side and working doors for the player to interact with. I have tried\
    \ to lay out the level in the form of a small cargo ship, to fit the theme of\
    \ our science fiction horror game. The level will function as an introduction\
    \ to the setting, as well as a way to transport the player to the haunted space\
    \ station environment we will be building later.\n\nIn this chapter, we will be\
    \ covering the following topics:\n\n*   Building the level using Unreal's Content\
    \ Browser\n\n*   Using different types of light\n\n*   Adding interactive elements\
    \ using Triggers and Blueprints\n\n*   Playtesting our level\n\n# Using the Content\
    \ Browser to start building the level\n\nGo ahead and open **Epic Games Launcher**,\
    \ and pull up the project we started at the end of the last chapter. Unreal Engine\
    \ 4 was a huge upgrade over the last version of the engine, as it gave users a\
    \ simple drag-and-drop interface. This was accomplished using two important panes\
    \ in the interface: the **Modes** pane and the **Content Browser**. These portions\
    \ of the interface allow level designers to drag elements into the level and place\
    \ them where they need to go. Of these two, we will use the **Content Browser**\
    \ the most:\n\n![Using the Content Browser to start building the level](OEBPS/Images/BO5189_02_02.jpg)\n\
    \nThe Content Browser contains all of the game assets we will use\n\nThe **Content\
    \ Browser** holds all of the objects, sounds, materials, and particles that can\
    \ be used in your creation. These are sorted into folders that mirror the file\
    \ structure where your project is stored. Unreal does this to make it easy to\
    \ move project files around, should the need arise. Navigating the browser is\
    \ easy. Double-clicking a folder opens that folder, while the top portion of the\
    \ panel displays a breadcrumb trail that can be clicked on to move back through\
    \ your selections. I like to ensure that the sources panel is on as well; this\
    \ makes navigation and finding specific files easier. When we created our project,\
    \ we told Unreal to include the **Starter Content** folder. This folder includes\
    \ many basics for us to get started with, such as a variety of basic shapes, architecture\
    \ pieces, materials, and more. With these, we can start whiteboxing our design.\n\
    \nStart by creating the first room:\n\n![Using the Content Browser to start building\
    \ the level](OEBPS/Images/BO5189_02_03.jpg)\n\nThe first room of our project\n\
    \n### Tip\n\nHint: Moving forward, we will begin building our level in Unreal.\
    \ This book assumes the reader has a basic understanding of using Unreal Engine\
    \ 4. If you are having issues following along, check out the *UnrealEngine* channel\
    \ on YouTube for some great introductory tutorials from Epic Games. It can be\
    \ found at [https://www.youtube.com/channel/UCBobmJyzsJ6Ll7UbfhI4iwQ/](https://www.youtube.com/channel/UCBobmJyzsJ6Ll7UbfhI4iwQ/).\n\
    \nTo start building our first room, we are going to take advantage of the assets\
    \ we have in the **Architecture** folder. Using its selection of floors, walls,\
    \ and doors, we are going to assemble the first room of our design:\n\n1.  First\
    \ let's start a new level in our project. Head up to the **File** menu, click\
    \ it, and select new level. Choose **Empty Level** in the dialog box that appears.\n\
    \n2.  The new level contains absolutely nothing. Perfect for our foray into space!\
    \ Drop in a **Floor\\_400x400** piece as a place to start. This is done by clicking\
    \ and dragging the piece into the level from the Content Browser. Head over to\
    \ the details panel and make sure its location is set to `x=0 y=0 z=0`. This will\
    \ make it easy to line up our other pieces.\n\n3.  Duplicate the floor five times.\
    \ This can be easily done by holding *ALT* and moving the object to create a copy.\
    \ Line them up in a 2x3 rectangle to create a good-sized room.\n\n4.  Next, let's\
    \ grab some walls. Drag a **Wall\\_400x300** into the level, on top of one of\
    \ your floor pieces: ![Using the Content Browser to start building the level](OEBPS/Images/BO5189_02_04.jpg)\n\
    \n    Sometimes we use the four window view to line up our static meshes\n\n5.\
    \  We are going to use the 4-viewport view to line up our wall section. In the\
    \ top-right corner of your viewport, there is a row of icons, that control several\
    \ different items such as grid snaps, angle snaps, scaling snaps, and camera speed.\
    \ All the way over to the right of those icons is a minimize/maximize button.\
    \ Click that to bring up your four viewports. Using two of those viewports, line\
    \ up your wall section with a corner of your floor.\n\n6.  Copy the wall section\
    \ and use the **Move** and **Rotate** tools to enclose the space.\n\n7.  Lastly,\
    \ enclose the space by taking floor pieces and using them as a roof to complete\
    \ the room."
  fmt: "\nAt this point, Unreal provides you with a few choices. The engine comes\
    \ with many free starter projects to get you started on a number of different\
    \ types of projects. For our projects, we will use the `First Person` starter\
    \ project. Make sure that the `Starter Content` button says `With Starter Content`\
    \ and give the project a unique name with no spaces. When you are all set, click\
    \ on `Create Project`, down in the bottom right. Unreal Engine 4 will load and\
    \ we will be all set to start our level.\n\n# Summary\n\nThroughout this chapter,\
    \ you took a look at the tools you will use to bring our level idea to life. Blender\
    \ is a freely available open source creation suite that supports the entire asset\
    \ development process. Created using the `Python` programming language, Blender\
    \ is flexible enough to run on almost any machine and is entirely cross-platform;\
    \ it runs in Windows, Mac, or Linux. Next, you took a look at the design process\
    \ you will use and how Blender and Unreal Engine 4 plug into it. Lastly, you set\
    \ up Unreal to begin our first project. As you move to the next chapter, you will\
    \ build your first level that will play host to your first original game asset.\
    \ Can you feel the excitement!?\n\n## Planning Your Level\n\nNow it's time for\
    \ the exciting stuff! As we move forward with building our first project, we are\
    \ going to use the design process we talked about in the last chapter and start\
    \ with a level sketch. You might be tempted to just open up Unreal and jump right\
    \ in, right? Why spend time drawing when I could be building that sweet level\
    \ I've always wanted? Well, here's why. The best way to avoid multiple revisions\
    \ and costly time spent redoing sections of your level is to plan in advance.\
    \ Figure out the setting, architecture, background, and story of your level. Put\
    \ some thought into where you will place story cues and power ups. Run your ideas\
    \ by friends, players, and team members. Incorporate the feedback you receive\
    \ and then build your level. It's the level designer's equivalent of \"measure\
    \ twice, cut once\".\n\n### Level Sketch\n\nLet's take a look at our level sketch:\n\
    \n![Starting Our First Project](OEBPS/Images/BO5189_02_01.jpg)\n\n#### Level Overview\n\
    \nSo here is our first level. The level itself is pretty basic. We have two rooms\
    \ connected by a hallway, with some stairs that lead up to a second tier. After\
    \ we finish the basic layout, we can add a cargo elevator off to the side and\
    \ working doors for the player to interact with. I have tried to lay out the level\
    \ in the form of a small cargo ship, to fit the theme of our science fiction horror\
    \ game. The level will function as an introduction to the setting, as well as\
    \ a way to transport the player to the haunted space station environment we will\
    \ be building later.\n\n### Chapter Topics\n\nIn this chapter, we will be covering\
    \ the following topics:\n\n*   Building the level using Unreal's `Content Browser`\n\
    *   Using different types of light\n*   Adding interactive elements using `Triggers`\
    \ and `Blueprints`\n*   Playtesting our level\n\n# Using the Content Browser to\
    \ Start Building the Level\n\nGo ahead and open `Epic Games Launcher`, and pull\
    \ up the project we started at the end of the last chapter. Unreal Engine 4 was\
    \ a huge upgrade over the last version of the engine, as it gave users a simple\
    \ drag-and-drop interface. This was accomplished using two important panes in\
    \ the interface: the `Modes` pane and the `Content Browser`. These portions of\
    \ the interface allow level designers to drag elements into the level and place\
    \ them where they need to go. Of these two, we will use the `Content Browser`\
    \ the most:\n\n![Using the Content Browser to start building the level](OEBPS/Images/BO5189_02_02.jpg)\n\
    \nThe `Content Browser` contains all of the game assets we will use.\n\nThe `Content\
    \ Browser` holds all of the objects, sounds, materials, and particles that can\
    \ be used in your creation. These are sorted into folders that mirror the file\
    \ structure where your project is stored. Unreal does this to make it easy to\
    \ move project files around, should the need arise. Navigating the browser is\
    \ easy. Double-clicking a folder opens that folder, while the top portion of the\
    \ panel displays a breadcrumb trail that can be clicked on to move back through\
    \ your selections. I like to ensure that the sources panel is on as well; this\
    \ makes navigation and finding specific files easier. When we created our project,\
    \ we told Unreal to include the `Starter Content` folder. This folder includes\
    \ many basics for us to get started with, such as a variety of basic shapes, architecture\
    \ pieces, materials, and more. With these, we can start whiteboxing our design.\n\
    \nStart by creating the first room:\n\n![Using the Content Browser to start building\
    \ the level](OEBPS/Images/BO5189_02_03.jpg)\n\nThe first room of our project.\n\
    \n### Tip\n\nHint: Moving forward, we will begin building our level in Unreal.\
    \ This book assumes the reader has a basic understanding of using Unreal Engine\
    \ 4. If you are having issues following along, check out the `UnrealEngine` channel\
    \ on YouTube for some great introductory tutorials from Epic Games. It can be\
    \ found at <https://www.youtube.com/channel/UCBobmJyzsJ6Ll7UbfhI4iwQ/>.\n\nTo\
    \ start building our first room, we are going to take advantage of the assets\
    \ we have in the `Architecture` folder. Using its selection of floors, walls,\
    \ and doors, we are going to assemble the first room of our design:\n\n1.  First\
    \ let's start a new level in our project. Head up to the `File` menu, click it,\
    \ and select new level. Choose `Empty Level` in the dialog box that appears.\n\
    \n2.  The new level contains absolutely nothing. Perfect for our foray into space!\
    \ Drop in a `Floor_400x400` piece as a place to start. This is done by clicking\
    \ and dragging the piece into the level from the `Content Browser`. Head over\
    \ to the details panel and make sure its location is set to `x=0 y=0 z=0`. This\
    \ will make it easy to line up our other pieces.\n\n3.  Duplicate the floor five\
    \ times. This can be easily done by holding `ALT` and moving the object to create\
    \ a copy. Line them up in a 2x3 rectangle to create a good-sized room.\n\n4. \
    \ Next, let's grab some walls. Drag a `Wall_400x300` into the level, on top of\
    \ one of your floor pieces:\n\n    ![Using the Content Browser to start building\
    \ the level](OEBPS/Images/BO5189_02_04.jpg)\n\n    Sometimes we use the four window\
    \ view to line up our static meshes.\n\n5.  We are going to use the 4-viewport\
    \ view to line up our wall section. In the top-right corner of your viewport,\
    \ there is a row of icons that control several different items such as grid snaps,\
    \ angle snaps, scaling snaps, and camera speed. All the way over to the right\
    \ of those icons is a minimize/maximize button. Click that to bring up your four\
    \ viewports. Using two of those viewports, line up your wall section with a corner\
    \ of your floor.\n\n6.  Copy the wall section and use the `Move` and `Rotate`\
    \ tools to enclose the space.\n\n7.  Lastly, enclose the space by taking floor\
    \ pieces and using them as a roof to complete the room.\n"
  trans: "\n此时，Unreal 为您提供了几个选择。引擎附带许多免费的入门项目，帮助您开始多种不同类型的项目。对于我们的项目，我们将使用 `First\
    \ Person` 入门项目。确保 `Starter Content` 按钮显示为 `With Starter Content`，并为项目指定一个不含空格的唯一名称。准备就绪后，点击右下角的\
    \ `Create Project`。Unreal Engine 4 将加载，然后我们就可以开始制作关卡了。\n\n# 总结\n\n本章中，您了解了将用于实现关卡构想的工具。Blender\
    \ 是一款免费开源的创作套件，支持整个资产开发流程。Blender 使用 `Python` 编程语言创建，灵活性足以在几乎任何机器上运行，且完全跨平台；可在\
    \ Windows、Mac 或 Linux 上运行。接着，您了解了将使用的设计流程，以及 Blender 和 Unreal Engine 4 如何融入其中。最后，您设置了\
    \ Unreal 以开始我们的第一个项目。进入下一章时，您将构建第一个关卡，它将容纳您的第一个原创游戏资产。您能感受到兴奋吗!?\n\n## 规划您的关卡\n\
    \n现在到了令人兴奋的环节！在推进第一个项目的构建过程中，我们将使用上一章讨论的设计流程，从关卡草图开始。您可能会忍不住直接打开 Unreal 就开始干，对吧？既然我能构建梦寐以求的精彩关卡，为什么要花时间画图呢？好吧，理由如下。避免多次修改和在重做关卡部分上浪费昂贵时间的最佳方法是提前规划。确定关卡的设定、建筑、背景和故事。考虑一下在哪里放置故事线索和道具。让朋友、玩家和团队成员过目您的想法。融合收到的反馈，然后构建关卡。这相当于关卡设计师的“三思而后行”（原谚语为“量两次，切一次”）。\n\
    \n### 关卡草图\n\n让我们看看我们的关卡草图：\n\n![开始我们的第一个项目](img/BO5189_02_01.jpg)\n\n#### 关卡概览\n\
    \n这就是我们的第一个关卡。关卡本身相当基础。我们有两个由走廊连接的房间，还有一些通往二层的楼梯。完成基本布局后，我们可以在一侧添加一个货梯和供玩家互动的工作门。我尝试以小型货船的形式布局关卡，以契合我们科幻恐怖游戏的主题。该关卡将作为设定的介绍，也是将玩家带入我们稍后将构建的闹鬼空间站环境的一种方式。\n\
    \n### 本章主题\n\n本章将涵盖以下主题：\n\n*   使用 Unreal 的 `Content Browser` 构建关卡\n*   使用不同类型的光源\n\
    *   使用 `Triggers` 和 `Blueprints` 添加交互元素\n*   测试我们的关卡\n\n# 使用内容浏览器开始构建关卡\n\n请打开\
    \ `Epic Games Launcher`，并调出我们在上一章末尾创建的项目。Unreal Engine 4 相比引擎的上一版本是一次巨大的升级，因为它为用户提供了简单的拖放界面。这是通过界面中的两个重要面板实现的：`Modes`\
    \ 面板和 `Content Browser`。这些界面部分允许关卡设计师将元素拖入关卡并放置在需要的位置。在这两者中，我们将最多地使用 `Content\
    \ Browser`：\n\n![使用内容浏览器开始构建关卡](img/BO5189_02_02.jpg)\n\n`Content Browser` 包含我们将使用的所有游戏资产。\n\
    \n`Content Browser` 存放了创作中可用的所有对象、声音、材质和粒子。这些资源被分类到文件夹中，这些文件夹反映了项目存储位置的文件结构。Unreal\
    \ 这样做是为了在需要时方便移动项目文件。浏览器导航很简单。双击文件夹即可打开，而面板顶部显示的面包屑导航可以点击以返回之前的选择。我还喜欢开启来源面板；这使得导航和查找特定文件更容易。创建项目时，我们让\
    \ Unreal 包含 `Starter Content` 文件夹。该文件夹包含许多供我们入门的基础内容，例如各种基本形状、建筑部件、材质等。有了这些，我们可以开始对设计进行白盒搭建。\n\
    \n首先创建第一个房间：\n\n![使用内容浏览器开始构建关卡](img/BO5189_02_03.jpg)\n\n我们项目的第一个房间。\n\n### 提示\n\
    \n提示：接下来，我们将开始在 Unreal 中构建关卡。本书假设读者具备使用 Unreal Engine 4 的基本知识。如果您在跟随操作时遇到问题，请查看\
    \ YouTube 上的 `UnrealEngine` 频道，那里有来自 Epic Games 的一些很棒的入门教程。网址为 <https://www.youtube.com/channel/UCBobmJyzsJ6Ll7UbfhI4iwQ/>.\n\
    \n要开始构建第一个房间，我们将利用 `Architecture` 文件夹中的资产。利用其中的地板、墙壁和门，我们将组装设计中的第一个房间：\n\n1. \
    \ 首先，在我们的项目中创建一个新关卡。点击顶部的 `File` 菜单，选择新建关卡。在出现的对话框中选择 `Empty Level`。\n\n2.  新关卡什么都不包含。非常适合我们的太空之旅！放入一个\
    \ `Floor_400x400` 部件作为起点。这是通过从 `Content Browser` 点击拖拽部件到关卡中完成的。转到细节面板，确保其位置设置为\
    \ `x=0 y=0 z=0`。这将使对齐其他部件变得容易。\n\n3.  复制地板五次。按住 `ALT` 并移动对象即可轻松创建副本。将它们排成 2x3\
    \ 的矩形，形成一个大小合适的房间。\n\n4.  接下来，获取一些墙壁。将一个 `Wall_400x300` 拖入关卡，放在您的一个地板部件上方：\n\n\
    \    ![使用内容浏览器开始构建关卡](img/BO5189_02_04.jpg)\n\n    有时我们使用四窗口视图来对齐静态网格体。\n\n5.\
    \  我们将使用四视口视图来对齐墙壁部分。在视口的右上角，有一排图标控制着网格吸附、角度吸附、缩放吸附和相机速度等项目。那些图标的最右侧是一个最小化/最大化按钮。点击它以显示四个视口。利用其中两个视口，将墙壁部分与地板的一个角落对齐。\n\
    \n6.  复制墙壁部分，并使用 `Move` 和 `Rotate` 工具将空间封闭起来。\n\n7.  最后，拿取地板部件将其作为屋顶，封闭空间以完成房间。\n"
