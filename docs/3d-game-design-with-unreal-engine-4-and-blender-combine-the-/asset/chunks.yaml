  trans: "\n\n## 使用阻挡体积和 BSP 进行白盒搭建\n\n阻挡体积也可用作我们创建资产的碰撞网格体。例如，我们经常使用 `Architecture`\
    \ 文件夹中的柱子资产来代表柱子或类似的从地板到天花板的构件。通过使用箱状的阻挡体积，我们可以让创建的任何自定义资产占据相同的空间，同时能够创建真正自定义的形状，例如由触手组成的柱子。\n\
    \n在白盒搭建期间，我们可以使用的另一种技术是配合 `BSP` 使用减法刷子来创建自定义形状。`BSP` 是我们熟悉的东西。当我们将一个箱子 `BSP` 刷子放入关卡时，它会创建一个箱子。这默认使用加法刷子，并在我们的关卡中创建该形状。`细节`\
    \ 面板允许我们更改箱子的大致尺寸，但别无他法。\n\n减法刷子则完全相反：\n\n![为更好的资产创建而对关卡进行白盒搭建](img/BO5189_05_03.jpg)\n\
    \n*在细节面板中将刷子从加法更改为减法*\n\n减法刷子允许我们像使用饼干切割机一样使用刷子的形状来创建门洞、孔洞等。请记住，这仅适用于加法和减法 `BSP`\
    \ 刷子。你无法使用减法刷子在静态网格体上切割孔洞。\n\n### 使用减法 BSP 刷子创建窗户\n\n让我们为安检站创建一个窗户：\n\n1.  点击\
    \ `模式` 面板的 `BSP` 选项卡，将一个 `Box` 拖入关卡。在 `细节` 面板中，将 `X` 改为 `20`，`Y` 改为 `800`，以便覆盖两个墙体段的空间，将\
    \ `Z` 改为 `400` 以适应与墙体段相同的垂直空间。\n\n2.  将新刷子放入安检站我们想要窗户的那个墙体段位置。\n\n3.  从 `模式` 面板再拖入一个\
    \ `BSP` `Box`。对于这个刷子，我们将 `X` 设为 `30`，使其比墙体稍宽，`Y` 设为 `600`，`Z` 设为 `200`。\n\n4.\
    \  最后，将 `刷子类型` 从 `加法` 改为 `减法`：\n\n    ![为更好的资产创建而对关卡进行白盒搭建](img/BO5189_05_04.jpg)\n\
    \n    *使用减法刷子的最终结果。现在我们有了一个窗户！*\n\n5.  拖动这个刷子使其与墙体刷子相交。这应该会创建出我们想要的孔洞。请记住，如果你想复制这个刷子在关卡的其他地方使用，必须同时选中两个刷子才能获得正确的效果。\n\
    \n## 关卡设计原则\n\n在构建游戏关卡时，了解如何使用工具很重要，但这并不是优秀关卡设计师所需知道的唯一事情。游戏关卡与玩家进行沟通，告诉他们关于故事和背景设定的信息，同时也传达目标、选项和其他游戏信息。我曾听过一位在游戏行业构建关卡多年的设计师做的一个精彩演讲。他提到，玩家应该能够在关闭游戏\
    \ HUD 的情况下导航关卡，仅依赖他们在关卡设计中发现的线索。为了让玩家能够做到这一点，关卡必须构建得清晰高效，利用清晰的视线和景观将玩家引导至最终目标。自从听到这个观点后，我尝试将这些理念融入我创建的每一个关卡中。\n\
    \n让我们谈谈其中的一些要点：\n\n![关卡设计原则](img/BO5189_05_05.jpg)\n\n*我们空间站关卡的鸟瞰图*\n\n构建清晰高效的关卡听起来很棒，但这到底意味着什么？一个清晰的关卡没有干扰元素，也没有服务于故事、环境或关卡目标没有任何实际用途的额外区域。玩家可能会觉得这些区域令人困惑，并花费时间寻找它们的重要性，而实际上根本没有。在设计和构建关卡时，始终要问自己关卡的每个部分是否增加了玩家体验，还只是为了增加关卡复杂度而存在的干扰项。效率也很重要。游戏设计有许多约束：硬件约束（如内存和处理速度）、预算约束、时间约束和生产约束。作为设计师，最大化利用资源以创造尽可能引人入胜的玩家体验非常重要。对于我们这样的小型游戏开发者，这可能意味着高效地利用时间，并找到在不牺牲质量的前提下偷工减料的方法：\n\
    \n![关卡设计原则](img/BO5189_05_06.jpg)\n\n*俯瞰市场。我们能在窗外添加什么？*\n\n构建关卡时，还必须考虑玩家在导航每个区域时所看到的内容。玩家的视线为他们提供了在我们设计的空间中导航的选项，我们可以利用它们引导玩家走过我们预定的路径。这将确保玩家按照我们设计的方式体验一切。在我们的空间站设计中，我们限制了玩家在关卡推进过程中能看到的路径。当他们进入空间站时，只知道一条通往安检站的路径，在那里他们体验我们的脚本事件。随后，他们获得了一条视线，引导他们看到外部环境和空间站市场的美丽景观。\n\
    \n在这里，他们可以自由地探索所见的一切：\n\n![关卡设计原则](img/BO5189_05_07.jpg)\n\n*探索市场。一个供玩家游玩的绝佳空间！*\n\
    \n玩家还被展示了关卡的最终目标——中介商店冒着烟的废墟，随时准备供他们随心所欲地探索。总之，视线是一种强大的工具，可以控制玩家的进度，向他们提供选项，并赋予他们到达关卡目标的能力。\n\
    \n最后再提醒一次：当你进行白盒搭建时，请记得让家人、朋友和目标受众为你试玩。他们的见解很宝贵，能增加你的游戏成功的几率！\n\n## 高级脚本技术\n\n\
    随着关卡白盒搭建接近完成，是时候开始考虑那些脚本事件了。为关卡编写脚本事件可以极大地丰富任何关卡，可以简单到触发声音或粒子效果，也可以复杂到完全脚本化的过场动画或小游戏。虚幻引擎\
    \ 4 赋予我们使用灵活的 `Blueprint` 系统以可视化方式编程这些序列的能力。我们在 第 2 章 *开始我们的第一个项目* 中已经为简单的门和电梯使用过\
    \ `Blueprint`。现在我们将在此基础上设计和编程灵活的脚本事件。\n\n那么如何开始呢？设计脚本事件与我们之前构建的动画系统并无二致。每一个都始于一个事件，该事件导致几个不同的动作按顺序触发。诀窍在于能够理清逻辑顺序，以便获得玩家预期的效果。例如，普通的游戏爆炸包含几个不同的动作：\n\
    \n1.  等待目标对象受到伤害。\n2.  一旦伤害达到一定数值，创建伤害半径并触发烟雾、火花、火焰和爆炸粒子发射器。\n3.  播放爆炸声音！\n4.\
    \  利用飞散的粒子作为掩护删除原始对象。\n5.  在原位生成原始资产的损坏版本。\n\n正如这里描述的爆炸一样，任何事件都可以分解为具体的事件并进行模拟。那么让我们思考一下安检站事件需要什么。我们需要让玩家感到受到威胁，并传达一种恐慌感。我认为我们可以通过尝试几种不同的方法来实现这一点，它们组合在一起将产生预期的效果。以下是一些不分先后顺序的想法：\n\
    \n*   灯光闪烁\n*   房间充满烟雾\n*   火花！\n*   某种巨大的噪音\n*   猛然关上门\n*   猛然关上窗\n*   着火！\n\n\
    ### 提示\n\n"
