    ## Programming the button that triggers the level transition


    2. Open up the **Level** **Blueprint** and find an area to start our sequence.
    Click on the new **Box Trigger** in the level and create an **OnActorBeginOverlap**
    event and an **OnActorEndOverlap** event. Also use the **Find a Node** tool in
    the **Palette** pane to grab an input **E** event: ![Win conditions](`OEBPS/Images/BO5189_05_25.jpg`)


    3. By now, this sequence should be familiar to you. Connect the events we just
    created to a **Gate** node to create an event that only works when you are within
    the trigger area.


    4. Lastly, add the **Open Level** node. This can be found using the **Find a Node**
    search box. This node will transport the player to our new space station level.
    In the **Level Name** field, type in the name of the space station level. Make
    sure the name you enter is correct or the node will not work.


    Now playtest the cargo ship and investigate the unusual readings coming from the
    crate. This should take you to the start of the space station level. If this were
    a completed game, we might have a loading screen or some audio explaining the
    story as we go. Keep ideas like this in mind! There is always time for polish
    and improvements later.


    Does everything feel like it''s starting to come together?


    # Summary


    In this chapter, we began the process of whiteboxing a much larger level than
    our previous one, a mysterious space station that may hold clues as to why the
    crew of the cargo ship disappeared. During the prototype phase, we also created
    two scripted events. The first one takes place at the security checkpoint coming
    in from the docking bay and is designed to create tension and increase the feeling
    that something is wrong on the station. The second one is a malfunctioning elevator
    that tells the player that something must have happened and certain death could
    be lurking right around the corner. But what does the player find in the back
    of the import/export broker''s shop? In the next chapter, we will head back to
    Blender to design an answer to that question and create a new mysterious and complex
    game asset for our level.


    The mystery continues! At this point, the player has made it back to the import/export
    broker''s shop in the Marketplace section of our space station, but what do they
    see? We could go a few different ways here, such as an interdimensional portal,
    advanced military hardware, or even something mystical. One of my favorite authors
    has always been *H.P. Lovecraft*, a horror fiction writer from the early 1900s.
    His short stories often revolved around themes of forbidden knowledge, cults,
    hidden secrets, and madness-inducing horrors, and he often talked about Elder
    Gods from beyond the stars. What if our intrepid hero stumbled upon an Artifact
    from another world with ties to just such a nameless star god that devours sanity?
    Surely, an importer on a busy space station could make a fortune selling such
    a thing to a collector. Why would he care about the stories of madness attached
    to it? That would only add to the allure of the purchase. In this chapter, we
    will cover the following topics:


    *   Designing our asset: inspiration and concept art

    *   Advanced tools: Subdivide, Knife, Bridge Edge Loops, and more

    *   Using multiple shapes within Blender

    *   The importance of keeping track of polygon and triangle counts


    # Designing our asset – inspiration and concept art


    As I mentioned earlier, from *H.P. Lovecraft* short stories, particularly those
    of the popular Cthulhu Mythos, are some of my favorite weird tales. In these stories,
    intrepid investigators come into contact with objects and creatures born of madness,
    along with the servants of dark and terrible gods. Using this idea as inspiration,
    we once again turn to Google Images in search of more inspirational writings and
    images. A quick search provides interesting ideas. The Elder Gods are often depicted
    in art as otherworldly. Tentacles, screaming mouths, multiple eyes, uneven physiques,
    and more, are depicted, mixed with more human elements. So how might we take these
    ideas and incorporate them into a design for a game asset that will not look out
    of place on a space station in the far future?


    Time to sketch our concept:


    ![Designing our asset – inspiration and concept art](`OEBPS/Images/B05189_06_33.jpg`)


    Sketch of the Artifact


    My initial thoughts were to create some type of container, like a Pandora''s Box,
    that when opened unleashes a sinister power that feeds on everyone around it.
    Instead of being a square, like a crate or box, I decided to create a container
    that was more egg-shaped. It would immediately stand out in the environment and
    draw the player to it. The Artifact should be able to be opened so that the player
    may accidentally unleash whatever is inside. The design incorporates some steampunk
    elements in its opening mechanism as a nod to the time period in which many of
    *H.P. Lovecraft''s* written stories take place. Finally, there are also deep sea
    elements such as tentacle handles, a spiked crab shell exterior, and an all-seeing
    eye. This should definitely get the player''s attention!


    For this asset, we have to give some thought to how the object opens, as we will
    be animating these elements in Blender. In this design, the round elements turn
    and retract the pistons that hold the lid, allowing for the top to twist open.
    Each of these moving parts will be created, starting with a different base shape.


    To make sure that it fits in the space we have inside the level, we will create
    the asset close to the size of the existing test asset that we used:


    ![Designing our asset – inspiration and concept art](`OEBPS/Images/BO5189_06_01.jpg`)


    The test asset has a radius of 60 and a height of 60


    ## Advanced tools: Subdivide, Knife, Bridge Edge Loops, and more


    As we build this new asset, there are a few new tools that we need to be aware
    of that will allow us to increase the level of detail on the Artifact.


    Now let''s take a look at some new tools we will be using.


    ## Subdivide tool


    The **Subdivide** tool is a great tool that can be used to add more connecting
    lines and polygons to a section of a model to add detail. Use this tool by selecting
    the lines or polygons you wish to subdivide and clicking the **Subdivide** tool
    in the **Tools** pane. The number of connections may be adjusted by changing the
    **Number of Cuts** field in the lower-left corner of the screen:


    ![Subdivide tool](`OEBPS/Images/BO5189_06_02.jpg`)


    Using the Subdivide tool


    ## Knife tool


    The **Knife** tool can be used to make freehand cuts into the geometry of an object
    and is great for creating additional artistic detail on small parts of your model.
    To get started, click the **Knife** tool in the **Tools** pane, or press *K*.
    The cursor will change to a small knife. Click once to start the cut and then
    click each time you would like to add a point to the line. Hovering the mouse
    over an existing vertex will turn the cursor green and allow you to connect your
    new lines with the existing geometry. Press the *Spacebar* to finalize your cut,
    or *E* to start a new one:


    ![Knife tool](`OEBPS/Images/BO5189_06_03.jpg`)


    The Knife tool is great for adding detail


    ## Bridge Edge Loops tool


    The **Bridge Edge Loops** tool is an essential tool for creating new polygons
    by connecting two or more edges together. We will use it often after deleting
    old polygons to restructure the geometry into a more functional shape. Use it
    by selecting your lines in the **Line** selection mode, pressing *W* to open the
    **Specials** menu, and selecting **Bridge Edge Loops**:


    ![Bridge Edge Loops tool](`OEBPS/Images/BO5189_06_04.jpg`)


    Bridge Edge Loops is great for filling in a hole in a shape


    ## Triangulate modifier tool

    '
