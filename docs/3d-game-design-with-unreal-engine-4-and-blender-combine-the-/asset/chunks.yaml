    \ to the security room malfunction and explode, allowing the player to reach the\
    \ security override button! I have placed a couple of **Point Lights** above the\
    \ door, one red and one green, that can indicate the door is opening (turn off\
    \ the **Visible** property for the red light in the **Details** panel) and have\
    \ built the override button using a Box Trigger and a **SM\\_MatPreviewMesh\\\
    _02** from the **Props** folder of the **Content Browser**. To make sure that\
    \ clue is clear to the player I have placed a **Text Render** object above the\
    \ button reading \"*Disengage Security Lockdown*\".\n\nWith all the pieces in\
    \ place we are ready to script our event. Open the **Level Blueprint** by pressing\
    \ the **Blueprints** button above the viewport and selecting **Open Level Blueprint**.\
    \ For this level of scripting, we are also going to go up to the **Window** button\
    \ in the toolbar and turn on the **Palette** window. This gives us access to a\
    \ customizable **Favorites** list of nodes and the **Find a Node** search box,\
    \ a great tool when constructing new Blueprint sequences:\n\n![Advanced scripting\
    \ techniques](OEBPS/Images/BO5189_05_12.jpg)\n\nBeginning the Level Blueprint\n\
    \n1.  Select both of the default nodes located in the Blueprint area and press\
    \ *Delete*. We won't need them for this sequence.\n\n2.  We need an event to start\
    \ our sequence off. Back in the level, place a **Box Trigger** in the security\
    \ checkpoint, about halfway down the hallway. Set its **Box Extents** property\
    \ to be large enough to make missing it impossible. This will make the player\
    \ trigger the security lockdown after they have completely entered the hallway.\
    \ Inside the **Level Blueprint**, *Right-click* and select **Add Event for Trigger\
    \ Box**, select **Collision**, and then select **Add OnActorBeginOverlap**. Remember\
    \ that your trigger box number may vary from mine: ![Advanced scripting techniques](OEBPS/Images/BO5189_05_13.jpg)\n\
    \n    The complete Blueprint for swapping our colored lights\n\n3.  Now, we need\
    \ to change the warning light color. For this we are going to add a couple different\
    \ nodes. In the search box of the **Find a Node** section of the **Palette** pane,\
    \ type in `Do Once`. This node works like a gate and ensures that anything after\
    \ it only runs once. Here, we use it to make sure that the trigger we use to start\
    \ the sequence cannot be set off more than once. Next, search for the **Toggle\
    \ Visibility** node. Drag two of them into the Blueprint and connect them as shown.\
    \ The targets for these nodes will be our red and green lights. We want to make\
    \ sure we are showing the light we want and hiding the light we don't want: ![Advanced\
    \ scripting techniques](OEBPS/Images/BO5189_05_14.jpg)\n\n    Gathering our initial\
    \ locations on our doors and windows\n\n4.  Time to slam the doors and windows\
    \ shut! This part looks a bit complicated but is actually just like something\
    \ we did in [Chapter 2](#ch02.xhtml \"Chapter 2. Starting Our First Project\"\
    ), *Starting Our First Project*. We are going to use a **Timeline** to shut all\
    \ of the security doors we created at the same time. The first thing we need to\
    \ do is save the initial locations of all the things we are going to animate.\
    \ Without this step, the doors and windows would slam down then keep going right\
    \ through the floor! To stop that from happening, we animate the door's position\
    \ from its initial position. First, create some vector variables to hold the data\
    \ for the three security doors and two windows. Next, we will build a special\
    \ sequence to handle collecting that data. Start with an **Event BeginPlay** event\
    \ and connect it to a **Set** node for each variable. Then connect a **Get Actor\
    \ Location** node to each **Set**, with each door and window as a target. This\
    \ will get the location of each piece and then set it as the variable so that\
    \ we can animate it in the next step: ![Advanced scripting techniques](OEBPS/Images/BO5189_05_15.jpg)\n\
    \n    The timeline that slides our doors and windows shut\n\n5.  Now add the **Timeline**\
    \ node and double click it to open it up. We want to slide our doors and window\
    \ shutters down into place using a **Vector Track**. Remember that in a **Vector\
    \ Track**, we can animate all three axes of movement, but we only want to use\
    \ the *Z* axis here, so it will take a bit of sorting. Hold the *Shift* key and\
    \ click on the red line. This will add a keyframe to the *X*\\-axis. Now click\
    \ on the new keyframe and drag it out of the way. Now do the same on the green\
    \ line and drag the *Y*\\-axis out of the way. This leaves us with the blue line,\
    \ the z axis. Create a keyframe there and make sure its time and value are both\
    \ set to `0`. Add a second keyframe and set the time to something fast. I used\
    \ `0.25`. Set the value to `-210`. This will slide them down into place, blocking\
    \ our player's escape. After creating your keyframes for the *Z*\\-axis, feel\
    \ free to delete the keyframes on the other two axes by clicking them and pressing\
    \ the *Delete* key. You can also lock and hide these axes by using the buttons\
    \ located in the upper left portion of the graph. Be sure to select the **Last\
    \ Keyframe** checkbox as well. This tells the **Timeline** to stop at the last\
    \ keyframe in the sequence: ![Advanced scripting techniques](OEBPS/Images/BO5189_05_16.jpg)"
  fmt: '

    # Advanced Scripting Techniques


    ## Brainstorming and Planning


    Brainstorming using sticky notes is a great way to come up with ideas like this
    very quickly. The sticky notes make the ideas movable so that you can easily organize
    them into any order you choose.


    Now there''s a few great ideas! The next step is to arrange them into a logical
    order that can be programmed. Computers can''t do anything we haven''t specifically
    spelled out for them, so we have to be pretty clear about our instructions. Here
    is just one example of how I might order the instructions:


    1.  Animate the doors and windows closed.

    2.  Some kind of loud noise.

    3.  Fire the smoke emitter.

    4.  Fire the spark emitter.

    5.  Play some clue to the player to let them know what to do to get out.


    Seems like a pretty solid plan. The next step would be to add those additional
    elements to our level. Each entrance to the security checkpoint hallway needs
    a door, each window needs a shutter, and so on.


    ## Building Doors and Shutters


    ### Building the First Security Door


    ![Advanced scripting techniques](OEBPS/Images/BO5189_05_08.jpg)


    1.  For the three security doors that slam down, I grabbed a `Wall_400x200` piece
    from the `Architecture` folder and adjusted the `Scale` of the `X` to `0.4` and
    the `Z` to `1.1`. I then changed the name for each to `Sec_Door1`, `Sec_Door2`,
    and `Sec_Door3`. Remember to also set the `Mobility` property to `Movable`.

    2.  I positioned each door above each door frame so that it can slam down during
    the event:


    ![Building the security shutters](OEBPS/Images/BO5189_05_09.jpg)


    ### Building the Security Shutters


    3.  For the two security window shutters, I used a `Wall_400x400` piece and adjusted
    the `Scale` property of the `x` to `1.5` and the `z` to `0.5`. I changed their
    names to `Sec_Win_Shutter1` and `Sec_Win_Shutter2` to make them easy to identify
    and set their `Mobility` to `Movable`.


    ## Adding Details


    ### Placing Particle Emitters


    ![Placing the particle emitters](OEBPS/Images/BO5189_05_10.jpg)


    1.  Particle emitters are points in space that emit light, sparks, or even static
    meshes if we want them to. They are created using Unreal''s Cascade Particle Editor,
    though the `Starter Content` folder has some great ones we can use in the `Particles`
    sub-folder. Here I used a `P_Smoke` emitter at each door and one `P_Sparks` emitter
    near the window on the left. For all of them, I turned off the `Auto Activate`
    option in the `Details` panel to give us control of when they fire.


    A trap like this is great, but we still need some way for the player to escape:


    ![A view of the security office](OEBPS/Images/BO5189_05_11.jpg)


    ### Creating the Escape Route


    2.  After a couple seconds, let''s have the door to the security room malfunction
    and explode, allowing the player to reach the security override button! I have
    placed a couple of `Point Lights` above the door, one red and one green, that
    can indicate the door is opening (turn off the `Visible` property for the red
    light in the `Details` panel) and have built the override button using a `Box
    Trigger` and a `SM_MatPreviewMesh_02` from the `Props` folder of the `Content
    Browser`. To make sure that clue is clear to the player I have placed a `Text
    Render` object above the button reading `Disengage Security Lockdown`.


    ## Scripting the Event in the Level Blueprint


    With all the pieces in place we are ready to script our event. Open the `Level
    Blueprint` by pressing the `Blueprints` button above the viewport and selecting
    `Open Level Blueprint`. For this level of scripting, we are also going to go up
    to the `Window` button in the toolbar and turn on the `Palette` window. This gives
    us access to a customizable `Favorites` list of nodes and the `Find a Node` search
    box, a great tool when constructing new Blueprint sequences:


    ![Beginning the Level Blueprint](OEBPS/Images/BO5189_05_12.jpg)


    ### Beginning the Level Blueprint


    1.  Select both of the default nodes located in the Blueprint area and press `Delete`.
    We won''t need them for this sequence.


    ### Setting Up the Trigger Event


    2.  We need an event to start our sequence off. Back in the level, place a `Box
    Trigger` in the security checkpoint, about halfway down the hallway. Set its `Box
    Extents` property to be large enough to make missing it impossible. This will
    make the player trigger the security lockdown after they have completely entered
    the hallway. Inside the `Level Blueprint`, `Right-click` and select `Add Event
    for Trigger Box`, select `Collision`, and then select `Add OnActorBeginOverlap`.
    Remember that your trigger box number may vary from mine:


    ![The complete Blueprint for swapping our colored lights](OEBPS/Images/BO5189_05_13.jpg)


    ### Swapping Warning Lights


    3.  Now, we need to change the warning light color. For this we are going to add
    a couple different nodes. In the search box of the `Find a Node` section of the
    `Palette` pane, type in `Do Once`. This node works like a gate and ensures that
    anything after it only runs once. Here, we use it to make sure that the trigger
    we use to start the sequence cannot be set off more than once. Next, search for
    the `Toggle Visibility` node. Drag two of them into the Blueprint and connect
    them as shown. The targets for these nodes will be our red and green lights. We
    want to make sure we are showing the light we want and hiding the light we don''t
    want:


    ![Gathering our initial locations on our doors and windows](OEBPS/Images/BO5189_05_14.jpg)


    ### Gathering Initial Locations


    4.  Time to slam the doors and windows shut! This part looks a bit complicated
    but is actually just like something we did in [Chapter 2](#ch02.xhtml "Chapter
    2. Starting Our First Project"), *Starting Our First Project*. We are going to
    use a `Timeline` to shut all of the security doors we created at the same time.
    The first thing we need to do is save the initial locations of all the things
    we are going to animate. Without this step, the doors and windows would slam down
    then keep going right through the floor! To stop that from happening, we animate
    the door''s position from its initial position. First, create some vector variables
    to hold the data for the three security doors and two windows. Next, we will build
    a special sequence to handle collecting that data. Start with an `Event BeginPlay`
    event and connect it to a `Set` node for each variable. Then connect a `Get Actor
    Location` node to each `Set`, with each door and window as a target. This will
    get the location of each piece and then set it as the variable so that we can
    animate it in the next step:


    ![The timeline that slides our doors and windows shut](OEBPS/Images/BO5189_05_15.jpg)


    ### Animating Doors and Windows with a Timeline


    5.  Now add the `Timeline` node and double click it to open it up. We want to
    slide our doors and window shutters down into place using a `Vector Track`. Remember
    that in a `Vector Track`, we can animate all three axes of movement, but we only
    want to use the `Z` axis here, so it will take a bit of sorting. Hold the `Shift`
    key and click on the red line. This will add a keyframe to the `X`-axis. Now click
    on the new keyframe and drag it out of the way. Now do the same on the green line
    and drag the `Y`-axis out of the way. This leaves us with the blue line, the `Z`
    axis. Create a keyframe there and make sure its time and value are both set to
    `0`. Add a second keyframe and set the time to something fast. I used `0.25`.
    Set the value to `-210`. This will slide them down into place, blocking our player''s
    escape. After creating your keyframes for the `Z`-axis, feel free to delete the
    keyframes on the other two axes by clicking them and pressing the `Delete` key.
    You can also lock and hide these axes by using the buttons located in the upper
    left portion of the graph. Be sure to select the `Last Keyframe` checkbox as well.
    This tells the `Timeline` to stop at the last keyframe in the sequence.

    '
  trans: '


    # 高级脚本技巧


    ## 头脑风暴与规划


    使用便利贴进行头脑风暴是快速产生此类想法的绝佳方法。便利贴让想法变得可移动，以便您可以轻松地将它们按您选择的任何顺序进行组织。


    现在有了几个很棒的想法！下一步是将它们按可编程的逻辑顺序排列。计算机无法执行我们未明确指示的任何操作，因此我们的指令必须非常清晰。以下只是我可能对指令进行排序的一个示例：


    1.  为门窗添加关闭动画。

    2.  发出某种巨大的噪音。

    3.  触发烟雾发射器。

    4.  触发火花发射器。

    5.  给玩家播放某种线索，让他们知道该怎么做才能逃脱。


    这看起来是个相当可靠的计划。下一步将是向我们的关卡添加那些额外元素。安检走廊的每个入口都需要一扇门，每扇窗户都需要一个百叶窗，依此类推。


    ## 构建门与百叶窗


    ### 构建第一扇安检门


    ![高级脚本技巧](img/BO5189_05_08.jpg)


    1.  对于那三扇猛然落下的安检门，我从 `Architecture`（建筑）文件夹中获取了一个 `Wall_400x200` 部件，并将 `X` 轴的 `Scale`（缩放）调整为
    `0.4`，`Z` 轴调整为 `1.1`。然后我将它们分别重命名为 `Sec_Door1`、`Sec_Door2` 和 `Sec_Door3`。请记住也要将
    `Mobility`（移动性）属性设置为 `Movable`（可移动）。

    2.  我将每扇门定位在各自的门框上方，以便在事件期间能够猛然落下：


    ![构建安检百叶窗](img/BO5189_05_09.jpg)


    ### 构建安检百叶窗


    3.  对于那两个安检窗百叶窗，我使用了一个 `Wall_400x400` 部件，并将 `x` 轴的 `Scale` 属性调整为 `1.5`，`z` 轴调整为
    `0.5`。我将它们的名称改为 `Sec_Win_Shutter1` 和 `Sec_Win_Shutter2` 以便于识别，并将它们的 `Mobility`
    设置为 `Movable`。


    ## 添加细节


    ### 放置粒子发射器


    ![放置粒子发射器](img/BO5189_05_10.jpg)


    1.  粒子发射器是空间中发出光线、火花，甚至是静态网格体（如果我们愿意）的点。它们是使用 Unreal 的 Cascade 粒子编辑器创建的，尽管 `Starter
    Content`（初始内容）文件夹中的 `Particles`（粒子）子文件夹里有一些很棒的现成发射器可供我们使用。在这里，我在每扇门处使用了一个 `P_Smoke`
    发射器，在左侧窗户附近使用了一个 `P_Sparks` 发射器。对于所有发射器，我在 `Details`（细节）面板中关闭了 `Auto Activate`（自动激活）选项，以便我们能控制它们何时触发。


    这样的陷阱很棒，但我们仍然需要一些方法让玩家逃脱：


    ![安检办公室视图](img/BO5189_05_11.jpg)


    ### 创建逃生路线


    2.  过几秒钟后，让安检室的门发生故障并爆炸，让玩家能够到达安检覆盖按钮！我在门上方放置了几个 `Point Lights`（点光源），一个红色，一个绿色，用来指示门正在打开（在
    `Details` 面板中关闭红光的 `Visible`（可见）属性），并使用 `Content Browser`（内容浏览器）`Props`（道具）文件夹中的
    `Box Trigger`（盒子触发器）和 `SM_MatPreviewMesh_02` 构建了覆盖按钮。为了确保线索对玩家清晰明了，我在按钮上方放置了一个
    `Text Render`（文本渲染）对象，显示 `Disengage Security Lockdown`（解除安检封锁）。


    ## 在关卡蓝图中编写事件脚本


    所有部件就位后，我们准备开始编写事件脚本。点击视口上方的 `Blueprints`（蓝图）按钮并选择 `Open Level Blueprint`（打开关卡蓝图）来打开
    `Level Blueprint`。对于这种程度的脚本编写，我们还将转到工具栏中的 `Window`（窗口）按钮并开启 `Palette`（调色板）窗口。这使我们能够访问可自定义的节点
    `Favorites`（收藏夹）列表和 `Find a Node`（查找节点）搜索框，这是构建新蓝图序列时的绝佳工具：


    ![开始关卡蓝图](img/BO5189_05_12.jpg)


    ### 开始关卡蓝图


    1.  选择蓝图区域中位于的两个默认节点并按 `Delete`（删除）。此序列不需要它们。


    ### 设置触发事件


    2.  我们需要一个事件来启动我们的序列。回到关卡中，在安检处放置一个 `Box Trigger`，大约在走廊的中间位置。将其 `Box Extents`（盒子范围）属性设置得足够大，以至于玩家无法错过。这将使玩家在完全进入走廊后触发安检封锁。在
    `Level Blueprint` 内部，`Right-click`（右键点击）并选择 `Add Event for Trigger Box`（为触发盒添加事件），选择
    `Collision`（碰撞），然后选择 `Add OnActorBeginOverlap`（添加 OnActorBeginOverlap）。请记住，您的触发盒编号可能与我的不同：


    ![用于交换彩灯的完整蓝图](img/BO5189_05_13.jpg)


    ### 切换警示灯


    3.  现在，我们需要改变警示灯的颜色。为此，我们将添加几个不同的节点。在 `Palette`（调色板）窗格的 `Find a Node` 部分的搜索框中，输入
    `Do Once`（执行一次）。此节点的工作原理类似于一个闸门，确保其后的内容仅运行一次。在这里，我们用它来确保用于启动序列的触发器不会被触发多次。接下来，搜索
    `Toggle Visibility`（切换可见性）节点。将两个该节点拖入蓝图并按图所示连接。这些节点的目标将是我们的红灯和绿灯。我们要确保显示我们想要的灯并隐藏不想要的灯：


    ![收集门窗的初始位置](img/BO5189_05_14.jpg)


    ### 收集初始位置


    4.  是时候让门窗猛然关闭了！这部分看起来有点复杂，但实际上就像我们在 第 2 章 *启动我们的第一个项目* 中所做的那样。我们将使用 `Timeline`（时间轴）同时关闭我们创建的所有安检门。首先我们需要做的是保存所有要制作动画的物体的初始位置。没有这一步，门窗会猛然落下，然后继续穿过地板！为了防止这种情况发生，我们从门的初始位置制作其位置动画。首先，创建一些向量变量来保存三扇安检门和两扇窗户的数据。接下来，我们将构建一个特殊的序列来处理收集这些数据。从
    `Event BeginPlay`（BeginPlay 事件）事件开始，并将其连接到每个变量的 `Set`（设置）节点。然后将 `Get Actor Location`（获取演员位置）节点连接到每个
    `Set` 节点，每个门和窗作为目标。这将获取每个部件的位置，然后将其设置为变量，以便我们在下一步中为其制作动画：


    ![用于关闭门窗的时间轴](img/BO5189_05_15.jpg)


    ### 使用时间轴为门窗制作动画


    5.  现在添加 `Timeline` 节点并双击打开它。我们想要使用 `Vector Track`（向量轨道）将门和窗百叶窗滑落到位。请记住，在 `Vector
    Track` 中，我们可以为所有三个移动轴制作动画，但这里我们只想使用 `Z` 轴，因此需要一些整理。按住 `Shift` 键并点击红线。这将在 `X` 轴上添加一个关键帧。现在点击新关键帧并将其拖出视野。对绿线做同样的操作，将
    `Y` 轴拖出视野。这留给我们蓝线，即 `Z` 轴。在那里创建一个关键帧，并确保其时间和值均设置为 `0`。添加第二个关键帧并将时间设置为一个快速的值。我用了
    `0.25`。将值设置为 `-210`。这将把它们滑落到位，阻挡玩家的逃生路线。在为 `Z` 轴创建关键帧后，您可以随意通过点击其他两个轴上的关键帧并按 `Delete`
    键来删除它们。您也可以使用图表左上部分的按钮来锁定和隐藏这些轴。请务必勾选 `Last Keyframe`（最后一帧）复选框。这会告诉 `Timeline`
    在序列的最后一个关键帧处停止。


    '
