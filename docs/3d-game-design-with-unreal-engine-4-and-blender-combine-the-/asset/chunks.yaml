    \n    Scripting the elevator sequence. Connect the nodes in this order: On Overlap,\
    \ Timeline, Set Actor Location, Activate, Do Once, Play Sound at Location\n\n\
    2.  The event that kicks this one off is an **OnActorBeginOverlap**, using the\
