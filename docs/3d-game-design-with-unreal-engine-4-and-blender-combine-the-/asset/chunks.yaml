    \ from Blender](#ch04.xhtml \"Exporting our object from Blender\")\n\n    *  \
    \ multiple shapes, using within / [Using multiple shapes within Blender](#ch06s03.xhtml\
    \ \"Using multiple shapes within Blender\")\n\n    *   animation, handling / [How\
    \ does Blender handle animation?](#ch08.xhtml \"How does Blender handle animation?\"\
    )\n\n    *   suite of animation tools, using / [Using Blender's suite of animation\
    \ tools](#ch08s03.xhtml \"Using Blender's suite of animation tools\")\n\n*   blocking\
