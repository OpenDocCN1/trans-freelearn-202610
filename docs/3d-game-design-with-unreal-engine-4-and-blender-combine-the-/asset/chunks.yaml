    \ two separate Class Blueprints for the top and bottom pieces of the Artefact.\
    \ We will use them as shrapnel in the explosion.\n\nThe last piece necessary to\
    \ really make this explosion great is to add flying chunks! When a solid object\
    \ explodes, parts of it tend to go flying in all directions. We will simulate\
    \ this by having our Blueprints spawn versions of the bottom and the top of the\
    \ Artifact, with physics enabled, which will fly around and stay in the level\
    \ after the rest of the Artifact has been destroyed:\n\n1. This will require us\
    \ to head back to `Blender` and export versions of our `Top` and `Bottom` as separate\
    \ FBX files. Open our `Blender` file and select the `Top` of the Artifact. Head\
    \ up to the `File` menu and head to the `FBX Export` screen. Turn on the `Selected\
    \ Objects` option so that only the `Top` is exported. Also, head to the `Geometries`\
    \ tab and change the `Smoothing` option to `Face`. Name it something unique and\
    \ export! Rinse and repeat for our `Bottom` piece and prepare to import them into\
    \ Unreal.\n\n2. Import both of our new FBX files into Unreal as static meshes,\
    \ and apply our artifact material to them. You will notice that even though we\
    \ did not import the whole model, our material still works perfectly. This is\
    \ because the UV maps for each piece are still the same, whether we use the whole\
    \ Artifact or only parts.\n\n3. Time to create two new class Blueprints. Create\
    \ a class `Blueprint` for each new static mesh by clicking the `Blueprint` button,\
    \ selecting `New Empty Blueprint Class`, and selecting `Actor` as the `Parent\
    \ Class`. I named mine `ArtifactTopChunk` and `ArtifactBotChunk`.\n\n4. In each\
    \ Blueprint, add the appropriate static mesh as a component. Just add it in; there\
    \ is no need to move it. This way, they will be in the exact position we need\
    \ them to be when we use our Blueprint to spawn them.\n\n5. Now we need to make\
    \ a couple of changes to their `Details`. ![Using particle effects](OEBPS/Images/B05189_09_18.jpg)\n\
    \n   Apply physics to our flying pieces.\n\n6. For each of our new Blueprints,\
    \ click the component and find the `Physics` section in the `Details` panel. First,\
    \ turn on `Simulate Physics`. This will allow our objects to bounce around and\
    \ be affected by gravity and outside forces. Next, turn on `Mass in Kg`. Normally,\
    \ Unreal will calculate a physics object's mass, based on its size in the level.\
    \ Both of our pieces come in at around 500 kg, not very good for being flying\
    \ shrapnel. Turning on `Mass in Kg` allows us to override Unreal's best guess\
    \ and fill in whatever value we wish for its weight. I used `50` kg, but feel\
    \ free to use whatever you wish. It can always be adjusted later. Be sure to do\
    \ this for both the `Top` and `Bottom` Artifact chunks.\n\nTime to finish the\
    \ Artifact's demise. Back in the Artifact class Blueprint, there is one more `Component`\
    \ to add to our setup. To make our `Top` and `Bottom` chunks fly, we will use\
    \ a `Radial Impulse` component to simulate the force of the blast. Add the `Radial\
    \ Impulse` through the `Add Component` menu and find the `Radial Force Component`\
    \ section of the `Details` panel. The radius that the impulse will affect is shown\
    \ in the viewport as a light blue sphere. Increase the size of the `Radius` property\
    \ until it covers the entire Artifact. I used `250`. Also in the `Details` panel,\
    \ find the `Impulse` section and increase the `Impulse Strength`. I used `2000`.\
    \ Lastly, make sure to turn on the `Impulse Vel Change` option. This option makes\
    \ sure that the 2000 units of force are applied directly as a velocity change.\
    \ This will guarantee to throw our chunks a good distance and maybe even the player!\n\
    \nTime for the last bit of programming! Let's take a look:\n\n![Using particle\
    \ effects](OEBPS/Images/B05189_09_19.jpg)\n\nActivate the explosion, fire, and\
    \ smoke particles and then destroy the mesh portions. We will then use two `Spawn\
    \ Actor From Class` nodes to spawn our `Top` and `Bottom` chunks. Finally, fire\
    \ the `Radial Impulse` to watch them bounce!\n\nThere isn't too much to this final\
    \ section. We will use a second `Activate` node off the end of the countdown section\
    \ to activate all of our particle effects. Then use a `Destroy Component` node\
    \ to get rid of the components that would be destroyed in the blast. Next, we\
    \ will use two `Spawn Actor From Class` nodes to spawn our two chunks, before\
    \ finally using a `Fire Impulse` node to throw them away from the blast. Lastly,\
    \ we will `Delay` 4 seconds before using a `Destroy Actor` to clean up the whole\
    \ thing. Start by using the search box in the `Palette` to grab the `Activate`\
    \ node. Place it at the end of the countdown sequence and connect it to the `Activate`\
    \ node we used to play our sound cue. The `Activate` node needs one or more `Targets`\
    \ to know what to turn on. From the `Components` panel grab the `P_Explosion`,\
    \ `P_Smoke`, and `P_Fire` components and drag them into the Blueprint. Connect\
    \ these to `Target` node on the `Activate` node.\n\nNext in line is the `Destroy\
    \ Component` node. We will use this node to delete everything that would be destroyed\
    \ in the explosion. Connect it to our `Activate` node and set its `Targets` to\
    \ be the `Artifact`, the `collision box`, and all the `tentacles`.\n\nTime for\
    \ `Spawn Actor From Class`! This great node allows us to use Blueprints to spawn\
    \ other class Blueprints, but requires a few more parameters than `Activate` or\
    \ `Destroy Component`.\n"
  trans: "\n\n6. 首先，我们需要一个 `Delay` 节点和一个 `Print String` 节点。这两个节点都可以通过 `Palette` 面板中的搜索框找到。对于\
    \ `Delay` 节点，保持 `Duration` 为 `0.2` 即可。将 `Print String` 节点上的 `In String` 选项更改为\
    \ `Explosives Armed: 5`。按住左键拖动选择这两个节点并复制/粘贴它们。在这些新节点上，将 `Delay` 节点的 `Duration`\
    \ 改为 `1.0`，将 `Print String` 节点的 `In String` 改为 `Explosives Armed: 4`。重复该过程三次以完成倒计时。序列中的最后一个节点是\
    \ `Activate` 节点。由于我们在 `Explosion Cue` 上关闭了 `Auto Activate` 选项，该节点将激活组件并播放声音。现在所有部件都在\
    \ `Blueprint` 窗口中，像前面的图片那样将它们连接起来。\n\n7. 保存并编译我们的类 Blueprint。保存关卡并按下 `Play` 进行测试！\n\
    \n现在我们的音效已经生效，完成爆炸效果只需几步。不过，在这个 Blueprint 中还有许多其他使用声音的机会。例如，我们可以为 Artifact 添加开启音效，或在其开启时播放一些诡异的音乐。多尝试一下，看看如何利用声音进一步增强氛围！\n\
    \n# 使用粒子效果\n\n我们爆炸的声音效果已经就绪，Artifact 也准备好被摧毁了！为了完成爆炸效果，我们需要一些粒子效果。我们在第 5 章 *Taking\
    \ This Level Up a Notch* 中使用过各种粒子效果，来增强安检点和电梯处的脚本事件。在这里，我们将使用爆炸、火焰和烟雾来增强销毁效果，并在删除\
    \ Artifact 的不同组件时进行遮挡。让我们来看看：\n\n![Using particle effects](img/B05189_09_16.jpg)\n\
    \n在组件列表中添加一个爆炸粒子、一个火焰粒子和一个烟雾粒子。务必关闭 `Auto Activate`！\n\n在我们已经相当丰富的组件列表中，我们将添加爆炸、火焰和烟雾粒子发射器。像添加声音那样添加每个发射器，然后选中每一个，在\
    \ `Details` 面板中禁用 `Auto Activate` 选项。稍后我们将使用 Blueprint 节点 `Activate` 将它们重新开启。\n\
    \n![Using particle effects](img/B05189_09_17.jpg)\n\n为 Artifact 的顶部和底部碎片创建两个单独的类\
    \ Blueprint。我们将在爆炸中将它们用作碎片。\n\n让这次爆炸真正精彩的最后一个必要元素是添加飞散的碎块！当固体物体爆炸时，其部分碎片往往会向四面八方飞散。我们将通过让\
    \ Blueprint 生成启用了物理模拟的 Artifact 底部和顶部版本来模拟这一点，它们会四处飞散，并在 Artifact 的其余部分被销毁后留在关卡中：\n\
    \n1. 这要求我们回到 `Blender`，将 `Top` 和 `Bottom` 作为单独的 FBX 文件导出。打开我们的 `Blender` 文件并选择\
    \ Artifact 的 `Top`。转到 `File` 菜单并进入 `FBX Export` 界面。开启 `Selected Objects` 选项，以便仅导出\
    \ `Top`。此外，转到 `Geometries` 选项卡并将 `Smoothing` 选项更改为 `Face`。给它起个独特的名字并导出！对 `Bottom`\
    \ 碎片重复此操作，准备将它们导入 Unreal。\n\n2. 将两个新的 FBX 文件作为静态网格体导入 Unreal，并将我们的 Artifact 材质应用到它们上。你会注意到，即使我们没有导入完整模型，材质依然完美工作。这是因为每个碎片的\
    \ UV 贴图仍然相同，无论我们使用完整的 Artifact 还是仅使用其部分。\n\n3. 创建两个新的类 Blueprint。通过点击 `Blueprint`\
    \ 按钮，选择 `New Empty Blueprint Class`，并选择 `Actor` 作为 `Parent Class`，为每个新的静态网格体创建一个类\
    \ `Blueprint`。我将它们命名为 `ArtifactTopChunk` 和 `ArtifactBotChunk`。\n\n4. 在每个 Blueprint\
    \ 中，添加相应的静态网格体作为组件。直接添加即可；无需移动它。这样，当我们使用 Blueprint 生成它们时，它们就会处于我们所需的确切位置。\n\n\
    5. 现在我们需要对它们的 `Details` 进行一些更改。 ![Using particle effects](img/B05189_09_18.jpg)\n\
    \n   为飞散的碎片应用物理模拟。\n\n6. 对于每个新 Blueprint，点击组件并在 `Details` 面板中找到 `Physics` 部分。首先，开启\
    \ `Simulate Physics`。这将允许我们的物体弹跳并受重力和外力影响。接下来，开启 `Mass in Kg`。通常，Unreal 会根据物体在关卡中的大小计算其质量。我们的两个碎片质量都在\
    \ 500 kg 左右，不太适合作为飞散的碎片。开启 `Mass in Kg` 允许我们覆盖 Unreal 的估算值，并填入我们希望的重量值。我用了 `50`\
    \ kg，但你可以随意使用任何值。稍后随时可以调整。务必对 `Top` 和 `Bottom` Artifact 碎片都执行此操作。\n\n是时候完成 Artifact\
    \ 的毁灭了。回到 Artifact 类 Blueprint，还有一个 `Component` 需要添加到我们的设置中。为了让 `Top` 和 `Bottom`\
    \ 碎片飞散，我们将使用 `Radial Impulse` 组件来模拟爆炸冲击力。通过 `Add Component` 菜单添加 `Radial Impulse`，并在\
    \ `Details` 面板中找到 `Radial Force Component` 部分。冲击力影响的半径在视口中显示为一个浅蓝色球体。增加 `Radius`\
    \ 属性的大小，直到它覆盖整个 Artifact。我用了 `250`。同样在 `Details` 面板中，找到 `Impulse` 部分并增加 `Impulse\
    \ Strength`。我用了 `2000`。最后，确保开启 `Impulse Vel Change` 选项。此选项确保 2000 单位的力直接作为速度变化施加。这将保证将我们的碎片抛得很远，甚至可能抛到玩家身上！\n\
    \n是时候进行最后的编程了！让我们看看：\n\n![Using particle effects](img/B05189_09_19.jpg)\n\n激活爆炸、火焰和烟雾粒子，然后销毁网格体部分。然后我们将使用两个\
    \ `Spawn Actor From Class` 节点生成 `Top` 和 `Bottom` 碎片。最后，触发 `Radial Impulse` 观看它们弹跳！\n\
    \n这一最后部分内容不多。我们将在倒计时部分末尾使用第二个 `Activate` 节点来激活所有粒子效果。然后使用 `Destroy Component`\
    \ 节点移除爆炸中会被销毁的组件。接下来，我们将使用两个 `Spawn Actor From Class` 节点生成两个碎片，最后使用 `Fire Impulse`\
    \ 节点将它们从爆炸中心抛出。最后，我们将 `Delay` 4 秒，然后使用 `Destroy Actor` 清理整个场景。首先使用 `Palette` 中的搜索框获取\
    \ `Activate` 节点。将其放在倒计时序列的末尾，并将其连接到我们用于播放声音提示的 `Activate` 节点。`Activate` 节点需要一个或多个\
    \ `Targets` 来知道开启什么。从 `Components` 面板抓取 `P_Explosion`、`P_Smoke` 和 `P_Fire` 组件并将它们拖入\
    \ Blueprint。将这些连接到 `Activate` 节点上的 `Target` 节点。\n\n接下来是 `Destroy Component` 节点。我们将使用此节点删除爆炸中会被销毁的所有东西。将其连接到我们的\
    \ `Activate` 节点，并将其 `Targets` 设置为 `Artifact`、`collision box` 和所有 `tentacles`。\n\
    \n轮到 `Spawn Actor From Class` 了！这个很棒的节点允许我们使用 Blueprint 生成其他类 Blueprint，但比 `Activate`\
    \ 或 `Destroy Component` 需要更多参数。\n\n"
