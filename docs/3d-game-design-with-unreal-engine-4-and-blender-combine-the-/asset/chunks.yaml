    ## Using the Set Actor Location Node to Move All of These Doors and Windows


    6. **To finish off the animation**, we need to connect a `Set Actor Location`
    node to the `Update` portion of our `Timeline` for each element that needs to
    be animated. Each of these nodes needs the appropriate target as well as a location
    to animate to. Just like in [Chapter 2](#ch02.xhtml "Chapter 2. Starting Our First
    Project"), *Starting Our First Project*, we will get the initial location of each
    element using our variables and add it with a `Vector + Vector` node to the `Vector
    Track` from the `Timeline`. Set each node up just like I have in the image. Near
    the bottom, I used a `Reroute` node to create all the connections to the `Vector
    + Vector` nodes. These can be used to redirect your connections if they start
    to get lost or separate out a connection into multiple wires so that it can be
    used multiple times. `Right-click` to open the menu and find the `Reroute` node
    near the bottom:


    ![Advanced scripting techniques](OEBPS/Images/BO5189_05_17.jpg)


    ### Activating All Our Particle Effects with the Activate Node


    7. **Light the fireworks!** Time to activate all of our particle effects. We do
    this using a… You guessed it! An `Activate` node! Search for this node using the
    `Find a Node` section and drag it into the Blueprint. The targets will be each
    of the particle effects. The targets can be created easily by going back to the
    level and holding the `Ctrl` key while selecting each one. Back in the Blueprint,
    `Right-click` and select `Create Reference to 4 Selected Actors`. Plugging them
    in to the `Activate` node''s `Target` will create the translation nodes (the nodes
    that say `Target` and `Particle System Components`):


    ![Advanced scripting techniques](OEBPS/Images/BO5189_05_18.jpg)


    ### Playing Our Sound Effects Using Play Sound at Location


    8. **Next we will use** `Play Sound at Location` to play our `Sound Cue`. This
    node is very straightforward and plays a sound chosen from the `Content Browser`
    at a location that we determine. Find this node and connect to our existing sequence.
    For my sound, I chose `Collapse02` from the `Audio` portion of the `Starter Content`
    folder. For my location, I used one of the initial locations we had already stored
    in a variable:


    ![Advanced scripting techniques](OEBPS/Images/BO5189_05_19.jpg)


    ### Toggling Security Lights and Destroying the Door


    9. **We are in the home stretch for this sequence.** Using a `Delay` node, let''s
    destroy the door to the security office and swap the lights. A `Delay` node will
    stop the execution of the sequence for a predetermined amount of time. Playtest
    the sequence to get a feel for how long you want the player to wait. The longer
    you have the `Delay`, the more tension and panic it creates! After much testing,
    I went with 12 seconds. More seemed too long. Less seemed too fast. Next, use
    a couple of `Toggle Visibility` nodes on our lights again to bring back our green
    light. This visual cue will let the player know where to go next. To give our
    player an audio cue, play the `Explosion01` sound at the location of the door
    that leads to the security office. Finally, grab a `Destroy` node from the `Find
    a Node` section. In game terms, `Destroy` is just a fancy word for delete (I think
    it sounds better). Use this to delete the door:


    ![Advanced scripting techniques](OEBPS/Images/BO5189_05_20.jpg)


    ### Programming the Security Override Button


    10. **Lastly, let''s program the button for the security override.** The event
    is actually three events. The first two involve the trigger we created to make
    the button work. Select the level and create an `OnActorBeginOverlap` event and
    an `OnActorEndOverlap` event. The last event we need is a keyboard input for the
    `E` key. This can be found by typing `Input` `E` into the `Find a Node` search
    box. These will all be wired into a `Gate` node, just like we did for our elevator
    back on the cargo ship. This will require the player to stand within the trigger
    to open the `Gate` and make the `E` key work. To finish this sequence, wire the
    `Exit` part of the `Gate` into a `Timeline Reverse` node. The target can be found
    by dragging a wire off the target portion of the `Reverse`, opening up `Class`,
    then your level, and finally, selecting the `Timeline` used to control the security
    doors and windows.


    **Time to test!** Playtest this section of the level and make sure everything
    is working. Feel the drama! Now it''s time to script our elevator sequence. Compared
    to the security checkpoint, this one is easy!


    ![Advanced scripting techniques](OEBPS/Images/BO5189_05_21.jpg)


    ## Setting Up the Components for the Elevator Sequence


    The elevator sequence works much like a shorter version of the security checkpoint
    sequence. When the player walks into a trigger, animate one elevator door, turn
    on a few particle emitters, and play a sound. Let''s get started:


    ![Advanced scripting techniques](OEBPS/Images/BO5189_05_22.jpg)


    ### Getting the Elevator Door''s Initial Position by Adding Onto Our Level Initialization
    Sequence


    1. **Since we will be using a `Timeline` for this sequence**, create a vector
    variable to hold the initial location of the door we plan to animate and set it
    using the same technique we used to get the initial location of the security doors.


    ![Advanced scripting techniques](OEBPS/Images/BO5189_05_23.jpg)


    ### Scripting the Elevator Sequence


    Connect the nodes in this order: `OnActorBeginOverlap`, `Timeline`, `Set Actor
    Location`, `Activate`, `Do Once`, `Play Sound at Location`.


    2. **The event that kicks this one off is an `OnActorBeginOverlap`**, using the
    trigger in front of the elevator buttons.


    3. **Next, create a `Timeline`** to move one of the doors just a bit, to make
    the player think they are opening.


    4. **Use the `Activate` node** to activate the smoke and sparks at the elevator
    door. I also added a fire emitter at the bottom of the elevator shaft and opened
    the doors down there a bit to give the player a view of what could have happened
    to them once they get down to the marketplace.


    5. **I then used a `Do Once` and a `Play Sound at Location` node** to have an
    explosion sound play. `Do Once` makes sure the audio doesn''t try to loop and
    ruin the experience we are going for.


    **All done!** Test the sequence to make sure it has the emotional effect that
    you want. Feel free to tweak the different particle effects, sounds, and timings
    until it feels right for you and your playtesters. In the next section, we will
    talk about win conditions and how to connect our two levels together.


    # Win Conditions


    At this point in the book we have two whitebox levels, complete with a starting
    point and an end goal in each one. We have also constructed a bit of narrative
    that strings the two together. In this section, I will show you how to use Blueprints
    to connect the two levels and allow a player to go from the cargo ship level to
    the space station by investigating the crate. In the end, we will have the skeleton
    of a game demo that could definitely be expanded on with additional art and gameplay
    to create a full game.


    To connect the two levels, we will have to go back to the cargo ship and add a
    triggered event to the crate we placed there that allows the player to investigate
    it. This trigger will then allow the player to load to the space station level
    to continue the story:


    ![Win conditions](OEBPS/Images/BO5189_05_24.jpg)


    ## Connecting Our Cargo Ship Level to the Space Station Level


    1. **Open the cargo ship level and add two things:** A `Box Trigger` around the
    crate we created and a `Text Render` with a message saying to press the `E` key
    to investigate it.

    '
  trans: '


    ## 使用 Set Actor Location 节点移动所有这些门和窗


    6. **为了完成动画**，我们需要为每个需要动画的元素，将一个 `Set Actor Location` 节点连接到 `Timeline` 的 `Update`
    部分。这些节点中的每一个都需要适当的目标以及一个要动画移动到的位置。就像在 第 2 章 *启动我们的第一个项目* 中一样，我们将使用变量获取每个元素的初始位置，并通过
    `Vector + Vector` 节点将其与来自 `Timeline` 的 `Vector Track` 相加。按照图示设置每个节点。在底部附近，我使用了一个
    `Reroute` 节点来创建所有通往 `Vector + Vector` 节点的连接。如果连线开始变得混乱，或者需要将一条连线分离为多根线以便多次使用，可以使用这些节点来重定向连线。`右键单击`
    打开菜单，在底部附近找到 `Reroute` 节点：


    ![高级脚本技术](img/BO5189_05_17.jpg)


    ### 使用 Activate 节点激活所有粒子效果


    7. **燃放烟花！** 是时候激活我们所有的粒子效果了。我们使用……你猜对了！一个 `Activate` 节点！使用 `Find a Node` 部分搜索此节点并将其拖入蓝图。目标将是每个粒子效果。可以通过返回关卡，按住
    `Ctrl` 键同时选择每一个来轻松创建目标。回到蓝图中，`右键单击` 并选择 `Create Reference to 4 Selected Actors`。将它们插入
    `Activate` 节点的 `Target` 将创建转换节点（显示 `Target` 和 `Particle System Components` 的那些节点）：


    ![高级脚本技术](img/BO5189_05_18.jpg)


    ### 使用 Play Sound at Location 播放音效


    8. **接下来我们将使用** `Play Sound at Location` 来播放我们的 `Sound Cue`。此节点非常直观，它会在我们确定的位置播放从
    `Content Browser` 中选择的声音。找到此节点并将其连接到现有序列。对于我的声音，我从 `Starter Content` 文件夹的 `Audio`
    部分选择了 `Collapse02`。对于位置，我使用了我们之前已存储在变量中的初始位置之一：


    ![高级脚本技术](img/BO5189_05_19.jpg)


    ### 切换安保灯并销毁门


    9. **我们已进入该序列的最后冲刺阶段。** 使用 `Delay` 节点，让我们销毁安保办公室的门并切换灯光。`Delay` 节点会在预定时间内停止序列的执行。试玩序列以感受你希望玩家等待多久。`Delay`
    时间越长，产生的紧张感和恐慌感就越强！经过多次测试，我选择了 12 秒。更长显得太久，更短显得太快。接下来，再次在灯光上使用几个 `Toggle Visibility`
    节点以恢复绿灯。这个视觉提示将让玩家知道下一步去哪里。为了给玩家一个听觉提示，在通往安保办公室的门的位置播放 `Explosion01` 声音。最后，从 `Find
    a Node` 部分获取一个 `Destroy` 节点。在游戏术语中，`Destroy` 只是 delete（删除）的一个花哨说法（我觉得听起来更好）。用它来删除那扇门：


    ![高级脚本技术](img/BO5189_05_20.jpg)


    ### 编程安保覆盖按钮


    10. **最后，让我们为安保覆盖按钮编写程序。** 该事件实际上包含三个事件。前两个涉及我们创建的用于使按钮工作的触发器。选择关卡并创建一个 `OnActorBeginOverlap`
    事件和一个 `OnActorEndOverlap` 事件。我们需要的最后一个事件是 `E` 键的键盘输入。可以通过在 `Find a Node` 搜索框中输入
    `Input` `E` 来找到它。这些都将连线到一个 `Gate` 节点，就像我们在货船上的电梯所做的那样。这将要求玩家站在触发器内以打开 `Gate` 并使
    `E` 键生效。要完成此序列，将 `Gate` 的 `Exit` 部分连线到 `Timeline Reverse` 节点。目标可以通过从 `Reverse`
    的目标部分拖出连线，打开 `Class`，然后选择你的关卡，最后选择用于控制安保门和窗的 `Timeline` 来找到。


    **测试时间！** 试玩关卡的这一部分，确保一切正常运作。感受戏剧张力！现在是编写电梯序列脚本的时候了。与安保检查站相比，这简单多了！


    ![高级脚本技术](img/BO5189_05_21.jpg)


    ## 为电梯序列设置组件


    电梯序列的工作方式很像安保检查站序列的缩短版。当玩家走进触发器时，为一扇电梯门制作动画，打开几个粒子发射器，并播放声音。让我们开始吧：


    ![高级脚本技术](img/BO5189_05_22.jpg)


    ### 通过添加到关卡初始化序列来获取电梯门的初始位置


    1. **既然我们将为此序列使用 `Timeline`**，创建一个向量变量来保存我们计划制作动画的门的初始位置，并使用与获取安保门初始位置相同的技术进行设置。


    ![高级脚本技术](img/BO5189_05_23.jpg)


    ### 编写电梯序列脚本


    按以下顺序连接节点：`OnActorBeginOverlap`、`Timeline`、`Set Actor Location`、`Activate`、`Do
    Once`、`Play Sound at Location`。


    2. **启动此序列的事件是 `OnActorBeginOverlap`**，使用电梯按钮前的触发器。


    3. **接下来，创建一个 `Timeline`** 来稍微移动其中一扇门，让玩家以为门在打开。


    4. **使用 `Activate` 节点** 激活电梯门处的烟雾和火花。我还在电梯井底部添加了一个火焰发射器，并稍微打开了那里的门，让玩家看到一旦到达市场，他们可能会遭遇什么。


    5. **然后我使用了 `Do Once` 和 `Play Sound at Location` 节点** 来播放爆炸声。`Do Once` 确保音频不会尝试循环播放从而破坏我们想要的体验。


    **全部完成！** 测试序列以确保它具有你想要的情感效果。请随意调整不同的粒子效果、声音和时间，直到感觉适合你和你的测试玩家。在下一节中，我们将讨论胜利条件以及如何将我们的两个关卡连接在一起。


    # 胜利条件


    此时在本书中，我们有两个白盒关卡，每个关卡都包含起点和终点。我们还构建了一段将两者串联起来的叙事。在本节中，我将向你展示如何使用蓝图连接这两个关卡，并允许玩家通过调查货箱从货船关卡前往空间站关卡继续故事。最终，我们将拥有一个游戏演示的骨架，绝对可以通过额外的美术和玩法扩展成一个完整的游戏。


    要连接这两个关卡，我们必须回到货船，为我们放置在那里的货箱添加一个触发事件，允许玩家调查它。此触发器将允许玩家加载空间站关卡以继续故事：


    ![胜利条件](img/BO5189_05_24.jpg)


    ## 将货船关卡连接到空间站关卡


    1. **打开货船关卡并添加两样东西：** 一个围绕我们创建的货箱的 `Box Trigger` 和一个显示“按 `E` 键进行调查”消息的 `Text Render`。


    '
