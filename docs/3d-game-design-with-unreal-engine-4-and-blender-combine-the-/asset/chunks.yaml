- raw: "Normal maps store detailed information from high polygon versions of game\
    \ assets that can then be used to create detail on lower polygon versions of those\
    \ same game assets. This detailed information is stored in three colors, red,\
    \ green, and blue, and each color corresponds to a different axis in 3D space.\
    \ The information is then used to simulate depth and can make a game asset look\
    \ much more detailed than it actually is.\n\nThese days, there are many different\
    \ ways to generate these types of texture map. Diffuse and Specular maps can be\
    \ painted onto copies of a game asset's UVs using programs such as Photoshop and\
    \ GIMP. Normal maps usually need to be created with a separate program, such as\
    \ the freely available Xnormal. However, there is another type of texturing that\
    \ is quickly gaining popularity. The process is called **Physically Based**  **Rendering**\
    \ (**PBR**) and seeks to simulate what light actually does using Diffuse maps,\
    \ Specular maps, Roughness values, and Metallic values, as opposed to more traditional\
    \ methods. Where game artists used to be required to guess how light would interact\
    \ with their game characters and objects, PBR allows them to paint their materials\
    \ onto their game assets while the computer simulates the lighting. The results\
    \ tend to be much more accurate and work well in most lighting situations. One\
    \ of the most popular tools for PBR is Allegorithmic's Substance Painter.\n\n\
    Before we tackle Substance Painter, there is one thing on our model that needs\
    \ to be fixed. When we used the **Decimate** tool on our tentacle, it may have\
    \ created some ugly geometry that is not doing our triangle count any favors:\n\
    \n![Using different maps to create a more realistic look](OEBPS/Images/B05189_07_24.jpg)\n\
    \nTime to simplify the geometry of the tentacle\n\nThere are a lot of lines here\
    \ that we simply do not need! This process is called Retopologizing, or simply\
    \ retopoing, and is simply us going back to an object and simplifying the geometry,\
    \ while still maintaining the original shape. Let's just jump right in:\n\n1.\
    \  Select our tentacle and press *Shift* + *H* to isolate it before we head back\
    \ into **Edit** mode.\n\n2.  In the **Modifier** menu of the **Properties** pane,\
    \ turn off both the **Array** and **Curve** modifiers by clicking on the eye icon\
    \ in each of their respective menus: ![Using different maps to create a more realistic\
    \ look](OEBPS/Images/B05189_07_25.jpg)\n\n    Select many of the inner lines and\
    \ dissolve them\n\n3.  Looking at the geometry, there are several lines we can\
    \ remove while still keeping the basic shape. Select all the lines similar to\
    \ the selections shown in the preceding screenshot. Press *X* or the *Delete*\
    \ key and select **Dissolve** Edges. This will fully remove both the edge and\
    \ the vertices that go with them: ![Using different maps to create a more realistic\
    \ look](OEBPS/Images/B05189_07_26.jpg)\n\n    There! All cleaned up.\n\n4.  Repeat\
    \ the process for each major face of the tentacle until we have clear and simple\
    \ geometry! Don't worry about our UV map. It has been automatically updated with\
    \ our changes.\n\n5.  Lastly, head back to **Object** mode a turn our modifiers\
    \ back on; we are going to need them. We need to **Apply** both modifiers to the\
    \ model, but order is important. First apply the **Array** modifier, and then\
    \ the **Curve** modifier. Finally, we can delete the **Tentacle Curve** that we\
    \ used as a guide for our shape. It is no longer needed.\n\nNow that we have cleaned\
    \ that up, let's take a look at using Substance Painter to create an interesting\
    \ material for the Artifact:\n\n### Tip\n\nSubstance Painter is available for\
    \ a 30-day free trial and can be downloaded at [https://www.allegorithmic.com/products/substance-painter](https://www.allegorithmic.com/products/substance-painter).\n\
    \n![Using different maps to create a more realistic look](OEBPS/Images/B05189_07_27.jpg)\n\
    \nThe Artefact inside Substance Painter\n\nSubstance Painter will allow us to\
    \ paint color and detail directly onto the Artifact, and will create all the necessary\
    \ texture maps we need, based on our result. The process will take a few steps:\n\
    \n1.  First, we will tweak our UV maps in Blender to prepare for exporting.\n\n\
    2.  Second, we will export an FBX file out of Blender and use it to create a Substance\
    \ Painter project.\n\n3.  Third, we will paint detail onto the Artifact.\n\n4.\
    \  Fourth, we will add color.\n\n5.  Finally, we will export the texture maps\
    \ out of Substance Painter to use in Unreal 4.\n\nIt seems like a long process,\
    \ but the results are definitely worth the time.\n\nFor the Artifact to work with\
    \ Substance Painter, we need to join all the pieces together and tweak our UV\
    \ map:\n\n1.  Joining all of our objects together is a pretty straightforward\
    \ process. In the **Scene Outliner**, click on the first piece at the top of the\
    \ list, then, while holding the *Shift* key, select each of the other pieces in\
    \ the list, making sure to skip the tentacle. We will texture this piece separately.\n\
    \n2.  With all of the objects selected, press *Ctrl* + *J*. This will join them\
    \ into one object and will combine all of their UV maps into one.\n\n3.  Head\
    \ up to the **Screen Layout** dropdown and select the **UV Layout** option. Select\
    \ our new combined Artifact and select all of its faces. Our map will be a jumble\
    \ where all of our unwraps have begun to overlap: ![Using different maps to create\
    \ a more realistic look](OEBPS/Images/B05189_07_28.jpg)\n\n    Arrange the UV\
    \ islands into one big UV map\n\n4.  Now head to the **UV** menu and select **Average\
    \ Island Scale**. This should change the scaling of all of our UV islands relative\
    \ to each other. Next, select **Pack Islands** from the **UV** menu to pack them\
    \ all in the one-to-one UV space for us. Our result should look similar to the\
    \ preceding screenshot: ![Using different maps to create a more realistic look](OEBPS/Images/B05189_07_29.jpg)\n\
    \n    Set the Smoothing option to Face\n\nAlright, everything is ready for us\
    \ to export. With the Artifact selected, head to the **File** menu and export\
    \ an FBX. Make sure to select **Selected Objects** in your **Export FBX** options.\
    \ Also, head over to the **Geometries** portion of that menu and change the **Smoothing**\
    \ dropdown to **Face**. Export!\n\n### Tip\n\nThis next section requires the 30-day\
    \ trial of Substance Painter and the demo files for their Substance Painter Texturing\
    \ for Beginners course on YouTube. The demo files can be downloaded at [https://s3.amazonaws.com/alg-releases/public\\\
    _releases/tutorials/scifi\\_crate/scifiCrate.zip](https://s3.amazonaws.com/alg-releases/public_releases/tutorials/scifi_crate/scifiCrate.zip).\
    \ I highly recommend this course, as it gives you a great introduction to Substance\
    \ Painter and Physically Based Rendering.\n\nTime to open Substance Painter! For\
    \ anybody who has had some experience with Photoshop, the interface has a similar\
    \ look and feel. Take a few minutes to explore some of the information panes.\
    \ If you feel they would work better in different places, they can be rearranged\
    \ exactly like the panes in Unreal. Just grab the one you wish to move and drag\
    \ it to the new location.\n\nAs we move forward, we will not be going over every\
    \ feature in Substance Painter. I will be highlighting only those we need to complete\
    \ the Artifact. I highly recommend taking advantage of their free training on\
    \ YouTube if you would like to know more.\n\nThe first thing we need to do is\
    \ create a project and import our FBX file:\n\n![Using different maps to create\
    \ a more realistic look](OEBPS/Images/B05189_07_30.jpg)\n\nImporting the FBX file\
    \ into Substance Painter\n\n1.  Head to the upper-left corner of the screen and\
    \ select the **File** menu. Then select **New**. Match your project settings to\
    \ those in the preceding screenshot. Clicking the **Select** button in the window\
    \ will allow us to choose our FBX for the project."
  fmt: "\n# Normal Maps and PBR Texturing Workflow\n\n## Understanding Normal Maps\
    \ and PBR\n\nNormal maps store detailed information from high polygon versions\
    \ of game assets that can then be used to create detail on lower polygon versions\
    \ of those same game assets. This detailed information is stored in three colors—red,\
    \ green, and blue—and each color corresponds to a different axis in 3D space.\
    \ The information is then used to simulate depth and can make a game asset look\
    \ much more detailed than it actually is.\n\nThese days, there are many different\
    \ ways to generate these types of texture maps. Diffuse and Specular maps can\
    \ be painted onto copies of a game asset's UVs using programs such as Photoshop\
    \ and GIMP. Normal maps usually need to be created with a separate program, such\
    \ as the freely available Xnormal. However, there is another type of texturing\
    \ that is quickly gaining popularity. The process is called **Physically Based\
    \ Rendering (PBR)** and seeks to simulate what light actually does using Diffuse\
    \ maps, Specular maps, Roughness values, and Metallic values, as opposed to more\
    \ traditional methods. Where game artists used to be required to guess how light\
    \ would interact with their game characters and objects, PBR allows them to paint\
    \ their materials onto their game assets while the computer simulates the lighting.\
    \ The results tend to be much more accurate and work well in most lighting situations.\
    \ One of the most popular tools for PBR is Allegorithmic's Substance Painter.\n\
    \n## Fixing Tentacle Geometry (Retopology)\n\nBefore we tackle Substance Painter,\
    \ there is one thing on our model that needs to be fixed. When we used the `Decimate`\
    \ tool on our tentacle, it may have created some ugly geometry that is not doing\
    \ our triangle count any favors:\n\n![Using different maps to create a more realistic\
    \ look](OEBPS/Images/B05189_07_24.jpg)\n\n**Time to simplify the geometry of the\
    \ tentacle**\n\nThere are a lot of lines here that we simply do not need! This\
    \ process is called Retopologizing, or simply retopoing, and is simply us going\
    \ back to an object and simplifying the geometry while still maintaining the original\
    \ shape. Let's just jump right in:\n\n1. Select our tentacle and press `Shift`\
    \ + `H` to isolate it before we head back into `Edit` mode.\n\n2. In the `Modifier`\
    \ menu of the `Properties` pane, turn off both the `Array` and `Curve` modifiers\
    \ by clicking on the eye icon in each of their respective menus:\n\n   ![Using\
    \ different maps to create a more realistic look](OEBPS/Images/B05189_07_25.jpg)\n\
    \n   *Select many of the inner lines and dissolve them*\n\n3. Looking at the geometry,\
    \ there are several lines we can remove while still keeping the basic shape. Select\
    \ all the lines similar to the selections shown in the preceding screenshot. Press\
    \ `X` or the `Delete` key and select `Dissolve` Edges. This will fully remove\
    \ both the edge and the vertices that go with them:\n\n   ![Using different maps\
    \ to create a more realistic look](OEBPS/Images/B05189_07_26.jpg)\n\n   *There!\
    \ All cleaned up.*\n\n4. Repeat the process for each major face of the tentacle\
    \ until we have clear and simple geometry! Don't worry about our UV map. It has\
    \ been automatically updated with our changes.\n\n5. Lastly, head back to `Object`\
    \ mode and turn our modifiers back on; we are going to need them. We need to `Apply`\
    \ both modifiers to the model, but order is important. First apply the `Array`\
    \ modifier, and then the `Curve` modifier. Finally, we can delete the `Tentacle\
    \ Curve` that we used as a guide for our shape. It is no longer needed.\n\n##\
    \ Preparing UV Maps for Substance Painter\n\nNow that we have cleaned that up,\
    \ let's take a look at using Substance Painter to create an interesting material\
    \ for the Artifact:\n\n### Tip\n\nSubstance Painter is available for a 30-day\
    \ free trial and can be downloaded at `https://www.allegorithmic.com/products/substance-painter`.\n\
    \n![Using different maps to create a more realistic look](OEBPS/Images/B05189_07_27.jpg)\n\
    \n*The Artefact inside Substance Painter*\n\nSubstance Painter will allow us to\
    \ paint color and detail directly onto the Artifact, and will create all the necessary\
    \ texture maps we need based on our result. The process will take a few steps:\n\
    \n1. First, we will tweak our UV maps in Blender to prepare for exporting.\n2.\
    \ Second, we will export an FBX file out of Blender and use it to create a Substance\
    \ Painter project.\n3. Third, we will paint detail onto the Artifact.\n4. Fourth,\
    \ we will add color.\n5. Finally, we will export the texture maps out of Substance\
    \ Painter to use in Unreal 4.\n\nIt seems like a long process, but the results\
    \ are definitely worth the time.\n\nFor the Artifact to work with Substance Painter,\
    \ we need to join all the pieces together and tweak our UV map:\n\n1. Joining\
    \ all of our objects together is a pretty straightforward process. In the `Scene\
    \ Outliner`, click on the first piece at the top of the list, then, while holding\
    \ the `Shift` key, select each of the other pieces in the list, making sure to\
    \ skip the tentacle. We will texture this piece separately.\n\n2. With all of\
    \ the objects selected, press `Ctrl` + `J`. This will join them into one object\
    \ and will combine all of their UV maps into one.\n\n3. Head up to the `Screen\
    \ Layout` dropdown and select the `UV Layout` option. Select our new combined\
    \ Artifact and select all of its faces. Our map will be a jumble where all of\
    \ our unwraps have begun to overlap:\n\n   ![Using different maps to create a\
    \ more realistic look](OEBPS/Images/B05189_07_28.jpg)\n\n   *Arrange the UV islands\
    \ into one big UV map*\n\n4. Now head to the `UV` menu and select `Average Island\
    \ Scale`. This should change the scaling of all of our UV islands relative to\
    \ each other. Next, select `Pack Islands` from the `UV` menu to pack them all\
    \ in the one-to-one UV space for us. Our result should look similar to the preceding\
    \ screenshot:\n\n   ![Using different maps to create a more realistic look](OEBPS/Images/B05189_07_29.jpg)\n\
    \n   *Set the Smoothing option to Face*\n\nAlright, everything is ready for us\
    \ to export. With the Artifact selected, head to the `File` menu and export an\
    \ FBX. Make sure to select `Selected Objects` in your `Export FBX` options. Also,\
    \ head over to the `Geometries` portion of that menu and change the `Smoothing`\
    \ dropdown to `Face`. Export!\n\n### Tip\n\nThis next section requires the 30-day\
    \ trial of Substance Painter and the demo files for their Substance Painter Texturing\
    \ for Beginners course on YouTube. The demo files can be downloaded at `https://s3.amazonaws.com/alg-releases/public_releases/tutorials/scifi_crate/scifiCrate.zip`.\
    \ I highly recommend this course, as it gives you a great introduction to Substance\
    \ Painter and Physically Based Rendering.\n\n## Substance Painter Workflow\n\n\
    Time to open Substance Painter! For anybody who has had some experience with Photoshop,\
    \ the interface has a similar look and feel. Take a few minutes to explore some\
    \ of the information panes. If you feel they would work better in different places,\
    \ they can be rearranged exactly like the panes in Unreal. Just grab the one you\
    \ wish to move and drag it to the new location.\n\nAs we move forward, we will\
    \ not be going over every feature in Substance Painter. I will be highlighting\
    \ only those we need to complete the Artifact. I highly recommend taking advantage\
    \ of their free training on YouTube if you would like to know more.\n\nThe first\
    \ thing we need to do is create a project and import our FBX file:\n\n![Using\
    \ different maps to create a more realistic look](OEBPS/Images/B05189_07_30.jpg)\n\
    \n*Importing the FBX file into Substance Painter*\n\n1. Head to the upper-left\
    \ corner of the screen and select the `File` menu. Then select `New`. Match your\
    \ project settings to those in the preceding screenshot. Clicking the `Select`\
    \ button in the window will allow us to choose our FBX for the project.\n"
  trans: "\n# 法线贴图与 PBR 贴图工作流\n\n## 理解法线贴图与 PBR\n\n法线贴图存储了游戏资产高模版本的详细信息，随后可用于在同一游戏资产的低模版本上创建细节。这些详细信息存储在三个颜色通道中——红、绿、蓝，每个颜色对应三维空间中的不同轴向。这些信息随后用于模拟深度，能让游戏资产看起来比实际更加细致。\n\
    \n如今，生成这类纹理贴图的方法有很多。漫反射贴图和高光贴图可以使用 Photoshop 和 GIMP 等程序绘制在游戏资产 UV 的副本上。法线贴图通常需要使用单独的程序创建，例如免费的\
    \ Xnormal。然而，还有一种贴图技术正迅速流行起来。该过程称为**基于物理的渲染**，旨在利用漫反射贴图、高光贴图、粗糙度值和金属度值来模拟光线的真实行为，这与传统方法形成对比。过去游戏美术需要猜测光线如何与他们的游戏角色和物体交互，而\
    \ PBR 允许他们在游戏资产上绘制材质，由计算机模拟光照。结果往往更加准确，且在大多数光照情况下表现良好。PBR 最流行的工具之一是 Allegorithmic\
    \ 的 Substance Painter。\n\n## 修复触手几何体（重拓扑）\n\n在处理 Substance Painter 之前，我们的模型有一个问题需要修复。当我们在触手上使用\
    \ `Decimate` 工具时，可能会产生一些难看的几何体，这对我们的三角形面数没有任何好处：\n\n![Using different maps to\
    \ create a more realistic look](img/B05189_07_24.jpg)\n\n**是时候简化触手的几何体了**\n\n\
    这里有很多我们根本不需要的线条！这个过程称为重拓扑，简称重拓，简单来说就是回到物体上简化几何体，同时保持原始形状。让我们直接开始吧：\n\n1. 选择触手并按\
    \ `Shift` + `H` 隔离它，然后再进入 `Edit` 模式。\n\n2. 在 `Properties` 面板的 `Modifier` 菜单中，通过点击各自菜单中的眼睛图标，关闭\
    \ `Array` 和 `Curve` 两个修改器：\n\n   ![Using different maps to create a more realistic\
    \ look](img/B05189_07_25.jpg)\n\n   *选择许多内部线条并溶解它们*\n\n3. 观察几何体，有几条线我们可以移除，同时保持基本形状。选择所有类似于上图所示选择的线条。按\
    \ `X` 或 `Delete` 键并选择 `Dissolve` Edges。这将完全移除边及其对应的顶点：\n\n   ![Using different\
    \ maps to create a more realistic look](img/B05189_07_26.jpg)\n\n   *好了！清理完毕。*\n\
    \n4. 对触手的每个主要面重复此过程，直到获得清晰简单的几何体！不用担心 UV 贴图，它已随我们的更改自动更新。\n\n5. 最后，回到 `Object`\
    \ 模式并重新启用修改器；我们还需要它们。我们需要将两个修改器都 `Apply` 到模型上，但顺序很重要。先应用 `Array` 修改器，再应用 `Curve`\
    \ 修改器。最后，我们可以删除用作形状引导的 `Tentacle Curve`。它不再需要了。\n\n## 为 Substance Painter 准备 UV\
    \ 贴图\n\n现在清理完毕，让我们看看如何使用 Substance Painter 为 Artifact 创建有趣的材质：\n\n### 提示\n\nSubstance\
    \ Painter 提供 30 天免费试用，可在 `https://www.allegorithmic.com/products/substance-painter`\
    \ 下载。\n\n![Using different maps to create a more realistic look](img/B05189_07_27.jpg)\n\
    \n*Substance Painter 中的 Artifact*\n\nSubstance Painter 将允许我们直接在 Artifact 上绘制颜色和细节，并根据结果创建所需的所有必要纹理贴图。该过程需要几个步骤：\n\
    \n1. 首先，我们将在 Blender 中调整 UV 贴图以准备导出。\n2. 其次，我们将从 Blender 导出 FBX 文件并用它创建 Substance\
    \ Painter 项目。\n3. 第三，我们将在 Artifact 上绘制细节。\n4. 第四，我们将添加颜色。\n5. 最后，我们将从 Substance\
    \ Painter 导出纹理贴图以在 Unreal 4 中使用。\n\n这看起来是个漫长的过程，但结果绝对值得花时间。\n\n为了让 Artifact 能在\
    \ Substance Painter 中工作，我们需要将所有部件合并并调整 UV 贴图：\n\n1. 将所有对象合并是一个相当直接的过程。在 `Scene\
    \ Outliner` 中，点击列表顶部的第一个部件，然后按住 `Shift` 键选择列表中的其他部件，确保跳过触手。我们将单独为该部件制作纹理。\n\n\
    2. 选中所有对象后，按 `Ctrl` + `J`。这将把它们合并为一个对象，并将所有 UV 贴图合并为一个。\n\n3. 转到 `Screen Layout`\
    \ 下拉菜单并选择 `UV Layout` 选项。选择我们新合并的 Artifact 并选择其所有面。我们的贴图将变得杂乱，所有展开的 UV 都开始重叠：\n\
    \n   ![Using different maps to create a more realistic look](img/B05189_07_28.jpg)\n\
    \n   *将 UV 岛排列成一个大的 UV 贴图*\n\n4. 现在转到 `UV` 菜单并选择 `Average Island Scale`。这应该会调整所有\
    \ UV 岛的相对缩放。接下来，从 `UV` 菜单选择 `Pack Islands` 将它们全部打包到一对一的 UV 空间中。我们的结果应该类似于前面的截图：\n\
    \n   ![Using different maps to create a more realistic look](img/B05189_07_29.jpg)\n\
    \n   *将 Smoothing 选项设置为 Face*\n\n好了，一切准备就绪可以导出。选中 Artifact，转到 `File` 菜单导出 FBX。确保在\
    \ `Export FBX` 选项中选择 `Selected Objects`。另外，转到该菜单的 `Geometries` 部分，将 `Smoothing`\
    \ 下拉菜单改为 `Face`。导出！\n\n### 提示\n\n下一节需要 Substance Painter 的 30 天试用版以及他们在 YouTube\
    \ 上的 Substance Painter 初学者贴图课程的演示文件。演示文件可在 `https://s3.amazonaws.com/alg-releases/public_releases/tutorials/scifi_crate/scifiCrate.zip`\
    \ 下载。我强烈推荐这门课程，因为它能让你很好地入门 Substance Painter 和基于物理的渲染。\n\n## Substance Painter\
    \ 工作流\n\n是时候打开 Substance Painter 了！对于有 Photoshop 经验的人来说，界面看起来和感觉都很相似。花几分钟探索一下信息面板。如果你觉得把它们放在别处会更好，可以像在\
    \ Unreal 中一样重新排列面板。只需抓住想移动的面板拖到新位置即可。\n\n随着我们深入，我们不会涵盖 Substance Painter 的每个功能。我只会重点介绍完成\
    \ Artifact 所需的功能。如果你想了解更多，我强烈建议利用他们在 YouTube 上的免费教程。\n\n我们需要做的第一件事是创建一个项目并导入 FBX\
    \ 文件：\n\n![Using different maps to create a more realistic look](img/B05189_07_30.jpg)\n\
    \n*将 FBX 文件导入 Substance Painter*\n\n1. 转到屏幕左上角选择 `File` 菜单。然后选择 `New`。将项目设置与前面截图中的设置匹配。点击窗口中的\
    \ `Select` 按钮将允许我们为项目选择 FBX 文件。\n"
