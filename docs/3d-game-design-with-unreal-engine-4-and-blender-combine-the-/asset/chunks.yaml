- raw: "One of the only downsides to FBX is that it is a proprietary file format.\
    \ Autodesk makes it available to the public through many of their products and\
    \ through a software development kit. From that, members of the Blender community\
    \ have been able to create an exporting tool that allows us to use this versatile\
    \ file format in our projects. Let's take a look at the FBX exporter.\n\n# Importing\
    \ our object into Unreal\n\nTime to export our crate from Blender:\n\n![Importing\
    \ our object into Unreal](OEBPS/Images/BO5189_04_04.jpg)\n\nSelecting export from\
    \ the File menu\n\nThe export options can be found by going to the **File** menu,\
    \ then  **Export**, and selecting **FBX** as your chosen file format:\n\n![Importing\
    \ our object into Unreal](OEBPS/Images/BO5189_04_05.jpg)\n\nFBX exporting options\
    \ menu. Select the Mesh tab.\n\nThe exporter has many options, several of which\
    \ we will use later as they pertain to animation. We will need to change some\
    \ of the options to export our crate:\n\n1.  In the main menu of the exporter,\
    \ select **Mesh**. This way, the only object that will be exported is our crate\
    \ and not the camera or light that is also in the scene: ![Importing our object\
    \ into Unreal](OEBPS/Images/BO5189_04_06.jpg)\n\n    Setting our Smoothing option\
    \ to Face in the Geometries tab\n\n2.  In the **Geometry** menu, change the **Smoothing**\
    \ option to **Face**. Unreal requires that smoothing groups be part of any exported\
    \ object even though we haven't really used them to create our crate. By selecting\
    \ this option, we avoid any error messages when we import our FBX file.\n\n3.\
    \  Once you have changed those settings, save your FBX in a place where you can\
    \ find it.\n\nNext, we will open Unreal and import the file into our level. Once\
    \ we hook up a few options the crate will be ready to use.\n\n# Setting up and\
    \ using our new 3D asset\n\nNow that we have our FBX file, we need to import the\
    \ file into the **Content**  **Browser** in Unreal. Epic Games has made this a\
    \ relatively painless process. After we import the file into the game engine,\
    \ it still needs two more things. A collision mesh will have to be added to make\
    \ sure that the player and other game object collide correctly with our new crate.\
    \ Second, we will have to add a material to our object to give it visual appeal.\n\
    \nStart by navigating in the **Content Browser** to the folder you would like\
    \ to store your crate in and clicking the **Import** button:\n\n![Setting up and\
    \ using our new 3D asset](OEBPS/Images/BO5189_04_07.jpg)\n\nFind your FBX file\
    \ in the file browser.\n\n1.  Navigate to the folder where you saved your FBX\
    \ file and click **Open**: ![Setting up and using our new 3D asset](OEBPS/Images/BO5189_04_08.jpg)\n\
    \n    Unreal's FBX Import Options menu\n\n2.  This opens the **FBX Import Options**.\
    \ Turn off the **Auto Generate Collision** option. Though this can save us time\
    \ in the future, we will create this manually after we have successfully imported\
    \ the file.\n\n3.  Also turn off the **Import Materials** and **Import Textures**\
    \ options. These can be used if you have created a material in your 3D package\
    \ and want to bring it in along with your object. If we were to use it in this\
    \ case, Unreal would import our colored UV grid.\n\n4.  Once you have changed\
    \ these options, click the **Import** button.\n\nA light blue icon showing our\
    \ crate should be added to the Browser. Double clicking it will take us to the\
    \ **Static Mesh** editor. Here, we can set several different options that will\
    \ affect every copy of the crate we use in the level:\n\n![Setting up and using\
    \ our new 3D asset](OEBPS/Images/BO5189_04_09.jpg)\n\nStatic Mesh Editor within\
    \ Unreal 4\n\nWe will start by adding a collision primitive. **Collisions** are\
    \ really what make video game worlds go round and it is the way that the computer\
    \ knows if a player has successfully interacted with another game object. As players,\
    \ we often see collision when we stand on a platform and look down. It often looks\
    \ as if we are floating just above the actual object we are standing on. This\
    \ is due to the fact that the game programming actually ignores the art that the\
    \ player sees and only uses the simple collision primitives that are invisible\
    \ to the player to record hits. As far as we are concerned as level builders,\
    \ a collision will keep the player from walking through our crate and make it\
    \ so they can actually interact with it:\n\n![Setting up and using our new 3D\
    \ asset](OEBPS/Images/BO5189_04_10.jpg)\n\nSelect the Collision menu and choose\
    \ Add Simple Box Collision\n\nLets see how Collision can be added to our object:\n\
    \n1.  Make sure the **Collision** option is turned on along the top of the viewport.\
    \ This will make any collision primitives we create visible.\n\n2.  Click the\
    \ **Collision** menu option in the menu bar along the top of the screen. From\
    \ here we will want to select the simplest shape that fits our needs. Since our\
    \ crate is really just a box, we will select **Add Simple Box Collision**. You\
    \ should now see a box outlined in green around the crate.\n\nThe next thing we\
    \ need to do is select a material to add to our crate. Any of the materials available\
    \ in the **Content Browser** can be used:\n\n![Setting up and using our new 3D\
    \ asset](OEBPS/Images/BO5189_04_11.jpg)\n\nAdding a material to our box using\
    \ the Details panel\n\n1.  Go back to the **Content Browser** and navigate to\
    \ the **Materials** folder inside the **Starter Content** folder.\n\n2.  Click\
    \ on the material you would like to use for the crate. I selected **M\\_Metal\\\
    _Copper**.\n\n3.  With the material highlighted, go back to the **Static Mesh**\
    \ editor and click the small arrow next to the material sphere in the **LOD 0**\
    \ section of the Details panel. Whenever you see a small arrow like that in the\
    \ Unreal Engine, clicking will allow you to use whatever you have selected in\
    \ the **Content Browser**.\n\n4.  Your material will appear on your crate. Feel\
    \ free to try a few different options to find what you think works best.\n\nFor\
    \ our next game asset that we will create later in this book, we will use a custom\
    \ material that will really make the object stand out. Once we have the material\
    \ setting complete, there is only one more setting that we need to change. Unreal\
    \ likes to generate its own UV channel for storing lighting information. However,\
    \ back in [Chapter 3](#ch03.xhtml \"Chapter 3. It's Time to Customize!\"), *It's\
    \ Time to Customize!*, we created our own using Blender's Lightmap Pack feature,\
    \ and we want to tell Unreal to use it, since ours is quite a bit better:\n\n\
    ![Setting up and using our new 3D asset](OEBPS/Images/BO5189_04_12.jpg)\n\nTelling\
    \ Unreal to use our Lightmap we created within Blender\n\nHere's how you can generate\
    \ a Lightmap for your object:\n\n1.  Under the **LOD 0** section of the Details\
    \ panel, find the **Generate Lightmap UVs** option and turn it off. This tells\
    \ Unreal that we do not want it to create its own UV channel for lighting information.\n\
    \n2.  Find the **Source** **Lightmap Index** setting. This tells Unreal which\
    \ UV map to use when doing light calculations. Change this setting to `1`.\n\n\
    3.  Finally, go to the **Destination Lightmap Index** and change this to `1` as\
    \ well. This tells Unreal to record the light and shadow information on the UV\
    \ channel that we created.\n\nDone! Our crate is ready for use:\n\n![Setting up\
    \ and using our new 3D asset](OEBPS/Images/BO5189_04_13.jpg)\n\nThe final crate\
    \ inside our level. Congratulations!\n\nTake a few minutes and replace a few of\
    \ the cubes in the cargo bay with our new game asset. To really add some variation,\
    \ try scaling a few of them up or down. Once the area is decorated to your liking,\
    \ remember to save your level and press the **Build** button. Now drop into your\
    \ level and check out the space!\n\n# Summary"
