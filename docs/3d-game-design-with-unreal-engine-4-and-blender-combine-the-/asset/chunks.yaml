- raw: "6.  To start, we will need a **Delay** node and a **Print String** node. Both\
    \ of these can be found using the search box in the **Palette** panel. For the\
    \ **Delay** node, go ahead and leave the **Duration** at `0.2`. Change the **In\
    \ String** option on the **Print String** node to read `Explosives Armed: 5`.\
    \ Left-click and drag to select both of these nodes and copy/paste them. On these\
    \ new nodes, change the **Duration** on the delay to `1.0` and the **In String**\
    \ on the **Print String** node to `Explosives Armed: 4`. Repeat the process three\
    \ more times to complete the countdown. The last node in the sequence is the **Activate**\
    \ node. Since we turned off the **Auto Activate** option on our **Explosion Cue**,\
    \ this node will activate the component and play the sound. With all of our pieces\
    \ now in the **Blueprint** window, connect them together just like the preceding\
    \ image.\n\n7.  Save and compile our class Blueprint. Save your level and press\
    \ **Play** to test it!\n\nNow that we have our sound effect working, there are\
    \ only a few move steps to complete our explosion. However, there are a lot of\
    \ other opportunities for using sounds in this Blueprint. For example, we could\
    \ add an opening sound to the Artifact, or some eerie music to play while it's\
    \ open. Experiment and see how you can use sound to further enhance the mood!\n\
    \n# Using particle effects\n\nThe sounds of our explosion are all in place and\
    \ the Artifact is ready for destruction! To finish our explosion, we are going\
    \ to need some particle effects. We used various particle effects back in [Chapter\
    \ 5](#ch05.xhtml \"Chapter 5. Taking This Level Up a Notch\"), *Taking This Level\
    \ Up a Notch*, to enhance our scripted events at the security checkpoint and the\
    \ elevator. Here we will use an explosion, fire, and smoke to enhance the destruction\
    \ effect and mask when we delete the different components of the Artifact. Let's\
    \ take a look:\n\n![Using particle effects](OEBPS/Images/B05189_09_16.jpg)\n\n\
    Add an explosion particle, a fire particle, and a smoke particle to the Components\
    \ list. Be sure to turn off Auto Activate!\n\nTo our already extensive list of\
    \ components, we will add explosion, fire, and smoke particle emitters. Add each\
    \ emitter, just like we added our sound, and then select each one and disable\
    \ the  **Auto Activate** option in the **Details** panel. We will use the Blueprint\
    \ node **Activate** to turn those back on later.\n\n![Using particle effects](OEBPS/Images/B05189_09_17.jpg)\n\
    \nCreate two separate Class Blueprints for the top and bottom pieces of the Artefact.\
    \ We will use them as shrapnel in the explosion\n\nThe last piece necessary to\
    \ really make this explosion great is to add flying chunks! When a solid object\
    \ explodes, parts of it tend to go flying in all directions. We will simulate\
    \ this by having our Blueprints spawn versions of the bottom and the top of the\
    \ Artifact, with physics enabled, which will fly around and stay in the level\
    \ after the rest of the Artifact has been destroyed:\n\n1.  This will require\
    \ us to head back to Blender and export versions of our **Top** and **Bottom**\
    \ as separate FBX files. Open our **Blender** file and select the **Top** of the\
    \ Artifact. Head up to the **File** menu and head to the **FBX Export** screen.\
    \ Turn on the **Selected Objects** option so that only the **Top** is exported.\
    \ Also, head to the **Geometries** tab and change the **Smoothing** option to\
    \ **Face**. Name it something unique and export! Rinse and repeat for our **Bottom**\
    \ piece and prepare to import them into Unreal.\n\n2.  Import both of our new\
    \ FBX files into Unreal as static meshes, and apply our artifact material to them.\
    \ You will notice that even though we did not import the whole model, our material\
    \ still works perfectly. This is because the UV maps for each piece are still\
    \ the same, whether we use the whole Artifact or only parts.\n\n3.  Time to create\
    \ two new class Blueprints. Create a class `Blueprint` for each new static mesh\
    \ by clicking the **Blueprint** button, selecting **New Empty Blueprint Class**,\
    \ and selecting **Actor** as the **Parent Class**. I named mine `ArtifactTopChunk`\
    \ and `ArtifactBotChunk`.\n\n4.  In each Blueprint, add the appropriate static\
    \ mesh as a component. Just add it in; there is no need to move it. This way,\
    \ they will be in the exact position we need them to be when we use our Blueprint\
    \ to spawn them.\n\n5.  Now we need to make a couple of changes to their **Details**.\
    \ ![Using particle effects](OEBPS/Images/B05189_09_18.jpg)\n\n    Apply physics\
    \ to our flying pieces\n\n6.  For each of our new Blueprints, click the component\
    \ and find the **Physics** section in the **Details** panel. First, turn on **Simulate\
    \ Physics**. This will allow our objects to bounce around and be affected by gravity\
    \ and outside forces. Next, turn on **Mass** **in Kg**. Normally, Unreal will\
    \ calculate a physics object's mass, based on its size in the level. Both of our\
    \ pieces come in at around 500 kg, not very good for being flying shrapnel. Turning\
    \ on **Mass in Kg** allows us to override Unreal's best guess and fill in whatever\
    \ value we wish for its weight. I used `50` kg, but feel free to use whatever\
    \ you wish. It can always be adjusted later. Be sure to do this for both the **Top**\
    \ and **Bottom** Artifact chunks.\n\nTime to finish the Artifact's demise. Back\
    \ in the Artifact class Blueprint, there is one more **Component** to add to our\
    \ setup. To make our **Top** and **Bottom** chunks fly, we will use a **Radial\
    \ Impulse** component to simulate the force of the blast. Add the **Radial Impulse**\
    \ through the **Add Component** menu and find the **Radial Force Component** section\
    \ of the **Details** panel. The radius that the impulse will affect is shown in\
    \ the viewport as a light blue sphere. Increase the size of the **Radius** property\
    \ until it covers the entire Artifact. I used `250`. Also in the **Details** panel,\
    \ find the **Impulse** section and increase the **Impulse Strength**. I used `2000`.\
    \ Lastly, make sure to turn on the **Impulse Vel Change** option. This option\
    \ makes sure that the 2000 units of force are applied directly as a velocity change.\
    \ This will guarantee to throw our chunks a good distance and maybe even the player!\n\
    \nTime for the last bit of programming! Let's take a look:\n\n![Using particle\
    \ effects](OEBPS/Images/B05189_09_19.jpg)\n\nActivate the explosion, fire, and\
    \ smoke particles and then destroy the mesh portions. We will then use two Spawn\
    \ Actor From Class nodes to spawn our Top and Bottom chunks. Finally, fire the\
    \ Radial Impulse to watch them bounce!\n\nThere isn't too much to this final section.\
    \ We will use a second **Activate** node off the end of the countdown section\
    \ to activate all of our particle effects. Then use a **Destroy Component** node\
    \ to get rid of the components that would be destroyed in the blast. Next, we\
    \ will use two **Spawn Actor From Class** nodes to spawn our two chunks, before\
    \ finally using a **Fire Impulse** node to throw them away from the blast. Lastly,\
    \ we will **Delay** 4 seconds before using a **Destroy Actor** to clean up the\
    \ whole thing. Start by using the search box in the **Palette** to grab the **Activate**\
    \ node. Place it at the end of the countdown sequence and connect it to the **Activate**\
    \ node we used to play our sound cue. The **Activate** node needs one or more\
    \ **Targets** to know what to turn on. From the **Components** panel grab the\
    \ **P\\_Explosion**, **P\\_Smoke**, and **P\\_Fire** components and drag them\
    \ into the Blueprint. Connect these to **Target** node on the **Activate** node.\n\
    \nNext in line is the **Destroy Component** node. We will use this node to delete\
    \ everything that would be destroyed in the explosion. Connect it to our **Activate**\
    \ node and set its **Targets** to be the Artifact, the collision box, and all\
    \ the tentacles.\n\nTime for **Spawn Actor**  **From Class**! This great node\
    \ allows us to use Blueprints to spawn other class Blueprints, but requires a\
    \ few more parameters than **Activate** or **Destroy Component**."
