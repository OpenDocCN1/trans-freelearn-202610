- raw: "10.  When we created a similar type of control for the elevator back in [Chapter\
    \ 2](#ch02.xhtml \"Chapter 2. Starting Our First Project\"), *Starting Our First\
    \ Project*, we used a **Gate** to control the flow of information through the\
    \ Blueprint. However, **Gates** don't function the same within class Blueprints,\
    \ so we require a slightly different approach. The first step in the process is\
    \ to use the **Enable Input** and **Disable Input** nodes, to allow the player\
    \ to use input keys when they are within our box collision. Using the search box\
    \ located within our **Palette**, grab an **Enable Input** and a **Disable Input**.\
    \ Now we need to add our trigger events. Click on the **Box** variable within\
    \ the **Variable** section of the **My Blueprint** panel. This changes the **Details**\
    \ panel to display a list of all the **Events** that can be created for this component.\
    \ Click the **+** button next to the **OnComponentBeginOverlap** and the **OnComponentEndOverlap**\
    \ events. Connect the **OnComponentBeginOverlap** event to the **Enable Input**\
    \ node, and the **OnComponentEndOverlap** event to the **Disable Input** node.\n\
    \n11.  Next, create an event for the player pressing the *E* key by searching\
    \ for it and dragging it in from the **Palette**. ![Creating a class blueprint\
    \ to tie it all together](OEBPS/Images/B05189_09_24.jpg)\n\n     Creating the\
    \ toggle for opening the Artefact\n\n12.  To that, we will add a **Do Once** node.\
    \ This node works similar to a **Gate** in that it restricts the flow of information\
    \ through the network, but it does allow the action to happen once before closing.\
    \ This will make it so the player can press *E* to open the Artifact, but the\
    \ animation will only play once. Without it, a player can press *E* as many times\
    \ as they want, playing the animation over and over again. It's fun for a while,\
    \ since it makes it look like a mouth trying to eat you, but it's not our original\
    \ intention (I might have spent some time pressing it repeatedly and laughing\
    \ hysterically). **Do Once** can be easily found in the **Palette**. Lastly, we\
    \ will need a **Play Animation** node. There are two versions, so be sure to grab\
    \ this node from the **Skeletal Mesh** section of your search so that its target\
    \ is **Skeletal Mesh Component**. Connect the input **E** event to the **Do Once**\
    \ node, and the **Do Once** node to the **Play Animation**.\n\n13.  One last thing\
    \ to complete this sequence. We need to set the target and animation to play on\
    \ the **Play Animation** node. So the target will be our **Skeletal Mesh** component.\
    \ Click on the **Artifact** component in the **Components** list, drag it into\
    \ the **Blueprint** window, and plug that into the **Target** on our **Play**\
    \ **Animation**. Lastly, click the dropdown under the **New Anim to Play** option\
    \ on the **Play Animation** node and select our animation of the Artifact opening.\
    \ We're done!\n\nLet's save all of our files and test this out. Drag the **Artifact**\
    \ into our space station and position it in the Import/Export Broker's shop. Build\
    \ the level and then drop it in and test it. Did it open? Does it need more tentacles?\
    \ Debug and refine it until it is exactly what you want.\n\n# Using sound effects\n\
    \nNow that we have the Artifact, tentacles, and animation working in our level,\
    \ we could just stop there and call it done, right? We could, but wouldn't it\
    \ be more fun give the player an opportunity to strike back at the dark power\
    \ that has taken over our space station? Let's blow that Artifact up!\n\nBefore\
    \ we just jump right in, we need to plan this out a bit. This will help us be\
    \ able to think through the programming logic of the blueprint sequence and plan\
    \ out how to build the explosion. So what goes into a great video game explosion?\
    \ Well there has to be sound. Without a good solid explosion sound, any attempt\
    \ at this will fall flat. We also need fire, smoke, and chunks to really make\
    \ it shine. There has to be some type of instigating event, such as time, player\
    \ interaction, or damage. Lastly, a rough sequence of events might be event, sound,\
    \ explosion particle, smoke particle, delete object, and chunky particle. This\
    \ way the smoke, explosion, and chunky particle effect will cover when we delete\
    \ the exploding asset. Just our luck, Unreal has most of those pieces in the `Starter\
    \ Content` folder!\n\nLet's start prepping for our explosion within our class\
    \ Blueprint by adding the sound effects and setting them to trigger when we need\
    \ them.\n\n![Using sound effects](OEBPS/Images/B05189_09_12.jpg)\n\nTurn off Auto\
    \ Activate in the Details panel\n\n### Tip\n\nSounds can be imported into Unreal\
    \ in the same we have imported other assets. If you feel the Starter Content sounds\
    \ don't fit for your explosion, feel free to search for `Royalty Free` sounds.\
    \ These are sounds that can be used in your projects for either free or a small\
    \ upfront fee. `Royalty Free` means that beyond the initial payment, there is\
    \ no further payment required.\n\n1.  Adding sounds to our class blueprint is\
    \ similar to adding any other type of **component** and can provide some real\
    \ depth to our explosion. In the **Class Blueprint** editor, click the **Add Component**\
    \ button and select **Audio** from the list. Next, with the audio component selected,\
    \ head to the **Details** panel and find the **Sound** option. Here, you will\
    \ find a field where we can assign a **Sound Wave** or a **Sound Cue** by selecting\
    \ it in the **Content Browser** and then clicking the small arrow. Alternately,\
    \ you can select the sound you want to use before clicking the **Add Component**\
    \ button, and Unreal will add the selected sound. Let's make this one the **Explosion\
    \ Cue**. To make sure it only goes off when we want it to, select it and head\
    \ to the **Details** panel. Find the **Auto Activate** option and turn it off.\
    \ \n\n    ### Tip\n\n    Tip: The difference between a Sound Wave and a Sound\
    \ Cue is very similar to the differences between Textures and Materials. Sound\
    \ Waves make up Sound Cues, along with a few special Blueprint nodes. Double-click\
    \ the **Explosion Cue** and take a look!\n\n2.  Time to add on a bit to our Artifact's\
    \ programming! I know, everyone gets excited about this part. Let's add a bit\
    \ of fun to our explosion and add a countdown clock. ![Using sound effects](OEBPS/Images/B05189_09_13.jpg)\n\
    \n    Programming the countdown clock for the explosion\n\n3.  We will branch\
    \ this functionality off the event on pressing *E* using a **Flip Flop** node.\
    \ ![Using sound effects](OEBPS/Images/B05189_09_14.jpg)\n\n    Connect the countdown\
    \ to branch B on the Flip Flop we created earlier\n\n4.  Back in [Chapter 2](#ch02.xhtml\
    \ \"Chapter 2. Starting Our First Project\"), *Starting Our First Project*, we\
    \ used a **Flip Flop** node to control our cargo elevator. Essentially, the node\
    \ will do branch **A** and then branch **B**, alternating between them. We will\
    \ use it to allow the *E* key to first open the Artifact and then allow the player\
    \ to place a bomb and start a countdown. Head over to the search box in the **Palette**\
    \ panel, search for **Flip Flop**, and drag one into the **Blueprint** window.\
    \ Break the connection between the **E** event and the **Do Once** node, and connect\
    \ it up as shown in the preceding image.\n\n5.  Let's create the countdown. For\
    \ this feature, we will use the **Print String** node to print out a 5-second\
    \ countdown before we trigger our explosion sound. ![Using sound effects](OEBPS/Images/B05189_09_15.jpg)\n\
    \n    Program the Print String nodes in the countdown"
  fmt: "\n# Artifact Interaction and Explosion Setup\n\n## Steps 10–13: Artifact Opening\
    \ Mechanism\n\n### Step 10: Enable/Disable Input with Box Collision\n\nWhen we\
    \ created a similar type of control for the elevator back in [Chapter 2](#ch02.xhtml\
    \ \"Chapter 2. Starting Our First Project\"), *Starting Our First Project*, we\
    \ used a `Gate` to control the flow of information through the Blueprint. However,\
    \ `Gate`s don't function the same within class Blueprints, so we require a slightly\
    \ different approach. The first step in the process is to use the `Enable Input`\
    \ and `Disable Input` nodes, to allow the player to use input keys when they are\
    \ within our box collision. Using the search box located within our `Palette`,\
    \ grab an `Enable Input` and a `Disable Input`. Now we need to add our trigger\
    \ events. Click on the `Box` variable within the `Variable` section of the `My\
    \ Blueprint` panel. This changes the `Details` panel to display a list of all\
    \ the `Events` that can be created for this component. Click the `+` button next\
    \ to the `OnComponentBeginOverlap` and the `OnComponentEndOverlap` events. Connect\
    \ the `OnComponentBeginOverlap` event to the `Enable Input` node, and the `OnComponentEndOverlap`\
    \ event to the `Disable Input` node.\n\n### Step 11: Create E Key Event\n\nNext,\
    \ create an event for the player pressing the `E` key by searching for it and\
    \ dragging it in from the `Palette`.\n\n![Creating a class blueprint to tie it\
    \ all together](OEBPS/Images/B05189_09_24.jpg)\n\n*Creating the toggle for opening\
    \ the Artefact*\n\n### Step 12: Add Do Once and Play Animation Nodes\n\nTo that,\
    \ we will add a `Do Once` node. This node works similar to a `Gate` in that it\
    \ restricts the flow of information through the network, but it does allow the\
    \ action to happen once before closing. This will make it so the player can press\
    \ `E` to open the Artifact, but the animation will only play once. Without it,\
    \ a player can press `E` as many times as they want, playing the animation over\
    \ and over again. It's fun for a while, since it makes it look like a mouth trying\
    \ to eat you, but it's not our original intention (I might have spent some time\
    \ pressing it repeatedly and laughing hysterically). `Do Once` can be easily found\
    \ in the `Palette`. Lastly, we will need a `Play Animation` node. There are two\
    \ versions, so be sure to grab this node from the `Skeletal Mesh` section of your\
    \ search so that its target is `Skeletal Mesh Component`. Connect the input `E`\
    \ event to the `Do Once` node, and the `Do Once` node to the `Play Animation`.\n\
    \n### Step 13: Set Animation Target and Clip\n\nOne last thing to complete this\
    \ sequence. We need to set the target and animation to play on the `Play Animation`\
    \ node. So the target will be our `Skeletal Mesh` component. Click on the `Artifact`\
    \ component in the `Components` list, drag it into the `Blueprint` window, and\
    \ plug that into the `Target` on our `Play Animation`. Lastly, click the dropdown\
    \ under the `New Anim to Play` option on the `Play Animation` node and select\
    \ our animation of the Artifact opening. We're done!\n\nLet's save all of our\
    \ files and test this out. Drag the `Artifact` into our space station and position\
    \ it in the Import/Export Broker's shop. Build the level and then drop it in and\
    \ test it. Did it open? Does it need more tentacles? Debug and refine it until\
    \ it is exactly what you want.\n\n## Using Sound Effects\n\nNow that we have the\
    \ Artifact, tentacles, and animation working in our level, we could just stop\
    \ there and call it done, right? We could, but wouldn't it be more fun give the\
    \ player an opportunity to strike back at the dark power that has taken over our\
    \ space station? Let's blow that Artifact up!\n\nBefore we just jump right in,\
    \ we need to plan this out a bit. This will help us be able to think through the\
    \ programming logic of the blueprint sequence and plan out how to build the explosion.\
    \ So what goes into a great video game explosion? Well there has to be sound.\
    \ Without a good solid explosion sound, any attempt at this will fall flat. We\
    \ also need fire, smoke, and chunks to really make it shine. There has to be some\
    \ type of instigating event, such as time, player interaction, or damage. Lastly,\
    \ a rough sequence of events might be event, sound, explosion particle, smoke\
    \ particle, delete object, and chunky particle. This way the smoke, explosion,\
    \ and chunky particle effect will cover when we delete the exploding asset. Just\
    \ our luck, Unreal has most of those pieces in the `Starter Content` folder!\n\
    \nLet's start prepping for our explosion within our class Blueprint by adding\
    \ the sound effects and setting them to trigger when we need them.\n\n![Using\
    \ sound effects](OEBPS/Images/B05189_09_12.jpg)\n\n*Turn off Auto Activate in\
    \ the Details panel*\n\n### Tip\n\nSounds can be imported into Unreal in the same\
    \ way we have imported other assets. If you feel the `Starter Content` sounds\
    \ don't fit for your explosion, feel free to search for `Royalty Free` sounds.\
    \ These are sounds that can be used in your projects for either free or a small\
    \ upfront fee. `Royalty Free` means that beyond the initial payment, there is\
    \ no further payment required.\n\n### Adding Audio Components\n\n1.  Adding sounds\
    \ to our class blueprint is similar to adding any other type of `component` and\
    \ can provide some real depth to our explosion. In the `Class Blueprint` editor,\
    \ click the `Add Component` button and select `Audio` from the list. Next, with\
    \ the audio component selected, head to the `Details` panel and find the `Sound`\
    \ option. Here, you will find a field where we can assign a `Sound Wave` or a\
    \ `Sound Cue` by selecting it in the `Content Browser` and then clicking the small\
    \ arrow. Alternately, you can select the sound you want to use before clicking\
    \ the `Add Component` button, and Unreal will add the selected sound. Let's make\
    \ this one the `Explosion Cue`. To make sure it only goes off when we want it\
    \ to, select it and head to the `Details` panel. Find the `Auto Activate` option\
    \ and turn it off.\n\n    ### Tip\n\n    The difference between a `Sound Wave`\
    \ and a `Sound Cue` is very similar to the differences between Textures and Materials.\
    \ `Sound Wave`s make up `Sound Cue`s, along with a few special Blueprint nodes.\
    \ Double-click the `Explosion Cue` and take a look!\n\n### Programming the Countdown\
    \ Clock\n\n2.  Time to add on a bit to our Artifact's programming! I know, everyone\
    \ gets excited about this part. Let's add a bit of fun to our explosion and add\
    \ a countdown clock.\n\n    ![Using sound effects](OEBPS/Images/B05189_09_13.jpg)\n\
    \n    *Programming the countdown clock for the explosion*\n\n### Implementing\
    \ Flip Flop Logic\n\n3.  We will branch this functionality off the event on pressing\
    \ `E` using a `Flip Flop` node.\n\n    ![Using sound effects](OEBPS/Images/B05189_09_14.jpg)\n\
    \n    *Connect the countdown to branch B on the Flip Flop we created earlier*\n\
    \n4.  Back in [Chapter 2](#ch02.xhtml \"Chapter 2. Starting Our First Project\"\
    ), *Starting Our First Project*, we used a `Flip Flop` node to control our cargo\
    \ elevator. Essentially, the node will do branch `A` and then branch `B`, alternating\
    \ between them. We will use it to allow the `E` key to first open the Artifact\
    \ and then allow the player to place a bomb and start a countdown. Head over to\
    \ the search box in the `Palette` panel, search for `Flip Flop`, and drag one\
    \ into the `Blueprint` window. Break the connection between the `E` event and\
    \ the `Do Once` node, and connect it up as shown in the preceding image.\n\n###\
    \ Setting Up Print String Countdown\n\n5.  Let's create the countdown. For this\
    \ feature, we will use the `Print String` node to print out a 5-second countdown\
    \ before we trigger our explosion sound.\n\n    ![Using sound effects](OEBPS/Images/B05189_09_15.jpg)\n\
    \n    *Program the Print String nodes in the countdown*\n"
  trans: "\n# 制品交互与爆炸设置\n\n## 步骤 10–13：制品开启机制\n\n### 步骤 10：使用盒体碰撞启用/禁用输入\n\n当我们在第\
    \ 2 章《开始我们的第一个项目》中为电梯创建类似类型的控制时，我们使用了 `Gate` 节点来控制蓝图中信息的流向。然而，`Gate` 节点在类蓝图中的工作方式并不相同，因此我们需要一种略微不同的方法。该过程的第一步是使用\
    \ `Enable Input`（启用输入）和 `Disable Input`（禁用输入）节点，以允许玩家在进入我们的盒体碰撞体积时使用输入键。使用位于 `Palette`（调色板）面板中的搜索框，获取一个\
    \ `Enable Input` 和一个 `Disable Input`。现在我们需要添加触发事件。点击 `My Blueprint`（我的蓝图）面板中 `Variable`（变量）部分下的\
    \ `Box`（盒体）变量。这会更改 `Details`（详情）面板，以显示可为此组件创建的所有 `Events`（事件）列表。点击 `OnComponentBeginOverlap`（组件开始重叠）和\
    \ `OnComponentEndOverlap`（组件结束重叠）事件旁边的 `+` 按钮。将 `OnComponentBeginOverlap` 事件连接到\
    \ `Enable Input` 节点，将 `OnComponentEndOverlap` 事件连接到 `Disable Input` 节点。\n\n###\
    \ 步骤 11：创建 E 键事件\n\n接下来，通过搜索并从 `Palette`（调色板）拖入，创建一个玩家按下 `E` 键的事件。\n\n![创建类蓝图以将所有内容串联起来](img/B05189_09_24.jpg)\n\
    \n*创建打开制品的切换开关*\n\n### 步骤 12：添加 Do Once 和 Play Animation 节点\n\n为此，我们将添加一个 `Do\
    \ Once`（执行一次）节点。该节点的工作原理类似于 `Gate`，它限制网络中信息的流向，但它确实允许动作在关闭前发生一次。这将使玩家可以按 `E` 打开制品，但动画只播放一次。没有它，玩家可以想按多少次\
    \ `E` 就按多少次，反复播放动画。这玩一会儿挺有趣的，因为看起来像张嘴试图吃掉你，但这不是我们的初衷（我可能花了一些时间反复按它并歇斯底里地大笑）。`Do\
    \ Once` 可以在 `Palette`（调色板）中轻松找到。最后，我们将需要一个 `Play Animation`（播放动画）节点。有两个版本，所以请务必从搜索结果的\
    \ `Skeletal Mesh`（骨骼网格体）部分获取此节点，以便其目标为 `Skeletal Mesh Component`（骨骼网格体组件）。将输入\
    \ `E` 事件连接到 `Do Once` 节点，再将 `Do Once` 节点连接到 `Play Animation`。\n\n### 步骤 13：设置动画目标和剪辑\n\
    \n还有一件事就能完成这个序列。我们需要在 `Play Animation` 节点上设置要播放的目标和动画。因此目标将是我们的 `Skeletal Mesh`（骨骼网格体）组件。点击\
    \ `Components`（组件）列表中的 `Artifact`（制品）组件，将其拖入 `Blueprint`（蓝图）窗口，并将其插入到我们的 `Play\
    \ Animation` 的 `Target`（目标）引脚上。最后，点击 `Play Animation` 节点上 `New Anim to Play`（要播放的新动画）选项下的下拉菜单，选择制品打开的动画。大功告成！\n\
    \n让我们保存所有文件并测试一下。将 `Artifact` 拖入我们的空间站，并将其放置在进出口经纪人的商店里。构建关卡，然后放入并测试。它打开了吗？需要更多触手吗？调试并改进它，直到它完全符合你的要求。\n\
    \n## 使用音效\n\n现在我们在关卡中已经有了制品、触手和动画在工作，我们可以就此停手并宣布完成，对吧？我们可以，但给玩家一个机会反击占领我们空间站的黑暗力量，不是更有趣吗？让我们把那个制品炸飞！\n\
    \n在直接动手之前，我们需要稍作规划。这将帮助我们理清蓝图序列的编程逻辑，并规划如何构建爆炸。那么，一个很棒的游戏爆炸效果需要什么？首先必须有声音。没有扎实的爆炸音效，任何尝试都会显得平淡无奇。我们还需要火焰、烟雾和碎片才能真正让它大放异彩。必须有某种触发事件，例如时间、玩家交互或伤害。最后，大致的事件顺序可能是：事件、声音、爆炸粒子、烟雾粒子、删除物体、碎片粒子。这样，烟雾、爆炸和碎片粒子效果就会在我们删除爆炸资产时进行遮挡。幸运的是，Unreal\
    \ 的 `Starter Content`（初学者内容）文件夹里有其中的大部分素材！\n\n让我们开始在类蓝图中为爆炸做准备，添加音效并设置它们在我们需要时触发。\n\
    \n![使用音效](img/B05189_09_12.jpg)\n\n*在详情面板中关闭自动激活*\n\n### 提示\n\n声音可以用与导入其他资产相同的方式导入\
    \ Unreal。如果你觉得 `Starter Content` 的声音不适合你的爆炸，请随意搜索 `Royalty Free`（免版税）声音。这些声音可以在你的项目中免费或支付少量一次性费用后使用。`Royalty\
    \ Free` 意味着除了最初的付款外，无需再支付任何费用。\n\n### 添加音频组件\n\n1.  向类蓝图添加声音类似于添加任何其他类型的 `component`（组件），并能为我们的爆炸增添真实的深度。在\
    \ `Class Blueprint`（类蓝图）编辑器中，点击 `Add Component`（添加组件）按钮并从列表中选择 `Audio`（音频）。接下来，选中音频组件，前往\
    \ `Details`（详情）面板并找到 `Sound`（声音）选项。在这里，你会找到一个字段，我们可以通过在 `Content Browser`（内容浏览器）中选择\
    \ `Sound Wave`（声波）或 `Sound Cue`（声音提示）然后点击小箭头来分配它。或者，你可以在点击 `Add Component` 按钮之前选择想要使用的声音，Unreal\
    \ 会添加选定的声音。让我们把这个设为 `Explosion Cue`（爆炸提示）。为了确保它只在我们想要的时候触发，选中它并前往 `Details` 面板。找到\
    \ `Auto Activate`（自动激活）选项并将其关闭。\n\n    ### 提示\n\n    `Sound Wave`（声波）和 `Sound\
    \ Cue`（声音提示）的区别非常类似于纹理和材质的区别。`Sound Wave` 连同一些特殊的蓝图节点组成了 `Sound Cue`。双击 `Explosion\
    \ Cue` 看看吧！\n\n### 编程倒计时时钟\n\n2.  是时候为制品的编程添加一点内容了！我知道，大家对这部分都很兴奋。让我们为爆炸增加一点乐趣，加个倒计时。\n\
    \n    ![使用音效](img/B05189_09_13.jpg)\n\n    *为爆炸编程倒计时*\n\n### 实现 Flip Flop 逻辑\n\
    \n3.  我们将使用 `Flip Flop`（翻转）节点，从按下 `E` 键的事件分支出此功能。\n\n    ![使用音效](img/B05189_09_14.jpg)\n\
    \n    *将倒计时连接到我们之前创建的 Flip Flop 的 B 分支*\n\n4.  回到第 2 章《开始我们的第一个项目》，我们使用 `Flip\
    \ Flop` 节点控制货梯。本质上，该节点会先执行分支 `A`，然后执行分支 `B`，在两者之间交替。我们将用它来让 `E` 键先打开制品，然后允许玩家放置炸弹并开始倒计时。前往\
    \ `Palette`（调色板）面板中的搜索框，搜索 `Flip Flop`，并将一个拖入 `Blueprint`（蓝图）窗口。断开 `E` 事件与 `Do\
    \ Once` 节点之间的连接，并按上图所示进行连接。\n\n### 设置 Print String 倒计时\n\n5.  让我们创建倒计时。对于此功能，我们将使用\
    \ `Print String`（打印字符串）节点在触发爆炸声音前打印出 5 秒倒计时。\n\n    ![使用音效](img/B05189_09_15.jpg)\n\
    \n    *在倒计时中编程 Print String 节点*\n"
