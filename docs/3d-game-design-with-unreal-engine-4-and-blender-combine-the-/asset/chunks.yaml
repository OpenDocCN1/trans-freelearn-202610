  trans: '


    ## 箱子建模步骤（6–15）


    ### 步骤 6：为接缝切割线条

    现在我们需要切割线条，以创建盖子嵌合到箱子上的接缝位置。从左侧菜单点击 `Loop Cut and Slide`（循环切割和滑移）工具，或按 `Ctrl+R`。将鼠标移至箱子上方，直到出现一条紫色线条水平穿过下部区域。点击
    `LMB`（左键）；这会将线条变为橙色，并允许你沿箱子上下滑动它。当它移动到我们想要的位置时再次点击。


    ### 步骤 7：使用倒角工具分割

    使用 `Bevel`（倒角）工具分割这条新线条。按 `W` 并选择 `Bevel`。我将其分割了 `0.05`：


    ![使用多边形建模的基本工具](img/BO5189_03_11.jpg)


    *使用缩放工具创建盖子接缝*


    ### 步骤 8：缩放盖子多边形

    盖子还需一步：选择盖子外侧周围的四个多边形（按住 `Shift` 键可选择多个多边形），按 `S` 使用 `Scale`（缩放）工具将它们稍微缩小。


    ### 步骤 9：添加垂直循环切割

    接下来我们将在侧面添加细节。沿 `Y` 轴（绿色轴），我们将使用 `Loop Cut and Slide`（循环切割和滑移）工具，在物体周围垂直切割四条线。


    ### 步骤 10：创建四条垂直线

    移动鼠标以获得沿箱子垂直的紫色参考线，然后使用鼠标滚轮直到出现四条线。点击鼠标切割线条，然后在不移动鼠标的情况下再次点击以使它们保持居中：


    ![使用多边形建模的基本工具](img/BO5189_03_12.jpg)


    *挤出多边形以在箱子侧面添加一些凸起区域*


    ### 步骤 11：挤出侧面条带和底部滑轨

    现在我们将选择一些新多边形，以创建箱子侧面的条带。使用 `Extrude Individual`（单独挤出）工具 `Extrude`（挤出）它们，并将其拉出到合适的大小。同时通过拉出两侧的外侧多边形和中间的多边形，`Extrude`（挤出）箱子底部的滑轨：


    ![使用多边形建模的基本工具](img/BO5189_03_13.jpg)


    *创建锁扣*


    ### 步骤 12：添加锁扣边循环

    让我们添加锁扣。使用 `Loop Cut and Slide`（循环切割和滑移）在箱子周围添加一条水平边循环。然后在箱子前面添加两条垂直边循环：


    ![使用多边形建模的基本工具](img/BO5189_03_14.jpg)


    *完成锁扣*


    ### 步骤 13：挤出锁扣

    完成锁扣是一个两步 `Extrude`（挤出）过程。选择图中所示的三个多边形并 `Extrude`（挤出）它们向外。然后选择锁扣顶部的两个多边形并 `Extrude`（挤出）它们：


    ![使用多边形建模的基本工具](img/BO5189_03_15.jpg)


    *使用镜像修改器创建对称*


    ### 步骤 14：将物体切半以进行镜像

    现在为了确保所有东西都是均匀的，我们将使用 `Mirror`（镜像）修改器。使用 `Loop Cut and Slide`（循环切割和滑移）从前向后切割一条垂直线，将物体切成两半。接下来，按
    `B` 进行框选，选择箱子的一半。按 `Delete` 键并选择 `Faces`（面）以删除箱子的一半。


    ### 步骤 15：应用镜像修改器

    最后，通过点击 `Properties`（属性）面板中的扳手图标来打开 `Modifier`（修改器）菜单，添加 `Mirror`（镜像）修改器。点击 `Add
    Modifier`（添加修改器）下拉菜单并选择 `Mirror`。操作设置直到成功使物体恢复完整。一切设置好后，返回 `Object`（物体）模式，并在 `Modifier`（修改器）菜单中点击
    `Apply`（应用）。修改器无法在 `Edit`（编辑）模式下添加。完成了！作为我们的第一个道具，这已经很不错了。它看起来可以装下任何东西，从食物到在黑暗中猎杀你的可怕变异基因怪物。


    # 如何使用 UV 映射及其重要性


    此时，我们已经确定了箱子的几何体或基本形状，但它看起来仍然不像我们在其他游戏中看到的物体。原因是纹理。为物体添加纹理将创建所有那些细节，使我们的游戏资产配得上我们构建的关卡。制作纹理并将其应用到物体上是一个两步过程。首先，我们需要告诉纹理如何表现，这需要
    UV 贴图：


    ![如何使用 UV 映射及其重要性](img/BO5189_03_16.jpg)


    *使用基础立方体学习展开*


    UV 贴图是一组坐标，告诉我们放置在游戏资产上的纹理贴图如何环绕物体。其原理是获取你的 3D 物体并将其展平，以便我们能以一种不会撕裂或拉伸纹理的方式将图像应用到外部。这使我们能够创建详细的纹理贴图，应用诸如刮擦边缘、锈斑、油漆颜色、可视屏幕等效果。没有它，Unreal
    将不知道如何在游戏中为物体贴图。它也无法正确应用光照，因为 Unreal 使用 UV 贴图来应用光影：


    ![如何使用 UV 映射及其重要性](img/BO5189_03_17.jpg)


    *UV 映射菜单*


    那么我们在 Blender 中如何操作呢？该应用程序为我们提供了添加 UV 贴图的几种选项，其中一些比其他选项更适合我们创建的内容：


    - **`Smart UV Project`（智能 UV 投影）**：适用于建筑和机械物体，`Smart UV Project` 根据几何体的角度变化创建自定义
    UV 布局。它会尽力以合乎逻辑的方式布局所有内容，并可最大程度减少拉伸。该工具尝试合乎逻辑地布局，但可能需要稍微调整。

    - **`Cube Projection`（立方体投影）**：立方体映射将物体分解为六个面并将它们投影到平面上。这会创建六个独立的 UV 岛，可以对其进行操作。

    - **`Project From View`（从视图投影）**：根据所选内容和 3D 视图的角度创建 UV 贴图。例如，你可以选择物体左侧的所有多边形，为视口选择
    `Left Side`（左视图）视图，然后使用此选项。

    - **`Lightmap Pack`（光照贴图打包）**：Unreal 和其他游戏引擎在构建过程中使用光照贴图将阴影烘焙到物体上。`Lightmap Pack`
    可以通过尽可能多地利用 UV 空间，创建更适合光照贴图的 UV 布局。这最大化了物体能承载的光照信息量，并将改善结果。


    # 为游戏资产进行 UV 展开


    UV 映射可能是一个困难的过程，但了解一些最佳实践可以帮助简化该过程：


    ![为游戏资产进行 UV 展开](img/BO5189_03_18.jpg)


    *UV 网格纹理贴图*


    1.  **在过程中使用彩色 UV 网格纹理**：这可以通过在线图片搜索轻松找到，并可在 Blender 中作为材质应用到物体上。务必找到与你想要创建的纹理尺寸相同的图片，例如
    `1024 x 1024` 或 `2048 x 2048`。我使用了一张 `2048 x 2048` 的图片。

    2.  **最小化接缝和拉伸**：将 UV 贴图的接缝隐藏在硬边或玩家看不见的隐藏区域非常重要。幸运的是，像我们的箱子这样的硬表面物体比汽车、植物或动物等具有更多有机曲线的物体更容易展开。

    3.  **保持 UV 元素方向一致**：在布局 UV 贴图时，使所有内容朝向相同方向将使布局和创建纹理贴图变得更加容易。如果纹理美术是团队中的另一位成员，这一点甚至更为重要。

    4.  **小心不要浪费空间**：纹理贴图中浪费的空间越少，直接转化为纹理中像素密度的增加和整体质量的提升。

    5.  **请记住，所有这些都需要练习才能掌握**。


    现在让我们为箱子进行 UV 展开：


    ![为游戏资产进行 UV 展开](img/BO5189_03_19.jpg)


    *使用场景布局下拉菜单将视口更改为 UV 编辑预设*


    1.  选择箱子并进入 `Edit`（编辑）模式（如果你尚未进入）。同时确保你处于多边形选择模式。按两次 `A` 以选择箱子的所有多边形。

    2.  在菜单栏中，转到 `Scene Layout`（场景布局）下拉菜单并选择 `UV Editing`（UV 编辑）。这将把视口分成两半。左侧是你的 UV
    布局，目前为空白。右侧是你的物体。你仍然可以移动和旋转它，以便选择不同的多边形。


    '
