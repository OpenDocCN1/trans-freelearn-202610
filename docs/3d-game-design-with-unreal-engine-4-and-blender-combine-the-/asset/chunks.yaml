- raw: "Although we have taken every care to ensure the accuracy of our content, mistakes\
    \ do happen. If you find a mistake in one of our books—maybe a mistake in the\
    \ text or the code—we would be grateful if you could report this to us. By doing\
    \ so, you can save other readers from frustration and help us improve subsequent\
    \ versions of this book. If you find any errata, please report them by visiting\
    \ [http://www.packtpub.com/submit-errata](http://www.packtpub.com/submit-errata),\
    \ selecting your book, clicking on the **Errata Submission Form** link, and entering\
    \ the details of your errata. Once your errata are verified, your submission will\
    \ be accepted and the errata will be uploaded to our website or added to any list\
    \ of existing errata under the Errata section of that title.\n\nTo view the previously\
    \ submitted errata, go to [https://www.packtpub.com/books/content/support](https://www.packtpub.com/books/content/support)\
    \ and enter the name of the book in the search field. The required information\
    \ will appear under the **Errata** section.\n\n## Piracy\n\nPiracy of copyrighted\
    \ material on the Internet is an ongoing problem across all media. At Packt, we\
    \ take the protection of our copyright and licenses very seriously. If you come\
    \ across any illegal copies of our works in any form on the Internet, please provide\
    \ us with the location address or website name immediately so that we can pursue\
    \ a remedy.\n\nPlease contact us at `<copyright@packtpub.com>` with a link to\
    \ the suspected pirated material.\n\nWe appreciate your help in protecting our\
    \ authors and our ability to bring you valuable content.\n\n## Questions\n\nIf\
    \ you have a problem with any aspect of this book, you can contact us at `<questions@packtpub.com>`,\
    \ and we will do our best to address the problem.\n\nAs game developers, all of\
    \ us have our dream game—that one game that excites us and sticks in our minds\
    \ no matter how many years have passed. For some, that means waiting until another\
    \ game developer builds something like it, but their version never quite matches\
    \ up with our own. For most of us, the desire to see this game made and to be\
    \ able to play it became the catalyst for starting our careers in independent\
    \ game development. As we build our dreams and pour our heart and souls into the\
    \ development of games, we still want to compete with the big boys in today's\
    \ game markets, but we don't have the money for commercial licenses of \"triple\
    \ A\" game engines and high-end 3D software packages. That all changed a few years\
    \ ago when big 3D game engines like **Unreal Engine** went free for indie developers.\
    \ Now smaller developers have the same access to high-end tools that larger developers\
    \ enjoy. These new game engines gave us the ability to build the games of our\
    \ dreams. However, 3D art programs never really followed suit. Many of the industry\
    \ standard creation suites, such as **Autodesk 3ds Max**, still cost thousands\
    \ of dollars. This changed in 2002 with the creation of the  **Blender Foundation**,\
    \ a nonprofit organization dedicated to the support of Blender. Blender is an\
    \ open source 3D creation software that allows small developers like us to use\
    \ our art in our commercial projects without having to spend tons of money up\
    \ front. We can finally create the 3D games of our dreams without the stress of\
    \ having to wonder how we can pay for the tools we need.\n\nAnd that's why you're\
    \ here. Maybe you are already an independent developer using the latest version\
    \ of Unreal Engine 4, but are still only using game assets created by others.\
    \ Maybe you are a complete novice with your mind filled with amazing digital vistas\
    \ that need to be created. Either way, this book is for you. Within these pages,\
    \ we will take a look at how to use Blender and Unreal Engine 4 together to create\
    \ custom levels and game content for your games.\n\nIn this chapter, we will cover\
    \ the following topics:\n\n*   Installing Blender\n\n*   Exploring the interface\n\
    \n*   Customizing your settings\n\n*   Working with modes\n\n*   Jumping into\
    \ our first project\n\n*   Getting things started in Unreal Engine 4\n\n# Installing\
    \ Blender\n\nThe first step along our development journey begins at [http://www.blender.org](http://www.blender.org),\
    \ online home of the Blender Foundation. Here you can learn about the history\
    \ of Blender, connect with their community, access training videos, and more.\
    \ I encourage you to check out the website when you have time as it has much to\
    \ offer. For example, every time there is a major update to the software, there\
    \ is also a release of an animated short film. These films tend to be very entertaining\
    \ as well as show what the toolset is capable of.\n\nHere's how you download Blender:\n\
    \n1.  Go to [http://www.blender.org/](http://www.blender.org/).\n\n2.  Click on\
    \ the button on the right labeled **Download Blender 2.76-rc3** (the current version\
    \ as of this writing): ![Installing Blender](OEBPS/Images/BO5189_01_01.jpg)\n\n\
    \    Click the download button to get the latest version of Blender\n\n3.  Blender\
    \ is a cross-platform software. Select a 64- or 32-bit mirror for your operating\
    \ system. Most likely, your computer will be 64 bit: ![Installing Blender](OEBPS/Images/BO5189_01_02.jpg)\n\
    \n    Click the download link that is closest to your location and that corresponds\
    \ to your operating system. Most users will need the 64 bit version, but if you\
    \ have less than 8 gigs of RAM you should use the 32 bit version\n\n4.  Click\
    \ on the **Installer** once it has finished downloading.\n\n5.  Follow the installation\
    \ prompts. They are pretty straightforward and do not need additional configuration.\n\
    \nOnce everything has been installed, go ahead and run the program. You will be\
    \ greeted with the splash screen. Now let's take a look at the interface.\n\n\
    # Exploring the interface\n\nWhen you run Blender, you are greeted by the splash\
    \ screen. A list of files you have worked on recently will be listed on the left,\
    \ as well as some quick links to various things, such as the documentation and\
    \ the website. Click in the space to either side of the splash screen to remove\
    \ it. Now let's take a look at the default scene.\n\nBlender starts you off with\
    \ three basic objects in the scene already: a cube, a light, and a camera, as\
    \ shown in the following screenshot:\n\n![Exploring the interface](OEBPS/Images/BO5189_01_03.jpg)\n\
    \nOur Blender default setup. We will change this to work better with Unreal 4\n\
    \nSelect any one of them by right-clicking on the object. This will highlight\
    \ it in orange. Try right-clicking on other objects in the scene:\n\n![Exploring\
    \ the interface](OEBPS/Images/BO5189_01_08.jpg)\n\nWe can rotate our point of\
    \ view around the center by holding the middle mouse button (*MMB*). We can slide\
    \ our view by holding *Shift* + *MMB* and zoom it using the mouse wheel or *+*\
    \ and *\\-* on the number pad. Lastly, the number pad can also be used to view\
    \ specific angles of your object.\n\nNow let's take a look at the menus:\n\n![Exploring\
    \ the interface](OEBPS/Images/BO5189_01_04.jpg)\n\nThe Blender interface\n\n1.\
    \  Menu Bar\n\n2.  Tools Panel\n\n3.  Animation Timeline\n\n4.  Properties\n\n\
    5.  Scene Properties (press N if you don't see this menu)\n\n6.  Scene Outliner\n\
    \nAll of the preceding options have several functions. We will discuss them briefly\
    \ here and more as we continue with the project:\n\n*   **Menu Bar**: This contains\
    \ the **File**, **Render**, **Window**, **Help**, **Scene Layout** drop-down,\
    \ **Browse Scene** drop-down, and the **Render Engine** drop-down options. For\
    \ the most part, we will use the **File** menu to save, load, change user preferences,\
    \ export our files, and exit the program.\n\n*   **Tools Panel**: This contains\
    \ most of our functions that we will use to edit our shapes and mold our creations.\n\
    \n*   **Animation Timeline**: We will use this later to manage our animated game\
    \ asset.\n\n*   **Properties**: We will use the panel frequently to edit the properties\
    \ of our scene, add modifiers, and more.\n\n*   **Scene Properties**: This contains\
    \ a few specific functions that pertain to items in the scene, such as scale."
  fmt: "\n# 勘误\n\n虽然我们已尽一切努力确保内容的准确性，但错误难免发生。如果您在我们的书籍中发现错误——无论是文本还是代码——我们将不胜感激如果您能向我们报告。这样做可以让其他读者免受挫折，并帮助我们改进本书的后续版本。如果您发现任何勘误，请访问\
    \ <http://www.packtpub.com/submit-errata> 报告，选择您的书籍，点击 `Errata Submission Form`\
    \ 链接，并填写错误详情。一旦您的勘误经核实，您的提交将被接受，勘误将上传到我们的网站，或添加到该书 `Errata` 部分的现有勘误列表中。\n\n要查看之前提交的勘误，请访问\
    \ <https://www.packtpub.com/books/content/support> 并在搜索字段中输入书名。所需信息将出现在 `Errata`\
    \ 部分下。\n\n# 盗版\n\n互联网上的版权材料盗版是所有媒体持续面临的问题。Packt 非常重视版权和许可证的保护。如果您在互联网上以任何形式发现我们作品的非法副本，请立即向我们提供位置地址或网站名称，以便我们采取补救措施。\n\
    \n请通过 `<copyright@packtpub.com>` 联系我们，并附上涉嫌盗版材料的链接。\n\n感谢您帮助保护我们的作者，以及我们为您带来有价值内容的能力。\n\
    \n# 问题\n\n如果您对本书的任何方面有疑问，可以通过 `<questions@packtpub.com>` 联系我们，我们将尽最大努力解决问题。\n\n\
    作为游戏开发者，我们都有自己的梦想游戏——那款让我们兴奋不已、历经多年仍萦绕心头的游戏。对一些人来说，这意味着等待另一位游戏开发者构建类似的东西，但他们的版本永远无法完全匹配我们自己的设想。对我们大多数人来说，想要看到这款游戏诞生并亲自游玩的渴望，成为了我们开启独立游戏开发生涯的催化剂。当我们构建梦想、将心血倾注于游戏开发时，我们仍希望能在当今的游戏市场与大厂竞争，但我们没有资金购买“3A”级游戏引擎和高端\
    \ 3D 软件包的商业许可证。几年前，这一切因 `Unreal Engine` 等大型 3D 游戏引擎向独立开发者免费开放而改变。现在，小型开发者拥有了与大型开发者同等的高端工具访问权限。这些新游戏引擎赋予了我们构建梦想游戏的能力。然而，3D\
    \ 艺术软件从未真正跟进。许多行业标准创作套件（如 `Autodesk 3ds Max`）仍要花费数千美元。这种情况在 2002 年随着 `Blender\
    \ Foundation`（一个致力于支持 Blender 的非营利组织）的成立而改变。Blender 是一款开源 3D 创作软件，允许像我们这样的小型开发者在商业项目中使用自己的艺术作品，而无需预先投入巨资。我们终于可以创作梦想中的\
    \ 3D 游戏，而无需为如何支付工具费用而焦虑。\n\n这就是您来到这里的原因。也许您已经是使用最新版 `Unreal Engine 4` 的独立开发者，但仍只使用他人创建的游戏资产。也许您是一位完全的新手，脑海中充满了待创建的惊人数字景观。无论哪种情况，本书都适合您。在接下来的章节中，我们将探讨如何结合使用\
    \ Blender 和 `Unreal Engine 4` 为您的游戏创建自定义关卡和游戏内容。\n\n在本章中，我们将涵盖以下主题：\n\n*   安装\
    \ Blender\n*   探索界面\n*   自定义设置\n*   使用模式\n*   进入第一个项目\n*   在 `Unreal Engine 4`\
    \ 中开始\n\n# 安装 Blender\n\n我们开发旅程的第一步始于 <http://www.blender.org>，即 `Blender Foundation`\
    \ 的在线主页。在这里，您可以了解 Blender 的历史，与社区交流，访问培训视频等。我鼓励您有空时查看该网站，因为它提供了丰富的资源。例如，每当软件有重大更新时，也会发布一部动画短片。这些影片不仅娱乐性强，还展示了工具集的能力。\n\
    \n以下是下载 Blender 的步骤：\n\n1.  访问 <http://www.blender.org/>。\n2.  点击右侧标记为 `Download\
    \ Blender 2.76-rc3` 的按钮（撰写时的当前版本）：\n    ![安装 Blender](OEBPS/Images/BO5189_01_01.jpg)\n\
    \    点击下载按钮获取最新版本的 Blender\n3.  Blender 是跨平台软件。为您的操作系统选择 64 位或 32 位镜像。大多数情况下，您的计算机将是\
    \ 64 位：\n    ![安装 Blender](OEBPS/Images/BO5189_01_02.jpg)\n    点击离您最近且与您的操作系统对应的下载链接。大多数用户需要\
    \ 64 位版本，但如果您的内存少于 8 GB，应使用 32 位版本\n4.  下载完成后点击 `Installer`。\n5.  按照安装提示操作。它们非常简单，不需要额外配置。\n\
    \n一切安装完成后，请运行程序。您将看到启动画面。现在让我们看看界面。\n\n# 探索界面\n\n运行 Blender 时，您会看到启动画面。左侧会列出您最近处理过的文件，以及一些快速链接，指向文档、网站等各种内容。点击启动画面两侧的空白区域可将其关闭。现在让我们看看默认场景。\n\
    \nBlender 默认在场景中提供三个基本对象：一个立方体、一盏灯和一台摄像机，如下截图所示：\n\n![探索界面](OEBPS/Images/BO5189_01_03.jpg)\n\
    \n我们的 Blender 默认设置。我们将对其进行更改以更好地配合 `Unreal 4` 工作\n\n通过右键点击对象来选择任意一个。这会将其高亮显示为橙色。尝试右键点击场景中的其他对象：\n\
    \n![探索界面](OEBPS/Images/BO5189_01_08.jpg)\n\n我们可以通过按住中键（`MMB`）绕中心旋转视角。我们可以通过按住\
    \ `Shift` + `MMB` 平移视角，并使用鼠标滚轮或小键盘上的 `+` 和 `-` 进行缩放。最后，小键盘也可用于查看物体的特定角度。\n\n现在让我们看看菜单：\n\
    \n![探索界面](OEBPS/Images/BO5189_01_04.jpg)\n\nBlender 界面\n\n1.  菜单栏\n2.  工具面板\n\
    3.  动画时间轴\n4.  属性\n5.  场景属性（如果未看到此菜单，请按 `N`）\n6.  场景大纲\n\n所有上述选项都有多种功能。我们将在此简要讨论，并在项目继续时深入探讨：\n\
    \n*   **菜单栏**：包含 `File`、`Render`、`Window`、`Help`、`Scene Layout` 下拉菜单、`Browse Scene`\
    \ 下拉菜单和 `Render Engine` 下拉菜单选项。在大多数情况下，我们将使用 `File` 菜单来保存、加载、更改用户偏好设置、导出文件和退出程序。\n\
    *   **工具面板**：包含我们将用于编辑形状和塑造创作的大多数功能。\n*   **动画时间轴**：我们稍后将使用它来管理动画游戏资产。\n*   **属性**：我们将频繁使用此面板来编辑场景属性、添加修改器等。\n\
    *   **场景属性**：包含一些与场景中项目相关的特定功能，如缩放。\n"
