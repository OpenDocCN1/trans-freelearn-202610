- raw: "Sometimes when marking seams and using the **Unwrap** tool, we may wish to\
    \ reconnect a couple of faces in our UV map, such as when a seam looks obvious\
    \ after we place a material on an object and we would like to move it. The **Stitch**\
    \ tool can be found in the UV menu of the **UV Unwrap** window. Using it is a\
    \ two-step process. After moving two UV islands (a collection of faces that are\
    \ connected together in a UV map) that have a shared edge close to each other,\
    \ we can check whether two faces have shared edges by clicking on an edge in the\
    \ UV map and looking to see where another orange highlight appears. If you click\
    \ one edge, another highlights as well; those two edges can be stitched. After\
    \ lining up the edges, head to the UV menu and select **Stitch**, or press the\
    \ *V* key. Once the tool is on, we have a few options. The *Tab* key changes whether\
    \ we are stitching in edge mode or vertex mode. The *S* key turns the **Snap**\
    \ mode on and off. Snapping will snap the UV island that was first selected to\
    \ the island that was selected second. We can also choose to stitch the islands\
    \ at their midpoint, by pressing *M* and turning on the **Midpoint** option. Finally,\
    \ pressing the *I* key will swap which island will move during stitching. Once\
    \ we have the settings the way we would like, pressing *Enter* will finalize the\
    \ stitch.\n\n## Average Island Scale\n\n![Average Island Scale](OEBPS/Images/B05189_07_04.jpg)\n\
    \nAverage Island Scale can be found in the UV menu\n\nSometimes when unwrapping\
    \ a complex object, the unwrapping process will create UV islands that are out\
    \ of scale with the rest of the map. **Average Island**  **Scale** can restore\
    \ even scaling to UV islands, which will minimize stretching and blurring across\
    \ the textured area. Simply select the UV islands you wish to average, select\
    \ the UVs menu at the bottom of the **UV Unwrap** window, and select **Average\
    \ Island Scaling** or press *Ctrl* + *A*.\n\n## Pack Islands\n\n![Pack Islands](OEBPS/Images/B05189_07_05.jpg)\n\
    \nPack Islands will attempt to arrange and scale your UV islands to achieve the\
    \ best results\n\nOnce we have arranged all of our UV islands, we can use the\
    \ **Pack**  **Islands** tool and Blender will automatically arrange and scale\
    \ them to best fit the UV space. This is a great tool to finalize our UV map and\
    \ get the most out of Blender's UV space. We will use this at the end of our process\
    \ to try to achieve the best result.\n\n# Using Smart UV Project\n\nBefore we\
    \ get started unwrapping each piece of the Artifact, I would like to mention the\
    \ Smart UV unwrapper one more time. Remember that we used  **Smart UV Project**\
    \ to give us a basic UV map for our crate back in [Chapter 3](#ch03.xhtml \"Chapter 3. It's\
    \ Time to Customize!\"), *It's Time to Customize!*. This tool is great for basic\
    \ shapes and still has a place in our process for unwrapping more complex objects:\n\
    \n![Using Smart UV Project](OEBPS/Images/B05189_07_06.jpg)\n\nSmart UV Project\
    \ still has a place inside our expanded toolbox\n\nSince our Artifact contains\
    \ 42 different pieces, it is likely that **Smart UV Project** will be able to\
    \ provide us an excellent unwrap solution for some of them. Then, using tools\
    \ such as **Pack Islands** and **Average Island Scale**, we can add those objects\
    \ unwrapped with **Smart UV Project** to our overall UV map.\n\n# Custom Marking\
    \ Seams\n\nLet's take a look at using seams effectively. Remember that the **Unwrap**\
    \ tool will essentially flatten your object for texturing, splitting, and flattening\
    \ along the lines we have marked as seams. For different primitive shapes such\
    \ as cubes and cylinders, there are some best practices to be aware of. Knowing\
    \ these standard unwraps can help us later when we run into more complex shapes,\
    \ such as our tentacles.\n\n## Unwrapping Cubes\n\n![Unwrapping Cubes](OEBPS/Images/B05189_07_07.jpg)\n\
    \nPractice makes perfect! Cubes and other primitive shapes are a great way to\
    \ brush up on UV unwrapping\n\nWhen unwrapping a cube, it is important to minimize\
    \ the number of seams used. This is why we unwrap in a cross shape with the top\
    \ face at the center. Let's try it!\n\n1.  Head up to the **Scene Layout** dropdown\
    \ and select **UV Editing** from the list.\n\n2.  Select the default cube in the\
    \ scene and head to **Edit** mode. Choose **Line selection** from the selection\
    \ modes at the bottom of the screen and locate the top face. This will be our\
    \ reference point as we add our seams.\n\n3.  Locate the front face. This can\
    \ be done by pressing *1* on the number pad or selecting **Front** from the **View**\
    \ menu. This will be our second point of reference as we unwrap: ![Unwrapping\
    \ Cubes](OEBPS/Images/B05189_07_08.jpg)\n\n    Select the front two edges and\
    \ mark them as seams\n\n4.  Time to create our first seams. Now that we know where\
    \ our top and front faces are, let's add our first two seams there. Select the\
    \ two edges shown in the preceding screenshot, click on the **Shading / UVs**\
    \ tab in the **Tools** panel, and click on the **Mark Seams** button. This will\
    \ turn the lines red.\n\n5.  Now mark the other two vertical edges on the back\
    \ face. This will create the cross layout we want.\n\n6.  Lastly, we want to detach\
    \ the bottom face from all the other faces except the front. Select the three\
    \ edges that connect the bottom face to the side and back faces. Mark those as\
    \ seams.\n\n7.  Let's **Unwrap**! Click on the face selection mode and press *A*\
    \ to select all of the cube's faces. Now press the *U* key and select **Unwrap**\
    \ from the menu. Your UV map should look like our unwrapped cube.\n\n### Tip\n\
    \nTurning on the **Stretch** option in our **UV Layout** view will shade the selected\
    \ objects' UV islands blue, making them easier to see. Turning on **Keep UV and\
    \ Edit mode mesh**  **selections in sync** will help as well.\n\n## Unwrapping\
    \ Cylinders\n\n![Unwrapping Cylinders](OEBPS/Images/B05189_07_09.jpg)\n\nAn unwrapped\
    \ cylinder. Many of the Artefact's 42 shapes will be similar to this\n\nUnwrapping\
    \ a cylinder is even easier than unwrapping a cube. To unwrap this type of primitive\
    \ shape, create your seams all the way around the top and bottom faces and then\
    \ one seam that runs from top to bottom. Try it out and see if your results are\
    \ similar to what is shown in the preceding screenshot. It's kind of like putting\
    \ a label on a soup can.\n\n### Tip\n\nWant more practice UV unwrapping? It can\
    \ be good practice to learn to unwrap all the primitives Blender has in the Mesh\
    \ portion of the **Add** menu!\n\nOnce we have a good handle on unwrapping basic\
    \ primitives, it's time to start tackling the Artifact, piece by piece!\n\n![Unwrapping\
    \ Cylinders](OEBPS/Images/B05189_07_10.jpg)\n\nResults of unwrapping the bottom\n\
    \nLet's get started with the bottom portion:\n\n1.  In **Object** mode, select\
    \ the bottom portion of the Artifact and press *Shift* + *H*. This will isolate\
    \ our selection by hiding everything that is not selected. Next, head up to the\
    \ **Scene Layout** drop-down box and select **UV Layout**. This will split your\
    \ screen into two large viewports: one for manipulating your object and another\
    \ for working with your UV map: ![Unwrapping Cylinders](OEBPS/Images/B05189_07_11.jpg)\n\
    \n    Marking the seams on the bottom portion of the Artefact\n\n    ### Tip\n\
    \n    You can isolate a piece of your model by selecting it in **Object** mode\
    \ and pressing *Shift* + *H*. To make everything visible again, use *Alt* + *H*.\n\
    \n2.  Time to cut some seams. Unwrapping this part of our creation is not unlike\
    \ unwrapping a cylinder. Let's first create the seam to detach the inside. Select\
    \ the top edge loop by selecting **Line** mode, click the first line of the edge\
    \ loop, hold the *Alt* key, and select the second line of the loop. This will\
    \ select the entire loop for you. Now head to the tools panel and select the **Shading/UVs**\
    \ tab. Now click on **Mark Seam**. This will highlight your selected edge loop\
    \ in red, letting you know that Blender will use this loop as a seam in your UV\
    \ unwrap.\n\n3.  Now repeat the process to select the edge around the bottom face\
    \ and turn that into a seam as well."
  fmt: "\n# Stitch Tool\n\nSometimes when marking seams and using the `Unwrap` tool,\
    \ we may wish to reconnect a couple of faces in our `UV` map, such as when a seam\
    \ looks obvious after we place a material on an object and we would like to move\
    \ it. The `Stitch` tool can be found in the `UV` menu of the `UV Unwrap` window.\
    \ Using it is a two-step process. After moving two `UV` islands (a collection\
    \ of faces that are connected together in a `UV` map) that have a shared edge\
    \ close to each other, we can check whether two faces have shared edges by clicking\
    \ on an edge in the `UV` map and looking to see where another orange highlight\
    \ appears. If you click one edge, another highlights as well; those two edges\
    \ can be stitched. After lining up the edges, head to the `UV` menu and select\
    \ `Stitch`, or press the `V` key. Once the tool is on, we have a few options.\
    \ The `Tab` key changes whether we are stitching in edge mode or vertex mode.\
    \ The `S` key turns the `Snap` mode on and off. Snapping will snap the `UV` island\
    \ that was first selected to the island that was selected second. We can also\
    \ choose to stitch the islands at their midpoint, by pressing `M` and turning\
    \ on the `Midpoint` option. Finally, pressing the `I` key will swap which island\
    \ will move during stitching. Once we have the settings the way we would like,\
    \ pressing `Enter` will finalize the stitch.\n\n# Average Island Scale\n\n![Average\
    \ Island Scale](OEBPS/Images/B05189_07_04.jpg)\n\n`Average Island Scale` can be\
    \ found in the `UV` menu.\n\nSometimes when unwrapping a complex object, the unwrapping\
    \ process will create `UV` islands that are out of scale with the rest of the\
    \ map. `Average Island Scale` can restore even scaling to `UV` islands, which\
    \ will minimize stretching and blurring across the textured area. Simply select\
    \ the `UV` islands you wish to average, select the `UVs` menu at the bottom of\
    \ the `UV Unwrap` window, and select `Average Island Scaling` or press `Ctrl+A`.\n\
    \n# Pack Islands\n\n![Pack Islands](OEBPS/Images/B05189_07_05.jpg)\n\n`Pack Islands`\
    \ will attempt to arrange and scale your `UV` islands to achieve the best results.\n\
    \nOnce we have arranged all of our `UV` islands, we can use the `Pack Islands`\
    \ tool and Blender will automatically arrange and scale them to best fit the `UV`\
    \ space. This is a great tool to finalize our `UV` map and get the most out of\
    \ Blender's `UV` space. We will use this at the end of our process to try to achieve\
    \ the best result.\n\n# Using Smart UV Project\n\nBefore we get started unwrapping\
    \ each piece of the Artifact, I would like to mention the Smart UV unwrapper one\
    \ more time. Remember that we used `Smart UV Project` to give us a basic `UV`\
    \ map for our crate back in [Chapter 3](#ch03.xhtml \"Chapter 3. It's Time to\
    \ Customize!\"), *It's Time to Customize!*. This tool is great for basic shapes\
    \ and still has a place in our process for unwrapping more complex objects:\n\n\
    ![Using Smart UV Project](OEBPS/Images/B05189_07_06.jpg)\n\nSmart UV Project still\
    \ has a place inside our expanded toolbox.\n\nSince our Artifact contains 42 different\
    \ pieces, it is likely that `Smart UV Project` will be able to provide us an excellent\
    \ unwrap solution for some of them. Then, using tools such as `Pack Islands` and\
    \ `Average Island Scale`, we can add those objects unwrapped with `Smart UV Project`\
    \ to our overall `UV` map.\n\n# Custom Marking Seams\n\nLet's take a look at using\
    \ seams effectively. Remember that the `Unwrap` tool will essentially flatten\
    \ your object for texturing, splitting, and flattening along the lines we have\
    \ marked as seams. For different primitive shapes such as cubes and cylinders,\
    \ there are some best practices to be aware of. Knowing these standard unwraps\
    \ can help us later when we run into more complex shapes, such as our tentacles.\n\
    \n## Unwrapping Cubes\n\n![Unwrapping Cubes](OEBPS/Images/B05189_07_07.jpg)\n\n\
    Practice makes perfect! Cubes and other primitive shapes are a great way to brush\
    \ up on UV unwrapping.\n\nWhen unwrapping a cube, it is important to minimize\
    \ the number of seams used. This is why we unwrap in a cross shape with the top\
    \ face at the center. Let's try it!\n\n1. Head up to the `Scene Layout` dropdown\
    \ and select `UV Editing` from the list.\n2. Select the default cube in the scene\
    \ and head to `Edit` mode. Choose `Line selection` from the selection modes at\
    \ the bottom of the screen and locate the top face. This will be our reference\
    \ point as we add our seams.\n3. Locate the front face. This can be done by pressing\
    \ `1` on the number pad or selecting `Front` from the `View` menu. This will be\
    \ our second point of reference as we unwrap:\n   ![Unwrapping Cubes](OEBPS/Images/B05189_07_08.jpg)\n\
    \   Select the front two edges and mark them as seams.\n4. Time to create our\
    \ first seams. Now that we know where our top and front faces are, let's add our\
    \ first two seams there. Select the two edges shown in the preceding screenshot,\
    \ click on the `Shading / UVs` tab in the `Tools` panel, and click on the `Mark\
    \ Seams` button. This will turn the lines red.\n5. Now mark the other two vertical\
    \ edges on the back face. This will create the cross layout we want.\n6. Lastly,\
    \ we want to detach the bottom face from all the other faces except the front.\
    \ Select the three edges that connect the bottom face to the side and back faces.\
    \ Mark those as seams.\n7. Let's `Unwrap`! Click on the face selection mode and\
    \ press `A` to select all of the cube's faces. Now press the `U` key and select\
    \ `Unwrap` from the menu. Your `UV` map should look like our unwrapped cube.\n\
    \n### Tip\n\nTurning on the `Stretch` option in our `UV Layout` view will shade\
    \ the selected objects' `UV` islands blue, making them easier to see. Turning\
    \ on `Keep UV and Edit mode mesh selections in sync` will help as well.\n\n##\
    \ Unwrapping Cylinders\n\n![Unwrapping Cylinders](OEBPS/Images/B05189_07_09.jpg)\n\
    \nAn unwrapped cylinder. Many of the Artefact's 42 shapes will be similar to this.\n\
    \nUnwrapping a cylinder is even easier than unwrapping a cube. To unwrap this\
    \ type of primitive shape, create your seams all the way around the top and bottom\
    \ faces and then one seam that runs from top to bottom. Try it out and see if\
    \ your results are similar to what is shown in the preceding screenshot. It's\
    \ kind of like putting a label on a soup can.\n\n### Tip\n\nWant more practice\
    \ UV unwrapping? It can be good practice to learn to unwrap all the primitives\
    \ Blender has in the Mesh portion of the `Add` menu!\n\nOnce we have a good handle\
    \ on unwrapping basic primitives, it's time to start tackling the Artifact, piece\
    \ by piece!\n\n![Unwrapping Cylinders](OEBPS/Images/B05189_07_10.jpg)\n\nResults\
    \ of unwrapping the bottom.\n\nLet's get started with the bottom portion:\n\n\
    1. In `Object` mode, select the bottom portion of the Artifact and press `Shift+H`.\
    \ This will isolate our selection by hiding everything that is not selected. Next,\
    \ head up to the `Scene Layout` drop-down box and select `UV Layout`. This will\
    \ split your screen into two large viewports: one for manipulating your object\
    \ and another for working with your `UV` map:\n   ![Unwrapping Cylinders](OEBPS/Images/B05189_07_11.jpg)\n\
    \   Marking the seams on the bottom portion of the Artefact.\n\n   ### Tip\n\n\
    \   You can isolate a piece of your model by selecting it in `Object` mode and\
    \ pressing `Shift+H`. To make everything visible again, use `Alt+H`.\n\n2. Time\
    \ to cut some seams. Unwrapping this part of our creation is not unlike unwrapping\
    \ a cylinder. Let's first create the seam to detach the inside. Select the top\
    \ edge loop by selecting `Line` mode, click the first line of the edge loop, hold\
    \ the `Alt` key, and select the second line of the loop. This will select the\
    \ entire loop for you. Now head to the tools panel and select the `Shading/UVs`\
    \ tab. Now click on `Mark Seam`. This will highlight your selected edge loop in\
    \ red, letting you know that Blender will use this loop as a seam in your `UV`\
    \ unwrap.\n3. Now repeat the process to select the edge around the bottom face\
    \ and turn that into a seam as well.\n"
  trans: "\n# 缝合工具\n\n有时在标记接缝并使用 `Unwrap` 工具时，我们可能希望在 `UV` 贴图中重新连接几个面，例如当我们在物体上放置材质后接缝看起来很明显，我们想要移动它时。`Stitch`\
    \ 工具位于 `UV Unwrap` 窗口的 `UV` 菜单中。使用它是一个两步过程。将两个具有共享边的 `UV` 岛（`UV` 贴图中连接在一起的面的集合）移动得靠近后，我们可以通过在\
    \ `UV` 贴图中点击一条边，观察另一个橙色高亮出现在何处，来检查两个面是否有共享边。如果你点击一条边，另一条也会高亮；这两条边可以被缝合。对齐边缘后，前往\
    \ `UV` 菜单选择 `Stitch`，或按 `V` 键。工具激活后，我们有几个选项。`Tab` 键切换我们是处于边缘模式还是顶点模式进行缝合。`S` 键开启或关闭\
    \ `Snap` 模式。吸附会将第一个选中的 `UV` 岛吸附到第二个选中的岛上。我们也可以选择在中点缝合岛，通过按 `M` 开启 `Midpoint` 选项。最后，按\
    \ `I` 键将交换缝合过程中哪个岛会移动。设置好后，按 `Enter` 将完成缝合。\n\n# 平均岛缩放\n\n![Average Island Scale](img/B05189_07_04.jpg)\n\
    \n`Average Island Scale` 位于 `UV` 菜单中。\n\n有时在展开复杂物体时，展开过程会创建与地图其余部分比例不协调的 `UV`\
    \ 岛。`Average Island Scale` 可以恢复 `UV` 岛的均匀缩放，从而最小化纹理区域的拉伸和模糊。只需选择想要平均的 `UV` 岛，在\
    \ `UV Unwrap` 窗口底部选择 `UVs` 菜单，然后选择 `Average Island Scaling` 或按 `Ctrl+A`。\n\n#\
    \ 打包岛\n\n![Pack Islands](img/B05189_07_05.jpg)\n\n`Pack Islands` 将尝试排列和缩放你的 `UV`\
    \ 岛以获得最佳结果。\n\n一旦我们排列好所有 `UV` 岛，就可以使用 `Pack Islands` 工具，Blender 会自动排列和缩放它们以最佳适应\
    \ `UV` 空间。这是一个完成 `UV` 贴图并充分利用 Blender `UV` 空间的绝佳工具。我们将在流程结束时使用它以尝试获得最佳结果。\n\n\
    # 使用智能 UV 投影\n\n在开始展开神器的每个部件之前，我想再次提到智能 UV 展开器。还记得我们在 第 3 章 *是时候自定义了！* 中使用 `Smart\
    \ UV Project` 为我们的箱子提供基本 `UV` 贴图吗。这个工具非常适合基本形状，在我们展开更复杂物体的过程中仍有一席之地：\n\n![Using\
    \ Smart UV Project](img/B05189_07_06.jpg)\n\n智能 UV 投影在我们扩展的工具箱中仍占有一席之地。\n\n由于我们的神器包含\
    \ 42 个不同部件，`Smart UV Project` 很可能能为其中一些提供优秀的展开方案。然后，使用 `Pack Islands` 和 `Average\
    \ Island Scale` 等工具，我们可以将那些用 `Smart UV Project` 展开的物体添加到我们的整体 `UV` 贴图中。\n\n# 自定义标记接缝\n\
    \n让我们看看如何有效使用接缝。请记住，`Unwrap` 工具本质上会将你的物体展平以进行贴图，沿着我们标记为接缝的线进行分割和展平。对于立方体和圆柱体等不同基础形状，有一些最佳实践需要注意。了解这些标准展开方法可以帮助我们在以后遇到更复杂的形状（如触手）时应对。\n\
    \n## 展开立方体\n\n![Unwrapping Cubes](img/B05189_07_07.jpg)\n\n熟能生巧！立方体和其他基础形状是磨练\
    \ UV 展开技巧的好方法。\n\n展开立方体时，重要的是尽量减少使用的接缝数量。这就是为什么我们以十字形展开，顶面在中心。让我们试试！\n\n1. 前往\
    \ `Scene Layout` 下拉菜单，从列表中选择 `UV Editing`。\n2. 选择场景中的默认立方体并进入 `Edit` 模式。从屏幕底部的选择模式中选择\
    \ `Line selection` 并找到顶面。这将是我们添加接缝时的参考点。\n3. 找到前面。可以通过按小键盘 `1` 或从 `View` 菜单选择\
    \ `Front` 来实现。这将是我们展开时的第二个参考点：\n   ![Unwrapping Cubes](img/B05189_07_08.jpg)\n\
    \   选择前面的两条边并标记为接缝。\n4. 是时候创建第一批接缝了。现在我们知道顶面和前面的位置，让我们在那里添加前两条接缝。选择上图所示的两条边，点击\
    \ `Tools` 面板中的 `Shading / UVs` 选项卡，然后点击 `Mark Seams` 按钮。这会将线变红。\n5. 现在标记背面的另外两条垂直边。这将创建我们想要的十字布局。\n\
    6. 最后，我们要将底面与除前面以外的所有面分离。选择连接底面与侧面和背面的三条边。将它们标记为接缝。\n7. 让我们 `Unwrap`！点击面选择模式并按\
    \ `A` 选择立方体的所有面。现在按 `U` 键并从菜单中选择 `Unwrap`。你的 `UV` 贴图应该像我们展开的立方体一样。\n\n### 提示\n\
    \n在 `UV Layout` 视图中开启 `Stretch` 选项会将选中物体的 `UV` 岛着色为蓝色，使其更易查看。开启 `Keep UV and Edit\
    \ mode mesh selections in sync` 也会有帮助。\n\n## 展开圆柱体\n\n![Unwrapping Cylinders](img/B05189_07_09.jpg)\n\
    \n一个展开的圆柱体。神器的 42 个形状中有许多将与此类似。\n\n展开圆柱体甚至比展开立方体更容易。要展开这种基础形状，在顶面和底面周围创建接缝，然后创建一条从上到下的接缝。试试看，结果是否与上图类似。这有点像给汤罐头贴标签。\n\
    \n### 提示\n\n想要更多 UV 展开练习？学习展开 `Add` 菜单 `Mesh` 部分中的所有基础体是个好练习！\n\n一旦我们掌握了基本基础体的展开，就该开始逐个攻克神器了！\n\
    \n![Unwrapping Cylinders](img/B05189_07_10.jpg)\n\n展开底部的结果。\n\n让我们从底部开始：\n\n1.\
    \ 在 `Object` 模式下，选择神器的底部并按 `Shift+H`。这将通过隐藏未选中的所有内容来隔离我们的选择。接下来，前往 `Scene Layout`\
    \ 下拉框并选择 `UV Layout`。这将把屏幕分成两个大视口：一个用于操作物体，另一个用于处理 `UV` 贴图：\n   ![Unwrapping Cylinders](img/B05189_07_11.jpg)\n\
    \   在神器底部标记接缝。\n\n   ### 提示\n\n   你可以通过在 `Object` 模式下选择模型的一部分并按 `Shift+H` 来隔离它。要再次显示所有内容，请使用\
    \ `Alt+H`。\n\n2. 是时候切一些接缝了。展开我们创作的这个部分与展开圆柱体并无二致。让我们先创建接缝以分离内部。通过选择 `Line` 模式，点击边循环的第一条线，按住\
    \ `Alt` 键，然后选择环的第二条线来选择顶部边循环。这将为你选择整个循环。现在前往工具面板并选择 `Shading/UVs` 选项卡。现在点击 `Mark\
    \ Seam`。这会将你选中的边循环高亮为红色，让你知道 Blender 将在你的 `UV` 展开中使用此循环作为接缝。\n3. 现在重复该过程以选择底面周围的边并将其也变为接缝。\n"
