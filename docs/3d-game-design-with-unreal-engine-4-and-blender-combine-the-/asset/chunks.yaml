- raw: "    The **Material Editor** works similar to programming in Blueprint and\
    \ uses a similar node structure. The large node in the center represents the final\
    \ result.\n\n    ### Tip\n\n    Tip: Creating materials and shaders for video\
    \ games is an art form all its own. Here I will talk about creating materials\
    \ in basic terms, but I would encourage you to check out the Unreal documentation,\
    \ open up some of the existing materials in the `Starter Content` folder, and\
    \ begin exploring this highly versatile tool.\n\n4.  So we need to add our textures\
    \ to our new material. An easy way to add texture maps to any material is to click\
    \ and drag them from the **Content Browser** into the **Material Editor**. This\
    \ will create a node called a **Texture Sample**, which can plug into the different\
    \ sockets on the main material node.\n\n5.  Now to plug in each map. Drag a wire\
    \ from each of the white connections on the right side of each **Texture Sample**\
    \ to its appropriate slot on the main material node. The **Metallic** and **Roughness**\
    \ texture sample will be plugged into two slots on the main node.\n\n6.  Let's\
    \ preview the result. Back in the **Content Browser**, select the **Artifact**.\
    \ Then, in the **Preview Window** of the **Material Editor**, select the small\
    \ button on the far right that reads **Set the Preview Mesh based on the current\
    \ Content Browser selection**. ![Creating a class blueprint to tie it all together](OEBPS/Images/B05189_09_06.jpg)\n\
    \n    Each of the four maps we imported has a corresponding socket on the main\
    \ material node\n\n7.  The material has come out just a bit too shiny. The large\
    \ amount of shine given off by the material is called the specular highlight and\
    \ is controlled by the **Specular** connection on the main material node. If we\
    \ check the documentation, we can see that this part of the node accepts a value\
    \ between `0` and `1`. How might we do this? Well, the **Material Editor** has\
    \ a **Constant** node that allows us to input a number and then plug that in wherever\
    \ we may need it. This will work perfectly! Search for a **Constant** in the search\
    \ box of the **Palette**, located on the right side of the **Material Editor**.\
    \ Drag it into the area with your other nodes and head over to the **Details**\
    \ panel. In the **Value** field, try different values between `0` and `1` and\
    \ preview the result. I ended up using `0.1`. Save your changes.\n\n    Time to\
    \ try it out on our Artifact!\n\n    ![Creating a class blueprint to tie it all\
    \ together](OEBPS/Images/B05189_09_07.jpg)\n\n    In the Skeletal Mesh editor,\
    \ assign our new material to the Artefact in the Mesh Details panel\n\n8.  Double-click\
    \ on the **Skeletal Mesh** to open the **Skeletal Mesh** editor window. On the\
    \ left-hand side, look for the **LOD0** section of the menu. This section has\
    \ an option to add a material (I have highlighted it in the preceding image).\
    \ Head back to the content browser and select our **Artifact\\_MAT** material.\
    \ Now select the small arrow in the **LOD0** box to apply the selection to the\
    \ Artifact.\n\nHow does it look? Too shiny? Not shiny enough? Feel free to adjust\
    \ our **Constant** node in the material node until you are able to get the result\
    \ you want. When you are happy, repeat the process for the tentacle. We will import\
    \ it as a static mesh (since it doesn't have any animations) and create a material\
    \ for it made out of the texture maps we created in **Substance Painter**.\n\n\
    Now we will use a **Class Blueprint** for final assembly.\n\n![Creating a class\
    \ blueprint to tie it all together](OEBPS/Images/B05189_09_08.jpg)\n\nThe Artefact\
    \ Class Blueprint\n\nClass Blueprints are a form of standalone Blueprint that\
    \ allows us to combine art assets with programming in an easy-to-use and, most\
    \ importantly, reusable package. For example, the player is a class Blueprint\
    \ as it combines the player character's Skeletal Mesh with Blueprint code to help\
    \ the player move around:\n\n![Creating a class blueprint to tie it all together](OEBPS/Images/B05189_09_09.jpg)\n\
    \nThe First Person Character is a great example of a class Blueprint\n\nSo how\
    \ and when might we use class Blueprints instead of just putting the code in the\
    \ level Blueprint? The level blueprint is great for anything that is specific\
    \ to just that level. Such things would include volcanoes on a lava-based level,\
    \ or spaceships in the background of our space station level. Class Blueprints\
    \ work great for building objects that are self-contained and repeatable, such\
    \ as doors, enemies, or power-ups. These types of item would be used frequently\
    \ and would have a place in several levels of a game.\n\nLet's create a class\
    \ blueprint for the Artifact:\n\n1.  Click on the **Blueprints** button and select\
    \ the **New Empty Blueprints** tab. This will open the **Pick Parent Class** menu.\
    \ Since we are creating a prop, and not something that the player needs to control\
    \ directly, select the **Actor Parent Class**.\n\n2.  The next screen will ask\
    \ us to name our new class and for a location to save it to. I chose to save it\
    \ in my **CustomAssets** folder and named it `Artifact_Blueprint`.\n\n3.  Welcome\
    \ to the **Class Blueprint** editor: ![Creating a class blueprint to tie it all\
    \ together](OEBPS/Images/B05189_09_10.jpg)\n\n    The Class Blueprint editor has\
    \ several panels in common with the other editors inside Unreal\n\n4.  Similar\
    \ to other editor windows within Unreal, the **Class Blueprint** editor has both\
    \ a **Details** panel and a **Palette**. However, there is a panel that is new\
    \ to us. The **Components** panel contains a list of the art types that makes\
    \ up a class Blueprint. These components are various pieces that make up the whole\
    \ object. For our Artifact, this would include the main piece itself, any number\
    \ of tentacles, and a collision box. Other components that can be added include\
    \ particle emitters, audio, and even lights.\n\n5.  Let's add the **Artifact**.\
    \ In the **Components** section, click the **Add Component** button and select\
    \ **Skeletal Mesh** from the drop-down list. You can find it in the **Common**\
    \ section. This adds a blank **Skeletal Mesh** to the viewport and the **Components**\
    \ list. With it selected, check out the **Details** panel. In the **Mesh** section\
    \ is an area to assign the skeletal mesh you wish it to be. Back in the **Content\
    \ Browser**, select the **Artifact**. Lastly, back in the **Details** panel of\
    \ the **Blueprint Editor**, click the small arrow next to the **Skeletal Mesh**\
    \ option to assign the **Artifact**. It should now appear in the viewport.\n\n\
    6.  Back to the **Components** list. Let's add a **Box Collision**. Click **Add\
    \ Component** and select **Box Collision** from the **Collision** section of the\
    \ menu: ![Creating a class blueprint to tie it all together](OEBPS/Images/B05189_09_23.jpg)\n\
    \n    Select the Add Component button and choose Box Collision from the dropdown\n\
    \n7.  Click it and in the **Details** panel, increase the **Box Extents** to a\
    \ size that would allow the player to enter within its bounds. I used `180` for\
    \ *x*, *y*, and *z*.\n\n8.  Repeat the last few steps and add the tentacles to\
    \ the Artifact using the **Add Component** menu. We will use the **Static Mesh**\
    \ option. The design calls for three, but add more if you like.\n\n9.  Time to\
    \ give this class Blueprint a bit of programming. We want the player to be able\
    \ to walk up to the Artifact and press the *E* key to open it. ![Creating a class\
    \ blueprint to tie it all together](OEBPS/Images/B05189_09_11.jpg)\n\n    Programming\
    \ the Artefact"
