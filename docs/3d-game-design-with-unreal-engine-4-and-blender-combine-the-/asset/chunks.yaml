    \ in the `Content Browser` can be used:\n\n![Setting up and using our new 3D asset](OEBPS/Images/BO5189_04_11.jpg)\n\
    \nAdding a material to our box using the Details panel\n\n1.  Go back to the `Content\
    \ Browser` and navigate to the `Materials` folder inside the `Starter Content`\
    \ folder.\n\n2.  Click on the material you would like to use for the crate. I\
    \ selected `M_Metal_Copper`.\n\n3.  With the material highlighted, go back to\
    \ the `Static Mesh` editor and click the small arrow next to the material sphere\
    \ in the `LOD 0` section of the `Details` panel. Whenever you see a small arrow\
    \ like that in the Unreal Engine, clicking will allow you to use whatever you\
    \ have selected in the `Content Browser`.\n\n4.  Your material will appear on\
    \ your crate. Feel free to try a few different options to find what you think\
    \ works best.\n\nFor our next game asset that we will create later in this book,\
    \ we will use a custom material that will really make the object stand out. Once\
    \ we have the material setting complete, there is only one more setting that we\
    \ need to change. Unreal likes to generate its own UV channel for storing lighting\
    \ information. However, back in [Chapter 3](#ch03.xhtml \"Chapter 3. It's Time\
    \ to Customize!\"), *It's Time to Customize!*, we created our own using Blender's\
    \ Lightmap Pack feature, and we want to tell Unreal to use it, since ours is quite\
    \ a bit better:\n\n![Setting up and using our new 3D asset](OEBPS/Images/BO5189_04_12.jpg)\n\
    \nTelling Unreal to use our Lightmap we created within Blender\n\nHere's how you\
    \ can generate a Lightmap for your object:\n\n1.  Under the `LOD 0` section of\
    \ the `Details` panel, find the `Generate Lightmap UVs` option and turn it off.\
    \ This tells Unreal that we do not want it to create its own UV channel for lighting\
    \ information.\n\n2.  Find the `Source Lightmap Index` setting. This tells Unreal\
    \ which UV map to use when doing light calculations. Change this setting to `1`.\n\
    \n3.  Finally, go to the `Destination Lightmap Index` and change this to `1` as\
    \ well. This tells Unreal to record the light and shadow information on the UV\
    \ channel that we created.\n\nDone! Our crate is ready for use:\n\n![Setting up\
    \ and using our new 3D asset](OEBPS/Images/BO5189_04_13.jpg)\n\nThe final crate\
    \ inside our level. Congratulations!\n\nTake a few minutes and replace a few of\
    \ the cubes in the cargo bay with our new game asset. To really add some variation,\
    \ try scaling a few of them up or down. Once the area is decorated to your liking,\
    \ remember to save your level and press the `Build` button. Now drop into your\
    \ level and check out the space!\n\n## Summary\n"
  trans: "\n\nFBX 的缺点之一是它是一种专有文件格式。Autodesk 通过其许多产品和一个软件开发工具包向公众提供该格式。基于此，Blender\
    \ 社区的成员们已经能够创建一个导出工具，让我们能在项目中使用这种多功能的文件格式。让我们来看看 FBX 导出器。\n\n## 将物体导入 Unreal\n\
    \n是时候从 Blender 导出我们的箱子了：\n\n![将物体导入 Unreal](img/BO5189_04_04.jpg)\n\n从“文件”菜单中选择导出\n\
    \n可以通过转到 `File` 菜单，然后选择 `Export`，并选择 `FBX` 作为所需的文件格式来找到导出选项：\n\n![将物体导入 Unreal](img/BO5189_04_05.jpg)\n\
    \nFBX 导出选项菜单。选择“Mesh”选项卡。\n\n导出器有许多选项，其中有几个我们稍后会在涉及动画时用到。我们需要更改一些选项来导出我们的箱子：\n\
    \n1.  在导出器的主菜单中，选择 `Mesh`。这样，导出的唯一物体就是我们的箱子，而不会包括场景中的摄像机或灯光：\n\n    ![将物体导入 Unreal](img/BO5189_04_06.jpg)\n\
    \n    在“Geometries”选项卡中将“Smoothing”选项设置为“Face”\n\n2.  在 `Geometry` 菜单中，将 `Smoothing`\
    \ 选项更改为 `Face`。Unreal 要求平滑组必须是任何导出物体的一部分，尽管我们并没有真正用它们来创建箱子。通过选择此选项，我们可以在导入 FBX\
    \ 文件时避免任何错误消息。\n\n3.  更改完这些设置后，将 FBX 文件保存在易于查找的位置。\n\n接下来，我们将打开 Unreal 并将文件导入到我们的关卡中。一旦我们设置好几个选项，箱子就可以使用了。\n\
    \n## 设置并使用我们的新 3D 资产\n\n现在我们有了 FBX 文件，需要将文件导入到 Unreal 的 `Content Browser` 中。Epic\
    \ Games 使这个过程变得相对轻松。将文件导入游戏引擎后，它仍然需要两样东西。必须添加碰撞网格体，以确保玩家和其他游戏物体能与我们的新箱子正确碰撞。其次，我们必须为物体添加材质，使其具有视觉吸引力。\n\
    \n首先在 `Content Browser` 中导航到您想存放箱子的文件夹，然后点击 `Import` 按钮：\n\n![设置并使用我们的新 3D 资产](img/BO5189_04_07.jpg)\n\
    \n在文件浏览器中找到您的 FBX 文件。\n\n1.  导航到您保存 FBX 文件的文件夹并点击 `Open`：\n\n    ![设置并使用我们的新 3D\
    \ 资产](img/BO5189_04_08.jpg)\n\n    Unreal 的 FBX 导入选项菜单\n\n2.  这将打开 `FBX Import\
    \ Options`。关闭 `Auto Generate Collision` 选项。虽然这将来可以节省时间，但我们将在成功导入文件后手动创建它。\n\n\
    3.  同时关闭 `Import Materials` 和 `Import Textures` 选项。如果您已在 3D 软件中创建了材质并希望随物体一起导入，可以使用这些选项。如果我们在此处使用它们，Unreal\
    \ 会导入我们的彩色 UV 网格。\n\n4.  更改完这些选项后，点击 `Import` 按钮。\n\n一个显示我们箱子的浅蓝色图标应该会被添加到浏览器中。双击它将带我们进入\
    \ `Static Mesh` 编辑器。在这里，我们可以设置几个不同的选项，这些选项将影响我们在关卡中使用的每一个箱子副本：\n\n![设置并使用我们的新\
    \ 3D 资产](img/BO5189_04_09.jpg)\n\nUnreal 4 中的静态网格体编辑器\n\n我们将从添加碰撞基元开始。`Collisions`\
    \ 真正是让电子游戏世界运转的关键，它是计算机判断玩家是否成功与另一个游戏物体交互的方式。作为玩家，我们经常在站在平台上向下看时看到碰撞。看起来似乎我们正漂浮在实际站立的物体上方。这是由于游戏编程实际上忽略了玩家看到的美术模型，仅使用对玩家不可见的简单碰撞基元来记录碰撞。就我们关卡构建者而言，碰撞将阻止玩家穿过箱子，并使他们能真正与其交互：\n\
    \n![设置并使用我们的新 3D 资产](img/BO5189_04_10.jpg)\n\n选择“Collision”菜单并选择“Add Simple Box\
    \ Collision”\n\n让我们看看如何为物体添加碰撞：\n\n1.  确保视口顶部的 `Collision` 选项已开启。这将使我们创建的任何碰撞基元可见。\n\
    \n2.  点击屏幕顶部菜单栏中的 `Collision` 菜单选项。从这里我们要选择最适合我们需求的最简单形状。既然我们的箱子本质上就是一个盒子，我们将选择\
    \ `Add Simple Box Collision`。您现在应该会看到一个用绿色勾勒出的盒子包围着箱子。\n\n接下来我们需要做的是为箱子选择一种材质。`Content\
    \ Browser` 中可用的任何材质都可以使用：\n\n![设置并使用我们的新 3D 资产](img/BO5189_04_11.jpg)\n\n使用 Details\
    \ 面板为盒子添加材质\n\n1.  返回 `Content Browser` 并导航到 `Starter Content` 文件夹内的 `Materials`\
    \ 文件夹。\n\n2.  点击您想用于箱子的材质。我选择了 `M_Metal_Copper`。\n\n3.  高亮显示材质后，返回 `Static Mesh`\
    \ 编辑器，点击 `Details` 面板中 `LOD 0` 部分材质球旁边的小箭头。在 Unreal Engine 中，每当您看到这样的小箭头，点击它将允许您使用在\
    \ `Content Browser` 中选中的任何内容。\n\n4.  您的材质将出现在箱子上。请随意尝试几个不同的选项，找到您认为最合适的一个。\n\n\
    对于本书后面我们将创建的下一个游戏资产，我们将使用自定义材质，真正让物体脱颖而出。一旦完成材质设置，只还有一个设置需要更改。Unreal 倾向于生成自己的\
    \ UV 通道来存储光照信息。然而，回在 第 3 章 *是时候自定义了！* 中，我们使用 Blender 的 Lightmap Pack 功能创建了自己的\
    \ UV，我们想告诉 Unreal 使用它，因为我们的要好得多：\n\n![设置并使用我们的新 3D 资产](img/BO5189_04_12.jpg)\n\
    \n告诉 Unreal 使用我们在 Blender 中创建的 Lightmap\n\n以下是如何为物体生成 Lightmap：\n\n1.  在 `Details`\
    \ 面板的 `LOD 0` 部分下，找到 `Generate Lightmap UVs` 选项并将其关闭。这告诉 Unreal 我们不想让它创建自己的 UV\
    \ 通道来存储光照信息。\n\n2.  找到 `Source Lightmap Index` 设置。这告诉 Unreal 在进行光照计算时使用哪个 UV 贴图。将此设置更改为\
    \ `1`。\n\n3.  最后，转到 `Destination Lightmap Index` 并将其也更改为 `1`。这告诉 Unreal 在我们创建的\
    \ UV 通道上记录光照和阴影信息。\n\n完成！我们的箱子已准备好使用：\n\n![设置并使用我们的新 3D 资产](img/BO5189_04_13.jpg)\n\
    \n我们关卡中的最终箱子。恭喜！\n\n花几分钟时间用我们的新游戏资产替换货舱中的几个立方体。为了真正增加一些变化，尝试将其中几个放大或缩小。一旦区域装饰得让您满意，请记得保存关卡并按下\
    \ `Build` 按钮。现在进入关卡看看这个空间吧！\n\n## 总结\n\n"
