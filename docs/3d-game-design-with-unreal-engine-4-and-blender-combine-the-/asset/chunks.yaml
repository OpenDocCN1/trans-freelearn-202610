    \ This gives the asset flexibility and allows me to use it in many different situations,\
    \ two very important design considerations.\n\n### Tip\n\nReuse of assets is important\
    \ to game design and development due to the large amount of work it takes to build\
    \ unique environments. Many building sets available in the Unreal Marketplace\
    \ are designed to be modular to create a variety of different scenes. This practice\
    \ goes back to even the earliest game titles. In Super Mario Bros. on the NES,\
    \ the clouds and bushes are the exact same game asset, just different colors.\n\
    \nYou may have noticed that I did a few different views of my crate. This allows\
    \ us to see our object from the front, side, and back, and design an object with\
    \ some variety to each section. By doing this, we can also communicate the design\
    \ to another artist on the team if we're the ones who created the design but not\
    \ the ones who will be building the asset in 3D.\n\n## Setting up our file in\
    \ Blender\n\nNow let's set up our file in `Blender` (remember our settings from\
    \ [Chapter 1](#ch01.xhtml \"Chapter 1. Unreal, My Friend, I'd Like You to Meet\
    \ Blender\")?):\n\n![Getting started making game assets](OEBPS/Images/BO5189_03_2.jpg)\n\
    \n**Setting our scale to match Unreal 4**\n\n1.  Open `Blender`.\n2.  Change the\
    \ unit scale to `Metric` in the `Scene` portion of the `Properties` pane.\n3.\
    \  Change the `Scale` to `0.01`.\n4.  Press `N` to open the `Scene Properties`\
    \ pane and fix the grid by changing the `Clip End` property under `View` to `1.0\
    \ km`.\n5.  Scale your starter cube by `100` since we will be using it.\n6.  Click\
    \ the `File` menu and select `Save Startup File`. This will save our changes as\
    \ the default settings and make sure that all the files we create going forward\
    \ will have these settings. This will save us time in the future.\n\nWith our\
    \ `Blender` file ready to go, it's time to begin building our crate.\n\n# Using\
    \ the basic tools of polygon modeling\n\nWe will begin building our crate with\
    \ the primitive object that is closest to the finished shape we want. In this\
    \ case, the default cube we start with works great. So what is a primitive and\
    \ why do we start with one? Primitive shapes are your basic shapes, in the case\
    \ of `Blender`: plane, cube, circle, sphere, cylinder, cone, and torus. We start\
    \ with these shapes since they are the basic building blocks of all we see. Traditional\
    \ artists start with these when they draw as well. If you take a look outside,\
    \ you can see these shapes: poles are cylinders, buildings are cubes, and so on.\
    \ That is also the reason why Unreal gives us a Shapes folder full of primitives\
    \ to block out our levels with.\n\nOne of the easiest 3D modeling techniques to\
    \ learn is Polygon modeling, or simply, poly modeling. It involves manipulating\
    \ the vertices, edges, and polygons that make up a primitive shape to create something\
    \ greater. Poly modeling uses the following tools:\n\n![Using the basic tools\
    \ of polygon modeling](OEBPS/Images/BO5189_03_3.jpg)\n\n## The Tools panel\n\n\
    ### Extrude\n\n**Extrude**: This tool allows you to push a polygon in or pull\
    \ it out and is very useful in creating new portions of an object:\n\n![Using\
    \ the basic tools of polygon modeling](OEBPS/Images/BO5189_03_4.jpg)\n\n### Inset\
    \ Faces\n\n**Inset Faces**: Inset is useful for creating details within an object,\
    \ such as creating windows or doors on a building:\n\n![Using the basic tools\
    \ of polygon modeling](OEBPS/Images/BO5189_03_5.jpg)\n\n### Loop Cut and Slide\n\
    \n**Loop Cut and Slide**: Another tool for adding detail, it cuts new edge loops\
    \ into your object. The number of edge loops to be added can be adjusted by using\
    \ the mouse wheel:\n\n![Using the basic tools of polygon modeling](OEBPS/Images/BO5189_03_6.jpg)\n\
    \n### Bevel\n\n**Bevel**: Found in the specials menu (press `W`), the **Bevel**\
    \ tool allows you to round an edge off. The number of additional edges to add\
    \ can be adjusted by using the mouse wheel:\n\n![Using the basic tools of polygon\
    \ modeling](OEBPS/Images/BO5189_03_7.jpg)\n\n## Transforming the cube into a crate\n\
    \nTime to start transforming our cube into something worthy of our level. The\
    \ first thing we need to do is get the basic shape of our crate down:\n\n1.  Select\
    \ the cube and press the `Tab` key. This will switch you from `Object` mode to\
    \ `Edit` mode. `Object` mode is used for adding new objects to your scene and\
    \ arranging those objects using the move, rotate, and scale tools. `Edit` mode\
    \ allows you to manipulate the vertices, edges, and polygons of the object you\
    \ had selected when you switched modes:\n\n    ![Using the basic tools of polygon\
    \ modeling](OEBPS/Images/BO5189_03_8.jpg)\n\n    The selection mode buttons\n\n\
    2.  Switch to polygon selection. The selection mode buttons can be found along\
    \ the bottom of the 3D window:\n\n    ![Using the basic tools of polygon modeling](OEBPS/Images/BO5189_03_9.jpg)\n\
    \n    Insetting the face that will be the top of our crate\n\n3.  Select the top\
    \ poly and press `I` to use the `Inset` tool. Inset the polygon to create the\
    \ frame shape, like we have in our sketch. You can also type in a value (I used\
    \ `0.177`) and press `Enter`.\n\n4.  Press `E` to use the `Extrude` tool. Push\
    \ the polygon in to give the crate top a good edge.\n\n5.  We are going to `Inset`\
    \ again. Inset the polygon again to create the space for our control box. I used\
    \ `0.523` as my value. Now extrude the small polygon up to create the control\
    \ box:\n\n    ![Using the basic tools of polygon modeling](OEBPS/Images/BO5189_03_10.jpg)\n\
    \n    Creating more detail with Loop Cut and Slide\n"
  trans: "\n# 开始制作游戏资产\n\n请记住，灰盒搭建关卡的目的之一是了解我们需要哪些道具及其相对尺寸。如果我们要将这个关卡完整地推进开发流程（完成本章后，请随意继续完成关卡），我们会用详细的自定义游戏资产替换掉每一个基础形状。不过，这有点超出了本书的范围。我们将构建一个基础道具，让你开始接触\
    \ `Blender`，并熟悉将自定义美术资源导入 Unreal 的流程。经过一些练习，你关卡构建能力的唯一限制将只有你的想象力！在本章中，我们将涵盖以下主题：\n\
    \n*   开始制作游戏资产\n*   使用多边形建模的基本工具\n*   如何使用 UV 映射及其重要性\n*   为游戏资产展开 UV\n*   基础贴图技术\n\
    \n## 勾勒我们的第一个资产\n\n那么，在开始设计资产之前，我们要制作哪个资产？在灰盒阶段，我们使用了几个基础形状来代表潜在的游戏资产，这给了我们很多选择，比如全息投影仪、电脑控制台、管道、柱子或箱子。既然这很可能是你第一次尝试使用\
    \ `Blender`，我们将从为货船运输创建一个详细的箱子开始。箱子允许我们构建一个相当基础但仍能支持大量细节的物体。所以，拿一张方格纸，打开网页浏览器；是时候开始草拟了！\n\
    \n![开始制作游戏资产](img/BO5189_03_01.jpg)\n\n我的设计基于我在网上找到的几个不同科幻箱子的碎片，以及我从一些最喜欢的游戏和电影中记住的片段（科幻恰好是我最喜欢的类型之一）。箱子本身也被设计成有内部结构，这样我就可以在关卡中同时展示盖子打开和关闭的状态。这赋予了资产灵活性，让我能在许多不同场景中使用它，这是两个非常重要的设计考量。\n\
    \n### 提示\n\n由于构建独特环境需要大量工作，资产复用在游戏设计和开发中非常重要。Unreal Marketplace 上许多可用的建筑套装都设计为模块化，以创建各种不同的场景。这种做法可以追溯到最早的游戏作品。在\
    \ NES 上的《超级马里奥兄弟》中，云和灌木丛是完全相同的游戏资产，只是颜色不同。\n\n你可能注意到我绘制了箱子的几个不同视图。这让我们能从正面、侧面和背面查看物体，并设计出每个部分都有变化的物体。通过这样做，如果我们是设计创作者但不是在\
    \ 3D 中构建资产的人，也能将设计传达给团队中的另一位美术师。\n\n## 在 Blender 中设置文件\n\n现在让我们在 `Blender` 中设置文件（还记得第\
    \ 1 章的设置吗？）：\n\n![开始制作游戏资产](img/BO5189_03_2.jpg)\n\n**设置缩放以匹配 Unreal 4**\n\n1.\
    \  打开 `Blender`。\n2.  在 `Properties` 面板的 `Scene` 部分，将单位制改为 `Metric`（公制）。\n3. \
    \ 将 `Scale`（缩放）改为 `0.01`。\n4.  按 `N` 打开 `Scene Properties`（场景属性）面板，通过将 `View`（视图）下的\
    \ `Clip End`（剪切末端）属性改为 `1.0 km` 来修正网格。\n5.  将初始立方体缩放 `100` 倍，因为我们将使用它。\n6.  点击\
    \ `File`（文件）菜单并选择 `Save Startup File`（保存启动文件）。这会将我们的更改保存为默认设置，确保我们今后创建的所有文件都将具有这些设置。这将为我们节省未来的时间。\n\
    \n准备好 `Blender` 文件后，是时候开始构建我们的箱子了。\n\n# 使用多边形建模的基本工具\n\n我们将从最接近我们想要的最终形状的基础体开始构建箱子。在这种情况下，我们开始时的默认立方体非常合适。那么什么是基础体，为什么我们要从它开始呢？基础形状是你的基本形状，在\
    \ `Blender` 中包括：平面、立方体、圆、球体、圆柱体、圆锥体和环面。我们从这些形状开始，因为它们是我们所见一切的基本构建块。传统艺术家绘画时也从这些形状入手。如果你向外看，可以看到这些形状：电线杆是圆柱体，建筑物是立方体，等等。这也是\
    \ Unreal 给我们提供一个装满基础体的 Shapes（形状）文件夹来供我们灰盒搭建关卡的原因。\n\n最容易学习的 3D 建模技术之一是多边形建模，简称多边建模。它涉及操作构成基础体的顶点、边和多边形，以创造出更复杂的东西。多边建模使用以下工具：\n\
    \n![使用多边形建模的基本工具](img/BO5189_03_3.jpg)\n\n## 工具面板\n\n### 挤出\n\n**挤出**：此工具允许你向内推或向外拉一个多边面，在创建物体的新部分时非常有用：\n\
    \n![使用多边形建模的基本工具](img/BO5189_03_4.jpg)\n\n### 面内插\n\n**面内插**：内插对于在物体内部创建细节很有用，例如在建筑物上创建窗户或门：\n\
    \n![使用多边形建模的基本工具](img/BO5189_03_5.jpg)\n\n### 循环切割和滑动\n\n**循环切割和滑动**：另一个添加细节的工具，它在物体上切割新的边循环。要添加的边循环数量可以通过鼠标滚轮调整：\n\
    \n![使用多边形建模的基本工具](img/BO5189_03_6.jpg)\n\n### 倒角\n\n**倒角**：位于特殊菜单中（按 `W`），**倒角**\
    \ 工具允许你圆滑边缘。要添加的额外边数量可以通过鼠标滚轮调整：\n\n![使用多边形建模的基本工具](img/BO5189_03_7.jpg)\n\n##\
    \ 将立方体转变为箱子\n\n是时候开始将我们的立方体转变为配得上我们关卡的东西了。首先我们需要确定箱子的基本形状：\n\n1.  选择立方体并按 `Tab`\
    \ 键。这将把你从 `Object`（物体）模式切换到 `Edit`（编辑）模式。`Object` 模式用于向场景添加新物体，并使用移动、旋转和缩放工具排列这些物体。`Edit`\
    \ 模式允许你操作切换模式时所选物体的顶点、边和多边面：\n\n    ![使用多边形建模的基本工具](img/BO5189_03_8.jpg)\n\n \
    \   选择模式按钮\n\n2.  切换到多边面选择模式。选择模式按钮位于 3D 窗口底部：\n\n    ![使用多边形建模的基本工具](img/BO5189_03_9.jpg)\n\
    \n    对箱子顶部的面进行内插\n\n3.  选择顶部的面并按 `I` 使用 `Inset`（内插）工具。内插该面以创建框架形状，就像我们草图里的那样。你也可以输入数值（我用了\
    \ `0.177`）并按 `Enter`。\n\n4.  按 `E` 使用 `Extrude`（挤出）工具。向内推挤该面，给箱子顶部一个良好的边缘。\n\n\
    5.  我们要再次 `Inset`（内插）。再次内插该面以创建控制盒的空间。我用了 `0.523` 作为数值。现在挤出这个小面向上，创建控制盒：\n\n \
    \   ![使用多边形建模的基本工具](img/BO5189_03_10.jpg)\n\n    使用循环切割和滑动创建更多细节\n"
