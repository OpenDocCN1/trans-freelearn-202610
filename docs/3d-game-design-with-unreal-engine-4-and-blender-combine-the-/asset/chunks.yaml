- raw: "Now that we have our basic level geometry set inside the level, let's think\
    \ about what other more decorative elements could be added to help reinforce the\
    \ theme. Science fiction levels come in many different flavors. Some environments\
    \ might be clean and simple, such as in the Star Trek universe. Others might be\
    \ more industrial, with pipes and cabling everywhere, such as what we see in the\
    \ Alien franchise. The aesthetics of a level can be used to reinforce the theme\
    \ of an environment and communicate information to the player. In this case, we\
    \ would like to reinforce the survival horror aspects. To do that, I will lean\
    \ more toward an industrial style. Collecting reference art to help inspire your\
    \ item placement can help you get the right feel and I strongly suggest taking\
    \ a look at images online for some great examples. Remember that these props are\
    \ just placeholders for art that can be created later. Ready? Let's get started\
    \ with our first room:\n\n1.  Head on over to the **Shapes** folder within the\
    \ **Starter Content** folder. This folder contains many basic shapes that will\
    \ help approximate different props that could be created in Blender for this level.\n\
    \n2.  Grab a **Shape\\_Cylinder** and drag it into the room. I envision this first\
    \ room as being the bridge of our small cargo ship and the cylinder could serve\
    \ as the hologram projector of a heads-up display for flying the ship. I added\
    \ a **Shape\\_TriPyramid** on top of it and scaled that down a bit to make it\
    \ look more techy.\n\n3.  Add in a couple of **Shape\\_Cube** pieces and scale\
    \ them to look like control consoles. This allows us to approximate the actual\
    \ size of the 3D piece to make.\n\n4.  Using the **Shape\\_Pipe**, **Shape\\_Pipe\\\
    _90**, and **Shape\\_Pipe\\_180** pieces, add some pipes around the room to add\
    \ more detail. A good rule of thumb in square spaces is to add details to the\
    \ corners to hide the fact that the room is square. It makes the space more interesting\
    \ and provides visual variety.\n\n5.  Using the **Shape\\_Trim**, **Shape\\_Trim\\\
    _90\\_In**, and **Shape\\_Trim\\_90\\_out** pieces, add some trim where the floor\
    \ and walls meet. Once you finish that, select all your trim pieces, copy them,\
    \ and flip them over to trim the area where the walls meet the ceiling.\n\n6.\
    \  The **Props** folder contains several completed pieces we can use, not unlike\
    \ the pieces we will make using Blender later in this book. Grab a couple of chairs\
    \ to add to our bridge, near our \"computer console\" placeholder shapes.\n\n\
    7.  Using the **Shape\\_Cube** piece again, add some variety to the back and side\
    \ walls.\n\nHere is my completed whitebox of the bridge:\n\n![Using the Content\
    \ Browser to start building the level](OEBPS/Images/BO5189_02_13.jpg)\n\nThe final\
    \ bridge whitebox\n\nAnd my completed whitebox of the cargo bay:\n\n![Using the\
    \ Content Browser to start building the level](OEBPS/Images/BO5189_02_14.jpg)\n\
    \nThe final whitebox of the cargo bay\n\nIs it starting to feel more like an environment?\
    \ If not, add a few more shapes or props until your level feels more natural.\
    \ However, do not go too far. We want our level to have some objects in it to\
    \ convey story and immerse the player in our environment. We don't want to overcrowd\
    \ the level and have it feel clunky and cluttered. Take some time to add some\
    \ detail to the hallway and the second room. In the next section, we will take\
    \ a look at techniques to light our level with our theme in mind.\n\n# Using different\
    \ types of light\n\nThroughout the level, we have been using basic lights just\
    \ to give our work in progress some illumination. In this section, we are going\
    \ to transform our lighting into something that seems more realistic for our theme\
    \ and communicates it to the player. Proper lighting is something that is important\
    \ to make a scene or environment seem believable. It can make an audience feel\
    \ anxious or scared, and create a sense of tension. It can communicate danger\
    \ or safety. In games, it can even be a game mechanic. In our scene, we are going\
    \ to use lighting to communicate a sense of mystery and a tension that something\
    \ just might be going on beyond the player's ability to see.\n\nTo create this\
    \ feel, let's think about what we might need. Plunging our corners into shadow\
    \ and limiting the player's line of sight can go a long way to making them think\
    \ that something might be stalking them, just out of sight. Using different colored\
    \ lights to denote danger and safety can communicate those things to the player\
    \ and thus create or relieve tension. Just like when we were gathering inspiration\
    \ from online images to help with item placement, images from other games, and\
    \ especially real life, can help with figuring out the right lighting for your\
    \ level. Unreal provides a few different types of light to help us achieve these\
    \ goals. **PointLights** are a type of light we are already familiar with. They\
    \ cast light in all directions from a fixed point in space. Next we have **SpotLights**.\
    \ These lights throw light in a cone shape toward a target point. This can be\
    \ used to highlight specific things in an environment. Lastly, we have **DirectionalLights**\
    \ and **SkyLights**. These are large light sources that create a universal amount\
    \ of light throughout the level. **DirectionalLights** are often used to create\
    \ the sun or moon in an outdoor environment. For each type of light, the **Details**\
    \ panel provides several options for tweaking the intensity, shadows, falloff,\
    \ and color. Ready to add some emotion to our environment?\n\n1.  Let's start\
    \ our lighting process by deleting all but one light from each room. This will\
    \ allow us to start with something very basic. Don't forget to build the level\
    \ after you have made lighting changes. This allows Unreal to process the changes\
    \ to the shadows and give you an accurate look at your changes.\n\n2.  Select\
    \ the light located near the **PlayerStart**. The bridge area of our small ship\
    \ is where the player starts and should feel at least marginally safer than the\
    \ rest of the ship: ![Using different types of light](OEBPS/Images/BO5189_02_15.jpg)\n\
    \n    Creating a green light for the bridge\n\n3.  Change the color of the light\
    \ to a pale green. This is done by selecting the light and clicking the **Light\
    \ Color** option. This will bring up a color wheel that allows you to select a\
    \ new color for the light.\n\n4.  At the default level, the light is too bright\
    \ for our purposes. In the details panel, find the **Intensity** property and\
    \ put in a lower value. I set my light to `250`.\n\n5.  Lights have an area of\
    \ effect that is governed by a property called **Attenuation**. This is essentially\
    \ the radius in which the light goes from full power to zero. A light that has\
    \ its **Attenuation** set to `0` does not have any falloff at all and is at full\
    \ intensity. We want the light to not be much more than what might be put out\
    \ by a computer screen. Let's set it to `250`.\n\n6.  Since we wanted the light\
    \ to put out only as much light as a computer screen, go ahead and move it over\
    \ near our computer console shape.\n\n7.  If we look at the shadows cast by our\
    \ light, they are very harsh and hard edged. Not at all what we would see in reality.\
    \ Most lighting tends to create very soft and diffuse shadows and we would like\
    \ to mimic that here. We do that by adding a **Source Radius** in the **Details**\
    \ panel. Mine is set to `150`: ![Using different types of light](OEBPS/Images/BO5189_02_16.jpg)\n\
    \n    The final lighting setup on the bridge\n\n8.  Now that we have all of our\
    \ settings for the light completed, let's copy the light over to our other computer\
    \ console and above where our holographic display is (above the pyramid shape).\n\
    \n9.  The following screenshot shows the final lighting setup in the cargo bay:\
    \ ![Using different types of light](OEBPS/Images/BO5189_02_17.jpg)\n\n    Final\
    \ lighting setup for the cargo bay"
  fmt: "\n# Adding Decorative Elements to the Level\n\nNow that we have our basic\
    \ level geometry set inside the level, let's think about what other more decorative\
    \ elements could be added to help reinforce the theme. Science fiction levels\
    \ come in many different flavors. Some environments might be clean and simple,\
    \ such as in the Star Trek universe. Others might be more industrial, with pipes\
    \ and cabling everywhere, such as what we see in the Alien franchise. The aesthetics\
    \ of a level can be used to reinforce the theme of an environment and communicate\
    \ information to the player. In this case, we would like to reinforce the survival\
    \ horror aspects. To do that, I will lean more toward an industrial style. Collecting\
    \ reference art to help inspire your item placement can help you get the right\
    \ feel and I strongly suggest taking a look at images online for some great examples.\
    \ Remember that these props are just placeholders for art that can be created\
    \ later. Ready? Let's get started with our first room:\n\n1.  Head on over to\
    \ the `Shapes` folder within the `Starter Content` folder. This folder contains\
    \ many basic shapes that will help approximate different props that could be created\
    \ in Blender for this level.\n\n2.  Grab a `Shape_Cylinder` and drag it into the\
    \ room. I envision this first room as being the bridge of our small cargo ship\
    \ and the cylinder could serve as the hologram projector of a heads-up display\
    \ for flying the ship. I added a `Shape_TriPyramid` on top of it and scaled that\
    \ down a bit to make it look more techy.\n\n3.  Add in a couple of `Shape_Cube`\
    \ pieces and scale them to look like control consoles. This allows us to approximate\
    \ the actual size of the 3D piece to make.\n\n4.  Using the `Shape_Pipe`, `Shape_Pipe_90`,\
    \ and `Shape_Pipe_180` pieces, add some pipes around the room to add more detail.\
    \ A good rule of thumb in square spaces is to add details to the corners to hide\
    \ the fact that the room is square. It makes the space more interesting and provides\
    \ visual variety.\n\n5.  Using the `Shape_Trim`, `Shape_Trim_90_In`, and `Shape_Trim_90_out`\
    \ pieces, add some trim where the floor and walls meet. Once you finish that,\
    \ select all your trim pieces, copy them, and flip them over to trim the area\
    \ where the walls meet the ceiling.\n\n6.  The `Props` folder contains several\
    \ completed pieces we can use, not unlike the pieces we will make using Blender\
    \ later in this book. Grab a couple of chairs to add to our bridge, near our \"\
    computer console\" placeholder shapes.\n\n7.  Using the `Shape_Cube` piece again,\
    \ add some variety to the back and side walls.\n\n## Bridge Whitebox\n\nHere is\
    \ my completed whitebox of the bridge:\n\n![Using the Content Browser to start\
    \ building the level](`OEBPS/Images/BO5189_02_13.jpg`)\n\n*The final bridge whitebox*\n\
    \n## Cargo Bay Whitebox\n\nAnd my completed whitebox of the cargo bay:\n\n![Using\
    \ the Content Browser to start building the level](`OEBPS/Images/BO5189_02_14.jpg`)\n\
    \n*The final whitebox of the cargo bay*\n\nIs it starting to feel more like an\
    \ environment? If not, add a few more shapes or props until your level feels more\
    \ natural. However, do not go too far. We want our level to have some objects\
    \ in it to convey story and immerse the player in our environment. We don't want\
    \ to overcrowd the level and have it feel clunky and cluttered. Take some time\
    \ to add some detail to the hallway and the second room. In the next section,\
    \ we will take a look at techniques to light our level with our theme in mind.\n\
    \n# Using Different Types of Light\n\nThroughout the level, we have been using\
    \ basic lights just to give our work in progress some illumination. In this section,\
    \ we are going to transform our lighting into something that seems more realistic\
    \ for our theme and communicates it to the player. Proper lighting is something\
    \ that is important to make a scene or environment seem believable. It can make\
    \ an audience feel anxious or scared, and create a sense of tension. It can communicate\
    \ danger or safety. In games, it can even be a game mechanic. In our scene, we\
    \ are going to use lighting to communicate a sense of mystery and a tension that\
    \ something just might be going on beyond the player's ability to see.\n\nTo create\
    \ this feel, let's think about what we might need. Plunging our corners into shadow\
    \ and limiting the player's line of sight can go a long way to making them think\
    \ that something might be stalking them, just out of sight. Using different colored\
    \ lights to denote danger and safety can communicate those things to the player\
    \ and thus create or relieve tension. Just like when we were gathering inspiration\
    \ from online images to help with item placement, images from other games, and\
    \ especially real life, can help with figuring out the right lighting for your\
    \ level. Unreal provides a few different types of light to help us achieve these\
    \ goals. `PointLights` are a type of light we are already familiar with. They\
    \ cast light in all directions from a fixed point in space. Next we have `SpotLights`.\
    \ These lights throw light in a cone shape toward a target point. This can be\
    \ used to highlight specific things in an environment. Lastly, we have `DirectionalLights`\
    \ and `SkyLights`. These are large light sources that create a universal amount\
    \ of light throughout the level. `DirectionalLights` are often used to create\
    \ the sun or moon in an outdoor environment. For each type of light, the `Details`\
    \ panel provides several options for tweaking the intensity, shadows, falloff,\
    \ and color. Ready to add some emotion to our environment?\n\n1.  Let's start\
    \ our lighting process by deleting all but one light from each room. This will\
    \ allow us to start with something very basic. Don't forget to build the level\
    \ after you have made lighting changes. This allows Unreal to process the changes\
    \ to the shadows and give you an accurate look at your changes.\n\n2.  Select\
    \ the light located near the `PlayerStart`. The bridge area of our small ship\
    \ is where the player starts and should feel at least marginally safer than the\
    \ rest of the ship:\n\n    ![Using different types of light](`OEBPS/Images/BO5189_02_15.jpg`)\n\
    \n    *Creating a green light for the bridge*\n\n3.  Change the color of the light\
    \ to a pale green. This is done by selecting the light and clicking the `Light\
    \ Color` option. This will bring up a color wheel that allows you to select a\
    \ new color for the light.\n\n4.  At the default level, the light is too bright\
    \ for our purposes. In the details panel, find the `Intensity` property and put\
    \ in a lower value. I set my light to `250`.\n\n5.  Lights have an area of effect\
    \ that is governed by a property called `Attenuation`. This is essentially the\
    \ radius in which the light goes from full power to zero. A light that has its\
    \ `Attenuation` set to `0` does not have any falloff at all and is at full intensity.\
    \ We want the light to not be much more than what might be put out by a computer\
    \ screen. Let's set it to `250`.\n\n6.  Since we wanted the light to put out only\
    \ as much light as a computer screen, go ahead and move it over near our computer\
    \ console shape.\n\n7.  If we look at the shadows cast by our light, they are\
    \ very harsh and hard edged. Not at all what we would see in reality. Most lighting\
    \ tends to create very soft and diffuse shadows and we would like to mimic that\
    \ here. We do that by adding a `Source Radius` in the `Details` panel. Mine is\
    \ set to `150`:\n\n    ![Using different types of light](`OEBPS/Images/BO5189_02_16.jpg`)\n\
    \n    *The final lighting setup on the bridge*\n\n8.  Now that we have all of\
    \ our settings for the light completed, let's copy the light over to our other\
    \ computer console and above where our holographic display is (above the pyramid\
    \ shape).\n\n9.  The following screenshot shows the final lighting setup in the\
    \ cargo bay:\n\n    ![Using different types of light](`OEBPS/Images/BO5189_02_17.jpg`)\n\
    \n    *Final lighting setup for the cargo bay*\n"
  trans: "\n# 为关卡添加装饰元素\n\n现在我们已经在关卡中设置了基本的关卡几何体，让我们思考一下还可以添加哪些更具装饰性的元素来帮助强化主题。科幻关卡有多种不同的风格。有些环境可能简洁明了，就像《星际迷航》宇宙中的那样。其他的可能更偏向工业风，到处都是管道和线缆，就像我们在《异形》系列中看到的那样。关卡的美学可以用来强化环境的主题并向玩家传达信息。在本例中，我们想要强化生存恐怖的氛围。为此，我将更多地倾向于工业风格。收集参考美术来帮助激发你的物品摆放灵感，可以帮助你获得正确的感觉，我强烈建议你在网上查看一些图片以获取优秀的范例。请记住，这些道具只是稍后可以创建的美术资源的占位符。准备好了吗？让我们开始制作第一个房间：\n\
    \n1.  前往 `Starter Content` 文件夹中的 `Shapes` 文件夹。该文件夹包含许多基本形状，将有助于近似表示可在 Blender\
    \ 中为该关卡创建的不同道具。\n\n2.  拿一个 `Shape_Cylinder` 并将其拖入房间。我设想这个第一个房间是我们小型货船的舰桥，而圆柱体可以作为飞船驾驶的平视显示器的全息投影仪。我在它上面添加了一个\
    \ `Shape_TriPyramid` 并将其缩小了一些，使其看起来更有科技感。\n\n3.  添加几个 `Shape_Cube` 并缩放它们，使其看起来像控制台。这使我们能够近似实际要制作的\
    \ 3D 模型的尺寸。\n\n4.  使用 `Shape_Pipe`、`Shape_Pipe_90` 和 `Shape_Pipe_180` 部件，在房间周围添加一些管道以增加细节。在方形空间中，一个好的经验法则是向角落添加细节以掩盖房间是方形的事实。这会让空间更有趣并提供视觉多样性。\n\
    \n5.  使用 `Shape_Trim`、`Shape_Trim_90_In` 和 `Shape_Trim_90_out` 部件，在地板和墙壁相接的地方添加一些装饰条。完成后，选择所有装饰条部件，复制它们，并将它们翻转过来，以装饰墙壁与天花板相接的区域。\n\
    \n6.  `Props` 文件夹包含几个完成的部件供我们使用，这与我们稍后在本书中将使用 Blender 制作的部件类似。拿几把椅子添加到我们的舰桥上，靠近我们的“电脑控制台”占位符形状。\n\
    \n7.  再次使用 `Shape_Cube` 部件，为后墙和侧墙增加一些变化。\n\n## 舰桥白模\n\n这是我完成的舰桥白模：\n\n![使用内容浏览器开始构建关卡](img/BO5189_02_13.jpg`)\n\
    \n*最终的舰桥白模*\n\n## 货舱白模\n\n这是我完成的货舱白模：\n\n![使用内容浏览器开始构建关卡](img/BO5189_02_14.jpg`)\n\
    \n*货舱最终白模*\n\n它开始让人感觉更像一个环境了吗？如果没有，再添加一些形状或道具，直到你的关卡感觉更自然。但是，不要过度。我们希望关卡中有一些物体来传达故事并让玩家沉浸在我们的环境中。我们不希望关卡过于拥挤，让人感觉笨重和杂乱。花些时间为走廊和第二个房间添加一些细节。在下一节中，我们将着眼于如何根据我们的主题为关卡打光。\n\
    \n# 使用不同类型的光照\n\n在整个关卡中，我们一直在使用基础灯光，只是为了给我们的进行中的工作提供一些照明。在本节中，我们将把灯光转变为更符合我们主题且能向玩家传达主题的东西。适当的灯光对于使场景或环境显得可信非常重要。它可以让观众感到焦虑或恐惧，并营造紧张感。它可以传达危险或安全。在游戏中，它甚至可以成为一种游戏机制。在我们的场景中，我们将利用灯光来传达一种神秘感和一种张力，即可能有事情正在玩家视野之外发生。\n\
    \n要创造这种感觉，让我们思考一下可能需要什么。将角落沉浸在阴影中并限制玩家的视线，可以在很大程度上让他们觉得可能有东西正在视线之外潜伏着他们。使用不同颜色的灯光来表示危险和安全，可以向玩家传达这些信息，从而产生或缓解张力。就像我们之前收集网上的图片来帮助物品摆放一样，其他游戏的图片，尤其是现实生活中的图片，可以帮助你找出适合你关卡的正确灯光。Unreal\
    \ 提供了几种不同类型的灯光来帮助我们实现这些目标。`PointLights` 是我们已经熟悉的一种灯光类型。它们从空间中的固定点向所有方向投射光线。接下来是\
    \ `SpotLights`。这些灯光以锥形向目标点投射光线。这可以用来突出环境中的特定事物。最后，我们有 `DirectionalLights` 和 `SkyLights`。这些是大型光源，可在整个关卡中创建统一的光照量。`DirectionalLights`\
    \ 通常用于在室外环境中创建太阳或月亮。对于每种类型的灯光，`Details` 面板都提供了多个选项来调整强度、阴影、衰减和颜色。准备好为我们的环境添加一些情感了吗？\n\
    \n1.  让我们通过删除每个房间中除一盏灯以外的所有灯光来开始我们的灯光制作过程。这将使我们能够从非常基础的东西开始。别忘了在进行灯光更改后构建关卡。这允许\
    \ Unreal 处理阴影的变化，并让你准确地看到你的更改。\n\n2.  选择靠近 `PlayerStart` 的灯光。我们小飞船的舰桥区域是玩家的起始位置，应该感觉至少比飞船的其他地方稍微安全一些：\n\
    \n    ![使用不同类型的光照](img/BO5189_02_15.jpg`)\n\n    *为舰桥创建绿色灯光*\n\n3.  将灯光的颜色改为淡绿色。这是通过选择灯光并点击\
    \ `Light Color` 选项来完成的。这将弹出一个色轮，允许你为灯光选择新颜色。\n\n4.  在默认级别下，灯光对于我们的目的来说太亮了。在细节面板中，找到\
    \ `Intensity` 属性并输入一个较低的值。我将我的灯光设置为 `250`。\n\n5.  灯光具有一个影响区域，由一个称为 `Attenuation`\
    \ 的属性控制。这本质上是灯光从全功率衰减到零的半径。`Attenuation` 设置为 `0` 的灯光完全没有衰减，且处于全强度。我们希望灯光的亮度不超过电脑屏幕可能发出的亮度。让我们将其设置为\
    \ `250`。\n\n6.  既然我们希望灯光发出的光线仅相当于电脑屏幕，那就把它移到我们的电脑控制台形状附近。\n\n7.  如果我们看看灯光投射的阴影，它们非常生硬且边缘锐利。这完全不是我们在现实中会看到的样子。大多数灯光倾向于产生非常柔和和漫射的阴影，我们希望在这里模仿这一点。我们通过在\
    \ `Details` 面板中添加 `Source Radius` 来实现这一点。我的设置为 `150`：\n\n    ![使用不同类型的光照](img/BO5189_02_16.jpg`)\n\
    \n    *舰桥上的最终灯光设置*\n\n8.  现在我们已经完成了灯光的所有设置，让我们将灯光复制到另一个电脑控制台上方和全息显示器上方（金字塔形状上方）。\n\
    \n9.  下面的屏幕截图显示了货舱中的最终灯光设置：\n\n    ![使用不同类型的光照](img/BO5189_02_17.jpg`)\n\n   \
    \ *货舱的最终灯光设置*\n"
