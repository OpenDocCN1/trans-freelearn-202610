    1. Start the tentacle by creating a **Cube** with a `5cm` **Radius**; I know it''s
    not a cylinder but bear with me. Select the four lines through the center of the
    cube and click **Subdivide** to cut the cube in half.


    2. Select all the polygons on the right side of the cube and delete them. Now
    add the **Mirror** modifier by clicking the wrench icon in the **Properties**
    pane to open up the **Modifier** menu. Click on the **Add Modifier** dropdown
    and select **Mirror**. Unlike in [Chapter 2](#ch02.xhtml "Chapter 2. Starting
    Our First Project"), *Starting Our First Project*, we are going to leave this
    on for the moment before we apply it:

    ![Using multiple shapes within Blender](OEBPS/Images/BO5189_06_29.jpg)


    Bevel the cube, then use the Mirror modifier to make it symmetrical


    3. Now we are going to make our tentacle by beveling the corners of our cube.
    Use the **Bevel** tool to apply some rounding to the individual corners until
    it looks more organic. Yours may look a bit different than mine and that''s ok!
    I used about eight to ten bevels.


    4. Time to apply the **Mirror** modifier. Head back to Object mode and click **Apply**:

    ![Using multiple shapes within Blender](OEBPS/Images/BO5189_06_30.jpg)


    Create a Bezier Curve. Our tentacle piece will be duplicated along the curve to
    create the final form


    5. **Bezier Curves** are curves that have handles which can be moved around to
    create graceful bends and curves. This provides structure for our tentacle. Head
    over to **Object** mode and use the **Add** menu, select **Curves**, and choose
    **Bezier**. Use the **Move** and **Rotate** tools to move it alongside your tentacle
    piece.


    6. All the rest of the fun is in the **Modifiers** menu. On the tentacle object,
    add an **Array** modifier. Array allows us to create multiple copies of an object,
    usually in a shape or line. In this case, we will use it to create more tentacle
    sections along the **Bezier Curve**. In the modifier, change the **Fit Type**
    to **Fit Curve** and choose the **Bezier Curve** in the next box. Also click the
    checkbox next to **Merge** and **First Last**; this will improve our result. If
    your tentacle pieces copy in a weird direction like mine did, change the **X**,
    **Y**, **Z** numbers under **Relative Offset** until you get the result you want.


    7. To finish the tentacle, add a **Curve** modifier. In the **Object** portion
    of its settings, choose our **Bezier Curve**. The tentacle is now complete! Click
    on the **Bezier Curve** and head to **Edit** mode. Stretch the two points and
    see that the tentacle grows as you move them. In the **Scene Properties** panel,
    changing the **Radius** option under **Transform** can taper the end of your tentacle.
    Lastly, if you need more control over your tentacle, select the two points on
    the **Bezier Curve** and click **Subdivide**. This will add another point that
    can be moved around to better bend and curve your shape:

    ![Using multiple shapes within Blender](OEBPS/Images/BO5189_06_31.jpg)


    Duplicate the finished tentacle to give the Artifact legs!


    8. Finally, use your tentacles to create the legs of the Artifact. Move the first
    **Bezier Curve** point into contact with our bottom piece. Then move the other
    points into the shape you want. I used four points per curve. Remember, to duplicate
    a tentacle you need to copy both the tentacle piece and the **Bezier Curve**.


    How is it looking? If you are having problems adjusting the **Bezier Curve** points
    don''t give up! They can be hard to work with at first but the results are worth
    all the trouble:


    ![Using multiple shapes within Blender](OEBPS/Images/BO5189_06_32.jpg)


    The Artifact has over 7,000 tris!


    As we put these great touches on our game asset, there are a couple of things
    we need to keep track of; luckily Blender does it for us. At the top of the 3D
    viewport, Blender keeps a count of the total number of **Faces** (polygons) and
    **Tris** our asset has. This is important because game engines have to work harder
    to display our level the more **Tris** our assets have. Currently, the Tri limit
    in Unreal for a single static mesh is 10,000, and that would be a character or
    weapon, something the player looks at closely. Some of our pieces have pretty
    high tri counts. In the next chapter, we will take a look at ways to optimize
    each piece of the Artifact before we UV Unwrap it.


    # Summary


    In this chapter, we went through the art process for designing and producing a
    complex game asset with a specific narrative and background in mind. The result
    is the Artifact, an eldritch terror weapon created by followers of a forgotten
    god. This game asset uses multiple shapes and was designed with function and animation
    in mind. As part of its design, we built gears and pistons, as well as some otherworldly
    tentacles. This thing is most assuredly responsible for the disappearance of both
    the crew of the cargo ship and the inhabitants of our space station. In the next
    chapter, we will take a look at what it takes to UV Unwrap something this complex,
    as we prep our game asset for animation and get it ready for Unreal.


    The Artifact is ready to unleash its hellish power! However, it doesn''t really
    look like much with its default grey exterior. Just like we did in [Chapter 3](#ch03.xhtml
    "Chapter 3. It''s Time to Customize!"), *It''s Time to Customize!* we need to
    UV Unwrap it so that we can create a material for it and bring it into Unreal.
    Unlike our crate, the Artifact is a much more complex object and is made of multiple
    smaller objects. This will require us to use a different technique to create the
    UV map and for that we need some different tools. Rather than use the Smart UV
    Project option, we will use custom seams to flatten out the different sections
    of the Artifact. In this chapter, we will cover the following topics:


    *   Unwrapping complex objects

    *   Custom seams and the Unwrap tool

    *   Using Smart UV Project along with other mapping tools

    *   Using different types of texture maps together, to create a more realistic
    look


    # Unwrapping complex objects


    Back in [Chapter 3](#ch03.xhtml "Chapter 3. It''s Time to Customize!"), *It''s
    Time to Customize!*, we learned a simple technique for UV unwrapping called Smart
    UV Project, a tool that can unwrap simple objects automatically. This process
    worked great for our crate, but the crate was little more than a slightly modified
    box. The crate really didn''t have much in the way of curves and its triangle
    count only reached 516. The Artifact will take a little bit more work to unwrap.
    Our new asset contains 42 separate pieces and has a whopping 54,000 triangles.
    To unwrap this monstrous game asset, we will need to apply several new tools and
    techniques.


    ## Marking seams


    Seams are lines along which **Unwrap** tool can slice an object to flatten it
    out during the unwrapping process:


    ![Marking seams](OEBPS/Images/B05189_07_01.jpg)


    Using custom seams to UV Unwrap a basic cube


    Using the **Mark Seam** tool, we can control which lines becomes seams, giving
    us complete control of the process. We can also use this tool to hide our seams
    in places a player will not be able to see them. This can be along areas that
    are normally hidden, along sharp angles or creases, and in areas where the material
    we are using changes dramatically.


    ## Unwrap tool


    ![Unwrap tool](OEBPS/Images/B05189_07_02.jpg)


    Unwrap tells Blender to mash our object flat, splitting at the custom seams we
    have marked


    After making our seams, we need to tell Blender to flatten out our object. This
    is done using the **Angle Based Unwrap** tool, or simply the **Unwrap** tool.
    **Unwrap** takes our seams and treats them like cuts in a cardboard box, then
    mashes our object flat. The results aren''t always perfect. However, Blender has
    several other tools that can fix these minor issues.


    ## Stitch


    ![Stitch](OEBPS/Images/B05189_07_03.jpg)


    Stitch allows us to fix some errors that the Unwrap tool may have created

