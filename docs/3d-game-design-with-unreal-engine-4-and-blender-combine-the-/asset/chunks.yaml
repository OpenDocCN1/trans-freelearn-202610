    \ like this very quickly. The sticky notes make the ideas movable so that you\
    \ can easily organize them into any order you choose.\n\nNow there's a few great\
    \ ideas! The next step is to arrange them into a logical order that can be programmed.\
    \ Computers can't do anything we haven't specifically spelled out for them, so\
    \ we have to be pretty clear about our instructions. Here is just one example\
    \ of how I might order the instructions:\n\n1.  Animate the doors and windows\
    \ closed.\n\n2.  Some kind of loud noise.\n\n3.  Fire the smoke emitter.\n\n4.\
    \  Fire the spark emitter.\n\n5.  Play some clue to the player to let them know\
