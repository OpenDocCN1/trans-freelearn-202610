- raw: "Remember that one of the purposes of whiteboxing a level is to get an idea\
    \ for the props that we need and their relative sizes. If we were going to take\
    \ this level all the way through development (and feel free to finish the level\
    \ after this chapter), we would replace every basic shape with a detailed custom\
    \ game asset. However, that is a bit outside the scope of this book. What we will\
    \ do is build a basic prop to get you started with **Blender** and get you comfortable\
    \ with the process of bringing custom art into Unreal. With some practice, the\
    \ only limit to your level building ability will be your imagination! In this\
    \ chapter, we will cover the following topics:\n\n*   Getting started making game\
    \ assets\n\n*   Using the basic tools of polygon modeling\n\n*   How to use UV\
    \ mapping and why it's important\n\n*   UV unwrapping our game asset\n\n*   Basic\
    \ texturing techniques\n\n# Getting started making game assets\n\nSo, before we\
    \ get started designing our asset, which asset will we be building? During our\
    \ whiteboxing, we used several basic shapes to represent potential game assets\
    \ and this gives us many to choose from, such as a hologram projector, computer\
    \ console, pipes, columns, or crates. Since this is likely to be your first foray\
    \ into using Blender, we will start by creating a detailed crate for our cargo\
    \ ship to be transporting. A crate allows us to build something that is fairly\
    \ basic but can still support a lot of detail. So go ahead and grab yourself another\
    \ piece of graph paper and open your web browser; it's time to sketch!\n\n![Getting\
    \ started making game assets](OEBPS/Images/BO5189_03_01.jpg)\n\nSketching out\
    \ our first asset\n\nMy design is based on bits and pieces of several different\
    \ sci-fi crates I found online and that I remembered from some of my favorite\
    \ games and movies (sci-fi happens to be one of my favorite genres). The crate\
    \ itself is also designed to have an inside, so I can show it in my level with\
    \ both the lid on and off. This gives the asset flexibility and allows me to use\
    \ it in many different situations, two very important design considerations.\n\
    \n### Tip\n\nReuse of assets is important to game design and development due to\
    \ the large amount of work it takes to build unique environments. Many building\
    \ sets available in the Unreal Marketplace are designed to be modular to create\
    \ a variety of different scenes. This practice goes back to even the earliest\
    \ game titles. In Super Mario Bros. on the NES, the clouds and bushes are the\
    \ exact same game asset, just different colors.\n\nYou may have noticed that I\
    \ did a few different views of my crate. This allows us to see our object from\
    \ the front, side, and back, and design an object with some variety to each section.\
    \ By doing this, we can also communicate the design to another artist on the team\
    \ if we're the ones who created the design but not the ones who will be building\
    \ the asset in 3D.\n\nNow let's set up our file in Blender (remember our settings\
    \ from [Chapter 1](#ch01.xhtml \"Chapter 1. Unreal, My Friend, I'd Like You to\
    \ Meet Blender\"), *Unreal, My Friend, I'd Like You to Meet Blender*?):\n\n![Getting\
    \ started making game assets](OEBPS/Images/BO5189_03_2.jpg)\n\nSetting our scale\
    \ to match Unreal 4\n\n1.  Open **Blender**.\n\n2.  Change the unit scale to **Metric**\
    \ in the **Scene** portion of the **Properties** pane.\n\n3.  Change the **Scale**\
    \ to `0.01`.\n\n4.  Press *N* to open the **Scene Properties** pane and fix the\
    \ grid by changing the **Clip End** property under **View** to `1.0 km`.\n\n5.\
    \  Scale your starter cube by `100` since we will be using it.\n\n6.  Click the\
    \ **File** menu and select **Save Startup File**. This will save our changes as\
    \ the default settings and make sure that all the files we create going forward\
    \ will have these settings. This will save us time in the future.\n\nWith our\
    \ Blender file ready to go, it's time to begin building our crate.\n\n# Using\
    \ the basic tools of polygon modeling\n\nWe will begin building our crate with\
    \ the primitive object that is closest to the finished shape we want. In this\
    \ case, the default cube we start with works great. So what is a primitive and\
    \ why do we start with one? Primitive shapes are your basic shapes, in the case\
    \ of Blender: plane, cube, circle, sphere, cylinder, cone, and torus. We start\
    \ with these shapes since they are the basic building blocks of all we see. Traditional\
    \ artists start with these when they draw as well. If you take a look outside,\
    \ you can see these shapes: poles are cylinders, buildings are cubes, and so on.\
    \ That is also the reason why Unreal gives us a Shapes folder full of primitives\
    \ to block out our levels with.\n\nOne of the easiest 3D modeling techniques to\
    \ learn is Polygon modeling, or simply, poly modeling. It involves manipulating\
    \ the vertices, edges, and polygons that make up a primitive shape to create something\
    \ greater. Poly modeling uses the following tools:\n\n![Using the basic tools\
    \ of polygon modeling](OEBPS/Images/BO5189_03_3.jpg)\n\nThe Tools panel\n\n**Extrude**:\
    \ This tool allows you to push a polygon in or pull it out and is very useful\
    \ in creating new portions of an object:\n\n![Using the basic tools of polygon\
    \ modeling](OEBPS/Images/BO5189_03_4.jpg)\n\nUsing the Extrude tool\n\n**Inset\
    \ Faces**: Inset is useful for creating details within an object, such as creating\
    \ windows or doors on a building:\n\n![Using the basic tools of polygon modeling](OEBPS/Images/BO5189_03_5.jpg)\n\
    \nInsetting a face\n\n**Loop Cut and Slide**: Another tool for adding detail,\
    \ it cuts new edge loops into your object. The number of edge loops to be added\
    \ can be adjusted by using the mouse wheel:\n\n![Using the basic tools of polygon\
    \ modeling](OEBPS/Images/BO5189_03_6.jpg)\n\nLoop Cut and Slide is a great way\
    \ to add additional detail to an asset\n\nThe other tools in the palette are situational,\
    \ but there is one more I would like to talk about that is not in this menu.\n\
    \n**Bevel**: Found in the specials menu (press *W*), the **Bevel** tool allows\
    \ you to round an edge off. The number of additional edges to add can be adjusted\
    \ by using the mouse wheel:\n\n![Using the basic tools of polygon modeling](OEBPS/Images/BO5189_03_7.jpg)\n\
    \nBevel can create a rounded corner with ease\n\nTime to start transforming our\
    \ cube into something worthy of our level. The first thing we need to do is get\
    \ the basic shape of our crate down:\n\n1.  Select the cube and press the *Tab*\
    \ key. This will switch you from **Object** mode to **Edit** mode. **Object**\
    \ mode is used for adding new objects to your scene and arranging those objects\
    \ using the move, rotate, and scale tools. **Edit** mode allows you to manipulate\
    \ the vertices, edges, and polygons of the object you had selected when you switched\
    \ modes: ![Using the basic tools of polygon modeling](OEBPS/Images/BO5189_03_8.jpg)\n\
    \n    The selection mode buttons\n\n2.  Switch to polygon selection. The selection\
    \ mode buttons can be found along the bottom of the 3D window: ![Using the basic\
    \ tools of polygon modeling](OEBPS/Images/BO5189_03_9.jpg)\n\n    Insetting the\
    \ face that will be the top of our crate\n\n3.  Select the top poly and press\
    \ *I* to use the **Inset** tool. Inset the polygon to create the frame shape,\
    \ like we have in our sketch. You can also type in a value (I used `0.177`) and\
    \ press *Enter*.\n\n4.  Press *E* to use the **Extrude** tool. Push the polygon\
    \ in to give the crate top a good edge.\n\n5.  We are going to **Inset** again.\
    \ Inset the polygon again to create the space for our control box. I used `0.523`\
    \ as my value. Now extrude the small polygon up to create the control box: ![Using\
    \ the basic tools of polygon modeling](OEBPS/Images/BO5189_03_10.jpg)\n\n    Creating\
    \ more detail with Loop Cut and Slide"
