- raw: "Blocking volumes can also be used as the collision mesh for assets we create.\
    \ For example, we often use the column asset in the **Architecture** folder to\
    \ represent a pillar or similar floor-to-ceiling piece. Using a box shaped blocking\
    \ volume, we can have whatever custom asset we create take up the same space while\
    \ being able to create a truly custom shape, such as a pillar made of tentacles.\n\
    \nAnother technique we can use during whiteboxing is using subtraction brushes\
    \ with **BSP** to create custom shapes. BSP is something that we are familiar\
    \ with. When we drop a box BSP brush into the level it creates a box. This defaults\
    \ to using an additive brush and creates the shape within our level. The **Details**\
    \ panel allows us to change the general size of the box but not much else.\n\n\
    Subtractive brushes are the exact opposite:\n\n![Whiteboxing a level for better\
    \ asset creation](OEBPS/Images/BO5189_05_03.jpg)\n\nChanging a brush from additive\
    \ to subtractive in the Details panel\n\nA subtractive brush allows us to use\
    \ the shape of a brush just like a cookie cutter to create doorways, holes, and\
    \ more. Remember, this only works with additive and subtractive BSP brushes. You\
    \ cannot use a subtractive brush to cut a hole in a static mesh.\n\nLet's create\
    \ a window for our security checkpoint:\n\n1.  Click on the **BSP** tab of the\
    \ **Modes** panel and drag a **Box** into our level. In the **Details** panel,\
    \ change the **X** to `20`, **Y** to `800` so it will cover the space of two of\
    \ our wall sections, and **Z** to `400` to fit the same vertical space as our\
    \ wall section.\n\n2.  Fit the new brush into the section of the security checkpoint\
    \ where we would like to have the window.\n\n3.  Drag another BSP **Box** into\
    \ our level from the **Modes** panel. For this brush, we will set the **X** to\
    \ `30` so it's a bit wider than our wall, **Y** to `600`, and **Z** to `200`.\n\
    \n4.  Lastly, change the **Brush Type** from **Additive** to **Subtractive**:\
    \ ![Whiteboxing a level for better asset creation](OEBPS/Images/BO5189_05_04.jpg)\n\
    \n    The final result of using our subtractive brush. Now we have a window!\n\
    \n5.  Drag this brush so that it intersects our wall brush. This should create\
    \ just the hole we want. Remember that if you want to copy this brush to use in\
    \ other parts of the level that you must select both brushes to get the right\
    \ effect.\n\n# Level design principles\n\nWhen building game levels, understanding\
    \ how to use the tools is important, but it is not the only thing a great level\
    \ designer needs to know. The game level communicates with the player, telling\
    \ them about the story and the setting, but also about goals, options, and other\
    \ game information. I once heard a great presentation by a designer who had worked\
    \ for many years building levels in the game industry. He mentioned that a player\
    \ should be able to navigate a level with the game HUD turned off, relying only\
    \ on the clues they find in the design of the level. For the player to be able\
    \ to do this, the level must be built cleanly and efficiently, using clear sight\
    \ lines and vistas to direct the player to the end goal. Since hearing this, I\
    \ have attempted to bring these ideas into every level I create.\n\nLet's talk\
    \ about some of these points:\n\n![Level design principles](OEBPS/Images/BO5189_05_05.jpg)\n\
    \nA bird's eye view of our space station level\n\nBuilding levels that are clean\
    \ and efficient sounds great, but what does that really mean? A clean level is\
    \ free of distraction and extra areas that serve no real purpose to the story,\
    \ environment, or level goals. Players can find these areas confusing and spend\
    \ time searching for their importance when really there isn't any. When designing\
    \ and building our levels, always ask yourself if each section of the level adds\
    \ something to the player experience or if it is just a distraction there to add\
    \ complexity to a level. Efficiency is important as well. Game design has many\
    \ constraints: hardware constraints such as memory and processing speed, budget\
    \ constraints, time constraints, and production constraints. It is important as\
    \ the designer to maximize how you use your resources to create the most engaging\
    \ player experience possible. For small game developers like ourselves, this can\
    \ mean spending our time efficiently and finding ways to cut corners without sacrificing\
    \ quality:\n\n![Level design principles](OEBPS/Images/BO5189_05_06.jpg)\n\nOverlooking\
    \ the marketplace. What could we add outside those windows?\n\nWhen building a\
    \ level, it is also important to take into account what the player is seeing while\
    \ navigating each section. The player's sight lines present them with options\
    \ for navigating the spaces we design and we can use them to steer players through\
    \ the paths that we intend. This will ensure that the player experiences everything\
    \ in the way that we designed it. In our space station design, we restricted the\
    \ paths the player can see as they progress through the level. When they enter\
    \ the station, they are only aware of one path into the security checkpoint where\
    \ they experience our scripted event. They are then provided with a sight line\
    \ that leads them to a beautiful vista of the outside environment and the station's\
    \ marketplace.\n\nHere, they are free to do a bit of exploring of all they have\
    \ seen:\n\n![Level design principles](OEBPS/Images/BO5189_05_07.jpg)\n\nExploring\
    \ the marketplace. A great space for players!\n\nOur player is also shown the\
    \ ultimate goal of the level, the smoldering remains of the broker's shop, ready\
    \ to be explored at their leisure. To sum things up, sight lines are a powerful\
    \ tool that can control a player's progress, present them with options, and empower\
    \ them to reach the level's goal.\n\nNow one more reminder: as you whitebox the\
    \ level, remember to have family, friends, and your intended audience playtest\
    \ it for you. Their insight is valuable and can increase the chances of your game\
    \ being successful!\n\n# Advanced scripting techniques\n\nWith the level whitebox\
    \ nearly complete, it's time to start thinking about those scripted events. Scripting\
    \ level events can add immensely to any level and can be as simple as triggered\
    \ sounds or particle effects, or as complicated as fully scripted cutscenes or\
    \ minigames. Unreal 4 gives us the ability to visually program these sequences\
    \ using the flexible Blueprint system. We've used Blueprint before for simple\
    \ doors and elevators back in [Chapter 2](#ch02.xhtml \"Chapter 2. Starting Our\
    \ First Project\"), *Starting Our First Project*. Now we will build on that knowledge\
    \ to design and program flexible scripted events.\n\nSo how do we start? Designing\
    \ a scripted event is not unlike our animations systems we have built before.\
    \ Each one starts with an event that causes several different actions to fire\
    \ in a sequence. The trick is to be able to logic out the sequence so that we\
    \ get the desired effect with the player. For example, the average game explosion\
    \ has a few different actions:\n\n1.  Wait for the target object to take damage.\n\
    \n2.  Once damage reaches a certain amount, create a radius of damage and fire\
    \ the smoke, spark, fire, and explosion particle emitters.\n\n3.  Play explosion\
    \ sound!\n\n4.  Use the flying particles as cover to delete the original object.\n\
    \n5.  Spawn a damaged version of the original asset in its place.\n\nJust like\
    \ the explosion described here, any event can be broken down into specific events\
    \ and simulated. So let's think about what our security checkpoint event needs.\
    \ We need the player to feel threatened and to convey a sense of panic. I think\
    \ we can do this by trying a few different things that together will have the\
    \ desired effect. Here are some ideas in no particular order:\n\n*   Flash the\
    \ lights\n\n*   Fill the room with smoke\n\n*   Sparks!\n\n*   Some kind of loud\
    \ noise\n\n*   Slam the doors shut\n\n*   Slam the windows shut\n\n*   Fire! \n\
    \n    ### Tip"
