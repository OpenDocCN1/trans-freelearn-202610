- raw: "4.  Finally, complete the process by selecting edges in a vertical line that\
    \ runs down from the top marked edge loop to the bottom loop. Mark this as a seam\
    \ as well, just like we would to unwrap a cylinder.\n\n5.  Time to **Unwrap**!\
    \ Set your **Screen Layout** to **UV Editing**. Now turn off **Face select** mode\
    \ and press *A* to select all your faces. Finally, press *U* and select **Unwrap**\
    \ from the menu. Check out the results and see if they are similar to the UV map\
    \ shown previously.\n\nAnd we're done with the bottom! Not too hard is it? We\
    \ will find that many of the pieces of the Artifact unwrap very similarly to cubes\
    \ and cylinders. This gives us an easy starting point for each piece, taking the\
    \ guesswork out of getting started:\n\n![Unwrapping Cylinders](OEBPS/Images/B05189_07_12.jpg)\n\
    \nThe results of unwrapping the top\n\nThe top should be just like the bottom\
    \ piece:\n\n![Unwrapping Cylinders](OEBPS/Images/B05189_07_13.jpg)\n\nThe seams\
    \ are marked just like the bottom portion and it's similar to unwrapping a cylinder\
    \ primitive\n\nLet's dive right in:\n\n1.  Grab the edge loop around the top polygon\
    \ and mark that as a seam for the **Unwrap** tool.\n\n2.  Select one of the bottom\
    \ edge loops around where the top and the bottom pieces meet and mark this as\
    \ a seam as well.\n\n3.  Create a vertical seam to connect the other two seams,\
    \ similar to what we did for the bottom piece.\n\n4.  Finally, select all of the\
    \ faces and use the **Unwrap** tool again. The result should be very similar to\
    \ what we have for the bottom.\n\nNow that we have the top and the bottom pieces\
    \ unwrapped, let's switch gears and take a look at the gear (switch gears, get\
    \ it?):\n\n![Unwrapping Cylinders](OEBPS/Images/B05189_07_14.jpg)\n\nWe will use\
    \ Smart UV Project to unwrap the gear section\n\nFor this piece, we are going\
    \ to use **Smart UV Project**.\n\n1.  In **Object** mode, select the gear and\
    \ head into **Edit** mode. Make sure your selection mode is set to **Face** select\
    \ and then press *A* to select all of our faces.\n\n2.  Press *U* to open the\
    \ **Unwrap** menu and select **Smart UV Project**. Your results should look similar\
    \ to the preceding screenshot.\n\nThis leaves us only two sets of objects left,\
    \ the pistons and the tentacles. The processes for both will be similar. We will\
    \ delete all but one and UV map it. When we copy the mapped section again to replace\
    \ the deleted pieces, they will keep all of our UV mapping. Now that's working\
    \ smart!\n\n![Unwrapping Cylinders](OEBPS/Images/B05189_07_15.jpg)\n\nUnwrapping\
    \ the bottom portion of the piston\n\nNow to take a look at the Piston:\n\n1.\
    \  Choose which set of piston parts you wish to unwrap and delete all the others.\
    \ We will be replacing them shortly: ![Unwrapping Cylinders](OEBPS/Images/B05189_07_16.jpg)\n\
    \n    Unwraps just like a cylinder!\n\n2.  Start with the bottom piece of the\
    \ piston. The UV map for this will be similar to a cylinder. Starting at the top,\
    \ select the top edge loop where the sides and the top meet and mark that as a\
    \ seam.\n\n3.  Next, select the edge loop right before the bottom starts to curve\
    \ away from the side, and mark that a seam.\n\n4.  Finally, open the **Unwrap**\
    \ menu and select **Unwrap**!\n\n5.  Now, delete the top part of the piston and\
    \ copy the bottom, since the top is just a duplicate of the bottom.\n\n6.  This\
    \ next part covers a few steps. For each of the smaller middle sections, they\
    \ are simply cylinders and unwrap using the method we spoke of earlier in the\
    \ chapter. Unwrap all three cylinder sections: ![Unwrapping Cylinders](OEBPS/Images/B05189_07_17.jpg)\n\
    \n    Duplicating the piston parts, just like we did before\n\n7.  With all of\
    \ the parts unwrapped, select all of the piston parts in **Object** mode and duplicate\
    \ them to replace the pistons we deleted. Congratulations! We have now unwrapped\
    \ seven pistons!\n\n    Lastly, let's take a look at what it will take to unwrap\
    \ the tentacle:\n\n    ![Unwrapping Cylinders](OEBPS/Images/B05189_07_18.jpg)\n\
    \n    The unwrap for the tentacle. Don't be scared!\n\nAlthough it may look complicated,\
    \ it is not much different than a cylinder. However, there is a bit of prep we\
    \ have to do before we unwrap it:\n\n1.  Select one tentacle piece and delete\
    \ the others. We will unwrap one and copy it: ![Unwrapping Cylinders](OEBPS/Images/B05189_07_19.jpg)\n\
    \n    Delete every tentacle except for one\n\n2.  We are going to use the **Decimate**\
    \ modifier to reduce the triangle count on our tentacles. Select the **Modifier**\
    \ menu (the small wrench) over in the Properties pane. Click on the **Add Modifier**\
    \ dropdown and choose **Decimate** from the options. In the Decimate modifier\
    \ itself, turn on the **Triangulate** option. UE4 will triangulate it anyway,\
    \ so why not have **Decimate** get a head start. The goal of using **Decimate**\
    \ is to find a ratio that lowers the number of tris that are part of an object,\
    \ while still maintaining its overall shape. Now, click and slide on the **Ratio**\
    \ option. We are going to **Decimate** our tentacle by lowering the ratio to somewhere\
    \ between `.70` and `.80`. This will remove about 20-30% of the triangles and\
    \ make the entire tentacle more manageable for UE4. Once you have found a Ratio\
    \ that looks good, click on **Apply**: ![Unwrapping Cylinders](OEBPS/Images/B05189_07_20.jpg)\n\
    \n    Marking the seams on the tentacle. Again, it is very similar to a cylinder.\n\
    \n3.  Surprisingly, unwrapping our tentacle is not unlike unwrapping a cylinder,\
    \ and we will treat it roughly the same way. First, turn off the modifiers we\
    \ placed on the tentacle by clicking on the eye icon on each of the modifiers\
    \ in the **Modifier** menu. Then, select the edge loops around the top and bottom\
    \ polygons and make them seams. Finally, create a vertical seam to connect these\
    \ two seams, press *U* to bring up the **Unwrap** menu, and select **Unwrap**.\n\
    \nEach of our pieces is now unwrapped and ready to go! Back in [Chapter 3](#ch03.xhtml\
    \ \"Chapter 3. It's Time to Customize!\"), *It's Time to Customize!* we exported\
    \ our shape out of Blender as a `.FBX` file and then brought it into Unreal. This\
    \ time, we are going to take a look at the different types of texture map that\
    \ go into making a top notch material and create something spectacular using Allegorithmic's\
    \ Substance Painter.\n\n# Using different maps to create a more realistic look\n\
    \nMaterials in Unreal Engine 4 are made of several different textures working\
    \ together to provide a realistic result. Generally, a material for a game asset\
    \ has at least two to three different texture maps that are being manipulated\
    \ by different mathematical nodes. These maps are usually a **Diffuse map**, a\
    \  **Specular map**, and a **Normal map**:\n\n![Using different maps to create\
    \ a more realistic look](OEBPS/Images/B05189_07_21.jpg)\n\nThe coloring of the\
    \ Artifact is determined by the Diffuse map\n\nDiffuse maps are the basic colors\
    \ that we have painted on our objects. Unreal accepts these textures in the **Material\
    \ Editor** as the object's **Base Color**. These maps generally contain color\
    \ and pattern information that is painted directly onto a copy of the object's\
    \ UVs in programs such as Photoshop. Simply put, this type of map contains the\
    \ surface colors of our object.\n\nNext is the Specular map:\n\n![Using different\
    \ maps to create a more realistic look](OEBPS/Images/B05189_07_22.jpg)\n\nThe\
    \ Specular map controls how light behaves when it hits a surface\n\nSpecular maps\
    \ control how shiny or dull a surface appears to be and can be hand painted or\
    \ exported out of different programs, such as Autodesk Mudbox. These maps are\
    \ a great way to make parts of an object appear as if they have been shined or\
    \ cleaned. When looking at a specular map, the lighter areas of the map are where\
    \ players will see a shiny surface, whereas the darker areas of the map will appear\
    \ dulled.\n\nFinally, there is the normal map:\n\n![Using different maps to create\
    \ a more realistic look](OEBPS/Images/B05189_07_23.jpg)\n\nThe normal map can\
    \ help fake some details without adding to our tri count"
  fmt: "\n## Unwrapping the Artifact Pieces\n\n### Bottom Piece\n\n4. Finally, complete\
    \ the process by selecting edges in a vertical line that runs down from the top\
    \ marked edge loop to the bottom loop. Mark this as a seam as well, just like\
    \ we would to unwrap a cylinder.\n\n5. Time to `Unwrap`! Set your `Screen Layout`\
    \ to `UV Editing`. Now turn off `Face select` mode and press `A` to select all\
    \ your faces. Finally, press `U` and select `Unwrap` from the menu. Check out\
    \ the results and see if they are similar to the UV map shown previously.\n\n\
    And we're done with the bottom! Not too hard is it? We will find that many of\
    \ the pieces of the Artifact unwrap very similarly to cubes and cylinders. This\
    \ gives us an easy starting point for each piece, taking the guesswork out of\
    \ getting started:\n\n![Unwrapping Cylinders](OEBPS/Images/B05189_07_12.jpg)\n\
    \n### Top Piece\n\nThe results of unwrapping the top\n\nThe top should be just\
    \ like the bottom piece:\n\n![Unwrapping Cylinders](OEBPS/Images/B05189_07_13.jpg)\n\
    \nThe seams are marked just like the bottom portion and it's similar to unwrapping\
    \ a cylinder primitive\n\nLet's dive right in:\n\n1. Grab the edge loop around\
    \ the top polygon and mark that as a seam for the `Unwrap` tool.\n\n2. Select\
    \ one of the bottom edge loops around where the top and the bottom pieces meet\
    \ and mark this as a seam as well.\n\n3. Create a vertical seam to connect the\
    \ other two seams, similar to what we did for the bottom piece.\n\n4. Finally,\
    \ select all of the faces and use the `Unwrap` tool again. The result should be\
    \ very similar to what we have for the bottom.\n\n### Gear\n\nNow that we have\
    \ the top and the bottom pieces unwrapped, let's switch gears and take a look\
    \ at the gear (switch gears, get it?):\n\n![Unwrapping Cylinders](OEBPS/Images/B05189_07_14.jpg)\n\
    \nWe will use `Smart UV Project` to unwrap the gear section\n\nFor this piece,\
    \ we are going to use `Smart UV Project`.\n\n1. In `Object` mode, select the gear\
    \ and head into `Edit` mode. Make sure your selection mode is set to `Face` select\
    \ and then press `A` to select all of our faces.\n\n2. Press `U` to open the `Unwrap`\
    \ menu and select `Smart UV Project`. Your results should look similar to the\
    \ preceding screenshot.\n\n### Pistons\n\nThis leaves us only two sets of objects\
    \ left, the pistons and the tentacles. The processes for both will be similar.\
    \ We will delete all but one and UV map it. When we copy the mapped section again\
    \ to replace the deleted pieces, they will keep all of our UV mapping. Now that's\
    \ working smart!\n\n![Unwrapping Cylinders](OEBPS/Images/B05189_07_15.jpg)\n\n\
    Unwrapping the bottom portion of the piston\n\nNow to take a look at the Piston:\n\
    \n1. Choose which set of piston parts you wish to unwrap and delete all the others.\
    \ We will be replacing them shortly: ![Unwrapping Cylinders](OEBPS/Images/B05189_07_16.jpg)\n\
    \n    Unwraps just like a cylinder!\n\n2. Start with the bottom piece of the piston.\
    \ The UV map for this will be similar to a cylinder. Starting at the top, select\
    \ the top edge loop where the sides and the top meet and mark that as a seam.\n\
    \n3. Next, select the edge loop right before the bottom starts to curve away from\
    \ the side, and mark that a seam.\n\n4. Finally, open the `Unwrap` menu and select\
    \ `Unwrap`!\n\n5. Now, delete the top part of the piston and copy the bottom,\
    \ since the top is just a duplicate of the bottom.\n\n6. This next part covers\
    \ a few steps. For each of the smaller middle sections, they are simply cylinders\
    \ and unwrap using the method we spoke of earlier in the chapter. Unwrap all three\
    \ cylinder sections: ![Unwrapping Cylinders](OEBPS/Images/B05189_07_17.jpg)\n\n\
    \    Duplicating the piston parts, just like we did before\n\n7. With all of the\
    \ parts unwrapped, select all of the piston parts in `Object` mode and duplicate\
    \ them to replace the pistons we deleted. Congratulations! We have now unwrapped\
    \ seven pistons!\n\n### Tentacle\n\nLastly, let's take a look at what it will\
    \ take to unwrap the tentacle:\n\n![Unwrapping Cylinders](OEBPS/Images/B05189_07_18.jpg)\n\
    \nThe unwrap for the tentacle. Don't be scared!\n\nAlthough it may look complicated,\
    \ it is not much different than a cylinder. However, there is a bit of prep we\
    \ have to do before we unwrap it:\n\n1. Select one tentacle piece and delete the\
    \ others. We will unwrap one and copy it: ![Unwrapping Cylinders](OEBPS/Images/B05189_07_19.jpg)\n\
    \n    Delete every tentacle except for one\n\n2. We are going to use the `Decimate`\
    \ modifier to reduce the triangle count on our tentacles. Select the `Modifier`\
    \ menu (the small wrench) over in the Properties pane. Click on the `Add Modifier`\
    \ dropdown and choose `Decimate` from the options. In the `Decimate` modifier\
    \ itself, turn on the `Triangulate` option. UE4 will triangulate it anyway, so\
    \ why not have `Decimate` get a head start. The goal of using `Decimate` is to\
    \ find a ratio that lowers the number of tris that are part of an object, while\
    \ still maintaining its overall shape. Now, click and slide on the `Ratio` option.\
    \ We are going to `Decimate` our tentacle by lowering the ratio to somewhere between\
    \ `.70` and `.80`. This will remove about 20-30% of the triangles and make the\
    \ entire tentacle more manageable for UE4. Once you have found a Ratio that looks\
    \ good, click on `Apply`: ![Unwrapping Cylinders](OEBPS/Images/B05189_07_20.jpg)\n\
    \n    Marking the seams on the tentacle. Again, it is very similar to a cylinder.\n\
    \n3. Surprisingly, unwrapping our tentacle is not unlike unwrapping a cylinder,\
    \ and we will treat it roughly the same way. First, turn off the modifiers we\
    \ placed on the tentacle by clicking on the eye icon on each of the modifiers\
    \ in the `Modifier` menu. Then, select the edge loops around the top and bottom\
    \ polygons and make them seams. Finally, create a vertical seam to connect these\
    \ two seams, press `U` to bring up the `Unwrap` menu, and select `Unwrap`.\n\n\
    Each of our pieces is now unwrapped and ready to go! Back in [Chapter 3](#ch03.xhtml\
    \ \"Chapter 3. It's Time to Customize!\"), *It's Time to Customize!* we exported\
    \ our shape out of Blender as a `.FBX` file and then brought it into Unreal. This\
    \ time, we are going to take a look at the different types of texture map that\
    \ go into making a top notch material and create something spectacular using Allegorithmic's\
    \ Substance Painter.\n\n# Using different maps to create a more realistic look\n\
    \nMaterials in Unreal Engine 4 are made of several different textures working\
    \ together to provide a realistic result. Generally, a material for a game asset\
    \ has at least two to three different texture maps that are being manipulated\
    \ by different mathematical nodes. These maps are usually a `Diffuse map`, a `Specular\
    \ map`, and a `Normal map`:\n\n![Using different maps to create a more realistic\
    \ look](OEBPS/Images/B05189_07_21.jpg)\n\nThe coloring of the Artifact is determined\
    \ by the Diffuse map\n\n### Diffuse Map\n\nDiffuse maps are the basic colors that\
    \ we have painted on our objects. Unreal accepts these textures in the `Material\
    \ Editor` as the object's `Base Color`. These maps generally contain color and\
    \ pattern information that is painted directly onto a copy of the object's UVs\
    \ in programs such as Photoshop. Simply put, this type of map contains the surface\
    \ colors of our object.\n\n### Specular Map\n\nNext is the Specular map:\n\n![Using\
    \ different maps to create a more realistic look](OEBPS/Images/B05189_07_22.jpg)\n\
    \nThe Specular map controls how light behaves when it hits a surface\n\nSpecular\
    \ maps control how shiny or dull a surface appears to be and can be hand painted\
    \ or exported out of different programs, such as Autodesk Mudbox. These maps are\
    \ a great way to make parts of an object appear as if they have been shined or\
    \ cleaned. When looking at a specular map, the lighter areas of the map are where\
    \ players will see a shiny surface, whereas the darker areas of the map will appear\
    \ dulled.\n\n### Normal Map\n\nFinally, there is the normal map:\n\n![Using different\
    \ maps to create a more realistic look](OEBPS/Images/B05189_07_23.jpg)\n\nThe\
    \ normal map can help fake some details without adding to our tri count\n"
  trans: "\n\n## 解包神器零件\n\n### 底部零件\n\n4. 最后，通过选择一条垂直线上的边来完成该过程，该垂直线从顶部标记的边环向下延伸到底部边环。将其也标记为缝合线，就像我们展开圆柱体时所做的那样。\n\
    \n5. 该进行 `Unwrap`（展开）操作了！将你的 `Screen Layout`（屏幕布局）设置为 `UV Editing`（UV 编辑）。现在关闭\
    \ `Face select`（面选择）模式并按 `A` 选择所有面。最后，按 `U` 并从菜单中选择 `Unwrap`。查看结果，看看它们是否与之前显示的\
    \ UV 贴图相似。\n\n底部完成了！不难吧？我们会发现神器的许多零件展开的方式与立方体和圆柱体非常相似。这为每个零件提供了一个简单的起点，省去了摸索如何开始的麻烦：\n\
    \n![展开圆柱体](img/B05189_07_12.jpg)\n\n### 顶部零件\n\n顶部展开的结果\n\n顶部应该就像底部零件一样：\n\n![展开圆柱体](img/B05189_07_13.jpg)\n\
    \n缝合线的标记方式就像底部部分一样，这类似于展开一个圆柱体基元\n\n让我们直接开始吧：\n\n1. 抓取顶部多边形周围的边环，并将其标记为 `Unwrap`\
    \ 工具的缝合线。\n\n2. 选择顶部和底部零件相接处周围的一个底部边环，并将其也标记为缝合线。\n\n3. 创建一条垂直缝合线来连接另外两条缝合线，类似于我们为底部零件所做的操作。\n\
    \n4. 最后，选择所有面并再次使用 `Unwrap` 工具。结果应该与底部的非常相似。\n\n### 齿轮\n\n现在我们已经展开了顶部和底部零件，让我们换个思路来看看齿轮（switch\
    \ gears，双关语，意为“换挡/换思路”）：\n\n![展开圆柱体](img/B05189_07_14.jpg)\n\n我们将使用 `Smart UV\
    \ Project` 来展开齿轮部分\n\n对于这个零件，我们将使用 `Smart UV Project`（智能 UV 投影）。\n\n1. 在 `Object`（物体）模式下，选择齿轮并进入\
    \ `Edit`（编辑）模式。确保你的选择模式设置为 `Face`（面）选择，然后按 `A` 选择所有面。\n\n2. 按 `U` 打开 `Unwrap`\
    \ 菜单并选择 `Smart UV Project`。你的结果应该看起来类似于前面的截图。\n\n### 活塞\n\n这只剩下最后两组物体了，活塞和触手。两者的过程将是相似的。我们将删除除一个以外的所有物体并为其制作\
    \ UV 贴图。当我们再次复制已映射的部分来替换被删除的零件时，它们将保留我们所有的 UV 映射。这才是聪明的工作方式！\n\n![展开圆柱体](img/B05189_07_15.jpg)\n\
    \n展开活塞的底部部分\n\n现在来看看活塞：\n\n1. 选择你想要展开的那组活塞零件，并删除所有其他的。我们稍后会替换它们：![展开圆柱体](img/B05189_07_16.jpg)\n\
    \n    展开方式就像圆柱体一样！\n\n2. 从活塞的底部零件开始。它的 UV 贴图将类似于圆柱体。从顶部开始，选择侧面和顶部相接处的顶部边环，并将其标记为缝合线。\n\
    \n3. 接下来，选择底部开始向外弯曲离开侧面之前的那个边环，并将其标记为缝合线。\n\n4. 最后，打开 `Unwrap` 菜单并选择 `Unwrap`！\n\
    \n5. 现在，删除活塞的顶部并复制底部，因为顶部只是底部的副本。\n\n6. 这一部分涵盖几个步骤。对于每个较小的中间部分，它们只是简单的圆柱体，并使用我们在本章前面提到的方法进行展开。展开所有三个圆柱体部分：![展开圆柱体](img/B05189_07_17.jpg)\n\
    \n    复制活塞零件，就像我们之前做的那样\n\n7. 所有零件展开后，在 `Object` 模式下选择所有活塞零件并复制它们，以替换我们删除的活塞。恭喜！我们现在已经展开了七个活塞！\n\
    \n### 触手\n\n最后，让我们看看展开触手需要什么：\n\n![展开圆柱体](img/B05189_07_18.jpg)\n\n触手的展开。别害怕！\n\
    \n虽然它看起来可能很复杂，但它与圆柱体并没有太大区别。不过，在展开之前我们需要做一些准备工作：\n\n1. 选择一个触手零件并删除其他的。我们将展开一个并复制它：![展开圆柱体](img/B05189_07_19.jpg)\n\
    \n    删除除一个以外的所有触手\n\n2. 我们将使用 `Decimate`（抽稀）修改器来减少触手上的三角形数量。在属性面板中选择 `Modifier`（修改器）菜单（小扳手图标）。点击\
    \ `Add Modifier`（添加修改器）下拉菜单并从选项中选择 `Decimate`。在 `Decimate` 修改器本身中，开启 `Triangulate`（三角化）选项。UE4\
    \ 反正会对其进行三角化，所以为什么不让 `Decimate` 先开始呢。使用 `Decimate` 的目标是找到一个比率，在保持物体整体形状的同时，降低构成物体的三角形数量。现在，点击并拖动\
    \ `Ratio`（比率）选项。我们将通过将比率降低到 `.70` 和 `.80` 之间来 `Decimate` 我们的触手。这将移除约 20-30% 的三角形，并使整个触手更易于\
    \ UE4 处理。一旦你找到了一个看起来不错的比率，点击 `Apply`（应用）：![展开圆柱体](img/B05189_07_20.jpg)\n\n  \
    \  在触手上标记缝合线。同样，它非常类似于圆柱体。\n\n3. 令人惊讶的是，展开我们的触手不像展开圆柱体那样不同，我们将以大致相同的方式对待它。首先，通过点击\
    \ `Modifier` 菜单中每个修改器上的眼睛图标，关闭我们放在触手上的修改器。然后，选择顶部和底部多边形周围的边环并将它们设为缝合线。最后，创建一条垂直缝合线来连接这两条缝合线，按\
    \ `U` 调出 `Unwrap` 菜单，并选择 `Unwrap`。\n\n我们的每个零件现在都已展开并准备就绪！回到 第 3 章，*是时候自定义了！* 我们将形状从\
    \ Blender 导出为 `.FBX` 文件，然后将其导入 Unreal。这一次，我们将了解制作一流材质所涉及的不同类型的纹理贴图，并使用 Allegorithmic\
    \ 的 Substance Painter 创造出一些壮观的效果。\n\n# 使用不同的贴图创建更逼真的外观\n\nUnreal Engine 4 中的材质由几种不同的纹理协同工作组成，以提供逼真的结果。通常，游戏资产的材质至少有两到三种不同的纹理贴图，它们通过不同的数学节点进行操作。这些贴图通常是\
    \ `Diffuse map`（漫反射贴图/基础色贴图）、`Specular map`（高光贴图）和 `Normal map`（法线贴图）：\n\n![使用不同的贴图创建更逼真的外观](img/B05189_07_21.jpg)\n\
    \n神器的着色由漫反射贴图决定\n\n### 漫反射贴图\n\n漫反射贴图是我们绘制在物体上的基本颜色。Unreal 在 `Material Editor`（材质编辑器）中将这些纹理作为物体的\
    \ `Base Color`（基础颜色）接受。这些贴图通常包含直接绘制在物体 UV 副本上的颜色和图案信息，例如在 Photoshop 等程序中。简单来说，这种贴图包含了物体的表面颜色。\n\
    \n### 高光贴图\n\n接下来是高光贴图：\n\n![使用不同的贴图创建更逼真的外观](img/B05189_07_22.jpg)\n\n高光贴图控制光线照射到表面时的行为\n\
    \n高光贴图控制表面看起来有多亮或多暗淡，可以手绘或从不同的程序（如 Autodesk Mudbox）导出。这些贴图是让物体的某些部分看起来像被打磨或清洁过的绝佳方式。查看高光贴图时，贴图中较亮的区域是玩家将看到亮面的地方，而较暗的区域将显得暗淡。\n\
    \n### 法线贴图\n\n最后是法线贴图：\n\n![使用不同的贴图创建更逼真的外观](img/B05189_07_23.jpg)\n\n法线贴图可以在不增加三角形数量的情况下伪造一些细节\n\
    \n"
