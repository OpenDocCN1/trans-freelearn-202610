- raw: "6.  Now we need to cut the line to create the seam where the top fits on to\
    \ the crate. Click the **Loop Cut and Slide** tool from the menu on the left or\
    \ press *Ctrl+R*. Move the mouse over the crate until you have one purple line\
    \ cutting horizontally across the lower section. Click *LMB*, this will turn the\
    \ line orange and allow you to slide it up and down along the crate. Click again\
    \ when it is in the location we want.\n\n7.  Split this new line with the **Bevel**\
    \ tool. Press *W* and select **Bevel**. I split mine by `0.05`: ![Using the basic\
    \ tools of polygon modeling](OEBPS/Images/BO5189_03_11.jpg)\n\n    Creating our\
    \ lid seam using the Scale tool\n\n8.  One more step for the lid: select the four\
    \ polygons around the outside of the lid (hold the *Shift* key to select multiple\
    \ polygons) and scale them down a little by pressing *S* to use the **Scale**\
    \ tool.\n\n9.  Next we will add the detailing along the sides. Along the *Y* axis\
    \ (the green axis), we are going to use the **Loop Cut and Slide** tool and cut\
    \ four lines vertically around our object.\n\n10.  Move the mouse to get the purple\
    \ guidelines going vertically along our crate and then use the mouse wheel until\
    \ we have four lines. Click the mouse to cut the lines and then click it again\
    \ without moving the mouse to keep them centered: ![Using the basic tools of polygon\
    \ modeling](OEBPS/Images/BO5189_03_12.jpg)\n\n     Extruding polygons to add some\
    \ raised areas to the crate along the sides\n\n11.  Now we are going to select\
    \ a few of our new polygons to create the bands along the sides of our box. **Extrude**\
    \ those using the **Extrude Individual** tool and pull them out to a good size.\
    \ Also **Extrude** the runners for the bottom of the box by pulling out the two\
    \ outside polygons and the middle polygon: ![Using the basic tools of polygon\
    \ modeling](OEBPS/Images/BO5189_03_13.jpg)\n\n     Creating the latch\n\n12. \
    \ Let's add the latch. Add a horizontal edge loop around our crate using **Loop\
    \ Cut and Slide**. Then add two vertical edge loops to the front of the crate:\
    \ ![Using the basic tools of polygon modeling](OEBPS/Images/BO5189_03_14.jpg)\n\
    \n     Finishing the latch\n\n13.  Finishing the latch is a two-step **Extrude**\
    \ process. Select the three polygons shown and **Extrude** them out. Then select\
    \ the two on the top of the latch and **Extrude** those: ![Using the basic tools\
    \ of polygon modeling](OEBPS/Images/BO5189_03_15.jpg)\n\n     Using the Mirror\
    \ modifier to create symmetry\n\n14.  Now to make sure everything is even, we\
    \ will use a **Mirror** modifier. Cut our object in half by using **Loop Cut and\
    \ Slide** to cut a vertical line from front to back. Next, press *B* to do a window\
    \ selection and select half of the crate. Press the *Delete* key and select **Faces**\
    \ to delete half of the crate.\n\n15.  Lastly, add the **Mirror** modifier by\
    \ clicking the wrench icon in the **Properties** pane to open up the **Modifier**\
    \ menu. Click the **Add Modifier** dropdown and select **Mirror**. Manipulate\
    \ the settings until you have successfully made our object whole again. Once everything\
    \ is set, go back to **Object** mode and click **Apply** in the **Modifier** menu.\
    \ Modifiers cannot be added in **Edit** mode. Finished! Not bad for our first\
    \ prop. It looks like it could fit just about anything, from food to horribly\
    \ mutated genetic monsters that hunt you in the dark.\n\n# How to use UV mapping\
    \ and why it's important\n\nAt this point, we have the geometry, or basic shape\
    \ of our crate down, but it still doesn't really look like the objects we see\
    \ in other games. The reason is textures. Texturing our object will create all\
    \ those little details that will make our game asset worthy of the level we have\
    \ built. Making our textures and getting them on the object is a two-step process.\
    \ First, we need to tell our textures how to behave and that takes a UV map:\n\
    \n![How to use UV mapping and why it's important](OEBPS/Images/BO5189_03_16.jpg)\n\
    \nLearning unwrapping with a basic cube\n\nA UV map is a set of coordinates that\
    \ tell texture maps we have placed on a game asset how to wrap themselves around\
    \ our object. The principle is to take your 3D object and flatten it, so that\
    \ we can apply an image to the outside in a manner that doesn't tear or stretch\
    \ the texture. This allows us to create detailed texture maps that apply things\
    \ like scraped edges, rust spots, paint colors, visual screens, and more. Without\
    \ it, Unreal will not know how to texture our object in game. It will also not\
    \ be able to apply lighting correctly, since Unreal uses UV maps to apply light\
    \ and shadow:\n\n![How to use UV mapping and why it's important](OEBPS/Images/BO5189_03_17.jpg)\n\
    \nThe UV mapping menu\n\nSo how do we do this in Blender? The application gives\
    \ us several options for adding a UV map, some of which are more useful for what\
    \ we have created than others:\n\n*   **Smart UV Project**: Useful for architectural\
    \ and mechanical objects, Smart UV Project creates a custom UV layout based on\
    \ angular changes to your geometry. It does its best to lay everything out in\
    \ a logical fashion and can minimize stretching. The tool tries to lay things\
    \ logically but may need a bit of tweaking.\n\n*   **Cube Projection**: Cube mapping\
    \ breaks your object into six faces and projects them on to planes. This creates\
    \ six separate UV islands that can be manipulated.\n\n*   **Project From View**:\
    \ Creates a UV map based on what is selected and the angle of the 3D view. For\
    \ example, you can select all of the polygons on the left-hand side of the object\
    \ and select the **Left Side** view for the viewport and use this option.\n\n\
    *   **Lightmap Pack**: Unreal and other game engines use a lightmap to bake shadows\
    \ on to objects during building. Lightmap Pack can create a UV layout that is\
    \ more suited to lightmaps by using as much UV space as possible. This maximizes\
    \ the amount of lighting information the object can take and will improve the\
    \ results.\n\n# UV unwrapping our game asset\n\nUV mapping can be a difficult\
    \ process, but understanding some best practices can help make the process easier:\n\
    \n![UV unwrapping our game asset](OEBPS/Images/BO5189_03_18.jpg)\n\nA UV grid\
    \ texture map\n\n1.  Use a colored UV grid texture during the process: This can\
    \ be easily found using an online image search, and can be applied to your object\
    \ in Blender as a material. Be sure to find one the same size as the texture you\
    \ wish to create, such as 1024 x 1024 or 2048 x 2048. I used a 2048 x 2048 image.\n\
    \n2.  Minimize seams and stretching: It is important to hide the seams of your\
    \ UV map along hard edges or in hidden areas not seen by the player. Luckily for\
    \ us, hard surface objects such as our crate are easier to unwrap than objects\
    \ with more organic curves such as cars, plants, or animals.\n\n3.  Be consistent\
    \ with the orientation of your UV elements: When laying out your UV map, keeping\
    \ everything oriented in the same direction will make laying out and creating\
    \ your texture map that much easier. This is even more important if the texture\
    \ artist is another member on the team.\n\n4.  Be careful not to waste space:\
    \ Less wasted space in your texture map translates directly to increased pixel\
    \ density in your texture and better quality overall.\n\n5.  Remember that all\
    \ these things take practice to master.\n\nNow let's UV unwrap our crate:\n\n\
    ![UV unwrapping our game asset](OEBPS/Images/BO5189_03_19.jpg)\n\nChanging the\
    \ viewports to the UV Editing preset using the Scene Layout dropdown\n\n1.  Select\
    \ our crate and enter **Edit** mode, if you are not already there. Also make sure\
    \ you are in polygon selection mode. Press *A* twice to select all the polygons\
    \ of the crate.\n\n2.  In the Menu Bar, go to the **Scene Layout** dropdown and\
    \ select **UV Editing**. This will split the viewport into two halves. The left\
    \ side is your UV layout and will be blank for the time being. The right half\
    \ is your object. You can still move and rotate it so you can grab different polygons."
  fmt: '

    ## Crate Modeling Steps (6–15)


    ### Step 6: Cut the Line for the Seam

    Now we need to cut the line to create the seam where the top fits on to the crate.
    Click the `Loop Cut and Slide` tool from the menu on the left or press `Ctrl+R`.
    Move the mouse over the crate until you have one purple line cutting horizontally
    across the lower section. Click `LMB`; this will turn the line orange and allow
    you to slide it up and down along the crate. Click again when it is in the location
    we want.


    ### Step 7: Split with the Bevel Tool

    Split this new line with the `Bevel` tool. Press `W` and select `Bevel`. I split
    mine by `0.05`:


    ![Using the basic tools of polygon modeling](OEBPS/Images/BO5189_03_11.jpg)


    *Creating our lid seam using the Scale tool*


    ### Step 8: Scale the Lid Polygons

    One more step for the lid: select the four polygons around the outside of the
    lid (hold the `Shift` key to select multiple polygons) and scale them down a little
    by pressing `S` to use the `Scale` tool.


    ### Step 9: Add Vertical Loop Cuts

    Next we will add the detailing along the sides. Along the `Y` axis (the green
    axis), we are going to use the `Loop Cut and Slide` tool and cut four lines vertically
    around our object.


    ### Step 10: Create Four Vertical Lines

    Move the mouse to get the purple guidelines going vertically along our crate and
    then use the mouse wheel until we have four lines. Click the mouse to cut the
    lines and then click it again without moving the mouse to keep them centered:


    ![Using the basic tools of polygon modeling](OEBPS/Images/BO5189_03_12.jpg)


    *Extruding polygons to add some raised areas to the crate along the sides*


    ### Step 11: Extrude Side Bands and Bottom Runners

    Now we are going to select a few of our new polygons to create the bands along
    the sides of our box. `Extrude` those using the `Extrude Individual` tool and
    pull them out to a good size. Also `Extrude` the runners for the bottom of the
    box by pulling out the two outside polygons and the middle polygon:


    ![Using the basic tools of polygon modeling](OEBPS/Images/BO5189_03_13.jpg)


    *Creating the latch*


    ### Step 12: Add Latch Edge Loops

    Let''s add the latch. Add a horizontal edge loop around our crate using `Loop
    Cut and Slide`. Then add two vertical edge loops to the front of the crate:


    ![Using the basic tools of polygon modeling](OEBPS/Images/BO5189_03_14.jpg)


    *Finishing the latch*


    ### Step 13: Extrude the Latch

    Finishing the latch is a two-step `Extrude` process. Select the three polygons
    shown and `Extrude` them out. Then select the two on the top of the latch and
    `Extrude` those:


    ![Using the basic tools of polygon modeling](OEBPS/Images/BO5189_03_15.jpg)


    *Using the Mirror modifier to create symmetry*


    ### Step 14: Cut Object in Half for Mirroring

    Now to make sure everything is even, we will use a `Mirror` modifier. Cut our
    object in half by using `Loop Cut and Slide` to cut a vertical line from front
    to back. Next, press `B` to do a window selection and select half of the crate.
    Press the `Delete` key and select `Faces` to delete half of the crate.


    ### Step 15: Apply Mirror Modifier

    Lastly, add the `Mirror` modifier by clicking the wrench icon in the `Properties`
    pane to open up the `Modifier` menu. Click the `Add Modifier` dropdown and select
    `Mirror`. Manipulate the settings until you have successfully made our object
    whole again. Once everything is set, go back to `Object` mode and click `Apply`
    in the `Modifier` menu. Modifiers cannot be added in `Edit` mode. Finished! Not
    bad for our first prop. It looks like it could fit just about anything, from food
    to horribly mutated genetic monsters that hunt you in the dark.


    # How to Use UV Mapping and Why It''s Important


    At this point, we have the geometry, or basic shape of our crate down, but it
    still doesn''t really look like the objects we see in other games. The reason
    is textures. Texturing our object will create all those little details that will
    make our game asset worthy of the level we have built. Making our textures and
    getting them on the object is a two-step process. First, we need to tell our textures
    how to behave and that takes a UV map:


    ![How to use UV mapping and why it''s important](OEBPS/Images/BO5189_03_16.jpg)


    *Learning unwrapping with a basic cube*


    A UV map is a set of coordinates that tell texture maps we have placed on a game
    asset how to wrap themselves around our object. The principle is to take your
    3D object and flatten it, so that we can apply an image to the outside in a manner
    that doesn''t tear or stretch the texture. This allows us to create detailed texture
    maps that apply things like scraped edges, rust spots, paint colors, visual screens,
    and more. Without it, Unreal will not know how to texture our object in game.
    It will also not be able to apply lighting correctly, since Unreal uses UV maps
    to apply light and shadow:


    ![How to use UV mapping and why it''s important](OEBPS/Images/BO5189_03_17.jpg)


    *The UV mapping menu*


    So how do we do this in Blender? The application gives us several options for
    adding a UV map, some of which are more useful for what we have created than others:


    - **`Smart UV Project`**: Useful for architectural and mechanical objects, `Smart
    UV Project` creates a custom UV layout based on angular changes to your geometry.
    It does its best to lay everything out in a logical fashion and can minimize stretching.
    The tool tries to lay things logically but may need a bit of tweaking.

    - **`Cube Projection`**: Cube mapping breaks your object into six faces and projects
    them on to planes. This creates six separate UV islands that can be manipulated.

    - **`Project From View`**: Creates a UV map based on what is selected and the
    angle of the 3D view. For example, you can select all of the polygons on the left-hand
    side of the object and select the `Left Side` view for the viewport and use this
    option.

    - **`Lightmap Pack`**: Unreal and other game engines use a lightmap to bake shadows
    on to objects during building. `Lightmap Pack` can create a UV layout that is
    more suited to lightmaps by using as much UV space as possible. This maximizes
    the amount of lighting information the object can take and will improve the results.


    # UV Unwrapping Our Game Asset


    UV mapping can be a difficult process, but understanding some best practices can
    help make the process easier:


    ![UV unwrapping our game asset](OEBPS/Images/BO5189_03_18.jpg)


    *A UV grid texture map*


    1.  **Use a colored UV grid texture during the process**: This can be easily found
    using an online image search, and can be applied to your object in Blender as
    a material. Be sure to find one the same size as the texture you wish to create,
    such as `1024 x 1024` or `2048 x 2048`. I used a `2048 x 2048` image.

    2.  **Minimize seams and stretching**: It is important to hide the seams of your
    UV map along hard edges or in hidden areas not seen by the player. Luckily for
    us, hard surface objects such as our crate are easier to unwrap than objects with
    more organic curves such as cars, plants, or animals.

    3.  **Be consistent with the orientation of your UV elements**: When laying out
    your UV map, keeping everything oriented in the same direction will make laying
    out and creating your texture map that much easier. This is even more important
    if the texture artist is another member on the team.

    4.  **Be careful not to waste space**: Less wasted space in your texture map translates
    directly to increased pixel density in your texture and better quality overall.

    5.  **Remember that all these things take practice to master**.


    Now let''s UV unwrap our crate:


    ![UV unwrapping our game asset](OEBPS/Images/BO5189_03_19.jpg)


    *Changing the viewports to the UV Editing preset using the Scene Layout dropdown*


    1.  Select our crate and enter `Edit` mode, if you are not already there. Also
    make sure you are in polygon selection mode. Press `A` twice to select all the
    polygons of the crate.

    2.  In the Menu Bar, go to the `Scene Layout` dropdown and select `UV Editing`.
    This will split the viewport into two halves. The left side is your UV layout
    and will be blank for the time being. The right half is your object. You can still
    move and rotate it so you can grab different polygons.

