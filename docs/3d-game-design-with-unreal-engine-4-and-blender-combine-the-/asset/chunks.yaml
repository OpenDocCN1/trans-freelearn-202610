    \ \n\n    *   creating / [Creating a class blueprint to tie it all together](#ch09.xhtml\
    \ \"Creating a class blueprint to tie it all together\")\n\n    *   creating,\
    \ for artifact / [Creating a class blueprint to tie it all together](#ch09.xhtml\
    \ \"Creating a class blueprint to tie it all together\")\n\n*   complex objects\
    \ \n\n    *   unwrapping / [Unwrapping complex objects](#ch07.xhtml \"Unwrapping\
    \ complex objects\")\n\n    *   seams, creating / [Marking seams](#ch07.xhtml\
