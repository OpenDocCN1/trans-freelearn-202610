    \ will need, let's talk about creating keyframes!\n\n![Rigging and using keyframes](OEBPS/Images/B05189_08_03.jpg)\n\
    \nThe `Timeline` is used to add keyframes in a similar fashion to Timelines in\
    \ Unreal 4.\n\nSimilar to Unreal 4, the keyframes we create will be displayed\
    \ in the `Timeline`. This area is located directly under the `3D viewport`. Keyframes\
    \ are represented as simple yellow lines, and the amount of time we are viewing\
    \ can be adjusted by using the mouse wheel.\n\nNow let's start with a basic cube\
    \ and create some keyframes:\n\n![Rigging and using keyframes](OEBPS/Images/B05189_08_04.jpg)\n\
    \nA simple animation of a sliding box.\n\nTo make a simple animation where our\
    \ cube moves, we need to create two keyframes:\n\n1.  Create the first keyframe\
    \ by selecting the cube, pressing `I` to open the `Insert Keyframe Menu`, and\
    \ selecting `Location` at the top of the list.\n2.  Now slide the time slider\
    \ in the `Timeline` window to frame `30`. This can be done by right clicking on\
    \ the `Timeline` near 30 and then holding the button to slide it along the `Timeline`.\
    \ The box highlighted in the image shows the active frame.\n3.  Next, in the `3D\
    \ viewport`, slide your cube in any direction you like. Finally, press `I` and\
    \ select `Location` from the menu, just like we did for the first keyframe.\n\
    4.  Test your animation by clicking and holding the right mouse button on the\
    \ `Timeline` and sliding the active frame between `1` and `30`. We should see\
    \ the cube slide between our two recorded positions.\n\nCongratulations, we just\
    \ animated our cube! Now let's take a look at how to change or delete any keyframes\
    \ that might have been off a bit:\n\n![Rigging and using keyframes](OEBPS/Images/B05189_08_05.jpg)\n\
    \nIntroducing the `Dope Sheet`.\n\nSometimes when we are creating our keyframes,\
    \ we might put one down where we didn't mean to, or we might need to adjust the\
    \ timing of our animation to feel more natural. The `Dope Sheet` (highlighted\
    \ in the previous screenshot) allows us to move, copy, and delete our keyframes\
    \ with relatively simple controls.\n\nTo move keyframes, select the keyframes\
    \ you wish to move. Then click and drag the keyframes to their new time position.\
    \ Finally, click on the `LMB` again to finalize the new time position.\n\nHere\
    \ we can see the `Dope Sheet` in action:\n\n![Rigging and using keyframes](OEBPS/Images/B05189_08_06.jpg)\n\
    \nDuplicating keyframes is useful when an animation has to end in the exact place\
    \ it began.\n\nTo copy a keyframe, select the keyframe you wish to copy and press\
    \ `Ctrl + C`. Now right-click and drag the time slider to the new desired time.\
    \ Finally, press `Ctrl + V` to copy the keyframes. This is a great technique for\
    \ creating spinning or other cyclical animations where the object has to end exactly\
    \ where it began.\n\nTime to apply what we know to our Artifact.\n\nTo animate\
    \ our piece, we will need to break it down into a few different pieces. Basically,\
    \ if it moves, it has to be its own separate piece. Now you might be saying to\
    \ yourself, *Wait. Then why did we make it all one piece earlier?* For the purposes\
    \ of UV unwrapping, we had to have the Artifact as one piece. As we separate pieces\
    \ from the whole, they are still part of the UV map that we made. When we bring\
    \ the whole thing into Unreal, the material we create will still apply all those\
    \ great textures to every piece of the Artifact.\n\nLet's start by separating\
    \ the top section:\n\n![Rigging and using keyframes](OEBPS/Images/B05189_08_07.jpg)\n\
    \nSelect the top section and top piston section.\n\n1.  Select a face on the outside\
    \ of the lid and press `L`; this should select all the faces that make up the\
    \ outside of the lid.\n2.  Next, select a face on the inside of the lid while\
    \ holding the `Shift` key. This will add the face to our current selection set.\
    \ Press `L` to select all the faces on the inside of the lid.\n3.  Now select\
    \ the very top face.\n\n    Now we will add the pistons to the selection:\n\n\
    \    ![Rigging and using keyframes](OEBPS/Images/B05189_08_08.jpg)\n\n    A breakdown\
    \ of a piston. This will be needed to bind the right parts to the right bones.\n\
    \n4.  Finally, holding `Shift`, select a polygon on one of the piston's top sections\
    \ and press `L`. Each piston top is made up of three different sections: the top\
    \ portion, the middle portion, and the bottom inner portion. Make sure to `Shift`\
    \ select a face in each section and press `L` to select all the faces in that\
    \ section.\n5.  Press `P` to open up the `Separation` menu and select `Selection`.\
    \ This will separate off the faces we selected to become a new piece. Remember\
    \ to rename it in the `Scene Outliner` to something you will remember, such as\
    \ `Top`.\n\nNow we have our top section separated. Repeat the process for the\
    \ bottom and the gear. If you select a face, press `L`, and nothing happens, just\
    \ select the face next to it and try again. Also, pressing `Z` will turn on wireframe\
    \ mode. This will allow you to select faces through your object. Be sure to select\
    \ those faces by clicking on the little black dot located at the center of the\
    \ face.\n\nTime to tackle those middle piston parts! Our plan of attack will have\
    \ us separate them into three layers, since we will be moving all of them together\
    \ for the animation. The bottom set of bits will be one layer, the middle set\
    \ will be another, and so on:\n\n![Rigging and using keyframes](OEBPS/Images/B05189_08_09.jpg)\n\
    \nIt is necessary to break the piston into parts for animation.\n\n### Tip\n\n\
    Remember that you can use `Shift + H` in `Object` mode to hide everything that\
    \ isn't what you have selected!\n\nHere is how we do it:\n\n1.  Select your piston\
    \ parts and use `Shift + H` to hide the rest of the Artifact.\n2.  Head to `Edit`\
    \ mode and select the bottom portion of each piston set, just like in the previous\
    \ screenshot.\n3.  Press `P` and choose `Selection` from the menu. Rename the\
    \ layer `Pistons.Bottom` in the `Scene Outliner`.\n4.  Hide them by clicking on\
    \ the eye next to their name in the `Scene Outliner`. This will make the rest\
    \ of the process much easier.\n5.  Repeat this process for the middle layer. This\
    \ will leave the top layer separated for you.\n\nIf everything went well, your\
    \ `Scene Outliner` should look something like this:\n\n![Rigging and using keyframes](OEBPS/Images/B05189_08_10.jpg)\n\
    \nAll of the different sections of the Artifact that we will use for animation.\n"
  trans: "\n\n乍一看，`Insert Keyframe Menu`（插入关键帧菜单）给我们提供了几个选项。然而，仔细观察后我们可以发现，所有选项都是同三样东西的变体：`Location`（位置）、`Rotation`（旋转）和\
    \ `Scale`（缩放）。`Location` 将是我们使用最多的选项，用于记录各个活塞部件在移动神器盖子时的位置。我们也将使用 `Rotation` 来旋转齿轮，作为锁定机制的一部分。\n\
    \n在动画制作过程中，还有一种技巧能让我们的生活轻松许多。Dummy 对象（虚拟对象），或 Blender 称为的 `Empty`（空物体），是一种简单的对象，导出场景时不计入场景内，但在制作动画时能提供巨大帮助。可以把它们想象成木偶上的线。没人会看见它们，但它们会让控制动画变得容易得多。\n\
    \n让我们看看 `Empty` 菜单：\n\n![How does Blender handle animation?](img/B05189_08_02.jpg)\n\
    \n`Empty` 可用于简化动画制作。\n\n`Empty` 对象有多种形状，从上图所示的简单坐标轴，到箭头、球体，甚至圆锥体。我们想要制作动画的场景中的对象可以链接到这些对象上，这样我们只需移动\
    \ `Empty`，本质上就是创建了一个控制柄。它们也可用作动画约束的目标。\n\n# 绑定与使用关键帧\n\n现在我们已经清楚需要哪些工具了，让我们来谈谈创建关键帧！\n\
    \n![Rigging and using keyframes](img/B05189_08_03.jpg)\n\n`Timeline`（时间轴）用于添加关键帧，方式类似于\
    \ Unreal 4 中的时间轴。\n\n与 Unreal 4 类似，我们创建的关键帧将显示在 `Timeline` 中。该区域位于 `3D viewport`（3D\
    \ 视口）正下方。关键帧显示为简单的黄线，我们查看的时间范围可通过鼠标滚轮调整。\n\n现在让我们从一个基础立方体开始创建一些关键帧：\n\n![Rigging\
    \ and using keyframes](img/B05189_08_04.jpg)\n\n一个滑动盒子的简单动画。\n\n要制作立方体移动的简单动画，我们需要创建两个关键帧：\n\
    \n1.  选中立方体，按 `I` 打开 `Insert Keyframe Menu`，从列表顶部选择 `Location`，创建第一个关键帧。\n2. \
    \ 现在将 `Timeline` 窗口中的时间滑块滑动到第 `30` 帧。可以通过在 `Timeline` 靠近 30 的位置右键点击，然后按住按钮沿 `Timeline`\
    \ 拖动来完成。图中高亮显示的框表示当前活动帧。\n3.  接下来，在 `3D viewport` 中将立方体向任意你喜欢的方向滑动。最后，按 `I` 并从菜单中选择\
    \ `Location`，就像我们为第一个关键帧所做的那样。\n4.  通过在 `Timeline` 上按住右键并拖动活动帧在 `1` 和 `30` 之间滑动来测试动画。我们应该能看到立方体在我们记录的两个位置之间滑动。\n\
    \n恭喜，我们刚刚为立方体制作了动画！现在让我们看看如何修改或删除可能稍微偏离的关键帧：\n\n![Rigging and using keyframes](img/B05189_08_05.jpg)\n\
    \n介绍 `Dope Sheet`（动作编辑器/逐帧编辑器）。\n\n有时在创建关键帧时，我们可能会在不想放的地方放下一个，或者可能需要调整动画的时间使其感觉更自然。`Dope\
    \ Sheet`（上一张截图中高亮显示的区域）允许我们用相对简单的控制来移动、复制和删除关键帧。\n\n要移动关键帧，选择想要移动的关键帧。然后点击并拖动关键帧到新的时间位置。最后，再次点击\
    \ `LMB`（左键）以确定新的时间位置。\n\n这里我们可以看到 `Dope Sheet` 的实际操作：\n\n![Rigging and using keyframes](img/B05189_08_06.jpg)\n\
    \n复制关键帧在动画必须以开始的精确位置结束时非常有用。\n\n要复制关键帧，选择想要复制的关键帧并按 `Ctrl + C`。现在右键点击并拖动时间滑块到新的期望时间。最后，按\
    \ `Ctrl + V` 粘贴关键帧。这是创建旋转或其他循环动画的绝佳技巧，因为在这些动画中物体必须精确地回到起始位置。\n\n是时候将所学应用到我们的神器上了。\n\
    \n为了给我们的部件制作动画，我们需要将其分解为几个不同的部分。基本上，如果它会动，它就必须是一个独立的部件。现在你可能会问自己，*等等。那我们为什么早前把它做成一个整体？*\
    \ 为了 UV 展开的目的，我们必须让神器作为一个整体。当我们从整体中分离出部件时，它们仍然是我们制作的 UV 贴图的一部分。当我们把整个东西导入 Unreal\
    \ 时，我们创建的材质仍会将那些很棒的纹理应用到神器的每一个部件上。\n\n让我们从分离顶部开始：\n\n![Rigging and using keyframes](img/B05189_08_07.jpg)\n\
    \n选择顶部和顶部活塞部分。\n\n1.  选择盖子外侧的一个面并按 `L`；这应该会选择组成盖子外侧的所有面。\n2.  接下来，按住 `Shift` 键选择盖子内侧的一个面。这会将该面添加到当前选择集中。按\
    \ `L` 选择盖子内侧的所有面。\n3.  现在选择最顶部的面。\n\n    现在我们将活塞添加到选择中：\n\n    ![Rigging and using\
    \ keyframes](img/B05189_08_08.jpg)\n\n    活塞的分解图。这将用于将正确的部件绑定到正确的骨骼。\n\n4.  最后，按住\
    \ `Shift`，选择一个活塞顶部区域的多边形并按 `L`。每个活塞顶部由三个不同部分组成：顶部、中部和底部内侧部分。确保在每个部分中 `Shift` 选择一个面并按\
    \ `L` 以选择该部分的所有面。\n5.  按 `P` 打开 `Separation`（分离）菜单并选择 `Selection`（选中部分）。这将把我们选中的面分离为一个新部件。记得在\
    \ `Scene Outliner`（场景大纲视图）中将其重命名为容易记住的名字，比如 `Top`。\n\n现在我们分离了顶部。对底部和齿轮重复该过程。如果你选择一个面，按\
    \ `L`，没反应，就选旁边的面再试一次。另外，按 `Z` 会开启线框模式。这将允许你穿过物体选择面。务必通过点击面中心的小黑点来选择那些面。\n\n是时候解决那些中间活塞部件了！我们的攻略计划是将它们分离成三层，因为我们将在动画中一起移动它们。底部那组部件是一层，中间那组是另一层，依此类推：\n\
    \n![Rigging and using keyframes](img/B05189_08_09.jpg)\n\n为了动画制作，有必要将活塞分解为多个部件。\n\
    \n### 提示\n\n记住你可以在 `Object`（物体）模式下使用 `Shift + H` 来隐藏未选中的所有东西！\n\n具体操作如下：\n\n1.\
    \  选择你的活塞部件并使用 `Shift + H` 隐藏神器的其余部分。\n2.  进入 `Edit`（编辑）模式，像上一张截图那样选择每组活塞的底部部分。\n\
    3.  按 `P` 并从菜单中选择 `Selection`。在 `Scene Outliner` 中将该层重命名为 `Pistons.Bottom`。\n\
    4.  通过点击 `Scene Outliner` 中其名称旁边的眼睛图标来隐藏它们。这将使后续过程容易得多。\n5.  对中间层重复此过程。这将为你留下分离好的顶层。\n\
    \n如果一切顺利，你的 `Scene Outliner` 应该看起来像这样：\n\n![Rigging and using keyframes](img/B05189_08_10.jpg)\n\
    \n我们将用于动画的神器的所有不同部分。\n\n"
