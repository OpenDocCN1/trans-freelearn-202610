  \ | 2 |\n| 120 | 2 |\n\n在学习了几种不同的聚类技术和算法后，让我们来看看如何评估模型性能。\n\n### 评估模型性能\n\n在本节中，我们将查看几种评估指标来评估聚类模型的性能。\n\
  \n#### 评估聚类算法\n\n评估聚类算法需要衡量算法识别出的不同集群是否有意义且分离良好。评估指标的选择可能取决于基准真值标签的可用性以及聚类技术的具体特征。以下是各种评估指标如何应用于您提到的聚类技术。\n\
  \n在评估聚类结果时，必须考虑应用程序的上下文和数据的特征。通常，会使用一组指标来全面评估聚类质量。此外，多次运行中的可视化检查、特定于领域的验证和稳定性评估可以补充这些定量指标，从而进行更强健的评估。\n\
  \n#### 选择评估指标\n\n在评估聚类结果时，必须考虑应用程序的上下文和数据的特征。通常，会使用一组指标来全面评估聚类质量。此外，多次运行中的可视化检查、特定于领域的验证和稳定性评估可以补充这些定量指标，从而进行更强健的评估。\n\
  \n为本章讨论的聚类技术选择合适的评估指标，需要理解聚类算法的性质和数据的具体特征。不同的指标可以提供关于聚类质量的各种洞察，例如聚合度、分离度、与预定义类别的相关性，或（如果可用）与已知基准真值的匹配程度。\n\
  \n#### 常见评估指标\n\n让我们来看看不同的评估指标：\n\n- **轮廓系数**：如前所述，它衡量对象与其自身集群的相似度相对于其他集群的情况。轮廓系数范围从\
  \ -1 到 1。较高的值表示对象与其自身集群匹配良好，与邻近集群匹配较差。它适用于 K-means、二分 K-means、GMM 和 PIC，尤其是在没有基准真值可用的情况下。\n\
  \n- **Davies-Bouldin 指数**：一个评估集群内相似度和集群间差异的指标。较低的值表示更好的聚类。它适用于 K-means、二分 K-means\
  \ 和 GMM 等方法，在这些方法中，希望将集群定义为紧凑且分离良好。\n\n- **Calinski-Harabasz 指数**：也称为**方差比准则**（**VRC**），该指标评估所有集群之间分散度之和与集群内分散度之和的比率。较高的值通常表示定义更明确的集群，可用于\
  \ K-means、二分 K-means、GMM 和 PIC。\n\n- **调整兰德指数 (ARI)**：通过考虑所有样本对，并计算预测聚类和真实聚类中被分配到同一集群或不同集群的样本对数量，来衡量两个聚类之间的相似度。当您有基准真值时，它特别有用。当有标记数据可用于比较时，ARI\
  \ 可用于所有提到的聚类技术。\n\n- **归一化互信息 (NMI)**：这是 **互信息**（MI）得分的归一化，用于将结果缩放到 0（无互信息）和 1（完美相关）之间。与\
  \ ARI 类似，它在有基准真值标签时使用，因此适用于在受监督环境下评估所有提到的聚类方法。\n\n- **困惑度**：常用于 LDA 等主题模型，困惑度衡量概率分布预测样本的能力。较低的困惑度表示更好的泛化性能。\n\
  \n- **对数似然**：这表示在给定模型参数的情况下，观察到的数据的可能性。较高的值表明模型更好，但需要仔细解读，尤其是在比较参数数量不同的模型时。这在 GMM\
  \ 中使用。\n\n- **Dunn 指数**：它衡量不在同一集群中的观测值之间最小距离与最大集群内距离的比率。较高的值表示更好的聚类。\n\n在 Spark\
  \ 中使用轮廓系数来评估聚类模型，可以遵循以下一般步骤：\n\n- 1. Import `ClusteringEvaluator` from Spark MLlib.\n\
  - 2. Instantiate `ClusteringEvaluator`, specifying the metric name as `silhouette`\
  \ if necessary (this is the default metric).\n- 3. Evaluate your model by passing\
  \ the predictions DataFrame to the evaluate method of ClusteringEvaluator. The predictions\
  \ DataFrame should include a prediction column indicating the cluster assigned to\
  \ each instance.\n\n虽然 Spark 内置的聚类评估指标支持目前主要集中在轮廓系数上，但 Spark 可扩展的特性允许根据需要实现其他指标，以满足您的特定评估标准和聚类分析目标。\n\
  \n#### 选择标准和条件\n\n让我们了解使用不同评估指标的上下文：\n\n- **缺乏基准真值**：在完全无监督的场景中，没有可用的外部标签时，内在指标（如轮廓系数、Davies–Bouldin\
  \ 指数或 Calinski–Harabasz 指数）更为合适，因为它们仅依赖于聚类结果和数据本身。\n\n- **存在基准真值**：当外部标签或基准真值可用时（即使仅针对数据子集），外在指标（如\
  \ ARI 或 NMI）能直接衡量聚类与已知标签匹配的程度。\n\n- **集群的性质**：考虑预期的集群形状和分布。假设球形集群的指标（例如轮廓系数的一些解释）可能不适用于评估\
  \ GMM 生成的集群，因为 GMM 可以捕捉更复杂的椭圆分布。\n\n- **可扩展性和计算成本**：对于非常大的数据集，计算密集型指标可能不实用。选择可以大规模高效计算的指标，或考虑使用数据样本进行评估。\n\
  \n- **可解释性**：指标的选择也应与利益相关者对可解释性的需求保持一致。例如，轮廓系数可以为非技术受众提供更直观的集群聚合度和分离度洞察。\n\n- **多指标**：通常，依赖单一指标可能会产生误导。考虑使用一组指标来获得聚类性能的更全面视图。每个指标都可以突出聚类质量的不同方面，提供更细致的理解。\n\
  \n总结来说，为聚类技术选择评估指标涉及在算法的方法学特性、数据性质、计算上下文和聚类任务的具体目标之间取得平衡。了解每个指标的优势和局限性对于做出与分析目标一致的明智选择至关重要。\n\
  \n#### 提高模型性能\n\n提高聚类模型性能需要多方面的方法。这些策略涵盖从数据预处理到算法特定调整和聚类后评估。\n\n\n\n\n\n#### 所有模型的通用策略\n\
  \n提高模型性能的策略大致可分为以下几类：\n\n- **数据预处理：**\n  - **归一化/标准化：**通过缩放数据，确保所有特征平等贡献，尤其是对于 K-means\
  \ 和 GMM 等对数据尺度敏感的算法\n  - **噪声消除：**移除异常值和噪声，防止它们扭曲聚类结果\n  - **降维：**使用 PCA 或 t-SNE\
  \ 等算法降低维度，有助于缓解维度灾难并提高聚类质量\n\n- **特征选择与工程：**\n  - 识别并选择与聚类任务最相关的特征\n  - 构建新特征，可能更好地捕捉数据中的固有结构\n\
  \n- **超参数调优：**\n  - 尝试不同的超参数，例如 K-means 中的簇数量或 LDA 中的狄里克莱分布参数，以找到最佳设置\n\n#### 特定模型策略\n\
  \n我们可以基于聚类技术关注以下策略：\n\n- **K-means：**\n  - **智能初始化：**使用 K-means++ 等方法进行更智能的质心初始化，以避免糟糕的局部极小值\n\
  \  - **多次运行：**执行多次初始化并选择收敛效果最好的运行，以减轻随机初始化的影响\n  - **肘部法则：**使用肘部法则帮助确定最佳簇数量，在模型复杂度与解释方差之间取得平衡\n\
  \n- **LDA：**\n  - **优化主题连贯性：**调整主题数量和超参数（alpha 和 beta）以最大化主题连贯性，确保主题具有意义且可解释\n \
  \ - **融入先验知识：**如果可用，通过先验知识融入领域知识以指导主题发现过程\n\n- 二分 K-means：\n  - 簇分割选择：制定或采用选择分割哪些簇的标准，例如选择\
  \ SSE 最高或规模最大的簇，以提高整体聚类质量\n  - 停止准则：基于簇稳定性、SSE 或预定义的簇数量定义明确的停止准则，以避免过度分割\n\n- **GMM：**\n\
  \  - 协方差矩阵类型：尝试不同类型的协方差矩阵（全、共轭、对角、球形），以找到最适合数据分布的类型\n  - 正则化：向协方差矩阵添加正则化项以确保数值稳定性，尤其在高维空间中\n\
  \n- PIC：\n  - 相似度度量：仔细选择或设计用于构建图的相似度度量，确保其捕捉数据中的实际关系\n  - 图稀疏化：考虑对图进行稀疏化以仅保留有意义的边，这可以降低计算复杂度并将聚类集中在强数据关系上\n\
  \n- 聚类后策略：\n  - 聚类验证：使用内部和外部验证指标评估聚类质量并指导改进\n  - 结果解读：邀请领域专家解读聚类结果，这可以提供模型是否捕捉到有意义分组的洞察\n\
  \  - 迭代优化：聚类可以是一个迭代过程，初始结果可为后续的特征选择、算法调优甚至数据收集提供参考\n\n改进聚类模型是一个迭代和探索性过程，通常需要在模型复杂度、可解释性和计算效率之间取得平衡。将这些策略根据数据集的特定特征和任务要求进行定制，可以带来更有意义和更有用的聚类结果。\n\
  \n提高分类模型性能涉及在模型开发过程的不同阶段应用多种技术。以下是一些增强模型准确性和有效性的策略：\n\n- 数据质量和数量：\n  - 增加数据量：更多的数据可以帮助模型更好地学习并良好地推广到未见数据。如果可能，考虑扩充您的数据集。\n\
  - **数据清洗**：移除异常值、处理缺失值并纠正数据集中的错误，以提高模型准确性。\n- **特征工程**：通过领域知识从现有特征创建新特征。设计良好的特征可以显著提高模型性能。\n\
  - **特征选择与降维：**\n  - **特征选择**：识别并保留最有信息量的特征，同时移除不相关或冗余的特征，以减少过拟合并提高模型性能。\n  - **降维**：PCA\
  \ 等技术可以减少特征空间，通过移除噪声来潜在地提高模型效率和性能。\n- **选择合适的模型：**\n  - **尝试不同的算法**：不同的模型有各自的优势和劣势。尝试各种算法（例如决策树、SVM\
  \ 和集成方法），以找到最适合您数据的模型。\n  - **集成方法**：结合多个模型的预测通常比任何单一模型产生更好的结果。袋装、提升和堆叠等技术是强大的集成方法，可用于提高分类性能。\n\
  - **超参数调优：**\n  - **网格搜索和随机搜索**：这些是搜索多个参数值组合的系统方法，可为您的模型找到最佳设置。\n  - **交叉验证**：使用交叉验证确保模型在数据集的不同子集上的性能是稳健的。\n\
  - **处理不平衡数据：**\n  - **重采样技术**：对少数类进行过采样或对多数类进行欠采样以平衡数据集，并提高模型在少数类上的表现。\n  - **代价敏感学习**：修改算法，使其对少数类的误分类惩罚重于多数类。\n\
  \  - **使用合适的指标**：选择能提供模型在不平衡数据集上表现洞察的评估指标，例如 F1 分数、Precision-Recall AUC 或 Matthews\
  \ 相关系数。\n\n- **高级特征工程：**\n  - 交互项：如果怀疑特征之间的交互可能具有预测性，请考虑添加捕捉此类交互的特征。\n  - 多项式特征：使用多项式特征来建模非线性关系。\n\
  - **模型正则化：**\n  - 应用正则化技术：L1（Lasso）和 L2（Ridge）等正则化技术可以通过惩罚模型中的大系数来防止过拟合。\n- **数据变换：**\n\
  \  - 特征缩放：标准化或归一化您的特征，使其处于相同的尺度。这对于对数据尺度敏感的模型（例如 SVM 或 KNN）尤为重要。\n  - 数据编码：使用 one-hot\
  \ 编码、目标编码或嵌入等技术正确编码类别变量，尤其对于需要数值输入的算法。\n- **模型更新：**\n  - 增量学习：使用新数据持续更新模型，以适应随时间的变化。\n\
  \  - 反馈循环：将模型预测结果重新纳入训练，以纠正错误并适应新模式。\n- **领域特定技术：**\n  - 利用领域知识：融入专家知识可以指导特征工程、模型选择和结果解读。\n\
  \  - 自定义损失函数：设计专门针对业务问题细微差别的损失函数。\n- **实验严谨性：**\n  - 系统性实验：详细记录实验日志，包括模型配置、结果和观察。实验跟踪工具和平台对此大有裨益。\n\
  \  - 同行评审与协作：与同行协作进行代码评审和讨论。新视角可以提供新的洞察和改进想法。\n\n改进分类模型是一个迭代过程，涉及尝试不同的策略、持续监控性能，并适应新数据和洞察。在模型复杂度、可解释性和性能之间取得平衡是开发有效且可靠的分类模型的关键。\n\
  \n\n\n\n### 摘要\n\n本章我们了解到，聚类作为一种无监督学习形式，为在原始未标记数据中发现模式和结构提供了强大工具。通过将相似数据点分组，K-means、LDA、二分\
  \ K-means、GMM 和 PIC 等聚类技术揭示了跨市场细分到生物信息学等多个领域至关重要的隐藏洞察。我们在本章中进一步探讨了这一点。此外，我们了解到每种算法都有其独特的优势和挑战，无论是处理高维数据、确定最佳簇数量，还是管理模型复杂度。理解并应用正确的评估指标对于评估聚类质量和提升模型性能至关重要，如我们在本章所学。\n\
  \n随着数据复杂度的增加，稳健的聚类技术在提取有价值信息并辅助决策方面的重要性无论如何强调都不为过。随着持续进步和谨慎应用，聚类仍然是数据科学家工具箱中不可或缺的一部分，正如我们在本章所学。\n\
  \n在下一章中，我们将探讨构建推荐系统。\n"
- "## 8 构建推荐系统\n\n推荐系统是推动用户参与度、转化率和客户满意度的关键方面。难以想象没有个性化电影推荐的 Netflix 服务，或没有“购买了此商品的用户还喜欢……”推荐的\
  \ Amazon。个性化推荐是用户留存和收入增长的关键。eBay 和 Alibaba 等电子商务平台从个性化商品推荐中受益，Spotify 等音乐流媒体服务则根据用户偏好策划播放列表。推荐系统不仅仅是算法；它们是提升用户满意度、创造收入并塑造数字格局的战略工具。利用推荐系统从用户活动和洞察中获取动力的企业将获得竞争优势。\n\
  \n在本章中，我们将涵盖以下主要主题：\n\n- 推荐系统概述\n- 推荐系统的必要性\n- 推荐系统的工作机制\n- 推荐系统中的关键问题与挑战\n- 提高推荐质量\n\
  - 使用 Apache Spark 构建推荐系统\n\n本章结束时，您将扎实掌握使用 Apache Spark 构建推荐系统所需的理解和技能。\n\n### 技术要求\n\
  \n您可以在 GitHub 上找到本章的代码文件，网址为 https://github.com/PacktPublishing/Apache-Spark-for-Machine-Learning/tree/main/Chapter07。\n\
  \n### 推荐系统概述\n\n推荐系统是一种向用户提供个性化建议的智能算法。该系统的主要目标是帮助用户从海量选项中找到相关项目。如下图所示，这些系统利用用户偏好、行为和过去交互的数据来生成个性化推荐：\n\
  \n![](img/b40816015a9835648eac2b186dac82d1_222_0.png)\n\n无论是在流媒体平台推荐电影、在电子商务网站推荐商品，还是策划音乐播放列表，推荐系统都能提升用户满意度和参与度。它们在数据驱动的世界中发挥着关键作用，帮助用户在海量在线选择中发现内容。\n\
  \n### 了解推荐系统的目的和重要性\n\n推荐系统在我们的数字旅程中充当智能向导，根据用户的偏好和行为推荐相关项目。其目的跨越多个领域：\n\n- **提升用户体验和参与度：**\n\
  \  - **目的：** 推荐系统分析用户行为、偏好和历史交互，为每个人推荐量身定制的相关产品、内容或信息。\n  - **影响：** 通过提供定制化推荐，企业可以提升客户参与度并建立忠诚度。无缝体验能让用户保持参与和满意。\n\
  \  - 示例：\n    - Netflix：个性化电影和电视节目建议让观众欲罢不能\n    - Spotify：精选播放列表迎合个人音乐品味\n    -\
  \ YouTube：视频推荐引导用户浏览庞大的内容库\n\n- 提高销售额和收入：\n  - 目的：推荐能带动收入。当用户快速发现相关产品时，他们更有可能进行购买。\n\
  \  - 影响：推荐能带动转化。当用户被引导至相关商品时，他们更有可能购买。\n  - 示例：Amazon 将其 35% 的收入归功于推荐算法。\n\n- 减少信息过载：\n\
  \  - 目的：在选择无限的世界中，推荐系统过滤噪声\n  - 影响：用户欣赏简化决策的平台，从而提高满意度并带来回头访问\n  - 示例：\n    - Google\
  \ News：根据用户兴趣和行为筛选新闻文章，Google News 简化了信息消费。\n    - eBay：提供个性化商品推荐可大大改善购物体验，尤其是对于库存种类繁多的类别。\n\
  \    - PubMed：推荐系统向医疗专业人士推荐相关研究论文，根据其专业和兴趣提供定制建议，而无需他们手动搜索数千篇文章。\n\n- 业务指标与品牌忠诚度：\n\
  \  - 目的：推荐影响关键绩效指标 (KPI) 和客户忠诚度。\n  - 影响：\n    - 点击率、转化率和平均订单价值均受益于个性化建议\n    -\
  \ 由于有效推荐而在平台上花费更多时间的用户将成为忠实客户\n  - 示例：Amazon 的推荐引擎对收入产生显著影响。通过推荐相关产品（交叉销售）和互补商品（追加销售），他们提高了平均订单价值。个性化推荐让用户保持参与，鼓励重复购买并培养忠诚度。\n\
  \n在当今竞争激烈的环境中，了解推荐系统对于调优算法的数据科学家或创建初创企业的企业家至关重要。此类系统对于提升用户满意度、推动收入和塑造数字交互至关重要。\n\
  \n### 各种推荐方法概述\n\n推荐系统是通过推荐相关内容、产品或服务来提升用户体验的必要工具。这些系统利用不同技术提供个性化推荐。让我们探讨一些常见方法。\n\
  \n### 协同过滤方法\n\n协同过滤是一种流行的推荐技术，利用用户-项目交互来进行个性化推荐。此方法的几个特点如下：\n\n- 协同过滤是一种根据其他用户对项目的偏好和行为相似性来向用户推荐项目的推荐方法\n\
  - 核心思想是根据用户行为对用户进行分组，并利用一般群体特征向目标用户推荐相关项目\n- 其运行原则是：行为相似的用户具有相似的兴趣和品味\n\n下图展示了协同过滤的机制：\n\
  \n![](img/b40816015a9835648eac2b186dac82d1_224_0.png)\n\n图 7.2 – 协同过滤的工作机制\n\n协同过滤方法的不同类型如下：\n\
  \n- 基于内存的协同过滤：基于内存的协同过滤是一种仅依赖过去用户-项目交互的方法。您可以将其可视化为一个矩阵，其中行代表用户，列代表项目，每个单元格包含评分等交互数据。该方法有两种方法——用户-用户方法和项目-项目方法。这两种方法都根据这些交互计算用户或项目之间的相似性。使用这些相似性，将项目推荐给用户。但是，需要注意的是，这些方法不构建显式模型。\n\
  \n- 基于模型的协同过滤：推荐系统的基于模型的方法与基于内存的方法不同，它们利用交互数据创建预测模型。矩阵分解和隐因模型等技术属于此类方法。这些模型捕获数据中的潜在模式和关系，从而得出更准确的推荐。然而，这些模型需要更多计算资源，并且容易受到冷启动问题的影响，当新用户或项目缺乏足够数据时就会出现此问题。\n\
  \n### 基于内容的方法\n\n基于内容的过滤是一种根据项目属性而非用户交互来推荐项目的推荐系统。例如，如果用户喜欢观看动作电影，系统将推荐类似的动作电影，如下图所示。该方法关注类型、关键词或描述等项目特征。当有大量项目元数据可用时，基于内容的方法效果较好，但它们难以推荐超出用户偏好的多样化项目，也称为偶然发现。\n\
  \n![](img/b40816015a9835648eac2b186dac82d1_225_0.png)\n\n图 7.3 – 基于内容的推荐的工作机制\n\n\
  \n\n\n### 混合推荐系统\n\n混合推荐系统旨在通过结合协同过滤和基于内容的方法来克服单一方法的局限性。这些系统同时利用用户-项目交互和项目属性，提供兼顾个性化与多样性的稳健推荐。加权混合模型和特征组合方法是可用于此目的的混合系统示例。\n\
  \n### 基于深度学习的推荐\n\n推荐系统领域深受近期深度学习进步的影响。得益于从大规模数据中学习复杂模式的能力，神经网络已被证明是一种有价值的工具。神经协同过滤（NCF）和循环神经网络（RNN）等技术在提升推荐质量方面尤其有效。不过需要注意的是，这些方法需要大量数据和计算资源才能发挥作用。\n\
  \n总之，推荐系统在各个领域提供个性化体验方面至关重要。它们在无声中引导您的选择，无论您是在 Netflix 上连续观看节目还是在线购物，都能让您的数字之旅更加愉快且高效。\n\
  \n### 推荐系统的必要性\n\n推荐系统的必要性和价值可以从多种角度来理解，例如个性化、用户参与度、业务增长、数据利用、内容发现以及供需匹配。我们将在以下子章节中进一步探讨。\n\
  \n#### 个性化\n\n在当今信息爆炸的世界里，个性化不仅是一种可有可无的功能，更是一种必需品。推荐系统使用先进算法分析大量数据，为每位用户提供个性化体验。通过定制内容以适应个人偏好和品味，这些系统有助于创造独特且令人满意的用户体验。个性化促进用户与平台之间建立更深层的联系，从而产生更有意义且更相关的交互。\n\
  \n#### 用户参与度\n\n推荐系统在提升用户参与度方面发挥着关键作用。通过展示与用户偏好和之前活动相匹配的选项，这些系统增加了用户交互的机会。这可能意味着在流媒体服务上观看另一个视频、在新闻网站上阅读另一篇文章，或在网上商店购买更多商品。提高参与度不仅能提升用户满意度，还能延长会话时长并增加访问频率，进而增强用户忠诚度。\n\
  \n#### 业务增长\n\n从商业角度来看，推荐系统价值极高。它们可以通过提供准确且及时的建议来增加销售额和内容消耗，从而带来更高的转化率和更高的平均订单价值。例如，Amazon\
  \ 的推荐引擎基于浏览历史、购买历史以及其他客户浏览或购买的商品来推荐产品，从而负责其相当一部分销售额。这种有针对性的方法不仅能提升销售额，还能通过使产品摆放与消费者倾向相匹配来提高营销效率。\n\
  \n#### 数据利用\n\n用户每天产生的数据是企业的宝贵资源，而推荐系统则是挖掘其全部潜力的关键。这些系统使用用户数据（如交易历史、浏览习惯、评分和社交互动）来开发预测用户偏好的高级模型。这不仅有助于根据需求预测优化库存和内容管理，还能识别新兴趋势和用户细分群体，从而为产品开发和战略决策提供依据。\n\
  \n#### 内容发现\n\n推荐系统对用户的最大好处之一就是内容发现。面对琳琅满目的产品、服务和内容，用户容易感到困惑或只坚持自己熟悉的选择。推荐系统帮助用户发现自己可能无法独立找到的新奇内容，拓宽视野并提升整体体验。这一点在\
  \ Netflix 或 Spotify 等平台上尤为明显，发现新电影、节目或音乐是用户体验中至关重要的一部分。\n\n#### 供需匹配\n\n推荐系统在将用户与提供商库存中合适的产品或内容连接起来方面发挥着至关重要的作用。这有助于确保有价值的产品或内容触达目标受众，同时最大限度地利用可用资源，从而促进更高效的市场。\n\
  \n推荐系统是当今数字世界不可或缺的一部分。它们通过推动个性化、参与度和业务增长，在用户体验中发挥着关键作用。这些系统利用数据来理解和预测用户偏好，帮助企业更有效地满足用户需求。它们还能促进内容发现并提升整体满意度。随着技术的进步，推荐系统的重要性和复杂性可能会增加，凸显其在塑造数字格局中不可或缺的作用。\n\
  \n### 推荐系统的工作机制\n\n让我们了解推荐系统的工作机制，包括每种推荐系统类型的工作流程、优点、缺点及应用。\n\n#### 基于内容的推荐系统\n\n\
  基于内容的推荐系统是一种向用户提供个性化推荐的流行方式。这类系统基于这样一种原理：可根据用户与项目的交互（如浏览历史或购买行为）来预测其兴趣。这种方法的主要目标是推荐与用户先前表现出兴趣的项目相似的项目。\n\
  \n#### 基于内容的推荐系统的工作流程\n\n该系统的工作流程如下：\n\n- 1. **特征提取与预处理：**\n  - **特征提取**：我们首先确定推荐所需的基本特征。这些特征描述电影、文章和产品等项目，可包括类型、关键词、标签或文本描述。\n\
  \  - **预处理**：通过分词、去除停用词并将特征转换为合适格式来清理和预处理数据。\n\n- 2. **创建用户画像：**\n  - 每个用户都由一个捕获其偏好的画像表示。该画像是根据用户交互过的项目提取的特征构建的。\n\
  \  - 如果用户经常观看科幻电影，其画像将突出科幻类型。\n\n- 3. **提取用户偏好：**\n  - 根据用户交互（例如评分、点击和浏览），从其参与过的项目中提取相关特征\n\
  \  - 这些偏好有助于构建用户画像\n\n- 4. **通过矩阵代数学习用户画像：**\n  - 使用矩阵代数技术（如矩阵分解）来学习用户画像\n  - 目标是将用户偏好映射到捕获其品味的潜在因子上\n\
  \n- 5. **构建推荐：**\n  - 根据用户画像，提供匹配其偏好的项目推荐\n  - 使用各种相似度量（例如余弦相似度和皮尔逊相关系数）计算用户画像与其他项目之间的相似度\n\
  \  - 推荐相似度得分高的项目\n\n- 6. **部署推荐系统：**\n  - 将推荐系统集成到应用程序或平台中\n  - 随着新交互的发生持续更新用户画像\n\
  \  - 监控系统性能并收集反馈以供进一步改进\n\n下图展示了基于内容的推荐系统中涉及的各种元素、步骤和流程：\n\n![](img/b40816015a9835648eac2b186dac82d1_229_0.png)\n\
  \n图 7.4 – 基于内容的推荐系统概览\n\n#### 基于内容的推荐系统的优点\n\n- 针对特定用户的推荐：\n- 基于内容的系统为单个用户个性化推荐，无需依赖其他用户的数据，因此适用于大规模用户群。\n\
  - 这类系统旨在识别用户的特定兴趣并推荐符合其品味的小众项目。这种个性化方法旨在为用户提供更量身定制、更愉快的体验。\n\n\n\n\n\n- 域知识利用：\n\
  \  - 基于内容的系统使用手工构建的特征（如类型、关键词和描述）来个性化推荐\n  - 当有可用的域知识时，它们可以通过创建用户偏好的精确模型来表现出色\n\n\
  - 避免“新物品问题”：\n  - 基于内容的方法在处理新物品方面比协同过滤更有效。这意味着它们可以为之前未被评分或评论过的新物品提供准确的推荐\n  - 基于内容的系统可以根据物品的描述来推荐物品，而无需依赖历史交互\n\
  \n#### 基于内容的推荐系统的缺点\n\n- 探索有限：基于内容的推荐系统根据用户的先前兴趣向用户推荐物品。这些系统分析用户的过去行为和偏好以识别模式和相似性，然后推荐与这些模式匹配的物品。然而，由于无法超越用户当前的偏好，它们可能会错过多样化的推荐。\n\
  \n- 依赖手工构建的特征：推荐的质量取决于手工制作的特征的质量。如果这些特征次优，系统的性能可能会受到限制。\n\n- 相关性与新颖性的平衡：在提供熟悉的推荐和引入新内容之间找到完美的平衡可能是一项困难的任务。基于内容的系统有时可能只推荐熟悉的选项，这可能会限制推荐的多样性。\n\
  \n#### 基于内容的推荐系统的应用及其影响\n\n- 电子商务平台：Amazon 的推荐系统使用高级算法分析产品元数据，其中包括类型、描述和客户评论。根据用户的浏览历史、过去的购买记录和显式评分，系统会推荐相关产品。例如，如果你购买一本科幻书，系统会推荐类似的书名或你可能感兴趣的相关周边商品。\n\
  \n- 流媒体服务：Netflix 的推荐系统同时利用基于内容的方法和协同过滤。系统在用户观看电影或节目后，分析类型、演员和导演等元数据来推荐类似内容。例如，如果某人喜欢动作电影，系统会推荐其他动作紧凑的片名。\n\
  \n- 音乐平台：Spotify 使用节奏、类型和艺术家等歌曲特征来创建个性化播放列表。例如，如果你听欢快的流行歌曲，它会策划包含类似曲目的播放列表。这能提高用户满意度和参与度。\n\
  \n- 新闻聚合器和社交媒体：Facebook 的推荐算法分析用户互动（如点赞、分享和评论）以及主题和关键词等内容属性，以推荐相关的帖子、文章和朋友，使用户保持参与。\n\
  \n- 视频分享平台：YouTube 根据内容相似性推荐视频。例如，如果你观看烹饪教程，它会推荐更多烹饪相关内容。系统会随时间适应用户偏好，以最大化满意度。\n\
  \n- 在线广告：Google Ads 使用基于内容的推荐，通过分析网站内容、用户行为和关键词来定位特定受众，从而展示相关广告。例如，搜索徒步装备会显示与户外设备相关的广告。\n\
  \n总结：基于内容的推荐系统能改善各个领域的用户体验、推动销售，并简化内容发现。\n\n#### 协同过滤推荐系统\n\n协同过滤是一种根据与其他具有相似品味的用户的偏好和行为来向用户推荐物品的技术。与依赖物品特征的传统推荐方法不同，协同过滤分析用户之间的互动及其偏好来生成推荐。该方法基于这样一个概念：相似的用户倾向于喜欢相似的事物，旨在捕捉这些相似性，为用户提供更准确的推荐。\n\
  \n### 推荐系统中协同过滤的工作流程\n\n该方法的工作方式如下：\n\n1. **数据收集和用户行为：**\n   - 使用大量用户的数据开发全面的用户行为数据库。\n\
  \   - 收集评分、点击、浏览或显式偏好（例如电影评分和产品购买）等数据。\n\n2. **用户-物品交互矩阵：**\n   - 构建一个矩阵，每一行代表一个用户，每一列代表一个物品（例如电影和产品）。\n\
  \   - 用用户反馈填充矩阵——显式（数值评分）或隐式（观看、点击和点赞）。\n\n3. 相似度计算：\n   - 衡量用户或物品之间的相似度。\n\n4.\
  \ 基于用户的协同过滤：\n   - 识别具有相似偏好的用户。\n   - 推荐与目标用户相似的用户喜欢的物品。例如，如果用户 A 和用户 B 有相似的电影偏好，则向用户\
  \ A 推荐用户 B 喜欢的电影。\n\n5. 基于物品的协同过滤：\n   - 关注物品之间的相似性。\n   - 推荐与用户已经参与过的物品相似的物品。如果用户\
  \ A 喜欢 *黑客帝国*，则推荐其他科幻电影。\n\n6. 嵌入和自动学习：\n   - 为电影和用户分配标量值（嵌入）。\n   - 这些嵌入捕捉特征（例如儿童内容与成人内容）。\n\
  \   - 电影和用户嵌入的乘积预测用户偏好。\n   - 自动学习嵌入，无需手动特征工程。\n\n7. 部署和推荐：\n   - 将协同过滤系统集成到应用程序或平台中。\n\
  \   - 持续更新用户档案并监控系统性能。\n   - 基于相似性和嵌入向量为用户提供个性化推荐。\n\n让我们来看看协同过滤的优缺点。\n\n### 协同过滤的优点\n\
  \n- 推荐准确性提高：\n  - 协同过滤利用用户行为模式来进行准确的推荐。通过分析过去的互动，它识别相似的用户或物品，从而获得更好的预测。\n\n- 鲁棒性和适应性：\n\
  \  - 协同过滤能很好地适应用户偏好和物品可用性的变化\n  - 它不依赖显式的域知识或特征工程，使其在不同领域之间具有通用性\n\n- 缓解冷启动问题：\n\
  \  - 冷启动问题发生在新用户或新物品的交互历史有限时\n  - 即使直接数据稀缺，协同过滤也可以通过依赖相似用户或物品来提供推荐\n\n- 提高用户满意度：\n\
  \  - 通过根据用户行为推荐相关物品，协同过滤提高了用户参与度和满意度\n  - 用户欣赏符合其兴趣的个性化推荐\n\n### 协同过滤的缺点\n\n- 实现和维护复杂：\n\
  \  - 协同过滤需要仔细的实现和调优\n  - 由于计算需求和可扩展性问题，管理大规模推荐系统可能具有挑战性\n\n- 参数调优和权重：\n  - 精细调整参数（例如相似度指标和邻域大小）对最佳性能至关重要\n\
  \  - 参数选择不当可能导致次优推荐\n\n- 潜在偏差：\n  - 由于用户-物品交互的固有性质，协同过滤可能会引入偏差\n  - 偏差可能源于流行度偏差（偏爱热门物品）或用户人口统计信息\n\
  \n- 上下文信息有限：\n  - 协同过滤主要依赖过去的行为，缺乏上下文（例如时间、位置和用户人口统计信息）\n  - 在协同过滤框架中纳入其他特征（侧面信息）可能具有挑战性\n\
  \n下图展示了协同过滤推荐系统中涉及的各种元素、步骤和流程：\n\n\n\n![](img/b40816015a9835648eac2b186dac82d1_234_0.png)\n\
  \n图 7.5 – 协同过滤概览\n\n总之，协同过滤利用用户交互和相似性来提供个性化推荐，改善各个领域的用户体验。\n\n#### 基于用户的协同过滤工作流程\n\
  \n个性化推荐是通过利用相似用户的偏好和行为来生成的。这种技术根据用户的兴趣和行为向用户推荐项目。\n\n工作流程如下：\n\n- 1. 用户相似度计算：\n\
  \  - I. 首先，我们创建一个矩阵，每一行代表一个用户，每一列代表一个项目（例如，电影、产品或歌曲）。\n  - II. 我们根据用户与项目的交互来计算用户之间的相似度。常见的相似度指标包括余弦相似度、皮尔逊相关系数或杰卡德指数。\n\
  \  - III. 偏好相似（即相似度得分较高）的用户被视为“邻居”。\n- 2. 推荐生成：\n  - I. 对于目标用户（我们要向其推荐项目的用户），我们识别其邻居（相似用户）。\n\
  \  - II. 我们查看邻居喜欢、评分或与之交互过的项目。\n  - III. 邻居喜欢但目标用户尚未看到的项目成为潜在推荐。\n  - IV. 系统将这些项目推荐给目标用户。\n\
  \n总之，基于用户的协同过滤通过挖掘品味相似的用户的集体智慧，帮助个性化推荐。\n\n#### 基于用户的协同过滤的实际案例\n\n- 电影推荐：\n  - 想象两个用户，用户\
  \ A 和用户 B，他们有相似的电影偏好。\n  - 如果用户 A 观看并喜欢了电影 X，系统会向用户 B 推荐电影 X。\n\n流媒体平台（如 Netflix）广泛采用这种方法，根据相似用户的喜好来推荐电影。\n\
  \n- 电子商务产品推荐：\n  - 假设一组用户购买了与用户购物历史相似的产品。\n  - 如果这些用户也购买了某个特定商品，系统会向该用户推荐该商品。\n\
  \  - 电子商务平台（如 Amazon）利用这项技术个性化产品推荐。\n\n- 音乐推荐：\n  - 当用户有相似的音乐偏好时，协同过滤可以推荐他们可能喜欢的歌曲。\n\
  \  - 如果用户 C 听的艺术家与用户 D 喜欢的艺术家相似，系统会向用户 D 推荐相关音乐。\n\n流媒体音乐服务（如 Spotify）采用协同过滤来增强用户播放列表。\n\
  \n#### 基于项目的协同过滤\n\n这是一种推荐技术，关注项目之间而非用户之间的相似性。让我们探讨一下它的工作原理。\n\n#### 推荐系统中基于项目的协同过滤工作流程\n\
  \n其工作原理如下：\n\n- 1. 项目相似度计算：\n  - I. 我们创建一个矩阵，每一行代表一个项目（例如，电影、产品或歌曲），每一列代表一个用户。\n\
  \  - II. 项目之间的相似度根据用户交互来计算。常见的相似度指标包括余弦相似度、杰卡德指数或调整后的余弦相似度。\n  - III. 倾向于被同一组用户喜欢或交互的项目被视为相似。\n\
  - 2. 推荐生成：\n  - I. 对于目标用户，我们查看其已评分或交互过的项目。\n  - II. 我们根据其与其他用户的交互来识别相似项目。\n  - III.\
  \ 与用户已喜欢项目相似的项目成为潜在推荐。\n  - IV. 系统将这些相似项目推荐给用户。\n\n#### 基于项目的协同过滤的优点\n\n- 基于项目的过滤计算效率高，因为不需要计算用户相似度。\n\
  - 对于新用户，它能更好地处理“冷启动”问题，因为它依赖于项目与项目之间的关系。\n\n#### 基于项目的协同过滤的缺点\n\n- 如果用户有独特的偏好，基于项目的过滤可能会错过个性化推荐。\n\
  - 它需要大量的用户交互数据集才能进行准确的推荐。\n\n总之，基于项目的协同过滤帮助用户根据现有偏好发现相关项目。\n\n#### 基于项目的协同过滤的实际案例\n\
  \n- 电影推荐：\n  - 想象一个电影流媒体平台，用户在其中对电影进行评分和交互。\n  - 基于项目的协同过滤能识别与用户已喜欢电影相似的电影。\n  -\
  \ 如果用户喜欢电影 X，系统会推荐其他高度相似的电影。\n\n这种方法有助于根据项目相似性个性化电影推荐，提升用户的观看体验。\n\n- 电子商务产品推荐：\n\
  \  - 亚马逊等在线零售商使用基于项目的过滤来推荐产品。\n  - 如果用户购买或查看了特定产品，系统会识别相关项目。\n\n例如，如果用户购买了相机，系统可能会根据项目相似性推荐相机配件（镜头或三脚架）。\n\
  \n这项技术增强了交叉销售，并帮助用户发现相关产品。\n\n- 音乐播放列表：\n  - 流媒体音乐服务使用基于项目的协同过滤来创建个性化播放列表。\n  -\
  \ 如果用户喜欢特定艺术家或流派的歌曲，系统会推荐类似的曲目。\n\n例如，如果用户喜欢艺术家 A 的歌曲，系统会建议艺术家 A 的其他歌曲或相似艺术家的歌曲。\n\
  \n通过利用项目相似性，音乐平台增强了用户参与度和发现度。\n\n现在，让我们来看看 Apache Spark 中的一个算法。\n\n#### 交替最小二乘法（ALS）——Apache\
  \ Spark 中的协同过滤算法\n\nALS 是一种矩阵分解技术，常用于推荐系统中的协同过滤。它旨在通过将大矩阵分解为两个低维矩阵来预测缺失值（例如用户-项目评分）。ALS\
  \ 属于协同过滤类别。\n\nALS 的优点包括：\n\n- 可扩展性：ALS 适用于大型数据集和并行处理（非常适合 Spark）。\n- 隐式反馈：它能有效处理隐式反馈（例如点击和浏览）。\n\
  - 冷启动：它能处理交互历史有限的新用户或项目。\n\nALS 可应用于电子商务，如下所示：\n\n- 在电子商务中，ALS 可以根据用户的历史交互（购买、点击等）向用户推荐产品。\n\
  - 通过学习隐式特征，ALS 预测缺失的评分并推荐个性化产品。\n- 研究表明，ALS 能显著降低均方根误差（RMSE），提高推荐准确性。\n\n想象一下，我们有一个大表格，包含用户及其对不同电影（或产品）的评分。有些用户对喜欢的电影进行了评分，但表格中许多单元格是空的，因为用户并未观看或评分所有电影。\n\
  \n目标如下：\n\n- ALS 应该通过预测帮助我们填充这些空单元格。\n- 我们想找到两个特殊矩阵——一个用于用户（我们称之为 U），另一个用于电影（我们称之为\
  \ P）。\n- 当我们将这些矩阵相乘时，应该得到原始用户-电影评分的估计值。\n\n#### ALS 的工作流程\n\nALS 算法的工作原理如下。ALS 轮流改进\
  \ U 和 P。\n\n- 1. 首先，它固定 U 并调整 P 以最小化预测误差。\n- 2. 然后，它固定 P 并调整 U 以进行更好的预测。\n- 3. 它不断交替，直到为\
  \ U 和 P 都找到良好的估计值。\n\n让我们借助一个示例来了解这一点。假设我们想预测用户 1 会如何为电影 B 评分：\n\n- 1. 我们从 U 和 P\
  \ 中的随机值开始（例如猜测）。\n- 2. ALS 根据现有评分调整这些值。\n- 3. 例如，如果用户 1 喜欢电影 A（并给了它 5 分），我们调整 U\
  \ 和 P 以匹配这一点。\n- 4. 我们重复此过程，改进估计值直到收敛。\n\n#### 使用“最小二乘法”使 ALS 模型收敛的优点\n\n- ALS 旨在最小化预测评分与实际评分之间的差异。\n\
  - 这就像拼凑拼图碎片以获得最佳匹配。\n- “最小二乘法”部分意味着通过最小化误差来找到最佳匹配。\n\n#### 推荐系统中的关键问题和挑战\n\n在使用推荐系统时，我们可能会遇到两种类型的问题：\n\
  \n- **冷启动问题**：冷启动问题出现在新用户或项目缺乏足够数据用于建档时。\n- **数据稀疏性**：当有许多用户和项目，但只有小部分进行交互时，就会出现数据稀疏性。\n\
  \n这两种挑战都会影响推荐准确性。让我们在不同推荐方法的背景下详细探讨它们，以更好地理解这一点。\n\n\n\n\n\n##### 冷启动\n\n冷启动在推荐系统中是指当新系统缺乏用户或物品的足够交互历史时所面临的挑战。在数据不足的情况下，进行准确预测变得困难，影响推荐质量和效率。以下是一些克服与冷启动问题相关的挑战的技术：\n\
  \n- **基于内容的推荐：**\n  - 对于新物品（冷启动物品），利用其内容特征\n  - 分析物品属性（例如，类型、关键词和描述）以推荐相似物品\n  -\
  \ 当物品特征定义明确时，基于内容的方法效果良好\n\n- **基于流行度的推荐：**\n  - 最初，向新用户推荐热门物品\n  - 基于流行度的推荐作为基准，直到可用个性化数据\n\
  \  - 例如，推荐热门电影或畅销书\n\n- **混合方法：**\n  - 结合基于内容和协同过滤技术\n  - 对冷启动物品使用内容特征，对现有物品使用协同过滤\n\
  \  - 混合模型平衡准确性和多样性\n\n- **人口统计信息：**\n  - 收集用户人口统计数据（年龄、性别和位置）\n  - 使用此人口统计信息进行初始推荐\n\
  \  - 随着用户交互增多，切换到个性化推荐\n\n- **勘探与开发：**\n  - 为新用户/物品采用勘探策略\n  - 显示多样化推荐以了解用户偏好\n\
  \  - 逐渐转向开发（个性化推荐）\n\n- **隐式反馈：**\n  - 对冷启动用户使用隐式反馈（点击和浏览）\n  - 分析隐式交互中的模式以推断偏好\n\
  \  - 即使在显式评分稀疏时，隐式反馈也有帮助\n\n- **主动学习：**\n  - 在冷启动阶段提示用户提供反馈\n  - 请他们对少量物品进行评分或表明偏好\n\
  \  - 使用此反馈引导推荐过程\n\n- **上下文信息：**\n  - 考虑上下文因素（时间、位置和设备）\n  - 感知上下文的推荐适应用户情况\n  -\
  \ 例如，根据位置推荐附近的餐馆\n\n- **预热期：**\n  - 对新用户延迟个性化推荐\n  - 允许一个预热期，让用户探索系统\n  - 逐渐过渡到个性化建议\n\
  \n- **用户引导：**\n  - 指导新用户使用系统\n  - 解释推荐工作原理并鼓励交互\n  - 提供工具提示或教程\n\n##### 数据稀疏性\n\n\
  数据稀疏性发生在事务或反馈数据稀疏时，使得识别邻居变得困难。例如，新产品通常只有很少的用户评论。这一限制影响了推荐质量和推荐系统中协同过滤的有效性。以下是一些克服与数据稀疏性问题相关的挑战的技术：\n\
  \n- **基于内容的推荐：**\n  - 利用物品内容特征（例如，类型、关键词和描述）\n  - 推荐与具有已知内容特征的物品相似的物品\n  - 基于内容的方法适用于新物品或评分稀疏的物品\n\
  \n- **基于流行度的推荐：**\n  - 最初，向所有用户推荐热门物品\n  - 基于流行度的建议作为基准\n  - 随着更多数据积累，逐渐过渡到个性化推荐\n\
  \n- **混合方法：**\n  - 将协同过滤（用户-物品交互）与基于内容的方法相结合\n  - 对现有用户/物品使用协同过滤，对新物品使用基于内容的过滤\n\
  \  - 混合模型平衡准确性和多样性\n\n- **矩阵分解技术：**\n  - ALS 等技术对用户-物品交互矩阵进行分解\n  - 这些方法通过从可用数据学习隐含因子来处理稀疏性\n\
  \  - 正则化有助于防止过拟合\n\n- **隐式反馈处理：**\n  - 隐式反馈（点击和浏览）对稀疏数据很有价值\n  - 根据置信度对交互进行加权（例如，更多点击意味着更强的偏好）\n\
  \  - 使用隐式反馈推断用户偏好\n\n- **用户和物品嵌入：**\n  - 为用户和物品学习稠密表示（嵌入）\n  - 嵌入捕获隐含特征并处理稀疏性\n\
  \  - 基于神经网络的模型（例如，Word2Vec 和 item2vec）能有效地学习嵌入\n\n- **辅助信息：**\n  - 引入额外数据源（即，辅助信息）\n\
  \  - 用户人口统计、社交关系或上下文可以增强推荐\n  - 例如，考虑用户位置或交互时间\n\n- **主动学习：**\n  - 鼓励用户提供反馈\n  -\
  \ 提示他们对物品进行评分或表明偏好\n  - 使用此反馈改进推荐\n\n- **时间动态：**\n  - 考虑用户偏好如何随时间变化\n  - 衰减旧交互以给近期交互更高权重\n\
  \  - 感知时间的模型能适应不断变化的偏好\n\n- **迁移学习：**\n  - 从相关领域迁移知识\n  - 如果一个领域的数据稀疏，则利用另一个领域的信息\n\
  \  - 跨领域推荐增强覆盖范围\n\n既然我们了解了与推荐相关的问题和挑战，让我们探索改进推荐的不同方法。\n\n#### 改进推荐质量\n\n像任何其他机器学习算法一样，推荐算法也会遇到性能问题。然而，有几种技术可以改进推荐质量。让我们逐一看看这些技术：\n\
  \n- **超参数调优：**\n  - 为 ALS 模型尝试不同的超参数\n  - 关键超参数包括 `rank`（隐含因子数量）、`maxIter`（迭代次数）和\
  \ `regParam`（正则化参数）\n  - 使用网格搜索或随机搜索等技术寻找最优值\n\n- **特征工程：**\n  - 除用户-物品交互外，加入额外特征（例如，考虑用户人口统计、交互时间或上下文信息）\n\
  \  - 特征工程可以显著提升模型性能\n\n- **隐式反馈处理：**\n  - ALS 常用于隐式反馈数据（例如，点击和浏览）\n  - 调整模型以有效处理隐式反馈\n\
  \  - 探索对交互进行加权或使用置信度分数等技术\n\n- **冷启动策略：**\n  - 解决新用户或物品的冷启动问题\n  - 在有足够交互可用之前，使用基于内容的推荐或混合方法\n\
  \n- **集成方法：**\n  - 将 ALS 与其他推荐算法相结合\n  - 集成方法（例如，堆叠）可以增强整体性能\n\n- **正则化与过拟合：**\n\
  \  - 对模型进行正则化以防止过拟合\n  - 仔细调整正则化参数（`regParam`）\n\n- **模型评估：**\n  - 使用适当的评估指标（例如，RMSE\
  \ 和 MPR）来评估模型性能\n  - 比较 ALS 变体并选择表现最好的一个\n\n现在，是时候评估推荐质量了。\n\n#### 评估推荐\n\n排序算法，也称为推荐系统，旨在根据特定训练数据为用户提供一组相关物品或文档。相关性的定义可能因应用而异。排序系统的指标旨在衡量这些推荐在不同情境下的有效性。有些指标将推荐文档与预定义的相关文档集进行比较，而其他指标可以使用数值评分。\n\
  \n\n\n\n\n下表列出了用于评估推荐的一些常用指标：\n\n| 指标 | 定义 |\n| --- | --- |\n| 在 _k_ 处的精确率 | 在 _k_\
  \ 处的精确率是用于评估推荐系统准确性的性能指标。它衡量前 _k_ 个推荐文档中与用户真正相关的文档所占比例，并对所有用户求平均值。请注意，此指标不考虑推荐的顺序。\
  \ |\n| 平均精度 (MAP) | MAP 是衡量推荐文档中有多少位于真实相关文档集合的指标，其中考虑了推荐的顺序（即，对高度相关文档的惩罚更高）。 |\n\
  | 归一化折扣累积增益 (NDCG) | 在 _k_ 处的 NDCG 是一种用于衡量推荐文档相对于真实相关文档相关性的指标。它计算前 _k_ 个推荐文档中相关文档所占的百分比，并考虑推荐的顺序。这意味着文档被假设按相关性递减的顺序排列。与在\
  \ _k_ 处的精确率不同，在 _k_ 处的 NDCG 在评估推荐质量时会考虑推荐的顺序。 |\n\n##### 表 7.1 – 评估推荐系统所用指标概览\n\n\
  学习如何评估推荐后，我们将现在构建一个推荐系统。\n\n#### 使用 Apache Spark 构建推荐系统\n\n让我们通过一个代码示例来构建推荐系统。\n\
  \n以下代码段导入所有必需的库并创建 Spark 会话：\n\n```\nfrom pyspark.sql import SparkSession\nfrom\
  \ pyspark.ml.recommendation import ALS\nfrom pyspark.ml.evaluation import RegressionEvaluator\n\
  ##### Create a Spark session\nspark = SparkSession.builder\\\n    .appName(\"AmazonProductRecommendation\"\
  )\\\n    .getOrCreate()\nspark.sparkContext.setLogLevel(\"ERROR\")\n```\n\n然后，我们将数据加载到\
  \ DataFrame 中并将其作为输出显示：\n\n```\ndf = spark.read.format('csv')\\\n    .option('header',\
  \ 'true')\\\n    .option('inferSchema', 'true')\\\n    .option('timestamp', 'true')\\\
  \n    .load('s3a://test234/ratings.csv')\n##### Prepare the data (assuming you have\
  \ columns: 'user', 'item', 'rating')\ndf = df.withColumnRenamed('userId', 'user')\\\
  \n    .withColumnRenamed('movieId', 'item')\\\n    .withColumnRenamed('rating',\
  \ 'rating')\ndf.limit(6).toPandas()\n```\n\n以下是输出：\n\n| userid | movieId | rating\
  \ | timestamp |\n|---|---|---|---|\n| 1 | 1 | 4.0 | 964982703 |\n| 1 | 3 | 4.0 |\
  \ 964981247 |\n| 1 | 6 | 4.0 | 964982224 |\n| 1 | 47 | 5.0 | 964983815 |\n| 1 |\
  \ 50 | 5.0 | 964982931 |\n| 1 | 70 | 3.0 | 964982400 |\n\n图 7.6 – 示例推荐数据集\n\n下一个代码段通过将数据拟合到模型来创建\
  \ ALS：\n\n```\nals = ALS(\n    rank=10, maxIter=10, regParam=0.1, userCol='user',\n\
  \    itemCol='item', ratingCol='rating')\nmodel = als.fit(df)\n```\n\n以下代码段通过评估指标评估模型性能：\n\
  \n```\nevaluator = RegressionEvaluator(metricName=\"rmse\",\n    labelCol=\"rating\"\
  , predictionCol=\"prediction\")\npredictions = model.transform(df)\nrmse = evaluator.evaluate(predictions)\n\
  print(f\"Root Mean Squared Error (RMSE): {rmse}\")\n```\n\n以下代码段为所有用户运行推荐。它显示推荐输出：\n\
  \n```\n##### Make recommendations for users (for example, user 0)\nuser_recs = model.recommendForAllUsers(5)\n\
  user_0_recs = user_recs.where(user_recs.user == 24) \\\n    .select(\n        \"\
  recommendations.item\",\n        \"recommendations.rating\"\n    ).collect()\nprint(f\"\
  Recommendations for user 24: {user_0_recs}\")\n```\n\n我们将获得以下结果：\n\n均方根误差 (RMSE):\
  \ 0.5933279277739512\n用户 24 的推荐: [Row(item=[944, 3397, 171495, 74282, 7121], rating=[4.727833271026611,\
  \ 4.6474504470825195, 4.552536265353965, 4.4093074798583958, 4.3880014419555661])]\n\
  \n图 7.7 – 推荐评估指标输出\n\n这结束了我们构建推荐系统的代码示例演练。\n\n## 总结\n\n在本章中，我们探索了推荐系统的复杂世界，揭示了使个性化推荐成为可能的技术和方法论。我们从推荐系统的概述开始，强调了它们在当今数字经济中的重要性。从提升用户参与度到推动收入增长，这些系统的影响在包括电子商务和流媒体服务在内的各个行业中都非常深远。\n\
  \n我们深入探讨了推荐系统的类型，区分了基于内容的、协同过滤和混合方法。每种方法都有其独特的优势和挑战，理解这些有助于设计最适合特定需求的系统。\n\n本章还讨论了推荐系统面临的关键问题，例如冷启动问题、数据稀疏性和可扩展性。这些挑战对于确保推荐系统的有效性和效率至关重要，尤其是在它们规模扩大以处理海量数据时。\n\
  \n接着，我们转向实际方面，讨论如何使用 Apache Spark 构建推荐模型。通过利用 Spark 的 MLlib 和矩阵分解技术，我们可以实现既强健又可扩展的协同过滤算法。使用诸如准确率和精确率等指标评估模型性能，可确保所提供的推荐对用户来说既可靠又有价值。\n\
  \n在本章中，您深入了解了构建推荐系统的基础概念和高级技术。您现在具备设计、实现和评估有效推荐模型的技能，这些模型可以显著提升用户体验和业务成果。\n\n在下一章中，我们将了解更多关于频繁模式挖掘的内容。\n"
- "## 挖掘频繁模式\n\n频繁模式挖掘是数据挖掘中的一项关键任务。其目标是识别数据集中重复出现的关联或关系。这些模式可能表示经常一起出现的项目、序列或子结构。通过检测频繁模式，我们可以深入了解相关项目并发现隐藏的规律。例如，在市场篮分析中，频繁模式揭示了客户经常一起购买哪些产品。理解这些模式有助于个性化推荐、异常检测和预测建模。频繁模式在从大型数据集中提取有意义的知识、指导决策以及增强各领域各种应用方面发挥着关键作用。\n\
  \n在本章中，我们将涵盖以下主要主题：\n\n- 频繁模式的基本概念及发现模式和规则的重要性\n- 频繁模式挖掘的应用和案例研究\n- 频繁模式挖掘中的关键挑战\n\
  - 频繁模式挖掘算法\n- 使用可扩展的频繁模式挖掘算法开发模型\n\n本章结束时，您将扎实掌握使用 Apache Spark 挖掘频繁模式所需的技能。\n\n\
  ### 技术要求\n\n您可以在 GitHub 上找到本章的代码文件，网址为 https://github.com/PacktPublishing/Apache-Spark-for-Machine-Learning/tree/main/Chapter08。\n\
  \n### 频繁模式的基本概念及发现模式和规则的重要性\n\n频繁模式挖掘 (FPM) 是数据挖掘中的一项关键任务，涉及识别数据集中频繁出现的模式或项集。这些模式有助于在各个领域（如市场篮分析、Web\
  \ 挖掘、生物信息学和网络安全）中发现大型数据集之间的关联、相关性和结构。\n\nFPM 是数据分析的强大工具，能够发现大型数据集中不易察觉的隐藏关系。其应用涵盖众多领域，帮助企业和研究人员从海量数据中提取有价值的洞察。\n\
  \n让我们借助下图了解市场篮分析的可视化。每个购物车中的每个方框都代表一件购买的商品。\n\n![](img/b40816015a9835648eac2b186dac82d1_248_0.png)\n\
  \n图 8.1 – 购物车概览，每个购物车中都装有不同的商品\n\n在这个图中，有三个购物车，里面装满了从杂货店购买的各种商品。每个商品都由购物车中的一个方框表示。检查三个购物车中的所有商品后，可以明显看出商品\
  \ A、Q 和 G 都出现在所有三个购物车中。这表明商品 A、Q 和 G 经常一起购买。基于此模式，如果有人购买商品 A 和 Q，则系统会推荐他们也购买商品 G。\n\
  \n\n\n\n\n频繁模式挖掘的关键概念包括以下内容：\n\n- **项集**：项集是一个或多个项的集合。例如，在超市场景下，一个项集可能是 {牛奶, 面包,\
  \ 黄油}。\n\n- **支持度**：项集的支持度是指数据集中包含该项集的事务所占的比例或频率。它衡量项集在给定数据中的流行程度或常见程度。例如，如果 1,000\
  \ 个事务中有 100 个包含 {牛奶, 面包}，那么 {牛奶, 面包} 项集的支持度为 10%。\n\n- **频繁项集**：如果一个项集的支持度大于或等于用户指定的支持度阈值，则该项集被视为频繁项集。该阈值通常根据应用程序的具体要求设置。\n\
  \n- **关联规则**：这些是形式为 X => Y 的蕴含式，其中 X 和 Y 是项集。该规则表示，每当 X 项集出现时，Y 项集很可能出现在某个事务中。关联规则的两个关键指标如下：\n\
  \n  - **置信度**：衡量规则所做推断可靠性的指标。对于规则 X => Y，它是包含 X 的事务中同时也包含 Y 的事务所占比例。\n\n  - **提升度**：提升度值衡量\
  \ X 和 Y 同时出现的频率比它们在统计独立时预期的频率高出多少。提升度值大于 1 表示 X 和 Y 同时出现的频率高于预期，表明存在正相关关系。\n\n在本节中，我们了解了\
  \ FPM 的关键概念。在下一节中，我们将介绍 FPM 算法。\n\n### 频繁模式挖掘的应用与案例研究\n\nFPM 是数据分析中的关键技术，有助于在大型数据集中发现隐藏的结构。它在各个行业都有广泛应用，可增强决策和策略制定。以下是\
  \ FPM 的主要应用：\n\n- **洞察客户行为**：在零售和电子商务中，分析交易数据以识别经常一起购买的商品，有助于企业了解客户的购买习惯。这些知识使公司能够优化其营销策略，例如通过定向广告、个性化推荐、交叉销售和追加销售。例如，如果面包和黄油经常一起购买，商店可能会将这些商品放在彼此附近以增加两者的销量。\n\
  \n- **改进商品摆放和店铺布局**：发现频繁项集有助于零售商通过将经常一起购买的商品放在彼此附近来设计更好的店铺布局。这不仅通过让购物更加便捷来提高客户满意度，还增加了冲动购买的机会，从而促进销售。\n\
  \n- **库存管理**：通过了解哪些商品经常一起购买，企业可以更有效地管理库存水平，确保热门商品库存充足且摆放位置得当。这减少了缺货和积压的情况，从而实现更高效的运营并降低成本。\n\
  \n- **制定有效的促销和折扣**：关联规则可以帮助企业开发捆绑优惠或对经常一起购买的商品提供折扣。这可以吸引更多客户并鼓励他们购买比原计划更多的商品。有效的促销直接影响销售量和客户留存率。\n\
  \n- **市场篮子分析**：这或许是 FPM 最经典的应用。它涉及分析客户交易数据，以找到经常一起购买的商品模式。零售商利用这些信息进行商品摆放、促销和交叉销售策略，优化商店和在线平台的布局以增加销售。\n\
  \n- **推荐系统**：FPM 是为电子商务网站、流媒体服务和内容提供商构建高效且准确的推荐系统的基础。通过分析用户行为模式，这些系统可以推荐用户可能喜欢的产品、电影或音乐，从而提高用户参与度和满意度。\n\
  \n- **医疗保健**：在医疗保健领域，模式挖掘可用于识别患者群体中出现的常见症状、诊断和治疗序列。这有助于预测疾病爆发、了解疾病共病情况，并提高诊断工具的准确性。\n\
  \n- **欺诈检测与安全**：银行和金融机构利用 FPM 检测可能表明欺诈活动的异常行为模式。这可能涉及识别偏离常态的不常见交易组合、账户活动或索赔。\n\n\
  - **制造业**：在制造业中，模式挖掘可帮助识别机器使用的频繁序列或系统故障的常见模式。这些信息对于预测性维护、质量控制以及优化生产流程以减少停机时间和提高效率至关重要。\n\
  \n- **Web 使用挖掘**：模式挖掘技术用于分析用户在网站上的导航模式。这可以帮助 Web 设计师优化网站架构、增强用户界面，并通过了解网站上最常访问的路径来创建更直观的用户体验。\n\
  \n- **生物信息学**：模式挖掘在生物信息学中用于基因序列分析和蛋白质结构预测。它有助于识别常见的序列或结构，这对于理解基因功能、进化生物学和疾病机制至关重要。\n\
  \n- **电信业**：在电信行业，FPM 用于了解通话记录、使用数据和服务故障中的常见模式。获得的洞察可为客户服务改进、网络维护以及使用模式中的欺诈检测提供信息。\n\
  \n- **客户关系管理 (CRM)**：CRM 系统利用模式挖掘分析客户数据和交互历史，以改进客户服务、个性化营销工作，并通过预测客户行为和偏好来增强客户保留策略。\n\
  \n- **供应链管理**：模式挖掘有助于识别供应链数据中的频繁模式，例如物流活动的常见序列或常规中断。这种理解可以带来更稳健的供应链设计、更好的库存管理和优化的物流。\n\
  \n这些应用展示了 FPM 在不同领域的多功能性和价值。通过提取和分析重复出现的模式，组织可以获得可操作的洞察，预见未来趋势，优化运营，并提供增强的服务或产品以满足用户需求。\n\
  \nFPM 是数据挖掘中的关键技术，已应用于众多领域，展示了其在从大型数据集中提取有用模式方面的多功能性和有效性。以下是一些展示 FPM 应用的最受欢迎的案例研究：\n\
  \n- **沃尔玛 – 市场篮子分析**：最经典的例子之一是沃尔玛利用市场篮子分析来优化其商品摆放和促销策略。通过分析交易数据，沃尔玛可以识别经常一起购买的商品，并相应调整其商店布局。这不仅通过让常购商品更容易获取来改善客户购物体验，还增加了交叉销售机会。\n\
  \n- **亚马逊 – 推荐系统**：亚马逊的推荐引擎使用物品对物品协同过滤，这可以被视为 FPM 的一种应用。该系统分析用户与产品交互的模式来推荐相似商品。这是亚马逊通过个性化推荐增加客户购买的关键驱动力。\n\
  \n- **Netflix – 流媒体内容推荐**：Netflix 使用包含 FPM 的复杂算法，根据用户的观看历史和相似用户的观看模式来推荐电影和电视节目。这种方法显著提高了用户参与度和满意度，使\
  \ Netflix 成为流媒体行业的领导者。\n\n- **塔吉特 – 预测客户习惯**：塔吉特著名地使用了 FPM 和预测分析来预测客户购买，包括基于购买模式预测怀孕等敏感案例。通过识别购买数据中的频繁模式，塔吉特能够在最合适的时机向客户发送定制的优惠券和广告。\n\
  \n- **美国银行 – 欺诈检测**：美国银行等金融机构使用 FPM 检测交易数据中可能表明欺诈的异常模式。通过识别合法交易的常见模式，系统可以标记与这些模式显著偏离的交易，从而增强安全措施。\n\
  \n- **医疗保健 – 疾病爆发预测**：公共卫生组织使用模式挖掘分析医疗保健数据中的模式，例如症状或地理信息，以预测疾病爆发。例如，分析患者就诊和报告症状中的频繁模式，有助于早期识别和控制流感或\
  \ COVID-19 等爆发。\n\n\n\n\n\n- eBay – Web 使用挖掘：eBay 使用 Web 使用挖掘来分析用户在其网站上的常见导航模式。从这些模式中获得的见解有助于改进网站设计、提升用户体验，并优化广告和促销的投放位置。\n\
  \n- Google – 搜索引擎优化：Google 使用模式挖掘技术，基于搜索查询和浏览历史记录来了解用户行为和偏好。这些信息有助于改进搜索算法，并提高搜索结果和广告的相关性。\n\
  \n- Spotify – 音乐推荐：Spotify 使用模式挖掘来分析用户的听歌习惯和音乐曲目的属性，以推荐用户可能喜欢的歌曲和艺术家。这不仅能让用户保持活跃，还能帮助新兴艺术家更容易被发现。\n\
  \n- LinkedIn – 专业人脉推荐：LinkedIn 利用模式挖掘，根据用户的职业经历、网络内的互动以及相似用户中观察到的模式，为用户推荐专业人脉和工作机会。\n\
  \n这些案例研究突显了 FPM 在广泛行业中推导可操作见解、提升用户体验、优化运营并推动战略决策方面的广泛适用性和有效性。\n\n在下一节中，我们将探讨 FPM\
  \ 面临的挑战。\n\n### 频繁模式挖掘的主要挑战\n\nFPM 是发现大数据集中关系和结构的强大工具。然而，由于数据复杂性、可扩展性和算法效率等几个固有问题，有效实现它可能面临挑战。以下是\
  \ FPM 中的一些主要挑战：\n\n- 可扩展性与效率：FPM 中最重大的挑战之一是管理随数据规模增长而呈指数级增长的候选项集。项目的潜在组合数量随项目数量呈指数级增长，使挖掘过程在计算上昂贵且耗时。例如\
  \ Apriori 等算法会生成大量候选集并逐一检查频率，在大数据集上可能变得低效。\n\n- 高维性：在许多现实应用中，数据集可能具有高维性，即包含大量项目或属性。这种高维性加剧了候选生成中的组合爆炸问题，并可能严重降低挖掘过程的性能。\n\
  \n- 稀疏数据：许多实际应用中的数据集（例如电子商务中的用户-项目交互数据或流媒体服务中的观看历史记录）都是稀疏的。这种稀疏性意味着许多项集不常出现，使得在海量可能的项目组合中识别有意义模式的任务变得复杂。\n\
  \n- 噪声和错误数据：噪声和错误等数据质量问题会显著影响 FPM 的结果。噪声可能导致误导性关联和无关模式，这些模式可能因其频率而在统计上显著，但在实践中并不有意义。\n\
  \n- 处理支持困境：确定将模式视为“频繁”的适当支持阈值（即最小频率）是一项非平凡的任务。阈值过高可能会错过有趣的模式，而阈值过低可能会产生大量模式，其中许多可能不有趣或无关。平衡这一点以在不淹没于噪声的情况下找到最具洞察力的模式是一项重大挑战。\n\
  \n- 融入领域知识：在许多情况下，领域知识对于解释挖掘发现的模式至关重要。将此知识融入挖掘过程以优先处理更相关的模式或指导探索可能很复杂，但通常对于获得可操作的见解是必要的。\n\
  \n- 模式评估与解释：即使在高效挖掘频繁项集之后，评估哪些模式真正有趣或有用仍然是一项挑战。“趣味性”的主观性以及模式的特定语境解释意味着通常需要额外的标准和后处理。\n\
  \n- 动态和不断发展的数据：在许多现代应用中，数据不是静态的，而是在不断演变。将 FPM 算法调整为适用于流式数据（其中旧模式可能变得无关紧要，新模式可能迅速出现），这带来了额外的挑战。\n\
  \n- 隐私问题：挖掘数据以发现模式可能引发隐私问题，尤其是在处理敏感个人数据时。确保挖掘过程符合隐私法规且不泄露个人用户信息变得越来越重要且具有挑战性。\n\n\
  - 与决策支持系统集成：最后，将 FPM 结果以决策者或最终用户易于使用和解释的方式集成到决策支持系统中并非易事。挖掘模式在实际应用中的可用性对于其实现最终价值至关重要。\n\
  \n应对这些挑战需要精巧的算法设计、周密的规划，以及通常结合多种技术和考量，以确保 FPM 在实际场景中既可行又有效。\n\n### 频繁模式挖掘算法\n\n\
  已开发出多种算法，能够在大数据集中高效发现频繁项集和关联规则。不过，Apache Spark 提供了两种算法，我们将在下文中讨论。\n\n#### FP-Growth\n\
  \nFP-Growth（即“频繁模式增长”）是一种用于在大数据集中发现频繁模式、关联和关系的强大数据挖掘技术。与也用于 FPM 的 Apriori 算法不同，FP-Growth\
  \ 只需对事务数据集进行两次扫描，因此效率更高。它还不需要在频繁项集生成过程中生成候选集，从而节省计算资源和时间。\n\nApache Spark 中的 FP-Growth\
  \ 算法有几个有价值的用例。让我们来了解前三个：\n\n- **市场篮分析**：FP-Growth 广泛用于市场篮分析：\n  - **目标**：发现经常一起购买的项目之间的关联\n\
  \  - **示例**：如果客户购买花生酱，他们很可能也会购买果冻\n  - **FP-Growth 的作用：**\n    - 它可以高效地识别频繁项集，而无需生成候选集（与\
  \ Apriori 算法不同）\n    - 它创建 FP-Tree 数据结构来表示项目共现\n\n- **推荐系统**：FP-Growth 在构建推荐引擎方面发挥着关键作用：\n\
  \  - **目标**：为用户提供个性化推荐\n  - **示例**：根据用户的购买记录推荐相关产品\n  - **FP-Growth 的作用：**\n   \
  \ - 它分析事务数据以查找模式\n    - 它为项目推荐生成关联规则\n\n- **异常检测和欺诈检测**：FP-Growth 可适配用于异常检测：\n \
  \ - **目标**：识别异常模式或离群值\n  - **示例**：检测欺诈性信用卡交易\n  - **FP-Growth 的作用：**\n    - 找到偏离正常行为的不频繁项集\n\
  \    - 项目的不寻常组合可能表明存在异常\n\n#### PrefixSpan\n\nPrefixSpan 算法旨在解决序列模式挖掘问题，即在序列数据库中识别频繁子序列。序列模式挖掘旨在发现给定序列集合中所有频繁子序列（模式）。频繁子序列是指出现频率不低于用户指定的最小支持阈值的子序列。由于可能的子序列模式数量庞大，此任务具有挑战性。以往方法通常遵循类似\
  \ Apriori 的方法，旨在减少要检查的组合数量，但仍面临大型数据库或大量/长模式的挑战。\n\nApache Spark 中的 PrefixSpan 算法是挖掘频繁序列模式的强大工具。让我们来了解其主要用例：\n\
  \n- **序列模式挖掘：**\n  - **目标**：在按时间排序的数据集中发现事件或动作的频繁序列\n  - **示例**：分析点击流数据以查找网站上的常见导航路径\n\
  \  - **PrefixSpan 的作用：**\n    - PrefixSpan 通过投影序列前缀高效识别序列模式\n    - 它避免显式生成候选集，因此更具可扩展性\n\
  \    - 它适用于推荐系统、流程优化和行为分析\n\n- **会话分析和个性化：**\n  - **目标**：了解会话期间（例如网站访问或应用使用）的用户行为\n\
  \  - **示例**：根据用户最近的互动推荐相关产品\n  - **PrefixSpan 的作用：**\n    - 它识别会话内频繁的动作序列\n    -\
  \ 它通过捕获用户偏好实现个性化推荐\n    - 它有助于根据最近的行为定制内容或优惠\n\n- **医疗保健和医学研究：**\n  - **目标**：分析患者数据以发现反复出现的医疗模式\n\
  \  - **示例**：识别常见的症状序列或治疗路径\n  - **PrefixSpan 的作用：**\n    - 从患者记录中挖掘频繁序列\n    - 有助于疾病诊断、治疗规划和流行病学研究\n\
  \n### FPM 的代码示例\n\n让我们回顾一下使用这两种讨论过的算法的代码示例。\n\n\n\n\n\n#### 使用 FP-Growth 算法\n\n\
  让我们想象一个业务用例，涉及通过分析事务数据来了解哪些产品经常被一起购买，以确定商品之间的关联。例如，如果顾客经常一起购买薯片和莎莎酱，零售商可以战略性地将这些物品放在彼此附近以鼓励额外销售。使用频繁模式，我们可以根据过去的购买推荐相关产品（交叉销售），并创建产品捆绑包（例如，“买此商品获赠此商品”或“购买此商品可享受另一件商品的折扣”）以增加销售额。\n\
  \n以下代码段导入所有必需的库并创建 Spark 会话：\n\n```\nfrom pyspark.sql.functions import monotonically_increasing_id\n\
  ##### Create a Spark session\nspark = SparkSession.builder.appName(\n    \"NewsgroupsPreprocessing\"\
  \n).getOrCreate()\nspark.sparkContext.setLogLevel(\"ERROR\")\n```\n\n以下代码段加载数据集并显示\
  \ DataFrame 输出：\n\n```\nstore_data = spark.read.format('csv')\\\n  .option('header',\
  \ 'true')\\\n  .option('inferSchema', 'true')\\\n  .option('timestamp', 'true')\\\
  \n  .load('s3a://test234/store_data.csv')\nstore_data = store_data.withColumn(\n\
  \    \"id\", monotonically_increasing_id()\n)\nstore_data.limit(5).toPandas()\n\
  ```\n\n以下是输出：\n\n| | _c0 | _c1 | _c2 | _c3 | _c4 | _c5 | _c6 | _c7 | _c8 | _c9 |\
  \ _c10 | _c11 | _c12 | _c13 | _c14 | _c15 | _c16 |\n|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|\n\
  | 0 | 虾仁 | 杏仁 | 牛油果 | 蔬菜 | 绿色混合菜 | 青葡萄 | 全麦面粉 | 山药 | 乳清干酪 | 能量饮料 | 番茄汁 | 低脂酸奶 |\
  \ 绿茶 | 蜂蜜 | 沙拉 | 矿泉水 | 三文鱼 |\n| 1 | 汉堡包 | 肉丸 | 鸡蛋 | None | None | None | None |\
  \ None | None | None | None | None | None | None | None | None | None |\n| 2 | 酱泥\
  \ | None | None | None | None | None | None | None | None | None | None | None |\
  \ None | None | None | None | None |\n| 3 | 火鸡 | 牛油果 | None | None | None | None\
  \ | None | None | None | None | None | None | None | None | None | None | None |\n\
  | 4 | 矿泉水 | 牛奶 | 能量棒 | 全麦米 | 绿茶 | None | None | None | None | None | None | None\
  \ | None | None | None | None | None |\n\n图 8.2 – 通过 DataFrame 输出的数据集\n\n以下代码段预处理数据以对齐数据结构：\n\
  \n```\nfrom pyspark.sql.functions import array,array_except,array_distinct\nstore_data\
  \ = store_data.select(\n    array(\n        store_data._c0, store_data._c1, store_data._c2,\n\
  \        store_data._c3, store_data._c4, store_data._c5,\n        store_data._c6,\
  \ store_data._c7, store_data._c8,\n        store_data._c9, store_data._c10, store_data._c11,\n\
  \        store_data._c12, store_data._c13, store_data._c14,\n        store_data._c15,\
  \ store_data._c16, store_data._c17,\n        store_data._c18, store_data._c19\n\
  \    ).alias(\"basket\"))\nstore_data.show(5,truncate=True)\n```\n\n让我们看看生成的输出：\n\
  \n![](img/b40816015a9835648eac2b186dac82d1_257_0.png)\n\n图 8.3 – 预处理后的数据输出\n\n接下来，代码为\
  \ FP-Growth 算法设置参数。然后将数据拟合以生成模型。它显示频繁项集和关联规则：\n\n```\nfrom pyspark.sql import SparkSession\n\
  from pyspark.ml.fpm import FPGrowth\n##### Initialize the FP-Growth model\nfp_growth\
  \ = FPGrowth(\n    itemsCol=\"basket\", minSupport=0.05, minConfidence=0.2)\n#####\
  \ Fit the model to the transactions\nmodel = fp_growth.fit(store_data)\n##### Get\
  \ frequent itemsets\nfrequent_itemsets = model.freqItemsets\n##### Show the frequent\
  \ itemsets\nfrequent_itemsets.show()\n##### Get association rules\nassociation_rules\
  \ = model.associationRules\n##### Show the association rules\nassociation_rules.show()\n\
  ```\n\n此处显示经常购买的商品的输出：\n\n| 项目集 | 频率 |\n|---|---|\n| [碎奶酪] | 393 |\n| [碎奶酪, NULL]\
  \ | 393 |\n| [绞肉] | 737 |\n| [绞肉, NULL] | 737 |\n| [西红柿] | 513 |\n\n仅显示前 5 行\n图\
  \ 8.4 – 显示经常购买商品的表格\n\n以下输出通过显示每个项目的置信度、提升度和支持度来显示关联规则：\n\n| 前件 | 后件 | 置信度 | 提升度\
  \ | 支持度 |\n|---|---|---|---|---|\n| [牛奶] | [null] | 1.0 | 1.0001333333333333333\
  \ | 0.12958272230369283 |\n| [冷冻蔬菜] | [null] | 1.0 | 1.0001333333333333333 | 0.09532062391681109\
  \ |\n| [汤] | [null] | 1.0 | 1.0001333333333333333 | 0.05052659645380616 |\n| [全麦米]\
  \ | [null] | 1.0 | 1.0001333333333333333 | 0.058525529929342755 |\n| [碎奶酪] | [null]\
  \ | 1.0 | 1.0001333333333333333 | 0.0525329929342755 |\n| [松饼] | [null] | 1.0 |\
  \ 1.0001333333333333333 | 0.09505599280095987 |\n\n图 8.5 – 显示关联规则的表格\n\n这完成了我们使用\
  \ FPGrowth 算法的 FPM 代码演练。\n\n#### 使用 PrefixSpan 算法\n\n让我们想象一个业务用例，涉及通过分析客户倾向于同时和按序购买的产品，来识别经常按顺序一起购买的产品。这种知识有助于定制营销工作并改进推荐系统。\n\
  \n让我们演练一下代码示例。以下代码段导入所有必需的库并创建 Spark 会话：\n\n```\nfrom pyspark.sql import SparkSession\n\
  from pyspark.sql import Row\nfrom pyspark.ml.fpm import PrefixSpan\n##### Create\
  \ a Spark session\nspark = SparkSession.builder.appName(\n    \"PrefixSpanExample\"\
  \n).getOrCreate()\n```\n\n下一个代码段创建合成数据并通过 DataFrame 显示数据：\n\n```\ndata = [\n   \
  \ Row(sequence=[[\"eggs\", \"bread\"], [\"apple\"]]),\n    Row(sequence=[[\"banana\"\
  ], [\"cheese\", \"chocolate\"], [\"eggs\", \"bread\"]]),\n    Row(sequence=[[\"\
  eggs\", \"bread\"], [\"orange\"]]),\n    Row(sequence=[[\"milk\"]])\n]\ndf = spark.createDataFrame(data)\n\
  df.show(truncate=False)\n```\n\n我们将看到以下输出：\n\n![](img/b40816015a9835648eac2b186dac82d1_259_0.png)\n\
  \n图 8.6 – 数据集输出\n\n以下代码段为 PrefixSpan 算法设置参数，以查找频繁序列模式：\n\n```\nprefixSpan = PrefixSpan()\
  \ \\\\\n    .setMinSupport(0.5) \\\\\n    .setMaxPatternLength(5) \\\\\n    .setMaxLocalProjDBSize(32000000)\n\
  result = prefixSpan.findFrequentSequentialPatterns(df) \\\\\n    .sort(\"sequence\"\
  )\nresult.show(truncate=False)\n```\n\n以下是生成的输出：\n\n![](img/b40816015a9835648eac2b186dac82d1_259_1.png)\n\
  \n图 8.7 – 频繁序列模式输出\n\n至此，我们已完成使用 PrefixSpan 算法的 FPM 代码示例演练。\n\n### 使用可扩展频繁模式挖掘算法开发模型\n\
  \n让我们想象本章前面“使用 FP-Growth 算法”部分中介绍的相同业务用例。\n\n以下代码段导入所有必需的库并创建 Spark 会话：\n\n```\n\
  import numpy as np\nimport pandas as pd\nimport matplotlib.pyplot as plt\nfrom pyspark.sql.functions\
  \ import monotonically_increasing_id\nspark = SparkSession.builder.appName(\n  \
