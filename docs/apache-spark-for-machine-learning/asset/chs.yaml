- "## 机器学习概念概述\n\n本章全面介绍了机器学习在 Apache Spark 生态系统中的集成。首先阐述了监督学习、无监督学习和强化学习等基本机器学习原理，以及它们与\
  \ Spark 分布式计算范式的相关性。您将了解用于分类、回归、聚类和推荐任务的丰富算法集。此外，本章阐述了为何使用 Spark 进行机器学习，探讨其用例和优势。它还将帮助您在本地计算机上设置\
  \ Apache Spark。\n\n本章将涵盖以下主题：\n\n- 了解机器学习\n- Apache Spark 简介\n- 为何为机器学习选择 Apache\
  \ Spark？\n- 设置 Apache Spark\n\n本章结束时，您将了解机器学习、Apache Spark 的基础知识以及如何设置它。\n\n###\
  \ 技术要求\n\n在本地计算机上运行 Apache Spark 时，通常需要以下技术要求：\n\n- **操作系统**：Apache Spark 与 Linux、macOS\
  \ 和 Windows 兼容。\n- **Java 开发工具包 (JDK)**：Apache Spark 使用 Java 实现，因此您需要安装 JDK。确保 `JAVA_HOME`\
  \ 环境变量已正确设置。\n- **Python**：如果您计划使用 PySpark（Apache Spark 的 Python API），则需要安装 Python。建议使用\
  \ Python 3.x。\n\n本章的代码文件可在 GitHub 上找到，网址为 https://github.com/PacktPublishing/Apache-Spark-for-Machine-Learning/tree/main/Chapter01。\n\
  \n### 了解机器学习\n\n我们将从机器学习的温和入门开始。机器学习 (ML) 是人工智能 (AI) 的一个分支。它专注于开发算法和技术，使计算机能够从数据中学习并随时间推移提高其在特定任务上的性能，而无需明确编程。从本质上讲，机器学习是关于从数据中提取模式和洞察，以进行预测或决策。\n\
  \n机器学习中有几个关键范式：\n\n- **监督学习**：这涉及在标记数据上训练模型，算法学习将输入数据映射到相应的输出标签。它用于分类和回归等任务。\n-\
  \ **无监督学习**：这涉及在未标记数据上训练模型，算法学习在数据中查找隐藏模式或结构。它用于聚类和降维等任务。\n- **强化学习**：这涉及通过与环境交互并以奖励或惩罚形式接收反馈，训练模型进行序贯决策。\n\
  \n机器学习算法还可根据其功能进一步分类，例如决策树、神经网络和支持向量机。\n\n机器学习的成功高度依赖于数据质量、数量和相关性。此外，特征工程、模型选择、超参数调优和评估指标等因素在开发有效的机器学习系统中起着至关重要的作用。\n\
  \n机器学习已广泛应用于医疗保健、金融、营销、自动驾驶汽车和推荐系统等多个领域。其分析大量数据、识别复杂模式并进行数据驱动预测的能力，使组织能够获得宝贵洞察、优化流程并做出明智决策，从而在当今数据驱动的世界中推动创新和变革。\n\
  \n想象您有一个婴儿，想教它识别不同的物体。这个过程类似于监督机器学习。\n\n让我们了解机器学习解决方案的流程：\n\n- **训练数据**：在机器学习中，这就像给婴儿一组玩具并告诉他每个玩具是什么。例如，您给婴儿看一个球并说：“这是一个球”，然后给他看一根骨头并说：“这是一根骨头”。\n\
  \n  在机器学习中，我们向计算机算法提供一个数据集，该数据集包含示例（例如图像的输入数据）及其对应的标签（输出或所需结果，例如狗或猫）。\n\n- **学习算法**：学习算法是婴儿的大脑。它通过观察和理解每个对象的特征来学习。\n\
  \n  在机器学习中，算法处理训练数据并学习有助于其进行预测或分类的模式和特征。\n\n- **测试与评估**：现在，您向婴儿展示他从未见过的新物体，例如足球或气球，看看他能否根据所学内容正确识别它们。\n\
  \n  在机器学习中，您在单独的数据集（测试数据）上测试训练后的算法，以评估其性能，并查看它对新的未见示例的泛化程度。\n\n- **调整与迭代**：如果婴儿犯错，您可以通过说“不，那不是球，是足球”来纠正他。婴儿会从这些纠正中学习。\n\
  \n  在机器学习中，如果算法出错，您可以调整其参数甚至其考虑的特征以提高准确性。此过程可能涉及多次迭代。\n\n- **模型部署**：一旦婴儿能持续正确识别物体，就可以说他已作为可靠的对象识别器成功“部署”。\n\
  \n  在机器学习中，当算法在测试数据上表现良好并达到所需精度时，可以将其部署以对新的现实世界数据进行预测。\n\n此示例通过将其与涉及学习和识别的熟悉场景进行类比，帮助简化机器学习的复杂过程。请记住，这是一种简化的表示，机器学习涉及各种可能更为复杂的算法、模型和技术。\n\
  \n构建机器学习模型需要三个关键要素。让我们看看这三个重要组成部分：\n\n- 数据\n- 算法\n- 硬件\n\n数据是机器学习中一个基本且关键的组件。它是机器学习模型学习模式、进行预测和获得洞察的原材料。\n\
  \n\n\n\n理解数据的特征和质量对于机器学习项目的成功至关重要。高质量、相关且具有代表性的数据对模型对新未见样本的泛化能力贡献显著。更多细节在第2章“使用Spark进行数据处理”中介绍。以下是机器学习中数据的一些关键方面：\n\
  \n- **质量数据**：质量数据是干净的、结构化的、具有代表性的、平衡的、有标签的和充足的。例如，用于图像分类的高质量数据集会包含不同物体的清晰且一致的图像，类别分布多样且平衡，每张图像都有准确的标签。高质量数据帮助ML模型有效学习并在新数据上表现良好。\n\
  \n- **低质量数据**：低质量数据包含噪声、不一致、有偏见、不平衡、缺失或重复。例如，用于情感分析的低质量数据集会包含损坏的文本数据、不完整或含有拼写错误的文本、偏颇或不具代表性的意见样本，以及每段文本缺失或错误的标签。\n\
  \n机器学习算法是数学模型或计算过程，使计算机能够从数据中学习并做出预测或决策，而无需显式编程。这些算法构成机器学习系统的核心，旨在发现数据中的模式、关系和洞察。理解不同算法的特性、优势和局限性，对于为特定机器学习任务选择最合适的算法至关重要。算法的选择取决于数据的性质、手头的问题以及可用的计算资源等因素。有关更多详细信息，请参阅本节后面的表1.1。\n\
  \n硬件在机器学习中同样发挥着至关重要的作用，影响模型训练和部署的速度、效率和规模。硬件的选择取决于机器学习任务的复杂性、数据集大小以及算法的计算要求。选择合适的硬件取决于数据集的大小、模型的复杂性以及机器学习任务的特定要求等因素。随着硬件架构和技术的不断进步，该领域持续发展。\n\
  \n### 机器学习的类型\n\n根据学习方法和训练数据的性质，机器学习大致可分为三种主要类型：\n\n- 监督学习\n- 无监督学习\n- 强化学习\n\n\
  这些类型可以进一步细分如下：\n\n- 半监督学习\n- 迁移学习\n- 集成学习\n- 深度学习\n\n我们将详细讨论每种主要类型。\n\n## 监督学习\n\
  \n在监督学习中，算法在带有标签的数据集上进行训练，输入与相应的所需标签配对。监督学习的目标是开发一个预测模型，能够准确地将输入数据映射到所需的输出标签，从而对新的未见数据进行准确的预测或分类。\n\
  \n监督学习的用例包括以下内容：\n\n- **分类**：预测电子邮件是否为垃圾邮件\n- **回归**：根据房屋特征预测房屋价格\n\n下图显示了监督模型训练及其输出的示例：\n\
  \n![](img/b40816015a9835648eac2b186dac82d1_23_0.png)\n\n图1.1 – 监督学习示例\n\n例如，如果你想对苹果和香蕉等水果进行分类，你需要一个包含苹果和香蕉图像的数据集，其中每张图像都有一个标签，指示它是哪种水果。随后，算法学习识别区分苹果和香蕉的特征，并能够对其从未见过的新图像预测标签。对苹果和香蕉进行监督学习的一种方法是使用**卷积神经网络（CNN）**。\n\
  \n## 无监督学习\n\n无监督学习涉及在无标签数据集上训练算法，算法必须在没有显式指导的情况下自行发现数据中的模式和关系。\n\n目标通常是识别隐藏的结构、将相似的数据点分组，或降低数据的维度。\n\
  \n无监督学习的用例包括以下内容：\n\n- **聚类**：根据客户的购买行为对客户进行分组\n- **降维**：减少数据集中的特征数量\n\nK-means\
  \ 是一种用于无监督学习的流行算法。\n\n假设你有一个数据集，包含零售店中不同类型客户的信息，但数据中不包含这些客户的任何标签或类别。你希望根据客户在购买行为、人口统计学或其他相关特征方面的相似性，将这些客户细分为不同的组，但你没有为他们预定义的类别。\n\
  \nK-means算法输出一组K个聚类，将具有相似特征的客户分组在一起。下图显示了无监督训练产生的几个聚类：\n\n![](img/b40816015a9835648eac2b186dac82d1_24_0.png)\n\
  \n在此图中，有多个数据点，每个数据点由一个小圆圈表示。具有相似特征的数据点被分组在一起，每个聚类使用不同的颜色。\n\n## 强化学习\n\n强化学习是一种机器学习类型，其中智能体通过在环境中执行动作来实现目标，从而学习如何做出决策。智能体不是通过显式指导学习，而是通过奖励和惩罚系统，从其行为的后果中学习。智能体的目标是学习一种策略，以最大化随时间推移的累积奖励。\n\
  \n强化学习的用例包括以下内容：\n\n- 游戏：训练计算机程序下棋或围棋\n- 机器人技术：教导机器人在物理世界中执行任务\n\n强化学习的一个经典示例是训练智能体下棋等游戏。在此示例中，环境是棋盘，智能体是决定下哪步棋的玩家。智能体的目标是赢得比赛。智能体最初对游戏知之甚少或一无所知。它不知道最佳走法，但通过试错来学习。每走一步后，智能体会获得奖励（好走法）或惩罚（坏走法）。在无数场比赛中，并从各种行为的结果中学习后，智能体变得精通下棋。\n\
  \n![](img/b40816015a9835648eac2b186dac82d1_25_0.png)\n\n图1.3 – 强化学习\n\n这些主要的机器学习类型还可以进一步细分为子类型和专门的方法。其他一些类别包括以下内容：\n\
  \n- **半监督学习**：结合监督学习和无监督学习的元素。模型在包含有标签和无标签示例的数据集上进行训练。\n- **迁移学习**：涉及在一项任务上训练模型，然后将所学知识应用到不同但相关的任务上。\n\
  - **集成学习**：涉及结合多个模型以提高整体性能和鲁棒性。\n- **深度学习**：利用具有多层的神经网络（深度神经网络）自动学习数据的分层表示。它是机器学习的一个子集，对于图像和语音识别等任务特别有效。\n\
  \n理解这些机器学习类型对于为给定任务或问题选择合适的方法至关重要。不同的类型可能更合适，具体取决于数据的性质、可用资源以及机器学习应用的特定目标。\n\n表1.1讨论了不同机器学习应用中使用的各种算法以及一些常见用例：\n\
  \n| 机器学习类型 | 算法示例 | 用例 |\n| --- | --- | --- |\n| 监督学习 | 线性回归<br>决策树<br>**支持向量机（SVMs）**<br>神经网络\
  \ | 图像分类<br>股票价格预测<br>垃圾邮件检测 |\n| 无监督学习 | K-means聚类<br>层次聚类<br>**主成分分析（PCA）** |\
  \ 客户细分<br>异常检测<br>降维 |\n| 强化学习 | Q学习<br>**深度Q网络（DQNs）**<br>策略梯度方法 | 游戏（例如，AlphaGo）<br>机器人技术<br>自主系统\
  \ |\n| 半监督学习 | 自训练<br>协同训练<br>多视图学习 | 文本和语音处理<br>图像识别 |\n\n\n\n\n\n| Transfer learning\
  \ | Fine-tuning pre-trained models<br>• Feature extraction<br>• Domain adaptation\
  \ | Image recognition (for example, using pre-trained CNNs)<br>• Natural Language\
  \ Processing (NLP) |\n|---|---|---|\n| Ensemble learning | Random forests<br>• Gradient\
  \ Boosting Machines (GBMs)<br>• AdaBoost | Improved classification accuracy<br>•\
  \ Robust predictions |\n| Deep learning | CNNs<br>• Recurrent Neural Networks (RNNs)<br>•\
  \ Transformer models (for example, GPT) | Image and speech recognition<br>• NLP<br>•\
  \ Deep reinforcement learning |\n\n表 1.1 – 算法及其应用场景\n\n迄今为止，我们一直专注于学习机器学习的基础知识及其一些热门算法。现在，我们将重点转移到学习Apache\
  \ Spark上。\n\n## An introduction to Apache Spark\n\nApache Spark是一个功能强大、开源的统一分析引擎，专为大规模数据处理和机器学习任务而设计。它为Java、Scala、Python和R提供高级API，并拥有一个优化的引擎，支持用于数据分析的通用计算图，为开发者提供速度和易用性。Spark的核心功能加上其SQL、流处理、机器学习和图处理库，使其成为一个多功能工具，适用于从批处理到实时分析和机器学习的广泛数据处理和分析任务。\n\
  \n### The background and motivation of Apache Spark\n\nApache Spark的背景和动机\n\n在大数据时代，对可扩展、快速且灵活的数据处理框架的需求变得越来越明显。传统解决方案，例如Apache\
  \ Hadoop MapReduce（https://en.wikipedia.org/wiki/MapReduce），为分布式数据处理铺平了道路，但在速度和易用性方面存在不足。为应对这些挑战，研究人员于2009年在UC\
  \ Berkeley的AMPLab构想了Apache Spark这一革命性开源项目。\n\n本节深入探讨了Apache Spark创建背后的背景和动机，强调了其作为强大数据处理框架的演变过程。\n\
  \n### Challenges with MapReduce\n\nMapReduce面临的挑战\n\nApache Hadoop MapReduce虽然具有开创性，但存在阻碍其广泛采用的局限性。基于磁盘的中间数据存储特性以及每次map和reduce操作后必须写入磁盘的需求引入了延迟，影响了整体处理速度。此外，MapReduce程序复杂且冗长的特性，包括以下其他挑战，使其对开发者不够友好：\n\
  \n- **Complexity and verbosity**: 实现MapReduce程序可能既复杂又冗长。开发者必须为map和reduce两个阶段编写代码，这可能导致大量样板代码。\n\
  \n- **Programming paradigm**: MapReduce遵循函数式编程范式，对于习惯于传统命令式编程语言的开发者来说可能不熟悉。这种思维转变对某些开发者来说可能构成学习曲线。\n\
  \n- **Data movement overhead**: MapReduce中的洗牌和排序阶段涉及网络上的大量数据移动，这可能导致开销。高效管理和最小化数据移动对于优化性能至关重要。\n\
  \n- **Limited support for iterative algorithms**: MapReduce不适合迭代算法，而迭代算法在机器学习和图处理任务中很常见。为迭代算法运行多个MapReduce作业会引入额外的复杂性和性能开销。\n\
  \n- **Debugging and testing**: 调试MapReduce作业可能具有挑战性。传统调试工具在分布式环境中可能效果不佳。开发者通常依赖日志分析和自定义调试技术。\n\
  \n- **Limited support for real-time processing**: MapReduce专为批处理设计，可能不是实时或低延迟处理需求的最佳选择。其他框架（如Apache\
  \ Spark）已应运而生以应对这些用例。\n\nApache Spark的开发旨在解决MapReduce处理模型的局限性，该模型是Apache Hadoop生态系统中的主要数据处理框架。\n\
  \nHere is a brief timeline of how Apache Spark came into existence:\n\n以下是Apache\
  \ Spark诞生过程的简要时间线：\n\n![](img/b40816015a9835648eac2b186dac82d1_29_0.png)\n\nFigure\
  \ 1.4 – A Spark development timeline\n\n图 1.4 – Spark开发时间线\n\n当今，Apache Spark被广泛用于大规模数据处理、机器学习、图分析等领域。其多功能性、速度以及对内存处理的支持促成了其流行，并使其成为现代大数据架构中的基础组件。Apache\
  \ Spark是一个开源的分布式计算系统，为大数据处理提供了一个快速且通用的集群计算框架。\n\nLet's discuss the key features\
  \ of Apache Spark that make it exciting to use for ML:\n\n让我们讨论Apache Spark使其在机器学习领域使用令人兴奋的关键特性：\n\
  \n- **In-memory processing**: Apache Spark的一个关键差异化特点是其内存处理能力。通过将中间数据存储在内存中而非持久化到磁盘，Spark显著加速了迭代算法和交互式数据分析。这种方法提升了性能，并便于在大型数据集上进行复杂计算。\n\
  \n- **Unified processing engine**: Apache Spark为批处理和流处理、机器学习、图处理及SQL查询提供统一的处理引擎。这种多功能性消除了为不同任务使用独立工具的需求，简化了开发过程并降低了用户的学习曲线。\n\
  \n- **Fault tolerance**: Spark的容错机制对于在分布式计算环境中维护数据完整性至关重要。如果发生节点故障，Spark可以通过血统信息重建丢失的数据。这种弹性确保了Spark应用程序即使在大型且动态的集群中也能可靠运行。\n\
  \n- **Ease of use**: Apache Spark在设计时充分考虑了用户友好性，为Java、Scala、Python和R提供高级API。这种设计选择扩大了其可访问性，使数据工程师和数据科学家能够利用其功能。Spark简洁的语法和交互式Shell提供了更直观的用户体验。\n\
  \nNext, we will discuss the architecture of Apache Spark and how various components\
  \ interact with each other.\n\n接下来，我们将讨论Apache Spark的架构以及各个组件如何相互交互。\n\n### Components\
  \ of Apache Spark\n\nApache Spark的组件\n\nApache Spark由多个组件组成，它们协同工作，为大数据处理和分析提供全面且统一的引擎。下图显示了Apache\
  \ Spark中存在的各个组件：\n\n![](img/b40816015a9835648eac2b186dac82d1_30_0.png)\n\nFigure\
  \ 1.5 – Spark components\n\n图 1.5 – Spark组件\n\nLet us learn what each component\
  \ does:\n\n让我们了解每个组件的功能：\n\n- **Spark Core**: Apache Spark的核心是Spark Core，为整个Spark生态系统提供基本功能。它包括任务调度、内存管理和故障恢复，构成了其他Spark库的基础。\n\
  \n- **Spark SQL**: Spark SQL通过SQL命令便于查询结构化数据。该组件将SQL查询与Spark程序无缝集成，面向数据分析师和精通SQL的用户，因为对他们而言，SQL是一个熟悉且高效的工具。\n\
  \n- **Spark Streaming**: 为满足实时分析的需求，Spark Streaming使用微批处理以近乎实时的方式处理数据流。它使Spark强大的批处理能力能够应用于流式数据源。\n\
  \n- **MLlib (Machine Learning Library)**: MLlib是Spark的机器学习库，为各种机器学习算法提供可扩展的实现。借助MLlib，数据科学家可以在大型数据集上构建和部署机器学习模型，利用Spark的内存处理能力实现更快的训练。\n\
  \n- **GraphX**: GraphX是Spark的图处理库，提供一个具有弹性的分布式图系统。它使你能够创建和操作图，非常适合复杂关系和网络分析应用。\n\
  \n\n\n\n\n### Apache Spark 的用例与应用\n\n让我们来看看 Spark 的用例和实际示例列表：\n\n- **大规模数据处理**：Apache\
  \ Spark 的主要用例之一是大规模数据处理。组织部署 Spark 用于日志分析、数据清洗和 **提取、转换和加载 (ETL)** 等操作，受益于其高效且可扩展的处理能力。例如，Apache\
  \ Spark 在处理日志方面非常有用，因为日志高度复杂且涉及太字节级的数据。\n\n- **实时分析**：Spark Streaming 处理实时数据流的能力使\
  \ Apache Spark 成为实时分析领域的关键参与者。它服务于寻求从社交媒体、传感器和日志等流式数据源中获取及时洞察的企业。实时分析的一个用例是处理传入的遥测数据以检测异常。\n\
  \n- **大规模机器学习**：MLlib 赋能数据科学家大规模构建和部署机器学习模型。Spark 的内存处理能力显著加速了复杂模型的训练，使其成为拥有大型数据集的组织的理想选择。例如，MLlib\
  \ 可用于在包含数十亿行的数据集上训练机器学习模型，例如用于监控数据中心健康状况的传感器数据。\n\n在下一部分，我们将探讨 Apache Spark 的优势及其机器学习算法集。\n\
  \n### 为什么为机器学习选择 Apache Spark？\n\nApache Spark 为机器学习应用提供了多项优势，使其成为可扩展和分布式 ML 任务的热门选择。以下是使用\
  \ Apache Spark 进行机器学习的一些主要优势：\n\n- **内存处理**：Spark 将中间数据存储在内存中的能力加速了机器学习中常用的迭代算法，显著缩短了计算时间。\n\
  \n- **分布式计算**：Spark 的分布式计算能力允许在机器集群上并行处理大型数据集，从而实现 ML 任务的可扩展性。\n\n- **弹性分布式数据集 (RDDs)**：Spark\
  \ 的基本数据结构 RDDs 提供了容错的并行处理。在机器学习的背景下，这意味着如果某个节点失败，计算可以在其他节点上继续而不会丢失进度。\n\n- **统一平台**：Spark\
  \ 为数据处理和机器学习提供了统一平台，消除了对独立工具的需求。这简化了整体工作流并增强了集成的便捷性。\n\n- **易用性**：Spark 提供了 Java、Scala、Python\
  \ 和 R 的高级 API，使许多开发者和数据科学家都能使用。这种易用性便于机器学习模型的开发和部署。\n\n- **MLlib**：MLlib 是 Spark\
  \ 的机器学习库，为机器学习任务提供了丰富的算法和工具集。它包括可扩展的分类、回归、聚类、协同过滤等实现。\n\n- **数据处理能力**：Spark 的数据预处理、清洗和转换功能与其机器学习库无缝集成。这简化了构建和部署机器学习模型的端到端过程。\n\
  \n- **流式集成**：Spark Streaming 允许将实时数据流集成到机器学习管道中。这对于需要实时预测或持续模型更新的应用程序至关重要。\n\n-\
  \ **图处理 (GraphX)**：对于涉及图结构数据的机器学习任务，Spark 的 GraphX 库简化了图算法和分析的开发，允许将图处理集成到 ML 工作流中。\n\
  \n- **社区支持与生态系统**：Spark 得到充满活力的开源社区和不断增长的库和工具生态系统的支持。这为从事机器学习项目的开发者和数据科学家提供了额外的资源和支持。\n\
  \n- **与 Hadoop 生态系统的兼容性**：Spark 可以在 Hadoop 集群上运行，利用现有的 Hadoop 基础设施。这种兼容性使得已部署 Hadoop\
  \ 的组织更容易采用 Spark 进行机器学习，而无需进行重大架构更改。\n\n- **性能优化**：Spark 包含多种性能优化，包括缓存、流水线和查询优化，有助于提高机器学习计算的效率。\n\
  \n### Apache Spark 中的算法\n\nApache Spark 的机器学习库 MLlib 为各种任务提供了广泛的机器学习算法，包括分类、回归、聚类和协同过滤。以下是\
  \ Apache Spark MLlib 中可用的一些关键机器学习算法：\n\n- **监督学习**：\n  - **线性回归**：用于基于一个或多个预测特征预测连续变量\n\
  \  - **逻辑回归**：适用于二分类问题，预测事件发生的概率\n  - **决策树**：构建基于输入特征预测结果的树状模型，可用于分类和回归\n  - **随机森林**：一种集成方法，构建多个决策树并组合其预测结果以提高准确性和鲁棒性\n\
  \  - **梯度提升树 (GBTs)**：构建一系列弱决策树并将其组合以创建强预测模型\n  - **朴素贝叶斯**：一种概率算法，常用于分类任务，尤其是文本分类\n\
  \  - **支持向量机 (SVM)**：适用于分类和回归任务，专注于寻找最优分离超平面\n\n- **无监督学习**：\n  - **K-means**：一种基于相似性将数据划分为\
  \ *k* 个簇的聚类算法\n  - **高斯混合模型 (GMM)**：一种表示高斯分布混合的概率模型；用于聚类\n  - **主成分分析 (PCA)**：在尽可能保留数据变异性的同时降低数据维度；常用于特征提取\n\
  \n- **协同过滤**：\n  - **交替最小二乘法 (ALS)**：一种矩阵分解算法，常用于推荐系统中的协同过滤\n\n- **特征转换与选择**：\n\
  \  - **Word2vec**：将单词转换为向量，捕获单词之间的语义关系。常用于 NLP 任务\n  - **词频-逆文档频率 (TF-IDF)**：TF-IDF\
  \ 是一种常用于文本挖掘的特征提取技术\n\nSpark 中可用的实用工具包括以下内容：\n\n- **管道**：允许用户以声明方式定义一系列数据处理和机器学习阶段\n\
  - **交叉验证**：通过提供在不同数据子集上训练和评估模型的工具，支持模型选择和超参数调优\n\n这些只是 Apache Spark MLlib 中可用的一些机器学习算法示例。该库在不断发展；较新版本可能会引入其他算法和改进。此外，Spark\
  \ 与其他机器学习库（例如 TensorFlow 和 scikit-learn）的兼容性允许用户在 Spark 环境中利用更广泛的算法范围。\n\n### Apache\
  \ Spark 用例\n\nApache Spark 在各个行业中被广泛采用，并被各种不同的组织用于机器学习任务。以下是一些利用 Apache Spark 进行机器学习的主要用户和行业：\n\
  \n- **技术公司**：包括云计算、数据分析和人工智能领域在内的领先技术公司，常使用 Apache Spark 进行大规模机器学习任务。Google、Amazon、Microsoft\
  \ 和 IBM 等公司将 Spark 集成到其平台和服务中。\n\n- **金融服务**：银行和金融机构使用 Apache Spark 进行欺诈检测、风险评估、客户细分和算法交易等任务。实时处理大量金融数据的能力使\
  \ Spark 成为该行业的重要工具。\n\n- **医疗保健与生命科学**：医疗保健和生命科学领域的组织利用 Apache Spark 进行基因组分析、药物发现、患者数据分析和个性化医疗等任务。Spark\
  \ 处理多种数据类型和大型数据集的能力在这些应用中非常有益。\n\n- **零售与电子商务**：零售商和电子商务公司利用 Apache Spark 进行推荐系统、客户细分、需求预测和供应链优化。Spark\
  \ 的机器学习功能帮助这些企业从客户和交易数据中提取有价值的洞察。\n\n- **制造业与工业 4.0**：制造公司采用 Apache Spark 进行预测性维护、质量控制、供应链优化和传感器数据分析。Spark\
  \ 处理流式数据的能力在涉及物联网 (IoT) 设备的场景中尤其有价值。\n\n- **能源与公用事业**：能源公司使用 Apache Spark 进行预测性设备维护、能源消耗预测和电网优化等任务。Spark\
  \ 处理和分析时间序列数据的能力在该领域非常有益。\n\n接下来，我们将讨论如何安装和设置 Apache Spark。\n\n\n\n\n\n### 设置 Apache\
  \ Spark\n\n在本地开发环境中设置 Apache Spark，涉及在你的机器上安装 Spark，并将其配置为独立模式运行。以下是设置 Apache Spark\
  \ 以进行本地开发的一般步骤：\n\n> **注意**\n> 以下说明假设你的机器上已安装 Java，而 Apache Spark 需要 Java。\n\n-\
  \ 1. **下载 Apache Spark:**\n  - I. 访问官方 Apache Spark 网站：https://spark.apache.org/。\n\
  \  - II. 转到 **下载** 部分。\n  - III. 选择要下载的 Spark 版本。\n  - IV. 选择包类型。对于本地开发，你可以选择 **预构建的\
  \ Apache Hadoop** 选项。\n  - V. 下载包含 Spark 的 tarball (.tgz) 或 ZIP 文件。\n\n- 2. **提取\
  \ Spark 存档:**\n  - I. 导航到下载 Spark 存档的目录。\n  - II. 提取存档的内容，使用像 `tar` 这样的工具，或者如果你下载了\
  \ ZIP 文件，可以使用图形工具：\n\n  ```\n  tar -xvf spark-3.x.x-bin-hadoop3.x.tgz\n  ```\n\n\
  - 3. **配置环境变量:**\n  - I. 打开你的 shell 配置文件。例如，如果你使用 Bash，请使用以下命令编辑你的 `bashrc` 文件：\n\
  \n  ```\n  ~/.bashrc\n  ```\n\n  或者，使用此方法：\n\n  ```\n  ~/.bash_profile\n  nano ~/.bashrc\n\
  \  ```\n\n  - II. 添加以下行以设置环境变量：\n\n  ```\n  export SPARK_HOME=/path/to/extracted/spark-3.x.x-bin-hadoop3.x\n\
  \  export PATH=$PATH:$SPARK_HOME/bin\n  ```\n\n  - III. 将 /path/to/extracted/spark-3.x.x-bin-hadoop3.x\
  \ 替换为提取 Spark 的实际路径。\n  - IV. 保存文件并退出文本编辑器。\n  - V. 运行以下命令以应用更改：\n\n  ```\n  source\
  \ ~/.bashrc\n  ```\n\n- 4. 以独立模式启动 Spark:\n  - I. 导航到 Spark 目录：\n\n  ```\n  cd $SPARK_HOME\n\
  \  ```\n\n  - II. 启动 Spark master：\n\n  ```\n  ./sbin/start-master.sh\n  ```\n\n\
  \  - III. 启动 Spark worker：\n\n  ```\n  ./sbin/start-worker.sh spark://localhost:7077\n\
  \  ```\n\n- 5. 访问 Spark Web UI:\n  - I. 打开 Web 浏览器并访问 http://localhost:8080/ 以查看\
  \ Spark Web UI。master 和 worker 应该会被列出。\n\n- 6. 测试 Spark 安装:\n  - I. 打开一个新终端窗口。\n\
  \  - II. 导航到 Spark 目录：\n\n  ```\n  cd $SPARK_HOME\n  ```\n\n  - III. 运行一个简单示例来测试安装：\n\
  \n  ```\n  ./bin/run-example SparkPi\n  ```\n\n  此命令使用 Spark 计算 Pi 的近似值。\n\n- 7.\
  \ 停止 Spark:\n  - I. 停止 Spark worker 和 master：\n\n  ```\n  ./sbin/stop-worker.sh\n\
  \  ./sbin/stop-master.sh\n  ```\n\n除了使用上述方法设置 Spark 之外，以下是运行 PySpark 的其他方式：\n\n\
  - 使用 PyPI:\n\n```\npip install pyspark\npyspark\n```\n\n- 使用预构建的 docker 镜像:\n\n\
  ```\ndocker run -it --rm spark:python3 /opt/spark/bin/pyspark\n```\n\n> 注意\n> 本书中的代码示例使用\
  \ Apache Spark 版本 3.5.1。\n\n这完成了设置 Spark 的步骤。\n\n### 总结\n\n当我们结束本入门章节时，很明显 Apache\
  \ Spark 已成为大数据处理领域的一股变革力量。其内存计算、统一处理引擎和易用性，使其成为面临大规模数据分析挑战的组织的首选解决方案。Apache Spark\
  \ 也已成为大规模数据工程和机器学习的热门平台。\n\n在本章中，我们了解了机器学习的基础知识、不同类型的学习算法、Spark 的组件，以及它在机器学习中的优势。\n\
  \n在后续章节中，我们将深入探讨 Apache Spark 的每个组件，探索实际应用，并提供动手示例来说明其功能。在下一章中，我们将学习 Apache Spark\
  \ 中的各种数据处理技术。\n"
- "## 使用 Spark 进行数据处理\n\n数据处理是数据分析和机器学习的关键步骤，因为它涉及将原始数据转换、清理和集成到适合进一步处理的格式中。在本章中，我们将介绍数据处理的基本概念和原则，并提供一些使用\
  \ Apache Spark 进行数据预处理的实际示例和用例。\n\n在本章中，我们将涵盖以下主题：\n\n- 了解数据预处理\n- 数据摄入\n- 清理和转换数据\n\
  - 聚合数据\n- Spark 中的窗口操作\n- 数据连接\n\n到本章结束时，你将了解使用 Spark 的不同数据处理技术。\n\n### 技术要求\n\n\
  你可以在 GitHub 上找到本章的代码文件，网址为 https://github.com/PacktPublishing/Apache-Spark-for-Machine-Learning/tree/main/Chapter02。\n\
  \n### 了解数据预处理\n\n**数据预处理** 是数据挖掘过程中的一个基本步骤。它涉及对原始数据进行一系列操作，将其转换为适合进一步分析和建模的格式，特别是在机器学习和\
  \ AI 应用中。数据预处理的关键目标是基于历史数据提升天气预测的质量、可靠性和效率。\n\n数据处理的主要步骤包括以下内容：\n\n- 1. **数据收集**:\
  \ 第一步涉及从各种来源提取原始数据。数据可以有多种格式，可以包括数字、文本和图像。\n\n- 2. **数据准备**: 此步骤涉及为处理准备数据。它可能包括对数据进行排序，并将其组织成表格、数据库或文件。\n\
  \n- 3. **数据清理**: 数据清理涉及通过数据插值填充缺失值，其中缺失值被替换为诸如均值、中位数和最大值等替代值。它还可能涉及移除异常值并纠正数据中错误、不完整、无关或重复的部分。此步骤对于保持数据质量至关重要。\n\
  \n- 4. **数据转换**: 这涉及将数据转换或转换为适合分析的格式。它还可以涉及归一化或缩放数据、聚合数据点或转换数据类型。\n\n- 5. **数据集成**:\
  \ 如果数据从多个来源收集，可能需要将其合并或集成到一个连贯的数据集中。这可能涉及合并数据库、表格或文件，并对齐不同的数据格式。\n\n- 6. **数据编码**:\
  \ 这包括将分类数据转换为数值格式，以便机器学习算法可以使用。常见技术包括标签编码和独热编码。\n\n- 7. **特征选择和特征工程**: 这涉及识别分析或模型中最相关的特征，并从现有数据中创建新特征，以提高模型性能。\n\
  \n数据预处理可以通过减少数据的复杂性和大小、选择最相关的特征以及处理错误和不一致性来提高机器学习模型的性能和可扩展性。数据预处理可以区分成功的机器学习项目和失败的机器学习项目。因此，在将数据馈送给机器学习模型之前，应用适当的数据预处理技术和工具非常重要。\n\
  \n由于缺乏数据预处理而导致的失败机器学习项目的一个例子是 **IBM Watson for Oncology** 项目。数据未被正确清理和验证，因为它包含错误、不一致和过时信息。数据也没有被集成和标准化，因为它来自不同的来源和格式，例如医疗记录、临床试验和研究论文。\n\
  \n现在，让我们看看如何摄取数据进行预处理。\n\n### 数据摄入\n\n数据摄入是将数据导入和加载到系统（例如数据库、数据仓库或数据湖）的过程。数据摄入可以手动或自动完成，使用各种工具和技术。数据摄入是数据分析和机器学习的第一步，因为它为进一步处理和使用做好数据准备。\n\
  \n\n\n\n\nApache Spark 是一个强大的分布式数据处理系统，可以从各种数据源读取数据。它能够与多种多样的数据存储系统集成，这是其在大数据处理和分析中广受欢迎的原因之一。以下是\
  \ Apache Spark 可以从中摄取数据的一些关键数据源。\n\n#### 文件系统\n\n让我们探讨从 Hadoop 分布式文件系统 (HDFS) 摄取数据的示例。以下是从\
  \ HDFS 读取数据的示例代码片段：\n\n```\nfrom pyspark.sql import SparkSession\nspark = SparkSession.builder\
  \ \\\n.appName(\"HDFS Read Example\") \\\n.getOrCreate()\n##### Define the HDFS\
  \ path\nhdfs_path = \"hdfs://namenode:port/path/to/your/file.csv\"\n##### Read the\
  \ CSV file into a DataFrame\ndf = spark.read.csv(hdfs_path, header=True, inferSchema=True)\n\
  ##### Show the DataFrame\ndf.show()\n```\n\n##### Amazon S3\n\n现在，让我们看看从 Amazon\
  \ S3 摄取数据的示例。要从 S3 存储桶读取数据，可以使用以下代码片段：\n\n```\nfrom pyspark.sql import SparkSession\n\
  ##### Initialize a SparkSession\nspark = SparkSession.builder \\\n.appName(\"Read\
  \ Data from S3\") \\\n.config(\"spark.hadoop.fs.s3a.access.key\", \"YOUR_ACCESS_KEY\"\
  ) \\\n.config(\"spark.hadoop.fs.s3a.secret.key\", \"YOUR_SECRET_KEY\") \\\n.config(\"\
  spark.hadoop.fs.s3a.impl\", \\\n\"org.apache.hadoop.fs.s3a.S3AFileSystem\") \\\n\
  .getOrCreate()\n##### Replace 's3a://your-bucket-name/your-data-file' with your\
  \ S3 bucket\nand file\ns3_file_path = \"s3a://your-bucket-name/your-data-file\"\n\
  ##### Read the data into a DataFrame\ndf = spark.read.csv(s3_file_path, header=True,\
  \ inferSchema=True)\n\n##### Show the DataFrame\ndf.show()\n\n##### Stop the SparkSession\n\
  spark.stop()\n```\n\n##### Azure Blob 存储\n\n接下来，我们将查看从 Azure Blob 存储摄取数据的示例。以下是从\
  \ Azure Blob 存储读取数据的示例代码片段：\n\n```\nfrom pyspark.sql import SparkSession\n\n#####\
  \ Initialize a SparkSession\nspark = SparkSession.builder \\\n .appName(\"Read Data\
  \ from Azure Blob Storage\") \\\n .config(\"fs.azure\", \\\n \"org.apache.hadoop.fs.azure.NativeAzureFileSystem\"\
  ) \\\n .config(\n \"fs.azure.account.key.YOUR_STORAGE_ACCOUNT_NAME.blob.core.windows.net\"\
  , \\\n \"YOUR_STORAGE_ACCOUNT_ACCESS_KEY\") \\\n .getOrCreate()\n\n##### Replace\
  \ with your Azure Storage account details\nstorage_account_name = \"YOUR_STORAGE_ACCOUNT_NAME\"\
  \ncontainer_name = \"YOUR_CONTAINER_NAME\"\nfile_path = \"YOUR_FILE_PATH\" # e.g.,\
  \ \"folder/data.csv\"\n##### Construct the full Azure Blob Storage path\nblob_file_path\
  \ = f\"wasbs://{container_name}@{storage_account_name} \\\n.blob.core.windows.net/{file_path}\"\
  \n\n##### Read the data into a DataFrame\n##### Replace 'spark.read.csv' with the\
  \ appropriate method for your data format\n##### Use \"spark.read.parquet\" for\
  \ parquet files\n##### Use \"spark.read.json\" for JSON files\ndf = spark.read.csv(blob_file_path,\
  \ header=True, inferSchema=True)\n\n##### Show the DataFrame\ndf.show()\n\n#####\
  \ Stop the SparkSession\nspark.stop()\n```\n\n##### 关系型数据库\n\n我们也将查看从关系型数据库摄取数据的示例。\n\
  \n以下数据库可用于在 Apache Spark 中摄取数据：\n\n- MySQL\n- PostgreSQL\n- Oracle\n- SQL Server\n\
  \n要从 PostgreSQL 数据库读取数据，可以尝试以下代码片段：\n\n```\nfrom pyspark.sql import SparkSession\n\
  ##### Initialize a SparkSession\nspark = SparkSession.builder \\\n    .appName(\"\
  Read Data from PostgreSQL\") \\\n    .getOrCreate()\n\n##### PostgreSQL database\
  \ details\njdbc_url = \"jdbc:postgresql://hostname:port/database_name\"\nproperties\
  \ = {\n    \"user\": \"username\",\n    \"password\": \"password\",\n    \"driver\"\
  : \"org.postgresql.Driver\"\n}\n\n##### Name of the table you want to read\ntable_name\
  \ = \"your_table\"\n\n##### Read data from PostgreSQL into a DataFrame\ndf = spark.read.jdbc(\n\
  \    url=jdbc_url, table=table_name, properties=properties)\n\n##### Show the DataFrame\n\
  df.show()\n\n##### Stop the SparkSession\nspark.stop()\n```\n\n##### NoSQL 数据库\n\
  \n让我们回顾一下从 NoSQL 数据库摄取数据的示例。\n\n以下 NoSQL 数据库可用于数据摄取：\n\n- Cassandra\n- HBase\n-\
  \ MongoDB\n\n以下是从 Cassandra NoSQL 数据库读取数据的示例代码片段：\n\n```\nfrom pyspark.sql import\
  \ SparkSession\n\n##### Configure the Spark session to use the Spark Cassandra Connector\n\
  ##### Replace with the correct version\nconnector_package = \"com.datastax.spark:spark-cassandra-connector_2.12:3.0.0\"\
  \n\nspark = SparkSession.builder \\\n    .appName(\"PySpark Cassandra Example\"\
  ) \\\n    .config(\"spark.jars.packages\", connector_package) \\\n    .config(\"\
  spark.cassandra.connection.host\", \"cassandra_host\") \\\n    .config(\"spark.cassandra.connection.port\"\
  , \"cassandra_port\") \\\n    .config(\"spark.cassandra.auth.username\", \"username\"\
  ) \\\n    .config(\"spark.cassandra.auth.password\", \"password\") \\\n    .getOrCreate()\n\
  \n##### Now you can use the Spark session to read from or write to Cassandra\n#####\
  \ Example: Reading data from a Cassandra table\nkeyspace = \"your_keyspace\"\ntable\
  \ = \"your_table\"\n\ndf = spark.read \\\n    .format(\"org.apache.spark.sql.cassandra\"\
  ) \\\n    .options(keyspace=keyspace, table=table) \\\n    .load()\n\ndf.show()\n\
  \n##### Remember to stop the Spark session\nspark.stop()\n```\n\n##### 其他数据源\n\n\
  除了前面讨论的数据摄取源外，还有其他一些格式：\n\n- 大数据文件格式：\n  - Parquet：一种高效的列式存储格式，适用于 Hadoop 生态系统中的任何项目\n\
  \  - Avro：一种基于行的存储格式，以其在序列化大量数据时的高效性和效果而闻名\n  - 优化行列式 (ORC)：一种高效率且提供出色压缩比的格式\n \
  \ - JavaScript Object Notation (JSON)：一种常用的数据交换格式\n  - Comma-Separated Values (CSV)：一种用于表格数据的简单格式\n\
  - 数据流：\n  - Kafka：一个用于构建实时数据管道和流式应用程序的分布式流媒体平台\n  - Flume：一种用于高效收集、聚合和移动大量日志数据的服务\n\
  \  - Kinesis 和 Event Hubs：云服务提供商提供的可扩展且持久的实时数据流式传输服务\n- 数据仓库解决方案：\n  - Apache Hive：一个用于\
  \ Hadoop 的数据仓库系统，支持轻松的数据汇总、查询和分析\n  - Amazon Redshift：来自 Amazon 的快速、可扩展的数据仓库服务\n\
  \  - Google Big Query：Google 的无服务器、高度可扩展且经济高效的多云数据仓库\n  - Elasticsearch：一个分布式的 RESTful\
  \ 搜索和分析引擎，用于解决日益增长的用例\n\nApache Spark 可以处理各种数据处理场景，从批处理到实时流式数据。它能够连接如此多种多样的数据源，使其成为数据工程师和数据科学家的强大工具。\n\
  \n在下一部分中，让我们了解如何清洗和转换数据。\n\n### 清洗和转换数据\n\n清洗和转换数据是数据预处理阶段中的关键步骤，用于为分析和建模准备原始数据。每个步骤包含的内容如下：\n\
  \n- 数据清洗涉及识别和纠正数据中的错误、数据损坏、不一致性和不准确性。此过程对于确保数据在用于分析之前的质量和可靠性至关重要。\n- 数据转换涉及将数据从其原始格式或结构转换为更适合分析的格式。此步骤对于使数据与各种分析工具和技术兼容至关重要。\n\
  \nPySpark 提供了各种函数和方法，用于高效地清洗和转换数据。\n\n#### 数据清洗\n\n数据清洗是 ML 管道中的关键步骤，因为它直接影响机器学习模型的性能和可靠性。通过确保数据干净且组织良好，您可以构建更准确、高效且可解释的模型。\n\
  \n数据清洗中的关键任务包括：\n\n- 删除重复项：消除重复条目，以确保每个数据点都是唯一的\n- 处理缺失值：决定如何处理数据中的缺口，例如使用计算值（均值、中位数、众数）填充、插值，或完全删除受影响的记录\n\
  - 纠正错误：识别并修正数据中的错误，可能包括拼写错误、标记错误的类别或错误的测量值\n- 标准化格式：确保单位、日期格式和分类标签的一致性，以避免可能扭曲分析的差异\n\
  \n在接下来的小节中，我们将探讨 PySpark 中一些常见的数据清洗操作。\n\n### 删除重复项\n\n要从 DataFrame 或列子集中删除重复行，可以使用\
  \ `dropDuplicates()` 方法：\n\n```\nimport pyspark\nfrom pyspark.sql import SparkSession\n\
  spark = SparkSession \\\n .builder \\\n .appName(\"Python Spark SQL basic example\"\
  ) \\\n .getOrCreate()\n```\n\n\n\n```\ndf = spark.createDataFrame(\n    [('tony',\
  \ 25), ('tony', 25), ('mike', 40)], [\"name\", \"age\"])\ndf.dropDuplicates().show()\n\
  ```\n\n将获得以下输出：\n\n之前\n\n| 姓名 | 年龄 |\n|---|---|\n| tony | 25 |\n| tony | 25 |\n\
  | mike | 30 |\n\n之后\n\n| 姓名 | 年龄 |\n|---|---|\n| tony | 25 |\n| mike | 30 |\n\n\
  图 2.1 – 删除重复记录\n\n#### 处理缺失值\n\n您可以使用`dropna()`删除任何列中包含缺失值的行：\n\n```\n##### Drops\
  \ rows with any null values\ndf = df.dropna(how='any')\n```\n\n将获得以下输出：\n\n之前\n\n\
  | 姓名 | 年龄 |\n|---|---|\n| tony | None |\n| tony | 25 |\n| mike | 30 |\n\n之后\n\n\
  | 姓名 | 年龄 |\n|---|---|\n| tony | 25 |\n| mike | 30 |\n\n图 2.2 – 删除包含缺失值的行\n\n##\
  \ 填充缺失值\n\n我们将通过示例学习如何填充缺失值。\n\n使用`fillna()`将空值替换为指定值：\n\n```\ndf = spark.createDataFrame([('tony',\
  \ None), ('tony', 25),\n ('mike', 40)], [\"name\", \"age\"])\ndf.na.fill({'age':\
  \ 55}).show()\n```\n\n结果如下：\n\n![](img/b40816015a9835648eac2b186dac82d1_48_0.png)\n\
  \n图 2.3 – 填充缺失值概览\n\n#### 过滤数据\n\n您可以基于条件过滤行，使用`filter()`或`where()`方法：\n\n```\n\
  df = df.filter(df['age'] > 20)\n```\n\n更新后的结果如下：\n\n![](img/b40816015a9835648eac2b186dac82d1_48_1.png)\n\
  \n图 2.4 – 过滤操作概览\n\n现在，让我们将注意力转向数据转换。\n\n#### 数据转换\n\n数据转换是机器学习工作流中数据处理的一个关键方面。Apache\
  \ Spark 提供了强大的功能来高效执行各种数据转换。\n\n数据转换的关键任务包括：\n\n- 更改数据类型：此操作涉及将列从一种数据类型转换为另一种，例如从字符串转换为整数\n\
  - 重命名列：此转换涉及为列分配新名称，这有助于保持数据集的一致性和清晰度\n- 修剪字符串：此过程涉及删除列中字符串值的前导和尾随空格\n- 排序数据：此转换涉及根据一个或多个列的值排序数据集的行，可以是升序或降序\n\
  \n让我们详细回顾每个操作。\n\n## 转换数据类型\n\n要更改列的数据类型，请使用`withColumn()`配合`cast()`：\n\n```\ndf\
  \ = spark.createDataFrame(\n    [('tony', 35), ('tony', 25), ('mike', 40)], [\"\
  name\", \"age\"])\ndf.withColumn(\"age\", df[\"age\"].cast(\"integer\")).show()\n\
  ```\n\n## 重命名列\n\n接下来，我们将通过示例学习如何重命名列。您可以使用`withColumnRenamed()`重命名 DataFrame 列：\n\
  \n```\ndf = df.withColumnRenamed(\"name\", \"new_name\")\n```\n\n将获得以下结果：\n\n| 姓名\
  \ | 年龄 | 新姓名 | 年龄 |\n|---|---|---|---|\n| tony | 15 | tony | 15 |\n| tony | 25 |\
  \ tony | 25 |\n| mike | 30 | mike | 30 |\n\n图 2.5 – 重命名列操作概览\n\n## 修剪字符串\n\n要从字符串列中删除前导和尾随空格，请使用`trim()`：\n\
  \n```\nfrom pyspark.sql.functions import trim\ndf = df.withColumn(\"new_column_name\"\
  , trim(df[\"name\"]))\n```\n\n结果如下：\n\n| 姓名 | 年龄 |\n|---|---|\n| \"tony\" | 15 |\n\
  | \"tony\" | 25 |\n| \" mike\" | 30 |\n\n| 姓名 | 年龄 | 新名称 |\n|---|---|---|\n| \"\
  tony\" | 15 | \"tony\" |\n| \"tony\" | 25 | \"tony\" |\n| \" mike\" | 30 | \" mike\"\
  \ |\n\n图 2.6 – 修剪字符串概览\n\n## 排序数据\n\n使用`orderBy()`排序数据：\n\n```\ndf = df.orderBy(df[\"\
  age\"].desc())\n```\n\n输出如下：\n\n| 姓名 | 年龄 |\n|---|---|\n| tony | 25 |\n| tony |\
  \ 15 |\n| mike | 30 |\n\n| 姓名 | 年龄 |\n|---|---|\n| tony | 15 |\n| tony | 25 |\n\
  | mike | 30 |\n\n图 2.7 – 排序操作概览\n\n在下一节中，我们将学习数据聚合。\n\n#### 聚合数据\n\n在人工智能和机器学习的背景下，数据聚合是指将原始数据转换为更适合分析或模型训练的摘要或简化表示的过程。\n\
  \n数据聚合是数据预处理和分析中的关键步骤，原因有以下几点：\n\n- **复杂性降低**：聚合通过汇总详细数据，帮助将多行数据转换为更少行的数据。例如，单个销售交易可以聚合为按天、月或年显示的总销售额。这种复杂性的降低可以使算法更容易识别模式和趋势。\n\
  - **改善信噪比**：通过汇总或平均数据，聚合可以在减少噪声（无关信息）的同时增强底层信号（相关信息）。这可以带来更好的模型性能，尤其是在噪声数据集中。\n\
  - **降维**：聚合可以减少数据集中的特征数量（降维），这对许多机器学习算法有益。它有助于缓解过拟合等问题，并可提高模型的效率和性能。\n- **处理时间序列数据**：在时间序列分析中，聚合常用于将数据重采样为不同的时间帧（例如，将五秒间隔数据转换为分钟级汇总）。这对于需要特定间隔数据或需要随时间查看简化趋势的模型至关重要。\n\
  - **提高数据质量**：聚合有助于处理缺失或不完整的数据。通过聚合数据，可以减轻缺失值的影响，尤其是当聚合过程涉及平均值或求和等计算时。\n- **促进特征工程**：聚合后的数据可用于创建比原始数据提供更多洞察的新特征。例如，按时间聚合客户购买行为可以创建代表长期趋势或客户忠诚度的特征。\n\
  - **资源效率**：使用聚合数据的计算强度低于使用原始详细数据。在处理异常大的数据集（大数据）时，这一点尤为重要。\n\n在实践中，聚合方法和聚合级别的选择取决于\
  \ AI/ML 项目的具体目标、数据的性质以及项目旨在发现的模式或洞察类型。常见的聚合函数包括 sum、average、count、max、min 和 median。高级聚合可能涉及更复杂的统计方法或针对特定数据特征或业务需求定制的算法。\n\
  \n接下来我们将讨论两种类型的聚合。\n\n## 基本聚合\n\n数据分析中的基本聚合涉及应用简单的统计或数学运算来汇总数据。这些运算将多个值的数据减少到单个值，从而提供对数据集的简化概览或关键洞察。以下是一些最常见的基本聚合函数类型：\n\
  \n- max(): 查找列中的最大值\n- min(): 查找列中的最小值\n- count(): 计算表中的行数\n- sum(): 计算列中值的总和\n\
  - mean(): 计算列中值的平均值\n\n让我们查看包含四列的数据集，如图 2.8 所示。由于聚合函数只能应用于数值列，在列“amount”上应用各种聚合函数会产生如下图右侧部分所示的输出：\n\
  \n![](img/b40816015a9835648eac2b186dac82d1_52_0.png)\n\n图 2.8 – 基本聚合示例\n\n以下代码创建一个包含四列的\
  \ Spark DataFrame df，列名分别为 emp_id、region、sales 和 customer：\n\n```\ndf = spark.createDataFrame(\n\
  \ [(1,\"north\",100,\"walmart\"),(2,\"south\",300,\"apple\"),\n (3,\"west\",200,\"\
  google\"),(1,\"east\",200,\"google\"),\n (2,\"north\",100,\"walmart\"),(3,\"west\"\
  ,300,\"apple\"),\n (1,\"north\",200,\"walmart\"),(2,\"east\",500,\"google\"),\n\
  \ (3,\"west\",400,\"apple\")], [\"emp_id\", \"region\", \"sales\", \"customer\"\
  ])\n```\n\n现在我们已创建 DataFrame，可以在 sales 列上应用聚合函数 sum：\n\n```\ndf.agg({\"sales\":\
  \ \"sum\"}).show()\n```\n\nsum 函数将列中所有值相加，输出值为 2300：\n\n```\n+-----------+\n|sum(sales)\
  \ |\n+-----------+\n|       2300|\n+-----------+\n```\n\n以下代码计算 sales 列中的最小值：\n\n\
  ```\ndf.agg({\"sales\": \"min\"}).show()\n```\n\n输出如下：\n\n```\n+-----------+\n|min(sales)\
  \ |\n+-----------+\n|       100 |\n+-----------+\n```\n\n以下代码计算 sales 列中的最大值：\n\n\
  ```\ndf.agg({\"sales\": \"max\"}).show()\n```\n\n输出如下：\n\n```\n+-----------+\n|max(sales)\
  \ |\n+-----------+\n|       500 |\n+-----------+\n```\n\n\n\n\n以下代码计算数据集中的行数：\n\n\
  ```\ndf.agg({\"sales\": \"count\"}).show()\n```\n\n以下是输出：\n\n| count (sales) |\n\
  |---------------|\n| 9 |\n\n以下代码计算 `sales` 列中所有值的平均值：\n\n```\ndf.agg({\"sales\"\
  : \"mean\"}).show()\n```\n\n以下是输出：\n\n| avg (sales) |\n|-------------|\n| 255.55555555555554\
  \ |\n\n以下代码展示如何同时应用两个聚合函数：\n\n```\ndf.agg({\"sales\": \"mean\", \"customer\": \"\
  count\"}).show()\n```\n\n以下是输出：\n\n| avg (sales) | count (customer) |\n|-------------|------------------|\n\
  | 255.55555555555554 | 9 |\n\n## 分组聚合\n\n**分组聚合** 在数据处理中，特别是在 SQL、数据分析以及 Python\
  \ 等编程语言的语境下，是指通过将数据集划分为子集或组，对其进行计算或统计操作的过程。当你希望在数据的特定片段中分析模式或计算指标时，这尤其有用。分组聚合是数据分析的基础，能够为数据集提供详细且分段的洞察。它们将大型、详细的数据集转化为汇总的、可操作的信息。\n\
  \n让我们看看分组聚合是如何工作的：\n\n- 1. **对数据进行分组**：首先，根据一个或多个键将数据划分为不同的组。这些键可以是数据集中的列，例如类别、日期或地区。\n\
  \n- 2. **应用聚合函数**：数据分组后，可以对每个组独立应用各种聚合函数。常见的聚合函数包括求和、平均值（mean）、计数、最大值、最小值和标准差。\n\
  \n- 3. **结果**：结果是一个新数据集，其中每个组由单行表示，列包含聚合后的值。\n\n以下图示展示了如何根据列值在多个列上应用 GroupBy 函数来对记录进行分组。中心部分显示了分组后的记录。\n\
  \n然后可以对这些分组后的记录分别应用聚合函数，以获取特定于各组的聚合结果，如右侧部分所示。\n\n![](img/b40816015a9835648eac2b186dac82d1_55_0.png)\n\
  \n图 2.9 – 对分组数据应用聚合函数的示例\n\nPySpark 中的方法链允许你以简洁且顺序的方式对 DataFrame 执行多个操作。无需将中间 DataFrame\
  \ 赋值给变量，你可以直接将方法链在一起。\n\n以下代码计算每位员工实现的总销售额。首先，它按 emp_id 列的每个唯一值对记录进行分组。对于每个组（即每个员工\
  \ ID），它计算总和。然后，输出按员工 ID 排序。\n\n```\ndf.groupby(\"emp_id\").agg({\"sales\": \"sum\"\
  }).orderBy(\"emp_id\").show()\n```\n\n以下是输出：\n\n| emp_id | sum(sales) |\n|--------|------------|\n\
  | 1      | 500        |\n| 2      | 900        |\n| 3      | 900        |\n\n以下代码计算每位员工实现的最大销售额。它首先按\
  \ emp_id 列的每个唯一值对记录进行分组。对于每个组（即每个员工 ID），它计算最大值。然后，输出按员工 ID 排序。\n\n```\ndf.groupby(\"\
  emp_id\").agg({\"sales\": \"max\"}).orderBy(\"emp_id\").show()\n```\n\n以下是输出：\n\n\
  | emp_id | max(sales) |\n|--------|------------|\n| 1      | 200        |\n| 2 \
  \     | 500        |\n| 3      | 400        |\n\n以下代码输出每位员工最近的销售额。它首先按 emp_id 列的每个唯一值对记录进行分组。对于每个组（即每个员工\
  \ ID），它读取每个组中的最后一条销售记录。然后，输出按员工 ID 排序。\n\n```\ndf.groupby(\"emp_id\").agg({\"sales\"\
  : \"last\"}).orderBy(\"emp_id\").show()\n```\n\n以下是输出：\n\n| emp_id | last(sales)\
  \ |\n|--------|-------------|\n| 1      | 200         |\n| 2      | 500        \
  \ |\n| 3      | 400         |\n\n以下代码输出每个地区的平均销售额。它首先按 region 列的每个唯一值对记录进行分组。对于每个组（即每个地区），它计算每个组中的平均销售额。然后，输出按地区排序。\n\
  \n```\ndf.groupby(\"region\").agg({ \"sales\": \"sum\" }).orderBy('region').show()\n\
  ```\n\n以下是输出：\n\n| region | sum(sales) |\n|--------|------------|\n| 东部   | 700\
  \        |\n| 北部   | 400        |\n| 南部   | 300        |\n| 西部   | 900        |\n\
  \n以下代码输出每个客户的总销售额。它首先按 customer 列的每个唯一值对记录进行分组。对于每个组（即每个客户），它计算总销售额。然后，输出按客户排序。\n\
  \n```\ndf.groupby(\"customer\").agg({ \"sales\": \"sum\" }).orderBy('customer').show()\n\
  ```\n\n以下是输出：\n\n| customer | sum(sales) |\n|----------|------------|\n| apple \
  \   | 1000       |\n| google   | 900        |\n| walmart  | 400        |\n\n在下一节中，我们将学习数据窗口化。\n\
  \n#### Spark 中的窗口化\n\n**数据窗口化** 是机器学习和人工智能中的关键技术，尤其是在处理时间序列数据、序列数据或任何时间或序列上下文重要的数据时。它将大型顺序数据点系列拆分为较小的顺序系列（数据窗口），以便从每个数据分区中推导出洞察。在这些领域，窗口化有助于将数据以适当的方式结构化，用于分析和模型训练。它在\
  \ ML 和 AI 中的应用方式如下：\n\n- 时间序列数据的特征工程：\n  - **创建时间帧**：窗口化可用于从连续时间序列数据中创建固定大小的时间帧。例如，如果你有连续的传感器数据，可以创建一分钟间隔的窗口，以便在这些离散块中分析传感器读数。\n\
  \  - **捕捉时间模式**：通过将数据分割为窗口，你可以捕捉时间模式，这对 ARIMA、**长短期记忆（LSTM）**网络和**循环神经网络（RNNs）**等预测模型至关重要。\n\
  \n- 处理序列数据：\n  - **自然语言处理（NLP）**：在文本分析中，窗口化技术用于在周围单词的上下文中处理单词，这对于理解语言结构和含义至关重要。\n\
  \  - **基因组学**：在 DNA 序列分析中，窗口化有助于分析基因组序列的特定区域，以识别模式或异常。\n\n- 信号处理：\n  - **信号特征提取**：窗口化用于从音频、心电图信号或其他时变信号中提取特征，用于分类或分析任务。\n\
  \  - **减少频谱分析中的边缘效应**：在傅里叶变换及相关频谱分析技术中，窗口函数用于减轻边缘效应，确保更准确的频域表示。\n  - **异常检测**：窗口化有助于识别随时间变化的指标或模式中的突变，这在异常检测系统中至关重要。\n\
  \  - **数据平滑和降噪**：窗口化技术用于应用移动平均或其他滤波器来平滑数据，减少噪声，使底层模式更加明显。\n  - **实时数据处理**：在流数据分析中，窗口化用于实时处理数据，将连续的数据流分割成可管理的离散块以供分析。\n\
  \n- ML 和 AI 中的窗口类型：\n  - **滑动窗口**：相邻窗口之间存在重叠，常用于语音和音频处理\n  - **滚动窗口**：不重叠的顺序窗口，常用于实时分析\n\
  \  - **扩展窗口**：从固定点开始并随时间增长，适用于累积指标计算\n\n## 为何需要窗口化及其在 Spark 中的示例\n\n让我们探讨窗口化必要且有益的一些主要原因：\n\
  \n- **跨行执行计算**：与传统聚合函数不同，窗口函数会对与当前行相关的一组行执行计算，而不会将它们合并为单个输出行。这对于需要保留单行详细信息的分析至关重要。\n\
  - **数据分区**：窗口函数允许你将数据分组，而不会更改输出的行结构。这种分区允许在数据子集内进行比较和聚合分析，例如在每个组内计算求和、平均值或其他指标。\n\
  - **排名和行号**：它们提供了在数据集中对项目进行排名的能力，而无需复杂的子查询。`ROW_NUMBER()`、`RANK()` 和 `DENSE_RANK()`\
  \ 等函数对于按地区或部门对销售数据进行排名、识别表现最佳的产品，或根据特定顺序为行分配唯一标识符等任务非常有价值。\n- **运行总计和移动平均**：窗口函数对于财务和统计分析特别有用，例如计算运行总计、移动平均或累积和。此功能对于时间序列分析、预算编制、财务报告和趋势分析至关重要。\n\
  - **访问前行和后行值**：`LEAD()` 和 `LAG()` 等函数允许你访问同一结果集中前一行或后一行的数据。此功能对于将当前行数据与前一行或后一行进行比较至关重要，例如计算销售或股票变动的环比变化，或检测序列模式。\n\
  \n让我们通过一些示例问题来理解多个 `groupby` 操作。\n\n### 问题 1\n\n**问题陈述**：如何为每个组计算一个新列，该列的行值等于当前行及前两行之和？\n\
  \n如 *图 2.10* 所示，该数据集包含三列，即 `dept_name`、`emp_id` 和 `salary`。我们创建一个新列 `sum`。这个新 `sum`\
  \ 列中的每个行值都是当前行值加上 `salary` 列中前两行值的总和。\n\n\n\n\n## 单元格值等于当前行加上前两行之和\n\n| 部门名称 | 员工ID\
  \ | 薪资 |\n|---|---|---|\n| 销售 | 10 | 6000 |\n| 人力资源 | 7 | 3000 |\n| 信息技术 | 5 | 5000\
  \ |\n| 销售 | 2 | 6000 |\n| 人力资源 | 3 | 2000 |\n| 人力资源 | 4 | 6000 |\n| 信息技术 | 8 | 8000\
  \ |\n| 销售 | 9 | 5000 |\n| 销售 | 1 | 7000 |\n| 信息技术 | 6 | 6000 |\n\n| 部门名称 | 员工ID\
  \ | 薪资 | 总和 |\n|---|---|---|---|\n| 销售 | 1 | 7000 | 7000 |\n| 销售 | 2 | 6000 | 13000\
  \ |\n| 销售 | 9 | 5000 | 18000 |\n| 销售 | 10 | 6000 | 17000 |\n| 人力资源 | 3 | 2000 |\
  \ 2000 |\n| 人力资源 | 4 | 6000 | 8000 |\n| 人力资源 | 7 | 3000 | 11000 |\n| 信息技术 | 5 |\
  \ 5000 | 5000 |\n| 信息技术 | 6 | 6000 | 11000 |\n| 信息技术 | 8 | 8000 | 19000 |\n\n##\
  \ 图 2.10 – 窗口函数示例\n\n以下是每行值如何从前几行计算的解释：\n\n- `sum` 列的第一行值 = 当前行的 `salary` 值 + 前两行的值：\n\
  \  \n  7,000 = 7,000 + 0（注意不存在前几行，因此为 0）。\n\n- 同样，`sum` 列的第二行值 = 当前行的 `salary` 值\
  \ + 前两行的值：\n  \n  13,000 = 6,000 + 7,000（注意只存在一行前几行，因此为 7,000）。\n\n- 同样，`sum` 列的第三行值\
  \ = 当前行的 `salary` 值 + 前两行的值：\n  \n  18,000 = 5,000 + 13,000（注意只存在两行前几行，因此为 6,000\
  \ 和 7,000）\n\n现在，让我们编写代码来执行窗口函数，在数据集中推导一个新的 `sum` 列。\n\n在图 2.10 中，左侧部分的数据集未经转换。我们首先定义一个窗口函数，名为\
  \ `window`。此函数通过对 `dept_id` 列应用 `partitionBy` 来对数据集进行分区。此操作根据 `dept_id` 列中的唯一值对记录进行分组。然后，它对每个分组记录中的\
  \ `emp_id` 列进行排序。接着，函数通过 `rowsBetween` 定义窗口的起点和终点。减号表示前几行。\n\n```\nfrom pyspark.sql\
  \ import functions as func\nfrom pyspark.sql import Window\ndf = spark.createDataFrame(\n\
  [(1,\"north\",100,\"walmart\"),(2,\"south\",300,\"apple\"),\n(3, \"west\",200, \"\
  google\"), (1, \"east\", 200, \"google\"),\n(2, \"north\", 100, \"walmart\"), (3,\
  \ \"west\", 300, \"apple\"),\n(1, \"north\", 200, \"walmart\"), (2, \"east\", 500,\
  \ \"google\"),\n(3, \"west\", 400, \"apple\") ],\n[\"emp_name\", \"region\", \"\
  sales\", \"department\", \"customer\"] )\nwindow = Window.partitionBy(\"dept_id\"\
  )\\\\\n.orderBy(\"emp_id\").rowsBetween(-2,0\n```\n\n我们将使用聚合 sum 函数和上一行代码中定义的窗口函数，创建一个名为\
  \ sum 的新列：\n\n```\ndf.withColumn(\"sum\", func.sum(\"salary\").over(window)).show()\n\
  ```\n\n以下输出显示了带有新列 sum 的转换后的数据集：\n\n| 部门名称 | 员工ID | 薪资 | 总和 |\n|---|---|---|---|\n\
  | 销售 | 1 | 7000 | 7000 |\n| 销售 | 2 | 6000 | 13000 |\n| 销售 | 9 | 5000 | 18000 |\n\
  | 销售 | 10 | 6000 | 17000 |\n| 人力资源 | 3 | 2000 | 2000 |\n| 人力资源 | 4 | 6000 | 8000\
  \ |\n| 人力资源 | 7 | 3000 | 11000 |\n| 信息技术 | 5 | 5000 | 5000 |\n| 信息技术 | 6 | 6000\
  \ | 11000 |\n| 信息技术 | 8 | 8000 | 19000 |\n\n## 问题 2\n\n**问题陈述**：如何为每个组计算一个新列，使得该列的行值等于当前行及其后两行之和？\n\
  \n如图 2.11 所示，数据集包含三列，即 dept_id、emp_id 和 salary。我们创建一个新列 sum。该新 sum 列中的每行值是 salary\
  \ 列中当前行值加上后两行值的总和。\n\n单元格值等于基于分区的当前行加上后两行之和。\n\n## 分区列：dept_id 排序列：emp_id\n\n| dept_id\
  \ | emp_id | salary |\n| :--- | :--- | :--- |\n| 销售 | 10 | 6000 |\n| 人力资源 | 7 |\
  \ 3000 |\n| 信息技术 | 5 | 5000 |\n| 销售 | 2 | 6000 |\n| 人力资源 | 3 | 2000 |\n| 人力资源 |\
  \ 4 | 6000 |\n| 信息技术 | 8 | 8000 |\n| 销售 | 9 | 5000 |\n| 销售 | 1 | 7000 |\n| 信息技术\
  \ | 6 | 6000 |\n\n| dept_id | emp_id | salary | sum |\n| :--- | :--- | :--- | :---\
  \ |\n| 销售 | 1 | 7000 | 18000 |\n| 销售 | 2 | 6000 | 17000 |\n| 销售 | 9 | 5000 | 11000\
  \ |\n| 销售 | 10 | 6000 | 6000 |\n| 人力资源 | 3 | 2000 | 11000 |\n| 人力资源 | 4 | 6000 |\
  \ 9000 |\n| 人力资源 | 7 | 3000 | 3000 |\n| 信息技术 | 5 | 5000 | 19000 |\n| 信息技术 | 6 |\
  \ 6000 | 14000 |\n| 信息技术 | 8 | 8000 | 8000 |\n\n### 图 2.11 - 窗口函数示例\n\n以下是每行值如何从前几行计算的解释：\n\
  \n- sum 列的第一行值 = 当前行的 salary 值 + 后两行的值：\n  \n  18,000 = 7,000 + 6,000 + 5,000\n\n\
  - 同样，sum 列的第二行值 = 当前行的 salary 值 + 后两行的值：\n  \n  17,000 = 6,000 + 5,000 + 6,000\n\
  \n- 同样，sum 列的最后一行值 = 当前行的 salary 值 + 后两行的值：\n  \n  8,000 = 8,000 + 0（注意不存在后几行，因此为\
  \ 0）\n\n在图 2.11 中，左侧部分的数据集未经转换。我们首先定义窗口函数。该函数通过对列应用 partitionBy 来对数据集进行分区。此操作根据\
  \ dept_id 列中的唯一值对记录进行分组。然后，它对每个分组记录中的 emp_id 列进行排序。接着，函数通过 rowsBetween 定义窗口的起点和终点。\n\
  \n```\nwindow = Window.partitionBy(\"dept_id\") \\\\\n.orderBy(\"emp_id\").rowsBetween(0,\
  \ 2)\n```\n\n我们将使用聚合 sum 函数和上一行代码中定义的窗口函数，创建一个名为 sum 的新列：\n\n```\ndf.withColumn(\"\
  sum\", func.sum(\"salary\").over(window)).show()\n```\n\n以下输出显示了带有新列 sum 的转换后的数据集：\n\
  \n| dept_id | emp_id | salary | sum |\n|---|---|---|---|\n| 销售 | 1 | 7000 | 18000\
  \ |\n| 销售 | 2 | 6000 | 17000 |\n| 销售 | 9 | 5000 | 11000 |\n| 销售 | 10 | 6000 | 6000\
  \ |\n| 人力资源 | 3 | 2000 | 11000 |\n| 人力资源 | 4 | 6000 | 9000 |\n| 人力资源 | 7 | 3000\
  \ | 3000 |\n| 信息技术 | 5 | 5000 | 19000 |\n| 信息技术 | 6 | 6000 | 14000 |\n| 信息技术 | 8\
  \ | 8000 | 8000 |\n\n在下一节中，我们将看到如何计算滞后值。\n\n#### 如何计算滞后值\n\nSQL 中的 LAG 函数是一种窗口函数，允许您访问同一数据集中前几行的数据，而无需自联接。它对于在同一数据集中将当前行值与前几行的值进行比较特别有用。\n\
  \n用例如下：\n\n- 计算行之间的差异\n- 识别趋势\n- 计算行之间的时间间隔\n\n如图 2.12 所示，数据集包含三列，即 dept_id、emp_id\
  \ 和 salary。我们将创建一个新列 prev。该新 prev 列中的每行值是前一行的值。\n\n## 滞后（LAG）——返回当前行之前的值\n\n| dept_id\
  \ | emp_id | salary |\n|---|---|---|\n| 销售 | 10 | 6000 |\n| 人力资源 | 7 | 3000 |\n\
  | 信息技术 | 5 | 5000 |\n| 销售 | 2 | 6000 |\n| 人力资源 | 3 | 2000 |\n| 人力资源 | 4 | 6000 |\n\
  | 信息技术 | 8 | 8000 |\n| 销售 | 9 | 5000 |\n| 销售 | 1 | 7000 |\n| 信息技术 | 6 | 6000 |\n\
  \n### 分区列：dept_id 排序列：salary_desc\n\n| dept_id | emp_id | salary | prev |\n|---|---|---|---|\n\
  | 销售 | 1 | 7000 | NaN |\n| 销售 | 10 | 6000 | 7000.0 |\n| 销售 | 2 | 6000 | 6000.0 |\n\
  | 销售 | 9 | 5000 | 6000.0 |\n| 人力资源 | 4 | 6000 | NaN |\n| 人力资源 | 7 | 3000 | 6000.0\
  \ |\n| 人力资源 | 3 | 2000 | 3000.0 |\n| 信息技术 | 8 | 8000 | NaN |\n| 信息技术 | 6 | 6000\
  \ | 8000.0 |\n| 信息技术 | 5 | 5000 | 6000.0 |\n\n### 图 2.12 – LAG 示例\n\n让我们逐步了解 LAG\
  \ 值的计算方式：\n\n- prev 列的第一行值 = 前一行的 salary 值：\n  7,000 = NaN（注意不存在前几行，因此为 NaN）\n\n\
  - 同样，prev 列的第二行值 = 前一行的 salary 值：\n  7,000 = 7,000（注意前一行的值为 7,000）\n\n以下代码片段创建窗口，然后在其上计算滞后值：\n\
  \n```\nwindow = Window.partitionBy(\"dept_id\") \\\\\n.orderBy(func.col(\"salary\"\
  ).desc())\ndf.withColumn(\"previousrow_salary\", \\\\\nfunc.lag('salary',1).over(window)).show()\n\
  ```\n\n以下是输出：\n\n| dept_id | emp_id | salary | previousrow_salary |\n|---|---|---|---|\n\
  | 销售 | 1 | 7000 | null |\n| 销售 | 10 | 6000 | 7000 |\n| 销售 | 2 | 6000 | 6000 |\n\n\
  \n\n| sales | 9 | 5000 | 6000 |\n| --- | --- | --- | --- |\n| hr | 4 | 6000 | null\
  \ |\n| hr | 7 | 3000 | 6000 |\n| hr | 3 | 2000 | 3000 |\n| it | 8 | 8000 | null\
  \ |\n| it | 6 | 6000 | 8000 |\n| it | 5 | 5000 | 6000 |\n\n在下一节中，我们将探讨另一个重要的数据操作，即连接。\n\
  \n#### 数据连接\n\n数据连接是机器学习和人工智能项目数据准备阶段中的关键步骤。其重要性源于几个关键因素：\n\n- **全面的数据集**：机器学习模型需要全面的数据集来进行学习。通过连接多个数据源的数据，您可以创建完整且更全面的数据集。这个集成的数据集可以提供更广泛的问题领域视图，提高模型做出准确预测或决策的能力。\n\
  - **特征丰富**：连接数据集可以引入额外的特征（变量），这些特征对模型性能可能至关重要。这些由结合不同数据源而来的新特征可以提供更多洞察，并提高模型学习复杂模式的能力。\n\
  - **增强的上下文理解**：结合数据集可以为机器学习模型使用的数据添加上下文。例如，将客户交易数据与客户人口统计信息连接，可以帮助模型更好地理解购买行为。\n\
  - **数据质量改进**：连接数据还可以帮助识别不同数据源之间的不一致、重复或错误，这些在数据预处理中至关重要，需要加以解决。干净且高质量的数据对于构建有效的\
  \ ML 模型至关重要。\n- **时间序列数据增强**：在时间序列分析中，连接不同来源的数据可以提供额外的时间上下文，这对于预测和异常检测任务可能至关重要。\n\
  - **支持领域特定要求**：在基因组学、机器人学或气候学等专业领域，连接各种数据集通常是满足分析特定要求或遵守领域特定标准所必需的。\n\n总之，数据连接是准备机器学习和\
  \ AI 数据的重要过程。它有助于丰富、清理和增强数据集，从而直接影响最终模型的性能和准确性。\n\n#### 数据连接的类型\n\n有几种数据连接类型用于基于相关列合并两个或多个表中的记录。了解这些不同的连接类型对于有效操作和分析数据至关重要。图\
  \ 2.13 显示了 Apache Spark 支持的最常见的连接类型：\n\n![](img/b40816015a9835648eac2b186dac82d1_66_0.png)\n\
  \n图 2.13 – 各种数据连接类型\n\n以下是这些连接类型的快速概述：\n\n- **内连接**：返回两个表中都具有匹配值的行。如果任一表中的某行没有匹配项，则该行不会包含在结果集中。\n\
  - **左连接**：返回左表的所有行和右表中的匹配行。如果没有匹配项，右侧的结果为 null。\n- **右连接**：返回右表的所有行和左表中的匹配行。如果没有匹配项，左侧的结果为\
  \ null。\n- **全连接**：当左表或右表中有匹配项时返回所有行。此连接结合了左外连接和右外连接的结果。\n- **交叉连接**：返回两个表的笛卡尔积，即将第一个表的每一行与第二个表的每一行组合。此类连接不需要条件，并可能导致输出中产生异常大量的行。\n\
  - **反连接**：返回第一个表中在第二个表中找不到匹配项的行。它是内连接的相反操作。\n\n每种连接类型都有不同的用途，并根据具体任务的数据要求进行选择。了解这些连接的工作原理是关系型数据库操作和数据分析任务的基础。\n\
  \n现在让我们详细讨论图 2.13 中显示的连接。\n\n## 内连接\n\n内连接是 Spark SQL 中的默认连接。它选择两个表中都具有匹配值的行。\n\n\
  图 2.14 解释了内连接操作。如图所示，有两个表，分别名为 Left_Table 和 Right_table。cust_id 列同时存在于两个表中，因此可以用作连接列。\n\
  \n![](img/b40816015a9835648eac2b186dac82d1_67_0.png)\n\n以下代码创建一个 Spark DataFrame，名为\
  \ df_left，包含三个列，分别名为 order_id、customer_id 和 amount：\n\n```\ndf_left = spark.createDataFrame(\n\
  \    [(1001,1,100),(1002,2,200),\n    (1003,3,300),(1004,1,200),(1005,6,200)] ,\n\
  \    [\"order_id\",\"customer_id\",\"amount\"])\ndf_left.show()\n```\n\n以下代码创建一个\
  \ Spark DataFrame，名为 df_right，包含两个列，分别名为 customer_id 和 name：\n\n```\ndf_right =\
  \ spark.createDataFrame(\n    [(1,\"john\"), (2,\"mike\"), (3,\"tony\"), (4,\"kent\"\
  )] ,\n    [\"customer_id\", \"name\"])\ndf_right.show()\n```\n\n以下代码使用 cust_id 列连接两个表：\n\
  \n```\ndf_left.join(df_right, on=\"cust_id\", how=\"inner\").show()\n```\n\n我们得到以下输出：\n\
  \n```\n+-------+----------+------+-----+\n|cust_id|order_id |amount|name |\n+-------+----------+------+-----+\n\
  |      1|     1001|   100| john|\n|      1|     1004|   200| john|\n|      2|  \
  \   1002|   200| mike|\n|      3|     1003|   300| tony|\n+-------+----------+------+-----+\n\
  ```\n\n## 左连接\n\n左连接返回左表的所有值和右表中的匹配值，如果没有匹配项，则追加 NULL。它也称为左外连接。LEFT JOIN 和 LEFT\
  \ OUTER JOIN 是等效的。\n\n图 2.15 解释了左连接操作。在下图中，有两个表，分别名为 Left_Table-1 和 Right_table-1。cust_id\
  \ 列同时存在于两个表中，因此可以用作连接列。\n\n### 左连接\n\n![](img/b40816015a9835648eac2b186dac82d1_68_0.png)\n\
  \n| order_id | cust_id | amount |\n|---|---|---|\n| 1001 | 1 | 100 |\n| 1002 | 2\
  \ | 200 |\n| 1003 | 3 | 300 |\n| 1004 | 1 | 200 |\n| 1005 | 6 | 200 |\n\n| cust_id\
  \ | name |\n|---|---|\n| 1 | john |\n| 2 | mike |\n| 3 | tony |\n| 4 | kent |\n\n\
  | cust_id | order_id | amount | name |\n|---|---|---|---|\n| 6 | 1005 | 200 | NULL\
  \ |\n| 1 | 1001 | 100 | john |\n| 1 | 1004 | 200 | john |\n| 3 | 1003 | 300 | tony\
  \ |\n| 2 | 1002 | 200 | mike |\n\n连接列 未匹配的记录 左表中存在且与右表匹配的记录\n\n图 2.15 – 左连接示例\n\n\
  以下代码使用 cust_id 列连接两个表：\n\n```\ndf_left.join(df_right,on=\"cust_id\",how=\"left\"\
  ).show()\ndf_left.join(df_right,on=\"cust_id\",how=\"left_outer\").show()\ndf_left.join(df_right,on=\"\
  cust_id\",how=\"leftouter\").show()\n```\n\n输出如下：\n\n```\n+-----+---------+--------+------+\n\
  | cust_id|order_id|amount| name |\n+-----+---------+--------+------+\n| 6 | 1005\
  \ | 200 | NULL|\n| 1 | 1001 | 100 | john|\n| 1 | 1004 | 200 | john|\n| 3 | 1003\
  \ | 300 | tony|\n| 2 | 1002 | 200 | mike|\n+-----+---------+--------+------+\n```\n\
  \n## 右连接\n\n右连接会获取存在于右表中的数据，即使左表中没有匹配记录。\n\n图 2.16 解释了右连接操作。在下图中，有两个表，分别名为 Left_Table-1\
  \ 和 Right_table-1。cust_id 列同时存在于两个表中，因此可以用作连接列。\n\n### 右连接\n\n![](img/b40816015a9835648eac2b186dac82d1_69_0.png)\n\
  \n| order_id | cust_id | amount |\n|---|---|---|\n| 1001 | 1 | 100 |\n| 1002 | 2\
  \ | 200 |\n| 1003 | 3 | 300 |\n| 1004 | 1 | 200 |\n| 1005 | 6 | 200 |\n\n| cust_id\
  \ | name |\n|---|---|\n| 1 | john |\n| 2 | mike |\n| 3 | tony |\n| 4 | kent |\n\n\
  | cust_id | order_id | amount | name |\n|---|---|---|---|\n| 1 | 1001 | 100 | john\
  \ |\n| 1 | 1004 | 200 | john |\n| 3 | 1003 | 300 | tony |\n| 2 | 1002 | 200 | mike\
  \ |\n| 4 | NULL | NULL | kent |\n\n图 2.16 – 右连接示例\n\n\n\n\n以下代码使用 cust_id 列连接两个表：\n\
  \n```\ndf_left.join(df_right,on=\"cust_id\",how=\"right\").show()\ndf_left.join(df_right,on=\"\
  cust_id\",how=\"right_outer\").show()\ndf_left.join(df_right,on=\"cust_id\",how=\"\
  rightouter\").show()\n```\n\n输出如下：\n\n| 客户ID | 订单ID | 金额 | 姓名 |\n|---|---|---|---|\n\
