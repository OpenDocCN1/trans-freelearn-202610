  \n### 总结\n\n在本章中，我们了解了数据预处理以及 Spark 如何支持各种数据操作，例如数据摄入、清洗和转换、聚合、数据窗口化以及数据连接。我们通过多个代码示例了解了不同类型的数据操作。\n\
