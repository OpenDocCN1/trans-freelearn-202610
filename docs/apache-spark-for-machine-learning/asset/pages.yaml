- pgno: 214
  md: '# Common evaluation metrics


    Let us look at different evaluation metrics:


    +   **Silhouette score**: As we saw earlier, this measures the similarity of an
    object to its own cluster compared to other clusters. The silhouette score ranges
    from -1 to 1. A high value indicates that the object is well matched to its own
    cluster and poorly matched to neighboring clusters. It’s applicable to K-means,
    bisecting K-means, GMM, and PIC, especially when there’s no ground truth available.


    +   **Davies-Bouldin Index**: A metric that evaluates intra-cluster similarity
    and inter-cluster differences. Lower values indicate better clustering. It’s suitable
    for methods such as K-means, bisecting K-means, and GMM, where defining clusters
    as compact and well-separated is desired.


    +   **Calinski-Harabasz index**: Also known as the **Variance Ratio Criterion**
    (**VRC**), this metric evaluates the ratio of the sum of between-clusters dispersion
    and intra-cluster dispersion for all clusters. Higher values typically indicate
    better-defined clusters and can be used across K-means, bisecting K-means, GMM,
    and PIC.


    +   **Adjusted Rand Index (ARI)**: This measures the similarity between two clusterings
    by accounting for all pairs of samples and counting pairs assigned in the same
    or different clusters in the predicted and true clustering. It’s particularly
    useful when you have a ground truth. ARI can be used for all the mentioned clustering
    techniques when labeled data is available for comparison.


    +   **Normalized Mutual Information (NMI)**: This is a normalization of the **Mutual
    Information** (MI) score to scale the results between 0 (no MI) and 1 (perfect
    correlation). Like ARI, it’s used when ground truth labels are available, making
    it applicable for evaluating all mentioned clustering methods in a supervised
    context.


    +   **Perplexity**: Often used in topic models such as LDA, perplexity measures
    how well a probability distribution predicts a sample. Lower perplexity indicates
    better generalization performance


    +   **Log-likelihood**: This indicates how likely the observed data are given
    the model parameters. Higher values suggest a better model but need to be carefully
    interpreted, especially when comparing models with different numbers of parameters.
    This is used in GMM.


    +   **Dunn Index**: This measures the ratio between the smallest distance between
    observations not in the same cluster to the largest intra-cluster distance. Higher
    values indicate better clustering.


    To use the silhouette score in Spark for evaluating your clustering model, you
    can follow these general steps:


    +   1. Import `ClusteringEvaluator` from Spark MLlib.


    +   2. Instantiate `ClusteringEvaluator`, specifying the metric name as `silhouette`
    if necessary (this is the default metric).'
