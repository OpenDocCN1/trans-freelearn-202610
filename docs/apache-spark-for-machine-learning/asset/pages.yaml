    \ unique identifier\n+   - product ID\n+   - type: just the product type L, M,\
    \ or H\n+   - air temperature [K]\n+   - process temperature [K]\n+   - rotational\
    \ speed [rpm]\n+   - torque [Nm]\n+   - tool wear [min]: The quality variants,\
    \ H/M/L, add 5/3/2 minutes of tool wear to the used tool in the process\n+   -\
