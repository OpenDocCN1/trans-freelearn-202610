    +   - Google Big Query: Google''s serverless, highly scalable, and cost-effective
    multi-cloud data warehouse


    +   - Elasticsearch: A distributed, RESTful search and analytics engine to address
    a growing number of use cases


    Apache Spark can handle a wide variety of data processing scenarios, everything
