  md: '![](img/b40816015a9835648eac2b186dac82d1_234_0.png)


    Figure 7.5 – An overview of collaborative filtering


    In summary, collaborative filtering uses user interactions and similarities to
    provide personalized recommendations, improving user experiences in various domains.


    # The workflow of user-based collaborative filtering


    Personalized recommendations are made by leveraging the preferences and behaviors
    of similar users. This technique is used to recommend items to users based on
    their interests and actions.


    The workflow is as follows:


    +   1. User similarity calculation:


    +   I. First, we create a matrix where each row represents a user and each column
    represents an item (for example, a movie, product, or song).


    +   II. We calculate the similarity between users based on their interactions
    with items. Common similarity metrics include cosine similarity, Pearson correlation,
    or the Jaccard index.


    +   III. Users who have similar preferences (i.e., high similarity scores) are
    considered “neighbors.”


    +   2. Recommendation generation:


    +   I. For a target user (the one we want to recommend items to), we identify
    their neighbors (similar users).


    +   II. We look at the items the neighbors have liked, rated, or interacted with.


    +   III. Items that the neighbors enjoyed but the target user hasn’t seen yet
    become potential recommendations.


    +   IV. The system suggests these items to the target user.


    In summary, user-based collaborative filtering helps personalize recommendations
    by tapping into the collective wisdom of users with similar tastes.'
  merge: -1
  img_proc: true
