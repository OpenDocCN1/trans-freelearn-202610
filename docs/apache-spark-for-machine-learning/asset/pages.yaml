- pgno: 127
  md: 'metrics and their implications can help in refining the model, selecting the
    most appropriate one for a given task, and ensuring that the predictions are useful
    for decision-making. Here’s an in-depth look at the evaluation process and key
    metrics for regression models:


    +   • Mean squared error (MSE): MSE measures the average of the squares of the
    errors – that is, the average squared difference between the estimated values
    and the actual value. It gives a clear idea of how far the regression model''s
    predictions are from the actual values. A lower MSE value indicates a better fit
    of the model to the data. MSE is sensitive to outliers because it squares the
    errors before averaging, which can significantly increase the error value when
    large errors are present.


    +   • Root mean squared error (RMSE): RMSE is the square root of the mean squared
    error. It is one of the most widely used metrics for regression analysis because
    taking the square root brings the scale of the errors back to the original units
    of the output variable, making interpretation easier. Like MSE, RMSE penalizes
    larger errors more heavily, but its units are easier to understand relative to
    the target variable.


    +   • Mean absolute error (MAE): MAE measures the average of the absolute errors
    between the predicted values and the actual observations. It provides a linear
    score that reflects the average magnitude of the errors in the predictions, without
    considering their direction. Unlike MSE and RMSE, MAE is not as sensitive to outliers,
    making it a useful metric when the dataset contains many anomalies or outliers.


    +   • R-squared (R²): The coefficient of determination, or R², measures the variance
    proportion in the dependent variable that can be predicted by the independent
    variables. It explains how well the observed outcomes are replicated by the model,
    based on the proportion of total variation of outcomes explained by the model.
    R² values range from 0 to 1, where 1 indicates a perfect fit and 0 indicates that
    the model doesn''t explain any variability in the target variable. While R² is
    widely used for its interpretability, it can sometimes be misleading, especially
    in models with many predictors or when used outside the context of the data from
    which the model was developed.


    +   • Adjusted R-squared: Adjusted R-squared is a modified version of R² that
    has been adjusted for the number of predictors in the model. Unlike R², which
    can increase as more variables are added to the model, even if those variables
    are not significant, adjusted R-squared will only increase if a new variable improves
    the model more than would be expected by chance. This makes adjusted R-squared
    a more robust measure for comparing models with different numbers of independent
    variables.


    Having looked at the different metrics we can use to evaluate a model, we also
    need to know how to select the right one for our model.'
  merge: -1
  img_proc: true
- pgno: 128
  md: '# Selecting the evaluation metrics


    Choosing the right evaluation metrics for a regression model depends on various
    factors related to the specific context of the problem, the nature of the data,
    and the objectives of the modeling task. Here are some considerations to help
    you select appropriate evaluation metrics for regression models:


    +   - **Nature of the prediction task:**

    +     - **Accuracy importance:** If accurate predictions are crucial and errors
    have significant consequences, consider using metrics that heavily penalize larger
    errors, such as MSE or RMSE

    +     - **Relative error sensitivity:** If understanding errors in proportion
    to actual values is important (for example, in forecasting), metrics such as MAPE
    or **mean absolute scaled error (MASE)** might be more appropriate


    +   - **Data characteristics:**

    +     - **Outlier sensitivity:** If your data is prone to outliers or has a skewed
    distribution, MAE can be a better choice because it’s less sensitive to outliers
    compared to MSE or RMSE

    +     - **Scale dependency:** If the data spans several orders of magnitude, percentage-based
    errors such as MAPE can provide a scale-independent view of the model’s performance


    +   - **Model comparison and complexity:**

    +     - **Comparing models:** If you need to compare models with different numbers
    of predictors, adjusted R-squared can be useful as it adjusts for the number of
    predictors in the model. This is unlike R², which can increase with the number
    of predictors regardless of their contribution to the model.

    +     - **Model complexity:** For models that are at risk of overfitting, consider
    using metrics that can help in regularization, such as the **Akaike information
    criterion (AIC)** or **Bayesian information criterion (BIC)**, which penalize
    unnecessary complexity.


    +   - **Interpretability and communication:**

    +     - **Stakeholder understanding:** Choose metrics that are easy for stakeholders
    to understand and interpret. MAE, for instance, is straightforward and can be
    easily communicated to non-technical audiences.

    +     - **Interpretation ease:** Metrics that are in the same units as the target
    variable, such as MAE and RMSE, can be easier to interpret in the context of the
    problem.


    +   - **Specific objectives or constraints:**

    +     - **Business or domain-specific objectives:** The choice of metric can also
    depend on specific business objectives or constraints. For example, in finance,
    minimizing large errors might be more critical than in other domains, favoring
    the use of RMSE.'
  merge: -1
  img_proc: true
