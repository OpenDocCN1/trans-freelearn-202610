- pgno: 40
  md: 'The main steps in data processing include the following:


    +   1. **Data collection**: The first step involves extracting raw data from various
    sources. Data can be in multiple formats and can include numbers, text, and images.


    +   2. **Data preparation**: This step involves preparing the data for processing.
    It might include sorting the data and organizing it into tables, databases, or
    files.


    +   3. **Data cleaning**: Data cleaning involves filling in the missing values
    through data imputation, where missing values are replaced with substituted values
    such as mean, median, and max. It may also involve removing outliers and correcting
    erroneous, incomplete, irrelevant, or duplicate parts of the data. This step is
    crucial for maintaining the quality of data.


    +   4. **Data transformation**: This involves transforming or converting data
    into a suitable format for analysis. It can also involve normalizing or scaling
    the data, aggregating data points, or converting data types.


    +   5. **Data integration**: If data is gathered from multiple sources, it may
    need to be combined or integrated into a single coherent dataset. This can involve
    merging databases, tables, or files and aligning different data formats.


    +   6. **Data encoding**: This includes converting categorical data into a numerical
    format so that it can be used by machine learning algorithms. Common techniques
    include label encoding and one-hot encoding.


    +   7. **Feature selection and engineering**: This involves identifying the most
    relevant features for the analysis or model and creating new features from the
    existing data, improving the model''s performance.


    Data preprocessing can improve the performance and scalability of machine learning
    models by reducing the complexity and size of data, selecting the most relevant
    features, and handling errors and inconsistencies. Data preprocessing can differentiate
    between a successful and a failed machine learning project. Therefore, applying
    appropriate data preprocessing techniques and tools to data is very important
    before feeding it to machine learning models.


    One example of a failed machine project due to a lack of data preprocessing is
    the **IBM Watson for Oncology** project. The data was not properly cleaned and
    validated, as it contained errors, inconsistencies, and outdated information.
    The data was also not integrated and standardized, as it came from different sources
    and formats, such as medical records, clinical trials, and research papers.


    Now, let''s see how to ingest data for preprocessing.


    # Ingesting data


    Data ingestion is the process of importing and loading data into a system, such
    as a database, a data warehouse, or a data lake. Data ingestion can be done manually
    or automatically, using various tools and techniques. Data ingestion is the first
    step in data analysis and machine learning, as it prepares the data for further
    processing and usage.'
