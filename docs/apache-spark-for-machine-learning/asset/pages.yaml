  md: '# FeatureHasher


    The following code snippet imports all the required functions, creates a Spark
    session, and creates a Spark DataFrame for FeatureHasher:


    ```

    from pyspark.sql import SparkSession

    from pyspark.ml.feature import FeatureHasher, Tokenizer

    spark = SparkSession.builder.appName(

    "FeatureHasher Example").getOrCreate()

    data = [

    (0, "apple", "banana", "orange"),

    (1, "apple", "banana", "cherry"),

    (2, "banana", "cherry", "grape"),

    (3, "apple", "pear", "kiwi"),

    (4, "cherry", "grape", "kiwi")

    ]

    df = spark.createDataFrame(data,

    ["id", "feature1", "feature2", "feature3"])

    df.show(truncate=False)

    ```


