  md: "The following table lists some of the common metrics used to evaluate a recommendation:\n\
    \n| Metric | Definition |\n| --- | --- |\n| Precision at _k_ | Precision at _k_\
    \ is a performance metric used to evaluate the accuracy of a recommendation system.\
    \ It measures the proportion of the first _k_ recommended documents that are truly\
    \ relevant to the user, averaged across all users. Note that the order of the\
    \ recommendations is not considered in this metric. |\n| Mean average precision\
    \ (MAP) | MAP is a measure of how many of the recommended documents are in the\
    \ set of true relevant documents, where the order of the recommendations is taken\
    \ into account (that is, the penalty for highly relevant documents is higher).\
    \ |\n| Normalized discounted cumulative gain (NDCG) | NDCG at _k_ is a metric\
    \ used to measure the relevance of recommended documents in comparison to true\
    \ relevant documents. It calculates the percentage of top _k_ recommended documents\
    \ that are relevant, taking into account the order of recommendations. This means\
    \ that documents are assumed to be in decreasing order of relevance. Unlike precision\
