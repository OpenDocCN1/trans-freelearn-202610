  md: '![](img/b40816015a9835648eac2b186dac82d1_171_0.png)


    # Multiclass classification


    In Apache Spark, for multiclass classification tasks, the MLlib library provides
    several key evaluation metrics that can be used to assess the performance of models.


    Apache Spark’s MLlib offers a variety of evaluation metrics for classification
    tasks, all of which can help assess the performance of models in different ways:


    +   • Confusion matrix: A table showing the actual versus predicted classifications.
    It includes **true positives (TP)**, **false positives (FP)**, **true negatives
    (TN)**, and **false negatives (FN)**, providing a comprehensive overview of the
    model’s performance:


    ![](img/b40816015a9835648eac2b186dac82d1_171_1.png)'
