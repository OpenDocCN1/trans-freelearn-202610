- pgno: 190
  md: '+   • Validation of clusters: Unlike supervised learning, where model performance
    can be evaluated against labeled test data, clustering lacks a clear objective
    measure of success. Validation is often subjective, relying on domain knowledge
    or indirect measures such as silhouette scores or cohesion and separation metrics.


    +   • Ignoring correlations among features: Many clustering algorithms treat features
    as independent, ignoring potential correlations. This can lead to clusters that
    don’t reflect complex relationships in the data. Dimensionality reduction techniques
    such as Principal Component Analysis (PCA) before clustering can help uncover
    these relationships.


    +   • High-dimensional data: Clustering in high-dimensional spaces (the “curse
    of dimensionality”) can be problematic. Distance metrics become less meaningful
    as dimensionality increases, and the sparsity of data points can make it difficult
    to identify dense regions or meaningful clusters. Techniques such as dimensionality
    reduction or using algorithms designed for high-dimensional data can help.


    +   • Algorithm complexity and scalability: Some clustering algorithms can be
    computationally intensive, especially for large datasets or high-dimensional data.
    Scalability becomes a concern in big data applications, necessitating efficient
    algorithms or approximations.


    By being aware of these pitfalls and carefully considering the choice of algorithm,
    parameters, and preprocessing steps, practitioners can mitigate some of the challenges
    associated with clustering techniques, leading to more reliable and interpretable
    clustering outcomes.


    In the next section, you will understand more about clustering algorithms.


    # Learning clustering algorithms


    There are different clustering algorithms available in Apache Spark. Let us now
    understand them in detail.


    # K-means


    K-means is a widely used clustering algorithm in unsupervised machine learning
    that partitions a dataset into K distinct, non-overlapping clusters. It aims to
    minimize the variance within each cluster, essentially grouping data points based
    on their feature space similarities. The “means” in K-means refers to the centroids
    (mean points) of the K clusters, around which the data points are clustered.'
  merge: -1
  img_proc: true
- pgno: 191
  md: '![](img/b40816015a9835648eac2b186dac82d1_191_0.png)


    Figure 6.2 – Overview of K-means clustering


    # How K-means works


    K-mean clustering involves the following steps:


    +   1. **Initialization**: The algorithm starts by randomly selecting K points
    from the dataset as the initial centroids.

    +   2. **Assignment step**: Each data point is assigned to the closest centroid.
    This forms K clusters.

    +   3. **Update step**: The centroids are recalculated as the mean of all points
    assigned to each cluster.

    +   4. **Iteration**: Steps 2 and 3 are repeated until the centroids no longer
    significantly change, indicating convergence.


    # Applications


    K-means can be applied in the following use cases:


    +   • **Customer segmentation**: Businesses use K-means for market segmentation
    by clustering customers based on purchase history, behavior, and preferences to
    tailor marketing strategies and improve customer service.

    +   • **Image compression**: K-means is used in image processing to reduce the
    number of colors in an image. Each cluster centroid represents a color, and pixels
    are assigned to the closest centroid color, significantly reducing the image size
    without substantial loss of quality.

    +   • **Document clustering**: In text mining, K-means helps organize similar
    documents into groups, enhancing information retrieval systems by making it easier
    to find related documents.'
