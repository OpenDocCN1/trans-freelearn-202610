  md: '# Types of data joins


    There are several types of data joins used to combine records from two or more
    tables, based on related columns. Understanding these different join types is
    crucial for effectively manipulating and analyzing data. Figure 2.13 shows the
    most common types of joins supported in Apache Spark:


    ![](img/b40816015a9835648eac2b186dac82d1_66_0.png)


    Figure 2.13 – The various data join types


    Here''s a quick overview of these join types:


    +   - **Inner join**: Returns rows that have matching values in both tables. If
    a row in either of the tables does not have a match, it is not included in the
    result set.

    +   - **Left join**: Returns all rows from the left table and the matched rows
    from the right table. If there is no match, the result is null on the right side.

    +   - **Right join**: Returns all rows from the right table and the matched rows
    from the left table. If there is no match, the result is null on the left side.

    +   - **Full join**: Returns all rows when there is a match in either the left
    or right table. This join combines the results of both the left and right outer
    joins.

    +   - **Cross join**: Returns the Cartesian product of the two tables, which means
    it combines each row of the first table with each row of the second table. This
    type of join does not require a condition and can result in an exceptionally substantial
    number of rows in the output.

    +   - **Anti join**: Returns rows from the first table where no matches are found
    in the second table. It is the opposite of an inner join.'
  merge: -1
  img_proc: true
