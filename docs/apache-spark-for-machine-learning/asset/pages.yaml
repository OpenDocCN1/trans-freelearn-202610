- pgno: 185
  md: '# # Building a Clustering System


    In the evolving landscape of machine learning, unsupervised learning stands as
    a beacon of exploration, where algorithms delve into the raw, unlabeled data,
    seeking patterns, structures, and insights without explicit labels or instructions.
    This chapter is dedicated to the art and science of clustering, a type of unsupervised
    learning that groups data points based on their similarities, revealing the underlying
    structure of the dataset.


    Clustering algorithms are the cartographers of data, charting the hidden territories
    within datasets. They operate under a simple yet profound premise: to group data
    points together that are alike and separate those that differ significantly. This
    seemingly straightforward task is rich with complexity and nuance, as the definition
    of “similarity” can vary widely depending on the context, data type, and desired
    outcomes.


    In this chapter, we explore clustering techniques by examining several algorithms
    to unhide distinct patterns across data landscapes. We delve into their mechanics,
    assumptions, strengths, and limitations. Challenges include determining optimal
    cluster numbers, handling high-dimensional data, and assessing clustering quality.
    Metrics guide evaluation, while practical applications span market segmentation,
    anomaly detection, bioinformatics, and social network analysis. Clustering extracts
    value, informs decisions, and uncovers hidden patterns.


    In this chapter, we will cover the following topics:


    +   - Learning about clustering

    +   - Learning clustering algorithms

    +   - Evaluating the model performance

    +   - Improving the model performance


    By understanding the principles, challenges, and applications of clustering, you’ll
    be equipped to harness its potential in your own work, pushing the boundaries
    of what can be discovered in datasets without predefined labels or structures.'
  merge: -1
  img_proc: true
- pgno: 186
  md: '# Technical requirements


    The code files for this chapter are available on GitHub at https://github.com/PacktPublishing/Apache-Spark-for-Machine-Learning/tree/main/Chapter06.


    # Learning about clustering


    Clustering is a fundamental technique in unsupervised machine learning and data
    mining, aimed at grouping a set of objects in such a way that objects in the same
    group, or cluster, are more like each other than those in other clusters. It’s
    a method of exploratory data analysis used across various fields and applications
    to discover underlying patterns, categorize data, and summarize datasets by grouping
    similar items.


    # Understanding clustering


    Unlike supervised learning, where the model learns from labeled data, clustering
    works with unlabeled data. The goal is not to predict outcomes but to understand
    the data structure by identifying groups or clusters based on data similarity.
    The similarity is often calculated using distance measures such as Euclidean,
    Manhattan, or more sophisticated metrics tailored to the data type.


    Let us understand the working mechanism of clustering by referring to the following
    figure:


    ![](img/b40816015a9835648eac2b186dac82d1_186_0.png)


    Figure 6.1 – Working mechanism of clustering


    After understanding the working mechanism of clustering, let us understand the
    various scenarios where we can apply clustering.'
  merge: -1
  img_proc: true
- pgno: 187
  md: '# When to use the clustering technique


    Clustering can be used in the following scenarios:


    +   - **Exploratory data analysis**: When you''re in the initial stages of data
    analysis and want to understand the underlying structure or patterns in your data,
    clustering can reveal natural groupings, trends, and anomalies without the need
    for predefined labels.


    +   - **No labeled data available**: In cases where you don''t have labeled data
    (that is, you don''t know the category/class of each data point beforehand), clustering
    is a go-to technique as it doesn''t require such labels to group data points based
    on their similarity.


    +   - **Discovering hidden patterns**: If the objective is to uncover hidden patterns
