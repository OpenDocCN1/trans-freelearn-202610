    # # Gaussian Mixture Model (GMM)


    The Gaussian Mixture Model (GMM) is a probabilistic model with the assumption
    that all the data points are generated from a mixture of a finite number of Gaussian
    distributions with unknown parameters. GMMs are a type of mixture model that provide
    a method for representing an underlying, hidden data structure; they are particularly
    well-suited to identifying subpopulations within a given dataset, making them
    powerful tools for clustering, density estimation, and pattern recognition.


    # # Understanding Gaussian Mixture Models


    A GMM is characterized by two main components: the mixing coefficients and the
    components’ Gaussian distributions. Each component distribution is defined by
    its mean and covariance, which determines the location, shape, and orientation
    of the distribution in the data space. The mixing coefficients represent the weights
    of each Gaussian component in the mixture, indicating the proportion of the population
    that belongs to each component.


    GMMs belong to the family of Expectation-Maximization (EM) algorithms, where the
    Expectation step estimates the membership weights of each data point in each cluster
    (based on current parameter estimates), and the Maximization step updates the
    parameters of the Gaussians to maximize the likelihood of the data given these
    memberships.


    In the following figure, three clusters are represented by three Gaussian curves.
    The centroid of each cluster is shown using the vertical dotted line at the center
    of each curve.


    ![](img/b40816015a9835648eac2b186dac82d1_205_0.png)


    Figure 6.13 – Overview of GMM'
