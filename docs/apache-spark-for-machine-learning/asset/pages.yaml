  md: '# # Windowing in Spark


    **Data windowing** is a crucial technique in machine learning and artificial intelligence,
    particularly when dealing with time series data, sequential data, or any data
    where temporal or sequential context is important. It splits the large sequential
    series of data points into smaller sequential series (data windows) to derive
    insights from each of those data partitions. In these domains, windowing helps
    in structuring the data appropriately for analysis and model training. Here is
    how it is applied in ML and AI:


    +   - Feature engineering for time series data:


    +   - **Creating time frames**: Windowing can be used to create fixed-size time
    frames from continuous time series data. For instance, if you have continuous
    sensor data, you can create windows of one-minute intervals to analyze the sensor
    readings in these discrete chunks.


    +   - **Capturing temporal patterns**: By segmenting data into windows, you can
    capture temporal patterns, which are crucial for forecasting models such as ARIMA,
    **Long Short-Term Memory (LSTM)** networks, and **Recurrent Neural Networks (RNNs)**.


    +   - Handling sequential data:


    +   - **Natural Language Processing (NLP)**: In text analysis, windowing techniques
    are used to process words in the context of their surrounding words, which is
    crucial for understanding language structure and meaning.


    +   - **Genomics**: In DNA sequence analysis, windowing helps to analyze specific
    regions of a genome sequence to identify patterns or anomalies.


    +   - Signal processing:


    +   - **Feature extraction from signals**: Windowing is used to extract features
    from audio, ECG signals, or other time-dependent signals for classification or
    analysis tasks.


    +   - **Reducing edge effects in spectral analysis**: In the Fourier Transform
    and related spectral analysis techniques, window functions are used to mitigate
    edge effects, ensuring more accurate frequency domain representations.


    +   - **Anomaly detection**: Windowing can help to identify sudden changes in
    metrics or patterns over time, which is crucial in anomaly detection systems.


    +   - **Data smoothing and noise reduction**: Windowing techniques are used to
    apply moving averages or other filters to smooth out data, reducing noise and
    making underlying patterns more apparent.


    +   - **Real-time data processing**: In streaming data analysis, windowing is
    used to process data in real time, segmenting continuous streams of data into
    manageable, discrete chunks for analysis.'
  merge: -1
  img_proc: true
- pgno: 59
  md: '+   - Window types in ML and AI:


    +   - **Sliding windows**: An overlap between successive windows, commonly used
    in speech and audio processing


    +   - **Tumbling windows**: Non-overlapping, sequential windows, often used in
    real-time analytics


    +   - **Expanding windows**: Start from a fixed point and grow over time, useful
    in cumulative metrics calculation


    # # Why windowing is required and its examples in Spark


    Let''s explore some key reasons why windowing is necessary and beneficial:


    +   - **Performing calculations across rows**: Window functions perform calculations
    across a set of rows related to the current row without collapsing them into a
    single output row, unlike traditional aggregate functions. This is essential for
    analyses where you need to retain individual row details.


    +   - **Data partitioning**: Window functions enable you to partition data into
    groups without altering the row structure of the output. This partitioning allows
    for comparative and aggregate analysis within subsets of data, such as calculating
    sums, averages, or other metrics within each group.


    +   - **Ranking and row numbering**: They provide the ability to rank items within
    a dataset without the need for complex subqueries. Functions such as `ROW_NUMBER()`,
    `RANK()`, and `DENSE_RANK()` are invaluable for tasks such as ranking sales data
    by region or department, identifying top-performing products, or assigning unique
    identifiers to rows based on a specific order.


    +   - **Running totals and moving averages**: Window functions are particularly
    useful for financial and statistical analyses, such as calculating running totals,
    moving averages, or cumulative sums. This capability is essential for time series
    analysis, budgeting, financial reporting, and trend analysis.


    +   - **Accessing previous and next row values**: Functions such as `LEAD()` and
    `LAG()` allow you to access data from preceding or following rows within the same
    result set. This feature is crucial for comparing current row data with previous
    or next rows, such as calculating period-over-period changes in sales or stock
    movements, or detecting sequence patterns.


    Let''s go through some example problems to understand several `groupby` operations.


    # ## Problem 1


    **Problem statement**: How do we calculate a new column for each group whose row
    value is equal to the sum of the current row and the previous two rows?


    As shown in *Figure 2.10*, the dataset consists of three columns – namely, `dept_name`,
    `emp_id`, and `salary`. We create a new column, `sum`. Each row value in this
    new `sum` column is a sum of the current row value, plus two previous row values
    in the `salary` column.'
