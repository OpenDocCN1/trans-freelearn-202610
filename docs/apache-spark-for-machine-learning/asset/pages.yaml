- pgno: 248
  md: '# The basic concepts of frequent patterns and the significance of discovering
    patterns and rules


    Frequent pattern mining (FPM) is a critical task in data mining that involves
    identifying patterns or itemsets that appear frequently within a dataset. These
    patterns are useful for discovering associations, correlations, and structures
    among large sets of data in various domains, such as market basket analysis, web
    mining, bioinformatics, and network security.


    FPM is a powerful tool for data analysis, enabling the discovery of relationships
    hidden in large datasets that are not readily apparent. Its application spans
    numerous domains, helping businesses and researchers extract valuable insights
    from vast amounts of data.


    Let''s understand the visualization of market basket analysis with the help of
    the following diagram. Each box in each of the shopping carts represents an item
    purchased.


    ![](img/b40816015a9835648eac2b186dac82d1_248_0.png)


    Figure 8.1 – An overview of the shopping carts, each filled with different items


    In this diagram, there are three shopping carts filled with various items purchased
    from a grocery store. Each item is represented by a box in the cart. Upon examining
    all the items in the three shopping carts, it is evident that items A, Q, and
    G are present in all three carts. This indicates that items A, Q, and G are frequently
    bought together. Based on this pattern, if someone purchases items A and Q, they
    are recommended to also purchase item G.'
  merge: -1
  img_proc: true
- pgno: 249
  md: 'The key concepts of frequent pattern mining include the following:


    +   - **Itemsets**: An itemset is a collection of one or more items. For example,
    in the context of a supermarket, an itemset might be {milk, bread, butter}.


    +   - **Support**: The support of an itemset refers to the proportion or frequency
    of transactions in a dataset that contains the itemset. It''s a measure of how
    popular or common the itemset is within the given data. For example, if 100 out
    of 1,000 transactions contain {milk, bread}, then the support for the {milk, bread}
    itemset is 10%.


    +   - **Frequent itemsets**: An itemset is considered frequent if its support
    is greater than or equal to a user-specified support threshold. This threshold
    is often set based on the specific requirements of the application.


    +   - **Association rules**: These are implications of the form X => Y, where
    X and Y are itemsets. The rule means that whenever the X itemset is present, the
    Y itemset is likely to be present in a transaction. Two key metrics for association
    rules are as follows:


    +   - **Confidence**: A measure of the reliability of the inference made by the
    rule. For the rule X => Y, it is the proportion of transactions with X that also
    contain Y.


    +   - **Lift**: The lift value measures how much more often X and Y occur together
    than expected if they were statistically independent. A lift value greater than
    1 indicates that X and Y appear more often together than expected, showing a positive
    relationship.


    In this section, we learned about the key concepts of FPM. In the next section,
    we will look at the FPM algorithm.


    # # Frequent pattern mining applications and case studies


    FPM is a critical technique in data analysis that helps uncover hidden structures
    in large datasets. It has a widespread application across various industries,
    enhancing decision-making and strategy formulation. Here are the top applications
