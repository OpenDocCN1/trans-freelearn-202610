    # Reinforcement learning


    Reinforcement learning is a type of machine learning where an agent learns to
    make decisions by performing actions in an environment to achieve a goal. The
    agent learns from the consequences of its actions, rather than from explicit instruction,
    through a system of rewards and punishments. The agent aims to learn a policy
    that maximizes the cumulative reward over time.


    Use cases of reinforcement learning include the following:


    +   - Game playing: Training a computer program to play chess or Go

    +   - Robotics: Teaching a robot to perform tasks in the physical world


    A classic example of reinforcement learning is training an agent to play a game,
    such as chess. In this example, the environment is the chessboard, and the agent
    is the player making decisions on which moves to make. The goal of the agent is
    to win the game. The agent starts with little to no knowledge about the game.
    It does not know the best moves but learns through trial and error. After each
    move, the agent receives a reward (good moves) or a penalty (bad moves). After
    numerous games and learning from the outcomes of various actions, the agent becomes
    proficient at playing chess.


    ![](img/b40816015a9835648eac2b186dac82d1_25_0.png)


    Figure 1.3 – Reinforcement learning'
