    # # Grouped aggregations


    **Grouped aggregation** in data processing, especially in the context of SQL,
    data analytics, and programming languages such as Python, refers to the process
    of performing calculations or statistical operations on a dataset by dividing
    it into subsets or groups. This is particularly useful when you want to analyze
    patterns or compute metrics within specific segments of your data. Grouped aggregations
    are fundamental in data analysis, allowing for detailed and segmented insights
    into datasets. They transform large, detailed datasets into summarized, actionable
    information.'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'Let’s see how grouped aggregation works:


    +   1. **Grouping data**: First, the data is divided into groups based on one
    or more keys. These keys can be columns in a dataset, such as a category, date,
    or region.


    +   2. **Applying aggregation functions**: Once the data is grouped, various aggregation
    functions can be applied to each group independently. Common aggregation functions
    include sum, average (mean), count, maximum, minimum, and standard deviation.


    +   3. **Result**: The result is a new dataset where each group is represented
    by a single row, and the columns contain the aggregated values.


    The following diagram illustrates how you can apply the GroupBy function on various
    columns to group together records, based on a column value. Grouped records are
    shown in the center section.


    Aggregate functions can then be applied to each of these grouped records to get
    group-specific aggregates, as shown in the right-hand section.


