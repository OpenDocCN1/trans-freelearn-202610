    Let''s look at the various code components to understand them:


    +   * **The FeatureHasher model**: We used the FeatureHasher model to generate
    hashed representations of the categorical features. The numFeatures parameter
    was set to 10, meaning that each feature would be hashed into a vector of 10 dimensions.
    Hashing is a technique that maps categorical values to fixed-size vectors.


    +   * **Hashed features**: The resulting features column contains hashed vectors
    for each document:


    ```

    hasher = FeatureHasher(

    inputCols=["feature1", "feature2", "feature3"],

    outputCol="features", numFeatures=10)

    result = hasher.transform(df)

    result.select("id", "features").show(truncate=False)

    ```'
