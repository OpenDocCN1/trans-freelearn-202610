  md: 'For example, if you want to classify fruits such as apples and bananas, you
    need a dataset of images of apples and bananas, where each image has a label indicating
    what fruit it is. The algorithm then learns to recognize the features that distinguish
    apples from bananas and can predict the label for new images it has not seen before.
    One way to perform supervised learning for apples and bananas is to use a **convolutional
    neural network (CNN)**.


    # _Unsupervised learning_


    Unsupervised learning involves training an algorithm on an unlabeled dataset,
    where the algorithm must discover patterns and relationships in data without explicit
    guidance.


    The goal is often to identify hidden structures, group similar data points, or
    reduce the dimensionality of the data.


    Use cases of unsupervised learning include the following:


    +   - **Clustering**: Grouping customers based on their purchasing behavior

    +   - **Dimensionality reduction**: Reducing the number of features in a dataset


    K-means is a popular algorithm used for unsupervised learning.


    Imagine you have a dataset containing information about different types of customers
    in a retail store, but the data does not include any labels or categories for
    these customers. You want to segment these customers into distinct groups, based
    on similarities in their purchasing behaviors, demographics, or other relevant
    features, but you do not have predefined categories for them.


    A K-means algorithm outputs a set of K clusters that group customers with similar
    characteristics together. The following diagram shows several clusters resulting
    from unsupervised training:


    ![](img/b40816015a9835648eac2b186dac82d1_24_0.png)'
