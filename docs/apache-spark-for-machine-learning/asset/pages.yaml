    # Evaluating the model''s performance


    Evaluating the performance of classification models is crucial to understanding
    their effectiveness and suitability for specific tasks. Various metrics have been
    developed to capture different aspects of model performance, each with its unique
    insights and applications.


    # Binary classification


    In Apache Spark, for binary classification tasks, the MLlib library provides several
    key evaluation metrics that can be used to assess the performance of models. These
    metrics help in understanding various aspects of models, including their accuracy,
    precision, recall, and the trade-offs between them. The primary evaluation metrics
    that are available in Spark for binary classification include the following:


    +   Accuracy: While not always the most informative metric for binary classification,
    especially in imbalanced datasets, accuracy measures the proportion of correct
    predictions (both true positives and true negatives) among all predictions made.
    It is calculated as ((TP + TN) / (TP + FP + FN + TN)).


    +   Precision: Precision (or positive predictive value) measures the proportion
    of true positive predictions in all positive predictions made by the model. It
    indicates the model''s accuracy in identifying positive instances. It is calculated
    as (TP / (TP + FP)).


    +   Recall (sensitivity or true positive rate (TPR): Recall measures the proportion
    of true positive predictions out of all actual positive instances. It assesses
    the model''s ability to capture or identify positive instances. It is calculated
    as (TP / (TP + FN)).


    +   F1 score: The F1 score is the harmonic mean of precision and recall. It is
    particularly useful when you need to balance precision and recall.'
  merge: -1
  img_proc: true
- pgno: 170
  md: '+   Area under receiver operating characteristic (ROC) curve (AUC-ROC): AUC-ROC
    is a widely used metric that measures the model’s ability to discriminate between
    positive and negative classes. The ROC curve plots the TPR against the false positive
    rate (FPR) at various threshold settings. The AUC represents the probability that
    a randomly chosen positive instance is ranked higher than a randomly chosen negative
    instance:


    ![](img/b40816015a9835648eac2b186dac82d1_170_0.png)


    Figure 5.11 – ROC curve and AUC


    +   Area under precision-recall curve (AUC-PR): The precision-recall curve is
    particularly informative for imbalanced datasets, where the positive class is
    much rarer than the negative class. AUC-PR summarizes the trade-off between precision
    and recall for different thresholds, with a focus on the performance of the minority
    class.


    To compute these metrics in Spark, you can use BinaryClassificationEvaluator for
    AUC-ROC and MulticlassClassificationEvaluator for precision, recall, F1 score,
    and accuracy. While BinaryClassificationEvaluator is specifically designed for
    binary classification tasks, MulticlassClassificationEvaluator can be used for
    both binary and multiclass classification problems, and you would specify the
    metric name you’re interested in calculating.


    It’s important to choose the evaluation metric(s) that best align with the objectives
    and context of your specific problem, especially while considering factors such
    as class imbalance or the cost of different types of errors (false positives versus
    false negatives). Spark provides the flexibility to calculate and analyze these
    metrics, aiding in thoroughly evaluating and tuning binary classification models.


    The following figure shows the basics of model evaluation. In this example, when
    both the prediction and ground truth are sunny, then it is a true positive:'
  merge: -1
  img_proc: true
