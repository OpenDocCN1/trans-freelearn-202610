  md: "# How bisecting K-means works\n\nThe process of bisecting K-means involves\
    \ repeatedly splitting clusters until the desired number of clusters is achieved.\
    \ The steps can be outlined as follows:\n\n+   1. **Initialization**: Start with\
    \ all data points in a single cluster.\n+   \n+   2. **Bisection**: Select a cluster\
    \ to split. This can be the largest cluster, the one with the highest Sum of Squared\
    \ Errors (SSE), or one that is chosen based on other criteria.\n+   \n+   3. **K-means**:\
    \ Apply the K-means algorithm with K=2 on the selected cluster to split it into\
    \ two sub-clusters.\n+   \n+   4. **Iteration**: Repeat the bisection step, choosing\
    \ from the newly created clusters and the existing ones, until the desired number\
    \ of clusters is reached.\n\nThroughout this process, the algorithm iteratively\
    \ refines the clusters to improve their coherence, using the standard K-means\
    \ optimization criteria of minimizing the within-cluster variance. The following\
    \ diagram shows this process:\n\n![](img/b40816015a9835648eac2b186dac82d1_203_0.png)\n\
    \nFigure 6.12 – Working of bisecting K-means"
  merge: -1
