    # # Latent Dirichlet allocation (LDA)


    LDA is a generative statistical model that explains sets of observations using
    unobserved groups. It helps us understand why certain parts of the data exhibit
    similarities. In the context of text analysis, LDA assumes that documents are
    produced from a mixture of topics, where a topic is understood as a distribution
    over a fixed vocabulary. The key idea is that documents exhibit multiple topics
    to different extents, and LDA aims to uncover these latent topic structures.


    # ## The LDA model


    LDA clusters documents as random mixtures over latent topics, where each topic
    is represented by a distribution over words. LDA assumes the following generative
    process for each document in a corpus.


    # ## Choose a distribution over topics


    For each word in the document, do the following:


    +   - Choose a topic from the document''s distribution over topics

    +   - Choose a word from the topic''s distribution over words'
  merge: -1
  img_proc: true
