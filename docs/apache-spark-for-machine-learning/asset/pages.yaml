    Tokenizer splits the sentence into tokens, using whitespace as the delimiter.


    On the other hand, RegexTokenizer splits the sentence into tokens using the custom
    `\\W+` pattern (which matches non-word characters):


    ```

    tokenizer = Tokenizer(inputCol="text", outputCol="tokens")

