  md: '# # Setting up Apache Spark


    Setting up Apache Spark for local development involves installing Spark on your
    machine and configuring it to run in a standalone mode. Here are the general steps
    to set up Apache Spark for local development:


    > **Note**

    The following instructions assume that you have Java installed on your machine,
    which Apache Spark requires.


    +   1. **Download Apache Spark:**

    +      I. Visit the official Apache Spark website: https://spark.apache.org/.

    +      II. Go to the **Download** section.

    +      III. Choose the Spark version you want to download.

    +      IV. Select the package type. For local development, you can choose the
    **Pre-built for Apache Hadoop** option.

    +      V. Download the tarball (.tgz) or ZIP file containing Spark.


    +   2. **Extract the Spark archive:**

    +      I. Navigate to the directory where you downloaded the Spark archive.

    +      II. Extract the contents of the archive, using a tool like `tar` or a graphical
    tool if you downloaded a ZIP file:


    ```

    tar -xvf spark-3.x.x-bin-hadoop3.x.tgz

    ```


    +   3. **Configure the environment variables:**

    +      I. Open your shell profile configuration file. For example, if you are
    using Bash, edit your `bashrc` file using the following command:


    ```

    ~/.bashrc

    ```


    Alternatively, use this:


    ```

    ~/.bash_profile

    nano ~/.bashrc

    ```


    +   II. Add the following lines to set the environment variables:


    ```

    export SPARK_HOME=/path/to/extracted/spark-3.x.x-bin-hadoop3.x

    exportPATH=$PATH:$SPARK_HOME/bin

    ```'
  merge: -1
  img_proc: true
