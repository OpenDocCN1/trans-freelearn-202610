    +   - Deep learning


    We will now discuss each of these main types in detail.


    # Supervised learning


    In supervised learning, the algorithm is trained on a labeled dataset, and input
    is paired with the corresponding desired label. The goal of supervised learning
    is to develop a predictive model that can accurately map input data to desired
    output labels, making accurate predictions or classifications on new unseen data.


    Use cases of supervised learning include the following:


    +   - **Classification**: Predicting whether an email is spam

    +   - **Regression**: Predicting the price of a house based on its features


    The following diagram shows an example of supervised model training and its output:


    ![](img/b40816015a9835648eac2b186dac82d1_23_0.png)


    Figure 1.1 – An example of supervised learning'
  merge: -1
  img_proc: true
