- pgno: 288
  md: "# Data partitioning\n\nPartitioning in Spark controls the distribution of data\
    \ across the cluster and has a significant impact on the performance of operations\
    \ that involve shuffling data, such as joins, aggregations, and group operations.\
    \ Some of the methods include the following:\n\n+   Custom partitioning: Use custom\
    \ partitioners when you have knowledge about the distribution of your data that\
    \ Spark doesn’t. For example, if certain keys are known to be heavily used, partition\
    \ data such that all records with the same key reside on the same node can minimize\
    \ data shuffling during joins or aggregations.\n\n```\nfrom pyspark.sql.functions\
    \ import col\ndf = df.repartition(col(\"key_column\"))\n```\n\n+   Managing partition\
    \ size: Adjust the number of partitions to avoid having too small or too large\
    \ partitions. Small partitions can lead to excessive overhead in managing many\
    \ small tasks, while too large partitions can cause memory issues and slow task\
    \ performance.\n\n```\n# Repartition to a specific number of partitions\ndf =\
    \ df.repartition(100)\n# Coalesce partitions when reducing the number of partitions\
    \ to minimize shuffling\ndf = df.coalesce(50)\n```\n\n# Caching and persistence\n\
    \nCaching data in memory can significantly improve the performance of your Spark\
    \ jobs, especially if you need to access the same data multiple times for training\
    \ or prediction.\n\n+   Use cache wisely: Decide which datasets need to be cached\
    \ based on their reuse. Caching unnecessarily can lead to excessive memory usage\
    \ and may evict other needed data from memory.\n\n```\ndf.cache()\n```\n\n+  \
    \ Persistence levels: Choose the appropriate storage level depending on your data\
    \ access patterns and memory availability. For instance, use MEMORY_AND_DISK when\
    \ you run out of memory so that Spark can spill data to disk instead of recomputing\
    \ it.\n\n```\nfrom pyspark.storagelevel import (\n    StorageLevel df.persist(StorageLevel.MEMORY_AND_DISK)\
    \ )\n```"
  merge: -1
  img_proc: true
- pgno: 289
  md: "# Broadcast variables\n\nFor small reference datasets that are used frequently\
    \ in Spark operations across multiple nodes, consider using broadcast variables.\
    \ Broadcasting a dataset can optimize the performance of joins between a large\
    \ dataset and a small dataset by keeping a copy of the small dataset on each node.\n\
    \nExplicitly broadcast smaller DataFrame to optimize join operations.\n\nThe Python\
    \ code is as follows:\n\n```\nfrom pyspark.sql.functions import broadcast\nlarge_df.join(broadcast(small_df),\
    \ \"key\")\n```\n\n# Optimize serialization\n\nSerialization plays a crucial role\
    \ in performance, especially when data needs to be shuffled across the network\
    \ or cached to disk.\n\nSpark's Kryo serialization is faster and more compact\
    \ than Java serialization. Enable Kryo and register your custom classes for the\
    \ best results.\n\nThe Python code is as follows:\n\n```\nspark.conf.set(\n  \
    \  \"spark.serializer\",\n    \"org.apache.spark.serializer.KryoSerializer\")\n\
    spark.conf.set(\"spark.kryo.registrationRequired\", \"true\")\n```\n\n# Resource\
    \ allocation\n\nProperly configuring resource allocation is essential, especially\
    \ in a shared environment.\n\nEnable dynamic resource allocation to allow Spark\
    \ to scale the number of executors based on workload.\n\nLet's see the Python\
    \ code:\n\n```\nspark.conf.set(\"spark.dynamicAllocation.enabled\", \"true\")\n\
    spark.conf.set(\"spark.dynamicAllocation.minExecutors\", \"1\")\nspark.conf.set(\"\
    spark.dynamicAllocation.maxExecutors\", \"50\")\n```\n\n# Tuning Spark SQL\n\n\
    For deployments primarily using Spark SQL for data processing, use the following:\n\
    \n+   * **SQL configurations**: Tweak configurations such as spark.sql.shuffle.partitions\
    \ to optimize the performance of operations that involve shuffling."
  merge: -1
