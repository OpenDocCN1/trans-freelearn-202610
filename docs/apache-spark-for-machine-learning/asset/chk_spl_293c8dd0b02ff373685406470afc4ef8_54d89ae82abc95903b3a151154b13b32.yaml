  counter_evidence:
  - 行0-14包含书名、贡献者、关于作者、关于审稿人，均属正文之前的书前内容，按规则“前言、序言、致谢、关于作者等正文之前的内容，统一划分为一章”，不应在行15另起一章而将前面书前材料切分。
  - 行15之后仅为简短介绍段落（行17-19），不具备章节统领后续大量内容的语义特征，更像书前引言正文。
  - 真正的第1章出现在行164，行15与行164之间存在大量书前与概览内容，行15不具备独立章节的完整结构。
