- pgno: 392
  md: "```\nglm::mat4 flipMatrix = glm::rotate(glm::mat4(1.0f),\n    glm::radians(-90.0f),\
    \ glm::vec3(0.0f, 0.0f, 1.0f));\n    localSwapAxisMatrix = glm::rotate(flipMatrix,\n\
    \        glm::radians(-90.0f), glm::vec3(0.0f, 1.0f, 0.0f));\n} else {\n    localSwapAxisMatrix\
    \ = glm::mat4(1.0f);\n}\nglm::mat4 localRotationMatrix = glm::mat4_cast(\n   \
    \ glm::quat(glm::radians(instSettings.isWorldRotation)));\nglm::mat4 localTranslationMatrix\
    \ =\n    glm::translate(glm::mat4(1.0f),\n        instSettings.isWorldPosition);\n\
    ```\n\nThen, the transformation matrices and the root transformation matrix from\
    \ the model file are combined into a single transform matrix:\n\n```\nglm::mat4\
    \ localTransformMatrix =\n    localTranslationMatrix * localRotationMatrix *\n\
    \    localSwapAxisMatrix * localScaleMatrix *\n    mRootTransformMatrix;\n```\n\
    \nTo create the bounding box data, all vertices of the model mesh are transformed\
    \ to the new positions and the positions are added to a local variable named modelAABB:\n\
    \n```\nAABB modelAABB{};\nfor (const auto& mesh : mModelMeshes) {\n    for (const\
    \ auto& vertex : mesh.vertices) {\n        modelAABB.addPoint(localTransformMatrix\
    \ *\n            glm::vec4(glm::vec3(vertex.position), 1.0f));\n    }\n}\n```\n\
    \nFor the w element of the vertex position, the same adjustment as for the level\
    \ data AABB is needed. By setting the last value to 1.0f, we guarantee a correct\
    \ matrix multiplication when computing the final position.\n\nWith the resulting\
    \ AABB, the extents of the non-animated instance vertices are able to detect AABB\
    \ collisions with animated models and to draw the debug lines."
