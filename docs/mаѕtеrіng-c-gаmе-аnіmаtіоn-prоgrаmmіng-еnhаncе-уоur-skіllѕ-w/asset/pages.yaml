  md: '# Adding a Visual Selection


    Lowering the z element of the internal variable gl_Position will adjust the depth
    value of the triangle to the lowest possible value. This depth adjustment makes
    the highlighted instance visible even if other instances are closer to the camera
    position.


    Finally, we add a Boolean variable named rdHighlightSelectedInstance in the OGLRenderData
    respective VkRenderData struct, allowing us to switch the highlight on and off.
    This new variable will be attached to an ImGui checkbox in the User Interface
    class:


    ```

    ImGui::Text("Highlight Instance:");

    ImGui::SameLine();

    ImGui::Checkbox("##HighlightInstance", &renderData.rdHighlightSelectedInstance);

    ```


    In Figure 3.3, the effect of combining highlighting and z position adjustment
    in the vertex shader is shown:


    ![](img/3cfb9832c943f5f7366fd104b5255971_120_0.png)'
