- pgno: 115
  md: "# Creating a button to center the selected instance\n\nFor the new button in\
    \ the user interface, we will follow the previous implementations and add a callback\
    \ for the UserInterface class. The callback calls a method in the renderer class,\
    \ moving the camera calculations related from the user interface to the renderer.\n\
    \nIn the UserInterface class, we add a new ImGui button, plus the new callback,\
    \ using the current instance as parameter:\n\n```\nif (ImGui::Button(\"Center\
    \ This Instance\")) {\n    std::shared_ptr<AssimpInstance> currentInstance =\n\
    \        modInstData.miAssimpInstances.at(\n            modInstData.miSelectedInstance);\n\
    \    modInstData.miInstanceCenterCallbackFunction(\n        currentInstance);\n\
    }\n```\n\nWhen the renderer is initialized, the callback miInstanceCenterCallbackFunction\
    \ will be bound via a lambda function to the new centerInstance() method of the\
    \ renderer:\n\n```\nmModelInstData.miInstanceCenterCallbackFunction =\n    [this](std::shared_ptr<AssimpInstance>\
    \ instance)\n    { centerInstance(instance); };\n```\n\nThe centerInstance() method\
    \ extracts the position of the instance, adds a static offset of 5 units on all\
    \ axes, and calls moveCameraTo() of the camera object:\n\n```\nvoid OGLRenderer::centerInstance(\n\
    \    std::shared_ptr<AssimpInstance> instance) {\n    InstanceSettings instSettings\
    \ =\n        instance->getInstanceSettings();\n    mCamera.moveCameraTo(mRenderData,\n\
    \        instSettings.isWorldPosition + glm::vec3(5.0f));\n}\n```\n\nFinally,\
    \ moveCameraTo() moves the camera to the instance position plus offset given in\
    \ the renderer, and uses fixed values for azimuth and elevation to center the\
    \ selected instance in the middle of the screen:\n\n```\nvoid Camera::moveCameraTo(OGLRenderData&\
    \ renderData,\n    glm::vec3 position) {\n```"
