- pgno: 451
  md: 'After the short round-up of navigation methods, let’s dive into the A* algorithm
    next.


    # The A* path-finding algorithm


    The A* algorithm was published in 1968 in the earlier days of computing. A* is
    the result of the path planning for an AI-controlled mobile robot called Shakey.
    The robot was developed at the Stanford Research Institute. Its software included
    computer vision and natural language processing, and it was able to do simple
    tasks like driving to a place in the lab on its own, without describing every
    single action in advance. A link is available in the Additional resources section
    with more details about the project and the robot.


    But what makes A* different from Dijkstra’s algorithm?




    While Dijkstra’s algorithm only uses the weights between nodes, A* adds a heuristic
    value to every node. The heuristic function calculates an estimated cost of the
    cheapest path from every node to the selected target. In many cases, such as for
    large worlds and many nodes, calculating the minimal costs between every pair
    of nodes is computationally expensive, so an “educated guess” for the costs is
    cheaper to calculate and also good enough.


    For the heuristics function, any distance calculation function can be used. In
    most cases, either the so-called L1 norm will be used, known as the Manhattan
    distance, or the L2 norm, known as the Euclidean distance. Figure 13.5 shows the
    idea behind both distance calculations:


    ![](img/3cfb9832c943f5f7366fd104b5255971_451_0.png)


    Manhattan distance (gray horizontal/vertical arrows) vs. Euclidean distance (green
    diagonal line)'
  merge: -1
  img_proc: true
- pgno: 452
  md: 'The Manhattan distance is modeled after the path of a taxicab in Manhattan.
    The streets are organized in parallel lines, crossing at an angle of 90 degrees.
    Like a cab in Manhattan, the blue paths in Figure 13.5 can only use the grid lines
    between the start and the target. It also does not matter whether we use straight,
    direct lines, as in the dark blue path, or a staircase version, like the light
    blue path; the distance for both paths is identical.


    In contrast, the Euclidean distance for the green path in Figure 13.5 is calculated
    by using the Pythagorean theorem. This means squaring the lengths of the distances
    in both directions, summing up the squares, and calculating the square root of
    the sum.


    Whether Manhattan distance, Euclidean distance, or any other distance calculation
    will be used for the heuristics function of A* heavily depends on the needs of
    the application. For instance, obstacles, hills, or enemies in a game map may
    need to be considered when estimating the distances. An intuitive way to find
    the best function is by drawing the paths for every heuristic function and a set
    of combinations for the start and target node and comparing the results.


    By using the heuristic value to the target node, A* tries to minimize the costs
    of the path to the target for every iteration.


    # Minimizing path costs


    In every iteration, A* uses the sum of the known costs of the path from the start
    node and the estimated costs to the target node for every neighbor of the current
    node to calculate the minimal costs to reach the target node. Then, the algorithm
    chooses the neighboring node with the minimum costs, makes that neighboring node
    the current node, and starts the next iteration.


    In addition, A* saves a reference to the current node in each visited neighboring
    node if the overall cost from the start to the target over this neighbor is minimal
    among all neighboring nodes. Storing the parent node in a node allows backtracking
    to the best path from target to source after the target node has been reached.


    To visualize the algorithm, let’s step through a small example.


    # Exploring the A*algorithm


    Figure 13.6 shows a graph with nodes A, B, C, and D, plus the heuristics table
    from every node to the desired target node, D. The start node, in this case, is
    node A.'
  merge: -1
  img_proc: true
- pgno: 453
  md: '![](img/3cfb9832c943f5f7366fd104b5255971_453_0.png)


    Figure 13.6: A graph to traverse plus estimated distances to the target node,
    D


    We can immediately see the shortest path from node A to node D: ABCD. But for
    the computer, the A* algorithm must walk through the nodes to find this path.


    For the first iteration, we visit the neighbors of node A, as shown in Figure
    13.7:


    ![](img/3cfb9832c943f5f7366fd104b5255971_453_1.png)


    Figure 13.7: Visiting nodes B and C


    Here, we calculate the estimated distance as the sum of the known distance from
    A and the heuristic value of each node. The sum for node B is lower, so we proceed
    to node B. We also remember the parent node for B since A is the direct predecessor
    of B.


    Then, we look at all neighbors of node B, as shown in Figure 13.8:


    ![](img/3cfb9832c943f5f7366fd104b5255971_453_2.png)


    Figure 13.8: Visiting nodes C and D'
  merge: -1
  img_proc: true
- pgno: 454
  md: 'We do the same calculations for node C and sum up the costs from A to B, B
    to C, and the heuristic from C to D. In an optimized version of A*, our search
    could be already over since we reached the target node, D.


    But we continue here by checking the remaining neighbors of node D in case there
    is an even shorter path available. So, we update the parent node of nodes C and
    D, and visit node C as the last yet unvisited neighbor of node D, as shown in
    Figure 13.9:


    ![](img/3cfb9832c943f5f7366fd104b5255971_454_0.png)


    | Node | Heuristic | Parent |

    |------|-----------|--------|

    | A    | 12        | -      |

    | B    | 6         | A      |

    | C    | 2         | B      |

    | D    | 0         | C      |


    Indeed, the path to node D via nodes B and C is much shorter than the path via
    B. So, we set node C as the new parent node for node D. After all the neighboring
    nodes of the target node D have been visited, A* has fulfilled its job to find
    a path from node A to node D.


    By backtracking the parent nodes, we get the path from the target to the start.
    By reversing the node order, we now have the shortest path from the start to the
    target: ABCD.


    As you can see, even in this very simple example, A* cares about the total estimated
    costs to the target when choosing the node to proceed with. If the algorithm learns
    about a shorter distance while working on a node, the parent node used to backtrack
    the best path is also updated. In the Additional resources section, a link to
    a website with a deep dive into A* is available.




    Since we will not have a simple two-dimensional terrain in most maps, a two-dimensional
    grid for navigation cannot be used. Instead, we will use a navigation mesh to
    find a path from a source object to a target object in the virtual world.'
  merge: -1
  img_proc: true
