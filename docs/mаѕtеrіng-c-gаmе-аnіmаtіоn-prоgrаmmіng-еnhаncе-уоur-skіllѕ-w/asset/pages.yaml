- pgno: 374
  md: '# Lightmaps


    Even though the principle of lightmaps was introduced in id Software’s Quake nearly
    thirty years ago, this technique is still in use today. During level creation,
    the light effects of static lights are “baked” into a texture, with bright pixels
    depicting the parts of the level geometry where the light of a static light source
    shines onto a surface, and dark pixels where shadows are on the level surface.


    The lightmap texture is then added as a secondary texture, darkening the areas
    where the light from a light source does not reach the level geometry and simulating
    a shadow. Using a lightmap can drastically speed up light calculations by keeping
    a reasonable visual effect, since less expensive per-pixel calculations are needed.


    # Navigation mesh


    A navmesh, or navigation mesh, is an addition for enemies, NPCs, or any other
    computer-controlled objects. The level geometry will be overlayed with an extra
    mesh made of triangles or other polygons, but only in those places where computer-controlled
    objects should be able to move around. A navmesh accelerates pathfinding for the
    objects and can help to prevent collision checks when placed correctly.


    We will come back to navigation meshes in Chapter 13, when we add simple navigation
    to the instances.


    # Hierarchical level-of-detail


    Model files can include so-called level-of-detail meshes. When drawing models
    that are far away from the camera, the mesh complexity can be lowered without
    affecting the visual quality as the model will cover only a few pixels of the
    screen. By using different mesh resolutions, the overall number of triangles to
    draw the models can be reduced.


    Level data can leverage level-of-detail meshes even more, replacing groups of
    objects with a simpler representation. For example, instead of drawing a large
    number of visually indistinguishable rocks at a great distance, the Hierarchical
    Level-of-Detail (HLOD) version of the same area could be merged to a single mesh
    with adjusted textures, delivering a similar visual quality with a fraction of
    the polygons and textures.


    # Level data may be partial or incomplete


    Your fancy animated 3D model should be fully available all the time, not only
    half of the model, or even less. But for level data, the sheer size of a level
    could be too much for a PC or console to handle at once, especially when taking
    the additional level data into account, like for lighting,'
  merge: -1
  img_proc: true
- pgno: 375
  md: 'navigation, or collision detection. But also texture size and quality, or the
    number and distribution of computer-controlled characters can raise the memory
    requirements by and large. Plus, the currently loaded level part could have much
    more detail, using the available resources to draw the visible area instead of
    keeping invisible and unused data in memory.


    Keeping the immersion for the player alive is part of the level design. The level
    may be hidden behind a winding passage, where none of the two-level parts is visible,
    allowing the game engine to discard the area where the player is coming from and
    loading the part they are heading to. Another widely used example for level switches
    is to use elevators and load new level data as the next floor of a building, spaceship,
    or similar.


    By using precomputed data wisely, the time to render a single frame could be reduced
    to deliver a greater experience to the player. Or the visual details could be
    adjusted with the now unused CPU power, allowing to show more objects on the screen,
    or more detailed objects, while still maintaining the same frame time.


    After the differences between maps and instances are clear, let’s see which file
    formats are mostly used for level data, and how to get game maps.


    # Choosing a file format for a map


    The Open Asset Importer Library knows several old and new formats for 3D character
    models, but – sadly – support for level data is pretty limited.


    We will explore file formats of level files mostly found on the internet first,
    and then look at alternatives if the available formats do not fit our needs.


    # Using levels in file formats supported by Assimp


    A couple of file formats are used to create game level data, either by creating
    data from scratch or by using buildings and landscapes from other games as templates.


    If you want to get some game maps to import, you should check out these websites:


    +   - **Sketchfab**: https://sketchfab.com/

    +   - **Free3D**: https://free3d.com


    On both sites, an enormous number of free and paid animated and non-animated models,
    levels, and assets can be searched and downloaded. Several models come with a
    Creative Commons license, allowing you to use models in free and even commercial
    projects.'
  merge: -1
  img_proc: true
- pgno: 376
  md: 'Usually, you will find levels in the following formats:


    +   - Khronos Group glTF (.glTF/.glb): The open source glTF format can not only
    be used for models like the animated Woman and Man models we are using in the
    chapters, but also entire levels can be exported as glTF files.

    +   - Collada (.dae): Collada is an old but fully open XML-based file format.
    Collada is also managed by the Khronos Group, and even an ISO standard for the
    file format has been created.

    +   - Wavefront (.obj + .mtl): Many levels can be found in the Wavefront file
    format. Files in Wavefront format are pure text (no binary components) and the
    format is well documented and widely supported.

    +   - Universal Scene Description (.usd/.usdz): The **Universal Scene Description
    (USD)** format is quite new compared to the other file formats. USD is also open
    source and well documented, but the support in Assimp is still experimental due
    to the complexity of the file format.

    +   - Autodesk FBX (.fbx): The “Filmbox” format is proprietary and mostly undocumented,
    but tools such as Blender and Assimp can read and write this file format. Using
    FBX is more or less at your own risk as it is possible that only specific versions
    are working as expected.


    If none of these models fits your needs, you may have to extend a file format,
    or even build a custom file format.


    # Extending existing formats or creating a custom format


    Creating new game levels from scratch or modifying existing game levels may require
    additional information that is not available in the original file format, such
    as baked-in light maps, tree data, navigation meshes, or level-of-detail data.
    See the *Level data may contain additional data* section for more information.


    File formats such as glTF have the built-in ability to create extensions, while
    other file formats may be hard or impossible to extend without breaking existing
    importers. In such a case, you could invent your own file format from scratch
    or use a combination of one of the standard file formats for level data and add
    a custom format to store additional data.


    A custom file format was created earlier in this book in the *Adding a YAML parser*
    section of *Chapter 5*: the YAML configuration file to store all settings of the
    models, instances, cameras, collision detection, and node trees. Although we are
    relying on a standard textual format to store the data on disk, the contents of
    the file are tailored to fit the needs of our example application.'
  merge: -1
  img_proc: true
- pgno: 377
  md: 'Storing the same data in a binary format would also be possible, for instance,
    when decoding the text information will take too long.


    But creating an entirely new file format should the last resort since you will
    have to write all the code to read and write the data, keep track of different
    versions of the file format during read and write operations, and maybe even support
    different operating systems and hardware architectures. Maintaining such an organically
    grown file format can become a nightmare.


    A better way is to use standard formats and bundle all files into an archive,
    for instance, into a ZIP file. You don’t have to care about missing files when
    the level is distributed to players or other developers, but at the same time,
    you do not need to reinvent the wheel by creating a new, all-encompassing file
    format.


    Such archives are more common than you might think. Formats such as WAD from the
    original DOOM and PAK/PK2/PK3 for the Quake series were created to collect all
    game data in a single file, and these file types even support patching as files
    in new archives replace files of the same name in old archives.


    Building your own levels


    What if you can’t find a suitable game level map on the internet? You still have
    the option to create a small map by yourself, for instance, with Blender. Creating
    a map is out of the scope of this book, but you will find suitable tutorials and
    videos on the internet. You can find links to two example videos in the Additional
    resources section.


    After we explored the reasons why separating model and level data in the application,
    we will now implement new code for loading and processing level data.


    # Importing a game map


    As the first step to load a level, we will add a new C++ class named AssimpLevel.
    You can think of the AssimpLevel class as a mix of the two classes, AssimpModel
    and AssimpInstance, containing the static vertex data of the model class and dynamic
    properties such as the position, rotation, or scale of the instance class.


    The AssimpLevel class consists of two new files, AssimpLevel.h and AssimpLevel.cpp.
    Both files are in the model folder, but we will borrow most of the methods and
    members from the two classes, AssimpModel and AssimpInstance.


    Let’s do a brief walkthrough of the AssimpLevel class.'
  merge: -1
  img_proc: true
- pgno: 378
  md: "# Adding a C++ class to hold the level data\n\nSince the level and model/instance\
    \ data are so similar, we can reuse parts of the functionality we already have\
    \ in the AssimpModel and AssimpInstance classes, such as loading the model file\
    \ or doing matrix operations.\n\nFor the static data, we can copy the following\
    \ methods and members from the AssimpModel class, exchanging the model part in\
    \ the name with level to be consistent with the class name:\n\n+   - The loadModel()\
    \ method, but without bones, animations, and lookup table creation\n+   - The\
    \ processNode() method, again without the bone-specific part\n+   - The entire\
    \ draw() method\n+   - The getTriangleCount(), getModelFileName(), and getModelFileNamePath()\
    \ methods\n+   - The setModelSettings() and getModelSettings() methods\n+   -\
    \ The mTriangleCount and mVertexCount member variables\n+   - The mRootNode, mNodeList,\
    \ mRootTransformMatrix, mModelMeshes, mVertexBuffers, and mModelSettings member\
    \ variables to store the viable level data\n+   - The mTextures and mPlaceholderTexture\
    \ member variables for the textures\n\nFor the dynamic data, the following methods\
    \ and members can be copied from the AssimpInstance class, again replacing the\
    \ word model with level in the names:\n\n+   - The updateModelRootMatrix() and\
    \ getWorldTransformMatrix() methods\n+   - The mLocalTranslationMatrix, mLocalRotationMatrix,\
    \ mLocalScaleMatrix, mLocalSwapAxisMatrix, mLocalTransformMatrix, and mModelRootMatrix\
    \ member variables\n\nTo have all the variable level data in one location, we\
    \ create the LevelSettings.h file in the model folder, containing the LevelSettings\
    \ struct:\n\n```\nstruct LevelSettings {\n    std::string lsLevelFilenamePath;\n\
    \    std::string lsLevelFilename;\n    glm::vec3 lsWorldPosition = glm::vec3(0.0f);\n\
    \    glm::vec3 lsWorldRotation = glm::vec3(0.0f);\n    float lsScale = 1.0f;\n\
    \    bool lsSwapYZAxis = false;\n};\n```"
  merge: -1
  img_proc: true
- pgno: 379
  md: "As you can see, these level settings are also a mix of data taken partially\
    \ from model settings (filenames) and instance settings (position, rotation, scale,\
    \ axis swap). The LevelSettings data type will be used to simplify the level settings\
    \ in the user interface and to save and load level-related data.\n\nWe also make\
    \ the loaded level data available to other parts of the application by adding\
    \ a vector of AssimLevel shared pointers called micLevels and the micSelectedLevel\
    \ int that holds the currently selected level from the vector:\n\n```\nstd::vector<std::shared_ptr<AssimLevel>>\
    \ micLevels{};\nint micSelectedLevel = 0;\n```\n\nThe main work to manage the\
    \ AssimLevel objects in the micLevels vector will be handled by the renderer class,\
    \ so we add methods and callbacks as the second step.\n\n# Adding callbacks and\
    \ renderer code\n\nSimilarities between the new level functionality and existing\
    \ model functions also continue in the callbacks. Three new callback definitions\
    \ named levelCheckCallback, levelAddCallback, and levelDeleteCallback must be\
    \ added to the Callbacks.h file:\n\n```\nusing levelCheckCallback = std::function<bool(std::string)>;\n\
    using levelAddCallback = std::function<bool(std::string)>;\nusing levelDeleteCallback\
    \ =\n    std::function<void(std::string)>;\n```\n\nFor the models, we have the\
    \ same set of callbacks. The first callback, levelCheckCallback, is used to check\
    \ if a level file with the same name is already loaded, and the other two callbacks,\
    \ levelAddCallback and levelDeleteCallback, are used to load a new level from\
    \ a file and to delete an existing level object.\n\nLike for most of the callbacks,\
    \ we will also make the functions available in the ModelInstanceCamData struct\
    \ in ModelInstanceCamData.h:\n\n```\nlevelCheckCallback micLevelCheckCallbackFunction;\n\
    levelAddCallback micLevelAddCallbackFunction;\nlevelDeleteCallback micLevelDeleteCallbackFunction;\n\
    ```"
  merge: -1
  img_proc: true
