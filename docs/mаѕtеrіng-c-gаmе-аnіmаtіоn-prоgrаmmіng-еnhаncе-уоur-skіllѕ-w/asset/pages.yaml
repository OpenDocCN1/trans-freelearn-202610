- pgno: 251
  md: "# Summary\n\nIn this chapter, we improved animation processing efficiency and\
    \ added gameplay-like controls to map animation clips to the current animation\
    \ state. We started by moving the computational work of animation blending from\
    \ the CPU to the GPU and created lookup tables to reduce the amount of work for\
    \ the GPU (at the cost of memory usage). Then, we added the different movement\
    \ states to the code, including a UI-based mapping between states and animation\
    \ clips. As the last step, we added the new mappings to the YAML configuration\
    \ file, allowing us to save and restore the mappings.\n\nIn the next chapter,\
    \ we will take a closer look at collision detection. After we can move the instance\
    \ in the virtual world, we need to avoid just *running through* other instances\
    \ on the screen. As the first step, we will explore the theoretical background\
    \ of collision detection and discuss the problems of a naive implementation. Then,\
    \ we will add spatial partitioning to the virtual world and instance simplifications\
    \ to reduce the complexity of the collision detection checks. Finally, we will\
    \ implement multi-level collision detection, allowing us to detect collisions\
    \ between instances with minimal costs.\n\n# Practical sessions\n\nThere are some\
    \ additions you could make to the code:\n\n+   - Use root motion to control instance\
    \ movement.\n+   \n+     Instead of moving the position of the instances around\
    \ the virtual world and playing the animation at a specific rate, so-called **Root\
    \ Motion** can be used to let the animation clips control the movement of the\
    \ character. In root motion, the movement of the model’s root bone is coordinated\
    \ by the animation and not by us, allowing a better sync of the feet on the ground.\
    \ However, root motion data must be baked into model animations to work. Updating\
    \ the animations is beyond the scope of the book.\n\n+   - Add a second direction\
    \ for the idle/walk/run mapping.\n+   \n+     Right now, only animations for the\
    \ four main directions (forward, backward, left, and right) plus the special wildcards\
    \ none and any can be configured. Moving diagonally may look a bit awkward when\
    \ the feet are not synchronized with the instance movement."
  merge: -1
  img_proc: true
