- pgno: 61
  md: "classes. The data for the mesh is converted into GLM types, allowing us to\
    \ do a simple upload to the GPU, instead of a time-consuming change at every draw.\n\
    \nNow that we have the basics ready to open a model file, we run into a simple\
    \ but essential problem: The file name for the model file is hardcoded.\n\nRather\
    \ than hardcode the path to our model file for loading, let's add the ability\
    \ to browse for a file. A simple way to load a specific model from a file into\
    \ the application is with an “Open File” dialog, allowing us to choose the file\
    \ we want to import. To achieve the seamless integration of such a dialog into\
    \ the program, we will use an ImGui-based solution, instead of an OS-native dialog.\n\
    \n# Extending the UI with an Open File dialog\n\nImGui can be used to create simple\
    \ UIs like in our animation application, but the code can also be extended to\
    \ build different kinds of tools. For our application, a dialog to choose a file\
    \ on the system is helpful to load models at runtime, freeing us of hardcoding\
    \ the model names in the code or using models as command-line parameters when\
    \ starting the application.\n\nVarious ImGui-based file dialogs exist; a nice\
    \ and easy-to-integrate file dialog can be found in the GitHub repository of Stephane\
    \ Cuillerier at https://github.com/aiekick/ImGuiFileDialog.\n\nFor a simple integration\
    \ of the file dialog, we will use CMake’s FetchContent to download and build the\
    \ code.\n\n# Integrating the file dialog into CMakeLists.txt\n\nFirst, we add\
    \ a new FetchContent block into the CMakeLists.txt file, right below the end of\
    \ the ImGui fetching:\n\n```\nFetchContent_Declare(\n\tfiledialog\n\tGIT_REPOSITORY\
    \ https://github.com/aiekick/ImGuiFileDialog\n\tGIT_TAG v0.6.7\n\tCONFIGURE_COMMAND\
    \ \"\"\n\tBUILD_COMMAND \"\"\n)\n```\n\nWe “short-cut” the configure and build\
    \ commands here, since we only want to have the source code available, instead\
    \ of building a standalone version of the file dialog."
  merge: -1
  img_proc: true
- pgno: 62
  md: "Unfortunately, the initial configuration still needs the location of the ImGui\
    \ headers. Since the `FetchContent` block does not allow setting additional compiler\
    \ options, we need a small hack to alter the value of the CMake property `COMPILE_OPTIONS`\
    \ during the fetch process.\n\nTo do so, we save the current state of `COMPILE_OPTIONS`\
    \ in a new CMake variable called `current_compile_options`. Then, we adjust the\
    \ compile options to include the headers from the ImGui source folder in the search\
    \ list:\n\n```\n```cmake\nget_property(current_compile_options DIRECTORY\n   \
    \ PROPERTY COMPILE_OPTIONS)\nset_property(DIRECTORY PROPERTY\n    COMPILE_OPTIONS\
    \ -I ${imgui_SOURCE_DIR})\n```\n```\n\nNow, we can trigger the download and initialization\
    \ of the file dialog source:\n\n```\n```cmake\nFetchContent_MakeAvailable(filedialog)\n\
    ```\n```\n\nTo avoid further confusion in the build system, we set the `COMPILE_OPTIONS`\
    \ property back to its saved state, and also unset the variable we used to save\
    \ the state:\n\n```\n```cmake\nset_property(DIRECTORY PROPERTY\n    COMPILE_OPTIONS\
    \ ${current_compile_options})\nunset(current_compile_options)\n```\n```\n\nIn\
    \ Visual Studio 2022, a new CMake configuration run is triggered automatically.\
    \ In Eclipse, a new run of CMake must be triggered via the **Build Project** option\
    \ in the right-click context menu of the project.\n\nIncluding the functionality\
    \ of the file dialog is easy; the UI class needs to be extended by only a couple\
    \ of lines.\n\n# Using the ImGui file dialog\n\nWe can place the dialog code anywhere\
    \ in the code of the `createFrame()` method of the `UserInterface` class in the\
    \ `UserInterface.cpp` file within the folder opengl. First, we add an `ImGui::Button`\
    \ named \"Import Model\". This button will open a modal version of the dialog:\n\
    \n```\n```cpp\nif (ImGui::Button(\"Import Model\")) {\n    IGFD::FileDialogConfig\
    \ config;\n    config.path = \".\";\n    config.countSelectionMax = 1;\n    config.flags\
    \ = ImGuiFileDialogFlags_Modal;\n```\n```"
  merge: -1
  img_proc: true
- pgno: 63
  md: "```\nImGuiFileDialog::Instance()->OpenDialog(\n    \"ChooseModelFile\", \"\
    Choose Model File\", \"*.*\",\n    config);\n}\n```\n\nThis button configures\
    \ a special FileDialogConfig property of the file dialog. The config.path entry\
    \ sets the path to open to the current path where the executable was started,\
    \ while countSelectionMax tells the dialog to accept only a single file to be\
    \ selected. Setting flags to ImGuiFileDialogFlags_Modal presents the file dialog\
    \ on top of all other ImGui windows.\n\nWhen the flags are set, OpenDialog() is\
    \ called to open a dialog instance with the internal name \"ChooseModelFile\"\
    \ as the first parameter; the window title \"Choose Model File\" as the second\
    \ parameter; a filter to show all files, regardless of the file extensions, as\
    \ the third parameter; and the configuration property as the last parameter.\n\
    \nSetting the internal name of the dialog to open in the Display() call allows\
    \ us to define multiple open file dialogs, depending on the requirements of the\
    \ program in the specific situation.\n\nRight after the button, the file dialog\
    \ itself is defined:\n\n```\nif (ImGuiFileDialog::Instance()->Display(\n    \"\
    ChooseModelFile\")) {\n    if (ImGuiFileDialog::Instance()->IsOk()) {\n      \
    \  ...\n    }\n    ImGuiFileDialog::Instance()->Close();\n}\n```\n\nThe code for\
    \ the file dialog follows the ImGui coding style. The first if around the Display()\
    \ call returns true if the dialog is shown, that is, after the above \"Import\
    \ Model\" button has been clicked. Then, the dialog code reacts by setting IsOk()\
    \ to true after the \"OK\" button of the dialog has been clicked, allowing us\
    \ to insert actions to take on the selected file. The final Close() call closes\
    \ the dialog when a file has been selected.\n\nBefore we check the return value\
    \ of the file dialog, we take a look at the file extension filter. Showing all\
    \ files could make it difficult to find the file we want to load."
  merge: -1
  img_proc: true
- pgno: 64
  md: "# Adding a filter to show only supported file types\n\nThe filter field of\
    \ the file dialog allows quite complex configurations, but we will check only\
    \ three of them: a single filter, a group of extensions, and a regular expression-style\
    \ filter.\n\n# Adding a single filter\n\nThe code in the Using the ImGui file\
    \ dialog section already shows a single filter:\n\n```\n\".*\"\n```\n\nThis filter\
    \ simply means “anything after the last dot of the file name,” so you will see\
    \ all the visible files in the current folder.\n\nYou can also specify a single\
    \ extension here, and only files with this one extension are shown:\n\n```\n\"\
    .jpg\"\n```\n\n> Note on case sensitivity\n> \n> In Linux, filtering is case sensitive.\n\
    > \n> So, the .jpg filter will not show a file named IMAGE .JPG!\n\n# Adding a\
    \ group of filters\n\nGrouping file extensions into a single filter works by separating\
    \ them with a comma:\n\n```\n\".jpg, .jpeg, .png\"\n```\n\nHowever, this may not\
    \ work as intended – you can still choose only one extension from the group, showing\
    \ only files with the specific extension in the current folder. Allowing only\
    \ one file extension from a group can be used for Save File dialogs, forcing the\
    \ user to choose a specific file format from a list of available formats.\n\n\
    # Adding a regular expression-style filter\n\nThe most useful variant for the\
    \ filter is the regular expression style:\n\n```\n\"Supported Types{.gltf, .glb,\
    \ .obj, .fbx, .dae}\"\n```\n\nHere, the string \"Supported Types\" will be shown\
    \ as a filter in the dialog, and all files with the file extension named in the\
    \ curly braces are shown."
  merge: -1
  img_proc: true
- pgno: 65
  md: "You could also add multiple regular expression filters, separated by commas,\
    \ to create a drop-down list of various file types. This line would enable you\
    \ to choose between a couple of pictures, the textual and binary glTF formats,\
    \ and all files:\n\n```\n\"Pictures{.jpg,.png},Models{.gltf,.glb},All Files{.*}\"\
    \n```\n\nSince the filter field of the OpenDialog() call is a pointer to a character\
    \ array, the filter list could even be created dynamically. Depending on the state\
    \ of the program, the file types you want the user to select, and so on, you can\
    \ present various filter options.\n\nHaving the file dialog open with a (possibly\
    \ limited) amount of file types presented to the user, let’s complete the code\
    \ handling the file selected by the user.\n\n# Loading the model file\n\nIf a\
    \ file was selected and the OK button was pressed, or the file name was double-clicked,\
    \ the name including the full path of the chosen file is available by calling\
    \ GetFilePathName():\n\n```\nstd::string filePathName =\n  ImGuiFileDialog::Instance()->GetFilePathName();\n\
    ```\n\nFor a clear separation of concerns, the UI code does not handle the loading\
    \ process itself. Instead, a simple lambda-based callback is created, and we call\
    \ this callback with the name of the model:\n\n```\nif (modInstData.miModelAddCallbackFunction(\n\
    \    filePathName)) {\n  ...\n}\n```\n\nThe callback to add a new model is defined\
    \ in the file ModelAndInstanceData.h in the model folder:\n\n```\nusing modelAddCallback\
    \ = std::function<bool(std::string)>;\n```\n\nDuring initialization of the renderer,\
    \ the callback function is bound to the method addModel() of the renderer class\
    \ via a lambda:\n\n```\nmModelInstData.miModelAddCallbackFunction =\n  [this](std::string\
    \ fileName) {\n    return addModel(fileName);\n  };\n```\n\nNow, when a file has\
    \ been selected, the renderer is doing all the “dirty work” of importing the new\
    \ model, signaling back if the model import was successful."
  merge: -1
  img_proc: true
- pgno: 66
  md: "Right now, the return value of the callback only adjusts the position in the\
    \ list of models. But it could be used to give feedback to the user – an error\
    \ message popup can be presented if the model file could not be opened, or the\
    \ same model file was already loaded.\n\n# Drawing the model to the screen\n\n\
    The process of drawing the model in the renderer is simple:\n\n+   - Get the smart\
    \ pointer that points to the Assimp model.\n+   - If the model is animated, update\
    \ the animation with the delta time between the last frame and this frame, and\
    \ collect the new bone matrices.\n+   - If the model is not animated, simply get\
    \ the node matrices of the instances.\n+   - Upload the matrix data to the shader\
    \ storage buffer on the shader.\n+   - Issue a draw call to the graphics API.\n\
    \nThe custom classes handle all other steps required to draw the model, like uploading\
    \ the vertex data or binding the correct texture for the mesh to draw next.\n\n\
    Loading and drawing a single file is already cool. But to use the full power of\
    \ Assimp, we will allow adding and deleting different models and model instances\
    \ at program runtime.\n\n# Adding and removing model instances dynamically\n\n\
    Supporting multiple instances from multiple models was done by creating the class\
    \ AssimpInstance in the model folder. Every AssimpInstance contains a smart pointer\
    \ to access its base model, including the nodes and bones. Adding multiple instances\
    \ of the same model requires one of two options to handle nodes and bones: using\
    \ a copy of the node data structures in every instance or sharing the model's\
    \ nodes across all instances.\n\nTo avoid the duplication of all nodes in every\
    \ instance, we will reuse the nodes of the model during the calculation of each\
    \ final node position for the frame.\n\n# Reusing the bones for the sake of simplicity\n\
    \nTo calculate the nodes during animation in the updateAnimation() method, we\
    \ iterate the channels of the clip and use the model's corresponding node:\n\n\
    ```\nfor (const auto& channel : animChannels) {\n    std::string nodeNameToAnimate\
    \ =\n        channel->getTargetNodeName();\n```"
  merge: -1
  img_proc: true
- pgno: 67
  md: "```\nstd::shared_ptr<AssimpNode> node =\n    mAssimpModel->getNodeMap().at(nodeNameToAnimate);\n\
    ```\n\nThe position, rotation, or scale of every node change:\n\n```\nnode->setRotation(channel->getRotation(\n\
    \    mInstanceSettings.isAnimPlayTimePos));\nnode->setScaling(channel->getScaling(\n\
    \    mInstanceSettings.isAnimPlayTimePos));\nnode->setTranslation(channel->getTranslation(\n\
    \    mInstanceSettings.isAnimPlayTimePos));\n}\n```\n\nFor the root node, the\
    \ local transformation of the instance is applied to the root transform matrix\
    \ of the model:\n\n```\nmAssimpMode->getNodeMap().at(\n    mAssimpModel->getBoneList().at(0)->getBoneName()\n\
    \    ->setRootTransformMatrix(\n    mLocalTransformMatrix *\n    mAssimpModel->getRootTranformationMatrix());\n\
    ```\n\nThen, the node properties are used to generate the final position of the\
    \ bone, using the stored offset matrix from the corresponding bone and the local\
    \ transformation matrix of the node.\n\nFirst, we get the node corresponding to\
    \ the bone of the model:\n\n```\nmBoneMatrices.clear();\nfor (auto& bone : mAssimpModel->getBoneList())\
    \ {\n    std::string nodeName = bone->getBoneName();\n    std::shared_ptr<AssimpNode>\
    \ node =\n        mAssimpModel->getNodeMap().at(nodeName);\n```\n\nNext, we update\
    \ the matrix containing the translation, rotation, and scale properties of the\
    \ node (hence the three letters TRS in the name):\n\n```\nnode->updateTRSMatrix();\n\
    ```\n\nCalling updateTRSMatrix() also retrieves the TRS matrix of the parent node\
    \ and multiplies the local TRS matrix by the parent node’s TRS matrix. Combining\
    \ the local TRS matrix with its parent node matrix makes sure that all nodes will\
    \ inherit the transformations from all previous nodes in the model’s skeleton\
    \ hierarchy."
