- pgno: 190
  md: "The method handling the new names is called generateUniqueCameraName(), defined\
    \ in the renderer class. The method has a camera base name as the only parameter.\n\
    \nFirst, we copy the base name, since we will adjust the name during the while\
    \ loop if the camera name is already in use, and define a string named matches\
    \ containing all numbers from zero to nine:\n\n```\nstd::string camName = camBaseName;\n\
    std::string matches(\"0123456789\");\n\nwhile (checkCameraNameUsed(camName)) {\n\
    ```\n\nIn the loop, we check if the camera name already has a number as a suffix.\
    \ If not, we simply append a 1:\n\n```\nconst auto iter = std::find_first_of(camName.begin(),\n\
    \    camName.end(), matches.begin(), matches.end());\nif (iter == camName.end())\
    \ {\n\n    camName.append(\"1\");\n} else {\n```\n\nIf we find a number, then\
    \ we save the camera name without the trailing number into cameraNameString, convert\
    \ the existing camera number to an int, increment the number by one, convert the\
    \ new number back to a string, and combine the original camera name and the new\
    \ number:\n\n```\nstd::string cameraNameString = camName.substr(0,\n    std::distance(camName.begin(),\
    \ iter));\nstd::string cameraNumString = camName.substr(\n    std::distance(camName.begin(),\
    \ iter));\nint cameraNumber = std::stoi(cameraNumString);\ncamName = cameraNameString\
    \ +\n    std::to_string(++cameraNumber);\n}\n}\n```\n\nThis way, we can create\
    \ unique but still understandable camera names when we clone an existing camera."
