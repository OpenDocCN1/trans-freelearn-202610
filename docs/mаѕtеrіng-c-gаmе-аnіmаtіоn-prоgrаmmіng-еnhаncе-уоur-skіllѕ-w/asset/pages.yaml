- pgno: 226
  md: "Then, the offset value is advanced to the next lookup data position before\
    \ storing the next transformation data:\n\n```\noffset += LOOKUP_SIZE;\n```\n\n\
    After all the translation, scaling, and rotation data is stored in the animLookupData\
    \ vector, we can upload the data to the SSBO:\n\n```\nmAnimLookupBuffer.uploadSsboData(animLookupData);\n\
    ```\n\nNow, the animation lookup data for the loaded model is available on the\
    \ GPU. When we need to access the transformation data in the compute shader, we\
    \ can simply bind the SSBO.\n\n# Adjusting the renderer code and the compute shader\n\
    \nTo be able to tell the compute shader which animation to play and/or blend,\
    \ we define a new struct called PerInstanceAnimData in the OGLRenderData.h file\
    \ in the opengl folder for OpenGL:\n\n```\nstruct PerInstanceAnimData {\n    uint32_t\
    \ firstAnimClipNum;\n    uint32_t secondAnimClipNum;\n    float firstClipReplayTimestamp;\n\
    \    float secondClipReplayTimestamp;\n    float blendFactor;\n};\n```\n\nFor\
    \ Vulkan, the file is named VkRenderData.h and resides in the vulkan folder.\n\
    \nHere, we simply store the first clip number plus the timestamp of the current\
    \ frame we want to render from the first clip. Also, a possible second animation\
    \ clip, the time stamp for the second clip, and the blending factor between the\
    \ two clips can be sent to the compute shader.\n\nIn the renderer, we define two\
    \ new private data members:\n\n```\nstd::vector<PerInstanceAnimData> mPerInstanceAnimData{};\n\
    ShaderStorageBuffer mPerInstanceAnimDataBuffer{};\n```\n\nThe mPerInstanceAnimData\
    \ variable stores the clip numbers, time stamp, and blending factor for every\
    \ instance, and mPerInstanceAnimDataBuffer is the CPU-side handle for the animation\
    \ data SSBO."
  merge: -1
  img_proc: true
