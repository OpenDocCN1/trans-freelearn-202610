    \ the boundaries. Add some sliders and callbacks to control the origin and size\
    \ of the virtual world, and make sure the Instance Positions window will be updated,\
    \ too.\n\n+   - Implement an octree plus three-dimensional AABB checks.\n+   \n\
    +   Right now, we are using only two-dimensional bounding boxes for the instances,\
    \ just as if the instances were seen top-down. Extend the quadtree to become an\
    \ octree and add three-dimensional intersection checks between the AABBs of the\
    \ instances.\n\n+   - Speed up the bounding sphere collision check.\n+   \n+ \
    \  Due to the general complexity of the checks – we have to check every sphere\
    \ of the first instance against every sphere of the second instance – the collision\
    \ check is quite slow. Maybe a compute shader can help here. In contrast to the\
    \ bounding box generation, we need only a single yes/no answer per instance to\
