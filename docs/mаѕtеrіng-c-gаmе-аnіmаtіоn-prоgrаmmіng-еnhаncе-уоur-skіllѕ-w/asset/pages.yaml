- pgno: 157
  md: '# 5


    # Saving and Loading the Configuration


    Welcome to Chapter 5! In the previous chapter, we added a separate view mode to
    the application. In this view-only mode, the user interface and selection functionality
    are disabled. Then, we added a simplified and, eventually, a full version of undo/redo
    for the instances. Setting changes to an instance can now be reverted, or reapplied.


    In this chapter, we will add the ability to save the configuration of the application
    to a file. First, we will explore different file types to store the data. After
    considering the pros and cons of each type of file and determining a suitable
    file format, we will dive into the structure of the file format. Then, we’ll implement
    a parser class that will allow us to load and save our configuration. Finally,
    we will load a default configuration at application startup, allowing the user
    to play around with the application.


    For any bigger application, it is crucial to be able to save the current state
    of data that was created or changed, stop the application, and load the data again
    to continue working. It’s also crucial to recover from a hanging or crashed application
    by restoring the latest saved version. You don’t want to risk losing hours of
    your work because the application cannot save the data properly to local or remote
    storage.


    In this chapter, we will cover the following topics:


    +   - Textual or binary file formats – pros and cons

    +   - Choosing a text format to save our data

    +   - Exploring the structure of a YAML file'
  merge: -1
  img_proc: true
- pgno: 158
  md: '+   - Adding a YAML parser

    +   - Saving and loading the configuration file

    +   - Loading a default configuration file at startup


    # Technical requirements


    The example source code for this chapter is in the chapter05 folder, in the 01_opengl1_load_save
    subfolder for OpenGL and 02_vulkan_load_save for Vulkan.


    Before we add save and load functionality to our application, let’s take a look
    at some ways to save the data to a storage device.


    # Textual or binary file formats — pros and Cons


    Whenever you play a game, cut a video, edit a photo, or write a piece of text
    or a book, you will make use of the integrated load and save functions integrated
    with the software you are using. Saving a game at a safe spot, storing a video
    sequence after making a large number of edits, or pressing Ctrl + S every now
    and then in the text editor has become normal to us.


    But have you ever thought about the data that is saved and loaded? You might have
    some questions regarding the following functions, like:


    +   - What needs to be stored to fully restore your latest state?

    +   - What format should be used to save the data?

    +   - What happens if a program is updated? Will I be able to load the saved data?

    +   - Can I read or change the saved file without the original program?


    For all programs you only use, the decision about the format and amount of data
    lies in the hands of their developers. But, for our application, we must decide
    which data needs to be saved, and how to save the data to the storage.


    All types of data formats have pros and cons; here is a short round-up.


    # Saving and loading binary data


    In the early times of the computer era, storage space and computation time were
    expensive, precious, and scarce. To minimize space and time during the save and
    restore process, the data was more or less only a memory dump.


    The data to save was stored in internal data types, into a memory area of the
    computer and then literally copied byte by byte to a floppy disk or a hard drive.'
  merge: -1
  img_proc: true
- pgno: 159
  md: 'Loading the same data was as easy and fast as saving it: read the data from
    the storage device to the computer’s memory (again, byte by byte) and interpret
    it as the same internal data types that were used while saving.


    Let’s take a look at some of the advantages and disadvantages of binary data:


    +   - **Advantages:**

    +     - Files are small.

    +     - Saving and loading the data can be done by just copying the data, leading
    to a higher speed for save and load operations.

    +   - **Disadvantages:**

    +     - To change the data outside the application, special knowledge is needed.

    +     - Corrupted data could cause unpredictable side effects or crashes.

    +     - Updates to the save file format may be hard. *Magic bytes* are needed
    to find the actual version and to map the loaded data to the correct internal
    data types.


    Binary data may not be portable across architectures due to different endianness.
    For this reason, it is generally good advice to avoid binary save files unless
    absolutely necessary. We can still read CONFIG.SYS and AUTOEXEC.BAT files created
    on MS-DOS systems 30 years ago, but the binary save files from spreadsheet calculators
    or word processors of the same time are unusable, at least without the correct
    tools or hard work to reverse-engineer the file format. Outside of well-documented
    and standardized formats, like pictures or sound files, saving binary data will
    cause trouble, as you may not be able to open the binary files on a different
    operating system, or even just a newer version of the same system. Also, loading
    the file on a different CPU architecture, bit width, or endianness will most probably
    fail due to a different memory layout of the data types.


    Since CPU time and storage space are no longer limited, the advantages of text
    formats now clearly outweigh those of binary saves.


    # Saving and loading textual data


    After more and more CPU power, network bandwidth, and storage space became available,
    textual formats started to become the first choice to save data. Developing code
    is much easier when you can create or adjust the saved files with a simple text
    editor, or when you can find errors by printing the text lines to log files.'
  merge: -1
  img_proc: true
- pgno: 160
  md: 'For a text-based save file, the conditions differ from those for a binary save:


    +   • Files are larger, except when they are compressed into a .zip file or similar.
    Then, another transformation step (pack/unpack) is needed.

    +   • Data must be transformed from binary representation to text and back, every
    time the data is loaded and saved.

    +   • Domain-specific knowledge of the file format may be required for larger
    changes, to create a save file from scratch. But for simple value changes, a text
    editor is the only tool we need.

    +   • Corrupted data can be fixed, or the corrupt data elements may be simply
    deleted from the text file. Better to lose only some data than all of it.

    +   • File format updates can be detected by advancing a version number in the
    file, helping the application to use the correct transformations.

    +   • Loading the same file on a computer with a different architecture or operating
    system is no problem at all. The textual representation is the same, and due to
    the transformation from text to binary data types, endianness or data type lengths
    do not matter.

    +   • Some caveats still exist for cross-platform usage, like different path separators
    in Windows and Linux, or the different interpretation of points and commas in
    the locale settings of the system.

    +   • If the configuration needs to be split into multiple files, packing all
    files into a compressed file is the most common way. By adding all configuration
    files in a .zip or .tar.gz file, you end up with only a single file, and save
    some disk space due to the compression.


    Using a textual representation for our save file is the way to go. And, by defining
    a simple file format, it is even possible to create a configuration file by hand.


    But, before we start creating a file format on our own, let’s check some available
    file formats. By using a well-known file format, we can save a lot of time since
    we don’t have to create the functions to parse and write a file.


    # **Choosing a text format to save our data**


    We will look at three popular configuration file formats in this section:


    +   • INI

    +   • JSON

    +   • YAML'
  merge: -1
  img_proc: true
- pgno: 161
  md: 'All three formats find applications in certain fields but may not be suitable
    in others.


    # The INI file format


    One of the oldest formats to store configuration data is the so-called INI format.
    The name comes from the file extension .ini, which is a three-letter abbreviation
    for initialization. An INI file is mostly used to configure programs.


    In the INI file, simple key/value pairs are stored and organized in optional sections.
    A section name is enclosed in square brackets, and the section scope runs from
    the start of the section to the start of another section, or the end of the file.


    Here is an example of a section and some key/value pairs for a database connection:


    ```

    [database-config]

    type = mysql

    host = mysql

    port = 3306

    user = app1

    password = ASafePassword1#

    ```


    Sections can be nested to create some sort of hierarchy by separating sections
    and subsections by special characters, like a dot (.) or a backslash (\). It’s
    crucial for the parser to recognize these section divisions; otherwise, each section
    will be treated independently, without considering their hierarchical relationship.


    The lack of duplicate key names makes it hard to store hierarchical or non-trivial
    data where the same key may occur more than once, like a model file or an instance
    configuration.


    # The JSON file format


    JSON, short for JavaScript Object Notation, made its debut in the early 2000s.
    As in the INI file, key/value pairs are stored in a JSON file. Sections similar
    to the INI file sections do not exist; instead, a JSON file allows the creation
    of complex, tree-like hierarchies. Also, arrays of the same data type can be defined.


    The main usage for JSON files is electronic data interchange, for instance, between
    web applications and backend servers. Good readability of the file format by humans
    is only a side effect; JSON files are mostly read and written by applications.'
  merge: -1
  img_proc: true
- pgno: 162
  md: "This is an example of a JSON file, containing the same data as the INI file\
    \ example:\n\n```\n{\n  \"database-config\": {\n    \"type\": \"mysql\",\n   \
    \ \"host\": \"mysql\",\n    \"port\": 3306,\n    \"user\": \"app1\",\n    \"password\"\
    : \"ASafePassWord1#\"\n  }\n}\n```\n\nSadly, due to the large number of braces,\
    \ the file format is hard to write correctly on the first try. Also, no comments\
    \ are allowed, so testing different options on the fly can only be done by saving\
    \ a copy of the original file and adjusting the content.\n\n# The YAML file format\n\
    \nThe name YAML was originally an acronym for *Yet Another Markup Language*. At\
    \ the start of the 2000s, the *yet another* prefix for a product name was used\
    \ as computer-related humor, stating the ever-growing repetition of unoriginal\
    \ ideas. But, since YAML is not a markup language like HTML or XML, the meaning\
    \ of the name was changed to the recursive acronym *YAML Ain't Markup Language.*\n\
    \nYAML and JSON are closely related. A JSON file can be transformed into a YAML\
    \ file, and vice versa. The main difference between the two formats is that instead\
    \ of using curly braces, the hierarchy in YAML is created by indents.\n\nYAML's\
    \ main goal was to be readable by humans. The YAML format is widely used to create\
    \ and maintain structured and hierarchical configuration files (i.e., in configuration\
    \ management systems and cloud environments).\n\nHere is an example of the YAML\
    \ file format, again with the same data as INI and JSON:\n\n```\ndatabase-config:\n\
    \  type: mysql\n  host: mysql\n  port: 3306\n  user: app1\n  password: ASafePassWord1#\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 163
  md: "Since the YAML format is simple and powerful, has all the features we need,\
    \ and can be read and written without stumbling over missing braces, like in JSON,\
    \ we will use a YAML file to store the configuration data for our application.\n\
    \n# Exploring the structure of a YAML file\n\nLet’s look at the three main components\
    \ of a YAML file:\n\n+   - Nodes\n+   - Maps\n+   - Sequences\n\nLet’s start with\
    \ the node.\n\n# The YAML node\n\nThe main object of a YAML file is a so-called\
    \ node. A node represents the data structure below it, which can be a scalar value,\
    \ a map, or a sequence.\n\nWe use this snippet of a configuration file as an example:\n\
    \n```\ndatabase-config:\n  type: mysql\n```\n\nBoth database-config and type are\
    \ YAML nodes. While the database-config node holds a map containing the key type\
    \ and the value mysql, the node type just has the scalar value mysql in it.\n\n\
    # The YAML map\n\nA YAML map contains between zero and an arbitrary number of\
    \ key/value pairs. Plus, there is an interesting correlation between nodes and\
    \ maps: the key and the value may be another node, creating the hierarchy in the\
    \ file.\n\nLet’s extend the configuration snippet from the node section before:\n\
    \n```\ndatabase-config:\n  type: mysql\n  host: mysql\n  port: 3306\n```"
  merge: -1
  img_proc: true
- pgno: 164
  md: "As stated before, database-config is both a node and a map. The key of the\
    \ map named database-config is the name database-config, and the value is another\
    \ map, containing the three key/value pairs.\n\n# The YAML sequence\n\nTo enumerate\
    \ similar elements, a YAML sequence is used. A sequence can be seen as a C++ std::vector,\
    \ where all elements must be of the same kind. Like the C++ vector, you iterate\
    \ over the sequence, reading the data elements one by one.\n\nSequences come in\
    \ two different flavors: the block style and the flow style.\n\nIn the block style,\
    \ an indented dash (-) is used as an indicator of the elements:\n\n```\ncolors:\n\
    \  - red\n  - green\n  - blue\n```\n\nIn contrast, the flow style uses square\
    \ brackets, and the elements are separated by commas:\n\n```\ncolors: [red, green,\
    \ blue]\n```\n\nBoth styles represent the same data. It is a matter of personal\
    \ preference and readability.\n\nBy combining maps and sequences, complex data\
    \ structures can be created.\n\n# Combinations of maps and sequences\n\nA powerful\
    \ way to represent data can be achieved by mixing maps and sequences. For instance,\
    \ we could store the position and rotation of all our model instances like this:\n\
    \n```\ninstances:\n  - position: [0, 0, 0]\n    rotation: [0, 0, 0]\n  - position:\
    \ [1, 0, -3]\n    rotation: [0, 90, 0]\n  - position: [3, 0, 3]\n    rotation:\
    \ [0, -90, 0]\n```\n\nHere, both combinations of maps and sequences are used."
  merge: -1
  img_proc: true
- pgno: 165
  md: 'First, we create a map out of the keys position and rotation; the values are
    flow-style sequences of numbers, representing a glm::vec3. YAML always stores
    the shortest possible representation of a scalar number. So, as long as values
    have no fractional part, an integer value will be used, even for float and double
    types. Then, the map of position and rotation is used in a block sequence to create
    an array-style representation of the model instances.


    To read the data of the instances into our application, we must first iterate
    over the model instance sequence, and for every instance, we can extract the position
    and rotation values.


    After the basic excurses into the YAML file format, we will now implement a YAML
    parser and writer class for our application to save and load its configuration.
    Having the configuration stored on disk is like saving a text document – we can
    quit the application and continue to work in the virtual world later. We can also
    use the saved files to return to the previous state of the virtual world.


    # Adding a YAML parser


    Like other tools we are already using (the Open Asset Import Library, GLFW, or
    ImGui), we will use a freely available open source solution: yaml-cpp.


    By integrating yaml-cpp, we can read and write YAML files from C++ with minimal
    effort. The biggest step is to make sure our custom data types are known to yaml-cpp.
    Plus, we have to think about a proper structure for the data file.


    Let’s start by exploring how to integrate yaml-cpp into our project.


    # Getting yaml-cpp


    For Linux systems, getting yaml-cpp is easy. Similar to the other tools, most
    distributions already contain the yaml-cpp library and header files. For instance,
    in Ubuntu 22.04 or later, yaml-cpp and its development files can be installed
    with the following command:


    ```

    sudo apt install libyaml-cpp-dev

    ```


    If you are using an Arch based Linux distribution, you can install yaml-cpp with
    the following command:


    ```

    sudo pacman -S yaml-cpp

    ```'
