- pgno: 320
  md: 'In Figure 9.12, the resulting behavior of the tree in Figure 9.9 for the woman’s
    model and a similar tree for the man’s model is shown:


    ![](img/3cfb9832c943f5f7366fd104b5255971_320_0.png)


    > Figure 9.12: Instances living their virtual life


    By default, the models are walking around, reacting to collisions with other instances
    by rotating a bit. After a collision with the world boundaries, the instances
    turn around. After a random time, the instances stop moving, and a random animation
    clip is played. At this point, the normal execution ends, and the root node is
    triggered again.


    Although the node editor looks really cool, and we can add nodes of different
    types, create links, and save and load the state, some limits of the current implementation
    should be noted.




    Our basic implementation lacks some features of other behavior trees.


    First, states are stored directly in the nodes. For the use case of the application
    we are creating, storing state data in the nodes is sufficient. But for larger
    trees, separate state storage becomes handy, mostly because we no longer need
    to copy the node data to the instances.'
