- pgno: 520
  md: 'As the last step, we explored a day/night cycle, weather, and seasons as elements
    to change the environment of the virtual world. Already, a simple cycle of a day
    adds a lot of interesting opportunities to the virtual world, such as only meeting
    computer-controlled characters or animals at a certain time of the day or enemies
    that only appear at night. Weather effects and seasons also multiply the options
    to change behavior depending on the current environment.


    So... what to do next? Well, that’s completely up to you!


    You could start by learning how to use Blender to create your own animated characters,
    animals, objects, and levels. The created assets don’t have to be of the quality
    of recent games; even low-poly worlds are charming and have many fans. There are
    lots of books, tutorials, and videos available, handling many different art styles
    for virtual worlds.


    What about adding more objects? Vehicles and animals would enrich the virtual
    world, and doors and buttons lead to a lot more ways to interact with the world.
    For better gravity, you might even add a physics engine to the application, enabling
    other cool features such as force distribution on collisions between objects.


    You might also explore the world by using a camera with orthogonal projection.
    Watching the player, other characters, and the environment in an isometric projection
    or only from the side could open new ways of expressing a story. Since both the
    isometric projection and the side view are only different views of the three-dimensional
    world, all options mentioned in this chapter also apply when using the orthogonal
    projection.


    Another idea could be the creation of a storyline and quests for the player to
    handle. Forcing the player to move between various locations and interact with
    different characters to unlock more quests, items, or doors, or just to receive
    the next piece of the mental puzzle about a quest could engage the player to stay
    longer in your game.


    Or you could dive into the networking part of SDL and create a small network server,
    allowing you to explore the virtual worlds with your friends. Roaming around the
    levels and solving quests as a team is satisfying and brings new complexity to
    the quest system since you may or may not allow the players to use their shared
    knowledge of a quest over a long distance.


    But this is the most important next step: stay curious and experiment with the
    code.'
  merge: -1
  img_proc: true
- pgno: 521
  md: '# Practical sessions


    Here are some additions you could make to the code:


    +   - Add a button to reload the music tracks from the asset folder.

    +     A nice-to-have feature to dynamically add or remove tracks.

    +   - Add more sound effects for the instances.

    +     You could map a sound clip to every action of the instances, creating more
    realistic effects when controlling the selected instance.

    +   - Play the step sound depending on the floor material.

    +     Here, you need to load more than one pair of footstep sounds for walking
    and running. The appropriate sound effect could be chosen by using the mesh type
    of the ground triangle as the index into the footstep sounds.

    +   - Add sounds for nearby instances.

    +     The SDL_mixer library allows us to set the volume and balance per channel.
    Using the distance and angle of the surrounding instances can be used to calculate
    the effective volume and direction of the sounds.

    +   - Play ambient sound at special places on the map.

    +     Similar to the waypoint models, you could use small models as markers to
    play an ambient sound. And like the sounds for nearby instances, the volume and
    balance of the ambient sound can be adjusted to match the expectation.

    +   - Add markers for music changes.

    +     This task is closely related to the ambient sound. You could use models
    and/or nodes to switch the music when your controlled instance enters a specific
    area of the map or interacts with other instances.

    +   - Adjust level color and fog depending on the level location.

    +     Not only can the music be changed when roaming through the level; also,
    the light and fog settings can be adjusted. For instance, when entering a cave,
    the ambient light can be lowered and the fog density can be raised.'
  merge: -1
  img_proc: true
