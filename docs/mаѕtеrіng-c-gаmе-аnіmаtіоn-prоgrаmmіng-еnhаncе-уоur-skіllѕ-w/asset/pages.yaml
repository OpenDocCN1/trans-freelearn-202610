- pgno: 310
  md: 'For the second callback function, a lambda in the SingleInstanceBehavior class
    is used to connect the state update request to a local method:


    ```

    mFireNodeOutputCallback = [this](int pinId)

    { updateNodeStatus(pinId); };

    ```


    Inside updateNodeStatus(), some simple logic changes the active state of the nodes
    by using the pinId given as a parameter. Following the rule “output first, input
    second” for the link IDs of imnodes and the integer division of the pin ID, we
    could detect if the signal came from an input or output pin and even find the
    node that called updateNodeStatus().


    If updateNodeStatus() receives a call with an output pin ID as a parameter, all
    connected child nodes will be activated. If no connected child node is found on
    the output pin, we inform the parent node about a finished execution. This special
    handling is only relevant for a sequence node right now, enabling us to skip output
    pins without a connection.


    For an input pin as a parameter, the corresponding node connected to that input
    pin will be informed. This is only needed at the end of the execution of a child
    node of a sequence node right now, but the functionality can be extended for new
    node types.


    Without logging calls and comments, the entire updateNodeStatus() method is just
    about forty lines short, but it still does the main job of the entire behavior
    tree implementation.


    To simplify the creation of new nodes, we will use the factory pattern. A node
    factory encloses all the logic needed to create a new node of a specified type
    in one place. Plus, we will enhance the editor with a context menu and the ability
    to switch between different node trees.


    # Adding a node factory


    The factory pattern is a nice solution to create objects of classes derived from
    a single base class, keeping all parts of the creation logic in a single place.


    The factory class GraphNodeFactory in the graphnodes folder is small and simple,
    similar to other factory classes. At the creation time of a factory object, the
    appropriate fireNodeOutputCallback is injected into the constructor, helping us
    to add the right callback destination to all new nodes. The constructor also adds
    a mapping between all node types and the names in the title area of the nodes.
    This name mapping frees us from adding the node name at node creation time; we
    only need the node type and a unique node ID to build a new node.


    The makeNode() method does all the work by creating a new derived class according
    to the given node type, adding the callback, the mapped node name, and the node
    type of the chosen derived'
