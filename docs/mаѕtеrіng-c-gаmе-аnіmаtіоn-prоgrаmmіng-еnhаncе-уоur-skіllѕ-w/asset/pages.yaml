  md: "# Adjusting camera configuration load and save\n\nTo load and save the new\
    \ camera settings, we have to change the YAML parsing and emitting in the Yam1Parser\
    \ class in the tools folder.\n\nDecoding a YAML camera node can be achieved similarly\
