  md: "# Reading back the model settings in the renderer\n\nSaving the model settings\
    \ is entirely done by the YAML emitter; no changes to the saveConfigFile() method\
    \ of the renderer are needed. To get the model settings back into the application\
    \ in the loadConfigFile() method, we use the getModelConfigs() method of the YAML\
    \ parser:\n\n```\nstd::vector<ModelSettings> savedModelSettings =\n    parser.getModelConfigs();\n\
    ```\n\nThen, we loop over the contents of the vector and we try to add the models\
    \ using the file name and path found in the loaded model settings:\n\n```\nfor\
    \ (const auto& modSetting : savedModelSettings) {\n    if (!addModel(modSetting.msModelFilenamePath,\n\
    \        false, false)) {\n        return false;\n    }\n}\n```\n\nIf the model\
    \ cannot be loaded, we stop the loading process. If we want to have more relaxed\
    \ file handling in case of errors, we can store the models that failed to load,\
    \ skip the instances of the failed models, and inform the user in a dialog that\
    \ an error has occurred.\n\nNext, we get the model by the file name again and\
    \ restore the model settings:\n\n```\nstd::shared_ptr<AssimpModel> model =\n \
    \   getModel(modSetting.msModelFilenamePath);\nmodel->setModelSettings(modSetting);\n\
    ```\n\nFinally, we restore the model that was selected when the configuration\
    \ was saved:\n\n```\nmModelInstCamData.micSelectedModel =\n    parser.getSelectedModelNum();\n\
    ```\n\nNow, all animation clip mappings and the state sequences are restored.\
    \ The application user can take a break from creating a virtual world at any time\
    \ without losing progress.\n\nWith the additions from this chapter, we can bring\
    \ the instances on the screen to life. Depending on the available animations in\
    \ the model file, the instance can not only walk and run, but also do additional\
    \ actions like jumping up or forward, rolling around, punching targets, waving,\
    \ or interacting with the environment. The animations are also blended between\
    \ the different movements and actions, creating a game-like feeling."
