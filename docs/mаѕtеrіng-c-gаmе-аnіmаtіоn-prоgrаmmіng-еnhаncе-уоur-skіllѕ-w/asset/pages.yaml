  md: 'Now you should see a window with a visible grid – the node editor. All imnodes
    and ImGui calls are available in this context, although it is not possible to
    draw ImGui elements directly onto the node editor as they will overlay the node
    editor elements.


    To end the node editor and the ImGui window, we call EndNodeEditor() just before
    ending the ImGui window. If we want to have a transparent mini map of the entire
    node editor window shown on the top left of the window, we can call MiniMap()
    before ending the editor:


    ```

    ImNodes::MiniMap();

    ImNodes::EndNodeEditor();

    ImGui::End();

    ```


    At this point, the node editor window will look like Figure 9.3:


    ![](img/3cfb9832c943f5f7366fd104b5255971_295_0.png)


    Figure 9.3: A fresh node editor window


    Inside the node editor window, new nodes can be created. For a small example,
    we will hardcode all properties into the node. In the section Extending the node
    editor, a context menu will be added, allowing us to create and delete nodes at
    runtime.'
