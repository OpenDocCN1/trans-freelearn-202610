- pgno: 508
  md: '# Hands-on: Adding a skybox to the virtual world


    A virtual sky is a great addition to a virtual world, especially above any open
    areas, as shown in Figure 14.5.


    # Exploring the technical details


    From the technical side, a skybox is drawn from a texture applied on the inside
    of a unit cube. Figure 14.12 shows the cube and the coordinates around the virtual
    camera placed in the center of the cube:


    ![](img/3cfb9832c943f5f7366fd104b5255971_508_0.png)


    Figure 14.12: The sampled area from the inside of a cubemap


    In Figure 14.12, the red area of the cube will be sampled to create the background
    of the current frame. Note that the area is wrapping around the corner of the
    cube, but that is nothing to worry about. Both graphics libraries take care of
    such edge cases (pun intended) and will sample the respective areas of the two
    affected cube sides.


    The cubemap texture is usually stored as a set of six separate images or as a
    single image with the sides of the cube at specific locations in the image. Figure
    14.13 shows a skybox texture made by Jockum Skoglund (aka hipshot – https://opengameart.org/content/stormy-days-skybox)
    in a commonly used format plus the cube faces:'
  merge: -1
  img_proc: true
- pgno: 509
  md: '![](img/3cfb9832c943f5f7366fd104b5255971_509_0.png)


    On the left side of Figure 14.13, an example cubemap texture for a skymap is shown.
    You will find many cubemap textures as this kind of cross. On the right side of
    Figure 14.13, the cube faces for each of the smaller sub-images of the cubemap
    texture are listed. Remember that OpenGL and Vulkan with an inverted viewport
    have the negative Z-axis pointing into the virtual world, hence -Z for the front
    image.


    Another noteworthy detail is the distortion of a cubemap image. Since the cubemap
    texture is applied to a cube but the virtual sky around us can be seen as a sphere,
    pixels of a cubemap texture must be adjusted to appear as if the image was taken
    with a camera inside a sphere.


    In Figure 14.14, the discrepancy between the projection inside a cube and inside
    a sphere is shown:


    ![](img/3cfb9832c943f5f7366fd104b5255971_509_1.png)


    As you can see on the left side of Figure 14.14, the difference between a sample
    point taken from the cubemap and the position on the surface of the sphere gets
    larger the more we get near the edge of one side of the cubemap. On the right
    side of Figure 14.14, an area sampled from the cubemap and the required projection
    onto the surface of a sphere are highlighted as black bars. You can see that both
    the size and the angle of the areas differ. When building a cubemap texture for
    a skybox, a spherical distortion of the images for each of the cube faces must
    be applied to create a plausible sky.'
  merge: -1
  img_proc: true
- pgno: 510
  md: "# # Implementing the skybox\n\nAdding the skybox to the code needs only a few\
    \ components:\n\n+   - New vertex and mesh types\n+   - A new vertex buffer\n\
    +   - A unit cube model containing the coordinates of the faces.\n+   - A new\
    \ shader\n+   - Loading a cubemap texture from a file\n\nWe start with creating\
    \ a new vertex type called OGLSkyboxVertex and a new mesh type called OGLSkyboxMesh\
    \ in the OGLRenderData.h file in the opengl folder:\n\n```\n```cpp\nstruct OGLSkyboxVertex\
    \ {\n    glm::vec4 position = glm::vec(0.0f);\n};\n\nstruct OGLSkyboxMesh {\n\
    \    std::vector<OGLSkyboxVertex> vertices{};\n};\n```\n```\n\nAs always, for\
    \ Vulkan, the two new struct elements must be added to the VkRenderData.h file\
    \ in the vulkan folder. For all the details of the Vulkan implementation, check\
    \ the renderer class file, VkRenderer.cpp.\n\nWhile we could reuse the vertex\
    \ buffer of the models, doing so would waste a lot of resources since the cube\
    \ only needs the position data for the vertices. The new vertex buffer class called\
    \ SkyboxBuffer uses only the position element of the new vertex, struct OGLSkyboxVertex:\n\
    \n```\n```cpp\nglVertexAttribPointer(0, 4, GL_FLOAT, GL_FALSE,\n    sizeof(OGLSkyboxVertex),\n\
    \    (void*) offsetof(OGLSkyboxVertex, position));\n\nglEnableVertexAttribArray(0);\n\
    ```\n```\n\nFor the cube model, we create a class called SkyboxModel returning\
    \ an OGLSkyboxMesh consisting of 36 vertices, using two triangles for each side.\
    \ In all three axes, the model coordinates are either 1.0 or -1.0, defining a\
    \ unit cube."
  merge: -1
  img_proc: true
- pgno: 511
  md: '# Chapter 14


    The new vertex shader named skybox.vert outputs a vec3 with 3-dimensional texture
    coordinates. We need 3-dimensional coordinates here since we are inside a cube:


    ```

    layout (location = 0) out vec3 texCoord;

    ```


    In the main() method of the vertex shader, we invert the projection matrix and
    transpose the view matrix first:


    ```

    mat4 inverseProjection = inverse(projection);

    mat3 inverseView = transpose(mat3(view));

    ```


    For the view matrix, we can use a cheaper transpose operation instead of taking
    the inverse matrix since we need to get rid of the translational part to stop
    the cube moving around with the camera.


    By multiplying the inverse matrices with the incoming point positions of the cube,
    we calculate the texture coordinates in world space:


    ```

    texCoord = inverseView * (inverseProjection * aPos).xyz;

    ```


    Now, the texture coordinates to sample are from the inside of the cube, as shown
    in Figure 14.12.


    As the last step for the vertex shader, we set the GLSL-internal variable gl_Position
    to the incoming vertex position:


    ```

    gl_Position = aPos.xyww;

    ```


    By setting the z component of gl_Position to the value of the w component, we
    make sure to draw the pixels of the cubemap on the far-Z plane, creating a background
    that will not be overwritten by other pixels.


    The new fragment shader, skybox.frag, uses the incoming texture coordinates to
    look up the texture data in the cubemap:


    ```

    layout (location = 0) in vec3 texCoord;

    layout (location = 0) out vec4 FragColor;

    uniform samplerCube tex;

    void main() {

    FragColor = texture(tex, texCoord);

    }

    ```


    Please note that the type of the texture tex is a samplerCube and not a sampler2D
    like on the other fragment shaders.'
  merge: -1
  img_proc: true
- pgno: 512
  md: 'Loading the cubemap texture is done in the Texture class. In the new loadCubemapTexture()
    method, we load an image shown in Figure 14.13 and extract the six images. And
    since the values of the values of the texture map side definitions are in ascending
    order, we can just use the first side definition GL_TEXTURE_CUBE_MAP_POSITIVE_X
    and add an integer value for the remaining sides to upload:


    ```

    glTexImage2D(GL_TEXTURE_CUBE_MAP_POSITIVE_X + face, 0, GL_SRGB8_ALPHA8, cubeFaceWidth,
    cubeFaceHeight, 0, GL_RGBA, GL_UNSIGNED_BYTE, subImage.data());

    ```


    For the full implementation of the cubemap texture loading, please check the details
    in the Texture class.


    # Drawing the skybox


    Bringing the skybox to the screen is now done in two steps. First, we upload the
    unit cube model data to the vertex buffer in the init() method of the OGLRenderer.cpp
    renderer class file:


    ```

    mSkyboxModel.init();

    OGLSkyboxMesh skyboxMesh = mSkyboxModel.getVertexData();

    mSkyboxBuffer.uploadData(skyboxMesh.vertices);

    ```


    Then, before drawing the level data, we draw the skybox by using the new shader,
    binding the texture and drawing the cube from the vertex buffer:


    ```

    mSkyboxShader.use();

    mSkyboxTexture.bindCubemap();

    mSkyboxBuffer.bindAndDraw();

    mSkyboxTexture.unbindCubemap();

    ```


    For Vulkan, we also upload the skybox model and the texture in the init() method
    of the VkRenderData.cpp file, bind the skybox pipeline, and draw the skybox model
    before the level data in the draw() method.


    For both OpenGL and Vulkan renderers, a simple change should be made when drawing
    the skybox as the first object: disabling the depth test function. Without the
    depth test, the skybox texture overwrites all values of the previous color buffer,
    acting as the global background for the remaining objects, such as level data
    and instances. And that’s all.'
  merge: -1
  img_proc: true
