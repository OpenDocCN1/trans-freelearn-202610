- pgno: 492
  md: 'At the termination time of the application, the cleanup() method of the AudioManager
    is called by the cleanup() method of the Window class. Inside the cleanup() method
    of the AudioManager class, we close the audio device and signal both SDL_mixer
    and SDL to run their respective cleanup code:


    ```

    Mix_CloseAudio();

    Mix_Quit();

    SDL_Quit();

    ```


    Note that we did not call Mix_Init() in the init() method, but we have to call
    Mix_Quit() here. SDL manages the mixer initialization for us without an explicit
    call to Mix_Init().


    Now we are ready to play music and sound effects. Let’s start with a look at the
    music replay code.


    # Controlling music replay


    Loading a music track is done by calling Mix_LoadMUS() with the C-style character
    array as a parameter:


    ```

    Mix_Music* music = Mix_LoadMUS(fileName.c_str());

    ```


    SDL_mixer supports several music formats, such as WAV, MP3, and OGG. The return
    value of Mix_LoadMUS() is a pointer to the Mix_Music struct.


    To clean up a loaded music track, Mix_FreeMusic() must be called with the pointer
    to the above Mix_Music struct:


    ```

    Mix_FreeMusic(music);

    ```


    A music track can be played by calling Mix_PlayMusic() with two parameters:


    ```

    Mix_PlayMusic(music, 0);

    ```


    The first parameter is a pointer to a valid Mix_Music struct, while the second
    parameter tells SDL_mixer the number of loops to play. A loop value of 0 disables
    looping and a value of -1 will loop the music infinitely.


    Stopping the music is done by calling Mix_HaltMusic():


    ```

    Mix_HaltMusic();

    ```


    Since there is only one music track playing at a time, no parameters are needed,
    and in case the current track should be paused or resumed, the two Mix_PauseMusic()
    and Mix_ResumeMusic() calls are available:


    ```

    Mix_PauseMusic();

    Mix_ResumeMusic();

    ```'
  merge: -1
  img_proc: true
- pgno: 493
  md: 'Finally, the music volume is controlled by Mix_VolumeMusic():


    ```

    Mix_VolumeMusic(volume);

    ```


    The parameter for Mix_VolumeMusic() is an int value between 0 and 128 to set the
    new volume, or a value of -1 to query the current volume of the music.


    By using the default SDL_mixer calls, we can only play one music track once or
    with an infinite number of loops. If a dynamic music system is required, a manual
    implementation is needed, or even a different sound replay API should be considered.
    For the simple ability to advance to the next track in a playlist at the end of
    a track, we just need to implement a callback.


    # Adding a callback for continuous music playback


    SDL_mixer supports a callback to inform the application that the current music
    track has finished the number of loops. In this callback, we can simply forward
    to the next track in the playlist.


    Sadly, SDL_mixer is a C audio library, and the callback must fulfill the C-style
    calling convention. The C++ calling convention is not compatible with the C calling
    convention and allows only calling static member functions of the AudioManager
    class. We need to add a small hack to be able to call a non-static method of the
