- pgno: 33
  md: '# 1


    # Working with Open Asset

    Import Library


    Welcome to *Mastering C++ Game Animations*! Are you the kind of person who looks
    at the animated models in a computer or console game, or a 3D animation tool,
    and asks yourself questions like:


    > How does this work? How do they do this? Could I do this myself, too?


    If so, this book will take you in the right direction to achieving this. In the
    next 14 chapters, you will learn how to create your own little game character
    model viewer.


    The book starts with loading a file using Open Asset Import Library, converting
    the data structures from the importer library into more efficient data structures
    for rendering, and rendering the character model with a simple OpenGL or Vulkan
    renderer. You will also learn how to optimize data updates and rendering by relocating
    computational load to the GPU in the form of GPU-based lookup tables and compute
    shaders.


    For the character animations, you will not only dive into normal animation blending
    but also be introduced to state-based animation control, additive animation blending
    to move the head independently of the rest of the body, and facial animations.
    You will also learn how to control the behavior of the instances by using a simplified
    version of behavior trees and implement interaction between the instances on the
    screen.'
  merge: -1
  img_proc: true
- pgno: 34
  md: "To give a proper home to the game characters, you will learn how to load a\
    \ game map into the application. Moving around in the game map will be enhanced\
    \ by adding collision detection, inverse kinematics for the character feet, and\
    \ simple navigation to let the instances run around fully on their own in the\
    \ virtual world.\n\nIn addition to the animations, features such as interactive\
    \ selection by using the mouse, saving and loading the configuration to a file\
    \ allow working on larger virtual worlds, and handling different cameras in the\
    \ virtual world are introduced. Also, a graphical, node-based configuration will\
    \ be implemented, enabling you to change the behavior of the instances in a non-programming\
    \ way.\n\nWith all these steps combined, your virtual characters in the virtual\
    \ world will come closer to real game characters.\n\n> Join our community on Discord\n\
    > \n> Join our community’s Discord space for discussions with the author and other\
    \ readers: https://packt.link/cppgameanimation.\n\nEvery journey starts with the\
    \ first step, so welcome to Chapter ! This chapter will set the foundation for\
    \ the animation application, as you will get an insight into how to load a model\
    \ file from your computer into the program, position the instance in the vast\
    \ emptiness of the virtual world, and play the animations that are included in\
    \ the file. By the end of this chapter, your game character model will be able\
    \ to jump, run, or walk on the screen, maybe surrounded by non-animated models\
    \ or other static objects.\n\n+   - Animating game characters – a primer\n+  \
    \ - What is Open Asset Import Library?\n+   - Loading a model file\n+   - Extending\
    \ the UI with an Open File dialog\n+   - Adding and removing model instances dynamically"
