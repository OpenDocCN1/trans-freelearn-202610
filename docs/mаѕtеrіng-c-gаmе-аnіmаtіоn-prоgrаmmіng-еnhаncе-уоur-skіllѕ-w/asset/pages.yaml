  md: '```

    std::string bdEditorSettings;

    nodeActionCallback bdNodeActionCallbackFunction{};

    };

    ```


    Nodes and links are stored in basic STL containers, and we also store the editor
    setting string in the struct, enabling us to save and restore the node positions
    in the node editor window. The nodeActionCallback callback is only needed in an
    intermediate fashion to create a link chain between the callbacks in the nodes
    and the class storing the behavior data struct itself.


    The new class SingleInstanceBehavior is used to collect all data and methods for
    the behavior control of a single instance. Here, we create the chain for the nodeActionCallback
    callback by setting the callback function of the BehaviorData struct to the local
    method nodeActionCallback():


    ```

    mBehaviorData->bdNodeActionCallbackFunction = [this]

    (graphNodeType nodeType, instanceUpdateType updateType,

    nodeCallbackVariant data, bool extraSetting) {

    nodeActionCallback(nodeType, updateType, data,

    extraSetting);

    };

    ```


    Whenever nodes of types are created that need to change instance data, the nodeActionCallback
    of the BehaviorData struct is set in the new node:


    ```

    newNode->setNodeActionCallback(

    newBehavior.bdNodeActionCallbackFunction);

    ```


    Finally, in the nodeActionCallback() method, the incoming data is transformed
    to include the instance ID, and another callback function is executed:


    ```

    mInstanceNodeActionCallback(mInstanceId, nodeType,

    updateType, data, extraSetting);

    ```


    The callback chain decouples the internal instance and animation state from the
    state machine controlling it. By decoupling the states, it is possible for a node
    of the instance movement or action type to request a property change for the instance
    where this node resides in one of the behaviors without any knowledge of which
    instance the node is.


    The remaining parts of the node actions will be implemented in the section Extending
    the code to support behavior changes, completing the chain from a single node
    in a node tree all the way up to the renderer.'
