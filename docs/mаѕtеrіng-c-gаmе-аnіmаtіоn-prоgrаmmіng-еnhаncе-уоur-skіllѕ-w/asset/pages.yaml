- pgno: 82
  md: '# Moving Animation Calculations from CPU to GPU


    After you add a couple of hundreds of instances, you should see a picture similar
    to Figure 2.1. The Timers section of the user interface has been zoomed into to
    show the values for the time it takes to generate the model matrices:


    ![](img/3cfb9832c943f5f7366fd104b5255971_82_0.png)


    Here, the 1,601 instances require more than 20 milliseconds to create the model
    matrices – which is still a small value, if we calculate the raw numbers.


    Each model has 41 animated bones. For each of the bones, two values for each of
    the translation, rotation, and scale (TRS) are read in every frame. These values
    are mixed together by linear interpolation for translation and scale, and spherical
    linear interpolation (SLERP) for rotation:


    ```

    1601*41*3*2 = 393846

    ```


    On top of these nearly 400,000 vector multiplications, every bone needs the resulting
    TRS matrix created, multiplied by the parent matrix. Every matrix multiplication
    consists of 16 float multiplications, so we have another ~100,000 multiplications:


    ```

    1601*4*16 = 102464

    ```'
  merge: -1
  img_proc: true
