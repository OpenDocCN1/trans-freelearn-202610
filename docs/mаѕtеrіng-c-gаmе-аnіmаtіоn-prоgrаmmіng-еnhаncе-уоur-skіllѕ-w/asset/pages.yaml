- pgno: 381
  md: 'In Figure 11.1, the resulting user interface part for the level data is shown:


    ![](img/3cfb9832c943f5f7366fd104b5255971_381_0.png)


    The Levels combo box is filled from the file names of the levels within the mi
    cLevels vector in the ModelInstanceCamData struct. The Delete Level button for
    the level data has the same function as the Delete Model button from the Models
    section of the UI, removing the currently selected level, and the controls for
    axis swap, position, rotation, and scaling are taken from the Instances UI section,
    along with the Reset Values to Zero button to set all controls to default values.


    In addition to the new control elements, a new main menu entry named Levels is
    created. Figure 11.2 shows all the elements of the main menu at this point:


    ![](img/3cfb9832c943f5f7366fd104b5255971_381_1.png)


    Clicking on Load Level... opens the well-known ImGui-based file dialog, configured
    with a list of supported file formats for level data. See Choosing a format for
    a map section about the extensions in the filter.


    The Delete Model and Load Level... UI elements utilize the callbacks to add and
    delete an AssimpLevel object from the application, creating a seamless workflow
    for the user when adding level data to the virtual world.


    The significant difference between level data and model instances in terms of
    user experience is the missing visual selection and modification functionality
    for the level data. Since you will adjust the level data a few times until you
    are happy with position, rotation, and scale, the extra code to continuously move
    the level data around like instances will be used only once or twice. It is even
    more probable that a visual selection harms the workflow if the level data is
    selected when the desired instance is missed by some pixels.'
  merge: -1
  img_proc: true
- pgno: 382
  md: 'As the last step of level data management, we will add the names of the loaded
    level files and the per-level settings to the YAML config file.


    # Saving and loading the level configuration


    Storing the loaded levels and the level settings in the YAM configuration file
    is quick and straightforward.


    After adding an Emitter output operator overload for the LevelSettings data type,
    we can copy and adjust the emitting code block for models or cameras in the createConfigFile()
    method of the YamlParser class in the tools folder to save the level data. In
    addition, we must also emit the selected level number in the settings map of our
    configuration file.


    Also, two new methods named getLevelConfigs() and getSelectedLevelNum() are added
    to the YamlParser class:


    ```

    std::vector<LevelSettings> getLevelConfigs();

    int getSelectedLevelNum();

    ```


    Both methods follow the same process as the model and camera counterparts. The
    first method, getLevelConfigs(), tries to load the level data from the YAML file,
    and getSelectedLevelNum() returns the index of the selected level at the time
    the configuration was saved.


    In the YamlParserTypes.h file, a simple pair of encode() and decode() methods
    for the LevelSettings data type must be added to read back the data from the YAML
    file. We should also increase the mYamlConfigFileVersion value as the configuration
    structure has changed.


    Now we can add level data from a file, place the level in the virtual world, and
    store and reload the configuration. Adding the level data to the undo/redo stack
    is left as an exercise for you, but the basic principle level data undo/redo is
    identical to the undo/redo functionality for models.


    Since the level data may contain overlapping elements, such as bridges, tunnels,
    or multiple floors of a building, instances could be on the same location in two
    dimensions. The existing collision detection would be triggered even if the instances
    are walking at different heights in the level, causing false reactions to non-existing
    collisions.


    We have to extend the quadtree to become an octree to support collision detection
    in all three dimensions. Let’s check out how to upgrade the quadtree.'
  merge: -1
  img_proc: true
- pgno: 383
  md: '# Converting the quadtree to an octree


    Updating the quadtree to an octree is astonishingly simple, and most of the work
    can be triggered by using the Rename function of the Refactoring functionality
    of the IDE. For brevity, we will just do a brief walkthrough of the required changes
    here. Please check the example code in the subfolders within the chapter11 folder
    for the full octree code.


    First, we change the name of the quadtree folder to octree. In the CMakeLists.txt
    file, the two occurrences of quadtree must be also renamed octree to match the
    folder name. And we rename the QuadTree class Octree and change BoundingBox2D
    to BoundingBox3D.


    Next, we extend the Octree class by using eight instead of four children. Figure
    11.3 shows the quadrant IDs of the octree:


    ![](img/3cfb9832c943f5f7366fd104b5255971_383_0.png)


    Figure 11.3: Quadrant IDs in the octree


    The four existing child quadrant IDs, 0 to 3, will be used for the four front-facing
    octants, and the four back-facing octants will receive the new IDs 4 to 7. Moving
    the four new octants to the back of the octree cuboid allows us to retain most
    of the logic from the quadtree. Adding the new logic to find the correct octant
    becomes merely an act of copying and pasting the code, taking front- and back-facing
    octants into account.


    Then, we update all QuadTree-related include statements, classes, and method calls
    in the code to Octree, and all BoundingBox2D occurrences to BoundingBox3D. The
    bounding box upgrade includes the change of all glm::vec2 types of the old BoundingBox2D
    parameters to use glm::vec3 instead. We also change the name of getTopLeft() to
    getFrontTopLeft() and add the getBack() method to reflect the availability of
    the third dimension.


    Finally, all callback function types in the code will be renamed from quadTree
    to octree to reflect the functionality change in all other places in the code
    too.'
  merge: -1
  img_proc: true
- pgno: 384
  md: 'Now we can use the octree to detect collisions in three dimensions. Sadly,
    the Instance Positions window still shows a top-down view of the instances, and
    we are unable to see if any instances are placed at different heights. We must
    adjust the rendering of the mini window containing the instances so that we can
    see any instances placed at different heights.


    # Creating an interactive octree view


    The new octree view is created in three steps:


    +   1. For a better overview of the octree and the instances, the new view can
    be scaled, rotated, and translated by using the mouse. It may still take some
    extra rotations to align the octree with the camera view, but that is hard to
    do due to the orthogonal display and the symmetry of the octree. Fading out far
    away parts of the octree or highlighting the octant containing the camera may
    help to focus on the current area of interest. On the other hand, using a perspective
    projected octree may make it easier to find the right alignment, but the perspective
    will distort the distances between the instances, and we just create a copy of
    the main level rendering.

    +   2. The lines of the octree quadrants and the instances are collected into
    a temporary data structure. We will use an OGLLineMesh here as this data type
    contains just the bare minimum; we need to draw ImGui lines.

    +   3. To achieve the desired view, all points of the octree quadrants and the
    instance bounding boxes must be transformed by the scaling, rotation, and translation
    from the first step. This transformation is done in the same way as we did for
    the cameras and instances: by creating a matrix and a matrix-vector multiplication
    for each point. There should be no surprises in the matrix operations; only the
    translation may need an explanation.


    Let’s step through the interactive part first.


    # Adding interactivity


    To be able to change the octree view with the mouse button and mouse movements,
    we need three new private variables named mOctreeZoomFactor, mOctreeRotation,
    and mOctreeTranslation in the UserInterface class:


    ```

    float mOctreeZoomFactor = 1.0f;

    glm::vec3 mOctreeRotation = glm::vec3(0.0f);

    glm::vec3 mOctreeTranslation = glm::vec3(0.0f);

    ```


    The names of the variables are self-explanatory, so we do not need to dive into
    the details here.'
  merge: -1
  img_proc: true
- pgno: 385
  md: "Right after creating the **Instance Positions** window in the createPositionsWindow()\
    \ method of the UserInterface class, we add a check to see if the current window\
    \ has been hovered over:\n\n```\nif (ImGui::IsWindowHovered(\n    ImGuiHoveredFlags_RootAndChildWindows))\
    \ {\n```\n\nWithout the check, the mouse buttons and motions would trigger the\
    \ octree view changes in all windows, leading to unwanted results.\n\nThen, we\
    \ get a reference to the internal io structure of ImGui:\n\n```\nImGuiIO& io =\
    \ ImGui::GetIO();\nmOctreeZoomFactor += 0.025f * io.MouseWheel;\nmOctreeZoomFactor\
    \ = std::clamp(mOctreeZoomFactor,\n    0.1f, 5.0f);\n```\n\nIn ImGui’s io structure,\
    \ many internal states are available, like changes made to the mouse wheel or\
    \ the mouse position.\n\nWe use the mouse wheel here to adjust the zoom factor\
    \ of the octree view. Setting upper and lower bounds for the zoom factor helps\
    \ to avoid losing the overview.\n\nNext, we check if the right mouse button has\
    \ been pressed and rotate the view according to the mouse movement while the right\
    \ mouse button is still pressed:\n\n```\nif (ImGui::IsMouseDown(ImGuiMouseButton_Right))\
    \ {\n    mOctreeRotation.y += io.MouseDelta.x;\n    mOctreeRotation.x += io.MouseDelta.y;\n\
    }\n```\n\nUsing the right mouse button to change the rotation is also used for\
    \ the camera, so this kind of view change should be known from working with the\
    \ application.\n\nFinally, we check for the middle mouse button, moving the octree\
    \ around with the mouse motion:\n\n```\nif (ImGui::IsMouseDown(ImGuiMouseButton_Middle))\
    \ {\n    mOctreeTranslation.x += io.MouseDelta.x;\n    mOctreeTranslation.y +=\
    \ io.MouseDelta.y;\n}\n}\n```\n\nIf you wonder why we don’t use the left mouse\
    \ button here: Pressing the left mouse button above an ImGui window activates\
    \ the internal window movement. We have only the right and middle mouse buttons\
    \ left to achieve two different view changes."
  merge: -1
  img_proc: true
- pgno: 386
  md: "Once we have the transformation we want to see, we can get the lines from the\
    \ octree and the instances.\n\n# Collecting the lines\n\nTo store the lines before\
    \ drawing, we add a private variable named mOctreeLines to the UserInterface class:\n\
    \n```\nOGLLineMesh mOctreeLines{};\n```\n\nAfter clearing the vertices vector\
    \ inside mOctreeLines, we get the octree lines:\n\n```\nmOctreeLines.vertices.clear();\n\
    const auto treeBoxes =\n    modInstCamData.micOctreeGetBoxesCallback();\n```\n\
    \nFor every octree quadrant, we get a BoundingBox3D object, containing the minimum\
    \ and maximum point positions. A conversion to an AABB is simple:\n\n```\nAABB\
    \ boxAABB{};\nboxAABB.create(box.getFrontTopLeft());\nboxAABB.addPoint(box.getFrontTopLeft()\
    \ +\n    box.getSize());\n```\n\nThen, we use the getAABBLines() method to create\
    \ all lines for the AABB as an OGLLineMesh and add the lines to the mOctreeLines\
    \ mesh:\n\n```\nstd::shared_ptr<OGLLineMesh> instanceLines =\n    boxAABB.getAABBLines(white);\n\
    mOctreeLines.vertices.insert(\n    mOctreeLines.vertices.end(),\n    instanceLines->vertices.begin(),\n\
    \    instanceLines->vertices.end());\n```\n\nNext, we get AABB lines for every\
    \ instance, coloring colliding instances red and all other instances yellow. The\
    \ currently selected instance also gets an additional green border to be able\
    \ to stop the instance easily.\n\nAt the end of the loops over both the octants\
    \ and the instances, mOctreeLines contains vertices of all lines that should be\
    \ drawn to the ImGui window. We now need to transform the vertices to match the\
    \ selected scaling, rotation, and translation."
  merge: -1
  img_proc: true
- pgno: 387
  md: "# Calculating the view and drawing the lines\n\nSince storing intermediate\
    \ results is faster than allocating and calculating a new transformation matrix\
    \ for the octree lines in every frame, we add three more private member variables\
    \ named mScaleMat, mRotationMat, and mOctreeViewMat:\n\n```\nglm::mat3 mOctreeViewMat\
    \ = glm::mat3(1.0f);\nglm::mat4 mRotationMat = glm::mat4(1.0f);\nglm::mat4 mScaleMat\
    \ = glm::mat4(1.0f);\n```\n\nThen, scaling and the two rotations are applied to\
    \ create the final view matrix:\n\n```\nmScaleMat = glm::scale(glm::mat4(1.0f),\n\
    glm::vec3(mOctreeZoomFactor));\nmRotationMat = glm::rotate(mScaleMat,\nglm::radians(mOctreeRotation.x),\n\
    glm::vec3(1.0f, 0.0f, 0.0f));\nmOctreeViewMat = glm::rotate(mRotationMat,\nglm::radians(mOctreeRotation.y),\n\
    glm::vec3(0.0f, 1.0f, 0.0f));\n```\n\nNow we loop over the vertices in mOctreeLines\
    \ in groups of two since we need a starting point and ending point for each line:\n\
    \n```\nfor (int i = 0; i < mOctreeLines.vertices.size(); i += 2) {\n```\n\nInside\
    \ the loop, we extract the vertex pair for each line and transform the vertex\
    \ positions by multiplication with the mOctreeViewMat:\n\n```\nOGLLineVertex startVert\
    \ = mOctreeLines.vertices.at(i);\nOGLLineVertex endVert = mOctreeLines.vertices.at(i+1);\n\
    glm::vec3 startPos = mOctreeViewMat *\n    startVert.position;\nglm::vec3 endPos\
    \ = mOctreeViewMat * endVert.position;\n```\n\nNext, we add the point coordinates\
    \ to the center of the drawing and add the translational part:\n\n```\nImVec2\
    \ pointStart =\n    ImVec2(drawAreaCenter.x + startPos.x +\n        mOctreeTranslation.x,\n\
    \        drawAreaCenter.y + startPos.z +\n        mOctreeTranslation.y);\nImVec2\
    \ pointEnd =\n```"
  merge: -1
  img_proc: true
- pgno: 388
  md: "```\nImVec2(drawAreaCenter.x + endPos.x +\n    mOctreeTranslation.x,\n    drawAreaCenter.y\
    \ + endPos.z +\n    mOctreeTranslation.y)\n```\n\nWe don’t need a separate translation\
    \ matrix here because the movement of the octree lines is only related to the\
    \ ImGui window, not the position of the vertices in 3D.\n\nAt the end of the loop,\
    \ we draw an ImGui line from the start point to the end point using the colors\
    \ of the line and a fixed alpha value:\n\n```\ndrawList->AddLine(pointStart, pointEnd,\n\
    \    ImColor(startVert.color.r, startVert.color.g,\n        startVert.color.b,\
    \ 0.6f));\n```\n\nIf we start the application after these changes, the octree\
    \ view can be rotated by pressing the right mouse button, moved around by pressing\
    \ the middle mouse button, and zoomed in and out by using the mouse wheel.\n\n\
    Figure 11.4 shows a view of the octree in the Instance Positions window:\n\n![](img/3cfb9832c943f5f7366fd104b5255971_388_0.png)\n\
    \nFigure 11.4: A rotated octree with instances and two subdivision levels"
  merge: -1
  img_proc: true
- pgno: 389
  md: 'You can see the bounding boxes for all instances in three dimensions. Colliding
    instances are drawn in red, all other instances are yellow (the same colors as
    for the AABB debug lines), and the currently selected instance has an extra outline
    in green.


    Another important fact to see is the subdivision level of the octree. At the root
    level of the octree, one subdivision is divided into eight octants – this has
    happened because of the number of instances. In the far lower right octant, another
    subdivision was needed to limit the instance count per octant.


    When the application is running, the movement of the instances and changes in
    the octree subdivision can be seen in real time. And the view can be changed to
    focus on any interesting area of the octree.


    One drawback of the default octree implementation is the growing overhead. A subdivision
    may produce a lot of empty nodes, especially if the threshold per node is small
    and the tree depth is high. For our implementation, each subdivision into eight
    octants adds a memory overhead of roughly one kilobyte in memory usage, even if
    we need to store only one or two instance AABBs in one of the child octants.


    Also, each subdivision adds another step to the traversal costs. Even though the
    traversal complexity grows only on a logarithmic basis, the overhead in memory
    and traversal time may become significant in larger levels. In this case, a data
    structure such as a sparse voxel octree could be used instead. A link to a paper
    describing the principles of sparse voxel octrees is available in the Additional
    resources section.


    A shortcoming of the current level loading is a missing “feeling” about the dimensions
    of the loaded level data. If the level is not flat but contains areas with different
    heights, it is hard to imagine the edges of the level data.


    To get a better orientation, we will also add an AABB for the level data.


    # Building an AABB for the level data


    Axis-aligned bounding boxes are a great tool to avoid estimating or guessing the
    dimensions of an object. We are using model instance AABBs as a solution to detect
    collisions by allowing the application to compare the maximum extents of two instances.


    While unused areas between the vertices of the instances and the bounding box
    are a trade-off between speed and complexity for collision detection, the situation
    is different for level data. The AABB lines will help us to see the maximum extent
    of the level in all three dimensions, especially when the level data has large
    unused areas.'
  merge: -1
  img_proc: true
- pgno: 390
  md: <!-- no content -->
