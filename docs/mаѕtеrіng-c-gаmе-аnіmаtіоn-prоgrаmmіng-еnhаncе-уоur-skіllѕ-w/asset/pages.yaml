  md: 'In addition to the pure virtual methods, a small number of non-pure virtual
    functions are declared and defined in the GraphNodeBase.h header. These methods
    are only useful for a small subset of node types. So, forcing all node types to
    implement the functionality makes no sense.


    The first three methods, addOutputPin, delOutputPin, and getNumOutputPins, are
    used to handle the dynamic number of output pins on the Sequence and Selector
    nodes:


    ```

    virtual void addOutputPin() {};

    virtual int delOutputPin() { return 0; };

    virtual int getNumOutputPins() { return 0; };

    ```


    All three method names speak for themselves. Only the return value of delOutputPin()
    may need an explanation: when removing an output pin from a node, we must check
    if any links were connected to that pin. By returning the pin ID of the just-deleted
    output pin, all connected links can be removed by searching the map of links for
    the specific output node and deleting all affected links from the link map.


    The other three virtual methods, childFinishedExecution, listensToEvent, and handleEvent,
    are even more special:


    ```

    virtual void childFinishedExecution() {};

    virtual bool listensToEvent(nodeEvent event)

    { return false; };

    virtual void handleEvent() { };

    ```


    The Sequence node type waits for the child node(s) connected to its output pins
    to report that they have finished execution. Both the Wait and RandomWait nodes
    will inform their parent node about a status change by calling childFinishedExecution().


    Only the event node implements the last two methods, listensToEvent() and handleEvent().
    Both method names should be self-explanatory. The split into two separate methods
    can be useful if some preparations need to be done between checking if a node
    would handle an event and the real event execution.


    As an example for a derived class, we will check some implementation details of
    the wait node.


    # Creating the wait node


    When constructing a new wait node, some defaults are set:


    ```

    WaitNode::WaitNode(int nodeId, float waitTime) :

    GraphNodeBase(nodeId) {

    }

    ```'
