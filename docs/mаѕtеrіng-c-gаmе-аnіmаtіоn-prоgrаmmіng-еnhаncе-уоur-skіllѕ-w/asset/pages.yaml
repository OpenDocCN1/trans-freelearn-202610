  md: "Again, for Vulkan, the two variables are added to the VkRenderData struct in\
    \ the VkRenderData.h file in the vulkan folder.\n\nDuring the init() method of\
    \ the renderer, initTriangleOctree() is called to create an octree with the given\
    \ threshold and maximum depth:\n\n```\nvoid OGLRenderer::initTriangleOctree(int\
    \ thresholdPerBox,\n    int maxDepth) {\n    mTriangleOctree = std::make_shared<TriangleOctree>(\n\
    \        mWorldBoundaries, thresholdPerBox, maxDepth);\n}\n```\n\nThe world boundaries\
    \ are updated during level AABB generation, so our triangle octree is exactly\
    \ the same size as the level data after the level was loaded.\n\nFilling the level\
    \ data octree is done in the generateLevelOctree() method. We just walk through\
    \ the important parts here since the outer code is only a loop over all levels\
    \ in the micLevels vector of the ModelInstanceCamData struct.\n\nFor every level\
    \ in micLevels, we get the level meshes in the form of optimized meshes for drawing\
    \ the level. Then, we iterate over all the indices of the level mesh:\n\n```\n\
    std::vector<OGLMesh> levelMeshes =\n    level->getLevelMeshes();\nglm::mat4 transformMat\
    \ =\n    level->getWorldTransformMatrix();\nglm::mat3 normalMat =\n    level->getNormalTransformMatrix();\n\
    for (const auto& mesh : levelMeshes) {\n    int index = 0;\n    for (int i = 0;\
    \ i < mesh.indices.size(); i += 3) {\n```\n\nFor Vulkan, the levelMeshes vector\
    \ will contain the VkMesh data type.\n\nWe must use the indices to draw the triangles\
    \ since the triangle data is stored based on indices; using the vertices directly\
    \ would not give us the correct information to deduce the triangles’ vertices.\
    \ We also retrieve the world and normal transformation matrices from the level.\
    \ The normal transformation matrix is just the transpose of the inverse world\
    \ transform matrix, the getNormalTransformMatrix() method has been added to keep\
    \ the additional transformations in the AssimpLevel class."
