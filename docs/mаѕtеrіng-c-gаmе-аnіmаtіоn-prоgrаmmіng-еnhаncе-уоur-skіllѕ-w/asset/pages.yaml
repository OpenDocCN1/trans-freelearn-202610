- pgno: 412
  md: '# Extending the node tree to support level geometry collisions


    Thanks to the good foundation built in the last chapters, adding a new collision
    type takes a matter of minutes by following these steps:


    +   1. First, we add the new event type to the nodeEvent enum in the Enums.h file:

    +   ```

    +   enum class nodeEvent : uint8_t {

    +   ...

    +   instanceToLevelCollision,

    +   NUM

    +   };

    +   ```

    +   2. We also add some text to the micNodeUpdateMap during the init() method
    of the renderer to add a name in the node tree:

    +   ```

    +   mModelInstCamData.micNodeUpdateMap[

    +   nodeEvent::instanceToLevelCollision] =

    +   "Inst to Level collision";

    +   ```

    +   3. Then, in checkForLevelCollisions(), trigger the new event if we have at
    least one colliding triangle:

    +   ```

    +   if (collidingTriangles.size() > 0) {

    +    mModelInstCamData.micNodeEventCallbackFunction(

    +    instSettings.isInstanceIndexPosition,

    +    nodeEvent::instanceToLevelCollision);

    +   }

    +   ```

    +   4. The event informs the node tree of the instance that a collision with level
    geometry occurred. As an example, we could just let the instance turn around by
    180 degrees, as shown in Figure 12.2:'
  merge: -1
  img_proc: true
- pgno: 413
  md: '![](img/3cfb9832c943f5f7366fd104b5255971_413_0.png)


    Figure 12.2: An Event node reacting to instance/level collisions


    In the Event node in Figure 12.2, the instance would instantly turn around when
    running into a collision with the level. Also, a cooldown of 250 milliseconds
    has been added. Using a cooldown should give the instance a bit of time to walk
    far enough away from the affected level geometry to avoid immediately re-triggering
    a level collision.


    But right now, collision detection has a huge drawback: the instances keep walking
    at the same height level, thus running through hills or walking in the air when
    the elevation changes.


    To keep the instances on the ground, let’s add a simple form of gravity to the
    application.


    # Using gravity to keep the instances on the floor


    Gravity is literally always around us, accelerating objects downwards until they
    hit some other, immovable object, such as the ground. We mostly don’t realize
    the effects of gravity while walking around or standing still; we only realize
    its power when something falls down and most probably breaks when it hits the
    ground.


    Before we can add gravity, we need to find a way to detect if a triangle in the
    level geometry belongs to the ground or not.'
  merge: -1
  img_proc: true
- pgno: 414
  md: "# Finding ground triangles in level data\n\nFor real-world levels, extra attributes\
    \ could be used to mark areas of a level as walkable or not. Since we want to\
    \ keep the ground-level technique as generic as possible, we will use a different\
    \ approach and use the triangle normal to check if the area around us belongs\
    \ to the floor or a wall, and up to which angle a sloped area can be walked on.\n\
    \nWe store the normal of each triangle as 3-element vector inside the MeshTriangle\
    \ struct, along with the other triangle data:\n\n```\nstruct MeshTriangle {\n\
    \    ...\n    glm::vec3 normal;\n    BoundingBox3D boundingBox;\n};\n```\n\nWhen\
    \ generating the triangle octree in generateLevelOctree(), the normal from the\
    \ first vertex of the triangle is taken:\n\n```\ntri.normal = glm::normalize(normalMat\
    \ *\n    glm::vec3(mesh.vertices.at(\n    mesh.indices.at(i)).normal));\n```\n\
    \nDue to the indexed structure of the level data, using one of the normals of\
    \ the vertices could lead to artifacts caused by reusing the same vertex for different\
    \ triangles. In this case, we could alter the calculation of the normal to be\
    \ the cross product of two edges of every triangle:\n\n```\nglm::vec3 edge1 =\
    \ glm::vec3(mesh.vertices.at(\n    mesh.indices.at(i + 1)).position -\n    mesh.vertices.at(mesh.indices.at(i)).position);\n\
    glm::vec3 edge2 = glm::vec3(mesh.vertices.at(\n    mesh.indices.at(i + 2)).position\
    \ -\n    mesh.vertices.at(mesh.indices.at(i)).position);\ntri.normal = glm::normalize(normalMat\
    \ *\n    glm::cross(edge1, edge2));\n```\n\nTo be able to control the ground slope\
    \ in the user interface, we add a new variable called rdMaxLevelGroundSlopeAngle\
    \ to the OGLRenderData struct:\n\n```\nfloat rdMaxLevelGroundSlopeAngle = 0.0f;\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 415
  md: "For Vulkan, as always, the variable will be added to the VkRenderData struct.\n\
    \nThen, in checkForLevelCollisions(), we add a new check to find out if the angle\
    \ between an upward-pointing vector and the normal of the triangle is larger than\
    \ the maximum configurable ground slope:\n\n```\nif (glm::dot(tri.normal, glm::vec3(0.0f,\
    \ 1.0f, 0.0f))\n    >= glm::cos(glm::radians(\n    mRenderData.rdMaxLevelGroundSlopeAngle)))\
    \ {\n```\n\nInside the if block, we can now limit the event sending code to be\
    \ triggered only for walls, no longer for ground triangles. We also change the\
    \ color of the debug lines for triangles detected as ground triangles to blue\
    \ while wall triangles remain red:\n\n```\nvertexColor = glm::vec3(0.0f, 0.0f,\
    \ 1.0f);\n} else {\n    vertexColor = glm::vec3(1.0f, 0.0f, 0.0f);\n    mModelInstCamData.miNodeEventCallbackFunction(\n\
    \        instSettings.isInstanceIndexPosition,\n        nodeEvent::instanceToLevelCollision);\n\
    }\n```\n\nIn the Levels... section of the UserInterface class, we add a float\
    \ slider to enable controlling the maximum ground slope interactively:\n\n```\n\
    ImGui::Text(\"Max Ground Slope:\");\nImGui::SameLine();\nImGui::SliderFloat(\"\
    ##MaxSlope\",\n    &renderData.rdMaxLevelGroundSlopeAngle,\n    0.0f, 45.0f, \"\
    %.2f\", flags);\n```"
  merge: -1
  img_proc: true
- pgno: 416
  md: 'Now the application draws collisions with walls and ground in different colors,
    as shown in Figure 12.3:


    ![](img/3cfb9832c943f5f7366fd104b5255971_416_0.png)


    As you can see in Figure 12.3, wall collisions are now marked by red triangle
    edges, while ground collisions are highlighted by blue triangle edges. The slope
    angle can be configured by a slider, allowing finetuning of which slope of a hill
    or edge will be still seen as the ground.


    In addition to the distinct colors for collisions between instances and walls
    or the ground, the event reporting also differs. For a ground collision, no instance/level
    geometry collision event will be generated, allowing the instances to run around
    in the level and only collide with walls.


    After we can check if an instance collides with a ground polygon, it’s time to
    add the gravity to the code.


    # Adding basic gravity


    For our application, we are using only simple gravity. We just move the instance
    down by some amount every frame, without thinking about more complex patterns,
    such as acceleration over time. If you want to implement more details, the Addition
    resources section contains the ISBNs of books that dive into advanced physics
    and collision detection topics. Also, a task in the Practical sessions section
    implements enhanced gravity.'
  merge: -1
  img_proc: true
- pgno: 417
  md: "To be able to add a gravity effect to an instance, we create a new public method\
    \ named applyGravity() to the AssimpInstance class:\n\n```\nvoid AssimpInstance::applyGravity(float\
    \ deltaTime) {\n    glm::vec3 gravity =\n        glm::vec3(0.0f, GRAVITY_CONSTANT\
    \ * deltaTime, 0.0f);\n    mInstanceSettings.isWorldPosition -= gravity;\n}\n\
    ```\n\nThe private variable GRAVITY_CONSTANT is defined in the AssimpInstance.h\
    \ header and set to 9.81, similar to the real gravity on earth. The gravity is\
    \ then applied in the instances loop in the draw() method of the renderer:\n\n\
    ```\nif (mRenderData.rdEnableSimpleGravity) {\n    instances.at(i)->applyGravity(deltaTime);\n\
    }\n```\n\nThe rdEnableSimpleGravity variable has been added to the OGLRenderData\
    \ struct in the OGLRenderData.h file for OpenGL, and to the VkRenderData struct\
    \ in the VkRenderData.h header for Vulkan.\n\nIn the Levels... collapsing header\
    \ of the createFrame() method in the UserInterface class, a checkbox is used to\
    \ control the gravity:\n\n```\nImGui::Text(\"Simple Gravity: \");\nImGui::SameLine();\n\
    ImGui::Checkbox(\"##EnableGravity\",\n    &renderData.rdEnableSimpleGravity);\n\
    ```\n\nWe will use this checkbox to prevent all instances from falling when no\
    \ level geometry is loaded.\n\nOne last step is needed to enable instances to\
    \ roam around on the floor of the levels. Let’s create the final parts of the\
    \ code the finish the ground handling for the instances.\n\n# Keeping the instances\
    \ on the ground triangles\n\nWith the code from the previous sections of this\
    \ chapter, we can detect collisions between instances and level walls and floors\
    \ and the handle wall collision. For ground collisions, we need special handling\
    \ since the instance will, most of the time, stay on the floor of the level."
  merge: -1
  img_proc: true
- pgno: 418
  md: "A naive idea for ground collision would be to move the instance upward a bit\
    \ after gravity is applied. Sadly, applying gravity and moving the instance back\
    \ leads to oscillations if the amounts of vertical movement are not identical.\
    \ But instead of moving the instance up, we can avoid applying gravity in the\
    \ first place, leaving the instance on the ground triangle once the collision\
    \ is detected.\n\nThe functionality to keep instances on the ground triangles\
    \ of the level will be implemented by the following steps:\n\n+   1. For every\
    \ instance, we store the “on ground” state by using a new Boolean variable named\
    \ isInstanceOnGround in the InstanceSettings struct in the InstanceSettings.h\
    \ file:\n\n```\nbool isInstanceOnGround = false;\n```\n\n+   2. In the AssimpInstance\
    \ class, a public setter for the state will be added too:\n\n```\nvoid AssimpInstance::setInstanceOnGround(bool\
    \ value) {\n    mInstanceSettings.isInstanceOnGround = value;\n}\n```\n\n+   3.\
    \ Then we update the applyGravity() method to disable adding the gravity to the\
    \ vertical position if the instance is found to reside on the ground:\n\n```\n\
    if (!mInstanceSettings.isInstanceOnGround) {\n    mInstanceSettings.isWorldPosition\
    \ -= gravity;\n}\n```\n\nTo set the isInstanceOnGround instance variable in the\
    \ renderer, a new checking code will be added to the draw() method of the renderer,\
    \ right below the query() call to the triangle octree. This way, we make sure\
    \ we are using the most recent triangle colliding data.\n\n+   4. First, we set\
    \ the local instanceOnGround Boolean to true, which prevents instances from falling\
    \ if the gravity is disabled. Next, we calculate the gravity with the same formula\
    \ as the instance, and we initialize the current footPoint of the instance with\
    \ the world position:\n\n```\nbool instanceOnGround = true;\nif (mRenderData.rdEnableSimpleGravity)\
    \ {\n    glm::vec3 gravity =\n        glm::vec3(0.0f, 9.81 * deltaTime, 0.0f);\n\
    \    glm::vec3 footPoint =\n        instSettings.isWorldPosition;\n```"
  merge: -1
  img_proc: true
- pgno: 419
  md: 'We need the foot point in the next step to have a valid position for the instance
    in case the ground detection fails.


    5. Now, we set instanceOnGround to false as the default setting for ground-level
    detection, and we iterate over all colliding triangles:


    ```

    instanceOnGround = false;

    for (const auto& tri : collidingTriangles) {

    ```


    6. Then, the same angle check between the normal vector of the triangle and an
    upwards pointing vector as in checkForLevelCollisions() is used to find out if
    the triangle is a ground triangle and thus considered walkable:


    ```

    if (glm::dot(tri.normal, glm::vec3(0.0f, 1.0f, 0.0f)) >= glm::cos(glm::radians(

    mRenderData.rdMaxLevelGroundSlopeAngle))) {

    ```


    7. If the triangle is walkable ground, we try to get the intersection between
    a virtual ray pointing upwards, originating from the instance after it has already
    been sunk slightly into the ground:


    ```

    std::optional<glm::vec3> result = Tools::rayTriangleIntersection(

    instSettings.isWorldPosition - gravity,

    glm::vec3(0.0f, 1.0f, 0.0f), tri);

    if (result.has_value()) {

    footPoint = result.value();

    instances.at(i)->setWorldPosition(

    footPoint);

    instanceOnGround = true;

    }

    ```


    Checking the instance after applying the gravity value is required because no
    collision will be reported if the instance is exactly at the same level as the
    ground triangle.


    The helper function rayTriangleIntersection() in the Tools class implements the
    Möller-Trumbore algorithm to find an intersection between a ray and a triangle.
    This algorithm detects if a ray intersects the triangle and returns the exact
    point of the intersection.'
  merge: -1
  img_proc: true
- pgno: 420
  md: 'A visualization of the algorithm is shown in Figure 12.4:


    ![](img/3cfb9832c943f5f7366fd104b5255971_420_0.png)


    Figure 12.4: Visualization of the Möller-Trumbore algorithm


    The Möller-Trumbore algorithm uses the barycentric coordinates of the triangle
    created by the three vertices V0, V1, and V2 to check if the ray is inside or
    outside of the triangle. To simplify the detection process, the algorithm transforms
    both the triangle vertices and the ray so that two of the triangle sides are mapped
    to the X and Y axes of the Cartesian coordinate system, defining a unit triangle.
    The barycentric coordinates of the intersection point stay intact during these
    transformations. The final test for intersection just needs to check if the x
    and y coordinates of the intersection point are inside the triangle by testing
    for valid barycentric coordinates. A link to the mathematical backgrounds of the
    algorithm is available in the Additional resources section.


    8. As the last step in the draw() call part of the new renderer code, we set the
    ground flag to the instance and apply the gravity:


    ```

    instances.at(i)->setInstanceOnGround(instanceOnGround);

    instances.at(i)->applyGravity(deltaTime);

    ```


    The extra check for rdEnableSimpleGravity around applyGravity() that was added
    in the Adding basic gravity section can be removed. We already ensure that no
    gravity will be added if rdEnableSimpleGravity is false by setting the default
    value of instanceOnGround to true.'
  merge: -1
  img_proc: true
- pgno: 421
  md: 'Running the application with collision triangle debug draw enabled and the
    ground slope adjusted will result in an image similar to Figure 12.5:


    ![](img/3cfb9832c943f5f7366fd104b5255971_421_0.png)


    In Figure 12.5, we see that the instances are walking on their own level, with
    the left instance climbing up a small slope. In the running application, you will
    see that climbing down a hill is also working as expected.


    After level gravity is enabled, the instances are running on the level floor.
    But on an uneven floor, one either intersects with the floor when going up a hill,
    or one of the feet is still in the air when going down a slope. You can see this
    effect on the right foot of the left instance: the entire foot is clipping into
    the ground triangle.


    Let’s fix the instance feet by adding inverse kinematics.


    # Adding inverse kinematics


    The word “kinematics” is defined as the mechanics behind the motion of an object,
    but without referencing the forces that cause this motion. So, every part of our
    daily motion can be described in terms of kinematics as the movement of our bones.'
  merge: -1
  img_proc: true
- pgno: 422
  md: '# The two types of kinematics


    The type of animation of our characters in the previous chapters is called **forward
    kinematics**. An example of forward kinematics is shown in Figure 12.6:


    ![](img/3cfb9832c943f5f7366fd104b5255971_422_0.png)


    Figure 12.6: Raising the hand of the simple skeleton by using Forward Kinematics


    The skeleton in Figure 12.6 raises its simplified hand by rotating at bone number
    one, the shoulder, and number two, the elbow.


    During the movement or rotation of the skeletal bone, all the other nodes attached
    to it are also affected. Rotating the arm around the shoulder does not change
    the elbow or the forearm, as we only change one bone at a time. Next, the forearm
    is rotated around the elbow, bringing the hand to the final position. This final
    position of the hand is defined by the concatenation of the changes of all the
    bones before the hand.


    But... what happens if we only know the desired final position of the hand?


    If we want to move the hand of the skeleton in Figure 12.7 to the green target
    point, or we want to put the foot onto the green target block, our only option
    with forward kinematics would be trial and error.


    ![](img/3cfb9832c943f5f7366fd104b5255971_422_1.png)


    Figure 12.7: How to move the hand to the target, or put the foot on the box?'
  merge: -1
  img_proc: true
- pgno: 423
  md: 'We would have to adjust all the nodes on the arm or the leg over and over again
    until we reach a matching position. This is where **inverse kinematics** comes
    into play. Instead of rotating the nodes directly, we calculate bone positions
    matching the final movement and read the node rotations from the final bone positions,


    In inverse kinematics, the name **effector** is used to describe the part of the
    skeleton that should reach the **target**. If the target is too far away to be
    reached by the effector node, we should at least try to find a position as close
    as possible to the target. In addition to effector and target, a **root node**
    must be chosen. The root node is the first unchanged node of the skeleton.


    Although many inverse kinematics solver algorithms have been created, we will
    use one of the basic algorithms: FABRIK, the **Forward And Backward Reaching Inverse
    Kinematics** solver. FABRIK is easy to understand and implement and finds good
    solutions for the nodes. So, let’s dive into inverse kinematics with FABRIK.


    # Understanding the FABRIK basics


    FABRIK was introduced in 2011 by Dr. Andreas Aristidou. The FABRIK algorithm solves
    the inverse kinematics problem by moving the nodes of a bone chain one by one
    closer to the target and then rescaling the bones back to the original length.
    Also, FABRIK moves along the chain of bones in both directions, forward and backward,
    hence its name.


    We will use a simple robotics arm to describe the steps to solve an inverse kinematics
    problem with FABRIK. Four nodes of the arm define three bones, and the target
    and the effector were drawn in every step, with the blue node attached to the
    ground as the root node and the outer red node used as the effector. All the steps
    are shown in Figure 12.8 to Figure 12.11.


    Let’s step through a single iteration of the algorithm. First, we will examine
    the *forward* solving part of FABRIK.


    ![](img/3cfb9832c943f5f7366fd104b5255971_423_0.png)'
  merge: -1
  img_proc: true
- pgno: 424
  md: 'The start situation is shown in Figure 12.8 (1):


    +   1. As shown in Figure 12.8 (2), we will move the effector to the position
    of the target as the first step. You can see that moving the node stretches the
    red bone far beyond its original length.

    +   2. We must correct the length of the red bone, so we need to save the length
    of our bone before moving the effector. By using the saved length, we scale the
    red bone back to its original length, right after the effector has been moved,
    as shown in Figure 12.8 (3). Scaling back the red bone to the previous length
    rips apart our robotics arm, as seen in Figure 12.8 (3), but this is an intended
    behavior during a FABRIK iteration.

    +   3. Then, we will move the outer node of the purple bone back to the end of
    the red bone, scaling it again to an arbitrary length. Figure 12.8 (4) shows the
    result after the robotics arm has been reconnected.

    +   4. The purple bone is scaled back to its previous length, as shown in Figure
    12.9 (5), moving the end node away from the blue bone.


    ![](img/3cfb9832c943f5f7366fd104b5255971_424_0.png)


    Figure 12.9: Inverse kinematics using FABRIK forward iteration – part 2


    5. Finally, we will repeat steps 4 and 5 of the purple bone movement with the
    blue bone. We will reconnect the arm every time and scale the bone back to its
    original length, as shown in Figure 12.9 (6) and Figure 12.9 (7).


    Figure 12.9 (8) shows the result after the forward steps of the FABRIK algorithm
    are finished. But having the robotic arm disconnected from the ground is not the
    result we want. To fix the arm, we will repeat the same steps, but this time backward
    on the same chain of bones.


    In the backward part of FABRIK, we will swap the target, effector node, and root
    node. We use the original connection point of the arm as the target, the end of
    the blue bone becomes the effector, and the original effector node is the new
    root node.'
  merge: -1
  img_proc: true
- pgno: 425
  md: '6. As the first step in the backward operation, we will reconnect the arm to
    the ground, as shown in Figure 12.10 (9).


    ![](img/3cfb9832c943f5f7366fd104b5255971_425_0.png)


    Figure 12.10: Inverse kinematics using FABRIK backward iteration – part 1


    7. Then, we scale the blue bone back to its previous size and move the purple
    bone in the same way as we did initially in steps 2 and 3. In Figure 12.10 (10),
    Figure 12.10 (11), and Figure 12.10 (12), the results of adjusting the blue and
    purple bones are shown.


    8. Now, the lower node of the red bone will move, and the red bone is scaled back
    to its previous size, as shown in Figure 12.11 (13) and Figure 12.11 (14).


    ![](img/3cfb9832c943f5f7366fd104b5255971_425_1.png)


    Figure 12.11: Inverse kinematics using FABRIK backward iteration - part 2


    Figure 12.11 (14) moves the effector away from the position of the target, but
    again, this is the intended behavior in FABRIK if the target cannot be reached.
    In Figure 12.11 (15), a single FABRIK iteration has ended.


    For the next iterations of FABRIK, steps 2 to 9 are repeated until the effector
    node reaches the target position, or until we hit the maximum number of iterations.'
  merge: -1
  img_proc: true
- pgno: 426
  md: "By using simple pseudo-code, FABRIK can be melted down to this procedure:\n\
    \n```\nNodePositions := OrigNodePositions\nStoreOriginalBoneLengths\nRootNodePos\
    \ := NodePositions[LastPosition];\nFor NumIterations; Do\n    EffectorPos := NodePositions[0]\n\
    \    If TargetIsCloseToEffector\n        Return\n    SolveForward(TargetNodePos)\n\
    \    SolveBackwards(RootNodePos)\nEndFor\n```\n\nThe SolveForward and SolveBackwards\
    \ methods are similar, so we can look only at pseudo-code for the forward-solving\
    \ part of FABRIK:\n\n```\nNodePositions[0] = TargetNodePos\nFor i = 1; i < NodePositions.Size;\
    \ i += 1\n    BoneDirection = NodePositions[i] - NodePositions[i-1]\n    NewOffset\
    \ = BoneDirection * BoneLengths[i - 1]\n    NodePositions[i] = NodePositions[i-1]\
    \ + NewOffset\nEndFor\n```\n\nThe backward-solving part just starts with the saved\
    \ root node position and iterates over the bones in the opposite direction.\n\n\
    As you can see, the number of steps is small and the actions in these steps are\
    \ simple. Armed with the new knowledge, let’s add a FABRIK solver.\n\n# Implementing\
    \ the FABRIK inverse kinematics algorithm\n\nThe inverse kinematics solver using\
    \ the FABRIK algorithm is implemented by the following steps:\n\n+   1. For the\
    \ FABRIK inverse kinematics solver, we create a new class, IKSolver, by adding\
    \ the IKSolver.h and IKSolver.cpp files to the tools folder.\n+   2. Next to the\
    \ constructor and a setter for the number of iterations, a public method named\
    \ solveFABRIK() is added:\n\n```\nstd::vector<glm::vec3> solveFARBIK(\n    std::vector<glm::mat4>&\
    \ nodeMatrices,\n    glm::vec3 targetPos);\n```"
