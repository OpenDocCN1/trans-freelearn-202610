- pgno: 128
  md: "```\n->setInstanceSettings(instSettings);\n}\n}\n```\n\nThe method assignInstanceIndices()\
    \ is called whenever instances are added or removed.\n\nHaving an easy to access\
    \ instance number at hand helps us to fill the y element of the mSelectedInstance\
    \ vector during the loop over all instances of a model:\n\n```\nif (mMousePick)\
    \ {\n    InstanceSettings instSettings =\n        modelType.second.at(i)->getInstanceSettings();\n\
    \    mSelectedInstance.at(i).y =\n        static_cast<float>(\n        instSettings.isInstanceIndexPosition);\n\
    }\n```\n\n# Selecting the instance at mouse positions\n\nAs the final step for\
    \ the visual selection, we trigger the pixel read at the end of the draw() call\
    \ in the renderer:\n\n```\nif (mMousePick) {\n    glFlush();\n    glFinish();\n\
    ```\n\nBy surrounding the pixel read with a check for the mMousePick variable,\
    \ we make sure the functions to read back the pixel will be called only on the\
    \ selection event.\n\nThis guarding check is especially important for the calls\
    \ to glFlush() and glFinish(). Both commands are required to make sure all shader\
    \ runs have ended, and the data in the selection texture is complete. While glFlush()\
    \ empties the internal buffers and triggers the rendering itself, glFinish() blocks\
    \ the renderer and waits for all previous OpenGL calls to have finished. Forcing\
    \ these OpenGL commands on every frame decreases the number of frames per second\
    \ in most implementations.\n\nNext, we call readPixelFromPos() on the FrameBuffer\
    \ instance:\n\n```\nfloat selectedInstanceId =\n    mFramebuffer.readPixelFromPos(mMouseXPos,\n\
    \    (mRenderData.rdHeight - mMouseYPos - 1));\n```"
