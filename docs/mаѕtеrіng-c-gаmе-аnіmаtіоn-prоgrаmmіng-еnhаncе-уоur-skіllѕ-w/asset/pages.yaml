- pgno: 434
  md: 'After multiplying the inverse of the bone offset node, the current node position,
    and the instance world position, we get the world position of the two adjacent
    nodes of the foot node chain.


    With the two positions, we calculate the normalized toNext vector:


    ```

    glm::vec3 toNext = glm::normalize(nextPosition - position);

    ```


    To calculate the desired rotation for the node, we need to find a quaternion that
    rotates the bone from the current world rotation to the rotation computed by the
    FABRIK algorithm.


    # Creating the new world positions


    We extract the new world positions of the same nodes calculated by FABRIK, calculate
    the normalized toDesired vector between the new world positions, and compute the
    rotation angle between the toNext and toDesired vectors as a quaternion, nodeRotation:


    ```

    int newNodePosOffset = i * nodeChainSize + index;

    glm::vec3 toDesired = glm::normalize(

    mNewNodePositions.at(foot)

    .at(newNodePosOffset - 1) -

    mNewNodePositions.at(foot)

    .at(newNodePosOffset));

    glm::quat nodeRotation = glm::rotation(toNext, toDesired);

    ```


    At this point, we have the world-level rotation between the current position of
    the bone and the new position of the same bone of the model''s skeleton.


    Now we extract the world-level rotation of the current node and calculate the
    local rotation that would be needed to match the world-level rotation of the node:


    ```

    glm::quat rotation = Tools::extractGlobalRotation(

    mWorldPosMatrices.at(i) *

    mShaderBoneMatrices.at(i * numberOfBones + nodeId) *

    model->getInverseBoneOffsetMatrix(nodeId));

    glm::quat localRotation = rotation * nodeRotation * glm::conjugate(rotation);

    ```'
  merge: -1
  img_proc: true
- pgno: 435
  md: "Finally, we read the current local rotation of the node, concatenate the new\
    \ rotation, and store the rotation back to the TRS data:\n\n```\nglm::quat currentRotation\
    \ = mTRSData.at(i * numberOfBones + nodeId).rotation;\nglm::quat newRotation =\
    \ currentRotation * localRotation;\nmTRSData.at(i*numberOfBones + nodeId).rotation\
    \ = newRotation;\n}\n```\n\nBy running the mAssimpMatrixComputeShader and uploading\
    \ the updated TRS data, the new node matrices for all the nodes in the foot node\
    \ chain are recalculated. As the last step, we read back the contents of the mShaderBoneMatrixBuffer\
    \ to have the new node matrices available for the next node in the foot node chain.\n\
    \nWe are just one step away from a working inverse kinematics implementation.\
    \ What’s left now is detecting the collisions between the foot position and the\
    \ ground triangle. Let’s tackle the last section of this chapter.\n\n# Detecting\
    \ feet-to-ground collisions\n\nThe general idea behind detecting collisions between\
    \ instance feet and the ground is the same as for the instances. We use the ray-to-triangle\
    \ check to find the intersection of a ray with the triangle below or above the\
    \ defined foot node. This intersection point is then used as the target position\
    \ for the FABRIK solver.\n\nFor both feet of every instance, we use the same method\
    \ to extract the world position as in the last step of the FABRIK solver code:\n\
    \n```\nint footNodeId = modSettings.msFootIKChainPair.at(foot).first;\nglm::vec3\
    \ footWorldPos = Tools::extractGlobalPosition(\n\tmWorldPosMatrices.at(i) *\n\t\
    mShaderBoneMatrices.at(i * numberOfBones + footNodeId) *\n\tmodel->getInverseBoneOffsetMatrix(footNodeId));\n\
    \n```"
