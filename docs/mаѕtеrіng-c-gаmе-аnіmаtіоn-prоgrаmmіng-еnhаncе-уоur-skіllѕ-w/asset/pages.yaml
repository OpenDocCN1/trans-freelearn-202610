- pgno: 188
  md: "# Defining a free camera as the default camera\n\nLike the null model and the\
    \ null instance, we should make sure to always have at least one camera in the\
    \ micCameras vector. Avoiding an empty array frees us from a lot of boundary checks,\
    \ and the always-available free camera is a nice feature on a new configuration\
    \ or after all existing cameras are removed.\n\nTo simplify the default free camera,\
    \ a new method called loadDefaultFreeCam() will be added to the renderer class:\n\
    \n```\nvoid OGLRenderer::loadDefaultFreeCam() {\n    mModelInstCamData.micCameras.clear();\n\
    ```\n\nFirst, we clear the vector containing all the cameras. Then, we create\
    \ a new camera settings object with some default values, apply the settings to\
    \ the camera, and add the camera as the first instance:\n\n```\nstd::shared_ptr<Camera>\
    \ freeCam =\n    std::make_shared<Camera>();\n\nCameraSettings freeCamSettings{};\n\
    freeCamSettings.csCamName = \"FreeCam\";\nfreeCamSettings.csWorldPosition = glm::vec3(5.0f);\n\
    freeCamSettings.csViewAzimuth = 310.0f;\nfreeCamSettings.csViewElevation = -15.0f;\n\
    freeCam->setCameraSettings(freeCamSettings);\nmModelInstCamData.micCameras.emplace_back(freeCam);\n\
    mModelInstCamData.micSelectedCamera = 0;\n}\n```\n\nYou can adjust the settings\
    \ for the default free camera to your needs. The settings shown in the previous\
    \ code snippet just center the origin of the world, making the first instance\
    \ of a loaded model appear in the center of the screen.\n\nFinally, we set the\
    \ selected camera to zero, the index of our newly added camera.\n\nWhenever we\
    \ need to remove all cameras and add the default camera (i.e., when creating a\
    \ new configuration), we can just call loadDefaultFreeCam()."
  merge: -1
  img_proc: true
- pgno: 189
  md: 'For the user interface, we should disable name changes to the default free
    camera by surrounding the name field with calls to ImGui::BeginDisabled() and
    ImGui::EndDisabled() when the camera instance 0 is selected.


    Figure 6.1 shows the resulting user interface for the camera section:


    ![](img/3cfb9832c943f5f7366fd104b5255971_189_0.png)


    Figure 6.1: The new camera settings


    Switching between cameras is now as simple as selecting a new base model or a
    new animation clip, for instance. In addition to the combo box, two arrows have
    been added, allowing us to directly select the previous and the next camera.


    For real camera management, two functions are missing: creating a new camera and
    deleting an existing camera, with the exception of the default camera.


    # Adding and deleting cameras


    To create a camera, two paths can be taken:


    +   - Adding a camera at the origin, using default values

    +   - Cloning the currently selected camera and all settings except the name


    Forcing the user to return to the origin and move the new camera to the desired
    place in the virtual world feels a bit off. A much better solution is to be able
    to clone the currently selected camera since the user most probably wants to make
    the current view of the virtual world persistent.


    Both cloning and deleting functions are handled by new callbacks, moving the burden
    of checks and all work to the renderer instead of the user interface. The new
    renderer methods, called cloneCamera() and deleteCamera(), are short and simple,
    so we skip the listing here.


    However, handling camera names needs some extra attention. Duplicate names in
    the combo box will be confusing, so we have to find a solution to create unique
    names when cloning a camera. A simple way to create new names is to append a number
    to the name and raise the number by one on further clones.'
  merge: -1
