- pgno: 169
  md: "# # Handling exceptions thrown by yaml-cpp\n\nInstead of returning an error\
    \ code, yaml-cpp throws exceptions whenever something goes wrong. By default,\
    \ any unhandled exception terminates the program. Handling an exception in C++\
    \ is done like in other languages:\n\n```\ntry {\n  mYamlNode = YAML::LoadFile(fileName);\n\
    } catch(...) {\n  return false;\n}\n```\n\nThe call that may cause an exception\
    \ will be enclosed in a try block, and in case of an exception, the catch block\
    \ will be executed.\n\nWe can simply catch all exceptions since any parsing failure\
    \ may result in an empty or incomplete configuration file. If you want to have\
    \ more detailed exception handling, you can explore the yaml-cpp source code.\n\
    \nArmed with the basics of yaml-cpp, we can start implementing the code to save\
    \ and load a YAML file. We will start with the save functionality because after\
    \ we have created a file on disk, loading the data elements back into the application\
    \ will be much easier compared to hand-crafting a configuration file first.\n\n\
    # # Saving and loading the configuration file\n\nBuilding our configuration file\
    \ starts with the decision of what needs to be stored and how we want to store\
    \ the elements. By reusing our custom data types like the InstanceSettings, creating\
    \ the functions to save and load a file can be simplified. Now we no longer have\
    \ to read each value individually, but we can use calls like getInstanceSettings()\
    \ and setInstanceSettings() from the AssimpInstance class to transfer the values\
    \ directly between the parser and the instance.\n\nWe will start by exploring\
    \ what we want to save, and after adding the code to write our custom data to\
    \ the file, a user interface dialog will be added, allowing a simple way to save\
    \ the file to disk. Finally, we will step through the process of loading the configuration\
    \ back into the application."
