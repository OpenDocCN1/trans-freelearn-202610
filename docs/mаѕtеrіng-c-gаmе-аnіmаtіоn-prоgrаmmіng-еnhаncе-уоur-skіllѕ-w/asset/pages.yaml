- pgno: 87
  md: "In this new struct, we will save the transformation values on a per-node basis.\
    \ We are using a glm::vec4, that's a vector type with four float elements for\
    \ translation and scaling to avoid additional padding values for proper alignment\
    \ and simply ignoring the last element in the shader.\n\n# GPU/CPU memory alignment\
    \ may differ\n\nSince GPUs are optimized for fast memory access, data in the buffers\
    \ must be aligned in memory, in most cases to multiples of 16 bytes. This alignment\
    \ will be automatically created when uploading data to the GPU. On the CPU side,\
    \ a different alignment may be used, for instance for 3-element vector types like\
    \ a glm::vec3, which is 12 bytes long. To use a glm::vec3 vector, an additional\
    \ float is needed as padding to match the 16-byte alignment because uploading\
    \ misaligned data will end up in distorted images and incorrect results.\n\nWe\
    \ also use a glm::vec4 vector for the rotation, which is a glm::quat quaternion\
    \ in the AssimpChannel class. The reason for this decision is simple: GLSL, the\
    \ OpenGL Shading Language, does not know what a quaternion is, or how to handle\
    \ a quaternion. We will have to implement the quaternion functions by ourselves\
    \ in the compute shader. So, we utilize the normal 4-element vector to transport\
    \ the four elements of the rotation quaternion to the shader.\n\nNow, we can simplify\
    \ the animation update. First, we add a local std::vector of our new type NodeTransformData\
    \ to the class:\n\n```\nstd::vector<NodeTransformData> mNodeTransformData{};\n\
    ```\n\nWe iterate again over all channels, but instead of modifying the nodes\
    \ of the model, we fill a local NodeTransformData variable with the transformation\
    \ data:\n\n```\nfor (const auto& channel : animChannels) {\n    NodeTransformData\
    \ nodeTransform;\n\n    nodeTransform.translation =\n        channel->getTranslation(\n\
    \            mInstanceSettings.isAnimPlayTimePos);\n    nodeTransform.rotation\
    \ =\n        channel->getRotation(\n            mInstanceSettings.isAnimPlayTimePos);\n\
    \    nodeTransform.scale =\n        channel->getScaling(\n            mInstanceSettings.isAnimPlayTimePos);\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 88
  md: "And, after a check to avoid accessing an invalid bone, we set the node transform\
    \ of the corresponding bone with the collected transformation data:\n\n```\nint\
    \ boneId = channel->getBoneId();\nif (boneId >= 0) {\n    mNodeTransformData.at(boneId)\
    \ = nodeTransform;\n}\n```\n\nDuring the draw() call of our renderer, we still\
    \ need to update the animations in the same way:\n\n```\nfor (unsigned int i =\
    \ 0; i < numberOfInstances; ++i) {\n    modelType.second.at(i)->updateAnimation(deltaTime);\n\
    ```\n\nThen, we get the node transformation from the instance, and collect them\
    \ in a local array:\n\n```\nstd::vector<NodeTransformData> instanceNodeTransform\
    \ =\n    modelType.second.at(i)->getNodeTransformData();\nstd::copy(instanceNodeTransform.begin(),\n\
    \    instanceNodeTransform.end(),\n    mNodeTransFormData.begin() + i * numberOfBones);\n\
    ```\n\nAs the last step, we must upload the node transforms to an SSBO:\n\n```\n\
    mNodeTransformBuffer.uploadSsboData(mNodeTransFormData, 0);\n```\n\nThe elements\
    \ of the NodeTransformData struct are not 4x4 matrices, but only the three glm::vec4\
    \ elements per node. So, we need to upload 25% less data to the SSBO in this step.\n\
    \nHaving the node transformations available on the GPU is a cool first step. But,\
    \ if we further analyze the data flow, we will find out we need much more data\
    \ in our compute shaders to calculate the final model matrices. Let’s see what\
    \ else is required to calculate the world space positions from the bone-local\
    \ transform data.\n\n# Adding missing data for the compute shader\n\nThe first,\
    \ and most obvious missing data part is the array of bone offset matrices. In\
    \ the CPU implementation, we multiply the final TRS matrix per node with the bone\
    \ offset matrix for the same node:\n\n```\nmBoneMatrices.emplace_back(\n    mAssimpModel->getNodeMap().at(\n\
    ```"
