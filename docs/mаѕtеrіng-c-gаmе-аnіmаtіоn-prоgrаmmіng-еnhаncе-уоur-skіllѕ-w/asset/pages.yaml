- pgno: 439
  md: '# Limitations of FABRIK


    Animations created by using a FABRIK solver for inverse kinematics usually look
    good, but the algorithm has some limitations that should be addressed.


    The biggest problem arises when note rotations create unnatural bone positions.
    For example, a human cannot bend their knees forward, but our instances on the
    screen can do so. Without checking and restricting the rotations of the nodes,
    the bones of the instances can end up in virtually any position. A task in the
    *Practical sessions* section handles this issue by limiting node rotations.


    Another problem emerges if the target is too far away from the effector, thus
    becoming unreachable. FABRIK solves unreachable targets by stretching the entire
    bone chain from the root node to the effector node in a straight line, causing
    the instance to walk around with stiff legs like a robot. Since we can detect
    if the target cannot be reached by the effector, handling these situations is
    easier than unlimited node rotations. There is a task in the *Practical sessions*
    section to solve problems with unreachable targets.


    # Summary


    In this chapter, we enhanced the collision detection in our level. First, we added
    a separate and specialized octree for the level data, allowing us to do a quick
    check for collisions between instances and level geometry. Then, we added simple
    gravity to the virtual world and adjusted the collision detection to allow instances
    to walk on the level floor. Finally, we added inverse kinematics for the feet
    of the instances, bringing a more natural foot and leg movement on sloped grounds
    by avoiding the feet floating above the ground or clipping into ground triangles
    of the level.


    In the next chapter, we will add a final extension to the level data and add simple
    navigation. We will start with a brief roundup of several ways to implement navigation
    in games. Next, we will explore the A* pathfinding algorithm and implement it
    in the application. Then, we will add waypoints to the map, serving as targets
    for A* calculations. Finally, we will implement waypoint navigation to the instances,
    enabling the instances to move to random waypoints or to patrol between a set
    of defined waypoints.'
  merge: -1
  img_proc: true
- pgno: 440
  md: "# Practical sessions\n\nHere are some additions you could make to the code:\n\
    \n+   - Add a more complete gravity.\n+   \n+     Instead of just manipulating\
    \ the vertical position of the instances, use a more complex way to apply gravity\
    \ by using vertical acceleration. Since gravity is used in two places, in the\
    \ instance for the speed and in the renderer for the collision detection, synchronization\
    \ between both code parts is needed.\n+   - Add collision detection for the third-person\
    \ camera.\n+   \n+     In real games, the camera is also a normal object in the\
    \ virtual world. And instead of clipping through the level data, the camera always\
    \ stays inside the same boundaries as the character it follows, connected by a\
    \ spring arm structure to allow adjustments if the camera is unable to keep the\
    \ exact position behind the character. You can try to add a bounding box for the\
    \ third-person camera and check the boundaries against the level octree too. Remember\
    \ to also check and change the distance and height of the camera if a collision\
    \ occurs.\n+   - Enhance stair and cliff detection.\n+   \n+     To enable the\
    \ instances climbing stairs, basic logic has been added to the code that compares\
    \ the step height of stairs with the instance position. This idea may not work\
    \ for different kinds of game maps, plus the instance may fall off a cliff when\
    \ the stair detection returns the wrong result. Enhance the logic to have better\
    \ stair detection and also prevent the instance from falling down when it “thinks”\
    \ it is standing in front of a step when it is actually on the edge of an abyss.\n\
    +   - Align the instance’s feet to follow the slope and normal if the floor.\n\
    +   \n+     Right now, the feet of the instances may still intersect the ground,\
    \ depending on the slope of the ground and the instance position. Add some code,\
    \ and maybe even more nodes to the model(s), to align the feet of the instance\
    \ to the ground triangle. This adjustment should work for forward/backward inclination\
    \ and for a sideway rotation of the feet to match the ground."
  merge: -1
