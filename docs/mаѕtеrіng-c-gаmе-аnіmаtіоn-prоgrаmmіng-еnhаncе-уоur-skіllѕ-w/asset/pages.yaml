  md: "```\nnodeMatrix = createTRSMatrix(parent) * nodeMatrix;\n```\n\nSince the calculation\
    \ was done entirely on the GPU, the only change in the renderer code to reflect\
    \ the TRS data split is the size calculation for the mShaderTRSMatrixBuffer SSBO:\n\
    \n```\nsize_t trsMatrixSize = numberOfBones *\n    numberOfInstances * 3 * sizeof(glm::vec4);\n\
    ```\n\nInstead of a glm::mat4 for the full TRS matrix, we use three glm::vec4\
    \ instances here, keeping the node transform split into translation, rotation,\
    \ and scale like in the compute shader.\n\nIn the OGLRenderData.h file, a matching\
    \ TRSMatrixData struct is added:\n\n```\nstruct TRSMatrixData{\n    glm::vec4\
    \ translation;\n    glm::quat rotation;\n    glm::vec4 scale;\n};\n```\n\nFor\
    \ Vulkan, the addition of TRSMatrixData happens in the VkRenderData.h file.\n\n\
    Right after the final node positions were calculated by the compute shaders, but\
    \ before the instances are rendered, new code will be added for the animated instances.\n\
    \n# Adding the code for the animated instances\n\nWe start by retrieving the current\
    \ contents of the TRS buffer:\n\n```\nmTRSData =\n    mShaderTRSMatrixBuffer.getSsboDataTRSMatrixData();\n\
    ```\n\nThen we iterate over the two feet and calculate the size of the node chain\
    \ for each foot:\n\n```\nfor (int foot = 0; foot <\n    modSettings.msFootIKChainPair.size();\
    \ ++foot) {\n    int nodeChainSize =\n        modSettings.msFootIKChainNodes[foot].size();\n\
