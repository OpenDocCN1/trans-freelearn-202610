- pgno: 112
  md: "```\nglm::vec3(0.8f, 0.0f, 0.0f);\nmVertexData.vertices[1].color = glm::vec3(0.8f,\
    \ 0.0f, 0.0f);\nmVertexData.vertices[2].color = glm::vec3(0.8f, 0.0f, 0.0f);\n\
    ...\n\n```\n\nThe final positions for the vertices of the coordinate arrows are\
    \ set in the draw() call of the render. As the first step, the line counter will\
    \ be zeroed, and the mLineMesh vector for the vertices of the coordinate arrows\
    \ is cleared:\n\n```\nmCoordArrowsLineIndexCount = 0;\nmLineMesh->vertices.clear();\n\
    ```\n\nNext, we retrieve the settings of the currently selected instance, containing\
    \ the position and rotation of the instance:\n\n```\nInstanceSettings instSettings\
    \ = \nmModelInstData.miAssimpInstances.at(\nmModelInstData.miSelectedInstance)\n\
    ->getInstanceSettings();\n```\n\nThen, we add the number of vertices to the line\
    \ counter variable mCoordArrowsLineIndexCount and iterate over each vertex in\
    \ a std::for_each:\n\n```\nmCoordArrowsLineIndexCount += \nmCoordArrowsMesh.vertices.size();\n\
    std::for_each(mCoordArrowsMesh.vertices.begin(),\nmCoordArrowsMesh.vertices.end(),\n\
    []{ (auto &n){\nn.color /= 2.0f;\nn.position =\nglm::quat(glm::radians(\ninstSettings.isWorldRotation()))\
    \ * n.position;\nn.position += instSettings.isWorldPosition;\n}});\n\n```\n\n\
    By using a lambda function, the position data of the vertices is altered to match\
    \ the position and rotation of the instance. In addition, we dim the color of\
    \ the coordinate arrows by dividing the color vector by a value of two."
  merge: -1
  img_proc: true
- pgno: 113
  md: "# Chapter 3\n\nThe resulting per-vertex data is collected in the mLineMesh\
    \ vector:\n\n```\nmLineMesh->vertices.insert(mLineMesh->vertices.end(),\nmCoordArrowsMesh.vertices.begin(),\n\
    mCoordArrowsMesh.vertices.end());\n```\n\nThen, we will upload the vertex data\
    \ to the GPU, and draw the coordinate lines:\n\n```\nmLineVertexBuffer.uploadData(*mLineMesh);\n\
    if (mCoordArrowsLineIndexCount > 0) {\n\tmLineShader.use();\n\tmLineVertexBuffer.bindAndDraw(GL_LINES,\
    \ 0,\n\t\tmCoordArrowsLineIndexCount);\n}\n```\n\nHere, the mCoordArrowsLineIndexCount\
    \ is used to check if coordinate lines exist at all, and as a parameter to draw\
    \ the correct number of points for the lines. Using the line count as a check\
    \ value and a counter helps us if we don't want to draw any coordinate lines at\
    \ all. We can simply skip filling mLineMesh and counting coordinate lines, skipping\
    \ the line drawing automatically. Or, we could draw multiple coordinate arrows\
    \ in a multi-selection scenario.\n\nUploading vertex data in Vulkan is much more\
    \ complex compared to OpenGL due to the explicit nature of the Vulkan API. The\
    \ full process for creating a different shader and uploading vertex data requires\
    \ the following steps in Vulkan:\n\n+   1. Create a pair of passthrough shaders\
    \ in GLSL or HLSL (High-Level Shader Language for DirectX). For GLSL shaders,\
    \ the syntax has only small differences – mostly it’s about being more explicit\
    \ when using the layout statement.\n+   2. Create a new pipeline with the new\
    \ shaders and a corresponding attribute definition. Vulkan needs a new pipeline\
    \ since the pipeline itself will become immutable after creation (except for a\
    \ few explicitly dynamically configurable sub-objects, like the viewport). Vulkan\
    \ shaders cannot be swapped at runtime like in OpenGL; we need to bind another\
    \ pipeline to draw vertices with a different shader.\n+   3. Uploaded the vertex\
    \ data to the GPU by using a staging buffer. To achieve the best performance in\
    \ Vulkan, the vertex data should be stored in an optimized format in a memory\
    \ area where only the GPU has access. Using a buffer shared between the CPU and\
    \ GPU requires additional synchronization by the driver and the data may not be\
    \ in the optimal format for the GPU to draw, resulting in performance losses."
