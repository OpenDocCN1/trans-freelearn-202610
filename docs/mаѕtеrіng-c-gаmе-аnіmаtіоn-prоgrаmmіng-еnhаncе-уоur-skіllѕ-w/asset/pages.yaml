- pgno: 441
  md: "+   - Handle unreachable targets.\n+   \n+     Implement logic to detect if\
    \ the effector cannot reach the target and add some kind of default rotations\
    \ for the nodes, for instance, taken from the current frame of the animation clip.\n\
    +   - Move the node update part of FABRIK to a compute shader.\n+   \n+     To\
    \ keep the FABRIK code for updating the final node rotations simple and easy to\
    \ follow, a CPU/GPU combination was used. The downside of the current code is\
    \ the need to copy both TRS matrix data and final node positions from GPU memory\
    \ at the start of every update of the node chain. By creating a compute shader\
    \ for the node rotation updates, you can keep the entire node update process on\
    \ the GPU.\n+   - Extended difficulty: Write a compute shader for inverse kinematics.\n\
    +   \n+     The FABRIK inverse kinematics algorithm is simple and straightforward.\
    \ Implementing the same algorithm in a compute shader should not be too hard.\
    \ You can use the matrix multiplication compute shader as an example of how to\
    \ do loops in GLSL code without hard coding the loop variable.\n+   - Extended\
    \ difficulty: Add node limits to the inverse kinematics algorithm.\n+   \n+  \
    \   In the default version, inverse kinematics does not worry about unnatural\
    \ bone rotations when solving for the position. For a game character, it looks\
    \ strange if a knee or an elbow is bent in the wrong direction. By adding per-node\
    \ limits for all three rotation axes, the target may not be reachable, but the\
    \ character still looks like a human. But be warned: adding node limits may influence\
    \ the stability of the inverse kinematics algorithm.\n+   - Extended difficulty:\
    \ Use a bounding volume hierarchy (BVH) for collision detection.\n+   \n+    \
    \ The idea of a bounding volume hierarchy was mentioned in the *Using spatial\
    \ partitioning to reduce complexity* section of *Chapter 8*, and the book *Real-Time\
    \ Collision Detection* by Christer Ericson has an entire chapter about BHVs. Replacing\
    \ the octree with a BHV to detect collisions may be a long task since the creation\
    \ of the hierarchy already adds a significant amount of complexity to collision\
    \ detection."
