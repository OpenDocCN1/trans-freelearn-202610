- pgno: 125
  md: "```\nlayout (location = 2) out vec2 texCoord;\n\nlayout (location = 3) out\
    \ float selectInfo;\n```\n\nThe second line at the end of the main() method does\
    \ the actual forwarding to the fragment shader:\n\n```\nselectInfo = selected[gl_InstanceID].y;\n\
    }\n```\n\nFor the two new fragment shaders, similar changes are needed. On top\
    \ of the shader code, we must add the new input variable selectInfo:\n\n```\n\
    layout (location = 2) in vec2 texCoord;\nlayout (location = 3) flat in float selectInfo;\n\
    ```\n\nAlso, the fragment shader output has to be adjusted. Replace the single\
    \ FragColor output line with the following two lines:\n\n```\nlayout (location\
    \ = 0) out vec4 FragColor;\nlayout (location = 1) out float SelectedInstance;\n\
    ```\n\nWe write two different outputs now, one for each color buffer: The color\
    \ buffer of the frame buffer will be filled with the RGBA values for the on-screen\
    \ color of each pixel as before, and at the end of the main() method, the instance\
    \ index passed through from the vertex shader will be written to the second color\
    \ buffer:\n\n```\nSelectedInstance = selectInfo;\n```\n\nIf we use the new selection\
    \ shader now when drawing the instances, the index of the instance will be added\
    \ to the selection buffer for every single pixel of that of the instances onscreen.\n\
    \n# Reading a pixel from a texture\n\nReading out the color of the pixel at a\
    \ given position will be done in the method readPixelFromPos() of the FrameBuffer\
    \ class.\n\nFirst, we initialize our designated return variable with a special\
    \ value, making it easy to find errors when OpenGL refuses to read out the pixel\
    \ color due to a configuration problem:\n\n```\nfloat Framebuffer::readPixelFromPos(unsigned\
    \ int xPos,\n    unsigned int yPos) {\n    float pixelColor = -444.0f;\n```"
  merge: -1
  img_proc: true
- pgno: 126
  md: "Next, we bind our framebuffer object as buffer to read from, and we select\
    \ the color attachment 1 of the framebuffer, containing the selection texture:\n\
    \n```\nglBindFramebuffer(GL_READ_FRAMEBUFFER, mBuffer);\nglReadBuffer(GL_COLOR_ATTACHMENT1);\n\
    ```\n\nThen, we adjust the internal alignment used during the read process, and\
    \ read out the color value of a single pixel at the given xPos and yPos position:\n\
    \n```\nglPixelStorei(GL_UNPACK_ALIGNMENT, 1);\nglReadPixels(xPos, yPos, 1, 1,\
    \ GL_RED, GL_FLOAT, &pixelColor);\n```\n\nFinally, we switch the framebuffer back\
    \ to color attachment 0, unbind the buffer and return the pixel color:\n\n```\n\
    glReadBuffer(GL_COLOR_ATTACHMENT0);\nglBindFramebuffer(GL_READ_FRAMEBUFFER, 0);\n\
    return pixelColor;\n}\n```\n\n# Adding mouse button handling\n\nSelecting an instance\
    \ will be added to the left mouse button. It feels natural to click on an instance\
    \ to select it. To store the status of the selection, a Boolean member variable\
    \ named mMousePick is added to the renderer.\n\nThen, the following line must\
    \ be added to the handleMouseButtonEvents() method of the renderer:\n\n```\nif\
    \ (button == GLFW_MOUSE_BUTTON_LEFT &&\n    action == GLFW_RELEASE) {\n    mMousePick\
    \ = true;\n}\n```\n\nUsing the GLFW_RELEASE action here, reacting when the left\
    \ mouse button is released, matches the selection style of many applications.\
    \ If you want to change the behavior, you can use the action GLFW_PRESS."
