- pgno: 514
  md: '# Adding a day/night cycle


    A day/night cycle adds some sort of familiarity to a game. Seeing the sun rise
    or enjoying a colorful sunset, watching the changes when running through the world
    around noon or late at night... every aspect will remind the player of being in
    a more realistic world. And if not only the light changes, but also other characters
    and animals react to the time of day, the immersion will become better and better.
    For instance, it may be good to see some animals only at night, and kids only
    in the morning, characters appearing at work at some time and leaving for a pub
    in the afternoon.


    The in-game time could be running much faster than real time, reducing an entire
    day to a couple of minutes. Such a speedup can help if events that are frequently
    needed only occur at a specific time of the day.


    One of the most popular examples of the day/night cycle is Minecraft. A full day
    in Minecraft lasts 20 minutes by default, split into a 10-minute day and a 10-minute
    night. And since the light level changes, enemy spawning and food and tree growing
    behave completely differently in the day and the night.


    Figure 14.16 shows the same spot in our application at noon and at night:


    ![](img/3cfb9832c943f5f7366fd104b5255971_514_0.png)


    As you can see in Figure 14.16, even a simple change in the overall brightness
    of the virtual world could make an enormous difference. And changing more properties
    of the world depending on the time of day will bring more immersion for the player.'
  merge: -1
  img_proc: true
- pgno: 515
  md: '# Allowing forward time travel


    When working with time, one fact should not be underestimated: the time waiting
    for an event to happen can be boring and passes slowly. Instead of keeping the
    player waiting for the entire day or night to pass, special “time travel” events
    could be added, such as sleeping through the night, or waiting at a fireplace
    to let the time pass, having the game fast-forwarding the in-game time.


    # Playing in real time


    Thinking about the time in a game, the idea of synchronizing the time in the virtual
    world to the time of the real world can be an interesting option. Only a few games
    utilize such a feature. Also, solving tasks or quests may be more complicated
    if they are bound to a special time of the day. But being “now” in a game may
    be fun.


    # Worshipping the weather god


    Not only may the time of day change the world, but weather changes can also greatly
    influence characters, animals, and the environment. During a thunderstorm, the
    best advice is to stay inside, heavy rain may be so loud that other sounds never
    reach the player’s ears, and fresh snow will also absorb noises. So, roaming around
    in various weather states can give entirely different impressions of the same
    world.


    Environmental changes such as the addition of fog also change the perception of
    the virtual world.


    Figure 14.17 shows different types of fog in our application:


    ![](img/3cfb9832c943f5f7366fd104b5255971_515_0.png)


    Figure 14.17: The effect of fog in the example code from Chapter 14'
  merge: -1
  img_proc: true
- pgno: 516
  md: 'On the left side of Figure 14.17, the virtual world is completely without fog,
    showing a clear day. In the middle of Figure 14.17, heavy fog was added, causing
    the world to fade out after a short distance. Fog was used in several old games
    to hide the appearance and disappearance of objects due to rendering limitations
    in early game engines. Finally, on the right side of Figure 14.17, the light color
    was adjusted to a green tone, creating the illusion of toxic fog in the streets
    of the map.


    # **Listening to the oracle of seasons**


    The next evolutionary step after a day/night cycle and weather would be the implementation
    of the four seasons. The rotation between Spring, Summer, Fall, and Winter is
    a great opportunity to bring even more reality into the virtual world as the actions
    of characters or the appearance of animals will change throughout the year.


    Like the length of the in-game day, a virtual year should be shortened to a reasonable
    amount of real time, or a forward time travel functionality should be allowed
    if all tasks in the current season have been finished. Letting the player wait
    for no reason will kill their enthusiasm.


    A good example of the changing world properties depending on the season is “Legend
    of Zelda: Oracle of Seasons” by Nintendo for the GameBoy Color. Despite the age
    of the game, the changes of the seasons have been implemented with great detail,
    allowing the player to enter some areas of the world only in specific seasons.
    For instance, rivers are only frozen in Winter and snow fields elevate the parts
    of the landscape, while only in Summer, flower tendrils enable Link to climb up
    walls.


    In “Stardew Valley” by Eric Barone, seasons are also a key element of the gameplay.
    Each of the four seasons influences different parts of the game, like crop growth.
    A season is 28 in-game days long, and by accelerating the time, an entire year
    in Stardew Valley elapses in 26 hours of in-game time.


    For the application, we will create simple day/night light changes and fog as
    examples. Let’s start with day and night.


    # **Hands-on: Adding day and night**


    Changing the light source’s color and position is easy. Most of the fragment shaders
    already contain a fixed light source definition to allow better visualizations
    of the instances and the level data.'
  merge: -1
  img_proc: true
- pgno: 517
  md: "# Implementing light control\n\nAs the first step, we add two new variables\
    \ called lightPos and lightColor to the Matrices uniform in all vertex and fragment\
    \ shaders where Matrices exists:\n\n```\nlayout (std140, binding = 0) uniform\
    \ Matrices {\n  ...\n  vec4 lightPos;\n  vec4 lightColor;\n};\n```\n\nIn lightPos,\
    \ we will hand over the current position of the light source, allowing us to simulate\
    \ the position of the Sun or Moon in the virtual world, and in lightColor, we\
    \ transport the color of the light source to the GPU, enabling us to simulate\
    \ sunrise, noon, sunset, and so on.\n\nSince we defined the uniform buffer containing\
    \ the view and projection matrix on the CPU to use glm::mat4 as the data type,\
    \ we must add the two glm::vec4 vectors for the light position and color as the\
    \ first two elements of a glm::mat4 that will be uploaded to the GPU before drawing\
    \ the frame:\n\n```\nglm::mat4 lightMatrix = glm::mat4(lightPos, lightColor,\n\
    \    glm::vec4(), glm::vec4());\nmatrixData.emplace_back(lightMatrix);\n```\n\n\
    Now all fragment shaders containing the light source definitions can be adjusted\
    \ with a better light control for the surfaces.\n\nWe start the new shader code\
    \ in the main() method by defining the ambient light level:\n\n```\nfloat ambientStrength\
    \ = 0.1;\nvec3 ambient = ambientStrength * max(vec3(lightColor),\n    vec3(0.05,\
    \ 0.05, 0.05));\n```\n\nThe ambient light level is used to simulate the light\
    \ scattering from other surfaces, enabling some sort of minimal lighting in the\
    \ virtual world. By limiting the minimal ambient light, we also prevent the resulting\
    \ picture from becoming pitch black.\n\nNext, we calculate the diffuse part by\
    \ using the angle between the triangle normal and the direction of the light source:\n\
    \n```\nvec3 norm = normalize(vec3(normal));\nvec3 lightDir = normalize(vec3(lightPos));\n\
    ```"
  merge: -1
  img_proc: true
