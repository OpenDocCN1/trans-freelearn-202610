- pgno: 168
  md: "To retrieve the scalar value of a simple key/value map, the special operator\
    \ as exists:\n\n```\nint value = dataNode.as<int>();\n```\n\nSince a YAML file\
    \ has no knowledge of the data types stored in the value, we have to explicitly\
    \ tell yaml-cpp how to interpret the incoming data. Here, yaml-cpp will try to\
    \ get the value of the dataNode node as int.\n\nAfter defining a transformation\
    \ template, custom data types like structs can also be read directly into a variable\
    \ of the same type:\n\n```\nInstanceSetting instSet = instNode.as<InstanceSettings>();\n\
    ```\n\nWe will handle transformation templates in the Saving and loading the configuration\
    \ file section.\n\n# Accessing sequences and maps\n\nIn yaml-cpp, sequences can\
    \ be read by iterating over them using a for loop, and accessing the element by\
    \ the index:\n\n```\nfor (size_t i = 0; i < instNode.size(); ++i) {\n    instSettings.emplace_back(\n\
    \        instNode[i].as<InstanceSettings>());\n}\n```\n\nThe elements of the sequence\
    \ are made available in the same order as they appear in the YAML file.\n\nFor\
    \ maps, an iterator-style for loop is needed:\n\n```\nfor(auto it = settingsNode.begin();\n\
    \    it != settingsNode.end(); ++it) {\n    if (it->first.as<std::string>() ==\
    \ \"selected-model\") {\n        ...\n    }\n}\n```\n\nThe key of the map element\
    \ can be read via the first accessor of the C++ map container. Again, we must\
    \ tell yaml-cpp which data type the map key is. Then, the value can be retrieved\
    \ with the second accessor of the C++ map container.\n\nIf reading a value fails,\
    \ for instance, because the type is wrong or no such node exists, an exception\
    \ will be thrown. To avoid our program being terminated, we must handle all thrown\
    \ exceptions."
