- pgno: 291
  md: 'Figure 9.1 shows a simple idea for an NPC behavior:


    ![](img/3cfb9832c943f5f7366fd104b5255971_291_0.png)


    Figure 9.1: A simple behavior plan


    Even though the plan looks straightforward, it encapsulates sophisticated behavior.
    Considering the enemy’s distance and health status while scanning the plan for
    the desired behavior should result in fairly impressive NPC actions. By switching,
    with random variations, between taking cover and a range attack, directly attacking
    approaching enemies, or just trying to hide or run away as the last option, watching
    a group of these NPCs fighting incoming enemies would be entertaining.


    We will add a simple state machine to control the behavior of the instances in
    this chapter. Also, to simplify creating and controlling the behavior with the
    state machine, we will add a tool to create nodes and links. So, let’s go on a
    short detour and add a visual node editor to the application.


    # Adding a visual node editor


    Like in the previous chapters, we will use an open-source tool to build our visual
    node editor instead of building our own solutions by hand. There are several ImGui-based
    node editors available. You can find a curated list in the Additional resources
    section.


    In this chapter, we will use the extension called imnodes by Johann “Nelarius”
    Muszynski. The source code for imnodes is available on GitHub:


    ```

    https://github.com/Nelarius/imnodes

    ```


    Like in the previous chapters, we will use CMake to fetch imnodes for us.'
