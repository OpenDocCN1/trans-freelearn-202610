- pgno: 59
  md: "In the mNodeList, all nodes are stored in a flat but hierarchical order, guaranteeing\
    \ us to access any of the nodes before its child nodes. This way, the mNodeList\
    \ is fast when it comes to updates that need to be done in all nodes. We can just\
    \ iterate from start to end through the vector.\n\nAt the end of processNode(),\
    \ we check for child nodes, and process any child nodes we find in a recursive\
    \ manner:\n\n```\nunsigned int numChildren = aNode->mNumChildren;\nfor (unsigned\
    \ int i = 0; i < numChildren; ++i) {\n    std::string childName =\n        aNode->mChildren[i]->mName.C_Str();\n\
    \    std::shared_ptr<AssimpNode> childNode =\n        node->addChild(childName);\n\
    \    processNode(childNode, aNode->mChildren[i],\n        scene, assetDirectory);\n\
    }\n```\n\nAfter processing all nodes in the hierarchy, we have collected all meshes,\
    \ textures, and skeletal data from the model.\n\n# Adding vertex buffers for the\
    \ meshes\n\nBack in the loadModel() method, we create a combined vertex and index\
    \ buffer object for every mesh, upload the extracted vertex data, and store the\
    \ buffer in a std::vector called mVertexBuffers:\n\n```\nfor (auto mesh : mModelMeshes)\
    \ {\n    VertexIndexBuffer buffer;\n    buffer.init();\n    buffer.uploadData(mesh.vertices,\
    \ mesh.indices);\n    mVertexBuffers.emplace_back(buffer);\n}\n```\n\nTo draw\
    \ the imported model, we can now simply iterate over the mModelMeshes vector and\
    \ use the drawIndirect() call of the VertexIndexBuffer class to draw all triangles\
    \ of this specific mesh with only a single draw command. The method is called\
    \ “indirect” because Assimp stores the model data internally as vertices plus\
    \ indices, and we draw the triangles in the indirect mode, via the indices."
  merge: -1
  img_proc: true
