- pgno: 77
  md: '# 2


    # Moving Animation Calculations

    from CPU to GPU


    Welcome to Chapter 2! In the previous chapter, we explored the steps to load and
    animate a 3D model by using Open Assimp Import Library, or Assimp for short. The
    resulting application can render a large number of model instances. But, depending
    on your processor type and speed, the computational part for the model matrices
    becomes dominant quite fast. As a consequence, we are no longer able to reach
    60 frames per second in the application.


    In this chapter, we move the matrix calculations to compute shaders, running entirely
    on the GPU. We start with a short history of methods to do computations that are
    independent of the main code of the application, and the growth of parallelism
    in CPUs and GPUs. Next, we examine the current state of the matrix calculations.
    Then, we create a plan for what we should move to a compute shader, and how this
    relocation could be accomplished. As the last step, we check the results of the
    relocation and take a short look at which other parts of the application could
    possibly take advantage of offloading compute-intense work.


    In this chapter, we will cover the following topics:


    +   - What are compute shaders and why should we love them?

    +   - Profiling animation performance

    +   - Moving the node computations to the GPU

    +   - Testing the implementation by scaling up

    +   - How to debug a compute shader'
  merge: -1
  img_proc: true
- pgno: 78
  md: '# Technical requirements


    To use compute shaders, a GPU supporting at least OpenGL 4.3 and/or Vulkan 1.0
    is required. Since the source code for the book is written for OpenGL 4.6 and
    Vulkan 1.1, we are safe here.


    You can find the example code in the folder chapter02, subfolders 01_opengl_computeshader
    for OpenGL, and 02_vulkan_computeshader for Vulkan.


    # What are compute shaders and why should we love them?


    Let’s take a short look at the history of home computers to see how concurrency
    was handled. On servers, concurrent programs have been the norm since the mid-1960s
    but for home computers and game consoles, the evolution is a bit different.


    # The famous raster interrupt


    While the general idea of interrupts has existed in computer systems since the
    beginning of computers, interrupts in home computers were normally used by the
    operating system to react to external events (though the first machines with interrupts
    were introduced in the 1950s). One of these interrupts signaled the beginning
    of a new picture to output to old “cathode-ray tube” TV sets: the raster interrupt.


    The raster interrupt fired after the cathode ray was reset to the top left of
    the TV set. This steady event, occurring 50 times per second (in the EU; 60 times
    per second in the US), became a point of interest for programmers really quickly.
    By redirecting the interrupt handler to their own code, the machine could do work
    that needed to be done to a fixed time schedule, like playing music or graphic
    changes that should happen at a specific location on the screen. These programs
    embraced the capabilities of home computers even more than the architects of the
    machines could have imagined, like adding more sprites to the screen than the
    machine had available, drawing sprites inside of screen borders, raster bars,
    or even a simple form of multitasking on 8-bit CPUs.


    Up to this day, retro coders do even more magic with old home computers. See the
    Additional resources section for links to demos plus tutorials on how the limitations
    of hardware were embraced over time.


    Then, for a long time, nothing special happened. The era of 8- and 16-bit home
    computers ended, and x86 machines took over. However, the general system layout
    stayed the same – one processor core using time-sharing via interrupts to present
    the illusion of having multiple programs running at the same time.'
  merge: -1
  img_proc: true
- pgno: 79
  md: '# The rise of multi-core machines


    By the start of the year 2000, common desktop machines became capable of working
    with multiple CPU cores: Windows 2000 was introduced (Linux was able to utilize
    more than one CPU for a long time, but it was a niche system on desktops in 2000).


    Five years later, the first processors with more than one computational core were
    available for desktop users: Pentium D and AMD 64 X2. These new CPUs were seen
    as the start of a new era in programming, since more than one process could run
    at the same time. That was also the start of an era of headaches for programmers
    – two threads could really run in parallel, requiring new thinking about synchronization.


    Right now, the average CPU core count of a desktop machine is between 4 and 8.
    Taking into account the simultaneous multithreading of modern CPUs, many desktop
    machines can even handle between 28 and 32 threads in parallel. Sadly, the headaches
    for programmers are the same as 20 years ago – utilizing a large number of cores
    is still a complex and error-prone process.


    Behind the scenes, another technology with an even more massive number of cores
    evolved: graphics processors.


    # Hidden multi-core champions


    In the shadows of processor core upgrades, graphics cards also raised the number
    of parallel cores. They did this on even larger scales. Starting with only a couple
    of shader cores in 2009 and 2010, the growth in numbers is insane:


    A NVIDIA GeForce RTX 4090 has a whopping 16,384 shader cores, and an AMD Radeon
    RX 7900 XTX has 6,144 shader cores.


    These two numbers can’t be compared directly due to internal differences between
    these two GPUs, but the raw numbers show one thing: If we were able to use some
    of the shader cores to calculate our model matrices for the animation frames,
    the computation would be a lot faster. At the same time, our CPU would have less
    work to do, enabling us to do other tasks while the GPU calculates the model matrices.


    Thanks to graphics API designers and GPU vendors, using these shader cores is
    as easy as writing a small, C-like program: a compute shader.'
  merge: -1
  img_proc: true
- pgno: 80
  md: "# Welcome to the wonderful world of compute shaders\n\nUp to OpenGL 4.2, doing\
    \ computations on the GPU was already possible by utilizing the other shader types,\
    \ like vertex and fragment shaders. Similar to uploading arbitrary data to the\
    \ GPU via texture buffer objects, shaders could be used to do massive parallel\
    \ computations, saving the results into a texture buffer. The final texture could\
    \ be read back to the CPU-accessible memory – et voila: the GPU helped us do some\
    \ expensive calculations.\n\nWith the introduction of OpenGL 4.3, this process\
    \ was simplified by officially adding compute shaders and shader storage buffer\
    \ objects (SSBOs). In Vulkan 1.0, the support for compute shaders and SSBOs was\
    \ already mandatory, bringing the new graphics API to par with OpenGL 4.3+.\n\n\
    The advantages of SSBOs are great: shaders can read and write to an SSBO, unlike\
    \ read-only uniform buffers. The general access to an SSBO is simplified too,\
    \ as it has no hard-limited maximum size. Combined with slightly different padding\
    \ for float and vec2 data types, getting or setting a value in an SSBO is simple,\
    \ like using a C-style array:\n\n```\nlayout (std430, binding = 0) readonly buffer\
    \ Matrices {\n    mat4 matrix[];\n};\n...\nvoid main() {\n    ...\n    mat4 boneMat\
    \ = matrix[index];\n    ...\n}\n```\n\nOn the other hand, with compute shaders,\
    \ you get full control of the number of shader instances you want to start. The\
    \ overall number of shader invocations depends on the setting in the compute shader\
    \ and the dispatch call.\n\nSuppose we use the following compute shader settings:\n\
    \n```\nlayout(local_size_x = 16, local_size_y = 32,\n    local_size_z = 1) in;\n\
    ```\n\nThen, run this OpenGL dispatch call:\n\n```\nglDispatchCompute(10, 10,\
    \ 1);\n```"
  merge: -1
  img_proc: true
- pgno: 81
  md: "It means we will send a request to start 51,200 instances of the shader to\
    \ the GPU driver:\n\n```\n16*32*1*10*10*1 = 51200\n```\n\nFor more details about\
    \ compute shaders, links to tutorials for OpenGL and Vulkan are available in the\
    \ Additional resources section.\n\nWhile there are some additional limitations,\
    \ like the number of shader cores used together for the sake of simplified internal\
    \ management (called a wave on AMD GPUs, and a warp on NVIDIA GPUs), the number\
    \ of invocations shows the user-friendly usage of compute shaders.\n\nYou, the\
    \ programmer, don’t need to care about spawning a massive number of threads in\
    \ the code or joining them at the end of the program. Also, there is no need to\
    \ create mutexes, or atomic variables, to control access to the data. All these\
    \ steps are firmly hidden from your eyes in the depths of the graphics driver.\n\
    \nThough you are not free of obligations – you still have to make sure only a\
    \ single shader invocation reads or writes a single buffer address. But, with\
    \ the help of the control variables set by the GPU, like the global and local\
    \ invocation IDs, this part is also easy – a lot easier compared to the efforts\
    \ needed for manual multi-threading on the CPU.\n\nSo, how do we use the magic\
    \ of the compute shaders in our program? The first step here is to analyze the\
    \ hotspots in the code and to create a plan for how the same data could be computed\
    \ on the GPU.\n\n# Profiling animation performance\n\nTo test the performance\
    \ of the application on your system, you can import the test model named Woman.gltf\
    \ in the woman subfolder of the assets folder, move the slider next to the Create\
    \ Multiple Instances button to 100, and click the button Create Multiple Instances\
    \ several times. Every click will add another 100 instances of the model, distributed\
    \ randomly across the virtual world.\n\nOr, you can change the code for the instance\
    \ slider in the createFrame() method of the UserInterface class in the opengl\
    \ folder. Adjust the fourth parameter of the call, controlling the maximum value\
    \ of the slider:\n\n```\nImGui::SliderInt(\"##MassInstanceCreation\",\n    &manyInstanceCreateNum,\
    \ 1, 100, \"%d\", flags);\n```"
