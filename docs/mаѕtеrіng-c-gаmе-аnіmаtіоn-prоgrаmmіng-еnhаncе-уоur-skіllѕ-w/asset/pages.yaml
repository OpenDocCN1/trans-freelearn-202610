- pgno: 119
  md: "# Adjusting logic to shaders and the UI\n\nAs the next step for adding the\
    \ highlight to the selected instance, the shaders have to be adjusted. In the\
    \ assimp_skinning.vert vertex shader in the shader folder, the new SSBO must be\
    \ added:\n\n```\nlayout (std430, binding = 3) readonly restrict\nbuffer InstanceSelected\
    \ {\nfloat selected[];\n};\n```\n\nThe same addition is needed in the assimp.vert\
    \ shader in the shader folder, used for non-animated model instances.\n\nPlease\
    \ check the binding number – due to the missing animation data, the number of\
    \ SSBOs differs between the shaders for animated and non-animated instances: The\
    \ shader for animated models binds the instance selection data on binding point\
    \ 3 since binding point 2 is already used by the world position matrices:\n\n\
    ```\nmShaderBoneMatrixBuffer.bind();\nmShaderModelRootMatrixBuffer.uploadSsboData(\n\
    mWorldPosMatrices, 2);\nmSelectedInstanceBuffer.uploadSsboData(\nmSelectedInstance,\
    \ 3);\n```\n\nIn contrast, the shader for non-animated models binds only two buffers:\n\
    \n```\nmShaderModelRootMatrixBuffer.uploadSsboData(\nmWorldPosMatrices, 1);\n\
    mSelectedInstanceBuffer.uploadSsboData(\nmSelectedInstance, 2);\n```\n\nTo adjust\
    \ the color of the selected instance, we can now use the internal variable gl_InstanceID\
    \ of the shader, retrieving the value of the data at the location of the instance\
    \ in the selected buffer:\n\n```\ncolor = aColor * selected[gl_InstanceID];\n\
    ```\n\nAs an optional change, we could also decrement the depth value of the selected\
    \ instance by 1.0f:\n\n```\nif (selected[gl_InstanceID] != 1.0f) {\n\tgl_Position.z\
    \ -= 1.0f;\n}\n```"
