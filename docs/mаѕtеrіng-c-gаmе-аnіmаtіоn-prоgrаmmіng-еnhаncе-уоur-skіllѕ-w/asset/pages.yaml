- pgno: 443
  md: '# 13


    # Adding Simple Navigation


    Welcome to Chapter 13! In the previous chapter, we created a separate octree to
    enhance collision detection, allowing us to detect collisions between instances
    and level geometry in a quick and computationally cheap way. Then we added simple
    gravity to the application to keep the instances on the ground of the map, eventually
    resulting in the instances walking on the level floor and small hills. Finally,
    we used inverse kinematics on the feet of the instances to keep both feet on the
    ground when climbing hills or sloped areas of a map.


    In this chapter, we will add pathfinding and navigation. We start with a brief
    overview of methods used for navigation in computer games, followed by an exploration
    and the implementation of the A* path-finding algorithm. Next, we will add navigation
    targets to the application, enabling a simple way to place path destinations in
    the virtual world. At the end of the chapter, we will implement the navigation
    toward the waypoints, allowing the instances to walk or run toward a defined target.


    In this chapter, we will cover the following topics:


    +   - An overview of different ways to navigate

    +   - The A* path-finding algorithm

    +   - Adding navigation targets to the map

    +   - Navigating instances to a target


    # Technical requirements


    The example code for this chapter is available in the chapter13 folder, in the
    01_opengl_navigation subfolder for OpenGL and the 02_vulkan_navigation subfolder
    for Vulkan.'
  merge: -1
  img_proc: true
- pgno: 444
  md: '# An overview of different ways to navigate


    Pathfinding and navigation have been used in video games for much longer than
    one might think. Let’s explore a couple of navigation methods.


    # Distance-based navigation


    One of the oldest games using a simple algorithm to mimic intelligent behavior
    for enemies is **Pac-Man by Namco**. Each of the four ghosts (Blinky, Pinky, Inky,
    and Clyde) has a slightly different kind of “character,” created only by the target
    point of the ghost’s movement.


    While the red ghost (Blinky) is chasing Pac-Man directly, the pink ghost (Pinky)
    and the blue ghost (Inky) will try to get in front of Pac-Man, effectively trying
    to surround the player. The fourth ghost (the orange Clyde) has “a mind of its
    own” and switches between chasing the player and running away.


    The decision about the new path to choose is made only at the intersections in
    the game’s maze and is based entirely on the distance to the target tile for all
    possible ways at the intersection. The game does not use more advanced look-ahead
    path planning, sometimes leading to a bad decision. Figure 13.1 shows such a decision
    situation at an intersection:


    ![](img/3cfb9832c943f5f7366fd104b5255971_444_0.png)


    Figure 13.1: Navigation decision of the red ghost in Pac-Man


    In Figure 13.1, the green box is the field triggering a decision to go left or
    right and the two dashed green lines are the direct distances to the red-outlined
    target tile. Even though the right path is shorter, the left path will be chosen
    due to the shorter decision distance on the left, creating erratic behavior of
    the ghost. A link is available in the Additional resources section with in-depth
    information about the internals of ghost navigation.'
  merge: -1
  img_proc: true
- pgno: 445
  md: 'Simple distance-based navigation is still used in games today, for instance,
    to find the spot where an enemy could intercept the player, based on the speed
    and direction of both entities. Planning the path to the player is then done with
    a graph-based navigation algorithm.


    # Graph-based navigation


    In a graph, search algorithms use the nodes of a graph to describe locations on
    a game map and the edges to describe the connections between the nodes. By building
    a graph of the map, the shortest path between two locations can be found in an
    organized manner.


    Several graph algorithms are used in navigation. The most common ones are:


    +   - Depth-First Search (DFS)


    +   - Breadth-First Search (BFS)


    +   - Dijkstra’s algorithm


    +   - A* (pronounced “A star”)


    # DFS and BFS algorithms


    Both of these are simple algorithms. While DFS traverses the graph “depth-first,”
    from the start node to the most distant node, BFS visits the nearest nodes first,
    advancing in “rings” to the next nodes. Figure 13.2 shows an example graph made
    of six nodes named A to F:


    ![](img/3cfb9832c943f5f7366fd104b5255971_445_0.png)


    Figure 13.2: BFS and DFS


    The BFS algorithm on the left side of Figure 13.2 starts with the closest nodes
    (B, C, and D) after the root node (A) and then traverses to nodes E and F. The
    DFS algorithm on the right side of Figure 13.2 traverses child node D and D’s
    child node (F) first, advancing to nodes C and E, and, finally, to node B.'
  merge: -1
  img_proc: true
- pgno: 446
  md: '# Dijkstra''s algorithm


    Dijkstra’s algorithm adds weights to the edges of a graph. The weights can be
    seen as costs or distances to travel from one node to another, depending on the
    problem to solve. Dijkstra’s algorithm traverses the entire graph, building a
    table containing the shortest paths from a start node to all other nodes of the
    graph.


    Figure 13.3 shows the starting graph and the result after all steps of the algorithm:


    ![](img/3cfb9832c943f5f7366fd104b5255971_446_0.png)


    Figure 13.3: A graph and the shortest distances from A to all other nodes


    By using Dijkstra’s algorithm, any weighted graph can be traversed to find the
    paths with the lowest costs (or distances) from one node to all other nodes, but
    the algorithm must be rerun for every start node. For a full description of the
    algorithm, a link in the Additional resources section is provided showing the
    steps of finding the shortest distances for the graph in Figure 13.3.


    # A* algorithm


    A* uses Dijkstra’s algorithm as a basis, but two additions are made:


    +   - A so-called heuristic is added to each node, stating the estimated distance
    from each node to the target node.


    +   - The algorithm searches from a start node to a specified target node and
    usually terminates when the target node has been reached.


    By combining the distance from the start node to a node and the estimated distance
    from the same node to the target node and using the shortest sum while traversing
    to the next node, A* does a directed search toward the target node. So, instead
    of doing an undirected search like BFS or DFS, A* always heads in the direction
    of the target node. We will discuss A* in depth in the The A* path-finding algorithm
    section.'
  merge: -1
  img_proc: true
- pgno: 447
  md: 'One drawback of the algorithms in this section is that they have to recreate
    the entire path if the target is not static. For dynamic targets, algorithms like
    LPA*, D*, or D*-Lite could deliver better results. Also, several other path-finding
    algorithms have been created since the introduction of A*, aiming for special
    environments like in robotics, or to further optimize the outcome path-finding
    process, like in Theta*.


    Before exploring A*, let’s look at another popular navigation type in video games,
    using triangles or other polygons to describe the walkable area for bots and NPCs,
    and also take a short look at machine learning as an alternative version to create
    navigation data.


    # Mesh-based navigation


    Simple games like Pac-Man and many strategy games use distance-based navigation
    by dividing the world into a grid, usually built from rectangular or hexagonal
    structures. But the needs of three-dimensional games (like an open world) or first-
    and third-person exploration and fighting games are different. Due to overlapping
    parts of the virtual world, a three-dimensional structure is needed to be able
    to guide computer-controlled characters through the map.


    Most games with three-dimensional maps use either navigation meshes, area awareness,
    or a combination of both.


    # Navigation meshes


    Navigation meshes (also called NavMeshes) were introduced in games around the
    year 2000. A navigation mesh is an additional data structure made of polygons
    (triangles in most implementations), overlaying the level geometry. The polygons
    in a navigation mesh mark the walkable area of a level, omitting any objects and
    structures a computer-controlled character could collide with.


    By using a navigation mesh, a bot or NPC can walk around in the virtual world
    while avoiding costly collision checks with static level geometry if the character
    stays on the navigation mesh. Only if the character can leave the navigation mesh
    are collision checks required. In combination with a graph-based algorithm like
    A*, fine-grained control of the behavior of computer-controlled characters is
    possible. A link to a comprehensive introduction to pathfinding with navigation
    meshes is available in the Additional resources section. Figure 13.4 shows a simple
    example:'
  merge: -1
  img_proc: true
- pgno: 448
  md: '![](img/3cfb9832c943f5f7366fd104b5255971_448_0.png)


    Figure 13.4: Navigation mesh with start (green), target (red), and path from start
    to target


    In Figure 13.4, the top picture shows the shortest possible path from the starting
    triangle (green) to the target triangle (red) by using the next vertex in a line
    of sight to the next sharp corner of the mesh.


    In comparison, the path in the middle picture uses the triangle centers as graph
    nodes for the path-finding algorithm, and the bottom picture uses the inner triangle
    edges as graph nodes.


    The path’s quality depends on the mesh and which part or parts of a triangle will
    be used for the graph node. Combinations of the methods in Figure 13.4 are possible,
    so both the center and the middle of triangle edges could be used as graph nodes.
    The resulting path can also be smoothed by skipping to the next directly visible
    node and by using splines for the curves.


    Be aware that if the edge navigation mesh is too close to walls or borders in
    a narrow passage, an instance may collide with the walls, generating additional
    movement corrections or leading to an impassable part of the mesh. Static obstacles
    in a level should also be bypassed at a safe distance.'
  merge: -1
  img_proc: true
- pgno: 449
  md: 'As a rule of thumb, use the distance between the edges and the center of the
    axis-aligned bounding box of an instance as the minimum distance between the edges
    of the navigation mesh and the adjacent level geometry. By keeping the instance
    away from walls at any time, no collision can occur during normal navigation.


    # Generating a navigation mesh from level data


    Usually, a navigation mesh will be created by hand and added to the level data.
    But we need a solution for levels found on the internet, so we will do a shortcut
    in the code and use the same upward-facing triangles as “possibly walkable ground”
    that are used for the detection if the instance collides with the level ground.


    In combination with adjacency relations between all ground triangles, an estimation
    of the walkable area in the level can be achieved. A couple of enhancements to
    the ground area creation code are available as tasks in the Practical sessions
    section.


    By using navigation meshes, two kinds of navigation are possible: free roaming
    through the virtual world and patrolling between waypoints.


    # Free navigation


    With free navigation, any point on a map can be a target point for the start and
    destination. Moving from one part of the level to another may be costly to calculate;
    in the worst case, the entire mesh must be checked during pathfinding. Also, the
    path of the character may be entirely different between two path plannings, depending
    on the exact position of the start and target.


    # Waypoint navigation


    A better approach for mesh-based navigation is to define waypoints on the navigation
    mesh that are visible to each other. For instance, every door in a group of rooms
    will be a waypoint or every fork in the road. When a bot moves through the virtual
    world, a waypoint is set as the next target after reaching the desired waypoint.
    If the player is spotted and then lost, the bot can return to the nearest waypoint.
    By making sure that the computer-controlled character can always “see” at least
    one waypoint, path planning to that next waypoint becomes cheap and easy to calculate.


    # Area awareness system


    In 1999, id Software used a system called area awareness in Quake III Arena. Instead
    of two-dimensional graphs, a simplified three-dimensional representation of the
    levels was created, containing all information about the level structure, other
    bots, and the player.'
  merge: -1
  img_proc: true
- pgno: 450
  md: "The bots can traverse the awareness areas not only by walking, jumping, or\
    \ swimming but also by using a teleporter, a jump pad, or even by doing a rocket\
    \ jump. With such a large repertoire of actions, a bot can easily follow the player\
    \ around in the level or try to cut off the player’s path.\n\nA full description\
    \ of the area awareness system is available in a link to a PDF document in the\
    \ Additional resources section.\n\n# # Using machine learning to generate navigation\
    \ data\n\nA more recent way to create navigation data for computer-controlled\
    \ characters is machine learning, mostly in the form of so-called reinforced learning.\
    \ During reinforced learning, an agent representing the character explores the\
    \ virtual world on its own in a large amount of “trial-and-error” style rounds,\
    \ but with added rewards for achieving a defined task or a punishment for failing\
    \ to complete the task.\n\nSuch a task could be something like “Reach a defined\
    \ target point with maximum health,” “Don’t fall off the level,” or “Complete\
    \ the level in minimum time.” By taking the rewards and punishments of previous\
    \ explorations into account, the agent optimizes its behavior to maximize rewards\
    \ and minimize punishments. When the data generated by these agents is used in\
    \ games, the enemies can utilize the strategies from machine learning to appear\
    \ even more natural when moving around in the virtual world.\n\nTwo challenges\
    \ of machine learning are making the usage time- and cost-expensive:\n\n+   -\
    \ Goals, rewards, and punishments must be clearly defined and adjusted during\
    \ the calculations. Even if we humans think that the goals and rewards are well-defined,\
    \ the machine learning algorithm could find unexpected ways to maximize rewards.\
    \ A failure in the setup may result in discarding the data and doing a complete\
    \ restart of the entire machine learning cycle.\n+   \n+   - Since machine learning\
    \ is exploring the virtual world by trial and error, progress is non-deterministic\
    \ and may happen only in insignificant amounts. Even for simple tasks, thousands\
    \ of game rounds must be played to achieve the desired results while the game\
    \ is running. Creating a complex AI that explores big levels of the game may need\
    \ a significant amount of computational resources, leading to excessive development\
    \ costs.\n\nEven though machine learning may produce better results than algorithm-based\
    \ navigation, it is recommended to check the trade-offs between possible improvements\
    \ and additional costs. A link to a video showing the progress of letting a machine\
    \ learn how to drive a car is available in the Additional resources section."
  merge: -1
