- pgno: 203
  md: "The offset of 180 degrees is needed due to the different angle ranges of instances\
    \ and cameras. While the instance has a range of -180 to 180 degrees, the camera\
    \ uses a range of 0 to 360 degrees. We also invert the direction of the instance\
    \ rotation.\n\nNext, we calculate the offset of the camera from the instance by\
    \ using simple trigonometry:\n\n```\nglm::vec3 offset = glm::vec3(\n    -glm::sin(glm::radians(rotationAngle)),\n\
    \    1.0f,\n    glm::cos(glm::radians(rotationAngle))\n) * mCamSettings.csThirdPersonDistance;\n\
    ```\n\nUsing sine and cosine rotates the camera around the center of an imaginary\
    \ unit circle. A unit circle has a radius of one, so using 1.0f for the Y axis\
    \ of the offset leads to the same height distance from the ground as the radius\
    \ of the imaginary circle. By using a uniform scaling with the csThirdPersonDistance\
    \ variable, we can control the distance of the camera from the instance. And with\
    \ the csThirdPersonHeightOffset variable, we can separately adjust the height\
    \ of the camera.\n\nNext, we add the separate camera height offset and set the\
    \ world position of the camera to the instance world position plus the offset:\n\
    \n```\noffset.y += mCamSettings.csThirdPersonHeightOffset;\nmCamSettings.csWorldPosition\
    \ =\n    instSettings.isWorldPosition + offset;\n```\n\nNow, the camera is always\
    \ placed behind the instance, and we can control the view distance and an additional\
    \ camera height offset.\n\nFor the elevation angle of the view, we utilize the\
    \ dot product again, this time between the vector from the camera to the instance\
    \ and the upward-pointing mWorldUpVector:\n\n```\nglm::vec3 viewDirection =\n\
    \    instSettings.isWorldPosition -\n    mCamSettings.csWorldPosition;\n\nmCamSettings.csViewElevation\
    \ = (90.0f -\n    glm::degrees(\n        glm::acos(\n            glm::dot(\n \
    \               glm::normalize(viewDirection), mWorldUpVector\n            )\n\
    \        )\n    )\n```"
  merge: -1
  img_proc: true
- pgno: 204
  md: "```\n)\n)) / 2.0f;\n```\n\nAs a result, we get half the angle in degrees between\
    \ the mWorldUpVector and the view direction. The camera points slightly down to\
    \ the world position of the instance, but still upward enough to look over the\
    \ shoulders of the instance.\n\nFigure 6.4 shows the third-person view behind\
    \ the selected model:\n\n![](img/3cfb9832c943f5f7366fd104b5255971_204_0.png)\n\
    \nFigure 6.4: Third-person view\n\nIn addition to the calculation of camera position\
    \ and view angles, we should disable the user-based camera movement. Ignoring\
    \ the request to control the camera gives better feedback to the user than visibly\
    \ resetting the camera changes in every frame.\n\n# Disabling manual camera movement\n\
    \nIgnoring the request to change the camera angle can be achieved by a simple\
    \ addition. We only need to get the camera settings and surround the block, changing\
    \ the mMouseLock variable in handleMouseButtonEvents() with the following condition:\n\
    \n```\nif (!(camSettings.csCamType ==\n    cameraType::thirdPerson ||\n```"
