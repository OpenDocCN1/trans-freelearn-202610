    \n      try {\n\n        rhs.csWorldPosition =\n\n          node[\"position\"\
    ].as<glm::vec3>();\n\n      } catch (...) {\n\n        rhs.csWorldPosition =\n\
    \n          defaultSettings.csWorldPosition;\n\n      }\n\n      try {\n\n   \
    \     rhs.csViewAzimuth =\n          node[\"view-azimuth\"].as<float>();\n```"
