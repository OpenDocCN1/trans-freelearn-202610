- pgno: 393
  md: "# Performance considerations for asset AABBs\n\nCurrently, the AABB for non-animated\
    \ instances is calculated for every instance in every frame, like the AABB for\
    \ the animated instances. If the calculation becomes a bottleneck, for example,\
    \ if a lot of static assets are placed in the virtual world, changing the AABB\
    \ computation only on property changes in the UI can be done easily.\n\nOnce the\
    \ level data has been loaded and processed and the AABBs are calculated, we are\
    \ ready to draw the level triangles to the screen.\n\nLet’s extend the renderer\
    \ to add the level data to the rendering process.\n\n# Sending the level data\
    \ to the GPU\n\nWith every addition of new features, it becomes simpler to reuse\
    \ code in the application. In the case of level data, mesh data is encapsulated\
    \ in the AssimpLevel class, and drawing the level’s triangles can be done in a\
    \ small loop over all loaded levels.\n\nAs the first step, we create a new shader\
    \ to draw the level data.\n\n# Creating a new shader\n\nSince we need to draw\
    \ the level triangles only once, using a separate shader for the level data is\
    \ a clever idea. Add the private shader named mAssimpLevelShader to the header\
    \ file of the renderer class:\n\n```\nShader mAssimpLevelShader{};\n\n```\n\n\
    The shader will use the two new files, assimplevel.vert for the vertex shader\
    \ and assimplevel.frag for the fragment shader. We load the files along with the\
    \ other shaders in the init() method of the renderer:\n\n```\nif (!mAssimpLevelShader.loadShaders(\n\
    \"shader/assimp_level.vert\",\n\"shader/assimp_level.frag\")) {\n  return false;\n\
    }\n\n```"
  merge: -1
  img_proc: true
- pgno: 394
  md: "The fragment shader file, assimp_level.frag, is just a copy of the assimp.frag\
    \ file without any changes. For the vertex shader file, assimp_level.vert, we\
    \ can copy the assimp.vert file and keep the in and out layout portion and the\
    \ Matrices uniform buffer.\n\nWe don’t need the selection buffer since no visual\
    \ selection has been implemented for the level data, and we can change the buffer\
    \ at binding point 1 to contain only a single 4x4 matrix:\n\n```\nlayout (std430,\
    \ binding = 1) readonly restrict\n  buffer WorldTransformMatrix {\n    mat4 worldTransformMat;\n\
    };\n```\n\nUploading only small data elements like a single matrix to a uniform\
    \ buffer on the GPU is not the best idea as every upload may add a small delay\
    \ to the frame. For a real game, or a game engine, the world transform matrix\
    \ would be part of a bigger buffer, but for the sake of simplicity we just do\
    \ the single upload here.\n\nIn the main() method of the vertex shader, we use\
    \ the worldTransformMat to transform the position and normal vertices to the final\
    \ position given by the matrix created from the level properties:\n\n```\nvoid\
    \ main() {\n  gl_Position = projection * view * worldTransformMat *\n    vec4(aPos.x,\
    \ aPos.y, aPos.z, 1.0);\n  color = aColor;\n  normal = transpose(inverse(worldTransformMat))\
    \ *\n    vec4(aNormal.x, aNormal.y, aNormal.z, 1.0);\n  texCoord = vec2(aPos.w,\
    \ aNormal.w);\n}\n```\n\nThen, in the draw() method of the renderer, we loop over\
    \ all levels and skip the null level by checking for the existence of any triangles:\n\
    \n```\nfor (const auto& level : mModelInstCamData.miLevels) {\n  if (level->getTriangleCount()\
    \ == 0) {\n    continue;\n  }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 395
  md: "As the last step of the level display process, the vertex drawing is triggered:\n\
    \n```\nmAssimpLevelShader.use();\nmShaderModelRootMatrixBuffer.uploadSsboData(\n\
    \    level->getWorldTransformMatrix(), 1);\nlevel->draw();\n}\n```\n\nWe use the\
    \ new mAssimpLevelShader, upload the transformation matrix of the level to the\
    \ shader, and call the draw() method of the AssimpLevel object.\n\nDrawing the\
    \ level AABB on the screen requires a few more methods and member variables in\
    \ the renderer.\n\n# Drawing the level AABB\n\nThe level AABB vertices are stored\
    \ in a new private member variable named mAllLevelAABB in the renderer class:\n\
    \n```\nAABB mAllLevelAABB{};\n```\n\nAlso, two new private methods named generateLevelAABB()\
    \ and drawLevelAABB() are added to the renderer class:\n\n```\nvoid generateLevelAABB();\n\
    void drawLevelAABB(glm::vec4 aabbColor);\n```\n\nWe also split generating and\
    \ drawing the AABB lines here to avoid costly calculations in every frame we draw.\n\
    \nGenerating the level AABB in generateLevelAABB() is done in a simple loop. After\
    \ clearing the level AABB data, we loop over all loaded levels:\n\n```\nmAllLevelAABB.clear();\n\
    for (const auto& level : mModelInstCamData.micLevels) {\n    if (level->getTriangleCount()\
    \ == 0) {\n        continue;\n    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 396
  md: "# Loading a Game Map\n\nThe check for a level without triangles skips the null\
    \ level since there is nothing to draw to the screen. Then, we generate the AABB\
    \ of each level and add the minimum and maximum extents of each level to mAllLevelAABB:\n\
    \n```\nlevel->generateAABB();\nmAllLevelAABB.addPoint(level->getAABB().getMinPos());\n\
    mAllLevelAABB.addPoint(level->getAABB().getMaxPos());\n}\n```\n\nThe resulting\
    \ AABB contains all the level data of all the loaded levels. If you want to have\
    \ separate AABBs for each level, you could use a vector of AABBs instead the single\
    \ AABB.\n\nDrawing the level AABB in the drawLevelAABB() method needs little explanation:\n\
    \n```\nmAABBMesh = mAllLevelAABB.getAABBLines(aabbColor);\nmLineVertexBuffer.uploadData(*mAABBMesh);\n\
    mLineShader.use();\nmLineVertexBuffer.bindAndDraw(GL_LINES, 0, mAABBMesh->vertices.size());\n\
    ```\n\nWe use the getAABBLines() method of the AABB to create the line data, upload\
    \ the lines to the mLineVertexBuffer, call use() on LineShader, and then call\
    \ bindAndDraw() on the mLineVertexBuffer object to draw the axis-aligned bounding\
    \ box of the level data.\n\nThen, in the draw() method of the renderer, we call\
    \ drawLevelAABB() when rdDrawLevelAABB is set to true:\n\n```\nif (mRenderData.rdDrawLevelAABB)\
    \ {\n glm::vec4 levelAABBColor = glm::vec4(0.0f, 1.0f, 0.5f, 0.5f);\n drawLevelAABB(levelAABBColor);\n\
    \ }\n```\n\nThe color has been chosen randomly, you may change the color value\
    \ or even add a 3-element float slider to the UI to control the color value.\n\
    \nShowing the level AABB lines on screen is done by a new Boolean variable called\
    \ rdDrawLevelAABB in the OGLRenderData struct in the OGLRenderData.h file:\n\n\
    ```\nbool rdDrawLevelAABB = false;\n```"
  merge: -1
  img_proc: true
