- pgno: 329
  md: '# 10


    # Advanced Animation Blending


    Welcome to *Chapter 10*! In the previous chapter, we added a bit more *real-life
    behavior* to the instances. After a brief overview of behavior trees, we added
    a visual node editor to visually draw the behavior of the instances by using a
    simple finite state machine. At the end of the chapter, we extended the code and
    implemented interaction as an additional form of behavior.


    In this chapter, the instances will come even more to life. We start with a short
    exploration of the world of face animations made by morph target animations. Then
    we will add extra functionality to load morph meshes into the application and
    enable control over the face animations of the instances. Next, we add a graph
    node to be able to use face animations in the node trees as well. At the end of
    the chapter, additive blending will be implemented, allowing us to move the head
    of the instances independently of the skeletal and face animations.


    In this chapter, we will cover the following topics:


    +   - How to animate facial expressions

    +   - Adding face animations to code and GPU shaders

    +   - Using face animations in node trees

    +   - Implementing additive blending


    # Technical requirements


    The example code is in the chapter10 folder, in the 01_opengl_morphanim subfolder
    for OpenGL and 02_vulkan_morphanim subfolder for Vulkan.'
  merge: -1
  img_proc: true
- pgno: 330
  md: '# # How to animate facial expressions


    After implementing behavior in Chapter 9, life in our virtual world has become
    a lot more vivid. The instances can walk or run around by themselves, do simple
    tasks at random times, react to a collision with another instance, and won’t leave
    the virtual world beyond the invisible borders.


    But the instances still appear a bit sterile and lifeless. They roam around like
    robots, always looking forward, keeping a straight face. No emotions are visible,
    and there are no reactions to interactions other than playing a waving animation.


    So, let’s give the instances the ability to show emotions by adding facial expressions.
    The most common way to add face animations to any kind of living virtual object
    is morph target animations.


    To get the idea of morph target animations, here’s a simple example. In Figure
    10.1, three different weights of a morph target animation are shown:


    ![](img/3cfb9832c943f5f7366fd104b5255971_330_0.png)


    The left face has an angry morph target animation applied to 0%, showing only
    the original face. The middle face has the morph target applied to 50%, blending
    halfway between the original face and the full morph, and for the right face,
    the full morph target animation has been applied.


    As you can see, the eyebrows have been rotated, the mouth vertex has been moved
    a bit upward in the final state, and the vertex positions are only interpolated
    between the original and the final mesh. But these small vertex position changes
    create an entirely different facial expression for the model.


    Morph target animations may have a different name in your tool, such as per-vertex
    animation, shape interpolation, shape keys, or blend shapes. All these names describe
    the same technique: multiple deformed versions of a mesh are stored in keyframes,
    and the animation of the mesh is done by interpolating the vertex positions between
    the positions in the keyframes.'
  merge: -1
  img_proc: true
- pgno: 331
  md: 'There''s an important difference between skeletal animals and morph target
    animations when it comes to cost: a skeletal animation only affects the properties
    of the model''s nodes, while morph animations replace an entire mesh of the model''s
    virtual skin, and the mesh needs to be duplicated for every morph animation the
    model should play, raising the overall size of the model as a file on disk and
    in memory.


    Models have quite a small number of bones but many vertices for the skin, so recalculating
    the positions for a large number of vertices in every frame adds extra computation
    costs to morph animations. Luckily, the morph animations happen entirely in the
    vertex shader and are only linear interpolations between two positions saved as
    vectors. Thus, the additional computational burden of a morph animation remains
    negligible in our example code.


    In Blender, morph target animations can be controlled by the Shape Keys options
    on the Data tab. Figure 10.2 shows the setting used for the right face of Figure
    10.1, with the Value set to 1.000 to apply 100% of the Angry morph:


    ![](img/3cfb9832c943f5f7366fd104b5255971_331_0.png)


    Creating and modifying shape key-based morph target animations in Blender is beyond
    the scope of this book. Blender has some basic documentation about shape keys,
    a link is included in the Additional resources section, and there are plenty of
    videos around showing how to work with shape keys in Blender.


    If you have a model file containing morph target animations available, like the
    two models in the assets folder of Chapter 10, or if you have created your own
    set of morph animations in any other existing model, you are ready to go for the
    next step: using the Open Asset Importer Library to import these extra animations.'
  merge: -1
  img_proc: true
- pgno: 332
  md: "Let’s now learn how to add morph target animations to our application.\n\n\
    # Adding face animations to code and GPU shaders\n\nMorph target animation data\
    \ is stored in two places in an Assimp model file.\n\nThe first part of the morph\
    \ animation data, the meshes, reside in the mAnimMeshes array of an aiMesh node,\
    \ and the number of meshes is stored in the mNumAnimMeshes variable of the aiMesh.\
    \ Every element of the mAnimMeshes array contains the exact same number of vertices\
    \ as the original mesh, allowing us to interpolate the vertex positions between\
    \ different versions of the mesh.\n\nThis interpolation is not limited to blending\
    \ between the original mesh and one of the morph target meshes. Also, blending\
    \ between two morph target meshes is possible, or mixing positions of more than\
    \ two meshes. Be aware that the outcome of mixing meshes may not always be as\
    \ expected as the effect of the morph target animations heavily depends on the\
    \ intention of the animator.\n\nThe second part of the morph animation data, the\
    \ keyframe data, is in the mMorphMeshChannels array of an aiAnimation node, which\
    \ has the number of keyframes stored in a variable called mNumMorphMeshChannels.\
    \ The keys in every keyframe contain the points in time for the specific key,\
    \ plus the numbers of the morph mesh to use and the weight of the morph mesh in\
    \ a linear interpolation.\n\nWe will only use the mesh data to interpolate between\
    \ different facial expressions, so we ignore the animation data for the morph\
    \ meshes. But it is easy to add support for the morph target animations on top\
    \ of the code of this chapter.\n\nAs the first step on the way to morph animations,\
    \ we will learn how to load the additional mesh data and extract the vertices.\n\
    \n# Loading morph meshes\n\nSince every vertex in a morph mesh replaces the position\
    \ and the normal of the same vertex in the original mesh, only a subset of vertex\
    \ data is needed for the replacement vertices. We will create a lightweight version\
    \ of a vertex named OGLMorphVertex in the OGLRenderData.h file in the opengl folder,\
    \ containing only the position and normal:\n\n```\nstruct OGLMorphVertex {\n \
    \   glm::vec4 position = glm::vec4(0.0f);\n    glm::vec4 normal = glm::vec4(0.0f);\n\
    };\n```"
  merge: -1
  img_proc: true
- pgno: 333
  md: "To collect the replacement morph vertices into a mesh, we also create a new\
    \ struct called OGLMorphMesh that contains all the vertices in a std::vector:\n\
    \n```\nstruct OGLMorphMesh {\n\tstd::vector<OGLMorphVertex> morphVertices{};\n\
    };\n```\n\nAs all the morph meshes depend on the original meshes, we add a OGLMorphMesh\
    \ vector to the default mesh, struct OGLMesh:\n\n```\nstruct OGLMesh {\n\t...\n\
    \tstd::vector<OGLMorphMesh> morphMeshes{};\n};\n```\n\nFor Vulkan, the two new\
    \ structs are named VkMorphVertex and VkMorphMesh, residing in the VkRenderData.h\
    \ file in the vulkan folder. The VkMorphMesh vector is added to the VkMesh struct.\
    \ Right before the end of the processMesh() method in the As simpMesh class, we\
    \ add a new code block to extract the morph mesh data from the model file. First,\
    \ we check if we have any morph meshes attached to the current mesh:\n\n```\n\
    int animMeshCount = mesh->mNumAnimMeshes;\nif (animMeshCount > 0) {\n```\n\nIf\
    \ we find morph meshes, we iterate over all morph meshes, extracting the mesh\
    \ data and the number of vertices:\n\n```\nfor (unsigned int i = 0; i < animMeshCount;\
    \ ++i) {\n\taAnimMesh* animMesh = mesh->mAnimMeshes[i];\n\tunsigned int mAnimVertexCount\
    \ = animMesh->mNumVertices;\n}\n```\n\nPer definition, the number of vertices\
    \ in the morph mesh must match the number of vertices in the original mesh. It\
    \ does not hurt to do an addition check here, skipping the entire morph mesh and\
    \ printing an error when a vertex count mismatch is detected:\n\n```\nif (animVertexCount\
    \ != mVertexCount) {\n\tLogger::log(1, \"%s error: morph mesh %i vertex count\
    \ does not match (orig mesh has %i vertices, morph mesh %i)\\n\",\n\t\torig mesh\
    \ has %i vertices, morph mesh %i)\\n\",\n\t\torig mesh has %i vertices, morph\
    \ mesh %i)\\n\"\n```"
  merge: -1
  img_proc: true
- pgno: 334
  md: "# Transformer\n\nTransformer 是 Google 团队在 2017 年提出的一种基于自注意力机制（Self-Attention）的深度学习模型架构，其论文《Attention\
    \ Is All You Need》发表于 NeurIPS 2017。Transformer 摒弃了传统的循环神经网络（RNN）与卷积神经网络（CNN），完全依赖注意力机制来建模序列中任意两个位置之间的依赖关系，解决了长距离依赖问题，并且高度支持并行计算。\n\
    \nTransformer 整体结构采用 Encoder-Decoder 架构。编码器（Encoder）由若干相同的层堆叠而成，每一层包含多头自注意力子层和前馈神经网络子层；解码器（Decoder）在编码器结构的基础上额外增加了对编码器输出进行交叉注意力的子层。每个子层之后都应用了残差连接（Residual\
    \ Connection）和层归一化（Layer Normalization）。\n\n+   - 核心优势：并行计算、长距离依赖建模、全局感受野\n+ \
    \  - 关键模块：Self-Attention、Multi-Head Attention、Positional Encoding\n+   - 主要应用：机器翻译、文本分类、问答系统、预训练语言模型（如\
    \ BERT、GPT）\n\n```\n```python\n# 注意力计算（Scaled Dot-Product Attention）\ndef attention(query,\
    \ key, value, mask=None):\n    d_k = query.size(-1)\n    scores = torch.matmul(query,\
    \ key.transpose(-2, -1)) / math.sqrt(d_k)\n    if mask is not None:\n        scores\
    \ = scores.masked_fill(mask == 0, -1e9)\n    p_attn = F.softmax(scores, dim=-1)\n\
    \    return torch.matmul(p_attn, value)\n```\n```"
  merge: -1
  img_proc: true
- pgno: 335
  md: 'Accessing any alternative morph meshes is now as simple as checking the morphMeshes
    vector for a size greater than zero, and if we have any morph meshes, extracting
    the vertex data and interpolating between the positions and normals of the original
    vertices and the vertices of the selected morph mesh.


    At this point, all valid morph meshes found in the model file are available as
    part of the AssimpMesh mesh data. To use these morph meshes for face animations,
    we must add some code and logic to the application.


    # Storing all morph meshes in a single buffer


    To use the vertices of the morph meshes in a shader, we store the vertex data
    of all morph meshes into a single SSBO. Using a single SSBO is needed due to the
    instanced rendering of the model instances on the screen – we need the vertex
    data of all meshes available at all times during the rendering since we cannot
    tell when a specific model instance will be drawn to the screen. Splitting the
    rendering depending on the selected morph mesh would also be possible, but that
    would be quite a costly alternative as we must filter the instances on every draw
    call.


    The morph mesh SSBO plus some related variables are added to the AssimpModel class.
    First, three new private variables are added to the AssimpModel.h header file:
    mNumAnimatedMeshes, mAnimatedMeshVertexSize, and mAnimMeshVerticesBuffer:


    ```

    unsigned int mNumAnimatedMeshes = 0;

    unsigned int mAnimatedMeshVertexSize = 0;

    ShaderStorageBuffer mAnimMeshVerticesBuffer{};

    ```


    In mNumAnimatedMeshes, we store the number of morph meshes for this model. Right
    now, the code supports only a single mesh containing morph meshes, so the number
    in mNumAnimatedMeshes is equal to the number of morph meshes in this specific
    mesh.


    But since we are doing only face animations, the limit of a single mesh with morph
    meshes is no problem. Also, a task in the Practical sessions section is available
    to extend the code accordingly and add support for multiple meshes containing
    morph meshes.


    The value in mAnimatedMeshVertexSize is used to find the start of vertex data
    for the selected morph clip in the SSBO. By multiplying the mesh vertex size and
    the index of the morph clip, we can jump directly to the first vertex of the morph
    clip.


    Finally, all vertex data is stored in the mAnimMeshVerticesBuffer SSBO.'
  merge: -1
  img_proc: true
- pgno: 336
  md: "We also add two public methods called hasAnimMeshes() and getAnimMeshVertexSize()\
    \ to the AssimpModel.cpp class implementation file. Thanks to the descriptive\
    \ method names, no further explanation should be required.\n\nFilling the SSBO\
    \ is done in the loadModel() method of the AssimpModel class. When all meshes\
    \ are collected into the mModelMeshes vector, we can iterate over all meshes to\
    \ add the vertex data to the new buffer:\n\n```\nfor (const auto& mesh : mModelMeshes)\
    \ {\n    if (mesh.morphMeshes.size() == 0) {\n        continue;\n    }\n}\n```\n\
    \nAs the first step of collecting the vertices in the mAnimMeshVerticesBuffer\
    \ SSBO, we check if we have any morph meshes in this mesh. If we have a mesh without\
    \ additional morph meshes, we simply continue with the next mesh.\n\nThen, we\
    \ create a temporary OGLMorphMesh called animMesh to collect all vertices and\
    \ resize the morphVertices vector in the animMesh:\n\n```\nOGLMorphMesh animMesh;\n\
    animMesh.morphVertices.resize(\n    mesh.vertices.size() * mNumAnimatedMeshes);\n\
    ```\n\nNow we can copy all vertices of the morph mesh into animMesh, using the\
    \ number of vertices to calculate the correct position:\n\n```\nfor (unsigned\
    \ int i = 0; i < mNumAnimatedMeshes; ++i) {\n    unsigned int vertexOffset = mesh.vertices.size()\
    \ * i;\n    std::copy(mesh.morphMeshes[i].morphVertices.begin(),\n        mesh.morphMeshes[i].morphVertices.end(),\n\
    \        animMesh.morphVertices.begin() + vertexOffset);\n    mAnimatedMeshVertexSize\
    \ = mesh.vertices.size();\n}\n```\n\nFinally, we upload the collected vertices\
    \ to the SSBO:\n\n```\nmAnimMeshVerticesBuffer.uploadSsboData(\n    animMesh.morphVertices);\n\
    }\n```"
  merge: -1
  img_proc: true
- pgno: 337
  md: "Whenever we need the morph animations of this model now, we can bind the buffer\
    \ to a specified shader binding point. This binding can be achieved by using the\
    \ new public method, bindMorphAnimBuffer():\n\n```\nvoid AssimModel::bindMorphAnimBuffer(int\
    \ bindingPoint) {\n\tmAnimMeshVerticesBuffer.bind(bindingPoint);\n}\n```\n\nTo\
    \ use face animations on a per-instance basis, we must add a couple of variables\
    \ and methods and extend some data structures.\n\n# Adding face morph settings\
    \ to the code\n\nThe most important change to enable face animations is a new\
    \ enum class called faceAnimation, which resides in the Enums.h file:\n\n```\n\
    enum class faceAnimation : uint8_t {\n\tnone = 0,\n\tangry,\n\tworried,\n\tsurprised,\n\
    \thappy\n};\n```\n\nAll supported morph animations are stored in the faceAnimation\
    \ enum the same way as actions or node types. Instead of using the morph animation\
    \ from the model files, we will use only a fixed set of face animations in the\
    \ code.\n\nSimilar to other data types, we add a mapping from the enum values\
    \ to strings. It is a lot easier to use the enum value in code and show the user-friendly\
    \ string in the UI. The new map named micFaceAnimationNameMap will be added to\
    \ the ModelInstanceCamData struct in the ModelInstanceCamData.h file:\n\n```\n\
    std::unordered_map<faceAnimation, std::string>\nmicFaceAnimationNameMap{};\n\n\
    ```\n\nFilling the map with strings happens in the init() method of the renderer\
    \ class files, OGLRenderer.cpp or VkRenderer.cpp, the best place is next to the\
    \ existing mapping code."
  merge: -1
  img_proc: true
- pgno: 338
  md: '# Fixed morph mapping vs. dynamic loading from the model


    The reason to hard code all morph target animation clips in the faceAnimation
    enum and micFaceAnimationNameMap is to keep the code simple.


    While populating the list of morph target clips from the model file is easy, maintaining
    a dynamic list in the UI becomes quite complex. For instance, adding code to choose
    a morph clip in a node tree would create a hard dependency between the tree and
    a single model – using the same tree for other models will become impossible.


    To avoid a model-tree dependency, only a predefined set of morph animations will
    be used. Any model can support all morph animations, none of them, or a partial
    number of clips with matching indices, filling any gaps with empty morph animations.


    For the instance part, two new variables named isFaceAnimType and isFaceAnimWeight
    are added to the InstanceSettings struct:


    ```

    faceAnimation isFaceAnimType = faceAnimation::none;

    float isFaceAnimWeight = 0.0f;

    ```


    In isFaceAnimType, we store the current face animation clip. Due to the extra
    none value in the faceAnimation enum, we do not need another Boolean to switch
    the face animations on or off. The interpolation weight between the default face
    mesh and the face animation can be controlled by isFaceAnimWeight, with 0.0f showing
