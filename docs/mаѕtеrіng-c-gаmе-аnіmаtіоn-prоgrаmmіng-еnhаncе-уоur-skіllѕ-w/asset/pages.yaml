- pgno: 436
  md: "We also calculate the offset of the foot node from the ground:\n\n```\nfloat\
    \ footDistAboveGround = std::fabs(\n    instSettings.isWorldPosition.y - footWorldPos.y);\n\
    ```\n\nThis footDistAboveGround offset is needed to let the foot hover above the\
    \ sloped ground triangle at the same distance as the foot would be on a plain\
    \ ground triangle. Then, we use the AABB of the instance to calculate the full\
    \ and half height of the bounding box:\n\n```\nAABB instanceAABB = model->getAABB(instSettings);\n\
    float instanceHeight = instanceAABB.getMaxPos().y - instanceAABB.getMinPos().y;\n\
    float instanceHalfHeight = instanceHeight / 2.0f\n```\n\nWith the two height values,\
    \ we create a ray to detect the intersection with the ground triangle. Next, we\
    \ set a default value for the final hitPoint of the intersection and iterate over\
    \ the colliding triangles:\n\n```\nglm::vec3 hitPoint = footWorldPos;\nfor (const\
    \ auto& tri :\n    instSettings.isCollidingTriangles) {\n    std::optional<glm::vec3>\
    \ result{};\n```\n\nThen we check every colliding triangle for an intersection\
    \ with a ray starting at the half height of the instance, pointing at most the\
    \ entire instance height down:\n\n```\nresult = Tools::rayTriangleIntersection(\n\
    \    footWorldPos +\n    glm::vec3(0.0f, instanceHalfHeight, 0.0f),\n    glm::vec3(0.0f,\
    \ -instanceHeight, 0.0f), tri);\n```\n\nUsing an upper and lower limit for the\
    \ ray helps prevent the misdetection of any nearby triangles. Next, we check if\
    \ we have found an intersection:\n\n```\nif (result.has_value()) {\n    hitPoint\
    \ = result.value() +\n    glm::vec3(0.0f, footDistAboveGround, 0.0f);\n}\n```"
