- pgno: 308
  md: "Both methods are straightforward. We just store the float in a std::string\
    \ on exporting and read back the float value on importing.\n\nAll other specialized\
    \ nodes are created in a similar way, implementing the required methods and enhancing\
    \ the other virtual methods if needed.\n\nAnother well-known coding style from\
    \ the application is using callbacks to call methods in other classes. GraphNodeBase\
    \ uses two callbacks to handle events.\n\n# Using callbacks to propagate changes\n\
    \nBy activating the first callback, a node informs the finite state machine that\
    \ it has finished its execution, and the control should be given to the nodes\
    \ connected to the output pin(s):\n\n```\nfireNodeOutputCallback mNodeCallbackFunction;\n\
    ```\n\nThe method that handles this callback is the main part of the state management\
    \ when advancing the status of the nodes.\n\nReal behavior changes happen in the\
    \ method executed by the second callback:\n\n```\nnodeActionCallback mNodeActionCallbackFunction;\n\
    ```\n\nThis callback is used by the instance and action node types, informing,\
    \ after quite a long callback cascade, the renderer class to manipulate a single\
    \ property of the instance owning the node tree that started the callback.\n\n\
    Here is where all the magic happens, letting the instance mode change the movement\
    \ state to walk or run, or start an action like jumping or waving the hand.\n\n\
    We will now take a closer look at more code that will make use of both callbacks.\n\
    \n# Creating a behavior struct and a storage class for the instances\n\nTo store\
    \ nodes, links, and the action callback, the new struct BehaviorData will be used,\
    \ residing in the file BehaviorData.h in the model folder:\n\n```\nstruct BehaviorData\
    \ {\n    std::vector<std::shared_ptr<GraphNodeBase>>\n    bdGraphNodes{};\n  \
    \  std::unordered_map<int, std::pair<int, int>>\n    bdGraphLinks{};\n```"
