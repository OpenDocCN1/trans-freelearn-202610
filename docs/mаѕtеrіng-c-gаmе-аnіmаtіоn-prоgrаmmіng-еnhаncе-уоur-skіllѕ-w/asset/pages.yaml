    \ maps and the msAllowedStateOrder set by using for loops:\n\n```\n...\nif (settings.msActionClipMappings.size()\
    \ > 0) {\n    out << YAML::Key << \"action-clips\";\n    out << YAML::Value;\n\
    \    out << YAML::BeginSeq;\n    for (auto& setting : settings.msActionClipMappings)\
    \ {\n        out << YAML::BeginMap;\n        out << YAML::Key << setting.first;\n\
    \        out << YAML::Value << setting.second;\n        out << YAML::EndMap;\n\
    \    }\n    out << YAML::EndSeq;\n}\n...\n```\n\nReading back the ModelSettings\
    \ is done in the getModelConfigs() method of the YamlParser class. The YAML parsing\
    \ inside getModelConfigs() method is identical to the parsing of the InstanceSettings\
