- pgno: 280
  md: "```\nuint numberOfBones = gl_NumWorkGroups.x;\nuint index = node + numberOfBones\
    \ * instance;\n```\n\nWe select the node and instance to work on based on the\
    \ invocation IDs of the shader, while the number of nodes in the model comes from\
    \ the X dimension of the number of work groups we use when dispatching the compute\
    \ shader.\n\nNext, we get the node position by extracting the translational part\
    \ from the TRS matrix of the specific node of the instance and adding the position\
    \ from the sphere adjustment buffer:\n\n```\nvec3 nodePos =\n    (worldPosMat[instance]\
    \ * trsMat[index])[3].xyz;\nnodePos += sphereAdjustment[node].xyz;\nfloat radius\
    \ = 1.0;\n```\n\nWe also declare the sphere radius and initialize it with a default\
    \ value.\n\nThen, we extract the parent node ID of the current node from the parent\
    \ index buffer:\n\n```\nint parentNode = parentIndex[node];\n```\n\nThe parent\
    \ node is used to switch between nodes that have a parent and the parent or unconnected,\
    \ standalone nodes. If we find a valid parent, we calculate the world position\
    \ of the parent node, including the position adjustment:\n\n```\nif (parentNode\
    \ >= 0) {\n    uint parentIndex = parentNode +\n        numberOfBones * instance;\n\
    \    vec3 parentPos =\n        (worldPosMat[instance] * trsMat[parentIndex])[3].xyz;\n\
    \    parentPos += sphereAdjustment[parentNode].xyz;\n```\n\nBy using the node\
    \ and parent position, we calculate the middle point between the node and its\
    \ parent. We calculate the radius of the sphere – again, adjustable by the sphere\
    \ adjustment value:\n\n```\nvec3 center = mix(nodePos, parentPos, 0.5);\nradius\
    \ = length(center - nodePos) *\n    sphereAdjustment[node].w;\n```"
