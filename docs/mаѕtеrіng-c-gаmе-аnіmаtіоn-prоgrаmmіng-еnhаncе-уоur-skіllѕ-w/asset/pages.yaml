- pgno: 292
  md: "# Integrating imnodes by using CMake\n\nTo let CMake manage imnodes as a dependency,\
    \ add a new FetchContent block to the file CMakeLists.txt in the project root\
    \ between the FetchContent block for stbi and the WIN32-only area:\n\n```\nFetchContent_Declare(\n\
    \    imnodes\n    GIT_REPOSITORY https://github.com/Nelarius/imnodes\n    GIT_TAG\
    \ v0.5\n)\n```\n\nWe will use the Git tag v0.5 here to avoid problems introduced\
    \ by new commits to the master branch, resulting in not finding the ImGui source\
    \ code.\n\nNext, we make the imnodes code available and let CMake populate the\
    \ variable for the source folder:\n\n```\nFetchContent_MakeAvailable(imnodes)\n\
    FetchContent_GetProperties(imnodes)\nif(NOT imnodes_POPULATED)\n    FetchContent_Populate(imnodes)\n\
    \    add_subdirectory(${imnodes_SOURCE_DIR} EXCLUDE_FROM_ALL)\nendif()\n```\n\n\
    Then, we append the source directory variable for imnodes to the list of already\
    \ existing external source files and include directories:\n\n```\nfile(GLOB SOURCES\n\
    \    ...\n    ${imnodes_SOURCE_DIR}/imnodes.cpp\n)\n...\ntarget_include_directories(...\
    \ ${imnodes_SOURCE_DIR})\n```\n\nAs a last step, we add a compiler definition\
    \ to the existing add_definitions line:\n\n```\nadd_definitions(... -DIMGUI_DEFINE_MATH_OPERATORS)\n\
    ```"
