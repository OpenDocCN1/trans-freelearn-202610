- pgno: 467
  md: 'We can call findPath() now with any combination of start and target triangles
    and get a path back if such a path exists. If no path from start to target exists,
    findPath() returns an empty vector by the check for the empty open list.


    The starting point of the pathfinding is known; it’s the instance. But what about
    the target? Let’s add some configurable navigation targets to the virtual world.


    # Adding navigation targets to the map


    Before we start, let us imagine which properties a possible navigation target
    must have:


    +   - It should come in any shape and number.

    +   - It should be easy to select and move around.

    +   - It can be placed anywhere on the ground.

    +   - Ideally, it should be able to move by itself.


    So, our ideal target is a model instance! And since we already have all the ingredients
    for this list, implementing navigation targets becomes easy.


    # Adjusting model and instance


    First, we add a new Boolean variable named msUseAsNavigationTarget to the ModelSettings
    struct:


    ```

    bool msUseAsNavigationTarget = false;

    ```


    The AssimpModel class also needs two simple public methods named setAsNavigationTarget()
    and isNavigationTarget() to set and query the new variable:


    ```

    void setAsNavigationTarget(bool value);

    bool isNavigationTarget();

    ```


    In the UserInterface class, a checkbox will be added to set the state of a model
    with a simple mouse click. Figure 13.10 shows the Models layout with the new checkbox:


    ![](img/3cfb9832c943f5f7366fd104b5255971_467_0.png)


    Figure 13.10: The Models part of the UI with the new navigation target checkbox'
