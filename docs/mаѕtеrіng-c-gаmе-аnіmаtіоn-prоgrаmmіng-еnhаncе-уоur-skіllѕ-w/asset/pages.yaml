- pgno: 427
  md: "3. We also add the two private members, mNodePositions and mBoneLengths, and\
    \ three private methods, solveFABRIKForward(), solveFABRIKBackwards(), and calculateOrigBoneLengths():\n\
    \n```\nstd::vector<glm::vec3> mNodePositions{};\nstd::vector<float> mBoneLengths{};\n\
    void solveFABRIKForward(glm::vec3 targetPos);\nvoid solveFABRIKBackwards(glm::vec3\
    \ rootPos);\nvoid calculateOrigBoneLengths();\n```\n\n4. In mNodePositions, we\
    \ store the world positions of the nodes during calculation, and in mBoneLengths,\
    \ the required original bone lengths are saved. The name of the calculateOrigBoneLengths()\
    \ method speaks for itself; we don’t need to dive into details there. But let’s\
    \ do a quick walkthrough of the three remaining methods.\n\n5. The forward part\
    \ of FABRIK is handled in solveFABRIKForward(). First, we set the first element\
    \ of mNodePositions to the target position:\n\n```\nvoid IKSolver::solveFABRIKForward(glm::vec3\
    \ targetPos) {\n    mNodePositions.at(0) = targetPos;\n    for (size_t i = 1;\
    \ i < mNodePositions.size(); ++i) {\n        glm::vec3 boneDirection =\n     \
    \       glm::normalize(mNodePositions.at(i) -\n            mNodePositions.at(i\
    \ - 1));\n        glm::vec3 offset = boneDirection *\n            mBoneLengths.at(i\
    \ - 1);\n        mNodePositions.at(i) =\n            mNodePositions.at(i - 1)\
    \ + offset;\n    }\n}\n```\n\n6. Then we loop over the remaining nodes, calculate\
    \ the new direction of the bone after moving the previous node, and calculate\
    \ the new position of the node by using the original length. Finally, we move\
    \ the node to the new position, retaining the length.\n\n7. In solveFABRIKBackwards(),\
    \ we do the same operations as in steps 5 and 6 but in the opposite direction\
    \ along the node chain. We start with the root node position as the target and\
    \ adjust the node positions one by one:\n\n```\nvoid IKSolver::solveFABRIKBackwards(glm::vec3\
    \ rootPos) {\n    mNodePositions.at(mNodePositions.size() - 1) = rootPos;\n```"
  merge: -1
  img_proc: true
- pgno: 428
  md: "```\nfor (int i = mNodePositions.size() - 2; i >= 0; --i) {\n    glm::vec3\
    \ boneDirection =\n        glm::normalize(mNodePositions.at(i) -\n        mNodePositions.at(i\
    \ + 1));\n    glm::vec3 offset = boneDirection * mBoneLengths.at(i);\n    mNodePositions.at(i)\
    \ =\n        mNodePositions.at(i + 1) + offset;\n}\n}\n```\n\n8. The last method,\
    \ solveFARBIK(), is used to control the iterations of FABRIK plus the comparison\
    \ of the effector and target positions. We start with a simple check for an empty\
    \ node matrix vector. In this case, we return an empty vector:\n\n```\nstd::vector<glm::vec3>\
    \ IKSolver::solveFARBIK(\n    std::vector<glm::mat4>& nodeMatrices,\n    glm::vec3\
    \ targetPos) {\n    if (nodeMatrices.size() == 0) {\n        return std::vector<glm::vec3>{};\n\
    \    }\n}\n```\n\n9. Then, we resize and fill the mNodePositions vector:\n\n```\n\
    mNodePositions.resize(nodeMatrices.size());\nfor (int i = 0; i < nodeMatrices.size();\
    \ ++i) {\n    mNodePositions.at(i) =\n        Tools::extractGlobalPosition(\n\
    \        nodeMatrices.at(i));\n}\n```\n\n10. In the helper method extractGlobalPosition(),\
    \ the translational part of the node matrix is extracted and returned. Now we\
    \ can calculate the bone lengths, and we store the position of the root node for\
    \ the backward part of FABRIK:\n\n```\ncalculateOrigBoneLengths();\nglm::vec3\
    \ rootPos =\n    mNodePositions.at(mNodePositions.size() - 1);\n```\n\n11. We\
    \ need to store the root node position because we alter the mNodePositions vector\
    \ during the forward calculations. Without saving the original root node, the\
    \ backward part would be impossible to solve."
