- pgno: 193
  md: "```\n} catch (...) {\n    rhs.csViewAzimuth = defaultSettings.csViewAzimuth;\n\
    }\n\ntry {\n    rhs.csViewElevation =\n        node[\"view-elevation\"].as<float>();\n\
    } catch (...) {\n    rhs.csViewElevation =\n        defaultSettings.csViewElevation;\n\
    }\n```\n\nHandling exceptions thrown while parsing nodes ensures recovering as\
    \ much of the camera configuration as possible in case of malformed or missing\
    \ keys. Being unable to parse the camera name still skips the entire camera to\
    \ avoid naming trouble.\n\nWe also add the encode method to make a full implementation\
    \ of the template. With the decode function available, we can read a node containing\
    \ camera settings simply by passing the CameraSettings type to the .as<>() call:\n\
    \n```\n... camNode.as<CameraSettings>();\n```\n\nFor emitting camera configurations\
    \ to a save file, we create a sequence and add a map for each of the cameras available:\n\
    \n```\n...\nmYamlEmit << YAML::BeginMap;\nmYamlEmit << YAML::Key << \"cameras\"\
    ;\nmYamlEmit << YAML::Value;\nmYamlEmit << YAML::BeginSeq;\nfor (const auto& cam\
    \ : modInstCamData.micCameras) {\n    CameraSettings settings = cam->getCameraSettings();\n\
    \    mYamlEmit << YAML::BeginMap;\n    mYamlEmit << YAML::Key << \"camera-name\"\
    ;\n    mYamlEmit << YAML::Value << settings.csCamName;\n...\n}\n```"
