- pgno: 296
  md: '# # Adding a simple node


    A new node can be started by calling BeginNode(), using an int value as the unique
    identification for the node:


    ```

    ```cpp

    const int nodeId = 1;

    ImNodes::BeginNode(nodeId);

    ImGui::Text("Sample Node");

    ImNodes::EndNode();

    ```

    ```


    Like in ImGui itself, all immnodes UI elements must have a unique ID set to be
    distinguishable by ImGui. Internally, immnodes uses the ImGui::PushID() call to
    set the ID for the group containing the node data. We only need to take care that
    all elements in the node editor have unique identifications set.


    Inside the node, we can use all ImGui elements to create control elements. Some
    ImGui elements may behave unexpectedly. For instance, an ImGui::Separator() call
    draws a line up to the right end of the node editor. But the usual elements, like
    text, buttons, or sliders, are working as expected. Calling BeginDisable() and
    EndDisable() also works normally, allowing us to make parts of the node unavailable.


    Be careful when disabling ImGui elements in a node


    While it may seem tempting to completely remove unneeded ImGui elements from the
    node by enclosing them in if statements, be aware that immnodes calculates the
    position of input and output pins from the IDs given to the attributes. If you
    want to remove attributes or ImGui elements, make sure to keep the same IDs for
    the attributes and elements remaining visible, or else the links will be attached
    at the wrong places.


    Figure 9.4 shows the result of the previously found lines of code:


    ![](img/3cfb9832c943f5f7366fd104b5255971_296_0.png)


    Figure 9.4: The sample node'
  merge: -1
  img_proc: true
- pgno: 297
  md: 'Besides being movable by holding the left mouse button, our new node is not
    useful. So, let us add some elements to the node, called “attributes” in imnodes.


    # Creating imnodes attributes and ImGui elements in a node


    All attributes for a node must be defined between BeginNode() and EndNode(). Make
    sure to skip the ImGui::Text() line from the section Adding a simple node as it
    will destroy the layout of the node.


    The first imnodes attribute we add is a node title, by using BeginNodeTitleBar():


    ```

    ImNodes::BeginNodeTitleBar();

    ImGui::TextUnformatted("A cool node title");

    ImNodes::EndNodeTitleBar();

    ```


    The title is shown in a separate area at the top of the node and shows if it is
    unselected, hovered over, or selected.


    Next, we create an input pin by calling BeginInputAttribute():


    ```

    const int inputId = 2;

    ImNodes::BeginInputAttribute(inputId);

    ImGui::Text("in");

    ImNodes::EndInputAttribute();

    ```


    An input node definition creates a “magnetic” dot on the left side of the node,
    allowing us later to connect links. A node can have from zero to virtually unlimited
    input pins, but most probably, only a few pins will be used.


    After the input pin, we use BeginStaticAttribute() to create a static attribute:


    ```

    const int staticId = 3;

    static bool checkboxState = false;

    ImNodes::BeginStaticAttribute(staticId);

    ImGui::Checkbox("A fancy checkbox", &checkboxState);

    ImNodes::EndStaticAttribute();

    ```


    Static attributes have no input or output connectors on the sides of the node.
    You can use a static attribute just like every other control element in an ImGui
    window.'
  merge: -1
  img_proc: true
- pgno: 298
  md: 'Finally, we add an output pin with BeginOutputAttribute():


    ```

    const int outId = 4;

    ImNodes::BeginOutputAttribute(outId);

    ImGui::Text(" out");

    ImNodes::EndOutputAttribute();

    ```


    Like input pins, output pins create a connector to dock links. But for output
    pins, this connector is on the right side of the node.


    In Figure 9.5, the resulting node created by the code lines in this section is
    shown:


    ![](img/3cfb9832c943f5f7366fd104b5255971_298_0.png)


    Figure 9.5: The updated example node


    The updated node already looks great. We have a title, input and output pins,
    and a checkbox controlled by a stateful variable – all in just about twenty lines
    of code.


    Connecting nodes with links is also simple, as we will see now.


    # Maintaining links between nodes


    Links in imnodes have three properties: a unique link ID, a start pin ID, and
    an end pin ID. The unique link ID is needed to identify and draw the link itself,
    and the pin IDs are taken from the output pin of the parent (or source) node respective
    to the input pin of the child (or destination) node.


    By combining these three IDs, links in imnodes are best managed as pairs of pin
    IDs in a map of link IDs:


    ```

    std::map<int, std::pair<int, int>> links;

    ```


    The inner std::pair stores the IDs of the start pin (output) and the end pin (input)
    of a link, in that order. With the outer std::map, we create a connection between
    the link ID and the pair of pin IDs.'
  merge: -1
  img_proc: true
- pgno: 299
  md: "# Output first, input second\n\n> It is noteworthy to say that Imnodes strictly\
    \ follows this order. The first reported pin is always the output pin of the parent\
    \ node, and the second pin is the input pin of the child node. Following this\
    \ rule makes it easy to use nodes and links to create a finite state machine,\
    \ maintaining the state of the node tree with a bunch of simple rules.\n\n```\n\
    ```cpp\nfor (const auto& link : links) {\n    ImNodes::Link(link.first,\n    \
    \    link.second.first, link.second.second);\n}\n```\n```\n\nAll links in the\
    \ map are now drawn as lines with curves at both ends, connecting the output pin\
    \ of the parent node (first element of the pair) and the input pin of the child\
    \ node (second element of the pair).\n\nNew nodes are signaled from Imnodes after\
    \ the editor has been ended by calling EndNodeEditor(). Then, two Imnodes calls\
    \ can be used to create or delete links.\n\nWhether or not a new link was created\
    \ in the editor in the current frame can be requested by calling IsLinkCreated():\n\
    \n```\n```cpp\nint startId, endId;\nif (ImNodes::IsLinkCreated(&startId, &endId))\
    \ {\n    linkId = findNextFreeLinkId();\n    links[linkId] = (std::make_pair(startId,\
    \ endId));\n}\n```\n```\n\nIf IsLinkCreated() returns true, the user made a new\
    \ link between two nodes, and we can save the new link to the map. How findNextFreeLinkId()\
    \ searches for a new link ID depends on the needs of the application. You can\
    \ check out the example code, a simple implementation that reuses IDs from deleted\
    \ links."
  merge: -1
  img_proc: true
