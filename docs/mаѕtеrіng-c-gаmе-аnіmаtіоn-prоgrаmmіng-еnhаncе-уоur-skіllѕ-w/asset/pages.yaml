    \ mModelInstData)) {\n    return false;\n}\n```\n\nIn the createConfigFile() method,\
    \ the YAML::Emitter will be filled with the structures of our data. As an example,\
    \ we will add a comment at the top of the file, and save the version number in\
    \ the second line:\n\n```\nmYamlEmit << YAML::Comment(\"Application viewer\n \
    \   config file\");\nmYamlEmit << YAML::BeginMap;\nmYamlEmit << YAML::Key << \"\
    version\";\nmYamlEmit << YAML::Value << 1.0f;\nmYamlEmit << YAML::EndMap;\n...\n\
    ```\n\nIn the final YAML file, the following first lines will appear:\n\n```\n\
    # Application viewer config file\nversion: 1\n```\n\nAa another example, to store\
    \ the instance settings, we create a map named instances, and start creating a\
    \ sequence as the value:\n\n```\nmYamlEmit << YAML::BeginMap;\nmYamlEmit << YAML::Key\
    \ << \"instances\";\nmYamlEmit << YAML::Value;\nmYamlEmit << YAML::BeginSeq;\n\
    ```\n\nThen, we can create a for loop over the instances and use the getInstanceSettings()\
    \ call of the instance to directly store the instance settings to the emitter\
    \ stream:\n\n```\nfor (const auto& instance : modInstData.miAssimpInstances) {\n\
    \    mYamlEmit << YAML::BeginMap;\n    mYamlEmit << instance->getInstanceSettings();\n\
    ```"
