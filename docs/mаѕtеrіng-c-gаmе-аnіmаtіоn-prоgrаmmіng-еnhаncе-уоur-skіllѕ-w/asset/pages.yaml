- pgno: 214
  md: "+   • Extend the third-person camera to be more action-like.\n+   \n+   You\
    \ could try to add more features to the third-person camera. What about a camera\
    \ mounted on a spring, only loosely following the motion of the instance? Or effects\
    \ like zooming a bit more out on moving forward, following with a small delay\
    \ on rotations, or even tilting a bit when walking sideways? Or you could add\
    \ a small shake on collisions, like the instance running into an obstacle. Also,\
    \ presets for those different types would be handy.\n\n+   • Change camera implementation\
    \ to quaternions.\n+   \n+   Adding the third dimension in the previous task will\
    \ most probably lead to rotations resulting in a gimbal lock, thus losing one\
    \ degree of freedom again because one axis is rotated or close to another axis.\
    \ Changing the entire camera rotation to use quaternions instead of Euler angles\
    \ should solve gimbal lock situations.\n\n+   • Add spline-based camera and target\
    \ paths.\n+   \n+   To create fly-by scenes, you could add splines for the camera\
    \ position to follow along, including configurable speed and ping-pong movement.\
    \ By adding splines as targets, you could create camera shots of the virtual worlds.\n\
    \n+   • Show the cameras as separate objects in edit mode.\n+   \n+   Similar\
    \ to the arrows for the model manipulation, you could add a view frustum and a\
    \ small box to depict the position and orientation of the cameras in the virtual\
    \ world. Different camera types could be shown by different line colors.\n\n+\
    \   • Make the camera symbols selectable with the mouse.\n+   \n+   After you\
    \ finish the previous task, you could also add the camera symbols to the selection\
    \ texture. Just reserve a range of values exclusively for the cameras, draw the\
    \ boxes and/or frustum lines to the selection texture, and switch between instances\
    \ and cameras, depending on the value you get back from the graphics card buffer.\n\
    \n+   • Expert difficulty: Add a picture-in-picture window.\n+   \n+   Most game\
    \ engines have the ability to show a minimized version of another camera in a\
    \ small window of the application screen. Creating a separate camera display requires\
    \ some low-level additions to the renderer class since the entire scene has to\
    \ be drawn twice by using the view and projection matrices of both cameras."
