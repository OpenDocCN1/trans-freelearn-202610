- pgno: 219
  md: '# 7


    # Enhancing Animation Controls


    Welcome to *Chapter 7*! In the previous chapter, we added some camera functions.
    We started by implementing support for multiple camera objects and added new camera
    types. We also set keyboard shortcuts to allow the simple selection of the existing
    cameras. As the last step, we added an orthogonal camera configuration, which
    enabled us to create entirely different views of the model instances and the virtual
    worlds.


    In this chapter, we will update animation blending and controls to a new level.
    First, we will implement blending between two animations in the existing transformation
    compute shader. Also, we will move the calculation of translation, scaling, and
    rotation for each node to lookup tables onto the GPU. Next, we will add new instance
    states to the code, storing the kind of actions the instance could do, like walking,
    running, and jumping, plus the direction of movement. Then, we will create UI
    controls, allowing us to map the existing animation clips to instance actions.
    Finally, we will add the logic for the mapping between animations and actions.


    In this chapter, we will cover the following topics:


    +   - Blending between animations with style

    +   - Adding new states to the code

    +   - Linking states and animations

    +   - Saving and loading the states


    # Technical requirements


    The example code in the chapter07 folder, in the 01_opengl_animations folder for
    OpenGL and the 02_vulkan_animations folder for Vulkan.'
  merge: -1
  img_proc: true
- pgno: 220
  md: "# Blending between animations with style\n\nIf you solved the second and third\
    \ tasks in the Practical sessions section in Chapter 2 and moved more parts of\
    \ the animation blending to the GPU, parts of this section may be familiar to\
    \ you. But do not worry if you skipped the tasks, as the process of moving the\
    \ transformation data to lookup tables and doing the interpolation calculations\
    \ on the GPU is straightforward.\n\nLet’s start with the lookup table data.\n\n\
    # The power of lookup tables\n\nCurrently, the data for the animation keyframes\
    \ and the corresponding node transformations is extracted during model loading,\
    \ and all the data is stored in arrays inside AssimpAnimChannel objects.\n\nFor\
    \ every node in every frame, six lookups are needed to extract the translation,\
    \ scaling, and rotation for the previous and current keyframe time. Then, the\
    \ values are interpolated pairwise to calculate the final transformation for the\
    \ specified node.\n\nHowever, doing the same calculations repeatedly is time-consuming.\
    \ A better solution is to generate all the interpolated transforms when the model\
    \ is loaded, and only do a lookup of the final transform value when playing the\
    \ animation.\n\nThe trade-off here is clear: GPU memory versus CPU computing power.\
    \ Setting the size of the lookup table too small will cause visible artifacts,\
    \ while setting the size of the lookup table data too large will waste precious\
    \ GPU memory without having any visual benefits. You can experiment with the lookup\
    \ table size, but ~1,000 elements for the transform values should be a good balance\
    \ between visuals and memory size.\n\n> An alternative lookup solution\n> \n>\
    \ A more memory-friendly version of the lookup table can be achieved by creating\
    \ a table for the keyframe times and using the extracted data as an index into\
    \ the original transformation data. You may use this variation if you have a lot\
    \ of nodes and animation clips to save GPU memory. Or you could use these sparser\
    \ lookups if there are only a few keyframes per animation. On the downside of\
    \ this version, you need to calculate the pair-wise interpolations between the\
    \ values per keyframe again, adding more computing load to the GPU."
  merge: -1
  img_proc: true
- pgno: 221
  md: <!-- no content -->
