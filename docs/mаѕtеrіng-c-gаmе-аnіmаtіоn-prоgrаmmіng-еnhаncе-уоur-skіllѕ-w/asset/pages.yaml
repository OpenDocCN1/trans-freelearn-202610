- pgno: 301
  md: "Now that we have explored how to manage the graphical part of the node editor\
    \ using imnodes, we need to create a class to store state information and the\
    \ imnodes draw calls. These new classes are the building blocks for the finite\
    \ state machine driving the instance behavior.\n\n# Creating graph node classes\n\
    \nThe basic element of node tree classes is an abstract class called GraphNodeBase,\
    \ located in the new folder graphnodes. All other node classes will inherit from\
    \ the base class, adding attributes and logic for specific tasks that the node\
    \ has to take care of.\n\nIn contrast to a *full-featured* behavior tree, our\
    \ simplified version will store the state of nodes in the nodes itself. Maintaining\
    \ the node state in a separate part of the code would make the implementation\
    \ more complex and harder to understand. The only drawback of using an integrated\
    \ state is to make a copy of the entire node tree for every instance, as the node\
    \ tree itself is used as the finite state machine. But node objects are small;\
    \ adding a few nodes per instance creates a negligible overhead in memory space\
    \ and compute time.\n\nBefore we dive into more details, here is a list of all\
    \ the node types created in the example code for this chapter:\n\n+   - **Root\
    \ Node**\n+   \n+     The root node is the starting point of every node tree,\
    \ created by default. It is not possible to remove the root node as it’s the starting\
    \ point of the entire tree. At the start of the execution of the finite state\
    \ machine, the root node is activated first. Also, when no other nodes are active,\
    \ the root node is triggered again to start over. Since there is no need to trigger\
    \ the root node by some other node, the root node has only an output pin but no\
    \ input pin.\n+   - **Test Node**\n+   \n+     The test node helps develop and\
    \ debug node trees. Like the root node, only an output pin is available, plus\
    \ a button to activate the output pin.\n+   - **DebugLog Node**\n+   \n+     This\
    \ is another node to help build a node tree. Currently, node trees attached to\
    \ an instance cannot be loaded into the editor for a live-debugging session. A\
    \ task for implementing the ability to load an existing node tree into the editor\
    \ window is available in the *Practical sessions* section. To watch specific actions,\
    \ a debug log node can be added, printing a line to the system console when activated."
  merge: -1
  img_proc: true
- pgno: 302
  md: "+   - **Wait Node**\n+   \n+   The wait node was already shown as an example\
    \ in Figure 9.2. The node will delay the execution between two other nodes by\
    \ a configurable time.\n+   \n+   - **RandomWait Node**\n+   \n+   This is like\
    \ the wait node, but an upper and lower limit can be set to the delay, enabling\
    \ a bit more random behavior.\n+   \n+   - **Selector Node**\n+   \n+   The selector\
    \ node also has a fixed delay, and after the delay time is up, a random output\
    \ pin is activated.\n+   \n+   - **Sequence Node**\n+   \n+   A sequence node\
    \ activates the output pins one after the other, starting with pin number one.\
    \ As an extra feature, the sequence node will wait for the child node on the active\
    \ output to finish. Waiting for a child is currently only implemented for the\
    \ two wait node types; more types or a cascade with grandchild nodes can be added.\
    \ See the section Practical sessions for ideas.\n+   \n+   - **Action Node**\n\
    +   \n+   We added actions in Chapter 7. An action node allows us to trigger actions\
    \ just like we did in Chapter 7 while controlling the instance with a keyboard\
    \ and mouse, enabling the instances to not just walk around but jump, roll, punch,\
    \ or wave, based on the state of the node tree.\n+   \n+   - **Event Node**\n\
    +   \n+   An event node is triggered by an external event sent to the instance,\
    \ for instance, when a collision happens. The event node also has a cooldown timer\
    \ to ignore the same event for a small amount of time, avoiding erratic behavior\
    \ by doing the same action on every update of the tree again if the event keeps\
    \ being sent to the instance.\n+   \n+   - **Instance Movement Node**\n+   \n\
    +   The instance node allows us to control movement state and movement direction,\
    \ instance speed, and instance rotation within the node tree. Using an instance\
    \ node is required to change between the main movement states, like idle, walking,\
    \ and running. In addition, both speed and rotation can be randomized within the\
    \ upper and lower limits to enable a more nondeterministic behavior."
  merge: -1
  img_proc: true
- pgno: 303
  md: 'In Figure 9.7, all these nodes are shown:


    ![](img/3cfb9832c943f5f7366fd104b5255971_303_0.png)


    Figure 9.7: An overview of all nodes created for the example code


    The number next to the node type is the numerical node ID. In case of errors,
    or when using a DebugLog node, having the node ID at hand may be beneficial.


    Now let’s check the most important parts of the GraphNodeBase class.


    # Exploring the base class for graph nodes


    To ensure derived node classes are implementing a minimum set of functionalities,
    the GraphNodeBase class has several pure virtual methods declared in the header
    file GraphNodeBase.h in the folder graphnodes:


    ```

    virtual void update(float deltaTime) = 0;

    virtual void draw(ModelInstanceCamData modInstCamData) = 0;

    virtual void activate() = 0;

    virtual void deactivate(bool informParentNodes = true) = 0;

    virtual bool isActive() = 0;

    virtual std::shared_ptr<GraphNodeBase> clone() = 0;

    ```'
  merge: -1
  img_proc: true
- pgno: 304
  md: '```

    virtual std::optional<std::map<std::string, std::string>>


    exportData() = 0;

    virtual void importData(

    std::map<std::string, std::string> data) = 0;

    ```


    The first method, update(), is used to alter the internal state of the node depending
    on the time difference between two frames. For instance, all nodes with a delay
    will decrease the internal counter, triggering the output pin once the time reaches
    0.


    Inside the draw() method, the appearance of the node is set. We created an example
    node starting with the section Adding a simple node. The draw() call contains
    all commands tailored to the visuals of the specific node type.


    When the internal timer of the timing nodes reaches 0, or when a node connected
    to an input pin of the current node has finished its execution, activate() will
    be triggered. Here, the main logic of the node''s functionality is set.


    When a node tree controlling the behavior of an instance should be removed from
    that instance, we can make sure to stop all nodes by calling deactivate(). Not
    stopping the finite state machine for the current instance could lead to interesting
    side effects and unwanted behavior if a node sets values for properties like speed
    or movement state. The parameter informParentNodes is used to distinguish between
    an ordered shutdown of a node, i.e., notifying a parent node of type Sequence
    that the child node has finished execution, and a full stop, when all further
    actions should be avoided.


    By using isActive(), the controlling code of the finite state machine can check
    if at least one node is still actively doing something, like waiting for a timer
    to reach 0. As soon as no active node is left, the root node will be triggered.


    The clone() method is needed to create a copy of the current instance of a node,
    containing all settings. Since we are using inheritance, using a copy constructor
    to achieve the same result would be hard due to missing access to private members.
    A virtual cloning method makes our lives much easier, resulting in a 1:1 copy.


    Finally, exportData() and importData() are used to get and set the current state
    of any node instance with any values set that are worth saving and restoring.
    Internally, the values of a node type are stored in a std::string map, avoiding
    more than one data type in the map. Also, using simple strings inside the YAML
    parser removes any conversion when interacting with the raw text data on disk.
    The graph node types know how to encode and decode the data, moving the node-specific
    save and load logic away from the YAML parser.'
