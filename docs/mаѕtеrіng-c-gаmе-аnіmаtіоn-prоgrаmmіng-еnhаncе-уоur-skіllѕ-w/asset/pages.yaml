- pgno: 194
  md: "```\nmYamlEmit << YAML::EndSeq;\n mYamlEmit << YAML::EndMap;\n```\n\nIn the\
    \ saved YAML configuration file, a new sequence will appear for each camera, storing\
    \ all camera settings as key/value pairs:\n\n```\ncameras:\n  - camera-name: FreeCam\n\
    \    position: [2.9061296, 11.1587305, 64.1114578]\n    view-azimuth: 289.300262\n\
    \    view-elevation: -34.4999695\n```\n\nSince we made essential changes to the\
    \ configuration file, we should reflect the new on-disk format with a new version\
    \ number.\n\n# Bumping the configuration file version\n\nAdjusting the configuration\
    \ file version number in the emitter is easy; we just have to raise the version\
    \ number string from 1.0 to something like 1.1 or 2.0. From now on, all saved\
    \ configuration files will have the new version number.\n\nLoading a configuration\
    \ file gets a bit more complex now. If we want to support the old file format,\
    \ we must retain all methods that were used to parse the previous file version\
    \ contents. After reading the version number of the file to parse, we must decide\
    \ if we want to parse the new sequence style for multiple cameras, or get the\
    \ settings for the single camera and apply those settings to the always-available\
    \ default free camera. Saving the configuration could be done in the new version,\
    \ resulting in a migration of a configuration file from the old to the new version.\n\
    \nUpdating the configuration by supporting the reading of an older version is\
    \ one of the tasks in the Practical sessions section.\n\nWe can create a bunch\
    \ of free-floating cameras now, position the cameras in our virtual world, and\
    \ switch between the cameras via the user interface. Still sounds a bit boring,\
    \ doesn’t it? Let’s enhance the application more by adding different camera types.\n\
    \n# Creating different camera types\n\nHaving the ability to add more than one\
    \ camera in the virtual world is a good basis for adding a couple of predefined\
    \ camera settings. The different camera types behave in different ways regarding\
    \ the movement of the view and the movement of the camera itself."
  merge: -1
  img_proc: true
- pgno: 195
  md: "We define a new enum class named cameraType in the Enums.h file:\n\n```\nenum\
    \ class cameraType {\n\tfree = 0,\n\tfirstPerson,\n\tthirdPerson,\n\tstationary,\n\
    \tstationaryFollowing\n};\n```\n\nIn the CameraSettings struct, a new variable\
    \ of the cameraType type must be added:\n\n```\ncameraType csCamType = cameraType::free;\n\
    ```\n\nThe names already tell a lot about the purpose of the camera types. Here\
    \ is what all the types are about:\n\n+   - The free camera is already known from\
    \ previous code examples. We can freely move around the world in five degrees\
    \ of freedom: three directions and two rotations. There are no movement restrictions\
    \ for the camera or view.\n+   - The firstPerson camera does what cameras in first-person\
    \ games do: it allows you to see the virtual world through the eyes of the protagonist.\
    \ In our application, we will attach the camera to the head of an instance and\
    \ move both camera and view just as the instance does. However, there will be\
    \ an option to unlock the view to avoid weird angles or motion sickness.\n+  \
    \ - The thirdPerson camera follows the selected instance like another person or\
    \ a drone, showing the same angle of the virtual world as the instance sees but\
    \ from the outside of the instance body. Some view adjustments are possible, like\
    \ the distance from the instance, but both camera motion and view are controlled\
    \ by the instance.\n+   - The stationary camera can be compared to a fixed surveillance\
    \ camera. The stationary camera can be placed anywhere in the world and at any\
    \ angle, but once the camera is locked, no movement or view adjustment except\
    \ the field of view is possible. The field of view setting is kept unlocked to\
    \ allow zooming in and out, just like with a normal surveillance camera.\n+  \
    \ - Finally, the stationaryFollowing camera is a special type of surveillance\
    \ camera. While both movement and view are not controllable by the user (again,\
    \ with the exception of the field of view setting), this camera type will automatically\
    \ center the selected instance, regardless of whether the instance is directly\
    \ visible or not. And if the instance moves around, the camera will track that\
    \ instance within the virtual world."
  merge: -1
  img_proc: true
- pgno: 196
  md: 'Depending on the camera type, we must restrict parts of the camera settings
    in the renderer. Whenever we are unable to change specific camera settings, like
    the position, we will also disable the user interface control for the same settings.


    We will start with the first- and third-person cameras because both camera types
    have large parts of behavior changes and data retrieval in common.


    # Implementing first- and third-person cameras


    For a first-person camera, the CameraSettings struct in the CameraSettings.h header
    in the tools folder needs some additional variables:


    ```

    bool csFirstPersonLockView = true;

    int csFirstPersonBoneToFollow = 0;

    std::vector<std::string> csFirstPersonBoneNames{};

    glm::mat4 csFirstPersonBoneMatrix = glm::mat4(1.0f);

    glm::vec3 csFirstPersonOffsets = glm::vec3(0.0f);

    ```


    The new variable csFirstPersonLockView is used to control if the first-person
    view follows the motion of the instance bone or if we relax that restriction and
    enable a free view, but still at a fixed position. We need a bone of the model
    skeleton to attach the camera to; the variable csFirstPersonBoneToFollow lets
    us set the bone we will follow. In the user interface, the contents of the csFirstPersonBoneNames
    vector are used to present a combo box with all bone names, and the selected bone
    will be saved in csFirstPersonBoneToFollow. The last variable, csFirstPersonOffsets,
    can be used to slightly move the camera position around, preventing the camera
    from being placed at a strange point inside the head of the instance or suchlike.


    As we are doing skeletal animations, we need to access the matrix containing translation,
    rotation, and scaling of the bone where the camera is virtually attached. We could
    get the matrix by re-implementing the animation code from the first chapter, or
    we can extract the bone matrix from the Shader Storage Buffer Object after the
    compute shader from Chapter 2 has finished calculating the final matrix data.


    For a real-world application, you should use a profiler to check the costs of
    both versions. In the example application, we will use the compute shader results
    to avoid making the same animation calculations again.'
  merge: -1
  img_proc: true
- pgno: 197
  md: "# Note on first-person models\n\nFor many first-person-style games, the first-person\
    \ model will differ from the third-person model of the same character.\n\nSometimes,\
    \ the head elements are removed or rotated away. This generates the feeling of\
    \ having a virtual body if the player sees the arms, hands, and legs while having\
    \ the head removed from interfering with the view. In other games, the body is\
    \ removed entirely, and only a partial model like the lower arms or the arms up\
    \ to the shoulder is drawn. The resulting view gives a simple but still good enough\
    \ representation of the virtual body for a player.\n\nWe are using the same model\
    \ for all camera types here, simply because swapping the model on the fly during\
    \ camera switches will cause a lot of additional overhead. If you are interested\
    \ in how much effort is needed to use another model in first-person, you are encouraged\
    \ to add the logic to switch the models in parallel to the camera type.\n\nAnother\
    \ addition to the CameraSettings struct is a weak pointer to the instance we want\
    \ to follow:\n\n```\nstd::weak_ptr<AssimpInstance> csInstanceToFollow{};\n```\n\
    \nSimilar to the undo/redo settings, we use a std::weak_ptr instead of a std::shared_ptr\
    \ to avoid trouble if the instance we follow gets removed.\n\nCapturing the instance\
    \ in the user interface can be done by adding a button that stores the currently\
    \ selected instance in the csInstanceToFollow variable of the camera settings.\
    \ But be aware to check for the null instance or you will get unwanted results\
    \ and have the camera centered at the origin.\n\n# Retrieving the bone matrix\
    \ for the first-person view\n\nThe first part of the first-person magic is the\
    \ retrieval of the final TRS of the bone we want to have our camera attached to.\
    \ In the draw() call of the renderer, right after the second computer shader,\
    \ we extract the bone matrix from the mShaderBoneMatrixBuffer SSBO:\n\n```\nglm::mat4\
    \ boneMatrix =\n mShaderBoneMatrixBuffer.getSsboDataMat4(\n selectedInstance *\
    \ numberOfBones + selectedBone, 1).at(0);\n```"
  merge: -1
  img_proc: true
- pgno: 198
  md: "# Extending Camera Handling\n\nWe are using an overloaded getSSBODataMat4()\
    \ method to read a single glm::mat4 at the position of the selected bone of the\
    \ selected instance. To be able to read more than one matrix from an SSBO, getSSBODataMat4()\
    \ returns a std::vector<glm::mat4>. But since we only need a single matrix, we\
    \ extract the first matrix of the vector by using .at(0).\n\nThe camera offset\
    \ matrix is calculated with a simple glm::translate() call:\n\n```\nglm::mat4\
    \ offsetMatrix = glm::translate(glm::mat4(1.0f),\n\tcamSettings.csFirstPersonOffsets);\n\
    ```\n\nFinally, a slightly monstrous call is used to calculate the position of\
    \ the bone:\n\n```\ncam->setBoneMatrix(\n\tmWorldPosMatrices.at(selectedInstance)\
    \ *\n\tboneMatrix * offsetMatrix *\n\tglm::inverse(modelType.second.at(0))\n\t\
    ->getModel()->getBoneList().at(selectedBone)\n\t->getOffsetMatrix()));\n```\n\n\
    By using the correct matrix multiplication order (depending on the library, GLM\
    \ uses right to left), the following operations are done:\n\n+   1. Get the offset\
    \ matrix of the selected bone from the model and calculate the inverse of the\
    \ offset matrix. The offset matrix of a bone contains the offset of that bone\
    \ between the skinning position and the default T-pose.\n+   \n+   2. Multiply\
    \ the inverse of the bone offset matrix by the camera position offset matrix,\
    \ moving the camera slightly away from the bone offset.\n+   \n+   3. Multiply\
    \ the final bone TRS matrix by the previous product of the bone offset and camera\
    \ matrices, moving the camera to the correct position of that bone relative to\
    \ the model root.\n+   \n+   4. Multiply the world position offset of the selected\
    \ instance, moving the camera to the selected bone of our selected instance.\n\
    \nAfter the bone matrix has been calculated, we need to update the camera and\
    \ re-upload the view and projection matrix to the GPU:\n\n```\ncam->updateCamera(mRenderData,\
    \ deltaTime);\n\tmViewMatrix = cam->getViewMatrix();\n\tstd::vector<glm::mat4>\
    \ matrixData;\n\tmatrixData.emplace_back(mViewMatrix);\n```"
  merge: -1
  img_proc: true
- pgno: 199
  md: "```\nmatrixData.emplace_back(mProjectionMatrix);\n mUniformBuffer.uploadUboData(matrixData,\
    \ 0);\n```\n\nNow, part two of the magic follows: calculating position, azimuth,\
    \ and elevation.\n\n# Computing first-person camera parameters\n\nTo get the world\
    \ position and the azimuth and elevation view angles from the rotation matrix\
    \ of the bone, some tricks are required:\n\n+   1. First, we set the camera position\
    \ from the matrix:\n+    mCamSettings.csWorldPosition = mFirstPersonBoneMatrix[3];\n\
    +   \n+   In a row-major rotation matrix, the translation is stored in the first\
    \ three columns of the last row. By extracting the entire row and discarding the\
    \ fourth value, we instantly get the translation of the bone.\n\n```\nmCamSettings.csWorldPosition\
    \ = mFirstPersonBoneMatrix[3];\n```\n\nIn a row-major rotation matrix, the translation\
    \ is stored in the first three columns of the last row. By extracting the entire\
    \ row and discarding the fourth value, we instantly get the translation of the\
    \ bone.\n\n+   2. For the elevation view angle, we rotate a vector pointing upward\
    \ by doing multiplication with the bone TRS matrix:\n+   \n+   glm::vec3 elevationVector\
    \ =\n+    glm::mat3(mFirstPersonBoneMatrix) * mSideVector;\n+   \n+   The matrix-vector\
    \ multiplication rotates the reference vector mSideVector by the angles stored\
    \ on the bone TRS matrix. In theory, we can use any vector as a reference; we\
    \ are using a unit vector pointing to the positive Z axis here.\n+   \n+   The\
    \ resulting vector points to the direction that was applied to the selected bone\
    \ during animation calculation.\n\n```\nglm::vec3 elevationVector =\n glm::mat3(mFirstPersonBoneMatrix)\
    \ * mSideVector;\n```\n\nThe matrix-vector multiplication rotates the reference\
    \ vector mSideVector by the angles stored on the bone TRS matrix. In theory, we\
    \ can use any vector as a reference; we are using a unit vector pointing to the\
    \ positive Z axis here.\n\nThe resulting vector points to the direction that was\
    \ applied to the selected bone during animation calculation.\n\n+   3. Next, we\
    \ calculate the elevation angle:\n+   \n+   mCamSettings.csViewElevation =\n+\
    \    glm::degrees(std::atan2(glm::length(\n+    glm::cross(elevationVector, mWorldUpVector)),\n\
    +    glm::dot(elevationVector, -mWorldUpVector))) - 90.0f\n+   \n+   By using\
    \ the two-element arctangent, we can calculate the angle between two given vectors.\
    \ We are using the upward-pointing mWorldUpVector here as the second parameter\
    \ since we are interested in the rotation angle relative to the vertical axis.\
    \ Arctangent calculation combines the cosine and the sine angle calculation between\
    \ the two angles. For details about the formula, a link is available in the Additional\
    \ resources section.\n\n```\nmCamSettings.csViewElevation =\n glm::degrees(std::atan2(glm::length(\n\
    \ glm::cross(elevationVector, mWorldUpVector)),\n glm::dot(elevationVector, -mWorldUpVector)))\
    \ - 90.0f\n```\n\nBy using the two-element arctangent, we can calculate the angle\
    \ between two given vectors. We are using the upward-pointing mWorldUpVector here\
    \ as the second parameter since we are interested in the rotation angle relative\
    \ to the vertical axis. Arctangent calculation combines the cosine and the sine\
    \ angle calculation between the two angles. For details about the formula, a link\
    \ is available in the Additional resources section."
  merge: -1
  img_proc: true
- pgno: 200
  md: "After converting the resulting angle from radians to degrees, we subtract 90\
    \ degrees to get the angle relative to the horizon (mWorldUpVector points upward).\
    \ This method is numerically more stable for angles close to the reference vectors\
    \ compared to the arccosine + dot product method that is usually used to calculate\
    \ the angle between two vectors.\n\n# Elevation angle limits\n\nBe aware of an\
    \ important limitation to the elevation angle: The total range for the elevation\
    \ angle is only 180 degrees (from -90 degrees to 90 degrees). You cannot look\
    \ more up than directly upward, or more down than directly downward. Trying to\
    \ adjust the elevation angle outside the limits results in a rotation of 180 degrees\
    \ around the X axis – the azimuth angle will be adjusted, and the elevation angle\
    \ will be still inside the limiting range.\n\nAt this point, the camera has the\
    \ same up/down angle as our selected bone.\n\nWe can calculate the Azimuth in\
    \ a similar way:\n\n+   1. First, we rotate a vector by doing a multiplication\
    \ with the bone TRS matrix. We again use the vector mSideVector, pointing toward\
    \ the positive Z axis:\n\n```\nglm::vec3 azimuthVector =\n    glm::mat3(mFirstPersonBoneMatrix)\
    \ * mSideVector;\n```\n\n+   2. Then, we compute the angle between the rotated\
    \ vector and another unit vector:\n\n```\nmCamSettings.csViewAzimuth =\n    glm::degrees(\n\
    \        glm::acos(\n            glm::dot(\n                glm::normalize(\n\
    \                    glm::vec3(\n                        azimuthVector.x, 0.0f,\
    \ azimuthVector.z)),\n                -mSideVector\n            )\n        )\n\
    \    );\n```"
  merge: -1
  img_proc: true
- pgno: 201
  md: "Two major differences are needed here, compared to the elevation angle:\n\n\
    +   - The dot product is not calculated from the entire rotated angle but mapped\
    \ to two dimensions by setting the Y coordinate to zero. The reason for this mapping\
    \ may not be obvious – when using all three dimensions, the elevation part (up/down)\
    \ may be smaller than the azimuth part (rotate around the vertical axis) and the\
    \ dot product calculates the wrong angle. By eliminating the elevation part, we\
    \ get the correct result.\n+   - We calculate the dot product against a vector\
    \ pointing in the opposite direction. This sign change is needed to get the correct\
    \ value of the azimuth angle. Alternatively, we can negate the result of the dot\
    \ product to get the same effect.\n\n3. As the last step, we check if the x component\
    \ of the initially computed azimuthVector vector is less than zero and adjust\
    \ the rotation angle accordingly:\n\n```\nif (azimuthVector.x < 0.0f) {\n    mCamSettings.csViewAzimuth\
    \ =\n        360.0f - mCamSettings.csViewAzimuth;\n}\n```\n\nNormally, we only\
    \ get an angle between 0 and 180 degrees as the result of calling the inverse\
    \ cosine function std::acos(). By taking the direction of the resulting rotated\
    \ vector into account, we can modify the calculations to retrieve the full angle\
    \ between 0 and 360 degrees.\n\nIf we create the view direction from the computed\
    \ elevation and azimuth values now, the camera looks in exactly the same direction\
    \ as the selected bone:\n\n```\nupdateCameraView(renderData, deltaTime);\n```"
  merge: -1
  img_proc: true
