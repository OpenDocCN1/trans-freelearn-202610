    In the triIndex variable, we store the triangle index of the corresponding NavTriangle.
    By using the index, we can do a simple lookup to find triangle data like position
    or neighbor triangles. As soon as we visit a neighboring node of a triangle, we
    add the index of the triangle with the shortest path so far to prevTriIndex, allowing
    us to backtrack the shortest path at the end of the pathfinding run.


    The remaining three variables (distanceFromSource, heuristicToDest, and distanceToDest)
    are the workhorses of the A* algorithm. Here we store the aggregated distance
    from the source to the current node, the result of the heuristic function for
    the distance between the current node and the target, and the sum of both distances.
    By comparing the values of distanceToDest for all neighboring nodes, A* chooses
    the next node toward the target node.


