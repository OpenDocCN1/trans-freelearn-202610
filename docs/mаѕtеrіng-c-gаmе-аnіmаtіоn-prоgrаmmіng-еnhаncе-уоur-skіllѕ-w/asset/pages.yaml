  md: "The query for colliding triangles may also report the ground triangle we are\
    \ currently inspecting, so we return immediately if we find it in the results.\
    \ We also remove all triangles not facing upward from the list of possible neighbors\
    \ as we are only interested in adjacent ground triangles.\n\nIn case of triangulation\
    \ errors made by Assimp, we also need to check if the peer triangle is in mNavTriangles:\n\
    \n```\nif (mNavTriangles.count(peer.index) == 0) {\n    continue;\n}\n```\n\n\
    If we find a valid neighbor triangle, we get the neighbor triangle from the mNavTriangles\
    \ map:\n\n```\nNavTriangle peerNavTri =\n    mNavTriangles.at(peer.index);\n```\n\
    \nFinally, we can do a loop over all three vertices of both triangles to check\
    \ for adjacency:\n\n```\nfor (int i = 0; i < 3; ++i) {\n    for (int j = 0; j\
    \ < 3; ++j) {\n```\n\nInside the loop, we calculate the distance of every vertex\
    \ from the edges of the other triangle:\n\n```\nglm::vec3 pointToPeerLine =\n\
    \    glm::cross(tri.points.at(j) -\n    peer.points.at(i), tri.points.at(j) -\n\
    \    peer.points.at((i + 1) % 3));\nfloat pointDistance =\n    glm::length(pointToPeerLine)\
