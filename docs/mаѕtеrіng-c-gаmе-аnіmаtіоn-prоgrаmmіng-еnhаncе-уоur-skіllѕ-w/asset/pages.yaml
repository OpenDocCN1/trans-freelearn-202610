- pgno: 241
  md: "```\n}\nImGui::PopID();\n```\n\nImGui needs a unique identifier for every control\
    \ element. Failing to provide a unique ID leads to unwanted results, since triggering\
    \ one control element also triggers the other element(s) containing the same ID.\n\
    \nBy using an incrementing integer value as an identifier, every mapping line\
    \ will have unique Edit and Remove buttons, and the buttons will only affect their\
    \ mapping line.\n\nAnother nice ImGui feature is the ability to close a CollapsingHeader\
    \ element from another part of the code:\n\n```\nImGui::GetStateStorage()->SetInt(\n\
    \    ImGui::GetID(\"Model Animation Mappings\"), 0);\n```\n\nThe internal state\
    \ storage of ImGui saves information about the elements of the current ImGui window.\
    \ With the SetInt() call and the CollapsingHeader name, we can control the open/close\
    \ state of any header in the current ImGui window.\n\nThis way, we forcibly close\
    \ the other two mapping CollapsingHeader elements. We are changing the animation\
    \ clip settings in all three mapping headers, and ImGui applies the settings multiple\
    \ times, leading to unwanted results.\n\nAfter all idle/walk/run animation clips\
    \ have been set, we continue with the actions.\n\n# Mapping actions to animation\
    \ clips\n\nIn the moveState enum class, we have defined several actions for the\
    \ instances, next to the already configured idle, walk, and run states. Depending\
    \ on the animations in a model file, not all actions may be available for all\
    \ models. But there is no need to worry: the code will ignore actions without\
    \ a configured animation. Pressing the action key will result in no animation\
    \ or action.\n\nAll configured action mappings are saved to the ModelSettings\
    \ struct in the ModelSettings.h file in a new map called msActionClipMappings:\n\
    \n```\nstd::map<moveState, ActionAnimation>\n    msActionClipMappings;\n```"
