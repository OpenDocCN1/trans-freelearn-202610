    # Extending immersion with daytime and weather


    Although they are natural phenomena in our lives, the cycle between day and night,
    weather effects, and different seasons are rarely used in computer games. But
    all these aspects can be a great boost for immersion in a game. Slight changes
    to the virtual world depending on an internal clock may help to create an environment
    that a player wants to stay in for a much longer time to experience the full cycle.'
  merge: -1
