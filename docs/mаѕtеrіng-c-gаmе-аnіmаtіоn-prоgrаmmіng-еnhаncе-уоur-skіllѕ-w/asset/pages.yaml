- pgno: 363
  md: "The final **HeadAnim** node to be used in a node tree looks like in *Figure\
    \ 10.10*:\n\n![](img/3cfb9832c943f5f7366fd104b5255971_363_0.png)\n\nFigure 10.10:\
    \ The HeadAnim node\n\nLike the Instance node, we can control which head animation\
    \ values we want to change, and for each animation, we can adjust the starting\
    \ and ending weight plus the time it takes to blend between the two weight values.\
    \ And like the FaceAnim node, the HeadAnim node delays the control flow until\
    \ both timers are expired and signals the end of the execution to the parent node.\n\
    \nWe close the chapter with the changes needed to save and load the settings for\
    \ the additive head animations.\n\n# Saving and loading the head animation settings\n\
    \nSimilar to the new tree node, implementing the YAML configuration file changes\
    \ to save and load head animation settings is a matter of minutes.\n\nFor the\
    \ ModelSettings YAML emitter output in the YamlParser.cpp file, we add the clip\
    \ mappings directly from the map if all four clips are configured. We also need\
    \ a new emitter output for the headMoveDirection enum, casting the value to an\
    \ int:\n\n```\nYAML::Emitter& operator<<(YAML::Emitter& out,\n    const headMoveDirection&\
    \ moveDir) {\n    out << YAML::Flow;\n    out << static_cast<int>(moveDir);\n\
    \    return out;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 364
  md: "To load the mapping back, we add a section to the decode() method for the ModelSettings\
    \ in the YamlParserTypes.h file, reading back the map values one by one. A new\
    \ decode() method for the headMoveDirection enum is needed here too:\n\n```\n\
    static bool decode(const Node& node, headMoveDirection& rhs) {\n    rhs = static_cast<headMoveDirection>(node.as<int>());\n\
    }\n```\n\nAnd for the instance settings, the two float values stored in the isHeadLeftRightMove\
    \ and isHeadUpDownMove of the InstanceSettings are added to the emitter in YamlParser.cpp:\n\
    \n```\nif (settings.isHeadLeftRightMove != 0.0f) {\n    out << YAML::Key << \"\
    head-anim-left-right-timestamp\";\n    out << YAML::Value << settings.isHeadLeftRightMove;\n\
    }\nif (settings.isHeadUpDownMove != 0.0f) {\n    out << YAML::Key << \"head-anim-up-down-timestamp\"\
    ;\n    out << YAML::Value << settings.isHeadUpDownMove;\n}\n```\n\nAnd the two\
    \ values are also to the decode() method for the ExtendedInstanceSettings data\
    \ type in YamlParserTypes.h:\n\n```\nif (node[\"head-anim-left-right-timestamp\"\
    ]) {\n    rhs.isHeadLeftRightMove =\n        node[\"head-anim-left-right-timestamp\"\
    ].as<float>();\n}\nif (node[\"head-anim-up-down-timestamp\"]) {\n    rhs.isHeadUpDownMove\
    \ =\n        node[\"head-anim-up-down-timestamp\"].as<float>();\n}\n```\n\nAfter\
    \ all these additions, you can add some HeadAnim nodes to the node tree of the\
    \ man's model, creating animations like the one shown in Figure 10.11:"
