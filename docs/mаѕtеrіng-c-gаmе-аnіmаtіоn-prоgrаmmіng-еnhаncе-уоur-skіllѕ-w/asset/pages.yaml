- pgno: 171
  md: "# Overloading the output operator of the emitter\n\nThe creators of yaml-cpp\
    \ added a nice method to output the contents of complex structures to the YAML::Emitter.\
    \ We only have to overload the operator<< in the YamlParser.cpp file in the tools\
    \ folder:\n\n```\nYAML::Emitter& operator<<(YAML::Emitter& out,\n    const glm::vec3&\
    \ vec) {\n    out << YAML::Flow;\n    out << YAML::BeginSeq;\n    out << vec.x\
    \ << vec.y << vec.z;\n    out << YAML::EndSeq;\n    return out;\n}\n```\n\nFor\
    \ the glm::vec3 data type, we add a flow type sequence, and then the three elements\
    \ of the vector will be added to the stream. In the final file, a default YAML\
    \ sequence will appear, containing the values of the glm::vec3 vector as in this\
    \ example:\n\n```\n[1, 2, 3]\n```\n\nOur InstanceSettings struct must be added\
    \ as the key/value pairs of a YAML map. The start and end of the map are set in\
    \ the function storing the InstanceSettings:\n\n```\nYAML::Emitter& operator<<(YAML::Emitter&\
    \ out,\n    const InstanceSettings& settings) {\n    out << YAML::Key << \"model-file\"\
    ;\n    out << YAML::Value << settings.isModelFile;\n    out << YAML::Key << \"\
    position\";\n    out << YAML::Value << settings.isWorldPosition;\n    out << YAML::Key\
    \ << \"rotation\";\n    out << YAML::Value << settings.isWorldRotation\n    ...\n\
    }\n```\n\nThe resulting maps will be added as the value of a YAML sequence, storing\
    \ all relevant instance data in the configuration file."
