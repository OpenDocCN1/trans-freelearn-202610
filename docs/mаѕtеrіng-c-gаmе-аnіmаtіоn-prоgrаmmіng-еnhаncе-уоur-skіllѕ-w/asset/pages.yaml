- pgno: 429
  md: "12. Then, we start a loop with the maximum number of iterations:\n\n```\nfor\
    \ (unsigned int i = 0; i < mIterations; ++i) {\n    glm::vec3 effector = mNodePositions.at(0);\n\
    \    if(glm::length(targetPos - effector) <\n        mCloseThreshold) {\n    \
    \    return mNodePositions;\n    }\n}\n```\n\nAt the start of the loop, we compare\
    \ the positions of the effector node and the desired target. If the positions\
    \ are close together, we return the current node positions as solutions.\n\n13.\
    \ Now comes the FABRIK solving part. We call the forward solver method with the\
    \ target position and then the backward solver method with the saved root node\
    \ position:\n\n```\nsolveFABRIKForward(targetPos);\n    solveFABRIKBackwards(rootPos);\n\
    }\n```\n\n14. After both solving parts are finished, we continue with the next\
    \ iteration. Finally, we return the positions FABRIK found for the nodes:\n\n\
    ```\nreturn mNodePositions;\n}\n```\n\nIt’s possible that the effector node is\
    \ unable to reach the target position, i.e., because the node chain is too short.\
    \ In this case, the best position FABRIK could find will be returned.\n\nBefore\
    \ we can continue with the last part of the FABRIK, we need to make sure to configure\
    \ the root and effector nodes of the model. Here, we will use only the feet to\
    \ create a natural appearance while walking up or down a hill.\n\n# Defining the\
    \ node chain for the instance’s feet\n\nTo be able to configure the nodes for\
    \ the feet, two new members of the ModelSettings struct in the ModelSettings.h\
    \ file are added:\n\n```\nstd::array<std::pair<int, int>, 2> msFootIKChainPair{};\n\
    \    std::array<std::vector<int>, 2> msFootIKChainNodes{};\n```\n\nIn the msFootIKChainPair\
    \ array, we store the node IDs of the effector and the root node for the left\
    \ foot and right foot. We only need this pair for the user interface since the\
    \ contents of the msFootIKChainNodes array will be calculated from the effector\
    \ and root node IDs."
