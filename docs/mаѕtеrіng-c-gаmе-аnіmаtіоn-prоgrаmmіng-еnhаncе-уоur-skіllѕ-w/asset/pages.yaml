- pgno: 391
  md: "To get a nice interactive display in the user interface, we add a Boolean named\
    \ settingChangedForAABB to the Levels section. On every slider or checkbox change,\
    \ or when pressing the Reset Values to Zero button, we trigger a recalculation\
    \ of the level’s AABB.\n\nAnd what about other static level elements? These objects\
    \ are called assets and can be added to a level. Assets also need collision checks\
    \ to prevent the instances from running right through each other, but assets are\
    \ mostly not animated; they remain in the place intended by the level designers.\n\
    \nWe will use a shortcut here and utilize the non-animated models to mimic static\
    \ level assets. For dynamic assets, such as buttons or doors, animated models\
    \ can be used; see the Level data does not move around section for a brief explanation.\
    \ In the Practical sessions section, a task to add dynamic assets to the virtual\
    \ world is available.\n\nSo, let’s see what changes are needed for the non-animated\
    \ models.\n\n# Using non-animated models as assets\n\nTo avoid adding a new AssimpAsset\
    \ class with mostly the same functionality as the non-animated models, we will\
    \ extend the current AssimpModel class and the renderer a bit.\n\nFor the model\
    \ class, we change the getAABB() method to return either a dynamic AABB for models\
    \ with animations or a static AABB for models without animations:\n\n```\nAABB\
    \ AssimpModel::getAABB(InstanceSettings instSettings) {\n    if (mNumAnimatedMeshes\
    \ > 0) {\n        return getAnimatedAABB(instSettings);\n    } else {\n      \
    \  return getNonAnimatedAABB(instSettings);\n    }\n}\n```\n\nThe new method,\
    \ getAnimatedAABB(), is just a new name for the old getAABB() method, and it calculates\
    \ the AABB from the lookup data as before. The other new method, getNonAnimatedAABB(),\
    \ is mostly the updateModelRootMatrix() method from the AssimpInstance class.\n\
    \nFirst, we calculate a separate matrix for scaling, rotation, axis swap, and\
    \ translation:\n\n```\nglm::mat4 localScaleMatrix = glm::scale(glm::mat4(1.0f),\n\
    \    glm::vec3(instSettings.isScale));\nglm::mat4 localSwapAxisMatrix;\nif (instSettings.isSwapYZAixs)\
    \ {\n```"
