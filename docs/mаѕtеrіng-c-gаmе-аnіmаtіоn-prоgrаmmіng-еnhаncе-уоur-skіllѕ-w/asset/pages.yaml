- pgno: 243
  md: 'To blend between the idle/walk/run state and any action in the AssimpInstance
    class, we can use the clip number and replay speed from the msActionClipMappings
    map and use the clip as the destination clip for a blending operation:


    ```

    mInstanceSettings.isSecondAnimClipNr =

    modSettings.msActionClipMappings[mActionMoveState]

    .aClipNr;


    float animSpeed =

    modSettings.msActionClipMappings[mActionMoveState]

    .aClipSpeed;

    ```


    If we want our model to change to an action, we call the setNextInstanceState()
    method of the AssimpInstance class. The renderer uses this call in the handleMovementKeys()
    method to request a state change of the selected instance:


    ```

    moveState nextState = moveState::idle;

    ...


    if (glfwGetKey(mRenderData.rWindow, GLFW_KEY_E) ==

    GLFW_PRESS) {

    nextState = moveState::punch;

    }

    ...


    currentInstance->setNextInstanceState(nextState);

    ```


    Before we dive into the animation blending logic, let’s finish the UI part by
    looking at how to set allowed clip sequences.




    While previewing the different animation clips of the models, you will notice
    that some clips only work when the instance stands still, while other animations
    are only usable if the instance is walking or running.


    To prevent unwanted and unnatural transitions between clips, for instance, from
    an idle model to a full-speed jump animation, we define which action state changes
    are allowed. The Destination state can only be triggered when the Source state
    is the current active state.'
