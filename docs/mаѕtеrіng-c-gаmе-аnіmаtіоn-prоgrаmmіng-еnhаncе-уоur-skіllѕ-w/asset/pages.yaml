  md: "Finally, we multiply the TRS matrix of the current node by the bone offset\
    \ matrix for the node to compute the final world position for every node:\n\n\
    ```\nif (mAssimpModel->getBoneOffsetMatrices().count(\n    nodeName) > 0) {\n\
    \    mBoneMatrices.emplace_back(\n        mAssimpModel->getNodeMap().at(\n   \
    \     nodeName)->getTRSMatrix() *\n        mAssimpModel\n        ->getBoneOffsetMatrices().at(nodeName));\n\
    \    }\n}\n```\n\nReusing the model nodes works fine unless you plan to add a\
    \ parallel (multi-threaded) calculation of instance animations: if more than one\
    \ thread accesses the nodes of the model at the same time, at least one thread\
    \ is modifying the node properties while other threads are reading the data, thus\
    \ a so-called data race may occur, leading to a possible mix-up of the old and\
    \ new data.\n\nSo, when using a multi-threading version of the code, a local copy\
    \ of the node list will be required. The additional node map can be generated\
    \ from the node list with a simple iteration over the list, adding the nodes by\
    \ their names to a map.\n\n# Storing instance-specific settings\n\nThe remaining\
    \ per-instance settings are stored in the struct InstanceSettings, defined in\
