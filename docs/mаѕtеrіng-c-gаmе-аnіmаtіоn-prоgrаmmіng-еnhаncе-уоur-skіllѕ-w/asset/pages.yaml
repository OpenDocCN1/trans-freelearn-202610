- pgno: 408
  md: "By calling generateLevelOctree whenever level data has been added or removed,\
    \ we assure that our octree has the correct world positions for all triangles.\
    \ The best way to achieve the update on level changes is to tie the octree update\
    \ to the already implemented AABB update for level data.\n\nTo achieve this coupling,\
    \ we add a new private method named generateLevelVertexData() and call AABB and\
    \ octree generation there:\n\n```\nvoid OGLRenderer::generateLevelVertexData()\
    \ {\n    generateLevelAABB();\n    generateLevelOctree();\n}\n```\n\nThen, all\
    \ occurrences of generateLevelAABB() are replaced by the new generateLevelVertexData()\
    \ method, and whenever the level data or other properties, such as rotation or\
    \ scaling, are changed, the level octree is also updated.\n\nWith an up-to-date\
    \ level octree, we can finally check if the instances collide with level geometry.\n\
    \n# Detecting instance/level collisions\n\nBy using the same strategy as we used\
    \ in the Adding a quadtree to store nearby model instances section in Chapter\
    \ 8, for instance/instance collisions, finding collisions between instances and\
    \ level triangles is easy. All we must do is loop over all instances, get the\
    \ bounding box of the instance, and query the triangle octree for collisions with\
    \ that bounding box. The octree delivers us all the triangles where the bounding\
    \ box of the triangle collides with the bounding box of the instance, even if\
    \ the instance is not stored inside the triangle octree.\n\nTo implement collision\
    \ detection between instances and level data, follow these steps:\n\n+   1. First,\
    \ we add a new member named isCollidingTriangles to the InstanceSettings struct\
    \ in the InstanceSettings.h file to store the colliding triangles:\n\n```\nstd::vector<MeshTriangle>\
    \ isCollidingTriangles{};\n```\n\n+   2. Then, a new public method called setCollidingTriangles()\
    \ of the AssimpInstance class is created, storing the incoming triangle data in\
    \ the instance settings:\n\n```\nvoid AssimpInstance::setCollidingTriangles(\n\
    \    std::vector<MeshTriangle>& collidingTriangles) {\n    mInstanceSettings.isCollidingTriangles\
    \ =\n    collidingTriangles;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 409
  md: "3. Next, we create a new private method called checkForLevelCollisions() in\
    \ the renderer. We start by getting the instance settings and skipping the null\
    \ instance:\n\n```\nvoid OGLRenderer::checkForLevelCollisions() {\n    for (const\
    \ auto& instance :\n        mModelInstCamData.micAssimpInstances) {\n        InstanceSettings\
    \ instSettings =\n            instance->getInstanceSettings();\n        if (instSettings.isInstanceIndexPosition\
    \ == 0)\n            continue;\n    }\n```\n\n4. Then, we simply query the triangle\
    \ octree with the bounding box of the instances:\n\n```\nstd::vector<MeshTriangle>\
    \ collidingTriangles =\n    mTriangleOctree->query(instance->getBoundingBox());\n\
    ```\n\n5. Just knowing that we have collisions is nice, but we want to store the\
    \ collision data for further actions, such as reacting to collisions or drawing\
    \ debug lines. So, we store the vector of MeshTriangles in the instance settings:\n\
    \n```\ninstances.at(i)->setCollidingTriangles(\n    collidingTriangles);\n}\n\
    }\n```\n\nThe method checkForLevelCollisions() is called to the draw() method\
    \ of the renderer, after the instances have been rendered and before the UI is\
