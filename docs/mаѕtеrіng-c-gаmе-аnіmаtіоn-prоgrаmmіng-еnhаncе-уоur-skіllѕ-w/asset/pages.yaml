- pgno: 505
  md: 'All these effects are created by using shaders and have different performance
    impacts. Nevertheless, even a bunch of the effects listed here will give the visual
    appearance a huge boost.


    Figure 14.9 shows two post-processing effects, Bloom and Screen Space Ambient
    Occlusion (SSAO). The Bloom effect was created with code from LearnOpenGL (https://learnopengl.com/)
    by Joey de Vries (https://x.com/JoeyDeVriez) and the SSAO picture is made with
    code from Sascha Willems’ Vulkan examples (the code is available at https://github.com/SaschaWillems/Vulkan/tree/master/examples/pbrb1):


    ![](img/3cfb9832c943f5f7366fd104b5255971_505_0.png)


    Figure 14.9: Bloom (left) and SSAO (right)


    On the left side of Figure 14.9, the Bloom effect is shown. The characteristic
    part of the Bloom effect is the halo effect around the light sources. For the
    green light source, the light even overlaps the top left edge of the wooden crate.


    On the right side of Figure 14.9, SSAO is shown. The SSAO effect may be subtle,
    but it is visible: look at the floor below the curtains on the right side of the
    white line. The shadow creates the illusion of a darker room behind the curtains.


    # Upgrading to ray tracing


    As the next step to realism, ray tracing can be added as an optional enhancement.


    Ray tracing uses virtual light rays emitted from the camera to compute the resulting
    pixel color by following the ray through the collisions with objects in the virtual
    world. Instead of just using the object color, the virtual ray is reflected by
    the physical rules and followed until the amount of light added falls below a
    threshold.


    With ray tracing, effects like a global illumination of the world, causing dark
    areas to be lit by light being reflected from the objects, or realistic reflections
    could be achieved. Imagine running through a room full of mirrors and seeing your
    character multiple times, drawn in a correct physical way.'
  merge: -1
  img_proc: true
- pgno: 506
  md: 'Figure 14.10 shows a scene created by a ray tracing example from Sascha Willems
    Vulkan code (the code is available at https://github.com/SaschaWillems/Vulkan/tree/master/examples/pbr1bl):


    ![](img/3cfb9832c943f5f7366fd104b5255971_506_0.png)


    # Figure 14.10: Real-time ray tracing scene


    The reflections on the floor, the spheres, and the teatpot in Figure 14.10 are
    calculated in real time by using ray tracing with the Vulkan API on an Nvidia
    RTX 4000 series GPU.


    The FPS counter was included to show how fast the current GPU generation is able
    to create ray tracing images. Only a few decades ago, a single frame of the same
    picture required several days to render.


    # Ray tracing should be optional


    Note that the calculations for ray tracing require lots of computing power and
    creating complex scenes in real time needs both a GPU and a graphics API that
    support ray tracing. Right now, only Vulkan and DirectX 12 are able to use the
    ray tracing capabilities of modern GPUs. You need to check the availability of
    hardware and software support before switching to a graphics pipeline with ray
    tracing enabled.'
  merge: -1
