- pgno: 465
  md: "If our open list becomes empty, we return an empty vector:\n\n```\n```cpp\n\
    if (navOpenList.empty()) {\n\treturn std::vector<int>{};\n}\n```\n```\n\nWe check\
    \ for an empty open list before going on since the next step involves a loop over\
    \ all elements of the open list.\n\n# Extracting the best node\n\nOnce we have\
    \ collected all the new nodes and updated the distances of all existing nodes,\
    \ we need to find the node with the shortest combined distance from start to target.\
    \ We will use a priority queue here to minimize the costs to access the node having\
    \ the smallest distance. The priority queue will sort all nodes according to a\
    \ comparison function into a tree structure and allow accessing the largest or\
    \ smallest node as the topmost element.\n\nFirst, we create the comparison function\
    \ for the priority queue:\n\n```\n```cpp\nauto cmp = [](NavData left, NavData\
    \ right) {\n\treturn left.distanceToDest > right.distanceToDest;\n};\n```\n```\n\
    \nBy default, a priority uses std::less as a comparison function, resulting in\
    \ a queue with the maximum value as the top element. But by using the cmp function,\
    \ we will have the minimum distance to the destination as the top element.\n\n\
    Now we can fill the queue by pushing all triangles in the open list:\n\n```\n\
    ```cpp\nstd::priority_queue<NavData, std::vector<NavData>, decltype(cmp)> navDataQueue(cmp);\n\
    for (const auto& triIndex : navOpenList) {\n\tNavData navPoint = navPoints.at(triIndex);\n\
    \tnavDataQueue.push(navPoint);\n}\n```\n```\n\nNext, we declare an empty navigation\
    \ data variable and extract the index with the minimum distance from the queue\
    \ by a call to top():\n\n```\n```cpp\nNavData nextPointToDest{};\nnextPointToDest\
    \ = navDataQueue.top();\ncurrentIndex = nextPointToDest.triIndex;\n```\n```"
