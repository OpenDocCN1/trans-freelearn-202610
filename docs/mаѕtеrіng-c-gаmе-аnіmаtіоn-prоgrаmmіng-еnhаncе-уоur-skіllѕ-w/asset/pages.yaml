- pgno: 222
  md: "The first step for every lookup table is the extraction of the minimum and\
    \ the maximum keyframe times:\n\n```\nmMinTranslateTime =\n    static_cast<float>(nodeAnim->mPositionKeys[0].mTime);\n\
    mMaxTranslateTime =\n    static_cast<float>(\nnodeAnim->mPositionKeys[mNumTranslations\
    \ - 1].mTime);\n```\n\nThen, we calculate three scaling factors:\n\n```\nfloat\
    \ translateScaleFactor = maxClipDuration /\n    mMaxTranslateTime;\nmTranslateTimeScaleFactor\
    \ = maxClipDuration /\n    static_cast<float>(LOOKUP_TABLE_WIDTH);\nmInvTranslateTimeScaleFactor\
    \ = 1.0f /\n    mTranslateTimeScaleFactor;\n```\n\nThese include:\n\n+   - The\
    \ first variable, translateScaleFactor, stores the ratio between the maximum clip\
    \ duration and the maximum keyframe time. We need the first scaling factor when\
    \ we advance the time in the lookup table data creation.\n+   - In mTranslateTimeScaleFactor,\
    \ we calculate the ratio between the maximum clip duration and the size of our\
    \ lookup table. The second scaling factor is simply the keyframe time step width\
    \ of the lookup table entries.\n+   - As the last scaling factor, mInvTranslateTimeScaleFactor\
    \ stores the inverse of the mTranslateTimeScaleFactor value. We will use the third\
    \ scaling factor in the compute shader to calculate the right index position in\
    \ the lookup table from the keyframe time.\n\nNext, we set a helper variable named\
    \ timeIndex to 0 and iterate over our lookup table entries:\n\n```\nint timeIndex\
    \ = 0;\nfor (int i = 0; i < LOOKUP_TABLE_WIDTH; ++i) {\n```\n\nFor every lookup\
    \ table entry, we extract the translation data from the mPositionKeys array of\
    \ the aNodeAnim object for the current and next keyframe times into a glm::vec4:\n\
    \n```\nglm::vec4 currentTranslate = glm::vec4(\n    nodeAnim->mPositionKeys[timeIndex].mValue.x,\n\
    \    nodeAnim->mPositionKeys[timeIndex].mValue.y,\n```"
  merge: -1
  img_proc: true
- pgno: 223
  md: "```\nnodeAnim->mPositionKeys[timeIndex].mValue.z, 1.0f);\nglm::vec4 nextTranslate\
    \ = glm::vec4(\n    nodeAnim->mPositionKeys[timeIndex + 1].mValue.x,\n    nodeAnim->mPositionKeys[timeIndex\
    \ + 1].mValue.y,\n    nodeAnim->mPositionKeys[timeIndex + 1].mValue.z,\n    1.0f);\n\
    ```\n\nEven though we only need the first three values for the translation, a\
    \ four-element vector is used for proper data alignment in the Shader Storage\
    \ Buffer Object.\n\nNow, we extract the time values for the current and next keyframes,\
    \ plus the current time of the animation:\n\n```\nfloat currentKey = static_cast<float>(\n\
    \    nodeAnim->mPositionKeys[timeIndex].mTime);\nfloat nextKey = static_cast<float>(\n\
    \    nodeAnim->mPositionKeys[timeIndex + 1].mTime);\nfloat currentTime = i * mTranslateTimeScaleFactor\
    \ /\n    translateScaleFactor;\n```\n\nFor the current time, two scaling factors\
    \ are used.\n\nBy using the two translation vectors and the time values, we can\
    \ create an interpolated glm::vec4 of the two translations at the time stamp of\
    \ the lookup table entry:\n\n```\nmTranslations.emplace_back(glm::mix(\n    currentTranslate,\n\
    \    nextTranslate,\n    (currentTime - currentKey) / (nextKey - currentKey)));\n\
    ```\n\nFinally, we check whether the current time of the lookup table entry is\
    \ longer than the time of the next keyframe. If it is, we increment our time index:\n\
    \n```\nif (currentTime > nextKey) {\n    if (timeIndex < mNumTranslations - 1)\
    \ {\n        ++timeIndex;\n    }\n}\n```"
  merge: -1
  img_proc: true
