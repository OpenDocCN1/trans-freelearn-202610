- pgno: 74
  md: '# ## Summary


    In this chapter, we took the first steps toward mastering C++ game animation programming
    by using Open Asset Importer Library, or Assimp. Assimp enables us to simplify
    and accelerate the path to animating and rendering model instances.


    We started by looking at the general data structures of the Assimp library, how
    to parse the different parts of a file, and in which order. Next, we added a nice
    ImGui-based file dialog to the code, allowing us to select files in an interactive
    manner, instead of having to hardcode one or more model files we wish to open.
    At the end of the chapter, we explored how to add or remove models and instances
    at runtime, enabling us to create a more “crowded” virtual world.


    In Chapter 2, we will move the computational load calculate the model matrices
    from the CPU to the GPU, allowing us to have more CPU power left to do amazing
    things in our virtual world.


    # ## Practical sessions


    You will see this section at the end of every chapter in the book. Here, I will
    add a bunch of suggestions and exercises that you can try out with the code on
    GitHub.


    You could try to do the following:


    +   - Add more controls to the animations, like the play direction, one/time vs.
    loop play, or even ping-pong replay, alternating between forward and backward
    replay of the chosen animation.

    +   - Add an animation slider that lets you choose to show the frame at some point
    in time of an animation.

    +   - Search for model files on the internet. Try out which models work, or to
    which extent they work. You do not have to limit this search to game character
    models; you can also search for game maps in compatible formats, or 3D-printable
    objects. Remember to adjust the file dialog filter to show the additional file
    formats.'
