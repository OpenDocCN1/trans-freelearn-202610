- pgno: 130
  md: 'But there is one thing left that may annoy you: There is no way to select no
    instance at all. We will add a solution for an empty selection in the last section
    of this chapter.


    # Implementing a null object to allow deselection


    Adding a deselection by doing a click into the background of the application window
    comes with a bunch of interesting implications. For instance, the position 0 may
    be a valid index in the miAssimpInstance vector, stating that the first instance
    has been selected. So, simply using zero to signal that no instances are selected
    does not work. Even worse: Using zero as the first index may confuse users of
    the application, as it is not intentional to start counting numbers at zero, instead
    of one.


    In addition, the default buffer background value of -1 is an invalid array index.
    Using the value of -1 as an index into the miAssimpInstance vector would simply
    crash the application. Since we will use the instance vector frequently in the
    code, adding a range check for every single access would be crucial because even
    missing a single check will lead to a crash.


    So, we need another signalling mechanism to switch between the two selection variants
    and a simplification of the range checks. To catch both problems with a single
    solution, we will use an empty model as a null object.


    # What is a null object?


    Using a null object is a well-known design pattern for object-oriented programming.
    Usually, you would use a nullptr to signal the absence of an object instance.
    But, using a nullptr requires creating an extra check before every usage of the
    instance for being valid or not. Dereferencing a non-existing instance leads to
    a runtime error, and the application crashes.


    The null object is a valid object instance, delivering a well-defined, but neutral
    behavior. Function calls in the instance of the null object are valid, but may
    return nothing viable, like an empty list, or some default values. This behavior
    frees the code of extra checks, since the instance itself is valid.


    For our selection problem, we simply create an instance of the AssimpModel class
    that returns no vertices, plus empty lists or vectors for nodes, meshes, and so
    on. Then, we add the special model as the first model to the miModelList vector
    and add one instance of the “null model” as the first instance to the miAssimpInstances
    vector and to the miAssimpInstancesPerModel map.'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'If we select the first model instance now, we have a valid object, just without
    any triangles drawn to the screen. Switching off the coordinate arrows or adjusting
    the user interface to disable controls if no instance is selected can be done
    without extra signalling variables. We just need to test m1SelectedInstance for
    being 0.


    We will alter the original pattern a bit, and don’t use a derived class. Instead,
    we will provide an empty object of the AssimpModel class.


    # Creating and using the AssimpModel null object


    Since we initialized the class members variables already in the header file AssimpModel.h
    with default values, creating a null object can be achieved by creating an empty
    instance. And the simplest way to create an instance of the AssimpModel class
    without setting any data is by using the implicitly created default constructor.
    We don’t even need to define a custom constructor; the C++ compiler will handle
    everything we need in the background.


    ```

    std::shared_ptr<AssimpModel> nullModel =

    std::make_shared<AssimpModel>();

    mModelInstData.miModelList.emplace_back(nullModel)

    ```


    Then, we can create an AssimpInstance instance from the null model, and place
    it into the miAssimpInstancesPerModel map and the miAssimpInstances vector:


    ```

    std::shared_ptr<AssimpInstance> nullInstance =

    std::make_shared<AssimpInstance>(nullModel);

    mModelInstData.miAssimpInstancesPerModel[nullModel

    ->getModelFileName()].emplace_back(nullInstance);

    mModelInstData.miAssimpInstances.emplace_back(

    nullInstance);

    ```


    As the final initialization step, we update the index numbers of the instances:


    ```

    assignInstanceIndices();

    ```


    Now, the instance of the nullModel model has the index number 0. Any instance
    added in the application will now start at index 1. Matching numbers for the overall
    number of instances and the instance index will avoid confusion about differences
    in the instance numbering scheme.'
  merge: -1
  img_proc: true
- pgno: 132
  md: "To skip the model during vertex processing in the draw() call of the renderer,\
    \ a check for the triangle count has been added:\n\n```\nif (numberOfInstances\
    \ > 0 &&\n    modelType.second.at(0)->getModel()\n    ->getTriangleCount() > 0)\
    \ {\n    ...\n```\n\nIn case we have no triangles in a model, all instances of\
    \ this specific model will be skipped.\n\nIn addition, we check for the instance\
    \ number 0 before generating the final vertex position for the coordinate arrows:\n\
    \n```\nif (mModelInstData.miSelectedInstance > 0) {\n    ....\n```\n\nWhenever\
    \ the very first instance is selected – the instance of the null model – no coordinate\
    \ arrows will be drawn on the screen. We can even remove the size() check of the\
    \ miAssimpInstances vector here, as we know we have at least one valid instance\
    \ available.\n\n# Adjusting the user interface\n\nIn the user interface, we will\
    \ cheat a bit to keep the instance selection fields disabled in case the null\
    \ instance is selected:\n\n```\nbool modelListEmpty =\n    modInstData.miModelList.size()\
    \ == 1;\nbool nullInstanceSelected =\n    modInstData.miSelectedInstance == 0;\n\
    size_t numberOfInstances =\n    modInstData.miAssimpInstances.size() - 1;\n```\n\
    \nBy subtracting 1 from the size of the miModelList vector, we ignore the null\
    \ model in that vector. We also ignore the null instance of the null model to\
    \ count the instances in numberOfInstances. The additional Boolean nullInstanceSelected\
    \ helps us to disable parts of the user interface when models and instances are\
    \ available, but we have not selected any of the instances."
