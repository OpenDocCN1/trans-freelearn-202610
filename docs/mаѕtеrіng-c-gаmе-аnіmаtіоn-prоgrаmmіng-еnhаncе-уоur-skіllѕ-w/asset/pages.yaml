- pgno: 177
  md: 'Once the configuration file is successfully parsed, all settings, model paths,
    and instance settings are extracted. But before we can load the models and create
    new instances, we must first clear the current list of models and instances.


    # Cleaning up and recreating the scene from the saved values


    Removing all models and instances is a simple and straightforward process. In
    the renderer, we must do the following steps to have a fresh environment:


    +   1. Set miSelectedInstance and miSelectedModel containing the currently selected
    instance and model to zero. The variables from this step and from steps 2 and
    3 were introduced in the Dynamic model and instance management section of Chapter
    1. Then, at index zero, the new null model and null instance will be created.

    +   2. Erase the miAssimpInstances vector and clear the miAssimpInstancesPerModel
    map. Now, all models are unused.

    +   3. Erase the miModelList vector. Since all instances were already deleted,
    the shared pointers of the models will be no longer referenced, and the models
    will be deleted.

    +   4. Add a new null model and a null instance. Both the null model and the null
    instance must be the first elements of the model list and the instances vector
    and map.

    +   5. Clear the undo and redo stacks. In the stacks, we used only weak pointers,
    so this step can be done at any time.

    +   6. Update the triangle count. After all models and instances were removed,
    the triangle count should be zero.


    The entire procedure of cleaning up all models and instances has been added to
    the new removeAllModelsAndInstances() method of the renderer class, simplifying
    the usage whenever we need a clean and fresh environment.


    Now, we can load the model files from disk, but without creating the default instance.
    After all models are loaded, we search the model from the InstanceSettings in
    the model list, create a new instance, and apply the settings from the configuration
    file.


    Next, we should enumerate the instances as the instance index number is not stored
    in the InstanceSettings. But the instance should remain at the same index they
    had at save time, due to the linear reading of the miAssimpInstances vector when
    the YAML emitter is created and the same linear reading of the nodes when parsing
    the YAML file.


    Finally, we restore the camera settings, selected model, and instance plus the
    status of the selection highlight from the parser.'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'At this point, the configuration should be fully loaded, and the application
    should contain the same models, instances, and settings as at the time of the
    save operation.


    One question remains for the load process: What should we do if parsing the configuration
    file fails only partially? Maybe a model file was renamed or deleted, or the file
    was truncated or corrupted and the settings of the last instance are incomplete.


    # Strict or relaxed configuration file loading


    One option to overcome parsing errors is to discard the entire configuration prior
    to deleting all current content of the application. This strict loading type is
    easy to implement; any kind of parsing error invalidates the configuration file
    at parsing time. We ignore the loading request and present just an error message
    to the user.


    The other option is relaxed parsing. We try our best to load the valid models
    and fill in the missing configuration parts with default values but also tell
    the user that parts of the configuration file cannot be loaded.


    In both cases, the error message should give detailed hints at which point the
    parsing failed. Therefore, the exception handling could be extended to know exactly
    what went wrong, and where. For relaxed handling, as much additional information
    about affected models, instances, or settings as possible should be presented
    to the user.


    It is up to the creator of an application to decide which strategy fits best.
    Usually, an attempt to recover as much data as possible should be made. Losing
    only a small part of the created work is better than losing all data.


    # Common errors leading to corrupted files


    A couple of factors can render your saved configuration file corrupt. Some common
    causes are listed here:


    +   - Disk or partition is filled up to 100% while writing the file: Even with
    the large amount of storage we have today, this may happen, and you have only
    parts of your data saved.

    +   - Permission problems: Sometimes, you might have permission to create files
    but not to write file content. So, your files seem to be saved, but the file has
    a length of zero bytes.

    +   - Connection errors when saving to remote places: Your connection may be interrupted
    while writing a larger file, resulting in a partially written file.'
  merge: -1
  img_proc: true
- pgno: 179
  md: '+   - Conversion errors, for instance, by sending files per email: A mail program
    or a mail server may convert the file in an incorrect manner, leading to a partially
    corrupt file with some replaced characters.

    +   - Incompatible locale setting: The machine where the file was saved could
    have used the comma as a decimal separator while your computer uses a point as
    the decimal separator. The numbers in the file will be misinterpreted or even
    set to zero if parsing fails. This problem is tricky to find and gets overlooked
    easily.

    +   - Coding errors, like wrong version handling, wrong conversions, or incomplete
    error/ exception handling: You might save not all data, convert the data by accident
    to a wrong format, or miss parsing some of the data in the file. You should test
    the code reading and writing files for as many possible data types and object
    combinations as possible to find such errors.

    +   - You should be aware that your save files could get corrupted on your machine
    or on the way from or to you. So, save your work often, use a versioning system
    like Git to store different versions of the files, and back up all your configuration
    files on a regular basis.


    Now that we have the code to save and load the state of the application, we can
    provide a predefined default configuration at application startup.


    # Loading a default configuration file at startup


    To help a user explore a new application, next to an extensive tutorial, a simple
    example of the content created with the application can be loaded at the first
    start, or maybe at any start of the application. Tinkering around with the available
    options helps us understand how the application works, and what kind of content
    manipulations are possible.


    Loading a default configuration at startup can be achieved in different ways.
    A configuration file could be added at compile time (*baked* into the application),
    or one or more example files could be placed in a reachable folder, and the example
    file loaded at startup. Often, a separate configuration setting for the application
    is available to disable the automated loading of an example file.


    As an example, we will load the configuration file `config/conf.acfg` from the
    load and save dialogs at application startup. Thanks to the already implemented
    YAML parser and file-loading code, the changes to the renderer class can be done
    with only a couple of lines.'
  merge: -1
  img_proc: true
- pgno: 180
  md: '# Saving and Loading the Configuration


    First, we define the default configuration file as a new private member variable
    mDefaultConfigFileName of the renderer class:


    ```

    const std::string mDefaultConfigFileName =

    "config/config.acfg";

    ```


    Hard-coding file paths or file names should be avoided in general, but for the
    first configuration file, we end up in a chicken/egg problem. If we want to store
    the name of the default configuration in another configuration file, instead of
    hard-coding the file name in the code, we will need another hard-coded file name.
    Such a bootstrapping problem can only be solved by hard-coding the first value.


    Then, in the init() method of the renderer, we try to load the default configuration
    file:


    ```

    if (!loadConfigFile(mDefaultConfigFileName)) {

    addNullModelAndInstance();

    }

    ```


    If the file cannot be found or fails to load, we only create the null model and
    the null instance. Since all other values are set defaults at the first start,
    we end up with the same application as if we would have no default configuration
    at all.


    Implementing load and save functionality to an application requires a bit of research
    for the right type of save file, and some more work to actually implement the
    features into the existing code. All changes and new features should be reflected
    in the save file of the application, thus requiring more work to keep the load
    and save code up to date as application features change. By adding a versioning
    schema to the configuration file, we are even able to load configurations from
    different development stages of the application.




    In this chapter, we added the ability to save the current configuration of the
    application to a file and load the same configuration back into the application.
    First, we evaluated the advantages and disadvantages of binary and textual save
    files and checked three common text file types to find a fitting format for our
    save files. Next, we explored the chosen YAML file format and implemented the
    save and load functionalities. Finally, we added a default file to load at application
    startup to help the user with the first steps of the application handling.'
  merge: -1
  img_proc: true
