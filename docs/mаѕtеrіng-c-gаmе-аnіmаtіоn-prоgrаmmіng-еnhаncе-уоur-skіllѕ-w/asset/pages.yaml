- pgno: 322
  md: "As always, for Vulkan, the variables have to be added to the VkRenderData struct\
    \ in the VkRenderData.h file.\n\nWith these new variables, we can switch interaction\
    \ on and off, as well as set a minimum and maximum scan range for other instances\
    \ and a field-of-view angle that the peer instances need to be in. The field of\
    \ view allows us to select only instances we are looking at, and instances that\
    \ are looking toward us.\n\nIn the std::set of int values, we store all instances\
    \ in the configured range and with the correct view angle. Finally, we store the\
    \ instance we have chosen to interact with.\n\nThe interaction candidate selection\
    \ is handled in findInteractionInstances() in the renderer. Like collision detection,\
    \ we drill down from all instances to a single instance by narrowing down the\
    \ selection properties.\n\nA simple algorithm is used to find the instance suitable\
    \ for interaction:\n\n+   1. A BoundingBox2D object with the max size is used,\
    \ and the query() method of the quadtree is called. Now we have all instances\
    \ in that area.\n+   2. All instances within the minimum range are sorted out,\
    \ including ourselves.\n+   3. By using the dot product between our own rotation\
    \ angle and the distance vector between us and the remaining instances from step\
    \ 2, all instances with the incorrect facing are removed.\n+   4. The distances\
    \ between us and all instances left in step 3 are sorted in ascending order, and\
    \ the nearest instance is set to be the interaction instance.\n\nIf any step returns\
    \ no valid candidates, the interaction request will be ignored.\n\n# Extending\
    \ the handling code\n\nThanks to all our preparations, adding a new event is now\
    \ extremely simple. First, we extend the nodeEvent enum by the new interaction\
    \ value:\n\n```\nenum class nodeEvent : uint8_t {\n  ...\n  interaction,\n  NUM\n\
    };\n```"
  merge: -1
  img_proc: true
