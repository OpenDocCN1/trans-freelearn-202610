- pgno: 48
  md: '# # Animating game characters – a primer


    Moving a game character around in a virtual world with lots of different animations,
    changeable outfits, a collision detection system for other characters and the
    environment, and maybe even interaction with other characters looks nice and simple
    when playing a game.


    But the mathematics and techniques behind the smoothly animated game characters
    are extensive and complex. Every movement, animation, action, or state change
    of the character involves a long journey until the final image is rendered to
    the screen.


    Let’s look at a high-level explanation of animations first. If you already know
    the details, you can skip to the next section.


    # # About nodes, bones, skeletal animation, and skinning


    The building blocks of an animated three-dimensional character model are the so-called
    nodes. A node can be compared to a joint in the virtual body of the character,
    like the shoulder or hip.


    All nodes in the character model are connected in the form of a virtual skeleton,
    forming the bones of the model. By attaching child nodes to a node, modeling an
    arm with a hand and fingers, or a leg with a foot and toes – or even an entire
    human-like skeleton – is no problem. The starting point of the virtual skeleton
    is the so-called root node. The root node has no parent node and is used as the
    starting point for animations.


    Usually, the level of detail does not reach the details of a skeleton in a real-world
    object since many of the real bones are static or play only a minor role in muscle
    or pose changes during animation.


    The virtual skeleton of the character model can be animated by rotating nodes
    around their center point – and thus rotating the bone to all attached child nodes
    around the center point of this node. Just imagine raising your arm a bit: your
    upper arm will rotate around your shoulder joint, and the lower arm, hand, and
    finger follow the shoulder rotation. This kind of animation is called a skeletal
    animation.


    A character needs to be stored in a more or less natural pose in the file, which
    is called the reference pose, or bind pose. You will find most models in a T-pose
    where both arms create a horizontal line, and sometimes you see the A-pose, where
    the position of the arms of the skeleton resembles the uppercase letter A.'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'To animate a character, the transforms of each node between the position in
    the bind pose and the desired position in an animation pose need to be changed.
    Since the transformation of a node needs to be calculated in the local coordinates
    of that specific node, an **inverse bind matrix** per node exists to transform
    between local and world coordinates.


    The animations themselves are stored in animation **clips**. An animation clip
    does not contain node transforms for every possible time of the animation but
    only for specific time points. Only the node transforms at so-called **key frames**
    are stored in the animation clip data, resulting in less data usage. Node positions
    between two key frames are interpolated using linear interpolation for translation
    and scaling, and spherical linear interpolation (SLERP) for rotations.


    By using interpolation between two key frames, the skeleton can be brought into
    virtually any pose between the two stored poses. By interpolating between key
    frames or even interpolated poses of different animation clips, **blending** between
    the two poses can be achieved, Blending can be used to change the animation clip
    of a model without visual distortion, for instance, to create a smooth transition
    between a walking and a running animation clip.


    The virtual skin of a character model is called a **mesh**, and applying a mesh
    to a skeleton in the vertex shader of the rendering pipeline is called **skinning**.
    To give the virtual skin a natural appearance, every vertex of the mesh uses **weights**
    to handle the influence of surrounding nodes.


    These weights are used as a factor for node transforms: the higher the node weight,
    the more transforms of that node will be applied to the vertex, and vice versa.
    By using the node weights, the effects of expanding and compressing the skin and
    underlying muscles of the virtual body can be modeled with good precision.


    In the glTF file format, four weights per vertex are used, but other file formats
    with more weights also exist.


    There is a special kind of animation called a **morph animation**. In a morph
    animation, parts of a mesh are replaced, and the vertex positions can be interpolated
    between the different meshes. Morph animations are used to model facial expressions,
    updating only parts of a character model’s face instead of the entire model. By
    replacing only parts of the mesh but keeping the skeletal information unchanged,
    morph animations can be easily added to skeletal animations.


    Another form of animation is the so-called **additive animation**. Additive animations
    are some sort of mix between skeletal and morph animations: by adding the difference
    between the current pose and the bind pose to the skeletal animation clip, the
    animations of the additive clip are modeled on top of the skeletal animation,
    but only for the nodes that are changed in the additive animation clip.'
  merge: -1
  img_proc: true
- pgno: 50
  md: "Additive animations are used to move only specific parts of a character independently\
    \ of the main skeletal animation. For instance, the skeletal animation contains\
    \ only the walking or running part of the body, while the additive animation clip\
    \ changes only the head or hands. Now the character can move the head to look\
    \ around, without the need to create walking and running animations containing\
    \ all possible head movements.\n\nThe combination of skeletal, morph, and additive\
    \ animation enables us to build powerful and natural-looking characters for our\
    \ virtual world, allowing the model to walk or run beside us, follow our movements\
    \ with the head, and use facial morph animations to speak all at the same time.\n\
    \nNow let us look at the general workflow for creating character model animations.\
    \ We can divide the animation workflow into two parts: preparation and updates.\
    \ While the preparation part is needed only once while loading the model, updates\
    \ are usually made for every frame drawn to the screen.\n\nWe will dive into the\
    \ preparation process of the model first.\n\n# Preparing the data for efficient\
    \ usage\n\nGame character models are stored in single files, or as a collection\
    \ of files, each for a specific purpose. For instance, model and texture data\
    \ could reside in separate files, allowing artists to change the images independently\
    \ of the model vertices.\n\nThe following steps must be done in the application\
    \ before the file in the model data can be used for animation and rendering:\n\
    \n+   1. As the first step in the preparation phase, these files must be loaded\
    \ into the memory of the computer. Depending on the implementation in the game,\
    \ partial loading is possible, adding only the elements of the character model\
    \ that are needed at a specific level, or in a specific part of the virtual world.\n\
    +   \n+   2. Then, the data needs to be pre-processed. The representation of the\
    \ data in the files on disk may be optimized in terms of saving space, but for\
    \ efficient manipulation and rendering, a different kind of optimization is required.\n\
    \nFor example, different rendering APIs, like OpenGL, Vulkan, and DirectX, may\
    \ need slightly different representations of vertex or texture data, or shader\
    \ code to be uploaded to the GPU. Instead of storing the different versions in\
    \ the model file, a generic representation may be used. The required adjustments\
    \ or conversions will be done after loading."
  merge: -1
  img_proc: true
- pgno: 51
  md: "3. As the last step, static data like vertex data or textures will be uploaded\
    \ to the GPU, and other static and variable data parts are stored in C++ classes\
    \ and objects.\n\nAt this point, the model is ready to use. With the first appearance\
    \ of that character on the screen, a continuously running task of data updates\
    \ is needed. These per-frame tasks are required for states that change at runtime,\
    \ such as positions or animation poses.\n\n# Updating character data\n\nSince\
    \ the data of the character is split between main memory and GPU memory, the game\
    \ or animation program must sample, extract, convert, and upload data for every\
    \ single frame the character is drawn to the screen.\n\nFor instance, the key-frame\
    \ data of the animations needs to be updated according to the animation clip to\
    \ be shown and the time since the last frame.\n\nThe following steps must be done\
    \ in every frame to create the pixels of a single model instance for a specific\
    \ time point of a selected animation clip:\n\n+   1. Blending between different\
    \ animation clips could be requested by the program flow, and additional animation\
    \ parts may be needed, like additive blending for the head or the hands, or facial\
    \ animations to allow a facial expression for the character. So, we extract rotation,\
    \ translation, and scaling for all nodes at the specified replay time from all\
    \ animation clips and combine the per-clip node transformations into a final transformation\
    \ matrix for every node.\n+   \n+   2. After the animation data is sampled and\
    \ combined, the skeleton of the character needs to be adjusted. According to the\
    \ animation data, every virtual bone must be translated, rotated, and scaled to\
    \ reach the desired destination.\n+   \n+   3. Also, the world position of the\
    \ character may need to be updated. World position changes can occur in different\
    \ forms, like running around, jumping, or falling down. Knowing the exact position\
    \ of all characters is an important part of the remaining steps.\n+   \n+   4.\
    \ Once bone positions and the world position of the character have been determined,\
    \ collision detection can run. The collision detection checks if the character\
    \ intersects with other characters or environmental objects like the floor and\
    \ walls, or even if the character was hit by a projectile. As a reaction to the\
    \ collision detection results, adjustments to the character properties, like position,\
    \ or animation clip may be triggered."
  merge: -1
  img_proc: true
- pgno: 52
  md: "# Working with Open Asset Import Library\n\n+   5. Having the collision data\
    \ at hand, inverse kinematics adjustments may run. Adjusting the skeleton data\
    \ of the character could be needed to avoid character limbs intersecting with\
    \ the wall or the floor, or to level the feet position on uneven ground.\n+  \
    \ \n+   6. Now, the pure CPU part of the character update is nearly over. As a\
    \ final step from the CPU side, the updated animation data is uploaded to the\
    \ GPU and the render commands are issued. By storing the dynamic character data\
    \ in the GPU, the rendering itself can run without much additional workload from\
    \ the CPU.\n+   \n+   7. On the GPU, the vertex shader transforms the incoming\
    \ vertex data according to the properties of the current view, like distances\
    \ or perspective distortion. After other possible shader stages, the fragment\
    \ shader receives the data from the rasterization stage of the GPU and draws the\
    \ pixels to the output framebuffer.\n+   \n+   8. After all pixels of the level\
    \ data, characters, and the HUD, as well as maybe additional debug data, have\
    \ been sent to the GPU, the visible and the drawing buffers are swapped – at this\
    \ point, the character appears on the screen, at the position and in the animated\
    \ pose we expect to see.\n\nIn between all these update steps, compute shaders\
    \ may run on the GPU to calculate data. Running compute shaders allows the program\
    \ to offload the calculations for multiple characters, freeing the CPU to work\
    \ on other parts of the game.\n\nAs you can see, a lot of work is needed until\
    \ you see a game character running around in the virtual world. Let’s now start\
    \ the journey into character animation with an overview of Open Asset Import Library.\n\
    \n# What is Open Asset Import Library?\n\nOpen Asset Import Library, in short\
    \ Assimp, is a cross-platform library to import and convert 3D model files. The\
    \ different file formats are converted into a hierarchical data structure, enabling\
    \ a programmer to support a wider range of model formats in a single, comprehensive\
    \ way."
  merge: -1
  img_proc: true
- pgno: 53
  md: 'Figure 1.20 shows the key elements and their relationships:


    ![](img/3cfb9832c943f5f7366fd104b5255971_53_0.png)


    Figure 1.20: A simplified version of Assimp''s data structures


    Let us take a closer look at these data structures and their functions:


    +   - aiScene is the central element of Assimp''s data structure. The root node
    entry, all information about the polygonal meshes, the materials, and the animations
    are stored in the aiScene element.

    +   - The root node of aiScene points to a structure called aiNode. In every aiNode,
    possible child nodes are stored, eventually creating a node tree. Also, a transform
    matrix resides in the aiNode structure, defining the local transformation, relative
    to the parent node. This matrix is called the TRS matrix for the three possible
    transformations: translation, rotation, and scale, in this order. By combining
    the TRS transforms from the root node down to every node of the skeleton, the
    final world position of a node can be calculated only by using the world position
    of the root node and the local transformations of every node in the skeleton hierarchy.

    +   - The node name is used in other structs, like the bones or the animations,
    to refer back to this specific node. For the vertices of the node, an index to
    the corresponding aiMesh structure in aiScene is stored here.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# Working with Open Asset Import Library


    +   • All data that will be drawn on the screen is stored in aiMesh structs. Every
    mesh consists of a number of so-called faces, usually triangles. For every vertex
    of every face, important data like the vertices, normals, and texture coordinates
    are stored directly in aiMesh. The drawing order of the vertices is stored separately
    as indices in the other structures, allowing features like space-saving reuse
    of vertices.


    +   • For animations, the model “skeleton” consists of bones, stored in aiBone
    structs. Here, the offset matrix defines the offset between the position in mesh
    space and the bind pose in bone space (in the glTF file format, this is the “inverse
    bind matrix”). Additionally, several value pairs are stored for every vertex,
    each containing a node index and a weight value. In every pair, the weight value
    specifies the fraction of the nodes movement that is applied to the vertex.


    +   • The position of every vertex in the Assimp meshes can be bound to up to
    four bones, and the influence of each of these four bones on the final vertex
    position can be controlled by a weight value between 0 and 1. The weight is used
    as a scaling factor for the transformations of the specified bone – a value 1
    means that the vertex makes the same transformations as the bone, and for a value
    0, the vertex ignores the transforms of the bone.


    +   • On the right side of Figure 1.20, the data for animations is shown. The
    aiAnimation struct contains the animation channels for bones and meshes, the overall
    duration of the specific animation, and the number of frames per second for this
    animation.


    +   • As an example for the animations, we will look at the aiNodeAnim struct.
    This struct consists of key frames with rotations, translations, or scales to
    apply to a specific node. The node name in the aiNode struct is used to find the
    corresponding bone to animate.


    Currently, more than 50 different file formats are known to Assimp. Some notable
    examples are listed here:


    +   • Autodesk 3D Studio (.3ds), AutoCAD (.dxf), and FBX (.fbx)


    +   • Collada (.dae) and glTF (.gltf and .glb), managed by the Khronos Group


    +   • Wavefront vertices (.obj plus materials (.mat))


    +   • STL files, mostly known from 3D printing (.stl)


    +   • Game engine formats, i.e., from Quake (.md3/.md5), or Half-Life (.mdl)


    Even though the number of formats is impressive, it needs to be stated that not
    all models you find can be imported into the application by using Assimp.'
  merge: -1
  img_proc: true
- pgno: 55
  md: "Several of these file formats are reverse-engineered from closed source applications,\
    \ and only a subset of versions work. Other formats are open source, like Collada\
    \ or glTF, but some of those formats are also constantly evolving. Also, not all\
    \ new features have yet been implemented in Assimp. So, even with a versatile\
    \ asset import library like Assimp, you may end up with a model that fails to\
    \ be imported, produces “vertex garbage” on screen, or is missing some of its\
    \ properties. Nevertheless, Assimp is currently the best open source solution\
    \ to load many different game and non-game 3D models into your own application.\n\
    \nLoading a model file with Assimp boils down to importing the aiScene object\
    \ of a file, checking for the existence of other data types, and importing that\
    \ data into the application. In the next section, we will do a short walk-through\
    \ of the steps to load a model file with Assimp.\n\nThe complete source code for\
    \ the application can be found in the folder chapter01, the subfolder 01_opengl_assimp\
    \ for OpenGL, and the subfolder 02_vulkan_assimp for Vulkan.\n\n# Loading a model\
    \ file\n\nTo load a model file with Open Asset Import Library, we must include\
    \ the following three headers in the implementation file of the AssimpModel model\
    \ loading class in the model folder:\n\n```\n```cpp\n#include <assimp/scene.h>\n\
    #include <assimp/Importer.hpp>\n#include <assimp/postprocess.h>\n```\n```\n\n\
    Next, we create an Assimp::Importer instance in the loadModel() method, and use\
    \ the importer to load a file from disk:\n\n```\n```cpp\nAssimp::Importer importer;\n\
    const aiScene *scene = importer.ReadFile(modelFilename,\n  aiProcess_Triangulate\
    \ | aiProcess_GenNormals);\n```\n```\n\nWe hand over the file name of the asset\
    \ file we want to load, plus the two values aiProcess_Triangulate and aiProcess_GenNormals\
    \ as optional postprocessing flags.\n\nThe first flag, aiProcess_Triangulate,\
    \ instructs Assimp to triangulate all polygons with more than three vertices,\
    \ if those polygons exist in the file. Since our basic renderer only understands\
    \ triangles, a polygon with more than three vertices would cause graphical errors.\n\
    \nUsing aiProcess_GenNormals as the import flag ensures that all triangles have\
    \ normal vectors. Default normal vectors pointing upward from the surface of the\
    \ triangle will be created only if no normal vector is found. Existing normals\
    \ are not changed by the flag."
  merge: -1
  img_proc: true
- pgno: 56
  md: "Next, we must check if the import was successful:\n\n```\n```cpp\nif(!scene\
    \ || scene->mFlags & AI_SCENE_FLAGS_INCOMPLETE ||\n    !scene->mRootNode) {\n\
    \    return false;\n}\n```\n```\n\nWe assume a failed import if the scene pointer\
    \ itself is a nullptr, the scene is marked as incomplete by the importer, or the\
    \ scene has no root node defined.\n\nAfter the model file has been loaded successfully,\
    \ we will scan the model for embedded textures.\n\n# Loading embedded textures\n\
    \nSome model formats can embed the textures into the object file. If the function\
    \ call to HasTextures() returns true, we loop over all textures of the model file.\n\
    \n```\n```cpp\nif (scene->HasTextures()) {\n    unsigned int numTextures = scene->mNumTextures;\n\
    \    for (int i = 0; i < scene->mNumTextures; ++i) {\n```\n```\n\nInside the loop,\
    \ we extract the texture name, height, and width, as well as the pixel data of\
    \ the texture. The texture name is only for information purposes, since the data\
    \ is embedded into the model file, but having the name is helpful while debugging\
    \ problems:\n\n```\n```cpp\nstd::string texName =\n    scene->mTextures[i]->mFilename.C_Str();\n\
    int height = scene->mTextures[i]->mHeight;\nint width = scene->mTextures[i]->mWidth;\n\
    aiTexel* data = scene->mTextures[i]->pcData;\n```\n```\n\nNow, we create a shared\
    \ pointer and try to import the texture data. If the import fails with an unexpected\
    \ error, we stop loading the model:\n\n```\n```cpp\nstd::shared_ptr<Texture> newTex\
    \ =\n    std::make_shared<Texture>();\nif (!newTex->loadTexture(texName, data,\n\
    \    width, height)) {\n    return false;\n}\n```\n```"
