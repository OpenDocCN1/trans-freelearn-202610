- pgno: 206
  md: "You are encouraged to extend the current code base and add instance settings\
    \ that honor the edge cases mentioned in this section.\n\nAfter adding cameras\
    \ directly related to the instance position, let’s continue with the stationary\
    \ cameras.\n\n# Adding stationary cameras\n\nA stationary camera can be used in\
    \ several situations. You made a great-looking composition of character models\
    \ and props. Or, you want to have a top-down view of the entire game map you loaded\
    \ and see where every character is placed. Maybe you even want to follow one of\
    \ the instances wandering around the map. A perfect fit for stationary cameras.\n\
    \nFor the pure stationary camera, the configuration is simple. Just add the camera\
    \ type to the activation of the mMouseLock Boolean in the handleMouseButtonEvents()\
    \ method of the renderer:\n\n```\n... && camSettings.csCamType != cameraType::stationary\
    \ ...\n```\n\nAnd in updateCamera() of the Camera class, add the following line,\
    \ right after checking for the zero deltaTime:\n\n```\nif (mCamSettings.csCamType\
    \ == cameraType::stationary) {\n    return;\n}\n```\n\nThat’s it! As soon as you\
    \ select a stationary camera, the right-click of the mouse will be ignored, and\
    \ the camera will also never receive any updates.\n\nIf a stationary camera should\
    \ follow an instance, a bit more code is needed.\n\n# Creating a stationary follow\
    \ camera\n\nThe first step for creating a stationary instance-follow camera is\
    \ the same as for the pure stationary camera – add the camera type to the handleMouseButtonEvents()\
    \ method of the renderer class:\n\n```\nif (!((camSettings.csCamType ==\n    cameraType::stationaryFollowing\n\
    ```\n\nWe must add the camera type to the brackets for first- and third-person\
    \ type checks since we only want to disable the camera manual movement if an instance\
    \ to follow has been configured.\n\nFor the update of the camera position and\
    \ view, a mix of the algorithms from first and third person will be created. You\
    \ will recognize the code samples from the previous sections."
  merge: -1
  img_proc: true
- pgno: 207
  md: "First, we get the instance and calculate the view direction from the camera\
    \ to the instance position:\n\n```\nstd::shared_ptr<AssimpInstance> instance =\n\
    \    mCamSettings.csInstanceToFollow.lock();\nglm::vec3 viewDirection = instance->getWorldPosition()\
    \ -\n    mCamSettings.csWorldPosition;\n```\n\nNext, we set the elevation angle\
    \ of the view to the cosine of the angle between the view direction to the instance\
    \ and the upward-pointing mWorldUpVector:\n\n```\nmCamSettings.csViewElevation\
    \ = 90.0f -\n    glm::degrees(\n        glm::acos(\n            glm::dot(\n  \
    \              glm::normalize(viewDirection), mWorldUpVector\n            )\n\
    \        )\n    );\n```\n\nUsing the dot product between the view direction and\
    \ the upward-pointing vector has been used in first- and third-person cameras\
    \ in a very similar way.\n\nThen, we map the same view direction vector to two\
    \ dimensions and calculate the angle between the flattened view direction vector\
    \ and a vector pointing toward the negative z axis:\n\n```\nfloat rotateAngle\
    \ =\nglm::degrees(\n    glm::acos(\n        glm::dot(\n            glm::normalize(\n\
    \                glm::vec3(viewDirection.x, 0.0f, viewDirection.z)),\n       \
    \     glm::vec3(0.0f, 0.0f, -1.0f)\n        )\n    )\n);\n```\n\nFinally, we extend\
    \ the azimuth angle to a full 360 degrees:\n\n```\nif (viewDirection.x < 0.0f)\
    \ {\n    rotateAngle = 360.0f - rotateAngle;\n}\n```"
  merge: -1
