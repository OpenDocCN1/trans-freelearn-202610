- pgno: 353
  md: 'More additions to the node tree are possible. You can make the models angry
    before punching or kicking, or surprised before playing the picking animation
    to simulate that the instance has seen something on the ground. And with more
    skeletal and face animation clips, even more funny and crazy combinations can
    be created.


    Being able to see someone’s mood in their face helps us as humans to evaluate
    possible next steps, and bringing facial expressions into the application enables
    a much broader way to interact with the instances. By using morph target animations,
    even our basic low-poly models take on much more personality.


    But morph target animations have three severe limitations, which we’ll discuss
    next.


    # Limitations of morph target animations


    When using morph target animations, we must take care of these three limits:


    +   - The number of vertices in the mesh must be identical in all animations and
    frames. It is not possible to add or remove vertices within a frame or during
    an animation, or to change the vertex assignment to triangles. You can only move
    the vertices around.

    +   - The entire mesh of the morphing part of the model must be replicated for
    every morph key in an animation. For smaller parts of the model’s body, this may
    be okay, but having a high-detail part of the body several times in memory may
    create a noticeable overhead.

    +   - Only vertex position changes are supported, the morphing is usually done
    by a simple linear interpolation. Small rotations can be simulated by position
    changes but moving vertices by a large rotation or scaling, like for turning the
    head or moving the hands around, will result in visual distortions during the
    interpolation.


    You can test the third limit by yourself in Blender. To do that, add a morph target-based
    rotation of the head, and you will see the rotation also affects the volume of
    the head. The larger the rotation angle gets, the bigger the distortion during
    the animation becomes.'
  merge: -1
  img_proc: true
- pgno: 354
  md: 'Figure 10.7 shows the result of around 50% of a head rotation by 180 degrees:


    ![](img/3cfb9832c943f5f7366fd104b5255971_354_0.png)


    Figure 10.7: Distorted volume while rotating the head with a morph target animation


    Morph target animations must be created and tested carefully while animating a
    model. They are a valuable addition to animations, but they still have some drawbacks.


    How do we create advanced animations that may need rotations without using morph
    target animations, such as a fancy head movement animation to let the model look
    around in the virtual world?


    That’s what we’ll learn next as we dive into additive blending.


    # Implementing additive blending


    Additive blending is an alternative method of animation blending. While normal
    animation blending is used to interpolate between two skeletal animation clips
    and morph target animations are changing vertex positions of a mesh, additive
    blending stacks two different skeletal animations on top of each other.


    The technical part of additive blending is astonishingly simple, but the effect
    achieved by the combination of two different skeletal animations leads to a much
    more natural appearance of a 3D model.


    Let’s explore the similarities and differences between additive blending and the
    animation blending methods we already know.'
  merge: -1
  img_proc: true
- pgno: 355
  md: '# How additive blending works


    The basic idea of additive blending comes from the desire to split up model animations
    into multiple and especially independent parts.


    A skeletal animation usually delivers an animation for the entire model, allowing
    the model to either run, walk, punch, or jump. Blending between skeletal animations
    will smooth the transition between these two clips but won’t add new movements.
    So, there are two different approaches: splitting the skeleton or stacking animations.


    Splitting the skeleton into two or even more animation domains and playing a different
    clip for each part of the skeleton is called layered blending. Layered blending
    is a simple and cost-effective way to mix animations since every node of the skeleton
    is affected only by the transforms of a single animation clip, just the animation
    clips are different for the nodes.


    But splitting the model skeleton into multiple parts with each part playing a
    different skeletal animation may lead to extra effort to synchronize clips across
    the body. Failures in a synchronous replay on a split-skeleton animation may lead
    to visual artifacts, just think of different replay speeds for the clips.


    We don’t handle layered blending in the book, but a task in the Practical sessions
    section is available to implement layered animation blending for the models. In
    contrast, additive blending allows adding up skeletal animations on top of other
    skeletal animations. While the basic movement created by the basic skeletal animation
    is applied normally, property changes of one or even more other skeletal animations
    are added to the nodes of the model, creating a concatenated motion with what’s
    provided by the basic animation. Additive blending is more expensive to calculate
    than layered blending because we need to calculate multiple animations, and we
    also have to mix all the animations together. As an example, this simple addition
    of property changes allows us to add a head movement to the normal skeletal animations.
    The model will be able to run, walk, punch, or jump from a skeletal animation
    and move the head around at the same time. As a bonus, facial animations are not
    affected by additive blending, so a model can walk, look to the right, and smile,
    and all three animations are running in parallel.


    For the technical implementation part, an additive animation is done by adding
    the differences in the node transformations between the current pose and a reference
    pose to another skeletal animation.'
  merge: -1
  img_proc: true
- pgno: 356
  md: 'Let’s use another example to explain the technical side. Figure 10.8 shows
    the first and the last keyframe for an animation that only rotates the head node
    of the model to the right (from the model’s perspective), while all other nodes
    remain in the T-pose:


    ![](img/3cfb9832c943f5f7366fd104b5255971_356_0.png)


    Figure 10.8: Start and end pose for the additive animation “head look right”


    As the reference pose, we use the first keyframe, with the entire model in the
    T-pose. To calculate the values for an additive animation, we take the desired
    keyframe and simply subtract the translation, rotation, and scale values of the
    reference pose from the destination pose.


    If the model remains in the T-pose, all values for the additive animation will
    be zero. And nothing is added to the running skeletal animation, for instance,
    the walking cycle.


    When we advance further in the animation clip in Figure 10.8, the rotation of
    the head will lead to a bigger difference in the rotation value of the head node
    between the current pose and the reference pose. But we will get only a difference
    for the head node, all other node transformations are still identical to the reference
    pose.


    Adding the difference of the head node rotation to the currently running skeletal
    animation clip is easy. Since we collect the transformation properties for all
    nodes, a combination of two skeletal animations is just a simple per-node addition
    of the values for translation and scale, and a quaternion multiplication for the
    rotation value.


    This addition only changes the values for nodes that have changed in the animation
    clip of the additive animation clip compared to the reference pose. All nodes
    without changes in the additive animation will remain unaltered in the skeletal
    animation.'
  merge: -1
  img_proc: true
- pgno: 357
  md: "# How to create suitable animations\n\nCreating animations to use in additive\
    \ blending is out of the scope of this book, similar to creating face animations.\
    \ You can use a tool like Blender, or use the man’s model from Chapter 10, which\
    \ already contains four extra animations altering only the head.\n\nIf you create\
    \ extra animations by yourself, make sure to prefix the clip names with something\
    \ common, like an underscore, or the letters ZZZ_ to keep them grouped together.\
    \ At least Blender tends to sort the clips by name during the export and since\
    \ we store several clip mappings based on the index number of the clip in the\
    \ YAML configuration file, adding the new clips at the start or somewhere in-between\
    \ the existing clips would lead to broken config files.\n\nImplementing additive\
    \ animations in our application is also surprisingly simple.\n\n# Extending the\
    \ code to support additive animations\n\nTo bring the additional data to the GPU,\
    \ we add four new variables to the struct PerInstanceAnimData in the OGLRendererData.h\
    \ file in the opengl folder:\n\n```\nstruct PerInstanceAnimData {\n  ...\n  unsigned\
    \ int headLeftRightAnimClipNum;\n  unsigned int headUpDownAnimClipNum;\n  ...\n\
    \  float headLeftRightReplayTimestamp;\n  float headUpDownReplayTimestamp;\n};\n\
    ```\n\nAs always for Vulkan, the file is called VkRendererData.h and resides in\
    \ the vulkan folder.\n\nWe split the head animation into two parts and use separate\
    \ variables to control both the left/right animation and the up/down animation\
    \ of the head. It’s impossible to move the head to the left and right at the same\
    \ time, so we can combine those two directions into a single control variable.\
    \ The same holds true for moving the head up and down."
  merge: -1
  img_proc: true
- pgno: 358
  md: "Then, we create a new private compute shader called mAssimpTransformHeadMoveComputeShader\
    \ in the renderer class file, OGLRenderer.cpp:\n\n```\nShader mAssimpTransformHeadMoveComputeShader{};\n\
    ```\n\nFor Vulkan, we add a new VkPipeline handle named rdAssimpComputeHeadMoveTransformPipeline\
    \ to the VkRenderData.h file:\n\n```\nVkPipeline rdAssimpComputeHeadMoveTransformPipeline;\n\
    ```\n\nSince not all models may have additive head animations, we could skip the\
    \ extra calculations if no head animations were set. We also add the new variables\
    \ in the PerInstanceAnimData struct to the compute shader file, assimp_instance_transform.comp.\
    \ The new head animation variables will be ignored, but we need to expand the\
    \ struct to the same size in both shaders.\n\nNext, we copy the assimp_instance_transform.comp\
    \ file to assimp_instance_headmove_transform.comp and load the new file into the\
    \ new mAssimpTransformHeadMoveComputeShader compute shader during the init() method\
    \ of the OGLRenderer.cpp. For Vulkan, we create the new rendering pipeline loading\
    \ the head transform compute shader in the createPipelines() method of VkRenderer.cpp.\n\
    \nIn the new shader file, most of the additions are just copy and paste work.\
    \ We must do the following steps in the extended compute shader, using the code\
    \ for the rotational part of the left/right head movement as examples:\n\n+  \
    \ 1. Extract the animation clip numbers for both head animations:\n\n```\nuint\
    \ headLeftRightClip =\n    instAnimData[instance].headLeftRightAnimClipNum;\n\
    ```\n\n+   2. Extract the inverse scale factors for both head animations:\n\n\
    ```\nfloat headLeftRightRotInvScaleFactor =\n    lookupData[headLeftRightClip\
    \ * clipOffset +\n    node * boneOffset + lookupWidth].x;\n```\n\n+   3. Calculate\
    \ the index values for accessing the lookup data of the head animations:\n\n```\n\
    int headLeftRightRotLookupIndex =\n    clamp(int(instAnimData[instance]\n    .headLeftRightReplayTimestamp\
    \ *\n    headLeftRightRotInvScaleFactor) + 1, 0,\n    lookupWidth - 1);\n```"
  merge: -1
  img_proc: true
- pgno: 359
  md: "4. Get translation, rotation, and scale values for both the reference pose\
    \ at the first lookup positions and the desired head animation clip timestamps:\n\
    \n```\nvec4 headLeftRightBaseRotation =\n    lookupData[headLeftRightClip * clipOffset\
    \ + node *\n    boneOffset + lookupWidth + 1];\n...\nvec4 headLeftRightRotation\
    \ =\n    lookupData[headLeftRightClip * clipOffset + node *\n    boneOffset +\
    \ lookupWidth +\n    HeadLeftRightRotLookupIndex];\n```\n\n5. Calculate the difference\
    \ between the transform values of the current pose and the references pose, using\
    \ a quaternion multiplication for the rotation:\n\n```\nvec4 headLeftRightRotationDiff\
    \ =\n    qMult(qInverse(headLeftRightBaseRotation),\n        headLeftRightRotation);\n\
    ```\n\n6. Add up the differences for translation, rotation, and scale for both\
    \ head animations to a single value for each transform:\n\n```\nvec4 headRotationDiff\
    \ =\n    qMult(headUpDownRotationDiff,\n        headLeftRightRotationDiff);\n\
    ```\n\n7. Add the summed-up differences to the first and second clip transforms,\
    \ again using a quaternion multiplication for the rotation:\n\n```\nvec4 finalRotation\
    \ =\n    slerp(qMult(headRotationDiff, firstRotation),\n    qMult(headRotationDiff,\
    \ secondRotation), blendFactor);\n```\n\nThe instances also need to carry information\
    \ about the head movements, so we add the two new variables, isHeadLeftRightMove\
    \ and isHeadUpDownMove, to the InstanceSettings struct in the InstanceSettings.h\
    \ file:\n\n```\nfloat isHeadLeftRightMove = 0.0f;\nfloat isHeadUpDownMove = 0.0f;\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 360
  md: "We map the positive ranges between 0.0f and 1.0f to a head movement to the\
    \ left and upwards, and the negative range from 0.0f to -1.0f to move the head\
    \ to the right or down. A movement value of zero will use the values of the reference\
    \ pose for both animations, resulting in no head movement at all.\n\nFilling the\
    \ new data in the PerInstanceAnimData struct is done in the draw() call of the\
    \ OGLRenderer or VKRenderer class, in the same part of the code as the facial\
    \ animations. Following the mapping explained before, selecting the clip number\
    \ is done as shown here:\n\n```\nif (instSettings.isHeadLeftRightMove > 0.0f)\
    \ {\n    animData.headLeftRightAnimClipNum =\n        modSettings.msHeadMoveClipMappings[\n\
    \            headMoveDirection::left];\n} else {\n    animData.headLeftRightAnimClipNum\
    \ =\n        modSettings.msHeadMoveClipMappings[\n            headMoveDirection::right];\n\
    }\n```\n\nFor head movement, we use the absolute value of the timestamp:\n\n```\n\
    animData.headLeftRightReplayTimestamp =\n    std::fabs(instSettings.isHeadLeftRightMove)\
    \ *\n    model->getMaxClipDuration();\n```\n\nHard coding the clip numbers in\
    \ the code is a bad idea, different models have these new animations on other\
    \ clip indices, or not at all. Let’s add another mapping, this time between the\
    \ additive blending clip numbers and the four possible directions of the head\
    \ movement.\n\n# Creating mappings for the new head animations\n\nFor a mapping\
    \ between clips and head animations, a new enum class called headMoveDirection\
    \ is created in the Enums.h file:\n\n```\nenum class headMoveDirection : uint8_t\
    \ {\n    left = 0,\n    right,\n    up,\n    down,\n    NUM\n};\n```"
  merge: -1
  img_proc: true
- pgno: 361
  md: "The corresponding string map micHeadMoveAnimationNameMap to show the names\
    \ in the UI is added to the ModelInstanceCamData struct:\n\n```\n```cpp\nstd::unordered_map<headMoveDirection,\
    \ std::string> micHeadMoveAnimationNameMap{};\n```\n```\n\nAnd since the mapping\
    \ is model-related, the new msHeadMoveClipMappings mapping is added to the ModelSettings\
    \ struct in the ModelSettings.h file:\n\n```\n```cpp\nstd::map<headMoveDirection,\
    \ int> msHeadMoveClipMappings{};\n```\n```\n\nThe AssimpModel class also gets\
    \ a new public method to check whether all the mappings in msHeadMoveClipMappings\
    \ are active:\n\n```\n```cpp\nbool hasHeadMovementAnimationsMapped();\n```\n```\n\
    \nFailing to find at least one of the head animations leads to a disabled additive\
    \ head animation. In the draw() call of the OGLRenderer.cpp files, we switch the\
    \ compute shader based on the availability of all head animation mappings:\n\n\
    ```\n```cpp\nif (model->hasHeadMovementAnimationsMapped()) {\n\tmAssimpTransformHeadMoveComputeShader.use();\n\
    } else {\n\tmAssimpTransformComputeShader.use();\n}\n```\n```\n\nFor Vulkan, we\
    \ use the availability of head move animations to choose the pipeline to bind\
    \ for the compute shader in the runComputeShaders() method of the VkRenderer.cpp\
    \ file:\n\n```\n```cpp\nif (model->hasHeadMovementAnimationsMapped()) {\n\tvkCmdBindPipeline(mRenderData.rdComputeCommandBuffer,\n\
    \tVK_PIPELINE_BIND_POINT_COMPUTE,\n\tmRenderData.rdAssimpComputeHeadMoveTransformPipeline);\n\
    } else {\n\tvkCmdBindPipeline(mRenderData.rdComputeCommandBuffer,\n\tVK_PIPELINE_BIND_POINT_COMPUTE,\n\
    \tmRenderData.rdAssimpComputeTransformPipeline);\n}\n```\n```"
  merge: -1
  img_proc: true
