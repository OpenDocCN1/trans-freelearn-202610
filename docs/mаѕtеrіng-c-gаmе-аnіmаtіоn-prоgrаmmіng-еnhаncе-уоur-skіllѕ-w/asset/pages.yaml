  md: "# Extending the code to support behavior changes\n\nA few steps are left to\
    \ fully support computer-controlled behavior in the instances. First, we need\
    \ a copy of a node tree in every instance.\n\n# Creating a node tree copy for\
    \ every instance\n\nWe cannot just copy the nodes since the original and copy\
    \ would access the same node behind the shared pointer. Reusing the same nodes\
    \ for multiple instances would lead to chaos, since collision events from all\
    \ instances would be triggered, resulting in the same steps executed for all instances\
    \ sharing the nodes.\n\nTo create a copy of the node tree for one of the instances,\
    \ a custom copy constructor for the SingleInstanceBehavior class has been created.\
    \ The copy constructor sets the required callbacks, copies the links, and loops\
    \ through the vector of existing nodes to create a clone of every node. For nodes\
    \ that change instance behavior, the additional node action callback will be set.\n\
    \nNext, the callback chain to the renderer must be completed. Right now, only\
    \ the SingleInstanceBehavior class objects are informed that a node wants to send\
    \ a property change request to an instance.\n\n# Connecting SingleInstanceBehavior\
    \ and the renderer\n\nManaging the copies of the instance behaviors will be done\
    \ by the new BehaviorManager class, located in the model folder. The BehaviorManager\
    \ class maintains a mapping between the instance IDs and the copy of the node\
    \ tree the specific instance uses. Also, we have a new callback to keep the renderer\
    \ in the loop to update instance properties of a node of the node tree:\n\n```\n\
    std::map<int, SingleInstanceBehavior>\n    mInstanceToBehaviorMap();\n    instanceNodeActionCallback\
    \ mInstanceNodeActionCallback;\n```\n\nTo update the state of all node trees for\
    \ the instances, an update() method exists in the BehaviorManager class:\n\n```\n\
    void BehaviorManager::update(float deltaTime) {\n    for (auto& instance : mInstanceToBehaviorMap)\
    \ {\n        instance.second.update(deltaTime);\n    }\n}\n```"
