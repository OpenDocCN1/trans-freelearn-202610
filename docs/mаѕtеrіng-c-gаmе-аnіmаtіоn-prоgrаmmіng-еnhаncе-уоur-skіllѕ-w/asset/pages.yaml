- pgno: 121
  md: 'According to the relative size of the brighter instance, this instance would
    be at least partially hidden behind other instances closer to the camera. Yet,
    the adjustment of the z position draws the selected instance on top of all instances
    on the screen.


    What cannot be shown in the picture is the alternating brightness of the selected
    instance. As set in the draw() call of the renderer, the colors of the selected
    instance go up from only 10% of the original color (start value of 0.1f) to 200%
    of the original colors (clamping at 2.0f).


    The flashing colors of the instance will make it fairly easy to find the currently
    selected instance on the screen. But there is still a piece missing in the application:
    Being able to select the instance of choice by clicking into the window, instead
    of searching through all instances by using the instance number arrows. Let’s
    tackle the visual selection now.


    # Selecting a model instance with point and click


    Before we start with the implementation, we will look at the two different approaches
    to add visual selection to an application: by “shooting” a ray into the virtual
    scene, and by using a texture holding an index of the instances.


    # Pros and cons of shooting virtual rays


    You may find the following idea of shooting a virtual ray into your scene appealing:


    We already have the position of the camera in the virtual world as the first endpoint,
    and by mapping the mouse pointer positions back from screen positions to scene
    coordinates, you will get the second endpoint. Mapping coordinates back to the
    scene is only a couple of matrix inversions and multiplications away.


    Sounds promising and easy, doesn’t it?


    Sadly, it is common to underestimate the final complexity at this point. As long
    as you only have a single model in the world, or two, everything is fine. You
    shoot the virtual ray into the scene, and loop over the triangles of each instance
    to find the closest intersection between the ray and the instance triangles.


    But what happens when you have, say, 1,000 instances?


    Every time you click the selection button on your mouse, you would have to iterate
    over all triangles of all instances, hoping to find at least one match. The test
    model of the book has roughly 2,000 triangles, so you will have to check for 2,000,000
    possible intersections in a virtual world with 1,000 instances. Even with massive
    parallel computer shaders, this amount of calculation is a lot of wood to chuck
    for modern graphics cards.'
  merge: -1
  img_proc: true
- pgno: 122
  md: "There are several ways to exclude large areas of the virtual world from the\
    \ hit tests. In combination with other hierarchical approaches on the node level,\
    \ the number of intersection checks can be lowered by several orders of magnitude.\
    \ We will cover optimizations of the process to find intersections when we handle\
    \ instance collisions in Chapter 8.\n\nWhat about the alternative idea – using\
    \ a texture?\n\n# Advantages of drawing the instance index into a texture\n\n\
    The basic idea of an extra texture for the instance selection comes from **Deferred\
    \ Rendering**. In deferred rendering, computations like lighting are not done\
    \ in the fragment shader, but “deferred” after storing the required information\
    \ in textures. The set of textures containing all information about the pixels\
    \ on the screen is called the **G-Buffer**, short for **geometry buffer.**\n\n\
    By using the data of the textures in the G-Buffer, the complexity to apply lighting\
    \ to a scene is lowered from Number of triangles * Number of lights in the entire\
    \ scene to Number of pixels of the G-Buffer * Number of nearby lights.\n\nEven\
    \ for 4K or 8K graphic resolutions, the number of operations to create the lighting\
    \ information is lowered drastically. And, by using other information from the\
    \ rendering process, other effects are easily possible with deferred rendering,\
    \ like shadow mapping, or indirect lighting.\n\nFor naive ray-shooting, the selection\
    \ complexity grows with the number of instances in the virtual world, even if\
    \ these instances are not visible on the screen. When we apply the deferred rendering\
    \ approach to visual selection, we have a constant overhead of drawing some pixels\
    \ into a separate texture. Our selection process no longer depends on a variable\
    \ number of instances in the world. Also, the resolution of the buffers may affect\
    \ the performance of the instance selection only marginally.\n\nThe amount of\
    \ changes required to add visual selection with a separate texture is surprisingly\
    \ low. Let’s look at the steps we have to take.\n\n# Adjusting the framebuffer\n\
    \nWe start with the FrameBuffer class and add a new color attachment. For the\
    \ OpenGL version, the new color attachment is created as follows.\n\n```\nglGenTextures(1,\
    \ &mSelectionTex);\nglBindTexture(GL_TEXTURE_2D, mSelectionTex);\nglTexImage2D(GL_TEXTURE_2D,\
    \ 0, GL_R32F, width, height,\n    0, GL_RED, GL_FLOAT, NULL);\n```"
  merge: -1
  img_proc: true
- pgno: 123
  md: "```\nglBindTexture(GL_TEXTURE_2D, 0);\nglFramebufferTexture(GL_FRAMEBUFFER,\n\
    \    GL_COLOR_ATTACHMENT1, mSelectionTex, 0);\n```\n\nFor the selection texture,\
    \ we add a texture containing only a single element, the red color. But we use\
    \ a 32-bit wide red color, not only 8 bits, allowing us to store much more instance\
    \ indices. The new texture is then added as a color attachment with the index\
    \ 1 to the framebuffer.\n\n# A note on the texture data type (float)\n\nIt is\
    \ possible to create a texture with the type of GL_R32UI, containing a 32-bit\
    \ wide unsigned integer for every pixel. But all integer versions of the texture\
    \ use a conversion factor for the components, raising the complexity of the selection\
    \ process due to extra computations on reads and writes. In contrast, a GL_R32F\
    \ buffer stores and retrieves an unaltered float value. By using a float on the\
    \ GPU side, we are still able to store ~16.7 million instance indices (2^24),\
    \ before the precision of a 32-bit float may lead to rounding errors during the\
    \ conversion between integer and float values. See the section Additional resources\
    \ for a link to a blog entry with more details of float precision.\n\nAlso, during\
    \ framebuffer creation, we have to make sure our shader writes to both color attachments:\n\
    \n```\nconst GLenum buffers[] = { GL_COLOR_ATTACHMENT0,\n    GL_COLOR_ATTACHMENT1\
    \ };\nglDrawBuffers(2, buffers);\n```\n\nIf we don’t change the buffers to draw\
    \ to, only the models will be drawn on the screen, and the selection texture will\
    \ never be filled.\n\nTo clear the color buffer and the selection buffer with\
    \ different values, a new method called clearTextures() has been added to the\
    \ FrameBuffer class:\n\n```\nvoid Framebuffer::clearTextures() {\n    static GLfloat\
    \ colorClear[] =\n        { 0.25f, 0.25f, 0.25f, 1.0f };\n    glClearBufferfv(GL_COLOR,\
    \ 0, colorClear);\n    static GLfloat selectionClearColor = -1.0f;\n    glClearBufferfv(GL_COLOR,\
    \ 1, &selectionClearColor);\n```"
  merge: -1
  img_proc: true
