- pgno: 489
  md: 'To use audio replay with SDL, we need the core SDL library plus the separate
    mixer library named SDL_mixer.


    # Installing SDL and SDL_mixer on Windows


    For Windows, precompiled versions of SDL and SDL_mixer are available on GitHub.
    Go to the releases page at the following two URLs and download the latest stable
    development zip files for Visual Studio, containing both devel and VC in their
    names. As an example, the current development package of the main SDL library
    for Visual Studio is named SDL2-devel-2.30.9-VC.zip. Here are the URLs:


    +   - SDL: https://github.com/libsdl-org/SDL/releases

    +   - SDL_mixer: https://github.com/libsdl-org/SDL_mixer/releases


    Now, unpack the two zip files to your computer, but take care to avoid spaces
    and special characters like German umlauts in the path names to avoid problems
    since even in 2024 many tools have still problems with special characters in the
    paths.


    Next, add two environment variables to help the CMake search scripts find the
    headers and libraries:


    +   - The first variable is named SDL2DIR and must point to the folder where the
    main SDL library was unpacked.

    +   - The second variable is named SDL2MIXERDIR and must point to the folder of
    the SDL_mixer library.


    Figure 14.1 shows an example of the environment variables:


    ![](img/3cfb9832c943f5f7366fd104b5255971_489_0.png)


    Figure 14.1: Example environment variables for SDL'
  merge: -1
