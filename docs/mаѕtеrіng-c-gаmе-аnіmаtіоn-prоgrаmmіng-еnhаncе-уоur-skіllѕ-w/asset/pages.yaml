    \ saving the configuration was not successful.\n\nTo inform the user about save\
    \ errors, only a simple dialog is implemented, notifying the user to check the\
    \ output messages of the application for details about the cause of the write\
    \ error.\n\nIf you load some models now, create instances or clones, and save\
    \ the configuration, you can inspect the created configuration file. All data\
    \ from the Deciding what to store in the configuration file section should be\
    \ in the configuration file.\n\nSaving the data to disk is only half the job.\
    \ To continue working from the same spot where we saved the file, we need to load\
    \ the configuration file back into the application.\n\n# Loading the configuration\
    \ file back and parsing the nodes\n\nTo support parsing custom data types in a\
    \ YAML file, yaml-cpp allows us to define a C++ template for a struct named convert,\
    \ located in the YAML namespace. The convert struct must implement two methods\
    \ called encode and decode, doing the process of serializing the C++ types to\
    \ YAML (encode) and deserializing from YAML back to C++ (decode). By using these\
    \ two methods, yaml-cpp allows a seamless transformation between C++ types and\
    \ YAML entries.\n\nThe encode method creates a new YAML node from a primitive\
    \ or custom data type, while the decode method reads the YAML node data and returns\
    \ the primitive or custom data type.\n\nFor writing a glm::vec3 element to a YAML\
    \ node and reading back a YAML node to a glm::vec3, the following template code\
    \ must be implemented in a header file:\n\n```\nnamespace YAML {\n    template<>\n\
    \    struct convert<glm::vec3> {\n        static Node encode(const glm::vec3&\
    \ rhs) {\n            Node node;\n            node.push_back(rhs.x);\n       \
    \     node.push_back(rhs.y);\n            node.push_back(rhs.z);\n```"
  merge: -1
  img_proc: true
- pgno: 176
  md: "```\nreturn node;\n}\n```\n\nTo save the data from the glm::vec3, we create\
    \ a new YAML node called node and add the three elements x, y, and z of the glm::vec3\
    \ to the node. The node is then returned to the caller of the encode() method.\n\
    \nReading back the data from a node into a glm::vec3 variable is done with the\
    \ decode() method:\n\n```\nstatic bool decode(const Node& node, glm::vec3& rhs)\
    \ {\n    if (!node.IsSequence() || node.size() != 3) {\n        return false;\n\
    \    }\n```\n\nChecking the node type for the right type and size is optional,\
    \ but it is a good style assuring we have the correct data for the custom data\
    \ type to prevent runtime errors. Skipping this check and trying to parse the\
    \ wrong data type will lead to an exception, terminating the entire program if\
    \ unhandled.\n\nThen, we read the data from a node by the sequence index, and\
    \ set the three elements x, y, and z of the glm::vec3 to the float values from\
    \ the node:\n\n```\nrhs.x = node[0].as<float>();\nrhs.y = node[1].as<float>();\n\
    rhs.z = node[2].as<float>();\nreturn true;\n};\n```\n\nAfter defining the encode()\
    \ and decode() methods, we can exchange data between a YAML node and a glm::vec3\
    \ by a normal assignment:\n\n```\nglm::vec3 data;\nnode[\"rotation\"] = data.isWorldRotation;\n\
    data.isWorldRotation = node[\"rotation\"].as<glm::vec3>();\n```\n\nThe same two\
    \ methods are implemented for the InstanceSettings struct, helping us to read\
    \ the settings of the instance directly back into a variable of the type InstanceSettings.\
    \ To avoid polluting the header for our parser class, a new header called YamlParserTypes.h\
    \ has been created in the tools folder. The YamlParserTypes.h header will be included\
    \ in the header of the YamlParser class to make the new conversions available."
  merge: -1
