- pgno: 149
  md: '# Implementing undo and redo functionality


    Nearly every application has some way to undo one operation or more, and many
    applications also allow a redo of reverted steps. Accidents can happen in both
    ways; undoing an unwanted undo can save a lot of time and stress for the user.


    # What do we need to create undo and redo?


    To be able to undo a simple operation that changes object properties, we need
    to save the previous values. Undoing that change could then be done by applying
    the “old” values to the same object, and restoring the state of that object before
    the change.


    For more complex undo operations, storing the operation type is also required.
    If we delete something, the undo step must recreate the object with the same properties,
    and vice versa – undoing the creation of a new object will delete that object.


    Other options could be also taken into account. Do we want to store the absolute
    previous values or just the difference to the new values? By storing relative
    values, redoing the changes that followed the reverted operation could use the
    adjusted values as a basis, while absolute values would overwrite intermitted
    adjustments. And do we store the complete settings for that object, or only the
    changed parameter(s)? The implication is similar to the absolute and relative
    values before.


    From a technical side, our implementation will use two stacks: one for the possible
    undo operations and another for the possible redo operations. Every configuration
    change will push the new and the old settings to the undo stack, allowing the
    reversal of the changes by applying the old settings.


    After the undo operation has been done, the very same setting combination will
    be taken from the undo stack and pushed to the redo stack. If we now do a redo
    of the same operation, the new settings will be applied, and the settings will
    be moved back to the undo stack.


    This simple workflow will allow us a virtually endless undo and redo size, limited
    mostly by the amount of memory in the computer. And, since the settings are small,
    it would take a very long time to fill up the computer memory with the two stacks.


    As the first step on the road to undo and redo, we will create a storage container
    class that encapsulates all the information we need to revert the settings in
    one or the other direction.'
  merge: -1
  img_proc: true
- pgno: 150
  md: "# Creating a setting storage class\n\nThe new class is called AssimpSettingsContainer,\
    \ and the header and implementation file are in the model folder. In the header\
    \ file, a struct is declared to store all the settings we need for both undo and\
    \ redo:\n\n```\nstruct AssimpInstanceSettings {\n    std::weak_ptr<AssimpInstance>\
    \ aisInstance;\n    InstanceSettings aisInstanceSettings{};\n    InstanceSettings\
    \ aisSavedInstanceSettings{};\n};\n```\n\nThe AssimpInstanceSettings struct saves\
    \ the previous and current settings of an instance, along with a weak pointer\
    \ to the instance. Using std::weak_ptr instead of std::shared_ptr here has two\
    \ important reasons:\n\n+   - A weak pointer breaks the dependency between the\
    \ miAssimpInstances vector containing the instance std::shared_ptr and the settings\
    \ stored for undo/redo because a weak pointer is not added to the reference counter\
    \ of the smart pointer for the instance. If we use another shared pointer when\
    \ storing the undo/redo information instead, the memory for a deleted instance\
    \ may not be freed, since there could be another active reference to the instance\
    \ stored somewhere in the undo or redo stack.\n+   - When requesting the weak\
    \ pointer to return the shared pointer by using the lock() call, we can easily\
    \ find deleted instances and remove the saved settings. The lock() call returns\
    \ a nullptr if the shared pointer is no longer available, and we simply use a\
    \ pop() call on the respective stack to remove the dead settings.\n\nIf we want\
    \ to save the settings instances of an instance, we call the apply() method of\
    \ the AssimpSettingsContainer class. The apply() method creates a new AssimpInstanceSettings\
    \ object and pushes the settings to the undo stack.\n\nWe also clear the redo\
    \ stack while saving a new setting via apply(). It may be useless to use the redo\
    \ operation after we reverted a couple of changes and applied recent changes since\
    \ the redo operations could create conflicts with the latest changes, or even\
    \ overwrite the latest change. Removing all settings from the redo stack is a\
    \ quick and safe way to avoid side effects after the latest changes are applied."
  merge: -1
  img_proc: true
- pgno: 151
  md: 'The implementation of the undo() and redo() methods is short and simple:


    +   1. Check for any deleted instances by requesting the shared pointer from the
    weak pointer, and remove the settings struct if the instance pointer is invalid.
    The check will be done in a while() loop to find all deleted instances.

    +   2. If the stack is empty (i.e., because all instances that had settings saved
    for undo or redo are gone), we return from the operation immediately.

    +   3. Get the top entry from the stack and apply the saved settings to the instance
    in case of an undo operation, or the new settings for a redo operation.

    +   4. Push the top entry of a stack to the opposite stack and remove the top
    entry.


    Now, all relevant instance changes can be saved to the undo stack. If we choose
    to undo a change to an instance, we can also immediately redo the very same change.
    In the background, the structs containing old and new settings and the instance
    pointer are just moved between the two stacks on undo and redo operations.


    Adding the new operations to the renderer requires a bit of extra work.


    # Hooking up the storage class to the renderer


    The renderer will be extended by two new methods for the undo/redo related code,
    called undoLastOperation() and redoLastOperation().


    At the start of each of the methods, we call the respective operation on the settings
    container:


    ```

    mModelInstData.miSettingsContainer->undo();

    assignInstanceIndices();

    ```


    In addition, a call to assignInstanceIndices() will be issued. Enumerating all
    instances after undo and redo operations is crucial. The settings taken from the
    stack could contain an invalid instance index in the isInstanceIndexPosition variable
    after other instances have been deleted, resulting in access outside the miAssimpInstance
    vector.


    A side effect of the enumeration is a position change in the miAssimpInstances
    vector. So, we cannot just take the new isInstanceIndexPosition to select the
    instance that was changed by the undo or redo operation. Instead, we retrieve
    the instance pointer of the changed instance from AssimpInstanceSettings and use
    std::find_if to search the miAssimpInstance vector for a matching pointer. If
    we don''t find the correct instance, the null instance will be selected, resulting
    in no instance to be selected.'
  merge: -1
  img_proc: true
