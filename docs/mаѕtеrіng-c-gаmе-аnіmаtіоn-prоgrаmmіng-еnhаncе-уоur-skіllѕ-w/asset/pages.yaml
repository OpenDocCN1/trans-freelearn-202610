- pgno: 245
  md: 'Before we start the implementation, let’s look at the states and transitions
    of the state machine in Figure 7.4:


    # States of mAnimState


    ![](img/3cfb9832c943f5f7366fd104b5255971_245_0.png)


    Figure 7.4: State machine of the mAnimState variable in the AssimpInstance class


    These five states and the transitions between the states can be explained as follows:


    +   1. We start at the state machine at playIdleWalkRun. Here, the default, instance-speed-based
    blending between the movement states, idle, walk, and run, is played.

    +   2. Once an action is requested, we check whether source (current state) and
    destination (action state) are in the msAllowedStateOrder map. If yes, we prepare
    the directional clips and change to the transitionFromIdleWalkRun state.

    +   3. The transitionFromIdleWalkRun state is needed to smooth the transition
    from idle/walk/run to the requested action. Most animation clips start from a
    similar pose of body, arms, and legs. By blending the current idle, walk, or run
    animation to the starting point of the same animation clip, the instance is adjusted
    back to its starting pose. After reaching the starting pose, we advance to the
    transitionToAction state.'
  merge: -1
  img_proc: true
- pgno: 246
  md: '4. In transitionToAction, we blend from the initial pose of the idle, walk,
    or run animation clip to the action state animation clip. This transition is only
    a few frames long and adds a smooth blending to the action clip. Once the transition
    to the action clip is done, we change to playActionAnim.


    5. Once we are in playActionAnim, the animation for the requested action state
    is played at the configured replay speed until the end of the clip is reached.
    When the action animation clip is played, keyboard requests to switch to other
    animation clips or to return to the idle/walk/run cycle are ignored. Once the
    action animation clip is finished and no new requests for an action have been
    issued, the state is changed to transitionToIdleWalkRun.


    Similar to transitionToAction, the transitionToIdleWalkRun state is used to blend
    between the action clip and the idle/walk/run clip. The destination clip (idle,
    walk, or run) is chosen via the instance speed. For a smooth animation cycle,
    the positions of the body, arms, and legs are the same as the start and end of
    the clip. By blending the end of the action clip with the start of an idle/walk/run
    clip, we have a smooth transition back to the initial state. After the blending
    is finished, we change the state back to playIdleWalkRun.


    For the animation clip transitions, we create a new enum struct called animationState
    in the Enums.h file containing the states of the finite state machine:


    ```

    enum class animationState : uint8_t {

    playIdleWalkRun = 0,

    transitionFromIdleWalkRun,

    transitionToAction,

    playActionAnim,

    transitionToIdleWalkRun

    };

    ```


    The state machine is defined in the updateAImStateMachine() method of the AssimpInstance
    class. The states are built as switch/case statements moving forward on the conditions
    outlined in Figure 7.4:


    ```

    switch (mAnimState) {

    case animationState::playIdleWalkRun:

    playIdleWalkRunAnimation();

    ...

    break;

    case animationState::transitionFromIdleWalkRun:

    blendIdleWalkRunAnimation(deltaTime);

    }

    ```'
  merge: -1
  img_proc: true
- pgno: 247
  md: '```

    break;

    case animationState::transitionToAction:

    blendActionAnimation(deltaTime);

    break;

    case animationState::playActionAnim:

    playActionAnimation();

    ...

    break;

    case animationState::transitionToIdleWalkRun:

    blendActionAnimation(deltaTime, true);

    break;

    }

    ```


    You can check the details of the finite state machine in the updateAnimStateMachine()
    method of the AssimpInstance class. The code is simple and straightforward: we
    just replay and blend between various animation clips.


    With the blending code and the finite state machine in place, you can change to
    the view mode of the application by pressing F10. If you press a key for an action
    while you are at an allowed source state, the action clip will be played. Right
    after the action clip, the instance goes back to the previous idle/walk/run state.


    To complete this chapter’s features, we need to make the state and clip mappings
    permanent by adding the contents of the ModelSettings struct and all related custom
    data types to the configuration file.


    # Saving and loading the states


    We can reuse some of the save and load code we created in the previous chapters
    when saving and loading the current state of custom data types. The moveState
    and moveDirection enum class types will be stored as integer values in the YAML
    configuration file of the application. The three new struct types, IdleWalkRunBlending,
    ActionAnimation, and ModelSettings, are deconstructed into their elements when
    saving them to the configuration file and reassembled when reading the values.
    The C++ maps and sets are created by using the known combination of YAML sequences
    and YAML maps.'
  merge: -1
  img_proc: true
- pgno: 248
  md: "# Storing the new data types\n\nFor the moveState and moveDirection structs,\
    \ we create a new convert template in the YamlParserTypes.h file in the tools\
    \ folder that will simply cast to int and back:\n\n```\ntemplate<>\nstruct convert<moveState>\
    \ {\n\tstatic Node encode(const moveState& rhs) {\n\t\tNode node;\n\t\tnode =\
    \ static_cast<int>(rhs);\n\t\treturn node;\n\t}\n\tstatic bool decode(const Node&\
    \ node, moveState& rhs) {\n\t\trhs = static_cast<moveState>(node.as<int>());\n\
    \t\treturn true;\n\t}\n};\n```\n\nThe YAML emitter overloads for moveState and\
    \ moveDirection in the YamlParser.cpp file in the tools folder are also casting\
    \ the values to int:\n\n```\nYAML::Emitter& operator<<(YAML::Emitter& out, const\
    \ moveState& state) {\n\tout << YAML::Flow;\n\tout << static_cast<int>(state);\n\
    \treturn out;\n}\n```\n\nNow we can read and write the new data types like every\
    \ other type when we generate or parse our YAML configuration file.\n\nBoth struct\
    \ types, IdleWalkRunBlending and ActionAnimation, only use int and float values,\
    \ so the main task here is to find good names for the YAML nodes. For example,\
    \ the ActionAnimation values are stored as clip and clip-speed in the YAML file:\n\
    \n```\nstatic bool decode(const Node& node, ActionAnimation& rhs) {\n\trhs.aaClipNr\
    \ = node[\"clip\"].as<int>();\n\trhs.aaClipSpeed = node[\"clip-speed\"].as<float>();\n\
    \treturn true;\n}\n```"
