- pgno: 497
  md: 'If you move around the controlled instance now by using the mouse and the W/A/S/D
    keys, you should hear two different footstep sounds, depending on the instance
    walking or running around in the virtual world.


    # Extending the audio manager class


    To outline a possible expansion of the AudioManager class to support more channels
    to achieve a more game-like sound management, we would need to keep track of the
    channel playing the footstep sound returned by the Mix_PlayChannel() call. By
    reserving one channel exclusively for the local footstep sounds, we can achieve
    the same behavior, but we would be able to play more sound effects at the same
    time.


    Handling multiple sound effects can be achieved by adding a creating a pool of
    sound channels and adding a callback to the Mix_ChannelFinished() SDL function,
    similar to Mix_HookMusicFinished(). SDL triggers the Mix_ChannelFinished() callback
    whenever a channel has finished the current sound clip, or when Mix_HaltChannel()
    is called and delivers the number of the finished sound channel in the callback.


    The sound channel pool can be updated when a sound effect is played and when the
    effect replay has finished. By using the distance to the object creating the sound
    effect and scaling down the volume of the channel with Mix_Volume() or by using
    Mix_SetDistance(), the different distances of the source can be modeled. In addition,
    Mix_SetPanning() can be used to adjust the position of the sound source to the
    left and right.


    Several tasks in the Practical sessions section are available to evolve the sound
    replay from the current state.


    As an example of how to use the AudioManager callbacks from the UserInterface
    class, a simple music replay control has been added to the user interface. In
    the Music & Sound section of the Control window, you will find a combo box and
    some buttons to play the music from the playlist created from the assets/music
    folder.


    # Using the music player in the UI


    Adding music replay functionality to the UserInterface class is a quick and simple
    task. By using the callbacks to the AudioManager class, a basic music player is
    implemented with only a few code blocks to the UI.'
  merge: -1
  img_proc: true
- pgno: 498
  md: 'In Figure 14.2, the ImGui section with a basic music player using the AudioManager
    class is shown:


    ![](img/3cfb9832c943f5f7366fd104b5255971_498_0.png)


    Figure 14.2: A music player based on the AudioManager added to the user interface


    The desired music track to play can be chosen by using the Tracks combo box, the
    current track can be played by pressing the Play button, or a random track from
    the playlist will be chosen from the shuffled playlist by pressing Play Random.
    The other four buttons, Prev, Pause, Stop, and Next, do exactly what the label
    states, and by using the sliders, the volume of music and sound effects can be
    set to a value between 0 (for silence) and 128.


    # Alternative sound manager implementations


    The AudioManager class used for the application uses a straightforward implementation
    with direct control through C++ callback functions. For an advanced sound system,
    an event- or message-based implementation could be used. Such an implementation
    can use event managing code already in the game, and events or messages also decouple
    the sound effects replay from the code that is requesting to replay a sound effect
    or a music change.


    After having sound and music available in the virtual world, an update to the
    graphics of the application may appear also on the to-do list. Let’s explore some
    visual enhancements now.


    # Enhancing visuals


    The OpenGL and Vulkan renderers in the example code support only a minimal set
    of features to bring an image to the screen: Both renderers can only draw textures
    triangles and colored lines. Adding one or more of the following enhancements
    will be a fantastic extension to the quality of the images.


    # Bringing colors to the world by using physically based rendering


    Right now, we are using only the textures of the Assimp objects to render the
    model instances and level geometry to the screen. By using physically based rendering,
    short PBR, we could also model surface properties in the form of materials. With
    such PBR materials, it is easy to create'
