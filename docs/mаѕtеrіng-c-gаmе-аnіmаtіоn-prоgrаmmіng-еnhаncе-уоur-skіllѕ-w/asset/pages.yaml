- pgno: 104
  md: "Now let us add more models – many models. Let’s say we add a total of 4,000\
    \ instances of the example model. The resulting matrix generation times on your\
    \ machine may be similar to the number in Figure 2.6:\n\n![](img/3cfb9832c943f5f7366fd104b5255971_104_0.png)\n\
    \nFigure 2.6: The compute shader version with 4,000 instances\n\nEven with 2.5\
    \ times the number of instances, the average matrix generation time of the compute\
    \ shader code is still at about half the time of the CPU version. You may even\
    \ see a much larger, non-linear performance gain with more powerful GPUs. Recent\
    \ GPUs not only have several thousands of cores that are working in parallel on\
    \ the matrix multiplications, but the next biggest model also nearly doubles the\
    \ number of cores, leading to more parallelization.\n\nWe can scale up the number\
    \ of instances a lot more or process more complex models while still having a\
    \ lower matrix generation time. At some arbitrary number of instances, the frame\
    \ rate of the application will still drop below 60 FPS. Depending on your system,\
    \ this may happen before reaching the 4,000 instances of Figure 2.6, or much later.\n\
    \nIf you attach a profiler to the application, you will spot the new bottleneck\
    \ of our calculation: The quaternion SLERP at the end of the method getRotation()\
    \ in the AssimpAnimChannel class:\n\n```\nglm::quat rotation =\n    glm::normalize(glm::slerp(mRotations.at(timeIndex),\n\
    \    mRotations.at(timeIndex + 1), interpolatedTime));\n```"
