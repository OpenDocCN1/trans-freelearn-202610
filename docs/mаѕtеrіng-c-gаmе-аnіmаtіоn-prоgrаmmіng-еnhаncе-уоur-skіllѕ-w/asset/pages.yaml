- pgno: 89
  md: "```\nnodeName)->getTRSMatrix() *\nmAssimpModel->getBoneOffsetMatrices().at(nodeName);\n\
    ```\n\nSince the bone offset matrices are on a per-model base, we can add an SSBO\
    \ to our AssimpModel class and upload the data during the model loading. We can\
    \ simply add an SSBO to the AssimpModel.h header file in the model folder:\n\n\
    ```\nShaderStorageBuffer mShaderBoneMatrixOffsetBuffer{};\n```\n\nThen, in the\
    \ loadModel() method, we fill a local vector with the offset matrices and upload\
    \ the data to the SSBO:\n\n```\nstd::vector<glm::mat4> boneOffsetMatricesList{};\n\
    for (const auto& bone : mBoneList) {\n    boneOffsetMatricesList.emplace_back(\n\
    \        bone->getOffsetMatrix());\n}\nmShaderBoneMatrixOffsetBuffer.uploadSsboData(\n\
    \    boneOffsetMatricesList);\n```\n\nAfter we prepare the data for our compute\
    \ shader, we bind the SSBO containing the bone offset matrices to the same binding\
    \ point we configured in the matrix multiplication compute shader (binding = 2):\n\
    \n```\nmodelType.second.at(0)->getModel()\n    ->bindBoneMatrixOffsetBuffer(2);\n\
    ```\n\nA bit more hidden at first glance is the need for parent matrices. In the\
    \ method updateTRSMatrix() of AssimpNode, we retrieve the TRS matrix from the\
    \ parent node (if we have a parent node). Then, we use the parent node to calculate\
    \ the TRS matrix of the node itself:\n\n```\nif (std::shared_ptr<AssimpNode> parentNode\
    \ =\n    mParentNode.lock()) {\n    mParentNodeMatrix = parentNode->getTRSMatrix();\n\
    }\nmLocalTRSMatrix = mRootTransformMatrix *\n    mParentNodeMatrix * mTranslationMatrix\
    \ *\n    mRotationMatrix * mScalingMatrix;\n```\n\nIn the updateAnimation() method\
    \ of the AssimpInstance class, we start with the update of the TRS matrix of the\
    \ root node and descend into the child nodes, collecting the parent matrix node,\
    \ which contains all transformation matrices up to the model root node."
