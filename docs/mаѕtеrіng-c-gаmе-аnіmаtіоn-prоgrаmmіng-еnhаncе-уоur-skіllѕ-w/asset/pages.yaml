  md: "Still, this solution has some drawbacks. What if we don’t want to center the\
    \ selected instance, maybe because we would like to keep the camera position fixed.\
    \ So, let’s add another function to the code that makes the currently selected\
    \ instance even easier to find among all instances shown on the screen.\n\n# Adding\
    \ a highlight to the selected instance\n\nAt first sight, adding some sort of\
    \ highlight seems to be easy by adding some more fields to the vertices and the\
    \ vertex buffer. Sadly, we are using instanced rendering for performance reasons.\
    \ This means that all instances share the same vertex data. So, this approach\
    \ does not work.\n\nThe next idea may be the instance placement and animations\
    \ data. These matrices are calculated entirely by our compute shaders from Chapter\
    \ 2, fed by the node transform data of the nodes. Adding model related data to\
    \ every node seems to be a bit overkill, since the highlighted data is needed\
    \ only once per instance, not once per node.\n\nA better idea would be another\
    \ SSBO, filled with the correct data in the draw() call of the renderer, right\
    \ after the node transform data has been retrieved from the instance. In the instance\
    \ loop, we have direct access to all instances of a model and can simply push\
    \ a value to a std::vector, stating if this is the selected instance or not. After\
    \ uploading the data of the vector to the SSBO, the shader instance can check\
    \ the buffer data to see if the highlight should be added to the instance it is\
    \ working on, or not.\n\n# Preparing the renderer to support highlights\n\nAs\
    \ the first step for adding the highlight to the selected instance, we add a vector\
    \ containing a float, and, for the OpenGL renderer, an SSBO to the renderer header\
    \ file:\n\n```\nstd::vector<float> mSelectedInstance{};\nShaderStorageBuffer mSelectedInstanceBuffer{};\n\
    ```\n\nDue to the different data logic, for Vulkan, a VkShaderStorageBufferData\
    \ object in the VkRenderData struct in the file VkRenderData.h will be used instead.\n\
    \nIn the draw() call of the renderer, we save the smart pointer of the currently\
    \ selected instance, right before we start the loop across the models and instances:\n\
    \n```\nstd::shared_ptr<AssimpInstance> currentSelectedInstance =\n    nullptr;\n\
    \n...\n\ncurrentSelectedInstance =\n```"
  merge: -1
  img_proc: true
- pgno: 118
  md: "```\nmModelInstData.miAssimpInstances.at(\nmModelInstData.miSelectedInstance);\n\
    ```\n\nIn addition to storing the instance, we alter a float value inside the\
    \ OGLRenderData respective VkRenderData struct by adding a scaled deltaTime, and\
    \ resetting the value once it reaches 2.0f:\n\n```\nmRenderData.rdSelectedInstanceHighlightValue\
    \ +=\ndeltaTime * 4.0f;\nif (mRenderData.rdSelectedInstanceHighlightValue > 2.0f)\
    \ {\n  mRenderData.rdSelectedInstanceHighlightValue = 0.1f\n}\n```\n\nThe value\
    \ of the variable rdSelectedInstanceHighlightValue will be used in the shader\
    \ to scale up or down the color of the selected instance. By adding the value\
    \ of deltaTime in every draw() call and resetting the highlight variable to 0.1f\
    \ when we reach 2.0f, the selected install will blink from very dark to very bright.\
    \ The blinking instance will be easier to spot on the screen, compared to just\
    \ the coordinate arrows.\n\nInside the instance loop, we compare the smart pointer\
    \ of the instance we are working on and the saved smart pointer of the selected\
    \ instance. If they are identical, the alternating value of the variable rdSelectedInstanceHighlightValue\
    \ will be set at the index of the current instance in the mSelectedInstance vector:\n\
    \n```\nif (currentSelectedInstance ==\nmodelType.second.at(i)) {\n  mSelectedInstance.at(i)\
    \ =\n  mRenderData.rdSelectedInstanceHighlightValue;\n} else {\n  mSelectedInstance.at(i)\
    \ = 1.0f;\n}\n```\n\nIf we are working on any other instance in the loop, we simply\
    \ set the x value to 1.0f, resulting in an unchanged color of the instance in\
    \ the shader.\n\nThe collected data of the mSelectedInstance vector is then uploaded\
    \ to the SSBO. For example, the OpenGL renderer uses the uploadSsboData() method\
    \ of the ShaderStorageBuffer class to upload the vector data to the GPU:\n\n```\n\
    mSelectedInstanceBuffer.uploadSsboData(\nmSelectedInstance, 3);\n```"
