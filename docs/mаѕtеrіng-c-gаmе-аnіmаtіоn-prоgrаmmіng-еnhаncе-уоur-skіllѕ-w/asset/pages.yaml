- pgno: 475
  md: "```\nglm::vec3 angles = glm::eulerAngles(destRoation);\nrotateInstance(glm::degrees(angles.y)\
    \ *\n    deltaTime * 2.0f);\n}\n```\n\nThe multiplication with deltaTime makes\
    \ the instance rotation smooth since the angle in every frame is small. The initial\
    \ comparison of the angleDiff value makes sure we have a small “dead zone” left,\
    \ leading to fewer rotations if the path is nearly straight and avoiding oscillations\
    \ in case the rotation oversteers a bit.\n\nIf the target is moving around in\
    \ the level, the dead zone also reduces the number of corrections when the path\
    \ of the instance is recreated. By carefully tuning the amount of oversteering\
    \ and the dead zone angle, a chasing instance will behave more naturally since\
    \ both parameters could reduce the number of directional changes while following\
    \ the target.\n\nTo make the calculated path visible, we should also add a visual\
    \ output for the renderer.\n\n# Adding debug lines for the path\n\nDrawing the\
    \ path to the screen is astonishingly easy. Next to adding a control Boolean named\
    \ rdDrawInstancePaths to the OGLRenderData struct for OpenGL, respective to the\
    \ VkRenderData struct for Vulkan, a new line mesh in the renderer and a checkbox\
    \ in the UserInterface class, creating the lines between all path points is easy.\
    \ The best place for the new code is after the code added in the Calculating the\
    \ path to the target section.\n\nFirst, we check if we should create the lines\
    \ at all and if we have a valid target:\n\n```\nif (mRenderData.rdDrawInstancePaths\
    \ &&\n    pathTargetInstance > -1) {\n```\n\nThen, we set the desired color and\
    \ a height offset for the path and create a vertex to draw the line:\n\n```\n\
    glm::vec3 pathColor = glm::vec3(0.4f, 1.0f, 0.4f);\nglm::vec3 pathYOffset = glm::vec3(0.0f,\
    \ 1.0f, 0.0f);\nOGLLineVertex vert;\nvert.color = pathColor;\n```\n\nNext, we\
    \ add the world position of the current instance as the starting point for the\
    \ lines:\n\n```\nvert.position = instSettings.isWorldPosition +\n    pathYOffset;\n\
    mInstancePathMesh->vertices.emplace_back(vert);\n```"
  merge: -1
  img_proc: true
- pgno: 476
  md: "If we have a valid path, we extract the world position of the first triangle\
    \ center of the path as the second point for the first line. Since we already\
    \ removed the starting triangle, the line will be drawn to the next triangle in\
    \ the path:\n\n```\nif (pathToTarget.size() > 0) {\n    vert.position = mPathFinder.getTriangleCenter(\n\
    \        pathToTarget.at(0)) + pathYOffset;\n    mInstancePathMesh->vertices.emplace_back(vert);\n\
    }\n```\n\nThen, we create a new temporary line mesh and retrieve the vertices\
    \ of the path segments by calling getAsLineMesh() of the PathFinder class:\n\n\
    ```\nstd::shared_ptr<OGLLineMesh> pathMesh =\n    mPathFinder.getAsLineMesh(pathToTarget,\n\
    \        pathColor, pathYOffset);\n    mInstancePathMesh->vertices.insert(\n \
    \       mInstancePathMesh->vertices.end(),\n        pathMesh->vertices.begin(),\n\
    \        pathMesh->vertices.end());\n```\n\nThe helper method getAsLineMesh()\
    \ just extracts the center points of the ground triangles on the path, adds the\
    \ desired offset to the world position of the vertices, and creates lines from\
    \ the vertices.\n\nNow, we add the last position as a possible starting point\
    \ for the last line:\n\n```\nvert.position = mPathFinder.getTriangleCenter(\n\
    \    pathToTarget.at(pathToTarget.size() - 1)) +\n    pathYOffset;\n    mInstancePathMesh->vertices.emplace_back(vert);\n\
    }\n```\n\nAs a final step for the line creation, we add the world position of\
    \ the target:\n\n```\nvert.position = pathTargetWorldPos + pathYOffset;\n    mInstancePathMesh->vertices.emplace_back(vert);\n\
    ```\n\nIf the path is empty after removing the first and/or last element, we skip\
    \ the code inside the if condition and draw only a line from our own position\
    \ to the target. This happens only if we have a valid target, and the start and\
    \ target triangles are directly next to each other. If an error occurs during\
    \ pathfinding and the path is empty, we reset the target instance, and the line\
    \ is no longer drawn."
  merge: -1
