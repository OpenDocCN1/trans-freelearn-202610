- pgno: 209
  md: 'We also don’t limit the camera changes to edit mode to allow switching between
    cameras in the view mode.


    Another cool addition is the orthogonal projection. While perspective projection
    tries to mimic the size reduction of objects farther away from the camera, orthogonal
    projection will retain the dimension of the objects.


    # Adding orthogonal projection


    You may recognize a game similar to the picture in Figure 6.5:


    ![](img/3cfb9832c943f5f7366fd104b5255971_209_0.png)


    Figure 6.5: A small level in orthogonal projection


    This version of the Stalkyard map from Half-Life was created by the user pancakesbassoondonut
    on Sketchfab. The map is available at https://skfb.ly/6A0Cx and licensed under
    the Creative Commons Attribution license CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/).


    Older games used orthogonal projection only for aesthetic reasons. Without scaling
    the textures or changing the angle of the faces, very little computational power
    was required to create stunning-looking games.'
  merge: -1
  img_proc: true
- pgno: 210
  md: "To support orthogonal projection, we create a new enum class named cameraProjection\
    \ in the Enums.h file:\n\n```\nenum class cameraProjection {\n  perspective =\
    \ 0,\n  orthogonal\n};\n```\n\nIn the CameraSettings struct, we add two new variables\
    \ named csCamProjection and csOrthoScale:\n\n```\ncameraProjection csCamProjection\
    \ = cameraProjection::perspective;\nfloat csOrthoScale = 20.0f;\n```\n\nWhile\
    \ csCamProjection is used to swap between perspective and orthogonal projection,\
    \ the csOrthoScale variable will define a zoom-level style setting of the orthogonal\
    \ projection, similar to the field of view setting for perspective projection.\n\
    \nThe current code to create the projection matrix in mProjectionMatrix will be\
    \ moved into a check for the new projection setting:\n\n```\nif (camSettings.csCamProjection\
    \ == cameraProjection::perspective) {\n  ...\n} else {\n}\n```\n\nAnd, if the\
    \ orthogonal projection has been selected, we will use glm::ortho() instead of\
    \ glm::perspective() to create the projection matrix. First, we read csOrthoScale\
    \ and use the value to scale the aspect ratio and the left and right plus near\
    \ and far plane distances:\n\n```\nfloat orthoScaling = camSettings.csOrthoScale;\n\
    float aspect = static_cast<float>(mRenderData.rdWidth)/static_cast<float>(mRenderData.rdHeight)\
    \ * orthoScaling;\nfloat leftRight = 1.0f * orthoScaling;\nfloat nearFar = 75.0f\
    \ * orthoScaling;\n```"
  merge: -1
  img_proc: true
- pgno: 211
  md: "The call to glm::ortho() creates the orthogonal projection matrix, moving the\
    \ origin of the virtual world to the origin of the screen:\n\n```\nmProjectionMatrix\
    \ = glm::ortho(-aspect, aspect, -nearFar, nearFar);\n```\n\nBy using the center\
    \ of the virtual world as the center for the projection matrix, we get a nicely\
    \ scaled result on the screen. Due to the camera position in the view matrix,\
    \ we are even able to move the camera in the orthogonally drawn virtual world.\n\
    \nThe only restriction here is the movement into the screen: While moving a camera\
    \ left and right or up and down adjusts the view as expected, a forward and backward\
    \ movement will show no changes in the first place. This missing reaction to a\
    \ camera movement in the direction of the z axis is caused by the basic principle\
    \ of the orthogonal projection. We don't have a view frustum like in the perspective\
    \ projection: the projection matrix creates a huge rectangular box instead, and\
    \ every triangle inside that box is drawn.\n\nReaching a point with the camera\
    \ where some triangles are behind the far z plane of the rectangular box requires\
    \ us to move the camera far away from the origin of the virtual world. You can\
    \ try to reach such a point by yourself, but it will take a lot of time, even\
    \ with the faster camera movement.\n\nDespite the cool-looking effect of an orthogonal\
    \ projection, be aware that depth perception can be tricky in such a case. Our\
    \ brain has learned that the size of an object will decrease if the distance to\
    \ it grows, and objects with the same apparent sizes but different distances do\
    \ not have the same sizes in real life. With all instances on the screen being\
    \ the same size, you may be completely off when guessing which instances are closer\
    \ to the camera.\n\n# User interface controls for the projection settings\n\n\
    To control which projection will be used, two radio buttons are added to the UserInterface\
    \ class. The first radio button is used to activate the perspective projection:\n\
    \n```\nImGui::Text(\"Projection: \");\nImGui::SameLine();\nif (ImGui::RadioButton(\"\
    Perspective\", settings.cCamProjection == cameraProjection::perspective)) {\n\t\
    settings.cCamProjection = cameraProjection::perspective;\n}\n```"
  merge: -1
  img_proc: true
