- pgno: 321
  md: 'Also, changes to the node tree in the editor session are not automatically
    copied to the instances. You need to select an instance or model and apply the
    current state after every change.


    Since only the original node tree data of the editor session is saved to the YAML
    file and not the tree data of the individual instances, restarting the application
    or reloading the configuration applies the editor state to all instances that
    use the specific node tree.


    Finally, the nodes cannot access data from their instance or other data of the
    virtual world. Reacting to properties like position or rotation, or seeing if
    you are the primary or secondary candidate of a collision to adjust the rotation
    angle, is not possible.


    Many of these limits can be removed with some effort and additional coding. See
    the Practical sessions section for ideas.


    In the last section of this chapter, we will use the code we have added up until
    now to create a new feature: interaction between instances.


    # **Adding interaction between instances**


    We already have an action called Interaction, starting the interaction animation
    clip for the man’s model (and doing nothing visible for the woman’s model, as
    the model does not have an animation clip to show some kind of interaction).


    This interaction action will be extended to send an event to a nearby instance,
    stating that we want to interact with the instance. A possible reaction to the
    interaction request could be the replay of the waving animation clip for the man’s
    model on the nearby instance, visually confirming that the event has been processed.


    # **Creating interaction control properties**


    The renderer needs some variables and a bit of code to support interaction. We
    add these new variables in the OGLRenderData struct in the OGLRenderData.h in
    the opengl folder:


    ```

    bool rdInteraction = false;

    float rdInteractionMaxRange = 10.0f;

    float rdInteractionMinRange = 1.5f;

    float rdInteractionFOV = 45.0f;

    std::set<int> rdInteractionCandidates{};

    int rdInteractWithInstanceId = 0;

    ```'
