- pgno: 183
  md: '# 6


    # Extending Camera Handling


    Welcome to Chapter 6! In Chapter 5, we added the functionality to save and load
    the application configuration. First, we explored data types, file formats, and
    which data to save to a file. Then, we implemented a parser class to write and
    read configuration files in the YAML file format. At the end of the chapter, all
    models and instances plus the global settings were stored in a YAML file by using
    the yaml-cpp library, and all data could be read back into the application, enabling
    us to resume building the virtual world.


    In this chapter, we will enhance the camera configuration. As the first two steps,
    we will extend the application to handle more than one camera and add multiple
    camera types. Then, we’ll implement camera types for a first-person and third-person
    view, following a selected instance like in real games. Next, we will add stationary
    cameras, allowing a surveillance-style view of the virtual scenery. As the last
    step, we will add a hotkey to switch between cameras, along with orthogonal projection
    and mouse-wheel-based field of view adjustment.


    In this chapter, we will cover the following topics:


    +   - Adding multiple cameras

    +   - Creating different camera types

    +   - Implementing first- and third-person cameras

    +   - Adding stationary cameras

    +   - Switching between cameras and configurations'
  merge: -1
  img_proc: true
- pgno: 184
  md: "# Technical requirements\n\nThe example code is in the chapter06 folder, in\
    \ the subfolders 01_opengl_cameras for OpenGL and 02_vulkan_cameras for Vulkan.\n\
    \n# Adding multiple cameras\n\nIn Chapter 3, we added a button in the user interface\
    \ to jump to any instance. But we still land at the same angle and distance for\
    \ every instance we choose, and returning to a great composition of different\
    \ models on a map is close to impossible. You may write down the camera values\
    \ or take a screenshot, but that is far from perfect.\n\nBeing able to add a virtually\
    \ unlimited number of cameras to our scene allows us to create stunning map and\
    \ model combinations and return to that view whenever we want. By adding different\
    \ camera types, we can even go several steps further – a camera chasing one instance\
    \ in the third person; another camera presenting the entire map in an isometric\
    \ view; and yet another camera to see the virtual world through the virtual eyes\
    \ of an instance – all reachable by pressing a hotkey or selecting a menu.\n\n\
    All those points will be implemented at the end of the chapter. So, let’s start\
    \ with the first step, and add multiple camera objects to the application.\n\n\
    # From a single camera to an array of cameras\n\nRight now, we have only a single\
    \ camera in the application, defined in the Camera class in the tools folder.\
    \ This camera provides a free view of the virtual world. We can move in all three\
    \ axes and rotate around two of the three axes. Rotating the view around the axis\
    \ pointing into the screen (roll) is less useful at this point for the model and\
    \ animation viewer application since we would just see the effect of tilting our\
    \ head to the side. In addition, navigating a camera in three dimensions without\
    \ a fixed reference like the horizon could be quite difficult. So, we only implement\
    \ up and down (Elevation) and rotation around the vertical axis (Azimuth). Upgrading\
    \ the camera rotation and adding mouse or keyboard controls for a rotation around\
    \ the third axis is left as an exercise for you.\n\nThe values for the camera\
    \ position and the two rotation angles are stored in the OGLRenderData struct\
    \ for OpenGL and in the VkRenderData struct for Vulkan:\n\n```\nfloat rdViewAzimuth\
    \ = 330.0f;\nfloat rdViewElevation = -20.0f;\nglm::vec3 rdCameraWorldPosition\
    \ =\n    glm::vec3(2.0f, 5.0f, 7.0f);\n```"
  merge: -1
  img_proc: true
- pgno: 185
  md: "To support multiple cameras, we need a simple std::vector of the Camera class\
    \ elements and an int value, stating which of the cameras is currently selected.\
    \ Since these settings are closer to the models and model instances than the rendering,\
    \ we will store the new camera vector in the ModelAndInstanceData struct. To match\
    \ the new contents, we will rename the ModelAndInstanceData struct to ModelInstanceCamData:\n\
    \n```\nstruct ModelInstanceCamData {\n    ...\n    std::vector<std::shared_ptr<Camera>>\
    \ micCameras{};\n    int micSelectedCamera = 0;\n    ...\n}\n```\n\nBy using the\
    \ refactoring function of your IDE, renaming the ModelAndInstanceData struct,\
    \ along with the variables in classes and functions, is only a matter of some\
    \ mouse clicks and a text edit.\n\nIn addition to the new struct name, we will\
    \ also rename the file from ModelAndInstanceData.h to ModelInstanceCamData.h and\
    \ move the file from the model folder to the opengl folder (the vulkan folder\
    \ for Vulkan). In the end, it is a matter of personal preference where to store\
    \ the header file, but using a central location as the folder containing the renderer\
    \ makes a lot of sense since we access the struct mostly from the renderer.\n\n\
    In the UserInterface class, we add a combo box containing the names of the available\
    \ cameras inside the definition of ImGui::CollapsingHeader named Cameras. The\
    \ code for the combo box can be taken and adjusted from the model or animation\
    \ clip selection.\n\n# Extracting the camera settings\n\nSimilar to the instance\
    \ settings, we will extract the main camera settings to a separate struct called\
    \ CameraSettings. A separate struct containing the camera variables makes it easier\
    \ to read out or to apply all camera-related settings at once, instead of accessing\
    \ all settings by setters and getters.\n\nThe CameraSettings struct resides in\
    \ a header file, CameraSettings.h, residing in the tools folder:\n\n```\nstruct\
    \ CameraSettings{\n    std::string csCamName = \"Camera\";\n    glm::vec3 csWorldPosition\
    \ = glm::vec3(0.0f);\n    float csViewAzimuth = 0.0f;\n    float csViewElevation\
    \ = 0.0f\n};\n```"
  merge: -1
  img_proc: true
- pgno: 186
  md: 'Next to a name for the camera, we start with the world position and the two
    view angles of the camera: Azimuth and elevation.


    In the Camera class, the new CameraSettings.h header must be included, and a new
    private member variable called mCamSettings will be added. The three old variables
    containing position, azimuth, and elevation can be removed. All methods accessing
    the three variables for position and the view angles must be changed to store
    and retrieve the values inside the new mCamSettings variable.


    We have to add a getter and a setter method for the new CameraSettings. The getter
    and setter will allow us to handle the cameras like the model instances, manipulating
    the camera settings by simple variable assignments.


    # **Adjusting the renderer**


    As the renderer needs to update the position and view of the camera, we also need
    to upgrade some methods to use the selected camera.


    The first step is always to get a pointer to the current camera and read the CameraSettings
    for easier access and changes:


    ```

    ```

    std::shared_ptr<Camera> cam =

    mModelInstCamData.micCameras.at(

    mModelInstCamData.micSelectedCamera);

    CameraSettings camSettings = cam->getCameraSettings();

    ```

    ```


    If we changed any values, we must store the settings back to the camera:


    ```

    ```

    cam->setCameraSettings(camSettings);

    ```

    ```


    Then, in the handleMousePositionEvents() method, we change all variables from
    the old mRenderData variable, as highlighted in the following code:


    ```

    ```

    mRenderData.rdViewAzimuth += mouseMoveRelX / 10.0f;

    ```

    ```


    The new camSettings variable, containing the new camera settings, looks like this:


    ```

    ```

    camSettings.csViewAzimuth += mouseMoveRelX / 10.0f;

    ```

    ```


    A similar change needs to be made in the draw() method of the renderer.'
