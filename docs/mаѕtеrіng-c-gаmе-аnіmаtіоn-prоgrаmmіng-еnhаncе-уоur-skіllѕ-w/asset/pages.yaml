- pgno: 272
  md: '# Creating the AABB lookup tables


    The general idea of the AABB lookup tables is to precalculate the AABB for a fixed
    number of frames of every animation clip for every model. Having the bounding
    boxes in a lookup table allows us to retrieve a good approximation of the model’s
    AABB in a frame of an animation clip.


    By blending between AABB coordinates of the same frame number in two different
    clips plus transforming the final AABB according to the model’s transformations,
    we can calculate a well-fitting AABB for the instance at low computing costs,
    even if the instance is in the middle of an animation blending.


    Creating the lookup table is a mix of a compute shader and CPU work, done in the
    createAABBlookup() method of the renderer. The lookup table is generated in the
    renderer class for two reasons:


    +   - The main method to load the models is placed in the renderer, and we also
    expose the model loading method to the user interface via callback.

    +   - The renderer already has the compute shaders loaded. We can use the shaders
    directly, instead of using another set of the same shaders in the AssimpModel
    class.


    For the compute shader part, we can reuse the code from the instance loop of the
    draw() call of the renderer we made back in Chapter 2.


    To find the maximum extents of the model, we will use the nodes. To calculate
    the nodes per instance, the two compute shaders assimp_instance_transform.comp
    and assimp_instance_matrix_mult.comp can be used. In the translation part of the
    calculated matrices containing translation, rotation, and scale of the node, the
    location of each node is stored. The only difference here is the node offset matrices.


    While these offset matrices are required for vertex skinning, they would give
    the wrong results for node positions. We can remove the offset matrices in the
    calculations by binding an SSBO full of identity matrices, giving us only the
    node’s TRS matrices.


    By extracting the node positions per instance and creating a per-node AABB from
    the positions, we have an easy way to calculate the data we need for the quadtree
    and the debug display. For the 2D bounding box, we simply extract the x and z
    elements of the AABB, generating a “top-down” view of the AABB.'
  merge: -1
  img_proc: true
- pgno: 273
  md: 'The AABB calculations are done per animation clip and per node of the model.
    The resulting std::vector will be stored in the AssimpModel data of the model
    we just loaded. To retrieve the correct AABB data for a time position in an animation
    clip, we use the same logic we already have for generating the vertex skinning
    matrices and take the scaled time position as an index into the lookup data. If
    we blend between two animations, we can even blend between the AABBs of the two
    animations.


    # Using the AABB in the model and renderer


    When iterating over the instances in the draw() call of the renderer, we can now
    retrieve the AABB data for the animation clip and time position by calling getAABB():


    ```

    AABB instanceAABB = model->getAABB(instSettings);

    ```


    Inside getAABB(), the data from animation and instance translation, rotation,
    and scale are used to create an AABB fitting the instance. In detail, getAABB()
    will:


    +   - Look up the AABBs of the first and second animation clip

    +   - Blend between the two AABBs according to the animation blend factor

    +   - Scale the resulting AABB by the instance scale factor

    +   - Rotate the AABB in case the axis swap of the model is activated

    +   - Rotate the AABB according to the instance rotation (which is an OBB now)

    +   - Generate a new AABB from the rotated ABB

    +   - Translate the AABB to the instance position


    At this point, the AABB encloses the instance.


    Since blending and rotations are still expensive operations that may harm performance
    in scenes with many instances, a speed-up can be achieved by parallelizing the
    computations with SIMD operations of modern processors, like SSE or AVX. But even
    keeping the AABB lookup data on the GPU may be beneficial. Calculating the bounding
    boxes of all instances with a compute shader and downloading the results could
    be still faster than pure CPU calculation, despite the additional download of
    the results.


    To achieve the best possible performance, you might want to implement different
    versions of the getAABB() method and profile the application with various scene
    sizes and complexities.'
  merge: -1
  img_proc: true
- pgno: 274
  md: 'After the AABB is adjusted for the instance, we calculate the position and
    size of the two-dimensional bounding box for the quadtree:


    ```

    glm::vec2 position =

    glm::vec2(instanceAABB.getMinPos().x,

    instanceAABB.getMinPos().z);

    glm::vec2 size =

    glm::vec2(std::fabs(instanceAABB.getMaxPos().x -

    instanceAABB.getMinPos().x),

    std::fabs(instanceAABB.getMaxPos().z -

    instanceAABB.getMinPos().z));

    ```


    Now, we have all the data to insert the instance into the quadtree:


    ```

    BoundingBox2D box{position, size};

    instances.at(i)->setBoundingBox(box);

    mQuadtree->add(instSettings.isInstanceIndexPosition);

    ```


    To make sure we create a working quadtree, we will add a new ImGui window containing
    the quadtree, including all subdivisions and instances. Seeing the quadtree in
    action helps a lot to find any implementation bugs.


    # Creating a window to show the quadtree plus contents


    For the ImGui window, we create a new method called createPositionsWindow() in
    the UserInterface class. Inside this method, we create a new window by using ImGui::Begin().


    Next, we retrieve the world boundaries to have the origin, size, and center point
    to draw.


    Then, we iterate over all instances, using the position and size of the bounding
    box to draw ImGui rectangles at the 2D world positions of the instances. We also
    use the pairs of the micInstanceCollisions variable to draw non-colliding and
    colliding instances in different colors.


    Finally, we retrieve the bounding boxes of the quadtree and all the subdivisions.
    To get the bounding boxes of all levels of the quadtree, we add a pair of public
    and private methods to the Quadtree class called getTreeBoxes(). The getTreeBoxes()
    method recursively iterates over the quadtree nodes and child nodes, storing the
    bounding boxes in a std::vector of BoundingBox2D elements. We draw all quadtree
    boxes by using white lines.'
