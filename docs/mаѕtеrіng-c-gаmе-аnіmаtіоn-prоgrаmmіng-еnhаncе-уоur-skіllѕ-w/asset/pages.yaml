- pgno: 109
  md: '# 3


    # Adding a Visual Selection


    Welcome to Chapter 3! In the previous chapter, we offloaded the majority of matrix
    and vector calculations to the GPU. A modern graphics card has more (and also
    more specialized) computing cores than a desktop CPU, so, moving the compute load
    to the GPU will free the main CPU from most of the animation work.


    In this chapter, we will add a couple of simplifications when working with a lot
    of model instances. After the changes in the previous chapter, we are able to
    display thousands of model instances on the screen, but selecting a specific instance
    is still hard. We will start by adding coordinate arrows to identify the currently
    selected instance. Next, we will add a function that allows us to center the specified
    instance in the middle of the screen. Then, a graphical highlight will be created,
    further helping us to find the selected instance among all instances. As the last
    step, we will add a model without triangles, and an instance from this empty model,
    allowing us to deselect the visible instances.


    In this chapter, we will cover the following topics:


    +   - Implementing a “move to instance” function

    +   - Adding a highlight to the selected instance

    +   - Selecting a model instance with point and click

    +   - Implementing a null object to allow deselection


    At first glance, these topics may look unrelated to animation programming. But
    proper tooling is an essential part of creating a user-friendly application. Good
    tools will help the user to simplify application handling.'
  merge: -1
  img_proc: true
- pgno: 110
  md: "Later in the book, when you have created dozens or even hundreds of instances\
    \ that are happily jumping and running around randomly on the screen, selecting\
    \ one instance by simply clicking on it with the mouse, using a UI button to center\
    \ the instance on the screen, or moving and rotating the instance by using the\
    \ mouse will make your life a lot easier. And you might even forget how cumbersome\
    \ the first two chapters were when it came to selecting an instance or changing\
    \ instance properties.\n\n# Technical requirements\n\nWe will need the application\
    \ code from Chapter 2: https://github.com/PacktPublishing/Mastering-Cpp-Game-Animation-Programming.\n\
    \nThe example source code for this chapter can be found in the folder chapter03,\
    \ subfolder 01_opengl_selection for OpenGL, and 02_vulkan_selection for Vulkan.\n\
    \n# Implementing a “move to instance” function\n\nAs the first change for the\
    \ “move to instance” functionality, we will add a small set of coordinate arrows\
    \ appearing at the origin of the drawn model to identify the currently selected\
    \ instance. We will also add a button to center the currently selected instance.\
    \ Let’s start with the implementation of the coordinate arrows.\n\n# Adding coordinate\
    \ arrows\n\nSince we will use lines instead of triangles to draw coordinate arrows\
    \ at the center of the selected instance, we need some extra data structures,\
    \ objects and shaders. To store the vertex and color data, we add two new structs\
    \ to the declarations in the file OGLRenderData.h in the opengl folder:\n\n```\n\
    struct OGLLineVertex {\n\tglm::vec3 position = glm::vec3(0.0f);\n\tglm::vec3 color\
    \ = glm::vec3(0.0f);\n};\n\nstruct OGLLineMesh {\n\tstd::vector<OGLLineVertex>\
    \ vertices{};\n};\n```\n\nFor Vulkan, the new structs are named VkLineVertex and\
    \ VkLineMesh, residing in the file VkRenderData.h in the vulkan folder."
