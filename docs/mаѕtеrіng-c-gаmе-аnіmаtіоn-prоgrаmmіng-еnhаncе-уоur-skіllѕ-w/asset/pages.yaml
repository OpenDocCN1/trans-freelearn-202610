- pgno: 86
  md: "In the assimp_skinning.vert vertex shader in the shader folder, the bone matrices\
    \ are visible as the readonly buffer:\n\n```\nlayout (std430, binding = 1) readonly\
    \ buffer BoneMatrices {\n    mat4 boneMat[];\n};\n```\n\n+   6. We use the values\
    \ from the bone number of every vertex as an index into the bone matrices SSBO\
    \ to calculate the final vertex skinning matrix named skinMat:\n\n```\nmat4 skinMat\
    \ =\n    aBoneWeight.x * boneMat[int(aBoneNum.x) +\n    gl_InstanceID * aModelStride]\
    \ +\n    aBoneWeight.y * boneMat[int(aBoneNum.y) +\n    gl_InstanceID * aModelStride]\
    \ +\n    aBoneWeight.z * boneMat[int(aBoneNum.z) +\n    gl_InstanceID * aModelStride]\
    \ +\n    aBoneWeight.w * boneMat[int(aBoneNum.w) +\n    gl_InstanceID * aModelStride];\n\
    ```\n\n+   7. As the last step, we use the skinMat matrix to move the vertex to\
    \ the correct position for the specific animation frame:\n\n```\ngl_Position =\
    \ projection * view * skinMat *\nvec4(aPos, 1.0);\n```\n\nAs you can see, there\
    \ are a lot of calculations needed for every single frame of the animation we\
    \ render. Let’s transfer the computational load to the graphics card.\n\n# Adjusting\
    \ the data model\n\nTo move the calculations to the GPU, we create a new struct\
    \ called NodeTransformData in the file OGLRenderData.h in the opengl folder:\n\
    \n```\nstruct NodeTransformData {\n    glm::vec4 translation = glm::vec4(0.0f);\n\
    \    glm::vec4 scale = glm::vec4(1.0f);\n    glm::vec4 rotation = glm::vec4(1.0f,\
    \ 0.0f, 0.0f, 0.0f);\n}\n```\n\nFor the Vulkan renderer, the struct needs to be\
    \ created in the file VkRenderData.h in the vulkan folder."
