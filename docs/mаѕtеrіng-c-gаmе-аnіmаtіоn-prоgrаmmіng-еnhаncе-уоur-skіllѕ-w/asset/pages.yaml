- pgno: 478
  md: "audible side and discuss methods and tools to add sound effects and music to\
    \ the application. Then, we will check out ideas to fill the world with more life,\
    \ followed by a discussion about ideas to enhance the visuals in the virtual world.\
    \ We will look at quests and interactions between instances and, finally, explore\
    \ the impact of daytime and weather changes.\n\n# Practical sessions\n\n+   Here\
    \ are some additions you could make to the code:\n+   \n+   • Smooth the path\
    \ even with large ground triangles.\n+   \n+   By looking up the next couple of\
    \ path segments, it may be possible to create an average of the segments. For\
    \ sharper turns, the transitions between the triangles could be smoothed by using\
    \ splines.\n+   \n+   • Clean up the generated triangle neighbor list.\n+   \n\
    +   Right now, the list of adjacent triangles is quite large. This fact can be\
    \ seen when the neighbor mesh debug drawing for a level is activated. Try to find\
    \ a solution to include only triangles sharing parts of an edge.\n+   \n+   •\
    \ Add a minimum distance between walls and path lines.\n+   \n+   For the generated\
    \ ground triangles, some of the center positions may be so close to a wall that\
    \ the instance will collide when following the path. In some cases, the paths\
    \ even go through edges of level geometry when the triangles are seen as adjacent.\
    \ When creating the ground triangles, try to find the outlines of the mesh and\
    \ reduce the size by a configurable amount.\n+   \n+   • Use the instance AABB\
    \ to detect narrow passages.\n+   \n+   Some maps may have passages where the\
    \ navigation needs to be exact. In the absence of a real navigation mesh, you\
    \ could try to use the bounding box of the instance along the path to find possible\
    \ collisions and adjust the path to avoid a collision with the level structures.\n\
    +   \n+   • Advanced difficulty: Create a navigation mesh in an editor and load\
    \ that mesh.\n+   \n+   If you are confident working with a tool like Blender,\
    \ you could try to create a navigation mesh as a separate mesh of a level, or\
    \ even as a separate file, saved next to the level file. Then, load the navigation\
    \ mesh into the PathFinder class to have a collision-free ground for the instances."
