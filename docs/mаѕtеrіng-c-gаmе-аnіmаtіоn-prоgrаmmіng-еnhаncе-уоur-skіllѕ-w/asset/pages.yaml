- pgno: 205
  md: "```\n(camSettings.csCamType == cameraType::firstPerson &&\n camSettings.csFirstPersonLockView))\
    \ &&\n camSettings.csInstanceToFollow.lock() {\n ...\n```\n\nThis complex condition\
    \ can be broken down into the following rules: Only allow locking the mouse and\
    \ moving the camera manually if:\n\n+   - The camera type is not first-person\
    \ or third-person.\n+   - For a first-person camera, the view is unlocked.\n+\
    \   - For both camera types, a target instance to follow is set.\n\nThis means\
    \ the camera can be freely moved on a free camera type, as long as no instance\
    \ has been set as a target in first- and third-person, and the view of a first-person\
    \ camera is not set to locked.\n\nThe condition line may look a bit scary, but\
    \ creating the same conditions with opposite logic elements to avoid the initial\
    \ exclamation mark negation creates a Boolean expression of similar complexity.\
    \ So, we could happily stick with this expression.\n\nSince we haven’t implemented\
    \ the roll rotation, a rotation around the axis pointing toward the screen, the\
    \ two new cameras may behave unexpectedly.\n\n# Limits of current first-/third-person\
    \ cameras\n\nIf you rotate the currently locked instance about the X and/or Z\
    \ axes on a first-person camera, the view will be rotated around wildly, only\
    \ following the position of the selected bone and not the rotation. This behavior\
    \ could be fixed by adding the third rotation to the camera and doing a roll around\
    \ the axis pointing into the screen. After adding the sixth degree of freedom,\
    \ all calculations have to be adjusted to include the new angle.\n\nAlso, the\
    \ third-person camera may be placed incorrectly on models that are rotated in\
    \ a different angle, or models that may need to have the Z and Y axes swapped.\n\
    \nAlthough adding the last rotation is possible, the use inside the application\
    \ is limited to cases like the first-person view, since you can get the same results\
    \ by reversing the roll rotation and rotating the map instead of the model. For\
    \ the wrong rotated third-person models, additional fixed rotation checkboxes\
    \ would be needed, or more offset rotations."
  merge: -1
