- pgno: 228
  md: "And we declare the two buffer bindings using the same binding points as in\
    \ the renderer code:\n\n```\nlayout (std430, binding = 0) readonly restrict\n\
    buffer AnimLookup {\n\tvec4 lookupData[];\n};\nlayout (std430, binding = 1) readonly\
    \ restrict\nbuffer InstanceAnimData {\n\tPerInstanceAnimData instAnimData[];\n\
    };\n```\n\nIn the main() method of the compute shader, we define the same lookup\
    \ table size and offset calculation as in the AssimpModel class:\n\n```\nint lookupWidth\
    \ = 1023 + 1;\nuint node = gl_GlobalInvocationID.x;\nuint instance = gl_GlobalInvocationID.y;\n\
    uint numberOfBones = gl_NumWorkGroups.x;\nuint boneOffset = lookupWidth * 3;\n\
    uint clipOffset = numberOfBones * boneOffset;\n```\n\nWe can now access all the\
    \ animation settings for each instance by using the instance variable as the index\
    \ in the InstanceAnimData SSBO:\n\n```\nuint firstClip = instAnimData[instance].firstAnimClipNum;\n\
    uint secondClip = instAnimData[instance].secondAnimClipNum;\nfloat blendFactor\
    \ = instAnimData[instance].blendFactor;\n```\n\nFor instance, to get the mTranslateTimeScaleFactor\
    \ value for the translation data, we must use the same formula as in C++ to access\
    \ the first element of the translation lookup data for the clip:\n\n```\nfloat\
    \ firstTransInvScaleFactor = lookupData[firstClip * clipOffset + node * boneOffset].x;\n\
    ```\n\nEven slight differences between C++ and shader formulae or data types could\
    \ lead to discrepancies in the transferred data, so we need to be strict here\
    \ to do exactly the same operations and use the same data types."
  merge: -1
  img_proc: true
- pgno: 229
  md: "Then, we use the inverse time scale factor to calculate the correctly scaled\
    \ index in the translation lookup data:\n\n```\nint firstTransLookupIndex =\n\
    \    int(instAnimData[instance].firstClipReplayTimestamp *\n    transInvScaleFactor)\
    \ + 1;\n```\n\nThe per-node translation data for the first and second animation\
    \ clip can also be calculated as in C++:\n\n```\nvec4 firstTranslation = lookupData[firstClip\
    \ *\n    clipOffset + node * boneOffset +\n    firstTransLookupIndex];\n...\n\
    vec4 secondTranslation = lookupData[secondClip *\n    clipOffset + node * boneOffset\
    \ +\n    secondTransLookupIndex];\n```\n\nNow we can interpolate between the two\
    \ animation clip translations:\n\n```\nvec4 finalTranslation = mix(firstTranslation,\n\
    \    secondTranslation, blendFactor);\n```\n\nWe do the same lookup and interpolation\
    \ for the scaling values. For rotation, the same code as the GLM implementation\
    \ for SLERP is used.\n\nFinally, the product of all three transformation matrices\
    \ is stored in the SSBO containing the resulting TRS matrices of all instances:\n\
    \n```\nuint index = node + numberOfBones * instance;\ntrsMat[index] =\n    createTranslationMatrix(finalTranslation)\
    \ *\n    createRotationMatrix(finalRotation) *\n    createScaleMatrix(finalScale);\n\
    ```\n\nAt this point, the mShaderTRSMatrixBuffer SSBO in the renderer contains\
    \ the same data as we had with the CPU-based transformation calculations."
  merge: -1
  img_proc: true
- pgno: 230
  md: "But all we need to upload to the compute shader is the data of the animations\
    \ we want to draw. So, the transformation calculation in the updateAnimation()\
    \ method of the AssimpInstance class can be removed, leaving the following three\
    \ lines to be executed when we update the animation of the instance:\n\n```\n\
    mInstanceSettings.isFirstClipAnimPlayTimePos +=\n    deltaTime *\n    mInstanceSettings.isAnimSpeedFactor\
    \ * 1000.0f;\nmInstanceSettings.isAnimPlayTimePos =\n    std::fmod(mInstanceSettings.isFirstClipAnimPlayTimePos,\n\
    \    mAssimpMode->getMaxClipDuration());\nmModelRootMatrix = mLocalTransformMatrix\
    \ *\n    mAssimpModel->getRootTranformationMatrix();\n```\n\nWe simply advance\
    \ the clip time by the delta time and update the instance root matrix.\n\nIf you\
    \ compile and run the code now, the only visible difference is a much lower matrix\
    \ generation time when the number of instances goes up. For a recent computer\
    \ model, reaching 10,000 or even 20,000 animated instances of the basic model\
    \ should be no problem. We don’t need so many instances in the virtual world,\
    \ but the lower CPU usage for animations and animation blending gives us more\
    \ freedom to implement more features in the remaining chapters of the book.\n\n\
    Now that we have a fast and easy-to-use animation calculation, we can implement\
    \ a state-based system to organize the behavior of each instance. By defining\
    \ different states, like a movement direction or an action the instance will do,\
    \ we create the first steps on the path to an animation system where we can control\
    \ the instance as we would do in a simple game.\n\nSo, let’s continue by adding\
    \ new instance states.\n\n# Adding new states to the code\n\nOur future game character\
    \ should be able to perform typical actions for a character in a game: wait idle\
    \ for player input, walk in all four main directions, run forward, plus a bunch\
    \ of other actions. Depending on the available animations, we could add a state\
    \ for jumping or rolling, punching, or waving.\n\nFor maximum flexibility, we\
    \ will allow characters of all models to perform all the configured actions. Then\
    \ we can use the UI to map an animation clip to each action we want to use for\
    \ a specific model. Without a mapped animation clip, the requested action will\
    \ be simply ignored."
  merge: -1
  img_proc: true
- pgno: 231
  md: "# Using bit fields and plain enums\n\nWe will add two different enum class\
    \ definitions to the Enums.h file. The first enum called moveDirection is a bit\
    \ field:\n\n```\nenum class moveDirection : uint8_t {\n    none = 0x00,\n    forward\
    \ = 0x01,\n    back = 0x02,\n    right = 0x04,\n    left = 0x08,\n    any = 0xff\n\
    };\n```\n\nFor every direction, a different bit can be set in a variable. A bit\
    \ field is needed when multiple values can appear at the same time. In our case,\
    \ it would be normal to have the character running forward and to the left at\
    \ the same time.\n\nThe two additional enum values, none and any, are special\
    \ placeholders. If the character is just idling, forcing a direction for the idle\
    \ state would be strange since the character cannot “idle forward” or “idle to\
    \ the left.” So, the separate enum value none for not moving at all will help\
    \ us to keep the code a bit simpler. The value any can be used as a wildcard or\
    \ fallback for walking states. For example, we could set a generic walk animation\
    \ for all directions, and instead of configuring all four directions with identical\
    \ animation clips, we use the any direction to use this one clip for all walk\
    \ movements.\n\nTo be able to work with the values of the moveDirection enum in\
    \ a real bit field manner, we have to define the bitwise Boolean operators OR\
    \ and AND for the new data type. The declaration is short and simple, as the following\
    \ code for the logical AND operator between two movement directions shows:\n\n\
    ```\ninline moveDirection operator | (moveDirection lhs,\n    moveDirection rhs)\
    \ {\n    using T = std::underlying_type_t <moveDirection>;\n    return static_cast<moveDirection>(static_cast<T>(lhs)\
    \ |\n        static_cast<T>(rhs));\n}\n```"
  merge: -1
  img_proc: true
- pgno: 232
  md: "A second enum class named moveState takes care of the possible character actions:\n\
    \n```\nenum class moveState {\n    idle = 0,\n    walk,\n    run,\n    hop,\n\
    \    jump,\n    ...\n    wave,\n    NUM\n};\n```\n\nHere, no bit field is needed.\
    \ We may be able to run and jump at the same time and will handle these cases\
    \ in the code. But most of the actions cannot be executed at the same time.\n\n\
    We simply list all possible movement states in the moveState enum class. The final\
    \ value, NUM, can be utilized to iterate over all the enum values in a for loop,\
    \ i.e., starting from the first action with the value zero (idle) and ending at\
    \ the last valid action wave.\n\nHaving not just numbers for movement directions\
    \ and state will become handy in the UI and for debug messages, so we add two\
    \ new maps from the enum class values to strings in the ModelInstanceCamData struct\
    \ in the ModelInstanceCamData.h file:\n\n```\nstd::unordered_map<moveDirection,\
    \ std::string>\n    micMoveDirectionMap{};\nstd::unordered_map<moveState, std::string>\n\
    \    micMoveStateMap{};\n```\n\nWe will fill the two state maps in the init()\
    \ method of the renderer with appropriate string values. Next, we must extend\
    \ the settings structs for instances and models.\n\n# Extending model and instance\
    \ settings\n\nThe special handling of the idle, walk, and run animation clips\
    \ requires a new struct called IdleWalkRunBlending in a new ModelSettings.h file\
    \ in the model folder:\n\n```\nstruct IdleWalkRunBlending {\n    int iwrblIdleClipNr\
    \ = 0;\n    float iwrblIdleClipSpeed = 1.0f;\n    int iwrblWalkClipNr = 0;\n```"
  merge: -1
  img_proc: true
- pgno: 233
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 234
  md: "We also store the values for the speed and acceleration of the instance:\n\n\
    ```\nglm::vec3 isAccel = glm::vec3(0.0f);\nglm::vec3 isSpeed = glm::vec3(0.0f);\n\
    ```\n\nThe speed of the specific instance will be used to select the correct idle,\
    \ walk, or run animation clip. By using an acceleration-based movement, we achieve\
    \ a more natural appearance of the character instances. In real life, we also\
    \ accelerate and decelerate while moving, instead of jumping directly from idle\
    \ to run speed.\n\n# Adding the idle/walk/run logic\n\nThe blending logic for\
    \ idle/walk/run animation clips is defined in the method called playIdleWalkRunAnimation()\
    \ in the AssimpInstance class.\n\nAfter a sanity check for the model of the instance,\
    \ we calculate the absolute speed of the instance, read the model settings containing\
    \ a map with the blending settings, and create a new, empty variable blend of\
    \ type IdleWalkRunBlending:\n\n```\nfloat instanceSpeed =\n    glm::length(mInstanceSettings.isSpeed);\n\
    ModelSettings modSettings =\n    mAssimpMode->getModelSettings();\nIdleWalkRunBlending\
    \ blend;\n```\n\nNext, we check whether we have configured direction-specific\
    \ animation clips:\n\n```\nif (modSettings.msIWRBlendings.count(\n    mInstanceSettings.isMoveDirection)\
    \ > 0) {\n    blend = modSettings.msIWRBlendings[\n        mInstanceSettings.isMoveDirection];\n\
    } else if (modSettings.msIWRBlendings.count(\n    moveDirection::any) > 0) {\n\
    \    blend = modSettings.msIWRBlendings[moveDirection::any];\n} else if (modSettings.msIWRBlendings.count(\n\
    \    moveDirection::none) > 0) {\n    blend = modSettings.msIWRBlendings[moveDirection::none];\n\
    } else {\n    return;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 235
  md: "If such a direction clip is found, the blend variable is filled with the appropriate\
    \ settings. If no direction-specific clip was found, we check for the special\
    \ any and none directions too, trying to use a generic animation for all directions.\
    \ And if we don’t find the generic animation clips, we return from the method.\
    \ Without a configured clip for idle/walk/run, it makes no sense to play any animation.\n\
    \nControlling whether to blend between idle and walk or between walk and run animations\
    \ is done by using the instanceSpeed variable:\n\n```\nif (instanceSpeed <= 1.0f)\
    \ {\n    mInstanceSettings.isFirstAnimClipNr =\n        blend.iwrbIdleClipNr;\n\
    \    mInstanceSettings.isSecondAnimClipNr =\n        blend.iwrbWalkClipNr;\n \
    \   mInstanceSettings.isAnimSpeedFactor = glm::mix(\n        blend.iwrbIdleClipSpeed,\n\
    \        blend.iwrbWalkClipSpeed, instanceSpeed);\n    mInstanceSettings.isAnimBlendFactor\
    \ = instanceSpeed;\n} else {\n```\n\nHere, we scale speed factors and blend between\
    \ the idle and walk animations based on the instanceSpeed value. By using a value\
    \ of 0.0f for idle and 1.0f (inclusive) for full walk speed, the animation will\
    \ be blended smoothly between the instance standing still and walking around.\n\
    \nTo blend the instance animations from walking to running, we use an instanceSpeed\
    \ range between 1.0f (exclusive) and 2.0f. The logic stays the same; we must only\
    \ subtract 1.0f from the speed factor and the blending for the linear interpolation\
    \ between the walk and run clips:\n\n```\nmInstanceSettings.isFirstAnimClipNr\
    \ =\n    blend.iwrbWalkClipNr;\nmInstanceSettings.isSecondAnimClipNr =\n    blend.iwrbRunClipNr;\n\
    mInstanceSettings.isAnimSpeedFactor = glm::mix(\n    blend.iwrbWalkClipSpeed,\n\
    \    blend.iwrbRunClipSpeed, instanceSpeed - 1.0f);\nmInstanceSettings.isAnimBlendFactor\
    \ =\n    instanceSpeed - 1.0f;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 236
  md: "The instanceSpeed values of 1.0f for walk speed and 2.0f for run speed were\
    \ chosen because they work best for linear interpolation between the clips. Any\
    \ other ranges are possible; you just must adjust the scaling for the animation\
    \ blending accordingly.\n\n# # Using acceleration and deceleration\n\nAs our instances\
    \ should move in the virtual world, we need to control the speed of the instance\
    \ we control. But instead of using the speed directly, we will go for an acceleration-based\
    \ speed model. Using a separate acceleration value to speed up or slow down the\
    \ instance gives more natural results. Like real physical bodies, our model instances\
    \ in the virtual world have their inertia working against speed changes.\n\nFirst,\
    \ the AssimpInstance class needs three new private float variables named MAX_ACCEL,\
    \ MAX_ABS_SPEED, and MIN_STOP_SPEED:\n\n```\nconst float MAX_ACCEL = 4.0f;\nconst\
    \ float MAX_ABS_SPEED = 1.0f;\nconst float MIN_STOP_SPEED = 0.01f;\n```\n\nIn\
    \ MAX_ACCEL, we store the maximum acceleration our model can achieve, and MAX_ABS_SPEED\
    \ limits the speed of the instance. Acceleration and speed are three-component\
    \ vectors, and moving in different directions may add up to larger values. Limiting\
    \ both values helps to prevent instances from moving too fast in the virtual world.\n\
    \nAn acceleration-based model has a major drawback: stopping an instance can become\
    \ difficult. Since we only add and subtract the acceleration values from the speed,\
    \ reaching the exact value of zero is hard. To achieve a full stop, we define\
    \ a minimal speed in the MIN_STOP_SPEED variable. If the current speed of the\
    \ instance is lower than the value of MIN_STOP_SPEED, we set acceleration and\
    \ speed to zero, eventually stopping the instance.\n\nInstance acceleration is\
    \ controlled in the updateInstanceState() method of AssimpInstance class. Basically,\
    \ we check for a movement direction and set the corresponding x components of\
    \ isAccel:\n\n```\nif (state == moveState::walk || state == moveState::run) {\n\
    \tif ((dir & moveDirection::forward) == moveDirection::forward) {\n\t\tmInstanceSettings.isMoveKeyPressed\
    \ = true;\n\t\tmInstanceSettings.isAccel.x = 5.0f;\n\t}\n}\n```"
  merge: -1
  img_proc: true
- pgno: 237
  md: "```\n}\n...\n```\n\nIf a direction key is pressed, we set isMoveKeyPressed\
    \ to true and apply the acceleration.\n\nWhen we release all movement keys, the\
    \ deceleration of the instance kicks in. The slowdown logic happens in the updateInstanceSpeed()\
    \ method of the AssimpInstance class:\n\n```\nfloat currentSpeed =\n    glm::length(mInstanceSettings.isSpeed);\n\
    static float maxSpeed = MAX_ABS_SPEED;\n```\n\nWe also save the maximum speed\
    \ of the instance locally. Using a static variable helps to keep track of accelerating\
    \ and slowing down the instance between walk and run speed.\n\nFirst, we calculate\
    \ the length of the 3-component isSpeed vector. The resulting length is then used\
    \ to check whether we are still moving when no movement key is being pressed:\n\
    \n```\nif (!mInstanceSettings.isMoveKeyPressed) {\n    if (currentSpeed > 0.0f)\
    \ {\n        if (mInstanceSettings.isSpeed.x > 0.0f) {\n            mInstanceSettings.isAccel.x\
    \ = -2.5f;\n        }\n    ...\n```\n\nFor the possible move directions of the\
    \ instance, we check whether any speed is left and use an acceleration in the\
    \ opposite direction of the speed to slow down the instance.\n\nAnd if we are\
    \ slower than MIN_STOP_SPEED, we forcibly set speed and acceleration to zero,\
    \ movement state to idle, and move direction to none:\n\n```\nif (currentSpeed\
    \ < MIN_STOP_SPEED) {\n    currentSpeed = 0.0f;\n    mInstanceSettings.isAccel\
    \ = glm::vec3(0.0f);\n    mInstanceSettings.isSpeed = glm::vec3(0.0f);\n    mInstanceSettings.isMoveState\
    \ = moveState::idle;\n    mInstanceSettings.isMoveDirection =\n        moveDirection::none;\n\
    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 238
  md: "Limiting speed and acceleration to the maximum values is a two-step process.\
    \ If we exceed the maximum value, we normalize the vector:\n\n```\nfloat currentAccel\
    \ =\n    glm::length(mInstanceSettings.isAccel);\nif (currentAccel > MAX_ACCEL)\
    \ {\n    mInstanceSettings.isAccel =\n        glm::normalize(mInstanceSettings.isAccel);\n\
    ```\n\nNow the length of the isAccel vector equals 1.0f. Then, we scale the vector\
    \ to the maximum length:\n\n```\nmInstanceSettings.isAccel *= MAX_ACCEL;\n```\n\
    \nAfter the multiplication, all three components of isAccel are scaled down to\
    \ a resulting length of MAX_ACCEL.\n\nUpdating the instance speed is done by adding\
    \ the deltaTime fraction of the acceleration in isAccel to isSpeed:\n\n```\nmInstanceSettings.isSpeed\
    \ +=\n    mInstanceSettings.isAccel * deltaTime;\n```\n\nTo reach run speed, we\
    \ double the maxSpeed value:\n\n```\nif (mInstanceSettings.isMoveState == moveState::run)\
    \ {\n    maxSpeed = MAX_ABS_SPEED * 2.0f;\n}\n```\n\nIf we no longer run but are\
    \ over maxSpeed, we slow down to walk speed:\n\n```\nif (currentSpeed > maxSpeed)\
    \ {\n    if (mInstanceSettings.isMoveState != moveState::run) {\n        maxSpeed\
    \ -= \n            glm::length(mInstanceSettings.isAccel) * deltaTime;\n     \
    \   if (maxSpeed <= MAX_ABS_SPEED) {\n            maxSpeed = MAX_ABS_SPEED;\n\
    \        }\n    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 239
  md: 'The example code uses a simple linear interpolation to reach the desired instance
    speed. You might want to experiment with other techniques like ease-in/ease-out
    curves, or cubic curves to adjust the interpolation between different instance
    speeds.


    And if we are faster than maxSpeed while accelerating to walk or run speed, we
    limit the instance speed isSpeed to maxSpeed:


    ```

    mInstanceSettings.isSpeed =

    glm::normalize(mInstanceSettings.isSpeed);

    mInstanceSettings.isSpeed *= maxSpeed;

    ```


    At this point, the currently selected instance would move smoothly from the idle
    animation clip to the walk animation clip, and even get a speedup to the run animation
    clip if we switch to the run state. Sadly, we cannot see anything yet since there
    is no mapping between movement states, directions, and animation clips.


    So, let''s link the animation clips to existing states.


    # Linking states and animations


    We start with the connections between the three states (idle, walk, and run),
    and map the corresponding model animation clips to these three states. The IdleWalkRunBlending
    struct and the msIWBlending member variable in the ModelSettings struct are already
    in place, so we only have to take care of the UI.


    # Mapping idle/walk/run animations


    Figure 7.1 shows the mapping section of the Control window for the three states:
    idle, walk, and run:


    ![](img/3cfb9832c943f5f7366fd104b5255971_239_0.png)


    Figure 7.1: Mapping between move direction, move state, and animation clip'
