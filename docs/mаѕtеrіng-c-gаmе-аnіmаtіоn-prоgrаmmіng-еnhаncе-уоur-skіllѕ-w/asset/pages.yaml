- pgno: 398
  md: 'scaling slider for model and level data, but getting a reasonable ratio between
    levels, models, and other objects from various sources and artists can come challenging.


    To create a plausible virtual world, the sizes of the game character models must
    match the sizes of furniture, buildings, environmental objects, and so on. Even
    a small mismatch in the proportions of different objects will be visible when
    comparing game characters and objects with the real world. A good way to adjust
    the different elements is to use one fixed-size object with a known size, such
    as a block from Minecraft, which has (virtual) edge length of one meter, or even
    a simple line of a defined length in the virtual world. By resizing all objects
    to their real-world sizes compared to the known object, models from different
    sources can be made to match visually.


    # # Summary


    In this chapter, we added static level data to the virtual world. After exploring
    the differences between level maps and models, we looked at suitable file formats
    for level data and how to find cool game maps. Then, we added support for level
    data to the application and replaced the quadtree with an octree to support collision
    detection in three dimensions. Finally, we added the new level data and a level
    AABB to the renderer. We will extend the level data in the next two chapters to
    create a virtual world where the instances can roam around freely and by themselves.


    In the next chapter, we will continue the collision detection from Chapter 8.
    First, we will extend the existing code to support collisions between instances
    and the level geometry. To ensure the instances are always on the ground, we will
    introduce gravity in the virtual world. As the last step, we add inverse kinematics
    to the legs of the instances, allowing the model to climb stairs or slopes with
    natural motion.


    # # Practical sessions


    Here are some additions you could make to the code:


    +   • Add a door or a button to the level.


    Since the animated level data is more like an animated character model placed
    at a fixed position in the level than static level data, you could try to add
    doors, switches, or buttons to the level, and instead of waving back on interaction,
    the button could play a “pressed” animation, and a door could revolve around the
    hinge or slide to one side.'
