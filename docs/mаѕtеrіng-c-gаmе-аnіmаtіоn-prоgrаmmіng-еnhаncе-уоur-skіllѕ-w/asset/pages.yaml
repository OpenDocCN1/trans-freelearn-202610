  md: '# An Introduction to Collision Detection


    Resizing the spheres to the correct radius is done by a small GLSL function called
    createScaleMatrix() in the shader, essentially creating a scaling matrix with
    the radius value in the main diagonal elements:


    ```

    ```

    mat3 scaleMat = createScaleMatrix(radius);

    ```

    ```


    Then, we scale the original position of the sphere vertex by the scaling matrix,
    add the sphere adjustment, create the final shader matrix by multiplication with
    view and projection matrices, and set the line color:


    ```

    ```

    gl_Position = projection * view * vec4(scaleMat * aPos + boneCenter, 1.0);

    lineColor = vec4(aColor, 1.0);

    }

    ```

    ```


    Running the sphere shader is done by calling an instanced version of the Shader
    class drawing command:


    ```

    ```

    mLineVertexBuffer.uploadData(mSphereMesh);

    mSphereShader.use();

    mBoundingSphereBuffer.bind(1);

    mLineVertexBuffer.bindAndDrawInstanced(GL_LINES, 0, mSphereMesh.vertices.size(),
    numberOfSpheres);

    ```

    ```


    For the Vulkan renderer, the equivalent drawing calls are used (vkCmdBindPipeline(),
    vkCmdBindVertexBuffers(), vkCmdBindDescriptorSets(), and vkCmdDraw()).


    Since the bounding spheres for collision detection may not be identical to the
    bounding spheres we want to draw on the screen, we use separate methods for drawing
    debug spheres. The main difference between our debug draw methods is the creation
    of the list of instances to feed the compute shaders with.


    We could draw bounding spheres only on the selected instance by calling drawSelectedBoundingSpheres(),
    show the bounding boxes for instances with collisions by calling drawCollidingBoundingSpheres(),
    or create “fluffy white snowballs” around all instances in the screen, as in Figure
    8.16, by calling drawAllBoundingSpheres().'
