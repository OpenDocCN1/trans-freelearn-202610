- pgno: 284
  md: 'Then, for every set of instances, we create the SSBO with the bounding spheres
    and extract the sphere data to a map of glm::vec4 vectors. We will use the instance
    index position as the key for the map, splitting up the SSBO into a map containing
    all spheres per instance as values.


    The real collision check for the bounding spheres is done by comparing all spheres
    from one colliding instance with all spheres of the second colliding instance.
    We already reduced the number of these checks by a lot, since we only have the
    instance pairs left that were delivered by the quadtree.


    But even if checking the spheres for collisions is an easy task and we just have
    to compare the distance between the centers with the sum of the radii of both
    spheres, the number of comparisons will make this check slow.


    Even with a shortcut to remove all spheres with a radius of zero and stopping
    to compare when a collision has been detected, a check between two just-not-colliding
    instances with 30 active spheres per model will need 900 such comparisons.


    Speeding up the sphere compare operations with a compute shader is possible, but
    problems like different node counts for each instance in a pair to check will
    raise the complexity and lower the efficiency of a compute shader.


    While the parallel computation on the GPU may be fast, uploading and downloading
    the data and running the shader for a single pair of instances may add a significant
    delay, nullifying the acceleration of the compute shader.


    So, we stick with the CPU-based solution to calculate the second tier of the collisions
    between bounding boxes. Unless we have thousands of instances in a very small
    virtual world or many instances in a small part of the world, the overall number
    of collision checks will remain low.


    Figure 8.17 shows an example of a collision detected by the bounding boxes (drawn
    with red lines), and an additional collision of any of the bounding spheres (also
    in red):'
