- pgno: 173
  md: "```\nmYamlEmit << YAML::EndMap;\n}\n```\n\nThanks to the operator<< overload,\
    \ no complex handling inside the loop is required.\n\nAs the last step, we close\
    \ the sequence of instance settings, and close the map for the instances key:\n\
    \n```\nmYamlEmit << YAML::EndSeq;\nmYamlEmit << YAML::EndMap\n```\n\nThe final\
    \ YAML file will contain a sequence of all instances, including the newly added\
    \ model file name:\n\n```\ninstances:\n- model-file: Woman.gltf\n  position: [0,\
    \ 0, 0]\n  rotation: [0, 0, 0]\n  scale: 1\n  swap-axes: false\n  anim-clip-number:\
    \ 0\n  anim-clip-speed: 1\n```\n\nIf we want to view the contents of the created\
    \ configuration file before doing any disk writes, we can create a C string and\
    \ output the string via the logger class:\n\n```\nLogger::log(1, \"%s\\n\", mYamlEmit.c_str());\n\
    ```\n\nWriting the file to disk will be done with a std::ostream. The error handling\
    \ for the stream has been excluded for brevity in the following listing, but saving\
    \ the file to disk is essentially done in just three lines:\n\n```\nbool YamlParser::writeYamlFile(std::string\
    \ fileName) {\n    std::ofstream fileToWrite(fileName);\n    fileToWrite << mYamlEmit.c_str();\n\
    \    fileToWrite.close();\n    return true;\n}\n```\n\nFirst, we create the output\
    \ stream with the given file name. Then, we convert the std::string of the YAML::Emitter\
    \ to a C string and write the string to the output stream. By closing the stream,\
    \ the file will be flushed to the storage device."
