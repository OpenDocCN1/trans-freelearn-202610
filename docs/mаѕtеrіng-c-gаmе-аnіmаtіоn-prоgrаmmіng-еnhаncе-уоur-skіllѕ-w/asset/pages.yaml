- pgno: 401
  md: '# 12


    # Advanced Collision Detection


    Welcome to *Chapter 12*! In the previous chapter, we added the ability to load
    static level data to the virtual world. Now the instances no longer have to run
    in thin air; they can get a virtual home. First, we explored the differences between
    model and level data, which file formats are mostly used for level data, and where
    to find game maps on the internet. Then, we added code to load level data and
    replaced the two-dimensional quadtree with a three-dimensional octree. Finally,
    we implemented the level data rendering, including debug data for wireframe, octree,
    and level AABB lines.


    In this chapter, we will extend the level data from the previous chapter. First,
    we will add a specialized octree for the level data and update the code to also
    support collision detection between instances and level geometry. Then, we will
    add a simplified form of gravity to the virtual world to keep the instances at
    ground level instead of having them floating around. As the last step, we will
    introduce inverse kinematics for the instance legs to allow the instances to climb
    slopes and stairs with more natural leg motions and to prevent the feet from clipping
    into the ground or floating in the air.


    In this chapter, we will cover the following topics:


    +   - Enhancing collision detection for level data

    +   - Using gravity to keep the instances at floor level

    +   - Adding inverse kinematics'
  merge: -1
  img_proc: true
- pgno: 402
  md: "# Technical requirements\n\nThe example code for this chapter is available\
    \ in the chapter12 folder, in the 01_opengl_adv_collision subfolder for OpenGL,\
    \ and the 02_vulkan_adv_collision subfolder for Vulkan.\n\n# Enhancing collision\
    \ detection for level data\n\nTo speed up collision detection between instances\
    \ and level geometry, we will create spatial partitioning for the level data,\
    \ like the octree. But instead of adding the level triangles to the instance octree,\
    \ we build a specialized octree for the triangle data alone.\n\n# Adding a new\
    \ octree type\n\nUsing a separate data structure for level data makes more sense\
    \ than trying to mix both data types in the existing octree for several reasons:\n\
    \n+   - The level data is static while the instance positions change frequently.\
    \ We need to do costly updates to a quite heavily utilized octree on every instance\
    \ position change, possibly resulting in a lot of additional split and merge operations\
    \ when removing and re-adding the instances.\n+   - The number of subdivisions\
    \ for level data and instances may be completely different, depending on the level's\
    \ complexity and the number of instances. Having only a small number of instances\
    \ roaming around a detailed level may lead to a huge overhead when searching for\
    \ nearby triangles or instances.\n+   - We are using an octree for the level data\
    \ for simplicity, but other data structures, like BSP trees or **boundary volume\
    \ hierarchies (BVHs)**, are more common. Since BSP trees and BVHs cannot be dynamically\
    \ updated as quickly as our octree, a split between level data and instances would\
    \ still be necessary.\n\nWith two different octrees, we can overcome these mentioned\
    \ problems. The level data octree is kept unchanged after adding all the level\
    \ triangles, both octrees have their own subdivisions, depending on the amount\
    \ of data per octant, but we can still combine the information by using the instance\
    \ bounding boxes in the level octree.\n\nAs the first step for the level octree,\
    \ we add a new struct named MeshTriangle to the OGLRenderData.h file in the opengl\
    \ folder:\n\n```\nstruct MeshTriangle {\n    int index;\n    std::array<glm::vec3,\
    \ 3> points;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 403
  md: '```

    BoundingBox3D boundingBox;

    };

    ```


    For Vulkan, the triangle struct will be added to the VkRenderData.h file in the
    vulkan folder.


    The index member is mostly for debugging purposes and will be added to a log output
    line in case some triangles cannot be added to the octree. In the points array,
    we save the world positions of each of the three points of a triangle. The world
    position is needed to create the proper bounding box for the triangle, we will
    use the world position also later for collision detection. And the boundingBox
    member contains the AABB for every triangle of the level data mesh.


    Using bounding boxes instead of the real triangle data in the octree simplifies
    the query operations a lot since we do not have to check the exact outline of
    every triangle when searching for collision. We may end up with more triangles
    to check by using the AABB, but the AABB checks are cheap since we only need a
    maximum of six simple float comparisons. As most parts of a level geometry are
    either wall or ground, the additional size of the AABB does not matter.


    Next, we add the new octree class named TriangleOctree. The new triangle octree
    will be implemented in the two new files, TriangleOctree.h and TriangleOctree.cpp,
    in the octree folder.


    The TriangleOctree class is a copy of the normal Octree class, with a few exceptions:


    +   - We store the triangle data in the tree instead of the instance index.

    +   - Since the level data octree will be kept read-only, we don’t need the methods
    to update or remove objects or merge octants.

    +   - We handle only static data in the triangle octree, a search for intersections
    between triangles of the level does not return any useful information for us.
    So, the findAllIntersections() and findIntersectionsInDescendants() methods can
    be skipped too.


    In addition to the reasons to use a separate octree for the level data mentioned
    in the Adding a new octree type section, we also use a different approach for
    objects not fitting in a single octant.


    In the instance octree, a bounding box of an instance will be only in rare cases
    larger than a single octant, for instance when an instance is scaled by a large
    factor. But within the level octree, the bounding box of many triangles may not
    fit into a single subdivided octant. The creator of a level will try to minimize
    the number of triangles in a level for good rendering performance, resulting in
    areas of the level made of only a few large triangles.'
  merge: -1
  img_proc: true
- pgno: 404
  md: "We could overcome the size problem with one of the following three methods:\n\
    \n+   1. Keep a large triangle in the octant big enough to contain the entire\
    \ triangle. This solution would store additional objects in a parent node, not\
    \ only in a leaf.\n+   2. Add the triangle to all affected subdivided octants.\
    \ We would only have data in the leaves but would duplicate the triangle data\
    \ in the worst case 8 times.\n+   3. Split the triangle on the octant boundaries\
    \ and add only the sub-triangles to each octant. Again, we would have an additional\
    \ triangle per affected octant, plus possible problems with rounding errors in\
    \ the split lines.\n\nTo keep the code simple, we will use the first method and\
    \ add any triangle exceeding the dimensions of a subdivided octant only in the\
    \ parent octant.\n\nWe can achieve the storage process for oversized triangles\
    \ with a two-step check in the add() and split() methods. First, we iterate over\
    \ all child octants to find possible intersections of the triangle with the boundaries\
    \ of the child octant:\n\n```\nint intersectingChildren = 0;\nfor (int i = 0;\
    \ i < node->childs.size(); ++i) {\n    BoundingBox3D childBox = getChildOctant(box,\
    \ i);\n    if (childBox.intersects(triangle.boundingBox)) {\n        intersectingChildren++;\n\
    \    }\n}\n```\n\nIf we find an intersection with a child octant, we increment\
    \ the intersectingChildren variable. Then, for the add() method, we check how\
    \ many child octants the triangle would intersect. In case of more than one octant,\
    \ the triangle is kept in the current octant:\n\n```\nif (intersectingChildren\
    \ > 1) {\n    node->triangles.emplace_back(triangle);\n} else {\n    int i = getOctantId(box,\
    \ triangle.boundingBox);\n    if (i != -1) {\n        add(node->childs.at(i),\
    \ depth + 1,\n            getChildOctant(box, i), triangle);\n    }\n}\n```"
  merge: -1
  img_proc: true
