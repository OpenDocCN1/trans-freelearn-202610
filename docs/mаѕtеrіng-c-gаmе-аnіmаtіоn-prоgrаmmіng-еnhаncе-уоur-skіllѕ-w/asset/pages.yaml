- pgno: 84
  md: "# # Analyzing the current data representation\n\nIn the current implementation,\
    \ the matrix work is done in the updateAnimation() method of the AssimpInstance\
    \ class. For every frame the renderer draws to the screen, the following steps\
    \ must be done:\n\n+   1. First, we loop over all animation channels, getting\
    \ the corresponding node of the model and updating the translation, scaling, and\
    \ rotation of every node with the bone-local transforms from the animation data:\n\
    \n```\n```cpp\nfor (const auto& channel : animChannels) {\n\tstd::string nodeNameToAnimate\
    \ =\n\t\tchannel->getTargetNodeName();\n\tstd::shared_ptr<AssimpNode> node =\n\
    \t\tmAssimpModel->getNodeMap().at(nodeNameToAnimate);\n\tnode->setRotation(\n\t\
    \tchannel->getRotation(\n\t\t\tmInstanceSettings.isAnimPlayTimePos));\n\tnode->setScaling(\n\
    \t\tchannel->getScaling(\n\t\t\tmInstanceSettings.isAnimPlayTimePos));\n\tnode->setTranslation(\n\
    \t\tchannel->getTranslation(\n\t\t\tmInstanceSettings.isAnimPlayTimePos));\n}\n\
    ```\n```\n\n+   2. Then, we iterate over all bones, and update the TRS matrix\
    \ of every node, calculating the node-local transforms:\n\n```\n```cpp\nmBoneMatrices.clear();\n\
    for (auto& bone : mAssimpModel->getBoneList()) {\n\tstd::string nodeName = bone->getBoneName();\n\
    \tstd::shared_ptr<AssimpNode> node =\n\t\tmAssimpModel->getNodeMap().at(nodeName);\n\
    \tnode->updateTRSMatrix();\n}\n```\n```\n\nThe TRS matrix update of a node includes\
    \ the multiplication by the parent node TRS matrix."
  merge: -1
  img_proc: true
- pgno: 85
  md: "3. At this point, we can collect the final TRS matrix for the nodes, and multiply\
    \ it by the corresponding bone offset node, generating the mBoneMatrices vector\
    \ containing the world position for every node:\n\n```\nif (mAssimpModel->getBoneOffsetMatrices().count(\n\
    \    nodeName) > 0) {\n    mBoneMatrices.emplace_back(\n        mAssimpModel->getNodeMap().at(\n\
    \            nodeName)->getTRSMatrix() *\n        mAssimpModel->getBoneOffsetMatrices().at(nodeName));\n\
    }\n}\n```\n\nThe extra .count() check for the bone offset matrices is done to\
    \ avoid accessing an invalid matrix. The bone offset matrix should be valid for\
    \ every node that is part of the animation, but it’s better to be safe than sorry.\n\
    \n4. Then, in the draw() call of our renderer, i.e., in the OGLRenderer class,\
    \ the animation is updated for every instance. After the animation update, the\
    \ mBoneMatrices vector is retrieved and added to a local mBoneMatrices vector:\n\
    \n```\nfor (unsigned int i = 0; i < numberOfInstances; ++i) {\n    modelType.second.at(i)->updateAnimation(\n\
    \        deltaTime);\n    std::vector<glm::mat4> instanceBoneMatrices =\n    \
    \    modelType.second.at(i)->getBoneMatrices();\n    mModelBoneMatrices.insert(\n\
    \        mModelBoneMatrices.end(),\n        instanceBoneMatrices.begin(),\n  \
    \      instanceBoneMatrices.end());\n}\n```\n\n5. As the next step, the local\
    \ mBoneMatrices vector will be uploaded into the SSBO buffer:\n\n```\nmShaderBoneMatrixBuffer.uploadSsboData(\n\
    \    mModelBoneMatrices, 1);\n```"
