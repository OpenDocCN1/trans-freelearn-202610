  md: "```\nbuffer, bufferVector.data();\nglBindBuffer(GL_SHADER_STORAGE_BUFFER, 0)\n\
    ```\n\nThe contents of the SSBO could be compared to the results of the same calculations\
    \ done on the CPU. Step by step and buffer by buffer, the problem may be narrowed\
    \ down until the error has been found.\n\nReading back an SSBO may not be an obvious\
    \ solution to do compute shader debugging, but every little bit of help is welcome\
    \ here. But, depending on the complexity of the shader, you may be thrown back\
    \ to a manual walk-through of the code. Also, try to use a simple dataset to simplify\
    \ debugging.\n\n# Summary\n\nIn this chapter, we moved a large part of the computations\
    \ from the CPU to compute shaders on the GPU. After a brief history of concurrent\
    \ code execution, we created a plan on how to move the node transform calculation\
    \ to the GPU, and we finally executed that plan. At the end of the chapter, we\
    \ checked the resulting application for the speedup we achieved.\n\nIn the next\
    \ chapter, we will take a look at solutions to add a visual selection to the model\
    \ view application. Being able to create thousands of model instances is nice,\
    \ but locating one special instance among all the others is nearly impossible\
    \ right now. We will discuss two different approaches and implement one of them.\n\
    \n# Practical sessions\n\nThere are some additions you could make to the code:\n\
    \n+   - Add “Programmable Vertex Pulling” to the code.\n+   \n+     With Programmable\
    \ Vertex Pulling, the vertex data will no longer be pushed by using a vertex buffer.\
    \ Instead, the vertex data will be uploaded to a UBO or SSBO to the GPU, and the\
    \ vertex shader is used to extract all the data for every vertex from that buffer.\n\
    \n+   - Move mix() and slerp() from AssimpAnimChannel to the GPU.\n+   \n+   \
    \  When the two data values for the timings of translation, rotation, and scaling\
    \ have been extracted from the channel vector, a linear interpolation for translation\
    \ and scaling and a SLERP for rotation are required. Both interpolation types\
    \ are called thousands of items per frame – maybe the GPU is faster."
