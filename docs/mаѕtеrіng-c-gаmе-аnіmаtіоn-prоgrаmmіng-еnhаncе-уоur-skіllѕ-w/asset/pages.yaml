- pgno: 187
  md: "First, we remove the private mCamera member variable from the renderer class,\
    \ as we will never use the single camera again. Then, we get the pointer to the\
    \ camera and read the current camera settings.\n\nNow, the update of the camera\
    \ will be switched away from the old mCamera variable:\n\n```\nmCamera.updateCamera(mRenderData,\
    \ deltaTime);\n```\n\nInstead, we update the currently selected camera via the\
    \ cam pointer:\n\n```\ncam->updateCamera(mRenderData, deltaTime);\n```\n\nFor\
    \ the projection matrix, we use the new camSettings variable to read the currently\
    \ configured field of view:\n\n```\nmProjectionMatrix = glm::perspective(\n  \
    \  glm::radians(static_cast<float>(\n        camSettings.csFieldOfView)),\n  \
    \      static_cast<float>(mRenderData.rdWidth) /\n        static_cast<float>(mRenderData.rdHeight),\n\
    \        0.01f, 500.0f);\n```\n\nWe read the updated view matrix also by accessing\
    \ the cam pointer:\n\n```\nmViewMatrix = cam->getViewMatrix();\n```\n\nFinally,\
    \ in the centerInstance() method of the renderer, the call to the moveCameraTo()\
    \ method of the camera must be adjusted, too. We no longer use the old mCamera\
    \ variable, highlighted in the following code:\n\n```\nmCamera.moveCameraTo(...);\n\
    ```\n\nNow, we access the current camera directly in the mCameras vector:\n\n\
    ```\nmModelInstCamData.mCameras.at(\n    mModelInstCamData.mSelectedCamera)->moveCameraTo(...);\n\
    ```\n\nExtracting the pointer to the current camera makes no sense here since\
    \ this is only a single operation on the camera instance."
