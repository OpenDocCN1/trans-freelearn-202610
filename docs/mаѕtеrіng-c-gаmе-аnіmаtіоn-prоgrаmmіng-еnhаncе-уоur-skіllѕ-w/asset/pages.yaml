- pgno: 166
  md: "For Windows, we are also in luck. yaml-cpp uses CMake, and by using the CMake\
    \ FetchContent commands, downloading yaml-cpp can be added to the project with\
    \ only a couple of lines. First, we add the FetchContent declaration to the CMakeLists.txt\
    \ file in the project root. We are using version 0.8.0 of yaml-cpp:\n\n```\nFetchContent_Declare(\n\
    \    yaml-cpp\n    GIT_REPOSITORY https://github.com/jbeder/yaml-cpp\n    GIT_TAG\
    \ 0.8.0\n)\n```\n\nMake sure we are inside a WIN32 section in the CMakeLists.txt\
    \ file. We do not need to download the library on Linux.\n\nThen, we trigger the\
    \ download of yaml-cpp and add the variables for the directories:\n\n```\nFetchContent_MakeAvailable(yaml-cpp)\n\
    FetchContent_GetProperties(yaml-cpp)\nif(NOT yaml-cpp_POPULATED)\n    FetchContent_Populate(yaml-cpp)\n\
    \    add_subdirectory(${yaml-cpp_SOURCE_DIR}\n        ${yaml-cpp_BINARY_DIR} EXCLUDE_FROM_ALL)\n\
    endif()\n```\n\nWindows also needs a script to detect the downloaded dependency.\
    \ The detection script must be named Findyaml-cpp.cmake and placed into the cmake\
    \ folder.\n\nThe main function of the script boils down to these two CMake functions:\n\
    \n```\nfind_path(YAML-CPP_INCLUDE_DIR yaml-cpp/yaml.h\n    PATHS ${YAML-CPP_DIR}/include/)\n\
    find_library(YAML-CPP_LIBRARY\n    NAMES ${YAML-CPP_STATIC} yaml-cpp\n    PATHS\
    \ ${YAML-CPP_DIR}/lib)\n```\n\nThanks to CMake’s FetchContent, the YAML-CPP_DIR\
    \ variable is populated with the path to the downloaded yaml-cpp code. So, the\
    \ script only checks if the header and library can be found.\n\n# Integrating\
    \ yaml-cpp into the CMake build\n\nFor Linux and Windows, we must set the proper\
    \ include path for the compiler, and we must add the yaml-cpp libraries to the\
    \ list of linked libraries."
  merge: -1
  img_proc: true
- pgno: 167
  md: 'To update the include path, add the YAML_CPP_INCLUDE_DIR variable to the include_directories
    directive:


    ```

    include_directories(... ${YAML_CPP_INCLUDE_DIR})

    ```


    And for the linker, add yaml-cpp::yaml-cpp to target_link_libraries in Windows:


    ```

    target_link_libraries(... yaml-cpp::yaml-cpp)

    ```


    For Linux, only the name yaml-cpp of the shared library is needed:


    ```

    target_link_libraries(... yaml-cpp)

    ```


    After running CMake again, yaml-cpp will be downloaded and made available to the
    rest of the code.


    # Adding the parser class


    Parsing the YAML file for loading and creating the content for writing will be
    done in a new class called YamlParser, located in the tools directory. We can
    use yaml-cpp in our code after including the header file:


    ```

    #include <yaml-cpp/yaml.h>

    ```


    To store the intermediate data while loading or creating a data structure to save
    to disk, two additional private members are needed:


    ```

    YAML::Node mYamlNode{};

    YAML::Emitter mYamlEmit{};

    ```


    YAML::Node transforms the nodes of a YAML file from the disk into a C++ data structure,
    simplifying the access to the data that has been loaded. YAML::Emitter is used
    to create a YAML file in memory by appending data elements, eventually writing
    the structured data to a file.


    # Using the node type of yaml-cpp


    Accessing the structured or scalar data of a yaml-cpp node is done by using the
    node name as the index to the C++ map stored in the YAML::Node class:


    ```

    mYamlNode = YAML::LoadFile(fileName);

    YAML::Node settingsNode = mYamlNode["settings"];

    ```'
