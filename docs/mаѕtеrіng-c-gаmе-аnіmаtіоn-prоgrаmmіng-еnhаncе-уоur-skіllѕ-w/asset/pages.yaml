- pgno: 101
  md: "The preceding lines of code may make you raise your eyebrows, since we apparently\
    \ break one of the basic rules of GLSL shader code: the size of a loop must be\
    \ known at compile time. Luckily, this rule does not apply to a while loop. We\
    \ are free to alter the loop control variable inside the body of the loop, creating\
    \ loops of various lengths.\n\nHowever, this code could impact shader performance\
    \ as GPUs are optimized to execute the same instructions on every thread. You\
    \ may have to check the shader code on different GPUs to make sure you see the\
    \ expected speedup.\n\nAlso be aware that the accidental creation of an infinite\
    \ loop may end in a locked-up system since the shader code never returns the wave\
    \ or warp to the pool. It’s a good idea to ensure a valid exit condition for a\
    \ while loop on the CPU side since a GPU lockup may only be resolved by a forced\
    \ restart of your computer.\n\nAs long as we don’t have errors or cycles in the\
    \ parent node list, we will end at the last block for every node:\n\n```\nif (parentNode\
    \ == -1) {\n    nodeMat[index] = nodeMatrix * boneOff[node];\n}\n```\n\nHere,\
    \ we multiply the resulting node matrix, containing all matrices up to the root\
    \ node, by the bone offset matrix for the node, and store the result in the writable\
    \ NodeMatrices buffer.\n\nStarting the computation is done in exactly the same\
    \ way as for the first shader. Run glDispatchCompute() for OpenGL, followed by\
    \ a glMemoryBarrier():\n\n```\nglDispatchCompute(numberOfBones,\n    std::ceil(numberOfInstances\
    \ / 32.0f), 1);\nglMemoryBarrier(GL_SHADER_STORAGE_BARRIER_BIT);\n```\n\nAnd,\
    \ for Vulkan, use vkCmdDispatch():\n\n```\nvkCmdDispatch(commandBuffer, numberOfBones,\n\
    \    std::ceil(numberOfInstances / 32.0f), 1);\n```\n\nAt this point, the NodeMatrices\
    \ buffer contains the TRS matrices for all nodes, close to the result we had after\
    \ the updateAnimation() call in the CPU-based version of the code in Chapter 1\
    \ – with the exception of the model root matrix for the instance."
  merge: -1
  img_proc: true
- pgno: 102
  md: "# Finalizing the compute relocation\n\nSo, let’s add the missing matrix calculation\
    \ to the vertex skinning shader. First, we collect the matrices containing the\
    \ world positions during the loop over all instances of the model:\n\n```\nmWorldPosMatrices.resize(numberOfInstances);\n\
    for (unsigned int i = 0; i < numberOfInstances; ++i) {\n    ...\n    mWorldPosMatrices.at(i)\
    \ =\n    modelType.second.at(i)->getWorldTransformMatrix();\n}\n```\n\nThen, the\
    \ world position matrices are uploaded into an SSBO, and bound to the vertex skinning\
    \ shader:\n\n```\nmAssimpSkinningShader.use();\nmAssimpSkinningShader.setUniformValue(\n\
    \    numberOfBones);\nmShaderBoneMatrixBuffer.bind(1);\nmShaderModelRootMatrixBuffer.uploadSsboData(\n\
    \    mWorldPosMatrices, 2);\n```\n\nIn the vertex skinning shader itself, the\
    \ new buffer is introduced:\n\n```\nlayout (std430, binding = 2) readonly restrict\n\
    \    buffer WorldPosMatrices {\n    mat4 worldPos[];\n};\n```\n\nFinally, we create\
    \ a combined matrix from the world position and the vertex skin matrix, and use\
    \ the new matrix to calculate the position of the vertex and the normal:\n\n```\n\
    mat4 worldPosSkinMat = worldPos[gl_InstanceID] * skinMat;\ngl_Position = projection\
    \ * view * worldPosSkinMat *\n    vec4(aPos.x, aPos.y, aPos.z, 1.0);\n...\nnormal\
    \ = transpose(inverse(worldPosSkinMat)) *\n    vec4(aNormal.x, aNormal.y, aNormal.z,\
    \ 1.0);\n```"
