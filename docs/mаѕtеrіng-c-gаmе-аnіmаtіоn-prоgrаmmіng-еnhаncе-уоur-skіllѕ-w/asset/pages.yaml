- pgno: 266
  md: 'Checking a convex hull for collisions needs a lot of tests, possibly lowering
    the effect we wanted to achieve with our model simplification. As long as you
    don''t have models with lots of triangles, a convex hull may be out of scope.


    On the other hand, if small collision errors can be tolerated, the convex hull
    can be used as a replacement for a high-poly model, and all collision checks can
    be done only against the convex hull.


    As the last method, the bounding volume hierarchy can be used. The hierarchy model
    is not just suitable for space partitioning but also for model simplification.


    # **Bounding volume hierarchy**


    The general idea of the bounding volume hierarchy for space partitioning also
    holds true to simplify the instances. But here, the model parts are enclosed in
    larger and larger volumes. Figure 8.12 shows a simplified example of the bounding
    volume hierarchy around a character model:


    ![](img/3cfb9832c943f5f7366fd104b5255971_266_0.png)


    A failing check on one of the larger volumes allows us to discard the body part(s)
    inside the volume completely. By using a carefully crafted configuration, only
    a small number of tests are needed to decide if the instance should stay on the
    list for deeper checks, or if it can be ignored.


    For details about collision checking between convex objects, you can look at the
    Gilbert–Johnson–Keerthi (GJK) distance algorithm. The GJK algorithm reduces the
    collision detection complexity by using the so-called Minkowski difference. A
    link to a web page explaining the principle of the GJK algorithm is available
    in the Additional resources section.


    For the sake of simplicity, because of the fast updates, and also based on setting
    a limit to the number of instances to check, we will implement a quadtree into
    the application and bounding spheres for the instances. The quadtree will allow
    us to do the first step of collision detection'
  merge: -1
  img_proc: true
- pgno: 267
  md: "much faster than the “brute-force” pairwise comparisons of all models in the\
    \ naive approach. The bounding spheres are great for a balance between the number\
    \ of collision checks and the number of false positives due to the free space\
    \ between the sphere and the instance triangles.\n\nNext, let’s jump into the\
    \ implementation of the quadtree.\n\n# Adding a quadtree to store nearby model\
    \ instances\n\nGetting complex code right is hard, so using an open-source implementation\
    \ of a quadtree is a viable option. The best fitting version of a quadtree I’ve\
    \ found is from Pierre Vigier and can be found on GitHub here: https://github.com/pvigier/Quadtree.\n\
    \nThe code from Pierre is based on C++ templating to have great flexibility on\
    \ the data one stores in the quadtree. Also, he uses a custom-templated two-dimensional\
    \ vector type for storing positions and sizes.\n\nWe don’t need this kind of flexibility\
    \ as we will store only an int containing the instance index position in the quadtree.\
    \ And since we are using GLM for all other cases where we need a two-dimensional\
    \ vector type, we will change the bounding box implementation to use glm::vec2\
    \ to store box position and size.\n\n# Adjusting the bounding box code\n\nAs the\
    \ first step for the new and shiny quadtree, we need to adjust the code for the\
    \ bounding box. Instead of storing the top and left positions and width plus height\
    \ as single values, we use a vec2 for position and size. Transforming the templated\
    \ C++ code from the Box.h file in the include folder of the GitHub repository\
    \ is done fairly easily, and we end up with constructors, a couple of getters,\
    \ and the two methods contains() and intersects() in the BoundingBox2D.h and BoundingBox2D.cpp\
    \ files in the newly created quadtree folder.\n\nThe most complex method is intersects()\
    \ to check if two bounding boxes intersect each other:\n\n```\n```cpp\nbool BoundingBox2D::intersects(BoundingBox2D\
    \ otherBox) {\n\treturn !(\n\t\tmPosition.x >= otherBox.getRight() ||\n\t\totherBox.getTopLeft().x\
    \ >= getRight() ||\n\t\tmPosition.y >= otherBox.getBottom() ||\n\t\totherBox.getTopLeft().y\
    \ >= getBottom()\n\t);\n}\n```\n```"
