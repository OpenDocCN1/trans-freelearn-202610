  md: '# Add a simple bounding volume hierarchy.


    Instead of checking all spheres of both instances, you could add some unused nodes
    to the models and add bigger bounding spheres to these nodes, enclosing some of
    the smaller spheres. Check the spheres by starting with the largest spheres for
    both instances. If these large spheres don’t collide, all spheres inside the larger
    sphere can never have a collision, and the entire part of the body could be skipped
    for the next collision checks.


    # Enhanced difficulty: Do a real triangle-to-triangle check between the instances.


    This is the ultimate goal in collision detection. By checking the instances for
    real intersections, not just some AABBs or bounding spheres, natural-looking collision
    behavior could be achieved. Also, make note of the benefits of this method and
    see whether the extra precision benefits the runtime behavior.


    # Enhanced difficulty: Add collision resolution.


    When the collision check signals a collision between two instances, it’s already
    too late – the instances are partially intersected. Good collision detection comes
    with collision resolution where the instances are moved apart when a collision
    is found. Several books have been written about collision detection and collision
    resolution; see the Additional resources section for some well-known titles. There
    are still many caveats on the path to “making it right.”


    # Additional resources


    +   - Separating Axis Theorem: https://dyn4j.org/2010/01/sat/

    +   - Gilbert–Johnson–Keerthi distance algorithm: https://cse442-17f.github.io/Gilbert-Johnson-Keerthi-Distance-Algorithm/

    +   - Template-based quadtree implementation: https://github.com/pvigier/Quadtree

    +   - Collision Detection in Interactive 3D Environments: ISBN 978-1558608016

    +   - Real-Time Collision Detection: ISBN 978-1558607323

    +   - Game Physics Engine Development: ISBN 978-012381765

    +   - Game Physics: ISBN 978-0123749031

    +   - Collision Avoidance: https://code.tutsplus.com/understanding-steering-behaviors-collision-avoidance--gamedev-7777t

    +   - More about Collision Avoidance: https://www.gameaipro.com/GameAIPro2/GameAIPro2_Chapter19_Guide_to_Anticipatory_Collision_Avoidance.pdf'
