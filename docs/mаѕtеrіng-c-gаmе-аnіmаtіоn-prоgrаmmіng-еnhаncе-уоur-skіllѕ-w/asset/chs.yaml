- "# 第14章 创建沉浸式交互世界\n\n## 创建沉浸式交互世界\n\n欢迎来到第 14 章！在上一章中，我们为实例添加了寻路和导航功能。我们首先简要概述了计算机游戏中导航方法。然后我们探索并实现了\
  \ A* 算法，以在实例位置和虚拟世界中的某一点之间找到路径。接下来，我们增强了模型以作为导航目标，并扩展实例使其能够找到通往其中一个目标的路径。在本章末尾，我们添加了实例跟随路径并到达所需目标的能力。\n\
  \n在本章中，我们将探索不同的想法来增强示例代码，以获得更强的沉浸感和视觉质量。我们将从听觉方面着手，介绍为应用程序添加音效和音乐的工具和方法。还将实现一个简单的音频管理器类来播放音效和背景音乐。为了不仅取悦耳朵，还取悦眼睛，我们将收集一些关于如何增强视觉外观的想法，并将其中两种图形增强功能实现到应用程序中。我们将以本章结束本书，探讨昼夜和天气变化对虚拟世界的影响，并在应用程序中添加一个基本的昼夜循环。\n\
  \n在本章中，我们将涵盖以下主题：\n- 添加音效和背景音乐\n- 增强视觉效果\n- 通过昼夜和天气扩展沉浸感\n\n## 技术要求\n\n本章的示例代码可在\
  \ chapter14 文件夹中找到：用于 OpenGL 的 01_opengl_ideas 子文件夹和用于 Vulkan 的 02_vulkan_ideas\
  \ 子文件夹。\n\n## 添加音效和背景音乐\n\n运行第 13 章的示例代码提供了许多功能，例如面部动画、关卡加载、碰撞检测以及寻路和导航。但遗憾的是，屏幕上的所有动画都在死一般的寂静中运行。没有滴滴声或嗡嗡声，没有声音，也没有音乐。只有寂静。\n\
  \n但声音和音乐是游戏的重要组成部分，原因非常充分。无论你是在享受 Minecraft 的宁静草地还是深邃洞穴，沉浸在《超级马里奥》系列欢快的音乐中并听到动作的音效作为听觉反馈，还是在游荡于《死寂》或《寂静岭》系列令人毛骨悚然的世界中，仔细聆听环境音以了解周围情况，或是驾驶汽车伴随着《极品飞车》系列等赛车游戏的澎湃音乐和厚重音效——没有音乐和声音，游戏就无法为玩家提供同样的体验。\n\
  \n要添加声音输出，我们可以包含一个可自由获取的声音库，让我们能够轻松播放音效或音乐。让我们先看看一些库。\n\n## 使用音频库\n\n大多数音频库是用 C\
  \ 编写的，但可以找到 C++ 绑定，以面向对象的方式封装特定于操作系统的底层函数调用。也可以只使用 C 函数并构建自定义抽象，类似于 GLFW、OpenGL\
  \ 和 Vulkan。\n\n## Simple DirectMedia Layer\n\nSimple DirectMedia Layer（SDL）是一个跨平台库，用于计算机的多媒体硬件组件。SDL\
  \ 管理音频，可作为窗口功能、图形上下文和输入处理的框架，如 GLFW。此外，还有多个官方库提供导入和导出图像、自定义网络以及字体渲染以在屏幕上显示文本的支持。\n\
  \n## OpenAL\n\nOpenAL 是一个跨平台库，专注于多通道、三维音频。通过使用 3D 音频，声音可以被建模为在玩家前方或后方，而不仅仅是左右，从而加深沉浸感。\n\
  \n## PortAudio\n\nPortAudio 是另一个跨平台音频库。它针对实时音频播放和录制。如果 SDL 和 OpenAL 的范围对项目来说过大，而目标只是播放一些音频，则可以使用\
  \ PortAudio。\n\n## FMOD\n\n尽管 FMOD 是一个专有的声音引擎，但它可以被列入可自由获取的库名单，因为存在非商业许可证，允许我们免费使用\
  \ FMOD。只有当最终应用程序或游戏将商业发行时，才需要付费的 FMOD 许可证。FMOD 支持 Unreal 和 Unity 等 3D 引擎，因此如果你在某个时候从事游戏开发，也可能会接触到\
  \ FMOD。\n\n在探索了可以包含哪些用于声音和音乐回放的软件之后，让我们来看看应该播放什么。\n\n## 播放音效\n\n由于声音在我们生活中扮演关键角色，我们对游戏中或模拟中应该听到什么会有一定的期望。未能满足这些期望可能会损害沉浸感。\n\
  \n## 游戏角色的脚步声\n\n玩家最想听到的最重要的音效之一就是角色在地面上的脚步声。通过根据地面材质和角色速度调整声音，可以立即向玩家反馈环境信息。悄悄穿过草地与在金属地面上奔跑之间存在显著差异，玩家应该意识到角色动作的“响亮程度”，并且通过碰撞检测和地面三角形发现，如第\
  \ 12 章“关卡数据中寻找地面三角形”部分所述，可以轻松找到地面三角形的材质类型。\n\n## 其他角色声音\n\n角色会发出很多声音，不只是脚步声。跳跃和落地、攀爬梯子、游泳或被敌方角色伤害也应为玩家提供听觉反馈，以便了解虚拟世界中角色发生了什么。\n\
  \n## 局部声源\n\n不仅玩家控制的角色需要音效，计算机控制的角色和虚拟世界中的无生命物体也应播放音频效果。听到门打开和关闭、铁匠的敲击声、鸟鸣，以及壁炉的噼啪声、瀑布声或高处世界的风声，将极大地增强沉浸感。\n\
  \n## 环境音\n\n环境音是来自远处位置的不同声音和频率的混合，在传到听者耳中时会失去部分信息。大量人群、森林中的风声或几米外的街道都会产生我们熟知的声音，应添加到虚拟世界的相应位置。\n\
  \n## 天气效果\n\n如果世界包含某种天气系统，也应添加声音和效果。远处的雷暴或下雪后地面的寂静可以改变玩家对虚拟世界的感知。\n\n但音效不仅对沉浸感有用；播放音乐也有助于保持玩家的注意力。\n\
  \n## 播放音乐\n\n自计算机游戏早期以来，音乐就被添加到游戏中以保持玩家的兴趣。因此，我们可能仍然记得看到游戏标题时的音乐，而不记得游戏玩法细节或游戏角色。\n\
  \n## 菜单音乐\n\n玩家启动应用程序时看到的第一个屏幕很可能是一种主菜单。直接将玩家投入行动，而不先让他们配置虚拟角色的控制、视觉质量或声音音量，可能不是最好的主意。在玩家在菜单中探索选项时，音乐可以帮助防止玩家立即迷失或感到无聊。\n\
  \n\n\n\n\n## 环境音乐\n\n与环境音类似，环境音乐有助于防止游戏中出现死寂。完全不播放任何声音可能是为了营造紧张感，但在游戏中连续数小时寂静穿行可能会变得无聊。添加一段风格和节奏与游戏玩法相匹配的音乐曲目，有助于玩家享受游戏中即便是缓慢的段落。\n\
  \n## 自适应音乐播放\n\n当玩家在开放世界中进入不同区域，或进入风格不同的环境、另一房间时，更换音乐以匹配新地点是个好主意。进入房间时那个著名的“听到Boss音乐”的瞬间，再加上门锁上的声音，将为玩家创造难忘的时刻。\n\
  \n## 允许自定义音乐\n\n一个有趣的音乐选择选项是让玩家将本地音乐添加到游戏播放的曲目列表中，甚至完全替换音乐。看到游戏角色一边探索虚拟世界，一边聆听一些喜爱的音乐曲目，对玩家来说可能是一个加分项。\n\
  \n为了体验音频回放所能带来的差异，我们将添加一个 C++ 类来管理音效和音乐回放。\n\n## 实践：实现音频管理器\n\n音频管理器类由两个不同的部分组成。一方面，我们需要一个音频管理器与渲染器及其他类之间的高级接口。另一方面，封装好的低级接口将音频管理器功能与操作系统的音频库连接起来，这样我们就可以用另一个变体替换音频库。\n\
  \n我们将先简要概述高级接口，然后再深入低层实现。\n\n### 定义高级接口\n\n新的 AudioManager 类由 AudioManager.h 头文件和\
  \ AudioManager.cpp 实现文件组成，将添加到 tools 文件夹中。我们将添加一个常规音乐/声音播放器应具备的基本功能：\n\n- 初始化并清理音频库\n\
  - 从文件系统中的文件加载音乐曲目\n- 从文件系统中的文件加载音效\n- 播放和停止音乐与音效\n- 暂停、恢复以及将音乐曲目跳转到上一首/下一首\n- 获取、随机播放和清除当前播放列表\n\
  - 更改音乐和音效的音量\n\n例如，向 AudioManager 类添加公共 `setMusicVolume()` 和 `getMusicVolume()`\
  \ 方法来控制音乐音量：\n\n```\nvoid setMusicVolume(int volume);\nint getMusicVolume();\n```\n\
  \n此外，私有成员变量 `mMusicVolume` 用于存储当前音乐音量：\n\n```\nint mMusicVolume = 64;\n```\n\n对于函数列表中的其余功能，会创建公共方法和私有成员变量。查看\
  \ AudioManager.h 文件可看到 AudioManager 类中可用的全部方法和成员变量。\n\n现在，我们必须向应用程序代码中添加一个 AudioManager\
  \ 类对象的成员变量，以及音频功能的初始化和清理调用。为了将渲染器仅保留给视频部分，AudioManager 成员变量和方法将添加到 Window 类中。\n\n\
  ### 将 AudioManager 类添加到 Window 类\n\n将音频功能添加到 Window 类的两个主要步骤与其他所有类相同：在 Window.h\
  \ 头文件顶部包含 AudioManager.h 头文件，并声明名为 `mAudioManager` 的私有成员变量：\n\n```\n#include \"\
  AudioManager.h\"\n...\nAudioManager mAudioManager{};\n```\n\n然后，在 Window.cpp 文件中\
  \ Window 类的 `init()` 方法中，我们尝试初始化 AudioManager 对象：\n\n```\nif (!mAudioManager.init())\
  \ {\n    Logger::log(1, \"%s error: unable to init audio, skipping\\n\", __FUNCTION__);\n\
  }\n```\n\n注意，我们使用 Logger 类打印错误消息，但如果 AudioManager 初始化失败，我们不会终止窗口初始化。音频回放应保持可选，我们将继续运行而不进行音乐和音效回放，而不是使应用程序启动失败。\n\
  \n在初始化调用之后，可以立即将音乐曲目加载到 AudioManager 中：\n\n```\nif (mAudioManager.isInitialized())\
  \ {\n    mAudioManager.loadMusicFromFolder(\"assets/music\", \"mp3\");\n}\n```\n\
  \n在这里，如果初始化成功，我们将尝试将 `assets/music` 文件夹中的所有 MP3 文件加载到 AudioManager 中。同样，如果在资源文件夹中找不到音乐文件，我们也不会失败。\n\
  \n### 将音乐曲目添加到播放列表\n\n在 AudioManager 类中，已经实现了从本地文件夹 `assets/music` 加载 MP3 和 OGG\
  \ 文件到播放列表的支持。您可以将自己的音乐添加到 `assets/music` 文件夹中，因为应用程序启动时会填充播放列表。在实践环节中，有一个任务是为 UI\
  \ 添加一个“刷新”按钮，允许您在应用程序运行时添加或移除音乐曲目。\n\n最后，我们需要在关闭应用程序时清理 AudioManager。因此，我们在 Window\
  \ 类的 `cleanup()` 方法中添加对 AudioManager 的 `cleanup()` 方法的调用：\n\n```\nvoid Window::cleanup()\
  \ {\n    mRenderer->cleanup();\n    mAudioManager.cleanup();\n    ...\n}\n```\n\n\
  由于我们在 Window 类中创建了 AudioManager，因此需要创建回调函数，以便从渲染器或用户界面访问音乐和音效功能。\n\n### 使用回调使 AudioManager\
  \ 类随处可用\n\n通过使用这些回调函数，可以在代码中的任何位置更改音乐曲目或播放脚步声。作为示例，我们将在这里使用播放特定音乐曲目的功能，并以曲目名称作为参数。\n\
  \n首先，我们将名为 `playMusicTitleCallback` 的回调函数签名添加到 Callbacks.h 文件中：\n\n```\nusing playMusicTitleCallback\
  \ =\n    std::function<void(std::string)>;\n```\n\n接下来，我们在 ModelInstanceCamData.h\
  \ 文件的 ModelInstanceCamData 结构体中创建一个名为 `micPlayMusicTitleCallbackFunction` 的变量：\n\
  \n```\nplayMusicTitleCallback micPlayMusicTitleCallbackFunction;\n```\n\n我们使用 ModelInstanceCamData\
  \ 结构体来避免回调函数散布在代码中。\n\n然后，在 Window 类的 `init()` 方法中，将该回调变量绑定到 AudioManager 的相应函数：\n\
  \n```\nModelInstanceCamData& rendererMICData =\n    mRenderer->getModInstCamData();\n\
  rendererMICData.micPlayMusicTitleCallbackFunction =\n    [this](std::string title)\
  \ {\n        mAudioManager.playTitle(title);\n    };\n```\n\n在这里，我们获取包含渲染器类的 ModelInstanceCamData\
  \ 结构体的变量的引用，并通过 lambda 函数将 AudioManager 类的 `playTitle()` 方法赋值给它。\n\n对于渲染器中应可用的每个音频方法，必须重复创建回调函数签名、向\
  \ ModelInstanceCamData 结构体添加变量、将回调函数绑定到 AudioManager 类方法这三个步骤。\n\n现在，让我们看看音频管理器低层部分的实现。我们将使用\
  \ SDL，因为音频函数易于使用。\n\n### 使用 SDL 作为底层\n\n尽管 SDL 可以处理比音频更多的功能，但我们只使用 SDL 库提供的函数子集也是可行的。因此，我们不会使用\
  \ SDL 来处理窗口和键盘（这些由应用程序中的 GLFW 完成），而只使用 SDL 的声音回放和混音功能。\n\n要使用 SDL 进行音频回放，我们需要核心\
  \ SDL 库以及名为 SDL_mixer 的独立混音器库。\n\n#### 在 Windows 上安装 SDL 和 SDL_mixer\n\n对于 Windows，GitHub\
  \ 上提供了预编译版本的 SDL 和 SDL_mixer。请访问以下两个 URL 的 releases 页面，并下载适用于 Visual Studio 的最新稳定开发\
  \ zip 文件，这些文件名中包含 `devel` 和 `VC`。例如，当前适用于 Visual Studio 的 SDL 主库开发包名为 `SDL2-devel-2.30.9-VC.zip`。以下是\
  \ URL：\n\n- SDL: https://github.com/libsdl-org/SDL/releases\n- SDL_mixer: https://github.com/libsdl-org/SDL_mixer/releases\n\
  \n现在，将这两个 zip 文件解压到您的计算机上，但注意路径名中要避免空格和特殊字符（如德语元音变音），以免出现问题，因为即使在 2024 年，许多工具在路径中遇到特殊字符时仍然存在问题。\n\
  \n接下来，添加两个环境变量，以帮助 CMake 搜索脚本找到头文件和库：\n\n- 第一个变量名为 `SDL2DIR`，必须指向 SDL 主库解压后的文件夹。\n\
  - 第二个变量名为 `SDL2MIXERDIR`，必须指向 SDL_mixer 库的文件夹。\n\n图 14.1 展示了这些环境变量的示例：\n\n![](img/3cfb9832c943f5f7366fd104b5255971_489_0.png)\n\
  \n图 14.1：SDL 的环境变量示例\n\n\n\n\n在应用程序终止时，Window 类的 cleanup() 方法会调用 AudioManager 的\
  \ cleanup() 方法。在 AudioManager 类的 cleanup() 方法内部，我们关闭音频设备，并通知 SDL_mixer 和 SDL 运行它们各自的清理代码：\n\
  \n```\nMix_CloseAudio();\nMix_Quit();\nSDL_Quit();\n```\n\n请注意，我们没有在 init() 方法中调用\
  \ Mix_Init()，但在这里必须调用 Mix_Quit()。SDL 会为我们管理混音器的初始化，无需显式调用 Mix_Init()。\n\n现在我们已经准备好播放音乐和音效了。让我们先来看看音乐重播代码。\n\
  \n## 控制音乐重播\n\n加载音乐曲目是通过调用 Mix_LoadMUS() 并传入 C 风格字符数组作为参数来完成的：\n\n```\nMix_Music*\
  \ music = Mix_LoadMUS(fileName.c_str());\n```\n\nSDL_mixer 支持多种音乐格式，如 WAV、MP3 和\
  \ OGG。Mix_LoadMUS() 的返回值是指向 Mix_Music 结构体的指针。\n\n要清理已加载的音乐曲目，必须调用 Mix_FreeMusic()，并传入上述\
  \ Mix_Music 结构体的指针：\n\n```\nMix_FreeMusic(music);\n```\n\n可以通过调用 Mix_PlayMusic()\
  \ 并传入两个参数来播放音乐曲目：\n\n```\nMix_PlayMusic(music, 0);\n```\n\n第一个参数是指向有效 Mix_Music\
  \ 结构体的指针，第二个参数告诉 SDL_mixer 要播放的循环次数。循环值为 0 表示禁用循环，值为 -1 表示无限循环播放音乐。\n\n停止音乐通过调用\
  \ Mix_HaltMusic() 完成：\n\n```\nMix_HaltMusic();\n```\n\n由于同一时间只能播放一个音乐曲目，因此不需要参数。如果当前曲目需要暂停或恢复，可以使用\
  \ Mix_PauseMusic() 和 Mix_ResumeMusic() 这两个调用：\n\n```\nMix_PauseMusic();\nMix_ResumeMusic();\n\
  ```\n\n最后，音乐音量由 Mix_VolumeMusic() 控制：\n\n```\nMix_VolumeMusic(volume);\n```\n\n\
  Mix_VolumeMusic() 的参数是一个介于 0 和 128 之间的 int 值，用于设置新音量；或者使用 -1 来查询当前音乐音量。\n\n通过使用默认的\
  \ SDL_mixer 调用，我们只能播放一个音乐曲目一次或无限循环。如果需要动态音乐系统，则需要进行手动实现，甚至应考虑使用不同的声音重播 API。为了实现曲目结束时自动前进到播放列表中下一曲目的简单功能，我们只需实现一个回调。\n\
  \n## 添加用于连续音乐播放的回调\n\nSDL_mixer 支持一个回调，用于通知应用程序当前音乐曲目已完成指定次数的循环。在此回调中，我们可以简单地前进到播放列表中的下一首曲目。\n\
  \n遗憾的是，SDL_mixer 是一个 C 音频库，回调必须符合 C 风格的调用约定。C++ 调用约定与 C 调用约定不兼容，并且只允许调用 AudioManager\
  \ 类的静态成员函数。我们需要添加一个小技巧，以便能够调用 AudioManager 类的非静态方法，该方法可以访问播放列表以及当前在播放列表中的位置。\n\n\
  首先，我们声明一个名为 mCurrentManager 的原始指针作为私有成员变量，同时声明用于 C 风格回调的私有静态成员方法 staticMusicFinishedCallback()，以及用于转换后回调的私有非静态成员方法\
  \ musicFinishedCallback()：\n\n```\nstatic AudioManager* mCurrentManager;\nstatic\
  \ void staticMusicFinishedCallback();\nvoid musicFinishedCallback();\n```\n\n在 AudioManager\
  \ 类的 init() 方法中，我们将 mCurrentManager 指针设置为当前实例，并使用静态回调方法调用回调钩子设置方法 Mix_HookMusicFinished()：\n\
  \n```\nmCurrentManager = this;\nMix_HookMusicFinished(staticMusicFinishedCallback);\n\
  ```\n\n每当音乐曲目结束时，SDL_mixer 就会调用 staticMusicFinishedCallback()。为了将回调转换为 C++，我们使用存储在\
  \ mCurrentManager 中的指向当前 AudioManager 实例的指针来调用非静态回调方法 musicFinishedCallback()：\n\
  \n```\nif (mCurrentManager) {\n```\n\n我们只希望在行走和奔跑动画重播的同时添加音效。\n\n然后我们检查实例的移动状态，并为该状态调用相应的回调：\n\
  \n```\nswitch (state) {\n    case moveState::run:\n        mModelInstCamData.\n\
  \            micPlayRunFootstepCallbackFunction();\n        break;\n    case moveState::walk:\n\
  \        mModelInstCamData.\n            micPlayWalkFootstepCallbackFunction();\n\
  \        break;\n```\n\n当实例处于奔跑状态时，我们播放奔跑脚步的音效。如果实例处于行走状态，则播放行走脚步的音效。\n\n如果实例既不是奔跑也不是行走，则停止脚步声音：\n\
  \n```\ndefault:\n    mModelInstCamData.\n        micStopFootstepCallbackFunction();\n\
  \    break;\n}\n```\n\n如果实例不处于空闲/行走/奔跑循环中，我们也会停止所有声音。这样，我们就能处理所有尚未配备音效的动作，例如跳跃或出拳：\n\
  \n```\n} else {\n    mModelInstCamData.\n        micStopFootstepCallbackFunction();\n\
  }\n```\n\n要听到脚步声音，需要执行以下步骤：\n\n- 1. 启动应用程序并加载带有动画映射的配置。\n- 2. 选择（或创建）第一人称或第三人称摄像机。\n\
  - 3. 选择一个实例，然后通过在 UI 的 Control 窗口的 Camera 部分中点击 Use Selected Instance 来设置该实例。\n\
  - 4. 按 F10 切换到视图模式。\n\n如果你现在使用鼠标和 W/A/S/D 键移动受控实例，应该会听到两种不同的脚步声音，具体取决于实例在虚拟世界中行走还是奔跑。\n\
  \n## 扩展音频管理器类\n\n为了概述 AudioManager 类可能的扩展，以支持更多声道来实现更具游戏性的声音管理，我们需要跟踪由 Mix_PlayChannel()\
  \ 调用返回的正在播放脚步声音的声道。通过专门为本地脚步声音保留一个声道，我们可以实现相同的行为，但能够同时播放更多音效。\n\n处理多个音效可以通过创建声道池并向\
  \ SDL 函数 Mix_ChannelFinished() 添加回调来实现，类似于 Mix_HookMusicFinished()。每当一个声道播放完当前声音片段，或调用\
  \ Mix_HaltChannel() 时，SDL 都会触发 Mix_ChannelFinished() 回调，并在回调中传递已结束声道的编号。\n\n声道池可以在播放音效时以及效果重播完成时更新。通过使用到产生音效的对象的距离，并使用\
  \ Mix_Volume() 或 Mix_SetDistance() 按比例降低声道音量，可以模拟声源的不同距离。此外，可以使用 Mix_SetPanning()\
  \ 来调整声源在左右方向上的位置。\n\n“实践环节”部分提供了几个任务，用于从当前状态改进声音重播。\n\n作为如何从 UserInterface 类使用 AudioManager\
  \ 回调的示例，一个简单的音乐重播控制已添加到用户界面中。在 Control 窗口的 Music & Sound 部分，你会找到一个组合框和一些按钮，用于播放从\
  \ assets/music 文件夹创建的播放列表中的音乐。\n\n## 在 UI 中使用音乐播放器\n\n向 UserInterface 类添加音乐重播功能是一项快速而简单的任务。通过使用\
  \ AudioManager 类的回调，只需向 UI 添加少量代码块即可实现一个基本的音乐播放器。\n\n在图 14.2 中，展示了使用 AudioManager\
  \ 类的包含基本音乐播放器的 ImGui 部分：\n\n![](img/3cfb9832c943f5f7366fd104b5255971_498_0.png)\n\
  \n图 14.2：基于 AudioManager 的音乐播放器已添加到用户界面\n\n可以通过 Tracks 组合框选择要播放的音乐曲目，按下 Play 按钮可以播放当前曲目，或者按下\
  \ Play Random 按钮将随机播放乱序播放列表中的一首曲目。其他四个按钮 Prev、Pause、Stop 和 Next 的功能与标签所示完全一致，通过使用滑块，可以将音乐和音效的音量设置为\
  \ 0（静音）到 128 之间的值。\n\n## 替代声音管理器实现\n\n应用程序使用的 AudioManager 类采用了直接的实现方式，通过 C++ 回调函数进行直接控制。对于高级声音系统，可以使用基于事件或消息的实现。这种实现可以利用游戏中已有的事件管理代码，并且事件或消息也能将音效重播与请求重播音效或更改音乐的代码解耦。\n\
  \n在虚拟世界中拥有声音和音乐之后，对应用程序图形的更新也可能会出现在待办事项列表中。现在让我们来探索一些视觉增强功能。\n\n## 增强视觉效果\n\n示例代码中的\
  \ OpenGL 和 Vulkan 渲染器仅支持将图像显示到屏幕所需的最少功能集：两个渲染器只能绘制纹理三角形和彩色线条。添加以下一项或多项增强功能将极大地提升图像质量。\n\
  \n## 通过基于物理的渲染为世界带来色彩\n\n目前，我们仅使用 Assimp 对象的纹理来将模型实例和关卡几何体渲染到屏幕上。通过使用基于物理的渲染（简称\
  \ PBR），我们还可以以材质的形式对表面属性进行建模。有了这样的 PBR 材质，就很容易创建\n\n\n![](img/3cfb9832c943f5f7366fd104b5255971_501_0.png)\n\
  \n图14.5：一个木箱，以天空盒为背景\n\n使用天空盒的效果在移动视角时最为明显。在如图14.5所示的静态图片中，可以看出木箱与天空盒之间的区别。\n\n\
  在本节末尾，我们将为虚拟世界实现一个天空盒。\n\n## 光影效果\n\n当前顶点着色器使用一个硬编码的光源作为虚拟太阳，从固定位置向世界发射白光。这种基础光照有助于识别关卡几何体和实例的尺寸，即使仅使用平面着色也是如此。通过向虚拟世界添加更多光源，可以更逼真地模拟其他发光物体，如灯、灯笼、火焰或火把。在黑暗处闪烁的火光可以用来营造各种紧张感，因为它可能意味着一个安全的过夜之处，也可能是一个敌人的位置。\n\
  \n图14.6中的场景由数千个不同颜色的光源照亮：\n\n![](img/3cfb9832c943f5f7366fd104b5255971_502_0.png)\n\
  \n图14.6：虚拟世界中的多光源（图片由Hannes Nevalainen提供）\n\n图14.6中的图像是Hannes Nevalainen为jMonkeyEngine制作的技术演示，可以看到许多独立光源的效果。完整视频可在“其他资源”部分找到。\n\
  \n当添加光源时，也应实现阴影。作为一个简单的开始，虚拟太阳投射的物体阴影可以使用所谓的阴影映射投影到地面上，从而营造出源自真实世界的光影印象。其他光源的阴影也可以添加，尽管实现更为复杂。但视觉效果将弥补这些努力，因为一盏灯只将窗户被照亮的部分投射到地面上，会让程序员脸上露出满意的笑容。\n\
  \n图14.7由Sascha Willens编写的Vulkan示例代码生成（代码可在 https://github.com/SaschaWillems/Vulkan/tree/master/examples/pbribl\
  \ 获取），展示了使用级联阴影贴图创建的树木阴影：\n\n![](img/3cfb9832c943f5f7366fd104b5255971_503_0.png)\n\
  \n图14.7：树木的级联阴影贴图\n\n与天空盒类似，当光源、物体和/或摄像机移动时，阴影贴图的效果会更为明显。像图14.7中的阴影是虚拟世界的一个绝佳补充。\n\
  \n## 打造逼真的水面效果\n\n如果将水添加为扩展关卡环境的一部分，还应对其视觉外观进行检查和增强。虽然使用简单、静态的透明水纹理可能适合首次实现，但迟早会产生打造更逼真水面的冲动。\n\
  \n通过结合反射、折射以及光线照射到虚拟水面时的扭曲效果，可以创建逼真的水面。如果玩家能够潜入水中，还可以利用另一种扭曲来营造水下的错觉。\n\n图14.8展示了Evan\
  \ Wallace用WebGL制作的水模拟（代码可在 https://github.com/evanw/webgl-water/blob/master/index.html\
  \ 获取）：\n\n![](img/3cfb9832c943f5f7366fd104b5255971_504_0.png)\n\n图14.8：具有波浪和水下焦散效果的逼真水面（图片由Evan\
  \ Wallace提供）\n\n在图14.8中，可以看到球体落入水中产生的波浪。此外，由水产生的池壁折射以及光线在池底的折射也清晰可见。\n\n## 添加惊艳的后处理效果\n\
  \n为了在虚拟世界中获得更逼真的效果，可以向渲染器添加后处理效果。可能的效果列表很长，所以这里仅简要列出一些可以快速实现且能带来出色视觉效果的想法：\n\n-\
  \ 镜头光晕，模拟透过相机观察的错觉\n- 上帝光线：当直视太阳的视线被遮挡时，薄雾中可见的光线\n- 泛光效果，模拟发光物体\n- 运动模糊，当视图移动时使图像模糊\n\
  - 景深，使清晰中心周围的世界模糊\n- 屏幕空间环境光遮蔽，使缝隙和边缘变暗\n- 屏幕空间反射，一种创建反射表面的廉价方式\n\n所有这些效果都是通过使用着色器创建的，并对性能有不同的影响。然而，即使只是这里列出的一小部分效果，也能大幅提升视觉外观。\n\
  \n图14.9展示了两种后处理效果：泛光（Bloom）和屏幕空间环境光遮蔽（SSAO）。泛光效果是使用LearnOpenGL（https://learnopengl.com/）的代码（作者Joey\
  \ de Vries，https://x.com/JoeyDeVriez）创建的，SSAO图片则是使用Sascha Willems的Vulkan示例代码制作的（代码可在\
  \ https://github.com/SaschaWillems/Vulkan/tree/master/examples/pbrb1 获取）：\n\n![](img/3cfb9832c943f5f7366fd104b5255971_505_0.png)\n\
  \n图14.9：泛光（左）和SSAO（右）\n\n在图14.9的左侧，显示的是泛光效果。泛光效果的特征部分是光源周围的辉光效应。对于绿色光源，光线甚至覆盖了木箱的左上边缘。\n\
  \n在图14.9的右侧，显示的是SSAO效果。SSAO效果可能很细微，但确实可见：注意白色线条右侧窗帘下方的地板。阴影营造出窗帘后面房间更暗的错觉。\n\n##\
  \ 升级到光线追踪\n\n作为迈向真实感的下一步，光线追踪可以作为可选增强功能添加。\n\n光线追踪使用从摄像机发出的虚拟光线，通过追踪光线在虚拟世界中与物体的碰撞来计算最终的像素颜色。虚拟光线不仅使用物体颜色，还遵循物理规律进行反射，直至累积的光量低于阈值。\n\
  \n借助光线追踪，可以实现诸如全局光照之类的效果，使黑暗区域被物体反射的光照亮，或者实现逼真的反射。想象一下，你跑过一间满是镜子的房间，多次看到自己的角色，以正确的物理方式绘制出来。\n\
  \n图14.10展示了来自Sascha Willems的Vulkan代码中的一个光线追踪示例所创建的场景（代码可在 https://github.com/SaschaWillems/Vulkan/tree/master/examples/pbr1bl\
  \ 获取）：\n\n![](img/3cfb9832c943f5f7366fd104b5255971_506_0.png)\n\n图14.10：实时光线追踪场景\n\
  \n图14.10中地板、球体和茶壶上的反射是使用Vulkan API在Nvidia RTX 4000系列GPU上通过光线追踪实时计算的。\n\n其中的FPS计数器旨在展示当前这一代GPU生成光线追踪图像的速度。就在几十年前，同样图像的一帧需要数天才能渲染完成。\n\
  \n## 光线追踪应为可选功能\n\n请注意，光线追踪的计算需要大量计算能力，而要实时创建复杂场景，需要支持光线追踪的GPU和图形API。目前，只有Vulkan和DirectX\
  \ 12能够使用现代GPU的光线追踪功能。在切换到启用光线追踪的图形管线之前，您需要检查硬件和软件支持的可用性。\n\n## 深入虚拟现实\n\n尽管虚拟现实（VR）仍然是一个小众领域，但实现VR支持可以大大提升沉浸感。玩家不仅能在平面屏幕上看到虚拟世界，还能置身于世界中央，这可能成为一个难忘的时刻。利用头部追踪让虚拟摄像机与玩家的头部同步移动，并为VR控制器添加虚拟双手，这创造了许多新的交互方式。\n\
  \n图14.11展示了Godot XR Tools演示中的一个场景（代码可在 https://github.com/GodotVR/godot-xr-template\
  \ 获取）：\n\n![](img/3cfb9832c943f5f7366fd104b5255971_507_0.png)\n\n图14.11：Godot XR\
  \ Tools 演示\n\n图14.11中最引人注目的细节是两只虚拟手。通过使用Valve Index®控制器内置的传感器，不仅可以推算控制器在全部6个自由度上的位置，还可以跟踪单个手指，从而支持基于手指位置的手势或操作。\n\
  \n在完成本节的理论部分后，我们现在将为应用程序添加一个天空盒，作为全局背景。\n\n\n\n\n\n## 实践：为虚拟世界添加天空盒\n\n虚拟天空是虚拟世界的一个很好的补充，尤其是在任何开放区域的上方，如图\
  \ 14.5 所示。\n\n## 探索技术细节\n\n从技术角度来看，天空盒是从应用在单位立方体内侧的纹理绘制的。图 14.12 显示了立方体以及放置在立方体中心的虚拟相机周围的坐标：\n\
  \n图 14.12：从立方体贴图的内部采样的区域\n\n在图 14.12 中，立方体的红色区域将被采样以创建当前帧的背景。请注意，该区域在立方体的角落处环绕，但这无需担心。两个图形库都会处理此类边缘情况（双关语在此）并会采样两个受影响的立方体侧面的相应区域。\n\
  \n立方体贴图纹理通常存储为六张单独的图像，或作为一张图像，其中立方体的各面位于图像中的特定位置。图 14.13 显示了由 Jockum Skoglund（又名\
  \ hipshot – https://opengameart.org/content/stormy-days-skybox）制作的天空盒纹理，采用常用格式以及立方体面：\n\
  \n在图 14.13 的左侧，显示了一个用于天图的示例立方体贴图纹理。你会发现许多立方体贴图纹理都是这种十字形。在图 14.13 的右侧，列出了立方体贴图纹理的每个较小子图像的立方体面。请记住，OpenGL\
  \ 和具有反转视口的 Vulkan 的负 Z 轴指向虚拟世界内部，因此 -Z 为前图像。\n\n另一个值得注意的细节是立方体贴图图像的失真。由于立方体贴图纹理应用于立方体，但我们周围的虚拟天空可视为一个球体，因此立方体贴图纹理的像素必须进行调整，使其看起来像是图像是在球体内部的相机拍摄的。\n\
  \n在图 14.14 中，显示了立方体内投影与球体内投影之间的差异：\n\n正如你在图 14.14 左侧所见，从立方体贴图采样的采样点与球体表面上的位置之间的差异越大，我们越接近立方体贴图一侧的边缘。在图\
  \ 14.14 右侧，从立方体贴图采样出的区域以及所需投影到球体表面的区域被高亮显示为黑色条。你可以看到两个区域的大小和角度都不同。在为天空盒构建立方体贴图纹理时，必须对每个立方体面的图像应用球面失真，以创建逼真的天空。\n\
  \n## 实现天空盒\n\n将天空盒添加到代码中只需要几个组件：\n\n- 新的顶点和网格类型\n- 一个新的顶点缓冲\n- 一个包含面坐标的单位立方体模型。\n\
  - 一个新的着色器\n- 从文件加载立方体贴图纹理\n\n我们首先在 opengl 文件夹中的 OGLRenderData.h 文件中创建一个名为 OGLSkyboxVertex\
  \ 的新顶点类型和一个名为 OGLSkyboxMesh 的新网格类型：\n\n```cpp\nstruct OGLSkyboxVertex {\n    glm::vec4\
  \ position = glm::vec4(0.0f);\n};\n\nstruct OGLSkyboxMesh {\n    std::vector<OGLSkyboxVertex>\
  \ vertices{};\n};\n```\n\n与往常一样，对于 Vulkan，这两个新的结构体元素必须添加到 vulkan 文件夹中的 VkRenderData.h\
  \ 文件中。有关 Vulkan 实现的所有细节，请查看渲染器类文件 VkRenderer.cpp。\n\n虽然我们可以重用模型的顶点缓冲，但这样做会浪费大量资源，因为立方体只需要顶点的位置数据。新的顶点缓冲类\
  \ SkyboxBuffer 仅使用新顶点结构体 OGLSkyboxVertex 的位置元素：\n\n```cpp\nglVertexAttribPointer(0,\
  \ 4, GL_FLOAT, GL_FALSE,\n    sizeof(OGLSkyboxVertex),\n    (void*) offsetof(OGLSkyboxVertex,\
  \ position));\n\nglEnableVertexAttribArray(0);\n```\n\n对于立方体模型，我们创建一个名为 SkyboxModel\
  \ 的类，返回一个由 36 个顶点组成的 OGLSkyboxMesh，每个面使用两个三角形。在所有三个轴上，模型坐标要么为 1.0，要么为 -1.0，定义一个单位立方体。\n\
  \n## 第 14 章\n\n新的顶点着色器名为 skybox.vert 输出一个包含 3 维纹理坐标的 vec3。由于我们位于立方体内部，因此需要 3 维坐标：\n\
  \n```cpp\nlayout (location = 0) out vec3 texCoord;\n```\n\n在顶点着色器的 main() 方法中，我们首先反转投影矩阵并转置视图矩阵：\n\
  \n```cpp\nmat4 inverseProjection = inverse(projection);\nmat3 inverseView = transpose(mat3(view));\n\
  ```\n\n对于视图矩阵，我们可以使用更便宜的转置操作而不是求逆矩阵，因为我们需要去掉平移部分以阻止立方体随相机移动。\n\n通过将逆矩阵与立方体的传入点位置相乘，我们计算出世界空间中的纹理坐标：\n\
  \n```cpp\ntexCoord = inverseView * (inverseProjection * aPos).xyz;\n```\n\n现在，采样的纹理坐标来自立方体的内部，如图\
  \ 14.12 所示。\n\n作为顶点着色器的最后一步，我们将 GLSL 内部变量 gl_Position 设置为传入的顶点位置：\n\n```cpp\ngl_Position\
  \ = aPos.xyww;\n```\n\n通过将 gl_Position 的 z 分量设置为 w 分量的值，我们确保立方体贴图的像素绘制在远 Z 平面上，创建不会被其他像素覆盖的背景。\n\
  \n新的片段着色器 skybox.frag 使用传入的纹理坐标在立方体贴图中查找纹理数据：\n\n```cpp\nlayout (location = 0) in\
  \ vec3 texCoord;\nlayout (location = 0) out vec4 FragColor;\nuniform samplerCube\
  \ tex;\nvoid main() {\n    FragColor = texture(tex, texCoord);\n}\n```\n\n请注意，纹理\
  \ tex 的类型是 samplerCube 而不是像其他片段着色器上的 sampler2D。\n\n立方体贴图纹理的加载在 Texture 类中完成。在新的\
  \ loadCubemapTexture() 方法中，我们加载图 14.13 所示的图像并提取六张图像。由于纹理映射侧定义的值按升序排列，因此我们只需使用第一个侧定义\
  \ GL_TEXTURE_CUBE_MAP_POSITIVE_X 并为剩余的侧添加一个整数值即可上传：\n\n```cpp\nglTexImage2D(GL_TEXTURE_CUBE_MAP_POSITIVE_X\
  \ + face, 0, GL_SRGB8_ALPHA8, cubeFaceWidth, cubeFaceHeight, 0, GL_RGBA, GL_UNSIGNED_BYTE,\
  \ subImage.data());\n```\n\n有关立方体贴图纹理加载的完整实现，请查看 Texture 类中的详细信息。\n\n## 绘制天空盒\n\n\
  现在将天空盒带到屏幕上分为两个步骤。首先，我们在 OGLRenderer.cpp 渲染器类文件的 init() 方法中将单位立方体模型数据上传到顶点缓冲：\n\n\
  ```cpp\nmSkyboxModel.init();\nOGLSkyboxMesh skyboxMesh = mSkyboxModel.getVertexData();\n\
  mSkyboxBuffer.uploadData(skyboxMesh.vertices);\n```\n\n然后，在绘制关卡数据之前，我们使用新的着色器、绑定纹理并从顶点缓冲绘制立方体来绘制天空盒：\n\
  \n```cpp\nmSkyboxShader.use();\nmSkyboxTexture.bindCubemap();\nmSkyboxBuffer.bindAndDraw();\n\
  mSkyboxTexture.unbindCubemap();\n```\n\n对于 Vulkan，我们还在 VkRenderData.cpp 文件的 init()\
  \ 方法中上传天空盒模型和纹理，在 draw() 方法中绑定天空盒管线并在关卡数据之前绘制天空盒模型。\n\n对于 OpenGL 和 Vulkan 渲染器，在绘制天空盒作为第一个对象时应进行一个简单的更改：禁用深度测试功能。没有深度测试，天空盒纹理会覆盖之前颜色缓冲的所有值，作为剩余对象的全局背景，例如关卡数据和实例。就这样。\n\
  \n如果一切都添加正确，关卡上方崭新而辉煌的天空可以在图 14.15 中看到（该图像由 Zarudko 创建的 glTF 关卡制作 https://skfb.ly/6Qyjw，使用由\
  \ Jockum Skoglund（又名 hipshot – https://opengameart.org/content/stormy-days-skybox）创建的纹理作为天空盒）：\n\
  \n图 14.15：启用天空盒的示例关卡\n\n正如你在图 14.15 中看到的，天空盒为具有开放区域的关卡带来了真实世界的感觉。而且由于立方体在视图变化时不会像关卡数据那样移动，因此创造了无限遥远的天空的错觉。\n\
  \n但即使拥有出色的图形和酷炫的音效和音乐，仍有改进的空间。虚拟世界的环境仍然有些静态，所以让我们为世界本身添加变化。\n\n## 通过昼夜和天气增强沉浸感\n\
  \n尽管它们是我们生活中自然现象，但昼夜循环、天气效果和不同季节在计算机游戏中很少使用。但所有这些方面都可以极大地增强游戏的沉浸感。根据内部时钟对虚拟世界进行轻微更改，有助于创建一个玩家希望停留更长时间以体验完整循环的环境。\n\
  \n\n\n\n\n## 添加昼夜循环\n\n昼夜循环会给游戏增添某种熟悉感。看着太阳升起或欣赏绚丽的日落，在正午或深夜穿越世界时观察种种变化……每一个方面都会让玩家想起自己身处一个更真实的世界。如果不仅光照发生变化，其他角色和动物也会对一天中的时间作出反应，沉浸感就会越来越好。例如，也许可以只在夜晚看到某些动物，只在早上看到孩子，角色在某个时间出现在工作场所，下午则去酒吧。\n\
  \n游戏内的时间可以比真实时间快得多，将一整天压缩到几分钟。如果频繁需要的事件只发生在一天中的特定时间，这种加速会很有帮助。\n\n昼夜循环最受欢迎的例子之一是《我的世界》（Minecraft）。在《我的世界》中，默认情况下一个完整的一天持续\
  \ 20 分钟，分为 10 分钟的白天和 10 分钟的夜晚。由于光照水平会变化，敌对生物的生成以及食物和树木的生长在白天和夜晚的表现也完全不同。\n\n图 14.16\
  \ 展示了我们的应用程序中同一地点在正午和夜晚的样子：\n\n![](img/3cfb9832c943f5f7366fd104b5255971_514_0.png)\n\
  \n如图 14.16 所示，即使只是简单改变虚拟世界的整体亮度，也能产生巨大的差异。而根据一天中的时间改变世界更多的属性，将为玩家带来更强的沉浸感。\n\n##\
  \ 允许时间快进\n\n在处理时间时，有一个事实不容低估：等待某个事件发生的时间可能很无聊，而且过得很慢。与其让玩家等待整整一天或一夜过去，不如加入特殊的“时间旅行”事件，例如睡过一夜，或在壁炉旁等待时间流逝，让游戏快进游戏内的时间。\n\
  \n## 实时游玩\n\n在思考游戏中的时间时，将虚拟世界的时间与真实世界的时间同步会是一个有趣的选择。只有少数游戏使用了这一功能。此外，如果任务或委托与一天中的特定时间绑定，解决它们可能会更加复杂。但在游戏中体验“当下”也许很有趣。\n\
  \n## 崇拜天气之神\n\n不仅一天中的时间会改变世界，天气变化也会极大地影响角色、动物和环境。雷雨天气时，最好的建议是待在室内；大雨可能非常嘈杂，以至于其他声音根本无法传入玩家耳中；新雪也会吸收噪音。因此，在不同天气状态下漫游，会对同一个世界产生截然不同的印象。\n\
  \n雾等环境变化也会改变对虚拟世界的感知。\n\n图 14.17 展示了我们的应用程序中不同类型的雾：\n\n![](img/3cfb9832c943f5f7366fd104b5255971_515_0.png)\n\
  \n图 14.17：第 14 章示例代码中的雾效\n\n在图 14.17 的左侧，虚拟世界完全没有雾，呈现晴朗的白天。在图 14.17 的中间，添加了浓雾，使世界在短距离后逐渐消失。在几款老游戏中，由于早期游戏引擎的渲染限制，雾被用来隐藏物体的出现和消失。最后，在图\
  \ 14.17 的右侧，灯光颜色被调整为绿色调，在地图的街道上营造出有毒雾气的错觉。\n\n## 聆听季节的神谕\n\n在昼夜循环和天气之后的下一步进化，就是实现四季。春、夏、秋、冬之间的轮换是一个绝佳机会，可以为虚拟世界带来更多真实感，因为角色的行为或动物的外观会随着一年中的时间而变化。\n\
  \n与游戏内一天的长度一样，虚拟的一年也应缩短为合理的真实时间；或者，如果当前季节的所有任务都已完成，应允许使用时间快进功能。让玩家毫无理由地等待会扼杀他们的热情。\n\
  \n根据季节改变世界属性的一个好例子是任天堂为 GameBoy Color 推出的《塞尔达传说：季节之神谕》（Legend of Zelda: Oracle of\
  \ Seasons）。尽管这款游戏年代久远，但季节变化实现得非常细致，玩家只能在特定季节进入世界的某些区域。例如，河流只在冬天结冰，雪原会抬高部分地形；而只有在夏天，花朵的卷须才能让林克爬上墙壁。\n\
  \n在 Eric Barone 的《星露谷物语》（Stardew Valley）中，季节也是游戏玩法的关键元素。四个季节中的每一个都会影响游戏的不同部分，比如作物生长。一个季节持续\
  \ 28 个游戏日，通过加速时间，《星露谷物语》中的一整年会在 26 小时的游戏时间内过去。\n\n对于我们的应用程序，我们将创建简单的昼夜光照变化和雾效作为示例。让我们从白天和夜晚开始吧。\n\
  \n## 动手实践：添加昼夜\n\n改变光源的颜色和位置很容易。大多数片段着色器已经包含一个固定的光源定义，以便更好地可视化实例和关卡数据。\n\n## 实现光照控制\n\
  \n作为第一步，我们在所有存在 Matrices 的顶点和片段着色器中，向 Matrices uniform 添加两个新变量 lightPos 和 lightColor：\n\
  \n```\nlayout (std140, binding = 0) uniform Matrices {\n  ...\n  vec4 lightPos;\n\
  \  vec4 lightColor;\n};\n```\n\n在 lightPos 中，我们将传入光源的当前位置，从而模拟太阳或月亮在虚拟世界中的位置；在 lightColor\
  \ 中，我们将光源颜色传输到 GPU，从而模拟日出、正午、日落等场景。\n\n由于我们在 CPU 端将包含视图矩阵和投影矩阵的 uniform 缓冲区的数据类型定义为\
  \ glm::mat4，因此我们必须将用于光源位置和颜色的两个 glm::vec4 向量作为 glm::mat4 的前两个元素，并在绘制帧之前上传到 GPU：\n\
  \n```\nglm::mat4 lightMatrix = glm::mat4(lightPos, lightColor,\n    glm::vec4(),\
  \ glm::vec4());\nmatrixData.emplace_back(lightMatrix);\n```\n\n现在，所有包含光源定义的片段着色器都可以通过更好的光照控制来调整表面效果。\n\
  \n我们在 main() 方法中开始新的着色器代码，首先定义环境光强度：\n\n```\nfloat ambientStrength = 0.1;\nvec3\
  \ ambient = ambientStrength * max(vec3(lightColor),\n    vec3(0.05, 0.05, 0.05));\n\
  ```\n\n环境光强度用于模拟来自其他表面的光线散射，从而在虚拟世界中提供某种最低限度的光照。通过限制最低环境光，我们还能防止渲染出的画面变得漆黑一片。\n\n\
  接下来，我们使用三角形法线与光源方向之间的夹角来计算漫反射部分：\n\n```\nvec3 norm = normalize(vec3(normal));\n\
  vec3 lightDir = normalize(vec3(lightPos));\n```\n\n最后，我们探索了昼夜循环、天气和季节这些改变虚拟世界环境的元素。仅仅是一个简单的昼夜循环，就已经为虚拟世界增添了许多有趣的机遇，例如只能在一天中的特定时间遇到电脑控制的角色或动物，或者只能在夜晚出现的敌人。天气效果和季节也提供了更多根据当前环境改变行为的选项。\n\
  \n那么……接下来该做什么呢？嗯，这完全取决于你！\n\n你可以先学习如何使用 Blender 创建自己的动画角色、动物、物体和关卡。创建的资源不一定需要达到最新游戏的质量；即使是低多边形世界也很有魅力，并且拥有许多粉丝。有很多书籍、教程和视频可供参考，涵盖了虚拟世界的各种不同艺术风格。\n\
  \n那添加更多物体呢？车辆和动物会丰富虚拟世界，而门和按钮则会带来更多与世界互动的方式。为了获得更好的重力效果，你甚至可以在应用程序中添加物理引擎，从而实现其他酷炫功能，例如物体碰撞时的力分布。\n\
  \n你也可以使用正交投影相机来探索世界。以等距投影或仅从侧面观察玩家、其他角色和环境，可能会开启新的叙事方式。由于等距投影和侧视图都只是三维世界的不同视角，本章提到的所有选项在使用正交投影时同样适用。\n\
  \n另一个想法是为玩家创建故事线和任务。迫使玩家在不同地点之间移动并与不同角色互动，以解锁更多任务、物品或门，或者只是为了获得任务谜题的下一块拼图，这样可以让玩家在你的游戏中停留更长时间。\n\
  \n或者，你可以深入研究 SDL 的网络部分，创建一个小型网络服务器，让你能与朋友一起探索虚拟世界。作为团队在关卡中漫游并解决问题是令人满足的，同时也会给任务系统带来新的复杂性，因为你可能会或不会允许玩家利用他们远距离共享的任务信息。\n\
  \n但接下来最重要的一步是：保持好奇心，不断尝试代码。\n\n\n\n\n\n## 实践环节\n\n以下是你可以对代码做出的一些补充：\n\n- 添加一个按钮来重新加载资源文件夹中的音乐曲目。\n\
  \  一个不错的功能，可以动态添加或移除曲目。\n- 为实例添加更多音效。\n  你可以为实例的每个动作映射一个音效片段，在控制所选实例时营造更逼真的效果。\n\
  - 根据地面材质播放脚步声。\n  这里，你需要加载多于一对行走和奔跑的脚步声。适当的声音效果可以通过使用地面三角形的网格类型作为脚步声音效的索引来选择。\n\
  - 添加附近实例的声音。\n  SDL_mixer 库允许我们为每个通道设置音量和平衡。使用周围实例的距离和角度可以用来计算声音的有效音量和方向。\n- 在地图上的特殊位置播放环境音。\n\
  \  类似于路点模型，你可以使用小型模型作为标记来播放环境音。和附近实例的声音一样，环境音的音量和平衡可以调整以符合预期。\n- 添加音乐切换的标记。\n  此任务与环境音密切相关。你可以使用模型和/或节点来在控制的实例进入地图的特定区域或与其他实例交互时切换音乐。\n\
  - 根据关卡位置调整关卡颜色和雾效。\n  不仅在游览关卡时可以更改音乐；光照和雾效设置也可以调整。例如，进入洞穴时，可以降低环境光并提高雾密度。\n\n##\
