- '# 第1部分


  ## 用游戏填充世界


  ### 填充世界


  ### 角色模型


  本书的第一部分从对 Assimp 的介绍开始，即 Open Asset Import Library。你将学习如何从文件中加载角色模型，如何处理角色的各个元素，例如网格、纹理和节点，以及如何将模型绘制到屏幕上。你还将学习如何通过使用计算着色器将计算负载转移到
  GPU，从而释放 CPU 用于书中介绍的功能。最后，你将探索视觉选择的想法和实现，使你能够通过鼠标单击在屏幕上选择一个模型实例。


  本部分包含以下章节：


  - 第1章，使用 Open Asset Import Library

  - 第2章，将动画计算从 CPU 转移到 GPU

  - 第3章，添加视觉选择

