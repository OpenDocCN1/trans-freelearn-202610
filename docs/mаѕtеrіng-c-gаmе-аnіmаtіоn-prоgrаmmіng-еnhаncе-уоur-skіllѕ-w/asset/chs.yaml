  \nFigure 1.9: Asset importer library and includes\n\n我们必须使本节讨论的所有文件对本书中的所有示例都可用。为此，有两个选项可用——将文件复制到固定路径或添加环境变量。\n\
  \n## Copying the Assimp files\n\n首先，在你的计算机上创建此文件夹：\n\n```\nC:\\Program Files\\assimp\n\
