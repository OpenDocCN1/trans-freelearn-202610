- "## 12 高级碰撞检测\n\n欢迎来到*第12章*！在上一章中，我们向虚拟世界添加了加载静态关卡数据的能力。现在实例不再需要在空中奔跑；它们可以拥有一个虚拟家园。首先，我们探讨了模型与关卡数据之间的差异，哪些文件格式主要用于关卡数据，以及如何在互联网上找到游戏地图。然后，我们添加了加载关卡数据的代码，并将二维四叉树替换为三维八叉树。最后，我们实现了关卡数据渲染，包括线框、八叉树和关卡AABB线的调试数据。\n\
  \n在本章中，我们将扩展上一章的关卡数据。首先，我们将为关卡数据添加一个专用的八叉树，并更新代码，使其同时支持实例与关卡几何体之间的碰撞检测。然后，我们将在虚拟世界中添加一种简化形式的重力，使实例保持在地面高度，而不是四处漂浮。最后，我们将为实例的腿部引入逆运动学，使实例能够以更自然的腿部动作爬坡和爬楼梯，并防止脚部陷入地面或悬在空中。\n\
  \n在本章中，我们将介绍以下主题：\n\n- 增强关卡数据的碰撞检测\n- 使用重力使实例保持在地面高度\n- 添加逆运动学\n\n### 技术要求\n\n本章的示例代码位于\
  \ `chapter12` 文件夹中，其中 `01_opengl_adv_collision` 子文件夹对应 OpenGL，`02_vulkan_adv_collision`\
  \ 子文件夹对应 Vulkan。\n\n### 增强关卡数据的碰撞检测\n\n为了加速实例与关卡几何体之间的碰撞检测，我们将为关卡数据创建空间分区结构，例如八叉树。但不同于将关卡三角形添加到实例八叉树中，我们单独为三角形数据构建一个专用的八叉树。\n\
  \n**添加一种新的八叉树类型**\n\n为关卡数据使用独立的数据结构，比试图在现有八叉树中混合两种数据类型更有意义，原因如下：\n\n- 关卡数据是静态的，而实例位置频繁变化。每次实例位置变化时，我们都需要对使用率相当高的八叉树进行昂贵的更新，在移除并重新添加实例时，可能会导致大量额外的拆分和合并操作。\n\
  - 关卡数据和实例的细分数量可能完全不同，这取决于关卡的复杂程度和实例的数量。如果只有少量实例在精细的关卡中漫游，在搜索附近的三角形或实例时可能会产生巨大的开销。\n\
  - 我们为了简单而使用八叉树处理关卡数据，但其他数据结构，如BSP树或**边界体积层次结构（BVHs）**，更为常见。由于BSP树和BVH无法像我们的八叉树那样快速动态更新，因此仍然有必要将关卡数据和实例分开。\n\
  \n通过两个不同的八叉树，我们可以克服上述问题。在添加所有关卡三角形后，关卡数据八叉树保持不变；两个八叉树各自拥有自己的细分，具体取决于每个八分区中的数据量。但我们仍然可以通过在关卡八叉树中使用实例包围盒来合并信息。\n\
  \n作为关卡八叉树的第一步，我们在 `opengl` 文件夹中的 `OGLRenderData.h` 文件中添加一个名为 `MeshTriangle` 的新结构体：\n\
  \n```cpp\nstruct MeshTriangle {\n    int index;\n    std::array<glm::vec3, 3> points;\n\
  };\n```\n\n\n\n\n\n```\nBoundingBox3D boundingBox;\n};\n```\n\n对于 Vulkan，三角形结构体将被添加到\
  \ vulkan 文件夹中的 `VkRenderData.h` 文件中。\n\n`index` 成员主要用于调试目的，当某些三角形无法添加到八叉树时，它会被添加到日志输出行中。在\
  \ `points` 数组中，我们保存三角形三个点中每个点的世界坐标。世界坐标是创建三角形正确包围盒所必需的；我们稍后还会将世界坐标用于碰撞检测。`boundingBox`\
  \ 成员包含关卡数据网格中每个三角形的 AABB。\n\n在八叉树中使用包围盒而不是实际三角形数据，可以大大简化查询操作，因为我们在搜索碰撞时无需检查每个三角形的精确轮廓。使用\
  \ AABB 可能会导致需要检查更多的三角形，但 AABB 检查的成本很低，因为我们最多只需进行六次简单的浮点数比较。由于关卡几何体的大部分区域要么是墙壁，要么是地面，AABB\
  \ 的额外尺寸并不重要。\n\n接下来，我们添加名为 `TriangleOctree` 的新八叉树类。这个新的三角形八叉树将在 octree 文件夹中的两个新文件\
  \ `TriangleOctree.h` 和 `TriangleOctree.cpp` 中实现。\n\n`TriangleOctree` 类是普通 `Octree`\
  \ 类的副本，但有一些例外：\n\n- 我们在树中存储三角形数据，而不是实例索引。\n- 由于关卡数据八叉树将保持只读，我们不需要更新或移除对象或合并八分体的方法。\n\
  - 我们在三角形八叉树中只处理静态数据；搜索关卡三角形之间的相交不会为我们返回任何有用信息。因此，`findAllIntersections()` 和 `findIntersectionsInDescendants()`\
  \ 方法也可以跳过。\n\n除了在 *添加新八叉树类型* 一节中提到的为关卡数据使用单独八叉树的原因之外，我们还对不适合放入单个八分体的对象采用了不同的处理方法。\n\
  \n在实例八叉树中，实例的包围盒只在少数情况下会大于单个八分体，例如当实例被大幅缩放时。但在关卡八叉树中，许多三角形的包围盒可能无法放入单个细分后的八分体。关卡创建者会尽量最小化关卡中三角形的数量，以获得良好的渲染性能，这导致关卡的部分区域仅由少数几个大三角形组成。\n\
  \n我们可以使用以下三种方法之一来克服尺寸问题：\n\n1. 将大三角形保留在足以容纳整个三角形的八分体中。这种解决方案会将额外对象存储在父节点中，而不只是叶子节点。\n\
  2. 将该三角形添加到所有受影响的细分八分体中。这样我们只会在叶子节点中保存数据，但在最坏的情况下会将三角形数据重复 8 次。\n3. 在八分体边界上拆分三角形，并且只将子三角形添加到每个八分体。同样，每个受影响的八分体会多出一个三角形，而且分割线还可能产生舍入误差问题。\n\
  \n为了保持代码简单，我们将使用第一种方法，并且只将任何超出细分八分体尺寸的三角形添加到父八分体中。\n\n我们可以在 `add()` 和 `split()`\
  \ 方法中通过两步检查来实现超大三角形的存储过程。首先，我们遍历所有子八分体，以查找三角形与子八分体边界可能存在的相交：\n\n```\nint intersectingChildren\
  \ = 0;\nfor (int i = 0; i < node->childs.size(); ++i) {\n    BoundingBox3D childBox\
  \ = getChildOctant(box, i);\n    if (childBox.intersects(triangle.boundingBox))\
  \ {\n        intersectingChildren++;\n    }\n}\n```\n\n如果发现与子八分体存在相交，我们就递增 `intersectingChildren`\
  \ 变量。然后，在 `add()` 方法中，我们检查该三角形会与多少个子八分体相交。如果超过一个八分体，则三角形保留在当前八分体中：\n\n```\nif (intersectingChildren\
  \ > 1) {\n    node->triangles.emplace_back(triangle);\n} else {\n    int i = getOctantId(box,\
  \ triangle.boundingBox);\n    if (i != -1) {\n        add(node->childs.at(i), depth\
  \ + 1,\n            getChildOctant(box, i), triangle);\n    }\n}\n```\n\n同样，对于 Vulkan，这两个变量会被添加到\
  \ vulkan 文件夹中 `VkRenderData.h` 文件的 `VkRenderData` 结构体中。\n\n在渲染器的 `init()` 方法中，会调用\
  \ `initTriangleOctree()` 来创建具有给定阈值和最大深度的八叉树：\n\n```\nvoid OGLRenderer::initTriangleOctree(int\
  \ thresholdPerBox,\n    int maxDepth) {\n    mTriangleOctree = std::make_shared<TriangleOctree>(\n\
  \        mWorldBoundaries, thresholdPerBox, maxDepth);\n}\n```\n\n世界边界在关卡 AABB 生成期间更新，因此加载关卡后，我们的三角形八叉树与关卡数据的大小完全相同。\n\
  \n填充关卡数据八叉树是在 `generateLevelOctree()` 方法中完成的。我们这里只介绍重要部分，因为外层代码只是对 `ModelInstanceCamData`\
  \ 结构体的 `micLevels` 向量中的所有关卡进行循环。\n\n对于 `micLevels` 中的每个关卡，我们以用于绘制关卡的优化网格形式获取关卡网格。然后，我们遍历关卡网格的所有索引：\n\
  \n```\nstd::vector<OGLMesh> levelMeshes =\n    level->getLevelMeshes();\nglm::mat4\
  \ transformMat =\n    level->getWorldTransformMatrix();\nglm::mat3 normalMat =\n\
  \    level->getNormalTransformMatrix();\nfor (const auto& mesh : levelMeshes) {\n\
  \    int index = 0;\n    for (int i = 0; i < mesh.indices.size(); i += 3) {\n```\n\
  \n对于 Vulkan，`levelMeshes` 向量将包含 `VkMesh` 数据类型。\n\n我们必须使用索引来绘制三角形，因为三角形数据是基于索引存储的；直接使用顶点不会为我们提供推断三角形顶点的正确信息。我们还从关卡中获取世界变换矩阵和法线变换矩阵。法线变换矩阵就是世界变换矩阵的逆矩阵的转置；添加\
  \ `getNormalTransformMatrix()` 方法是为了将这些额外的变换保留在 `AssimpLevel` 类中。\n\n每当添加或移除关卡数据时，通过调用\
  \ `generateLevelOctree`，我们可以确保八叉树拥有所有三角形的正确世界坐标。实现关卡变化时更新的最佳方法是将八叉树更新与已经实现的关卡数据\
  \ AABB 更新绑定在一起。\n\n为了实现这种耦合，我们添加一个名为 `generateLevelVertexData()` 的新私有方法，并在其中调用 AABB\
  \ 和八叉树的生成：\n\n```\nvoid OGLRenderer::generateLevelVertexData() {\n    generateLevelAABB();\n\
  \    generateLevelOctree();\n}\n```\n\n然后，所有出现的 `generateLevelAABB()` 都会被新的 `generateLevelVertexData()`\
  \ 方法替换，并且每当关卡数据或其他属性（如旋转或缩放）发生变化时，关卡八叉树也会随之更新。\n\n有了最新的关卡八叉树，我们最终可以检查实例是否与关卡几何体发生碰撞。\n\
  \n## 检测实例/关卡碰撞\n\n通过使用我们在第8章 *添加四叉树以存储邻近模型实例* 一节中用于实例/实例碰撞检测的相同策略，查找实例与关卡三角形之间的碰撞非常简单。我们只需遍历所有实例，获取实例的包围盒，并查询三角形八叉树以查找与该包围盒的碰撞。八叉树会向我们提供所有三角形，其中三角形的包围盒与实例的包围盒发生碰撞，即使该实例未存储在三角形八叉树中，也是如此。\n\
  \n要实现实例与关卡数据之间的碰撞检测，请按照以下步骤操作：\n\n1. 首先，我们在 `InstanceSettings.h` 文件的 `InstanceSettings`\
  \ 结构体中添加一个名为 `isCollidingTriangles` 的新成员，用于存储碰撞三角形：\n\n   ```\n   std::vector<MeshTriangle>\
  \ isCollidingTriangles{};\n   ```\n\n2. 然后，创建 `AssimpInstance` 类的一个新的公有方法 `setCollidingTriangles()`，将传入的三角形数据存储在实例设置中：\n\
  \n   ```\n   void AssimpInstance::setCollidingTriangles(\n       std::vector<MeshTriangle>&\
  \ collidingTriangles) {\n       mInstanceSettings.isCollidingTriangles =\n     \
  \  collidingTriangles;\n   }\n   ```\n\n\n\n3. 接下来，我们在渲染器中创建一个新的私有方法 `checkForLevelCollisions()`。我们首先获取实例设置并跳过空实例：\n\
  \n```\nvoid OGLRenderer::checkForLevelCollisions() {\n    for (const auto& instance\
  \ :\n        mModelInstCamData.micAssimpInstances) {\n        InstanceSettings instSettings\
  \ =\n            instance->getInstanceSettings();\n        if (instSettings.isInstanceIndexPosition\
  \ == 0)\n            continue;\n    }\n```\n\n4. 然后，我们只需使用实例的包围盒查询三角形八叉树：\n\n```\n\
  std::vector<MeshTriangle> collidingTriangles =\n    mTriangleOctree->query(instance->getBoundingBox());\n\
  ```\n\n5. 仅仅知道我们有碰撞是不够的，但我们想要存储碰撞数据以供进一步操作，例如对碰撞做出反应或绘制调试线。因此，我们将 `MeshTriangles`\
  \ 向量存储在实例设置中：\n\n```\ninstances.at(i)->setCollidingTriangles(\n    collidingTriangles);\n\
  }\n}\n```\n\n方法 `checkForLevelCollisions()` 被调用到渲染器的 `draw()` 方法中，在实例渲染之后、在 UI 绘制之前。现在所有实例在每一帧都会被检查是否与场景几何体发生碰撞，如果发现碰撞三角形，我们将其存储在实例的\
  \ `InstanceSettings` 中。\n\n尽管你可以相信碰撞检测的通用功能是可行的，但眼见为实。我们现在为各种场景数据添加额外的调试线，允许我们将可行信息作为覆盖在屏幕上的线条绘制出来。\n\
  \n## 绘制调试线\n\n如果我们想实时在屏幕上看到碰撞，我们可以在场景几何体中突出显示受影响的三角形。为了实现这种高亮，我们将遵循以下步骤：\n\n- 1.\
  \ 我们为渲染器添加一个新的私有成员 `mLevelCollidingTriangleMesh`，用于存储碰撞三角形网格：\n\n```\nstd::shared_ptr<OGLLineMesh>\n\
  mLevelCollidingTriangleMesh = nullptr;\n```\n\n- 2. 然后，在 `checkForLevelCollisions()`\
  \ 中，我们清空网格：\n\n```\nmLevelCollidingTriangleMesh->vertices.clear();\n```\n\n- 3.\
  \ 接下来，我们遍历所有碰撞三角形，将顶点成对添加到网格存储中，为三角形的每一边创建一个线段：\n\n```\nfor (const auto& tri : collidingTriangles)\
  \ {\nOGLLineVertex vert;\nvert.color = glm::vec3(1.0f, 0.0f, 0.0f);\nvert.position\
  \ = glm::vec4(tri.points.at(0), 1.0f);\nmLevelCollidingTriangleMesh->vertices.push_back(vert);\n\
  vert.position = glm::vec4(tri.points.at(1), 1.0f);\nmLevelCollidingTriangleMesh->vertices.push_back(vert);\n\
  vert.position = glm::vec4(tri.points.at(1), 1.0f);\nmLevelCollidingTriangleMesh->vertices.push_back(vert);\n\
  vert.position = glm::vec4(tri.points.at(2), 1.0f);\nmLevelCollidingTriangleMesh->vertices.push_back(vert);\n\
  vert.position = glm::vec4(tri.points.at(2), 1.0f);\nmLevelCollidingTriangleMesh->vertices.push_back(vert);\n\
  vert.position = glm::vec4(tri.points.at(0), 1.0f);\nmLevelCollidingTriangleMesh->vertices.push_back(vert);\n\
  }\n```\n\n- 4. 现在我们已为所有实例保存了检测到的三角形的轮廓。将三角形渲染到屏幕上可以通过一个简单的线条绘制调用完成：\n\n```\nmLineVertexBuffer.uploadData(*mLevelCollidingTriangleMesh);\n\
  if (mLevelCollidingTriangleMesh->vertices.size() > 0) {\n```\n\n```\nmLineShader.use();\n\
  mLineVertexBuffer.bindAndDraw(GL_LINES, 0,\n    mLevelCollidingTriangleMesh->vertices.size());\n\
  }\n```\n\n运行带有实例/场景碰撞和调试绘制的应用程序，结果的图片类似于图 12.1：\n\n![](img/3cfb9832c943f5f7366fd104b5255971_411_0.png)\n\
  \n图 12.1：实例与场景几何体的碰撞\n\n在图 12.1 中，实例与地面和多面墙发生碰撞。所有三角形都是通过其包围盒检测到的，因此如果实例仍距离三角形本身有一段距离时三角形被高亮显示，请不要惊慌。在这种情况下，三角形的包围盒被击中，其覆盖的区域比三角形本身更大。但检测到的碰撞中误报的数量很少，可能只会对碰撞检测的性能产生很小的影响。\n\
  \n为了让实例对与场景几何体的碰撞做出适当的反应，我们将下一步扩展节点树。\n\n## 扩展节点树以支持场景几何体碰撞\n\n得益于前几章建立的良好基础，添加一种新的碰撞类型只需几分钟，按照以下步骤操作即可：\n\
  \n- 1. 首先，我们在 `Enums.h` 文件中的 `nodeEvent` 枚举中添加新的事件类型：\n```\nenum class nodeEvent\
  \ : uint8_t {\n...\ninstanceToLevelCollision,\nNUM\n};\n```\n- 2. 我们还在渲染器 `init()`\
  \ 方法期间向 `micNodeUpdateMap` 添加一些文本，以便在节点树中添加名称：\n```\nmModelInstCamData.micNodeUpdateMap[\n\
  nodeEvent::instanceToLevelCollision] =\n\"Inst to Level collision\";\n```\n- 3.\
  \ 然后，在 `checkForLevelCollisions()` 中，如果我们至少有一个碰撞三角形，则触发新的事件：\n```\nif (collidingTriangles.size()\
  \ > 0) {\n mModelInstCamData.micNodeEventCallbackFunction(\n instSettings.isInstanceIndexPosition,\n\
  \ nodeEvent::instanceToLevelCollision);\n}\n```\n- 4. 该事件通知实例的节点树发生了与场景几何体的碰撞。作为示例，我们可以让实例转身\
  \ 180 度，如图 12.2 所示：\n\n![](img/3cfb9832c943f5f7366fd104b5255971_413_0.png)\n\n图\
  \ 12.2：一个对实例/场景碰撞做出反应的事件节点\n\n在图 12.2 中的事件节点中，实例在与场景发生碰撞时会立即转身。还添加了 250 毫秒的冷却时间。使用冷却时间应给予实例足够的时间远离受影响的场景几何体，以避免立即重新触发场景碰撞。\n\
  \n但现在，碰撞检测有一个巨大的缺点：实例保持在同一高度行走，从而穿过山丘或在地形变化时在空中行走。\n\n为了让实例保持在地面上，让我们为应用程序添加一种简单的重力形式。\n\
  \n## 使用重力使实例保持在地面上\n\n重力在我们周围无处不在，将物体向下加速，直到它们撞到其他不可移动的物体，例如地面。我们在行走或静止时大多意识不到重力的作用；我们只在某物掉落并且很可能在撞到地面时破碎时才意识到其威力。\n\
  \n在添加重力之前，我们需要找到一种方法来检测场景几何体中的三角形是否属于地面。\n\n## 在场景数据中查找地面三角形\n\n对于真实世界的场景，可以使用额外属性来标记场景的区域是否可行走。由于我们希望尽可能通用地保持地面级别技术，我们将使用不同的方法并使用三角形法线来检查我们周围的区域是否属于地面或墙壁，以及斜坡区域可以行走的最大角度。\n\
  \n我们将每个三角形的法线作为 3 元素向量存储在 `MeshTriangle` 结构体内部，与其他三角形数据一起存储：\n\n```\nstruct MeshTriangle\
  \ {\n    ...\n    glm::vec3 normal;\n    BoundingBox3D boundingBox;\n};\n```\n\n\
  在 `generateLevelOctree()` 中生成三角形八叉树时，会采用三角形的第一个顶点的法线：\n\n```\ntri.normal = glm::normalize(normalMat\
  \ *\n    glm::vec3(mesh.vertices.at(\n    mesh.indices.at(i)).normal));\n```\n\n\
  由于场景数据的索引结构，使用三角形的顶点之一的法线可能会导致因同一顶点被不同三角形重用而产生的伪影。在这种情况下，我们可以更改法线的计算方式，使其为每个三角形的两条边的叉积：\n\
  \n```\nglm::vec3 edge1 = glm::vec3(mesh.vertices.at(\n    mesh.indices.at(i + 1)).position\
  \ -\n    mesh.vertices.at(mesh.indices.at(i)).position);\nglm::vec3 edge2 = glm::vec3(mesh.vertices.at(\n\
  \    mesh.indices.at(i + 2)).position -\n    mesh.vertices.at(mesh.indices.at(i)).position);\n\
  tri.normal = glm::normalize(normalMat *\n    glm::cross(edge1, edge2));\n```\n\n\
  为了能够在用户界面中控制地面坡度，我们在 `OGLRenderData` 结构体中添加一个名为 `rdMaxLevelGroundSlopeAngle` 的新变量：\n\
  \n```\nfloat rdMaxLevelGroundSlopeAngle = 0.0f;\n```\n\n\n\n\n\n对于 Vulkan，一如既往，该变量将被添加到\
  \ VkRenderData 结构体中。\n\n然后，在 checkForLevelCollisions() 中，我们添加一个新的检查，以确定指向上方的向量与三角形的法线之间的角度是否大于最大可配置的地面坡度：\n\
  \n```\nif (glm::dot(tri.normal, glm::vec3(0.0f, 1.0f, 0.0f))\n    >= glm::cos(glm::radians(\n\
  \    mRenderData.rdMaxLevelGroundSlopeAngle))) {\n```\n\n在 if 块内部，我们现在可以将事件发送代码限制为仅针对墙壁触发，而不再针对地面三角形触发。我们还将被检测为地面三角形的三角形的调试线颜色改为蓝色，而墙壁三角形仍保持红色：\n\
  \n```\nvertexColor = glm::vec3(0.0f, 0.0f, 1.0f);\n} else {\n    vertexColor = glm::vec3(1.0f,\
  \ 0.0f, 0.0f);\n    mModelInstCamData.miNodeEventCallbackFunction(\n        instSettings.isInstanceIndexPosition,\n\
  \        nodeEvent::instanceToLevelCollision);\n}\n```\n\n在 UserInterface 类的 Levels...\
  \ 部分，我们添加一个浮点滑块，以支持交互式控制最大地面坡度：\n\n```\nImGui::Text(\"Max Ground Slope:\");\nImGui::SameLine();\n\
  ImGui::SliderFloat(\"##MaxSlope\",\n    &renderData.rdMaxLevelGroundSlopeAngle,\n\
  \    0.0f, 45.0f, \"%.2f\", flags);\n```\n\n现在，应用程序会以不同的颜色绘制与墙壁和地面的碰撞，如图 12.3 所示：\n\
  \n![](img/3cfb9832c943f5f7366fd104b5255971_416_0.png)\n\n如图 12.3 所示，墙壁碰撞现在用红色三角形边标记，而地面碰撞则用蓝色三角形边突出显示。坡度角可以通过滑块配置，从而可以微调山坡或边缘的哪个坡度仍被视为地面。\n\
  \n除了实例与墙壁或地面之间碰撞的颜色不同之外，事件报告也有所不同。对于地面碰撞，不会生成实例/关卡几何碰撞事件，从而允许实例在关卡中四处奔跑，仅与墙壁碰撞。\n\
  \n在我们可以检查实例是否与地面多边形碰撞之后，是时候将重力添加到代码中了。\n\n## 添加基本重力\n\n对于我们的应用程序，我们只使用简单的重力。我们只是每帧将实例向下移动一定量，而不考虑更复杂的模式，例如随时间的加速。如果你想实现更多细节，补充资源部分包含深入介绍高级物理和碰撞检测主题的书籍的\
  \ ISBN。此外，实践课程部分中的一个任务实现了增强重力。\n\n为了能够向实例添加重力效果，我们在 AssimpInstance 类中创建一个名为 applyGravity()\
  \ 的新公共方法：\n\n```\nvoid AssimpInstance::applyGravity(float deltaTime) {\n    glm::vec3\
  \ gravity =\n        glm::vec3(0.0f, GRAVITY_CONSTANT * deltaTime, 0.0f);\n    mInstanceSettings.isWorldPosition\
  \ -= gravity;\n}\n```\n\n私有变量 GRAVITY_CONSTANT 在 AssimpInstance.h 头文件中定义，并设置为 9.81，与地球上的真实重力相似。然后，在渲染器的\
  \ draw() 方法的实例循环中应用重力：\n\n```\nif (mRenderData.rdEnableSimpleGravity) {\n    instances.at(i)->applyGravity(deltaTime);\n\
  }\n```\n\nrdEnableSimpleGravity 变量已添加到用于 OpenGL 的 OGLRenderData.h 文件中的 OGLRenderData\
  \ 结构体，以及用于 Vulkan 的 VkRenderData.h 头文件中的 VkRenderData 结构体。\n\n在 UserInterface 类的\
  \ createFrame() 方法的 Levels... 折叠标题中，使用一个复选框来控制重力：\n\n```\nImGui::Text(\"Simple Gravity:\
  \ \");\nImGui::SameLine();\nImGui::Checkbox(\"##EnableGravity\",\n    &renderData.rdEnableSimpleGravity);\n\
  ```\n\n我们将使用此复选框，在没有加载关卡几何体时防止所有实例下落。\n\n还需要最后一步，使实例能够在关卡地面上漫游。让我们创建代码的最终部分，以完成对实例的地面处理。\n\
  \n## 将实例保持在关卡地面三角形上\n\n使用本章前面几节的代码，我们可以检测实例与关卡墙壁和地板之间的碰撞，并处理墙壁碰撞。对于地面碰撞，我们需要特殊处理，因为实例大多数时候会停留在关卡的地板上。\n\
  \n一个朴素的地面碰撞想法是在施加重力后将实例向上移动一点。遗憾的是，如果垂直移动量不相同，施加重力然后将实例移回会导致振荡。但除了将实例向上移动，我们也可以首先避免施加重力，一旦检测到碰撞，就让实例留在地面三角形上。\n\
  \n将实例保持在关卡地面三角形上的功能将通过以下步骤实现：\n\n- 1. 对于每个实例，我们通过使用 InstanceSettings.h 文件中的 InstanceSettings\
  \ 结构体中一个名为 isInstanceOnGround 的新布尔变量来存储“在地面上”状态：\n\n```\nbool isInstanceOnGround\
  \ = false;\n```\n\n- 2. 在 AssimpInstance 类中，还会为该状态添加一个公共 setter：\n\n```\nvoid AssimpInstance::setInstanceOnGround(bool\
  \ value) {\n    mInstanceSettings.isInstanceOnGround = value;\n}\n```\n\n- 3. 然后，我们更新\
  \ applyGravity() 方法，如果发现实例位于地面上，则禁用将重力添加到垂直位置：\n\n```\nif (!mInstanceSettings.isInstanceOnGround)\
  \ {\n    mInstanceSettings.isWorldPosition -= gravity;\n}\n```\n\n为了在渲染器中设置 isInstanceOnGround\
  \ 实例变量，将在渲染器的 draw() 方法中，紧接在对三角形八叉树的 query() 调用下方添加一个新的检查代码。这样，我们确保使用的是最新的三角形碰撞数据。\n\
  \n- 4. 首先，我们将局部布尔变量 instanceOnGround 设置为 true，这在重力被禁用时防止实例下落。接下来，我们使用与实例相同的公式计算重力，并用世界位置初始化实例当前的\
  \ footPoint：\n\n```\nbool instanceOnGround = true;\nif (mRenderData.rdEnableSimpleGravity)\
  \ {\n    glm::vec3 gravity =\n        glm::vec3(0.0f, 9.81 * deltaTime, 0.0f);\n\
  \    glm::vec3 footPoint =\n        instSettings.isWorldPosition;\n```\n\n在下一步中，我们需要脚点，以便在地面检测失败时为实例提供一个有效的位置。\n\
  \n5. 现在，我们将 instanceOnGround 设置为 false，作为地面级别检测的默认设置，并遍历所有碰撞三角形：\n\n```\ninstanceOnGround\
  \ = false;\nfor (const auto& tri : collidingTriangles) {\n```\n\n6. 然后，使用与 checkForLevelCollisions()\
  \ 中相同的三角形法线向量和指向上方的向量之间的角度检查，来判断该三角形是否是一个地面三角形，因此被视为可通行：\n\n```\nif (glm::dot(tri.normal,\
  \ glm::vec3(0.0f, 1.0f, 0.0f)) >= glm::cos(glm::radians(\nmRenderData.rdMaxLevelGroundSlopeAngle)))\
  \ {\n```\n\n7. 如果该三角形是可通行的地面，我们尝试获取一条指向上方的虚拟射线与地面的交点，该射线从已经略微下沉到地面中的实例位置发出：\n\n\
  ```\nstd::optional<glm::vec3> result = Tools::rayTriangleIntersection(\ninstSettings.isWorldPosition\
  \ - gravity,\nglm::vec3(0.0f, 1.0f, 0.0f), tri);\nif (result.has_value()) {\nfootPoint\
  \ = result.value();\ninstances.at(i)->setWorldPosition(\nfootPoint);\ninstanceOnGround\
  \ = true;\n}\n```\n\n在应用重力值后检查实例是必需的，因为如果实例与地面三角形完全在同一水平面上，则不会报告碰撞。\n\nTools 类中的辅助函数\
  \ rayTriangleIntersection() 实现了 Möller-Trumbore 算法，以查找射线与三角形之间的交点。该算法检测射线是否与三角形相交，并返回相交的确切点。\n\
  \n该算法的可视化如图 12.4 所示：\n\n![](img/3cfb9832c943f5f7366fd104b5255971_420_0.png)\n\n\
  图 12.4：Möller-Trumbore 算法的可视化\n\nMöller-Trumbore 算法使用由三个顶点 V0、V1 和 V2 创建的三角形的重心坐标来检查射线是否在三角形内部或外部。为了简化检测过程，该算法对三角形顶点和射线进行变换，使得三角形的两条边映射到笛卡尔坐标系的\
  \ X 轴和 Y 轴上，从而定义一个单位三角形。交点处的重心坐标在这些变换中保持不变。最后的相交测试只需通过测试有效的重心坐标，来检查交点的 x 和 y 坐标是否在三角形内部。有关该算法数学背景的链接可在补充资源部分找到。\n\
  \n8. 作为新渲染器代码中 draw() 调用部分的最后一步，我们为该实例设置地面标志，并应用重力：\n\n```\ninstances.at(i)->setInstanceOnGround(instanceOnGround);\n\
  instances.at(i)->applyGravity(deltaTime);\n```\n\n在“添加基本重力”部分中添加的围绕 applyGravity()\
  \ 的额外 rdEnableSimpleGravity 检查可以移除。我们已经通过将 instanceOnGround 的默认值设置为 true，确保如果 rdEnableSimpleGravity\
  \ 为 false，则不会添加重力。\n\n\n\n\n\n启用碰撞三角形调试绘制并调整地面坡度后运行应用程序，将得到类似于图 12.5 的图像：\n\n![](img/3cfb9832c943f5f7366fd104b5255971_421_0.png)\n\
  \n在图 12.5 中，我们看到实例各自在自己的水平面上行走，左侧实例正在爬上一段小坡。在运行的应用程序中，你会看到下坡也是按预期工作的。\n\n启用水平重力后，实例在平坦地面上奔跑。但在不平整的地面上，上坡时会出现与地面相交的情况，或下坡时其中一只脚仍在空中。你可以在左侧实例的右脚上看到这种效果：整只脚都穿进了地面三角形。\n\
  \n让我们通过添加逆向运动学来修复实例的脚部。\n\n## 添加逆向运动学\n\n“运动学”一词被定义为物体运动背后的力学，但不涉及导致该运动的力。因此，我们日常运动的每个部分都可以用运动学来描述，即骨骼的运动。\n\
  \n## 两种运动学类型\n\n我们在前几章中使用的角色动画类型称为**正向运动学**。图 12.6 显示了正向运动学的一个示例：\n\n![](img/3cfb9832c943f5f7366fd104b5255971_422_0.png)\n\
  \n图 12.6：使用正向运动学抬起简易骨骼的手\n\n图 12.6 中的骨骼通过在骨骼编号一、肩部和编号二、肘部处旋转来抬起其简化的手。\n\n在骨骼骨头的移动或旋转过程中，附着在其上的所有其他节点也会受到影响。围绕肩部旋转手臂不会改变肘部或前臂，因为我们一次只改变一根骨头。接下来，前臂围绕肘部旋转，将手带到最终位置。手的这个最终位置由手之前所有骨头的变化的串联定义。\n\
  \n但……如果我们只知道手的期望最终位置会怎样？\n\n如果我们想将图 12.7 中骨骼的手移动到绿色目标点，或想将脚放到绿色目标块上，使用正向运动学的唯一选择就是反复尝试。\n\
  \n![](img/3cfb9832c943f5f7366fd104b5255971_422_1.png)\n\n图 12.7：如何将手移动到目标，或将脚放在盒子上？\n\
  \n我们必须一遍又一遍地调整手臂或腿上的所有节点，直到达到匹配的位置。这就是**逆向运动学**发挥作用的地方。与直接旋转节点不同，我们计算与最终运动匹配的骨骼位置，并从最终骨骼位置读取节点旋转，\n\
  \n在逆向运动学中，名称**效应器**用于描述应到达**目标**的骨骼部分。如果目标距离太远而效应器节点无法到达，我们至少应尝试找到尽可能接近目标的位置。除了效应器和目标之外，还必须选择一个**根节点**。根节点是骨骼中第一个不变的节点。\n\
  \n尽管已经创建了许多逆向运动学求解器算法，但我们将使用其中一种基础算法：FABRIK，即**正向和反向伸展逆向运动学**求解器。FABRIK 易于理解和实现，并且能为节点找到良好的解决方案。因此，让我们使用\
  \ FABRIK 深入逆向运动学。\n\n## 理解 FABRIK 基础\n\nFABRIK 由 Andreas Aristidou 博士于 2011 年提出。FABRIK\
  \ 算法通过一次移动骨骼链的节点，使其更接近目标，然后将骨骼重新缩放回原始长度来解决逆向运动学问题。此外，FABRIK 沿着骨骼链在两个方向上移动，正向和反向，因此得名。\n\
  \n我们将使用一个简单的机器人手臂来描述使用 FABRIK 解决逆向运动学问题的步骤。手臂的四个节点定义了三根骨骼，目标和效应器在每一步中都被绘制出来，蓝色节点作为根节点附着在地面上，外侧红色节点用作效应器。所有步骤均显示在图\
  \ 12.8 至图 12.11 中。\n\n让我们逐步完成算法的一次迭代。首先，我们将检查 FABRIK 的 *正向* 求解部分。\n\n![](img/3cfb9832c943f5f7366fd104b5255971_423_0.png)\n\
  \n起始情况如图 12.8 (1) 所示：\n\n- 1. 如图 12.8 (2) 所示，我们将首先将效应器移动到目标位置。你可以看到移动该节点会使红色骨骼远超其原始长度地被拉伸。\n\
  - 2. 我们必须纠正红色骨骼的长度，因此需要在移动效应器之前保存骨骼的长度。通过使用保存的长度，我们在效应器移动后立即将红色骨骼缩放到其原始长度，如图 12.8\
  \ (3) 所示。将红色骨骼缩放到先前的长度会将我们的机器人手臂撕裂开，如图 12.8 (3) 所见，但这是在 FABRIK 迭代期间的预期行为。\n- 3.\
  \ 然后，我们将紫色骨骼的外侧节点移回红色骨骼的末端，并再次将其缩放到任意长度。图 12.8 (4) 显示了机器人手臂重新连接后的结果。\n- 4. 紫色骨骼被缩放到其先前的长度，如图\
  \ 12.9 (5) 所示，将末端节点移离蓝色骨骼。\n\n![](img/3cfb9832c943f5f7366fd104b5255971_424_0.png)\n\
  \n图 12.9：使用 FABRIK 正向迭代的逆向运动学 – 第 2 部分\n\n5. 最后，我们将紫色骨骼移动的步骤 4 和 5 重复到蓝色骨骼。我们每次重新连接手臂并将骨骼缩放到其原始长度，如图\
  \ 12.9 (6) 和图 12.9 (7) 所示。\n\n图 12.9 (8) 显示了 FABRIK 算法正向步骤完成后的结果。但将机器人手臂与地面断开连接并不是我们想要的结果。为了修复手臂，我们将重复相同的步骤，但这次在同一骨骼链上反向进行。\n\
  \n在 FABRIK 的反向部分，我们将交换目标、效应器节点和根节点。我们使用手臂的原始连接点作为目标，蓝色骨骼的末端成为效应器，原始效应器节点是新的根节点。\n\
  \n6. 反向操作的第一个步骤是重新将手臂连接到地面，如图 12.10 (9) 所示。\n\n![](img/3cfb9832c943f5f7366fd104b5255971_425_0.png)\n\
  \n图 12.10：使用 FABRIK 反向迭代的逆向运动学 – 第 1 部分\n\n7. 然后，我们将蓝色骨骼缩放到其先前的大小，并以我们最初在步骤 2 和\
  \ 3 中所做的方式移动紫色骨骼。图 12.10 (10)、图 12.10 (11) 和图 12.10 (12) 显示了调整蓝色和紫色骨骼的结果。\n\n8.\
  \ 现在，红色骨骼的下部节点将移动，红色骨骼被缩放到其先前的大小，如图 12.11 (13) 和图 12.11 (14) 所示。\n\n![](img/3cfb9832c943f5f7366fd104b5255971_425_1.png)\n\
  \n图 12.11：使用 FABRIK 反向迭代的逆向运动学 - 第 2 部分\n\n图 12.11 (14) 将效应器移离目标位置，但如果目标无法到达，这在\
  \ FABRIK 中又是预期行为。在图 12.11 (15) 中，一次 FABRIK 迭代结束。\n\n对于 FABRIK 的下一次迭代，步骤 2 至 9 将重复进行，直到效应器节点到达目标位置，或直到达到最大迭代次数。\n\
  \n使用简单的伪代码，FABRIK 可以简化为以下过程：\n\n```\nNodePositions := OrigNodePositions\nStoreOriginalBoneLengths\n\
  RootNodePos := NodePositions[LastPosition];\nFor NumIterations; Do\n    EffectorPos\
  \ := NodePositions[0]\n    If TargetIsCloseToEffector\n        Return\n    SolveForward(TargetNodePos)\n\
  \    SolveBackwards(RootNodePos)\nEndFor\n```\n\nSolveForward 和 SolveBackwards 方法类似，因此我们只需查看\
  \ FABRIK 正向求解部分的伪代码：\n\n```\nNodePositions[0] = TargetNodePos\nFor i = 1; i < NodePositions.Size;\
  \ i += 1\n    BoneDirection = NodePositions[i] - NodePositions[i-1]\n    NewOffset\
  \ = BoneDirection * BoneLengths[i - 1]\n    NodePositions[i] = NodePositions[i-1]\
  \ + NewOffset\nEndFor\n```\n\n反向求解部分只是从保存的根节点位置开始，并以相反方向迭代骨骼。\n\n正如你所见，步骤数量很少，这些步骤中的操作也很简单。掌握了新知识后，让我们添加一个\
  \ FABRIK 求解器。\n\n## 实现 FABRIK 逆向运动学算法\n\n使用 FABRIK 算法的逆向运动学求解器通过以下步骤实现：\n\n- 1.\
  \ 对于 FABRIK 逆向运动学求解器，我们通过向 tools 文件夹添加 IKSolver.h 和 IKSolver.cpp 文件创建一个新的类 IKSolver。\n\
  - 2. 在构造函数和迭代次数的 setter 旁边，添加一个名为 solveFABRIK() 的公共方法：\n\n```\nstd::vector<glm::vec3>\
  \ solveFABRIK(\n    std::vector<glm::mat4>& nodeMatrices,\n    glm::vec3 targetPos);\n\
  ```\n\n\n\n\n\n3. 我们还添加了两个私有成员 `mNodePositions` 和 `mBoneLengths`，以及三个私有方法 `solveFABRIKForward()`、`solveFABRIKBackwards()`\
  \ 和 `calculateOrigBoneLengths()`：\n\n```\nstd::vector<glm::vec3> mNodePositions{};\n\
  std::vector<float> mBoneLengths{};\nvoid solveFABRIKForward(glm::vec3 targetPos);\n\
  void solveFABRIKBackwards(glm::vec3 rootPos);\nvoid calculateOrigBoneLengths();\n\
  ```\n\n4. 在 `mNodePositions` 中，我们存储计算期间节点的世界位置，而在 `mBoneLengths` 中则保存所需的原始骨骼长度。`calculateOrigBoneLengths()`\
  \ 方法的名称不言自明；我们无需深入细节。但让我们快速回顾一下其余三个方法。\n\n5. FABRIK 的前向部分在 `solveFABRIKForward()`\
  \ 中处理。首先，我们将 `mNodePositions` 的第一个元素设置为目标位置：\n\n```\nvoid IKSolver::solveFABRIKForward(glm::vec3\
  \ targetPos) {\n    mNodePositions.at(0) = targetPos;\n    for (size_t i = 1; i\
  \ < mNodePositions.size(); ++i) {\n        glm::vec3 boneDirection =\n         \
  \   glm::normalize(mNodePositions.at(i) -\n            mNodePositions.at(i - 1));\n\
  \        glm::vec3 offset = boneDirection *\n            mBoneLengths.at(i - 1);\n\
  \        mNodePositions.at(i) =\n            mNodePositions.at(i - 1) + offset;\n\
  \    }\n}\n```\n\n6. 然后我们遍历剩余的节点，计算移动前一个节点后骨骼的新方向，并利用原始长度计算节点的新位置。最后，我们将节点移动到新位置，保持长度不变。\n\
  \n7. 在 `solveFABRIKBackwards()` 中，我们以沿节点链相反的方向执行与步骤 5 和 6 相同的操作。我们以根节点位置作为目标，并逐个调整节点位置：\n\
  \n```\nvoid IKSolver::solveFABRIKBackwards(glm::vec3 rootPos) {\n    mNodePositions.at(mNodePositions.size()\
  \ - 1) = rootPos;\n```\n\n```\nfor (int i = mNodePositions.size() - 2; i >= 0; --i)\
  \ {\n    glm::vec3 boneDirection =\n        glm::normalize(mNodePositions.at(i)\
  \ -\n        mNodePositions.at(i + 1));\n    glm::vec3 offset = boneDirection *\
  \ mBoneLengths.at(i);\n    mNodePositions.at(i) =\n        mNodePositions.at(i +\
  \ 1) + offset;\n}\n}\n```\n\n8. 最后一个方法 `solveFABRIK()` 用于控制 FABRIK 的迭代次数以及比较末端执行器和目标位置。我们首先进行一个简单的空节点矩阵向量检查。在这种情况下，我们返回一个空向量：\n\
  \n```\nstd::vector<glm::vec3> IKSolver::solveFABRIK(\n    std::vector<glm::mat4>&\
  \ nodeMatrices,\n    glm::vec3 targetPos) {\n    if (nodeMatrices.size() == 0) {\n\
  \        return std::vector<glm::vec3>{};\n    }\n}\n```\n\n9. 然后，我们调整 `mNodePositions`\
  \ 向量的大小并填充它：\n\n```\nmNodePositions.resize(nodeMatrices.size());\nfor (int i = 0;\
  \ i < nodeMatrices.size(); ++i) {\n    mNodePositions.at(i) =\n        Tools::extractGlobalPosition(\n\
  \        nodeMatrices.at(i));\n}\n```\n\n10. 在辅助方法 `extractGlobalPosition()` 中，提取节点矩阵的平移部分并返回。现在我们可以计算骨骼长度，并为\
  \ FABRIK 的后向部分保存根节点的位置：\n\n```\ncalculateOrigBoneLengths();\nglm::vec3 rootPos =\n\
  \    mNodePositions.at(mNodePositions.size() - 1);\n```\n\n11. 我们需要保存根节点位置，因为在前向计算过程中会改变\
  \ `mNodePositions` 向量。如果不保存原始根节点，后向部分将无法求解。\n\n12. 然后，我们开始一个具有最大迭代次数的循环：\n\n```\n\
  for (unsigned int i = 0; i < mIterations; ++i) {\n    glm::vec3 effector = mNodePositions.at(0);\n\
  \    if(glm::length(targetPos - effector) <\n        mCloseThreshold) {\n      \
  \  return mNodePositions;\n    }\n}\n```\n\n在循环开始时，我们比较末端执行器节点和期望目标的位置。如果位置足够接近，我们将当前节点位置作为解返回。\n\
  \n13. 现在是 FABRIK 求解部分。我们使用目标位置调用前向求解器方法，然后使用保存的根节点位置调用后向求解器方法：\n\n```\nsolveFABRIKForward(targetPos);\n\
  \    solveFABRIKBackwards(rootPos);\n}\n```\n\n14. 两个求解部分完成后，我们继续下一轮迭代。最后，我们返回 FABRIK\
  \ 为节点找到的位置：\n\n```\nreturn mNodePositions;\n}\n```\n\n有可能末端执行器节点无法到达目标位置，即节点链太短。在这种情况下，将返回\
  \ FABRIK 能够找到的最佳位置。\n\n在继续 FABRIK 的最后一部分之前，我们需要确保配置模型根节点和末端执行器节点。在这里，我们将只使用脚部以在上坡或下坡行走时营造自然的外观。\n\
  \n## 为实例的脚部定义节点链\n\n为了能够配置脚部的节点，在 `ModelSettings.h` 文件的 `ModelSettings` 结构体中添加了两个新成员：\n\
  \n```\nstd::array<std::pair<int, int>, 2> msFootIKChainPair{};\n    std::array<std::vector<int>,\
  \ 2> msFootIKChainNodes{};\n```\n\n在 `msFootIKChainPair` 数组中，我们存储左脚和右脚的末端执行器和根节点的节点\
  \ ID。我们只需要该对用于用户界面，因为 `msFootIKChainNodes` 数组的内容将根据末端执行器和根节点 ID 计算得出。\n\n对于用户界面，我们使用实例模型骨骼名称列表中的名称。由于骨骼\
  \ ID 与名称之间存在 1:1 的关系，因此遍历列表以创建组合框非常容易。\n\n与用于启用或禁用逆运动学的布尔变量以及迭代滑块一起，模型脚部逆运动学部分的界面如下图\
  \ 12.12 所示：\n\n![](img/3cfb9832c943f5f7366fd104b5255971_430_0.png)\n\n图 12.12：Women\
  \ 模型的逆运动学配置\n\n对于图 12.12，使用了 Women 模型作为示例。对于其他模型，节点名称可能不同。\n\n### 逆运动学取决于模型\n\n\
  为模型脚部配置逆运动学的能力在很大程度上取决于模型的骨骼结构。你在互联网上找到的一些模型可能缺少骨骼节点之间的父子关系，例如腿部和脚部节点之间的关系，导致逆运动学无法正常工作。\n\
  \nFABRIK 算法还有另一部分，用于使用计算得到的位置调整原始节点世界位置。我们在《实现 FABRIK 逆运动学算法》部分跳过了最终部分的编码，因为出于技术原因必须拆分\
  \ FABRIK 算法——FABRIK 算法使用的节点数据驻留在 GPU 上，但其中一些计算在 CPU 上处理更容易。\n\n让我们现在合并节点位置。\n\n\
  ## 调整节点位置\n\n由于使用了计算着色器，包含旋转、平移和缩放的矩阵以及节点世界位置的数据仅驻留在 GPU 内存中。此外，出于性能原因，节点位置在计算着色器中计算。我们需要复制数据\n\
  \n```\nnodeMatrix = createTRSMatrix(parent) * nodeMatrix;\n```\n\n由于计算完全在 GPU 上完成，因此在渲染器代码中反映\
  \ TRS 数据拆分的唯一更改是 `mShaderTRSMatrixBuffer` SSBO 的大小计算：\n\n```\nsize_t trsMatrixSize\
  \ = numberOfBones *\n    numberOfInstances * 3 * sizeof(glm::vec4);\n```\n\n我们不再使用完整的\
  \ TRS 矩阵的 `glm::mat4`，而是使用三个 `glm::vec4` 实例，在这里保持节点变换像计算着色器中一样拆分为平移、旋转和缩放。\n\n在\
  \ `OGLRenderData.h` 文件中，添加了匹配的 `TRSMatrixData` 结构体：\n\n```\nstruct TRSMatrixData{\n\
  \    glm::vec4 translation;\n    glm::quat rotation;\n    glm::vec4 scale;\n};\n\
  ```\n\n对于 Vulkan，`TRSMatrixData` 的添加在 `VkRenderData.h` 文件中进行。\n\n在计算着色器计算出最终节点位置之后，但在实例渲染之前，将为动画实例添加新代码。\n\
  \n## 添加动画实例的代码\n\n我们首先检索 TRS 缓冲区的当前内容：\n\n```\nmTRSData =\n    mShaderTRSMatrixBuffer.getSsboDataTRSMatrixData();\n\
  ```\n\n然后我们遍历两个脚部并计算每个脚部的节点链大小：\n\n```\nfor (int foot = 0; foot <\n    modSettings.msFootIKChainPair.size();\
  \ ++foot) {\n    int nodeChainSize =\n        modSettings.msFootIKChainNodes[foot].size();\n\
  \    if (nodeChainSize == 0) {\n        continue;\n    }\n}\n```\n\n\n\n\n\n如果脚节点链为空，我们会立即继续，因为这里没有需要计算的内容。但如果我们有一个有效的脚节点链，我们会向后遍历节点链，并在每个节点链中向前遍历所有实例：\n\
  \n```\nfor (int index = nodeChainSize - 1; index > 0; --index) {\n    for (size_t\
  \ i = 0; i < numberOfInstances; ++i) {\n```\n\n循环的顺序——先脚，然后节点链，最后实例——是有原因的：这样处理其中一个脚节点链为空或脚节点链大小不同的情况会容易得多，因为我们可以跳过整个循环或使用不同的迭代次数。向后遍历节点链是必要的，因为脚链向量包含从末端执行器到根节点的节点顺序，但世界位置更新以根节点作为第一个节点开始。\n\
  \n在内部循环中，我们从脚节点链中提取当前节点和前一个节点的节点 ID：\n\n```\nint nodeId =\n    modSettings.msFootIKChainNodes[foot].at(index);\n\
  int nextNodeId =\n    modSettings.msFootIKChainNodes[foot]\n    .at(index - 1);\n\
  ```\n\n通过使用这两个节点 ID，我们提取节点世界位置：\n\n```\nglm::vec3 position = Tools::extractGlobalPosition(\n\
  \    mWorldPosMatrices.at(i) *\n    mShaderBoneMatrices.at(i * numberOfBones +\n\
  \    nodeId) *\n    model->getInverseBoneOffsetMatrix(nodeId));\nglm::vec3 nextPosition\
  \ =\n    Tools::extractGlobalPosition(\n    mWorldPosMatrices.at(i) *\n    mShaderBoneMatrices.at(i\
  \ * numberOfBones +\n    nextNodeId) *\n    model->getInverseBoneOffsetMatrix(nextNodeId));\n\
  ```\n\n在乘以骨骼偏移节点的逆矩阵、当前节点位置和实例世界位置之后，我们得到脚节点链的两个相邻节点的世界位置。\n\n利用这两个位置，我们计算归一化的 toNext\
  \ 向量：\n\n```\nglm::vec3 toNext = glm::normalize(nextPosition - position);\n```\n\
  \n要计算节点的期望旋转，我们需要找到一个四元数，将骨骼从当前世界旋转旋转到 FABRIK 算法计算出的旋转。\n\n## 创建新的世界位置\n\n我们提取 FABRIK\
  \ 计算的相同节点的新的世界位置，计算新的世界位置之间的归一化 toDesired 向量，并将 toNext 和 toDesired 向量之间的旋转角度计算为四元数\
  \ nodeRotation：\n\n```\nint newNodePosOffset = i * nodeChainSize + index;\nglm::vec3\
  \ toDesired = glm::normalize(\nmNewNodePositions.at(foot)\n.at(newNodePosOffset\
  \ - 1) -\nmNewNodePositions.at(foot)\n.at(newNodePosOffset));\nglm::quat nodeRotation\
  \ = glm::rotation(toNext, toDesired);\n```\n\n此时，我们获得了骨骼当前位置与模型骨架相同骨骼新位置之间的世界级旋转。\n\
  \n现在我们提取当前节点世界级旋转并计算将匹配节点世界级旋转所需的局部旋转：\n\n```\nglm::quat rotation = Tools::extractGlobalRotation(\n\
  mWorldPosMatrices.at(i) *\nmShaderBoneMatrices.at(i * numberOfBones + nodeId) *\n\
  model->getInverseBoneOffsetMatrix(nodeId));\nglm::quat localRotation = rotation\
  \ * nodeRotation * glm::conjugate(rotation);\n```\n\n最后，我们读取节点的当前局部旋转，拼接新的旋转，并将旋转存储回\
  \ TRS 数据中：\n\n```\nglm::quat currentRotation = mTRSData.at(i * numberOfBones + nodeId).rotation;\n\
  glm::quat newRotation = currentRotation * localRotation;\nmTRSData.at(i*numberOfBones\
  \ + nodeId).rotation = newRotation;\n}\n```\n\n通过运行 mAssimpMatrixComputeShader 并上传更新后的\
  \ TRS 数据，脚节点链中所有节点的新的节点矩阵将被重新计算。作为最后一步，我们读取 mShaderBoneMatrixBuffer 的内容，以便在脚节点链的下一个节点中使用新的节点矩阵。\n\
  \n我们距离一个可用的逆运动学实现仅一步之遥。现在剩下的是检测脚位置与地面三角形之间的碰撞。让我们处理本章的最后一部分。\n\n## 检测脚到地面的碰撞\n\n\
  检测实例脚与地面碰撞的总体思路与实例相同。我们使用射线到三角形检查来查找射线与定义脚节点下方或上方三角形相交。此交点随后用作 FABRIK 求解器的目标位置。\n\
  \n对于每个实例的两个脚，我们使用与 FABRIK 求解器代码最后一步相同的方法来提取世界位置：\n\n```\nint footNodeId = modSettings.msFootIKChainPair.at(foot).first;\n\
  glm::vec3 footWorldPos = Tools::extractGlobalPosition(\n\tmWorldPosMatrices.at(i)\
  \ *\n\tmShaderBoneMatrices.at(i * numberOfBones + footNodeId) *\n\tmodel->getInverseBoneOffsetMatrix(footNodeId));\n\
  \n```\n\n我们还计算脚节点相对于地面的偏移量：\n\n```\nfloat footDistAboveGround = std::fabs(\n   \
  \ instSettings.isWorldPosition.y - footWorldPos.y);\n```\n\n这个 footDistAboveGround\
  \ 偏移量是必要的，以便让脚在斜坡地面三角形上方悬浮，与脚在平面地面三角形上时的距离相同。然后，我们使用实例的 AABB 来计算包围盒的完整高度和半高度：\n\n\
  ```\nAABB instanceAABB = model->getAABB(instSettings);\nfloat instanceHeight = instanceAABB.getMaxPos().y\
  \ - instanceAABB.getMinPos().y;\nfloat instanceHalfHeight = instanceHeight / 2.0f\n\
  ```\n\n利用这两个高度值，我们创建一个射线来检测与地面三角形的相交。接下来，我们为交点的最终 hitPoint 设置默认值并遍历碰撞三角形：\n\n```\n\
  glm::vec3 hitPoint = footWorldPos;\nfor (const auto& tri :\n    instSettings.isCollidingTriangles)\
  \ {\n    std::optional<glm::vec3> result{};\n```\n\n然后我们检查每个碰撞三角形是否与从实例半高度开始、最多向下指向整个实例高度的射线相交：\n\
  \n```\nresult = Tools::rayTriangleIntersection(\n    footWorldPos +\n    glm::vec3(0.0f,\
  \ instanceHalfHeight, 0.0f),\n    glm::vec3(0.0f, -instanceHeight, 0.0f), tri);\n\
  ```\n\n使用射线的上、下限有助于防止误检测附近的任何三角形。接下来，我们检查是否找到了交点：\n\n```\nif (result.has_value())\
  \ {\n    hitPoint = result.value() +\n    glm::vec3(0.0f, footDistAboveGround, 0.0f);\n\
  }\n```\n\n```\nmIKSolvedPositions.begin(),\nmIKSolvedPositions.end();\n```\n\n此时，脚位置已准备好进行来自“检测脚到地面碰撞”部分的节点矩阵和\
  \ TRS 更新。\n\n在加载关卡后启用并配置逆运动学将向屏幕渲染类似于图 12.14 的图像：\n\n![](img/3cfb9832c943f5f7366fd104b5255971_438_0.png)\n\
  \n图 12.14：右实例的右脚在斜坡地面上的相交减少了\n\n正如你在图 12.14 中右实例所看到的，右脚不再完全与地面三角形相交。此外，右膝的角度已调整，以允许脚放置在地面三角形较高部分上。\n\
  \n左脚的脚趾仍有一些相交。通过使脚趾与地面坡度对齐来修复剩余的相交是“实践环节”部分中的一个任务。但即使有这种最小的相交，观看实例在山丘上上下移动也更像真实人类，令人非常有趣。\n\
  \n## FABRIK 的局限性\n\n使用 FABRIK 求解器进行逆运动学创建的动画通常看起来不错，但该算法有一些局限性需要解决。\n\n最大的问题出现在节点旋转导致不自然骨骼位置时。例如，人类不能向前弯曲膝盖，但我们屏幕上的实例可以做到。如果不检查和限制节点的旋转，实例的骨骼最终可能处于几乎任何位置。*实践环节*部分中的一个任务通过限制节点旋转来处理这个问题。\n\
  \n另一个问题出现在目标距离末端执行器太远，从而无法到达时。FABRIK 通过将整个骨骼链从根节点拉伸到末端执行节点形成直线来解决无法到达的目标，导致实例像机器人一样腿部僵硬地行走。由于我们可以检测到目标是否无法被末端执行器到达，因此处理这些情况比无限节点旋转更容易。*实践环节*部分中有一个任务用于解决无法到达目标的问题。\n\
  \n## 总结\n\n在本章中，我们增强了关卡的碰撞检测。首先，我们为关卡数据添加了单独且专门的八叉树，使我们能够快速检查实例与关卡几何体之间的碰撞。然后，我们为虚拟世界添加了简单的重力，并调整了碰撞检测以允许实例在关卡地面上行走。最后，我们为实例的脚添加了逆运动学，通过避免脚悬浮在地面上方或嵌入关卡的地面三角形中，使斜坡地面的脚和腿运动更自然。\n\
  \n在下一章中，我们将为关卡数据添加最终扩展并添加简单的导航。我们将首先简要回顾游戏中实现导航的几种方法。接下来，我们将探讨 A* 路径查找算法并在应用程序中实现它。然后，我们将向地图添加路径点，作为\
  \ A* 计算的目标。最后，我们将为实例实现路径点导航，使实例能够移动到随机路径点或在定义的一组路径点之间巡逻。\n\n\n\n\n\n## 实践环节\n\n\
  以下是你可以对代码进行的改进：\n\n- 添加更完整的重力。\n\n  不要仅仅操纵实例的垂直位置，而是使用更复杂的方式通过垂直加速度来应用重力。由于重力在两个地方使用，一个是在实例的速度中，另一个是在渲染器中的碰撞检测中，因此需要在两个代码部分之间进行同步。\n\
  \n- 为第三人称摄像机添加碰撞检测。\n\n  在真实游戏中，摄像机也是虚拟世界中的一个普通物体。而且摄像机不会穿过关卡数据，它始终保持在与所跟随角色相同的边界内，通过弹簧臂结构连接，以便在摄像机无法保持在角色正后方的确切位置时进行调整。你可以尝试为第三人称摄像机添加一个包围盒，并同样对照关卡八叉树检查边界。记住，如果发生碰撞，还要检查并更改摄像机的距离和高度。\n\
  \n- 增强楼梯和悬崖检测。\n\n  为了使实例能够爬楼梯，代码中已添加了基本逻辑，用于比较楼梯的台阶高度与实例位置。这种方法可能不适用于不同类型的游戏地图，而且当楼梯检测返回错误结果时，实例可能会从悬崖上掉落。增强逻辑以获得更好的楼梯检测，并防止实例在“认为”自己站在台阶前时实际上处于深渊边缘而掉落。\n\
  \n- 使实例的脚跟随地面坡度和法线对齐。\n\n  目前，实例的脚可能会与地面相交，这取决于地面的坡度和实例的位置。添加一些代码，甚至为模型添加更多节点，以使实例的脚与地面三角形对齐。此调整应适用于前后倾斜，以及脚的侧向旋转以匹配地面。\n\
  \n- 处理不可达目标。\n\n  实现逻辑以检测效应器是否无法到达目标，并为节点添加某种默认旋转，例如取自动画片段的当前帧。\n\n- 将 FABRIK 的节点更新部分移至计算着色器。\n\
  \n  为了保持 FABRIK 代码中更新最终节点旋转的简单性和易读性，采用了 CPU/GPU 组合。当前代码的缺点是，在每次更新节点链时，都需要从 GPU 内存中复制\
  \ TRS 矩阵数据和最终节点位置。通过为节点旋转更新创建计算着色器，可以将整个节点更新过程保留在 GPU 上。\n\n- 扩展难度：为逆向运动学编写计算着色器。\n\
  \n  FABRIK 逆向运动学算法简单直接。在计算着色器中实现相同的算法应该不会太难。你可以使用矩阵乘法计算着色器作为示例，了解如何在 GLSL 代码中进行循环，而无需硬编码循环变量。\n\
  \n- 扩展难度：为逆向运动学算法添加节点限制。\n\n  在默认版本中，逆向运动学在求解位置时不会担心不自然的骨骼旋转。对于游戏角色来说，如果膝盖或肘部弯曲方向错误，看起来会很奇怪。通过为所有三个旋转轴添加每个节点的限制，目标可能无法到达，但角色仍然看起来像人类。但请注意：添加节点限制可能会影响逆向运动学算法的稳定性。\n\
  \n- 扩展难度：使用包围体层次结构（BVH）进行碰撞检测。\n\n  包围体层次结构的思想在 *第 8 章* 的 *使用空间划分来降低复杂度* 部分中提到过，而\
  \ Christer Ericson 的书籍 *Real-Time Collision Detection* 专门有一章介绍 BVH。用 BVH 替换八叉树来检测碰撞可能是一项长期任务，因为层次结构的创建本身就为碰撞检测增加了大量复杂性。\n\
  \n## 附加资源\n\n- Jacobian Matrix 简介： https://medium.com/unity3danimation/overview-of-jacobian-ik-a33939639ab2\n\
  - *Collision Detection in Interactive 3D Environments* 由 Gino van den Bergen 所著，由\
  \ *CRC Press* 出版：ISBN 978-1558608016\n- *Game Physics Engine Development* 由 Ian\
  \ Millington 所著，由 *CRC Press* 出版：ISBN 978-0123819765\n- *Game Physics* 由 David H.\
  \ Eberly 所著，由 *Morgan Kaufmann* 出版：ISBN 978-0123749031\n- *Real-Time Collision Detection*\
  \ 由 Christer Ericson 所著，由 *CRC Press* 出版：ISBN 9781000750553\n- FABRIK publications:\
  \ http://www.andreasaristidou.com/FABRIK.html\n- Unreal Engine 中的逆向运动学： https://dev.epicgames.com/documentation/en-us/unreal-engine/ik-setups?application_version=4.27\n\
  - 全身逆向运动学： https://dev.epicgames.com/documentation/en-us/unreal-engine/control-rig-full-body-ik-in-unreal-engine\n\
  - 用于射线-三角形相交检查的 Möller-Trumbore 算法： http://www.lighthouse3d.com/tutorials/maths/ray-triangle-intersection/\n"
- "## 13 添加简单导航\n\n欢迎来到第 13 章！在上一章中，我们创建了一个单独的八叉树来增强碰撞检测，从而能够以快速且计算成本低廉的方式检测实例与关卡几何体之间的碰撞。然后我们向应用程序添加了简单的重力，使实例保持在地图地面上，最终使实例能够在关卡地面和小山丘上行走。最后，我们对实例的脚使用了逆向运动学，使其在攀爬山丘或地图的斜坡区域时双脚保持在地面上。\n\
  \n在本章中，我们将添加寻路和导航。我们首先简要概述计算机游戏中使用的导航方法，然后探索并实现 A* 寻路算法。接下来，我们将向应用程序添加导航目标，从而能够在虚拟世界中以简单的方式放置路径目的地。本章最后，我们将实现向路径点的导航，使实例能够向定义的目标行走或奔跑。\n\
  \n在本章中，我们将涵盖以下主题：\n\n- 不同导航方式的概述\n- A* 寻路算法\n- 向地图添加导航目标\n- 将实例导航到目标\n\n### 技术要求\n\
  \n本章的示例代码可在 chapter13 文件夹中找到，OpenGL 版本在 01_opengl_navigation 子文件夹中，Vulkan 版本在 02_vulkan_navigation\
  \ 子文件夹中。\n\n### 不同导航方式的概述\n\n寻路和导航在视频游戏中的应用时间比人们想象的要长得多。让我们探索几种导航方法。\n\n### 基于距离的导航\n\
  \n使用简单算法来模仿敌人智能行为的最早游戏之一是 **Namco 的 Pac-Man**。四个幽灵（Blinky、Pinky、Inky 和 Clyde）各自具有略微不同的“性格”，仅由幽灵移动的目标点创建。\n\
  \n虽然红色幽灵（Blinky）直接追逐 Pac-Man，但粉色幽灵（Pinky）和蓝色幽灵（Inky）会试图抢在 Pac-Man 前面，有效地试图包围玩家。第四个幽灵（橙色\
  \ Clyde）“有自己的想法”，在追逐玩家和逃跑之间切换。\n\n关于选择新路径的决定仅在游戏迷宫的交叉路口做出，并且完全基于交叉路口所有可能路径到目标方格的距离。游戏不使用更高级的预判路径规划，有时会导致糟糕的决策。图\
  \ 13.1 显示了交叉路口的此类决策情况：\n\n![](img/3cfb9832c943f5f7366fd104b5255971_444_0.png)\n\n\
  图 13.1：Pac-Man 中红色幽灵的导航决策\n\n在图 13.1 中，绿色方框是触发向左或向右决策的区域，而两条虚线绿色线是到红色轮廓目标方格的直接距离。即使右侧路径更短，左侧路径也会被选择，因为左侧的决策距离更短，导致幽灵行为异常。在附加资源部分提供了一个链接，其中包含有关幽灵导航内部原理的深入信息。\n\
  \n\n\n\n\n基于距离的导航在游戏开发中至今仍在使用，例如，根据玩家和敌人的速度与方向，找到敌人拦截玩家的地点。随后使用基于图的导航算法来规划到达玩家的路径。\n\
  \n## 基于图的导航\n\n在图中，搜索算法使用图的节点来描述游戏地图上的位置，并使用边来描述节点之间的连接。通过构建地图的图，可以有组织地找到两个位置之间的最短路径。\n\
  \n导航中使用了多种图算法。最常见的是：\n\n- 深度优先搜索（DFS）\n- 广度优先搜索（BFS）\n- Dijkstra 算法\n- A*（读作“A star”）\n\
  \n### DFS 和 BFS 算法\n\n这两种都是简单的算法。DFS 以“深度优先”的方式遍历图，从起始节点到最远节点，而 BFS 先访问最近的节点，以“环”的方式推进到下一个节点。图\
  \ 13.2 显示了一个由六个节点 A 到 F 组成的示例图：\n\n![](img/3cfb9832c943f5f7366fd104b5255971_445_0.png)\n\
  \n图 13.2：BFS 和 DFS\n\n图 13.2 左侧的 BFS 算法在根节点 A 之后先开始最近的节点（B、C 和 D），然后遍历到节点 E 和 F。图\
  \ 13.2 右侧的 DFS 算法首先遍历子节点 D 和 D 的子节点 F，然后推进到节点 C 和 E，最后到节点 B。\n\n### Dijkstra 算法\n\
  \nDijkstra 算法为图的边添加权重。权重可以视为从一个节点到另一个节点的旅行成本或距离，具体取决于要解决的问题。Dijkstra 算法遍历整个图，构建一个包含从起始节点到图中所有其他节点的最短路径的表。\n\
  \n图 13.3 显示了起始图以及算法所有步骤执行后的结果：\n\n![](img/3cfb9832c943f5f7366fd104b5255971_446_0.png)\n\
  \n图 13.3：一个图以及从 A 到所有其他节点的最短距离\n\n通过使用 Dijkstra 算法，任何加权图都可以被遍历以找到从一个节点到所有其他节点成本最低（或距离最短）的路径，但该算法必须为每个起始节点重新运行。有关该算法的完整描述，附加资源部分提供了链接，展示了为图\
  \ 13.3 查找最短距离的步骤。\n\n### A* 算法\n\nA* 以 Dijkstra 算法为基础，但做了两个补充：\n\n- 为每个节点添加所谓的启发式，表示从该节点到目标节点的估计距离。\n\
  - 算法从起始节点搜索到指定的目标节点，通常在到达目标节点时终止。\n\n通过将从起始节点到某节点的距离与从同一节点到目标节点的估计距离相组合，并在遍历到下一个节点时使用最短总和，A*\
  \ 对目标节点进行有向搜索。因此，与 BFS 或 DFS 的无向搜索不同，A* 总是朝向目标节点前进。我们将在“ A* 路径查找算法”部分深入讨论 A*。\n\n\
  本节算法的一个缺点是，如果目标不是静态的，它们必须重新创建整个路径。对于动态目标，像 LPA*、D* 或 D*-Lite 等算法可能提供更好的结果。此外，自 A*\
  \ 引入以来，还创建了许多其他路径查找算法，旨在针对机器人等特殊环境，或进一步优化路径查找过程的结果，如 Theta*。\n\n在深入研究 A* 之前，让我们先看看视频游戏中另一种流行的导航类型，使用三角形或其他多边形来描述机器人的可步行区域，以及简要了解一下机器学习作为创建导航数据的替代方案。\n\
  \n## 基于网格的导航\n\n像 Pac-Man 和许多策略游戏这样的简单游戏使用基于距离的导航，通过将世界划分为网格，通常由矩形或六边形结构组成。但三维游戏（如开放世界）或第一人称和第三人称探索和战斗游戏的需求是不同的。由于虚拟世界的重叠部分，需要三维结构来引导计算机控制的角色穿过地图。\n\
  \n大多数具有三维地图的游戏使用导航网格、区域感知系统，或两者结合。\n\n### 导航网格\n\n导航网格（也称为 NavMeshes）大约在 2000 年左右引入游戏。导航网格是由多边形（大多数实现中使用三角形）组成、覆盖关卡几何体的附加数据结构。导航网格中的多边形标记关卡的可步行区域，省略任何计算机控制角色可能与其发生碰撞的对象和结构。\n\
  \n通过使用导航网格，机器人或 NPC 可以在虚拟世界中行走，同时避免与静态关卡几何体进行昂贵的碰撞检测，只要角色保持在导航网格上。只有当角色可以离开导航网格时，才需要碰撞检测。结合像\
  \ A* 这样的基于图的算法，可以精细控制计算机控制角色的行为。附加资源部分提供了有关使用导航网格进行路径查找的全面介绍的链接。图 13.4 显示了一个简单示例：\n\
  \n![](img/3cfb9832c943f5f7366fd104b5255971_448_0.png)\n\n图 13.4：导航网格，起点（绿色）、目标（红色）以及从起点到目标的路径\n\
  \n在图 13.4 中，顶部图片显示了使用到下一个尖角的视线中的下一个顶点，从起始三角形（绿色）到目标三角形（红色）的最短可能路径。\n\n相比之下，中间图片的路径使用三角形中心作为路径查找算法的图节点，而底部图片使用三角形内部边作为图节点。\n\
  \n路径的质量取决于网格以及将三角形的哪一部分用于图节点。图 13.4 中方法组合是可能的，因此三角形的中心和边的中点都可作为图节点使用。结果路径还可以通过跳到下一个直接可见的节点并使用样条曲线进行曲线平滑来优化。\n\
  \n请注意，如果在狭窄通道中边缘导航网格离墙壁或边界太近，实例可能会与墙壁发生碰撞，导致额外的移动修正或导致网格的不可通行部分。关卡中的静态障碍也应以安全距离绕行。\n\
  \n作为经验法则，使用实例的轴对齐包围盒边缘与中心之间的距离作为导航网格边缘与相邻关卡几何体之间的最小距离。通过始终将实例远离墙壁，可以在正常导航期间避免任何碰撞。\n\
  \n#### 从关卡数据生成导航网格\n\n通常，导航网格会手工创建并添加到关卡数据中。但我们需要一个针对互联网上找到的关卡的解决方案，因此我们在代码中做一个捷径，并使用与检测实例是否与关卡地面发生碰撞时使用的相同的向上朝向三角形作为“可能可步行地面”。\n\
  \n结合所有地面三角形之间的邻接关系，可以实现对关卡中可步行区域的估计。地面区域创建代码的一些增强作为实践课程部分中的任务提供。\n\n通过使用导航网格，可以实现两种导航：虚拟世界中的自由漫游和在路径点之间巡逻。\n\
  \n#### 自由导航\n\n自由导航中，地图上的任何点都可以作为起点和目的地的目标点。从关卡的一个部分移动到另一个部分可能计算成本高昂；最坏情况下，路径查找期间必须检查整个网格。此外，角色的路径在两次路径规划之间可能完全不同，具体取决于起点和目标的确切位置。\n\
  \n#### 路径点导航\n\n对于基于网格的导航，更好的方法是定义导航网格上的路径点，这些路径点彼此可见。例如，每扇门或道路上的每个岔路都将是一个路径点。当机器人穿过虚拟世界时，在到达期望的路径点后，将下一个路径点设为下一个目标。如果玩家被发现然后失去踪迹，机器人可以返回最近的路径点。通过确保计算机控制的角色始终能“看到”至少一个路径点，规划到该下一个路径点的路径变得廉价且易于计算。\n\
  \n### 区域感知系统\n\n1999 年，id Software 在 Quake III Arena 中使用了名为区域感知系统。不是使用二维图，而是创建了关卡的简化三维表示，包含有关关卡结构、其他机器人和玩家的所有信息。\n\
  \n\n\n\n\nThe bots can traverse the awareness areas not only by walking, jumping,\
  \ or swimming but also by using a teleporter, a jump pad, or even by doing a rocket\
  \ jump. With such a large repertoire of actions, a bot can easily follow the player\
  \ around in the level or try to cut off the player’s path.\n\nA full description\
  \ of the area awareness system is available in a link to a PDF document in the Additional\
  \ resources section.\n\n## Using machine learning to generate navigation data\n\n\
  A more recent way to create navigation data for computer-controlled characters is\
  \ machine learning, mostly in the form of so-called reinforced learning. During\
  \ reinforced learning, an agent representing the character explores the virtual\
  \ world on its own in a large amount of “trial-and-error” style rounds, but with\
  \ added rewards for achieving a defined task or a punishment for failing to complete\
  \ the task.\n\nSuch a task could be something like “Reach a defined target point\
  \ with maximum health,” “Don’t fall off the level,” or “Complete the level in minimum\
  \ time.” By taking the rewards and punishments of previous explorations into account,\
  \ the agent optimizes its behavior to maximize rewards and minimize punishments.\
  \ When the data generated by these agents is used in games, the enemies can utilize\
  \ the strategies from machine learning to appear even more natural when moving around\
  \ in the virtual world.\n\nTwo challenges of machine learning are making the usage\
  \ time- and cost-expensive:\n\n- Goals, rewards, and punishments must be clearly\
  \ defined and adjusted during the calculations. Even if we humans think that the\
  \ goals and rewards are well-defined, the machine learning algorithm could find\
  \ unexpected ways to maximize rewards. A failure in the setup may result in discarding\
  \ the data and doing a complete restart of the entire machine learning cycle.\n\
  - Since machine learning is exploring the virtual world by trial and error, progress\
  \ is non-deterministic and may happen only in insignificant amounts. Even for simple\
  \ tasks, thousands of game rounds must be played to achieve the desired results\
  \ while the game is running. Creating a complex AI that explores big levels of the\
  \ game may need a significant amount of computational resources, leading to excessive\
  \ development costs.\n\nEven though machine learning may produce better results\
  \ than algorithm-based navigation, it is recommended to check the trade-offs between\
  \ possible improvements and additional costs. A link to a video showing the progress\
  \ of letting a machine learn how to drive a car is available in the Additional resources\
  \ section.\n\nAfter the short round-up of navigation methods, let’s dive into the\
  \ A* algorithm next.\n\n## The A* path-finding algorithm\n\nThe A* algorithm was\
  \ published in 1968 in the earlier days of computing. A* is the result of the path\
  \ planning for an AI-controlled mobile robot called Shakey. The robot was developed\
  \ at the Stanford Research Institute. Its software included computer vision and\
  \ natural language processing, and it was able to do simple tasks like driving to\
  \ a place in the lab on its own, without describing every single action in advance.\
  \ A link is available in the Additional resources section with more details about\
  \ the project and the robot.\n\nBut what makes A* different from Dijkstra’s algorithm?\n\
  \nWhile Dijkstra’s algorithm only uses the weights between nodes, A* adds a heuristic\
  \ value to every node. The heuristic function calculates an estimated cost of the\
  \ cheapest path from every node to the selected target. In many cases, such as for\
  \ large worlds and many nodes, calculating the minimal costs between every pair\
  \ of nodes is computationally expensive, so an “educated guess” for the costs is\
  \ cheaper to calculate and also good enough.\n\nFor the heuristics function, any\
  \ distance calculation function can be used. In most cases, either the so-called\
  \ L1 norm will be used, known as the Manhattan distance, or the L2 norm, known as\
  \ the Euclidean distance. Figure 13.5 shows the idea behind both distance calculations:\n\
  \n![](img/3cfb9832c943f5f7366fd104b5255971_451_0.png)\n\nManhattan distance (gray\
  \ horizontal/vertical arrows) vs. Euclidean distance (green diagonal line)\n\nThe\
  \ Manhattan distance is modeled after the path of a taxicab in Manhattan. The streets\
  \ are organized in parallel lines, crossing at an angle of 90 degrees. Like a cab\
  \ in Manhattan, the blue paths in Figure 13.5 can only use the grid lines between\
  \ the start and the target. It also does not matter whether we use straight, direct\
  \ lines, as in the dark blue path, or a staircase version, like the light blue path;\
  \ the distance for both paths is identical.\n\nIn contrast, the Euclidean distance\
  \ for the green path in Figure 13.5 is calculated by using the Pythagorean theorem.\
  \ This means squaring the lengths of the distances in both directions, summing up\
  \ the squares, and calculating the square root of the sum.\n\nWhether Manhattan\
  \ distance, Euclidean distance, or any other distance calculation will be used for\
  \ the heuristics function of A* heavily depends on the needs of the application.\
  \ For instance, obstacles, hills, or enemies in a game map may need to be considered\
  \ when estimating the distances. An intuitive way to find the best function is by\
  \ drawing the paths for every heuristic function and a set of combinations for the\
  \ start and target node and comparing the results.\n\nBy using the heuristic value\
  \ to the target node, A* tries to minimize the costs of the path to the target for\
  \ every iteration.\n\n## Minimizing path costs\n\nIn every iteration, A* uses the\
  \ sum of the known costs of the path from the start node and the estimated costs\
  \ to the target node for every neighbor of the current node to calculate the minimal\
  \ costs to reach the target node. Then, the algorithm chooses the neighboring node\
  \ with the minimum costs, makes that neighboring node the current node, and starts\
  \ the next iteration.\n\nIn addition, A* saves a reference to the current node in\
  \ each visited neighboring node if the overall cost from the start to the target\
  \ over this neighbor is minimal among all neighboring nodes. Storing the parent\
  \ node in a node allows backtracking to the best path from target to source after\
  \ the target node has been reached.\n\nTo visualize the algorithm, let’s step through\
  \ a small example.\n\n## Exploring the A* algorithm\n\nFigure 13.6 shows a graph\
  \ with nodes A, B, C, and D, plus the heuristics table from every node to the desired\
  \ target node, D. The start node, in this case, is node A.\n\n![](img/3cfb9832c943f5f7366fd104b5255971_453_0.png)\n\
  \nFigure 13.6: A graph to traverse plus estimated distances to the target node,\
  \ D\n\nWe can immediately see the shortest path from node A to node D: ABCD. But\
  \ for the computer, the A* algorithm must walk through the nodes to find this path.\n\
  \nFor the first iteration, we visit the neighbors of node A, as shown in Figure\
  \ 13.7:\n\n![](img/3cfb9832c943f5f7366fd104b5255971_453_1.png)\n\nFigure 13.7: Visiting\
  \ nodes B and C\n\nHere, we calculate the estimated distance as the sum of the known\
  \ distance from A and the heuristic value of each node. The sum for node B is lower,\
  \ so we proceed to node B. We also remember the parent node for B since A is the\
  \ direct predecessor of B.\n\nThen, we look at all neighbors of node B, as shown\
  \ in Figure 13.8:\n\n![](img/3cfb9832c943f5f7366fd104b5255971_453_2.png)\n\nFigure\
  \ 13.8: Visiting nodes C and D\n\nWe do the same calculations for node C and sum\
  \ up the costs from A to B, B to C, and the heuristic from C to D. In an optimized\
  \ version of A*, our search could be already over since we reached the target node,\
  \ D.\n\nBut we continue here by checking the remaining neighbors of node D in case\
  \ there is an even shorter path available. So, we update the parent node of nodes\
  \ C and D, and visit node C as the last yet unvisited neighbor of node D, as shown\
  \ in Figure 13.9:\n\n![](img/3cfb9832c943f5f7366fd104b5255971_454_0.png)\n\n| Node\
  \ | Heuristic | Parent |\n|------|-----------|--------|\n| A    | 12        | -\
  \      |\n| B    | 6         | A      |\n| C    | 2         | B      |\n| D    |\
  \ 0         | C      |\n\nIndeed, the path to node D via nodes B and C is much shorter\
  \ than the path via B. So, we set node C as the new parent node for node D. After\
  \ all the neighboring nodes of the target node D have been visited, A* has fulfilled\
  \ its job to find a path from node A to node D.\n\nBy backtracking the parent nodes,\
  \ we get the path from the target to the start. By reversing the node order, we\
  \ now have the shortest path from the start to the target: ABCD.\n\nAs you can see,\
  \ even in this very simple example, A* cares about the total estimated costs to\
  \ the target when choosing the node to proceed with. If the algorithm learns about\
  \ a shorter distance while working on a node, the parent node used to backtrack\
  \ the best path is also updated. In the Additional resources section, a link to\
  \ a website with a deep dive into A* is available.\n\nSince we will not have a simple\
  \ two-dimensional terrain in most maps, a two-dimensional grid for navigation cannot\
  \ be used. Instead, we will use a navigation mesh to find a path from a source object\
  \ to a target object in the virtual world.\n\n\n\n\n\n## 第13章\n\n如导航网格部分所述，创建网格至少是部分手动工作，具体取决于用于创建游戏地图的编辑器。某些编辑器可以根据地图元素创建导航网格，但在大多数情况下，生成的网格必须手动修正。导航网格必须与地图其余的关卡数据存储在同一张地图中，或存储在单独的数据文件中。\n\
  \n为了同时支持地图内和独立的导航网格，寻路在可行走地面网格方面保持模块化。例如，如果你的导航网格以特殊名称保存在地图文件中，你可以将导航多边形及其邻接属性导入寻路类。你还必须将导航三角形导入单独的三角形八叉树，并进行额外的射线到三角形相交，以找到地面层三角形和导航网格三角形。A*\
  \ 寻路算法也已实现为单独的方法，允许你轻松添加其他算法或不同的启发式函数。\n\n本章示例代码中，我们将使用与地面层检测相同的思路，并使用每个网格三角形的法线来决定其是否可行走。此方法将导致导航网格中包含所有向上朝向的三角形，即使这些三角形可能无法被任何实例到达。但为了演示游戏地图中寻路和导航的一般思想，从地图的地面三角形创建导航网格已足够，并能提供合理的结果。\n\
  \n我们将使用欧几里得距离来计算节点之间的距离以及启发式函数，因为地图中的三角形很可能不是按矩形网格排列的。为了加快距离计算，我们将扩展网格三角形数据结构。\n\
  \nMeshTriangle 结构体在 OpenGL 的 OGLRenderData.h 文件中定义，在 Vulkan 的 VkRenderData.h 文件中定义。在\
  \ MeshTriangle 结构体的末尾，我们添加两个新数组，edges 和 edgeLengths：\n\n```\nstruct MeshTriangle\
  \ {\n    std::array<glm::vec3, 3> edges{};\n    std::array<float, 3> edgeLengths{};\n\
  };\n```\n\n在 edges 数组中，我们存储每个三角形的三个边。我们按与原始三角形相同的缠绕顺序排列边。由于在计算任意相邻三角形时需要边的长度，我们将每条边的长度存储在对应的\
  \ edgeLengths 元素中。\n\n现在我们可以直接进入寻路类的实现。\n\n### 添加寻路类\n\n寻路类（命名为 PathFinder）将驻留在\
  \ tools 文件夹中，该文件夹存储了在前几章中创建的所有其他辅助类，如 AABB 或 IKSolver。为了保持命名一致，头文件命名为 PathFinder.h，实现将放在\
  \ PathFinder.cpp 文件中。\n\n在 PathFinder.h 头文件的顶部，在所有 #include 指令之后，我们添加两个结构体条目。第一个新结构体命名为\
  \ NavTriangle：\n\n```\nstruct NavTriangle {\n    int index;\n    std::array<glm::vec3,\
  \ 3> points{};\n    glm::vec3 center{};\n    glm::vec3 normal{};\n    std::unordered_set<int>\
  \ neighborTris{};\n};\n```\n\n我们在这里不复用 MeshTriangle，因为我们需要一些不同的变量。虽然 index、points\
  \ 数组和法线向量相同，但我们还需要将每个三角形的中心世界位置存储在 center 变量中，并将周围三角形存储在 neighborTris 中。实例将从一个三角形中心导航到下一个三角形中心，而\
  \ neighborTris 中存储的三角形用于找到距离目标最近的三角形。\n\n对于邻居三角形，选择 std::unordered_set 而非普通的 std::vector，以便自动移除重复条目。\n\
  \n第二个结构体称为 NavData，包含 A* 算法的数据：\n\n```\nstruct NavData {\n    int triIndex;\n  \
  \  int prevTriIndex;\n    float distanceFromSource;\n    float heuristicToDest;\n\
  \    float distanceToDest;\n};\n```\n\n在 triIndex 变量中，我们存储对应 NavTriangle 的三角形索引。通过使用索引，我们可以简单查找以找到三角形数据，如位置或邻居三角形。一旦我们访问了三角形的邻居节点，我们就会将迄今为止最短路径的三角形的索引添加到\
  \ prevTriIndex 中，从而允许我们在寻路运行结束时回溯最短路径。\n\n其余三个变量（distanceFromSource、heuristicToDest\
  \ 和 distanceToDest）是 A* 算法的核心。在这里我们存储从源到当前节点的累计距离、当前节点与目标之间距离的启发式函数结果，以及两者的总和。通过比较所有邻居节点的\
  \ distanceToDest 值，A* 选择通向目标节点的下一个节点。\n\n```\nvoid generateGroundTriangles(OGLRenderData&\
  \ renderData,\nstd::shared_ptr<TriangleOctree> octree,\nBoundingBox3D worldbox);\n\
  std::vector<int> findPath(int startTriIndex,\nint targetTriIndex);\n```\n\n通过调用\
  \ generateGroundTriangles()，所有三角形八叉树中向上朝向的三角形将被定位，并为每个“可通行”三角形创建邻居信息。地面数据准备就绪后，findPath()\
  \ 可用于从起始三角形找到到目标三角形的路径。findPath() 的结果是 A* 找到的路径，作为要踩上的三角形索引向量，按从起始三角形到目标三角形的顺序排列；如果不存在有效路径，则返回空向量。\n\
  \nPathFinder 类中还有一个私有成员，名为 mNavTriangles：\n\n```\nstd::unordered_map<int, NavTriangle>\
  \ mNavTriangles{};\n```\n\n我们将计算出的地面三角形存储在 mNavTriangles 映射中。索引与三角形数据之间的映射用于通过三角形索引快速访问，该索引也作为\
  \ NavData 元素的一部分存储。\n\n让我们接下来逐步介绍地面三角形生成代码。\n\n### 生成地面三角形\n\n地面三角形是通过利用渲染器生成的三角形八叉树生成的。由于我们将对三角形八叉树进行大量请求，它将作为\
  \ generateGroundTriangles() 方法的第二个参数传入。\n\n在清除之前生成的任何导航三角形后，我们通过使用作为第三个参数给出的世界边界进行查询，从八叉树获取所有三角形：\n\
  \n```\nmNavTriangles.clear();\nstd::vector<MeshTriangle> levelTris =\noctree->query(worldbox);\n\
  ```\n\n然后我们遍历所有关卡三角形以找到向上朝向三角形的子集：\n\n```\nstd::vector<MeshTriangle> groundTris{};\n\
  NavTriangle navTri;\nfor (const auto& tri: levelTris) {\nif (glm::dot(tri.normal,\n\
  glm::vec3(0.0f, 1.0f, 0.0f)) >=\nstd::cos(glm::radians(\nrenderData.rdMaxLevelGroundSlopeAngle)))\
  \ {\ngroundTris.emplace_back(tri);\n}\n}\n```\n\n将三角形的法线与向上朝向向量点积，与 rdMaxLevelGroundSlopeAngle\
  \ 值的余弦进行比较，这一点在第12章的碰撞检测中已提到。如果当前三角形通过检查，我们将其添加到 groundTris 向量中。\n\n接下来，除了 groundTris\
  \ 中的地面三角形外，我们用最小数据填充名为 navTri 的 NavTriangle 并将其添加到 mNavTriangles 映射中：\n\n```\nnavTri.points\
  \ = tri.points;\nnavTri.normal = tri.normal;\nnavTri.index = tri.index;\nnavTri.center\
  \ = (tri.points.at(0) +\ntri.points.at(1) + tri.points.at(2)) / 3.0f;\nmNavTriangles.insert(std::make_pair(tri.index,\
  \ navTri))\n```\n\n我们在这里在 groundTris 向量和 mNavTriangles 映射中使用不同数据集，因为对三角形八叉树的查询返回\
  \ MeshTriangles 向量，但我们为地面三角形维护一个更合适的 NavTriangles 映射。\n\n```\nfor (const auto& tri\
  \ : groundTris) {\n    std::vector<MeshTriangle> nearbyTris =\n    octree->query(tri.boundingBox);\n\
  }\n```\n\n此查询效果良好，因为在第12章中，我们必须在渲染器类 OGLRenderer 或 VkRenderer 的 generateLevel0tree()\
  \ 方法中将每个三角形的边界框稍微调大，以避免三个维度中任一维度的大小为零。通过这种最小尺寸更改，关卡中相邻三角形的边界框现在会相交，三角形八叉树将返回所有邻居三角形。\n\
  \n然后我们获取 mNavTriangles 映射中同一地面三角形的引用，并遍历八叉树查询报告的所有三角形：\n\n```\nNavTriangle& navTri\
  \ = mNavTriangles.at(tri.index);\nfor (const auto& peer : nearbyTris) {\n```\n\n\
  为地面三角形使用引用很重要，因为我们将直接在映射中的 NavTriangle 对象上更新邻居三角形。\n\n即使这两个嵌套循环看起来很糟糕，总体计算时间仍然很小，因为八叉树查询只报告少量邻居三角形。我们甚至可以通过简单检查排除更多三角形：\n\
  \n```\nif (tri.index == peer.index) {\n    continue;\n}\nif (glm::dot(peer.normal,\n\
  \    glm::vec3(0.0f, 1.0f, 0.0f)) <\n    std::cos(glm::radians(\n    renderData.rdMaxLevelGroundSlopeAngle)))\
  \ {\n    continue;\n}\n```\n\n\n\n查询碰撞三角形时也可能报告我们当前正在检查的地形三角形，因此如果在结果中找到它，我们会立即返回。我们还从可能邻居列表中删除所有未朝上的三角形，因为我们只对相邻的地形三角形感兴趣。\n\
  \n在 Assimp 出现三角剖分错误的情况下，我们还需要检查 peer 三角形是否在 mNavTriangles 中：\n\n```\nif (mNavTriangles.count(peer.index)\
  \ == 0) {\n    continue;\n}\n```\n\n如果我们找到一个有效的邻居三角形，我们将从 mNavTriangles 映射中获取邻居三角形：\n\
  \n```\nNavTriangle peerNavTri =\n    mNavTriangles.at(peer.index);\n```\n\n最后，我们可以对两个三角形的全部三个顶点进行循环以检查相邻性：\n\
  \n```\nfor (int i = 0; i < 3; ++i) {\n    for (int j = 0; j < 3; ++j) {\n```\n\n\
  在循环内部，我们计算每个顶点到另一个三角形边的距离：\n\n```\nglm::vec3 pointToPeerLine =\n    glm::cross(tri.points.at(j)\
  \ -\n    peer.points.at(i), tri.points.at(j) -\n    peer.points.at((i + 1) % 3));\n\
  float pointDistance =\n    glm::length(pointToPeerLine) /\n    peer.edgeLengths.at(i);\n\
  glm::vec3 peerPointToTriline =\n    glm::cross(peer.points.at(j) -\n    tri.points.at(i),\
  \ peer.points.at(j) -\n    tri.points.at((i + 1) % 3));\nfloat peerPointDistance\
  \ =\n    glm::length(peerPointToTriline) /\n    tri.edgeLengths.at(i);\n```\n\n\
  通过计算所有顶点到另一个三角形每条边的距离，我们可以检测三角形是否共享一个顶点或一条边，或者一个三角形的顶点是否位于另一个三角形的边上。\n\n接下来，我们创建两个名为\
  \ navOpenList 和 navClosedList 的集合以及一个名为 navPoints 的映射：\n\n```\nstd::unordered_set<int>\
  \ navOpenList{};\nstd::unordered_set<int> navClosedList{};\nstd::unordered_map<int,\
  \ NavData> navPoints{};\n```\n\n在 navOpenList 变量中，我们存储所有作为下一次迭代候选节点的邻居，而在 navClosedList\
  \ 中，我们保存所有已完全探索的节点。navPoints 映射包含有关所有已知节点的数据，如距离和父节点。\n\n在 A* 算法第一次迭代之前，我们将 currentIndex\
  \ 变量设置为起始三角形并创建起始三角形的导航数据：\n\n```\nint currentIndex = startTriIndex;\nNavData navStartPoint{};\n\
  navStartPoint.triIndex = startTriIndex;\nnavStartPoint.prevTriIndex = -1;\nnavStartPoint.distanceFromSource\
  \ = 0;\nnavStartPoint.heuristicToDest = \nglm::distance(startPoint, targetPoint);\n\
  navStartPoint.distanceToDest = \nnavStartPoint.distanceFromSource + \nnavStartPoint.heuristicToDest;\n\
  navPoints.emplace(std::make_pair(startTriIndex,\nnavStartPoint));\nnavOpenList.insert(startTriIndex);\n\
  ```\n\n距离目标点的距离通过调用 glm::distance 计算为欧几里得距离，而距离起始点的距离设置为零，因为我们仍在起始点。我们还将起始节点同时添加到开放节点列表和包含导航数据的映射中。\n\
  \n对于 A* 算法的主循环，我们启动一个 while 循环，该循环在命中目标三角形时结束。该循环在某些时间点不保证结束，例如如果目标三角形在不可达网格之外，因此我们需要在循环末尾添加退出条件：\n\
  \n```\nwhile (currentIndex != targetTriIndex) {\nNavTriangle currentTri = mNavTriangles.at(currentIndex);\n\
  glm::vec3 currentTriPoint = currentTri.center;\n```\n\n```\nstd::unordered_set<int>\
  \ neighborTris =\n    currentTri.neighborTris;\n```\n\n每次循环迭代时，我们从 mNavTriangles\
  \ 映射中提取当前三角形，并获取世界坐标中的中心点和邻居三角形。\n\n接下来，我们遍历所有邻居三角形并提取三角形的中心点：\n\n```\nfor (const\
  \ auto& navTriIndex : neighborTris) {\n    NavTriangle navTri = mNavTriangles.at(navTriIndex);\n\
  \    glm::vec3 navTriPoint = navTri.center;\n```\n\n如果相邻节点尚未完全探索且甚至尚未访问过，我们继续进入两个\
  \ if 条件并将节点添加到开放列表中：\n\n```\nif (navClosedList.count(navTriIndex) == 0) {\n    if\
  \ (navOpenList.count(navTriIndex) == 0) {\n        navOpenList.insert(navTriIndex);\n\
  ```\n\n作为提醒，closed 列表包含所有完全探索的节点，而 open 列表包含所有已知邻居但尚未完全探索的节点，这些节点属于任意节点，甚至是已关闭的节点。此时，我们知道这是一个新节点需要访问，因此我们创建新的导航数据：\n\
  \n```\nNavData navPoint{};\nnavPoint.triIndex = navTriIndex;\nnavPoint.prevTriIndex\
  \ = currentIndex;\n```\n\n对于距离计算，我们获取当前索引的距离，即我们的父节点，并将两个节点之间的距离添加到源距离中：\n\n```\n\
  NavData prevNavPoint =\n    navPoints.at(navPoint.prevTriIndex);\nnavPoint.distanceFromSource\
  \ =\n    prevNavPoint.distanceFromSource +\n    glm::distance(currentTriPoint, navTriPoint);\n\
  navPoint.heuristicToDest =\n    glm::distance(navTriPoint, targetPoint);\nnavPoint.distanceToDest\
  \ =\n    navPoint.distanceFromSource +\n    navPoint.heuristicToDest;\nnavPoints.emplace(\n\
  ```\n\n## 添加简单导航\n\n```\nstd::make_pair(navTriIndex, navPoint));\n}\n```\n\n作为代码块的最后一步，我们将新的导航数据添加到\
  \ navPoints 映射中，该映射包含有关所有当前已知节点的数据。\n\n```\n} else {\nNavData& navPoint = navPoints.at(navTriIndex);\n\
  }\n```\n\n在这里，我们获取对导航数据的引用以便就地更新信息。对于现有的导航点，我们根据已知的源距离和到目标的启发式值计算新的估计距离：\n\n```\n\
  NavData possibleNewPrevNavPoint =\nnavPoints.at(currentIndex);\nfloat newDistanceFromSource\
  \ =\npossibleNewPrevNavPoint.distanceFromSource +\nglm::distance(currentTriPoint,\
  \ navTriPoint);\nfloat newDistanceToDest = newDistanceFromSource +\nnavPoint.heuristicToDest;\n\
  ```\n\n如果通过此节点的新的路径比之前已知的路径更短，我们将更新导航数据以反映新的、更短的路径：\n\n```\nif (newDistanceToDest\
  \ < navPoint.distanceToDest) {\nnavPoint.prevTriIndex = currentIndex;\nnavPoint.distanceFromSource\
  \ =\nnewDistanceFromSource;\nnavPoint.distanceToDest = newDistanceToDest;\n}\n```\n\
  \n在检查完所有相邻节点后，我们将当前节点添加到 closed 列表中，将其标记为已完全探索：\n\n```\nnavClosedList.insert(currentIndex);\n\
  ```\n\n如果我们的 open 列表变为空，我们返回一个空向量：\n\n```cpp\nif (navOpenList.empty()) {\n\treturn\
  \ std::vector<int>{};\n}\n```\n\n我们在继续之前检查 open 列表是否为空，因为下一步涉及遍历 open 列表中的所有元素。\n\
  \n## 提取最佳节点\n\n一旦我们收集了所有新节点并更新了所有现有节点的距离，我们就需要找到从起点到目标的组合距离最短的节点。我们将在此处使用优先队列，以最小化访问具有最小距离的节点的成本。优先队列将根据比较函数对所有节点排序到树结构中，并允许将最大或最小节点作为最顶层元素访问。\n\
  \n首先，我们为优先队列创建比较函数：\n\n```cpp\nauto cmp = [](NavData left, NavData right) {\n\t\
  return left.distanceToDest > right.distanceToDest;\n};\n```\n\n默认情况下，优先队列使用 std::less\
  \ 作为比较函数，导致队列的顶部元素为最大值。但通过使用 cmp 函数，我们将使到目的地的最小距离成为顶部元素。\n\n现在我们可以填充队列，通过推送 open\
  \ 列表中的所有三角形：\n\n```cpp\nstd::priority_queue<NavData, std::vector<NavData>, decltype(cmp)>\
  \ navDataQueue(cmp);\nfor (const auto& triIndex : navOpenList) {\n\tNavData navPoint\
  \ = navPoints.at(triIndex);\n\tnavDataQueue.push(navPoint);\n}\n```\n\n接下来，我们声明一个空的导航数据变量并通过调用\
  \ top() 从队列中提取具有最小距离的索引：\n\n```cpp\nNavData nextPointToDest{};\nnextPointToDest\
  \ = navDataQueue.top();\ncurrentIndex = nextPointToDest.triIndex;\n```\n\n\n\n\n\
  \n我们现在可以用任意的起始和目标三角形组合来调用 findPath()，如果存在路径则会返回一条路径。如果从起点到目标不存在路径，findPath() 会因\
  \ open 列表为空的检查而返回一个空向量。\n\n路径查找的起点是已知的；它就是该实例。但目标呢？让我们为虚拟世界添加一些可配置的导航目标。\n\n## 向地图添加导航目标\n\
  \n开始之前，让我们设想一个可能的导航目标必须具备哪些属性：\n\n- 它可以有任意形状和数量。\n- 它易于选择和移动。\n- 它可以放置在地面上的任何位置。\n\
  - 理想情况下，它应该能够自行移动。\n\n因此，我们理想的目标是一个模型实例！而且由于我们已经拥有了这个列表所需的所有要素，实现导航目标变得很容易。\n\n\
  ## 调整模型和实例\n\n首先，我们在 ModelSettings 结构体中添加一个名为 msUseAsNavigationTarget 的新布尔变量：\n\n\
  ```\nbool msUseAsNavigationTarget = false;\n```\n\nAssimpModel 类也需要两个简单的公共方法，名为\
  \ setAsNavigationTarget() 和 isNavigationTarget()，用于设置和查询新的变量：\n\n```\nvoid setAsNavigationTarget(bool\
  \ value);\nbool isNavigationTarget();\n```\n\n在 UserInterface 类中，将添加一个复选框，通过简单的鼠标点击来设置模型的状态。图\
  \ 13.10 显示了带有新复选框的 Models 布局：\n\n![](img/3cfb9832c943f5f7366fd104b5255971_467_0.png)\n\
  \n图 13.10：带有新的导航目标复选框选中的 UI 中的 Models 部分\n\n无需切换实例即可找到目标，按下 Center Target 即可将目标居中到屏幕中间。\n\
  \n对于导航目标的组合框，将在 Callbacks.h 文件中添加一个名为 getNavTargetsCallback 的回调：\n\n```\nusing getNavTargetsCallback\
  \ = std::function<std::vector<int>(void)>;\n```\n\n渲染器类文件 OGLRenderer.cpp 和 VkRenderer.cpp\
  \ 中对应的方法是 getNavTargets()，它收集所有被启用为导航目标的模型实例的索引：\n\n```\nstd::vector<int> targets;\n\
  for (const auto& model : mModelInstCamData.micModelList) {\n    if (!model->isNavigationTarget())\
  \ {\n        continue;\n    }\n}\n```\n\n我们遍历所有模型，如果模型不是导航目标，则继续下一个模型。如果模型被标记为导航目标，我们将所有索引存储在名为\
  \ targets 的向量中并返回该向量：\n\n```\nstd::string modelName = model->getModelFileName();\n\
  for (auto& instance : mModelInstCamData.\n    micAssimpInstancesPerModel[modelName])\
  \ {\n    InstanceSettings settings =\n        instance->getInstanceSettings();\n\
  \    targets.emplace_back(\n        settings.isInstanceIndexPosition);\n}\n}\nreturn\
  \ targets;\n```\n\n为了将目标放置在地面上，我们还需要应用重力。\n\n## 为非动画实例添加重力\n\n目前重力仅影响任何动画实例，因为我们在第\
  \ 12 章中需要它们保持在地面上以进行碰撞检测和逆运动学。由于我们保持了动画和非动画模型的代码大部分相似，为非动画实例添加重力只需做几处小的改动。\n\n首先，将包含\
  \ mLevelCollisionTimer.start() 和 mLevelCollisionTimer() 调用的整个代码块复制到将当前实例添加到实例八叉树之后的调用下方，如以下代码块所示：\n\
  \n```\nmOctree->add(\n    instSettings.isInstanceIndexPosition);\n    mLevelCollisionTimer.start();\n\
  \    ...\n    mRenderData.rdLevelCollisionTime +=\n    mLevelCollisionTimer.stop();\n\
  ```\n\n然后，在新代码下方添加对 updateInstancePosition() 的调用：\n\n```\ninstances.at(i)->updateInstancePosition(\n\
  \    deltaTime);\n```\n\n最后，将检索包含世界变换的矩阵的操作从块的开头移动到实例位置更新之后：\n\n```\nmWorldPosMatrices.at(i)\
  \ =\n    instances.at(i)->getWorldTransformMatrix();\n```\n\n就这样！\n\n现在重力和地面碰撞也会为非动画实例计算，实例位置会被更新，并且最新的世界变换会被收集并添加到\
  \ mWorldPosMatrices 数组中，然后上传到 Shader Storage Buffer Object。\n\n## 保存和加载新的模型和实例数据\n\
  \n将新值存储在 YAML 配置文件中并恢复设置应该不需要进一步解释。用于将模型用作导航目标的布尔值存储在 ModelSettings 结构体中，而实例的所有新路径查找和导航变量则存储在\
  \ InstanceSettings 结构体中。将新值添加到 YAML 发射器和解析器只是复制粘贴的问题。YAML 配置版本也应更新以反映新值。\n\n我们已经有了地面三角形、路径查找算法以及路径的起点和目标点。剩下的就是让实例沿着路径移动的逻辑。所以，让我们现在添加最后一部分。\n\
  \n## 让实例导航到目标\n\n为了计算或更新到目标实例的路径，我们需要在渲染器中添加更多代码。我们从添加计算实例到目标位置的实际路径的代码开始。\n\n##\
  \ 计算到目标的路径\n\n路径更新代码的最佳位置是在渲染器类 OGLRenderer.cpp 或 VKRenderer.cpp 的 draw() 调用中遍历所有动画实例的循环里，紧跟在刚刚为非动画实例复制的地面和碰撞检测代码之后。我们拥有实例的最终世界位置，包括任何重力更新，可以将此位置用作路径查找算法的起点。\n\
  \n```\nif (instSettings.isNavigationEnabled) {\n\tint pathTargetInstance =\n\t\t\
  instSettings.isPathTargetInstance;\n}\n```\n\n然后，我们对目标实例进行健全性检查，以避免在访问 micAssimpInstances\
  \ 向量时崩溃：\n\n```\nif (pathTargetInstance >= mModelInstCamData.micAssimpInstances.size())\
  \ {\n\tpathTargetInstance = -1;\n\tinstances.at(i)->setPathTargetInstanceId(\n\t\
  \tpathTargetInstance);\n}\n```\n\n接下来，提取目标当前所在的三角形索引以及目标的世界位置：\n\n```\nint pathTargetInstanceTriIndex\
  \ = -1;\nglm::vec3 pathTargetWorldPos = glm::vec3(0.0f);\nif (pathTargetInstance\
  \ != -1) {\n\tstd::shared_ptr<AssimpInstance> targetInstance =\n\t\tmModelInstCamData.micAssimpInstances.at(\n\
  \t\t\tpathTargetInstance);\n\tpathTargetInstanceTriIndex =\n\t\ttargetInstance->\n\
  \t\tgetCurrentGroundTriangleIndex();\n}\n```\n\n```\npathTargetWorldPos =\n    targetInstance->getWorldPosition();\n\
  }\n```\n\n由于目标实例可能自行移动或被用户移动，目标三角形索引必须在每次路径更新前检索。此三角形索引更新确保实例会跟随目标，无论目标是静态路点还是在关卡中游荡的另一个实例。\n\
  \n现在我们检查当前实例和目标实例是否都有有效的地面三角形，并且我们或目标是否已远离保存的三角形。只有在所有条件都满足时，我们才会重新计算路径，避免在源或目标未发生变化时进行昂贵的计算：\n\
  \n```\nif ((instSettings.isCurrentGroundTriangleIndex > -1 &&\n    pathTargetInstanceTriIndex\
  \ > -1) &&\n    (instSettings.isCurrentGroundTriangleIndex !=\n    instSettings.isPathStartTriangleIndex\
  \ ||\n    pathTargetInstanceTriIndex !=\n    instSettings.isPathTargetTriangleIndex))\
  \ {\n    instances.at(i)->setPathStartTriIndex(\ninstSettings.isCurrentGroundTriangleIndex);\n\
  \    instances.at(i)->setPathTargetTriIndex(\n        pathTargetInstanceTriIndex);\n\
  ```\n\n在发生任何变化的情况下，我们会调整当前实例的起始和目标三角形。利用三角形的最新数据，我们可以调用 findPath()：\n\n```\nstd::vector<int>\
  \ pathToTarget =\n    mPathFinder.findPath(\n    instSettings.isCurrentGroundTriangleIndex,\n\
  \    pathTargetInstanceTriIndex);\n```\n\n结果可能为空，如果未找到有效路径。在这种情况下，我们禁用实例的导航并使目标实例失效，将其设置为\
  \ -1：\n\n```\nif (pathToTarget.size() == 0) {\n    instances.at(i)->setNavigationEnabled(false);\n\
  \    instances.at(i)->setPathTargetInstanceId(-1);\n} else {\n```\n\n\n\n\n\n```\n\
  instances.at(1)->setPathToTarget(pathToTarget);\n```\n\n如果路径有效，我们就在实例中设置路径索引。\n\n\
  由于路径只会在发生变化时更新，我们现在获取实例已保存或刚刚更新的路径：\n\n```\nstd::vector<int> pathToTarget = instances.at(1)->getPathToTarget();\n\
  ```\n\n为了避免在开始或结束前往目标的路径时出现别扭的移动，我们移除了实例路径中的起始和目标三角形：\n\n```\nif (pathToTarget.size()\
  \ > 1) {\n\tpathToTarget.pop_back();\n}\nif (pathToTarget.size() > 0) {\n\tpathToTarget.erase(pathToTarget.begin());\n\
  }\n```\n\n路径是在实例当前站立的地面三角形的中心与目标所在的地面三角形之间创建的。如果实例已经比三角形中心更接近，路径就会指向后方，实例可能永远无法离开当前的地面三角形。我们也可以在\
  \ PathFinder 类中移除这些元素，但如果我们想在 findPath() 生成的数据在其他地方使用，三角形可能仍是需要的。因此，我们在这里截断三角形索引。\n\
  \n作为寻路的最后一步，我们根据 pathToTarget 中是否还有路径，旋转实例朝向下一个路径点或目标：\n\n```\nif (pathToTarget.size()\
  \ > 0) {\n\tint nextTarget = pathToTarget.at(0);\n\tglm::vec3 destPos = mPathFinder.getTriangleCenter(nextTarget);\n\
  \tinstances.at(1)->rotateTo(destPos, deltaTime);\n} else {\n\tinstances.at(1)->rotateTo(pathTargetWorldPos,\
  \ deltaTime);\n}\n```\n\n对 PathFinder 类的 getTriangleCenter() 的调用返回请求三角形的世界坐标下的中心。该中心点随后会传入实例的\
  \ rotateTo() 方法，因此让我们接下来查看旋转方法的实现。\n\n## 旋转实例以到达目标\n\n新的公共方法 rotateTo() 必须添加到 AssimpInstance\
  \ 类中。\n\n首先，我们检查实例当前是否正在行走或奔跑。实例在地面上空闲站立时旋转看起来会很奇怪：\n\n```\nif (mInstanceSettings.isMoveState\
  \ != moveState::walk &&\n    mInstanceSettings.isMoveState != moveState::run) {\n\
  \    return;\n}\n```\n\n然后，我们获取当前实例的旋转向量以及从当前位置指向目标位置的向量：\n\n```\nglm::vec3 myRotation\
  \ = get2DRotationVector();\nglm::vec3 twoDimWorldPos =\n    glm::vec3(mInstanceSettings.isWorldPosition.x,\n\
  \    0.0f, mInstanceSettings.isWorldPosition.z);\nglm::vec3 toTarget = glm::normalize(glm::vec3(\n\
  \    targetPos.x, 0.0f, targetPos.z) - twoDimWorldPos);\n```\n\n我们只关心绕 Y 轴的旋转，因此使用实例的二维旋转向量，并将指向目标的向量也简化为\
  \ X 和 Z 维度的值。\n\n通过使用两个向量 myRotation 和 toTarget，我们可以通过点积计算两者之间的夹角：\n\n```\nfloat\
  \ angleDiff = glm::degrees(std::acos(\n    glm::dot(myRotation, toTarget)));\n```\n\
  \n最后，我们计算包含两个向量之间旋转的四元数，提取欧拉角，并使用角度的 y 分量来旋转实例：\n\n```\nif (angleDiff > 6.0f) {\n\
  \    glm::quat destRoation =\n        glm::rotation(toTarget, myRotation);\n```\n\
  \n```\nglm::vec3 angles = glm::eulerAngles(destRoation);\nrotateInstance(glm::degrees(angles.y)\
  \ *\n    deltaTime * 2.0f);\n}\n```\n\n乘以 deltaTime 使实例旋转变得平滑，因为每一帧的角度都很小。初始的 angleDiff\
  \ 值比较确保我们留有一个小的“死区”，从而在路径几乎笔直时减少旋转次数，并在旋转略微超调时避免振荡。\n\n如果目标在关卡中移动，死区还能在实例路径被重新创建时减少修正次数。通过仔细调整超调量和死区角度，追逐的实例会表现得更自然，因为这两个参数都可以减少跟随目标时的方向变化次数。\n\
  \n为了让计算出的路径可见，我们还应为渲染器添加可视化输出。\n\n## 为路径添加调试线\n\n将路径绘制到屏幕上惊人地简单。除了在 OGLRenderData\
  \ 结构体中为 OpenGL 添加一个名为 rdDrawInstancePaths 的控制布尔值，分别在 VkRenderData 结构体中为 Vulkan 添加，并在渲染器中添加一个新的线网格以及在\
  \ UserInterface 类中添加一个复选框，在所有路径点之间创建线条就很容易了。新增代码的最佳位置是在 计算前往目标的路径 部分添加的代码之后。\n\n\
  首先，我们检查是否应该创建线条以及是否有有效目标：\n\n```\nif (mRenderData.rdDrawInstancePaths &&\n    pathTargetInstance\
  \ > -1) {\n```\n\n然后，我们设置期望的颜色和路径的高度偏移，并创建用于绘制线的顶点：\n\n```\nglm::vec3 pathColor\
  \ = glm::vec3(0.4f, 1.0f, 0.4f);\nglm::vec3 pathYOffset = glm::vec3(0.0f, 1.0f,\
  \ 0.0f);\nOGLLineVertex vert;\nvert.color = pathColor;\n```\n\n接下来，我们将当前实例的世界位置作为线条的起点添加：\n\
  \n```\nvert.position = instSettings.isWorldPosition +\n    pathYOffset;\nmInstancePathMesh->vertices.emplace_back(vert);\n\
  ```\n\n如果我们有有效路径，我们提取路径中第一个三角形中心的世界位置作为第一条线的第二个点。由于我们已经移除了起始三角形，线条将被绘制到路径中的下一个三角形：\n\
  \n```\nif (pathToTarget.size() > 0) {\n    vert.position = mPathFinder.getTriangleCenter(\n\
  \        pathToTarget.at(0)) + pathYOffset;\n    mInstancePathMesh->vertices.emplace_back(vert);\n\
  }\n```\n\n然后，我们创建一个新的临时线网格并通过调用 PathFinder 类的 getAsLineMesh() 来获取路径段的顶点：\n\n```\n\
  std::shared_ptr<OGLLineMesh> pathMesh =\n    mPathFinder.getAsLineMesh(pathToTarget,\n\
  \        pathColor, pathYOffset);\n    mInstancePathMesh->vertices.insert(\n   \
  \     mInstancePathMesh->vertices.end(),\n        pathMesh->vertices.begin(),\n\
  \        pathMesh->vertices.end());\n```\n\n辅助方法 getAsLineMesh() 只是提取路径上地面三角形的中心点，将期望的偏移量添加到顶点的世界位置，并从顶点创建线条。\n\
  \n现在，我们将最后一个位置作为最后一条线的可能起点添加：\n\n```\nvert.position = mPathFinder.getTriangleCenter(\n\
  \    pathToTarget.at(pathToTarget.size() - 1)) +\n    pathYOffset;\n    mInstancePathMesh->vertices.emplace_back(vert);\n\
  }\n```\n\n作为线条创建的最后一步，我们添加目标的世界位置：\n\n```\nvert.position = pathTargetWorldPos +\
  \ pathYOffset;\n    mInstancePathMesh->vertices.emplace_back(vert);\n```\n\n如果在移除第一个和/或最后一个元素后路径为空，我们跳过\
  \ if 条件内的代码，只从当前位置绘制一条线到目标。这仅在我们有有效目标且起始和目标三角形直接相邻时发生。如果寻路过程中出现错误且路径为空，我们会重置目标实例，线条将不再绘制。\n\
  \n可听侧并讨论向应用程序添加音效和音乐的方法和工具。然后，我们将查看为世界增添更多生机的想法，并随后讨论增强虚拟世界视觉效果的想法。我们将查看实例之间的任务和交互，最后探索昼夜和天气变化的影响。\n\
  \n## 实践环节\n\n以下是你可以对代码进行的改进：\n\n- 即使地面三角形很大，也平滑路径。\n\n通过查找接下来的几个路径段，可能可以创建这些段的平均值。对于更尖锐的转弯，可以使用样条曲线来平滑三角形之间的过渡。\n\
  \n- 清理生成的三角形邻居列表。\n\n目前，相邻三角形的列表相当庞大。当为关卡激活邻居网格调试绘制时可以看出这一点。尝试找到一种解决方案，只包含共享部分边的三角形。\n\
  \n- 在墙壁和路径线之间添加最小距离。\n\n对于生成的地面三角形，一些中心位置可能离墙壁太近，导致实例在跟随路径时发生碰撞。在某些情况下，路径甚至会穿过关卡几何体的边缘，当三角形被视为相邻时。创建地面三角形时，尝试找到网格的轮廓并按可配置的量减小其大小。\n\
  \n- 使用实例 AABB 来检测狭窄通道。\n\n某些地图可能有需要精确导航的通道。在没有真正的导航网格的情况下，你可以尝试沿路径使用实例的包围盒来查找可能的碰撞并调整路径以避免与关卡结构发生碰撞。\n\
  \n- 高级难度：在编辑器中创建导航网格并加载该网格。\n\n如果你对使用 Blender 等工具很有信心，可以尝试将导航网格作为关卡的单独网格创建，甚至作为单独的文件，与关卡文件一起保存。然后，将导航网格加载到\
  \ PathFinder 类中，为实例提供无碰撞的地面。\n\n\n\n\n\n## 附加资源\n- Pac-Man 中的幽灵导航：https://gameinternals.com/understanding-pac-man-ghost-behavior\n\
  - Dijkstra 算法：https://graphicmaths.com/computer-science/graph-theory/dijkstras-algorithm/\n\
  - Quake III Arena 的区域感知系统：http://www.kbs.twi.tudelft.nl/docs/MSc/2001/Waveren_Jean-Paul_van/thesis.pdf\n\
  - 导航网格：https://www.gamedev.net/tutorials/programming/artificial-intelligence/navigation-meshes-and-pathfinding-r4880/\n\
  - Shakey 机器人：https://www.sri.com/hoi/shakey-the-robot/\n- A* 简介：https://www.redblobgames.com/pathfinding/a-star/introduction.html\n\
  - 使用导航网格的 A*：https://medium.com/@mscansian/a-with-navigation-meshes-246fd9e72424\n\
  - Unreal Engine 中的导航网格：https://dev.epicgames.com/documentation/en-us/unreal-engine/basic-navigation-in-unreal-engine\n\
  - 在 Unreal Engine 项目中实现 A*：https://www.youtube.com/watch?v=xak129fupCA\n- 在 Trackmania\
  \ 中训练无敌 AI：https://www.youtube.com/watch?v=Dw3BZ6O_8LY\n- Recast Navigation：https://github.com/recastnavigation/recastnavigation\n\
  - 平滑路径优化：https://www.gameaipro.com/GameAIPro3/GameAIPro3_Chapter20_Optimization_for_Smooth_Paths.pdf\n\
  - 更逼真的寻路：https://www.gamedeveloper.com/programming/toward-more-realistic-pathfinding\n\
  \n## 在 Discord 上加入我们的社区\n\n加入我们社区的 Discord 空间，与作者和其他读者进行讨论：\nhttps://packt.link/cppgameanimation\n\
