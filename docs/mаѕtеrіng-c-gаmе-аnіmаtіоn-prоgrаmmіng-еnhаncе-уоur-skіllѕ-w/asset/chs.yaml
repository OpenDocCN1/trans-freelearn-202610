  \ Open Asset Import Library\n\n对于 Windows，必须从源文件构建并安装 Open Asset Import Library。从\
  \ https://github.com/assimp/assimp 克隆存储库到新的 Visual Studio 2022 项目中，如图 1.3 所示：\n\n\
  ![](img/3cfb9832c943f5f7366fd104b5255971_38_0.png)\n\n作为替代方案，你可以从 Git Bash 或通过 Git\
  \ GUI 创建克隆：\n\n```\ngit clone https://github.com/assimp/assimp\n```\n\n## Configuring\
  \ the build\n\n我们需要进行一些调整以创建静态库而不是动态库。使用静态库使我们的构建过程更简单，因为我们不必担心额外的 DLL 文件。\n\n要更改\
