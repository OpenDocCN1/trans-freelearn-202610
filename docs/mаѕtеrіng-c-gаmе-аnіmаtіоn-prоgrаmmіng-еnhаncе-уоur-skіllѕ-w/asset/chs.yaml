  \ as a ZIP file\n\n虽然推荐使用 Git，但你也可以从 GitHub 将代码作为 ZIP 文件下载。你需要将 ZIP 文件解压到系统上你选择的某个位置。此外，请确保解压\
  \ ZIP 文件的路径中不包含空格或特殊字符。\n\n在我们使用本书的代码之前，必须安装一些工具和库。我们将先从 Windows 安装开始，然后是 Linux\
  \ 安装。\n\n### Installing the required tools and libraries for Windows\n\n要在 Windows\
  \ 机器上编译示例代码，我建议使用 Visual Studio 2022 作为 IDE，因为它包含了快速入门所需的一切。使用其他 IDE 如 Eclipse、Rider\
  \ 或 KDevelop 也没问题，因为构建由 CMake 管理，但你可能需要安装 C++ 编译器，如 MSYS2 加上编译器包作为额外依赖。\n\n### Installing\
  \ Visual Studio 2022 on Windows\n\n如果你想使用 Visual Studio 来使用示例文件且尚未安装，请从 https://visualstudio.microsoft.com/de/downloads/\
  \ 下载免费的 Community Edition。\n\n双击该文件将自动启动 Windows 注册表编辑器，以将设置导入 Windows 注册表。确认 UAV\
