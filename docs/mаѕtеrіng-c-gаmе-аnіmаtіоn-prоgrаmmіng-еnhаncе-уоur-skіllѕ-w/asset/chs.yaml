  - ImGui的imnodes扩展：https://github.com/Nelarius/imnodes\n\n## 加入我们的Discord社区\n\n加入我们的Discord社区与作者和其他读者进行讨论：\n\
  \nhttps://packt.link/cppgameanimation\n\n![](img/3cfb9832c943f5f7366fd104b5255971_327_0.png)\n"
- "# 第10章 高级动画混合\n\n## 高级动画混合\n\n欢迎来到 *第10章*！在前一章中，我们向实例添加了更多*真实生活行为*。在简要概述了行为树后，我们添加了一个可视化节点编辑器，使用简单的有限状态机来直观地绘制实例的行为。在本章末尾，我们扩展了代码并将交互实现为行为的另一种形式。\n\
  \n在本章中，实例将更加生动。我们将首先简要探索由形态目标动画制作的面部动画世界。然后我们将添加额外的功能将形态网格加载到应用程序中，并对实例的面部动画进行控制。接下来，我们添加一个图节点，以便也能在节点树中使用面部动画。在本章末尾，将实现附加混合，允许我们独立于骨骼和面部动画移动实例的头部。\n\
  \n在本章中，我们将涵盖以下主题：\n\n- 如何制作面部表情动画\n- 将面部动画添加到代码和GPU着色器中\n- 在节点树中使用面部动画\n- 实现附加混合\n\
  \n## 技术要求\n\n示例代码位于chapter10文件夹中，OpenGL的01_opengl_morphanim子文件夹和Vulkan的02_vulkan_morphanim子文件夹。\n\
  \n## 如何制作面部表情动画\n\n在第9章实现行为后，我们虚拟世界中的生活变得更加生动。实例可以独自走或跑，做随机时间的简单任务，对与其他实例的碰撞做出反应，不会越过不可见的边界离开虚拟世界。\n\
  \n但是实例仍然显得有点无菌和死气沉沉。它们像机器人一样四处游荡，总是向前看，保持一张直板板的脸。没有可见的情绪，除了播放挥手动画外，对交互也没有反应。\n\n\
  所以，让我们通过添加面部表情来赋予实例展示情绪的能力。向任何种类的活的虚拟对象添加面部动画的最常见方式是形态目标动画。\n\n为了理解形态目标动画，这里有一个简单的例子。在图10.1中，显示了三种不同权重的形态目标动画：\n\
  \n![](img/3cfb9832c943f5f7366fd104b5255971_330_0.png)\n\n左边的人脸应用了0%的愤怒形态目标动画，只显示原始脸。中间的人脸应用了50%的形态目标，介于原始脸和完整形态之间，右边的人脸应用了完整的形态目标动画。\n\
  \n如您所见，眉毛已被旋转，嘴巴顶点在最终状态中向上移动了一点，顶点位置仅在原始和最终网格之间插值。但这些小的顶点位置变化为模型创造了完全不同的面部表情。\n\n\
  形态目标动画在您的工具中可能有不同的名称，如逐顶点动画、形状插值、形状键或混合形状。所有这些名称描述的是相同的技巧：网格的多个变形版本存储在关键帧中，网格的动画通过在关键帧位置之间插值顶点位置来完成。\n\
  \n\n\n\n就开销而言，骨骼动画与变形目标动画（morph target animation）之间有一个重要区别：骨骼动画只影响模型节点的属性，而变形动画会替换模型虚拟皮肤的整个网格，并且模型每播放一个变形动画，该网格就需要对应复制一份，从而增大了模型作为文件在磁盘上和内存中的整体大小。\n\
  \n模型的骨骼数量相当少，但皮肤的顶点数量很多，因此每帧为大量顶点重新计算位置会给变形动画带来额外的计算成本。幸运的是，变形动画完全在顶点着色器中执行，并且只是对以向量形式保存的两个位置进行线性插值。因此，在我们的示例代码中，变形动画带来的额外计算负担可以忽略不计。\n\
  \n在 Blender 中，变形目标动画可以通过“数据”（Data）选项卡上的“形态键”（Shape Keys）选项来控制。图 10.2 显示了用于图 10.1\
  \ 中右侧的脸的设置，其中“数值”（Value）设置为 1.000，以 100% 应用“Angry”（愤怒）变形：\n\n![](img/3cfb9832c943f5f7366fd104b5255971_331_0.png)\n\
  \n在 Blender 中创建和修改基于形态键的变形目标动画超出了本书的范围。Blender 有一些关于形态键的基础文档，“其他资源”（Additional resources）一节中提供了相关链接，而且网上也有大量视频展示了如何在\
  \ Blender 中使用形态键。\n\n如果你有一个包含变形目标动画的模型文件，比如第 10 章 assets 文件夹中的两个模型，或者你在任何其他现有模型中创建了自己的一组变形动画，那么你就可以进入下一步了：使用\
  \ Open Asset Importer 库导入这些额外的动画。\n\n现在，让我们来学习如何将变形目标动画添加到我们的应用程序中。\n\n## 将面部动画添加到代码和\
  \ GPU 着色器中\n\n变形目标动画数据存放在 Assimp 模型文件中的两个位置。\n\n变形动画数据的第一部分是网格，位于 aiMesh 节点的 mAnimMeshes\
  \ 数组中，网格数量存储在 aiMesh 的 mNumAnimMeshes 变量中。mAnimMeshes 数组中的每个元素与原始网格包含完全相同数量的顶点，这使我们可以在网格的不同版本之间对顶点位置进行插值。\n\
  \n这种插值不仅限于在原始网格与一个变形目标网格之间进行混合，也可以在两个变形目标网格之间进行混合，或者混合两个以上网格的位置。请注意，混合网格的结果可能并不总是符合预期，因为变形目标动画的效果在很大程度上取决于动画师的意图。\n\
  \n变形动画数据的第二部分是关键帧数据，存放在 aiAnimation 节点的 mMorphMeshChannels 数组中，关键帧的数量存储在一个名为 mNumMorphMeshChannels\
  \ 的变量中。每个关键帧中的键包含该键对应的时间点、要使用的变形网格编号，以及该变形网格在线性插值中的权重。\n\n我们只使用网格数据在不同面部表情之间进行插值，因此会忽略变形网格的动画数据。但在本章代码的基础上，很容易添加对变形目标动画的支持。\n\
  \n作为实现变形动画的第一步，我们将学习如何加载额外的网格数据并提取顶点。\n\n## 加载变形网格\n\n由于变形网格中的每个顶点会替换原始网格中同一顶点的位置和法线，因此替换顶点只需要顶点数据的一个子集。我们将在\
  \ opengl 文件夹的 OGLRenderData.h 文件中创建一个轻量级的顶点版本，命名为 OGLMorphVertex，其中只包含位置和法线：\n\n\
  ```\nstruct OGLMorphVertex {\n    glm::vec4 position = glm::vec4(0.0f);\n    glm::vec4\
  \ normal = glm::vec4(0.0f);\n};\n```\n\n为了将替换用的变形顶点收集到一个网格中，我们还创建了一个名为 OGLMorphMesh\
  \ 的新结构体，用一个 std::vector 保存所有顶点：\n\n```\nstruct OGLMorphMesh {\n\tstd::vector<OGLMorphVertex>\
  \ morphVertices{};\n};\n```\n\n由于所有变形网格都依赖于原始网格，我们向默认网格结构体 OGLMesh 添加一个 OGLMorphMesh\
  \ 向量：\n\n```\nstruct OGLMesh {\n\t...\n\tstd::vector<OGLMorphMesh> morphMeshes{};\n\
  };\n```\n\n对于 Vulkan，这两个新结构体分别命名为 VkMorphVertex 和 VkMorphMesh，位于 vulkan 文件夹的 VkRenderData.h\
  \ 文件中。VkMorphMesh 向量被添加到 VkMesh 结构体中。在 AssimpMesh 类的 processMesh() 方法结束之前，我们添加一段新代码，从模型文件中提取变形网格数据。首先，我们检查当前网格是否附加了任何变形网格：\n\
  \n```\nint animMeshCount = mesh->mNumAnimMeshes;\nif (animMeshCount > 0) {\n```\n\
  \n如果找到了变形网格，我们就遍历所有变形网格，提取网格数据和顶点数量：\n\n```\nfor (unsigned int i = 0; i < animMeshCount;\
  \ ++i) {\n\taAnimMesh* animMesh = mesh->mAnimMeshes[i];\n\tunsigned int mAnimVertexCount\
  \ = animMesh->mNumVertices;\n}\n```\n\n根据定义，变形网格中的顶点数量必须与原始网格中的顶点数量一致。在这里多做一次额外检查并无坏处：如果检测到顶点数量不匹配，就跳过整个变形网格并打印一条错误信息：\n\
  \n```\nif (animVertexCount != mVertexCount) {\n\tLogger::log(1, \"%s error: morph\
  \ mesh %i vertex count does not match (orig mesh has %i vertices, morph mesh %i)\\\
  n\",\n\t\torig mesh has %i vertices, morph mesh %i)\\n\",\n\t\torig mesh has %i\
  \ vertices, morph mesh %i)\\n\"\n```\n\n## Transformer\n\nTransformer 是 Google 团队在\
  \ 2017 年提出的一种基于自注意力机制（Self-Attention）的深度学习模型架构，其论文《Attention Is All You Need》发表于\
  \ NeurIPS 2017。Transformer 摒弃了传统的循环神经网络（RNN）与卷积神经网络（CNN），完全依赖注意力机制来建模序列中任意两个位置之间的依赖关系，解决了长距离依赖问题，并且高度支持并行计算。\n\
  \nTransformer 整体结构采用 Encoder-Decoder 架构。编码器（Encoder）由若干相同的层堆叠而成，每一层包含多头自注意力子层和前馈神经网络子层；解码器（Decoder）在编码器结构的基础上额外增加了对编码器输出进行交叉注意力的子层。每个子层之后都应用了残差连接（Residual\
  \ Connection）和层归一化（Layer Normalization）。\n\n- 核心优势：并行计算、长距离依赖建模、全局感受野\n- 关键模块：Self-Attention、Multi-Head\
  \ Attention、Positional Encoding\n- 主要应用：机器翻译、文本分类、问答系统、预训练语言模型（如 BERT、GPT）\n\n```python\n\
  # 注意力计算（Scaled Dot-Product Attention）\ndef attention(query, key, value, mask=None):\n\
  \    d_k = query.size(-1)\n    scores = torch.matmul(query, key.transpose(-2, -1))\
  \ / math.sqrt(d_k)\n    if mask is not None:\n        scores = scores.masked_fill(mask\
  \ == 0, -1e9)\n    p_attn = F.softmax(scores, dim=-1)\n    return torch.matmul(p_attn,\
  \ value)\n```\n\n访问任意备选变形网格现在变得很简单：只需检查 morphMeshes 向量的大小是否大于零；如果确实存在变形网格，就提取顶点数据，并在原始顶点与所选变形网格的顶点的位置和法线之间进行插值。\n\
  \n此时，模型文件中找到的所有有效变形网格都已作为 AssimpMesh 网格数据的一部分可供使用。要在面部动画中使用这些变形网格，我们必须向应用程序添加一些代码和逻辑。\n\
  \n## 将所有变形网格存储在单个缓冲区中\n\n为了在着色器中使用变形网格的顶点，我们将所有变形网格的顶点数据存储到单个 SSBO 中。由于模型实例在屏幕上是实例化渲染的，因此必须使用单个\
  \ SSBO——在渲染过程中，我们需要所有网格的顶点数据随时可用，因为我们无法判断某个特定模型实例何时会被绘制到屏幕上。根据所选变形网格来拆分渲染也是可行的，但那是相当昂贵的替代方案，因为我们必须在每次绘制调用中对实例进行过滤。\n\
  \n变形网格 SSBO 以及一些相关变量被添加到 AssimpModel 类中。首先，在 AssimpModel.h 头文件中添加三个新的私有变量：mNumAnimatedMeshes、mAnimatedMeshVertexSize\
  \ 和 mAnimMeshVerticesBuffer：\n\n```\nunsigned int mNumAnimatedMeshes = 0;\nunsigned\
  \ int mAnimatedMeshVertexSize = 0;\nShaderStorageBuffer mAnimMeshVerticesBuffer{};\n\
  ```\n\n在 mNumAnimatedMeshes 中，我们存储该模型的变形网格数量。目前，代码只支持单个包含变形网格的网格，因此 mNumAnimatedMeshes\
  \ 中的数值等于该特定网格中变形网格的数量。\n\n但由于我们只做面部动画，单个含变形网格的网格这一限制不是问题。此外，“实践练习”（Practical sessions）一节中还有一个任务，可以相应扩展代码，以支持多个包含变形网格的网格。\n\
  \nmAnimatedMeshVertexSize 中的值用于在 SSBO 中找到所选变形片段（morph clip）的顶点数据起始位置。将网格顶点大小乘以变形片段的索引，我们就可以直接跳到变形片段的第一个顶点。\n\
  \n最后，所有顶点数据都存储在 mAnimMeshVerticesBuffer SSBO 中。\n\n\n\n\n我们还在AssimpModel.cpp类实现文件中添加了两个公共方法：hasAnimMeshes()和getAnimMeshVertexSize()。由于方法名具有描述性，无需进一步解释。\n\
  \n填充SSBO的工作在AssimpModel类的loadModel()方法中完成。当所有网格（meshes）被收集到mModelMeshes向量后，我们可以遍历所有网格，将顶点数据添加到新缓冲区：\n\
  \n```\nfor (const auto& mesh : mModelMeshes) {\n    if (mesh.morphMeshes.size()\
  \ == 0) {\n        continue;\n    }\n}\n```\n\n作为在mAnimMeshVerticesBuffer SSBO中收集顶点的第一步，我们检查该网格中是否有任何形变网格。如果某个网格没有额外的形变网格，我们直接继续处理下一个网格。\n\
  \n然后，我们创建一个名为animMesh的临时OGLMorphMesh对象，用于收集所有顶点，并调整animMesh中的morphVertices向量大小：\n\
  \n```\nOGLMorphMesh animMesh;\nanimMesh.morphVertices.resize(\n    mesh.vertices.size()\
  \ * mNumAnimatedMeshes);\n```\n\n现在我们可以将所有形变网格的顶点复制到animMesh中，使用顶点数量来计算正确的位置：\n\n\
  ```\nfor (unsigned int i = 0; i < mNumAnimatedMeshes; ++i) {\n    unsigned int vertexOffset\
  \ = mesh.vertices.size() * i;\n    std::copy(mesh.morphMeshes[i].morphVertices.begin(),\n\
  \        mesh.morphMeshes[i].morphVertices.end(),\n        animMesh.morphVertices.begin()\
  \ + vertexOffset);\n    mAnimatedMeshVertexSize = mesh.vertices.size();\n}\n```\n\
  \n最后，我们将收集到的顶点上传到SSBO：\n\n```\nmAnimMeshVerticesBuffer.uploadSsboData(\n    animMesh.morphVertices);\n\
  }\n```\n\n现在，每当我们需要该模型的形变动画时，可以将缓冲区绑定到指定的着色器绑定点。通过新的公共方法bindMorphAnimBuffer()即可实现绑定：\n\
  \n```\nvoid AssimpModel::bindMorphAnimBuffer(int bindingPoint) {\n\tmAnimMeshVerticesBuffer.bind(bindingPoint);\n\
  }\n```\n\n为了在逐实例基础上使用面部动画，我们必须添加一些变量和方法，并扩展某些数据结构。\n\n## 在代码中添加面部形变设置\n\n启用面部动画最重要的改变是新增一个名为faceAnimation的枚举类，它位于Enums.h文件中：\n\
  \n```\nenum class faceAnimation : uint8_t {\n\tnone = 0,\n\tangry,\n\tworried,\n\
  \tsurprised,\n\thappy\n};\n```\n\n所有支持的形变动画都像动作或节点类型一样存储在faceAnimation枚举中。我们不会使用模型文件中的形变动画，而只在代码中使用一组固定的面部动画。\n\
  \n与其他数据类型类似，我们添加了从枚举值到字符串的映射。在代码中使用枚举值，并在UI中显示用户友好的字符串会容易得多。新的映射micFaceAnimationNameMap将被添加到ModelInstanceCamData.h文件中的ModelInstanceCamData结构体中：\n\
  \n```\nstd::unordered_map<faceAnimation, std::string>\nmicFaceAnimationNameMap{};\n\
  \n```\n\n填充该映射的字符串的工作发生在渲染器类文件OGLRenderer.cpp或VkRenderer.cpp的init()方法中，最佳位置是现有映射代码旁边。\n\
  \n## 固定形变映射 vs. 从模型动态加载\n\n在faceAnimation枚举和micFaceAnimationNameMap中硬编码所有形变目标动画剪辑的原因是为了保持代码简单。\n\
  \n虽然从模型文件填充形变目标剪辑列表很容易，但在UI中维护动态列表会变得相当复杂。例如，在节点树中添加选择形变剪辑的代码会在树与单个模型之间建立硬依赖——为其他模型使用同一棵树将变得不可能。\n\
  \n为避免模型与树的依赖，将只使用预定义的形变动画集。任何模型都可以支持全部形变动画、不支持任何形变动画，或支持部分索引匹配的剪辑，并用空的形变动画填充空缺。\n\
  \n对于实例部分，InstanceSettings结构体中添加了两个新变量：isFaceAnimType和isFaceAnimWeight：\n\n```\n\
  faceAnimation isFaceAnimType = faceAnimation::none;\nfloat isFaceAnimWeight = 0.0f;\n\
  ```\n\n在isFaceAnimType中，我们存储当前的面部动画剪辑。由于faceAnimation枚举中额外增加了none值，我们不需要另一个布尔值来开启或关闭面部动画。默认面部网格与面部动画之间的插值权重可由isFaceAnimWeight控制，0.0f只显示默认网格，1.0f显示形变网格。\n\
  \n## is代表“InstanceSettings”，而非“it is”\n\n再次提起这个旁注以避免混淆：InstanceSettings变量名中的is只是结构体名称的缩写，而不是用来定义状态。因此，isFaceAnimType代表“Instance\
  \ Settings Face Animation Type”，而不是控制面部动画是否启用的布尔值。\n\n我们还需要为每个实例提供关于面部动画的信息。下一步，让我们扩展渲染器。\n\
  \n## 在渲染器中填充逐实例缓冲区数据\n\n与所有其他着色器相关数据一样，我们需要一个SSBO将数据传递给GPU。要填充SSBO，需要某种数据类型的std::vector。因此，渲染器类头文件OGLRenderer.h将获得两个新的私有变量：mFaceAnimPerInstanceData和mFaceAnimPerInstanceDataBuffer：\n\
  \n```\nstd::vector<glm::vec4> mFaceAnimPerInstanceData{};\nShaderStorageBuffer mFaceAnimPerInstanceDataBuffer{};\n\
  ```\n\n对于Vulkan渲染器，缓冲区的数据类型有所不同。我们需要向VkRenderer.h文件中添加以下行：\n\n```\nstd::vector<glm::vec4>\
  \ mFaceAnimPerInstanceData{};\nVkShaderStorageBufferData mFaceAnimPerInstanceDataBuffer{};\n\
  ```\n\n虽然我们只需要三个值，但这里将使用glm::vec4来处理可能的数据对齐问题。你应该尽量避免使用三元素向量（glm::vec3）通过SSBO将数据传输到GPU，因为CPU侧的向量或结构体与GPU侧的缓冲区之间可能会出现不匹配。\n\
  \n逐实例面部动画SSBO将被添加到渲染器类文件OGLRenderer.cpp或VkRenderer.cpp的draw()调用中，更具体地说，是在模型实例的循环中：\n\
  \n```\nfor (const auto& model : mModelInstCamData.micModelList) {\n    ...\n   \
  \ mFaceAnimPerInstanceData.resize(numberOfInstances);\n    ...\n    for (size_t\
  \ i = 0; i < numberOfInstances; ++i) {\n```\n\n我们还在循环之前添加了对包含形变数据的向量的大小调整；参见前一个代码片段中突出显示的部分。\n\
  \n而且由于我们已经在循环中提取了当前实例的InstanceSettings结构体，只需几行代码即可添加面部动画。\n\n首先，我们添加一个名为morphData的空glm::vec4，并检查该实例是否设置了面部动画：\n\
  \n```\nglm::vec4 morphData = glm::vec4(0.0f);\nif (instSettings.isFaceAnimType !=\n\
  \    faceAnimation::none) {\n```\n\n如果需要对实例的面部进行动画处理，我们填充morphData的三个元素：\n\n```\n\
  morphData.x = instSettings.isFaceAnimWeight;\nmorphData.y = static_cast<int>(instSettings.isFaceAnimType)\
  \ - 1;\nmorphData.z = model->getAnimMeshVertexSize();\n```\n\n现在我们设置面部动画的权重、剪辑号减一（以考虑faceAnimation枚举中的none元素），以及在两个形变网格之间跳过的顶点数。\n\
  \n当前着色器代码使用顶点数和剪辑号来计算所需形变动画的第一个顶点，但这里也可以使用一个绝对值。如果我们计划扩展代码以支持多个具有形变目标动画的网格，绝对值会变得很方便（参见实践环节部分）。\n\
  \n最后，我们将morphData存储到用于填充SSBO的向量中：\n\n```\n}\nmFaceAnimPerInstanceData.at(i) = morphData;\n\
  ```\n\n作为面部动画的最后一步，必须让顶点着色器感知新的缓冲区。\n\n## 扩展着色器以绘制面部动画\n\n由于形变目标动画只改变顶点数据，我们需要在顶点着色器中添加新的SSBO和一些逻辑。无需改动计算着色器或片段着色器，这一事实大大简化了面部动画的实现。\n\
  \n为防止没有面部动画的模型出现失真，我们将使用一组单独的着色器来绘制包含形变动画的网格。首先，我们向渲染器头文件OGLRenderer.h中添加两个新的私有着色器变量：\n\
  \n```\nShader mAssimpSkinningMorphShader{};\nShader mAssimpSkinningMorphSelectionShader{};\n\
  ```\n\n对于Vulkan渲染器，这里需要更多工作，因为着色器是管线的一部分。我们需要在VkRenderData.h文件中添加两个VkPipelineLayout句柄、两个VkPipeline句柄、两个VkDescriptorSetLayout句柄和两个VkDescriptorSet句柄：\n\
  \n```\nVkPipelineLayout rdAssimpSkinningMorphPipelineLayout;\nVkPipelineLayout rdAssimpSkinningMorphSelectionPipelineLayout;\n\
  ```\n\nVkPipeline rdAssimpSkinningMorphPipeline;\nVkPipeline rdAssimpSkinningMorphSelectionPipeline;\n\
  VkDescriptorSetLayout\nrdAssimpSkinningMorphSelectionDescriptorLayout;\nVkDescriptorSetLayout\n\
  rdAssimpSkinningMorphPerModelDescriptorLayout;\nVkDescriptorSet rdAssimpSkinningMorphDescriptorSet;\n\
  VkDescriptorSet rdAssimpSkinningMorphSelectionDescriptorSet;\n\n借助这些句柄，创建了两个新的 Vulkan\
  \ 管线，用于绘制启用和未启用特殊选择处理的模型。更多 Vulkan 实现细节，请参阅 `VkRenderer.cpp` 文件。\n\n我们需要调整选择顶点着色器，以便在选择缓冲区中绘制经过变形处理的面部网格。如果没有该选择着色器，实例的头部将无法再通过鼠标点击选中。\n\
  \n- `assimpskinning.vert` 改为 `assimpskinning_morph.vert`\n- `assimpskinning.frag`\
  \ 改为 `assimpskinning_morph.frag`\n- `assimpskinning_selection.vert` 改为 `assimpskinning_morph_selection.vert`\n\
  - `assimpskinning_selection.frag` 改为 `assimpskinning_morph_selection.frag`\n\n扩展名为\
  \ `.frag` 的片段着色器不会更改，但为了后续的修改或调试，最好还是为新着色器使用单独的文件。\n\n在以 `.vert` 结尾的两个顶点着色器文件中，添加以下代码行来定义新的\
  \ `MorphVertex` 结构体，该结构体与 `opengl1` 文件夹中 `OGLRenderData.h` 文件里定义的 `OGLMorphVertex`\
  \ 结构体匹配：\n\n```\nstruct MorphVertex {\n\tvec4 position;\n\tvec4 normal;\n};\n```\n\
  \n对于 Vulkan，原始结构体的名称是 `VkMorphVertex`，定义在 `vulkan` 文件夹的 `VkRenderData.h` 中。\n\n\
  然后，在绑定点 4 和 5 上添加两个新的 SSBO，命名为 `AnimMorphBuffer` 和 `AnimMorphData`：\n\n```\nlayout\
  \ (std430, binding = 4) readonly restrict\n    buffer AnimMorphBuffer {\n    MorphVertex\
  \ morphVertices[];\n};\nlayout (std430, binding = 5) readonly restrict\n    buffer\
  \ AnimMorphData {\n    vec4 vertsPerMorphAnim[];\n};\n```\n\n第一个缓冲区 `AnimMorphBuffer`\
  \ 包含所有可用变形动画的顶点。第二个缓冲区 `AnimMorphData` 则将从 CPU 取得的所有实例设置传递给 GPU。\n\n在顶点着色器的 `main()`\
  \ 方法中，我们通过将顶点数量与每个实例的面部动画剪辑索引相乘，来计算所需面部动画的顶点偏移量：\n\n```\nint morphAnimIndex =\n\
  \    int(vertsPerMorphAnim[gl_InstanceID].y *\n        vertsPerMorphAnim[gl_InstanceID].z);\n\
  ```\n\n在这里将浮点值转换为整数没有问题，这样可以避免使用一个同时包含整数和浮点值的单独结构体，并将 `glm::vec4` 用作“传输对象”。浮点数表示的第一个不精确整数是\
  \ `2^24+1`，这个值即使对于包含大量面部动画的较大网格来说也足够大（`2^24+1` 大约相当于 16 MiB 的顶点数据）。\n\n然后，我们使用着色器内置变量\
  \ `gl_VertexID`（Vulkan 中为 `gl_VertexIndex`）从变形网格中提取顶点：\n\n```\nvec4 origVertex =\
  \ vec4(aPos.x, aPos.y, aPos.z, 1.0);\nvec4 morphVertex = vec4(morphVertices[gl_VertexID\
  \ +\n    morphAnimOffset].position.xyz, 1.0)\n```\n\n现在，我们可以根据权重因子，混合原始顶点与来自变形网格的替换顶点的位置：\n\
  \n```\ngl_Position = projection * view * worldPosSkinMat *\n    mix(origVertex,\
  \ morphVertex,\n    vertsPerMorphAnim[gl_InstanceID].x);\n```\n\n我们还需要对顶点法线执行相同的提取和计算，因为顶点位置的改变也可能影响该顶点所属三角形的法线：\n\
  \n```\nvec4 origNormal =\n    vec4(aNormal.x, aNormal.y, aNormal.z, 1.0);\nvec4\
  \ morphNormal =\n    vec4(morphVertices[gl_VertexID +\n    morphAnimOffset].normal.xyz,\
  \ 1.0);\nnormal = transpose(inverse(worldPosSkinMat)) *\n    mix(origNormal, morphNormal,\n\
  \    vertsPerMorphAnim[gl_InstanceID].x);\n```\n\n为了更好地区分带有和不带变形动画的网格，我们还需要在 `AssimpModel`\
  \ 类和渲染器中进行一些小改动。\n\n## 完成面部动画代码\n\n在 `AssimpModel` 类中，新增了两个绘制方法：\n\n```\nvoid drawInstancedNoMorphAnims(int\
  \ instanceCount);\nvoid drawInstancedMorphAnims(int instanceCount);\n```\n\n从名称可以看出这些方法的功能：`drawInstancedNoMorphAnims()`\
  \ 绘制所有没有变形动画的网格，而 `drawInstancedMorphAnims()` 只绘制带有变形动画的网格。\n\n要在两个方法中过滤网格，可以使用一个非常简单的检查——我们循环遍历所有网格，并查看网格内部\
  \ `morphMeshes` 向量的大小。对于只绘制非变形网格的 `drawInstancedNoMorphAnims()` 方法，我们只需跳过带有额外变形网格的网格：\n\
  \n```\nfor (unsigned int i = 0; i < mModelMeshes.size(); ++i) {\n    if (mModelMeshes.at(i).morphMeshes.size()\
  \ > 0) {\n        continue;\n    }\n    OGLMesh& mesh = mModelMeshes.at(i);\n  \
  \  drawInstanced(mesh, i, instanceCount);\n}\n```\n\n而对于只绘制变形网格的版本，我们反转这个检查：\n\n\
  ```\n...\nif (mModelMeshes.at(i).morphMeshes.size() == 0) {\n    continue;\n   \
  \ ...\n}\n```\n\n使用两个独立方法的原因在于渲染器类文件 `OGLRenderer.cpp` 或 `VkRenderer.cpp` 中的 `draw()`\
  \ 方法。在那里，我们将动画模型的常规实例化绘制调用替换为无变形版本：\n\n```\nmodel->drawInstancedNoMorphAnims(numberOfInstances);\n\
  ```\n\n在检查模型是否包含任何变形网格之后，再绘制带有变形动画的网格，如下面的 OpenGL 渲染器代码所示：\n\n```\nif (model->hasAnimMeshes())\
  \ {\n    mAssimpSkinningMorphShader.use();\n    ...\n    model->bindMorphAnimBuffer(4);\n\
  \    mFaceAnimPerInstanceDataBuffer.uploadSsboData(\n        mFaceAnimPerInstanceData,\
  \ 5);\n    model->drawInstancedMorphAnims(numberOfInstances);\n}\n```\n\n在这种情况下，我们使用新的变形着色器，绑定包含顶点数据和逐实例设置的两个\
  \ SSBO，并使用只绘制带有变形动画网格的绘制调用。\n\n若要做一个简单测试，你可以将渲染器中的 `morphData` 值设置为某些固定值，然后检查实例是生气地跑动还是面带微笑。但要完全控制这些新设置，我们还需要在\
  \ UI 中添加一个组合框和一个滑块。\n\n## 添加 UI 元素以控制面部动画\n\n对于 UI，代码量很小。我们只需要一个组合框，将 `InstanceSettings`\
  \ 的 `isFaceAnimType` 值映射到 `micFaceAnimationNameMap` 中的字符串，以及一个与 `isFaceAnimWeight`\
  \ 关联的浮点滑块。对于没有面部动画的模型，我们只需禁用组合框和滑块。\n\n图 10.3 显示了展开后的组合框，其中有四种面部动画，以及用于禁用面部动画的 `None`\
  \ 设置：\n\n![](img/3cfb9832c943f5f7366fd104b5255971_345_0.png)\n\n图 10.3：用于控制实例面部动画的\
  \ UI 设置\n\n现在我们可以选择面部动画剪辑，并使用权重滑块来控制面部动画变形被应用的程度。\n\n作为面部动画实现的最后一步，我们将介绍如何将新设置添加到\
  \ YAML 配置文件中。\n\n## 保存和加载新的实例设置\n\n幸运的是，当前 YAML 解析器和写出器代码的状态使得我们只需极少的努力就能添加面部动画。由于面部动画设置是按实例设置的，我们需要扩展\
  \ `tools` 文件夹中 `YamlParser.cpp` 文件内 `InstanceSettings` 的 YAML 写出器输出运算符。\n\n在可选的节点树设置输出之后，我们检查是否配置了面部动画；如果设置了剪辑，则输出实例设置：\n\
  \n```\nif (settings.isFaceAnimType != faceAnimation::none) {\n    out << YAML::Key\
  \ << \"face-anim-index\";\n    out << YAML::Value << settings.isFaceAnimType;\n\
  \    out << YAML::Key << \"face-anim-weight\";\n    out << YAML::Value << settings.isFaceAnimWeight;\n\
  }\n```\n\n为了输出 `faceAnimation` 枚举，我们还需要为新的数据类型定义输出运算符：\n\n```\nYAML::Emitter& operator<<(YAML::Emitter&\
  \ out,\n    const faceAnimation& faceAnim) {\n    out << YAML::Flow;\n    out <<\
  \ static_cast<int>(faceAnim);\n    return out;\n}\n```\n\n在 `YamlParserTypes.h`\
  \ 文件中，我们还需要为新的 `faceAnimation` 数据类型定义简单的 `decode()` 方法：\n\n```\ntemplate<>\nstruct\
  \ convert<faceAnimation> {\n    static bool decode(const Node& node, faceAnimation&\
  \ rhs) {\n        rhs = static_cast<faceAnimation>(node.as<int>());\n        return\
  \ true;\n    }\n};\n```\n\n此处未展示 `encode()` 方法，它本质上与其他所有枚举 `encode()` 方法所做的工作相同：将节点数据转换为\
  \ `int`。\n\n最后，我们只需扩展 `ExtendedInstanceSettings` 的 `decode()` 方法，添加两个新值：\n\n```\n\
  if (node[\"face-anim\"]) {\n    rhs.isFaceAnimType =\n        node[\"face-anim\"\
  ].as<faceAnimation>();\n    rhs.isFaceAnimWeight =\n        node[\"face-anim-weight\"\
  ].as<float>();\n}\n```\n\n`encode()` 方法的扩展也非常简单：\n\n```\nif (rhs.isFaceAnimType\
  \ != faceAnimation::none) {\n    node[\"face-anim\"] = rhs.isFaceAnimType;\n   \
  \ node[\"face-anim-weight\"] = rhs.isFaceAnimWeight;\n}\n```\n\n\n\n\n确保提升配置文件的版本号，因为我们在其中添加了新数据。在这种情况下，更改文件版本并不是那么关键，因为之前章节中的解析器版本根本不知道这些新设置。\n\
  \n就是这样！现在当你选择一个实例时，你可以更改面部表情的类型和强度，如图10.4所示：\n\n![](img/3cfb9832c943f5f7366fd104b5255971_347_0.png)\n\
  \n图10.4：默认面部网格旁边的一个“担心”的实例\n\n每个实例都可以独立控制面部动画，并且对一个实例的更改不会影响其他实例。对实例显示愤怒、担心、快乐甚至惊讶的表情，以及显示程度，都由你来决定。\n\
  \n向应用程序添加更多变形片段也很容易。对于新片段来说，最复杂的部分很可能是在Blender等工具中进行的顶点动画。在代码中，只需向faceAnimation枚举类添加一个新值，并向ModelInstanceCamData结构的micFaceAnimationNameMap变量中的名称映射添加一个新字符串。\n\
  \n为了也能在节点树中使用新的面部动画，我们需要创建一个新的节点类型，以便控制动画片段和所需变形目标动画的权重。因此，让我们添加全新的FaceAnim节点。\n\
  \n## 在节点树中使用面部动画\n\n创建新节点类型很容易。首先，我们添加一个新类FaceAnimNode，包含头文件FaceAnimNode.h和实现文件FaceAnimNode.cpp，两者都放在graphnodes文件夹中。我们可以从WaitNode借用大部分实现，并添加ImGui元素和一些逻辑，以在执行期间控制面部动画。图10.5展示了FaceAnim节点的最终布局：\n\
  \n![](img/3cfb9832c943f5f7366fd104b5255971_348_0.png)\n\n图10.5：新的FaceAnim节点\n\n\
  该节点允许我们选择其中一个面部动画片段，包括用于禁用实例面部动画的None设置，在两个播放方向上的动画起始和结束权重，以及控制动画重播所需时间的计时器。\n\n\
  在添加新的FaceAnim节点之前，我们必须扩展包含节点类型和图节点工厂类的枚举。\n\n### 为新FaceAnim节点调整代码\n\n与WaitNode类似，FaceAnim节点会延迟控制流，直到计时器归零，并在动画重播结束后通知父节点。\n\
  \n除了添加这两个新文件外，创建新节点类型还需要两个额外步骤。\n\n首先，我们必须扩展Enums.h文件中的graphNodeType枚举：\n\n```\n\
  enum class graphNodeType : int8_t {\n  ...\n  faceAnim,\n  NUM\n};\n```\n\n接下来，必须让GraphNodeFactory类的构造函数和makeNode()方法了解这个新节点。在构造函数中，我们将节点标题字符串添加到mGraphNodeTypeMap中：\n\
  \n```\nmGraphNodeTypeMap[graphNodeType::faceAnim] = \"FaceAnim\";\n```\n\n在makeNode()中，我们为新节点类型添加一个case块：\n\
  \n```\ncase graphNodeType::faceAnim:\n    newNode = std::make_shared<FaceAnimNode>(nodeId);\n\
  \    break;\n```\n\n现在我们可以调整新FaceAnimNode类的实现了。\n\n### 添加FaceAnim节点\n\n由于我们将在两个权重值之间手动混合，因此一旦节点激活，我们将在update()方法中将混合时间映射到0到1之间：\n\
  \n```\nfloat morphTimeDiff = 1.0f;\nif (mFaceAnimBlendTime != 0.0f) {\n    morphTimeDiff\
  \ = std::clamp(mCurrentTime /\n        mFaceAnimBlendTime, 0.0f, 1.0f);\n}\n```\n\
  \n通过一个简单的除法，并加上避免除以零的检查，morphTimeDiff中的时间差将从1变为0。\n\n然后我们使用时间差和权重差的乘积来插值最终权重：\n\n\
  ```\nfloat morphWeightDiff =\n    mFaceAnimEndWeight - mFaceAnimStartWeight;\nfloat\
  \ currentWeight =\n    mFaceAnimEndWeight - morphWeightDiff * morphTimeDiff;\n```\n\
  \n每次运行update()方法时，我们都会通过fireNodeActionCallback将新权重持续发送给渲染器：\n\n```\ninstanceUpdateType\
  \ updateType =\n    instanceUpdateType::faceAnimWeight;\nnodeCallbackVariant result;\n\
  bool extra = false;\nresult = currentWeight;\nfireNodeActionCallback(getNodeType(),\
  \ updateType,\n    result, extra);\n```\n\n在进行权重更新之前，我们在activate()方法中发送所需的动画片段索引：\n\
  \n```\ninstanceUpdateType updateType =\n    instanceUpdateType::faceAnimIndex;\n\
  nodeCallbackVariant result;\nbool extra = false;\nresult = mFaceAnim;\nfireNodeActionCallback(getNodeType(),\
  \ updateType,\n    result, extra);\n```\n\n为了向渲染器传递面部动画值，instanceUpdateType枚举需要扩展两个新值：faceAnimIndex和faceAnimWeight：\n\
  \n```\nenum class instanceUpdateType : uint8_t {\n    ...\n    faceAnimIndex,\n\
  \    faceAnimWeight\n};\n```\n\n我们还需要在nodeCallbackVariant变体中使用faceAnimation类型，以便在类之间的回调中使用新数据类型：\n\
  \n```\nusing nodeCallbackVariant = std::variant<float, moveState, moveDirection,\
  \ faceAnimation>;\n```\n\n由于我们在节点中使用了fireNodeActionCallback，因此GraphEditor和SingleInstanceBehavior类都需要扩展。\n\
  \n在graphnodes文件夹的GraphEditor.cpp文件中，必须将faceAnim节点类型添加到createNodeEditorWindow()方法中，以便将节点动作回调绑定到新创建的faceAnim节点上：\n\
  \n```\nif (nodeType == graphNodeType::instance ||\n    nodeType == graphNodeType::action\
  \ ||\n    nodeType == graphNodeType::faceAnim) {\n    newNode->setNodeActionCallback(\n\
  \        behavior->bdNodeActionCallbackFunction);\n}\n```\n\n在SingleInstanceBehavior拷贝构造函数中存在类似的检查；我们还必须在此处添加FaceAnim节点类型来绑定节点动作回调：\n\
  \n```\nif (node->getNodeType() == graphNodeType::instance ||\n    node->getNodeType()\
  \ == graphNodeType::action ||\n    node->getNodeType() == graphNodeType::faceAnim)\
  \ {\n    newNode->setNodeActionCallback(\n        mBehaviorData->bdNodeActionCallbackFunction);\n\
  }\n```\n\n除了在更改面部动画设置时操作InstanceSettings变量外，我们还在AssimpInstance类中添加两个新的setter，以简化对新InstanceSettings变量的访问。\n\
  \n### 使实例和渲染器能够响应面部动画变化\n\n如果需要调整多个值，先读取所有数据再在最后写回所有数据来更新InstanceSettings是很好的做法。对于单一更改，使用单独的setter更方便。我们向AssimpInstance类添加两个新的公共方法setFaceAnim()和setFaceAnimWeight()：\n\
  \n```\nvoid setFaceAnim(faceAnimation faceAnim);\nvoid setFaceAnimWeight(float weight);\n\
  ```\n\n这两个方法都会更新实例的InstanceSettings数据中的两个值，并添加一些额外逻辑来处理faceAnimation枚举的none值。\n\n\
  作为新节点的最后一步，渲染器类（OGLRenderer.cpp或VkRenderer.cpp）的updateInstanceSettings()方法需要知道当实例想要更改面部动画设置时该怎么做。\n\
  \n为此，在节点类型的switch块中，必须添加一个针对新的faceAnim节点类型的新case块：\n\n```\nswitch (nodeType) {\n\
  \    ...\n    case graphNodeType::faceAnim:\n```\n\n对节点树的更多扩展也是可能的。你可以让模型在击打或踢腿前变得愤怒，或者在播放拾取动画前表现出惊讶，以模拟实例在地面上看到了什么东西。而且，有了更多的骨骼和面部动画片段，还可以创造出更多有趣和疯狂的组合。\n\
  \n作为人类，能够从别人的脸上看到他们的情绪有助于我们评估可能的下一步行动，而将面部表情引入应用程序则提供了与实例交互的更广泛方式。通过使用变形目标动画，即使是基础的低多边形模型也会呈现出更多的个性。\n\
  \n但变形目标动画有三个严重的局限性，我们接下来将讨论这些局限性。\n\n## 变形目标动画的局限性\n\n使用变形目标动画时，我们需要注意以下三个限制：\n\n\
  - 网格中的顶点数量在所有动画和帧中必须相同。不可能在帧内或动画期间添加或移除顶点，也不能更改顶点与三角形的分配。你只能移动顶点。\n- 模型的变形部分的整个网格必须为动画中的每个变形键复制。对于模型身体的较小部分来说，这可能没问题，但在内存中多次保留高细节的身体部分可能会产生明显的开销。\n\
  - 仅支持顶点位置更改；变形通常通过简单的线性插值完成。小角度旋转可以通过位置变化来模拟，但通过大角度旋转或缩放来移动顶点（例如转动头部或移动手部）将在插值期间导致视觉扭曲。\n\
  \n你可以在Blender中自行测试第三个限制。为此，添加一个基于变形目标的头部旋转，你会看到旋转也会影响头部的体积。旋转角度越大，动画过程中的扭曲就越大。\n\
  \n\n\n\nFigure 10.7 shows the result of around 50% of a head rotation by 180 degrees:\n\
  \n![](img/3cfb9832c943f5f7366fd104b5255971_354_0.png)\n\nFigure 10.7: Distorted\
  \ volume while rotating the head with a morph target animation\n\nMorph target animations\
  \ must be created and tested carefully while animating a model. They are a valuable\
  \ addition to animations, but they still have some drawbacks.\n\nHow do we create\
  \ advanced animations that may need rotations without using morph target animations,\
  \ such as a fancy head movement animation to let the model look around in the virtual\
  \ world?\n\nThat’s what we’ll learn next as we dive into additive blending.\n\n\
  ## Implementing additive blending\n\nAdditive blending is an alternative method\
  \ of animation blending. While normal animation blending is used to interpolate\
  \ between two skeletal animation clips and morph target animations are changing\
  \ vertex positions of a mesh, additive blending stacks two different skeletal animations\
  \ on top of each other.\n\nThe technical part of additive blending is astonishingly\
  \ simple, but the effect achieved by the combination of two different skeletal animations\
  \ leads to a much more natural appearance of a 3D model.\n\nLet’s explore the similarities\
  \ and differences between additive blending and the animation blending methods we\
  \ already know.\n\n### How additive blending works\n\nThe basic idea of additive\
  \ blending comes from the desire to split up model animations into multiple and\
  \ especially independent parts.\n\nA skeletal animation usually delivers an animation\
  \ for the entire model, allowing the model to either run, walk, punch, or jump.\
  \ Blending between skeletal animations will smooth the transition between these\
  \ two clips but won’t add new movements. So, there are two different approaches:\
  \ splitting the skeleton or stacking animations.\n\nSplitting the skeleton into\
  \ two or even more animation domains and playing a different clip for each part\
  \ of the skeleton is called layered blending. Layered blending is a simple and cost-effective\
  \ way to mix animations since every node of the skeleton is affected only by the\
  \ transforms of a single animation clip, just the animation clips are different\
  \ for the nodes.\n\nBut splitting the model skeleton into multiple parts with each\
  \ part playing a different skeletal animation may lead to extra effort to synchronize\
  \ clips across the body. Failures in a synchronous replay on a split-skeleton animation\
  \ may lead to visual artifacts, just think of different replay speeds for the clips.\n\
  \nWe don’t handle layered blending in the book, but a task in the Practical sessions\
  \ section is available to implement layered animation blending for the models. In\
  \ contrast, additive blending allows adding up skeletal animations on top of other\
  \ skeletal animations. While the basic movement created by the basic skeletal animation\
  \ is applied normally, property changes of one or even more other skeletal animations\
  \ are added to the nodes of the model, creating a concatenated motion with what’s\
  \ provided by the basic animation. Additive blending is more expensive to calculate\
  \ than layered blending because we need to calculate multiple animations, and we\
  \ also have to mix all the animations together. As an example, this simple addition\
  \ of property changes allows us to add a head movement to the normal skeletal animations.\
  \ The model will be able to run, walk, punch, or jump from a skeletal animation\
  \ and move the head around at the same time. As a bonus, facial animations are not\
  \ affected by additive blending, so a model can walk, look to the right, and smile,\
  \ and all three animations are running in parallel.\n\nFor the technical implementation\
  \ part, an additive animation is done by adding the differences in the node transformations\
  \ between the current pose and a reference pose to another skeletal animation.\n\
  \nLet’s use another example to explain the technical side. Figure 10.8 shows the\
  \ first and the last keyframe for an animation that only rotates the head node of\
  \ the model to the right (from the model’s perspective), while all other nodes remain\
  \ in the T-pose:\n\n![](img/3cfb9832c943f5f7366fd104b5255971_356_0.png)\n\nFigure\
  \ 10.8: Start and end pose for the additive animation \"head look right\"\n\nAs\
  \ the reference pose, we use the first keyframe, with the entire model in the T-pose.\
  \ To calculate the values for an additive animation, we take the desired keyframe\
  \ and simply subtract the translation, rotation, and scale values of the reference\
  \ pose from the destination pose.\n\nIf the model remains in the T-pose, all values\
  \ for the additive animation will be zero. And nothing is added to the running skeletal\
  \ animation, for instance, the walking cycle.\n\nWhen we advance further in the\
  \ animation clip in Figure 10.8, the rotation of the head will lead to a bigger\
  \ difference in the rotation value of the head node between the current pose and\
  \ the reference pose. But we will get only a difference for the head node, all other\
  \ node transformations are still identical to the reference pose.\n\nAdding the\
  \ difference of the head node rotation to the currently running skeletal animation\
  \ clip is easy. Since we collect the transformation properties for all nodes, a\
  \ combination of two skeletal animations is just a simple per-node addition of the\
  \ values for translation and scale, and a quaternion multiplication for the rotation\
  \ value.\n\nThis addition only changes the values for nodes that have changed in\
  \ the animation clip of the additive animation compared to the reference pose. All\
  \ nodes without changes in the additive animation will remain unaltered in the skeletal\
  \ animation.\n\n### How to create suitable animations\n\nCreating animations to\
  \ use in additive blending is out of the scope of this book, similar to creating\
  \ face animations. You can use a tool like Blender, or use the man’s model from\
  \ Chapter 10, which already contains four extra animations altering only the head.\n\
  \nIf you create extra animations by yourself, make sure to prefix the clip names\
  \ with something common, like an underscore, or the letters ZZZ_ to keep them grouped\
  \ together. At least Blender tends to sort the clips by name during the export and\
  \ since we store several clip mappings based on the index number of the clip in\
  \ the YAML configuration file, adding the new clips at the start or somewhere in-between\
  \ the existing clips would lead to broken config files.\n\nImplementing additive\
  \ animations in our application is also surprisingly simple.\n\n### Extending the\
  \ code to support additive animations\n\nTo bring the additional data to the GPU,\
  \ we add four new variables to the struct PerInstanceAnimData in the OGLRendererData.h\
  \ file in the opengl folder:\n\n```\nstruct PerInstanceAnimData {\n  ...\n  unsigned\
  \ int headLeftRightAnimClipNum;\n  unsigned int headUpDownAnimClipNum;\n  ...\n\
  \  float headLeftRightReplayTimestamp;\n  float headUpDownReplayTimestamp;\n};\n\
  ```\n\nAs always for Vulkan, the file is called VkRendererData.h and resides in\
  \ the vulkan folder.\n\nWe split the head animation into two parts and use separate\
  \ variables to control both the left/right animation and the up/down animation of\
  \ the head. It’s impossible to move the head to the left and right at the same time,\
  \ so we can combine those two directions into a single control variable. The same\
  \ holds true for moving the head up and down.\n\nThen, we create a new private compute\
  \ shader called mAssimpTransformHeadMoveComputeShader in the renderer class file,\
  \ OGLRenderer.cpp:\n\n```\nShader mAssimpTransformHeadMoveComputeShader{};\n```\n\
  \nFor Vulkan, we add a new VkPipeline handle named rdAssimpComputeHeadMoveTransformPipeline\
  \ to the VkRenderData.h file:\n\n```\nVkPipeline rdAssimpComputeHeadMoveTransformPipeline;\n\
  ```\n\nSince not all models may have additive head animations, we could skip the\
  \ extra calculations if no head animations were set. We also add the new variables\
  \ in the PerInstanceAnimData struct to the compute shader file, assimp_instance_transform.comp.\
  \ The new head animation variables will be ignored, but we need to expand the struct\
  \ to the same size in both shaders.\n\nNext, we copy the assimp_instance_transform.comp\
  \ file to assimp_instance_headmove_transform.comp and load the new file into the\
  \ new mAssimpTransformHeadMoveComputeShader compute shader during the init() method\
  \ of the OGLRenderer.cpp. For Vulkan, we create the new rendering pipeline loading\
  \ the head transform compute shader in the createPipelines() method of VkRenderer.cpp.\n\
  \nIn the new shader file, most of the additions are just copy and paste work. We\
  \ must do the following steps in the extended compute shader, using the code for\
  \ the rotational part of the left/right head movement as examples:\n\n- 1. Extract\
  \ the animation clip numbers for both head animations:\n\n```\nuint headLeftRightClip\
  \ =\n    instAnimData[instance].headLeftRightAnimClipNum;\n```\n\n- 2. Extract the\
  \ inverse scale factors for both head animations:\n\n```\nfloat headLeftRightRotInvScaleFactor\
  \ =\n    lookupData[headLeftRightClip * clipOffset +\n    node * boneOffset + lookupWidth].x;\n\
  ```\n\n- 3. Calculate the index values for accessing the lookup data of the head\
  \ animations:\n\n```\nint headLeftRightRotLookupIndex =\n    clamp(int(instAnimData[instance]\n\
  \    .headLeftRightReplayTimestamp *\n    headLeftRightRotInvScaleFactor) + 1, 0,\n\
  \    lookupWidth - 1);\n```\n\n\n\n\n\n4. 获取第一个查找位置的参考姿势以及所需头部动画剪辑时间戳的平移、旋转和缩放值：\n\
  \n```cpp\nvec4 headLeftRightBaseRotation =\n    lookupData[headLeftRightClip * clipOffset\
  \ + node *\n    boneOffset + lookupWidth + 1];\n...\nvec4 headLeftRightRotation\
  \ =\n    lookupData[headLeftRightClip * clipOffset + node *\n    boneOffset + lookupWidth\
  \ +\n    HeadLeftRightRotLookupIndex];\n```\n\n5. 使用四元数乘法计算当前姿势与参考姿势的变换值之差，用于旋转：\n\
  \n```cpp\nvec4 headLeftRightRotationDiff =\n    qMult(qInverse(headLeftRightBaseRotation),\n\
  \        headLeftRightRotation);\n```\n\n6. 将两个头部动画的平移、旋转和缩放差值累加为每个变换的单一值：\n\n```cpp\n\
  vec4 headRotationDiff =\n    qMult(headUpDownRotationDiff,\n        headLeftRightRotationDiff);\n\
  ```\n\n7. 使用四元数乘法将累加后的差值加到第一和第二剪辑变换上：\n\n```cpp\nvec4 finalRotation =\n    slerp(qMult(headRotationDiff,\
  \ firstRotation),\n    qMult(headRotationDiff, secondRotation), blendFactor);\n\
  ```\n\n实例还需要携带头部运动的信息，因此我们在 InstanceSettings.h 文件中的 InstanceSettings 结构体中添加了两个新变量\
  \ isHeadLeftRightMove 和 isHeadUpDownMove：\n\n```cpp\nfloat isHeadLeftRightMove =\
  \ 0.0f;\nfloat isHeadUpDownMove = 0.0f;\n```\n\n我们将 0.0f 到 1.0f 之间的正范围映射到头部向左和向上的运动，而将\
  \ 0.0f 到 -1.0f 的负范围映射到头部向右或向下移动。运动值为零时，将对两个动画都使用参考姿势的值，从而完全没有头部运动。\n\n在 OGLRenderer\
  \ 或 VKRenderer 类的 draw() 调用中填充 PerInstanceAnimData 结构体中的新数据，与面部动画相同的位置。按照之前解释的映射，选择剪辑编号的方式如下所示：\n\
  \n```cpp\nif (instSettings.isHeadLeftRightMove > 0.0f) {\n    animData.headLeftRightAnimClipNum\
  \ =\n        modSettings.msHeadMoveClipMappings[\n            headMoveDirection::left];\n\
  } else {\n    animData.headLeftRightAnimClipNum =\n        modSettings.msHeadMoveClipMappings[\n\
  \            headMoveDirection::right];\n}\n```\n\n对于头部运动，我们使用时间戳的绝对值：\n\n```cpp\n\
  animData.headLeftRightReplayTimestamp =\n    std::fabs(instSettings.isHeadLeftRightMove)\
  \ *\n    model->getMaxClipDuration();\n```\n\n在代码中硬编码剪辑编号是个坏主意，不同的模型将这些新动画放在不同的剪辑索引上，或者根本没有。让我们再添加一个映射，这次是在叠加混合剪辑编号与头部运动的四种可能方向之间。\n\
  \n## 为新的头部动画创建映射\n\n为了在剪辑和头部动画之间建立映射，在 Enums.h 文件中创建了一个新的 enum class，名为 headMoveDirection：\n\
  \n```cpp\nenum class headMoveDirection : uint8_t {\n    left = 0,\n    right,\n\
  \    up,\n    down,\n    NUM\n};\n```\n\n对应的字符串映射 micHeadMoveAnimationNameMap 用于在\
  \ UI 中显示名称，已添加到 ModelInstanceCamData 结构体中：\n\n```cpp\nstd::unordered_map<headMoveDirection,\
  \ std::string> micHeadMoveAnimationNameMap{};\n```\n\n并且由于该映射与模型相关，新的 msHeadMoveClipMappings\
  \ 映射已添加到 ModelSettings.h 文件中的 ModelSettings 结构体中：\n\n```cpp\nstd::map<headMoveDirection,\
  \ int> msHeadMoveClipMappings{};\n```\n\nAssimpModel 类还获得了一个新的公共方法，用于检查 msHeadMoveClipMappings\
  \ 中的所有映射是否都已激活：\n\n```cpp\nbool hasHeadMovementAnimationsMapped();\n```\n\n如果找不到头部动画中的至少一个，则叠加头部动画将被禁用。在\
  \ OGLRenderer.cpp 文件的 draw() 调用中，我们根据所有头部动画映射的可用性切换计算着色器：\n\n```cpp\nif (model->hasHeadMovementAnimationsMapped())\
  \ {\n\tmAssimpTransformHeadMoveComputeShader.use();\n} else {\n\tmAssimpTransformComputeShader.use();\n\
  }\n```\n\n对于 Vulkan，我们使用头部移动动画的可用性在 VkRenderer.cpp 文件的 runComputeShaders() 方法中选择要为计算着色器绑定的管线：\n\
  \n```cpp\nif (model->hasHeadMovementAnimationsMapped()) {\n\tvkCmdBindPipeline(mRenderData.rdComputeCommandBuffer,\n\
  \tVK_PIPELINE_BIND_POINT_COMPUTE,\n\tmRenderData.rdAssimpComputeHeadMoveTransformPipeline);\n\
  } else {\n\tvkCmdBindPipeline(mRenderData.rdComputeCommandBuffer,\n\tVK_PIPELINE_BIND_POINT_COMPUTE,\n\
  \tmRenderData.rdAssimpComputeTransformPipeline);\n}\n```\n\n头部动画的 UI 部分可以从 UserInterface\
  \ 类中的其他代码部分大部分复制过来。一个用于选择剪辑的组合框、遍历 headMoveDirection 枚举中所有四个值的循环、两个按钮和两个用于测试动画的滑块，就是我们创建新\
  \ UI 部分所需的一切，如图 10.9 所示：\n\n![](img/3cfb9832c943f5f7366fd104b5255971_362_0.png)\n\
  \n图 10.9：头部运动/动画剪辑映射的 UI 控制\n\n剪辑映射和剪辑均取自当前选中实例的模型，使得为所有模型配置叠加头部动画变得容易。\n\n要在节点树中使用头部动画，还需要另一种新的节点类型。\n\
  \n## 添加头部动画节点\n\n得益于之前的 FaceAnimNode 节点，添加一个新的 HeadAnimNode 只需几分钟。你可以按照 Using face\
  \ animations in node trees 部分中的步骤创建新节点，因为你需要执行与 FaceAnimNode 相同的操作。只有一些小的改动，例如枚举类条目的名称。\n\
  \n对于新节点的 UI 部分，你可以重用 FaceAnimNode 类代码中的控件，并从 InstanceNode 类代码中复制用于切换两个部分开/关的代码。\n\
  \n最终要在节点树中使用的 **HeadAnim** 节点如下图所示 *Figure 10.10*：\n\n![](img/3cfb9832c943f5f7366fd104b5255971_363_0.png)\n\
  \n图 10.10：HeadAnim 节点\n\n与 Instance 节点一样，我们可以控制想要更改哪些头部动画值，并且对于每个动画，我们可以调整起始和结束权重以及在两个权重值之间混合所需的时间。与\
  \ FaceAnim 节点类似，HeadAnim 节点会延迟控制流，直到两个计时器都过期，并向父节点发出执行结束的信号。\n\n我们以保存和加载叠加头部动画设置所需的更改来结束本章。\n\
  \n## 保存和加载头部动画设置\n\n与新的树节点类似，实现 YAML 配置文件更改以保存和加载头部动画设置也只需几分钟。\n\n对于 YamlParser.cpp\
  \ 文件中 ModelSettings YAML 发射器输出，我们在所有四个剪辑都配置好的情况下直接从映射中添加剪辑映射。我们还需要一个用于 headMoveDirection\
  \ 枚举的新发射器输出，将值强制转换为 int：\n\n```cpp\nYAML::Emitter& operator<<(YAML::Emitter& out,\n\
  \    const headMoveDirection& moveDir) {\n    out << YAML::Flow;\n    out << static_cast<int>(moveDir);\n\
  \    return out;\n}\n```\n\n为了重新加载映射，我们在 YamlParserTypes.h 文件中 ModelSettings 的 decode()\
  \ 方法中添加了一个部分，逐个读取回映射值。这里也需要一个新的 headMoveDirection 枚举的 decode() 方法：\n\n```cpp\nstatic\
  \ bool decode(const Node& node, headMoveDirection& rhs) {\n    rhs = static_cast<headMoveDirection>(node.as<int>());\n\
  }\n```\n\n对于实例设置，存储在 InstanceSettings 的 isHeadLeftRightMove 和 isHeadUpDownMove 中的两个\
  \ float 值已添加到 YamlParser.cpp 中的发射器中：\n\n```cpp\nif (settings.isHeadLeftRightMove\
  \ != 0.0f) {\n    out << YAML::Key << \"head-anim-left-right-timestamp\";\n    out\
  \ << YAML::Value << settings.isHeadLeftRightMove;\n}\nif (settings.isHeadUpDownMove\
  \ != 0.0f) {\n    out << YAML::Key << \"head-anim-up-down-timestamp\";\n    out\
  \ << YAML::Value << settings.isHeadUpDownMove;\n}\n```\n\n并且这两个值也已添加到 YamlParserTypes.h\
  \ 中 ExtendedInstanceSettings 数据类型的 decode() 方法中：\n\n```cpp\nif (node[\"head-anim-left-right-timestamp\"\
  ]) {\n    rhs.isHeadLeftRightMove =\n        node[\"head-anim-left-right-timestamp\"\
  ].as<float>();\n}\nif (node[\"head-anim-up-down-timestamp\"]) {\n    rhs.isHeadUpDownMove\
  \ =\n        node[\"head-anim-up-down-timestamp\"].as<float>();\n}\n```\n\n完成所有这些添加后，你可以将一些\
  \ HeadAnim 节点添加到男人的模型的节点树中，创建如图 10.11 所示的动画：\n\n\n\n\n\n## 实践环节\n\n以下是你可以添加到代码中的一些内容：\n\
  \n- 为包含形变目标动画的多个网格添加支持。目前，一个模型的只能有一个网格具有形变目标动画。对于简单的头部动画来说，这个限制是可以接受的。但如果你想控制面部的多个部位，使用多个形变目标可能会有所帮助。\n\
  - 在两个形变目标之间添加混合。为了获得更自然、更好的面部表情，直接在两个形变目标之间进行混合会很不错。这样就不再需要通过中性位置的迂回，而是可以直接在愤怒和担忧之间进行过渡。\n\
  - 添加更多形变目标。\n- 你可以尝试让模型说话。你可以为不同的元音和辅音添加表情，包括上一项任务中的直接混合。有了这样的动画，你就可以模仿实例在交互过程中对你说话。\n\
  - 添加分层/遮罩动画。与叠加动画混合不同，分层混合使用不同的骨骼动画片段来控制模型虚拟身体的不同部位。例如，除了右臂之外都使用奔跑动画，而只有右臂播放挥手动画。如“叠加混合的工作原理”一节所述，分层动画可能需要额外的努力来同步两个动画片段。你需要添加一些逻辑来遮罩模型的骨骼部分。\n\
  - 让实例在交互时朝你转头。这是许多游戏的功能：如果你开始与一个实例交互，他们会转头直接看向你。\n- 让附近的实例来评判你。这与上一项任务类似：你也可以将叠加的转头动画添加到附近行走的实例中。还添加一个随机的面部表情，使实例在经过你身边时表现出某种情绪。\n\
  - 让实例对经过的最近实例微笑并挥手。这是前两项任务的组合和扩展：使用交互逻辑为虚拟世界中的每个实例找到最近的实例，然后将头部转向该实例。播放微笑的形变动画和一个仅右臂挥手的新叠加动画。这里你可能想为手臂使用分层动画。\n"
- "## 第 4 部分：增强你的虚拟世界\n\n在本书的最后一部分，你将为虚拟世界的居民提供一个居住地。你将探索实例数据和关卡数据之间的差异，并实现一个关卡数据加载器，该数据可以从互联网上获取或由你自己创建。你还将学习实例与关卡几何体之间碰撞检测的处理方式，使实例不仅能够避开墙壁，还能够在加载的关卡地面上行走。然后，你将被介绍到关卡内的寻路和导航，使实例能够在游戏地图中的路径点之间漫游。最后，你将获得一系列想法和资源，将动画编辑器升级为小型游戏引擎。\n\
  \n本部分包含以下章节：\n\n- 第 11 章，加载游戏地图\n- 第 12 章，高级碰撞检测\n- 第 13 章，添加简单导航\n- 第 14 章，创建沉浸式交互世界\n\
  \n### 11：加载游戏地图\n\n欢迎来到第 11 章！在上一章中，我们为实例添加了面部表情。在简要介绍形变目标动画后，我们扩展了应用程序以加载形变网格并添加了\
  \ UI 元素来控制实例的面部动画。此外，还添加了一种新的图节点类型，以便在节点树中使用面部动画。最后，我们实现了叠加混合，使实例的头部能够独立于任何骨骼和面部动画移动。\n\
  \n在本章中，我们将暂时从角色控制中脱离出来，并为虚拟世界添加游戏关卡和关卡资源。我们将首先探讨为什么关卡数据应与模型和实例不同地处理；此外，我们将查看使用 Open\
  \ Asset Importer Library 导入关卡数据合适的的文件格式以及在哪里找到游戏关卡。然后，我们将从文件中加载关卡数据和资源到应用程序中，并将四叉树更新为八叉树。作为最后一步，我们将把关卡相关数据添加到渲染器中，以将游戏地图绘制到屏幕上，让我们对我们虚拟世界居民的家园会是什么样子有一个概念。\n\
  \n- 地图数据与模型数据的差异\n- 为地图选择文件格式\n- 导入游戏地图\n- 将地图数据发送到 GPU\n\n本章的示例代码可在 chapter11 文件夹中找到，OpenGL\
  \ 的在 01_opengl_level 子文件夹中，Vulkan 的在 02_vulkan_level 子文件夹中。\n\n### 光照贴图\n\n即使光照贴图的原理在近三十年前\
  \ id Software 的 Quake 中就已引入，这一技术至今仍在使用。在关卡创建期间，静态光源的光效会被“烘焙”到纹理中，明亮的像素描绘了关卡几何体上静态光源照射到的部位，而暗色像素则表示关卡表面上的阴影。\n\
  \n光照贴图纹理随后被添加为次要纹理，使光源照不到的区域变暗并模拟阴影。使用光照贴图可以通过保持合理的视觉效果大幅加快光照计算速度，因为不需要昂贵的逐像素计算。\n\
  \n### 导航网格\n\n导航网格，或称 navmesh，是为敌人、NPC 或任何其他计算机控制对象而添加的。关卡几何体将被额外覆盖一层由三角形或其他多边形组成的网格，但仅在计算机控制对象应能够移动的那些位置。导航网格可以加速对象的寻路，并在放置正确时有助于防止碰撞检测。\n\
  \n我们将在第 13 章中再次讨论导航网格，在那里我们为实例添加简单导航。\n\n### 层次细节\n\n模型文件可以包含所谓的细节层次网格。在绘制远离摄像机的模型时，可以降低网格复杂度，而不会影响视觉质量，因为模型只覆盖屏幕上的几个像素。通过使用不同的网格分辨率，可以减少绘制模型所需的总体三角形数量。\n\
  \n关卡数据可以更充分地利用细节层次网格，用更简单的表示替换一组对象。例如，与其在远距离绘制大量视觉上无法区分的岩石，层次细节（HLOD）版本的同一区域可以合并为一个具有调整纹理的单一网格，以极少的面片和纹理提供相似的视觉质量。\n\
  \n### 关卡数据可能是部分或不完整的\n\n你的精美动画 3D 模型应该始终完全可用，而不仅仅是模型的一半，甚至更少。但对于关卡数据而言，关卡的庞大尺寸可能对\
  \ PC 或主机来说一次处理太多，尤其是在考虑额外的关卡数据时，如光照、导航或碰撞检测。但纹理尺寸和质量，或计算机控制角色的数量和分布，也会大幅提高内存需求。此外，当前加载的关卡部分可能具有更多细节，利用可用资源绘制可见区域，而不是将不可见且未使用的數據保留在内存中。\n\
  \n保持玩家的沉浸感是关卡设计的一部分。关卡可能隐藏在蜿蜒的通道后面，其中两个关卡部分都不可见，从而允许游戏引擎丢弃玩家来过的区域并加载他们前往的部分。另一个广泛使用的关卡切换示例是使用电梯，并在进入建筑物、宇宙飞船或类似场景的下一层时加载新的关卡数据。\n\
  \n通过明智地使用预计算数据，可以减少渲染单帧所需的时间，为玩家提供更好的体验。或者，可以利用现在未使用的 CPU 能力来调整视觉细节，允许在屏幕上显示更多对象，或更详细的对象，同时仍保持相同的帧时间。\n\
  \n在地图和实例之间的差异明确后，让我们看看哪些文件格式主要用于关卡数据，以及如何获取游戏地图。\n\n### 为地图选择文件格式\n\nOpen Asset\
  \ Importer Library 知道几种旧的和新的 3D 角色模型格式，但——遗憾的是——对关卡数据的支持相当有限。\n\n我们将首先探索在互联网上找到的关卡文件格式，然后如果可用格式不符合我们的需求，再查看替代方案。\n\
  \n### 使用 Assimp 支持的文件格式中的关卡\n\n一些文件格式用于创建游戏关卡数据，要么从头创建数据，要么使用其他游戏中的建筑和地形作为模板。\n\n\
  如果你想获取一些导入的游戏地图，你应该查看这些网站：\n\n- **Sketchfab**: https://sketchfab.com/\n- **Free3D**:\
  \ https://free3d.com\n\n在这两个网站上，可以搜索和下载大量免费和付费的动画和非动画模型、关卡和资源。多个模型附带 Creative Commons\
  \ 许可，允许你在免费甚至商业项目中使用模型。\n\n\n\n\n通常，你会看到以下格式的关卡：\n\n- Khronos Group glTF（.glTF/.glb）：开源\
  \ glTF 格式不仅可以用于我们各章中使用的动画 Woman 和 Man 模型等模型，还可以将整个关卡导出为 glTF 文件。\n- Collada（.dae）：Collada\
  \ 是一种古老但完全开放的基于 XML 的文件格式。Collada 也由 Khronos Group 管理，并且该文件格式甚至已经制定了 ISO 标准。\n-\
  \ Wavefront（.obj + .mtl）：许多关卡都采用 Wavefront 文件格式。Wavefront 格式的文件是纯文本（没有二进制组件），该格式文档完善且被广泛支持。\n\
  - 通用场景描述（.usd/.usdz）：与其他文件格式相比，**通用场景描述（USD）** 格式相当新。USD 也是开源的且文档完善，但由于文件格式的复杂性，Assimp\
  \ 中的支持仍处于实验阶段。\n- Autodesk FBX（.fbx）：“Filmbox” 格式是专有的，并且大多没有文档，但 Blender 和 Assimp\
  \ 等工具可以读写这种文件格式。使用 FBX 或多或少需要自担风险，因为可能只有特定版本能按预期工作。\n\n如果这些格式都不符合你的需求，你可能需要扩展某种文件格式，甚至构建自定义文件格式。\n\
  \n## 扩展现有格式或创建自定义格式\n\n从头创建新的游戏关卡或修改现有游戏关卡，可能需要原始文件格式中不存在的额外信息，例如烘焙光照贴图、树木数据、导航网格或细节层次数据。更多信息请参见\
  \ *关卡数据可能包含额外数据* 一节。\n\nglTF 等文件格式内置了创建扩展的能力，而其他文件格式可能很难扩展，甚至无法在不破坏现有导入器的情况下扩展。在这种情况下，你可以从头发明自己的文件格式，或者将某种标准文件格式用于关卡数据，并添加一种自定义格式来存储额外数据。\n\
  \n本书前面在 *第 5 章* 的 *添加 YAML 解析器* 一节中创建了一种自定义文件格式：用于存储模型、实例、摄像机、碰撞检测和节点树的所有设置的 YAML\
  \ 配置文件。虽然我们依赖标准的文本格式将数据存储到磁盘上，但文件的内容是针对我们示例应用的需求而定制的。\n\n将相同的数据存储为二进制格式也是可行的，例如，当解码文本信息耗时过长时。\n\
  \n但创建一种全新的文件格式应该是最后的手段，因为你需要编写所有读写数据的代码，在读写操作期间跟踪文件格式的不同版本，甚至可能还要支持不同的操作系统和硬件架构。维护这样一种自然演化的文件格式可能成为一场噩梦。\n\
  \n更好的方法是使用标准格式，并将所有文件打包到一个存档中，例如 ZIP 文件。当关卡分发给玩家或其他开发者时，你不必担心文件缺失，同时也不需要重新发明轮子去创建一种包罗万象的新文件格式。\n\
  \n这类存档比你想象的更常见。例如，原版 DOOM 中的 WAD 格式和 Quake 系列的 PAK/PK2/PK3 格式，都是为了将全部游戏数据收集到单个文件中而创建的，而且这些文件类型甚至支持补丁更新，因为新存档中的文件会替换旧存档中的同名文件。\n\
  \n## 构建自己的关卡\n\n如果你在互联网上找不到合适的游戏关卡地图怎么办？你仍然可以选择自己创建一个小地图，例如使用 Blender。创建地图超出了本书的范围，但你可以在互联网上找到合适的教程和视频。在“其他资源”一节中可以找到两个示例视频的链接。\n\
  \n在探讨了在应用中分离模型数据和关卡数据的原因之后，我们现在将实现用于加载和处理关卡数据的新代码。\n\n## 导入游戏地图\n\n作为加载关卡的第一步，我们将添加一个名为\
  \ AssimpLevel 的新 C++ 类。你可以将 AssimpLevel 类视为 AssimpModel 和 AssimpInstance 这两个类的混合体，它包含模型类的静态顶点数据，以及实例类的位置、旋转或缩放等动态属性。\n\
  \nAssimpLevel 类由两个新文件组成：AssimpLevel.h 和 AssimpLevel.cpp。这两个文件都位于 model 文件夹中，但我们将借用\
  \ AssimpModel 和 AssimpInstance 这两个类的大部分方法和成员。\n\n让我们简要地浏览一下 AssimpLevel 类。\n\n##\
  \ 添加一个 C++ 类来保存关卡数据\n\n由于关卡数据与模型/实例数据非常相似，我们可以重用 AssimpModel 和 AssimpInstance 类中已有的部分功能，例如加载模型文件或执行矩阵运算。\n\
  \n对于静态数据，我们可以从 AssimpModel 类中复制以下方法和成员，并将名称中的 model 部分替换为 level，以与类名保持一致：\n\n- loadModel()\
  \ 方法，但不包括骨骼、动画和查找表创建\n- processNode() 方法，同样不包括骨骼相关部分\n- 整个 draw() 方法\n- getTriangleCount()、getModelFileName()\
  \ 和 getModelFileNamePath() 方法\n- setModelSettings() 和 getModelSettings() 方法\n- mTriangleCount\
  \ 和 mVertexCount 成员变量\n- mRootNode、mNodeList、mRootTransformMatrix、mModelMeshes、mVertexBuffers\
  \ 和 mModelSettings 成员变量，用于存储可行的关卡数据\n- mTextures 和 mPlaceholderTexture 成员变量，用于纹理\n\
  \n对于动态数据，可以从 AssimpInstance 类中复制以下方法和成员，同样将名称中的 model 替换为 level：\n\n- updateModelRootMatrix()\
  \ 和 getWorldTransformMatrix() 方法\n- mLocalTranslationMatrix、mLocalRotationMatrix、mLocalScaleMatrix、mLocalSwapAxisMatrix、mLocalTransformMatrix\
  \ 和 mModelRootMatrix 成员变量\n\n为了将所有可变的关卡数据放在一个位置，我们在 model 文件夹中创建了 LevelSettings.h\
  \ 文件，其中包含 LevelSettings 结构体：\n\n```\nstruct LevelSettings {\n    std::string lsLevelFilenamePath;\n\
  \    std::string lsLevelFilename;\n    glm::vec3 lsWorldPosition = glm::vec3(0.0f);\n\
  \    glm::vec3 lsWorldRotation = glm::vec3(0.0f);\n    float lsScale = 1.0f;\n \
  \   bool lsSwapYZAxis = false;\n};\n```\n\n如你所见，这些关卡设置也是部分取自模型设置（文件名）和实例设置（位置、旋转、缩放、轴交换）的数据的混合体。LevelSettings\
  \ 数据类型将用于简化用户界面中的关卡设置，并用于保存和加载关卡相关数据。\n\n我们还通过添加一个名为 micLevels 的 AssimLevel 共享指针向量，以及一个保存向量中当前所选关卡的\
  \ micSelectedLevel 整数，使已加载的关卡数据可用于应用的其他部分：\n\n```\nstd::vector<std::shared_ptr<AssimLevel>>\
  \ micLevels{};\nint micSelectedLevel = 0;\n```\n\n管理 micLevels 向量中的 AssimLevel 对象的主要工作将由\
  \ renderer 类处理，因此我们第二步将添加方法和回调。\n\n## 添加回调和渲染器代码\n\n新的关卡功能与现有模型功能之间的相似性也延续到了回调中。必须在\
  \ Callbacks.h 文件中添加三个新的回调定义：levelCheckCallback、levelAddCallback 和 levelDeleteCallback。\n\
  \n```\nusing levelCheckCallback = std::function<bool(std::string)>;\nusing levelAddCallback\
  \ = std::function<bool(std::string)>;\nusing levelDeleteCallback =\n    std::function<void(std::string)>;\n\
  ```\n\n对于模型，我们有一组相同的回调。第一个回调 levelCheckCallback 用于检查是否已加载了同名的关卡文件，另外两个回调 levelAddCallback\
  \ 和 levelDeleteCallback 用于从文件加载新关卡和删除现有关卡对象。\n\n与大多数回调一样，我们也会在 ModelInstanceCamData.h\
  \ 的 ModelInstanceCamData 结构体中提供这些函数：\n\n```\nlevelCheckCallback micLevelCheckCallbackFunction;\n\
  levelAddCallback micLevelAddCallbackFunction;\nlevelDeleteCallback micLevelDeleteCallbackFunction;\n\
  ```\n\n\n\n\n在图 11.1 中，显示了用于关卡数据的 resulting 用户界面部分：\n\n![](img/3cfb9832c943f5f7366fd104b5255971_381_0.png)\n\
  \nLevels 组合框是从 ModelInstanceCamData 结构体中的 micLevels 向量内的关卡文件名填充的。用于关卡数据的 Delete\
  \ Level 按钮的功能与 UI 的 Models 部分中的 Delete Model 按钮相同，删除当前选中的关卡，而轴交换、位置、旋转和缩放的控件则取自\
  \ Instances UI 部分，并带有 Reset Values to Zero 按钮以将所有控件设置为默认值。\n\n除了新的控件元素外，还创建了一个名为\
  \ Levels 的新主菜单项。图 11.2 显示了此时主菜单的所有元素：\n\n![](img/3cfb9832c943f5f7366fd104b5255971_381_1.png)\n\
  \n点击 Load Level... 会打开众所周知的基于 ImGui 的文件对话框，其配置了关卡数据支持的文件格式列表。有关过滤器中扩展名的信息，请参阅 Choosing\
  \ a format for a map 部分。\n\nDelete Model 和 Load Level... UI 元素利用回调来向应用程序添加和删除 AssimpLevel\
  \ 对象，为用户在向虚拟世界添加关卡数据时创建无缝的工作流程。\n\n就用户体验而言，关卡数据与模型实例之间的显著区别在于缺少对关卡数据的视觉选择和修改功能。由于你会在对位置、旋转和缩放感到满意之前只调整关卡数据几次，因此像实例一样持续移动关卡数据的额外代码只会被使用一次或两次。更有可能的是，如果关卡数据在错过目标实例几像素时被选中，视觉选择会损害工作流程。\n\
  \n作为关卡数据管理的最后一步，我们将把加载的关卡文件名和每个关卡的设置添加到 YAML 配置文件中。\n\n## 保存和加载关卡配置\n\n将加载的关卡和关卡设置存储在\
  \ YAML 配置文件中非常快速且直接。\n\n在为 LevelSettings 数据类型添加 Emitter 输出运算符重载后，我们可以复制并调整 YamlParser\
  \ 类的 createConfigFile() 方法中用于模型或相机的 emitting 代码块，以保存关卡数据。此外，我们还必须在配置文件的 settings\
  \ map 中发出选中的关卡编号。\n\n此外，还向 YamlParser 类添加了两个名为 getLevelConfigs() 和 getSelectedLevelNum()\
  \ 的新方法：\n\n```\nstd::vector<LevelSettings> getLevelConfigs();\nint getSelectedLevelNum();\n\
  ```\n\n这两种方法遵循与模型和相机对应方法相同的流程。第一个方法 getLevelConfigs() 尝试从 YAML 文件加载关卡数据，而 getSelectedLevelNum()\
  \ 返回配置保存时所选关卡的索引。\n\n在 YamlParserTypes.h 文件中，必须为 LevelSettings 数据类型添加一对简单的 encode()\
  \ 和 decode() 方法以从 YAML 文件读取回数据。我们还应将 mYamlConfigFileVersion 值增加，因为配置结构已发生变化。\n\n\
  现在我们可以从文件中添加关卡数据，将关卡放置在虚拟世界中，并存储和重新加载配置。将关卡数据添加到撤销/重做栈留作练习，但关卡数据撤销/重做的基本原理与模型的撤销/重做功能相同。\n\
  \n由于关卡数据可能包含重叠的元素，例如桥梁、隧道或建筑物的多层，实例可能在二维上位于同一位置。即使实例在关卡中以不同的高度行走，现有的碰撞检测也会被触发，导致对不存在的碰撞产生错误反应。\n\
  \n我们必须将四叉树扩展为八叉树以支持三维中的碰撞检测。让我们看看如何升级四叉树。\n\n## 将四叉树转换为八叉树\n\n将四叉树更新为八叉树惊人地简单，大部分工作可以通过使用\
  \ IDE 的重构功能中的重命名功能触发。为了简洁，我们只在这里简要介绍所需的更改。请在 chapter11 文件夹内的子文件夹中查看示例代码以获取完整的八叉树代码。\n\
  \n首先，我们将四叉树文件夹的名称更改为 octree。在 CMakeLists.txt 文件中，quadtree 的两个出现也必须重命名为 octree 以匹配文件夹名称。我们重命名\
  \ QuadTree 类为 Octree 并将 BoundingBox2D 更改为 BoundingBox3D。\n\n接下来，我们通过使用八个而不是四个子节点来扩展\
  \ Octree 类。图 11.3 显示了八叉树的象限 ID：\n\n![](img/3cfb9832c943f5f7366fd104b5255971_383_0.png)\n\
  \n图 11.3：八叉树中的象限 ID\n\n四个现有的子象限 ID 0 到 3 将用于四个正面朝向的八分体，而四个背面朝向的八分体将获得新的 ID 4 到 7。将四个新的八分体移动到八叉树长方体的后面使我们能够保留大部分来自四叉树的逻辑。添加查找正确八分体的新逻辑仅仅是复制和粘贴代码的行为，同时考虑到正面和背面朝向的八分体。\n\
  \n然后，我们将代码中所有 QuadTree 相关的 include 语句、类和方法调用更新为 Octree，并将所有 BoundingBox2D 的出现更新为\
  \ BoundingBox3D。边界框的升级包括将旧 BoundingBox2D 参数的所有 glm::vec2 类型更改为使用 glm::vec3。我们还将\
  \ getTopLeft() 的名称更改为 getFrontTopLeft() 并添加 getBack() 方法以反映第三维度的可用性。\n\n最后，代码中所有回调函数的类型将从\
  \ quadTree 重命名为 octree，以反映代码其他地方的功能更改。\n\n现在我们可以使用八叉树在三维中检测碰撞。可惜的是，Instance Positions\
  \ 窗口仍然显示实例的俯视图，我们无法看到是否有实例放置在不同的高度。我们必须调整包含实例的迷你窗口的渲染方式，以便可以看到放置在不同高度的任何实例。\n\n\
  ## 创建交互式八叉树视图\n\n新的八叉树视图创建分为三个步骤：\n\n- 1. 为了更好地概览八叉树和实例，新视图可以通过使用鼠标进行缩放、旋转和平移。由于正交显示和八叉树的对称性，可能仍需要一些额外的旋转来使八叉树与摄像机视图对齐，但这很难做到。淡出远处的八叉树部分或突出显示包含摄像机的八分体可能有助于聚焦当前感兴趣区域。另一方面，使用透视投影的八叉树可能更容易找到正确的对齐方式，但透视会扭曲实例之间的距离，我们只是创建了主关卡渲染的副本。\n\
  - 2. 八叉树象限和实例的线条被收集到一个临时数据结构中。我们将在此使用 OGLLineMesh，因为该数据类型仅包含最少的内容；我们需要绘制 ImGui 线条。\n\
  - 3. 为了实现所需的视图，八叉树象限和实例边界框的所有点必须通过第一步中的缩放、旋转和平移进行转换。这种转换与我们对摄像机和实例所做的相同：通过为每个点创建矩阵和矩阵-向量乘法进行。矩阵运算中不应有任何意外；只有平移可能需要解释。\n\
  \n让我们先逐步介绍交互部分。\n\n## 添加交互性\n\n为了能够使用鼠标按钮和鼠标移动更改八叉树视图，我们需要在 UserInterface 类中添加三个新的私有变量，命名为\
  \ mOctreeZoomFactor、mOctreeRotation 和 mOctreeTranslation：\n\n```\nfloat mOctreeZoomFactor\
  \ = 1.0f;\nglm::vec3 mOctreeRotation = glm::vec3(0.0f);\nglm::vec3 mOctreeTranslation\
  \ = glm::vec3(0.0f);\n```\n\n变量的名称不言自明，因此我们无需在此深入细节。\n\n\n\n\n在 UserInterface 类的\
  \ createPositionsWindow() 方法中创建 **实例位置** 窗口之后，我们添加一个检查以查看当前窗口是否已被悬停：\n\n```\nif\
  \ (ImGui::IsWindowHovered(\n    ImGuiHoveredFlags_RootAndChildWindows)) {\n```\n\
  \n如果没有这个检查，鼠标按钮和移动会触发所有窗口中的八叉树视图变化，导致不想要的结果。\n\n然后，我们获取 ImGui 内部 io 结构的引用：\n\n```\n\
  ImGuiIO& io = ImGui::GetIO();\nmOctreeZoomFactor += 0.025f * io.MouseWheel;\nmOctreeZoomFactor\
  \ = std::clamp(mOctreeZoomFactor,\n    0.1f, 5.0f);\n```\n\n在 ImGui 的 io 结构中，可以使用许多内部状态，例如鼠标滚轮或鼠标位置的变化。\n\
  \n我们在这里使用鼠标滚轮来调整八叉树视图的缩放因子。为缩放因子设置上下界有助于避免失去整体概览。\n\n接下来，我们检查右键鼠标按钮是否已被按下，并在右键鼠标按钮仍被按下时根据鼠标移动旋转视图：\n\
  \n```\nif (ImGui::IsMouseDown(ImGuiMouseButton_Right)) {\n    mOctreeRotation.y\
  \ += io.MouseDelta.x;\n    mOctreeRotation.x += io.MouseDelta.y;\n}\n```\n\n使用右键鼠标按钮改变旋转也用于相机，因此这种视图变化在使用应用时应该很熟悉。\n\
  \n最后，我们检查中键鼠标按钮，使用鼠标移动移动八叉树：\n\n```\nif (ImGui::IsMouseDown(ImGuiMouseButton_Middle))\
  \ {\n    mOctreeTranslation.x += io.MouseDelta.x;\n    mOctreeTranslation.y += io.MouseDelta.y;\n\
  }\n```\n\n如果你想知道为什么这里不使用左键鼠标按钮：按下 ImGui 窗口上方的左键鼠标按钮会激活内部窗口移动。我们只剩下右键和中键鼠标按钮来实现两种不同的视图变化。\n\
  \n一旦我们有了想要看到的变换，我们就可以从八叉树和实例中获取线条。\n\n## 收集线条\n\n为了在绘制之前存储线条，我们在 UserInterface 类中添加了一个名为\
  \ mOctreeLines 的私有变量：\n\n```\nOGLLineMesh mOctreeLines{};\n```\n\n在清除 mOctreeLines\
  \ 内部的顶点向量后，我们获取八叉树线条：\n\n```\nmOctreeLines.vertices.clear();\nconst auto treeBoxes\
  \ =\n    modInstCamData.micOctreeGetBoxesCallback();\n```\n\n对于每个八叉树象限，我们获取一个 BoundingBox3D\
  \ 对象，其中包含最小和最大点位置。转换为 AABB 很简单：\n\n```\nAABB boxAABB{};\nboxAABB.create(box.getFrontTopLeft());\n\
  boxAABB.addPoint(box.getFrontTopLeft() +\n    box.getSize());\n```\n\n然后，我们使用 getAABBLines()\
  \ 方法为 AABB 创建所有线条作为 OGLLineMesh，并将线条添加到 mOctreeLines 网格中：\n\n```\nstd::shared_ptr<OGLLineMesh>\
  \ instanceLines =\n    boxAABB.getAABBLines(white);\nmOctreeLines.vertices.insert(\n\
  \    mOctreeLines.vertices.end(),\n    instanceLines->vertices.begin(),\n    instanceLines->vertices.end());\n\
  ```\n\n接下来，我们为每个实例获取 AABB 线条，碰撞实例着红色，所有其他实例着黄色。当前选中的实例还会获得额外的绿色边框，以便轻松停止实例。\n\n\
  在遍历八分之一和实例的循环结束时，mOctreeLines 包含所有应绘制到 ImGui 窗口的线条顶点。现在我们需要将顶点变换以匹配选定的缩放、旋转和平移。\n\
  \n## 计算视图并绘制线条\n\n由于存储中间结果比为每个帧的八叉树线分配和计算新的变换矩阵更快，我们添加了三个更多私有成员变量，名为 mScaleMat、mRotationMat\
  \ 和 mOctreeViewMat：\n\n```\nglm::mat3 mOctreeViewMat = glm::mat3(1.0f);\nglm::mat4\
  \ mRotationMat = glm::mat4(1.0f);\nglm::mat4 mScaleMat = glm::mat4(1.0f);\n```\n\
  \n然后，应用缩放和两个旋转以创建最终视图矩阵：\n\n```\nmScaleMat = glm::scale(glm::mat4(1.0f),\nglm::vec3(mOctreeZoomFactor));\n\
  mRotationMat = glm::rotate(mScaleMat,\nglm::radians(mOctreeRotation.x),\nglm::vec3(1.0f,\
  \ 0.0f, 0.0f));\nmOctreeViewMat = glm::rotate(mRotationMat,\nglm::radians(mOctreeRotation.y),\n\
  glm::vec3(0.0f, 1.0f, 0.0f));\n```\n\n现在我们以每组两个顶点的方式遍历 mOctreeLines 中的顶点，因为我们需要每条线的起点和终点：\n\
  \n```\nfor (int i = 0; i < mOctreeLines.vertices.size(); i += 2) {\n```\n\n在循环内部，我们提取每条线的顶点对，并通过与\
  \ mOctreeViewMat 相乘来变换顶点位置：\n\n```\nOGLLineVertex startVert = mOctreeLines.vertices.at(i);\n\
  OGLLineVertex endVert = mOctreeLines.vertices.at(i+1);\nglm::vec3 startPos = mOctreeViewMat\
  \ *\n    startVert.position;\nglm::vec3 endPos = mOctreeViewMat * endVert.position;\n\
  ```\n\n接下来，我们将点坐标添加到绘制的中心并添加平移部分：\n\n```\nImVec2 pointStart =\n    ImVec2(drawAreaCenter.x\
  \ + startPos.x +\n        mOctreeTranslation.x,\n        drawAreaCenter.y + startPos.z\
  \ +\n        mOctreeTranslation.y);\nImVec2 pointEnd =\n```\n\n```\nImVec2(drawAreaCenter.x\
  \ + endPos.x +\n    mOctreeTranslation.x,\n    drawAreaCenter.y + endPos.z +\n \
  \   mOctreeTranslation.y)\n```\n\n我们不需要在这里使用单独的平移矩阵，因为八叉树线的移动只与 ImGui 窗口相关，而不是 3D\
  \ 顶点的位置。\n\n在循环结束时，我们使用线条的颜色和固定 alpha 值从起点到终点绘制一条 ImGui 线：\n\n```\ndrawList->AddLine(pointStart,\
  \ pointEnd,\n    ImColor(startVert.color.r, startVert.color.g,\n        startVert.color.b,\
  \ 0.6f));\n```\n\n如果我们在这些更改后启动应用程序，八叉树视图可以通过按右键鼠标按钮旋转，通过按中键鼠标按钮移动，并通过使用鼠标滚轮缩放进出。\n\
  \n图 11.4 显示了实例位置窗口中八叉树的视图：\n\n![](img/3cfb9832c943f5f7366fd104b5255971_388_0.png)\n\
  \n图 11.4：带有实例和两个细分级别的旋转八叉树\n\n您可以看到所有实例的三维包围盒。碰撞实例以红色绘制，所有其他实例以黄色绘制（与 AABB 调试线相同的颜色），当前选中的实例具有额外的绿色轮廓。\n\
  \n另一个要看到的重要事实是八叉树的细分级别。在八叉树的根级别，一个细分被分为八个八分之一——这是由于实例数量而发生的。在最右下方的八分之一中，需要另一个细分来限制每个八分之一的实例数量。\n\
  \n当应用程序运行时，可以实时看到实例的移动和八叉树细分的变化。视图可以更改以聚焦于八叉树的任何有趣区域。\n\n默认八叉树实现的缺点是开销不断增长。细分可能产生大量空节点，特别是如果每个节点的阈值小且树深度高。对于我们的实现，每个细分成八个八分之一会增加大约一千字节的内存开销，即使我们只需要在一个子八分之一中存储一两个实例\
  \ AABB。\n\n此外，每个细分会为遍历成本增加另一个步骤。尽管遍历复杂度仅以对数方式增长，但内存和遍历时间的开销在较大级别可能会变得显著。在这种情况下，可以使用稀疏体素八叉树等数据结构代替。描述稀疏体素八叉树原理的论文链接可在“附加资源”部分找到。\n\
  \n当前关卡加载的一个缺点是缺少关于加载关卡数据尺寸的“感觉”。如果关卡不是平坦的，而是包含不同高度的区域，就很难想象关卡数据的边缘。\n\n为了获得更好的方向感，我们还将为关卡数据添加一个\
  \ AABB。\n\n## 为关卡数据构建 AABB\n\n轴对齐包围盒是一个很好的工具，可以避免估计或猜测物体的尺寸。我们使用模型实例 AABB 作为解决方案，通过允许应用程序比较两个实例的最大范围来检测碰撞。\n\
  \n虽然实例顶点和包围盒之间的未使用区域是碰撞检测速度和复杂性的权衡，但对于关卡数据情况不同。AABB 线条将帮助我们看到关卡在所有三个维度上的最大范围，特别是当关卡数据有大量未使用区域时。\n\
  \n\n\n\n\n为了在用户界面中获得一个漂亮的交互式显示，我们在 Levels 部分添加了一个名为 settingChangedForAABB 的布尔值。在每次滑块或复选框更改时，或按下\
  \ Reset Values to Zero 按钮时，我们会触发对该级别 AABB 的重新计算。\n\n那么其他静态关卡元素呢？这些对象称为资产，可以添加到关卡中。资产也需要碰撞检测以防止实例相互穿过，但资产大多不是动画的；它们保持在关卡设计师预期的位置。\n\
  \n我们在这里使用一个快捷方式，利用非动画模型来模拟静态关卡资产。对于动态资产，例如按钮或门，可以使用动画模型；请参阅 Level data does not\
  \ move around 部分以获取简要说明。在 Practical sessions 部分，有一个将动态资产添加到虚拟世界的任务。\n\n那么，让我们看看非动画模型需要做哪些更改。\n\
  \n## 使用非动画模型作为资产\n\n为了避免添加一个功能与非动画模型大多相同的新 AssimpAsset 类，我们将扩展当前的 AssimpModel 类和渲染器。\n\
  \n对于模型类，我们更改 getAABB() 方法，使其为带动画的模型返回动态 AABB，为不带动画的模型返回静态 AABB：\n\n```\nAABB AssimpModel::getAABB(InstanceSettings\
  \ instSettings) {\n    if (mNumAnimatedMeshes > 0) {\n        return getAnimatedAABB(instSettings);\n\
  \    } else {\n        return getNonAnimatedAABB(instSettings);\n    }\n}\n```\n\
  \n新的方法 getAnimatedAABB() 只是旧 getAABB() 方法的新名称，它像以前一样从查找数据计算 AABB。另一个新方法 getNonAnimatedAABB()\
  \ 基本上是 AssimpInstance 类中的 updateModelRootMatrix() 方法。\n\n首先，我们为缩放、旋转、轴交换和转换计算一个单独的矩阵：\n\
  \n```\nglm::mat4 localScaleMatrix = glm::scale(glm::mat4(1.0f),\n    glm::vec3(instSettings.iScale));\n\
  glm::mat4 localSwapAxisMatrix;\nif (instSettings.iSwapYZAxis) {\n    glm::mat4 flipMatrix\
  \ = glm::rotate(glm::mat4(1.0f),\n        glm::radians(-90.0f), glm::vec3(0.0f,\
  \ 0.0f, 1.0f));\n    localSwapAxisMatrix = glm::rotate(flipMatrix,\n        glm::radians(-90.0f),\
  \ glm::vec3(0.0f, 1.0f, 0.0f));\n} else {\n    localSwapAxisMatrix = glm::mat4(1.0f);\n\
  }\nglm::mat4 localRotationMatrix = glm::mat4_cast(\n    glm::quat(glm::radians(instSettings.iWorldRotation)));\n\
  glm::mat4 localTranslationMatrix =\n    glm::translate(glm::mat4(1.0f),\n      \
  \  instSettings.iWorldPosition);\n```\n\n然后，将变换矩阵和来自模型文件的根变换矩阵组合成一个变换矩阵：\n\n```\n\
  glm::mat4 localTransformMatrix =\n    localTranslationMatrix * localRotationMatrix\
  \ *\n    localSwapAxisMatrix * localScaleMatrix *\n    mRootTransformMatrix;\n```\n\
  \n为了创建边界框数据，模型网格的所有顶点都转换到新位置，并将位置添加到名为 modelAABB 的局部变量中：\n\n```\nAABB modelAABB{};\n\
  for (const auto& mesh : mModelMeshes) {\n    for (const auto& vertex : mesh.vertices)\
  \ {\n        modelAABB.addPoint(localTransformMatrix *\n            glm::vec4(glm::vec3(vertex.position),\
  \ 1.0f));\n    }\n}\n```\n\n对于顶点位置的 w 元素，需要与关卡数据 AABB 相同的调整。通过将最后一个值设置为 1.0f，我们保证在计算最终位置时进行正确的矩阵乘法。\n\
  \n有了 resulting AABB，非动画实例顶点的范围能够检测与动画模型的 AABB 碰撞并绘制调试线。\n\n## 资产 AABB 的性能考虑\n\n\
  目前，非动画实例的 AABB 在每一帧为每个实例计算，就像动画实例的 AABB 一样。如果计算成为瓶颈，例如在虚拟世界中放置了大量静态资产，可以很容易地仅在 UI\
  \ 中的属性更改时更改 AABB 计算。\n\n一旦关卡数据被加载和处理并且 AABB 被计算，我们就可以准备将关卡三角形绘制到屏幕上。\n\n让我们扩展渲染器以将关卡数据添加到渲染过程中。\n\
  \n## 将关卡数据发送到 GPU\n\n随着新功能的不断添加，应用程序中重用代码变得更加简单。在关卡数据的情况下，网格数据被封装在 AssimpLevel 类中，并且可以通过对所有加载的关卡进行一个小循环来绘制关卡的三角形。\n\
  \n作为第一步，我们创建一个新的着色器来绘制关卡数据。\n\n### 创建新的着色器\n\n由于我们只需要绘制一次关卡三角形，使用单独的着色器来绘制关卡数据是一个聪明的想法。将私有着色器\
  \ mAssimpLevelShader 添加到渲染器类的头文件中：\n\n```\nShader mAssimpLevelShader{};\n\n```\n\
  \n着色器将使用两个新文件，assimp_level.vert 用于顶点着色器和 assimp_level.frag 用于片段着色器。我们在渲染器的 init()\
  \ 方法中与其它着色器一起加载这些文件：\n\n```\nif (!mAssimpLevelShader.loadShaders(\n\"shader/assimp_level.vert\"\
  ,\n\"shader/assimp_level.frag\")) {\n  return false;\n}\n\n```\n\n片段着色器文件 assimp_level.frag\
  \ 只是 assimp.frag 文件的副本，没有任何更改。对于顶点着色器文件 assimp_level.vert，我们可以复制 assimp.vert 文件并保留\
  \ in 和 out 布局部分以及 Matrices 统一缓冲区。\n\n我们不需要选择缓冲区，因为尚未为关卡数据实现视觉选择，并且我们可以将绑定点 1 处的缓冲区更改为只包含单个\
  \ 4x4 矩阵：\n\n```\nlayout (std430, binding = 1) readonly restrict\n  buffer WorldTransformMatrix\
  \ {\n    mat4 worldTransformMat;\n};\n```\n\n将像单个矩阵这样的小数据元素上传到 GPU 上的统一缓冲区并不是最好的主意，因为每次上传都可能给帧增加一点延迟。对于真正的游戏或游戏引擎，世界变换矩阵将是更大缓冲区的部分，但为了简单起见，我们在这里只进行单次上传。\n\
  \n在顶点着色器的 main() 方法中，我们使用 worldTransformMat 将位置和法线顶点转换到由关卡属性创建的矩阵给出的最终位置：\n\n```\n\
  void main() {\n  gl_Position = projection * view * worldTransformMat *\n    vec4(aPos.x,\
  \ aPos.y, aPos.z, 1.0);\n  color = aColor;\n  normal = transpose(inverse(worldTransformMat))\
  \ *\n    vec4(aNormal.x, aNormal.y, aNormal.z, 1.0);\n  texCoord = vec2(aPos.w,\
  \ aNormal.w);\n}\n```\n\n然后，在渲染器的 draw() 方法中，我们遍历所有关卡并通过检查是否存在任何三角形来跳过空关卡：\n\n作为关卡显示过程的最后一步，触发顶点绘制：\n\
  \n```\nfor (const auto& level : mModelInstCamData.miLevels) {\n  if (level->getTriangleCount()\
  \ == 0) {\n    continue;\n  }\n\n  mAssimpLevelShader.use();\n  mShaderModelRootMatrixBuffer.uploadSsboData(\n\
  \      level->getWorldTransformMatrix(), 1);\n  level->draw();\n}\n```\n\n在屏幕上绘制关卡\
  \ AABB 需要渲染器中更多的几个方法和成员变量。\n\n### 绘制关卡 AABB\n\n关卡 AABB 顶点存储在渲染器类的一个新私有成员变量 mAllLevelAABB\
  \ 中：\n\n```\nAABB mAllLevelAABB{};\n```\n\n另外，两个新的私有方法 generateLevelAABB() 和 drawLevelAABB()\
  \ 被添加到渲染器类中：\n\n```\nvoid generateLevelAABB();\nvoid drawLevelAABB(glm::vec4 aabbColor);\n\
  ```\n\n我们在这里将生成和绘制 AABB 线分开，以避免在每一帧绘制时进行昂贵的计算。\n\n在 generateLevelAABB() 中生成关卡 AABB\
  \ 是通过一个简单的循环完成的。在清除关卡 AABB 数据后，我们遍历所有加载的关卡：\n\n```\nmAllLevelAABB.clear();\nfor\
  \ (const auto& level : mModelInstCamData.miLevels) {\n    if (level->getTriangleCount()\
  \ == 0) {\n        continue;\n    }\n}\n```\n\n\n\n\n### 加载游戏关卡地图\n\n对于没有三角形的关卡，检查会跳过空关卡，因为没有需要绘制到屏幕上的内容。然后，我们生成每个关卡的AABB，并将每个关卡的最小和最大范围添加到\
  \ mAllLevelAABB：\n\n```cpp\nlevel->generateAABB();\nmAllLevelAABB.addPoint(level->getAABB().getMinPos());\n\
  mAllLevelAABB.addPoint(level->getAABB().getMaxPos());\n}\n```\n\n生成的AABB包含所有已加载关卡的全部关卡数据。如果你希望每个关卡拥有独立的AABB，可以使用AABB的向量，而不是单一的AABB。\n\
  \n在 `drawLevelAABB()` 方法中绘制关卡AABB几乎无需赘述：\n\n```cpp\nmAABBMesh = mAllLevelAABB.getAABBLines(aabbColor);\n\
  mLineVertexBuffer.uploadData(*mAABBMesh);\nmLineShader.use();\nmLineVertexBuffer.bindAndDraw(GL_LINES,\
  \ 0, mAABBMesh->vertices.size());\n```\n\n我们使用AABB的 `getAABBLines()` 方法生成线数据，将线条上传到\
  \ `mLineVertexBuffer`，在 `LineShader` 上调用 `use()`，然后在 `mLineVertexBuffer` 对象上调用 `bindAndDraw()`\
  \ 来绘制关卡数据的轴对齐包围盒。\n\n随后，在渲染器的 `draw()` 方法中，当 `rdDrawLevelAABB` 设置为 `true` 时，我们调用\
  \ `drawLevelAABB()`：\n\n```cpp\nif (mRenderData.rdDrawLevelAABB) {\n    glm::vec4\
  \ levelAABBColor = glm::vec4(0.0f, 1.0f, 0.5f, 0.5f);\n    drawLevelAABB(levelAABBColor);\n\
  }\n```\n\n颜色是随意选取的，你可以更改颜色值，甚至在UI中添加一个包含3个浮点分量的滑块来控制颜色值。\n\n在屏幕上显示关卡AABB线，是通过 `OGLRenderData.h`\
  \ 文件中的 `OGLRenderData` 结构体中一个名为 `rdDrawLevelAABB` 的新布尔变量实现的：\n\n```cpp\nbool rdDrawLevelAABB\
  \ = false;\n```\n\n对于Vulkan版本的代码，该变量将创建在 `VkRenderData.h` 文件中的 `VKRenderData` 结构体中。\n\
  \n在 `UserInterface` 类中，我们在 `createSettingsWindow()` 方法的 `Levels` 部分为 `rdDrawLevelAABB`\
  \ 添加了一个复选框，允许我们切换关卡AABB线的显示。\n\n到此为止！在图11.5中，一个来自Sketchfab的示例地图被加载到女性模型旁边，并且关卡AABB已激活：\n\
  \n![](img/3cfb9832c943f5f7366fd104b5255971_397_0.png)\n\n图11.5：示例地图（未缩放）和一个女性模型实例（来源：Zarudko\
  \ 制作的 Counter Strike 1.6 地图“de_dust”，https://skfb.ly/6QYJw）\n\n作为游戏玩家，你可能认识这张地图：它是\
  \ Counter Strike 1.6 中的“de_dust”。这张地图在 Sketchfab 上有多个版本和格式，还有其他热门游戏地图。\n\n关卡数据周围的包围盒有助于我们了解关卡的尺寸。特别是在像图11.5右前方这样的未使用区域，如果没有AABB线，将很难找到关卡数据的边界。\n\
  \n你还会注意到关卡地图和模型实例之间不同寻常的大小比例。地图和模型都以其默认缩放值加载，大小值由文件作者随意选取。借助用于模型和关卡数据的缩放滑块，调整其中一个或两个对象的大小很容易，但要在来自不同来源和创作者的关卡、模型和其他对象之间获得合理的比例可能会变得很有挑战性。\n\
  \n为了创建一个可信的虚拟世界，游戏角色模型的尺寸必须与家具、建筑、环境物体等的尺寸相匹配。即使不同物体比例上很小的不匹配，在与现实世界中的游戏角色和物体进行比较时也会显而易见。调整不同元素的一个好方法是使用一个已知尺寸的固定大小对象，例如\
  \ Minecraft 中的一个方块，其（虚拟）边长为1米，甚至在虚拟世界中使用一条定义好长度的简单线段。通过将所有对象按与已知对象相比的真实世界尺寸进行缩放，不同来源的模型可以在视觉上匹配。\n\
  \n### 总结\n\n在本章中，我们向虚拟世界添加了静态关卡数据。在探讨了关卡地图与模型之间的差异后，我们了解了适合关卡数据的文件格式，以及如何找到炫酷的游戏地图。然后，我们为应用程序添加了对关卡数据的支持，并将四叉树替换为八叉树，以支持三维碰撞检测。最后，我们将新的关卡数据和关卡AABB添加到渲染器中。在接下来的两章中，我们将扩展关卡数据，以创建一个实例可以自由自主漫游的虚拟世界。\n\
  \n在下一章中，我们将继续第8章的碰撞检测。首先，我们将扩展现有代码，以支持实例与关卡几何体之间的碰撞。为了确保实例始终在地面上，我们将在虚拟世界中引入重力。最后，我们将为实例的腿部添加逆运动学，使模型能够以自然的动作爬楼梯或爬坡。\n\
  \n### 实践练习\n\n以下是你可以在代码中进行的一些扩展尝试：\n\n- 向关卡中添加一扇门或一个按钮。\n\n由于动画关卡数据更像是放置在关卡中固定位置的动画角色模型，而不是静态关卡数据，你可以尝试向关卡中添加门、开关或按钮。按钮在交互时不是弹回，而是播放“按下”动画；门则可以围绕铰链旋转或向一侧滑动。\n\
  \n### 加入我们的Discord社区\n\n加入我们社区的Discord空间，与作者和其他读者讨论：\nhttps://packt.link/cppgameanimation\n\
