  \ 中，只能基于主机组为用户组设置权限。\n\n勾选“SNMP 设备”旁边的复选框，然后点击“选择”按钮。\n\n我们现在可以看到“SNMP 设备”已添加到“读写”框中。接下来，点击“只读”框下方的“添加”。将打开一个与之前完全相同的弹出窗口。这次，勾选“Linux\
