  \ Unix 时间戳。\n\n> 严格来说，这个页面仍然是一个 HTML 页面。Zabbix 用户曾要求提供一个真正的纯文本版本。\n\n### 查询数据库\n\
  \n从前端抓取数据既快捷又简单，但这种方法不适合大量数据，且难以自动化——解析前端页面虽然可行，但不是获取数据的最有效方式。另一种获取数据的方法是直接查询数据库。\n\
  \n> \U0001F4A1 稍后我们将介绍 Zabbix API。除非存在性能问题，否则建议使用 API。\n\n让我们了解历史数据是如何存储的。启动 MySQL\
  \ 命令行客户端（通常简称为 mysql，通常位于 PATH 变量中），并以 zabbix 用户身份连接到 zabbix 数据库：\n\n```\n$ mysql\
  \ -u zabbix -p zabbix\n```\n\n出现提示时，输入 zabbix 用户的密码（你可以通过查看 zabbix_server.conf 的内容来记起密码），然后在\
  \ MySQL 客户端中执行以下命令：\n\n```\nmysql> show tables;\n```\n\n这将列出 zabbix 数据库中的所有表——在\
  \ Zabbix 3.0 中正好是 113 张。要弄清楚这么多表是一项繁重的任务，但就我们当前的需求（获取一些历史数据）而言，只需要其中几张。首先，最有趣的是包含已采集数据的表。所有历史数据都存储在名称以\
  \ history 开头的表中。如你所见，有很多带有不同后缀的表——这是为什么呢？Zabbix 根据数据类型将检索到的数据存储在不同的表中。Zabbix 前端中的类型与数据库中的表之间的对应关系如下：\n\
  \n-   `history`：**数字（浮点）**\n-   `history_log`：**日志**\n-   `history_str`：**字符**\n\
  -   `history_text`：**文本**\n-   `history_uint`：**数字（无符号）**\n\n要获取数据，我们首先必须找出该特定监控项的数据类型。最简单的方法是打开监控项属性，查看**信息类型**字段。我们可以尝试检索三条记录的所有字段，查看\
  \ history 表的内容：\n\n```\nmysql> select * from history limit 3;\n```\n\n输出将告诉我们，该表中的每条记录包含四个字段（你的输出会有不同的值）：\n\
  \n```text\n+--------+------------+--------+----------+\n| itemid | clock      |\
  \ value  | ns       |\n+--------+------------+--------+----------+\n|  23668 | 1430700808\
  \ | 0.0000 | 644043321 |\n|  23669 | 1430700809 | 0.0000 | 644477514 |\n|  23668\
  \ | 1430700838 | 0.0000 | 651484815 |\n+--------+------------+--------+----------+\n\
  ```\n\n倒数第二个字段 value 很直观——它包含采集到的值。clock 字段包含 Unix 时间戳——即自所谓的 Unix 纪元（1970 年 1 月\
  \ 1 日 00:00:00 UTC）以来的秒数。ns 列包含该秒内的纳秒数。\n\n> 将 Unix 时间戳转换为可读形式且无需互联网连接的一个简单方法是使用\
  \ GNU date 命令：`date -d@<timestamp>`。例如，`date -d@1234567890` 将返回 `Sat Feb 14 01:31:30\
  \ EET 2009.`\n\n第一个字段 itemid 是最神秘的。我们如何确定哪个 ID 对应哪个监控项？同样，最简单的方法是使用前端。你应该已经在浏览器中打开了监控项属性页面，所以看一下地址栏。除了其他变量，你会看到类似\
  \ `itemid=23668` 的字符串片段。很好，这样我们就已经拿到了 itemid 值。让我们尝试从数据库中获取该监控项的一些值：\n\n```\nmysql>\
  \ select * from history where itemid=23668 limit 3;\n```\n\n使用你从页面 URL 中获得的 itemid\
  \ 值：\n\n```text\n+--------+------------+--------+----------+\n| itemid | clock \
  \     | value  | ns       |\n+--------+------------+--------+----------+\n|  23668\
  \ | 1430700808 | 0.0000 | 644043321 |\n|  23668 | 1430700838 | 0.0000 | 651484815\
  \ |\n|  23668 | 1430700868 | 0.0000 | 657907318 |\n+--------+------------+--------+----------+\n\
  ```\n\n结果集只包含该监控项的值，正如输出中的 itemid 字段所示。\n\n\n\n\n\n通常我们会想要从特定时间段检索值。猜测 Unix 时间戳并不有趣，所以我们同样可以使用\
  \ `date` 命令来计算相反的值——从人类可读形式的一个日期得到 Unix 时间戳：\n\n```\n```bash\n$ date -d \"2016-01-13\
  \ 13:13:13\" \"+%s\"\n\n1452683593\n```\n```\n\n`-d` 标志告诉 `date` 命令显示指定的时间而不是当前时间，而\
  \ `%s` 格式序列指示它以 Unix 时间戳格式输出。这个精巧的小命令还接受更自由形式的输入，例如 `last Sunday` 或 `next Monday`。\n\
  \n作为练习，找出两个相隔半小时的最近时间戳，然后从数据库中检索该项目的这些值。提示——SQL 查询看起来会类似这样：\n\n```\n```sql\nmysql>\
  \ select * from history where itemid=23668 and clock >= 1250158393\nand clock <\
  \ 1250159593;\n```\n```\n\n你应该能得到一些值。为了验证时间段，将返回的 clock 值转换回人类可读格式。现在获得的信息可以传递给任何外部应用程序进行分析、绘图或比较。\n\
  \n有了包含原始数据的 `history*` 表，我们可以从中获取大量信息。但有时，我们可能只想要一个更大的概览，这时趋势表就能帮上忙。让我们找出这个表到底保存了什么。在\
  \ MySQL 客户端中执行以下操作：\n\n```\n```sql\nmysql> select * from trends limit 2;\n```\n\
  ```\n\n我们现在从 trends 表中选择两条记录：\n\n```text\n+--------+------------+-----+------------+-----------+-----------+\n\
  | itemid | clock      | num | value_min  | value_avg | value_max |\n+--------+------------+-----+------------+-----------+-----------+\n\
  |  23668 | 1422871200 |  63 |     0.0000 |    1.0192 |    1.4300 |\n|  23668 | 1422874800\
  \ | 120 |     1.0000 |    1.0660 |    1.6300 |\n+--------+------------+-----+------------+-----------+-----------+\n\
  ```\n\n![](img/f5313a804532fabacc8d07cc8607eeba_637_0.png)\n\n> 就像 history 表有 `history`\
  \ 和 `history_uint` 一样，对于 **Numeric (float)** 和 **Numeric (unsigned)** 类型的信息，存在 `trends`\
  \ 和 `trends_uint` 表。没有对应的 `_log`、`_str` 或 `_text` 表，因为趋势信息只能针对数值数据计算。\n\n## 与数据紧密协作\n\
  \n在这里，我们找到了两个熟悉的朋友，`itemid` 和 `clock`，其用途和用法我们刚刚讨论过。最后三个值相当不言自明——`value_min`、`value_avg`\
  \ 和 `value_max` 包含数据的最小值、平均值和最大值。但对应什么时间段？`trends` 表包含按小时划分的周期信息。因此，如果我们想在外部应用程序中绘制某一天每小时的最小值、平均值或最大值，而不是重新计算这些信息，我们可以直接从数据库中获取这些预先计算好的数据。但我们遗漏了一个字段：`num`。该字段存储此记录所覆盖的那个小时内值的数量。如果你在一天中每小时有数百条记录，大多都比较一致，但某个小时的数据缺失，只剩下一个极高或极低的值，那么在计算日、周、月或年数据时，我们就可以更正确地计算最终值，而不是给每个小时的值赋予相同的权重。\n\
  \n如果你想从数据库中访问数据以在外部应用程序中重用，请注意保留期——数据会在达到特定项目的 `History storage period` 和 `Trend\
  \ storage period` 字段指定的天数后，从 `history*` 和 `trends*` 表中删除。\n\n## 在远程站点使用数据\n\n我们已经介绍了在\
  \ Zabbix 服务器上检索数据。但如果我们有一个远程站点、一个 Zabbix 代理、一个功能强大的代理机器和一个缓慢的链路呢？在这种情况下，我们可能会想提取代理数据以便重用它。然而，代理以不同于\
  \ Zabbix 服务器的方式存储数据。\n\n就像上一章一样，运行以下命令：\n\n```\n```bash\n$ sqlite3 /tmp/zabbix_proxy.db\n\
  ```\n```\n\n这将打开指定的数据库。我们可以通过使用 `.tables` 命令来查看有哪些表：\n\n```\n```text\nsqlite> .tables\n\
  ```\n```\n\n注意，尽管我们已经知道代理不使用它们而是使用 `proxy_history`，但仍然存在所有的 `history*` 表。数据库模式在服务器和代理上是相同的，即使代理根本不使用其中的大多数表。让我们看看\
  \ `proxy_history` 表的字段。\n\n> \U0001F4A1 要在 SQLite 中检查表定义，可以使用 `.schema proxy_history`\
  \ 命令。\n\n下表说明了项目字段及其用途：\n\n| Field | Usage |\n|---|---|\n| `id` | 记录 ID，用于确定哪些记录已同步回服务器\
  \ |\n| `itemid` | 如 Zabbix 服务器上所示的项目 ID |\n| `clock` | 记录的 Unix 时间，使用代理主机时间 |\n\
  | `timestamp` | 与时间相关，通过日志文件时间格式字段解析，或对于 Windows 事件日志监控——监控机器上显示的时间戳 |\n| `source`\
  \ | 仅与 Windows 事件日志监控相关——事件日志源 |\n| `severity` | 仅与 Windows 事件日志监控相关——事件日志严重性 |\n\
  | `value` | 监控项目的实际值 |\n| `logeventid` | 仅与 Windows 事件日志监控相关——事件 ID |\n| `ns` |\
  \ 该条目的纳秒数 |\n| `state` | 该项目是否正常工作或处于不支持状态 |\n| `lastlogsize` | 已解析的日志文件的大小 |\n\
  | `mtime` | 已解析的已轮转日志文件的修改时间 |\n| `meta` | 如果设置为 1，则表示该条目不包含实际日志数据，只有 `lastlogsize`\
  \ 和 `mtime` |\n\n![](img/f5313a804532fabacc8d07cc8607eeba_639_0.png)\n\n> 代理对项目配置的信息不多；如果你要进行远程处理，需要从\
  \ Zabbix 服务器获取。例如，代理有项目键和间隔，但项目名称在代理数据库中不可用。\n\n正如可以看到的，几个字段将用于日志文件监控，而其他一些仅用于 Windows\
  \ 事件日志监控。\n\n## 更深入地探索数据库\n\n有了从表中提取历史和趋势数据的知识，我们也可以继续查看其他有趣且相对简单的东西，我们可以在数据库中直接找到甚至更改它们。\n\
  \n## 管理用户\n\n我们看到使用前端管理用户是一件轻松的事。但如果忘记了密码怎么办？如果 Zabbix 的某个远程安装由本地员工管理，而唯一的 Zabbix\
  \ 超级管理员已外出度假一个月且无人知道密码怎么办？如果你有数据库访问权限，可以尝试解决此类问题。让我们找出 Zabbix 关于用户存储了什么以及如何存储。在\
  \ MySQL 控制台中执行以下操作：\n\n```\nmysql> select * from users limit 2;\n```\n\n这样，我们最多列出两个用户的所有数据：\n\
  \n| MariaDB [zabbix]> select * from users limit 2; |\n|---|---|---|---|---|\n| userid\
  \ | alias | name | surname | passwd |\n| 1 | Admin | Zabbix | Administrator | 5fce1b3e34b520afeffb37ce08c7cd66\
  \ |\n| 2 | guest |  |  | d41d8cd98f00b204e9800998ecf8427e |\n| 2 rows in set (0.00\
  \ sec) |\n\n> 示例输出在右侧被截断，这里显示的列不到原始列数的一半。你也可以将 SQL 查询中的分号替换为 \\G 以获得垂直输出，如下所示：select\
  \ * from users limit 2 \\G。\n\n字段很多。我们最好弄清楚每个字段的含义：\n\n| Field | Usage |\n|---|---|\n\
  | userid | 很简单，这是一个唯一的数字 ID。 |\n| alias | 更常被称为用户名或登录名。 |\n| name | 用户的名字，通常是其 given\
  \ name。 |\n| surname | 这肯定无非是姓氏。 |\n| passwd | 密码哈希存储在此处。Zabbix 为身份验证存储 MD5 哈希。\
  \ |\n| url | 登录后的 URL 存储在此字段中。 |\n| autologout | 该用户是否启用自动注销。非零值表示超时。 |\n| lang\
  \ | 前端的语言。 |\n| refresh | 页面刷新间隔，单位为秒。如果为零，则禁用页面刷新。 |\n| theme | 使用的前端主题。 |\n| attempt_failed\
  \ | 连续失败的登录尝试次数。 |\n\n\n\n\n\n| 字段 | 用法 |\n|---|---|\n| `attempt_ip` | 最后一次登录失败尝试的\
  \ IP 地址。 |\n| `attempt_clock` | 最后一次登录失败尝试的时间。 |\n| `rows_per_page` | 长列表中每页显示的行数。\
  \ |\n\n正如我们所见，许多字段都是可以从用户配置文件或属性页面访问的选项，尽管其中一些并非直接可用。我们之前提到过密码重置；让我们看一个简单的方法来执行此操作。如果密码以\
  \ MD5 哈希形式存储，我们必须先获取这些哈希值。一种常见的方法是命令行实用程序 md5sum。向其传递某个字符串会输出所需的结果，因此我们可以尝试执行以下操作：\n\
  \n```bash\n$ echo \"somepassword\" | md5sum\n531cee37d369e8db7b054040e7a943d3d \
  \ -\n```\n\nMD5 哈希被打印出来，后面跟着一个减号，表示标准输入。如果我们对文件运行 md5sum，则文件名将改在那里打印。\n\n> 命令行实用程序提供了一种很方便的方式来检查各种序列。例如，尝试弄清楚默认访客密码哈希\
  \ `d41d8cd98f00b204e9800998ecf8427e` 代表什么。\n\n现在，问题是如果我们尝试将此字符串用作密码哈希，它将失败。在这种情况下，哈希是基于传递的字符串计算的，包括末尾的换行符。对于正确版本，我们必须向\
  \ echo 传递 -n 标志，该标志会抑制尾随换行符：\n\n```bash\n$ echo -n \"somepassword\" | md5sum\n9c42a1346e333a770904b2a2b37fa7d3\
  \  -\n```\n\n注意生成字符串的巨大差异。很好，现在我们只需要重置密码。\n\n以下语句会更改 Zabbix 管理员用户密码。除非紧急情况，否则请勿在生产系统上执行此操作：\n\
  \n```sql\nmysql> update users set passwd='9c42a1346e333a770904b2a2b37fa7d3' where\
  \ userid=1;\nQuery OK, 1 row affected (0.01 sec)\n\nRows matched: 1  Changed: 1\
  \  Warnings: 0\n```\n\n从这里开始，您应该能够以 Admin / somepassword 登录 Zabbix 前端——试试看。之后请随意将密码改回。\n\
  \n实际上有一种更简单的方法。MySQL 有一个内置函数用于计算 MD5 哈希，因此所有这些技巧都可以用更简单的方法替代：\n\n```\nmysql> update\
  \ users set passwd=MD5('somepassword') where alias='Admin';\n```\n\n> 在此时，Zabbix\
  \ 不使用密码加盐。虽然这使得重置密码变得更简单，但也使得在 MD5 表中查找实际密码变得更容易。\n\n我们还提到让某个用户成为 Zabbix 超级管理员。此更改相当简单——我们只需要更改一个数字：\n\
  \n```\nmysql> update users set type=3 where alias='wannabe_admin';\n```\n\n就这样，用户\
  \ wannabe_admin 将成为 Zabbix 超级管理员。\n\n## 更改现有数据\n\n虽然一旦监控数据收集完毕，通常您不会需要更改它，但在某些罕见情况下可能需要这样做。在第\
  \ 3 章《使用 Zabbix 代理和基本协议进行监控》中，我们为网络流量监控创建了项目，并以字节为单位收集数据，但在网络管理中，通常使用每秒比特数。而如果您只是重新配置项目并清除旧数据，通常是可行的，如果您需要保留已收集的值怎么办？直接编辑数据库可能是唯一的解决方案。\n\
  \n在执行此操作之前，您必须修改相关项目。如果数据以字节为单位传入，但我们想要比特，怎么办？对，配置该项目的乘数并将乘数设置为 8。此外，在进行更改的同时将单位更改为\
  \ b（比特）。\n\n在更改项目时，快速看一下时钟。\n\n虽然这将处理所有未来的传入值，但它会使该时刻之前的数据不一致。由于我们不想删除它，我们必须找到某种方法来修复它。我们的难题有两个方面：\n\
  \n- 数据库中存在不正确的数据\n- 数据库中同时存在不正确和正确的数据（旧值和新值）\n\n这意味着我们不能简单地转换所有值，因为那样会破坏新的、正确的值。\n\
  \n> 如果您已根据流量设置了任何触发器，请不要忘记同时更改它们。\n\n## 弄清何时\n\n弄清何时开始流入正确信息最简单的方法是查看前端。导航到 **Monitoring\
  \ | Latest data**，点击该项目的 **History**，然后选择 **Values** 或 **500 latest values**。查看您更改项目乘数的时间前后一分钟左右，并检查规模是否有明显变化。虽然很难准确确定两次检查之间的确切间隔（网络流量在两次检查之间的值很容易波动八倍以上），但值应该有相当恒定的增长。查看值左侧的时间，并在第一个正确值和最后一个错误值之间选择一个时刻。\n\
  \n## 计算机语言中的“何时”\n\n但正如我们现在所知，Zabbix 数据库中所有与时间相关信息都以 Unix 时间戳存储。对于此，GNU date 命令可以再次提供帮助。在\
  \ Zabbix 服务器上执行以下操作，将确切时间替换为您从最新值中推断出的时间：\n\n```bash\n$ date -d \"2016-03-13 13:13:13\"\
  \ \"+%s\"\n```\n\n这将输出该时刻的 Unix 时间戳，在本例中为 1457867593。\n\n请注意时区差异——在前端显示的值通常会应用本地时区。检查您获得的时间戳值是否与数据库中该相同时间戳的值匹配。实际上有一种更简单、更安全的方法来获取时间戳值。在前端查看该项目的历史值时，点击右上角的\
  \ **As plain text** 按钮：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_643_0.png)\n\
  \n注意第三列正是我们想要的：Unix 时间戳。在这种情况下，我们也不必担心时区。\n\n## 弄清是什么\n\n现在我们知道了限制更改的确切时间，我们还必须知道要为其修改哪个项目。等等，但我们已经知道了，不是吗？几乎是。我们的需要是项目\
  \ ID，以便对数据库进行更改。最简单的方法是打开配置部分中的项目属性并从 URL 中复制 ID，就像我们之前所做的那样。\n\n## 执行更改\n\n到目前为止，我们应该有两个看起来很神秘的值：\n\
  \n- Unix 时间戳格式的时间\n- 项目 ID\n\n我们现在要做什么？将该时间戳之前项目 ID 的所有值乘以八。有了我们的数据，这实际上非常简单——在\
  \ MySQL 控制台中，我们必须执行以下操作：\n\n```\nmysql> update history_uint set value=value*8 where\n\
  itemid=<our ID>  and clock<'our timestamp'>;\n```\n\n> 为了安全起见，您可能希望在事务中执行修改，并在事务仍处于打开状态时检查结果。如果结果令人满意，则提交更改。如果不满意，则回滚。\n\
  \n我们正在更新 history_uint，因为尽管网络流量的数据由于 Store as 项目选项而是十进制数，但我们通过将数据存储为整数丢弃了小数部分。请参阅第\
  \ 3 章《使用 Zabbix 代理和基本协议进行监控》，以提醒自己我们为何这样做。此单个查询足以将所有旧数据转换为比特。\n\n> 如果您总共有大量历史数据，并且该项目也有大量历史数据，此类查询可能需要相当长时间才能完成。在远程系统上运行此类命令时，请使用\
  \ screen 等工具。\n\n> 我们在这里只修改历史表。如果项目已收集数据更长时间，我们还必须修改相应的 trends 或 trends_uint 表。\n\
  \n## 使用 XML 导入/导出进行配置\n\n除非您必须进行大量修改，而这些修改在前端使用诸如批量更新之类的方法并不更容易，否则 Web 前端是可以接受的用于对\
  \ Zabbix 服务器进行配置更改的工具。一种简单的方法是将配置导出到 XML 文件，进行一些更改，然后再导入回来。\n\nXML 导入/导出经常用于共享模板——您可以在\
  \ https://zabbix.org 和 http://share.zabbix.com 上找到大量此类模板。\n\n> 我们稍后会查看 Zabbix API。建议使用\
  \ API 修改 Zabbix 配置，因为它还提供了比 XML 导入/导出更完整的功能——尽管在某些情况下 XML 方法可能更简单。\n\n让我们看看简单的往返是如何工作的。\n\
  \n## 导出初始配置\n\n在前端，打开 Configuration | Templates 并在 Group 下拉菜单中选择 Custom Templates。标记\
  \ C_Template_Email 旁边的复选框，然后点击底部的 Export 按钮。您的浏览器将提供保存名为 zbx_export_templates.xml\
  \ 的文件——将其保存在本地机器上的某个位置。\n\n## 修改配置\n\n现在，手头有文件，我们可以修改配置。此方法让我们可以自由操作主机和主机附属信息，因此修改仅受\
  \ Zabbix 功能和我们想象力的限制。此时，以下实体可用于 XML 导出和导入：\n\n- 主机\n- 模板\n- 主机组\n- 网络地图\n- 地图图像（图标和背景）\n\
  - 屏幕\n- 值映射\n\n\n\n\n\n在这些实体中，主机组和图片仅被间接导出。对于主机而言，其所有属性和子实体都会被导出和导入，但Web场景除外（此功能可能在Zabbix\
  \ 3.2中可用）。主机组会与主机或模板一起导出，而在导出地图时，其中使用的图片也会在同一文件中导出。可以只导入单一类型的实体，也可以在同一个XML文件中导入任意数量和组合的实体。\n\
  \n## XML导出格式\n\n打开保存的XML导出文件（在你喜欢的编辑器中）。在这个文件中，你会看到该主机所拥有的所有数据，文件的开头如下：\n\n```\n\
  <?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<zabbix_export>\n    <version>3.0</version>\n\
  \    <date>2015-11-29T05:08:14Z</date>\n    <groups>\n        <group>\n        \
  \    <name>Custom templates</name>\n        </group>\n    </groups>\n    <templates>\n\
  \        <template>\n            <template>C_Template_Email</template>\n```\n\n\
  在这种情况下，每个模板都包含在一个`<template>`块中，而该块又包含了所有与该模板关联的事物的块。格式很简单，大多数内容只需快速浏览一下XML就能理解，有时还可以将XML中的值与前端配置部分的值进行比较。一个例外可能是每个字段可用的值。这些值通常可以从API文档中获取，我们稍后会介绍。\n\
  \n在查看导出的模板时，我们可以看到与导出主机相同的信息，包括模板链接——这就是第二个嵌套的`<templates>`块所表示的。\n\n## 围绕导出编写脚本\n\
  \n虽然手动对导出文件进行单一修改可能很方便，但正是大规模修改最能体现这种方法的好处。作为创建XML文件的最简单方法，我们可以使用shell脚本。\n\n例如，如果需要添加大量类似的监控项，我们可以编写一个包含所有这些项的XML文件，然后一次性导入。最简单的方法是先在前端创建一些监控项，导出该主机，然后编写一个快速脚本，循环遍历这些监控项定义并创建其余监控项。触发器（triggers）和自定义图形（custom\
  \ graphs）也可以这样做。同样，最好为单个元素创建所有数据，导出它，并检查以弄清如何将其重新组合起来。\n\n> 除非需要对单个实体进行修改，否则请考虑使用自定义LLD规则，如第12章“自动化配置”所述。\n\
  \n可以通过XML往返解决的其他更大规模的问题包括：\n\n- **添加大量设备**：如果你拿到一大串带有IP地址的交换机列表，通过界面逐一添加将是一项艰巨的任务。而使用XML，这反而会变得非常容易和快捷。为此，只需创建一个主机，将其链接到之前创建的一个或多个模板，然后导出它，从而获得某种模板。在这个导出文件中，你基本上只需更改几个值——特别是`<interfaces>`元素中的连接详情。然后，继续创建一个循环，用相应的IP和主机名数据创建新的`<host>`条目。请注意，只在此文件中指定主机信息就足够了——所有监控项、触发器、图形和其他实体都将根据`<templates>`块中指定的一个或多个模板所包含的信息自动关联。\n\
  \n- **创建包含大量任意监控项的多张图形**：有时，可能不仅需要为每个端口创建一张图形，还需要创建将多个设备上的监控项以及其他任意集合的监控项分组在一起的图形。导出一个示例主机，并在循环中编写图形监控项的脚本——这些监控项位于`<graph_elements>`块中。\n\
  \n> 包含大量监控项的图形很快就会变得难以阅读。不要在一张图形上添加过多监控项。\n\n## 导入修改过的配置\n\n对于我们的第一次XML导出/导入，我们不会进行大规模脚本编写。相反，让我们做一个简单的修改。在保存的`zbx_export_templates.xml`文件中，找到键为`net.tcp.service[smtp]`的监控项块。一个监控项块以`<item>`标签开始，以`</item>`标签结束。复制这个监控项块，插入到现有块的下方，然后将监控项名称改为`POP3\
  \ server status`，键改为`net.tcp.service[pop3]`。\n\n将其保存为一个新文件。现在开始实际的导入过程。回到前端，在**配置\
  \ | 模板**部分，点击右上角的**导入**。在此表单中，点击**导入文件**字段旁边的**选择**，然后选择保存的文件。可以随意探索**规则**部分，虽然默认设置对我们来说已经足够。我们唯一感兴趣的实体类型是缺失的监控项，而**创建新**列中**监控项**旁边的相应复选框已经被勾选。\n\
  \n点击**导入**继续。这应该会成功完成，然后点击左上角的**详细信息**。虽然所有其他记录都将涉及更新，但应该有两个条目是关于正在创建的监控项。这些将是唯一会带来更改的条目，因为所有更新都不会产生任何效果——XML文件中的数据与数据库中的数据相同。由于我们是为模板添加此监控项，它也会被添加到所有链接到此模板的其他主机和模板中：\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_648_0.png)\n\n让我们验证一下这个监控项是否使用我们在XML文件中使用的键来添加。导航到**配置\
  \ | 主机**，确保**分组**下拉列表中选择了**Linux服务器**，然后点击**另一台主机**条目旁边的**监控项**链接。我们的新监控项应该会出现在监控项列表中，表明它已正确添加到链接的主机。请记住，在导入过程中我们只将它添加到了上游模板：\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_648_1.png)\n\n## 生成主机\n\n使用XML导入可以解决的潜在问题之一就是创建大量主机。我们可以使用一个像下面这样的临时脚本，从CSV文件生成Zabbix主机XML：\n\
  \n```bash\n#!/bin/bash\n\nsplit=\"%\"\nagent_port=10050\nuseip=1\n\n[[ -s \"$1\"\
  \ ]] || {\n        echo \"Usage: pass an input CSV file as the first parameter\n\
  ```\n\n```\nFile should contain data in the following format: hostname,dns,ip,host\
  \ group,linked_template,agent_port\nagent_port is optional\nFor groups and templates\
  \ multiple entries are separated with %\nFirst line is ignored (assuming a header)\"\
  \n    exit 1\n}\necho \"<?xml version=\\\"1.0\\\" encoding=\\\"UTF-8\\\"?>\"\n<zabbix_export>\n\
  \    <version>3.0</version>\n    <date>$(date \"+%Y-%m-%dT%H:%M:%SZ\")</date>\n\
  \    <hosts>\"\nwhile read line; do\n    hostname=$(echo $line | cut -d, -f1)\n\
  \    dns=$(echo $line | cut -d, -f2)\n    ip=$(echo $line | cut -d, -f3)\n    group=$(echo\
  \ $line | cut -d, -f4)\n    template=$(echo $line | cut -d, -f5)\n    port=$(echo\
  \ $line | cut -d, -f6)\n\n    hostname1=${hostname%\"}\n    dns1=${dns%\"}\n   \
  \ ip1=${ip%\"}\n    group1=${group%\"}\n    template1=${template%\"}\n    port1=${port%\"\
  }\n\n    hostgroups=$(echo $group1 | tr \"$split\" \"\\n\")\n    templates=$(echo\
  \ $template1 | tr \"$split\" \"\\n\")\n\n    echo \"        <host>\n           \
  \ <host>$(echo ${hostname1#\"})</host>\n            <name>$(echo ${hostname1#\"\
  })</name>\n            <status>0</status>\n            <description/>\n        \
  \    <proxy/>\n            <ipmi_auth_type>-1</ipmi_auth_type>\n            <ipmi_privilege>2</ipmi_privilege>\n\
  \            <ipmi_username/>\n            <ipmi_password/>\n            <tls_connect>1</tls_connect>\n\
  \            <tls_accept>1</tls_accept>\n            <tls_issuer/>\n```\n\n```\n\
  <tls_subject/>\n<tls_psk_identity/>\n<tls_psk/>\n<interfaces>\n    <interface>\n\
  \        <default>1</default>\n        <type>1</type>\n        <useip>$useip</useip>\n\
  \        <ip>${ip1#\"}</ip>\n        <dns>${dns1#\"}</dns>\n        <port>${port1:-$agent_port}</port>\n\
  \        <bulk>1</bulk>\n        <interface_ref>if1</interface_ref>\n    </interface>\n\
  </interfaces>\necho \"    <groups>\"\nwhile read hostgroup; do\n    echo \"    \
  \    <group>\n            <name>${hostgroup#\"}</name>\n        </group>\"\ndone\
  \ < <(echo \"$hostgroups\")\necho \"    </groups>\"\n    <templates>\"\nwhile read\
  \ hosttemplate; do\n    echo \"        <template>\n            <name>${hosttemplate#\"\
  }</name>\n        </template>\"\ndone < <(echo \"$templates\")\necho \"    </templates>\"\
  \necho \"    </host>\"\ndone < <(tail -n +2 $1)\n\necho \"  </hosts>\n</zabbix_export>\"\
  \n```\n\n保存这个脚本为 csv_to_zabbix_xml.sh 并使其可执行：\n\n```\n$ chmod 755 csv_to_zabbix_xml.sh\n\
  ```\n\n> 有些人说shell不是处理XML文件的合适工具。但shell是处理任何事情的好工具，并且完全适合我们这种简单、快速的主机生成。\n\n\n\n\
  \n此脚本以 CSV 文件作为输入，忽略第一行，并将所有其他行用作主机条目。我们必须指定主机名、DNS、IP 和 agent 端口。此外，对于每台主机，我们可以通过用百分号分隔多个条目来指定该主机应关联的多个主机组和模板。`useip`\
  \ 参数默认为 1；将其设置为 0 则将改用 DNS。注意我们是如何生成目前我们并不关心的各种字段——所有 IPMI 和 TLS 字段，以及为 agent 接口设置\
  \ bulk 参数。不幸的是，Zabbix XML 导出的内容过于冗长，并且它期望导入时同样冗长。对于大量主机，这将显著增加 XML 文件的大小。\n\n> 在\
  \ CSV 文件中加引号，可以让我们在主机组名中使用逗号。\n\n要使用此文件，让我们创建一个名为 `test.csv` 的简单 CSV 文件：\n\n```\n\
  \"Host name\",\"Host DNS\",\"Host IP\",\"Host groups\",\"Templates\",\"port\"\n\"\
  test-xml-import\",\"dns.name\",\"1.2.3.4\",\"Linux servers%Zabbix servers\",\"Template\
  \ ICMP Ping\"\n```\n\n我们在这里使用了一个标题行，因为第一行总是被排除——如果文件中只有一行，将不会产生任何作用。现在，让我们运行脚本：\n\
  \n```\n$ ./csv_to_zabbix_xml.sh test.csv > zabbix_generated_hosts.xml\n```\n\n在前端中，导航到**配置\
  \ | 主机**，点击右上角的**导入**，在**导入文件**字段中选择 `zabbix_generated_hosts.xml` 文件，然后点击**导入**。导入应该会成功——返回**配置\
  \ | 主机**页面确认一下。由于该主机目前不是很有用，可以随意删除它。\n\n## 导入图片\n\n在配置网络地图时，我们有机会上传自己的图标。逐张上传大量图片效率非常低。我们可以使用诸如\
  \ `curl` 之类的工具编写脚本来完成该过程，但这需要为每张图片建立一个新的前端连接，并且如果未来版本的 Zabbix 界面发生变化，脚本可能会失效。不过，XML\
  \ 导入支持图片，我们也可以只使用一个包含图片的文件。我们可以为此编写自己的脚本，但 Zabbix 已经附带了一个脚本——在 `misc/images` 目录中查找\
  \ `png_to_xml.sh` 脚本。该脚本接受两个参数：图片所在的目录和输出文件名。例如，如果我们的图片位于名为 `map_icons` 的目录中，我们可以按如下方式运行该脚本：\n\
  \n```\n./png_to_xml.sh map_icons zabbix_images.xml\n```\n\n要导入图片，我们可以进入任意带有**导入**按钮的页面（例如**配置\
  \ | 地图**），点击**导入**按钮，并勾选**图片**行旁边的复选框。只有超级管理员才能导入图片。图片以 base64 格式导出和导入，因此 XML 文件中没有二进制数据。导出的图片示例是这样的：\n\
  \n```\n```xml\n<encodedImage>iVBORw0KGgoAAAANSUhEUgAAADAAAAAwCAYAAABXAvmHAAAABm\n\
  JLRQOA/wD/AP+gvaeTAAAM701EQVR42u2ZeXBV13HP+cub9NDSGIR\n...\n</encodedImage>\n```\n\
  ```\n\n此输出被大幅截断——真正的 base64 值会占据好几页篇幅。\n\n## Zabbix API 入门\n\n我们之前讨论的方法——直接编辑数据库和\
  \ XML 导入/导出——要么有风险，要么能力有限。编辑数据库是有风险的，因为几乎没有校验机制，而且升级到较新版本的 Zabbix 可能会改变数据库模式，从而使我们的工具和方法失效。XML\
  \ 导入/导出很不错，但非常有限——它不允许修改用户、网络发现规则、动作，以及 Zabbix 配置中的很多东西。\n\n这正是 Zabbix API 能够发挥作用的地方。它是基于\
  \ JSON 的 Zabbix 配置和数据接口。它提供的功能远比 XML 导入/导出要多，尽管仍有一些配置细节无法通过它来控制。\n\nZabbix API 目前是基于前端的：它由\
  \ PHP 实现。要使用它，我们需要连接到运行前端的 Web 服务器并发出请求。实现该目标的方法有很多，但在这里，我们将尝试以与语言无关的方式来进行——我们将使用\
  \ curl，并从 shell 发出请求。\n\n## 简单操作\n\nZabbix API 基于请求-响应模式。我们发送一个请求，然后得到一个响应——要么是请求的数据，要么是成功/失败指示。让我们看一些使用该\
  \ API 可以完成的简单实用示例。我们将使用简单的 curl 请求来访问 API。让我们在 Zabbix 服务器上尝试一下：\n\n```\n```bash\n\
  $ curl -s -X POST -H 'Content-Type: application/json-rpc' -d ''\nhttp://127.0.0.1/zabbix/api_jsonrpc.php\n\
  ```\n```\n\n在这个请求中，我们使用 POST 方法，并通过 -d 参数发送 JSON 字符串（目前为空）。我们还指定了 -s 参数，它启用静默或安静模式，并抑制进度和错误消息。URL\
  \ 是 Zabbix API 端点 api_jsonrpc.php。所有 API 请求都将使用相同的端点。此外，我们将内容类型指定为 application/json-rpc。这是必需的。如果省略，Zabbix\
  \ API 将返回一个空响应，这没有什么帮助。我们发出的请求应返回如下响应：\n\n```\n{\"jsonrpc\":\"2.0\",\"error\":{\"\
  code\":-32600,\"message\":\"Invalid Request.\",\"data\":\"JSON-rpc version is not\
  \ specified.\"},\"id\":null}\n```\n\n这没有成功，但至少有一个错误消息。现在让我们继续尝试更有效的请求。\n\n## 获取\
  \ API 版本\n\n我们能做到的最简单的事情之一就是向 API 查询 Zabbix 版本。这将返回前端版本，它被认为与 API 版本相同。除了登录请求本身之外，这是唯一不需要登录的请求。\n\
  \n为了更容易编辑和发出请求，让我们将 JSON 赋值给一个变量，然后在 curl 命令中使用该变量。\n\n![](img/f5313a804532fabacc8d07cc8607eeba_653_0.png)\n\
  \n> 或者，你可以将 JSON 字符串放入文件中，并使用 -d @file_name 将文件内容传给 curl。\n\n```\n$ json='{\"jsonrpc\"\
  :\"2.0\",\"method\":\"apiinfo.version\",\"id\":1}'\n```\n\n我们正在使用一个名为 apiinfo.version\
  \ 的方法。如何知道哪些方法可用以及它们的名称是什么？该信息可以在 Zabbix 手册中找到，我们稍后会探讨。现在让我们将这个请求发送到 API。API 响应没有尾部换行符，这可能会使它们难以阅读——让我们也在\
  \ curl 命令中添加一个换行符：\n\n```\n$ curl -s -w '\\n' -X POST -H 'Content-Type: application/json-rpc'\
  \ -d \"$json\" http://localhost/zabbix/api_jsonrpc.php\n```\n\n注意在 -d 参数的双引号中使用了\
  \ $json 变量，以及使用 -w 参数来添加换行。此命令应返回 API 版本：\n\n```\n{\"jsonrpc\":\"2.0\",\"result\"\
  :\"3.0.0\",\"id\":1}\n```\n\n这个实例的版本是 3.0.0。那么 jsonrpc 和 id 值呢？jsonrpc 值指定的是 JSON-RPC\
  \ 版本本身。Zabbix API 使用 2.0 版本，因此在所有请求和响应中它都是相同的。id 值是我们自己在请求中指定的，响应中具有相同的值。如果我们使用一个支持异步请求和响应的框架，这会很有用——这样我们就可以将响应与请求对应起来。JSON\
  \ 还支持批处理，即可以在单个连接中发送多个请求，并通过 ID 匹配响应，但该功能目前在 Zabbix 3.0 中不可用。\n\n## 登录\n\n在通过 API\
  \ 执行任何有用的操作之前，必须先登录。我们的 JSON 字符串如下所示：\n\n```\n$ json='{\"jsonrpc\":\"2.0\",\"method\"\
  :\"user.login\",\"id\":2,\"params\":{\"user\":\"Admin\",\"password\":\"zabbix\"\
  }}'\n```\n\n现在，运行我们用来获取 API 版本的同一个 curl 命令。在之后的所有 API 请求中，我们将只更改 json 变量，然后重用同一个\
  \ curl 命令。在这种情况下，假设用户名和密码正确，它应该返回以下内容：\n\n```\n{\"jsonrpc\":\"2.0\",\"result\":\"\
  df83119ab78bbeb2065049412309f9b4\",\"id\":2}\n```\n\n> 我们将请求 ID 增加到了 2。这其实并不是必须的——我们本可以使用\
  \ 3、5 或 1013。我们也可以再次使用 1——按照我们使用 API 的方式，所有请求的响应都非常明确，所以我们根本不关心 ID。不过，响应中确实还是带有与我们请求相同的\
  \ ID，即 2。\n\n此响应在 result 属性中还有一个字母数字字符串，这对于以后所有 API 工作都非常重要。这是一个身份验证令牌或会话 ID，我们必须在所有后续请求中提交它。对于我们的测试，只需复制该字符串，然后在后面的\
  \ json 变量中使用它。\n\n\n\n\n\n## 启用和禁用主机\n\n主机可以通过设置单个值来启用或禁用。让我们禁用我们的 IPMI 主机，并在稍后重新启用它。为此，我们需要主机\
  \ ID。通常，使用 API 时，我们会查询 API 本身以获取 ID。在本例中，让我们保持简单，并在主机属性中查找 ID——与之前的项目一样，打开主机属性并从\
  \ URL 中复制 hostid 参数的值。获得该数字后，让我们设置 JSON 变量：\n\n```\n$ json='{\"jsonrpc\":\"2.0\"\
  ,\"method\":\"host.update\",\"params\": {\"hostid\":\"10132\",\"status\":1},\"auth\"\
  :\"df83119ab78bbeb2065049412309f9b4\",\"id\":1}'\n```\n\n> 我们又回到了使用 ID 为 1 的情况。使用\
  \ curl 这样操作时，这真的无关紧要。\n\n运行 curl 命令：\n\n```\n{\"jsonrpc\":\"2.0\",\"result\":{\"\
  hostids\":[\"10132\"]},\"id\":1}\n```\n\n这应该表示成功，并且主机应被禁用——在前端检查主机状态。重新启用它也很简单：\n\
  \n```\n$ json='{\"jsonrpc\":\"2.0\",\"method\":\"host.update\",\"params\": {\"hostid\"\
  :\"10132\",\"status\":0},\"auth\":\"df83119ab78bbeb2065049412309f9b4\",\"id\":1}'\n\
  ```\n\n再次运行 curl 命令以重新启用此主机。\n\n## 创建主机\n\n现在让我们使用 API 创建主机。让我们设置 JSON 变量：\n\n```\n\
  $ json='{\"jsonrpc\":\"2.0\",\"method\":\"host.create\",\"params\":{\"host\":\"\
  API created host\",\"interfaces\":[{\"type\":1,\"main\":1,\"useip\":1,\"ip\":\"\
  127.0.0.2\",\"dns\":\"\",\"port\":\"10050\"}],\"groups\":[{\"groupid\":\"2\"}],\"\
  templates\":[{\"templateid\":\"10104\"}]},\"auth\":\"df83119ab78bbeb2065049412309f9b4\"\
  ,\"id\":1}'\n```\n\n在默认的 Zabbix 数据库中，组 ID 为 2 应对应 Linux 服务器组，而模板 ID 为 10104 应对应\
  \ Template ICMP Ping 模板。如果你的系统上的 ID 不同，请在此 JSON 字符串中更改它们。现在运行 curl 命令，主机应该成功创建：\n\
  \n```\n{\"jsonrpc\":\"2.0\",\"result\":{\"hostids\":[\"10148\"]},\"id\":1}\n```\n\
  \n## 获取历史记录和趋势\n\n我们迄今为止讨论的方法大多涉及配置。我们也可以查询一些历史数据。例如，要获取项目历史数据，我们需要知道以下几件事：\n\n\
  - **项目 ID**\n- 该项目的**信息类型**设置\n\n这两者都可以通过在配置部分打开项目属性来找到——ID 将在 URL 中，信息类型将在该下拉菜单中。为什么我们必须指定信息类型？不幸的是，Zabbix\
  \ API 不会为我们查找它，而是只在特定的表中查找值。默认情况下，会查询 history_uint（整数值）表。要获取 **A test host** 上的\
  \ CPU 负载项目的数值，JSON 字符串应如下所示：\n\n```\n$ json='{\"jsonrpc\":\"2.0\",\"method\":\"\
  history.get\",\"params\":{\"history\":0,\"itemids\":\"23668\",\"limit\":3},\"auth\"\
  :\"df83119ab78bbeb2065049412309f9b4\",\"id\":1}'\n```\n\n> 请记住为此查询替换 auth 和 itemid。\n\
  \n这里有几个额外的参数值得讨论：\n\n- `history` 参数告诉 API 查询哪个表。使用 0 时查询 `history` 表。使用 1 时查询 `history_str`\
  \ 表。使用 2 时查询 `history_log` 表。使用 3 时查询 `history_int` 表（这是默认值）。使用 4 时查询 `history_text`\
  \ 表。我们必须手动将此值与项目属性中的设置匹配。\n- `limit` 参数限制返回的条目数。在这里非常有用，因为一个项目可能有大量值。顺便说一下，`limit`\
  \ 也支持所有其他方法——我们可以限制检索主机、项目和所有其他实体时的条目数。\n\n现在，运行 curl 命令：\n\n```\n{\"jsonrpc\":\"\
  2.0\",\"result\":[{\"itemid\":\"23668\",\"clock\":\"1430988898\",\"value\":\"0.0000\"\
  ,\"ns\":\"215287328\"},{\"itemid\":\"23668\",\"clock\":\"1430988928\",\"value\"\
  :\"0.0000\",\"ns\":\"229668635\"}],\"id\":1}\n```\n\n我们得到了三个值，但输出有点难以阅读。有很多方法可以格式化\
  \ JSON 字符串，但在 shell 中，最简单的方法是使用 Perl 或 Python 命令。重新运行 curl 命令并附加到它 | json_pp：\n\n\
  ```\n$ curl ... | json_pp\n```\n\n> 你可能还拥有 json_xs，它性能更好，但目前对我们来说性能完全不是问题。\n\n这将调用\
  \ Perl JSON 工具，其中 pp 代表 pure Perl，输出会更易读：\n\n```\n{\n  \"jsonrpc\" : \"2.0\",\n\
  \  \"id\" : 1,\n  \"result\" : [\n    {\n      \"clock\" : \"1430988898\",\n   \
  \   \"itemid\" : \"23668\",\n      \"value\" : \"0.0000\",\n      \"ns\" : \"215287328\"\
  \n    },\n    {\n      \"ns\" : \"221534597\",\n      \"value\" : \"0.0000\",\n\
  \      \"itemid\" : \"23668\",\n      \"clock\" : \"1430988928\"\n    },\n    {\n\
  \      \"value\" : \"0.0000\",\n      \"ns\" : \"229668635\",\n      \"clock\" :\
  \ \"1430988958\",\n      \"itemid\" : \"23668\"\n    }\n  ]\n}\n```\n\n> 注意输出其实并没有排序。JSON\
  \ 数据的顺序无关紧要，因此工具通常不会对输出进行排序。\n\n或者，使用 `python -mjson.tool`，这将调用 Python 的 JSON 工具模块。输入会稍微多一点。\n\
  \n在 `history.get` 方法的输出中，每个值都附带项目 ID、UNIX 时间戳和纳秒信息，与我们之前查看的历史表相同。这并不奇怪，因为 API 输出来自这些表。如果我们通过运行\
  \ `date -d@<UNIX timestamp>` 将这些值转换为人类可读格式，如前所述，我们会发现它们并不新鲜——实际上，它们是最旧的值。我们可以通过添加\
  \ `sortfield` 和 `sortorder` 参数来获取最新值：\n\n```\n$ json='{\"jsonrpc\":\"2.0\",\"method\"\
  :\"history.get\",\"params\":{\"history\":0,\"itemids\":\"23668\",\"limit\":3,\"\
  sortfield\":\"clock\",\"sortorder\":\"DESC\"},\"auth\":\"df83119ab78bbeb2065049412309f9b4\"\
  ,\"id\":1}'\n```\n\n这些将按 clock 值以降序排序输出，然后获取三个最新值——检查返回的 Unix 时间戳以确认。如果有多个值具有相同的\
  \ clock 值，其他字段将不会用于二级排序。\n\n我们还可以检索趋势数据——这是 Zabbix 3.0 中的一项新功能：\n\n```\n$ json='{\"\
  jsonrpc\":\"2.0\",\"method\":\"trend.get\",\"params\":{\"itemids\":\"23668\",\"\
  limit\":3},\"auth\":\"df83119ab78bbeb2065049412309f9b4\",\"id\":1}'\n```\n\n> Zabbix\
  \ API 不允许提交历史数据——所有项目值都必须通过 `zabbix_sender` 实用程序通过 Zabbix 服务器，这在 *第 11 章 高级项目监控*\
  \ 中讨论过。有传言称 API 可能会移至服务器端，这可能会允许在主 API 中合并数据提交。\n\n## Zabbix API 的问题\n\nZabbix API\
  \ 非常出色，但有一些问题值得了解：\n\n- **审计：** 许多 Zabbix API 操作未在 Zabbix 审计日志中注册，该日志可通过 **Administration\
  \ | Audit** 访问。这使得很难查明谁在何时进行了特定更改。\n- **验证：** 不幸的是，API 验证还有很多不足。例如，使用 API，可以将主机更改为代理或反之，甚至可以将\
  \ `host status` 值设置为完全错误的数值，使该主机从前端消失，尽管无法创建同名的新主机。请非常、非常小心发送不正确的数据到 Zabbix API。它可能会抱怨该数据，也可能只是静默接受并做出一些愚蠢的更改。\n\
  - **错误消息：** 同样，即使在验证输入数据时，错误消息也不总是那么有帮助。有时它们会准确告诉你出了什么问题，但你也可能对长 JSON 输入字符串收到 `incorrect\
  \ parameters`。\n- **性能：** Zabbix API 的性能对于某些操作来说可能极差。例如，修改链接到大量主机的模板的项目或将许多主机链接到模板可能无法执行。虽然其中一些操作可以拆分，例如一次将模板链接到几百个主机，但在某些情况下，可能不得不退回到执行直接\
  \ SQL 查询。\n- **缺少功能：** 尽管 Zabbix API 允许我们控制大部分 Zabbix 配置，但仍有一些缺失的区域。到目前为止，这主要涉及\
  \ **Administration | General** 部分中的内容。一旦实现此类功能，Zabbix 前端最终就可以停止执行直接数据库查询，并且 API\
  \ 将允许在不诉诸直接数据库访问的情况下编写自定义前端。\n\n## 使用 API 库\n\n虽然我们查看了低级 API 示例，但你不太可能使用 shell 脚本来处理\
  \ Zabbix API。即使使用额外工具，shell 也不是处理 JSON 数据的理想选择，因此另一种编程或脚本语言可能是更好的选择。对于许多这些语言，无需实现完整的原始\
  \ JSON 处理，因为有库可用。截至撰写本文时，可用库的列表维护在 http://zabbix.org/wiki/Docs/api/libraries。或者，只需访问\
  \ http://zabbix.org 并查找 **Zabbix API libraries** 链接。\n\n所有这些库都是社区提供的。没有质量保证，任何错误都应报告给库维护者，而不是\
  \ Zabbix。\n\n例如，一个名为 `Zabbix::Tiny` 的 Perl 库旨在成为 Zabbix API 的非常简单的抽象层，解决身份验证和请求\
  \ ID 问题以及使用 API 时的其他重复任务。它可以从 **Comprehensive Perl Archive Network (CPAN)** 轻松安装：\n\
  \n```\n# cpan Zabbix::Tiny\n```\n\n\n\n\n要创建新用户，我们会将以下内容保存到文件中：\n\n```\nuse strict;\n\
  use warnings;\nuse Zabbix::Tiny;\nmy $zabbix = Zabbix::Tiny->new(\n    server =>\
  \ http://localhost/zabbix/api_jsonrpc.php,\n    password => 'zabbix',\n    user\
  \ => 'Admin',\n);\n$zabbix->do(\n    'user.create',\n    alias    => 'new_user',\n\
  \    passwd => 'secure_password',\n    usrgrps => [ '13' ],\n    name => 'New',\n\
  \    surname => 'User',\n    type => 3,\n);\n```\n\n这将创建一个新用户。大多数参数不言自明，其中类型参数告诉\
  \ API 该用户是普通用户、管理员还是超级管理员。值为 3 表示超级管理员用户类型。组 ID 被硬编码为 13——这是需要自定义的地方。如果我们把这个文件保存为\
  \ `zabbix_tiny-add_user.pl`，可以这样调用它：\n\n```\n$ perl zabbix_tiny-add_user.pl\n```\n\
  \n虽然这看起来可能比我们原始的 JSON 字符串更长，但它还处理了登录，并且比原始 JSON 更容易编写。关于这个特定 Zabbix API 库的更多信息，请参阅\
  \ http://zabbix.org/wiki/Docs/howto/Perl_Zabbix::Tiny_API。\n\n有很多针对不同语言的 Zabbix\
  \ API 库——仅 Python 在撰写本文时就有七个不同的库。要选出最好的一个可能有点挑战性。\n\n如果你不喜欢围绕库进行编程，还有一个基于 Python\
  \ 的项目，用于创建 API 操作的命令行工具，名为 **Zabbix Gnomes**。可以在 https://github.com/q1x/zabbix-gnomes\
  \ 找到它。\n\n## 延伸阅读\n\n本章只介绍了 Zabbix API 的一小部分；还有很多很多内容。如果你想使用它，请查阅官方 Zabbix 手册，以了解所有方法、它们的参数和对象属性。在撰写本文时，Zabbix\
  \ API 手册可以在 `https://www.zabbix.com/documentation/3.0/manual/api` 找到——但即使它变了，只需访问\
  \ `https://www.zabbix.com`，查找文档即可。\n\n## 总结\n\n在本章中，我们深入探讨了 Zabbix 使用的内部数据结构。虽然这只是大量数据库、XML\
  \ 导入/导出、API 和其他信息中的一小部分，但它应该有助于解决用户最初遇到的一些常见问题。\n\n我们弄清楚了如何从前端获取原始数据，这是小型数据集最简单的方法。对于更多数据，我们学会了根据数据类型从不同的历史表获取数据。我们还了解了\
  \ Zabbix 代理如何将数据保存在本地数据库中。对于需要较低精度的情况，我们学习了趋势表以及存储在那里的每小时最小值、最大值和平均值的计算。我们还介绍了直接在数据库中重置用户密码，以及在监控项配置最初不正确时修复监控项历史值。\n\
  \n我们探索了 Zabbix 的 XML 导入/导出功能，它允许我们添加和部分更新主机、模板、网络地图、聚合图形、主机组、图片和值映射。我们简要了解了 XML\
  \ 格式，并创建了一个简单的脚本，用于从 CSV 文件生成主机。\n\n最后，我们了解了 Zabbix API，它允许我们控制几乎所有的 Zabbix 配置。我们登录、控制主机状态、添加和删除主机、创建值映射并检索一些历史监控项值，并使用\
  \ `json_pp` 工具对输出进行了一些格式化。尽管 API 非常棒，但我们也讨论了它的各种问题，包括缺乏审计、适当的验证和错误消息。虽然这里只能介绍 Zabbix\
  \ API 的一小部分，但我们知道了如何在 Zabbix 手册中查找更多信息，并通过使用 Perl 库提升了 API 的使用。我们还在 `http://zabbix.org/wiki/Docs/api/libraries`\
  \ 发现了各种语言的 API 库列表。\n\n我们将在下一章继续深入探讨 Zabbix。将涵盖各种与维护相关的主题，包括通过内部监控来了解缓存使用情况和进程繁忙率、备份\
  \ Zabbix 配置，以及在新版本发布时升级 Zabbix。我们还将探讨守护进程配置文件中的所有参数。\n\n## 22\n\n## Zabbix 维护\n\n\
  当 Zabbix 平稳运行时，一切都很棒——我们能获得所有数据、漂亮的图形和告警。为了让它保持这种状态，我们应该关注 Zabbix 自身的健康状况，准备好从灾难性事件中恢复，并时不时升级到最新版本。在本章中，我们将涵盖以下主题：\n\
  \n- **监控 Zabbix 内部**：缓存、繁忙率、性能监控项以及其他能反映 Zabbix 运行状况的数据\n- **进行备份**：关于如何执行备份和潜在恢复策略的建议\n\
  - **升级 Zabbix**：如何了解新版本会带来哪些变化，不同版本中哪些组件相互兼容，以及如何执行升级本身\n\n我们还将回顾有关 Zabbix 设置以降低性能问题的一般性建议，并查看审计日志——这是一种查看谁在何时对\
  \ Zabbix 配置进行了更改的方法，尽管此功能存在一些问题，我们一定会找出这些问题。在本章末尾，我们将查看服务器、代理和 agent 配置文件中的所有配置参数，重点关注到目前为止尚未讨论过的参数。\n\
  \n## 内部监控\n\nZabbix 可以监控其他系统的许多方面，但我们对 Zabbix 自身了解多少呢？我们可以立即在 Zabbix 前端看到一些基本指标。在前端中，转到\
  \ **报表 | Zabbix 状态**。在这里，我们可以观察到高级信息，例如 Zabbix 服务器是否正在运行，以及诸如主机、监控项、触发器和在线用户数量等值。\n\
  \n此信息在仪表板中也以小部件的形式可见。该小部件和报表都仅对超级管理员用户可用。\n\n让我们看一下 **所需服务器性能，每秒新值** 旁边的值。这是确定 Zabbix\
  \ 安装规模时的主要值：\n\n| Zabbix 状态 |\n|---|---|\n| 参数 | 值 | 详细信息 |\n| Zabbix 服务器正在运行 |\
  \ 是 | localhost:10051 |\n| 主机数量（启用/停用/模板） | 59 | 16 / 2 / 41 |\n| 监控项数量（启用/停用/不支持）\
  \ | 318 | 250 / 1 / 67 |\n| 触发器数量（启用/停用 [问题/正常]） | 36 | 36 / 0 [13 / 23] |\n| 用户数量（在线）\
  \ | 4 | 2 |\n| 所需服务器性能，每秒新值 | 8.1 |  |\n\n## 每秒新值\n\n为什么“每秒新值”设置如此重要？虽然了解一个系统有多少台主机甚至多少个监控项很重要，但底层负载可能差异很大。例如，我们可能有一个系统包含\
  \ 1,000 台主机，每台 100 个监控项，但这些监控项每 15 分钟轮询一次。在这种情况下，近似预期的 **每秒新值 (NVPS)** 将是 111。或者我们可能只有\
  \ 10 台主机，每台 100 个监控项，但如果间隔是 10 秒（这是一个非常低的间隔；如果可能，永远不要使用这么低的间隔），则总预期 NVPS 将是 100。正如我们所见，主机和监控项数量有影响，平均间隔也有影响。NVPS\
  \ 是一个通用值，可以更容易地与其他系统进行比较。在我们的安装中，基于当前的主机和监控项配置，预期 NVPS 可能在 7 到 9 之间。这意味着每秒，Zabbix\
  \ 服务器预计会接收并处理这么多历史值——这还包括计算任何触发器表达式、计算数值监控项的趋势信息，以及将任何生成的事件和这些历史值存储到数据库中。每个值都涉及大量看似无形的工作。\n\
  \n我们可以在 Zabbix 状态报告中看到当前配置的值，但是如何在不添加所有主机和监控项的情况下，为我们正在构建的更大系统计算预期 NVPS 呢？如果我们在单个主机上有\
  \ 60 个监控项，每个监控项每分钟轮询一次，则 NVPS 可以这样计算：\n\n```\n<item count> / <item interval>\n```\n\
  \n\n\n因此，每分钟 60 个监控项将产生 1 NVPS。顺便说一句，每分钟一个监控项就是 1/60，即 0.01557。要获得预计环境中的总 NVPS，我们只需将其乘以主机数量：\n\
  \n```\n<average item count per host> / <average item interval> * <total host count>\n\
  ```\n\n代入不同的值，看看当其中一个值改变时，预期 NVPS 如何变化。你拥有的主机越多，平均间隔和每台主机的平均监控项数量的影响就越大。\n\n前端提供给我们的值是确定当前预期\
  \ NVPS 的好方法，但不太容易看出它如何随时间变化以及配置更改如何影响它。我们可以添加一个内部监控项来存储该值，以便我们能够看到长期变化并将其绘制成图表。导航到“配置\
  \ | 主机”，点击“A test host”的“监控项”，然后点击“创建监控项”按钮。在此表单中，首先点击“键”字段旁边的“选择”，并在监控项助手中将“类型”下拉框更改为“Zabbix\
  \ 内部”。这会给我们呈现一个可用的内部监控项列表。我们将设置其中几个，但不会讨论里面的每一个监控项。如果你在我们结束这个主题后对某些监控项感到好奇，请查阅 Zabbix\
  \ 手册，了解每个内部监控项的详细信息。还记得我们如何创建一个监控项来监视代理上次联系服务器的时间吗？那也是一个内部监控项。\n\n在此列表中，点击 `zabbix[requiredperformance]`。填写以下内容：\n\
  \n- **名称：** Expected NVPS\n- **类型：** Zabbix 内部\n- **信息类型：** 数值（浮点）\n- **单位：** NVPS\n\
  - **新建应用：** Zabbix performance\n\n完成后，点击底部的“添加”按钮。在“最新数据”页面检查此监控项。不久之后，它应该会有值，与我们在\
  \ Zabbix 状态报告中看到的有些相似：\n\n| Zabbix performance（1 个监控项） |\n| Expected NVPS | 2015-12-09\
  \ 11:36:46  8.13 NVPS |\n\n这个值很可能与我们在报告中看到的不同。我们刚刚添加了一个监控项来监视预期 NVPS，它本身也提供值，因此这一操作已经影响了\
  \ NVPS。\n\n配置好这个监控项后，我们谈谈它到底是什么。你可能已经注意到之前多次强调这是预期 NVPS。它基于我们的主机和监控项配置，并不实际反映我们正在接收多少值。如果我们的所有监控项都是主动代理类型，并且所有代理都已停止，即使我们完全收不到任何信息，预期\
  \ NVPS 也不会改变。撇开这类技术问题不谈，这个数字也可能因其他原因与我们正常处理的值不同。日志监控项始终按其间隔进行计数。如果我们有一个间隔为 1 秒的日志监控项，即使日志文件本身没有值——或者每秒接收\
  \ 10 个值——它也被计为 1 NVPS。灵活间隔和监控项调度会被忽略，而 trapper 监控项完全不包括在预期 NVPS 估算中。如果我们向 trapper\
  \ 监控项发送大量值，我们实际处理的 NVPS 将高于预期 NVPS，有时甚至高出数倍。\n\n由于预期或估算的 NVPS 可能不准确，我们也有办法计算出真实的\
  \ NVPS 值——还有另一个内部监控项可用于此目的。让我们回到“配置 | 主机”，然后再次点击“A test host”的“监控项”，并点击“创建监控项”。填写以下值：\n\
  \n- **名称：** Real NVPS\n- **类型：** Zabbix 内部\n- **键：** `zabbix[wcache,values]`\n-\
  \ **信息类型：** 数值（浮点）\n- **单位：** NVPS\n- **存储值：** Delta（每秒速度）\n- **应用：** Zabbix performance\n\
  \n完成后，点击底部的“添加”按钮。在键中，我们使用了关键字 wcache 和 values。第一个关键字代表写缓存（write cache），或者我们可以将其视为要写入数据库的值的缓存。values\
  \ 参数让它报告通过该缓存的值数量。稍后我们将了解其他可能的参数。\n\n> 我们还可以通过将第三个参数指定为 float、uint、str、log 或 text\
  \ 来获得每种类型已处理值的数量。第三个参数默认为 all，报告所有值类型。\n\n另一件值得注意的事情是 **存储值** ——这个内部监控项报告所有值的计数器，这样我们就能得到每秒的值的数量。我们既获得了一个容易与预期\
  \ NVPS 比较的值，又避免了山形图。人们如何知道哪些内部监控项返回最终值，哪些是计数器监控项？像往常一样，查阅 Zabbix 手册。\n\n监控项配置好后，让我们在“最新数据”页面比较预期值和实际值：\n\
  \n| Zabbix performance（2 个监控项） |\n| Expected NVPS | 2015-12-09 13:17:46  8.17 NVPS\
  \ |\n| Real NVPS | 2015-12-09 13:17:47  1.29 NVPS |\n\n注意添加另一个监控项后，预期 NVPS 值如何再次增加。\n\
  \n在这个系统上，部分监控基础设施已关闭，因此实际 NVPS 值明显低于预期值。你可能希望勾选这两个监控项旁边的复选框，并显示一个临时图表，以直观地比较这些值并查看它们如何随时间变化。预期\
  \ NVPS 很可能相当稳定，只有在配置更改时才会改变。实际 NVPS 则会随着值的检索和处理随时间变化而上下波动。\n\n## Zabbix 服务器运行时间\n\
  \n让我们尝试监控另一个 Zabbix 内部监控项。转到 **配置 | 主机**，点击 **A test host** 旁边的 **监控项**，然后点击 **创建监控项**。让我们监控\
  \ Zabbix 服务器的运行时间——不是整个系统，而是 Zabbix 服务器守护进程。填写以下值：\n\n- **名称：** `Zabbix server uptime`\n\
  - **类型：** **Zabbix 内部**\n- **键：** `zabbix[uptime]`\n- **单位：** `uptime`\n\n完成后，点击底部的\
  \ **添加**，然后在 **最新数据** 页面检查此监控项。请注意，我们使用 `uptime` 单位后，原始运行时间值（以秒为单位）被转换为人类可读的格式，显示\
  \ Zabbix 服务器进程已经运行了多长时间：\n\n| 名称 | 最后检查 | 最后值 |\n|---|---|---|\n| - 其他 -（1 个监控项）\
  \ |  |  |\n| Zabbix server uptime | 2015-12-09 20:04:49 | 00:34:27 |\n\n我们可以将此监控项显示在展示屏上，并为其设置一个触发器，以便在\
  \ Zabbix 服务器重启时通知我们。\n\n## 缓存使用\n\n我们已经讨论了 Zabbix 中的几个缓存及其用途。随着这些缓存被填满，它们可能会对 Zabbix\
  \ 产生不同的影响。让我们看看如何监控其中一些缓存的空闲或使用量。我们可以监控我们了解到的第一个缓存的空闲空间：配置缓存。让我们转到 **配置 | 主机**，然后点击\
  \ **A test host** 旁边的 **监控项**，并点击 **创建监控项**。填写以下值：\n\n- **名称：** `Zabbix configuration\
  \ cache, % free`\n- **类型：** **Zabbix 内部**\n- **键：** `zabbix[rcache,buffer,pfree]`\n\
  - **信息类型：** **数值（浮点）**\n- **单位：** `%`\n\n完成后，点击底部的 **添加** 按钮。对于此监控项键，我们使用了 `rcache`\
  \ 关键字，它代表 **读缓存**。与 `buffer` 结合使用时，它指的是配置缓存。使用 `pfree`，我们请求此缓存的空闲空间百分比。请注意，我们将 **信息类型**\
  \ 设置为 **数值（浮点）** ——我们本可以将其保留为 **数值（无符号）**，那样的话，Zabbix 会截断小数部分，但本场景下不建议这样做。在 **最新数据**\
  \ 页面检查此监控项：\n\n| 名称 | 最后检查 | 最后值 |\n|---|---|---|\n| - 其他 -（1 个监控项） |  |  |\n| Zabbix\
  \ configuration cache, % free | 2015-12-09 20:45:20 | 95.92 % |\n\n在我们的系统上，使用默认设置时，空闲配置缓存大小降至\
  \ 90% 以下的可能性极小。\n\n服务器上还有其他我们可以监控的内部缓存。稍后当我们查看守护进程配置参数时，会更详细地讨论它们包含的内容和建议的大小，但现在让我们先快速列一下：\n\
  \n- **配置缓存**：我们已经监控了它。它保存主机、监控项、触发器和其他配置信息\n- **值缓存**：它保存历史值以加速触发器、计算监控项、聚合监控项和其他操作\n\
  - **VMware 缓存**：它保存相当原始的 VMware 数据\n- **历史缓存和历史缓存索引**：这两个在历史值被处理用于触发器并写入数据库之前保存它们\n\
  - **趋势缓存**：它保存当前小时内所有正在接收值的监控项的趋势信息\n\n> 监控所有这些参数是一个非常非常好的主意。\n\n请注意，大多数缓存也可以针对\
  \ Zabbix 代理进行监控。具体做法是，将带有这些监控项的主机分配给特定的 Zabbix 代理进行监控。此时，这些内部监控项将返回有关该代理的信息。只有相关的监控项才会起作用——例如，监控代理上的趋势缓存是不可能的，因为代理上根本没有趋势缓存。将此类主机分配给代理的相同方法也适用于内部进程繁忙率下的监控项，我们接下来将讨论这些监控项。\n\
  \n## 内部进程繁忙率\n\nZabbix 内部有一堆进程，我们已经介绍了一些——我们启用了 IPMI 和 VMware 轮询器以及 SNMP trapper。对于其中几个进程，我们还可以配置要启动的进程数量。我们如何知道一个进程是否足够，或者也许我们应该有一百个进程？稍后我们将讨论每种类型的一般准则，但非常重要的一点是要知道当前运行的进程有多繁忙。也有用于此目的的内部监控项。对于这些监控项，一般语法如下：\n\
  \n```\nzabbix[process,<type>,<mode>,<state>]\n```\n\n\n\n\n\n这里，`process` 是一个固定关键字。第二个参数\
  \ `type` 是进程类型，如 poller、trapper 等。第三个参数 `mode` 可以是以下之一：\n\n- avg：指定类型所有进程的平均速率。\n\
  - count：指定类型进程的数量。\n- max：指定类型进程的最大速率。\n- min：指定类型进程的最小速率。\n- 一个数字：指定类型单个进程的速率。例如，默认情况下运行着五个\
  \ poller。通过在此处指定进程编号，我们可以监控 poller 1 或 poller 3。请注意，这是指内部进程编号，而不是系统 PID。\n\n我们在这里谈论速率——这是目标进程或进程花费在某种状态上的时间，由第四个参数指定。它可以是\
  \ busy 或 idle。\n\n我们应该监控 busy 速率还是 idle 速率？在大多数情况下，会监控特定类型所有进程的平均 busy 时间。为什么是 busy？只是按惯例，当此监控被实现时，第一个模板监控的就是\
  \ busy 速率。此外，在调试特定问题时，监控单个进程的 busy 速率可能会有所帮助。不幸的是，无法直接从服务器查询此类值——我们必须在前端添加一个 item，然后等待它开始工作。没有内置的\
  \ LLD 用于进程类型或其数量——我们必须手动创建此类 item 或使用 XML 导入或 Zabbix API 来自动化。\n\n为了了解其工作原理，让我们监控所有\
  \ poller 进程的平均 busy 速率。前往 Configuration | Hosts，点击 A test host 旁边的 Items，然后点击 Create\
  \ item。填写以下值：\n\n- **Name:** `Zabbix $4 process $2 rate`\n- **Type:** Zabbix internal\n\
  - **Key:** `zabbix[process,poller,avg,busy]`\n- **Type of information:** Numeric\
  \ (float)\n- **Units:** %\n- **New application:** `Zabbix process busy rates`\n\n\
  > 在通过 Zabbix proxy 监控的主机上创建此类 item 将报告该 proxy 的数据，而不是 Zabbix 服务器的数据。\n\n我们再次在 item\
  \ 名称中使用了位置变量——如果我们想监控另一个进程，只需克隆此 item 并仅更改 item key 中的进程名称即可。\n\n完成后，点击底部的 **Add**\
  \ 按钮。在 **Latest data** 页面检查此 item：\n\n| NAME | LAST CHECK | LAST VALUE |\n|---|---|---|\n\
  | **Zabbix process busy rates** (1 Item) |  |  |\n| Zabbix busy process poller rate\
  \ | 2015-12-11 08:52:51 | 0.69 % |\n\n很可能，我们的小型 Zabbix 实例在轮询值时并不繁忙。默认情况下，启动了 5 个\
  \ poller，它们在处理当前负载时没有任何问题。\n\n作为练习，监控更多进程类型——也许是 trapper 和 unreachable pollers。查阅\
  \ Zabbix 手册中关于内部 item 的部分，以了解在此 item 中应使用的确切进程名称。\n\n添加几个 item 后，你可能会发现内部进程有很多。我们讨论过使用\
  \ XML 导入或 API 自动创建此类 item，但随后还有我们可以并且应该监控的所有缓存。Zabbix 在这里提供了一些帮助，并附带了默认的内部监控模板。在右上角的搜索框中输入\
  \ `app zabbix` 并按 *Enter* 键。查看 **Templates** 块：\n\n**Templates**\n\n| TEMPLATE |\
  \ APPLICATIONS | ITEMS | TRIGGERS | GRAPHS | SCREENS | DISCOVERY | WEB |\n|---|---|---|---|---|---|---|---|\n\
  | Template App Zabbix Agent | Applications 1 | Items 3 | Triggers 3 | Graphs | Screens\
  \ | Discovery | Web |\n| Template App Zabbix Proxy | Applications 1 | Items 21 |\
  \ Triggers 19 | Graphs 4 | Screens 1 | Discovery | Web |\n| Template App Zabbix\
  \ Server | Applications 1 | Items 30 | Triggers 26 | Graphs 5 | Screens 1 | Discovery\
  \ | Web |\n\nDisplaying 3 of 3 found\n\n虽然 agent 模板相当简单，目前不怎么有趣，但 server 和 proxy\
  \ 模板涵盖了很多内容，分别有 31 和 21 个 item。这些模板将允许开箱即用地监控内部进程 busy 速率、缓存使用、队列、处理的值以及其他一些内容。强烈建议在所有\
  \ Zabbix 安装中使用这些模板。\n\n这些模板可能仍然缺少一些有趣的 item，例如我们之前创建的 expected NVPS item。建议创建一个单独的模板来包含此类缺失内容，而不是修改默认模板。这种方法将允许更轻松地升级，因为新版本可能会添加更多进程、缓存，并对默认模板进行其他改进。如果我们保持默认模板不变，我们可以导入新的\
  \ XML 文件，告诉 Zabbix 添加所有缺失内容、更新现有内容，并删除 XML 中不存在的内容，我们就会拥有最新的默认模板。如果我们对其进行了修改……更新它可能需要大量手动工作。\n\
  \n## Unsupported items and more problems\n\n我们现在对 Zabbix 的内部监控有了相当多的了解，但仍有更多可能性。Unsupported\
  \ items 不好用，所以让我们讨论一下我们可以监控它们情况的方法。\n\n### Counting unsupported items\n\n与缓存使用和进程\
  \ busy 速率类似，我们也可以使用内部 item 监控 unsupported item 的数量。要创建此类 item，让我们前往 Configuration\
  \ | Hosts，点击 A test host 旁边的 Items，然后点击 Create item。填写以下值：\n\n- **Name:** Amount\
  \ of unsupported items\n- **Type:** Zabbix internal\n- **Key:** zabbix[items_unsupported]\n\
  \n完成后，点击底部的 Add 按钮。过一会儿，在 Latest data 页面检查此 item：\n\nAmount of unsupported items\
  \ 2015-12-11 17:02:52 58\n\n58？对于这样一个小型安装来说，这是一个极高的值，尽管在这种情况下这是由 VMware 监控宕机引起的。此时，VMware\
  \ 超时会导致所有 VMware item 变得 unsupported。在完美的环境中，不会有 unsupported item，因此我们可以创建一个触发器，当此\
  \ item 的值大于 0 时提醒我们。然而，这在除了非常小的环境之外的任何地方都不会太有用——通常，这里或那里会出现问题，unsupported item 计数永远不会为\
  \ 0。因此，更有用的触发器将是关于 unsupported item 数量大幅增加的警报。change() 触发器函数可以帮助做到这一点：\n\n```\n\
  {A test host:zabbix[items_unsupported].change()} >5\n```\n\n每当 unsupported item\
  \ 计数在 30 秒内增加超过 5 时，即默认的 item 间隔，此触发器就会触发。阈值应根据特定环境进行调整以获得最佳效果。\n\n这种全局警报将很有用，但在更大、职责更分散的环境中，我们可能只想提醒负责方。一种方法是按主机监控\
  \ unsupported item 计数。对于此 item，最有意义的做法可能是将其创建在某个基础模板中，以便将其应用于需要它的所有主机。让我们创建这样一个\
  \ item：导航到 **Configuration | Templates**，点击 **C_Template_Linux** 旁边的 **Items**，然后点击\
  \ **Create item**。填写以下值：\n\n- **Name:** `Unsupported item count`\n- **Type:** **Zabbix\
  \ internal**\n- **Key:** `zabbix[host,,items_unsupported]`\n\n完成后，点击底部的 **Add**\
  \ 按钮。在 **Latest data** 页面检查此 item：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_673_0.png)\n\
  \n显然，在此安装中，测试主机有两个 unsupported item。我们现在将在同一模板上创建一个触发器，当主机有非零的 unsupported item\
  \ 计数时发出警报。这种组合效果相当不错，尽管在大型安装中，如果模板中的 item 配置错误或分发了损坏的 userparameter 脚本，可能会导致大量触发器触发。不幸的是，没有内置的\
  \ item 来确定按主机组划分的 unsupported item 计数。一个变通方法是在 *第 11 章 高级 Item 监控* 中讨论的 aggregate\
  \ item。例如，要获取名为 **Linux servers** 的组的 unsupported item 计数，aggregate item key 可能是这样的：\n\
  \n```\ngrpsum[Linux servers,\"zabbix[host,,items_unsupported]\",last]\n```\n\n我们应该避免为单个主机创建\
  \ unsupported item 计数触发器，而应为 aggregate item 创建触发器。虽然单个 item 会继续收集数据，这会给 Zabbix 服务器带来一些负载并增加数据库大小，但至少警报数量会是合理的。\n\
  \n\n\n\n\n> 如果某个监控项变为不支持状态，所有引用它的触发器都会停止工作，即使它们使用 `nodata()` 函数查找缺失数据也是如此。这使得很难就此类问题向某人发出告警，除非使用了像这样的内部监控项——它本身极不可能变为不支持状态。\n\
  \n还有其他内部监控项。建议在在线手册中查看最新版本 Zabbix 的完整可用监控项列表。\n\n## 审查不支持的监控项\n\n那些告诉我们整个 Zabbix\
  \ 安装或特定主机上不支持监控项数量的监控项非常有用，能让我们知道何时出了问题。但究竟哪里出了问题？在前端有一个非常简单的方法可以审查不支持监控项列表。导航到**配置\
  \ | 主机**，点击任意**监控项**链接，然后展开监控项过滤器。清除其中的任何主机、主机组或其他过滤选项，然后查看过滤器的右侧。在**状态**下拉框中选择**不支持**，然后点击**过滤**。这将显示该\
  \ Zabbix 实例中所有不支持的监控项。请注意，我们可能无法像这样显示所有状态下的所有监控项——过滤器要求至少设置一个条件，而状态条件也算作一个条件。\n\n\
  强烈建议时常查看此视图，并尽可能修复更多不支持的监控项。不支持的监控项是有害的。请注意，默认情况下最多显示 1,000 条记录。如果你有超过 1,000 个不支持的监控项，那就相当糟糕了，应该加以修复。\n\
  \n> 如果你在模板中看到不支持的监控项，这很可能是从旧版本升级而来的 Zabbix 实例。监控项状态异常是旧版本 Zabbix 中的一个 Bug。要解决此问题，需要在数据库中手动更改这些监控项的状态。查找监控项\
  \ ID，并将其**状态**值设为 0。和往常一样，直接更新数据库时要非常小心。\n\n## 内部事件和未知触发器\n\n我们刚才讨论过的针对不支持监控项的告警可能是最佳方法，因为它允许我们使用少数触发器，并以相对简单的方式拆分关于这些监控项的告警。还有另一种内置方法，可以针对不支持的监控项和处于未知状态的触发器发出告警——Zabbix\
  \ 具有内部事件的概念。要基于这些内部事件配置告警，请转到“配置 | 动作”，在“事件源”下拉框中选择“内部”，然后点击“创建动作”。在“动作”选项卡中，勾选“恢复消息”复选框，并输入以下值：\n\
  \n- **名称**：触发器状态变为未知\n- **默认主题**：{TRIGGER.STATE}: {TRIGGER.NAME}\n- **恢复主题**：{TRIGGER.STATE}:\
  \ {TRIGGER.NAME}\n\n切换到“条件”选项卡；在“新条件”块中，在第一个下拉框中选择“事件类型”，并在最后一个下拉框中选择“触发器处于‘未知’状态”：\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_675_0.png)\n\n点击“新条件”块中的小“添加”链接，然后切换到“操作”选项卡。点击“动作操作”块中的“新建”，然后点击“发送给用户”部分中的“新建”。\n\
  \n> 在第二章“获取你的第一条通知”中，我们为 monitoring_user 设置了电子邮件——如果你的 Zabbix 实例中其他用户已正确设置电子邮件，请改为选择该用户。\n\
  \n在弹出窗口中点击 monitoring_user，然后点击“操作详细信息”块中的小“添加”链接——最后一个，就在最底部按钮的上方。要小心；这个表单很容易令人困惑。完成后，点击底部的“添加”按钮。\n\
  \n我们在第七章“针对所监控条件采取行动”中更详细地讨论了动作。\n\n现在，只要触发器变为未知状态，就会发送告警。\n\n虽然我们可以通过应用、主机、模板或主机组来限制这些动作，但我们无法在与触发器事件相同的动作中响应内部事件。如果我们已经有许多动作，按照主机组、应用和其他条件仔细拆分通知，那么为了获得相同的粒度，我们必须为内部事件复制所有这些动作。这非常不切实际，因此目前最好有一些通用动作，例如通知关键负责人，由他们进行调查，并将问题转交给分配给该主机组、应用或其他单元的团队。\n\
  \n## 备份\n\n当出现问题时，有备份是件好事。在设置监控系统时，最好花些时间弄清楚如何进行备份，以免好事变坏事。对于 Zabbix，需要考虑以下组件和数据：\n\
  \n- **Zabbix 二进制文件**：例如服务器和代理。它们可能不值得备份。希望它们可以通过软件包或重新编译轻松获得。\n- **Zabbix 前端文件**：希望它们也很容易获得。如果进行了任何更改，这些更改大概会以补丁形式存储在版本控制系统中。\n\
  - **Zabbix 配置文件**：希望这些文件存储在版本控制系统或系统配置工具中。\n- **Zabbix 服务器数据库**：它包含所有与监控相关的配置数据，例如主机和监控项，也保存所有采集到的值。这才是值得备份的！\n\
  \n## 备份数据库\n\nZabbix 后端可以使用多种不同的数据库。我们不会花太多时间讨论特定于数据库的信息，只简要介绍一种使用最广泛的后端——MySQL——或其分支之一创建备份的简单方法。使用\
  \ MySQL 备份数据库并同时进行压缩的一个非常简单的方法如下：\n\n```\n```bash\n$ mysqldump zabbix --add-drop-table\
  \ --add-locks --extended-insert \\\n  --single-transaction --quick -u zabbix -p\
  \ | bzip2 > zabbix_database_\nbackup.db.bz2\n```\n```\n\n请注意，在 Zabbix 中，配置和数据表的区别有点模糊，而且一些配置表仍然保存着运行时信息。\n\
  \n## 升级 Zabbix\n\n尽管 Zabbix 已经是一款拥有 15 年以上历史的成熟产品，但它仍然在积极开发中。缺陷被修复，新功能不断加入。在某个时候，累积的改进使得升级变得值得。在本节中，我们将了解以下内容：\n\
  \n- **通用版本策略**：哪些版本是稳定的，哪些版本支持时间更长\n- **升级流程**：什么可以升级到什么，以及应该如何升级\n- **Zabbix 组件之间的兼容性**：哪些服务器版本可以与哪些代理版本一起使用，等等\n\
  \n## 通用版本策略\n\n多年来，Zabbix 的版本命名方案几经变更。一般来说，前两个数字表示主版本，例如 2.4 和 3.0，而第三个数字表示次版本号。以前，第二个数字为偶数表示稳定分支，第二个数字为奇数表示开发分支。因此，2.3\
  \ 是 2.4 的开发分支，而 2.4 是最终形成的稳定分支。从 3.0 开始，这种情况略有变化。开发版本不再使用奇数编号，即不再使用 2.5 这样的编号。它们现在被称为\
  \ 3.0.0alpha1、3.0.0beta2 等。这被认为更加用户友好，尽管在多个地方内部编号仍然基于 2.5——例如数据库版本，我们稍后会更详细地讨论。\n\
  \nZabbix 3.0 以来的新版本编号规则可以总结如下：\n\n- 仅包含数字（和点）的版本号表示稳定版本\n- 带有 alpha、beta 或 rc（候选发布版）关键字的版本号不是稳定版本\n\
  \n## 长期支持和短期支持\n\n对于稳定分支，还有更多差异。发布和支持策略也发生了变化，当前策略规定有两种类型的稳定分支：\n\n- **长期支持（Long-term\
  \ support，LTS）分支**：这些分支在 3 年内提供一般 Bug 修复支持，另外 2 年仅提供关键和安全修复支持\n- **短期支持分支**：此类分支在下一个稳定分支（LTS\
  \ 或非 LTS）中的首个版本发布后，大约获得 1 个月的支持\n\n从历史上看，2.2 分支被指定为 LTS 分支，并计划将 2.4 和 2.6 作为短期支持分支发布。计划往往会改变，2.6\
  \ 分支后来被取消了。3.0 是当前的 LTS 分支，3.2 和 3.4 计划为短期支持分支，4.0 作为下一个 LTS 分支，此后所有 LTS 分支都遵循 N.0\
  \ 版本编号。这种情况会持续下去吗？这很难预测，因此你最好查看 http://www.zabbix.com/life_cycle_and_release_policy.php\
  \ 上的当前策略。\n\n> 这种支持主要涉及商业服务，尽管它也强烈影响所有用户。我们将在附录 B“成为社区的一员”中讨论支持选项。\n\n如何决定使用哪个分支？请考虑可用的功能以及你能多快进行升级。最新的\
  \ LTS 版本是否让你满意，并且你多年内都不计划升级？那么坚持使用它。是否真的想要非 LTS 分支中的某个功能，并计划在下个稳定分支发布时升级？选择非 LTS\
  \ 分支。如果处于两者之间，则需要根据当时生效的支持策略做出决定。下面是一个快速查询表，可帮助你决定：\n\n| 在以下情况下使用非 LTS 分支... | 在以下情况下使用\
  \ LTS 分支... |\n|---|---|\n| 你需要非 LTS 分支中的新功能 | LTS 分支的功能让你满意 |\n| 你计划快速升级到每个新版本\
  \ | 你更愿意尽可能长时间地使用一个版本 |\n| 你能容忍轻微不稳定 | 你更喜欢更稳定的版本 |\n\n请注意，表中提到的**轻微不稳定**并不意味着非\
  \ LTS 版本存在严重问题。在某些情况下，**更稳定**可能意味着这个 Bug 相当稳定，但长期未被修复。\n\n\n\n\n\n## 升级流程\n\n阅读升级说明。\n\
  \n那是什么？是的，在执行任何升级之前，花一点时间去 Zabbix 手册，阅读升级说明。如果你跨越了几个主要版本，请务必阅读中间所有的升级说明。即使你一直关注\
  \ Zabbix 的开发，你也可能错过了某些可能导致问题的变更——移除或新增的配置参数、内存需求变化、API 变更……升级说明应列出所有重大变更。\n\n同时也强烈建议阅读名为\
  \ **What's new** 的新功能和改进页面。虽然错过其中一些变更的风险要小得多，但了解它们可以帮助你更高效地使用 Zabbix。\n\n现在让我们谈谈升级流程本身。此流程和兼容性会根据你执行的版本变更而有所不同：\n\
  \n- 在同一主版本内的次要版本升级简单且易于撤销\n- 主版本升级更复杂，难以或无法撤销\n\n## 次要版本升级\n\n这是最简单的情况。例如，从 3.0.0\
  \ 升级到 3.0.1 或从 3.0.1 升级到 3.0.5 都被视为次要版本升级。\n\n> Zabbix 使用第三个数字来表示次要版本。\n\n执行次要版本升级时，我们可以升级任意组合的组件——服务器、代理、代理服务器、Java\
  \ 网关等。虽然建议保持主要组件版本一致以减少混淆，但 3.0.0 服务器完全可以与 3.0.1 前端、3.0.2 代理服务器和 3.0.3 代理一起工作。在一个主版本内，所有组件彼此兼容。\n\
  \n跳过次要版本进行升级也是完全可以的——正如前面提到的，从 3.0.1 直接升级到 3.0.5 是完全没问题的。\n\n虽然次要版本很少会有升级说明，但请务必检查是否有。并且阅读那些\
  \ **What's new** 页面。\n\n只要它们都是同一主版本，你就可以并行保留和使用多个版本的 Zabbix 前端。虽然通常不需要，但在需要进行某些调试或比较时，这会非常有帮助。\n\
  \n## 主版本升级\n\n主版本升级与次要版本升级略有不同。作为快速提醒，务必去阅读升级说明——主版本总会有升级说明。别忘了 What's new 页面。\n\
  \n回到主版本升级本身，与次要版本升级相比，最显著的差异如下：\n\n- 数据库模式变更\n- 兼容性\n- 阅读升级说明\n\n> 从源码执行主版本升级时，建议避免将新的前端文件覆盖旧文件。旧版本残留的文件可能会导致问题。\n\
  \n现在就让我们谈谈数据库模式变更，稍后详细讨论兼容性，并始终记住阅读升级说明。\n\n虽然 Zabbix 团队努力保持次要版本升级不涉及数据库变更，但对于主要版本发布，则是开放的季节。为了适应新功能、提高性能和增加灵活性，会对数据库模式及其内容进行更改。用户不会欣赏在追求新伟大的名义下无法保留收集的数据和创建的配置，因此每个新版本都会提供数据库升级补丁。这可能包括添加新表和列、移除表和列，以及更改数据布局。\n\
  \n鉴于主版本升级会更改数据库，请确保你有最近的备份。虽然升级经过了广泛测试，但开发人员不可能测试所有场景。对一千人有效的事情可能在你这里以某种晦涩的方式失效。此外，由于硬件或电力故障中断升级过程，很可能会使数据库处于损坏状态。你已被警告，所以请准备好备份。\n\
  \n强烈建议你在测试安装上测试升级，最好使用生产数据集（如果可用硬件不允许使用完整副本，可以修剪历史和趋势数据）。\n\n在创建了新的备份后，我们就可以开始主版本升级了。Zabbix\
  \ 2.2 版本的数据库升级流程发生了重大变化。在旧版本中，我们必须手动应用数据库补丁。如果你碰巧有一个旧的 Zabbix 安装——旧是指 2.0 之前——你将必须手动将其数据库模式修补到\
  \ 2.0。对于参考，数据库补丁位于源码树中的 upgrades/dbpatches 目录，但如果你真的想走这条路，请务必通过附录 B《成为社区的一员》中讨论的渠道与\
  \ Zabbix 社区进行咨询。\n\n对于升级到 Zabbix 2.0 或更新版本，不需要手动修补。启动新服务器将自动升级数据库模式。请注意，此数据库升级是无需确认的。注意不要在不打算更改数据库的情况下启动比旧数据库版本更新的服务器二进制文件。\n\
  \n关于升级说明的最后一点提示：承诺。虽然最新的 Zabbix 升级即使在大规模安装中也非常快，但旧版本有时会升级历史数据表，而这需要很长时间——真的很长。在某些报告案例中，需要几天时间。如果未来版本需要此类更改，它将在升级说明中提及，你会庆幸自己阅读了它们。\n\
  \n## 数据库版本控制\n\n说了这么多关于数据库版本和模式变更的话题，让我们更仔细地看看版本信息是如何存储的，以及我们如何检查升级状态。检查你的 Zabbix\
  \ 数据库中的 dbversion 表：\n\n```\nmysql> select * from dbversion;\n+----------------+-------------+\n\
  | mandatory | optional |\n+----------------+-------------+\n| 3000000 | 3000000\
  \ |\n+----------------+-------------+\n1 row in set (0.00 sec)\n```\n\n此表是 Zabbix\
  \ 组件确定它们处理的数据库模式版本的方式。其中有两个数字：mandatory 和 optional。关于版本号，以下规则很重要：\n\n- 在一个主版本内，mandatory\
  \ 版本号始终相同\n- 如果启动了更新的服务器，它会将数据库升级到最新的 mandatory 和 optional 版本\n- 只要其 mandatory 版本与它们完全匹配，服务器和前端就可以使用数据库——optional\
  \ 版本不影响兼容性\n\nmandatory 版本编码了诸如表变更、列变更以及其他破坏兼容性的重大变更等内容。optional 版本通常表示索引变更——这有助于但不禁止旧版本与更新的数据库一起工作。\n\
  \n> Zabbix server 可以从 2.0 及以上所有版本升级到最新的数据库模式版本。要将数据库从 2.0 升级到 3.2，不需要依次使用服务器版本——启动服务器版本\
  \ 3.2 就足够了。\n\n当启动 Zabbix Server 的新主版本时，可以在服务器日志文件中观察当前状态和数据库升级进度：\n\n```\n10852:20151209:094918.686\
  \ Starting Zabbix Server. Zabbix 3.0.0\n(revision {ZABBIX_REVISION}).\n10852:20151209:094918.729\
  \ ***** Enabled features *****\n...\n10852:20151209:094918.730 TLS support:    \
  \                NO\n10852:20151209:094918.730 *******************************\n\
  10852:20151209:094918.730 using configuration file: /usr/local/etc/\nzabbix_server.conf\n\
  10852:20151209:094918.820 current database version (mandatory/\noptional): 3000000/\
  \ 3000000\n10852:20151209:094918.820 required mandatory version:  3000000\n10852:20151209:094918.820\
  \ starting automatic database upgrade\n...\n10852:20151209:094918.866 completed\
  \ 20% of database upgrade\n...\n10852:20151209:094918.937 completed 100% of database\
  \ upgrade\n10852:20151209:094918.937 database upgrade fully completed\n```\n\n注意它如何打印出我们在数据库中刚检查的当前\
  \ mandatory 和 optional 数据库版本以及所需的 mandatory 版本。如果 mandatory 或 optional 数据库版本号低于所需版本，服务器将升级数据库。如果数据库\
  \ mandatory 版本高于服务器版本，服务器将拒绝启动。在数据库模式升级期间，不会进行监控。数据库升级完成后，监控才会重新开始。\n\n\n\n\n\n\
  如果在升级并启动服务器以处理数据库升级之前就先升级前端，会发生什么？你很可能会在前端看到类似这样的消息：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_686_0.png)\n\
  \n如果在升级时看到此类消息，请启动新服务器并确保数据库升级成功。如果这样仍无帮助，请确保你没有启动某个旧的 Zabbix 服务器二进制文件，或 Zabbix\
  \ 服务器指向了不同的数据库。如果在未升级 Zabbix 时看到类似的消息，你很可能存在相当严重的错误配置。在 Zabbix 的正常运行或小版本升级期间，这种情况绝不应该发生。请注意，Zabbix\
  \ 前端会在 `defines.inc.php` 文件中的 `ZABBIX_DB_VERSION` 常量中存储其兼容的主版本号。\n\n## 升级期间收集数据\n\
  \n数据库升级过程可能非常快，但在某些情况下也可能需要相当长的时间。在 Zabbix 升级期间可能需要继续收集数据，但如果监控要等到升级完成才恢复，我们该如何实现呢？\n\
  \n还记得额外的 Zabbix 进程，代理吗？它能够收集数据并将其缓冲以发送到 Zabbix 服务器，因此即使服务器宕机一段时间也不会丢失数据，这听起来与我们的情况非常相似。如果你的所有实际监控工作都已由\
  \ Zabbix 代理完成，那么你已经走在正确的道路上了。\n\n如果你有由服务器直接轮询的监控项，你可能希望设置一个临时的代理安装，甚至可以在同一台服务器上运行，在\
  \ Zabbix 服务器升级期间运行，之后再移除。要轻松实现这一点，请在前端的 配置 | 主机 部分使用批量更新功能并设置 由代理监控 选项。确保代理确实能够收集数据，先用单个主机进行测试。\n\
  \n> 如果你使用的是主动监控项，设置临时代理安装会明显更困难。因为需要重新配置所有 Zabbix 代理，它们会连接到 `ServerActive` 参数中指定的地址。另一方面，主动代理本身也会在短时间内缓冲数据，因此快速的服务器升级可能根本不会丢失这些数据。\n\
  \n代理方法听起来很棒，但比直接升级服务器要复杂一些。官方上，仅支持相同主版本之间的服务器-代理兼容性。这意味着我们不应使用旧版本的代理与升级后的服务器配合使用。代理如果使用\
  \ MySQL 或 PostgreSQL 后端，也可以升级其数据库。建议使用代理在主版本升级期间继续收集数据的路径如下：\n\n1. 阻止所有代理-服务器通信（可能使用本地防火墙如\
  \ `iptables`）。\n2. 停止旧的 Zabbix 服务器，升级它并启动新服务器。\n3. 停止其中一个旧的 Zabbix 代理，升级它并启动新版本以升级本地数据库。\n\
  4. 恢复代理与新服务器之间的通信。\n5. 以同样的方式处理所有剩余的代理。\n\n这应该能确保升级过程中的数据丢失最小，特别是如果单个代理升级的步骤已脚本化并且没有延迟。\n\
  \n> 如果使用 SQLite，则不支持代理数据库升级。在这种情况下，前一种方法将不起作用，升级代理时应直接删除代理数据库文件。\n\n## 前端配置文件\n\n\
  虽然数据库升级是从一个主版本迁移到另一个主版本时最重要的一步，但也值得花一点时间关注 Zabbix 前端配置文件。建议将旧配置文件与新配置文件进行比较，看看是否有新的参数或现有参数的重大更改。最简单的方法可能是与\
  \ `conf/` 子目录中的 `zabbix.conf.php.example` 文件进行比较。该配置文件非常小，因此发现差异应该很容易。\n\n- 当使用\
  \ Zabbix 代理时，使用主动监控项。主动监控项会减少网络连接数量并降低 Zabbix 服务器的负载。有些功能在主动监控项下不受支持，因此有时你必须使用被动监控项。我们在第\
  \ 3 章《使用 Zabbix 代理和基本协议进行监控》中讨论了主动监控项可以做什么和不能做什么。\n- 使用 Zabbix 代理。它们会将批量数据提供给 Zabbix\
  \ Server，进一步减少服务器的工作量。我们在第 19 章《使用代理监控远程位置》中讨论了代理。\n\n我们已经了解了监控项的历史和趋势保留周期——但 Zabbix\
  \ 将事件、警报、确认消息和其他数据存储多长时间呢？这可以通过进入 管理 | 通用 并在右上角的下拉菜单中选择  housekeeping 来配置：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_689_0.png)\n\
  \n> 此页面过长，因此前面的截图仅显示了顶部的很小一部分。\n\n在这里，我们可以配置以下数据的保留时间：\n\n- **事件**：我们可以为触发器、内部、网络发现和主动代理自动注册事件选择单独的存储周期。请注意，删除一个事件也会删除所有相关的警报和确认消息。\n\
  - **IT 服务数据**：IT 服务的正常和异常状态与触发器事件分开记录，其保留周期也可以单独配置。\n- **审计数据**：这指定了审计数据应存储多长时间。我们稍后会讨论它到底是什么。\n\
  - **用户会话**：已关闭的用户会话会被更频繁地删除，但活动用户会话默认会在 1 年后被删除。这意味着一个人可能不会登录超过一年。\n\n这些值应保持在合理较低的水平。长时间保留数据会增加数据库大小，这会极大地影响性能。\n\
  \n这里的历史和趋势设置怎么办？虽然它们通常可以按监控项配置，但我们可以在这里覆盖它们。此外，对于每个条目，内部 housekeeping 也可以被禁用。这些选项面向需要管理大型\
  \ Zabbix 安装的用户。当数据库变得非常大时，其性能会显著下降，可以通过分区最大的表来改善——按某些标准将其拆分。对于 Zabbix 来说，通常会分区历史和趋势表，有时还会添加事件和警报表。如果使用分区，则会删除表的部分（分区），并且应禁用这些表的内部\
  \ housekeeping。Zabbix 社区中的很多人会在第一个机会就热烈建议分区。除非你计划拥有一个非常大的安装或非常了解数据库分区，否则最好暂缓。尚无官方支持或内置的分区方案，未来可能会出现。如果出现，并且你的分区方案不同，则需要你自己将其与官方方案同步。\n\
  \n## 谁干的？\n\n“现在是谁干的？”——这个问题在许多地方偶尔会听到，包括 IT 工作场所。奇怪的配置更改、未经请求的重启——问责制和操作痕迹有助于确定提问者是否就是做出更改的人然后忘记了。对于\
  \ Zabbix 配置更改，内部审计日志可用。就像大多数功能一样，它可以方便地从 Web 前端访问。在我们的配置之旅中，我们做了相当多的更改——让我们看看我们留下了什么足迹。导航到\
  \ **报表 | 审计**，并将筛选时间条设置为大致匹配此 Zabbix 实例初始安装的时期。我们会看到一个我们所做事情的列表，虽然你也可以只在审计记录的第一页看到登录和注销：\n\
  \n| TIME | USER | IP | RESOURCE | ACTION | ID | DESCRIPTION | DETAILS |\n|---|---|---|---|---|---|---|---|\n\
  | 2015-12-12 14:06:12 | Admin | 127.0.0.1 | User | Login | 1 |  |  |\n| 2015-12-12\
  \ 14:06:12 | Admin | 127.0.0.1 | User | Logout | 1 |  | Manual Logout |\n| 2015-12-12\
  \ 14:05:11 | Admin | 127.0.0.1 | User | Login | 1 |  |  |\n| 2015-12-12 14:05:11\
  \ | Admin | 127.0.0.1 | User | Logout | 1 |  | Manual Logout |\n| 2015-12-12 14:04:10\
  \ | Admin | 127.0.0.1 | User | Login | 1 |  |  |\n| 2015-12-12 14:04:10 | Admin\
  \ | 127.0.0.1 | User | Logout | 1 |  | Manual Logout |\n\n\n\n\n假如你像我们在第13章*监控网页*中那样设置了Zabbix前端监控，会怎么样？你很可能会只看到这样的记录，因为我们的Web场景每分钟都会登录和注销。但请注意过滤器——我们还可以按用户、操作和资源进行过滤：\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_691_0.png)\n\n展开**操作**和**资源**下拉菜单——注意它们相当细致，尤其是**资源**下拉菜单。\n\
  \n在本书的Zabbix 1.8版本中，有这样的描述：\n\n> > 在最初的几个Zabbix 1.8版本中，某些操作不会记录在审计日志中。  \n> > 预计这些问题将在不久的将来得到修复。\n\
  \n唉，不幸的是，这个问题在后续的1.8版本、2.0、2.2或2.4中都没有修复，3.0中也没有。Zabbix审计日志仍然缺少许多执行的操作，尤其是在使用API时。虽然审计日志非常有用，但它很容易遗漏你感兴趣的特定操作。请针对你使用的版本进行测试以确认——未记录的操作列表很容易在次要版本中发生变化。\n\
  \n抛开采审计日志不完整这一令人遗憾的事实，作为一个练习，试着找出你添加**重启Apache**操作的时间。\n\n在查看本节内容时，让我们提醒自己另一个日志领域——我们之前简要看过的操作日志。转到**报表\
  \ | 操作日志**。这里记录了Zabbix服务器执行的所有操作，包括发送电子邮件、执行远程命令、发送短信和执行自定义脚本。此视图提供了发送了什么内容、发送给谁、是否成功以及错误消息（如果有）的信息。它对于验证Zabbix是否已发送或未发送特定消息，以及判断配置的操作是否按预期工作非常有用。\n\
  \n操作日志和审计日志部分共同提供了对Zabbix内部配置更改的良好概览，并有助于调试以确定已执行了哪些操作。\n\n## 探索配置文件参数\n\n让我们通过深入探讨Zabbix\
  \ agent和服务器的配置文件并检查其中的每个参数来结束本章。我们将从agent配置文件开始，并讨论常见参数如何应用于其他守护进程。我们将跳过proxy配置文件，因为届时将讨论常见参数，而proxy特有的参数已在第19章*使用代理监控远程位置*中讨论过。我们还将跳过所有以TLS开头的参数，因为这些参数与Zabbix守护进程流量加密有关，我们已在第20章*加密守护进程流量*中讨论过。\n\
  \n我们将按照默认示例配置文件中出现的顺序来查看参数——这里的顺序没有其他含义。\n\n在阅读以下描述时，建议打开相应的配置文件。这样可以让你验证参数在你自己使用的Zabbix版本中是否相同。请务必阅读每个参数旁边的注释——它们可能会显示自本书编写以来某些参数已发生变化。一般来说，如有疑问，请阅读配置文件中的注释。Zabbix团队非常努力地使这些注释既简短又具有最大的相关性和帮助性。\n\
  \n### Zabbix agent守护进程及通用参数\n\n让我们从agent守护进程参数开始。对于其他守护进程也可用的参数，我们将在这里讨论它们对所有守护进程的相关性：\n\
  \n- PidFile：此参数对所有守护进程通用。它们将主进程的PID写入此文件。默认配置文件出于简单考虑使用/tmp。在生产系统中，应将其设置为发行版推荐的位置。\n\
  \n- LogType：此参数对所有守护进程通用，可以是file、syslog或console之一。默认值为file，在这种情况下，LogFile参数决定日志写入的位置。syslog值指示守护进程将日志写入syslog，console参数指示它将消息记录到stdout。\n\
  \n- LogFile：此参数对所有守护进程通用。当LogType设置为file时，日志数据写入此文件。默认配置文件出于简单考虑使用/tmp。在生产系统中，应将其设置为发行版推荐的位置。\n\
  \n- LogFileSize：此参数对所有守护进程通用。当记录到文件时，如果文件大小超过此兆字节数，则将其移动为file.0（例如zabbix_agentd.log.0），并记录到新文件。只执行一次这样的移动（也就是说，永远不会有zabbix_agentd.log.1）。\n\
  \n- DebugLevel：此参数对所有守护进程通用，指定提供多少日志信息，从0（几乎没有）到5（很多）。通常最好在DebugLevel 3下运行，调试时使用更高的级别。例如，从DebugLevel\
  \ 4开始，所有服务器和代理数据库查询都会记录。在DebugLevel 5下，当前还会额外记录两件事：\n  - Web监控收到的页面\n  - VMware监控收到的原始数据\n\
  \n- SourceIP：此参数对所有守护进程通用。如果系统有多个接口，传出连接将使用指定的地址。请注意，并非所有连接都会遵循此参数——例如，服务器或代理上的后端数据库连接就不会。\n\
  \n- EnableRemoteCommands：此参数决定system.run监控项是否允许运行命令。默认禁用。\n\n- LogRemoteCommands：如果启用了EnableRemoteCommands，此参数允许我们记录所有收到的命令。除非使用system.run来检索数据，否则启用远程命令日志记录可能是个好主意。\n\
  \n- Server：此参数也可用于Zabbix proxy，但不适用于Zabbix server。它是一个逗号分隔的IP地址或主机名列表，agent应接受来自这些地址的连接。它仅与被动监控项、zabbix_get和其他传入连接相关。\n\
  \n- ListenPort：此参数对所有守护进程通用，指定监听的端口。\n\n- ListenIP：此参数对所有守护进程通用，指定监听的IP地址——也可以是逗号分隔的地址列表。\n\
  \n> 我们将在*附录A，故障排查*中查看如何更改运行中守护进程的日志级别。\n\n### Zabbix维护\n\n- StartAgents：这是启动的负责处理传入连接的进程数。如果系统资源非常紧张，减少此值可能是个好主意。如果此agent预计会收到大量被动监控项查询，则增加此数字。请注意，这与采集器或主动检查进程无关；它们的数量无法直接更改。如果设置为0，agent将停止监听传入连接。这样可能更安全，但也可能使调试变得困难得多。\n\
  \n- ServerActive：这是用于主动检查的连接服务器和端口列表。语法为server:port，多个条目用逗号分隔。如果未设置，则不处理主动检查。我们在第3章*使用Zabbix\
  \ agent和基本协议进行监控*中讨论过此功能。\n\n- Hostname：此参数也可用于Zabbix proxy，但不适用于Zabbix server。如果指定，确切的字符串将作为此系统的主机名发送到Zabbix服务器。\n\
  \n- HostnameItem：如果未指定Hostname但指定了HostnameItem，则此参数中的值将被解释为监控项键，评估结果将作为此系统的主机名发送到服务器。\n\
  \n- HostMetadata：这是一个要发送到服务器的精确字符串——用于主动agent自动注册。\n\n- HostMetadataItem：如果未指定HostMetadata但指定了HostMetadataItem，则此参数中的值将被解释为监控项键，评估结果将作为主机元数据发送到服务器，用于主动agent自动注册。\n\
  \n- RefreshActiveChecks：此参数指定agent应多久连接一次服务器并请求主动监控项。默认设置为2分钟。如果根本不使用主动检查，则意味着每个agent每2分钟就会进行一次无用的连接——在这种情况下最好不要设置ServerActive。\n\
  \n- BufferSend：主动agent将每隔BufferSend秒发送值——默认每5秒一次。这允许我们减少网络连接数，如果在5秒窗口内收集了多个值。\n\n\
  - BufferSize：这是一个用于保存主动监控项值的缓冲区。默认设置为100个值。这是一个内存缓冲区——如果担心内存使用，不要设置得太大。如果至少有一个日志监控项，缓冲区实际上会被分成两半——一半用于“普通”值，另一半用于日志条目。如果缓冲区已满，新的“普通”值将导致较旧的“普通”值被丢弃，但不会影响日志条目。如果缓冲区的日志条目部分已满，日志文件处理将停止，但不会丢弃任何条目。如果只有日志监控项而没有“普通”监控项，缓冲区的一半仍会保留给“普通”条目。如果只有“普通”监控项，则整个缓冲区都用于它们，直到添加至少一个日志监控项。\n\
  \n\n\n\n- MaxLinesPerSecond：这是默认情况下每秒应发送到服务器的日志项最大行数。我们在第11章“高级监控项管理”中讨论过这一点。\n\
  - Alias：这是为监控项键设置别名的一种方式。虽然它在所有平台上都可用，但我们在第14章“监控Windows”中讨论过它。该参数也可以用于创建两个具有相同键的LLD规则，即使键本身不接受参数。一个规则可以使用原始键，另一个规则可以使用被设置别名的键。\n\
  - Timeout：这对所有守护进程都是通用的。它指定了运行命令、建立连接等的超时时间。从Zabbix 3.0开始，代理端默认为3秒，服务器端和代理服务器端默认为4秒。这可能会影响用户参数，例如——一个需要超过几秒才能运行的脚本可能会超时。强烈建议不要增加服务器端的超时时间——如果我们必须每秒处理大量值，让服务器进程在一个脚本上等待那么久是不好的。如果你有这样的脚本需要很长时间才能返回值，可以考虑改用`zabbix_sender`，如第11章“高级监控项管理”中所述。\n\
  - AllowRoot：默认情况下，Zabbix守护进程如果以root身份启动，会尝试将权限降级为User参数中指定的用户（参考下一点）。如果未指定User参数，结果取决于此参数。如果设为0，启动失败。如果设为1，守护进程以root用户启动。\n\
  - User：这对所有守护进程都是通用的。如果守护进程以root用户启动且AllowRoot设为0，则会尝试切换到此参数中指定的用户。默认设置为zabbix。\n\
  - Include：这对所有守护进程都是通用的。它允许你包含单个或多个配置文件。我们在第11章“高级监控项管理”中讨论过此功能。请注意，文件是按顺序包含的，就像字面上“包含”在Include指令出现的位置一样。还要记住，如果多次指定，大多数参数会覆盖之前的所有出现——也就是说，具有相同名称的最后一个选项生效。\n\
  - UnsafeUserParameters：默认情况下，某些字符子集不允许作为参数传递给用户参数键。如果启用此选项，则允许传递任何内容，这基本上等同于EnableRemoteCommands——原本被禁止的符号使得获取shell访问权变得简单。有关此参数允许的符号完整列表，请参阅默认配置文件。\n\
  \n- **StartPollers**：轮询器（Pollers）是内部进程，负责以各种方式收集数据。默认情况下会启动5个轮询器，对于像我们测试环境这样的小型安装来说这已经足够了。在较大的安装中，通常会有数百个轮询器。请注意，没有单独的SNMP轮询器——同一个进程负责被动代理和SNMP设备的轮询。如何知道是否足够？使用内部监控来查找平均繁忙率。如果超过70%，只需增加更多轮询器。轮询器负责：\n\
  \  - 连接到被动代理\n  - 连接到SNMP设备\n  - 执行简单检查，例如服务/端口检查\n  - 检索内部监控数据\n  - 从VMware缓存中检索VMware数据\n\
  \  - 运行外部检查脚本\n\n- **StartIPMIPollers**：这指定应启动多少进程来轮询IPMI设备。我们在第16章“监控IPMI设备”中配置过此参数。\n\
  \n- **StartPollersUnreachable**：如果主机不可达，它不再由普通轮询器轮询——现在由称为**不可达轮询器**的特殊类型处理该主机，包括IPMI监控项。这样做是为了避免少数超时主机占用大部分轮询器时间的情况。如果不可达轮询器数量不足，最糟糕的情况是，被声明为不可达的主机不会很快被注意到已恢复。默认情况下，只启动一个不可达轮询器。要判断是否足够，观察它们的繁忙率，尤其是在被监控环境中存在系统宕机时。\n\
  \n- **StartTrappers**：默认情况下有5个trappers。与轮询器一样，监控它们的繁忙率，并按需添加更多。Trappers负责接收来自以下方面的传入连接：\n\
  \  - 主动代理\n  - 主动代理服务器（proxies）\n  - `zabbix_sender`\n  - Zabbix前端，包括服务器可用性检查、全局脚本和队列数据\n\
  \n- `StartPingers`：这些进程创建临时文件，然后对这些文件调用`fping`来执行ICMP ping检查。如果有大量ICMP ping监控项，请确保检查这些进程的繁忙率，并按需添加更多。\n\
  - `StartDiscoverers`：发现器（Discoverers）执行网络发现。每个规则的发现是顺序进行的。即使有许多可用的发现器，一次也只能有一个处理单个发现规则。请注意，发现器会拆分它们所服务的规则——例如，如果有两个发现规则和两个发现器，一个发现器将始终处理某个特定规则。我们在第12章“自动化配置”中讨论过网络发现。\n\
  - `StartHTTPPollers`：这些进程负责处理Web场景。与发现器类似，HTTP轮询器会拆分它们所服务的Web场景。我们在第13章“监控Web页面”中讨论过Web监控。\n\
  - `StartTimers`：定时器进程可能非常耗费资源，尤其是当大量触发器使用基于时间的函数如`now()`时。我们在第6章“使用触发器检测问题”中讨论过基于时间的触发器函数。这些进程负责：\n\
  \  - 在每分钟的第0秒将主机放入或移出维护状态——如果启动了多个定时器进程，这仅由第一个定时器进程完成\n  - 在每分钟的第0秒和第30秒评估所有包含至少一个基于时间的触发器函数的触发器\n\
  - `StartEscalators`：这些进程按步骤推进升级（escalations），如第7章“对监控条件采取行动”中所述。如果动作操作指示，它们还执行远程命令。\n\
  - `JavaGateway, JavaGatewayPort, 和 StartJavaPollers`：这些参数指向Java网关及其端口，并告诉服务器或代理服务器应该有多少进程连接到该网关。请注意，它们都连接到同一个网关，因此如果增加Java轮询器的数量，网关应该能够处理负载。我们在第17章“监控Java应用”中讨论过Java监控。\n\
  - `StartVMwareCollectors, VMwareFrequency, VMwarePerfFrequency, VMwareCacheSize,\
  \ 和 VMwareTimeout`：这些控制VMware监控的工作方式。我们在第18章“监控VMware”中详细讨论过这些参数。\n\n- `SNMPTrapperFile`\
  \ 和 `StartSNMPTrapper`：当接收SNMP陷阱时，我们必须指定临时陷阱文件以及是否应启动SNMP trap接收器。请注意，只能启动一个SNMP\
  \ trap接收器进程。我们在第4章“监控SNMP设备”中配置过这些参数。\n- `HousekeepingFrequency`：这指定内部清理进程（housekeeper）运行的频率——或者更具体地说，上一次运行结束后多久开始下一次运行。不建议更改默认的一小时间隔——如本章前面所述，可以根据需要通过管理\
  \ | 常规中针对特定数据禁用清理进程。清理进程的第一次运行发生在服务器或代理服务器启动后30分钟。可以使用运行时控制选项手动调用清理进程。\n- `MaxHousekeeperDelete`：对于已删除的监控项，这指定单次运行中每个监控项应删除多少值，默认值为5000。例如，如果我们删除了10个监控项，每个有10000个值，那么需要两次清理进程运行才能删除所有监控项的所有值。如果某个监控项有大量值，一次全部删除可能会导致数据库性能问题。请注意，此参数不影响现有监控项的值清理。\n\
  - `SenderFrequency`：这指定未发送的告警多久发送一次。请注意，更改此值将同时影响从触发器触发到第一条消息的时间以及重试时间。默认值为30秒，触发器触发后可能需要最多30秒才能发送消息。这也意味着两次尝试之间会有30秒的间隔——Zabbix在声明发送失败前会尝试发送3次。如果将此参数减小以使第一条消息发送得更快，那么重复尝试之间的时间也会减少。默认值为30秒时，邮件服务器宕机稍超过一分钟仍能在第三次尝试时发送消息。如果将此参数减小为10秒，邮件服务器宕机30秒就可能足以导致消息丢失。\n\
  - `CacheSize`：这是主配置缓存的大小，用于保存主机、监控项、触发器以及许多其他信息。此缓存的使用取决于配置数据的大小——这受主机、监控项和其他实体数量的影响。对此参数要非常主动——如果缓存使用量显著增加，或者你计划为大量新主机添加监控，请增加配置缓存。如果配置缓存已满，Zabbix服务器将停止。\n\
  - `CacheUpdateFrequency`：这指定配置缓存多久更新一次。默认的1分钟对于大多数安装来说相当合适，尽管在大型环境中，增加此参数可能是个好主意，因为配置缓存更新本身可能会增加数据库负载。\n\
  \n\n\n\n\n- **StartDBSyncers**：该参数指定应启动多少个数据库同步器或历史同步器（在 Zabbix 的不同位置，这两个名称可互换使用）。这些进程负责计算引用监控项的触发器、接收新值，并将由此产生的事件及历史值存储到数据库中——它们可能是\
  \ Zabbix 中对数据库负载最大的进程。默认的四个数据库同步器/历史同步器通常足以应对大多数环境，不过在大型安装中，增加该数值可能会有所帮助。不过增加此数值时请务必谨慎——这类进程过多反而会对性能产生负面影响；尽管你可能会发现，如果它们的平均繁忙率下降，处理的值数量也可能会减少。\n\
  - **HistoryCacheSize**：当值被收集后，它们首先存储于历史缓存中。历史同步器或数据库同步器会从该缓存取出值，处理触发器，并将这些值存储到数据库中。历史缓存被占满通常意味着存在性能问题——增加缓存大小可能无济于事。若此缓存已满，新的值将无法插入其中，但\
  \ Zabbix 服务器会继续运行。\n- **HistoryIndexSize**：该缓存保存历史缓存中所有监控项最新值和最旧值的相关信息。它用于避免扫描历史缓存，因为历史缓存可能会变得相当庞大。此缓存的使用量取决于收集数据的监控项数量。与主配置缓存和趋势缓存一样，请确保该缓存有足够的空间——若它被写满，Zabbix\
  \ 服务器将会关闭。\n- **TrendCacheSize**：该缓存保存每个监控项当前小时的趋势数据——这里的“当前小时”并非按时钟时间计算，而是根据传入的值来确定。也就是说，监控项最后到达的值决定了“当前小时”的归属。例如，如果使用\
  \ `zabbix_sender` 发送的是昨天 09:00–10:00 这个小时的值，那么该小时就是“当前小时”，其趋势数据就存放在趋势缓存中。一旦收到 10:00–11:00\
  \ 这个小时的第一个值，该监控项在趋势缓存中的数据就会被写入数据库，而 10:00–11:00 便成为新的“当前小时”。此缓存的使用量取决于收集数据的监控项数量。与主配置缓存一样，请确保该缓存有足够的空间——若它被写满，Zabbix\
  \ 服务器将会关闭。\n\n- `ValueCacheSize`：该参数控制保存历史值缓存的大小——但不同于历史缓存，它保存的是预计将来会有用的值。这里的值并非用于写入数据库，恰恰相反，这些值常常是从数据库读入此缓存的。当触发器计算（例如，计算最近\
  \ 10 分钟的平均值）、计算型或聚合型监控项、包含在通知中以及其他用途需要监控项值时，便会使用该值缓存。服务器首次启动时，填充值缓存可能需要一些时间。如果值缓存已满，Zabbix\
  \ 服务器会继续运行，但其性能可能会下降。请监控此缓存，并根据需要增大其大小。\n- `TrapperTimeout`：该参数控制 trapper 进程与主动模式代理、主动模式\
  \ proxy 以及 zabbix_sender 通信时的超时时间。它默认设置为最大值 5 分钟，因此极不可能达到此超时上限。\n- `UnreachablePeriod`、`UnavailableDelay`\
  \ 和 `UnreachableDelay`：这些参数共同决定如何处理取值失败的情况。如果因网络错误导致取值失败，该主机将被视为不可达（unreachable），并每隔\
  \ `UnreachableDelay` 秒（默认 15 秒）检查一次。此过程持续 `UnreachablePeriod` 秒（默认 45 秒），如果所有检查均失败（在默认设置下，相当于\
  \ 4 次检查），该主机将被标记为不可用（unavailable），并每隔 `UnavailableDelay` 秒检查一次。请注意，自 Zabbix 3.0\
  \ 起，如果一个监控项连续两次失败，但同一主机上同类型的另一个监控项却成功了，则该失败的监控项会被标记为不支持（unsupported）。最好将这些值保留为默认值，因为更改它们可能会导致相当令人困惑的结果。\n\
  - `AlertScriptsPath`：要从动作中调用的自定义脚本必须放置在此参数指定的目录中。我们在*第7章，对监控到的状况采取行动*中配置了这样一个脚本。\n\
  - `ExternalScripts`：用于外部检查监控项的脚本必须放置在此参数指定的目录中。我们在*第11章，高级监控项监控*中配置了这样一个监控项。\n-\
  \ `FpingLocation` 和 `Fping6Location`：如果 IPv4 和 IPv6 的 fping 二进制文件路径不同，这些参数应指向它们。ICMP\
  \ 检查需要 fping 工具，我们在*第3章，使用 Zabbix 代理和基础协议进行监控*中配置了 ICMP 检查。\n- `SSHKeyLocation`：如果使用带密钥的\
  \ SSH 监控项，则密钥必须放置在此参数指定的目录中。我们在*第11章，高级监控项监控*中配置了 SSH 监控项。\n\n- `LogSlowQueries`：通常，SQL\
  \ 查询在 `DebugLevel 4` 之前不会记录日志。该参数允许我们在 `DebugLevel 3` 下记录所有执行时间超过此处指定的毫秒数的查询。默认情况下，自\
  \ Zabbix 3.0 起，任何执行时间超过 3 秒的查询都会被记录。它们会以如下形式出现在日志文件中：\n\n`13890:20151223:152504.421\
  \ slow query: 3.005859 sec, \"commit;\"`\n\n- `TmpDir`：这是 Zabbix 服务器或代理需要存储任何文件的临时目录。目前，仅用于传递给\
  \ `fping` 的文件。\n\n- `SSLCertLocation`、`SSLKeyLocation` 和 `SSLCALocation`：当 Web 监控使用\
  \ SSL 功能时，这些参数指定了证书、密钥和证书颁发机构文件的查找位置。\n\n再次提醒，所有以 TLS 开头的参数都与守护进程通信加密相关，此处不进行讨论。\n\
  \n如果你使用的是较新版本的 Zabbix，可用的参数可能会略有不同。要列出你现有配置文件中所支持的参数，以下命令可能会有所帮助：\n\n```\n$ grep\
  \ \"### Option\" zabbix_agentd.conf\n```\n\n现在，如果你对某个参数感到困惑，应该首先查阅哪里？如果你说或想到“当然是配置文件中的注释了”，那很好。如果不是，请去看看那些注释，并记住\
  \ Zabbix 团队确实非常非常努力地让这些注释更有用，并且希望你去阅读它们。这样你会节省自己的时间。\n\n## 总结\n\n在 Zabbix 安装和配置完成后，维护任务就变得重要起来。在本最后一章中，我们了解了三项重要任务：\n\
  \n- **监控 Zabbix 自身**：我们涵盖了内部监控项，这些监控项可以用于了解 Zabbix 服务器或代理接收了多少数据、监控缓存使用情况、验证内部进程的繁忙程度、我们有多少不支持的监控项，以及其他一些事项。\n\
  - **进行备份**：我们讨论了针对 Zabbix 最重要的部分——其数据库——既定且常用的备份方法（以及从中恢复的方法）。\n- **升级 Zabbix**：我们了解了次要版本和主要版本升级之间的区别，以及数据库如何被\
  \ Zabbix 服务器自动修补。我们还了解了 LTS 版本，这些版本支持 3 年，并额外支持 2 年的关键和安全修复，而其他版本则在下一个版本发布后大约支持\
  \ 1 个月。\n\n在讨论升级的同时，我们还弄清楚了不同 Zabbix 组件之间的兼容性是如何工作的。对于次要级别的升级来说非常简单——包括服务器、代理和 agent\
  \ 在内的所有组件都是相互兼容的。让我们尝试可视化主要升级级别的兼容性矩阵：\n\n|  | 更新 | Agent | Proxy | 服务器 |\n|---|---|---|---|---|\n\
  | 更旧 |  |  |  |  |\n| Agent |  |  | Y | Y |\n| Proxy |  | N |  | N |\n| 服务器 |  |\
  \ N | N |  |\n\n需要提醒的是，从支持角度来看，服务器和代理应该是相同的主要版本，并且它们支持所有较旧版本的 agent。关于 Zabbix Java\
  \ 网关，它应该与服务器或代理来自相同的主要版本——尽管协议没有改变，但没有官方的测试，也不为不同主要版本提供支持。\n\n> 在执行 Zabbix 主要版本升级之前，请确保有数据库备份。\n\
  \n在处理完这三个主要主题后，我们讨论了保持 Zabbix 性能可接受的一般建议，并特别关注了 housekeeper 配置。\n\n我们还找到了一种查看 Zabbix\
  \ 配置更改的方法——审计日志。它允许我们看到谁对主机、监控项和其他实体做了哪些更改。我们有点失望地发现，这个日志实际上并没有记录所有操作，尤其是那些通过 API\
  \ 执行的操作。\n\n最后，我们相当详细地查看了服务器、代理和 agent 配置文件中的参数。是否有必要提醒你密切关注配置文件本身的注释呢？\n\n我们将用两个附录来结束本书，其中我们将讨论\
  \ Zabbix 故障排除的步骤和方法，以及如何与 Zabbix 社区互动并加入其中。\n\n\n\n\n"
- "## 故障排除\n\n安装和配置 Zabbix 对某些用户来说可能一帆风顺，而对另一些用户则可能问题不断。问题出现的原因因人而异——可能是库有缺陷、发行版打包不佳、Zabbix\
  \ 配置不够直观，甚至可能是 Zabbix 自身偶尔存在的 bug。在这里，我们将介绍新用户在执行各种任务时遇到的常见问题：\n\n- 设置初始 Zabbix\
  \ 安装\n- 使用 Web 前端\n- 监控不同设备\n- 配置阈值和告警\n\n如果你遇到比这些更复杂的问题，我们还将继续提供更详细的调试说明，包括：\n\n\
  - Zabbix 日志文件格式\n- 重新加载服务器和代理配置缓存\n- 控制正在运行的守护进程\n- 观察各个守护进程执行的工作\n\n## 本章简介\n\n\
  编写本章颇费了一番心思。自 2001 年以来我一直在使用 Zabbix，要描述的问题案例实在太多了。我常常在半夜醒来，想到一个值得收录的绝妙问题和解决方案，但到早晨却忘得一干二净。不过这样一来，本章就会永无止境。因此需要有所取舍，我也只好不情愿地接受了。本章并不旨在帮助你解决这辈子（或使用\
  \ Zabbix 时）可能遇到的每一个问题，而是尝试帮助解决更常见的问题，并为后续调试提供一些提示和入手点。\n\n## 常见问题\n\n以下是你可能遇到的一些问题：\n\
  \n### 安装\n\n安装过程中有几个常见的障碍，其中一些是由隐藏得很深的因素引起的。\n\n### 编译\n\n- 问：我正尝试在 64 位系统上编译 Zabbix。我已经安装了相应的开发包，但\
  \ Zabbix 却说这些包不存在。\n- 答：请再次确认安装的是 64 位开发包，而不仅仅是 32 位的。\n- 问：我正尝试从 SVN 检出编译 Zabbix，但配置脚本出现以下错误：\n\
  \  `syntax error near unexpected token `IKSEMEL,iksemel,'`\n- 答：安装 `pkg-config`\
  \ 包，然后重新运行命令以生成配置脚本。\n- 问：我正尝试编译 Zabbix，但编译失败了。\n- 答：缩小可能的原因范围会很有帮助。请确认你没有使用 `--enable-static`\
  \ 进行编译，该选项已知会导致编译问题。如果未使用该选项编译仍失败，请检查源目录中 `config.log` 文件的内容，其中通常包含准确的错误详细信息。\n\n\
  ## 前端\n\n- **问：** 我已经安装了 Zabbix 前端。默认用户名和密码是什么？\n- **答：** 用户名是 Admin，密码是 zabbix。\n\
  - **问：** 我正在从 SVN 检出设置 Zabbix。在前端切换语言时，什么反应也没有。\n- **答：** 在前端目录的 locale 子目录中有一个\
  \ `make_mo.sh` 脚本。它从翻译源 po 文件编译所需的 mo 文件——运行该脚本即可。注意，这需要 Gettext 工具，并且之后可能需要重启 Web\
  \ 服务器。\n\n## 后端\n\n- **问：** Zabbix 运行正常，但部分/所有图形都不显示。\n- **答：** 请参阅 Apache 错误日志以获取更多详细信息。通常，这是由于\
  \ PHP 脚本的内存限制过低所致——如果是这种情况，请将 `memory_limit` 参数设置为更大的值并重启 Web 服务器。另一个可能的原因是 `conf/zabbix.conf.php`\
  \ 文件损坏——请检查该文件是否包含任何奇怪字符，尤其是文件末尾。\n- **问：** 复杂视图（如包含许多元素的聚合图形）有时无法加载。可能是什么原因导致的？\n\
  - **答：** 与上一个问题类似，请确认 PHP 内存限制未被超过。此外，检查 PHP 脚本超时时间（`max_execution_time` 参数），如有必要则增大该值。\n\
  - **问：** 我的图形有断档。\n- **答：** 不只是图形，数据库中的数据也缺失了。要解决此问题，需要找出导致数据丢失的原因。常见原因如下：\n  -\
  \ **网络问题：** 如果网络不可靠，数据就会丢失。\n  - **被监控设备过载：** 例如，如果你添加了一台多端口交换机，并频繁监控每个端口上的多个监控项，请尝试增大间隔并禁用不需要的监控项。\n\
  \  - **Zabbix 服务器过载：** 通常问题出在数据库。检查 Zabbix 数据库服务器的系统负载，尤其是 `iowait`。\n- **问：** 我已经安装并运行了\
  \ Zabbix，但突然又显示安装界面。\n- **答：** 检查 `conf/zabbix.conf.php` 文件是否可访问。\n- **问：** `conf/zabbix.conf.php`\
  \ 文件存在，但我仍然看到安装界面。\n- **答：** 在某些发行版软件包中，前端可能期望配置文件位于 `/etc/zabbix/web` 或类似位置。请查阅软件包文档。\n\
  - **问：** 我试图打开一个包含许多元素的大页面，但页面还没加载完就刷新了。如何解决这个问题？\n- **答：** 在你的用户配置文件中增大刷新周期。虽然这不会提高页面加载速度，但至少可以让页面有机会完整加载。\n\
  - **问：** 我服务器上的时钟是正确的，但前端显示的时间不正确。\n- **答：** 检查 PHP 配置中时区是否设置正确。\n- **问：** Zabbix\
  \ 服务器正在运行，但前端声称它没有运行。\n- **答：** 这可能是由多种因素造成的：\n  - 检查 `conf/zabbix.conf.php` 文件——前端会使用其中指定的服务器地址和端口来查询\
  \ Zabbix 服务器进程。\n  - 确保没有防火墙阻止前端到 Zabbix 服务器的连接。\n  - 确保 SELinux 没有阻止前端到 Zabbix\
  \ 服务器的连接。\n  - 确保至少启用了一个 trapper 进程——它们负责接受前端连接。也有可能是 trapper 进程数量不足，无法处理所有请求。如果服务器不可用的消息只是偶尔出现，则尤其可能是这种情况。请像我们在第\
  \ 22 章 Zabbix 维护中所做的那样，监控 trapper 进程的繁忙率。\n- **问：** 我遇到了一个这里未列出的前端问题。\n- **答：**\
  \ 检查 Apache 错误日志和 PHP 日志——这些日志通常能让你了解原因。另外，转到**管理 | 用户或用户组**，将你的用户添加到**已启用调试模式**的用户组中。之后，所有前端页面的右下角都会出现一个小的**调试**控件。点击它会显示该特定页面的许多详细信息，包括所执行的确切\
  \ API 和 SQL 查询。调试模式可能会占用更多资源——如果启用调试模式后某些前端页面停止工作，请尝试将其禁用。\n\n## 被锁定在前端之外\n\n无论是新用户还是老用户，一个常见的错误就是把自己锁定在前端之外。这可能是由多种方式造成的，但我们更关心的是如何重新进入。\n\
  \n- 问：我忘记了密码，不断尝试登录，直到 Zabbix 前端不再响应。\n- 答：默认情况下，连续五次登录失败后 Zabbix 会拒绝访问 30 秒，因此只需等待\
  \ 30 秒。你可以自定义 includes/defines.inc.php 中的以下值：\n  - ZBX_LOGIN_ATTEMPTS：失败尝试多少次后 Zabbix\
  \ 拒绝访问\n  - ZBX_LOGIN_BLOCK：拒绝访问的时长（秒）\n- 问：我忘记了 Admin 用户的密码，或者我的任务是管理一个不知道 Admin\
  \ 用户密码的 Zabbix 安装。\n- 答：你可以通过直接修改数据库来轻松重置 Admin 用户密码：\n```\nmysql> update zabbix.users\
  \ set passwd=MD5('somepassword') where alias='Admin';\n```\n> 当然，请将 somepassword\
  \ 替换为其他字符串。请记住，MySQL 默认会将控制台命令保存在 ~/.mysql_history 文件中，因此你可能希望将密码设置为临时版本，并在之后通过前端更新。\n\
  - 问：我更改了身份验证方法，但并没有按计划生效，现在我无法登录了。\n- 答：你可以通过编辑数据库来恢复 Zabbix 的内部身份验证方法：\n```\nmysql>\
  \ update zabbix.config set authentication_type='0' where configid='1';\n```\n身份验证类型\
  \ 0 是内部类型。另外，其他类型包括 1（LDAP）和 2（HTTP）。Zabbix 期望 config 表中只有一条 configid 为 1 的记录。\n\
  \n## 监控\n\n有时监控某项内容进展顺利，有时就是行不通。\n\n\n\n\n\n## 常规监控\n\n- 问：我添加了一个主机或监控项，但在**监测 |\
  \ 最新数据**中看不到它。\n- 答：检查那里的筛选器是否包含该主机或其主机组。确保**显示无数据监控项**复选框已勾选，且其他筛选选项没有排除你要查找的监控项。\n\
  - 问：我可以在**最新数据**中看到我的主机，新值也在不断到来——但它却不在**监测 | 概览**中。\n- 答：**概览**可能被设置为显示触发器——请确认该主机是否配置了触发器。没有触发器的主机不会在触发器模式下显示。\n\
  \n## 使用 Zabbix agent 进行监控\n\n- 问：我尝试使用被动 Zabbix agent 检查来监控一台主机，但不起作用。\n- 答：Zabbix\
  \ agent 监控项无法工作的常见原因包括：\n  - Zabbix agent 守护进程没有运行。很简单，对吧？不过，还是先检查它是否确实在运行。\n  -\
  \ Zabbix 守护进程没有监听正确的端口或接口。你可以在被监控主机上运行 `netstat -ntpl` 来检查 Zabbix agent 守护进程监听的端口和接口。agent\
  \ 守护进程的默认端口是 `10050`。\n  - agent 守护进程配置文件中的服务器 IP 地址不正确。检查配置文件，确保 server 指令指定的是\
  \ Zabbix server 将要连接过来的 IP。\n  - 网络问题导致服务器无法正常连接到 agent 守护进程。这包括本地和网络防火墙阻断连接，也包括某些网络设备或配置实际上改变了\
  \ Zabbix server 出站连接的源 IP 地址。在 Zabbix server 上执行 `telnet <被监控主机 IP> 10050` 来测试连通性。如果你自定义了\
  \ agent 监听端口，请在该命令中使用该端口。如果连接未能建立，请按网络问题排查。如果连接立即被关闭，说明 Zabbix agent 守护进程并未将该连接视为来自配置文件中设置的\
  \ IP 地址。请注意，在某些情况下，你可能实际上需要使用 IPv6 地址，因为 Zabbix agent 会将其作为传入连接之一接收。\n\n- 问：我尝试使用主动\
  \ Zabbix agent 检查来监控一台主机，但不起作用。\n- 答：主动监控项稍微复杂一些。以下是一些需要验证的事项：\n  - 像普通监控项一样检查网络连通性——在被监控机器上执行\
  \ `telnet <Zabbix server IP> 10051`。如果你自定义了 agent 监听端口，请在该命令中使用该端口。\n  - 在期望主动监控项返回结果之前，请确保等待\
  \ Zabbix server 刷新其配置缓存，并且 agent 守护进程配置文件中 `RefreshActiveChecks` 选项指定的时间已经过去。如果你想强制\
  \ agent 从服务器重新加载监控项列表，请重启 agent。\n  - 检查 agent 守护进程配置文件中 `Hostname` 选项指定的主机名是否与前端中为该主机配置的主机名一致。请注意，这不是\
  \ IP 地址或 DNS 名称；只有主机名才有效——它也不是可见名称，而是所谓的**技术主机名**。与 Zabbix 中几乎所有其他内容一样，它区分大小写。\n\
  \  - 确保你想要发送主动检查（或从中获取主动检查）的 Zabbix server 已列在 agent 守护进程配置文件的 `ServerActive` 选项中。\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_711_0.png)\n\n- 问：我验证过可以在被监控主机上获取到值，但\
  \ Zabbix agent 却提示不支持或返回错误数据。\n- 答：有几种可能的情况：\n  - 你以 root 身份检查诸如进程数之类的内容或使用 `zabbix_agentd\
  \ -t` 语法，但各种权限限制（包括 `grsecurity` 和 `SELinux`）可能会阻止 Zabbix agent 进行访问。这包括 Zabbix\
  \ agent 将唯一运行进程数显示为 `0`，即使以 root 身份访问时你能看到实际数量。\n\n- 另一种本地进程数与 Zabbix agent 返回结果不同的情况：各种解释型进程（例如\
  \ Python 或 Perl 进程）在 agent 看来可能只是解释器进程，仅带有用户进程作为参数。已知会出现此问题的进程包括 amavisd 和 xend。在这些情况下，你可以使用不同的方法，例如使用\
  \ `proc.num[python, , ,xend]` 监控项键。这将查找参数中包含 xend 字符串的 Python 进程。\n\n- 被监控的实例不存在。例如，如果你使用\
  \ `net.if.in[eth0,bytes]` 键请求某个指标，而 Zabbix agent 声称不支持，请验证 eth0 接口是否确实存在。\n\n- 另一台服务器配置了具有相同主机名的主动\
  \ Zabbix agent，并且也在为该主机发送数据。\n\n- 问：我修改了 agent 守护进程配置文件中的某个参数，但它忽略了我的更改。\n- 答：请检查以下几点：\n\
  \n  - 确认修改的那一行没有被注释掉。\n  - 确保你编辑的是正确系统上的文件。\n  - 检查 Zabbix agent 守护进程是否使用了修改后的配置文件。所有\
  \ Zabbix 守护进程在启动时都会记录它们正在使用的配置文件。\n  - 检查 Include 指令。要特别注意那些包含目录中所有文件的指令，以及嵌套的 include。\n\
  \  - 确保你正确重启了守护进程。请注意，仅运行 zabbix_daemon 或 zabbix_daemon restart 并不会重启守护进程。\n\n某些发行版的软件包可能会提供配置文件以及指向该文件的便捷符号链接。如果你在符号链接上使用\
  \ `sed -i`，它不会编辑目标文件——而是会用普通文件替换该符号链接。某些版本的 sed 可能提供名为 `--follow-symlinks` 的选项来编辑目标文件。\n\
  \n- 问：我看到配置文件为某个参数指定了一个值，但 Zabbix agent 使用的却是另一个值。\n- 答：请参考上一个问题的答案，尤其是关于确保在正确的系统上编辑正确的文件，以及\
  \ Include 指令不会覆盖参数第一个实例的部分。\n\n- 问：我尝试在 Windows 系统上使用主动监控项或自动注册，但自动获取的主机名是全大写的，并且被截断为\
  \ 15 个字符。\n- 答：在 agent 守护进程配置文件中设置 `HostnameItem=system.hostname[host]`。我们在*第 14\
  \ 章，监控 Windows* 中讨论过这个问题。\n- 问：我验证了某个监控项在运行 `zabbix_agentd -t` 或 `-p` 时能按预期工作，但在前端检查值时却不行。\n\
  - 答：手动运行 `zabbix_agentd` 时，用户和环境很可能与正在运行的守护进程不同，因此权限和环境值也会不同。检查该监控项预期执行的详细操作，以及在使用\
  \ Zabbix agent 守护进程权限时什么因素可能阻止其成功执行。不要直接以 root 身份测试 `zabbix_agentd`。最好的方法是使用 `zabbix_get`\
  \ 对正在运行的 agent 守护进程进行测试。\n- 问：我可以在 Zabbix Server 中或使用 `zabbix_get` 获取监控项的值，但当我用\
  \ `zabbix_agentd -t` 或 `-p` 测试时，却收到错误 `[m|ZBX_NOTSUPPORTED] [Collector is not started.]`。\n\
  - 答：某些监控项（包括 `system.cpu.util` 和 `proc.cpu.util`）的值是由正在运行的 agent 计算的，因为它们在提供有效值之前需要多个采样。此类监控项只有在\
  \ Zabbix Server 或 `zabbix_get` 查询 agent 守护进程时才能工作。\n\n## 用户参数\n\n以下列表详细列出了与用户参数相关的常见问题：\n\
  \n- 问：我的用户参数不起作用。\n- 答：导致用户参数失效的常见原因如下：\n  - 环境缺失是设置用户参数时最大的绊脚石之一。Zabbix agent 不会显式初始化环境细节，例如\
  \ `HOME` 变量或其他信息。这可能导致无法读取所需的配置文件以及其他问题。请确保按需设置环境，可以直接在用户参数中设置变量，也可以在包装脚本中设置。\n\
  \  - 还有一点，如果你以 root 身份运行命令进行测试，Zabbix 用户受限的权限会让你难以排查，因此务必以 Zabbix 用户的身份测试用户参数。如果某个检查需要\
  \ root 访问权限，请通过 `sudo` 配置访问权限。\n\n\n\n\n\n## SNMP 设备\n\n- 返回脏数据也很容易破坏数据检索。使用用户参数检索数据时，请确保其中不包含使其不适合存储的字符（例如为浮点数据类型监控项返回\
  \ `26.6 C`），也不包含其他奇怪字符（例如数据字符串末尾带有 CR/LF 换行符）。\n- 默认情况下，agent 监控项会在三秒后超时。在大多数情况下，不建议增加此超时时间，不过如果将用户参数变量用作主动式监控项，这样做可能是相当安全的。请记住，主动式监控项不是并行处理的——只有一个\
  \ agent 进程在工作，一次一个监控项。请考虑改用 `zabbix_sender` 来处理此类监控项。\n\n- **Q:** 我的 SNMP 监控项不工作。\n\
  - **A:** 请仔细检查 SNMP 版本和团体字符串是否设置正确。指定错误的 SNMP 版本通常会导致超时，从而加大调试难度。当然，还要从 Zabbix 服务器使用\
  \ `snmpwalk` 和 `snmpget` 命令检查常规连通性和权限。\n- **Q:** 我的 SNMP 监控项要么完全不工作，要么频繁失败。\n- **A:**\
  \ 也许您的设备不能正确支持 `SNMP GETBULK`——请尝试在主机属性中为 SNMP 接口禁用批量获取（bulk get）支持。\n- **Q:** 我导入了模板，但\
  \ LLD 失败，错误信息为 `Invalid SNMP OID: pairs of macro and OID are expected.`\n- **A:**\
  \ Zabbix SNMP LLD 的键（key）语法在 Zabbix 2.4 中发生了变化。不幸的是，XML 导入过程并未相应更新，导致导入的 LLD 规则使用了旧语法。有关键语法的详细信息，请参阅*第\
  \ 12 章，自动化配置*。\n- **Q:** 我添加了 MIB 文件，它们在命令行工具中工作正常，但 Zabbix Server 似乎忽略了这些 MIB 文件。\n\
  - **A:** 请确保重启服务器守护进程——MIB 定义仅在启动时加载。\n\n> 此外，请确保你不会因为过于频繁地查询大量值而使被监控设备过载。\n\n-\
  \ **Q:** 我的 SNMP 监控项可以工作，但特定设备上的某些 OID 不工作，尽管数据出现在 `snmpwalk` 输出中。\n- **A:** 尝试对这些\
  \ OID 使用 `snmpget`。已知某些 UPS 的固件存在缺陷，导致这些指标无法通过 `GET` 请求工作，但可以通过 `snmpwalk` 所使用的\
  \ `GETNEXT` 请求正常工作。如果属于这种情况，请升级设备固件。\n- **Q:** 我在 `/etc/snmp/snmp.conf` 中列出了我想使用的所有\
  \ SNMP MIB，但 Net-SNMP 工具并未全部正确使用它们。\n- **A:** 某些 Net-SNMP 版本会悄悄将此文件中的行截断为 1024 个字符（包括换行符）。请尝试将选项拆分为多行，使单行不超过\
  \ 1023 个可打印字符。\n- **Q:** 我正在监控网络流量，但返回的数据不正确。\n- **A:** 如果是高速接口，请确保使用 64 位计数器 OID，例如\
  \ `ifHCInOctets` 和 `ifHCOutOctets`。\n- **Q:** 我正在向 Zabbix 添加 SNMP 设备，但添加新设备会停止对先前设备的监控。如果我使用\
  \ `snmpget` 查询每台设备，它们仍然会按预期响应。\n- **A:** 如果是 SNMPv3，请确保所有设备都有唯一的 `snmpEngineID`\
  \ 变量。\n\n## IPMI 监控\n\n- **Q:** 我无法让 IPMI 监控项工作。\n- **A:** 当 IPMI 监控项无法工作时，有几点需要检查：\n\
  \  - 确保 Zabbix 服务器已配置 IPMI 支持。这很简单，但容易被忽略。\n  - 检查服务器配置文件中的 `StartIPMIPollers` 选项是否设置为默认值\
  \ `0`。如果是，请将其设置为 `1` 并重启 Zabbix Server。\n  - 确保传感器名称正确。你可以使用 `IPMItool` 获取传感器名称，并且必须使用\
  \ `IPMItool` 输出中显示的名称，保留空格，不要加引号。\n  - 检查是否使用了最新的 OpenIPMI 版本。已知较旧版本的 OpenIPMI 存在各种问题。\n\
  \n## ICMP 检查\n\n- **Q:** 我的所有 ICMP 检查都失败了。\n- **A:** 以下是几个可能的原因：\n\n  检查 `fping`\
  \ 是否可由运行 Zabbix Server 的用户以 root 身份通过 `setuid` 运行。\n\n  确保 SELinux 不会阻止 Zabbix 运行\
  \ `fping`。`grep fping /var/log/audit/audit.log` 命令可能会提供更多信息。\n\n## 简单检查的问题\n\n-\
  \ **Q:** 我的服务正常工作，但 `net.tcp.service` 或 `net.udp.service` 监控项显示它不工作。\n- **A:** 除了验证查询的是否是正确的服务器之外，还要检查服务是否按\
  \ Zabbix 预期的方式响应——简单检查的详细信息参见 `https://www.zabbix.com/documentation/3.0/manual/appendix/items/service_check_details`。\n\
  \n## zabbix_sender 和 trapper 监控项的问题\n\n- **Q:** 我发送带时间戳的值，但服务器数据库中输入了不同的时间戳。\n-\
  \ **A:** Zabbix sender 会在整个请求的 `clock` 属性中携带主机上的当前时间，Zabbix 服务器会据此调整所有值的时间戳。无法告知服务器不要这样做，也无法告知\
  \ sender 不要发送该时间戳。要么修复发送系统上的时间，要么在不发送请求时间戳的情况下实现基本协议。\n\n## 常见问题\n\n- **Q:** 我正在监控网络流量，但数字大得不切实际。\n\
  - **A:** 由于数据很可能以计数器（counter）的形式提供，请确保在 Zabbix 中将结果存储为差值（每秒速度）。\n- **Q:** 我正在以字节/秒为单位监控\
  \ 10G 接口速率，当接口处于负载状态时，我会丢失值。\n- **A:** 确保**信息类型**设置为**数字（无符号）**。这样，你会损失几分之一位的精度，但会保留所有值。\n\
  - **Q:** Zabbix 不接受我的计算监控项的公式。\n\n- A: 请确保使用正确的引号，尤其是当引用的监控项键带有引号时。例如，如果引用的监控项键是\
  \ `key[\"parameter\",param]`，在计算监控项公式中，可以像这样使用：`last(\"key[\\\"parameter\\\",param]\"\
  )`。请注意用反斜杠转义内部的双引号。\n- **Q:** 我试图使用像 `proc.num['apache']` 这样的监控项键，但它不工作。\n- **A:**\
  \ Zabbix 只支持双引号；不要使用单引号来引用。\n- **Q:** 我试图使用像 `{host:item.LAST()=13}` 这样的触发器表达式，但它不工作。\n\
  - **A:** 区分大小写——在 Zabbix 中几乎一切内容都区分大小写：监控项键、它们的参数、主机名、触发器函数等等。如果你来自 Windows 环境，请不断提醒自己大小写很重要。\n\
  \n## 触发器\n\n- **Q:** 我的触发器不工作，或者 Zabbix 拒绝添加我的触发器。\n- **A:** 检查触发器的语法，特别注意括号——是否使用了正确的类型？它们都正确闭合了吗？引号也一样，并记住要区分大小写。尝试拆分复杂的表达式以定位错误。\n\
  \n## 动作\n\n- **Q:** 我的动作不工作。\n- **A:** 如果通知没有出现在**报告 | 动作日志**中，请确保你想要发送通知的用户至少对参与生成事件的主机之一具有读取权限。另外，还要检查动作条件、主机维护设置和动作操作。确保你的动作没有被禁用——如果动作条件或操作中引用的资源被删除，Zabbix\
  \ 可能会静默地自动禁用这些动作。还要检查用户媒体设置，例如严重性和时间过滤器，以及所配置的媒体类型是否已启用。如果消息确实出现在动作日志中且存在错误消息，希望错误信息能有所帮助。如果消息出现在动作日志中并显示为成功发送，请检查你的\
  \ MTA 或其他接收系统的日志。\n- **Q:** 我的电子邮件通知没有发送，我可以在电子邮件服务器日志文件中看到类似 `[127.0.0.1] did not\
  \ issue MAIL/EXPN/VRFY/ETRN during connection to MTA in e-mail server log files.`\
  \ 的错误消息。\n\n\n\n\n\n## 故障排除\n\n- **Q:** 这些消息很可能是由 Zabbix 监控 SMTP 服务引起，而非通知尝试。检查上一问中提到的权限，并检查\
  \ **Reports | Action log** 中的操作日志以了解通知失败的原因。\n- **Q:** 发生了什么事，我的 Zabbix 服务器正在发送大量消息。我能快速停止吗？\n\
  - **A:** 存在一种强硬的方法来停止失控或过度的升级——你可以删除所有当前活动的升级。请注意，即使删除活动升级，Zabbix 也会创建新的升级——一个好的解决方法是让操作条件仅在触发器未被确认时才发送消息，并确认有问题的触发器。注意：这也会移除正确的升级。在正确的数据库中执行以下操作：\n\
  \n```\nmysql> delete from escalations;\n```\n\n## 发现与自动注册\n\n- **Q:** 我将一台主机从某个主机组中移除，但它后来神秘地被重新添加。\n\
  - **A:** 检查网络发现和主动代理自动注册操作——很可能它们重新添加了该主机。\n- **Q:** 我将一台主机移动到由特定代理或 Zabbix 服务器实例监控，但它后来又改回另一个代理或\
  \ Zabbix 服务器实例。\n- **A:** 检查主动代理自动注册操作以及代理上的 `ServerActive` 参数。创建的主机将被分配给最后接收到自动注册请求的代理或服务器。\n\
  - **Q:** 我禁用了一个 LLD 原型，但下游的项目或触发器未被禁用。\n- **A:** 不幸的是，这是设计使然，无法更改。你可以在配置列表中禁用单个项目和触发器。对于更改大量下游项目或触发器的状态，尝试使用\
  \ Zabbix API。\n\n## 故障排除 Zabbix\n\n之前的所有问答涵盖了一些新用户可能遇到的最常见问题。可能还会遇到许多其他问题，并且随着 Zabbix\
  \ 新版本的发布，会出现新的问题。虽然快速解决常见问题是好的，但让我们看看在调试 Zabbix 问题时可能有帮助的一些细节。\n\n## Zabbix 日志文件格式\n\
  \n当出现无法解释的问题时，我们首先应该检查的地方之一是日志文件。这不仅仅是 Zabbix 特有的事情；日志文件非常有用。有时。其他时候，它们没有帮助，但我们将讨论日志文件没有提供答案时的其他选项。为了能够找到答案，了解日志文件格式的一些基本知识是有帮助的。Zabbix\
  \ 日志格式如下：\n\n```\nPPPPPP:YYYYMMDD:HHMMSS.mmm\n```\n\n这里，PPPPPP 是进程 ID，用空格填充到 6 个字符，YYYYMMDD\
  \ 是当前日期，HHMMSS 是当前时间，mmm 是时间戳的毫秒。冒号和点是字面符号。此前缀后跟一个空格，然后是实际的日志消息。以下是一个示例日志条目：\n\n\
  ```\n10372:20151223:134406.865 database is down: reconnecting in 10 seconds\n```\n\
  \n如果日志文件中有一行没有此前缀，它很可能来自外部源，例如脚本，或来自 Net-SNMP 等库。\n\n启动期间，会记录类似以下内容的输出：\n\n```\n\
  12331:20151215:163629.968 Starting Zabbix Server. Zabbix 3.0.0\n(revision {ZABBIX_REVISION}).\n\
  12331:20151215:163630.020 ****** Enabled features ******\n12331:20151215:163630.020\
  \ SNMP monitoring:           YES\n12331:20151215:163630.020 IPMI monitoring:   \
  \        YES\n12331:20151215:163630.020 Web monitoring:            YES\n12331:20151215:163630.020\
  \ VMware monitoring:         YES\n12331:20151215:163630.020 SMTP authentication:\
  \       YES\n12331:20151215:163630.020 Jabber notifications:      NO\n12331:20151215:163630.020\
  \ Ez Texting notifications:  YES\n12331:20151215:163630.020 ODBC:              \
  \        YES\n12331:20151215:163630.020 SSH2 support:              YES\n12331:20151215:163630.020\
  \ IPv6 support:              NO\n12331:20151215:163630.020 TLS support:        \
  \       NO\n12331:20151215:163630.020 *******************************\n12331:20151215:163630.020\
  \ using configuration file: /usr/local/etc/zabbix_server.conf\n12331:20151215:163630.067\
  \ current database version (mandatory/optional): 03000000/03000000\n12331:20151215:163630.067\
  \ required mandatory version: 03000000\n```\n\n## 故障排除\n\n第一行打印出守护进程类型和版本。根据编译方式，它还可能包含当前的\
  \ SVN 修订号。随后是编译时功能的列表——非常有用，可以知道是否应该期望 SNMP、IPMI 或 VMware 监控能够工作。然后，显示当前使用的配置文件路径——当我们想弄清楚我们更改的文件是否是正确的文件时很有帮助。在服务器和代理日志文件中，都存在当前和所需的数据库版本——我们在\
  \ *Chapter 22, Zabbix Maintenance* 中讨论过这些。\n\n数据库版本之后，可以找到内部进程启动消息：\n\n```\n2583:20151231:155712.323\
  \ server #0 started [main process]\n2592:20151231:155712.334 server #5 started [poller\
  \ #3]\n2591:20151231:155712.336 server #4 started [poller #2]\n2590:20151231:155712.337\
  \ server #3 started [poller #1]\n2593:20151231:155712.339 server #6 started [poller\
  \ #4]\n```\n\n会有更多类似的行；这里的输出已被精简。这有助于验证是否已启动预期数量的某种类型的进程。查看日志文件内容时，并不总是明显哪个进程记录了特定行——而启动消息可以在这里提供帮助。如果我们看到如下行，我们可以找出哪个进程记录了它：\n\
  \n```\n21974:20151231:184520.117 Zabbix agent item \"vfs.fs.size[/,free]\" on\n\
  host \"A test host\" failed: another network error, wait for 15 seconds\n```\n\n\
  我们可以通过查找具有相同 PID 的启动消息来做到这一点：\n\n```\n# grep 21974 zabbix_server.log | grep started\n\
  \n21974:20151231:184352.921 server #8 started [unreachable poller #1]\n```\n\n![](img/f5313a804532fabacc8d07cc8607eeba_720_0.png)\n\
  \n> 如果返回多行，请运用常识找到启动消息。\n\n这表明主机在第一次网络失败后会被延迟到不可达轮询器。\n\n但如果日志文件已被轮转，原始启动消息丢失了呢？除了更高级的侦探工作，还有一种简单的方法，前提是守护进程仍在运行。我们将在本章稍后讨论这种方法。\n\
  \n## 重新加载配置缓存\n\n我们在 Chapter 2, Getting Your First Notification 中遇到了配置缓存，并在 Chapter\
  \ 22, Zabbix Maintenance 中讨论了监控它的方法。虽然它在性能方面帮助很大，但在我们尝试快速测试某些东西时可能会有点问题。可以强制 Zabbix\
  \ 服务器重新加载配置缓存。运行以下命令以显示 Zabbix 服务器选项：\n\n```\n# zabbix_server --help\n```\n\n> 我们在\
  \ Chapter 19, Using Proxies to Monitor Remote Locations 中简要讨论了 Zabbix 代理配置缓存重新加载。\n\
  \n在输出中，查找运行时控制选项部分：\n\n```\n-R --runtime-control runtime-option  Perform administrative\
  \ functions\nRuntime control options:\n    config_cache_reload  Reload configuration\
  \ cache\n```\n\n因此，可以通过以下方式启动服务器配置缓存的重新加载：\n\n```\n# zabbix_server --runtime-control\
  \ config_cache_reload\n```\n\n```\nzabbix_server [2682]: command sent successfully\n\
  ```\n\n检查服务器日志文件将显示它已接收到信号：\n\n```\nforced reloading of the configuration cache\n\
  ```\n\n在后台，发送信号的过程如下：\n\n1. 服务器二进制文件查找默认配置文件。\n2. 然后它查找 PidFile 选项指定的文件。\n3. 它向具有该\
  \ ID 的进程发送信号。\n\n如 Chapter 19, Using Proxies to Monitor Remote Locations 中所述，这个功能的好处是它也支持主动\
  \ Zabbix 代理。更好的是，当主动代理被指示重新加载其配置缓存时，它会连接到 Zabbix 服务器，获取所有最新配置，然后重新加载本地配置缓存。如果向被动代理发送此类信号，它会忽略该信号。\n\
  \n\n\n\n\n## 故障排查\n\n如果同一系统上运行着多个代理进程，你如何告诉二进制程序具体哪个实例应该重新加载配置缓存？回顾之前向进程发送信号的过程，所需要做的只是指定正确的配置文件。如果在同一系统上运行多个代理进程，每个进程必须已经有自己的配置文件，指定不同的\
  \ PID 文件、日志文件、监听端口等。让使用特定配置文件的代理重新加载配置缓存只需这样：\n\n```\n# zabbix_proxy -c /path/to/zabbix_proxy.conf\
  \ --runtime-control config_cache_reload\n```\n\n> 必须提供配置文件的完整绝对路径；不支持相对路径。\n\n>\
  \ 同样的原则也适用于服务器和代理，但在同一系统上运行多个 Zabbix 服务器的情况更为少见。\n\n如果我们有一个大型 Zabbix 服务器实例，并且显著增加了\
  \ CacheUpdateFrequency 参数，手动重新加载配置缓存会很有用。\n\n## 控制运行中的守护进程\n\n配置缓存重载只是运行时部分提供的功能之一。让我们看看其中其余选项：\n\
  \n```\nhousekeeper_execute                 Execute the housekeeper\nlog_level_increase=target\
  \            Increase log level, affects all processes\nif target is not specified\n\
  log_level_decrease=target            Decrease log level, affects all processes\n\
  if target is not specified\nLog level control targets: pid\nProcess identifier process-type\
  \ All processes of specified type (for\nexample, poller)\nprocess-type,N       \
  \             Process type and number (e.g., poller,3)\n```\n\n如*第22章：Zabbix维护*中所讨论的，内部\
  \ housekeeper 会在服务器或代理启动 30 分钟后首次运行。housekeeper_execute 运行时选项允许我们随时运行它：\n\n```\n\
  # zabbix_server --runtime-control housekeeper_execute\n```\n\n更有趣的是能够更改运行中进程的日志级别。该功能首次出现在\
  \ Zabbix 2.4 中，让调试变得容易得多。Zabbix 守护进程通常启动后即可正常运行——直到我们需要修改某些内容。虽然我们无法让任何守护进程重新读取其配置文件，但还有几个选项允许我们控制运行中守护进程的某些方面。正如第22章：Zabbix维护中简要提到的，DebugLevel\
  \ 参数允许我们在守护进程启动时设置日志级别，默认值为 3。日志级别 4 会添加所有 SQL 查询，日志级别 5 还会添加来自 Web 监控和 VMware 监控的接收内容。对于不熟悉的人来说，任何高于\
  \ 3 的级别都可能令人惊讶甚至畏惧。即使是一个很小的 Zabbix 服务器，在日志级别 4 下也很容易在几分钟内记录数十兆字节的日志。由于某些问题可能不会立即出现，人们可能需要在日志级别\
  \ 4 或 5 下运行数小时或数天。想象一下需要处理你并不熟悉的 GB 级日志。为运行中的进程设置日志级别的能力，使我们能够在出现问题期间提高日志级别，然后再降低，而无需重启守护进程。\n\
  \n更妙的是，在使用运行时日志级别功能时，我们可以选择哪些具体组件的日志级别需要更改。单个进程可以通过其系统 PID 或 Zabbix 内部的进程编号来标识。通过系统\
  \ PID 指定进程可以这样做：\n\n```\n# zabbix_server --runtime-control log_level_increase=1313\n\
  ```\n\n指定单个 Zabbix 进程的方法是选择进程类型，然后传入进程编号：\n\n```\n# zabbix_server --runtime-control\
  \ log_level_increase=trapper,3\n```\n\n一个非常有用且常见的做法是更改某一类型所有进程的日志级别——例如，我们不知道哪个\
  \ trapper 会接收导致问题的连接，因此我们可以省略进程编号，轻松地提高所有 trapper 的日志级别：\n\n```\n# zabbix_server\
  \ --runtime-control log_level_increase=trapper\n```\n\n如果此运行时选项不带任何参数，它将会影响所有 Zabbix\
  \ 进程：\n\n```\n# zabbix_server --runtime-control log_level_increase\n```\n\n当进程被要求更改日志级别时，它们会记录一条相关日志，然后更改日志级别：\n\
  \n```\n21975:20151231:190556.881 log level has been increased to 4 (debug)\n```\n\
  \n注意，无法查询当前日志级别或设置特定级别。如果你不确定所有进程当前的日志级别，有两种方法可以解决：\n\n- 重启守护进程\n- 将日志级别降低或升高五次，确保其处于\
  \ 0 或 5，然后设置所需级别\n\n作为对我们刚才探讨的选项的简单测试，提高所有 poller 的日志级别：\n\n```\n# zabbix_server\
  \ --runtime-control log_level_increase=poller\n```\n\n跟踪 Zabbix 服务器日志文件：\n\n```\n\
  # tail -f /tmp/zabbix_server.log\n```\n\n注意一个很小的 Zabbix 服务器上仅 5 个 poller 进程就能产生多少数据。然后降低日志级别：\n\
  \n```\n# zabbix_server --runtime-control log_level_decrease=poller\n```\n\n## 运行时进程状态\n\
  \nZabbix 还有另一个有助于调试的小技巧。运行 top，看看哪种模式能给你更稳定、更长的 Zabbix 进程列表——按处理器使用率排序（按 Shift +\
  \ P）或按内存使用率排序（按 Shift + M）可能都行。\n\n> 或者，按 o 并键入 COMMAND=zabbix_server。\n\n按 C，注意\
  \ Zabbix 进程如何更新其命令行，以显示它具体是哪个内部进程以及它在做什么：\n\n```\nzabbix_server: poller #1 [got\
  \ 0 values in 0.000005 sec, idle 1 sec]\nzabbix_server: poller #4 [got 1 values\
  \ in 0.000089 sec, idle 1 sec]\nzabbix_server: poller #5 [got 0 values in 0.000004\
  \ sec, idle 1 sec]\n```\n\n跟踪它们的状态，看看某些进程的任务和耗时如何变化。我们也可以将输出重定向或通过其他命令进行过滤：\n\n\
  ```\n# top -c -b | grep zabbix_server\n```\n\n## 进一步调试\n\n可能出错的地方很多，可用来查明原因的工具也很多。如果你熟悉这些工具箱，包括\
  \ `tcpdump`、`strace`、`ltrace` 和 `pmap` 等工具，你应该能够解决大多数 Zabbix 问题。\n\n> 有些人声称一切都是\
  \ DNS 问题。\n> 他们通常是对的——如果其他方法都不奏效，请检查 DNS。\n> 以防万一。\n\n我们不会在这里讨论它们，因为这超出了范围——那是通用的\
  \ Linux 或 Unix 调试。当然，仍有许多 Zabbix 特有的问题可能出错。你可能想查看 wiki 上的 Zabbix 故障排查页面：http://zabbix.org/wiki/Troubleshooting。如果这没有帮助，请务必查看社区和商业支持选项，例如我们将在*附录\
  \ B：成为社区的一员*中讨论的 Zabbix IRC 频道。\n"
- '## 成为社区的一员


  Zabbix 的一个重要方面是其开源特性。Zabbix 是一个真正的开源解决方案——它不是“开放核心”，也没有企业版或某些专有插件。这类方法可被贴上“假开源”的标签。Zabbix
  的所有组件都是完全开源的；没有封闭或隐藏的组件。其开发者已承诺让 Zabbix 保持这种状态——欢迎查看 Zabbix 2013 年会议视频，了解这一点：参见
  Zabbix 创建者 Alexei Vladishev 的开场演讲，大约在 27 分 30 秒处。


  除了开源之外，Zabbix 的很多开发也是公开进行的。这使得人们可以轻松地密切关注开发进展并获得社区支持。但每个开源项目的运作方式和指导方针各不相同，所以让我们看看在
  Zabbix 的这一方面，人们可以期待什么：


  - 社区支持是解决问题的一个很好的途径，可以通过在 IRC 频道聊天、查看 wiki、在官方论坛讨论，或使用开放的错误跟踪器来实现

  - 通过获取最新源代码来更紧密地跟进开发，可以让人们尽快尝试问题的修复方案，提供早期反馈，并更加熟悉 Zabbix 的内部机制

  - 对于产品开发、支持合同或其他服务，商业支持可能会很方便


  Zabbix 的开发是公开进行的，但通常不接受外部贡献，只有一个领域例外：翻译。欢迎为 Zabbix 的所有翻译作出贡献，我们还将了解如何参与其中。






  ## 在 IRC 上聊天


  IRC，即 Internet Relay Chat，是一种相当古老的通信方式，在开源项目社区中尤其流行。Zabbix 用户也喜欢在专门的频道上聚集进行与 Zabbix
  相关的讨论。位于 Freenode 网络 freenode.net 上的频道 #zabbix 是你可以期望从其他 Zabbix 用户那里获得帮助并与之交流的地方。这里聚集了最先进且最有知识的社区成员。你可以使用许多网络
  IRC 网关，例如 http://webchat.freenode.net/，或使用一个名为 IRC 客户端的专用程序连接到任何 Freenode IRC 服务器。针对不同的操作系统有许多不同的选项可供选择，你可以自由选择任何一个——这不会影响你与使用不同客户端的人交流的能力。除了一般的沟通准则外，还有一些
  IRC 特有的准则：


  - 重申基本建议——要有耐心。太多的情况下，人们进来，问完问题后几分钟就离开了。频道中的其他成员可能在睡觉、吃饭或暂时离开电脑。因此请提出你的问题并在附近停留一段时间。如果碰巧是周末，一段时间甚至可能长达数天。

  - 不要问能否提问。如果你的问题是关于 Zabbix 的，并且经过深思熟虑，那就直接问吧。以“嘿，我可以问一个关于 Zabbix 的问题吗？”开头会需要有人确认“可以”，然后你再输入问题，只有这样帮助过程才能开始。最终，这会花费更长的时间。

  - 不要太频繁地重复你的问题；这只会惹恼他人。虽然在新成员加入时反复提问可能很诱人，但他们不太可能是你等待的专家，所以再次强调，要有耐心。另一方面，如果长时间没有出现答案——例如一天——通常重复问题是可以的。

  - 不要输入在场人员的姓名，希望能获得帮助。那会不必要地分散他们的注意力。最好等待有人回应。


  关于礼貌，请记住所有通信都被记录并公开可用。如果你表现得难以沟通，不仅会留在人们的记忆中，也会留在日志中。


  Zabbix IRC 频道还有几个自动助手，称为机器人。所有新的错误报告和功能请求都会由它们在频道中宣布，并且它们还有其他功能。目前，当前机器人功能描述在 http://zabbix.org/wiki/Getting_help#IRC_bots。


  不仅最有知识的用户在 Zabbix IRC 频道上可用。该频道也很受欢迎。截至撰写本文时，参与者平均人数约为 300 人。它实际上是关于监控的最受欢迎的 IRC
  频道。位于 http://zabbix.org/zabbix/ 的演示 Zabbix 实例监控频道上的用户数量，从 2006 年到 2016 年中期的图表如下所示：


  ![](img/f5313a804532fabacc8d07cc8607eeba_730_0.png)


  自 2006 年以来，频道上的参与者数量显著增长。你可以通过访问 http://zabbix.org/zabbix/ 并查找主机 Zabbix.org 上的简单图表
  Users in #zabbix on freenode 来访问当前版本。


  ## 使用 Zabbix wiki


  我们刚刚发现的主机演示实例的系统也充当社区平台。主要是一个 MediaWiki 实例，包含大量有用的信息，我们之前也多次引用过它。目前感兴趣的几件事是：


  - Zabbix 模板

  - Zabbix 技术文档，包括 Zabbix 协议文档

  - 各种 Zabbix 指南，包括错误报告指南和 IRC 礼仪

  - Zabbix API 库列表

  - 各种如何操作指南，包括高可用性设置和安装过程的说明


  内容是灵活的，建议不时查看 `http://zabbix.org/wiki/Main_Page` 上有什么可用内容。


  > 本书本应还介绍 Zabbix 网站上提供新功能规范是多么好，但不幸的是，Zabbix 团队决定撤回它们。人们仍可在 `http://zabbix.org/wiki/Category:Specifications`
  找到旧规范。


  作为一个 wiki，每个人都欢迎参与。看到错误或缺少内容？直接去改进它。想为你发现的某个不平凡的过程编写说明？直接创建一个新页面。如果你不确定，只需在 IRC
  上提问，一定会有人帮助。


  > 还有一个 Zabbix 相关资源目录位于 `http://share.zabbix.com`。它并不托管大部分内容；相反，它通常链接到 GitHub 或 Zabbix
  网站页面上的模板或脚本。我们目前不会详细研究它，因为其功能有点有限，但建议不时访问以查看是否有所改进。


  ## 使用 Zabbix 论坛


  Zabbix 论坛位于 `http://www.zabbix.com/forum`。你可以无需注册即可阅读，但要发帖，你需要经过身份验证的访问权限，因此请注册用户账户。论坛提供大量已解决问题的集合，也有机会获得对新问题的帮助。


  虽然我们已经查看了高效且令人满意的沟通的一般建议，但也有一些论坛特定的建议：


  - 为你的问题选择合适的论坛。如果你的问题与 Zabbix 的开发版本有关，不应在关于 Zabbix 网站的论坛中提出。

  - 在创建新主题和在现有主题上评论时要明智选择。强烈不建议在现有主题上提出不同的问题。另一方面，在创建重复主题关于现有问题之前，最好先搜索论坛。

  - 启用新消息通知，以便在需要额外信息时能够及时回复。这将有助于更快地解决问题。


  ## 在跟踪器上提交问题


  如果你发现了一个错误或对如何改进 Zabbix 有一个好主意？Zabbix 使用问题跟踪器来记录这些事项并跟踪解决过程。要访问 Zabbix 问题跟踪器，请导航到
  `https://support.zabbix.com`。在这里，你可以注册并登录以搜索现有报告以及提交新报告。


  在报告新问题时，选择正确的项目——项目 ZBX 用于错误报告，项目 ZBXNEXT 用于新功能请求。强烈建议在提交新报告前搜索跟踪器——也许问题已被报告，无需创建重复报告。


  如果你已自行解决了问题并有一个修复某些错误或实现功能的补丁？只需将其附加到相应的报告即可。你应该在编码之前与 Zabbix 开发者讨论你的方法，除非是最简单的情况——也许他们已经在处理它，或者你的方法可能会与正在开发的其他功能冲突。确保也熟悉编码指南——它们可在
  `http://zabbix.org/wiki/Main_Page` 获取。


  > 还有一个补丁仓库位于 `https://github.com/zabbix/zabbix-patches`，但它是否会变得流行还有待观察。


  ![](img/f5313a804532fabacc8d07cc8607eeba_732_0.png)


  ## 面对面会面


  所有讨论过的渠道对于与其他 Zabbix 用户沟通、获得帮助和帮助他人都很棒。但也有各种面对面会面的方式。一个非常受欢迎且很棒的年度活动是 **官方 Zabbix
  大会**，但也有当地社区组织的各种非正式活动。


  ## Zabbix 大会


  官方 Zabbix 大会是一个很棒的活动。它首次于 2011 年组织，通常在九月举行。这是了解 Zabbix 最新动态、向许多非常有创意的 Zabbix 用户学习并获得一些乐趣的机会。它在
  Zabbix 的诞生地和家乡举行——拉脱维亚的里加。有两天充满有趣的演讲，Zabbix 团队努力让每个人都感到受欢迎。如果你有机会，务必尝试参加此活动。






  ## 本地社区


  你所在的本地社区或许也会组织起来。请查看 `http://zabbix.org/wiki/Usergroups` 上列出的各种沟通渠道。加入用户组，关注新闻，甚至可能帮忙组织活动。也请不要犹豫，将新的国家添加到列表中。


  ## 跟进开发进度


  你是否在IRC上看到某个有趣的新功能并想尝试一下？也许你想查看某个具体更改是如何实现的，或者了解其设计方式上的评论。又或者，你想生成一个补丁，该补丁依赖于开发版本中正在进行的一些更改。Zabbix的许多开发工作都是公开进行的，人们可能感兴趣的主要阶段有：


  - 规范正在制定中

  - 开发在独立的功能分支中启动

  - 功能被合并到主分支


  > 之前，规范在 `http://zabbix.org/wiki/Main_Page` 上是公开的；现在，它们已经不再可用了。


  尽早提供反馈最有可能有帮助，并且更有可能影响设计。如果你对某个特定功能感兴趣，以前可以在 `http://zabbix.org/wiki/Main_Page`
  上跟进规范，但现在这个阶段已经关闭了。Zabbix使用SVN进行代码版本管理。SVN中的功能分支可以让你非常早地接触到代码，这是试用和测试功能的好时机。


  我们讨论了测试的事情；接下来让我们了解如何获取尚未作为版本发布的代码。


  ## 获取源代码


  要获取Zabbix开发版本，有两种方式，每种方式都有其优缺点。


  ## 每日快照


  在Zabbix开发下载页面 `http://www.zabbix.com/developers.php` 上，提供了开发版本的每日快照。这些快照通常与发布版本具有相同的安装步骤。使用每日快照的好处包括：


  - 只需简单下载即可获取

  - 源代码归档已为你生成


  缺点包括：


  - 无法只更新开发版本中实际更改的部分

  - 无法轻松查看实际更改的内容

  - 你无法访问功能分支

  - 无法获取任意较旧的版本


  如果你只想简单、一次性了解Zabbix开发的进展，建议使用每日快照。


  ## 访问版本控制系统


  如果你计划长期跟进Zabbix开发，或者想查看某个具体更改是如何实现的，每日快照很快就会变得不便使用。功能分支没有快照，因此如果功能尚未合并到主分支，我们必须使用SVN。


  > 你也可以通过 `https://www.zabbix.org/websvn/wsvn/zabbix.com` 上的WebSVN实例浏览官方SVN仓库。它不允许你进行本地检出，但若要快速查看几个文件，可能更方便。


  要访问SVN仓库，需要特定的软件——客户端。针对不同平台有许多不同的SVN客户端，你可以选择最方便的那一个。在这里，我们将使用官方的命令行客户端。由于这个客户端几乎在所有Linux发行版上都可用，我们可能希望在Zabbix测试服务器上使用它。但在开始使用之前，我们必须知道Zabbix源代码仓库位于https://svn.zabbix.com/。在SVN中，开发通常分为主干和分支。主干代表最新的开发工作，而分支通常用于稳定版本的维护。Zabbix采用相同的模式，有用于稳定版本维护的分支（如3.0），而下一个稳定版本的开发则发生在开发部分，即主干中。不过，更改不会立即出现在版本分支或主干中——它们首先在开发分支中实现，这些开发分支通常位于svn://svn.zabbix.com/branches/dev/ZBX-1，末尾带有正确的ZBX或ZBXNEXT问题编号。


  假设我们对最新功能感兴趣，想要获取主干。为此，请运行以下命令：


  ```

  $ svn checkout svn://svn.zabbix.com/trunk zabbix-trunk

  ```


  这将检索主干中的所有文件，并将它们放入名为zabbix-trunk的目录中。在撰写本文时，Zabbix主干的检出在磁盘上占用约118 MB，但通过网络传输的数据量将小于此值。一旦该过程完成，你可能会想继续进行编译，但这并不容易，因为根本没有配置脚本。有一个方便的脚本可以用来生成配置：


  ```

  $ ./bootstrap.sh

  ```


  此操作完成后，我们应该就有了配置脚本。现在，我们可以编译这个Zabbix开发版本了，对吗？还不行。开发仓库只包含通用的数据库模式和内容描述，因此我们无法创建数据库。我们必须自己生成实际的模式和数据文件。对于Zabbix前端，也需要生成特定的CSS文件。还建议创建一个包，就像可以从Zabbix网站下载的那些包一样，所以让我们这样做。不过，在生成数据库模式和包之前，我们必须使用配置脚本。但我们可以通过省略任何不需要的功能来加快速度并减少依赖。这还使得可以在另一台没有安装所需功能（如SNMP或IPMI监控）的全部依赖的机器上创建Zabbix包。在最简单的情况下，运行：


  ```

  $ ./configure

  ```


  这将生成数据库模式和包生成所需的文件。现在，我们可以继续生成模式和CSS：


  ```

  $ make dbschema

  ```


  ```

  $ make css

  ```


  > 我们在第1章“Zabbix入门”中讨论了编译所需的包。对于make css步骤，你还需要Sass Ruby gem。


  生成数据库模式和CSS文件后，我们就可以创建包了：


  ```

  $ make dist

  ```


  此命令完成后，源代码目录中应该会有一个新的归档文件，名为zabbix-<version>.tar.gz。这里的version就是开发部分所获得的名称。从现在开始，我们又回到了熟悉的路径，因为这个包与你可以从发布版本区域或每日快照区域下载的包几乎相同。


  但为了获得我们本可以直接下载的东西，这做了很多工作——到底为什么要这么做呢？确实，如果你只想获取一次开发版本，每日快照应该是你的选择。但SVN检出还有其他好处。让我们来了解一下这些好处。


  ## 查看变更集


  对仓库的一组更改称为变更集。已经放入仓库的变更集被称为已提交。我们可以列出已提交的变更集。例如，如果我们想知道提交到仓库此部分的最后一个变更集是什么，可以运行以下命令：


  ```

  $ svn log -r PREV:HEAD

  ```


  -r Subversion选项允许我们指定修订版本——每个更改的数值表示。PREV和HEAD是特殊的引用，分别表示上一个版本和最新版本。有时，我们可能会被指示测试或使用特定版本，称为修订版本。在这种情况下，可以通过运行以下命令来获取它：


  ```

  $ svn up -r 1234

  ```


  将1234替换为你被告知使用的修订版本号。这会将整个检出更新到该修订版本，你现在应该再次运行前面讨论过的命令，重复刚检出后所执行的相同过程。但有时，我们可能只需要将一个或几个文件更新到特定修订版本——这可以通过指定路径来完成，例如：


  ```

  $ svn up -r 1234 frontends/php/history.php

  ```


  你可以同时指定目录和文件，获取不同的修订版本，以测试行为变化或找到导致问题出现的具体更改。


  因此，你已经试用过开发版本，可能还有几个修订版本。一段时间后，你决定查看主干中做了哪些更改。首先，应该确定当前修订版本。在检出目录中，运行以下命令：


  ```

  $ svn info

  ```


  查找类似这样的行：


  ```

  Revision: 60013

  ```


  有了这个编号，现在是时候将本地副本更新到最新版本了。在本地副本目录中，运行：


  ```

  $ svn up

  ```


  这将更新所有相对于你现有副本已发生变化的内容。由于只拉取更改，与反复下载每日快照相比，下载的数据量要少得多。现在，你可以像之前讨论的那样继续构建Zabbix，也可以选择查看开发人员提交的确切更改：


  ```

  $ svn log -r 60000:HEAD

  ```


  该命令将显示推送到代码仓库的确切更改，以及开发人员决定添加的任何评论。这可以用来确定具体更改了什么。但以上所有内容都是关于面向未来的开发版本（主干）——如果你想查看针对稳定版本中某个问题的特定错误修复应用到那个特定分支的情况，该怎么办？就像我们从代码仓库获取主干一样，我们也可以获取分支：


  ```

  $ svn checkout svn://svn.zabbix.com/branches/3.0

  ```


  我们现在指定的是分支部分，而不是主干。其后是特定的分支，可以是任何有效的分支。有哪些分支？我们可以列出它们：


  ```

  svn ls svn://svn.zabbix.com/branches

  ```




  参与翻译工作的具体步骤和流程可能会发生变化，因此我在此不予复述。请前往 http://zabbix.org/wiki/Translating_Zabbix 并按照其中的步骤操作。这很可能包括在
  http://zabbix.org/wiki/Main_Page wiki 上注册，将自己添加到译者表中，订阅译者邮件列表，并在 Pootle 上申请权限。后者最好在
  Zabbix IRC 频道上完成，那也是询问如何参与以及翻译流程问题的最佳去处。


  ## 商用支持选项


  社区支持很棒。它通常迅速、正确且友好。然而，即使一直如此，也可能出现需要更正式方式的情况。寻求正式协议的常见情况包括以下内容：


  - 公司政策要求所有投入生产系统的系统都必须有支持协议

  - 你希望在实施 Zabbix 时获得合格的帮助

  - Zabbix 安装将由并非深度参与且对它没有很好专业知识的人员管理

  - 你需要开发或改进某些功能


  在这种情况下，联系商业支持提供商通常是最好的解决方案，并且可以从 Zabbix 软件背后的公司获得此类支持。访问 Zabbix 网站 http://www.zabbix.com/support.php
  以获取更多信息。如果你准备更详细地讨论商业支持，只需发送电子邮件至 sales@zabbix.com 即可。在撰写本文时，销售团队非常专业、乐于助人且友好——而且通常回复速度也极快。我没有任何利益冲突或个人利益；这是完全真实和诚实的推荐。


  在某些情况下，公司采购要求可能强制你使用本地公司作为支持协议——http://www.zabbix.com/partners.php 上的合作伙伴和经销商列表应有助于你选择一个地理位置更近的公司。

