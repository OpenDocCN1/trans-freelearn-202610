  \n完成后，点击**更新**。在浏览器 2 中，只需刷新主机**配置**选项卡——它应该会显示两台主机：**SNMP 设备**和 **snmptraps**，**advanced_user**\
  \ 可以配置这两台主机。\n\n突然，我们注意到通过这种方式，我们已授予了 `snmptraps` 主机配置访问权限，而我们将其视为一个重要的主机，不应该被乱动，而且我们的两个用户无论如何都不应该拥有对它访问权限。我们如何在不将其移出\
  \ **SNMP 设备** 组的情况下轻松限制对该主机的访问呢？\n\n在浏览器 1 中，导航到**配置 | 主机组**，点击**创建主机组**。输入以下详细信息：\n\
  \n- **组名：** 输入 `Important SNMP hosts`\n- **主机：** 使用**组**下拉列表筛选**其他主机**列表框，以显示 **SNMP\
  \ 设备**，选择 `snmptraps`，然后点击**◀**按钮\n\n完成后，点击**添加**。\n\n打开**管理 | 用户组**，点击**名称**列中的**我们的用户**，切换到**权限**选项卡。在组详细信息中，点击**拒绝**框下方的**添加**按钮。在出现的窗口中，勾选**重要\
  \ SNMP 主机**旁边的复选框，点击**选择**，然后点击**更新**按钮。\n\n现在是时候看一下浏览器 2 了。它应该仍显示包含两台主机的主机配置。刷新列表，`snmptraps`\
  \ 主机将消失。经过我们的更改后，`advanced_user` 仅拥有对 **SNMP 设备** 主机的配置访问权限，并且对 `snmptraps` 主机的监控将完全没有访问权限，因为我们使用了拒绝。对于\
  \ `monitoring_user`，没有任何变化——之前就没有 **SNMP 设备** 组的访问权限。\n\n\n\n\n## 权限与维护\n\n本章中我们查看的维护配置以其自身的方式遵循主机组权限的规则。主机组权限会影响\
  \ Zabbix 管理员配置维护条目的方式：\n\n- Zabbix 管理员可以创建新的维护条目，并包含其具有写入权限的主机组和主机\n- Zabbix 管理员可以编辑现有的维护条目，前提是其对该维护条目中包含的所有主机和主机组都具有写入权限\n\
  \n### 总结\n\n我们探索了 Zabbix 中主机属性的另一个方面：主机清单。主机清单可以手动填充，但其更有用的方面是能够从任何项目接收值到任何清单字段中。这仍然允许手动编辑不从项目接收值的清单字段。\n\
  \n主机和主机组维护允许我们按每日、每周和每月的基础创建一次性或循环的维护条目。处于维护中的主机上的问题在前端中以视觉方式区分，并且在许多视图中，我们也可以选择完全不显示此类问题。\n\
  \n重要的是记住 Zabbix 中权限的主要规则：\n\n- 权限只能分配给用户组\n- 权限只能授予主机组\n\n这意味着对于复杂的权限方案，你可能需要在开始随意操作之前进行一些规划。我们也可以安全地说，为了避免未来的神秘问题，每个主机都应至少属于一个主机组，每个用户都应至少属于一个用户组。此外，有两个因素结合起来决定了有效权限：为组设置的权限和用户类型。我们可以尝试总结这两个因素的交互：\n\
  \n| Permissions | Zabbix User | Zabbix Admin | Zabbix Super Admin |\n|---|---|---|---|\n\
  | Read-write | Read only | Full | Full |\n| Read only | Read only | Read only |\
  \ Full |\n| Deny | None | None | Full |\n\n## 管理主机、用户和权限\n\n从这张表可以看出，Zabbix Super\
  \ Admin 用户类型无法被拒绝任何权限。另一方面，Zabbix User 不能被授予写入权限。尽管如此，仍然非常重要地记住，在此时，他们可以通过 Zabbix\
  \ API 获得写入权限。\n\n有了这些知识，你应该能够对主机进行分组并管理主机清单和主机维护，以及创建和组、用户，并分配细粒度的权限。\n\n在下一章中，我们将研究一种检查项目值是否表示问题的方法。虽然我们有项目收集数据，但在\
  \ Zabbix 中，项目不用于配置阈值或检测不良值的任何其他信息。项目只要值到达就不会关心值是什么。为了定义什么是问题，使用了一个单独的配置实体，称为触发器。触发器逻辑以表达式形式编写，可以从非常简单的阈值到相当复杂的逻辑表达式。\n\
  \n## 使用触发器检测问题\n\n我们已经获得了关于可以使用项目收集何种信息的相当全面的知识。然而，到目前为止，我们只积极监控了一件事——我们只创建了一个触发器（我们在\
  \ *第 2 章，获取你的第一个通知* 中创建了它）。触发器可以做更多。让我们回顾一下触发器是什么。\n\n触发器定义了何时将条件视为值得关注。它“触发”（即变为活动状态），当项目数据或其缺失与特定条件匹配时，例如系统负载过高或可用磁盘空间过低。\n\
  \n让我们现在更详细地探索这两个概念。在本章中，我们将：\n\n- 进一步了解触发器与项目之间的关系\n- 发现触发器依赖关系\n- 构建触发器表达式\n- 了解\
  \ Zabbix 前端上使用全局脚本的基本管理功能\n\n### 触发器\n\n触发器是可以触发的东西。它们查看项目数据，并在数据不符合已定义条件的任何条件时发出标志。正如我们之前讨论的，仅仅收集数据是好的，但非常不足。如果想要任何过去的历史数据收集，包括通知，就必须有人一直查看所有数据，因此我们必须定义阈值，在这些阈值下我们希望条件被视为值得关注。触发器提供了一种定义这些条件的方法。\n\
  \n之前，我们创建了一个检查 A test host 上系统负载的触发器。它检查返回的值是否大于定义的阈值。现在，让我们检查服务器可能出现的一些其他问题，例如服务宕机。SMTP\
  \ 服务宕机可能很重要，因此我们将尝试现在寻找这种情况的发生。导航到 Configuration | Hosts，点击任意一个 Triggers 链接，然后点击\
  \ Create trigger 按钮。在打开的表单中，我们将填写以下值：\n\n- **Name**：此字段的内容将在大多数地方用于标识触发器，因此应可读。\
  \ 这次，输入 `SMTP service is down`。注意我们描述的是实际问题。与收集状态的项目不同，触发器有一个特定的条件要检查；因此名称反映了这一点。如果我们有一个主机不应该运行\
  \ SMTP 服务，我们可以创建一个名为 `SMTP service should not be running` 的触发器。\n- **Expression**：这可能是触发器的最重要属性。检查什么以及检查什么条件将在此处指定。触发器表达式可以从非常简单到复杂。这次，我们将创建一个简单的，并利用前端的帮助。为此，点击\
  \ Expression 字段旁边的 Add 按钮以打开表达式构建对话框。它也有多个字段需要填写，让我们看看它们是什么：\n  - **Item**：在这里，我们可以指定应检查哪个项目数据。为此，点击\
  \ Select 按钮。另一个弹出窗口将打开。从 Group 下拉菜单中选择 Linux servers，然后从 Host 下拉菜单中选择 Another host。我们对\
  \ SMTP 服务感兴趣，因此点击 NAME 列中的 SMTP server status。弹出窗口将关闭，Item 字段将被填充所选项目的名称。\n  - **Function**：在这里，我们可以选择要执行的实际测试。也许我们可以回忆一下\
  \ SMTP 服务器状态项目的值——对，1 表示服务器正在运行，0 表示服务器宕机。如果我们想检查最后的值是否为 0，默认函数 Last（最近）似乎非常合适，因此我们不会更改它。\n\
  \  - **Last of (T)**：这是函数参数，如果函数支持时间段。我们在第一个触发器中使用了 180 秒来检查之前的 3 分钟内的值，但在取最后一个项目值时，时间段将毫无意义。\n\
  \  - **Time shift**：我们将在本章后面的 Relative thresholds or time-shift 部分讨论此功能。\n\n在继续之前，请确保\
  \ SMTP 服务器在 Another host 上正在运行，然后点击 Add。让我们现在在概览中看看它是什么样的：转到 Monitoring | Overview，并确保\
  \ Type 下拉菜单已选择 Triggers。然后展开过滤器，在 Triggers status 下拉菜单中选择 Any，然后点击 Filter：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_222_0.png)\n\
  \n太好了，我们可以看到两个主机现在都定义了触发器。由于触发器不同，我们还有两个未使用的单元格：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_222_1.png)\n\
  \n让我们更详细地查看触发器表达式。它以一个左大括号开头，第一个参数是主机名。用冒号分隔的是项目键——这里是 net.tcp.service[smtp]。项目键必须与项目配置中完全一致，包括任何空格、引号和大小写。在确切的项目键之后是一个点作为分隔符，其后是更有趣且特定于触发器的内容：触发器函数。这里使用的是最常见的函数之一\
  \ last()。它始终从项目历史中返回单个值。有些触发器函数需要传递至少一些参数，但对于 last() 函数，这不是必需的，如果第一个参数只是数字，则会被忽略。\n\
  \n> Zabbix 的旧版本要求即使会被忽略也必须传递一些参数。看到 last(0) 这样的语法仍然很常见。因此，last(300) 与 last(0) 和\
  \ last() 相同——它们都为一个项目返回单个最后一个值。\n\n\n\n\n\n另一方面，如果第一个参数是一个以哈希前缀的数字，则不会被忽略。在这种情况下，它的工作方式类似于\
  \ nth 值指定符。例如，last (#9) 将检索最近的第 9 个值。正如我们所见，last (#1) 等于 last (0) 或 last ()。另一个重叠的函数是\
  \ prev。正如名称可能暗示的那样，它返回前一个值；因此，prev() 与 last (#2) 相同。\n\n> 主机名、项目键、触发器函数、运算符——它们都区分大小写。\n\
  \n继续触发器表达式，花括号被关闭以表示检索某个值的字符串，即主机和项目引用，后跟触发器函数。然后我们有一个运算符，在本例中是一个简单的等号。这里的比较是与一个常量数字\
  \ 0 进行的。\n\n> 如果将项目历史设置为 0，则不会存储任何值，也不会评估任何触发器，即使这些触发器仅检查最后一个值。这与 Zabbix 的早期版本不同，在早期版本中，仅引用最后一个值的触发器仍然有效。\n\
  \n## 触发器与项目关系\n\n你可能已经注意到，Zabbix 中的项目不包含任何关于数据质量的配置——如果 CPU 负载值到达，项目不会关心它们是 0 还是\
  \ 500。任何问题条件的定义都发生在触发器中，无论是简单的阈值还是更复杂的情况。\n\n当我们创建此触发器时，我们可以点击任何 Triggers 链接，但我们在选择项目时注意到了下拉菜单中选择的宿主。实际上，只要在该弹出窗口中选择了正确的宿主或我们手动输入了正确的宿主机名，我们点击哪个\
  \ Triggers 链接并不重要。\n\n> 触发器不像项目那样属于某个主机。触发器与它引用的项目的任意数量的主机相关联。\n\n如果我们为主机 A 点击了\
  \ Triggers，然后为该触发器选择了来自主机 B 的项目，则创建的触发器不会出现在主机 A 中，但会出现在主机 B 中。\n\n![](img/f5313a804532fabacc8d07cc8607eeba_225_0.png)\n\
  \n这会插入 `{Another Host:net.tcp.service[http,,80].last()}=0` 表达式：\n\n- **严重性：** 平均\n\
  - **描述：** 触发器表达式可能会变得非常复杂。有时，复杂性会使人们在没有认真剖析的情况下无法理解触发器 supposed to do 的含义。注释提供了一种帮助他人或自己在以后理解此类复杂表达式背后的思路的方法。虽然我们的触发器仍然非常简单，但我们可能想要解释依赖关系的理由，因此输入类似\
  \ `Web service goes down if SMTP is inaccessible.` 的内容。\n\n现在，切换到 **Dependencies**\
  \ 选项卡。要配置 Web 前端对 SMTP 服务的依赖，请点击 **Dependencies** 部分中的 **Add** 链接。在 resulting 窗口中，确保在\
