  \n我们的 testfile 触发器对链式依赖按预期工作，因此我们可以现在移除该依赖。转到 Configuration | Hosts，点击 Another host\
  \ 旁边的 Triggers，然后在 NAME 列中点击 SMTP service is down 触发器。切换到 Dependencies 选项卡，点击 ACTION\
  \ 列中的 Remove，然后点击 Update 按钮。请注意，你始终需要在任何实体的编辑表单中保存更改。在这种情况下，仅仅移除依赖关系是不够的。如果我们在没有明确更新触发器的情况下导航到其他部分，任何修改都将丢失。现在，你也可以重新启动“Another\
  \ host”上停止的任何服务。\n\n## 构造触发器表达式\n\n到目前为止，我们只使用了非常简单的触发器表达式，将最后一个值与某个常量进行比较。幸运的是，这并不是触发器表达式所能做的一切。我们现在将尝试创建一个稍微复杂一点的触发器。\n\
  \n\n\n\n假设我们有两台服务器：A test host 和 Another host，它们提供冗余的 SSH 文件传输协议（SFTP）服务。我们关心的是其中任意一个服务宕机的情况。导航到“配置\
  \ | 主机”，点击 A test host 或 Another host 旁边的“触发器”，然后点击“创建触发器”按钮。输入以下值：\n\n- **名称：**\
  \ 一个 SSH 服务已宕机。\n- **表达式：** 点击“添加”按钮。在弹出的窗口中，点击“监控项”字段旁边的“选择”按钮。确保在“主机”下拉列表中选择了\
  \ Another host，在“名称”列中点击“SSH server status”监控项，然后点击“插入”。现在，将光标放在插入的表达式末尾，输入不带引号的\
  \ ` or `（即空格、or、空格）。再次点击“添加”按钮。在弹出的窗口中，点击“监控项”字段旁边的“选择”按钮。从“主机”下拉列表中选择 A test host，在“名称”列中点击“SSH\
  \ server status”监控项，然后点击“插入”。\n- **严重性：** 一般严重（记住，这些是冗余服务）。\n\n最终触发器表达式应如下所示：\n\n\
  ```text\n{Another host:net.tcp.service[ssh].last()}=0 or {A test host:net.tcp.service[ssh].last()}=0\n\
  ```\n\n完成后，点击底部的“添加”按钮。\n\n> 在 Zabbix 2.4 之前的版本中，使用管道符 `|` 代替小写的 `or`。\n\n我们在这里遵循的过程使我们能够创建比简单比较单个监控项的值更复杂的表达式。而是比较两个值，如果其中任何一个匹配比较条件，触发器就会触发。这就是\
  \ `or` 运算符的作用。另一个逻辑运算符是 `and`。以 SSH 服务器为例，我们可以创建另一个触发器，当两个 SSH 实例都宕机时触发。构建这个表达式很简单，因为我们只需修改这一个运算符，即将\
  \ `or` 改为 `and`，使得表达式如下：\n\n```text\n{Another host:net.tcp.service[ssh].last()}=0\
  \ and {A test host:net.tcp.service[ssh].last()}=0\n```\n\n> 触发器表达式运算符区分大小写，因此 `AND`\
  \ 不是有效运算符——应使用小写的 `and`。\n\n触发器表达式还支持其他运算符。在我们创建的所有触发器中，我们都使用了最常见的运算符：等于运算符 `=`。我们还可以使用不等于运算符\
  \ `<>`。这样我们可以反转表达式，如下所示：\n\n```text\n{A test host:net.tcp.service[ssh].last()}<>1\n\
  ```\n\n> 在 Zabbix 2.4 之前的版本中，使用井号 `#` 代替 `<>` 表示“不等于”比较。\n\n虽然在这种情况下并不实用，但当监控项可能包含多个值，并且我们希望触发器在值不是预期值时触发时，这样的触发器很有用。\n\
  \n触发器表达式还支持标准数学运算符 `+`、`-`、`*` 和 `/`，以及比较运算符 `<`、`>`、`<=` 和 `>=`，因此可以在监控项数据和常量之间进行复杂的计算和比较。\n\
  \n让我们使用不同的函数创建另一个触发器。在前端部分的“配置 | 主机”中，从“组”下拉列表中选择 Linux servers，点击 A test host 旁边的“触发器”，然后点击“创建触发器”按钮。接着，输入以下值：\n\
  \n- **名称：** `Critical error from SNMP trap`\n- **表达式：** `{A test host:snmptrap.fallback.str(Critical\
  \ Error)}=1`\n- **严重性：** 严重\n\n完成后，点击底部的“添加”按钮。\n\n这次，我们使用了另一个触发器函数 `str()`。它会在监控项数据中搜索指定字符串，如果找到则返回\
  \ 1。匹配区分大小写。\n\n只要监控项的最新值不包含作为参数指定的字符串，此触发器就会变为 OK 状态。如果我们想手动强制触发器回到 OK 状态，只需发送一个不包含触发器正在查找的字符串的\
  \ trap。当其他系统发送 SNMP trap 时，手动发送成功值也可能很有用。如果问题 trap 已成功接收，但恢复 trap 丢失（由于网络连接问题或任何其他原因），您可能希望使用这样一个伪\
  \ trap 使相关触发器回到 OK 状态。如果使用内置的 trap 处理功能，只需将 trap 信息添加到临时文件即可。如果使用带有 Zabbix trapper\
  \ 监控项的脚本化解决方案，可以使用 `zabbix_sender`。SNMP trap 管理已在第 4 章“监控 SNMP 设备”中讨论。\n\n## 防止触发器抖动\n\
  \n对于我们编写的服务监控项和触发器，一旦检测到服务宕机，触发器就会立即触发。如果我们知道某些服务在升级期间会因日志轮转或备份需求而短暂宕机，这可能是不希望出现的。在这种情况下，我们可以使用不同的函数来实现延迟反应。将\
  \ `last()` 函数替换为 `max()`，我们可以指定一个参数，从而仅在监控项数值在一段时间内持续表明有问题时才做出反应。要使触发器仅在服务 5 分钟未响应时才触发，我们可以使用如下表达式：\n\
  \n```text\n{A test host:net.tcp.service[ssh].max(300)}=0\n```\n\n> 要使此示例正常工作，监控项间隔不能超过\
  \ 5 分钟。如果监控项间隔超过触发器函数的检查时间，则只会检查单个值，这使得使用像 `max()` 这样的触发器函数毫无用处。\n\n请记住，对于接受秒作为参数的函数，我们还可以通过在数字前加上\
  \ `#` 来使用返回值的数量，如下所示：\n\n```text\n{A test host:net.tcp.service[ssh].max(#5)}=0\n\
  ```\n\n在这种情况下，触发器将始终检查最后返回的五个值。这种方法允许在监控项间隔改变时，触发器周期也相应扩展，但不应将其用于可能停止发送数据的监控项。\n\
  \n使用触发器函数是解决潜在触发器抖动的最简单、最常用的方法。前面的服务示例检查过去 5 分钟内的最大值为 0；因此，我们确定不存在值为 1 的情况，而值为 1\
  \ 意味着“服务正常”。\n\n对于我们的 CPU 负载触发器，我们使用了 `avg(180)` 函数，检查过去 3 分钟的平均值。我们也可以使用 `min(180)`——在这种情况下，即使整体平均值高于阈值，单次降到阈值以下也会重置\
  \ 3 分钟计时器。该用哪个？这完全取决于您，取决于功能需求。没有一种方法总是优于其他方法。\n\n## 检查缺失数据\n\n有些监控项总是需要提供值，例如 CPU\
  \ 负载监控项。此监控项的问题条件通常是“值过大”。但有些监控项则不同，例如键为 `agent.ping` 的监控项。该监控项只告诉我们 agent 对服务器是否可用，并且只有当\
  \ agent 在线时才返回 1。是的，仅此而已——当 agent 宕机时，它不会发送 0；它根本没有值。我们不能使用 `last()` 函数编写触发器，因为最后一个值始终是\
  \ 1。`min()`、`max()` 和 `avg()` 也是如此。幸运的是，在这种情况下我们可以使用一个函数：`nodata()`。当监控项在一段时间内缺少数据时，该函数允许触发器触发。例如，如果我们在“A\
  \ test host”上创建了一个 `agent.ping` 监控项，触发器可能如下所示：\n\n```text\n{A test host:agent.ping.nodata(300)}=1\n\
  ```\n\n这里，`nodata()` 函数检查该监控项是否在 300 秒（即 5 分钟）内缺少数据。如果是，触发器将触发。这里的 1 表示什么意思？Zabbix\
  \ 中的所有触发器函数都会返回某个数字。如果监控项缺少数据，`nodata()` 函数返回 1；如果在指定时间段内至少有一个值，则返回 0。请注意，尝试猜测某个触发器函数有哪些返回值可能不是一个好主意——如果您不确定，最好查看手册中的详细信息：https://www.zabbix.com/documentation/3.0/manual/appendix/triggers/functions。\n\
  \n`nodata()` 函数被称为基于时间（time-based）的函数。“普通”触发器函数在监控项收到新值时才被评估。这对于针对诸如我们之前创建的 CPU\
  \ 负载监控项之类的触发器非常有意义——当值到达时，我们将其与阈值进行比较。但是，这对于我们的 `agent.ping` 监控项效果不佳。如果值持续流入，一切都会很好——触发器表达式会被评估，该函数会返回\
  \ 0。如果值停止流入，该函数将不会被评估，也永远不会触发。然后，如果新值到达，该函数会被评估，看到新值后就会宣布一切正常。\n\n因此，在这种情况下，该触发器不会仅在新值到达时才被评估。相反，此函数每\
  \ 30 秒评估一次。这个间隔是硬编码的。更具体地说，任何在表达式中至少包含一个基于时间的函数的触发器都会每 30 秒重新计算一次。对于 30 秒的间隔，`nodata()`\
  \ 函数的参数永远不应低于 30。为了安全起见，切勿使用低于 60 秒的参数。在 Zabbix 3.0.0 版本中，以下触发器函数是基于时间的：\n\n- `date()`\n\
  - `dayofmonth()`\n\n\n\n\n\n- `dayofweek()`\n- `nodata()`\n- `now()`\n- `time()`\n\
  \n如果使用更高版本，请参阅 Zabbix 手册——这个列表可能会有变化。\n\n## 超时触发器\n\n有些系统在发生故障时会发送 trap，但不会发送恢复\
  \ trap。在这种情况下，手动重置每一个单独的事件并不是一种选项。幸运的是，我们可以利用刚刚讨论过的函数 `nodata()` 来构造一个超时的触发器表达式。下面这个表达式会让\
  \ PROBLEM 状态在 10 分钟后超时：\n\n```\n{Another host:snmptrap.fallback.str(Critical Error)}=1\
  \ and\n{Another host:snmptrap.fallback.nodata(600)}=0\n```\n\n目前，我们希望对触发器的触发方式进行更精确的控制，所以我们不会把触发器表达式改成像上一个示例那样。\n\
  \n注意，给触发器添加 `nodata()` 函数会使其每 30 秒重新评估一次。如果大量触发器都这样做，可能会对 Zabbix 服务器的性能产生显著影响。\n\
  \n## 具有自适应阈值的触发器\n\n有些被监控的指标，即使以百分比而非绝对值来度量，也会因为值的可能范围不同，对阈值有着相当不同的需求。例如，当磁盘容量可能从几十兆字节到数百太字节甚至拍字节不等时，使用字节作为磁盘空间触发器的单位就不会太好用。运用我们所掌握的触发器表达式知识，我们可以根据磁盘的总容量来调整阈值。为此，我们需要同时监控空闲磁盘空间和总磁盘空间：\n\
  \n```\n(\n    {host:vfs.fs.size[/,total].last()}<=100GB\n    and\n    {host:vfs.fs.size[/,pfree].last()}<10\n\
  ) or (\n    {host:vfs.fs.size[/,total].last()}>100GB\n    and\n    {host:vfs.fs.size[/,pfree].last()}<5\n\
  )\n```\n\n我们也可以让这个触发器忽略周末的早晨：\n\n```\n{A test host:system.cpu.load.avg(180)}>1 and\n\
  {A test host:system.cpu.load.dayofweek()} >5 and\n{A test host:system.cpu.load.time()}<100000\n\
  ```\n\n这里，我们检查星期值是否大于 5（其中 6 和 7 分别代表周六和周日）。此外，还用到了触发器函数 time()。该函数返回 HH:MM:SS 格式的时间，因此我们的比较可以确保当前时间还未到\
  \ 10:00:00。\n\n注意，这种方法会完全阻止触发器触发，因此我们不会收到告警，不会在前端看到触发器，也不会生成任何事件。\n\n我们还会在*第 7 章，根据监控条件采取行动*中讨论一种基于时间限制告警本身的方法。\n\
  \n## 相对阈值或时间偏移\n\n通常，触发器函数查看最新值——last() 获取最后一个值，而 min()、max() 和 avg() 则查看从当前时刻往前计算的指定时间段。对于某些函数，我们还可以指定一个额外的参数，称为*时间偏移*。这会使函数表现得就像我们回到了过去；在其他方面，它的工作方式完全相同。这允许我们实现的一个特性是创建具有相对阈值的触发器。对于\
  \ CPU 负载触发器，我们可以不使用固定的值（如 1、5 或 10），而是让它在负载与过去某个时间段相比有所增加时触发：\n\n```\n{A test host:system.cpu.load.avg(3600)}\
  \ /\n{A test host:system.cpu.load.avg(3600,86400)}\n>3\n```\n\n在这个示例中，我们修改了正在评估的时间段——它增加到了\
  \ 1 小时。我们不再将结果与固定阈值进行比较；而是查看过去某个时间段的平均值——具体来说，是 86400 秒，即一天之前。从功能上讲，这个表达式检查的是：最后一小时的平均\
  \ CPU 负载是否超过一天前同一小时的平均 CPU 负载的 3 倍以上。\n\n这样一来，CPU 负载可以是 1、5 或 500——这个触发器不关心绝对值，只关心它是否增加了\
  \ 3 倍以上。\n\n我们使用的 avg() 函数的第二个参数是时间偏移。为了理解它是如何获取值的，假设我们添加了一个新的监控项，并将时间偏移设置为 1 小时。现在是\
  \ 13:00:00，该监控项收到了一个新值。我们在过去一小时内已有值：12:10:00、12:20:00，依此类推，一直到 12:50:00。1 小时的时间偏移将根本获取不到任何值，因为它会先倒退\
  \ 1 小时到 12:00:00，然后查找 1 小时前的所有值——但我们拥有的第一个值是在 12:10:00：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_238_0.png)\n\
  \n从 Zabbix 3.0.0 版本起，以下函数支持时间偏移参数：\n\n- avg()\n- band()\n- count()\n- delta()\n\
  - last()\n- max()\n- min()\n- percentile()\n- sum()\n\n> 触发器始终基于历史数据运行，绝不基于趋势数据。如果历史数据只保留一天，就不应使用一天的时间偏移，因为在评估时可能会遗漏一些值。\n\
  \n## 校验系统时间\n\nZabbix 可以校验各种各样的项目，其中之一就是被监控系统上的当前时间。让我们快速创建一个配置来实现这个功能。我们将创建一个监控项来收集当前时间，然后创建一个触发器，将该时间与\
  \ Zabbix 服务器上的当前时间进行比较。当然，要使其正常工作，Zabbix 服务器上的时钟必须准确——否则，我们反而会抱怨所有其他系统的时间不正确。\n\n\
  首先需要创建收集当前时间的监控项。转到 **配置 | 主机**，点击 **Another host** 旁边的**监控项**，然后点击**创建监控项**。填写以下值：\n\
  \n- **名称：** `Local time`\n- **键值：** `system.localtime`\n- **单位：** `unixtime`\n\n\
  完成后，点击底部的**添加**按钮。该监控项返回当前时间的 Unix 时间戳。虽然我们的触发器并不要求设置单位，但我们在那里输入了 unixtime。这会将时间戳在前端转换为人类可读的值。我们在*第\
  \ 3 章，使用 Zabbix Agent 和基础协议进行监控*中更详细地讨论了监控项单位。\n\n在监控项列表上方的栏中，点击**触发器**，然后点击**创建触发器**按钮。输入以下值：\n\
  \n- **名称：** `Incorrect clock on {HOST.NAME}.`\n- **表达式：** 点击**添加**，然后点击**监控项**字段旁边的**选择**。在\
  \ **Another host** 的监控项列表中，点击**名称**列中的 **Local time**，然后点击**插入**。**表达式**字段会被填充为以下表达式：`{Another\
  \ host:system.localtime.last()}=0`。这实际上并不是我们需要的，但我们在这里试图避免使用函数下拉列表，因此我们将手动编辑该表达式。将其改为：`{Another\
  \ host:system.localtime.fuzzytime(30)}=0`。\n- **严重性：** 选择警告。\n\n完成后，点击底部的**添加**按钮。`fuzzytime()`\
  \ 函数接受一个时间段作为参数。它将该监控项的时间戳与 Zabbix 服务器上的当前时间进行比较。如果差异大于参数中指定的时间，则返回 0，这正是我们想要捕获的问题条件。同样，如果你不确定某些触发器函数的返回值，最好查阅\
  \ Zabbix 手册。\n\n> 不要忘记，Zabbix 服务器上的时间不正确可能会导致大量关于所有其他系统的告警。\n\n## 人类可读的常量\n\n在处理较小的值时，使用纯数字常量是可以的。当监控项收集的数据较大时，例如磁盘空间或网络流量，这种方法就变得非常繁琐。你必须计算出期望值，而且稍后看到它时，通常很难直观地看出它到底有多大。为了帮助解决这个问题，Zabbix\
  \ 在表达式中支持所谓的**后缀乘数**——支持 **K、M、G、T** 等缩写。这使触发器表达式更简短，也更易读。例如，对于一个名为 **host** 的主机，检查磁盘空间的表达式最初可能长这样：\n\
  \n```\n{host:vfs.fs.size[/,free].last()}<16106127360\n```\n\n使用后缀乘数后，它变成了这样：\n\n\
  ```\n{host:vfs.fs.size[/,free].last()}<15G\n```\n\n这当然更容易阅读，如果需要的话，也更容易修改。\n\n另一种类型的常量是基于时间的。到目前为止，我们在所有触发器函数中都只使用秒作为时间单位，但这往往有些难以阅读。例如，6\
  \ 小时就是 21600，时间周期越长，越难以阅读。支持以下基于时间的后缀：\n\n- s：秒\n- m：分钟\n- h：小时\n- d：天\n- w：周\n\n\
  s 后缀会被直接丢弃，但所有其他后缀都会作为乘数。因此，21600 就变成了 6h，这更具可读性。我们之前看过的 SSH 服务触发器示例也会更简单：\n\n```\n\
  {A test host:net.tcp.service[ssh].max(5m)}=0\n```\n\n我们现在已经介绍了 Zabbix 触发器的基础知识。还有更多函数可用于评估各种条件，你以后可能会用到。前端函数选择器并不包含所有这些函数，因此有时你必须在文档中查找它们，并手动构造表达式。有关完整且最新的函数列表，请参阅\
  \ https://www.zabbix.com/documentation/3.0/manual/appendix/triggers/functions 上的官方文档。\n\
  \n\n\n\n\n## 自定义触发器显示\n\n在深入探讨了触发器的配置细节后，我们应该能够创建强大的定义，来指明什么情况下视为问题。此外，我们还可以使用几个配置选项来定制触发器的显示方式。\n\
  \n### 触发器严重级别\n\n导航到**管理 | 常规**，然后在右上角的下拉菜单中选择**触发器严重级别**：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_241_0.png)\n\
  \n在此部分中，我们可以自定义严重级别标签及其颜色。如本页底部的**信息**框所述，更改严重级别标签将需要更新此 Zabbix 实例中任何用户可能正在使用的翻译。\n\
  \n但是我们能否在某个地方看到有关它们的更多详细信息？在前端中，转至监控 | 事件，然后点击“时间”列中最新一条“问题”状态条目的日期和时间。\n\n> 如果看不到列出的任何事件，请展开过滤器，点击“重置”，并确保所选时间段足够长，以包含一些事件。\n\
  \n这将打开“事件详细信息”页面，使我们能够更可靠地确定事件流程。该页面包括事件和触发器详细信息以及操作历史记录等内容。右下角的“事件”列表（包含前 20 个事件）本身作为一个控件，允许您点击其中任何一个事件，并查看从所选择事件向前回溯的之前\
  \ 20 个事件。由于此列表仅显示单个触发器的事件，因此在需要查明某个孤立问题的时间线时非常方便：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_243_0.png)\n\
  \n## 事件生成与迟滞\n\n每当触发器更改状态时，就会生成触发事件。触发器可以处于以下状态之一：\n\n- **正常**：正常状态，即触发器表达式计算结果为`false`\n\
  - **问题**：问题状态，即触发器表达式计算结果为`true`\n- **未知**：Zabbix 无法计算触发器表达式时的状态，通常是因为缺少数据\n\n>\
  \ 有关如何通知触发器变为**未知**状态的信息，请参阅*第 22 章，Zabbix 维护*。\n\n无论触发器是从**正常**变为**问题**、**未知**，还是任何其他状态，都会生成一个事件。\n\
  \n> 此外，还可以使用触发器属性中的**多问题事件生成**选项对此进行自定义。我们将在*第 11 章，高级监控项监控*中讨论此选项。\n\n我们之前已经了解到，可以使用某些触发器函数来避免在每次数据变化后都更改触发器状态。通过接受时间段作为参数，这些函数使我们能够仅在问题持续一段时间后才做出反应。但是，如果我们希望在尽可能早地收到通知的同时，仍然避免在数值在阈值附近波动时触发器反复切换，那该怎么办？在这里，一个特定的\
  \ Zabbix 宏（或变量）会有所帮助，它允许我们构建具有某种迟滞（即状态记忆）的触发器表达式。\n\n一个常见的例子是测量温度。例如，一个非常简单的触发器表达式如下：\n\
  \n```\nserver:temp.last()>20\n```\n\n当温度为 21 时，它将触发，并在温度为 20 时进入**正常**状态。有时，温度会在设定的阈值附近波动，因此触发器会一直开开关关。这是不受欢迎的，因此改进后的表达式如下所示：\n\
  \n```\n({TRIGGER.VALUE}=0 and {server:temp.last()}>20) or\n({TRIGGER.VALUE}=1 and\
  \ {server:temp.last()}>15)\n```\n\n这里使用了一个新的宏 TRIGGER.VALUE。如果触发器处于正常状态，此宏返回 0；如果触发器处于问题状态，则返回\
  \ 1。使用逻辑运算符 `or`，我们声明：如果触发器当前处于正常状态且温度超过 20，或者触发器当前处于问题状态且温度超过 15，则该触发器应切换为（或保持）问题状态。\n\
  \n也可以将此理解为触发器具有两个阈值——当值超过 20 度的上限阈值时，我们期望其切换到问题状态，但只有当值降至 15 度的下限阈值以下时才恢复：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_245_0.png)\n\
  \n与仅检查温度是否超过 20 度的简单表达式相比，这种情况有何不同？让我们来看一下：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_245_1.png)\n\
  \n在此示例中，我们避免了两个不必要的**问题**状态，这通常也意味着至少避免了两个通知。这是防止触发器抖动的另一种方法。\n\n## 总结\n\n本章主要讨论了如何对监控环境中发生的事件做出反应。我们学习了如何将应该做出反应的条件描述为触发器表达式。触发器本身具有有用的依赖功能，我们可以使它们相互依赖。我们还探讨了几种在触发器表达式中直接减少触发器抖动的方法，包括使用诸如\
  \ `min()`、`max()` 和 `avg()` 之类的函数，以及触发器迟滞。\n\n在其他触发器技巧中，我们了解了：\n\n- 使用 `nodata()`\
  \ 函数检测缺失数据\n- 使用相同的 `nodata()` 函数使触发器超时\n- 创建基于总磁盘空间而具有不同已用磁盘空间阈值值的触发器\n- 创建仅在特定时间段内工作的触发器\n\
  - 使用相对阈值，将最近数据与之前某个时间的情况进行比较\n\n> 请记住，如果将监控项历史记录设置为 0，则任何触发器都不会工作，即使是仅检查最新值的触发器也是如此。\n\
  \n触发器配置有很多东西，既可以让生活更轻松，也可能带来难以发现的问题。希望这里对基础知识的介绍能帮助你利用前者，避免后者。\n\n拥有这些触发器知识后，我们将在下一章花时间看看触发器触发后我们可以做什么。我们将探讨各种动作，这些动作允许我们发送电子邮件，甚至运行命令来响应触发器触发。\n"
- "## 对监控到的条件采取操作\n\n既然我们已经对触发器有了更多了解，现在来看看当它们触发时我们可以做些什么。仅仅在前端看到某些问题是不够的；我们可能希望使用电子邮件或短信发送通知，甚至可能尝试自动修复问题。\n\
  \n动作确保对触发器触发采取某些措施。让我们尝试发送通知并自动执行命令。\n\n在本章中，我们将：\n\n- 学习如何限制发送告警时的条件\n- 发送通知\n\
  - 在达到阈值时升级\n- 使用脚本作为媒介\n- 与问题管理器集成\n- 了解全局脚本\n\n## 动作\n\n查看触发器列表是挺好的，比查看单个监控项要好得多，但这仍然需要大量的手动工作。这时动作就派上了用场，它提供通知和其他方法来应对条件变化。\n\
  \n最常见的方法是电子邮件。如果在第 2 章“获取你的第一个通知”中首次配置了一条完整的监控项-触发器-动作工作链时，你正确设置了动作，那么每当我们启动或停止服务、创建测试文件等时，你都会收到一封电子邮件。让我们更详细地了解一下动作可以做什么。\n\
  \n## 限制发送告警的条件\n\n我们在第 2 章“获取你的第一个通知”中创建的先前动作匹配任何事件，因为我们没有以任何方式限制其范围。现在我们可以尝试只匹配特定条件。导航到配置\
  \ | 动作，然后点击“创建动作”。\n\n> 以下活动依赖于正确配置的电子邮件设置（在第 2 章“获取你的第一个通知”中完成），以及一个用户组“我们的用户”（在第\
  \ 5 章“管理主机、用户和权限”中添加）。\n\n在名称字段中，输入 SNMP 动作。现在切换到“条件”选项卡。默认情况下，已经添加了两个条件——为什么这样？\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_248_0.png)\n\n这里添加这些条件是因为它们对大多数用户的新动作可能有用：\n\
  \n- 维护状态不在维护中：此条件确保在主动维护期间不会执行任何操作。可以安全地删除它以忽略维护。例如，技术专家可能希望在主动维护期间也收到通知，而帮助台成员可能不希望。\n\
  \n\n\n\n\n- **触发值 = PROBLEM：** 此条件确保操作只会在问题发生时才执行某些操作。触发值在触发器恢复时也会为 OK，但此条件会使操作忽略恢复事件。虽然移除此条件以在问题解决时收到通知似乎很诱人，但不建议这样做。我们将在本章后面讨论更好的恢复消息选项。\n\
  \n是否有人想移除触发值条件？是的，可能存在脚本需要在问题发生时和解决时都运行的情况。我们可以移除此条件，但在此情况下不应使用升级。否则，问题和恢复事件都会被升级，这会非常、非常令人困惑：\n\
  \n| Conditions | LABEL | NAME | ACTION |\n|---|---|---|---|\n|  | A | Maintenance\
  \ status not in *maintenance* | Remove |\n|  | B | Trigger value = *PROBLEM* | Remove\
  \ |\n|  | C | Host group = *Important SNMP hosts* | Remove |\n\n对于我们当前的操作，让我们保留默认条件不变并转到操作。操作是实际执行的活动。切换到\
  \ **Operations** 选项卡并在 **Action operations** 块中点击 **New** 链接。首先，我们将配置一个非常简单的操作——向单个\
  \ **USER GROUP** 发送电子邮件。此表单可能相当令人困惑。在 **Send to User groups** 部分点击 **Add**，在弹出的窗口中点击\
  \ **Our users**。结果应如下所示：\n\n| Send to User groups | USER GROUP | ACTION |\n|---|---|---|\n\
  |  | Our users | Remove |\n|  | Add |  |\n\n> Zabbix 3.0 的早期版本在此表单中存在标签错位问题——请确保使用正确的部分。\n\
  \n现在点击 **Operation details** 块中的主 **Add** 链接（就在 **Conditions** 部分下方）。最后，点击底部的 **Add**\
  \ 按钮。由于我们希望正确测试电子邮件的发送方式，现在应禁用我们之前添加的操作。勾选 **Test** 操作旁边的复选框，点击底部的 **Disable** 按钮，然后在弹出窗口中确认禁用。\n\
  \n## Acting upon Monitored Conditions\n\n现在我们需要在 **SNMP trap** 项上创建触发器。导航到 **Configuration\
  \ | Hosts**，点击 **snmptraps** 旁边的 **Triggers**，然后点击 **Create trigger**。输入以下内容：\n\n\
  - **Name:** `SNMP trap has arrived on {HOST.NAME}`\n- **Expression:** `{snmptraps:snmptraps.nodata(30)}=0`\n\
  - **Severity:** **Information**\n\n这样的触发器会在陷阱到达时触发，并在大约 30 秒后自行清除。我们在 *Chapter 6,\
  \ Detecting Problems with Triggers* 中讨论过 `nodata()` 触发器函数。完成后，点击底部的 **Add** 按钮。\n\
  \n我们还希望在 **Another host** 上触发一个触发器。让我们复制刚刚创建的那个——勾选它旁边的复选框并点击 **Copy**。在 **Target\
  \ type** 下拉菜单中选择 **Hosts**，在 **Group** 下拉菜单中选择 **Linux servers** 并选择 **Another host**：\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_250_0.png)\n\n完成后，点击 **Copy**。\n\n> 为防止我们的陷阱进入没有针对它的触发器的项，请前往\
  \ **Configuration | Hosts**，点击 **Another host** 旁边的 **Items**，然后删除 **Experimental\
  \ SNMP trap** 项，或更改其项键。\n\n仍缺少一个环节——**Our users** 组中的两个用户都没有定义用户媒介。要添加媒介，请导航到 **Administration\
  \ | Users** 并在 **ALIAS** 列中点击 **monitoring_user**。切换到 **Media** 选项卡并点击 **Add**，在\
  \ **Send to** 字段中输入电子邮件地址，然后通过点击 **Add** 关闭弹出窗口。我们现在也必须保存此更改，因此点击 **Update**。\n\n\
  现在我们需要触发一个触发器。从 `Another host` 执行以下命令：\n\n```\nsnmptrap -Ci -v 2c -c public <Zabbix\
  \ server> \"\" \"NET-SNMP-MIB::netSnmpExperimental\" NET-SNMP-MIB::netSnmpExperimental\
  \ s \"Critical Error\"\n```\n\n有关接收 SNMP 陷阱的信息，请参阅 Chapter 4, Monitoring SNMP Devices。\n\
  \n将 <Zabbix server> 替换为 Zabbix 服务器的 IP 或 DNS 名称。此值应出现在 Another host 中的 snmptraps\
  \ 项中并触发关联的触发器。您可以在 Monitoring | Triggers 部分验证触发器是否已触发：\n\n要使下一个陷阱进入 snmptraps 主机，请前往\
  \ Configuration | Hosts，点击 Another host 旁边的 Items，然后删除 snmptraps 项，或更改其项键。\n\n然后从\
  \ Another host 发送另一个陷阱：\n\n```\n$ snmptrap -Ci -v 2c -c public <Zabbix server> \"\
  \" \"NET-SNMP-MIB::netSnmpExperimental\" NET-SNMP-MIB::netSnmpExperimental s \"\
  Critical Error\"\n```\n\n由于 Another host 已不再有 snmptraps 项，此值应转到 snmptraps 主机。此时，我们应该已收到来自我们新操作的新电子邮件。让我们查看另一个视图——事件视图。打开\
  \ Monitoring | Events 并查看最近几条条目：\n\n| TIME | HOST | DESCRIPTION | STATUS | SEVERITY\
  \ | DURATION | ACK | ACTIONS |\n|---|---|---|---|---|---|---|---|\n| 2016-04-13\
  \ 04:02:56 | snmptraps | SNMP trap has arrived on snmptraps | PROBLEM | Information\
  \ | 34s | No |  |\n| 2016-04-13 04:02:30 | Another host | SNMP trap has arrived\
  \ on Another host | OK | Information | 1m 25s | No |  |\n| 2016-04-13 04:00:56 |\
  \ Another host | SNMP trap has arrived on Another host | PROBLEM | Information |\
  \ 1m 34s | No | 1 | 1 |\n\n如果您看不到 SNMP 事件，请确保 Group 和 Host 下拉菜单都已全选。\n\n我们可以看到，到目前为止已成功注册了三个事件——首先是\
  \ Another host 上报告错误的 SNMP 陷阱项，然后是其恢复，最后是 snmptraps 主机上的触发器已触发。但最后一列，标题为 ACTIONS，明显不同。虽然第一个\
  \ PROBLEM 事件列出了一些数字，但最近的一个却什么都没有。原因如下。\n\n在 Zabbix 中，只有对触发器中引用的系统至少有一个只读访问权限的用户才会收到通知。\n\
  \nsnmptraps 主机位于 important SNMP host 组中，我们的用户组对其权限被明确设置为拒绝。\n\n这使我们能够将 **host group**\
  \ 权限与操作条件重叠，以创建相当复杂的通知场景。\n\n## Additional action conditions\n\n到目前为止，我们只使用了两个默认操作条件。实际上，Zabbix\
  \ 提供了相当多的不同条件来确定何时调用操作。让我们看看其他可用的条件示例：\n\n- **Application**：允许我们将操作限制为特定应用程序。例如，操作可能仅在属于\
  \ MySQL 应用程序的项涉及时才做出反应。这是一个自由格式字段，因此必须与实际的应用程序名称匹配。我们也可以匹配或否定子字符串。\n- **Host**：允许我们为操作调用单独指定一个重要（或不重要）的主机。\n\
  - **Host group**：与 **Host** 条件类似，此条件允许我们根据主机组成员资格进行限制。\n- **Trigger**：此条件允许我们匹配单个、特定的触发器。\n\
  - **Trigger name**：比前一个更灵活一些，通过此条件我们可以根据触发器名称限制调用——例如，仅对名称中包含字符串 `database` 的触发器采取行动。\n\
  - **Trigger severity**：我们可以将操作限制为仅在最高两个触发器严重级别发生时，或仅在几个最低严重级别发生时。\n- **Time period**：仅当问题发生在指定的时间段内时才可执行操作，或也可以在指定的时间段内抑制操作。\n\
  \n还有更多在特定用例中有用的操作条件——请查看操作条件配置中的列表，以便日后使用它们。\n\n## Complex conditions\n\n在操作属性中，在\
  \ **Conditions** 选项卡中，顶部还有一个 **Type of calculation** 下拉菜单。当操作有两个或更多条件时会出现该下拉菜单，因此对我们来说它一直存在——默认操作已带有两个条件。让我们了解一下它提供的功能：\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_252_0.png)\n\n\n\n\n\n- **And：** 所有条件都必须为真，动作才会匹配\n\
  - **Or：** 只要有一个条件为真，动作就会匹配\n- **And/Or：** 同类型条件按 Or 方式求值；不同类型条件按 And 方式求值\n- **Custom\
  \ expression：** 完全自由选项——你编写公式来定义条件应如何求值\n\n前两种选项足够清晰。**And/Or** 会自动创建表达式，逻辑基于条件类型。例如，如果我们有以下条件：\n\
  \n- **A：** `Application = MySQL`\n- **B：** `Application = PostgreSQL`\n- **C：**\
  \ `Trigger severity = High`\n- **D：** `Host group = Database servers`\n\n选项 **And/Or**\
  \ 将会创建公式 `(A or B) and C and D`。这在很多情况下都有效，但我们现在可以再添加一个 **Host group** 条件，如下：\n\n\
  - **E：** `Host group = Production servers.`\n\n![](img/f5313a804532fabacc8d07cc8607eeba_253_0.png)\n\
  \n> 实际占位符字母在 Zabbix 前端中可能会不同，因为条件是有序的。添加或删除条件可能会改变现有条件的字母——在使用自定义表达式且条件发生变化时请注意。\n\
  \n公式将变为 `(A or B) and C and (D or E)`。新的 **Host group** 条件由于与之前条件同类型，会与之前的 **Host\
  \ group** 条件进行“或”运算。这可能不是用户所期望的。实际上，期望的条件是 *同时属于数据库服务器组和生产服务器组的 hosts*。此时 **and/or**\
  \ 选项已不再适用，因此我们可以使用 **Custom expression**。在这种情况下，我们只需在提供的输入字段中输入公式：\n\n```\n(A or\
  \ B) and C and (D and E)\n```\n\n这里对 D 和 E 的分组是可选的；我们只是为了清晰而添加了它。\n\n当否定某些条件时，情况变得更加复杂。如果希望在问题发生在属于\
  \ A 组或 B 组的 host 上时跳过某个动作，使用两个非 host group 条件（A and B）是行不通的——它只会在 host 同时属于两个组时匹配。让表达式检查\
  \ (A or B) 也会匹配，除非 host 同时属于两个 host 组。例如，如果问题发生在属于 A 组的 host 上，Zabbix 会检查该 host\
  \ 是否匹配第一个条件。它会判定动作不应执行——但还有 or 的第二部分。该 host 不属于 B 组，因此动作会被执行。不幸的是，这类情况没有简单的解决方案。创建两个动作，每个动作仅否定单个\
  \ host 组，将会奏效。\n\n## Dependencies and actions\n\n限制发送通知的另一种方式是触发器依赖关系，在这里非常有用。如果一个依赖于已激活触发器的触发器被触发，我们在前端上看到的效果是——依赖触发器没有出现在活动触发器列表中。在动作中效果更好——这种情况下不会执行任何动作。如果你知道某个网站依赖于\
  \ **Network File System (NFS)** 服务器，并且已设置了相应的依赖关系，NFS 服务器宕机时不会通知你网站出现问题。当需要解决问题时，不被邮件淹没是一件好事。\n\
  \n如果依赖触发器的 item 检查频率更高，则可能存在竞态条件。在这种情况下，依赖触发器可能先触发，而另一个触发器稍后触发，从而仍然产生两次告警。虽然这对于触发器在前端的显示不是大问题，但如果涉及动作则可能不希望出现这种情况。如果你经常看到此类误报，请更改\
  \ item 间隔，使依赖项的间隔始终稍长一些。\n\n## Media limits for users\n\n我们查看了动作可以施加的限制，但媒体本身也可能存在限制。导航到\
  \ **Administration** | **Users** 并在 **ALIAS** 列中点击 **Admin**。切换到 **Media** 选项卡，然后点击我们在此创建的唯一媒体旁边的\
  \ **Edit**：\n\n> 此周期与动作中的时间段条件一起工作。此用户的动作只有在两个周期重叠时才会被执行。\n\n使用 if severity 也非常有用，因为那位可怜的技术人员可能不想在夜间收到信息性短信，只想收到灾难级别的通知。\n\
  \n点击 **Cancel** 关闭此窗口。\n\n## Sending out notifications\n\n由于操作中指定的两个用户都被明确拒绝访问 snmptraps\
  \ 主机，因此他们在动作操作中不被视为有效。\n\n现在让我们赋予他们对该主机的访问权限。前往 **Administration | User groups**\
  \ 并在 **NAME** 列中点击 **Our users**。切换到 **Permissions** 选项卡，然后在 **DENY** 框中标记 **Important\
  \ SNMP hosts**，点击下方的 **Delete selected**，然后点击 **Update**。两个用户现在应该可以访问所需的主机了。\n\n\
  我们的触发器现在已被停用，因此我们可以发送另一个 trap 来激活 snmptraps 主机上的触发器。\n\n> 注意当触发器停用时没有发送消息，因为有 Trigger\
  \ value = PROBLEM 条件。我们将在本章后面启用恢复消息。\n\n在 Another host 上运行以下命令：\n\n```\n$ snmptrap\
  \ -Ci -v 2c -c public <Zabbix server> \"\" \"NET-SNMP-MIB::netSnmpExperimental\"\
  \ NET-SNMP-MIB::netSnmpExperimental s \"Critical Error\"\n```\n\n等待一段时间以便触发器再次触发。检查你的电子邮件，你应该收到了关于我们之前未收到通知的主机\
  \ snmptraps 的通知。让我们再次查看事件列表——打开 **Monitoring | Events** 并查看最新条目：\n\n| TIME | HOST\
  \ | DESCRIPTION | STATUS | SEVERITY | DURATION | ACK | ACTIONS |\n|---|---|---|---|---|---|---|---|\n\
  | 2016-04-13 08:16:04 | snmptraps | SNMP trap has arrived on snmptraps | PROBLEM\
  \ | Information | 56s | No | 1 | 1 |\n\n如果 **ACTIONS** 列显示橙色数字，请再等待几分钟。我们将在 *Chapter\
  \ 22, Zabbix Maintenance* 中讨论这种延迟的原因。\n\n哦，但 **ACTIONS** 列中奇怪的条目是怎么回事？那两个颜色不同的数字看起来很神秘。让我们试着找出它们可能意味着什么——打开\
  \ **Reports | Action log** 并查看最后几条记录：\n\n| RECIPIENT(S) | MESSAGE | STATUS | INFO\
  \ |\n|---|---|---|---|\n| monitoring_user (monitoring user)<br>monitoring_user@company.tld\
  \ | **Subject:** PROBLEM: SNMP trap has arrived on snmptraps<br><br>**Message:**<br>Trigger:\
  \ SNMP trap has arrived on snmptraps<br>Trigger status: PROBLEM<br>Trigger severity:\
  \ Information<br>Trigger URL:<br><br>Item values:<br>1. Received SNMP traps (snmptraps:snmptraps):\
  \ 192.168.56.11 \"Critical Error\" NET-SNMP-MIB::netSnmpExperimental<br>2. \"UNKNOWN\"\
  \ (*UNKNOWN*: *UNKNOWN*): \"UNKNOWN\"<br>3. \"UNKNOWN\" (*UNKNOWN*: *UNKNOWN*):\
  \ \"UNKNOWN\"<br><br>Original event ID: 374 | Sent | |\n| advanced_user (advanced\
  \ user) | **Subject:** PROBLEM: SNMP trap has arrived on snmptraps<br><br>**Message:**<br>Trigger:\
  \ SNMP trap has arrived on snmptraps<br>Trigger status: PROBLEM<br>Trigger severity:\
  \ Information<br>Trigger URL:<br><br>Item values:<br>1. Received SNMP traps (snmptraps:snmptraps):\
  \ 192.168.56.11 \"Critical Error\" NET-SNMP-MIB::netSnmpExperimental<br>2. \"UNKNOWN\"\
  \ (*UNKNOWN*: *UNKNOWN*): \"UNKNOWN\"<br>3. \"UNKNOWN\" (*UNKNOWN*: *UNKNOWN*):\
  \ \"UNKNOWN\"<br><br>Original event ID: 374 | **Not sent** | X |\n\n如果看不到任何条目，请增加显示的时间段。\n\
  \n**STATUS** 列显示发送给 monitoring_user 的消息成功，但发送给 advanced_user 的消息失败。因此，事件列表中绿色数字表示通知发送成功，而红色数字表示失败。要查看失败原因，请将鼠标光标移到\
  \ **INFO** 列中的红色 X 上：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_257_0.png)\n\n\
  \n\n\n\n你可以点击红色的 X 使弹出窗口在鼠标光标移开时仍然保持显示，这样我们可以复制错误文本。\n\n很好，这清楚地说明了错误是什么——我们的 advanced_user\
  \ 没有定义任何媒体条目。我们可以很容易地推断出事件列表中的数字代表通知计数——成功的为绿色，不成功的为红色。它还向我们展示了不应将操作配置为向媒体未正确设置的<|message|>用户发送消息，因为此类条目会污染操作日志并使审查有趣条目变得更困难。\n\
  \n虽然操作日志提供了更多细节，但我们也可以在事件列表中找到错误。返回 Monitoring | Events，并将鼠标光标移到 ACTIONS 列中红色、最右边的数字\
  \ 1 上。会出现一个弹出窗口。点击数字 1 使弹出窗口保持显示，然后将鼠标光标移到 INFO 列中的红色 X 上——同样的信息性弹出窗口会出现，在本例中告诉我们该用户没有定义媒体。\n\
  \n## 使用宏\n\n让我们仔细看看我们收到的电子邮件（如果你已经删除了它们，只需再发送几个 SNMP trap 即可）。主题和正文都提到了触发器名称 SNMP\
  \ trap has arrived on snmptraps。看起来在触发器名称中包含主机名宏是个好主意。虽然我们现在将探讨另一种解决方案，但一个通用建议是始终在触发器名称中包含主机名。这样做可以避免你在收到警报时却不知道哪个主机出现问题的情况。例如，如果我们省略了触发器中的主机名宏，电子邮件警报就会说\
  \ SNMP trap has arrived。\n\n针对上述问题还有另一种可能的解决方案——我们可以在操作中使用宏来帮助解决此特定情况。要继续，请导航到 Configuration\
  \ | Actions，点击 NAME 列中的 SNMP action，然后将 Default subject 字段内容更改为：\n\n```\n{TRIGGER.STATUS}:\
  \ {TRIGGER.NAME} on {HOST.NAME}\n```\n\n这里使用“宏”一词可能会让人困惑——Zabbix 将其称为宏，尽管它们更正确地应被视为变量。在本书中，我们将遵循\
  \ Zabbix 的术语，但请随意将宏读作变量。\n\n该字段已包含两个宏——{TRIGGER.STATUS} 和 {TRIGGER.NAME}。宏的好处在我们有一个操作覆盖许多情况时变得明显。我们不必创建无数个操作来涵盖每种可能的情况；相反，我们使用宏来让与特定事件相关的所需信息被替换。宏名称通常能很好地说明宏的作用。在本例中，我们通过添加主机名宏改进了已包含触发器名称和状态宏的现有主题行，尽管仍然建议在触发器名称中包含主机名。\n\
  \n要确认你的更改，请点击 Update。通过像之前一样发送 SNMP trap 使触发器状态发生变化，然后检查你的电子邮件。主题现在包含了主机名。但等等，现在主机名被包含两次——我们做了什么？主题现在是：\n\
  \n```\nPROBLEM: SNMP trap has arrived on snmptraps on snmptraps\n```\n\n我们在触发器名称和操作主题中使用了相同的宏。你应该决定在哪里指定主机名并始终遵循该规则。\n\
  \n电子邮件中还有一些其他略显奇怪的地方——在消息正文末尾，有几行包含 UNKNOWN：\n\n```\nReceived SNMP traps (snmptraps:snmptraps):\
  \ 192.168.56.11 \"Critical Error\"\nNET-SNMP-MIB::netSnmpExperimental\n*UNKNOWN*\
  \ (*UNKNOWN*:*UNKNOWN*): *UNKNOWN*\n*UNKNOWN* (*UNKNOWN*:*UNKNOWN*): *UNKNOWN*\n\
  ```\n\n如果我们现在查看相应的操作配置：\n\n```\nItem values:\n{ITEM.NAME1} ({HOST.NAME1}:{ITEM.KEY1}):\
  \ {ITEM.VALUE1}\n{ITEM.NAME2} ({HOST.NAME2}:{ITEM.KEY2}): {ITEM.VALUE2}\n{ITEM.NAME3}\
  \ ({HOST.NAME3}:{ITEM.KEY3}): {ITEM.VALUE3}\n```\n\n附加在这些宏中的数字，例如 {ITEM.NAME1} 中的数字，是触发器表达式中项目的顺序编号。我们发送通知的触发器仅引用了一个项目，因此第一个引用有效，引用第二个和第三个项目会失败，并在消息中输出\
  \ *UNKNOWN*。默认操作旨在用作示例——在本例中，演示引用多个项目的能力。如果你的大多数触发器仅引用单个项目，可能需要删除第二行和第三行。此时，没有办法有条件地打印项目值，如果它存在。\n\
  \n## 根据监控条件采取行动\n\n有时，消息的接收者可能会受益于一些额外的信息，这些信息无法直接从事件相关宏中获得。这里有一个额外的宏类别会有所帮助——在触发器表达式中使用的宏也适用于宏内容。想象一个人管理着两台服务器，这两台服务器都依赖于一个已知存在性能问题的\
  \ NFS 服务器。如果其中一台服务器的系统负载增加到足以触发触发器的程度，警报接收者也希望知道另一台服务器的负载，以及 NFS 服务是否正常运行。这将使他们能够快速评估问题最可能出在哪里——如果\
  \ NFS 服务已关闭或自身存在性能问题，那么这两台服务器的系统负载很可能因此上升，需要 NFS 服务器管理员处理。为了让此人收到此类信息，我们可以在电子邮件正文中添加以下行：\n\
  \n```\nCPU load on Another host: {Another host:system.cpu.load.last()}\nNFS service\
  \ is: {NFS Server:nfs.service.last()}\n```\n\n![](img/f5313a804532fabacc8d07cc8607eeba_260_0.png)\n\
  \n> 请确保调整项目间隔和触发器表达式，以避免这些项目的竞态条件。\n\n请注意，没有内置的 NFS 服务项目——必须创建适当的主机和项目才能像这样引用它们。\n\
  \n正如示例所示，使用与触发器表达式相同的语法，包括支持的函数。这也允许接收者通过添加如下宏立即获知一段时间内的平均负载：\n\n```\nAverage CPU\
  \ load on Another host for last 10 minutes: {Another host:system.cpu.load.avg(600)}\n\
  ```\n\n你可以在官方 Zabbix 文档 https://www.zabbix.com/documentation/3.0/manual/appendix/macros/supported_by_location\
  \ 找到受支持宏的完整列表。\n\n## 发送恢复消息\n\n我们使用的设置仅在问题发生时发送消息。这是由默认添加的 `Trigger value = PROBLEM`\
  \ 条件确保的。一种也启用触发器恢复时发送消息的方法是删除该条件，但当使用升级功能时它将无用。因此建议保留该条件不变，而在操作级别启用恢复消息。\n\n让我们为我们的\
  \ SNMP trap 操作启用恢复消息。转到 **Configuration | Actions**，点击 **NAME** 列中的 **SNMP action**，并标记\
  \ **Recovery message** 复选框。注意这会为我们提供两个额外的字段——我们可以自定义恢复消息。与问题消息发送类似的消息不同，我们可以让恢复消息更突出一些。嘿，这是个好主意——我们将向管理层发送电子邮件，让我们在这里添加一些“令人愉快”的内容。修改\
  \ **Recovery subject** 字段，在现有内容前添加 `Resolved:`：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_261_0.png)\n\
  \n> 启用恢复消息时不要删除触发值条件。这样做可能导致恢复消息被升级，从而产生大量无用的消息。\n\n点击 **Update** 按钮。这将使发出的恢复消息具有一种双重确认一切正常的效果——主题将以\
  \ `Resolved: OK.` 开头。要测试新配置，请将 trap 设置为生成问题并等待问题解决。这次应发送两封电子邮件，第二封应带有我们自定义的主题。\n\
  \n在收到的电子邮件中，注意末尾看起来像这样的行：\n\n```\nOriginal event ID: 1313\n```\n\n该行末尾的数字是事件 ID——问题发生的一个唯一标识符。它实际上是所谓的\
  \ **original event ID**。这是原始问题的 ID，在问题和恢复通知中是相同的。一个非常有用的方法是当将此数据发送到问题管理或票务系统时自动将恢复消息与问题消息匹配——恢复信息可用于自动关闭票据，或为其提供额外信息。\n\
  \n此 ID 由宏 `{EVENT.ID}` 生成，并且与许多其他宏一样，你可以在操作中使用它。如果你想唯一标识恢复事件，还有另一个宏——`{EVENT.RECOVERY.ID}`。\n\
  \n宏有很多，所以请务必查阅 Zabbix 手册以获取完整列表。\n\n\n\n\n\n最终结果应如下所示：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_264_0.png)\n\
  \n如果如此，请点击操作详细信息块中的更新——还不是底部的按钮。现在进入下一个任务——Admin 必须在五分钟之后每隔五分钟收到一次通知，直到问题解决。\n\n\
  我们必须弄清楚在步骤字段中填入什么值。我们希望这个操作在五分钟后触发，但五分钟时的通知已被第一个操作覆盖，所以我们可能目标是10分钟。但应该使用哪一步来表示10分钟呢？让我们尝试创建一个时间线。我们当前设置了一个单独的操作来覆盖默认时段。之后，默认时段开始生效，即使当前没有分配任何操作，我们也可以计算后续步骤将在何时执行：\n\
  \n| 步骤 | 操作 | 间隔（秒） | 经过时间 |\n|------|-----------|--------------------|-------------|\n\
  | 1 | 向用户 Admin 发送消息 | 操作，60 | 0 |\n| 2 | 向用户 Admin 发送消息 | 操作，60 | 1 分钟 |\n| 3 |\
  \ 向用户 Admin 发送消息 | 操作，60 | 2 分钟 |\n| 4 | 向用户 Admin 发送消息 | 操作，60 | 3 分钟 |\n| 5 |\
  \ 向用户 Admin 发送消息 | 操作，60 | 4 分钟 |\n| 6 | 向用户 Admin 发送消息 | 操作，60 | 5 分钟 |\n| 7 |\
  \ 无 | 默认，300 | 6 分钟 |\n| 8 | 无 | 默认，300 | 11 分钟 |\n\n> 操作步骤持续时间会覆盖其中所含步骤的时段。如果某个操作跨越步骤5-7，则它会覆盖5-6、6-7和7-8时段。如果某个操作仅位于步骤3，则它会覆盖3-4时段。\n\
  \n我们想要10分钟，但看起来使用此配置不可能——我们的第一个操作将步骤7置于6分钟，而回退到默认间隔则将步骤8置于11分钟。要覆盖6-7间隔，我们必须在步骤7定义某个操作，但我们不想这样做。有没有办法按期望的方式配置？应该有。点击操作列中的编辑，将第二个步骤字段改为5，然后点击操作详细信息块中的更新——不要点击底部的主更新按钮。\n\
  \n现在点击动作操作块中的新建。我们先配置简单的事情。点击操作详细信息块中发送给用户区域中的添加，然后在出现的弹出窗口中点击 Admin。第一个操作已更新，让我们再次模拟最后几个步骤：\n\
  \n| 步骤 | 操作 | 间隔（秒） | 经过时间 |\n| ... | ... | ... | ... |\n| 5 | 向用户 Admin 发送消息 |\
  \ 操作，60 | 4 分钟 |\n| 6 | 无 | 默认，300 | 5 分钟 |\n| 7 | 无 | 默认，300 | 10 分钟 |\n| 8 | 无\
  \ | 默认，300 | 15 分钟 |\n\n通过最新修改，看起来我们可以在经过10分钟后发送消息——那将是步骤7。但实际上我们移除了步骤6（5分钟时）的消息发送。好消息是——如果我们现在添加另一个操作从步骤6开始，它完成第一个五分钟发送周期，然后继续每隔5分钟发送一条消息——简直完美。\n\
  \n在第一个步骤字段中输入6。我们希望此操作持续到问题解决为止，因此在第二个步骤字段中输入0。完成后，点击操作详细信息块底部的添加控件。\n\n我们可以看到 Zabbix\
  \ 很贴心地计算了第二个操作应该开始的时间，这让我们能够快速发现计算中的错误。这里没有错误；第二个操作按预期在5分钟时开始：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_265_0.png)\n\
  \n解决了这个问题后，我们的下级经理 `advanced_user` 必须在五分钟后收到通知，但只通知一次。这意味着需要另一个操作——点击动作操作块中的新建。点击发送给用户区域中的添加，在弹出窗口中点击别名列中的\
  \ `advanced_user`。这一条消息应该很简单——我们知道步骤6在五分钟后发生，所以让我们在两个步骤字段中都输入6，然后点击操作详细信息块底部的添加。同样，开始于列显示此步骤将在五分钟后执行，符合预期。\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_267_0.png)\n\n一切正常，所以点击操作详细信息块底部的添加。我们现在可以查看动作操作，并验证每个操作是否在应该开始的时候开始：\n\
  \n| 步骤详情 | 开始于 | 持续时间（秒） |\n|---|---|---|\n| 1 - 5   向用户发送消息：Admin（Zabbix 管理员）通过所有媒介\
  \ | 立即 | 60 |\n| 6 - 0   向用户发送消息：Admin（Zabbix 管理员）通过所有媒介 | 00:05:00 | 默认 |\n| 6\
  \       向用户发送消息：advanced_user（高级用户）通过所有媒介 | 00:05:00 | 默认 |\n| 9       向用户发送消息：monitoring_user（监控用户）通过所有媒介\
  \ | 00:20:00 | 默认 |\n\n## 根据监控条件采取行动\n\n一切似乎都符合规范。让我们切换回**动作**选项卡，类似于**SNMP 动作**，将**恢复**主题修改为\
  \ `Resolved: {TRIGGER.NAME}`。这一次我们想避免 `Resolved: OK;`，而选择单一地提及现在一切正常。我们终于可以点击**更新**了。通知设置就绪后，让我们破坏一些东西。在另一台主机上，执行：\n\
  \n```bash\n$ rm /tmp/testfile\n```\n\nZabbix 很快就会发现该问题，并向 Admin 用户发送第一封电子邮件。这封电子邮件与我们之前收到的不会有什么不同。但现在让我们耐心等待\
  \ 20 分钟以上。在此期间，Admin 用户将收到更多消息。我们真正感兴趣的是发送给 monitoring_user 的电子邮件中的消息内容。收到此消息后，请查看其包含的内容：\n\
  \n```text\nTrigger: Testfile is missing\n\nTrigger status: PROBLEM\n\nTrigger severity:\
  \ Warning\n\nTrigger URL:\n\n\nProblem started: 2016.04.15 15:05:25 Age: 20m\n1.\
  \ 2016.04.15 15:05:27 message sent        Email admin@company.tld\n\"Zabbix Administrator\
  \ (Admin)\"\n\n2. 2016.04.15 15:06:27 message sent        Email admin@company.tld\n\
  \"Zabbix Administrator (Admin)\"\n\n3. 2016.04.15 15:07:27 message sent        Email\
  \ admin@company.tld\n\"Zabbix Administrator (Admin)\"\n\n4. 2016.04.15 15:08:27\
  \ message sent        Email admin@company.tld\n\"Zabbix Administrator (Admin)\"\n\
  \n5. 2016.04.15 15:09:27 message sent        Email admin@company.tld\n\"Zabbix Administrator\
  \ (Admin)\"\n\n6. 2016.04.15 15:10:27 message failed        \"advanced user (advanced_user)\"\
  \ No media defined for user \"advanced user (advanced_user)\"\n\n6. 2016.04.15 15:10:27\
  \ message sent        Email admin@company.tld\n\"Zabbix Administrator (Admin)\"\n\
  \n7. 2016.04.15 15:15:28 message sent        Email admin@company.tld\n\"Zabbix Administrator\
  \ (Admin)\"\n\n8. 2016.04.15 15:20:28 message sent        Email admin@company.tld\n\
  \"Zabbix Administrator (Admin)\"\n```\n\n> 与所有其他通知一样，此处的时间将使用 Zabbix 服务器上的本地时间。\n\
  \n现在它包含的信息远不止发生了什么——经理还收到了一份详细列表，列出了谁收到了问题通知。Admin 用户收到了许多通知，然后……嘿，advanced_user\
  \ 没有收到通知，因为他们的电子邮件地址未配置。这个用户或 Zabbix 管理员需要做一些工作来修复此问题。在这种情况下，只有在之前没有人确认该问题时，该问题才会升级给\
  \ monitoring_user，这意味着甚至没有人查看过它。\n\n> 当前设置会在问题被确认后取消向管理用户升级。我们可以通过添加另一个操作来创建延迟升级，该操作在稍后的步骤中向管理用户发送消息，但不带确认条件。如果问题被确认，则向管理用户发送的第一个操作将被跳过，但第二个操作始终有效。如果问题完全未被确认，管理用户将收到两条通知。\n\
  \n如果我们仔细查看前缀数字，它们不是历史条目的序号，实际上是升级步骤编号。这让我们无需比较时间戳即可快速了解哪些通知同时发生。`Email` 字符串是用于此通知的媒介类型名称。\n\
  \n现在让我们修复问题；在 `Another host` 上执行：\n\n```sh\n$ touch /tmp/testfile\n```\n\n很快，应该会发送两封电子邮件——一封发送给\
  \ Admin 用户，另一封发送给 monitoring_user。由于这些是恢复消息，它们都将使用我们自定义的主题：\n\n**已解决：Testfile 缺失**\n\
  \n\n\n\n\n我们的测试动作的升级阈值对于大多数真实情况来说太短了。如果要减少这些阈值意味着要从头创建一个动作，那会非常不方便。让我们看看如何轻松地调整现有的动作。在前端，导航到\
  \ **Configuration | Actions**，然后在 **NAME** 列中点击 **Test action** 并切换到 **Operations**\
  \ 选项卡。我们可能想要进行以下更改，假设这不是一个关键问题，也不值得快速响应——除非它已经存在半个小时了：\n\n- 增加 `Admin` 用户收到进一步重复消息之间的间隔\n\
  - 增加向 `advanced_user` 和 `monitoring_user` 发送消息前的延迟\n- 在问题存在 30 分钟后开始向 `Admin` 用户发送消息\n\
  \n> 在接下来的几个步骤中，请注意不要过早点击 **Update** 按钮——这会丢弃我们当前正在编辑的操作中的修改。\n\n让我们先将 **Default\
  \ operation** 步骤持续时间更改为 1800（30 分钟）。然后让我们在 **ACTION** 列中点击 **Edit**，旁边是第一个条目（目前跨越步骤\
  \ 1-5）。在其属性中，将 **Steps** 字段设置为 2 和 6，然后点击 **Operation details** 块中的 **Update** 控件。\n\
  \n对于两个从步骤 6 开始的操作，将其更改为步骤 7。对于 **Steps** 字段中两个都是 6 的操作，以同样的方式更改两个出现的位置——并且同样要小心不要点击\
  \ **Update** 按钮。\n\n最终结果应如下所示：\n\n| Default operation step duration | 1800 (minimum\
  \ 60 seconds) |\n| Action operations | STEPS DETAILS | START IN DURATION (SEC) |\n\
  | 2 - 6 | Send message to users: Admin (Zabbix Administrator) via all media | 00:30:00\
  \ 60 |\n| 7 - 0 | Send message to users: Admin (Zabbix Administrator) via all media\
  \ | 00:35:00 Default |\n| 7 | Send message to users: advanced_user (advanced user)\
  \ via all media | 00:35:00 Default |\n| 9 | Send message to users: monitoring_user\
  \ (monitoring user) via all media | 01:35:00 Default |\n| New |  |  |\n\n如果确实如此，请点击该\
  \ **Update** 按钮。\n\n默认操作的第一次更改将所有步骤间隔拉开——除了在操作属性中被覆盖的那些步骤。这在很大程度上实现了我们将 Admin 用户的通知间隔拉开并延迟向另外两个用户发送通知的目标。通过将第一个操作中的第一个步骤从\
  \ 1 改为 2，我们实现了两个目标。步骤 1 和 2 之间的间隔恢复为动作的默认间隔（因为我们将步骤 1 从使用 60 秒覆盖的操作中排除），并且不会立即向\
  \ Admin 用户发送消息。此外，我们将结束步骤稍微推后了一些，以便 Admin 用户以 1 分钟间隔接收到的消息总数不会改变。这导致一些后续操作不再那么整齐地对齐到\
  \ 5 分钟边界，因此我们将它们移到了步骤 7。让我们将其与之前的配置进行比较：\n\n| Before | After |\n|---|---|\n| STEPS\
  \ DETAILS | START IN | DURATION (SEC) | START IN |\n| 1 - 5 Send message to users:\
  \ Admin (Zabbix Administrator) via all media | Immediately | 60 | 00:30:00 |\n|\
  \ 6 - 0 Send message to users: Admin (Zabbix Administrator) via all media | 00:05:00\
  \ | Default | 00:35:00 |\n| 6 Send message to users: advanced_user (advanced user)\
  \ via all media | 00:05:00 | Default | 00:35:00 |\n| 9 Send message to users: monitoring_user\
  \ (monitoring user) via all media | 00:20:00 | Default | 01:35:00 |\n\n这使我们能够轻松地从测试配置将通知和升级扩展到更适合实际情况下的配置，以及快速适应不断变化的需求。让我们再创建一个问题。在\
  \ Another host 上执行：\n\n```\n$ rm /tmp/testfile\n```\n\n等待触发器触发并等待 Admin 用户收到几封电子邮件，然后“解决”问题：\n\
  \n```\n$ touch /tmp/testfile\n```\n\n这应该很快向 Admin 用户发送一封恢复电子邮件。嘿，等一下——为什么只有该用户？Zabbix\
  \ 只向收到问题通知的用户发送恢复通知。由于问题没有升级到管理用户收到通知，因此该用户也不会被告知问题的解决情况。advanced_user 也发生了类似的事情，他没有分配媒体。由于在事件升级时未发送通知（因为未配置电子邮件地址），Zabbix\
  \ 甚至没有尝试向该用户发送恢复消息。不管向用户发送了多少个问题消息，每个动作只会发送一条恢复消息。\n\n因此，在这种情况下，如果 Admin 用户在 monitoring_user\
  \ 收到关于问题的电子邮件之前解决了或确认了问题，monitoring_user 将既收不到关于问题的消息，也收不到关于其解决的消息。\n\n正如我们所见，升级是相当灵活的，允许你在响应事件时组合许多操作。我们可以想象一个相当长且复杂的\
  \ Web 服务器宕机的升级序列，其过程如下：\n\n- 1. 电子邮件管理员\n- 2. 向管理员发送短信\n- 3. 在帮助台系统上打开报告\n- 4. 电子邮件管理层\n\
  - 5. 向管理层发送短信\n- 6. 重启 Apache\n- 7. 重启服务器\n- 8. 断电整个服务器机房\n\n好吧，最后一个可能有点过头了，但我们确实可以构建一个关于问题反应和通知的精细逐步升级。\n\
  \n## Runner analogy\n\n升级的事情对你来说似乎非常复杂吗？如果是这样，我们可以尝试一个在盐湖城附近创造的类比。\n\n想象有一名跑者在森林中奔跑，路线是笔直的。在这条路线上，有一些柱子。跑者有一个首选速度（我们可以称之为默认速度），这意味着跑者通常需要\
  \ T 秒才能从一个柱子走到下一个柱子。\n\n柱子上可能有指示。跑者从第一个柱子开始，并检查那里的指示。指示可以命令跑者做各种事情：\n\n- 在此柱子上仅向某人发送短信\n\
  - 从此柱子到柱子 N 向某人发送短信\n- 从此柱子到下一个柱子更改速度以便更快或更慢到达\n- 从此柱子到柱子 N 更改速度\n\n无论如何，跑者都会走完路线——如果当前柱子上没有指示，跑者只需继续到下一个柱子。\n\
  \n如果这个类比使动作升级步骤如何被“跑者”处理变得更清晰，那么值得重新审视本节并可能更好地理解细节。\n\n## Using scripts as media\n\
  \n虽然 Zabbix 支持相当多的通知机制，但总会有需要非常具体的东西，而默认方法无法胜任的时候。对于这种情况，Zabbix 支持使用自定义脚本作为媒体。让我们尝试设置一个。打开\
  \ Administration | Media types 并点击 Create media type。输入以下值：\n\n- **Name:** Test\
  \ script\n- **Type:** Script\n- **Script name:** testscript\n- **Script parameters:**\
  \ 点击 Add 控件并在新字段中输入 {ALERT.MESSAGE}：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_273_0.png)\n\
  \n> {ALERT.MESSAGE} 宏将被扩展为来自动作配置的消息正文。目前，脚本参数中还支持另外两个宏——{ALERT.SENDTO} 和 {ALERT.SUBJECT}。请查阅\
  \ Zabbix 手册以检查在 https://www.zabbix.com/documentation/3.0/manual/config/notifications/media/script\
  \ 的后续版本中是否添加了新的宏。\n\n完成后，点击底部的 **Add** 按钮。现在我们应该确保在某个时候使用此媒体。转到 **Administration\
  \ | Users**，在 **ALIAS** 列中点击 **monitoring_user**，并切换到 **Media** 选项卡。点击 **Media**\
  \ 部分中的 **Add**。在 **Type** 下拉列表中，选择 **Test script**，并在 **Send to** 字段中输入 `user@domain.tld`。\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_274_0.png)\n\n> \U0001F4A1 电子邮件地址不会传递给我们的脚本，但\
  \ Zabbix 不允许我们保存一个 **Send to** 字段为空的媒体条目。\n\n完成后，点击 **Add** 并通过点击用户编辑表单中的 **Update**\
  \ 来确认更改。在继续脚本本身之前，导航到 **Configuration | Actions** 并点击 **SNMP action** 旁边的 **Disabled**\
  \ 以启用此动作。\n\n我们输入了脚本名称，但脚本应该放在哪里？现在是时候回到我们很久没有去过的地方了——查看 `zabbix_server.conf` 并检查\
  \ `AlertScriptsPath` 选项的值是什么。默认位置会根据安装方法而有所不同。如果你是从源码安装，它将是 `/usr/local/share/zabbix/alertscripts`。发行版包可能使用其他目录。作为\
  \ root，在该目录中创建一个名为 `testscript` 的文件：\n\n```\n```sh\n# touch /path/to/testscript\n\
  # chmod 755 /path/to/testscript\n```\n```\n\n\n\nPopulate it with the following\
  \ content:\n\n```\n```bash\n#!/bin/bash\nfor i in \"$@\"; do\n    echo \"$i\" >>\
  \ /tmp/zabbix_script_received.log\ndone\n```\n```\n\n如你所见，我们只是将每个传入的参数记录到文件中以供检查。现在生成\
  \ SNMP trap，使 snmptraps 触发器切换到 PROBLEM 状态。等待电子邮件到达，然后检查 /tmp/zabbix_script_received.log\
  \ 文件。其内容应类似于以下内容：\n\n```\nTrigger: SNMP trap has arrived on snmptraps\n\nTrigger\
  \ status: PROBLEM\n\nTrigger severity: Information\n\nTrigger URL:\n\n\nItem values:\n\
  \n\n1. Received SNMP traps (snmptraps:snmptraps): 192.168.56.11 \"Critical Error\"\
  \ NET-SNMP-MIB::netSnmpExperiment\n\n2. *UNKNOWN* (*UNKNOWN*: *UNKNOWN*): *UNKNOWN*\n\
  \n3. *UNKNOWN* (*UNKNOWN*: *UNKNOWN*): *UNKNOWN*\n\n\nOriginal event ID: 397\n```\n\
  \n我们可以看到，操作属性中的整个消息主体在这里被完整传递，换行符也得以保留。如果我们还想知道用户媒体 Send to 的值以识别接收此数据的 Zabbix 用户，我们也可以将\
  \ {ALERT.SENDTO} 宏传递给我们的 alertscript。同样，要获取操作属性中的主题，我们将使用 {ALERT.SUBJECT} 宏。\n\n\
  ![](img/f5313a804532fabacc8d07cc8607eeba_275_0.png)\n\n> 如果你看到消息内容丢失了换行符，请检查脚本中的引号——Zabbix\
  \ 会保留所有换行符。\n\n从这里开始，基本上可以用数据做任何事情：将数据传递给没有电子邮件网关的工单管理系统，通过 Zabbix 不直接支持的某些媒体发送它，或在某处显示它。\n\
  \n# Acting upon Monitored Conditions\n\n让我们现在重新审视操作配置——打开 **Configuration | Actions**\
  \ 并在 **NAME** 列中点击 **Test action**。现在，每当 `monitoring_user` 收到通知时就会执行一个脚本。但如果我们想跳过通知的脚本，而只在特定操作中使用它怎么办？值得庆幸的是，我们不必为此场景创建单独的用户。切换到\
  \ **Operations** 选项卡，在 **Action operations** 块中，点击发送消息给 `monitoring_user` 的最后一个操作旁边的\
  \ **Edit**。查看下拉菜单 **Send only to**。它列出了所有媒体类型，并允许我们将特定操作限制为仅特定媒体类型。在此下拉菜单中，选择 **Email**。点击\
  \ **Operation details** 块底部的 **Update** 链接，然后点击底部的 **Update** 按钮。\n\n通过使用 **Send\
  \ only to** 选项，可以在不创建多个虚假用户账户的情况下，为不同情况使用不同的通知方法。例如，用户可能在前几次升级步骤中收到电子邮件，然后发送短信。\n\
  \n# Integration with issue management systems\n\n向技术人员或帮助台发送消息很好，但在某些时间和条件下，自动在某个管理系统中打开工单是可取的。这最容易通过使用两种主要集成方法来实现：\n\
  \n- E-mail gateways\n- APIs that decent systems provide\n\n要实现此类集成，应采取以下步骤：\n\n\
  1. 为工单系统通知创建一个 Zabbix 用户。\n2. 为该用户配置媒体（系统接收电子邮件的电子邮件地址，或要运行的脚本）。\n3. 为工单应自动创建的资源分配只读访问权限（请记住，如果用户对事件生成涉及的任何主机都没有访问权限，则不会发送警报或运行脚本）。\n\
  4. 创建一个单独的操作，或将该用户添加为现有操作操作的接收者，并使用自定义消息（在编辑操作时取消选中 **Default message** 复选框）。\n\n\
  还有第 5 步——要么正确格式化消息内容，以便接收系统知道如何处理消息，要么创建脚本以访问工单系统 API。这特定于每个系统，但让我们看几个例子。这些示例仅提供基本信息——为了获得额外加分，你可以添加其他宏，例如最后值或平均值宏。请注意，具体语法可能会在工单系统版本之间发生变化，因此请检查你使用的版本的文档。\n\
  \n让我们再创建一个条件——在 New condition 块中，在第一个下拉菜单中选择 Trigger name。第二个下拉菜单保持默认值。在其旁边的输入字段中输入\
  \ Web service is down，然后点击 Add control。最终结果应如下所示：\n\n| Conditions | LABEL | NAME\
  \ | ACTION |\n|---|---|---|---|\n| A | Maintenance status not in maintenance | Remove\
  \ |\n| B | Trigger value = PROBLEM | Remove |\n| C | Host = Another host | Remove\
  \ |\n| D | Trigger name like Web service is down | Remove |\n\n现在切换到 Operations\
  \ 选项卡。在 Action operations 块中，点击 New。在刚刚出现的 Operation details 块中，在 Operation type\
  \ 字段中选择 Remote command。Zabbix 提供五种不同类型的远程命令：\n\n- Custom script\n- IPMI\n- SSH\n\
  - Telnet\n- Global script\n\n我们将在第 10 章 Advanced Item Monitoring 中讨论 SSH 和 telnet\
  \ 项。我们将在第 13 章 Monitoring IPMI Devices 中讨论 IPMI 功能。全局脚本将在本章后面介绍——现在让我们看看自定义脚本功能。\n\
  \n对于自定义脚本，可以选择在 Zabbix agent 或 Zabbix server 上运行它们。在 agent 上运行将允许我们在发现问题条件所在的系统上收集信息、控制服务并执行其他任务。在服务器上运行将允许我们从\
  \ Zabbix 服务器的角度探测系统，或也许访问 Zabbix API 并基于该信息做出进一步决策。\n\n> 此处的界面可能相当令人困惑，并且可能同时可见多个名称相同的按钮或链接——例如，将有三个不同的东西称为\
  \ Add。请非常小心你点击的是哪个控件。\n\n现在，我们将创建一个操作，如果 Web 服务宕机，将尝试重启 Apache Web 服务器。通常，这必须在出现问题的主机上完成。在\
  \ Target list 部分，点击 New 链接。那里的下拉菜单将有 Current host 被选中，这正是我们想要的，所以点击它下方的 Add control。\n\
  \n在 Commands 文本框中，输入以下内容：\n\n```\nsudo /etc/init.d/apache2 restart\n```\n\n> 此步骤和后面的步骤假设\
  \ /etc/init.d/apache2 init 脚本存在且可用。如果你的发行版有不同的控制脚本，请改用它的路径。如果你的发行版完全使用 systemd，你可能必须使用诸如\
  \ /usr/bin/systemctl restart apache2 或 /usr/bin/systemctl restart httpd.service\
  \ 之类的命令。请注意，服务名称也可能不同。\n\n我们只是以防 Apache 停止响应而不是简单地死亡而重启它。你也可以输入许多要执行的远程操作，但我们现在不这样做，所以只需点击\
  \ Operation details 块底部的 Add control。要保存我们的新操作，点击底部的 Add 按钮。\n\n> 运行远程命令时，Zabbix\
  \ agent 会接受命令并立即返回 1——服务器无法知道命令花费了多长时间，甚至无法知道它是否被运行。请注意，agent 上的远程命令是无超时运行的。\n\n\
  我们的远程命令几乎准备好运行了，只是在 agent 端仍有一些工作要做，所以以 root 身份打开 zabbix_agentd.conf 并查找 EnableRemoteCommands\
  \ 参数。将其设置为 1 并取消注释，保存配置文件，然后重启 zabbix_agentd。\n\n这还不是全部。由于远程命令会传递给作为 zabbix 用户运行的\
  \ Zabbix agent 守护进程，我们还必须允许该用户实际重启 Apache。正如远程命令所示，我们将使用 sudo，因此以 root 身份在 Another\
  \ host 上编辑 /etc/sudoers 并添加以下行：\n\n```\nzabbix ALL=NOPASSWD: /etc/init.d/apache2\
  \ restart\n```\n\n> 为了额外的安全措施，使用 visudo 命令——它还应检查你的更改的语法有效性。\n\n\n\n\n\n> 在某些系统上，sudo\
  \ 仅被配置为可交互使用。你可能需要注释掉 `/etc/sudoers` 中的 `requiretty` 选项。\n\n同样，如果你需要不同的脚本名称，请更改它。这将允许\
  \ zabbix 用户使用 sudo 并重启 Apache Web 服务器——只重启它，不要停止或执行任何其他操作。\n\n![](img/f5313a804532fabacc8d07cc8607eeba_281_0.png)\n\
  \n> 确保 SMTP 服务器运行在 Another host 上，否则 Web 服务触发器将不会被触发，因为我们依赖 SMTP 触发器。或者，移除该依赖。\n\
  \n现在我们可以开始演示了。停止 Another host 上的 Web 服务器。等待触发器更新其状态，并检查 Web 服务器的状态。它应该会自动再次启动。\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_281_1.png)\n\n> 默认情况下，所有动作都带有两个条件。其中一个条件限制动作仅在触发器进入\
  \ **PROBLEM** 状态时触发，而在触发器恢复到 **OK** 状态时不触发。对于这个动作而言，这是一个非常有用的设置；否则，Web 服务器在检测到宕机时会重启一次，然后在检测到恢复时又会重启一次。这种配置错误并不明显，因此可能会在一段时间内不被发现。此外，应该避免为重启服务的动作启用恢复消息。\n\
  \n请注意，对代理执行的远程命令仅适用于被动代理——它们在主动模式下不起作用。这并不意味着你不能在这类主机上使用主动监控项——你可以这样做，但服务器直接连接到该代理时，远程命令总是会以被动模式尝试执行。在某些情况下，所有监控项都是主动的，因此导致服务器与代理之间连接无法工作的配置更改可能不会被注意到——然后远程命令就会失败。如果你所有监控项都是主动的，并且想要使用远程命令，那么设置一个被动监控项来检查该类监控项是否仍然有效可能是值得的。\n\
  \n虽然像这样需要重启服务表明存在问题，而这个问题最好在服务本身中加以解决，但有时它可以作为一种紧急解决方案，或者用于专有软件供应商无响应的情况。\n\n##\
  \ 全局脚本\n\n在前端查看数值和图形既美观又实用，但有些情况下可能需要立即获取额外信息，或者需要手动调用某个操作，例如启动升级过程、重启系统或执行其他管理任务。Zabbix\
  \ 允许我们直接从前端执行命令——这个功能称为**全局脚本**。让我们看看开箱即用了哪些功能——导航到 **监控 | 事件** 并点击任意条目中的主机名：\n\n\
  ![](img/f5313a804532fabacc8d07cc8607eeba_282_0.png)\n\n该菜单的第二部分包含指向前端各个部分的快捷链接。第一部分标记为**脚本**，这就是我们要找的。目前，Zabbix\
  \ 附带三个预配置脚本——操作系统检测、ping 和 traceroute。我们稍后会更详细地讨论它们，但现在只需点击 **Ping**。将打开一个弹出窗口，显示此脚本的输出：\n\
  \n```\nPING 192.168.56.11 (192.168.56.11) 56(84) bytes of data.\n64 bytes from 192.168.56.11:\
  \ icmp_seq=1 ttl=64 time=0.293 ms\n64 bytes from 192.168.56.11: icmp_seq=2 ttl=64\
  \ time=0.268 ms\n64 bytes from 192.168.56.11: icmp_seq=3 ttl=64 time=0.363 ms\n\n\
  --- 192.168.56.11 ping statistics ---\n3 packets transmitted, 3 received, 0% packet\
  \ loss, time 1998ms\nrtt min/avg/max/mdev = 0.268/0.308/0.363/0.040 ms\n```\n\n\
  注意会有轻微延迟——目标主机被 ping 了三次，我们必须等待其完成才能获得输出。\n\n在前端多个位置，通过从这样的上下文菜单中单击主机，即可使用全局脚本。这些位置如下：\n\
  \n- **监控 | 仪表板**（在**最近 20 个问题**组件中）\n- **监控 | 总览**（当主机位于左侧时）\n- **监控 | 最新数据**（当显示来自多个主机的数据时）\n\
  - **监控 | 触发器**\n- **监控 | 事件**\n- **监控 | 地图**\n- **资产 | 主机**，单击**主机名称**将打开资产概览\n\
  - **报表 | 触发器 Top 100**\n\n将这些脚本称为**预配置**脚本，暗示了我们有能力配置自己的脚本。让我们就这么做吧。\n\n## 配置全局脚本\n\
  \n我们可以从检查现有脚本开始。导航到 **管理 | 脚本**：\n\n| 名称 | 类型 | 执行于 | 命令 | 用户组 | 主机组 | 主机访问权限 |\n\
  |---|---|---|---|---|---|---|\n| 检测操作系统 | 脚本 | 服务器 | sudo /usr/bin/nmap -O {HOST.CONN}\
  \ 2>&1 | Zabbix 管理员 | 全部 | 读取 |\n| Ping | 脚本 | 服务器 | /bin/ping -c 3 {HOST.CONN}\
  \ 2>&1 | 全部 | 全部 | 读取 |\n| Traceroute | 脚本 | 服务器 | /usr/bin/traceroute {HOST.CONN}\
  \ 2>&1 | 全部 | 全部 | 读取 |\n\n我们在菜单中看到的这三个脚本也可以在这里看到。让我们看看它们的作用：\n\n- **检测操作系统：** 此脚本调用\
  \ nmap 并依赖 sudo\n- **Ping：** 使用 ping 工具，并对主机 ping 三次\n- **Traceroute：** 对主机调用 traceroute\
  \ 工具\n\n这三个脚本都在 Zabbix 服务器上执行，因此它们应该适用于任何主机——带有 Zabbix 代理的服务器、交换机、存储设备等。\n\n> 3.0\
  \ 之前的 Zabbix 版本默认丢弃 stderr。如果你看到全局脚本通过在脚本命令后附加 2>&1 将 stderr 重定向到 stdout，那么在那个版本中配置这一点非常重要，否则脚本的错误消息会被静默丢失。自\
  \ Zabbix 3.0 起不再需要这样做，但它也没有任何坏处。\n\n我们稍后会讨论其他选项，但现在先看看这些脚本是否都能工作。Ping 对大多数人来说应该可以工作。Traceroute\
  \ 需要安装 traceroute 工具。至于操作系统检测，它不太可能开箱即用。让我们试着让它工作。\n\n> 如果不希望 Zabbix 管理员获得 Zabbix\
  \ 服务器的 root shell 访问权限，请勿按此处所示配置 sudo。nmap 中有一个功能允许执行命令。相反，创建一个包装脚本，只允许使用带单个参数的\
  \ -O 选项。\n\n首先确保 nmap 已安装在 Zabbix 服务器上。由于脚本使用 sudo，请编辑 /etc/sudoers（或使用 visudo）并添加如下一行：\n\
  \n```\nzabbix  ALL=NOPASSWD: /usr/bin/nmap\n```\n\n> 在发行版软件包中，Zabbix 服务器可能以 zabbixs\
  \ 或 zabbixsrv 用户身份运行，而不是 zabbix——请在 sudoers 配置中使用该用户名。\n\n如有必要，调整 nmap 路径。与重启 Apache\
  \ Web 服务器类似，你可能需要在 /etc/sudoers 中取消注释 requiretty 选项。同样，所有这些更改都必须在 Zabbix 服务器上完成。完成后，从菜单中运行操作系统检测脚本——使用前面提到的位置之一：\n\
  \n```\nStarting Nmap 6.40 ( http://nmap.org ) at 2016-04-16 02:27 EEST\nNmap scan\
  \ report for 192.168.56.115\nHost is up (0.00042s latency).\nNot shown: 996 filtered\
  \ ports\nPORT     STATE SERVICE\n22/tcp   open  ssh\n25/tcp   open  smtp\n80/tcp\
  \   open  http\n443/tcp  closed https\nMAC Address: 08:00:27:DD:4E:9E (Cadmus Computer\
  \ Systems)\nAggressive OS guesses: Netgear DG834G WAP or Western Digital WD TV media\
  \ player (94%), Linux 2.6.32 (94%), Linux 2.6.32 - 3.9 (93%),\nCrestron XPanel control\
  \ system (93%), Linux 2.6.31 (92%), Linux 3.0 (92%), Linux 3.1 (90%), Linux 3.2\
  \ (90%), Linux 2.6.32 - 2.6.35\n(90%), Linux 2.6.32 - 3.2 (90%)\nNo exact OS matches\
  \ for host (test conditions non-ideal).\nNetwork Distance: 1 hop\n\nOS detection\
  \ performed. Please report any incorrect results at http://nmap.org/submit/ .\n\
  Nmap done: 1 IP address (1 host up) scanned in 8.55 seconds\n```\n\n> SELinux 安全框架可能会阻止全局脚本工作。\n\
  \n好极了，成功了！nmap 命令运行需要一些时间。在代理上运行全局脚本时，它们和本章前面讨论的远程命令使用相同的超时时间。此脚本是在服务器上运行的。在这种情况下，前端有\
  \ 60 秒的超时时间。\n\n现在来检查其他脚本选项，并配置一些我们自己的脚本。当系统出现问题时，可能是资源匮乏。我们可能想要找出系统上哪些进程对 CPU 压力最大。导航回\
  \ **管理 | 脚本** 并点击 **创建脚本**。对于我们的第一个脚本，填写以下内容：\n\n- **名称：** `Top CPU using processes`\n\
  - **命令：** `top -n 1 -b | grep -A 10 \"^[ ]*PID\"`\n\n![](img/f5313a804532fabacc8d07cc8607eeba_285_0.png)\n\
  \n> Zabbix 3.0.0 和 3.0.1 版本存在一个 bug——在 **Commands** 字段下方还有另一个 **Command** 字段。请忽略第二个字段。希望这个\
  \ *bug* 能在后续版本中修复。\n\n\n\n\n完成后，点击**添加**。对于 `top` 命令，我们只让它打印进程列表，且仅执行一次。然后，我们获取了标题行及其后的\
  \ 10 行内容——假设标题行以任意数量的空格和字符串 `PID` 开头。\n\n> 我们之前在另一台主机上启用了远程命令——如果你跳过了该步骤，请确保在继续之前启用它们。\n\
  \n导航到**监测 | 事件**，在**主机**列中点击**另一台主机**，然后选择**CPU 使用率最高的进程**。\n\n你可以使用其他任何提供此上下文菜单的位置——我们之前列出了这些位置：\n\
  \n| PID 用户 | PR NI | VIRT RES | SHR S %CPU %内存 | 时间+ 命令 |\n| 1 root | 20 0 | 129216\
  \ 3536 | 2076 S 0,000 1,444 | 0:04.24 systemd |\n| 2 root | 20 0 | 0 0 | 0 S 0,000\
  \ 0,000 | 0:00.04 kthreadd |\n| 3 root | 20 0 | 0 0 | 0 S 0,000 0,000 | 0:03.39\
  \ ksoftirqd+ |\n| 5 root | 0 -20 | 0 0 | 0 S 0,000 0,000 | 0:00.00 kworker/0+ |\n\
  | 6 root | 20 0 | 0 0 | 0 S 0,000 0,000 | 0:03.32 kworker/u+ |\n| 7 root | rt 0\
  \ | 0 0 | 0 S 0,000 0,000 | 0:00.00 migration+ |\n| 8 root | 20 0 | 0 0 | 0 S 0,000\
  \ 0,000 | 0:00.00 rcu_bh |\n| 9 root | 20 0 | 0 0 | 0 S 0,000 0,000 | 0:00.00 rcuob/0\
  \ |\n| 10 root | 20 0 | 0 0 | 0 S 0,000 0,000 | 0:08.40 rcu_sched |\n| 11 root |\
  \ 20 0 | 0 0 | 0 S 0,000 0,000 | 0:25.93 rcuos/0 |\n\n在这个特定情况下，`systemd` 进程占用了大部分\
  \ CPU。运行在此系统上的 Zabbix 代理甚至没有进入前十名。不过，说实话，这个系统上其实也没发生什么大事——所有进程都被报告为完全不使用 CPU。\n\n\
  其他类似的诊断命令可能会显示一些软件包详细信息、**媒体访问控制（MAC）** 地址，或任何其他易于从标准实用程序获取的信息。请注意，在大多数操作系统或发行版上，使用\
  \ `top` 命令无法获取占用内存最多的进程列表——可能需要使用 `ps` 命令。以下代码可能提供有用的内存占用前 10 个进程列表：\n\n```\nps\
  \ auxw --sort -rss | head -n 11\n```\n\n我们在这里获取前 11 行，因为其中也包含了标题行。\n\n现在让我们配置另一个脚本——一个允许我们重启目标系统的脚本。导航到**管理\
  \ | 脚本**，点击**创建脚本**。填写以下内容：\n\n- **名称：** 管理 / 重启。\n- **命令：** reboot。\n- **用户组：**\
  \ 此命令有点风险，因此我们只限制为管理用户使用——选择 **Zabbix 管理员**。\n- **主机组：** 由于这在 SNMP 设备上无法工作，因此让它仅对\
  \ Linux 系统的主机显示是合理的——选择**所选**，然后在文本字段中输入 Linux。在下拉菜单中选择 **Linux 服务器**。\n- **所需主机权限：**\
  \ 我们不希望具有只读访问权限的用户能够重启主机，因此选择**写入**。\n- **启用确认：** 这是一个可能具有破坏性的操作，因此请勾选此复选框。\n- **确认文本：**\
  \ 勾选上一复选框后，我们可以填写此字段。输入 `Reboot this system?`\n\n> 尽管组选择字段可能看起来与其他可以多选组的地方类似，但这里只能选择一个主机组。\n\
  \n我们还可以测试此确认消息的外观——点击**测试确认**：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_287_0.png)\n\
  \n## 响应受监控的条件\n\n虽然**执行**按钮当前处于禁用状态，但我们可以看到这看起来相当易懂。在确认对话框中点击**取消**。最终结果应如下所示——如果确实如此，请点击底部的**添加**按钮：\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_288_0.png)\n\n现在让我们看看这个脚本在菜单中是什么样子——导航到**监测\
  \ | 事件**，在**主机**列中点击**另一台主机**。在弹出菜单中，将鼠标光标移动到**管理**条目上：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_289_0.png)\n\
  \n注意我们使用的语法如何创建了子菜单——斜杠用作分隔符。我们可以将 Ping、Traceroute 和 CPU 使用率最高的进程分组为“诊断”，在“管理”部分添加更多条目，并创建一个有用的工具集。请注意，我们还可以在服务器上使用\
  \ zabbix_get 来轮询我们可能不希望持续监控的单个监控项。条目可以按这种方式无限嵌套，但要注意不要创建太多层级。这种鼠标悬停菜单在超过前几级后就难以使用了，因为很容易误操作导致所有子菜单突然关闭。\n\
  \n关于“重启”条目，如果添加它显得有点风险，别担心——它实际上并不起作用。首先，我们必须在命令中使用 sudo。其次，我们必须配置 sudoers 以实际允许\
  \ zabbix 用户运行该命令。\n\n## 在动作中重用全局脚本\n\n某些以此方式添加的全局脚本仅适合在交互式使用时才有意义——大多数数据收集或诊断类脚本可能都属于这一类。但我们的“重启”条目也可能在动作操作中被重用。这样，我们就不需要在全局脚本和每个动作中单独配置此类命令，而是可以有一个统一的位置来控制重启如何发生。也许我们想要将重启命令更改为在\
  \ 10 分钟后发起待处理的重启。这样，可能正在系统上工作的系统管理员就有时间取消重启并更详细地调查问题。\n\n我们已经创建了用于重启的全局脚本。如果我们有一个需要重启整个系统的触发器，我们将创建一个具有适当条件的动作。在动作属性中，编辑操作时，在“操作类型”下拉菜单中选择“远程命令”，即可重用全局脚本。然后，在“类型”下拉菜单中，必须选择“全局脚本”并指定一个具体脚本：\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_290_0.png)\n\n由于这些脚本既可以从前端使用，也可以在动作中使用，因此它们不仅仅被称为前端脚本——它们是全局脚本。\n\
  \n## 总结\n\n在本章开头，我们讨论了动作。动作控制着当触发器触发时执行什么操作，并且它们有非常广泛的配置内容，涉及不同级别，包括各种精确度的条件、消息内容和实际执行的操作——从简单的电子邮件发送和使用自定义脚本，到强大的远程命令执行。我们还了解了影响动作的其他内容，例如用户媒介配置和用户权限。\n\
  \n让我们回顾一下与告警相关的概念：\n\n- 触发器是包括严重性级别在内的问题定义，触发器表达式包含有关计算和阈值的信息\n- 事件是发生的事情——也就是说，触发器从\
  \ PROBLEM 状态变为 OK 状态等等\n- 动作是一个配置实体，具有特定条件集，这些条件决定何时调用它以及要执行的操作\n- 操作是动作的属性，定义了如果调用此动作该怎么做，并且通过操作来配置升级\n\
  - 告警或通知是实际发送出去的内容——电子邮件、短信或任何其他消息\n\n除了简单的一次性消息，我们还弄清楚了 Zabbix 中内置升级的工作方式，并对一些问题进行了升级。虽然升级允许我们制定相当复杂的响应场景，但在配置时必须注意。一旦启用，它们允许我们根据问题发生以来经过的时间以及其他因素执行不同的操作。我们讨论了通知的常见问题，包括用户必须具有查看主机的权限才能收到有关主机的通知，以及恢复消息仅发送给收到原始问题消息的用户。\n\
  \n到目前为止，我们已经学习了三种避免触发器抖动导致过多通知的方法：\n\n- 使用触发器表达式函数（如 min()、max() 和 avg()），仅当值在定义的时段内处于特定范围内时才触发触发器\n\
  - 使用迟滞，并且仅当当前值低于（或高于）阈值某个安全距离时才返回 OK 状态\n- 创建跳过前几步的升级，从而仅在问题持续一段时间未解决时才发送消息\n\n\
  前两种方法与最后一种不同。使用不同的触发器函数和迟滞会改变触发器的工作方式，影响其触发速度以及关闭速度。对于升级，我们不会影响触发器的行为（因此它们仍会显示在“监测\
  \ | 触发器”和其他位置），但会在触发器触发时引入延迟通知。\n\n最后，我们弄清楚了全局脚本是什么，并尝试手动 ping 一台主机并获取其上 CPU 使用率最高的进程列表。至于动作操作，我们讨论了几种响应问题的方法：\n\
  \n- 发送电子邮件\n- 运行命令（在 Zabbix 代理或服务器上执行）\n- 运行 IPMI 命令\n- 通过 SSH 或 telnet 运行命令\n-\
  \ 重用全局脚本\n\n最后一种方法允许我们配置一次脚本，并可能在单一位置为所有系统重新配置它。\n\n\n\n\n\n在配置触发器（triggers）和动作（actions）时，有一些小细节既能让你更轻松，也可能带来难以发现的问题。希望这里对基础内容的介绍能帮助你利用前者、避免后者。\n\
  \n在下一章中，我们将看到如何避免在每台主机上单独配置我们已经知道的一些内容（包括监控项和触发器）。我们将使用模板（templates）在多个主机上轻松管理此类配置。\n"
- '## 使用模板简化复杂配置


  我们目前的配置有两台环境相似的主机，因此我们将监控项从一台复制到了另一台。但是，当有大量主机需要监控相似的参数时，该怎么办呢？手动复制监控项相当繁琐。更糟糕的是，当需要为所有主机更改某些内容时（例如监控项间隔或进程名称），情况会更加麻烦。幸运的是，Zabbix
  提供了一种通过模板系统统一配置这些内容的方法。


  ## 识别适合使用模板的场景


  模板让 Zabbix 管理员能够减少工作量并简化配置。但是，要正确部署模板，我们必须首先识别那些需要或受益于模板的用例。简而言之——我们必须弄清楚 Zabbix
  中的模板到底是什么。


  当我们创建第二台受监控的 Linux 主机时，我们手动从第一台主机复制了监控项。如果愿意，我们也可以复制触发器。这种复制工作并不是最佳选择，因此我们可以为模板创建监控项和触发器，然后将模板链接到目标主机。由于这种关联，主机会立即获得模板中定义的所有监控项和触发器。之后，当我们想为所有主机更改某些监控项参数时，只需修改一次即可。对模板所做的更改会传播到关联的主机。因此，模板最适用于你希望在多台主机上使用的监控项和触发器，比如那些
  Linux 机器。即使你只有某一类型的单一设备，也可能值得为其创建模板，以防将来出现可以使用相同配置的新设备。


  ## 使用模板简化复杂配置


  例如，如果我们在某台主机上运行着 **Apache httpd** 和 **MySQL**，我们可以将与这些服务相关的所有监控项和触发器分别拆分成独立的模板：


  ![](img/f5313a804532fabacc8d07cc8607eeba_294_0.png)


  修改 **MySQL** 模板中的监控项会将更改向下传播到 **主机**。添加更多主机会变得很简单——我们只需将它们关联到适当的模板即可。在模板中进行的更改将应用到所有下游主机。


  虽然我们创建的 snmptraps 主机看起来是直接创建对象的合适候选，但也可能出现这样的情况：SNMP 代理发送的陷阱（traps）能在 Zabbix 中已配置的主机之间正确分配，但偶尔会有设备发送的陷阱找不到已配置的主机或相应的
  SNMP 监控项。如果我们仍然希望这类陷阱能被整理到通用陷阱主机中对应的监控项里，我们就会再次使用模板为相应主机和我们的通用主机创建此类监控项。


  模板是 Zabbix 配置中一个非常有价值的工具。不过这些听起来有点枯燥，让我们来实际设置一些模板吧。


  ## 创建模板


  打开 **配置 | 模板**。我们可以看到，已经有 38 个预定义模板。不过我们要创建自己的专用模板；点击 **创建模板**。这会打开一个需要填写的简单表单：


  - **模板名称：** `C_Template_Linux`

  - **新组：** `Custom templates`


  ![](img/f5313a804532fabacc8d07cc8607eeba_295_0.png)


  名称开头的 C_ 代表 **“Custom”（自定义）**。我们还在创建一个新组来存放我们的模板，并且不使用组配置界面，而是利用这个表单上的快捷方式来创建组。完成后，点击
  **添加**。


  现在我们有了模板，但它还没有用——里面没有监控项或触发器。前往 **配置 | 主机**，我们将使用一种偷懒且快速的方法——将现有监控项和触发器复制到新模板中。在
  **组** 下拉菜单中选择 **Linux servers**，然后点击 **Another host** 旁边的 **监控项**。勾选表头中的复选框以选中所有监控项，然后点击底部的
  **复制** 按钮。


  > 记住，要选择连续的一组复选框，可以使用范围选择——先选中范围内的第一个复选框，按住 **Shift** 键，再点击范围内的最后一个复选框。


  在下一个界面中，在 **目标类型** 下拉菜单中选择 **模板**，在 **组** 下拉菜单中选择 **Custom templates**。这样只剩下一个条目，所以在
  **目标** 部分勾选 **C_Template_Linux** 旁边的复选框：


  ![](img/f5313a804532fabacc8d07cc8607eeba_295_1.png)


  完成后，点击 **复制**。所有监控项都应该成功复制。


  > 在这种情况下，目标模板没有配置任何监控项。由于同一主机不能有两个具有相同键（key）的监控项，因此尝试复制已存在的监控项会失败。


  在左上角，点击 **详细信息** 链接。这会展开消息，我们可以看到所有这些监控项都已添加到目标模板中：


  ![](img/f5313a804532fabacc8d07cc8607eeba_296_0.png)


  现在我们需要对触发器做同样的操作，因此点击监控项列表上方导航栏中的 **触发器**，然后勾选表头中的复选框。这次要取消勾选 **One SSH service
  is down**（SSH 服务之一已关闭），因为这个触发器跨越了两台主机。如果把这个触发器复制到模板中，会产生各种奇怪的效果。


  > 这里的操作顺序很重要，先复制监控项，再复制触发器。如果触发器引用的监控项不存在，就无法创建触发器，所以如果先复制触发器会失败。复制触发器不会尝试复制其引用的监控项。


  再次点击底部的 **复制** 按钮。在下一个界面中，在 **目标类型** 下拉菜单中选择 **模板**，在 **组** 下拉菜单中选择 **Custom templates**。在
  **目标** 部分勾选 **C_Template_Linux** 旁边的复选框，然后点击 **复制**。所有触发器都应该成功复制。当然，我们不必先创建一台主机、在上面创建实体，然后再将它们复制到模板——在创建新模板时，你会希望直接在模板上创建实体。如果你之前不太细心，没有事先考虑模板化，那么像这样复制是更快创建模板的好方法。


  ## 将模板链接到主机


  现在，我们想把这个模板链接到我们的第一台主机“A test host”。首先，让我们比较一下新建模板和那台主机的监控项列表。在一个浏览器窗口或标签页中打开 **配置
  | 主机**，在另一个中打开 **配置 | 模板**。在第一个窗口中，在 **组** 下拉菜单中选择 **Linux servers**，然后点击 **A test
  host** 旁边的 **监控项**。在另一个窗口中，在 **组** 下拉菜单中选择 **Custom templates**，然后点击 **C_Template_Linux**
  旁边的 **监控项**。将两个窗口并排放置，比较列表：


  | 名称 | 触发器 | 键 | 名称 | 触发器 | 键 |

  |---|---|---|---|---|---|

  | CPU load | 触发器 1 | system.cpu.load | CPU load |  | system.cpu.load |

  | Full OS name |  | system.uname | Experimental SNMP trap |  | netSnmpExperimental2
  |

  | ICMP ping performance |  | icmppingsec | ICMP ping performance |  | icmppingsec
  |

  | Incoming traffic on interface lo |  | net.if.in[lo] | Incoming traffic on interface
  enp0s8 |  | net.if.in[enp0s8] |

  | Incoming traffic on interface enp0s8 |  | net.if.in[enp0s8] | Incoming traffic
  on interface lo |  | net.if.in[lo] |

  | SMTP server status | 触发器 1 | net.tcp.service[smtp] | Local time | 触发器 1 | system.localtime
  |

  | SNMP trap fallback | 触发器 1 | snmptrap.fallback | SMTP server status | 触发器 1 |
  net.tcp.service[smtp] |

  | SNMP trap tests |  | snmptrap[test] | SNMP trap fallback |  | snmptrap.fallback
  |

  | SSH server status | 触发器 1 | net.tcp.service[ssh] | snmptraps | 触发器 1 | snmptraps2
  |

  | Web server status | 触发器 1 | net.tcp.service[http,,80] | SNMP trap tests |  | snmptrap[test]
  |

  | Zabbix agent version |  | agent.version | SSH server status |  | net.tcp.service[ssh]
  |

  |  |  |  | Testfile exists | 触发器 1 | vfs.file.exists[/tmp/testfile] |

  |  |  |  | Web server status | 触发器 1 | net.tcp.service[http,,80] |

  |  |  |  | Zabbix agent version |  | agent.version |


  我们可以看到，模板比主机多了三个监控项。查看列表可以看出，模板中有但主机没有的监控项都是我们后来添加的两个与 SNMP 相关的监控项——Experimental
  SNMP trap 和 snmptraps——时间监控项 Local time，以及检查文件的 Testfile exists。如果模板有四个主机缺失的监控项，但总数只比主机多三个，这意味着主机应该有一个模板没有的监控项——没错，Full
  OS name 存在于主机上，但在模板中缺失。牢记这一点，返回 **配置 | 主机**。






  # 使用模板简化复杂配置


  确保 **Group** 下拉菜单选择为 **all** 或 **Linux servers**，然后在 **NAME** 列中点击 **A test host**。我们终于可以开始使用
  **Templates** 选项卡了——切换到它。在 **Link new templates** 输入框中开始输入 c。在下拉列表中，我们的新模板 **C_Template_Linux**
  应该是最上面的一个——点击它。即使看起来该模板已被添加，实际上并没有——如果我们现在就更新主机，它将不会被关联：


  ![](img/f5313a804532fabacc8d07cc8607eeba_298_0.png)


  点击模板名称下方 **Add** 控件。此表单可能非常令人困惑，因此请记住在这里需要执行额外的点击操作。模板被添加到列表后，注意它实际上是一个链接。点击它会打开模板属性并在新窗口中显示。当查看主机属性时，这提供了快速访问模板属性的方式。Zabbix
  前端中许多地方都有这种便捷的链接：


  ![](img/f5313a804532fabacc8d07cc8607eeba_298_1.png)


  最后，点击底部的 **Update** 按钮。让我们来看看此操作做了什么——点击左上角的 **Details** 链接。在展开的 **Details** 面板中，我们可以看到发生的操作。在此情况下，部分项目被创建，部分被更新：


  ![](img/f5313a804532fabacc8d07cc8607eeba_298_2.png)


  > 当模板链接到主机时，主机上已存在的相同实体将与模板关联，但不会丢失历史数据。仅存在于模板上的实体将被添加到主机并与模板关联。


  再往下滚动一点，你会看到触发器也发生了同样的情况：


  - Updated: Trigger "Web service is down" on "A test host".

  - Updated: Trigger "SMTP service is down" on "A test host".

  - Created: Trigger "SNMP trap has arrived on {HOST.NAME}" on "A test host".


  现在这看起来像是为无所作为做了很多工作，但如果我们需要为具有相同项目和触发器的更多主机添加配置，没有模板的情况下每个主机都需要繁琐的手动复制，这很容易出错。有了模板，我们只需将模板链接到新添加的主机，所有实体就会自动存在。


  > 不要将模板与主机组混淆。它们是完全不同的东西。组用于逻辑主机分组（以及权限分配），但模板定义了主机上监控的内容、它有哪些图形等。更重要的是，单个主机组可以同时包含普通主机和模板。将模板添加到组中不会以任何方式影响该组中的主机，只有链接该模板才会生效。将组视为组织模板的方式，与组织主机的方式相同。


  现在我们可以查看链接的项目在配置中是如何出现的。打开 **Configuration | Hosts**，点击 **A test host** 旁边的 **Items**：


  | NAME | TRIGGERS | KEY |

  |---|---|---|

  | C_Template_Linux: CPU load | Triggers 1 | system.cpu.load |

  | C_Template_Linux: Experimental SNMP trap |  | netSnmpExperimental2 |

  | Full OS name |  | system.uname |

  | C_Template_Linux: ICMP ping performance |  | icmppingsec |


  我们现在希望为此主机使这个特定项目与模板将要链接到的所有其他主机略有不同，因此让我们更改以下内容：


  - **Update interval:** 360

  - **History storage period:** 60


  完成后，点击 **Update**。现在此主机将对单个项目的两个参数进行自定义，而所有其他将与模板关联的主机仍会接收模板中的值。现在让我们再将另一台主机链接到我们的模板。导航到
  **Configuration | Templates**。在这里我们可以看到模板的完整列表以及链接到它们的主机。此屏幕中的链接区域显示各种条目，且列出的实体具有不同的颜色：


  | TEMPLATES ▲ | APPLICATIONS | ITEMS | TRIGGERS | GRAPHS | SCREENS | DISCOVERY |
  WEB | LINKED TEMPLATES | LINKED TO |

  |---|---|---|---|---|---|---|---|---|---|

  | C_Template_Linux | Applications | Items 14 | Triggers 5 | Graphs | Screens | Discovery
  | Web |  | A test host |

  | Template App LDAP Service | Applications 1 | Items 1 | Triggers 1 | Graphs | Screens
  | Discovery | Web |  |  |

  | Template App MySQL | Applications 1 | Items 14 | Triggers 1 | Graphs 2 | Screens
  1 | Discovery | Web |  | Zabbix server |


  - **Gray:** Templates

  - **Blue:** Enabled hosts

  - **Red:** Disabled hosts


  点击 **TEMPLATES** 列中的 **C_Template_Linux**。这将提供一个表单，可以轻松地将多个主机链接到当前模板或从中取消链接。在此情况下我们希望链接一台主机。在
  **Hosts | Templates** 部分，在 **Other | Group** 下拉菜单中选择 **Linux servers**，在该框中标记 **Another
  host**，然后点击 ◄ 按钮：


  ![](img/f5313a804532fabacc8d07cc8607eeba_301_0.png)


  ## Macro usage


  我们之前已将触发器从 **Another host** 添加到模板，但我们没有为 **A test host** 这样做。让我们看看它是否有一些可以用于模板的触发器。点击
  **Items** 列表上方 **Navigation** 栏中的 **Triggers**。从直接附加的触发器列表中（即名称前未加模板名的那些），其中一个触发器考虑了来自两个不同主机的项目，我们之前避免将其复制过来。其他直接附加的触发器是我们感兴趣的。标记
  **NAME** 列中 **CPU load too high on A test host for last 3 minutes** 和 **Critical
  error from SNMP trap** 触发器旁边的复选框，然后点击底部的 **Copy** 按钮。在下一个窗口中，在 **Target** type 下拉菜单中选择
  **Templates**，在 **Group** 下拉菜单中选择 **Custom templates**，然后标记唯一剩余目标旁边的复选框（**C_Template_Linux**）并点击
  **Copy**。这次复制的效果有点更有趣，因此让我们再次展开 **Details** 框：


  ![](img/f5313a804532fabacc8d07cc8607eeba_304_0.png)


  我们复制的两个触发器被添加到模板中。这会导致以下情况：


  - 由于 **A test host** 已链接到修改后的模板，并且它已具有此类触发器，因此该主机的这两个触发器将被更新以反映链接关系

  - **Another host** 没有此类触发器，因此触发器将被创建并与模板关联


  在我们仍在触发器列表中时，在 **Host** 下拉菜单中选择 **Another host**。仔细查看在此次操作中添加到此主机的 CPU load 触发器：


  ![](img/f5313a804532fabacc8d07cc8607eeba_304_1.png)


  等等，这肯定是不正确的。触发器引用了 `A test host`，而这里是 `Another host`。触发器名称在我们第一次添加时是正确的，但现在同一个触发器被应用到多个主机。因此，引用对于除一台主机外的所有主机都是不正确的。让我们尝试修复这个问题。在
  **Group** 下拉菜单中选择 **Custom templates**，然后点击 **NAME** 列中的 **CPU load too high on
  A test host for last 3 minutes** 触发器。将 **Name** 字段更改为 `CPU load too high on {HOST.NAME}
  for last 3 minutes`。


  没错，宏再次派上用场了。


  > 这里使用“宏”一词可能会令人困惑——Zabbix 将其称为宏，尽管它们更准确地应被视为变量。在本书中，我们将遵循 Zabbix 的术语，但请随意将宏理解为变量。


  现在点击 **Update**。在模板的触发器列表中，触发器名称现已更改为 **CPU load too high on {HOST.NAME} for last
  3 minutes**。这不是很具描述性，但你可以在配置部分经常看到这种情况——Zabbix 在配置中不会展开大多数宏。为了验证其是否按预期解析，请导航到 **Monitoring
  | Triggers** 并展开过滤器。将 **Triggers** 状态下拉菜单设置为 **Any**，在 **Filter by name** 字段中输入
  `CPU`，然后点击过滤器下方的 **Filter** 按钮：


  | HOST | NAME |

  |---|---|

  | A test host | CPU load too high on A test host for last 3 minutes |

  | Another host | CPU load too high on Another host for last 3 minutes |


  注意触发器名称现在包含正确的主机名。在大多数情况下，建议在触发器名称中包含此类宏以便轻松识别受影响的主机。


  我们在此使用的宏 `{HOST.NAME}` 解析为主机的可见名称。我们没有指定可见名称，因此使用了主机名。如果主机定义了可见名称，我们也可以选择使用主机名宏
  `{HOST.HOST}`。


  ## User macros


  我们之前使用的宏是内置的。Zabbix 还允许用户定义宏并在以后使用。在这种情况下称它们为变量可能更重要，因此请考虑并行使用该术语。让我们从一个用户宏的实际应用开始，然后稍后讨论细节。





  ## 使用模板简化复杂配置


  转到 **配置 | 模板**，在 **模板** 列中点击 **C_Template_Linux**。切换到 **宏** 标签页并添加一个新宏：


  - **宏：** `{$CPU_LOAD_THRESHOLD}`

  - **值：** `1`


  ![](img/f5313a804532fabacc8d07cc8607eeba_306_0.png)


  完成后，点击 **更新**。我们在模板上定义了一个宏，但此时尚未使用。点击 **C_Template_Linux** 旁边的 **触发器**，然后在 **名称**
  列中点击 **{HOST.NAME} 最近3分钟的CPU负载过高**。更改触发器属性：


  - **名称：** `CPU load too high on {HOST.NAME} for last 3 minutes (over {$CPU_LOAD_THRESHOLD})`

  - **表达式：** `{C_Template_Linux:system.cpu.load.avg(180)}>{$CPU_LOAD_THRESHOLD}`


  请注意，我们在触发器名称和表达式中使用了与模板属性相同的用户宏名称。完成后，点击 **更新**。我们刚才所做的更改没有功能影响——该触发器的工作方式与之前完全相同，只是名称更具解释性。我们做的是将触发器阈值替换为宏，使其参数化，而不是硬编码值。现在我们可以尝试针对单个主机覆盖此值——转到
  **配置 | 主机**，在 **名称** 列中点击 **A test host**。切换到 **宏** 标签页，并切换到 **继承和主机宏** 模式：


  ![](img/f5313a804532fabacc8d07cc8607eeba_306_1.png)


  请注意，在此表单中，我们可以看到我们在模板上刚创建的宏。还有一个 {$SNMP_COMMUNITY} 宏——我们稍后会讨论它的来源。我们还可以看到是哪个模板提供了我们创建的宏。尽管我们记得在这个简单的例子中具体是哪个模板，但在实际环境中，当许多模板链接到一个主机时，这是一个非常有用的功能。要自定义此主机上的该值，请点击
  {$CPU_LOAD_THRESHOLD} 旁边的“更改”控件。“有效值”列输入框变为可编辑——将其更改为 0.9。


  > Zabbix 3.0 是第一个允许解析此类宏的版本。在之前的版本中，我们必须知道确切的宏名称才能覆盖它。也没有合理的方法来识别提供该宏的模板。


  完成后，点击 **更新**。现在我们终于用上了这个宏——通过在主机级别使用相同的名称，我们能够为这个单独的主机覆盖宏值。为了双重检查此更改，转到 **监控 |
  触发器** 并展开过滤器。将 **触发器状态** 下拉菜单设置为 **任何**，在 **按名称筛选** 字段中输入 CPU，然后点击 **筛选**：


  | 主机 | 名称 |

  |---|---|

  | A test host | A test host 最近3分钟的CPU负载过高（超过 0.9） |

  | Another host | Another host 最近3分钟的CPU负载过高（超过 1） |


  此列表确认 Another host 从模板获取宏值 1，而 A test host 已将其更改为 0.9。我们仍在使用相同的模板和相同的触发器，但更改了此单个主机的触发器阈值。您也可以测试触发器的触发。在
  A test host 上，此触发器现在应在新阈值 0.9 处触发。


  还记得我们在“继承和主机宏”部分看到的 {$SNMP_COMMUNITY} 宏吗？到目前为止，我们已经介绍了用户宏可能定义的两个位置——模板和主机级别。实际上还有另一个位置可用。转到
  **管理 | 常规**，并在右上角的下拉菜单中选择 **宏**。此表单看起来与模板和主机宏属性相同，并且这里已经定义了一个宏。


  ![](img/f5313a804532fabacc8d07cc8607eeba_308_0.png)


  我们稍后会详细讨论这个宏，但首先让我们弄清楚这三个级别是如何交互的。例如，我们可以看一下我们刚刚定义的宏的假设用法：


  ![](img/f5313a804532fabacc8d07cc8607eeba_308_1.png)


  除了模板和主机级别的定义之外，我们还可以在全局级别定义此宏，并设置另一个值，在此示例中——2。现在，所有其他未定义此宏的模板和主机都将使用全局值 2。此更改不会影响我们的模板和主机，因为它们已经定义了相同名称的宏。通常，最接近主机的宏定义“胜出”。Zabbix
  首先在主机级别查找宏，然后是模板，最后是全局级别。


  > 只要使用允许的符号——大写字母、数字、下划线和点，宏的名称由我们自己决定。


  转到 **配置 | 模板**，然后点击 **创建模板** 按钮。在 **模板名称** 字段中输入 C_Template_Email，在 **其他组** 框中标记
  Custom templates，点击 ◄ 按钮，然后点击 **添加**：


  ![](img/f5313a804532fabacc8d07cc8607eeba_310_0.png)


  现在让我们填充此模板——在 **组** 下拉菜单中选择 Custom templates，然后点击 C_Template_Linux 旁边的 **监控项**。在
  **名称** 列中标记 SMTP server status 和 Testfile 旁边的复选框，然后点击底部的 **复制** 按钮。在下一个界面中，在 **目标类型**
  下拉菜单中选择 **模板**，在 **组** 下拉菜单中选择 Custom templates，标记 C_Template_Email 旁边的复选框，然后点击
  **复制**。


  这样就处理了监控项，但还有触发器需要处理。点击“监控项”列表上方导航栏中的 **触发器**，在 **名称** 列中标记 SMTP service is down
  和 Testfile is missing 旁边的复选框，然后点击 **复制** 按钮。在下一个界面中，同样在 **目标类型** 下拉菜单中选择 **模板**，在
  **组** 下拉菜单中选择 Custom templates，标记 C_Template_Email 旁边的复选框，然后点击 **复制**。


  > 我们还必须引入测试文件监控项和触发器，因为 SMTP 触发器依赖于测试文件触发器。我们不能只复制 SMTP 触发器，那会留下未满足的依赖关系。


  我们现在有了一个简单的专用电子邮件服务器模板，可以链接到主机。它与我们的自定义 Linux 模板具有相同的关于 SMTP 服务的监控项和触发器。但有一个问题——由于两者都具有相同键的监控项，我们无法将这些模板链接到同一主机，否则会失败。尝试这样做可能会导致类似以下消息：


  ![](img/f5313a804532fabacc8d07cc8607eeba_310_1.png)


  我们将执行一些步骤来更改模板链接：


  - 从“A test host”和“Another host”取消链接 `C_Template_Linux`

  - 从 `C_Template_Linux` 中移除 SMTP 相关的监控项和触发器

  - 将 `C_Template_Email` 链接到这两个主机

  - 将 `C_Template_Linux` 重新链接到这两个主机


  这样，SMTP 相关的监控项和触发器将来自电子邮件模板，同时保留所有已收集的数据。如果我们从 Linux 模板中删除这些监控项，然后链接电子邮件模板，我们也会删除这些监控项已收集的所有值。


  转到 **配置 | 主机**，标记 **A test host** 和 **Another host** 旁边的复选框，然后点击 **批量更新**。切换到 **模板**
  标签页，标记 **链接模板** 复选框和 **替换** 复选框。这将取消链接已链接的模板，但将之前由模板提供的实体保留为直接附加的实体：


  ![](img/f5313a804532fabacc8d07cc8607eeba_311_0.png)


  > 我们将在本章后面更详细地讨论主机批量更新。


  点击 **更新**。现在我们将修改 Linux 模板，移除 SMTP 相关的监控项和触发器。转到 **配置 | 模板**，点击 **C_Template_Linux**
  的 **监控项**，并在 **名称** 列中标记 **SMTP server status** 和 **Testfile exists** 旁边的复选框。在底部，点击
  **删除** 按钮并确认弹出窗口。如果你展开详细信息，你会看到依赖这些监控项的触发器也一并被删除了——我们无需手动删除它们：


  ![](img/f5313a804532fabacc8d07cc8607eeba_311_1.png)





  现在我们可以将新的邮件模板链接进来，同时将修改后的 Linux 模板重新链接回去。我们甚至可以在一步内完成，而且仍然使用批量更新功能。转到 **配置 | 主机**，勾选
  **测试主机 A** 和 **另一台主机** 旁边的复选框，然后点击 **批量更新**。切换到 **模板** 选项卡，勾选 **链接模板** 复选框，并在输入框中输入“C_”。我们的两个模板都会显示出来——点击其中一个，然后再次输入“C_”，点击另一个模板：


  ![](img/f5313a804532fabacc8d07cc8607eeba_312_0.png)


  点击 **更新** 按钮。在此操作后，查看 **配置 | 模板** 中的模板关联列表。每个自定义模板现在都关联了两台主机：


  | 模板 | 应用 | 监控项 | 触发器 | 图形 | 聚合图形 | 自动发现 | Web | 链接的模板 | 链接到 |

  |---|---|---|---|---|---|---|---|---|---|

  | C_Template_Email | 应用 | 监控项 2 | 触发器 2 | 图形 | 聚合图形 | 自动发现 | Web |  | 另一台主机, 测试主机
  A |

  | C_Template_Linux | 应用 | 监控项 12 | 触发器 5 | 图形 | 聚合图形 | 自动发现 | Web |  | 另一台主机, 测试主机
  A |


  单个主机可以链接到多个模板。这允许采用模块化配置，其中每个模板只提供一部分实体，因此服务器可以配置为具有基本 Linux、邮件服务器、Web 服务器、文件服务器以及任何其他模板的任意组合。


  当然，对于单个监控项和触发器来说，这个过程似乎过于复杂，但通常邮件服务器会有更多参数，例如邮件服务器进程数、SMTP、IMAP、POP3 服务状态、垃圾邮件和病毒过滤器状态、队列长度等等。此时，能够通过几次点击快速在一台机器上建立一组监控指标的能力就非常受欢迎了。


  > 取消链接、重新设计和重新链接的方法是一种常见且推荐的做法，用于更改模板配置。只需注意，在模板未链接时不要更改监控项键，或者在模板已链接时删除监控项。


  ## 从主机取消链接模板


  但我们之前提到一台服务器失去了邮件服务器职责，而将两个模板都链接到两台主机实际上并不是正确的操作。现在让我们来处理这个问题。打开 **配置 | 主机**，并在
  **分组** 下拉框中选择 **Linux 服务器**。我们的第一个测试主机将不再提供 SMTP 服务，因此点击 **名称** 列中的 **测试主机 A** 并切换到
  **模板** 选项卡：


  ![](img/f5313a804532fabacc8d07cc8607eeba_313_0.png)


  此部分正确地列出了两个链接的模板。我们现在想要取消链接 **C_Template_Email**，但有两个可能的操作——**取消链接** 和 **取消链接并清除**。那么区别是什么呢？让我们尝试一下，从看起来更安全的那个开始——点击
  **C_Template_Email** 旁边的 **取消链接**，然后点击 **更新**。展开 **详情** 链接以查看发生了什么：


  ![](img/f5313a804532fabacc8d07cc8607eeba_313_1.png)


  看起来监控项和触发器都被取消链接了。这是否是我们想要的？让我们看看。


  点击 **测试主机 A** 旁边的 **监控项**：


  ![](img/f5313a804532fabacc8d07cc8607eeba_314_0.png)


  嗯，不完全——SMTP 相关的监控项仍然存在。因此，简单的取消链接只是解除关联，并在先前链接的主机上保留监控项的副本。如果我们想创建不同的监控项，或者出于历史原因在主机上保留某个监控项以保留数据，这很方便，但这次不是。要解决当前情况，我们可以手动删除两个触发器和监控项，但如果主机还直接附加了一堆实体，这就不那么容易了。在这种情况下，必须手动查找并删除它们，这很容易出错。相反，让我们尝试另一种途径——重新链接此模板，然后将其无痕移除。


  点击导航栏中的 **测试主机 A** 并切换到 **模板** 选项卡。在 **链接新模板** 字段中开始输入“C_”，然后点击 **C_Template_Email**。小心地点击其下方的小型
  **添加** 控件，然后点击 **更新**。展开详情将显示 SMTP 监控项和触发器再次链接到该模板。我们现在回到了起点，两个模板都已链接——是时候再次取消链接了。点击
  **名称** 列中的 **测试主机 A** 并切换到 **模板** 选项卡。在 **链接的模板** 块中点击 **C_Template_Email** 旁边的
  **取消链接并清除**，点击 **更新**，然后展开 **详情**：


