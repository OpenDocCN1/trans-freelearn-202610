  \n让我们了解如何轻松获取某个监控项的历史数据。转到“监控 | 最新数据”，在“主机”筛选字段中选择 A test host，然后点击“筛选”。点击 CPU load\
  \ 旁边的“图形”。这会显示标准的 Zabbix 图形。这并不是我们想要的，对吧？但这个界面允许我们通过右上角的下拉框轻松访问原始数据——在其中选择“值”。\n\
