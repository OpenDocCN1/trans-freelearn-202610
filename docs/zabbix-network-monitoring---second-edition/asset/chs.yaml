  ## 使用批量更新


  与监控项类似，批量更新也可以用于主机，而且我们已经多次使用过它。让我们更详细地探讨批量更新在这里可能提供的功能——转到 配置 | 主机。在主机列表中，勾选 **测试主机
  A** 和 **另一台主机** 旁边的复选框，然后点击底部的 **批量更新** 按钮。然后切换到 **模板** 选项卡并勾选 **链接模板** 复选框。


  选择模板的方式与在主机属性中相同——我们可以键入并按该子字符串搜索，也可以点击 **选择** 按钮从列表中选择。我们可以在该字段中指定多个模板，并且没有像主机属性中那样的额外控件需要点击——在那里我们必须点击
  **添加**。在此表单中，只需将模板列在第一个字段中即可。在批量更新和更新单个主机之间切换可能相当具有挑战性，因为这些表单的工作方式不同——务必非常非常小心。


  还有两个复选框——在讨论它们的作用之前，让我们先弄清楚默认会发生什么。如果我们列出一个或多个模板然后更新配置，则该模板会链接到所有选定的主机，同时保留现有模板——现有模板不会受到任何影响。复选框会修改此行为：


  ![](img/f5313a804532fabacc8d07cc8607eeba_315_0.png)


  - **替换：** 现有模板将被取消链接。与之前相同，来自这些模板的任何实体都不会被触及。由该模板控制的监控项、触发器以及其他所有内容都保留在主机上。如果我们在表单中指定的模板包含相同键的监控项，这些监控项会链接到新模板。

  - **取消链接时清除：** 现有模板将被取消链接并清除——也就是说，来自它们的所有内容都会被删除。这几乎就像清除主机，但直接附加的实体不会被触及，只有模板化实体受到影响。


  当然，如果存在任何冲突，例如两个模板中出现相同的监控项键，则此类链接将会失败。


  我们此时不会修改模板链接，因此请点击 **取消** 按钮。


  ## 嵌套模板


  仍然提供邮件服务的那台主机——**另一台主机**——现在分配了两个模板。但如果我们把可以逻辑分组的所有服务、应用程序和其他数据都分离到单独的模板中呢？那将导致我们需要链接到单个主机的一堆模板。这还不算糟糕，但如果我们有两台这样的服务器呢？或者三台？或者
  20 台？在某个时刻，即使是带模板的配置也可能变得难以管理——在大型复杂环境中，每台主机的模板数量很容易达到十几个。


  这就是简单性与强大功能相结合的地方。在幕后，模板与主机并没有太大区别。实际上，它们就是主机，只是有点特殊。这意味着一个模板可以链接到另一个模板，从而创建嵌套配置。


  这如何应用于我们的情况？让我们创建一个简单的配置，以便轻松添加更多具有相同设置的主机。在 **配置 | 模板** 中，点击 **创建模板** 按钮。在 **模板名称**
  字段中输入 `C_Template_Email_Server`，在 **其他组** 框中勾选 **自定义模板**，然后点击 ◄ 按钮。


  切换到 **链接的模板** 选项卡。在这里，我们可以将其他模板链接到此模板。点击 **选择** 按钮，在弹出窗口中勾选 **C_Template_Email**
  和 **C_Template_Linux** 旁边的复选框：




  ![](img/f5313a804532fabacc8d07cc8607eeba_317_0.png)


  点击 **Select**。在 **Link new templates** 部分点击小小的 **Add** 链接——不要点按钮。两个模板都被添加到链接部分：


  ![](img/f5313a804532fabacc8d07cc8607eeba_317_1.png)


  完成后，点击底部的 **Add** 按钮。现在我们有一个模板，它涵盖了安装并运行着邮件服务器的基础 Linux 系统配置，所以我们仍需将其正确链接到将承担此角色的主机上。


  打开 **Configuration | Hosts**，在 NAME 列点击 **Another host** 并切换到 **Templates** 选项卡。在
  **Linked templates** 部分，点击两个 **Unlink** 链接。在 **Link new templates** 输入框中输入 `email`
  并点击 **C_Template_Email_Server**。点击小小的 **Add** 控件，然后点击表单底部的 **Update**。操作成功完成，于是展开
  **Details** 链接。正如我们在此看到的，所有元素首先被取消链接，然后才更新。基本上，先取消链接之前的模板，但项目和触发器保留在原位，然后再重新链接到新模板。这种顺序的最大好处是保留了所有项目的历史数据。


  ## 使用模板简化复杂配置


  但我们在这里做的最大事情是创建了一个嵌套模板。这样的模板链接到其他模板，因此它继承了所有项目、触发器和其他特性，同时通常会对原始模板条件进行一些修改。在本例中，我们的嵌套模板包含来自另外两个模板的实体，如下所示：


  ![](img/f5313a804532fabacc8d07cc8607eeba_318_0.png)


  虽然这看起来与之前的情况相比——两个模板链接到单个主机——只获得了少量收益，但当你的监控环境稍大时，这是一种非常有效的方法。如果只有一个主机需要多个模板的特定组合，直接将这些模板链接到主机是可以的。一旦数量增加，设置模板嵌套会更方便，为这些主机创建一个单一模板进行链接。完成后，添加同类的新主机只需链接到一个模板即可，这大大简化了配置并最大限度地减少了出错的可能性。


  查看主机列表，我们可以在 **TEMPLATES** 列看到影响此主机的所有模板：


  | TEMPLATES |

  |---|

  | C_Template_Email_Server (C_Template_Email, C_Template_Linux) |


  注意新的 **C_Template_Email_Server** 模板被列在最前面，而另外两个模板则在括号中列出。直接链接到主机的模板列在前面，而由第一级模板引入的第二级模板则在括号中列出。这里只显示前两级——如果我们有更多层级的嵌套，则在主机列表中看不到它们。


  现在让我们回顾一个模板化项目。从主机列表中，点击 Another host 旁边的 Items。点击 NAME 列中的 SMTP server status。这次我们关注这里的第一行，Parent
  items：


  ```

  Parent items  C_Template_Email => C_Template_Email_Server

  ```


  这是模板化项目中出现的内容。更高级别的项目可以在这里看到并访问，对于此项目显示了两个层级。离主机更近的模板列在最后，而第一个模板是项目来源的模板。如果我们有超过两个层级，也会显示出来。这行作为快速信息，说明特定项目源自何处以及什么可能会修改它，同时也是向上访问的便利方式。如果我们在某个模板化项目中发现简单错误，我们可以一键进入更高级别的项目，而不必去
  Configuration | Templates，找到正确的页面和/或模板，然后对项目重复此操作。相同的父实体便利访问行也适用于触发器和其他实体。


  在使用嵌套模板设置时，继承的宏解析助手就更加有用了。如果我们只有一个主机和一个模板，没有助手，我们首先会在主机上检查宏，如果未定义则在模板上检查，如果模板上也未定义则在全局级别检查。使用嵌套模板我们必须逐个检查所有模板。有了助手，我们可以在主机属性的同一宏选项卡中看到结果以及哪个确切模板提供了该值。


  模板嵌套是一种方便的方式来分组模板并将单个模板应用于目标主机，同时仍能让不同的功能在多个低级模板中得到适当的拆分和重用。尽管如此，仍应注意不要创建过度的嵌套。两层嵌套相当常见，但一位高级
  Zabbix 用户承认，设计一个具有五层嵌套的模板系统有点过分，下次他会将自己限制在最多四层。


  ## 总结


  在 Zabbix 中，模板在简化配置和允许大规模更改方面发挥着主要作用。如果你是文字处理软件的熟练用户，你可能使用样式。TeX、Web 的 CSS 样式以及其他地方也使用相同的概念——将内容与呈现分离有助于在需要更改时减少工作量。


  虽然将模板与样式进行比较乍一看似乎牵强，但实际上相似程度足够。就像样式一样，你可以将主机与提供的服务分离，并以集中方式定义这些服务。与文字处理器文档中标题样式允许一次操作更改所有该级别标题的字体大小一样，Zabbix
  中的模板允许更改直接或嵌套链接主机的某些参数。


  我们在 Zabbix 中使用了多个允许修改模板链接的位置：


  - **Host properties**：这允许将多个模板链接、取消链接以及取消链接并清除到单个主机

  - **Host mass update**：这允许将多个模板链接到多个主机，以及取消链接或取消链接并清除之前链接的所有模板（但不能取消链接或取消链接并清除特定模板）

  - **Template properties**：这允许将多个主机从单个模板链接和取消链接（但不能取消链接并清除）


  在前面的列表中，我们也可以在谈论主机时谈论模板。这在管理嵌套模板配置时使用。


  Zabbix 中的宏就像变量——它们提供了一个通用占位符，后续会被替换为主机特定的值。我们查看了一些内置宏，也查看了用户宏，允许我们定义自己的变量以在主机级别具有自定义的项目、触发器和其他实体。


  正如我们在模板中对项目和触发器进行所有重新排列时所看到的，在实际配置之前规划合理的模板策略会更容易。强烈建议你在急于配置之前坐下来绘制至少一个非常基本的受监控事物层次结构——这在长期来看会让事情更轻松。


  在下一章中，我们将查看数据在 Zabbix 中可视化的方式。我们将从图表和网络地图开始，看看如何显示各种运行时信息。我们将详细讨论图表的定制和使用。

  '
- "## 9 使用图表和地图可视化数据\n\n到目前为止，我们仅简要查看了一些基本可用的数据可视化选项，主要是显示项目随时间变化的简单图表。这并不是 Zabbix\
  \ 提供的全部——还有更多选项，我们现在将探索。本章中我们将查看的 Zabbix 可视化选项包括以下内容：\n\n- 图表，包括简单、临时和自定义图表\n- 可以以不同方式显示信息的地图——例如，地理上\n\
  \n### 可视化什么？\n\n我们设置了在需要时向我们发送信息的动作，我们还有远程命令可以根据需要重启服务并执行许多其他操作。那为什么还要可视化任何东西呢？\n\
  \n虽然对大多数人来说这个问题会显得愚蠢，因为我们很清楚想要可视化什么数据，但并非所有功能都显而易见。\n\n当然，当查看图表时评估问题会更容易，因为这使我们能够轻松发现问题开始的时间、轻松关联各种参数并发现反复出现的异常。诸如图表之类的东西也可以用作简单表示来回答诸如“那么\
  \ Zabbix 系统做什么？”这样的问题。在向非技术管理层展示成果和效益时，这会很有用。\n\n\n\n\n\n## 使用图表和地图可视化数据\n\n另一个有用的领域是在大屏幕上显示数据。这通常是系统状态的高级概览，并放置在系统操作员或帮助台所在的位置。想象一下，一台大型等离子电视，显示着该国的帮助台地图，列出各个公司位置以及其中存在的任何问题。\n\
  \n当拥有一个精美的图表，或以其他方式直观地展示信息能够提供很大帮助时，肯定还可以想到更多应用场景。现在，我们来看看 Zabbix 已经提供的选项。\n\n##\
  \ 单个元素\n\n我们可以区分单个可视化元素和组合可视化元素。这里所说的单个元素，是指在一个容器中显示特定信息的元素，例如图表或网络拓扑图。虽然单个元素可以包含来自多个监控项和主机的信息，但通常不能包含其他\
  \ Zabbix 前端元素。\n\n## 图表\n\n虽然前面的定义听起来可能有些令人困惑，但其实很简单——图表就是单个可视化元素的一个例子。图表可以包含一个或多个监控项的信息，但不能包含其他\
  \ Zabbix 可视化元素，例如其他图表。因此，图表可以被视为单个元素。\n\n在试图说服管理层购买新的数据库服务器时，容量规划方面很难有其他工具能胜过图表。如果你能够展示网站访问者数量正在增加，并且按照当前增长速度，几个月后就会达到当前限制，这样的说服力会强得多。\n\
  \n## 简单图表\n\n我们已经了解了此列表中的第一个可视化元素：所谓的**简单图表**。它们有些特殊：由于不需要进行配置，因此你不必创建它们——每个监控项都可以使用简单图表。对吗？并不完全是。它们仅适用于数值型监控项，因为为文本型监控项绘制图表并没有**太大意义**。为了回顾一下相关内容，我们来看一下\
  \ **Monitoring | Latest data** 中的监控项：\n\n| 名称 ▲ | 最后检查时间 | 最后值 | 变化 |\n|---|---|---|---|\n\
  | - other -（13 个监控项） |  |  |  |\n| CPU 负载 | 2016-04-27 15:15:25 | 0 | 图表 |\n| 实验性\
  \ SNMP 陷阱 |  |  | 历史记录 |\n| 完整操作系统名称 | 2016-04-27 15:15:22 | Linux testhost 3.12.53-40-defa...\
  \ | 历史记录 |\n| ICMP ping 性能 | 2016-04-27 15:15:32 | 0.04 ms | 图表 |\n\n对于数值型监控项以外的其他监控项，右侧的链接会显示**历史记录**。对于数值型监控项，我们会看到**图表**链接。这只取决于数据的存储方式——单位或值映射等因素不会影响图表的可用性。如果你想回顾缩放等基本图表控件的信息，请参阅*第\
  \ 2 章：获取第一条通知*。\n\n虽然简单图表不需要配置，但它们也不提供任何配置功能。它们很容易获得，但功能相当有限。因此，虽然它们对于单个监控项很有用，但无法绘制多个监控项，也无法更改视觉样式。当然，如果没有其他方式，这将是一个很大的限制；但幸运的是，Zabbix\
  \ 还提供另外两种图表类型——**临时**图表和**自定义**图表。\n\n## 临时图表\n\n简单图表很容易访问，但只能显示单个监控项。在单个图表中快速查看多个监控项，有一种非常简单的方法——在\
  \ Zabbix 中，这类图表称为**临时**图表。临时图表可以从 **Latest data** 页面访问，方式与简单图表相同。我们来看一个临时图表——导航至\
  \ **Monitoring | Latest data**，然后查看左侧。与配置部分的许多页面类似，这里有一些复选框。勾选 **A test host** 中\
  \ CPU 负载和网络流量监控项旁边的复选框：\n\n|  | A test host | - other -（13 个监控项） |\n|---|---|---|\n\
  | ☑ | CPU 负载 | |\n| ☐ | 实验性 SNMP 陷阱 | |\n| ☐ | 完整操作系统名称 | |\n| ☐ | ICMP ping 性能\
  \ | |\n| ☑ | 接口 enp0s8 的传入流量 | |\n| ☑ | 接口 lo 的传入流量 | |\n\n非数值型监控项旁边的复选框处于禁用状态。\n\
  \n在页面底部，点击 Display graph 按钮。此时会显示一张包含所有已选监控项的图表：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_324_0.png)\n\
  \n现在看一下图表顶部——那里出现了一个新的控件：Graph type：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_324_1.png)\n\
  \n它允许我们在普通图表和堆叠图表之间快速切换。点击 Stacked：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_324_2.png)\n\
  \n对于这张图表而言，堆叠模式意义不大，因为 CPU 负载和网络流量具有完全不同的比例和含义，但至少我们可以快速地在两种模式之间切换。返回 **Monitoring\
