  \ 1 小时时间段就足够了。对于某些轮询频率较低的监控项，我们通常需要使用更长的时间段：\n\n| 时间戳 | 值 |\n|---|---:|\n| 2016-06-03\
  \ 19:19:55 | 0.02 |\n| 2016-06-03 19:19:25 | 0.03 |\n| 2016-06-03 19:18:55 | 0.05\
  \ |\n\n虽然我们可以使用支持 HTML 复制的浏览器从该表格中复制数据，然后粘贴到能够解析 HTML 的软件中，但这并不总是可行的。一个快速简便的解决方案就在右上角——只需点击\
