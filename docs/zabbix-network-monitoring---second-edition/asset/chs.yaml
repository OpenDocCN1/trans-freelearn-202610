  **Update**。现在是时候查看结果了——转到 **Monitoring | Screens**，并点击 **NAME** 列中的 **Local servers**。查看屏幕顶部的可用下拉菜单：


  ![](img/f5313a804532fabacc8d07cc8607eeba_389_0.png)


  一旦我们将某些元素标记为动态，我们就获得了其他主机的选择。让我们看看它工作得如何。 从 **Group** 下拉菜单中选择 **Linux servers**，从
  **Host** 下拉菜单中选择 **Another host**：


  ![](img/f5313a804532fabacc8d07cc8607eeba_389_1.png)






  # 使用屏幕和幻灯片可视化数据


  太棒了！标记为动态的元素现在会显示所选主机的数据，而非动态元素则无论选择哪个主机都显示相同的数据。静态元素可以像我们屏幕中的地图一样，但如果未勾选**动态监控项**选项，它们也可以是图形。这样，我们就能切换屏幕，让某些图形显示服务器信息，而其他图形则继续显示常规的网络信息。


  > 只能将来自主机的图形添加到屏幕中；来自模板的图形则不能。对于动态屏幕监控项，存在这样一种风险：最初选择图形的主机被删除，从而破坏屏幕。旧版Zabbix允许在此包含来自模板的图形，该功能可能稍后恢复。


  # 其他屏幕元素


  这是一个漂亮而简单的屏幕，但还有更多可用的屏幕元素可供选择，所以让我们创建另一个屏幕。转到屏幕列表——如果监控视图中显示了某个屏幕，请点击**所有屏幕**，然后点击**创建屏幕**按钮。在生成的表单中，在**名称**字段中输入“实验屏幕”，在**列**和**行**字段中都输入2，然后点击**添加**。在屏幕列表中，点击**实验屏幕**旁边的**构造器**。和之前一样，点击左上角单元格中的**更改**链接。在**资源**下拉菜单中，选择**简单图形**，然后点击**监控项**字段旁边的**选择**。从**主机**下拉菜单中选择**测试主机**。


  正如我们所见，无需手动配置即可使用的所有简单图形也可以添加到屏幕中。这里，点击**CPU负载**条目。在**宽度**字段中输入600，然后点击**添加**。点击右上角单元格中的**更改**链接。从**资源**下拉菜单中选择**事件历史**，然后点击**添加**。


  嗯，突然我们的图形看起来不那么好了——它应该更高一些才能适应这个布局。我们可以将它放在事件列表下方，但这需要删除它并重新配置右下角单元格。嗯，也不尽然。将图形拖到右下角单元格并松开鼠标按钮：


  ![](img/f5313a804532fabacc8d07cc8607eeba_391_0.png)


  > 以前的Zabbix版本会高亮目标单元格，以告知用户对象将被放置在那里。该功能在Zabbix 3.0.0中已丢失。在撰写本文时，尚不清楚哪个版本将修复此问题。


  元素（此处指图形）会从一个单元格移动到另一个单元格，无需重新配置各个单元格。


  左上角单元格现在为空，因此点击那里的“更改”。从“资源”下拉菜单中选择“触发器信息”，在“样式”选项中选择“垂直”，然后点击“添加”。此屏幕元素为我们提供了按严重程度分布的触发器高级信息。现在让我们进一步填充这个屏幕。点击左下角的“更改”链接。在屏幕元素配置中，从“资源”下拉菜单中选择“触发器概览”，并在“组”字段中输入“linux”。从下拉菜单中点击“Linux服务器”。该组中的触发器比主机多——为“主机位置”选项选择“顶部”，然后点击“添加”。元素又错位了，对吧？


  我们现在来尝试一些对齐操作。点击第一列中从上往下第二个+按钮（就在我们刚添加的概览元素旁边）。这会在第二行之前插入一行。将“触发器概览”元素（我们最后添加的那个）向上拖动一行，放到我们刚刚添加的那一行的第一个单元格中。点击“事件历史”元素（右上角单元格）的“更改”链接，在“显示行数”字段中输入20，在“行跨度”字段中输入2，然后点击“更新”。


  # 使用屏幕和幻灯片可视化数据


  我们的屏幕现在看起来相当不错，只是左下角是空的。点击该单元格中的**更改**，从**资源**下拉菜单中选择**服务器信息**，然后点击**添加**。屏幕现在看起来布局相当好。让我们通过进入**监控
  | 屏幕**并点击**名称**列中的**实验屏幕**，在监控视图中查看它：


  ![](img/f5313a804532fabacc8d07cc8607eeba_392_0.png)


  前面提到，所有图形在屏幕中显示相同的时间段。如果图形作为普通屏幕元素添加，确实如此。使用URL屏幕元素可以添加显示静态时间段的图形，该元素允许在屏幕中包含任何页面。在这种情况下，URL应指向Zabbix前端实例。例如，可以使用如下URL显示一个简单图形：`http://zabbix.frontend/zabbix/chart.php?period=3600&itemids[0]=23704&width=600`。您可以通过打开该监控项的简单图形并查看URL来找到监控项ID。请注意，图形图像的宽度应手动调整，以匹配屏幕单元格宽度，避免屏幕单元格中出现滚动条。这样，我们就可以配置一个屏幕，显示同一监控项的每小时、每日、每周、每月和每年图形。


  正如我们所发现的，Zabbix中的屏幕允许非常灵活的视觉布局。您可以选择先放置一个地图，然后是更详细的图形。或者，您可以放置一组服务器最重要信息的图形，并在顶部放置触发器摘要。或者任何其他组合——还有更多可能的屏幕元素可以添加。尝试所有可用的屏幕元素并了解它们提供的信息可能是个好主意。


  ![](img/f5313a804532fabacc8d07cc8607eeba_393_0.png)


  > 由于屏幕可能包含大量信息，它们可能对性能要求很高，尤其是在许多用户同时查看它们时。


  可以看出，全局屏幕提供19种不同类型的元素，而模板屏幕仅提供七种。


  对于我们现在的屏幕，将“资源”下拉菜单保留为“图形”，然后点击“图形”字段旁边的“选择”。注意当前模板已被选中且无法更改——添加到模板屏幕的所有元素必须来自同一个模板。在弹出窗口中，点击“名称”列中的“CPU负载与流量”，然后点击“添加”。点击右上角的+图标添加另一列，然后点击最右侧单元格中的“更改”链接。在“资源”下拉菜单中选择“简单图形”，点击“监控项”字段旁边的“选择”，然后点击“名称”列中的“CPU负载”。点击“添加”按钮。现在，导航到“配置
  | 主机”，查看每个主机的可用列。没有屏幕列。模板或主机屏幕仅在模板级别配置；它们不会像监控项、触发器和其他实体那样在主机级别获得副本。


  让我们前往“监控 | 屏幕”。如果我们查看那里的屏幕列表，找不到我们刚配置的屏幕。模板或主机屏幕只能从以下位置的主机弹出菜单中访问：


  - 监控 | 仪表板（在“最近20个问题”小部件中）

  - 监控 | 概览（如果主机位于左侧）

  - 监控 | 最新数据（如果未按“主机”字段进行过滤）

  - 监控 | 触发器

  - 监控 | 事件

  - 监控 | 地图


  它们也可以从以下两个页面访问：


  - 全局搜索结果

  - 主机资产页面


  这个屏幕上一个需要注意的地方是两个图形的高度差异。配置屏幕时，我们没有更改高度值，两个图形的高度相同，为100。不幸的是，这不是整个图形的高度，而只是图形墙体区域的高度。因此，如果监控项数量不同，触发器或百分位线将导致图形高度不同。对于屏幕来说，这意味着要让尺寸匹配需要进行相当繁琐的配置。宽度也是如此——如果有一个或两个Y轴值，图形宽度也会不同。


  > 如果自定义图形禁用了图例，则高度不会因监控项数量而变化。目前，无法在自定义图形单独显示时显示图例，而在自定义图形包含在屏幕中时隐藏它。


  应该使用模板屏幕还是全局屏幕？几个因素会影响这一决定：


  - 元素的可用性（全局屏幕多得多）

  - 导航（监控 | 屏幕与弹出菜单）

  - 哪些主机以及多少主机需要这样的屏幕


  # 幻灯片


  我们现在有了一些屏幕，但要在它们之间切换，需要手动操作。虽然对于偶尔使用来说这通常是可以接受的，但如果您想在帮助台的大显示屏上显示它们，这就会很困难。即使您只是让Zabbix一直保持打开在辅助显示器上，手动切换很快也会变得烦人。


  另一个功能来救场了——幻灯片。Zabbix中的幻灯片设置起来很简单，所以请前往“监控 | 屏幕”。为什么是屏幕页面？Zabbix 3.0将幻灯片的操作方式改为与地图和屏幕相同，将查看和配置都移到了监控部分。不过，幻灯片没有自己的部分；要访问它们，请从右上角的下拉菜单中选择“幻灯片”。点击“创建幻灯片”按钮。在“名称”字段中输入“第一个幻灯片”，然后点击“幻灯片”部分中的“添加”控件。幻灯片本质上就是屏幕，这正是我们在弹出窗口中看到的。点击“本地服务器”。我们不更改此幻灯片或屏幕的“延迟”字段中的默认值。将其留空将使用上方“默认延迟”字段中的值30。






  ## 使用屏幕和幻灯片展示数据可视化


  再次点击**幻灯片**部分的**添加**，然后点击**实验屏幕**。这次，在该屏幕的**延迟**字段中输入 5：


  ![](img/f5313a804532fabacc8d07cc8607eeba_398_0.png)


  注意左侧的拖动柄——与图形和图标映射中的操作相同，我们可以在这里对幻灯片重新排序。现在我们不打算这样做；只需点击底部的**添加**按钮。


  > 如果你想在幻灯片中仅添加单个元素（例如地图或图形），则必须创建一个仅包含该元素的屏幕。


  现在，点击**名称**列中的**第一个幻灯片**。它最初是空白的，只显示一个屏幕，然后在 30 秒后切换到另一个屏幕，5 秒后再切换回来，如此循环往复。由于幻灯片中包含了动态屏幕项，我们还可以在右上角选择主机——这只会影响动态屏幕项。


  我们可以展示更多屏幕，例如，先显示一个高层次的概览大屏 30 秒，然后循环显示各服务器组屏幕，每个显示 5 秒。


  看一下右上角的按钮：


  ![](img/f5313a804532fabacc8d07cc8607eeba_398_1.png)


  第一个按钮允许我们将此幻灯片添加到仪表板收藏夹，与图形和屏幕的操作相同。第三个按钮同样是全屏按钮。而中间的按钮允许我们减慢或加快幻灯片的播放速度——点击它：


  ![](img/f5313a804532fabacc8d07cc8607eeba_399_0.png)


  除了设置具体时间外，我们还可以通过应用一个倍率来让幻灯片播放得更快或更慢，从而保持每个幻灯片应显示的相对时长。


  还有另一个理由选择全局屏幕而非模板屏幕或主机屏幕：只有全局屏幕才能被包含在幻灯片中。


  旧版 Zabbix 在幻灯片功能中存在内存泄漏问题。浏览器中也曾出现过多次内存泄漏的情况。如果你在使用 Zabbix 幻灯片时发现浏览器内存使用量持续增加，请考虑升级。如果无法升级，可以使用某个幻灯片通过
  URL 元素和 JavaScript 重新加载页面，这在大多数情况下应该能减少内存使用。`http://www.phpied.com/files/location-location/location-location.html`
  提供了 535 种不同的实现方法。


  自 Zabbix 3.0 起，普通用户也可以创建屏幕和幻灯片并共享，方式与我们在*第9章，使用图形和地图可视化数据*中共享地图相同。与地图一样，其他用户需要拥有访问这些屏幕和幻灯片中所有元素及子元素的权限，才能访问它们。


  ### 在大型显示器上展示数据


  虽然个人层面的可视化很重要，但真正的挑战出现在需要为大型显示器创建视图时，这种显示器通常放置在服务台或技术操作员附近，以便快速识别问题。这带来了几个挑战。


  ### 挑战


  在大型屏幕上为多人显示 Zabbix 数据，需要考虑显示器的位置、观看人员的经验水平，以及其他可能影响你如何配置此信息展示方面的因素。


  ### 非交互式显示


  在大多数情况下，此类屏幕上显示的数据将是不可交互的——人们只需观看，而不能点击操作。之所以提出这样的要求，是因为下钻操作通常发生在个人工作站上，从而让主显示器可供其他人使用。此外，有人可能会轻易将主显示器置于不可用状态，因此通常不提供直接访问。这意味着放置在显示器上的数据不能依赖于查看问题详细信息的能力。其信息量应足以让技术支持人员获取所需的知识。


  ### 信息过载


  将有关组织基础设施健康状况的所有信息都放在一个屏幕上，可能会导致显示器内容杂乱，过多的细节以过小的字体挤在屏幕上。这与前面的挑战正好相反——你需要决定哪些服务是重要的，以及如何对每项服务进行定义。这要求你与负责这些服务的人员密切合作，以便构建正确的依赖链。这是最常用于简化和减少显示数据同时保持其有用性的方法。


  > 上述两个挑战都可以通过精心使用屏幕和幻灯片来显示正确依赖状态来解决。但不要过度依赖幻灯片——如果某个幻灯片只显示了短短几秒，而后面还有 10 个幻灯片需要循环播放，等待它再次出现可能会令人厌烦。


  ![](img/f5313a804532fabacc8d07cc8607eeba_400_0.png)


  ### 自动显示特定部分


  对于中央显示器还有其他一些要求。它应在开机时自动打开并显示所需信息，例如一张漂亮的地理地图。虽然这可以通过一些客户端脚本来实现，但有一个更简单的解决方案，我们已经探讨过了。


  提醒一下，前往管理 | 用户，点击别名列中的 monitoring_user，查看其中两个选项：自动登录和登录后的 URL：


  ![](img/f5313a804532fabacc8d07cc8607eeba_401_0.png)


  如果我们为这种显示站所使用的用户勾选了自动登录选项，只需登录一次，该用户在每次访问页面时就会自动登录。此功能依赖于浏览器 Cookie，因此所使用的浏览器应支持并存储
  Cookie。登录后的 URL 选项允许用户立即导航到指定页面。剩下的只需让显示盒在启动时启动浏览器并指向 Zabbix 前端 URL，这应该很容易设置。当设备启动时，它将无需任何人工干预即可打开指定页面（通常是一个屏幕或幻灯片）。例如，要让该用户在访问
  Zabbix 前端时打开 ID 为 21 的屏幕，可以使用如下 URL：http://zabbix.frontend/zabbix/screens.php?elementid=21。要以
  Zabbix 全屏模式打开该屏幕，需要附加一个全屏参数：http://zabbix.frontend/zabbix/screens.php?elementid=21&fullscreen=1。


  在大型屏幕上显示数据时，请仔细探索可用的选项和功能——也许在某些情况下，最新数据展示是最合适的。在使用触发器概览时，请评估主机/触发器关系，并选择应在哪个轴上显示哪个。


  ### 总结


  在本章中，我们学习了使用屏幕将图形、地图和其他数据组合到单个页面中。屏幕能够容纳许多不同的元素，包括当前活动触发器的统计信息，甚至历史记录，以及通过 URL 元素引用任何自定义页面。URL
  元素还允许我们创建包含图形的屏幕，并显示不同的时间段。屏幕可以在全局级别或模板级别使用。


  幻灯片尤其适用于无人值守的显示器，它允许循环播放屏幕。我们可以设置默认延迟，并为单个屏幕覆盖该延迟。要在幻灯片中包含单个地图或图形，我们仍然需要创建一个包含该地图或图形的屏幕。


  在下一章中，我们将尝试使用更高级的方法收集数据。我们将了解使用计算项和聚合项复用已收集的数据、使用外部检查运行自定义脚本，以及监控日志文件。我们还将尝试在 Zabbix
  中获取自定义数据的两种最流行方式：代理端的用户参数和强大的 zabbix_sender 实用程序。

  '
- "## 11 高级监控项\n\n在设置好被动和主动 Zabbix 代理监控项、ICMP ping 或 TCP 服务检查等简单检查，以及 SNMP 和 IPMI\
  \ 检查之后，我们还能更进一步吗？当然可以。Zabbix 提供了更多在不同情况下有用的监控项类型——让我们来试试它们。\n\n在本章中，我们将探讨日志文件监控、在服务器上根据已收集数据计算值、在\
  \ Zabbix 服务器或代理上运行自定义脚本、使用一个出色的实用程序 zabbix_sender 发送完整自定义数据，以及通过 SSH 和 Telnet 运行命令。在这些方法中，我们应该能够实现对\
  \ Zabbix 开箱即用不支持的任何自定义数据源的监控。\n\n### 日志文件监控\n\n日志文件是宝贵的信息来源。Zabbix 提供了一种使用 Zabbix\
  \ 代理监控日志文件的方法。为此，提供了两个特殊的键：\n\n- `log`：允许我们监控单个文件\n- `logrt`：允许我们监控多个轮转文件\n\n这两个日志监控项键都只能作为主动监控项使用。为了了解其工作方式，让我们通过实际监控一些文件来尝试\
  \ Zabbix 日志文件监控。\n\n\n\n\n# 监控单个文件\n\n让我们从更简单的情况开始：监控单个文件。为此，我们可以创建几个测试文件。为了保持条理，让我们在\
  \ A test host 上创建一个目录 /tmp/zabbix_logmon/，并在其中创建两个文件 logfile1 和 logfile2。两个文件的内容都如下：\n\
  \n```\n2016-08-13 13:01:03 a log entry\n2016-08-13 13:02:04 second log entry\n2016-08-13\
  \ 13:03:05 third log entry\n```\n\n> 日志监控要正常工作，必须正确配置主动式监控项——我们在第3章“使用Zabbix代理和基础协议进行监控”中已经完成了配置。\n\
  \n文件就绪后，让我们继续创建监控项。导航到“配置 | 主机”，点击“A test host”旁边的“监控项”，然后点击“创建监控项”。填写以下内容：\n\n\
  -   **名称：** First logfile\n-   **类型：** Zabbix 代理（主动式）\n-   **键值：** log[/tmp/zabbix_logmon/logfile1]\n\
  -   **信息类型：** 日志\n-   **更新间隔：** 1\n\n![](img/f5313a804532fabacc8d07cc8607eeba_404_0.png)\n\
  \n完成后，点击底部的“添加”按钮。如前所述，日志监控只能作为主动式监控项工作，所以我们使用了该监控项类型。对于键值，第一个参数是必需的——它是我们要监控的文件的完整路径。这里我们还使用了特殊的信息类型“日志”。但更新间隔呢？为什么我们用这么小的1秒间隔？对于日志监控项，这个间隔不是关于在代理和服务器之间建立实际连接的，它只是让代理检查文件是否发生了变化——它会执行一次\
  \ `stat()` 调用，类似于 `tail -f` 在某些平台/文件系统上的操作。只有代理有东西要发送时，才会与服务器建立连接。\n\n使用主动式监控项，日志监控反应迅速，因为它在本地检查文件，同时也避免了过多的连接。它也可以实现为效率稍低的被动式监控项，但截至\
  \ Zabbix 3.0.0 尚不支持。\n\n监控项创建好后，数据到达应该不会超过3分钟——当然，前提是一切按预期工作。服务器更新配置缓存最多可能需要1分钟，主动式代理更新其监控项列表最多可能需要2分钟。让我们验证一下——导航到“监测\
  \ | 最新数据”，然后按主机“A test host”过滤。我们的“First logfile”监控项应该在那里，并且应该有一些值：\n\n| First logfile\
  \ | 2016-05-09 10:01:05 | 2016-08-13 13:03:05 third log ... |\n\n即使是很短的值，在这里也会被过度截断。希望这能在后续版本中改进。\n\
  \n如果监控项不受支持，并且配置部分提示权限问题，请确保权限确实允许 Zabbix 用户访问该文件。如果文件本身的权限看起来正确，还要检查所有上级目录的执行权限。在这里及后续操作中，请记住，不受支持的监控项在问题解决后最多需要10分钟才会更新。\n\
  \n与其他非数字监控项一样，Zabbix 知道它无法对日志绘制图形，因此右侧有一个“历史记录”链接——让我们点击它：\n\n| 时间戳 | 本地时间 | 值 |\n\
  | 2016-05-09 10:01:05 |  | 2016-08-13 13:03:05 third log entry |\n| 2016-05-09 10:01:05\
  \ |  | 2016-08-13 13:02:04 second log entry |\n| 2016-05-09 10:01:05 |  | 2016-08-13\
  \ 13:01:03 a log entry |\n\n如果你在历史记录模式中没有看到任何值，可能是 Zabbix 时间滚动条的一个 bug 导致的。尝试在右上角的下拉菜单中选择“最新的500个值”。\n\
  \n日志文件中的所有行都在这里了。默认情况下，Zabbix 日志监控会从文件开头解析整个文件。在这种情况下这很好，但如果我们想开始监控某个巨大的现有日志文件呢？不仅解析会很浪费，而且还可能向\
  \ Zabbix 服务器发送大量无用的旧信息。幸运的是，有一种方法可以让 Zabbix 只解析从该日志文件开始监控以来的新数据。我们可以用第二个文件来试试，为了简单起见，也可以克隆第一个监控项。让我们返回“配置\
  \ | 主机”，点击“A test host”旁边的“监控项”，然后点击“名称”列中的“First logfile”。在监控项配置表单的底部，点击“克隆”并进行以下更改：\n\
  \n-   **名称：** Second logfile\n-   **键值：** log[/tmp/zabbix_logmon/logfile2,,,skip]\n\
  \n> 监控项键值中有四个逗号——这样我们跳过了一些参数，只指定了第一个和第五个参数。\n\n完成后，点击底部的“添加”按钮。和之前一样，这个监控项可能需要最多3分钟才能开始工作。即使它开始工作了，最新数据页面中也不会有任何内容——因为我们指定了\
  \ skip 参数，所以只会考虑新的行。\n\n> 添加监控项后，请至少等待3分钟再执行下面的命令。否则，代理还没有新的监控项定义。\n\n为了测试，我们可以向\
  \ Second logfile 添加一些行。在“A test host”上执行：\n\n```\n$ echo \"2016-08-13 13:04:05 fourth\
  \ log entry\" >> /tmp/zabbix_logmon/logfile2\n```\n\n> 这条及后续的模拟日志条目会递增行内的时间戳——这不是必需的，但看起来更好一些。目前\
  \ Zabbix 无论如何都会忽略该时间戳。\n\n片刻之后，该条目应该出现在最新数据页面中：\n\n| Second logfile | 2016-05-09\
  \ 11:42:15 | 2016-08-13 13:04:05 fourth log... |\n\n如果我们检查监控项历史记录，它是唯一的条目，因为 Zabbix\
  \ 现在只关心新的行。\n\n> \U0001F4A1 skip 参数只影响监控新日志文件时的行为。无论是否使用该参数来监控日志文件，Zabbix 代理都不会重新读取文件，它只读取新增的数据。\n\
  \n## 过滤特定字符串\n\n对于较小的文件，发送所有内容是可以接受的，但如果一个文件包含大量信息，而我们只对错误消息感兴趣呢？Zabbix 代理也可以在本地过滤行，只把我们需要的内容发送到服务器。例如，我们可以只抓取包含字符串\
  \ error 的行。修改 **Second logfile** 监控项并将其键值改为：\n\n```\nlog[/tmp/zabbix_logmon/logfile2,error,,,skip]\n\
  ```\n\n也就是说，在日志文件路径后面添加了一个 error。请注意，现在 `error` 和 `skip` 之间有三个逗号——我们填充了监控项键值的第二个参数。点击\
  \ **更新**。和之前一样，此更改传播到 Zabbix 代理可能需要最多3分钟，因此建议过一段时间再继续。泡杯茶后，在“A test host”上执行以下命令：\n\
  \n```\n$ echo \"2016-08-13 13:05:05 fifth log entry\" >> /tmp/zabbix_logmon/logfile2\n\
  ```\n\n这次，**最新数据**页面中不会出现任何新内容——我们过滤了 error 字符串，但这行中没有该字符串。让我们再添加一行：\n\n```\n$ echo\
  \ \"2016-08-13 13:06:05 sixth log entry - now with an error\" >> /tmp/zabbix_logmon/logfile2\n\
  ```\n\n检查 `logfile2` 日志监控项的历史记录，我们应该只看到最新的条目。\n\n那么一些更复杂的条件呢？假设我们要过滤所有出现 error 和\
  \ warning 字符串的行，但对于 warning，只保留后面跟着以数字 60-66 开头的数字代码的行。幸运的是，过滤参数实际上是一个正则表达式——让我们修改第二个日志监控项并将其键值改为：\n\
  \n```\nlog[/tmp/zabbix_logmon/logfile2,\"error|warning 6[0-6]\",,,skip]\n```\n\n\
  ## 高级监控项监控\n\n我们将第二个键值参数改为 `\"error|warning 6[0-6]\"`，包括双引号。这个正则表达式应当匹配所有以数字 60-66\
  \ 开头的 error 和 warning。我们必须用双引号括起来，因为正则表达式包含方括号，而方括号也用于括住键值参数。为了测试这一点，让我们在日志文件中插入几行测试数据：\n\
  \n```sh\n$ echo \"2016-08-13 13:07:05 seventh log entry – all good\" >> /tmp/zabbix_logmon/logfile2\n\
  \n$ echo \"2016-08-13 13:08:05 eighth log entry – just an error\" >> /tmp/zabbix_logmon/logfile2\n\
  \n$ echo \"2016-08-13 13:09:05 ninth log entry – some warning\" >> /tmp/zabbix_logmon/logfile2\n\
  \n$ echo \"2016-08-13 13:10:05 tenth log entry – warning 13\" >> /tmp/zabbix_logmon/logfile2\n\
  \n$ echo \"2016-08-13 13:11:05 eleventh log entry – warning 613\" >> /tmp/zabbix_logmon/logfile2\n\
  ```\n\n根据我们的正则表达式，日志监控项应该：\n\n-   忽略第七条条目，因为它完全不包含 error 或 warning\n-   捕获第八条条目，因为它包含\
  \ error\n-   忽略第九条条目——它包含 warning，但后面没有数字\n-   忽略第十条条目——它包含 warning，但后面的数字不是以 `60-66`\
  \ 范围内的数字开头\n-   捕获第十一条条目——它包含 warning，数字以 61 开头，位于我们要求的 `60-66` 范围内\n\n最终，只有第八条和第十一条条目应该被收集。请在最新数据页面中验证，只有匹配我们正则表达式的条目才应该被收集。\n\
  \n我们使用的正则表达式并不十分复杂。如果我们想排除多个字符串，或者进行其他更复杂的过滤呢？使用 POSIX 扩展正则表达式，这可能会介于非常复杂和不可能之间。Zabbix\
  \ 中有一个称为**全局正则表达式**的功能，它允许我们以更简单的方式定义正则表达式。如果我们有一个名为 `Filter logs` 的全局正则表达式，就可以像这样在监控项中复用它：\n\
  \n```text\nlog[/tmp/zabbix_logmon/logfile2,@Filter logs,,,skip]\n```\n\n全局正则表达式将在*第12章“自动化配置”*中更详细地介绍。\n\
  \n\n\n\n## 监控轮换文件\n\n监控单个文件并不算太难，但有许多软件会使用多个日志文件。例如，Apache HTTP 服务器通常会配置为每天记录到一个新文件中，并将日期包含在文件名内。Zabbix\
  \ 支持使用单独的监控项键 `logrt` 来监控这种日志轮换方案。要进行尝试，请导航到**配置 | 主机**，点击**测试主机**旁边的**监控项**，然后点击**创建监控项**。填写以下内容：\n\
  \n- **名称：** `Rotated logfiles`\n- **类型：** **Zabbix agent (active)**\n- **键值：** `logrt[\"\
  /tmp/zabbix_logmon/access_[0-9]{4}-[0-9]{2}-[0-9]{2}.log\"]`\n- **信息类型：** **日志**\n\
  - **更新间隔：** `2`\n\n完成后，点击底部的**添加**按钮。不过，与之前使用的内容相比，键值及其第一个参数发生了一些变化。现在键值是 `logrt`，第一个参数是一个正则表达式，用于描述应匹配的文件。请注意，这里的正则表达式仅支持用于文件部分，而路径部分必须指定一个具体目录。由于正则表达式中使用了方括号，我们还将其放在双引号中。该正则表达式应匹配以\
  \ `access_` 开头、后跟四位数字、一个短横线、两位数字、一个短横线、另外两位数字，并以 `.log` 结尾的文件名。例如，文件名 `access_2015-12-31.log`\
  \ 就会被匹配。还有一点不同之处——更新间隔被设置为 2 秒，而不是 1 秒。原因是，`logrt` 键会定期重新读取目录内容，这可能比检查单个文件消耗更多资源。这也是它使用单独监控项键的原因，否则我们本可以在日志监控项中使用文件正则表达式。\n\
  \n> 如果受监控的文件中仍有待解析的行，Zabbix 代理不会每 2 秒重新读取目录内容——只有当已知文件中的内容全部解析完毕后，它才会再次查看目录。\n\n\
  设置好监控项后，让我们创建并填充一些应被正则表达式匹配的文件。在“测试主机”上执行：\n\n```\n$ echo \"2016-08-30 03:00:00\
  \ rotated first\" > /tmp/zabbix_logmon/access_2015-12-30.log\n```\n\n查看最新数据页面，轮换日志文件监控项应该会获得这个值。假设这一天就到此为止，现在我们将在第二天记录一些内容：\n\
  \n```\n$ echo \"2015-12-31 03:00:00 rotated second\" > /tmp/zabbix_logmon/\naccess_2015-12-31.log\n\
  ```\n\n查看该监控项的历史记录，它应该已经成功获取了新文件：\n\n| 时间戳 | 本地时间 | 值 |\n|---|---|---|\n| 2016-05-09\
  \ 13:56:55 |  | 2015-12-31 03:00:00 rotated second |\n| 2016-05-09 13:56:25 |  |\
  \ 2016-08-30 03:00:00 rotated first |\n\n随着日期不同的文件不断出现，Zabbix 会完成当前文件的处理，然后开始处理下一个文件。\n\
  \n## 基于日志数据生成告警\n\n随着数据不断传入，让我们来讨论如何使用触发器基于这些数据生成告警。这里有一些内容与我们目前在触发器中使用的阈值及类似的数值比较有所不同。\n\
  \n如果我们有一个收集所有行的日志监控项，并希望针对包含某个特定字符串的行生成告警，可以使用以下几个触发器函数：\n\n- str()：检查子字符串；例如，如果我们收集所有值，就可以使用此函数针对错误生成告警：str(error)\n\
  - regexp：与 str() 函数类似，允许我们指定一个用于匹配的正则表达式\n- iregexp：regexp() 的不区分大小写版本\n\n> 这些函数只能作用于单行；无法匹配多行日志条目。\n\
  \n对于这三个函数，还支持第二个参数——在这种情况下，它可以表示要检查的秒数或值的数量。例如，str(error,600) 会在最近 10 分钟内的任意值中包含\
  \ error 子字符串时触发。\n\n这看起来没问题，但如果我们只通过在代理端进行过滤，将错误行发送到服务器，就会出现一个问题。为了了解问题所在，我们来考虑一个“普通”触发器，例如检查**CPU\
  \ 负载**是否超过某个阈值的触发器。假设阈值为 5，当前触发器处于**正常**状态，并且依次收到 0、1、2 等值，不会发生任何事情，也不会生成事件。当第一个大于\
  \ 5 的值到达时，会生成一个**问题**事件，并且触发器切换到**问题**状态。之后所有大于 5 的值都不会生成任何事件，也不会发生其他变化。\n\n对于日志监控来说，问题也是如此。我们会针对第一行错误生成一个**问题**事件，之后便什么也不会发生。触发器会保持在**问题**状态，也不会有其他变化。解决办法相对简单——触发器属性中有一个复选框：**生成多个问题事件：**\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_411_0.png)\n\n选中此复选框后，上述**CPU 负载**触发器会针对每个超过\
  \ 5 阈值的值生成一个新的**问题**事件。在大多数情况下，这并不太有用，但对于日志监控触发器来说却很有用。如果我们只接收错误行，那么每一行错误都会生成一个新的**问题**事件。\n\
  \n请注意，即使我们同时发送错误行和正常行，正常行之后的错误仍会被捕获，但后续的错误会被忽略，这同样可能造成问题。\n\n解决这个问题后，我们又遇到了另一个问题——一旦触发器针对一个只接收错误行的监控项触发，该触发器就永远不会恢复，而会一直处于**问题**状态。虽然在某些情况下这并不是问题，但在其他情况下却并不理想。我们可以使用已经熟悉的触发器函数\
  \ `nodata()`，轻松让此类触发器超时。如果监控项同时接收错误行和正常行，而我们希望在最后一条错误到达 10 分钟后使触发器超时，即使这期间没有“正常”行到达，也可以构造如下触发表达式：\n\
  \n```\n{host.item.str(error)}=1 and {host.item.nodata(10m)}=0\n```\n\n这里，我们反向使用了\
  \ `nodata()` 函数——即使最后一条记录包含错误，只要最近 10 分钟内没有其他值，触发器就会切换到**正常**状态。\n\n> \U0001F4A1\
  \ 我们还在*第 6 章：使用触发器检测问题*的*会超时的触发器*部分讨论了会超时的触发器。\n\n如果监控项只接收错误行，我们可以使用类似上面的表达式，但也可以将其简化。在这种情况下，任何值的存在都表示出现问题，因此我们再次使用反向的\
  \ nodata() 函数，并针对值的存在生成告警：\n\n```\n{host.item.nodata(10m)}=0\n```\n\n这里，只要最近 10\
  \ 分钟内存在任何值，就表示出现**问题**。没有值时，触发器会切换到正常状态。由于 Zabbix 不必评估实际的监控项值，这种方式的资源消耗相对更低。\n\n\
  我们还可以在这里使用另一个触发器函数 count()。它可以让我们在某个时间段内出现一定数量的关注字符串（例如错误）时触发告警。例如，以下表达式会在最近 10\
  \ 分钟内出现超过 10 个错误时生成告警：\n\n```\n{host.item.count(10m,error,like)}>10\n```\n\n## 提取行中的部分内容\n\
  \n有时，我们只需要知道记录了一个错误。在这种情况下，获取整行内容就足够了。但有时日志行中可能包含某个感兴趣的子字符串，例如某个队列中的消息数量。一行日志可能如下所示：\n\
  \n```\n2015-12-20 18:15:22 Number of messages in the queue: 445\n```\n\n理论上，我们可以针对整行编写触发器。例如，当消息数量达到\
  \ 10,000 或更多时，以下正则表达式应当能够匹配：\n\n```\nmessages in the queue: [1-9][0-9]{4}\n```\n\
  \n但是，如果我们希望在消息数量超过 15,000 时使用另一个触发器，该触发器的正则表达式可以如下所示：\n\n```\nmessages in the queue:\
  \ (1[5-9]|[2-9].)[0-9]{3}\n```\n\n如果我们希望从第一个正则表达式中排除超过 15,000 的值，则它将变为：\n\n```\n\
  messages in the queue: 1[0-4][0-9]{3}\n```\n\n\n\n\n\n这绝对不容易维护。而且这还只是两个阈值。不过，如果我们只需要那个数字，还有一种更简单的方法。Zabbix\
  \ 日志监控允许我们通过正则表达式提取值。为了进行尝试，我们先创建一个包含待提取值的文件。仍然在“A test host”上，创建文件`/tmp/zabbix_logmon/queue_log`，内容如下：\n\
  \n```\n2016-12-21 18:01:13 Number of messages in the queue: 445\n2016-12-21 18:02:14\
  \ Number of messages in the queue: 5445\n2016-12-21 18:03:15 Number of messages\
  \ in the queue: 15445\n```\n\n现在配置监控项——进入“Configuration | Hosts”，点击“A test host”旁边的“Items”，然后点击“Create\
  \ item”。填写以下内容：\n\n- **名称：** 提取日志内容\n- **类型：** Zabbix agent (active)\n- **键值：**\
  \ `log[/tmp/zabbix_logmon/queue_log,\"messages in the queue: ([0-9]+)\",,,\\1]`\n\
  - **信息类型：** Log\n- **更新间隔：** 1\n\n我们之所以给正则表达式加上引号，是因为其中再次包含了方括号。该正则表达式本身会提取文本“messages\
  \ in the queue”，后面跟着冒号、空格和一个数字。数字包含在一个捕获组中——这对我们添加到键值中的最后一个参数`\\1`很重要，因为它引用了捕获组的内容。这个参数“output”告诉\
  \ Zabbix 不要返回整行，而只返回该参数所引用的内容。在本例中，就是这个数字。\n\n> 我们还可以在 output 参数中添加额外文本——例如，键值`log[/tmp/zabbix_logmon/queue_log,\
  \ messages in the queue: \"([0-9]+)\",,,,Extra \\1 things]`会针对日志文件中的第一行返回“Extra\
  \ 445 things”。也可以使用多个捕获组，并在 output 参数中通过`\\2`、`\\3`等进行引用。\n\n![](img/f5313a804532fabacc8d07cc8607eeba_413_0.png)\n\
  \n## 高级监控项监控\n\n完成后，点击底部的**Add**按钮。大约 3 分钟后，我们可以在“latest data”页面中查看该监控项的历史记录：\n\n\
  | 时间戳 | 本地时间 | 值 |\n|---|---|---|\n| 2016-05-09 14:25:01 |  | 15445 |\n| 2016-05-09\
  \ 14:25:01 |  | 5445 |\n| 2016-05-09 14:25:01 |  | 445 |\n\n太好了，值的提取工作符合预期。针对这些值编写触发器也应该容易得多。不过需要注意一点——对于这个监控项，我们无法查看图形。原因在于日志监控项中的**信息类型**属性——我们将其设置为**Log**，但该类型不适合绘制图形。现在修改它。进入**Configuration\
  \ | Hosts**，点击**A test host**旁边的**Items**，然后点击**NAME**列中的**Extracting log contents**。将**信息类型**更改为**Numeric\
  \ (unsigned)**，然后点击底部的**Update**按钮。\n\n> \U0001F4A1 如果提取出的数字包含小数部分，请对这类监控项使用**Numeric\
  \ (float)**。\n\n在“latest data”部分检查该监控项——现在应该会出现**Graph**链接。不过，点击查看后会发现没有数据。这是为什么？Zabbix\
  \ 会在内部为每种信息类型分别存储值。更改信息类型不会删除这些值，但 Zabbix 只会检查当前配置的信息类型。因此，务必从一开始就设置正确的信息类型。为了验证其是否按预期工作，请在“A\
  \ test host”上运行以下命令：\n\n```sh\n$ echo \"2016-12-21 18:16:13 Number of messages in\
  \ the queue: 113\" >> /tmp/zabbix_logmon/queue_log\n\n$ echo \"2016-12-21 18:17:14\
  \ Number of messages in the queue: 213\" >> /tmp/zabbix_logmon/queue_log\n\n$ echo\
  \ \"2016-12-21 18:18:15 Number of messages in the queue: 150\" >> /tmp/zabbix_logmon/queue_log\n\
  ```\n\n在**Latest data**部分查看此监控项时，应该可以看到这些值，图形也应该可用。注意，日志文件条目中的日期和时间仍然无关紧要——这些值会被赋予当前时间戳。\n\
  \n> \U0001F4A1 使用**logrt**监控项键值时，值提取的工作方式相同。\n\n## 解析时间戳\n\n说到我们推送到 Zabbix 中的行的时间戳，文件中的日期和时间与\
  \ Zabbix 中显示的日期和时间并不一致。Zabbix 使用采集这些条目的时间标记它们。在进行持续监控时，这在大多数情况下没有问题——内容每隔一秒左右检查一次，被收集、加上时间戳，然后推送到服务器。不过，在解析一些较旧的数据时，时间戳可能会有很大偏差。Zabbix\
  \ 确实提供了从日志条目中解析时间戳的方法。我们来使用最开始创建的日志文件监控项进行操作。进入“Configuration | Hosts”，点击“A test\
  \ host”旁边的“Items”，然后点击“NAME”列中的“First logfile”。注意其中的“Log time format”字段——这正是我们现在要使用的字段。它允许我们使用特殊字符提取日期和时间。支持的字符如下：\n\
  \n- y：年\n- M：月\n- d：日\n- h：小时\n- m：分钟\n- s：秒\n\n在我们的测试日志文件中，时间格式如下：\n\n```\n2015-12-13\
  \ 13:01:03\n```\n\n用于解析日期和时间的时间格式字符串如下：\n\n```\nyyyy-MM-dd hh:mm:ss\n```\n\n请注意，只有受支持的字符才有意义——其他字符会被忽略，可以是任意内容。例如，以下格式的工作方式完全相同：\n\
  \n```\nyyyyPMM PddPhhPmmPss\n```\n\n除了这些特殊字符之外，你可以选择任意字符。选择哪些字符最好？一般来说，最好以可读性为目标。在“Log\
  \ time format”字段中输入这里的某个示例：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_415_0.png)\n\
  \n> 指定日志时间格式时，所有日期和时间组件都必须存在——例如，如果缺少秒，就无法提取时间。\n\n完成后，点击底部的**Update**按钮。等待几分钟，然后继续向受监控文件中添加条目。选择当前时间往前一小时以内的日期和时间，并在“A\
  \ test host”上运行：\n\n```sh\n$ echo \"2016-05-09 15:30:13 a timestamped log entry\"\
  \ >> /tmp/zabbix_logmon/logfile1\n```\n\n现在，在“latest data”页面中查看**First logfile**监控项的历史记录：\n\
  \n| 时间戳 | 本地时间 | 值 |\n|---|---|---|\n| 2016-05-09 15:31:52 | 2016-05-09 15:30:13\
  \ | 2016-05-09 15:30:13 a timestamped log entry |\n\n这与之前的情况有一个不同之处。现在**LOCAL TIME**列已填充，其中包含我们在日志行中指定的时间。**TIMESTAMP**列仍然保存\
  \ Zabbix 收集该行的时间。\n\n请注意，目前日期和时间提取仅支持数字数据。标准 syslog 格式使用简短的文本月份名称，例如 Jan、Feb 等——此类日期/时间格式目前不支持提取。\n\
  \n## 查看日志数据\n\n现在所有日志监控项都在收集数据，我们快速看一下显示选项。进入**Monitoring | Latest data**，然后点击**Second\
  \ logfile**对应的**History**。展开**Filter**。这里有几个非常简单的日志查看选项：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_416_0.png)\n\
  \n- **Items list：** 我们可以添加多个监控项，同时查看它们的日志条目。条目会按照时间戳排序，这样我们就能确定不同日志文件甚至不同系统之间的事件顺序。\n\
  - **Select rows with value like 和 Selected：** 根据子字符串，可以显示、隐藏或着色条目。\n\n作为快速测试，在**Select\
  \ rows with value like**字段中输入“error”，然后点击**Filter**。此时只会保留包含该字符串的条目。在**Selected**下拉菜单中选择**Hide\
  \ selected**——现在只显示不包含该字符串的条目。接着在**Selected**下拉菜单中选择**Mark selected**，注意包含“error”字符串的条目会以红色突出显示。在出现的附加下拉菜单中，可以选择红色、绿色或蓝色进行突出显示：\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_417_0.png)\n\n现在再添加一个监控项——点击**Items list**条目下方的**Add**。在弹出窗口中，在**Group**下拉菜单中选择**Linux\
  \ servers**，在**Host**下拉菜单中选择**A test host**，然后点击**NAME**列中的**First logfile**。注意，两个文件中的条目都会显示出来，并且着色选项也会应用于这些条目。\n\
  \n这基本上就是 Zabbix 前端中的日志查看选项。请注意，这项功能非常有限；如果需要一个集中式 syslog 服务器，并在此基础上提供完整的日志分析功能，应使用专门的解决方案——目前有相当多的免费软件产品可供选择。\n\
  \n## 在服务器上重新利用数据\n\n到目前为止，我们使用的监控项都是从某个 Zabbix agent 或 SNMP 设备收集数据。我们也可以在某些计算中重新利用这些数据，存储计算结果，并将其作为普通监控项，用于图形、触发器及其他用途。Zabbix\
  \ 提供了两种此类监控项：\n\n- **Calculated**监控项要求编写精确的公式，并引用每个单独的监控项。它们比聚合监控项更灵活，但当监控项数量较多时并不实用；如果计算中包含的监控项发生变化，还必须手动调整。\n\
  \n\n\n\n+   - **聚合监控项**对主机组中共享相同键的监控项进行操作。可以计算最小值、最大值、总和或平均值。它们不能用于同一主机上的多个监控项，但如果主机被添加到组中或从组中移除，则无需对聚合监控项进行调整。\n\
  \n## 计算监控项\n\n我们将从需要输入公式的计算监控项开始。我们已经在监控总磁盘空间和已用磁盘空间。如果我们还想监控可用磁盘空间，我们可以向代理查询此信息。这就是计算监控项的用武之地——如果代理或设备不暴露数据的特定视图，或者我们希望避免查询被监控的主机，我们可以根据已检索到的值进行计算。要创建计算可用磁盘空间的计算监控项，请导航到“配置\
  \ | 主机”，点击“A test host”旁边的“监控项”，然后点击“创建监控项”。填写以下信息：\n\n+   - **名称：** / 上的磁盘空间（可用）\n\
  +   - **类型：** 计算\n+   - **键：** calc.vfs.fs.size[/,free]\n+   - **公式：** last(\"vfs.fs.size[/,total]\"\
  )-last(\"vfs.fs.size[/,used]\")\n+   - **单位：** B\n+   - **更新间隔：** 1800\n\n完成后，点击底部的“添加”按钮。\n\
  \n> 我们选择了一个不会与内置键冲突的键，以防将来有人决定使用该键，但我们可以为计算监控项使用任何键。\n\n所有被引用的监控项都必须存在。我们不能在这里输入键，并让它们通过计算监控项来扩展收集数据。用于计算计算监控项的值是从\
  \ Zabbix 服务器缓存或数据库中检索的；不会建立与被监控设备的连接。\n\n添加此监控项后，我们转到“最新数据”页面。由于间隔设置为 1,800 秒，我们可能需要等待更长时间才能看到该值，但最终它应该会出现：\n\
  \n| / 上的磁盘空间（可用） | 2016-05-09 17:40:05 | 56.16 GB |\n\n> 如果监控项变为不支持，请检查错误消息并确保您输入的公式正确。\n\
  \n我们使用的间隔 1,800 秒与两个被引用监控项的间隔不匹配。总磁盘空间和已用磁盘空间监控项每 3,600 秒收集一次数据，但计算监控项与被引用监控项的数据收集没有任何连接。计算监控项不会在被引用监控项获取值时被计算——它遵循自己的调度，该调度完全独立于被引用监控项的调度，并且是半随机的。如果被引用监控项停止收集数据，我们的计算监控项将继续使用最新值进行计算，因为我们使用了\
  \ last() 函数。如果其中一个停止收集数据，我们的计算将基于一个最新值和一个过时值。而且，如果我们的计算监控项在错误的时间被触发，因为其中一个被引用监控项已发生显著变化，而另一个尚未收到新值，可能会导致非常错误的结果，遗憾的是，对此没有简单的解决方案。第\
  \ 3 章“使用 Zabbix 代理和基本协议进行监控”中讨论的自定义调度可能对此有所帮助，但它也可能因不均匀批次轮询值而导致性能问题——并且管理起来也更复杂。建议仅将其作为例外情况使用。\n\
  \n> 我们计算的可用磁盘空间可能与系统工具报告的“可用”磁盘空间不匹配。许多文件系统和操作系统会保留一些空间，这些空间不计入已用空间，但会计入可用磁盘空间。\n\
  \n我们可能还想计算某个接口的流入和流出流量总和，计算监控项在这里很适用。公式如下：\n\n```\nlast(net.if.it[enp0s8])+last(net.if.out[enp0s8])\n\
  ```\n\n> 你是否注意到我们在第一个示例中给监控项键加了引号，但这里没有？原因是计算监控项公式条目遵循 function(key, function_parameter_1,\
  \ function_parameter_2...) 的语法。我们为磁盘空间监控项引用的监控项键中包含逗号，如下所示：vfs.fs.size[/,total]。如果我们不给键加引号，Zabbix\
  \ 会将键解释为 vfs.fs.size[/ 并将 total] 作为函数参数。这样是行不通的。\n\n对于触发器，当我们引用监控项时，这些触发器与监控项来源的主机关联。计算监控项也引用监控项，但它们总是在单个特定主机上创建。我们创建的监控项将仅存在于\
  \ “A test host” 上。这意味着这样的监控项也可以存在于公式中未包含的主机上——例如，跨集群的某些计算可以在一个元主机上进行，该元主机保存集群范围的监控项，但它本身不被直接监控。\n\
  \n让我们看看这个监控项是否能在 **监控 | 最新数据** 中正常工作。确保我们两台主机都显示出来，并展开所有条目。查找三个值——**A test host**\
  \ 和 **Another host** 的 **CPU 负载**，以及 **两台服务器的平均系统负载**：\n\n| 主机 | 名称 | 上次检查 | 上次值\
  \ |\n|---|---|---|---|\n| Another host | - 其他 - (1 个监控项) |  |  |\n|  | CPU 负载 |\
  \ 2016-05-09 21:06:34 | 0.94 |\n| A test host | - 其他 - (2 个监控项) |  |  |\n|  | 两台服务器的平均系统负载\
  \ | 2016-05-09 21:06:06 | 0.46 |\n|  | CPU 负载 | 2016-05-09 21:06:25 | 0.01 |\n\n\
  > \U0001F4A1 您可以按“load”过滤监控项名称，以仅查看相关条目。\n\n该值似乎计算正确。现在它可以像任何普通监控项一样使用，例如将其以及来自两台主机的单个\
  \ **CPU 负载** 监控项包含在单个图形中。但如果我们查看这些值，各主机的系统负载分别为 0.94 和 0.01，但平均值计算为 0.46。如果我们手动计算，应为\
  \ 0.475——如果四舍五入到两位小数，则为 0.48。为什么会存在这种差异？计算监控项所依赖的两个监控项的数据以不同间隔到达，而计算值也在稍有不同的时间被计算，因此，虽然值本身是正确的，但它可能与任意给定时间看到的确切平均值不匹配。这里，两个\
  \ **CPU 负载** 监控项都有一些值，计算出的平均值是正确的。然后，一个或两个 **CPU 负载** 监控项获得了新值，但计算监控项尚未用这些新值进行更新。\n\
  \n> \U0001F4A1 我们在 *第 12 章，自动化配置* 中讨论了关于计算监控项的其他一些方面。\n\n## 聚合监控项\n\n计算监控项允许我们编写特定的公式，引用精确的单个监控项。这对于小规模计算效果很好，但我们最后创建的\
  \ **CPU 负载** 监控项对于几十台主机来说很难创建和维护——对于几百台主机则不可能。如果我们想在许多主机上计算相同的监控项键，我们可能会选择 *聚合监控项*。它们将使我们能够找出集群上的平均负载，或一组文件服务器的总可用磁盘空间，而无需单独命名每个监控项。与计算监控项一样，结果将是一个可用于触发器或图形的普通监控项。\n\
  \n要了解在这种情况下可以使用什么，请转到 **配置 | 主机**，在 **组** 下拉菜单中选择 **Linux servers**，点击 **A test\
  \ host** 旁边的 **监控项**，然后点击 **创建监控项**。现在我们必须弄清楚要使用什么监控项类型。展开 **类型** 下拉菜单，查找名为 **Zabbix\
  \ 聚合** 的条目。这就是我们需要的，因此选择它，然后点击 **键** 字段旁边的 **选择**。目前，键显示为 `grpfunc`，但这只是一个占位符——点击它。我们必须将其替换为实际的组键——`grpsum`、`grpmin`、`grpmax`\
  \ 或 `grpavg` 之一。我们将为多台主机计算平均值，因此将其更改为 `grpavg`。这个键（或组函数）接受几个参数：\n\n+   - `group`：顾名思义，这里填写主机组名称。为此参数输入\
  \ Linux servers。\n+   - `key`：用于计算的监控项键。在此输入 `system.cpu.load`。\n+   - `func`：用于从主机上的各个监控项检索数据的函数。虽然可以使用多个函数，但在这种情况下，我们想要了解最新负载是什么。为此字段输入\
  \ `last`。\n+   - `param`：上述函数的参数，遵循与普通函数参数相同的规则（指定秒数或值数量，以 # 为前缀）。我们使用的函数 `last()`\
  \ 可以不带参数使用，因此只需删除最后一个逗号及其后面的占位符即可。\n\n对于单个监控项数据，支持以下函数：\n\n| 函数 | 说明 |\n|---|---|\n\
  | `avg` | 平均值 |\n| `count` | 值的数量 |\n| `last` | 最后一个值 |\n| `max` | 最大值 |\n\n\n\n\
  \n| 函数 | 说明 |\n|---|---|\n| min | 最小值 |\n| sum | 值的总和 |\n\n对于聚合项，可以使用两级函数。它们是嵌套的——首先，`func`参数指定的函数从组中的所有主机收集所需数据。然后，`grpfunc`（在我们的示例中是`grpavg`）根据`func`检索到的所有中间结果计算出最终结果。\n\
  \n> 所有引用的项都必须存在。我们不能在这里输入键，然后让它们通过聚合项的扩展来收集数据。计算计算项所需的值是从Zabbix服务器缓存或数据库中检索的；不会与被监控设备建立连接。\n\
  \n最终的项键应为 `grpavg[Linux servers,system.cpu.load,last]`。\n\n> 如果被引用的项键带有参数，就必须对其加引号。\n\
  \n要完成项配置，请填写以下内容：\n\n- **名称：** `Linux服务器的平均系统负载`\n- **信息类型：** **数字（浮点型）**\n\n最终的项配置应如下所示：\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_423_0.png)\n\n这样，有限的一组函数就可以应用于大量主机。虽然不如计算项灵活，但对于包含数百台主机的组进行此类计算而言，它要实用得多。此外，每次在计算中添加或移除主机或项时，计算项都必须更新。而聚合项会自动找到所有相关的主机和项。请注意，只有已启用主机上已启用的项才会被纳入考虑。\n\
  \n聚合项在服务器上的使用不受任何限制。它们也可以用于任何其他类型的设备，例如，通过SNMP监控的一组交换机的平均CPU负载计算。\n\n## 跨多个组进行聚合\n\
  \n基本语法允许我们指定一个主机组。虽然我们之前提到，跨任意主机进行聚合需要创建一个新组，但还有另一种可能——聚合项可以引用多个主机组。如果我们修改聚合项键，使其也包含“Solaris\
  \ servers”组中的主机，则如下所示：\n\n```\ngrpavg[[Linux servers,Solaris servers],system.cpu.load,last]\n\
  ```\n\n也就是说，可以在方括号中指定多个以逗号分隔的组。如果任何主机出现在其中多个组中，则该主机的项在计算中只会被包含一次。这里对主机组数量没有严格限制，但应考虑可读性和项键总长度限制——2,048个字符。\n\
  \n> 计算项和聚合项都可以复用任何其他项的值，包括计算项和聚合项。它们还可以用于触发器、图形、网络地图标签，以及任何其他可以使用项的地方。\n\n## 用户参数\n\
  \n到目前为止，我们看到的项允许我们查询Zabbix agent的内置功能、查询SNMP设备以及复用Zabbix服务器上的数据。时不时地，我们需要监控一些Zabbix开箱即用不支持的内容。扩展Zabbix数据收集最简单、最流行的方法是用户参数。它们是由Zabbix\
  \ agent运行的命令，结果作为项值返回。让我们尝试设置一些用户参数，看看有哪些需要特别注意的地方。\n\n## 让它工作起来\n\n首先，我们要确保能够让agent返回任何值。用户参数在agent端配置——agent守护进程包含键规范，其中包含对命令的引用。在“A\
  \ test host”上，编辑`zabbix_agentd.conf`，查看文件末尾附近。语法说明如下：\n\n```\nUserParameter=<key>,<shell\
  \ command>\n```\n\n这意味着我们可以自由选择键名和要执行的命令。建议将键名保持为小写字母数字字符和点。开始时，添加一个非常简单的行：\n\n\
  ```\nUserParameter=quick.test,echo 1\n```\n\n始终只返回1。保存配置文件并重启Zabbix agent守护进程。虽然在frontend中添加这样的项可能很诱人，但强烈建议在frontend中配置它们之前测试所有用户参数。这样会更快地提供结果，总体上会让你的生活更简单。测试项最简单的方法是使用`zabbix_get`——我们在*第3章，使用Zabbix\
  \ Agent和基本协议进行监控*中讨论过这个小工具。在“A test host”上运行：\n\n```\n$ zabbix_get -s 127.0.0.1\
  \ -k quick.test\n```\n\n> 如果在另一台主机上测试用户参数，请从Zabbix服务器运行`zabbix_get`，或者确保agent允许来自localhost的连接——这是通过`zabbix_agentd.conf`中的server参数配置的。\n\
  \n这应该只返回“1”。如果确实如此，太棒了——你的第一个用户参数正在工作。如果没有，嗯，也不会有什么大问题。确保编辑了正确的文件，并且agent守护进程确实已重启。还要确保查询了正确的主机。\n\
  \n> 这个简单的用户参数实际上说明了一个故障排除建议。每当用户参数失败且你无法找出原因时，简化它，并用`zabbix_get`测试每次迭代。最终，你会找到导致失败的部分。\n\
  \n我们实际上不会在前端中添加这个项，因为它不会提供太多价值。相反，让我们重新实现一个Zabbix agent中已经可用的项——统计已登录用户的数量。再次编辑zabbix_agentd.conf，并在我们之前的修改附近添加以下内容：\n\
  \n```\nUserParameter=system.test,who | wc -l\n```\n\n注意我们如何将多个命令链式使用。一般来说，底层shell能接受的任何命令都可以。保存文件并重启Zabbix\
  \ agent守护进程。现在再次快速测试：\n\n```\n$ zabbix_get -s 127.0.0.1 -k system.test\n```\n\n\
  这应该返回一个数字——由于你可能在同一个系统上运行zabbix_get，它应该至少为1。让我们在前端创建一个项来接收这些数据。打开配置|主机，确保在组下拉列表中选择Linux\
  \ servers，点击A test host旁边的项，然后点击创建项。填写以下值：\n\n- **名称：** 已登录用户\n- **类型：** Zabbix\
  \ agent（主动式）\n- **键：** system.test\n\n我们将主动式项类型与我们的用户参数一起使用。建议将用户参数用作主动式项，因为如果它们不能很快返回，可能会占用服务器连接。注意，我们使用的键名与agent守护进程配置文件中指定的完全相同。完成后，点击添加。\n\
  \n现在查看监测|最新数据。由于这是一个主动式项，我们可能需要等待agent从服务器请求项列表，然后返回数据，除了服务器每分钟更新一次缓存外，这最多可能需要2分钟。数据迟早会出现在。\n\
  \n最棒的是，从服务器端来看，这一切完全是透明的——该项看起来和运行起来都像是内置的。\n\n我们已经让一个基本的用户参数工作了，但这个参数复制了现有的Zabbix\
  \ agent项，因此它仍然不是那么有用。用户参数带来的最大好处是能够监控几乎任何内容，甚至包括Zabbix agent原生不支持的内容，所以让我们尝试一些稍微更高级的指标。\n\
  \n## 查询Zabbix agent不支持的数据\n\n我们可能感兴趣的一件事是打开的TCP连接数。我们可以使用`netstat`命令获取这些数据。在Zabbix服务器上执行以下命令：\n\
  \n```\n$ netstat -t\n```\n\n-t开关告诉netstat只列出TCP连接。因此，我们得到一个连接列表（此处已裁剪）：\n\n```\n\
  Active Internet connections (w/o servers)\nProto Recv-Q Send-Q Local Address   \
  \           Foreign Address        State\ntcp       0      0 localhost:zabbix-trapper\
  \ localhost:52932        TIME_WAIT\n\ntcp       0      0 localhost:zabbix-agent\
  \   localhost:59779        TIME_WAIT\n\ntcp       0      0 localhost:zabbix-agent\
  \   localhost:59792        TIME_WAIT\n```\n\n> 在现代发行版上，ss实用程序可能是更好的选择。它的性能也更好，尤其是在连接数很多的时候。与前述`netstat`命令对应的ss备选命令是`ss\
  \ -t state connect`。\n\n要获取连接数，我们将使用以下命令：\n\n```\nnetstat -nt | grep -c ^tcp\n```\n\
  \n这里，grep首先过滤出连接行，然后只计算它们的数量。我们本可以使用许多其他方法，但这个足够简单。此外，-n标志被传递给netstat，指示它不对主机进行解析，从而提高性能。\n\
  \n编辑`zabbix_agentd.conf`，并在其他用户参数附近添加以下行：\n\n```\nUserParameter=net.tcp.conn,netstat\
  \ -nt | grep -c ^tcp\n```\n\n在前端中，转到**配置 | 主机**，点击**A test host**旁边的**项**，然后点击**创建项**并填写以下值：\n\
  \n- **名称：** 打开的连接\n- **类型：** Zabbix agent（主动式）\n- **键：** `net.tcp.conn`\n\n\n\n\n\
  完成操作后，点击底部的**添加**按钮。你注意到我们在修改配置文件后没有重启 agent 守护进程吗？现在重启它。按此操作顺序会更快地获得数据，因为 agent\
  \ 在启动后立即查询活动监控项列表，这样当 agent 重启时服务器已经配置好了该监控项。请随意查看**监测 | 最新数据**：\n\n| 打开的连接数 | 2016-05-09\
  \ 21:55:55 | 33 |\n\n## 灵活的用户参数\n\n我们现在正在收集所有打开连接的数据。但查看 netstat 输出时，可以看到处于不同状态的连接，例如\
  \ `TIME_WAIT` 和 `ESTABLISHED`：\n\n```\ntcp        0       0 127.0.0.1:10050    \
  \          127.0.0.1:60774       TIME_WAIT\n\ntcp        0       0 192.168.56.10:22\
  \             192.168.56.1:51187     ESTABLISHED\n```\n\n如果我们想要监控不同状态的连接，是不是必须为每种状态创建一个新的用户参数？幸运的是，不需要。Zabbix\
  \ 支持所谓的灵活用户参数，允许我们向执行的命令传递参数。\n\n再次编辑 `zabbix_agentd.conf`，将之前添加的用户参数行修改为如下内容：\n\
  \n```\nUserParameter=net.tcp.conn[*],netstat -nt | grep ^tcp | grep -c \"$1\"\n\
  ```\n\n> 在现代发行版中，`ss` 工具可能更好。例如，过滤已建立的连接可以通过 `ss -t state` 轻松完成。\n\n我们在这里做了几处改动。首先，添加\
  \ `[*]` 表明该用户参数本身接受参数。其次，添加第二个 grep 语句允许我们在命令中使用传递进来的参数。我们还将 `-c` 标志移到了最后一个 grep\
  \ 语句上用于计数。\n\n> 之前是否提到过使用 `ss` 会更简单？\n\n我们现在为这个键使用的所有参数都会传递给脚本——$1 替换第一个参数，$2 替换第二个，依此类推。注意\
  \ $1 周围使用了双引号。这样，如果没有传递参数，结果与完全不使用 grep 时相同。\n\n重启 agent 以使其加载修改后的用户参数。\n\n回到前端“配置\
  \ | 主机”页面，点击“A test host”旁边的“监控项”，在“名称”列点击“打开的连接数”，然后点击编辑表单底部的“克隆”按钮。修改以下字段：\n\n\
  - **名称：** 处于 $1 状态的打开的连接数\n- **键值：** net.conn[TIME_WAIT]\n\n点击底部的“添加”按钮。现在在“名称”列点击“处于\
  \ TIME_WAIT 状态的打开的连接数”，点击“克隆”，修改“键值”字段为 net.conn[ESTABLISHED]，然后点击底部的“添加”按钮。\n\n\
  > 有关可能的连接状态的完整列表，请参阅 netstat 的手册页。\n\n查看“监测 | 最新数据”：\n\n| 打开的连接数 | 2016-05-10 05:14:53\
  \ | 48 |\n| 处于 ESTABLISHED 状态的打开的连接数 | 2016-05-10 05:14:23 | 2 |\n| 处于 TIME_WAIT\
  \ 状态的打开的连接数 | 2016-05-10 05:14:23 | 45 |\n\n这些值可能不匹配——将所有状态的打开连接数相加可能不等于打开的连接总数。首先，请记住还有其他连接状态，因此必须把它们全部加起来才能得到完整视图。其次，正如我们之前所见，所有这些值并非同时获取，因此一个监控项抓取数据后，片刻之后另一个监控项才获取数据，但数据已经发生了细微变化。\n\
  \n> 我们还将所有通过远程连接到服务器、仅运行 Zabbix 服务器或其他方式创建的连接也计算在内。\n\n我们现在正在接收各种监控项的值，但只需要添加一个用户参数。灵活的用户参数允许我们基于多个参数返回数据。例如，如果我们做如下简单修改，就可以为用户参数提供额外的功能：\n\
  \n```\nUserParameter=net.conn[*],netstat -nt | grep ^tcp | grep \"$1\" | grep -c\
  \ \"$2\"\n```\n\n我们针对第二个参数添加了另一个 grep 命令，同样使用双引号以确保缺少参数时不会引发问题。现在我们可以使用 IP 地址作为第二个参数，来统计特定主机上处于特定状态的连接数。在这种情况下，监控项键值可能是\
  \ net.conn[TIME_WAIT,127.0.0.1]。\n\n请注意，在这种情况下，监控项参数的顺序（先传递状态，再传递 IP）完全是任意的。我们可以交换它们并获得相同的结果，因为我们只是通过\
  \ grep 用两个字符串过滤输出。如果我们交换它们，描述就会略有偏差，因为我们在描述中使用了基于位置的监控项键参数引用。\n\n## 监控的详细级别\n\n\
  可以对某个目标监控的详细内容组合几乎是无限的。你可以监控进程的每一个详细参数，例如详细的内存使用情况、PID 文件是否存在等等；也可以简单地检查某个进程是否正在运行。\n\
  \n有时，单个服务可能需要多个进程同时运行，而监控某一类进程是否按预期运行可能就足够了，剩下的可以交给其他组件去判断。一个例子是电子邮件服务器 Postfix。Postfix\
  \ 运行多个不同的进程，包括 master、pickup、anvil、smtpd 等。虽然可以针对每个单独的进程创建检查，但通常只需检查 init 脚本是否认为一切正常就足够了。\n\
  \n我们需要一个支持 status 命令的 init 脚本。由于 init 脚本通常会输出类似“检查服务 Postfix：正在运行”的文本，因此最好只向 Zabbix\
  \ 返回一个指示服务状态的数字值。常见的退出码为“0”表示成功，如果出现问题则为非零。这意味着我们可以这样做：\n\n```\n/etc/init.d/postfix\
  \ status > /dev/null 2>&1 || echo 1\n```\n\n## 高级监控项监控\n\n这会调用 init 脚本，丢弃所有 stdout\
  \ 和 stderr 输出（因为我们只想向 Zabbix 返回一个数字），并在退出码非零时返回“1”。这应该可行，对吧？只有一个大问题——参数绝不应返回空字符串，而如果\
  \ Postfix 正在运行，这种检查就会返回空字符串。如果 Zabbix 服务器检查这样的监控项，它会认为该参数不受支持，并因此将其停用。我们可以修改这个命令，使其变成这样：\n\
  \n```\n/etc/init.d/postfix status  > /dev/null 2>&1 && echo 0 || echo 1\n```\n\n\
  这种方法效果很好，因为现在返回的是布尔值，Zabbix 总能获得有效数据。但可能还有更好的方法。由于退出码为 0 表示成功，非零表示出现问题，我们可以直接返回退出码。虽然这意味着我们不会只得到漂亮的布尔值，但我们仍然可以在触发器表达式中检查非零值，例如：\n\
  \n```\n{hostname:item.last()}<>0\n```\n\n额外的好处是，如果 init 脚本返回更详细的状态并带有非零退出码，我们可能会得到更详细的返回消息。根据\
  \ **Linux 标准规范** 的定义，status 命令的退出码如下：\n\n| 代码 | 含义 |\n|---|---|\n| 0 | 程序正在运行或服务正常\
  \ |\n| 1 | 程序已死且 `/var/run` pid 文件存在 |\n| 2 | 程序已死且 `/var/lock` 锁文件存在 |\n| 3 | 程序未运行\
  \ |\n| 4 | 程序或服务状态未知 |\n\n有几个保留范围可能包含其他代码，用于特定的应用程序或发行版——这些代码应在相应的文档中查阅。\n\n在这种情况下，我们的用户参数命令变得更加简单，完整命令如下：\n\
  \n```\nUserParameter=service.status[*],/etc/init.d/\"$1\" status > /dev/null 2>&1;\
  \ echo $?\n```\n\n我们只是简单地将退出码返回给 Zabbix。为了使输出更加友好，我们肯定需要使用值映射。这样，每个返回码都会在前端附带一条类似上述的解释性消息。注意\
  \ $1 的使用。这样，我们可以创建一个用户参数，并将其用于任何我们想要的服务。对于这样的监控项，合适的键值可以是 service.status[postfix]\
  \ 或 service.status[nfs]。如果这样的检查对非 root 用户无效，则必须使用 sudo。\n\n在开源领域，单个服务对应多个进程的情况不太常见，但在专有软件中却很常见，在这种情况下，这样的技巧可以大大简化此类服务的监控。\n\
  \n> 一些发行版最近已迁移到 systemd。在这种情况下，用户参数行将是 UserParameter=service.status[*],systemctl\
  \ status \"$1\" > /dev/null 2>&1; echo $?。\n\n## 环境陷阱\n\n让我们试着找出通过这种方式还能收集哪些有趣的统计数据。一个常见的需求是监控数据库的一些统计信息。我们可以尝试收集一些\
  \ MySQL 查询数据；例如，每秒有多少查询？MySQL 内置了每秒查询数的度量，但这并不是大多数用户所期望的。该特定值是根据 MySQL 启动以来的整个运行时间计算的，这意味着它相当有用，但仅限于最初的几分钟。运行时间较长的\
  \ MySQL 实例，该数字会接近平均值且仅略有波动。绘制成图表后，每秒查询数图表会随着时间推移变得越来越平坦。\n\nZabbix 的灵活性允许我们使用不同的指标。让我们尝试创建更有意义的\
  \ MySQL 查询监控项。我们可以通过如下查询获取一些关于 SELECT 语句的数据：\n\n```\nmysql> show global status like\
  \ 'Com_select';\n```\n\n现在，我们应该尝试将其作为用户参数来使用。一个只解析出我们感兴趣数字的测试命令如下：\n\n```\n$ mysql\
  \ -N -e \"show global status like 'Com_select';\" | awk '{print $2}'\n```\n\n\n\n\
  我们使用 awk 来输出第二个字段。mysql 的 -N 选项用于省略列标题。接下来是 agent 守护进程的配置——请在其他用户参数附近添加以下内容：\n\n\
  ```\nUserParameter=mysql.queries[*],mysql -u zabbix -N -e \"show global status like\
  \ 'Com_$1';\" | awk '{print $$2}'\n```\n\n这基本上就是用户参数定义并附加了命令，但我们在这里做了几处改动。注意我们在键后面使用了\
  \ [*]，并将 Com_select 中的 \"select\" 替换成了 $1——这样我们就能将查询类型用作监控项键参数。这也需要在 awk 语句中再加一个美元符号。如果需要在灵活的用户参数中使用字面意义上的美元符号占位符，那么这种美元符号必须再加一个美元符号作为前缀。我们做的最后一处改动是在\
  \ mysql 命令中添加了 -u zabbix。当然，在可能的情况下，最好不要使用 root 或类似的权限来获取数据库统计信息——但如果这个命令本应由 Zabbix\
  \ agent 运行，为什么还要再次指定用户名呢？主要是由于一个古老而奇怪的 bug，MySQL 有时会尝试用错误的用户连接。如果你想查看该问题的当前状态，请参阅\
  \ https://bugs.mysql.com/bug.php?id=64522。完成这些修改后，保存并关闭文件，然后重启 agent 守护进程。\n\n>\
  \ 你可能需要创建一个完全独立的、没有任何实际写权限的数据库用户，仅用于监控。\n\n现在，和之前一样，我们快速执行一个 zabbix_get 测试：\n\n\
  ```\n$ zabbix_get -s 127.0.0.1 -k mysql.queries[select]\n```\n\n好吧，你可能已经预料到这个结果了：\n\
  \n```\nERROR 1045 (28000): Access denied for user 'zabbix'@'localhost' (using password:\
  \ NO)\n```\n\n我们的数据库用户确实需要密码，但我们没有指定任何密码。那该怎么办呢？mysql 工具允许我们通过 -p 选项在命令行上指定密码，但最好避免这样做。将密码放在命令行上可能会让其他用户在进程列表中看到这些数据，所以最好养成一个习惯——绝不在命令行上放置秘密信息。\n\
  \n> 在某些平台上，某些版本的 MySQL 客户端会掩蔽所传递的密码。虽然这是 MySQL 开发者的一番好意，但它并非在所有平台和所有软件上都有效，因此为了养成习惯，还是应该避免这种做法。在这种情况下，密码很可能会被写入\
  \ shell 历史文件，即使进程不再运行，攻击者也能获取到。\n\n那么我们如何以安全的方式传递密码呢？幸运的是，MySQL 可以从文件中读取密码，而我们可以通过权限设置来保护该文件。MySQL\
  \ 会在多个目录中查找 .my.cnf 文件，在我们的场景下，最好的选择可能是将其放在用户的主目录中。在 Zabbix 服务器上，以 zabbix 用户身份执行以下命令：\n\
  \n```\n$ touch ~zabbix/.my.cnf\n$ chmod 600 ~zabbix/.my.cnf\n$ echo -e \"[client]\\\
  npassword=<password>\" > ~zabbix/.my.cnf\n```\n\n> 如果密码包含井号 #，请在此文件中用双引号将其括起来。\n\
  > 你可以使用 su - zabbix 切换到 zabbix 用户，或使用 sudo。\n\n请使用 Zabbix 数据库用户的密码。你可以通过查看 zabbix_server.conf\
  \ 来确认密码是什么。如果以 root 身份运行上述命令，还需要在创建文件后运行 chown -R zabbix.zabbix ~zabbix。请注意，我们先创建并保护文件，然后才把密码放入其中。在继续\
  \ agent 端之前，让我们测试一下 MySQL 工具是否能读取到这个密码文件。以 zabbix 用户身份运行：\n\n```\n$ mysqladmin -u\
  \ zabbix status\n```\n\n> 请在同一个 su 会话中运行上述命令，或使用 sudo -u zabbix mysqladmin -u zabbix\
  \ status 运行。\n\n如果我们放入密码的文件一切正常，它应该会返回一些数据：\n\n```\nUptime: 10218  Threads: 23 \
  \ Questions: 34045  Slow queries: 0  Opens: 114\nFlush tables: 2  Open tables: 140\
  \  Queries per second avg: 3.331\n```\n\n如果不起作用，请仔细检查密码、路径以及文件的权限。我们使用 mysqladmin\
  \ 进行此测试，但 mysql 和 mysqladmin 应该使用相同的过程来查找 .my.cnf 文件并从中读取密码。既然我们知道它已生效，让我们再次使用 zabbix_get（这次无需重启\
  \ agent，因为我们没有修改 agent 配置文件）：\n\n```\n$ zabbix_get -s 127.0.0.1 -k mysql.queries[select]\n\
  ```\n\n但结果似乎有些奇怪：\n\n```\nERROR 1045 (28000): Access denied for user 'zabbix'@'localhost'\
  \ (using password: NO)\n```\n\n> 在某些情况下，使用 systemd 时，主目录可能已被设置——如果是这样，请跳过下一步修改，但请记住这个潜在的陷阱。\n\
  \n仍然失败，而且错误信息相同。如果我们仔细阅读完整的错误信息，会发现密码仍然没有被使用。这怎么可能呢？\n\n> 我们以哪个用户身份运行 zabbix_get\
  \ 并不重要——它通过 TCP 端口连接到正在运行的 agent 守护进程，因此当用户参数命令执行时，运行 zabbix_get 的用户信息完全没有影响。\n\n\
  用户参数命令的环境并未被初始化。这包括几个常见变量，其中一个我们非常关心——HOME。MySQL 客户端使用该变量来确定在哪里查找 .my.cnf 文件。如果该变量缺失，就无法找到这个文件（进而也就无法找到密码）。这意味着我们无计可施了吗？当然不是，我们不会让这样一个小问题难倒。我们只需要告诉\
  \ MySQL 在哪里查找该文件，而且可以用一个非常简单的方法。再次编辑 zabbix_agentd.conf，将用户参数行修改为以下内容：\n\n```\n\
  UserParameter=mysql.queries[*],HOME=/home/zabbix mysql -u zabbix -N -e \"show global\
  \ status like 'Com_$1';\" | awk '{print $2}'\n```\n\n> 如果你是通过软件包安装的，请使用为 zabbix\
  \ 用户设置的主目录。\n\n这为 mysql 工具设置了 HOME 变量，应该能让 MySQL 客户端找到包含密码的配置文件。再次重启 Zabbix agent，然后运行以下命令：\n\
  \n```\n$ zabbix_get -s 127.0.0.1 -k mysql.queries[select]\n229420\n```\n\n你会看到一个不同的值，终于可以看到监控项正常工作了。但这个数字是什么意思？如果你反复运行\
  \ zabbix_get，会看到这个数字在增加。这看起来很像另一个计数器——确实，这是自数据库引擎启动以来的 SELECT 查询次数。我们知道该如何处理这种情况。回到前端，让我们添加一个监控项来监视每秒\
  \ SELECT 查询数。导航到“配置 | 主机”，点击“A test host”旁边的“监控项”，然后点击“创建监控项”按钮。填写以下值：\n\n- **名称：**\
  \ MySQL $1 每秒查询数\n- **类型：** Zabbix agent（主动式）\n- **键：** mysql.queries[select]\n\
  - **信息类型：** 数字（浮点型）\n- **单位：** qps\n- **存储值：** 差值（每秒速率）\n- **新建应用：** MySQL\n\n完成后，点击底部的“添加”按钮。请注意，这里我们对\
  \ **差值（每秒速率）** 和 **数字（浮点型）** 组合使用。对于网络流量监控项，我们选择了 **数字（无符号）**，因为那里的值可能会超出浮点数的范围。对于这个查询监控项，这几乎不可能发生，甚至可以说完全不可能，而且我们实际上会从更高的精度中受益匪浅。单位\
  \ qps 只是一个字符串。除了显示在数据旁边外，它不会以任何方式影响数据的显示。\n\n同样，我们可能需要等待几分钟才能收到数据。如果你没耐心，可以随时重启\
  \ Zabbix agent 守护进程，然后查看“最新数据”页面：\n\n| 名称 ▲ | 上次检查 | 最后的值 |\n|---|---|---|\n| MySQL（1\
  \ 个监控项） |  |  |\n| MySQL select 每秒查询数 | 2016-05-09 23:36:52 | 2.96 qps |\n\n## 高级监控项监控\n\
  \n数据正在正常传入，我们可以看到测试服务器负载并不太高。现在让我们利用用户参数的灵活性。导航回 **配置 | 主机**，点击 **A test host**\
  \ 旁边的 **监控项**，然后在 **名称** 列中点击 **MySQL select 每秒查询数**。在表单底部点击 **克隆** 按钮，将键中的 select\
  \ 改为 update，然后点击底部的 **添加** 按钮。再克隆两次这个监控项，将键参数分别改为 insert 和 delete。最终应该有四个监控项：\n\n\
  | 名称 | 触发器 | 键 |\n|---|---|---|\n| MySQL delete 每秒查询数 |  | mysql.queries[delete]\
  \ |\n| MySQL insert 每秒查询数 |  | mysql.queries[insert] |\n| MySQL update 每秒查询数 | \
  \ | mysql.queries[update] |\n| MySQL select 每秒查询数 |  | mysql.queries[select] |\n\
  \n监控项应该很快开始收集数据；让我们看看它们放在一起的效果。点击监控项列表上方导航栏中的 **图形**，然后点击 **创建图形**。在 **名称** 字段中输入“MySQL\
  \ 查询”，然后点击 **监控项** 区域中的 **添加**。选中我们创建的四个 MySQL 监控项旁边的复选框，点击底部的 **选择**，然后点击底部的 **添加**\
  \ 按钮。现在，前往 **监控 | 图形**，在 **主机** 下拉框中选择 **A test host**，在 **图形** 下拉框中选择 **MySQL 查询**。过一段时间后，图形可能如下所示：\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_438_0.png)\n\n\n\n\n正如我们所见，`SELECT` 查询在这里处于顶部，而\
  \ `DELETE` 查询几乎不存在。还有其他查询类型，但这对于我们的用户参数实现来说已经足够了。\n\n## 关于用户参数需要记住的事情\n\n我们看到用户参数的灵活性基本上是无限的。尽管如此，在某些情况下可能需要采取额外的措施。\n\
  \n## 包装脚本\n\n要执行的命令只能在 Zabbix agent daemon 配置文件中单行指定。将整个脚本推入其中可能会非常混乱，有时很难弄清楚引号。在这种情况下，必须编写一个包装脚本。如果解析数据需要更复杂的操作，或者如果无法使用灵活的用户参数轻松解析多个不同的值，这种脚本就很有用。\n\
  \n需要注意的是，使用用户参数和自定义脚本要求这些内容分发到所有被监控主机上——这涉及脚本本身以及对 Zabbix agent daemon 配置文件的更改。\n\
  \n这很快就会变得难以管理。各种系统需要不同的用户参数，因此你最终会得到一个包含所有参数的混乱的 agent 配置文件，或者大量不同的组合。有一种相当广泛的特性可以帮助解决这个问题——配置文件包含。你可以通过向\
  \ `zabbix_agentd.conf` 添加类似以下条目来指定包含单个文件：\n\n```\nInclude=/etc/zabbix/userparameters/zabbix_lm_sensors.conf\n\
  Include=/etc/zabbix/userparameters/zabbix_md_raid.conf\n```\n\n如果缺少此类文件，Zabbix 会抱怨，但仍会启动。包含可以嵌套——你可以包含一个文件，而该文件又包含多个其他文件，依此类推。\n\
  \n也可以包含整个目录——在这种情况下，该目录中放置的所有文件都将被使用。这种方法允许其他软件包将例如用户参数配置放置在特定目录中，然后 Zabbix 会自动使用它：\n\
  \n```\nInclude=/etc/zabbix/userparameters/\n```\n\n或者，为了确保只有以 \"conf\" 结尾的文件被包含：\n\
  \n```\nInclude=/etc/zabbix/userparameters/*.conf\n```\n\n然后其他软件包只需将诸如 `zabbix_lm_sensors.conf`\
  \ 或 `zabbix_md_raid.conf` 这样的文件放置在目录 `/etc/zabbix/userparameters` 中，它们就会被使用，而无需对\
  \ agent daemon 配置文件进行任何额外更改。安装 Apache Web 服务器会添加一个文件，安装 Postfix 会添加另一个文件，等等。\n\n\
  ## 何时不使用用户参数\n\n也有一些情况，用户参数最好被不同的解决方案取代。通常，这将是在以下情况：\n\n- 脚本花费很长时间\n- 脚本返回许多值\n\n\
  在第一种情况下，脚本可能会超时。agent 端的默认超时为 3 秒，在大多数情况下不建议增加它。\n\n在第二种情况下，我们可能对脚本一次调用返回的 100 个值感兴趣，但\
  \ Zabbix 不允许从单个 key 或单个调用中获取多个值，因此我们必须运行脚本 100 次——效率不高。\n\n> 如果脚本为多个 trapper 项提供值，可能值得为其中一些添加\
  \ `nodata()` 触发器——这样，任何脚本问题和缺失数据都会被快速发现。\n\n有几种潜在的解决方案，每种方案都有各自的缺点和优点：\n\n- 一个特殊项（通常是外部检查，下面讨论，或另一个用户参数），如果数据收集脚本很快，可以使用\
  \ `zabbix_sender` 立即发送数据。如果不是，它可以写入临时文件或使用 `nohup` 调用另一个脚本。\n- `crontab`：一种经典的解决方案，可以帮助脚本花费很长时间和返回许多值的情况。它也有一个缺点，即间隔管理在\
  \ Zabbix 之外。值通常使用 `zabbix_sender` 立即发送（本章后面会讨论），尽管它们也可以写入临时文件，并由使用 `vfs.file.contents`\
  \ 或 `vfs.file.regexp` key 的其他项读取。\n\n- 一个特殊项（通常是另一个用户参数），它添加一个 `atd` 作业。这种解决方案有点复杂，但允许我们在仍使用长时间运行的脚本进行数据收集的同时，保持间隔管理在\
  \ Zabbix 中。有关更多详细信息，请参阅 http://zabbix.org/wiki/Escaping_timeouts_with_atd。\n\n>\
  \ 有报告称 `atd` 在 RHEL 5 和 6 中可能会崩溃，也可能在其他发行版中出现。如果使用此方法，也请监控 `atd`。\n\n## 外部检查\n\n\
  我们在之前探索的所有检查类别涵盖了非常广泛的可能设备，但总会有那种与标准监控协议配合不佳、无法安装 agent、总体上存在问题的设备。现实生活中的例子是 UPS，它在\
  \ Web 界面上提供温度信息，但不通过 SNMP 提供此数据。或者也许我们想远程收集 Zabbix 尚未支持的一些信息——例如，监控 SSL 证书还有多长时间到期。\n\
  \n在 Zabbix 中，可以通过外部检查或外部脚本收集此类信息。虽然用户参数是由 Zabbix agent 运行的脚本，但外部检查脚本是由 Zabbix server\
  \ 直接运行的。\n\n首先，我们应该弄清楚查找剩余证书有效期的命令。我们这里至少有两个选项：\n\n- 返回证书到期的时间\n- 返回 0 或 1 来标识证书在某个时间段内到期\n\
  \n让我们尝试这两种选项。\n\n### 查找证书到期时间\n\n我们可以用类似这样的 OpenSSL 命令找到证书到期时间：\n\n```\n$ echo |\
  \ openssl s_client -connect www.zabbix.com:443 2>/dev/null | openssl x509 -noout\
  \ -enddate\n```\n\n> 随意在此处和稍后使用任何其他域名进行测试。\n\n我们通过 echo 关闭 openssl 命令的 stdin 并将检索到的证书信息传递给另一个\
  \ openssl 命令 x509，以返回证书将到期的日期和时间：\n\n```\nnotAfter=Jan  2 10:35:38 2019 GMT\n```\n\
  \n resulting 字符串并不是我们可以在 Zabbix 中轻松解析的东西。我们可以将其转换为 UNIX 时间戳，如下所示：\n\n```\n$ date\
  \ -d \"$(echo | openssl s_client -connect www.zabbix.com:443 2>/dev/null | openssl\
  \ x509 -noout -enddate | sed 's/^notAfter=//')\" +%s\n```\n\n我们使用 sed 去掉非日期部分，然后使用\
  \ date 实用程序将日期和时间格式化为 UNIX 时间戳：\n\n```\n1546425338\n```\n\n看起来我们已经准备好命令了，但我们要把它放在哪里？对于外部检查，使用一个特殊目录。打开\
  \ zabbix_server.conf 并查找 ExternalScripts 选项。你可能会看到一个特定路径，或一个占位符：\n\n```\n# ExternalScripts=${datadir}/zabbix/externalscripts\n\
  ```\n\n如果它是一个特定路径，那就很简单了。如果它是像上面这样的占位符，它引用的是编译时的数据目录。请注意它不是一个变量。编译源代码时，${datadir}\
  \ 路径默认为 /usr/local/share/。如果你是从软件包安装的，它很可能为 /usr/share/。无论如何，在那里应该有一个 zabbix/externalscripts/\
  \ 子目录。我们的外部检查脚本必须放在那里。创建一个脚本 zbx_certificate_expiry_time.sh 并包含以下内容：\n\n```\n#!/bin/bash\n\
  \ndate -d \"$(echo | openssl s_client -connect \"$1\":443 2>/dev/null | openssl\
  \ x509 -noout -enddate | sed 's/^notAfter=//')\" +%s\n```\n\n注意我们如何用 $1 占位符替换了实际的网站地址——这允许我们将要检查的域名作为参数指定给此脚本。使该文件可执行：\n\
  \n```\n$ chmod 755 zbx_certificate_expiry_time.sh\n```\n\n现在进行快速测试：\n\n```\n$ ./zbx_certificate_expiry_time.sh\
  \ www.zabbix.com\n1451727126\n```\n\n\n\n\n\n太好了，我们可以将域名传递给脚本，并获得该域名的证书过期时间。现在，我们将这些信息放入\
  \ Zabbix。在前端，转到配置 | 主机，点击“A test host”旁边的“监控项”，然后点击“创建监控项”。填写以下内容：\n\n- 名称：$1 上的证书过期时间\n\
  - 类型：外部检查\n- 键值：zbx_certificate_expiry_time.sh[www.zabbix.com]\n- 单位：unixtime\n\n\
  我们将要检查的域名指定为键参数，它将被作为第一个位置参数传递给脚本，在脚本中我们使用 $1 引用它。如果需要多个参数，我们使用逗号分隔，这与任何其他监控项类型相同。这些参数将作为\
  \ $1、$2 等正确传递给脚本。如果不需要参数，我们可以使用空的方括号 []，或者完全省略。如果我们想对主机信息进行操作，而不是像我们这样硬编码值，我们可以使用一些宏——例如，{HOST.HOST}、{HOST.IP}\
  \ 和 {HOST.DNS} 是常见值。另一个有用的宏是 {HOST.CONN}，它会根据接口属性中选择的是 IP 还是 DNS，解析为相应的值。\n\n完成后，点击底部的“添加”按钮。现在在“最新数据”页面检查此监控项：\n\
  \n| 名称 | 值 | 最后检查 |\n| --- | --- | --- |\n| www.zabbix.com 上的证书过期时间 | 2016-05-09\
  \ 23:59:21 | 2019-01-02 12:35:38 |\n\n过期时间似乎被正确收集，并且 unixtime 单位将值转换为人类可读的版本。关于此监控项的触发器呢？最简单的解决方案可能还是使用\
  \ fuzzytime() 函数。假设我们想检测将在 7 天或更短时间内过期的证书。触发器表达式如下：\n\n```\n{A test host:zbx_certificate_expiry_time.sh[www.zabbix.com].fuzzytime(604800)}=0\n\
  ```\n\n触发器函数参数中的巨大数值 604800 是 7 天对应的秒数。我们能让它更易读吗？当然可以，下面这个是完全相同的：\n\n```\n{A test\
  \ host:zbx_certificate_expiry_time.sh[www.zabbix.com].fuzzytime(7d)}=0\n```\n\n\
  触发器会在剩余 1 周时发出警报，从监控项值中我们可以确切地看到剩余多少时间。我们在第 6 章“使用触发器检测问题”中更详细地讨论了触发器。\n\n## 确定证书有效性\n\
  \n> 我们有意忽略了证书可能尚未生效这一事实。虽然我们的触发器会在证书在一周或更长时间内无效时触发，但它会忽略那些在不到一周内才会生效的证书。\n\n更简单的方法可能是将阈值传递给\
  \ OpenSSL 工具，让它们确定证书在那么多秒后是否仍然有效。检查证书在 7 天内是否有效的命令如下：\n\n```bash\n$ echo | openssl\
  \ s_client -connect www.zabbix.com:443 2>/dev/null | openssl x509 -checkend 604800\n\
  Certificate will not expire\n```\n\n看起来足够简单。如果证书在给定时间内过期，消息会显示“Certificate will\
  \ expire”。好的一点是，退出代码也会根据过期状态而不同，因此我们可以在证书仍然有效时返回 1，在过期时返回 0。\n\n> 这种方法在成功时返回 1，与许多内置监控项类似。也可以在执行\
  \ openssl 命令后使用“echo $?”，它会在成功时返回 0。\n\n```bash\n$ echo | openssl s_client -connect\
  \ www.zabbix.com:443 2>/dev/null | openssl x509 -checkend 604800 -noout && echo\
  \ 1 || echo 0\n```\n\n> 在这个版本中，即使像 7d 这样的值可以被接受，但也不被支持。请务必只使用以秒为单位的值。\n\n在与之前相同的目录中，创建一个脚本\
  \ zbx_certificate_expires_in.sh，内容如下：\n\n```bash\n#!/bin/bash\necho | openssl s_client\
  \ -connect \"$1\":443 2>/dev/null | openssl x509 -checkend \"$2\" -noout && echo\
  \ 1 || echo 0\n```\n\n这次，除了将域名替换为 $1 外，我们还将检查的时间段替换为 $2 占位符。使该文件可执行：\n\n```bash\n\
  $ chmod 755 zbx_certificate_expires_in.sh\n```\n\n现在进行快速测试：\n\n```bash\n$ ./zbx_certificate_expires_in.sh\
  \ www.zabbix.com 604800\n1\n```\n\n看起来不错。现在，开始创建监控项——在前端，让我们转到配置 | 主机，点击“A test\
  \ host”旁边的“监控项”，然后点击“创建监控项”。首先点击“显示值”下拉菜单旁边的“显示值映射”。在弹出的窗口中，点击“创建值映射”。在“名称”字段中输入“Certificate\
  \ expiry status”，然后点击“映射”部分中的“添加”链接。填写以下内容：\n\n- 0：即将过期\n- 1：尚未过期\n\n![](img/f5313a804532fabacc8d07cc8607eeba_445_0.png)\n\
  \n我们在这里不指定时间段，因为这可以按监控项自定义。完成后，点击底部的“添加”按钮并关闭弹出窗口。刷新监控项配置表单以获取我们新的值映射，并填写以下内容：\n\
  \n- **名称：** $1 的证书过期状态\n- **类型：** 外部检查\n- **键值：** zbx_certificate_expires_in.sh[www.zabbix.com,604800]\n\
  - **显示值：** Certificate expiry status\n\n完成后，点击底部的“添加”按钮。然后再次在“最新数据”页面检查此监控项：\n\n\
  ![](img/f5313a804532fabacc8d07cc8607eeba_445_1.png)\n\n似乎运行正常。它尚未过期，所以一切正常。与之前方法相比的一个好处是，在查看列表时，哪些证书即将过期会更明显。\n\
  \n重要的是要记住，外部检查可能会花费相当长的时间。默认超时时间为 3 或 4 秒（我们将在第 22 章“Zabbix 维护”中讨论详细信息），任何超过一两秒的操作都已经太危险了。另外，请记住，服务器轮询进程在运行脚本期间始终处于忙碌状态；我们不能像对待用户参数活动项那样将外部检查卸载到代理。建议仅在所有其他收集信息的方法都失败时，才将外部检查作为最后手段。一般来说，外部检查应保持轻量且快速。如果脚本太慢，它将超时，监控项将变为不受支持。\n\
  \n## 发送数据\n\n在某些情况下，可能存在自定义数据源，而之前讨论的方法都无法很好地工作。脚本可能运行很长时间，或者我们的系统没有 Zabbix 代理，但具备推送数据的能力。Zabbix\
  \ 提供了一种方式，可以使用命令行实用程序 Zabbix sender 将数据发送到特殊监控项类型 Zabbix trapper。解释其工作原理的最简单方法可能是设置这样一个工作监控项——让我们导航到配置\
  \ | 主机，点击“A test host”旁边的“监控项”，然后点击“创建监控项”，并填写以下内容：\n\n- **名称：** 房间里的人数\n- **类型：**\
  \ Zabbix trapper\n- **键值：** room.persons\n\n完成后，点击底部的“添加”按钮。我们现在必须确定如何将数据传递到此监控项，这时\
  \ zabbix_sender 就派上用场了。在 Zabbix 服务器上，执行以下命令：\n\n```bash\n$ zabbix_sender --help\n\
  ```\n\n我们不会在这里重复输出内容，因为它有点长。相反，让我们看看最简单操作（从命令行发送单个值）需要哪些参数：\n\n- -z 指定 Zabbix 服务器\n\
  - -s 指定主机名，即在 Zabbix 中配置的名称\n- -k 指定监控项键值\n- -o 指定要发送的值\n\n不过，Zabbix 并不接受这种方式。我们提供的数据由于数据类型不匹配而被拒绝，因此很明显，任何传递数据的进程都要对数据内容和格式负责。\n\
  \n现在，关注安全的人可能会问——谁能向 trapper 类型的监控项发送数据？任何人都可以在任何主机上运行 zabbix_sender，只需要知道主机名和监控项键值即可。可以通过几种方式对此进行限制——其中一种，请看配置\
  \ | 主机，点击“A test host”旁边的“监控项”，然后点击“名称”列中的“Amount of persons in the room”。注意最后几个属性之一：“允许的主机”。我们可以在这里指定\
  \ IP 地址或 DNS 名称，此监控项的任何数据都只允许来自指定主机：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_448_0.png)\n\
  \n多个地址可以用逗号分隔。此字段也支持用户宏。我们在第 8 章“使用模板简化复杂配置”中讨论了用户宏。\n\n另一种限制谁可以向 trapper 监控项发送数据的方法是使用带有\
  \ PSK 或 SSL 证书的身份验证功能。这将在第 20 章“加密 Zabbix 通信”中讨论。\n\n## 使用代理守护进程配置文件\n\n到目前为止，我们在命令行上指定了\
  \ zabbix_sender 所需的全部信息。也可以从代理守护进程配置文件中自动检索其中一些信息。让我们尝试一下（使用正确的代理守护进程配置文件路径）：\n\n\
  ```bash\n$ zabbix_sender -c /usr/local/etc/zabbix_agentd.conf -k room.persons -o\
  \ 3\n```\n\n这会成功，因为我们指定了配置文件而不是 Zabbix 服务器地址和主机名——这些信息是从配置文件中获取的。如果你在多个同时运行 Zabbix\
  \ 代理的主机上运行 zabbix_sender，这比手动解析配置文件更简单、更安全。我们还可以为 zabbix_sender 使用一个只包含其所需参数的特殊配置文件。\n\
  \n> 如果 ServerActive 参数包含多个条目，则只会发送到第一个条目。zabbix_sender 不支持 HostnameItem 参数。\n\n\n\
  \n\n\n## 从文件中发送值\n\n我们使用的方法允许每次运行 zabbix_sender 时发送一个值。如果我们有一个返回大量值的脚本，那将是非常低效的。我们还可以通过\
  \ zabbix_sender 从文件中发送多个值。在任意位置创建一个这样的文件——例如，在 /tmp/ 中：\n\n```\n\"A test host\"\
  \ room.persons 4\n\"A test host\" room.persons 5\n\"A test host\" room.persons 6\n\
  ```\n\n每一行包含主机名、监控项键和值。这意味着可以从单个文件中提供任意数量的主机和键。\n\n> 请注意，包含空格的值使用双引号括起来——输入文件是以空白字符（空格和制表符）分隔的。\n\
  \n用于提供文件的标志是 -i。假设文件名为 sender_input.txt，我们可以运行以下命令：\n\n```\n$ zabbix_sender -z 127.0.0.1\
  \ -i /tmp/sender_input.txt\n```\n\n这应该成功发送所有三个值：\n\n```\ninfo from server: \"processed:\
  \ 3; failed: 0; total: 3; seconds spent: 0.000087\"\nsent: 3; skipped: 0; total:\
  \ 3\n```\n\n从文件发送值时，我们仍然可以利用 agent 守护进程配置文件：\n\n```\n$ zabbix_sender -c /usr/local/etc/zabbix_agentd.conf\
  \ -i /tmp/sender_input.txt\n```\n\n在这种情况下，服务器地址将从配置文件中获取，而主机名仍将从输入文件中提供。我们能否避免这种情况，并从\
  \ agent 守护进程配置文件中获取主机名呢？可以，只需将输入文件中的主机名替换为短横线，如下所示：\n\n```\n- room.persons 4\n\"\
  A test host\" room.persons 5\n- room.persons 6\n```\n\n在这种情况下，第一条和第三条记录的主机名将从配置文件中获取，而第二条记录的主机名仍然会被覆盖。\n\
  \n> 如果输入文件包含许多条目，`zabbix_sender` 会以每次连接发送 250 个值的批次进行发送。\n\n当需要持续发送大量值时，可能希望避免重复运行\
  \ `zabbix_sender` 二进制文件。相反，我们可以让一个进程在不关闭文件的情况下向文件中写入新条目，然后让 `zabbix_sender` 从该文件读取。不幸的是，默认情况下，只有在文件关闭时——或者每收到\
  \ 250 个值时——值才会被发送到服务器。幸运的是，还有一个命令行标志可以影响此行为。标志 `-r` 启用了所谓的**实时模式**。在此模式下，`zabbix_sender`\
  \ 会从文件中读取新值并等待 0.2 秒。如果没有新值到来，则将已获取的值发送出去。如果有更多值到来，它会再等待 0.2 秒，以此类推，最长等待 1 秒。如果有一个主机持续向\
  \ Zabbix 服务器传输值，`zabbix_sender` 最多每秒连接服务器一次，并在一次连接中发送该秒内收到的所有值。是的，在某些特殊情况下，可能会有更多连接——例如，如果我们恰好每\
  \ 0.3 秒提供一个值。\n\n如果发送大量值并使用文件可能成为性能问题，我们甚至可以考虑使用命名管道代替文件——尽管这种情况相当罕见。\n\n## 发送带时间戳的值\n\
  \n到目前为止我们发送的数据都被认为是在确切时刻收到的——这些值的时间戳由服务器在收到时分配。有时，需要批量发送一段较长时间内的值，或者导入旧值的历史积压数据。这可以通过\
  \ `zabbix_sender` 轻松实现——当从文件发送值时，它支持提供时间戳。此时，输入文件中的值字段向右移动，时间戳作为第三个字段插入。为了快速测试，我们可以生成\
  \ 1 天、2 天和 3 天前的时间戳：\n\n```\nfor i in 1 2 3; do date -d \"-$i day\" \"+%s\"; done\n\
  ```\n\n取得生成的时间戳并在新的输入文件中使用：\n\n```\n- room.persons 1462745422 11\n\"A test host\"\
  \ room.persons 1462659022 12\n- room.persons 1462572622 13\n```\n\n使用名为 `sender_input_timestamps.txt`\
  \ 的文件，我们还需要使用 `-T` 标志来告诉 zabbix_sender 它应该期望其中包含时间戳：\n\n```bash\n$ zabbix_sender\
  \ -c /usr/local/etc/zabbix_agentd.conf -T -i /tmp/sender_input_timestamps.txt\n\
  ```\n\n所有三个值都应成功发送。\n\n> 当发送较长时间段内的值时，请确保该监控项的历史数据和趋势数据保留周期符合你的需求。否则，housekeeper\
  \ 进程可能会在较旧的值发送进来后不久将其删除。\n\n查看此监控项的图形或最新数据，可能会发现情况有些混乱。我们刚刚发送的带时间戳的值很可能与之前的值在时间上重叠。在大多数情况下，不建议对同一监控项既正常发送值又发送带时间戳的值。\n\
  \n> 如果 Zabbix trapper 监控项配置了触发器，则带时间戳的值只能以递增的时间戳发送。如果值以颠倒或混乱的新-旧-新顺序发送，生成的事件将毫无意义。\n\
  > \n> 如果为处于无数据维护中的主机发送数据，并且值的时间戳不在当前维护窗口内，这些值也会被丢弃。维护已在*第 5 章，管理主机、用户和权限*中讨论过。\n\
  \n## SSH 和 Telnet 监控项\n\n我们已经了解了许多相当自定义和可定制的方式将数据采集到 Zabbix 中。虽然外部检查应该允许我们以任何方式获取数据，但在某些情况下，我们可能需要从某个可通过\
  \ SSH 甚至 Telnet 访问的系统收集数据，但无法在其上安装 agent。在这种情况下，更高效的检索值的方法是使用内置的 SSH 或 Telnet 支持。\n\
  \n## SSH 监控项\n\n让我们首先了解 SSH 监控项。作为一个简单测试，我们可以重新实现我们第一个用户参数所做的相同 Zabbix agent 参数，即通过运行\
  \ `who | wc -l` 来确定当前登录用户数。为了尝试这一点，我们需要一个可用于运行该命令的用户账户，并且最好在“A test host”上创建一个单独的账户。创建账户可以像下面这样简单：\n\
  \n```\n# useradd -m -s /bin/bash zabbix test\n# passwd zabbix test\n```\n\n> 不要在生产系统中创建未经授权的用户账户。对于远程系统，请验证该用户是否被允许从\
  \ Zabbix 服务器登录。\n\n有了用户账户后，让我们创建 SSH 监控项。在前端，转到 配置 | 主机，点击 A test host 旁边的 监控项，然后点击\
  \ 创建监控项。填写以下内容：\n\n- **名称：** 登录用户数（SSH）\n- **类型：** SSH agent\n- **键值：** ssh.run[system.users]\n\
  - **用户名：** zabbix test（或你的测试账户的用户名）\n- **密码：** 填写该账户使用的密码\n- **执行的脚本：** who | wc\
  \ -l\n\n![](img/f5313a804532fabacc8d07cc8607eeba_452_0.png)\n\n> 用户名和密码将以明文形式保存在\
  \ Zabbix 数据库中。\n\n完成后，点击底部的 添加 按钮。对于键值，我们可以将 IP 地址和端口分别自定义为第二个和第三个参数。省略它们将使用默认端口\
  \ 22 和主机接口地址。监控项键的第一个参数只是一个唯一标识符。对于 SSH 监控项，键本身必须是 ssh.run，但第一个参数的工作方式类似于用户参数的整个键。在\
  \ 最新数据 页面中，我们的第一个 SSH 监控项应该正常工作并返回预期的值。这样，我们可以运行任意命令并获取返回值。\n\n> 在大多数情况下，建议使用用户参数而不是\
  \ SSH 检查——只有在无法在被监控系统上安装 Zabbix agent 时，才应该使用直接的 SSH 检查。\n\n我们刚刚创建的监控项使用直接提供的密码。我们也可以使用基于密钥的身份验证。为此，在监控项属性中，为\
  \ 身份验证方法 下拉框选择 公钥，并在 私钥文件 字段中填写包含私钥的文件名。虽然底层库在编译时使用 OpenSSL 时可以跳过公钥，但 Zabbix 目前要求在\
  \ 公钥文件 字段中指定公钥文件名。如果密钥受口令保护，则应在 密钥口令 字段中提供口令。但该文件应位于何处？检查 Zabbix 服务器配置文件并查找 SSHKeyLocation\
  \ 参数。默认情况下未设置，因此请将其设置为某个目录，并将私钥和公钥文件放置在那里。确保该目录和所有密钥文件仅对 Zabbix 用户可访问。\n\n> 在多个发行版（包括\
  \ Debian）中，默认情况下不支持加密或受口令保护的密钥。可能必须使用 OpenSSL 编译依赖库 libssh2 才能允许加密密钥。更多详情请参见 https://www.zabbix.com/documentation/3.0/manual/installation/known_issues#ssh_checks。\n\
  \n## Telnet 监控项\n\n对于既无法安装 Zabbix agent 也不支持 SSH 的设备，Zabbix 还提供了一种通过 Telnet 获取值的内置方法。由于\
  \ Telnet 是一种非常古老且不安全的协议，这可能是最不推荐的数据采集方法之一。\n\n\n\n\n\n## 高级监控项\n\nTelnet 监控项与 SSH\
  \ 监控项类似。最简单的监控项键语法如下：\n\n```\ntelnet.run[<unique_identifier>]\n```\n\n键本身是一个固定字符串，第一个参数是唯一标识符，与\
  \ SSH 监控项的用法相同。如果 IP 地址和端口与主机接口 IP 及默认 Telnet 端口（23）不同，则第二个和第三个参数分别是 IP 地址和端口。要运行的命令将放在**已执行脚本**字段中，同时还需要提供用户名和密码。\n\
  \n> 使用 Telnet 时，用户名和密码以明文传输。如有可能，请避免使用。\n\n对于登录提示符，Zabbix 会查找以 :（冒号）结尾的字符串。对于命令提示符，支持以下符号：\n\
  \n- `$`\n- `#`\n- `>`\n- `%`\n\n当命令返回时，字符串开头最多会去除这些符号中的一个。\n\n## 自定义模块\n\n除了前面介绍的所有方法之外，Zabbix\
  \ 还提供了一种编写可加载模块的方式。这些模块必须使用 C 语言编写，并且可以加载到 Zabbix agent、Zabbix server 和 Zabbix proxy\
  \ 守护进程中。当模块包含在 Zabbix agent 中时，从服务器的角度看，它们的行为与内置监控项或用户参数相同。当包含在 Zabbix server 或\
  \ proxy 中时，它们会显示为简单检查。\n\n必须使用 LoadModulePath 和 LoadModule 参数显式加载模块。我们不会在这里详细探讨模块，但有关模块\
  \ API 和其他详细信息，请访问 https://www.zabbix.com/documentation/3.0/manual/config/items/loadablemodules\
  \ 。\n\n## 12\n"
- "## 自动化配置\n\n到目前为止，我们主要通过添加主机、监控项、触发器和其他实体来完成 Zabbix 的手动配置。除了在第 8 章“使用模板简化复杂配置”中讨论的模板之外，我们还没有探讨如何适应更大规模、更动态的环境。在本章中，我们将学习如何自动发现资源，例如通过低级别自动发现（LLD）发现主机上的网络接口或文件系统，通过网络发现扫描子网，以及通过主动代理自动注册让主机自行注册。\n\
  \n在学习这些方法的同时，我们还将探索相关功能，例如全局正则表达式，并进一步了解我们已经掌握的功能的更多细节——包括用户宏的上下文。\n\n由于 Zabbix\
  \ 有几种管理自动实体配置的方式，而且这些方式的运作机制各不相同，强烈建议在谈论 Zabbix 时不要使用 auto-discovery（自动发现）这个术语——没有人能确定具体指的是哪个功能。相反，建议始终明确说明是低级别自动发现、网络发现，还是主动代理自动注册。\n\
  \n## 低级别自动发现\n\n目前，我们正在监控主机上的多个参数，包括网络流量。我们是通过查找接口名称，然后为所有相关监控项手动指定该名称来完成这些监控项的配置。不同系统的接口名称可能不同，每个系统上的接口数量也可能不同。文件系统、CPU\
  \ 和其他实体也可能存在类似情况。这些实体还可能发生变化——文件系统可能被挂载或卸载。Zabbix 提供了一项名为低级别自动发现（low-level discovery）的功能来应对这些不同且可能动态变化的配置。在\
  \ Zabbix 文档和社区中，该功能通常被称为 LLD，在本书中我们也这样称呼它。\n\n## 自动化配置\n\n低级别自动发现通常使我们能够发现现有主机上的实体（我们将在*第\
  \ 18 章“监控 VMware”*中讨论使用 LLD 发现主机的更高级功能）。LLD 是一种使用极其广泛的功能，几乎没有 Zabbix 用户不从中受益。LLD\
  \ 内置了多种方法，并且创建新方法也相当容易。可用的 LLD 方法有：\n\n- 网络接口（Zabbix agent）\n- 文件系统（Zabbix agent）\n\
  - CPU（Zabbix agent）\n- SNMP 表\n- ODBC 查询\n- 自定义 LLD\n\n我们将在*第 14 章“监控 Windows”*中讨论\
  \ Windows 服务发现。当需要监控的数据库数量较多时，ODBC 监控会有些繁琐，因此我们不会花太多时间讨论它，也不会在本书中介绍 ODBC LLD。有关它的官方文档，请参阅\
  \ `https://www.zabbix.com/documentation/3.0/manual/discovery/low_level_discovery#discovery_using_odbc_sql_queries`。\n\
  \n## 网络接口发现\n\n服务器上的网络接口看起来易于监控，但随着环境规模的扩大和时间的推移，它们往往会变得更加复杂。过去，我们有 `eth0`，大家都很满意。嗯，不是所有人——人们需要更多接口，所以出现了\
  \ `eth1`、`eth2`，依此类推。要手动将现有接口与 Zabbix 监控项匹配，以确保所有接口都被妥善监控，这本身已是一个挑战。后来，基于 Linux\
  \ 的系统改变了接口命名方案，现在可能会出现 `enp0s25` 或类似的名称，也可能是完全不同的接口名称。在大量不同系统上管理这些名称并不容易。Windows\
  \ 上的接口名称甚至更有趣——它们可能包含供应商、驱动程序、防病毒软件、防火墙软件以及其他各种内容的名称。过去，人们甚至编写 VB 脚本，试图在 Windows\
  \ 系统上创建假的 `eth0` 接口。\n\n幸运的是，LLD 应该能解决所有这些问题：它提供了一种内置方式来自动发现所有接口，并在每个接口上监控所需的监控项。Zabbix\
  \ agent 运行的大多数平台都支持该功能，包括 Linux、Windows、FreeBSD、OpenBSD、NetBSD、Solaris、AIX 和 HP-UX。下面来看看如何在受监控系统上自动发现所有接口。导航到**配置\
  \ | 模板**，点击 **C_Template_Linux** 旁边的**发现**。这一部分列出了 LLD 规则——目前我们还没有任何规则。在创建规则之前，了解一下\
  \ LLD 规则是什么，以及哪些其他实体对其起补充作用，可能会有所帮助。\n\n**发现规则**是一个配置实体，告诉 Zabbix 它应该发现什么。以网络接口为例，LLD\
  \ 规则会返回所有接口的列表。假设我们的系统有名为 `eth0` 和 `eth1` 的接口，LLD 规则就会返回一个包含它们的列表：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_459_0.png)\n\
  \n然后，LLD 规则包含原型。首先，需要监控项原型，不过 LLD 也允许我们添加触发器原型和自定义图形原型。原型到底是什么？我们在*第 8 章“使用模板简化复杂配置”*中讨论过模板。你可以将\
  \ LLD 原型视为迷你模板。它们影响的不是整个主机，而是主机上的监控项、触发器或自定义图形。例如，网络接口发现的监控项原型可以告诉 Zabbix，以相同的方式监控所有已发现接口的入站网络流量。\n\
  \n回到创建 LLD 规则的话题。在空白的 LLD 规则列表中，点击右上角的**创建发现规则**。填写以下内容：\n\n- **名称：** `Interface\
  \ discovery`\n- **键：** `net.if.discovery`\n- **更新间隔：** `120`\n\n![](img/f5313a804532fabacc8d07cc8607eeba_459_1.png)\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_461_0.png)\n\n系统提示，根据 LLD 监控项原型需要创建的监控项已经存在了。没错；之前我们手动为接口监控添加监控项时，正好创建了一个完全一样的监控项。\n\
  \n> 如果 LLD 规则试图创建已经存在的监控项，则发现过程会失败，并且不会创建任何监控项。\n\n和往常一样，监控项的唯一性由监控项键（包括所有参数）决定。遗憾的是，无法将手动配置的监控项与\
  \ LLD 生成的监控项合并，也没有简单的方法来保留已收集的历史数据。我们可以稍微更改现有监控项或监控项原型的键，并保留手动添加的监控项以作历史参考，等新的、由\
  \ LLD 生成的监控项收集到足够的历史数据后再将其删除。在这种情况下，我们可以对现有监控项的键稍作改动。导航到**配置 | 模板**，点击 **C_Template_Linux**\
  \ 旁边的**监控项**。在**名称**列中点击 **Incoming traffic on interface eth0**。在属性中，进行以下更改：\n\n\
  - **名称：** `Incoming traffic on interface $1 (manual)`\n- **键：** `net.if.in[enp0s8,]`\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_461_1.png)\n\n也就是说，在名称中添加 `(manual)`，并在方括号内添加一个尾部逗号。第一个更改并非严格必需，但它能让我们识别这些监控项。第二个更改在功能上不会带来任何变化——监控项仍然会收集完全相同的信息。不过，我们确实更改了监控项键。即使是这样一个小小的改动，也会使键发生变化，发现规则现在应该能够创建这些监控项了。完成后，点击**更新**。现在，对出站网络流量监控项和环回接口监控项进行相同的更改。\n\
  \n\n\n\n\n## 自动化配置\n\n这个技巧之所以有效，是因为监控项键值可以接受参数。对于不接受参数的监控项键值，无法通过添加空的方括号来表示无参数。\n\
  \n修改监控项键值之后，我们还可以自动监控出站流量。让我们进入 **配置 | 模板**，点击 **C_Template_Linux** 旁边的 **发现**，然后点击\
  \ **接口发现** 旁边的 **监控项原型**。点击 **{ #IFNAME } 上的入站流量**，然后点击 **克隆** 按钮。在 **名称** 字段中将\
  \ **入站** 改为 **出站**，并将 **键值** 字段改为 `net.if.out[{#IFNAME}]`。完成后，点击底部的 **添加** 按钮。\n\
  \n等待几分钟，然后返回 **配置 | 主机**。点击 **A test host** 旁边的 **发现**。错误图标应该消失了——如果没有，请检查此处提到的其他监控项，并对它们进行同样的修改。一旦此部分不再列出错误，请导航到\
  \ **配置 | 主机**，然后点击 **A test host** 旁边的 **监控项**。应该会有几个新监控项，它们都应该以 LLD 规则名称——接口发现——作为前缀：\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_462_0.png)\n\n点击发现规则名称将打开 LLD 规则中的原型列表。\n\
  \n创建的监控项数量取决于系统上的接口数量——每个接口应创建两个监控项。\n\n我们的第一条发现规则现在似乎运行良好；系统上的所有接口都已被发现，并且网络流量正在被监控。如果我们想监控每个接口上的其他参数，我们需要添加更多原型，在监控项键值参数中使用发现宏，以便创建的监控项具有唯一的键值。\n\
  \n让我们尝试改为通过 LLD 规则为每个接口创建一个计算监控项——进入 **配置 | 模板**，点击 **C_Template_Linux** 旁边的 **发现**，然后点击\
  \ **接口发现** 旁边的 **监控项原型**。然后，点击 **创建监控项原型**。填写以下值：\n\n- **名称：** `$1 上的总流量`\n- **类型：**\
  \ 计算\n- **键值：** `calc.net.if.total[{#IFNAME}]`\n- **公式：** `last(net.if.in[{#IFNAME}])+last(net.if.out[{#IFNAME}])`\n\
  - **单位：** B\n\n> 我们没有更改 **信息类型**，因为对于此处引用的网络流量监控项，我们有意将其保留为 **数字（无符号）**。如需提醒自己原因，请参阅\
  \ *第 3 章，使用 Zabbix 代理和基本协议进行监控*。\n\n完成后，点击底部的 **添加** 按钮。如果您查看最新数据页面，此监控项应在几分钟内开始收集数据。\n\
  \n> 计算监控项的键值是为了我们自己的方便。该键值不会以任何方式影响数据收集——数据收集完全由公式决定。\n\n但是，假设我们对总流量的非常详细的统计不那么感兴趣，而更关注长期趋势。我们可以修改刚刚创建的监控项，使其收集过去\
  \ 10 分钟内平均入站和出站流量的总和，并每 10 分钟执行一次。让我们返回 **配置 | 模板**，点击 **C_Template_Linux** 旁边的\
  \ **发现**，然后点击 **接口发现** 旁边的 **监控项原型**。然后，点击 **{ #IFNAME } 上的总流量**。修改以下四个字段：\n\n-\
  \ **名称：** `$1 上过去 10 分钟的总流量`\n- **键值：** `calc.net.if.total.10m[{#IFNAME}]`\n- **公式：**\
  \ `avg(net.if.in[{#IFNAME}],10m)+avg(net.if.out[{#IFNAME}],10m)`\n- **更新间隔：** `600`\n\
  \n> 在公式中，我们也可以使用 `600` 来代替 `10m`。\n\n完成后，点击底部的 **更新** 按钮。我们现在需要等待几分钟让发现规则再次运行，然后再等待最多\
  \ 10 分钟让此监控项获取新值。\n\n让我们讨论一下我们所做的更改。最重要的更改是 **公式** 更新。我们将两个监控项引用的 `last()` 函数都改为了\
  \ `avg()`。我们可以在计算监控项中使用任何触发器函数。我们还在逗号后为该函数提供了一个参数，这就是为什么我们必须在磁盘空间监控项中将监控项键值用双引号括起来的原因。被引用的键值包含逗号，而\
  \ Zabbix 可能会误解该逗号，将其视为将监控项键值与函数参数分隔的分隔符。\n\n> 可以通过添加更多逗号来指定其他参数。例如，在 `avg(net.if.in[{#IFNAME}],10m,1d)`\
  \ 中，`1d` 将是时间偏移，因为它是 `avg()` 触发器函数的第二个参数。更多关于触发器函数的内容，请参阅 *第 6 章，使用触发器检测问题*。\n>\
  \ \n> 如果我们只想在图形上显示总量，则无需创建监控项——堆叠图形可以做到这一点。我们在 *第 9 章，使用图形和地图可视化数据* 中讨论了堆叠图形。\n\n\
  总流量监控项应在最新数据中更新，以显示过去 10 分钟的平均总流量。通常，我们可能会为这些平均值使用更长的间隔，例如一小时，但 10 分钟能更快地为我们提供数据。这种方法也可以用于为某个监控项配置浮动平均值。例如，这样的公式可以计算\
  \ CPU 负载 6 小时的浮动平均值：\n\n```\navg(system.cpu.load,6h)\n```\n\n计算监控项不必引用多个监控项；它们也可以引用单个监控项并对其进行某种计算。这种浮动平均值可以用于更好的趋势预测，或通过将当前\
  \ CPU 负载值与浮动平均值进行比较来编写相对触发器。\n\n### 自动创建触发器\n\n为所有已发现的实体创建监控项很有用，但即使只是查看这些监控项也可能是一项相当繁重的任务。幸运的是，LLD\
  \ 也允许我们自动创建触发器。与监控项相同，这需要首先创建原型；实际的触发器将由发现过程稍后创建。\n\n要创建原型，请导航到 **配置 | 模板**，点击 **C_Template_Linux**\
  \ 旁边的 **发现**，然后点击 **触发器原型**。在右上角，点击 **创建触发器原型**，并按如下方式配置：\n\n- **名称：** {HOST.NAME}\
  \ 上的 {#IFNAME} 入站流量过高。\n- **表达式：** 点击此字段旁边的 **添加**。在弹出的窗口中，点击 **选择原型**，然后在 NAME\
  \ 列中点击 **{ #IFNAME } 上的入站流量**。点击 **插入** 并修改生成的表达式。将 `=0` 改为 `>5K`。这样，只要入站流量超过每秒\
  \ 5,000 字节，您就会收到警报，因为该监控项以每秒字节数收集数据。\n- **严重性：** 选择 **警告**。\n\n完成后，点击底部的 **添加**\
  \ 按钮。这是针对入站流量的；现在，让我们为出站流量创建一个原型。点击我们刚刚创建的原型的名称，然后点击 **克隆**。在新表单中，将 NAME 字段中的 **入站**\
  \ 改为 **出站**，并将 Expression 字段中的 `net.if.in` 改为 `net.if.out`，然后点击底部的 **添加** 按钮。两个原型都就位后，让我们进入\
  \ **配置 | 主机**，然后点击 **A test host** 旁边的 **触发器**。这里很可能已经有一些针对入站流量的新触发器——我们先创建了那个原型，所以发现过程可能已经有时间处理它了。不过，所有由\
  \ LLD 创建的触发器最多只需几分钟就会显示出来。请务必手动刷新页面以查看任何更改——配置页面不会像监控页面那样自动刷新：\n\n| 严重性 | 触发器 |\
  \ 表达式 |\n|---|---|---|\n| 警告 | 接口发现：{HOST.NAME} 上 enp0s3 的入站流量过高 | {A test host:net.if.in[enp0s3].last()}>5K\
  \ |\n| 警告 | 接口发现：{HOST.NAME} 上 enp0s8 的入站流量过高 | {A test host:net.if.in[enp0s8].last()}>5K\
  \ |\n| 警告 | 接口发现：{HOST.NAME} 上 lo 的入站流量过高 | {A test host:net.if.in[lo].last()}>5K\
  \ |\n\n与监控项相同，触发器以 LLD 规则名称作为前缀。请注意，每个接口的每个原型都会生成一个触发器，这与监控项的情况相同。{#IFNAME} LLD\
  \ 宏也被接口名称替换了。请注意，我们不必担心如何使创建的触发器保持唯一——我们必须在触发器中引用监控项键值，而该键值已经包含了适当的 LLD 宏。\n\n我们这里选择的阈值非常低——即使在我们的小型测试系统上也很可能触发。如果我们有各种不同的系统，并且希望每个系统有不同的阈值，该怎么办？我们之前讨论过的用户宏概念可以在这里派上用场。我们可以在触发器表达式中使用用户宏而不是硬编码值，并在特定主机上根据需要覆盖它。我们在\
  \ *第 8 章，使用模板简化复杂配置* 中讨论了用户宏。\n\n\n\n\n\n## 过滤发现结果\n\n查看已创建的项目、触发器和图表，除了真实接口外，回环接口也被发现了，并且为其创建了所有这些实体。在某些情况下，监控该接口也可能有用，但对于大多数系统来说，这类数据并无用处。\n\
  \n如果我们查看配置中的项目列表，由 LLD 生成的项目旁边有复选框被禁用，我们也不能点击它们直接编辑属性。**STATUS** 列中的控件允许我们单独启用或禁用它们。不过，主机上的\
  \ LLD 生成项目无法编辑，只能禁用或启用。请注意，在前端，这只能逐个对每个项目进行操作——我们无法使用批量更新，因为复选框是禁用的。\n\n在许多主机上禁用\
  \ LLD 生成的项目可能是一项庞大的手动任务。我们可以考虑禁用原型，但这行不通，原因有两个。首先，我们只想禁用回环接口的项目，但同一个原型用于所有接口上的项目。其次，原型中的状态更改不会传播到生成的项目中。这些项目在创建时的初始状态——启用或禁用——会一直保留。\n\
  \n那么其他对这些项目的更改呢，比如更改项目键或其他属性？这些更改会被向下传播，但仅当发现是由 Zabbix 服务器运行的时候，而不是我们在前端对原型进行更改时。实际上，这意味着我们必须等待最多\
  \ LLD 规则间隔，才能看到这些更改在下游应用。\n\n幸运的是，有一种方法可以轻松避免为某些发现的实体创建项目，例如在我们的案例中：不为回环接口创建项目。这可以通过在\
  \ LLD 规则级别上过滤实体的 LLD 返回来实现。让我们更改现有的规则以忽略名称为 lo 的接口。\n\n> 如果我们想保留 LLD 生成的项目但禁用或启用其中几个，在某些情况下，这可能值得通过\
  \ Zabbix API 来完成——我们将在 *第 21 章，紧密协作数据* 中简要介绍 API。\n\n![](img/f5313a804532fabacc8d07cc8607eeba_467_0.png)\n\
  \n## 自动化配置\n\n导航到 **Configuration | Templates**，并点击 **C_Template_Linux** 旁边的 **Discovery**。然后，在\
  \ NAME 列中点击 **Interface discovery**。注意这里还有另一个标签页：**Filters**。切换到该标签页，并在第一个也是唯一一个\
  \ **Filters** 条目中填写以下内容：\n\n- **MACRO:** `{#IFNAME}`\n- **REGULAR EXPRESSION:**\
  \ `^([^1].*|[^lo].+)$`\n\n![](img/f5313a804532fabacc8d07cc8607eeba_468_0.png)\n\n\
  完成后，点击 **Update**。LLD 过滤器通过只返回匹配的条目来工作。在本例中，我们想排除条目 `lo` 并保留其他所有内容。不幸的是，Zabbix 守护进程仅支持\
  \ POSIX 扩展正则表达式——在这种风格中，否定一个字符串相当复杂。我们使用的过滤器将排除 `lo` 但匹配其他所有内容——包括 `eth0`、`enp0s8`\
  \ 和 `loop0`。\n\n> \U0001F4A1 我们将在本章后面探索一种更简单的方式来否定字符串。\n\n要查看是否生效，导航到 **Configuration\
  \ | Hosts** 并点击 **A test host** 旁边的 **Items**。在列表中，注意到两个 `lo` 接口项目在 **INFO** 列中都有一个带有感叹号的橙色图标。如果你将鼠标光标移至其上，会有一条消息解释该项目不再被发现，并将在稍后某个时间被删除：\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_468_1.png)\n\n在本例中，该项目未被发现是因为它被过滤器排除了，但原因并不重要——也可能是接口被移除或名称被更改。但为什么它会在那个特定时间后被移除，大约\
  \ 29 天多一点？如果我们再次查看 LLD 规则的属性，会有一个名为 **Keep lost resources period** 的字段：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_469_0.png)\n\
  \n在这里，我们可以指定当它们不再被发现时项目将被保留多长时间，默认值为 30 天。工具提示友好地告诉我们项目将在何时被删除以及确切的删除时间。其他实体，包括触发器和自定义图表，只要底层项目被保留，就会一直被保留。\n\
  \n> LLD 规则仅在获得新数据时才会被评估。如果规则停止获取数据，项目会提示它们应该被删除，但它们不会在规则获取新数据并被评估之前被删除。\n\n现在，导航到\
  \ **Monitoring | Latest data**，并点击 **Incoming traffic on lo** 的 **Graph**。等待一段时间，注意到已安排删除的项目仍在继续收集数据。当我们最初在设备上监控了大量内容、使其过载，然后应用过滤希望改善情况时，这可能是不可取的。无法直接控制这一点，但我们可以暂时将资源保留时间设为\
  \ 0，这样在 LLD 规则下一次运行时，未再被发现的项目将被移除。在 LLD 规则属性中，将该字段的值设为 0 并点击 **Update**。几分钟后，检查\
  \ **A test host** 在配置中的项目列表——两个自动的 lo 接口项目现在应该都不见了。\n\n如果我们希望为不同的发现实体拥有不同的项目集，例如对具有特定名称的接口进行更多监控呢？遗憾的是，这并不容易实现。一种方法是通过创建两个不同的\
  \ LLD 规则并使用不同的项目原型，然后在其中一个 LLD 规则中过滤一组实体，在另一个 LLD 规则中过滤另一组实体。尽管如此，这比预期更复杂。LLD 规则具有与项目相同的唯一性标准：键。对于某些项目，我们可以使用一个小技巧，让一个项目的键称为\
  \ key，另一个项目的键为 key[ ]。指定空方括号表示空参数，但功能上项目完全相同。不幸的是，agent LLD 键不接受参数，因此此技巧行不通。一个变通方法是在项目键上指定别名——我们将在\
  \ *第 22 章，Zabbix 维护* 中讨论如何做到这一点。\n\n## 文件系统发现\n\n我们发现 Zabbix agent 内置了发现网络接口的支持。它还可以发现其他事物，其中最受欢迎的是文件系统。在配置之前，让我们先了解一下此类功能能带来什么。\n\
  \n## 介绍 LLD JSON 格式\n\n发现不仅在前端看起来有点像项目；在其底层也以相同的方式运行。魔术基于特定项目值的內容。所有找到的事物都编码在 JSON\
  \ 结构中。查看返回内容最简单的方法是使用 `zabbix_get` 查询 Zabbix agent。在测试主机上运行此命令：\n\n```\n```bash\n\
  $ zabbix_get -s 127.0.0.1 -k net.if.discovery\n```\n```\n\n这里，`net.if.discovery`\
  \ 只是一个项目键，与其他项目键没有区别。这将返回一个小字符串，类似于以下内容：\n\n```\n```json\n{data:[{{#IFNAME}:enp0s3},{{#IFNAME}:enp0s8},{{#IFNAME}:lo}]}\n\
  ```\n```\n\n虽然大多可以理解，但如果有格式会更好。最简单的方法是使用 Perl 或 Python 工具。Python 方法是：\n\n```\n```bash\n\
  $ zabbix_get -s 127.0.0.1 -k net.if.discovery | python -mjson.tool\n```\n```\n\n\
  Perl 方法是以下其中一种：\n\n```\n```bash\n$ zabbix_get -s 127.0.0.1 -k net.if.discovery |\
  \ json_pp\n$ zabbix_get -s 127.0.0.1 -k net.if.discovery | json_xs\n```\n```\n\n\
  后一种方法应该更快，但需要 JSON::XS Perl 模块。对于我们的目的，性能不应成为问题，因此选择你能用的方法即可。输出将类似于：\n\n```\n```json\n\
  {\n    data : [\n        {\n            {#IFNAME} : enp0s3\n        },\n       \
  \ {\n            {#IFNAME} : enp0s8\n        },\n        {\n            {#IFNAME}\
  \ : lo\n        }\n    ]\n}\n```\n```\n\n\n\n\n\n接口的数量及其名称可能会有所不同，但我们可以看出，对于每个找到的接口，我们返回一个宏：接口名称。文件系统发现的键类似：`vfs.fs.discovery`。我们现在可以运行这个：\n\
  \n```\n$ zabbix_get -s 127.0.0.1 -k vfs.fs.discovery | json_pp\n```\n\n这很可能会返回大量条目。以下是片段：\n\
  \n```\n{\n    data : [\n        {\n            {#FSNAME} : /dev/pts,\n         \
  \   {#FSTYPE} : devpts\n        },\n        {\n            {#FSNAME} : /,\n    \
  \        {#FSTYPE} : ext3\n        },\n        {\n            {#FSNAME} : /proc,\n\
  \            {#FSTYPE} : proc\n        },\n        {\n            {#FSNAME} : /sys,\n\
  \            {#FSTYPE} : sysfs\n        }\n        ...\n```\n\n这里可以看到两件事：一，它返回的结果肯定远多于我们想要监控的。二，它为每个文件系统返回两个值：名称和类型。虽然我们可以通过文件系统名称进行过滤，但某些被监控系统可能只有根文件系统，某些可能有单独的\
  \ `/home`，等等。最好的方式是按文件系统类型进行过滤。在此示例中，我们只想监控类型为 `ext3` 的文件系统。掌握了这些知识后，让我们导航到 **Configuration\
  \ | Templates**，点击 **C_Template_Linux** 旁边的 **Discovery**，然后点击 **Create discovery\
  \ rule**。填写以下值：\n\n- **Name:** `Filesystem discovery`\n- **Key:** `vfs.fs.discovery`\n\
  - **Update interval:** `120`\n\n## Automating Configuration\n\n与网络接口发现一样，我们将更新间隔设置为\
  \ 120。表单中的默认值 30 秒非常低，不应使用。发现操作可能资源密集，如果可能，应每小时运行一次左右。现在，切换到 **Filters** 选项卡，并填写以下值：\n\
  \n- **Macro:** `{$FSTYPE}`\n- **Regular expression:** `^ext3$`\n\n> 用你系统上使用的文件系统类型替换。多个文件系统类型也可以被接受，像这样：`^ext3|ext4$`。\n\
  \n完成后，点击底部的 **Add** 按钮。我们现在有了发现规则，但没有原型。点击 **Filesystem discovery** 旁边的 **Item prototypes**，然后点击\
  \ **Create item prototype**。填写以下内容：\n\n- **Name:** `Free space on {$FSNAME}`\n-\
  \ **Key:** `vfs.fs.size[{$FSNAME},free]`\n\n完成后，点击底部的 **Add** 按钮。我们现在期望发现获取所有文件系统的列表，丢弃除类型恰好为\
  \ ext3 的那些之外的所有文件系统，然后为每个文件系统创建一个可用磁盘空间项。我们按一个 LLD 宏 `{$FSTYPE}` 进行过滤，但在实际的项配置中使用另一个宏\
  \ — `{$FSNAME}`。等待几分钟后，导航到 **Configuration | Hosts** 并点击 **A test host** 旁边的 **Items**。对于每个类型为\
  \ ext3 的文件系统，都应该有一个可用磁盘空间项：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_472_0.png)\n\
  \n有了更多原型，我们也可以监控总空间、inode 统计和其他数据。我们可以根据需要为所有这些文件系统设置触发器。\n\n由于此发现返回多个宏，同时按多个宏进行过滤可能是可取的。例如，我们可能希望排除\
  \ `/boot` 文件系统不被监控。与 *Chapter 7, Acting upon Monitored Conditions* 中讨论的动作条件中的计算类型类似，我们可以在\
  \ **And**、**Or** 和 **And/Or** 之间选择自动选项——还有 **Custom expression** 选项。这应该允许我们创建不同复杂度的发现逻辑。\n\
  \n## Including discovered graphs in screens\n\n当我们用普通图表配置屏幕时，我们只需选择应包含在屏幕中的图表。对于\
  \ LLD 生成的图表，情况变得更复杂——我们永远无法确定每个主机可能有多少个图表。幸运的是，Zabbix 允许我们以自动计算发现实体数量的方式包含 LLD 生成的图表。要尝试此功能，让我们前往\
  \ **Monitoring | Screens**，进入屏幕列表，并点击 **Local servers** 旁边的 **Constructor**。点击左下角的\
  \ + 图标在此处添加另一行，然后点击左下角的 **Change**。在 **Resource** 下拉菜单中，选择 **Graph prototype**。点击\
  \ **Graph prototype** 字段旁边的 **Select**。在弹出窗口中，在 **Group** 下拉菜单中选择 **Linux servers**，在\
  \ **Host** 下拉菜单中选择 **A test host**，然后点击 **NAME** 列中的 **Traffic on {#IFNAME}**。在\
  \ **Width** 字段中输入 `400`。\n\n![](img/f5313a804532fabacc8d07cc8607eeba_473_0.png)\n\
  \n点击 **Add**。注意此单元格在屏幕配置中似乎没有多大用处——没有数据显示，标题只是 **Traffic on {#IFNAME}**。让我们在监控视图中检查此屏幕，看看是否更好。\n\
  \n根据系统拥有的网络接口数量，屏幕的左下角将有不同数量的图表。如果只有一个接口（不包括 lo），屏幕看起来会不错。如果有更多，所有图表都将被显示，但它们会被塞进一个单元格中，使屏幕布局不那么美观：\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_474_0.png)\n\n> 我们没有为此屏幕元素设置 Dynamic\
  \ item。当在监控部分更改主机选择时，这些图表始终显示 A test host 的数据。我们在 Chapter 10, Visualizing the Data\
  \ with Screens and Slideshows 中更详细地讨论了屏幕配置。\n\n为了改进这一点，返回 Local servers 屏幕的构造器并点击左下角的\
  \ Change 链接。将 Column span 更改为 2。我们的屏幕有两列，因此网络接口图表现在将使用全屏宽度。此外，查看 Max columns 字段：默认情况下它设置为\
  \ 3。如果你的系统发现了三个或更多网络接口，图表将占用三列的宽度，而不是两列，再次破坏屏幕布局。让我们将其设置为 2。完成后，点击 Update，然后再次在监控视图中检查屏幕：\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_475_0.png)\n\n> 使用 avg() 或 max() 等触发器函数可能是一个好主意，以避免触发器抖动，如\
  \ Chapter 6, Detecting Problems with Triggers 中所讨论的。\n\n这将对任何可用磁盘空间少于 20% 或利用率超过\
  \ 80% 的文件系统发出警报。我们可以重写它以使用用户宏作为阈值：\n\n```\n{C_Template_Linux:vfs.fs.size[{#FSNAME},free].last()}<{$FS_FREE_THRESHOLD}\n\
  ```\n\n这将允许我们按主机自定义阈值，但不能按文件系统自定义。在此基础上扩展，我们将指示 LLD 规则将发现的文件系统作为宏上下文，像这样：\n\n```\n\
  {C_Template_Linux:vfs.fs.size[{#FSNAME},free].last()}<{$FS_FREE_THRESHOLD:{#FSNAME}}\n\
  ```\n\n当 LLD 原型被处理时，LLD 宏会被发现的值替换为创建的项中。对于将在主机上创建的根文件系统的触发器，其外观如下：\n\n```\n{A test\
  \ host:vfs.fs.size[{#FSNAME},free].last()}<{$FS_FREE_THRESHOLD:/}\n```\n\n对于 /home\
  \ 文件系统的触发器，其外观如下：\n\n```\n{A test host:vfs.fs.size[{#FSNAME},free].last()}<{$FS_FREE_THRESHOLD:/home}\n\
  ```\n\n当 Zabbix 评估此触发器时，它会首先在主机上查找具有此上下文值的宏。如果未找到，它将查找链接模板中具有此上下文的宏。如果在那里也找不到，它将查找具有此类上下文的全局宏。如果仍然找不到，它将回退到没有上下文的宏并将其作为普通用户宏进行评估。这意味着我们不必为所有可能的上下文值定义用户宏——只需在我们想要修改行为的那些值即可。如果某个文件系统没有可用的特定用户宏，始终可以回退到主机、模板或全局宏。\n\
  \n\n\n\n\n## 自动化配置\n\n这个功能非常实用，但要把它解释清楚似乎比较复杂，因此这里用一张示意图来说明。在没有上下文的情况下，用户宏会按照右栏所示的方式求值——即先检查主机级别，然后是模板，最后是全局。在有上下文的情况下也是如此——只是会先在所有三个级别中查找带上下文的宏名称，然后我们再回退到不带上下文的宏名称，同样在所有三个级别中查找。最先找到匹配项的位置将决定该宏的值。\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_478_0.png)\n\n在触发器中使用时，这个功能允许我们为不同的文件系统设置不同的阈值——并且还可以按主机进行定制。我们可以让用户宏\
  \ {$FS_FREE_THRESHOLD:/home} 在一台主机上设为 20，在另一台主机上设为 30，依此类推。\n\n当然，这不仅限于触发器——在支持用户宏的所有位置都可以使用，包括监控项键参数和触发器函数参数。一个触发器可以在一台系统上检查\
  \ 5 分钟内的平均温度，而在另一台系统上检查 15 分钟内的平均温度。\n\n## CPU 发现\n\nZabbix agent 支持的另一种发现方法是 **CPU\
  \ 发现**。它会返回系统上所有的 CPU（或核心）。现在我们已经知道如何获取 LLD JSON，只需要知道哪个监控项键用于返回 CPU 信息——那就是 `system.cpu.discovery`。在测试主机上运行以下命令：\n\
  \n```\n$ zabbix_get -s 127.0.0.1 -k system.cpu.discovery | json_pp\n```\n\n导航到“配置\
  \ | 主机”，在之前为其创建了 SNMP 监控项的主机旁边点击“发现”，然后点击“创建发现规则”。填写以下字段：\n\n- 名称：SNMP 接口发现\n- 类型：SNMPv2\
  \ agent（或选择其他受支持的 SNMP 版本）\n- 键：snmp.interface.discovery\n- SNMP OID：discovery[{#IFDESCR},\
  \ IF-MIB::ifDescr]\n- 更新间隔：120\n\n![](img/f5313a804532fabacc8d07cc8607eeba_480_0.png)\n\
  \n> 2.4 之前的 Zabbix 版本使用不同的 SNMP OID 语法来定义 LLD 规则。升级 Zabbix 会将语法改为当前版本，但导入旧模板时仍会使用旧语法，这在\
  \ Zabbix 2.4 及更高版本中会失败。目前尚不清楚哪个 Zabbix 版本能够修复此问题。\n\n完成后，点击底部的添加按钮。发现过程本身与之前创建的内容非常相似，只有一个例外：SNMP\
  \ OID 的值。对于 SNMP LLD，我们定义宏名称和要发现的 OID 表。在这种情况下，Zabbix 会查看 IF-MIB::ifDescr 表中的所有单独值，并将它们分配给\
  \ {#IFDESCR} 宏，也就是我们刚刚在 SNMP OID 字段中指定的名称。除了我们指定的宏之外，Zabbix 还会为每个找到的实体添加一个额外的宏：{#SNMPINDEX}。稍后我们将看到，这在创建监控项原型时非常有用。\n\
  \n要创建一些原型，请在新发现规则旁边点击**监控项原型**，然后点击**创建监控项原型**。填写以下内容：\n\n- **名称：** `Incoming traffic\
  \ on interface $1 (SNMP LLD)`\n- **类型：** **SNMPv2 agent**\n- **键：** `lld.ifInOctets[{#IFDESCR}]`\n\
  - **SNMP OID：** `IF-MIB::ifInOctets.{#SNMPINDEX}`\n- **单位：** `Bps`\n- **存储值：** **增量（每秒速率）**\n\
  \n完成后，点击底部的**添加**按钮。\n\n注意，我们在监控项键前添加了 `lld` 前缀——这样它就不会与我们之前手动创建的监控项冲突。至于 SNMP OID，我们使用了内置的\
  \ `{#SNMPINDEX}` 宏，它应该能唯一标识 SNMP 表中的值。如果我们手动添加这样的监控项，就需要找出所需接口的正确索引，然后直接使用该数字。以上是传入流量的情况——为了更完整，请点击**名称**列中的**接口\
  \ {#IFDESCR} 上的传入流量（SNMP LLD）**，然后点击底部的**克隆**按钮。在“名称”字段中，将 Incoming 改为 Outgoing。在“键”和“SNMP\
  \ OID”字段中，都将 In 改为 Out，使 OID 变为 ifOutOctets。完成后，点击底部的**添加**按钮。导航到**配置 | 主机**，并点击刚才操作的主机旁边的**监控项**。几分钟后，这里应该会根据这两个原型出现新的监控项。由于这是一个配置页面，请确保经常刷新，否则更改将不可见。\n\
  \n> 如果过了较长时间监控项仍未显示，请转到该主机的发现列表并检查 INFO 列——那里可能会列出错误信息。\n\n很可能回环接口也会出现在列表中——我们没有为这条\
  \ LLD 规则应用任何过滤：\n\n| SNMP 接口发现：接口 enp0s3 上的传入流量（SNMP LLD） | lld.ifInOctets[enp0s3]\
  \ |\n| SNMP 接口发现：接口 lo 上的传入流量（SNMP LLD） | lld.ifInOctets[lo] |\n| SNMP 接口发现：接口 enp0s8\
  \ 上的传入流量（SNMP LLD） | lld.ifInOctets[enp0s8] |\n\n## 自动化配置\n\n和之前一样，我们来为这些监控项创建一个图形原型。点击监控项列表上方导航栏中的**发现规则**，点击\
  \ **SNMP 接口发现**旁边的**图形原型**，然后点击**创建图形原型**按钮。在**名称**字段中输入 `Traffic on {#IFDESCR}\
  \ (SNMP)`。在**监控项**部分点击**添加原型**，勾选两个原型旁边的复选框，然后点击**选择**。点击底部的**添加**按钮。几分钟后，如果查看该主机配置部分的图形列表，应该会为每个接口出现一个新图形。\n\
  \n`ifDescr` OID 通常就是接口名称。使用 `ifAlias` OID 来提供更友好的描述也很常见。我们可以将发现规则改为使用 `ifAlias`\
  \ 而不是 `ifDescr`，但并非所有系统上的所有接口都会有可用的 `ifAlias` 值，而且我们可能仍然想知道 `ifDescr` 值。Zabbix 也可以在一个\
  \ LLD 规则中发现多个 OID。让我们回到该主机的发现规则配置，点击**名称**列中的 **SNMP 接口发现**。将 **SNMP OID** 字段修改为：\n\
  \n```\ndiscovery[{#IFDESCR}, IF-MIB::ifDescr, {#IFALIAS}, IF-MIB::ifAlias]\n```\n\
  \n更多的 OID 以额外参数的形式添加，其中宏名称后面总是跟着 OID。如果需要，我们还可以添加更多 OID：\n\n```\nkey[{#MACRO1},\
  \ MIB::OID1, {#MACRO2}, MIB::OID2, {#MACROn}, MIB::OIDn]\n```\n\n不过在这种情况下，`ifAlias`\
  \ 应该就足够了。点击底部的**更新**按钮，然后点击 **SNMP 接口发现**条目旁边的**图形原型**。点击**名称**列中的 **{#IFDESCR}\
  \ 上的流量（SNMP）**，并修改这个图形原型的名称：\n\n```\nTraffic on {#IFDESCR} ({#IFALIAS}) (SNMP)\n\
  ```\n\n这样，如果某个接口设置了 `ifAlias`，它就会包含在图形名称中。我们仍然保留 `ifDescr` 值，因为它是唯一的接口标识符，而且有些接口的\
  \ `ifAlias` OID 可能没有返回值。让我们进入该主机的图形配置。几分钟后，图形名称应该会更新，括号中会包含 `ifAlias`。\n\n> 如果你正在监控运行\
  \ Net-SNMP 守护进程的 Linux 系统，`ifAlias` 很可能是空的。\n\n这种方法还提供了一种只监控选定接口的简便方式。如果你有大量网络设备，而只需要监控少数选定的端口，可以在设备上更改这些端口的描述——例如，它们都可以加上\
  \ zbx 前缀。这将显示在 ifAlias OID 中，我们可以在 LLD 规则属性中按 {#IFALIAS} 宏进行过滤。\n\n> 宏名称是用户可配置的，在不同的\
  \ Zabbix 安装环境中可能会有所不同。只有内置的 {#SNMPINDEX} 宏始终具有相同的名称。\n\n## 创建自定义 LLD 规则\n\n内置的低级别发现支持非常适合发现文件系统、网络接口、CPU\
  \ 和其他实体。但如果我们有一些自定义软件，想用它来发现组件，或者某个系统上运行的 Zabbix agent 版本较旧，尚不支持某种特定类型的发现，那该怎么办？LLD\
  \ 的妙处在于，我们可以非常轻松地用自己的发现规则对其进行扩展。让我们来看两个例子：\n\n- 在 Linux 上重新实现 CPU 发现\n- 发现 MySQL\
  \ 数据库\n\n> LLD 规则永远不会返回监控项的值。它发现的是允许根据原型创建监控项的实体。监控项从 agent、SNMP 设备、使用 zabbix_sender\
  \ 或任何其他数据收集方法获取值。\n\n## 重新实现 CPU 发现\n\n首先，让我们尝试做一件在最近的 Zabbix agent 中已经可用的事情——发现\
  \ CPU。我们这样做，一方面是因为如果你有某个系统运行旧版 agent，它可能会很有用；另一方面是因为它展示了 LLD 有时可以多么简单。为此，让我们考虑以下脚本：\n\
  \n```\nfor cpu in $(ls -d /sys/devices/system/cpu/cpu[0-9]*/); do\n  cpui=${cpu#/sys/devices/system/cpu/cpu}\n\
  \  [[ $(cat ${cpu}/online 2>/dev/null) == 1 || ! -f ${cpu}/online ]] &&\n  status=online\
  \ || status=offline;\n  cpulist=$cpulist,'{#CPU.NUMBER}: '${cpui$/' ',\n  {#CPU.STATUS}:\
  \ '$status'}'\ndone\necho '{data: ['${cpulist#, }']}'\n```\n\n\n\n\n\n它依赖于 `/sys/devices/system/cpu/`\
  \ 为每个 CPU 保留一个目录，命名为 `cpu`，后跟 CPU 编号。在这些目录中的每一个里，我们查找 online 文件——如果该文件存在，我们检查其内容。如果内容为\
  \ 1，则认为 CPU 为在线状态；如果为其他内容——则为离线。在某些情况下，更改 CPU0 的在线状态可能不被允许——此时该文件会缺失，我们会将其解释为 CPU\
  \ 处于在线状态。然后我们附加 `{#CPU.NUMBER}` 和 `{#CPU.STATUS}` 宏并赋予适当的值，最终将其全部打印出来，包装在 LLD 数据数组中。现在让我们将其用作用户参数。\n\
  \n> 我们在第 11 章《高级项监控》中探讨了用户参数。\n\n我们将全部在一行中拼接，因为此命令不需要包装脚本。在 A test host 上的 Zabbix\
  \ agent daemon 配置文件中，添加以下内容：\n\n```\nUserParameter=reimplementing.cpu.discovery,for\
  \ cpu in $(ls -d /sys/devices/system/cpu/cpu[0-9]*/); do cpui=${cpu#/sys/devices/system/cpu/cpu};\
  \ [[ $(cat ${cpu}/online 2>/dev/null) == 1 || ! -f ${cpu}/online ]] && status=online\
  \ || status=offline; cpulist=$cpulist,'{\"{#CPU.NUMBER}\":\"'${cpui%/*}'\",\"{#CPU.STATUS}\"\
  :\"'$status'\"}' ; done; echo '{\"data\":['${cpulist#,}']}'\n```\n\n> 对于更复杂的情况或生产环境实现，请考虑使用适当的\
  \ JSON 实现，例如 JSON::XS Perl 模块。\n\n重启 agent daemon，并在同一系统上运行以下命令：\n\n```\n$ zabbix_get\
  \ -s 127.0.0.1 -k reimplementing.cpu.discovery\n```\n\n在四核系统上，它会返回类似如下内容：\n\n```\n\
  {\"data\":[{\"{#CPU.NUMBER}\":\"0\",\"{#CPU.STATUS}\":\"online\"},{\"{#CPU.NUMBER}\"\
  :\"1\",\"{#CPU.STATUS}\":\"online\"},{\"{#CPU.NUMBER}\":\"2\",\"{#CPU.STATUS}\"\
  :\"offline\"},{\"{#CPU.NUMBER}\":\"3\",\"{#CPU.STATUS}\":\"online\"}]}\n```\n\n\
  > 你可以使用 Perl 或 Python 重新格式化 JSON 以提高可读性——我们在本章前面已经做过。\n\n我们现在可以像使用内置项一样以相同的方式将此项键用于\
  \ LLD 规则。项原型将完全以相同的方式工作，我们甚至不需要使用不同的 LLD 宏。\n\n完成后，点击底部的 Add 按钮。对于此项，我们使用了 active\
  \ agent，因为这对于用户参数是建议的，并且我们还将更新间隔设置为 5 分钟——通常数据库大小不会变化那么快，我们更感兴趣的是长期趋势。我们现在有了该项，它将是一个\
  \ UserParameter 变量，而该项又将由 Zabbix sender 填充的 LLD 规则创建。让我们现在设置 UserParameter 变量。在\
  \ A test host 的 Zabbix agent daemon 配置文件中，添加以下内容：\n\n```\nUserParameter=mysql.db.size[*],HOME=/home/zabbix\
  \ mysql -Ne select sum(data_length+index_length) from information_schema.tables\
  \ where table_schema='$1';\n```\n\n此 UserParameter 变量将查询总数据库大小，包括实际数据和所有索引。注意我们再次设置了\
  \ HOME 变量。保存文件后不要忘记重启 agent daemon。最好立即进行测试：\n\n```\n$ zabbix_get -s 127.0.0.1 -k\
  \ mysql.db.size[zabbix]\n```\n\n这很可能会返回某个数字：\n\n```\n147865600\n```\n\n如果失败，请重新检查我们在第\
  \ 11 章《高级项监控》中使用的 MySQL 参数配置。\n\n![](img/f5313a804532fabacc8d07cc8607eeba_486_0.png)\n\
  \n> 注意返回此值需要一些时间。对于大型数据库，使用 Zabbix Sender 来处理此类项可能是一个更好的主意。\n\n在 LLD 规则和项原型就位后，让我们开始发送用于发现的\
  \ JSON。以下内容应发现当前用户可访问的所有数据库并为 Zabbix 生成 LLD JSON：\n\n```\nfor db in $(mysql -u zabbix\
  \ -Ne show databases); do\n  dblist=$dblist,'{\"{#MYSQL.DBNAME}\":\"'$db'\"}'\n\
  done\necho '{\"data\":['${dblist#,}']}'\n```\n\n![](img/f5313a804532fabacc8d07cc8607eeba_486_1.png)\n\
  \n> 我们正在删除 JSON 数据库列表中的尾随逗号——JSON 不允许尾随逗号，包含它会导致发现失败。Zabbix 会抱怨传入的数据不是有效的 JSON。\n\
  \n这里的原理与之前的 CPU 发现重新实现类似：我们找到所有数据库并在正确的宏名称后将它们列在 JSON 中。它应返回类似以下的行：\n\n```\n{\"\
  data\":[{\"{#MYSQL.DBNAME}\":\"information_schema\"},{\"{#MYSQL.DBNAME}\":\"zabbix\"\
  }]}\n```\n\n现在让我们将其实际发送到我们的 LLD 规则——我们将为此使用 Zabbix Sender。\n\n如果你测试过此操作从而修改了 dblist\
  \ 变量，请在运行以下命令前执行 `unset dblist`：\n\n```\n$ zabbix_sender -z 127.0.0.1 -s \"A test\
  \ host\" -k mysql.db.discovery -o $(for db in $(mysql -u zabbix -Ne show databases);\
  \ do dblist=$dblist,'{\"{#MYSQL.DBNAME}\":\"'$db'\"}'; done; echo '{\"data\":['${dblist#,}']}')\n\
  ```\n\n> 此命令应以 Zabbix agent daemon 运行的用户身份运行；否则，它可能会包含 Zabbix 用户无权限的数据库，并且此类项将变得不受支持。\n\
  \n在配置中访问 A test host 的项列表应显示为每个数据库创建了一个项：\n\n| Item | Key |\n| --- | --- |\n| MySQL\
  \ database discovery: Database information_schema size | `mysql.db.size[information_schema]`\
  \ |\n| MySQL database discovery: Database zabbix size | `mysql.db.size[zabbix]`\
  \ |\n\n首次值出现在 Latest data 页面可能需要长达 3 分钟——首先，最长一分钟用于配置缓存刷新，然后，最长两分钟用于 active agent\
  \ 从服务器更新其配置。\n\n> 还请记住，规则仅在收到新数据时才会被评估。如果数据库被删除并计划删除，只要 trapper 项不再接收数据，它就永远不会被删除。\n\
  \n点击最底部的 Add 按钮。\n\n使用 `10` 且 Character string not included 将排除包含 `10` 的任何内容，而不仅仅是确切字符串\
  \ `10`。\n\n但一旦在此处配置了类似的东西，我们如何在 LLD 规则过滤器中使用它？全局正则表达式可以通过在其名称前加上 at (@) 符号来代替普通正则表达式使用。为此，请转到\
  \ Configuration | Templates，点击 C_Template_Linux 旁边的 Discovery，然后点击 NAME 列中的 Interface\
  \ discovery。切换到 Filters 选项卡，并将 REGULAR EXPRESSION 列中唯一的值替换为 `@Exclude loopback`。\n\
  \n此处不应使用引号——只需 at 符号然后是全局正则表达式名称，与在管理部分中配置的完全一致。\n\n完成后，点击 Update。新的配置应完全相同工作，但似乎更容易理解。\n\
  \n当全局正则表达式的名称被更改时不会进行任何检查——这样一来，配置在其他地方可能会被破坏，因此应谨慎进行，如果可能的话根本不要进行。\n\n全局正则表达式派上用场的另一个地方是日志监控。与\
  \ LLD 规则过滤器类似，我们只需使用 @-前缀的表达式名称，而不是直接输入 regexp。例如，我们可以定义如下正则表达式：\n\n```\n(ERROR|WARNING)\
  \ 13[0-9]{3}\n```\n\n它会捕获任何错误和警告，其错误代码在 13,000 范围内——因为这可能被定义为我们关心的问题。假设我们将全局命名为\
  \ \"regexp errors and warnings 13k\"，日志监控键将如下所示：\n\n```\nlog[/path/to/the/file,@regexp\
  \ errors and warnings 13k]\n```\n\n## 测试全局 regexp\n\n让我们返回到 **Administration | General**，在下拉菜单中选择\
  \ **Regular expressions**，并点击 **New regular expression**。按如下方式在此处添加三个表达式：\n\n- 第一个表达式：\n\
  \  - **EXPRESSION TYPE:** Character string included\n  - **EXPRESSION:** `A`\n \
  \ - **CASE SENSITIVE:** yes\n- 第二个表达式：\n  - **Expression type:** Result is TRUE\n\
  \  - **Expression:** `^[0-9]`\n- 第三个表达式：\n  - **Expression type:** Result is FALSE\n\
  \  - **Expression:** `[0-9]$`\n\n这应匹配包含大写 A 的字符串，以数字开头，且不以数字结尾的字符串。现在，切换到 **Test**\
  \ 选项卡并在 **Test string** 字段中输入 `1A2`；然后，点击 **Test expressions**。在以下结果区域的截图中，它显示以数字开头且包含大写\
  \ A 的字符串匹配，但随后字符串以数字结尾，而我们已将其否定。因此，最终测试失败。\n\n![](img/f5313a804532fabacc8d07cc8607eeba_491_0.png)\n\
  \n\n\n\n\n> Zabbix 前端使用 PCRE，但 Zabbix 守护进程使用 POSIX EXTENDED。不要使用 PCRE 字符类、环视或其他\
  \ PCRE 支持但 POSIX ERE 不支持的任何特性——它们在前端测试时看似能工作，但在由 Zabbix 守护进程解释时就会失败。\n\n## 默认模板中的用法\n\
  \n既然我们创建了自己的全局正则表达式，你可能已经注意到其中已有一些现成的。让我们导航到 Administration | General 并再次在下拉菜单中选择\
  \ Regular expressions。除了我们为回环接口过滤创建的那个之外，还有三个现有的表达式：\n\n| File systems for discovery\
  \ | 1 » ^(btrfs|ext2|ext3|ext4|jfs|reiserfs|xfs|jffs|ufs|jffs2|qfs|hfs|nfs|fat32|zfs)$\
  \ | [Result is TRUE] |\n| Network interfaces for discovery | 1 » ^lo$ | [Result\
  \ is FALSE] |\n|  | 2 » ^Software Loopback Interface | [Result is FALSE] |\n| Storage\
  \ devices for SNMP discovery | 1 » ^(Physical memory|Virtual memory|Memory buffers|Cached\
  \ memory|Swap space)$ | [Result is FALSE] |\n\n其中一个，Network interfaces for discovery，实际上做的事情几乎与我们做的相同，只是它还排除了名称以\
  \ Software Loopback Interface 开头的接口——这是针对 MS Windows 监控的。File systems for discovery\
  \ 可以用来限制要监控的文件系统类型——除了我们过滤的 ext3 之外，它还包含一大堆其他文件系统类型。Storage devices for SNMP discovery\
  \ 用于在通过 SNMP 监控时将内存统计信息从存储设备中排除。虽然文件系统类型正则表达式可以直接输入，但其他两个几乎不可能——POSIX EXTENDED 实际上并没有以合理的方式支持否定多个字符串。\n\
  \n## 网络发现\n\nLLD 关注的是在单个主机上发现实体。Zabbix 还支持一种扫描网络地址范围并根据发现的内容执行某些操作的方式——这称为网络发现。\n\
  \n## 查看结果\n\n等待几分钟后，检查 **Monitoring | Discovery** 部分：\n\n| DISCOVERED DEVICE | MONITORED\
  \ HOST | UPTIME/DOWNTIME | ICMP PING |\n|---|---|---|---|\n| **A test discovery**\
  \ (2 devices) |  |  |  |\n| 192.168.56.10 (testhost) |  | 00:23:22 | \U0001F7E9\
  \ |\n| 192.168.56.11 | Another host | 00:23:20 | \U0001F7E9 |\n\n所有在配置范围内响应 ping\
  \ 的设备都将在这里列出。如果某个设备已作为 Zabbix 中的主机被监控，它将在 **MONITORED HOST** 列中列出。我们还将看到该主机已知处于活动状态的时间长短，以及\
  \ **ICMP PING** 列将为所有主机以绿色列出此特定服务。但为什么这里只有一台主机被列为已监控？主机在这里是通过其 IP 地址识别的，而对于 A test\
  \ host，我们使用了 `127.0.0.1`。发现时使用的地址不同，因此它并不被视为同一主机或设备。\n\n> 主机目前在此处不可点击——可能最简单的方法是通过全局搜索字段复制并粘贴主机名来访问主机属性。\n\
  \n现在，导航回 **Configuration | Discovery** 并在 **NAME** 列中点击 **A test discovery**。在 **Checks**\
  \ 块中点击 **New** 并选择一个在这些主机上可访问且易于控制的服务——也许再次选择 **SMTP**。在 **Checks** 部分点击 **Add**，然后再次点击\
  \ **New**。这次，选择一个在配置范围内任何主机上都不存在的服务——**FTP** 可能是不错的选择。然后，再次在该块中点击 **Add**：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_494_0.png)\n\
  \n最后，点击 **Update**。等待几分钟后，访问 **Monitoring | Discovery**：\n\n| DISCOVERED DEVICE\
  \ ▲ | MONITORED HOST | UPTIME/DOWNTIME | ICMP PING | SMTP |\n|---|---|---|---|---|\n\
  | A test discovery (2 devices) |  |  |  |  |\n| 192.168.56.10 (testhost) |  | 02:07:13\
  \ |  |  |\n| 192.168.56.11 | Another host | 02:07:11 |  |  |\n\n**SMTP** 已出现，这很棒。但为什么没有\
  \ **FTP** 列？这个视图是否限制为两个服务？它并不限制服务数量，但如果某个服务在任何主机上都未被发现，则目前根本不会显示该服务。如果某个服务最初在某些系统上被发现而在其他系统上未被发现，则会显示该列，未发现该服务的系统将得到灰色单元格。\n\
  \n如果我们将光标移到绿色单元格上，我们将能够看到该服务已处于活动状态（或被发现）的时间长短：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_495_0.png)\n\
  \n让我们破坏一下——在其中一台主机上关闭 SMTP 服务，并等待几分钟。该主机对应的 **SMTP** 单元格应变为红色，并且弹出窗口应开始跟踪该服务的停机时间。如果主机上的所有服务都宕机，则该主机本身将被视为宕机，这将在\
  \ **UPTIME/DOWNTIME** 列中反映出来。\n\n## 对发现结果做出反应\n\n发现监控页面起初很有趣，但长期来看并不太有用。幸运的是，我们可以让\
  \ Zabbix 根据发现结果执行操作，其配置方式与我们对触发器触发做出反应时的方式有些相似。要查看此配置方式，请导航到 Configuration | Actions，并在右上角的\
  \ Event source 下拉菜单中切换到 Discovery。然后，点击 Create action。立刻就能注意到的一点是，此操作仍填入了默认的主题和消息，但内容不同：这里使用的宏特定于网络发现。填写\
  \ Network discovery test 的名称，然后让我们切换到 Conditions 选项卡并展开 New condition 部分中的第一个下拉菜单：\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_496_0.png)\n\n可用的条件与触发器操作中可用的条件完全不同。让我们回顾一下它们：\n\
  \n- **Discovery check**：这里必须选择特定发现规则中的特定检查。\n- **Discovery object**：这里可以选择设备或服务。在我们的示例中，被发现的主机是设备对象，而\
  \ SMTP 是服务对象。\n- **Discovery rule**：必须选择特定的网络发现规则。\n- **Discovery status**：此条件可能的取值为\
  \ **Up**、**Down**、**Discovered** 和 **Lost**。对于设备，如果其上的至少一个服务可以到达，则被认为已发现或处于活动状态。以下是这些值的含义：\n\
  \  - **Discovered**：此设备或服务首次被看到或在检测到宕机后再次被检测到\n  - **Lost**：此设备或服务以前被看到过，但刚刚消失\n\
  - **Up:** 设备或服务已被发现——无论发生过多少次\n- **Down:** 设备或服务曾在某个时间点被发现，但现在无法到达——无论发生过多少次\n-\
  \ **Host IP:** 这里可以指定单个地址或范围。\n- **Proxy:** 操作可以限制为特定的 Zabbix 代理。我们将在 *第 19 章，使用代理监控远程位置*\
  \ 中讨论代理。\n- **Received value:** 如果我们轮询的是 Zabbix agent 项目或 SNMP OID，我们可以对特定值做出反应——例如，如果通过\
  \ `system.uname` 项目键发现，我们可以将返回字符串中包含 `Linux` 的所有主机链接到 Linux 模板。\n- **Service port:**\
  \ 操作可以限制为发现时发生的特定端口或端口范围。\n- **Service type:** 操作可以限制为服务类型。这与 **Discovery check**\
  \ 条件类似，只是选择 SMTP 将匹配所有网络发现规则中的所有 SMTP 检查，而不仅仅是特定的一个。\n- **Uptime/Downtime:** 这里可以输入秒数，以将操作仅限制在设备或服务已处于活动或宕机状态一段时间之后。\n\
  \n其中大多数都很容易理解，但让我们更仔细地看看其中两个。**Discovery status** 条件允许我们在初始检查或在停机后被发现与周期性检查之间进行区分。例如，如果我们匹配\
  \ **Up** 状态并将主机添加到 **Host group**，此添加将在每次主机可到达时被检查并执行。如果有人将该主机从该主机组中移除，它将在每次发现周期中被重新添加。如果我们匹配\
  \ **Discovered** 状态，它只会在主机首次被发现以及主机宕机后再次上线时发生。在这种情况下，自动重新添加到组中很可能发生在更晚的时候。\n\n**Uptime/Downtime**\
  \ 条件允许我们在有延迟的情况下做出反应，而不是立即反应。例如，我们可能希望在设备上运行几小时的监控，因为它可能是一台临时用于故障排除的笔记本电脑，已连接到网络。可能更重要的是，我们可能不希望在主机停机\
  \ 5 分钟时删除该主机及其所有历史记录。检查一周的停机时间可能是合理的——如果一周内没人关心该主机，则可以安全删除。\n\n\n\n\n\n## 自动化配置\n\
  \n现在，我们暂时将条件留空，切换到**操作**选项卡。添加一个新操作并展开**操作类型**下拉列表，即可看到所有可用的操作。稍后我们会更详细地讨论它们，但现在，我们选择**添加到主机组**。在输入框中开始输入`linux`，然后从下拉列表中选择**Linux\
  \ 服务器**。接着，点击**操作详情**块中的小号“添加”控件。这里要非常小心，因为很容易丢失某些配置。完成后，点击底部的**添加**按钮：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_498_0.png)\n\
  \n几分钟后，前往**配置 | 主机**查看结果。如果发现了我们的测试系统，应该会看到新增了一台主机。\n\n> 尽管我们没有在操作中明确指定添加主机本身，但它仍然发生了。如果操作隐式地表明存在一台主机——例如，将其添加到主机组或链接到模板——该主机将被自动添加。\n\
  \n为什么只有一台主机？另一台主机之前已经根据**监控 | 发现**存在了。对于这台主机，你将看到它的主机名，或者 Zabbix 中用作主机名的 IP 地址。如果\
  \ Zabbix 服务器能够对该 IP 地址执行反向查找，则结果将用作主机名。如果无法执行反向查找，则 IP 地址将用作主机名。\n\n> 如果多个地址反向解析为相同的名称，则其他地址将被添加为\
  \ name_2 等。\n\n点击“名称”列中的**新主机**。在**组**部分，这台主机按预期位于**Linux 服务器**组中。但它也在其他某个组中，即**已发现主机**。这是从哪里来的？\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_498_1.png)\n\n## 自动化配置\n\n- **启用主机：**\
  \ 主机将被启用。如果不存在这样的主机，则先添加一台。\n- **禁用主机：** 主机将被禁用。这可以作为删除主机的一种更安全的替代方案，或者我们可以先禁用主机，之后再删除。如果不存在这样的主机，则先添加一台。\n\
  \n当链接到模板时，主机仍然需要该模板中监控项所要求的所有正确接口。在发现过程中，只有成功的发现检查才会导致添加相应类型的接口。例如，如果我们只在主机上发现了\
  \ SNMP，则只会添加 SNMP 接口。如果 SNMP 和 Zabbix agent 发现检查都在一台主机上成功，则两个接口都会添加。如果某些检查稍后成功，则会创建额外的接口。\n\
  \n### 唯一性标准\n\n但是，对于具有多个暴露给 Zabbix 网络发现的接口的多宿主主机，又该如何处理呢？让我们返回**配置 | 发现**，点击**测试发现**。查看**设备唯一性标准**选项——那里唯一的设置是**IP\
  \ 地址**。在**检查**块中，点击**新建**，并在**检查类型**下拉列表中选择 **Zabbix agent**。在**键**字段中，输入`system.uname`，然后点击**检查**块中的**添加**。注意，**设备唯一性标准**是如何获得一个新选项的——**Zabbix\
  \ agent \"system.uname\"**：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_500_0.png)\n\
  \n默认情况下，当唯一性标准设置为**IP 地址**时，Zabbix 将为每个发现的 IP 地址创建一个新主机。如果某个系统有多个地址，则会为每个地址创建一个新主机。如果唯一性标准设置为某个\
  \ Zabbix agent 监控项，它将检查之前见过的所有 IP 地址以及针对该监控项键返回的值。如果新值与之前的某个值匹配，它将在现有主机上添加一个新接口，而不是创建新主机。对于\
  \ SNMP 也是如此——添加一个 SNMP 检查会增加另一个唯一性标准选项，Zabbix 将比较针对该特定 OID 收到的值。通常通过 SNMPv2-MIB::sysDescr.0\
  \ OID 来发现 SNMP 设备。\n\n> 必须预先配置 Zabbix agent 和 SNMP，使其接受来自 Zabbix 服务器的连接。\n\n现在我们已经讨论了网络发现，我将给您一个简短的建议——不要使用它。好吧，也许没那么绝对，但不要过于依赖它。网络发现有其使用场景，但通常情况下，应该被监控的设备列表来自**配置管理数据库（CMDB）**或其他来源。在这种情况下，最好是基于该权威来源进行集成并自动更新您的\
  \ Zabbix 配置。如果您对“您环境中主机的最权威列表是什么？”的回答是“Zabbix”，那么网络发现就是为您准备的。\n\n### 主动 agent 自动注册\n\
  \n我们刚刚探讨了网络发现——它扫描一个网络范围。Zabbix 还支持一种反向的功能，即 Zabbix agent 可以主动注册，Zabbix 服务器可以自动开始监控它们。这被称为主动\
  \ agent 自动注册。\n\n每当 Zabbix agent 连接到 Zabbix 服务器时，服务器会将传入的 agent 主机名与现有主机进行比较。如果存在同名主机，它将继续正常的主动监控项监控序列。这包括已启用和已禁用的主机。如果主机不存在，则自动注册序列启动，即生成一个事件。\n\
  \n每次未知 agent 连接到 Zabbix 服务器时都会生成一个事件，这一点很重要。如果您不使用主动监控项或自动注册，请在 agent 端关闭主动检查。否则，每次此类检查都会产生一个网络连接、agent\
  \ 端和服务器端的日志条目，以及 Zabbix 数据库中的一个事件。在某些情况下，这会增加数据库大小并导致性能显著下降。在某些实例中，有数百万个这类完全无用的自动注册事件，占事件总数的比例高达\
  \ 90%。建议检查服务器日志中是否有如下条目：\n\n```\ncannot send list of active checks to [127.0.0.1]:\
  \ host [Register me]\nnot found\n```\n\n如果找到，它们都应该被解决。第一对方括号告诉我们连接来自哪里，第二对告诉我们 agent\
  \ 声称的主机是什么。\n\n与触发器事件和网络发现事件类似，我们可以通过操作来响应该事件。现在让我们配置一个自动注册操作——前往**配置 | 操作**，并在**事件源**下拉列表中切换到**自动注册**。然后，点击**创建操作**。在**名称**字段中输入`Testing\
  \ registration`，然后切换到**操作**选项卡。点击**操作操作**块中的**新建**。**操作类型**下拉列表显示了可用于网络发现的操作子集。最值得注意的是，我们无法删除主机、无法将主机从主机组中移除，也无法将主机从模板中取消链接。这些操作在功能上与网络发现相同，因此我们不会深入探讨——这次只需选择**添加主机**，并点击**操作详情**块中的小号**添加**控件。然后，点击底部的**添加**按钮。操作配置好后，可能最简单的测试方法是模拟一个新\
  \ agent。编辑 A test host 上的 agent 守护进程配置文件，将**Hostname**参数改为`Register me`。然后，重启 agent\
  \ 守护进程。前往**配置 | 主机**——又出现了一台新主机。如果检查主机属性，它包含在**已发现主机**组中——这里使用的组与网络发现中使用的组相同。让我们将\
  \ agent 守护进程配置文件中的**Hostname**参数改回之前的值，并重启 agent。\n\n我们还没有查看自动注册的条件——让我们返回**配置 |\
  \ 操作**，点击**Testing registration**，然后切换到**条件**选项卡。“新建条件”部分旁边的下拉列表显示了可用的条件：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_502_0.png)\n\
  \n正如我们所见，这里可用的条件列表要短得多。我们可以按主机名进行过滤——例如，如果我们所有的**Linux 主机**名称中都包含“linux”，我们可以用这种方式来检测它们。如果我们使用\
  \ Zabbix 代理进行自动注册，我们也可以按代理进行过滤。还有一个名为**主机元数据**的条目——那是什么？\n\n\n\n\n\n## 自动注册元数据\n\
  \n当 Zabbix agent 连接到服务器时，它会发送其主机名。但它还可能向服务器发送一些自定义字符串。发送的内容由 agent 守护进程配置文件中的一个配置参数\
  \ `HostMetadata` 控制。这可用于定义主机类型：数据库或应用。或者它可以列出主机上运行的各个服务。由于我们可以在自动注册动作中匹配接收到的元数据，因此我们可以列出所有正在运行的服务，以管道分隔。在动作条件中，我们可以查找\
  \ `|MySQL|` 并将新主机链接到适当的模板。\n\n> 元数据限制为 255 个字符。\n\n直接在配置文件中控制元数据参数是可能的，但可能很麻烦。有一种方法可以让\
  \ agent 动态获取该值。不是使用 `HostMetadata`，我们将定义 `HostMetadataItem` 并指定一个 item 键。我们可以使用内置的\
  \ item 键之一，或配置用户参数并运行脚本。请注意，我们也可以在此处使用 `system.run` item 键，并在 `HostMetadataItem`\
  \ 参数中直接指定任何命令，即使未启用远程命令也是如此——因为它不是从网络到达的，所以不被视为远程命令。例如，以下是一个有效的 `HostMetadataItem`\
  \ 行：\n\n```\nHostMetadataItem=system.run[rpm -qa mariadb]\n```\n\n如果在基于 RPM 的系统上存在\
  \ `mariadb` 包，agent 将在元数据中发送它；我们可以在动作条件中匹配它并将该主机链接到 MariaDB/MySQL 模板。\n\n此参数还有另一个用例。你可能已经注意到，只要存在自动注册动作，某人就可能恶意或意外地创建大量主机，从而可能极大地减慢\
  \ Zabbix 的速度。没有秘密挑战机制来防止这种情况，但我们可以在这里使用元数据。动作条件可以检查元数据中是否包含特定的秘密字符串——如果存在，则创建主机。如果不存在，则发送电子邮件供某人调查。请注意，密钥不能太长，因为\
  \ 255 个字符的长度限制仍然适用。\n\n## 摘要\n\n在本章中，我们了解了 Zabbix 中允许自动创建和维护配置的几个功能：\n\n- 低级发现或\
  \ LLD\n- 网络发现\n- 活动 agent 自动注册\n\nLLD 允许使用 Zabbix agents 发现实体——它内置支持网络接口、文件系统和 CPU。我们讨论了如何使用用户宏上下文支持按发现的实体自定义阈值和其他值。Zabbix\
  \ 还可以发现 SNMP 表，如网络接口，但它并不限于此——任何 SNMP 表都可以被发现。我们还查看了创建自定义发现，包括 MySQL 数据库发现。\n\n\
  LLD 提供了一种通过正则表达式过滤结果的方法，我们检查了全局正则表达式如何使这里以及其他地方（如日志监控）变得更容易。\n\n之后，我们探索了网络发现，它涉及扫描地址范围并自动添加主机，可能将它们链接到适当的模板并添加到主机组。\n\
  \n在另一个方向上，有活动 agent 自动注册，其中活动 agent 可以加入，服务器会自动开始监控它们。此功能的元数据支持允许对要链接哪些模板或主机应属于哪些主机组进行相当精细的规则。我们注意到，如果不使用，agent\
  \ 上的活动检查应被禁用；否则会给整个 Zabbix 基础设施带来不必要的负载。\n\n在下一章中，我们将探索内置的 Web 监控功能。它允许我们定义由步骤组成的场景。步骤检查页面并可能查找特定的\
  \ HTTP 响应代码或返回页面中的字符串。我们还将尝试登录应用程序并从一个页面提取数据然后传递到另一个页面。\n\n## 13\n"
- "## 监控 Web 页面\n\n在本章中，我们将查看 Zabbix 内置监控 Web 页面的功能。我们将检查 Web 页面的不同部分并监控其故障，以及监控下载速度和响应时间。我们还将了解\
  \ Zabbix 如何从某个页面提取值然后重用该值。除了更高级的场景和基于步骤的解决方案外，我们还将探索可用于 Zabbix agent 的与 Web 监控相关的\
  \ item。\n\n### 监控简单的 Web 页面\n\n互联网在现代生活的方方面面都很重要：社交、商业、娱乐，以及其他一切都通过网络进行。鉴于投入到这个网络的资源，许多人负责维护网站——无论是内部托管的站点还是委托给外部托管提供商的站点，我们至少想知道其基本健康状况。我们可以从在真实网站上监控一些简单的事情开始。\n\
  \n### 创建 Web 监控场景\n\nZabbix 中的 Web 监控通过场景进行，而场景又包含步骤。每个步骤由一个 URL 和对其进行的检查组成。这允许检查单个页面并验证多个页面按顺序正常工作。Zabbix\
  \ 中的 Web 监控场景仍然分配给主机，并且也可以进行模板化。为了了解其工作原理，我们可以监控开源地图项目 OpenStreetMap 的几个页面。\n\n\
  虽然我们可以将 Web 监控场景附加到任何现有主机，但这并不能正确反映场景监控的内容，因此我们将创建一个专用主机。由于只有一个 OpenStreetMap 网站，我们不会为此使用模板。导航到\
  \ Configuration | Hosts，点击 Create host，并填写以下值：\n\n- **Name:** OpenStreetMap\n- **Groups:**\
  \ 如果 In Groups 框中有任何组，请标记它们并点击 ▶ 按钮\n- **New group:** Web pages\n\n我们不必在此更改任何其他值，因此点击底部的\
  \ Add 按钮。现在我们准备创建场景本身——在主机列表中，点击 OpenStreetMap 旁边的 Web 并点击 Create web scenario。在场景属性中，输入以下值：\n\
  \n- **Name:** Main page\n- **New application:** Webpage\n- **Update interval:**\
  \ 300\n\n现在进入各个步骤。Web 监控的步骤是对 Web 服务器执行的实际查询；每个步骤都有一个 URL。切换到 Steps 选项卡并在 Steps\
  \ 部分点击 Add。在新弹出窗口中填写以下值：\n\n- **Name:** First page\n- **URL:** http://www.openstreetmap.org/\n\
  - **Required string:** Enter OpenStreetMap is a map of the world, created by people\
  \ like you. 此字段将在返回的页面中搜索特定字符串，如果找不到该字符串，此步骤将失败。我们可以在此处使用 POSIX 正则表达式，但不能使用第 12\
  \ 章《Automating Configuration》中讨论的全局正则表达式。\n- **Required status codes:** Enter 200。在此处，可以指定可接受的\
  \ HTTP 返回代码，以逗号分隔。同样，如果返回代码不匹配，此步骤将被视为失败。状态代码 200 表示 OK。\n\n> required string 仅针对页面源进行检查，而不是针对\
  \ HTTP 标头。场景仅下载步骤 URL 指向的内容；Web 页面的其他元素永远不会被下载。\n\n此表单应如下所示：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_507_0.png)\n\
  \n如果确实如此，点击 Add 按钮。让我们也检查是否可以访问 GPS traces 页面。再次点击 Steps 部分中的 Add，并输入以下值：\n\n- **Name:**\
  \ Traces\n- **URL:** http://www.openstreetmap.org/traces/\n- **Required string:**\
  \ Public GPS traces\n- **Required status codes:** 200\n\n## 监控 Web 页面\n\n在 **Required**\
  \ 字符串字段中，我们输入了应在 traces 页面上出现的文本。完成后，点击 **Add**。\n\n配置的最后一步应如下所示：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_508_0.png)\n\
  \n如果一切看起来正常，点击底部的 **Add** 按钮。让我们看看 Web 监控在视觉上是什么样的。打开 **Monitoring | Web** 并点击 **OpenStreetMap**\
  \ 旁边的 **Main page**。看起来所有步骤都已成功完成，因此我们可以认为被监控的网站运行正常，因为 **STATUS** 列高兴地说 **OK**——或者至少是我们监控的部分。与普通\
  \ item 一样，我们可以看到最后一次检查的执行时间：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_508_1.png)\n\
  \n我们还对每个场景包含多少步骤有一个概览，但这非常模糊。点击 **NAME** 列中的 **Main page**——也许有更多信息。确实有！在这里，我们可以看到每个步骤的统计信息，例如\
  \ **SPEED**、**RESPONSE TIME** 和 **RESPONSE CODE**。而且，如果这还不够，还有漂亮的预定义图表用于 **SPEED**\
  \ 和 **RESPONSE TIME**。请注意，这些是堆叠图，因此我们可以识别出所有步骤一起花费更多时间的时间点。在图表上方，我们可以看到那些熟悉的时间尺度控件——滚动条、缩放和日历控件——因此这些图表提供与其他地方相同的功能，包括点击并拖动以放大：\n\
  \n\n\n\n# Web场景的详细信息：主页\n\n| 步骤 | 速度 | 响应时间 | 响应代码 | 状态 |\n|---|---|---|---|---|\n\
  | 主页 | 31.29 KBps | 429.7ms | 200 | 正常 |\n| 追踪 | 80.01 KBps | 302.5ms | 200 | 正常\
  \ | 调试 |\n| 总计 |  | 732.2ms |  | 正常 |\n\n缩放：5分钟 15分钟 30分钟 1小时 全部\n2016-05-13 00:31\
  \ - 2016-05-13 01:06 (现在)\n«« 1小时 5分钟 | 5分钟 1小时 »» 35分钟 固定\n\n![](img/f5313a804532fabacc8d07cc8607eeba_509_0.png)\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_509_1.png)\n\n我们可以看到每个步骤花费的相对时间，以及与其他步骤相比的速度。在本例中，这两个操作平均合计耗时略低于一秒，尽管曾出现接近5秒的峰值。\n\
  \n虽然这个视图很不错，但灵活性不够。也许我们可以直接访问底层数据？让我们访问**监控 | 最新数据**来了解。在**主机组**字段中选择**网页**，然后点击**筛选**。**网页**应用中的监控项将会显示出来。看看这些数据——所有收集到的值都可以作为独立的监控项访问，包括下载**速度**、**响应时间**、**响应代码**，甚至每个场景的最后一条错误信息。我们可以重用这些监控项，从而创建任何我们想要的图表——也许我们想要每个步骤响应时间的饼图，或者非堆叠的下载速度图。当然，与所有监控项一样，我们无需任何额外配置即可获得简单图表。\n\
  \n| 名称 ▲ | 上次检查 | 上次值 |\n|---|---|---|\n| 网页（9个监控项） | | |\n| 场景“主页”的下载速度。 | 2016-05-13\
  \ 01:16:37 | 28.78 KBps |\n| 场景“主页”中步骤“主页”的下载速度。 | 2016-05-13 01:16:37 | 3.16 KBps\
  \ |\n| 场景“主页”中步骤“追踪”的下载速度。 | 2016-05-13 01:16:37 | 54.41 KBps |\n| 场景“主页”的失败步骤。\
  \ | 2016-05-13 01:16:37 | 0 |\n| 场景“主页”的最后一条错误信息。 | | |\n| 场景“主页”中步骤“主页”的响应代码。 |\
  \ 2016-05-13 01:16:37 | 200 |\n| 场景“主页”中步骤“追踪”的响应代码。 | 2016-05-13 01:16:37 | 200\
  \ |\n| 场景“主页”中步骤“主页”的响应时间。 | 2016-05-13 01:16:37 | 4s 257.7ms |\n| 场景“主页”中步骤“追踪”的响应时间。\
  \ | 2016-05-13 01:16:37 | 439.2ms |\n\n还有一个失败步骤监控项，如果没有步骤失败，则返回0。由于一切正常时该值为0，我们可以在触发器中检查此值不为0，并基于此发出告警。\n\
  \n> 虽然我们可以使用值映射在失败步骤为0时显示**成功**，但我们不得不为每个步骤编号添加值映射条目——值映射还不支持范围或默认值。\n\n# 其他场景和步骤属性\n\
  \n在继续讨论告警之前，让我们回顾一下场景级别的其他选项：\n\n- **尝试次数**：网页是很有趣的东西。它们大多数时候都能正常工作，但监控系统检查它的那一刻，却失败了。或者只是用户重新加载了一个一次加载失败的页面，然后从不抱怨？无论如何，这个字段允许我们指定Zabbix尝试下载网页的次数。对于偶尔出现小问题的页面，2或3的值可能是合适的。\n\
  \n- **代理**：当Web浏览器连接到Web服务器时，它通常会发送一个标识自身的字符串。这个字符串包括浏览器名称、版本、操作系统，通常还有其他信息。此信息用于诸如收集统计信息、使网站的特定部分在某些浏览器中更好地工作、拒绝访问或限制网站体验等目的。Zabbix\
  \ Web监控检查也会向Web服务器发送用户代理字符串。默认情况下，它标识为Zabbix，但也可以从预定义的浏览器字符串列表中选择，或通过选择其他...来输入完全自定义的字符串：\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_511_0.png)\n\n- **HTTP代理**：如果需要，可以为每个场景设置HTTP代理。也可以指定用户名、密码和端口：\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_511_1.png)\n\n默认HTTP代理可以通过为Zabbix Server进程设置http_proxy和https_proxy环境变量来配置——这些变量将被libcurl获取，而libcurl在底层用于Web监控。如果场景级别指定了代理，它将覆盖此类默认代理设置。无法在步骤级别设置代理。\n\
  \n稍后我们将讨论其余字段：变量和请求头。\n\nZabbix中的Web监控完全不支持JavaScript。\n\n# Web场景的告警\n\n让我们创建一个触发器，当场景中的任何步骤失败时警告我们。如前所述，失败步骤监控项在一切正常时值为0。任何其他值都是失败步骤的序号。由于Web场景在任何失败时都会停止，失败步骤编号为3意味着前两个步骤已成功执行，然后第三个步骤失败。如果有任何进一步的步骤，我们不知道它们的状态——它们没有被处理。\n\
  \n要创建触发器，我们总是需要一个监控项键。我们可以尝试在监控项列表中找到它。进入配置 | 主机，点击OpenStreetMap主机旁边的监控项——没有监控项。原因是这些监控项很特殊——它们是Zabbix\
  \ Web场景内部的监控项（不要与第22章“Zabbix维护”中讨论的内部监控项混淆），因此不可用于手动配置。不过，在创建触发器时我们应该能够选择它们。点击导航头中的触发器，然后点击创建触发器。在触发器编辑表单中，输入以下值：\n\
  \n- **名称：** `{HOST.NAME} 网站问题`\n\n- **表达式：** 点击**添加**，然后在弹出的对话框中点击**监控项**字段旁边的**选择**。在**组**下拉菜单中选择**网页**，在**主机**下拉菜单中选择**OpenStreetMap**，然后在**名称**列中点击**场景“主页”的失败步骤**。我们必须找出此监控项何时不返回零。在**功能**下拉菜单中选择**最后（最新）T值不等于N**，然后点击**插入**。最终的触发器表达式应如下所示：\n\
  \n`{OpenStreetMap:web.test.fail[Main page].last()}>0`\n\n完成后，点击底部的**添加**按钮。我们可以看到监控项键`web.test.fail[Main\
  \ page]`是如何使用的；因此，Web场景监控项与普通监控项非常相似。它们有名称和键，即使它们在监控项配置视图中不可见。这样，我们可以为所有Web场景监控项创建触发器，例如响应时间和下载速度，以发现性能问题，或者为返回码创建触发器以发现确切的失败步骤。这些监控项也可用于自定义图表。\n\
  \n我们创建的触发器会在Web场景第一次失败时发出告警。有人可能希望降低这种监控的敏感度，至少有两种方法可以实现：\n\n- 将场景属性中的**尝试次数**设置为更大的值。\n\
  - 在更长的时间段内检查监控项值。我们在*第6章“使用触发器检测问题”*中讨论过这种策略。\n\n如果Web监控步骤失败，Zabbix会停止，不会继续执行下一步。如果你正在监控的网站有多个可以独立工作的部分，你应该为每个部分创建单独的场景。\n\
  \n> 当Web监控失败时，了解我们究竟从Web服务器收到了什么会非常有用。不幸的是，Zabbix默认不会在任何地方存储检索到的内容。我们将在*附录A“故障排查”*的*控制运行中的守护进程*一节中讨论一种临时查看所有检索到的网页的方法。\n\
  \n# 登录Zabbix界面\n\n我们在网站测试中的最初几个步骤相当简单。现在让我们做一些更复杂的事情。我们将尝试登录Zabbix前端，检查是否成功，然后注销。顺便说一下，我们还应该验证注销操作是否成功。\n\
  \n> 我们将使用默认的Admin用户帐户进行这些测试。请注意，这将使用户的登录/注销条目污染审计日志。\n\n为了更清晰，我们将使用更多单独的步骤来完成此操作：\n\
  \n- 步骤1：检查主页\n- 步骤2：登录\n- 步骤3：检查登录\n- 步骤4：注销\n- 步骤5：检查注销\n\n\n\n我们将在A test host上设置此场景。转到配置|主机，点击A\
  \ test host旁边的Web，然后点击创建Web场景。填写以下值：\n\n- **名称：** Zabbix frontend\n- **新应用程序：**\
  \ Zabbix frontend\n- **变量：** 在此处输入以下行：\n  `{user}=Admin`\n  `{password}=zabbix`\n\
  \n> 请记住，我们将Web场景分配给哪台主机并不重要——实际检查仍由Zabbix服务器执行。\n\n我们填写的变量与Zabbix中的其他宏/变量使用了不同的语法。我们将能够在场景步骤中使用它们，稍后我们将看到具体如何操作。现在，进入步骤——切换到“步骤”选项卡。对于每个步骤，首先点击“步骤”部分中的“添加”链接。最后，点击步骤属性中的“添加”按钮，然后继续下一步。对于所有步骤，根据需要调整URL——IP地址或主机名以及Zabbix前端的实际位置。\n\
  \n## 步骤1：检查第一页\n\n在第一页，填写以下详细信息：\n\n- **名称：** First page\n- **URL：** http://127.0.0.1/zabbix/index.php\n\
  - **必需字符串：** Zabbix SIA\n- **必需状态代码：** 200\n\n在URL中，我们还附加了`index.php`以减少所需的重定向数量。必需字符串将根据页面内容进行检查。这也包括所有HTML标签，因此如果你的目标字符串包含任何标签，请务必列出它们。我们还选择了一个出现在页面底部的文本，以确保页面可能已完全加载。至于状态代码：HTTP响应代码200没问题；我们要求返回该特定代码。\n\
  \n## 步骤2：登录\n\n现在开始登录：\n\n- **名称：** `Log in`\n- **URL：** `http://127.0.0.1/zabbix/index.php`\n\
  - **POST：** `name={user}&password={password}&enter=Sign in`\n- **必需状态代码：** `200`\n\
  \n此步骤中的大多数内容应该很清晰，除了新的**POST**字符串。它遵循指定多个值的标准语法，用与号（&）连接。我们终于使用之前指定的变量，并根据登录表单中的输入字段名称传递它们。最后一个变量`enter`是Zabbix前端登录页面中的一个隐藏输入，我们必须向其传递硬编码值`Sign\
  \ in`。要查明其他页面的这些值，请查看页面源代码，使用浏览器调试功能，或嗅探网络流量。\n\n## 步骤3：检查登录\n\n我们可以假设登录成功。但是最好还是检查一下这类事情。我们可能漏掉了某个隐藏变量，或者密码可能出错。因此，我们将使用一个单独的步骤来确保登录确实成功。请注意，此场景中的所有后续步骤都将以已登录用户身份操作，直到我们注销。在整个场景期间，Zabbix会保留所有收到的cookie以供后续步骤使用。登录后，一个明显的特征就是个人资料链接，它使用`top-nav-profile`类——这就是我们要检查的字符串：\n\
  \n- **名称：** `Check login`\n- **URL：** `http://127.0.0.1/zabbix/index.php`\n- **必需字符串：**\
  \ `top-nav-profile`\n- **必需状态代码：** `200`\n\n先不要添加此步骤。在继续下一步（注销）之前，我们应该讨论一下需要什么。注销被视为修改性操作，因此我们实际上必须将会话ID作为`sid`变量传递。我们现在必须以某种方式获取它，可以通过在此处从页面源代码中提取ID来实现。可以从网页中提取值，分配给变量，并在后续步骤中重用。让我们也填写以下内容：\n\
  \n```\nVariables: {sid}=regex:sid=([0-9a-z]{16})\n```\n\n现在，可以添加该步骤了。这里的语法值得更详细地讨论。变量赋值的第一部分与手动赋值相同，等号后面的第二部分以关键字`regex`开头。然后，用冒号分隔，后面跟一个正则表达式。它将与页面源代码进行匹配。在我们的例子中，我们首先查找`sid=`字符串，后跟16个字母数字字符。这些字母数字字符就是会话ID，我们已将它们包含在一个捕获组中。请注意，这不是Zabbix特有的，而是标准的正则表达式功能。匹配的捕获组内容将被赋值给该变量。提取和重用会话ID是此功能最常见的用途，但只要我们能为正则表达式想出一个匹配模式，任何想在后续步骤中重用的内容都可以从页面中提取并赋值给变量。\n\
  \n> 不支持换行匹配，因此匹配的内容必须位于单行上。\n\n## 步骤4：注销\n\n现在我们有了会话ID，准备注销。不过，我们必须使用不同的URL。如果你查看页面源代码，注销控件使用JavaScript重定向到一个相对URL，如下所示：\n\
  \n```\nindex.php?reconnect=1&sid=b208d0664fa8df35\n```\n\n这里两个重要的变量是`reconnect`和`sid`。`reconnect`只需设置为1。至于`sid`，幸运的是我们在上一步中提取了该值，因此我们有注销所需的所有组件：\n\
  \n- **名称：** 注销\n- **URL：** http://127.0.0.1/zabbix/index.php?reconnect=1&sid={sid}\n\
  - **必需状态代码：** 200\n\n> 注销很重要。否则，默认情况下会话会在一年内不被移除，而且每次前端检查都会增加一个会话。大量会话会拖慢Zabbix前端的速度。我们将在第22章“Zabbix维护”中讨论会话维护。\n\
  \n## 步骤5：检查注销\n\n我们将检查是否存在只在登录页面上才能看到的字符串。否则，注销可能已经悄然失败：\n\n- **名称：** `Check logout`\n\
  - **URL：** `http://127.0.0.1/zabbix/index.php`\n- **必需字符串：** `Sign in`\n- **必需状态代码：**\
  \ `200`\n\n最终步骤应如下所示：\n\n| 步骤 | 名称 | 超时 | URL | 必需的 | 状态代码 | 操作 |\n|---|---|---|---|---|---|---|\n\
  | 1: | 第一页 | 15秒 | http://127.0.0.1/zabbix/index.php |  | 200 | 移除 |\n| 2: | 登录\
  \ | 15秒 | http://127.0.0.1/zabbix/index.php |  | 200 | 移除 |\n| 3: | 检查登录 | 15秒 |\
  \ http://127.0.0.1/zabbix/index.php | top-nav-profile | 200 | 移除 |\n| 4: | 注销 |\
  \ 15秒 | http://127.0.0.1/zabbix/index.php?reconnect=1&sid={sid} |  | 200 | 移除 |\n\
  | 5: | 检查注销 | 15秒 | http://127.0.0.1/zabbix/index.php | Sign in | 200 | 移除 |\n\n\
  如果一切看起来正常，点击页面底部的**添加**按钮，最终保存此场景。我们可以让场景运行一段时间，然后讨论一些我们没有使用的步骤参数：\n\n- **跟随重定向：**\
  \ 指定Zabbix是否应跟随重定向。如果启用，它会跟随最多10个硬编码的重定向，因此无法检查是否存在特定次数的重定向。如果禁用，我们可以检查HTTP响应代码是否为`301`或其他有效的重定向代码。\n\
  - **仅检索标头：** 如果页面很大，我们可以选择仅检索标头。在这种情况下，**必需字符串**选项将被禁用，因为Zabbix尚不支持在标头中匹配字符串。\n\
  - **超时：** 指定此特定步骤的超时时间。它分别应用于连接和执行HTTP请求。请注意，默认超时时间为15秒，这可能导致Zabbix在一个页面上花费长达30秒。\n\
  \n> 我们可以对URL的一部分或全部使用用户宏——这样我们只需定义一次，然后在每个步骤中引用它。我们在*第8章，使用模板简化复杂配置*中讨论了用户宏。\n\n\
  该场景似乎运行正确：登录和注销看起来工作正常。请注意，如果对你来说失败了，失败实际上可能出在之前的步骤中。例如，如果在步骤3：检查登录时失败，实际故障很可能在步骤2：登录——也就是说，登录失败了。\n\
  \n我们采用的五步方法并不是最简单的。虽然它允许我们将每个操作拆分到各自的步骤中（并提供了带有五个值的漂亮图表），但我们可以使用更简单的方法。要检查登录和注销，最简单的且步骤数量最少的方法如下：\n\
  \n- 登录并检查是否成功\n- 注销并检查是否成功\n\n作为额外练习，请考虑创建一个新场景，并用两个步骤实现相同的目标。\n\n## 认证选项\n\n在场景属性中，还有一个我们没有使用的选项卡——认证：\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_519_0.png)\n\n对于HTTP认证，Zabbix目前支持两个选项——Basic和NTLM。目前不支持摘要认证。\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_519_1.png)\n\n选择其中一种HTTP认证方法将提供用户名和密码的输入字段。\n\
  \n\n\n\n所有其他选项都与 SSL/TLS 相关。复选框允许我们验证服务器证书——**SSL verify peer** 选项会检查证书的有效性，而 **SSL\
  \ verify host** 则额外检查服务器主机名是否与证书中的 **Common Name** 或 **Subject Alternate Name**\
  \ 相匹配。证书颁发机构会根据系统默认设置进行验证。CA 证书的位置也可以通过服务器配置文件中的 `SSLCALocation` 参数进行覆盖。\n\n最后三个字段使我们能够使用证书设置客户端身份验证。Zabbix\
  \ 支持证书、密钥和密钥密码的所有可能组合：单个未加密文件、完全分离的证书、密钥和密钥密码等等。客户端证书文件必须放置在服务器配置文件中 `SSLCertLocation`\
  \ 参数指定的目录中。密钥文件（如有）必须放置在服务器配置文件中 `SSLKeyLocation` 参数指定的目录中。\n\n## 使用 agent 项\n\n\
  我们刚刚设置的基于 Web 场景的监控功能非常强大，但在某些情况下，更简单的方法可能就足够了。在 agent 级别，有一些有趣的项键可以检索网页并执行简单验证。额外的好处是可以从任何\
  \ agent 执行，因此从多个地理分布位置检查网页可用性非常容易。有三个与网页相关的项键：\n\n- `web.page.get`\n- `web.page.perf`\n\
  - `web.page.regexp`\n\n> 还请记住诸如 net.tcp.service 之类的更简单的项键，见第 3 章《使用 Zabbix Agents\
  \ 和基本协议进行监控》。\n\n## 获取页面\n\n最简单的与网页相关的 agent 项键 `web.page.get` 允许我们检索页面内容。与基于场景的\
  \ Web 监控一样，它不会检索任何包含内容，例如图像。让我们使用此键创建一个简单的项。导航到 **Configuration | Hosts**，并在 **Group**\
  \ 下拉菜单中选择 **Web pages**。点击 **OpenStreetMap** 旁边的 **Items**，然后点击 **Create item**。填写以下内容：\n\
  \n- **Name:** `OpenStreetMap main page`\n- **Key:** `web.page.get [www.openstreetmap.org,\
  \ /]`\n\n- **Type of information:** Text\n- **New application:** OSM\n\n> 我们正在为\
  \ Zabbix 服务器创建 agent 项。这意味着此 Web 项将由本地 agent 检查。\n\n完成后，点击底部的 Add 按钮。在此项中，我们指定了\
  \ / 作为第二个参数，但这是可选的——默认情况下会请求 Web 服务器的根目录。如果必须使用自定义端口，可以将其指定为第三个参数，如下所示：\n\n```\n\
  web.page.get[www.site.lan,/,8080]\n```\n\n与其单独检查我们正在创建的每个项的结果，不如先创建全部三个项，然后再验证结果。\n\
  \n## 检查页面性能\n\n另一个与网页相关的 agent 项是 web.page.perf。它以秒为单位返回页面的加载时间。仍在项列表中，点击 Create\
  \ item，并填写以下内容：\n\n- **Name:** OpenStreetMap main page load time\n- **Key:** web.page.perf[www.openstreetmap.org,/]\n\
  - **Type of information:** Numeric (float)\n- **Units:** s\n- **Applications:**\
  \ OSM\n\n完成后，点击底部的 Add 按钮。我们更改了 Type of information，因为此项键返回加载页面所需的时间（以秒为单位），该值通常会有小数部分。\n\
  \n## 从网页中提取内容\n\n在创建 Web 监控场景时，我们使用了从页面中提取内容并在以后重用的功能。使用更简单的 agent 监控，仍然可以从页面中提取一些内容。作为测试，我们可以尝试提取\
  \ OpenStreetMap is 之后直到第一个逗号之前的文本。再次点击 Create item，并填写以下内容：\n\n- **Name:** OpenStreetMap\
  \ is\n- **Key:** web.page.regexp[www.openstreetmap.org,,,OpenStreetMap is ([a-z\
  \ ]*),,\\1]\n\n## Monitoring Web Pages\n\n- **Type of information:** Character\n\
  - **Applications:** OSM\n\n> 内部方括号包含 a-z——z 后面有一个空格。\n\n完成后，点击底部的 **Add** 按钮。\n\n\
  > 该项键在撰写本文时可与 **OpenStreetMap** 页面内容配合使用。如果网页被重新设计，请将其视为额外挑战来调整正则表达式。\n\n对于此项，我们直接从页面中提取搜索结果。这里重要的参数是第四个参数——它是一个将在页面源中匹配的正则表达式。在本例中，我们正在查找\
  \ OpenStreetMap is 字符串并将它之后直到第一个逗号之前的所有内容包含在一个捕获组中。我们将正则表达式包含在双引号中，因为它包含逗号。逗号是 **item\
  \ key parameter separator**，因此可能会被误解。然后，在最后一个参数中，我们请求仅包含第一个捕获组的内容。默认情况下，返回整个匹配字符串。有关使用此方法进行值提取的更多详细信息，请参阅\
  \ *第 11 章《高级项监控》* 中的 *Log file monitoring*。我们还选择 **Type of information** 为 **Character**——这将把值限制为\
  \ 255 个符号，以防它匹配到一个巨大的字符串。\n\n> 对于此键，第五个参数允许我们限制返回键的长度。如果您想提取一个数字并通过 SMS 发送，限制提取字符串的长度为\
  \ 50 个字符将降低消息过长的可能性。\n\n此项的实际应用是使用 mod_status 或其他服务器软件的类似功能从 Apache Web 服务器中提取统计信息。\n\
  \n> 目前，这三个 web.page.* 项均不支持 HTTPS、身份验证或重定向。\n\n配置好项后，让我们检查其返回的值——前往 **Monitoring\
  \ | Latest data**，清空 **Host groups** 字段，在 **Hosts** 字段中选择 **OpenStreetMap**，然后点击\
  \ **Filter**。查找 OSM 应用中的项：\n\n| NAME ▲ | LAST CHECK | LAST VALUE |\n|---|---|---|\n\
  | OSM (3 items) | | |\n| OpenStreetMap is | 2016-05-13 13:41:21 | a map of the world\
  \ |\n| OpenStreetMap main page | 2016-05-13 13:41:20 | HTTP/1.1 200 OK Date: Fri,\
  \ 13 May 2016 10:41:20 GMT ... |\n| OpenStreetMap main page load time | 2016-05-13\
  \ 13:41:21 | 604.8ms |\n\n> 每个项都会单独请求页面。\n\n这些项应返回完整的页面内容、加载页面所需的时间以及我们正则表达式的结果。web.page.get\
  \ 项始终包含标头也是如此。如果您看到 web.page.get 和 web.page.regexp 项偶尔出现空值，这可能是因为请求超时。虽然 Web 场景有自己的超时设置，但\
  \ agent 项默认遵守 agent 超时 3 秒。web.page.perf 项在超时时返回 0。\n\n> Zabbix web.page.get 项目前不能正确处理分块传输编码，而分块传输编码被广泛使用。额外数据会被插入到页面内容中。预计在\
  \ Zabbix 3.0 中使用 libcurl 处理这些 agent 项时将修复此问题，但该开发尚未完成。在撰写本文时，还不知道何时可以修复。\n\n使用这些项，我们可以在页面加载时间过长或完全无法工作时触发警报，或当页面上找不到特定字符串时触发警报——使用\
  \ str() 和类似的触发器表达式对整个页面项或内容提取项进行操作。\n\n> Web 场景在 Zabbix 服务器上执行，agent 项在 agent 上执行。我们将在第\
  \ 19 章《使用代理监控远程位置》中讨论在远程系统上运行 Web 场景的能力。\n\n我们创建的项都发送到同一个 Zabbix agent。我们也可以创建一个具有多个接口的主机并将项分配给每个接口。这使我们能够从多个位置检查网页，但将结果保留在单个主机中。我们仍然必须使项键唯一——如果需要，可以使用空键参数的技巧、键参数中的额外逗号或键别名，这些在第\
  \ 22 章《Zabbix 维护》中讨论。请注意，在这种设置中不能使用模板。\n\n\n\n\n\n# 总结\n\n首先，我们学习了如何根据各种参数监控网页，包括响应时间、传输速度、HTTP返回码以及页面本身包含的文本。我们还了解了如何设置多个场景及其中的步骤，以及如何设置可在所有步骤中使用的变量。作为一个更高级的示例，我们登录了\
  \ Zabbix 前端并退出。为了实现这一点，我们提取了会话 ID 并在后续步骤中重复使用它。掌握了这些知识，应该可以监控网页所拥有的大部分功能。\n\n对于生产系统，通常会有更多的应用程序、场景和步骤。Web\
  \ 监控可用于多种不同目的，最流行的是站点可用性和性能，但可以监控的情况有很多，例如查看 Slashdot 首页上的公司名称，并将通常的首页替换为更简单的页面，以便更容易承受即将到来的流量冲击——即\
  \ Slashdot 效应。\n\n作为更简单的替代方案，我们还探索了代理端的网页监控项。它们有三个功能：\n\n- 检索完整页面内容\n- 获取页面加载时间\n\
  - 使用正则表达式从页面提取字符串\n\nWeb 场景仅在服务器端可用，而更简单的监控项仅在代理端可用。\n\n到目前为止，我们主要专注于 Linux 系统监控，在下一章中我们将离开这个主题，转而学习\
  \ *第14章，监控Windows*。我们将学习 Windows 原生代理、性能计数器和 **Windows管理规范（WMI）** 监控，以及服务发现和 Windows\
  \ 事件日志监控。\n\nZabbix 代理的 Windows 版本可以从两个官方位置获取——要么从 http://www.zabbix.com/download.php\
  \ 的下载页面，要么从源代码归档中。虽然在源代码中保留二进制文件的做法并不被建议，但 Zabbix 就是这样做的，有时我们可以利用这一点。如果您是从源代码安装的，最好使用同一归档中的\
  \ Windows 代理二进制文件，以便版本匹配。代理可执行文件位于 bin/win32 或 bin/win64 子目录中——请选择适合您系统架构的那个。如果您是从软件包安装的，请访问下载页面并获取\
  \ Windows 代理归档文件——但请确保使用与 Zabbix 服务器相同或更早的主版本。无论如何拿到代理，请将其放在 Windows 机器上的同一目录中。为了简单起见，这次我们将使用\
  \ C:\\zabbix，但您可以使用任何其他目录。我们还需要配置文件，因此如果您使用了源代码中的二进制文件，请获取 conf/zabbix_agentd.win.conf\
  \ 中提供的示例；如果您从 Zabbix 网站下载了二进制文件，则从归档文件中的 conf/ 目录获取。将配置文件放在同一目录中——现在应该有两个文件了。在继续研究代理本身之前，让我们确定是否需要以任何方式修改配置。用您喜欢的文本编辑器打开\
  \ C:\\zabbix\\zabbix_agentd.win.conf，查找任何我们可能想要更改的参数。首先，日志文件的位置不太正确——它设置为 C:\\zabbix_agentd.log，所以让我们将其改为：\n\
  \n```\nLogFile=c:\\zabbix\\zabbix_agentd.log\n```\n\n在 Windows Zabbix 代理守护进程的命令行和配置文件中，您可以使用正斜杠和反斜杠。\n\
  \n我们已经知道服务器行（目前读作 Server=127.0.0.1）必须更改。将 127.0.0.1 部分替换为您的 Zabbix 服务器的 IP 地址。为了确保主动监控项能按预期工作，让我们检查一下\
  \ Hostname 指令——默认情况下它设置为 Windows 主机，我们可以保持原样。另一个用于主动检查的参数是 ServerActive。将这里的 127.0.0.1\
  \ 也替换为 Zabbix 服务器 IP 地址，然后保存文件。\n\n如果我们现在启动代理，它会根据我们在第12章“自动化配置”中创建的配置自动注册到 Zabbix\
  \ 服务器。虽然这很方便，但这次我们想以更严格的方式测试——转到“配置 | 动作”，在“事件源”下拉列表中切换到“自动注册”，然后点击“测试注册”旁边的“已启用”——这将禁用我们之前设置的自动注册。\n\
  \n现在让我们尝试启动代理。启动 Windows `cmd.exe` 并执行：\n\n```\nC:\\zabbix>zabbix_agentd.exe -c\
  \ c:/zabbix/zabbix_agentd.win.conf\n```\n\n> \U0001F4A1 在某些版本的 Windows 上，你可能需要在命令前加上\
  \ `.\\`。\n> \n> 如果你没有看到任何输出，或者另一个窗口一闪而过，你应该以管理员用户身份启动命令提示符。在近期版本的 Windows 中，菜单项被称为**命令提示符（管理员）**。\n\
  \n代理守护进程拒绝启动：\n\n```\nzabbix_agentd.exe [6348]: use foreground option to run Zabbix\
  \ agent as console application\n```\n\n那么，让我们弄清楚如何提供前台选项。Windows 上的代理守护进程可执行文件具有可以传递给它的附加选项，因此在命令提示符中执行它（当位于\
  \ `zabbix_agentd.exe` 所在的目录时）：\n\n```\nC:\\zabbix>zabbix_agentd.exe --help\n```\n\
  \n查看**选项**部分，其中列出了前台参数：\n\n| 选项 | 描述 |\n|---|---|\n| `-f --foreground` | 在前台运行 Zabbix\
  \ 代理 |\n\n让我们尝试使用该选项：\n\n```\nC:\\zabbix>zabbix_agentd.exe --foreground -c c:/zabbix/zabbix_agentd.win.conf\n\
  Starting Zabbix Agent [Windows host]. Zabbix 3.0.0 (revision 58455).\nPress Ctrl+C\
  \ to exit.\n```\n\n看起来代理已启动。为了快速测试，请尝试在 Zabbix 服务器上运行以下命令。在 Zabbix 服务器上执行：\n\n```\n\
  $ zabbix_get -s <Windows host IP> -k system.cpu.load\n0.316667\n```\n\n# 监控 Windows\n\
  \n代理正在运行，我们可以从中查询值——看起来很棒。不过有一个问题——我们当前是在终端中运行它。如果我们关闭终端，代理将不再运行。如果系统重新启动，代理不会自动启动。在前台运行代理很好，但我们也可以将其作为\
  \ Windows 服务运行。具体该怎么做？首先，按 **Ctrl + C** 停止它，然后再次查看 `--help` 输出。在所有参数中，我们这次对**功能**部分感兴趣：\n\
  \n```\nFunctions:\n-i --install     Install Zabbix agent as service\n-d --uninstall\
  \   Uninstall Zabbix agent from service\n-s --start       Start Zabbix agent service\n\
  -x --stop        Stop Zabbix agent service\n```\n\n> 选项部分中的 `--multiple-agents`\
  \ 用于在同一系统上作为单独的 Windows 服务运行多个代理。如果使用，服务名称将包含指定配置文件中 Hostname 参数值。\n\nWindows 版\
  \ Zabbix 代理守护进程包含将其安装为标准 Windows 服务的功能，该功能由本部分中的选项控制。除非你只是在做一些测试，否则你会希望正确地安装它，所以现在让我们这样做：\n\
  \n```\nC:\\zabbix>zabbix_agentd.exe -c c:/zabbix/zabbix_agentd.win.conf -i\n```\n\
  \n此时可能会出现确认对话框。点击**是**。如果你是以管理员用户身份运行命令提示符，安装服务应该会成功：\n\n```\nzabbix_agentd.exe\
  \ [6248]: service [Zabbix Agent] installed successfully\nzabbix_agentd.exe [6248]:\
  \ event source [Zabbix Agent] installed successfully\n```\n\n如果不是这样，此命令可能会失败，并显示以下内容：\n\
  \n```\nzabbix_agentd.exe [3464]: ERROR: cannot connect to Service Manager:\n[0x00000005]\
  \ Access is denied.\n```\n\n在这种情况下，你应该以管理员用户身份运行命令提示符，或者允许程序以管理员用户身份运行。要执行后者，请右键单击\
  \ `zabbix_agentd.exe`，然后选择**兼容性疑难解答**。在出现的窗口中，点击**疑难解答程序**，并勾选**程序需要其他权限**：\n\n\
  ![](img/f5313a804532fabacc8d07cc8607eeba_529_0.png)\n\n点击**下一步**，然后**测试程序**，再次点击**下一步**。在最后的窗口中，选择**是**，为此程序保存这些设置，然后点击**关闭**。\n\
  \n> \U0001F4A1 如果运行代理守护进程似乎没有输入，或者窗口一闪而过，请使用前面建议的管理员命令提示符。\n\n\n\n\n\n## 监控 Windows\n\
  \n如果一切顺利，Zabbix 代理守护进程将使用 -c 标志指定的配置文件，作为 Windows 服务安装。您可以在 **Windows 控制面板** 的 **服务**\
  \ 部分验证 Zabbix 服务确实已安装：\n\n| 名称 | 描述 | 状态 | 启动类型 | 登录身份 |\n|---|---|---|---|---|\n\
  | Zabbix Agent | 提供系统监控 |  | 自动 | 本地系统 |\n\n虽然它已设置为自动启动，但当前处于停止状态。我们可以右键单击 **Zabbix\
  \ Agent** 服务条目并选择 **启动**，或者使用 `zabbix_agentd.exe` 的命令行开关来启动它。现在让我们尝试后一种方法：\n\n```\n\
  C:\\zabbix>zabbix_agentd.exe --start\n```\n\n您可能还需要在此处回答另一个安全提示，但服务应能成功启动。我们可以在服务列表中验证\
  \ Zabbix 服务是否已启动：\n\n| 名称 | 描述 | 状态 | 启动类型 | 登录身份 |\n|---|---|---|---|---|\n| Zabbix\
  \ Agent | 提供系统监控 | 正在运行 | 自动 | 本地系统 |\n\n> 如果您之前打开了服务列表，请按 F5 刷新内容。\n\n看起来被监控主机一切正常，现在我们必须在\
  \ Zabbix 前端配置它。打开 **配置 | 主机**，点击 **创建主机**，然后填写以下值：\n\n- **主机名称：** `Windows host`\n\
  - **组：** 如果 **在组** 框中有任何组，请将其移除\n- **新组：** `Windows servers`\n- **代理接口，IP 地址：**\
  \ 输入该主机的 IP 地址\n\n完成后，点击底部的添加按钮。现在在组下拉框中选择 Windows servers，点击 Windows host 旁边的监控项，然后点击创建监控项。输入以下值：\n\
  \n- **名称：** `CPU load`\n- **键值：** `system.cpu.load`\n- **信息类型：** 数字（浮点）\n\n完成后，点击底部的添加按钮。现在我们可以查看监控中的最新数据：监控\
  \ | 最新数据 —— 清除其他筛选字段，在主机组字段中选择 Windows host，然后点击筛选：\n\n| 主机 | 名称 ▲ | 上次检查 | 上次值\
  \ |\n|---|---|---|---|\n| Windows host | - 其他 - (1 个监控项) | | |\n| | CPU load | 2016-05-14\
  \ 17:15:52 | 0.07 |\n\n> Windows 上的 CPU load 与 Unix 系统上的工作方式类似，尽管 Windows 管理员对它不太熟悉。在\
  \ Windows 上，CPU 利用率更为常用。\n\n我们现在已成功获取到这台 Windows 机器的 CPU load 数据。请注意，键值语法与 Linux\
  \ 相同。其他几个键值也是如此，您可以查阅 Zabbix 文档，了解哪些平台支持哪些键值。\n\n## 查询性能计数器\n\n虽然许多键值在各平台间是通用的，但有一整个类别是\
  \ Windows 所特有的。Zabbix 支持 Windows 内置的指标收集系统——性能计数器。熟悉 Windows 的人可能知道，在旧版 Windows\
  \ 中，可以在“控制面板 | 管理工具 | 性能”中找到它们，而在较新版本中则在“管理工具 | 性能监视器”中找到，其中有许多计数器可添加。其具体操作方式再次取决于\
  \ Windows 版本——在旧版本中，我们可以单击子工具栏中的 + 图标，或按 Ctrl + I 查看可用的计数器：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_532_0.png)\n\
  \n在此对话框中，我们可以收集构建性能计数器字符串所需的信息。首先，字符串必须以反斜杠 \\ 开头。接下来是性能对象，在本例中为 Processor。然后我们需要在括号中包含所需的实例，这样到目前为止我们的字符串就是\
  \ \\Processor(_Total)（注意 Total 前面的下划线）。从“从列表选择计数器”列表框中添加单个计数器字符串后，计数器字符串就完成了，同样用反斜杠分隔。因此，最终的性能计数器字符串如下所示：\n\
  \n```\n\\Processor(_Total)\\% Idle Time\n```\n\n在较新的 Windows 版本中，我们展开“数据收集器集”，右键单击“用户定义”，然后选择“新建\
  \ | 数据收集器集”：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_533_0.png)\n\n在出现的窗口中，为数据收集器集输入名称，选择“手动创建”，然后点击“下一步”。选择“性能计数器警报”，再次点击“下一步”，然后点击“添加”。这里我们终于看到了性能计数器——展开\
  \ Processor 并点击“% Idle Time”，然后点击“添加 >>”。现在点击“确定”查看构建好的性能计数器字符串：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_533_1.png)\n\
  \n现在我们已经构建好了它，接下来该做什么呢？当然是创建一个监控项。回到前端，导航至 **配置 | 主机**，点击 **Windows host** 旁边的 **监控项**，然后点击\
  \ **创建监控项**。填写以下值：\n\n- **名称：** `CPU idle time, %`\n- **键值：** 这里更有意思，虽然原理很简单——`perf_counter`\
  \ 键值必须使用我们之前构建的性能计数器字符串作为参数；因此，在此输入 `perf_counter[\\Processor(_Total)\\% Idle Time]`\n\
  - **信息类型：** 数字（浮点）\n- **单位：** %\n\n完成后，点击底部的添加按钮。这个监控项应该会显示机器上所有 CPU 的空闲总时间，所以让我们查看\
  \ **监控 | 最新数据**。我们可以看到数据是直接从内置性能计数器获取的：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_534_0.png)\n\
  \n查看 Windows 中可用的性能对象及相应计数器列表，我们可以看到许多不同的指标。浏览此窗口充其量也很麻烦，因为控件较小，没有合适的筛选或搜索功能，而且由于条目无法复制，构建要用作键值的字符串需要手动输入。幸运的是，有一个可用的解决方案——命令行实用程序\
  \ `typeperf.exe`。要了解它如何帮助我们，请执行：\n\n```\nC:\\zabbix>typeperf -qx > performance_counters.txt\n\
  ```\n\n这会将此命令的所有输出保存到文件 `performance_counters.txt` 中。使用文本编辑器打开该文件并查看内容。您会看到大量性能计数器字符串，涵盖各种软件和硬件信息。再也不必与那个笨拙的对话框搏斗了；我们可以轻松搜索并复制这些字符串。\n\
  \n## 使用性能计数器的数字引用\n\n如果您的 Windows 安装是本地化的，您可能已经注意到所有性能计数器都使用本地化语言，而不是英语。如果您必须监控多台配置了不同区域设置的\
  \ Windows 机器，这会变得尤其麻烦。例如，在英文 Windows 安装上是 \\System\\Processes 的计数器，在法文安装上则是 \\Système\\\
  Processes。是否可以使用其他更通用的方法来引用性能计数器？确实可以；我们可以使用数字引用，但首先必须弄清楚它们是什么。\n\n启动 regedit，查找注册表项\
  \ HKEY_LOCAL_MACHINE\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Perflib。在此注册表项下，您会看到一个或多个条目，其中一个是\
  \ 009，这是英语语言的条目。选择此条目，注意 Counter 键，它的内容与性能计数器名称惊人地相似。在旧版 Windows 中，您会看到类似这样的内容：\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_535_0.png)\n\n在较新版本中，您会看到类似这样的内容：\n\n\
  ![](img/f5313a804532fabacc8d07cc8607eeba_535_1.png)\n\n双击此值，以更易于管理的形式查看其内容：\n\n\
  ![](img/f5313a804532fabacc8d07cc8607eeba_536_0.png)\n\n每个性能计数器字符串都可以转换为一个数字。但是在这个小窗口中找出准确的转换非常困难，所以让我们复制所有内容并保存到文件中，以便日后搜索——将其命名为\
  \ numeric.txt。为了了解其工作原理，让我们转换之前使用的性能计数器字符串：\\Processor(_Total)\\% Idle Time。\n\n\
  首先，我们必须转换性能对象 Processor。虽然可以通过任何文本编辑器搜索这些内容，但很快就会变得繁琐，尤其是需要转换大量值时。在这种情况下，我们可以求助于基本的\
  \ GNU 工具，例如 grep，您可能已经在 Windows 机器上安装了它——如果没有，请将此文件复制到 Zabbix 服务器：\n\n```\n$ grep\
  \ -B 1 \"^Processor$\" numeric.txt\n```\n\n此命令将搜索完全包含字符串 Processor 的行，并同时输出紧邻其前的行，其中包含此性能对象的数字\
  \ ID：\n\n```\n238\nProcessor\n```\n\n\n不同 Windows 版本中的数值可能有所不同，因此请务必使用您文件中找到的数值。\n\
  \n如果您在 Zabbix 服务器上使用 grep，保存的文件可能包含 Windows 风格的换行符，您可能得不到任何输出。在这种情况下，请执行以下命令转换换行符：\n\
  \n```\n$ sed -i 's/\\r//' numeric.txt\n```\n\n既然我们已经获得了第一部分的数值，现在对性能计数器的第二部分执行同样的操作：\n\
  \n```\n$ grep -B 1 \"^% Idle Time$\" numeric.txt\n1482\n% Idle Time\n```\n\n现在，除了\
  \ _Total 之外，我们已经获得了性能计数器所有部分的数值。如何翻译这一部分？我们不必翻译——该字符串在所有区域设置中均按原样使用。我们最终得到的性能计数器将如下所示：\n\
  \n```\n\\238(_Total)\\1482\n```\n\n由于我们已经有一个用于收集此信息的监控项，我们不会添加另一个。相反，让我们使用 zabbix_get\
  \ 实用程序来测试它。在 Zabbix 服务器上，执行：\n\n```\n$ zabbix_get -s <Windows host IP> -k \"perf_counter[\\\
  238(_Total)\\1482]\"\n```\n\n这应该返回与 \\Processor(_Total)\\% Idle Time 键相同的数据：\n\n\
  ```\n99.577165\n```\n\n附加软件可以添加其他性能计数器，并且这些计数器的数值在不同系统之间可能有所不同。在某些情况下，软件会修改现有的性能计数器；例如，将防火墙软件供应商的名称添加到网络接口中。\n\
  \n## 使用性能计数器别名\n\n另一种在使用 Zabbix 配置时统一监控项键的方法是指定性能计数器别名（这样单个模板就可以用于所有主机）。为此，请在 Zabbix\
  \ 代理配置文件中添加 Alias 指令。\n\n例如，如果我们想将使用的性能计数器 Processor(_Total)\\% Idle Time 称为 cpu.idle_time，我们将添加以下内容：\n\
  \n```\nAlias = cpu.idle_time:perf_counter[\\Processor(_Total)\\% Idle Time]\n```\n\
  \n> 进行更改后，不要忘记重新启动代理。\n\n在具有不同区域设置的系统上，Alias 条目将使用不同的性能计数器，但从现在起，我们可以对所有系统使用相同的监控项键：cpu.idle_time。\n\
  \n## 随时间对性能计数器取平均值\n\nZabbix 代理还有另一个 Windows 特有的功能。它可以收集性能计数器值并返回平均值。这样，我们可以平滑那些返回最后一秒数据的计数器，并减少错过异常数据的可能性。例如，我们可以在代理守护进程配置文件中添加如下一行：\n\
  \n```\nPerfCounter = disk.writes,\"\\PhysicalDisk(_Total)\\Disk Writes/sec\",300\n\
  ```\n\n基于此，代理将每秒从该性能计数器收集值，并计算五分钟内的平均值。然后，我们可以每五分钟查询一次代理，并准确了解每秒平均写入次数。如果我们不使用平均值，我们只能每五分钟获取最后一秒的数据。\n\
  \n## 查询 WMI\n\n除了对性能计数器的内置支持外，Zabbix 代理还支持 WMI 查询。\n\n> Zabbix 通过 Zabbix 代理支持 WMI——目前不支持远程\
  \ WMI。\n\n要提取一些有用的信息，我们需要一个 WMI 查询，并且我们可能希望快速测试这些查询——这可以在 Windows 中完成，也可以通过使用 Zabbix\
  \ 代理来完成。在 Windows 方面，可以使用 wbemtest.exe 实用程序。启动它时，单击“连接”，接受默认的 root\\cimv2 命名空间，然后再次单击“连接”。然后，在如下所示的对话框中，单击“查询”：\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_539_0.png)\n\n## 监控 Windows\n\n您可以在此处输入完整的查询。例如，我们可以使用以下查询获取当前时区：\n\
  \n```\n```sql\nSELECT StandardName FROM Win32_TimeZone\n```\n```\n\n![](img/f5313a804532fabacc8d07cc8607eeba_540_0.png)\n\
  \n另一种通过 Zabbix 代理测试此类查询的方法是使用 zabbix_get 实用程序，这在*第 3 章“使用 Zabbix 代理和基础协议进行监控”*中讨论过。\n\
  \n有了可用的查询，我们可以继续创建监控项。导航到**配置 | 主机**，单击**Windows 主机**旁边的**监控项**，然后单击**创建监控项**。填写以下内容：\n\
  \n- **名称：** `Time zone`\n- **键：** `wmi.get[root\\cimv2,SELECT StandardName FROM\
  \ Win32_TimeZone]`\n- **信息类型：** **字符**\n- **更新间隔：** `300`\n\n这里的键是 wmi.get，第一个参数是命名空间，第二个参数是查询本身。我们不期望时区经常变化，所以我们稍微增加了更新间隔——通常人们会使用更大的间隔，但我们都希望第一个值能尽快出现。完成后，单击底部的“添加”按钮。检查“监控\
  \ | 最新数据”——大约五分钟后，值应该会出现：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_541_0.png)\n\
  \n这样，您可以监控 WMI 查询的任何输出——但请注意，应返回单个值；不支持多个值。如果返回多个值，则只处理第一个值。\n\n## 监控 Windows 服务\n\
  \n还有一个 Windows 特有的监控项类别：用于 Windows 服务状态监控的专用键。现在让我们尝试监控一个服务。首先，我们必须弄清楚如何引用此服务。为此，打开服务列表，然后打开某个服务的详细信息——让我们选择\
  \ DNS Client：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_541_1.png)\n\n查看此选项卡的顶部。服务名称是我们必须使用的名称，我们可以看到它与显示名称明显不同——该名称不是\
  \ DNS Client，而是 Dnscache。现在让我们创建监控项。导航到“配置 | 主机”，单击 Windows 主机旁边的“监控项”，然后单击“创建监控项”。输入以下值：\n\
  \n- 名称：DNS 客户端服务状态\n- 键：service.info[Dnscache]\n\n> 服务名称不区分大小写。\n> 这里使用的键 service.info\
  \ 是 Zabbix 3.0 中新增的。旧版本的 Zabbix 使用 service_state 键。该键已弃用，但仍受支持，您可能会在较旧的 Zabbix 安装和模板中看到它。service.info\
  \ 键有更多参数——有关完整文档，请参阅 Zabbix 手册。\n\n完成后，单击底部的“添加”按钮，打开“监控 | 最新数据”，并查找我们新添加的监控项：\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_542_0.png)\n\n因此数据已收集，状态为“0”。这可能是正常的，但我们怎么知道状态数字的含义？回到“配置\
  \ | 主机”，单击 Windows 主机旁边的“监控项”，然后在“名称”列中单击“DNS 客户端服务状态”。看看我们的老朋友——“显示值”属性。单击“显示值映射”链接并检查列表底部的映射：\n\
  \nWindows 服务状态\n0 ⇒ 正在运行\n1 ⇒ 已暂停\n2 ⇒ 正在启动\n3 ⇒ 正在暂停\n4 ⇒ 正在继续\n5 ⇒ 正在停止\n6 ⇒ 已停止\n\
  7 ⇒ 未知\n255 ⇒ 没有此服务\n\n事实证明，已经有一个预定义的 Windows 服务状态映射可用。关闭此窗口，在“显示值”下拉列表中选择“Windows\
  \ 服务状态”，然后单击“更新”。回到“监控 | 最新数据”，验证服务状态现在是否以更用户友好的方式显示：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_543_0.png)\n\
  \n现在，我们将能够轻松识别前端中的不同服务状态。监控项就位后，让我们还创建一个触发器，以便在服务停止时提醒我们。转到“配置 | 主机”，单击 Windows\
  \ 主机旁边的“触发器”，然后单击“创建触发器”。在“名称”字段中输入“{HOST.NAME} 上的 DNS 客户端服务已停止”，然后在“表达式”字段旁边单击“添加”。单击“监控项”字段旁边的“选择”，选择“DNS\
  \ 客户端服务状态”，然后单击“插入”。等等，值为 0 表示服务正在运行；我们实际上应该测试值不为 0。我们刚才没有使用改变插入表达式的下拉功能：\n\n```\n\
  {Windows host:service.info[Dnscache].last()}<>0\n```\n\n将严重性更改为“警告”，然后单击底部的“添加”按钮。除非这是生产系统，否则停止此服务应该是相当安全的——请停止该服务，并观察“监控\
  \ | 触发器”；在“组”下拉列表中选择“Windows 服务器”。Zabbix 现在应该警告您此服务已停止：\n\n| 严重性 | 状态 | 信息 | 最近更改\
  \ ▼ | 时长 | 确认 | 主机 | 名称 |\n| 警告 | 问题 |  | 2016-05-14 19:09:25 | 20秒 | 否 1 | Windows\
  \ 主机 | Windows 主机上的 DNS 客户端服务已停止 |\n\n## 检查自动服务\n\n有时我们对每个服务的确切细节不感兴趣，而且我们可能必须为每个服务手动配置监控项和触发器。相反，我们可能希望看到高层次的概览；例如，是否有任何自动启动的服务已停止。Zabbix\
  \ 提供了一个监控项，使您能够非常轻松地进行此类比较：services。它允许我们根据不同的参数检索服务列表，包括那些应该自动启动但已停止的服务。我们如何使用它？\n\
  \n应使用以下键添加监控项：\n\n```\nservices[automatic, stopped]\n```\n\n\n\n\n\n要查看所有支持的服务键参数列表，请查阅\
  \ Zabbix 手册。\n\n这将负责获取所需的数据。每当一个设置为自动启动的服务被停止时，它就会列在此项的数据中。\n\n也有可能在某些 Windows 版本中存在一些本应自动启动随后又关闭的服务。在这种情况下，它们会出现在列表中并破坏我们的监控。幸运的是，Zabbix\
  \ 对此问题也有解决方案——我们可以向此键添加第三个参数并列出要从此检查中排除的服务。例如，要排除 RemoteRegistry 和 sppsvc 服务，键应为：\n\
  \n```\nservices[automatic, stopped, \"RemoteRegistry, sppsvc\"]\n```\n\n注意要排除的服务是以逗号分隔的，并且整个列表包含在双引号中。\n\
  \n如果不同主机上此类服务的列表不同，请考虑使用用户宏来保存服务列表。我们在第 8 章《使用模板简化复杂配置》中讨论了用户宏。\n\n那么我们在触发器中如何检查一切是否正常呢？如果列表为空，Zabbix\
  \ agent 会返回 0。因此，只需简单检查最后的值是否为零，我们就可以在自动启动的服务被停止时触发。用于此类检查的触发器表达式为：\n\n```\n{Windows\
  \ host:services[automatic, stopped].last()}<>0\n```\n\n当然，你可以应用一种方法——例如使用 count()\
  \ 函数——仅在非零状态持续超过一次检查后才触发触发器：\n\n```\n{Windows host:services[automatic, stopped].count(#3,0)}=0\n\
  ```\n\n这样的触发器表达式只有在最近三次检查中至少有一次存在此类停止的服务时才会触发。\n\n## 服务发现\n\n前述方法只会告诉你某个本应运行的服务已停止。要知道是哪项服务，我们需要查看项值。我们实际上可以单独监控所有服务，因为\
  \ Zabbix 从 3.0 版本开始就支持 Windows 服务发现。让我们发现所有 Windows 服务并监控它们上的某些参数——我们可以在这里选择服务描述。\n\
  \n导航到 **Configuration | Hosts**，点击 **Windows host** 旁边的 **Discovery**，然后点击 **Create\
  \ discovery rule**。填写以下内容：\n\n- **Name:** `Windows service discovery`\n- **Key:**\
  \ `service.discovery`\n- **Update interval:** `300`\n\n我们使用了内置的 agent 键并增加了更新间隔。在生产环境中，更进一步增加间隔可能是个好主意；对于发现规则，平均默认间隔为一小时可能是一个不错的选择。完成后，点击底部的\
  \ **Add** 按钮。我们有了规则本身；现在我们需要一些原型——点击 **Item prototypes**，然后点击 **Create item prototype**。在填写数据之前，了解此发现项返回什么内容会很有用——一个服务的示例如下：\n\
  \n```json\n{\n    \"{#SERVICE.STARTUP}\": 0,\n    \"{#SERVICE.DISPLAYNAME}\": \"\
  Zabbix Agent\",\n    \"{#SERVICE.DESCRIPTION}\": \"Provides system monitoring\"\
  ,\n    \"{#SERVICE.STATENAME}\": \"running\",\n    \"{#SERVICE.STARTUPNAME}\": \"\
  automatic\",\n    \"{#SERVICE.USER}\": \"LocalSystem\",\n    \"{#SERVICE.PATH}\"\
  : \"C:\\\\zabbix\\\\zabbix_agentd.exe\" --config \"c:\\\\zabbix\\\\zabbix_agentd.win.conf\"\
  ,\n    \"{#SERVICE.STATE}\": 0,\n    \"{#SERVICE.NAME}\": \"Zabbix Agent\"\n}\n\
  ```\n\n> Zabbix agent 可以使用 `zabbix_get` 查询原始的 LLD 数据。我们在 *第 12 章，自动化配置* 中更详细地讨论了低级发现。\n\
  \n此片段还显示了我们对每个服务可能监控的其他内容。目前，我们希望提取所有服务的描述，但要添加项我们需要实际的服务名称。虽然描述在这里可用，但我们将在项中查询它，因此对于项原型，它实际上是宏\
  \ `{#SERVICE.NAME}`。有了这些知识，我们就可以填写项原型表单：\n\n- **Name:** `Service $1 description`\n\
  - **Key:** `service.info[{#SERVICE.NAME},description]`\n- **Type of information:**\
  \ **Character**\n- **Update interval:** `300`\n\n完成后，点击底部的 **Add** 按钮。我们的发现每五分钟运行一次，可能需要长达五分钟才能使此原型生成实际的项，然后这些项获取其第一个值可能需要长达六分钟——加上配置缓存更新和项间隔的时间。首先，前往\
  \ Windows 主机的项配置。过一段时间后，我们的发现规则应该会添加项：\n\n| Windows service discovery: Service SysMain\
  \ description | service.info[SysMain,description] |\n| Windows service discovery:\
  \ Service svpwrv description | service.info[svpwrv,description] |\n| Windows service\
  \ discovery: Service TabletInputService description | service.info[TabletInputService,description]\
  \ |\n| Windows service discovery: Service svsvc description | service.info[svsvc,description]\
  \ |\n| Windows service discovery: Service SystemEventsBroker description | service.info[SystemEventsBroker,description]\
  \ |\n| Windows service discovery: Service SSDPSRV description | service.info[SSDPSRV,description]\
  \ |\n\n很可能会有相当数量的此类项。访问 **Monitoring | Latest data**，再过几分钟后我们应该能看到所有服务的描述：\n\n|\
  \ Service ADWS description | 2016-05-14 19:21:58 | This service provides a Web Service\
  \ interface to instances of the directory ser... |\n| Service AeLookupSvc description\
  \ | 2016-05-14 19:21:59 | Processes application compatibility cache requests for\
  \ applications as they a... |\n| Service ALG description | 2016-05-14 19:22:00 |\
  \ Provides support for 3rd party protocol plug-ins for Internet Connection Sharing\
  \ |\n| Service AppHostSvc description | 2016-05-14 19:22:01 | Provides administrative\
  \ services for IIS, for example configuration history and ... |\n| Service AppIDSvc\
  \ description | 2016-05-14 19:22:02 | Determines and verifies the identity of an\
  \ application. Disabling this service w... |\n\n更常见的做法是监控当前服务状态或其启动配置——`service.info`\
  \ 键支持的任何内容都应该是可能的。\n\n> 我们也可以使用任何 LLD 宏来过滤发现的服务。例如，通过过滤 {#SERVICE.STARTUP}，我们可以仅发现配置为自动启动的服务（值\
  \ 0），或延迟自动启动的服务（值 1）。\n\n## Windows 事件日志监控\n\nZabbix 也支持在 Windows 上进行日志文件监控——我们在\
  \ *第 11 章，高级项监控* 中讨论的话题仍然适用。但在 Windows 上还有一个专门的日志子系统，而 Zabbix 确实提供了内置的事件日志系统支持。Windows\
  \ 有各种事件日志类别，我们可以监控安全事件日志。其他常见日志有系统和应用程序，并且在较新的 Windows 版本中会有更多日志。现在，让我们前往 **Configuration\
  \ | Hosts**，点击 **Windows host** 旁边的 **Items**，然后点击 **Create item**。填写以下内容：\n\n-\
  \ **Name:** `Windows $1 log`\n- **Type:** **Zabbix agent (active)**\n- **Key:**\
  \ `eventlog[Security,,,,,,skip]`\n- **Type of information:** **Log**\n- **Update\
  \ interval:** `1`\n\n> Windows 上的事件日志监控作为活动项工作，与普通文件日志监控相同。\n\n这是项键中的六个逗号。完成后，点击底部的\
  \ **Add** 按钮。我们在此指定的最后一个参数 `skip` 将防止 agent 读取整个安全日志——对于存在一段时间了的系统来说，这是一个非常好的主意。访问\
  \ **Monitoring | Latest data** 并点击 **Windows Security log** 项的 **History**：\n\n\
  ![](img/f5313a804532fabacc8d07cc8607eeba_547_0.png)\n\n## 监控 Windows\n\n> 如果没有值出现，请登录到\
  \ Windows 系统——这应该会在此日志中生成一些条目。\n\n与普通日志文件监控相比，有几个值得注意的差异，包括 LOCAL TIME 列中的自动数据填充，以及源、严重性和事件\
  \ ID 被存储。实际上，我们已经可以在 agent 级别按这些内容进行过滤；我们不必将所有条目发送到服务器。让我们更详细地讨论一些项键参数。通用的键语法如下：\n\
  \n```\neventlog[name,<regexp>,<severity>,<source>,<eventid>,<maxlines>,<mode>]\n\
  ```\n\n第二个参数 regexp 的操作方式与普通日志文件监控中相同——它将正则表达式与日志条目进行匹配。maxlines 和 mode 参数的工作方式与\
  \ log 和 logtr 项键相同。severity、source 和 eventid 参数是 eventlog 键特有的，它们都是要与相应字段匹配的正则表达式。这样，我们就可以在\
  \ agent 端对 eventlog 进行相当广泛的过滤，但人们有时会犯一个相当常见的错误——他们忘记了这些是正则表达式，而不是精确匹配字符串。这意味着什么？嗯，以下项键不仅会匹配\
  \ ID 为 13 的事件，如下所示：\n\n```\neventlog[security,,,13]\n```\n\n它也会匹配 ID 为 133、1333\
  \ 和 913 的事件。要仅匹配 13，我们必须锚定正则表达式：\n\n```\neventlog[security,,,^13$]\n```\n\n> 请记住，这对于\
  \ severity 和 source 参数也是如此——虽然它们不太可能匹配到 unintended 值，但在希望精确匹配时应始终确保表达式已锚定。\n\n\n\
  \n\n\n### 总结\n\n在本章中，我们探讨了 Windows 上的各种差异特性，以及 Zabbix 明确支持 Windows 的功能。\n\n我们将 Zabbix\
  \ 代理作为 Windows 服务安装，并验证了在许多方面它与 Linux 代理的工作方式完全相同。接着，我们转向 Windows 特有的功能支持：\n\n-\
  \ 性能计数器\n- 使用 Zabbix 代理的 WMI\n- Windows 服务，包括自动发现这些服务的能力\n- 事件日志系统\n\n我们不仅讨论了所有这些功能的细节和潜在问题，还使用这些功能监控了一些数据。结合我们现在已经掌握的通用监控和报告知识，这应该使我们能够高效地监控\
  \ Windows 安装。\n\n在探索了大量底层配置之后，下一章我们将关注更偏向业务的方面——SLA 监控。Zabbix 允许我们创建 IT 服务树，分配描述服务可用性的触发器，并计算\
  \ SLA 的符合程度。\n"
- "## 15 高层业务服务监控\n\n监控 IT 系统通常涉及大量细小细节——CPU、磁盘、内存统计、进程状态以及无数其他参数。所有这些都非常重要，每个细节都应为技术人员所用。但归根结底，这些系统的目标不是拥有足够的磁盘空间——而是满足特定的业务需求。如果只关注底层细节，就很难判断当前问题可能对用户造成什么影响。Zabbix\
  \ 提供了一种更高层视角的方式，称为 **IT 服务**。可以配置单个系统之间的关系，以了解它们如何协同交付服务，并且可以针对生成树中的任何部分启用 **服务等级协议（SLA）**\
  \ 计算。\n\n### 确定服务树\n\n在配置任何东西之前，先思考整个设置是非常有用的，对于 IT 服务更是如此。一个庞大的服务树可能看起来很有气势，但它可能无法很好地代表实际功能，甚至可能掩盖真实的系统状态。磁盘空间不足很重要，但它实际上并不会使系统宕机——它不会影响\
  \ SLA。最佳方法可能只包含那些能确定服务可用或运行状态可被接受的特定检查——例如，SLA 可能要求维持一定的性能水平。除非我们想要一个庞大而复杂的 IT 服务树，否则我们应该识别交付服务的关键因素并监控它们。\n\
  \n我们的服务树可能如下所示：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_553_0.png)\n\n如果顶层一切正常，我们就知道所有客户都满意。如果并非如此，我们就能看到哪个客户的某个系统出了问题，并看到哪个系统受到影响。工单系统宕机会影响两个客户。而这些服务之下的任何内容——嗯，那属于运维监控。\n\
  \n不幸的是，如果不长期收集数据，IT 服务功能并不容易评估；当我们拥有几周或更长时间的数据时，SLA 图表才更有意义。也许我们可以发送数据并假装它是过去的数据。实际上，我们确实可以这样做。我们在第\
  \ 11 章“高级监控项监控”中讨论过的小而强大的工具 zabbix_sender，允许我们为每个值指定时间戳。这意味着我们将创建 Zabbix 采集器监控项，并向其中推送值。\n\
  \n### 创建测试监控项和触发器\n\n前往“配置 | 主机”并点击“创建主机”。通常，此类监控项会存在于不同的主机中，但对于我们的测试设置，使用一台主机是最佳选择。在“主机名称”和“新建组”字段中输入\
  \ `IT services`，并确保“加入组”选择框中没有任何组，然后点击底部的“添加”按钮。在“组”下拉框中选择 IT services，点击 IT services\
  \ 旁边的“监控项”，然后点击“创建监控项”。这样，我们将使用以下设置创建三个不同的监控项：\n\n- 名称：代码仓库服务\n- 类型：Zabbix 采集器\n\
  - 键：code_repo\n- 新应用：IT services\n\n你可以使用监控项克隆功能来更快地创建其余两个监控项。对于其余监控项，使用“应用”字段而不是“新应用”字段：\n\
  \n- **名称：** 仓库分析服务\n- **类型：** Zabbix 采集器\n- **键：** warehouse_analytics\n- **应用：**\
  \ IT services\n\n对于最后一个监控项：\n\n- **名称：** 工单服务\n- **类型：** Zabbix 采集器\n- **键：** ticketing\n\
  - **应用：** IT services\n\n最终的监控项列表应如下所示：\n\n| 名称 ▲ | 触发器 | 键 | 间隔 | 历史 | 趋势 | 类型\
  \ | 应用 |\n|---|---|---|---|---|---|---|---|\n| 代码仓库服务 |  | code_repo |  | 90d |\
  \ 365d | Zabbix 采集器 | IT services |\n| 工单服务 |  | ticketing |  | 90d | 365d | Zabbix\
  \ 采集器 | IT services |\n| 仓库分析服务 |  | warehouse_analytics |  | 90d | 365d | Zabbix\
  \ 采集器 | IT services |\n\n现在点击监控项列表上方导航栏中的“触发器”，然后点击“创建触发器”。按如下设置创建三个触发器。第一个触发器：\n\
  \n- **名称：** 代码仓库宕机\n- **表达式：** {IT services:code_repo.last()}=0\n- **严重性：** 高\n\n\
  第二个触发器：\n\n- **名称：** 仓库分析宕机\n- **表达式：** {IT services:warehouse_analytics.last()}=0\n\
  - **严重性：** 高\n\n第三个触发器：\n\n- **名称：** 工单宕机\n- **表达式：** {IT services:ticketing.last()}=0\n\
  - **严重性：** 高\n\n| 严重性 | 名称 | 表达式 |\n|---|---|---|\n| 高 | 代码仓库宕机 | `{IT services:code_repo.last()}=0`\
  \ |\n| 高 | 工单宕机 | `{IT services:ticketing.last()}=0` |\n| 高 | 仓库分析宕机 | `{IT services:warehouse_analytics.last()}=0`\
  \ |\n\n> \U0001F4A1 为了保持简短，我们这里没有在触发器名称中包含主机名——对于生产系统，你很可能需要这样做。\n\n在这些触发器中，严重性设置非常重要。默认情况下，Zabbix\
  \ 触发器具有最低严重性，**“未分类”**。IT 服务中的 SLA 计算会忽略两个最低严重性，**“未分类”**和**“信息”**。这似乎没有功能上的益处，原因很可能是历史遗留的。用户经常会创建快速测试触发器，却发现\
  \ SLA 计算不生效，这种现象很常见。在创建触发器时，由于严重性设置对于快速测试相对不重要，所以往往不会被修改。幸运的是，我们知道这一点，并创建了可用于 SLA\
  \ 计算的触发器。\n\n### 配置 IT 服务\n\n我们离发送这些略假的数据越来越近了，但在数据进来之前，我们必须配置 IT 服务。在 Zabbix 中，SLA\
  \ 结果不能追溯计算。IT 服务必须在我们想要收集 SLA 的期间开始时配置。SLA 状态与触发器和事件信息分开存储，由 Zabbix 服务器在运行时计算。\n\
  \n让我们转到**配置 | IT 服务**。管理 **IT 服务**的界面与 Zabbix 中大多数其他地方不同。我们有一个**根**，它是一个不可变条目。所有其他服务条目都必须作为其子项添加。点击根条目旁边的**添加子项**。\n\
  \n我们将首先把所有客户服务分组到一个条目中——稍后我们可能会有内部服务。在**名称**字段中输入 `Customer services`，然后点击底部的**添加**按钮。\n\
  \n我们有两个客户——点击**客户服务**旁边的**添加子项**。在**名称**字段中输入 `Banana`（香蕉），启用**计算 SLA**复选框，然后点击**添加**。\n\
  \n> 添加新服务条目时，默认可接受的 SLA 级别为 99.05，我们将所有服务保持在此级别。编辑现有服务条目时，默认值则为 99.9。在撰写本文时，尚不清楚这个问题何时会得到修复。\n\
  \n再次点击**客户服务**旁边的**添加子项**。在**名称**字段中输入“菠萝”，启用**计算 SLA**复选框，然后点击**添加**。注意，**客户服务**条目现在可以展开了。展开它并观察结果，应该如下所示：\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_556_0.png)\n\n客户已经就位；现在让我们添加他们的服务。点击**香蕉**旁边的**添加子项**。在**名称**字段中输入“代码仓库”，并启用**计算\
  \ SLA**复选框。这将是我们服务的“叶子”或底层服务，我们现在将其链接到一个触发器。触发器状态将影响此服务和所有启用了 SLA 计算的上层服务的 SLA 状态。点击**触发器**字段旁边的**选择**，然后在**名称**列中点击**代码仓库宕机**。此服务的最终配置应如下所示：\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_556_1.png)\n\n\n\n\n\n## 高层业务服务监控\n\n\
  如果条目已为你折叠，请全部展开并查看最终树：\n\n| 服务 | 操作 | 状态计算 | 触发器 |\n|---|---|---|---|\n| 根 | 添加子项\
  \ |  |  |\n| 客户服务 | 添加子项 | 如果至少一个子项存在问题，则存在问题 |  |\n| 香蕉 | 添加子项 | 如果至少一个子项存在问题，则存在问题\
  \ |  |\n| 代码仓库 | 添加子项 删除 | 如果至少一个子项存在问题，则存在问题 | 代码仓库故障 |\n| 工单系统 | 添加子项 删除 | 如果至少一个子项存在问题，则存在问题\
  \ | 工单系统故障 |\n| 菠萝 | 添加子项 | 如果至少一个子项存在问题，则存在问题 |  |\n| 工单系统 | 添加子项 删除 | 如果至少一个子项存在问题，则存在问题\
  \ | 工单系统故障 |\n| 仓库分析 | 添加子项 删除 | 如果至少一个子项存在问题，则存在问题 | 仓库分析故障 |\n\n请注意，我们从公司层级开始启用了SLA计算。计算所有客户的总SLA可能不是常见需求，但也可以实现。在**状态计算**列中，我们所有的服务都采用**如果至少一个子项存在问题，则存在问题**。在**服务**属性中，我们也可以选择**如果所有子项都存在问题时才存在问题**。目前，这些是问题状态传播仅有的选项；无法设置子服务的百分比或数量（例如，对于集群解决方案可能很有用）。\n\
  \n### 发送数据\n\n现在该发送我们的数据了，这些数据会有点假。如前所述，当数据覆盖较长时间时，IT服务/SLA功能会更有趣，我们可以尝试发送一年的数据。当然，我们不会手动创建——我们将生成数据。在Zabbix服务器上创建如下脚本：\n\
  \n```bash\n#!/bin/bash\nhostname=\"IT services\"\ntime_period=$[3600*24*365] # 365\
  \ days\ninterval=3600 # one hour\nprobability=100\ncurrent_time=$(date \"+%s\")\n\
  for item_key in code_repo warehouse_analytics ticketing; do\n    [[ -f $item_key.txt\
  \ ]] && {\n        echo \"file $item_key.txt already exists\"\n        exit\n  \
  \  }\n    for ((value_timestamp=$current_time-$time_period;\n          value_timestamp<$current_time;\n\
  \          value_timestamp=$value_timestamp+$interval)); do\n```\n\n```\necho \"\
  \\\"$hostname\\\" $item_key $value_timestamp\n$([ [ $(( ${RANDOM}%$probability)\
  \ ) < 1 ]] && echo 0 ||\necho 1)\" >> $item_key.txt\ndone\ndone\n```\n\n此脚本将从当前时间开始，为过去一年中的每个小时为我们的三个监控项键生成值。每个条目都有小概率获得值0，表示失败。结果将是随机的，但应该在我们可接受的SLA水平附近波动，所以希望我们能够看到一些服务达到SLA水平，而另一些则没有。由于所有值都以一小时为间隔发送，并且连续两次失败的可能性很小，所以停机时间不应超过一小时。假设脚本保存为`generate_values.sh`，只需运行一次：\n\
  \n```\n$ ./generate_values.sh\n```\n\n应该生成三个文件：\n\n- code_repo.txt\n- ticketing.txt\n\
  - warehouse_analytics.txt\n\n> 以下操作可能会生成大量告警邮件。如果你想避免这种情况，请禁用我们之前添加的动作。\n\n现在对每个文件运行`zabbix_sender`：\n\
  \n```\n$ zabbix_sender -z 127.0.0.1 -T -i code_repo.txt\n$ zabbix_sender -z 127.0.0.1\
  \ -T -i ticketing.txt\n$ zabbix_sender -z 127.0.0.1 -T -i warehouse_analytics.txt\n\
  ```\n\n每次调用的输出应类似于：\n\n```\ninfo from server: \"processed: 250; failed: 0; total:\
  \ 250; seconds spent: 0.001747\"\n...\ninfo from server: \"processed: 10; failed:\
  \ 0; total: 10; seconds spent: 0.000063\"\nsent: 8760; skipped: 0; total: 8760\n\
  ```\n\n我们现在查看的是**最近7天**的报告，如右上角所示。展开那里的下拉菜单，查看可用选项：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_561_0.png)\n\
  \n可以尝试这些选项，看看我们的随机数据是达到还是没有达到预期的SLA水平。遗憾的是，目前还无法为任意时间段生成这样的报告——如果你想查看两个月前某个特定周的SLA值，那就不走运了。\n\
  \n此页面上还隐藏着其他几个报告。点击这些选项将得到以下结果：\n\n- **服务名称**：打开该服务的可用性报告\n- **触发器名称**（如果链接到服务）：打开该触发器的事件历史记录\n\
  - **SLA条形图**：打开该服务的年度可用性图表\n\n现在让我们点击**香蕉**——这将打开可用性报告。\n\n默认情况下，它显示当前年份的周度报告。让我们在**周期**下拉菜单中选择**年度**：\n\
  \n| 年份 | 正常 | 问题 | 停机时间 | SLA | 可接受的SLA |\n|---|---|---|---|---|---|\n| 2016 | 134d\
  \ 0h 4m | 2d 7h 0m |  | 98.3186 | 99.0500 |\n| 2015 | 360d 18h 0m | 4d 6h 0m | \
  \ | 98.8356 | 99.0500 |\n| 2014 | 365d 0h 0m |  |  | 100.0000 | 99.0500 |\n| 2013\
  \ | 365d 0h 0m |  |  | 100.0000 | 99.0500 |\n| 2012 | 366d 0h 0m |  |  | 100.0000\
  \ | 99.0500 |\n| 2011 | 365d 0h 0m |  |  | 100.0000 | 99.0500 |\n\n## 高层业务服务监控\n\
  \n这是过去五年的报告，几乎总是跨越六个日历年度——这就是为什么我们有六个条目。在这里和其他地方，Zabbix SLA计算假设我们会获得问题信息——如果没有问题信息，Zabbix会假定该时段服务是可用的。在这个页面上，我们还可以选择**月度**、**周度**和**每日**时间段——对于所有这些，都可以选择一个年份，并显示该年所有月份、周或日的数据。查看年份列表时，可以看到可用的年份与年度报告中的相同——即跨越六个日历年的五年：\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_562_0.png)\n\n点击触发器名称（如果触发器已链接到服务）将显示该触发器的事件历史记录。我们已经在*第6章，使用触发器检测问题*中查看过事件视图，因此这里不再多花时间。\n\
  \n现在让我们回到**监控 | IT服务**，点击**问题时间**列中的某个条形。将显示年度SLA图：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_562_1.png)\n\
  \n每列代表一周。该服务宕机的时间在顶部以红色显示。我们的服务大部分时间都在运行，但我们可以看到大多数周都有一些停机时间。\n\n无论是可用性报告还是年度图，都没有什么可配置的，时间周期无法设置为自定义时间——我们只能使用预定义的时间段，并且无法自定义SLA图的大小或其他参数。对于年度图，我们只能查看当前年份。\n\
  \n> 无法限制对IT服务监控和报告的访问——它们对所有用户开放，此处不考虑普通权限。\n\n### 指定正常运行时间和停机时间\n\n配置好SLA监控后，我们可以愉快地确保系统平稳运行；我们在合理安排的计划维护时段内进行维护，却发现SLA水平下降了。你以为维护期间的停机不会被计入SLA监控吗？错了。Zabbix主机和主机组级别的维护不会影响SLA监控。如果某项服务在此类维护期间宕机，Zabbix仍会将其视为不可接受的不可用状态。\n\
  \n> 主机和主机组级维护已在*第5章，管理主机、用户和权限*中讨论过。\n\n不过，有一种方法可以避免计算特定时段的SLA数据。让我们转到**配置 | IT服务**，点击**代码仓库**。在服务属性中，切换到**时间**选项卡。在这里我们可以添加三种类型的时间段：\n\
  \n- **正常运行时间**\n- **停机时间**\n- **一次性停机时间**\n\n\n\n\n\n让我们从最简单的开始——一次性停机（One-time\
  \ downtime）。在添加这样的时间段时，我们可以在“备注”（Note）字段中输入简短描述，并选择“从-至”（From-Till）的日期和时间：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_564_0.png)\n\
  \n不过，备注并没有太多实际用途——它只显示在已配置时间列表中，如前面的截图所示。\n\n“停机”（Downtime）选项允许我们定义不参与 SLA 计算的时间段：\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_564_1.png)\n\n这是按周进行的，我们可以选择星期几和时间，精确到分钟。遗憾的是，这是\
  \ Zabbix 中唯一一个一周从星期日开始的地方。最大的问题是这些时间段不能跨越星期的边界，因此实际上无法一次性为周末添加 SLA 计算停机时间——我们必须为星期六添加一条记录，再为星期日添加一条。\n\
  \n那么“运行时间”（Uptime）选项呢？它的工作方式正好相反。如果添加了运行时间条目，SLA 计算只会在该时间段内进行；所有其他时间都被视为“停机时间”。\n\
  \n当然，在添加这些时间段时，应该遵循实际协议中的条款，而不是利用它来把问题从 SLA 计算中隐藏起来，对吧？\n\n## 小结\n\n在本章中，我们稍微偏离了对\
  \ CPU、磁盘和内存的低层监控。我们讨论了一种更高层次的监控，即面向业务服务的监控，在 Zabbix 中称为“IT 服务”。我们能够配置服务树来表示现实中的依赖关系和结构，将单个条目关联到触发器以将问题状态传播到服务，并为这些服务配置\
  \ SLA 计算。我们没有大型 IT 系统可以测试，因此发送了模拟数据并观察生成的各种报告，包括服务可用性报告和年度 SLA 图表。\n\n关于 Zabbix\
  \ 中的 IT 服务功能，我们注意到了两个重要事实：\n\n- 计算 SLA 时，严重级别为“未分类”或“信息”的触发器将被忽略\n- SLA 信息无法在事后计算——必须先配置好\
  \ IT 服务\n\n对于那些 SLA 不覆盖全天候的服务，我们了解了如何根据每周时间段来指定 SLA 计算的发生时间——但我们也注意到，主机和主机组级别的维护不影响\
  \ SLA 计算，且运行时间/停机时间配置必须针对 IT 服务本身进行。\n\n在下一章中，我们将回到更底层的监控——甚至比之前更底层。我们将介绍如何直接使用智能平台管理接口（IPMI）来监控硬件。Zabbix\
  \ 既支持监控“普通”或模拟 IPMI 传感器，也支持离散 IPMI 传感器。甚至有一个专门用于离散传感器的触发器函数。它是什么？详见下一章。\n\n## 监控\
  \ IPMI 设备\n\n到目前为止，我们已经熟悉了使用 Zabbix agent、SNMP 以及其他几种方法进行监控。虽然 SNMP 非常流行，并且大多数联网设备都支持，但还有另一种面向系统管理和监控的协议：**智能平台管理接口（IPMI）**。IPMI\
  \ 通常作为一个独立于主机操作系统的管理和监控模块来实现，甚至在机器关机时也能提供信息。IPMI 变得越来越流行，Zabbix 直接支持 IPMI。IPMI 在所谓的**灯光关闭**（lights-out）或**带外**（out-of-band）管理卡上尤其常见，如今大多数服务器硬件都提供这种管理卡。因此，直接通过这些管理卡来监控硬件状态可能是很理想的，因为这不依赖于操作系统类型，甚至与操作系统是否正在运行无关。\n\
  \n### 获取 IPMI 设备\n\n在本节中，你需要一台支持 IPMI 的设备，通常是带有远程管理卡的服务器。这里的示例将使用真实硬件，可能会有供应商特有的怪异之处，但基本原则应该适用于任何供应商的任何产品。\n\
  \n### 准备 IPMI 监控\n\n要使用 IPMI 收集数据，必须相应地配置 Zabbix，并且设备必须接受来自 Zabbix 的连接。如果你通过软件包安装了\
  \ Zabbix，则应该已经具备 IPMI 支持。如果你从源代码编译了 Zabbix Server，也应包括 OpenIPMI 库支持。为确保无误，请检查服务器日志文件中的启动消息。确保关于\
  \ IPMI 的行显示为 YES：\n\n```\nIPMI monitoring:              YES\n```\n\n## 监控 IPMI 设备\n\
  \n这还不够——默认情况下，Zabbix Server 配置为不启动任何 IPMI 轮询器；因此，任何添加的 IPMI 监控项都不会工作。要更改此设置，请打开\
  \ `zabbix_server.conf` 并查找以下行：\n\n```\n# StartIPMIPollers=0\n```\n\n取消注释并将其设置为 3\
  \ 个轮询器，使其变为：\n\n```\nStartIPMIPollers=3\n```\n\n保存文件并重启 `zabbix_server`。\n\n在被监控设备一端，添加一个\
  \ Zabbix 将使用的用户。IPMI 标准规定了各种权限级别，对于监控来说，用户级别可能是最合适的。IPMI 用户的配置可以使用供应商提供的命令行工具、Web\
  \ 界面或其他方法完成。有关此步骤的详细信息，请查阅供应商特定文档。\n\n## 设置 IPMI 监控项\n\n在将 IPMI 监控项添加到 Zabbix 之前，我们应该测试\
  \ IPMI 访问。默认情况下，IPMI 使用 UDP 端口 623，请确保该端口未被防火墙阻止。检查你的 Zabbix 服务器是否安装了 `ipmitool`\
  \ 软件包——如果没有，请安装它，然后执行以下命令：\n\n```\n$ ipmitool -U zabbix -H <IP address of the IPMI\
  \ host> -I lanplus -L user sdr\nPassword:\n```\n\n提供你在 IPMI 配置中设置的密码。我们使用用户级访问，如\
  \ `-L user` 标志所指定，这样 Zabbix IPMI 用户就不需要管理员权限。`-I lanplus` 标志指示 `ipmitool` 使用 IPMI\
  \ v2.0 LAN 接口，而 sensor 命令则向主机查询可用的传感器。如果你的设备在非默认端口上运行 IPMI，可以使用 `-p` 标志指定端口。\n\n\
  > Zabbix 不使用 `ipmitool` 来查询 IPMI 设备，而是使用 OpenIPMI 库。这个库历史上曾有一些 bug，因此一个可用的 `ipmitool`\
  \ 实例并不能保证 Zabbix Server 上的 IPMI 监控一定有效。如有疑问，请使用最新版本的 OpenIPMI 进行测试。\n\n输出将包含大量传感器，可能包括如下内容：\n\
  \n```\nBB +5.0V      | 4.97 Volts   | ok\nBaseboard Temp | 23 degrees C | ok\nSystem\
  \ Fan 2    | 3267 RPM     | ok\nPower Unit Stat | 0x00        | ok\n```\n\n这些看起来是有用的数据，那么让我们尝试在\
  \ Zabbix 中监控风扇转速。在前端中，导航到 配置 | 主机。为了保持组织清晰，让我们为 IPMI 监控创建一个新主机——点击“创建主机”。然后输入以下值：\n\
  \n- **名称：** IPMI host\n- **组：** 在“其他组”框中点击 Linux servers，然后点击 ◄ 按钮，并确保“在组”列表框中没有其他组\n\
  - **IPMI 接口：** 点击“添加”控件并输入 IPMI 地址，然后点击“Agent 接口”旁边的“移除”\n\n> 某些 IPMI 解决方案在主网络接口上工作，拦截\
  \ IPMI 请求。在这种情况下，只需将相同的 IP 地址设置为用于 IPMI 即可。\n\n切换到 IPMI 标签页，并输入以下值：\n\n- **IPMI\
  \ 用户名：** 输入用于 IPMI 访问的用户名\n- **IPMI 密码：** 输入你为 IPMI 访问设置的密码\n\n> 如果你设置了较长的 IPMI\
  \ 密码，并在之后重新访问主机编辑界面，你会发现密码被截断了。这是正常的，因为 IPMI v2.0 的最大密码长度为 20 个字符。\n\n如果你的 IPMI\
  \ 配置不同，例如不同的权限级别、端口或其他参数，请相应地进行设置。完成后，点击底部的“添加”按钮。\n\n> 对于这个主机，我们复用了 Linux servers\
  \ 组——你也可以将其添加到单独的组中。\n\n\n\n\n\n# 创建IPMI监控项\n\n现在我们已经解决了IPMI连接的主机部分，是时候创建实际的监控项了。确保在**组**下拉框中选择了\
  \ **Linux服务器**，然后点击 **IPMI主机** 旁边的 **监控项**，接着点击 **创建监控项**。输入以下值：\n\n- **名称：** 输入\
  \ `System Fan 2`（或者，如果你的支持IPMI的设备没有提供此类传感器，请选择另一个有用的传感器）\n- **类型：** **IPMI agent**\n\
  - **键值：** `System_Fan_2`\n- **IPMI传感器：** `System Fan 2`\n- **单位：** `RPM`\n\n完成后，点击底部的\
  \ **添加** 按钮。\n\n> 对于此监控项类型，监控项键值仅用作监控项标识符，我们可以在此处输入任意字符串。我们选择使用传感器名称，并将空格替换为下划线，以便在触发器表达式和其他地方更容易识别该监控项。IPMI传感器名称将决定收集哪些数据。\n\
  \n在某些设备上，传感器名称可能带有尾随空格。这在 `ipmitool` 的默认传感器输出中并不明显。如果传感器名称看起来正确，但从Zabbix查询失败，请尝试从Zabbix服务器检索单个传感器的数据：\n\
  \n```\n$ ipmitool -U zabbix -H <IPMI主机的IP地址> -I lanplus -L user sensor get \"System\
  \ Fan 2\"\n```\n\n这将打印该传感器的详细信息。如果失败，则传感器名称可能不正确。\n\n让我们检查一下我们的工作成果；打开 **监测 | 最新数据**，然后在筛选器中选择\
  \ **IPMI主机**：\n\n| 名称 | 最后检查 | 最后值 |\n|---|---|---|\n| **- 其他 -** (1个监控项) |  | \
  \ |\n| System Fan 2 | 2016-05-18 12:26:49 | 3348 RPM |\n\n> 注意，该值完整显示，并未缩短为3.3K。RPM单位包含在硬编码的单位黑名单中，使用此类单位的监控项不会添加单位乘数前缀。我们将在*第22章，Zabbix维护*中更详细地讨论单位黑名单。\n\
  \n太好了，硬件状态信息被正确收集了。更棒的是，此信息的检索独立于已安装的操作系统或特定的代理程序，即使没有运行甚至没有安装操作系统，也可以检索到。\n\n>\
  \ 目前没有内置的低级发现支持。如果你希望发现可用的传感器，最好通过外部检查或使用Zabbix trapper监控项类型来实现低级发现规则本身。\n\n## 监控离散传感器\n\
  \n传感器列表显示了一些值很明确的传感器：温度、风扇转速等。但其中一些可能有点棘手。例如，你的传感器列表中可能有一个名为 `Power Unit Stat` 或类似的传感器。这些都是离散传感器。人们可能会希望它们能为\
  \ **OK** 状态返回0，为 **Failure** 状态返回1，但它们通常更复杂。例如，电源单元传感器实际上可以在一个检索值中返回关于八种不同状态的信息。让我们尝试监控它，看看在Zabbix中对于这样的系统能得到什么值。导航到\
  \ **配置 | 主机**，点击 **IPMI主机** 旁边的 **监控项**，然后点击 **创建监控项**。填写以下内容：\n\n- **名称：** 输入 `Power\
  \ Unit Stat`（或者，如果你的支持IPMI的设备没有提供此类传感器，请选择另一个有用的传感器）\n- **类型：** **IPMI agent**\n\
  - **键值：** `Power_Unit_Stat`\n- **IPMI传感器：** `Power Unit Stat`\n\n完成后，点击底部的 **添加**\
  \ 按钮。\n\n> 如果普通传感器可以工作，但离散传感器不行，请确保尝试使用最新版本的OpenIPMI库——旧版本会给离散传感器名称添加一个额外的 `.0`。\n\
  \n## 监控IPMI设备\n\n在 **最新数据** 部分检查此监控项——它很可能返回0。但它可能返回什么？它实际上是一个二进制值的十进制表示，其中每个位可以标识一个特定状态，通常是故障。对于此传感器，可能的状态列在*智能平台管理接口规范第二版v2.0*中。\n\
  \n> 该规范的最新版本可在以下地址获取：\n> `http://www.intel.com/content/www/us/en/servers/ipmi/ipmi-home.html`\n\
  \n根据该规范，各个十六进制值具有以下含义：\n\n| 十六进制值 | 含义 |\n|---|---|\n| 00h | 关机/断电 |\n| 01h | 电源循环\
  \ |\n| 02h | 240 VA断电 |\n| 03h | 互锁断电 |\n| 04h | 交流电丢失/电源输入丢失（电源单元的电源来源丢失） |\n|\
  \ 05h | 软电源控制故障（单元未响应开机请求） |\n| 06h | 检测到电源单元故障 |\n| 07h | 预测性故障 |\n\n查看第一个位的描述，二进制值0表示单元正在运行且报告无问题。二进制值1表示单元已断电。我们可以将返回值与0进行比较，这将表明单元一切正常，但如果我们想检查其他某些位——例如\
  \ **“预测性故障”** 位呢？如果只设置了该位，监控项将返回128。如前所述，离散监控项返回二进制值的十进制表示。原始二进制值为 `10000000`（或上表中的07h），其中从最低有效位开始数的第八位被设置。顺便说一下，这也是我们为此监控项将\
  \ **信息类型** 字段保留为 **数字（无符号）** 和 **数据类型** 字段保留为 **十进制** 的原因——尽管实际含义以二进制表示编码，但值以十进制整数传输。\n\
  \n因此，要检查预测性故障，我们可以将值与128进行比较，对吧？不，并不完全是这样。如果系统已关闭并报告了预测值，原始二进制值将是 `10000001`，十进制值将是129。当我们开始包含其他位时，情况会更加混乱。这也是目前无法对此类监控项使用值映射的原因——在某些情况下，一个值可能意味着所有位都被设置，并且必须有针对每种可能位组合的值映射条目。哦，而且我们不能仅通过检查值是否为1来检测系统关闭——值为129以及许多其他值也可能意味着系统关闭。\n\
  \n作为更复杂的示例，假设我们想要检查位（从最低有效位开始）3和5，并且我们收到了值110（十进制）：\n\n|  | 十进制值 | 二进制值 |\n|---|---:|---:|\n\
  | **值** | 110 | 01101110 |\n| **按位与（相乘）** |  |  |\n| **掩码** | 20 | 00010100 |\n\
  | **结果** | 4 | 00000100 |\n\n关于掩码操作的一个简单思考方式：所有与掩码中0匹配的位都被设置为0，其余位照原样通过。在这种情况下，我们关心的是位3和位5是否都被设置，因此表达式将是：\n\
  \n```\n{host:item.band(#1,20)}=20\n```\n\n在我们的值中，只有位3被设置，函数返回的结果值为4，结果与20不匹配——并非两个位都被设置，因此触发器表达式评估为FALSE。如果我们想检查位3被设置而位5未被设置，我们会将结果与4进行比较。如果我们想检查位3未被设置而位5被设置，我们会将其与16进行比较——因为在二进制中，那是00010000。\n\
  \n现在，让我们回到检查预测性故障位是否被设置——它是第八位，因此我们的掩码应为10000000，并且应将结果与10000000进行比较。但这两个值都应为十进制格式，因此我们应将掩码和比较值都设置为128。让我们带着这个知识在前端创建一个触发器。转到\
  \ **配置 | 主机**，点击 **IPMI主机** 旁边的 **触发器**，然后点击 **创建触发器**。在 **名称** 字段中输入 `Power unit\
  \ predictive failure on {HOST.NAME}`，然后点击 **表达式** 字段旁边的 **添加**。点击 **监控项** 字段旁边的\
  \ **选择**，然后选择 **Power Unit Stat**。将 **功能** 下拉框设置为 **按位与 最后（最近的）T值与掩码 = N**，在 **掩码**\
  \ 和 **N** 字段中都输入 `128`，然后点击 **插入**。生成的触发器表达式应为：\n\n```\n{IPMI host:Power_Unit_Stat.band(,128)}=128\n\
  ```\n\n注意到第一个函数参数缺失了吗？与之前的 `()` 函数一样，省略此参数等同于将其设置为 `#1`，就像前面的示例一样。此触发器表达式将忽略7个最低有效位，并检查结果是否设置为二进制\
  \ `10000000`，即十进制128。\n\n使用 `count()` 函数也可以进行按位比较。在这里，语法可能更令人困惑：模式和掩码都作为第二个参数指定，并用斜杠分隔。如果模式和掩码相等，则可以省略掩码。让我们尝试看一些示例来澄清这一点。\n\
  \n\n\n\n\n# 17\n"
- '# 监控 Java 应用


  在 Zabbix 可以直接查询的所有其他功能中，使用 Java Management Extensions (JMX) 协议监控 Java 应用服务器也是一种功能。实际上，不仅仅是应用服务器——用
  Java 编写的其他服务器软件也可以被监控。甚至独立的 Java 应用也可以被监控，因为 JMX 框架不需要由应用开发者实现——它随 Java 提供。主要的 Zabbix
  守护进程是用 C 编写的，但 JMX 协议相当复杂，尤其是所有授权和加密方法。因此，使用了单独的组件进行 JMX 监控：Zabbix Java 网关。该网关作为单独的进程运行，并代表
  Zabbix Server 查询 JMX 接口。在本章中，我们将设置 Java 网关并在其上监控一个简单的属性。


  # 设置 Zabbix Java 网关


  让我们先把网关运行起来。如果你是从软件包安装的，很可能有 Java 网关软件包可用——只需安装它即可。如果你是从源码安装，Java 网关可以通过在 Zabbix
  源码目录下运行以下命令进行编译和安装：


  ```

  $ ./configure --enable-java && make install

  ```


  > 如果编译失败，因为找不到 javac，你可能缺少 Java 开发包。软件包名称可能类似于 java-1_7_0-openjdk-devel。请查阅发行版的文档以获取确切的软件包名称。


  默认情况下，从源码编译时，Zabbix Java 网关文件会被放置在 /usr/local/sbin/zabbix_java 目录中。从现在开始，我们将使用该目录中的文件。如果你是从软件包安装，请查阅软件包配置信息以定位这些文件。


  让我们先做点简单的：启动网关。进入 Java 网关目录并运行以下命令：


  ```

  # ./startup.sh

  ```


  Zabbix Java 网关附带一个方便的启动脚本，我们在这里使用了它。如果一切顺利，你应该看不到任何输出，并且进程列表中会出现一个 Java 进程。此外，网关应监听端口
  10052。虽然该端口不是 Zabbix Java 网关的官方注册端口，但它只是 Zabbix trapper 端口之上的一端口，似乎没有其他应用在使用该端口。网关运行后，我们仍需要告诉
  Zabbix Server 网关的位置。打开 zabbix_server.conf 并查找 JavaGateway 参数。默认情况下它未设置，我们需要在此处配置网关的
  IP 或主机名。由于我们可以指向远程系统，我们并不要求 Java 网关与 Zabbix Server 位于同一系统——在某些情况下，我们可能希望将网关放置在更靠近
  Java 应用服务器的位置，例如。将此参数设置为 localhost IP 地址：


  ```

  JavaGateway=127.0.0.1

  ```


  紧随其后的是一个名为 JavaGatewayPort 的参数。默认情况下，它设置为 10052——与我们正在运行的网关已在监听的未注册端口相同——因此我们不会更改它。下一个参数是
  StartJavaPollers。与 IPMI pollers 相同，默认情况下不会启动任何 Java pollers。我们不会对 Java 网关造成太大压力，因此启用一个
  Java poller：


  ```

  StartJavaPollers=1

  ```


  这样，Zabbix Server 的配置就足够了。重新启动它以应用 Java 网关配置更改。很好，我们已经运行了网关，并且 Zabbix Server 知道它的位置。现在，我们只需要一些可监控的东西。如果你有一个可用于测试的
  Java 应用服务器，请尝试监控它。如果没有，或者为了更简单地开始，你可以监控网关本身。它是一个 Java 应用，因此 JMX 基础设施可用。在为网关启用 JMX
  之前，我们应该更改一件事。Java 对 DNS 和名称解析总体上非常挑剔。如果启用了 JMX 功能并且本地系统主机名无法解析，Java 应用很可能无法启动。对于本地
  Java 网关，请检查 /etc/hosts 文件。如果当前主机名没有条目，请添加如下一行：


  ```

  127.0.0.1 testhost

  ```


  我们现在准备为网关启用 JMX 功能；默认情况下它未启用。要在 Zabbix Java 网关上启用 JMX，请编辑我们之前使用的 `startup.sh` 脚本，并查找以下行：


  ```

  ```sh

  # uncomment to enable remote monitoring of the standard JMX objects on

  the Zabbix Java Gateway itself

  ```

  ```


  取消注释其后跟着的两行。


  ![](img/f5313a804532fabacc8d07cc8607eeba_579_0.png)


  > 那里有一个变量被分配到了两行上。


  其中一个参数值得特别注意：


  ```

  ```sh

  -Dcom.sun.management.jmxremote.port=12345

  ```

  ```


  这设置了 JMX 端口——网关本身将查询的端口。是的，在这种情况下，我们将启动一个进程，使其连接到自身上的该端口以查询 JMX 数据。该端口肯定不是标准端口——如你所猜，它只是
  1-2-3-4-5 的序列。其他 Java 应用很可能会使用不同的端口，你需要查明。


  如果你是从软件包安装的，近期软件包应已在 init 脚本中包含相同的行。如果没有，请考虑向软件包维护者报告，并除了前一个代码中的端口参数外，还使用以下参数：


  ```

  ```sh

  -Dcom.sun.management.jmxremote

  -Dcom.sun.management.jmxremote.authenticate=false

  -Dcom.sun.management.jmxremote.ssl=false

  ```

  ```


  第一个参数告诉 Java 启用 JMX，最后两个参数指示 Java 不使用任何身份验证或加密。


  ![](img/f5313a804532fabacc8d07cc8607eeba_579_1.png)


  > 在撰写本书时，Zabbix 网关中的 JMX 功能与 Java 1.9 不兼容。解决方案是降级到 Java 1.8。


  完成此更改后，运行关闭和启动脚本：


  ```

  ```sh

  # ./shutdown.sh

  # ./startup.sh

  ```

  ```


  我们终于准备好添加实际的主机和 JMX 项了。


  > 目前，Zabbix 仅支持 JMX 监控的硬编码远程方法调用 (RMI) 端点。使用其他协议的 Java 应用服务器不受支持——这包括 JBoss 6 及更高版本。不要使用
  RMI 参数在 JBoss 上启用 JMX——它们可能阻止 JBoss 启动。


  # 监控 JMX 项


  让我们为 JMX 监控创建一个单独的主机。导航到 Configuration | Hosts，然后点击 Create host。在 Host name 字段中输入
  Zabbix Java gateway，清除 In groups 列表框中的所有内容，并在 New group 字段中输入 Java。我们需要在该主机上使用 JMX
  项：删除默认的 agent 接口并点击 JMX interfaces 旁边的 Add。在我们的例子中，网关运行在本地主机上，因此我们可以将 IP 地址保留为默认值
  127.0.0.1。但端口呢？我们让 Java 网关监听 10052，但 startup.sh 脚本中还有 12345 端口。如果产生混淆，我们应该思考每个端口上可用的功能。在端口
  10052 上，我们有网关本身，这是 Zabbix server 连接到的端口。我们已经在服务器配置文件中看到了该端口的设置。通常，网关随后会连接到某个其他 Java
  应用以查询 JMX 信息。


  ![](img/f5313a804532fabacc8d07cc8607eeba_580_0.png)


  12345 端口是我们取消注释的网关 startup.sh 脚本中的行，并且那是网关的 JMX 接口。这也是我们想要监控的：我们的 Java 应用。在 Zabbix
  server 连接到端口 10052 上的 Java 网关后，我们期望网关连接到自身，端口为 12345：


  ![](img/f5313a804532fabacc8d07cc8607eeba_580_1.png)


  因此，在主机接口中，我们希望使用端口 12345——令人惊讶的是，这也是默认值：


  ![](img/f5313a804532fabacc8d07cc8607eeba_581_0.png)


  > JMX 系统实际上可以返回 JMX 查询客户端应连接到的不同 IP 地址和端口。Zabbix 使用 Java 功能自动遵守此信息，但在某些情况下，它可能是错误的。如果看到错误消息并且
  Zabbix Java 网关似乎连接到与主机属性中配置的不同地址或端口，请检查目标 Java 应用的配置，特别是 `Djava.rmi.server.hostname`
  和 `Dcom.sun.management.jmxremote.rmi.port` 参数。


  其余的主机配置应足以满足我们的需求——点击底部的 **Add** 按钮。现在，确保在 **Group** 下拉菜单中选择了 **Java**，点击 **Zabbix
  Java gateway** 旁边的 **Items**，然后点击 **Create item**。输入以下数据：


  +   - **Name:** Used heap memory

  +   - **Type:** JMX agent

  +   - **Key:** `jmx[java.lang:type=Memory,HeapMemoryUsage.used]`

  +   - **Units:** B


  完成后，点击底部的 **Add** 按钮。几分钟后在最新数据部分检查此项——它应该成功收集值。


  # 手动查询 JMX 项


  在不知道确切参数之前，在服务器上创建项然后等待它们通过网关更新可能相当麻烦。我们可以使用 `netcat` 和类似工具手动查询网关，但这也不容易。有一种更简单的方法，使用
  `zabbix_get`，由 Zabbix 社区成员 Bunjiboys 提供。以下简单脚本充当包装器：


  ```

  ```bash

  #!/bin/bash

  ZBXGET="/usr/bin/zabbix_get"

  # accepts positional parameters:

  # 1 - JAVA_GW_HOST

  # 2 - JAVA_GW_PORT

  # 3 - JMX_SERVER

  ```




  # 4 - JMX_PORT

  # 5 - ITEM_KEY

  # 6 - USERNAME

  # 7 - PASSWORD

  QUERY="{\"request\": \"java gateway jmx\", \"conn\": \"$3\", \"port\": $4,\"username\":
  \"$6\", \"password\": \"$7\", \"keys\": [\"$5\"]}"

  $ZBXGET -s $1 -p $2 -k "$QUERY"


  如果你将其保存为 `zabbix_get_jmx` 并赋予其可执行权限，那么通过网关查询一个 item key 可以这样做：


  ```

  $ ./zabbix_get_jmx localhost 10052 java-application-server.local.net 9999

  ''jmx["java.lang:type=Threading","PeakThreadCount"]''

  ```


  在此示例中，JMX 实例正在监听 9999 端口。请注意 item key 中双引号的转义。返回结果将是来自 Zabbix Java 网关协议的原始 JSON：


  ```

  {"response":"success","data":[{"value":"745"}]}

  ```


  当 Zabbix server 查询网关时，它会从该 JSON 中解析出数字值——本例中为 745。


  > 💡 这个示例脚本没有进行任何错误检查——请查阅 https://www.zabbix.org/wiki/Docs/howto/zabbix_get_jmx
  了解任何潜在的后续改进。


  ## 监控什么？


  对于 Java 应用服务器，监控往往不是由实际的 Java 应用程序开发人员发起的，而且通常不清楚首先监控哪些内容才是好的选择。一般来说，与其他任何系统一样，同样的建议也适用——应该由了解被监控应用程序的人来决定监控什么。如果可用的
  Java 开发人员通情达理，并实际实现额外的 JMX 监控项来监控特定于应用程序的逻辑，那就更好了。如果这不太容易实现，我们总是可以先从内存使用量、线程数、垃圾回收器和其他通用指标这一基本集合开始。一些可能有用的参数如下：


  - `jmx["java.lang:type=ClassLoading","LoadedClassCount"]`：已加载的类数量

  - `jmx["java.lang:type=Memory","NonHeapMemoryUsage.used"]`：我们已经在网关上监控了堆内存使用情况；这将监控非堆内存使用情况


  一般来说，为 JMX 推荐一个静态的监控项列表是相当困难的——有几种垃圾回收器，而垃圾回收监控的确切键会根据正在使用哪一种而有所不同。Zabbix 还提供了一些开箱即用的模板，用于通用和
  Tomcat 特定的 JMX 监控，这可能是一个不错的起点。


  如果我们想使用多个 Java 网关怎么办——也许每个数据中心一个，甚至每个 Java 应用服务器上一个，这样 JMX 连接就不会通过网络进行？Zabbix server
  只支持单个 Zabbix 网关。实际上，使用 Zabbix 代理可以将多个 Java 网关附加到单个服务器上，但我们将在第 19 章 *使用代理监控远程位置*
  中讨论这一点。


  ## 总结


  Java 有时被称为“企业之王”。尽管存在常被提及的缺点，如内存占用，但它在大型系统中如此广泛流行，以至于人们可能会想知道是什么让它如此有吸引力。一个原因可能是它降低了维护成本——至少有时有人这样声称，而且在大型、长期存在的系统中这很有道理。与长期维护相比，开发一个系统通常成本较低。鉴于基于
  Java 的系统使用广泛，内置的 JMX 支持非常方便——也许除了有限制的端点支持之外。在本章中，我们研究了如何设置一个名为 Zabbix Java gateway
  的独立守护进程，并执行初始配置使其与 Zabbix server 配合工作。我们还监控了网关本身的堆内存使用情况，这应该是 JMX 监控的一个良好开端。为了更容易调试，我们使用了一个围绕
  `zabbix_get` 的简单包装器，通过网关手动查询 JMX。


  最近，我们一直在讨论一些相对小众的产品和协议的监控。下一章将继续这一趋势——我们将讨论内置的 VMware 监控，它使我们能够从 hypervisor 或 vCenter
  发现并监控所有虚拟机。


  # 18

  '
- '# 监控 VMware


  如今有许多虚拟化解决方案可供选择。它们的目标市场和受欢迎程度各不相同，但对于能够负担得起的企业来说，VMware 解决方案相当普遍。Zabbix 提供对监控 VMware
  的内置支持。该支持包括：


  - 监控 vSphere 和/或 vCenter

  - 自动发现所有 hypervisor

  - 自动发现所有虚拟机


  监控 VMware 不涉及任何自定义层——Zabbix 直接访问 VMware API，而且这种环境的监控非常容易设置。在本章中，你需要访问一个 VMware
  实例 API，包括用户名和密码。最好先在较小或非生产环境中进行尝试。


  > 如果从 vCenter 发现大型环境，vCenter API 端点可能会过载，因为 Zabbix 会连接到它并请求所有已发现的 vSphere 实例和虚拟机的数据。在这种情况下，将监控分散到各个
  vSphere 实例上可能是合理的。


  ## 为 VMware 监控做准备


  要试用 VMware 支持，我们需要：


  - 可以访问 VMware API 的 IP 地址或主机名

  - 具有检索信息权限的账户的用户名

  - 该账户的密码


  ## 监控 VMware


  首先，服务器必须使用 VMware 支持编译。如果你是从软件包安装的，很可能已经包含该支持。如果你是从源码安装的，请检查 Zabbix server 日志文件是否列出了
  VMware 监控已启用：


  ```

  VMware monitoring: YES

  ```


  从源码编译时，需要以下选项来支持 VMware：


  - `--with-libcurl`

  - `--with-libxml2`


  与我们目前探索的其他几个功能一样，Zabbix server 默认不会启动任何特定于 VMware 的进程。编辑 `zabbix_server.conf`，查找
  `StartVMwareCollectors` 参数。添加新的一行，告诉 Zabbix 启动两个 VMware collector：


  ```

  StartVMwareCollectors=2

  ```


  重新启动服务器。为什么是两个 collector？Zabbix 开发者建议 collector 的数量应基于被监控的 VMware 实例数量。为了获得最佳性能，建议启动的
  collector 数量多于被监控实例数，但少于被监控实例数的两倍。或者，如果我们用公式来表示，即 `instances < StartVMwareCollectors
  < ( instances * 2 )`。我们从小规模开始，目前只监控一个实例，所以我们将有 `1 < StartVMwareCollectors < 2`。还建议始终至少启动两个
  VMware collector，所以这里的选择是显而易见的。如果我们有两个 VMware 实例要监控，那就需要三个 collector：`2 < StartVMwareCollectors
  < 4`。


  > VMware 实例是指 vSphere 或 vCenter 实例，而不是单独的虚拟机。也就是说，collector 的数量取决于 Zabbix 实际连接以进行数据收集的端点。


  我们将首先对 VMware API 全面启用 Zabbix，并允许它使用 Zabbix 自带的模板自动发现所有内容。一旦我们看到它按预期工作，我们将了解如何定制和扩展这个监控，并稍微深入了解一下
  VMware 监控的机制。


  ## 自动发现


  我们将创建一个单独的主机，作为发现的起点。除了监控通用 VMware 参数和发现所有其他实体之外，这个主机不会为我们做任何其他事情。转到 Configuration
  | Hosts 并点击 Create host。在 Host name 字段中输入 VMware，清除 In groups 块中已有的组，并在 New group
  字段中输入 VMware。切换到 Macros 选项卡，并填写以下三个宏的值：


  - {$URL}：形式为 https://server/sdk 的 VMware API/SDK URL

  - {$USERNAME}：VMware 账户用户名

  - {$PASSWORD}：VMware 账户密码


  > API 或 SDK 在 vSphere 或 vCenter 系统上可用。


  现在，切换到 Templates 选项卡，开始输入 vmware，选择 Template Virt VMware，然后在 Link new templates
  部分点击 Add 控件。完成后，点击底部的 Add 按钮。


  接下来做什么？嗯，什么都不用做。如果一切正确完成，所有内容都应该被自动监控。Hypervisor 应该被发现并监控，虚拟机被发现并根据 hypervisor 分组，同时也被监控。不过，这可能不会立即发生。与默认模板中的其他
  LLD 规则一样，VMware 发现也有 1 小时的间隔——等等，LLD 规则？是的，VMware 发现也使用 LLD 功能。我们在第 12 章自动化配置中详细讨论过它。然而，VMware
  支持更进一步：除了监控项、触发器和图形原型之外，它还使用主机原型。我们稍后会介绍主机原型。现在，我们可以让发现继续进行，也可以转到 Configuration
  | Templates，点击 Template Virt VMware 旁边的 Discovery，并减少所有三个发现规则的更新间隔。只是要确保稍后将其设置回来。


  等一段时间后——或者减少间隔后——检查 Configuration | Host groups。你应该会看到几个以 Discover VMware VMs 为前缀的新主机组。根据被监控的
  VMware 实例的大小，新组数量可能从两个到很多不等。会有一个名为 Hypervisors 的组，以及一个针对每个集群的虚拟机的组。如果存在集群，还会有一个针对每个集群的
  hypervisor 的组。


  > 如果没有配置集群，虚拟机的组将直接称为 (vm)。






