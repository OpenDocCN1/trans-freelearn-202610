- "## 深入处理数据\n\n使用 Web 前端和内置图表既美观又简单，但有时你可能想在外部电子表格应用程序中制作一些漂亮的图表，或者将数据输入另一个系统。有时，你可能想进行某些无法通过\
  \ Web 界面完成，或者通过 Web 界面操作很繁琐的配置更改。虽然这不是大多数 Zabbix 用户首先需要的东西，但当需要出现时，了解这些方法会很有用。因此，在本章中，我们将了解如何：\n\
  \n-   从 Web 前端或数据库获取原始监控指标数据\n-   执行一些简单、直接的数据库修改\n-   使用 XML 导出和导入来实现更复杂的配置\n-\
  \   开始使用 Zabbix API\n\n### 获取原始数据\n\n原始数据是按原样存储在 Zabbix 数据库中的数据，可能只进行了少量（如果有的话）转换。检索此类数据主要用于在其他应用程序中进行分析。\n\
