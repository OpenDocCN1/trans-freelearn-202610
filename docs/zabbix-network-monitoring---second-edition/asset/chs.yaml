  在下一章中，我们将讨论一个新的 Zabbix 进程：Zabbix proxy。Zabbix proxies 是远程数据收集器，非常出色。类似于代理，它们可以以被动或主动模式运行，并支持
  Zabbix server 支持的几乎所有功能，包括监控 Zabbix agents、SNMP 设备、VMware 等等。我们将设置主动和被动代理，并讨论在代理不可用时处理它的最佳方式。


  ## ## 19'
- "## 使用代理监控远程位置\n\nZabbix server 可以使用多种不同的方法进行监控——它可以与 Zabbix agents、SNMP 设备和 IPMI\
  \ 设备通信；运行命令；以及做很多其他事情。当需要监控的设备数量增加时就会出现问题——一个端点（我们的 Zabbix server）需要与大量其他设备通信，大量的连接会在\
  \ Zabbix server 和 Zabbix server 与被监控设备之间的网络组件上造成问题。\n\n如果我们需要监控远程环境，情况会更糟——无论是分支机构、另一个数据中心还是客户现场。Zabbix\
  \ agents？端口 10050 必须对所有服务器开放。SNMP？端口 161 必须对所有设备开放。很快就会变得难以管理。\n\n解决方案是使用 Zabbix\
  \ proxies。Zabbix proxy 是一个远程数据收集进程，能够使用 Zabbix server 支持的所有方法收集数据。在本章中，我们将设置一个 Zabbix\
  \ proxy，用它进行数据收集，并讨论确定代理本身是否可用的最佳方法。\n\n> > Zabbix proxies 不适用于 Windows。\n\n为 Zabbix\
  \ proxy 选择哪种数据库？如果代理将监控小型环境，SQLite 可能是一个不错的选择。使用 SQLite 作为 Zabbix server 后端是不受支持的，因为它可能会出现锁定和性能问题。在\
  \ Zabbix proxy 上问题应该会少得多。如果设置大型代理，MySQL 或 PostgreSQL 会是更好的选择。在本章中，我们将使用 SQLite 数据库的代理，因为这样设置起来非常容易。\n\
  \n> 如果从源代码编译，需要 SQLite 开发头文件。在大多数发行版中，它们将由名为 sqlite-devel 或类似名称的包提供。\n\n编辑 zabbix_proxy.conf。我们将更改三个参数：\n\
  \n- DBName\n- Hostname\n- Server\n\n将它们更改为：\n\n```\nDBName=/tmp/zabbix_proxy.db\n\
  Hostname=First proxy\nServer=<Zabbix server IP address>\n```\n\n第一个参数 DBName 与 Zabbix\
  \ server 相同，只是我们在这里不仅仅指定数据库名称。对于 SQLite，这里指定数据库文件的路径。虽然可以使用相对路径，但在大多数情况下启动代理会变得更加复杂，因此强烈建议使用绝对路径。我们使用\
  \ /tmp 中的文件来简化我们第一个代理的设置——无需担心文件系统权限。数据库用户名和密码呢？正如配置文件中的注释所指出的，当使用 SQLite 时，它们都被忽略了。\n\
  \n> 在生产系统上，建议将数据库文件放在 /tmp 以外的其他位置。在某些发行版中，/tmp 可能在重启时被清除。另一方面，出于性能原因，可以选择将数据库放在\
  \ tmpfs 卷中，从而获得一些性能提升，但每次系统重启后代理数据库都会丢失。\n\n第二个参数 Hostname 将由代理用于向 Zabbix server\
  \ 标识自己。原理与主动 agent 相同——这里指定的值必须与服务器端配置的代理名称匹配，并且区分大小写。\n\n\n\n\n\n第三个参数 Server 的作用与在\
  \ active agents 中时相同。active proxy 会连接到 Zabbix 服务器，我们在此处指定服务器 IP 地址。\n\n> 如果你在与 Zabbix\
  \ 服务器相同的机器上运行 proxy，还需更改 proxy 监听的端口——将 ListenPort 设置为 11051。默认端口会与 Zabbix 服务器冲突。\n\
  > \n> 与 Zabbix 服务器一样，你必须确保配置了适当的 pollers 以启动。例如，如果你想通过 proxy 监控 IPMI 设备，请确保在 proxy\
  \ 配置文件中将 StartIPMIPollers 参数设置为默认值 0 以外的数值。\n\n现在启动 Zabbix proxy。等等，我们并没有为 proxy\
  \ 创建数据库。它会做什么？让我们查看 proxy 日志文件——检查 /tmp/zabbix_proxy.log，或 proxy 配置文件中设置的位置。仔细查看，我们可以找到一些有趣的日志记录：\n\
  \n```\n20988:20151120:064740.867 cannot open database file \"/tmp/zabbix_proxy.db\"\
  : [2] No such file or directory\n20988:20151120:064740.867 creating database ...\n\
  ```\n\n它首先未能打开现有数据库文件，然后继续创建数据库。Zabbix proxy 可以自动创建所需的 SQLite 数据库并填充它。注意，这仅适用于 SQLite——如果使用其他数据库，我们就必须手动创建数据库并插入\
  \ schema。这对于 SQLite 也是可能的——使用 sqlite3 工具，我们会这样做：\n\n```\n$ sqlite3 /tmp/zabbix_proxy.db\
  \ < schema.sql\n```\n\n但仅限 schema！不仅对于 SQLite——对于所有数据库——proxy 只需要 schema。不要使用数据，也不要使用\
  \ image SQL 文件。如果 Zabbix proxy 检测到数据库中存在额外数据，它会退出，并抱怨无法使用服务器数据库。旧版本的 proxy 在这种情况下可能会崩溃甚至损坏服务器数据库。\n\
  \n> 不要创建空文件。要么允许 proxy 创建数据库文件，要么自行创建并使用 sqlite3 工具填充它。空文件会被视为空数据库，proxy 将无法启动。\n\
  > 如果 proxy 抱怨无法使用服务器数据库，它就会在 users 表中发现条目。\n\n## 使用 Proxies 监控远程位置\n\n在下面的部分中，Hosts\
  \ 允许我们指定哪些主机将由此 proxy 监控。要使一台主机由 proxy 监控，请在 Other hosts 列表框中选择 Another host 并点击\
  \ ◄ 按钮：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_602_0.png)\n\n完成后，点击 Add。下次\
  \ proxy 连接到服务器时，名称应匹配，proxy 应该获取它应该监控的信息。但下次是什么时候？默认情况下，Zabbix proxy 每小时连接到 Zabbix\
  \ 服务器一次。第一次连接尝试发生在 proxy 启动时，此后每隔一小时进行一次。如果你启动 proxy 后不久就配置了前端部分，proxy 获取配置数据并开始工作可能需要长达一小时。有两种方法可以强制重新读取\
  \ Zabbix 服务器上的配置数据：\n\n- 重启 proxy\n- 强制重新加载其配置缓存\n\n第一种方法在我们的测试 proxy 上是可以接受的，但在已经积极收集数据的较大生产\
  \ proxy 上就不太理想了。让我们看看如何强制重新加载配置缓存。首先运行：\n\n```\n# zabbix_proxy --help\n```\n\n在输出中，注意\
  \ runtime control 部分及其中的第一个参数：\n\n```\n```text\n-R --runtime-control runtime-option\
  \    Perform administrative functions\n\n    Runtime control options:\n\n      \
  \  config_cache_reload              Reload configuration cache\n```\n```\n\n当 active\
  \ proxy 被告知重新加载其配置缓存时，它会连接到服务器，获取新的配置数据，然后更新本地缓存。现在让我们发出该命令：\n\n```\n```bash\n#\
  \ zabbix_proxy --runtime-control config_cache_reload\n```\n```\n\n> 运行时命令依赖于 PID\
  \ 文件被正确配置。当你运行之前的命令时，它会在默认的 proxy 配置文件中查找 PidFile 选项，从 PID 文件中查找 PID，并向该进程发送信号。如果系统上运行多个\
  \ active proxies，可以通过使用 -c 选项指定其配置文件来向特定 proxy 发送信号。\n\n重载命令应成功处理：\n\n```\n```text\n\
  zabbix_proxy [19293]: command sent successfully\n```\n```\n\n现在检查 proxy 日志文件：\n\n\
  ```\n```text\n    forced reloading of the configuration cache\n    received configuration\
  \ data from server at \"192.168.56.10\", datalen\n    6545\n```\n```\n\n首先，proxy\
  \ 记录它已收到重新加载配置缓存的指令。然后它连接到服务器并成功从服务器检索配置数据。\n\n> 我们将在 *Appendix A, Troubleshooting*\
  \ 中更详细地讨论配置缓存的重新加载。\n\n你可以通过再次打开 **Administration | Proxies** 来验证 proxy 是否可以成功连接到服务器。查看新\
  \ proxy 的 **LAST SEEN (AGE)** 列。不要再显示 **never**，它应该显示某个时间段。如果没有，请检查 Zabbix 服务器和\
  \ proxy 是否都在运行，并且你可以从 proxy 主机打开到 Zabbix 服务器 10051 端口的连接。\n\n但如果你查看 **HOSTS** 列，你会发现它现在是空的。发生了什么？我们显然已将\
  \ **Another host** 添加为由此 proxy 监控——为什么它消失了？这可能是一个具有挑战性的任务来弄清楚，而且在生产环境中也很容易出现这种情况。主机从\
  \ proxy 配置中消失的原因是 `active-agent auto-registration`。我们在 *Chapter 12, Automating Configuration*\
  \ 中配置了它，此后 agent 一直在某种程度上反复自动注册。但为什么这会影响主机分配给 proxy？当 active agent 连接且 `auto-registration`\
  \ 处于活动状态时，连接的位置很重要。Zabbix 服务器不会创建新主机，而是将该主机重新分配给 Zabbix 服务器或某个 proxy，即接收到 agent\
  \ 连接的那个。它认为该 agent 已从服务器迁移到某个 proxy 或反之，或从一个 proxy 迁移到另一个 proxy。我们将一台主机分配给新的 proxy，agent\
  \ 仍在连接到服务器，服务器又将该主机重新分配回由服务器直接监控。如何解决？我们有两个选择：\n\n- 禁用 active agent `auto-registration`\
  \ 动作并手动重新配置主机\n- 配置 agent 连接到 proxy 而不是服务器\n\n让我们尝试第二种更高级的方法。在 **Another host**\
  \ 上，编辑 `zabbix_agentd.conf` 并将 `ServerActive` 更改为 proxy IP 地址，然后重启 agent。\n\n> 如果你将\
  \ Zabbix proxy 安装在与 Zabbix 服务器相同的系统上，请确保在此参数中也指定 proxy 端口。\n> 不要在服务器地址之外再设置 proxy\
  \ 地址——在这种情况下 agent 将尝试同时与服务器和 proxy 并行工作。有关将 agent 指向多个服务器或 proxy 的更多详细信息，请参阅 *Chapter\
  \ 3, Monitoring with Zabbix Agents and Basic Protocols*。\n\n再次检查 proxy 列表。**HOSTS**\
  \ 列中现在应该有 **Another host**，并且它不再消失。让我们在 **Monitoring | Latest data** 中检查此主机的數據。不幸的是，看起来大多数项都停止工作了。虽然我们更改了\
  \ agent 守护进程配置文件中的 active server 参数并且 active agent 项现在可以工作，但仍有更多项类别可能已失败：\n\n- Passive\
  \ agent 项无法工作，因为 agent 不接受来自 proxy 的连接\n- ICMP 项可能无法工作，因为 `fping` 缺失或没有适当的权限\n\n\
  \n\n\n- 虽然 **Another host** 没有 SNMP、IPMI 和其他类型的监控项，但这些监控项可能已经开始失败，因为代理中没有编译相应的支持，或者相应的轮询器没有启动。\n\
  - 如果你在 Zabbix server 系统上配置了代理，被动监控项将正常工作，因为 agent 获取连接的 IP 地址保持不变。\n\n下面至少修复被动 agent\
  \ 监控项。在 **Another host** 上编辑 `zabbix_agentd.conf`，然后修改 Server 参数。用代理地址替换其中的 IP 地址，或者将代理地址添加进去，然后重启\
  \ agent。几分钟后，大多数被动 agent 监控项应该会重新开始接收数据。\n\n至于 ICMP 监控项，请参阅*第 3 章，使用 Zabbix agent\
  \ 和基础协议进行监控*中的 `fping` 配置。这与服务器端的配置相同；只不过现在需要在代理系统上进行更改。\n\n一般来说，当主机由代理监控时，与该主机之间的所有连接都必须并且将由代理完成。对于被动监控项，agent\
  \ 必须允许来自代理的连接；对于主动监控项，agent 必须连接到代理。甚至对于 Zabbix trapper 监控项，Zabbix sender 也必须将数据发送给代理，而不再是\
  \ Zabbix server。\n\n现在主机由代理监控，让我们检查一下前端是否有任何相关迹象。打开 **配置 | 主机**，确保在 **组** 下拉框中选择了\
  \ **Linux servers**，然后查看 **名称** 列。可以看到，**Another host** 现在以代理名称为前缀，显示为 **First proxy:Another\
  \ host**：\n\n| 名称 |\n|---|\n| First proxy: Another host |\n| A test host |\n| IPMI\
  \ host |\n\n![](img/f5313a804532fabacc8d07cc8607eeba_605_0.png)\n\n> 当有多个代理时，通常按位置名称命名，例如\
  \ proxy-London 或 Paris-proxy。\n\n但是，每当我们想要让主机由代理监控时，是否都必须转到 **管理 | 代理**？点击 **名称**\
  \ 列中的 **Another host**，观察可用属性。有一个可用的下拉框，名为 **由代理监控**。使用这个下拉框，我们可以轻松地将主机指定为由所选代理监控（记得更改\
  \ agent 守护进程配置文件中的服务器 IP 地址）：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_606_0.png)\n\
  \n> 如果你决定通过代理监控 **A test host**，请务必小心其地址。如果地址保留为 `127.0.0.1`，代理将连接到本地 agent 获取被动监控项，然后向服务器报告这些数据，并声称数据来自\
  \ **A test host**。这也不容易被发现，因为数据会正常到来；只不过那是错误的数据。\n\n## 代理的优势\n\n配置好第一个代理后，让我们更详细地讨论它的操作和带来的好处。先从主要优势开始：\n\
  \n- 代理可以在服务器不可用时收集数据\n- 代理减少与远程环境之间的连接数量\n- 代理允许我们对轮询监控项使用传入连接\n\n我们讨论过代理从服务器获取配置数据，也讨论过它有本地数据库。Zabbix\
  \ 代理总是需要一个本地数据库，这个数据库保存着代理需要监控的主机信息。同一个数据库还保存着代理收集的所有数据，如果无法连接服务器，这些数据不会丢失。能保存多久？默认情况下，数据保留一小时。可以在\
  \ `zabbix_proxy.conf` 文件的 `ProxyOfflineBuffer` 参数中配置。最长可设置为 30 天，但要注意磁盘空间不足的风险，以及连接恢复后可能导致\
  \ Zabbix server 过载的风险——我们稍后会更详细地讨论这个风险：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_607_0.png)\n\
  \n> 还有更多代理特有的配置参数可用；本章后面会列出它们。\n\n减少与远程环境的连接也非常重要。使用被动监控项进行监控意味着每个值都需要一个连接。使用主动监控项会好一些；多个值通常会在一个连接中发送。但代理会在一个连接中汇集多达\
  \ 1000 个值。即使这些值来自不同的类型，例如 agent、SNMP、IPMI 和 SSH 监控项，也会这样做。连接更少意味着防火墙和其他网络设备更健康，同时总延迟更小、Zabbix\
  \ server 处理传入连接的工作量更少，从而带来更好的性能：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_607_1.png)\n\
  \n第三个主要优势是，在服务器端可以接收传入连接，同时仍然能够通过轮询设备来收集数据。例如，在监控客户环境时，Zabbix server 可能无法访问网络设备。Zabbix\
  \ 代理可以连接到这些设备，使用 SNMP 收集数据，然后连接到服务器发送数据。另外，请记住，如果不使用代理，则需要在防火墙中为所有被监控设备打开许多端口；而使用代理时，只需为单个地址打开单个端口：\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_607_2.png)\n\nZabbix 代理还提供了一些其他优势：\n\n\
  - 在 Zabbix server 上对所有代理进行单点控制\n- 能够使用多个 Java 网关\n\n默认情况下，代理每小时同步一次配置，这个周期可以在 zabbix_proxy.conf\
  \ 配置文件中设置。查找名为 ConfigFrequency 的参数，其默认值如下所示：\n\n```\n# ConfigFrequency=3600\n```\n\
  \n这意味着 Zabbix 代理的配置可能滞后长达一小时，这听起来可能有点吓人，但一旦生产环境安装稳定下来，配置通常不会那么频繁地变化。在测试时，你可能希望缩短这个周期，但在稳定的生产环境中，实际上建议增大这个值。\n\
  \n> 如果必须立即将配置更改推送到代理，请强制重新加载配置。\n\n默认情况下，收集到的数据每秒钟发送到服务器一次。这可以在 zabbix_proxy.conf\
  \ 文件中通过 DataSenderFrequency 参数进行自定义。\n\n> 主动代理在没有值可发送时不会每秒都连接服务器——只有有数据要发送时才会使用\
  \ 1 秒的间隔。另一方面，如果它有大量值要发送，并且无法在单个连接中全部推送（即 1000 个值），那么下一个连接将尽快建立，而无需等待那一秒。\n\n关于主机和主机组的维护，当主机处于不收集数据的维护状态时，数据仍然会由代理发送，但服务器会丢弃这些数据。这样，维护状态的变更就不会受到默认一小时的配置同步延迟的影响。\n\
  \n## 代理与可用性监控\n\n代理带来了这么多好处，人们会倾向于大量使用它们——这也是一个好主意。代理确实很棒。但还有一个问题，即如何监控代理后面的主机的可用性。如果代理宕机或无法与\
  \ Zabbix server 通信，我们就会丢失该代理后面所有主机的数据。如果我们使用 nodata() 触发器函数来检测不可用的主机（我们可以将这些触发器称为可用性触发器），那可能意味着成千上万台主机被声明为不可用。这不是一种理想的情况。代理后面的主机没有内置的依赖关系，但我们可以监控代理的可用性，并为该代理后面的所有主机设置触发器依赖。但我们应该将这些依赖设置为什么呢？让我们讨论一下监控代理可用性的现有方法及其潜在缺点。\n\
  \n## 方法 1 – 最后访问监控项\n\n在 **管理 | 代理** 中有一个“最后访问”列。当然，一直盯着它看是不可行的，因此它也可以作为内部监控项添加。要创建这样的监控项，让我们转到\
  \ **配置 | 主机**，点击运行代理的主机旁边的“监控项”，然后点击“创建监控项”。填写以下值：\n\n- 名称：$2: 最后访问\n- 类型：Zabbix\
  \ 内部\n- 键：zabbix[proxy,First proxy,lastaccess]\n- 单位：unixtime\n\n> 这个监控项可以在任何主机上创建，但通常创建在\
  \ Zabbix proxy 主机或 Zabbix server 主机上。\n\n此处的键中，第二个参数是代理名称。因此，如果你的代理名为 kermit，则键将变为\
  \ zabbix[proxy,kermit,lastaccess]。\n\n> 如果此类监控项创建在代表代理系统且与代理同名的主机上，则模板可以使用 {HOST.HOST}\
  \ 宏作为此监控项键中的第二个参数。我们在第 8 章“使用模板简化复杂配置”中讨论过模板。\n\n完成后，点击底部的“添加”按钮。注意我们在这里使用了特殊的单位——unixtime。现在它会做什么呢？要找到答案，请导航到\
  \ **监测 | 最新数据**，展开筛选器，选择你创建了最后访问监控项的主机，并在“名称”字段中输入 proxy，然后点击“筛选”按钮。看一下这里数据的呈现方式——我们可以非常清楚、易读地看到代理最后一次联系\
  \ Zabbix server 的时间：\n\n| 名称 ▲ | 最后检查 | 最后值 |\n|---|---|---|\n| - 其他 -（1 个监控项） |\
  \ | |\n| First proxy: 最后访问 | 2015-11-24 17:14:59 | 2015-11-20 17:27:53 |\n\n\n\n\
  \n\n所以这个项目将记录代理上次联系 Zabbix 服务器的时间。这很好，但不足以在日常工作中注意到问题——我们已经很清楚触发器绝对是必需的。这里，熟悉的 fuzzytime()\
  \ 函数就派上用场了。导航到 Configuration | Hosts，点击你在其上创建了代理最后访问项目的那个主机旁边的 Triggers，然后点击 Create\
  \ trigger 按钮。\n\n假设我们有一个负载较重且关键的代理——我们希望知道代理在三分钟内没有回传时。 在这种情况下，可以使用如下的触发器表达式：\n\n\
  ```\n{host:zabbix[proxy,proxy name,lastaccess].fuzzytime(180)}=0\n```\n\n> 可以考虑对最后访问项目使用\
  \ delta Store value，当代理未通信时它会返回 0。 针对此类项目的触发器更晦涩，因此 fuzzytime() 是此用途最常见的触发器函数。\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_611_0.png)\n\n正如我们可能回忆的那样，代理在两种情况下连接到服务器——它要么同步配置，要么发送收集到的数据。\
  \ 如果由于某种原因，这两种事件的所有发生都相隔超过三分钟怎么办？ 幸运的是，Zabbix 代理有一个心跳进程，它会定期向服务器报告。 更妙的是，这个时间是可以配置的。\
  \ 再看一下 zabbix_proxy.conf，这次查找 HeartbeatFrequency 变量，默认如下：\n\n```\n# HeartbeatFrequency=60\n\
  ```\n\n以秒为单位，这个值意味着代理每分钟都会向服务器报告，即使没有新的值需要发送。 lastaccess 项目是判断代理很可能已宕机或至少无法访问的相当可靠的方法，即使它在较长时间内不会发送数据。\n\
  \n对于我们的触发器，填写以下值：\n\n- Name: Proxy \"First proxy\" not connected for 3 minutes\n\
  - Expression: {Another host:zabbix[proxy,First proxy,lastaccess].fuzzytime(3m)}=0\n\
  - Severity: High\n\n> 用代理最后访问项目创建的主机名替换代理名称。 如果最后访问项目使用了 {HOST.HOST} 宏，也在触发器名称和表达式中使用相同的宏。\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_611_1.png)\n\n我们本可以使用 `180` 代替 `3m`，但带时间后缀的版本更易读。\
  \ 时间后缀在 *Chapter 6, Detecting Problems with Triggers* 中有讨论。 完成后，点击底部的 **Add** 按钮。\n\
  \n这种项目和触发器的组合将很好地在代理不可用时提醒我们。 现在我们只需要为该代理后面的所有可用性触发器设置触发器依赖关系，使其依赖于此代理最后访问触发器。\n\
  \n不幸的是，有一个常见的问题情况。 当代理-服务器通信中断时，代理最后访问触发器会触发并因依赖关系而掩盖所有其他触发器。 虽然代理在一段时间内无法连接到服务器，但它仍在收集值。\
  \ 一旦通信恢复，代理就会将所有值发送到服务器，*先发送旧值*。 第一个值发送的瞬间，最后访问项目会被更新并且触发器恢复。 不幸的是，在这一点上，代理仍在发送收集了\
  \ 5、30 或 60 分钟前的值。 任何检查较短周期的 `nodata()` 触发器都会触发。 这使得代理触发器依赖关系仅在代理恢复之前有效，并在其恢复时导致巨大的事件风暴。\
  \ 我们如何解决它？ 我们可以尝试找出代理有多少未发送的值，如果太多，就忽略代理后面的所有触发器——本质上，将具有大量值缓冲区的代理视为与无法到达的代理相同。\n\
  \n## Method 2 – Internal proxy buffer item\n\n我们可以转向 Zabbix 内部项目来确定代理缓冲区的大小——即它有多少值需要发送到\
  \ Zabbix 服务器。 让我们前往 **Configuration | Hosts**，点击 **Another host** 旁边的 **Items**，然后点击\
  \ **Create item**。 填写以下值：\n\n- **Name:** `First proxy: buffer size`\n- **Type:**\
  \ **Zabbix internal**\n- **Key:** `zabbix[proxy_history]`\n\n> 此项目必须在通过要监控缓冲区大小的代理监控的主机上创建。\
  \ 如果分配给主机并由 Zabbix 服务器监控，此项目将变为不支持。\n\n完成后，点击底部的 **Add** 按钮。 在默认的代理配置更新间隔为一小时的情况下，在我们可以看到此项目的结果之前可能需要相当长的时间。\
  \ 为加快配置更新，在代理主机上运行以下命令：\n\n```bash\nzabbix_proxy --runtime-control config_cache_reload\n\
  ```\n\n代理将从服务器请求项目配置并更新其自己的缓存。 过一会儿，我们应该能在最新数据页面中看到结果：\n\n| NAME | LAST CHECK |\
  \ LAST VALUE |\n|---|---|---|\n| **- other -** (1 Item) |  |  |\n| First proxy:\
  \ buffer size | 2015-11-26 14:44:59 | 0 |\n\n那是什么值呢？ 它很简单，就是仍在代理缓冲区中且必须发送到服务器的值的数量。\
  \ 这可能允许我们针对此项目创建触发器。 每当缓冲区大于一百、二百或一千个值时，我们就会认为代理数据不是最新的，并使所有主机触发器依赖于缓冲区大小。 除了仍然存在一个重要问题。\
  \ 此项目的数值保存在它所监控的同一代理缓冲区中，并受相同的顺序发送影响，先发送旧值。 使用此项目，我们仍会遭受与之前相同的问题——代理不可用时，代理缓冲区项目会保持\
  \ 0 或其他较小值。 随着值的开始流入，各个主机触发器会触发，只有在一段时间后我们才会看到缓冲区实际上非常大。 这对以后的调试可能有用，但无助于屏蔽代理后面的主机。\
  \ 那么有解决方案吗？\n\n### Method 3 – Custom proxy buffer item\n\n一种解决方案可能是某种绕过缓冲区本身向我们发送代理缓冲区大小的方法。\
  \ Zabbix 没有提供这样的方法，因此我们必须自己实现。 在此之前，让我们弄清楚如何获取缓冲区大小的信息。 为此，我们将深入代理数据库。\n\n![](img/f5313a804532fabacc8d07cc8607eeba_613_0.png)\n\
  \n## Using Proxies to Monitor Remote Locations\n\n在代理主机上运行：\n\n```bash\n$ sqlite3\
  \ /tmp/zabbix_proxy.db\n```\n\n代理将所有收集的值保存在一个表 `proxy_history` 中。 让我们获取最后三个收集的值：\n\
  \n```text\nsqlite> select * from proxy_history order by id desc limit 3;\n1850|24659|1448547689|0|0|0|0|0|749846420|0|0|0|0\n\
  1849|23872|1448547664|0|0|0.000050|0|655990544|0|0|0|0\n1848|24659|1448547659|0|0|0|0|0|744712272|0|0|0|0\n\
  ```\n\n我们将在 *Chapter 21, Working Closely with Data* 中更详细地讨论其他字段，但现在知道第一个字段是顺序 ID\
  \ 就足够了。 尽管如此，代理如何知道哪些值已发送到服务器？ 让我们查看 IDs 表：\n\n```text\nsqlite> select * from ids\
  \ where table_name='proxy_history';\nproxy_history|history_lastid|1850\n```\n\n\
  这里的 `history_lastid` 值是已同步到服务器的最后一个 ID。 在繁忙的代理上，你可能需要非常快速地运行这些语句才能看到真实情况，因为新值会不断添加并发送到服务器。\
  \ 我们可以用以下方法获取当前缓冲区（未发送值）大小：\n\n```sql\nsqlite> select (select max(proxy_history.id)\
  \ from proxy_history)-nextid\nfrom ids where field_name='history_lastid';\n```\n\
  \n它将计算最大 ID 与 `history_lastid` 值之间的差值。 在我们的代理上，这很可能一直返回 0。\n\n> 尝试停止 Zabbix 服务器并查看此值如何增加。\n\
  > 不要忘记再次启动 Zabbix 服务器。\n\n现在我们应该将其放入一个项目中。 最重要的是确保此项目直接由服务器处理，而不涉及 Zabbix 代理。 我们有几个选项：\n\
  \n- Passive agent item\n- Active agent item\n- Zabbix trapper item that is populated\
  \ by `zabbix_sender`\n\n\n\n\n\n对于被动代理，服务器应直接查询它。对于主动代理，它应指向 Zabbix 服务器。对于 trapper\
  \ 项目，应使用 zabbix_sender 连接到 Zabbix 服务器。在这三种情况下，主机的分配都应由 Zabbix 服务器进行监控。如果我们使用内部监控在专用主机中收集代理值，则需要一个单独的主机来收集缓冲区数据。这样，我们就可以避免这些值卡在代理缓冲区中。\n\
  \n对于代理项目，我们可以使用如下 UserParameter：\n\n```\nUserParameter=proxy.buffer,sqlite3 /tmp/zabbix_proxy.db\
  \ \"select (select max(proxy_history.id) from proxy_history)-nextid from ids where\
  \ field_name='history_lastid';\"\n```\n\n> 你可能需要使用 sqlite3 二进制文件的完整路径。\n\n至于 Zabbix\
  \ trapper 方法，它可以从 crontab 运行或使用其他任何方法。命令将类似于这样：\n\n```\nzabbix_sender -z zabbix_server\
  \ -s target_host -k item_key -o $(sqlite3 /tmp/zabbix_proxy.db \"select (select\
  \ max(proxy_history.id) from proxy_history)-nextid from ids where field_name='history_lastid';\"\
  )\n```\n\n这里我们使用基本的 zabbix_sender 语法，但值是从 SQLite 查询中获取的。有关 UserParameters 和 zabbix_sender\
  \ 的更多信息，请参阅第 11 章《高级项目监控》。Zabbix trapper 项目将接收与内部缓冲区监控相同的数据——缓冲区大小。触发器将检查此缓冲区是否超过某个阈值。\n\
  \n请注意，这三种方法都可能导致缓冲区项目的一些值丢失——在服务器与代理之间的连接中断时，这些值将不可用。主动代理项目方法会因其具有内存缓冲区而受影响较小，但仍可能存在缺失值。如果在通信中断期间了解缓冲区如何变化是有价值的；此项目可用于触发器，而如前所述的内部项目则可用于更完整的缓冲区统计。\n\
  \n关于触发器和依赖关系，建议使缓冲区触发器依赖于最后访问触发器。这样，如果代理完全消失，则代理后面的主机将被静音，而当代理带着大量缓冲区返回时，缓冲区触发器将使这些主机保持静音。\n\
  \n## 设置被动代理\n\n到目前为止，我们仅配置并讨论了一种代理的工作方式，即主动代理。代理也可以配置为接受来自服务器的传入连接，并且与代理类似；在这种情况下称为被动代理：\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_616_0.png)\n\n与 Zabbix 代理不同，后者的模式是在项目级别设置的，并且单个代理可以在主动和被动模式下同时工作，Zabbix\
  \ 代理一次只能在一个模式下工作。\n\n让我们将我们的主动代理切换到被动模式。首先，编辑 zabbix_proxy.conf 并将 ProxyMode 参数设置为\
  \ 1。切换代理到被动模式所需的全部就是这样——现在重启代理进程。\n\n> 与被动代理不同，Server 参数目前会被被动代理忽略。\n\n在前端中，导航到\
  \ Administration | Proxies 并点击 NAME 列中的 First proxy。选择 Proxy mode 下拉菜单中的 Passive，并注意\
  \ Interface 部分如何出现。在那里，设置你的代理的 IP 地址和端口：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_616_1.png)\n\
  \n## 调整代理配置\n\n虽然代理的许多配置参数与服务器相同（要启动的轮询器、监听端口等），并且有些与代理守护进程相同（主机名），但也有一些代理特定的参数。了解这些参数在诊断代理相关问题时或代理必须部署在特定环境中时可能很有帮助。对于主动代理，以下参数会影响它：\n\
  \n| 选项 | 描述 |\n|---|---|\n| ProxyLocalBuffer | 代理将在本地数据库中保留此小时数的数据。默认情况下，同步到 Zabbix\
  \ 服务器的所有数据都会被删除。如果我们想提取一些未永久存储在 Zabbix 服务器上的数据，例如网络发现值，这可能很有用。 |\n| ProxyOfflineBuffer\
  \ | 如果 Zabbix 服务器不可用，代理将保留此小时数的数据。默认情况下，超过一小时的数据将被丢弃。 |\n| HeartbeatFrequency |\
  \ 默认情况下，Zabbix 代理每分钟向 Zabbix 服务器发送一次心跳消息。此参数允许我们自定义该设置。 |\n| ConfigFrequency | 默认情况下，Zabbix\
  \ 代理每小时从服务器检索一次新配置。对于大型、相对静态的设置，你可能希望增加此值，或者对于小型、更动态的安装，你可能希望减小此值。可以通过重新加载主动代理配置缓存来强制配置数据检索。\
  \ |\n| DataSenderFrequency | 此参数指定代理多久将收集的数据推送到 Zabbix 服务器一次。默认情况下为一秒。由于所有触发器和警报处理都由服务器完成，因此建议保持此值较低。如果没有值需要发送，除心跳连接外，主动代理将不会连接到服务器。\
  \ |\n\n## 使用代理监控远程位置\n\n必须记住，代理不会处理事件，不会生成趋势，也不会发送警报——它们是远程数据收集器，只有当数据传递到 Zabbix\
  \ 服务器时才会发生警报。此外，代理不支持远程命令。虽然计划在 Zabbix 3.2 中实现，但我们必须等待该版本发布才能知道开发是否成功。\n\n代理接管主机监控后，重要的是要知道它们是否可用，并且如果代理本身不可用，也应使代理后面的主机保持静音。我们讨论了几种可以实现的方法，包括代理缓冲区监控，以避免在代理在连接问题期间收集了大量数据且值发送滞后时发出警报。\n\
  \nZabbix 代理易于设置，易于维护，并提供许多好处，因此对于大型环境强烈推荐。\n\n在下一章中，我们将最终讨论你在配置部分在所有主机和代理旁边可能注意到的那个绿色\
  \ NONE。它指的是加密配置——Zabbix 3.0 中的一项新功能。Zabbix 支持基于预共享密钥和证书（TLS）的身份验证和加密。加密支持所有组件——服务器、代理、代理、zabbix_get\
  \ 和 zabbix_sender。我们将设置基于预共享密钥和基于 TLS 的加密。\n\n## 20\n"
- '## 加密 Zabbix 流量


  Zabbix 组件之间的通信默认以明文进行。在许多环境中，这不是一个重要问题，但在互联网上以明文进行监控可能不是一个好方法——传输的数据可能被恶意方读取或篡改。在之前的
  Zabbix 版本中，没有内置解决方案，并且使用了各种 VPN、stunnel 和 SSH 端口转发解决方案。这样的解决方案仍然可以使用，但 3.0 是 Zabbix
  第一个提供内置加密的版本。在本章中，我们将设置多个组件以使用不同类型的加密。


  ### 概述


  对于 Zabbix 通信加密，支持两种类型：


  +   - 预共享密钥

  +   - 基于证书的加密


  **预共享密钥 (PSK)** 类型非常容易设置，但可能更难扩展。基于证书的加密设置可能更复杂，但在更大规模上更容易管理并且可能更安全。


  此加密支持所有 Zabbix 组件之间的通信——服务器、代理、代理，甚至 `zabbix_sender` 和 `zabbix_get`。


  对于传出连接（例如服务器到代理或代理到服务器），只能使用一种类型（无加密，以及 PSK 或基于证书的）。对于传入连接，可以接受多种类型。这样，代理就可以默认使用加密与服务器进行主动或被动项目的通信，然后在调试时使用
  `zabbix_get` 无需加密进行工作。






  # 后端库


  在幕后，Zabbix 加密可以使用三种不同的库之一：OpenSSL、GnuTLS 或 mbedTLS。应该选择哪一个？如果使用软件包，最简单和最安全的方法是使用软件包编译时所使用的库。如果从源码编译，选择最容易编译的库即可。在这两种情况下，这很可能就是打包者推荐并且维护良好的库。Zabbix
  团队已做出重大努力，以尽可能相似的方式从用户角度为所有三个库实现支持。关于某些特定功能的支持可能存在差异，但那些很可能更偏门——如果以后真的出现此类问题，从一个库切换到另一个库应该只需重新编译守护进程即可。虽然在大多数情况下使用哪个库可能差别不大，但了解这一点是个好主意——支持这三种不同库的一个好理由也是，如果当前使用的库存在安全漏洞，可以切换到另一个库。


  > 这些库以通用方式使用，并不要求为不同的 Zabbix 组件使用相同的库——完全可以为 Zabbix 服务器使用一个库，为 Zabbix 代理使用另一个库，为
  zabbix_sender 再使用另一个库。


  在本章中，我们将首先尝试使用 Zabbix 服务器和 zabbix_sender 进行加密，然后再使用 PSK 和基于证书的加密对代理流量进行加密。如果您是从软件包安装，您的服务器很可能已经支持加密。通过查看服务器和代理启动消息来验证：


  ```

  TLS support:          YES

  ```


  > 要了解二进制文件是针对哪个库编译的，可以运行 ldd zabbix_server | egrep -i "ssl|tls"——根据需要替换二进制文件名称。


  如果您是从源码编译且没有 TLS 支持，请通过添加以下其中一个参数重新编译服务器和代理：--with-openssl、--with-gnutls 或 --with-mbedtls。


  ## 预共享密钥加密


  让我们从一个简单的情况开始——一个新主机，Zabbix 服务器将仅接受 PSK 加密的传入连接，而我们将使用 `zabbix_sender` 向其发送一些值。为此，Zabbix
  服务器和 `zabbix_sender` 必须使用 TLS 支持编译。PSK 配置由 PSK 标识和密钥组成。标识是一些不被视为秘密的字符串——它在通信过程中不会被加密；不要在标识字符串中放置敏感信息。密钥是一个十六进制字符串。


  > Zabbix 要求密钥至少为 32 个字符（十六进制数字）长。Zabbix 中的最大长度为 512 个字符，但这可能取决于您使用的后端库的具体版本。


  我们可以直接手动输入密钥，但使用 `openssl` 命令可能稍微容易一些：


  ```

  $ openssl rand -hex 64

  ```


  这将生成一个 512 位密钥，我们稍后会使用它。导航到 **Configuration | Hosts**，点击 **Create host**，并填写以下值：


  - **Hostname:** `Encrypted host`

  - **Groups:** 在 **In groups** 块中仅保留 **Linux servers**


  切换到 **Encryption** 选项卡，在 **Connections from host** 部分，仅保留 **PSK** 标记。在 **PSK identity**
  字段中输入 `secret`，并将我们之前生成的密钥粘贴到 **PSK** 字段中：


  ![](img/f5313a804532fabacc8d07cc8607eeba_623_0.png)


  完成后，点击底部的 Add 按钮。查看此主机的 AGENT ENCRYPTION 列：


  ![](img/f5313a804532fabacc8d07cc8607eeba_624_0.png)


  第一个块只有一个字段，目前显示为 NONE。对于到代理的连接，只可能有一种类型，因此此列必须显示从服务器角度来看当前选择的传出连接类型。第二个块有三个字段。我们可以选择可接受的传入连接类型的组合，因此此列必须显示从服务器角度来看为此主机接受的传入连接类型。


  现在，点击 Encrypted host 旁边的 Items，然后点击 Create item。填写以下值：


  - Name: Beers in the fridge

  - Type: Zabbix trapper

  - Key: fridge.beers


  点击底部的 Add 按钮。让我们现在尝试发送一个值，就像我们在第 11 章《Advanced Item Monitoring》中所做的那样：


  ```

  $ zabbix_sender -z 127.0.0.1 -s "Encrypted host" -k fridge.beers -o 1

  ```


  这应该会失败：


  ```

  info from server: "processed: 0; failed: 1; total: 1; seconds spent: 0.000193"

  ```


  注意 processed 计数为 0，failed 计数为 1。让我们检查 Zabbix 服务器日志文件：


  ```

  12254:20160122:231030.702 connection of type "unencrypted" is not allowed for host
  "Encrypted host" item "fridge.beers" (not every rejected item might be reported)

  ```


  这实际上是一个非常有用的消息——我们没有为 zabbix_sender 指定任何加密，但我们确实要求我们的主机使用加密连接。注意括号中的文字——如果同一主机上的多个项目因此原因失败，我们可能只会看到其中一些，并且仅通过项目键搜索日志文件可能无法揭示原因。


  现在是让 zabbix_sender 的 PSK 正常工作的时候了。运行它并带上 --help 参数，查看 TLS 连接选项部分。哦，是的，有很多。幸运的是，对于
  PSK 加密，我们只需要其中三个：--tls-connect、--tls-psk-identity 和 --tls-psk-file。在运行命令之前，在当前目录中创建一个名为
  zabbix_encrypted_host_psk.txt 的文件，并将我们之前生成的十六进制密钥粘贴其中。


  > 更安全的做法是先创建一个空文件，将其权限更改为 400 或 600，然后再将密钥粘贴到文件中——这样其他用户就不会有机会从文件中窃取密钥。如果有特定用户应该调用
  zabbix_sender，请确保将该用户设为文件的所有者。


  再次运行 zabbix_sender，但带上三个额外的加密参数：


  ```

  $ zabbix_sender -z 127.0.0.1 -s "Encrypted host" -k fridge.beers -o 1 --tls-connect
  psk --tls-psk-identity secret --tls-psk-file zabbix_encrypted_host_psk.txt

  ```


  我们使用 --tls-connect 标志将连接类型设置为 psk，并现在指定了 PSK 标识和密钥文件。


  > 出于安全原因，Zabbix 不支持在命令行上指定 PSK 密钥——它必须从文件中传递。


  这次，值应该成功发送：


  ```

  info from server: "processed: 1; failed: 0; total: 1; seconds spent: 0.000070"

  ```


  为了确认，验证此项目现在在前端是否有数据。


  ## 基于证书的加密


  在 PSK 基于的加密保护了我们的敏感 Zabbix trapper 项目后，让我们转向证书。我们将为 Zabbix 服务器和代理生成证书，并在 Zabbix
  代理端对被动项目要求加密连接。证书颁发机构签署证书，Zabbix 组件可以信任一个或多个颁发机构。通过扩展，它们信任由这些颁发机构签署的证书。


  ## 加密 Zabbix 流量


  您可能在组织中拥有证书基础设施，但对于我们的首次测试，我们将自行生成所有必需的证书。我们需要一个新的 **证书颁发机构 (CA)** 来签署我们的证书。Zabbix
  不支持自签名证书。


  > 强烈建议使用中间证书颁发机构来签署客户端和服务器证书——在下面的简单示例中我们不会使用它们。


  ## 成为自己的颁发机构


  我们将开始在一个单独的目录中创建证书。为简单起见，让我们在 `A test host` 上执行此操作——选择任何进行证书签名的目录。


  以下内容并不旨在成为良好实践。它实际上为了更快地获取证书而做了相当多的不安全和糟糕的事情。请不要将这些步骤用于任何生产环境。


  ```

  ```bash

  $ mkdir zabbix_ca

  $ chmod 700 zabbix_ca

  $ cd zabbix_ca

  ```

  ```


  生成根 CA 密钥：


  ```

  ```bash

  $ openssl genrsa -aes256 -out zabbix_ca.key 4096

  ```

  ```


  提示时，输入密码两次以保护密钥。生成并自签名根证书：


  ```

  ```bash

  $ openssl req -x509 -new -key zabbix_ca.key -sha256 -days 3560 -out

  zabbix_ca.crt

  ```

  ```


  提示时，输入您之前为密钥使用的密码。按提示填写值——最简单的方法可能是为除国家代码和常用名称外的多数项提供空值。常用名称对于我们的测试不需要太有意义，因此使用简单的字符串如
  zabbix_ca 就足够了。


  现在，开始创建我们将用于 Zabbix 服务器的证书——首先，让我们生成服务器密钥和 **证书签名请求 (CSR)**：


  ```

  ```bash

  $ openssl genrsa -out zabbix_server.key 2048

  $ openssl req -new -key zabbix_server.key -out zabbix_server.csr

  ```

  ```






  当提示时，输入国家代码和通用名称字符串，与之前一样。通用名称不必匹配服务器、代理名称或其他任何内容，因此使用一个简单的字符串（如 `zabbix_server`）就足够了。现在让我们签署这个请求：


  ```

  $ openssl x509 -req -in zabbix_server.csr -CA zabbix_ca.crt -CAkey zabbix_ca.key
  -CAcreateserial -out zabbix_server.crt -days 1460 -sha256

  ```


  当提示时，输入 CA 密码。让我们继续为 Zabbix agent 生成证书。生成 agent 密钥和证书签名请求：


  ```

  $ openssl genrsa -out zabbix_agent.key 2048

  $ openssl req -new -key zabbix_agent.key -out zabbix_agent.csr

  ```


  当提示时，输入国家代码和通用名称字符串，与之前一样。通用名称不必匹配服务器、代理名称或其他任何内容，因此使用一个简单的字符串（如 `zabbix_agent`）就足够了。现在，让我们签署这个请求：


  ```

  $ openssl x509 -req -in zabbix_agent.csr -CA zabbix_ca.crt -CAkey zabbix_ca.key
  -CAcreateserial -out zabbix_agent.crt -days 1460 -sha256

  ```


  当提示时，输入 CA 密码。


  我们已经完成了测试证书的创建。两个密钥都是未加密创建的——Zabbix 目前不支持提示输入密钥密码。


  ## 使用证书设置 Zabbix


  现在，让 A test host 上的被动监控项使用我们刚刚生成的证书。我们必须将证书提供给 Zabbix agent。在 Zabbix agent 配置文件所在的目录中，创建一个名为
  zabbix_agent_certs 的新目录。限制对它的访问，如下所示：


  ```

  # chown zabbix zabbix_agent_certs

  # chmod 500 zabbix_agent_certs

  ```


  从我们生成证书的目录，将相关的证书文件复制到新目录：


  ```

  # cp zabbix_ca.crt /path/to/zabbix_agent_certs/

  # cp zabbix_agent.crt /path/to/zabbix_agent_certs/

  # cp zabbix_agent.key /path/to/zabbix_agent_certs/

  ```


  编辑 zabbix_agentd.conf，修改以下参数：


  ```

  TLSAccept=cert

  TLSConnect=unencrypted

  TLSCAFile=/path/to/zabbix_agent_certs/zabbix_ca.crt

  TLSCertFile=/path/to/zabbix_agent_certs/zabbix_agent.crt

  TLSKeyFile=/path/to/zabbix_agent_certs/zabbix_agent.key

  ```


  这将使 agent 只接受加密连接，并要求使用由该 CA（直接或通过中间证书）签名的证书。对于主动监控项，我们仍然使用未加密的连接。用户可能会提供证书并期望所有通信现在都已加密，但事实并非如此，除非
  TLSAccept 或 TLSConnect 参数中有一个要求加密。为了防止静默忽略证书文件，Zabbix 在提供证书时会强制要求设置 TLSAccept 或
  TLSConnect 之一。重新启动 Zabbix agent。


  > 如果某个证书被泄露，证书颁发机构可以通过在证书吊销列表（CRL）中列出该证书来吊销它。Zabbix 通过 TLSCRLFile 参数支持 CRL。


  让我们看一下 Zabbix 前端的主机配置列表：


  ![](img/f5313a804532fabacc8d07cc8607eeba_628_0.png)


  看起来与 A test host 的连接不再工作了。让我们检查 agent 日志文件：


  ```

  failed to accept an incoming connection: from 127.0.0.1: unencrypted connections
  are not allowed

  ```


  看起来我们把它弄坏了。我们确实在 agent 上设置了加密，但没有来得及配置服务器端。如果我们想向所有 agent 推广加密，并稍后再处理服务器，该怎么办？在这种情况下，最好设置
  TLSAccept=cert,unencrypted——这样，agent 仍然会接受来自我们服务器的未加密连接。一旦证书在 Zabbix 服务器上部署并配置完成，我们只需从该参数中移除
  unencrypted，然后重新启动 Zabbix agents。让我们试试——再次修改 zabbix_agentd.conf：


  ```

  TLSAccept=cert,unencrypted

  ```


  重启 agent 守护进程，观察监控从 Zabbix 服务器恢复。现在，让服务器使用它的证书。我们将把证书放在 Zabbix 服务器可以使用的地方。在 Zabbix
  服务器配置文件所在的目录中，创建一个名为 zabbix_server_certs 的新目录。限制对它的访问，如下所示：


  ```

  # chown zabbix zabbix_server_certs

  # chmod 500 zabbix_server_certs

  ```


  > 如果使用的软件包以不同的用户名（如 zabbixs 或 zabbixsrv）运行 Zabbix 服务器，请在两条命令中将用户名替换为正确的用户名。


  从我们生成证书的目录，将证书复制到新目录：


  ```

  # cp zabbix_ca.crt /path/to/zabbix_server_certs/

  # cp zabbix_server.crt /path/to/zabbix_server_certs/

  # cp zabbix_server.key /path/to/zabbix_server_certs/

  ```


  编辑 zabbix_server.conf，修改以下参数：


  ```

  TLSCAFile=/path/to/zabbix_server_certs/zabbix_ca.crt

  TLSCertFile=/path/to/zabbix_server_certs/zabbix_server.crt

  TLSKeyFile=/path/to/zabbix_server_certs/zabbix_server.key

  ```


  现在，重启 Zabbix 服务器。虽然我们已经在 agent 和服务器上都指定了证书，但被动监控项仍然以未加密模式工作。让我们继续把它们改成加密的。在 Zabbix
  前端中，导航到“配置 | 主机”，点击 A test host，并切换到“加密”标签页。在“与主机的连接”选择中，选择“证书”，然后点击“更新”按钮。服务器配置缓存更新后，它将为主机切换到基于证书的加密。


  > 我们正在更改 A test host 的配置，而不是 Encrypted host。


  回到我们之前缓慢向 agent 部署基于证书的配置、稍后再添加到服务器的场景，我们现在可以在 agent 端禁用未加密连接。修改 zabbix_agentd.conf：


  ```

  TLSAccept=cert

  ```


  ## 加密 Zabbix 流量


  重启 agent。如果我们从一开始就遵循这个过程，监控将不会中断。让我们尝试使用 zabbix_get：


  ```

  ```bash

  $ zabbix_get -s 127.0.0.1 -k system.cpu.load

  zabbix_get [5746]: Check access restrictions in Zabbix agent configuration

  ```

  ```


  这会失败，因为 agent 现在只接受加密连接。就像我们对 `zabbix_sender` 所做的那样，我们可以指定证书——但我们现在必须使用 Zabbix 服务器证书。


  此命令需要访问 Zabbix 服务器证书：


  ```

  ```bash

  $ zabbix_get -s 127.0.0.1 -k system.cpu.load --tls-connect cert --tls-ca-file /path/to/zabbix_server_certs/zabbix_ca.crt
  --tls-cert-file /path/to/zabbix_server_certs/zabbix_server.crt --tls-key-file /path/to/zabbix_server_certs/zabbix_server.key

  0.030000

  ```

  ```


  当然，这带来了更安全的环境。仅仅伪造 IP 地址不足以访问这个 agent。仅仅在 Zabbix 服务器上拥有一个账户也不足以访问所有 agent——还需要访问服务器证书。另一方面，这也使调试变得稍微复杂一些，因为我们无法轻易查询
  agent，嗅探流量也更加困难。


  我们使用了 PSK 和基于证书的加密，配合 `zabbix_sender`、`zabbix_get` 和被动 agent，但同样的原理也适用于主动 agent。作为练习，尝试让主动
  agent 监控项也使用加密工作。


  ## 关注点与进一步阅读


  目前，加密是 Zabbix 中一个非常新的功能。尽管它已经经过极其仔细和严密的开发和测试，但仍可能获得进一步的改进。请务必阅读官方加密文档以获取更多细节，并关注可能的更改。现在，让我们讨论一些基本的关注点和缺失的功能。


  到目前为止，本章涵盖了 Zabbix 服务器、agents、zabbix_get 和 zabbix_sender——那么 Zabbix 代理（proxies）呢？Zabbix
  代理完全支持加密。代理端的配置与 agent 配置非常相似，前端中的配置方式也与 agent 加密配置类似。请记住，所有涉及的组件都必须使用 TLS 支持编译——你拥有的任何代理可能都需要重新编译。在考虑加密时，想想最需要它的地方——也许你的
  Zabbix 服务器和代理通过互联网通信，而所有其他连接都在本地网络中。在这种情况下，可能先只为服务器与代理之间的通信设置加密是合理的。注意，与 Zabbix
  Java gateway 通信时不支持加密，但可以很容易地让 gateway 与 localhost 上的 Zabbix 代理通信，而该代理再为与 Zabbix
  服务器的通道提供加密。


  我们已经了解了如何在不中断数据收集的情况下无缝升级和过渡到加密——所有组件能够接受各种连接类型，这使我们能够按顺序逐步推行更改。


  可能有人只想部分实施加密的一个重要原因是性能。目前，Zabbix 不重用连接，不实现 TLS 会话缓存，也不使用任何其他机制来避免每次都从头建立加密连接。如果你有很多被动
  agent 监控项，这尤其致命。在重新配置之前，请务必了解潜在的影响。


  加密目前不用于身份验证目的。也就是说，我们不能省略主动 agent 的主机名，并仅根据证书来确定它是哪个主机。同样，我们也不能将加密连接用于主动 agent 的自动注册。


  对于基于证书的加密，我们只指定了证书和 CA 信息。如果所使用的 CA 覆盖范围很大，那就不太安全——只要是由该 CA 签名的任何证书都会被接受。Zabbix
  还允许验证远程证书的签发者和主题。除非你使用的是仅用于 Zabbix 的内部 CA，否则强烈建议限制签发者和主题。这可以通过前端的主机或代理属性，以及使用 agent
  或代理配置文件中的 `TLS ServerCertIssuer` 和 `TLS ServerCertSubject` 参数来完成。






  ## 总结


  在本章中，我们探讨了所有组件之间支持的内置 Zabbix 加密——server、proxy、agent、zabbix_sender 和 zabbix_get。虽然
  Java gateway 不支持加密，但可以轻松地在 gateway 前放置一个 Zabbix proxy，以提供返回 Zabbix server 的加密通信。


  Zabbix 支持预共享密钥和基于 TLS 证书的加密，并且可以使用三种不同的后端库之一——OpenSSL、GnuTLS 或 mbedTLS。如果某个库存在安全或其他问题，用户可以选择切换到另一个库。


  升级和加密部署可以分步完成。所有 Zabbix 组件都可以同时接受多种连接类型。在我们的示例中，agent 会被设置为同时接受加密和非加密连接；当我们完成所有
  agent 的加密配置后，我们将在 server 端切换到加密连接。一旦验证其按预期工作，就可以在 agent 上禁用非加密连接。


  由于加密是内置且易于设置的，值得记住的是，加密连接需要更多资源，而且 Zabbix 不支持连接池或其他可以降低负载的方法。或许值得先保护最重要的通道，将终端节点留到以后处理。例如，加密
  Zabbix server 与 proxy 之间的通信可能会优先于与各个 agent 的连接。


  在下一章中，我们将更深入地接触 Zabbix 数据。这将包括直接从数据库检索监控数据，以及在紧急情况下（例如丢失所有管理员密码）修改数据库。我们还将讨论 XML
  导出和导入功能以及 Zabbix API。


