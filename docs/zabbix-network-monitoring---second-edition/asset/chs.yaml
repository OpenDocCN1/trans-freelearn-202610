  ### 关于作者


  **里哈兹·奥卢普斯**在信息技术领域拥有超过 15 年的经验，其中大部分时间从事开源解决方案。他在 2001 年第一个公开版本发布时就接触了 Zabbix——领先的开源企业级监控解决方案之一，这使他能够积累大量相关知识。里哈兹曾受雇于政府机构，主要参与开源软件的部署，范围从服务器到桌面级软件，其中以
  Zabbix 为重点。后来，他加入了 Zabbix SIA——本书所介绍的软件背后的公司，这让他在这个领域积累了更多经验。


  在 Zabbix 工作期间，他帮助 Zabbix 用户和客户充分利用这一监控工具，并负责提供 Zabbix 培训课程，一些学员称这些课程非常实用且颇具挑战性。


  他在加入 Zabbix 之前就开始撰写第一本关于 Zabbix 的书《Zabbix 1.8 网络监控》，并在帮助推进 Zabbix 的同时，以更深入的细节完成了这本书。


