  \ 5 章 Managing Hosts, Users and Permissions 中更详细地介绍权限。\n\n我们为主机更改的字段应如下所示：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_68_0.png)\n\
  \n准备就绪后，单击底部的 Add 按钮。\n\n## Creating an item\n\n所以，我们创建了我们自己的第一个主机。但由于项目是所有数据的基础，现在可能用处不大。为了让它更有实质内容，我们应该创建项目，因此从\
  \ Groups 下拉菜单中选择 Linux servers，然后单击我们刚刚创建的主机 A test host 旁边的 Items。此主机没有要列出的项目——单击右上角的\
  \ Create item 按钮。\n\n有一个表单，模糊地类似于主机创建表单，所以让我们填写一些值：\n\n- **Name:** 在此字段中输入 `CPU\
  \ load`。这就是项目的名称——基本上，你将在大多数地方用来引用项目的名称。\n- **Key:** 此字段中的值为 `system.cpu.load`。这是项目的“技术名称”，标识它收集的信息。\n\
  - **Type of information:** 选择 `Numeric (float)`。这定义了传入数据的格式和类型。\n\n填写所有必填信息后，你将看到以下屏幕：\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_69_0.png)\n\n我们稍后会更详细地查看其他默认值，所以单击底部的\
  \ **Add** 按钮。\n\n> 有关项目键的更多信息，请参阅 *Chapter 3, Monitoring with Zabbix Agents and\
  \ Basic Protocols。*\n\n你现在应该在列表中看到你的新项目。但我们对相关数据感兴趣，所以导航到 **Monitoring | Latest\
  \ data**。注意到占据半页的过滤器吗？这次，我们希望立即使用它。\n\n从 Zabbix 2.4 开始，出于性能原因，**Latest data** 页面默认不显示任何数据；因此，我们必须先设置过滤器：\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_69_1.png)\n\n在 **Filter** 中，在 **Hosts**\
  \ 字段中输入 `test`。我们新主机应该会出现。单击它，然后单击 **Filter** 按钮。在过滤器下方，如果已折叠，请展开 - other - 部分。你可能需要等待保存项目后最多一分钟，然后你应该会看到此新创建的项目已经收集了一些数据：\n\
  \n| NAME ▲ | LAST CHECK | LAST VALUE |\n|---|---|---|\n| - other - (1 item) | |\
  \ |\n| CPU load | 2016-02-16 20:44:55 | 0.05 |\n\n如果完全看不到任何条目怎么办？这通常意味着数据未被收集，这可能有多种原因。如果是这种情况，请检查以下常见原因：\n\
  \n- 你是否完全按照屏幕截图输入了项目配置？检查项目键和信息类型。\n- 代理和服务器是否都在运行？你可以通过以下方式作为 root 执行来检查：\n  ```\n\
  \  # netstat -ntpl | grep zabbix\n  ```\n  输出应列出服务器和代理守护进程在正确的端口上运行：\n  ```\n  tcp\
  \ 0 0 0.0.0.0:10050 0.0.0.0:* LISTEN 23569/zabbix_agentd\n  tcp 0 0 0.0.0.0:10051\
  \ 0.0.0.0:* LISTEN 23539/zabbix_server\n  ```\n  如果其中任何一个缺失，请确保启动它。\n- 服务器能否连接到代理？你可以从\
  \ Zabbix 服务器执行以下操作来验证：\n  ```\n  $ telnet localhost 10050\n  ```\n  如果连接失败，可能意味着代理未运行或某些限制性防火墙设置阻止了连接。在某些情况下，SELinux\
  \ 也可能阻止该连接。\n  如果连接成功但立即关闭，则代理接收到的连接 IP 地址与 `zabbix_agentd.conf` 配置文件中 `Server`\
  \ 指令指定的地址不匹配。在某些发行版中，这可能是由于默认使用 IPv6，因此你应该尝试向该指令的同一行添加另一个以逗号分隔的值，用于 IPv6 localhost\
  \ 表示形式 `::1`。\n\nZabbix 服务器默认每分钟将要监控的所有项目信息读入缓存一次。这意味着添加新项目等配置更改可能在收集的数据中在一分钟后才会显示效果。此间隔可以在\
  \ `zabbix_server.conf` 中通过更改 `CacheUpdateFrequency` 参数进行调整。\n\n一旦数据开始到达，你可能会在 **Change**\
  \ 列中看到没有值。这意味着你很快就转到此显示，并且项目只设法收集了一个值；因此，尚无变化。如果是这种情况，等待片刻应该会导致页面自动刷新（查看页面标题——还记得我们在用户配置文件中未更改的\
  \ 30 秒刷新吗？），并且 **Change** 列将被填充。所以，我们现在正在监控一个单一值：UNIX 系统负载。数据会自动检索并存储在数据库中。如果你不熟悉这个概念，阅读\
  \ `https://en.wikipedia.org/wiki/Load_(computing)` 上的概述可能是一个好主意。\n\n## Introducing\
  \ simple graphs\n\n如果你去阅读系统负载，几分钟应该已经过去了。现在是查看 Zabbix 中的另一个功能 **Graphs** 的好时机。图形可自由用于任何监控的数值项目，无需额外配置。\n\
  \n你应该仍在 **Latest data** 屏幕上，并且可以看到 **CPU load** 项目，因此单击名为 **Graph** 的链接。你会得到类似这样的内容：\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_71_0.png)\n\n\n\nWhile you will probably\
  \ get less data, unless reading about system load took you more than an hour, your\
  \ screen should look very similar overall. Let's explore some basic graph controls.\n\
  \n> If you don't see any data even after several minutes have passed, try dragging\
  \ the scrollbar above the graph to the rightmost position.\n\nThe Zoom controls\
  \ in the upper-left corner allow you to quickly switch the displayed period. Clicking\
  \ on any of the entries will make the graph show data for the chosen duration. At\
  \ first, Zabbix is a bit confused about us having so little data; it thus shows\
  \ all the available time periods here. As more data is gathered, only the relevant\
  \ periods will be shown, and longer zoom periods will gradually become available.\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_72_0.png)\n\nBelow these controls are\
  \ options that seek through time periods; clicking on them will move the displayed\
  \ period by the exact time period that was clicked on.\n\nThe scrollbar at the top\
  \ allows you to make small changes to the displayed period: drag it to the left\
  \ (and notice the period at the top of the graph changing) and then release, and\
  \ the graph is updated to reflect the period changes. Notice the arrows at both\
  \ ends of the scrollbar: they allow you to change the duration displayed. Drag these\
  \ with your mouse just like the scrollbar. You can also click on the buttons at\
  \ both ends for exact adjustments. Using these buttons moves the period back and\
  \ forth by the time period that we currently have displayed.\n\nThe date entries\
  \ in the upper-right corner show the start and end times for the currently displayed\
  \ data, and they also provide calendar widgets that allow a wider range of arbitrary\
  \ period settings. Clicking on one of these time periods will open a calendar, where\
  \ you can enter the time and date and have either the start or end time set to this\
  \ choice:\n\n![](img/f5313a804532fabacc8d07cc8607eeba_73_0.png)\n\nTry entering\
  \ a time in the past for the starting (leftmost) calendar. This will move the displayed\
  \ period without changing its length. This is great if we are interested in a time\
  \ period of a specific length, but what if we want to look at a graph for the previous\
  \ day, from 08:30 till 17:00? For this, the control (fixed) in the lower-right corner\
  \ of the scrollbar will help. Click on it once—it changes to (dynamic). If you now\
  \ use calendar widgets to enter the start or end time for the displayed period,\
  \ only this edge of the period will be changed.\n\nFor example, if a 1-hour period\
  \ from 10:00 to 11:00 is displayed, setting the first calendar to 09:00 while in\
  \ (fixed) mode will display the period from 09:00 till 10:00. If the same is done\
  \ while in (dynamic) mode, a two-hour period from 09:00 till 11:00 will be displayed.\
  \ The end edge of the period is not moved in the second case.\n\n> Depending on\
  \ the time at which you are looking at the graphs, some areas of the graph might\
  \ have a gray background. This is the time outside of working hours, as defined\
  \ in Zabbix. We will explore this in more detail later.\n\nClicking and dragging\
  \ over the graph area will zoom in to the selected period once the mouse button\
  \ is released. This is handy for a quick drilldown to some problematic or interesting\
  \ period:\n\n![](img/f5313a804532fabacc8d07cc8607eeba_74_0.png)\n\nThe yellow area\
  \ denotes the time period we selected by clicking, holding down the mouse button,\
  \ and dragging over the graph area. When we release the mouse button, the graph\
  \ is zoomed to the selected period.\n\n> The graph period can't be shorter than\
  \ one minute in Zabbix. Attempting to set it to a smaller value will do nothing.\
  \ Before version 3.0, the shortest possible time period was one hour.\n\n## Creating\
  \ triggers\n\nNow that we have an item successfully gathering data, we can look\
  \ at it and verify whether it is reporting as expected (in our case, that the system\
  \ is not overloaded). Sitting and staring at a single parameter would make for a\
  \ very boring job. Doing that with thousands of parameters doesn't sound too entertaining,\
  \ so we are going to create a trigger. In Zabbix, a trigger is an entry containing\
  \ an expression to automatically recognize problems with monitored items.\n\n> An\
  \ item alone does nothing more than collect the data. To define thresholds and things\
  \ that are considered a problem, we have to use triggers.\n\nNavigate to Configuration\
  \ | Hosts, click on Triggers next to A test host, and click on Create trigger.\n\
  \nHere, only two fields need to be filled in:\n- **Name:** Enter `CPU load too high\
  \ on A test host for last 3 minutes`\n- **Expression:** Enter `{A Test Host:system.cpu.load.avg(180)}>1`\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_75_0.png)\n\nIt is important to get the\
  \ expression correct down to the last symbol. Once done, click on the **Add** button\
  \ at the bottom. Don't worry about understanding the exact trigger syntax yet; we\
  \ will get to that later.\n\nNotice how our trigger expressions refer to the item\
  \ key, not the name. Whenever you have to reference an item inside Zabbix, it will\
  \ be done by the item key.\n\nThe trigger list should be now displayed, with a single\
  \ trigger — the one we just created. Let's take a look at what we just added: open\
  \ **Monitoring | Triggers**. You should see our freshly added trigger, hopefully\
  \ already updated, with a green **OK** flashing in the **STATUS** column:\n\n![](img/f5313a804532fabacc8d07cc8607eeba_75_1.png)\n\
  \nYou might see **PROBLEM** in the **STATUS** field. This means exactly what the\
  \ trigger name says — the `CPU load too high on A test host for last 3 minutes`.\n\
  \nNotice the big filter?\n\n![](img/f5313a804532fabacc8d07cc8607eeba_75_2.png)\n\
  \nWe have configured the server to send e-mail messages and set what the From address\
  \ should be, but it still doesn't know the e-mail addresses that our defined users\
  \ have, which is required to send alerts to them. To assign an e-mail address to\
  \ a user, open Administration | Users. You should see only two users: Admin and\
  \ Guest. Click on Admin in the ALIAS column and switch to the Media tab:\n\n![](img/f5313a804532fabacc8d07cc8607eeba_77_0.png)\n\
  \nClick on the Add button:\n\n![](img/f5313a804532fabacc8d07cc8607eeba_77_1.png)\n\
  \nThe only thing you have to enter here is a valid e-mail address in the Send to\
  \ textbox—preferably yours. Once you are done, click on Add and then Update in the\
  \ user properties screen.\n\nThat finishes the very basic configuration required\
  \ to send out notifications through e-mail for this user.\n\n## Creating an action\n\
  \nAnd now, it's time to tie all this together and tell Zabbix that we want to receive\
  \ e-mail notifications when our test box is under heavy load.\n\n## Getting Your\
  \ First Notification\n\nThings that tell the Zabbix server to do something upon\
  \ certain conditions are called **actions**. An action has three main components:\n\
  - **Main configuration**: This allows us to set up general options, such as the\
  \ e-mail subject and the message.\n- **Action operations**: These specify what exactly\
  \ has to be done, including who to send the message to and what message to send.\n\
  - **Action conditions**: These allow us to specify when this action is used and\
  \ when operations are performed. Zabbix allows us to set many detailed conditions,\
  \ including hosts, host groups, time, specific problems (triggers) and their severity,\
  \ as well as others.\n\nTo configure actions, open **Configuration | Actions** and\
  \ click on **Create action**. A form is presented that lets you configure preconditions\
  \ and the action to take:\n\n![](img/f5313a804532fabacc8d07cc8607eeba_78_0.png)\n\
  \nFirst, enter a **NAME** for our new action, such as `Test action`, and check the\
  \ **Recovery message** checkbox. Next, we should define the operation to perform,\
  \ so switch to the **Operations** tab. In the **Operation** tab, insert `3600` in\
  \ **Default operation step duration**, as shown in the following screenshot:\n\n\
  ![](img/f5313a804532fabacc8d07cc8607eeba_78_1.png)\n\nIn here, click on **New**\
  \ in the **Action operations** block. This will open the **Operation details** block:\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_79_0.png)\n\nIn the **Send to Users**\
  \ section, click on the **Add** control. In the resulting popup, click on the **Admin**\
  \ user. Now locate the **Add** control for the **Operation details** block. This\
  \ can be a bit confusing as the page has four controls or buttons called **Add**\
  \ right now. The correct one is highlighted here:\n\n![](img/f5313a804532fabacc8d07cc8607eeba_79_1.png)\n\
  \n\n\n\n点击高亮显示的**Add**控件。恭喜！你刚刚配置了一个最简单的动作，所以点击**Action**块中的Add按钮。\n\n## Zabbix中的信息流\n\
  \n我们已经在Zabbix前端配置了各种东西，包括数据收集（**Item**）、阈值定义（**Trigger**）以及超过阈值时该做什么的指令（**Action**）。但这些是如何协同工作的呢？Zabbix实体之间的信息流乍看起来可能并不明显。让我们看一个示意图，展示各个部分如何组合在一起：\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_80_0.png)\n\n在我们的Zabbix服务器安装中，我们创建了一个主机（A\
  \ test host），其中包含一个监控项（CPU load）。触发器引用此监控项。每当触发器表达式匹配当前监控项的值时，触发器切换到**PROBLEM**状态。当不再匹配时，它切换回**OK**状态。每次触发器改变状态时，都会生成一个事件。事件包含触发器状态更改的详细信息：发生时间以及新状态是什么。在配置动作时，我们可以添加各种条件，以便仅处理某些事件。在我们的案例中，我们没有添加任何条件，因此所有事件都会被匹配。每个动作还包含操作，这些操作定义了具体要做什么。最后，实际操作会被执行，这通常发生在Zabbix服务器外部，例如发送电子邮件。\n\
  \n触发器也可能处于**UNKNOWN**状态。如果没有足够的数据来确定当前状态，就会发生这种情况。例如，在过去10分钟没有数据的情况下计算过去5分钟的平均值，会使触发器进入**UNKNOWN**状态。导致进入或离开**UNKNOWN**状态的事件不会匹配正常的动作条件。\n\
  \n## 让我们产生一些负载\n\n好的，我们配置了电子邮件发送。但除非我们实际收到一些通知，否则这并不有趣。让我们增加测试系统的负载。在控制台中运行以下命令：\n\
  \n```\n$ cat /dev/urandom | md5sum\n```\n\n这会抓取一个伪随机、永不结束的字符流并计算其MD5校验和，因此系统负载应该会随之增加。你可以通过图表观察结果——导航到**监控\
  \ | 最新数据**，再次点击单个监控项的**图表**：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_81_0.png)\n\
  \n注意系统负载是如何攀升的。如果你的测试系统能够很好地应对这样的进程，可能还不够——在这种情况下，你可以尝试同时运行多个MD5校验和计算进程。\n\n## 获取你的第一条通知\n\
  \n等待**3分钟**过去，右上角应该会出现一个弹出窗口，并伴有声音提示：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_82_0.png)\n\
  \n这是我们之前用户配置文件中启用的前端消息之一。让我们看看消息窗口中显示了什么：\n\n- 小的灰色矩形代表触发器严重性。对于恢复消息，它是绿色的。我们将在*第6章，使用触发器检测问题*中讨论触发器。\n\
  - 第一个链接指向**监控 | 触发器**页面，显示导致消息的主机当前问题。\n- 第二个链接指向**监控 | 事件**页面，显示相关触发器的历史问题。在这种情况下，它被分成两行显示。\n\
  - 第三个链接指向事件详情，显示有关此特定事件的更多信息。\n\n窗口本身可以垂直重新定位，但不能水平移动——只需通过标题栏拖动它。窗口顶部有三个按钮：\n\n\
  ![](img/f5313a804532fabacc8d07cc8607eeba_82_1.png)\n\n这些按钮也有工具提示来提醒我们它们的作用，如下所示：\n\
  \n- 暂停按钮使当前正在播放的警报声音静音。\n- 静音/取消静音按钮允许禁用/启用所有声音。\n- 清除按钮清除当前可见的消息。以这种方式清除的问题不会再次出现，除非它已解决然后再次发生。\n\
  \n前端消息很有用，因为它提供了：\n\n- 当你不明确查看当前问题列表时，及时通知新问题和已解决的问题\n- 声音警报\n- 快速访问问题详情\n\n现在是一个好时机来重新审视这些前端消息的配置选项。再次点击右上角的链接打开个人资料，并切换到“消息”选项卡：\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_83_0.png)\n\n以下是这些参数的含义：\n\n- **前端消息**：为此用户启用/禁用消息。\n\
  - **消息超时（秒）**：用于指定消息应显示多长时间。它影响消息本身，尽管它也可能影响声音警报。\n- **播放声音**：此下拉选项有**一次**、**10秒**和**消息超时**。第一个将完整播放一次声音。第二个将播放10秒的声音，如有必要则循环。第三个将在消息显示期间循环播放声音。\n\
  - **触发器严重性**：允许根据触发器严重性限制消息（有关触发器的更多信息，请参阅*第6章，使用触发器检测问题*）。取消选中复选框将完全不会通知您该特定严重性。如果您想收到消息但不想收到声音警报，请从下拉菜单中选择`no_sound`。\n\
  \n> 可以通过将.wav文件复制到前端目录中的audio子目录来添加新声音。\n\n之前，在配置前端消息时，我们将消息超时设置为180秒。唯一的原因是让我们在弹出窗口第一次出现时有足够的时间来探索它；这不是使用此功能的要求。\n\
  \n现在，让我们打开**监控 | 触发器**。我们应该看到`CPU load too high on A test host for last 3 minutes`触发器可见，在**状态**列中带有红色闪烁的**PROBLEM**文本：\n\
  \n| 严重性 | 状态 | 信息 | 最后变更 ▼ | 年龄 | 确认 | 主机 | 名称 |\n|---|---|---|---|---|---|---|---|\n\
  | 未分类 | PROBLEM | | 2016-02-17 01:27:25 | 5m 54s | 否 3 | A test host | CPU load\
  \ too high on A test host for last 3 minutes |\n\n> 闪烁表示触发器最近改变了状态，这正是我们通过增加系统负载所实现的。\n\
  \n然而，如果你收到了新的电子邮件通知，你在打开**监控 | 触发器**之前应该已经知道这个状态变化。如果一切如预期，你应该收到一封通知你问题的电子邮件，所以如果还没有，请检查你的电子邮件客户端。应该有一封主题为**PROBLEM:\
  \ CPU load too high on A test host for last 3 minutes**的消息。\n\n邮件没有到达？这通常是由邮件传递链中的某些配置错误导致消息无法传递造成的。如果可能，请检查邮件服务器的日志文件以及网络连接和垃圾邮件过滤器。前往**报表\
  \ | 动作日志**可能会显示有用的错误消息。\n\n你现在可以用简单的*Ctrl + C*停止所有MD5校验和计算进程。触发器随后应该将状态更改为**OK**，但你应该至少等待配置的监控项间隔30秒过去。\n\
  \n再次检查你的电子邮件：应该还有一条消息，这次通知你现在一切正常，主题为**OK: CPU load too high on A test host for\
  \ last 3 minutes**。\n\n恭喜，你已经设置了所有必需的配置，以便在任何事情出错以及恢复正常时接收警报。让我们回顾一下我们做了什么以及学到了什么：\n\
  \n- 我们创建了一个主机。主机是Zabbix中被监控设备的表示，可以附加监控项。\n- 我们还创建了一个监控项，它是获取Zabbix系统信息的基本方式。记住：唯一的监控项标识符是key，它也是指定实际将收集哪些数据的字符串。需要一个主机来附加此监控项。\n\
  - 我们探索了监控项的简单图表，无需任何配置即可立即使用。易于使用的时间段选择控件允许我们查看任何时间段，并快速缩放以进行下钻分析。\n- 已经拥有数据本身就是一项成就，但定义什么是问题使我们可以免于手动尝试理解大量数值。这就是触发器的用武之地。它们包含定义阈值的表达式。\n\
  - 拥有问题列表而不是原始数据向前迈进了一步，但仍然需要有人查看列表。我们更希望得到通知——这就是动作的作用。我们能够指定谁应该在何时收到通知。\n\n## 基本监控项配置\n\
  \n我们匆匆完成了简单监控项的配置，所以你可能对我们未更改或未讨论的参数感到好奇。让我们快速看看可以监控什么以及我们可以为每个监控项配置什么。\n\nZabbix可以监控相当广泛的系统特性。从功能上，我们可以将它们分为类别，而从技术上讲，每种使用的方法对应一种监控项类型。\n\
  \n## 监控类别\n\n让我们看看我们可以关注的通用类别。当然，这不是一个详尽的监控列表——将其视为一组有趣的参数示例。你很快就会发现在Zabbix配置中发现更多可以添加的领域。\n\
  \n\n\n\n\n## 可用性\n\n我们一开始使用的简化示例（派对上那个倒霉的管理员——还记得他吗？）可能吓不到很多人，但可用的噩梦场景比我们愿意想到的要多得多。各种服务可能在没有征兆的情况下死亡，直到为时已晚，而一个内存泄漏就足以轻松拖垮系统。\n\
  \n我们将尝试探索可用的选项，以尽可能早地检测到此类情况，以便例如帮助我们的管理员在工作日处理磁盘空间问题，并在他推门而入时发现重要服务因数据库故障而死亡。\n\
  \n## 性能\n\n性能是计算领域众多圣杯之一。系统永远不够快以满足所有需求，因此我们必须在期望的操作与可用资源之间取得平衡。Zabbix 既可以帮助您评估特定操作的性能，也能监控当前负载。\n\
  \n您可以从简单的事情开始，例如网络性能，由 ping 往返时间或网站返回内容所需的时间来表示，然后继续处理更复杂的场景，例如集群中服务的平均性能与磁盘阵列吞吐量相结合。\n\
  \n## 安全\n\n计算领域的另一个圣杯是安全，这是一个永无止境的过程，您需要使用许多工具，其中之一可以是 Zabbix。\n\nZabbix 可以独立于其他验证系统，检查诸如开放端口、软件版本和文件校验和等简单事项。虽然这些作为唯一的<|message|>安全措施是可笑的，但它们可以成为现有流程的宝贵补充。\n\
  \n## 管理\n\n系统管理涉及做很多事情，这意味着在所有这些步骤中遵循一套规则。优秀的系统管理员从未在这一点上失败，除非他们确实失败了。\n\n您可以使用许多简单和高级的检查来了解需要执行的任务或在配置系统时出现的问题：跨平台通知关于可用的升级、检查\
  \ DNS 序列号是否已正确更新，以及无数其他系统管理陷阱。\n\n## 效率\n\n虽然通常被认为属于可用性或性能的子集，但效率的一些方面并不完全适合其中。效率可以被视为提高可用性和性能的第一步，这增加了了解系统效率重要性。\n\
  \n效率参数将比其他参数更特定于服务，但一些通用示例可能包括 Squid 命中率和 MySQL 查询缓存效率。其他应用程序，包括内部定制的应用程序，可能提供其他效率测量方法。\n\
  \n## 项目类型\n\n如前所述，Zabbix 在项目中收集所有数据。但显然，我们希望以不仅仅是通过 Zabbix 代理的方式获取信息。我们的选择是什么？让我们看一下：\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_87_0.png)\n\n这是编辑项目时项目类型配置下拉菜单。我们在创建项目时基本上跳过了此选择，因为默认值适合我们。让我们快速看看现在可用的类型：\n\
  \n- **Zabbix agent**：这是默认类型。服务器连接到代理并收集数据。\n- **Zabbix agent (active)**：这可以被认为是前面类型的相反。Zabbix\
  \ 代理收集数据并在需要时连接到服务器。\n- **Simple check**：顾名思义，此类型将服务器执行的简单检查分组。这包括检查开放的 TCP 端口、ICMP\
  \ ping 等。我们将在 *Chapter 3, Monitoring with Zabbix Agents and Basic Protocols* 中讨论这两种\
  \ Zabbix 代理类型和简单检查。\n- **SNMP agents**：这三种类型处理收集 SNMP 数据。版本显然表示在连接到被监控主机时使用的协议版本。\n\
  - **SNMP trap**：虽然仍然依赖 Net-SNMP 的 `snmptrapd` 从网络获取 traps，但 Zabbix 提供了轻松接收 SNMP\
  \ traps 的功能。此项目类型允许您执行此操作，包括按主机自动排序。我们将在 *Chapter 4, Monitoring SNMP Devices* 中介绍\
  \ SNMP 轮询和 trapping。\n- **Zabbix internal**：这组项目收集有关 Zabbix 内部状态的信息。我们将在 *Chapter\
  \ 3, Monitoring with Zabbix Agents and Basic Protocols* 中讨论内部监控。\n- **Zabbix trapper**：此项目类型接受传入数据而不是查询数据。它对于您可能想要通过其他工具、自定义脚本或任何其他方法获得并馈入\
  \ Zabbix 的任何数据都很有用。\n- **Zabbix aggregate**：这些项目在主机组中聚合值。这对于集群或服务器场特别有用，在那里整体状态比单个机器的状态更重要。\n\
  - **External check**：外部检查允许 Zabbix 服务器执行外部命令并将返回的值存储在项目中。这允许它传递任何无法使用其他项目类型访问的信息。我们将在\
  \ *Chapter 11, Advanced Item Monitoring* 中使用 Zabbix trapper 项目、聚合项目和外部检查。\n- **Database\
  \ monitor**：此类型包括用于查询各种数据库参数的内置本机检查。\n- **IPMI agent**：**Intelligent Platform Management\
  \ Interface (IPMI)** 是管理和监控系统（我们主要关注这一点）的规范，特别是针对带外解决方案。IPMI 项目类型允许直接访问此数据。我们将在\
  \ *Chapter 16, Monitoring IPMI Devices* 中介绍 IPMI 监控。\n- **SSH agent**：可以直接使用 SSH\
  \ 查询主机并检索 shell 命令输出。此检查支持基于密码和基于密钥的身份验证。\n- **TELNET agent**：对于某些无法使用 SSH 的系统，可以使用直接\
  \ Telnet 检查。虽然不安全，但它可能是访问某些设备（包括老一代交换机或 UPS）的唯一方法。我们将在 *Chapter 11, Advanced Item\
  \ Monitoring* 中讨论 SSH 和 Telnet 项目。\n- **JMX agent:** Zabbix 提供了一个名为 Zabbix Java\
  \ gateway 的组件。它允许您直接监控 JMX 兼容应用程序。JMX 监控将在 *Chapter 17, Monitoring Java Applications.*\
  \ 中讨论。\n- **Calculated:** 这些是高级项目，允许您从其他预先存在的 Zabbix 项目创建新值，而无需重复数据检索。我们将在 *Chapter\
  \ 11, Advanced Item Monitoring* 中使用这些项目。\n\n虽然所有这些类型在此时可能看起来有点令人困惑，但要记住的重要一点是，它们可供您使用，但您不必使用它们。您可以拥有一个仅包含单个\
  \ ICMP ping 项目的主机，但如果您想监控更多内容，高级功能将始终存在。\n\n正如您可能已经注意到的，项目类型是按单个项目设置的，而不是按主机设置。这在设置监控主机时提供了很大的灵活性。例如，您可以使用\
  \ ICMP 检查总体可用性，使用 Zabbix 代理检查某些服务的状态并对其他服务使用简单的 TCP 检查，使用 trapper 接收自定义数据，并使用 IPMI\
  \ 通过管理适配器监控参数——所有这些都在同一主机上。项目类型的选择将取决于网络连接、被监控主机的功能集以及实现的难易程度。Zabbix 将允许您为每个项目选择最佳匹配。\n\
  \n## 如何监控项目\n\n虽然这涵盖了类别和项目类型，但我们在创建项目时跳过了一些其他参数，因此了解大多数项目类型必须设置的基本值可能会有所帮助。让我们快速查看项目创建/编辑窗口中的字段：\n\
  \n- **Name:** 用户级项目名称。这是您在向用户显示数据的大多数地方看到的内容。\n- **Type:** 这是主要属性，影响其他字段和项目数据收集方式，如前所述。\n\
  - **Key:** 这是明确指定此项目需要收集什么数据的属性。它有点像是项目的技术名称。每个主机的键值必须是唯一的。对于某些其他项目类型，实际标识收集数据的字段可能是\
  \ Simple Network Management Protocol Object Identifiers (SNMP OID) 或 IPMI 传感器，而键仅用于引用项目。\n\
  \n\n\n\n\n## 获取你的第一个通知\n\n- **信息类型：** 允许你选择将随监控项收集的数据类型。你必须根据提供的值进行设置：整数、小数等。\n\
  - **数据类型：** 此属性提供了一种以十六进制或八进制格式查询数据并自动转换为十进制值的方法。一些支持 SNMP 的设备（主要是打印机）以这些格式发送信息。还有布尔数据类型，可将多个输入转换为\
  \ 1 或 0。\n- **单位：** 此属性允许你选择除数据之外要显示的单位，对于某些单位，Zabbix 将根据需要计算相应的转换（在许多工具中称为“人类可读”，因此你得到\
  \ 32.5 GB 而不是相同值的字节数）。\n- **使用自定义倍数：** 此属性将传入数据乘以此处指定的值并存储结果。如果数据以一种单位到达，但你想以另一种单位存储，这很有用（例如，如果传入数据以字节为单位，但你想以位为单位，则使用倍数\
  \ 8）。\n- **更新间隔：** 设置数据检索尝试之间的间隔。\n- **自定义间隔：** 此设置允许你在特定时间修改更新间隔或使用类似 cron 的监控项调度——或者因为你在夜间不需要特定监控项，或者因为你了解某些特定服务将停机，例如在备份窗口期间。\n\
  - **历史存储周期：** 设置实际检索值存储在数据库中的时间段。\n- **趋势存储周期：** 这与**历史存储周期**选项相同，但针对趋势。趋势是根据历史数据计算出来的数据，每小时平均一次，以减少长期存储需求。\n\
  - **存储值：** 此属性仅适用于数值数据，允许 Zabbix 服务器在将数据插入数据库之前对数据执行一些基本计算，例如计算计数器监控项两次检查之间的差值。\n\
  - **显示值：** 在此下拉菜单中，可以选择一个值映射。它允许你为数字代码显示人类可读的值，例如 SNMP 接口状态返回的值。有关值映射的更多信息，请参阅*第\
  \ 3 章，使用 Zabbix Agent 和基本协议进行监控*。\n- **应用：** 此属性使得可以对监控项进行逻辑分组，例如在**监控 | 最新数据**屏幕上。\n\
  \n- **填充主机清单字段：** 允许你将收集的监控项值放入清单字段（在*第 5 章，管理主机、用户和权限*中探讨）。\n- **描述：** 此字段可用于 Zabbix\
  \ 3.0 中的多个实体，允许你描述监控项。你可以说明数据收集、处理的方式或其含义。\n- **启用：** 允许你启用或禁用监控项。\n\n如果这些简短的描述没有回答你对每个选项的所有问题，请不要担心。我们稍后将更深入地探讨每个选项，而且其他监控项类型还有更多可用选项。\n\
  \n## 使用全局搜索\n\n到目前为止，我们已经通过转到前端中的特定页面，然后查找组和主机，来导航到主机或其监控项及其他实体。在较小的安装中，这是一种足够方便的方法，也是我们在本书中主要使用的方法。在较大的安装中，像这样导航可能非常耗时；因此，称为**全局搜索**的功能变得非常有用。实际上，许多用户几乎完全跳过了经典的导航方法，而只使用搜索。\n\
  \n全局搜索字段位于 Zabbix 前端的右上角。在其中输入一个字母 a。此处输入的任何内容都将与主机名的开头匹配，结果显示在下拉列表中。在我们的案例中，**A\
  \ test host** 匹配：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_91_0.png)\n\n你可以使用键盘或鼠标选择下拉列表中的某个条目，或使用原始字符串进行搜索。让我们通过用鼠标单击或使用键盘突出显示然后按\
  \ *Enter* 来选择下拉列表中的唯一条目。在搜索结果中，我们可以看到三个块，对应于可以在 Zabbix 中搜索的三种实体类型：\n\n- 主机\n- 模板\n\
  - 主机组\n\n## 获取你的第一个通知\n\n这是条目的样子：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_92_0.png)\n\
  \n对于所有实体，都可以按名称进行搜索。此外，对于主机，还可以按 IP 地址和 DNS 进行搜索。\n\n在搜索结果中，单击主机名将打开主机的属性。每个主机还有一些附加链接，但列标题可能会令人困惑：TRIGGERS、GRAPHS\
  \ 和 WEB 是重复的。虽然这不是很直观，但区别在于链接旁边的数字使用：如果有数字，这是指向配置部分的链接。如果没有数字，则是指向监控部分的链接，或者可能没有配置该类型的实体。在这种情况下，你必须记住最右边同名的列用于配置。配置链接的数字（如果存在）是实体数量。\n\
  \n## 总结\n\n这是我们在本章中终于进行了一些实际操作的一章：监控一个监控项，创建一个触发器，并在此触发器上获得通知。我们还稍微探索了 Zabbix 前端，并查看了基本监控项参数。让我们回顾一下获得第一个警报需要哪些基本步骤：\n\
  \n- 我们从创建主机开始。在 Zabbix 中，所有要监控的内容都附加到一个称为主机的逻辑实体上。\n- 接下来，我们创建了一个监控项。作为信息收集的基础，监控项定义了有关受监控指标的参数，包括要收集哪些数据、收集频率、如何存储检索到的值以及其他内容。\n\
  - 在监控项之后，我们创建了一个触发器。每个触发器包含一个用于定义阈值的表达式。对于每个触发器，还可以配置严重性。为了让 Zabbix 知道如何联系我们，我们配置了电子邮件设置。这包括为媒介类型指定电子邮件服务器，以及向用户配置文件添加媒介。\n\
  - 作为最后的配置步骤，我们创建了一个操作。操作是定义要执行的实际操作的配置实体，并且可以具有条件，为如何处理各种事件创建灵活的规则。\n- 嗯，我们实际上还做了一件事来确保一切正常——我们创建了一个问题。测试你的配置很有用，尤其是在刚开始使用\
  \ Zabbix 时。我们的配置是正确的，所以我们及时收到了有关该问题的通知。\n\n虽然这些知识已经足以配置一个非常基本的监控系统，但在它被认为是一个功能完备的系统之前，我们还需要探索其他领域。在下一章中，我们将弄清楚被动监控项和主动监控项之间的区别，以及在设置它们时需要注意哪些重要事项。我们还将介绍基本的\
  \ ICMP 监控项和其他监控项属性，例如位置参数、值映射、单位和自定义间隔。\n\n仅从源代码编译 agent 的方式与第 1 章“Zabbix 入门”中包含所有组件进行编译的方式类似。这次我们将使用一个简单的标志，而不是完整的\
  \ configure 命令行：\n\n```\n$ ./configure --enable-agent\n```\n\n配置应该成功完成，以下摘要行很重要：\n\
  \n```\nEnable server:      no\nEnable proxy:       no\nEnable agent:       yes\n\
  ```\n\n如果你看到的输出与前面的输出匹配，请继续执行以下命令：\n\n```\n$ make install\n```\n\n编译应该没有任何错误地完成，并且应该相对较快。\n\
  \n如果你在不同于服务器的发行版上安装发行版软件包，则不必担心 agent 守护程序的版本比服务器旧。这是受支持的，并且应该工作得很好。事实上，1.0 版本的\
  \ Zabbix agent 守护程序与 3.0 版本的服务器的配合很好。反过来可能不起作用，并且不受支持。你应该避免将较旧的服务器与新的 agent 一起使用。\n\
  \n> 使用较旧的 agent 可能更方便，因为你已经安装了一个并且运行良好。在设置新的 agent 时，建议使用最新的，因为它可能修复了错误、提高了性能、支持特定平台的更多监控项以及其他好处。\n\
  \nagent 安装完成后，现在是启动它的时候了。具体如何操作取决于安装方法——如果你从软件包安装，还取决于发行版。有关如何启动 agent 的示例，请参阅第\
  \ 1 章“Zabbix 入门”。快速提醒一下，如果你在基于 RHEL/SUSE 的系统上从软件包安装，则 agent 守护程序可能可以这样启动：\n\n```\n\
  # service zabbix-agentd start\n```\n\n如果你从源代码安装，直接执行二进制文件：\n\n```\n# <path>/zabbix_agentd\n\
  ```\n\n\n\n\n启动 agent 后，我们还需要将这个新主机添加到配置中，请转到“配置 | 主机”。确保右上角的“组”下拉框显示“Linux 服务器”。点击“创建主机”按钮并填写此表单：\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_97_0.png)\n\n以下是填写表单的一些提示：\n\n- **主机名称**：可以随意选择一个描述性名称，或直接输入“Another\
  \ host”\n- **Agent 接口**：根据你要使用的连接方式，填写 IP 地址或 DNS 名称\n- **连接到**：如果你决定使用 DNS 名称，请切换到\
  \ DNS\n\n完成后，点击底部的“添加”按钮。\n\n## 被动监控项\n\n我们之前创建的监控项是一种所谓的被动监控项，这意味着每次需要收集数值时，Zabbix\
  \ 服务器都会主动连接到 agent。在大多数地方，它们被简称为 Zabbix agent 类型。\n\n记住 Zabbix 中被动或主动的一个简单方法是从 agent\
  \ 的视角来思考。如果 agent 连接到服务器，就是主动的；如果不是，就是被动的：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_98_0.png)\n\
  \n让我们再创建一个被动监控项来检查远程主机。请转到“配置 | 主机”，单击刚创建主机旁边的“监控项”，点击“创建监控项”按钮，并填写以下值：\n\n- **名称**：输入“Web\
  \ server status”\n- **键值**：输入 `net.tcp.service[http,,80]`（即 80 前面有连续两个逗号）\n- **更新间隔（秒）**：从默认值（30）改为\
  \ 60——每分钟一次完全满足我们的需求\n- **历史存储期限（天）**：从默认值（90）改为 7——这仍然可以保留一整周的精确到每分钟的服务状态记录\n\n\
  最终结果应如下所示：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_98_1.png)\n\n但是服务名称中添加的 `,80`\
  \ 是怎么回事？请单击 **键值** 字段旁边的 **选择** 按钮。这会打开一个窗口，里面有一个很好用的键列表供你选择，并且附带每个键的简短描述：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_99_0.png)\n\
  \n右上角的 **类型** 下拉框会让你在几种监控项类型之间切换——我们稍后会讨论其他类型。现在，请在列表中找到 `net.tcp.service` 并查看其描述。这里有两件事需要了解：首先，我们实际上不必添加\
  \ `80`——它是一个端口，既然默认值已经是 `80`，添加它是多余的。但是，如果你有服务运行在非标准端口上，它就很有用。其次，键列表只需点击一下即可打开，如果你忘记了某个特定的键或它的参数应该是什么样子，可以快速得到提示。\n\
  \n这个键 `net.tcp.service` 有点特殊：它会尝试验证对应服务是否确实以标准方式响应，这意味着该服务必须被显式支持。在撰写本文时，Zabbix\
  \ 对 `net.tcp.service` 键支持以下服务：\n\n- FTP\n- HTTP\n- HTTPS\n- IMAP\n- LDAP\n- NNTP\n\
  - POP\n- SMTP\n- SSH\n- TCP\n- Telnet\n\nTCP 服务本身也有点特殊。其他服务会执行特定于服务的检查，而 TCP 并不是真正的服务；它只检查\
  \ TCP 连接。它更接近你在监控项列表中上面几行可以看到的 `net.tcp.port` 键。正如描述所说，这个键只是尝试打开到任意端口的 TCP 连接，而不对返回的值执行任何特定于服务的检查。如果你尝试使用一个不支持的任意服务字符串，你只会收到一条错误消息，提示不支持这样的监控项键。\n\
  \n> 还有一个 `net.udp.service` 键，目前仅支持一种服务——网络时间协议（NTP）。\n\n请随意查看其他可用的键——我们稍后也会用到其中几个——然后关闭此弹出窗口，并点击底部的“添加”按钮。\n\
  \n你可能已经注意到，当某个操作成功完成时，屏幕顶部会出现一个绿色条带。这次，还有一个名为“详细信息”的控件；点击它可以展开详细信息：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_100_0.png)\n\
  \n你可以再次点击“详细信息”来收起内容。当然，只要在某个操作完成后出现“详细信息”链接，就可以这样做。\n\n现在，我们可以转到“监控 | 最新数据”并等待值出现在那里，但那样毫无意义。相反，几分钟后，你应该访问“配置\
  \ | 主机”。根据你的网络配置，你可能会看到此主机旁边出现一个红色的 ZBX 标记。此图标表示尝试从被动 Zabbix agent 收集数据时发生的错误。\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_100_1.png)\n\n要查看实际的错误消息，请将鼠标光标移到图标上，会打开一个工具提示。点击错误图标将使工具提示保持显示，并允许你复制错误消息。\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_100_2.png)\n\n> 另外三个条目分别代表 SNMP、JMX 和\
  \ IPMI 数据收集状态。我们将在*第 4 章，监控 SNMP 设备*中监控 SNMP 设备，在*第 16 章，监控 IPMI 设备*中监控 IPMI 设备，并在*第\
  \ 17 章，监控 Java 应用程序*中监控 JMX 应用程序。\n\n如果你看到类似于 **Get value from agent failed: cannot\
  \ connect to [[192.168.56.11:10050]: [111] Connection refused** 的错误消息（很可能 IP 地址不同），这意味着\
  \ Zabbix 服务器无法连接到 agent 守护进程的端口。这可能是由多种原因造成的，最常见的是防火墙——要么是 Zabbix 服务器与远程主机之间的网络防火墙，要么是远程主机上的本地防火墙。请确保允许从\
  \ Zabbix 服务器到被监控机器的 10050 端口连接。\n\n如果你正确执行了上述操作（或者你没有防火墙阻止连接），你可以再次前往**监控 | 最新数据**——但这同样毫无意义。要了解原因，请刷新主机列表。很快，你应该会看到\
  \ Zabbix agent 状态图标再次变红，将鼠标光标移到它上面会显示另一条错误消息：**Received empty response from Zabbix\
  \ Agent at [192.168.56.11]**，这表明 agent 因访问权限而断开了连接。这就不同了。它说的是什么访问权限？为什么它们对我们的第一台主机有效？\n\
  \n在 Zabbix 服务器上，执行以下命令：\n\n```bash\n$ telnet 192.168.56.11 10050\n```\n\n> 你应该始终从\
  \ Zabbix 服务器验证网络连接和访问权限。从另一台机器执行验证可能会得到截然不同且无用的结果。\n\n将 IP 地址替换为你的远程主机的 IP 地址。你应该会看到以下输出，并且连接应立即关闭：\n\
  \n```\nTrying 192.168.56.11...\nConnected to 192.168.56.11.\nEscape character is\
  \ '^]'.\nConnection closed by foreign host.\n```\n\n现在，用 localhost 尝试同样的操作：\n\n\
  ```\n$ telnet localhost 10050\n\nTrying 127.0.0.1...\nConnected to localhost.\n\
  Escape character is '^]'.\n```\n\n注意，这次连接没有立即关闭，因此配置中有所不同。连接很可能会稍后关闭——更准确地说，是 3\
  \ 秒后。如果由于某种原因没有关闭，请按说明按 `Ctrl+]`，然后输入 `quit`——这应该会关闭连接：\n\n```text\n^]\n\ntelnet>\
  \ quit\nConnection closed.\n```\n\n事实证明，在另一台机器上配置 Zabbix agent 守护进程会比以前要稍难一些。\n\n\
  与在 Zabbix 服务器上的安装不同，我们必须编辑远程机器上的 agent 守护进程配置文件。用你喜欢的编辑器以 root 身份打开 `zabbix_agentd.conf`，并查看\
  \ **Server** 参数。它当前设置为 `127.0.0.1`，这就是我们在 Zabbix 服务器上无需修改它的原因。如注释所述，此参数应包含 Zabbix\
  \ 服务器的 IP 地址，因此请在此处将 `127.0.0.1` 替换为正确的服务器地址。\n\n> 如果你的环境中运行着较旧的 Zabbix agent 实例，请务必使用和编辑名称中带\
  \ d 的 `zabbix_agentd.conf`。另一个文件 `zabbix_agent.conf` 曾用于功能受限的 `zabbix_agent` 模块，该模块已在\
  \ Zabbix 3.0 中移除。\n\n保存文件并重启 agent 守护进程。具体做法同样取决于安装方法。如果你是从发行版软件包安装的，以下命令很可能有效：\n\
  \n```shell\n# service zabbix-agentd restart\n```\n\n如果你是从源代码安装的，并且没有创建或调整一些初始化脚本，则必须手动停止并启动\
  \ agent 进程：\n\n```shell\n# killall -15 zabbix_agentd; sleep 3; zabbix_agentd\n```\n\
  \n上述命令将停止系统上所有名为 `zabbix_agentd` 的进程。如果系统上运行着多个 agent，则不应使用此命令。此外，3 秒的延迟在大多数情况下应该绰绰有余，但如果在执行后\
  \ agent 仍未启动，请检查其日志文件以查找潜在原因。\n\n\n\n\n> 切勿对 Zabbix 守护进程使用 kill -9。千万不要。即使你认为可以，也不要这样做。信号\
  \ 15 是 SIGTERM——它告诉守护进程终止运行，这意味着将所有未写入的数据写入数据库，写出并关闭日志文件，并可能执行其他操作来正常关闭。信号 9 是 SIGKILL——进程被粗暴地杀死，不允许它与心爱的数据库和文件告别。除非你真的知道自己在做什么，否则你不会想那样做——说真的，别这么做。\n\
  \n要验证这一更改，请再次尝试 telnet 到远程机器：\n\n```\n$ telnet 192.168.56.11 10050\n```\n\n这一次，结果应该与我们在\
  \ localhost 上看到的一样：连接应建立，然后大约 3 秒后关闭。\n\n> 尽管所有主机都必须指定某个主机接口，即使对于那些仅使用主动监控项的主机也是如此，但该接口仅用于被动\
  \ Zabbix agent 检查。如果未配置此类监控项，则此接口将被直接忽略。\n\n最后，值得打开 **监测 | 最新数据**。不过，我们只会看到之前创建的监控项；原因在于我们之前修改过的同一个过滤器。我们明确地过滤了一个主机；因此，我们创建的第二个主机根本不会显示。在过滤器（应该仍然处于展开状态）中，清空主机字段，在\
  \ **主机组** 字段中选择 **Linux servers**，然后点击 **筛选**：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_103_0.png)\n\
  \n> 在 Zabbix 的许多过滤器字段中，我们可以开始输入并获取匹配条目列表，也可以点击 **选择** 按钮查看所有可用实体的列表。当我们至少知道名称的一部分时，输入是一种非常方便的方式。而在我们不太熟悉的环境中工作时，能够看到列表会很有帮助。\n\
  \n现在我们应该看到两台受监控的主机，每台都有一个监控项：\n\n| 主机 | 名称 | 最后检查 | 最后值 | 变更 |\n|---|---|---|---|---|\n\
  | Another host | - 其他 - (1 个监控项) |  |  |  |\n|  | Web 服务器状态 | 2016-02-20 00:58:56\
  \ | 1 | 图形 |\n| A test host | - 其他 - (1 个监控项) |  |  |  |\n|  | CPU 负载 | 2016-02-20\
  \ 00:58:55 | 0 | 图形 |\n\n请注意，我们可以点击每个条目旁边或表头中的三角形图标来折叠和展开单个条目或所有条目。\n\n## 克隆监控项\n\
  \n现在让我们尝试监控另一个服务，例如运行在 22 端口上的 SSH 服务。为了简单起见，这次我们不会从头创建一个监控项；而是回到 配置 | 主机，点击 Another\
  \ host 旁边的 监控项，然后点击 名称 列中的 Web server status。这将打开监控项编辑界面，显示我们之前输入的所有值。这一次，底部有可用的不同按钮。在其他更改中，除了\
  \ 添加 按钮之外，还有一个 更新 按钮。\n\n![](img/f5313a804532fabacc8d07cc8607eeba_104_0.png)\n\n\
  > 请注意，之前看到的按钮中有一个不同了。之前标记为 添加 的按钮现在变成了 更新。这一变化标识了我们即将执行的操作：要么添加新实体，要么更新现有实体。有人可能打开配置表单打算克隆实体，浏览字段，更改一些值，但忘记点击\
  \ 克隆 按钮。最终，现有监控项将被更改。添加 和 更新 按钮标签的差异可能有助于在犯这类错误之前发现它们。\n\n还有一个 删除 按钮，显然会删除当前打开的监控项。我们现在不想这样做。而是点击\
  \ 克隆：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_104_1.png)\n\n请注意，打开的表单提议创建一个新监控项，但这一次，所有值都设置为我们克隆的原始监控项所具有的值。更新\
  \ 按钮也变成了 添加。点击 添加 按钮——它应该会失败。记住，我们说过键对于每个主机是唯一的；错误消息也说明了这一点：\n\n> 详细信息\n> 无法添加监控项\n\
  > 键为 \"net.tcp.service[http,80]\" 的监控项已存在于 \"Another host\" 上。\n\n监控项编辑表单仍然打开着，因此我们可以纠正错误。进行以下修改：\n\
  \n- **名称：** 将其更改为 `SSH 服务器状态`\n- **键：** 将 `http,80` 更改为 `ssh`，使其看起来像这样——`net.tcp.service[ssh]`\n\
  \n我们现在只需要做这些，所以再次点击底部的 添加 按钮。这一次，监控项应该会成功添加。现在，导航到 监测 | 最新数据，Another host 应该会列出两个监控项：SSH\
  \ 服务器状态 和 Web 服务器状态。它们的状态将取决于远程主机上运行了哪些服务。由于是远程主机，SSH 很可能正在运行（因此值为 1），但 Web 服务器是否正在运行将取决于你的具体情况。\n\
  \n| 主机 | 名称 ▲ | 最后检查 | 最后值 |\n|---|---|---|---|\n| Another host | - 其他 - (2 个监控项)\
  \ |  |  |\n|  | SSH 服务器状态 | 2016-02-20 01:17:57 | 1 |\n|  | Web 服务器状态 | 2016-02-20\
  \ 01:17:56 | 1 |\n\n> 监控端口通常是为了确保其上的服务可用，但这并不是硬性要求。如果某个系统不应该通过互联网提供 SSH，我们可以使用这种检查来验证它是否因为意外启动\
  \ SSH 守护进程或防火墙发生不幸更改而被意外暴露。\n\n![](img/f5313a804532fabacc8d07cc8607eeba_105_0.png)\n\
  \n## 手动查询监控项\n\n在前端添加监控项并等待其更新是一种查看监控项键是否正确的方法。不过，这并不是很快的方法——你必须等待服务器检查该监控项。如果你不确定参数，或者想测试不同的组合，最简单的方法是使用名为\
  \ `zabbix_get` 的工具。从源码安装时，它会与 Zabbix agent 一起安装。从软件包安装时，它可能会与 Zabbix agent 一起安装，也可能在单独的软件包中。使用它非常简单，如果我们想查询\
  \ Zabbix 服务器上的 agent，我们将运行以下命令：\n\n```\n$ zabbix_get -s 127.0.0.1 -k system.cpu.load\n\
  ```\n\n这将与服务器执行方式完全相同地获取值。如果你想从 Another host 获取这样的值，可以在 Zabbix 服务器上运行 `zabbix_get`。在\
  \ agent 运行的同一台主机上尝试运行它会失败，因为我们更改了 Server 参数，只接受来自 Zabbix 服务器的连接。如果你想从 localhost\
  \ 查询 agent 以进行调试，可以通过逗号将 `127.0.0.1` 添加到 Server 参数中——在部署 agent 时，有时会在所有系统上这样做。\n\
  \n这涵盖了常规（即被动）Zabbix 监控项的基础知识，即服务器查询 agent。让我们继续讨论其他监控项类型。\n\n## 主动监控项\n\n如果你可以从\
  \ Zabbix 服务器连接到所有受监控主机，被动 Zabbix 监控项是不错的，但如果你出于安全或网络拓扑原因不允许对受监控主机发起传入连接，那该怎么办？\n\
  \n这就是主动监控项的用武之地。与被动监控项相反，对于主动监控项，是 agent 连接到服务器；服务器从不连接到 agent。连接时，agent 会下载要检查的监控项列表，然后定期向服务器报告新数据。让我们创建一个主动监控项，但这一次，我们将尝试在选择监控项键时获得一些帮助。\n\
  \n转到 **配置 | 主机**，点击 **Another host** 旁边的 **监控项**，然后点击 **创建监控项**。目前，请使用以下值：\n\n-\
  \ **名称：** `接口 $1 上的传入流量`\n- **类型：** `Zabbix agent (主动模式)`\n- **更新间隔（秒）：** `60`\n\
  - **历史数据保留期限（天）：** `7`\n\n- 名称：接口 $1 上的传入流量\n- 类型：Zabbix agent (主动模式)\n- 键：选择\n\
  - 信息类型：数字（无符号）\n- 数据类型：十进制\n- 单位：\n- 使用自定义倍数：1\n- 更新间隔（秒）：60\n- 历史数据保留期限（天）：7\n\n\
  这次我们对键字段做点不同的操作。点击 选择 按钮，在即将出现的我们之前见过的对话框中，点击 net.if.in[if,<mode>]。这将填入所选字符串，如下所示：\n\
  \nnet.if.in[if,<mode>] 网络接口上的传入流量统计。返回整数\n\n> 将方括号中的内容替换为 eth0，使字段内容变为 net.if.in[eth0]。完成后，点击底部的\
  \ 添加 按钮。绝不要留下诸如 <mode> 之类的占位符——它们会被解释为字面值，监控项将无法按预期工作。\n\n如果你的系统有不同的网络接口名称，请在此处使用该名称而不是\
  \ eth0。你可以使用 ifconfig 或 ip addr show 命令查找接口名称。在许多现代发行版中，标准的 ethX 命名方案已更改为会导致各种不同接口名称的方案。此外，请将所有出现的\
  \ eth0 替换为正确的接口名称。\n\n转到 监测 | 最新数据，检查是否有新值到达：\n\n| 主机 | 名称 ▲ | 最后检查 | 最后值 |\n|---|---|---|---|\n\
  | Another host | - 其他 - (3 个监控项) |  |  |\n|  | 接口 eth0 上的传入流量 |  |  |\n\n\n\n代理正在尝试请求活动检查列表，但连接失败。尝试似乎是错误的——我们的\
  \ Zabbix 服务器应该在与 localhost 不同的系统上。让我们看看如何修复这个问题。在远程机器上，打开 zabbix_agentd.conf 配置文件并检查\
  \ ServerActive 参数。默认配置文件中会有类似这样的行：\n\n```\nServerActive=127.0.0.1\n```\n\n该参数告诉代理应连接到何处以获取活动项。在我们的情况下，localhost\
  \ 不会起作用，因为 Zabbix 服务器位于远程机器上，因此我们应该修改它。将 127.0.0.1 替换为 Zabbix 服务器的 IP 地址或 DNS 名称，然后使用\
  \ init 脚本或手动方法 killall 重启代理。\n\n在你打开配置文件时，看看其中的另一个参数——StartAgents。该参数控制有多少进程处理被动项的传入连接。如果设置为\
  \ 0，它将阻止代理监听来自服务器的传入连接。这使你能够自定义代理以支持其中一种或两种方法。从安全角度来看，禁用被动项可能更好，但它们对于测试和调试各种问题非常方便。可以通过不指定（注释掉）ServerActive\
  \ 来禁用活动项。禁用活动和被动项都不会起作用；代理守护进程会抱怨并拒绝启动，而且这是正确的——同时禁用两者启动将是毫无意义的事情。看一下：\n\n```\n\
  zabbix-agentd [16208]: ERROR: either active or passive checks must be enabled\n\
  ```\n\n我们本可以等待值再次出现在前端，但同样，它们也不会出现。让我们返回代理守护进程日志文件，看看是否有关于出了什么问题的提示：\n\n```\n15938:20141230:154544.559\
  \ no active checks on server [10.1.1.100:10051]: host [Zabbix server] not monitored\n\
  ```\n\n如果我们仔细阅读该条目，就会注意到代理报告其主机名为 Zabbix server，但那是默认主机的主机名，我们决定不使用它并将其禁用。日志消息也同意这一点：它说该主机未被监控。\n\
  \n如果我们查看启动消息，甚至还有另一行提到这一点：\n\n```\n15931:20141230:154544.552 Starting Zabbix Agent\
  \ [Zabbix server]. Zabbix 3.0.0 (revision 58567).\n```\n\n> 你可能看得到也可能看不到此消息中的 SVN\
  \ 修订号，这取决于代理是如何编译的。如果缺少它，请不要担心，因为它不影响代理的操作能力。\n\n由于那不是我们想要使用的主机名，让我们再次检查代理守护进程配置文件。其中有一个名为\
  \ Hostname 的参数，目前读取为 Zabbix server。鉴于该参数的注释说“活动检查必需，且必须与服务器上配置的主机名匹配。”，它必须是我们要找的。将它更改为\
  \ Another host，保存并关闭配置文件，然后重启 Zabbix 代理守护进程。检查 zabbix_agentd.log 文件中的新条目——不应该再有错误了。\n\
  \n顺便说一下，让我们也更新 A test host 上的代理配置。修改 zabbix_agentd.conf 并将 Hostname 设置为 A test host，然后重启代理守护进程。\n\
  \n如果服务器上仍然出现主机未找到的错误，请 double-check Zabbix 前端主机属性中的主机名和代理守护进程配置文件（我们刚刚更改的那个）是否匹配。\n\
  \n> 此主机名区分大小写。\n\n现在是时候返回前端，看看数据是否已开始在 Monitoring | Latest data 部分流入：\n\n| HOST\
  \ | NAME ▲ | LAST CHECK | LAST VALUE | CHANGE |\n|---|---|---|---|---|\n| Another\
  \ host | - other - (3 Items) |  |  |  |\n|  | Incoming traffic on interface enp0s8\
  \ | 2016-02-20 01:45:20 | 173013 | +1296 |\n\n> 请注意，此屏幕截图中的系统实际上有一个名为 enp0s8 的接口，而不是\
  \ eth0。我们将在第 12 章《自动化配置》中了解如何允许 Zabbix 关心接口名称并自动发现它们。\n\n如果看不到数据并且该项在配置部分显示为 unsupported，请检查网络接口名称。\n\
  \n很好，数据确实在流动，但值看起来很奇怪。如果你等待一段时间，你会看到 LAST VALUE 列中的数字不断增加。那么这是什么呢？网络流量键从接口计数器收集数据，即网络接口累加所有流量，并且该总数据被输入到\
  \ Zabbix 数据库中。这有一个很大的优点：即使数据以大间隔轮询，流量峰值也不会被忽视，因为计数器数据存在，但这也使数据对我们来说几乎无法阅读，图表也会看起来像一条不断增长的线（如果你愿意，可以点击该项的\
  \ Graph 链接）。我们甚至可以称它们为“山丘图”。幸运的是，Zabbix 提供了内置功能来处理此类数据计数器。转到 Configuration | Hosts，然后点击\
  \ Another host 旁边的 Items，并点击 NAME 列中的 Incoming traffic on interface eth0。将 Store\
  \ value 下拉菜单更改为 Delta (speed per second)，然后点击 Update。\n\n我们必须等待一段时间才能使更改生效，所以现在是讨论我们为此项的\
  \ Type of information 选项选择的好时机。我们将其设置为 Numeric (unsigned)，它接受整数。该项最初接收的值确实是整数——它们是表示在此接口上接收了多少字节的计数器值。我们更改为\
  \ Delta (speed per second) 的 Store value 选项，几乎总是会产生小数部分——它根据两次值之间经过的秒数将流量除以两个值。在\
  \ Zabbix 具有小数数字并且必须将其存储在整数字段中的情况下，其行为将取决于它如何获得该小数值的不同，如下所示：\n\n+   - 如果小数值来自 Zabbix\
  \ 代理源，如 system.cpu.load 项，该项将变为 unsupported\n+   - 如果 Zabbix 接收到整数但进一步计算导致出现小数，如我们的网络项，则小数部分将被丢弃\n\
  \n此行为在以下图中描述：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_111_0.png)\n\n为什么会有这种差异，为什么我们在这样做会导致精度损失的情况下仍将该项保留为整数？Zabbix\
  \ 数据库模式中十进制值的有效数字在小数点前的数量比整数值少。在负载高的高速接口上，我们可能会溢出该限制，并且会导致值完全丢失。通常最好损失一点精度——小数部分——而不是整个值。请注意，精度损失在最小单位上：字节或位。即使\
  \ Zabbix 在前端显示 5 Gbps，该值中的小数部分也会从位中截断；因此，这种精度损失应该非常、非常微不足道。建议对存在此类风险的项使用整数，至少在数据库模式限制增加之前。\n\
  \n再次查看 **Monitoring | Latest data**：\n\n| HOST | NAME ▲ | LAST CHECK | LAST VALUE\
  \ | CHANGE |\n|---|---|---|---|---|\n| Another host | - other - (3 Items) |  | \
  \ |  |\n|  | Incoming traffic on interface enp0s8 | 2016-02-20 01:50:20 | 29 | -177700\
  \ |\n\n> 请记住，在最坏的情况下，配置更改可能需要长达 3 分钟才能传播到 Zabbix 代理：1 分钟进入服务器配置缓存，以及 2 分钟直到代理刷新其自己的项列表。除此延迟外，此项与我们创建的其他项不同：它需要收集两个值来计算每秒，其中一个是我们感兴趣的；因此，我们还必须等待该项间隔才能在前端看到第一个值。\n\
  \n这样更好；Zabbix 现在会自动计算每次检查之间的变化（这就是 delta 的作用）并将其存储，但值仍然似乎不太用户友好。也许在图表中会更好——让我们点击\
  \ **Graph** 链接来了解一下：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_112_0.png)\n\n\n\
  \n\n\n哎呀。虽然我们能清楚地看到更改带来的效果，但它也给我们留下了非常难看的历史数据。该图的 Y 轴代表总计数器值（因此显示自监控系统启动以来的总计），但\
  \ X 轴代表正确的（增量）数据。你也可以数值化地查看这些值——转到右上角的下拉菜单，目前显示为 Graph。从中选择 500 个最新值。你将得到以下屏幕：\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_113_0.png)\n\n在这个列表中，我们可以很好地看到数据表示的变化以及更改执行的确切时间。但那些巨大的值来自计数器数据，它们因规模过大而污染了我们干净整洁的图表——我们必须摆脱它们。转到\
  \ Configuration | Hosts 并点击 Another host 旁边的 Items，然后选中 Incoming traffic on interface\
  \ eth0 项目旁边的复选框，并查看项目列表底部位置的按钮：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_113_1.png)\n\
  \n从左数第三个按钮，名为 Clear history，很可能就是我们想要的。注意活动按钮左侧的 3 selected 文本——它显示了所选条目的数量，因此我们始终知道正在操作多少个元素。点击\
  \ Clear history 按钮。你应该会收到一个 JavaScript 弹出窗口，要求确认继续。虽然在大型数据集上清理历史记录可能需要很长时间，但在我们的情况下，应该几乎是即时的，因此点击\
  \ OK 按钮继续。这将删除该项目的全部历史值，包括巨大的那些。\n\n不过，查看该图的 Y 轴，我们看到传入值以没有任何解释的数字形式表示，并且较大的值会应用\
  \ K、M 等乘数标识符。如果 Zabbix 知道如何以字节或其他类似单位计算它，那就好多了。好的，所以导航到 **Configuration | Hosts**\
  \ 并点击 **Another host** 旁边的 **Items**，然后点击 **NAME** 列中的 **Incoming traffic on the\
  \ eth0 interface**。编辑 **Units** 字段并输入 Bps，然后点击 **Update**。\n\n让我们检查 **Monitoring\
  \ | Latest data** 是否有任何改进：\n\nIncoming traffic on interface enp0s8  2016-02-20 02:02:19\
  \  27 Bps\n\n太棒了；数据仍在到达。更好的是，注意 Zabbix 现在会在适当的地方自动计算 KB、MB 等。在我们的示例主机上，如果有更多流量，它也会这样做。让我们查看网络流量；点击\
  \ **Graph**：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_114_0.png)\n\n看看 Y 轴——如果有更多流量，单位也会在那里计算以使图表可读，并且单位计算会追溯应用于之前收集的值。\n\
  \n> 单位不会像 **Store value** 选项那样影响存储的数据，因此我们这次不需要清除之前的值。\n\n我们设置的一个参数，更新间隔，本可以更小，从而得到更美观的图表。但重要的是要记住，你的项目间隔越小，Zabbix\
  \ 就必须检索的数据越多，每秒钟必须向数据库插入更多数据，并且在显示这些数据时必须执行更多计算。虽然在我们的测试系统上不会有明显差异，但你应该尽量保持间隔尽可能大。\n\
  \n到目前为止，我们创建的项目收集的是数值数据——整数或十进制值。让我们再创建一个，这次有点不同。像往常一样，转到 **Configuration | Hosts**\
  \ 并点击 **Another host** 旁边的 **Items**。在继续创建项目之前，让我们看看配置部分，特别是针对项目，有哪些有用的东西可用。如果我们查看项目列表上方，可以看到导航和信息栏：\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_115_0.png)\n\n此区域提供了有关当前所选主机的快速有用信息：主机名、主机是否被监控以及其可用性。更重要的是，在右侧，它提供了返回主机列表以及与当前主机关联的其他元素的快速快捷方式：应用程序、项目、触发器、图表、发现规则和\
  \ Web 场景。这是一种在无需每次都通过主机列表的情况下在单个主机的元素类别之间切换的便捷方式。但这还不是全部——点击 **Filter** 按钮打开我们之前被迫面对的过滤器。复杂的过滤器再次出现：\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_115_1.png)\n\n使用此过滤器，我们可以对要显示哪些项目制定复杂规则。查看过滤器左上角，我们可以看到我们不仅限于查看单个主机的项目；我们还可以选择\
  \ **Host group**。在需要时，我们可以做出过滤选择并点击过滤器下方的 **Filter** 链接。目前，它只有一个条件：**Host** 字段包含\
  \ **Another host**，因此我们从主机列表中使用的 **Items** 链接就是设置此过滤器的那个。清除 **Host** 字段，从 **Host\
  \ group** 字段中选择 **Linux servers**，然后点击过滤器下方的 **Filter** 按钮。\n\n> > \U0001F4A1 仅当项目被过滤为单个主机时，才会出现主机信息和快速链接栏。\n\
  \n现在，查看主项目过滤器正下方——那是 Subfilter，其标题已说明，它仅影响主过滤器已过滤的数据。\n\n![](img/f5313a804532fabacc8d07cc8607eeba_116_0.png)\n\
  \n子过滤器中的条目像切换开关一样工作——如果我们打开其中一个，它就会作为对数据进行过滤的条件，再加上所有其他已切换的子过滤器控件。现在让我们点击 Zabbix\
  \ agent (active)。注意项目列表现在只包含一个项目——这就是该 Subfilter 切换开关旁边的数字 1 所代表的含义。但子过滤器本身现在也看起来不同了：\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_116_1.png)\n\n我们启用的选项 Zabbix agent 已被突出显示。Numeric\
  \ (float) 另一方面是灰色且被禁用，因为在已激活的切换开关之外再激活此切换开关将导致完全没有项目显示。虽然 Numeric (unsigned) 切换开关旁边仍然列有\
  \ 1，这表明启用它将显示这么多项目，但 Zabbix agent 切换开关旁边反而有 +3。 这种形式表示激活此切换开关将显示比当前显示多三个项目，并且用于同一类别的切换开关。目前，子过滤器有五个条目，因为它只显示现有值。一旦我们配置了更多不同类型的项目，此子过滤器将扩展。我们已经完成了对这些过滤器的探索，因此从\
  \ Host 字段中选择 Another host，点击过滤器下的 Filter 按钮，然后点击 Create item。\n\n当你有许多不同的主机由 Zabbix\
  \ 监控时，很容易忘记每个主机上的 Zabbix agent 守护进程的版本，即使你有自动化的软件部署，也很方便能够在一个地方看到每个主机的版本。\n\n使用以下值：\n\
  \n- **Name**: 输入 **Zabbix agent version**\n- **Type**: 选择 **Zabbix agent (active)**（我们仍在创建活动项目）\n\
  - **Key**: 点击 **Select** 然后从列表中选择第三个条目——`agent.version`\n- **Type of information**:\
  \ 选择 **Character**\n- **Update interval (in sec)**: 输入 `86400`\n\n完成后！点击 **Add**\
  \ 按钮。我们做了两件值得注意的事情。首先，我们将信息类型设置为 **Character**，这重新加载了表单，略微改变了可用选项。最明显的是，与数值信息相关的字段被隐藏了，例如单位、乘数和趋势。\n\
  \n其次，我们输入了一个非常大的更新间隔，`86400`，相当于 24 小时。虽然这可能看起来过分，但请记住我们在这里监控的是什么——Zabbix agent\
  \ 版本，所以它可能（希望）不会每天更改几次。根据你的需求，你甚至可以将其设置为更大的值，例如一周。\n\n要查看我们工作的结果，请转到 **Monitoring\
  \ | Latest data:**\n\n```\nZabbix agent version          2016-02-24 20:59:45  3.0.0\n\
  ```\n\n如果看不到数据，请稍等片刻；最终它会显示出来。当它显示时，你应该会看到列出的远程机器上安装的 Zabbix agent 版本，并且它可能比此处显示的数字更高，因为已经发布了更新版本的\
  \ Zabbix。请注意一个细微差别：我们之前添加的所有项目在右侧都有名为 **Graph** 的链接，而最后一个项目则有一个名为 **History** 的链接。原因很简单：对于文本项目，无法绘制图表，因此\
  \ Zabbix 甚至不会尝试这样做。\n\n\n\n\n\n现在，关于等待——为什么我们必须等待数据出现？好吧，记住活动项的工作方式？代理会查询服务器以获取其应报告的项目列表，然后定期发送数据，但对项目列表的检查也是定期进行的。要了解频率，请在远程机器上打开\
  \ zabbix_agentd.conf 配置文件并查找 RefreshActiveChecks 参数。默认值为 2 分钟，以秒为单位配置，因此列出 120 秒。因此，在最坏的情况下，你可能需要等待近\
  \ 3 分钟才能看到任何数据，而对于普通或被动项，服务器会在配置更改在其缓存中可用后立即查询代理。在生产环境中，如果有许多代理使用活动项，增加此值可能是一个好主意。通常，项目参数不会经常更改。\n\
  \n## 具有多个服务器的活动代理\n\n我们按代理守护进程配置文件中配置的 ServerActive 的方式，它连接到单个 Zabbix 服务器并向服务器发送项目数据。代理也可以同时与多个服务器一起工作；我们只需在此处指定额外的地址作为逗号分隔列表即可。在这种情况下，代理将在内部生成单独的进程来分别与每个服务器工作。这意味着一个服务器不会知道另一个服务器正在监控什么——值将独立发送给它们。另一方面，即使有多个服务器请求单个项目的数据，这些数据也会被收集多次，每台服务器一次。\n\
  \n> 始终检查配置文件中的注释；它们可能非常有用。在 ServerActive 的情况下，注释显示代理也可以通过使用如下语法连接到每个服务器上的非默认端口：server1:port,\
  \ server2:port。\n\n在活动模式下使用多个服务器在从一个 Zabbix 实例迁移到另一个实例时可能很有用。一段时间里，代理可以同时向旧服务器和新服务器报告。另一个有用的情况是客户环境，其中客户可能有一个本地\
  \ Zabbix 服务器执行全面监控，而外部公司可能希望监控与他们提供的应用程序相关的某些方面。\n\n对于被动项，允许来自多个 Zabbix 服务器的传入连接也是以相同的方式完成的：通过将多个\
  \ IP 地址添加到 Server 参数。\n\n## 支持的项目\n\n我们创建了一些在两个方向上使用 Zabbix 代理并收集数据的项目。但这些远不是唯一可用的项目。你可以在再次创建项目时查看列表（转到\
  \ Configuration | Hosts，点击任意主机的 Items，然后点击 Create item 按钮，接着点击 Key 字段旁边的 Select\
  \ 按钮），以便查看为 Zabbix 代理内置的项目，以及其中大多数的简短描述。\n\n> 并非所有 Zabbix 代理项目都可用作被动和活动项目。例如，日志和事件日志项目（分别用于收集日志文件和\
  \ Windows 事件日志信息）仅作为活动项目可用。日志监控在第 11 章《高级项目监控》中介绍，Windows 特定项目在第 14 章《监控 Windows》中介绍。\n\
  \n查看列表，我们可以了解到 Zabbix 代理原生支持哪些项目类别：系统配置、网络流量、网络服务、系统负载和内存使用、文件系统监控等。但这并不意味着你在那里看到的一切都将在\
  \ Zabbix 代理守护进程运行的任何系统上工作。由于每个平台都有不同的信息公开方式，并且某些参数甚至可能是平台特定的，因此不能保证每个键在每个主机上都有效。\n\
  \n例如，当磁盘驱动器统计报告更改到用户空间时，Zabbix 代理必须专门为新方法实现支持；因此，较旧的代理版本在最近的 Linux 系统上支持的参数更少。如果你好奇某个特定参数是否在特定操作系统的特定版本上有效，最好的方法是查看\
  \ Zabbix 手册然后进行测试。一些最常见的代理项目键如下：\n\n- agent.ping: 当代理可用时返回 1，代理不可用时则什么也不返回\n- net.if.in/out:\
  \ 提供传入/传出流量信息\n- net.tcp.service: 尝试对 TCP 服务进行简化的连接\n- proc.num: 统计进程数量，并可按各种参数过滤\n\
  - vfs.fs.size: 提供文件系统使用信息\n- vm.memory.size: 提供内存使用信息\n- `system.cpu.load`: 以标准十进制表示提供\
  \ CPU 负载信息\n- `system.cpu.util`: 提供 CPU 利用率信息，例如 `iowait`\n\n对于其中大多数，可以指定各种参数来过滤结果或选择特定信息。例如，`proc.num[,zabbix]`\
  \ 将统计 Zabbix 用户运行的所有进程。\n\n## 在活动和被动项目之间选择\n\n尽管我们讨论了 Zabbix 代理是主动还是被动，但代理实际上既不是其中之一也不是另一个；连接的方向由项目级别决定。代理可以（并且默认情况下确实）同时在两种模式下工作。尽管如此，我们仍需要选择使用哪种项目类型——活动或被动。简短版本：推荐使用活动项目。\n\
  \n要理解原因，让我们比较一下连接是如何建立的。对于被动代理来说非常简单：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_120_0.png)\n\
  \n> 箭头方向表示连接是如何建立的。\n\n一个值意味着一个连接。活动代理稍微复杂一些。记住：在活动模式下，代理连接到服务器；因此，代理首先连接到 Zabbix\
  \ 服务器并请求要监控的项目列表。服务器随后以项目、其间隔以及任何其他相关信息进行响应：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_120_1.png)\n\
  \n此时，连接被关闭，代理开始收集信息。一旦收集到一些值，它就会将它们发送到服务器：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_121_0.png)\n\
  \n请注意，活动代理可以在一次连接中发送多个值。因此，活动代理通常会导致 Zabbix 服务器的负载更低，网络连接数量更少。\n\n主机列表中的可用性图标仅代表被动项目；活动项目根本不影响它。如果主机只有活动项目，此图标将保持灰色。在之前的\
  \ Zabbix 版本中，如果你添加了失败的被动项目然后全部转换为活动项目，此图标仍会保持红色。Zabbix 3.0.0 是图标自动重置回灰色的第一个版本。\n\
  \n当然，活动项目也有一些缺点，而被动项目也有好处。让我们尝试总结每种项目类型提供的功能以及它们可能更适合的情况。\n\n活动项目的优点如下：\n\n- 它们具有更少的网络连接数\n\
  - 它们对 Zabbix 服务器造成的负载更低\n- 如果网络拓扑或防火墙不允许从服务器连接到代理（例如，被监控的主机位于 NAT 后面），它们仍能工作\n-\
  \ 诸如日志或 Windows 事件日志监控之类的项目得到支持\n\n以下是被动项目的优点：\n\n- 它们对初学者来说更容易设置\n- 支持自定义间隔（活动项目不支持）\n\
  - 对集群上的虚拟 IP 地址进行轮询可以让你始终查询活动的集群节点\n- 默认模板使用被动项目；因此，使用它们无需修改或其他配置\n\n添加新的活动项目后，它会再次保存到数据库中，而\
  \ Zabbix 服务器还不知道它。活动 Zabbix 代理会定期连接到服务器以收集其应监控的项目信息，但由于它尚未在配置缓存中，服务器不会告诉代理该项目。该项目随后被加载到配置缓存中。配置缓存默认每\
  \ 60 秒刷新一次。服务器得知新项目后，项目对代理可用，但代理默认每 2 分钟连接到服务器一次。一旦代理得知新项目，它会立即尝试为其收集第一个值。\n\n>\
  \ 有关如何调整这些间隔的详细信息，请参阅第 22 章《Zabbix 维护》。\n\n在两种情况下，如果项目设置为 delta，我们必须获取两个值，然后才能计算最终值并将其存储在数据库中并在前端显示——我们无法仅从一个值计算差异。\n\
  \n## 简单检查\n\n之前创建的项目都需要安装、运行 Zabbix 代理守护进程，并且能够双向建立连接。但如果无法或不希望在远程主机上安装代理，并且只需要监控简单的事情怎么办？这时简单检查就可以帮上忙。这些检查不需要在远程端运行任何专用代理，只依赖于基本的网络协议，如互联网控制消息协议（ICMP）和\
  \ TCP 来查询被监控主机。\n\n> 主机可用性图标仅涵盖 Zabbix 代理、SNMP、JMX 和 IPMI 状态，即我们期望响应的事物。对于简单检查，我们的期望可能是双向的——打开的端口可能是好事也可能是坏事。简单检查没有状态图标。\n\
  \n\n\n\n\n让我们现在创建一个非常基础的检查。前往 **Configuration | Hosts**，点击 **Another host** 旁边的\
  \ **Items**，然后点击 **Create item**。使用以下值：\n\n- **Name:** 输入 `SMTP server status`\n\
  - **Type:** 选择 **Simple check**\n- **Key:** 点击 **Select** 按钮\n\n右上角的 **Type** 下拉菜单应该已经显示为\
  \ **Simple check**。如果不是，请将其更改为该选项。在 **Key** 列表中，点击 `net.tcp.service[service,<ip>,<port>]`\
  \ 键，然后对其进行编辑。将 `service` 替换为 `smtp`，并删除方括号内的其余所有内容，使其变为 `net.tcp.service[smtp]`，如下所示：\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_124_0.png)\n\n> 在 Zabbix 中配置简单检查时，请注意“偏执”的网络安全配置，如果你检查的服务太多、太频繁，可能会触发警报。\n\
  \n完成后，点击底部的 **Add** 按钮。要检查结果，请前往 **Monitoring | Latest data**——我们的新检查应该在那里，并且根据\
  \ SMTP 服务器是否正在运行且 Zabbix 服务器可以访问，应该列出 **1**（如果正在运行且可访问）或 **0**。\n\n## 设置 ICMP 检查\n\
  \n如果我们只关心主机的基本可达性，例如我们无法控制的路由器或交换机，ICMP ping（回显请求和回复）将是合适的监控方法，Zabbix 也支持此类简单检查。通常，这些检查不会立即生效；要使用它们，我们必须设置一个单独的实用程序\
  \ `fping`，Zabbix 用于 ICMP 检查。它应该适用于大多数发行版，因此只需使用发行版的包管理工具安装即可。如果没有，你将不得不手动下载并编译 `fping`；它可在\
  \ `http://fping.sourceforge.net/` 获取。\n\n> 在撰写本文时，Zabbix 3.0 仍未完全支持 fping 3。最值得注意的是，为服务器设置源\
  \ IP 将破坏 ICMP ping 项。此类支持目前计划在 3.0.2 版本中提供。对于任何更高版本，请在手册中检查兼容性信息。从发行版包安装 fping 很可能提供版本\
  \ 3，它也可在 http://fping.org/ 获取。\n\n一旦 fping 安装正确，Zabbix 服务器必须知道在哪里找到它并且能够执行它。在 Zabbix\
  \ 服务器上，打开 `zabbix_server.conf` 并查找 `FpingLocation` 参数。它默认被注释掉，并且默认值为 `/usr/sbin/fping`。你可以使用以下命令快速找到\
  \ fping 二进制文件的位置：\n\n```\n$ which fping\n```\n\n如果其中一个结果是 `/usr/sbin/fping`，你就不必更改此参数。如果不是，请修改参数以指向正确的\
  \ fping 位置并重启 Zabbix 服务器，以便它了解配置更改。这还不算完。Zabbix 还需要能够以管理员权限运行 fping，因此以 root 身份执行以下操作：\n\
  \n```\n# chgrp zabbix /usr/sbin/fping\n# chmod 4710 /usr/sbin/fping\n```\n\n> 权限在基于\
  \ Fedora/RHEL 的发行版中通常已经正确。如果您使用的是发行版包，请不要执行之前的命令；它们甚至可能会禁止 Zabbix 服务器访问，因为它可能在不同的组下运行。\n\
  \n由于 fping 二进制文件之前应由 root 拥有，这应该足以允许 Zabbix 组按要求使用它；让我们验证一下。\n\n像往常一样，导航到 **Configuration\
  \ | Hosts**，点击 **Another host** 旁边的 **Items**，然后点击 **Create item**。设置以下详细信息：\n\n\
  - **Name:** `ICMP ping performance`\n- **Type:** **Simple check**\n- **Key:** 点击\
  \ **Select** 按钮；在列表中，点击 `icmppingsec` 键，然后删除方括号内的所有内容——以及括号本身\n- **Type of information:**\
  \ `Numeric (float)`\n- **Units:** `ms`\n- **Use custom multiplier:** 选择复选框并输入 1000\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_126_0.png)\n\n当所有字段都已正确设置后，点击底部的 Add\
  \ 按钮。执行通常的往返操作到 Monitoring | Latest data — ICMP ping 应该已经开始记录数据。如果等待几分钟，你还可以查看一个相对有趣的图表以注意到网络性能的任何变化。\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_126_1.png)\n\n在这里，我们设置了以秒为单位测量网络延迟的 ICMP\
  \ ping。如果您只想简单地测试主机连通性，您将选择 `icmpping` 键，它只记录 ping 是否成功。这是在大规模上测试连通性的简单方法，因为它对网络的负载很小（除非你使用极小的间隔）。当然，有一些需要注意的事情，例如测试\
  \ Internet 连通性时应做不同的事情——仅测试到路由器、防火墙甚至提供商路由器的连接是不够的。最好的方法是在已知具有非常好的连接和可用性的情况下选择多个远程目标进行监控。\n\
  \n对于 ICMP ping 项，可以指定多个参数。例如，完整的 `icmpping` 键语法如下：\n\n```\nicmpping[<target>,<packets>,<interval>,<size>,<timeout>]\n\
  ```\n\n默认情况下，target 取自分配此项的主机，但可以覆盖。packets 参数使您能够指定每次调用应发送多少个数据包——通常，fping 默认值为\
  \ 3。interval 参数使您能够配置这些数据包之间的间隔——通常，fping 默认值是对同一目标每 1 秒一次，以毫秒为单位指定。至于 size，这里单个数据包的默认值可能因\
  \ fping 版本、架构以及可能的其他参数而异。最后，timeout 设置单个目标超时，常见默认值为 500 毫秒。\n\n这些默认值不是 Zabbix 默认值——如果未指定，则使用\
  \ fping 默认值。\n\n请注意，不应为 ICMP ping 项设置非常大的超时或数据包计数；这可能导致奇怪的结果。例如，将数据包计数设置为 60 并在项上使用\
  \ 60 秒间隔，很可能会导致该项错过每个第二个值。\n\n如果您针对同一主机设置了多个 ICMP ping 项，Zabbix 只会调用一次 fping 实用程序。如果多个主机具有\
  \ ICMP ping 项，Zabbix 将在所有需要在同一时间使用相同参数 ping 的主机上只调用一次 fping（例如数据包、大小和超时）。\n\n##\
  \ 将所有内容联系起来\n\n因此，我们发现普通或被动代理等待服务器连接，而主动代理连接到服务器，获取要检查的项目列表，然后定期重新连接到服务器以发送数据。这意味着使用一种或另一种类型的\
  \ Zabbix 代理项会影响性能。一般来说，主动代理减少了 Zabbix 服务器的负载，因为服务器不必保留要检查的内容和时间的列表。相反，代理接管了该任务并向服务器报告。但您应该分别评估每种情况：如果您每个主机只有很少的项目，并且您很少监控它们（更新间隔设置为较大值），将所有代理转换为主动代理并比以前更频繁地检索项目列表不会改善\
  \ Zabbix 服务器性能。\n\n重要的是要记住，您可以针对单个主机使用各种项目的混合。正如我们刚才看到的，单个主机可以分配有普通或被动 Zabbix 代理项、主动\
  \ Zabbix 代理项和简单检查。这使您可以为监控每个特征选择最佳匹配，以确保最佳的连接和性能，并对网络和被监控主机的影响最小。这还不是全部——我们将探索几种额外的项目类型，这些类型又可以与我们已知的项目混合用于单个配置的主机。\n\
  \n\n\n\n\n现在我们已经配置了更多监控项，有必要再看看另一个监控视图。虽然我们大部分时间都在 **监控 | 最新数据** 中，但这次我们导航到 **监控\
  \ | 概览**。右上角的 **类型** 下拉框当前列出的是 **触发器**，这对我们来说并不是一个令人兴奋的视图：我们只创建了一个触发器。但我们确实创建了几个监控项，所以将这个下拉框切换为\
  \ **数据**：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_129_0.png)\n\n这次，概览页面就有趣一些了：我们可以看到哪些主机有哪些监控项以及监控项的值。\n\
  \n## 使用批量更新\n\n现在看起来不错——我们可以用紧凑的形式看到所有监控数据。那些表示各种服务器状态的 `1` 结果是什么意思？`1` 是表示运行状态，还是像退出代码那样表示错误？它们肯定不够直观，所以让我们尝试改进一下。前往\
  \ **配置 | 主机**，点击 **另一台主机** 的 **监控项**。选中全部三个服务器状态监控项（SMTP、SSH 和 Web），然后查看监控项列表底部的按钮：\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_129_1.png)\n"
- "## 使用 Zabbix 代理和基础协议进行监控\n\n这次，我们想对所有选中的监控项做一个统一的更改，所以从右数第二个按钮看起来正是我们需要的——上面写着\
  \ **批量更新**。点击它：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_130_0.png)\n\n这是一个有趣的界面——它允许我们同时更改多个监控项的一些参数。在此过程中，只有被标记并指定的更改才会执行，因此我们可以为那些原本差异很大的监控项修改一些共同的值。它允许我们为选中的监控项统一设置诸如\
  \ **更新间隔** 或其他参数。\n\n## 值映射\n\n这次，我们只关心一个值——即决定值如何显示给我们的那个选项。勾选 **显示值条目** 旁边的复选框，以查看可用选项。\n\
  \n看起来这里已经有人定义了一些条目，但在做决定之前，让我们先弄清楚这到底意味着什么。点击同一行右侧的 **显示值映射** 链接：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_131_0.png)\n\
  \n我们目前已停止 SMTP 服务器，以验证 **1 => 启动** 和 **0 => 关闭** 这两个映射是否都有效——正如我们所见，它们是有效的。值映射对于像代码值一样工作的返回数据非常有用——例如服务状态、硬件状态（如电池），以及其他类似的监控数据。我们之前在值映射配置界面中看到了一些预定义的示例，你可以根据自己的需求随意修改或创建新的映射。\n\
  \n值映射可用于整数、小数值（浮点数）和字符串。字符串的一个用例可以是备份软件可能返回的不同备份级别的映射：\n\n- I => 增量备份\n- D => 差异备份\n\
  - F => 完整备份\n\n导航回 **监控 | 概览**，再次查看 **另一台主机** 的各种服务器状态条目：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_133_0.png)\n\
  \n当你只需要记住一个只有两种可能状态的监控特征时，值映射似乎不太有用；但当存在许多不同的可能状态和许多可能的映射时，它就变得非常有用，这样在大多数情况下，你都能快速了解每个数值的含义，并且你随时可以为自定义开发的解决方案创建自己的映射。\n\
  \n## 单位\n\n我们之前为一些监控项配置了单位，使用了诸如 B 或 ms 这样的值。虽然在监控部分很容易看到效果，但在不同单位的处理上存在一些细微差别。\n\
  \n单位是一个自由文本字段。你可以在这里输入任何内容，但某些单位在数据显示时会改变其行为：\n\n- **B/Bps**：默认情况下，当应用 **K、M、G、T**\
  \ 等单位前缀时，Zabbix 会使用 1,000 的倍数。如果单位设置为 **B** 或 **Bps**，所使用的倍数将变为 1,024\n- **s**：以秒为单位的传入值将被转换为人类可读的格式\n\
  - **uptime**：以秒为单位的传入值将被转换为人类可读的格式\n- **unixtime**：传入的 Unix 时间戳将被转换为人类可读的格式\n\n\
  有趣的是，对于我们的 ICMP ping 监控项，我们没有使用这些单位中的任何一个；我们使用了 ms。原因是，在某些极小往返时间的情况下，以秒为单位的值可能太小，无法在\
  \ Zabbix 数据库模式中正确存储。通过在监控项配置中应用 1,000 的倍数，我们将传入的秒值转换为毫秒，这样就不会超出数据库模式的限制。一个缺点是，如果\
  \ ping 花费很长时间，该值将不会以秒显示——我们将不得不从毫秒值中推算出来。\n\n> 单位不影响存储的值，只影响显示的内容。我们可以放心地来回更改它们，直到它们正确为止。\n\
  \n## 自定义间隔\n\n我们刚才简要讨论的另一个监控项属性是自定义间隔。大多数监控项类型的间隔都是可配置的，这决定了监控项值的采集频率。但如果我们想根据星期几或一天中的时间段来更改这个间隔呢？这正是自定义间隔让我们能够做到的。自定义间隔有两种模式：\n\
  \n- 灵活间隔\n- 自定义调度\n\n## 灵活间隔\n\n灵活间隔在指定时间内覆盖正常间隔。例如，一个监控项可以每 60 秒采集一次值，但该监控项在周末可能并不重要。在这种情况下，可以添加一个灵活间隔，间隔为\
  \ 3600，时间规格为 6-7, 00:00-24:00。在周六和周日，该监控项将每小时只检查一次：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_135_0.png)\n\
  \n> 单个监控项最多可添加七个灵活间隔。\n\n天数用数字 1-7 表示，并使用 HH:MM-HH:MM 的 24 小时制表示法。\n\n> 如果你想知道的话，这里每周从星期一开始。\n\
  \n也可以将正常间隔设置为 0，并配置灵活间隔。在这种情况下，监控项将只在灵活间隔中指定的时间进行检查。此功能可用于仅在特定工作日检查某个监控项，甚至模拟一个粗略的调度器。如果一个监控项的正常间隔为\
  \ 0，灵活间隔为 60 秒，时间规格为 1,09:00-09:01，那么该监控项将在周一早上 9 点被检查。\n\n> **重叠的灵活间隔**\n> \n>\
  \ 如果两个具有不同值的灵活间隔重叠，则在重叠期间使用最小的值。例如，如果向同一监控项添加了时间周期分别为 1-5,00-24:00 和 5-6,12:00-24:00\
  \ 的灵活间隔，那么在周五的 12:00 到 24:00 期间，将使用间隔值最小的那一个。\n\n多个自定义间隔也可以用分号分隔指定——wd1-5/2 和 wd1;\
  \ wd3; wd5 都会在周一、周三和周五开始时轮询一个监控项。\n\n## 复制监控项\n\n再看同一个概览界面，有了针对之前晦涩数字值提供的文本提示，数据似乎更容易理解了，但显示上仍有一些不尽如人意的地方。请注意\
  \ **另一台主机** 的 **CPU 负载** 监控项以及 **测试主机** 的所有其他值所显示的破折号。我们没有在两台主机上创建对应的监控项，而监控项数据显示在这里，这意味着应该为每台主机创建缺失的监控项以收集数据。但重新创建所有监控项会非常无聊。幸运的是，这个问题有一个简单直接的解决方案。\n\
  \n前往 **配置 | 主机**，点击 **测试主机** 旁边的 **监控项**。我们只为该主机配置了一个监控项，因此勾选该监控项旁边的复选框。让我们再次查看列表底部的可用按钮：\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_137_0.png)\n\n这次，我们不想更新选中的监控项，而是将它们复制到另一台主机，所以点击\
  \ **复制** 按钮。我们想将这些监控项复制到特定主机，因此在 **目标类型** 下拉框中选择 **主机**，在 **组** 下拉框中选择 **Linux 服务器**，这样我们应该会得到一个简短的主机列表。我们正在从\
  \ **测试主机** 复制到 **另一台主机**；勾选 **另一台主机** 条目旁边的复选框，然后点击 **复制** 按钮：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_137_1.png)\n\
  \n\n\n\n当操作完成后，将“主机过滤器”字段（如果过滤器已关闭，请将其展开）更改为“Another host”，然后点击过滤器下方的“Filter”按钮。注意“CPU\
  \ load”监控项已经出现在列表中。这次，请标记除“CPU load”以外的所有监控项，因为“A test host”只有这个监控项。你可以使用这里的标准范围选择功能——选中“ICMP\
  \ ping performance”监控项（我们要选择的范围中的第一项）旁边的复选框，按住键盘上的Shift键，然后点击“Zabbix agent version”监控项（我们要选择的范围中的最后一项）旁边的复选框。这将选中我们点击的两个复选框之间的所有监控项。\n\
  \n> 使用Shift键加点击可以同时选中或取消选中任意条目范围，包括Zabbix前端中的监控项、主机、触发器和其他条目。它向上和向下都有效。操作结果取决于首先标记的复选框——如果你选中它，整个范围将被选中，反之亦然。\n\
  \n选中这些监控项后，点击监控项列表下方的“Copy”按钮。在“目标类型”下拉框中选择“主机”，在“组”下拉框中选择“Linux服务器”，仅勾选“A test\
  \ host”旁边的复选框，然后点击“Copy”。之后，点击右上角的“Details”链接。注意所有复制的监控项都列在这里。让我们再看一下“监控 | 概览”：\n\
  \n| 监控项 | Another host | A test host |\n|---|---|---|\n| CPU load | 0 | 0.19 |\n\
  | ICMP ping performance | 0.76 ms | 0.07 ms |\n| Incoming traffic on interface enp0s8\
  \ | 53 Bps | 859 Bps |\n| Incoming traffic on interface lo | 41 Bps | 194 Bps |\n\
  | SMTP server status | 停止 (0) | 运行 (1) |\n| SSH server status | 运行 (1) | 运行 (1)\
  \ |\n| Web server status | 运行 (1) | 运行 (1) |\n| Zabbix agent version | 3.0.0 | 3.0.0\
  \ |\n\n太好了，这样好多了！我们可以查看两台主机的所有数据，数字状态也得到了很好的解释。基本上，我们只是将一个主机上不存在于另一个主机的监控项交叉复制了过来。\n\
  \n但还有更好的——将鼠标悬停在显示的值上。注意选中的行会高亮显示。让我们点击其中一个**CPU load**值：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_139_0.png)\n\
  \n如你所见，概览屏幕不仅以表格形式显示数据，还允许快速访问常用时间尺度图以及该监控项的**最新值**。请随意尝试。\n\n查看完数据后，点击一个“Zabbix\
  \ agent version”值：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_139_1.png)\n\n注意这次没有图形条目。请记住：图形仅适用于数值数据，因此**监控\
  \ | 最新数据**和这些概览屏幕弹出菜单只提供值历史记录。\n\n这里列出了默认端口，如有必要可以更改：\n\n- 普通或被动监控项：Zabbix服务器连接到Zabbix代理，代理再收集数据。\n\
  - 主动监控项：Zabbix代理连接到Zabbix服务器，获取要监控的项列表，收集数据，然后定期向服务器报告。\n- 简单检查：Zabbix服务器直接查询被监控主机暴露的网络接口；无需代理。\n\
  \n简单检查则不同：它们从不使用Zabbix代理，而是直接从Zabbix服务器执行。简单检查包括TCP端口检查。\n\n这涵盖了两种基本且最常用的检查类型：支持双向连接的Zabbix代理和直接从服务器执行的简单检查。\n\
  \n在下一章中，我们将研究SNMP监控。我们将从Net-SNMP工具和基本管理信息库（MIB）管理的快速介绍开始，并设置具有固定和动态OID的SNMP轮询。我们还将接收SNMP陷阱，并使用内置方法和一种非常自定义的方法将它们映射到主机和监控项。\n\
  \n## 4\n"
- "## 监控SNMP设备\n\n既然我们已经熟悉了使用Zabbix代理和一种无代理方法进行监控，现在让我们探索另一种不需要安装Zabbix代理的方法，尽管它无论如何也需要某种代理。简单网络管理协议（通常称为SNMP）是一种成熟且流行的网络监控解决方案。我们将学习如何配置和使用Zabbix中的SNMP，包括SNMP轮询和陷阱接收。\n\
  \nSNMP已有二十多年的历史，已经有足够的时间在各种网络设备中广泛普及。尽管其名称暗示了管理功能，但它主要用于监控。由于早期版本存在安全缺陷，通过SNMP修改配置的能力不如其只读对应功能那么普及。\n\
  \nSNMP作为主要监控解决方案在嵌入式设备中尤其受欢迎，因为在嵌入式设备上运行完整的操作系统并安装单独的监控代理有些大材小用。最流行的两类开箱即用支持SNMP的设备是打印机和各种网络设备，如交换机、路由器和防火墙。SNMP使得对这些原本相当封闭的设备进行轻松监控成为可能。其他提供SNMP代理的设备包括UPS、**网络附加存储（NAS）**设备和机架温度/湿度传感器。当然，SNMP绝不局限于处理能力有限的设备——在标准服务器上运行通用SNMP代理而不是专门的监控代理也完全没问题。使用SNMP代理而不是Zabbix代理的原因可能包括：已经安装并设置好的SNMP代理、无法访问受监控主机来安装Zabbix代理，或者希望系统相对不依赖监控软件。\n\
  \n鉴于SNMP的普及，Zabbix原生支持它也就不足为奇了。Zabbix中的SNMP支持基于另一个优质开源产品——Net-SNMP（http://net-snmp.sourceforge.net/）。\n\
  \n在本章中，我们将：\n\n- 了解基本的Net-SNMP工具\n- 学习如何添加**管理信息库（MIB）**文件，以便Zabbix识别它们\n- 配置SNMP轮询和陷阱接收\n\
  \n### 使用Net-SNMP\n\n如果你从发行版软件包中安装了Zabbix，SNMP支持应该已经包含在内。如果你从源代码编译Zabbix，它仍然应该有SNMP支持，因为我们在配置标志中包含了它。剩下要做的就是设置SNMP监控配置。在此之前，我们需要一台安装了SNMP代理的设备。在这里你可以有多种选择——你可以使用任何有权访问的网络设备，例如可管理交换机、网络打印机或带有SNMP接口的UPS。由于SNMP代理通常监听161端口，你需要能够通过**用户数据报协议（UDP）**在该端口上连接到这样的设备。虽然也支持TCP，但UDP使用得更为广泛。\n\
  \n如果你无法访问这样的设备，你也可以在计算机上启动一个SNMP守护进程。例如，你可以轻松地使用**Another host**作为SNMP查询的测试平台。许多发行版都自带了Net-SNMP包中的SNMP守护进程，通常只需启动`snmpd`服务即可。如果你选择的发行版不是这种情况，你就得找一个已经带有可用SNMP代理的网络设备，或者手动配置`snmpd`。\n\
  \n为了测试，在`/etc/snmp/snmpd.conf`中有下面这样一行可能就足够了：\n\n```\nrocommunity public\n```\n\n\
  这允许任何使用`public`团体字符串的人拥有完全读取权限。\n\n> 请勿在生产环境中使用此类配置。\n\n无论你选择哪种方式，你都必须了解设备实际提供哪些数据以及如何获取这些数据。这就是Net-SNMP发挥作用的地方，它提供了许多有用的工具来处理支持SNMP的设备。我们将使用其中的几个工具来发现配置Zabbix中SNMP监控项所需的信息。\n\
  \n\n\n\n让我们先验证我们的 SNMP 设备是否可达并响应我们的查询。\n\n虽然 SNMPv3 自 2004 年以来一直是 SNMP 的当前版本，但它仍然不如\
  \ SNMPv1 和 SNMPv2 普及。仍在使用大量仅支持旧协议版本的旧设备，而且许多厂商在 SNMPv3 实现方面并不着急。\n\n事情进一步复杂化的是，SNMPv2\
  \ 也并不广泛使用。相反，使用的是其变种，即基于社区的 SNMPv2，或 SNMPv2c。虽然设备可以同时支持 v1 和 v2c，但有些设备仅支持其中一种。两者都使用所谓的\
  \ **社区认证**，其中用户认证是基于单个社区字符串进行的。因此，要查询设备，你必须知道它支持哪个协议版本以及要使用的社区字符串。听起来并不难。默认情况下，许多设备对访问使用一个通用字符串，**public**，Net-SNMP\
  \ 守护进程也是如此。除非你明确更改此字符串，否则你可以假设这是查询任何主机的所需内容。\n\n![](img/f5313a804532fabacc8d07cc8607eeba_145_0.png)\n\
  \n> 在某些发行版中，Net-SNMP 守护进程和工具可以拆分到单独的软件包中。在这种情况下，也请安装工具软件包。\n\n如果你在 **另一台主机** 上安装并启动了\
  \ Net-SNMP 守护进程，你可以执行一个简单的查询来验证 SNMP 连接性：\n\n```\n$ snmpstatus -v 2c -c public <IP\
  \ address>\n```\n\n如果守护进程已正确启动并且网络连接正常，你应该会得到一些输出，具体取决于你的系统：\n\n```\n[UDP: [<IP\
  \ address>]:161->[0.0.0.0]:51887]=>[Linux another 3.11.10-29-default #1 SMP Thu\
  \ Mar 5 16:24:00 UTC 2015 (338c513) x86_64]\nUp: 10:10:46.20\n\nInterfaces: 3, Recv/Trans\
  \ packets: 300/281 | IP: 286/245\n```\n\n我们可以看到它工作了，并且默认情况下通信是通过 UDP 到端口 161 进行的。我们可以看到目标系统的操作系统、主机名、内核版本、何时编译以及编译的目标硬件架构，以及当前的运行时间。还有一些网络统计信息附加在后面。\n\
  \n如果你尝试查询网络设备，它可能对允许使用 SNMP 代理的主机有限制。有些设备允许自由访问 SNMP 数据，而有些设备默认会限制访问，并且每个连接的主机都必须明确允许。如果设备没有响应，请检查其配置——你可能必须将查询机器的\
  \ IP 地址添加到 SNMP 权限列表中。\n\n## Monitoring SNMP Devices\n\n查看 `snmpstatus` 命令本身，我们向它传递了两个参数：SNMP\
  \ 版本（本例中为 2c）和社区（正如前面讨论的那样，是 `public`）。\n\n如果你有其他启用 SNMP 的主机，你可以在它们上尝试相同的命令。让我们看看各种设备：\n\
  \n```\n```text\n$ snmpstatus -v 2c -c public <IP address>\n[UDP: [<IP address>:161]\
  \ => [IBM Infoprint 1532 version NS.NP.N118 kernel 2.6.6 All-N-1] Up: 5 days, 0:29:53.22\n\
  Interfaces: 0, Recv/Trans packets: 63/63 | IP: 1080193/103316\n```\n```\n\n正如我们所见，这一定是一台\
  \ IBM 打印机。嘿，看起来它正在使用 Linux 内核。\n\n虽然许多系统会响应版本 2c 的查询，但有时你可能会看到以下情况：\n\n```\n```text\n\
  $ snmpstatus -v 2c -c public <IP address>\nTimeout: No Response from <IP address>\n\
  ```\n```\n\n这当然可能意味着网络问题，但有时 SNMP 代理会忽略使用它们不支持的协议版本或错误的社区字符串发来的请求。如果社区字符串不正确，你就必须查明它被设置为什么；这通常很容易在设备或\
  \ SNMP 守护进程配置中找到（例如，Net-SNMP 通常将其设置在 `/etc/snmp/snmp.conf` 配置文件中）。如果你认为设备可能不支持特定协议版本，你可以尝试另一个命令：\n\
  \n```\n```text\n$ snmpstatus -v 1 -c public <IP address>\n[UDP: [<IP address>:161]\
  \ => [HP ETHERNET MULTI-ENVIRONMENT, SN: CNBW71B06G,FN:J2K27AB, SVCID:000000, PID:\
  \ HP LaserJet P2015 Series] Up: 3:33:44.22\nInterfaces: 2, Recv/Trans packets: 135108/70066\
  \ | IP: 78239/70054\n```\n```\n\n因此，这台 HP LaserJet 打印机不支持 SNMPv2c，仅支持 v1。尽管如此，使用\
  \ SNMPv1 查询时，它还是透露了诸如序列号和系列名称等信息。\n\n让我们再看看另一台仅支持 SNMPv1 的设备：\n\n```\n```text\n\
  $ snmpstatus -v 1 -c public <IP address>\n[UDP: [<IP address>:161] => [APC Web/SNMP\
  \ Management Card (MB:v3.6.8 PF:v2.6.4 PN:apc_hw02_aos_264.bin AF1:v2.6.1 AN1:apc_hw02_sumx_261.bin\
  \ MN:AP9617 HR:A10 SN:ZA0542025896 MD:10/17/2005 (Embedded PowerNet SNMP Agent SW\
  \ v2.2 compatible)] Up: 157 days, 20:42:55.19\nInterfaces: 1, Recv/Trans packets:\
  \ 2770626/2972781 | IP: 2300062/2388450\n```\n```\n\n这似乎是一台 APC UPS，并且它在此输出中提供了大量信息，包括序列号甚至固件版本。它的运行时间也比之前的系统长得多：超过\
  \ 157 天。\n\n但显然，通过 SNMP 可以获得更多信息，而且这看起来有点混乱。让我们尝试 Net-SNMP 工具集中的另一个命令 snmpwalk。此命令尝试返回特定\
  \ SNMP 代理可用的所有值，因此输出可能非常大——我们最好先将其限制为几行：\n\n```\n$ snmpwalk -v 2c -c public 10.1.1.100\
  \ | head -n 6\nSNMPv2-MIB::sysDescr.0 = STRING: Linux zab 2.6.16.60-0.21-default\
  \ #1 Tue May 6 12:41:02 UTC 2008 i686\nSNMPv2-MIB::sysObjectID.0 = OID: NET-SNMP-MIB::netSnmpAgentOIDs.10\n\
  DISMAN-EVENT-MIB::sysUpTimeInstance = Timeticks: (8411956) 23:21:59.56\nSNMPv2-MIB::sysContact.0\
  \ = STRING: Sysadmin (root@localhost)\nSNMPv2-MIB::sysName.0 = STRING: zab\nSNMPv2-MIB::sysLocation.0\
  \ = STRING: Server Room\n```\n\n此语法未指定 OID，snmpwalk 默认使用 SNMPv2-SMI::mib-2。某些设备在树的其他部分会有有用的信息。要查询整个树，请指定单个点作为\
  \ OID 值，如下所示：\nsnmpwalk -v 2c -c public 10.1.1.100\n\n正如我们所见，此命令输出各种值，左侧显示名称或标识符，右侧显示其值。事实上，标识符称为对象标识符或\
  \ OID，它是一个唯一的字符串，用于标识单个值。\n\n将左侧所有内容称为 OID 是一种简化。它实际上由 MIB、OID 和 UID 组成，如下所示：\n\n\
  ![](img/f5313a804532fabacc8d07cc8607eeba_147_0.png)\n\n尽管如此，它通常被称为 OID，我们将在本书中也使用相同的简写。例外情况是我们实际上会引用\
  \ MIB 或 UID 部分时。\n\n查看输出，我们还可以识别出在 snmpstatus 输出中看到的一些数据——SNMPv2-MIB::sysDescr.0\
  \ 和 DISMAN-EVENT-MIB::sysUpTimeInstance。另两个值 SNMPv2-MIB::sysContact.0 和 SNMPv2-MIB::sysLocation.0\
  \ 未从默认值更改，因此目前不是很有用。顺便说一下，让我们将此输出与 APC UPS 的输出进行比较：\n\n```\n$ snmpwalk -v 1 -c <IP\
  \ address> | head -n 6\nSNMPv2-MIB::sysDescr.0 = STRING: APC Web/SNMP Management\
  \ Card (MB:v3.6.8 PF:v2.6.4 PN:apc_hw02_aos_264.bin AF1:v2.6.1 AN1:apc_hw02_sumx_261.bin\
  \ MN:AP9617 HR:A10 SN: ZA0542025896 MD:10/17/2005) (Embedded PowerNet SNMP Agent\
  \ SW v2.2 compatible)\nSNMPv2-MIB::sysObjectID.0 = OID: PowerNet-MIB::smartUPS450\n\
  DISMAN-EVENT-MIB::sysUpTimeInstance = Timeticks: (1364829916) 157 days, 23:11:39.16\n\
  SNMPv2-MIB::sysContact.0 = STRING: Unknown\nSNMPv2-MIB::sysName.0 = STRING: Unknown\n\
  SNMPv2-MIB::sysLocation.0 = STRING: Unknown\n```\n\n输出相当相似，包含相同的 OIDs，并且系统联系人和位置值也未设置。但要监控某些内容，我们必须为每项检索单个值，我们可以用另一个命令\
  \ snmpget 来验证它是否有效：\n\n```\n$ snmpget -v 2c -c public 10.1.1.100 DISMAN-EVENT-MIB::sysUpTimeInstance\n\
  DISMAN-EVENT-MIB::sysUpTimeInstance = Timeticks: (8913849) 1 day, 0:45:38.49\n```\n\
  \n我们可以在主机之后添加任何有效的 OID，例如前一个示例中的 DISMAN-EVENT-MIB::sysUpTimeInstance，以获取其保存的值。OID\
  \ 本身目前由两个部分组成，用两个冒号分隔。正如前面讨论的那样，第一部分是管理信息库或 MIB 的名称。MIB 是项目描述的集合，将数字形式映射为文本形式。第二部分是\
  \ OID 本身。此处没有 UID。我们可以通过添加 -Of 标志来修改输出，从而查看完整标识符：\n\n```\n$ snmpget -v 2c -c public\
  \ -Of 10.1.1.100 DISMAN-EVENT-MIB::sysUpTimeInstance\n.iso.org.dod.internet.mgmt.mib-2.system.sysUpTime.sysUpTimeInstance\
  \ = Timeticks: (8972788) 1 day, 0:55:27.88\n```\n\n\n\n\n> 要将数值形式转换为文本形式，需要 MIB。在某些情况下，标准\
  \ MIB 就够了，但许多设备在厂商特定的扩展中包含有用的信息。一些厂商为其设备提供了高质量的 MIB，另一些则帮助不大。请联系厂商获取所需的任何 MIB。我们将在本章稍后讨论基本的\
  \ MIB 管理。\n\n那是一个相当长的名称，展示了树状结构。它从一个无名的根对象开始，一直向下延伸，所有值都附着在这棵树的某个位置。嗯，我们提到了数值形式，我们也可以用\
  \ -On 标志让 snmpget 输出数值形式的名称：\n\n```bash\n$ snmpget -v 2c -c public -On 10.1.1.100\
  \ DISMAN-EVENT-MIB::sysUpTimeInstance\n.1.3.6.1.2.1.1.3.0 = Timeticks: (9048942)\
  \ 1 day, 1:08:09.42\n```\n\n因此，每个 OID 可以用三种表示法之一来引用：短名称、长名称或数字名称。在本例中，DISMAN-EVENT-MIB::sysUpTimeInstance、.iso.org.dod.internet.mgmt.mib-2.system.sysUpTime.sysUpTimeInstance\
  \ 和 .1.3.6.1.2.1.1.3.0 都指向同一个值。\n\n> 有关其他受支持的输出格式选项，请参阅 snmpcmd 手册页。\n\n但这如何适用于\
  \ Zabbix SNMP 监控项呢？在 Zabbix 中创建 SNMP 监控项时，你必须输入一个 OID。你怎么知道该用哪个 OID？通常，你会有以下几种选择：\n\
  \n- 直接知道\n- 询问别人\n- 自己找出来\n\n通常情况下，前两个选项行不通，所以自己找出来将是唯一的方法。正如我们已经了解的，Net-SNMP 工具非常擅长支持这种发现过程。\n\
  \n## 将 SNMPv3 与 Net-SNMP 结合使用\n\nSNMP 的最新版本，第 3 版，目前还不太常见，而且比以前的版本更复杂一些。设备实现的质量也参差不齐，因此针对已知解决方案（Net-SNMP\
  \ 守护进程）测试你的 Zabbix 配置可能会很有用。让我们向其中添加一个 SNMPv3 用户并获取一个值。确保 Net-SNMP 已安装，并且 snmpd\
  \ 能成功启动。\n\n要配置 SNMPv3，首先停止 snmpd，然后以 root 身份运行以下命令：\n\n```\n# net-snmp-create-v3-user\
  \ -ro zabbix\n```\n\n此工具会提示输入密码。请输入至少八个字符的密码——虽然此处会接受较短的密码，但稍后会因默认长度要求而失败。再次启动 snmpd，并使用第\
  \ 3 版测试值检索：\n\n```\n$ snmpget -u zabbix -A zabbixzabbix -v 3 -l authNoPriv localhost\
  \ SNMPv2-MIB::sysDescr.0\n```\n\n这应该会成功返回数据，如下所示：\n\n```\nSNMPv2-MIB::sysDescr.0\
  \ = STRING: Linux another 3.11.10-29-default #1 SMP Thu Mar 5 16:24:00 UTC 2015\
  \ (338c513) x86_64\n```\n\n我们不需要分别配置版本 1 或 2c，所以现在我们有了一个通用的 SNMP 代理，提供所有常见版本用于测试或探索。\n\
  \n## 引擎 ID\n\n尝试使用 SNMPv3 时，有一个非常常见的错误配置。根据 RFC 3414 (https://tools.ietf.org/html/rfc3414)，每个设备都必须有一个唯一标识符。每个\
  \ SNMP 引擎维护一个值 snmpEngineID，用于唯一标识该 SNMP 引擎。\n\n有时，用户会为多个设备设置相同的 ID。结果，Zabbix 无法成功监控这些设备。更糟糕的是，每个设备对\
  \ snmpget 或 snmpwalk 等命令都响应正常。这些命令一次只与一个设备通信，因此它们不太关心 snmpEngineID。\n\n在 Zabbix\
  \ 中，这可能表现为一个设备正常工作，但当另一个设备加入监控时，它便停止工作。\n\n如果 Zabbix 监控 SNMPv3 设备时出现神秘问题，而这些问题在使用命令行工具时不会出现，那么务必仔细检查\
  \ snmpEngineID。\n\n> 获取 SNMP MIB 并不总是那么容易。某大型打印机厂商代表声称，他们不提供 SNMP MIB，所有人都应使用其专有的打印机管理应用程序。但大多数厂商确实提供\
  \ MIB，而且在某些情况下，可自由访问的 MIB 收集网站可能比官方厂商网站更有帮助。\n\n下载新的 MIB 后，你必须将其放在 Net-SNMP 搜索 MIB\
  \ 文件的位置，并同时进行配置。Net-SNMP 在两个位置搜索 MIB：用户主目录中的 .snmp/mibs 和 /usr/share/snmp/mibs；使用哪个由你决定。如果只需要当前用户使用，或者没有\
  \ /usr 目录的访问权限，可以使用 .snmp/mibs；否则，使用 /usr/share/snmp/mibs。无论选择哪个，这还不够——你还必须指示工具包含此\
  \ MIB。\n\n> 虽然 Zabbix 服务器使用同一目录查找 MIB，但指定要使用的 MIB 仅对 Net-SNMP 工具是必需的——Zabbix 服务器会加载找到的所有\
  \ MIB。\n\n第一种方法是直接将 MIB 名称传递给被调用的命令。但是，我们还不知道 MIB 名称。要找出某个文件中的特定名称，请用文本编辑器打开该文件，并在文件开头附近查找\
  \ MIB DEFINITIONS ::= BEGIN。该文本之前的字符串就是我们要找的 MIB 名称。示例如下：\n\n```\nPowerNet-MIB DEFINITIONS\
  \ ::= BEGIN\n```\n\n因此，APC 选择将其 MIB 命名为 PowerNet-MIB。有了这个信息，我们可以指示任何命令包含此文件：\n\n\
  ```\n$ snmpget -m +PowerNet-MIB -v 1 -c public <IP address> SNMPv2-SMI::enterprises.318.1.1.1.1.2.3.0\n\
  PowerNet-MIB::upsAdvIdentSerialNumber.0 = STRING: \"QS0547120198\"\n```\n\n很好；snmpget\
  \ 包含了正确的 MIB 并获得了完整的文本字符串，这证实了我们的猜测：这可能是一个序列号。现在，你可以对 snmpwalk 使用同样的标志，并获得一个具有更好值名称的文件。很多时候，你可以在这样的文件中搜索诸如序列号等感兴趣的字符串，并找到正确的\
  \ OID。\n\n> 加号表示在已配置的 MIB 之外，还包含指定的 MIB。如果省略加号，MIB 列表将被替换为你指定的列表。\n\n请随意查看 /usr/share/snmp/mibs\
  \ 目录中的 MIB 文件。如你所见，这里的大多数文件名与其 MIB 名称相同，只是没有扩展名，不过这并非必需。实际上，文件名与 MIB 名称毫无关系；因此，有时你可能需要借助\
  \ grep 等工具来找出哪个文件包含哪个 MIB。\n\n虽然在命令行中传递单个 MIB 名称很适合快速的一次性查询，但当你要更频繁地执行这些操作且 MIB\
  \ 列表增长时，这会变得非常繁琐。还有另一种方法，更持久一些——MIB 的环境变量。在这种情况下，可以这样设置变量：\n\n```\n$ export MIBS=+PowerNet-MIB\n\
  ```\n\n在当前 shell 中，单个命令不再需要传递 MIB 名称。变量中指定的所有 MIB 都将在每次调用时被包含。\n\n当然，这也不是永久的。虽然你可以在\
  \ profile 脚本中指定此变量，但为机器上的所有用户管理起来会很繁琐。这时就轮到第三种方法了：配置文件。\n\n同样，你可以使用位于用户主目录中的 .snmp/snmp.conf\
  \ 下的每用户配置文件，也可以使用全局的 /etc/snmp/snmp.conf 文件。\n\n> 如果你从源码编译了 Net-SNMP，全局配置文件和 MIB\
  \ 目录的位置可能不同。它们可能位于 /usr/local。\n\n添加 MIB 的语法与环境变量中使用的语法类似——只需在每行前面加上 mibs，如下所示：\n\
  \n```\nmibs +PowerNet-MIB\n```\n\n如果你想在上述任一位置指定多个 MIB 名称，必须用冒号分隔它们。假设你还需要一个通用的 UPS\
  \ MIB；在这种情况下，MIB 名称字符串将如下所示：\n\n```\n+PowerNet-MIB:UPS-MIB\n```\n\n> 在某些 Net-SNMP\
  \ 版本中，配置文件中的行可能会在 1024 个字符（包括换行符）处被静默截断。你可以指定多个 mibs 行来绕过此限制。\n\n\n\n\n\n如果感到懒惰，可以通过将\
  \ `mibs` 设置为 `ALL` 来让 Net-SNMP 包含位于这些目录中的所有 MIB 文件——这在三个位置都适用。请注意，这可能会影响性能，并且如果某些部分在多个位置声明，也可能导致一些问题，包括来自\
  \ Net-SNMP 工具的警告以及使用错误的定义。\n\n> Zabbix 服务器始终加载所有可用的 MIB。当添加新的 MIB 时，必须重启 Zabbix\
  \ 服务器才能使其生效。\n\n## 在 Zabbix 中轮询 SNMP 项\n\n有了关于 SNMP OID 的这些知识，让我们进入正题——将 SNMP 数据获取到\
  \ Zabbix 中。为了让以下步骤更轻松，你应该选择返回字符串数据的条目。我们可以使用 UPS 序列号，例如之前发现的 `PowerNet-MIB::upsAdvIdentSerialNumber.0`。对某些网络打印机或可管理交换机也做同样的操作；如果你无法访问此类设备，可以选择来自\
  \ Net-SNMP 启用的主机的简单条目，例如前面提到的系统描述，`SNMPv2-MIB::sysDescr.0`。\n\n现在是时候返回 Zabbix 界面了。前往\
  \ **Configuration | Hosts**，并点击 **Create host**。然后，填写以下值：\n\n- **Host name:** 输入\
  \ `SNMP device`。\n- **Groups:** 如果在 **In groups** 列表框中有组，请选择它并点击按钮。\n- **New group:**\
  \ 输入 `SNMP devices`。\n- **SNMP interfaces:** 点击 **Add**。\n- **DNS NAME or IP ADDRESS:**\
  \ 在我们刚刚添加的 SNMP 接口旁边输入正确的 DNS 名称或 IP 地址。如果你选择使用 SNMP 启用的设备，请在此输入其 IP 或 DNS。如果无法访问此类设备，请使用\
  \ **Another** 主机的 IP 地址或 DNS 名称。\n- **CONNECT TO:** 根据你填写的字段选择 **DNS** 或 **IP**。\n\
  \nHost name SNMP device\n\nVisible name\n\nGroups In groups Other groups\n\nSNMP\
  \ devices\n\nDatabase servers\nDiscovered hosts\nHypervisors\nLinux servers\nNetwork\
  \ devices\nTemplates\nUPS devices\nVirtual machines\nWeb servers\nWindows servers\n\
  \nNew group\n\nAgent interfaces IP ADDRESS DNS NAME CONNECT TO PORT DEFAULT\n127.0.0.1\
  \ IP DNS 10050 Remove\nAdd\n\nSNMP interfaces\n192.168.56.11 IP DNS 161 Remove\n\
  Use bulk requests\nAdd\n\n> 如果不会为此主机创建 agent 项，则 agent 接口将被忽略。你可以保留它或将其删除。\n\n完成后，点击底部的\
  \ Add 按钮。很可能你不会在主机列表中看到新创建的主机。原因是右上角的 Group 下拉菜单，可能显示为 Linux servers。你可以将选择更改为 All\
  \ 以查看所有配置的主机，或更改为 SNMP devices 以仅查看我们的新设备。现在是创建项的时候了，因此点击 **SNMP devices** 旁边的 Items\
  \ 并点击 Create item 按钮。填写以下值：\n\n- Name: 输入一个合理的名称，例如 Serial number，如果你使用的是 SNMP agent\
  \ 的 OID，或 System description 如果你使用的是 Net-SNMP 守护进程。\n- Type: 更改为你的 SNMP agent 的适当版本。在显示的示例中，选择了\
  \ SNMPv1 agent，因为这是我们的设备唯一支持的版本。\n- Key: 这对于 SNMP 项来说不受限制或不那么重要，但对于来自触发器和其他位置的引用是必需的。你可以选择输入文本\
  \ OID 的最后一部分，例如 upsAdvIdentSerialNumber.0 或 sysDescr.0。\n\n- **SNMP OID**: 这里就是我们的知识派上用场的地方。粘贴你找到并选择的\
  \ SNMP OID。在示例中，输入了 `PowerNet-MIB::upsAdvIdentSerialNumber.0`。如果你使用的是 Net-SNMP 守护进程，请输入\
  \ `SNMPv2-MIB::sysDescr.0`\n- **SNMP community**: 除非你更改过它，否则保留默认的 `public` 值。\n\
  - **Type of information**: 选择 **Character**。\n- **Update interval (in sec)**: 此信息并不经常变化，因此使用较大的值，例如\
  \ 86400。\n\n![](img/f5313a804532fabacc8d07cc8607eeba_156_0.png)\n\n> 如果你保留了 agent\
  \ 接口，请注意它无法为此项选择——只能选择 SNMP 接口。虽然某些项类型可以分配给任何接口类型，但 SNMP 项必须分配给 SNMP 接口。\n\n完成后，点击底部的\
  \ Add 按钮。\n\n现在，结果取决于多个因素。如果运气好，你已经可以在 **Monitoring | Latest data** 中看到传入的数据。如果你选择了某些厂商特定的\
  \ OID，如我们的示例中那样，可能需要返回 **Configuration | Hosts**，点击 **SNMP device** 旁边的 **Items**，并观察此项的状态：\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_156_1.png)\n\n现在这是怎么回事？怎么会这样？我们在使用 Net-SNMP\
  \ 命令行工具进行测试时确实看到了这样的 OID。出现此错误消息的一种可能情况是指定的 MIB 不可用，如果你之前从不同主机尝试过 SNMP 查询，就会发生这种情况。\n\
  \nZabbix 服务器的工作方式就像为 MIB 内容设置了 ALL；因此，除了将 MIB 复制到 Zabbix 服务器上的正确目录（通常为 `/usr/share/snmp/mibs`）并重启服务器守护进程外，你无需做任何其他操作。如果你没有复制\
  \ OID，而是选择重新输入它，可能犯了错误。验证输入的 OID 是否正确。\n\n> 在某些情况下，Zabbix 前端中的错误消息可能会具有误导性。请检查服务器日志以确保无误。\n\
  \n修复任何问题后，等待 Zabbix 服务器刷新项配置并重新检查项。配置好项后，让我们看看可以从中获取哪些数据。导航到 **Monitoring | Latest\
  \ data**，展开过滤器，清除 **Host groups** 字段，并在 **Host** 字段中开始输入 SNMP —— **SNMP device**\
  \ 应该会出现，因此选择它并点击 **Filter**。如有需要展开其他类别，并查找序列号。你应该会看到类似这样的内容：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_157_0.png)\n\
  \n序列号已成功检索并在项列表中可见。这使我们能够自动检索数据，虽然与实际可用性或性能监控没有直接关系，但仍然非常有用。例如，如果远程设备死亡并需要更换，你可以轻松找到序列号以提供给维修请求，即使你之前没有记下来。\n\
  \n## 翻译 SNMP OID\n\n如果无法或不想将厂商特定的 MIB 文件复制到 Zabbix 服务器，你始终可以使用数字 OID，就像我们之前做的那样。虽然描述性不强，但它们保证即使由于某种原因未复制\
  \ MIB 或在系统升级期间被删除也能正常工作。\n\n很好，所以在这种情况下，所需的接口 eth0 的索引为 2。附近，我们可以找到我们感兴趣的实际信息——流量值：\n\
  \n```\nIF-MIB::ifOutOctets.1 = Counter32: 1825596052\n```\n\n```\nIF-MIB::ifOutOctets.2\
  \ = Counter32: 1533857263\n```\n\n因此，理论上，我们可以添加一个 OID 为 IF-MIB::ifOutOctets.2 的项并适当地命名它。不幸的是，有些设备会不时更改接口索引。此外，特定接口的索引可能在不同设备之间有所不同，从而可能造成配置噩梦。这就是\
  \ Zabbix 中动态索引支持派上用场的地方。\n\n让我们看看在这种情况下动态索引项 OID 会是什么样子：\n\n| IF-MIB::ifOutOctets[\
  \ | \"index\", | \"ifDescr\", | \"eth0\"] |\n|---|---|---|---|\n| Database OID |\
  \ Literal string \"index\" | Index-based OID | Index string |\n\n- Database OID:\
  \ 这是保存我们感兴趣的数据的 OID 的基本部分，即不带实际索引的部分。在这种情况下，它是通向 ifOutOctets 的 OID，任何表示法均可。\n- Literal\
  \ string \"index\": 这对所有动态索引项都相同。\n- Index-based OID: 这是保存我们感兴趣的索引的 OID 的基本部分。在这种情况下，它是通向\
  \ ifDescr 的 OID，任何表示法均可。\n- Index string: 这是将在索引部分树中搜索的字符串。这是前一个基本 OID 的所有 OID 的精确区分大小写匹配。这里将搜索我们感兴趣的接口的名称\
  \ eth0。不允许使用子字符串或其他匹配。\n\n此搜索返回的索引将被添加到数据库 OID 中，并且后续查询将从生成的 OID 中收集值。\n\n你可以使用\
  \ Net-SNMP 工具轻松查看索引以确定要搜索的正确字符串：\n\n```\n$ snmpwalk -v 2c -c public localhost .iso.org.dod.internet.mgmt.mib-2.interfaces.ifTable.ifEntry.ifDescr\n\
  ```\n\n```\nIF-MIB::ifDescr.1 = STRING: lo\n```\n\n```\nIF-MIB::ifDescr.2 = STRING:\
  \ eth0\n```\n\n```\nIF-MIB::ifDescr.3 = STRING: sit0\n```\n\n\n\n\n\n正如可以看到的，这台机器有三个接口：**loopback**、**Ethernet**\
  \ 和一个 **tunnel**。对于某些其他设备，图片会非常不同。例如，HP ProCurve 交换机返回的结果（输出已缩短）如下：\n\n```\n$ snmpwalk\
  \ -v 2c -c public 10.196.2.233 .iso.org.dod.internet.mgmt.mib-2.interfaces.ifTable.ifEntry.ifDescr\n\
  IF-MIB::ifDescr.1 = STRING: 1\nIF-MIB::ifDescr.2 = STRING: 2\n...\nIF-MIB::ifDescr.49\
  \ = STRING: 49\nIF-MIB::ifDescr.50 = STRING: 50\nIF-MIB::ifDescr.63 = STRING: DEFAULT_VLAN\n\
  IF-MIB::ifDescr.4158 = STRING: HP ProCurve Switch software loopback interface\n\
  ```\n\n现在我们知道了用于动态索引项的 OID，让我们在 Zabbix 中创建一个这样的项。导航到 **Configuration | Hosts**，点击要创建项的正确主机旁边的\
  \ **Items**，然后点击 **Create item**。填写以下值：\n\n- **Name:** 接口 $1 的出站流量\n- **Type:**\
  \ SNMPv2 agent\n- **Key:** ifOutOctets[eth0]\n- **SNMP OID:** IF-MIB::ifOutOctets[\"\
  index\",\"ifDescr\",\"eth0\"]\n- **Units:** Bps\n- **Store value:** Delta (speed\
  \ per second)\n\n与之前一样，将 eth0 替换为目标系统上存在的接口名称。完成后，点击底部的 **Add** 按钮。\n\n> 请确保正确输入复合\
  \ OID，注意引号和拼写。我们在 *Chapter 3, Monitoring with Zabbix Agents and Basic Protocols*\
  \ 中讨论了使用 **Numeric (unsigned)** 信息类型的原因。\n\n![](img/f5313a804532fabacc8d07cc8607eeba_160_0.png)\n\
  \n新添加的项应该开始收集数据，因此让我们查看 **Monitoring | Latest data**。如果看不到此项或其数据，请返回 **Configuration\
  \ | Hosts** 并点击相应主机旁边的 **Items**——应该会显示一条错误消息，有助于修复问题。如果您正确添加了该项，您将看到如下流量数据：\n\n\
  | LAST CHECK | LAST VALUE | CHANGE |\n|---|---|---|\n| 2016-03-18 19:40:07 | 37\
  \ Bps | -2 Bps |\n\n> 请记住，索引必须与确切的字符串匹配——这里子字符串匹配不起作用。\n\n动态索引项很常见。许多网络设备具有固定的端口名称但索引不同。基于主机的\
  \ SNMP 代理将磁盘使用情况和内存统计信息等内容放在动态索引中；因此，如果您有此类设备需要监控，Zabbix 对它们的支持将非常有用。\n\n使用动态索引项会略微增加整体负载，因为需要两个\
  \ SNMP 值才能获得最终数据。Zabbix 会缓存检索到的索引信息，因此负载增加应该不会明显。\n\n动态 SNMP 索引使我们能够轻松按名称监控特定接口或其他实体，但对于监控大量接口来说并不是非常有效的方法。我们将在\
  \ *Chapter 11, Advanced Item Monitoring* 中讨论一种自动化的解决方案，即低级发现。\n\n## SNMP bulk requests\n\
  \n您可能已经注意到 **SNMP interfaces** 部分旁边的复选框，**Use bulk requests**：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_161_0.png)\n\
  \n现在，开始指示 snmptrapd 使用该脚本。我们只需要告诉 trap 守护进程使用此脚本处理所有接收到的 traps。为此，您必须找到发行版放置 Net-SNMP\
  \ 配置文件的位置——通常是 /etc/snmp/。在此目录中，查找名为 snmptrapd.conf 的文件。如果存在，请编辑它（操作前先创建备份副本）；如果不存在，请创建它。以\
  \ root 身份编辑它，使其如下所示：\n\n```\nauthCommunity execute public\nperl do \"/home/zabbix/bin/zabbix_trap_receiver.pl\"\
  ;\n```\n\n这将接受所有 community 设置为 public 的 traps 并将其传递给 Perl 接收器脚本。\n\n> 如果您预计会收到各种事先未知的\
  \ community 字符串的 traps，您可以使用 snmptrapd.conf 中的 disableAuthorization yes 选项禁用授权或\
  \ community 字符串检查。\n\n启动或重启 trap 守护进程。值得快速查看一下 zabbix_trap_receiver.pl 文件。注意指定路径的那一行：\n\
  \n```\n$SNMPTrapperFile = '/tmp/zabbix_traps.tmp';\n```\n\n在幕后，traps 通过临时文件传递给 Zabbix\
  \ 服务器。我们将在本章稍后更详细地讨论这一点。\n\n## Filtering values by received data\n\n现在来看 Zabbix\
  \ 端的项。首先，我们将尝试从 Zabbix 服务器发送值。导航到 Configuration | Hosts，点击 NAME 列中的 A test host，然后点击\
  \ SNMP interfaces 部分的 Add。点击底部的 Update 按钮，然后点击 A test host 旁边的 Items。点击 Create item\
  \ 并输入以下值：\n\n- **Name:** SNMP trap tests\n- **Type:** SNMP trap\n- **Key:** snmptrap[test]\n\
  - **Type of information:** Character\n\n完成后，它应该如下所示：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_165_0.png)\n\
  \n此项将收集该主机接收到的所有 traps，前提是 traps 包含字符串 test。我们已将 trap 守护进程配置为将 traps 放在文件中，并且我们有项来放置这些\
  \ traps。剩下的就是告诉 Zabbix 服务器从哪里获取 traps。打开 zabbix_server.conf 并修改 StartSNMPTrapper\
  \ 参数：\n\n```\nStartSNMPTrapper=1\n```\n\nZabbix 中有一个特殊进程用于从临时文件读取 traps。该进程默认未启动，因此我们更改了配置的一部分。查看此参数上方的参数：\n\
  \n```\nSNMPTrapperFile=/tmp/zabbix_traps.tmp\n```\n\n注意它与 Perl 脚本中的文件匹配。脚本中的更改应与此配置文件中的更改相匹配，反之亦然。此时，我们不会更改此临时文件的位置。\n\
  \n完成这些更改后，重启 Zabbix 服务器守护进程。\n\n现在，我们准备测试此项。让我们从 Zabbix 服务器执行以下命令发送一个 trap：\n\n\
  ```\n$ snmptrap -Ci -v 2c -c public localhost \"\" \"NET-SNMP-MIB::netSnmpExperimental\"\
  \ NET-SNMP-MIB::netSnmpExperimental s \"test\"\n```\n\n这种略显不理想的 Net-SNMP 语法将尝试使用\
  \ public community 和一些无意义的 OID 向 localhost 发送 SNMP trap。它还将等待响应以验证 snmptrapd 是否成功接收到\
  \ trap——这是通过 -Ci 标志实现的。它使用默认端口 162，因此请确保 Zabbix 服务器上的防火墙配置中该端口对接收 traps 是开放的。\n\n\
  > 等待确认也会使 snmptrap 重传 trap。如果接收主机响应缓慢，trap 可能在发送方收到确认之前被多次接收。\n\n如果命令成功，它将不会有任何输出而结束。如果它失败并显示\
  \ snmpinform: Timeout 错误消息，则可能出现多种问题。除了仔细检查 UDP 端口 162 是否对传入数据开放外，请验证 /etc/snmp/snmptrapd.conf\
  \ 文件中的 community 是否与 snmptrap 命令中使用的 community 匹配，并且 snmptrapd 守护进程确实正在运行。\n\n如果一切顺利，我们应该能够在最新数据页面上看到此项及其值：\n\
  \n| SNMP trap tests | 2016-03-18 23:17:48 | 23:17:46 2016/03/18 PDU INF... |\n\n\
  现在，让我们发送一个不同的 trap。仍在 Zabbix 服务器上，运行以下命令：\n\n```\n$ snmptrap -Ci -v 2c -c public\
  \ localhost \"\" \"NET-SNMP-MIB::netSnmpExperimental\" NET-SNMP-MIB::netSnmpExperimental\
  \ s \"some other trap\"\n```\n\n此 trap 不会在我们创建的项中出现。发生了什么？由于我们发送的值不包含字符串 test，因此该值与项中的值不匹配。默认情况下，此类\
  \ traps 会记录在服务器日志文件中。如果我们检查日志文件，它应该包含类似以下内容：\n\n```\n9872:20160318:232004.319 unmatched\
  \ trap received from \"127.0.0.1\":\n23:20:02 2016/03/18 PDU INFO:\n  requestid\
  \          253195749\n  messageid          0\n  transactionid      5\n  version\
  \            1\n  notificationtype   INFORM\n  community          public\n  receivedfrom\
  \       UDP: [127.0.0.1]:54031->[127.0.0.1]:162\n  errorindex         0\n  errorstatus\
  \        0\nVARBINDS:\n  DISMAN-EVENT-MIB::sysUpTimeInstance type=67 value=Timeticks:\
  \ (2725311) 7:34:13.11\n  SNMPv2-MIB::snmpTrapOID.0          type=6  value=OID:\
  \ NET-SNMP-MIB::netSnmpExperimental\n  NET-SNMP-MIB::netSnmpExperimental type=4\
  \  value=STRING: \"some other trap\"\n```\n\n\n\n这在前端触发或甚至看到都不是那么容易。我们将改善这种情况，并告诉\
  \ Zabbix 通过将它们放在一个特殊的监控项中来处理此主机上的此类不匹配的 trap。导航到 配置 | 主机，点击 A test host 旁边的 监控项，点击\
  \ 创建监控项，然后填写以下值：\n\n- **名称：** SNMP trap fallback\n- **类型：** SNMP trap\n- **Key：**\
  \ snmptrap.fallback\n- **信息类型：** 字符\n\n完成后，点击底部的 添加 按钮。\n\n我们在此使用的 key，snmptrap.fallback，是一个特殊的\
  \ key。任何与 snmptrap[] 监控项都不匹配的 trap 都将被放置于此。重新发送我们之前未匹配的 trap：\n\n```\n$ snmptrap\
  \ -Ci -v 2c -c public localhost \"\" \"NET-SNMP-MIB::netSnmpExperimental\" NET-SNMP-MIB::netSnmpExperimental\
  \ s \"some other trap\"\n```\n\n让我们再次查看最新的数据页面：\n\n| | | |\n|---|---|---|\n| SNMP\
  \ trap fallback | 2016-03-18 23:33:04 | 23:33:03 2016/03/18 PDU INF... |\n| SNMP\
  \ trap tests | 2016-03-18 23:17:48 | 23:17:46 2016/03/18 PDU INF... |\n\nfallback\
  \ 监控项这次收到了值。要查看值是什么样的，让我们点击这些监控项之一旁边的 历史 链接：\n\n| TIMESTAMP | VALUE |\n|---|---|\n\
  | 2016-03-18 23:33:04 | 23:33:03 2016/03/18 PDU INFO:<br>community public<br>receivedfrom\
  \ UDP: [127.0.0.1]:54642->[127.0.0.1]:162<br>errorindex 0<br>errorstatus 0<br>requestid\
  \ 108168159 |\n\n## Monitoring SNMP Devices\n\n它包含的信息相当多，但看起来有点奇怪，几乎就像值被截断了一样。事实证明，使用这种方法，记录在数据库中的\
  \ trap 信息非常冗长，而字符信息类型并不足以容纳它——该类型限制为 255 个字符。我们甚至无法看到在 trap 中发送的字符串，该字符串匹配或未匹配过滤器。让我们再次尝试使用批量更新功能来修复这个问题。转到\
  \ **配置 | 主机** 并点击 **A test host** 旁边的 **监控项**。标记两个 SNMP trap 监控项旁边的复选框，然后点击 **批量更新**\
  \ 按钮。在 resulting 表单中，标记 **信息类型** 旁边的复选框并选择 **文本**：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_168_0.png)\n\
  \n点击 **更新** 按钮。这应该已经修复了它，但我们还不确定。让我们验证一下——再次发送这两个 trap：\n\n```shell\n$ snmptrap\
  \ -Ci -v 2c -c public localhost \"\" \"NET-SNMP-MIB::netSnmpExperimental\" NET-SNMP-MIB::netSnmpExperimental\
  \ s \"test\"\n\n$ snmptrap -Ci -v 2c -c public localhost \"\" \"NET-SNMP-MIB::netSnmpExperimental\"\
  \ NET-SNMP-MIB::netSnmpExperimental s \"some other trap\"\n```\n\n如果我们现在查看其中一个监控项的历史记录，我们会看到这次更改确实有所帮助，并且显示了更多信息——包括我们用于在监控项之间分配这些值的自定义字符串：\n\
  \n| TIMESTAMP | VALUE |\n|---|---|\n| 2016-03-19 00:14:56 | 00:14:55 2016/03/19\
  \ PDU INFO:<br>messageid 0<br>transactionid 11<br>requestid 973564866<br>notificationtype\
  \ INFORM<br>version 1<br>receivedfrom UDP: [127.0.0.1]:40852->[127.0.0.1]:162<br>community\
  \ public<br>errorstatus 0<br>errorindex 0<br>VARBINDS<br>DISMAN-EVENT-MIB::sysUpTimeInstance\
  \ type=67 value=Timeticks: (3054527) 8:29:05.27<br>SNMPv2-MIB::snmpTrapOID.0 type=6\
  \ value=OID: NET-SNMP-MIB::netSnmpExperimental<br>NET-SNMP-MIB::netSnmpExperimental\
  \ type=4 value=STRING: \"some other trap\" |\n\n> \U0001F4A1 如果值仍然被截断，你可能需要等待一段时间让配置更新后再重新发送\
  \ trap。\n\n我们创建的第一个监控项，其 key 为 snmptrap[test]，实际上可以将正则表达式作为监控项参数。这使我们能够执行更高级的过滤，例如在一个监控项中获取链路\
  \ up 和 down trap。如果一个 trap 匹配多个监控项的表达式，它将被复制到所有这些监控项中。\n\n### Filtering values by\
  \ originating host\n\n我们已经弄清楚如何将值获取到特定的监控项中，但 Zabbix 如何知道应该将这些值放置在 A test host 中？这是因为\
  \ trap 来自的主机地址与这些监控项的 SNMP 接口中的地址匹配。为了测试这一点，让我们将 trap 监控项复制到 Another host。导航到 配置\
  \ | 主机 并点击 A test host 旁边的 监控项。标记两个 SNMP trap 监控项旁边的复选框，然后点击 复制到 按钮。从 目标类型 下拉菜单中选择\
  \ 主机 并标记 Another host 旁边的复选框。然后，点击 复制。\n\n> Details\n> Cannot copy items\n> Cannot\
  \ find host interface on \"Another host\" for item key \"snmptrap[test]\".\n\n>\
  \ 如果你之前为 Another host 添加了 SNMP 接口，此操作可能成功。\n\n看起来失败了，Zabbix 抱怨找不到接口。Another host\
  \ 没有 SNMP 接口；因此，这些监控项根本无法附加到任何接口。转到 配置 | 主机，点击 Another host，然后添加一个具有该主机地址的新 SNMP\
  \ 接口，然后点击 更新。尝试以与之前相同的方式将 SNMP trap 监控项从 A test host 复制到 Another host，现在应该成功了：\n\
  \n> Details\n> Items copied\n> - Created: item \"SNMP trap tests\" on \"Another\
  \ host\".\n> - Created: item \"SNMP trap fallback\" on \"Another host\".\n\n监控项就位后，让我们测试它们。以与之前从\
  \ Zabbix 服务器发送相同的方式，从 Another host 发送两个测试 trap：\n\n```\n$ snmptrap -Ci -v 2c -c\
  \ public <Zabbix server> \"\" \"NET-SNMP-MIB::netSnmpExperimental\" NET-SNMP-MIB::netSnmpExperimental\
  \ s \"test\"\n$ snmptrap -Ci -v 2c -c public <Zabbix server> \"\" \"NET-SNMP-MIB::netSnmpExperimental\"\
  \ NET-SNMP-MIB::netSnmpExperimental s \"some other trap\"\n```\n\n将 <Zabbix server>\
  \ 替换为 Zabbix 服务器的 IP 或 DNS 名称。这些命令应在没有任何错误消息的情况下完成。\n\ntrap 应该正确放置在 Another host\
  \ 上的监控项中。\n\n### Debugging\n\n如果 trap 完全没有到达或没有落入正确的监控项，有几件事需要检查。如果 trap 从远程主机发送时没有出现，但从\
  \ Zabbix 服务器发送时工作正常，请检查 Zabbix 服务器上的本地防火墙，并确保允许端口 162 上的入站 UDP 数据包。也请确保 Zabbix 服务器在收到的\
  \ trap 中看到的 IP 地址与该主机的 SNMP 接口中的地址匹配。\n\n有时，人们可能会看到 trap 到达 SNMP trap 守护进程但似乎没有被传递。在这种情况下，调试\
  \ snmptrapd 可能会很有用——幸运的是，它允许非常详细的调试输出。用于各种文件位置的确切值会有所不同，但以下方法可能适用于在启用所有调试输出的同时手动启动守护进程：\n\
  \n```\n# /usr/sbin/snmptrapd -A -Lf /var/log/net-snmpd.log -p /var/run/snmptrapd.pid\
  \ -DALL\n```\n\n这里，-Lf 指定要记录到的文件，-DALL 表示启用完整调试。\n\n如果收到的 trap 采用数字格式且不可读，你可能需要在\
  \ /etc/snmp/snmp.conf 文件中添加特定的 MIB，以便 snmptrapd 找到它们。\n\n如果 Zabbix 决定某个 trap 不属于任何主机的任何监控项会怎样？这可能是因为根本没有\
  \ trap 监控项，fallback 监控项缺失，或者传入 trap 中的地址与任何 SNMP 接口都不匹配。默认情况下，Zabbix 服务器会在日志文件中记录此类\
  \ trap。日志文件中的示例记录如下：\n\n```\n2271:20150120:124156.818 unmatched trap received from\n\
  [192.168.168.192]: 12:41:55 2015/01/20 PDU INFO:\nerrorindex              0\ntransactionid\
  \            1\nrequestid                1752369294\nmessageid                0\n\
  receivedfrom             UDP: [192.168.168.192]:45375->[192.168.1.13]:162\nerrorstatus\
  \              0\nversion                  1\nnotificationtype         INFORM\n\
  community                          public\nVARBINDS:\n    DISMAN-EVENT-MIB::sysUpTimeInstance\
  \ type=67 value=Timeticks:\n    (77578087) 8 days, 23:29:40.87\n    SNMPv2-MIB::snmpTrapOID.0\
  \          type=6  value=OID: NET-SNMP-\nMIB::netSnmpExperimental\n    NET-SNMP-MIB::netSnmpExperimental\
  \ type=4  value=STRING: \"non-\nmatching trap\"\n```\n\n不匹配 trap 的记录可以控制。如果我们转到\
  \ 管理 | 全局 并从右上角的下拉菜单中选择 其他，最后一个复选框是 记录不匹配的 SNMP trap。取消标记它将停止记录此类 trap：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_171_0.png)\n\
  \n如果您想在不设置 SNMP trap 守护进程的情况下尝试 Zabbix 的 SNMP trap 处理，例如在某些开发服务器上？这应该非常容易，因为您可以简单地将\
  \ trap 信息附加到临时文件。这是一个纯文本文件，Zabbix 不知道谁添加了内容，是 trap 守护进程、用户还是其他人。只需确保一次添加单个 trap\
  \ 的所有数据即可。\n\n### Handling the temporary file\n\n默认情况下，将 trap 从 trap 守护进程传递给 Zabbix\
  \ 的临时文件放置在 /tmp 中。这不是生产设置的良好做法，所以我建议你在对初始测试满意后更改它。\n\n请注意，临时文件可以无限增长——Zabbix 只从中读取数据，从不轮转或删除该文件。轮转应该单独设置，可能使用\
  \ logrotate 守护进程。\n\n\n\n\n\n# SNMP Trap Translator\n\nZabbix 还可以接收由 **SNMP Trap\
  \ Translator (SNMPTT, http://www.snmptt.org/)** 解析的 traps。此方法使用与嵌入式 Perl trap 接收器解决方案相同的临时文件和内部进程方法。SNMPTT\
  \ 可用于使接收到的数据更易于人类阅读。\n\n请记住它会更改传递的数据，因此根据设置情况，添加 SNMPTT 可能需要更改项映射、触发器或其他配置。\n\n\
  # 使用自定义脚本\n\n前面介绍的方法，嵌入式 Perl 接收器，设置简单且性能良好。如果由于某种原因无法使用它或需要更高级的过滤，可以使用自定义脚本将 trap\
  \ 值推送到项。本小节将使用随 Zabbix 提供的示例脚本来演示这种解决方案。\n\n我们将示例 SNMP trap 解析脚本放在 Zabbix 用户的主目录中：\n\
  \n```\n```bash\n# cp misc/snmpttrap/snmptrap.sh /home/zabbix/bin\n```\n```\n\n现在让我们查看该脚本。打开我们刚刚复制到\
  \ `/home/zabbix/bin/snmptrap.sh` 的文件。可以看到，这是一个非常简化的脚本，它接收 trap 信息，然后使用主机 snmptrap\
  \ 和 key snmptrap 实例将其发送到 Zabbix 服务器。如果你足够仔细阅读，你可能已经注意到一个问题：我们没有安装任何软件作为 `~zabbix/bin/zabbix_sender`，所以这可能是不正确的。\n\
  \n首先，让我们找出 zabbix_sender 实际位于何处：\n\n```\n```bash\n$ whereis zabbix_sender\nzabbix_sender:\
  \ /usr/local/bin/zabbix_sender\n```\n```\n\n在此系统上，它是 `/usr/local/bin/zabbix_sender`。查看其语法可能是一个好主意，运行以下命令：\n\
  \n```\n```bash\n$ zabbix_sender --help\n```\n```\n\n这允许你向 Zabbix 服务器发送值，使用 `-z`\
  \ 标志指定服务器，使用 `-p` 指定端口，等等。现在让我们回到脚本。凭借我们新的知识，让我们查看最后一行——调用 `zabbix_sender` 的那一行。脚本似乎将从\
  \ SNMP trap 中检索到的值作为参数传递给 `zabbix_sender`；因此，我们无法在 `snmptrapd` 和 Zabbix 之间进行任何决策和信息转换。现在，让我们修复我们注意到的这个问题：\n\
  \n- 将 `ZABBIX_SENDER` 改为读取 `/usr/local/bin/zabbix_sender`（或根据你的情况使用其他路径）\n- 此外，将最后一行改为\
  \ `$ZABBIX_SENDER -z $ZABBIX_SERVER -p $ZABBIX_PORT -s \"$HOST\" -k \"$KEY\" -o\
  \ \"$str\"`——这样，我们也会引用主机和 key 名称，以防它们包含空格或其他可能破坏命令执行的字符\n\n保存文件。现在让我们为 Zabbix 准备\
  \ trap 接收。在前端，导航到 **Configuration | Hosts** 并点击 **Create host**。填写以下值：\n\n- **Name:**\
  \ `snmptraps`\n- **Groups:** 在 **Other groups** 框中点击 **SNMP devices**，然后如果 **In\
  \ groups** 列表框中还有其他组，点击左箭头按钮将其移除\n\n点击底部的 **Add** 按钮。请注意，此处使用的主机名 `snmptraps` 必须与我们在\
  \ `snmptrap.sh` 脚本中配置的名称相同；否则，traps 将不会在 Zabbix 中接收到。\n\n现在，点击 **snmptraps** 主机旁边的\
  \ **Items**，然后点击 **Create item**。输入这些值：\n\n- **Name:** `Received SNMP traps`\n-\
  \ **Type:** **Zabbix trapper**\n- **Key:** `snmptraps`\n- **Type of information:**\
  \ **Character**\n\n> 我们在此处使用 **Character** 信息类型，因为我们的脚本预计会向项传递较少的信息。如果需要传递大量信息，我们会将此参数再次设置为\
  \ **Text**。\n\n![](img/f5313a804532fabacc8d07cc8607eeba_173_0.png)\n\n完成后，点击底部的\
  \ **Add** 按钮。同样，请注意我们使用的 key 拼写与 `snmptrap.sh` 脚本中的完全相同。\n\n# Monitoring SNMP Devices\n\
  \n我们已经完成了为 SNMP trap 接收配置 Zabbix 的工作，但 traps 如何到达我们编辑的脚本，进而到达 Zabbix 呢？与之前一样，这就是\
  \ `snmptrapd` 发挥作用的地方。\n\n让我们创建一个简单的配置，将所有接收到的 traps 传递给我们的脚本。为此，我们将编辑 `snmptrapd.conf`。如果你之前创建过它，请编辑它（你可以注释掉之前添加的行）；如果它不存在，请创建该文件。以\
  \ root 身份编辑它，使其如下所示：\n\n```\nauthCommunity execute public\n#perl do \"/home/zabbix/bin/zabbix_trap_receiver.pl\"\
  ;\ntraphandle default /bin/bash /home/zabbix/bin/snmptrap.sh\n```\n\n我们注释掉了 Perl\
  \ 接收器行并添加了一行来调用我们的新脚本。default 关键字将确保所有接收到的 traps 都进入此脚本（也就是说，除非我们有其他指定 OIDs 的 traphandle\
  \ 语句，在这种情况下，只有那些与任何其他 traphandle 语句都不匹配的接收到的 traps 才会进入此脚本）。保存文件，然后根据你的发行版启动或重启\
  \ `snmptrapd` 守护进程。\n\n现在，我们应该能够通过整个链路接收 SNMP traps。让我们通过与之前相同的方式从 Zabbix 服务器发送一个\
  \ trap 来测试：\n\n```\n$ snmptrap -Ci -v 2c -c public localhost \"\" \"NET-SNMP-MIB::netSnmpExperimental\"\
  \ NET-SNMP-MIB::netSnmpExperimental s \"test\"\n```\n\n命令成功完成后，检查前端的结果。转到 **Monitoring\
  \ | Latest data** 并在过滤器中选择 **SNMP devices**：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_174_0.png)\n\
  \n很好，我们的测试 trap 的数据已在此处接收到。尽管在表格视图中被截断了，所以点击 **History** 查看全部内容：\n\n| TIMESTAMP\
  \ | VALUE |\n|---|---|\n| 2016-03-19 00:41:52 | localhost \"test\" NET-SNMP-MIB::netSnmpExperimental\
  \ |\n\n## Database lookups\n\n另一种方法是利用 Zabbix 数据库中已有的知识。由于数据库中已保存主机/IP 地址关系的信息，我们可以简单地查找对应的主机名。让我们修改\
  \ `snmptraps.sh`，使所有来自 Zabbix 中定义的 hosts 的 traps 都进入该特定主机的 `snmptraps` 项，而其他 traps\
  \ 则收集到通用的 `snmptraps` 主机中。\n\n首先修改 `/home/zabbix/bin/snmptraps.sh` 并添加两行：\n\n```\n\
  oid=`echo $oid|cut -f11 -d'.'`\ncommunity=`echo $community|cut -f2 -d'\"'`\nzabbixhost=$(HOME=/root\
  \ mysql -N -e \"select host from zabbix.hosts\nleft join zabbix.interface on zabbix.hosts.hostid=zabbix.interface.\n\
  hostid where ip='$hostname' order by hostid limit 1;\" 2>/dev/null)\n[ $zabbixhost\
  \ ] && HOST=$zabbixhost\nstr=\"$hostname $address $community $enterprise $oid\"\n\
  $ZABBIX_SENDER $ZABBIX_SERVER $ZABBIX_PORT -s \"$HOST\" -k \"$KEY\" -o\n\"$str\"\
  \n```\n\n这些做了什么？第一行查询 MySQL 数据库并检查是否定义了与 trap 源 IP 相同的 host。如果有，则 Zabbix host 变量会被分配\
  \ Zabbix 中定义的主机名。返回结果按 host ID 排序，并且只取第一个匹配项。因此，如果有多个具有相同 IP 地址的主机（在 Zabbix 中完全可以），则只会选择最旧的条目。任何错误输出都会被丢弃（重定向到\
  \ `/dev/null`），因此在数据库配置错误的情况下，traps 不会丢失，而是会进入通用的 trap 处理主机。\n\n第二行简单地将用于向 Zabbix\
  \ 发送数据的 host 设置为从数据库返回的条目（如果存在）。\n\n但第一行中的那个 HOME 变量是什么？那里的 mysql 命令未指定用户、密码或任何其他连接信息，因此要使命令成功，它必须从某处获取这些信息。对于\
  \ MySQL，这些信息可以放在用户 HOME 目录中的 `.my.cnf` 文件中。鉴于 `snmptrapd` 以 root 运行，但服务通常不会获得普通登录所拥有的所有环境变量，我们正在指示后续命令在\
  \ `/root` 中查找该文件。\n\n这意味着我们还没有完成；我们必须创建 `/root/.my.cnf` 文件并填入所需信息。以 root 身份创建 `/root/.my.cnf`\
  \ 并在其中放置以下内容：\n\n```\n[client]\nuser=zabbix\npassword=mycreativepassword\n```\n\n\
  \n\n\n\n对于密码，请使用与Zabbix服务器和前端相同的密码（如果您不记得此密码，可以在zabbix_server.conf中查找）。\n\n现在，我们应该在Zabbix端准备好接收陷阱。打开“配置”|“主机”，点击“Another\
  \ host”旁边的“监控项”，然后点击“创建监控项”按钮。输入以下值：\n\n- 名称：`snmptraps`\n- 类型：Zabbix trapper\n\
  - 键：`snmptraps`\n- 信息类型：字符\n\n完成后，点击底部的“添加”按钮。\n\n在发送测试陷阱之前，我们还要做一件事：确保snmptrapd不对接收到的陷阱执行反向查找。虽然这可能会稍微降低数据的美观度，但我们希望暂时保持此脚本的简单性，这也会稍微提高性能。为此，请在启动脚本中为snmptrapd添加`-n`标志，然后重启它。此过程因发行版而异。\n\
  \n最后，我们准备测试这个棘手的设置。在Another host上执行以下命令：\n\n```\n$ snmptrap -Ci -v 2c -c public\
  \ <Zabbix server> \"\" \"NET-SNMP-MIB::netSnmpExperimental\" NET-SNMP-MIB::netSnmpExperimental\
  \ s \"test\"\n```\n\n将<Zabbix server>替换为Zabbix服务器的IP或DNS名称。此命令应该无任何错误信息地完成。\n\n\
  > 这不适用于A test host——在IP地址为127.0.0.1的最早的主机将是Zabbix服务器示例主机。\n\n回到前端，导航到“监控”|“最新数据”：\n\
  \n| Another host | - 其他 - (1个监控项) |\n|---|---|\n| snmptraps | 2016-03-19 11:35:34\
  \ | 192.168.56.11 \"test\" NET-SNM... |\n\n很好，snmptrap实例现在已成功地按主机分类（如果存在的话）。\n\n\
  如果此陷阱未被正确分类，并且仍然进入了**snmptraps**主机，则可能是某些Net-SNMP版本输出不同所致。它们不是将传入连接的IP地址或主机名作为第一个值传递，而是传递如下所示的字符串：\n\
  \n```\nUDP: [192.168.56.11]:56417->[192.168.56.10]:162\n```\n\n在这种情况下，尝试在`zabbixhost`赋值之前添加另一行：\n\
  \n```\noid=`echo $oid|cut -f11 -d'.'`\ncommunity=`echo $community|cut -f2 -d'\"\
  '`\nhostname=$(echo \"$hostname\" | awk -F'[][]' '{print $2}')\n```\n\n它将从`hostname`变量中提取第一个用方括号括起来的字符串。对脚本进行此更改后，再次发送陷阱。\n\
  \n这花费了我们一些时间来设置，但现在非常简单。如果我们希望来自某个主机的陷阱由特定主机处理，我们就为该主机创建该主机和一个`snmptraps`监控项。所有其他陷阱将进入通用**snmptraps**主机和**snmptraps**监控项。\n\
  \n但是监控项查找呢？数据库中同样保存着监控项键的信息，所以也许我们可以尝试使用这一点。\n\n我们需要根据陷阱中接收的信息，从数据库字段中检索监控项键。由于陷阱包含SNMP\
  \ OID，它们是将陷阱映射到监控项的最佳候选。OID可以是数字形式或文本形式。在Zabbix配置中，有两个字段可以使用：\n\n- **名称**：虽然不是严格的自由格式字段，但它是“友好名称”，所以我们最好保持其可读性。\n\
  - **键**：此字段对可接受的字符有更严格的规则，但OID应该没问题。虽然人类不经常使用，但此字段在触发器表达式中仍会被引用。\n\n这意味着我们将使用**键**字段。为了使其既足够短又具有一定可读性，我们将其设置为接收到的文本形式OID的最后一部分。由于陷阱将由`snmptraps.sh`接收，它将尝试将接收到的OID与监控项键匹配，并根据结果决定将数据发送到哪里。\n\
  \n> 请记住，可能必须将特定的MIB添加到`/etc/snmp/snmp.conf`中，以便`snmptrapd`能够找到它们。\n\n再次以root身份编辑/home/zabbix/bin/snmp\
  \ traps.sh脚本。替换我们刚刚添加的两行，使其看起来像这样：\n\n```\ncommunity=`echo $community|cut -f2 -d'\
  \ '`\nenterprise=`echo $enterprise|cut -f2 -d' '`\noid=`echo $oid|cut -f11 -d'.'`\n\
  community=`echo $community|cut -f2 -d'\"'`\nhostname=$(echo \"$hostname\" | awk\
  \ -F'[][' ' '{print $2}')\nzabbixhostid=$(HOME=/root mysql -N -e \"select hosts.hostid,host\
  \ from zabbix.hosts left join zabbix.interface on zabbix.hosts.hostid=zabbix.interface.hostid\
  \ where ip='$hostname' order by 'hostid' limit 1;\" 2>/dev/null)\nzabbixhost=$(echo\
  \ $zabbixhostid | cut -d\" \" -f2-)\n[[ \"$zabbixhost\" ]] && {\n    zabbixid=$(echo\
  \ $zabbixhostid | cut -d\" \" -f1)\n    trapoid=$(echo $oid | cut -d: -f3)\n   \
  \ if [ \"$trapoid\" ]; then\n        zabbixitem=$(HOME=/root mysql -N -e \"select\
  \ key_ from zabbix.items where key_='$trapoid' and hostid='$zabbixid';\" 2> /dev/null)\n\
  \        if [ \"$zabbixitem\" ]; then\n            HOST=$zabbixhost\n          \
  \  KEY=$zabbixitem\n        fi\n    fi\n}\n[[ $KEY = snmptraps ]] && {\n    if [\
  \ \"$(HOME=/root mysql -N -e \"select key_ from zabbix.items where key_='snmptraps'\
  \ and hostid='$zabbixid';\" 2> /dev/null)\" ]; then\n        HOST=$zabbixhost\n\
  \    fi\n}\nstr=\"$hostname $address $community $enterprise $oid\"\n```\n\n保存文件。从功能上讲，对于当前的配置，它的工作方式与之前的版本完全相同，但有一个小改进：如果你仔细看之前的版本，你会发现它只检查主机的可用性，因此如果你创建了一个主机但忘记为其创建带有snmptraps键的监控项，发送的陷阱将会丢失。而这个版本将检查该主机上是否存在具有此类键的监控项。如果不存在，通用主机snmptraps将接收该陷阱。\n\
  \n请注意，与之前配置的内嵌Perl陷阱接收器相比，这是自定义脚本解决方案的一个优势。为落入此后备主机的陷阱设置触发器，比在Zabbix服务器日志文件中检查它们更容易。\n\
  \n此外，它现在将检查该主机是否还具有一个键与接收到的OID最后部分匹配的监控项。一个简单的决策流程如下图所示：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_181_0.png)\n\
  \n要测试这一点，请从Another host发送一个SNMP陷阱（无需重启snmptrapd）：\n\n```\n$ snmptrap -Ci -v 2c -c\
  \ public <Zabbix server> \"\" \"NET-SNMP-MIB::netSnmpExperimental\" NET-SNMP-MIB::netSnmpExperimental\
  \ s \"test\"\n```\n\n将<Zabbix server>替换为Zabbix服务器的IP或DNS名称。如果你现在检查Another host的“监控”|“最新数据”，陷阱应该被正确放置在snmptraps监控项中。从任何其他主机（包括Zabbix服务器）发送的陷阱应该被放置在snmptraps主机和snmptraps监控项中——可以随便尝试。之前，从Zabbix服务器发送的陷阱会丢失，因为脚本没有检查snmptraps监控项是否存在——它会找到主机，然后尝试将数据推送到这个不存在的监控项。\n\
  \n现在让我们试一下监控项映射。进入Zabbix界面，“配置”|“主机”，点击“Another host”旁边的“监控项”，然后点击“创建监控项”按钮。填写以下值：\n\
  \n- 名称：实验性SNMP陷阱\n- 类型：Zabbix trapper\n\n## 监控SNMP设备\n\n- **键：** `netSnmpExperimental`\n\
  - **信息类型：** 字符\n\n完成后，点击底部的**添加**按钮。再次从**Another host**发送一个陷阱：\n\n```\n$ snmptrap\
  \ -Ci -v 2c -c public <Zabbix server> \"\" \"NET-SNMP-MIB::netSnmpExperimental\"\
  \ NET-SNMP-MIB::netSnmpExperimental s \"test\"\n```\n\n在前端，查看**监控 | 最新数据**。如果一切正常，这次陷阱数据应该被放置在另一个监控项中——我们刚刚创建的那个：\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_182_0.png)\n\n现在，每当我们有主机向我们发送陷阱时，我们都必须决定其陷阱发送到哪里。根据这一决定，我们将决定它是否需要自己的带有snmptraps监控项的主机，甚至可能需要为每种陷阱类型单独建立监控项。\n\
  \n## 摘要\n\n在之前探索了使用Zabbix代理进行基本监控之后，我们在本章中介绍了一种主要的无代理监控解决方案——SNMP。考虑到支持SNMP的设备种类繁多，这些知识应能帮助我们检索打印机、交换机、UPS等设备的信息，同时也能监听和管理来自这些设备的传入SNMP陷阱。\n\
  \n要警惕开始监控大量网络设备，尤其是当它们有很多接口时。例如，添加10个带48端口的交换机，即使你每分钟只监控每个交换机的一个监控项，也会使Zabbix每秒轮询8个新值（480个端口每分钟一次，即每秒产生480/60=8个新值）。通常，每个端口监控的值更多，因此如此增加可能使Zabbix服务器宕机，并严重影响网络性能，即使使用SNMP批量获取也是如此。\n\
  \n虽然我们现在已经创建了几个主机，但我们只关注了那些立即可用的主机属性。在下一章中，我们将进一步探讨可以在主机上控制的内容，包括主机和主机组的维护。我们还将了解如何使用用户和权限管理为其他用户提供对我们迄今为止所配置内容的访问权限。\n\
  \n\n\n\n"
- "# 管理主机、用户和权限\n\n我们之前创建了一些主机和主机组，从而探索了项目如何被分组并附加到主机。现在是时候更仔细地查看这些概念并了解它们提供的优势。我们将：\n\
  \n- 探索主机清单以及自动填充它的方法\n- 查看主机和主机组维护，这使我们能够停止收集数据或抑制告警\n- 了解 Zabbix 中的权限系统，以便您能够根据需要允许其他用户进行部分访问\n\
  \n## 主机和主机组\n\n主机可以被视为 Zabbix 配置中的基本分组单元。正如你可能记得的，主机用于分组项目，而项目又是基本的数据采集结构。每个主机可以分配任意数量的项目，涵盖所有项目类型：Zabbix\
  \ 代理、简单检查、SNMP、IPMI 等。项目不能单独存在，因此主机是强制性的。\n\nZabbix 不允许主机单独存在，即不属于任何组。让我们看看我们目前定义了哪些主机组——从前端打开\
  \ **Configuration | Host groups：**\n\n![](img/f5313a804532fabacc8d07cc8607eeba_184_0.png)\n\
  \n首先引起注意的是 **Templates** 组似乎已经有大量模板。这些是作为示例提供的，以便你以后可以快速参考它们以获取有关项目的提示。我们现在忽略这些。我们还可以看到一个空的\
  \ **Discovered hosts** 组和包含单个示例主机的 **Zabbix servers** 组。有趣的部分在表格的上半部分——我们可以看到我们在途中使用的两个组，以及所有对应的成员。该表格相当简单，只有一个组名、组成员数量的计数（单独表示组中包含的主机和模板），以及单独列出各个成员。\n\
  \n如图所示，各个成员按以下约定进行颜色编码：\n\n- **Green：** 正常、已启用的主机\n- **Red：** 正常、已禁用的主机\n- **Gray：**\
  \ 模板\n\n让我们创建另一个主机组并分配一些主机。点击 Create host group 按钮。在 Group name 字段中输入 Test group，然后从\
  \ Other hosts 列表框上方的 Group 下拉菜单中选择 Linux servers。从过滤后的列表中，选择我们自定义创建的主机：A test host\
  \ 和 Another host。你可以使用 Ctrl 和 Shift 键选择多个条目。选择这些主机后，点击 ◄ 按钮。\n\n现在，从 Group 下拉菜单中选择\
  \ SNMP devices 并选择 SNMP device；然后再次点击 ◄ 按钮：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_185_0.png)\n\
  \n此表单允许在创建新组时轻松选择任意数量的主机以添加。你可以自由地在两个框之间移动主机，直到对结果满意为止。完成后，点击 Add。\n\n现在列表中会出现一个新组。如你所见，它包含我们刚刚添加的三个主机：\n\
  \n| Test group | Hosts 3 | Templates | Another host, A test host, SNMP device |\n\
  \n但等等！Linux servers 和 SNMP devices 组各有两个主机：\n\n| Linux servers | Hosts 2 | Templates\
  \ | Another host, A test host |\n| SNMP devices | Hosts 2 | Templates | SNMP device,\
  \ snmptraps |\n\n对，我们忘记添加 **snmptraps** 主机了。将鼠标光标移至其上方——注意这个（以及此页面上的每个其他主机）都是一个链接。点击它将带你进入主机详细信息，因此现在就这样做。正如我们在主机编辑表单上看到的那样，它已经在一个组中：**SNMP\
  \ devices**。在 **Other groups** 列表框中点击 **Test group**，然后点击 ◀ 按钮：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_186_0.png)\n\
  \n完成后，点击 **Update**。\n\n你现在可能已经猜到了，一个主机可以属于任意数量的组。这允许你基于任意决定进行分组，例如将单个主机放在名为 **Linux\
  \ servers**、**Europe servers** 和 **DB servers** 的组中。\n\n现在，我们回到了主机列表，因此通过导航到 **Configuration\
  \ | Host groups** 返回主机组列表。**Test group** 包含四个主机，正如它应该的那样。假设你想禁用一整组主机，甚至是多个主机组。也许你有一组已退役的主机，但你暂时不想删除它们，或者也许你想在\
  \ Zabbix 服务器上创建实际的生产配置时禁用为测试创建的主机。组列表提供了一种轻松执行此操作的方法：标记 **Linux servers** 和 **SNMP\
  \ devices** 条目旁边的复选框，点击列表底部的 **Disable hosts** 按钮，并确认弹出窗口。\n\n执行此操作后，所有绿色主机都应该消失——它们现在应该是红色的，表示它们处于禁用状态。\n\
  \n这次，你也可以只标记 **Test group** 旁边的复选框，因为 **Linux servers** 和 **SNMP devices** 是 **Test\
  \ group** 的子集，最终效果会相同。执行此操作后，我们应该记住 **snmptraps** 是一个通用的 SNMP 陷阱接收主机，可能应该保持启用状态。再次点击它以打开主机详细信息编辑页面。\n\
  \n在主机详细信息页面打开时，我们可以快速查看接口部分。如你所见，有四种不同的接口类型可用。对于每种类型，都提供了一个 IP 和 DNS 字段，以及用于从服务器端发起检查的\
  \ Connect to 控件。我们已经使用过 Agent 和 SNMP 接口。当使用这些协议配置监控时，我们还将使用 IPMI 和 JMX 接口。\n\n标记\
  \ Enabled 复选框并点击 Update：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_187_0.png)\n\
  \n你现在应该会看到一个主机列表，其中有一个已禁用的主机（在 STATUS 列中用红色文字显示为 Disabled）和一个已启用的主机（在 STATUS 列中用绿色文字显示为\
  \ Enabled）。让我们重新启用 SNMP device——点击它旁边的 Disabled 文本并确认弹出窗口。这使我们在列表中剩下两个已启用的设备。从 Group\
  \ 下拉菜单中选择 Linux servers，标记两个仍被禁用的主机旁边的复选框，点击列表底部的 Enable 按钮，并确认弹出窗口。最后，我们又回到了所有主机都已启用的状态。我们在这里使用了四种方法来更改主机状态：\n\
  \n- 在 Configuration | Host groups 区域更改整个组的状态\n- 使用该主机属性页面中的 Enabled 复选框更改单个主机的状态\n\
  - 使用主机配置列表中 STATUS 列的每个主机的控件更改单个主机的状态\n- 通过标记主机配置列表中的相关复选框并使用列表底部的按钮来更改单个主机或多个主机的状态\n\
  \n我们之前通过组配置屏幕创建了主机组。正如你可能记得的，另一种方法是使用创建或编辑主机时使用的 New group 字段——这会创建组并同时将主机添加到该组。\n\
  \n配置屏幕上的主机列表在另一个方面也很有用。它提供了一种快速简便的方式来查看哪些主机宕机。虽然监控部分为我们提供了有关特定服务状态和每个设备状况的相当广泛的信息，但有时你会想要快速查看设备状态，例如确定特定组中所有设备的可用性，例如打印机、路由器或交换机。配置以一个几乎没有其他信息分散注意力的列表提供此信息。如果我们现在从\
  \ **Group** 下拉菜单中选择 **All**，我们将看到此安装的所有主机：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_188_0.png)\n\
  \n这次，我们感兴趣的是两列：**STATUS** 和 **AVAILABILITY**。从之前的屏幕截图中，我们可以看到我们有一个未被监控的主机，此信息很容易注意到——以红色打印，与通常的绿色条目形成鲜明对比。**AVAILABILITY**\
  \ 列显示 Zabbix 确定的每个主机和轮询项目类型的内部状态。如果 Zabbix 尝试从主机获取数据但失败，则该主机对此特定类型信息的可用性被确定为缺失，就像这里\
  \ **Another host** 发生的那样。可用性状态和错误消息对于 Zabbix 服务器轮询的以下四种单独的项目类型都得以保留：\n\n- Zabbix\
  \ agent (passive)\n- SNMP\n- JMX\n- IPMI\n\n另一方面，snmptraps 主机对于所有轮询的项目类型来说可用性未知，因为\
  \ Zabbix 从未尝试从它检索任何数据（即，没有为它配置 Zabbix 服务器轮询的项目）。同样，未知和不可用的主机在视觉上与可用的主机不同，提供快速概览。\n\
  \n\n\n\n> 请记住，主机列表中的可用性图标仅代表被动 Zabbix agent 项——主动项完全不会影响它。如果一台主机只有主动项，该图标将保持灰色。如果您添加了失败的被动项然后全部将其转换为主动项，图标应恢复为灰色。这是\
  \ Zabbix 3.0 中的改进；在之前的版本中，图标会一直保持红色。\n\n可用性信息更面向 Zabbix 管理员——它显示的是从主机收集数据相关的问题，而不是诸如资源使用、进程状态或性能指标等信息。\n\
  \n到此为止，Zabbix 中主机和主机组的管理就基本介绍完了。不过主机组的用途在前端管理之外还延伸了一点——我们将在本章后面讨论权限时，具体了解其如何发挥作用。\n\
  \n## 主机清单\n\n我们已经了解了如何管理主机，但主机属性中有一个区域值得更深入地查看。前往 **Configuration | Hosts**，并确保在\
  \ **Group** 下拉菜单中已选择 **Linux servers**。然后，点击 **A test host**，并切换到 **Host inventory**\
  \ 选项卡。默认情况下，清单设置为 **Disabled**：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_189_0.png)\n\
  \n### 手动编辑清单数据\n\n点击 **Manual** 以启用清单字段。注意字段很多，从类型、名称、操作系统、硬件等简单信息开始，到硬件维护日期、位置数据和联系人信息结束。在\
  \ **Type** 字段中输入 **test**，然后点击 **Update**：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_189_1.png)\n\
  \n现在点击 Another host，切换到 Host inventory 选项卡，并点击 Manual。然后，再次在 Type 字段中输入相同的 test\
  \ 字符串。点击 Update。现在，让我们在 Group 下拉菜单中切换到 SNMP devices。勾选列表中两个主机旁边的复选框，然后点击底部的 Mass\
  \ update。在 Mass update 表单中，切换到 Inventory 选项卡并勾选 Inventory mode 旁边的复选框。切换到 Manual，勾选\
  \ Type 旁边的复选框，并在该字段中输入 snmp：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_190_0.png)\n\
  \n点击 Update。清单数据已填充一些内容后，让我们前往 Inventory | Overview。从 Group 下拉菜单中选择 All，并从 Grouping\
  \ by 下拉菜单中选择 Type。注意我们可以看到该字段的所有可用值以及每个值的 hosts 数量：\n\n| TYPE | HOST COUNT |\n|------|------------|\n\
  | test | 2 |\n| snmp | 2 |\n\n点击 HOST COUNT 列中 snmp 旁边的数字 2。在这里，我们可以看到各个主机和一些清单字段，包括我们使用的\
  \ TYPE 字段：\n\n| HOST ▲ | GROUP | NAME | TYPE | OS | SERIAL NUMBER A |\n|--------|-------|------|------|----|-----------------|\n\
  | SNMP device | SNMP devices, Test group |  | snmp |  | |\n| snmptraps | SNMP devices,\
  \ Test group |  | snmp |  | |\n\n此列表已过滤，仅显示 Type 字段中包含确切字符串 snmp 的主机。您可以通过查看过滤器来验证这一点：\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_190_1.png)\n\n收起过滤器并点击 **HOST** 列中的 **SNMP\
  \ device**。这将打开主机概览页面，显示一些基本配置信息。值得注意的是，这里显示了主机接口。虽然没有主机配置权限的用户无法在配置部分打开主机属性，但他们可以通过这种方式看到主机概览页面并查看主机接口：\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_191_0.png)\n\n在此表单底部还有两行链接：**Monitoring**\
  \ 和 **Configuration**。正如预期的那样，它们提供了快速访问该主机的各种监控和配置部分，与我们在 *Chapter 2, Getting Your\
  \ First Notification* 中讨论的全局搜索类似。点击 **Host name** 将提供访问全局脚本的入口。我们将在 *Chapter 7,\
  \ Acting upon Monitored Conditions* 中探索和配置这些脚本。\n\n让我们返回 **Configuration | Hosts**\
  \ 并点击 **SNMP device**。切换到 **Host inventory** 选项卡，并在 **OS** 字段中输入 Linux (`http://www.kernel.org`)\
  \ 并点击 **Update**。这次让我们直接前往 **Inventory | Hosts**——注意这是我们从清单概览点击主机计数后到达的页面。查看 **OS**\
  \ 列，我们可以看到 Zabbix 识别了 URL 并使其可点击：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_191_1.png)\n\
  \n> 此时，此页面上显示的列无法自定义。\n\n这允许您链接到提供更多信息或各种设备的 Web 管理界面的网站。请注意，除了识别 URL 外，字段不会以任何方式被解释；例如，Location\
  \ latitude 和 Location longitude 字段只是文本字段。\n\n### 自动填充清单数据\n\n手动填充的清单数据很有用，但在大规模操作时可能并不切实可行。Zabbix\
  \ 也可为我们自动收集一些清单值。这是因为任何项都可以填充任何清单字段。我们将使用现有的一个项并创建一个新的项来自动填充两个清单字段。\n\n让我们先添加新项。导航到\
  \ Configuration | Hosts，从 Group 下拉菜单中切换到 Linux servers，并点击 A test host 的 Items。然后，点击\
  \ Create item。填写以下值：\n\n- Name: The full OS name\n- Key: system.uname\n- Type of\
  \ information: Text\n- Update interval: 300\n\n完成后，点击底部的 Add 按钮。让我们修改另一个项以将数据放入另一个清单字段。点击\
  \ Zabbix agent version，然后从 Populates host inventory field 下拉菜单中选择 Software application\
  \ A，并点击 Update。我们现在有两个项配置为将数据放入清单字段，但仅凭这一点不会产生任何效果——我们的清单设置为手动模式。从项列表上方的导航栏中，点击\
  \ A test host 并切换到 Host inventory 选项卡。然后，选择 Automatic。注意有些变化——这里的几个字段被禁用了，并在其右侧出现了链接：\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_192_0.png)\n\n这些是我们之前在项配置期间选择的字段。链接显示哪些项应填充这些字段，并允许方便地访问这些项的配置。请注意，我们之前手动填充的字段\
  \ Type 并未丢失值。实际上，自动模式可以说是一种混合模式。配置为自动获取值的字段会这样做；其他字段可以手动填充。点击 Update。\n\n项的值会在项获取新值时放置到清单中。对于完整的\
  \ OS 版本项，我们设置的间隔相对较低：300 秒。而 agent 项则间隔很大。这意味着在该清单字段中出现值之前，我们可能需要等待很长时间。为了更快地实现这一点，请在\
  \ A test host 上重启 agent。\n\n我们选择的清单字段 Software application A 并不是很具代表性，但目前无法自定义清单字段。如果您的数据与现有清单字段不匹配，您必须选择最合适的——或者只是使用与实际数据关系不大的字段。\n\
  \n有两个项的值应放置到清单字段中，让我们返回 Inventory | Overview 并从 Grouping by 下拉菜单中选择 Software application\
  \ A。这应该只显示一个主机，对应 agent 版本 3.0.0。点击 HOST COUNT 列中的 1，您应该可以看到，正如预期的那样，它是 A test host。尽管我们选择的列未在当前视图中列出。点击\
  \ HOST 列中的 A test host 并切换到 Details 选项卡：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_193_0.png)\n\
  \n在这里，我们可以看到来自 system.uname 项的系统信息和来自 agent.version 项的 agent 版本。\n\n我们使用了清单部分的概览和主机页面。概览对于查看按清单字段划分的主机分布很有用。主机页面允许在按主机组过滤和按单个清单字段过滤的同时查看各个主机。当我们最终到达主机页面时，过滤器已为我们预设为匹配确切字段值，但我们也可以搜索子字符串。例如，如果我们有系统，其\
  \ OS 信息包含 CentOS 5.5 和 CentOS 6.2，我们可以仅按 CentOS 过滤，获得所有 CentOS 系统的列表，无论它们运行的确切版本是什么。\n\
  \n\n\n\n\n有时能够在前端访问库存数据是有用的，但可能更希望更快、更方便地访问。库存数据也可以包含在通知中。例如，发送的电子邮件可以包含系统位置、系统出现问题时应联系的人员，以及一些序列号等其他信息。我们将在第\
  \ 7 章《Acting upon Monitored Conditions》中讨论通知。\n\n## Host maintenance\n\n我们希望尽快知道问题，总是如此。好吧，并非总是如此——在我们测试故障转移或重新配置存储阵列时就会出现这种情况。还有维护——事情极有可能在此时中断，我们不希望向我们的账户或其他人发送大量电子邮件、短信和其他信息。Zabbix\
  \ 提供了主机组和主机级别的维护功能，使我们能够在维护期间避免过度的消息发送。\n\n主机处于维护状态可能导致三个主要后果：\n\n- 这些主机的数据不会被收集\n\
  - 这些主机的告警会被隐藏或在前端中不显示\n- 这些主机的告警不会被处理\n\n这些后果也可以根据主机组、主机和其他因素进行相当详细的自定义。我们将在本章中探讨其中大部分自定义可能性，除了告警处理——我们将在第\
  \ 7 章《Acting upon Monitored Conditions》中讨论该内容。\n\n## Creating maintenance periods\n\
  \n我们将创建几个维护周期，并看看它们如何影响前端中的多个视图。我们将讨论可用的时间段选项并设置两个不同的维护周期：\n\n- 一个不会影响数据收集的周期\n\
  - 一个停止数据收集的周期\n\n> 在使用维护周期之前，请确保为 PHP 和 Zabbix 服务器主机配置的时区匹配。否则，前端中显示的时间将与实际维护发生的时间不同。\n\
  \n## Collecting data during maintenance\n\n导航到 **Configuration | Maintenance** 并点击\
  \ **Create maintenance period**。在 resulting 表单中，填写以下值：\n\n- **Name:** 输入 `Normal\
  \ maintenance`\n- **Active since:** 确保此项设置为当前日的开始或更早\n- **Active till:** 确保此项设置为一年或更久的未来\n\
  - **Description:** 输入 `We keep data during this maintenance`\n\n![](img/f5313a804532fabacc8d07cc8607eeba_195_0.png)\n\
  \n怎么回事，我们真的要创建一个为期一年的维护周期吗？并非如此。切换到 **Periods** 选项卡。\n\n这里，Zabbix 的术语有点令人困惑。主选项卡具有\
  \ since–till 字段，允许我们设置可称为主周期的内容。**Periods** 选项卡允许我们添加单独的周期，我们可以称它们为子周期。Zabbix 中的任何维护条目都必须至少定义一个子周期。Zabbix\
  \ 中的维护在主周期与子周期重叠时处于活动状态。让我们再重复一遍：\n\n> Maintenance in Zabbix is active when the\
  \ main period overlaps with the subperiods.\n\n解决了问题——缺失的主机或主机组——让我们再次点击 **Add**。维护条目应出现在列表中：\n\
  \n| NAME | TYPE | ACTIVE SINCE | ACTIVE TILL | STATE | DESCRIPTION |\n|---|---|---|---|---|---|\n\
  | Normal maintenance | With data collection | 2016-03-23 00:00 | 2017-03-24 00:00\
  \ | Active | We keep data during this maintenance |\n\n> 重复多次提醒点击小 Add 链接并非没有原因——很容易忘记点击它，从而在某些情况下错过更改。例如，如果你在添加第二个子周期时忘记点击小链接，它将被静默丢弃。注意其他表单中类似的陷阱。\n\
  \n维护条目添加后，让我们尝试看看这对前端中的几个部分有何影响。在控制台中运行以下命令：\n\n```\n$ cat /dev/urandom | md5sum\n\
  ```\n\n导航到 **Monitoring | Triggers** 并等待触发器触发。当它出现时，查看 **HOST** 列——这次有一个橙色的扳手指示器。这表明该主机的维护目前处于活动状态。将鼠标光标移到此指示器上：\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_197_0.png)\n\n> 你可以点击指示器以保持消息打开，就像 Zabbix\
  \ 中其他弹出消息一样。\n\n## Managing Hosts, Users, and Permissions\n\n该消息显示了我们使用的维护名称：**Normal\
  \ maintenance**。它还告诉我们，此维护配置为继续收集数据，并在下方显示了维护的描述。这使我们能够轻松地向其他用户说明此维护正在进行的原因。仍在触发器页面上，查看过滤器。注意\
  \ **Show hosts in maintenance** 复选框默认被标记。取消标记它并点击 **Filter**。**A test host** 的所有问题都应消失——至少在这个视图中是如此。为了避免以后混淆，标记该复选框并再次点击\
  \ **Filter**。记住，大多数过滤选项会在访问特定页面时被记住，因此如果我们将其保持标记，后续在此视图中将看不到维护中的主机。\n\n让我们检查一下主机处于维护状态时另一个页面看起来如何。导航到\
  \ **Monitoring | Dashboard** 并检查 **Last 20 issues** 小部件：\n\n| HOST | ISSUE | LAST\
  \ CHANGE | AGE | INFO | ACK | ACTIONS |\n|---|---|---|---|---|---|---|\n| A test\
  \ host \U0001F527 | CPU load too high on A test host for last 3 minutes | 2016-03-23\
  \ 02:55:55 | 6m 33s |  | No |  |\n\n*Last 20 issues — 1 of 1 issue is shown; Updated:\
  \ 03:02:28*\n\n处于维护中的主机在此以相同方式表示。同样，将鼠标光标移到橙色图标上会显示维护名称、类型和描述。我们也可以从仪表板中隐藏维护中的主机——点击右上角的扳手图标以打开仪表板过滤器。在过滤器中，点击顶部的\
  \ **Disabled**，然后取消标记 **Show hosts in maintenance** 复选框：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_198_0.png)\n\
  \n完成后，点击 **Update**。注意问题已从 **Last 20 issues** 小部件中消失。再次点击扳手图标（现在有一个绿色点表示此过滤器处于活动状态），点击\
  \ **Enabled** 以禁用它，然后点击 **Update**。\n\n维护状态也可以在其他前端部分中看到。我们将在 *Chapter 9, Visualizing\
  \ the Data with Graphs and Maps.* 中回顾其中的一些。\n\n我们创建并检查了一个维护条目。在此维护期间，我们的主机数据仍在被收集，触发器正在检查该数据。状态在前端中显示，我们可以选择隐藏处于维护中的主机。现在，让我们尝试做一些不同的事情——维护也停止数据传入。\n\
  \n## Not collecting data during maintenance\n\n导航到 **Configuration | Maintenance**\
  \ 并点击 **Create maintenance period**。在 resulting 表单中，填写以下值：\n\n- **Name:** 输入 `Maintenance\
  \ with all data dropped`\n- **Maintenance type:** 选择 **No data collection**\n- **Active\
  \ since:** 确保此项设置为当前日的开始或更早\n- **Active till:** 确保此项设置为一年或更久的未来\n- **Description:**\
  \ 输入 `We don't need no data`\n\n![](img/f5313a804532fabacc8d07cc8607eeba_199_0.png)\n\
  \n## Managing Hosts, Users, and Permissions\n\n切换到 **Periods** 选项卡并点击 **New**。在\
  \ **Date** 字段中，将日期和时间设置为当前值：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_200_0.png)\n\
  \n点击小 **Add** 链接——再次，先点击它，而不是 **Add** 按钮。现在，切换到 **Hosts & Groups** 选项卡。确保 **Other\
  \ hosts** 部分中的 **Group** 下拉菜单显示 **Linux servers**，并选择 **Another host**。然后，点击该按钮。现在，点击大\
  \ **Add** 按钮。列表中现在应有两个维护条目：\n\n| NAME | TYPE | ACTIVE SINCE | ACTIVE TILL | STATE\
  \ | DESCRIPTION |\n|---|---|---|---|---|---|\n| Maintenance with all data dropped\
  \ | No data collection | 2016-03-23 00:00 | 2017-03-24 00:00 | Active | We don't\
  \ need no data |\n| Normal maintenance | With data collection | 2016-03-23 00:00\
  \ | 2017-03-24 00:00 | Active | We keep data during this maintenance |\n\n转到 **Monitoring\
  \ | Latest data**，并确保在过滤器的 **Host groups** 字段中选择了 **Linux servers**。注意 **Another\
  \ host** 中的项目数据已停止传入——时间戳不再更新。这是因为我们创建的无数据收集维护。正因如此，触发器不会触发，并且此类主机的告警不会出现在前端中，无论过滤器设置如何。\n\
  \n让我们快速查看一下 **Configuration | Hosts**。这是可以看到维护状态的另一个位置。处于维护中的主机将在 **STATUS** 列中列出\
  \ **In maintenance**——这取代了正常的 **Enabled** 文本：\n\n| NAME | APPLICATIONS | ITEMS |\
  \ TRIGGERS | GRAPHS | DISCOVERY | WEB | INTERFACE | TEMPLATES | STATUS |\n|---|---|---|---|---|---|---|---|---|---|\n\
  | Another host | Applications | Items 12 | Triggers | Graphs | Discovery | Web |\
  \ 192.168.56.11:10050 |  | In maintenance |\n\n我们发现了维护如何影响数据收集和问题的显示。另一个重要原因是跳过或修改通知。我们将在\
  \ *Chapter 7, Acting upon Monitored Conditions.* 中讨论通知。\n\n\n\n\n\n## 维护周期选项\n\n\
  到目前为止，我们使用的唯一类型的维护子周期是一次性维护。我们决定将那些在单独标签页中配置的周期称为“子周期”，以区别于在第一个标签页 Maintenance 中配置的主周期。我们还发现，维护仅在主周期与子周期重叠的时间段内处于活动状态。但为什么要重复定义同样的东西；一次性周期不能是唯一需要指定的内容吗？主周期的好处在配置重复性维护时变得更加明显，因此让我们探索一下子周期可用的选项。您可以导航到\
  \ Configuration | Maintenance，开始创建新的维护，并在我们探索它们时尝试可用的子周期。\n\n### 仅一次性维护\n\n这就是我们已经使用过的维护子周期类型。它从指定的日期和时间开始，按指定的分钟、小时和天数持续，然后结束。此类型的子周期仍必须与主周期重叠。\n\
  \n### 每日维护\n\n对于每日维护，我们必须指定开始时间和维护周期的长度：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_201_0.png)\n\
  \n在主周期期间，维护将在每天指定的时间开始。它将每天开始，Every day(s) 选项设置为默认值 1。我们可以更改此设置，使维护每隔一天、每三天等才发生。\n\
  \n### 每周维护\n\n对于每周维护，我们必须指定开始时间和维护周期的长度，与每日维护相同：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_202_0.png)\n\
  \n我们还必须选择维护将在一周中的哪些天进行——可以选一个或多个。在主周期期间，维护将在每周指定的星期几的指定时间开始。它将每周开始，Every week(s)\
  \ 选项设置为默认值 1。我们可以更改此设置，使维护每隔一周、每三周等才发生。\n\n### 每月维护\n\n每月维护有两种模式：\n\n- 按日（或按日期）\n\
  - 按星期几\n\n对于这两种模式，我们必须指定开始时间和维护周期的长度，与每日和每周维护模式相同。此外，我们必须选择维护将在哪些月份进行——可以选一个或多个。在按日或按日期模式下（选项\
  \ Date 设置为 Day），我们必须在 Day of month 字段中输入一个日期。维护将在我们选择的每个月的该日期发生：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_203_0.png)\n\
  \n在按星期几模式下（选项 Date 设置为 Day of week）我们必须选择维护将在一周中的哪些天进行——可以选一个或多个：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_203_1.png)\n\
  \n由于这必须按月而不是按周发生，我们还必须选择这将在所选月份中的第一个、第二个、第三个、第四个或最后一个此类工作日发生：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_204_0.png)\n\
  \n除此之外，我们还可以要求 Zabbix 在所选月份的最后一个此类日期运行此维护，例如，每年四月、八月和十二月，在当月的最后一个星期三运行维护。\n\n使用所有这些重复性维护模式，可以创建几乎任何场景——可能缺少的一点是能够在每个月的最后一天运行每月维护。\n\
  \n因此，有这种双重配置的好处，即主周期与子周期之间的重叠，是我们可以拥有一个从未来某个时间点开始然后在稍后某个时间点完全自动停止的重复性维护——我们不必在特定日期记住添加和删除它。\n\
  \n### 临时维护\n\nZabbix 中的维护功能旨在面向维护始终提前规划的良好规划环境。实际上，人们经常希望快速将主机置于维护状态，然后稍后手动将其移除。考虑到维护条目所需的周期和其他内容，这还不够快。一个有点取巧的变通方法是创建一个始终处于活动状态的新主机组和维护周期（确保将结束日期设置得足够远）。将该主机组包含在维护条目中，然后，将主机添加到所选主机组将使该主机进入维护状态。当然，之后必须记住将主机从主机组中移除。\n\
  \n## 用户、用户组和权限\n\n主机管理监控实体（主机）信息，并用于对基本信息收集单元——项目——进行分组。Zabbix 中的用户账户控制对监控信息的访问。\n\
  \n### 身份验证方法\n\n在查看更详细的用户配置之前，了解 Zabbix 支持三种身份验证方法可能会有所帮助。导航到 **Administration |\
  \ Authentication** 查看身份验证配置：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_205_0.png)\n\
  \n如图所示，这三种身份验证方法为：\n\n- **HTTP：** 用户使用 Web 服务器 HTTP 身份验证机制进行身份验证。HTTP 身份验证的支持基本上允许使用\
  \ Web 服务器支持的任何身份验证方法用于 Zabbix，而在 Apache HTTPD 守护进程的情况下，有很多。\n- **LDAP：** 用户使用 LDAP\
  \ 服务器进行身份验证。如果所有需要访问 Zabbix 的企业用户都已在 LDAP 结构中定义，这会很方便。仅验证用户密码；组 membership 和其他属性不使用。登录成功还必须存在\
  \ Zabbix 用户账户。\n- **Internal：** 使用此方法，用户使用 Zabbix 内部的用户和密码存储进行身份验证。我们将使用此方法。\n\n\
  ### 创建用户\n\n初始 Zabbix 安装不包含许多预定义用户——让我们查看用户列表。导航到 Administration | Users：\n\n| ALIAS\
  \ ▲ | NAME | SURNAME | USER TYPE | GROUPS | IS ONLINE? | LOGIN | FRONTEND ACCESS\
  \ | DEBUG MODE | STATUS |\n|---|---|---|---|---|---|---|---|---|---|\n| Admin |\
  \ Zabbix | Administrator | Zabbix Super Admin | Zabbix administrators | Yes (2016-03-24\
  \ 12:15:03) | Ok | System default | Disabled | Enabled |\n| guest |  |  | Zabbix\
  \ User | Guests | No (2016-03-23 02:35:08) | Ok | System default | Disabled | Enabled\
  \ |\n\n没错；只定义了两个用户账户：Admin 和 guest。我们一直以 Admin 身份登录。另一方面，guest 用户用于未通过身份验证的用户。在我们以\
  \ Admin 身份登录之前，我们是 guest。用户列表显示了用户的基本信息，例如他们所属的组、是否已登录、上次登录时间以及其账户是否已启用。\n\n> 通过向\
  \ guest 用户授予访问权限，可以允许匿名访问资源。\n\n让我们为自己创建另一个用户。点击右上角的 Create user 按钮。我们将在填写适当内容的同时查看用户账户的所有可用选项：\n\
  \n- Alias：输入 monitoring_user。这本质上是一个用户名。\n- Name：输入 monitoring。在此字段中，您通常输入用户的真实姓名。\n\
  - Surname：输入 user。显然，此字段通常包含用户的真实姓氏。\n- Groups：与主机一样，用户账户也可以分组。用户必须至少属于一个组，因此让我们至少暂时将新用户分配到某个组。点击\
  \ Groups 字段旁边的 Add 按钮，并选中 Zabbix administrators 旁边的复选框。然后，点击 Select：\n- Password：选择并输入密码，然后在下一个字段中重新输入。\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_206_0.png)\n\n\n\n\n\n- **Language:**\
  \ 前端有不同成熟度的翻译，每个用户都可以选择自己的偏好。我们将其保留为 **English (en_GB)**：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_207_0.png)\n\
  \n> 如果您想使用的语言未列出，它可能仍然存在，只是未完成。有关如何启用它并为 Zabbix 翻译做出贡献的更多详细信息，请参阅 *附录 B, 成为社区的一部分*。\n\
  \n- **Theme:** Zabbix 前端支持主题。目前，仅包含两种主题。我们将主题保留为 **System default**（即 **Blue**）：\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_207_1.png)\n\n- **Auto-login:** 勾选此选项将在用户至少手动登录一次后自动登录用户。自动登录使用浏览器\
  \ cookie 执行。我们不会为此用户使用自动登录。\n- **Auto-logout:** 您可以使特定账户在一段时间内无活动后自动注销。可以设置的最短时间是\
  \ 90 秒，最长约为 166 分钟。此处无需设置自动注销。\n\n> 此外，在撰写本文时，此选项无法按预期工作，不应依赖它。\n\n- **Refresh:**\
  \ 这是 **Monitoring** 部分中页面刷新之间的时间间隔，以秒为单位。虽然在首次设置时，较小的值看起来可能很不错，并且项目检查间隔较短，但它们会 somewhat\
  \ 增加服务器负载，并且如果页面包含大量信息，则有时甚至在下一次刷新开始之前页面都无法完成加载。让我们将此用户设置为 60——毕竟，在测试某些内容时，他们始终可以手动刷新。请注意，有些页面不会执行完整的页面刷新；相反，它们只重新加载该页面上的某些元素。例如，图表页面只重新加载图表图像。\n\
  - **Rows per page:** 每个用户都可以拥有单独的最大每页行数设置。如果返回的数据超过此参数，界面会将数据拆分为多个页面。我们不会更改此参数。\n\
  - **URL (after login):** 用户可能希望在登录后始终查看特定页面——无论是概览、触发器列表还是其他任何页面。此选项允许用户自定义该行为。输入的\
  \ URL 相对于 Zabbix 目录，因此让我们在此处输入 `tr_status.php`，使此用户在登录时始终看到 **Monitoring | Triggers**。\n\
  \n最终结果应如下所示：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_208_0.png)\n\n如果确实如此，请点击底部的\
  \ **Add** 按钮。\n\n现在，最好测试一下这个新用户。建议您为此测试启动另一个浏览器，以便任何更改都易于观察。让我们将您已登录管理员用户的浏览器称为“Browser\
  \ 1”，另一个称为“Browser 2”。在 Browser 2 中，打开 Zabbix 页面并以 monitoring_user 身份登录，提供之前输入的密码。打开的不是仪表板，而是\
  \ **Monitoring | Triggers** 页面。\n\n此外，页面与之前明显不同——主菜单条目 **Configuration** 和 **Administration**\
  \ 在这里不见了。尽管 **Host** 和 **Group** 下拉菜单都设置为 **All**，但看不到任何问题，并且下拉菜单本身也不包含任何主机或主机组。转到\
  \ **Monitoring | Overview**。**Group** 下拉菜单设置为全部，但 **Details** 视图声称 **No data found**。为什么会这样？\n\
  \n默认情况下，用户无法访问任何系统。当我们的新用户登录时，监控部分中没有任何内容显示，因为我们没有授予任何权限，包括只读权限。我们确实将此用户分配给了 **Zabbix\
  \ administrators** 组，但该组默认没有设置任何权限。回到 Browser 1，点击 **ALIAS** 列中的 **monitoring_user**。有一件小事需要注意：这次不是\
  \ **Password** 输入字段，而是一个写着 **Change password** 的按钮可见。如果您必须为某个用户重置密码，点击此按钮将再次显示密码输入字段，从而允许在进行任何其他更改的同时更新密码：\n\
  \n![](img/f5313a804532fabacc8d07cc8607eeba_209_0.png)\n\n但我们仍有一个未使用的标签页：**Permissions**。让我们切换到它。\n\
  \n> 还有一个 **Media** 标签页。在那里，用户可以分配各种媒体，以便 Zabbix 知道如何向他们发出警报。媒体类型包括发送电子邮件的电子邮件地址或发送短信的号码。我们将在\
  \ **第 7 章, Acting upon Monitored Conditions** 中讨论通知功能。\n\n首先要注意的是 **User type**\
  \ 下拉菜单。它提供三种用户类型。我们将此用户的类型保留为 **Zabbix User**：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_209_1.png)\n\
  \n供参考，这些类型的含义如下：\n\n- **Zabbix User**: 这些是普通用户，只能访问 **Main** 菜单中的 **Monitoring**、**Inventory**\
  \ 和 **Reports** 部分\n- **Zabbix Admin**: 这些用户除了前三个部分外，还可以访问 **Configuration** 部分，因此能够重新配置\
  \ Zabbix 的部分内容\n- **Zabbix Super Admin**: 这些用户可以完全访问 Zabbix，包括 **Monitoring**、**Configuration**\
  \ 和 **Administration** 部分\n\n下面是一个看起来非常接近我们所寻找的区域。存在 **Hosts** 和 **Host groups**，分为\
  \ **READ-WRITE**、**READ-ONLY** 和 **DENY** 权限：\n\n![](img/f5313a804532fabacc8d07cc8607eeba_210_0.png)\n\
  \n只有一个问题：没有办法更改这些权限。\n\n页面底部的帮助信息解释了原因。它说 **Permissions can be assigned for user\
  \ groups only.**\n\n我们很方便地跳过了添加或配置任何组和权限的步骤，现在是修复它的好时机。\n\n## Creating user groups\n\
  \n我们不会修改默认的用户组，而是添加自己的组。导航到 Administration | User groups，并查看当前用户组的列表：\n\n| NAME\
  \ ▲ | # | MEMBERS | FRONTEND ACCESS | DEBUG MODE | STATUS |\n|---|---|---|---|---|---|\n\
  | Disabled | Users |  | System default | Disabled | Disabled |\n| Enabled debug\
  \ mode | Users |  | System default | Enabled | Enabled |\n| Guests | Users 1 | guest\
  \ | System default | Disabled | Enabled |\n| No access to the frontend | Users |\
  \  | Disabled | Disabled | Enabled |\n| Zabbix administrators | Users 2 | Admin\
  \ (Zabbix Administrator), monitoring_user (monitoring user) | System default | Disabled\
  \ | Enabled |\n\n如您所见，已经有一些预定义组，可以让您了解用户如何组织。这种组织可以基于系统类别、系统、管理角色、物理位置等。例如，您可能在总部有一组管理员，在分支机构也有一些管理员。每个组可能对另一个位置的\
  \ UPS 状态不感兴趣，因此您可以将它们分组为 HQ 管理员和 Branch 管理员。用户可以属于任意数量的组，因此您可以根据实际条件创建各种方案。\n\n\
  让我们为我们的用户创建一个新组。点击右上角的 Create user group。让我们填写表单并了解每个控件的作用：\n\n- **Group name:**\
  \ 输入 Our users。\n- **Users:** 在这里，我们可以将用户添加到我们正在创建的组中。我们当前的安装只有很少的用户，因此在显示所有用户的情况下找到正确的用户名很容易。如果我们有很多用户，我们可以使用\
  \ Other groups 下拉菜单来过滤用户列表，更容易找到我们要找的内容。选择 monitoring_user 并点击 ◄ 按钮。\n- **Frontend\
  \ access:** 此选项允许我们为特定组选择身份验证方法。它允许一种配置，其中大多数用户针对 LDAP 进行身份验证，但某些用户针对内部用户数据库进行身份验证。它还允许我们为某些组设置无\
  \ GUI 访问，这可以用于仅需要接收通知的用户。我们将此选项保留为 System default。\n\n\n\n\n如果您的 Zabbix 安装使用 LDAP\
  \ 进行用户认证，那么将用户组的“前端访问”设置为“内部”将导致该组中的所有用户都使用 Zabbix 内部密码存储进行认证。这不是故障转移选项——内部认证将始终被使用。如果您希望为不在\
  \ LDAP 目录中的用户提供访问权限，或者希望在 LDAP 宕机时创建可以从保险柜中取出的紧急账户，这将非常有用。这种方法对 HTTP 认证不起作用，因为 HTTP\
  \ 认证发生在 Zabbix 对认证后端做出任何决定之前。\n\n![](img/f5313a804532fabacc8d07cc8607eeba_212_0.png)\n\
  \n- **启用**：通过这一个选项，可以禁用或启用该组中的所有用户。正如预定义组可能告诉您的那样，这是一种很好的方法，可以通过简单地将用户添加到未勾选此复选框的组中，轻松禁用单个用户账户。我们希望我们的用户能够登录，因此此选项将保持选中状态。\n\
  - **调试模式**：此选项允许用户访问前端调试信息。它主要对 Zabbix 开发人员有用。我们将在附录 A“故障排查”中讨论调试模式。\n\n在介绍了主要设置之后，让我们切换到“权限”选项卡：\n\
