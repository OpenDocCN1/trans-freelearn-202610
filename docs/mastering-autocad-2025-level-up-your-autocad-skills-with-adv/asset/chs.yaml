- "# 使用AutoCAD Web\n\n在前面的章节中，你学习了如何使用属性和动态块，以及如何共享图形。你还学习了如何比较DWG文件和外部参照文件（Xrefs）。现在，你和你的CAD团队可能需要就某个图形文件进行协作，以进一步推进设计。这就是你可以利用AutoCAD\
  \ Web和云的地方。\n\nAutoCAD是一款基于订阅的应用程序。该订阅附带AutoCAD Web产品，其中包含AutoCAD Web应用程序和AutoCAD移动应用程序。这两个应用程序都允许在云中进行DWG文件协作，AutoCAD移动应用程序利用最新的移动设备（如智能手机和平板电脑）为你的DWG文件增添了完全移动性。本章将教你如何使用AutoCAD\
  \ Web提供无缝的基于云的协作体验，与基于云的DWG文件协作，并使用“图形历史”工具检查当前版本。你还将学习如何将DWG文件保存到云中并将其用于AutoCAD\
  \ Web，以及如何使用AutoCAD Web和移动应用程序。\n\n使用云进行协作不仅会节省大量时间，还可以让你实时即时修改和更改图形。此外，它还是一种非常宝贵的DWG存储资源。\n\
  \n本章涵盖以下使用AutoCAD Web和云的方法：\n\n- 将DWG文件保存到云\n- 使用“图形历史”工具\n- 在AutoCAD Web应用程序中打开和处理图形\n\
  - 在AutoCAD移动应用程序中打开和处理图形\n- 使用在AutoCAD Web或AutoCAD移动应用程序中更新的图形\n\n\n\n\n## 练习文件\n\
  \n在本节中，你必须使用 `New Office Layout.dwg` 练习文件。打开该文件，并确保在“模型”选项卡中显示办公室平面图。\n\n本章将展示来自基于浏览器的\
  \ AutoCAD 版本以及安装在平板电脑（Apple iPad Pro）上的 AutoCAD 移动应用程序的各种图像。请确保你使用自己的 AutoCAD 订阅详细信息访问\
  \ AutoCAD Web。\n\n对于本章而言，并非必须具备安装有 AutoCAD 移动应用程序的移动设备，但如果有并安装它会有所帮助。这将使你能够熟悉相关的移动工作流程。你可以在相应的应用商店中搜索\
  \ AutoCAD 在线版找到该移动应用程序。\n\n## 从 AutoCAD 桌面版将 DWG 文件保存到云\n\nAutoCAD 桌面应用程序允许你使用 AutoCAD\
  \ Web 和移动文件夹将 DWG 文件保存到云。只要你已登录到 AutoCAD 订阅，就可以使用“保存到 Web 和移动设备”（SAVETOWEBMOBILE）命令。\n\
  \nSAVETOWEBMOBILE 命令位于快速访问工具栏（QAT）的左上角，如图 15.1 所示。当你第一次点击它时，系统可能会要求你安装一个驱动程序文件。请确保已安装该驱动程序。它安装速度很快，不会花费很长时间。\n\
  \n![](img/e5541e806f2ef46a4958b6c3d0b346a9_390_0.png)\n\n图 15.1：快速访问工具栏（QAT）上的 SAVETOWEBMOBILE\
  \ 图标\n\n安装完成后，按照以下步骤保存 DWG 文件：\n\n- 1. 点击该图标（并安装驱动程序）后，将显示“保存到 AutoCAD Web 和移动设备”对话框，如图\
  \ 15.2 所示。文件位置显示在对话框顶部（AutoCAD Web 和移动设备：图中箭头所指），首选文件名显示在底部（图中箭头所指）。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_391_0.png)\n\
  \n图 15.2：“保存到 AutoCAD Web 和移动设备”对话框\n\n- 2. 输入首选文件名（此时只需使用 `New Office Layout`），然后点击**保存**。这将把\
  \ DWG 文件保存到为你的 AutoCAD 订阅保留的 `AutoCAD Web & Mobile` 文件夹中的云空间中。\n\n点击**保存**后，图形看起来与你打开的原文件相同，但你当前的图形现在是同文件名的云版本。\n\
  \n查看 AutoCAD 标题栏。你将看到新保存的 DWG 文件有一个很长的路径，如图 *15.3* 所示。该路径是你的 **AutoCAD Web & Mobile**\
  \ 云空间的位置，由你的 AutoCAD 订阅和登录 AutoCAD 时使用的 Autodesk 账户定义。请注意，你的文件路径将与图 *15.3* 中显示的不同，因为它特定于*你*的账户详细信息。\n\
  \n![](img/e5541e806f2ef46a4958b6c3d0b346a9_391_1.png)\n\n图 15.3：保存在云中的 DWG 文件的新文件路径\n\
  \n你的图形现在已保存在云端，可供协作使用。是的，就是这么简单！\n\n你现在知道了将 DWG 文件保存到云端进行协作是多么快速和容易。Autodesk 通过\
  \ AutoCAD Web & Mobile 文件夹提供了一种非常简单的方法。\n\n> **提示与技巧 #35**\n> 还有其他专有云位置可以存储你的 DWG\
  \ 文件以进行协作。AutoCAD 支持 Autodesk Drive、Microsoft OneDrive、Google Drive、Dropbox 和 Box。你还可以使用\
  \ Autodesk Desktop Connector 和 Autodesk Docs 连接文件。使用这些其他云存储方法需要订阅/账户，并将提供一个不同于默认的\
  \ AutoCAD Web & Mobile 文件夹的单独位置。\n\n如果为大型组织或公司工作，他们可能已经拥有企业级的专有云解决方案。Microsoft OneDrive\
  \ 和 Dropbox 在大型公司中很常见，因此请检查这些是否可用，因为你的 CAD 团队其他成员可以轻松访问它们。\n\n> **AutoCAD for Mac**\n\
  > AutoCAD Web & Mobile 文件夹*不*受 AutoCAD for Mac 支持。你必须将 DWG 文件从 Mac 保存到提示与技巧 #35\
  \ 中提到的专有云解决方案之一，例如 Microsoft OneDrive。\n\n## 使用图形历史记录工具\n\n在处理基于云的 DWG 文件时，你需要知道哪个版本的文件是最新的。有时，本地可能存在同文件名的文件版本。这通常需要检查应用于图形的日期和时间戳。这就是为什么要求你将文件的云版本保存为相同文件名的原因。现在你有两个版本的\
  \ New Office Layout.dwg 文件：一个存储在本地，另一个存储在云中。\n\n以下步骤将引导你完成图形历史记录工作流程，使你能够在 AutoCAD\
  \ 中使用图形历史记录功能。这允许你分析同一图形的迭代，并确保你使用的是适当的图形文件版本/修订版。\n\n- 1. 首先打开本地保存的图形版本。然后，使用**从\
  \ Web 和移动设备打开**（*OPENFROMWEBMOBILE*）命令打开 New Office Layout.dwg 文件的云版本。你可以在**快速访问工具栏（QAT）**上找到\
  \ *OPENFROMWEBMOBILE* 命令的图标，如图 15.4 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_393_0.png)\n\
  \n图 15.4：快速访问工具栏（QAT）上的“从 Web 和移动设备打开”（OPENFROMWEBMOBILE）图标\n\n- 2. 现在，AutoCAD 中会有两个读取相同的文件选项卡。此时请注意区分哪个是哪个。首先点击本地保存的\
  \ DWG 文件的文件选项卡，如图 *15.5* 所示。在本例中，本地文件是*左侧*的文件选项卡，你需要点击此文件选项卡使其成为当前 DWG 文件。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_393_1.png)\n\
  \n图 15.5：本地 DWG 文件的文件选项卡被设为当前文件\n\n- 3. 点击功能区上的**视图**选项卡。找到**历史记录**功能区面板，然后点击**活动洞察**，如图\
  \ *15.6* 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_394_0.png)\n\n图 15.6：历史记录功能区面板上的“活动洞察”图标\n\
  \n在 AutoCAD 2025 中，**图形历史记录**（*DWG HISTORY*）现在是**活动洞察**面板的一部分。在较旧版本的 AutoCAD 中，**图形历史记录**是由\
  \ *DWG HISTORY* 命令激活的单独面板。如果你在 AutoCAD 2025 中键入 DWG HISTORY，**活动洞察**面板将自动打开，如图 *15.7*\
  \ 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_394_1.png)\n\n图 15.7：本地保存的 DWG\
  \ 文件的“活动洞察”面板\n\nAutoCAD 2025 中新的**活动洞察**面板已增强，以纳入你的图形历史记录，如**图 15.7** 所示。在那里你可以看到\
  \ DWG 文件的各种迭代，在**图 15.7** 中进行了编号：\n\n- - **1：** 日期、用户或活动\n- - **2：** 文件名\n- - **3：**\
  \ 今天的活动\n- - **4：** 其他相关日期的活动\n\n此外，每次进行关键文件保存时，该保存都会分配给该用户，如面板右侧的圆圈所示（箭头所指）。\n\n\
  - 4. 对另一个文件选项卡（基于云的 DWG 文件）重复*步骤 2 和 3*，你将看到**活动洞察**面板为基于云的 DWG 文件显示稍有不同的信息，如**图\
  \ 15.8** 所示。它还为你提供了连接到 **OneDrive** 的选项（箭头所指）。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_395_0.png)\n\
  \n图 15.8：基于云的 DWG 文件的“活动洞察”面板\n\nAutoCAD 2025 允许你在**活动洞察**面板中检查图形文件的历史记录。其他版本的 AutoCAD\
  \ 在使用 **DWGHistory** 命令时仍具有**图形历史记录**面板。\n\n这两种方法都提供了一种快速简便的方式来检查本地保存文件以及保存在云中的\
  \ DWG 文件的 DWG 版本历史记录。\n\n> **AutoCAD for Mac**\n> \n> **活动洞察**在 AutoCAD for Mac\
  \ 中也可用，提供与 AutoCAD for Windows 相同级别的洞察。\n\n在本节中，你学习了如何在**活动洞察**面板中使用**图形历史记录**。这允许你检查图形文件的最新迭代，并确保你使用的是最新版本。\n\
  \n## 在 AutoCAD Web 应用程序中打开和处理图形\n\n**AutoCAD Web** 是浏览器中的 AutoCAD 和移动设备（无论是智能手机还是平板设备）上的\
  \ AutoCAD 的统称。两个 AutoCAD Web 应用程序都提供了与 AutoCAD 桌面应用程序类似的用户体验，并允许轻松访问和使用基于云的 DWG\
  \ 文件。\n\n本节将向你展示如何使用 AutoCAD Web 通过 Web 浏览器打开和处理 DWG 文件。该示例在最新版本的 Microsoft Edge\
  \ 浏览器中查看和处理，但 AutoCAD Web 也支持其他流行的 Web 浏览器。\n\n让我们通过执行以下步骤开始该过程：\n\n- 1. 打开你的 Web\
  \ 浏览器并导航到 https://web.autocad.com。AutoCAD 网页登录页面如图 *15.9* 所示。请注意，你可以利用页面上的二维码在 Google\
  \ 和 Apple 应用商店下载 AutoCAD 移动应用程序。\n\n\n\n\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_397_0.png)\n\
  \n图15.9：AutoCAD Web应用程序的登录页面\n\n- 2. 使用你的Autodesk账户登录AutoCAD Web应用程序。单击图15.9中箭头所示的“登录”按钮。系统将提示你输入Autodesk账户的用户名和密码。\n\
  \n![](img/e5541e806f2ef46a4958b6c3d0b346a9_399_0.png)\n\n图15.11：在AutoCAD Web应用程序中打开的DWG文件\n\
  \n- 6. 在AutoCAD Web界面的右上角，你会看到一个以齿轮小图标表示的设置图标。单击该齿轮图标以打开“设置”对话框，如图15.12所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_399_1.png)\n\
  \n图15.12：AutoCAD Web的“设置”对话框\n\n- 7. 单击对话框左侧的“偏好设置”选项卡后，你会看到可以更新主题。默认主题为深色。选择“浅色”可使浏览器界面更亮，然后点击“完成”。如图15.13所示，你会注意到菜单颜色变浅，但绘图区域仍使用较深主题。浅色主题使得在AutoCAD\
  \ Web中阅读菜单更容易。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_400_0.png)\n\n图15.13：AutoCAD\
  \ Web中使用浅色主题\n\nAutodesk一直努力确保AutoCAD Web中使用的AutoCAD界面尽可能接近AutoCAD桌面界面，使从桌面到Web的过渡尽可能容易。\n\
  \n- 8. 如果单击AutoCAD Web界面左侧图标菜单上的图标，你会看到可以使用“特性”、“图层”、“块”、“外部参照”、“轨迹”和“活动”菜单。\n\n\
  - 9. 单击“图层”图标，出现“图层”面板，如图15.14所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_401_0.png)\n\
  \n图15.14：AutoCAD Web中的“图层”面板\n\n- 10. 如果单击*图15.14*所示面板中“图层”一词旁边的+符号，可以在绘图中创建新图层，如*图15.15*所示。\n\
  \n![](img/e5541e806f2ef46a4958b6c3d0b346a9_402_0.png)\n\n图15.15：可在“图层”面板中命名的新图层\n\
  \n- 11. 默认情况下，新图层命名为Layer1（或类似名称，取决于已创建的新图层数量）。它将以蓝色高亮显示（选中），因此你可以输入任何需要的名称来覆盖默认图层名称。\n\
  \n- 12. 输入图层名称Traces并按*回车*。图层名称将添加到图层名称列表中。请注意，图层会自动按字母顺序移动。\n\n- 13. 新的Traces图层默认为白色。单击图层名称右侧的颜色框以更改颜色，将出现调色板，显示绘图中的颜色和AutoCAD索引颜色，如*图15.16*所示。\n\
  \n![](img/e5541e806f2ef46a4958b6c3d0b346a9_402_1.png)\n\n图15.16：AutoCAD Web调色板\n\
  \n- 17. 单击右上角的个人资料图片，然后选择**退出登录**以退出AutoCAD Web应用程序。\n\n在本节中，你已学习如何在AutoCAD Web应用程序中打开和处理DWG文件。你打开了一个基于云的DWG文件，创建了一个新图层，并将绘图保存在云端。\n\
  \n你可以在AutoCAD Web中使用许多命令和工作流程，所有这些都遵循与AutoCAD桌面应用程序类似的工作流程。Autodesk这样做是为了保持AutoCAD用户体验。另外，请注意，AutoCAD\
  \ Web*不是*浏览器中功能完整的AutoCAD版本。可用的AutoCAD命令和功能数量有限，但足以让你轻松查看、编辑和更新任何2D DWG文件。\n\n##\
  \ 行动号召\n\n> AutoCAD Web是一款出色的工具，可让你在DWG文件存储在云端时随时访问它们。尝试将更复杂的DWG文件保存到云端，并在AutoCAD\
  \ Web中处理它。体验AutoCAD Web的工具、功能和工作流程，测试浏览器中DWG文件编辑的速度和便捷性。\n\nAutoCAD Web 使 AutoCAD\
  \ 大众化，无论你使用的是 AutoCAD Windows 版还是 AutoCAD Mac 版。DWG 文件在 AutoCAD Web 中是相同的，并且在使用\
  \ Windows 或 Mac 版本的 Autodesk 桌面应用程序打开 DWG 时，在 AutoCAD Web 中进行的所有编辑都将反映在 DWG 中。\n\
  \n## 在AutoCAD移动应用程序中打开和处理图纸\n\n本节基于在*Apple iPad Pro*上使用AutoCAD移动应用程序。AutoCAD移动应用程序可以在iOS和Android移动操作系统上运行，但界面可能有所不同，请注意这一点。\n\
  \n另外，不要求你拥有iPad等平板电脑。本章包含本节是为了让你了解在移动端处理基于云的DWG文件是多么快速和容易。你（可能）可以在智能手机上按照本节操作，但可能会受到手机屏幕大小的限制。如果你拥有市面上较大屏的智能手机，也许是可行的。\n\
  \n假设AutoCAD移动应用程序已安装在Apple iPad Pro上。你可以在相应的Apple和Google应用商店中（通过订阅方式）获取AutoCAD。以下步骤将引导你了解如何使用AutoCAD移动应用程序打开和处理图纸。\n\
  \n- 1. 与AutoCAD Web一样，你必须使用Autodesk账户凭据登录AutoCAD移动应用程序，如*图15.19*所示。如有需要，你还可以使用**创建账户**按钮创建新的Autodesk账户。\n\
  \n![](img/e5541e806f2ef46a4958b6c3d0b346a9_405_0.png)\n\n图15.19：AutoCAD移动应用程序登录屏幕\n\
  \n登录后，你会看到一个页面，显示**最近**面板（显示最近访问的文件）和**源**面板（你可以在其中访问其他基于云的文件位置），如*图15.20*所示。你可以在**最近**面板中看到`New\
  \ Office Layout.dwg`文件，因为它最近在iPad上被访问过。你还可以在**源**面板中使用**AutoCAD Web**，它会带你进入`AutoCAD\
  \ Web & Mobile`文件夹。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_406_0.png)\n\n图15.20：AutoCAD移动应用程序主屏幕\n\
  \n- 2. 选择`New Office Layout.dwg`文件。AutoCAD移动应用程序将加载该图纸。这可能需要一点时间，具体取决于你的移动数据覆盖范围和平板电脑的规格。一旦DWG文件加载完成，其外观将如*图15.21*所示。\n\
  \n![](img/e5541e806f2ef46a4958b6c3d0b346a9_407_0.png)\n\n图15.21：AutoCAD移动应用程序中基于云的DWG文件\n\
  \nAutoCAD移动应用程序使用标准iOS界面，包括用于缩放和平移的手指手势。它还支持iPad的Apple Pencil。如果你有Apple技术（或类似技术）可用，值得检查其工作方式。\n\
  \n命令面板位于左下角，图标菜单位于屏幕右侧。请注意，图标菜单使用与AutoCAD Web应用程序相同的图标。这是为了在AutoCAD Web产品和AutoCAD桌面之间保持用户界面的一致性。\n\
  \n- 3. 单击图标菜单上的“图层”图标，如图15.22所示。然后，单击“新建图层”（箭头所示）。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_408_0.png)\n\
  \n图15.22：AutoCAD移动应用程序中的“图层”面板\n\n- 4. 给新图层命名为Threshold，如图15.23所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_408_1.png)\n\
  \n图15.23：在“图层”面板中命名Threshold图层\n\n- 7. 向下滚动图层列表以找到**Threshold**图层。图层颜色在图层列表中显示为图层名称左侧的垂直高亮，如*图15.26*所示。\n\
  \n![](img/e5541e806f2ef46a4958b6c3d0b346a9_410_0.png)\n\n图15.26：图层列表中的Threshold图层\n\
  \n> **技巧提示 #36**\n>\n> 在AutoCAD Web和AutoCAD移动应用程序中，你可以通过单击*灯泡*符号来打开和关闭绘图中的图层。\n\n\
  - 8. 单击图层列表中的双箭头符号以最小化**图层**面板，如*图15.27*所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_410_1.png)\n\
  \n图15.27：使用双箭头最小化“图层”面板\n\n\n\n\n+   9. 现在，您可以单击 AutoCAD 移动应用程序窗口右上角的磁盘图标，将 DWG\
  \ 文件保存到云端，如*图 15.28*所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_411_0.png)\n\
  \nNew Office Layout.dwg 文件连同新的 Threshold 图层现已保存回 AutoCAD Web & Mobile 文件夹中的云端。\n\
  \n请确保您退出 AutoCAD 移动应用程序。这可确保更新后的 DWG 文件的其他用户使用的是最新版本。\n\nAutodesk 将 AutoCAD 移动应用程序作为\
  \ AutoCAD Web 产品的一部分推出，以便在移动环境中也能使用 DWG 文件。这可能是在建筑工地，也可能是在工厂车间环境中。其界面与 AutoCAD Web\
  \ 相似，让人联想到 AutoCAD 桌面版，从而保持了 AutoCAD 的用户体验。\n\n另外，请注意，AutoCAD 移动应用程序并*不是*在智能手机或平板电脑上运行的\
  \ AutoCAD 完整工作版本。它提供的 AutoCAD 命令和功能数量有限，但足以轻松查看、编辑和更新任何 2D DWG 文件。\n\n> **行动号召**\n\
  > \n> AutoCAD 移动应用程序是您在移动中从云端访问 DWG 文件的绝佳工具。不妨尝试使用 AutoCAD 移动应用程序的工具、功能和工作流程，来测试在您自己的设备（无论是智能手机还是平板电脑）上，浏览器中的\
  \ DWG 文件能多么快速、轻松地被编辑。\n\n无论您是在 **AutoCAD Web** 还是 **AutoCAD 移动应用程序**中编辑了图形，编辑后的\
  \ DWG 文件仍可像往常一样在 AutoCAD 桌面应用程序中使用。下一节将带您了解这一特定工作流程。\n\n## 使用在 AutoCAD Web 或 AutoCAD\
  \ 移动应用程序中更新的图形\n\n当您身处不熟悉的办公室（AutoCAD Web：使用浏览器）或在外出途中（AutoCAD 移动应用程序：在平板电脑上）时，使用\
  \ AutoCAD Web 或 AutoCAD 移动应用程序会非常方便。\n\n但是，一旦您对基于云的 DWG 文件进行了修订和编辑，您始终需要返回 AutoCAD\
  \ 桌面环境才能使用完整版本的 AutoCAD。\n\n在本节中，我们将从 `AutoCAD Web & Mobile` 文件夹中打开基于云的 `New Office\
  \ Layout.dwg` DWG 文件，以确认在 AutoCAD Web 和 AutoCAD 移动应用程序中所做的更改均已生效。让我们按照以下步骤开始：\n\n\
  +   1. 在 AutoCAD 桌面端，使用**快速访问工具栏（QAT）**图标选择 `OPENFROMWEBMOBILE` 命令，如*图 15.29*所示。然后，选择\
  \ `New Office Layout.dwg` 文件并单击**打开**。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_412_0.png)\n\
  \n*图 15.29：从 AutoCAD Web & Mobile 文件夹打开 DWG*\n\n+   图形将打开。请确保您位于**模型**选项卡，并已缩放到办公室平面图的完整视图。\n\
  \n+   2. 单击功能区上的**常用**选项卡，并查看**图层**功能区面板。单击**图层特性**图标，如*图 15.30*所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_413_0.png)\n\
  \n图 15.30：图层特性图标\n\n+   3. 屏幕上将出现**图层特性管理器**选项板，如*图 15.31*所示。请注意，该 DWG 文件中现在已包含**Traces**和**Threshold**图层。\n\
  \n![](img/e5541e806f2ef46a4958b6c3d0b346a9_413_1.png)\n\n图 15.31：图层特性管理器选项板中的新图层\n\
  \n- 您还可以在 Autodesk 网站上了解有关 AutoCAD Web 的更多信息：https://help.autodesk.com/view/ACD/2022/ENU/?guid=GUID-B4A46563-E5CA-4A34-918C-78ADEA2FEEB4\n\
  - 此处还提供了有关 AutoCAD 移动应用程序的更多信息：https://help.autodesk.com/view/ACD/2022/ENU/?guid=GUID-20A8F96D-0ACA-49F6-A6FF-D7DD71A8D03A\n\
  \n## 小结\n\n在本章中，您已经了解了如何使用 SAVETOWEBMOBILE 命令保存 DWG 文件，以及随后如何使用 OPENFROMWEBMOBILE\
  \ 命令打开已保存的文件。您还学习了如何使用活动洞察选项板查看 DWG 文件的历史记录。\n\n您还获得了宝贵的知识，了解了如何在浏览器中的 AutoCAD Web\
  \ 应用程序中，以及在平板电脑或智能手机等移动设备上的 AutoCAD 移动应用程序中打开和处理图形。\n\n随后，您还学习了如何在 AutoCAD 桌面端打开已修改的基于云的\
  \ DWG 文件，并应用 AutoCAD Web 和 AutoCAD 移动应用程序在 DWG 文件中所做的更改。\n\n基于云的 DWG 文件可实现无缝、实时的协作，无论通过浏览器还是在移动设备上皆是如此。本章所学到的知识将让您思考如何制定基于云的策略，利用基于云的\
  \ DWG 存储，并使用 AutoCAD Web 和 AutoCAD 移动应用程序进行高效、富有成效的协作。\n\n在下一章中，我们将探讨如何使用 AutoCAD\
  \ 中的追踪功能，并将其与基于云的 DWG 文件相结合，从而进一步加强您对图形的协作。\n"
- "# 16\n## 使用 AutoCAD 中的追踪功能进行协作\n\n在上一章中，您学习了如何处理存储在云端的图形，并使用 AutoCAD Web 和 AutoCAD\
  \ 移动应用程序进行协作。既然云可以用来存储您的 AutoCAD DWG 文件，协作就成为了关键，而 AutoCAD 中的追踪功能已成为传达设计变更、编辑和修订的绝佳方式。\n\
  \nAutoCAD 中新的追踪功能以前仅适用于 AutoCAD Web 和 AutoCAD 移动应用程序。自 AutoCAD 2023 起，该功能也适用于 AutoCAD\
  \ 桌面应用程序，并在 AutoCAD 2025 版本中得到了大幅增强。\n\n这种可用性使追踪功能在全部三种 AutoCAD 应用程序（桌面端、Web 端和移动端）中得以完整提供。本章向用户概述了\
  \ AutoCAD 中的追踪功能，以及如何利用该功能发挥其优势。\n\n本章涵盖以下方法，让您能够在全部三种 AutoCAD 应用程序中有效地使用追踪功能：\n\
  \n+   *   在 AutoCAD 桌面端使用追踪\n+   *   在 AutoCAD 移动应用程序中使用追踪\n+   *   在 AutoCAD Web\
  \ 中使用追踪\n+   *   在 AutoCAD 桌面应用程序中审阅追踪\n\n将云与追踪功能相结合用于协作，将节省大量的返工时间，并实时提供对 DWG 文件的更新。\n\
  \n本章将向您展示云如何成为 AutoCAD DWG 工作流程中不可或缺的一部分。它为 DWG 文件提供存储，并利用 AutoCAD 中的追踪功能等工具实现轻松协作。\n\
  \n## 练习文件\n\n在本节中，您必须使用练习文件 New Office Layout_TRACE.dwg。请在 AutoCAD 桌面应用程序中打开该文件，并确保办公室平面图显示在模型选项卡中。\n\
  \n请确保使用 SAVETOWEBMOBILE 命令将 New Office Layout_TRACE.dwg 文件保存到 AutoCAD Web & Mobile\
  \ 文件夹。使用快速访问工具栏（QAT）上的“保存到 Web 和移动设备”图标。您已在前面章节中学习了如何执行此操作。这样，您就可以在本章后面使用 AutoCAD\
  \ Web 和 AutoCAD 移动应用程序轻松访问该图形文件。\n\n在本章中，我们将展示来自基于浏览器的 AutoCAD 版本（AutoCAD Web）以及安装在平板电脑（Apple\
  \ iPad Pro）上的 AutoCAD 移动应用程序的各种图像。请确保您可以使用您的 AutoCAD 订阅信息访问 AutoCAD Web。\n\n本章并不强制要求您拥有安装了\
  \ AutoCAD 移动应用程序的移动设备，但拥有一台并安装它会有所帮助。这将让您熟悉相关的移动端工作流程。您可以在相应的应用商店中搜索“AutoCAD”来找到该移动应用程序。\n\
  \n## 在 AutoCAD 桌面端使用追踪\n\nAutoCAD 让您可以访问本地存储的图形文件以及云端存储的图形文件。虽然本地存储文件可能更受青睐，但确保您的\
  \ DWG 文件存储在云端（AutoCAD Web & Mobile 文件夹）中，可以让您使用全部三种 AutoCAD 应用程序（桌面端、Web 端和移动端）中的追踪工具进行快速、轻松的协作。\n\
  \n### 提示与技巧 #36\n\n自 AutoCAD 2023 版本起，才可以在 AutoCAD 桌面应用程序中向 DWG 文件添加追踪。在此之前，您只能在\
  \ AutoCAD 桌面端查看追踪。如果您运行的是 AutoCAD 2023 之前的版本，则必须使用 AutoCAD Web 或 AutoCAD 移动应用程序添加追踪。另一种解决方案是升级您的\
  \ AutoCAD 版本。有时，这并不是最快的途径，因为您可能需要与所在组织的 IT 部门沟通以加快此事。不过，您应该可以通过现有的 AutoCAD 订阅访问\
  \ AutoCAD Web 和 AutoCAD 移动应用程序，因此，在此期间也许可以使用这些应用程序向您的云端 DWG 文件添加追踪！\n\n以下步骤将带您了解在\
  \ AutoCAD 桌面应用程序中使用追踪的方法：\n\n+   1. SAVETOWEBMOBILE 命令位于 QAT 左上角，十分方便，如图 16.1 所示。第一次单击它时，系统可能会要求您安装一个驱动程序文件。请确保安装该文件。安装过程非常快，不会花费很长时间。\n\
  \n\n\n\n3. 使用文件名 New Office Layout_TRACE.dwg 并点击保存。这将把 DWG 文件保存到为你的 AutoCAD 订阅保留的云空间中的\
  \ AutoCAD Web & Mobile 文件夹中。这样，添加到 DWG 文件的任何批注都可供所有 AutoCAD 应用程序使用：桌面版、网页版和移动版。\n\
  \n4. 点击保存后，图纸不会发生变化。它只是以该文件名保存为基于云的版本。\n\n5. 查看 AutoCAD 标题栏。你可能会看到新保存的 DWG 文件的冗长路径，如图\
  \ 16.3 所示。该路径是你的 AutoCAD Web & Mobile 云空间的位置，由你的 AutoCAD 订阅和登录 AutoCAD 时使用的 Autodesk\
  \ 账户定义。请注意，你的文件路径将与图 16.3 中显示的不同，因为它特定于你的账户详细信息。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_420_0.png)\n\
  \n图 16.3：保存在云中的 DWG 文件的新文件路径\n\n6. 你的图纸现在已在云中，可使用 AutoCAD 中的批注功能进行协作。\n\n7. 要向图纸添加一个简单的批注，请在功能区上点击协作选项卡，然后在批注功能区面板上选择批注调色板图标，如图\
  \ 16.4 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_420_1.png)\n\n图 16.4：批注功能区面板上的批注调色板图标\n\
  \n当调色板打开时，你会看到 DWG 文件中没有批注。这在图 16.5 中显示。点击新建批注按钮。这将启动工作流程，允许你在 AutoCAD 桌面应用程序中使用时向\
  \ DWG 文件添加批注。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_421_0.png)\n\n图 16.5：带有新建批注按钮的批注调色板\n\
  \n8. 点击新建批注后，你将进入批注模式，图纸会显示与其关联的任何批注。你没有任何批注，因此 AutoCAD 会在批注调色板中添加一个默认批注，如图 16.6\
  \ 所示。在这种情况下，它称为 Trace1。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_421_1.png)\n\
  \n图 16.6：带有默认批注的 AutoCAD 批注模式\n\n9. Trace1 名称是默认的，因此你可以轻松通过右键点击批注名称来重命名批注。右键菜单让你关闭、重命名或删除批注。选择重命名，如图\
  \ 16.7 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_422_0.png)\n\n图 16.7：批注调色板上的右键菜单\n\
  \n10. 对于批注，使用名称 Revision1。输入后，按 Enter 确认重命名。\n\n11. 如果现在将鼠标悬停在调色板中的批注上，你会看到 AutoCAD\
  \ 为你提供批注的所有作者信息和其他信息，例如批注创建日期，如图 16.8 所示。它还显示批注的贡献者，显示还有谁参与了批注的协作。此时，只有你应显示为贡献者。\n\
  \n![](img/e5541e806f2ef46a4958b6c3d0b346a9_422_1.png)\n\n图 16.8：批注信息\n\n12. 现在图纸中已有命名批注，你需要在批注模式下向图纸添加信息。在此情况下，你将添加一个简单的修订云。\n\
  \n13. 使用功能区上的 **Home** 选项卡，进入 **Draw** 面板并点击 **Draw** 面板标题栏上的箭头以展开面板图标。在 **REVCLOUD**\
  \ 下拉菜单中选择 **Rectangular** 修订云。你可以在 *图 16.9* 中看到这一点。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_423_0.png)\n\
  \n图 16.9：矩形修订云选项\n\n14. 你现在处于 **REVCLOUD** 命令中。AutoCAD 通常会在 **REVCLOUD** 命令中预先计算弧长，但如果你愿意可以调整它。右键点击以调出快捷菜单，如\
  \ *图 16.10* 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_423_1.png)\n\n图 16.10：选择弧长的\
  \ REVCLOUD 快捷菜单\n\n15. 你会在提示中看到默认的弧长显示。对于此练习，将弧长设置为 900，然后按 Enter。然后你就可以在批注中放置修订云了。\n\
  \n16. 缩放到办公平面图中的左上执行办公室，并将矩形修订云放置在该办公室的双桌配置周围，如图 16.11 所示。点击矩形修订云的两个相对角，就像使用 RECTANGLE\
  \ 命令放置矩形一样。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_424_0.png)\n\n图 16.11：矩形修订云的放置，两个相对角点均已标注\n\
  \n17. 在第二次角点点击后，修订云被放置在 Revision1 批注中的 Traces 图层上。\n\n18. 批注将保持附加到 DWG 文件，因此你可以通过点击批注工具栏上的小\
  \ X 来退出批注模式，如图 16.12 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_425_0.png)\n\
  \n图 16.12：用于关闭批注工具栏的 X\n\n19. 现在你可以在 AutoCAD 屏幕左上角的 QAT 上点击保存，如图 16.13 所示。你可以像这样正常保存，因为你正在处理基于云的图纸，位于\
  \ AutoCAD Web & Mobile 文件夹中。这与将图纸文件保存到本地位置（如硬盘或服务器）相同。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_425_1.png)\n\
  \n图 16.13：QAT 上的保存图标\n\n20. 关闭批注工具栏后，你将返回到 New Office Layout_TRACE.dwg 文件中的模型选项卡。\n\
  \n21. 你现在已向图纸文件应用了批注并将其保存回云中。\n\n## 技巧与窍门 #37\n\n使用 AutoCAD 桌面应用程序向 DWG 文件添加批注是一个直接的工作流程，正如本章前一节所示。然而，有一点你应该始终记住。你不能在批注操作处于活动状态时保存\
  \ DWG，因此你必须通过关闭批注工具栏关闭批注，然后保存图纸文件。\n\n在本节中，你通过在 AutoCAD 桌面应用程序中工作时向 DWG 文件添加批注，启动了协作工作流程。\n\
  \n## AutoCAD for Mac\n\n批注功能在 AutoCAD for Mac 中受支持。如果你使用的是 2024 或 2025 版本，前一节中的工作流程是相同的。但你必须将\
  \ DWG 文件从 Mac 保存到其中一种专有的基于云的解决方案，例如 Microsoft OneDrive，因为 AutoCAD Web & Mobile 文件夹在\
  \ AutoCAD for Mac 中不受支持。\n\n在下一节中，你将使用 AutoCAD 移动应用程序添加该批注，就像你在现场，实时在真实环境中处理新办公布局一样。\n\
  \n## 在 AutoCAD 移动应用程序中使用批注\n\n本节基于在 Apple iPad Pro 上使用 AutoCAD 移动应用程序。AutoCAD 移动应用程序可在\
  \ Apple 和 Android 移动操作系统上运行，界面可能有所不同，请注意这一点。\n\n你不一定需要访问 iPad Pro 等平板电脑。本章包含本节是为了让你了解使用\
  \ AutoCAD 移动处理基于云的 DWG 文件中的批注是多么快速和简单：\n\n1. 假定 AutoCAD 移动应用程序已安装在 Apple iPad Pro\
  \ 上。你可以在 Apple 和 Google 应用商店按订阅方式访问 AutoCAD。\n\n2. 与 AutoCAD 桌面应用程序和 AutoCAD Web\
  \ 一样，你必须使用你的 Autodesk 账户凭据登录 AutoCAD 移动应用程序。\n\n3. 登录后，你会看到一个页面，显示 **Recent** 面板，其中显示最近访问的文件，以及\
  \ **Sources** 面板，你可以在其中访问其他基于云的文件位置，如 *图 16.14* 所示。你可以在 **Recent** 面板中看到 `New Office\
  \ Layout_TRACE.dwg` 文件，因为它最近在 iPad 上被访问过。你还可以在 **Sources** 面板中使用 AutoCAD Web，这会带你进入\
  \ **AutoCAD Web & Mobile** 文件夹。此外，请注意 `New Office Layout_TRACE.dwg` 文件的列表会显示它是在\
  \ PC 上访问的还是通过 AutoCAD Web 访问的。\n\n\n\n\n\n## 最近\n\n- New Office Layout_TRACE.dwg\n\
  \  15:10 在 PC 上\n  AutoCAD Web\n- 3-4 Pier Street - General Floor Plan_V2.dwg\n\
  \  周一在 PC 上\n  AutoCAD Web\n- New Office Layout.dwg\n  周一在 PC 上\n  AutoCAD Web\n\
  - 显示更多...\n\n## 来源\n\n- AutoCAD Web\n  shaun.bryant@cadfmconsult.co.uk\n- OneDrive\n\
  \  登录\n- 文件应用\n  iPad\n- 添加来源\n\n图 16.14：AutoCAD 移动应用的“最近”和“来源”屏幕\n\n4. 单击 New Office\
  \ Layout_TRACE.dwg 文件，它将在 AutoCAD 移动应用中打开，如*图 16.15*所示。右侧箭头所指即为轨迹图标。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_428_0.png)\n\
  \n图 16.15：绘图在 AutoCAD 移动应用中打开，轨迹图标用箭头标出\n\n5. 单击轨迹图标后，**轨迹**面板将展开到 iPad 屏幕区域，任何附加到\
  \ DWG 文件的轨迹都会以轨迹模式显示，如*图 16.16*所示。\n\n8. 单击修订云线旁边以定位轨迹中的 **MText** 位置。接下来系统会提示您指定文本注释将占据的区域，如*图\
  \ 16.17*所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_430_0.png)\n\n图 16.17：在屏幕上指定\
  \ MText 区域\n\n9. 单击 MText 区域的第二个角点后，您会看到文本编辑器出现在 iPad 屏幕底部，如*图 16.18*所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_430_1.png)\n\
  \n图 16.18：AutoCAD 移动应用中的文本编辑器\n\n10. 系统会提示您使用文本编辑器设置来添加文本。在此示例中，您可以看到文本高度设置为 3 0\
  \ 0，文本内容为 **Check desk spec**。此外，请注意 iPad 会提供预测文本，如下方文本编辑器区域所示。\n\n11. 单击蓝色对勾以确认文本设置。编辑器将关闭，文本将放置在轨迹中，如*图\
  \ 16.19*所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_431_0.png)\n\n图 16.19：放置在\
  \ DWG 文件轨迹中的 MText\n\n12. 使用**轨迹**工具栏上的 **X** 符号，即可关闭**轨迹**工具栏并退出轨迹模式。然后您将返回绘图。如果**轨迹**面板未关闭，请单击轨迹图标，如前面*图\
  \ 16.15*所示。\n\n13. 确保使用 **保存** 图标（位于 iPad 屏幕右上角）保存绘图文件，如*图 16.20*所示。图标会显示绿色对勾，表示已成功保存到云端。\n\
  \n![](img/e5541e806f2ef46a4958b6c3d0b346a9_431_1.png)\n\n图 16.20：AutoCAD 移动应用中的保存图标\n\
  \n14. 现在，您已在 AutoCAD 移动应用中保存 New Office Layout_TRACE.dwg，此前您已在附加到绘图文件的轨迹中添加了一些 MText\
  \ 注释。更改现已保存，可供进一步协作使用。\n\n在本节中，您了解了 AutoCAD 订阅中的轨迹功能如何让您通过 AutoCAD 移动应用在绘图中与新的和现有的轨迹进行协作。在下一节中，我们将在\
  \ AutoCAD Web 中使用轨迹。\n\n## 在 AutoCAD Web 中使用轨迹\n\n本节基于使用 AutoCAD Web 对本章一直在使用的轨迹进行协作。\n\
  \n在上一节中，New Office Layout_TRACE.dwg 文件已通过 AutoCAD 移动应用保存到云端，因此您可以确定它是最新的。您可以使用 AutoCAD\
  \ 订阅凭据登录 AutoCAD Web 后进行检查。登录后，该绘图将显示在“最近”列表中，如图 16.21 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_432_0.png)\n\
  \n图 16.21：在 AutoCAD Web 的“最近”列表中列出的绘图\n\n绘图文件会显示上次打开的日期，让您可以检查它是否是最新版本。\n\n> **提示和技巧\
  \ #38**\n> \n> 在使用基于云的 DWG 文件进行协作时，检查您是否正在处理最新绘图的一个非常简单的方法是采用合理的文件命名规范。本章当前使用的绘图名为\
  \ New_Office_Layout_TRACE.dwg。要跟踪 DWG 文件中的编辑和更改，请确保文件名的当前修订版本包含在文件名中。例如，您可以将使用的文件命名为\
  \ New_Office_Layout_TRACE_REV1.dwg，其中 REV1 表示绘图文件的第一次修订。\n\n现在，您需要在 **AutoCAD Web**\
  \ 中打开绘图文件，以检查上一节中使用 AutoCAD 移动应用添加的轨迹：\n\n1. 登录 AutoCAD Web 后，在**最近**列表中双击 New_Office_Layout_TRACE.dwg\
  \ 文件以将其打开。\n2. DWG 文件将在 AutoCAD Web 中打开，如*图 16.22*所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_433_0.png)\n\
  \n图 16.22：在 AutoCAD Web 中打开的 DWG 文件\n\n3. 打开 AutoCAD Web 时，默认情况下始终会设置**特性**选项板。\n\
  \n6. 轨迹属性也显示在**轨迹**选项板中。它们显示在**轨迹**列表下，如*图 16.24*中的箭头所示。\n\n7. 如*图 16.25*所示，您可以检查这些轨迹属性以确保它们是最新的。您还可以查看是谁在绘图中添加了轨迹，以及谁在其中进行了协作。\n\
  \n![](img/e5541e806f2ef46a4958b6c3d0b346a9_435_0.png)\n\n图 16.25：Revision1 轨迹的轨迹属性\n\
  \n8. 双击轨迹中的文本，AutoCAD Web 文本编辑器将显示，如*图 16.26*所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_435_1.png)\n\
  \n图 16.26：在 AutoCAD Web 的轨迹模式下显示的文本编辑器\n\n9. 将文本编辑为 Check desk spec and cost，然后单击文本编辑器栏末尾的蓝色对勾。这将关闭文本编辑器并更新轨迹中的文本，如图\
  \ 16.27 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_436_0.png)\n\n图 16.27：轨迹中更新后的文本\n\
  \n10. 现在，您可以单击轨迹工具栏末尾的 X 退出轨迹模式，如图 16.28 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_436_1.png)\n\
  \n图 16.28：轨迹工具栏，X 用箭头标出\n\n11. 更新后的轨迹现在已设置在 DWG 文件中，您现在需要将绘图保存到云端，以确保更新后的轨迹可供其他协作者使用。使用\
  \ AutoCAD Web 应用程序窗口右上角的保存图标，如图 16.29 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_437_0.png)\n\
  \n图 16.29：AutoCAD Web 中的保存图标\n\n12. 确保退出并注销 AutoCAD Web。您现在已在 AutoCAD Web 中编辑轨迹，并将更新后的\
  \ DWG 文件保存到云端。\n\n在本节中，您学习了如何在 AutoCAD Web 中打开包含现有轨迹的基于云的 DWG 文件。然后，您编辑了轨迹，并将更新后的\
  \ DWG 文件保存回云端以供进一步协作。\n\n## 在 AutoCAD 桌面应用程序中查看轨迹\n\n在之前的章节中，您学习了如何在 AutoCAD 移动应用和\
  \ AutoCAD Web 中更新轨迹。\n\n在本节中，您将在 AutoCAD 桌面应用程序中打开云端更新后的 DWG 文件，并查看更新后的轨迹。您仍将使用同一个\
  \ DWG 文件 New Office Layout_TRACE.dwg，并将使用轨迹选项板：\n\n1. 打开 AutoCAD 桌面应用程序，单击快速访问工具栏（QAT）上的“从\
  \ Web 和移动端打开”图标，如图 16.30 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_438_0.png)\n\
  \n图 16.30：快速访问工具栏（QAT）上的“从 Web 和移动端打开”图标\n\n2. 将显示“从 AutoCAD Web 和移动端打开”对话框。选择 New\
  \ Office Layout_TRACE.dwg 文件并打开它，如图 16.31 所示。绘图将在 AutoCAD 中打开。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_438_1.png)\n\
