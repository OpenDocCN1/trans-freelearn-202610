  在Mac版AutoCAD中，在**块编辑器**中添加可见性状态的工作流程相同。


  现在，您已创建了带有可见性状态的新**Washbasin_DYN**动态块。在本章的下一节中，您将把该块插入到图纸中，并使用可见性状态来显示洗手盆的不同视图。


  ## 使用带有可见性状态的新动态块


  在上一节中，您学习了如何使用常规块在新动态块中创建洗手盆不同视图的可见性状态。在本节中，您将学习如何将新动态块插入到图纸中并利用可见性状态。


  在本章中，您一直在默认图层（图层0）上工作。这意味着插入图纸时，新动态块将采用当前图层。以下工作流程将让您充分测试动态洗手盆块：


  - 1. 在功能区的**常用**选项卡上，确保**图层**面板中的当前图层为**Sanitary**。

  - 2. 使用缩放和平移功能，确保在远离现有块的空间中工作。

  - 3. 单击功能区的**插入**选项卡，然后点击左端的**插入**下拉按钮。*图12.35显示了下拉列表中的**Washbasin_DYN**块。*


  ![](img/e5541e806f2ef46a4958b6c3d0b346a9_336_0.png)


  图12.35：插入下拉列表中的Washbasin_DYN动态块






  4. 从下拉菜单中选择 **Washbasin_DYN** 块以将其插入到图纸中。该块将出现在光标上。您会看到动态块已采用第一个当前可见性状态，即 Washbasin-SIDE
  视图，如图 12.36 所示。稍后可以（如果需要）更改此状态。


  ![](img/e5541e806f2ef46a4958b6c3d0b346a9_337_0.png)


  图 12.36：插入的 Washbasin_DYN 块，当前显示 Washbasin-SIDE 视图


  5. 选择一个点来插入 **Washbasin_DYN** 块。放置后，单击该块以将其选中，如图 12.37 所示。


  ![](img/e5541e806f2ef46a4958b6c3d0b346a9_337_1.png)


  图 12.37：选中的 Washbasin_DYN 动态块


  请注意，选中的块有两个蓝色夹点。右侧的*方形*夹点是您在**块编辑器**中添加的**基点**参数。左侧的*箭头*夹点用于动态块内部设置的可见性状态。


  6. 单击箭头夹点以显示可用的可见性状态，如*图 12.38*所示。


  ![](img/e5541e806f2ef46a4958b6c3d0b346a9_338_0.png)


  图 12.38：已放置的动态块，并显示可见性状态


  7. 在*图 12.38*显示的菜单中，选择 **Washbasin-TOP** 可见性状态。块视图将变为洗手盆的俯视图，如*图 12.39*所示。


  ![](img/e5541e806f2ef46a4958b6c3d0b346a9_339_0.png)


  图 12.39：使用 Washbasin-TOP 可见性状态的 Washbasin_DYN 动态块


  现在，您可以使用箭头夹点上的菜单切换可见性状态。这可以在绘图时节省宝贵的时间，因为您现在在一个动态块中拥有了三个常规块视图，它们都代表同一个绘图对象——洗手盆。


  恭喜！您现在已经创建了一个带有可见性状态的动态块。随着您不断积累 AutoCAD 知识，您可能需要留出一些时间尝试使用可见性状态的动态块。考虑将它们与块属性结合使用，以创建节省宝贵绘图时间的动态块。


  您可以在 Autodesk 网站上详细了解带有可见性状态的动态块：https://help.autodesk.com/view/ACD/2024/ENU/?guid=GUID-B30B3B47-F93B-487E-998F-2E8C72D22CBD。


  带有可见性状态的动态块是减少冗长编辑任务时间的绝佳方式。您还可以开发带有可见性状态的动态块族。一个很好的例子是某种特定类型的固定螺栓，具有不同的长度或螺纹，并为每种长度或螺纹设置一个可见性状态。在这种情况下，您还可以考虑长度参数。


  **AutoCAD for Mac**

  在 AutoCAD for Mac 中，使用相同的工作流创建带有可见性状态的动态块。


  ## 3.1 原子结构模型


  早在1803年，英国科学家道尔顿提出了原子论，他认为原子是组成物质的最小微粒，原子在化学反应中不可再分。


  1897年，英国科学家汤姆生发现了电子，并提出了“葡萄干面包”模型，他认为原子是一个球体，正电荷均匀分布在整个球体内，电子镶嵌其中。


  1911年，英国科学家卢瑟福进行了α粒子散射实验后，提出了“行星模型”，他认为原子中心有一个带正电荷的原子核，电子在原子核外空间绕核运动。


  ![](img/e5541e806f2ef46a4958b6c3d0b346a9_340_0.png)


  卢瑟福的“行星模型”不能解释原子发光等现象，1913年，丹麦科学家玻尔改进了“行星模型”，提出了“电子分层模型”，认为电子在原子核外一定轨道上分层排布。


  现代科学家认为，原子中心有一个带正电荷的原子核，原子核由质子和中子构成，电子在原子核外高速运动。电子在原子核外的运动是不规律的，但在一定的区域内出现，这些区域称为“电子层”。

