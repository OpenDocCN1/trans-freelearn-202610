  14. 从左侧列表中选择 **Arch-LIBRARY** 调色板并右键单击它。*图 9.33*中显示的快捷菜单会出现，你可以以 **XTP** 文件的形式导入和导出工具调色板。将
  XTP 文件导出给团队成员，他们就可以将其导入自己的工具调色板并从同一位置使用相同的块。


  你现在可以创建自己的工具调色板，将绘图块添加到这些调色板中，并在团队内部导入和导出调色板以重用现有块内容。要进一步探索工具调色板，请使用此链接访问 Autodesk
  网站：https://help.autodesk.com/view/ACD/2021/ENU/?guid=GUID-167A8594-92CB-4FCC-B72C-0F546383E97C。


  ## 摘要


  你现在知道如何开始开发自己的块库，使用常规块和动态块，将它们添加到 Blocks 调色板的库中，并使用自己的块创建自己的工具调色板。在本章中，你学习了如何将常规块和动态块插入绘图并使用动态块参数更改动态块的外观。


  你还学习了如何在 AutoCAD 中使用剪贴板功能在绘图之间复制和粘贴 AutoCAD 块以开始开发块库。此外，你还学习了如何通过访问 **Libraries**
  标签页将新的块库绘图添加到 Blocks 调色板。


  你还获得了在新工具调色板中添加和管理块的宝贵知识。


  内容重用在处理大型项目中的 AutoCAD 绘图时至关重要，因为它可以节省宝贵的时间并避免在项目绘图中对 AutoCAD 对象进行繁琐的返工。本章中学到的技能将为你提供良好的基础和理解，以便将来开始实施内容重用和块库。


  在下一章中，我们将研究如何在重用设计内容时向 AutoCAD 块添加属性，以便在 AutoCAD 绘图中的 AutoCAD 块中添加和传递更详细的设计信息。





  '
- "# 10 使用块属性\n\n在上一章中，你学习了如何使用 AutoCAD 块、在绘图中管理它们，并为内容重用创建块库。在本章中，你将进一步了解块以及如何向块添加属性，从而在绘图中提供详细信息。\n\
  \n正如你所知，块是由多个 AutoCAD 对象组成的用于内容重用的对象，例如椅子或桌子，以避免在绘图中反复重新制作特定的椅子或桌子。属性将内容重用更进一步，通过提供有关块的相关信息。例如，假设一个块代表一把椅子。椅子块的典型属性可能是制造商、型号以及序列号。你甚至可以为所有权应用属性，例如办公室中拥有该椅子的部门以及使用该椅子的员工。属性的应用是无穷无尽的，你可以随时轻松提取和编辑这些属性。\n\
  \n随着时间的推移，绘图中会包含越来越多的块。属性允许你识别块并为使用你绘图的人提供有价值的信息。\n\n本章涵盖了你在 AutoCAD 块中使用属性所需遵循的方法：\n\
  \n- 在块中定义属性\n- 使用增强属性编辑器编辑块中的属性\n- 使用块属性管理器（BATTMAN）\n\n与上一章一样，重用绘图内容并管理该内容将节省宝贵的绘图时间，减少重复任务的需求，并允许与项目利益相关者和团队成员共享内容。\n\
  \n在本章中，你将学习块中的属性如何使你能够为块提供有效解释绘图所需的相关信息。\n\n### 练习文件\n\n你已经下载了上一章的练习文件 New Office\
  \ Design.dwg。你也将在本章中使用此练习文件。\n\n### 在块中定义属性\n\n块（常规和动态）可以应用属性。本节将教你如何向常规 AutoCAD\
  \ 块应用属性。相同的流程也适用于动态块。\n\n练习文件 New Office Design.dwg 中已存在块。你需要在打开时处于 Model 选项卡，显示简单的办公室平面图。\n\
  \n你的第一步将是把块恢复为原始的 AutoCAD 对象。你这样做是为了能够向块的内容添加属性，然后再次保存块。\n\n为此，你需要放大门开口附近的桌子并选择代表计算机的块，如\
  \ *Figure 10.1* 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_266_0.png)\n\nFigure\
  \ 10.1: The PC block on the desk near the door opening (with the block selected)\n\
  \n你需要为 PC 创建一个包含属性的新块，最快捷的方法是使用 Explode（EXPLODE）命令将块爆炸回其原始 AutoCAD 对象。在块仍被选择的情况下，点击功能区\
  \ Home 选项卡上 Modify 面板上的 Explode 图标，如 Figure 10.2 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_267_0.png)\n\
  \nFigure 10.2: The Explode icon on the Modify panel\n\n被爆炸的块内部有一个所谓的嵌套块。你可以创建块的块，这些被称为嵌套块。原始\
  \ PC 块由四条线和另一个代表计算机屏幕的块组成。块现在将被恢复为其原始 AutoCAD 对象，你现在需要开始创建包含属性的新 PC 块的工作流程：\n\n\
  - 1. 选择屏幕块并同样将其爆炸。如果现在将光标悬停在屏幕的任何元素上，它都是 AutoCAD 对象，例如线或圆弧。\n- 2. 这些对象在 Figure 10.3\
  \ 中显示为已选择。确保你已选择全部四条线和屏幕块，如图所示（蓝色夹点将显示）。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_267_1.png)\n\
  \nFigure 10.3: The AutoCAD objects selected after exploding the blocks\n\n创建新块时，一个良好的做法是确保构成新块的所有对象都从图层\
  \ 0（零）开始。然后，一旦块被创建，每次在绘图中插入块的实例时，它将采用当前图层。\n\n- 3. 在所有已爆炸的对象被选择的情况下，进入 Layers 面板上的图层下拉菜单并选择图层\
  \ 0（零）。它始终位于图层列表顶部，因为它是 AutoCAD 默认图层，如 Figure 10.4 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_268_0.png)\n\
  \nFigure 10.4: The layer drop-down menu with layer 0 (zero) indicated\n\n- 4. 当在爆炸对象被选择时进入图层下拉菜单时，你会注意到它们全部位于\
  \ PCS 图层上。这就是为什么对象需要移动到图层 0（零），因为你可能需要将它们放到替代图层上。点击下拉菜单中的图层 0，你会看到所有对象都移动到该图层。按几次\
  \ Esc 键以确保对象被取消选择。然后，确保图层 0 是当前图层。\n\n- 5. 点击功能区上的 Insert 选项卡。点击 Block Definition\
  \ 面板上的 Define Attributes 图标，如 Figure 10.5 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_268_1.png)\n\
  \nFigure 10.5: The Block Definition panel with Define Attributes indicated\n\n-\
  \ **Text Settings:** 将 **Justification** 和 **Text style** 设置为 *Figure 10.6* 中所示的内容。由于绘图使用公制毫米，**Text\
  \ height** 值设为 100，可作为此绘图的合适属性大小。\n\n- 9. 点击 **OK**，对话框关闭，留下属性附着在你的光标上。确保将属性放置在绘图中\
  \ PC 对象的左侧，如 *Figure 10.7* 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_270_0.png)\n\
  \nFigure 10.7: The placed block attribute\n\n- 10. 使用之前的步骤创建另外两个属性：\n    - **PC_MANU:**\
  \ 使用 **PC Manufacturer?** 提示，默认值为 **Acme**\n    - **EMP_ID:** 使用 **Employee ID?**\
  \ 提示，默认值为 **E999**\n\n    在放置这两个新属性之前，确保将 **Justification** 设置为 **Right**，然后勾选 **Align\
  \ below previous attribute definition** 框。放置属性后，它们会自动与 **PC_ID** 属性下方对齐，如 *Figure\
  \ 10.8* 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_270_1.png)\n\nFigure 10.8:\
  \ The three attributes placed to the left of the objects\n\n- 11. 选择全部三个属性和将构成新\
  \ PC 块的所有对象，如 Figure 10.9 所示。你会看到所有夹点都显示出来。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_271_0.png)\n\
  \nFigure 10.9: All attributes and objects selected\n\n- 12. 点击 Block Definition\
  \ 面板上的 Create Block 图标，如 Figure 10.10 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_271_1.png)\n\
  \nFigure 10.10: The Create Block icon on the Block Definition panel\n\n- 13. Block\
  \ Definition 对话框将会出现。在 Name 字段中将块命名为 PC_Attributes。\n\n- 14. 在对话框中选择 Pick point\
  \ 图标，并在绘图中选择对象的右上角 Endpoint 捕捉点，如 Figure 10.11 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_272_0.png)\n\
  \nFigure 10.11 – The Endpoint object snap on the selected objects\n\n- 15. 注意 X\
  \ 和 Y 坐标现在已设置（忽略数字），并确保所有其他设置与 *Figure 10.12* 中的对话框中设置的一样。对象在你开始 **Create Block**（*BLOCK*）命令之前已被选择，因此将有\
  \ 17 个对象被选择。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_272_1.png)\n\nFigure 10.12:\
  \ The Block Definition dialog box with settings\n\n\n\n\n\n16. 单击确定，属性和对象就会消失。此时不要惊慌。删除选项是在块定义对话框中的对象窗格中设置的，因此组成新块的对象已被删除，但新块仍在\
  \ DWG 文件中。\n\n17. 此时，最好保存你的绘图。然后，块虽然未显示，但已保存在 DWG 文件中。\n\n18. 现在你需要将新创建的属性块插入到绘图中。该块是在图层\
  \ 0 创建的，因此它将采用当前图层。请先确保在功能区主选项卡上的图层面板上的图层下拉菜单中，将当前图层更改为 PCS。\n\n19. 在功能区的插入选项卡上，单击块面板上的插入下拉菜单。使用下拉菜单右侧的滑块栏，你可以找到你的新属性块\
  \ PC_Attributes，如图 10.13 所示。单击菜单上的块，然后即可将块插入到绘图中。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_273_0.png)\n\
  \n图 10.13：插入下拉菜单，其中使用箭头指出了新的属性块\n\n20. 所选块会出现在你的光标上，你可以使用创建块时选择的插入点对其进行定位。将新块大致放置在桌子中央即可（不必过于精确，后续如需可使用对象捕捉进行调整）。图\
  \ 10.14 显示了在确认位置之前块的放置情况。请注意，它正在显示属性并且位于当前图层（PCS）上。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_274_0.png)\n\
  \n图 10.14：PC_Attributes 块在确认位置之前的样子\n\n21. 单击后，你将确认其位置并被提示在编辑属性对话框中编辑块属性，如图 10.15\
  \ 所示。请注意，提示与你在原始属性定义中设置的相同，同时显示默认属性值。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_275_0.png)\n\
  \n图 10.15：编辑属性对话框，准备进行任何属性编辑\n\n22. 如需可编辑属性值。对于本次练习而言，属性值暂时保持其默认值。单击确定以关闭编辑属性对话框。你必须单击确定，因为如果像其他\
  \ AutoCAD 命令那样按 Enter，对话框不会关闭。你现在已在 AutoCAD 绘图中放置了一个属性块。\n\n## 技巧与窍门 #30\n当你将块插入到绘图中时，可能希望以各种角度旋转块。不要在确认位置后插入块，然后再使用\
  \ **Rotate**（*ROTATE*）命令进行旋转，考虑在提示输入块插入点时右键单击。你可以在快捷菜单上利用 **Rotate**（和 **Scale**）作为块插入工作流程的一部分，在截止日期临近时为你节省宝贵时间！*图\
  \ 10.16 显示了块插入快捷菜单的使用情况。*\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_276_0.png)\n\
  \n图 10.16：带有 Rotate 指示的块插入快捷菜单\n\n右键快捷菜单包含许多命令和工具，可在处理块时使用。所有这些都能让你更具生产力，使工作流程更高效。\n\
  \n### AutoCAD for Mac\nAutoCAD for Mac 使用 **Blocks** 调色板将块插入到绘图中，这通常是 Mac 界面的最佳方法。\n\
  \n在本节中，你学习了如何创建和插入带有属性的新块。块中的属性为块提供更多信息，使绘图的接收者能够看到并理解块代表什么以及携带什么数据。例如，表示门的块可以显示显示门尺寸和制造商的属性。在下一节中，你将学习如何使用增强属性编辑器编辑现有块属性。\n\
  \n## 使用增强属性编辑器编辑块中的属性\n\n你应该已经从上一节打开了 New Office Design.dwg 练习文件。确保你仍已缩放至插入 PC_Attributes\
  \ 块到桌子上的绘图部分。\n\n你现在将在绘图中使用增强属性编辑器来更改显示的块属性。编辑属性有时对于在绘图中获得更高的可见性很有用，或者需要减小字体大小以提高清晰度。\n\
  \n你将通过以下工作流程来实现：\n\n- 1. 将鼠标悬停在 PC_Attributes 块上，然后双击它。由于块中包含属性，增强属性编辑器将出现，如图 10.17\
  \ 所示。它默认在编辑器的属性选项卡中。你现在可以编辑块中的属性，而无需炸开块并重新处理属性。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_277_0.png)\n\
  \n图 10.17：增强属性编辑器，属性选项卡已选中\n\n- 2. 选择 **PC_ID** 属性，属性值将在 **Value** 字段中显示。将 **PC_ID**\
  \ 属性值更改为 **PC100**。你将在编辑器中看到此更新，并在绘图中预览。\n\n- 3. 在编辑器中选择 **Text Options** 选项卡。请注意，在编辑器顶部，你可以看到正在处理的块和属性（使用箭头指示）。你还可以使用\
  \ **Select block** 图标（也使用箭头指示）选择另一个带属性的块进行操作。所有这些都显示在 *图 10.18* 中。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_278_0.png)\n\
  \n图 10.18：文本选项选项卡设置\n\n- 4. 将 **Width Factor** 值从 `1` 更改为 `0.6`，如 *图 10.18* 所示。单击\
  \ **Apply** 以查看 **PC_ID** 属性的文本宽度发生变化。此时 *不要* 单击 **OK**。\n\n- 5. 选择 **Properties**\
  \ 选项卡。使用 **Color** 下拉菜单，将颜色更改为 **Green**，如 *图 10.19* 所示。如前所述，单击 **Apply** 以查看属性中的更改。\n\
  \n### AutoCAD for Mac\n**Enhanced Attribute Editor** 在 AutoCAD for Mac 中以相同方式工作。\n\
  \n下一节将带你进入使用 **Block Attribute Manager**（*BATTMAN*）进行属性编辑的更高级别。\n\n## 使用块属性管理器（BATTMAN）\n\
  \n对于本节，你可以继续使用 New Office Design.dwg 文件。然而，在我们正式开始之前，是时候来点 CAD 幽默了。块属性管理器命令称为 BATTMAN。如果你输入\
  \ BATTMAN 并按 *Enter*，你将激活 **Block Attribute Manager**。你可能不需要被告知这与某位超级英雄有关，当你为块属性苦恼时，总有一点幽默在其中；你呼叫\
  \ BATTMAN，对吧？\n\n在本节中，你将学习如何使用 **Block Attribute Manager** 进一步编辑 PC_Attributes 块中的属性，学习更多处理块中属性的技能。让我们来看一下涉及的步骤：\n\
  \n- 1. 仍在 New Office Design.dwg 文件中，确保你仍已缩放至上一节中放置 PC_Attributes 块的位置。\n- 2. 在没有命令运行或对象被选择的情况下，输入\
  \ BATTMAN。动态输入将自动在建议菜单上显示文本。按 *Enter*，**Block Attribute Manager** 对话框将出现在屏幕上，如 *图\
  \ 10.21* 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_280_0.png)\n\n图 10.21：块属性管理器（BATTMAN）\n\
  \n- 3. 使用 **Select block** 图标（显示在 *图 10.21* 中），然后你可以选择你的 PC_Attributes 块。\n\n- 4.\
  \ 你将被返回到对话框，现在可以看到 PC_Attributes 块的属性显示，如 *图 10.22* 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_281_0.png)\n\
  \n*图 10.22：块属性管理器中显示块属性*\n\n- 5. 你可以在 **Block Attribute Manager** 对话框中执行许多块属性编辑任务，你将学习如何编辑属性在下次插入带属性的块到绘图时出现的\
  \ **Edit Attributes** 对话框中的顺序。\n\n请注意 *图 10.22* 中属性的顺序。它们如下：**EMP_ID, PC_MANU,**\
  \ 和 **PC_ID**。这就是它们在 **Edit Attributes** 对话框中显示的方式。然而，它们在块放置到绘图后显示为 **PC_ID, PC_MANU,**\
  \ 和 **EMP_ID**。你将使用 **Block Attribute Manager** 重新排列它们。\n\n\n\n\n\n6. 在属性列表中选择 **PC_ID**。在对话框中使用\
  \ **Move Up** 按钮将其移动到属性列表顶部。使用 **Move Up** 和 **Move Down** 在选择属性时，改变列表顺序，使其与 *Figure\
  \ 10.23* 中显示的顺序一致。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_282_0.png)\n\nFigure\
  \ 10.23: The reordered attribute list\n\n7. 点击 **Apply** 然后点击 **OK**，确保更改已应用。**Block\
  \ Attribute Manager** 现在将关闭。\n\n8. 使用上一节学到的技能，在绘图中插入另一个 `PC_Attributes` 块的实例。你可以放置在任何位置，因为你需要查看的是属性。插入块后，可以使用对象捕捉重新定位。\n\
  \n9. 点击定位块后会出现 **Edit Attributes** 对话框，如 *Figure 10.24* 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_283_0.png)\n\
  \nFigure 10.24: The Edit Attributes dialog box\n\n10. Edit Attributes 对话框中的属性顺序已更改，以匹配绘图中属性的显示顺序，这是使用\
  \ Block Attribute Manager (BATTMAN) 更改的结果。这是一个很好的视觉节省时间的方法，因为你现在可以按与绘图中显示相同的顺序检查和编辑属性，从而减少错误。\n\
  \n### AutoCAD for Mac\n\nBlock Attribute Manager (BATTMAN) 调色板在 AutoCAD for Mac\
  \ 中以相同的方式工作。\n\n你现在可以创建和管理自己的带属性的块，从头开始开发，并将它们保存在你的 DWG 文件中。你也可以使用 Enhanced Attribute\
  \ Editor 和 Block Attribute Manager (BATTMAN) 编辑和管理你的块属性。\n\n随着你构建 AutoCAD 知识，你可以尝试使用这两种工具来开发广泛的块库，通过在第\
  \ 9 章中学到的技能为你的带属性块创建块库，有效地管理你的库。\n\n你可以在 Autodesk 网站上了解更多关于 AutoCAD 块属性的信息：\n\n\
  https://help.autodesk.com/view/ACD/2023/ENU/?guid=GUID-67A2DDAD-2217-412F-8AEF-D4495192F45B\n\
  \n你现在知道如何在 AutoCAD 块中处理、编辑和管理你的属性，并且利用 *Chapter 9* 中获得的知识，这些带属性的块可以添加到在 **Blocks**\
  \ 调色板中引用的块库绘图中，或者你可以开发自己的工具调色板。\n\n## Summary\n\n在本章中，你学习了如何在 AutoCAD 块中创建和编辑属性，并在\
  \ DWG 文件中插入该块。\n\n你还学习了如何使用 **Enhanced Attribute Editor** 编辑单个属性属性。此外，使用 **Block\
  \ Attribute Manager** (*BATTMAN*)，你学习了如何处理和管理块属性。\n\n当在绘图中使用带属性的块时，有效的块属性管理非常重要。信息必须准确无误，并在绘图中有效显示。\n\
  \n当你在大型项目上使用 AutoCAD 绘图时，本章中学到的技能将为你提供良好的基础和理解，了解如何在你的 AutoCAD 设计中开始实施带属性的块。\n\n\
  本章使用的工具展示了属性对于通过绘图向 CAD 团队和项目利益相关者传达块信息的重要性，从而节省宝贵时间。在下一章中，我们将更深入地研究动态块，以便你学习如何创建和管理动态块，添加参数和操作。\n"
- "# 11 Creating a Dynamic Block with Parameters and Actions\n\n在上一章中，你学习了如何在 AutoCAD\
  \ 块中创建属性。在本章中，你将了解这些块属性如何应用于你将创建的动态块。然而，你将专注于创建具有参数和操作的动态块。\n\n正如你所知，块是由多个 AutoCAD\
  \ 对象组成的用于内容重用的对象，例如椅子或桌子，以避免在绘图中重复重新制作该椅子或桌子。将椅子或桌子制作成动态块可以使块本身更具多功能性，提供快速轻松地操作块的能力。\n\
  \n动态块需要参数和相关的操作，因此如果你正在处理代表门的块，你可能需要添加参数和操作来控制门在绘图中门洞中的摆动方向。AutoCAD 为动态块提供了许多参数和操作，本章涵盖了一些你在绘图中开始使用它们所需的方法。\n\
  \n在本章中，你将学习将动态参数和操作添加到块中将使它们更具多功能性，并允许在 AutoCAD 绘图中更轻松地操作块。\n\n本章涵盖以下主题：\n\n- Creating\
  \ the regular door block\n- Adding a vertical flip to the door\n- Adding a horizontal\
  \ flip to the door\n- Testing the new dynamic block in the drawing\n\n### Exercise\
  \ file\n\n你需要使用练习文件 `New Office_Dynamic Blocks.dwg` 来完成本章。\n\n### Creating the regular\
  \ door block\n\n在本节中，我们将使用 AutoCAD 对象创建一个常规门块，然后使其动态化。在 **Model** 选项卡中打开练习文件并放大到门洞。放大到门洞后，你将看到用于制作常规门块的对象。有两个对象：一个矩形多段线和一个圆弧。两者都在图层\
  \ 0 (**zero**) 上。创建常规门块时，确保包含这两个对象，以便块在使用时在视觉上完整显示。你可以在 *Figure 11.1* 中看到，两个对象都被选中，并显示蓝色夹点。\n\
  \n![](img/e5541e806f2ef46a4958b6c3d0b346a9_286_0.png)\n\n*Figure 11.1: The objects\
  \ to be used to make the regular door block*\n\n要创建门块，请按照以下步骤操作：\n\n1. 在功能区上选择 **Insert**\
  \ 选项卡，同时选择两个对象。然后，在 **Block Definition** 面板上点击 **Create Block (BLOCK)**，如 *Figure\
  \ 11.2* 所示。\n\n   ![](img/e5541e806f2ef46a4958b6c3d0b346a9_286_1.png)\n\n   *Figure\
  \ 11.2: The Create Block (BLOCK) command on the Block Definition panel*\n\n2. **Block\
  \ Definition** 对话框将出现。在 **Name** 字段中，输入块名称 Door-DYN（*DYN* 是 dynamic 的缩写）。\n3. 点击\
  \ *Figure 11.3* 中的 **Pick point** 图标。\n\n   ![](img/e5541e806f2ef46a4958b6c3d0b346a9_287_0.png)\n\
  \n   Figure 11.3: The Pick point icon in the Block Definition dialog box\n\n4. 你将被带入绘图以选择块的插入点。选择\
  \ Endpoint 对象捕捉，如 Figure 11.4 所示。\n\n   ![](img/e5541e806f2ef46a4958b6c3d0b346a9_288_0.png)\n\
  \n   Figure 11.4: The Endpoint object snap to be used as the insertion point\n\n\
  5. 点击 Endpoint 对象捕捉将使你返回到 Block Definition 对话框。请注意由于使用对象捕捉而在对话框中显示的 X 和 Y 坐标的精确度。你现在需要设置创建动态门块所需的所有设置。\n\
  \n![](img/e5541e806f2ef46a4958b6c3d0b346a9_290_0.png)\n\nFigure 11.6: Block Editor\
  \ open, ready to create the dynamic block\n\n你的门块现已创建，准备开始添加动态参数和操作。接下来的两个部分将解释如何在\
  \ AutoCAD 中使用 Block Editor 为你的动态门块添加参数和操作。\n\n> Tips and tricks #31\n> 当选择对象以创建\
  \ AutoCAD 块时，在点击 Create Block (BLOCK) 命令之前先选择构成块的对象通常更有益。为了确保你可以这样做，你需要在 Options\
  \ 对话框的 Selection 选项卡中勾选 Noun/verb selection，如 Figure 11.7 所示。你可以从应用程序菜单、右键单击快捷菜单打开\
  \ Options 对话框，或输入 OPTIONS 并按 Enter。\n\n\n\n\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_291_0.png)\n\
  \n图 11.7：选项对话框中的“选择”选项卡\n\n默认情况下，AutoCAD 选项对话框中的“名词/动词选择”应处于开启状态。在处理常规块和动态块之前，务必检查此功能是否已开启。\n\
  \n> AutoCAD for Mac\n> AutoCAD for Mac 创建块的方法与此非常相似。“创建块（BLOCK）”命令位于左侧菜单中。\n\n##\
  \ 为门添加垂直翻转\n\n在本章上一节的第 8 步中，你在“块定义”对话框中勾选了“在块编辑器中打开”，然后点击“确定”。这将打开 AutoCAD 中的块编辑器，如图\
  \ 11.6 所示。\n\n在本节中，你将学习如何添加垂直翻转参数并对其应用翻转动作，从而能够在绘图中翻转动态块的竖直门扇摆动。\n\n块编辑器中的主要选项板是“块编写选项板”，在块编辑器中如图\
  \ 11.8 所示。它包含创建即将添加到动态门块中的垂直翻转参数所需的全部工具。\n\n请注意，在放置任何**翻转**参数和动作之前，需要先放置一个**基点**参数。**基点**没有相关联的动作，但正如其名，它提供一个*基点*，用于将动态块插入到绘图中。保持停留在**块编写选项板**中，按以下步骤操作：\n\
  \n- 1. 选择**参数**选项卡，然后选择**基点**参数，如图 11.8 中箭头所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_292_0.png)\n\
  \n图 11.8：带有基点箭头指示的“参数”选项卡\n\n- 2. 在提示下，选择门左下角的**端点**对象捕捉。这将在门块上显示**基点**符号，如图 11.9\
  \ 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_293_0.png)\n\n图 11.9：显示在左下角端点处的基点参数\n\
  \n- 3. 返回到“参数”选项卡，然后选择“翻转”参数，如图 11.10 中箭头所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_293_1.png)\n\
  \n图 11.10：块编写选项板上的“参数”选项卡\n\n- 5. 选择**两点之间的中点（M2P）**。系统会提示你指定**中点的第一点**。选择矩形左下角的**端点**捕捉，如图\
  \ 11.12 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_295_0.png)\n\n图 11.12：用作两点之间中点的第一点的端点捕捉\n\
  \n- 6. 随后会提示你指定第二点。使用圆弧末端的**端点**捕捉，如图 11.13 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_295_1.png)\n\
  \n图 11.13：圆弧末端的端点捕捉\n\n- 7. 现在你会看到，你正在使用的点正好是先前所选两点之间的中点，因此命名为**两点之间的中点**。向上移动光标，确保状态栏上的**极轴追踪**（*POLAR*）处于激活状态。将垂直反射线沿极轴追踪线向上移动，穿过并越过圆弧，如*图\
  \ 11.14*所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_296_0.png)\n\n图 11.14：使用极轴追踪将垂直反射线穿过圆弧\n\
  \n- 8. 单击以放置垂直反射线。系统会提示你指定参数标签位置，如*图 11.15*所示。单击将标签放置在反射线附近。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_296_1.png)\n\
  \n图 11.15：放置垂直反射线标签\n\n- 9. 垂直**翻转**参数现已放置。选择该参数，右键单击，然后在快捷菜单中选择**特性**。在**特性**选项板中，将**翻转名称**属性标签重命名为\
  \ `Flip_VERT`，如*图 11.16*所示。\n\n- 10. 按*Enter*确认名称更改，然后点击选项板标题栏上的**X**符号关闭**特性**选项板。按几次*Esc*取消选择该参数。\n\
  \n![](img/e5541e806f2ef46a4958b6c3d0b346a9_297_0.png)\n\n图 11.16：特性选项板上的属性标签名称\n\
  \n现在需要将**翻转**动作应用到该参数，如参数上显示的小黄色感叹号所示。\n\n- 11. 选择**块编写选项板**上的**动作**选项卡，如*图 11.17*所示。其中也会显示**翻转**动作。\n\
  \n![](img/e5541e806f2ef46a4958b6c3d0b346a9_298_0.png)\n\n图 11.17：块编写选项板上的“动作”选项卡\n\
  \n- 12. 单击**翻转**动作，系统会提示你选择参数。选择 **Flip_VERT** 参数。随后会提示你选择对象。确保选择构成门块和 **Flip_VERT**\
  \ 参数的*全部*对象。按*Enter*确认选择。\n\n- 13. 小黄色感叹号消失，一个翻转动作符号出现在代表翻转参数的蓝色箭头（称为翻转夹点）旁边，如图\
  \ 11.18 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_299_0.png)\n\n图 11.18：翻转动作已完全应用到翻转参数\n\
  \n现在，你已经在块编辑器中完整应用了垂直翻转参数和翻转动作。\n\nAutoCAD for Mac\nMac 上的 AutoCAD 用户可以使用 macOS\
  \ 界面应用上一节的工作流程。在 AutoCAD for Mac 中，在块编辑器中添加参数和动作的流程与之前几乎完全相同。\n\n在下一节中，你将学习如何为动态门块应用水平翻转参数和翻转动作，从而可以在竖直和水平两个方向翻转门扇摆动。请继续停留在块编辑器中，准备进入下一节。\n\
  \n## 为门添加水平翻转\n\n请继续停留在块编辑器中，执行以下工作流程，以放置水平翻转参数和动作：\n\n- 1. 单击“块编写选项板”中的“参数”选项卡。\n\
  - 2. 按照上一节中的操作方法，选择“翻转”参数。系统会提示你指定反射线的基点。使用对象捕捉，单击门矩形左下角的“端点”，如图 11.19 所示。该点与你在“基点”参数中选择的点相同。\n\
  \n![](img/e5541e806f2ef46a4958b6c3d0b346a9_300_0.png)\n\n图 11.19：门矩形上的端点对象捕捉\n\n\
  - 3. 在提示指定反射线的第二点时，单击圆弧右下角的“端点”对象捕捉，如图 11.20 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_300_1.png)\n\
  \n图 11.20：水平反射线的第二点\n\n- 4. 在门圆弧右侧单击一点。系统会提示你放置默认参数标签，如图 11.21 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_301_0.png)\n\
  \n图 11.21：放置参数标签\n\n- 5. 单击以放置参数标签。翻转夹点会出现在反射线第一点的左侧。你可以像使用任何其他 AutoCAD 夹点一样，单击该夹点并使用出现的蓝色夹点将其移动到门扇摆动的中间位置。如图\
  \ 11.22 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_301_1.png)\n\n图 11.22：使用夹点重新定位翻转夹点\n\
  \n- 6. 重新放置好*翻转夹点*后，按几次*Esc*取消选择该夹点。\n\n- 7. 单击参数标签并右键单击。在快捷菜单中选择**特性**，以打开**特性**选项板。在**特性**选项板中，将参数标签重命名为\
  \ `Flip_HORIZ`，如图 11.23 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_302_0.png)\n\
  \n图 11.23：在特性选项板中重命名参数标签\n\n- 8. 按*Enter*确认**特性**选项板中的新参数名称，然后关闭选项板。新参数名称将显示在**块编辑器**中。按几次*Esc*取消选择该参数。\n\
  \n- 9. 参数上的黄色感叹号表示需要应用动作。选择**块编写选项板**上的**动作**选项卡，然后选择**翻转**动作。\n\n\n\n\n\n10. 在提示下，选择新的**Flip_HORIZ**参数。随后将看到**选择对象**提示，如图\
  \ 11.24 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_303_0.png)\n\n图 11.24：水平翻转动作的“选择对象”提示\n\
  \n11. 选择**块编辑器**中的*所有*对象，包括**基点**参数（图 11.24 中显示了全部选定对象）以及垂直**翻转**参数和动作。按 *Enter*\
  \ 确认选择，此时动态门块应如图 11.25 所示。\n\n图 11.25：块编辑器中已完成参数和动作的门块\n\n为了确保所有参数都具有关联的动作，界面中不应显示黄色感叹号。另外，请注意已重命名的\
  \ Flip 参数：Flip_VERT 和 Flip_HORIZ。\n\n+   12. 现在可以使用“测试块”功能测试新的动态块。在块编辑器的“打开/保存”面板中单击“测试块”，如图\
  \ 11.26 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_304_0.png)\n\n图 11.26：“打开/保存”面板中的“测试块”功能\n\
  \n13. 单击**测试块**后，系统会将你带到测试区域。单击门块将其选中。此时将看到两个*翻转夹点*和左下方的夹点。左下方的夹点是使用**基点**参数创建的。*图\
  \ 11.27* 显示了测试区域中选定的动态门块。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_305_0.png)\n\
  \n图 11.27：测试区域中选定的动态门块\n\n14. 单击*翻转夹点*，测试它们是否都能分别在垂直和水平方向上翻转门的开启方向。测试完成后，单击功能区上的**关闭测试块**（由绿色复选标记指示）。\n\
  \n15. 系统将返回**块编辑器**。单击功能区上的**关闭块编辑器**（同样由绿色复选标记指示）。\n\n16. 在提示下，选择保存对**Door-DYN**动态块所做的更改。系统将返回\
  \ AutoCAD 图形。\n\n17. 图形中的门块现在已成为动态门块**Door-DYN**。选择该块，并使用功能区“**主页**”选项卡上的**图层**下拉列表，确保它位于**Doors**图层上。同时，将**Doors**设置为当前图层，以确保之后插入的任何块都位于适当的图层上。**Door-DYN**块应如*图\
  \ 11.28* 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_306_0.png)\n\n图 11.28：图形中的\
  \ Door-DYN 块\n\n18. 按 *Esc* 键几次，确保取消选择**Door-DYN**动态块。\n\n19. 确保保存图形，以便将块定义保存到 DWG\
  \ 文件中。\n\n现在，你已经成功创建了一个带有垂直和水平**翻转**动作的动态门块，可以在两个方向上改变门的开启方向。\n\n## 在图形中测试新的动态块\n\
  \n在上一节中，你学习了如何使用**块编辑器**将普通门块转换为动态块。在本节中，你将通过在当前图层上插入该块，并使用添加到动态块中的**翻转**动作，对其进行完整测试。\n\
  \n以下工作流程将帮助你完整测试动态门块：\n\n1. 在功能区的“**主页**”选项卡中，检查“图层”面板上的**Doors**图层是否为当前图层。确保已缩放到图形中门块所在的区域。\n\
  \n2. 选择门块并单击鼠标右键。在快捷菜单中，单击**删除**以移除块实例。现在应只剩下门洞，如*图 11.29* 所示。\n\n图 11.29：删除块后的门洞\n\
  \n3. 单击功能区上的“插入”选项卡，然后单击左侧的“插入”下拉列表。你可以在图 11.30 所示的下拉列表中看到 Door-DYN 块。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_307_0.png)\n\
  \n图 11.30：“插入”下拉列表中的 Door-DYN 动态块\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_307_1.png)\n\
  \n4. 在下拉列表中选择**Door-DYN**块，将其插入图形。你会看到该块跟随光标移动，并使用了设置在块左下角的**基点**参数。如*图 11.31* 所示。\n\
  \n![](img/e5541e806f2ef46a4958b6c3d0b346a9_308_0.png)\n\n图 11.31：标示出基点参数的 Door-DYN\
  \ 块\n\n5. 将块定位到门洞左侧的**中点**对象捕捉处，如*图 11.32* 所示。单击**中点**以确认块的位置。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_309_0.png)\n\
  \n图 11.32：使用中点对象捕捉定位块\n\n6. 现在块已定位，可以测试动态门块中的**翻转**动作。单击块将其选中，此时将显示*翻转夹点*，如*图 11.33*\
  \ 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_309_1.png)\n\n图 11.33：显示翻转夹点的已定位动态块\n\
  \n随着你通过本书逐步积累 AutoCAD 知识，可能会希望抽出一些时间来试验动态块及其在 AutoCAD 图形中的作用。动态块还可以与块属性结合使用，从而创建能够节省宝贵制图时间的块。\n\
  \n你可以在 Autodesk 网站上进一步了解 AutoCAD 中的动态块：https://help.autodesk.com/view/ACD/2024/ENU/?guid=GUID-2A3D92B8-20E2-47B3-92CE-FB3EB03888C3。\n\
  \n## 总结\n\n现在，你已经了解如何使用、编辑和管理动态块。结合前面章节中学到的知识，你可以开始考虑开发块库，其中不仅包含普通 AutoCAD 块，还包含带有块属性的动态块。\n\
  \n在本章中，你学习了如何使用 AutoCAD 对象创建普通门块，并将该门块制作成动态块。\n\n通过使用参数和动作，你学习了如何为普通门块添加动态功能，使其能够表示垂直和水平两种门开启方向。\n\
  \n随后，你在图形中测试了动态门块，以确保动态参数的功能正常。\n\n动态块是减少繁琐编辑任务耗时的有效方式。你可以通过在块中使用动态动作，创建能够旋转、延长和翻转的动态块，而不必先选择块，再从功能区的**修改**面板中执行单一操作。\n\
  \n在大型项目中处理 AutoCAD 图形时，本章所学技能将帮助你充分理解：为日常 AutoCAD 工作流程和处理过程开发动态块，可以节省大量时间。\n\n本章中使用的简单工具展示了动态块在\
  \ CAD 团队图形中的重要作用。\n\n在下一章中，我们将更深入地研究动态块，以便你学习如何在动态块中创建和管理*可见性状态*，并添加相关参数和动作。\n"
- '# 12 创建带有可见性状态的动态块


  在上一章中，你学习了如何创建一个应用了两个**翻转**动作及其关联参数的动态块。本章将教你如何创建另一个带有可见性状态的动态块。**可见性状态**允许你在同一个块中创建多个视图。例如，同一个块可能存在不同变体，如左手型和右手型办公桌。本章将介绍如何创建一个具有三种不同视图的洗手盆块：顶视图、前视图和侧视图。


  正如前面章节所知，块是由多个 AutoCAD 对象组成的对象，用于重复使用内容；而动态块则为块本身提供了更大的灵活性，使你能够快速、轻松地操控块。在本章中，你将为一个动态块中的洗手盆提供不同视图，从而无需再插入具有不同洗手盆视图的其他普通块。


  本章将介绍以下方法，你将需要使用这些方法在 AutoCAD 图形中处理洗手盆动态块：


  - 创建洗手盆块图形

  - 添加每种视图所需的块

  - 在动态块中添加可见性状态

  - 使用带有可见性状态的新动态块


  与上一章一样，为 AutoCAD 块添加更多功能并使其动态化，可以轻松重复使用图形内容。在本例中，你将学习可见性状态如何使块能够显示所表示对象的不同视图。






  ## 练习文件


  对于本章，你需要使用标题为 *Washbasin-DYNAMIC.dwg* 的练习文件。


  ## 创建洗手盆块绘制


  在本节中，我们将使用 AutoCAD 对象来创建用于动态块的各个洗手盆块。首先，在 **Model** 选项卡中打开文件并放大以查看洗手盆的三个视图。你会看到用于制作常规洗手盆块的对象。从左到右，它们分别是正面、顶部和侧面。每个视图都由图层
  **0**（零）上的 AutoCAD 对象组成，如 *Figure 12.1* 所示。


  ![](img/e5541e806f2ef46a4958b6c3d0b346a9_314_0.png)


  Figure 12.1: The objects to be used to make the washbasin blocks


  ## 添加正面块


  动态块中需要创建三个可见性状态。你将首先从正面块开始。


  按照以下步骤创建正面块：


  - 1. 首先，你将创建由左侧正面视图构成的对象的一个常规块。选中所有对象（如下图所示，所有夹点均显示在 *Figure 12.2* 中），选择功能区的 **Insert**
  选项卡。


  ![](img/e5541e806f2ef46a4958b6c3d0b346a9_314_1.png)


  Figure 12.2: The objects for the front view selected, with grips displayed


  2. 在 **Block Definition** 面板上点击 **Create Block** (*BLOCK*)，如图 12.3 所示。


  ![](img/e5541e806f2ef46a4958b6c3d0b346a9_315_0.png)


  Figure 12.3: The Create Block (BLOCK) command on the Block Definition panel


  3. **Block Definition** 对话框将会出现。在 **Name** 字段中，输入块名称 Washbasin_FRONT。


  4. 点击如图 12.4 所示的 **Pick point** 图标。


  ![](img/e5541e806f2ef46a4958b6c3d0b346a9_315_1.png)


  Figure 12.4: The Pick point icon in the Block Definition dialog box


  5. 你将被带入绘图以选择块的插入点。选择如图 12.5 所示的 Midpoint 对象捕捉。


  ![](img/e5541e806f2ef46a4958b6c3d0b346a9_316_0.png)


  Figure 12.5: The Midpoint object snap to be used as the insertion point


  6. 点击 Midpoint 对象捕捉后，你将返回到 Block Definition 对话框。注意由于使用了对象捕捉，对话框中 X 和 Y 坐标的精确度。你现在必须设置创建动态门块所需的所有设置。


  7. 参考图 12.6，并在 Block Definition 对话框中按所示设置所有必要的设置。


  Figure 12.6: The Block Definition dialog box with all required settings


  - 8. 在对话框中设置好所有必要的设置后，点击 OK。


  - 9. 对话框将关闭，你的对象现在在绘图中成为一个块引用。为了检查对象是否已转换为块，将鼠标悬停在洗手盆正面视图上，AutoCAD 将提供工具提示，如图 12.7
  所示。如果该工具提示显示为 Block Reference，则说明对象已转换为块。


  Figure 12.7: The Washbasin_FRONT block indicated by the tooltip


  10. 多次按下 *Esc* 以确保你已取消选择块。


  你现在必须执行相同的流程（*Steps 1–10*）来创建 `Washbasin_TOP` 和 `Washbasin_SIDE` 块。


  ## 添加顶部和侧面块


  你现在需要重复该流程以添加顶部和侧面块。这些块以及正面块将构成动态块中的一个可见性状态。请按照以下步骤操作：


  - 1. 重复前面针对 `Washbasin_TOP` 块的流程 *Step 1*；在点击 **Create Block** (*BLOCK*) 之前，确保你已选择构成洗手盆顶视图的对象。


  - 2. 在 **Name** 字段中输入名称 `Washbasin_TOP`。


  - 3. 在 **Block Definition** 对话框中使用 **Pick point** 工具时，你必须选择 *Figure 12.8* 中所示的 **Midpoint**
  对象捕捉。


  ![](img/e5541e806f2ef46a4958b6c3d0b346a9_318_0.png)


  Figure 12.8: The Midpoint object snap for the Washbasin_TOP block


  - 4. 检查 **Block Definition** 对话框中的其他所有设置是否与 *Figure 12.6* 中所示相匹配，然后点击 **OK**。


  - 5. 将鼠标悬停在新块上以检查工具提示是否显示 **Block Reference**，如 *Figure 12.9* 所示。如果是，则你已创建了 Washbasin_TOP
  常规块。


  ![](img/e5541e806f2ef46a4958b6c3d0b346a9_319_0.png)


  Figure 12.9: The finished Washbasin_TOP block


  - 6. 再次重复从 *Step 1* 开始的块创建流程，你现在可以开始创建 Washbasin_SIDE 块。

  - 7. 确保在点击 **Create Block** (*BLOCK*) 之前选择构成洗手盆侧视图的对象。

  - 8. 在 **Name** 字段中输入名称 `Washbasin_SIDE`。

  - 9. 该块的细节更丰富一些，在使用 **Block Definition** 对话框中的 **Pick point** 工具时，你需要考虑洗手盆拐角处的曲线。你需要选择一个
  **Object Tracking** 点，因为洗手盆拐角上有曲线。

  - 10. 你必须确保状态栏上的 **Polar Tracking** (*POLAR*)、**Object Snap Tracking** (*AUTOSNAP*)
  和 **Object Snap** (*OSNAP*) 处于活动状态，如 *Figure 12.10* 所示。如果它们处于活动状态，将以淡蓝色显示。然后你可以使用这些绘图设置来选择所需的
  **Object Tracking** 点。


  ![](img/e5541e806f2ef46a4958b6c3d0b346a9_319_1.png)


  Figure 12.10: The settings required on the status bar


  11. 放大洗手盆侧视图对象的右上角，如 *Figure 12.11* 所示。


  ![](img/e5541e806f2ef46a4958b6c3d0b346a9_320_0.png)


  12. 在 **Block Definition** 对话框中点击 **Pick point**。


  13. 将鼠标悬停在 *Figure 12.12* 所示的两个 **Endpoint** 对象捕捉上，*不要* 点击它们。将鼠标悬停在对象捕捉上会将其用作跟踪点而不是对象捕捉，从而使你能够找到所需的
  **Object Tracking** 点。


  ![](img/e5541e806f2ef46a4958b6c3d0b346a9_320_1.png)


  ## AutoCAD for Mac


  AutoCAD for Mac 使用非常相似的方法来创建具有可见性状态的动态块。Create Block (BLOCK) 命令位于左侧菜单上。


  ## 添加每个视图所需的块


  在本章前一节中，你学习了如何制作构成洗手盆每个视图的常规块。本节将把这些块带入新的洗手盆动态块中，准备形成相关的可见性状态。


  仍在 Washbasin-DYNAMIC.dwg 文件中，你现在需要按照以下步骤开始开发洗手盆动态块：


  - 1. 要在 Block Editor 中创建新块，可以直接在 Insert 功能区选项卡的 Block Definition 面板上使用 Block Editor
  图标，如图 12.15 所示。


  ![](img/e5541e806f2ef46a4958b6c3d0b346a9_323_0.png)


  Figure 12.15: The Block Editor icon on the Block Definition panel


  - 2. 你将被提示使用 Edit Block Definition 对话框编辑块定义，其中将列出之前创建的所有常规块，如图 12.16 所示。


  ![](img/e5541e806f2ef46a4958b6c3d0b346a9_323_1.png)


  Figure 12.16: The Edit Block Definition dialog box


  ![](img/e5541e806f2ef46a4958b6c3d0b346a9_325_0.png)


  Figure 12.18: The Midpoint object snap on the Washbasin_TOP block


  8. 重复从 Insert 下拉菜单开始的流程，但这次插入 Washbasin_FRONT 块。同样，在 Specify insertion point 提示时，使用
  Washbasin_TOP 块上的 Midpoint 对象捕捉来放置块，如图 12.19 所示。


  ![](img/e5541e806f2ef46a4958b6c3d0b346a9_325_1.png)


  Figure 12.19: Reusing the Midpoint object snap on the Washbasin_TOP block


  9. 你现在在 Block Editor 中可以看到三个常规块的 somewhat jumbled 视图，如图 12.20 所示。


  ![](img/e5541e806f2ef46a4958b6c3d0b346a9_326_0.png)


  Figure 12.20: The three regular blocks placed in Block Editor


  你现在已放置了三个块，并且需要开始添加可见性状态。


  > **AutoCAD for Mac**

  > 在 AutoCAD for Mac 中，将常规块添加到 Block Editor 的工作流程相同。


  此时，仍留在 Block Editor 中并且不要保存任何内容，因为在下一节中，我们开始工作流程的第二部分，你将开始为 Washbasin_DYN 动态块添加可见性状态。


  ## 在动态块中添加可见性状态


  在上一节中，你学习了如何将常规块插入 Block Editor，以创建新的 Washbasin_DYN 动态块。在本节中，你将为每个常规块开发相关的可见性状态，为
  Washbasin_DYN 动态块中的每个块提供一个视图。所有可见性状态都存储在一个动态块中，当该动态块插入到绘图中时，你可以选择要显示的可见性状态。这节省了时间，避免了为每个洗手盆视图使用三个常规块的需要。






  - 4. 在**块编写选项板**中，单击**可见性**，如图*12.22*所示。


  ![](img/e5541e806f2ef46a4958b6c3d0b346a9_328_0.png)


  图12.22：块编写选项板，其中标出了可见性参数


  - 5. 系统将提示您指定参数的位置。您需要选择一个靠近常规块但不在其正上方的点，如图*12.23*所示。这是因为**可见性**参数在图纸中使用动态块时会显示出来。


  ![](img/e5541e806f2ef46a4958b6c3d0b346a9_328_1.png)


  图12.23：放置在块编辑器中的可见性参数


  - 6. 您会看到如*第11章*中那样的*黄色感叹号*，这意味着**可见性**参数需要更多信息才能正常工作。在这种情况下，它需要对象（常规块）来表示动态块中的每个可见性状态。您不需要为该参数命名，但可以通过选中它、右键单击并在快捷菜单中选择**特性**，然后在**特性**选项板中重命名来实现。


  - 7. 查看功能区的“块编辑器”上下文选项卡（蓝色）。在*图12.24*中，找到**可见性**面板。


  ![](img/e5541e806f2ef46a4958b6c3d0b346a9_329_0.png)


  图12.24：功能区的可见性面板


  在*图12.24*中，有两个箭头指向的图标。右侧箭头指向设置AutoCAD BVMODE系统变量的图标，称为**可见性模式**。单击此图标可将BVMODE设置为开（**1**）或关（**0**）。您需要将其设置为开，因为这样设置为不可见的任何可见性状态将显示为灰色，而不是完全不可见，这样处理起来更容易。如果BVMODE设置为零（**0**），则只显示当前可见性状态。随着逐步完成此工作流程，这一点会变得更清晰。单击该图标并查看命令行，如果看到BVMODE设置为**1**，如图*12.25*所示，则一切就绪。如果显示为零（**0**），请再次单击该图标将其设置为**1**。


  ![](img/e5541e806f2ef46a4958b6c3d0b346a9_329_1.png)


  图12.25：将BVMODE系统变量设置为1


  - 8. 单击图*12.24*中所示的**可见性状态**图标。


  - 9. **可见性状态**对话框将显示默认的可见性状态**VisibilityState0**。单击**新建**，在**新建可见性状态**对话框中，将新状态名称设置为**Washbasin-SIDE**。将可见性选项设置为第三个选项“在新状态中保持现有对象的可见性不变”，如图*12.26*所示。


  ![](img/e5541e806f2ef46a4958b6c3d0b346a9_330_0.png)


  *图12.26*：新建可见性状态对话框，箭头标出设置


  - 10. 单击**确定**。随后将显示**可见性状态**对话框，如图*12.27*所示。


  ![](img/e5541e806f2ef46a4958b6c3d0b346a9_330_1.png)


  *图12.27*：可见性状态对话框


  - 11. **Washbasin-SIDE**可见性状态为当前状态，如复选标记所示。现在可以选中默认状态**VisibilityState0**，并单击**删除**将其移除。


  - 12. 单击**确定**关闭**可见性状态**对话框。现在处于**Washbasin-SIDE**可见性状态，需要设置哪些常规块可见或不可见。


  - 13. 功能区的**可见性**面板显示当前使用的可见性状态。选中显示洗手盆侧视图的常规块，如图*12.28*所示，并单击图中的绿色方块图标。这将使该块在当前可见性状态中设置为可见。


  ![](img/e5541e806f2ef46a4958b6c3d0b346a9_331_0.png)


  图12.28：选中的侧视图块被设为可见


  侧视图将被取消选择，并且现在已在该可见性状态中设置为可见。


  - 14. 选中表示顶视图和前视图的另外两个块，如图12.29所示。然后，单击图中的绿色虚线图标。这将使它们都在当前可见性状态中变为不可见。


  ![](img/e5541e806f2ef46a4958b6c3d0b346a9_332_0.png)


  图12.29：选中另外两个块以设为不可见


  - 15. 单击该图标后，这两个块将被取消选择，并且由于之前将BVMODE系统变量设置为1，它们将显示为灰色。如图12.30所示。


  ![](img/e5541e806f2ef46a4958b6c3d0b346a9_332_1.png)


  图12.30：侧视图可见的可见性状态


  您会注意到仍然有一个黄色感叹号。这是因为目前只设置了一个状态。


  ## 添加另外两个可见性状态


  还需要在动态块中设置其余两个可见性状态。本节将重复创建第一个可见性状态的过程，但您将使用另外两个常规块再创建两个可见性状态：


  - 1. 再次单击**可见性状态**图标以显示**可见性状态**对话框。单击**新建**。

  - 2. 在**新建可见性状态**对话框中，设置另一个状态名称**Washbasin-TOP**，使用与之前步骤9相同的选项。单击**确定**。

  - 3. 在**可见性状态**对话框中，新的**Washbasin-TOP**状态现在为当前状态（带复选标记）。单击**确定**。现在需要重复可见/不可见的过程。

  - 4. 确保**可见性**面板中的当前状态为**Washbasin-TOP**。然后，选中显示洗手盆顶视图的常规块，如图12.31所示。单击图12.31中所示的绿色图标，使其在当前状态中可见。


  ![](img/e5541e806f2ef46a4958b6c3d0b346a9_333_0.png)


  图12.31：将顶视图设置为可见


  - 5. 顶视图块将自动取消选择，并已在**Washbasin-TOP**可见性状态中设置为可见。请注意，黄色感叹号已消失，因为现在有不止一个可见性状态了。

  - 6. 和之前一样，必须选中表示洗手盆侧视图和前视图的块，然后在**可见性**面板中单击绿色虚线图标将它们标记为不可见。

  - 7. 同样，它们将自动取消选择。现在它们已在**Washbasin-TOP**可见性状态中被标记为不可见并显示为灰色，如图*12.32*所示。


  ![](img/e5541e806f2ef46a4958b6c3d0b346a9_334_0.png)


  图12.32：顶视图可见的可见性状态


  - 8. 再重复上述工作流程（*步骤1-7*）一次，创建第三个可见性状态**Washbasin-FRONT**，其中显示洗手盆前视图的块为可见状态。

