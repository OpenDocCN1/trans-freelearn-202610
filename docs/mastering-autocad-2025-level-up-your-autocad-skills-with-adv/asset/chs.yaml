- "# 前言\n\nAutoCAD已有四十多年的历史，并拥有众多版本。AutoCAD完整版提供2D制图功能和3D建模工具，这些工具可以进行专业的灯光和渲染处理，生成可用于专业演示的照片级可视化效果。可以创建精确的2D图形，并包含准确的制图注释，如尺寸、引线和数据表格。\n\
  \n本书鼓励读者掌握AutoCAD，介绍各种技术和流程，使读者能够更加熟练地使用AutoCAD应用程序，并运用本书所学知识来改进和增强现有的AutoCAD技能。\n\
  \n# 本书读者对象\n\n本书面向在职业生涯中已经专业使用过AutoCAD的现有用户。理想情况下，读者应已具备AutoCAD基础知识，以便理解本书中提到的概念、工作流程和过程。典型读者包括中级CAD技术人员、CAD管理人员以及日常频繁使用AutoCAD的人员。\n\
  \n# 本书内容\n\n*第1章“自定义AutoCAD界面”*，介绍AutoCAD界面以及如何快速轻松地对其进行自定义。凭借这种可自定义性，您可以快速轻松地更改AutoCAD界面，从而提高工作效率。\n\
  \n*第2章“开发自己的AutoCAD工作空间”*，帮助您学习如何有效使用AutoCAD中的工作空间，并进行必要的界面更改以创建自定义工作空间。您还将学习如何删除不需要的工作空间。\n\
  \n*第3章“巧用AutoCAD界面”*，展示AutoCAD如何提供众多功能和特性，让您能够更聪明地工作，而不是更辛苦地工作。这些功能包括文件选项卡、“模型”和“布局”选项卡、状态栏上的草绘设置、AutoCAD\
  \ ViewCube以及AutoCAD导航栏。本章教您如何有效使用这些工具，提升AutoCAD工作效率。\n\n*第4章“使用高级草绘设置”*，讲述AutoCAD及其状态栏上丰富多样的草绘设置。本章将带您了解一些较少使用的高级草绘设置，以便您通过更聪明地工作而不是更辛苦地工作来提高效率和生产力。\n\
  \n*第5章“使用对象捕捉开发高级几何图形”*，详细说明AutoCAD是一款精确的设计应用程序，绘制图形时必须保持准确性。本章将向您展示如何使用特定的草绘设置和对象捕捉（通常称为Osnaps），使您能够精确、准确地进行绘图和建模。\n\
  \n*第6章“测量和修改几何对象”*，为了达到高精度，AutoCAD用户花费大量时间修改图形中的几何对象，常常需要测量长度、面积和角度。AutoCAD提供了一套全面的草绘和建模工具，可快速准确地修改和测量DWG文件中的几何图形。\n\
  \n*第7章“开发注释性标注样式”*，在本章中，您将学习在DWG文件中使用注释性标注所需的方法，包括创建文字样式来管理文字大小和字体、使用标注样式管理尺寸标注、设置特定的引线样式以及使用精确的表格样式。\n\
  \n*第8章“使用注释性缩放”*，本章将带您了解如何通过设置视口和不同的视口比例、在“模型”选项卡中使用注释比例以及添加和删除对象注释比例，将注释样式与注释性缩放结合使用。这使注释能够以适当的方式显示，从而有效、准确地传达设计意图。\n\
  \n*第9章“开发块库”*，到本章结束时，您将能够处理图形中的常规块和动态块，并使用包括剪贴板在内的各种方法创建自己的块库。您还将学习如何使用“块”选项板以及将工具选项板与块结合使用。\n\
  \n*第10章“使用块属性”*，随着时间的推移，图形中会包含越来越多的块。属性使您能够识别块，并为使用图形的人员提供有价值的信息。您需要的方法都在本章中，例如在块中定义属性、使用“增强属性编辑器”编辑块中的属性，以及使用“块属性管理器”（*BATTMAN*）。\n\
  \n*第11章“创建带参数和动作的动态块”*，动态块既需要参数，也需要关联的动作，因此如果您处理的是表示门的块，可能需要添加参数和动作来控制门在图形中门洞内的开启方向。本章介绍在图形中处理这些参数和动作的方法。\n\
  \n*第12章“创建带可见性状态的动态块”*，可见性状态允许您在同一个块中创建具有多种视图的动态块。本章向您展示如何创建具有顶视图、前视图和侧视图三种不同视图的洗手盆块。\n\
  \n*第13章“共享AutoCAD图形”*，共享图形和图形视图使您能够利用互联网和云的力量，实时共享设计的各个方面。这通过提供更加动态的图形修订路径，节省了宝贵的图形管理和协作时间。\n\
  \n\n\n\n\n我们还有来自我们丰富的书籍和视频目录中的其他代码包，可在 https://github.com/PacktPublishing/ 获取。快去看看吧！\n\
  \n## Conventions used\n\n本书中使用了多种文本约定。\n\n**Filenames in text:** 表示应用于练习每个章节中演示的工作流程和流程的练习文件的文件名。以下是示例：“打开\
  \ DWG 文件可确保您获得对所有 AutoCAD 界面的访问，因此请确保 Workspaces.dwg 文件在 AutoCAD 中打开且为当前文件。”\n\n\
  **Bold:** 表示新术语、重要词语或您在屏幕上看到的词语。例如，菜单或对话框中的词语以 **bold** 显示。以下是示例：“您也可以通过 **Application**\
  \ 菜单（左上角）和 AutoCAD 中的 **Start** 屏幕访问 **New** 命令。”\n\n> **Tips and tricks #25**\n\
  > \n> 当您选择视口时，显示的不仅仅是夹点。如果您选择所选视口中央的三角形下拉按钮，您将能够看到所有可用的视口比例。如果您从现有视口比例中选择不同的比例，视口将被重新调整大小和重新缩放，如\
  \ *Figure 8.5* 所示。这在 AutoCAD for Mac 中也适用。\n\n## Get in touch\n\n我们非常欢迎读者的反馈。\n\n\
