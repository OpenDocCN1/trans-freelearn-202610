  ```\n\n您还可以在Autodesk网站上了解有关AutoCAD Web的更多信息：\n\n```\nhttps://help.autodesk.com/view/ACD/2022/ENU/?guid=GUID-B4A46563-E5CA-4A34-918C-78ADEA2FEEB4\n\
  ```\n\n关于AutoCAD移动应用程序的更多信息，请访问 https://help.autodesk.com/view/ACD/2022/ENU/?guid=GUID-20A8F96D-0ACA-49F6-A6FF-D7DD71A8D03A。在本章中，您学习了如何在AutoCAD桌面应用程序中添加新轨迹。在此过程中，您学习了如何使用轨迹工具向AutoCAD\
  \ DWG文件添加轨迹，并使用云端绘图存储为其做好协作准备。\n\n您学习了如何在AutoCAD移动应用程序中使用轨迹工具，使用iPad Pro等智能移动设备添加和编辑轨迹，以及如何学习在AutoCAD\
  \ Web中使用轨迹工具，在Web浏览器中使用AutoCAD Web添加和编辑轨迹。\n\n您还学习了如何使用AutoCAD桌面应用程序中的轨迹工具查看和编辑现有轨迹信息，编辑之前在AutoCAD移动应用程序和AutoCAD\
  \ Web中编辑的轨迹文本。\n\nAutoCAD中的轨迹在AutoCAD的所有迭代（无论是桌面应用程序、Web应用程序还是移动应用程序）中提供无缝的实时协作体验。这将用户界面扩展到了桌面之外，还扩展到浏览器或智能移动设备，使您的DWG文件完全移动化，随时可以轻松访问。所有更改都可以使用轨迹功能实时更新和协作。\n\
