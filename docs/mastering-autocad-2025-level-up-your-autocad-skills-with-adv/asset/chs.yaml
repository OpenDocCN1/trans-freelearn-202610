  ## 创建新的块库工具调色板


  AutoCAD 中的 **Tool palettes** 是另一种将块存储起来供 CAD 团队集中使用的方式。如果将块库绘图存储在中央位置，你可以拖放块到工具调色板上，工具调色板将利用该位置。然后你可以将工具调色板导入和导出给
  CAD 团队成员。


  在以下工作流程中，假设块库绘图 `Architecture-LIBRARY.dwg` 存储在中央位置。使用你在上一节中创建的块库绘图，将 **Door – Metric**
