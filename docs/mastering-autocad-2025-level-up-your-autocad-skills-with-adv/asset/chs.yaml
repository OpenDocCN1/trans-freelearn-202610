  \n## Technical requirements\n\n使用 AutoCAD 需要您在台式电脑或笔记本电脑上安装有许可版本的 AutoCAD。您还需要以下内容：\n\
  \n- AutoCAD 的订阅（许可证）。这必须是 AutoCAD 的 *full* 版本，而不是 AutoCAD LT。理想情况下，这是 AutoCAD 的最新版本：AutoCAD\
  \ 2025。您可以使用早期版本，但建议不要早于 AutoCAD 2022。\n- 为了使用订阅版 AutoCAD，您需要一个 Autodesk 账户。如果您没有，可以在\
  \ https://accounts.autodesk.com/ 上设置一个。\n- 本书涵盖在 Microsoft Windows **Operating System\
  \ (OS)** 上运行的 AutoCAD 2025。所有图表和图形均来自 AutoCAD 2024 和 Windows 11 OS。然而，本书包含适用于 Windows\
  \ 和 Mac 用户的说明。虽然为 Windows 用户提供了全面的说明，但有关 Mac 界面差异的特殊说明也已在标注框中提供。\n- 本书的所有图形和绘图均可在此找到：https://github.com/PacktPublishing/Mastering-AutoCAD-2025/tree/main。\n\
  \n好了，现在进入本章吧！\n\n## Introducing the default AutoCAD interface settings\n\n在我们深入本章其余部分并学习如何为我们自身利益调整\
  \ AutoCAD 的 UI 之前，让我们先熟悉一下默认的 AutoCAD 界面设置。这些被称为工作区。作为 AutoCAD 用户，您很可能已经在使用这些工作区，而自己却不知道。\n\
  \nAutoCAD 中可用的默认工作区如下：\n\n- **Drafting & Annotation:** Drafting & Annotation 工作区主要用于\
  \ AutoCAD 中的 2D 绘图。这是使用最广泛的 AutoCAD 工作区。\n- **3D Basics:** 3D Basics 工作区正如其名所示：用于\
  \ 3D 建模的基础 3D 界面。然而，它是一个功能有限、精简的 3D 界面，仅具有基本功能。\n- **3D Modeling:** 3D Modeling\
  \ 工作区是一个全面的 3D 工作区，包含所有 3D 功能区选项卡、面板和命令。它通常是您日常 3D 建模时使用的 3D 工作区。\n\n我现在向您介绍这些默认工作区，以便您可以检查它们的位置并确定您当前使用的是哪个工作区。要检查正在使用的工作区，您可以单击状态栏上齿轮图标右侧的弹出箭头，如\
  \ *Figure 1.1* 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_25_0.png)\n\nFigure\
  \ 1.1: The gearwheel icon on the status bar\n\n单击弹出箭头时，**Workspace** 菜单会出现。前图显示\
  \ **Drafting & Annotation** 工作区是当前工作区（由其旁边的复选标记表示）。\n\n请确保检查您使用的工作区，并且为本章目的，请确保将\
  \ **Drafting & Annotation** 工作区设为当前。我们将在 *Chapter 2* 中更深入地介绍工作区。\n\n> **AutoCAD\
  \ for Mac**\n> \n> 有些人可能在运行 macOS OS 的 Apple 电脑上使用 AutoCAD for Mac。AutoCAD for Mac\
  \ 界面与在 Windows OS 上运行的 AutoCAD 界面截然不同。AutoCAD for Mac 中的工作区工作方式不同。您将在屏幕左侧图标菜单顶部找到\
  \ AutoCAD for Mac 中的 **Drafting** 和 **Modeling** 工作区，如 *Figure 1.2* 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_25_1.png)\n\
  \nFigure 1.2: The Drafting and Modeling tabs in the AutoCAD for Mac interface\n\n\
  现在您对 AutoCAD 界面有了了解，下一个部分将介绍 AutoCAD 功能区及其设置。\n\n## Understanding the AutoCAD ribbon\
  \ settings\n\nAutoCAD 功能区是您 AutoCAD 界面的基本组成部分。它为您提供功能区选项卡，每个选项卡都包含功能区面板，其中包含您有效操作\
  \ AutoCAD 所需的大多数命令。\n\nAutoCAD 有四种功能区设置。这些有时会无意中被激活，让您以为自己弄坏了 AutoCAD。您没有，相信我！现在要弄坏\
  \ AutoCAD 可不容易！\n\n功能区设置是通过单击功能区顶部的按钮激活的。如果您眨眼，可能会错过它，许多 AutoCAD 用户都会错过。它就是那种会被点击，然后您不确定如何让它恢复到之前样子\
  \ 的按钮。\n\n如果您检查 AutoCAD 功能区的顶部，您会看到一个带箭头的小白色矩形按钮。*Figure 1.3* 显示了您将找到它的位置。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_26_0.png)\n\
  \n根据其大小，您可以理解为什么它很容易被忽略，对吧？如果您单击该按钮（而不是其右侧的弹出箭头），您将看到功能区的外观发生变化。不要惊慌。您所做的只是更改了功能区的外观。\n\
  \n这四种设置中的每一种都以不同的方式显示功能区，为您在日常 AutoCAD 工作中提供不同的使用方法。\n\n\n\n\n\n我将简要说明每个设置的工作原理。功能区的设置会根据你是否点击了功能区顶部的功能区设置按钮以及连续点击了多少次而变化：\n\
  \n- **默认功能区（无需点击）**：这是你首次开始使用 AutoCAD 时的默认功能区设置。如图 1.4 所示，它提供了所有功能区选项卡、面板和图标的视图。\n\
  \n![](img/e5541e806f2ef46a4958b6c3d0b346a9_27_0.png)\n\n图 1.4：默认功能区显示\n\n- **最小化为面板按钮（第一次点击）**：点击功能区设置按钮后第一次，你将把功能区设置为面板按钮。功能区选项卡仍然可用，但每个选项卡上的面板现在仅显示为按钮，如图\
  \ 1.5 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_27_1.png)\n\n图 1.5：使用最小化为面板按钮的功能区显示\n\
  \n点击任意面板按钮后，所选的功能区面板将会显示，如图 1.6 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_27_2.png)\n\
  \n图 1.6：使用最小化为面板按钮时选中的绘图面板\n\n上图显示 **Home** 选项卡为当前选项卡，并在点击 **Draw** 面板按钮后显示 **Draw**\
  \ 面板。\n\n正如你所见，此功能区设置通过仅显示面板按钮所选的面板，减少了功能区的占用空间，为你的 AutoCAD 绘图和建模提供了更多屏幕空间。如果你将光标移离所选面板，它将恢复为面板按钮视图。\n\
  \n- **最小化为面板标题（第二次点击）：** 点击功能区设置按钮第二次后，你将把功能区设置为 **Panel Titles**。面板现在仅显示其标题，从而进一步减少了功能区在屏幕上的占用，如\
  \ *Figure 1.7* 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_28_0.png)\n\n图 1.7：使用最小化为面板标题的功能区显示\n\
  \n点击任意面板标题后，所选的功能区面板将会显示，如 *Figure 1.8* 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_28_1.png)\n\
  \n图 1.8：使用最小化为面板标题时选中的绘图面板\n\n上图显示 **Home** 选项卡为当前选项卡，且 **Draw** 面板标题被选中。如前所述，当你将光标移离面板时，它将恢复为面板标题视图。\n\
  \n- **最小化为选项卡（第三次点击）：** 点击功能区设置按钮第三次后，你将把功能区设置为 **Tabs**。现在不再显示面板按钮或标题，只有功能区选项卡。这是\
  \ AutoCAD 中功能区最简洁的视图，如 *Figure 1.9* 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_28_2.png)\n\
  \n图 1.9：使用最小化为选项卡的功能区显示\n\n在使用最小化为选项卡设置时访问功能区面板时，你需要先选择功能区选项卡，然后在其相应面板上选择所需的命令图标，如图\
  \ 1.10 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_29_0.png)\n\n图 1.10：使用最小化为选项卡时选中的\
  \ Home 选项卡\n\n正如前图所示，所选选项卡中的所有面板都会显示。在此例中，功能区上的 Home 选项卡已被选中，显示了 Draw 面板、Modify\
  \ 面板以及功能区上 Home 选项卡下显示的所有面板\n\n> Note\n> 图 1.10 已略微裁剪以更好地适应页面。因此，仅完整显示了 Draw 和 Modify\
  \ 面板。\n\n- **返回默认（第四次点击）：** 第四次点击功能区设置按钮将带你返回默认功能区设置，如图 1.11 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_29_1.png)\n\
  \n图 1.11：第四次点击时返回默认功能区设置\n\n因此，正如你所见，很容易错误地点击功能区设置按钮并做出这些更改。如果你从未使用过功能区设置按钮，可能会产生一定的忐忑，因为你会怀疑自己对\
  \ AutoCAD 界面做了什么。然而，通过使用本节中所述的功能区设置按钮的点击序列，你现在可以在需要时返回默认功能区设置。\n\n你现在也可以看到如何更改功能区设置以满足你的特定需求。这使你能够通过减少功能区占用空间来利用\
  \ AutoCAD 中更多的屏幕空间。当你的屏幕空间受限时，这尤其有用。一个典型的例子是在屏幕较小的笔记本电脑上运行 AutoCAD。\n\n到目前为止，我还没有提到功能区设置按钮右侧的小弹出箭头，如\
  \ *Figure 1.12* 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_30_0.png)\n\n点击弹出箭头后，你将看到如前图所示的小弹出菜单。这允许你选择特定的功能区设置，而不是像前面提到的那样在功能区设置按钮上逐一点击。\n\
  \n一旦选择了特定的功能区设置，它将保持设置。你需要将菜单设置回 **Cycle through All** 才能使用功能区设置按钮循环浏览每个功能区设置。\n\
  \nAutoCAD 中的功能区设置是在较小的显示器上工作时获得更多屏幕空间的绝佳方式。随着我们转向工作站替代笔记本电脑，这将有所帮助。是的，你可以在办公室连接一个巨大的显示器，但在旅行时你只有\
  \ 15 英寸的笔记本电脑显示屏可用时，那个功能区设置按钮将非常有用！\n\n> **Tips and tricks #1**\n> 你会注意到某些功能区面板的标题栏上有一个弹出箭头。如果你点击面板上的弹出箭头，该面板中的隐藏命令图标将被显示。点击小图钉图标，这些隐藏的命令图标将保持固定打开状态，并在再次点击图钉图标之前一直显示。隐藏的图标随后将恢复到功能区中。*Figure\
  \ 1.13* 显示了使用功能区 **Home** 选项卡上的 **Draw** 面板时图钉图标的位置。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_31_0.png)\n\
  \n图 1.13：允许隐藏命令图标保持固定打开的图钉图标（显示为已固定）\n\n现在你知道了如何根据你的工作流程修复 AutoCAD 功能区设置，而不会觉得自己破坏了\
  \ AutoCAD，让我们继续学习如何使用粘性面板进一步改进 UI。\n\n## AutoCAD for Mac\n\nAutoCAD for Mac 不像 AutoCAD\
  \ for Windows 那样具有功能区界面，因此无法更改功能区外观。AutoCAD for Mac 使用位于 AutoCAD for Mac 屏幕左侧的图标菜单。你可以通过点击齿轮图标来编辑每个图标面板的图标设置。图\
  \ 1.14 显示了 Draw 面板及其默认图标设置。在 AutoCAD for Mac 中，你仍然需要点击并按住以显示弹出图标菜单，就像在 AutoCAD for\
  \ Windows 中一样，以访问更多命令实例，例如 Arc 弹出菜单。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_32_0.png)\n\
  \n图 1.14：AutoCAD for Mac 中 Draw 面板中的图标设置\n\n你现在对 AutoCAD 功能区及其设置和功能有了良好的理解。在下一节中，你将学习如何利用粘性面板（来自功能区）。\n\
  \n## 使用粘性面板\n\n在本章中，迄今为止的假设是功能区面板保持在功能区中。事实并非如此。功能区面板可以移动到 AutoCAD 绘图区域，并可以像对话框和调色板一样浮动。\n\
  \n下图显示了来自 Home 选项卡的 Draw 面板浮动在 AutoCAD 绘图区域中。本节介绍如何将粘性面板放置在那里，以及如何将其放回功能区。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_32_1.png)\n\
  \n图 1.15：AutoCAD 绘图区域中浮动的 Draw 面板\n\n\n\n\n为简化操作，请保持在功能区上的**主页**选项卡中。\n\n将光标移到**绘图**面板的标题栏上。单击并拖动**绘图**面板。您会看到**绘图**面板开始移动，只需松开鼠标按钮即可将其拖放到AutoCAD绘图区域中。没错，就这么简单！\n\
  \n这被称为**粘性面板**。这个名称来源于您可能在办公室使用的便利贴。您可以将功能区面板固定在所需位置，以便更有效地查看和使用它。\n\n这样做的好处是，粘性面板不再受功能区的约束。您现在可以切换到其他功能区选项卡使用其他AutoCAD命令，同时仍能快速方便地访问粘性面板上的命令。\n\
  \n一个典型的场景是，您需要**绘图**面板来创建几何图形，但您可能正处于**注释**选项卡中处理图纸的注释。*图1.16*展示了这一场景。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_33_0.png)\n\
  \n图1.16：绘图面板为粘性面板，而注释功能区选项卡为当前选项卡\n\n将粘性面板放回功能区并不像您想象的那么困难。无需单击和拖动，AutoCAD甚至会记住您从哪个功能区选项卡取出了粘性面板。\n\
  \n要将粘性面板放回功能区，您需要将鼠标悬停在原位的粘性面板上。您会看到面板高亮显示，并且面板左右两侧出现侧边栏。*图1.17*显示了侧边栏，由箭头指示。\n\n\
  ![](img/e5541e806f2ef46a4958b6c3d0b346a9_34_0.png)\n\n图1.17：带有侧边栏指示的粘性面板\n\n在左侧边栏上，您会看到一个渐变或点状区域。您可以单击并拖动它来重新定位粘性面板。\n\
  \n在右侧边栏上，有两个小图标。这两个图标中下方的一个可以让您将粘性面板从水平旋转为垂直，反之亦然。\n\n您需要的是右上角的图标。如果将光标悬停在上面，工具提示将显示**将面板返回至功能区**。您可以在*图1.18*中看到这一显示。\n\
  \n![](img/e5541e806f2ef46a4958b6c3d0b346a9_34_1.png)\n\n图1.18：带有“将面板返回至功能区”指示的粘性面板\n\
  \n单击此图标后，粘性面板将返回功能区。无论当前是哪个功能区选项卡，AutoCAD都会将面板放回相应的功能区选项卡上。\n\n如果您处于**注释**选项卡中，并将粘性的**绘图**面板返回功能区，AutoCAD不仅会确保将其放置在相应的功能区选项卡上，还会确保其回到该功能区选项卡上的正确位置！\n\
  \n这是通过AutoCAD CUI设置完成的，我们将在本章后面部分涉及。\n\n**提示和技巧 #2**\nAutoCAD现在具有一项称为浮动绘图窗口的功能。这意味着任何图形文件选项卡都可以拖放到任何显示位置。当AutoCAD用于双（有时是三）显示器硬件设置时，通常会使用此功能。即使浮动图形移动到其他位置，粘性面板也会保持在原位。*图1.19*让您了解这可能是什么样子。\n\
  \n![](img/e5541e806f2ef46a4958b6c3d0b346a9_35_0.png)\n\n图1.19：绘图粘性面板仍在原位，浮动图形窗口在其后方\n\
  \n粘性面板是自定义AutoCAD界面以适应您工作方式的绝佳方法。它们可以放置在任何位置，尤其是当您需要特定功能区面板始终可用时。\n\n现在您已经了解了如何利用粘性面板并将其放回原位，让我们将注意力转向了解QAT中的项目。\n\
  \n## 有效使用QAT\n\nAutoCAD QAT位于AutoCAD 2024应用程序窗口的左上角。您在使用AutoCAD时可能已经使用过它。*图1.20*显示了默认的未自定义QAT。\n\
  \n![](img/e5541e806f2ef46a4958b6c3d0b346a9_35_1.png)\n\n图1.20：QAT（未自定义）\n\n在本节中，我们将了解一些使用QAT的实用工作流程，这些流程将帮助您变得更加高效和多产。\n\
  \n## 自定义QAT\n\nQAT上有一个非常小但功能强大的图标。对于我们这些超过一定年龄的人来说，它会让我们想起**光盘（CD）**时代。光盘主要用于音乐，取代了黑胶唱片。它们也曾用于软件安装。AutoCAD过去也是从CD介质安装的。音乐CD在CD播放器上播放。QAT上的**自定义快速访问工具栏**图标看起来非常像那些旧CD播放器上的弹出按钮。*图1.21高亮了*\
  \ **自定义快速访问工具栏**按钮。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_36_0.png)\n\n图1.21：自定义快速访问工具栏按钮\n\
  \n单击该图标后，将出现一个下拉菜单，如*图1.22*所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_36_1.png)\n\
  \n图1.22：带有默认设置的自定义快速访问工具栏下拉菜单\n\n您会注意到有几个设置旁边有复选标记。这表明这些功能已显示在QAT上。没有复选标记的功能可以被选择显示在QAT上，以改善您日常的AutoCAD工作。这就是我们将重点介绍的自定义。\n\
  \n如果从下拉菜单中选择**图层**选项，您会看到**图层**下拉菜单已添加到QAT中，如*图1.23*所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_37_0.png)\n\
  \n图1.23：已添加并正在使用的带图层下拉菜单的QAT\n\n这种自定义的主要好处是您现在可以随时访问所有AutoCAD图层控件。无论您使用哪个功能区选项卡，您都可以随时控制图层特性，从而无需不断返回功能区的**主页**选项卡来更改任何特定的图层特性。*图1.23*还显示了已添加**图层**下拉菜单并正在使用的QAT。您现在可以看到访问AutoCAD图层是多么容易。\n\
  \n如果您想关闭QAT上的**图层**下拉菜单，您需要重复自定义过程，单击**自定义快速访问工具栏**图标。然后在下拉菜单上单击**图层**，复选标记将被移除。**图层**下拉菜单也将被移除。\n\
  \n另一个可以添加到QAT的有用下拉菜单是**工作空间**功能。如前所述，这是您可以在**自定义快速访问工具栏**下拉菜单中勾选的另一个功能。*图1.24*显示了已添加到QAT并正在使用的**工作空间**功能。\n\
  \n如您所见，向QAT添加功能为您提供了一个自定义的AutoCAD用户界面，这将增强您的工作流程，并在您每天使用AutoCAD时为您提供额外的效率。\n\n##\
  \ 其他QAT设置\n\n在QAT的**自定义快速访问工具栏**下拉菜单上，您还会看到其他可用于进一步自定义AutoCAD界面的设置。\n\n**显示菜单栏**选项将在AutoCAD应用程序窗口顶部显示经典的AutoCAD菜单栏，如*图1.25*所示。\n\
  \n![](img/e5541e806f2ef46a4958b6c3d0b346a9_38_0.png)\n\n图1.25：在QAT中设置后位于相应位置的AutoCAD菜单栏\n\
  \n这个经典菜单栏提供了AutoCAD以前版本中更旧、更传统的AutoCAD下拉菜单。在图1.26中，选择了绘图功能，并显示了建模子选项。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_39_0.png)\n\
  \n图1.26：菜单栏中的绘图下拉菜单，已选择建模子选项\n\n如果您回到QAT自定义下拉菜单，可以单击**在功能区上方显示**，QAT将返回到功能区上方的默认位置。\n\
  \n虽然更改QAT的位置或向其添加功能似乎是对AutoCAD界面的一个小而不重要的更改，但令人惊讶的是，有多少用户使用这些工具来调整和调整他们的AutoCAD界面以适应他们的日常使用。正如他们所说，细节决定成败。当将这些设置保存到您自己的自定义AutoCAD工作空间时，一切就开始变得有意义了。当我们在本书后面更详细地研究工作空间时，您将开始看到它们的优势，以及它们如何让您拥有一个完全属于您自己的自定义AutoCAD工作空间。\n\
  \n> **AutoCAD for Mac**\n> AutoCAD for Mac没有QAT。它在AutoCAD for Mac应用程序窗口顶部有一个简化的工具栏，如图1.29所示。可以通过右键单击工具栏并选择**自定义工具栏**来自定义。\n\
  \n![](img/e5541e806f2ef46a4958b6c3d0b346a9_41_0.png)\n\n## 介绍CUI命令\n\n到目前为止，我们一直使用AutoCAD界面来自定义AutoCAD界面。还有一个AutoCAD命令允许您调整AutoCAD界面。该命令是**自定义用户界面（CUI）**命令。\n\
  \n开始使用CUI命令的最快方法是键入CUI并按Enter。您可以直接键入，它会出现在光标（十字准线）附近，也可以在AutoCAD屏幕底部的命令行上键入。\n\n\
  这将弹出**自定义用户界面**对话框。图1.30显示了**自定义用户界面**对话框，其中包含三个默认AutoCAD工作空间：**草图与注释默认**、**三维建模**和**三维基础**。这些可以在对话框的**自定义**选项卡中找到。\n\
  \n\n\n\n\n## 自定义 AutoCAD 界面\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_42_0.png)\n\
  \n图 1.30：自定义用户界面对话框，在“自定义”选项卡中标出了默认的 AutoCAD 工作空间\n\n如果你通过拖动对话框的一角或一侧来放大对话框，就可以开始了解如何自定义\
  \ AutoCAD 用户界面。\n\n> **技巧与诀窍 #3**\n> \n> 在提交对**自定义用户界面对话框**的任何更改之前，最好先复制一份你要使用的工作空间。这样可以避免你可能犯的错误影响到默认工作空间，使其无法挽回！只需在对话框中的特定工作空间上右键单击，然后从快捷菜单中选择**复制**。这将在以后当你意识到自己已将默认工作空间改得面目全非时，为你省去极大的麻烦。\n\
  \n如果你在对话框左上角窗格中选择一个工作空间（注意*技巧与诀窍 #3*），然后选中该工作空间，即可开始查看其结构，以及它如何由各个组件、功能区选项卡、面板和命令组成。\n\
  \n在*图 1.31* 中，可以看到选择了**草图与注释**，并展开了功能区/面板内容。可以看到列出的所有单独面板。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_43_0.png)\n\
  \n图 1.31：CUI 对话框中展开的“功能区 | 面板”内容\n\n使用滑块，你可以向下滑动列表以找到**默认二维: 绘图**功能区面板。如果你展开此内容并展开**行\
  \ 1**，就可以看到**直线**、**多段线**、**圆**和**圆弧**命令。\n\n展开**圆**命令。你将看到所有不同的命令选项，这些选项同样会在 AutoCAD\
  \ 中绘图时单击功能区中的**圆**弹出箭头时看到。*图 1.32* 中对此进行了突出显示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_44_0.png)\n\
  \n图 1.32：自定义用户界面对话框中显示的不同“圆”命令选项\n\n如果在对话框中选择**圆心、半径**选项，该命令选项的所有设置将显示在对话框右侧窗格中，以便进行命令自定义。\n\
  \n右侧窗格还显示面板预览，以便你检查其在功能区上的显示效果。同时也会显示该命令的宏代码。查看*图 1.33* 可了解其在对话框中的显示效果。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_45_0.png)\n\
  \n图 1.33：选择了“圆 | 圆心、半径”命令的自定义用户界面对话框\n\nCUI 命令可以编辑或复制现有工作空间，甚至细化到命令宏级别。这意味着在（完整版）AutoCAD\
  \ 中可以进行编程，以创建可能占据 AutoCAD 功能区上新型面板和选项卡的新命令。\n\n有很多方法可以使用 CUI 命令深入自定义 AutoCAD 界面。本书不涉及这些内容，但互联网上有大量资源和社区（包括\
  \ Autodesk 社区），你可以在其中深入研究并与同行讨论。Autodesk 提供了一些很好的在线平台，供你与其他 AutoCAD 用户交流。你需要使用 Autodesk\
  \ 帐户登录以下任何 Autodesk 社区：-\n\n- Autodesk 论坛，位于：https://forums.autodesk.com\n- Autodesk\
  \ 知识网络 (AKN)，位于：https://knowledge.autodesk.com\n- Autodesk 社区提示：AutoCAD 产品：位于 AutoCAD\
  \ 论坛中\n- Autodesk 社区声音博客：位于前述 Autodesk 论坛链接中\n\n**AutoCAD for Mac**\nCUI 命令也适用于\
  \ AutoCAD for Mac，但界面和对话框有所不同。*图 1.34* 显示了在启动 CUI 命令后 AutoCAD for Mac 中的“自定义”对话框。你需要单击对话框顶部的选项卡来访问\
  \ CUI 命令的必要区域。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_46_0.png)\n\n图 1.34：AutoCAD\
  \ for Mac 中的“自定义”对话框\n\n在上一节中，你学习了如何使用 **CUI** 命令和**自定义用户界面**对话框自定义 AutoCAD 用户界面。下一节将总结本章所学内容。\n\
  \n## 总结\n\n在本章中，你学习了更改和管理 AutoCAD 功能区设置以及设置固定面板。我们还学习了如何有效使用 QAT，以及如何使用 AutoCAD\
  \ CUI 命令和**自定义用户界面**对话框。\n\n所有这些工作流程和概念对于你作为 AutoCAD 用户来说都很重要，可以增强和自定义 AutoCAD 界面，以符合你的偏好和理想的工作环境。在下一章中，我们将讨论如何在\
  \ AutoCAD 中开发和自定义自己的工作空间。\n\n## 练习\n\n在 AutoCAD 中打开一个空白图形，然后跟随本章各节中展示的界面自定义选项进行探索。这适用于\
  \ AutoCAD for Windows 和 AutoCAD for Mac。\n\n从*第 2 章*开始，我将分享练习文件，以便你可以跟着实际操作并动手学习\
  \ AutoCAD。\n"
- "# 2 开发你自己的 AutoCAD 工作空间\n\nAutoCAD 2025 附带了针对特定工作环境的预设默认工作空间。这些工作空间主要用于 2D 草图和\
  \ 3D 建模。可以针对特定的生产环境设置单独的工作空间，从而为每个环境提供一个高效的界面。\n\nAutoCAD 工作空间已在*第 1 章*中介绍过。学完本章后，你将能够有效地使用\
  \ AutoCAD 中的工作空间，并做出必要的界面更改以创建自定义工作空间。你还可以使用 AutoCAD **自定义用户界面** (*CUI*) 命令删除不需要的工作空间。\n\
  \n开发自己的工作空间可以个性化 AutoCAD 界面，并让你充分利用屏幕和显示器空间。一个典型的例子是，与台式电脑的双显示器设置相比，你可能只使用笔记本电脑屏幕来使用\
  \ AutoCAD。此时你需要优化屏幕空间才能有效使用 AutoCAD。如果需要，工作空间允许你在两种屏幕配置下工作。\n\n在*第 1 章*的*介绍默认 AutoCAD\
  \ 界面设置*一节中，我们了解了 AutoCAD 中可用的默认工作空间。请务必检查你正在使用的工作空间，并为了本章的目的，将**草图与注释**工作空间设置为当前。\n\
  \n本章将带你了解 AutoCAD 工作空间设置，并教你以下内容：\n\n- 有效使用工作空间\n- 将 AutoCAD 界面更改保存到自定义工作空间\n- 从\
  \ AutoCAD CUI 中删除冗余工作空间\n\n## 技术要求\n\n对于本书中的本章及后续章节，你需要在 AutoCAD 中启用**动态输入**和**命令行**。有关如何执行此操作的说明，请访问\
  \ `https://www.autodesk.com/support/technical/article/caas/sfdcarticles/sfdcarticles/How-to-enable-or-disable-dynamic-input-in-AutoCAD.html`。\n\
  \nAutoCAD 命令行或*命令提示*默认始终显示在 AutoCAD 屏幕上。你可以通过输入 COMMANDLINEHIDE 并按 *Enter* 来隐藏它。你可以通过输入\
  \ COMMANDLINE 并按 *Enter* 或使用 *Ctrl + 9* 将其恢复。\n\n**动态输入** (DYNMODE) 也是默认开启的。但是，**动态输入**图标不会显示在状态栏上。单击状态栏右端的**自定义**图标（*三条水平线*），然后在菜单中单击**动态输入**，确保其旁边有复选标记。然后它将显示在状态栏上。然后你可以关闭和打开\
  \ **DYNMODE**，并通过右键单击**动态输入**图标来访问其设置。\n\n## 练习文件\n\n本章使用一个简单的 DWG 文件来确保你可以完全访问\
  \ AutoCAD 中所有与工作空间相关的功能。DWG 文件的文件名是 `Workspaces.dwg`。\n\n## 有效使用工作空间\n\n工作空间非常有用。它们允许你在与你正在使用的\
  \ AutoCAD 环境相关的特定*空间*中工作。例如，**草图与注释**工作空间是默认的 AutoCAD 工作空间，主要用于 2D 草图绘制，而**三维基础**和**三维建模**工作空间用于\
  \ AutoCAD 中的 3D 建模。\n\n每个工作空间都会显示一组特定的功能区选项卡、面板和图标，确保可以根据 AutoCAD 在适当时间所执行的任务，有效地利用其必要的工具和功能。但是我们如何为项目选择正确的工作空间呢？\n\
  \n## 选择正确的默认工作空间\n\n在本章开头，我要求你确保默认工作空间设置为**草图与注释**。这是因为我们即将完成一个练习，以确定哪个 AutoCAD\
  \ 工作空间适合你的特定项目，例如 2D 草图绘制或 3D 建模。你将学习如何更改默认工作空间或自定义工作空间以适合项目环境。\n\n在开始之前，我想请你打开本章的练习文件\
  \ `Workspaces.dwg`，你应该已经从*前言*中提供的链接下载了该文件。\n\n\n\n\n\nLocate the exercise file and\
  \ open it in AutoCAD. It will look like *Figure 2.1*\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_51_0.png)\n\
  \nFigure 2.1: The Workspaces.dwg file when first opened\n\nThe Workspaces.dwg file\
  \ looks like a flat 2D drawing of a polyline with six regularly spaced circles.\
  \ It isn’t. It is a 3D solid with six regularly spaced holes, but due to the default\
  \ settings you are working with, in this case, the **Drafting & Annotation** workspace,\
  \ AutoCAD is set up for 2D drafting.\n\nTherefore, the question is, how do you set\
  \ a workspace that is more suited to 3D modeling? This is where you need to change\
  \ your AutoCAD workspace to fit your needs.\n\nReturn to the gearwheel icon on the\
  \ status bar. Click on it, and you will see the **Workspace** menu. Select the **3D\
  \ Modeling** workspace. A tick will appear next to it on the menu, and you will\
  \ see the AutoCAD ribbon change to display tools that are more suited to a 3D modeling\
  \ environment. *Figure 2.2* shows you the **Workspace** menu with the **3D Modeling**\
  \ workspace set as current.\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_51_1.png)\n\
  \nFigure 2.2: The Workspace menu with 3D Modeling set as the current workspace\n\
  \nThe AutoCAD ribbon now displays all the necessary tools you may need to work on\
  \ the 3D solid in the `Workspaces.dwg` file. *Figure 2.3* shows an excerpt of some\
  \ of the 3D modeling tools available on the ribbon now that the workspace has been\
  \ changed.\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_52_0.png)\n\nFigure 2.3:\
  \ The ribbon with the 3D Modeling workspace active\n\nWith the **3D Modeling** workspace\
  \ active and comparing the **Home** tab on the ribbon to the **Home** tab when using\
  \ the **Drafting & Annotation** workspace, you can see that they are dramatically\
  \ different. The **Home** tab now includes panels such as **Modeling**, **Mesh**,\
  \ and **Solid Editing**, which are used regularly when 3D modeling.\n\nYou don’t\
  \ have to use the preset workspaces in AutoCAD. You can save a workspace with its\
  \ own name for your own purposes. This is often preferred if you make any changes\
  \ to the ribbon, as it preserves the settings of the default workspaces.\n\n## Creating\
  \ your own AutoCAD workspace\n\nWhenever a separate named workspace is required,\
  \ you need to click on the gearwheel icon on the status bar again. On the **Workspace**\
  \ menu, select **Save Current As...**, as shown in *Figure 2.4*.\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_52_1.png)\n\
  \nFigure 2.4: The Workspace menu with Save Current As... displayed\n\nStaying in\
  \ the **3D Modeling** workspace with the Workspaces.dwg file still open in AutoCAD,\
  \ you will now make changes to the AutoCAD interface and save those changes in a\
  \ saved custom workspace.\n\nThe changes to the interface are going to involve utilizing\
  \ the ribbon panels. Ribbon panels can easily be moved from the ribbon and placed\
  \ in the drawing area in AutoCAD. They are known as sticky panels and are similar\
  \ to Post-It notes – discussed in *Chapter 1*.\n\nTake a look at the **Home** tab\
  \ on the ribbon. You will see various panels available when using the **3D Modeling**\
  \ workspace. For this exercise, you will move the **Modeling** and **Mesh** panels\
  \ into the AutoCAD drawing area. This will create sticky panels that can be moved\
  \ around like Post-It notes in the AutoCAD drawing area, independently of their\
  \ original positions on the AutoCAD ribbon.\n\nClick and drag on the title bar of\
  \ the **Modeling** ribbon panel. You will see the panel move away from the ribbon\
  \ as you move the mouse. Position the **Modeling** panel in a suitable location\
  \ in the drawing area and release the mouse button. The panel is now placed in the\
  \ drawing area.\n\nRepeat this workflow for the **Mesh** ribbon panel, placing it\
  \ underneath the **Modeling** panel. *Figure 2.7* shows how the panels should appear\
  \ in the drawing area.\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_54_0.png)\n\n\
  Figure 2.7: The Modeling and Mesh sticky panels\n\n**AutoCAD for Mac**\n\nAs mentioned\
  \ previously, the interface is different on AutoCAD for Mac. There is no way of\
  \ moving panels in AutoCAD for Mac as the **Drafting** and **Modeling** workspaces\
  \ in AutoCAD for Mac are fixed at the top of the icon menu on the left-hand side\
  \ of the screen and cannot be changed.\n\nYou have now altered the AutoCAD interface\
  \ to suit your needs. The two panels have been moved to a suitable location, ready\
  \ for use when 3D modeling.\n\nTo maintain the location of the two *sticky panels*,\
  \ you now need to save a custom workspace. The reason for this is that if you revert\
  \ back to one of the default AutoCAD workspaces, the *sticky panels* will be returned\
  \ to their original positions in the ribbon due to the **Customize User Interface\
  \ (CUI)** settings in each preset workspace.\n\nSaving a new custom workspace ensures\
  \ that the CUI settings are set to keep your *sticky panels* where you placed them.\n\
  \nTo save the custom workspace, you need to use the workflow covered earlier in\
  \ the chapter. Click on the gearwheel icon and select **Save Current As...**, as\
  \ shown in *Figure 2.8*.\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_55_0.png)\n\
  \nFigure 2.8: Selecting Save Current As... to save a custom workspace\n\nThe **Save\
  \ Workspace** dialog box will appear. Name your custom workspace `3D Modeling-CUSTOM`\
  \ and click on **Save**. *Figure 2.9* shows you the dialog box.\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_55_1.png)\n\
  \nFigure 2.9: The Save Workspace dialog box with the custom workspace name\n\nThis\
  \ is now a saved workspace and is now also the current workspace. This workspace\
  \ includes the position of the sticky panels in the AutoCAD CUI settings.\n\nIf\
  \ you click the gearwheel icon again, you will see your custom workspace listed\
  \ on the **Workspace** menu, as shown in *Figure 2.10*.\n\nYou can also see the\
  \ previously saved **3D Modeling-CURRENT** workspace. The check mark next to the\
  \ **3D Modeling-CUSTOM** workspace indicates the current workspace.\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_56_0.png)\n\
  \nFigure 2.10: The Workspace menu displaying the new custom workspace\n\nYour custom\
  \ workspace includes your sticky panels. If you select the default **3D Modeling**\
  \ workspace from the **Workspace** menu, you will see your sticky panels disappear\
  \ from the drawing area to be repositioned in their respective positions on the\
  \ **Home** tab on the ribbon.\n\n> **Tips and tricks #4**\n> \n> You can use sticky\
  \ panels in AutoCAD in any workspace. As mentioned in this chapter and the *Using\
  \ sticky panels* section in *Chapter 1*, they can be returned to the ribbon at any\
  \ time using the **Return Panels to Ribbon** function. Sticky panels are a great\
  \ timesaver when using a dual monitor setup for your workstation. You can set up\
  \ all the necessary panels you use daily in one area of the screen and save this\
  \ interface configuration as your own personalized AutoCAD workspace. Should the\
  \ time come when you need to reset to default settings, you simply select the appropriate\
  \ default AutoCAD workspace as the current workspace, and all the *sticky panels*\
  \ will be returned to the relevant locations on the ribbon. *Figure 2.11* shows\
  \ how your customized interface would look when using the **3D Modeling-CUSTOM**\
  \ workspace set up in this chapter.\n\nSelect your **3D Modeling-CUSTOM** workspace\
  \ from the **Workspace** menu, and you will see the sticky panels reappear in their\
  \ locations in the drawing area, as shown previously in *Figure 2.7*.\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_57_0.png)\n\
  \n![](img/e5541e806f2ef46a4958b6c3d0b346a9_57_1.png)\n\nFigure 2.11: The sticky\
  \ panels in the drawing area when using the 3D Modeling-CUSTOM workspace\n\nSometimes,\
  \ after creating new workspaces, and customizing existing ones, there may be a need\
  \ to remove redundant workspaces from the AutoCAD interface. In the next part of\
  \ the chapter, we will look at how to do this, using the CUI tool.\n\n## Removing\
  \ a redundant workspace from the AutoCAD CUI\n\nWorkspaces are incredibly useful\
  \ and versatile, but there will come a time when you need to remove redundant workspaces\
  \ from the AutoCAD CUI. You may want to rationalize how many workspaces are displayed\
  \ in the **Workspace** menu, or you may just want to return back to the preset workspaces\
  \ AutoCAD provides.\n\nYou will need to run the AutoCAD CUI command to remove unwanted\
  \ workspaces. We learned about this command in the *Introducing the AutoCAD CUI\
  \ command* section in *Chapter 1*.\n\nHaving a DWG file open ensures you get access\
  \ to all of the AutoCAD interface, so make sure to have the Workspaces.dwg file\
  \ open and current in AutoCAD.\n\nUsing **Dynamic Input** or the **command line**,\
  \ type in CUI and press *Enter*.\n\n\n\n\n\n## 开发你自己的 AutoCAD 工作空间\n\n**自定义用户界面**对话框将出现在屏幕上，你会在对话框左上角窗格中看到你的工作空间列表。*图\
  \ 2.12* 显示了工作空间的显示方式。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_58_0.png)\n\n\
  图 2.12：自定义用户界面对话框的部分视图，工作空间以箭头标出\n\n你可以看到当前的工作空间（**3D Modeling-CUSTOM**）已列出。在这种情况下，需要移除\
  \ **3D Modeling-CURRENT** 工作空间，因为该工作空间的名称可能会误导其他用户。\n\n单击列表中的 **3D Modeling-CURRENT**\
  \ 工作空间以将其选中。工作空间的名称将以蓝色高亮显示，如 *图 2.13* 所示。然后，右键单击选中的工作空间。*图 2.13* 还显示了随之出现的右键快捷菜单。\n\
  \n要关闭**自定义用户界面**对话框，请单击**应用**（以应用更改），然后单击**确定**，对话框将关闭。\n\n你也可以直接单击**确定**来应用更改并关闭对话框，但最佳实践是先单击**应用**，以确保在关闭对话框之前所有更改都已应用。\n\
  \n现在，你已成功从 AutoCAD CUI 中移除了不需要的工作空间，并应用了必要的更改。\n\n如果单击状态栏上的齿轮图标，你会看到 **3D Modeling-CURRENT**\
  \ 工作空间不再出现在**工作空间**菜单中。你可以在 *图 2.15* 中看到这一点。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_60_0.png)\n\
  \n图 2.15：没有 3D Modeling-CURRENT 工作空间的工作空间菜单\n\n你还可以看到当前工作空间是 **3D Modeling-CUSTOM**\
  \ 工作空间。该工作空间包含本章前面设置的*固定面板*。\n\n### AutoCAD for Mac\n\n如 *第 1 章* 所述，CUI 命令同样适用于\
  \ AutoCAD for Mac，但界面和对话框有所不同。*图 2.16* 显示了在启动 CUI 命令后 AutoCAD for Mac 中的 CUI 对话框。你需要单击对话框顶部的选项卡以访问\
  \ CUI 命令的所需区域。同样需要注意的是，AutoCAD for Mac 中没有*工作空间*或*固定面板*。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_61_0.png)\n\
  \n图 2.16：AutoCAD for Mac 中的自定义对话框\n\n现在你已经学会了如何从 AutoCAD CUI 中移除多余的工作空间，确保只保留当前使用的工作空间。你的工作空间定义了你的界面，保持\
  \ CUI 井井有条非常重要。\n\n### 小结\n\n工作空间是至关重要的，它使你能作为 AutoCAD 用户增强和自定义 AutoCAD 界面，确保你能访问适合当前工作环境的工具。在本章中，由于练习中包含三维实体，你确保使用了与三维相关的工作空间。你学会了如何保存\
  \ AutoCAD 界面更改并移除多余的工作空间，这将帮助你在 AutoCAD 中自定义工作环境。你还学会了如何使用*固定*功能区面板，以便在 AutoCAD\
  \ 绘图区域中轻松访问特定的功能区面板。\n\n在下一章中，我们将讨论如何更智能地使用 AutoCAD 界面。你将学习如何利用文件选项卡高效地在多个图形文件之间切换，并学习如何利用**模型**和**布局**选项卡。你还将学习如何在状态栏中设置绘图设置，以及如何使用**ViewCube（三维）**和**导航栏（二维）**快速轻松地浏览图形。\n\
  \n## 利用 AutoCAD 界面更智能地工作\n\nAutoCAD 已有 40 多年的历史。在此期间，AutoCAD 界面不断调整和发展，变得更加高效和直观。本章将介绍几种增强\
  \ AutoCAD 使用方法的方式，让你更智能地工作，而不是更费力。\n\n我们将介绍一些使日常使用 AutoCAD 更加轻松的界面工具，从而提高你的效率和生产力。在本章中，你将了解以下界面工具：\n\
  \n- 使用文件选项卡\n- 使用模型和布局选项卡\n- 利用状态栏上的绘图设置\n- AutoCAD ViewCube\n- AutoCAD 导航栏\n\n\
  上述所有工具都提供了特定的方法来导航 AutoCAD 界面和 AutoCAD 绘图。AutoCAD 绘图可能很复杂，而有效使用 AutoCAD 界面可以帮助你更智能地工作，而不是更费力。学习如何使用\
  \ AutoCAD 界面更智能地工作，不仅能让你成为更熟练的 AutoCAD 用户，还能提高你日常工作的效率和生产力。\n\n在 *第 2 章* 中，你使用了\
  \ AutoCAD 的工作空间。请确保你的 AutoCAD 工作空间现在已恢复为默认的**草图与注释**工作空间。\n\n### 练习文件\n\n在本章后面的\
  \ *AutoCAD ViewCube* 部分，我们将使用一个名为 `3D Solid.dwg` 的练习文件。请确保你已将其下载并准备好，以便在 AutoCAD\
  \ 中使用。\n\n### 使用文件选项卡\n\n在 AutoCAD 会话期间，可以打开多个图形（DWG）文件。每个文件都显示为文件选项卡，位于 AutoCAD\
  \ 应用程序窗口左上角功能区的正下方。如 *图 3.1* 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_64_0.png)\n\
  \nAutoCAD **开始**选项卡默认存在，并显示了三个图形文件：**Drawing1**、**Drawing2** 和 **3D Solid**。这些都是当前\
  \ AutoCAD 会话中打开的 DWG 文件。`3D Solid.dwg` 文件是本章的练习文件。如果你在 AutoCAD 中打开该文件，你会在对应的文件选项卡中看到文件名。\n\
  \n文件选项卡可以水平拖放以更改显示顺序。例如，如果需要，你可以将 **3D Solid** 文件选项卡拖到其他文件选项卡的前面。\n\n你可以在文件选项卡区域的左侧看到三条水平线。这通常被称为*汉堡*图标（原因显而易见）。汉堡图标会显示一个下拉菜单，允许你使用文件选项卡进行操作。如\
  \ *图 3.2* 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_65_0.png)\n\n图 3.2：单击汉堡图标后显示的下拉菜单\n\
  \n当前文件选项卡是 **3D Solid** 文件选项卡，在文件选项卡本身和下拉菜单中均以粗体高亮显示。下拉菜单允许你选择列出的任何文件以使其成为当前文件，例如通过单击相应的文件选项卡。\n\
  \n*图 3.3 显示，如果将鼠标悬停在下拉列表中的文件名上，你还会看到用于跳转到所悬停文件的**模型**和**布局**选项卡的选项。这是在 AutoCAD 会话中导航打开文件的一种非常高效的方式。*\n\
  \n![](img/e5541e806f2ef46a4958b6c3d0b346a9_66_0.png)\n\n图 3.3：在下拉菜单中悬停在 Drawing1\
  \ 上时，会显示模型和布局选项卡\n\n文件选项卡旁边和下拉菜单上有一个对应的 + 符号。如图 3.3 所示，在下拉菜单中，单击此符号将打开一个新的空白图形文件。AutoCAD\
  \ 会按顺序打开这些空白图形文件，并将其命名为 Drawing1.dwg、Drawing2.dwg，依此类推。因此，文件选项卡在图 3.2 和图 3.3 中显示。\n\
  \n下拉菜单还提供了极大的灵活性，在处理多个 AutoCAD 文件时，可以快速访问“新建...”、“打开...”、“全部保存”和“全部关闭”命令。\n\n**技巧与诀窍\
  \ #5**\n\n成为一名熟练的 AutoCAD 用户，不仅仅取决于图形中包含的知识，还往往取决于对 AutoCAD 本身的了解。在 AutoCAD 中工作时，熟练地在多个图形之间导航可以帮助你更智能地工作，而不是更费力，并且随着时间的推移为你节省时间。尝试将文件选项卡融入你的日常\
  \ AutoCAD 工作流程和过程中，以提高生产力和效率。\n\n\n\n\n\nWindows 版 AutoCAD 和 Mac 版 AutoCAD 都使用文件标签来管理当前打开的绘图文件。它们是一种出色的效率工具，能够轻松地在多个打开的绘图中切换。\n\
  \n> **AutoCAD for Mac**\n> \n> 在 AutoCAD for Mac 中，使用文件标签的方法类似。在 *Figure 3.4* 中，你可以看到类似的文件标签，其中当前绘图标签\
  \ **3D Solid** 已被高亮显示。带蓝色角的小图标（由箭头指示）是一个工具，其工作原理与 Windows 版 AutoCAD 下拉菜单中的 *hover*\
  \ 工具类似。点击后，它提供了一种便捷的方法来导航当前绘图的 **Model** 和 **Layout** 标签。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_67_0.png)\n\
  \nFigure 3.4 – The file tabs in AutoCAD for Mac\n\n你现在已熟练掌握 AutoCAD 界面中的文件标签。这将使你在\
  \ AutoCAD 会话中打开多个文件时能够更智能地工作，在多个绘图文件之间进出时提供更大的灵活性。我们现在将继续学习如何使用 DWG 文件中的 **Model**\
  \ 和 **Layout** 标签。\n\n## Working with the Model and Layout tabs\n\nAutoCAD 在两个空间中工作：*model\
  \ space* 和 *paper space*。模型空间由 **Model** 标签表示，而图纸空间由 **Layout** 标签表示。你可以拥有多个布局标签，它们显示模型空间中内容的按比例缩放视图。\n\
  \n**Model** 和 **Layout** 标签位于 AutoCAD 应用程序窗口的左下角（适用于 Windows 和 Mac 版本）。*Figure 3.5*\
  \ 显示了 Windows 版 AutoCAD 中的 **Model** 和 **Layout** 标签。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_68_0.png)\n\
  \nFigure 3.5: The Model and Layout tabs in AutoCAD\n\n与文件标签一样，Model 和 Layout 标签也有一个汉堡图标。点击后，它也会提供一个菜单，允许更快地导航\
  \ Model 和 Layout 标签。Figure 3.6 显示了带有当前标签箭头的菜单。在此情况下，绘图当前在模型空间的 Model 标签中进行工作。\n\n\
  ![](img/e5541e806f2ef46a4958b6c3d0b346a9_68_1.png)\n\nFigure 3.6: The Model and\
  \ Layout tabs menu\n\n*Figure 3.8* 显示了 **Model** 和 **Layout** 标签显示在状态栏上方。箭头指示标签下方的间隙。\n\
  \n![](img/e5541e806f2ef46a4958b6c3d0b346a9_70_0.png)\n\nFigure 3.8: The Model and\
  \ Layout tabs docked above the status bar\n\n虽然菜单上的这些工具看起来很简单，但它们也是在绘图中管理 **Model**\
  \ 和 **Layout** 标签时访问必要工具的非常有效的方法。\n\n右键单击 **Model** 标签或 **Layout** 标签会提供特定于每种标签类型的快捷菜单。此菜单还将为你提供快速访问各种\
  \ **Model** 和 **Layout** 工具，从而在 AutoCAD 中工作时实现更快的流程。*Figure 3.9* 显示了右键单击 **Model**\
  \ 标签时的快捷菜单。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_70_1.png)\n\nFigure 3.9:\
  \ The Model tab right-click shortcut menu\n\n正如你所见，汉堡图标中的一些内容被复制了。Plot... 选项可用，Drafting\
  \ Standard Setup... 也是如此。再次强调，这些是快速快捷方式，可快速访问 AutoCAD 功能区上已有的内容，从而在上下文中更快地访问命令。你通常在\
  \ Model 标签中工作时设置绘图标准。这比在功能区上寻找要快一点，每次节省的几下鼠标点击每天都会提高你的效率。\n\n右键单击布局标签后也会显示类似的快捷菜单。这些快捷菜单都是上下文相关的，因此会显示不同的选项。Figure\
  \ 3.10 显示了显示的快捷菜单。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_71_0.png)\n\nFigure\
  \ 3.10: The Layout tab right-click shortcut menu\n\n与 Model 标签版本相比，此快捷菜单上有一些不同的选项。同样，所有选项都旨在提供上下文界面并减少鼠标点击，以提高生产率。\n\
  \n以下是一些 **Layout** 选项及其简要说明：\n\n- **New Layout**: 这会生成一个新的空白 **Layout** 标签，类似于点击\
  \ **Model** 和 **Layout** 标签旁边的 + 符号。\n- **From Template...**: 这允许你从绘图模板文件 (*DWT*)\
  \ 将布局插入到现有绘图中。\n- **Delete**: 这正如其名。它允许删除 **Layout** 标签。\n- **Rename**: **Layout**\
  \ 标签可以重命名以便于识别和上下文。此选项会突出显示标签文本，允许重命名，类似于 Microsoft Excel 工作表。\n- **Move or Copy...**:\
  \ 布局可以在标签显示中移动或复制以重命名/重用。此选项打开一个对话框以加快 **Layout** 标签的移动或复制。\n- **Select All Layouts**:\
  \ 有时需要选择所有 **Layout** 标签以发布它们（参见 **Publish Selected Layouts...** in Figure 3.10）。你会在所有\
  \ **Layout** 标签都被选择后使用此选项）。\n- **Activate Model Tab**: 这是一个简单的开关切换，允许你使 **Model**\
  \ 标签处于活动状态。\n- **Export Layout to Model...**: 有时 **Layout** 标签内容可能需要带入 **Model**\
  \ 标签。此选项可从快捷菜单一键快速完成此操作。\n\n> **Tips and tricks #6**\n> 作为一名经验丰富的 AutoCAD 用户，你（很可能）已经在使用\
  \ **Model** 和 **Layout** 标签时拥有日常工作方法。上述选项提供了一种更具上下文相关的方法，利用 AutoCAD 2025 中增强的汉堡图标和右键单击快捷菜单。它们可以节省几次鼠标点击，并且每天重复使用时，长期来看会为你节省时间。唯一的方法就是尝试它们！\n\
  \n如果你记住在 **Model** 标签中执行所有设计工作，并确保 **Layout** 标签仅用于展示这些设计，你就走在正确的道路上。尝试在所有绘图工作中保持这一点，以保持你的\
  \ AutoCAD 绘图井然有序且专业。\n\n## AutoCAD for Mac\n\nAutoCAD for Mac 中 **Model** 和 **Layout**\
  \ 标签的工作流程不同。右键单击快捷菜单需要预设页面设置，在 **Page Setup Manager** 中定义，可从 **File** 下拉菜单访问。快捷菜单仅在\
  \ **Layout** 标签上可用，并且比 AutoCAD for Windows 版本少得多。这个更小的菜单显示在 *Figure 3.11* 中。\n\n\
  ![](img/e5541e806f2ef46a4958b6c3d0b346a9_73_0.png)\n\nFigure 3.11: The AutoCAD for\
  \ Mac right-click shortcut menu on the Layout tab\n\n你现在知道如何在 AutoCAD 中有效地使用 **Model**\
  \ 和 **Layout** 标签。这些标签在使用模型空间和图纸空间处理 DWG 文件时是基础的。我们现在将继续学习状态栏上的 AutoCAD 绘图设置。\n\n\
  ## Utilizing the drafting settings on the status bar\n\n大多数 AutoCAD 绘图设置都位于状态栏上。你会在屏幕右下角找到它，如\
  \ *Figure 3.12* 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_73_1.png)\n\nFigure\
  \ 3.12: The AutoCAD status bar\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_75_0.png)\n\
  \n状态栏上 **Polar** 图标右侧还有一个弹出箭头。点击它将打开 **Polar Tracking** 弹出菜单，可快速将极轴追踪角度调整为预设增量。*Figure\
  \ 3.15* 显示了此菜单。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_76_0.png)\n\nFigure\
  \ 3.15: The Polar Tracking flyout menu\n\n你也可以从弹出菜单中访问 **Tracking Settings**，以及设置预设角度增量。\n\
  \n- **Object Snap Tracking:** 此绘图设置纯粹是打开/关闭开关，用于打开 *AUTOSNAP* 系统变量。与 **Object Snaps\
  \ (OSNAP)** 结合使用时，此绘图设置允许在绘图时使用多个对象捕捉点。\n\n你可以右键单击此图标以选择 **Object Snap Tracking\
  \ Settings**。它将打开 **Drafting Settings** 对话框，并打开 **Object Snap** 选项卡。要在对话框中启用此设置，必须确保复选框已勾选，如\
  \ *Figure 3.16* 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_76_1.png)\n\nFigure\
  \ 3.16: The Drafting Settings dialog box with Object Snap Tracking switched on\n\
  \n\n\n\n\n- **对象捕捉**：在 AutoCAD 中使用对象捕捉 (*OSNAP*) 对于精确的 2D 绘图和 3D 建模至关重要。良好的 CAD\
  \ 实践是确保你始终使用对象捕捉以保证精度，但有时需要关闭对象捕捉，因此该图标位于状态栏上。\n\n与 **极轴追踪** 一样，**对象捕捉** (*OSNAP*)\
  \ 的图标可用，你可以在 *图 3.13* 中看到它。如果你右键单击该图标，可以选择 **对象捕捉设置...**，这将显示 **绘图设置** 对话框，并打开 **对象捕捉**\
  \ 选项卡。\n\n对话框显示在 *图 3.17* 中，**对象捕捉** 选项卡处于打开状态。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_77_0.png)\n\
  \n图 3.17：打开对象捕捉选项卡的绘图设置对话框\n\n对话框中勾选了各种对象捕捉模式，已勾选的被称为运行对象捕捉。最好只勾选一些复选框。否则，这会让绘图体验变得令人沮丧！图\
  \ 3.17 中选择的对象捕捉构成了一个良好的起点。设置好对象捕捉模式后，单击确定关闭对话框。\n\n对象捕捉也有一个弹出菜单，就像极轴追踪一样。当单击弹出箭头时，会显示图\
  \ 3.18 所示的弹出菜单，让你能够快速轻松地更改运行对象捕捉选择。已打开的项目在其旁边会显示一个复选标记。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_78_0.png)\n\
  \n图 3.18：对象捕捉弹出菜单\n\n你也可以在弹出菜单上选择对象捕捉设置... 来显示打开对象捕捉选项卡的绘图设置对话框。\n\n到目前为止提到的对象捕捉通常用于\
  \ 2D 绘图。在 3D 建模环境中工作时，你也可以通过单击或右键单击状态栏上的 3D 对象捕捉图标来在 AutoCAD 中使用 3D 对象捕捉 (3DOSNAP)，如图\
  \ 3.19 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_79_0.png)\n\n> **技巧与窍门 #7**\n\
  > \n> 本节仅触及了 AutoCAD 中主要绘图设置的一个方面。绘图设置有很多，建议你打开本章的练习文件 (3D Solid.dwg)，并按自己的节奏更深入地研究状态栏。从使用常规对象捕捉\
  \ (OSNAP) 进行 2D 绘图开始，例如，然后再使用 3D 对象捕捉 (3DOSNAP) 推进到 3D 建模。\n\n一个绘图设置在你首次安装并运行 AutoCAD\
  \ 时始终处于开启状态。那就是动态输入，称为 DYN MODE。然而，有关此绘图设置你应该知道一件事。虽然它处于开启状态，但图标最初不会显示在状态栏上。\n\n\
  要使其他绘图设置显示在状态栏上，你必须单击右下角的汉堡图标（在 AutoCAD for Mac 中，它显示为同一位置的齿轮图标）。将鼠标悬停在汉堡图标上时，会显示自定义工具提示。\n\
  \n图 3.20 显示了单击汉堡图标时出现的菜单。显而易见，这是一个很长的列表！\n\n## AutoCAD for Mac\n\n要在 AutoCAD for\
  \ Mac 中自定义状态栏，你需要在 AutoCAD for Mac 应用程序窗口左下角单击齿轮图标。这会显示与 *图 3.20* 中类似的菜单。绘图设置的列表较短，每个设置旁边都有一个复选框来打开或关闭设置，不像\
  \ Windows 版 AutoCAD，你单击设置名称来切换其开/关并显示复选标记。要在 AutoCAD for Mac 中关闭菜单，你需要再次单击齿轮图标。\n\
  \n![](img/e5541e806f2ef46a4958b6c3d0b346a9_80_0.png)\n\n图 3.20：状态栏自定义菜单\n\n请注意 *图\
  \ 3.20* 中 **动态输入** 被箭头标出。**动态输入** 绘图设置旁边没有复选标记，表明它当前未显示在状态栏上。单击菜单上的 **动态输入** 将打开它，并且设置名称旁边会出现复选标记。\n\
  \n要关闭菜单，请再次单击汉堡图标。这是关闭菜单的唯一方法，你必须这样做才能返回 AutoCAD 工作。\n\n**动态输入** 绘图设置现在显示在状态栏上。这在\
  \ *图 3.21* 中显示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_81_0.png)\n\n图 3.21：显示在状态栏上的动态输入图标\n\
  \n**动态输入** (*DYN MODE*) 非常有用。它允许你在光标（十字线）处输入命令信息，而不是使用屏幕底部的命令行。这为你提供了更动态的界面来使用 AutoCAD\
  \ 命令，因此得名 **动态输入**。\n\n与状态栏上的所有其他绘图设置一样，你可以右键单击图标并选择 **动态输入设置...**。单击此项将打开 **绘图设置**\
  \ 对话框，并打开 **动态输入** 选项卡，让你更新任何需要使用的动态输入设置，以便在 AutoCAD 中有效工作。*图 3.22* 显示了 **绘图设置**\
  \ 对话框中的 **动态输入** 选项卡。\n\n图 3.22：打开动态输入选项卡的绘图设置对话框\n\nAutoCAD 状态栏上的所有绘图设置都是独一无二的。你设置它们是为了让日常的\
  \ AutoCAD 工作更轻松。没有固定的设置。设置在你需要时存在，你根据需要和要求将其打开和关闭。利用它们来发挥你的优势，以便你能尽可能快速高效地使用 AutoCAD。\n\
  \n## 技巧与窍门 #8\n\n在 AutoCAD 中进行 3D 建模时，你可以在状态栏上使用 3D 对象捕捉 (3DOSNAP)。确保它们在状态栏上可见，使用自定义（汉堡）图标，然后将其打开。你可以像在状态栏上设置常规对象捕捉一样设置运行\
  \ 3D 对象捕捉，从而在 3D 工作时提高生产力。\n\n你学到的所有先前界面工具都可以在 2D 和 3D 环境中使用。下一节将我们直接带入 3D 建模和非常有用的\
  \ AutoCAD ViewCube。\n\n## AutoCAD ViewCube\n\n在本章中，3D 建模已被多次提及。在 3D 工作时，需要能够以各种等轴测视图查看\
  \ 3D 对象或实体。\n\n**ViewCube** 是一个导航工具，显示在 AutoCAD 绘图区域的右上角，无论你是在 2D 模型空间工作还是在 3D 视觉样式中。**ViewCube**\
  \ 允许你在标准视图和等轴测视图之间切换。\n\n**ViewCube** 是一种持久的、可点击的、可拖动的界面，允许你在模型的标准视图和等轴测视图之间切换。*图\
  \ 3.23* 显示了 **ViewCube** 位于 AutoCAD 绘图区域右上角的位置。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_83_0.png)\n\
  \n图 3.23：AutoCAD 绘图区域中的 ViewCube\n\n**ViewCube** 使用三种类型的视图，如下所示：\n\n- **边缘**\n-\
  \ **角**\n- **面**\n\n单击其中任何一个将重新对齐绘图区域中的 AutoCAD 视图，使其与 **ViewCube** 的方向相对应。使用练习文件\
  \ 3D Solid.dwg，单击 **ViewCube** 默认位置的 *左下角*，如图 *图 3.24* 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_84_0.png)\n\
  \n图 3.24：ViewCube 的左下角\n\n当你将鼠标悬停在角上时，它会亮起，以便你确保单击 **ViewCube** 的正确部分。单击后，绘图将看起来像\
  \ *图 3.25*。**ViewCube** 的该角将显示切换到预设的 **SW 等轴测** 视图，正如视图控制显示所指示的那样。使用 **ViewCube**\
  \ 的边缘、角和面可以让你在 AutoCAD 中有效导航，尤其是在处理 3D 模型时。\n\n\n\n\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_85_0.png)\n\
  \n图 3.25：在 SW 等轴测视图中显示的图形\n\n> **提示与技巧 #9**\n> \n> 在使用 ViewCube 时，你可以使用指南针显示，通过点击箭头来旋转当前使用的任意视图。你还可以点击*房屋*符号返回**主视图**。右键单击\
  \ ViewCube，然后使用快捷菜单上的**将当前视图设为主视图**来设置所需的主视图。此外，请测试快捷菜单上的其他设置，以了解它们对图形视觉显示的影响。使用\
  \ AutoCAD 系统变量 *DISPLAYVIEWCUBEIN2D* 和 *DISPLAYVIEWCUBEIN3D* 可在 2D 或 3D 工作空间中开启和关闭\
  \ ViewCube 的显示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_88_0.png)\n\n图 3.27：AutoCAD\
  \ 中的完整导航轮\n\n接下来我们来看看**实时平移**工具。\n\n## 实时平移\n\n**导航栏**上的**平移**图标可启动**实时平移**工具。该工具可让你在\
  \ AutoCAD 图形或模型中不间断地平移。在*实时平移*模式下，你可以右键单击并使用快捷菜单。这样你就可以使用其他**缩放**和**平移**工具。*图 3.28*\
  \ 显示了激活时的快捷菜单。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_88_1.png)\n\n图 3.28：实时平移快捷菜单（弹出菜单）\n\
  \n使用**实时平移**是在 DWG 文件中移动浏览的绝佳方式。在下一节中，你将学习如何使用**缩放**来放大 DWG 中的视图，以更详细地查看设计。\n\n\
  ## 缩放\n\n放大和缩小图形对于查看图形中的近景细节以及能够查看整体设计至关重要。导航栏上的缩放图标提供了一个弹出菜单，可访问 AutoCAD 缩放命令。图\
  \ 3.29 显示了激活的缩放弹出菜单。\n\n该弹出菜单提供了一个列出所有 AutoCAD 缩放命令的菜单，通过点击即可选择。最近使用的缩放命令将显示在导航栏上，直到选择下一个缩放命令。当前使用的缩放命令在弹出菜单上以勾选标记高亮显示。\n\
  \n![](img/e5541e806f2ef46a4958b6c3d0b346a9_89_0.png)\n\n图 3.29：当前为范围缩放的缩放弹出菜单\n\n\
  现在你已经掌握了有效使用缩放的知识。在下一节中，你将学习如何利用 Orbit 工具快速轻松地导航模型。\n\n## Orbit（弹出菜单）\n\n在 3D 图形中环绕观察对于查看图形中的重要细节以及能够展示整体设计至关重要。导航栏上的\
  \ Orbit 图标提供了一个弹出菜单，可访问 AutoCAD Orbit 命令。图 3.30 显示了激活的 Orbit 弹出菜单。\n\n该弹出菜单提供了一个列出所有\
  \ AutoCAD Orbit 命令的菜单，通过点击即可选择。最近使用的 Orbit 命令将显示在导航栏上，直到选择下一个 Orbit 命令。当前使用的 Orbit\
  \ 命令在弹出菜单上以勾选标记高亮显示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_90_0.png)\n\n图\
  \ 3.30：当前为 Orbit 的 Orbit 弹出菜单（弹出菜单）\n\n你可以使用 Orbit 在 DWG 文件中导航模型。使用 3Dconnexion\
  \ 设备可以让你在 3D 设计中环绕观察和缩放时更加精确。\n\n## 3Dconnexion\n\n仅当你拥有配置为与 AutoCAD 配合使用的 3Dconnexion\
  \ 设备（如 SpaceMouse 或 CadMouse）时，3Dconnexion 图标才可用。这些设备增强了与 AutoCAD 的人机交互界面，其中 SpaceMouse\
  \ 常用于 3D 建模。图 3.31 显示了激活的 3Dconnexion 弹出菜单。\n\n你可以在网站 www.3dconnexion.com 上找到有关\
  \ 3Dconnexion 设备的所有必要信息，也可以在那里下载任何必要的 AutoCAD 驱动程序。\n\n该弹出菜单提供了一个列出所有可用 3Dconnexion\
  \ 模式（取决于 3Dconnexion 设备）的菜单，通过点击即可选择。最近使用的 3Dconnexion 模式将显示在**导航栏**上，直到选择下一个模式。当前使用的模式在弹出菜单上以勾选标记高亮显示。你还可以在弹出菜单上访问设备的\
  \ **3Dconnexion 设置...**。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_91_0.png)\n\
  \n图 3.31：当前为对象模式的 3Dconnexion 弹出菜单\n\n**3Dconnexion** 设备是 AutoCAD 的绝佳补充。将其与 AutoCAD\
  \ 中的 **ShowMotion** 结合使用，可让你为 AutoCAD 中设计的特定视图创建无缝演示。\n\n## ShowMotion\n\n**ShowMotion**\
  \ 工具提供了一个屏幕显示，用于创建和播放图形中各种视图的电影式相机动画。这些视图随后可用于设计审查、演示和书签式导航。*图 3.32* 显示了**导航栏**上的\
  \ **ShowMotion** 图标。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_92_0.png)\n\n**ShowMotion**\
  \ 有三个主要部分：控制栏、镜头序列缩略图和镜头缩略图。镜头是显示模型特定部分的命名位置，相关镜头可以组织成镜头序列。**图 3.33** 显示了 3D 建模环境中的\
  \ **ShowMotion**，其中显示了两个已保存的镜头和 **ShowMotion** 控制栏。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_92_1.png)\n\
  \n**提示与技巧 #10**\n**ShowMotion** 是一个使用率极低且被低估的 AutoCAD 工具，它可以增强任何设计的视觉和演示质量。如果任何设计需要向利益相关者进行快速演示，**ShowMotion**\
  \ 应该是你的首选工具。\n\n考虑将 **ShowMotion** 作为你创建演示材料的首选工具。它集成在 AutoCAD 中，无需第三方应用程序。\n\n\
  **AutoCAD for Mac**\n请注意，AutoCAD for Mac 中没有 **ShowMotion** 功能。\n\n如你所见，**导航栏**功能极其多样——不仅仅用于在\
  \ 2D 图形和 3D 模型中导航。它提供了一个全面的导航工具箱，可提高你日常 AutoCAD 工作流程中的生产力，并且在 **ShowMotion** 中提供了一个有用的演示工具。\n\
  \n## 小结\n\n在本章中，你学习了如何使用文件选项卡和浮动图形窗口来管理已打开的图形文件。\n\n你还学习了如何使用**模型**和**布局**选项卡，以及如何复制选项卡并设置其所需的设置。\n\
  \n你还学习了如何利用状态栏上的草图设置来高效、多产地绘图和建模。\n\n你学习了在 3D 建模时如何使用 ViewCube 以及使用 ViewCube 设置，还学习了如何使用导航栏以及可用的工具。\n\
  \n更智能地使用 AutoCAD 界面将让你更高效。\n\n重要的是，你不仅要了解 AutoCAD 界面，还要充分利用它。多年来，该界面经历了许多迭代，现在已达到为你出色工作的程度，让你在日常工作中更加高效。在下一章中，我们将了解高级草图设置如何提高你的\
  \ AutoCAD 生产力。\n"
- "# 4 使用高级草图设置\n\nAutoCAD 拥有广泛的草图设置，位于 AutoCAD 状态栏上。本章将带你了解一些较少使用的高级草图设置，以便你通过更聪明而非更努力地工作来更有效、更高产地工作。\n\
  \n我们将向你展示如何使用特定的草图设置来增强你日常的 AutoCAD 使用，为你提供额外的技能，使你能够将 AutoCAD 用于更复杂的绘图任务。\n\n你将了解以下草图工具：\n\
  \n- 使用选择循环选择对象\n- 在 3D 建模时利用 3D 对象捕捉\n- 使用 ISODRAFT 设置创建等轴测视图\n- 通过状态栏更改单位\n- 使用注释比例提高图形可读性\n\
  \n在 AutoCAD 中学习更高级的绘图方法有助于你建立 AutoCAD 技能组合，反过来，这将使你在日常使用 AutoCAD 时更容易提高效率和生产力。\n\
  \n在*第 3 章*中，我们触及了如何使用位于 AutoCAD 状态栏上的草图设置。在本章中，我们将把这一知识提升一个档次，以使用图形中的特定草图设置。\n\n\
  \n\n\n\n## 练习文件\n\n对于本章，请确保您已下载以下练习文件：\n\n- `DraftingSettings.dwg`\n- `Office Project.dwg`\n\
  \n这两个文件将在本章的不同部分中使用，因此请确保您已在 AutoCAD 中打开它们，准备使用。\n\n## 使用选择循环选择对象\n\n在 AutoCAD 绘图中，总会遇到几何图形或对象\
  \ *重叠* 或共享同一条线或边的情形。确保选择正确的几何图形或对象非常重要，因为这有助于提高准确性并节省宝贵时间。这时选择循环（`SELECTIONCYCLING`）就非常有用。\n\
  \n选择循环也是过滤对象的绝佳方法。总是会有需要选择重叠对象进行修改或删除的时候。为了选择适当的对象，您可以使用选择循环从重叠对象的列表中选择正确的对象。随着您在本节的学习，您将看到选择循环是如何做到这一点的，并使您日常的\
  \ AutoCAD 工作变得更加轻松。\n\n在操作选择循环之前，您需要确保它已在 AutoCAD 状态栏上可用。点击位于 AutoCAD 屏幕右下角的自定义（*汉堡*）图标。选择\
  \ **Selection Cycling**。它旁边会出现一个勾号。再次点击自定义图标以关闭菜单。\n\n您现在可以在状态栏上看到选择循环图标。请确保它显示为蓝色，表示已打开。*图\
  \ 4.1* 显示了选择循环图标已打开的状态：\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_96_0.png)\n\n\
  图 4.1：AutoCAD 状态栏显示选择循环并已打开\n\n使用本章的练习文件（`DraftingSettings.dwg`），请确保您处于 AutoCAD\
  \ **Model** 选项卡中。您将看到两个矩形，一个蓝色一个红色。它们显示在 **ViewCube** 上的预设 **Top** 视图中。它们都是从上方（顶部）查看的\
  \ 3D 实体，并且彼此相邻，如 *图 4.2* 所示：\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_97_0.png)\n\
  \n图 4.2：Model 选项卡中预设 Top 视图中的两个矩形\n\n*图 4.2* 是两个相邻矩形的简单示例。即使在比这更复杂的绘图中，对象的几何图形也经常相邻或彼此靠近。无论我们处理的是简单还是复杂的绘图，选择循环都提供了一种高效的方法来在众多对象中选择单个对象。\n\
  \n现在您已经知道如何在绘图中选择对象以进行更改或删除，让我们学习如何在 3D 中准确建模，利用 3D 对象捕捉。\n\n## 在 3D 建模时利用 3D 对象捕捉\n\
  \n在 AutoCAD 中进行 3D 建模时，常规对象捕捉有时会将您捕捉到 3D 模型上的错误点。例如，您可能处于模型的平面（顶部）视图中，并选择 **Endpoint**\
  \ 对象捕捉以向模型添加几何图形。当您从模型顶部向下看时，该端点捕捉可能位于模型的上表面或下表面，具体取决于模型的朝向。\n\n**3D Object Snap**\
  \ (*3DOSNAP*) 是状态栏上的一个绘图设置，它为您提供仅在 3D 环境中起作用的对象捕捉选择，使您在 AutoCAD 中处理 3D 模型时更准确。\n\
  \n在操作 **3D Object Snap** (*3DOSNAP*) 之前，您需要确保它已在 AutoCAD 状态栏上可用。点击 **Customization**（*汉堡*）图标（如前几章所述）并选择\
  \ **3D Object Snap**。它旁边会出现一个勾号。再次点击 **Customization** 图标以关闭菜单。\n\n您现在可以在状态栏上看到\
  \ 3D 对象捕捉图标。请确保它显示为蓝色，表示已打开。*图 4.5* 显示了 **3D Object Snap** 图标已打开的状态：\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_100_0.png)\n\
  \n图 4.5：AutoCAD 状态栏显示 3D Object Snap 并已打开\n\n**3D Object Snap** 的操作方式与常规 **Object\
  \ Snap** 绘图设置相同。您打开它并从弹出菜单中选择运行的 3D 对象捕捉。如果您点击 **3D Object Snap** 图标右侧的弹出箭头，您将看到弹出菜单上的\
  \ 3D 对象捕捉。这在 *图 4.6* 中显示：\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_101_0.png)\n\
  \n图 4.6：3D Object Snap 弹出菜单\n\n您会在 *图 4.6* 中注意到 **Vertex**、**Midpoint on edge**\
  \ 和 **Center of face** 旁边有勾号，这表示这些是当前正在运行的 3D 对象捕捉。\n\n现在，让我们进入绘图区域并选择 **ViewCube**\
  \ 的左下角。这将把绘图置于预设的 **SW Isometric 3D** 视图中。您现在可以看到矩形看起来像它们应该的那样，即 3D 实体。这在 *图 4.7*\
  \ 中显示：\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_101_1.png)\n\n图 4.7：ViewCube\
  \ 显示的 SW Isometric 预设视图中的矩形（3D 实体）\n\n现在您处于 3D 视图中，可以更有效地利用 3D 对象捕捉。在图 4.8 中，您可以看到一条线从一个\
  \ 3D 捕捉点绘制到 3D Vertex 对象捕捉点，如工具提示所示：\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_102_0.png)\n\
  \n图 4.8：从一个 3D 对象捕捉到 3D Vertex 对象捕捉绘制的线\n\n### 技巧与窍门 #12\n\n在 3D 中工作时，您会发现 3D Object\
  \ Snap (3DOSNAP) 绘图设置比常规 Object Snaps (OSNAP) 更准确，因为您可以捕捉到 3D 顶点和面，而不必不断更改 3D 视图以找到适当的对象捕捉。\n\
  \n3D Object Snaps (3DOSNAP) 是 3D 环境中非常有用的工具。它们在 2D 对象捕捉（OSNAP）可能捕捉到错误点时，能准确捕捉到 3D\
  \ 对象上的几何点。\n\n数字表示不同的 *ISODRAFT* 模式将用于创建 2D 等轴测视图的位置：\n\n- **1**：isoplane Left\n\
  - **2**：isoplane Top\n- **3**：isoplane Right\n\n仅使用了 *Line (LINE)* 命令来创建视图，并借助对象捕捉（*OSNAP*）提供了一点帮助。*图\
  \ 4.10* 中的等轴测视图完全由在 *ISODRAFT* 提供的等轴测角度下绘制的线段组成。在绘制第一条线段（可以是所示的任何一条线）后，打开 *ISODRAFT*，其余线条可以很容易地在适当的角度绘制，使用对象捕捉（*OSNAP*）捕捉到按顺序绘制的每条线的相关端点。\n\
  \n您现在已经了解如何使用 *ISODRAFT* 设置进行等轴测绘图。所有实体和几何图形都需要相关的单位，因此接下来是如何通过状态栏在 AutoCAD 中更改单位设置。\n\
  \n## 通过状态栏更改单位\n\n有时您的 AutoCAD 单位设置需要更改。可能是您需要将单位从一种格式转换为另一种格式（例如从英制到公制），或者您可能只需要使用不同的单位集，因为绘图中的某个元素是英制的，而不是公制的，例如机械齿轮。\n\
  \n在 AutoCAD 中更新单位设置有两种方法。让我们先看第一种方法，使用 **Drawing Units** 对话框。\n\n要在 AutoCAD 中更改单位（*UNITS*），您需要输入\
  \ UNITS 并按 *Enter*。这将显示 **Drawing Units** 对话框，如 *图 4.11* 所示。您可以输入 UNITS 在命令行中并按\
  \ *Enter*，或者，如果 **Dynamic Input** 已打开，您可以在屏幕绘图区域的任何位置输入 UNITS 并按 *Enter*。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_106_0.png)\n\
  \n图 4.11：Drawing Units 对话框\n\n这是一种更新绘图单位集的比较繁琐的方法。有一种更快、更简单的方法可以做到这一点。\n\n如果您点击位于\
  \ AutoCAD 屏幕右下角的自定义（汉堡）图标（在状态栏末尾），然后从弹出菜单中选择 Units，Units 列表旁边会出现一个勾号。它还将作为绘图设置添加到状态栏中，如图\
  \ 4.12 所示，该图还显示了显示的弹出菜单：\n\n\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_107_0.png)\n\
  \n图 4.12：“单位”起草设置，显示有弹出菜单，并已选择“小数”单位\n\n在状态栏上使用此起草设置来更改图形中的单位，比反复打开**“图形单位”对话框**要快捷方便得多。\n\
  \n### 技巧与窍门 #13\n\n状态栏上的**“单位”**作为起草设置，仅用于线性单位。若要更改任何角度单位设置，仍需使用**“图形单位”对话框**。\n\
  \n单位只是 AutoCAD 设计工作流程中的一部分，能让您高效地进行绘图。您还需要通过图形中的注释来传达设计意图。接下来，我们将了解如何使用注释性比例和注释比例来提高图形的清晰度。\n\
  \n## 使用注释比例提高图形清晰度\n\n**“注释比例”**功能（*CANNOSCALE*）用于在图形中启用注释性缩放。它通常用于尺寸、文字和填充等图形元素，以便在布局选项卡中以不同的视口比例工作时，使图形整洁易读。\n\
  \n![](img/e5541e806f2ef46a4958b6c3d0b346a9_109_0.png)\n\n图 4.14：带有不同注释比例的尺寸\n\n\
  在图 4.14 中，较大的尺寸（2500 和 2750）的注释比例为 1:50，较小的尺寸（250 和 R1500）的注释比例为 1:30。这些尺寸通过与每个尺寸对象关联的注释比例，以注释性缩放的方式，与显示它们的布局视口的比例相对应。\n\
  \n这些注释性尺寸的优点在于，由于尺寸对象上应用了注释比例，它们在布局视口中能够保持一致的显示效果。您还可以应用多个注释比例，使注释性对象在多个不同比例的布局视口中显示。\n\
  \n要实现这一功能，只需一个注释性尺寸样式。在 Office Project.dwg 文件中，使用的是名为 Metric-mm 的注释性尺寸样式。如图 4.15\
  \ 所示，该图展示了“尺寸”面板，您可以在 AutoCAD 功能区的“注释”选项卡中找到它：\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_109_1.png)\n\
  \n图 4.15：“尺寸”面板中显示的当前注释性尺寸样式\n\n注释性尺寸样式使用一个蓝色的小三角形符号来表明其为注释性尺寸样式。\n\n使用注释性尺寸样式时，您需要在**“模型”**选项卡中，通过状态栏上的弹出菜单设置注释比例，如图\
  \ 4.16 所示：\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_110_0.png)\n\n图 4.16：注释比例弹出菜单，当前注释比例为\
  \ 1:50\n\n在图形中添加尺寸是为了传达设计意图。典型的例子包括房间的长宽、门窗洞口的尺寸，或者螺栓的杆长和螺纹长度。您通常会在图形中使用对象捕捉（OSNAP）来精确捕捉代表真实世界对象的几何图形，从而添加尺寸，以传达用于施工和制造的值。通过在**“模型”**选项卡中设置注释比例，您可以让\
  \ AutoCAD 知道如何在相应的布局选项卡中缩放尺寸。\n\n随后使用注释性尺寸样式放置的任何尺寸都将采用 1:50 的注释比例，从而确保它们显示在**1:50**布局视口中。对于**1:30**布局视口，也应采用相同的工作流程，即将注释性尺寸的注释比例设置为**1:30**。\n\
  \nAutoCAD DWG 文件中的所有对象都具有已知的特性，无论是**“图层”**、**“颜色”**、**“线型”**，还是本例中的**“注释比例”**。您可以通过在**“特性”**选项板中查看尺寸对象的属性来检查它是否为注释性对象。注释性尺寸的属性应如图\
  \ 4.17 所示：\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_111_0.png)\n\n图 4.17：在“特性”选项板中显示所选注释性尺寸对象的属性\n\
  \n注释性缩放与注释性尺寸配合使用时最大的优点是，您可以只使用一个注释性尺寸样式和一个图层来放置所有尺寸注释，并知道它会以一致的方式显示在所有不同比例的布局视口中。\n\
  \n### 技巧与窍门 #14\n\n在对注释性尺寸使用注释性缩放时，您还可以向单个尺寸对象添加多个注释比例。例如，如果某个尺寸需要同时显示在**1:50**布局视口和**1:30**布局视口中，您需要为该尺寸对象添加**1:50**和**1:30**注释比例。这可以通过**“特性”**选项板单击**“注释比例”**值来完成（见图\
  \ 4.17）。单击该值后，在显示的注释比例值旁边会出现一个小按钮。单击该按钮，您将能够在弹出的对话框中添加新的注释比例值。\n\n注释性缩放能极大地节省时间。当它与注释性尺寸配合使用时，您只需为尺寸创建一个尺寸样式和一个图层。\n\
  \n### AutoCAD for Mac\n\n注释性缩放同样适用于 AutoCAD for Mac。您可以使用类似的工作流程来设置注释性尺寸样式。在**“模型”**选项卡中工作时，使用状态栏上的注释比例弹出菜单来放置注释性尺寸对象，操作方式与\
  \ AutoCAD for Windows 相同。\n\n## 总结\n\n在本章中，我们学习了如何选择多个重叠对象并选取所需对象进行更新或删除，以及如何使用**“三维对象捕捉”**（*3DOSNAP*）更高效地进行三维建模。\n\
  \n我们还学习了如何利用等轴测草图（*ISODRAFT*）设置来创建精确的二维等轴测图形。\n\n我们还掌握了 AutoCAD 中**“单位”**（*UNITS*）功能的宝贵知识，能够快速有效地更改图形中的单位，同时也学习了如何设置和/或更改注释比例（*CANNOSCALE*），以便与图形中布局视口设置的注释比例协同工作。\n\
  \n本章中的高级起草设置将使您能够更高效地工作，提高生产力。它们还使您能够充分利用 AutoCAD 中的各种工具。既然您已经知道如何使用它们，您日常的 AutoCAD\
  \ 使用将变得不再繁重，您将开始更聪明地使用 AutoCAD，而不是更费力。\n\n在下一章中，我们将探讨如何使用对象捕捉在 AutoCAD 中开发高级几何图形。\n\
  \n## 技术要求\n\n要使用 AutoCAD，您需要在台式机或笔记本电脑上安装 AutoCAD 许可证。您还需要以下内容：\n\n- 一份 AutoCAD\
  \ 订阅（许可证）。这必须是 AutoCAD 的*完整*版本，而不是 AutoCAD LT。理想情况下，这将是 AutoCAD 的最新版本，即撰写本书时的*AutoCAD\
  \ 2025*。您可以使用更早的版本，但建议不要早于*AutoCAD 2022*。\n- 要使用订阅版 AutoCAD，您需要一个 Autodesk 账户。如果没有，您可以在\
  \ https://accounts.autodesk.com/ 注册一个。\n- 本书涵盖的是在 Microsoft Windows **操作系统（OS）**\
  \ 上运行的 AutoCAD 2025。所有图片和图形均来自 AutoCAD 2025 和*Windows 11 操作系统*。\n\n本书包含面向 Windows\
  \ 和 Mac 用户的操作说明。虽然已为 Windows 用户提供了全面的说明，但在标注框中也为 Mac 界面存在的差异提供了特别说明。\n\n## 练习文件\n\
  \n您需要确保已下载练习文件 `BearingCase.dwg` 才能完成本章。\n\n## 使用极轴追踪（POLAR）精确测量角度\n\n在使用**“极轴追踪”**（*POLAR*）之前，您需要确保它已出现在\
  \ AutoCAD 状态栏上。请按以下步骤操作：\n\n1. 点击**“自定义”**（*汉堡*）图标，然后选择**“极轴追踪”**。其旁边将出现一个对勾标记。\n\
  2. 再次点击**“自定义”**图标以关闭菜单。\n3. 现在您将在状态栏上看到**“极轴追踪”**图标。请确保其呈蓝色，表示已开启。\n\n*图 5.1 显示了开启后的**“极轴追踪”**图标：*\n\
  \n![](img/e5541e806f2ef46a4958b6c3d0b346a9_116_0.png)\n\n图 5.1：AutoCAD 状态栏显示“极轴追踪”并已开启\n\
  \n\n\n\n\n为什么需要 **极轴追踪**？它允许你使用预设的角度增量工作，并在需要时添加单独的角度增量。\n\n现在，让我们探索一下此功能的一些属性。你会注意到状态栏上的\
  \ **极轴追踪** 图标在其右侧有一个弹出菜单箭头。如果你点击此箭头，弹出菜单将显示可用的不同预设角度增量。*图 5.2 显示了此弹出菜单：*\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_117_0.png)\n\
  \n此弹出菜单显示可使用的预设角度增量。这些包括 90 度（*默认*）的增量、45 度、30 度，一直到 5 度增量。要查看更多属性，你可以点击 **追踪设置**。这将打开\
  \ **绘图设置** 对话框，其中 **极轴追踪** 选项卡当前处于打开状态。*图 5.3 显示了此对话框：*\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_118_0.png)\n\
  \n## 图 5.3：绘图设置对话框，其中极轴追踪选项卡当前处于打开状态\n\n在此对话框中，极轴追踪 On 复选框已被选中，表示极轴追踪（POLAR）当前处于打开状态（图标在状态栏上也会高亮显示为蓝色）。预设角度增量也可以在对话框中进行更新，而不仅仅是在状态栏的弹出菜单中进行选择。你可以通过使用显示\
  \ 90 度的下拉菜单（由箭头突出显示）来实现此操作。\n\n如果选中了附加角度复选框，你可以通过点击新建按钮来添加单独的角度增量。要删除任何不需要的单独角度增量，请使用删除按钮。取消选中附加角度框将关闭之前添加的任何附加角度。\n\
  \n现在，让我们使用 BearingCase .dwg 练习文件来尝试极轴追踪，该文件是需要制造的小型轴承外壳的 2D 绘图。在文件中的一个清晰区域，绘制图 5.4\
  \ 中所示的对称轴承板轮廓。完成的轴承板轮廓已包含在练习文件中供参考：\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_119_0.png)\n\
  \n图 5.4：为清晰起见显示距离、角度和中心线的全新轴承板\n\n在 Model 选项卡中使用极轴追踪预设的角度增量绘制轮廓。使用 90 度、45 度和 15\
  \ 度角度增量设置。你可以以直线或多段线形式绘制轮廓。完成后，请确保保存你的绘图。你可以使用相同的文件名保存，也可以使用不同的文件名以将其与原始练习文件区分开。\n\
  \n极轴追踪允许你自动化绘制 AutoCAD 几何图形的角度，从而节省你手动输入角度的时间。不仅如此，它还能提高你的生产力，同时保持准确性并减少错误。\n\n\
  > 技巧和窍门 #15\n> 在 AutoCAD 中使用极轴追踪（POLAR）时，状态栏上的绘图设置可以在任何时候更改，甚至在命令执行过程中更改。在绘制图 5.4\
  \ 中所示的轮廓时，尝试一次性创建轮廓，在使用直线（LINE）或多段线（PLINE）命令的同时根据需要更改状态栏上的极轴角度增量。\n\n极轴追踪是用于在绘图和建模时自动化常用角度的绝佳方法。确保将其纳入你在\
  \ AutoCAD 中设计的日常工作流程中。\n\n> AutoCAD for Mac\n> 你会在 AutoCAD for Mac 的状态栏上找到极轴追踪（POLAR）。它可以像在\
  \ AutoCAD for Windows 中一样使用。\n\n现在我们知道了如何使用极轴追踪获得准确的角度，让我们来看看如何使用 AutoCAD 的 ORTHOMODE\
  \ 实现正交移动。\n\n板的各边长度仅为清晰起见而显示。就像 *图 5.4* 中显示的新轴承板一样，尝试一次性绘制板轮廓，使用 **直线（LINE）** 或\
  \ **多段线（PLINE）** 命令。\n\n从板底部的左下角开始，该角由圆圈指示，并沿箭头方向前进，输入每个距离并在移动到下一线段方向之前按 *Enter*。你也可以使用\
  \ **关闭** 右键快捷菜单选项将线（或多段线）关闭到你开始的点。\n\n当 **ORTHOMODE** 打开时绘制板轮廓时，你会注意到在移动鼠标绘制线段时，你只能水平和垂直移动光标，从而消除了考虑任何角度增量的需要。这在绘制此类规则几何图形时可以节省大量时间。\n\
  \n有时需要精确的水平和垂直线。典型的例子是在平面图上的网格线，或如本节所述，需要板轮廓的垂直线。使用 **ORTHOMODE** 可确保所有线条彼此呈 90\
  \ 度，因此它们是垂直的。\n\n> **技巧和窍门 #16**\n> \n> 在使用 **LINE** 命令绘制线条或使用 **PLINE** 命令绘制多段线时，如果你错误地放置了线条或多段线段，可以使用一个巧妙的小技巧。只需右键单击调出快捷菜单，然后通过快捷菜单单击\
  \ **撤消**。请注意，这不会撤消整个命令——它只会撤消上一次放置的线条（或上一次多段线）段，使你回到上一个段的最后一个点。多次使用时，它也是返回到线（或多段线）中特定点的绝佳方法。\n\
  \n如果必须绘制大量彼此垂直（呈 90 度）的线条和几何图形，请考虑使用 **正交模式（ORTHO）**。由于 **正交模式（ORTHO）** 的方式将你限制在\
  \ X 和 Y 轴上，因此它是此用途的绝佳工具。\n\n> **AutoCAD for Mac**\n> \n> 你会在 AutoCAD for Mac 的状态栏上找到\
  \ **正交模式（ORTHO）**。它可以像在 AutoCAD for Windows 中一样使用，以限制光标正交。\n\n现在我们已经发现了使用 **ORTHOMODE**\
  \ 的好处，让我们来看看如何使用 **对象捕捉追踪（AUTOSNAP）** 处理多个捕捉。\n\n## 使用对象捕捉追踪（AUTOSNAP）高效地使用多个捕捉进行绘图\n\
  \n众多 AutoCAD 绘图设置使你的日常工作更简单。**对象捕捉追踪** *（AUTOSNAP）* 就是其中之一；你会发现，一旦你打开 **AUTOSNAP**\
  \ 并使用它，你就再也不会关闭它了。\n\n此绘图设置使用 AutoCAD 内置的 **AutoTrack** 技术，该技术跟踪你选择的捕捉，并在组合它们并形成基准点（例如中心、中点或交点）时进行跟踪。\n\
  \n与 **对象捕捉** *（OSNAP）* 和 **极轴追踪** *（POLAR）* 结合使用时，**AUTOSNAP** 允许你使用 AutoCAD 几何图形上的多个捕捉点，从而能够在无需生成不必要的构造线的情况下创建插入点和交点。\n\
  \n*图 5.7 显示了你在状态栏上可以找到 **AUTOSNAP** 图标的位置。该图标仅作为开/关切换使用。然而，你需要确保你的运行 **对象捕捉** *（OSNAP）*\
  \ 已定义并已打开；否则，**AUTOSNAP** 将无效：*\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_122_0.png)\n\
  \n图 5.7：状态栏，其中对象捕捉追踪（AUTOSNAP）已打开（箭头用于清晰显示）\n\n使用你在上一节中使用的绘图，BearingCase.dwg，让我们学习如何利用\
  \ **对象捕捉追踪** *（AUTOSNAP）*，以便你可以在轴承外壳中放置新几何图形，该外壳在你最初打开 DWG 文件时已存在于绘图中，如图 5.8 所示。\n\
  \n使用 **缩放** 和 **平移** 将轴承外壳居中于 AutoCAD 绘图区域，以便更轻松地处理几何图形：\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_122_1.png)\n\
  \n图 5.8 – 如 BearingCase.dwg 文件中所示的轴承外壳\n\n\n\n\n\n确保你已开启以下绘图设置：\n\n- **对象捕捉**（*OSNAP*）\n\
  - **极轴追踪**（*POLAR*）\n- **对象捕捉追踪**（*AUTOSNAP*）\n\n你需要开启以下对象捕捉模式：\n\n- **端点**\n- **中点**\n\
  - **交点**\n- **圆心**\n\n你还需要设置以下极轴角增量：90、180、270、360……\n\n在本练习中，你将在轴承箱轮廓内放置两个圆，以表示两个钻孔。*图5.9*显示了放置两个圆后图形的效果：\n\
  \n![](img/e5541e806f2ef46a4958b6c3d0b346a9_123_0.png)\n\n图5.9：带有新圆的轴承箱（为清晰起见，用箭头和粗体显示）\n\
  \n让我们开始本练习：\n\n1. 在功能区**常用**选项卡的**绘图**面板上，选择**圆**弹出按钮以绘制新的圆。\n2. 然后选择**圆心、半径**。AutoCAD将提示你输入要绘制的圆的圆心。正是在工作流程的这一步，我们将使用**对象捕捉追踪**（*AUTOSNAP*）。\n\
  3. 使用前面描述的设置，将鼠标悬停在绘图中轴承箱左侧外边界的**中点**对象捕捉上。但是，*不要单击*它；只需悬停几秒钟。你会看到捕捉符号*内部*出现一个小十字标记。这就是**对象捕捉追踪**正在记忆**中点**对象捕捉。\n\
  4. 然后，将鼠标向右拖动。你会看到绿色的虚线追踪线。*图5.10*显示了它在屏幕上的样子：\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_124_0.png)\n\
  \n图5.10：中点对象捕捉被用作对象捕捉追踪点（为清晰起见用箭头标出）\n\n当你将鼠标拖动到**中点**对象捕捉右侧的蓝色垂直中心线上时，会出现一个**交点**对象捕捉。这是**对象捕捉追踪**正在以相对于你悬停的**中点**对象捕捉的90度增量拾取交点。*图5.11*显示了**交点**对象捕捉：\n\
  \n图5.11：与中点对象捕捉对齐的交点对象捕捉（为清晰起见用箭头标出）\n\n5. 单击该**交点**对象捕捉——这就是你的圆心将要放置的位置。系统会提示你输入圆的半径。输入半径值10并按Enter键。圆现在将如下放置：\n\
  \n![](img/e5541e806f2ef46a4958b6c3d0b346a9_125_0.png)\n\n图5.12：使用对象捕捉追踪（AUTOSNAP）后放置的圆\n\
  \n6. 使用轴承箱右侧外边界的**中点**对象捕捉，重复此工作流程，但向左拖动，朝向右侧的蓝色垂直中心线（与上一个示例方向相反）。这将得到与图5.9所示相同的结果，但位于轴承箱的另一侧（右侧）。\n\
  \n![](img/e5541e806f2ef46a4958b6c3d0b346a9_125_1.png)\n\n仅通过这个简单的工作流程，你现在就可以看到**对象捕捉追踪**（*AUTOSNAP*）的优势。如果AutoCAD没有此功能，你将需要绘制辅助构造线来定位放置新圆所需的**交点**对象捕捉点。\n\
  \n*AUTOSNAP*是一个非常高效的工具，无需绘制大量构造线来获取所需的数据和捕捉点。它还省去了绘制可能之后需要擦除的不必要几何图形的需要。\n\n> **技巧和提示\
  \ #17**\n> **对象捕捉追踪**（*AUTOSNAP*）允许你在进行任何一次捕捉追踪时使用最多7个追踪点。这可以是对象捕捉或临时追踪点的任意合理组合。选择追踪点时，无需单击鼠标。只需将鼠标悬停在所需点上，直到出现相应的对象捕捉说明，但*不要单击！*当你悬停时，AutoCAD会将此点识别为追踪点并将其添加到最多七个点中。我们都被教导要移动鼠标并在必要时单击。使用*AUTOSNAP*时，你不需要单击！\n\
  \n请确保将**对象捕捉追踪**（*AUTOSNAP*）与你的运行对象捕捉结合使用。这样，你可以确保充分利用**对象捕捉追踪**（*AUTOSNAP*）提供的功能。\n\
  \n> **适用于Mac的AutoCAD**\n> 在Mac版AutoCAD中，你会在状态栏上找到**对象捕捉追踪**（*AUTOSNAP*）。当使用**对象捕捉**（*OSNAP*）和**极轴追踪**（*POLAR*）时，它的用法与Windows版AutoCAD中的完全相同。\n\
  \n**对象捕捉追踪**（*AUTOSNAP*）是利用对象捕捉的一种好方法。在下一节中，我们将学习如何不仅利用我们的**对象捕捉**（*OSNAP*），还要学习如何使用**捕捉覆盖**。\n\
  \n## 使用对象捕捉（OSNAP）和捕捉覆盖进行准确有效的绘图\n\n**对象捕捉**（*OSNAP*）在*第4章*的*在三维建模时利用三维对象捕捉*一节中已提及，它们是AutoCAD的基本功能，确保所有二维绘图和三维建模都以准确和精确的方式执行。\n\
  \n你现在应该已经熟悉常用的对象捕捉，如**端点**、**中点**和**圆心**。其他常用的对象捕捉还包括**交点**和**延伸**。如果你对这些不熟悉，可以使用AutoCAD帮助功能，或者查看*AutoCAD漫游指南*（它也是AutoCAD帮助功能的一部分——可以在AutoCAD的**开始**选项卡中找到）。\n\
  \n在本节中，我们将研究一些较少使用的对象捕捉，它们可以帮助你提高效率和生产力。我们还将继续使用本章前面部分所用的BearingCase.dwg文件。\n\n\
  所有对象捕捉都可以通过AutoCAD状态栏访问，该状态栏位于AutoCAD应用程序窗口的右下角。你也可以输入OSNAP并按Enter键。这将打开“草图设置”对话框中的“对象捕捉”选项卡。\n\
  \n对象捕捉（OSNAP）是AutoCAD的一项绘图设置，默认情况下通常显示在状态栏上。该图标通常处于打开状态（蓝色），并将端点和圆心设置为运行对象捕捉。\n\n\
  运行对象捕捉是已打开并在绘图时始终可用的捕捉。对象捕捉覆盖是指那些尚未打开但可以在覆盖运行对象捕捉时使用的捕捉。在本节稍后，我们将进一步了解捕捉覆盖。\n\n\
  OSNAP绘图设置显示在状态栏上，如图5.13所示：\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_127_0.png)\n\
  \n图5.13：状态栏上的对象捕捉（OSNAP）弹出菜单，单击对象捕捉图标后显示（用箭头标出）\n\n上图还显示了当单击状态栏上**OSNAP**图标右侧的弹出箭头时可用的弹出菜单。此菜单显示当前运行的对象捕捉，全部带有复选标记。复选标记表示该对象捕捉已开启。未复选的对象捕捉则关闭。\n\
  \n> **技巧和提示 #18**\n>\n> 你也可以从弹出菜单中选择**对象捕捉设置…**。这将显示**草图设置**对话框，并已打开**对象捕捉**选项卡。在此选项卡中，你可以清除所有现有的运行对象捕捉，并选择*所有*对象捕捉作为运行对象捕捉。但是，不建议这样做，因为那样你将没有几何捕捉点可供捕捉，从而导致绘图不准确。你也可以在此对话框中打开或关闭**对象捕捉**，以及**对象捕捉追踪**。\n\
  \n**对象捕捉**（*OSNAP*）对于准确和精确的绘图和建模至关重要。在创建设计时，请务必使用它们。\n\n> **适用于Mac的AutoCAD**\n>\n\
  > 在Mac版AutoCAD中，你会在状态栏上找到**对象捕捉**（*OSNAP*）。它的使用方式与Windows版AutoCAD中相同，包括选择**设置…**以显示带有**对象捕捉**选项卡的**草图设置**对话框。\n\
  \n一组良好的运行对象捕捉包括**端点**、**中点**、**圆心**、**交点**和**延伸**。不建议将它们全部选为运行对象捕捉，因为这会变得难以操作；AutoCAD会尝试捕捉到所有可用的对象捕捉。\n\
  \n*图5.13*中显示已勾选的运行对象捕捉集合应该能在大多数绘图和建模任务中让你处于有利地位。然而，有时可能需要运行其他对象捕捉。例如，圆有多种对象捕捉。最明显的是**圆心**，但在处理圆几何图形时，你可能还会使用**象限点**对象捕捉或**切点**对象捕捉。\n\
  \n## 查找几何中心\n\n其中一个非常实用的备选对象捕捉是较新的捕捉功能，称为**几何中心**。就像**圆心**对象捕捉可捕捉到圆弧或圆的圆心一样，**几何中心**对象捕捉可捕捉到闭合几何形状（如闭合多段线）的几何中心。\n\
  \n在本节中，你将把轴承箱的现有几何图形转换为闭合多段线，并找到**几何中心**对象捕捉。然后，你将使用定位到的**几何中心**来放置一个圆。\n\n\n\n\n\
  要执行此操作，您需要练习文件 `BearingCase.dwg`，其外部轮廓由若干单独的直线和一条圆弧组成。请按照以下步骤查找几何中心对象捕捉：\n\n1. 输入\
  \ `PE`。您会在动态输入建议菜单中看到 `PE (EDIT)`。单击它；系统将出现“选择多段线或”提示。\n2. 选择轴承座轮廓上的圆弧，如图5.14所示：\n\
  \n![](img/e5541e806f2ef46a4958b6c3d0b346a9_129_0.png)\n\n图5.14：选定的圆弧及显示的相应 AutoCAD\
  \ 提示\n\n您将收到提示“是否要将其转换为一条？<Y>”。\n\n3. 当默认选项 Y 高亮显示时，按 Enter。这将确认您希望将所选圆弧转换为一条多段线段。输入\
  \ N 并按 Enter 将会阻止该圆弧转换为多段线段。此时将出现“编辑多段线”（PEDIT）菜单，如图5.15所示：\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_129_1.png)\n\
  \n图5.15：“编辑多段线”菜单，其中“合并”已高亮并用箭头标出\n\n4. 从弹出菜单中选择 **合并**，然后选择构成轴承座轮廓的所有其余元素。图5.16显示了所有选定的元素，AutoCAD\
  \ 会将其以蓝色高亮显示。\n\n请注意，此时您可以重新选择之前最初选定的圆弧。这不会影响 **编辑多段线**（*PEDIT*）命令的工作流程：\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_130_0.png)\n\
  \n图5.16：使用“编辑多段线”（PEDIT）命令合并为多段线的选定元素（箭头所示）\n\n5. 按 *Enter*。您将返回到菜单。\n\n6. 再次按 *Enter*\
  \ 以关闭 **编辑多段线**（*PEDIT*）命令。轴承座的外部边界现在是一条闭合多段线。\n\n7. 单击以将其选中。您会看到它现在是一个闭合对象，并带有蓝色的\
  \ AutoCAD 夹点，如图5.17所示：\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_131_0.png)\n\n\
  图5.17：选定的多段线及其显示的夹点\n\n8. 单击状态栏上的“对象捕捉”弹出菜单，如图5.13所示。\n\n9. 在菜单中，单击“几何中心”。您会看到其旁边出现复选标记。它现在是一个运行对象捕捉。\n\
  \n10. 在功能区“常用”选项卡的“绘图”面板中，从“圆”弹出菜单中选择“圆心、半径”命令。系统将提示您指定圆心。\n\n11. 将光标/十字准线悬停在新创建的外部多段线的任意部分上。忽略其他对象捕捉，您会看到轴承座中心附近出现一个类似星号的小符号（*），如图5.18中箭头所示。\n\
  \n这就是几何中心对象捕捉：\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_131_1.png)\n\n图5.18：轴承座轮廓多段线的几何中心对象捕捉（箭头所示）\n\
  \n12. 将光标/十字准线移动到该对象捕捉上（它会以绿色圆圈高亮显示），然后点击。这将成为您圆的圆心。\n13. 输入 15 作为半径值，然后按 Enter。您会看到新的圆出现，如图5.19所示：\n\
  \n![](img/e5541e806f2ef46a4958b6c3d0b346a9_132_0.png)\n\n图5.19：使用几何中心对象捕捉放置的新圆（箭头所示）\n\
  \n在闭合多段线（例如矩形或正方形）中，我们可以使用对边的中点对象捕捉来找到几何中心。但在不规则形状（如轴承座轮廓）中，这种方法可能不起作用。这就是为什么使用几何中心是查找可能不符合常规约束的形状的精确中心的极其准确的方法。\n\
  \n## 使用捕捉替代\n\n有时，您不希望将某个对象捕捉设置为运行对象捕捉。这时，对象捕捉替代便派上用场。它被称为对象捕捉替代，您可以使用它来覆盖运行对象捕捉，以便在一次性使用中仅利用一个特定对象捕捉。\n\
  \n对象捕捉替代允许您使用当前未在“对象捕捉”绘图设置中设置的对象捕捉。即使没有正在运行的命令，您也始终可以访问对象捕捉替代。您可以按住 Shift 键并单击鼠标右键来做到这一点。这将随时调出对象捕捉替代菜单。请注意，如果在命令工作流程中执行此操作，则更有用，因为这样您就可以在正在使用的命令中访问捕捉替代。图5.20显示了使用\
  \ Shift+右键单击方法访问时的对象捕捉替代菜单：\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_133_0.png)\n\
  \n图5.20：使用 Shift+右键单击时显示的对象捕捉替代菜单\n\n请注意，在图5.20中，您仍然可以通过单击“对象捕捉设置...”（箭头所示）来访问“草图设置”对话框。这将以与使用状态栏上的“对象捕捉”弹出菜单相同的方式，打开当前显示“对象捕捉”选项卡的对话框。\n\
  \n有几种替代对象捕捉非常有用，尤其是在命令工作流程中使用时。要进一步探索对象捕捉，请查看 Autodesk 网站：https://help.autodesk.com/view/ACD/2023/ENU/?guid=GUID-8F5E5431-9EFB-414E-BC6D-2C65EFB2DAC3。\n\
  \n我们将介绍一种替代对象捕捉，称为“两点之间的中点”（Mid Between 2 Points，M2P）。此捕捉功能在图5.20中用箭头突出显示。\n\n该捕捉功能允许您在任意几何图形（或坐标）上指定两个点，然后找到它们之间的中点。我们将使用它在\
  \ `BearingCase.dwg` 文件中创建一些新的中心线，因此请确保将 **中心线** 图层设置为当前图层。另外，请确保已打开 **极轴追踪**（*POLAR*）和\
  \ **对象捕捉追踪**（*AUTOSNAP*）。它们应在状态栏上以蓝色显示。\n\n要创建新的中心线，请按照以下步骤操作：\n\n1. 缩放到轴承座轮廓的左下角。在功能区“常用”选项卡的“绘图”面板中选择\
  \ **直线** 命令。系统将提示您指定直线的第一个点。\n2. 此时，按住 **Shift** 键并单击鼠标右键。将出现 **对象捕捉替代** 菜单。\n3.\
  \ 单击 **两点之间的中点**。系统将提示您指定 **中点的第一点**。\n4. 单击 *图5.21* 中所示的 **端点** 对象捕捉。这将是第一个中点：\n\
  \n![](img/e5541e806f2ef46a4958b6c3d0b346a9_134_0.png)\n\n图5.21：第一个中点即为所示的端点对象捕捉（箭头所示）\n\
  \n5. 然后，单击图5.22中所示的端点对象捕捉。这将是第二个中点：\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_135_0.png)\n\
  \n图5.22：第二个中点即为所示的端点对象捕捉（箭头所示）\n\n新中心线的第一个点现在将位于轴承座轮廓的下边缘（图5.23中的点1），位于已选的两个中点之间。\n\
  \n6. 拖动鼠标并悬停在现有中心线的上端点上方，如图5.23中的点2所示。这将为该 **端点** 对象捕捉激活 **对象捕捉追踪**（AUTOSNAP）：\n\
  \n![](img/e5541e806f2ef46a4958b6c3d0b346a9_136_0.png)\n\n图5.23：M2P 对象捕捉替代已放置直线的第一个点（1）。将鼠标悬停在现有中心线的端点对象捕捉（2）上会创建一个对象捕捉追踪点\n\
  \n7. 切记不要单击它，然后将鼠标向左拖动，如 *图5.24* 所示：\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_137_0.png)\n\
  \n图5.24：向左移动（箭头所示）以创建新中心线第二个点（端点）的对象捕捉追踪点\n\n8. 当垂直和水平追踪线相交时（显示为绿色虚线），单击指示的点。这将是中心线的端点。\n\
  \n9. 按 *Enter* 关闭 **直线** 命令。\n\n在此工作流程结束时，您将得到一条新中心线，其长度与现有中心线相同，位于现有中心线和圆的左侧，如\
  \ *图5.25* 所示。\n\n如果您愿意，现在可以在轴承座的右侧重复此工作流程，以创建另一条新的中心线。这将很好地练习巩固如何使用“两点之间的中点”（M2P）对象捕捉功能：\n\
  \n![](img/e5541e806f2ef46a4958b6c3d0b346a9_138_0.png)\n\n图5.25：使用 M2P 对象捕捉功能放置的新中心线\n\
  \n## 技巧与窍门 #19\n\n您还可以在命令执行中途，从右键单击快捷菜单中选择“对象捕捉替代”。这是 Shift+右键单击方法之外的一种替代方式。只需在命令中途右键单击，并从快捷菜单中选择“对象捕捉替代”即可。这将弹出与使用\
  \ Shift+右键单击方法时相同的菜单。但请注意，只有在几何图形的第一个点（或基点）放置后，您才能调出此菜单。对于第一个点（或基点），您始终需要使用 Shift+右键单击。\n\
  \n您现在不仅熟悉了 AutoCAD 中的对象捕捉，还掌握了如何使用捕捉替代。这将使您的绘图和建模更加精确、高效。\n\n\n\n\n## 总结\n\n在本章中，我们学习了如何使用**极轴追踪**（*POLAR*），并在创建几何图形和对象时有效运用它。\n\
  \n你还学习了如何利用正交投影，并通过**正交模式**（**ORTHOMODE**）设置绘制直线和垂直线几何图形。\n\n接着，你了解了**对象捕捉追踪**（*AUTOSNAP*），这是一个直观的绘图工具，无需绘制辅助构造线。当它与**极轴追踪**（*POLAR*）和**对象捕捉**（*OSNAP*）结合使用时，可以实现高度精确的绘图和建模。\n\
  \n之后，你学习了如何使用**几何中心**对象捕捉（较少使用的对象捕捉之一），并利用它高效绘图。\n\n最后，你学习了如何使用**对象捕捉替代**，快速、即时地捕捉到现有几何图形。\n\
  \n本章演示的对象捕捉和设置揭示了它们在 AutoCAD 绘图中重要性。它们对于任何为进一步推进设计而创建的几何图形的准确性和精确度都是基础性的。\n\n对象捕捉让你能够充分发挥\
  \ AutoCAD 中绘图工具的优势。有些对象捕捉非常有用。**几何中心**和**两点之间的中点**（*M2P*）只是其中两个鲜为人知的对象捕捉，它们能让你的日常\
  \ AutoCAD 工作更轻松地管理。\n\n在下一章中，我们将学习如何通过使用**快速测量**和**距离**等命令，来修改和测量 AutoCAD 图纸中的几何图形和现有对象。\n\
  \n在*第 5 章*中，你了解了如何使用 AutoCAD 的对象捕捉来创建高级几何图形。在本章中，你不仅将利用这些对象捕捉，还将使用一些有趣的 AutoCAD\
  \ 工具与这些捕捉相结合，在计算距离、面积和角度时实现精确的准确性。\n\n## 练习文件\n\n你必须确保已下载练习文件 Sawblade.dwg、Sawblade2.dwg\
  \ 和 Sawblade3.dwg，以便跟随本章各节进行操作。\n\n## 使用名词/动词选择快速轻松地选择对象\n\n**名词/动词选择**在 AutoCAD\
  \ 中通常默认开启。它允许你在执行相应命令以操作所选对象*之前*选择 AutoCAD 对象。\n\n这是一个特别有用的功能，因为它让你免于更长且相对更复杂的工作流程。如果没有**名词/动词选择**，你将被迫先选择一个命令，然后在**选择对象**提示下选择对象，再按*回车键*确认对象选择，之后才能对所选对象使用该命令。\n\
  \n尽管这是默认设置，但最好检查它是否已启用。要找到它，只需在未选择任何对象且未运行任何命令时右键单击，然后在快捷菜单中选择**选项**。或者，你可以单击 AutoCAD\
  \ 图标（左上角）打开**应用程序菜单**，并在那里找到**选项**按钮。\n\n你将在**选项**对话框的**选择**选项卡中找到**名词/动词选择**。如*图\
  \ 6.1*所示，**名词/动词选择**复选框出现在左上角。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_143_0.png)\n\
  \n图 6.1：勾选了名词/动词选择的选项对话框\n\n你会注意到**名词/动词选择**复选框已被勾选，这意味着**名词/动词选择已开启**。**名词/动词选择**复选框的工作方式类似于人类大脑拿起物体时的过程。在拿起一个物体（*名词*）之前，它会先选择该物体，然后拿起它（*动词*）。\n\
  \n### 技巧与窍门 #20\n\n**名词/动词选择**在任何 AutoCAD 安装中都应默认开启。然而，用户（有时）确实会将其关闭。一个典型的原因可能是需要选择多个对象。关闭**名词/动词选择**后，可以先选择命令（动词），接着在**选择对象**提示（名词）下轻松选择多个对象，然后在命令工作流程中按回车键确认选择。根据个人偏好，用户可能会采用这种工作流程。为了充分利用本章内容，最好保持其开启。你也可以输入\
  \ `PICKFIRST` 并按回车键来更改变量值。要开启它，**PICKFIRST**应设置为 **1**。将其设置为 **0**（零）则关闭它。\n\n**名词/动词选择**非常有用。它能让\
  \ AutoCAD 体验更加流畅。尝试在开启和关闭它的情况下使用 AutoCAD，你就会看到它对日常 AutoCAD 工作流程带来的差异。\n\n### Mac\
  \ 版 AutoCAD\n\n**名词/动词选择**在 Mac 版 AutoCAD 中不受支持。你还会发现**选项**对话框被称为**应用程序首选项**。你可以通过单击\
  \ **AutoCAD 2024**（左上角——如果你使用的是 2024 版本；对于 AutoCAD 2023，则会显示 **AutoCAD 2023**，以此类推）找到它。选择**首选项...**，**应用程序首选项**对话框将打开。Mac\
  \ 用户可以利用此对话框管理其 AutoCAD 设置。这些设置包括**外观与感觉**，用户界面可以调整以适应 Mac 用户；以及**单位与辅助线**，用户可以设置特定的源内容单位和目标图形单位，类似于在\
  \ Windows 版 AutoCAD 中的设置方式。该对话框如图 6.2 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_145_0.png)\n\
  \n图 6.2：Mac 版 AutoCAD 中的应用程序首选项对话框\n\n现在我们已经学习了如何使用名词/动词选择功能，让我们来看看其他 AutoCAD 工具：快速测量和距离。\n\
  \n## 使用快速测量和距离计算长度和角度\n\nAutoCAD 是一个绘图应用程序，让你能够传达设计意图。伴随着这种意图，就需要准确测量距离。\n\n在 AutoCAD\
  \ 2021 及以后版本中，你可以通过两种方式做到这一点：\n\n- **快速测量**：当你将光标移到图纸中的几何图形上时，此工具会测量所有距离和角度\n- **距离**：此工具使用对象捕捉来精确准确地测量单个距离（长度）\n\
  \n使用 Sawblade.dwg 文件，你现在将使用这两个工具来准确测量距离（对于快速测量，还包括角度）。按照以下步骤了解如何操作：\n\n1. 打开 Sawblade.dwg\
  \ 文件，并放大到圆锯片顶部的锯齿处。\n\n2. 在功能区上的“常用”选项卡中，单击“实用工具”面板上的“测量”弹出按钮。你将看到“快速”（快速测量），如图\
  \ 6.3 所示。单击它。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_146_0.png)\n\n图 6.3：带有快速测量（箭头所指）的测量弹出按钮\n\
  \n3. 在图纸文件中围绕锯片移动光标。你将看到显示大量测量值，包括角度，如图 6.4 所示。\n\n被测量的几何图形以不同于几何图形颜色的另一种颜色（紫色）高亮显示。另外请注意，弧长也会被测量。\n\
  \n![](img/e5541e806f2ef46a4958b6c3d0b346a9_147_0.png)\n\n图 6.4：快速测量高亮显示的已测量几何图形\n\
  \n4. 要关闭**快速测量**，请按键盘上的 *Esc* 键。你也可以右键单击并在快捷菜单中选择“回车”。\n\n5. 检查状态栏上的对象捕捉是否*开启*，然后再次单击**测量**弹出按钮。这次选择**距离**。\n\
  \n6. 系统将提示你选择要测量的起点。这就是你需要对象捕捉来准确测量距离的原因。\n\n7. 选择锯齿上的下方点（如*图 6.5*中的 **1** 所示），然后选择其下方的点（如*图\
  \ 6.5*中的 **2** 所示）。\n\n8. 随后将显示测量距离以及**测量**菜单，以便你可以继续使用任何**测量**工具进行测量，如*图 6.5*所示。\n\
  \n图 6.5：使用距离工具测量点之间的距离\n\n9. 你可以随时在测量菜单中选择“退出”来关闭该工具，或按键盘上的 Esc 键取消“测量”（MEASUREGEOM）命令。\n\
  \n当你只需要查看和确认现有距离和角度时，快速测量是一种很好的可视化检查方式。距离工具则允许利用对象捕捉等精度工具，对现有距离进行更详细的测量。\n\n\n\n\
  \n\n### AutoCAD for Mac\n\n**测量**（*MEASUREGEOM*）命令在 Mac 版 AutoCAD 中可用，但没有默认图标或弹出菜单。只需输入\
  \ MEASUREGEOM 并按 *回车* 即可激活**测量**工具，然后右键单击弹出快捷菜单，该菜单将显示命令中可用的测量工具，例如**快速测量**和**距离**。\n\
  \n现在，你已经知道如何在 AutoCAD 中利用**快速测量**和**距离**有效地测量距离和角度。现在让我们看看如何使用**面积**工具添加和减去面积。\n\
  \n## 使用面积工具添加和减去面积\n\n有时，需要根据 AutoCAD 几何图形计算面积。**测量**（*MEASUREGEOM*）命令中的**面积**工具可以让你快速、轻松，更重要的是准确地完成此操作。\n\
  \n该工具的工作流程与**快速测量**和**距离**类似。但是，你可以使用**面积**工具，通过添加和减去几何图形（如闭合多段线）的面积来执行简单的面积计算。\n\
  \n在以下练习中，你将快速准确地添加和减去面积，以计算最终所需的面积：\n\n- 1. 打开 Sawblade2.dwg 文件。请注意，有一条闭合多段线构成锯齿的轮廓，还有一个中心圆表示锯片中心的孔。\n\
  \n- 2. 与**快速测量**和**距离**一样，从功能区的**常用**选项卡上的**实用工具**面板中选择**测量**弹出菜单。单击**面积**。\n\n\
  - 3. 你将看到**指定第一个角点**提示。这是用于当你可能需要围绕某个区域选择单个点来定义该区域时的情况。你可以使用对象捕捉来完成此操作，但无需这样做，因为你的面积区域已由闭合多段线（锯齿）和圆（锯片上的孔）完全闭合。\n\
  \n- 4. 右键单击并在快捷菜单中选择**添加面积**。你将看到相同的角点提示。直接忽略它并再次右键单击。在快捷菜单中选择**对象**。现在你将看到（**添加模式**）**选择对象：**提示，如图\
  \ 6.6 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_150_0.png)\n\n图 6.6：（添加模式）选择对象，准备选择锯齿\n\
  \n- 5. 选择锯齿。它们是闭合多段线，因此将作为一个对象被选中。它们会以绿色突出显示，显示已添加的面积，如 *图 6.7* 所示。按 *回车* 确认选择。\n\
  \n![](img/e5541e806f2ef46a4958b6c3d0b346a9_150_1.png)\n\n图 6.7：锯齿闭合多段线被选中，作为添加的面积\n\
  \n- 6. 你将看到面积显示在 AutoCAD 绘图区域的一个小灰色框中，列出**面积**、**周长**和**总面积**。同时再次出现角点提示，期待你开始描绘另一个要添加的面积。如\
  \ *图 6.8* 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_151_0.png)\n\n图 6.8：显示计算得到的锯齿面积，以及周长和总面积\n\
  \n- 7. 再次右键单击，在快捷菜单中选择**减去面积**。\n\n- 8. 再次右键单击并选择**对象**。现在你将看到**（减去模式）选择对象**提示，类似于你添加锯齿面积时的情况。如\
  \ *图 6.9* 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_151_1.png)\n\n图 6.9：（减去模式）选择对象，准备选择圆\n\
  \n- 9. 选择表示锯片上圆孔的圆。该圆现在以棕色突出显示，表示它将从锯齿面积中减去，如 *图 6.10* 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_152_0.png)\n\
  \n图 6.10：该圆以棕色突出显示，表示将被减去\n\n- 10. 按 *回车*。在你添加锯齿面积时看到的同一个灰色框中，现在将显示圆的面积（1963.4954）以及**总面积**（12707.0923）。总面积是锯齿多段线的面积减去圆面积后得到的结果，即锯片的实际物理面积。如\
  \ *图 6.11* 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_152_1.png)\n\n图 6.11：圆的面积，以及减去圆面积后锯片的总面积\n\
  \n- 11. 按 *回车* 完成。现在你可以选择**退出**来关闭**测量**命令。\n\n### 技巧与窍门 #21\n\n如果展开 AutoCAD 命令行，你将看到使用面积工具的“添加”和“减去”功能时使用的所有命令和数据，如图\
  \ 6.12 所示。这些文本可以根据需要复制并粘贴到其他应用程序中。可能需要复制粘贴的典型示例包括：粘贴到项目文档（如规格说明书）中，或粘贴到用于计算工程量的电子表格中。只需突出显示任意文本并右键单击，然后即可从快捷菜单中选择“复制”。\n\
  \n![](img/e5541e806f2ef46a4958b6c3d0b346a9_153_0.png)\n\n图 6.12：AutoCAD 命令行中已突出显示锯片面积，可随时复制\n\
  \n如果你想要更改命令行的设置，可以使用命令行左端的扳手图标打开这些设置。\n\n### AutoCAD for Mac\n\n测量（MEASUREGEOM）命令在\
  \ Mac 版 AutoCAD 中可用，但没有默认图标或弹出菜单。只需输入 MEASUREGEOM 并按回车即可激活测量工具，然后右键单击弹出快捷菜单，该菜单将显示命令中可用的测量工具，你可以在其中找到面积工具。\n\
  \n现在，你已经知道如何使用添加和减去工具快速精确地计算面积，接下来让我们看看如何在 AutoCAD 中精确测量角度。\n\n## 使用角度工具测量精确角度\n\
  \n角度是 AutoCAD 绘图中几何图形的基本组成部分。精确测量角度至关重要，但同样重要的是，必须能够快速有效地完成测量。\n\n在本节中，你将继续使用 Sawblade2.dwg\
  \ 文件。请按两次键盘上的 *Esc* 键，确保没有选中任何命令或对象。这会取消所有命令，然后清除所有选择集。\n\n在以下练习中，你将学习如何在 AutoCAD\
  \ 绘图中测量精确角度：\n\n- 1. 放大到锯片的顶部，以便近距离查看锯片的一个锯齿。请注意，锯片上的每个锯齿都是由多个角度构成的。\n\n- 2. 就像你在本章前几节中所做的那样，从功能区的**常用**选项卡上的**实用工具**面板中选择**测量**弹出菜单。这次选择**角度**。\n\
  \n- 3. 在出现的提示下，你可以选择圆弧、圆、直线，或指定顶点。选择锯齿上的大圆弧。你将看到显示的角度（**99°**），如 *图 6.13* 所示。\n\n\
  ![](img/e5541e806f2ef46a4958b6c3d0b346a9_154_0.png)\n\n图 6.13：已测量的角度，并显示“测量”菜单\n\
  \n- 4. 在**测量**菜单上再次选择**角度**。\n\n- 5. 也可以使用两条发散的直线来测量角度。选择图 6.14 中用箭头指出的两条直线，你将看到它们之间显示的角度测量值为\
  \ 135°。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_155_0.png)\n\n图 6.14：显示的角度使用两条（箭头所指的）直线测量\n\
  \n- 6. 你还可以使用顶点来测量角度。从“测量”菜单中再次选择“角度”，然后按回车确认 <指定顶点> 提示。按照图 6.15 所示顺序选择三个点。你将看到测得的角度为\
  \ 108 度。确保第一个选择的点是要测量角度的顶点（1），然后是构成该角度的另外两个顶点（2 和 3）。\n\n图 6.15：显示的角度使用三个（编号的）顶点测量\n\
  \n- 7. 要关闭菜单和命令，请在“测量”菜单中选择“退出”。\n\n在 AutoCAD 中，测量角度对于确保精确性至关重要，而角度工具可以快速轻松地完成测量。以锯片为例，锯齿所用的角度必须精确测量，以便制造锯片。精确测量的能力可确保任何计算机辅助制造（CAM）都能以准确的角度从原材料上切割出锯齿。\n\
  \n### AutoCAD for Mac\n\n测量（MEASUREGEOM）命令在 Mac 版 AutoCAD 中可用，但没有默认图标或弹出菜单。只需输入\
  \ MEASUREGEOM 并按回车即可激活测量工具，然后右键单击弹出快捷菜单，该菜单将显示命令中可用的测量工具，你可以在其中找到角度工具。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_156_0.png)\n\
  \n\n\n\n现在，您可以在绘图中精确测量角度了。接下来，我们来看看如何使用“修改”面板优化您的图形。\n\n## 使用“修改”面板优化图形\n\n您的 AutoCAD\
  \ 图形会不断演变。随着您正在进行的项目逐渐细化并趋于施工或制造，必须进行修订和设计迭代。\n\nAutoCAD 提供了许多工具，让您能够快速、有效地修改现有图形几何体，而最重要的是，能够准确而精确地修改。其中一个特性就是“修改”面板。\n\
  \n在接下来的练习中，您将使用 Sawblade3.dwg，学习如何利用一些 AutoCAD 修改工具来更改锯片上的锯齿配置：\n\n- 1. 打开图形后，您会看到锯片上只有一个锯齿。您将使用一些修改工具来添加所需的锯齿并编辑锯齿轮廓。\n\
  \n- 2. 确保您位于功能区上的“默认”选项卡，并且显示了“修改”面板，如图 6.16 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_157_0.png)\n\
  \n图 6.16：功能区“默认”选项卡上的“修改”面板\n\n- 3. 单击“阵列”弹出菜单，显示可在 AutoCAD 中创建的各种阵列，如图 6.17 所示。\n\
  \n![](img/e5541e806f2ef46a4958b6c3d0b346a9_157_1.png)\n\n图 6.17：“阵列”弹出菜单\n\n- 4.\
  \ 选择**环形阵列**（*ARRAYPOLAR*）。系统将提示您在**选择对象**菜单中做出选择。选择构成单个锯齿的红色圆弧和线条，然后按 *Enter* 确认选择。\n\
  \n- 5. 接下来，您会遇到**指定阵列中心点**提示。使用**中心点**对象捕捉选择构成锯片的圆的中心。您现在可以执行此操作，因为您已经在*第 5 章*的*查找几何中心*小节中学习了如何设置对象捕捉。\n\
  \n- 6. 单击**中心点**对象捕捉后，您会看到功能区更新为上下文**阵列创建**选项卡，提示变为**选择夹点以编辑阵列或**。您还会看到 AutoCAD\
  \ 已自动显示*六个*锯齿（包括原始锯齿），如*图 6.18*所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_158_0.png)\n\
  \n图 6.18：默认环形阵列，包含六个锯齿\n\n- 7. 设计要求是*十八*个锯齿，因此需要更新环形阵列。这可以在上下文**阵列创建**选项卡上的**项目**面板中完成。\n\
  \n- 8. 在“项目”字段中将项目数更改为 18，如图 6.19 所示。然后按 Enter。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_159_0.png)\n\
  \n图 6.19：上下文“阵列创建”选项卡上“项目”面板中的“项目”字段\n\n- 9. 您将看到图形中的锯齿数更新为 18，如图 6.20 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_159_1.png)\n\
  \n图 6.20：具有 18 个锯齿的锯片\n\n- 10. 要关闭环形阵列命令，请按 Enter 确认“退出”提示，或单击功能区上的“关闭阵列”图标（绿色对勾）。\n\
  \n- 11. 现在，您在一个关联环形阵列中拥有 18 个锯齿。单击其中一个锯齿会选择该阵列并将其突出显示，如图 6.21 所示。另外，请注意功能区上显示了上下文“阵列”选项卡。\n\
  \n![](img/e5541e806f2ef46a4958b6c3d0b346a9_160_0.png)\n\n图 6.21：选中后突出显示的关联环形阵列\n\
  \n锯片上的锯齿设计需要修改，以便更容易制造。为此，一些 AutoCAD 用户可能会使用分解（EXPLODE）命令将关联阵列分解回其组成对象，然后重新阵列锯齿。这是一种冗长且容易出错的方法。以下工作流程不仅更快，还有助于避免任何传递的错误：\n\
  \n- 1. 在功能区上下文“阵列”选项卡的“选项”面板上找到“编辑源”图标，如图 6.22 所示。单击“编辑源”图标。您将返回到功能区上的“默认”选项卡。\n\
  \n![](img/e5541e806f2ef46a4958b6c3d0b346a9_160_1.png)\n\n图 6.22：“选项”面板上的“编辑源”图标\n\
  \n- 6. 当您编辑原始锯齿时，您会看到阵列中的其他锯齿随之更新。编辑完成后，单击功能区**默认**选项卡右端**编辑阵列**面板中的**保存更改**图标。**保存更改**图标如*图\
  \ 6.25*所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_162_0.png)\n\n图 6.25：“编辑阵列”面板上的“保存更改”图标\n\
  \n保存对阵列的更改后，您将看到所有 18 个锯齿都已设置为新的锯齿配置。\n\n选择该阵列，您将看到它仍然保留在原位，完全关联，无需重新阵列即可进行必要的更改。*图\
  \ 6.26* 显示了选中并突出显示的修订后阵列。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_162_1.png)\n\
  \n图 6.26：重新配置的环形阵列，显示为选中并突出显示\n\n最后，按键盘上的 Esc 取消选择该阵列。这样可以避免在您启动另一个命令时，阵列对象成为选择集的一部分。\n\
  \n**修改**面板包含许多有价值的工具，可以让您快速、准确地修订和更新图形。图形在许多学科和环境中使用，**修改**工具可以适应并用于任何工作流程。\n\n\
  ### 小结\n\n在本章中，您学习了如何使用**名词/动词选择**来确保快速选择要在图形中修改的对象。您还学习了如何使用**快速测量**和**距离**快速高效地测量几何图形的长度。\n\
  \n学习了如何使用**测量**（*MEASUREGEOM*）命令中的**面积**工具以及**添加**和**减去**功能后，现在计算几何图形的精确面积变得快速而简单。您还学习了如何使用**测量**（*MEASUREGEOM*）命令中的**角度**工具，利用圆、圆弧、直线和顶点，来准确、快速、有效地测量角度。\n\
  \n通过使用**环形阵列**（*ARRAYPOLAR*）命令，您学习了如何使用**编辑源**功能修改现有的锯片设计，以更新现有的锯齿配置。\n\nAutoCAD\
  \ 在功能区上的**修改**面板中还提供了一套全面的编辑工具。在本章中，您只是通过**环形阵列**工具触及了这些工具的皮毛，但是通过更多的自我练习，您会发现 AutoCAD\
  \ 中的大多数编辑需求都可以通过**修改**面板来满足。\n\n本章展示了上述工具在 AutoCAD 中修改和编辑图形时的重要性。它们是保证设计中任何几何体编辑的准确性和精确性的基础。在下一章中，我们将研究如何使用注释性注释在您的\
  \ AutoCAD 图形中有效地传达设计意图。\n\n## 开发注释性注释样式\n\nAutoCAD 用于绘制和创建您的设计。随之而来的是传达设计意图的需求。例如，建筑者需要知道要建造的建筑物有多大。工厂需要知道需要制造的物品有多大。这时，AutoCAD\
  \ 高度通用且全面的注释工具就派上了用场。\n\n这些注释工具不仅允许您向图形添加注释文字和尺寸，还可以设置为注释性，并与注释比例配合使用，以便在布局选项卡中使用缩放视口时，以适当的比例显示注释。\n\
  \n有效的注释可以使用户准确传达其设计意图。在 AutoCAD 中，大量时间用于注释设计，因此必须正确设置注释样式。\n\n本章涵盖您在 DWG 文件中使用注释性注释所需学习的以下方法：\n\
  \n- 创建文字样式以管理文字大小和字体\n- 使用标注样式管理尺寸注释\n- 设置特定的引线样式\n- 使用准确的表格样式\n\n在前面的章节中，您了解了如何使用\
  \ AutoCAD 的绘图工具开发高级几何图形。在本章中，您将创建注释样式，以帮助您准确、有效地传达设计意图。\n\n\n\n\n## 练习文件\n\n你必须确保已下载\
  \ New Office Proposal.dwg 练习文件以跟随本章各节内容。\n\n## 创建文本样式以管理文本大小和字体\n\n文本在 AutoCAD 绘图中是基础。你需要文本来为设计中的对象和区域添加标签进行描述和标注，以及提供数值信息，例如对象的实例数量（例如门的数量），并使用尺寸文本为重要尺寸添加数值。本节将介绍如何使用文本样式来管理文本大小和字体，并在绘图中应用注释性文本缩放。\n\
  \nAutoCAD DWG 文件中可以拥有任意数量的文本样式，但更重要的是这些文本样式的命名理念。命名为 Shaun1、Shaun2 等的文本样式毫无用处。文本样式需要一种对使用该\
  \ AutoCAD DWG 文件的每个人都有意义的命名理念。即使你独自工作，也应养成一种可根据其属性识别样式的命名习惯。建立这种系统将有助于你在今后的 AutoCAD\
  \ 项目中。\n\n注释性文本样式允许你在布局选项卡中指定文本注释的图纸空间高度，而不论其在视口中显示的比例如何。例如，如果你在比例为 1:100 的视口中使用\
  \ 2.5 mm 的注释性图纸空间高度，则模型选项卡中实际文本的高度将为 250 mm。只要在模型选项卡中放置注释性文本时使用 1:100 的注释比例，注释性文本将在布局选项卡视口中正确显示。\n\
  \n使用随本章附带的文件，你现在将学习如何定义文本样式。打开练习文件 New Office Proposal.dwg。打开时它将处于模型选项卡，显示一个没有标注的简单办公室平面图。你的第一步是定义绘图中所需的文本样式。如果愿意，完成本节练习后可以再开发更多文本样式。现在，让我们进入文件：\n\
  \n1. 要创建新的文本样式，需要访问文本样式对话框。你可以通过两种方式实现。第一种是从主选项卡/标注面板，如图 7.1 所示。\n\n图 7.1：展开主选项卡上的标注面板，然后单击文本样式图标\n\
  \n你也可以使用注释选项卡/文本面板，如图 7.2 所示。每种方法略有不同，但最终会进入同一个对话框。\n\n图 7.2：在注释选项卡功能区的文本面板标题栏上单击箭头图标\n\
  \n![](img/e5541e806f2ef46a4958b6c3d0b346a9_167_0.png)\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_167_1.png)\n\
  \n![](img/e5541e806f2ef46a4958b6c3d0b346a9_167_2.png)\n\n2. 文本样式对话框现已打开并可使用，如 *图\
  \ 7.3* 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_168_0.png)\n\n图 7.3：文本样式对话框\n\
  \n3. 请注意，此绘图文件中已存在一些默认文本样式。另请注意，有两种注释性文本样式，如列表顶部左侧每个文本样式名称旁边的蓝色注释性符号所示。\n\n4. 要创建新的文本样式，单击\
  \ **New...**。系统会提示你输入新的文本样式名称，如 *图 7.4* 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_168_1.png)\n\
  \n图 7.4：创建新的文本样式\n\n5. 输入名称 Dims_MODEL 并单击 OK。你将返回文本样式对话框，Dims_MODEL 文本样式显示在列表中。单击列表中的样式名称以准备进行属性编辑。它将被高亮显示为蓝色，如图\
  \ 7.5 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_169_0.png)\n\n图 7.5：文本样式对话框中\
  \ Dims_MODEL 文本样式被高亮显示\n\n6. 使用对话框中的设置，你现在可以按如下方式更改 Dims_MODEL 文本样式的属性：\n\n    -\
  \ Font Name: **Calibri**\n    - Font Style: **Regular**\n    - Height: **0**\n\n\
  7. 确保 Annotative 框未选中（此文本样式将用于注释性尺寸，后续章节中尺寸样式中将已设置为注释性）。\n\n8. 此文本样式中不会使用效果，因此保持原样即可。你也可以根据需要创建另一个文本样式，以尝试可用的效果。这些效果可用于操纵文本样式，使其在使用时以不同方式显示，例如使文本倒置或上下颠倒显示。\n\
  \n9. 设置好这些属性后，单击 Apply。你将仍停留在对话框中。\n\n10. 再次单击 New...。将新文本样式命名为 Title_LAYOUT_10mm\
  \ 并单击 OK。\n\n11. 在对话框中选择新的文本样式，并设置以下属性：\n\n    - Font Name: Calibri\n    - Font\
  \ Style: Bold Italic\n    - Height: 10mm\n\n同样，无需效果选项。\n\n此文本样式仅在布局选项卡的标题栏中使用，因此命名理念和样式高度如此。它不会在模型选项卡中使用。\n\
  \n12. 单击 Apply。\n\n13. 使用上述工作流程，再创建一个名为 Labels_MODEL_5mm 的文本样式。设置以下属性：\n\n    -\
  \ Font Name: Calibri\n    - Font Style: Regular\n    - Annotative: Yes（选中该框）\n \
  \   - Paper Text Height: 5mm\n    - Effects: None\n\n14. 你的文本样式对话框现在应如图所示 7.6。\n\
  \n> **AutoCAD for Mac**\n>\n> 在 AutoCAD for Mac 中创建任何类型的注释样式时，你会在左侧工具栏的相应面板中找到每种注释样式的图标。例如，**Text\
  \ Style** 图标位于 **Text** 面板中。这也适用于尺寸样式、标注样式和表格样式。\n\n## 使用尺寸样式管理尺寸标注\n\n在上一节中，你学习了创建和实现文本样式是向绘图添加标注的基础。创建和实现合适的尺寸样式也是必不可少的。你需要文本样式来为尺寸添加尺寸文本，而这一切都是尺寸样式的一部分。本节将介绍如何使用尺寸样式在不同比例的多个布局视口中管理和维护尺寸标注。\n\
  \n你应已从上一节打开了 `New Office Proposal.dwg` 练习文件。你现在将通过以下步骤向绘图中添加一个注释性尺寸样式：\n\n1. 与文本样式一样，打开\
  \ **Dimension Style Manager** 有多种方法。你可以使用功能区 **Home** 选项卡上的 **Annotation** 面板的下拉菜单，或使用功能区\
  \ **Annotate** 选项卡上 **Dimensions** 面板标题栏上的箭头。每种方法都会打开 **Dimension Style Manager**\
  \ 对话框。*图 7.7* 显示了下拉菜单。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_172_0.png)\n\n\
  图 7.7：展开主选项卡上的标注面板，然后单击尺寸样式图标\n\n图 7.8 显示了标题栏上的箭头。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_173_0.png)\n\
  \n图 7.8：在注释选项卡功能区的尺寸面板标题栏上单击箭头图标\n\n2. 使用任一方法，你将看到 Dimension Style Manager 对话框出现，如图\
  \ 7.9 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_173_1.png)\n\n图 7.9 – Dimension\
  \ Style Manager 对话框\n\n正如其名称所示，Dimension Style Manager 管理 DWG 文件中的所有尺寸样式。你会注意到两个默认尺寸样式：Annotative\
  \ 和 Standard。在图 7.9 中，Annotative 样式旁边有一个蓝色符号，表示它确实是一个注释性尺寸样式。\n\n3. 你现在将为绘图文件创建一个注释性尺寸样式。单击\
  \ **New...**，你将看到 **Create New Dimension Style** 对话框中出现新尺寸样式名称的提示，如 *图 7.10* 所示。\n\
  \n![](img/e5541e806f2ef46a4958b6c3d0b346a9_174_0.png)\n\n图 7.10：创建新尺寸样式对话框\n\n4.\
  \ 创建一个名为 Training-ANNO 的新样式，并将 **Start With** 设置为下拉菜单中的 **Annotative** 样式。\n\n5.\
  \ 确保 **Annotative** 框已选中，如 *图 7.10* 所示。这将确保你正在创建注释性尺寸样式。\n\n6. 在 **Use for** 下拉菜单中，选择\
  \ **All dimensions**。\n\n7. 单击 **Continue**。\n\n8. 你现在将看到特定于你创建的新尺寸样式的 **New Dimension\
  \ Style** 对话框，其名称显示在对话框标题栏中，如 *图 7.11* 所示。\n\n9. 你可以看到对话框顶部有选项卡，你将从左到右在这些选项卡之间工作以自定义尺寸样式。确保\
  \ **Lines** 选项卡当前处于活动状态，并且对话框中该选项卡中的所有设置与 *图 7.11* 中的设置相同。\n\n\n\n\n\n图 7.11：新建标注样式：Training-ANNO\
  \ 对话框的“直线”选项卡\n\n- 10. 设置好**直线**选项卡中的所有设置后，选择**符号和箭头**选项卡。\n- 11. 确保将**符号和箭头**选项卡中的所有设置设为与图\
  \ 7.12 所示相同。\n\n图 7.12：“符号和箭头”选项卡\n\n- 12. 接下来，选择“文字”选项卡。使用“文字样式”下拉菜单，现在可以选择之前创建的\
  \ Dims_MODEL 文字样式。请注意，此文字样式本身不是注释性文字样式，因为它被用于一个注释性标注样式中。确保图 7.13 所示的其他所有设置也已设置妥当。标注样式中的文字设置有很多，值得在其他时间进行研究，了解在图形中通过标注注释可以显示哪些内容。\n\
  \n![](img/e5541e806f2ef46a4958b6c3d0b346a9_177_0.png)\n\n图 7.13：“文字”选项卡\n\n- 13.\
  \ 现在，沿着对话框顶部的选项卡继续操作，选择“调整”选项卡。\n- 14. 创建的标注样式具有注释性，因此**注释性**复选框应已处于选中状态。不过，如果没有选中，请确保将其勾选。无需对**调整**选项卡进行其他更改，因为将使用默认设置，因此请确保**调整**选项卡与*图\
  \ 7.14*所示相同。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_178_0.png)\n\n图 7.14：选中“注释性”复选框的“调整”选项卡\n\
  \n- 15. 单击“调整”选项卡右侧的**主单位**选项卡。在这里，可以覆盖“单位”设置（使用 *UNITS* 命令设置）中的任何设置，以用于标注显示。例如，在\
  \ AutoCAD 中绘图时，为了保证精度，可能会将单位设置为*四位小数*；但在放置标注以传达设计意图时，只需要*一位小数*的精度，因此可以将**精度**设置为\
  \ `1.0`，从而覆盖最初使用“单位”（*UNITS*）命令设置的 `1.0000`。\n\n- 16. 确保按照图 7.15 所示设置好所有主单位设置。\n\
  - 17. 确保将“小数分隔符”设置为“句点（.）”。也可以使用逗号（,）或空格（ ），但请注意，放置标注时会显示此设置，并且它可能是所使用 CAD 标准定义的显示设置之一。\n\
  \n图 7.15：将“小数分隔符”设为“句点”的“主单位”选项卡\n\n在本章中，我们不会设置**替代单位**选项卡中的任何选项。如果愿意，可以在其他时间进行研究。放置标注时，替代单位允许显示另一组不同的单位。例如，可能使用**公制**单位作为**主要**标注单位，同时希望将**英制**单位显示为**替代**单位。若要在标注中同时显示两种单位，需要将替代单位设置为所需显示的英制单位设置。图\
  \ 7.16 展示了本章所需的**替代单位**选项卡设置。请注意，**显示替代单位**复选框处于*未选中*状态。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_180_0.png)\n\
  \n图 7.16：“显示替代单位”未选中的“替代单位”选项卡\n\n- 18. 此标注样式不需要任何**公差**。公差通常用于机械加工和制造过程中，以显示材料在加工制造时的尺寸偏差。这些公差适用于零件的某个要素，例如点、直线、轴或曲面。公差常用于机械制图和生产图纸，因为其中的绘制对象需要经过切割、刨削或铣削。这些生产工艺需要设置公差，因为所使用的工具和机械设备通常会切削金属等材料。这些工艺永远无法做到绝对精确，因此需要适当的公差。在本练习文件中，不需要任何公差值。\n\
  - 19. 单击**公差**选项卡。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_181_0.png)\n\n- 20.\
  \ 确保将“公差格式”下的“方法”选项设置为“无”，如图 7.17 所示。同时，确保“公差”选项卡中的所有其他设置均按照图 7.17 进行设置。这样即可确保标注样式中不使用公差。\n\
  - 21. 单击“确定”。现在，标注样式已设置完成，并显示在“标注样式管理器”中，如图 7.18 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_182_0.png)\n\
  \n图 7.18：当前标注样式为 Training-ANNO 的“标注样式管理器”\n\n- 22. 在左侧窗格中选择新的 Training-ANNO 注释性标注样式，使其高亮显示为蓝色，如图\
  \ 7.18 所示。\n- 23. 单击“置为当前”，然后单击“关闭”。\n- 24. 现在，新的注释性标注样式（Training-ANNO）已成为 New Office\
  \ Proposal.dwg 文件中的当前标注样式。\n- 25. 确保保存图形，以便将标注样式保存到 DWG 文件中。\n\n### 技巧与窍门 #23\n\n\
  使用标注样式时，通常需要从图形文件中删除未使用的标注样式，以维持文件大小并便于日常管理 DWG 文件。为此，可以在**标注样式管理器**中右键单击未使用的标注样式，并在快捷菜单中使用“**删除**”（参见*图\
  \ 7.19*）。也可以使用“清理”（*PURGE*）命令删除未使用的标注样式。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_183_0.png)\n\
  \n图 7.19：在“标注样式管理器”中使用快捷菜单删除标注样式\n\n### AutoCAD for Mac\n\n在 AutoCAD for Mac 中创建标注样式时，可以在左侧工具栏的**标注**面板中找到**标注样式**图标。在\
  \ Mac 中使用标注样式时，对话框相似，但采用常见的 Mac 界面，如*图 7.20*所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_184_0.png)\n\
  \n图 7.20：在 AutoCAD for Mac 中创建标注样式\n\n标注是图形的基础要素。它传达了设计意图。现在，你已经了解如何设置注释性标注样式，以便在图形中添加标注。这适用于所有图形，无论图形规模大小。为了传达其中包含的设计信息，所有图形都需要添加标注。\n\
  \n在本节中，你学习了如何创建和应用新的注释性标注样式。在此基础上，接下来将在下一节中设置**多重引线**（*MLEADER*）和**快速引线**（*QLEADER*）的样式。\n\
  \n## 设置特定的引线样式\n\n在当前位于 New Office Proposal.dwg 文件中的 **Training-ANNO** 标注样式里，你已在**符号和箭头**选项卡中将**引线**设置为**点**，如*图\
  \ 7.21*所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_185_0.png)\n\n此标注样式设置将应用于使用旧版**快速引线（QLEADER）**命令创建的任何引线。你可以在此处的\
  \ AutoCAD 帮助文件中了解这种引线标注方法：\n\n```\nhttps://help.autodesk.com/view/ACDLT/2019/ENU/?guid=GUID-5FEC133A-5EBD-4EFA-9E44-771E85480DAD\n\
  ```\n\n正如 AutoCAD 帮助页面所述，在大多数情况下，建议使用**多重引线**（*MLEADER*）命令创建引线对象。原因有以下几点：\n\n- *QLEADER*\
  \ 命令没有图标，因为它是旧版遗留命令。必须始终输入该命令。\n- 使用 *QLEADER* 创建的引线不如使用 *MLEADER* 创建的引线容易在图形中进行操控。\n\
  - 可以快速、轻松地设置多重引线样式，并使用与标注样式类似的工作流程将其设为注释性样式。由于多重引线具有注释性，其工作方式也与图形中的标注类似。\n- AutoCAD\
  \ 的未来版本将继续开发**多重引线**（*MLEADER*）命令，因为它现在是向图形中添加引线的首选方法。\n\n现在，让我们回到练习文件 `New Office\
  \ Proposal.dwg`，该文件应该仍处于打开状态。你将使用此图形创建一种新的注释性多重引线样式，具体步骤如下：\n\n- 1. 要创建新的多重引线样式，需要访问**多重引线样式**对话框。可以通过两种方式执行此操作。第一种方式是在**开始**选项卡的**注释**面板中进行，如*图\
  \ 7.22*所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_186_0.png)\n\n图 7.22：展开“开始”选项卡中的“注释”面板，然后单击“多重引线样式”图标\n\
  \n\n\n\n\n你也可以使用 **Annotate** 选项卡/**Leaders** 面板，如 *Figure 7.23* 所示。每种方法略有不同，但最终都会进入同一个对话框。\n\
  \n![](img/e5541e806f2ef46a4958b6c3d0b346a9_187_0.png)\n\nFigure 7.23: Clicking on\
  \ the arrow icon on the Leaders panel title bar in the Annotate tab on the ribbon\n\
  \n- 2. 使用任一方法，**Multileader Style Manager** 对话框将会出现，其中有两个默认的多行引线样式：**Annotative**\
  \ 和 **Standard**，如 *Figure 7.24* 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_187_1.png)\n\
  \nFigure 7.24: Multileader Style Manager\n\n创建注释性多行引线样式的工作流程与创建注释性标注样式的工作流程 remarkably\
  \ 相似。对话框中只有几个选项卡需要考虑。\n\n- 3. 在 **Multileader Style Manager** 中点击 **New...**。\n\n\
  4. 在出现的 Create New Multileader Style 对话框中，设置一个名为 Training-ANNO 的新多行引线样式（与标注样式类似），将\
  \ Start with 下拉菜单设置为 Annotative，并确保勾选 Annotative 复选框，如 Figure 7.25 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_188_0.png)\n\
  \nFigure 7.25: The Create New Multileader Style dialog box\n\n5. 点击 Continue。\n\n\
  6. 你现在会看到一个非常熟悉的对话框。它看起来与你用于注释性标注样式的对话框相同，但现在你正在开发一个注释性多行引线样式。确保 **Leader Format**\
  \ 选项卡处于当前状态并将其设置为 Figure 7.26 所示的设置。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_188_1.png)\n\
  \nFigure 7.26: The Modify Multileader Style dialog box set to the Leader Format\
  \ tab\n\n7. 配置好 **Leader Format** 设置后，点击 **Leader Structure** 选项卡使其成为当前选项卡。\n\n\
  8. 此选项卡中无需更改任何设置。只需确保其与 *Figure 7.27* 所示相同，并且 **Annotative** 复选框已勾选，使其成为注释性多行引线样式。\n\
  \n![](img/e5541e806f2ef46a4958b6c3d0b346a9_189_0.png)\n\nFigure 7.27: The Leader\
  \ Structure tab as current, ensuring that the Annotative checkbox is checked (arrowed)\n\
  \n9. 现在，点击 **Content** 选项卡使其成为当前选项卡。\n\n10. 你将创建一个具有 **Mtext** 内容的多行引线。多行引线使用多行\
  \ (*MTEXT*) 内容，以便你可以使用上下文 **Text Editor** 功能区选项卡。\n\n引线样式在你的绘图中非常有用。引线允许你突出绘图中需要进一步描述的特定感兴趣区域，并允许你将任何描述性文本或符号与构成设计的对象分开，提供清晰度，使绘图易于阅读和理解。\n\
  \n在本节中，你学习了如何创建和实现多行引线样式。标注样式和多行引线样式都允许你对设计进行注释，传达设计意图。在下一节中，你将深入了解 AutoCAD 的另一个重要功能。\n\
  \n## Working with accurate table styles\n\nAutoCAD 还允许你以表格形式汇总绘图中的数据。这些表格可以使用与标注样式和多行引线样式相同的方式使用表格样式定义，并提供表格化注释以实现有效的设计数据通信。\n\
  \n你应该仍有练习文件 `New Office Proposal.dwg` 打开。使用此文件，你将为房间面积创建一个新的、简单的表格样式。步骤如下：\n\n-\
  \ 1. 要创建新的表格样式，你需要访问 **Table Style** 对话框。你可以通过两种方式实现。第一种是从 **Home** 选项卡/**Annotation**\
  \ 面板，如 *Figure 7.30* 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_192_0.png)\n\
  \nFigure 7.30: Expanding the Annotation panel on the Home tab and then clicking\
  \ on the Table Style icon\n\n你也可以使用 Annotate 选项卡/Tables 面板，如 Figure 7.31 所示。每种方法略有不同，但最终都会进入同一个对话框。\n\
  \n![](img/e5541e806f2ef46a4958b6c3d0b346a9_193_0.png)\n\nFigure 7.31: Clicking on\
  \ the arrow icon on the Tables panel title bar in the Annotate tab on the ribbon\n\
  \n- 2. 在创建标注和/或多行引线样式时，你可以将各种样式属性设置为 ByLayer。创建一个名为 Tables 的新图层并将其颜色设置为 Gray（颜色\
  \ 8）。将其设为当前图层，当你将任何表格样式属性设置为 ByLayer 时，它们将在任何预览中显示在 Tables 图层上。\n\n- 3. 使用任一方法访问表格样式，你将看到\
  \ Table Style 对话框显示，如 Figure 7.32 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_193_1.png)\n\
  \nFigure 7.32: The Table Style dialog box\n\n- 4. 点击 New...。\n\n- 5. 在 Create New\
  \ Table Style 对话框中，添加一个新的表格样式名称 Training。设置 Start With 为 Standard（默认表格样式），如 Figure\
  \ 7.33 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_194_0.png)\n\nFigure 7.33:\
  \ The Create New table Style dialog box\n\n- 6. 点击 Continue。\n\nNew Table Style\
  \ 对话框显示，如 Figure 7.34 所示。注意你可以选择一个现有的表格样式作为起点（箭头所示）。这允许你选择绘图中的现有表格并使用其表格样式作为模板。\n\
  \n- 7. 确保 Table direction 设置为 Down。这确保标题和标题字段位于表格顶部。如果设置为 Up，它们将出现在表格底部。\n\n- 8.\
  \ 你将从头开始创建一个新的表格样式，因此确保 Cell styles（右上角）下拉菜单设置为 Title。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_194_1.png)\n\
  \nFigure 7.34: The New Table Style dialog box\n\n9. 你将为标题字段设置表格属性（参见对话框中的预览）。首先选择\
  \ General 选项卡。\n\n10. 在 Properties 中，设置以下内容：\n\n- Fill color: None\n- Alignment:\
  \ Middle Center\n- Type: Label\n- Margins: 25（水平和垂直）\n\n保持在创建行/列时合并单元格处于选中状态。\n\n\
  你会看到单元格样式预览更新。最初看起来可能有点奇怪（参见 Figure 7.35 中的箭头），但这是因为表格样式中尚未更新所有属性。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_195_0.png)\n\
  \nFigure 7.35: The Title cell style General tab\n\n11. 现在，选择 **Text** 选项卡，然后为 **Title**\
  \ 单元格样式设置以下文本属性：\n\n- Text style: Dims_MODEL\n- Text height: 100\n- Text color:\
  \ ByLayer\n- Text angle: 0（水平）\n\n你的表格样式和单元格样式预览现在应如下所示 *Figure 7.36*（箭头所示）。\n\n\
  ![](img/e5541e806f2ef46a4958b6c3d0b346a9_196_0.png)\n\nFigure 7.36: The Title cell\
  \ style Text tab\n\n12. 选择 **Borders** 选项卡。\n\n13. 将 Lineweight、Linetype 和 Color\
  \ 属性设置为 ByLayer，如 Figure 7.37 所示（箭头所示）。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_197_0.png)\n\
  \nFigure 7.37: The Title cell style Borders tab\n\n正如你所见，表格样式在表格和单元格样式预览中仍然看起来很奇怪。不要担心。接下来的步骤将纠正这个问题。\n\
  \n14. 在 Cell styles 下拉菜单中，选择 Header，如 Figure 7.38 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_197_1.png)\n\
  \nFigure 7.38: The Header cell style in the Cell styles drop-down menu\n\n- 15.\
  \ 在 **General** 选项卡中，使用与 **Title** 单元格样式相同的设置。\n- 16. 在 **Text** 选项卡中，设置 **Properties**\
  \ 如 *Figure 7.39* 所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_198_0.png)\n\n\
  Figure 7.39: The Header cell style Text properties\n\n- 17. 在 **Borders** 选项卡中，将\
  \ **Properties** 设置为与 **Title** 单元格样式相同，使用 **ByLayer**。\n- 18. 你的表格样式现在看起来更正常，因为\
  \ **Header** 单元格样式在表格和单元格样式预览中看起来合理，如 *Figure 7.40* 所示。\n\n\n\n\n\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_199_0.png)\n\
  \n图 7.40：标题单元格样式 边框 选项卡\n\n19. 现在，在 **单元格样式** 下拉菜单中选择 **数据** 单元格样式，如 *图 7.41* 所示。\n\
  \n![](img/e5541e806f2ef46a4958b6c3d0b346a9_199_1.png)\n\n图 7.41：单元格样式下拉菜单中的数据单元格样式\n\
  \n20. 为数据单元格样式使用与标题单元格样式相同的全部属性设置，但将对齐设置更改为中间居中。AutoCAD 对数据单元格的默认设置始终为顶部居中，而中间居中对齐在表格中看起来会更整洁一些！\n\
  \n21. 你的表格样式现在应该在新建表格样式对话框中左侧箭头指示的预览中看起来像图 7.42。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_200_0.png)\n\
  \n图 7.42：新建表格样式对话框中所有属性的预览中的新表格样式\n\n22. 单击确定。\n\n23. 在表格样式对话框中，你会看到新的 Training\
  \ 表格样式。 在左侧窗格中选择它（见图 7.43）并单击设为当前。 它现在是绘图中的当前表格样式。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_201_0.png)\n\
  \n图 7.43：表格样式对话框中的新表格样式\n\n24. 单击关闭以关闭表格样式对话框。\n\n25. 务必保存你的绘图，以将表格样式保存到 New Office\
  \ Proposal.dwg 练习文件中。\n\n在本节中，你学习了如何设置表格样式，以便为绘图添加表格注释做好准备。 这将使你能够以易于阅读的格式在绘图中以表格形式列出相关数据。\n\
  \n## 摘要\n\n你现在有一个带有文字样式、标注样式、引线样式和表格样式的绘图。 在本章中，我们获得了有关如何创建和实现新的注释性及非注释性文字样式的知识。\n\
  \n你还学习了如何设置注释性标注样式以便开始绘图工作，以及如何使用新的注释性多重引线样式以便在新绘图中进行标注。\n\n你还学习了如何配置新的表格样式以便对绘图信息进行制表。\n\
  \n通过本章讨论的练习，你了解到注释样式必须有效地、准确地创建和实现，以确保信息和数据得到正确解释。 例如，在建造或制造时，设计意图和信息必须精确，以确保所建造或制造的物品按正确的尺寸、材料和规格制造。\n\
  \n在下一章中，我们将研究如何利用你的注释性注释样式在 AutoCAD 绘图中进行注释缩放。\n"
- "## 使用注释性缩放\n\nAutoCAD 提供了灵活性和多功能性，可以轻松地将你的注释性样式与所选的注释比例混合搭配，在添加必要的注释时提供简便的工作流程。\
  \ 将注释性样式与注释性缩放相结合可以帮助创建全面且易于阅读和理解的绘图。\n\n有效的注释可确保你的设计得到精确、准确地理解和实施，无论是新建筑、电动车中的接线连接器，还是花园中的新景观。\n\
  \n在 AutoCAD 中花费大量时间对设计进行注释和注释样式。 因此，结合注释比例时，用户必须确保所有绘图信息都以适当的比例准确呈现。\n\n本章涵盖了在 DWG\
  \ 文件中使用注释样式与注释性缩放的以下方法：\n\n- 设置视口和不同视口比例\n- 在模型选项卡中处理注释比例\n- 添加和删除对象注释比例\n\n注释必须以适当的方式显示给项目利益相关者和团队成员，以便有效地、准确地传达设计意图。\n\
  \n在上一章中，你学习了如何创建和管理文字和标注注释的注释性样式。 在本章中，你将学习如何在绘图布局和标题块中使用缩放视口时，将这些注释性样式与注释性缩放相结合。\n\
  \n### 练习文件\n\n你必须确保已下载练习文件 `Office Plan_GROUND FLOOR.dwg`，以便跟随本章各节。\n\n### 设置视口和不同视口比例\n\
  \n**视口** 在 AutoCAD 绘图中至关重要。 你需要在布局选项卡中使用它们来显示设计的必要元素。\n\n视口可以设置为你所需的任何比例。 例如，你可能需要一个小比例的视口（例如\
  \ 1 : 100）来显示设计的整体、总体布置，然后添加大比例的视口（例如 1 : 50、1 : 10 等）来显示设计的更详细视图。 不要被 1 : 100 比例被称为小而感到困惑。\
  \ 它意味着缩放视口中的一个单位代表 **模型** 选项卡中的一百个单位。 因此，你的视口会更小，而不是更大，即使数字似乎并不反映这一点。 1 : 1000 比例会更小，如果这有意义的话！\n\
  \n本节将通过练习教你如何设置新的视口并相应地缩放它们。 开始时，打开练习文件 `Office Plan_GROUND FLOOR.dwg`。 打开时它将位于\
  \ **模型** 选项卡中，显示一个没有注释的简单办公室平面图。\n\n你的第一步是移动到绘图中的布局选项卡。 选择 **ISO A3** 布局选项卡，如 *图\
  \ 8.1* 所示：\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_204_0.png)\n\n**ISO A3**\
  \ 布局选项卡设置为 *ISO 公制 A3 纸张尺寸*。 你可以在 AutoCAD 中设置任何纸张尺寸，无论是公制还是英制。 这完全取决于你的 **相关标准**\
  \ 和页面设置。 为本章的目的，建议使用 **ISO A3** 纸张尺寸。\n\n你可以使用纸张尺寸和纸张方向定义不同的页面设置，以绘制和发布绘图中的各种细节。\
  \ 例如，你可能有一个页面设置用于平面图，一个用于立面图，一个用于细节图。\n\n以下 URL 将带你到 Autodesk 网页，解释页面设置在 AutoCAD\
  \ 中工作时如何帮助你：\n\nhttps://www.autodesk.com/learn/ondemand/tutorial/understanding-page-setups-for-printing?msockid=063e61fa977165a339ee753f9664640d\n\
  \n你会看到练习文件布局选项卡中有一个缩放视口。 如果你将十字光标/光标悬停在视口边缘上，AutoCAD 将显示视口属性，内容如下：\n\n- **颜色：**\
  \ ByLayer\n- **图层：** Viewports\n- **标准比例：** 1:40\n- **自定义比例：** 0\n- **图层属性覆盖：**\
  \ 否\n\n*图 8.2 显示了 AutoCAD 中此内容的显示方式：*\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_205_0.png)\n\
  \n图 8.2：显示的视口属性\n\n你现在将通过以下步骤学习如何创建和操作新的和现有的视口和视口比例：\n\n1. 确保你在练习文件 (`Office Plan_GROUND\
  \ FLOOR.dwg`) 中处于 **ISO A3 布局** 选项卡。\n\n2. 单击视口轮廓以选择它。 视口对象的夹点将显示，如 *图 8.3* 所示：\n\
  \n![](img/e5541e806f2ef46a4958b6c3d0b346a9_206_0.png)\n\n依次单击每个角夹点并水平和垂直移动以调整现有视口大小，直到它看起来像\
  \ *图 8.4* 中显示的视口：\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_207_0.png)\n\n图 8.4：ISO\
  \ A3 布局选项卡中的调整大小后的视口\n\n你可以使用 *Ctrl + R* 键组合在布局选项卡中的多个视口之间切换。\n\n### 技巧与窍门 #25\n\
  \n当你选择视口时，显示的不仅仅是夹点。 如果你选择所选视口中央的三角形下拉按钮，你将能够看到所有可用的视口比例。 如果你从现有视口比例中选择不同的比例，视口将被调整大小和重新缩放，如图\
  \ 8.5 所示。 这在 AutoCAD for Mac 中也适用。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_208_0.png)\n\
  \n图 8.5：显示的视口比例下拉菜单\n\n1. 你现在将学习另一种修改视口比例的方法。 选择视口后，查看状态栏，你会看到显示的视口比例。 此时它仍应为 1:40。\
  \ 如果你使用技巧和窍门 #25 更改了它，你将需要使用相同的方法将视口比例恢复到 1:40。\n\n\n\n\n\n8. 你现在在标题块中有足够的空间添加另一个缩放视口。点击上下文的\
  \ **Layout** 功能区选项卡（在 AutoCAD 功能区上显示为蓝色）。这是因为你正在绘图的 **ISO A3 layout** 选项卡中。\n\n\
  9. 在 **Layout Viewports** 面板上，选择顶部右侧下拉菜单中的 **Rectangular** 视口类型。它是默认类型，因此可能已经显示。你也可以输入\
  \ `VIEWPORT` 并按 *Enter*。视口对话框将会出现。在对话框中选择 **New Viewports** 选项卡将为你提供各种视口布局的选项，包括单个、两个垂直、水平等。**Figure\
  \ 8.10** 显示了 **Layout Viewports** 面板以及如何使用功能区选择 **Rectangular** 视口类型。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_212_0.png)\n\
  \nFigure 8.10: The contextual Layout Viewports panel with the viewport type drop-down\
  \ menu displayed\n\n10. 你现在会看到 **Specify corner of viewport** 提示。使用对象捕捉，在现有视口下方放置一个新的视口。使用现有视口的左下角（**Endpoint**\
  \ 捕捉）和标题块描述框的左下角（**Endpoint** 捕捉），如 **Figure 8.11** 所示。点击第二个点后，视口将自动放置。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_213_0.png)\n\
  \nFigure 8.11: The new viewport with selected corners arrowed\n\n11. 视口放置后会立即显示\
