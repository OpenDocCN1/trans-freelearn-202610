  \n![](img/e5541e806f2ef46a4958b6c3d0b346a9_439_0.png)\n\n图16.32：轨迹面板上的轨迹选项板图标\n\n\
  +   4. **轨迹选项板**将在AutoCAD中打开。在选项板上选择**Revision1**轨迹，如*图16.33*所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_439_1.png)\n\
  \n图16.33：显示Revision1轨迹的轨迹选项板\n\n5. 选择轨迹后，您将进入AutoCAD中的轨迹模式，并显示轨迹，如图16.34所示。\n\n\
  ![](img/e5541e806f2ef46a4958b6c3d0b346a9_440_0.png)\n\n图16.34：绘图中的轨迹以轨迹模式显示\n\n\
  6. 您现在可以看到已在AutoCAD移动应用程序和AutoCAD Web中处理的更新轨迹。请注意，文本已更新，这些更改现在反映在AutoCAD桌面应用程序中显示的轨迹中。\n\
  \n作为协作者，您可以通过编辑文本注释轻松添加到现有轨迹。双击轨迹文本以激活AutoCAD文本编辑器，如图16.35所示。您还会看到上下文相关的“文本编辑器”选项卡出现在功能区上。\n\
  \n9. 确保使用编辑后的轨迹文本将绘图保存回云端。使用QAT上的“保存”图标，如图16.37所示。\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_442_0.png)\n\
  \n图16.37：使用“保存”图标将DWG保存回云端\n\n10. 您现在已编辑轨迹文本并将绘图保存回云端。如果该绘图在AutoCAD Web或AutoCAD移动应用程序中打开，这些文本更改现在将生效。\n\
  \n## 适用于Mac的AutoCAD\n\n如前面章节所述，在AutoCAD for Mac中使用时，“AutoCAD Web & Mobile”文件夹以及`OPENFROMWEBMOBILE`和`SAVETOWEBMOBILE`命令不可用。但是，您仍然可以使用其他基于云的专有解决方案（如Microsoft\
  \ OneDrive）进行协作。OneDrive受AutoCAD Web和AutoCAD移动应用程序支持，因此，当在Mac版AutoCAD的AutoCAD桌面中工作时，您可以将文件保存到OneDrive中选择的基于云的位置，然后通过使用所选云位置的相应登录凭据，使用AutoCAD\
  \ Web或AutoCAD移动应用程序连接到该位置。\n\n在本节中，您学习了在通过AutoCAD Web和AutoCAD移动应用程序保存轨迹更改后，如何在AutoCAD桌面应用程序中查看基于云的DWG文件中的轨迹。您现在可以理解不仅将图纸保存到云端，而且在DWG文件协作方面使用AutoCAD\
  \ Web和AutoCAD移动应用程序的好处。现在让我们回顾本章所学内容！\n\n## 摘要\n\n您可以在官方AutoCAD博客上了解有关使用AutoCAD\
