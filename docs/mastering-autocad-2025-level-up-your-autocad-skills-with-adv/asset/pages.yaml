- pgno: 160
  md: '10. To close the Polar Array command, press Enter to confirm the eXit prompt,
    or click on the Close Array icon (green check mark) on the ribbon.


    11. You now have 18 saw teeth in an associative Polar Array. Clicking on one of
    the saw teeth will select the array, highlighting it, as shown in Figure 6.21.
    Also, note that the contextual Array tab on the ribbon is displayed.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_160_0.png)


    Figure 6.21: The associative Polar Array shown highlighted after selection


    The saw tooth design on the sawblade needs to be revised, for easier manufacture.
    To do so, some AutoCAD users might use the Explode (EXPLODE) command to break
    the associative array back into its component objects and then re-array the saw
    teeth. This is a long-winded approach, open to error. The following workflow is
    not only quicker, but will also help to avoid any transferred errors:


    +   1. Locate the Edit Source icon on the Options panel on the contextual Array
    tab on the ribbon, as shown in Figure 6.22. Click on the Edit Source icon. You
    will return to the Home tab on the ribbon.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_160_1.png)


    Figure 6.22: The Edit Source icon on the Options panel'
