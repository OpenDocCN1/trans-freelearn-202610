- pgno: 172
  md: "> **AutoCAD for Mac**\n> \n> When creating any type of annotation style in\
    \ AutoCAD for Mac, you will find the icons for each type of annotation style in\
    \ their appropriate panel in the left-hand toolbar. For example, the **Text Style**\
    \ icon is in the **Text** panel. This also applies to dimensions styles, leader\
    \ styles, and table styles.\n\n# Managing dimension annotation with dimension\
    \ styles\n\nIn the previous section, you learned that creating and implementing\
    \ text styles is fundamental to adding annotation to your drawings. Creating and\
    \ implementing suitable dimension styles is also an essential requirement. You\
    \ need the text styles in place to add dimension text to your dimensions, and\
    \ this is all set up as part of a dimension style. In this section, you will learn\
    \ how to use dimension styles to manage and maintain dimension annotation across\
    \ multiple layout viewports of differing scales.\n\nYou should already have the\
    \ `New Office Proposal.dwg` exercise file open from the previous section. You\
    \ will now add an annotative dimension style to the drawing by undertaking the\
    \ following steps:\n\n+   1. As with text styles, there are several ways to open\
    \ **Dimension Style Manager**. You can use the flyout on the **Annotation** panel\
    \ on the **Home** tab on the ribbon, or you can use the arrow on the title bar\
    \ of the **Dimensions** panel on the **Annotate** tab on the ribbon. Each of these\
    \ methods will open the **Dimension Style Manager** dialog box. *Figure 7.7* shows\
    \ the flyout.\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_172_0.png)\n\nFigure\
    \ 7.7: Expanding the Annotation panel on the Home tab\nand then clicking on the\
    \ Dimension Style icon"
  merge: -1
  img_proc: true
- pgno: 173
  md: 'Figure 7.8 shows the arrow on the title bar.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_173_0.png)


