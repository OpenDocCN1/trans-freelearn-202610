- pgno: 63
  md: '# # Using the AutoCAD Interface

    to Work Smarter


    AutoCAD is now over 40 years old. In that time, the AutoCAD interface has adapted
    and evolved to become more efficient and intuitive. This chapter will take you
    through several methods to enhance how AutoCAD is used, allowing you to work smarter,
    not harder.


    We will go through some of the AutoCAD interface tools that make your daily use
    of AutoCAD easier, thus enhancing your efficiency and productivity. In this chapter,
    you will learn about the following interface tools:


    +   - Working with file tabs

    +   - Working with the Model and Layout tabs

    +   - Utilizing the drafting settings on the status bar

    +   - The AutoCAD ViewCube

    +   - The AutoCAD navigation bar


    All the preceding tools provide specific methods with which to navigate the AutoCAD
    interface and also navigate your AutoCAD drawing. AutoCAD drawings can be complex,
    and the AutoCAD interface, when used effectively, can help you work smarter, not
    harder. Learning how to work smarter using the AutoCAD interface will not only
    allow you to become a more seasoned AutoCAD user but also enhance your efficiency
    and productivity on a day-to-day basis.


    In *Chapter 2*, you worked with AutoCAD’s workspaces. Please ensure your AutoCAD
    workspace is now set back to the default **Drafting & Annotation** workspace.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# # Exercise files


    Later on in the chapter, in *The AutoCAD ViewCube* section, we will be utilizing
    an exercise file called `3D Solid.dwg`. Please ensure you have it downloaded and
    ready in AutoCAD.


    # # Working with file tabs


    AutoCAD can have more than one drawing (DWG) file open during an AutoCAD session.
    Each file is displayed as a file tab just below the ribbon at the top left of
    the AutoCAD application window. This is shown in *Figure 3.1*.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_64_0.png)


    The AutoCAD **Start** tab is there by default, and three drawing files are displayed:
    **Drawing1**, **Drawing2**, and **3D Solid**. Each of these is a DWG file open
    in the current AutoCAD session. The `3D Solid.dwg` file is the exercise file for
    this chapter. If you open the file in AutoCAD, you will see the filename in the
    corresponding file tab.


    File tabs can be dragged and dropped horizontally to change the order of the file
    tabs displayed. For example, if required, you could drag the **3D Solid** file
    tab in front of the other file tabs.


    You can see three horizontal lines to the left of the file tabs area. This is
    often known as the *hamburger* icon (for obvious reasons). The hamburger icon
    gives you a drop-down menu, allowing you to work with the file tabs. This is shown
    in *Figure 3.2*.'
  merge: -1
  img_proc: true
- pgno: 65
  md: '![](img/e5541e806f2ef46a4958b6c3d0b346a9_65_0.png)


    Figure 3.2: The drop-down menu displayed after the hamburger icon is clicked on


    The current file tab is the **3D Solid** file tab, highlighted in bold on the
    file tab itself and in bold on the drop-down menu. The drop-down menu allows you
    to select any file listed to make it current, such as by clicking the corresponding
    file tab.


    *Figure 3.3 shows how if you hover over a filename in the drop-down list, you
    are also given options to go to the **Model** and **Layout** tabs for the file
    hovered over. This is a highly efficient way to navigate the files open in an
    AutoCAD session.*'
  merge: -1
  img_proc: true
- pgno: 66
  md: '![](img/e5541e806f2ef46a4958b6c3d0b346a9_66_0.png)


    Figure 3.3: When hovering over Drawing1 in the drop-down menu, the Model and Layout
    tabs are displayed


    A corresponding + symbol is next to the file tabs and on the drop-down menu. As
    you can see in Figure 3.3, in the drop-down menu, this will open a new blank drawing
    file. AutoCAD opens these blank drawing files sequentially, naming them Drawing1.dwg,
    Drawing2.dwg, and so on. Hence, the file tabs are displayed in Figure 3.2 and
    Figure 3.3.


    The drop-down menu also provides great flexibility when working with multiple
    AutoCAD files by offering quick access to the New..., Open..., Save All, and Close
    All commands.


    Tips and tricks #5


    Becoming a seasoned AutoCAD user is about more than just the knowledge contained
    in the drawing. It is often about the knowledge of AutoCAD itself. Navigating
    multiple drawings when working in AutoCAD can help you work smarter, not harder,
    and over time, saves you time. Try and build the file tabs into your daily AutoCAD
    workflows and processes to become more productive and efficient.'
  merge: -1
  img_proc: true
- pgno: 67
  md: "Both AutoCAD for Windows and AutoCAD for Mac use file tabs for currently open\
    \ drawing files. They are a superb efficiency tool, allowing for an easy transition\
    \ from one open drawing to another.\n\n> **AutoCAD for Mac**\n> \n> In AutoCAD\
    \ for Mac, there is a similar methodology for using file tabs. In *Figure 3.4*,\
    \ you can see similar file tabs, with the current drawing tab, **3D Solid**, highlighted.\
    \ The small icon with the blue corner (indicated by the arrow), is a tool that\
    \ works in a similar way to the *hover* tool on the drop-down menu in the Windows\
    \ version of AutoCAD. When clicked on, it provides an easy method to navigate\
    \ the **Model** and **Layout** tabs of the current drawing.\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_67_0.png)\n\
    \nFigure 3.4 – The file tabs in AutoCAD for Mac\n\nYou are now proficient with\
    \ the file tabs in the AutoCAD interface. This will allow you to work that little\
    \ bit smarter when you have multiple files open in an AutoCAD session, giving\
    \ you greater flexibility to move in and out of multiple drawing files. We will\
    \ now move on to using the **Model** and **Layout** tabs with your DWG files.\n\
    \n# ## Working with the Model and Layout tabs\n\nAutoCAD works across two spaces:\
    \ *model space* and *paper space*. Model space is represented by the **Model**\
    \ tab, with paper space being represented by the **Layout** tabs. You can have\
    \ multiple layout tabs, which display different scaled views of what is in model\
    \ space.\n\nThe **Model** and **Layout** tabs are in the bottom-left corner of\
    \ the AutoCAD application window (for both Windows and Mac versions). *Figure\
    \ 3.5* shows the **Model** and **Layout** tabs in the Windows version of AutoCAD."
  merge: -1
  img_proc: true
