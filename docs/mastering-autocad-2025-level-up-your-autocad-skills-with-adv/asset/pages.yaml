  merge: -1
  img_proc: true
- pgno: 153
  md: '# Tips and tricks #21


    Should you expand the AutoCAD command line, you will see all of the commands and
    data used when using the Add and Subtract functions of the Area tool, as shown
    in Figure 6.12. This text can be copied and pasted for other applications where
    required. Typical examples of where copy-pasting might be needed would be pasting
    into a project document, such as a specification, or into a spreadsheet being
    used to calculate quantities. Simply highlight any text and right-click. You can
    then select Copy from the shortcut menu.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_153_0.png)


    Figure 6.12: The AutoCAD command line with the area of the sawblade highlighted
    and ready to be copied


    Should you want to change the settings for the command line, they can be opened
    using the spanner icon on the left-hand end of the command line.


    # AutoCAD for Mac


    The Measure (MEASUREGEOM) command is available in AutoCAD for Mac, but there is
    no default icon or flyout menu. Simply type MEASUREGEOM and press Enter to activate
    the Measure tools, and right-click to bring up the shortcut menu that will display
    the measuring tools available in the command, where you will find the Area tool.'
  merge: -1
  img_proc: true
- pgno: 154
  md: 'Now that you know how to calculate areas quickly and precisely, using the add
    and subtract tools, let us now look at how angles can be measured precisely in
    AutoCAD.


    # # Measuring precise angles with the Angle tool


    Angles are a fundamental part of geometry in your AutoCAD drawings. Measuring
    them precisely is essential but it is also essential that this can be done quickly
    and effectively.


    For this section, you will continue to use the Sawblade2.dwg file. Ensure you
    do not have any commands or objects selected by pressing *Esc* on the keyboard
    twice. This cancels any commands and then clears any selection sets.


    In the following exercise, you will learn how to measure precise angles in your
    AutoCAD drawing:


    +   1. Zoom into the top of the sawblade so that you can see one of the sawblade''s
    teeth closely. Note that there are numerous angles forming each tooth on the sawblade.

    +   2. Select the **Measure** flyout on the **Utilities** panel on the **Home**
    tab on the ribbon, as you have done in the previous sections of this chapter.
    Select **Angle** this time.

    +   3. You can select an arc, circle, line, or specify vertices at the prompt
    that appears. Select the large arc on a saw tooth. You will see the angle displayed
    (**99 °**), as shown in *Figure 6.13*.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_154_0.png)


    Figure 6.13: A measured angle with the Measure menu displayed


    +   4. Select **Angle** again on the **Measure** menu.'
