- pgno: 157
  md: 'You can now measure angles with precision in your drawings. Let’s now look
    at how you can refine your drawings using the Modify panel.


    # Refining drawings using the Modify panel


    Your AutoCAD drawings are constantly evolving. Revisions and design iterations
    must be made as the project you are working on gets refined toward construction
    or manufacture.


    AutoCAD provides many tools that allow you to modify existing drawing geometry
    quickly, effectively, and, most importantly, accurately and precisely. One of
    these features is the Modify panel.


    In the exercise that follows, you will use Sawblade3.dwg and learn how to utilize
    some of the AutoCAD Modify tools to change the saw teeth configuration on the
    sawblade:


    +   1. Upon opening the drawing, you will see that the sawblade only has one tooth.
    You will use some of the Modify tools to add the required saw teeth and edit the
    sawtooth profile.


    +   2. Make sure you are on the Home tab on the ribbon and that the Modify panel
    is displayed, as shown in Figure 6.16.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_157_0.png)


    Figure 6.16: The Modify panel on the Home tab of the ribbon


    +   3. Click on the Array flyout to display the various arrays that can be created
    in AutoCAD, as shown in Figure 6.17.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_157_1.png)


    Figure 6.17: The Array flyout menu'
  merge: -1
  img_proc: true
- pgno: 158
