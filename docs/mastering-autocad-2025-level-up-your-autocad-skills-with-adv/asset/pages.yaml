- pgno: 163
  md: 'Lastly, press Esc on the keyboard to de-select the array. This avoids the array
    object being part of the selection set should you start another command.


    The **Modify** panel contains many valuable tools that will allow you to revise
    and update your drawings quickly and accurately. Drawings are used in many disciplines
    and environments, and the **Modify** tools can be adapted and used in any workflow.


    # Summary


    In this chapter, you have learned how to work with **Noun/verb selection** to
    ensure the quick selection of objects you wish to modify in your drawings. You
    have also learned how to measure geometry lengths quickly and efficiently using
    **Quick Measure** and **Distance**.


    Calculating exact areas of geometry is now quick and easy, having learned how
    to use **Measure** (*MEASUREGEOM*), using the **Area** tool, with the **Add**
    and **Subtract** functions. You have also learned how to measure angles accurately,
    quickly, and effectively using the **Angle** tool in the **Measure** (*MEASUREGEOM*)
    command, utilizing circles, arcs, lines, and vertices.


    Using the **Polar Array** (*ARRAYPOLAR*) command, you have learned how to modify
    an existing sawblade design, working with the **Edit Source** function to update
    the existing saw teeth configuration.


    AutoCAD also carries a comprehensive editing toolset on the **Modify** panel on
    the ribbon. In this chapter, you have only touched the surface of those tools
    through the **Polar Array** tool, but with more practice on your own, you will
    find that most editing requirements in AutoCAD can be met with the **Modify**
    panel.


    This chapter demonstrated how important the aforementioned tools are when modifying
    and editing drawings in AutoCAD. They are fundamental to the accuracy and precision
    of any edits to any geometry in your design. In the next chapter, we will look
    at how you can use annotative annotation to communicate your design intent effectively
    in your AutoCAD drawings.'
  merge: -1
  img_proc: true
