- pgno: 417
  md: '# # 16

    # Collaborating using Traces in AutoCAD


    In the previous chapter, you learned how to work with drawings stored in the cloud
    and collaborate utilizing AutoCAD Web and the AutoCAD mobile application. Now
    that the cloud can be used to store your AutoCAD DWG files, collaboration is key,
    and the trace functionality in AutoCAD has become an excellent way to communicate
    design changes, edits, and revisions.


    The new trace function in AutoCAD used to be available only in AutoCAD Web and
    the AutoCAD mobile application. As of AutoCAD 2023, it is also available in the
    AutoCAD desktop application and is much enhanced in the AutoCAD 2025 version.


    This availability provides full trace functionality across all three AutoCAD applications:
    desktop, web, and mobile. This chapter provides the user with an overview of the
    trace functionality in AutoCAD and how it can be used to their advantage.


    This chapter covers the following methodologies that allow you to work effectively
    with the trace functionality across all three AutoCAD applications:


    +   *   Using traces with AutoCAD desktop

    +   *   Using traces in the AutoCAD mobile application

    +   *   Using traces in AutoCAD Web

    +   *   Reviewing traces in the AutoCAD desktop app


    Using the cloud combined with the trace functionality for collaboration will save
    considerable reworking time and provide updates to DWG files in real time.


    This chapter will show you how the cloud is now a fundamental part of the AutoCAD
    DWG workflow. It provides storage for DWG files and easy collaboration using tools
    such as the trace functionality in AutoCAD.'
  merge: -1
  img_proc: true
- pgno: 418
  md: '# Exercise files


    For this section, you must use the exercise New Office Layout_TRACE.dwg file.
    Open the file in the AutoCAD desktop application and ensure the office floor plan
    is displayed in the Model tab.


    Ensure you save the New Office Layout_TRACE.dwg file to the AutoCAD Web & Mobile
    folder using the SAVETOWEBMOBILE command. Use the Save to Web & Mobile icon on
    the Quick Access Toolbar (QAT). You learned how to do this in previous chapters.
    You can then easily access the drawing file with AutoCAD Web and the AutoCAD mobile
    application later in this chapter.


    In this chapter, we will display various images from a browser-based version of
    AutoCAD (AutoCAD Web) and the AutoCAD mobile application installed on a tablet
    (an Apple iPad Pro). Please ensure you have access to AutoCAD Web using your AutoCAD
    subscription details.


    There is no essential requirement to have a mobile device with the AutoCAD mobile
    application installed for this chapter, but it will help to have one and install
    it. This will allow you to become familiar with the relevant mobile workflows.
    You can find the mobile application if you search for AutoCAD online in your relevant
    app store.


    # Using traces with AutoCAD desktop


    AutoCAD gives you access to drawing files locally and those stored in the cloud.
    While having files stored locally can be preferred, making sure your DWG files
    are stored in the cloud (the AutoCAD Web & Mobile folder) allows for quick and
    easy collaboration using the trace tools in all three AutoCAD applications: desktop,
    Web, and mobile.


    # Tips and tricks #36


    Adding a trace to a DWG file using the AutoCAD desktop application has only been
    available on the desktop since the AutoCAD 2023 version. Before that, you could
    only view traces on the AutoCAD desktop. Should you run an AutoCAD version before
    AutoCAD 2023, you must add traces using AutoCAD Web or the AutoCAD mobile application.
    The other solution here is to upgrade your AutoCAD version. Sometimes, this isn’t
    the quickest way forward, as you might have to liaise with your organization’s
    IT department to get this expedited. However, you should have access to AutoCAD
    Web and the AutoCAD mobile application through your existing AutoCAD subscription,
    so perhaps use those applications to add traces to your cloud-based DWG files
    in the meantime!


    The following steps take you through how to use traces when working in the AutoCAD
    desktop application:


    +   1. The SAVETOWEBMOBILE command is conveniently located at the top left of
    the QAT, as shown in Figure 16.1. You may be asked to install a driver file when
    you click on it for the first time. Make sure this is installed. It will install
    very quickly and won’t take long.'
  merge: -1
  img_proc: true
- pgno: 419
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 420
  md: '3. Use the New Office Layout_TRACE.dwg filename and click on Save. This will
    save the DWG file into the cloud space reserved for your AutoCAD subscription
    in the AutoCAD Web & Mobile folder. That way, any traces added to the DWG file
    are available to all the AutoCAD applications: desktop, web, and mobile.


    4. After clicking Save, the drawing won''t change. It is simply saved as a cloud-based
    version with that filename.


    5. Look at the AutoCAD title bar. You may see a long-winded path for your newly
    saved DWG file, as shown in Figure 16.3. This path is the location of your AutoCAD
    Web & Mobile cloud space, defined by your AutoCAD subscription and the Autodesk
    account you use when signing into AutoCAD. Note that your file path will differ
    from the one shown in Figure 16.3, as it is specific to your account details.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_420_0.png)


    Figure 16.3: The new file path for the DWG file saved in the cloud


    6. Your drawing is now in the cloud, ready for collaboration using the trace functionality
    in AutoCAD.


    7. To add a simple trace to the drawing, click on the Collaborate tab on the ribbon
    and select the Traces Palette icon on the Traces ribbon panel, as shown in Figure
    16.4.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_420_1.png)


    Figure 16.4: The Traces Palette icon on the Traces ribbon panel


    When the palette opens, you will see that there are no traces in the DWG file.
    This is shown in Figure 16.5. Click on the New Trace button. This will start the
    workflow that allows you to add a trace to the DWG file when using the AutoCAD
    desktop application.'
  merge: -1
  img_proc: true
- pgno: 421
  md: '![](img/e5541e806f2ef46a4958b6c3d0b346a9_421_0.png)


    Figure 16.5: Traces Palette with the New Trace button


    8. After clicking New Trace, you will go into trace mode, where the drawing displays
    any traces associated with it. You don’t have any traces, so AutoCAD will add
    a default trace to the Traces Palette, as shown in Figure 16.6. In this case,
    it is called Trace1.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_421_1.png)


