    same blocks from the same location.


    You can now create your own tool palettes, add your drawing blocks to those palettes,
    and import and export palettes within your team to reuse existing block content.
    To explore tool palettes further, use this link to access the Autodesk website:
    https://help.autodesk.com/view/ACD/2021/ENU/?guid=GUID-167A8594-92CB-4FCC-B72C-0F546383E97C.


    # Summary


    You now know how to start developing your own block libraries, working with both
    regular blocks and dynamic blocks, adding them to libraries in the Blocks palette,
    and creating your own tool palettes with your own blocks. In this chapter, you
    have learned how to insert regular and dynamic blocks into drawings and use dynamic
    block parameters to change a dynamic block’s appearance.


    You have also learned how to use the Clipboard function in AutoCAD to copy and
    paste AutoCAD blocks between drawings to start developing block libraries. In
    addition, you have learned how to add a new block library drawing to the Blocks
    palette by accessing it from the **Libraries** tab.


    You have also gained valuable knowledge on adding and managing blocks in new tool
    palettes.


    Content reuse is fundamental when working with AutoCAD drawings in large projects
    as it can save valuable time and the onerous reworking of AutoCAD objects in project
    drawings. The skills learned in this chapter will give you a good grounding and
    understanding of how to start implementing content reuse and block libraries in
    the future.


    In the next chapter, we will look at how you can add attributes to AutoCAD blocks
    when reusing design content in order to add and relay more detailed design information
    within your AutoCAD blocks in your AutoCAD drawings.'
  merge: -1
  img_proc: true
- pgno: 265
  md: '# 10


    # Working with Block Attributes


    In the previous chapter, you learned how to work with AutoCAD blocks, manage them
    in your drawings, and create block libraries for content reuse. In this chapter,
    you will learn more about the blocks and how to add attributes to a block, providing
    detailed information within a drawing.


    As you are aware, blocks are objects made up of multiple AutoCAD objects for content
    reuse, such as a chair or a desk, to avoid having to rework that particular chair
    or desk repetitively in a drawing. Attributes take that content reuse one step
    further by providing pertinent information about the block. Take a block that
    represents a chair, for example. Typical attributes of the chair block might be
    the manufacturer, the model type, and the serial number. You can even apply attributes
    for ownership, such as the department that owns the chair in the office and which
    employee uses that chair. The applications of attributes are endless, and you
    can easily extract and edit those attributes at any time.


    Over time, drawings become occupied with more and more blocks. Attributes allow
    you to identify your blocks and provide valuable information to anyone using your
    drawings.


    This chapter covers the following methodologies you will need to work with attributes
    in your AutoCAD blocks:


    +   - Defining attributes within a block

    +   - Editing attributes in a block using Enhanced Attribute Editor

    +   - Using Block Attribute Manager (BATTMAN)


    As in the previous chapter, reusing drawing content and managing that content
    will save valuable drafting time, reducing the need for repetitive tasks and allowing
    content sharing with your project stakeholders and team members.


    In this chapter, you will learn how attributes in blocks give you the ability
    to give your blocks the relevant information needed for effective interpretation
    of your drawings.'
  merge: -1
  img_proc: true
- pgno: 266
  md: '# # Exercise file


    You have already downloaded the previous chapter''s exercise file, New Office
    Design.dwg. You will also use this exercise file for this chapter.


    # # Defining attributes within a block


    Blocks (regular and dynamic) can have attributes applied to them. This section
    will teach you how to apply attributes to a regular AutoCAD block. The same workflow
    will apply to a dynamic block.


    There are already existing blocks in the exercise file, New Office Design.dwg.
    You will need to be in the Model tab when it opens, displaying the simple office
    floor plan.


    Your first step will be to return the block to its original AutoCAD objects. You
    do this to enable the attributes to be added to the content of the block, and
    then save the block again.


    To do this, you will need to zoom into the desk near the door opening and select
    the block that represents a computer, as shown in *Figure 10.1*.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_266_0.png)


    Figure 10.1: The PC block on the desk near the door opening (with the block selected)


    You will see that the selected PC block is one object with one grip displayed.
    That grip is the block insertion point, and you can (if needed) use grip editing
    tools with the block by selecting the grip and right-clicking to bring up the
    shortcut menu. You don''t need to do this right now, as you will be editing the
    block to add attributes to the block.'
  merge: -1
  img_proc: true
- pgno: 267
  md: 'You will need to create a new block for the PC that includes attributes, and
    the quickest way to do this is to use the Explode (EXPLODE) command to explode
    the block back to its original AutoCAD objects. With the block still selected,
    click on the Explode icon on the Modify panel on the Home tab on the ribbon, as
    shown in Figure 10.2.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_267_0.png)


    Figure 10.2: The Explode icon on the Modify panel


    The exploded block had what is known as a nested block within it. You can make
    blocks of blocks, and these are known as nested blocks. The original PC block
    was made up of four lines and another block that represented the computer screen.
    The block will now be returned to its original AutoCAD objects, and you now need
    to start the workflow to create a new PC block that has attributes included:


    +   1. Select the screen block and explode that as well. If you hover over any
    element of the screen now, it is an AutoCAD object, such as a line or an arc.

    +   2. These objects are shown selected in Figure 10.3. Make sure you have all
    four lines, and the screen block selected as shown (the blue grips will be displayed).


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_267_1.png)


    Figure 10.3: The AutoCAD objects selected after exploding the blocks'
  merge: -1
  img_proc: true
- pgno: 268
  md: 'When creating a new block, a good practice to get into is to ensure that all
    objects that make up the new block start on layer 0 (zero). Then, once the block
    has been created, it will adopt the current layer each time an instance of the
    block is inserted in the drawing.


    +   3. With all the now-exploded objects selected, go to the layer drop-down menu
    on the Layers panel and select layer 0 (zero). It is always at the top of the
    layer list as it is the AutoCAD default layer, as shown in Figure 10.4.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_268_0.png)


    Figure 10.4: The layer drop-down menu with layer 0 (zero) indicated


    +   4. When going to the layer drop-down menu with the exploded objects selected,
    you will note that they are all on the PCS layer. This is why the objects need
    to go to layer 0 (zero), as you may need to put them onto an alternative layer.
    Click on layer 0 on the dropdown, and you will see all the objects go onto that
    layer.


    Press the Esc key several times to ensure the objects are deselected. Then, make
    sure that layer 0 is the current layer.


