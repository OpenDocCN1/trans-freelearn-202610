  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 41
  md: 'If you go back to the QAT Customize dropdown, you can click on **Show Above
    the Ribbon** and the QAT will return to its default location above the ribbon.


    While changing the position of the QAT or adding functionality to it may seem
    like a small, insignificant change to the AutoCAD interface, it''s amazing how
    many users use those tools to tweak and adjust their AutoCAD interface to suit
    their daily use. As they say, it''s the small things. And when combined with saving
    these settings to your own customized AutoCAD workspace, it all starts to make
    sense. When we look into workspaces in more detail later in the book, you will
    start to see their advantages and how they can allow you to have a fully customized
    AutoCAD workspace just for you.


    > **AutoCAD for Mac**

    > AutoCAD for Mac does not have a QAT. It has a simplified toolbar across the
    top of the AutoCAD for Mac application window, as shown in Figure 1.29. This can
    be customized by right-clicking on the toolbar and selecting **Customize Toolbar**.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_41_0.png)


    # Introducing the CUI command


    Up until now, we have used the AutoCAD interface to customize the AutoCAD interface.
    There is also an AutoCAD command that allows you to adjust the AutoCAD interface.
    That command is the **Customize User Interface (CUI)** command.


    The quickest way to start using the CUI command is to type CUI and press Enter.
    You can type this directly, and it will appear near the cursor (crosshair), or
    you can type it on the command line at the bottom of the AutoCAD screen.


    This will bring up the **Customize User Interface** dialog box. Figure 1.30 shows
    the **Customize User Interface** dialog box with the three default AutoCAD workspaces:
    **Drafting & Annotation Default**, **3D Modeling**, and **3D Basics**. These are
    found in the **Customize** tab in the dialog box.'
  merge: -1
  img_proc: true
- pgno: 42
  md: "# Customizing the AutoCAD Interface\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_42_0.png)\n\
    \nFigure 1.30: The Customize User Interface dialog box with the default AutoCAD\
    \ workspaces indicated in the Customize tab\n\nIf you make the dialog box bigger\
    \ by dragging a corner or side of the dialog box, you can start to investigate\
    \ how to customize your AutoCAD user interface.\n\n> **Tips and tricks #3**\n\
    > \n> Before committing to any changes in the **Customize User Interface dialog\
    \ box**, it is always beneficial to duplicate the workspace you want to work with.\
    \ This is to avoid any errors you might make that would affect one of your default\
    \ workspaces beyond the point of no return! Simply right-click over the specific\
    \ workspace in the dialog box and select **Duplicate** from the shortcut menu.\
    \ It will save you from a whole world of pain later when you realize that you\
    \ have changed a default workspace beyond all recognition!"
  merge: -1
