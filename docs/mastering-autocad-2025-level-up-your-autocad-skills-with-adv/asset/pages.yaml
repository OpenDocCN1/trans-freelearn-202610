- pgno: 223
  md: '# Tips and tricks #27


    When placing Linear dimensions, you can line them up accurately using Object Snaps
    (OSNAP). Simply use the Endpoint object snap of the point of the arrowhead you
    want to line up with when placing the dimension line – the third click when placing
    a Linear dimension – and you will find that the arrowheads then line up regularly,
    keeping the dimension lines all in line. This works for both horizontal and vertical
    dimension placement.


    Object Snaps are the most effective method to use to dimensions accurately and
    precisely. Make sure that the OSNAP setting is always ON when placing dimension
    annotation.


    # AutoCAD for Mac


    Linear dimension placement works in the same way for AutoCAD for Mac. The only
    difference is that the dimension tools are in the vertical left-hand menu.


    Notice that both the text annotation and the dimension annotation are displayed
    on the Model tab, using their appropriate annotation scales. Click on the ISO
    A3 layout tab to see the drawing displayed in Figure 8.27:


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_223_0.png)


    Figure 8.27: The ISO A3 tab with the drawing displayed'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'In *Figure 8.27*, the text annotation is highlighted, as it only appears in
    the **1:30** (lower) viewport and not the **1:50** (upper) viewport. This is because
    the text annotation only has a **1:30** annotation scale applied to it in the
    **Model** tab. In the same way, the dimension annotation is only set to display
    in the **1:50** (upper) viewport as it only has a **1:50** annotation scale applied
    to it in the **Model** tab. This is how annotative scaling works.


    In this section, you learned how to use your annotative text and dimension styles
    with your scaled viewports. Both the text and dimensions placed used a single
    annotation scale in the **Model** tab to coincide with the scaled viewport where
    they were displayed in the drawing.


    Annotation scales allow easy scaling of annotative objects, in this case, annotative
    dimensions. When using annotative dimensions, annotation scales can be applied
    to consistently scale dimension annotation in viewports of differing scales in
    your layout tabs.


    In the next section of this chapter, you will learn how to add and delete annotation
    scales for annotative objects.


    # Adding and deleting object annotation scales


    In this section, you will learn that annotative objects can have more than one
    annotation scale applied to them, thus being able to be displayed in more than
    one scaled viewport.


    You will still have the `Office Plan_GROUND FLOOR.dwg` file open. With it open,
    follow these steps:


    +   1. Return to the **Model** tab in AutoCAD and zoom to the **Executive Office**
    area.

    +   2. Hover over the multiline text object that says **Executive Office**. You
    can see the annotative symbol visible in *Figure 8.28*:


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_224_0.png)'
  merge: -1
  img_proc: true
- pgno: 225
  md: '3. Select the annotative multiline text with a click. You will see the blue
    grips appear. Right-click to display the context-sensitive shortcut menu, as shown
    in Figure 8.29:


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_225_0.png)


    Figure 8.29: The shortcut menu with Annotative Object Scale - Add/Delete Scales...
    displayed


    4. Select Annotative Object Scale from the shortcut menu, and then click on Add/Delete
    Scales... from the sub-menu.


    5. The Annotation Object Scale dialog box is displayed, as shown in Figure 8.30.
    You will notice that the only annotation scale applied to the annotative text
    is the 1:30 scale. Click on the Add... button:


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_225_1.png)


    Figure 8.30: The Annotation Object Scale dialog box'
  merge: -1
  img_proc: true
