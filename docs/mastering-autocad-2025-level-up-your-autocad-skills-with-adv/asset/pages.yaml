    19. You can now click on Save on the QAT at the top-left of the AutoCAD screen,
    as shown in Figure 16.13. You can save normally like this, as you are working
    on a drawing that is based in the cloud, in the AutoCAD Web & Mobile folder. It
    is the same as saving a drawing file in a local location, such as on a hard drive
    or server.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_425_1.png)


    Figure 16.13: The Save icon on the QAT


    20. After closing the Trace toolbar, you will return to the Model tab in the New
    Office Layout_TRACE.dwg file.


    21. You have now applied a trace to the drawing file and saved it back to the
    cloud.


    Tips and tricks #37

    Adding a trace to a DWG file using the AutoCAD desktop application is a straightforward
    workflow, as demonstrated by the previous section in this chapter. However, there
    is one little thing you should always remember. You cannot save a DWG while a
    trace operation is active, so you must close the trace by closing the Trace toolbar,
    and then save the drawing file.


    In this section, you initiated the collaboration workflow by adding a trace to
    a DWG file while working in the AutoCAD desktop application.'
  merge: -1
  img_proc: true
- pgno: 426
  md: "# AutoCAD for Mac\n\nThe trace functionality is supported in AutoCAD for Mac.\
    \ If you are using the 2024 or 2025 versions, the workflows in the previous section\
    \ are the same. Still, you must save your DWG files from a Mac to one of the proprietary\
    \ cloud-based solutions, such as Microsoft OneDrive, as AutoCAD Web & Mobile folders\
    \ are not supported in AutoCAD for Mac.\n\nIn the next section, you will add to\
    \ that trace using the AutoCAD mobile application as if you were onsite, working\
    \ on the new office layout in real-time in a real-world environment.\n\n# Using\
    \ traces in the AutoCAD mobile application\n\nThis section is based on using the\
    \ AutoCAD mobile application on an Apple iPad Pro. The AutoCAD mobile application\
    \ can be run on both Apple and Android mobile operating systems, and the interface\
    \ can differ, so be aware of that.\n\nYou are not expected to have access to a\
    \ tablet such as an iPad Pro. This chapter includes this section to give you an\
    \ appreciation of how quick and easy it is to work with traces in a cloud-based\
    \ DWG file using AutoCAD mobile:\n\n+   1. The AutoCAD mobile application is assumed\
    \ to have already been installed on the Apple iPad Pro. You can access AutoCAD\
    \ (on a subscription basis) in the Apple and Google app stores.\n+   \n+   2.\
    \ Like the AutoCAD desktop application and AutoCAD Web, you must log into the\
    \ AutoCAD mobile application using your Autodesk account credentials.\n+   \n\
    +   3. Upon logging in, you will see a page that displays a **Recent** panel showing\
    \ recently accessed files and a **Sources** panel, where you can access other\
    \ cloud-based file locations, as shown in *Figure 16.14*. You can see the `New\
    \ Office Layout_TRACE.dwg` file in the **Recent** panel, as it has been accessed\
    \ on the iPad recently. You can also use AutoCAD Web in the **Sources** panel,\
    \ which takes you to the **AutoCAD Web & Mobile** folder. Also, note that the\
    \ listing for the `New Office Layout_TRACE.dwg` file shows you whether it has\
    \ been accessed on PC (AutoCAD desktop) or via AutoCAD Web."
  merge: -1
  img_proc: true
