- pgno: 109
  md: '![](img/e5541e806f2ef46a4958b6c3d0b346a9_109_0.png)


    Figure 4.14: Dimensions with different annotation scales


    In Figure 4.14, the larger dimensions (2500 and 2750) have an annotation scale
    of 1:50, and the smaller dimensions (250 and R1500) have an annotation scale of
    1:30. These then correlate to the scale of the layout viewports in which they
    are displayed, by way of annotative scaling, using an annotation scale applied
    to each dimension object.


    The benefit of these annotative dimensions is that due to the annotation scales
    applied to the dimension objects, they display consistently in the layout viewports.
    You can also apply multiple annotation scales so that annotative objects display
    in more than one scaled layout viewport.


    All that is required for this to work effectively is an annotative dimension style.
    In the Office Project.dwg file, an annotative dimension style called Metric-mm
    is used. This is shown in Figure 4.15. The figure shows the Dimension panel, which
    you will find in the Annotate tab on the AutoCAD ribbon:


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_109_1.png)


    Figure 4.15: The current annotative dimension style shown in the Dimension panel'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'The annotative dimension style uses a small blue triangular symbol to indicate
    it is an annotative dimension style.


    With an annotative dimension style, you set the annotation scale in the **Model**
    tab, using the flyout menu on the status bar, as shown in *Figure 4.16*:


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_110_0.png)


    Figure 4.16: The annotation scale flyout menu with 1:50 as the current annotation
    scale'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'Dimensions are added to your design in a drawing to communicate design intent.
    Typical examples of this would be the length and width of a room, the size of
    a window or door opening, or the shaft length and thread length of a bolt. You
    would normally add dimensions to a drawing using object snaps (OSNAP) to snap
    accurately to the geometry representing real-world objects to communicate these
    values for construction and manufacture. By setting the annotation scale when
    working in the **Model** tab, you are letting AutoCAD know how to scale the dimension
    in the appropriate layout tab.


    Any subsequent dimensions placed using the annotative dimension style will adopt
    a 1:50 annotation scale, thus making sure they are displayed in the **1:50** layout
    viewport. The same workflow would be adopted for the **1:30** layout viewport,
    where the annotation scale for the annotative dimensions would be set to **1:30**.


    All objects in an AutoCAD DWG file have known properties, whether that be the
    **Layer**, **Xolor**, **Linetype**, or in this case, the **Annotative Scale**.
    You can check whether a dimension object is annotative or not by looking at its
    properties in the **Properties** palette. The properties of an annotative dimension
    should be displayed as shown in *Figure 4.17*:


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_111_0.png)


    # Figure 4.17: The properties of a selected annotative dimension object displayed
    in the Properties palette'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'The biggest benefit of annotative scaling when used with annotative dimensions
    is that you can stick with one annotative dimension style and one layer for all
    your dimension annotation, knowing that it will display consistently in all layout
    viewports of differing scales.


    # Tips and tricks #14


    When using annotation scaling with annotative dimensions, you can also add multiple
    annotation scales to a single dimension object. For example, if you had a dimension
    that needed to be displayed in both a **1:50** layout viewport and a **1:30**
    layout viewport, you would add **1:50** and **1:30** annotation scales to the
    dimension object. This can be done via the **Properties** palette by clicking
    on the **Annotative scale** value (see Figure 4.17). After clicking on the value,
    a small button appears next to the displayed annotative scale value. Click on
    the button, and you will be able to add new annotation scale values using the
    dialog box that appears.


    Annotation scaling is a fantastic time-saver. When using it with annotative dimensions,
    you only have to create one dimension style and one layer for your dimensions.


    # AutoCAD for Mac


    Annotation scaling is also available in AutoCAD for Mac. You would set up your
    annotative dimension styles using a similar workflow. Place your annotative dimension
    objects as you do in AutoCAD for Windows, using the annotation scale flyout menu
    on the status bar when working in the **Model** tab.


    # Summary


    In this chapter, we have learned how to select multiple overlaid objects and select
    the required object for updating or deletion, as well as how to model in 3D much
    more effectively using **3D Object Snap** (*3DOSNAP*).


    We have also learned how to create accurate 2D isometric drawings, utilizing the
    isometric drafting (*ISODRAFT*) settings.


    We have also gained valuable knowledge of the units (*UNITS*) function in AutoCAD,
    allowing for quick and effective changes to units in drawings, as well as learning
    how to set and/or change the annotation scale (*CANNOSCALE*) to work in line with
    annotative scales set in layout viewports in the drawing.


    The advanced drafting settings in this chapter will allow you to work in a more
    effective way, enhancing your productivity. They also allow you to utilize various
    tools in AutoCAD to their full advantage. Now that you know how to use them, your
    daily AutoCAD use will become less onerous, and you will start to work smarter
    with AutoCAD, not harder.


    In the next chapter, we will look at how you can develop advanced geometry in
    AutoCAD using object snaps.'
  merge: -1
  img_proc: true
