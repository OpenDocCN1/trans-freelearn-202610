- pgno: 71
  md: 'As you can see, some of the content from the hamburger icon is replicated.
    The Plot... option is available, as is Drafting Standard Setup.... Again, these
    are quick shortcuts to what is already available on the AutoCAD ribbon, thus providing
    quicker ways to get to commands in context. You normally set up the drafting standards
