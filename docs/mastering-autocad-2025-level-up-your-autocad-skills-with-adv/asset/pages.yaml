- pgno: 142
  md: 'In *Chapter 5*, you looked at how you could develop advanced geometry using
    AutoCAD’s object snaps. In this chapter, you will not only utilize these object
    snaps but will also use some interesting AutoCAD tools combined with those snaps
    to achieve pinpoint accuracy when calculating distances, areas, and angles.


    # Exercise files


    You must ensure you have downloaded the exercise files, Sawblade.dwg, Sawblade2.dwg,
    and Sawblade3.dwg to follow the sections in this chapter.


    # Using Noun/verb selection for quick and easy object selection


    **Noun/verb selection** is normally on by default in AutoCAD. It allows you to
    select AutoCAD objects *before* executing the appropriate command to manipulate
    the selected objects.


    It is a particularly useful feature as it saves you from a longer and relatively
    more complex workflow. Without **Noun/verb selection**, you would be forced to
    choose a command first, then select objects at the **Select objects** prompt,
    and then press *Enter* to confirm object selection before using the command on
    the selected objects.


    Even though this is a default setting, it’s best to check that it’s enabled. To
    get to it, simply right-click with no objects selected and no commands running,
    and then select **Options** on the shortcut menu. Alternatively, you can click
    on the AutoCAD icon (top left) to open **Application Menu** and find the **Options**
    button there.


    You will find **Noun/verb selection** in the **Selection** tab of the **Options**
    dialog box. As shown in *Figure 6.1*, the **Noun/verb selection** checkbox appears
    at the top left.'
  merge: -1
  img_proc: true
- pgno: 143
  md: '![](img/e5541e806f2ef46a4958b6c3d0b346a9_143_0.png)


    Figure 6.1: The Options dialog box with Noun/verb selection checked


    You will notice that the **Noun/verb selection** checkbox is already checked,
    which means that **Noun/verb selection is switched on**. The **Noun/verb selection**
    checkbox works similarly to a human brain when picking up an object. Before picking
    up an object (*noun*), it will choose the object first and then pick it up (*verb*).'
  merge: -1
  img_proc: true
- pgno: 144
  md: '**Tips and tricks #20**


    **Noun/verb selection** should be switched on by default in any AutoCAD installation.
    However, users do (sometimes) switch it off. A typical reason might be that more
    than one object needs to be selected. With **Noun/verb selection** off, the command
    (verb) can be selected first, followed by the **Select objects** prompt (noun),
    where multiple objects can easily be selected, followed by the Enter key to confirm
    selection during the command workflow. Depending on personal preference, this
    type of workflow might be adopted by the user. To get the most out of this chapter,
    it would be ideal if you keep it switched on. You can also type `PICKFIRST` and
    press Enter to change the variable value. To turn it on, **PICKFIRST** should
    be set to **1**. Setting it to **0** (zero) turns it off.


    **Noun/verb selection** is incredibly useful. It makes for a much more fluid AutoCAD
    experience. Try using AutoCAD with it and without it, and you will see the difference
    it makes to your daily AutoCAD workflow.


    **AutoCAD for Mac**


    **Noun/verb selection** is not supported in AutoCAD for Mac. You will also find
    that the **Options** dialog box is called **Application Preferences**. You can
    find this by clicking on **AutoCAD 2024** (top left – if you use the 2024 version;
    it will be **AutoCAD 2023** for AutoCAD 2023, etc.). Select **Preferences...**
    and the **Application Preferences** dialog box will open. Mac users can utilize
    this dialog box to manage their AutoCAD settings. These settings include **Look
    & Feel**, where the user interface can be adapted to suit the Mac user, and **Units
    & Guides**, where the user can set specific source content units and target drawing
    units, similar to how they would be set in the Windows version of AutoCAD. The
    dialog box is shown in Figure 6.2.'
  merge: -1
  img_proc: true
- pgno: 145
  md: '![](img/e5541e806f2ef46a4958b6c3d0b346a9_145_0.png)


    Figure 6.2: The Application Preferences dialog box in AutoCAD for Mac


    Now that we have learned how to use the Noun/verb selection feature, let us look
    at other AutoCAD tools: Quick Measure and Distance.


    # Calculating lengths and angles with Quick Measure and Distance


    AutoCAD is a drafting application that allows you to communicate your design intent.
    With that intent comes the need to measure distances accurately.


    In versions of AutoCAD from AutoCAD 2021 onward, you can do this in two ways:


    +   - **Quick Measure**: This tool measures all distances and angles as you move
    the cursor over the geometry in your drawings

    +   - **Distance**: This tool measures individual distances (lengths) using object
    snaps for precision and accuracy


    Using the Sawblade.dwg file, you will now use both tools to accurately measure
    distances (and, in the case of Quick Measure, angles as well). Follow these steps
    to see how:


    +   1. Open the Sawblade.dwg file and zoom into the saw teeth at the top of the
    circular sawblade.'
  merge: -1
  img_proc: true
- pgno: 146
  md: '2. On the Home tab on the ribbon, click on the Measure flyout on the Utilities
    panel. You will see Quick (Quick Measure), as shown in Figure 6.3. Click on it.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_146_0.png)


    Figure 6.3: The Measure flyout with Quick Measure (arrowed)


    3. Move the cursor around the sawblade in the drawing file. You will see numerous
    measurements shown, including angles, as shown in Figure 6.4.


    The geometry being measured is highlighted in a different color (purple) than
    the geometry color. Also, note that arc lengths are measured.'
  merge: -1
  img_proc: true
- pgno: 147
  md: '![](img/e5541e806f2ef46a4958b6c3d0b346a9_147_0.png)


    Figure 6.4: Measured geometry shown highlighted by Quick Measure


    +   4. To close **Quick Measure**, hit *Esc* on the keyboard. You can also right-click
    and select Enter on the shortcut menu.

    +   5. Check that your object snaps are *on* down on the status bar and, again,
    click on the **Measure** flyout. This time, select **Distance**.

    +   6. You will be prompted to select a point to measure from. This is why you
    need object snaps to measure the distance accurately.

    +   7. Select the lower point on the saw tooth (shown as **1** in *Figure 6.5*),
    and then select the point below it (shown as **2** in *Figure 6.5*).

    +   8. The measured distance will then be displayed, along with the **Measure**
    menu, so you can continue measuring using any of the **Measure** tools, as shown
    in *Figure 6.5*.'
  merge: -1
  img_proc: true
- pgno: 148
  md: 'Figure 6.5: Using the Distance tool to measure between points


    9. You can select eXit in the Measure menu to close the tool anytime or press
    Esc on the keyboard to cancel the Measure (MEASUREGEOM) command.


    Quick Measure is a great way of checking existing distances and angles visually
    when you just need to look at and confirm them. The Distance tool allows for more
    detailed measurement of existing distances, utilizing accuracy tools such as Object
    Snap.'
  merge: -1
