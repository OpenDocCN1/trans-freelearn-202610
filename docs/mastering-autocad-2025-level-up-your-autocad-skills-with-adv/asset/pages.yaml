  md: '+   6. You can see the *yellow exclamation* mark like in *Chapter 11*, which
    means that the **Visibility** parameter needs more information to function. In
    this case, it needs objects (the regular blocks) to represent each visibility
    state in the dynamic block. You don''t need to name the parameter, but it can
