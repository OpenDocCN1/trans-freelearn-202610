- pgno: 227
  md: '8. Click on OK to close the dialog box. You will notice that the annotative
    text is now larger in the Model tab, as shown in Figure 8.33. This is because
    you now have two annotation scales applied, and the current annotation scale is
    1:50, which defines its size in the drawing. Also note that when hovering over
