    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_365_0.png)


    Figure 13.29: The Shared Views palette with comments displayed


    8. You can now reply to the markups/comments in the Shared Views palette in AutoCAD,
    and these will then become available in the Autodesk Viewer collaboration file,
    thus allowing non-AutoCAD users to collaborate and provide input on the original
    design created in AutoCAD.'
  merge: -1
  img_proc: true
- pgno: 366
  md: '![](img/e5541e806f2ef46a4958b6c3d0b346a9_366_0.png)


    You can now easily share drawings and views using the **Share Drawing** (*SHARE*)
    tool and the **Shared Views** palette. Using **Shared Views** and the Autodesk
    Viewer allows non-AutoCAD users to view and mark up shared drawings. The Autodesk
    Viewer provides a simple-to-use interface, with real-time marking up and commenting
    capabilities. These markups and comments can then be viewed and utilized in the
    AutoCAD desktop application.


    # ## Summary


    In this chapter, you have learned how to quickly and efficiently collaborate on
    your AutoCAD designs with other Autodesk users with **Share Drawing** (*SHARE*)
    and AutoCAD Web. You have also learned how to collaborate and mark up your designs
    using the **Shared Views** palette and the Autodesk Viewer, which is browser-based,
    thus providing an easy way of sharing designs with non-AutoCAD users.


    You can use either method to save valuable time when collaborating on your AutoCAD
    drawings and designs. You can learn more about **Shared Views** here on the Autodesk
    website: `https://help.autodesk.com/view/ACD/2023/ENU/?guid=GUID-459FD977-18F2-46C4-B238-B91E6DC27536`.


    You can learn more about AutoCAD Web (part of your AutoCAD subscription package)
    at `https://web.autocad.com`.


    In this chapter, you have learned how to use the **Share Drawing** tool quickly
    and efficiently when working with the **Share Drawing** (*SHARE*) command, sharing
    a DWG file to AutoCAD Web for easy collaboration in the browser-based version
    of AutoCAD.


    You have also experienced different types of shared drawings, understanding how
    drawings can be viewed and revised in the AutoCAD Web application using the **Edit
    and save a copy** option. You also learned how to save and edit a new file in
    AutoCAD Web.


    You utilized the **Shared Views** palette to create a collaboration file for use
    in the Autodesk Viewer and learned how to work with views/drawings by adding markups/comments
    in the Autodesk Viewer, and how to work with them in the AutoCAD desktop application.


    Collaboration using cloud-based and browser-based tools such as AutoCAD Web and
    the Autodesk Viewer allows quick, simple, and effective communication between
    project stakeholders and your CAD team. They are tools that will enable you to
    work smarter, not harder. In the next chapter, we will look at ways to compare
    drawings and external reference files (*XREF*s) using **DWG Compare** (*DWGCOMPARE*)
    and **XREF Compare** (*XREFCOMPARE*).'
  merge: -1
  img_proc: true
- pgno: 367
  md: '# 14


    # Comparing Drawings and External Reference Files


    In the previous chapters, you have learned how to work with blocks, attributes,
    and dynamic blocks and share your drawings. You now need to consider how you might
    compare the drawings and **external references (Xrefs)** that contain those blocks
    and attributes. You might also need to compare drawings and Xrefs when sharing
    drawings. This chapter teaches you how to compare your AutoCAD drawing files and
    Xrefs using the *COMPARE* and *XREFCOMPARE* commands.


    Comparing drawings and Xrefs is much easier and less time-consuming than it used
    to be. It used to be a manual, visual comparison, but those days are long gone.
    You can now use AutoCAD to compare drawing files and Xref drawing files. This
    technology also allows you to make a drawing file of the comparison and incorporate
    the compared objects into the relevant drawing. In this chapter, you will see
    how **DWG Compare** and **Xref Compare** can improve your AutoCAD drawing approval
    workflows, making them much quicker and allowing more efficient document preparation.


    This chapter covers the following ways of working with the *COMPARE* and *XREFCOMPARE*
    commands:


    +   - Comparing drawings with DWG Compare

    +   - Working with drawing comparisons generated with DWG Compare

    +   - Comparing drawings with Xref Compare

    +   - Working with reference file comparisons generated with Xref Compare


    # Exercise files


    For this chapter, you must use the `New Office Layout_REV1.dwg` and `New Office
    Layout_REV2.dwg` exercise files. Open both files in the same AutoCAD session and
    ensure both display the office floor plan in the **Model** tab. You will notice
    subtle differences between the two drawings.'
  merge: -1
  img_proc: true
- pgno: 368
  md: 'In the later sections of the chapter, when you work with and compare Xref files,
    you will be using the `New Office Layout_WITH XREF.dwg` file.


