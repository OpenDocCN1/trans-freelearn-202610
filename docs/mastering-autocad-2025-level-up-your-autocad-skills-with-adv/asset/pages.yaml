- pgno: 336
  md: '**AutoCAD for Mac**

    Adding visibility states in **Block Editor** follows the same workflow in AutoCAD
    for Mac.


    You have now created your new **Washbasin_DYN** dynamic block with visibility
    states. In the next section of this chapter, you will bring the block into the
    drawing and use the visibility states to display different views of the washbasin.


    # Using the new dynamic block with visibility states


    In the previous section, you learned how to use regular blocks to create visibility
    states of different views of the washbasin in a new dynamic block. In this section,
    you will learn how to insert the new dynamic block into the drawing and utilize
    the visibility states.


    Throughout this chapter, you have worked on the default layer, layer zero (0).
    This means your new dynamic block will assume the current layer when inserted
    in the drawing. The following workflow will allow you to fully test the dynamic
    washbasin block:


