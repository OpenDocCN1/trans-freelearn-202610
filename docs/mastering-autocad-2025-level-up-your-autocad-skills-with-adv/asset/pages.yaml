- pgno: 377
  md: '10. Clicking on the **Open the drawing** link will open the comparison drawing
    in **DWG Compare Snapshot** mode, as shown in *Figure 14.16*.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_377_0.png)


    Figure 14.16: The saved comparison DWG file in DWG Compare Snapshot mode


    DWG Compare Snapshot mode is similar to DWG Compare mode, but you are looking
    at the comparison drawing rather than the two previously compared drawings. You
    can still navigate between each comparison instance using the arrows on the DWG
    Compare Snapshot toolbar. Plus, the comparison snapshot drawing has been saved
    for future reference, which is great for creating an audit trail of changes, edits,
    and revisions to your drawings.


    This brings this section to a close, and you have now learned how to utilize the
    DWG Compare tool in AutoCAD to compare DWG files and save a comparison DWG file
    for future reference.


    In the next section, you will learn how to use the **Xref Compare** tool in AutoCAD
    to compare different iterations of XREFs attached to your AutoCAD drawings.


    # Comparing drawings with Xref Compare


    This section will teach you how to use the Xref Compare tool. Like the DWG Compare
    tool, it provides a comparison interface, allowing you to view and work with differences
    between Xrefs attached to your host drawing. Xrefs are separate DWG files that
    are *paper-clipped* as a reference file to the current host drawing. Another AutoCAD
    user can work on an Xref DWG file, and the subsequent changes can be displayed
    on the Xref attached to the current host drawing.'
  merge: -1
  img_proc: true
