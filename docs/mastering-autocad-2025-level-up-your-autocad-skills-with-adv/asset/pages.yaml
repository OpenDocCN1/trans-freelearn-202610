    A Layout tab has a similar shortcut menu displayed after right-clicking on it.
    Each of these shortcut menus is contextual, so different options are displayed.
    Figure 3.10 shows the shortcut menu displayed.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_71_0.png)


    Figure 3.10: The Layout tab right-click shortcut menu


    There are some different options on this shortcut menu as compared to the Model
