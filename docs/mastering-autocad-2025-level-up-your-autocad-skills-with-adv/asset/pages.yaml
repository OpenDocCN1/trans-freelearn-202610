- pgno: 15
  md: '# Preface


    AutoCAD is over forty years old and has had many versions. The full version of
    AutoCAD provides 2D drafting capabilities and 3D modelling tools that can be professionally
    lit and rendered, providing photo-realistic visualizations that can be incorporated
    in professional presentations. Precise 2D drawings can be created that include
    accurate drafting annotation, including dimensions, leaders, and data tables.


    This book encourages the reader to master AutoCAD, introducing techniques and
    workflows that allow the reader to become even more competent with the AutoCAD
    application, empowering them to use the knowledge gained in this book to improve
    and enhance their existing AutoCAD skill set.


    # Who this book is for


    This book is for existing users of AutoCAD who have already used AutoCAD professionally
    in their careers. Ideally, readers should already have a basic level of knowledge
    of AutoCAD to understand the concepts, workflows, and processes mentioned in this
    book. Typical readers would include intermediate level CAD technicians, CAD managers,
    and those who use AutoCAD on a regular daily basis.


    # What this book covers


    *Chapter 1, Customizing the AutoCAD Interface*, looks at the AutoCAD interface
    and how it can be customized quickly and easily. With this customizability, you
    can make quick and easy changes to your AutoCAD interface to enhance productivity.


    *Chapter 2, Developing Your Own AutoCAD Workspace*, will help you learn how to
    use workspaces in AutoCAD effectively and make the necessary interface changes
    to create a custom workspace. You will also learn how to remove a workspace that
    isn’t needed.


    *Chapter 3, Using the AutoCAD Interface to Work Smarter*, shows how AutoCAD provides
    many functions and features that allow you to work smarter, not harder. These
    include file tabs, the Model and Layout tabs, drafting settings on the status
    bar, the AutoCAD ViewCube, and the AutoCAD navigation bar. This chapter teaches
    you how to use these tools effectively, enhancing your AutoCAD productivity.


    *Chapter 4, Using Advanced Drafting Settings*, talks about AutoCAD and its extensive
    range of drafting settings located on the AutoCAD status bar. This chapter will
    take you through some of the lesser-used, advanced drafting settings so that you
    can work more effectively and productively by working smarter, not harder.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '*Chapter 5, Developing Advanced Geometry Using Object Snaps*, elaborates that
    AutoCAD is a precise design application, and accuracy must be maintained in your
    drawing files. This chapter will show you how to use specific drafting settings
    and object snaps (often referred to as Osnaps) that will allow you to draft and
    model precisely and accurately


    *Chapter 6, Measuring and Modifying Geometry and Objects*, To achieve a high level
    of accuracy, AutoCAD users spend a lot of time modifying geometry and objects
    in drawings, often needing to measure lengths, areas, and angles. AutoCAD provides
    a comprehensive set of drafting and modeling tools to modify and measure the geometry
    quickly and accurately in your DWG files


    *Chapter 7, Developing Annotative Annotation Styles*, This chapter you will learn
    the methodologies needed to use annotative annotation in your DWG files, including
    creating text styles to manage text sizes and fonts, managing dimension annotation
    with dimension styles, setting up specific leader styles, and working with accurate
    table styles


    *Chapter 8, Working with Annotative Scaling*, This chapter takes you through how
    to utilize annotation styles with annotative scaling by setting up viewports and
    varying viewport scales, working with annotation scales in the Model tab, and
    adding and deleting object annotation scales. This allows annotation to be displayed
    appropriately to communicate design intent effectively and accurately


    *Chapter 9, Developing Block Libraries*, By the end of this chapter, you will
    be able to work with regular and dynamic blocks in drawings and create your own
    block libraries using various methods, including the Clipboard. You will also
    learn how to use the Blocks palette and utilize tool palettes with your blocks


    *Chapter 10, Working with Block Attributes*, Drawings become occupied with more
    and more blocks over time. Attributes allow you to identify your blocks and provide
    valuable information to anyone using your drawings. The methodologies you will
    need are in this chapter, such as defining attributes within a block, editing
    attributes in a block using Enhanced Attribute Editor, and using Block Attribute
    Manager (*BATTMAN*)


    *Chapter 11, Chapter Creating a Dynamic Block with Parameters and Actions*, Dynamic
    blocks need both a parameter and an associated action, so if you were working
    with a block representing a door, you may need to add a parameter and action to
    control the swing direction of the door in the door opening in the drawing. This
    chapter covers the methodologies for working with those parameters and actions
    in your drawings.


    *Chapter 12, Creating a Dynamic Block with Visibility States*, Visibility states
    allow you to create a dynamic block with numerous views in the same block. This
    chapter shows you how to create a washbasin block with three different views:
    top, front, and side


    *Chapter 13, Sharing Your AutoCAD Drawings*, Sharing drawings and drawing views
    allows you to share aspects of your design in real-time, using the power of the
    internet and the cloud. This saves valuable drawing management and collaboration
    time by providing a much more dynamic drawing revision path.'
  merge: -1
  img_proc: true
