- pgno: 93
  md: '**Tips and tricks #10**

    **ShowMotion** is a highly under-used and underrated AutoCAD tool that can enhance
    the visual and presentation qualities of any design. If any design needs a quick
    presentation to a stakeholder, **ShowMotion** should be your go-to tool of choice.


    Consider using **ShowMotion** as your go-to tool for creating presentation material.
    It is integrated into AutoCAD and saves the need for third-party applications.


    **AutoCAD for Mac**

    Please note that there is no **ShowMotion** functionality in AutoCAD for Mac.


    As you can see, the **navigation bar** is incredibly versatile – not just for
    navigating in 2D drawings and 3D models. It provides a comprehensive navigation
    toolbox that enhances productivity in your daily AutoCAD workflows and also provides
    a useful presentation tool in **ShowMotion**.


    # Summary


    In this chapter, you have learned how to work with file tabs and floating drawing
    windows using them to manage your open drawing files.


    You have also learned how to use the **Model** and **Layout** tabs and how to
    copy tabs and set up their required settings.


    You have also learned how to utilize drafting settings on the status bar to draft
    and model effectively and productively.


    You have learned how to work with the ViewCube when 3D modelling and use the ViewCube
    settings, and also how to use the navigation bar and work with the tools available.


    Working smarter with the AutoCAD interface will make you more productive.


    It is important that you not only understand the AutoCAD interface but also utilize
    it to its full advantage. The interface has seen many iterations over the years
    and is now at a point where it works incredibly well for you, allowing you to
    be much more efficient with your day-to-day work. In the next chapter, we will
    look at how advanced drafting settings will enhance your AutoCAD productivity.'
