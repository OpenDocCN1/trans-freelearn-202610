  md: '+   9. You have now added your block library drawing to the **Blocks** palette.
    If you locate your library drawing in a central location, such as on a server
    network or in the cloud (using the likes of OneDrive, for example), anyone in
    your team can locate the library drawing and use the blocks in it. This saves
    rework time and time taken to locate the block library drawing file.


    > **AutoCAD for Mac**

    > The **Blocks** palette works in the same way in AutoCAD for Mac.


    In this section, you learned how to add your blocks to a new block library drawing
    and include a path to that library drawing on the **Blocks** palette. In the next
    section, you will discover how to create a block library tool palette, using the
    **Tool Palettes** in AutoCAD.


    # Creating a new block library tool palette


    **Tool palettes** in AutoCAD are another way in which to store your blocks for
    central use by your CAD team. If you store your block library drawings in a central
    location, you can drag and drop blocks onto a tool palette, and the tool palette
    will utilize that location. You can then import and export tool palettes to members
    of your CAD team.


    In the following workflow, assume that the block library drawing `Architecture-LIBRARY.dwg`
    is stored in a central location. Use the block library drawing you created in
    the previous section to drag and drop the **Door – Metric** block onto the new
    tool palette:


    +   1. Ensure that your block library drawing is the current drawing in AutoCAD.
    In this section, the current block library drawing is called `Architecture-LIBRARY.dwg`,
    and is assumed to be saved in a central location, such as a network server, or
    in the cloud.


    +   2. Select the **View** tab on the ribbon and click on the **Tool Palettes**
    icon in the **Palettes** panel. The **Tool Palettes** palette will appear on the
    screen, as shown in Figure 9.25. You can also see the **Door-Metric** dynamic
    block.'
  merge: -1
