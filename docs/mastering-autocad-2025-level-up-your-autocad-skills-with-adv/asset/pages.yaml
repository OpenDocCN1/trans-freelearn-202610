    In this section, you learned how the trace functionality in your AutoCAD subscription
    allows you to collaborate with new and existing traces in drawings via the AutoCAD
    mobile application. In the next section, we use traces in AutoCAD Web.


    # Using traces in AutoCAD Web


    This section is based on using AutoCAD Web to collaborate on the trace you have
    been using in this chapter.


    The New Office Layout_TRACE.dwg file was saved in the cloud in the previous section
    using the AutoCAD mobile application, so you know that it is current. You can
    check this after logging into AutoCAD Web using your AutoCAD subscription details.
    The drawing will display in the Recent list when you log in, as shown in Figure
    16.21.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_432_0.png)


    Figure 16.21: The drawing listed in the Recent list in AutoCAD Web


    The drawing file displays the date it was last opened, allowing you to check whether
    it is the most current version.'
