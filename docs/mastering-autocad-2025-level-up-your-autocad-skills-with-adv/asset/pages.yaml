- pgno: 389
  md: '# Working with AutoCAD Web


    In previous chapters, you learned how to work with attributes and dynamic blocks
    and share your drawings. You also learned to compare DWG files and external reference
    files (Xrefs). You are now at a point where you and your CAD team may need to
    collaborate on a drawing file to further your design. This is where you can utilize
    AutoCAD Web and the cloud.


    AutoCAD is a subscription-based application. With that subscription comes the
    AutoCAD Web offering, which incorporates the AutoCAD web application and the AutoCAD
    mobile application. Both applications allow DWG file collaboration in the cloud,
    and the AutoCAD mobile application adds full mobility to your DWG files, utilizing
    the latest mobile devices, such as smartphones and tablets. This chapter will
    teach you how to use AutoCAD Web to provide a seamless, cloud-based collaboration
    experience, collaborate with DWG files that are based in the cloud, and check
    for current versions using the Drawing History tool. You will also learn how to
    save DWG files to the cloud and use them with AutoCAD Web and how to use the AutoCAD
    web and mobile applications.


    Using the cloud for collaboration will not only save large amounts of time but
    also allow you to revise and change drawings on the fly in real time. In addition,
    it’s a highly valuable DWG storage resource.


    This chapter covers the following methodologies to work with AutoCAD Web and the
    cloud:


    +   - Saving DWG files to the cloud

    +   - Using the Drawing History tool

    +   - Opening and working with drawings in the AutoCAD web application

    +   - Opening and working with drawings in the AutoCAD mobile application

    +   - Using drawings updated in AutoCAD Web or the AutoCAD mobile application'
  merge: -1
  img_proc: true
- pgno: 390
  md: '# Exercise file


    For this section, you must use the New Office Layout.dwg exercise file. Open the
    file and ensure that the office floor plan is displayed in the Model tab.


    This chapter will display various images from a browser-based version of AutoCAD
    and the AutoCAD mobile application installed on a tablet (an Apple iPad Pro).
    Please ensure you have access to AutoCAD Web using your AutoCAD subscription details.


    There is no essential requirement to have a mobile device with the AutoCAD mobile
    application installed for this chapter, but it will help to have one and install
    it. This will allow you to become familiar with the relevant mobile workflows.
    You can find the mobile application if you search for AutoCAD online in your relevant
    app store.


    # Saving DWG files to the cloud from the AutoCAD desktop


    The AutoCAD desktop application allows you to save your DWG files to the cloud
    using the AutoCAD web and mobile folders. Provided you are signed in to your AutoCAD
    subscription, you can use the Save To Web & Mobile (SAVETOWEBMOBILE) command.


    The SAVETOWEBMOBILE command is conveniently located at the top left of the Quick
    Access Toolbar (QAT), as shown in Figure 15.1. You may be asked to install a driver
    file when you click on it for the first time. Make sure this is installed. It
    will install very quickly and won’t take long.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_390_0.png)


    Figure 15.1: The SAVETOWEBMOBILE icon on the Quick Access Toolbar (QAT)


    Once it’s installed, follow these steps to save DWG files:


    +   1. After clicking on the icon (and installing the driver), the Save To AutoCAD
    Web & Mobile dialog box will appear, as shown in Figure 15.2. The file location
    is displayed at the top of the dialog box (AutoCAD Web & Mobile: arrowed in the
    figure), and the preferred filename is displayed at the bottom (arrowed in the
    figure).'
  merge: -1
  img_proc: true
- pgno: 391
  md: '![](img/e5541e806f2ef46a4958b6c3d0b346a9_391_0.png)


    Figure 15.2: The Save To AutoCAD Web & Mobile dialog box


    +   2. After typing in the preferred filename (just use `New Office Layout` at
    this point), you can click on **Save**. This will save the DWG file into the cloud
    space reserved for your AutoCAD subscription in the `AutoCAD Web & Mobile` folders.


    After clicking **Save**, the drawing will look the same as the original file you
    opened, but your current drawing is now the cloud-based version with the same
    filename.


    Look at the AutoCAD title bar. You will see a long-winded path for your newly
    saved DWG file, as shown in *Figure 15.3*. This path is the location of your **AutoCAD
    Web & Mobile** cloud space, defined by your AutoCAD subscription and the Autodesk
    account you use when signing into AutoCAD. Note that your file path will differ
    from the one shown in *Figure 15.3*, as it is specific to *your* account details.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_391_1.png)


    Figure 15.3: The new file path for the DWG file saved in the cloud'
  merge: -1
  img_proc: true
- pgno: 392
  md: 'Your drawing is now in the cloud, ready for collaboration. Yes, it’s that easy!


    You now know how quick and easy it is to save your DWG file for collaboration
    in the cloud. Autodesk provides a very easy method using the AutoCAD Web & Mobile
    folders.


    > **Tips and tricks #35**

    > There are other proprietary cloud-based locations where your DWG files can be
    stored for collaboration. AutoCAD supports Autodesk Drive, Microsoft OneDrive,
    Google Drive, Dropbox, and Box. You can also connect your files using Autodesk
    Desktop Connector and Autodesk Docs. Using these other methods of cloud-based
    storage will require a subscription/account and will provide a separate location
    other than the default AutoCAD Web & Mobile folders.


    If working for a large organization or company, it may be that they have an enterprise-wide
    proprietary cloud-based solution already. Microsoft OneDrive and Dropbox are common
    in larger companies, so check if these are available, as they will be readily
    accessible by the rest of your CAD team.


    > **AutoCAD for Mac**

    > The AutoCAD Web & Mobile folders are *not* supported in AutoCAD for Mac. You
    must save your DWG files from a Mac to one of the proprietary cloud-based solutions,
    such as Microsoft OneDrive, mentioned in Tips & tricks #35.


    # Using the Drawing History tool


    When working with cloud-based DWG files, you need to know which version of the
    file is current. Sometimes, there might be a locally saved version of the file
    with the same filename. This is normally a case of checking a time and date stamp
    applied to the drawing. This is why you were asked to save the cloud-based version
    of your file with the same filename. You now have two versions of the New Office
