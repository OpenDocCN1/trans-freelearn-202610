  md: 'I have known Shaun Bryant for over 30 years. We met through our shared experiences
    at Autodesk University and enjoyed exchanging tips and tricks about CAD and its
    ever-evolving technology. Shaun is an Autodesk Certified Instructor in AutoCAD
    and Revit, boasting over 34 years of experience. As a leading expert in AutoCAD,
    Shaun is among the most sought-after consultants, trainers, CAD managers, and
    users globally. As the owner and author of the acclaimed CAD blog “Not Just CAD”
    and a LinkedIn Learning author, he offers a wealth of online instructional materials
    to help users excel in their fields. Shaun is recognized worldwide as a top instructor
    and speaker at Autodesk University. He recently served as an Autodesk Speaker
    Mentor, showcasing his exceptional ability to help others advance in their careers.


    In this book, Shaun demonstrates some of the more advanced functionality of AutoCAD
    to enhance efficiency and productivity, helping you to get started quickly with
    AutoCAD processes and workflows. Shaun uses this book to demonstrate how to easily
    create a diverse range of drawings with examples that incorporate best practices
    and techniques utilizing the latest AutoCAD technology.


    *Jeanne Aarhus*


    *President of Aarhus Associates, LLC*


    *Author of AutoCAD 2025 Best Practices, Tips, and Techniques, MicroStation for
    AutoCAD Users, AutoCAD for MicroStation Users* and several other training manuals.'
