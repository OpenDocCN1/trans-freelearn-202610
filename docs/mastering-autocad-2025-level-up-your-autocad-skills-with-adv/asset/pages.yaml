    +   7. Look at the ribbon. You are in the blue contextual **Block Editor** ribbon
    tab. Look for the **Visibility** ribbon panel, as shown in *Figure 12.24*.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_329_0.png)


    Figure 12.24: The Visibility panel on the ribbon


    In *Figure 12.24*, there are two icons arrowed. The right-hand arrow points to
    the icon that sets the AutoCAD BVMODE system variable, called **Visibility Mode**.
    Clicking on this icon turns BVMODE either on (**1**) or off (**0**). You will
    need it on, as any visibility states set to invisible will then appear grayed
    out, rather than invisible, which is much easier to work with. If BVMODE is set
    to zero (**0**), you only see the current visibility state. This will become clearer
    as you go through this workflow. Click on the icon and look at the command line,
    and if you see BVMODE set to **1**, as shown in *Figure 12.25*, you are all set.
    If it says zero (**0**), click the icon again to set it to **1**.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_329_1.png)


