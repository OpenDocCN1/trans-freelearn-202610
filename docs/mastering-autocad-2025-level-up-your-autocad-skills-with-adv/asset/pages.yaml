    # Reviewing traces in the AutoCAD desktop app


    In the previous sections, you learned how to update traces in the AutoCAD mobile
    application and AutoCAD Web.


    In this section, you will open the updated DWG file from the cloud in the AutoCAD
    desktop application and review the updated trace. You will still be using the
    same DWG file, New Office Layout_TRACE.dwg, and will be using the Traces palette:


    +   1. Open the AutoCAD desktop application and click on the Open From Web & Mobile
    icon on the QAT, as shown in Figure 16.30.'
