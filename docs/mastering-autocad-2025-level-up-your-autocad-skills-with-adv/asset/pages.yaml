- pgno: 105
  md: 'The numbers indicate where the different *ISODRAFT* modes would be used to
    create the 2D isometric view:


    +   - **1**: isoplane Left

    +   - **2**: isoplane Top

    +   - **3**: isoplane Right


    Only the *Line (LINE)* command was used to create the view with a little bit of
    help from object snaps (*OSNAP*). The isometric view in *Figure 4.10* is purely
    made up of line segments drawn at the isometric angles *ISODRAFT* provides. After
    the first line segment has been drawn (which could be any of the lines shown),
    with *ISODRAFT* on, the remaining lines can easily be drawn at the appropriate
    angles using object snaps (*OSNAP*) to snap to the relevant endpoints of each
    line drawn in sequence.


    You now know how to work with isometric drawing utilizing the *ISODRAFT* setting.
    All entities and geometry need relevant units, so next up is how to change your
    unit settings in AutoCAD via the status bar.


    # Changing units via the status bar


    There will sometimes be occasions where your AutoCAD unit settings need to be
    changed. It might be that you need to convert units from one format to another
    (imperial to metric, for example), or you might just need to be able to work with
    a different unit set because a certain element in the drawing is imperial, and
    not metric, such as a mechanical gearwheel.


    There are two methods by which you can update your unit settings in AutoCAD. Let’s
    look at the first one using the **Drawing Units** dialog box.


    To change your units (*UNITS*) in AutoCAD, you would need to type UNITS and press
    *Enter*. This would then display the **Drawing Units** dialog box, as shown in
    *Figure 4.11*. You can either type UNITS in the command line and press *Enter*,
    or, if **Dynamic Input** is on, you can type UNITS anywhere in the drawing area
    of the screen and press *Enter*.'
  merge: -1
  img_proc: true
- pgno: 106
  md: '![](img/e5541e806f2ef46a4958b6c3d0b346a9_106_0.png)


    Figure 4.11: The Drawing Units dialog box


    This is a somewhat long-winded way of updating your unit set in a drawing. There
    is a much quicker and easier way of doing this.


    If you click on the Customization (hamburger) icon located in the bottom-right
    of the AutoCAD screen (at the end of the status bar) and then select Units from
    the flyout menu, a tick mark will appear next to Units in the list. It will also
    be added to the status bar as a drafting setting, as shown in Figure 4.12, which
    also shows the flyout menu displayed:'
  merge: -1
  img_proc: true
- pgno: 107
  md: "![](img/e5541e806f2ef46a4958b6c3d0b346a9_107_0.png)\n\nFigure 4.12: The Units\
    \ drafting setting with the flyout menu displayed and Decimal units selected\n\
    \nUsing this as a drafting setting on the status bar is a much quicker and easier\
    \ method to change the units in your drawing, rather than having to keep going\
    \ to the **Drawing Units** dialog box.\n\n+   **Tips and tricks #13**\n+   \n\
    +   **Units** on the status bar, as a drafting setting, is for linear units only.\
    \ You will still have to use the **Drawing Units** dialog box to alter any angular\
    \ unit settings.\n\nUnits are only part of the design workflow in AutoCAD and\
    \ allow you to draft effectively. You also need to communicate your design intent\
    \ via annotation on your drawings. Next, we will look at using annotative scaling\
    \ and annotation scales to enhance and improve your drawing legibility.\n\n# #\
    \ Working with annotation scale to improve drawing legibility\n\nThe **Annotation\
    \ Scale** feature (*CANNOSCALE*) is used when using annotation scaling in your\
    \ drawings. It is often used for drawing elements such as dimensions, text, and\
    \ hatching to make for a neat, easy-to-read drawing when working at differing\
    \ viewport scales in the layout tabs."
  merge: -1
  img_proc: true
