    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_46_0.png)


    Figure 1.34: The Customize dialog box in AutoCAD for Mac


    In the previous section, you learned how to customize the AutoCAD user interface,
    using the **CUI** command and the **Customize User Interface** dialog box. The
    next section summarizes what you have learned in this chapter.


    # # Summary


    In this chapter, you learned about changing and managing AutoCAD ribbon settings
    and set up sticky panels. We also looked at how to use the QAT effectively and
    how to work with AutoCAD CUI command and the **Customize User Interface** dialog
    box.


    All of these workflows and concepts are important to allow you, as an AutoCAD
    user, to enhance and customize the AutoCAD interface to suit your preferences
    and ideal working environment. In the next chapter, we will talk about how to
    develop and customize your own workspace in AutoCAD.'
