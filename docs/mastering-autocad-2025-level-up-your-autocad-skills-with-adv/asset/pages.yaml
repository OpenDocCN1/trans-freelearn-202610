    than one annotation scale has been applied.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_227_0.png)


    Figure 8.33: The annotative text object with two annotative symbols displayed


    9. If you return to the ISO A3 layout tab, you will also see that the Executive
    Office text object is displayed in the 1:50 (upper) viewport. This is because
    it now has the 1:50 annotation scale applied to it in the Model tab. Figure 8.34
    shows this, and you can see that using that text style with the 1:50 annotation
    scale in that viewport causes it to cross geometry and look a bit untidy.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_227_1.png)


    Figure 8.34: The annotative text object in the 1:50 viewport'
  merge: -1
  img_proc: true
- pgno: 228
  md: '+   10. Return to the **Model** tab. Select the **Executive Office** text object,
    and the blue grips will appear.

    +   11. Right-click to display the shortcut menu. Select **Annotative Object Scale**.
    The **Annotative Object Scale** dialog box will be displayed as it was previously
