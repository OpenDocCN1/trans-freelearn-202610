- pgno: 404
  md: '+   17. Click on your profile pic in the top-right corner and select **Sign
    Out** to sign out of the AutoCAD Web application.


    In this section, you have learned how to open and work on a DWG file in the AutoCAD
    Web application. You have opened up a cloud-based DWG file, created a new layer,
    and saved the drawing in the cloud.


    You can use numerous commands and workflows in AutoCAD Web, all of which follow
    similar workflows as the AutoCAD desktop application. Autodesk has done this to
    maintain the AutoCAD user experience. Also, note that AutoCAD Web is *not* a full
    working version of AutoCAD in a browser. There are a limited number of AutoCAD
    commands and features available, but there are enough in there for you to easily
    review, edit, and update any 2D DWG file.


    # Call to action


    > AutoCAD Web is an excellent tool for accessing your DWG files on the fly when
    they are stored in the cloud. Try saving a more complex DWG file to the cloud
    and working on it in AutoCAD Web. Experiment with AutoCAD Web’s tools, features,
    and workflows to test how quickly and easily a DWG file in a browser can be edited.


    AutoCAD Web democratizes AutoCAD, regardless of whether you are working on AutoCAD
    for Windows or AutoCAD for Mac. The DWG file is the same in AutoCAD Web, and all
    edits done in AutoCAD Web will reflect in the DWG when opened in the Autodesk
    desktop application when using either the Windows or the Mac version.


    # Opening and working with drawings in the AutoCAD mobile application


    This section is based on using the AutoCAD mobile application on an *Apple iPad
    Pro*. The AutoCAD mobile application can be run on both iOS and Android mobile
    operating systems, but the interface can differ, so be aware of that.


    Also, you are not expected to have access to a tablet such as an iPad. This chapter
    includes this section to give you an appreciation of how quick and easy it is
    to work on a cloud-based DWG file when mobile. You could (possibly) follow this
    section on a smartphone, but you might be limited by the size of the phone screen.
    If you have one of the larger smartphones on the market, it could be feasible.'
  merge: -1
  img_proc: true
- pgno: 405
