- pgno: 100
  md: 'Now that you know how to select objects within a drawing to change or delete
    them, let’s learn how to model accurately in 3D, utilizing 3D object snaps.


    # # Utilizing 3D object snaps when 3D modeling


    When 3D modeling in AutoCAD, regular object snaps can sometimes snap you to the
    wrong point on the 3D model. For example, you might be in a plane (top) view of
    the model and select an **Endpoint** object snap to add geometry to the model.
    As you are looking down from the top of the model, that endpoint snap could be
    on the top face or the bottom face of the model, depending on the model’s orientation.


    **3D Object Snap** (*3DOSNAP*) is a drafting setting on the status bar that gives
    you a selection of object snaps that function only in a 3D environment, allowing
    you to be more accurate when working with 3D models in AutoCAD.


    Before working with **3D Object Snap** (*3DOSNAP*), you will need to make sure
    it is available on the AutoCAD status bar. Click on the **Customization** (*hamburger*)
    icon (as mentioned in previous chapters) and select **3D Object Snap**. A tick
    mark will appear next to it. Click on the **Customization** icon again to close
    the menu.


    You can now see the 3D object snap icon on the status bar. Ensure it is displaying
    blue, indicating it is switched on. *Figure 4.5* shows you the **3D Object Snap**
    icon switched on:


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_100_0.png)


    Figure 4.5: The AutoCAD status bar with 3D Object Snap displayed and switched
    on


    **3D Object Snap** operates in the same way as the regular **Object Snap** drafting
    setting. You switch it on and select your running 3D object snaps from the flyout
    menu. If you click on the flyout arrow to the right of the **3D Object Snap**
    icon, you will see the 3D object snaps on the flyout menu. This is shown in *Figure
    4.6*:'
  merge: -1
  img_proc: true
- pgno: 101
  md: '![](img/e5541e806f2ef46a4958b6c3d0b346a9_101_0.png)


    Figure 4.6: The 3D Object Snap flyout menu


    You will notice in *Figure 4.6* that **Vertex**, **Midpoint on edge**, and **Center
    of face** have tick marks against them, which signify that these are currently
    the running 3D object snaps.


    Now, let’s go to the drawing area and select the lower left corner of the **ViewCube**.
    This will put the drawing into a preset **SW Isometric 3D** view. You can now
    see the rectangles looking as they should, as 3D solids. This is shown in *Figure
    4.7:*


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_101_1.png)


    Figure 4.7: The rectangles (3D solids) in the SW Isometric preset view with the
    ViewCube displayed'
  merge: -1
  img_proc: true
- pgno: 102
  md: 'You can utilize the 3D object snaps more effectively now that you are in a
    3D view. In Figure 4.8, you can see a line being drawn from one 3D snap to the
    3D Vertex object snap, as displayed by the tooltip:


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_102_0.png)


    Figure 4.8: A line drawn from one 3D object snap to the 3D Vertex object snap


    # Tips and tricks #12


    When working in 3D, you will find the 3D Object Snap (3DOSNAP) drafting setting
    more accurate than your regular Object Snaps (OSNAP), as you can snap to 3D vertices
    and faces rather than having to keep changing your 3D view to find the appropriate
    object snap.


    3D Object Snaps (3DOSNAP) are incredibly useful tools in a 3D environment. They
    accurately snap to geometric points on 3D objects when 2D object snaps (OSNAP)
    might snap to the incorrect point.'
  merge: -1
