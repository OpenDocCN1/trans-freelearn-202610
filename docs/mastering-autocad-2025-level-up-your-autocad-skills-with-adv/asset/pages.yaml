- pgno: 340
  md: '# # 3.1 原子结构模型


    早在1803年，英国科学家道尔顿提出了原子论，他认为原子是组成物质的最小微粒，原子在化学反应中不可再分。


    1897年，英国科学家汤姆生发现了电子，并提出了“葡萄干面包”模型，他认为原子是一个球体，正电荷均匀分布在整个球体内，电子镶嵌其中。


    1911年，英国科学家卢瑟福进行了α粒子散射实验后，提出了“行星模型”，他认为原子中心有一个带正电荷的原子核，电子在原子核外空间绕核运动。


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_340_0.png)


    卢瑟福的“行星模型”不能解释原子发光等现象，1913年，丹麦科学家玻尔改进了“行星模型”，提出了“电子分层模型”，认为电子在原子核外一定轨道上分层排布。


    现代科学家认为，原子中心有一个带正电荷的原子核，原子核由质子和中子构成，电子在原子核外高速运动。电子在原子核外的运动是不规律的，但在一定的区域内出现，这些区域称为“电子层”。'
  merge: -1
  img_proc: true
- pgno: 341
  md: '# # Part 4:

    # Communicating and Collaborating


    AutoCAD has been around for over 40 years and has adopted new technology with
    each new version. AutoCAD 2025 is no different. Cloud-based technology and file
    storage now allow your AutoCAD DWG files to go mobile and travel with you. Using
    the AutoCAD mobile application and the browser-based AutoCAD Web, combined with
    cloud-based file storage, you can now take your drawings everywhere, allowing
    for easy, seamless, real-time communication and collaboration on your AutoCAD
    designs.


    This part has the following chapters:


    +   - *Chapter 13, Sharing Your AutoCAD Drawings*

    +   - *Chapter 14, Comparing Drawings and External Reference Files*

    +   - *Chapter 15, Working with AutoCAD Web*

    +   - *Chapter 16, Collaborating Using Traces in AutoCAD*'
  merge: -1
  img_proc: true
