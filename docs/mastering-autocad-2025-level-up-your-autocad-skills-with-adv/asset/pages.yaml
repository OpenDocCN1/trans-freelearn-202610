- pgno: 290
  md: '![](img/e5541e806f2ef46a4958b6c3d0b346a9_290_0.png)


    # Figure 11.6: Block Editor open, ready to create the dynamic block


    Your door block is now created and ready to start adding your dynamic parameters
    and actions. The next two sections will explain how to add parameters and actions
    to your dynamic door block while working in Block Editor in AutoCAD.


    > Tips and tricks #31

    > When selecting the objects to create an AutoCAD block, it is often more beneficial
    to select the objects that form the block before clicking on the Create Block
    (BLOCK) command. To make sure you can do this, you need Noun/verb selection checked
    in the Selection tab in the Options dialog box, as shown in Figure 11.7. You can
    open the Options dialog box from the Application menu, right-click the shortcut
    menu, or type OPTIONS and press Enter.'
  merge: -1
  img_proc: true
- pgno: 291
  md: '![](img/e5541e806f2ef46a4958b6c3d0b346a9_291_0.png)


    Figure 11.7: The Selection tab in the Options dialog box


    Noun/verb selection should be on by default in your AutoCAD Options dialog box.
    It is always worth checking that this function is on before working with regular
    and dynamic blocks.


    > AutoCAD for Mac

    > AutoCAD for Mac uses a very similar method for creating blocks. The Create Block
    (BLOCK) command is in the left-hand menu.


    # Adding a vertical flip to the door


    In step 8 of the previous section of this chapter, you checked Open in block editor
    in the Block Definition dialog box, before clicking on OK. This opened Block Editor
    in AutoCAD, as shown in Figure 11.6.


    In this section, you will learn how to add a vertical Flip parameter and apply
    the Flip action to it, enabling you to flip the dynamic block''s vertical door
    swing in the drawing.


    The main palette in the Block Editor is Block Authoring Palettes shown in Figure
    11.8 in Block Editor. It contains all the tools needed to create the vertical
    Flip parameter that we are going to add to our dynamic door block.'
  merge: -1
  img_proc: true
- pgno: 292
  md: 'Note that a **Basepoint** parameter is required before placing any **Flip**
    parameters and actions. **Basepoint** does not have an associated action but,
    true to its name, it provides a *base point* with which to insert the dynamic
    block into the drawing. Staying in **Block Authoring Palettes**, follow these
    steps:


    +   1. Select the **Parameters** tab and then select the **Basepoint** parameter,
    as arrowed in Figure 11.8.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_292_0.png)


    Figure 11.8: The Parameters tab with Basepoint arrowed


    +   2. Select the lower-left **Endpoint** object snap on the door at the prompt.
    This will then display the **Basepoint** symbol on the door block, as shown in
    Figure 11.9.'
  merge: -1
  img_proc: true
- pgno: 293
  md: '![](img/e5541e806f2ef46a4958b6c3d0b346a9_293_0.png)


    Figure 11.9: The Basepoint parameter displayed on the lower-left endpoint


    3. Return to the Parameters tab and then select the Flip parameter, as arrowed
    in Figure 11.10.


