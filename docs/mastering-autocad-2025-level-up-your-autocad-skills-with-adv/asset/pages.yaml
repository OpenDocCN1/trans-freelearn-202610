- pgno: 72
  md: 'Some of these **Layout** options with brief descriptions are listed as follows:


    +   - **New Layout**: This generates a new blank **Layout** tab, like clicking
    on the + symbol next to the **Model** and **Layout** tabs.

    +   - **From Template...**: This allows you to insert a layout into the existing
    drawing from a drawing template file (*DWT*).

    +   - **Delete**: This does exactly what it says. It allows for the deletion of
    a **Layout** tab.

    +   - **Rename**: **Layout** tabs can be renamed for easy identification and context.
    This option highlights the tab text, allowing for renaming, similar to Microsoft
    Excel worksheets.

    +   - **Move or Copy...**: Layouts can be moved along the tab display or copied
    to be renamed/reused. This option opens a dialog box to expedite a move or a copy
    of a **Layout** tab.

    +   - **Select All Layouts**: It is sometimes required to select all **Layout**
    tabs to publish them all (see **Publish Selected Layouts...** in Figure 3.10).
    You would use this option after all **Layout** tabs have been selected).

    +   - **Activate Model Tab**: This is a simple switch toggle to allow you to make
    the **Model** tab active.

    +   - **Export Layout to Model...**: There will be times when the **Layout** tab
    content may need to be taken into the **Model** tab. This option expedites this
    quickly with one click from the shortcut menu.


    > **Tips and tricks #6**

    > Being a seasoned AutoCAD user, you (more than likely) already have a daily methodology
    when working with the **Model** and **Layout** tabs. The preceding options provide
    a more context-related approach, utilizing the enhanced hamburger icon and right-clicking
    shortcut menus available in AutoCAD 2025. They save a few mouse clicks, and when
    used repetitively daily, they will save you time in the longer term. The only
    way to find out is to try them!


    If you remember to perform all of your design work in the **Model** tab, and ensure
    that **Layout** tabs are used to present those designs only, you are on the right
    track. Try to maintain that in all of your drawing work to keep your AutoCAD drawings
    organised and professional.'
  merge: -1
  img_proc: true
