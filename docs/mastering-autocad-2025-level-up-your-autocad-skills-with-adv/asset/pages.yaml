  md: '9. Make sure to save the drawing back to the cloud with the edited trace text.
    Use the Save icon on the QAT, as shown in Figure 16.37.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_442_0.png)


    Figure 16.37: Using the Save icon to save the DWG back to the cloud


    10. You have now edited the trace text and saved the drawing back to the cloud.
    Should the drawing be opened in either AutoCAD Web or the AutoCAD mobile application,
    those text changes will now apply.


    # AutoCAD for Mac


    As mentioned in previous chapters, the AutoCAD Web & Mobile folder and the OPENFROMWEBMOBILE
    and SAVETOWEBMOBILE commands are not available when using AutoCAD for Mac. However,
    you can still collaborate using other cloud-based, proprietary solutions such
    as Microsoft OneDrive. OneDrive is supported by AutoCAD Web and the AutoCAD mobile
    application, so when working on the AutoCAD desktop in AutoCAD for Mac, you would
    save your file to your chosen cloud-based location in OneDrive and then connect
    to it using AutoCAD Web or the AutoCAD mobile application by using the appropriate
    login credentials for your chosen cloud-based location.


    In this section, you learned how to review traces in cloud-based DWG files in
    the AutoCAD desktop app after trace changes had been saved through AutoCAD Web
    and the AutoCAD mobile application. You can now understand the benefits of not
    only saving drawings to the cloud but also using AutoCAD Web and the AutoCAD mobile
    application when it comes to collaborating on DWG files. Let’s recap what we have
    learned in the chapter now!'
  merge: -1
  img_proc: true
- pgno: 443
  md: '# Summary


    You can learn more about working on a simple project with AutoCAD Web on the official
    AutoCAD blog:


    ```

    https://www.autodesk.com/blogs/autocad/tackling-a-new-workshop-build-with-autocad-web/

    ```


    You can also learn more about AutoCAD Web on the Autodesk website:


    ```

    https://help.autodesk.com/view/ACD/2022/ENU/?guid=GUID-B4A46563-E5CA-4A34-918C-78ADEA2FEEB4

    ```


    There is also more information about the AutoCAD mobile application at https://help.autodesk.com/view/ACD/2022/ENU/?guid=GUID-20A8F96D-0ACA-49F6-A6FF-D7DD71A8D03A.
    In this chapter, you learned how to add new traces in the AutoCAD desktop app.
    In doing so, you learned how to use the Trace tool to add a trace to an AutoCAD
    DWG file and make it ready for collaboration using the cloud for drawing storage.


    You learned how to use the Trace tool in the AutoCAD mobile application, adding
    and editing traces using a smart mobile device like an iPad Pro, as well as learning
    how to use the Trace tool in AutoCAD Web, adding and editing traces using AutoCAD
    Web in a web browser.


    You also learned how to review and edit existing trace information using the Trace
    tool in the AutoCAD desktop app, editing the trace text previously edited in the
    AutoCAD mobile application and AutoCAD Web.


    Traces in AutoCAD provide a seamless, real-time collaboration experience when
    working with all iterations of AutoCAD, whether that be the desktop app, web app,
    or mobile application. This expands the user interface to not just the desktop
    but also a browser or a smart mobile device, making your DWG files completely
    mobile and easily accessible at any time. All changes can be updated and collaborated
    upon in real time using the trace functionality as well.


    This chapter concludes the book, and you should now have gained an incredible
    amount of knowledge to enhance and improve your daily AutoCAD processes and workflows.


    Happy AutoCAD-ing!'
  merge: -1
  img_proc: true
