- pgno: 165
  md: '# Developing Annotative Annotation Styles


    AutoCAD is used to draft, draw, and create your designs. With that comes a need
    to communicate your design intent. A builder, for example, needs to know how big
    the building is that needs to be built. The factory needs to know how big the
    item is that needs to be manufactured. This is where AutoCAD’s highly versatile
    and comprehensive annotation tools come in handy.


    Not only do these annotation tools allow you to add annotation text and dimensions
    to your drawings but they can also be made annotative, working with annotation
    scales that represent the annotation at the appropriate scales when using scaled
    viewports in your layout tabs.


    Annotating effectively allows users to communicate their design intent accurately.
    Much time in AutoCAD is spent annotating designs, and annotation styles must be
    set appropriately.


    This chapter covers the following methodologies you will need to learn to use
    annotative annotation in your DWG files:


    +   - Creating text styles to manage text sizes and fonts

    +   - Managing dimension annotation with dimension styles

    +   - Setting up specific leader styles

    +   - Working with accurate table styles


    In previous chapters, you looked at how you could develop advanced geometry using
    AutoCAD’s drafting tools. In this chapter, you will create annotation styles to
    assist you in communicating your design intent accurately and effectively.'
  merge: -1
  img_proc: true
- pgno: 166
  md: '# Exercise file


    You must ensure you have downloaded the New Office Proposal.dwg exercise file
    to follow the sections in this chapter.


    # Creating text styles to manage text sizes and fonts


    Text is fundamental in an AutoCAD drawing. You need text to add labels to describe
    and annotate objects and areas in a design, as well as provide numerical values,
    such as the number of instances of objects (for example, doors), and use dimension
    text to add values to important dimensions. This section will look at how you
    can use text styles to manage text sizes and fonts and use annotative text scaling
    in your drawings.


    You can have as many text styles as you like in an AutoCAD DWG file, but what
    is more important is the naming philosophy of those text styles. It is no use
    having text styles called Shaun1, Shaun2, and so on. The text styles need a naming
    philosophy that means something to everyone using the AutoCAD DWG file. Even if
    you’re working alone, it’s a good practice to name your styles such that they
    are identifiable in terms of their attributes. Having this system in place will
    be helpful in your AutoCAD projects in the long run.


    Annotative text styles allow you to specify the paper space height of text annotation
    in the Layout tab, regardless of the scale of the viewport in which it is displayed.
    For example, if you use an annotative paper space height of 2.5 mm in a viewport
    of 1:100, the height of the actual text in the Model tab will be 250 mm. Providing
    an annotation scale of 1:100 is used when placing the annotative text in the Model
    tab, the annotative text will display correctly in the Layout tab viewport.


    Using the file that accompanies this chapter, you will now learn how to define
    text styles. Open the exercise file, New Office Proposal.dwg. It will be in the
    Model tab when it opens, displaying a simple office floor plan without annotation.
    Your first step is to define text styles that are needed in the drawing. If you
    wish, you can develop more text styles once you have completed the exercise in
    this section. For now, let’s jump into the file:


    +   1. To create new text styles, you need to access the Text Style dialog box.
    You can do this in two ways. The first is from the Home tab/Annotation panel,
    as shown in Figure 7.1.'
  merge: -1
  img_proc: true
