- pgno: 192
  md: 'Leader styles are incredibly useful in your drawings. Leaders allow you to
    highlight specific areas of interest in a drawing that need further description
    and allow you to keep any descriptive text or symbology away from the objects
    that make up your design, providing clarity and making the drawing easy to read
    and understand.


    In this section, you learned how to create and implement multileader styles. Both
    dimension and multileader styles allow you to annotate your designs, communicating
    design intent. In the next section, you will dive into another important feature
    of AutoCAD.


    # Working with accurate table styles


    AutoCAD also allows you to tabulate data from your drawings in tables. These tables
    can be defined using table styles in the same way as dimension styles and multileader
    styles and provide tabulated annotation for effective design data communication.


    You should still have the exercise file, `New Office Proposal.dwg`, open. Using
    this file, you will create a new, simple table style for room areas. The steps
    to do so are as follows:


    +   1. To create new table styles, you need to access the **Table Style** dialog
    box. You can do this in two ways. The first is from the **Home** tab/**Annotation**
    panel, as shown in *Figure 7.30*.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_192_0.png)


    Figure 7.30: Expanding the Annotation panel on the Home tab and then clicking
    on the Table Style icon'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'You can also use the Annotate tab/Tables panel, as shown in Figure 7.31. Each
    method differs slightly, but you end up in the same dialog box.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_193_0.png)


    Figure 7.31: Clicking on the arrow icon on the Tables panel title bar in the Annotate
    tab on the ribbon


    +   2. When creating the dimension and/or multileader styles, you can set various
    style properties to ByLayer. Create a new layer called Tables and set it to Gray
    as a color (Color 8). Set it as the current layer, and when you set any table
    style properties to ByLayer, they will display on the Tables layer in any previews.


    +   3. Using either method to access table styles, you will end up with the Table
    Style dialog box being displayed, as shown in Figure 7.32.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_193_1.png)


    Figure 7.32: The Table Style dialog box'
  merge: -1
  img_proc: true
- pgno: 194
  md: '+   4. Click on New....


    +   5. In the Create New Table Style dialog box, add a new table style name, Training.
    Set Start With to Standard (the default table style), as shown in Figure 7.33.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_194_0.png)


    Figure 7.33: The Create New table Style dialog box


    +   6. Click on Continue.


    The New Table Style dialog box is displayed, as shown in Figure 7.34. Notice you
    can select an existing table style to start with (arrowed). This allows you to
    select an existing table in your drawing and use its table style as a template.


    +   7. Make sure that Table direction is set to Down. This ensures that the Title
    and Header fields are at the top of the table. If it was set to Up, they would
    appear at the bottom of the table.


    +   8. You will be creating a new table style from scratch, so make sure you have
    Cell styles (top-right) set to Title in the drop-down menu.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_194_1.png)


    Figure 7.34: The New Table Style dialog box'
  merge: -1
  img_proc: true
- pgno: 195
