- pgno: 116
  md: '# Technical requirements


    To use AutoCAD, you’ll need to have an AutoCAD license installed either on your
    desktop computer or your laptop. You’ll also require the following:


    +   - A subscription (license) to AutoCAD. This will need to be the *FULL* version
    of AutoCAD, not AutoCAD LT. Ideally, this will be the latest version of AutoCAD,
    which is *AutoCAD 2025* at the time of writing. You can use earlier versions,
    but it’s suggested that you go no further back than *AutoCAD 2022*.

    +   - To use AutoCAD with a subscription, you’ll need an Autodesk account. If
    you don’t have one, you can set one up at https://accounts.autodesk.com/.

    +   - This book covers AutoCAD 2025, running on the Microsoft Windows **operating
    system (OS)**. All images and graphics are from AutoCAD 2025 and the *Windows
    11 OS*.


    This book contains instructions for both Windows and Mac users. While comprehensive
    instructions have been provided for Windows users, special instructions relating
    to deviations in the Mac interface have also been provided within callout boxes.


    # Exercise files


    You’ll need to make sure you’ve downloaded the exercise file, `BearingCase.dwg`,
    to complete this chapter.


    # Measuring angles accurately with Polar Tracking (POLAR)


    Before working with **Polar Tracking** (*POLAR*), you’ll need to make sure it’s
    available on the AutoCAD status bar. Follow these steps to do so:


    +   1. Click on the **Customization** (*hamburger*) icon and select **Polar Tracking**.
    A check mark will appear next to it.

    +   2. Click on the **Customization** icon again to close the menu.

    +   3. You’ll now see the **Polar Tracking** icon on the status bar. Ensure that
    it’s blue, indicating it’s been switched on.


    *Figure 5.1 shows the **Polar Tracking** icon once it’s been switched on:*


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_116_0.png)


    Figure 5.1: The AutoCAD status bar with Polar Tracking displayed and switched
    on'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'Why do you need **Polar Tracking**? It allows you to work with preset angle
    increments and add individual angle increments on an as-needed basis.


    Now, let''s explore some properties of this feature. You''ll notice that the **Polar
    Tracking** icon on the status bar has a flyout menu arrow to the right of it.
    If you click on this arrow, the flyout menu will display the different preset
    angle increments that can be used. *Figure 5.2 shows this flyout menu:*


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_117_0.png)


    This flyout menu displays the preset angle increments that can be used. These
    include increments of 90 degrees (*default*), 45 degrees, and 30 degrees, all
    the way down to 5-degree increments. To view more properties, you can click on
    **Tracking Settings**. This will open the **Drafting Settings** dialog box with
    the **Polar Tracking** tab currently open. *Figure 5.3 shows this dialog box:*'
  merge: -1
  img_proc: true
- pgno: 118
  md: '![](img/e5541e806f2ef46a4958b6c3d0b346a9_118_0.png)


    # Figure 5.3: The Drafting Settings dialog box with the Polar Tracking tab currently
    open


    In this dialog box, the Polar Tracking On checkbox is checked, indicating that
    Polar Tracking (POLAR) is currently on (the icon will also be highlighted blue
    on the status bar). The preset angle increments can also be updated in the dialog
    box, not just selected on the flyout on the status bar. You can do this by using
    the drop-down menu showing 90 degrees (highlighted by the arrow).


    If the Additional angles checkbox is checked, you can add individual angle increments
    by clicking on the New button. To remove any unwanted individual angle increments,
    use the Delete button. Unchecking the Additional angles box will turn off any
    additional angles that were added previously.


    Now, let''s try out Polar Tracking with the BearingCase .dwg exercise file, which
    is a 2D drawing of a small bearing case that requires manufacturing. Using a clear
    area in the file, draw the symmetrical bearing plate outline shown in Figure 5.4.
    The completed bearing plate outline is included in the exercise file for reference:'
  merge: -1
  img_proc: true
- pgno: 119
  md: '![](img/e5541e806f2ef46a4958b6c3d0b346a9_119_0.png)


    Figure 5.4: The new bearing plate with distances, angles, and centerlines shown
    for clarity


    Draw the outline in the Model tab while using the Polar Tracking preset’s angle
    increments. Use the 90-degree, 45-degree, and 15-degree angle increment settings.
    You can draw the outline as lines or as a polyline. Once you’ve done this, make
    sure you save your drawing. You can save it with the same filename or use a different
    filename if you want to differentiate it from the original exercise file.


    Polar Tracking allows you to automate the angles at which you draw your AutoCAD
    geometry, thus saving you from having to input the angles manually. Not only does
    this enhance your productivity, but it also maintains accuracy and reduces errors.


    > Tips and tricks #15

    > When working with Polar Tracking (POLAR) in AutoCAD, the drafting settings on
    the status bar can be changed at any time, even mid-command. When drawing the
    outline shown in Figure 5.4, try to create the outline in one pass, changing the
    polar angle increments on the status bar when needed while using the Line (LINE)
    or Polyline (PLINE) command.


    Polar Tracking is a great method to use to automate regularly used angles when
    drafting and modeling. Make sure it becomes part of your daily workflow when you’re
    designing in AutoCAD.


    > AutoCAD for Mac

    > You’ll find Polar Tracking (POLAR) on the status bar in AutoCAD for Mac. It
    can be used in the same way as in AutoCAD for Windows.


    Now that we know how to get accurate angles with Polar Tracking, let’s look at
    achieving orthogonal movements using AutoCAD’s ORTHOMODE.'
  merge: -1
  img_proc: true
- pgno: 120
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 121
  md: "The lengths of the sides of the plate are shown purely for clarity. Just like\
    \ the new bearing plate shown in *Figure 5.4*, try to draw the plate outline in\
    \ one go, using either the **Line (LINE)** or **Polyline (PLINE)** command.\n\n\
    Start at the bottom-left corner of the plate, indicated by the circle, and go\
    \ in the direction of the arrow, typing in each distance and pressing *Enter*\
    \ before moving in the direction of the next line segment. You can also use the\
    \ **Close** right-click shortcut menu option to close the line (or polyline) to\
    \ the point you started from.\n\nAs you draw the plate outline with **ORTHOMODE**\
    \ on, you’ll notice that as you move your mouse to draw the line segments, you\
    \ can only move the cursor horizontally and vertically, thus negating the need\
    \ to consider any angle increments. This saves a considerable amount of time when\
    \ you’re drawing regular geometry such as this.\n\nThere will be times when exact\
    \ horizontal and vertical lines will be needed. A typical example would be gridlines\
    \ on a floor plan, or as in this section, where perpendicular lines are needed\
    \ for a plate outline. Using **ORTHOMODE** ensures that all the lines are at 90\
    \ degrees to each other, hence they’re perpendicular.\n\n> **Tips and tricks #16**\n\
    > \n> When drawing lines using the **LINE** command, or polylines using the **PLINE**\
    \ command, there’s a neat little workaround you can use if you place a line or\
    \ polyline segment incorrectly. Simply right-click to bring up the shortcut menu\
    \ and click **Undo** via the shortcut menu. Note that this won’t undo the entire\
    \ command – it will simply undo the last line (or last polyline) segment that\
    \ was placed, taking you back to the last point of the last segment. It’s also\
    \ a great way of getting back to a particular point in the line (or polyline)\
    \ when used multiple times.\n\nConsider using **Ortho Mode (ORTHO)** if you have\
    \ to draft a lot of lines and geometry that are perpendicular (at 90 degrees)\
    \ to each other. Due to the way that **Ortho Mode (ORTHO)** constrains you to\
    \ the X and Y axes, it’s a great tool for this.\n\n> **AutoCAD for Mac**\n> \n\
    > You’ll find **Ortho Mode (ORTHO)** on the status bar in AutoCAD for Mac. It\
    \ can be used in the same way as in AutoCAD for Windows, to restrict the cursor\
    \ orthogonally.\n\nNow that we’ve discovered the benefits of using **ORTHOMODE**,\
    \ let’s look at how we can work with multiple Osnaps using **Object Snap Tracking\
    \ (AUTOSNAP)**."
  merge: -1
  img_proc: true
- pgno: 122
  md: '# Using Object Snap Tracking (AUTOSNAP) to draw efficiently with multiple Osnaps


    Numerous AutoCAD drafting settings make your daily routine simpler. **Object Snap
    Tracking** *(AUTOSNAP)* is one of those drafting settings; you''ll find that once
    you''ve turned **AUTOSNAP** on and used it, you''ll never turn it off again.


    This drafting setting uses an in-built AutoCAD technology known as **AutoTrack**
    that tracks which Osnaps you select before combining them and forming a datum
    point, such as a center, midpoint, or intersection.


    When combined with **Object Snaps** *(OSNAP)* and **Polar Tracking** *(POLAR)*,
    **AUTOSNAP** allows you to work with multiple snap points on AutoCAD geometry,
    giving you the ability to create insertion points and intersection points without
    the need to generate unnecessary construction lines.


    *Figure 5.7 shows where you can find the **AUTOSNAP** icon on the status bar.
    The icon acts simply as an ON/OFF toggle. However, you need to ensure that your
    running **Object Snaps** *(OSNAP)* are defined and switched on; otherwise, **AUTOSNAP**
    will be null and void:*


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_122_0.png)


    Figure 5.7: The status bar with Object Snap Tracking (AUTOSNAP) switched on (arrowed
    for clarity)


    Working with the drawing you used in the previous section, BearingCase.dwg, let''s
    learn how to utilize **Object Snap Tracking** *(AUTOSNAP)* so that you can place
    new geometry in the bearing case that was already in the drawing when you originally
    opened the DWG file, as shown in Figure 5.8.


    Use **ZOOM** and **PAN** to centralize the bearing case in the AutoCAD drawing
    area to make it easier to work on the geometry:


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_122_1.png)


    Figure 5.8 – The bearing case, as displayed in the BearingCase.dwg file'
  merge: -1
  img_proc: true
- pgno: 123
  md: 'Make sure that you have the following drafting settings switched on:


    +   - **Object Snaps** (*OSNAP*)

    +   - **Polar Tracking** (*POLAR*)

    +   - **Object Snap Tracking** (*AUTOSNAP*)


    You''ll need the following Osnaps switched on:


    +   - **Endpoint**

    +   - **Midpoint**

    +   - **Intersection**

    +   - **Center**


    You''ll also need to have applied the following polar angle increment: 90, 180,
    270, 360...


    For this exercise, you''ll be placing two circles inside the bearing case outline
    to represent two drilled holes. *Figure 5.9* shows how the drawing will look once
    the two circles have been placed:


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_123_0.png)


    Figure 5.9: The bearing case with the new circles (arrowed and bold for clarity)'
  merge: -1
  img_proc: true
- pgno: 124
  md: 'Let''s begin this exercise:


    +   1. Select the **Circle** flyout on the **Draw** panel on the **Home** tab
    on the ribbon to draw the new circles.

    +   2. Then, select **Center, Radius**. AutoCAD will prompt you for the center
    of the circle to be drawn. It''s at this point in the workflow that we''ll be
    using **Object Snap Tracking** (*AUTOSNAP*).

    +   3. Using the settings described previously, hover over the **Midpoint** Osnap
    of the left-hand outside edge of the bearing case in the drawing.

    +   However, *don''t click* on it; simply hover over it for a few seconds. You''ll
    see a small cross symbol appear *inside* the snap symbol. That''s **Object Snap
    Tracking** memorizing the **Midpoint** Osnap.

    +   4. Then, drag your mouse to the right. You''ll see the green, dashed tracking
    line. *Figure 5.10* shows what this will look like onscreen:


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_124_0.png)


    Figure 5.10: The Midpoint Osnap being used as an Object Snap Tracking point (arrowed
    for clarity)


    As you drag your mouse over the blue, vertical centerline to the right of the
    **Midpoint** Osnap, you''ll see an **Intersection** Osnap appear. This is **Object
    Snap Tracking** picking up the intersection at a 90-degree increment concerning
    the **Midpoint** Osnap you hovered over. *Figure 5.11* shows the **Intersection**
    Osnap:'
  merge: -1
  img_proc: true
- pgno: 125
  md: 'Figure 5.11: The Intersection Osnap aligned with the Midpoint Osnap (arrowed
    for clarity)


    5. Click on the Intersection Osnap – that’s where your circle center will now
    be placed. You’ll be prompted for a circle radius. Type 10 for the radius value
    and press Enter. The circle will now be placed like so:


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_125_0.png)


    Figure 5.12: The circle placed after using Object Snap Tracking (AUTOSNAP)


    6. Using the Midpoint Osnap on the right-hand outside edge of the bearing case,
    repeat this workflow, but drag to the left toward the right-hand, blue, vertical
    centerline (in the opposite direction to the previous example). This will give
    you the same result that was shown in Figure 5.9 but on the other (right) side
    of the bearing case.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_125_1.png)'
  merge: -1
  img_proc: true
- pgno: 126
  md: 'Just using this simple workflow, you can now see the advantages of **Object
    Snap Tracking** (*AUTOSNAP*). If this wasn’t available in AutoCAD, you would have
    needed to draw sacrificial construction lines to place the **Intersection** Osnaps
    needed to place the new circles.


    *AUTOSNAP* is a great efficiency tool, negating the need to draw numerous construction
    lines to obtain the necessary data and snap points. It also removes the need to
    draw unnecessary geometry that might have to be erased later.


    > **Tips and tricks #17**

    > **Object Snap Tracking** (*AUTOSNAP*) allows you to use up to seven tracking
    points in any one reference. This can be any sensible combination of Osnaps or
    temporary tracking points. When selecting tracking points, no mouse click is required.
    Simply hover over the point required until the relevant Osnap description appears,
    but *don’t click!* As you hover, AutoCAD will recognize the point as a tracking
    point and add it to your possible seven points. We’re all taught to move our mouse
    and click when necessary. When using *AUTOSNAP*, you don’t need to click!


    Make sure you use **Object Snap Tracking** (*AUTOSNAP*) combined with your running
    Osnaps. That way, you can ensure that you’re taking full advantage of the functionality
    that **Object Snap Tracking** (*AUTOSNAP*) provides.


    > **AutoCAD for Mac**

    > You’ll find **Object Snap Tracking** (*AUTOSNAP*) on the status bar in AutoCAD
    for Mac. It can be used in the same way as it can in AutoCAD for Windows when
    working with **Object Snaps** (*OSNAP*) and **Polar Tracking** (*POLAR*).


    **Object Snap Tracking** (*AUTOSNAP*) is a great way to utilize Osnaps. In the
    next section, we’ll learn how to utilize not only our **Object Snaps** (*OSNAP*)
    but also how to work with **Snap Overrides**.


    # Drawing accurately and effectively with Object Snaps (OSNAP) and snap overrides


    **Object Snaps** (*OSNAP*) were mentioned in the *Utilizing 3D object snaps when
    3D modeling* section in *Chapter 4*, and they’re a fundamental function of AutoCAD,
    making sure that all drafting in 2D and modeling in 3D is performed with accuracy
    and precision.


    You should now be used to the regularly used Osnaps such as **Endpoint**, **Midpoint**,
    and **Center**. Other typical Osnaps that are used include **Intersection** and
    **Extension**. If you’re not familiar with these, you can use the AutoCAD Help
    function or take a look at the *Hitchhikers Guide to AutoCAD* (also part of the
    AutoCAD Help function – it can be found in AutoCAD’s **Start** tab).'
  merge: -1
  img_proc: true
- pgno: 127
  md: 'In this section, we’ll look at some of the lesser-used Osnaps that can help
    you become more efficient and productive. We’ll also continue to work with the
    BearingCase.dwg file that you used in the previous sections of this chapter.


    All of your Osnaps can be accessed via the AutoCAD status bar, which is located
    at the bottom right of the AutoCAD application window. You can also type OSNAP,
    and press Enter. This will open the Drafting Settings dialog box of the Object
    Snaps tab.


    Object Snaps (OSNAP) is an AutoCAD drafting setting and is normally displayed
    on the status bar by default. The icon is normally switched on (blue), with the
    Endpoint and Center Osnaps set as running Osnaps.


    Running Osnaps are snaps that are switched on and always available when drafting.
    Osnap overrides are the snaps that haven’t been switched on but can be used when
    you’re overriding the running Osnaps. We’ll learn more about Snap Overrides later
    in this section.


    The OSNAP drafting setting is displayed on the status bar, as shown in Figure
    5.13:


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_127_0.png)


    Figure 5.13: The flyout Object Snaps (OSNAP) menu on the status bar, displayed
    after clicking on the Osnap icon (arrowed)'
  merge: -1
  img_proc: true
- pgno: 128
  md: "The preceding figure also displays the flyout menu that’s available when clicking\
    \ on the flyout arrow to the right of the **OSNAP** icon on the status bar. This\
    \ menu displays the currently running Osnaps, all shown with check marks. A check\
    \ mark indicates that the Osnap is on. A non-checked Osnap is off.\n\n> **Tips\
    \ and tricks #18**\n> \n> You can also select **Object Snap Settings…** from the\
    \ flyout menu. This will display the **Drafting Settings** dialog box, with the\
    \ **Object Snap** tab currently open. In this tab, you can clear all existing\
    \ running Osnaps and select *ALL* Osnaps as running Osnaps. However, doing this\
    \ isn’t recommended because you then have no geometry snaps to snap to, leading\
    \ to drafting inaccuracies. You can also turn **Object Snaps** on and off from\
    \ this dialog box, as well as **Object Snap Tracking**.\n\n**Object Snaps** (*OSNAP*)\
    \ are fundamental to accurate and precise drafting and modeling. Make sure you\
    \ use them when you’re creating your designs.\n\n> **AutoCAD for Mac**\n> \n>\
    \ You’ll find **Object Snaps** (*OSNAP*) on the status bar in AutoCAD for Mac.\
    \ It can be used in the same way as in AutoCAD for Windows, including selecting\
    \ **Settings…** to display the **Drafting Settings** dialog box with the **Object\
    \ Snap** tab displayed.\n\nA good set of running Osnaps is **Endpoint, Midpoint,\
    \ Center, Intersection,** and **Extension**. It’s advisable not to select all\
    \ of them as running Osnaps as this becomes unworkable; AutoCAD will try and snap\
    \ to every Osnap available.\n\nThe set of running Osnaps shown checked in *Figure\
    \ 5.13* should have you in good stead for most of your drafting and modeling tasks.\
    \ However, there may be times when alternative Osnaps might need to be running.\
    \ For example, a circle has various Osnaps. The most obvious is **Center**, but\
    \ you might also use the **Quadrant** Osnap or the **Tangent** Osnap when working\
    \ with circle geometry.\n\n# Finding the Geometric Center\n\nOne of the alternative\
    \ Osnaps that can be incredibly useful is a newer snap known as **Geometric Center**.\
    \ In the same way that the **Center** Osnap snaps to the center of an arc or a\
    \ circle, **Geometric Center** snaps to the geometric center of a closed geometric\
    \ shape, such as a closed polyline.\n\nIn this section, you’ll convert the existing\
    \ geometry of a bearing case into a closed polyline and find the **Geometric Center**\
    \ Osnap. Then, you’ll use the located **Geometric Center** to place a circle."
  merge: -1
  img_proc: true
- pgno: 129
  md: 'To do this, you''ll need the exercise file, BearingCase .dwg, the external
    outline of which is made up of individual lines and an arc. Follow these steps
    to find the Geometric Center Osnap:


    +   1. Type PE. You''ll see PE (EDIT) in the Dynamic Input suggestion menu. Click
    on it; the Select polyline or prompt will appear.

    +   2. Select the arc on the outline of the bearing case, as shown in Figure 5.14:


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_129_0.png)


    Figure 5.14: The selected arc with the relevant AutoCAD prompt displayed


    You''ll receive a prompt stating Do you want to turn it into one? <Y>.


    +   3. Press Enter when the default Y option is highlighted. This confirms that
    you want the selected arc to be converted into a polyline segment. Typing N and
    pressing Enter will stop the arc from being converted into a polyline segment.
    The Edit Polyline (PEDIT) menu will appear, as shown in Figure 5.15:


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_129_1.png)


    Figure 5.15: The Edit Polyline menu with Join highlighted and arrowed'
  merge: -1
  img_proc: true
- pgno: 130
  md: '4. Select **Join** from the flyout menu and select all the remaining elements
    that form the bearing case outline. Figure 5.16 shows all the selected elements,
    which AutoCAD highlights in blue.


    Note that at this point, you can re-select the arc you originally selected earlier.
    It won’t affect the **Edit Polyline** (*PEDIT*) command’s workflow:


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_130_0.png)


    Figure 5.16: The selected elements (arrowed) to be joined into a polyline using
    the Edit Polyline (PEDIT) command


    5. Press *Enter*. You’ll be returned to the menu.


    6. Press *Enter* again to close the **Edit Polyline** (*PEDIT*) command.

    The external boundary of the bearing case is now a closed polyline.


    7. Click on it to select it. You’ll see that it’s now one closed object with blue
    AutoCAD grips, as shown in Figure 5.17:'
  merge: -1
  img_proc: true
- pgno: 131
  md: '![](img/e5541e806f2ef46a4958b6c3d0b346a9_131_0.png)


    Figure 5.17: The selected polyline with grips displayed


    +   8. Click on the Object Snaps flyout menu on the status bar, as shown in Figure
    5.13.


    +   9. From the menu, click Geometric Center. You''ll see a check mark appear
    next to it. It''s now a running Osnap.


    +   10. Select the Circle, Radius command from the Circle flyout menu of the Draw
    panel on the Home tab on the ribbon. You''ll be prompted for the center of the
    circle.


    +   11. Hover your cursor/crosshair over any part of the newly created outside
    polyline. Ignoring the other Osnaps, you''ll see a small asterisk-like symbol
    (*) toward the center of the bearing case, as shown (arrowed) in Figure 5.18.


    This is the Geometric Center Osnap:


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_131_1.png)


    Figure 5.18: The Geometric Center Osnap (arrowed) of the bearing case outline
    polyline'
  merge: -1
  img_proc: true
- pgno: 132
  md: '+   12. Move the cursor/crosshair over the Osnap (it will be highlighted with
    a green circle) and click. This will now be the center of your circle.

    +   13. Type 15 as the radius value and press Enter. You''ll see your new circle
    appear, as shown in Figure 5.19:


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_132_0.png)


    Figure 5.19: The new circle (arrowed) placed with the Geometric Center Osnap


    In closed polylines, such as a rectangle or a square, we can use the Midpoint
    Osnaps of opposing sides to find the geometric center. However, this method may
    not work in irregular shapes, such as the bearing case outline. This is why using
    the geometric center is an extremely accurate method of finding the exact center
    of a shape that might not conform to the usual constraints.


    # Working with Snap Overrides


    Sometimes, you don''t want to set an Osnap as a running Osnap. This is where your
    Osnap overrides become useful. Known as Osnap Overrides, you can use it to override
    the running Osnaps to utilize just one specific Osnap for one-off usage.


    Osnap Overrides allows you to use Osnaps that aren''t currently set in the Osnaps
    drafting setting. You can always gain access to Osnap Overrides without a command
    running. You can do this by holding down the Shift key and right-clicking. This
    will bring up the Osnap Overrides menu at any time. Note that it''s more useful
    if this is performed in a command workflow as you then have access to Snap Overrides
    within the command you''re working in. Figure 5.20 shows the Osnap Overrides menu
    when accessed with the Shift and right-click method:'
  merge: -1
  img_proc: true
- pgno: 133
  md: '![](img/e5541e806f2ef46a4958b6c3d0b346a9_133_0.png)


    Figure 5.20: The Osnap Overrides menu displayed when using Shift and right-click


    Note that in Figure 5.20, you can still gain access to the Drafting Settings dialog
    box by clicking on Osnap Settings... (arrowed). This will open the dialog box
    with the Object Snap tab currently displayed, in the same way as when using the
    Object Snaps flyout menu on the status bar.


    Several alternative Osnaps are incredibly useful, especially when used in a command
    workflow. To explore Osnaps further, take a look at the Autodesk website: https://help.autodesk.com/view/ACD/2023/ENU/?guid=GUID-8F5E5431-9EFB-414E-BC6D-2C65EFB2DAC3.


    We’re going to look at one of the alternative Osnaps, called Mid Between 2 Points
    (M2P). This snap function is highlighted with an arrow in Figure 5.20.'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'This snap allows you to specify two points on any geometry (or coordinates)
    and find the midpoint between them. We’ll be using this to create some new centerlines
    in the `BearingCase.dwg` file, so make sure you’re using the **Centerlines** layer
    as the current layer. Also, ensure that you have **Polar Tracking** (*POLAR*),
    and **Object Snap Tracking** (*AUTOSNAP*) switched on. They should be displayed
    in blue on the status bar.


    To create new centerlines, follow these steps:


    +   1. Zoom to the lower left corner of the bearing case outline. Select the **Line**
    command from the **Draw** panel of the **Home** tab on the ribbon. You’ll be prompted
    for the first point of the line.

    +   2. At this point, hold down the **Shift** key and right-click. The **Osnap
    Overrides** menu will appear.

    +   3. Click **Mid Between 2 Points**. You’ll be prompted to select **First point
    of mid**.

    +   4. Click on the **Endpoint** Osnap shown in *Figure 5.21*. This will be the
    first midpoint:


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_134_0.png)


    Figure 5.21: The first midpoint is the Endpoint Osnap shown (arrowed)'
  merge: -1
  img_proc: true
- pgno: 135
  md: '5. Then, click on the Endpoint Osnap shown in Figure 5.22. This will be the
    second midpoint:


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_135_0.png)


    Figure 5.22: The second midpoint is the Endpoint Osnap shown (arrowed)


    The first point of your new centerline will now be on the lower edge of the bearing
    case outline (point 1 in Figure 5.23), between the two midpoints that have been
    selected.'
  merge: -1
  img_proc: true
- pgno: 136
  md: '6. Drag your mouse and hover over the top endpoint of the existing centerline,
    shown as point 2 in *Figure 5.23*. This will activate **Object Snap Tracking**
    (AUTOSNAP) for that **Endpoint** Osnap:


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_136_0.png)


    Figure 5.23: The M2P Osnap override has placed the first point of the line (1).
    Hovering over the Endpoint Osnap of the existing centerline (2) creates an Object
    Snap Tracking point'
  merge: -1
  img_proc: true
- pgno: 137
  md: '+   7. Remember not to click on it, and then drag your mouse to the left, as
    shown in *Figure 5.24*:


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_137_0.png)


    Figure 5.24: Moving to the left (arrowed) to create the Object Snap Tracking point
    for the second point (endpoint) of the new centerline


    +   8. Click on the point indicated when the vertical and horizontal tracking
    lines intersect (shown as green dashed lines). This will be the endpoint of your
    centerline.


    +   9. Press *Enter* to close the **Line** command.


    At the end of this workflow, you''ll have a new centerline that''s the same length
    as the existing centerline, to the left of the existing centerline and circle,
    as shown in *Figure 5.25*.'
  merge: -1
  img_proc: true
- pgno: 138
  md: 'If you wish, you can now repeat this workflow on the right-hand side of the
    bearing case to create another new centerline. This would be great practice to
    reinforce how to utilize the Mid Between 2 Points (M2P) Osnap function:


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_138_0.png)


    Figure 5.25: The new centerline, placed using the M2P Osnap function


    # Tips and tricks #19


    You can also select Osnap Overrides from the right-click shortcut menu in the
    middle of a command. This is an alternative to the Shift and right-click method.
    Simply right-click mid-command and select Osnap Overrides from the shortcut menu.
    This will bring up the same menu you see when you use the Shift and right-click
    method. However, note that you can only bring this menu up after the first point
    (or base point) of the geometry has been placed. You’ll always need to use Shift
    and right-click for the first point (or base point).


    You’re now conversant with not only Osnaps in AutoCAD but also how to utilize
    Snap Overrides. This will make for highly accurate and more efficient drafting
    and modeling.'
  merge: -1
  img_proc: true
- pgno: 139
  md: '# # Summary


    In this chapter, we learned how to work with **Polar Tracking** (*POLAR*) and
    use it effectively when creating geometry and objects.


    You also learned how to utilize orthographic projection and draft straight and
    perpendicular geometry with the **ORTHOMODE** setting.


    Then, you learned about **Object Snap Tracking** (*AUTOSNAP*), an intuitive drafting
    tool that removes the need for sacrificial construction lines. When combined with
    both **Polar Tracking** (*POLAR*) and **Object Snaps** (*OSNAP*), it allows for
    highly accurate drafting and modeling.


    After, you learned how to use the **Geometric Center** Osnap, one of the lesser-used
    Osnaps, and draft effectively with it.


    Finally, you learned how to use a quick, on-the-fly method of snapping to existing
    geometry using **Osnap Overrides**.


    The Osnaps and settings demonstrated in this chapter unraveled how important they
    are when drafting in AutoCAD. They’re fundamental to the accuracy and precision
    of any geometry created to further your design.


    Osnaps allow you to work with your drafting tools in AutoCAD to their full advantage.
    And some Osnaps can be incredibly useful. **Geometric Center** and **Mid Between
    2 Points** (*M2P*) are just two of the lesser-known Osnaps that can make your
    daily AutoCAD work much easier to manage.


    In the next chapter, we’ll learn how to modify and measure geometry and existing
    objects in AutoCAD drawings by using commands such as **Quick Measure** and **Distance**.'
  merge: -1
  img_proc: true
