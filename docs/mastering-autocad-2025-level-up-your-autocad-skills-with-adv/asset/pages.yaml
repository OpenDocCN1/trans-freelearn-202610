- pgno: 222
  md: '15. You will now be prompted for two extension origin points. Use the **Endpoint**
    object snap and use the top-left and top-right points on the floor plan. You will
    then need to click a third time to place the dimension line. Figure 8.25 shows
    the two points to select on the plan and an approximate position of the dimension
    line. Your placed dimension should look similar to the one in Figure 8.25 when
    placed. After the third click, the **Linear** dimension command closes.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_222_0.png)


    Figure 8.25: The placed Linear dimension type with placement points arrowed


    16. Using the **Linear** dimension type, place a few more horizontal and vertical
    dimensions to get used to the dimension placement workflow. You should end up
    with a floor plan that looks something like Figure 8.26:


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_222_1.png)


    Figure 8.26: The floor plan with some more dimension annotation added'
