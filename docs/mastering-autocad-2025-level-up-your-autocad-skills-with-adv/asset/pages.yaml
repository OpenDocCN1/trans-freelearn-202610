- pgno: 231
  md: '# Part 3:

    Content Re-Use Including

    Dynamic Blocks


    Re-using design content in AutoCAD provides you with the flexibility to use similar
    content again and again. Working on a project that uses specific content that
    can be reused in another similar project saves valuable project time, reducing
    repetitive, onerous content creation. Re-using content from your DWG files also
    allows for the easy creation of content libraries using regular AutoCAD blocks
    and dynamic blocks that incorporate specific parameters and actions, allowing
    for easy manipulation of the dynamic blocks when working with them in your drawings.


    This part has the following chapters:


    +   - Chapter 9, Developing Block Libraries

    +   - Chapter 10, Working with Block Attributes

    +   - Chapter 11, Creating a Dynamic Block with Parameters and Actions

    +   - Chapter 12, Creating a Dynamic Block with Visibility States'
  merge: -1
  img_proc: true
- pgno: 232
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 233
  md: '# Developing Block Libraries


    Content reuse is essential when working with CAD teams on multiple projects. Blocks
    are an essential part of any project, and this chapter explains how block libraries
    can be created and shared within a CAD team. Using blocks means that you only
    need to create the object once (the block) and then reuse it by inserting it as
    another instance of it in your drawings.


    By the end of this chapter, you will be able to work with regular and dynamic
    blocks in drawings and create your own block libraries using various methods,
    including the Clipboard. You will also learn how to use the Blocks palette and
    utilize tool palettes with your blocks.


    This chapter covers the following methodologies you will need to work with AutoCAD
    blocks in your DWG files:


    +   - Bringing blocks and dynamic blocks into drawings

    +   - Utilizing the Clipboard to create a new block library drawing

    +   - Adding the blocks library to the Blocks palette

    +   - Creating a new block library tool palette


    Reusing drawing content and managing that content will save valuable drafting
    time, reducing the need for repetitive tasks, and allowing content sharing with
    your project stakeholders and team members.


    In this chapter, you will learn how to work with regular blocks and dynamic blocks
    and discover numerous methods to manage blocks in your drawings for your CAD team.


    # Exercise file


    You must ensure you have downloaded the exercise file, New Office Design.dwg to
    follow the sections in this chapter.'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# Bringing blocks and dynamic blocks into drawings


    **Blocks** are objects made up of multiple AutoCAD objects, such as lines, arcs,
    and circles. A typical AutoCAD block might be a door or a chair that must be used
    many times in a drawing, such as a floor plan.


    There are two types of blocks that can be used in AutoCAD: **regular blocks**
    and **dynamic blocks**. Regular blocks are one-off blocks that have a single use.
    Dynamic blocks can have specific parameters applied to them to recognize increments
    and iterations, such as a metric bolt of varying lengths or a door/window of varying
    shapes and sizes.


    Blocks are the best way to reuse content in any AutoCAD drawing, and they will
    form many of the essential elements of your design.


    When first created in a drawing, blocks remain saved in the drawing file they
    were created in, but they can also be set up in specific block library drawings
    that can then be put in a suitable location for not just you to use, but the rest
    of your CAD team. They can be stored locally on a hard drive, or a networked server.
    And with more use of the cloud, cloud-based block libraries can easily be set
    up and maintained.


    Open the exercise file, New Office Design.dwg. The drawing is a simple plan of
    an office layout where you will utilize the blocks in the drawing. You will be
    bringing blocks and dynamic blocks into the drawing to reuse design content, so
    you won’t need to re-draw and re-work AutoCAD objects. The drawing will be on
    the **Model** tab when it opens, displaying a simple office floor plan without
    annotation. Your first step is to bring a regular door block into the drawing.
    Zoom into the door opening and select the line and arc objects that make up the
    door, as shown in Figure 9.1.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_234_0.png)


    Figure 9.1: The door opening (with the line and arc selected)'
  merge: -1
  img_proc: true
- pgno: 235
  md: 'You will see that the door is made up of a line and an arc. To duplicate this
    door, you must copy both objects and ensure they are in the correct layer, leaving
    this workflow open to error, even for such a simple combination of two AutoCAD
    objects. Copying requires you to make sure you have selected all necessary objects
    to be copied. An AutoCAD block can just be reused over and over again, in the
    knowledge that all required objects form part of the block.


    The drawing already has a number of blocks saved in the DWG file. Some are regular
    blocks and some are dynamic blocks. In the next workflow, you will ensure that
    the correct layer is current and place a regular door block in place of the line
    and the arc objects.


    # Adding a regular door block


    You will first need to go to the Layer drop-down menu and select the Doors layer,
    as shown in Figure 9.2. You will find the drop-down menu on the Layers panel on
    the Home tab on the ribbon. Select the Doors layer to make it current.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_235_0.png)


    Figure 9.2: The Layer drop-down menu with the Doors layer current


    Now that the Doors layer is current, the following workflow will allow you to
    insert a regular block representing a door:


    +   1. Ensure you are on the Model tab in the exercise file (New Office Design.dwg)
    and zoomed into the door opening.'
  merge: -1
  img_proc: true
- pgno: 236
  md: '2. Ensure that the line and arc representing the existing door are selected.
    Then, using the Erase (ERASE) command, remove the line and the arc, to leave only
    the door opening in the wall. In this case, the right-click shortcut menu was
    used after the objects were selected, and Erase was selected on the shortcut menu,
    as shown in Figure 9.3.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_236_0.png)


    Figure 9.3: The original line and arc selected, ready to be removed using the
    Erase command in the shortcut menu


    When erasing objects in a drawing, it is often easier to select multiple objects
    and then use the Erase (ERASE) command once, rather than erase objects one-by-one.


    # Tips and tricks #28


    When you want to remove objects from your drawings, you use the Erase (ERASE)
    command. This can be expedited in several ways. You can use the Erase icon on
    the Modify panel on the Home tab on the ribbon, select the objects to be erased,
    and press Enter to confirm. You can also use the right-click shortcut menu once
    the objects to be erased are selected and select Erase (see Figure 9.3), or you
    can simply type ERASE and press Enter, select the objects to be erased, and press
    Enter again to confirm.'
  merge: -1
  img_proc: true
- pgno: 237
  md: 'The OOPS command is a undo function for the Erase (ERASE) command only. If
    you erase something and realise it was a mistake, type OOPS and press Enter. The
    last use of the Erase (ERASE) command will be undone. Be careful, though, because
    you may have replaced the erased object with another object, and it will be superimposed
    on top of the original object that was erased.


    # AutoCAD for Mac


    You can use methodologies such as Tips and tricks #28 in AutoCAD for Mac to erase
    AutoCAD objects in drawings.


    +   1. Make sure the drawing has been saved. Use the Save icon on the Quick Access
    Toolbar. Do this before selecting the Insert tab on the ribbon. This will ensure
    that the Door block is saved in the DWG file. Then, click on the Insert drop-down
    arrow, as shown in Figure 9.4. You will see available blocks in the drawing file,
    and there is a slider bar on the right to see further block content.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_237_0.png)


    Figure 9.4: The Insert drop-down menu displaying available blocks'
  merge: -1
  img_proc: true
- pgno: 238
  md: '2. Click on the Door block on the Insert drop-down menu, as indicated in Figure
    9.4. The Door block will appear on your cursor, and you will be prompted for an
    insertion point, as shown in Figure 9.5. Select the corner of the wall indicated
    by the arrow in Figure 9.5 using the Endpoint object snap.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_238_0.png)


    Figure 9.5: The Door block waiting on an insertion point


    3. The Door block will now be placed in the door opening, and note that it is
    one object, not two. It is now an instance of block reference in your drawing.
    Make sure to save the drawing at this point.


    You will see that the block now looks the same as the line and the arc that were
    previously there, and if you hover over the new door block, you will see the tooltip
    appear, letting you know that it is a Block reference on the Doors layer, as shown
    in Figure 9.6. Note that the block has adopted the current layer, Doors, as set
    previously.'
  merge: -1
  img_proc: true
- pgno: 239
  md: '![](img/e5541e806f2ef46a4958b6c3d0b346a9_239_0.png)


    Figure 9.6: The new Door block with tooltip arrowed


    You have now placed a regular **Door** block in your AutoCAD drawing.


    # ## Adding a dynamic Door block


    Having placed a regular **Door** block in our AutoCAD drawing, it’s time to move
    onto a dynamic **Door** block. Let’s see how we can do that here:


    +   1. In order to add a dynamic door block, you will now select the new **Door**
    block and remove it from the drawing. This may seem odd, as you have only just
    placed it, but you are now going to place a **DYNAMIC** block of a door to replace
    the regular block.

    +   2. Use the previous steps 1 and 2 to use the **Erase** command to remove the
    regular **Door** block, leaving the wall opening as before.'
  merge: -1
  img_proc: true
- pgno: 240
  md: '3. Select the Insert dropdown on the Insert tab on the ribbon and select the
    Recent Blocks... option, as shown in Figure 9.7.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_240_0.png)


    Figure 9.7: The Insert drop-down menu with Recent Blocks arrowed


    The Blocks palette will now appear on the screen. The Blocks palette is a newer
    method of working with blocks in more recent versions of AutoCAD. It is also more
    versatile and allows you to develop block libraries. You can see the Blocks palette
    in Figure 9.8, displaying the blocks in the current drawing with the Current Drawing
    tab selected.'
  merge: -1
  img_proc: true
- pgno: 241
  md: '![](img/e5541e806f2ef46a4958b6c3d0b346a9_241_0.png)


    Figure 9.8: The Blocks palette with the Current Drawing tab current


    +   1. Ensure that only the **Insertion Point** box is ticked in the lower area
    of the **Blocks** palette, as shown in *Figure 9.8*. This makes sure that you
    specify the insertion point as you insert the block.

    +   2. You will notice that there is another door block on the palette (arrowed
    in Figure 9.8). This block has a yellow lightning symbol applied to it. This indicates
    that it is a *dynamic* block. The full block name is **Door – Metric**.'
  merge: -1
  img_proc: true
- pgno: 242
  md: '+   3. If you click on the **Door – Metric** block in the **Blocks** palette,
    you will see it appear on your cursor, like a regular block, and the placement
    method is the same. Place the block on the wall corner as you did previously,
    using the **Endpoint** object snap, as indicated in *Figure 9.9*.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_242_0.png)


    Figure 9.9: Placing the Door – Metric dynamic block


    The **Door – Metric** dynamic block has a different appearance to the regular
    **Door** block, and you may find it difficult to orient the dynamic block on the
    corner of the wall, as shown in *Figure 9.10*. This is because an **Align** parameter
    built into the dynamic block is trying to align with the wall faces on the door
    opening.'
  merge: -1
  img_proc: true
- pgno: 243
