    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_152_0.png)


    Figure 6.10: The circle is highlighted brown, indicating it will be subtracted


    10. Press *Enter*. In the same gray box you saw when you added the saw tooth area,
