    state called **VisibilityState0**. Click on **New**, and in the **New Visibility
    State** dialog box, set the new state name to **Washbasin-SIDE**. Set the visibility
    options to the third option, **Leave visibility of existing objects unchanged
    in new state**, as shown in *Figure 12.26*.'
