- pgno: 276
  md: '**Tips and tricks #30**

    You might want to rotate blocks at various angles when you insert blocks into
    your drawing. Instead of inserting the block, confirming its position, and then
    using the **Rotate** (*ROTATE*) command afterward, consider right-clicking when
    prompted for the block insertion point. You can utilize **Rotate** (and **Scale**)
    on the shortcut menu as part of the block insertion workflow, saving you valuable
    time when you''re on a deadline! *Figure 10.16 shows the block insertion shortcut
    menu in action.*


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_276_0.png)


    Figure 10.16: The block insertion shortcut menu with Rotate indicated


    The right-click shortcut menu has many commands and tools that you can use when
    working with blocks. All of them allow you to be a little bit more productive,
    letting you have a more efficient workflow.


    **AutoCAD for Mac**

    AutoCAD for Mac uses the **Blocks** palette for inserting blocks into your drawings,
    and this tends to be the best method for the Mac interface.'
  merge: -1
  img_proc: true
- pgno: 277
  md: 'In this section, you learned how to create and insert a new block with attributes.
    Attributes in blocks provide more information about the block, enabling recipients
    of the drawing to see and understand what the blocks represent and what data they
    carry. For example, a block representing a door could display attributes displaying
    the door size and manufacturer. In the next section, you will learn how to use
    Enhanced Attribute Editor to edit existing block attributes.


    # Editing attributes in a block using Enhanced Attribute Editor


    You should already have the New Office Design.dwg exercise file open from the
    previous section. Make sure you are still zoomed into the part of the drawing
    where you inserted the PC_Attributes block onto the desk.


    You will now work with Enhanced Attribute Editor in the drawing to make changes
    to the displayed block attributes. Editing attributes is sometimes useful for
    higher visibility in the drawing, or font sizes need to be reduced for clarity.


    You will do this by using the following workflow:


    +   1. Hover over the PC_Attributes block, and then double-click on it. Since
    it has attributes in the block, Enhanced Attribute Editor will appear, as shown
    in Figure 10.17. It defaults to the Attribute tab in the editor. You can now edit
    the attributes in the block without the need to explode the block and rework the
    attributes.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_277_0.png)


    Figure 10.17: Enhanced Attribute Editor with the Attribute tab selected'
  merge: -1
  img_proc: true
- pgno: 278
  md: '+   2. Select the **PC_ID** attribute, and the attribute value will display
    in the **Value** field. Change the **PC_ID** attribute value to **PC100**. You
    will see this update in the editor and preview in the drawing.


    +   3. Select the **Text Options** tab in the editor. Note that at the top of
    the editor, you can see which block and attribute you are working on (indicated
    using arrows). You can also select another attributed block to work on using the
    **Select block** icon (also indicated using arrows). This is all shown in *Figure
    10.18*.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_278_0.png)


    Figure 10.18: The Text Options tab settings


    +   4. Change the **Width Factor** value from `1` to `0.6`, as shown in *Figure
    10.18*. Click on **Apply** to see the text width of the **PC_ID** attribute change.
    Do *not* click on **OK** at this point.


    +   5. Select the **Properties** tab. Using the **Color** drop-down menu, change
    the color to **Green**, as shown in *Figure 10.19*. As before, click on **Apply**
    to see the change in the attribute.'
  merge: -1
  img_proc: true
