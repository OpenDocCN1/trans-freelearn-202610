- pgno: 60
  md: 'To close out the **Customize User Interface** dialog box, click **Apply** (to
    apply the changes), then click **OK**, and the dialog box will close.


    You can click **OK** to apply the changes and close the dialog box, but it is
    a good practice to click on **Apply** just to be sure all changes have been applied
    before closing the dialog box.


    You have now successfully removed an unwanted workspace from the AutoCAD CUI and
    applied the necessary changes.


    If you click on the gearwheel icon on the status bar, you will see that the **3D
    Modeling-CURRENT** workspace is not listed on the **Workspace** menu. You can
    see this in *Figure 2.15*.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_60_0.png)


    Figure 2.15: The Workspace menu without the 3D Modeling-CURRENT workspace


    You can also see that your current workspace is the **3D Modeling-CUSTOM** workspace.
    This is the workspace that includes the *sticky panels* set up earlier in the
    chapter.


    # AutoCAD for Mac


    As mentioned in *Chapter 1*, the CUI command is also applicable in AutoCAD for
    Mac, but the interface and dialog boxes are different. *Figure 2.16* shows you
    the CUI dialog in AutoCAD for Mac after the CUI command has been started. You
    will need to click on the tabs at the top of the dialog to access the necessary
    areas of the CUI command. It is also important to note that there are no *workspaces*
    or *sticky panels* available in AutoCAD for Mac.'
  merge: -1
  img_proc: true
- pgno: 61
  md: '![](img/e5541e806f2ef46a4958b6c3d0b346a9_61_0.png)


    Figure 2.16: The Customize dialog box in AutoCAD for Mac


    You have now learned how to remove a redundant workspace from the AutoCAD CUI,
    making sure that only currently used workspaces are maintained. Your workspaces
    define your interface, and it is important to keep the CUI organized.


    # # Summary


    Workspaces are fundamental, allowing you, the AutoCAD user, to enhance and customize
    the AutoCAD interface, ensuring you can access the appropriate tools for the environment
    in which you are working. In this chapter, you ensured you used a 3D-related workspace
    as the exercise contained a 3D solid. You learned how to save AutoCAD interface
    changes and remove redundant workspaces, which will help you in customizing your
    work environments within AutoCAD. You also learned how to utilize *sticky* ribbon
    panels to allow easy access to specific ribbon panels in the AutoCAD drawing area.'
  merge: -1
  img_proc: true
