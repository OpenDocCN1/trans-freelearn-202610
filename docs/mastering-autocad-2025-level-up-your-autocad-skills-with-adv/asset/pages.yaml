- pgno: 49
  md: '# # 2


    # Developing Your Own AutoCAD Workspace


    AutoCAD 2025 comes with preset default workspaces for specific working environments.
    These are used primarily for 2D drafting and 3D modeling. Individual workspaces
    can be set up for use in specific production environments, thus making for a productive
    interface for each environment.


    AutoCAD workspaces have already been introduced in *Chapter 1*. By the end of
    this chapter, you will be able to use workspaces in AutoCAD effectively and make
    the necessary interface changes to create a custom workspace. You can also remove
    a workspace that isn''t needed using the AutoCAD **Customize User Interface**
    (*CUI*) command.


    Developing your own workspace personalizes the AutoCAD interface and allows you
    to utilize your screen and monitor space. A typical example is that you might
    only use a laptop screen when using AutoCAD, compared to a dual screen monitor
    setup for a desktop PC. You would then need to optimize your screen space to use
    AutoCAD effectively. Workspaces allow you to work in both screen configurations
    if required.


    In the *Introducing the default AutoCAD interface settings* section in *Chapter
    1*, we learned about the default workspaces available in AutoCAD. Make sure to
    check which workspace you are using, and for the purposes of this chapter, set
    the **Drafting & Annotation** workspace as current.


    This chapter will take you through the AutoCAD workspace settings and teach you
    the following:


    +   - Using workspaces effectively

    +   - Saving AutoCAD interface changes to a custom workspace

    +   - Removing a redundant workspace from the AutoCAD CUI'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# Technical requirements


    For this and later chapters within this book, you would need to enable **Dynamic
    Input** and **command prompt** in AutoCAD. For instructions on how to do this,
    visit `https://www.autodesk.com/support/technical/article/caas/sfdcarticles/sfdcarticles/How-to-enable-or-disable-dynamic-input-in-AutoCAD.html`.


    The AutoCAD command line or *command prompt* is always on the AutoCAD screen by
    default. You can hide it by typing COMMANDLINEHIDE and pressing *Enter*. You can
    bring it back by typing COMMANDLINE and pressing *Enter* or using *Ctrl + 9*.


    **Dynamic Input** (DYNMODE) is also on by default. However, the **Dynamic Input**
    icon is not displayed on the status bar. Click on the **Customization** icon at
    the right-hand end of the status bar (*three horizontal lines*), and on the menu
    click on **Dynamic Input**, ensuring there is a check mark next to it. It will
    then display on the status bar. You can then turn **DYNMODE** off and on and access
    its settings by right-clicking on the **Dynamic Input** icon.


    # Exercise files


    This chapter used a simple DWG file to ensure you had full access to all workspace-related
    features in AutoCAD. The filename of the DWG file is `Workspaces.dwg`.


    # Using workspaces effectively


    Workspaces are incredibly useful. They allow you to work in specific *spaces*
    that are related to the AutoCAD environment you are working in. For example, the
    **Drafting & Annotation** workspace is the default AutoCAD workspace, used primarily
    for 2D drafting, whereas the **3D Basics** and **3D Modeling** workspaces are
    used for 3D modeling in AutoCAD.


    Each workspace displays a certain set of ribbon tabs, panels, and icons, ensuring
    that AutoCAD’s necessary tools and features can be utilized effectively, based
    on what task AutoCAD is being used for at the appropriate time. But how do we
    choose the right workspace for our project?


    # Choosing the right default workspace


    At the beginning of this chapter, I asked you to ensure that your default workspace
    is set to **Drafting & Annotation**. This is because we are going to complete
    an exercise to determine which AutoCAD workspace would work for your particular
    project, such as 2D drafting or 3D modeling. You will learn how to change your
    default workspace or customize your workspace to suit the project environment.


    Before we start, I would like you to open this chapter’s exercise file called
    `Workspaces.dwg`, which you should have already downloaded from the link provided
    within the *Preface*.'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'Locate the exercise file and open it in AutoCAD. It will look like *Figure
    2.1*


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_51_0.png)


    Figure 2.1: The Workspaces.dwg file when first opened


    The Workspaces.dwg file looks like a flat 2D drawing of a polyline with six regularly
    spaced circles. It isn’t. It is a 3D solid with six regularly spaced holes, but
    due to the default settings you are working with, in this case, the **Drafting
    & Annotation** workspace, AutoCAD is set up for 2D drafting.


    Therefore, the question is, how do you set a workspace that is more suited to
    3D modeling? This is where you need to change your AutoCAD workspace to fit your
    needs.


    Return to the gearwheel icon on the status bar. Click on it, and you will see
    the **Workspace** menu. Select the **3D Modeling** workspace. A tick will appear
    next to it on the menu, and you will see the AutoCAD ribbon change to display
    tools that are more suited to a 3D modeling environment. *Figure 2.2* shows you
    the **Workspace** menu with the **3D Modeling** workspace set as current.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_51_1.png)


    Figure 2.2: The Workspace menu with 3D Modeling set as the current workspace'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'The AutoCAD ribbon now displays all the necessary tools you may need to work
    on the 3D solid in the `Workspaces.dwg` file. *Figure 2.3* shows an excerpt of
    some of the 3D modeling tools available on the ribbon now that the workspace has
    been changed.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_52_0.png)


    Figure 2.3: The ribbon with the 3D Modeling workspace active


    With the **3D Modeling** workspace active and comparing the **Home** tab on the
    ribbon to the **Home** tab when using the **Drafting & Annotation** workspace,
    you can see that they are dramatically different. The **Home** tab now includes
    panels such as **Modeling**, **Mesh**, and **Solid Editing**, which are used regularly
    when 3D modeling.


    You don’t have to use the preset workspaces in AutoCAD. You can save a workspace
    with its own name for your own purposes. This is often preferred if you make any
    changes to the ribbon, as it preserves the settings of the default workspaces.


    # Creating your own AutoCAD workspace


    Whenever a separate named workspace is required, you need to click on the gearwheel
    icon on the status bar again. On the **Workspace** menu, select **Save Current
    As...**, as shown in *Figure 2.4*.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_52_1.png)


    Figure 2.4: The Workspace menu with Save Current As... displayed'
  merge: -1
  img_proc: true
