    a selection in the **Select objects** menu. Select the red arc and lines that
    form the single saw tooth, and press *Enter* to confirm your selection.


    +   5. You will then encounter the **Specify center point of array** prompt. Select
    the center of the circles that form the sawblade using the **Center** object snap.
    You can do this now, having learned to set object snaps in *Chapter 5*, in the
    *Finding the geometric center* section.


    +   6. Upon clicking on the **Center** object snap, you will see the ribbon update
    to the contextual **Array Creation** tab, and the prompt change to **Select grip
    to edit array or**. You will also see that AutoCAD has automatically displayed
    *six* saw teeth, including the original, as shown in *Figure 6.18*.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_158_0.png)


    Figure 6.18: The default polar array with six saw teeth


    +   7. The design specification is for *eighteen* saw teeth, so the polar array
    needs to be updated. This can be done in the **Items** panel on the contextual
    **Array Creation** tab.'
  merge: -1
  img_proc: true
- pgno: 159
  md: '8. Change the number of items to 18 in the Items field, as shown in Figure
    6.19. Then, press Enter.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_159_0.png)


    Figure 6.19: The Items field on the Items panel on the contextual Array Creation
    tab


    9. You will see the number of saw teeth updated to 18 in the drawing, as displayed
    in Figure 6.20.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_159_1.png)


