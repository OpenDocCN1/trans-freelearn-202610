- pgno: 219
  md: '4. Your annotation text can now be placed in the Executive Office area as a
    room label. Use the layer dropdown on the Layers panel to ensure you use the Text
    layer as the current layer.


    5. Select the Multiline Text option from the text flyout in the Annotation panel
    on the ribbon, as shown in Figure 8.20:


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_219_0.png)


