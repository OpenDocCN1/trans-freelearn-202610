- pgno: 54
  md: 'Staying in the **3D Modeling** workspace with the Workspaces.dwg file still
    open in AutoCAD, you will now make changes to the AutoCAD interface and save those
    changes in a saved custom workspace.


    The changes to the interface are going to involve utilizing the ribbon panels.
    Ribbon panels can easily be moved from the ribbon and placed in the drawing area
    in AutoCAD. They are known as sticky panels and are similar to Post-It notes –
    discussed in *Chapter 1*.


    Take a look at the **Home** tab on the ribbon. You will see various panels available
    when using the **3D Modeling** workspace. For this exercise, you will move the
    **Modeling** and **Mesh** panels into the AutoCAD drawing area. This will create
    sticky panels that can be moved around like Post-It notes in the AutoCAD drawing
    area, independently of their original positions on the AutoCAD ribbon.


    Click and drag on the title bar of the **Modeling** ribbon panel. You will see
    the panel move away from the ribbon as you move the mouse. Position the **Modeling**
    panel in a suitable location in the drawing area and release the mouse button.
    The panel is now placed in the drawing area.


    Repeat this workflow for the **Mesh** ribbon panel, placing it underneath the
    **Modeling** panel. *Figure 2.7* shows how the panels should appear in the drawing
    area.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_54_0.png)


    Figure 2.7: The Modeling and Mesh sticky panels


    **AutoCAD for Mac**

    As mentioned previously, the interface is different on AutoCAD for Mac. There
    is no way of moving panels in AutoCAD for Mac as the **Drafting** and **Modeling**
    workspaces in AutoCAD for Mac are fixed at the top of the icon menu on the left-hand
    side of the screen and cannot be changed.


    You have now altered the AutoCAD interface to suit your needs. The two panels
    have been moved to a suitable location, ready for use when 3D modeling.'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'To maintain the location of the two *sticky panels*, you now need to save a
    custom workspace. The reason for this is that if you revert back to one of the
    default AutoCAD workspaces, the *sticky panels* will be returned to their original
    positions in the ribbon due to the **Customize User Interface (CUI)** settings
    in each preset workspace.


    Saving a new custom workspace ensures that the CUI settings are set to keep your
    *sticky panels* where you placed them.


    To save the custom workspace, you need to use the workflow covered earlier in
    the chapter. Click on the gearwheel icon and select **Save Current As…**, as shown
    in *Figure 2.8*.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_55_0.png)


    Figure 2.8: Selecting Save Current As… to save a custom workspace


    The **Save Workspace** dialog box will appear. Name your custom workspace `3D
    Modeling-CUSTOM` and click on **Save**. *Figure 2.9* shows you the dialog box.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_55_1.png)


    Figure 2.9: The Save Workspace dialog box with the custom workspace name


    This is now a saved workspace and is now also the current workspace. This workspace
    includes the position of the sticky panels in the AutoCAD CUI settings.


    If you click the gearwheel icon again, you will see your custom workspace listed
    on the **Workspace** menu, as shown in *Figure 2.10*.'
  merge: -1
  img_proc: true
- pgno: 56
  md: "You can also see the previously saved **3D Modeling-CURRENT** workspace. The\
    \ check mark next to the **3D Modeling-CUSTOM** workspace indicates the current\
    \ workspace.\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_56_0.png)\n\nFigure 2.10:\
    \ The Workspace menu displaying the new custom workspace\n\nYour custom workspace\
    \ includes your sticky panels. If you select the default **3D Modeling** workspace\
    \ from the **Workspace** menu, you will see your sticky panels disappear from\
    \ the drawing area to be repositioned in their respective positions on the **Home**\
    \ tab on the ribbon.\n\n> **Tips and tricks #4**\n> \n> You can use sticky panels\
    \ in AutoCAD in any workspace. As mentioned in this chapter and the *Using sticky\
    \ panels* section in *Chapter 1*, they can be returned to the ribbon at any time\
    \ using the **Return Panels to Ribbon** function. Sticky panels are a great timesaver\
    \ when using a dual monitor setup for your workstation. You can set up all the\
    \ necessary panels you use daily in one area of the screen and save this interface\
    \ configuration as your own personalized AutoCAD workspace. Should the time come\
    \ when you need to reset to default settings, you simply select the appropriate\
    \ default AutoCAD workspace as the current workspace, and all the *sticky panels*\
    \ will be returned to the relevant locations on the ribbon. *Figure 2.11* shows\
    \ how your customized interface would look when using the **3D Modeling-CUSTOM**\
    \ workspace set up in this chapter.\n\nSelect your **3D Modeling-CUSTOM** workspace\
    \ from the **Workspace** menu, and you will see the sticky panels reappear in\
    \ their locations in the drawing area, as shown previously in *Figure 2.7*."
  merge: -1
  img_proc: true
- pgno: 57
  md: '![](img/e5541e806f2ef46a4958b6c3d0b346a9_57_0.png)


    [-][Top][2D Wireframe]


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_57_1.png)


    Figure 2.11: The sticky panels in the drawing area when using the 3D Modeling-CUSTOM
    workspace


    Sometimes, after creating new workspaces, and customizing existing ones, there
    may be a need to remove redundant workspaces from the AutoCAD interface. In the
    next part of the chapter, we will look at how to do this, using the CUI tool.


    # # Removing a redundant workspace from the AutoCAD CUI


    Workspaces are incredibly useful and versatile, but there will come a time when
    you need to remove redundant workspaces from the AutoCAD CUI. You may want to
    rationalize how many workspaces are displayed in the **Workspace** menu, or you
    may just want to return back to the preset workspaces AutoCAD provides.


    You will need to run the AutoCAD CUI command to remove unwanted workspaces. We
    learned about this command in the *Introducing the AutoCAD CUI command* section
    in *Chapter 1*.


    Having a DWG file open ensures you get access to all of the AutoCAD interface,
    so make sure to have the Workspaces.dwg file open and current in AutoCAD.


    Using **Dynamic Input** or the **command line**, type in CUI and press *Enter*.'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# Developing Your Own AutoCAD Workspace


    The **Customize User Interface** dialog box will appear on the screen, and you
    will see your workspaces listed in the top-left pane of the dialog box. *Figure
    2.12* shows you how the workspaces are displayed.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_58_0.png)


    Figure 2.12: A partial view of the Customize User Interface dialog box, with the
    workspaces arrowed


    You can see that your current workspace (**3D Modeling-CUSTOM**) is listed. In
    this case, the **3D Modeling-CURRENT** workspace needs to be removed as the name
    of the workspace could be misleading to other users.


    Click on the **3D Modeling-CURRENT** workspace in the list to select it. The name
    of the workspace will be highlighted in blue, as shown in *Figure 2.13*. Then,
    right-click on the selected workspace. *Figure 2.13* also shows you the right-click
    shortcut menu that is displayed.'
