- pgno: 311
  md: 'As you build your AutoCAD knowledge using this book, you might want to set
    aside some time to experiment with dynamic blocks and what they can do for you
    in your AutoCAD drawings. They can be used with block attributes to make blocks
    that save valuable drafting time.


    You can learn more about dynamic blocks in AutoCAD here on the Autodesk website:
    https://help.autodesk.com/view/ACD/2024/ENU/?guid=GUID-2A3D92B8-20E2-47B3-92CE-FB3EB03888C3.


    # ## Summary


    You now know how to work with, edit, and manage your dynamic blocks, and using
    the knowledge gained in previous chapters, you can now consider developing block
    libraries that contain not just regular AutoCAD blocks but also dynamic blocks
    with block attributes.


    In this chapter, you have gained knowledge of using AutoCAD objects to create
    a regular door block and making that door block into a dynamic block.


    Using parameters and actions, you learned how to add dynamic functions to a regular
    door block, by adding vertical and horizontal door swing directions.


    You then tested the dynamic door block in the drawing to ensure the functionality
    of the dynamic parameters.


    Dynamic blocks are a great way to reduce time spent on onerous editing tasks.
    You can develop dynamic blocks that can be rotated, lengthened, and flipped by
    using dynamic actions in the block rather than selecting the block and performing
    just one action from the **Modify** panel on the ribbon.


    As you work with AutoCAD drawings on larger projects, the skills learned in this
    chapter will give you a good understanding of how much time can be saved by developing
    dynamic blocks for use in your day-to-day AutoCAD workflows and processes.


    The simple tools used in this chapter demonstrated how important dynamic blocks
    can be for the CAD team when used in your drawings.


    In the next chapter, we will examine dynamic blocks in more depth so that you
    can learn how to create and manage *visibility states* in dynamic blocks, adding
    the associated parameters and actions.'
  merge: -1
  img_proc: true
- pgno: 312
