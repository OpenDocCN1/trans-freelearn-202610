    +   17. If you return to the **ISO A3** layout tab, you will see that the **Executive
    Office** text object is now only displayed in the **1:30** (lower) viewport, as
    shown in Figure 8.35.

    +   18. Make sure to save your drawing as `Office Plan_GROUND FLOOR-COMPLETE.dwg`.
    That way, you save all of the revisions you have made, and you can refer to the
    file for future reference.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_228_0.png)


    Figure 8.35: The ISO A3 layout tab with the annotative text object displayed


    You can now add and delete annotation scales to your annotative objects, including
    text and dimensions. Provided you place the objects in the drawing using an annotative
    style, such as text and dimension styles, any annotative object can have more
    than one annotation scale applied to it, allowing it to be displayed in multiple
