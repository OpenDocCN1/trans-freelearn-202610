  md: '+   - You can also learn more about AutoCAD Web here on the Autodesk website:
    https://help.autodesk.com/view/ACD/2022/ENU/?guid=GUID-B4A46563-E5CA-4A34-918C-78ADEA2FEEB4

    +   - There is also more information about the AutoCAD mobile application here:
    https://help.autodesk.com/view/ACD/2022/ENU/?guid=GUID-20A8F96D-0ACA-49F6-A6FF-D7DD71A8D03A


    # Summary


    In this chapter, you have gained knowledge about how to save DWG files using the
    SAVETOWEBMOBILE command, and subsequently open the saved files using the OPENFROMWEBMOBILE
    command. You have also learned how you can check the history of your DWG files
    using the Activity Insights palette.


    You have also gained valuable knowledge of how to open and work on drawings in
    the AutoCAD Web application in a browser and in the AutoCAD mobile application
    on a mobile device such as a tablet or smartphone.


    Subsequently, you have also learned how to open modified, cloud-based DWG files
    on the AutoCAD desktop, using changes made in the DWG file by AutoCAD Web and
    the AutoCAD mobile application.


    Cloud-based DWG files make for seamless, real-time collaboration, whether that
    be through a browser or on a mobile device. The knowledge gained in this chapter
    will allow you to think about cloud-based strategies that utilize cloud-based
    DWG storage and use AutoCAD Web and the AutoCAD mobile application to collaborate
    effectively and productively.


    In the next chapter, we will examine how to use the Trace functionality in AutoCAD
    and combine it with cloud-based DWG files to enhance collaboration on your drawings
    even further.'
  merge: -1
  img_proc: true
