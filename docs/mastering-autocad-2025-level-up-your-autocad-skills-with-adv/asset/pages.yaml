- pgno: 149
  md: '**AutoCAD for Mac**

    The **Measure** (*MEASUREGEOM*) command is available in AutoCAD for Mac, but there
    is no default icon or flyout menu. Simply type MEASUREGEOM and press *return*
    to activate the **Measure** tools, and right-click to bring up the shortcut menu
    that will display the measuring tools available in the command, such as **Quick
    Measure** and **Distance.**


    You now know how to measure distances and angles effectively in AutoCAD, utilizing
    **Quick Measure** and **Distance**. Let us now look at how we can add and subtract
    areas using the **Area** tool.


    # Adding and subtracting areas using the Area tool


    Sometimes, areas will need to be calculated from your AutoCAD geometry. The **Area**
    tool in the **Measure** (*MEASUREGEOM*) command allows you to do this quickly,
    easily, and, more importantly, accurately.


    The workflow of this tool is similar to that of **Quick Measure** and **Distance**.
    However, you can use the **Area** tool to perform simple area calculations by
    adding and subtracting areas of geometry, such as closed polylines.


    In the following exercise, you will quickly and accurately add and subtract areas
    in order to calculate a final required area:


    +   1. Open the Sawblade2.dwg file. Note that there is a closed polyline forming
    the outline of the saw teeth and a central circle representing the hole in the
    center of the saw plate.


    +   2. As with **Quick Measure** and **Distance**, select the **Measure** flyout
    from the **Utilities** panel on the **Home** tab on the ribbon. Click on **Area.**


    +   3. You will see the **Specify first corner point** prompt. This is for when
    you may need to select individual points around an area to define it. You can
    do this using object snaps, but you don’t need to do this, as your areas are fully
    closed by a closed polyline (saw teeth) and a circle (the hole in the saw plate).


    +   4. Right-click and select **Add area** on the shortcut menu. You will get
    the same corner point prompt. Simply ignore it and right-click again. Select **Object**
    on the shortcut menu. You will now see the (**ADD mode**) **Select objects:**
    prompt, as shown in Figure 6.6.'
  merge: -1
  img_proc: true
- pgno: 150
  md: '![](img/e5541e806f2ef46a4958b6c3d0b346a9_150_0.png)


    Figure 6.6: (ADD mode) Select objects, ready to select the saw teeth


    +   5. Select the saw teeth. They are a closed polyline, so they will be selected
    as one object. They will highlight green, showing the area added, as shown in
    *Figure 6.7*. Press *Enter* to confirm the selection.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_150_1.png)


    Figure 6.7: The saw teeth closed polyline selected as an added area'
  merge: -1
  img_proc: true
- pgno: 151
  md: '6. You will see the area displayed in a small gray box in the AutoCAD drawing
    area, listing **Area**, **Perimeter**, and **Total area**. There will also be
    the corner prompt again, expecting you to start tracing another area to add. This
    is shown in *Figure 6.8*.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_151_0.png)


    Figure 6.8: The calculated area of the saw teeth displayed, as well as the perimeter,
    and total area


    7. Right-click again and select **Subtract area** on the shortcut menu.


    8. Right-click again and select **Object**. You will now see the **(SUBTRACT mode)
    Select objects** prompt, similar to when you added the sawtooth area. This is
    shown in *Figure 6.9*.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_151_1.png)


    Figure 6.9: (SUBTRACT mode) Select objects, ready to select the circle'
  merge: -1
  img_proc: true
- pgno: 152
  md: '9. Select the circle representing the circular hole in the saw plate. It is
    now highlighted in brown, indicating it will be subtracted from the saw tooth
