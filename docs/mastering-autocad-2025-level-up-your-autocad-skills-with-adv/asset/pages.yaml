- pgno: 201
  md: '23. In the Table Style dialog box, you will see the new Training table style.
    Select it in the left-hand pane (see Figure 7.43) and click on Set Current. It
    is now the current table style in the drawing.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_201_0.png)


    Figure 7.43: The new table style in the Table Style dialog box


    24. Click on Close to close the Table Style dialog box.


    25. Make sure to save your drawing to save the table style in the New Office Proposal.dwg
