- pgno: 412
  md: '# Using drawings updated in AutoCAD Web or the AutoCAD mobile application


    Working with the AutoCAD Web or AutoCAD mobile application is great when you are
    in an unfamiliar office (AutoCAD Web: using a browser) or on the move (AutoCAD
    mobile application: on a tablet).


    However, once you have made revisions and edits to a cloud-based DWG file, you
    will always need to return to the AutoCAD desktop environment to use the full
    version of AutoCAD.


    In this section, we will open the cloud-based `New Office Layout.dwg` DWG file
    from the `AutoCAD Web & Mobile` folders to check that the changes made in AutoCAD
    Web and the AutoCAD mobile application are in place. Let’s start by following
    these steps:


    +   1. On the AutoCAD desktop, select the `OPENFROMWEBMOBILE` command using the
    **Quick Access Toolbar (QAT)** icon, as shown in *Figure 15.29*. Then, select
    the `New Office Layout.dwg` file and click on **Open**.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_412_0.png)


    *Figure 15.29: Opening the DWG from the AutoCAD WEB & Mobile folders*'
  merge: -1
  img_proc: true
- pgno: 413
  md: '+   The drawing will open. Ensure you are in the **Model** tab zoomed to a
    full view of the office floor plan.


    +   2. Click on the **Home** tab on the ribbon and look at the **Layers** ribbon
    panel. Click on the **Layer Properties** icon, as shown in *Figure 15.30*.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_413_0.png)


    Figure 15.30: The Layer Properties icon


    +   3. The **Layer Properties Manager** palette will appear on the screen, as
    shown in *Figure 15.31*. Notice that the layers **Traces** and **Threshold** are
    now available in the DWG file.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_413_1.png)


    Figure 15.31: The new layers in the Layer Properties Manager palette'
  merge: -1
