- pgno: 202
  md: '# Summary


    You now have a drawing with a text style, a dimension style, a leader style, and
    a table style. In this chapter, we have gained knowledge about how to create and
    implement new annotative and non-annotative text styles.


    You have also learned how to set up an annotative dimension style to prepare for
    beginning work on a drawing, as well as working with a new annotative multileader
    style to enable labeling in a new drawing.


    You have also learned how to configure a new table style in preparation for tabulating
    drawing information.


    Through the exercises discussed in this chapter, you have learned that annotation
    styles must be created and implemented effectively and accurately to ensure that
    information and data are interpreted correctly. When building or manufacturing,
    for instance, the design intent and information must be precise to ensure that
    whatever is being built or made is made to the correct size, material, and specification.


    In the next chapter, we will look at how you can utilize your annotative annotation
    styles to undertake annotation scaling in your AutoCAD drawings.'
  merge: -1
  img_proc: true
- pgno: 203
  md: '# Working with Annotative Scaling


    AutoCAD provides the flexibility and versatility to easily mix and match your
    annotative styles with your chosen annotation scales, making for an easy workflow
    when adding the necessary annotation to a drawing. Combining annotative styles
    with annotative scaling can help create a comprehensive drawing that is easy to
    read and understand.


    Effective annotation ensures that your designs are understood and implemented
    precisely and accurately, whether a new building, a wiring connector in an electric
    vehicle, or a new landscape in a garden.


    A significant amount of time in AutoCAD is spent annotating designs and annotation
    styles. When combined with annotation scales, users must, therefore, ensure all
    drawing information is presented accurately to the appropriate scale.


    This chapter covers the following ways to utilize annotation styles with annotative
    scaling in your DWG files:


    +   - Setting up viewports and varying viewport scales

    +   - Working with annotation scales in the Model tab

    +   - Adding and deleting object annotation scales


    That annotation must be displayed appropriately to your project stakeholders and
    team members to communicate design intent effectively and accurately.


    In the previous chapter, you learned how to create and manage annotative styles
    for text and dimension annotation. In this chapter, you will learn how to combine
    those annotative styles with annotative scaling when using scaled viewports in
    drawing layouts and title blocks.'
  merge: -1
  img_proc: true
- pgno: 204
  md: '# Exercise files


    You must ensure you have downloaded the exercise file, `Office Plan_GROUND FLOOR.dwg`,
    to follow the sections in this chapter.


    # Setting up viewports and varying viewport scales


    **Viewports** are essential in an AutoCAD drawing. You need them in your layout
    tabs to display the essential elements of your design.


    Viewports can be set to any scale that you require. For example, you may need
    a viewport at a small scale (say, 1 : 100) for an overall, general arrangement
    of your design, and then add viewports at larger scales (say, 1 : 50, 1 : 10,
    etc.) for more detailed views of your design. Don’t be confused by a 1 : 100 scale
    being called small. It means that one unit in the scaled viewport represents a
    hundred units in the **Model** tab. Hence, your viewport will be smaller, not
    larger, even though the numbers might not seem to reflect that. A 1 : 1000 scale
    would be even smaller, if that makes sense!


    This section will teach you how to set up new viewports and scale them accordingly
    by means of an exercise. To get started, open the exercise file, `Office Plan_GROUND
    FLOOR.dwg`. It will be in the **Model** tab when it opens, displaying a simple
    office floor plan without annotation.


    Your first step is to move to the layout tab in the drawing. Select the **ISO
    A3** layout tab, as shown in *Figure 8.1:*


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_204_0.png)


    The **ISO A3** layout tab is set to an *ISO metric A3 sheet size*. You can set
    any sheet size in AutoCAD, whether metric or imperial. It all depends on your
    **relevant standards** and page setups. For the purpose of this chapter, it’s
    recommended that you use the **ISO A3** sheet size.


    You can define different page setups using sheet sizes and sheet orientations
    to plot and publish the various details from your drawings. You might have one
    page setup for plans, one for elevations, and one for details, for example.'
  merge: -1
  img_proc: true
- pgno: 205
  md: 'The following URL takes you to an Autodesk web page explaining why page setups
    can assist you when working in AutoCAD:


    https://www.autodesk.com/learn/ondemand/tutorial/understanding-page-setups-for-printing?msockid=063e61fa977165a339ee753f9664640d


    You will see that there is one scaled viewport in the layout tab in the exercise
    file. If you hover over the edge of the viewport with the crosshair/cursor, AutoCAD
    will display the viewport properties, which are as follows:


    +   - **Color:** ByLayer

    +   - **Layer:** Viewports

    +   - **Standard scale:** 1:40

    +   - **Custom scale:** 0

    +   - **Layer property overrides:** No


    *Figure 8.2 shows how this is displayed in AutoCAD:*


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_205_0.png)


    Figure 8.2: The viewport properties displayed'
  merge: -1
  img_proc: true
