- pgno: 186
  md: 'As the AutoCAD Help page states, it is recommended, in most cases, that you
    use the **Multileader** (*MLEADER*) command to create leader objects. There are
    several reasons for this:


    +   - The *QLEADER* command does not have an icon as it is an older, legacy command.
    You must always type the command.

    +   - Leaders created using *QLEADER* are not as easy to manipulate in drawings
    as leaders created using *MLEADER* are.

    +   - You can set up multileader styles quickly and easily and make them annotative,
    using a similar workflow to your dimension styles. Being annotative in nature
    also makes multileaders function in a similar way to the dimensions in your drawings.

    +   - Future versions of AutoCAD will see the development of the **Multileader**
    (*MLEADER*) command, as it is now the preferred method of adding leaders to drawings.


    Now, let''s go back to the exercise file, `New Office Proposal.dwg`, which should
    still be open. You will use this drawing to create a new, annotative, multileader
    style with the help of the following steps:


    +   1. To create new multileader styles, you need to access the **Multileader
    Style** dialog box. You can do this in two ways. The first is from the **Home**
    tab/**Annotation** panel, as shown in *Figure 7.22*.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_186_0.png)


    Figure 7.22: Expanding the Annotation panel on the Home tab and then clicking
    on the Multileader Style icon'
  merge: -1
  img_proc: true
