- pgno: 313
  md: '# # 12 Creating a Dynamic Block with Visibility States


    In the previous chapter, you learned how to create a dynamic block with two **Flip**
    actions applied and associated parameters. This chapter teaches you how to create
    another dynamic block with visibility states. **Visibility states** allow you
    to create a block with numerous views in the same block. For example, different
    variations of the same block might exist, such as a left- and right-handed desk.
    This chapter shows you how to create a washbasin block with three different views:
    top, front, and side.


    As you know from previous chapters, blocks are objects made up of multiple AutoCAD
    objects for content reuse, and dynamic blocks give you even more versatility in
    the block itself, providing the ability to manipulate the block quickly and easily.
    In this chapter, you will be providing different views of the washbasin in one
    dynamic block, thus negating the need to bring in other regular blocks that have
    different views of the washbasin.


    This chapter covers the following methods that you will need to work with a dynamic
    block of the washbasin in an AutoCAD drawing:


    +   - Creating the washbasin block drawing

    +   - Adding the necessary blocks for each view

    +   - Adding visibility states in a dynamic block

    +   - Using the new dynamic block with visibility states


    As in the previous chapter, adding more functionality to AutoCAD blocks and making
    them dynamic allows for easy reuse of drawing content. In this case, you will
    learn how visibility states provide the ability to show different views of the
    object represented by the block.'
  merge: -1
  img_proc: true
- pgno: 314
  md: '# # Exercise file


    For this chapter, you will need to use the exercise file titled *Washbasin-DYNAMIC.dwg*.


    # # Creating the washbasin block drawing


    In this section, we will be using AutoCAD objects to create the various washbasin
    blocks for use in the dynamic block. To begin, open the file in the **Model**
    tab and zoom in to see the three views of the washbasin. You will see the objects
    that will be used to make the regular washbasin blocks. From left to right, they
    are front, top, and side. Each view comprises AutoCAD objects on layer **0** (zero),
    as displayed in *Figure 12.1*.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_314_0.png)


    Figure 12.1: The objects to be used to make the washbasin blocks


    # # Adding the front block


    There are three visibility states in the dynamic block that need to be created.
    You will start with the front block first.


    Follow these steps to create the front block:


    +   1. Initially, you will create a regular block of the objects forming the front
    view on the left. With all the objects selected (as shown with all the grips displayed
    in *Figure 12.2*), select the **Insert** tab on the ribbon.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_314_1.png)


    Figure 12.2: The objects for the front view selected, with grips displayed'
  merge: -1
  img_proc: true
