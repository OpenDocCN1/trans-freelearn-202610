- pgno: 79
  md: "The object snaps mentioned so far are generally used for 2D drafting. When\
    \ working in a 3D modeling environment, you can also utilize the 3D object snaps\
    \ (3DOSNAP) in AutoCAD by clicking or right-clicking the 3D Object Snap icon on\
    \ the status bar, as shown in Figure 3.19.\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_79_0.png)\n\
    \n> **Tips and tricks #7**\n> \n> This section has only touched the surface regarding\
    \ the main drafting settings in AutoCAD. There are many drafting settings, and\
    \ it is suggested that you open the exercise file for this chapter (3D Solid.dwg)\
    \ and investigate the status bar in more depth at your own pace. Start with 2D\
    \ drafting, using regular object snaps (OSNAP), for example, and then progress\
    \ forward with 3D modeling with 3D object snaps (3DOSNAP).\n\nOne drafting setting\
    \ is always on when you first install and run AutoCAD. That is Dynamic Input,\
