  md: '# # Working with shared views in the Autodesk Viewer


    In the previous section, you learned how to share your design using the **Shared
    Views** palette in AutoCAD. You are now in Autodesk Viewer, signed in with your
    Autodesk account, and ready to utilize some of the collaboration tools in the
    viewer.


    As you are signed in through your Autodesk account, you will add some markup content
    in the viewer, which will then be reflected in the **Shared Views** palette in
    the AutoCAD desktop application. This will provide feedback on collaboration,
    similar to commenting on the shared design.


    The following workflow will take you through adding the markup content:


    +   1. While staying in Autodesk Viewer and ensuring you are signed in through
    your account, make sure you select the **Views** menu at the top left of the screen
    and check that you are in **Model | 2D View**, as shown in *Figure 13.23*.


