  img_proc: true
- pgno: 220
  md: '7. Once you have placed the text area, you will see the cursor flashing and
    a contextual tab on the ribbon called **Text Editor** displayed. The ribbon tab
    is blue; you will see all the multiline text editing tools displayed. **Text Editor**
    is shown in *Figure 8.22*. It behaves just like a word processing application,
    such as Microsoft Word. To see how it works, type the following in **Text Editor**:


    +   - Executive (press *Enter*)

    +   - Office


    The text displayed will now be the same as what is shown in *Figure 8.22*:


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_220_0.png)


    8. To close the **Multiline Text** (*MTEXT*) command, you can click outside **Text
    Editor**, or you can click on the **Close Text Editor** icon, displayed with a
    green tick on the **Text Editor** contextual ribbon tab. The text will now be
    displayed in the drawing as typed, and the **Text Editor** tab on the ribbon will
    close.


    9. Double-click on the mouse wheel as a button, and you will zoom to the extents
    of the visible objects in the drawing in the **Model** tab. Roll back the mouse
    wheel to zoom out and get some space around the floor plan for easier dimension
    placement. You will now place some annotation dimensions around the floor plan.


    10. As mentioned previously, you will need to set the annotation scale in the
    **Model** tab to suit the viewport scale in the viewport where the dimensions
    will be displayed.


    11. Set the annotation scale to **1:50** in the annotation scale flyout on the
    status bar.


    12. Using the layer dropdown on the **Layers** panel, make sure you set the **Dimensions**
    layer as the current layer.


    13. You will also need to ensure you are using the correct annotative dimension
    style. Click on the flyout on the **Annotation** panel title bar and pin it open
    if you wish (like in *step 2*). Make sure you are using the **Training-ANNO**
    dimension style. It has the blue annotative symbol next to it, as shown in *Figure
