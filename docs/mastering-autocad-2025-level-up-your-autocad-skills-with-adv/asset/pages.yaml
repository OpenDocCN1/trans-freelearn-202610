    In *Figure 1.31*, you can see that **Drafting & Annotation** is selected, with
    the ribbon/panel contents expanded. You can see all of the individual panels listed.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_43_0.png)


    Figure 1.31: The Ribbon | Panels contents expanded in the CUI dialog box


    Using the slider bar, you can slide down the list to find the **Home 2D: Draw**
    ribbon panel. If you expand this content and expand **Row 1**, you can see the
    **Line**, **Polyline**, **Circle**, and **Arc** commands there.'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'Expand the **Circle** command. You will then see all the different command
    options you would otherwise see when you click on the **Circle** fly-out arrow
    in the ribbon when drafting in AutoCAD. This is highlighted in *Figure 1.32*.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_44_0.png)


    Figure 1.32: The different Circle command options displayed in the Customize User
    Interface dialog box


    If the **Center, Radius** option is selected in the dialog box, all the settings
    for that command option will be displayed in the right-hand pane of the dialog
    box, allowing for command customization.


    The right-hand pane also displays a panel preview so that you can check its display
    on the ribbon. The macro coding for that command is also shown. Look at *Figure
    1.33* to see how this looks in the dialog box.'
  merge: -1
  img_proc: true
- pgno: 45
  md: '![](img/e5541e806f2ef46a4958b6c3d0b346a9_45_0.png)


    Figure 1.33: The Customize User Interface dialog box with the Circle | Center,
    Radius command selected


    The CUI command can edit or duplicate existing workspaces down to the command
    macro level. This means that programming in (full) AutoCAD can be applied to create
    new commands that might occupy new panels and tabs on the AutoCAD ribbon.


    There are numerous methods to use the CUI command to dive deeper into customizing
    the AutoCAD interface. They are not covered in this book, but the internet is
    full of many resources and communities (including the Autodesk Community) where
    you can investigate this and discuss it with your fellow peers. Autodesk provides
    some great internet locations for you to talk to your fellow AutoCAD users. You
    will need to use your Autodesk Account to sign into any of the Autodesk communities
    below: -


    +   - Autodesk Forums, located here: https://forums.autodesk.com

    +   - Autodesk Knowledge Network (AKN), located here: https://knowledge.autodesk.com

    +   - Autodesk Community Tips: AutoCAD Products: located in the AutoCAD forum

    +   - Autodesk Community Voices blog: located in the preceding Autodesk Forums
    link'
  merge: -1
  img_proc: true
- pgno: 46
  md: '**AutoCAD for Mac**

    The CUI command is also applicable in AutoCAD for Mac, but the interface and dialog
    boxes are different. *Figure 1.34* shows the Customize dialog in AutoCAD for Mac
    after the CUI command has been started. You will need to click on the tabs at
