- pgno: 387
  md: '# Summary


    You can now easily compare drawings and Xref files using the DWG Compare and Xref
    Compare tools. Consider using either method to save valuable time when comparing
    files and see edits, changes, and revisions in your AutoCAD drawings and designs.


    You can learn more about DWG Compare (*COMPARE*) on the Autodesk website: https://help.autodesk.com/view/ACD/2024/ENU/?guid=GUID-4B96F5FD-C9CF-4E2E-996E-E00914F8D99E.


    You can learn more about Xref Compare (*COMPARE*) on the Autodesk website: https://help.autodesk.com/view/ACD/2023/ENU/?guid=GUID-84E4CED9-A52E-4F36-8D30-EB660DDC1086.


    In this chapter, you have gained knowledge about how to work with the DWG Compare
    (*DWGCOMPARE*) tool to compare different iterations/revisions of the same DWG
    file, and used DWG Compare (*DWGCOMPARE*) to save a DWG file that displays the
    comparison.


    You have also learned about a similar workflow with the Xref Compare (*XREFCOMPARE*)
    tool to make comparisons between attached and non-attached Xref files, and how
    to spot the **In Compare** status in the **EXTERNAL REFERENCES** palette.


    In the next chapter, we will examine in depth how to use **AutoCAD Web** effectively,
    developing drawings for easy collaboration via a browser and in the cloud.'
  merge: -1
