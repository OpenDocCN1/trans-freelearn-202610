- pgno: 433
  md: "> **Tips and tricks #38**\n> \n> A very simple way of checking whether you\
    \ are working on the most current drawing when collaborating using cloud-based\
    \ DWG files is to have a sensible file-naming philosophy. The drawing currently\
    \ being used in this chapter is called New_Office_Layout_TRACE.dwg. To track edits\
    \ and changes in the DWG file, make sure the current revision of the file is in\
    \ the filename. For example, you might name the file you are using New_Office_Layout_TRACE_REV1.dwg,\
    \ where REV1 indicates the first revision of the drawing file.\n\nYou now need\
    \ to open the drawing file in **AutoCAD Web**, to check the trace applied in the\
    \ previous section, using the AutoCAD mobile application:\n\n+   1. After logging\
    \ in to AutoCAD Web, open the New_Office_Layout_TRACE.dwg file from the **Recent**\
    \ list by double-clicking on it in the list.\n+   2. The DWG file will open in\
    \ AutoCAD Web, as shown in *Figure 16.22*.\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_433_0.png)\n\
    \nFigure 16.22: The DWG file open in AutoCAD Web\n\n3. The **Properties** palette\
    \ is always set up by default when opening AutoCAD Web."
  merge: -1
