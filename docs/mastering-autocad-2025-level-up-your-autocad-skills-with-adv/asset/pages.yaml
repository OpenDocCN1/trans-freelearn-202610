- pgno: 95
  md: '# # 4

    # Using Advanced Drafting Settings


    AutoCAD has an extensive range of drafting settings, located on the AutoCAD status
    bar. This chapter will take you through some of the lesser-used, advanced drafting
    settings so that you can work more effectively and productively by working smarter,
    not harder.


    We''ll show you how to use specific drafting settings that will enhance your daily
    AutoCAD usage, providing you with additional skills that will allow you to use
    AutoCAD for more complex drafting tasks.


    You will learn about the following drafting tools:


    +   - Selecting objects using selection cycling

    +   - Utilizing 3D object snaps when 3D modelling

    +   - Working with ISODRAFT settings to create isometric views

    +   - Changing units via the status bar

    +   - Working with annotation scale to improve drawing legibility


    Learning more advanced methods of drafting in AutoCAD helps you build your AutoCAD
    skill set which, in turn, will make it easier to be more efficient and productive
    when using AutoCAD on a daily basis.


    In *Chapter 3*, we touched upon how to work with the drafting settings located
    on the AutoCAD status bar. In this chapter, we will be taking that knowledge up
    a notch to work with specific drafting settings within a drawing.'
  merge: -1
  img_proc: true
- pgno: 96
  md: '# ## Exercise files


    For this chapter, make sure you have downloaded the following exercise files:


    +   - `DraftingSettings.dwg`

    +   - `Office Project.dwg`


    Both files will be used in different sections of the chapter, so make sure you
    have them open in AutoCAD, ready to use.


    # ## Selecting objects using selection cycling


    There will always be occasions in an AutoCAD drawing where geometry or objects
    *overlap* or share the same line or edge. Making sure the correct geometry or
    object is selected is important, as it assists with accuracy and saves valuable
    time. That’s where selection cycling (`SELECTIONCYCLING`) can be very useful.


    Selection cycling is also a great method for filtering objects. There will always
    be times when you need to select overlapping objects for modification or deletion.
    In order to select the appropriate object, you can use selection cycling to select
    the correct object from a list of overlapping objects. As you work through this
    section, you will see how selection cycling does this and makes your daily AutoCAD
    work much easier.


    Before working with selection cycling, you will need to make sure it is available
    on the AutoCAD status bar. Click on the customization (*hamburger*) icon, located
    in the far bottom-right corner of the AutoCAD screen. Select **Selection Cycling**.
    A tick mark will appear next to it. Click on the customization icon again to close
    the menu.


    You can now see the selection cycling icon on the status bar. Ensure it is displaying
    blue, indicating it is switched on. *Figure 4.1* shows you the selection cycling
    icon switched on:


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_96_0.png)


    Figure 4.1: The AutoCAD status bar with selection cycling displayed and switched
    on'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'Using the exercise file for this chapter (`DraftingSettings.dwg`), make sure
    you are in the AutoCAD **Model** tab. You will see two rectangles, one blue and
    one red. They are displayed in the preset **Top** view on the **ViewCube**. They
    are both 3D solids viewed from above (top) and are adjacent to each other, as
    shown in *Figure 4.2*:


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_97_0.png)


    Figure 4.2: The two rectangles in the preset Top view in the Model tab


    *Figure 4.2* is a simple example of two adjoining rectangles. Even in a more complex
    drawing than this one, the geometry of objects is often adjacent or next to each
    other. Whether we are dealing with a simple or complex drawing, selection cycling
    provides an efficient method of selecting one single object among many.'
  merge: -1
