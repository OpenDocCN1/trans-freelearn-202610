    \ test the other settings on the shortcut menu to investigate their effects on\
    \ the visual display of the drawing. Use the AutoCAD system variables *DISPLAYVIEWCUBEIN2D*\
    \ and *DISPLAYVIEWCUBEIN3D* to turn the display of the ViewCube on and off in\
    \ either of the 2D or 3D workspaces."
  merge: -1
