- pgno: 178
  md: '14. The dimension style you create is annotative, so the **Annotative** checkbox
    will already be checked. If it isn’t, though, make sure it is ticked. You don’t
    need to make any other changes to the **Fit** tab, as you will be using the default
    settings, so make sure your **Fit** tab looks the same as the one displayed in
    *Figure 7.14*.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_178_0.png)


    Figure 7.14: The Fit tab with the Annotative checkbox checked


    15. Click on the **Primary Units** tab to the right of the **Fit** tab. This is
    where you can override any settings in the **Units** settings (set with the *UNITS*
    command) for annotation display purposes. For example, you might be working to
    units setting of *four decimal places* for accuracy when drafting in AutoCAD,
    but only need an accuracy of *one decimal place* when placing annotation to communicate
    design intent, so the **Precision** setting would be set to `1.0`, overriding
    the `1.0000` setting originally set with the **Units** (*UNITS*) command.'
  merge: -1
  img_proc: true
- pgno: 179
  md: '16. Make sure all your Primary Units settings are set, as shown in Figure 7.15.


    17. Ensure that Decimal separator is set to Period (.). Comma (,) or Space ( )
    might also be used, but bear in mind that this setting is displayed when placing
    dimension annotation and is one of the display settings that could be defined
    by the CAD standard you might be using.


    Figure 7.15: The Primary Units tab with the Decimal separator set to Period'
  merge: -1
  img_proc: true
- pgno: 180
  md: 'In this chapter, we will not set any options on the **Alternate Units** tab.
    You can investigate this at another time if you wish. Alternate units allow for
    the display of a different set of units when placing dimension annotation. For
    example, you may be using **METRIC** units for your **PRIMARY** dimension annotation,
    and you want to display **IMPERIAL** units as your **ALTERNATE** units. To display
    both in your dimension annotation, you would set your alternate units to the imperial
    settings you would need to display. Figure 7.16 shows how the **Alternate Units**
    tab needs to be set for this chapter. Take note that the **Display alternate units**
    checkbox is *unchecked.*


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_180_0.png)


    Figure 7.16: The Alternate Units tab with Display alternate units unchecked'
  merge: -1
  img_proc: true
- pgno: 181
  md: '18. There will be no **tolerances** needed in this dimension style. Tolerances
    tend to be used in machining and manufacturing to display lateral tolerances in
    a material when it is machined for manufacture. These tolerances apply to an aspect
    of a part, such as a point, line, axis, or surface. Tolerances are often used
    in mechanical and production drawings, where the drawn objects are cut, planed,
    or milled. These production processes require a tolerance as the tools and machinery
    used are (normally) cut into a material such as metal. These processes will never
    be absolute, so the appropriate tolerances are needed. In the case of the exercise
    file, you do not need any tolerance values.


    19. Click on the **Tolerances** tab.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_181_0.png)'
  merge: -1
  img_proc: true
- pgno: 182
  md: '20. Ensure the Method option under Tolerance format is set to None, as shown
    in Figure 7.17. Also, ensure that all other settings in the Tolerances tab are
    set as per Figure 7.17. You are then ensuring that no tolerances are used in your
    dimension style.


    21. Click on OK. Your dimension style is now set up and displayed in Dimension
    Style Manager, as shown in Figure 7.18.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_182_0.png)


    Figure 7.18: Dimension Style Manager with the Training-ANNO dimension style current


    22. Select the new Training-ANNO annotative dimension style in the left pane so
    that it highlights in blue, as shown in Figure 7.18.


    23. Click on Set Current, and then click on Close.


    24. Your new annotative dimension style (Training-ANNO) is now the current dimension
    style in the New Office Proposal.dwg file.


    25. Make sure to save the drawing so the dimension style is saved in the DWG file.'
