- pgno: 343
  md: '# 13

    Sharing Your

    AutoCAD Drawings


    In the previous chapters, you learned how to work with blocks, attributes, and
    dynamic blocks to reuse design content in your drawings. This chapter teaches
    you how to share your AutoCAD drawing files with both AutoCAD users and non-AutoCAD
    users who may need to mark up and comment on the designs in your drawings.


    Sharing drawings and drawing views will give you the capacity to share aspects
    of your design in real time, using the power of the internet and the cloud. This
    saves valuable drawing management and collaboration time by providing a much more
    dynamic drawing revision path.


    AutoCAD has several methods for sharing drawings for easy collaboration, revisions,
    and changes to the design. In this chapter, you will see how Share Drawing and
    Shared Views can make your daily AutoCAD workflows and processes much quicker,
    allowing for faster and more efficient collaboration. You can use the Share Drawing
    (SHARE) command to share drawings via the browser-based version of AutoCAD: AutoCAD
    Web. You can also utilize the Shared Views palette, which provides views of drawings
    via Autodesk Viewer, allowing for comments and markups.


    In a nutshell, we look at the following topics in the chapter:


    +   - Using the Share Drawing tool

    +   - Working with shared drawings in AutoCAD Web

    +   - Using the Shared Views palette

    +   - Working with shared views in Autodesk Viewer'
  merge: -1
  img_proc: true
- pgno: 344
  md: '# Exercise file and requirements


    For this chapter, you will need to use the New Office Design_FINISHED.dwg exercise
    file. Open the file in the Model tab, making sure you can see the full floor plan.


    You will also need to ensure that you are logged in to AutoCAD using your Autodesk
    account. If you don''t have an Autodesk account, you may need to set one up here:
    https://accounts.autodesk.com/. This chapter assumes you have an Autodesk account
    and that you are logged in to it.


    # Using the Share Drawing tool


    The Share Drawing tool is used to share drawings to AutoCAD Web for viewing or
    editing, quickly and easily in real time. You will find the Share Drawing (SHARE)
    tool in two locations: on the Collaborate tab on the ribbon in the Share panel,
    and (conveniently) on the Quick Access toolbar (QAT), as displayed in Figure 13.1.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_344_0.png)


    Figure 13.1: The Share Drawing tool on the Collaborate ribbon tab and QAT


    In the following exercise, you will learn how to utilize the Share Drawing tool
    to share drawings via the cloud with the AutoCAD Web application:


    +   1. You can click on either of the icons seen in Figure 13.1 to activate the
    Share Drawing (SHARE) command. This will create a URL to share the DWG file in
    AutoCAD Web, and provide you with a dialog box, as shown in Figure 13.2.'
  merge: -1
  img_proc: true
- pgno: 345
  md: '# # Share a link to this drawing


    Share a copy of the current version of this drawing, including xrefs. Recipients
    can open the link using AutoCAD on the web or AutoCAD on mobile. Learn more


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_345_0.png)


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_345_1.png)


    https://web.autocad.com/acad/me/sid/shares/drawings/a385cf71-...

    Link expires in seven days


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_345_2.png)


    Figure 13.2: The Share a link to this drawing dialog box


    Shared drawings can be set with two different levels of permission:


    +   *   **View only**: This means that anyone who receives this link can view
    the drawing but cannot modify or edit the drawing. They also cannot save a copy
    of the drawing.

    +   *   **Edit and save a copy**: This means that anyone who receives the link
    can modify and edit the drawing, and also save a copy of the drawing.


    If you click on either of these in the dialog box, you will see the `https://`
    link in the dialog box change. Also, note that the links will expire in seven
    days from sending. The **Copy link** button does exactly that. It copies the `https://`
    link for you to insert into an email client, document, or even a text message.


    +   2.  Provided you are logged in to your Autodesk account, click on **Preview**
    in the dialog box, and you will automatically be taken to a new browser page with
    the drawing displayed in AutoCAD Web, as shown in *Figure 13.3*.'
  merge: -1
  img_proc: true
