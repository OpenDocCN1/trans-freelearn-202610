  md: '![](img/e5541e806f2ef46a4958b6c3d0b346a9_88_0.png)


    Figure 3.27: The full navigation wheel in AutoCAD


    Let''s look at the **Real-time Pan** tool next.


    # ## Real-time Pan


    The **Pan** icon on the **navigation bar** starts the **Real-time Pan** tool.
    This tool provides you with uninterrupted panning around your AutoCAD drawing
    or model. You can right-click and use the shortcut menu when in *Real-time Pan*
    mode. This then allows you to utilize other **Zoom** and **Pan** tools. *Figure
    3.28* shows the shortcut menu when activated.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_88_1.png)


    Figure 3.28: The Real-time Pan shortcut menu (flyout)


    Using **Real-time Pan** is a great way to move around in a DWG file. In the next
    section, you will learn how to use **Zoom** to magnify the view in your DWG to
    see the design in more detail.'
