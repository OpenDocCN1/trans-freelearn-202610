- pgno: 264
  md: '14. Select the **Arch-LIBRARY** palette from the list on the left and right-click
    on it. The shortcut menu shown in *Figure 9.33* appears, and you can import and
    export your tool palettes as **XTP** files. Export an XTP file to a team member,
