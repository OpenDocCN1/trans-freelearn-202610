- pgno: 216
  md: "> **Tips and tricks #26**\n> \n> Once a viewport is placed and scaled, it can\
    \ be locked to prevent any changes caused by errors. For example, a user might\
    \ double-click inside a viewport boundary by mistake and zoom and pan, thus changing\
    \ the viewport scale. The easiest way to do this is to use the padlock icon on\
    \ the status bar when the viewport is selected in the layout tab. This is shown\
    \ in *Figure 8.15*. When the padlock icon is blue, the viewport is locked.\n\n\
    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_216_0.png)\n\nFigure 8.15: The padlock\
    \ on the status bar, set to blue, indicating that the selected viewport is currently\
    \ locked.\n\nOnce a viewport is locked, its scale cannot be changed. This avoids\
    \ accidental changes to viewport scales if a user activates a viewport in error\
    \ and zooms in or out while the viewport is active.\n\n> **AutoCAD for Mac**\n\
    > \n> All the viewport functionality mentioned in this section works in the same\
    \ way in AutoCAD for Mac. It is still located on the status bar, but the padlock/lock\
    \ icon uses the MacOS iconography, and looks slightly different, as shown in *Figure\
    \ 8.16*:\n\n![](img/e5541e806f2ef46a4958b6c3d0b346a9_216_1.png)\n\nFigure 8.16:\
    \ The viewport padlock displayed on the AutoCAD for Mac status bar\n\nYou now\
    \ know how to work with existing viewports and how to create and scale new viewports.\
    \ A good way to learn more about viewports is to experiment with them and discover\
    \ their behavior when placing them and scaling them in your layout tabs in your\
    \ drawings. A typical example might be to set a 1 : 100 viewport, and then rescale\
    \ it to 1 : 50. You will see that the 1 : 50 viewport shows more detail, as it\
    \ is half of the 1 : 100 scale. Try using different scale values, and then resize\
    \ the viewports when selected by using the blue grips.\n\nIn the next part of\
    \ the chapter, you will learn how to utilize annotations in the Model tab, ensuring\
    \ that it displays effectively in scaled viewports."
  merge: -1
  img_proc: true
- pgno: 217
  md: '# # Working with annotation scales in the Model tab


    You should already have the `Office_Plan_GROUND_FLOOR.dwg` exercise file open
    from the previous section. You will now add some annotative dimensions in the
    **Model** tab, using the appropriate annotation scale and making sure it matches
    the selected scaled viewport. These are the steps to do so:


    +   1. Make sure you are in the **Model** tab of the drawing and are zoomed into
    the **Executive Office** area of the floor plan, as shown in *Figure 8.17*:


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_217_0.png)


    Figure 8.17: Zoomed into the Executive Office on the Model tab


    +   2. You need to use an appropriate text style to place some labels in the **Executive
    Office** area of the drawing. Using the **Annotation** panel on the **Home** tab
    of the ribbon, use the flyout menu on the panel title bar. You can then use the
    text style flyout menu to ensure you use the appropriate text style for annotation.
    You need to be using `Labels_MODEL_5mm`, as shown in *Figure 8.18*. If it helps,
    you can pin the **Annotation** panel flyout open to stop it from disappearing
    back into the ribbon. It is also shown pinned open in *Figure 8.18*:'
  merge: -1
  img_proc: true
- pgno: 218
  md: '![](img/e5541e806f2ef46a4958b6c3d0b346a9_218_0.png)


    Figure 8.18: The Annotation panel pinned open with the text style arrowed


    3. The Labels_MODEL_5mm text style is annotative (it has the blue annotative symbol
    next to it in the flyout menu), so it will adopt the current annotation scale
    set up on the status bar when in the Model tab. For the annotation text to be
    displayed as it should in the 1:30 viewport created in the previous section, the
    annotation scale must also be set to 1:30. Select the annotation scale flyout
    in the status bar and select the 1:30 scale, as shown in Figure 8.19:


