- pgno: 355
  md: 'You can now share a drawing using AutoCAD’s **Share Drawing (SHARE)** tool
    and then utilize AutoCAD Web to make edits and changes. In the next section, you
    will learn how to use the **Shared Views** palette to share views from your drawings.


    # Using the Shared Views palette


    In the first section of this chapter, you learned how to share your drawings using
    the **Share Drawing (SHARE)** tool. There is also another way to share your views
    of your drawings using the **Shared Views** palette.


    Sharing views is an alternative method of collaboration with your AutoCAD drawings
    using the browser-based Autodesk Viewer. You can find the viewer at any time at
    `https://viewer.autodesk.com`. The Autodesk Viewer is non-AutoCAD specific and
    can view many file formats, including the AutoCAD DWG file format. It is incredibly
    useful when working on projects that use multi-platform file formats, allowing
    non-application users to view and mark up files and comment on designs.


    Let’s go back to the `New Office Design_FINISHED.dwg` file. You will use this
    file for the next two sections of the chapter. Also, ensure you are signed in
    to your Autodesk account in AutoCAD and the Autodesk Viewer (you will sign in
    to the Autodesk Viewer later).


    You now need to work through the following steps to start collaborating using
    the **Shared Views** palette:


    +   1. With the drawing file open in the **Model** tab, go to the **Collaborate**
    tab on the ribbon. You will find the **Shared Views** icon on the **Share** ribbon
    panel, as shown in *Figure 13.16*.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_355_0.png)


    Figure 13.16: The Shared Views icon on the Share ribbon panel'
  merge: -1
  img_proc: true
