- pgno: 80
  md: '# AutoCAD for Mac


    To customize the status bar in AutoCAD for Mac, you would need to click on the
    gearwheel icon at the bottom left of the AutoCAD for Mac application window. This
    displays a similar menu to the one in *Figure 3.20*. The list of drafting settings
    is shorter, and each has a checkbox next to it to switch settings on and off,
    unlike the Windows version of AutoCAD, where you click on the setting name to
    toggle it on or off and display a check mark. To close the menu in AutoCAD for
    Mac, you will need to click on the gearwheel icon again.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_80_0.png)


    Figure 3.20: The status bar customization menu'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'Note in *Figure 3.20* that **Dynamic Input** is arrowed. The **Dynamic Input**
    drafting setting does not have a check mark next to it, indicating that it is
    not currently displayed on the status bar. Clicking **Dynamic Input** on the menu
    will switch it on, and a check mark will appear next to the setting name.


    To close the menu, click on the hamburger icon again. This is the only way to
    close the menu, and you must do that to return to work in AutoCAD.


    The **Dynamic Input** drafting setting is now displayed on the status bar. This
    is shown in *Figure 3.21*.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_81_0.png)


    Figure 3.21: The Dynamic Input icon displayed on the status bar


    **Dynamic Input** (*DYN​MODE*) is incredibly useful. It allows you to input commands
    in information at the cursor (crosshair), instead of using the command line at
    the bottom of the screen. This gives you a more dynamic interface with which to
    use AutoCAD commands, hence the term **Dynamic Input**.


    Like with all other drafting settings on the status bar, you can right-click on
    the icon and select **Dynamic Input Settings...** Clicking on this will open the
    **Drafting Settings** dialog box with the **Dynamic Input** tab open, allowing
    you to update any dynamic input settings you need to use to work effectively in
    AutoCAD. *Figure 3.22* shows you the **Dynamic Input** tab in the **Drafting Settings**
    dialog box.'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'Figure 3.22: The Drafting Settings dialog box with the Dynamic Input tab open


    All the drafting settings on the AutoCAD status bar are unique to you. You set
    them up to make your daily AutoCAD work easier. There is no defined setup. The
    settings are there if you need them, and you turn them off and on according to
    your needs and requirements. Use them to your advantage, so that you can use AutoCAD
    as quickly and efficiently as you can.


    # Tips and tricks #8


    When 3D modeling in AutoCAD, you can utilize 3D Object Snap (3DOSNAP) on the status
    bar. Make sure they are visible on the status bar by using the Customize (hamburger)
    icon, and then switch them on. You can set running 3D object snaps in the same
    way as regular object snaps on the status bar, thus enhancing your productivity
    when working in 3D.'
  merge: -1
  img_proc: true
- pgno: 83
  md: 'All of the previous interface tools you have learned about can be used in both
    2D and 3D environments. The next section takes us directly into 3D modeling and
    the incredibly useful AutoCAD ViewCube.


    # The AutoCAD ViewCube


    In this chapter, 3D modeling has been mentioned numerous times. When working in
    3D, there is a need to be able to view a 3D object or solid in various isometric
    views.


    The **ViewCube** is a navigation tool that displays in the top-right corner of
    the drawing area in AutoCAD, regardless of whether you are working in the 2D model
    space or a 3D visual style. The **ViewCube** allows you to switch between standard
    and isometric views.


    The **ViewCube** is what is called a persistent, clickable, and draggable interface
    that allows you to switch between standard views and isometric views of your model.
    *Figure 3.23* shows you the **ViewCube** in place at the top right of the AutoCAD
    drawing area.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_83_0.png)


    Figure 3.23: The ViewCube in the AutoCAD drawing area'
  merge: -1
  img_proc: true
- pgno: 84
  md: 'The **ViewCube** uses three types of view, as listed:


    +   - **Edge**

    +   - **Corner**

    +   - **Face**


    Clicking on any of these will re-align the AutoCAD view in the drawing area to
    correspond with the orientation of the **ViewCube**. Using the exercise file,
    3D Solid.dwg, click on the *lower-left corner* of the **ViewCube** in its default
    position, as shown in *Figure 3.24*.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_84_0.png)


    Figure 3.24: The lower-left corner of the ViewCube


    As you hover over the corner, it will light up so that you can ensure you are
    clicking on the correct part of the **ViewCube**. After clicking, the drawing
    will look as it does in *Figure 3.25*. That corner of the **ViewCube** takes the
    display to a preset **SW Isometric** view, as indicated by the view control display.
    Using the edges, corners, and faces of the **ViewCube** allows you to effectively
    navigate in AutoCAD, especially when working with 3D models.'
  merge: -1
  img_proc: true
- pgno: 85
  md: "![](img/e5541e806f2ef46a4958b6c3d0b346a9_85_0.png)\n\nFigure 3.25: The drawing\
    \ displayed in the SW Isometric view\n\n> **Tips and tricks #9**\n> \n> When working\
    \ with the ViewCube, you can use the compass display by clicking on the arrows\
    \ to rotate any view you are using. You can also go back to the **Home** view\
    \ by clicking on the *house* symbol. Right-click on the ViewCube and use **Set\
