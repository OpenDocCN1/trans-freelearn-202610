- pgno: 89
  md: '# Zoom


    Zooming in and out of your drawing is essential for you to see close-up details
    in your drawing, as well as being able to view the overall design. The Zoom icon
    on the navigation bar provides a flyout menu that gives access to the AutoCAD
    Zoom commands. Figure 3.29 shows the Zoom flyout menu activated.


    The flyout provides a menu listing all the AutoCAD Zoom commands, which are selected
    by clicking on them. The most recent Zoom command will then display on the navigation
    bar until the next Zoom command is chosen. The most current Zoom command is highlighted
    with a check mark on the flyout menu.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_89_0.png)


    Figure 3.29: The Zoom flyout menu with Zoom Extents current


    You now have the knowledge to use Zoom effectivley. In the next section, you will
    learn how to utilize the Orbit tool to navigate models quickly and easily.'
  merge: -1
  img_proc: true
- pgno: 90
  md: '# Orbit (flyout)


    Orbiting in a 3D drawing is essential for you to see important details in your
    drawing, as well as being able to showcase the overall design. The Orbit icon
    on the navigation bar provides a flyout menu that gives access to the AutoCAD
    Orbit commands. Figure 3.30 shows the Orbit flyout menu activated.


    The flyout provides a menu listing all the AutoCAD Orbit commands, which are selected
    by clicking on them. The most recent Orbit command will then display on the navigation
    bar until the next Orbit command is chosen. The most current Orbit command is
    highlighted with a check mark on the flyout menu.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_90_0.png)


    Figure 3.30: The Orbit flyout menu with Orbit current(flyout)


    You can use Orbit to navigate your model in your DWG file. Using a 3Dconnexion
    device allows you to be much more precise as you orbit and zoom in your 3D designs.


    # 3Dconnexion


    The 3Dconnexion icon is only available if you have a 3Dconnexion device, such
    as a SpaceMouse or CadMouse, configured for use with AutoCAD. These devices enhance
    the human interface with AutoCAD, with the SpaceMouse often being used in 3D modeling.
    Figure 3.31 shows the 3Dconnexion flyout menu activated.


    You will find all the necessary information about 3Dconnexion devices on the website
    at www.3dconnexion.com, and you can also download any necessary AutoCAD drivers
    there.'
  merge: -1
  img_proc: true
- pgno: 91
  md: 'The flyout provides a menu listing all the available 3Dconnexion modes (depending
    on the 3Dconnexion device), which are selected by clicking on them. The most recent
    3Dconnexion mode will then display on the **navigation bar** until the next one
    is chosen. The most current mode is highlighted with a check mark on the flyout
    menu. You can also get access to **3Dconnexion Settings...** for your device on
    the flyout menu.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_91_0.png)


    Figure 3.31: The 3Dconnexion flyout menu with Object Mode current


    A **3Dconnexion** device is a great addition to AutoCAD. Combining that with **ShowMotion**
    in AutoCAD allows you to create seamless presentations of specific views of your
    design in AutoCAD.


    # ShowMotion


    The **ShowMotion** tool provides an onscreen display for creating and playing
    back cinematic camera animations of various views in your drawing. These views
    can then be utilized for design review, presentation, and bookmark-style navigation.
    *Figure 3.32* shows the **ShowMotion** icon on the **navigation bar.**'
  merge: -1
  img_proc: true
- pgno: 92
  md: '![](img/e5541e806f2ef46a4958b6c3d0b346a9_92_0.png)


    **ShowMotion** has three main parts: control bar, shot sequence thumbnails, and
    shot thumbnails. Shots are named locations showing specific parts of the model,
    with related shots being able to be organized into a shot sequence. **Figure 3.33**
    shows **ShowMotion** in a 3D modeling environment, with two saved shots and the
    **ShowMotion** control bar displayed.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_92_1.png)'
  merge: -1
