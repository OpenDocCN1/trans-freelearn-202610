  md: '6. As you edit the original saw tooth, you will see the other saw teeth in
    the array update to suit. Once the editing is complete, click the **Save Changes**
    icon in the **Edit Array** panel, now displayed on the right-hand end of the **Home**
    tab on the ribbon. The **Save Changes** icon is shown in *Figure 6.25*.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_162_0.png)


    Figure 6.25: The Save Changes icon on the Edit Array panel


    Upon saving the changes to the array, you will now see that all of the 18 saw
    teeth are set to the new saw tooth configuration.


    Select the array, and you will see that it is still in place, fully associative,
    without needing to re-array to make the necessary changes. *Figure 6.26* shows
    the revised array, selected and highlighted.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_162_1.png)


