    6. You can also measure angles using vertices. Select Angle again from the Measure
    menu, and press Enter to confirm the <Specify vertex> prompt. Select the three
    points in the order shown in Figure 6.15. You will see that the measured angle
    is 108 degrees. Make sure that the first point selected is the apex of the angle
