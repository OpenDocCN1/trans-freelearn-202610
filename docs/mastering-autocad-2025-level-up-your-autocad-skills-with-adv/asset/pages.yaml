- pgno: 251
  md: 'You have now created a block library drawing using the Clipboard function in
    AutoCAD. This drawing could now be placed in a shared location such as a network
    server or a cloud-based folder for others in your CAD team to use and copy and
    paste blocks from. This is a great time saver when you are all using the same
    blocks on the same project, saving hours of rework time.


    Tips and tricks #29

    When placing your blocks in the new block library drawing using Paste from the
    Clipboard, the copied block will also bring the layer it is currently on into
    the new drawing. It will also remain on that layer. It is often a good idea to
    put all your blocks in the new block library drawing onto their own neutral layer,
    avoiding any layer transfer into other working drawings.


    The Clipboard in AutoCAD also uses the regular keyboard shortcuts, such as Ctrl
    + C for copy and Ctrl + V for paste. Ctrl + X will cut, and Ctrl + Z will undo
    the last operation.


    AutoCAD for Mac

    Copying and pasting blocks works in a virtually identical way for AutoCAD for
    Mac.


    You have learned how to copy and paste existing blocks into a new block library
    drawing in this section. Next, let’s look at how block libraries can be added
    to the Blocks palette.


    # Adding the block library to the Blocks palette


    For the purposes of this section, I have saved the block library drawing as Architecture-LIBRARY.dwg
    in a known location.


    In this section, you will learn how to add the block library to the Blocks palette
    so that it is always accessible via the Blocks palette at any time while working
    on any drawing in AutoCAD:


    +   1. Currently, the New Office Design.dwg file and the Architecture-LIBRARY.dwg
    file are still open in AutoCAD. Make sure that the New Office Design.dwg file
    is the current drawing.

    +   2. Click on the Insert tab on the ribbon and select the Insert dropdown, as
    you have done in previous sections in the chapter.'
  merge: -1
  img_proc: true
