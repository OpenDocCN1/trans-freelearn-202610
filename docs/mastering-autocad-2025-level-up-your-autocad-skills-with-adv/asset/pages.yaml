- pgno: 156
  md: 'Figure 6.15: The displayed angle measured using three vertices (numbered)


    7. To close the menu and the command, select eXit on the Measure menu.


    Measuring angles is essential for accuracy in AutoCAD, and the Angle tool allows
    this to be done quickly and easily. In the case of the sawblade, the angles used
    for the saw teeth have to be measured precisely to allow the sawblade to be manufactured.
    The ability to measure exactly makes sure that any Computer Aided Manufacturing
    (CAM) has accurate angles to cut the saw teeth from the source materials.


    AutoCAD for Mac

    The Measure (MEASUREGEOM) command is available in AutoCAD for Mac, but there is
    no default icon or flyout menu. Simply type MEASUREGEOM and press Enter to activate
    the Measure tools, and right-click to bring up the shortcut menu that will display
    the measuring tools available in the command, where you will find the Angle tool.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_156_0.png)'
