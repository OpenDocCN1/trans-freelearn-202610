- pgno: 183
  md: '**Tips and tricks #23**

    When working with dimension styles, there is often a need to remove unused dimension
    styles from the drawing file to maintain file size and for general housekeeping
    of your DWG files. To do so, you can right-click over non-used dimension styles
    in **Dimension Style Manager** and use **Delete** in the shortcut menu (see *Figure
    7.19*). You can also remove non-used dimension styles with the **Purge** (*PURGE*)
    command.


    ![](img/e5541e806f2ef46a4958b6c3d0b346a9_183_0.png)


    Figure 7.19: Deleting a dimension style using the shortcut menu in Dimension Style
    Manager


    **AutoCAD for Mac**

    When creating a dimension style in AutoCAD for Mac, you will find the **Dimension
    Style** icon in the **Dimension** panel in the left-hand toolbar. When working
    with dimension styles in Mac, the dialog boxes are similar but use the usual Mac
    interface, as shown in *Figure 7.20*.'
  merge: -1
  img_proc: true
- pgno: 184
  md: '![](img/e5541e806f2ef46a4958b6c3d0b346a9_184_0.png)


    Figure 7.20: Creating a dimension style in AutoCAD for Mac


    Dimension annotation is fundamental to your drawings. It communicates your design
    intent. You now know how to set up an annotative dimension style to add dimension
    annotation to your drawings. This applies to all drawings, no matter how large
    or small they are. They will all need dimension annotation to communicate the
    designs contained in them.


    In this section, you learned how to create and implement a new annotative dimension
    style. Building on that knowledge, you will next set up styles for both **multileaders**
    (*MLEADER*) and **Quick Leaders** (*QLEADER*) in the upcoming section.'
  merge: -1
