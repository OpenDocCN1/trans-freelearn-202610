    \    filter: filter_village_low_pop,\n    symbolizer: {\n        fillColor: '#ababab',\
    \ fillOpacity:.8,\n        pointRadius:8, strokeColor: '#454545',\n        strokeWidth:2\n\
    \    }\n});\n\nvar rule_village_high_pop = new OpenLayers.Rule({\n    filter:\
    \ filter_village_high_pop,\n    symbolizer: {\n        fillColor: '#FFFA93', fillOpacity:.8,\n\
    \        pointRadius:8, strokeColor: '#AFAB57',\n        strokeWidth:4,\n    }\n\
    });\n\nvar rule_city = new OpenLayers.Rule({\n    filter: filter_city,\n    symbolizer:\
    \ {\n        fillColor: '#BD1922', fillOpacity:.8,\n```"
  merge: -1
  img_proc: true
- pgno: 325
  md: "```\npointRadius:16, strokeColor: '#812B30',\nstrokeWidth:6,\nfontSize:'.8em',\
    \ fontColor: '#efefef',\nlabel: '${population}'\n}\n});\n```\n\n9. Last thing—we\
    \ need to add the rules to the vector_style object, create a style_map object\
    \ and apply the style object to the 'default' intent, and finally set the vector\
    \ layer's StyleMap to the style map object.\n\n```\nvector_style.addRules([rule_village_low_pop,\
    \ rule_village_high_pop, rule_city]);\n\nvar vector_style_map = new OpenLayers.StyleMap({\n\
    \  'default': vector_style\n});\n\nvector_layer.styleMap = vector_style_map;\n\
    ```\n\n10. You should see something like the following, with different distributions\
    \ of points and colors since the values were randomized:\n\n![](img/1b8cd151c9f278555f9cf255b20d244e_325_0.png)\n\
    \n# What Just Happened?\n\nWe just demonstrated how to use logical filters in\
    \ our map. We can mix and match the different logical operators to create even\
    \ more complex filters, allowing us to style features exactly how we want to.\
    \ There's one more feature class to cover—Feature.Spatial."
  merge: -1
