    # Understanding the code—Line by line


    Lines [1] to [5]: Sets up the HTML page. Every HTML page needs an <html> and <head>
    tag, and the extraneous code you see specifies various settings that inform your
    browser that this is an HTML5 compliant page. For example, we include the DOCTYPE
