- pgno: 343
  md: '# What Just Happened?


    We just added some interactivity to our map. It''s nothing too complex, although
    at first glance the code may seem daunting. We didn''t really do anything ''new''
    though. We registered a couple of vector layer events that get fired when selecting
    a feature and then show information about the features selected. From here, you
    could change the application a bit with ease—such as changing how and what is
    shown. This example is to be used more or less as a guide to help you create your
    own applications. Let''s take this example further; but first, we''ll need to
    use realtime data.


    # Using real time data with a ProxyHost


    The data we''ve loaded (`flickr_data.kml`) is from a third party source, but it''s
    only fresh up to the point that we download it. Let''s address the second point
    we came across previously:


    *Use ''live'' data, and not download a KML file ourselves when we want new data*


    What we need to do is access the data in real time. To do this, we''ll need to
    use a **ProxyHost**. This term is discussed in more detail in Chapter 9, but it''s
    essentially a way to circumvent the cross domain request restraints of AJAX by
    calling on some server side script to make requests for us (acting as a proxy).


    # Time for Action – getting dynamic data


    Let''s specify a ProxyHost and get data from Flickr in real time.


    +   1. We can use the example we just created, as we''ll only be adding two things
    to it.

    +   2. First, we''ll need to define the URL of our proxyhost. It can be a CGI
    script, python script, etc. A CGI script is provided by OpenLayers at `http://trac.osgeo.org/openlayers/wiki/FrequentlyAskedQuestions#ProxyHost`.
    If you use that file, be sure to have Python installed. By default, the file would
    go in `c:/xampp/cgi-bin` using Xampp on Windows or on Linux: `/usr/lib/cgi-bin`
    or `/var/www/cgi` (the location may vary between distributions). In your code,
    specify the ProxyHost, changing the URL to point to your ProxyHost:


    ```

    OpenLayers.ProxyHost = ''/cgi-bin/proxy.cgi?url='';

    ```'
  merge: -1
  img_proc: true
- pgno: 344
  md: "3. Next, we'll need to add the Flickr domain to the allowed host variable in\
    \ the proxy file. Edit the proxy file and add the Flickr URL to the list of allowedHosts\
    \ (near the top of the file provided by OpenLayers). At the time of writing, the\
    \ last item in the list is 'vmap0.tiles.osgeo.org'. Add a comma after the last\
    \ item and then add 'api.flickr.com' to the list:\n\n```\nallowedHosts = [ ...,\
    \ 'vmap0.tiles.osgeo.org', 'api.flickr.com']\n```\n\n4. Lastly, we'll just change\
    \ the URL that the vector layer points to. In the protocol object in the vector\
    \ layer, we'll need to change the url value and add a params object which specifies\
    \ additional GET variables that will be appended to the URL call. In this case,\
    \ we'll want to specify the format and tags params:\n\n```\n...\nprotocol: new\
    \ OpenLayers.Protocol.HTTP({\n    url: 'http://api.flickr.com/services/feeds/geo/',\n\
    \    params: {'format':'kml', 'tags':'bird'},\n...\n```\n\n5. That's it! Now,\
    \ assuming you've set up the ProxyHost properly, you should see nearly the same\
    \ thing as before. The only difference is the data is likely to be different,\
    \ as you're now tapping into the stream in real time.\n\n# What Just Happened?\n\
    \nWe just used a ProxyHost and pointed our vector layer to the actual Flickr API\
    \ URL. Why didn't we do this at first? Again, to cut down on the things we need\
    \ to worry about when developing the application. Now that we've got a little\
    \ bit of interactivity and a live URL, let's take it a step further.\n\n# Wrapping\
    \ up the application\n\nShowing bird pictures from around the world is nice—but\
    \ what about giving users the ability to show a photo with any tag they want?\
    \ That's what we'll do next.\n\n# Recap\n\nSo far, we've created a map that lets\
    \ users interact with Flickr data. As far as we're concerned, we're more or less\
    \ done with the interaction part. Now we'll focus on changing the 'data source'\
    \ part. Currently, we're only asking for photos with the tag bird, but we want\
    \ to allow that to be any tag."
  merge: -1
