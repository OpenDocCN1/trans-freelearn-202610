- pgno: 42
  md: 'This starts the body tag. When the page is finished loading, via the `onload=''init();''`
    attribute in the `body` tag, it will call the JavaScript `init()` function. We
    have to wait until the page loads to do this because we cannot use the map div
    (or any HTML element) until the page has been loaded. Another way to do this would
    be to put the `init()` call in a JavaScript tag at the bottom of the page (which
    would not be called until the page loads), but both methods accomplish the same
    thing.


    When browsers load a page, they load it from top to bottom. To use any **DOM (Document
    Object Model)** elements (any HTML element on your page) in JavaScript, they first
    have to be loaded by the browser. So, you cannot reference HTML with JavaScript
    before the browser sees the element. It''d be similar to trying to access a variable
    that hasn''t yet been created. Even though we have JavaScript code that references
    the `map_element` div at the top of the page, it is not actually executed until
    the page is loaded (hence the need for the `onload` and `init()` function call).


    **Line [30] and [31]:** `<div id=''map_element'' style=''width: 500px; height:
    500px''></div>`


    To make an OpenLayers map, we need an HTML element where the map will be displayed
    in. Almost always this element will be a `div`. You can give it whatever ID you
    would like, and the ID of this HTML element is passed into the call to create
    the map object. You can style the div however you would like—setting the width
    and height to be 100 percent, for instance, if you wanted a full page map. It
    would be best to style the elements using CSS, but styling the div in line like
    this works as well.


    **Lines [32] and [33]:** These lines finalize the page by closing the remaining
    tags.


    # Behind the scenes—Object Oriented Programming (OOP)


    Now, let''s talk about how this stuff works from a more theoretical and technical
    level. OpenLayers employs **Object Oriented Programming (OOP)** techniques, meaning
    that to use with the library, we create **objects** from built in **classes**
    that OpenLayers provides.


    What does this mean? You already are familiar with what classes and objects are,
    but you just may not know it. Think of the concepts of a **class** and **object**
    in terms of the parts of speech. For example, think of what the abstract idea
    of a noun means—a person, place, thing, or idea. Noun itself (the abstract idea)
    is a **class**. But the actual, concrete words that qualify as a noun are **objects**.'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# Interaction happens with objects


    Ironman and Batman are two separate words (or, in terms of OOP, two objects),
    but they belong to the same noun class. A class is primarily used to generate
    objects; we interact with objects. Consider these two sentences:


    > "Noun was in a fight with noun."


    > "Ironman was in a fight with Batman."


    Now, the second sentence is more of an actual sentence. We use the words Ironman
    and Batman in the sentence (which are objects; they are instances of the noun
    class). We don''t use noun (a class) in the sentence, because interacting with
    a class like this doesn''t make much sense. This is one of the important concepts
    of OOP—we interact with objects, and we generate objects through classes.


    # MadLibs


    Madlibs, for those unfamiliar with it, is a game where you are given text with
    some missing words. The point is to come up with words to fill in the blanks,
    but each blank can only contain a certain type of word (noun, adjective, verb,
    and so on). The type of word is a class and the actual word you insert is an object.


    # Time for Action – play MadLibs


    Finish this sentence, by replacing verb and noun with verb and noun ''objects'':


    I verb up to the noun. It''s about 7 or 8 o''clock. I looked at my noun. I was
    there, to verb on my throne as prince of noun(place).


    # What Just Happened?


    You just did a Madlibs, demonstrating some of the concepts of OOP. As you can
    see, it doesn''t make much sense to read the sentence as "I verb up to the noun".
    Since verb and noun are classes, we don''t use the actual term verb or noun in
    the sentence.


    So, the idea would be to generate separate objects, one of the class noun and
    one of the class verb. For example, the previous sentence could be completed like:
    "I pulled up to the house". Pulled and house are objects that are instances of
    the verb and noun classes, respectively.


    We use words that belong to those classes, which are objects. Another term used
    when referring to objects is instance, which is used to designate the class the
    object is derived from, for example, Frodo (a person / hobbit) is an instance
    of a noun.'
  merge: -1
  img_proc: true
- pgno: 44
  md: '# Programming with OOP


    The same concept applies to programming. The only thing we can really do with
    a class is to create an object from it. Objects are derived from classes—you can
    interact and do things with objects, but not with classes. So, in OpenLayers,
    we need to create objects from the built in classes to be able to really do anything.
    The main thing we need are map and layers objects. If we want to create an OpenLayers
    map, we need a map object, and we create it in the following manner:


    ```

    var map = new OpenLayers.Map( ... );

    ```


    The new declaration means that we want to create a new object from the OpenLayers.Map
    class. The ellipsis ( . . . ) in the parenthesis presents things we pass into
    the class to create our object, called arguments. Each class expects different
    arguments to be passed into it. It is similar to the Madlibs example—the noun
    class accepts only certain words. If we were to create a word object in JavaScript,
    the code may look something like this:


    ```

    var my_word_object = new Noun(''Ironman'');

    ```


    Here, we pass in ''Ironman'' to the noun class, and now we have our word object.
    Because the Noun class only accepts nouns, this would work fine. If we try to
    pass in a verb, for instance, it would not work because the noun class cannot
    accept things that are verbs. Similarly, the Map class expects different arguments
    to be passed into it than the Layer class does.


    # Subclasses


    There are also subclasses, which are classes derived from another class and inherit
    all the attributes from the ''base'' class it inherits from. Subclasses can also
    override properties and methods that they inherit.


    For instance, let''s say we have a Dog class that is a subclass of the Animal
    class. The Dog class would inherit all the attributes of the base Animal class—such
    as, perhaps, a speak method. Now, the Dog class would override the speak method
    and it would bark (or ''yap'' annoyingly) when called. The Dog class might also
    provide additional methods that weren''t in the base Animal class, such as, perhaps,
    a wag_tail method.'
  merge: -1
  img_proc: true
- pgno: 45
  md: '![](img/1b8cd151c9f278555f9cf255b20d244e_45_0.png)


    ''Base'' class and ''Subclasses'' are both classes; the terminology just helps
    to clear up what class inherits from what other class.


    There are many subclasses in OpenLayers, for example, the GoogleMap Layer class
    is a subclass of the base **Layer** class, and the **Navigation** control class
    is a subclass of the base **Control** class. Subclasses are still classes, and
    the exact same concept applies; we still need to generate objects from the class
    to use it.


    The previous section was just an introduction to OOP. While you don''t necessarily
    need to know a whole lot more about OOP concepts to use this book, a great resource
    to learn more about the concepts can be found at http://en.wikipedia.org/wiki/Object-oriented_programming.


    Classes are easy to spot in OpenLayers code. By convention, in OpenLayers (and
    many other places) class names are `CamelCased`, which means the first letter
    of each word is capitalized, while objects are not. For example, `MyClass` would
    be an example of a class name, while `my_object` would be an example of an object.


    # Now what?


    Our coverage of the sample code was not meant to be extremely thorough; just enough
    to give you an idea how it works. We''ll be covering OOP concepts in more detail
    throughout the chapters, so if anything is bit unclear, don''t worry too much.


    As OpenLayers is a library and provides functions for you, it is important to
    know what those functions are and what they do. There are many places to do this,
    but the best source is the API docs.'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# API docs


    The API documentation is always up to date and contains an exhaustive description
    of all the classes in OpenLayers. It is usually the best first place to go when
    you have a question. You can access the documentation at http://dev.openlayers.org/docs/files/OpenLayers-js.html.
    It is continually updated and contains a wealth of information. We will constantly
    refer to it throughout the book, so keep the link handy! Sometimes, however, the
    API docs may not seem clear enough, but there are plenty of other resources out
    there to help you.


    # Where to go for help


    Books are great, but they''re basically just a one way form of communication.
    If you have any questions that the book does not answer, Google is the best first
    place to go. Mailing lists and IRC are other great resources. Sometimes it''s
    hard to formulate the right question, but there is help!


    # This book''s website


    The extension website for this book can be found at http://vasir.net/openlayers_book.
    Current, up to date corrections and code fixes, along with more advanced tutorials
    and explanations, can be found there—and also on my blog at http://vasir.net/blog.
    You can also grab the code and more information about this book at Packt Publishing''s
    website for the book, located at https://www.packtpub.com/openlayers-2-1-javascript-web-mapping-library-beginners-guide/book.


    # Mailing lists


    The OpenLayers mailing list is an invaluable resource that lets you not only post
    questions, but also browse questions others have asked (and answered). There are
    two main OpenLayers news groups—Users and Dev. The Users list is where the majority
    of questions are asked. Dev is reserved for development of the OpenLayers library
    itself. If you have questions about how to use OpenLayers, they belong in the
    Users list, not the Dev list. You can subscribe to the mailing list at http://lists.osgeo.org/mailman/listinfo/openlayers-users.


    There are various ways to browse the content, and I prefer to use Nabble. You
    can view the lists at http://osgeo-org.1803224.n2.nabble.com/OpenLayers-f1822462.html.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '![](img/1b8cd151c9f278555f9cf255b20d244e_47_0.png)


    Please do a thorough search before posting questions, as it is likely that a question
    similar to yours has already been asked and solved. If you have a question about
    using OpenLayers, please use the User list. Please do not post questions to the
    Dev list, unless it has to do strictly with development of the OpenLayers library
    itself.


    When posting a question, please be as thorough as possible, stating your problem,
    what you have done, and the relevant source code (e.g. "I have a problem with
    using a WMS layer. I have tried this and that, and here is what my source code
    looks like..."). A good guideline for asking questions in a way that will best
    elicit a response can be found at http://www.catb.org/~esr/faqs/smart-questions.html.


    # IRC


    Internet Relay Chat (IRC) is another great place to go if you have questions about
    OpenLayers. IRC is used for group communication; a big chat room, essentially.
    If you have exhausted Google and the mailing list, IRC provides you with real
    time with other people interested in OpenLayers.


    Generally, the people who hang out in the OpenLayers chat room are very friendly,
    but please try to find an answer before asking in IRC. The server is irc.freenode.net
    and the chat room is #openlayers. You can download an IRC client online; a good
    Windows one is mIRC (http://mirc.com). More information about how to use IRC can
    be found at http://www.mirc.com/install.html.


    # OpenLayers source code repository


    Traditionally, OpenLayers has used SVN as its revision management system. At the
    time of writing, however, the source code repository location is hosted at GitHub.
    You can access the entire code repository at http://github.com/openlayers/openlayers.


    Feel free to download a copy and play around with it yourself. There is a process
    to actually get your code permanently added to the official source code base,
    but it cannot hurt to download a copy of the code base and look around it yourself
    to figure out how it''s really working!'
  merge: -1
