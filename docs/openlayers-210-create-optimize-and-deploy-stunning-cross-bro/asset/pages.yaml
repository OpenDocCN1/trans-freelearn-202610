    \ {\n    border:2px solid #454545;\n    padding:2px;\n}\n```\n\n7. Now we need\
    \ to start overriding the styles the control inherits from OpenLayers. First,\
    \ we'll need to get the relevant class names. We can use Firebug to see that the\
