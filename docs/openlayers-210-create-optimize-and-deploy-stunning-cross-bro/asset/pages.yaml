- pgno: 68
  md: '# What''s a layer?


    A layer is basically a way to show multiple levels of information independent
    of each other. Layers are not just a mapping or cartography concept; graphic designers
    and digital artists make heavy use of layers.


    Imagine a printed-out map of a city. Let''s say you also have two sheets of transparent
    paper. One sheet has blue lines that indicate bus routes, and the other sheet
    contains green lines that indicate bicycle routes. Now, if you placed the transparent
    sheet of paper with bicycle routes on top of the map, you would see a map of the
    city with the bicycle routes outlined.


    Putting on or taking off these transparent pieces of paper would be equivalent
    to turning a layer on or off. The order you place the sheets on top of each other
    also affects what the map will look like—if two lines intersect, you would either
    see the green line on top or the blue line on top. That''s the basic concept of
    a layer.


    # Layers in OpenLayers


    OpenLayers is a JavaScript framework, and as discussed earlier is built using
    Object Oriented Programming. When we want to actually create a layer, we create
    (or instantiate) an object from an OpenLayers Layer class.


    OpenLayers has many different Layer classes, each allowing you to connect to a
    different type of map server ''back end.'' For example, if you wanted to connect
    to a WMS map server, you would use the `Layer.WMS` class, and if you wanted to
    use Google Maps you''d use the `Layer.Google` class. Each layer object is independent
    of other layer objects, so doing things to one layer won''t necessarily affect
    the other.


    > How many layers can I have?

    > The safest maximum amount of layers you can have on a map at one time depends
    largely on the user''s machine (i.e., their processing power and memory). Too
    many layers can also overwhelm users; many popular web maps (e.g., Google and
    Yahoo!) contain just a few layers. If you need to use tons of layers (say, more
    than fifty), it might be a better idea to create/destroy them as necessary, as
    having too many layers may slow down your map on some machines.


    Whatever the purpose of your web map application is, you will need at least one
    layer to have a usable map. An OpenLayers map without any layers would be sort
    of like an atlas without any maps. You need at least one layer—at least one Base
    layer. All other layers that ''sit above'' the base layer are called Overlay layers.
    These are the two ''types'' of layers in OpenLayers.'
  merge: -1
  img_proc: true
- pgno: 69
  md: '# Base layer


    A base layer is at the very bottom of the layer list, and all other layers are
    on top of it. This would be our printed out map from the earlier example. The
    order of the other layers can change, but the base layer is always below the overlay
    layers. By default, the first layer that you add to your map acts as the base
    layer. You can, however, change the property of any layer on your map to act as
    the base layer (by setting the `isBaseLayer` property to `True`).


    You may also have *multiple* base layers. However, only *one* base layer can be
    active at a time. When one base layer is turned on, all the other base layers
    are turned off. Overlay layers (non base layers), however, do not behave this
    way—turning on or off overlay layers will not affect other overlay layers. Base
    layers are similar to radio buttons—only one can be active at a time. Overlay
    layers are similar to check boxes—you can have as many on or off as you''d like.


    ![](img/1b8cd151c9f278555f9cf255b20d244e_69_0.png)


    > At the time of writing, there was a discussion to remove the ''base layer''
    terminology and replace it with ''mutually exclusive layers.'' If this is the
    case when you are reading this, the ideas and concepts work the same as the base
    layer/overlay concept.


    # Overlay layers


    Any layer that is not a base layer is called an overlay layer. Like we talked
    about, the order that you add layers to your map is important. Every time you
    add a layer to the map, it is placed above the previous one.


    ![](img/1b8cd151c9f278555f9cf255b20d244e_69_1.png)


    > Throughout the rest of this book, we''ll be using the map we created in Chapter
    1''s example as a sort of template. The only thing that will change is that you
    will not be using the lines of code that create the WMS layer and add it to the
    map. You will need to delete those lines of code yourself, or refer to the template
    from the book''s website at `http://vasir.net/openlayers_book/`.


    # Time for Action – creating a map with multiple layers


    Let''s create a map with two WMS layers. One layer will act as our base layer,
    and the other will be an overlay layer containing labels for country, state, and
    city names.


    +   1. Create a copy of the file you made for the last example of Chapter 1 and
    remove the existing WMS layer code (or, use the template from `http://vasir.net/openlayers_book/`).
    You can name it whatever you''d like, but we''ll refer to it as `chapter3_ex1_wms_layers.html`.
    Make sure it is in the same directory as your `OpenLayers.js` file.'
  merge: -1
  img_proc: true
- pgno: 70
  md: '+   1. First we''re going to remove everything that was in the init() function.
    Your function should now look like this:

    +   ```

    +   function init() {

    +   }

    +   ```

    +   2. Next, inside the init() function, we''re going to setup our map object
    like before:

    +   ```

    +   map = new OpenLayers.Map(''map_element'', {});

    +   ```

    +   3. Now we''re going to create our first layer. We''ll use a WMS layer and
    ask the WMS server for the layer ''basic'' (a layer on the WMS service). We''ll
    also explicitly set it to be a base layer.

    +   ```

    +   var wms_layer_map = new OpenLayers.Layer.WMS(

    +     ''Base layer'',

    +     ''http://vmap0.tiles.osgeo.org/wms/vmap0'',

    +     {layers: ''basic''},

    +     {isBaseLayer: true}

    +   );

    +   ```

    +   4. Let''s create a second layer object now. It will also be a WMS layer. This
    time, we''re going to ask for a few different layers from the WMS service—a bunch
    of labels. We''re also going to set the transparent property to true, so the map
    images which the server sends back will be transparent. We''ll also set the opacity
    to be 50 percent (by setting the opacity to .5). This layer will be an overlay
    layer.

    +   ```

    +   var wms_layer_labels = new OpenLayers.Layer.WMS(

    +     ''Location Labels'',

    +     ''http://vmap0.tiles.osgeo.org/wms/vmap0'',

    +     {layers: ''clabel,ctylabel,statelabel'',

    +      transparent: true},

    +     {opacity: .5}

    +   );

    +   ```

    +   5. Time to add the layers to the map. We''ll use the addLayers function and
    pass in an array of layer objects.

    +   ```

    +   map.addLayers([wms_layer_map, wms_layer_labels]);

    +   ```

    +   6. Now, let''s add a Layer Switcher control that will show us the layers on
    the map.

    +   ```

    +   map.addControl(new OpenLayers.Control.LayerSwitcher({}));

    +   ```'
