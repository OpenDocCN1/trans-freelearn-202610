- pgno: 164
  md: '# OpenLayers.Control.NavigationHistory


    The **NavigationHistory** control stores information about, as you could guess,
    map navigation. It is actually a control that creates two children controls called
    `next` and `previous`. You do not need to access these child controls directly,
    you should usually only use the methods of the **NavigationHistory** control object
    itself. By calling the `nextTrigger()` or `previousTrigger()` functions, you can
    go forwards or backwards (if possible) through your navigation history.


    # NavigationHistory properties


    | Name | Type | Description | Default Value |

    |---|---|---|---|

    | limit | {Integer} | Specifies the limit of history states to store. | 50 |

    | nextStack | {Array} | Contains an array of next history states.

    Not used when instantiating an object. |  |

    | previousStack | {Array} | Contains an array of previous history states.

    Not used when instantiating an object. |  |


    # NavigationHistory functions


    There are two functions we can call to access the navigation history.


    +   - **nextTrigger()**: This function will call the child `next` control''s trigger()
    function (which can also be called via `nav_history_control.next.trigger()`).
    If there is a next position, it will move the map to the next position on the
    position stack.

    +   - **previousTrigger()**: This function will call the child `previous` control''s
    trigger() function (which can also be called via `nav_history_control.previous.trigger()`).
    If there is a previous position, it will move the map to the previous position
    on the position stack.


    # Time for Action – using the NavigationHistory control


    Let''s use the **NavigationHistory** control''s `nextTrigger` and `previousTrigger`
    methods to go through our navigation history.


    +   1. Open up the previous examples and enable Firebug. We''re going to create
    a **NavigationHistory** control object and add it to the map via the console.
    Enter and run the following code:


    ```

    var nav_history_control = new

    OpenLayers.Control.NavigationHistory();

    map.addControl(nav_history_control);

    ```'
  merge: -1
