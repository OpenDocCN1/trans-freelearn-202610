- pgno: 187
  md: '![](img/1b8cd151c9f278555f9cf255b20d244e_187_0.png)


    # What Just Happened?


    You probably have a good idea now of how the controls we just made work. Just
    as a quick recap, the following happens:


    +   1. The `custom_toggle_button` toggle control waits for the `activate` or `deactivate`
    events to be fired (these are custom OpenLayers events, not general JavaScript
    events like a mouse click). This is done by registering the events with `map.events.register`.

    +   2. When the `custom_toggle_button` control is clicked (which toggles it on),
    the `activate_control` event is detected and the corresponding `toggle_button_activate_func`
    function gets called.

    +   3. The `toggle_button_activate_func` function that gets called then adds an
    event listener to the map (with `map.events.register` again).

    +   4. This event listener will wait for a `click` (a mouse click, a general JavaScript
    event) and then fire off the `map_event_function` every time a click is received.

    +   5. When the `custom_toggle_button` control button receives a `deactivate`
    event (i.e., it is clicked and toggled off), the corresponding `toggle_button_deactivate_func`
    function is called.

    +   6. The `toggle_button_deactivate_func` function removes the previously added
    map event listener with `map.events.unregister`. Therefore, the listener is gone
    and mouse clicks on the map will no longer cause the `map_event_function` to be
    fired off.'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'And that''s about it!


    ![](img/1b8cd151c9f278555f9cf255b20d244e_188_0.png)


    > When using panels and controls inside panels, make sure that the controls get
    activated via `activate()` or the panels'' `activateControl()` methods. The control
    cannot be used if a control is not activated (or cannot be activated by the user
    by clicking on the control, for example).


    # Summary


    We covered a good deal in this chapter. We talked about the idea behind controls
    and how they are used in OpenLayers. We then demonstrated how to add controls
    to a map. We covered the Control class and its various subclasses in depth. We
    also went over how to set up panels and how to add controls to them. To finish
    the chapter, we provided an introduction to events and learned how to create our
    own custom controls.


    Even though we''ve been pretty thorough in this chapter, there''s still more to
    learn about controls—such as how to style them. In Chapter 9, on the Vector layer
    class, we''ll go over some Vector layer specific controls we neglected. This chapter
    was likely a lot to take in, but the next chapter will be a bit shorter. We''ll
    discuss styling controls using CSS, and we''ll make controls that actually look
    like they should be clicked, not just big green and blue squares.'
