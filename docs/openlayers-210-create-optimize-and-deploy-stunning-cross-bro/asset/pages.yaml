- pgno: 97
  md: '# Layer.TileCache


    The TileCache layer allows you to interact with MetaCarta''s TileCache, which
    is free open source software that caches WMS requests. TileCache provides enormous
    performance boosts because it caches requests to a WMS server. This means that
    once a request has been made, the response (the map image) is stored either on
    the server''s hard drive or in memory and is immediately returned to the client.


    The normal process of requesting a map image from a WMS server goes like this:


    +   1. Client sends request to WMS server, asking for a specific part of the map.

    +   2. WMS Server receives the request and generates an image based on the requested
    map extent.

    +   3. WMS Server returns the rendered map image to the client.


    The bottleneck is Step 2, the WMS server rendering the image based on the request.
    With caching (either through TileCache or by other means), the second step becomes
    a lot easier. With caching, the server only has to generate an image once, and
    then it saves it (in the hard drive or memory). So, instead of having to generate
    an image for every request, it simply grabs an image which it has already generated.
    This makes the request seem almost instantaneous, and most popular web maps use
    some form of caching—including Google Maps.


    We will be discussing TileCache a little more in the last chapter, where we talk
    about deploying and using OpenLayers in a production environment. The documentation
    for this layer class is at http://dev.openlayers.org/docs/files/OpenLayers/Layer/TileCache-js.html.
    For more information on TileCache, head to http://tilecache.org/.


    # Layer.Vector


    The vector layer is one of the more powerful features of OpenLayers. It allows
    us to draw points and polygons on the map, style them however we want, retrieve
    and use KML and other geo data formats, etc. The vector layer makes uses of Protocols
    (such as HTTP), Formats (such as KML), and Strategies (such as Clustering) to
    display and provide an interactive layer. The vector layer also allows us to create
    and edit vector features. In Chapter 9, our chapter on the Vector Layer class,
    we''ll go into far more detail.


    # Layer.VirtualEarth


    This layer allows us to interact with Microsoft''s VirtualEarth API. It works
    in a similar way to the Google Layer, so we won''t spend more time discussing
    it here. Chapter 6 will fully cover this layer class.'
  merge: -1
  img_proc: true
- pgno: 98
  md: '# Layer.WFS


    This is a class that is deprecated, so try to avoid using it, as it will soon
    no longer be supported. I wanted to explicitly mention it because it is on its
    way out, but I still see lots of code that uses it. WFS (Web Feature Service),
    allow us to interact with data that is stored on the server. If you would like
    to use WFS, the general procedure is to use the `Layer.Vector` class and use WFS
    as the format. We''ll be covering this in detail in Chapter 9, our chapter on
    the Vector Layer class.


    # Layer.WMS


    This is the Layer class we''ve been using throughout the book so far. It inherits
    from `Layer.Grid`, and is similar to other classes we''ve mentioned. WMS is a
    popular standard and the way we interact with it is similar to how we interact
    with other Layer classes. We will be using this class throughout the book, so
    you haven''t seen the last of it. Layer class documentation can be found at http://dev.openlayers.org/docs/files/OpenLayers/Layer/WMS-js.html.
    More information and specifications of the WMS protocol can be found at http://www.opengeospatial.org/standards/wms.


    # Layer.Yahoo


    This Layer class allows us to interact with the Yahoo! API. It works in a similar
    way to Layer.Google and Layer.VirtualEarth, and we''ll be covering it in more
    detail in Chapter 6. Documentation for this layer class is at http://dev.openlayers.org/docs/files/OpenLayers/Layer/Yahoo-js.html.
    The Yahoo! Maps API can be found at http://developer.yahoo.com/maps/.


    # Accessing layer objects


    The last topic to cover concerns the functions of the base Layer class. Before
    we do that though, let''s go over how to access layer objects in Firebug. We''ll
    be doing this often throughout the book, so it is quite important.


    # Time for Action – accessing map.layers


    Let''s jump in to using some of the Layer class functions.


    +   1. Open up the second WMS example, **chapter3_ex2_options_config.html** in
    Firefox. We won''t be editing the code yet.

    +   2. Enable Firebug and go to the Console panel.'
