    \ * 180) - 90),\n    (Math.floor(Math.random() * 180) - 90)\n);\nvar geom_2 =\
    \ new OpenLayers.Geometry.Point(\n    (Math.floor(Math.random() * 180) - 90),\n\
    \    (Math.floor(Math.random() * 180) - 90)\n);\n```"
