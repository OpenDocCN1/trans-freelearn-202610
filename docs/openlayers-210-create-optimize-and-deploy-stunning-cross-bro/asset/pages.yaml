- pgno: 198
  md: '# OpenLayers and CSS


    OpenLayers applies class names and IDs to most every HTML element it creates,
    so customizing your map''s UI is quite easy once we know how it generates class
    names and IDs. Before we talk about how to override styles though, we need to
    know where the style files themselves are.


    # Styling OpenLayers—using themes


    In OpenLayers, themes are used to control the appearance of your UI elements.
    A theme is comprised of a CSS file and any related user interface images. OpenLayers
    applies a lot of styles to your map by default, using a theme called `default`.
    Creating your own theme is easy though.


    If you want to create custom UI styles for your map, you''ll essentially need
    to either create a ''theme folder'' which will contain a CSS file and images for
    your UI controls to use (e.g., pan arrow images), or manually overwrite certain
    default styles. The theme folder can be anywhere you''d like, just keep in mind
    what its path is when referencing it in your HTML file.


    To use your own theme, you just need to do three things:


    +   1. After including OpenLayers in your page, add a link to your CSS file which
    includes your customized map styles.

    +   2. You must tell OpenLayers where to find the images you use for your map.
    To do this, specify the location of the folder your images are in (your theme
    folder) by adding the follow to your JavaScript code. The path is relative to
    the location of the file containing the JavaScript code:

    +   ```

    +   OpenLayers.ImgPath = ''path/to/your/theme_folder/'';

    +   ```

    +   3. Specify the location of your theme folder when creating your map object
    via the `theme` property. The path is relative to the location of the file containing
    the JavaScript code. For example:

    +   ```

    +   var map = new OpenLayers.Map(''map_element'', {theme:

    +   ''theme_folder''});

    +   ```'
  merge: -1
  img_proc: true
- pgno: 199
  md: '# Creating your own themes


    Now we know how to use themes, but how do we create a theme? Well, the answer
    for that is simple—we just create a CSS file, some images, and create a folder
    that will house them. The images will go in a folder called img inside your theme
    folder. Then, we just tell OpenLayers to use that theme. The expected structure
    of the theme folder may change with later versions of OpenLayers, so the best
    way to figure what images are provided by default (and their names) is to look
    in the default theme folder. You can find it in the theme | default folder of
    your downloaded OpenLayers folder.


    But the bigger question is how do we refer to the user interface elements? The
    answer lies in knowing how OpenLayers generates class names and IDs for the elements
    it creates.


    # OpenLayers—class names and IDs


    To style an element, you must refer to it. If we want to refer to a specific div,
    we need to know its class and/or it''s ID. OpenLayers generates class names and
    IDs, so we need to just know how the names are generated. The most common way
    is to style your controls using the generated class names.


    # Generated class names


    The class names that OpenLayers generates for your controls follow the form of


    ```

    .olControlControlNameExtra

    ```


    This means that .olControl is always at the beginning of the class name, and ControlName
    is the name of the control class itself. The Extra refers to any additional descriptions
    or elements of the control (such as ''Inactive'' and ''Active'' added after many
    controls, especially button controls).


    So, for instance, if we wanted to style the scale control line control, we would
    refer to it as


    ```

    .olControlScaleLine

    ```


    As we''ve encountered before, for button type controls we add ''Inactive'' or
    ''Active'' at the end. Other controls, such as the OverviewMap control, also contain
    an OverviewMapElement class name—the element refers to the generated HTML container
    of the overview control. There are other similar cases, such as the LayerSwitcher
    control. A quick way to figure out the class name of an element is to use Firebug
    to inspect your page and find the element.


    We''ll go over the class names of common controls soon, but first let''s talk
    about another way to reference your control elements: by ID.'
  merge: -1
  img_proc: true
- pgno: 200
  md: '# Generated IDs


    Referring to control elements by class name is the preferred way of styling controls,
    but styling by ID is also possible. There are two ways to accomplish this:


    +   - **Wrong way**: Using the generated ID. The ID is generated in the form of
    `OpenLayers.Control.ControlName_XX` where `XX` is a number that is assigned based
    on various things, such as control order. The number is likely to change based
    on how you make your map. So, if you use it in your style declarations and the
    ID changes, then the style will no longer be applied.

    +   - **Right way**: Passing in an ID when creating the control and referring
    to it - in other words, when you create a new control, pass the `id` property
    with some string value which you will use as the element''s ID. This way, we don''t
    have to worry about the generated `XX` numbers changing, and we can be sure what
    the ID will be.


    Alright, so we know how to refer to elements now, and how OpenLayers generates
    class names and IDs, so let''s take a look at an example to solidify the concepts.


    # Time for Action – styling controls


    Let''s work with styling some OpenLayers controls. We won''t be creating a theme
    here; instead, we''ll just link to an external CSS file which will overwrite the
    default styles of the elements we wish to style.


    +   1. Let''s start off with creating a new page. We''re going to also put all
    our custom styles in a file called **control_style.css**. So, whenever we add
    a style, be sure to put it in the **control_style.css**. Also, make sure to include
    the CSS file in the `<head>` section with:

    +   ```

    +   <link rel=''stylesheet'' href=''control_style.css'' />

    +   ```

    +   2. Now, let''s create our map object. We''ll specify the controls array when
    we instantiate it since we do not want the **PanZoombar** control in this example.
    We also are *not* using a custom theme (we are just overriding styles with the
    external CSS file), but if we were we would specify the `theme` property as well.

    +   ```

    +   map = new OpenLayers.Map(''map_element'', {

    +     controls: [new OpenLayers.Control.Navigation()]

    +   });

    +   ```

    +   3. Alright, let''s create some controls. We''ll go over each control individually
    so we can see all the steps involved. First, let''s create a **ScaleLine** control.
    In our JavaScript code, use the following to create a default **ScaleLine** control
    object:

    +   ```

    +   map.addControl(new OpenLayers.Control.ScaleLine());

    +   ```'
  merge: -1
  img_proc: true
- pgno: 201
  md: "4. Now, let's apply some style to it. Because we haven't passed in a class\
    \ name or ID, we'll use the class name that gets automatically generated. This\
    \ is a standard control that does not have any 'active' or 'inactive' states,\
    \ so we can just use the name generated by default, olControlScaleLine. In your\
