- pgno: 348
  md: '# Deploying an application


    What does it mean to **deploy** an OpenLayers (or any other) application? Basically,
    deploying something means that we''re switching from a development mode to a production
    mode; we''re releasing something for the rest of the world to see.


    The production application should be as fast and bug free as possible. Because
    we want the production version to be accessed as quickly as possible, this will
    often include removing things we used in the development environment and tweaking
    the production environment to better handle a lot of users. It also means using
    files that are as small in size as possible. One of the first things we should
    do to deploy our application is to use the OpenLayers build script to create a
    library file which is much smaller in file size.


    ![](img/1b8cd151c9f278555f9cf255b20d244e_348_0.png)


    > There are many other things we can do to better prepare our production environment,
    such as using caching as well as combining and minimizing our JavaScript files.
    These, and other practices, are outside the scope of this book, but further information
    can be found on the book''s website at http://vasir.net/.


    # Building the OpenLayers Library file


    OpenLayers provides an easy way to configure the library file that gets included
    in your page. Throughout the book, we''ve been including a file called `OpenLayers.js`,
    which is a file that contains *all* the functionality (classes, functions, and
    so on) that OpenLayers provides. So far, this has been great—we''ve been developing
    up to this point, so we want to be sure that we have access to all the classes
    that we may use. What''s my point here?


    # Always try to serve small files


    Well, the `OpenLayers.js` file we''ve been using is around 920 KB! That''s almost
    a megabyte—quite a large file to load, especially since it contains only JavaScript
    code. Even though large file sizes aren''t as much of an issue as they were years
    ago, when everyone was on slower connections, a one megabyte JavaScript file in
    a production environment is something we want to avoid if at all possible.


    We want all our files in a production environment to be as small as they can absolutely
    be. This will allow users to download the files faster (since there is less to
    download) which decreases the page''s loading time (saves on bandwidth expenses).
    Faster page loads (even if the speed is only perceived) will greatly enhance the
    user''s experience. Fortunately, we can greatly reduce the size of the OpenLayers
    library file with a build tool provided by OpenLayers.'
  merge: -1
  img_proc: true
- pgno: 349
  md: '# Using the OpenLayers build file


    When you download the OpenLayers archive file, there is a folder inside it called
    as `build`. Inside that, there is a file called `build.py`, which is a python
    script that creates an `OpenLayers.js` file based on a separate build configuration
    file. Building the library this way is called a **single file build**, as all
    the JavaScript code behind OpenLayers is contained in a single file.


    So, what we can do is tell the build script to create an `OpenLayers.js` file
    that includes *only* the classes our application needs. This means that we can''t
    access other classes, but in a production environment we won''t need to, as the
    code won''t be changing—that''s what development is for. The benefit to doing
    this is because if the file has less code in it, the file size will be smaller.


    # Configuring the build script


    When the build script runs, it looks for a configuration file to determine which
    classes to include and exclude when creating the `OpenLayers.js` file. There are
    two configuration files OpenLayers ships with by default:


    +   - **full.cfg:** Causes the build script to include everything

    +   - **lite.cfg:** Includes just a minimal amount of classes to create a WMS
    or tiled layer, and does not include controls


    You can create your own files by copying one of these files and specifying the
    files you want to include. When creating your own build configuration file, you
    must include at least the section labeled `[first]` from the `full.cfg` or `lite.cfg`
    files.


    The `[include]` section specifies what files should be added to the `OpenLayers.js`
    output file. If left blank, *all* files will be included. Otherwise, only files
    specified in this section get included. To find out what files should be included
    here, look at your code and whenever you see a reference to the class (e.g., when
    calling `new OpenLayers.Classname`), it means you''ll need to include that class
    here.


    > The build script will automatically look for class dependencies, so you do not
    need to specify a parent class. For example, if you wish to include an individual
    control class, you can specify that class name and the build script will automatically
    include the base `Control.js` file.


    The `[exclude]` section will be read in if the `[include]` section is left blank.
    These are classes that will *not* be included in the final build file. However,
    if you specify classes in the `[include]` section, this section will be ignored
    and only the classes in the `[include]` section will get included.'
  merge: -1
  img_proc: true
- pgno: 350
  md: "# Time for Action – building a Config file\n\nLet's take a look at how to write\
    \ a build config file.\n\n+   1. Copy the `lite.cfg` file found in the build directory\
    \ and name the copied version `example_1.cfg` (or whatever you'd like, but that's\
    \ what we'll refer to it as).\n+   \n+   2. Let's manually specify some files.\
    \ We'll add in a couple controls. Add in the following and then save the file.\
    \ The full file should look like this:\n\n```\n# Config File\n[first]\nOpenLayers/SingleFile.js\n\
    OpenLayers.js\nOpenLayers/BaseTypes.js\nOpenLayers/BaseTypes/Class.js\nOpenLayers/Util.js\n\
    [last]\n[include]\nOpenLayers/Map.js\nOpenLayers/Layer/WMS.js\nOpenLayers/Control/LayerSwitcher.js\n\
    OpenLayers/Control/Navigation.js\nOpenLayers/Control/Scale.js\n[exclude]\n```\n\
    \n# What Just Happened?\n\nWe just created a configuration file for our build\
    \ named `example_1.cfg`. We'll be using this file to build the `OpenLayers.js`\
    \ file. Notice that we did not have to include the base `Control.js` class—the\
    \ build script will automatically look for and include the dependencies.\n\n#\
    \ Pop Quiz – using the Build script\n\nNow that you know how to use the build\
    \ script, can you come up with some reasons why you think using it would be a\
    \ good idea? What are some of the benefits of using it? What would be a downside\
    \ of using it?"
  merge: -1
  img_proc: true
- pgno: 351
  md: '# Running the build script


    To build the `OpenLayers.js` file, we must run the `build.py` script. This will
    require Python installed on your computer, which can be downloaded for free at
    `http://www.python.org/`—download either the 2.6 or 2.7 version.


    When the script is run, it will look for a configuration file and build a combined
    `OpenLayers.js` file depending on the configuration file. It will automatically
    include the class dependencies. Lastly, it will also `minify` (remove whitespace
    and unnecessary characters) the combined JavaScript code and create an `OpenLayers.js`
    file in the build directory. From there, you can copy the file and use it in your
    production code.


    To run the script, on Linux you can simply `cd` into the directory and run:


    ```

    ./build.py config_file.cfg

    ```


    Where `config_file.cfg` is optional. If not included, the `full.cfg` file will
    be used.


    On Windows, you can use the command prompt to `cd` into the directory and run
    the build file the same way. You can also hit Start then select Run and copy the
    location of the `build.py` file from the Windows Explorer''s address bar and paste
    it, along with the name of the config file. For example,


    ```

    c:\users\your_name\Download\OpenLayers\build\build.py config_file.cfg

    ```


    # Time for Action – running the Build script


    Let''s take a look at how to run the script now.


    +   1. Execute the build script with the config file we created in the previous
    example. Depending on your operating system (refer to the commands we just talked
    about):

    +      `./build.py example_1.cfg`

    +   2. You should see the output after running the command which informs you what
    the script is doing. In this case, it merged a total of 34 files and the final
    file size was just over 160 KB. That''s a *huge* decrease from the original 920
    KB!


    # What Just Happened?


    We just run the build script and an `OpenLayers.js` file was produced. Depending
    on your own application, you would create a build script and specify the classes
    your code uses. Then, you would run the build script with that configuration file
    and copy the outputted `OpenLayers.js` file over to your production code base.


    Doing it this way, you cut down the time users have to wait to load your page,
    as the file size will be smaller and take less time to download.'
  merge: -1
  img_proc: true
