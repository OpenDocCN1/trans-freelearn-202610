- pgno: 345
  md: "An important concept in application development is to keep things modular.\
    \ This basically means that we try to write out applications in such a way that\
    \ we can take out and put in different parts without drastically changing the\
    \ rest of our code. In this case, we're going to leave the interaction part of\
    \ our code alone (what we've done so far at least) and focus mainly on the code\
    \ that retrieves data.\n\n# The plan\n\nWhat needs to happen? Well, let's think\
    \ through this. We want the user to be able to specify any tag they want. We want\
    \ to allow multiple tags. This means we'll need to change the URL that the vector\
    \ layer is pointing to, but only after they specify the tags. We'll be able to\
    \ do this by changing the params property of the vector layer's protocol object.\
    \ Right now, the tags is hard-coded as 'bird', but this will be a variable based\
    \ on user input.\n\n# Changing the URL\n\nSo, we know we need to allow a variable\
    \ which specifies the tags parameter in the URL to be based on user input. We'll\
    \ need to create an input box that will allow the user to specify tags. We'll\
    \ also have a submit button that will, when clicked, call a function that updates\
    \ the vector layer's URL with the specified parameters.\n\n# Time For Action –\
    \ adding dynamic tags to your map\n\nLet's add some more interaction to our map\
    \ now. We'll add an input box that will change the requested Flickr data based\
    \ on the user's input.\n\n+   1. Open up the previous example, we'll be adding\
    \ to it. First, we'll need to add an input box and button to the HTML page. We'll\
    \ create a div that holds them and place it right next to the map. Right after\
    \ the map div, add the following:\n+   \n+   ```html\n+   <div id='input_wrapper'\
    \ style='position:absolute; left:610px; top:0;'>\n+       <input type='text' id='input_tags'\
    \ value='bird' />\n+       <input type='button' id='input_submit' value='Show\
    \ Data' />\n+   </div>\n+   ```\n+   \n+   2. Next, we'll need to create a function\
    \ that will get called when the input_submit button is clicked. This function\
    \ does three things. First, it will set the tags parameter of the vector layer\
    \ to be equal to whatever value is in the input_tags input box. Secondly, it will\
    \ call the vector layer's refresh() method which updates the vector layer and\
    \ makes a new request for data based on the new parameters. Lastly, it will clear\
    \ out the photo_info_wrapper div's HTML. You can add this at the bottom of the\
    \ init() function.\n\n```\n<div id='input_wrapper' style='position:absolute; left:610px;\
    \ top:0;'>\n    <input type='text' id='input_tags' value='bird' />\n    <input\
    \ type='button' id='input_submit' value='Show Data' />\n</div>\n```"
  merge: -1
  img_proc: true
- pgno: 346
  md: "```\nfunction update_vector_layer() {\n    //Change URL based on input tags\n\
    \    vector_layer.protocol.options.params['tags'] = document.getElementById('input_tags').value\n\
    \n    //Refresh the layer with the new params\n    vector_layer.refresh();\n\n\
    \    //Lastly, clear out the div that shows photo info\n    document.getElementById('photo_info_wrapper').innerHTML\
    \ = '';\n}\n```\n\n3. Lastly, we'll need to make the input_submit button call\
    \ the function when it is clicked. Now, we're going to be using JavaScript's built\
    \ in event handling— but it's quite similar to what we do in OpenLayers. We just\
    \ call the addEventListener method of an element. To get that element, we'll use\
    \ document.getElementById like we've been doing throughout the book. When calling\
    \ it, we pass in the event type ('click' in this case), the name of a function\
    \ to call, and a Boolean that specifies how the event propagates (if you're not\
    \ sure about this, just leave it as false).\n\n```\ndocument.getElementById('input_submit').addEventListener(\n\
    \    'click',\n    update_vector_layer,\n    false);\n```\n\n4. Open up the page\
    \ and you should see an input box next to the map. When you change the value and\
    \ hit the button next to it, the update_vector_layer function will get called\
    \ and refresh the vector layer. Try typing in various tags (or multiple tags separated\
    \ by a comma) and hitting the button:"
