    # What Just Happened?


    We just demonstrated the differences between `removeFeatures` and `destroyFeatures`.
    The former removes the features from the layer, while the latter does the same
    and destroys the feature itself so it cannot be added to the map again.


    Let''s continue.


    # Vector Layer methods (Continued)


    +   - **drawFeature(feature, style)**: This will draw / redraw a passed in feature
    to the layer. You should only use this function if the feature''s style has changed—it
    will not add a feature to the layer, and will only work after a feature has been
    added. The `feature` parameter is the feature you wish to draw, and the `style`
    parameter is an optional style `{Object}`. If no style is passed in, the layer''s
    default style is used.

    +   - **eraseFeatures(features)**: This function takes in an array of feature
    objects and erases them from the map. It does *not* remove the features from the
    layer object, nor does it destroy the feature object itself. Using this function,
    you can remove the feature from the map, but retain the feature in the layer''s
    feature list—then you can pass the erased feature into the `drawFeature` method
    to reshow it.

    +   - **getFeatureById(featureId)**: This function accepts a `{String}` consisting
    of a feature ID. It will return a `{OpenLayers.Feature.Vector}` object (a feature
    object) that corresponds to the passed in ID—if none is found, it will return
    `null`. The ID, if you do not set it when creating a feature object, is an automatically
    generated string that will be something like `OpenLayers.Feature.Vector_42`—the
    number is also essentially random, so you will likely only need to use this function
    if you set the ID of a feature when creating it. Otherwise, you may want to use
    the `getFeatureByFid` method.

    +   - **getFeatureByFid(featureFid)**: This function is similar to the `getFeatureById`
    function, but looks for a FID instead of an ID. The FID is a string that normally
    specifies the index of the feature in the `features` array (and it may have to
    be set manually if not loading data from external sources). Like `getFeatureById`,
    it accepts a `{String}` consisting of a feature Fid. It will return a `{OpenLayers.Feature.Vector}`
    object (a feature object) that corresponds to the passed in FID—if none is found,
    it will return `null`.'
