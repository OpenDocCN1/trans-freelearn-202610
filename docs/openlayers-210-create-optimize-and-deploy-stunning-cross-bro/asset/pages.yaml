  md: "```\nroundedCorner: false\n})) ;\n```\n\n6. Let's create the ex3_layerswitcher_style.css\
    \ file now. We'll specify the control's style here. As we have manually specified\
    \ the div property when creating the control, the first thing we'll style is the\
    \ div we passed in (with an ID of layer_switcher_control). Because we passed this\
    \ in ourselves, OpenLayers does not apply any default styles to it. Let's give\
