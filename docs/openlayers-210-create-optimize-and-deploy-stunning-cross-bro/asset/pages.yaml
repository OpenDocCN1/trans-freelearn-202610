    \ Vector Layer's methods.\n\n# Vector Layer methods (Continued)\n\n+   - **removeFeatures(features,\
    \ options)**: This function will remove features from the vector layer by erasing\
    \ the passed in features and removing them from the layer (but the features themselves\
    \ are *not* destroyed). Two events are triggered for each feature—`beforefeatureremoved`\
    \ and `featureremoved`.\n+   \n+     This function takes in two parameters, like\
    \ the `addFeatures` method. The `features` parameter is an `{Array{OpenLayer.Feature.Vector}}`,\
    \ and options is an anonymous `{Object}`. The `options` parameter can accept a\
    \ `silent` property which is a `{Boolean}` with a default value of `false` which\
    \ determines if the events will be triggered or not.\n+   - **removeAllFeatures(options)**:\
    \ Calling this function will remove all features from the map. Like the method\
    \ above, it will not destroy the features, but it will erase them from the map\
    \ and remove them from the layer's feature array. It takes in one optional `options`\
    \ parameter that can accept a `silent` property, if set to `true`, will suppress\
    \ events from triggering.\n+   - **destroyFeatures(features, options)**: This\
    \ function will erase and destroy any features that get passed in. The difference\
    \ between this function and `removeFeatures` is that `destroyFeatures` will both\
    \ remove the features from the layer *and* destroy the features themselves—so\
    \ you cannot add a feature back to the map that has been destroyed. It takes in\
    \ two parameters—both are optional. If the `features` parameter is not passed\
    \ in, *all* the features of the layer will be destroyed.\n\n# Time for Action\
    \ – destroying features\n\nLet's demonstrate the difference between `removeFeatures`\
    \ and `destroyFeatures`.\n\n+   1. Open up the first example from the chapter.\
    \ We'll use Firebug again."
