- pgno: 73
  md: '# Layer.WMS class


    There''s a lot of information in the API docs, but let''s look specifically at
    the section titled **Constructor**. This will tell us how to create a WMS layer
    object. The process varies for different types of layer but let''s focus on the
    WMS class for now. Take a look at the **Parameters** sub section—this specifies
    what arguments this specific class expects to take in:


    | Parameters | Description |

    |------------|-------------|

    | name | {String} A name for the layer. |

    | url | {String} Base url for the WMS (e.g. http://vmap0.tiles.osgeo.org/wms/vmap0).
    |

    | params | {Object} An object with key/value pairs representing the GetMap query
    string parameters and parameter values. |

    | options | {Object} Hashtable of extra options to tag onto the layer. |


    The parameters tell us about the order of arguments to pass in, and what each
    argument means. The word in between the curly brackets ({ }) refers to the data
    type of parameter. So, `{string}` means the parameter should be a string.


    Let''s take a look at the `wms_base_layer` layer instantiation code and see how
    we use the four parameters.


    # WMS layer parameters:


    The four WMS layer parameters are as follows:


    # Name


    The first parameter is the layer''s **name** and it should be a string. We pass
    in `''Base Layer''`. Notice how we enclose `Base Layer` in quotes—this is how
    we signify that it is a string. The title can be anything that you like—if you
    have a layer switcher control, the title will show up in it. Keep in mind that
    there is a comma after the closing quote, which means that we''re done with this
    first argument and are ready to proceed to the next one.


    This **name** parameter is present in nearly all Layer classes.


    # URL


    The **URL** is the second parameter, and it should also be a string. It specifies
    the URL of the web map server. We pass in `''http://vmap0.tiles.osgeo.org/wms/vmap0''`.
    This URL parameter is present in most Layer classes.'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# Params


    Params is the third parameter, and it is an anonymous objector consisting of key:value
    pairs. This parameter specifies server side settings that affect the map image,
    which the WMS server returns. The key:value pairs you pass in here will be appended
    (more or less) to the URL that OpenLayers generates when it makes requests to
    the map server.


    For example, in the previous example when creating the `wms_layer_labels` we passed
    in `{layers: ''clabel,ctylabel,statelabel''}`. In this case, we are asking the
    WMS server to give us back a map image with the server side layers called `''clabel,ctylabel,statelabel''`
    turned on. We specify multiple server side layers—it doesn''t matter what or how
    many server side layers we request though, because the WMS Layer object on the
    client side is still considered by OpenLayers to be a single layer object. This
    params parameter is present in most Layer classes.


    # Possible params keys and values


    The possible keys and values for this params object depend on the map server you
    are working with. Unfortunately, covering them all for all layer types is outside
    the scope of this book. We''ll only be using a few WMS parameters throughout this
    book—layers (to specify what layers the WMS service should give us), transparent
    (to ask for transparent images, for things such as label layers), and srs (to
    specify the projection).


    For now, at least, our main concerns are just figuring out what layer names are
    on the WMS server. To figure this out, you can issue a GETCAPABILITIES request
    in the URL (SERVICE=WMS must also be specified). For instance, to get the possible
    layers from the WMS service we''ve been using so far go to the following URL:


    ```

    http://vmap0.tiles.osgeo.org/wms/vmap0?SERVICE=WMS&REQUEST=GETCAPABILITIES

    ```


    If you are interested in more information about WMS, the specifications can be
    found at


    ```

    http://www.opengeospatial.org/standards/wms.

    ```


    # Options


    Options is the last parameter and is an anonymous object that specifies the layer
    object''s settings. You are not required to pass in this parameter.


    The options object contains properties for the client side OpenLayers Layer object.
    These are the settings for the layer object itself, so all Layer classes have
    this parameter. To define various properties of the OpenLayers Layer object, we
    use this options argument. Properties include settings such as isBaseLayer, opacity,
    and visibility. Since the layer properties are client side settings, the WMS server
    (or whichever map server the layer uses) doesn''t know about them.'
  merge: -1
  img_proc: true
- pgno: 75
  md: "The possible values are, basically, anything that you find in the API documentation\
    \ for either the base **Layer** class (at http://dev.openlayers.org/docs/files/OpenLayers/Layer-js.html),\
    \ or the specific subclass you're working with, e.g., the **WMS Layer Class**,\
    \ at http://dev.openlayers.org/docs/files/OpenLayers/Layer/WMS-js.html.\n\n![](img/1b8cd151c9f278555f9cf255b20d244e_75_0.png)\n\
    \n> You can use this **options** parameter to initialize any of the layer parameters\
    \ described in the API—the best way to get more familiar with it is to just play\
    \ around with the different properties listed in the docs. The Layer class docs\
    \ can be found at http://dev.openlayers.org/docs/files/OpenLayers/Layer-js.html.\n\
    \n# Parameters versus arguments\n\nThese two terms are often confused and used\
    \ interchangeably (but usually, that's ok). **Parameters** are what the items\
    \ are called during the class or function definition, but when we call the function,\
    \ the actual values of the parameters are referred to as **arguments**. For example,\
    \ this is how we create a function in JavaScript:\n\n```\nfunction add_numbers(a,\
    \ b){\n  return a + b;\n}\n```\n\nThis is referred to as the `add_numbers` function\
    \ definition. Here a and b are referred to as **parameters**. Now, take a look\
    \ at how we call it:\n\n```\nvar the_sum = add_numbers(13, 37);\n```\n\nHere,\
    \ 13 and 37 are referred to as the **arguments**. In the `add_numbers` function,\
    \ 13 acts as a and 37 acts as b.\n\nBoth terms are technically talking about the\
    \ same thing. **Parameter** is the term to use when talking about function definitions,\
    \ and **argument** is the term to use when talking about function calls. The distinction\
    \ is sort of like that of a meteoroid (when it's in space), a meteor (when it's\
    \ in the atmosphere), and a meteorite (when it hits the ground)—these three terms\
    \ refer to the same object.\n\nNow, let's take a look at some of the different\
    \ arguments we can pass in when creating our layer objects."
  merge: -1
  img_proc: true
