- pgno: 35
  md: '![](img/1b8cd151c9f278555f9cf255b20d244e_35_0.png)


    # What just happened?


    We just created our first map using OpenLayers! If it did not work for you for
    some reason, try double checking the code and making sure all the commas and parentheses
    are in place. You can also refer to the Preface where a link to code samples used
    in the book is given. By default, we''re given a few controls if we don''t specify
    any. We will use the file we created as a template for many examples throughout
    the book, so save a copy of it so you can easily reference it later.


    The control on the left side (the navigation buttons) is called the PanZoom control.
    You can click the buttons to navigate around the map, drag the map with your mouse/use
    the scroll wheel to zoom in, or use your keyboard''s arrow keys. We''ll cover
    controls in far greater detail in Chapter 6.


