- pgno: 176
  md: '# Panel properties


    | Name | Type | Description | Default Value |

    |---|---|---|---|

    | controls | {Array {OpenLayers.Control}} | Specifies an array of control objects
    that get added to the panel. As in the previous example, you can either instantiate
    objects in the call itself (via new OpenLayers.Control) or use a previously created
    object. When you create a panel, you need to either use this property to specify
    the controls the panel receives, or use the panel''s addControls method. Example:
    controls: [new OpenLayers.Control.Navigation(), new OpenLayers.Control.ZoomBox()]
    | [] |

    | autoActivate | {Boolean} | Determines if the panel should be activated when
    it is added to the map. If this is not set to true, you must call the panel''s
    activate() method before you use the panel. | true |

    | defaultControl | {OpenLayers.Control} | Specifies the default control to be
    activated. This should point to a control that the panel will or does own. Like
    in the example above, you should pass in a control object that has already been
    instantiated. If you instantiate an object when specifying the value, instead
    of passing in an already created one, nothing will happen because the default
    control would be pointing to a different object than one owned by the panel. Example:
    defaultControl: my_control_object | null |

    | saveState | {Boolean} | If this property is true, then the active state of the
    controls inside the panel (i.e., their state) will be saved if the panel is deactivated,
    and restored if it is activated. It will also override the defaultControl property
    (if set) after the first activation, restoring whatever controls were active instead.
    | false |'
  merge: -1
