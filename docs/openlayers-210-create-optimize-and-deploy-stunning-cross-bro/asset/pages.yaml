    \ see an animation when panning the map.\n\n```\nmap = new OpenLayers.Map('map_element',\
    \ {\n    panMethod: OpenLayers.Easing.Quad.easeInOut,\n    panDuration: 100\n\
    });\n```\n\n```\nmap.panTo(new OpenLayers.LonLat(-18,42);)\n```\n\n# What Just\
    \ Happened?\n\nWe just used the `panMethod` and `panDuration` properties to customize\
    \ our map's pan animations. Changing the `panDuration` will affect how long the\
    \ animation itself lasts, and changing the `panMethod` determines which type of\
    \ animation to use. By using these properties, you can mimic the way Google Maps\
    \ or other third party maps function.\n\n# Have a Go Hero – use different animation\
    \ types\n\nUsing what we learned from the previous section, try changing the `panMethod`\
    \ property to various different possible values (such as `OpenLayers.Expo.easeInOut`)\
