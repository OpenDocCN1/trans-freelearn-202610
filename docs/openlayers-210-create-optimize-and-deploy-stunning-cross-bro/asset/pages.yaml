- pgno: 114
  md: '# Latitude


    Latitude lines are imaginary lines parallel to the equator, aptly known also as
    ''Parallels of Latitude''. Latitude is divided into 90 ''degrees'', or 90 spaces
    (or cells), above and below the equator. -90° is the South Pole, 0° would be the
    Equator, and 90° is the North Pole.


    Each space, or cell, (from 42° to 43°, for example) is further divided into 60
    minutes and each minute is divided into 60 seconds. The minutes and seconds terminology
    has little to do with time. In the context of mapping, they are just terms used
    for precision. The size of a degree of latitude is constant. Because they measure
    ''north to south'', OpenLayers considers the y coordinate to be the latitude.


    # Longitude


    Longitude lines are perpendicular to the lines of latitude. All lines of longitude,
    also known as meridians of longitude, intersect at the North Pole and South Pole,
    and unlike latitude, the length of each longitude line is the same. Longitude
    is divided into 360 ''degrees'', or spaces. Similar to latitude, each space is
    also divided into 60 minutes, and each minute is divided into 60 seconds.


    As the space between longitude lines gets smaller, the closer you get to the poles
    the size of a degree of longitude changes. The closer you are to the poles, the
    shorter amount of time it would take you to walk around the earth.


    With latitude, it makes sense to use the equator as 0°, but with longitude there
    is no spot better than another to start the 0° mark at. So, while this spot is
    really arbitrary, the Observatory of Greenwich, England is today universally considered
    to be 0° longitude. Because longitude measures east and west, OpenLayers considers
    the x coordinate to be longitude.


    # Time for Action – determining LonLat coordinates


    Let''s take a look at a couple of examples on coordinates from our previous maps.


    +   1. Open up the final example from Chapter 1.

    +   2. Pan around the map in any direction. Then, in Firebug, type:

    +      `map.getCenter();`

    +   3. Depending on where you have panned, your output should read something like
    this:

    +      `lon=-72.8125, lat=19.6875`

    +   4. Now, open up the example from the beginning of this chapter.

    +   5. Pan around, and then in Firebug type:

    +      `map.getCenter();`'
  merge: -1
  img_proc: true
- pgno: 115
  md: '6. You should see something like:


    ```

    lon=-9397474.0038099,lat=3595597.9798909

    ```


    # What Just Happened?


    We just took a look at the longitude and latitude values for the center of the
    map in two different maps with different projections. When we call map.getCenter(),
    we get back an OpenLayers LonLat object.


    In the first map, the max extent of the map was between -180° and 180° for longitude,
    and between -90° and 90° for latitude. These are the values used by the EPSG:4326,
    and it is a longitude/latitude type of coordinate system. The values for longitude
    and latitude change in the second map because they are not in the same projection
    (they are in EPSG:900913).


    # OpenLayers projection class


    So far, we''ve been talking about the abstract idea of a projection. Let''s dive
    into OpenLayer''s Projection class, OpenLayers.Projection, which is what we use
    to actually handle projections. The Projection class relies on an external library
    called Proj4js, which can be found at http://proj4js.org. First, we''ll talk about
    what we can do without the proj4js library, and then talk about what we can do
    with it.


    # Creating a projection object


    To instantiate an object from the Projection class, the code would look like the
    following:


    ```

    my_proj = new OpenLayers.Projection(''EPSG:4326'', {});

    ```


    # Parameters


    Let''s take a look at the parameters for the Projection class.


    +   - **projectionCode: {String}**: A string of identifying the Well Known Identifier
    (WKID) for the projection, such as an EPSG code in the form of `EPSG:4326`.

    +   - **options: {Object}**: An optional object. For instantiating projection
    objects, it is very common to leave this out.


    When creating a map and specifying the projection property, you can either pass
    in a projection object (like the one created above), or pass a string containing
    the projection code. This string, such as EPSG:4326, is also known as an SRS code.
    When passing in a code, like we''ve done with all our examples so far, OpenLayers
    automatically turns it into a projection object for you.'
  merge: -1
  img_proc: true
- pgno: 116
  md: '# Functions


    The Projection class has a number of methods, including:


    | Function | Description | Parameters |

    |---|---|---|

    | getCode() | Returns a `{String}` containing the projection code, e.g., ''EPSG:4326''
    | - |

    | getUnits() | Returns a `{String}` the units string for the projection, e.g.,
    ''degrees''. If the Proj4js library is not included on your page, this will return
    null. | - |

    | addTransform(from, to, method) | Define a custom transformation function between
    two projections. This usually will not be necessary, especially if you are using
    Proj4js, unless you need to define a custom projection transformation. | from:
    `{String}` Source projection code

    to: `{String}` Destination projection code

    method: `{Function}` A function that transforms the source point to the destination
    point, leaving the original point unmodified. |

    | transform(point, source, destination) | Calling this function will transform
    the passed in point from the passed in source projection to the passed in destination
    projection. You can also pass in an `{Object}` as long as it contains x and y
    properties. This function will transform the point in place, meaning that the
    point you passed in will be transformed. If you need a copy of the point, you
    should first make a clone of it before calling transform() by calling the point''s
    clone() method. | point: `{Geometry.Point}` An object from the OpenLayers.Geometry.Point
    class, containing an x and y coordinate

    source: `{OpenLayers.Projection}` Projection object of the source projection

    destination: `{OpenLayers.Projection}` Projection object of the destination map
    projection. |'
  merge: -1
  img_proc: true
- pgno: 117
  md: "# Transforming projections\n\nTransforming a point means you take a coordinate\
    \ in one projection and turn it into a coordinate of another projection. Apart\
    \ from transforming EPSG:4326 to EPSG:900913 and vice-versa, OpenLayers does not\
    \ provide support for transforming other projections out of the box—to do transforms\
    \ of other projections, you'll need to include Proj4js (which can be found at\
    \ http://proj4js.org/).\n\nIn most scenarios, it is the job of the backend map\
    \ server to handle projection transformations, but often it's useful or faster\
    \ to do it on the client side (such as in the case of vector layer coordinate\
    \ transformations). Let's take a look at how to transform EPSG:4326 to EPSG:900913\
    \ with OpenLayers.\n\n# Time for Action – coordinate transforms\n\nProj4js is\
    \ not necessary for this example, as transforming between these two projections\
    \ is possible without Proj4js.\n\n+   1. Open up the previous example in Firefox.\
    \ We won't be modifying any code, so any page which includes the OpenLayers library\
    \ will be fine.\n+   \n+   2. Open Firebug. In the console, create two projection\
    \ objects:\n+   ```\n+   var proj_4326 = new OpenLayers.Projection('EPSG:4326');\n\
    +   var proj_900913 = new OpenLayers.Projection('EPSG:900913');\n+   ```\n+  \
    \ \n+   3. Now let's create a LonLat object which will contain a point in EPSG:4326\
    \ coordinates.\n+   ```\n+   var point_to_transform = new OpenLayers.LonLat(-79,\
    \ 42);\n+   ```\n+   \n+   4. And now let's transform it. We'll take it from EPSG:4326\
    \ (our source proj_4326 projection object) to EPSG:900913 (our destination proj_900913\
    \ projection object):\n+   ```\n+   point_to_transform.transform(proj_4326, proj_900913);\n\
    +   ```\n+   \n+   5. Finally, we'll print the new value:\n+   ```\n+   console.log(point_to_transform);\n\
    +   console.log(point_to_transform.lon, point_to_transform.lat)\n+   ```\n+  \
    \ \n+   6. Your output should read something like:\n+   ```\n+   lon=-8794239.7714444,lat=5160979.4433314\
    \ { lon=-8794239.7714444, more...}\n+   -8794239.7714444 5160979.4433314\n+  \
    \ ```"
  merge: -1
  img_proc: true
- pgno: 118
  md: '# What Just Happened?


    We just transformed a point in the EPSG:4326 projection to a point in the EPSG:900913
    projection. Let''s take a closer look at the transform method we called on the
    point_to_transform object.


    ```

    ```

    point_to_transform.transform(proj_4326, proj_900913);

    ```

    ```


    This will transform the original point from the proj_4326 projection to the proj_900913
    projection. Notice, we aren''t calling the transform() function of a projection
    object, but of a LonLat object. The transform() function''s definition for an
    OpenLayers.LonLat object is as follows:


    | Function | Description | Parameters |

    |---|---|---|

    | `transform(source, dest)` | This function transforms a point in place, meaning
    that the original point will be transformed; hence the original value will be
    lost. If you need a copy of it, use the `.clone()` method first. It returns itself.
    | `source`: Source projection


    `dest`: Destination projection. |


    In this case, our source projection is in EPSG:4326, and our destination projection
    is in EPSG:900913. Keep in mind however, that EPSG:4326 and EPSG:900913 are the
    only two projections you can do transforms on with OpenLayers if you do not include
    the Proj4js library.


    > > When creating your map, all your raster layers (image-based layers; nearly
    every layer except the vector and image layer) must be in the same projection
    as your map. You can do projection transformations with coordinates and the vector
    layer, but once OpenLayers gets back an image from a map server it cannot reproject
    the image itself (that''s something the map server has to do).


    # The Proj4js library


    The Proj4js library allows you to transform the coordinates from one coordinate
    system into another coordinate system. The Proj4js website is located at http://proj4js.org.
    By just including the Proj4js library on your page (like you do with OpenLayers),
    you can do more transforms within OpenLayers. Not all EPSG codes are supported,
    but there are many and if your desired code is not supported you can add a projection
    definition for it.'
  merge: -1
  img_proc: true
- pgno: 119
