- pgno: 267
  md: "# Geometry class\n\nThe **Geometry** class is, more or less, the foundation\
    \ of the feature objects we've seen so far. Specifically, up to this point, we\
    \ have been using the `Feature.Vector` class as the base class for our feature\
    \ objects. We'll talk more about that shortly, but for now it is just important\
    \ to know that the `Feature.Vector` class uses the `Geometry` class to store geometry\
    \ information about a feature.\n\nBut what exactly is the **Geometry** class?\
    \ In a nutshell, it stores geographic information. Remember the earlier example\
    \ in this chapter where we added a feature. The code was:\n\n```\nvar feature_point\
    \ = new OpenLayers.Feature.Vector(\n    new OpenLayers.Geometry.Point(-72, 42)\n\
    );\n```\n\nWe passed in Geometry Point object (we'll get to what the subclasses\
    \ are in a minute). Now, if executed and looked at it on the map, we'd see a point\
    \ at the coordinate -72, 42. Then, if we get the feature information via something\
    \ like `map.layers[1].features[0]`, we'd see information about that feature. When\
    \ we look at it, we see a geometry property.\n\nExpanding it, or using `map.layers[1].features[0].geometry`,\
    \ we find out that it has a `bounds` property, along with `x`, `y`, and `ID` properties.\
    \ This is how feature store geographic information in a geometry object.\n\nLet's\
    \ take a look again at the code that instantiates a geometry object: `new OpenLayers.Geometry.Point(-72,\
    \ 42)`. As you might have guessed, we're using the Point subclass of the Geometry\
    \ class.\n\n# Geometry subclasses—Theory\n\nWhen working with the Geometry class,\
    \ we actually almost always use some subclass of it. What do we mean? Think about\
    \ the Layer classes we've used throughout the book—we've been using subclasses\
    \ of the base Layer class the entire time (`Layer.WMS`, `Layer.Image`, etc. are\
    \ all subclasses of the `OpenLayers.Layer` class).\n\nJust like how we work with\
    \ layers, we almost always work with `OpenLayers.Geometry` *subclasses* when we\
    \ want a Geometry object. So far, we've only been explicitly calling the `Geometry.Point`\
    \ subclass, which accepts a single X,Y coordinate and creates a geometry based\
    \ on the passed in coordinate. There are many more subclasses that let us do things\
    \ a bit more tricky than just working with points.\n\nBefore we cover the subclasses,\
    \ let's quickly go over some of the methods available to *all* of the subclasses\
    \ via the base `Geometry` class. All these methods are available to any Geometry\
    \ subclass, as all the subclasses inherit from the Geometry class."
  merge: -1
  img_proc: true
- pgno: 268
  md: '# Geometry class methods


    +   - **atPoint(lonlat, toleranceLon, toleranceLat)**: This will return a `{Boolean}`
    indicating whether the geometry object is at the passed in lonlat. The lonlat
    parameter is an `{OpenLayers.LonLat}` object containing a coordinate to check,
    and the toleranceLon, toleranceLat parameters specify a `{Float}` number which
    sets the threshold for the longitude and latitude, respectively. If a point lies
    within the threshold of the longitude and latitude, `true` will be returned—if
    not, `false` will be returned. The calculation which determines if the geometry
    is at the passed in point is an approximation based on the geometry object''s
    bounds.

    +   - **calculateBounds()**: Calling this function will recalculate the bounds
    of the geometry. It does not return anything. If you wish to see the geometry
    object''s bounds, see `getBounds()`.

    +   - **clearBounds()**: This function will turn the geometry object''s bounds
    object to null.

    +   - **clone()**: This function creates a copy of the geometry and returns a
    cloned `{OpenLayers.Geometry}` object.

    +   - **destroy()**: Calling this function will destroy the geometry object. Note—if
    you call this on a geometry object that is already part of a feature object, it
    will not remove the geometry object from the map.

    +   - **distanceTo(geometry, options)**: Calling this function will calculate
    the nearest distance between the current geometry object and a geometry object
    passed in. The options parameter can contain additional calculation options, which
    vary depending on the geometry subclasses. There is a details option which is
    a `{Boolean}` and can be specified for all subclasses. If details is set to `true`
    in the options parameter, this function will return an `{Object}` containing the
    distance and x0, y0, and y1,y0 values which represent the coordinates of the two
    geometry objects. If details is not set (or set to `false`), this function will
    by default return a `{Number}` containing the distance. Take care to mind the
    units that the map is in.

    +   - **extendBounds(bounds)**: This function will extend the geometry''s bounds,
    including the passed in bounds object, which must be an `{OpenLayers.Bounds}`
    object. If the geometry does not have a bounds set when this function is called,
    then it will be set.

    +   - **getArea()**: Returns a `{Float}` containing the area the geometry object
    covers. This function is redefined in various subclasses, but can be called by
    all subclasses.

    +   - **getBounds()**: Returns the bounds of the geometry as an `{OpenLayers.Bounds}`
    object. If no bounds are set, the bounds are calculated. This will return the
    bounds for a single geometry object—if you want to get the bounds of all the features
    on your layer, see the Vector class'' getDataExtent method.'
  merge: -1
  img_proc: true
- pgno: 269
  md: "+   - **getCentroid()**: Returns a `{OpenLayers.Geometry.Point}` object containing\
    \ the center point of geometry object. This function is redefined in various subclasses,\
    \ but can be called by all subclasses.\n+   - **getLength()**: Returns a `{Float}`\
    \ containing the length the geometry object covers. This function is redefined\
    \ in various subclasses, but can be called by all subclasses.\n+   - **getVertices(nodes)**:\
    \ This function returns an `{Array}` of all the points in the geometry object.\
    \ It accepts a `{Boolean}` parameter which is True by default, which specifies\
    \ that all vertices should be returned. If it is set to false, then if the geometry\
    \ is a Line, this function will only return vertices that are not endpoints.\n\
    +   - **toString()**: Returns a WKT (Well-Known Text) `{String}` of the geometry\
    \ object. WKT is a markup language, similar to HTML or XML, which is used to represent\
    \ geometry objects. For example, when calling this function on a `Geometry.Point`\
    \ object with a coordinate of (-72, 42) would return the WKT string \"POINT(-72\
    \ 42)\". More information on WKT can be found at http://en.wikipedia.org/wiki/Well-known_text.\n\
    \n# Time for Action – using Geometry class methods\n\nLet's demonstrate some of\
    \ the methods we just talked about. These methods can be applied to any geometry\
    \ subclass—Point, Polygon, etc.\n\n+   1. Open up the first example from this\
    \ chapter. We'll use Firebug again to demonstrate the functions.\n+   2. Before\
