    ![](img/1b8cd151c9f278555f9cf255b20d244e_280_0.png)


    # What Just Happened?


    We just demonstrated how to use the SelectFeature control with some feature data.
    We''ll be doing much more with the SelectFeature control and features throughout
    the remainder of the book, so if you aren''t totally comfortable with it don''t
    sweat it too much. Try to create your own functions and features. To do that,
    you''ll need to know a little bit more about the SelectFeature class and what
    some of the properties of it are. Let''s quickly go over them.


    # Control.SelectFeature class


    First we''ll cover the properties then look at some methods of the SelectFeature
    class.


    # SelectFeature control properties


    +   - **box:** `{Boolean}` Specifies whether features can be selected by drawing
    a box. Set to `false` by default. If set to `true`, when activating the `SelectFeature`
    control object, you''ll be able to draw a box to select features instead of clicking
    on features to select them.'
  merge: -1
  img_proc: true
- pgno: 281
  md: '+   - **clickout**: `{Boolean}` Determines if features will be unselected when
    clicking outside of any feature. Default is `false`.

    +   - **geometryType**: `{Array{String}}` An array of strings which specify the
    only geometry types that the feature will be able to select. Each string should
    be the name of a Geometry class. By default, `null` is specified for this property,
    meaning all geometry types can be selected. For example, if you wanted the control
    to only allow the selection of Point objects, you would pass in this property
    like:

    +     ```

    +   geometryTypes: [''OpenLayers.Geometry.Point'']

    +     ```

    +   - **handlers**: `{Object}` This contains a reference to handler object instances.

    +   - **highlightOnly**: `{Boolean}` This specifies whether features can be selected,
    or if features can only be highlighted. Set to `false` by default. If `hover`
    is set to `true`, this will do nothing.

    +   - **hover**: `{Boolean}` Set to `false` by default. If this is set to `true`,
    features will be selected (and added to the `vector_layer.features` array) when
    the user mouse overs a feature—clicking on a feature will do nothing, only mousing
    over them will.

    +   - **layer**: `{OpenLayers.Layer.Vector}` or `{Array{OpenLayers.Layer.Vector}}`
    Specifies the vector layer(s) the selectFeature control is associated with.

    +   - **multiple**: `{Boolean}` Controls whether or not multiple features will
    be selected by clicking on them. Default is `false`. This does not mean multiple
    features can never be selected (you can use the `multipleKey` to select multiple
    features even if this is set to `false`). If set to `true`, features will not
    be unselected when clicking on other features.

    +   - **multipleKey**: `{String}` Specifies a key to be used to allow for multiple
    selection of features. When holding down the key, multiple features can be selected.
    An example would be `multipleKey: ''shiftKey''` or `''altKey''`. Default value
    is `null`.

    +   - **onBeforeSelect**: `{Function}` Function to be called before a feature
    is selected. By default, this is an empty function.

    +   - **onSelect**: `{Function}` Function to be called when a feature is selected.
    By default, this is an empty function.

    +   - **onUnselect**: `{Function}` Function to be called when a feature is unselected.
    By default, this is an empty function.

    +   - **renderIntent**: `{String}` Used to get the style to use from the style
    map of the layer. Styles are covered in Chapter 10.

    +   - **selectStyle**: `{Object}` Contains an object of styles. Styles are discussed
    later in this chapter.

    +   - **toggle**: `{Boolean}` Determines whether or not to unselect a selected
    feature when the feature is clicked. Default value is `false`. If the `hover`
    property is set to `true`, this will do nothing.'
  merge: -1
  img_proc: true
- pgno: 282
  md: "+   - **toggleKey**: `{String}` Specifies a key that, when held down, will\
    \ set the `toggle` property to `true`. When the key is released, the `toggle`\
    \ property will be set back to `false`. An example would be `multipleKey`: `'altKey'`.\
    \ Default value is `null`.\n\nThese properties can be set when instantiating a\
    \ `SelectFeature` control. To create a `SelectFeature` control object, the form\
    \ for calling it is:\n\n```\n```javascript\nvar select_feature_control = new OpenLayers.Control.SelectFeature(\n\
    \    vector_layer,\n    {}\n);\n```\n```\n\nThe `{}` is the optional `options`\
    \ object which can be filled with the properties we just discussed. Now, let's\
    \ take a look at some of the methods of the `SelectFeature` control.\n\n# SelectFeature\
    \ control methods\n\nLet's just take a look at a few methods that we'll be using\
    \ throughout the rest of the book.\n\n+   - **activate()**: Activates the control,\
    \ allowing us to use it.\n+   - **deactivate()**: Deactivates the control. After\
    \ calling, features cannot be selected until the control is activated again.\n\
    +   - **highlight(feature)**: Draws the passed in `feature` with the feature's\
    \ `select` style.\n+   - **unhighlight(feature)**: Draws the passed in `feature`\
    \ with the feature's normal style.\n+   - **select(feature)**: Selects a passed\
    \ in `feature` object, adding it to the layer's `selectedFeature` array, calling\
    \ the `onSelect` method, and rendering the feature as selected (applying any styles,\
    \ etc.).\n+   - **unselect(feature)**: Unselects a passed in `feature` object,\
    \ removing it from the layer's `selectedFeature` array, calling the `onUnselect`\
    \ method, and rendering the feature back to its normal state (applying any styles,\
    \ etc.).\n+   - **unselectAll(options)**: Calling this will unselect all features\
    \ currently selected by the control. If you wish to unselect everything except\
    \ a specific feature, pass it in to the `options` parameter as an `except` property.\n\
    \nThat ends our discussion of the Feature and Geometry classes. Next, we'll be\
    \ diving into the Vector class again—but this time, we'll focus on the more advanced\
    \ uses.\n\n# The Vector class, part two\n\nNow that we've gotten a bit more of\
    \ an understanding as to how the vector layer works, we can start doing some more\
    \ interesting things. First though, let's do a quick recap of what we've covered\
    \ so far:"
