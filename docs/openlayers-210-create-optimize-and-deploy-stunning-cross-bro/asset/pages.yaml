    \ This causes the layer to have a 'resize' animation when zooming in or out.\n\
    \n```\nvar wms_roads = new OpenLayers.Layer.WMS(\n'Roads',\n'http://labs.metacarta.com/wms/vmap0',\n\
    {layers: 'priroad,secroad,rail',\ntransparent: true},\n{transistionEffect:'resize'}\n\
    );\n```\n\n7. Now we just add the layers to the map (replace the previous addLayers\
    \ function call with this one):\n\n```\nmap.addLayers([\n    wms_layer_map,\n\
    \    wms_layer_labels,\n    wms_state_lines,\n    wms_water_depth,\n    wms_roads]);\n\
    ```\n\n8. Save the file and then open it in your web browser."
