- pgno: 65
  md: '# What Just Happened?


    We just executed some functions of our map and accessed some properties of it.
    All we have to do is call our object, map, followed by a period, then a function
    or property it owns. Using this dot notation (e.g., `map.zoomIn()`), we can access
    any property or function of the map object.


    We also saw how the DOM panel comes in handy, and took a look at functions that
    we can call, which the map object owns. Any function listed there can be called
    via `map.functionname()`, but some functions require parameters to be passed in
    or they will not work. But where can we go to figure out more information about
    the functions and what they require?


    # Have a Go Hero – experiment with functions


    Try to call different functions that you see listed in the DOM tab. Many functions
    will not work unless you pass certain arguments into them, but don’t be afraid
    of errors! Poke around the various functions and properties and try to interact
    with them using the Console tab like in the example above.


    # API documentation


    The API documentation for the Map class, which our map object derives from (and
    thus, inherits all the functions and properties of the class) provides more detailed
    explanations of the properties, functions, and what we can do with them. They
    can be found at `http://dev.openlayers.org/apidocs`. Even though Firebug is a
    great resource to quickly interact with code and learn from it, the API docs present
    an extra level of information that Firebug cannot necessarily provide.


    # Summary


    In this chapter, we learned more about how OpenLayers works. We learned how to
    set up and use Firebug and other Web Development tools.


    We then took a look at the panels that Firebug provides and what they are used
    for. Finally, we spent time with the Console panel—something you’ll be making
    extensive use of throughout this book (and when you’re developing your own web
    maps).


    This chapter aimed to provide some foundational knowledge of web development tools
    for getting into both OpenLayers and general web development. Web development
    tools, like Firebug, are one of the biggest assets in our toolkit. They speed
    up development time, help us identify bugs, interact with our code better, and
    much more.'
  merge: -1
  img_proc: true
