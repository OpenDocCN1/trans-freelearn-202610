- pgno: 157
  md: 'This control will then manipulate the map based on the parameters—it would
    zoom the map to level 0, set the lat and lon to 0, and turn on a certain layer.
    The ArgParser control does not handle the generation of these URL parameters.
    It is usually used in accordance with the Permalink control. The Permalink control,
    as we''ll see soon, is the control that actually generates the URL.


    Example Call: `var argparser_control = new OpenLayers.Control.ArgParser();`


    # OpenLayers.Control.Permalink


    The Permalink control will create an HTML link element (an anchor, an <a>, element)
    at the bottom right of the map. The link has a URL embedded with the current map''s
    longitude, latitude, zoom values, and layer information (e.g., which layers are
    turned on).


    When visiting a page from one of these generated URLs, the URL is read in by the
    ArgParser control we just discussed. Anytime the map is updated (zooming, panning,
    turning layers on/off, etc.) the permalink URL changes to reflect the map''s current
    state.


    Example Call: `var permalink_control = new OpenLayers.Control.Permalink();`


    ![](img/1b8cd151c9f278555f9cf255b20d244e_157_0.png)


    When using the Permalink control, an ArgParser control will be automatically added
    to the map.


    # OpenLayers.Control.Attribution


    This is another control added to your map by default. It will display layer attributions
    on the map (if you specify the attribution property for the layers). A layer attribution
    is just some string that will be displayed on your map with this control. You
    can also specify the separator by setting the separator property, which will separate
    the attributions for each layer. For this control to be useful, you must specify
    the attribution property of layers that you want to show attributions for.


    # Attribution properties


    | Name | Type | Description | Default Value |

    |---|---|---|---|

    | separator | {String} | Separator used between layer attribution text. | '',
    '' |

    | div | {HTML Element} | HTML Element to place this control in. Example: `document.getElementById(''map_control_div'');`
    |  |'
