- pgno: 171
  md: '# OpenLayers.Control.ZoomPanel


    The **ZoomPanel** control will add a zoom panel to the top left of the map. It
    contains **ZoomIn**, **ZoomOut**, and **ZoomToMaxExtent** controls which are activated
    by clicking on the corresponding icons. It is part of the **PanZoom** control
    that is added to the map by default. That''s it for our overview on the available
    built in controls! Let''s move on to another related topic—**Panels**.


    # Panels


    So far, we''ve covered the most common controls, ones that we''ll be using throughout
    the book. There is another type of control that we have not yet discussed—the
    **panel** control. It is a container, a control that allows us to add and group
    together other controls inside of a (you guessed it) panel. We have, in fact,
    encountered the panel control to some degree with a few of the controls we''ve
    discussed. The **PanPanel** and **ZoomPanel** controls are actually panels which
    contain other controls.


    # Control types


    With a panel, each control is represented by an icon (which can be styled anyway
    you wish). When the icon is clicked, the `activateControl` method of that control
    is called. Remembering to call `activateControl` is very important—most controls
    will not activate by themselves (we''ll cover this in more detail soon). Some
    of the controls we''ve encountered can be placed inside a panel, as we''ll see
    in a moment.


    Each control in a panel has one of the three ''types'':


    +   - `OpenLayers.Control.TYPE_BUTTON`: This is a button type control, which acts
    like a button—when it is clicked, some event gets fired off. An example control
    of this type is the **ZoomIn** and **ZoomOut** buttons we encountered in the **ZoomPanel**
    Control.

    +   - `OpenLayers.Control.TYPE_TOGGLE`: Controls like this are activated by a
    click and turned off by another click. Turning on one of these controls will not
    affect other controls, and you can have as many toggle controls as you would like
    in the same panel.

    +   - `OpenLayers.Control.TYPE_TOOL`: This type of control is like the toggle
    control above, but only *one* tool type control can be active at a time. For instance,
    the **ZoomBox** control is one of the controls of this type.


    Let''s take a look at how to create a panel and see how we add controls to it.'
  merge: -1
  img_proc: true
- pgno: 172
  md: "# Time for Action – using Panels\n\nIn this example, we're going to demonstrate\
    \ how to create and use the Panel class. We'll create a panel control object that\
    \ will be placed in a div outside the map, and then add control objects to the\
    \ panel. We're going to place the panel in a div element outside of the map. We'll\
    \ first create an HTML <div> element to contain our panel. Add a new div after\
    \ the map div like this:\n\n```\n<div id='panel_div'></div>\n```\n\n1. Now, we\
    \ need to create a panel control object. We're going to first create a Navigation\
    \ control object, as it will act as the 'default control' for the panel, which\
    \ means it will be the control activated by default. Then, we'll create our panel\
    \ object and place it inside of the previously created panel_div HTML element.\
    \ Add a WMS layer to the init() function and place the following code after the\
    \ map.addLayer() call.\n\n```\nvar navigation_control = new OpenLayers.Control.Navigation();\n\
    var control_panel = new OpenLayers.Control.Panel({\n    div: document.getElementById('panel_div'),\n\
    \    defaultControl: navigation_control\n});\n```\n\n2. Let's add some controls\
    \ to it. The Panel control has a method called addControls which takes in an array\
    \ of control objects. Let's add a ZoomBox and ZoomToMaxExtent control. Take note\
    \ that we pass in navigation_control, an already instantiated object, instead\
    \ of instantiating a Navigation control object on the fly. This navigation_control\
    \ object is the same control object that the defaultControl property points to.\
    \ If we just instantiated a Navigation control object here, the defaultControl\
    \ property would be pointing to a different control object. Creating the navigation\
    \ control object outside this array ensures that we use the same object.\n\n```\n\
