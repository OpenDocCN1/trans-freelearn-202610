- pgno: 312
  md: '8. You should now see something like the following on your map. If some point
    types are missing, don''t worry! Since the points are randomly generated, you
    will sometimes not see certain settlement types—refreshing your map will generate
    new points:


    ![](img/1b8cd151c9f278555f9cf255b20d244e_312_0.png)


    # What Just Happened?


    We just used a ''shortcut'' for creating rules. This doesn''t mean that this is
    something you should avoid doing though. The method is pretty fast, does its job
    well, and is easy to read and understand. Just keep in mind that if you don''t
    define a symbolizer for a value that gets found, the feature containing that value
    may not have a style. If you''re in the situation where you need to do this sort
    of property value checking on known values, `addUniqueValueRules` is a good way
    to solve the problem.


    However, there is an even more powerful way to customize styles—by using custom
    Rules and Filters.


    # Rules and filters


    So far, we''ve pretty much just been doing a one to one match on properties to
    specify style. With attribute replacement, we directly replace a value. With `addUniqueValueRules`,
    we see if a property is equal to something. So far, we haven''t had much flexibility.'
  merge: -1
  img_proc: true
- pgno: 313
  md: "By using Rules and Filters, we can be as flexible as we want. We can do comparisons\
    \ on properties, such as styling a feature a certain way if, for instance, it\
    \ has a property less than or greater than some value. We can create filters to\
    \ check for a multitude of different types of comparisons (greater than, less\
    \ than, equal to, etc.), and have filters interact with each other.\n\n# How do\
    \ they work?\n\nA filters object belongs to a rule object. A rule object belongs\
    \ to a style object. Each style object can have multiple rules, and rules can\
    \ interact with each other depending on how their filters are defined.\n\n# How\
    \ do we use them?\n\nTo use custom rules and filters, we just need to associate\
    \ them with a style object. The general syntax to define a rule and add it to\
    \ a style object is:\n\n```\nvar my_rule = new OpenLayers.Rule({\n  filter: new\
    \ OpenLayers.Filter({}),\n  symbolizer: { key:values }\n});\nstyle_object.addRules([my_rule]);\n\
    ```\n\nThe filter object determines how the rule will be applied (such as checking\
    \ to see if a property is greater than some value). We'll cover the Filter class\
    \ in more detail after an example, as we can do lots of complex things with filters.\
    \ This may all sound a bit abstract, so let's jump into an example to see how\
    \ it works, then cover both classes in detail.\n\n# Time for Action – using rules\
    \ and filters\n\nLet's use rules and filters to assign different styles to feature\
    \ objects based on their attributes.\n\n+   1. Let's jump in to using rules and\
    \ filters. Add a WMS layer to the map. We'll also need a vector layer, so add\
    \ in a vector layer:\n+   2. Next, we'll need some features. We'll generate some\
    \ random feature points again, and we'll create a property for each object called\
    \ population which contains a random number between 0 and 2000:\n\n```\nvector_layer\
    \ = new OpenLayers.Layer.Vector('Basic Vector Layer');\nmap.addLayer(vector_layer);\n\
    ```\n\n```\nfor(var i=0; i<20; i++){\n  vector_layer.addFeatures([new OpenLayers.Feature.Vector(\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 314
  md: "```\nnew OpenLayers.Geometry.Point(\n    (Math.floor(Math.random() * 360) -\
    \ 180),\n    (Math.floor(Math.random() * 180) - 90)\n),\n{\n    'population':\
    \ Math.floor(Math.random() * 2000)\n}\n]);\n}\n```\n\n3. Now we need to create\
    \ a style object—rules are applied directly to style objects, and filters are\
    \ applied directly to rules. So, let's create the objects in order, starting with\
    \ the style object:\n\n```\nvar vector_style = new OpenLayers.Style();\n```\n\n\
    4. Let's now create three rules. For each rule, we'll pass in an object with two\
    \ keys: filter (which will be a Filter class object) and symbolizer (which is\
    \ a familiar symbolizer object). The filter object will need a filter type, which\
    \ we'll cover after this example, and a property which the rule will match on\
    \ (in this case, population). We'll also need to specify the value (or range of\
    \ values) we want to match for each rule. The value parameter depends on the filter\
    \ type, and we'll be using either value or lowerBound and upperBound. Let's create\
    \ the first rule which will handle population values less than 500:\n\n```\nvar\
    \ rule_pop_low = new OpenLayers.Rule({\n    filter: new OpenLayers.Filter.Comparison({\n\
    \        type: OpenLayers.Filter.Comparison.LESS_THAN,\n        property: 'population',\n\
    \        value: 500\n    }),\n    symbolizer: {\n        fillColor: '#ababab',\
    \ fillOpacity:.8,\n        pointRadius:8, strokeColor: '#454545',\n        strokeWidth:2\n\
    \    }\n});\n```"
  merge: -1
  img_proc: true
- pgno: 315
  md: "5. Now we'll take care of the second rule, which handles population values\
    \ between a lowerBoundary of 500 and an upperBoundary of 1500. The boundaries\
    \ are inclusive; meaning values of 500 and 1500 will be matched. Notice how we\
    \ don't have a value property like in the previous rule—the values here are determined\
    \ by the two boundary properties:\n\n```\nvar rule_pop_mid = new OpenLayers.Rule({\n\
    \    filter: new OpenLayers.Filter.Comparison({\n        type: OpenLayers.Filter.Comparison.BETWEEN,\n\
    \        property: 'population',\n        lowerBoundary:500,\n        upperBoundary:1500\n\
    \    }),\n    symbolizer: {\n        fillColor: '#aaee77', fillOpacity:.8,\n \
    \       pointRadius:14, strokeColor: '#669933',\n        strokeWidth:5\n    }\n\
    });\n```\n\n6. Our last rule will match population values above 1500:\n\n```\n\
    var rule_pop_high = new OpenLayers.Rule({\n    filter: new OpenLayers.Filter.Comparison({\n\
    \        type: OpenLayers.Filter.Comparison.GREATER_THAN,\n        property: 'population',\n\
    \        value: 1500\n    }),\n    symbolizer: {\n        fillColor: '#BD1922',\
    \ fillOpacity:.8,\n        pointRadius:20, strokeColor: '#812B30',\n        strokeWidth:5\n\
    \    }\n});\n```\n\n7. Almost done—now we need to add those three rules to the\
    \ style object. We pass in an array of the rule objects to the addRules method:\n\
    \n```\nvector_style.addRules([rule_pop_low, rule_pop_mid, rule_pop_high]);\n```"
  merge: -1
  img_proc: true
- pgno: 316
  md: "8. Now create a styleMap object and apply the style object to it and set the\
    \ vector layer to use it:\n\n```\nvar vector_style_map = new OpenLayers.StyleMap({\n\
    \  'default': vector_style\n});\nvector_layer.styleMap = vector_style_map;\n```\n\
    \n9. Take a look at the map now. You should see something like this, but with\
    \ different point locations and colors, as the values were randomized:\n\n![](img/1b8cd151c9f278555f9cf255b20d244e_316_0.png)\n\
    \n# What Just Happened?\n\nWe just showed how rules and filters are used. We used\
    \ three rule objects, each with a different filter object. The type property of\
    \ the filter objects determine the type of comparison that will be applied. So,\
    \ in the previous example, if a feature had a property of 'population' with a\
    \ value less than 500, the rule_pop_low rule would be applied to it. Now that\
    \ we have a basic understanding of how it's used, let's look more closely at the\
    \ two classes.\n\n# OpenLayers.Rule class\n\nWhen you want to be very specific\
    \ about the types of styles that get applied to feature objects, the best way\
    \ to do it is by using the Rule class. When you create a rule object, you specify\
    \ a Filter object, a symbolizer to apply to the feature if the rule matches, and\
    \ an optional name property which specifies an arbitrary name for the rule."
  merge: -1
  img_proc: true
- pgno: 317
  md: "Rule objects are applied to style objects, and you can have virtually as many\
    \ rules on a style object as you want. The syntax for creating a rule object,\
    \ as mentioned previously, is:\n\n```\nvar my_rule = new OpenLayers.Rule({\n \
    \   filter: new OpenLayers.Filter({}),\n    symbolizer: { key:values }\n});\n\
    style_object.addRules([my_rule]);\n```\n\nAs we saw in the previous example, it's\
    \ not too hard to create and apply multiple rules to a style object. We only used\
    \ a single filter for each rule object in the previous example, but OpenLayers\
    \ makes it easy to specify multiple filters to give you even more control over\
    \ your feature styles.\n\nRules are used in accordance with filters—it's the filters\
    \ that do the work in determining if the rule will be applied to a feature. So,\
    \ let's take a look at the Filter class, and how we can use it to customize our\
    \ feature styles even more.\n\n# OpenLayers.Filter class\n\nThe Filter class controls\
    \ the logic of match feature property attributes to see if a rule should be applied\
    \ or not. We can use a single filter, like in the previous example, or we can\
    \ combine filters together (e.g., if property1 is greater than 500 and another\
    \ property2 is less than 200, then apply the style).\n\nFilters can also be spatial—we\
    \ can check to see if features intersect geometry objects, are within some distance\
    \ of a point, and more. To do all these things, we use subclasses of the base\
    \ Filter class, similar to how we use subclasses of the Layer class and other\
    \ classes.\n\n# Filter Subclasses\n\nThere are four subclasses we'll cover here—Comparison,\
    \ FeatureId, Logical, and Spatial.\n\n# Filter.Comparison\n\nThe Comparison class\
    \ is the filter class we've been using so far. Like the name implies, this class\
    \ will compare properties based on the specified parameters of the filter object.\
    \ The type of comparison applied is specified by the type property. We also have\
    \ to specify a value to check for—most filters use the value property (but some\
    \ use different properties, such as lowerBoundary and upperBoundary). Finally,\
    \ we must also specify a property to check for in the feature."
  merge: -1
  img_proc: true
- pgno: 318
  md: "For instance, let's take a look at the filter object used in the rule_pop_low\
    \ rule from the previous example:\n\n```\nvar rule_pop_mid = new OpenLayers.Rule({\n\
    \  filter: new OpenLayers.Filter.Comparison({\n    type: OpenLayers.Filter.Comparison.GREATER_THAN,\n\
    \    property: 'population',\n    value: 1500\n  }),\n});\n```\n\nHere, we ask\
    \ OpenLayers to do a GREATER_THAN comparison type, which looks at the population\
    \ property of the features and matches it if the value of population is greater\
    \ than (but not including) 1500.\n\n# Filter.Comparison Value property\n\nAll\
    \ Filter.Comparison objects must have some accompanying value property. Almost\
    \ all filter comparison types, like the GREATER_THAN type we just demonstrated,\
    \ simply use the value property. Others, like the Comparison type, use the lowerBoundary\
    \ and upperBoundary properties. Without specifying the value a filter should look\
    \ for, the filter won't work (it wouldn't know what to compare).\n\nLet's take\
    \ a look at the different Filter.Comparison types available.\n\n# Filter Comparison\
    \ types\n\nUnless otherwise specified, each comparison type will have a corresponding\
    \ value property. The value property is an {Integer} type, unless otherwise specified.\n\
    \n# Filter Type: BETWEEN\n\nBETWEEN: Checks to see if a property is between two\
    \ values. This does not use the value property—instead, you specify lowerBound\
    \ and upperBound values to check between. The values are inclusive—so if the lowerBound\
    \ is 500 and the upperBound is 1500, it will match values in between and including\
    \ 500 to 1500. Example constructor call:\n\n```\nvar my_filter = new OpenLayers.Filter.Comparison({\n\
    \  type: OpenLayers.Filter.Comparison.BETWEEN,\n  property: 'population',\n  lowerBoundary:500,\n\
    \  upperBoundary:1500\n});\n```"
  merge: -1
  img_proc: true
- pgno: 319
  md: "# Filter Type: EQUAL_TO\n\nEQUAL_TO: Checks if a property is equal to a specified\
    \ value. Example constructor call:\n\n```\nvar my_filter = new OpenLayers.Filter.Comparison({\n\
    \    type: OpenLayers.Filter.Comparison.EQUAL_TO,\n    property: 'population',\n\
    \    value: 1337\n});\n```\n\n# Filter Type: GREATER_THAN\n\nGREATER_THAN: Checks\
    \ if a property is greater than, but not including, a specified value. The following\
    \ example constructor call would match anything greater than (but not including)\
    \ 1000—so the smallest value it would match would be 1001:\n\n```\nvar my_filter\
    \ = new OpenLayers.Filter.Comparison({\n    type: OpenLayers.Filter.Comparison.GREATER_THAN,\n\
    \    property: 'population',\n    value: 1000\n});\n```\n\n# Filter Type: GREATER_THAN_OR_EQUAL_TO\n\
    \nGREATER_THAN_OR_EQUAL_TO: Checks if a property is greater than or equal to a\
    \ specified value. The following example constructor call would match the value\
    \ 1000 and anything greater:\n\n```\nvar my_filter = new OpenLayers.Filter.Comparison({\n\
    \    type: OpenLayers.Filter.Comparison.GREATER_THAN_OR_EQUAL_TO,\n    property:\
    \ 'population',\n    value: 1000\n});\n```\n\n# Filter Type: LESS_THAN\n\nLESS_THAN:\
    \ Checks if a property is less than, but not including, a specified value. Example\
    \ constructor call—this would match anything below 1000, but would not match the\
    \ value 1000:\n\n```\nvar my_filter = new OpenLayers.Filter.Comparison({\n   \
    \ type: OpenLayers.Filter.Comparison.LESS_THAN,\n    property: 'population',\n\
    \    value: 1000\n});\n```"
  merge: -1
  img_proc: true
- pgno: 320
  md: "# Filter Type: LESS_THAN_OR_EQUAL_TO\n\nLESS_THAN_OR_EQUAL_TO: Checks if a\
    \ property is less than, or including, a specified value. Example constructor\
    \ call—this would match anything below 1000, and would also match 1000:\n\n```\n\
    var my_filter = new OpenLayers.Filter.Comparison({\n    type: OpenLayers.Filter.Comparison.LESS_THAN_OR_EQUAL_TO,\n\
    \    property: 'population',\n    value: 1000\n});\n```\n\n# Filter Type: LIKE\n\
    \nLIKE: Checks if a property contains a value, which in this case is a {String}.\
    \ For example, if the property's value was 'village' and the value you specify\
    \ to check for is 'village', then it would match. The value you specify is also\
    \ a regular expression—which means you can pass in various special characters\
    \ to match on. For example, * will match zero or more instances of any character.\
    \ If you just want to see if a certain string is contained within the property,\
    \ you can simply set the value to that string without worrying about what regular\
    \ expressions are. Example constructor call:\n\n```\nvar my_filter = new OpenLayers.Filter.Comparison({\n\
    \    type: OpenLayers.Filter.Comparison.LIKE,\n    property: 'settlement_type',\n\
    \    value: 'village'\n})\n```\n\n![](img/1b8cd151c9f278555f9cf255b20d244e_320_0.png)\n\
    \nMore information on regular expressions can be found at http://en.wikipedia.org/wiki/Regular_expression.\n\
    \n# Filter Type: NOT_EQUAL_TO\n\nNOT_EQUAL_TO: Checks to see if a property is\
    \ not equal to some value passed in, which is an {Integer} type. An example constructor\
    \ call would be the following, which would match everything that did not have\
    \ a population property equal to the value 1000.\n\n```\nvar my_filter = new OpenLayers.Filter.Comparison({\n\
    \    type: OpenLayers.Filter.Comparison.NOT_EQUAL_TO,\n    property: 'population',\n\
    \    value: 1000\n});\n```"
  merge: -1
  img_proc: true
- pgno: 321
  md: "# Filter.FeatureId\n\nThis will filter features based on Feature IDs. This\
    \ is useful particularly when working with WFS services or SLDs. With WFS, FeatureID\
    \ is a way to reference a unique feature. WFS servers return data about features,\
    \ each one containing a FeatureID which uniquely identifies it. SLDs can also\
    \ identify features by a unique FeatureID. This can be useful if you know the\
    \ IDs of specific features you want styled. When using the FeatureID filter, it\
    \ expects an array of fids during instantiation:\n\n```\nvar my_filter = new OpenLayers.Filter.FeatureId({\n\
    \    fids: ['fid1', 'fid2']\n});\n```\n\n# Feature.Logical\n\nWe've already practiced\
    \ applying filters to rules, but what about applying a filter object to another\
    \ filter object? Why would we want to do this? Well, it allows us to use logical\
    \ operators with filters. Meaning, we can create really complex filters quite\
    \ easily.\n\nThere are three types of logical operators that we can use:\n\n+\
    \   - OpenLayers.Filter.Logical.AND: Checks if multiple filters match\n+   - OpenLayers.Filter.Logical.OR:\
    \ Checks if at least one of the multiple filters match\n+   - OpenLayers.Filter.Logical.NOT:\
    \ If the filter does not match\n\nWe can combine these filters together to create\
    \ very specific rules, giving us very fine grain control over what features should\
    \ get styled. To create a logical filter, you simply specify the type (which is\
    \ one of the three logical operators above) and an array of filters which contains\
    \ other filter objects.\n\nFor example,\n\n```\nvar my_logical_filter = new OpenLayers.Filter.Logical({\n\
    \    type: OpenLayers.Filter.Logical.AND,\n    filters: [\n        new OpenLayers.Filter.Comparison({\n\
    \            type: OpenLayers.Filter.Comparison.LESS_THAN,\n            property:\
    \ 'population',\n            value: 1000\n        }),\n        new OpenLayers.Filter.Comparison({\n\
    \            type: OpenLayers.Filter.Comparison.LIKE,\n            property: 'settlement_type',\n\
    \            value: 'village'\n        })\n    ]\n});\n```"
  merge: -1
  img_proc: true
- pgno: 322
  md: "The above filter uses the AND logical operator and two comparison filters.\
    \ The result is that this logical filter will match only features that match both\
    \ the comparison filters (population less than 1000 and settlement_type contains\
    \ 'village').\n\nLet's go over this with an example.\n\n# Time For Action – figuring\
    \ out logical filters\n\nIn this example, we'll use a few logical filters and\
    \ some random points with random population and settlement_type values.\n\n+ \
    \  1. Add in a WMS and vector layer.\n+   2. Now, we'll need to create an anonymous\
    \ object containing some settlement value that we'll pick from at random:\n+ \
    \  3. Let's create some feature. We'll create twenty features, using some random\
    \ population and settle_type values in each feature's attribute property:\n+ \
    \  4. Like before, we'll now need a style object to apply filters to:\n\n```\n\
    vector_layer = new OpenLayers.Layer.Vector('Basic Vector Layer');\nmap.addLayer(vector_layer);\n\
    ```\n\n```\nvar settlement_values = {\n    0: 'village',\n    1: 'city',\n}\n\
    ```\n\n```\nfor(var i=0; i<20; i++){\n    vector_layer.addFeatures([new OpenLayers.Feature.Vector(\n\
    \        new OpenLayers.Geometry.Point(\n            (Math.floor(Math.random()\
    \ * 360) - 180),\n            (Math.floor(Math.random() * 180) - 90)\n       \
    \ ),\n        {\n            'population': Math.floor(Math.random() * 2000),\n\
    \            'settlement_type': settlement_values[(Math.floor(Math.random() *\
    \ 2))]\n        }\n    )]);\n}\n```\n\n```\nvar vector_style = new OpenLayers.Style();\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 323
  md: "5. Now comes the 'hard' part. We'll create a logical filter that checks two\
    \ comparison filters. It will see if the population is lower than 1000 and the\
    \ settlement_type is 'village'. This is all that's to it:\n\n```\nvar filter_village_low_pop\
    \ = new OpenLayers.Filter.Logical({\n    type: OpenLayers.Filter.Logical.AND,\n\
    \    filters: [\n        new OpenLayers.Filter.Comparison({\n            type:\
    \ OpenLayers.Filter.Comparison.LESS_THAN,\n            property: 'population',\n\
    \            value: 1000\n        }),\n        new OpenLayers.Filter.Comparison({\n\
    \            type: OpenLayers.Filter.Comparison.LIKE,\n            property: 'settlement_type',\n\
    \            value: 'village'\n        })\n    ]\n});\n```\n\n6. Next, we'll create\
    \ another logical filter. This one will check to see if the population is between\
    \ 100 and 1500 and check to see if the settlement_type is 'village'.\n\n```\n\
    var filter_village_high_pop = new OpenLayers.Filter.Logical({\n    type: OpenLayers.Filter.Logical.AND,\n\
    \    filters: [\n        new OpenLayers.Filter.Comparison({\n            type:\
    \ OpenLayers.Filter.Comparison.BETWEEN,\n            property: 'population',\n\
    \            lowerBoundary: 1000,\n            upperBoundary: 1500\n        }),\n\
    \        new OpenLayers.Filter.Comparison({\n            type: OpenLayers.Filter.Comparison.LIKE,\n\
    \            property: 'settlement_type',\n            value: 'village'\n    \
    \    })\n    ]\n});\n```"
  merge: -1
  img_proc: true
- pgno: 324
  md: "7. Now we'll create one more filter. This one will use the OR logical operator\
    \ to see if the population is above 1500 or if the settlement_type is 'city'.\
    \ So, even if settlement_type is 'city' and the population is say, 500, it will\
    \ get matched because at least one of the filters matches:\n\n```\nvar filter_city\
    \ = new OpenLayers.Filter.Logical({\n    type: OpenLayers.Filter.Logical.OR,\n\
    \    filters: [\n        new OpenLayers.Filter.Comparison({\n            type:\
    \ OpenLayers.Filter.Comparison.GREATER_THAN,\n            property: 'population',\n\
    \            value: 1500\n        }),\n        new OpenLayers.Filter.Comparison({\n\
    \            type: OpenLayers.Filter.Comparison.LIKE,\n            property: 'settlement_type',\n\
    \            value: 'city'\n        })\n    ]\n});\n```\n\n8. Ok—now we'll just\
