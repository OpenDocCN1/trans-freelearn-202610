- pgno: 177
  md: '# Panel functions


    The Panel class has just two functions that we need to know about for now.


    +   - **Activate()**: This function will activate the panel control itself. By
    default, the `autoActivate` property is set to `true` and this function will be
    called automatically. However, if the panel is not activated by default, you must
    call this function to use the panel.

    +   - **activateControl({OpenLayers.Control})**: This function will activate the
    passed in control. The control passed in must be a control that belongs to the
    panel. This is the function that gets called when a control inside the panel is
    clicked on by a user. If you wish to manually activate a control, you will call
    this function.


    # Now what?


    Whew! We''ve covered the majority of controls OpenLayers offers and we''ve gone
    over how to use a panel. There''s been a lot to take in, but don''t feel overwhelmed.
    One of the reasons we covered so much is so that we can refer back to this chapter
    later if we need a refresher on how to use a control or what we can do with one.


    So, now that we''re done with the nitty gritty details, let''s move on to something
    a little bit more complex.


    # Creating our own controls


    You''re familiar (or perhaps fed up) with control descriptions by now. Let''s
    make things a little more interesting and create our own control. Here''s the
    plan:


    +   1. Quickly talk about the Button Control class.

    +   2. Create a Button control with custom functionality.

    +   3. Add the button to a panel.

    +   4. Viola! You just created your own custom control.


    So, before we talk about creating a custom button, let''s go over the **Button**
    subclass that we didn''t cover in the section above, which we''ll use to create
    our custom controls.


    # OpenLayers.Control.Button


    There''s not much to cover here really, as we''ve been over the base control class.
    There are two properties we need to discuss however—the `type` and `displayClass`
    property. We''ll use these two properties when creating our own custom control.'
  merge: -1
  img_proc: true
- pgno: 178
  md: '# Button properties


    | Name | Type | Description | Default Value |

    |---|---|---|---|

    | type | {Integer} | This is an integer which represents the type of control this
    button is. This is part of what we discussed earlier—the button types. OpenLayers.Control.TYPE_BUTTON
    is represented by a 1, OpenLayers.Control.TYPE_TOGGLE is represented by a 2, and
    OpenLayers.Control.TYPE_TOOL is represented by a 3. By default, as this is a OpenLayers.Control.TYPE_BUTTON
    control, the value is 1. However, by changing the value of this property you can
    change its control type. You can specify the type by either using the {Integer}
    number (such as 2), or use the built in constant name. The constant name starts
    with OpenLayers.Control and is followed by the control type (such as OpenLayers.Control.TYPE_BUTTON).
    Both methods accomplish the same thing, but using the constant name is cleaner
    and easier to read. | 1 (or OpenLayers.Control.TYPE_BUTTON) |

    | displayClass | {String} | This string will specify the name of the CSS class
    the button will be assigned. An example would be ''olControlMyButton''. Whatever
    class you specify, OpenLayers automatically adds in ''ItemInactive'' at the end
    of it. If it is a toggle-able button, then ''ItemActive'' will be added to the
    end when the button is active. We''ll cover this in great detail in the next chapter.
    If this property is not defined, it will get the default value of ''olControlButtonItem''
    (with ''Inactive'' or ''Active'' added at the end). | olControlButtonItemInactive
    |'
