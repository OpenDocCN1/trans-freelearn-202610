- pgno: 183
  md: '# Other control types


    So, with the previous example, we created a button control whose type was `TYPE_BUTTON`.
    It works like we expect and should work, but what if we wanted it to be toggle-able?
    We know, from earlier in the chapter, that there are `TYPE_TOOL` and `TYPE_TOGGLE`
    button types, and we mentioned how we could assign a button to be one of those
    types.


    # Process for creating other button control types


    While there are a few different ways to achieve this, the process basically boils
    down to the following:


    +   - Create a control object (either by extending the base Control class—a more
    advanced technique, or by creating a Button control) and specify the `type`

    +   - Specify functions that will get called when certain events occur (e.g.,
    when the control is activated)


    To keep things simple and accomplish this, we''re going create a Button control
    like we did in the previous example. Then, we''ll specify `eventHandlers` that
    will call functions when the control is activated. But what''s an event?


    # Events


    An event basically means what it sounds like—something happening. Really, all
    user input is an event—a key press, a mouse click, etc. are all events.


    Using JavaScript, we''re able to access user generated events, such as a mouse
    click, and do things when an event occurs. Events are what drive the interaction
    in OpenLayers—when you drag the map, you are actually issuing a mouse event that
    OpenLayers interprets and then updates the map accordingly.


    OpenLayers has its own Event class which makes interacting with events easier,
    and even enables us to create our own custom events. We won''t get much into that
    right now, but we should briefly talk about something known as event handlers.


    # Event listeners and handlers


    If you understood the previous paragraphs, then you may be able to guess what
    an event handler (and listener) is. In essence, an event listener is something
    that listens for events, and an event handler is something that responds to an
    event.'
  merge: -1
  img_proc: true
- pgno: 184
  md: 'Consider the button control we created in the previous example. The control
    will wait for someone to click on it—this is the event listener. When the button
    is clicked, the `trigger` function is called—this is the event handler. So, in
    OpenLayers, **event listeners** are used to add **event handler** functions to
    certain event types (such as clicks or mouse overs).


    # Custom events


    While user created events give us plenty to work with, life is easier if we can
    work with events other than just mouse clicks and key presses. If we can interact
    with events that are fired off not by the user, but by the map itself, then we
    can do a whole lot of more interesting and neat things. And of course, we wouldn''t
    be building this concept up if OpenLayers didn''t provide us with the ability
    to do so.


    While we won''t be creating our own custom events here, we will be working with
    custom events. When you click on a `TYPE_TOGGLE` control button, a custom event
    called `activate` is fired. In turn, if we want to call some function when that
    happens, we can assign an `eventHandler` to the `activate` event. We''ll go over
    exactly this when we create a more advanced custom control.


    # Creating a TYPE_TOGGLE control


    Now it''s time to create some more custom controls with `TYPE_TOGGLE` and `TYPE_TOOL`.
    Two things need to happen for us to do this—we must create the control object,
    and then we have to assign functions that get called when the control is activated
    (i.e., an event handler). The previous section on events was used to provide an
    explanation for the theory behind events, but don''t worry if you''re a little
    confused. We''re going to clarify, through code, what we will talk about. Let''s
    get to it!


    # Time for Action – creating a custom TYPE_TOGGLE control


    We''re going to create a `TYPE_TOGGLE` control button. We''ll actually be using
    events in two ways. We''ll use events to call a function when the control is activated/deactivated
    (i.e., toggled). This activated/deactivated concept is important, as we cannot
    use controls if they are not activated.


    When the toggle control is activated, the `activate()` function that gets called
    will add an event handler to the map. The map event handler will look for a click
    event and upon a click will call a function which updates the base layer''s opacity.
    When the control is deactivated, the `deactivate()` function that gets called
    will remove the map event handler.


    +   1. Open up the previous example. We''ll be using that as the basis for this
    example. We don''t really need to change anything there, so let''s go ahead and
    start creating our buttons!'
  merge: -1
