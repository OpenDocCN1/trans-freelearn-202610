- pgno: 41
  md: "Finally, we must specify the map's viewable area. Here, the actual code that\
    \ moves the map is `map.zoomToMaxExtent()`, which zooms the map to the map's maximum\
    \ extent. It is inside an `if` statement. This `if` statement checks to see whether\
    \ the map already has a center point.\n\nThe reason why we add in this check is\
    \ because, by default, your map can accept a specially formatted URL that can\
    \ contain an extent and layers to turn on/off. This is, in more common terms,\
    \ referred to as a `permalink`. If we did not check to see if a center has already\
    \ been set, permalinks would not work.\n\n![](img/1b8cd151c9f278555f9cf255b20d244e_41_0.png)\n\
    \n> By default, your map adds an **argParser** control which will try to pull\
    \ information from a permalink. We cover this in Chapter 6, but to see it in action\
    \ now you can simply add the following to your URL, which will zoom the map to\
    \ the same coordinate and zoom level: `?zoom=4&lat=56&lon=-116`\n> \n> So, your\
    \ URL might look like `c:/code/index.html?zoom=4&lat=56&lon=-116`\n\nThere are\
    \ a few ways to set the map's extent. If you know you want to show everything,\
    \ the `map.zoomToMaxExtent()` function is a quick and good way to do it. There\
    \ are other ways as well, such as\n\n```\nmap.zoomToExtent(new OpenLayers.Bounds([minx,miny,maxx,maxy]);\n\
    ```\n\nThere are even more ways though. If you know a specific location you want\
    \ the map to start at, this is another way to do it:\n\n```\nmap.setCenter(new\
    \ OpenLayers.LonLat(x,y));\nmap.zoomTo(5);\n```\n\nWhere x, y are the Lon/Lat\
    \ values, and 5 is the zoom level you wish to zoom to. By default, your map will\
    \ have 16 zoom levels, which can be configured by setting the `numZoomLevels`\
    \ property when creating your map object.\n\nMore ways exist, but these are the\
    \ most common strategies. The basic idea is that you need to specify a center\
    \ location and zoom level—setting the extent accomplishes this, as does explicitly\
    \ setting the center and zoom level.\n\n**Line [24]:** `}`\n\nThis simply finishes\
    \ the `init()` function.\n\n**Lines [26], [27]:**\n\nThese lines close the script\
    \ tag and head tag.\n\n**Line [29]:** `<body onload='init();'>`"
