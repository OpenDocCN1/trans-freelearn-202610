- pgno: 262
  md: '# Vector Layer event types


    All these events can be registered the same way we registered events in the previous
    chapter. For example:


    ```

    vector_layer.events.register(type, obj, listener);

    ```


    Assuming `vector_layer` is the name of your vector layer object, the previous
    code will register a listener for an event of a passed in type. Along with the
    event types of the Layer class, the Vector class supports the following event
    types (in alphabetical order):


    +   - **afterfeaturemodified**: Triggered after a feature has been modified. The
    listener function receives a `feature` object which references the modified feature.

    +   - **beforefeatureadded**: This event is triggered before a single feature
    is added to the map. The listener function will receive an object containing a
    feature property that references the soon to be added feature. If the listener
    function returns `false`, the feature will be not be added to the map.

    +   - **beforefeaturesadded**: This event does the same thing as `beforefeatureadded`,
    but the listener function will accept an array of features instead of a single
    feature. If the listener function returns `false`, the features will not be added.

    +   - **beforefeaturemodified**: Triggered before a feature is selected to be
    modified. The listener function receives a `feature` object which references the
    soon to be modified feature.

    +   - **beforefeatureremoved**: Triggered before a single feature object is removed
    from the map, and the listener function receives a `feature` object which references
    the removed feature.

    +   - **beforefeaturesremoved**: Triggered before an array of feature objects
    are removed from the map, and the listener function receives a `features` array
    which references the removed features.

    +   - **featureadded**: Triggered right after a single feature object is added
    to the map, and the listener function receives a `feature` object which references
    the added feature.

    +   - **featuresadded**: Like the previous type, but designed to take in an array
    of features. It is triggered right after an array of feature objects are added
    to the map. The listener function receives a `features` array which references
    the added features.

    +   - **featuremodified**: Triggered when a feature has been modified. There is
    a slight difference between this and the `afterfeaturemodified` event. This `featuremodified`
    event gets fired as soon as the feature is modified, and the `afterfeaturemodified`
    event gets triggered after the modification is fully complete. The listener function
    receives a `feature` object which references the modified feature.'
  merge: -1
  img_proc: true
- pgno: 263
  md: '+   - **featureremoved**: Triggered after a single feature object is removed
    from the map, and the listener function receives a `feature` object which references
    the added feature.

    +   - **featuresremoved**: Triggered after an array of feature objects are removed
    from the map, and the listener function receives a `features` array which references
    the removed features.

    +   - **featureselected**: Triggered after a feature is selected. The listener
    function receives a `feature` object which references the selected feature. Usually
    used when using the SelectFeature control, covered later in this chapter.

    +   - **featureunselected**: Triggered after a feature is unselected. The listener
    function receives a `feature` object which references the unselected feature.
    Usually used when using the SelectFeature control, covered later in this chapter.

    +   - **refresh**: This event is triggered when the vector layer makes a request
    for new features, or when the `refresh` method is called. Using the WFS protocol,
    for example, the vector layer will make additional requests for features and this
    event will be triggered. We go over requesting data from external sources later
    in this chapter.

    +   - **sketchcomplete**: Triggered after a sketch has been completed. A sketch
    can be made, for example, with the `EditingToolbar` control—drawing a line or
    a polygon is considered a ''sketch''. When the drawing is fully complete (i.e.,
    when you double click to finish the sketch), the `sketchcomplete` event is fired.
    The listener receives a `feature` object which references the sketched feature.
    If the listener function returns `false`, the features will not be added.

    +   - **sketchmodified**: Triggered when a sketch is modified. If, for example,
    you are in the middle of drawing a polygon using the `EditingToolbar` control
    and move your mouse, this event is fired. The listener receives a `feature` object
    which references the sketched feature, and `vertex` property which references
    the modified point.

    +   - **sketchstarted**: Triggered as soon as a sketch is started. If, for example,
    you click on the draw polygon control of the `EditingToolbar` control and place
    a point on the map, this event is triggered. The listener receives a `feature`
    object which references the sketched feature, and `vertex` property which references
    the starting point.

    +   - **vertexmodified**: Whenever any vertex contained by any feature is modified
    this event is triggered. The listener function receives three arguments: `feature`
    which references the feature the vertex belongs to, `vertex` which references
    a point (the modified vertex), and `pixel` which contains the on screen pixel
    location the vertex was modified at.'
  merge: -1
  img_proc: true
