- pgno: 307
  md: '![](img/1b8cd151c9f278555f9cf255b20d244e_307_0.png)


    # What Just Happened?


    We just demonstrated how to use attribute replacement when creating our styles.
    Changing the point radius for features based on attributes is a fairly common
    practice, but as you''ve seen we''re not just limited to a few properties—we can
    change any of the properties using attribute replacement. This can be quite powerful,
    and we''ll be using it throughout the rest of this book. However, attribute replacement
    is just the tip of the iceberg.


    # Rules and filters


    For even more fine grained control, we can style objects by using the **Rule**
    and **Filter** classes. These two classes allow us to apply different styles to
    different features based on some arbitrary ''rules'' we choose. We can use the
    feature''s `attributes` property to apply certain styles if one (or more) of the
    properties match some value we choose.


    # How do we follow rules?


    **Rules** allow us to apply symbolizers when certain conditions occur. Those conditions
    are handled via the **Filter** class. We can have multiple rules and filters,
    and even use logical operators (such as OR and AND) with them. Before we talk
    about that though, there are two ways we can use rules.


    The first is by using the `addUniqueValueRules` method of the StyleMap class.
    This allows simple property matching and is fairly straightforward to use. We''ll
    go over this method first.'
  merge: -1
  img_proc: true
- pgno: 308
  md: 'The second way, using custom rule and filter objects, is a bit complicated,
    but allows us snowflake level control over what styles get applied. We''ll cover
    this, along with the Rule and Filter classes themselves, after we discuss how
    to use addUniqueValueRules.


    # Using addUniqueValueRules


    The easiest way to use rules is to use the addUniqueValueRules method of the StyleMap
    class. It allows us to do a sort of value look-up and apply different styles depending
    on a property''s value. More concretely, let''s say we had a bunch of point features
    which represented settlements. Each feature has an attribute property called settlement_type,
    with values such as ''village'', ''city'', or ''metropolis''.


    Now, let''s also say we want to style our points differently depending on what
    type of settlement it is. We want to color them differently, make the point radius
    larger, and change the stroke size. We could, in theory, just use attribute replacement
    and embed these values with each feature, but a more elegant and easy to maintain
    way would be to use addUniqueValueRules.


    With this method, we could create three different symbolizers and have the proper
    styles applied to different settlement types. If the settlement_type property''s
    value matches ''village'', for instance, it would get a certain style, and if
    it matched ''city'' it would receive a different style, etc. If this explanation
    was confusing, don''t worry, we''ll go over it in an example briefly.


    # Calling the addUniqueValueRules function


    First, let''s look at the general syntax for calling the addUniqueValueRules function:


    ```

    style_map_object.addUniqueValueRules(intent, property, symbolizer_

    lookup, context);

    ```


    # The intent parameter


    The intent parameter specifies the desired intent—usually ''default''.


    # The property parameter


    The second parameter, property, is the property of the feature you want to check—e.g.,
    ''settlement_type'' as in our previous explanation.'
  merge: -1
  img_proc: true
- pgno: 309
  md: "# The symbolizer_lookup parameter\n\nThe symbolizer_lookup parameter is an\
    \ anonymous object containing key:value pairs to use if the rule matches. The\
    \ key specifies a value of the passed in property, and the value specifies the\
    \ symbolizer to apply if the property matches that value. It might make a bit\
    \ more sense to take a look at how it would appear in the code, for example:\n\
    \n```\nvar symbolizer_lookup = {\n  'village': {pointRadius:5, strokeWidth:2},\n\
    \  'city': {pointRadius:10, strokeWidth:4}\n}\n```\n\nThis applies the 'village'\
    \ symbolizer if the feature's settlement_type property is 'village', and applies\
    \ the 'city' style symbolizer if the property is 'city'. The symbolizers will\
    \ extend whatever default symbolizers are already associated with the StyleMap\
    \ object. Lastly, and importantly, if the property you search for contains a value\
    \ that does not exist in the symbolizer_object, the feature will not receive a\
    \ style. So, it is best to use this function when you know what to expect from\
    \ the property values—if you don't, you can create custom rules, which we'll cover\
    \ next.\n\n# The context parameter\n\nThe last argument, context, is an optional\
    \ (usually not included) object which specifies an anonymous object to check the\
    \ property against. If no context is passed in, features.attributes are used by\
    \ default (normally, this is what you want to happen).\n\n# Time For Action –\
    \ using addUniqueValueRules\n\nNow that we know about addUniqueValueRules, let's\
    \ see it in action.\n\n+   1. We're going to use a basic vector layer with some\
    \ randomly generated features and settlement_type properties. Add a WMS layer.\
    \ Then, we need a vector layer:\n+   ```\n+   vector_layer = new OpenLayers.Layer.Vector('Settlement\
    \ Vector Layer');\n+   map.addLayer(vector_layer);\n+   ```\n+   2. Now, let's\
    \ create an anonymous object consisting of integer values as the keys and our\
    \ desired settlement_type values as the values. We do this because we'll need\
    \ a way to randomly pick what type of settlement a feature should be.\n+   ```\n\
    +   var settlement_values = {\n+     0: 'hut',\n+     1: 'village',\n+     2:\
    \ 'city',\n+     3: 'metropolis',\n+   }\n+   ```\n\n```\nvector_layer = new OpenLayers.Layer.Vector('Settlement\
    \ Vector Layer');\nmap.addLayer(vector_layer);\n```\n\n```\nvar settlement_values\
    \ = {\n  0: 'hut',\n  1: 'village',\n  2: 'city',\n  3: 'metropolis',\n}\n```"
  merge: -1
  img_proc: true
