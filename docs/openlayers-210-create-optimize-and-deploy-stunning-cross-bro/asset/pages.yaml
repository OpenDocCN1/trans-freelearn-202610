- pgno: 190
  md: "# What is CSS?\n\n**CSS** is an acronym for **Cascading Style Sheets**. It\
    \ is a type of markup language used to specify the appearance of HTML elements.\
    \ CSS is actually quite simple, and if you've been able to follow along up to\
    \ this point in the book, you will have absolutely no problem at all with CSS.\
    \ Before we get into it a little more, let's talk a little bit about how CSS works.\n\
    \n# Ideas behind CSS and HTML\n\n**HTML**, **CSS**, and **JavaScript** serve three\
    \ distinct purposes.\n\n+   - **HTML** is used, as we've seen, to create the structure\
    \ and *content* of a webpage\n+   - **CSS**, on the other hand, is used to control\
    \ the site's *presentation*, or how the page should look\n+   - **JavaScript**,\
    \ as we've seen throughout the book, is used to handle the *logic* behind the\
    \ site\n\nSo, when you make a site you will have at least three discrete things\
    \ to consider—the HTML behind it, the CSS that styles the HTML, and the **JavaScript**\
    \ that handles any logic or user interaction. For now, we'll focus on HTML and\
    \ CSS.\n\nIdeally, HTML, CSS, and JavaScript should not mix (i.e., you shouldn't\
    \ use style tags, or tags like `<center>`, in your HTML). Your HTML pages should\
    \ link to external JavaScript and CSS files, especially in a production environment.\
    \ One advantage of following this principle is that if you want to change the\
    \ way your website looks, you only have to edit the CSS in one place (the external\
    \ file) instead of on every page. The disadvantage is that it is slightly easier\
    \ and faster to edit things if everything is contained inside the same HTML file;\
    \ that's why we've been doing it this way so far.\n\nBut how do we edit the CSS\
    \ and what does this even mean?\n\n# Editing CSS\n\nIf you're familiar with CSS,\
    \ feel free to skip the next few pages and go directly to the second section on\
    \ *How OpenLayers uses CSS*. If you aren't, don't fret! It's quite easy.\n\nCSS\
    \ isn't a programming language; in fact, you already are familiar with how it\
    \ is structured. Let's look at the 'template' code for applying a CSS style:\n\
    \n```\nelement {\n    property: value;\n    property-two: value;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 191
  md: 'Looks familiar? It''s essentially what an anonymous object in JavaScript looks
    like. The main difference is that a semi colon (;) is required at the end of each
    line (not a comma).


    ![](img/1b8cd151c9f278555f9cf255b20d244e_191_0.png)


    > You''ll notice we also have property: value (key: value pairs). There are many
    different possible properties and values. We''ll cover common ones later in this
    chapter, but a full list can be found at http://www.w3schools.com/css/css_reference.asp.


    The other difference, you''ll notice, is that there is something called an element
    in front of the brackets. This refers to a single (or multiple) HTML element—either
    by tag name, class name, or ID. Multiple elements are separated by a comma.


    # HTML elements


    So far, we''ve talked just a little bit about elements in HTML. Every <tag> in
    your HTML page is an element (e.g., <div id=''my_div''>This div is an element</div>).
    Now, to use CSS, we have to have a way to refer to the element(s) we want to give
    a style to. This is the element part of the CSS code outline above.


    ![](img/1b8cd151c9f278555f9cf255b20d244e_191_1.png)


    > The DOM (Document Object Model) is a way to represent objects (such as these
    elements) that are in your page. We won''t go into much depth about it now, but
    if you are interested in learning more then http://w3schools.com/dom/default.asp
    is a great resource.


    # HTML—IDs and classes


    We can refer to specific elements in two primary ways: via an ID or class name(s).


    # HTML IDs


    Every HTML element can have a single ID. The ID is unique, and no elements should
    share the same ID. For example,


    ```

    <div id=''map_element''></div>

    ```


    With this code, we''re creating a div element with an ID of ''map''—no other element
    (be it a div or otherwise) should have the same ID. So, IDs are very useful when
    we want to refer to one specific element. We''ve used the ID property to specify
    the div that our maps should appear in (via <div id=''map_element''></div> and
    specifying map_element when instantiating our map object).'
  merge: -1
  img_proc: true
- pgno: 192
  md: "# HTML classes\n\nThere is another way to refer to elements, via **class names**.\
    \ Classes in HTML have little in common with the classes you're used to from JavaScript.\
    \ The only things you really need to know about classes in HTML is that, unlike\
    \ an ID, class names can be used multiple times (that's primarily what they're\
    \ designed for) and an element can have multiple class names (separated by a single\
    \ space).\n\nSo, what does this look like in HTML?\n\n```\n<div id='some_div'\
    \ class='some_class_1'></div>\n<div id='some_other_div' class='some_class1 some_class2'></div>\n\
    ```\n\nHere, we have two different div elements, each with different IDs. However,\
    \ both elements share the class `some_class1` and will receive whatever properties\
    \ that class contains. The second div will also inherit any properties that the\
    \ class `some_class` contains.\n\n# Styling HTML elements with CSS\n\nNow that\
    \ we know how HTML uses classes and IDs, we can learn how to use them with CSS.\
    \ Specifically, how do we refer to the `element` in our CSS code? There are three\
    \ ways to specify an element in CSS:\n\n**Element Type**: Specifying the name\
    \ of an element alone will apply the style to all elements of that type. For example:\n\
    \n```\ndiv {\n  color: #ff0000;\n}\n```\n\nThis would apply the color #ff0000\
    \ (red) to all div elements.\n\n**Element ID**: Specifying the ID will cause the\
    \ style to be applied only to the element with the specified ID. To do this, place\
    \ an octothorpe (a hash or pound sign, #) in front of the desired ID. For example:\n\
    \n```\n#map_element {\n  height:500px;\n  width:500px;\n}\n```\n\n**Element Class\
    \ Name**: Specifying the class name will cause the style to be applied to all\
    \ elements that have the desired class name. To do this, place a period in front\
    \ of the class name. For example:\n\n```\n.some_class1 {\n  color:#0000ff;\n}\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 193
  md: "# Using CSS in your code\n\nSo we know how to refer to elements now, but how\
    \ do we use CSS in our HTML? There are three ways to go about this:\n\n+   - **Including\
    \ an external CSS file:** This is the preferred way to add CSS to our HTML pages,\
    \ as we only need to change the style in one place if we need to make changes.\
    \ It works similar in principle to how including an external JavaScript file works—we\
    \ basically point to an external CSS file, and the page will read it in. To do\
    \ this, we place a `<link>` tag in the `<head>` section of our HTML page. For\
    \ example:\n+   \n+   ```\n+   <link rel='stylesheet' href='style.css' />\n+ \
    \  ```\n+   \n+   The `rel` attribute specifies the link is a stylesheet, and\
    \ the `href` specifies the location of the `.css` file itself.\n+   \n+   - **Including\
    \ the CSS in a <style> tag in the <head> tag:** This is another way to specify\
    \ CSS, but is the least desirable way to go about it, as we'll have to update\
    \ it on every page if we want to change some style. However, when working with\
    \ only one file this isn't too much of an issue and this is why we've been doing\
    \ it this way throughout the book so far. In the `<head>` tag, you can add a `<style>`\
    \ tag, which will contain all your CSS definitions. Everything inside the `<style>`\
    \ tag is interpreted as CSS code, similar to how code inside a `<script>` tag\
    \ is considered as JavaScript code.\n+   \n+   - **Including \"in line\" CSS definitions\
    \ as style attributes on elements:** We've seen this in the previous chapters.\
    \ Everything inside the quotes of the style attribute is considered CSS code.\
    \ An example would be:\n+   \n+   ```\n+   <div id='map_element' style='height:500px;\
    \ width:500;' ></div>\n+   ```\n\n```\n<link rel='stylesheet' href='style.css'\
    \ />\n```\n\n```\n<div id='map_element' style='height:500px; width:500;' ></div>\n\
    ```\n\n![](img/1b8cd151c9f278555f9cf255b20d244e_193_0.png)\n\nFor those familiar\
    \ with the <link> tag, you may notice that we have only included the rel and href\
    \ attributes. We do not need to specify the type attribute in HTML5, the current\
    \ version of HTML at the time of writing."
  merge: -1
  img_proc: true
- pgno: 194
  md: "# Time for Action – using external CSS files\n\nLet's create a simple page\
    \ using an external CSS style sheet file (a .css file), making use of IDs and\
    \ classes.\n\n+   1. Create a new, empty HTML file. We'll just make a basic HTML5\
    \ page with a few `<div>` tags to demonstrate CSS inheritance. We'll also include\
    \ a `<link>` tag that will reference a CSS file created in the next step, which\
    \ contains all our CSS code.\n+   \n+   2. First, we'll need to start the HTML\
    \ page with a `DOCTYPE` tag that tells browsers this is an HTML5 standard page.\
    \ Then, we'll need an `html` tag and a `head` tag, which contains some meta information\
    \ (such as a `title` tag), and our JavaScript and CSS file links.\n+   \n+   3.\
    \ Now, we'll need to create a `body` tag which will contain our page's actual\
    \ content. We'll also put in some `div` tags, which act as content blocks. Each\
    \ `div` element will have a unique ID. Each div will also have at least one class.\
    \ Classes can be used by multiple elements, and you can apply multiple classes\
    \ to an element by separating the class name with a space:\n+   \n+   4. Create\
    \ a file called `ex1_style.css` and put in the following code. We'll specify a\
    \ `background` and text `color` property for the `body` tag. Because elements\
    \ inherit style from their parent element, every single element will also receive\
    \ these two properties (but they can be overwritten):\n\n```\n<!DOCTYPE html>\n\
    <html lang='en'>\n<head>\n    <meta charset='utf-8' />\n    <link rel='stylesheet'\
    \ href='ex1_style.css' />\n    <title>Ugly_Webpage_01</title>\n</head>\n```\n\n\
    ```\n<body>\n    <div id='title' class='background_green'>\n        Hello world!\n\
    \    </div>\n    <div id='content' class='background_green align_left'>\n    \
    \    The cake is a lie.\n        <div id='message' class='align_left'>\n     \
    \       Hello, world.\n        </div>\n    </div>\n</body>\n</html>\n```"
  merge: -1
