  md: "# Have a Go Hero – create more points\n\nNow that you know how to add a point\
    \ to the map, try to add some more points. Use the code from the previous example\
    \ as a guide to add multiple Geometry Point objects to your map. Change the coordinates\
    \ and see how the locations are affected. Also try to add a point outside the\
