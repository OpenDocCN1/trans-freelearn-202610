    \n# What Just Happened?\n\nWe just used the StyleMap and Style classes to apply\
    \ a custom style to our vector layer. The Style object we created (the `vector_style`\
    \ object) contains properties which determine what the features will look like.\
    \ If you were to create an empty style object (with no `key:value` pairs, just\
    \ an empty set of brackets `{}`), no styles would be applied to the layer—you\
    \ would be overwriting the default style with a blank, empty style.\n\nWe only\
    \ used a few symbolizer properties, such as `strokeColor`, but we'll go over a\
    \ full list of valid symbolizer properties later in this chapter. For now, let's\
    \ first talk more about how the StyleMap and Style classes work."
