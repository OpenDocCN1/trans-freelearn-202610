  md: "2. Before we create our button, let's create a function that will be called\
    \ when we click on the button via the `trigger` function. We're actually going\
    \ to create a variable and assign a function to it—this is one of the things that\
    \ makes JavaScript pretty powerful. Let's make the function change the map's layer\
    \ opacity and zoom to a random coordinate. Inside the `init()` function, add a\
    \ WMS layer and after the `map.addLayer(wms);` call, add the following. It will\
    \ generate a random coordinate, set the map's center to it, and change the WMS\
    \ layer's opacity:\n\n```\n```js\nvar custom_button_func = function(){\n    //Get\
    \ a random coordinate from -90 to 90\n    var random_lon = Math.floor(Math.random()\
    \ * 360) - 180;\n    var random_lat = Math.floor(Math.random() * 180) - 90;\n\n\
    \    if(map.layers[0].opacity === 1){\n        //If the layer opacity is 1 (fully\
    \ opaque), then change it and zoom\n        map.layers[0].setOpacity(.5);\n  \
    \      map.setCenter(new OpenLayers.LonLat(random_lon,\n        random_lat), 3);\n\
    \    }\n    else{\n        //If the layer opacity is anything but 1, change it\
    \ and zoom\n        map.layers[0].setOpacity(1);\n        map.setCenter(new OpenLayers.LonLat(random_lon,\n\
    \        random_lat), 3);\n    }\n};\n```\n```\n\n3. Now let's create our button\
