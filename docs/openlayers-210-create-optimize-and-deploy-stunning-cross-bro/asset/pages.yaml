- pgno: 329
  md: '# 11


    # Making Web Map Apps


    By now, we''ve covered all the parts of OpenLayers that are essential for making
    our own web map application. So far, we''ve been focusing on how to use the various
    different parts of OpenLayers. In this chapter we''ll put together those pieces
    that we''ve learned and demonstrate how to create an actual web map application
    with OpenLayers.


    While we won''t be introducing many new things in this chapter, we will be putting
    them together in ways we haven''t before. Throughout this chapter, we''ll:


    +   - Cover common development strategies

    +   - Learn how to interact with third party data

    +   - Build a web-mapping application from scratch using Flickr

    +   - Deploy our applications and discuss what deployment means

    +   - Discover how to build the OpenLayers library file


    # Development strategies


    In this chapter, we''ll be developing a web map application that loads in data
    from a third party source (Flickr). The examples have been structured with **iterative
    development** in mind. What this means is that you start small and make many changes,
    gradually building up your web map from nothing into something useful.'
  merge: -1
  img_proc: true
- pgno: 330
  md: '**Iterative development** is an important, popular, and effective way to develop
    applications. The core idea is that you create something simple, get it working,
    and then improve it. You can figure out more quickly what does and doesn''t work
    by improving on and learning from previous iterations.


    Another strategy we''ll make use of is **modular programming**. What this means,
    essentially, is that we try to keep things as discrete (or modular) as possible.
    By doing so, once we know a component works, we don''t have to worry about it
    later.


    # Creating a web map application using Flickr


    Because OpenLayers is so flexible, it''s easy to make third party software and
    data work with our maps. Sharing geospatial data is becoming more popular, with
    services such as Flickr and Twitter freely offering geospatially embedded data.
    Being able to visualize data often helps us to understand it. Using OpenLayers,
    we can place geospatial data (say, twitter posts or Flickr images) on a map and
    get a clearer picture about the data.


    # Note on APIs


    Many popular sites provide an **API (Application Programmer Interface)** which
    allows programmers to interact with their data. For instance, both Flickr and
    Twitter provide APIs that enables developers to view recent updates (photo uploads
    and tweets). These APIs (but not all APIs) let us get geospatial data that we
    can use with OpenLayers. Flickr provides some very easy to use methods to retrieve
    data with associated geographic information, so we''ll focus this chapter on building
    a web-mapping application around Flickr.


    # Accessing the Flickr public data feeds


    While Flickr provides a very robust developer API, we''ll only interface with
    Flickr via URL calls which provide access to feeds. Feeds provide information
    about data, and we can get different kinds of feeds (e.g., a specific user''s
    feed or the feed for all users combined). It''s really quite easy to do so; we
    just make a call to a URL and specify certain parameters. The base URL we''ll
    call is `http://api.flickr.com/services/feeds/geo/?format=kml`.


    The `format` parameter can be a number of values—JSON, RSS, SQL, etc. We''ll be
    using KML and JSON in this chapter. When calling this URL, a file in the format
    you ask for will be returned which contains information about the latest photos
    uploaded that have geographic information associated with them (that''s what the
    `geo` in the URL is for).'
  merge: -1
  img_proc: true
- pgno: 331
  md: '![](img/1b8cd151c9f278555f9cf255b20d244e_331_0.png)


    > Flickr''s API documentation can be found at http://www.flickr.com/services/api/.
    More information about the Flickr feeds can be found at http://www.flickr.com/services/feeds/.


    # Specifying data


    We can refine what data is returned by adding additional parameters to the URL.
    You can specify a user''s ID via the ID key, a group via the g key, and tags via
    the tags key. You can also specify other things, such as a certain coordinate
    and radius—for now, we''ll just be focusing on the tags key.


    # How we''ll do it


    Let''s create a web map application that will pull in data from Flickr and display
    it on a map. This will allow us to see, geographically, where photos were submitted
    from. We could, for example, search for ''bird photos'' and get an idea where
    some particular bird species might be common (or at least, commonly photographed
    and uploaded to Flickr). We''ll break down the development of this application
    into a few different examples, so let''s get started.


    # Time For Action – getting Flickr data


    The first step in our application will require us to get data from Flickr. We''ll
    request some data and then save it to the server.


    +   1. The first step is to figure out what sort of data we want to get. We''ll
    use the URL we mentioned before, but we''ll also specify a tag. Let''s use ''bird''
    as a tag. Open up this URL in your web browser, and you should be able to download
    it as a KML file `http://api.flickr.com/services/feeds/geo/?format=kml&tags=bird`.

    +   2. Save the file as `flickr_data.kml` and place it in your map directory.

    +   3. Open up the file and take a look at it. We won''t be editing it, but just
    take a look to see how the data is structured. Notice that there are `style` tags—if
    we want, we can directly apply the styles from the file to our map (as we''ll
    see soon).


    # What Just Happened?


    We just downloaded the latest images in KML format that contained a tag called
    ''bird.'' When you call the URL and pass in some tag, Flickr will return back
    to you the latest images uploaded that have some geographic information associated
    with them.'
  merge: -1
  img_proc: true
- pgno: 332
  md: '# Have a Go Hero – accessing the Flickr API


    Make a request to the URL from the previous example. Try changing the `tags` parameter
    and notice how the returned file is different. Based on the parameters in the
    URL, Flickr will return different data.


    # Why did we do this?


    You may be wondering why we downloaded the KML file. If you remember from Chapter
    9, we could just create a vector layer and point to the Flickr URL instead of
    a local file. However, if we download the KML file we then have direct control
    over it; we can modify it. When we''re in the ''development mode'', we want to
    keep things as easy to debug and fix as possible.


    # Reducing possible errors


    Once we get the code working to load the KML file we downloaded (in the next example),
    we don''t need to worry about it anymore. When we develop our application and
    find bugs or errors with it, we don''t have to spend much time tracking them down.
    We get the static file working, and we move on to the next task. We don''t have
    to worry about the Flickr API going down, our requests not completing, or other
    things—we can focus on other parts. Once we get more parts of our application
    working, then we''ll switch to using the dynamic URL. For now, let''s use the
    static file.


    ![](img/1b8cd151c9f278555f9cf255b20d244e_332_0.png)


    > Because we''ll be loading in a file, you must run this code on a server. You
    can run it on localhost—if you don''t have a server, you can download Apache for
    windows at http://www.apachefriends.org/en/xampp.html.

    > The reason it needs to run on a server is because the KML file is loaded via
    an AJAX call, and the files must reside on the same domain as the originating
    request. See Chapter 9 for more details on loading files.'
  merge: -1
  img_proc: true
- pgno: 333
  md: "# Time for Action – adding data to your map\n\nTime to get back to coding.\
    \ Now that we have the data from Flickr from the previous example, let's add it\
    \ to our map. We'll create a Google Maps base layer and then a vector layer filled\
    \ with the Flickr data on top of it.\n\n+   1. First, we need to make sure the\
    \ `flickr_data.kml` file is in the same directory that we'll be creating our map\
    \ in. Save the file in your server's document root folder, which may be something\
    \ like (with Xampp on windows) `c:/xampp/htdocs` or on OSX (with Xammp, http://www.apachefriends.org/en/xampp-macosx.html)\
    \ in `/Applications/XAMPP`, or on Linux: `/var/www/`. We'll refer to it as `example_1.html`.\n\
    +   \n+   2. Now let's create the map. We won't be using a WMS layer this time—instead,\
    \ we'll just be using a Google base map and place our vector layer on top of it.\
    \ Make sure to first add the reference to the Google Maps API in the `<head>`\
    \ section:\n+   ```\n+   <script src=\"http://maps.google.com/maps/api/js?sensor=false\"\
    ></script>\n+   ```\n+   \n+   3. Now, create and add a Google Maps layer.\n+\
    \   ```\n+   var google_map = new OpenLayers.Layer.Google(\n+       'Google Layer',\n\
    +       {}\n+   );\n+   map.addLayer(google_map);\n+   ```\n+   \n+   4. We'll\
    \ now need a vector layer. We'll have to define it's projection as `EPSG:4326`\
    \ because that's the projection the coordinates in the KML file are in. If they\
    \ were in a different projection, we would define it as whatever projection they\
    \ were in (although, we would need Proj4js to do projection transformations).\n\
    +   \n+   We'll use the `HTTP` protocol because we'll be accessing the KML file\
    \ from our local server. This is why we can't simply open up the page in a folder—when\
    \ we do so, the protocol is `file:///`, so we must open it from our local web\
    \ server (provided you have one installed, see the previous note).\n+   \n+  \
    \ Inside the protocol, we'll set up a `format` object from the `KML` class and\
    \ set `extractAttributes` to `true` so we can access the attributes associated\
    \ with each image. Finally, we'll use a `Fixed` strategy.\n+   ```\n+   var vector_layer\
    \ = new OpenLayers.Layer.Vector('Flickr Data',\n+       {\n+           projection:\
    \ new OpenLayers.Projection('EPSG:4326'),\n+           protocol: new OpenLayers.Protocol.HTTP({\n\
    +               url: 'flickr_data.kml',\n+   ```"
  merge: -1
  img_proc: true
- pgno: 334
  md: "```\nformat: new OpenLayers.Format.KML({\n    extractAttributes: true\n})\n\
    }),\nstrategies: [new OpenLayers.Strategy.Fixed()]\n}\n);\n```\n\n5. And add it\
    \ to the map:\n\n`map.addLayer(vector_layer);`\n\n6. We should see some points\
    \ now that show the location of the images that were uploaded. Open up the page\
    \ via localhost, for example: `http://localhost/openlayers_book/chapter_11/code/example_1.html`.\n\
    \n![](img/1b8cd151c9f278555f9cf255b20d244e_334_0.png)\n\n7. Now, let's take a\
    \ look at what `extractAttributes` is used for. When we set it to `true`, attributes\
    \ from each feature in the KML file is applied to the `attributes` property of\
    \ each feature object. More bluntly—it takes attributes from the file and applies\
    \ them to your points. Bring up Firebug and, in the console, access one of the\
    \ feature objects:\n\n`map.layers[1].features[0].attributes`"
  merge: -1
