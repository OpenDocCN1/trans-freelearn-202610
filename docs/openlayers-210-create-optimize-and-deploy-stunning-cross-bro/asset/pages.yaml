- pgno: 147
  md: '# 6


    # Taking Control of Controls


    *So far, we''ve taken for granted that the map will move when we drag it. Or that
    we can just click a layer in the layer switcher and it will turn on or off. Or
    that we can zoom in and out. We haven''t yet talked much about what actually is
    behind the map interaction or how it works.*


    *Simply put, the OpenLayers Control class is what makes our maps interactive.
    There are many built in controls, each with their own unique functions. But, not
    only do you have a large number of pre-made controls at your disposal, you also
    have the ability to easily create your own controls.*


    In this chapter, we''ll cover:


    +   - What controls are

    +   - Adding controls to a map

    +   - The Control class and its subclasses

    +   - Using panels to add controls outside of the map

    +   - Creating custom controls'
  merge: -1
  img_proc: true
- pgno: 148
  md: '# What are controls?


    **Controls** allow us to interact with our map. They also allow us to display
    extra information, such as displaying a scale bar with the **ScaleLine** control.
    Some controls do not have a visual appearance, such as the **ArgParser** control,
    but others do, such as the **OverviewMap** control. You can have as many controls
    on your map as you''d like. There are even some cases where you may not want any
    controls—such as embedding an unmovable map in a page, or showing a static map
    for printing.


    # Using controls in OpenLayers


    Most controls are added directly to the map, such as the **Navigation** control.
    Others are added to the map, but can also be placed in a `<div>` tag outside the
    map—like the overview map control.


    Other controls act similar to buttons which can be clicked or toggled on and off.
    These types of controls can be placed inside of a **panel**, which can also be
    placed outside the map.


    Furthermore, we can even create our own controls and place them directly in the
    map or inside of a panel. We''ll cover all this and more, so let''s get started
    with how to add controls to your map.


    # Adding controls to your map


    There are two methods for adding controls to a map.


    +   1. Pass in a JavaScript array of OpenLayers Control objects when you instantiate
    the map object.

    +   2. Add controls to the map object after it has been created by calling either
    of the two map functions `addControl()`, passing in a single control object, or
    `addControls()`, passing in an array of control objects.


    When you create your map, four control objects are added automatically. These
    four controls are:


    +   - `OpenLayers.Control.Navigation`: Responsible for handling map interaction
    from mouse events, such as dragging the mouse, zooming with the scroll bar, and
    double-clicking.

    +   - `OpenLayers.Control.PanZoom`: Adds a Pan/Zoom bar to the top left hand side
    of the map. Contains up/down/left/right arrows for panning, and zoom in, zoom
    out, and zoom to maximum map extent buttons for zooming.'
  merge: -1
  img_proc: true
- pgno: 149
  md: '+   - **OpenLayers.Control.ArgParser**: Allows the map to zoom to a specific
    location and turn on/off layers based on the URL that you call the map with. In
    other words, when you use the OpenLayers.Control.Permalink control to generate
    a URL, the ArgParser control will parse the URL and manipulate the map based on
    the parameters embedded in the URL. We''ll cover both controls in detail later
    in this chapter.

    +   - **OpenLayers.Control.Attribution**: This control will add attributions from
    layers to the map if any attributions are passed into the layer object.


    Since these controls are added without us explicitly adding them, how do we opt
    to not include them? The simplest way is to pass in an empty array to the `controls`
    property when we instantiate a map object.


    # Time for Action – creating a map with no controls


    Without controls, our map will not be interactive. This is sometimes exactly what
    you want, such as when displaying a map on a printer friendly page.


    +   1. First, we''ll need to create our map object and pass in an empty array
    to the `controls` property:

    +   ```

    +   map = new OpenLayers.Map(''map_element'', {

    +     controls: []

    +   });

    +   ```

    +   2. Now, no controls will be added to the map unless you manually call `addControl`
    or `addControls`. Let''s create and add a WMS layer to our map:

    +   ```

    +   var wms_layer = new OpenLayers.Layer.WMS(

    +     ''WMS Layer Title'',

    +     ''http://vmap0.tiles.osgeo.org/wms/vmap0'',

    +     {layers: ''basic''},

    +     {}

    +   );

    +   map.addLayer(wms_layer);

    +   ```

    +   3. Make sure you also set the extent—as stated in previous chapters, this
    step will be implied in all future examples:

    +   ```

    +   if (!map.getCenter()) {

    +     map.zoomToMaxExtent();

    +   }

    +   ```'
  merge: -1
  img_proc: true
- pgno: 150
  md: '4. Open up the page. You should see a map with no controls, and you won''t
    be able to pan around or zoom in since the map has no controls, as shown below:


    ![](img/1b8cd151c9f278555f9cf255b20d244e_150_0.png)


    # What Just Happened?


    We just created a map without any controls. Users cannot interact with the map—they
    can see it, but they cannot navigate or change it. By passing in an empty array
    when we instantiated our map object via controls: [], we overrode the four controls
    that are added to the map by default.


    # Time for Action – adding controls to a map


    There are tons of other controls that OpenLayers provides that aren''t passed
    in by default but are still very useful. Let''s take a look at some of them and
    how to add them to our map. After we cover how to do this, we''ll go over each
    Control class in more detail.


    1. What we''ll do now is create an array of control objects that we''ll pass in
    when creating our map object. Let''s create a NavigationControl object first.
    This way, we''ll be able to reference the control anywhere in our code easily.
    Next, we''ll create a JavaScript array that will contain the navigation_control
    object we created; along with four other control objects we''ll immediately instantiate.
    So, the first thing we''ll need to do inside our init() function is to create
    an array of control objects:


    ```

    var navigation_control = new OpenLayers.Control.Navigation({});

    ```'
  merge: -1
