- pgno: 78
  md: '9. Zoom in a few times around the Gulf of Mexico. You''ll start to notice black
    contour lines in the ocean when you zoom in, and you should see a resize effect
    from the base ground layer. Depending on where you zoom, you should see something
    like this:


    ![](img/1b8cd151c9f278555f9cf255b20d244e_78_0.png)


    # What Just Happened?


    We just created another map with a few more layers and demonstrated some more
    layer options. The map looks slightly different than the first example''s map
    because we are using different WMS server side layers (which are configured in
    each layer''s params argument).


    For now, let''s focus on the fourth argument passed in—the options argument. This
    argument is used in all Layer classes, so when we move on to other types of Layers
    you''ll be able to use all the same properties we''re talking about. The options
    argument controls the layer''s object''s properties.'
  merge: -1
  img_proc: true
- pgno: 79
  md: '# Configuring layer options


    Let''s take a look at a couple of the layer''s options argument we passed in during
    the previous example.


    ![](img/1b8cd151c9f278555f9cf255b20d244e_79_0.png)


    > Pay close attention to the commas. Both arguments and key:value pairs are separated
    by a comma, but make sure you do not have a comma after the last pair. Trailing
    commas will usually break your map and are usually a pain to debug—so if your
    map isn''t working and you don''t see any helpful error messages in Firebug, check
    for trailing commas. A great site to help with your code is http://jslint.com.


    # wms_state_lines layer options


    This layer''s options are:


    ```

    { displayInLayerSwitcher: false, minScale: 13841995.078125 }

    ```


    The first property, displayInLayerSwitcher, can be either true or false, and determines
    if the layer will appear in the layer switcher control (if there is a layer switcher
    control). In our example, we do have a layer switcher control and you''ll notice
    that we don''t see it in the list of layers. The layer is still there, and we
    can programmatically turn it on or off through the setVisibility() function, e.g.
    wms_state_lines.setVisibility(false). In fact, when you turn on or off a layer
    through the layer switcher control, this setVisibility function is what is being
    called. This property is useful when you want to include layers in your map that
    you don''t want to let the user control.


    The second property is minScale: 13841995.078125. The value for this property
    is float, a number that can contain a decimal point. This minScale property determines
    the minimum scale the map must be at before the layer is displayed, which basically
    means how far we must be zoomed in before the layer will be turned on. There is
    also a maxScale property which determines how far we can zoom in before the layer
    is turned off. The term for this behavior is referred to as scale dependency.


    # Scale dependency


    Scale dependency can be controlled either from the client or server side (or both).
    You''ll notice that the wms_water_depth layer (with black contour lines in the
    water to specify depth) does not turn on until we start to zoom in. We haven''t
    set the minScale property for the wms_water_depth layer, so why don''t we see
    it at all zoom levels? The reason is WMS server has its own scale dependencies
    on the server side, so even if we wanted to see this layer when the map is zoomed
    out we can''t because the server does not allow it.'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'When we set the `minScale` or `maxScale` properties on a layer, we are specifying
    client side scale dependency—so even if the server allows it, we''re telling OpenLayers
    not to show it. To determine the current scale of the map, you can call the `map.getScale()`;
    function which will show you the current scale value.


    # wms_layer_labels layer options


    This layer''s **options** property consists of:


    ```

    {visibility: false,  opacity:0.5}

    ```


    # The visibility property


    We''ve already covered the first property, so let''s talk about the `visibility`
    property. Its value can be either `true` (by default) or `false`. This visibility
    property controls if a layer is visible or not. Setting it to `false` will make
    it hidden, but the user can turn it on by enabling it in the layer switcher control.
    The `map.getVisibility()`; and `map.setVisibility({{Boolean}})`; functions refer
    to this property. `{{Boolean}}` means we can pass in a Boolean, in other words,
    we can pass in either `true` or `false`.


    # The opacity property


    The next property is `opacity`. It accepts a float with values between 0 and 1.
    A value of 0 means the layer will be completely transparent, and a value of 1
    means the layer will be completely opaque. We set it to `0.5` here, so it will
    be 50 percent opaque. If you turn on the layer in the map (you can click on the
    layer in the layer switcher to enable it), you''ll notice the labels are sort
    of see-through. This opacity setting helps you to create more visually pleasing
    maps, as by enabling multiple layers and changing their opacities you can produce
    some nifty effects.


    # Map tiles


    Let''s take a short break now and talk about just a little bit of theory. It has
    been mentioned that OpenLayers works by requesting ''map tiles'' from a backend
    map server, but I haven''t really gone much into what that means. Nearly all layers
    work on this map tiling principle (except the Vector layer and the Image layer).
    So, what is it exactly and how does it work?


    Think of how you might go about creating a web map from scratch—specifically,
    how would you handle the map image itself? You could go about it in two ways.
    First, you could just send back one giant image of a map. If the user zooms in,
    the server sends back an even bigger, more zoomed in image of a map. Using this
    strategy, you''d very quickly be sending over exponentially large image files
    every time the user zooms. This is why this method is not really practical.'
  merge: -1
  img_proc: true
- pgno: 81
  md: '# Many images make up a map


    The second way is that you break up the desired map image into a bunch of smaller
    images, or map tiles. So, no matter how far the user zooms in, the server only
    has to send over a relatively small amount of images. This sort of map tiling
    strategy is what nearly every web map does—Google Maps, Yahoo! Maps, most OpenLayers
    Layers, etc. When you request a new extent, OpenLayers asks for a new set of map
    images. Each map image is the same size (e.g., 256 x 256 pixels); this is referred
    to as the tile size, and can be specified when creating your map.


    Let''s take a look at an example of a basic OpenLayers map. In our example, when
    you''re completely zoomed out, the entire visible area will fit in one map tile
    image.


    ![](img/1b8cd151c9f278555f9cf255b20d244e_81_0.png)


    When the client asks for the map''s max extent, only one map tile needs to be
    returned. OpenLayers will figure out what extents to ask the map server for. In
    this case, it only needs to ask for one map tile, because we''re zoomed out so
    far that the entire world will fit in one map image.'
  merge: -1
  img_proc: true
- pgno: 82
  md: '# The ''Layers'' in OpenLayers


    At this point, you might be wondering if there is any benefit in breaking the
    images into tiles, as we''re only getting back one image. However, when we zoom-in,
    it becomes more clear.


    ![](img/1b8cd151c9f278555f9cf255b20d244e_82_0.png)


    Now we''ve zoomed in once. OpenLayers has to figure out what the extent of your
    map is, and how many tiles it has to ask the map server for. OpenLayers calculates
    the extent for each tile, and then sends a request to the map server to get an
    image of the requested extent. So, in this example, OpenLayers determines that
    it needs to send two requests to the map server. Each request will result in a
    response of a map image, and then OpenLayers will piece the tiles together.


    Keep in mind that the tile size is still the same as it was in the previous request.
    Your map only has one tile size, and in this case (and by default) it is 256 x
    256 pixels. You can change the size of the tiles with the map''s `tileSize` property,
    which we''ll talk more about in Chapter 8 on the **Map** class. So what happens
    when we zoom in and move the map around a little bit?'
  merge: -1
  img_proc: true
- pgno: 83
  md: '![](img/1b8cd151c9f278555f9cf255b20d244e_83_0.png)


    In this case, OpenLayers requests more tiles because the total map area is outside
    what you can see (called the Viewport). The tiles are all still 256 x 256 pixels,
    but now tiles lie outside of the map''s visible range. Any time the user moves
    their map to a new area (by zooming or panning), OpenLayers figures out how many
    tiles it needs to get, the extent for each tile, and where to place them.


    # Available layer properties


    Let''s go over the properties available for OpenLayers version 2.9, as we''ll
    be using them throughout the book. These properties can be used by any Layer class,
    as all Layer subclasses (such as the WMS and Google Maps Layer) inherit from them.'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# Data types


    Before we talk about the layer properties, let''s quickly go over the notation
    for the data types used. The curly brackets { } indicate the JavaScript data type
    the parameter expects. The data types are as follows:


    +   - `{Array}`: An array of elements separated by commas and enclosed in brackets.
    For e.g.: `[1,2,3]`

    +   - `{Boolean}`: Possible values are `true` or `false`.

    +   - `{Float}`: Possible values are numbers that can contain a decimal point.
    For e.g.: `42.5`

    +   - `{Integer}`: Possible values are whole numbers (no decimals). For e.g.:
    `42`

    +   - `{Object}`: An anonymous object, key:value pairs separated by commas, enclosed
    in curly brackets. For e.g.: `{''answer'': 42, ''question'': null}`

    +   - `{OpenLayers.________}`: An object instantiated from an OpenLayers class.
    The blank could be any OpenLayers class. For e.g.: `new OpenLayers.Control.LayerSwitcher({});`

    +   - `{String}`: Possible value is any string, indicated by enclosed quotes (either
    single quote, '' or double quote, "). For e.g.: `''This is a string''`


    Now that we''re familiar with some of the data types, let''s take a look at the
    Layer properties available to us.


    # OpenLayers.Layer class properties


    So far we''ve only been working with the WMS Layer class, but OpenLayers has many
    more Layer classes. The following properties apply to *all* layer classes. We
    can set these properties via the **options** argument when we create the layer,
    and we can access them in Firebug by simply calling `layer_object.property`.


    The following is a table of layer properties available as of OpenLayers version
    2.10. We will be using them throughout the book, and coming back to them often,
    so don''t feel as if you need to memorize them right now. The latest properties
    can always be found in the OpenLayers Layer docs at http://dev.openlayers.org/docs/files/OpenLayers/Layer-js.html.'
  merge: -1
  img_proc: true
- pgno: 85
  md: '| Property | Property Data Type | Description | Default Value |

    |---|---|---|---|

    | events | {OpenLayers.Event} | An OpenLayers event object. We can pass in an
    event object here that will call a function when an event, such as zooming in,
    occurs. We will talk more about events in a later chapter. | - |

    | map | {OpenLayers.Map} | The map object that this layer belongs to. This is
    set automatically when the layer is added to the map via the setMap() function.
    |  |

    | isBaseLayer | {Boolean} | Determines if a layer is to act as a base layer. |
    false |

    | alpha | {Boolean} | Specifies if the layer''s images contain an alpha channel.
    This was originally designed to fix transparency issues in IE, but incurs a large
    performance hit. It is recommended that you do not use this. | false |

    | displayIn LayerSwitcher | {Boolean} | Determines if the layer should be displayed
    in the layer switcher. | true |

    | visibility | {Boolean} | Determines if the layer is visible on the map and enabled
    or disabled in the Layer Switcher control. | true |

    | attribution | {String} | Text that is displayed when the Attribution control
