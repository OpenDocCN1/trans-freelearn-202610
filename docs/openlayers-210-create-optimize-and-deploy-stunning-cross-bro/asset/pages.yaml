- pgno: 215
  md: "# fallThrough\n\n```\nfallThrough: {Boolean} Default: true\n```\n\nThe fallThrough\
    \ property determines whether or not OpenLayers will allow events on the map to\
    \ propagate downwards (i.e., 'fall through') to other elements on your page.\n\
    \nLet's go over the meaning with an example. Say your map_element div has an event\
    \ attached to it that will show an alert when you click on it. This event is outside\
    \ of OpenLayers. Now, let's assume you create a map object and attach it to that\
    \ map_element div. If fallThrough is set to true (it is by default), you will\
    \ receive the original alert by clicking on the map—the mouse click event will\
    \ be allowed to 'fall through'. If it is set to false, you will not receive the\
    \ alert, as OpenLayers will consume that mouse click event.\n\n# layers\n\n```\n\
    layers: {Array {OpenLayers.Layer}}\n```\n\nWe've encountered this property, to\
    \ some degree, already. After the map is instantiated, we can access its layers\
    \ by calling map.layers. So far, we've been creating our map object, then our\
    \ layer objects, then adding the layers to the map with addLayer(). We can, however,\
    \ use the layers property when instantiating our map and pass in an array of layer\
    \ objects.\n\nPassing in layers using this property when we create our map object\
    \ or calling addLayers essentially does the same thing—use whichever method you're\
    \ most comfortable with. An example would be:\n\n```\nvar map = new OpenLayers.Map('map_element',\
    \ {\n    layers: [my_layer_1, new OpenLayers.Layer.WMS({ ... })]\n});\n```\n\n\
    You can pass in layer objects that have already been created (e.g., my_layer_1,\
    \ assuming a layer object with that name has been created), or by instantiating\
    \ a layer object in the call itself (e.g., new OpenLayers.Layer.WMS({...})).\n\
    \n![](img/1b8cd151c9f278555f9cf255b20d244e_215_0.png)\n\n> In the example above,\
    \ the ... would be replaced with the options for the WMS layer."
  merge: -1
  img_proc: true
- pgno: 216
  md: '# maxExtent


    maxExtent: {OpenLayers.Bounds} Default: bounds in decimal degrees, (-180, -90,
    180, 90)


    Setting this will specify the maximum extent of your map. Tiles that fall outside
    of the maximum extent will not be requested, nor can users pan to a coordinate
    that lies outside the maxExtent. If you are using a different projection than
    the default projection, you will need to change this to reflect the world''s coordinates
    in your desired projection.


    The maxExtent property''s data type is an OpenLayers.Bounds object. The OpenLayers.Bounds
    class is used to create a ''bounds'' object, which contains four coordinates that
    make up a bounding box. The four coordinates are minimum x (left), minimum y (bottom),
    maximum x (right), and maximum y (top). To instantiate a bounds object, you just
    pass in the coordinates in the order of:


    ```

    var bounds_object = new OpenLayers.Bounds(minx, miny, maxx, maxy);

    ```


    # minExtent


    minExtent: {OpenLayers.Bounds}


    Setting the minExtent will specify the minimum extent of the map. There is no
    default value for this property. You will usually not need to set this, unless
    you are specifying custom resolutions using maxResolution—in such case, you will
    usually set the values to (-1, -1, 1, 1).


    # restrictedExtent


    restrictedExtent: {OpenLayers.Bounds}


    This property specifies the bounds the user can navigate in—meaning that the user
    will be able to only pan around inside the bounds specified by the restrictedExtent
    property (if it is given, and if restricting their navigation is possible).


    Setting this property will still allow the user to zoom out and see parts of the
    map that are outside the restricted extent, but the map''s center will be set
    to the restricted extent. If you want to limit the zoom level, you could set the
    resolutions array, maxResolution, or scales properties (covered in the following
    pages). This property is similar to maxExtent, however, tiles outside the restrictedExtent
    will still be requested, but the user won''t necessarily be able to pan to them.


    # numZoomLevels


    numZoomLevels: {Integer} Default: 16'
  merge: -1
  img_proc: true
- pgno: 217
  md: "The numZoomLevels property specifies the amount of possible zoom levels that\
    \ your map will have. For many applications, giving users 16 zoom levels is not\
    \ always desirable. In most cases, just specifying the numZoomLevels (along with\
    \ maxExtent, if using a different projection) is all you need to do to set the\
    \ number of zoom levels. We'll see, as we look at other properties, more ways\
    \ to specify the number of zoom levels (some without using this property at all).\
    \ However, let's look at how to use this property to set the number of zoom levels—it's\
    \ pretty easy!\n\n# Time for Action – setting zoom levels and maxExtent\n\n1.\
    \ Create your map object, by specifying the numZoomLevels and adding a PanZoomBar\
    \ control. We'll also set the numZoomLevels property to 8, meaning that only eight\
    \ zoom levels will be available. Lastly, we'll set the maxExtent property to include\
    \ just a subset of the world, like the following:\n\n```\nmap = new OpenLayers.Map('map_element',\
    \ {\n    controls: [\n        new OpenLayers.Control.Navigation(),\n        new\
    \ OpenLayers.Control.PanZoomBar(),\n        new OpenLayers.Control.LayerSwitcher()\n\
    \    ],\n    numZoomLevels: 8,\n    maxExtent: new OpenLayers.Bounds(-100, -30,\
    \ 40, 30)\n});\n```\n\n2. Open up the page, and you should see something like\
    \ this:\n\n![](img/1b8cd151c9f278555f9cf255b20d244e_217_0.png)"
  merge: -1
  img_proc: true
- pgno: 218
  md: '# What Just Happened?


    Our map has only eight zoom levels and a maximum extent of (-100, -30, 40, 30).
    You must have noticed that the map started at a zoom level that is zoomed in a
    couple of times. This is mainly due to the fact that the furthest out zoom level
    would show more than the maximum extent of the map. Let''s quickly talk about
    what zoom levels are.


    Zoom levels accessing the map.zoom property (or calling map.getZoom()) will show
    your current zoom level (an {Integer} value). The zoom level numbers descend from
    0 (the ''furthest out'' zoom level—the level your map will usually start at) to
    the maximum zoom value minus one (since the first value starts at 0, not 1).


    In our example, the highest zoom value we can have is 7, because our numZoomLevel
    setting is 8. Since the zoom values start at 0, not 1, we have to subtract one
    from the maximum number of zoom levels to get the current zoom level value.


    On the PanZoomBar control, the very bottom item on the slider represents the zoom
    level further out (we''ll call this the minimum zoom level). The highest you can
    go will be referred to as the maximum zoom level. Now, if we''re using a third
    party API layer, we can simply set minZoomLevel and maxZoomLevel on those layer
    properties, but to set these values for the map (and other non third party API
    layers), we use either scales or resolutions along with min or maxScale, and min
    or maxResolution.


    # Map properties—Continued


    Let''s continue our discussion on map properties.


    # Resolutions


    ```

    resolutions: {Array{Float}}

    ```


    This is an array of resolutions the map will use. Each value in the array is a
    possible zoom level. If you do not pass this in when instantiating your map (or
    layer), it will be automatically determined based on other properties, such as
    maxExtent. Setting this property is another way to specify the number of zoom
    levels on your map. The resolutions array descends from high values to low values.


    Resolution is the width/height in map units per pixel—so, for example, 150 miles
    divided by 512 pixels would be a resolution of 0.29296875. If you are using a
    tile cache server, you will need to specify the resolutions at which the tiles
    are cached (as well as set the serverResolutions property, which specifies the
    resolutions at which the tiles are cached on the server). Otherwise, you will
    often simply just define the numZoomLevels to specify how many zoom levels you
    want.'
  merge: -1
  img_proc: true
- pgno: 219
  md: '![](img/1b8cd151c9f278555f9cf255b20d244e_219_0.png)


    > Another quick note on the resolutions array is that each value in the array
    is half the value of the previous item. So, if the first item in your resolutions
    array was 0.703125, the next value would be 0.3515625, the next 0.17578125, and
    so on.


    # Time for Action – using resolutions array


    Setting the resolutions array is one way to specify the number of zoom levels.
    Let''s see it in action.


    +   1. In the map object definition specify the resolution array as the following:

    +   ```

    +   map = new OpenLayers.Map(''map_element'', {

    +       resolutions: [ 1.40625,0.703125, 0.703125, 0.3515625,

    +   0.17578125, 0.087890625, 0.0439453125 ]

    +   });

    +   ```

    +   2. Zoom around on the map. Because we''ve only provided five possible resolutions,
    you should be able to zoom in five times.


    # What Just Happened?


    Using the resolutions array, we were able to specify the number of zoom levels.
    Unless we''re using a cached tile service, this isn''t necessarily the easiest
    way to specify the number of zoom levels. We have mentioned earlier we can also
    use scales, and we can also use minResolution and maxResolution.


    # Map/Layer property inheritance


    Resolutions/scales/max extent etc. properties can be specified in the map object
    or layer objects. Preferably, they should be specified in the map, as you won''t
    have to worry about which layers to apply the properties to. However, if you do
    not specify them in the map, then the settings of the base layer will be applied
    to the map. This isn''t necessarily bad, but it can be a bit ambiguous as to what
    layers are controlling the resolutions, because if these properties are set in
    overlay layers they won''t necessarily be applied.


    So, to be safe, if you set those properties on the map then you don''t have to
    worry about applying them to layers. The main exception is if you are using a
    third party API layer—in this case, you must set those layer properties, such
    as minZoomLevel, maxZoomLevel, (two third party API specific properties cannot
    be set on the map), and numZoomLevels.


    If you want to set properties that mimic limiting the minimum or maximum zoom
    level, you can use max/minResolution or max/minScale, which we''ll cover now.'
  merge: -1
  img_proc: true
