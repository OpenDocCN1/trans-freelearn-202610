    # What Just Happened?


    We just demonstrated a few more event types. You can also figure out how the events
    propagate (which events get executed first) by viewing the console log. From the
    example above, we can see that the sketchcomplete event get executed before the
    featureadded event.


    Even though we registered the featureadded event first, the order that we register
    the events in does not change the order that the events propagate in. We''ll be
    using more of the vector layer events throughout the chapter, but it shouldn''t
    be much more complicated than the previous two examples. So, let''s get on with
