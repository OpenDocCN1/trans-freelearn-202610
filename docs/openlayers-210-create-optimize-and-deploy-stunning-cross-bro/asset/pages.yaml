- pgno: 300
  md: "![](img/1b8cd151c9f278555f9cf255b20d244e_300_0.png)\n\n> When we talk about\
    \ symbolizers, we're just referring to an anonymous object that defines styles\
    \ (or, by some stretch, their 'symbol'). The term 'symbolizer' is maybe not the\
    \ best term that could have been used, but it's part of the OpenLayers vocabulary\
    \ so we need to learn it.\n\nTo create a Style object, we just pass in a symbolizer\
    \ (an anonymous object) that defines the layer's style. As in the previous example:\n\
    \n```\nvar vector_style = new OpenLayers.Style({\n  'fillColor': '#669933',\n\
    \  'fillOpacity': .8,\n  'strokeColor': '#aaee77',\n  'strokeWidth': 3,\n  'pointRadius':\
    \ 8\n});\n```\n\nThat's essentially all there is to it for creating a style object!\
    \ A `context` property can also be specified, which can be used to provide additional\
    \ variables to be used for the style class with **attribute replacement**—we'll\
    \ talk about that soon.\n\nAfter creating our style object, we can then use it\
    \ with a StyleMap object. We could also apply the symbolizer (but not the `vector_style`\
    \ object itself) to the layer's `style` property and 'skip' the StyleMap object\
    \ step—although, it is recommend that you do it this way, as it's a bit limiting\
    \ and it's not as 'clean' or modular as using a StyleMap object.\n\n**Rules**\
    \ and **filters** can also be applied to our style objects to get even more fine\
    \ grain control over feature styles, as we'll see soon. First, let's go over the\
    \ valid symbolizer properties.\n\n# Symbolizer properties\n\nThe following properties\
    \ can be used when creating a style symbolizer. Some properties will only affect\
    \ certain types of geometries (e.g., the `font` type properties apply only to\
    \ `text` features). We'll go over some of the more common symbolizer properties\
    \ first, and then cover the remaining properties.\n\n# List of common symbolizer\
    \ properties\n\n+   - **cursor**: The cursor style to use when the mouse is over\
    \ a feature. Can be any valid CSS cursor style, such as `help`, `move`, `cursor`,\
    \ `crosshair`, `text`, `wait`, `pointer`, or `progress`.\n+   - **fillColor**:\
    \ Color of the fill area, a six digit RGB value. Example: `#000000` would be black\
    \ (`00` red, `00` green, and `00` blue.) `#ffffff` would be white."
  merge: -1
  img_proc: true
- pgno: 301
  md: '+   - **fillOpacity**: Specifies the opacity of the filled area, ranging from
    0 to 1 (1 being fully opaque, 0 being fully transparent).

    +   - **fontColor**: The font color, a six digit RGB value. Example: `#000000`
    would be black (00 red, 00 green, and 00 blue.) `#ffffff` would be white.

    +   - **fontFamily**: Specifies the font family to use for labels. Similar to
    the CSS `font-family` property. An example value would be `Arial` or `sans-serif`.

    +   - **fontOpacity**: Opacity of font, ranging from 0 to 1 (1 being fully opaque,
    0 being fully transparent).

    +   - **fontSize**: Specifies the size of the font. Can be any valid font-size
    CSS value, such as in pixels (e.g., `''18px''`) or em units (e.g., `''1.2em''`).

    +   - **fontWeight**: The font weight to be applied. Can be a valid CSS font-weight
    property, such as `normal` or `bold`.

    +   - **graphicName**: Specifies the type of the graphic to use when rendering
    points. The default value is `''circle''`, and will cause points to be rendered
    as circles. Other possible values include `''square''`, `''star''`, `''x''`, `''cross''`,
    and `''triangle''`. Other styles, such as fill and stroke properties, will still
    be applied to the type of shape drawn. For example, `''graphicName'': ''square''`
    will produce a square for points instead of a circle.

    +   - **label**: Text to apply to a feature. The value of this property is a `{String}`
    type, for example, `label: ''My Label''`.

    +   - **labelAlign**: Determines where to align the label (if one is provided).
    Unlike the `align` property in CSS, the `labelAlign` property takes in one or
    two characters, one for horizontal alignment and one for vertical alignment. The
    possible horizontal values are `''l''` (left), `''c''` (center), and `''r''` (right).
    Possible vertical values are are `''t''` (top), `''m''` (middle), and `''b''`
    (bottom). The alignment refers to a point relative to where the text would be,
    which means a `''t''` (top) alignment would actually put the label at the bottom,
    since the insertion point is to the top of the text (a little confusing, but it
    might help to think of the alignment as ''opposite'' of where you want the labels
    to be). A valid value is any single or two letter combinations of the horizontal
    and vertical values—such as `''r''` (right) or `''lb''` (left bottom).

    +   - **labelSelect**: If set to `true`, labels can also be selected with the
    `selectFeature` control. Default value is `false`.

    +   - **labelXOffset**: How far, in the X direction, to offset the label (in pixels).

    +   - **labelYOffset**: How far, in the Y direction, to offset the label (in pixels).

    +   - **pointRadius**: Specifies how large, in pixels, the radius of point features
    will be. Default value is 6.

    +   - **stroke**: Specifies whether to show a stroke. Set to `false` if you wish
    to have no stroke shown.'
  merge: -1
  img_proc: true
