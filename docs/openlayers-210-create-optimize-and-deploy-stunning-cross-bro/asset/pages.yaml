- pgno: 52
  md: '# Squashing Bugs With Firebug


    When you click on the Firebug icon (near the bottom right of your browser''s window),
    Firebug will open and you can start using it. But before we start, let''s take
    a look at what Firebug looks like after initially installing it and clicking on
    the Firebug icon:


    ![](img/1b8cd151c9f278555f9cf255b20d244e_52_0.png)


    The top row contains two icons (a Firebug icon and a Page Inspector icon), multiple
    panels that provide specific functionality (they look and act similar to tabs,
    but the technical term is "panels"), a search box, and finally minimize, maximize,
    and close the buttons. Let''s go over the items, left to right, one at a time.


    > The position of the icons may change over time as Firebug is updated; but the
    general functionality should remain (more or less) the same.


    # Firebug controls


    Firebug icon: The Firebug icon on the top left contains various commands and options
    related to Firebug when you click on it.


    Page Inspector icon: This icon, a cursor inside a rectangle, is the HTML Inspector.
    When you click on it, your mouse cursor will identify HTML elements on the web
    page. So, when you mouse over anything on a website, the element will be outlined
    in blue and the HTML panel will open up and show you the element your mouse is
    over.


    # Panels


    The next set of controls is called panels; each panel provides a different type
    of function. The panels act like tabs (the two terms can be used interchangeably),
    but Firebug refers to them as ''panels'' in the documentation. Let''s go over
    each panel, since they are, essentially, what makes up Firebug.'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# Console panel


    Firebug''s **Console panel** is where we''ll spend most of our time. It acts as
    a powerful JavaScript command line, or interpreter, which means we can type in
    JavaScript code and execute it right away—no need to save or edit any files.


    One thing that makes this so useful is that we can interact directly with the
    **DOM (Document Object Model**—any HTML element on the webpage), including any
    existing JavaScript code the page contains. So, this means we''re able to interact
    with our OpenLayers map on the fly, issuing command and testing code to instantly
    see what works and what doesn''t. As you can imagine, this saves a ton of time!


    By default, the Console panel is disabled. To enable it, click on the arrow near
    the **Console** text and select **Enabled.**


    ![](img/1b8cd151c9f278555f9cf255b20d244e_53_0.png)


    # HTML panel


    The HTML panel provides not just a display of the HTML source code, but also the
    ability to quickly edit any HTML element and its associated style. You can add
    and remove HTML elements, edit HTML attributes, and change nearly anything about
    the page without having to save any files. It''s great for development.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# How it works


    Firebug automatically builds a tree structure from your HTML code, allowing you
    to expand and hide each HTML tag. It is important to note that the code you see
    in the HTML panel is generated HTML code—the code in the panel may not be exactly
    the same as the page''s source code.


    # HTML panel contents


    Here is what the HTML tab looks like when Firebug is opened while viewing a webpage:


    ![](img/1b8cd151c9f278555f9cf255b20d244e_54_0.png)


    On the left side, Firebug shows us the HTML of the page. We can right click on
    any tag and do various things—such as copying the HTML to the clipboard, deleting
    the element, changing the tag attributes, and more.


    On the right side, we see the associated style information for the element we
    have selected. Here, we can modify or add properties and they will instantly appear
    on the page. In this example we selected a div element with a class of ''left_sidebar_item''.
    Looking at the CSS on the right side, there is no definition for the ''left_sidebar_item''
    class (if there was, we would see something called .left_sidebar_item, with a
    period in front of it to indicate that it is indeed a class). We do, however,
    see a definition for #left_sidebar, which is a parent div of the currently selected
    div.


    > If you are unfamiliar with HTML or CSS, the w3schools site is a great resource.
    For more information on HTML, visit http://www.w3schools.com/html/default.asp
    and for CSS visit http://www.w3schools.com/css/default.asp.


    What does this mean? Well, Firebug lists all inherited style information, and
    parent element styles propagate down to all their child elements (each child has
    all its parent''s styles, unless the child overrides a style, which doesn''t happen
    in this example). That''s why we also see the body, html definition, and every
    div will display that, since every div sits inside the <html> and <body> tags
    of the web page.'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'By double clicking on pretty much anything in the HTML or CSS list you can
    quickly change values and names. Any change you make will immediately show up
    on the page, which makes it very easy to change style in real time and see how
    the page is affected without having to edit and save any files. Play around with
    it a bit—if you mess anything up, you can just reload the page.


    > When editing pages with Firebug, any changes you make will disappear when you
    refresh the page. You are not editing the actual web server''s files with Firebug—instead,
    you are editing a copy that is on your computer that only you can see when you
    make changes to it. So, if you make any changes and want them to be saved, you''ll
    have to edit your actual source code.


    # CSS panel


    This panel provides similar functionality as the CSS sidebar in the HTML panel
    we just talked about. It also provides the option to edit any CSS document associated
    with the page, not just the style of a selected element. We need not talk much
    about this panel, and for the purposes of this book we won''t spend much time
    here. But if you are a web designer, this is another powerful panel that can greatly
    speed up your development time.


    # Script panel


    The Script panel is very powerful. Not only does it allow you to view all the
    JavaScript code associated with the page, it is a great real-time code debugger.
    You can set watch expressions, view the stack, set breakpoints, etc. If those
    terms are foreign, don''t worry, we won''t be spending much time with this panel.


    However, before we move on to the next panel I want to quickly talk about enabling
    breaking on errors. With this option enabled, Firebug will stop the web page whenever
    a JavaScript error is encountered. This makes it very easy to quickly pinpoint
    where your page is blowing up at. To enable it, simply click on the pause-button
    icon.


    ![](img/1b8cd151c9f278555f9cf255b20d244e_55_0.png)'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'Keep note of when you enable it—I’ve been frustrated more than once when developing
    because I forgot that it had been enabled. When it is enabled, the `Script` text
    will glow yellow, as demonstrated in the above screenshot. You can also enable/disable
    it through the Console panel.


    Unfortunately (depending on your viewpoint), we can’t go much more in depth with
    these tools, as it is outside the scope of this book. But please feel free to
    play around with them, as Firebug’s powerful debugger is a great resource. More
    information on it can be found at http://getfirebug.com/errors.


    # DOM panel


    The next panel is the Document Object Model panel, or **DOM** panel. The DOM is,
    basically, a representation of HTML elements as objects. The DOM panel automatically
    sets up a tree structure to represent our HTML page, allowing us to view everything
    our HTML page contains. We can also see JavaScript variables and their values,
    as well as functions, objects, and more. When using the DOM panel, attributes
    and properties are colored black, and functions and methods are colored green.


    We won’t go much more in depth here, but the DOM panel is a very valuable tool,
    especially when you want to take a peek at JavaScript components. By using the
    DOM panel (and assuming we are looking at a page that includes OpenLayers), we
    can quickly see all of OpenLayer’s classes, functions, etc. It is not a replacement
    for the API docs, but serves as a good, quick way to view such information.


    # Net panel


    Firebug’s **Net** panel is a tool we will often use throughout this book. Basically,
    it provides a way for us to monitor network activity by viewing all the requests
    and responses the web page is making. We can see any Asynchronous JavaScript (**AJAX**)
    request the page makes. Without AJAX, we would have to refresh our entire page
    anytime we wanted to do anything with our OpenLayers map. So, for example, every
    time you zoom in, OpenLayers makes a series of **requests** to the map server
    to get new map images, and the map server’s **response** is a new map image that
    OpenLayers then displays. This request/response method is handled via AJAX—without
    it, we would have to refresh the entire page after every request.


    ![](img/1b8cd151c9f278555f9cf255b20d244e_56_0.png)


    > AJAX is a method by which, through JavaScript, you can send a request to a server
    and receive a response without actually refreshing the page. Traditionally, if
    you want your web page to get an update from the server, you would need to have
    the page itself send a request.'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'The Net panel allows us to see the URL that is being requested, the GET or
    POST parameters, the server''s response, the size of the response in KB, and the
    time it took to complete the request. You may also have to enable the Net panel—it
    can be enabled in a similar way we enabled the Console panel, by clicking on the
    arrow next to the Net text on the top tab. Let''s take a look at what the Net
    panel looks like for the example from Chapter 1:


    ![](img/1b8cd151c9f278555f9cf255b20d244e_57_0.png)


    Before we talk about the requests being made, take a look at the toolbar above
    the lists of requests—the one that contains the links Clear, Persist, All, HTML,
    etc. Clicking on Clear will do what its name implies—clears out the list of requests.
    Clicking on Persist will cause the list of requests to persist, or not get deleted,
    on page reloads.


    The next grouping of links allows us to filter the requests by type. Because we
    are getting back only images from the map server in this case, all the requests
    you see would belong to the Images option. If the CSS option was clicked, we would
    not see those requests, as they are not CSS files.


    Now, let''s break down the actual request list.


    # Request list


    The request list shows us all the requests the page makes. Each URL in the previous
    screenshot is a URL that OpenLayers is making a request to. By clicking on the
    + (plus) sign next to each request, we can get more information about the request,
    including the full request URL and the response. When we click on the plus sign,
    we get a box with Params, Headers, Response, and Cache tabs. The Params tab lists
    all the parameters, or key/value pairs the URL contains. The Response tab provides
    us with the server''s response to our request. For the purpose of this book, we
    do not need to worry about the other two tabs.'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# Parameters


    Take a look again at the list—before we mouse over the text in the screenshot,
    the titles contain GET vmap0?LAYERS. The GET specifies that the request type is
    GET, which basically means we are embedding variables inside the URL itself with
    key=value pairs, separated by a & sign.


    When we mouse over a URL, we can see more of it—as in the previous screenshot,
    we see a bunch of variables in the format key=value&key=value& . . . These values
    correspond to the values listed in the Params tab when you expand the URL.


    If you take a look at the link we have our mouse over, you''ll notice that the
    URL is the same as the URL from the example in Chapter 1, http://labs.metacarta.com/wms/vmap0.
    However, there is an additional text after vmap0; a question mark followed by
    key=value pairs. The question mark signifies the start of the key=value pairs
    in a GET request.


    Let''s take a look at some of the variables the URL contains.


    ```

    ?LAYERS=basic&SERVICE=wms . . .

    ```


    The LAYERS key should look familiar, as we specified in Chapter 1. In that example,
    we used the code:


    ```

    {layers: ''basic''},

    ```


    When we defined the key:value pair, we were essentially telling OpenLayers what
    to pass into the actual URL it generates. From the generated URL, we can see that
    it did indeed pass over the right layer name. Now, as we discussed earlier, this
    layer name, basic, is the layer we want from the WMS service. The layer name we
    pass in here affects what image the WMS server responds with. In this case, we''ll
    get back an image with the layer named basic.


    Notice that there are many more parameters (separated by & signs) than what we
    passed in. OpenLayers automatically adds these parameters for you, so we get back
    the right image of a map without us having to manually build each URL.


    To see the entire key:value pairs, or parameters, expand the URL and look at the
    Params tab.


    ![](img/1b8cd151c9f278555f9cf255b20d244e_58_0.png)


    > Note that these GET variables, such as LAYERS and SERVICE are specific to WMS.
    Other layer types will use different values.'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# BBOX parameter


    One of the important variables to take a look at in the URL is the BBOX, or Bounding
    Box, parameter. Expand one of the URLs by clicking on the plus sign next to it
    and take a look in the Params tab. This BBOX number is the extent of that individual
    map image piece. You''ll see a number in the following format:


    ```

    minx, miny, maxx, maxy

    ```


    These four numbers form a rectangle that contains the extent of the map image.
    A number example might be something like -73.5, 39.3, -67.5, 45. These numbers
    will depend on the projection your map is in—but don''t worry too much about that
    for now.


    If you look at the BBOX parameter of other URLs, you''ll notice that part (or
    all) of the BBOX values change for each request. URLs that are grouped together
    in the request list share some values for their BBOX parameter. It is analogous
    to a grid; each request returns an individual cell of the grid. (This functionality
    is not the same for all Layer types in OpenLayers, but this basic concept holds
    for the majority of Layer types, including the WMS layer in this example.)


    # Pop Quiz– panel


    +   1. What panel would you use if you wanted to execute JavaScript code?

    +      a. The Net panel

    +      b. The Console panel

    +      c. The DOM panel

    +      d. The HTML panel


    # Panel conclusion


    Each panel serves a certain purpose and all of Firebug''s panels are extremely
    useful, but throughout the book we will be mainly focusing on the following panels:


    +   - Console panel (Command Line JavaScript)

    +   - HTML panel

    +   - Net panel


    These three panels will be used the most throughout the book. We''ll occasionally
    come back to the other panels, but we won''t spend a whole lot of time with them.
    However, before we conclude this chapter, let''s get a bit more familiar with
    the Console panel, since we''ll be making heavy use of it in the coming chapters.'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# Using the Console panel


    We talked a bit about what the console panel is—essentially, a JavaScript command
    line. We can execute any JavaScript code we want, and interact with any page element.
    There are two primary components to the Console panel—the console log area and
    the input area.


    The console log area will display information about any errors, along with displaying
    any code that is entered. The input area allows us to either enter a single line
    of code or, by clicking on the red arrow on the right side of the input box, multiple
    lines of code.


    Before we start using the console with our maps, let''s get familiar with the
    console by executing some JavaScript code.


    # Time for Action – executing code in the Console


    We''re going to do some basic JavaScript coding via the Firebug console; specifically,
    just calling a built in alert() function to display an alert.


    +   1. Open up Firefox. It doesn''t matter at this point what website (if any)
    that you go to, since we will be writing a stand alone code.

    +   2. Open up Firebug by clicking on the Firebug icon. Go to the Console panel.
    If it is not enabled, enable it.

    +   3. Now, at the bottom of your screen you''ll see an area where you can enter
    code, designated by >>>. Clicking anywhere after that will allow you to enter
    the code.

    +   4. Type in the following code, and then hit Enter.

    +   5. You should see an alert box pop up with the text `Narwhals like bacon`
    (or whatever string you passed into the `alert` function). After the code is executed,
    it will appear in the log above the input line.


    ```

    alert(''Narwhals like bacon'');

    ```


    ![](img/1b8cd151c9f278555f9cf255b20d244e_60_0.png)'
  merge: -1
  img_proc: true
- pgno: 61
  md: "# What Just Happened?\n\nWe just executed some JavaScript code without having\
    \ to edit and save any files. Although we did a simple alert, we are really not\
    \ limited by what we can do. Anything that we could save in a JavaScript file,\
    \ we could enter in the Console.\n\nYou'll also notice that the same code that\
    \ we typed in appeared in the log area. We'll also get an error message if any\
    \ errors occur with the code—go ahead and try it! Instead of typing alert('My\
    \ alert'); type something like fakealert('Boom');. This will give you a reference\
    \ error, since nowhere is the function fakealert() defined—alert(), on the other\
    \ hand, is a built in function, so we can call it from any page.\n\nThat's pretty\
    \ much to it! The rest just builds on those principles. Let's go ahead and do\
    \ just one more thing, something only slightly more involved, before jumping into\
    \ manipulating an OpenLayers page.\n\n# Time for Action – creating object literals\n\
    \nWe're going to introduce object literals and get acclimated with how to manipulate\
    \ them now, so we can better work with OpenLayers code.\n\n+   1. Open up Firefox\
    \ and Firebug's Console panel (enabling it if it disabled)—again, it doesn't matter\
    \ right now what page you're on.\n+   \n+   2. Click on the red arrow on the bottom\
    \ right, above the Firebug icon. This will open up a side panel where we can type\
    \ in multiple lines of code. The code will not be executed when we press Enter,\
    \ like in single line mode. Instead, we can execute the code by either pressing\
    \ Ctrl + Enter or clicking Run.\n+   \n+   3. Type in the following code, and\
    \ then execute it by pressing Ctrl+Enter or clicking Run.\n+   ```javascript\n\
    +   var my_parameters = {'answer': 42, 'question': null};\n+   console.log(my_parameters);\n\
    +   ```\n+   \n+   4. The above code should display, in the console log area,\
    \ something similar to Object { answer=42 }. Click on it, and the DOM panel will\
    \ open, showing you all the information about the object you just created.\n+\
    \   \n+   5. Click on the Console panel to get back to it. In the input box, add\
    \ the following code to the existing code and execute it:\n+   ```javascript\n\
    +   console.log(my_parameters.answer);\n+   ```"
  merge: -1
  img_proc: true
- pgno: 62
  md: '6. You should see a line of output in the console area containing the number
    42.


    ![](img/1b8cd151c9f278555f9cf255b20d244e_62_0.png)


    # What Just Happened?


    We just created what is called in JavaScript an anonymous object, or object literal.
    Now, we have discussed how objects are created from classes, and in JavaScript
    we need to use the new keyword to instantiate an object from a class. But there
    is no new keyword here!


    # Object literals


    The key concept here is that we are just creating a single object that does not
    derive from a class. Since object literals (anonymous objects) do not derive from
    a class, it is, essentially, an empty object. It contains only what we explicitly
    define. The value associated with a key can be almost anything—a string, integer,
    function, array, or even another object literal.


    We encountered object literals in Chapter 1 when we discussed JavaScript Object
    Notation—they were the {key:value} pairs used to define the parameters and options
    of our layer and objects. The only difference is that we did not assign a variable
    to them; we simply passed them in when we created our layer object.


    Object literals are extremely useful for a variety of tasks, and it is a great
    way to package information in an easy to use form. They are in the form of {key:value,
    key2:value2}. We can access any property of an object literal by using dot notation,
    in the form of my_object_literal.key. The key, like before, is the key part of
    the key:value pair. In the above code, we call console.log(my_parameters.answer);
    and the value of the key answer is displayed in the console''s log area.'
  merge: -1
  img_proc: true
- pgno: 63
