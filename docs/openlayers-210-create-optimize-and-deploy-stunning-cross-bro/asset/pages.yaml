    \    \n    //Clear out the div\n    info_div.innerHTML = '';\n}\n```\n\n10. Now,\
    \ we just need to register the events.\n\n```\nvector_layer.events.register('featureselected',\
    \ this, on_select_feature);\nvector_layer.events.register('featureunselected',\
    \ this, on_unselect_feature);\n```\n\n11. Now, when we click on a cluster we should\
