- pgno: 339
  md: "5. So far, so good. Our points look kind of small though, and we can't visually\
    \ distinguish how many points are in a cluster. Let's change that. We'll make\
    \ the clusters larger depending on how many points the cluster contains. When\
    \ using clustering, each feature belongs to a cluster, and we can access the number\
    \ of features in a cluster through feature.attributes.count. Let's also add a\
    \ label to each feature showing the number of points it contains. We'll also pass\
    \ in a second context object when instantiating the style object, which allows\
    \ us to define the values of variables to use with attribute replacement. The\
    \ context object will contain a function that returns some value which will be\
    \ used with the attribute replacement.\n\n```\n//Create a style object to be used\
    \ by a StyleMap object\nvar vector_style = new OpenLayers.Style({\n    'fillColor':\
    \ '#669933',\n    'fillOpacity': .8,\n    'fontColor': '#f0f0f0',\n    'fontFamily':\
    \ 'arial, sans-serif',\n    'fontSize': '.9em',\n    'fontWeight': 'bold',\n \
    \   'label': '${num_points}',\n    'pointRadius': '${point_radius}',\n    'strokeColor':\
    \ '#aaee77',\n    'strokeWidth': 3\n},\n    //Second parameter contains a context\
    \ parameter\n    {\n        context: {\n            num_points: function(feature){\
    \ return feature.attributes.count; },\n            point_radius: function(feature){\n\
    \                return 9 + (feature.attributes.count)\n            }\n      \
    \  }\n    }\n));\n```\n\n```\n//Create a style map object and set the 'default'\
    \ intent to the\nvar vector_style_map = new OpenLayers.StyleMap({\n    'default':\
    \ vector_style\n});\n```\n\n```\n//Add the style map to the vector layer\nvector_layer.styleMap\
    \ = vector_style_map;\n```"
  merge: -1
  img_proc: true
- pgno: 340
  md: "6. Let's take a look. The size and labels should change for each cluster:\n\
    \n![](img/1b8cd151c9f278555f9cf255b20d244e_340_0.png)\n\n7. The first part of\
    \ our plan is done—we've successfully added clusters. Now, we need to add feature\
    \ selection ability. Let's create a selectFeature control. We'll add events soon,\
    \ but for now let's just create the control and add it to the map and then activate\
    \ it.\n\n```\n//Add a select feature control\nvar select_feature_control = new\
    \ OpenLayers.Control.SelectFeature(\n    vector_layer,\n    {}\n)\nmap.addControl(select_feature_control);\n\
    select_feature_control.activate();\n```\n\n8. Now, if we select a feature it won't\
    \ look quite right. This is because we haven't defined a style for the select\
    \ intent. Let's go back and define a style object and add it to our vector_style_map\
    \ object:\n\n```\nvar vector_style_select = new OpenLayers.Style({\n    'fillColor':\
    \ '#cdcdcd',\n    'fillOpacity': .9,\n    'fontColor': '#232323',\n```"
  merge: -1
  img_proc: true
- pgno: 341
  md: "```\n'strokeColor': '#ffffff'\n})\n//Create a style map object and set the\
    \ 'default' intent to the\nvar vector_style_map = new OpenLayers.StyleMap({\n\
    \  'default': vector_style,\n  'select': vector_style_select\n});\n```\n\n9. On\
    \ to the last part—creating the events. Our plan is to have some photo information\
    \ display when we select features. Let's go ahead and get the framework for that\
    \ set up first by simply creating a div that will appear below the map. In your\
    \ HTML code, add the following:\n\n```\n<div id='photo_info_wrapper'></div>\n\
    ```\n\nLet's now create a function that will be called when we select a feature.\
    \ It will need to update the photo_info_wrapper div with information about the\
    \ photo(s) contained in the selected cluster. We'll need to create a loop that\
    \ will look at each feature in the selected cluster, pull out its attributes,\
    \ and update the HTML of the div. This will all happen in a function that gets\
    \ called when a feature is selected, and we also need to create a function that\
    \ will clear the div when a feature is unselected. We'll need to grab properties\
    \ from the feature's attributes property, which are filled by the earlier extractAttributes\
    \ parameter when creating the vector layer. We'll also access the style property\
    \ of the features (which is populated by the extractStyles parameter we used earlier)\
    \ to get the externalGraphic location. Let's create the functions:\n\n```\nfunction\
    \ on_select_feature(event) {\n  //Store a reference to the element\n  var info_div\
    \ = document.getElementById('photo_info_wrapper');\n  info_div.innerHTML = '';\n\
    \n  //Store the clusters\n  var cluster = event.feature.cluster;\n\n  //Loop through\
    \ the cluster features\n  for(var i=0; i<cluster.length; i++){\n    //Update the\
    \ div with the info of the photos\n    info_div.innerHTML += \"<strong>\"\n  \
    \    + cluster[i].attributes.name\n      + \"</strong><br />\"\n      + \"<img\
    \ src=\"\" + cluster[i].style.externalGraphic + \"\" \n/>\"\n      + cluster[i].attributes.Snippet\n\
    \      + \"<br /><hr />\";\n```"
  merge: -1
