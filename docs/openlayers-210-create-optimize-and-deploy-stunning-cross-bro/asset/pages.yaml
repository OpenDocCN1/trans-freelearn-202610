    difficult to start using the vector layer—pretty easy, in fact. The rest of this
    chapter will more or less build on what we just saw, so there''s no need to be
    intimidated.


    # Pop Quiz – why use a Vector Layer?


    Vector layers tend to be very fast, as the data can be stored entirely on the
    client. Interaction happens instantly, which can greatly enhance the user''s experience.
    Come up with a couple of cases where you would use a vector layer.


    Now, before we jump into more advanced uses of the vector layer, let''s see how
    it actually works first.


    # How the Vector Layer works


    There are primarily four things we need to cover to understand how the vector
    layer works.


    +   - How the Vector Layer is rendered

    +   - The Vector Layer class itself

    +   - The Geometry and Feature classes

    +   - How to use the related Strategy, Protocol, and Format classes


    Let''s go over rendering—fortunately, there''s not much to it.'
