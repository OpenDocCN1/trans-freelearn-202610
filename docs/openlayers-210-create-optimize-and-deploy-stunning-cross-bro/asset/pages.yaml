    \ `custom_button_func` function will be called. Notice how we just passed in the\
    \ name of the function (also known as the function's return code) and we don't\
    \ use parenthesis like we normally do when we call a function.\n\n```\n```js\n\
    var my_button = new OpenLayers.Control.Button({\n    displayClass: 'olControlCustomButton',\n\
