- pgno: 185
  md: "2. First, we're going to create the function that will randomly change the\
    \ map's base layer's opacity when the map is clicked. This will only happen when\
    \ our toggle control is active. Right before the `map.addControl(control_panel);`\
    \ line, insert the following:\n\n```\n```javascript\n//Function that the map will\
    \ call when the map is clicked (only when\n// the toggle button is active though)\n\
    var map_event_function = function(){\n    map.layers[0].setOpacity(Math.random());\n\
    }\n```\n```\n\n3. Before we create a `TYPE_TOGGLE` button, we need to create two\
    \ functions: one that will get called when it is activated and one called when\
    \ it is deactivated. This is similar to what we did in the previous example. Let's\
    \ do that, right after the previous code:\n\n```\n```javascript\n//Create a function\
    \ for the toggle button\nvar toggle_button_activate_func = function(){\n    //Attach\
    \ the map_event_function to the map\n    map.events.register('click', map, map_event_function);\n\
    }\n\nvar toggle_button_deactivate_func = function(){\n    //Remove the map_event_function\
    \ from the map\n    map.events.unregister('click', map, map_event_function);\n\
    \n    //Restore the layer's opacity\n    map.layers[0].setOpacity(1);\n}\n```\n\
    ```\n\n4. Now, we need to create the toggle control itself. The format is similar\
    \ to before, but we'll be using a couple different properties. Because this is\
    \ a toggle control, we won't use a trigger function. Instead, we'll add two event\
    \ listeners—one for the activate event, and another for the deactivate event.\
    \ We'll also set the type to `OpenLayers.Control.TYPE_TOGGLE` (the `TYPE_TOGGLE`\
    \ type—we could also set the type to 2 to accomplish the same thing, but it's\
    \ much more readable to use the built in constant name). Add the following on\
    \ the next line:\n\n```\n```javascript\n//Create the toggle button object\nvar\
    \ custom_toggle_button = new OpenLayers.Control.Button({\n    displayClass: 'olControlCustomButtonToggle',\n\
    \    eventListeners: {\n        'activate': toggle_button_activate_func,\n   \
    \     'deactivate': toggle_button_deactivate_func\n    },\n```\n```"
