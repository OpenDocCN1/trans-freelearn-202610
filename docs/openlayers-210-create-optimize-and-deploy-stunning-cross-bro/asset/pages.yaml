- pgno: 255
  md: '# OpenLayers.Layer.Vector methods


    Now that we''ve gone over the Vector Layer class properties, let''s discuss the
    methods we can call. We''ll just cover functions specific to the Vector layer;
    functions that are inherited from the base OpenLayers.Layer parent class can be
    found in Chapter 3.


    +   - `clone()`: Makes a copy of the layer and the features it contains. Returns
    an `{OpenLayers.Layer.Vector}` object, which is a copy of the layer.

    +   - `getDataExtent()`: This function will return an `{OpenLayers.Bounds}` object
    consisting of the max extent that includes all the features of the layer.

    +   - `refresh(obj)`: Causes the layer to request features and redraw them. If
    the layer is visible and in range of the map extent, the refresh event will be
    triggered. Takes in an optional `obj` object containing properties for event listeners.

    +   - `assignRenderer()`: Assigns a renderer to the layer based on the layer''s
    `renderers` property.

    +   - `displayError()`: Shows an alert informing the user that their browser does
    not support the layer''s renderers.


    # Working with features


    The remaining methods that we''ll discuss involve features. A feature, as we saw
    earlier, is an object that belongs to the vector layer. We''ll cover methods first,
    and then walk through the related examples to show how to properly use them.


    **addFeatures(features, options)**: Calling this function will add features to
    the map. You must pass in at least an array of `features` objects, and you can
    optionally pass in an `options` object. The `features` parameter is an `{Array{OpenLayer.Feature.Vector}}`,
    and `options` is an anonymous `{Object}`.


    # Time for Action – adding features


    Let''s add some features to a map manually.


    +   1. Make a copy of the first example—we''ll just need a basic WMS base layer
    and a vector layer.

    +   2. Open up the map in Firefox and enable Firebug. We''ll use the JavaScript
    console to add features to the vector layer.'
  merge: -1
  img_proc: true
- pgno: 256
  md: '3. Let''s create some features first. To do so, we''ll need to make use of
    the OpenLayers.Geometry classes. Let''s start off by creating a OpenLayers.Geometry.Point
    object, passing in a longitude and latitude (type and execute the following in
    Firebug):


    ```

    var point = new OpenLayers.Geometry.Point(-72, 42);

    ```


    4. Now that we have a geometry object, we can create a feature object from it.
    We''ll use the OpenLayers.Feature.Vector class to create a feature object using
    the point object we just created. When instantiating, the constructor can take
    in three arguments—geometry, attributes (optional), and style (optional). We''ll
    cover the Feature class in detail later in the chapter. Create the feature point,
    by passing in the geometry object we created above:


    ```

    var feature_point = new OpenLayers.Feature.Vector(point);

    ```


    5. Alright, now we''re ready to add the feature to the map with addFeatures. Even
    though we are passing in a single feature, we still must pass in an array. Add
    it like this:


    ```

    map.layers[1].addFeatures([feature_point]);

    ```


    6. You should see the point added to the map:


    ![](img/1b8cd151c9f278555f9cf255b20d244e_256_0.png)


