    # Modifying layer properties


    Now that you''re familiar with a few more layer properties, try to modify the
    second example''s code, passing in additional properties to the **options** object.
    Open up the previous example and use Firebug to access individual layer properties,
    for example, `map.layers[1].propertyName`. Play around by passing in different
    properties to the **options** object when creating the layer objects, and don''t
    be afraid to break your code!


    # The OpenLayers.Layer class


    So far, we''ve only been using the `OpenLayers.Layer.WMS` class in the examples.
    This has been the beginning of all our layer object instantiation code so far:


    ```

    var wms = new OpenLayers.Layer.WMS(

    ```


    Notice the period between Layer and WMS: `Layer.WMS`. This means that we''re accessing
    the `WMS` subclass of the `Layer` superclass. What do I mean when I say this?
    Well, the `WMS` class is a subclass of the `Layer` class, so let''s briefly refresh
    our knowledge about subclasses.


    # Subclasses


    In Chapter 1, we mentioned **Subclasses**. Subclasses are, basically, classes
    that derive from some base class. This base class is called a **Superclass**.
    The Layer class is thus the **Superclass** of all Layer **subclasses** (Superclasses
    and Subclasses are still classes). Subclasses inherit all the properties of their
    superclass.'
  merge: -1
  img_proc: true
- pgno: 90
  md: '# Layer Class—Sub and super classes


    The `Layer` class is therefore the superclass from which all other Layer classes
    derive. The `Layer.WMS` layer class is different from the `Layer.Image` class,
    and each of those two classes has their own unique properties and functions. But
    both layers also share all the properties of their `Layer` superclass—so all those
    properties we discussed earlier apply to both classes.


    Some Layer classes also inherit from multiple Layer class in a hierarchical way.
    For example, the `Layer.WMS` class inherits from the `Layer.Grid` class, which
    inherits from the `Layer` class.


    # Other layer types


    OpenLayers supports a multitude of different Layer classes. As you may recall
    from Chapter 1, each Layer class is associated with a different map server back
    end. The `Layer.WMS` class is used to connect to a WMS map server, and the `Layer.Google`
    class is used to connect to the Google Maps service.


    Because OpenLayers is such an actively developed framework, there are a few layer
    classes that are deprecated (not recommended to use anymore). Later versions of
    OpenLayers will deprecate more Layer classes, so we''ll try to focus on the classes
    that should be around for a while. We won''t be able to cover every Layer class,
    but we will discuss the common ones. The Layer classes which we don''t mention
    below will not be covered in this book, either because they are deprecated or
    outside the scope of this book. Let''s take a look.


    # Layer.ArcGIS93Rest


    This is the class that allows us to interact with ArcGIS Server 9.3 via its REST
    interface. Interaction with the REST interface is handled by constructing requests
    with URLs, and is similar in concept to how GET requests work.


    The structure to instantiate objects from this class is similar to `Layer.WMS`,
    as both inherit from the `Layer.Grid` class. ArcGIS Server is a third party, proprietary
    piece of software from ESRI, but OpenLayers provides excellent support for it.
    The OpenLayers documentation for the ArcGIS layer can be found at http://dev.openlayers.org/docs/files/OpenLayers/Layer/ArcGIS93Rest-js.html.


    > The documentation for ArcGIS Server''s REST API can be found at http://resources.esri.com/help/9.3/arcgisserver/apis/rest/index.html.'
  merge: -1
  img_proc: true
- pgno: 91
  md: "# Layer.ArcIMS\n\nThis layer class is similar to the ArcGIS93Rest class, and\
    \ allows us to display data from ArcIMS Mapping Services. ArcIMS is another proprietary\
    \ software product from ESRI. The documentation for this Layer class is at http://dev.openlayers.org/docs/files/OpenLayers/Layer/ArcIMS-js.html.\
    \ More information about ArcIMS can be found at http://www.esri.com/software/arcgis/arcims/index.html.\n\
    \n# Layer.Google\n\nThis layer allows us to interact with Google Maps via the\
    \ Google Maps API. The documentation for this layer class is located at http://dev.openlayers.org/docs/files/OpenLayers/Layer/Google-js.html.\n\
    \n# Time for Action – creating a Google Maps layer\n\nLet's take a look at how\
    \ to create a Google Maps layer.\n\n+   1. From this point onward, I'm going to\
    \ assume that when I say \"create a new map\" you will use the template from http://vasir.net/openlayers_book/,\
    \ or create a copy of the example from Chapter 1 and remove the WMS layer calls\
    \ (they both result in the same code). So, create a new map.\n+   \n+   2. The\
    \ first thing we'll need to do is add in a script tag to the <head> section that\
    \ references the Google API library. This allows us to actually use the Google\
    \ Maps library:\n+   ```html\n+   <script src=\"http://maps.google.com/maps/api/js?sensor=false\"\
    ></script>\n+   ```\n+   \n+   3. Now, we'll need to create a Google Maps layer\
    \ object. We won't pass in any additional settings, so the default settings will\
    \ be used. By default, we'll see the Google 'Streets' Map (we could ask for the\
    \ aerial imagery layer, the physical topology layer, etc—we'll cover this soon).\
    \ Add the following in your init function:\n+   ```javascript\n+   var google_map_layer\
    \ = new OpenLayers.Layer.Google(\n+     'Google Map Layer',\n+     {}\n+   );\n\
    +   ```\n+   \n+   4. All we have to do now is add the layer to the map. Before\
    \ you do this, make sure you've removed the existing line of code that adds the\
    \ WMS layer to the map. We only want to have our map contain the google_map_layer.\n\
    +   ```javascript\n+   map.addLayer(google_map_layer);\n+   ```"
  merge: -1
  img_proc: true
- pgno: 92
  md: 'You should see something like this:


    ![](img/1b8cd151c9f278555f9cf255b20d244e_92_0.png)


    # What Just Happened?


    We just created a map with a single Google Maps layer object using the Google
    Maps API (version 3). The layer that Google is showing us is the default layer
    named ROADMAP (referred to also as the ''streets'' map). We can change the type
    of layer we see by changing the type value in the layer''s options object. The
