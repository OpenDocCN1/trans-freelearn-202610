    # Time for Action – interacting with a map\n\nWe'll use the map we created in\
    \ Chapter 1 to do this example, interacting with our OpenLayers map by calling\
    \ various functions of the map.\n\n+   1. Open up the map from Chapter 1 in Firefox.\
    \ Enable Firebug and the Console panel. If you would like, you can take a look\
