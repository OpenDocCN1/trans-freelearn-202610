- pgno: 245
  md: '# 9

    Using Vector Layers


    *At this point, we''ve gone over the foundation of OpenLayers. We''ve covered
    the core classes—Map, Controls, and Layers. The rest of this book will focus more
    on refining that core knowledge, expanding on concepts already introduced and
    delving a bit into more of the ''advanced'' things we can do with the API.*


    *We''ll start diving into some of these advance topics starting with this chapter,
    covering the Vector Layer class. With it, our maps can be made even more interactive,
    responsive, and sleeker by showing and allowing interaction with vector data.*


    *We''ll go over how to create a vector layer, create and interact with objects
    in it, load data from external files (like KML), and more. Throughout this chapter,
    we''ll go over many different types of examples and build upon them to demonstrate
    how the Vector Layer works.*


    In this chapter will cover the Vector Layer class, along with a couple of other
    related classes. We''ll:


    +   - Discuss what the Vector Layer class is and see how it works

    +   - Cover properties, methods, and events of Vector Layer class

    +   - Go over the Feature and Geometry classes

    +   - Discuss how to create more advanced Vector layers

    +   - Demonstrate how to use the Strategy class

    +   - Learn about the Protocol class

    +   - Cover the Format class'
  merge: -1
  img_proc: true
- pgno: 246
  md: '# What is the Vector Layer?


    OpenLayers'' Vector Class is generally used to display data on top of a map and
    allow real time interaction with the data. What does this mean? Basically, it
    means we can load in data from geospatial files, such as KML or GeoJSON files,
    and display the contents on a map, styling the data however we see fit. For example,
    take a look at this map:


    ![](img/1b8cd151c9f278555f9cf255b20d244e_246_0.png)


    This shows a map with a Google layer as underlying base layer and a vector layer
    on top of it. The data (all the circles with numbers in them) are loaded in from
    a GeoJSON file, an open file format that many other applications support. In the
    vector layer, there are a bunch of data points throughout the map. Each dot on
    the map is an object in the vector layer, and these objects are referred to as
    Features.


    In this case, each feature is actually a cluster of data points—the numbers in
    each circle represent how many points belong to that cluster. This clustering
    behavior is something we can use out of the box with OpenLayers via the Strategy
    class, which we''ll be covering later in the chapter. Before we get to that point,
    let''s talk about one of the main things that separate a vector layer from other
    layers.'
  merge: -1
  img_proc: true
- pgno: 247
  md: '# What makes the Vector Layer special?


    With a raster image, what you see is what you get. If you were to look at some
    close up satellite imagery on your map and see a bunch of buildings clustered
    together, you wouldn''t necessarily know any additional information about those
    buildings. You might not even know they are buildings. Since raster layers are
    made up of images, it is up to the user to interpret what they see. This isn''t
    necessarily a bad thing, but vector layers provide much more.


    With a vector layer, you can show the actual geometry of the building and attach
    additional information to it—such as the value of it, who owns it, its square
    footage, etc. As we''ll see later in this chapter, it''s easy to put a vector
    layer on top of your existing raster layers and create features in a specific
    location. We''ll also see how we can get additional information about features
    just by clicking or hovering our mouse over them.


    # The Vector Layer is client side


    Another fundamental difference is that the vector layer is, generally, used as
    a client side layer. This means that, usually, interaction with the actual vector
    data happens only on the client side. When you navigate around the map, for instance,
    the vector layer does not send a request to a server to get more information about
    the layer. Once you get the initial data, it''s in your browser and you do not
    have to request the same data again (in most cases, although WFS is an exception;
    we''ll cover this later in the chapter).


    Since, in most cases, the vector data is loaded on the client side, interaction
    with the vector layer usually happens nearly instantaneously. However, there are
    some limitations. The vector layer is dependent on the user''s browser and computer.
    While most browsers other than Internet Explorer have been progressing exceptionally
    well and are becoming more powerful each day, limitations do exist.


    Due to browser limitations, too many features in a vector layer will start to
    slow things down. There is no hard number on the amount of features, but generally
    anything over a couple hundred of features will start to slow things down on most
    computers. However, there are many ways around this, such as deleting features
    when you don''t need them, and we''ll talk about performance issues in more depth
    later.


    # Other uses


    With the vector layer, we can display any type of geometrical object we''d like—points,
    lines, polygons, squares, makers...any shape you can imagine. We can use the vector
    layer to draw lines or polygons and then calculate the distance between them.
    We can draw shapes and then export the data using a variety of formats, then import
    that data in other programs, such as Google Earth. These are just a few basic
    cases though, and throughout this chapter you''ll see how powerful the vector
    layer can be.'
  merge: -1
  img_proc: true
- pgno: 248
  md: '# What is a ''Vector''?


    In terms of graphics, there are essentially two types of images: raster and vector.
    Most images you see are raster images—meaning, basically, they are comprised of
    a grid of pixels and their quality degrades as you zoom in on them. A photograph,
    for example, would be a raster image. If you enlarge it, it tends to get blurry
    or stretched out. The majority of image files— .jpegs, .png, .gifs, any bitmap
    image—are raster images.


    A vector, on the other hand, uses geometrical shapes based on math equations to
    form an image. Meaning that when you zoom in, the quality is preserved. If you
    were to zoom in on a vector image of a circle, the lines would always appear curved—with
    raster image, the lines would appear straight, as raster images are made up of
    a grid of colors. Vector graphics are not constrained to a grid, so they preserve
    shape at all scales.


    # Time for Action – creating a Vector Layer


    Let''s begin by creating a basic vector layer. In this example, after you add
    some points and other feature types to your vector layer, try to zoom in. You''ll
    notice that the points you added don''t lose quality as you zoom in. We''ll go
    over how it works afterwards.


    +   1. We''ll start off by using a basic WMS layer:

    +   ```

    +   var wms_layer = new OpenLayers.Layer.WMS(

    +       ''OpenLayers WMS'',

    +       ''http://vmap0.tiles.osgeo.org/wms/vmap0'',

    +       {layers: ''basic''},

    +       {}

    +   );

    +   ```

    +   2. Now, let''s create the vector layer itself. We''ll use the default projection
    and default values for the vector layer, so to create the layer all we need to
    do is create it:

    +   ```

    +   var vector_layer = new OpenLayers.Layer.Vector(''Basic Vector Layer'')

    +   ```

    +   3. Add the layers to the map now:

    +   ```

    +   map.addLayers([wms_layer, vector_layer]);

    +   ```

    +   4. If we looked at the map now, we would just see a simple map—our vector
    layer does not have any data loaded into it, nor do we have any controls to let
    us add vector data.'
  merge: -1
  img_proc: true
