- pgno: 48
  md: '# Summary


    In this chapter we were introduced to OpenLayers and learned a bit about it.


    We saw what Web Map Applications are and how they work. After that, we created
    our first map with OpenLayers, then analyzed how the code works. Then we covered
    a fundamental concept, Object Oriented Programming, which we''ll need to know
    about while really working with OpenLayers. Lastly, resources for help and information
    outside this book were provided.


    Now that we have a basic handle on OpenLayers, we''ll jump straight into debugging
    OpenLayers. By doing so, we''ll cover more thoroughly many of the concepts that
    we''ve discussed, such as how OpenLayers requests and receives map images, and
    how it puts them together.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# 2


    # Squashing Bugs With Firebug


    OpenLayers is, at a fundamental level, not doing anything that is conceptually
    too hard to grasp. It gets map images from a server, and puts them together. From
    a technical level, however, there is a lot of work going on, and it might seem
    magical how it all works together so well.


    Fortunately, there are many tools to dispel any potential magical thinking we
    might have and show us how OpenLayers is working behind the scenes. Firebug, a
    free and open source plugin for Firefox, is one such great tool. Speeding up development
    time, viewing network communication, and squashing bugs are just a few things
    that Firebug, and other web development tools, do that make them hard to live
    without.


    To really use OpenLayers effectively and to its full potential, we need to understand
    how it works. In this chapter, we''ll try our best to do just that, by using web
    development tools to examine OpenLayers'' inner workings. By doing so, we''ll
    accomplish two things. First, we''ll become familiar with these tools which will
    significantly help us when developing our maps. Secondly, and more importantly
    for now, we''ll gain a better understanding of how OpenLayers works.


    Throughout this chapter we''ll cover:


    +   - What Firebug and other development tools are

    +   - Setting up Firebug

    +   - Each of the Firebug Panels

    +   - Using the JavaScript Command Line Console panel'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# What is Firebug?


    **Firebug** is a free, open source addon for Firefox. If you do not have Firefox,
    I recommend downloading it (it is also free and open source). However, other modern
    and standards based browsers, such as Google''s Chrome, Apple''s Safari, and Opera,
    also work well and have great built in developer tools.


    Firebug, and other web development tools, makes the web development process much
    easier and quicker. What do I mean by this? With these tools, we can change anything
    on our site, on the fly, without editing or saving any files. We can type in JavaScript
    code with a command line interface and execute it immediately. We can view all
    the requests that our web page sends to servers, along with the server''s reply.
    For example, if our map isn''t able to get back map images from the server, we
    could examine the requests our page is making and find out if we have any typos
    or haven''t set up our map layer properly.


    Using these tools makes it a lot easier to develop not only an OpenLayers mapping
    application, but any web application, and makes it easier to fix any bugs we encounter
    in the process. We''ll focus on Firebug in this chapter and refer back to it throughout
    the book, but other tools such as Google''s Chrome and Apple''s Safari''s built
    in developer tools work just as well (although some functionality may vary).


    # Setting up Firebug


    Since Firebug is an extension of Firefox, you''ll need to first install Firefox.
    You can download it for free at http://getfirefox.com. After that, Firebug can
    be freely downloaded at http://getfirebug.com. When you click on the link to download
    Firebug, Firefox will prompt you with a message asking if you wish to install
    the plugin. After installing, all you have to do is restart Firefox and you''ll
    be good to go.


    # Time for Action – downloading Firebug


    If you do not already have an up to date version of Firefox installed, please
    do so now. After you have installed Firefox, set up Firebug by following these
    steps:


    +   1. Go to http://getfirebug.com.

    +   2. Click on the **Install Firebug for Firefox** button. Once you click this,
    you should see a message similar to this:'
  merge: -1
  img_proc: true
- pgno: 51
  md: '![](img/1b8cd151c9f278555f9cf255b20d244e_51_0.png)


    +   3. Click **Install**, wait for it to finish installing, and then restart Firefox.

    +   4. Now that Firebug is installed, you should see a Firebug icon on the bottom
    right side of your screen.


    ![](img/1b8cd151c9f278555f9cf255b20d244e_51_1.png)


    # What Just Happened?


    When Firebug is not enabled, the Firebug Icon is gray. When it is in enabled,
    it has an orange color—this is just a quick way for you to tell if Firebug is
    enabled or not for the current page you''re on.'
