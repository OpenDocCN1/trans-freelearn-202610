- pgno: 206
  md: '9. Open up the page now and you should see the styled layer switcher div:


    ![](img/1b8cd151c9f278555f9cf255b20d244e_206_0.png)


    # What Just Happened?


    We just added a LayerSwitcher control outside the map and styled it. We saw how
    to style the div element that we created, along with styling the elements by grabbing
    the class names that OpenLayers generates. The LayerSwitcher control along with
    some others such as OverviewMap, have more elements to style than other controls.
    It may not be immediately obvious what elements need to be styled, but we can
    always use Firebug to inspect the HTML and determine the class names.


    # Have a Go Hero – add layers


    Add more layers to the map you just created. Notice how there is now another set
    of elements for the overlay layers, in an element with a class that starts with
    ''dataLayers''. All your overlay layers are considered to be ''data layers'' and
    will show up here, while base layers show up in the baseLayersDiv. Using what
    you learned in the previous example, apply your own styles to the overlay layers
    div elements.


    # Other resources


    A comprehensive coverage of CSS is outside the scope of this book, but hopefully
    this chapter has provided necessary information for styling OpenLayers elements.
    More extensive information on CSS can be found at the W3Schools site, located
    at http://www.w3schools.com/css/default.asp.'
