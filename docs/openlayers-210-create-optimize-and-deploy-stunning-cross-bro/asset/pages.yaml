- pgno: 226
  md: '# projection


    ```

    projection: {String} Default: ''EPSG:4326''

    ```


    We''ve covered this in depth in Chapter 4, our chapter on projections, so we don''t
    need to spend much time going over it here. Essentially, if you are using a projection
    other than EPSG:4326, then you can set the EPSG code here to specify your map''s
    projection. All your layers should be in the same projection as your map''s projection.
    If you do set the projection here, you will also usually have to specify related
    properties such as the maxExtent, maxResolution, and units (if the projection
    is not in degrees).


    # theme


    ```

    theme: {String or null} Default: ''theme/default/style.css''

    ```


    This property specifies the relative path (meaning, relative to the path your
    map page is in) to the map''s theme style file—a CSS file. If you are using your
    own theme file, you should specify the path to the CSS file here, along with setting
    the OpenLayers.ImgPath (the path of any custom map images).


    This property can also be set to null, in which case you can simply include CSS
    file link tags in your page (or put style information in <style> tags). See Chapter
    7 for more information on using CSS to style your map.


    # tileSize


    ```

    tileSize: {OpenLayers.Size} Default: (256, 256)

    ```


    Specifying this will override the default tile size, which is 256 x 256 pixels.
    This default size (256, 256) is the size of tiles from third party APIs such as
    Google. If you are not using third party APIs, there may be a good reason to change
    this value. The larger the tile size, the fewer requests have to be made to the
    server—but the longer each tile takes to send over. Some tile cache servers may
    cache tiles at 512 x 512 pixels; in this case you would need to set your map size
    to match it. In most cases, however, you will not need to change this, but feel
    free to try changing the values to find a ''sweet'' spot for your application.
    An example would be:


    ```

    tileSize: new OpenLayers.Size(512,512);

    ```


    # unit


    ```

    unit: {String} Default: ''degrees''

    ```


    This specifies the map''s units. Unless you are using a non default projection,
    you probably won''t need to change this. Possible values are ''degrees'' or (''dd''),
    ''m'', ''ft'', ''km'', ''mi'', ''inches''.'
  merge: -1
  img_proc: true
- pgno: 227
  md: '# Map functions


    We''ve used a few methods of the Map class already, such as `addLayers` and `zoomToMaxExtent`.
    In fact, we''ve used the more common methods at least a couple of times throughout
    the previous chapters. We haven''t covered them in good detail yet, and there
    are a few functions we haven''t encountered but are still quite handy, especially
    when developing maps with any sort of custom functionality.


    This section is divided into groups of related functionality. Each group will
    have its own header and then lists functions alphabetically, so you can quickly
    find the function you''re looking for.


    # Control related


    +   - `addControl( control )`: Parameters—control `{OpenLayers.Control}`. This
    function takes in a single control object and adds it to the map.

    +   - `addControls( controls )`: Parameters—controls `{Array {OpenLayers.Control}}`.
    This function takes in an array of control objects and adds them to the map.

    +   - `getControl( match )`: Parameters—match `{String}`. Accepts one argument,
    the ID of a control. It will return a control object, if found, that matches the
    ID passed in. **Returns:** `{OpenLayers.Control}` or null. If no match is found,
    returns null.

    +   - `getControlsBy( property, match )`: Parameters—property `{String}`, match
    `{String or Object}`. This is an extremely useful function that is sometimes overlooked.
    If you need to get control objects that match some criteria, this is the function
    to use. It accepts two arguments, a **property** (such as `''active''`), and a
    **match** (such as `true`). The **match** argument can be either a string, regular
    expression, or Boolean. The property is the string name of any property of a control—so,
    if you want to get all the controls that are active, you would call `map.getControlsBy(''active'',
    true);`. **Returns:** `{{Array of OpenLayers.Control objects}}` or null. If no
    match is found, returns null; otherwise, returns an array of matched control objects.

    +   - `getControlsByClass( match )`: Parameters—match `{String or Object}`. Similar
    to `getControlsBy`, but instead will perform a match for class name. Calling this
    function and passing in a string containing the class name (or a regular expression)
    will return either null or an array of control objects. **Returns:** `{Array of
    OpenLayers.Control objects}` or null.'
  merge: -1
  img_proc: true
- pgno: 228
  md: '◆ `removeControl( control )`: **Parameters**—`control` { `OpenLayers.Control`
    }. This function takes in a single parameter, an OpenLayers Control object, and
    removes it from the map. Removing a control will affect the `map.controls` array,
    so be aware of this if you are using indexes to reference control objects in other
    places of your code. This is another reason why creating a variable to reference
    control objects is preferred, as you don''t have to worry about the order of the
    `map.controls` array.


    # Time for Action – using control methods


    Let''s go through a quick example using some of the functions we just covered.


    +   1. Open up an existing map (any map is fine).

    +   2. In Firebug, input and run the following:

    +      ```js

    +      var returned_controls = map.getControlsBy(''active'', true);

    +      ```

    +   3. Now, if that array is not empty, call the following. If the array is empty,
    it means that there are no active controls. Try to add some controls to your map
    until this function returns a non empty array:

    +      ```js

    +      map.removeControl(returned_controls[0])

    +      ```


    # What Just Happened?


    We just got an array of controls that were active and then removed the first item
    in the returned array from the map. If the `returned_controls` array is empty,
    calling `removeControl` will not do anything (you can''t remove a `null` control).
    Let''s now look at a larger group of functions.


    # Extent/Coordinate/Bounds related


    The following functions are all related, in some capacity, to moving or getting
    position information about the map.


    Some of the functions will make use of the **OpenLayers.LonLat** class. This class
    is used to create a coordinate object, which contains a longitude and latitude
    value (or x and y values, depending on your projection). To instantiate a **LonLat**
    object, simply call the class and pass in longitude (x) and latitude (y) values
    (which are `{Float}` data types):


    ```

    var my_lonlat_object = new OpenLayers.LonLat(-42.18, 42.20);

    ```'
  merge: -1
  img_proc: true
- pgno: 229
  md: '# Methods


    The methods are as follows:


    +   - getCenter() : Returns {OpenLayers.LonLat}. Calling this function will return
    a LonLat object containing the center point of the map.

    +   - getExtent() : Returns {OpenLayers.Bounds}. Returns the current extent of
    the map.

    +   - getMaxExtent() : Returns {OpenLayers.Bounds}. Returns a Bounds object consisting
    of the map''s max extent; essentially, it returns the value of the map.maxExtent
    property.

    +   - getMaxResolution() : Returns {Float}. Returns the maximum resolution of
    the map.

    +   - getNumZoomLevels() : Returns {Integer}. The number of zoom levels the map
    contains is returned.

    +   - getResolution() : Returns {Float}. Returns the map''s current resolution.

    +   - getResolutionForZoom( zoom ) : Parameters are zoom { Integer }. This function
    allows you to pass in a zoom level, zoom (an {Integer}), and receive the resolution
    for that zoom level. Returns: {Float}. Returns the resolution for a passed in
    zoom level.

    +   - getScale() : Returns {Float}. Returns the map''s current scale value.

    +   - getZoom() : Returns {Integer}. Returns the current zoom level value, which
    is also the value of the map.zoom property.

    +   - getZoomForExtent(bounds, closest) : Parameters are bounds {OpenLayers.Bounds},
    closest {Boolean} (Optional). Takes in an OpenLayers.Bounds object and an optional
    closest argument (default value is false) and returns a level for the passed in
    bounds. If closest is set to true, a suitable zoom level is returned that may
    not fully contain the entire extent. Returns: {Integer}. This returns a zoom level
    appropriate for the passed in bounds.

    +   - getZoomForResolution(resolution, closest): Parameters: bounds {OpenLayers.Bounds},
    closest {Boolean} (Optional). Similar to getZoomForExtent; takes in a resolution
    and optional closest argument and returns a zoom level. Returns: {Integer}. Returns
    a zoom level appropriate for the passed in resolution.

    +   - isValidLonLat( lonlat ) : Parameters are lonlat {OpenLayers.LonLat}. Takes
    in a single lonlat object and returns a Boolean specifying if the passed in coordinate
    is within the extent of the map. Returns: {Boolean}. Whether or not the passed
    in point is within the map''s maxExtent.'
  merge: -1
  img_proc: true
- pgno: 230
  md: '+   - **isValidZoomLevel( zoomLevel )**: Parameters are zoomLevel {Integer}.
    This function accepts a single zoomLevel parameter and returns true or false if
    the passed in zoom level is within the range of map zoom levels. Returns: {Boolean}.
    Whether the passed in zoom level is within range of map zoom levels.

    +   - **moveTo( lonlat, zoom, options )**: Parameters are lonlat {OpenLayers.LonLat},
    zoom {Integer}, options {Object} (Optional). Takes in an OpenLayers.LonLat object,
    zoom level, and optional options object. This function will move the map to the
    specified coordinate and zoom level, but will not show any panning animations.

    +   - **pan( dx, dy, options )**: Parameters are dx {Integer}, dy {Integer}, options
    {Object} (Optional). This function takes in two integer parameters and an optional
    options object. The dx parameter specifies the distance to pan the map in the
    x (longitude) direction and it can be either positive or negative. The dy parameters
    specifies how much to pan the map in the y (latitude) direction. The options object
    can consist of two properties: animate {Boolean} specifies if the panning animation
    will be enabled. Default value is true. The second property is dragging {Boolean},
    which specifies whether or not to call setCenter with dragging, the default value
    is false.

    +   - **panTo( lonlat )**: Parameters—lonlat {OpenLayers.LonLat}. Pans the map
    to a passed in coordinate (an OpenLayers.LonLat object). This will perform any
    associated panning animations if the passed in coordinate is within the current
    extent.

    +   - **setCenter( lonlat, zoom, dragging )**: Parameter—lonlat {OpenLayers.LonLat},
    zoom {Integer} (Optional), dragging {Boolean} (Optional). This function will set
    the map''s center to the passed in coordinate and (optionally) zoom level. If
    dragging is set to true (it is true by default), movestart and moveend events
    will be triggered.

    +   - **zoomIn()**: Calling zoomIn() will cause the map to zoom in the next zoom
    level, if possible.

    +   - **zoomOut()**: Calling zoomOut() will cause the map to zoom out one zoom
    level, if possible.

    +   - **zoomTo( zoomLevel )**: Parameters—zoomLevel {Integer}. Takes in a zoom
    level and zooms the map to the specified zoom level.

    +   - **zoomToExtent( bounds, closest )**: Parameters—bounds {OpenLayers.Bounds},
    closest {Boolean} (Optional). Zooms to the passed in bounds and re-centers the
    map. By default, closest is set to false. If it is true, a zoom level that most
    closely fits the bounds will be found, but it may not fully contain the extent.'
  merge: -1
  img_proc: true
- pgno: 231
  md: '♦ zoomToMaxExtent( options ): Parameters—options {Object} (Optional). Zooms
    to the map''s maximum extent. An optional options object can be passed in that
    contains one property—restricted (True by default). If restricted is set to true,
    this function will zoom to the map''s restricted extent instead.


    # Time for Action – using coordinate related functions


    Let''s put some of these functions to use!


    +   1. Open up an existing map, any page will do.

    +   2. In Firebug, let''s call the pan function. We''ll move -30 degrees (30 degrees
    left) in the x (longitude) direction, and 30 degrees up in the y (latitude) direction.
    In the Firebug console, input and run the following:

    +      `map.pan(-30,30);`

    +   3. Now let''s see how the setCenter function works.

    +      `map.setCenter( new OpenLayers.LonLat(-42, 70), 2);`

    +   4. Zoom out now with the zoomOut() function:

    +      `map.zoomOut();`

    +   5. Let''s check to see if a coordinate outside the map''s max extent is valid.
    The following should return False:

    +      `map.isValidLonLat( new OpenLayers.LonLat(-190, 20) );`


    ```

    map.pan(-30,30);

    ```


    ```

    map.setCenter( new OpenLayers.LonLat(-42, 70), 2);

    ```


    ```

    map.zoomOut();

    ```


    ```

    map.isValidLonLat( new OpenLayers.LonLat(-190, 20) );

    ```


    # What Just Happened?


    As you can see, it''s easy to call any of those map functions we want. The prior
    group of functions was quite long, but it was the longest group—I promise! We''ll
    do a quick quiz, and then take a look at some more functions.


    # Pop Quiz – using coordinate related functions


    In most cases, it will be your map''s users who will navigate the map. However,
    programmatically controlling map navigation is often necessary or useful. Describe
    two possible ways to move or set the map''s center to the coordinates (-42, 52).'
  merge: -1
  img_proc: true
- pgno: 232
  md: '# Layer related functions


    The following group of functions involves layer actions—adding layers, removing
    layers, etc. You''ve seen most of these functions already:


    +   - `addLayer( layer )`: **Parameters**—layer `{OpenLayers.Layer}`. Takes in
    a layer object and adds it to the map. The layer object can be an already instantiated
    object, or you can instantiate a layer object on the fly in the call itself.

    +   - `addLayers( layers )`: **Parameters**—layers `{Array{OpenLayers.Layer}}`.
    This function takes in an array of layer objects and adds them to the map. Like
    in the `addLayer` function, you can pass in already instantiated layers or instantiate
    them on the fly. It is recommended that you instantiate layer objects so you can
    refer to them by name, but either way is acceptable.

    +   - `raiseLayer( layer, delta )`: **Parameters**—layer `{OpenLayers.Layer}`,
    delta `{Integer}`. This allows you to change the order layers appear on the map,
    allowing you to place layers above or below other layers. This function changes
    the order of the layer by the passed in delta value. If delta is positive, the
    layer is moved up in the map.layers array by delta. If it is negative, it is moved
    down by delta. We''ll be using this function later in the book to move layers
    up and down the layer list.

    +   - `removeLayer( layer, setNewBaseLayer )`: **Parameters**—layer `{OpenLayers.Layer}`,
    setNewBaseLayer `{Boolean}`(Optional). This function will remove a passed in layer
    from the map. It removes the associated HTML elements, removes the layer from
    the map''s layer list, set''s the layer''s map value to null, and triggers a `removelayer`
    event. The `setNewBaseLayer` property is optional and defaults to true, which
    will attempt to set a new base layer if need be.

    +   - `getNumLayers()`: **Returns:** `{Integer}`. Returns the number of layers
    on the map.


    # Other functions


    The following functions are also very useful and will be used throughout the book,
    but do not necessarily fall into the above function categories:


    +   - `destroy()`: Calling `destroy()` will do what you would imagine—it destroys
    the map object. After the map is destroyed, the map object is essentially made
    useless.

    +   - `getLonLatFromPixel( pixel )`: **Parameters**—pixel `{OpenLayers.Pixel}`.
    This function returns an `{OpenLayers.LonLat}` object based on the passed in pixel—whatever
    coordinates are passed in that pixel is returned. An example call would be `map.getLonLatFromPixel(new
    OpenLayers.Pixel(250,250))`. We''ll be using this function later in the book.

    +     **Returns:** `{OpenLayers.LonLat}`. Returns a LonLat object from the passed
    in pixel.'
  merge: -1
  img_proc: true
- pgno: 233
  md: "+   - `getPixelFromLonLat( lonlat )`: **Parameters**—`lonlat` `{OpenLayers.LonLat}`.\
    \ This function will return a pixel location based on a passed in `lonlat` coordinate.\
    \ The returned pixel coordinate is returned in view port coordinates (meaning,\
    \ the pixel location is relative to the map div element). This function is quite\
    \ useful if you want to, for instance, display another div on top of your map\
    \ at a specified coordinate. We will be using this function later in the book.\n\
    +   \n+     **Returns:** `{OpenLayers.Pixel}`. It returns an `OpenLayers.Pixel`\
    \ from the passed in coordinate.\n+   - `render( element )`: **Parameters**—`element`\
    \ `{HTML element or String (of ID of element)}`. This function takes in a single\
    \ parameter—an HTML element or the ID of an element you wish to render the map\
    \ to. We saw this function in action earlier in this chapter. If you do not pass\
    \ in an HTML element (or ID) to the map object when you create it, you can delay\
    \ rendering and later call this render method. This function will render the map\
    \ to the element that is passed in.\n+   - `updateSize()`: This function should\
    \ be called whenever the map div's size is updated. For example, if you have a\
    \ resize-able div that the map is placed in, then your code should call `map.updateSize()`\
    \ whenever that div is resized.\n\n# Doing stuff with events\n\nIn Chapter 6,\
    \ we introduced the notion of events and how OpenLayers uses events. At the core,\
    \ there are essentially two types of events used by OpenLayers: Browser events\
    \ and Map events. **Browser** events are things like clicking on the map div with\
    \ your mouse, while **Map** events are things such as zooming the map to some\
    \ coordinate. We worked a little bit with events in Chapter 6, so let's extend\
    \ that knowledge and add even more custom functionality to our map.\n\n![](img/1b8cd151c9f278555f9cf255b20d244e_233_0.png)\n\
    \n> We won't go over browser events much, but the ideas behind them are essentially\
    \ the same as map events. A great resource to find out more about browser events\
    \ can be found at https://developer.mozilla.org/en/DOM/event."
  merge: -1
  img_proc: true
- pgno: 234
  md: '# Map event types


    There are a number of supported map event types. Let''s take a look at them, and
    then we''ll cover how to use them in your map. You can also call `map.EVENT_TYPES`,
    which will return an array of valid map events. Some event types will return an
    **event object** to the event listener. If an event object is returned, it will
    be specified as *Event Object* in the event type descriptions below:


    +   - **addlayer**: This event is triggered *after* a layer is added. *Event object*:
    Includes a `layer` property that references the added layer.

    +   - **changebaselayer**: Triggered after the base layer changes.

    +   - **changelayer**: This event gets triggered after a layer''s properties are
    changed. Specifically, it gets triggered whenever its name, order, opacity, parameters,
    or visibility is changed. *Event object*: Includes a `layer` property which refers
    to the changed layer, and a `property` property which refers to the type of property
    that was changed (order, opacity, etc.).

    +   - **mousemove**: The event is triggered whenever the mouse is moved inside
    the map.

    +   - **mouseout**: This event is triggered on mouseout; whenever your mouse leaves
    the map div.

    +   - **mouseover**: This gets triggered whenever the map gets a mouseover event;
    whenever your mouse first enters the map div.

    +   - **movestart**: Whenever the start of a drag, pan, or zoom occurs, this event
    is triggered. This event refers to the movement of the map itself, not just the
    mouse.

    +   - **moveend**: Triggered after a drag, pan, or zoom is finished. This event
    refers to the movement of the map itself, not just the mouse.

    +   - **move**: This event is triggered on any drag, pan, or zoom of the map.

    +   - **preaddlayer**: This is triggered *before* a layer is added. *Event object*:
    Includes a `layer` property that references the layer to be added.

    +   - **removelayer**: When a layer has been removed from the map, this event
    is triggered. *Event object*: Includes a `layer` property that references the
    layer that was removed.

    +   - **zoomend**: This event is triggered after a map zoom completes.


    # Using map events


    There are primarily two common ways to use map events. Both ways accomplish the
    same thing—adding listeners to the map that will do something when a specific
    type of event is triggered. One way is to use the `eventListeners` property when
    creating your map object. The other way is to use `map.events.register(type, obj,
    lisenter)`. We''ll cover both.'
  merge: -1
  img_proc: true
- pgno: 235
  md: "# Using the eventListeners property\n\nThis is a good way to add the events\
    \ if you know what events you want to add to your map when you initially create\
    \ the map object. To use this property, pass in an anonymous object consisting\
    \ of eventType: listenerFunction (key: value) pairs. The eventType is one of the\
    \ event types we described in the previous section, and the listenerFunction is\
    \ the name of the function that will get called when that event type occurs.\n\
    \n# Time for Action – using eventListeners\n\nLet's demonstrate how to use event\
    \ listeners. We'll start off with a simple example that will send an alert anytime\
    \ the map finishes zooming.\n\n+   1. The first thing we'll need to do is to create\
    \ a function that will get called by the event listener when some event happens.\
    \ We'll have to do this for both the eventListeners method and the map.events.register\
    \ method which we'll talk about shortly. Let's create a simple function that will\
    \ send an alert when the user zooms in. Place this as the first line in your init()\
    \ function, before your OpenLayers map code:\n+   2. Next, we'll need to create\
    \ our map object and pass in an eventListeners object. We'll want to listen for\
    \ a zoomend event type, which is an event that happens when the map has finished\
    \ zooming. So, the key inside our eventListeners object will be the event type,\
    \ which is 'zoomend'. The value will be the name of the function we wish to get\
    \ called. Make sure that you do not include the parentheses, as we aren't actually\
    \ calling the function—we're just setting the value to be a reference to the function,\
    \ which will get called later when the event happens:\n+   3. Now, when you visit\
    \ the map and zoom in, an alert box will pop up with the text 'You finished zooming'.\n\
    \n```\nfunction alert_on_zoom(event){ alert('You finished zooming'); }\n```\n\n\
    ```\nmap = new OpenLayers.Map('map_element', {\n    eventListeners: {\n      \
    \  'zoomend': alert_on_zoom\n    }\n});\n```"
  merge: -1
  img_proc: true
- pgno: 236
  md: '# What Just Happened?


    We just use the `eventListeners` property of the map object to add an event listener
    for the `zoomend` event type. Be sure to set the value to the function''s name
    only, do not include the parentheses, as we do not want to call the function right
    now. When the `zoomEnd` event occurs, it will call the `alert_on_zoom` function
    and pass in the event object. We''ll talk about what the event object contains
    shortly.


    # Using map.events.register


    Using `map.events.register` will do essentially the same thing as setting the
    `eventListeners` property, but we can set it after the map object has been created.


    The function call looks like:


    ```

    map.events.register(type, object, listener);

    ```


    The `type` argument refers to the `eventType`, the `object` is a reference to
    the map object—you will almost always simply pass in your map object—and the `listener`
    refers to the function that will be called when the event is triggered. The following
    example will do exactly the same thing as the example in the prior event listeners
    section. Like before, we create a function that will get called when the `zoomend`
    event occurs. The difference here is that we are adding the event to the map object
    after it has been created.


    ```

    function alert_on_zoom(event){ alert(''Map zoomed''); }

    map.events.register(''zoomend'', map, alert_on_zoom);

    ```


    Now, let''s talk about the event object that is passed into the listener function.


    # Event object


    When working with events, it''s usually useful to know a bit about what occurred.
    The event object provides us with some information about the event. Depending
    on the event type, the event object will have different properties.


    All event objects will have at least one property referred to as `object`, which
    references the map object, and an `element` property which references the HTML
    element the map is in. Additionally, some event types include more properties.
    The previous *Map event types* section includes information on the event object
    properties that are populated for different event types.


    To access the event object properties, you just have to use `event.property`,
    where property is the name of the property you wish to access.'
  merge: -1
  img_proc: true
- pgno: 237
  md: "# Time for Action – working with Map events\n\n1. Before the map object is\
    \ instantiated, let's create a function that will get called when the map's zoomend\
    \ event is called. First, we'll create the function:\n\n```\nfunction zoomend_event(event)\
    \ {\n  alert('Done zooming');\n}\n```\n\n2. Let's add another function after that\
    \ which will update the first layer's opacity to a random value when the map is\
    \ finished being moved. First, create the function:\n\n```\nfunction update_opacity(event)\
    \ {\n  map.layers[0].setOpacity(Math.random());\n}\n```\n\n3. Now we're going\
    \ to create the map object. Use the following code to instantiate the map object,\
    \ passing in event listeners for zoomend and moveend:\n\n```\nmap = new OpenLayers.Map('map_element',\
    \ {\n  eventListeners: {\n    'zoomend': zoomend_event,\n    'moveend': update_opacity\n\
    \  }\n});\n```\n\n4. Be sure to add a WMS layer to the map, along with setting\
    \ the extent like we've done before. Now, open up the map and start navigating\
    \ around it. When you zoom in, you should receive an alert. When you finish panning,\
    \ the layer's opacity should change. Now, let's see how the events we just created\
    \ can actually trigger other events. With the moveend event listener we have,\
    \ the layer's opacity will change every time the user finishes panning. Changing\
    \ the layer's opacity causes the layer's changelayer event to trigger. So, let's\
    \ demonstrate how it works. Create a function that will send an alert containing\
    \ some information about the event object, namely the layer's name and the property\
    \ that was changed.\n\n```\nfunction show_layer_info(event) {\n  alert('Layer\
    \ changed: ' + event.layer.name + ' |\nProperty Changed: ' + event.property);\n\
    }\n```\n\n5. Now, we'll need to register the changelayer event. Just like before,\
    \ we'll use map.events.register:\n\n```\nmap.events.register('changelayer', map,\
    \ show_layer_info);\n```"
  merge: -1
  img_proc: true
- pgno: 238
  md: '6. Open up your map now and start triggering events. You''ll probably get annoyed
    of the alerts pretty quickly.


    ![](img/1b8cd151c9f278555f9cf255b20d244e_238_0.png)


    # What Just Happened?


    We just demonstrated how event listeners can be added to the map and trigger functions
    when map events happen. You probably also noticed that whenever you moved the
    map, the `changelayer` event got called. This is because the layer''s opacity
    was updated, which triggers the `changelayer` event. So, one important idea to
    take away is that events can (and often do) call other events. We''ll use events
    more throughout the book, so if you aren''t totally comfortable with them yet—don''t
    worry; they''ll be coming up again.


    # Multiple maps


    So far, we''ve only used one map in all our examples. And, for most applications,
    only one map is required. There are times though when having two maps is a good
    thing—like when you''re learning about how the Map class works (although, I''m
    sure you can be a bit more creative).


    # Using multiple map objects


    Making two map objects on your page isn''t too hard. We just need another element
    to place the second map element in, along with adding controls and layers to map—things
    we''ve been doing throughout the book.'
  merge: -1
  img_proc: true
- pgno: 239
  md: "We've talked about how control and layer objects belong to a single map object.\
    \ But what if you want to have multiple map objects that use the same layers?\
    \ A single layer object can only belong to one map object at a time, but fortunately\
    \ there is a simple way to use the 'same' layer object in multiple maps—by calling\
    \ the layer's (or control's) clone() method.\n\n# Time for Action – using multiple\
    \ map objects\n\nWe've used only one map object in all our examples up to this\
    \ point. Adding multiple map objects isn't very hard though—let's figure out how\
    \ it's done.\n\n+   1. We're going to first have to add another HTML element for\
    \ our second map, and we'll rename the first map element's ID for consistency.\
    \ Edit your HTML div elements:\n+   2. Now, in your JavaScript code, let's rename\
    \ the global map variable and add another one to hold our second map (right above\
    \ the init() function):\n+   3. Let's create our first map and its layers and\
    \ controls. Nothing new here, we're mainly just renaming the map object to map_1,\
    \ and adding a layer to it and setting the center:\n\n```\n```html\n<div id='map_1_element'\
    \ style='height: 500px; float:left; width:400px;'></div>\n<div id='map_2_element'\
    \ style='height: 500px; float:left; width:400px;'></div>\n<div style='clear:both;'></div>\n\
    ```\n```\n\n```\n```javascript\nvar map1, map2;\n```\n```\n\n```\n```javascript\n\
    map_1 = new OpenLayers.Map('map_1_element', {});\n\n//Create a base layer\nvar\
    \ wms_layer_all = new OpenLayers.Layer.WMS(\n    'OpenLayers WMS',\n    'http://vmap0.tiles.osgeo.org/wms/vmap0',\n\
    \    {layers: 'basic'},\n    {}\n);\n\nmap_1.addLayer(wms_layer_all);\n\nif (!map_1.getCenter())\
    \ {\n    map_1.zoomToMaxExtent();\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 240
  md: '4. Now, let''s create our second map object.


    ```

    map_2 = new OpenLayers.Map(''map_2_element'', {});

    ```


    5. We haven''t yet added any layers to it. In this case, we want to use the same
    layer that the first map has. However, since a layer object can belong only to
    one map at a time, we need to call the layer''s clone() method, which will basically
    create a duplicate layer object.


    ```

    var wms_layer_all_map_2 = wms_layer_all.clone();

    ```


    6. Add the layer, then we''ll zoom in with the second map and set it to a different
    location:


    ```

    map_2.addLayer(wms_layer_all_map_2);

    map_2.setCenter(new OpenLayers.LonLat(-42, 42), 3);

    ```


    7. Take a look at your page. You should see something like this:


    ![](img/1b8cd151c9f278555f9cf255b20d244e_240_0.png)


    # What Just Happened?


    We just created two maps on the same page. We used the layer''s clone() method
    to duplicate the layer object so that each map object would have the same layer,
    without having to manually recreate the layer object. If we were adding control
    objects to our maps, we would use the clone() method on our control objects if
    we wanted to duplicate them. While this is a pretty simple example, there are
    times when showing maps side by side would be more useful.'
  merge: -1
  img_proc: true
- pgno: 241
  md: "# Multiple maps and custom events\n\nLet's create a slightly more complicated\
    \ application using multiple maps and adding event listeners. One map will show\
    \ a zoomed out view of a country, and the map next to it will show a close up\
    \ view. Whenever one map is moved, the other map's center point will be immediately\
    \ updated. This type of mapping application can be quite useful for things such\
    \ as data entry processes, where two large maps might be more usable than one\
    \ large map with an overview map.\n\nLet's put together some of the concepts we've\
    \ learned in this chapter and create a similar type of application.\n\n# Time\
    \ for Action – creating a multiple map and custom event application\n\nIn this\
    \ example, we'll make an application that contains two maps, side by side, that\
    \ update one another when moved.\n\n+   1. Create a copy of the previous example.\
    \ We'll be working on it as the basis for this example.\n+   \n+   2. Let's recreate\
    \ the first map objects. For this example, we'll make the first map zoomed in\
    \ a bit and set a maxResolution so the map cannot be zoomed out more than a few\
    \ times. We'll also use two control—Navigation and PanZoomBar.\n+   \n+   3. Let's\
    \ also change the center point. We'll create a variable to store the starting\
    \ center coordinate (which will also be used by the second map) and change the\
    \ map.zoomToMaxExtent line. After the layer has been added to the map, use the\
    \ following code:\n\n```\nmap_1 = new OpenLayers.Map('map_1_element', {\n    controls:\
    \ [\n        new OpenLayers.Control.Navigation(),\n        new OpenLayers.Control.PanZoomBar()\n\
    \    ],\n    maxResolution:0.0054931640625,\n    minResolution:0.00034332275390625\n\
    });\n```\n\n```\nvar map_center = new OpenLayers.LonLat(-120, 34);\nif (!map_1.getCenter())\
    \ {\n    map_1.setCenter(map_center);\n}\n```"
  merge: -1
  img_proc: true
- pgno: 242
  md: "4. Now for the second map, we'll set it at a more zoomed out level and restrict\
    \ the resolutions as well. Change the second map's creation code to the following:\n\
    \n```\n```\nmap_2 = new OpenLayers.Map('map_2_element', {\n    controls: [\n \
    \       new OpenLayers.Control.Navigation(),\n        new OpenLayers.Control.PanZoomBar()\n\
    \    ],\n    maxResolution: 0.17578125,\n    minResolution: 0.0439453125\n});\n\
    ```\n```\n\n5. Next, let's set the map_2 object's center point to the same center\
    \ point as the first map:\n\n```\n```\nmap_2.setCenter(map_center);\n```\n```\n\
    \n6. Now, our two map objects are set up just the way we want them—half of our\
    \ work is done. If you open the map, you should see something like this:\n\n![](img/1b8cd151c9f278555f9cf255b20d244e_242_0.png)\n\
    \n7. Our next goal is to add events to the map that will cause the map objects\
    \ to update each other when the maps are moved. This is a little trickier than\
    \ it may first sound. Let's start off by creating a function for each map that\
    \ will get called when a moveend event is triggered.\n\nIt is important that when\
    \ calling setCenter, we pass in true as the third parameter so that the moveend\
    \ event is not triggered. If it is triggered, we will end up with an infinite\
    \ loop (not good).\n\n```\n```\nfunction update_map_1(event){\n    map_2.setCenter(map_1.getCenter(),\
    \ null, true);\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 243
  md: "```\nfunction update_map_2(event){\n    map_1.setCenter(map_2.getCenter(),\
    \ null, true);\n}\n```\n\n8. Finally, let's finish up by registering the events\
    \ for our two map objects.\n\n```\nmap_1.events.register('moveend', map_1, update_map_1);\n\
    map_2.events.register('moveend', map_2, update_map_2);\n```\n\n9. All done! Open\
    \ the page and pan around. When you finish panning around with one map, the other\
    \ map will be updated.\n\n# What Just Happened?\n\nYou just created a fairly complicated\
    \ mapping application with two map objects and a couple custom events. With all\
    \ you've learned from this chapter and the previous ones, we can start to do some\
    \ pretty interesting things. This example is just a small sample of what we can\
    \ do with just a little bit of work in OpenLayers.\n\n# Summary\n\nThis brings\
    \ us to the end of the core coverage of the OpenLayers library. At this point,\
    \ we've covered in good detail the three 'core' classes—Layer, Control, and Map.\n\
    \nThis chapter specifically covered the Map class, along with its properties and\
    \ methods. We then went in to greater detail about map events and how to work\
    \ with them. Lastly, we learned how to use multiple map objects on the same page.\n\
    \nNow that we've gotten the fundamentals down, we're ready to start applying those\
    \ concepts and to create some really interesting mapping applications. The next\
    \ chapter covers the Vector class, a very powerful layer class that allows us\
    \ to do a lot of really neat things."
