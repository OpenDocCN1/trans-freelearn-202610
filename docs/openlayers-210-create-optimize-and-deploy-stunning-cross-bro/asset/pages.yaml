    +     ```

    +   - **Geometry.MultiPoint**: This is a collection ({Array}) of geometry point
    objects. Other classes, such as `LineString`, inherit from this class. To instantiate,
    pass in an array of Point objects:

    +     ```javascript

    +     var geom_multipoint = new OpenLayers.Geometry.MultiPoint([ geom_point_1,
    geom_point_2 ]);

    +     ```

    +   - **Geometry.Curve**: This class is similar to MultiPoint (it also inherits
    from it) but it assumes that the point objects are connected. To instantiate,
    pass in an array of Point objects:

    +     ```javascript

    +     var geom_curve = new OpenLayers.Geometry.Curve([ geom_point_1, geom_point_2
    ]);

    +     ```

    +   - **Geometry.LineString**: This class, as we saw earlier, is composed on point
    objects that are connected together. It is inherited from the Curve class—it is
    basically a curve which cannot contain less than two points. To instantiate, pass
    in an array of Point objects:

    +     ```javascript

    +     var geom_line = new OpenLayers.Geometry.LineString([ geom_point_1, geom_point_2
    ]);

    +     ```

    +   - **Geometry.MultiLineString**: MultiLineStrings contain multiple LineString
    objects. To instantiate, pass in an array of LineString objects:

    +     ```javascript

    +     var geom_multi_line = new OpenLayers.Geometry.MultiLineString([

    +     geom_line_1, geom_line_2 ]);

    +     ```

    +   - **Geometry.LinearRing**: This class is a version of a LineString that is
    closed—meaning the line ''loops back'' on itself, the beginning and end points
    are connected. When creating the object, you can close the line yourself by making
    the last point equal to the first point. To instantiate, pass in an array of LineString
    objects:

    +     ```javascript

    +     var geom_linear_ring = new OpenLayers.Geometry.LinearRing([ geom_point_1,
    geom_point_2, geom_point_3, geom_point_1 ]);

    +     ```

    +     You can also call it without passing the start point in as the end point.
    If you do this, it will be automatically closed for you (OpenLayers will automatically
    add in the start point as the end point).'
  merge: -1
  img_proc: true
- pgno: 273
  md: '+   - **Geometry.Polygon:** This class is essentially just an `{Array}` of
    `LinearRing` objects. For a basic polygon, you can pass in just one `LinearRing`
    object. The first `LinearRing` object you pass in will serve as the outer bounds
    of the polygon. All `LinearRings` objects passed in after the first will be holes
    within the polygon (for example, you could form a doughnut by passing in a large
    circle first then a smaller circle). To instantiate, pass in an array of `LinearRing`
    objects:


    ```

    var geom_polygon = new OpenLayers.Geometry.Polygon([ geom_linear_ring_1, geom_linear_ring_2
    ]);

    ```


    +   - **Geometry.MultiPolygon:** A MultiPolygon consists of multiple Polygon objects.
    To instantiate, pass in an array of `Polygon` objects:


    ```

    var geom_multi_polygon = new OpenLayers.Geometry.MultiPolygon([ geom_polygon_1,
    geom_polygon_2 ]);

    ```


    # Geometry subclass methods


    All the Geometry subclasses contain their own versions of the base Geometry class
    methods, along with some additional methods in some subclasses. The rest of this
    chapter (and book) will focus on the methods we''ve seen so far, so you should
    have all the knowledge you need to continue.


    ![](img/1b8cd151c9f278555f9cf255b20d244e_273_0.png)


    > Some of the subclass methods are outside the scope of this book, but they can
    all be found in the official docs at http://dev.openlayers.org/docs/files/OpenLayers/Geometry-js.html.


    # Feature class


    There''s one more class we should cover before continuing further discussion of
    the Vector class. The **Feature** class is what the Vector class uses to actually
    show Geometry objects on the map. We''ve used the Feature class throughout this
    chapter because, well, we can''t show objects on vector layers without it—so you''ve
    been exposed to a lot of the class already.


    # How the Feature class works


    The Vector layer class has a property called `features`, which is an array of
    Feature objects. We''ve used it in this chapter so far, and we''ll be using it
    a lot more. The feature objects are created, as you can imagine, from the **Feature**
    class.


    The base Feature class is composed of two things—**Geometry objects** (as you''ve
    seen), and **attributes**. The attributes contain data associated with the feature.'
  merge: -1
  img_proc: true
- pgno: 274
  md: '# Feature subclasses


    There is only one subclass we''ll be making use of—the `Feature.Vector` class.
    Like its parent Feature class, it is composed of a Geometry object and contains
    an `attributes` property. In addition, there is a `style` property which controls
    what the feature looks like (similar to how CSS styles HTML). We''ll talk about
    the Style class in detail in Chapter 10.


    # Feature functions


    There are really just a few methods we''ll be using throughout the book:


    +   - **destroy()**: Destroys the feature object.

    +   - **clone()**: Creates a copy of the feature object and returns it, as an
    `{OpenLayers.Feature.Vector}` object.

    +   - **getVisibility()**: Returns a `{Boolean}` which specifies whether the feature
    is displayed or not.

    +   - **move(location)**: Moves the feature to a passed in location. The `location`
    can be either an `{OpenLayers.LonLat}` object, which will move the feature to
    a passed in map coordinate, or an `{OpenLayers.Pixel}` object which will move
    it to a pixel location on the screen.

    +   - **onScreen(boundsOnly)**: Returns a `{Boolean}` indicating if the feature
    is within the map viewport (if it is visible on the screen). A `boundsOnly` parameter
    can be passed in, which is a `{Boolean}` set to `false` by default. If set to
    `true`, a quicker but less precise bounding box intersection method will be used.


    # Instantiating a feature object


    To create a feature object, we just call it like:


    ```

    var my_feature = new OpenLayers.Feature.Vector( geometry_object,

    attributes, style);

    ```


    The `geometry_object` is a geometry object (covered in the previous section).
    The `attributes` object is an optional object literal which will be mapped to
    the feature''s `attributes` property, which can be used to provide additional
    information about the feature (such as `{''building_area'': 18000, ''building_floors'':
    2}`). Lastly, the `style` object is an optional object specifying the feature''s
    style (covered in more detail in Chapter 10).'
  merge: -1
  img_proc: true
- pgno: 275
  md: '# Interacting with Features using Control.SelectFeature


    Now that we know how to create features and put them in our vector layer, how
    do we interact with them? Earlier, we said that interaction with features happens
    nearly instantly—this is because all the vector feature data is stored in the
    client''s browser. There is no need to request information from a server when
    clicking on a feature.


    To make something happen when clicking on a feature, we''ll need to use the SelectFeature
    control class (the OpenLayers.Control.SelectFeature class). This control allows
    us to interact with our feature objects—such as doing things whenever we mouse
    over or click on a feature. Let''s take a look at how to use it in an example
    and then go over the SelectFeature control class itself.


    # Time For Action – using the SelectFeature control


    Let''s put together a few things we''ve learned so far. We''ll create some points
    and a polygon, place it on the map, and use the SelectFeature control to allow
    the user to select them. We''ll register the features selected and feature unselected
    events so that we can fire an event when the user interacts with a feature. When
    those events are fired, we''ll access the feature''s attributes object and display
    information from it. Let''s do it.


    +   1. We''ll be adding a vector layer, some features, and a SelectFeature control.
    The file will be referred to as `chapter9_selectFeature.html`.

    +   2. First, let''s make vector_layer a global variable like we did earlier in
    this chapter. Place this outside the `init` function, right after `var map;`.

    +      ```js

    +      var vector_layer;

    +      ```

    +   3. Next, we''ll add a `<div>` element that we''ll output feature info to when
    the user clicks on a feature. Add this div after the map div:

    +      ```html

    +      <div id=''map_feature_log''></div>

    +      ```

    +   4. Now, back to the `init` function code. Add the vector layer after the WMS
    layer is added to the map:

    +      ```js

    +      vector_layer = new OpenLayers.Layer.Vector(''Basic Vector Layer'');

    +      map.addLayer(vector_layer);

    +      ```

    +   5. Now, let''s add some features. We''ll add two point features and one polygon
    feature. We''ll pass in an attributes object (an object with key:value pairs to
    store data) to each feature. Let''s first create the two point features:

    +      ```js

    +      var feature_point_1 = new OpenLayers.Feature.Vector(

    +        new OpenLayers.Geometry.Point(6.055, 46.234),

    +        {

    +      ```'
