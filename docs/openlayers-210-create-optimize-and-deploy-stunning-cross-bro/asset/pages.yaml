- pgno: 120
  md: '# Defining custom projections


    Now that the Proj4js library is included, you can do transforms with more projections
    the same way we did in the previous example. Not all projections are defined;
    however, you are able to define them yourself, for example:


    ```

    Proj4js.defs["EPSG:27563"] = "+title=LAMB sud france +proj=lcc

    +lat_1=44.1 +lat_0=44.1 +lon_0=0 +k_0=0.999877499 +x_0=600000

    +y_0=200000 +a=6378249.2 +b=6356515 +towgs84=-168,-60,320,0,0,0,0

    +pm=paris +units=m";

    ```


    After that, you''d be able to use EPSG:27563 for projection transformations just
    like you were able to use EPSG:4326 and EPSG:900913 from the earlier examples.


    There are a number of already defined projections, and you can view them more
    extensively at http://proj4js.org. A more complete list (containing Proj4js definitions
    for nearly any EPSG code) can be found at http://spatialreference.org/.


    # Summary


    In this chapter, we talked about projections. We covered what they are and the
    various different types of projections. Longitude, latitude, and other geographic
    concepts were also discussed. While we just scratched the surface of these pretty
    complex topics, you should have enough fundamental information to understand how
    to use projections.


    We also talked about the Projection class, along with how to transform coordinates
    and use the Proj4js library. You''ll often work with data in coordinate systems
    other than EPSG:4326, and knowing how to work with and transform data in other
    projections is important.


    In the next chapter, we''ll take a look at Google Maps and other third party APIs,
    and put some of our recently gained knowledge of projections to use.'
  merge: -1
  img_proc: true
- pgno: 121
  md: '# 5


    # Interacting with Third Party APIs


    *Web maps are very popular today, and are growing in popularity. After Google
    Maps was introduced, there was an explosion of interactive web maps. Google provides
    an API to interface with its mapping service, as do others now, and OpenLayers
    work well with most of them. Not only can we use these third party APIs with OpenLayers,
    we can also ''mashup'' other layers on top of them.*


    In this chapter, we''re going to learn:


    +   - Concept of third party mapping APIs

    +   - Using the layer classes for third party APIs: Google, Microsoft, and Yahoo!

    +   - How to use OpenStreetMap

    +   - Working with Spherical Mercator

    +   - Combining different layer classes


    # Third party mapping APIs


    Web based maps are commonplace today. The catalyst for the explosive growth of
    web maps was the introduction of Google Maps. Web maps existed before, but they
    were not quick or developer friendly. In June 2005, Google released an API for
    Google Maps which provided a front end client (the role OpenLayers plays) along
    with an access to the backend map server.


    This allowed anyone to insert not just a Google Map on their site, but also allowed
    them to add in their own point data and manipulate the map in other ways. Google
    Maps grew in popularity, and other companies, such as Microsoft and Yahoo!, followed
    in their footsteps, creating their own web-mapping APIs.'
  merge: -1
  img_proc: true
- pgno: 122
  md: '# Map mashups


    The term **mashup** refers to an application that combines various different data
    sources and functionality together. A **map mashup** is a map that combines different
    layers and data. Third party mapping APIs, like Google and Yahoo! Maps, allow
    people to more easily create these ''map mashups''. For example, a map with a
    Google Maps base layer overlaid with markers that track places you''ve traveled
    to could be considered a map mashup.


    OpenLayers did not introduce map mashups, but it allows us to create very powerful
    ones with ease. Combining a Google''s Map layer, a WMS layer, and a Vector layer
    is pretty simple with OpenLayers.


    # OpenLayers and third party APIs


    OpenLayers allows you to use third party mapping APIs inside your map application,
    letting you use their maps inside of yours. The main caveat is that, at the time
    of writing, the third party API map must be a base layer (but, as we discussed
    before, you can use as many base layers as you wish).


    The three large commercial mapping APIs that OpenLayers can communicate with are
    **Google Maps**, **Yahoo! Maps**, and **Bing (Microsoft) Maps**. There is another
    free and open source API that OpenLayers works well with (and works in a similar
    manner to the previous three) called **OpenStreetMap**.


    We''ll first take a look at each of these four Layer classes, and then we''ll
    go over how to combine them with other Layer classes.


    # Google Maps


    The software behind Google Maps consists of a client and server. The client is
    what you use when you visit `http://maps.google.com`, and it communicates with
    the Google Maps backend servers. Google provides an API that lets you use their
    own client and backend server, but since OpenLayers is used as our client, we''re
    only interested in interacting with Google''s backend map server.


    > There may be legal restrictions depending on how you plan to use the Google
    Maps. Full restrictions can be found at `http://code.google.com/apis/maps/terms.html`
    and `http://www.google.com/intl/en_ALL/help/legalnotices_maps.html`.'
  merge: -1
  img_proc: true
- pgno: 123
  md: "In the previous chapters, we've set up the Google Layer using Version 3 (V3)\
    \ of the Google Map API. Because Google Maps updates their API, OpenLayers must\
    \ also update to accommodate any changes that are made. OpenLayers versions prior\
    \ to 2.10 (the one this book is based on) use Version 2 (V2) of the Google Maps\
    \ API. Google Maps V2 usage is deprecated however, so we will focus on using V3.\
    \ From our perspective, our code doesn't change much—OpenLayers handles all the\
    \ version specific functionality behind the scenes for us.\n\nHowever, you are\
    \ likely to encounter older OpenLayers maps made using Google Maps Version 2,\
    \ so we will cover how to use both V2 and V3. Again, please use only V3 when making\
    \ new maps, as V2 will eventually no longer be supported.\n\n# Differences between\
    \ Google Maps version 2 and version 3\n\nThere are really only three things that\
    \ you must do differently when going from Google Maps V3 to V2 (or vice versa):\n\
    \n+   1. The script tag you add in to reference the Google Maps library is different.\
    \ You do not need to provide an API key with V3 of the Google Maps API.\n+   2.\
    \ The layer names used in the `type` property are different. For example, the\
    \ 'terrain' layer in V3 is defined as `type: google.maps.MapTypeId.TERRAIN`, but\
    \ in V2 it is `type: G_PHYSICAL_MAP`.\n+   3. The layer is configured with spherical\
    \ Mercator (we'll cover what this means shortly).\n\n> It is recommended you use\
    \ V3 of the Google Maps API. The official Google Maps V3 documentation can be\
    \ found at http://code.google.com/apis/maps/documentation/javascript/.\n> \n>\
    \ Official Google Maps API docs for V2 can be found at http://code.google.com/apis/maps/documentation/javascript/v2/reference.html.\n\
    \n# Time for Action – using Goole Maps V3 (standard way)\n\nLet's create a map\
    \ using V3 of the Google Maps API. We've already done this in Chapter 3, so you\
    \ should be somewhat familiar with it. This is the standard way to use the Google\
    \ Maps Layer, and you should use this method unless you specifically need a layer\
    \ type in V2 that V3 does not yet support."
  merge: -1
  img_proc: true
- pgno: 124
  md: "> With versions of OpenLayers prior to 2.10, accessing Google Maps V3 may not\
    \ work.\n\n1. Version 3 of the Google Maps API does not require an API key. However,\
    \ you still must include the following in your <head> section, so OpenLayers knows\
    \ where to look for the Google Maps API library. We'll be asking the map's API\
    \ and specify that we want v3.2 of the Google Maps API (you can leave the &v=3.2\
    \ parameter if you'd like to let Google Maps provide the latest version for you\
    \ automatically). Add this before your OpenLayers inclusion script:\n\n```\n<script\n\
    src=\"http://maps.google.com/maps/api/js?sensor=false&v=3.2\"></script>\n```\n\
    \n2. Let's start by adding a hybrid layer to our map. The type property is in\
    \ the form of google.maps.MapTypeId.TYPE, where TYPE in this case is HYBRID:\n\
    \n```\nvar google_hybrid = new OpenLayers.Layer.Google(\n    \"Google Hybrid\"\
    ,\n    {type: google.maps.MapTypeId.HYBRID}\n);\n```\n\n3. Now we'll add a physical\
    \ (topographic type) layer:\n\n```\nvar google_physical = new OpenLayers.Layer.Google(\n\
    \    \"Google Physical\",\n    {type: google.maps.MapTypeId.TERRAIN}\n);\n```\n\
    \n4. To add a satellite layer type:\n\n```\nvar google_satellite = new OpenLayers.Layer.Google(\n\
    \    \"Google Satellite\",\n    {type: google.maps.MapTypeId.SATELLITE}\n);\n\
    ```\n\n5. Now, we'll create a streets layer. If we do not pass in a layer type,\
    \ the streets layer is used by default. If you wish to manually specify the type,\
    \ the streets map type is google.maps.MapTypeId.ROADMAP.\n\n```\nvar google_streets\
    \ = new OpenLayers.Layer.Google(\n    \"Google Streets\",\n    {\n});\n```"
  merge: -1
