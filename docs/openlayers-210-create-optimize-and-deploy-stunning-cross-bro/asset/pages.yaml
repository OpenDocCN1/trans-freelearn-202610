- pgno: 291
  md: 'Now that we have a hold on how to use these classes, let''s finish up by talking
    just a little more about the Format and Strategy classes.


    # Format class


    The Format class is used to serialize and deserialize feature data. There are
    just two properties, a few methods, and a list of valid subclasses we should quickly
    cover.


    # Format class properties


    You''ll often run into a situation where you have a data file that is in a different
    projection than your map. For instance, if you are using a spherical Mercator
    projection for your map and the data is in EPSG:4326, you''ll need to set the
    following two properties so that OpenLayers can transform the projection.


    +   - externalProjection: `{OpenLayers.Projection}` This specifies the projection
    that the data is in.

    +   - internalProject: `{OpenLayers.Projection}` This specifies the projection
    that the map (or the geometries that will be returned) is in.


    > By default, you can only use the spherical Mercator and EPSG:4326 projections.
    If you wish to use a different projection, you will need to include the Proj4js
    library, which was covered in more detail in Chapter 4.


    # Format class methods


    There are two primary methods that all subclasses share.


    +   - read(data): Deserializes passed in data. There are other parameters that
    differ between subclasses. The return type also differs, but is often an array
    of feature objects.

    +   - write(features): Serializes passed in features and returns a string. The
    returned string will be in whatever format the format object is in—i.e., if you
    are using a KML format object, the returned string will be in a valid KML format.


    Most subclasses extend the above methods, allowing more parameters to be passed
    in. Full coverage is outside the scope of this book, but can be found in the docs
    at http://dev.openlayers.org/docs/files/OpenLayers/Format-js.html.'
  merge: -1
  img_proc: true
- pgno: 292
  md: '# Format subclasses


    There are a myriad of subclasses available to us. Because new formats are often
    added, check the docs for a complete up to date list. At the time of writing,
    valid subclasses were:


    *ArcXML, Atom, GeoJSON, GeoRSS, GPX, JSON, KML, OSM, OWSContext, SOSCapabilities,
    Text, WFS, WKT, WMSGetFeatureInfo, WMTS Capabilities, XML*


    # Strategy class


    The strategy class is used to determine how the vector layer will request data
    and what it does with the feature data. Strategies can be used together—for example,
    the `BBOX` and `Cluster` strategies can be both used at the same time. Each subclass
    is quite different from each other, so let''s take a look at each of the subclasses.


    # Strategy.BBOX


    This class is used to display data that is within the map''s extent. When used
    with the WFS protocol, it will set up the request to grab only the data that falls
    within the map''s extent. If you are working with a lot of feature data, using
    the BBOX strategy will be quite helpful, as you''ll only get back the data that
    is within the visible extent. This is possible only with some sort of feature
    server though—a static file won''t know what to do with the requests passed in
    map extent, and will always return back every feature which the static file contains.


    # Strategy.Cluster


    This will cluster features together based on a `distance` and optional `threshold`
    parameter. Features in the vector layer''s feature list will be replaced with
    cluster features, and each cluster contains all of its features'' information
    in a `cluster` object property.


    The `distance` property specifies an `{Integer}` pixel distance between clusters.
    If a point falls within the distance, it is added to the cluster. Default value
    is 20.


    The `threshold` property is an optional property which determines whether or not
    features will be clustered depending on how many features are found. By this,
    if the `threshold` is set at 4, it means that at least four features must be found
    to create a cluster. If there are three features that fall within the `distance`,
    then they will not be clustered as they don''t meet the `threshold` value.'
  merge: -1
  img_proc: true
- pgno: 293
  md: '# Strategy.Filter


    The **Strategy.Filter** class is used to limit features that get added to the
    vector layer. It uses the **OpenLayers.Filter** class to do comparisons on feature
    data. To use this strategy, you must create a **OpenLayers.Filter** object, which
    is covered in detail in the next chapter.


    # Strategy.Fixed


    This strategy is used to request features once and never request them again. There
    is a `preload` property that will load data before the layer is visible, which
    is `false` by default. If set to `true`, data will be loaded before features are
    drawn, but can slow down your map.


    # Strategy.Paging


    Using this strategy, features can be grouped into ''pages,'' which means you''ll
    receive groups of your data. If you have tons of data, this is a very useful strategy.
    There is a `length` property which takes in an `{Integer}` which specifies the
    number of features per page. The default value is `10`.


    Another property, `num`, contains an `{Integer}` of the current page number. To
    use this strategy, you will need to call the `pageNext()` and `pagePrevious()`
    methods to advance through the pages.


    # Strategy.Refresh


    This strategy will refresh the vector layer, causing features to be re-requested
    and redrawn. It can be called manually, or an interval can be set and it will
    refresh at the passed in interval.


    The `interval` property is a `{Float}` in milliseconds which, if set to a number
    greater than 0, specifies how often to automatically refresh the vector layer.
    By default, it is set to `0`, and will not automatically refresh.


    There is a `force` property as well, which will force the layer to be refreshed.
    It is set to `false` by default.


    There are a few relevant methods to use:


    +   - **refresh()**: Causes the layer to be refreshed

    +   - **reset()**: Resets the timing interval (if set)

    +   - **start()**: Begins the auto-refresh behavior based on the `interval` property

    +   - **stop()**: Ends the auto-refresh'
  merge: -1
  img_proc: true
- pgno: 294
  md: '# Strategy.Save


    Using this strategy, features can be saved to a server. The server must allow
    saving, such as a WFS server using transactions. When the `save()` method is called,
    changes will be attempted to be saved to the server.


    There is also an `auto` property which can be set to a `{Boolean}` or `{Float}`
    (in seconds). If set to `true`, which will save immediately after the features
    are modified (or deleted). If set to a number, the features will be saved at the
    passed in interval.


    # Summary


    This ends the chapter on the Vector Layer class. We talked about what the Vector
    Layer class is and how it works. We also went over the properties, methods, and
    events of Vector Layer class and demonstrated them with examples. The Feature
    and Geometry classes were also covered, along with their properties and methods.
    Lastly, we learned about the Strategy, Protocol, and Format classes and how to
    create a vector layer with them.


    In the next chapter, we''ll work more with the Vector Layer. We''ll learn how
    to style our Vector layers, along with learning how to use the Rule and Filter
    classes to give us complete control over how our vector layer looks.'
  merge: -1
  img_proc: true
- pgno: 295
  md: '# 10

    Vector Layer Style Guide


    > *At this point, you''re hopefully getting pretty comfortable with OpenLayers.

    > We''ve talked about how to customize the appearance of Controls (UI elements),
    but we haven''t talked much about how to customize the appearance of the map itself.*


    In this chapter, we''ll make things look pretty (more or less). We''ll:


    +   - Learn how to style Vector layers in OpenLayers

    +   - Discuss the Style class and demonstrate how to use it

    +   - Go over the StyleMap class

    +   - Work with the Rules class

    +   - Learn about the Filter class


    Let''s get to it!


    # Styling the Vector Layer


    In the last chapter, you saw how powerful the vector layer can be. In this chapter,
    we''ll go a bit deeper and talk about how to customize the appearance of the features
    within your vector layer. The way vector layer styling works is similar to how
    we customized the appearance of our control objects, but instead of using CSS,
    we use Style and StyleMap objects with the vector layer. We can style the vector
    layer this way because the vector layer does not use raster images—it uses SVG
    (or Canvas or VML) elements that can be styled, similar to how HTML elements can
    be styled with CSS.'
  merge: -1
  img_proc: true
- pgno: 296
  md: 'Changing the feature styles, such as changing the color of our features from
    the default orange to blue, is quite easy. But changing colors of a vector layer''s
    features is perhaps just one of the most basic things we can do. By using the
    **Rule** and **Filter** classes, we can specify *how* (and what) features should
    be styled. For example, we could color points differently depending on their geographic
    location or depending on the values of properties contained in their `attributes`.


    We can do much more than just modify colors. We can change the sizes, opacities,
    line styles, and a variety of other properties. Style properties can be set arbitrarily,
    or be based on properties of individual feature objects themselves.


    # Applying styles


    We can do a lot, but how? There are three different ways to apply styles to a
    vector layer.


    +   - Use the StyleMap and Style objects.

    +   - Apply a symbolizer (an anonymous object with style properties) directly
    to the layer.

    +   - Apply a symbolizer directly on a feature. This primarily only occurs when
    reading in data from a source like a KML file.


    The first way is what we''ll be using throughout this chapter. A **StyleMap**
    is, essentially, a mapping of **Style** objects to various ''states'', or **intents**,
    of feature objects. For example, the `default` intent is what a feature object
    is normally set as. When you select it, it then receives the `select` intent,
    and any styles mapped to that intent.


    The **Style** object contains a style symbolizer, or numerous style properties
    and values. We use symbolizers to define style, and we can use symbolizers on
    Style objects, directly on layer objects, or directly on an individual feature.


    # What are symbolizers?


    A **symbolizer** is just an an anonymous object consisting of `key:value` pairs
    that contains style properties, similar to CSS. For example, { `fillColor`: ''#336699'',
    `strokeWidth`: 4 } is a symbolizer which tells the feature to have a fill color
    of #336699 (light blue), and a stroke width of 4 pixels. We''ll cover a full list
    of valid properties later in this chapter.


    We use symbolizers when we create **Style** objects to specify the style properties
    to apply to our features. We can apply a symbolizer directly to the vector layer
    object, or read in style information from a source file (such as a KML file).


    Before we dive into the **StyleMap** and **Style** classes, let''s first take
    a look at an example so we can better wrap our heads around what we intend to
    do in this chapter.'
  merge: -1
  img_proc: true
- pgno: 297
  md: "# Time For Action – applying some basic Styling\n\nApplying styles is pretty\
    \ easy, as you'll see:\n\n+   1. We'll be doing a few things in this example.\
    \ First, we'll create a vector layer. Then, we'll add some features to it. Nothing\
    \ new so far. Then, we'll style the layer by creating a StyleMap and Style object\
    \ and applying them to the vector layer.\n+   \n+   2. Add a WMS layer to the\
    \ map (like in previous chapters) then create and add a vector layer to the map:\n\
    +   \n+   3. Let's add some feature points. We'll create a loop which will create\
    \ ten randomly placed feature objects and add them to the vector layer. These\
    \ coordinates will be different each time you refresh the page, as they are being\
    \ randomly generated:\n+   \n+   4. Now, let's add some style to our vector layer.\
    \ We'll be using a StyleMap object and apply a style to the 'default' intent (the\
    \ 'normal state' of the features) so all features will receive the style. First,\
    \ we'll need to create a Style object which will be used by the StyleMap object\
    \ that gets applied to the layer. The Style object consists of a symbolizer, as\
    \ we previously mentioned, that contains key:value pairs of styles to apply to\
    \ the features (similar to CSS):\n\n```\nvector_layer = new OpenLayers.Layer.Vector('Basic\
    \ Vector Layer');\nmap.addLayer(vector_layer);\n```\n\n```\nfor(var i=0; i<10;\
    \ i++) {\n    vector_layer.addFeatures([new OpenLayers.Feature.Vector(\n     \
    \   new OpenLayers.Geometry.Point(\n            (Math.floor(Math.random() * 360)\
    \ - 180),\n            (Math.floor(Math.random() * 180) - 90)\n        )\n   \
    \ )]);\n}\n```\n\n```\nvar vector_style = new OpenLayers.Style({\n    'fillColor':\
    \ '#669933',\n    'fillOpacity': .8,\n    'strokeColor': '#aaee77',\n    'strokeWidth':\
    \ 3,\n    'pointRadius': 8\n});\n```"
  merge: -1
  img_proc: true
- pgno: 298
  md: "5. Next, we create a StyleMap object and use the Style object we just created\
    \ to define the layer's 'default' intent style.\n\n```\nvar vector_style_map =\
    \ new OpenLayers.StyleMap({\n  'default': vector_style\n});\n```\n\n6. Finally,\
    \ we set the StyleMap object to the vector layer.\n\n```\nvector_layer.styleMap\
    \ = vector_style_map;\n```\n\n7. You should see a bunch of green dots similar\
