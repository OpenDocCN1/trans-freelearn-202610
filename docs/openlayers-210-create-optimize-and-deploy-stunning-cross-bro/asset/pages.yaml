    \ to the map so its index is 0 (because array start its index at 0), so we would\
    \ type map.layers[0]. The next layer, wms_layer_labels, has an index of 1, and\
    \ so on.\n\nAccessing layers this way, however, is not advised. Adding a layer\
    \ will change the array, as will deleting a layer. The best way to access layer\
    \ objects is to store a reference to them, like we've been doing in all the examples\
    \ (e.g., var my_layer = new OpenLayers.Layer(), as we'll go over now.\n\n# Storing\
    \ references to layer objects\n\nThe second way is to define our layer objects\
    \ as global variables, like how we did with our map object. So far, all our layer\
    \ objects are defined inside the init() function, which means we can't access\
    \ them or refer to them outside of the init() function. If we try to access the\
