  md: "# panDuration\n\npanDuration: {Integer} Default: 50\n\nSpecifying this will\
    \ control how long panning takes to complete. Like the `panMethod` property, this\
    \ property only effects the panning animation of the map.\n\n# Time for Action\
    \ – working with Pan animations\n\nOpenLayers gives us the ability to use different\
