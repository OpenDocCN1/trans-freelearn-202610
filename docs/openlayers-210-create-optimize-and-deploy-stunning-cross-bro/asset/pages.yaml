- pgno: 145
  md: '# WMS with Spherical Mercator/third party map layers


    We also have a WMS layer, set to be an overlay layer. To use a WMS service on
    top of a Google Maps layer (or any other third party map layer), the WMS service
    must support the `EPSG:900913` projection. The WMS service we used, `http://vmap0.tiles.osgeo.org/wms/vmap0`,
    does support this projection so the map tile images properly lined up with the
    Google Maps layer. If a WMS service does not support the `EPSG:900913` projection,
    the map tile images would not properly line up.


    > To find out what projections a WMS service supports, you can make a `getCapabilities`
    request to the server. To make this request, specify the `request`, `service`,
    and `version` properties in the URL. For example, `http://wmserver/?request=GetCapabilities&service=WMS&version=1.1.1`.


    # Summary


    In this chapter, we talked about what third party mapping APIs are and how to
    use them. We learned how to use the Google, Yahoo!, and Microsoft mapping APIs,
    along with the OpenStreetMaps API. We also discussed Spherical Mercator and demonstrated
    how to use it. Finally, we created a map ''mashup'', mixing various different
    layer types together.


    The next chapter will focus on another part of OpenLayers—the **Control** class.
    This is another thing that sets OpenLayers apart from other mapping libraries.
    With it, we''re able to interact with our map, add tons of additional functionality,
    and even create our own custom controls.'
  merge: -1
