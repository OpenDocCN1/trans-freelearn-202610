- pgno: 4
  md: '# About the Author


    **Erik Hazzard** is a web developer—designer, Open Source advocate, and VI user.
    He loves to learn, teach, and occasionally blogs on his website at http://vasir.net/.
    As a professional web developer of five years, Erik specializes in Python and
    JavaScript, using open source software whenever possible. When he''s not developing
    web applications, he''s often developing or designing video games.


    He works at FREAC (Florida Resources and Environmental Analysis Center), a great
    place with great people that does all kinds of GIS and web development work.


    I''d like to thank the developers of OpenLayers, who continually do a fantastic
    job of developing the best web-mapping framework. I''d like to also thank my friends
    and mentors Ian Johnson and David Arthur for giving me the confidence and support
    I needed to get into web development. I''d like to thank Georgianna Strode and
    Stephen Hodge for their guidance, advice, and providing me with the opportunity
    to become a better web developer. I could not have written this book without the
    help of the great team at Packt; I hope every author can be as lucky as me to
    have such an excellent group of people to work with. I''d like to thank my parents
    for their never ending support. Lastly, I''d like to thank my love, Alisen, for
    her understanding and taking the time to help me make sure that the book is as
    easy to read as possible.'
  merge: -1
  img_proc: true
- pgno: 5
  md: '# About the Reviewers


    **Xurxo Méndez Pérez** was born in 1983 in Ourense, a little town in the south
    of Galicia, Spain. He lived there until he started the study for a degree in IT
    in the University of A Coruña, which finalized in 2008.


    For the last two years he has been working, at the Computer Architecture Group
    of the University of A Coruña developing GIS applications (making intensive use
    of many OGC standards) like Sitegal and SIUXFor (web GIS based applications to
    manage land properties and promote their good uses in the Galician region), MeteoSIX
    (a GIS system that provides access to geolocated observed and forecasted meteorological
    data in Galicia) and others.


    He also has large experience (3+ years) as a developer of mobile applications,
    having played first with JavaME, but nowadays he specializes in Google Android,
    with more than a dozen developed applications, some of them combining concepts
    like GIS and geolocation, real time responsiveness, and multiuser needs.


    **Alan Palazzolo** has been building web applications big and small for over five
    years, most of which have been with the open source, content management system
    Drupal, and along the way has picked up some experience in data visualization
    and mapping. He is a strong believer and advocate for the open source methodology
    in software and in life. He was involved in starting a Free Geek chapter in the
    Twin Cities, and constantly tries to use technology, and specifically the Internet,
    to enhance the lives of those that are less fortunate than most.


    **Ian Turton** is a geography researcher at the Pennsylvania State University.
    He became a geographer by accident nearly 20 years ago and hasn''t managed to
    escape yet. During that period he was a co-founder of the GeoTools open source
    Java toolkit that is now used as the basis of many geographic open source projects.
    He continues to serve on the Project Steering Committee for the project as well
    as committing new code and patches. He has also taught the very popular course
    "Open Web Mapping" using open standards and open source programs at the Pennsylvania
    State University and the University of Leeds.'
  merge: -1
  img_proc: true
