- pgno: 251
  md: '# How the Vector Layer is rendered


    As we discussed earlier, the vector layer doesn''t use raster graphics. Other
    layer types use the <img> tag (image tag) to show images—in HTML, the image tag
    will only display raster images. So, we can''t just use <img> tags like other
    layers. Instead, we have to use a vector image renderer. As we mentioned before,
    the vector data is not just an image, and can contain additional information such
    as the coordinates of the data.


    The vector data must be rendered to be seen. OpenLayers supports three ways to
    render the vector layer: SVG, Canvas, and VML.


    # SVG


    The default way to render the vector layer is to use the SVG renderer, which makes
    use of the <svg> tag. SVG is an acronym for Scalable Vector Graphics, and allows
    us to render vector images in the browser. All browsers (except Internet Explorer)
    support SVG, so by default OpenLayers uses SVG to render the vector layer.


    # Canvas


    We can use the Canvas renderer, which makes use of the <canvas> HTML tag. Using
    this renderer tends to be a little slower however, as the vector is actually turned
    into a raster with the canvas tag—but this may be desirable in some cases.


    # VML


    Internet Explorer does not follow web standards, and at the time of writing did
    not support SVG or Canvas. Fortunately, by default, OpenLayers will detect if
    the user''s web browser does not support modern technologies and a fall back renderer
    called VML will be used (which is similar to SVG, but is Microsoft specific).
    SVG tends to be faster than VML, so the only case where you would want to use
    VML over SVG is when Internet Explorer is used.


    # ''Renderers'' array


    When you create a vector layer, it looks for an array called renderers which contains
    the names of renderers, in order, to use. By default, the renderers array is set
    as:


    ```

    ["SVG", "VML", "Canvas"]

    ```


    This means that OpenLayers will try to use SVG first, and if the browser does
    not support SVG it will fall back on VML—and if it does not support VML, it will
    try to use Canvas.'
  merge: -1
  img_proc: true
