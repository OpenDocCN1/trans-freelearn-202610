    \ small-caps;\n}\n#content {\n    background:#ababab;\n    color:#f0f0f0;\n  \
    \  font-weight:bold;\n    text-align:right;\n}\n    #message {\n        background:#336699;\n\
    \    }\n.background_green {\n    background: #22dd22;\n}\n.align_left {\n    text-align:left;\n\
