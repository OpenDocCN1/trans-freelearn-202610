- pgno: 326
  md: "# Feature.Spatial\n\nThe **Feature.Spatial** class allows us to filter features\
    \ based on their geographic information. This class is used when *creating* a\
    \ vector layer. It differs from the previous logical filter, as we don't typically\
    \ add this to a rule after a vector layer has been created—it's used to specify\
    \ the features returned from a source like a WFS server. If you are creating a\
    \ vector layer which uses the WFS protocol, this is a very useful filter.\n\n\
    When creating a spatial filter, a `type` and `value` must be specified. The value\
    \ will be either a `{OpenLayers.Bounds}` or `{OpenLayers.Geometry}` object, depending\
    \ on the `type`. Some types also allow for additional `distance` and `distanceUnits`\
    \ parameters. Let's take a look at some of the types:\n\n+   - **OpenLayers.Filter.Spatial.BBOX**:\
    \ Specifies features to match that fall inside a bounding box, set by an `{OpenLayers.Bounds}`\
    \ object in the `value` property\n+   - **OpenLayers.Filter.Spatial.CONTAINS**:\
    \ Used to check if an `{OpenLayers.Geometry}` object specified by the `value`\
    \ property contains a feature\n+   - **OpenLayers.Filter.Spatial.DWITHIN**: Specifies\
    \ if a feature is within some distance specified by the `distance` property\n\
    +   - **OpenLayers.Filter.Spatial.INTERSECTS**: Used to check if a feature intersects\
    \ an `{OpenLayers.Geometry}` object specified in the `value` property\n+   - **OpenLayers.Filter.Spatial.WITHIN**:\
    \ Used to check if a feature is completely within an `{OpenLayers.Geometry}` object\
    \ specified in the `value` property\n\nSo, to use this filter, you'll usually\
    \ use it when instantiating your vector layer. We won't do an in depth example,\
    \ as it follows the general format of our previous examples. However, an example\
    \ instantiation call using the Spatial filter would look like this:\n\n```\nvar\
    \ my_vector_layer = new OpenLayers.Layer.Vector(\n  'My WFS Layer',\n  {\n   \
    \ protocol: new OpenLayers.Protocol.WFS({\n      url: wfs_server\n    }),\n  \
    \  filter: new OpenLayers.Fitler.Spatial({\n      type: OpenLayers.Filter.Spatial.BBOX,\n\
    \      value: new OpenLayers.Bounds(-180,-90,0,0),\n      projection: new OpenLayers.Projection('EPSG:4326')\n\
    \    })\n  });\n```"
  merge: -1
  img_proc: true
- pgno: 327
  md: '# Summary


    We''ve reached the end of our discussion about the core components of OpenLayers.
    This was the last chapter that deals specifically with defining parts of the OpenLayers
    API. In this chapter, we discussed styling vector layers in OpenLayers. We covered
    the Style and StyleMap classes, and went over how to work with the Rules and Filter
    classes.


    The next chapter will be similar to the latter part of this chapter. Instead of
    going over more of the OpenLayers library (you know enough now to be dangerous),
    we''ll go over the process of creating a web application using OpenLayers. We''ll
    put together the things we''ve learned throughout this book to demonstrate how
    everything ''fits together'', and what a typical development process looks like.'
