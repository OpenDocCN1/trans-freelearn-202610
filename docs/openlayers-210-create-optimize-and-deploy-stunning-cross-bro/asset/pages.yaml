    \n# What Just Happened?\n\nWe have just looked at a few of the properties we brought\
    \ up—`allOverlays`, `controls`, and (leaving out) the `div` property. We also\
    \ saw how the user can potentially see no map at all by turning off all the layers.\n\
    \nThe map will not automatically render, because we did not pass in an HTML element.\
    \ Instead, we called the `render()` method and passed in an HTML element after\
    \ our map object was created. There may be times when you wish to delay rendering\
    \ the map, such as waiting for a user to click a button, and in those cases this\
    \ is a good way to do it. We'll talk more about map methods later in this chapter,\
    \ but let's get back to discussing map properties.\n\n# eventListeners\n\n`eventListeners:\
    \ {Object}`\n\nThis property accepts an anonymous object containing key:value\
    \ pairs of event types (as the key) and functions to call (the values) when those\
    \ events are fired. We saw this property briefly in Chapter 6, and it behaves\
    \ the same way here. An example would be:\n\n```\nvar map = new OpenLayers.Map('map_element',\
    \ {\n    eventListeners: { 'moveend': my_moveend_function }\n});\n```\n\nThe above\
    \ code assumes that a function named `my_moveend_function` exists. We will cover\
    \ this property in much more detail, along with the possible event types, later\
    \ in this chapter in the section on events."
