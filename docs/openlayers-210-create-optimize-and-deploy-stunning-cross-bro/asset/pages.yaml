- pgno: 335
  md: "8. You should see an object that contains three properties: `Snippet`, `name`,\
    \ and `styleUrl`. These are somewhat arbitrary properties, specified in the KML\
    \ file for each photo, and with `extractAttributes: true` we can access them.\
    \ The `styleUrl` is a reference to a style tag inside the KML file—we'll talk\
    \ about it in the next example.\n\n# What Just Happened?\n\nWe just loaded in\
    \ the KML file and used `extractAttributes` to look at the properties that each\
    \ photo contains. Flickr is providing these attributes—the attributes in the KML\
    \ file gets applied to our feature objects. Another property we can use is `extractStyles`\
    \ to apply the styles from the KML file to our features.\n\n# Time for Action\
    \ – extract style\n\nThe `extractStyles` can be used to style the vector layer\
    \ based on the styles specified in the KML file. Because the Flickr KML file provides\
    \ style information, we can use this property—let's see how.\n\n+   1. If the\
    \ KML file you are working with contains style information, we can directly access\
    \ and use it. In this case, Flickr is providing us with a KML file embedded with\
    \ style tags, so let's use it.\n+   \n+   2. We'll specify `extractStyles: true`\
    \ inside our vector layer creation call. In the format value setting, add it in,\
    \ and be sure to include the comma:\n\n```\n```\n...\nformat: new OpenLayers.Format.KML({\n\
    \    extractAttributes: true,\n    extractStyles: true\n})\n...\n```\n```"
  merge: -1
  img_proc: true
- pgno: 336
  md: '3. Now open the page and you should see thumbnails of the images:


    ![](img/1b8cd151c9f278555f9cf255b20d244e_336_0.png)


    # What Just Happened?


    Using extractStyles, our features went from the default orange dots to thumbnails
    of the actual uploaded photos. When this property is used, style definitions in
    the KML file are applied to the style property of each feature. KML files can
    include style information—that is why we can use the extractStyles property with
    the KML format. OpenLayers will parse the style information from the KML file
    and generate the necessary style definitions.


    # Turning our example into an application


    So far, we''ve accessed data from Flickr, saved it to a file, and added it to
    our map. This is pretty cool, but we really haven''t done much else than just
    load in the data, from an OpenLayers point of view. It''s useful, but we really
    haven''t created a full featured ''web application'' just yet. So, let''s focus
    on how to build a more useful web-mapping application.'
  merge: -1
  img_proc: true
- pgno: 337
  md: "To do this, we'll basically need to do two general things:\n\n+   1. Add some\
    \ interactivity to our map.\n+   2. Use 'live' data. We shouldn't have to manually\
    \ download a KML file every time we want new data—our web application should do\
    \ it automatically.\n\nLet's focus on the first part, and then change the data\
    \ source after we develop some interactivity.\n\n# Adding interactivity\n\nIn\
    \ the previous example, each feature received an `externalGraphic` property because\
    \ we used `extractStyles` (causing thumbnails to be displayed for each feature)—but\
    \ it's hard to see where they are on the map, especially when zoomed out. We'll\
    \ need to address that. We want to show the photos, but we also want to show where\
    \ they are.\n\nTo accomplish this, we could revert back to using point features\
    \ and making use of the `selectFeature` control. But what if too many features\
    \ are too close to each, making it harder to select them? That's what the **cluster**\
    \ strategy is for, so we'll use it as well.\n\n# Selecting features\n\nWhat should\
    \ happen when we select a feature? We'll need to show information about the feature\
    \ we clicked on, and that information is the Flickr photo itself and any associated\
    \ attributes. So, let's keep things a little simple for now and show the photo(s)\
    \ information below the map when a feature is selected.\n\n# Time for Action –\
    \ adding some interactivity\n\nIn this example, we'll be using the **cluster**\
    \ strategy, **selectFeature** control, and showing photo information on selection.\
    \ As we go along, feel free to tweak the examples yourself, change the functionality,\
    \ or anything else—that's the best way to learn!\n\n+   1. Make a copy (or direct\
    \ edit) of the code from the previous example. We'll be improving it.\n+   2.\
    \ We'll keep `extractAttributes` and `extractStyles`. Even though we specify `extractStyles`,\
    \ we're going to be using a custom `styleMap` object. We're doing this so that\
    \ we can still access the thumbnail image location (which is set as `externalGraphic`\
    \ in the feature's `style` object when using `extractStyles`). Make sure the `format`\
    \ object looks like the following:\n\n```\n```\n...\nformat: new OpenLayers.Format.KML({\n\
    \    extractAttributes: true, extractStyles: true\n```\n```"
  merge: -1
  img_proc: true
- pgno: 338
  md: "```\n})\n...\n```\n\n3. Let's add a `cluster` strategy to the vector layer\
    \ now so our points cluster. Our `strategies` array should now look like the following:\n\
    \n```\nstrategies: [new OpenLayers.Strategy.Fixed(),\n            new OpenLayers.Strategy.Cluster()]\n\
    ```\n\n4. Let's take a quick look at the map to make sure it works. Since we have\
    \ used the cluster strategy, we won't see the thumbnails that we would have (like\
    \ in the previous example). Remember to access it from http://localhost/...:\n\
    \n![](img/1b8cd151c9f278555f9cf255b20d244e_338_0.png)"
