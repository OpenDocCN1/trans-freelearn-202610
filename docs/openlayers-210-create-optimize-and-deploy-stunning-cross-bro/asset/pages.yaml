- pgno: 207
  md: 'A developer that has proficient design skills is not a common thing—fortunately,
    there are resources that provide high quality, professional user interface elements.
    **GeoExt** is a third party library that integrates **ExtJS**, a popular JavaScript
    framework, with OpenLayers, and includes numerous user interface and OpenLayers
    map components. It does, however, require a bit of familiarity with the ExtJS
    library. GeoExt can be found at http://www.geoext.org/index.html, and the ExtJS
    can be found at http://www.sencha.com/products/js/.


    # Summary


    In this chapter, we talked about what CSS is and what it''s used for. We learned
    how to use CSS and HTML together, along with how to refer to elements in CSS.
    Then, we discussed how OpenLayers uses CSS, and how control elements get their
    names. Lastly, we created and applied our own custom styles to some controls.


    The goal of this chapter was to provide a foundation for understanding how we
    style controls with CSS. If you haven''t worked much with CSS before or if you''re
    unsure how to style other types of controls then don''t worry. We''ll be styling
    controls throughout the book using the same principles we introduced in this chapter,
    so you''ll get a lot more exposure to it.'
