- pgno: 196
  md: '> In CSS, you can use /* to begin a comment, and */ to end it. For example,
    /* This is a comment */


    # Have a Go Hero – view HTML and CSS in Firebug


    Open up Firebug and go to any website. Firebug will automatically build an HTML
    tree and populate the Style tab with the site''s style information. Poke around
    and try changing values with Firebug, and you''ll be able to immediately see the
    site''s appearance change based on the styles you apply with Firebug.


    # Cascading Style Sheets—Inheritance


    CSS uses inheritance in a similar way our classes in JavaScript do. With CSS,
    child elements can inherit properties of their parent elements, as well as override
    them. So, as in the example above, our body element had a text color (the color
    property) of black (#000000). This means that any element inside the body element
    (which is, practically, every HTML element on the page) will receive the color:#000000
    property unless overwritten.


    This is a situation where the ''cascading'' part of CSS comes in. Styles ''cascade''
    downwards, so the properties found in the child element (the ''bottom'' most elements)
    will override properties which it inherits from its parents (the elements above
    it).


    # Order of inheritance


    When trying to determine which style an element will receive, any styles from
    the class name will overwrite base element styles, and any styles from the ID
    will overwrite class styles. Take a look at the following code:


    ```

    <div id=''my_element'' class=''random_class''> Some text </div>

    <style>

    .random_class { #00ff00; }

    #my_element { color: #ff0000; }

    div { color: #000000; }

    </style>

    ```


    In this code, the element will have a final color of #ff0000. The base element
    (the div style) will be overwritten by the .random_class class style, and then
    the class style will be overwritten by the #my_element ID style. So, the order
    of importance is ID > class > base element type.


    Using the !important statement after the value of a property will ensure that
    the property is not overwritten by any of its children. If however, one of the
    children contains an !important statement on that property, then it will be overwritten.'
  merge: -1
  img_proc: true
- pgno: 197
  md: "# Referencing elements\n\nOne very useful thing we can do with CSS is to use\
    \ the inheritance we just talked about.\nMore specifically, we can write:\n\n\
    ```\n#my_element div {\n  background: #2222ff;\n}\n```\n\nThis will apply a background\
    \ color only to div elements that are children of #my_element.\nThis nesting can\
    \ be as deep as you'd like—just separate elements by a space. This, for\nexample:\n\
    \n```\n#my_element #my_inner_element .random_class a {\n  font-weight: bold;\n\
    }\n```\n\nThis would be applied to all a elements (an anchor tag, specified by\
    \ <a>) inside all elements with a class of random_class inside an element with\
    \ an ID of my_inner_element inside of an element with the ID my_element. If we\
    \ want to apply the same style to multiple elements, we have to simply specify\
    \ the elements and place a comma in between them:\n\n```\n#my_element1, #my_element2,\
    \ .random_class {\n  color:#cdcdcd;\n}\n```\n\nAlright, we've covered the basics\
    \ behind CSS and HTML element referencing, so let's see how OpenLayers uses CSS.\n\
    \n# Pop Quiz – how to reference elements\n\nTake a look at the following code.\
