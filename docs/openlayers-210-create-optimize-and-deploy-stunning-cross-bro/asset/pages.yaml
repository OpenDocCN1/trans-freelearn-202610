- pgno: 113
  md: "If you do not specify those options, the default values are used (all the other\
    \ maps so far have been using the default values). You should also specify the\
    \ units property, as we did with units: 'm', depending on the units your projection\
    \ uses.\n\nThe reason you must specify these properties is because different projections\
    \ use different coordinates. In the above example, we set the maxExtent to:\n\n\
    ```\nmaxExtent: new OpenLayers.Bounds(-20037508, -20037508,\n    20037508, 20037508.34)\n\
    ```\n\nThese values are much different than the default values—they are not longitude\
    \ and latitude values. Instead, they use an x/y coordinate system, and to OpenLayers\
    \ the longitude is the x value and latitude is the y value.\n\n# Pop Quiz – projections\n\
    \nGive some reasons why you might want to use a projection other than EPSG:4326.\
    \ What areas would not be best suited for displaying the EPSG:4326 projection?\n\
    \n# Longitude/Latitude\n\nLongitude and latitude are two terms most people are\
    \ familiar with, even if they have limited geographic knowledge or get confused\
    \ by the two. Let's take a look at the following screenshot and then go over these\
    \ two terms.\n\n![](img/1b8cd151c9f278555f9cf255b20d244e_113_0.png)"
  merge: -1
