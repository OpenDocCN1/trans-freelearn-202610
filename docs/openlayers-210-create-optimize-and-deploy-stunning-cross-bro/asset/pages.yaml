- pgno: 299
  md: '# The StyleMap class


    The **StyleMap** class tells the vector layer what **Style** objects to use when
    the features are in a certain ''state'', or what OpenLayers refers to as **intent**.
    As the previous example showed, there''s really not much in using this class.
    To create a **StyleMap** object you pass in an **intent** as the key (as a `{String}`),
    and a **Style** object is used as the value. For example, as in the previous example,
    `''default''` is the desired intent and the `vector_style` object is the desired
    style object to use for that intent. This causes the `vector_style` to be applied
    to the `''default''` intent:


    ```

    var vector_style_map = new OpenLayers.StyleMap( {''default'': vector_style} );

    ```


    # What is an ''intent''?


    The ''intent'', short for **render intent**, is a way to specify how features
    should be drawn, or what features should look like when in different ''states''.
    There are only three default intents we can use:


    +   - `''default''`: This is the intent used most of the time. If a feature is
    not in the two next intents, it is in this ''default'' intent.

    +   - `''select''`: Features are in this intent only when they are selected. When
    unselected, they return to the ''default'' intent.

    +   - `''temporary''`: This intent is used when features are being drawn or ''sketched'';
    e.g., via the EditingToolbar control. When the feature is finished being sketched,
    it is returned to the ''default'' intent.


    When creating a StyleMap object, if you specify a style object for only one intent,
    then all intents will receive that style object.


    For instance, in the previous example, we applied a style object only to the default
    intent—because we applied it to only one intent, all other intents receive that
    style. If we were to select one of the features, we would see no changes in the
    feature''s style because we did not specify a separate `''select''` intent style
    object.


    # The Style class


    The **Style** class is used to specify the styles a vector layer should use. As
    mentioned a couple of times before, it''s quite similar in principle to how we
    use CSS to style our controls. The difference is that with the vector layer we
    are directly embedding the style in the JavaScript code itself, using an anonymous
    object which is referred to as a **symbolizer**.'
