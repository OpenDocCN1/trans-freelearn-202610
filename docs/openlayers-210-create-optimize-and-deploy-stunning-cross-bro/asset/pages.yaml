- pgno: 107
  md: '# 4


    # Wrapping Our Heads Around

    Projections


    When you look at a map, you are looking at a two dimensional representation of
    a three dimensional object (the earth). Because we are, essentially, ''losing''
    a dimension when we create a map, no map is a perfect representation of the earth.
    All maps have some distortion.


    The distortion depends on what projection (a method of representing the earth''s
    surface on a two dimensional plane) you use. In this chapter, we''ll talk more
    about what projections are, why they''re important, and how we use them in OpenLayers.
    We''ll also cover some other fundamental geographic principles that will help
    make it easier to better understand OpenLayers.


    In this chapter, we will cover:


    +   - Concept of map projections

    +   - Types of projections

    +   - Longitude, latitude, and other geographic concepts

    +   - OpenLayers projection class

    +   - Transforming coordinates


    Let''s get started!'
  merge: -1
  img_proc: true
- pgno: 108
  md: '# Map projections


    No maps of the earth are truly perfect representations; all maps have some distortion.
    The reason for this is because they are attempting to represent a three dimensional
    object (an ellipsoid: the earth) in two dimensions (a plane: the map itself).


    A **projection** is a representation of the entire, or parts of a, surface of
    a three dimensional sphere on a two dimensional plane (or other type of geometry).


    # Why on earth are Projections used?


    Every map has some sort of projection—it is an inherent attribute of maps. Imagine
    unpeeling an orange and then flattening the peel out. Some kind of distortion
    will occur, and if you try to fully fit the peel into a square or rectangle (like
    a flat, two dimensional map), you''d have a very hard time.


    To get the peel to fit perfectly onto a flat square or rectangle, you could try
    to stretch out certain parts of the peel or cut some pieces of the peel off and
    rearrange them. The same sort of idea applies while trying to create a map.


    There are literately an infinite amount of possible map projections; an unlimited
    number of ways to represent a three dimensional surface in two dimensions, but
    none of them are totally distortion free.


    So, if there are so many different map projections, how do we decide on what one
    to use? Is there a best one? The answer is no. The ''best'' projection to use
    depends on the context in which you use your map, what you''re looking at, and
    what characteristics you wish to preserve.


    # Projection characteristics


    As a two dimensional representation is not without distortion, each projection
    makes a tradeoff between some characteristics. And as we lose a dimension when
    projecting the earth onto a map, we must make some sort of tradeoff between the
    characteristics we want to preserve. There are numerous characteristics, but for
    now let''s focus on three of them.


    # Area


    Area refers to the size of features on the map. Projections that preserve area
    are known as equal area projections (also known as equiarela, equivalent, or homographic).
    A projection preserves area if, for example, an inch measured at different places
    on the map covers the same area. Because area remains the same, **angles**, **scales**,
    and **shapes** are distorted. This is what an equal area projected map may look
    like:'
  merge: -1
  img_proc: true
- pgno: 109
  md: '![](img/1b8cd151c9f278555f9cf255b20d244e_109_0.png)


    # Scale


    Scale is the ratio of the map''s distance to the actual distance (e.g., one centimeter
    on the map may be equal to one hundred actual meters). All map projections show
    scale incorrectly at some areas throughout the map; no map can show the same scale
    throughout the map. There are parts of the map, however, where scale remains correct—the
    placement of these locations mitigates scale errors elsewhere. The deformation
    of scale also depends on the area being mapped. Projections are referred to as
    **equidistant** if they contain true scale between a point and every other point
    on the map.


    # Shape


    Maps that preserve shape are known as **conformal** or **orthomorphic**. Shape
    means that relative angles to all points on a map are correct. Most maps that
    show the entire earth are conformal, such as the Mercator projection (used by
    Google Earth and other common web maps). Depending on the specific projection,
    areas throughout the map are generally distorted but may be correct in certain
    places. A map that is conformal cannot also be equal-area. The maps we''ve been
    using so far have been conformal.


    # Other characteristics


    Projections have numerous other characteristics, such as bearing, distance, and
    direction. The key concept to take away here is that all projections preserve
    some characteristics at the expense of others. For instance, a map that preserves
    shape cannot completely preserve area.


    There is no ''perfect'' map projection. The usefulness of a projection depends
    on the context the map is being used in. A particular projection may excel for
    a certain task, e.g. navigation, but can be a poor choice for other purposes.'
  merge: -1
  img_proc: true
- pgno: 110
  md: '# Types of projections


    Projections are a way to represent three dimensions with two dimension surface.
    Projections are projected onto some geometric surface, three of the most common
    ones being a **plane**, **cone**, or **cylinder**.


    Imagine a cylinder being wrapped around the earth, with the center of the cylinder''s
    circumference touching the equator. Now, the earth is projected onto the surface
    of this cylinder, and if you cut the cylinder from top to bottom vertically and
    unwrap it, and lay it flat, you''d have a regular cylindrical projection:


    ![](img/1b8cd151c9f278555f9cf255b20d244e_110_0.png)


    The **Mercator** projection is one type of projection. If you''ve never worked
    with projections before, there is a good chance that most of the maps you''ve
    seen were in this projection.


    Because of its nature, there is heavy distortion near the ends of the poles. Looking
    at the previous screenshot, you can see that the cells get progressively larger,
    the closer you get to the North and South Poles. For example, Greenland looks
    larger than South America, but in reality it is about the size of Mexico. If area
    distortion is important in your map, you might consider using an **equal area**
    projection as we previously mentioned.


    > More information about projections can be found at the **USGS (US Geological
    Survey)** website at http://egsc.usgs.gov/isb/pubs/MapProjections/projections.html.


    # EPSG codes


    As we mentioned, there are literally an infinite number of possible projections.
    So, it makes sense that there should be some universally agreed upon classification
    system that keeps track of projection information. There are many different classification
    systems, but OpenLayers uses **EPSG** codes. EPSG refers to the European Petroleum
    Survey Group, a scientific organization involved in oil exploration, which in
    2005 was taken over by the OGP (**International Association of Oil and Gas Producers**).'
  merge: -1
  img_proc: true
- pgno: 111
  md: "For the purpose of OpenLayers, EPSG codes are referred to as:\n\n```\nEPSG:4326\n\
    ```\n\nThe numbers (4326 in this case) after EPSG: refer to the projection identification\
    \ number. This projection, EPSG:4326, is the default projection which OpenLayers\
    \ uses. It has been the projection used in all our examples so far, and uses the\
    \ familiar Longitude/Latitude coordinate system, with coordinates that range from\
    \ -180° to 180° (longitude) and -90° to 90° (latitude).\n\n# Time for Action –\
    \ using different projection codes\n\nLet's create a basic map using a different\
    \ projection.\n\n+   1. Using the template code, recreate your map object the\
    \ following way. We'll be specifying the `projection` property, along with the\
    \ `maxExtent`, `maxResolution`, and `units` properties. If we use a projection\
    \ other than the default projection, we need to tell OpenLayers the type of coordinates\
    \ to use, and setting the `maxExtent` is one way to do this. The projection we're\
    \ going to use is `EPSG:900913`, a projection used by Google Maps and other third\
    \ party APIs.\n+   \n+   ```javascript\n+   map = new OpenLayers.Map('map_element',\
    \ {\n+     projection: 'EPSG:900913',\n+     maxExtent: new OpenLayers.Bounds(-20037508,\
    \ -20037508,\n+       20037508, 20037508.34),\n+     maxResolution: 156543.0339,\n\
    +     units: 'm'\n+   });\n+   ```\n+   \n+   2. Save the file, we'll refer to\
    \ it as `chapter4_ex1.html`."
  merge: -1
  img_proc: true
- pgno: 112
  md: '3. You should see something like the following:


    ![](img/1b8cd151c9f278555f9cf255b20d244e_112_0.png)


    # What Just Happened?


    We just created a map with the projection `EPSG:900913`. You''ll notice that it
    looks quite a bit different than the maps we''ve made so far. This is because
    it is in a different projection.


    # Specifying a different projection


    OpenLayers supports any projection, but if you want to use a projection other
    than `EPSG:4326`, you must specify the following three options:


    +   - **maxExtent**: Default value is `-180,-90,180,90`

    +   - **maxResolution**: Default value is `1.40625`

    +   - **projection**: Default value is `EPSG:4326`'
  merge: -1
