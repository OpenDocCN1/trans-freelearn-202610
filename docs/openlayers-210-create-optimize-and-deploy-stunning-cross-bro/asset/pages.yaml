- pgno: 153
  md: "Doing it this way should make it clear why creating variables is a much better\
    \ way to instantiate control/layer objects, as it makes it much easier to access\
    \ the right object. Another downside to using the controls array itself is that\
    \ removing a control will affect the index of all other controls, so there can\
    \ be a lot of guesswork involved as to what control you're actually removing.\
    \ So, in short, avoid removing controls this way if you can.\n\n# Adding controls\
    \ by passing in an array of controls\n\nThe first way to specify controls for\
    \ your map is to pass them in as an array when the map object is instantiated.\
    \ Passing in an array of control objects when creating your map object is the\
    \ preferred way to add controls—it keeps all your control objects in one place,\
    \ making your code a little easier to read and maintain.\n\nIn the above example,\
    \ we created an array that held five control objects, four of which were instantiated\
    \ in the array itself:\n\n```\nvar navigation_control = new OpenLayers.Control.Navigation({});\n\
    var controls_array = [\n    navigation_control,\n    new OpenLayers.Control.PanZoomBar({}),\n\
    \    new OpenLayers.Control.LayerSwitcher({}),\n    new OpenLayers.Control.Permalink(),\n\
    \    new OpenLayers.Control.MousePosition({})\n];\n```\n\nAs we've mentioned before,\
    \ it's best to create a reference to an object (be it a control or a layer object)\
    \ before adding it to your map. We created the navigation_control object outside\
    \ an array, so we can easily access it just by referring to it.\n\nTo access the\
    \ other controls, we'd have to either call controls_array[index] or map.controls[index],\
    \ where index is the index of the control you wish to access. You should try to\
    \ avoid this method if possible, as the array may change, throwing off the index.\
    \ Furthermore, accessing controls by index like this affects your code's readability,\
    \ as it's not immediately obvious which control object you're trying to access.\n\
    \n# Adding controls to map with addControl() and addControls()\n\nThere are cases\
    \ where you might want to dynamically add controls to your map after it has been\
    \ created. To do so, we can use either the addControl() method of our map object\
    \ and pass in a single control object, or we can use addControls() and pass in\
    \ an array of objects."
  merge: -1
  img_proc: true
- pgno: 154
  md: "In the example above, we called addControl and passed in a ScaleLine control\
    \ object, which we instantiated on the fly:\n\n```\nmap.addControl(new OpenLayers.Control.ScaleLine({}));\n\
    ```\n\nWe also used addControls by passing in a control object that has already\
    \ been instantiated and an object which we created in the function call itself:\n\
    \n```\nvar overview_map = new OpenLayers.Control.OverviewMap();\nmap.addControls([\n\
    \  overview_map,\n  new OpenLayers.Control.KeyboardDefaults()\n]);\n```\n\nWhichever\
    \ method of adding controls you use, you should try to keep all your control related\
    \ code together. The bulk of the time you spend programming will be spent in reading\
    \ your code and not writing it. Your code will be much easier for you to read\
    \ and maintain if you organize it. There is no 'right' way to go about organizing\
    \ your code, but keeping related things (like code blocks related to controls)\
    \ grouped together is a good rule of thumb.\n\n# Removing controls\n\nSo, we know\
    \ how to add controls, but how about removing them? There are two common ways\
    \ to do this:\n\n+   - Call `map.removeControl(map.controls[x])`; where x is the\
    \ index of the control you wish to remove. As we stated before, removing controls\
    \ this way is discouraged because it is not clear which control is actually being\
    \ removed.\n+   - Another way is to call `map.removeControl(control_object)`;\
    \ where `control_object` is a reference to a control object you've already instantiated.\
    \ Be sure to keep in mind, if you define an object with var inside a function,\
    \ you won't be able to access it outside the function.\n\nNow that we're familiar\
    \ with how to add and remove controls, let's get into the Control class itself\
    \ and take a look at various different types of controls.\n\n# OpenLayers.Control\
    \ class\n\nAs we saw in the previous example, there are quite a few controls available\
    \ to us. The Control class is similar in nature to the Layer class—there is a\
    \ base Control class which all other control subclasses inherit from. Because\
    \ most controls provide completely different functionality from one another, the\
    \ base Control class does not contain a lot of properties.\n\nThe official, up\
    \ to date documentation for this class can be found at http://dev.openlayers.org/docs/files/OpenLayers/Control-js.html."
  merge: -1
  img_proc: true
- pgno: 155
  md: '# OpenLayers.Control properties


    Like properties of other classes, you can specify these properties when instantiating
    your control object. There are a few properties of the base OpenLayers.Control
    class, which are inherited by all other Control classes:


    | Name | Type | Description |

    |---|---|---|

    | autoActivate | {Boolean} | Set the control to activate when added to the map.
    Default value is false. |

    | div | {HTML Element} | Many controls support the ability to be placed in a div
    outside the map. (This does not work for all controls, however.) An example call
    would look like: {div: document.getElementById(''my_control_div'') } |

    | id | {String} | This specifies the ID of the HTML element that will be assigned
    to the control. |

    | eventListeners | {Object} | This object specifies event listeners to register.
    Events are covered later in this chapter. |

    | displayClass | {String} | Specifies the CSS class that the control will receive.
    By default, controls receive a class name made up of OlControl plus the control
    name, e.g. OlControlNavToolBar. We cover this in more detail in Chapter 7 on styling
    controls. |

    | title | {String} | The title you set here will be displayed in a tooltip (or
    other places, when appropriate). |

    | type | {Number} | Specifies the type of control, which is related to how the
    control functions. Used in various cases, such as when working with buttons or
    panels. We cover this later in the chapter, on the section on panels. |


    # OpenLayers.Control functions


    There are a few functions that all control subclasses inherit that we should take
    a look at.


    | Name | Description |

    |---|---|

    | destroy() | This will perform any clean up actions (such as removing any events
    attached to the control) and then remove the control from the map. Since the control
    is removed from the map, it also will no longer show up when accessing map.controls.
    |'
  merge: -1
  img_proc: true
- pgno: 156
  md: '| Name | Description |

    |------|-------------|

    | `moveTo(location)` | This function takes in a single parameter, `location`,
    an **OpenLayers.Pixel** object, and will move the control to the passed in pixel
    coordinate (in the order of x coordinate, y coordinate). This function will only
    really affect controls which have a visible component. An example call might be:
    `control_object.moveTo(new OpenLayers.Pixel(200,100))`; which would move the control
    to the x, y, position of 200, 100 inside of the map. The origin is the top left
    of the map, so it would move 200 pixels to the right and 100 pixels down. |

    | `activate()` | Calling this function will activate the control and its event
    handler (if one is set). Returns `true` if control was successfully activated
    and `false` if it was already active. |

    | `deactivate()` | Deactivates the control and any associated event handlers.
    The behavior of this will vary among controls. Returns `true` if control was successfully
    deactivated and `false` if it was already inactive. |

    | `draw()` | This function initializes the control. You will rarely have to call
    this, as it is usually called automatically. There may, however, be cases where
    you may want to issue the call manually. It returns a `{DOMElement}` which is
    a reference to the div containing the control (if one exists). |


    # OpenLayers.Control subclasses


    OpenLayers provides a lot of different types of controls, and an up to date list
    can always be found at http://dev.openlayers.org/docs/files/OpenLayers/Control-js.html.
    Some controls are deprecated, and should not be used, so we will not cover controls
    that will not be supported in OpenLayers version 3.0 or greater.


    Some properties and functions of some controls are mainly for advanced users and
    are outside the scope of this book, so we won''t cover them all. Some other controls
    are used in accordance only with the Vector Layer class—so we''ll get to those
    in Chapter 9. However, that still leaves us a lot to cover here now, so let''s
    get started!


    # OpenLayers.Control.ArgParser


    As we mentioned earlier, this is a control added to the map by default. It is
    aptly named; it parses the arguments passed in via the URL. For example, when
    appending ?zoom=0&lat=0&lon=0&layers=B to the URL of your map, the ArgParser control
    will parse the variables (i.e., zoom=0, lat=0, lon=0, and layers=B).'
