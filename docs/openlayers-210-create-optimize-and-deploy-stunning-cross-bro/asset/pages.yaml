- pgno: 94
  md: "# Layer.Image\n\nThis class allows us to use an image as a map layer. It's\
    \ bit different than the other layer classes OpenLayers offers, because it doesn't\
    \ strictly follow a client/server model. Once the initial request for the image\
    \ is made, the client has the image and OpenLayers handles all further map interaction—no\
    \ further requests are made to the server after the first request to get the image.\
    \ There are no tiles, like with other raster (non vector, which is nearly every\
    \ other layer class) layers. Instead, just a single image is used.\n\nThe original\
    \ purpose (and one of the best uses) of this class is to use an image for the\
    \ overview map control. But it can be used for many more things than just that—this\
    \ class, a great example of OpenLayers can be used for other purposes than just\
    \ mapping.\n\n# Time for Action – using the image layer\n\nLet's use the image\
    \ layer to create a sort of image viewer.\n\n1. First we'll need to add an image\
    \ layer. The image layer expects the name as the first parameter (like other layers),\
    \ the URL of the image next, then an {OpenLayers.Bounds} object specifying bounds\
    \ of the image, then an {OpenLayers.Size} object which contains Width, Height\
    \ pixel dimensions, and finally an optional options object.\n\n```\nvar image_layer\
    \ = new OpenLayers.Layer.Image(\n    'Wallpaper',\n    'http://us.starcraft2.com/images/wallpapers/wall3/\n\
    wall13-1920x1200.jpg',\n    new OpenLayers.Bounds(-180,-112.5,180,112.5),\n  \
    \  new OpenLayers.Size(1920,1200),\n    {numZoomLevels:7, maxResolution:.625}\n\
    );\n```\n\n2. Let's create another image layer now. We'll set the opacity to 20\
    \ percent and make sure it's not a base layer by setting isBaseLayer: false in\
    \ the options object. We'll also be using a different URL:\n\n```\nvar image_layer_2\
    \ = new OpenLayers.Layer.Image(\n    'Wallpaper 2',\n    'http://us.starcraft2.com/images/wallpapers/wall6/\n\
    wall6-1920x1200.jpg',\n    new OpenLayers.Bounds(-180,-112.5,180,112.5),\n   \
    \ new OpenLayers.Size(1920,1200),\n    {numZoomLevels:7, maxResolution:.625, isBaseLayer:false,\n\
    opacity:0.2}\n);\n```"
  merge: -1
  img_proc: true
