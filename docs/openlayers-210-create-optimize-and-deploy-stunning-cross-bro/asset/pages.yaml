- pgno: 126
  md: "# What Just Happened?\n\nWe just created a map using Google Maps API V3. We\
    \ only needed to do two things:\n\n+   1. Include the Google Maps V3 API with\
    \ `<script src=\"http://maps.google.com/maps/api/js?sensor=false&v=3.2\"></script>`.\
    \ This lets OpenLayers access the Google Maps API.\n+   2. Set the `type` property,\
    \ such as `type: google.maps.MapTypeId.HYBRID`.\n\nIncluding the Google Maps API\
    \ enables OpenLayers to communicate with the Google Maps backend. Because we included\
    \ the Google Maps API, we can use variables that are part of it. Specifically,\
    \ the possible values for the `type` property come directly from the Google Maps\
    \ API—for example, if we didn't include the API, we could not use `google.maps.MapTypeId.HYBRID`.\n\
    \nNotice that if you run `map.getCenter();` in Firebug, the center point we get\
    \ back has very different coordinates than what we're used to—they aren't longitude/latitude\
    \ values. This is because `sphericalMercator` is set for us automatically, so\
    \ we can easily lay other layers, such as vector layers, on top of the third party\
    \ map layer. Before we cover the reason for this (which is related to the other\
    \ third party mapping APIs) let's go over the Google Map Layer class in more detail.\n\
    \n# Creating a Google Map layer object\n\nThe format to create a Google Map layer\
    \ object is the same for both V2 and V3 of the Google Maps API. The basic format\
    \ for instantiating a Google Maps layer is:\n\n```\nvar google_layer_object =\
    \ new OpenLayers.Layer.Google(\n    'Layer Name',\n    {Properties}\n);\n```\n\
    \nThe first argument, as with most Layer classes, is the layer's **name**. The\
    \ second argument is a **properties** object. There are just a few Google Layer\
    \ specific properties, so let's go over them.\n\n# Google layer properties\n\n\
    Because the Google Layer inherits from the base Layer class, you can use nearly\
    \ any property that the Layer class provides—such as `numZoomLevels` or `maxExtent`.\
    \ We'll cover just the properties that are specific to the Google Maps layer class.\
    \ The possible values for the **type** attribute depend on the version of the\
    \ Google Maps API used."
  merge: -1
  img_proc: true
- pgno: 127
  md: "# sphericalMercator {Boolean}\n\nThis property determines if the map should\
    \ behave as a Mercator-projected map. Setting to true will allow us to use other\
    \ layers, such as the Vector layer, with the actual map projection. Spherical\
    \ Mercator is covered in more depth later in this chapter. When using V3 of the\
    \ Google Map API, this property is automatically set to true. With V2, you will\
    \ have manually set it to true. Example: sphericalMercator: true.\n\n# type {GmapType}\n\
    \nThe type property specifies the Google Map layer type—what layer Google should\
    \ give us. V2 and V3 of the Google Maps API have different possible values. Let’s\
    \ go over Version 3’s values, and then take a look at Version 2’s values.\n\n\
    # V3 GMapType values\n\nThe standard, V3 way to refer to layer types is in the\
    \ form of:\n\n```\nvar google_layer_V3 = new OpenLayers.Layer.Google(\n    'Google\
    \ Maps V3 Layer',\n    {type: google.maps.MapTypeId.TYPE}\n);\n```\n\nTo specify\
    \ the layer type, we can simply change the TYPE property. The possible TYPE values\
    \ can be one of the following:\n\n| Type | Description |\n|------|-------------|\n\
    | google.maps.MapTypeId.ROADMAP | The default value, used if nothing is passed\
    \ in. Shows the default street map (same as G_NORMAL_MAP). |\n| google.maps.MapTypeId.HYBRID\
    \ | Displays a map with a semi-transparent street layer overlaid on satellite\
    \ imagery (same as G_HYBRID_MAP). |\n| google.maps.MapTypeId.SATELLITE | Displays\
    \ satellite imagery (same as G_SATELLITE_MAP). |\n| google.maps.MapTypeId.TERRAIN\
    \ | Displays a map with features such as terrain (same as G_PHYSICAL_MAP). |\n\
    \n![](img/1b8cd151c9f278555f9cf255b20d244e_127_0.png)\n\n> An up-to-date list\
    \ of possible layer types can be found in the Google Maps API documentation at\
    \ http://code.google.com/apis/maps/documentation/javascript/maptypes.html#MapTypes.\n\
    \nAt the time of writing, the non-earth (moon, Mars, and sky) layers were not\
    \ yet available from Google Maps."
  merge: -1
  img_proc: true
- pgno: 128
  md: "# V2 GMapType values\n\nVersion 2 of the Google Maps API provides various layers\
    \ as well. Some of the layer types are even maps of other planets, but no extra\
    \ work is required to view them inside the OpenLayers. To specify the map type\
    \ for V2, use the following:\n\n```\nvar google_layer_V2 = new OpenLayers.Layer.Google(\n\
    \    'Google Maps V2 Layer',\n    {type: TYPE}\n);\n```\n\nThe possible TYPE values\
    \ are the following:\n\n| Type | Description |\n|---|---|\n| G_NORMAL_MAP | The\
    \ default value. This is used if no GMapType is specified. This map type will\
    \ display the normal street map. |\n| G_SATTELITE_MAP | Displays satellite imagery.\
    \ |\n| G_AERIAL_MAP | Displays aerial photography. |\n| G_HYBRID_MAP | Displays\
    \ a map with a semi-transparent street layer overlaid on satellite imagery. |\n\
    | G_AERIAL_HYBRID_MAP | Displays a map with a semi-transparent street layer overlaid\
    \ on aerial imagery. |\n| G_PHYSICAL_MAP | Displays a map with features such as\
    \ terrain. |\n| G_MOON_ELEVATION_MAP | Displays a terrain map of the moon with\
    \ altitude color coded. |\n| G_MOON_VISIBLE_MAP | Displays photography taken from\
    \ orbit around the moon. |\n| G_MARS_ELEVATION_MAP | Displays a terrain map of\
    \ Mars with altitude color coded. |\n| G_MARS_VISIBLE_MAP | Displays photography\
    \ taken from orbit around Mars. |\n| G_MARS_INFRARED_MAP | Displays infrared imagery\
    \ of Mars. Warm areas are bright and cooler areas are dark. |\n| G_SKY_VISIBLE\
    \ | Displays a map of the full celestial sphere. |\n\nTo use any of these layer\
    \ types, simply pass in the type name when creating the layer. Example: type:\
    \ G_NORMAL_MAP.\n\n![](img/1b8cd151c9f278555f9cf255b20d244e_128_0.png)\n\n> The\
    \ previous list was the supported layer types at time of writing, but current\
    \ and up-to-date layer values can be found on the Google Maps V2 API docs at http://code.google.com/apis/maps/documentation/javascript/v2/reference.html#GMapType."
  merge: -1
  img_proc: true
- pgno: 129
  md: "# Time for Action – creating a Google Map layer with V2 (Deprecated)\n\nLet's\
    \ create a map with V2 of the Google Maps API. This is not the proper way to use\
    \ the Google Maps layer, but I am including it because you are likely to come\
    \ across a code that uses V2 of the API. Google Maps V2 also provides a few different\
    \ layer types (like a moon layer) that V3 does not provide at the time of writing.\n\
    \n1. V2 of the Google Maps API requires you to register an API key, so grab one\
    \ (for free) at http://code.google.com/apis/maps/signup.html. If you don't have\
    \ a domain name, use http://localhost.\n\n2. In the <head> section, before the\
    \ OpenLayers script tag, include the following. Replace YOUR_KEY with the key\
    \ generated from Step 1:\n\n```\n<script src='http://maps.google.com/maps?file=api&amp;v=2&amp;key=YOUR_KEY'></script>\n\
    ```\n\n3. Let's create some layers now. The format of the type attribute is slightly\
    \ different with V2. We'll go over the possible layer type values right after\
    \ this example. First, let's create some layers, starting with a 'hybrid' layer.\
    \ The type value for the hybrid layer is G_HYBRID_MAP. We'll also specify 20 zoom\
    \ levels with the numZoomLevels property. Different base layers can support different\
    \ numbers of zoom levels:\n\n```\n//Create Google Map Layer objects\nvar google_hybrid\
    \ = new OpenLayers.Layer.Google(\n  \"Google Hybrid\",\n  {type: G_HYBRID_MAP,\
    \ numZoomLevels: 20}\n);\n```\n\n4. Now let's create a 'physical' layer, which\
    \ is a terrain/topology type of layer. The type is G_PHYSICAL_MAP, and we'll specify\
    \ a different numZoomLevels property:\n\n```\nvar google_physical = new OpenLayers.Layer.Google(\n\
    \  \"Google Physical\",\n  {type: G_PHYSICAL_MAP, numZoomLevels: 22}\n);\n```\n\
    \n5. We'll use the G_SATELLITE_MAP to create a satellite layer:\n\n```\nvar google_satellite\
    \ = new OpenLayers.Layer.Google(\n  \"Google Satellite\",\n  {type: G_SATELLITE_MAP}\n\
    );\n```"
  merge: -1
  img_proc: true
- pgno: 130
  md: "6. If we don't pass in a type, the default 'streets map' layer will be used.\
    \ This is the layer you'll see by default in Google Maps. If you wish to manually\
    \ specify this layer type, it is called G_NORMAL_MAP.\n\n```\nvar google_streets\
    \ = new OpenLayers.Layer.Google(\n  \"Google Streets\",\n  {}\n);\n```\n\n7. Now\
    \ let's add a layer type that is not (at the time of writing) supported by V3\
    \ of the Google Maps API—a layer of Mars:\n\n```\nvar google_mars = new OpenLayers.Layer.Google(\n\
    \  \"Google Mars\",\n  {type: G_MARS_VISIBLE_MAP}\n);\n```\n\n8. Finally we just\
    \ add the layers to the map:\n\n```\nmap.addLayers([google_hybrid,google_physical,google_satellite,\n\
    \  google_streets,google_mars]);\n```\n\n9. Take a look at your map. You should\
    \ see something like this:\n\n![](img/1b8cd151c9f278555f9cf255b20d244e_130_0.png)"
  merge: -1
  img_proc: true
- pgno: 131
  md: '# What Just Happened?


    We just created a map using Google Maps V2 with a few of the possible Google Maps
    layer types. Because we’re using a different version of the API here, you’ll notice
    that our code is slightly different than it was when using the standard (V3) of
    the Google Maps API. Specifically, the `type` property is different because V2
    of the API supports different layer types than Version 3 does.


    # Yahoo! Maps API


    OpenLayers provides us with an easy way to interface with the Yahoo! mapping API
    as well. We work with it similar to how we work with the Google Maps Layer class.
    The official Yahoo! Maps API documentation can be found at http://developer.yahoo.com/maps/.
    Let’s take a look!


    # Time for Action – using the Yahoo! Maps Layer


    Let’s create a map with the Yahoo! Maps Layer class.


    +   1. In the `<head>` section, we need to reference the location of the Yahoo!
    Maps API. Add the following before the OpenLayers inclusion script tag:

    +   ```html

    +   <script src="http://api.maps.yahoo.com/ajaxmap?v=3.0&appid=euzuro-openlayers"></script>

    +   ```

    +   2. Let’s set up some Yahoo! layer objects now. Like the Google Maps Layer,
    we specify the type of the layer we want by setting the `type` property. Let’s
    create a hybrid layer. The `type` property for Yahoo! layers start with `YAHOO_MAP_`,
    followed by a three character code:

    +   ```javascript

    +   var yahoo_hybrid = new OpenLayers.Layer.Yahoo(

    +     "Hybrid",

    +     {type: YAHOO_MAP_HYB, numZoomLevels: 24}

    +   );

    +   ```

    +   3. Now let’s create a satellite layer type. The three character code for satellite
    is `SAT`. We’ll also set a different amount of zoom levels to further illustrate
    how each base layer can have its own amount of zoom levels:

    +   ```javascript

    +   var yahoo_satellite = new OpenLayers.Layer.Yahoo(

    +     "Satellite",

    +     {type: YAHOO_MAP_SAT, numZoomLevels: 20}

    +   );

    +   ```'
  merge: -1
  img_proc: true
- pgno: 132
  md: "4. Let's add a default layer next. If we don't pass a type in, the default\
    \ value will be used, which is YAHOO_MAP_REG—a street-like map.\n\n```\nvar yahoo_street\
    \ = new OpenLayers.Layer.Yahoo(\n  \"Street\",\n  {}\n);\n```\n\n5. Finally we\
    \ just add the layers to the map:\n\n```\nmap.addLayers([yahoo_hybrid, yahoo_satellite,\
    \ yahoo_street]);\n```\n\n6. Open the page. You should see something like the\
    \ following:\n\n![](img/1b8cd151c9f278555f9cf255b20d244e_132_0.png)\n\n# What\
    \ Just Happened?\n\nWe just created a map with a Yahoo! Maps layer. Like the Google\
    \ Maps layer, we need to include a link to the Yahoo! API—but we do not need an\
    \ API key. We included the API with:\n\n```\n<script src=\"http://api.maps.yahoo.com/ajaxymap?v=3.0&appid=euzuro-openlayers\"\
    ></script>\n```\n\nLike the Google Maps API script, this script allows OpenLayers\
    \ to communicate with the Yahoo! Maps API. It also provides us values to use for\
    \ the type property."
  merge: -1
  img_proc: true
- pgno: 133
  md: '# Yahoo! Maps Layer class properties


    Like the Google Maps, our main focus on this layer class will be on the type property.
    Let''s go over the available type values.


    # Yahoo! Maps Layer types


    At the time of writing there were three layer types the Yahoo! Maps API gives
    us access to:


    | Type | Description |

    |---|---|

    | YAHOO_MAP_HYB | Displays a hybrid map consisting of the satellite map overlaid
    with the regular street map. |

    | YAHOO_MAP_SAT | Displays satellite photography. |

    | YAHOO_MAP_REG | Displays a street map. This is the default type value, so if
    type is not passed in this will be used. |


    # Microsoft''s mapping API


    Microsoft provides an interface to their mapping services as well. Their mapping
    service previously was referred to as Virtual Earth, but they have since re-branded
    it as Bing Maps. Hence, in OpenLayers, the Layer Class is called VirtualEarth,
    and we use it the same way we''ve created Google and Yahoo! layers. The official
    Microsoft documentation can be found at http://msdn.microsoft.com/en-us/library/dd877180.aspx.


    # Time for Action – creating a Bing/Virtual Earth Layer


    +   1. Include a reference to the Microsoft Mapping API in your <head> section,
    before the OpenLayers inclusion script:

    +   ```html

    +   <script src="http://ecn.dev.virtualearth.net/mapcontrol/mapcontrol.ashx?v=6.2&mkt=en-us"></script>

    +   ```

    +   2. Let''s set up some layer objects now. We specify the type property like
    in the previous examples. For this layer, the type is prefixed by VEMapStyle.,
    which stands for ''Virtual Earth Map Style''. Let''s create a ''shaded'' layer,
    which in this case is the street/road layer with shaded elevation:

    +   ```javascript

    +   var ve_shaded = new OpenLayers.Layer.VirtualEarth(

    +     "Shaded",

    +     {type: VEMapStyle.Shade}

    +   );

    +   ```'
  merge: -1
  img_proc: true
- pgno: 134
  md: "3. We'll add an aerial (satellite imagery) layer now:\n\n```\nvar ve_aerial\
    \ = new OpenLayers.Layer.VirtualEarth(\n  \"Aerial\",\n  {type: VEMapStyle.Aerial}\n\
    );\n```\n\n4. Now, let's create a default layer. If we don't pass in a type, the\
    \ VEMapStyle.Road layer will be used. It is similar to the shaded layer, but without\
    \ the shading. We'll also use another property called animationEnabled, which\
    \ we'll set to false. By default, this property is set to true and controls whether\
    \ or not a zooming animation will be applied to the layer (this animation is a\
    \ Virtual Earth layer specific property):\n\n```\nvar ve_road = new OpenLayers.Layer.VirtualEarth(\n\
    \  \"Road\",\n  {animationEnabled: false}\n);\n```\n\n5. Let's add a hybrid layer:\n\
    \n```\nvar ve_hybrid = new OpenLayers.Layer.VirtualEarth(\n  \"Hybrid\",\n  {type:\
    \ VEMapStyle.Hybrid}\n);\n```\n\n6. Finally, add the layer objects to the map:\n\
    \n```\nmap.addLayers([ve_shaded, ve_aerial, ve_road, ve_hybrid]);\n```\n\n7. You\
    \ should see something like the following:"
  merge: -1
  img_proc: true
- pgno: 135
  md: '![](img/1b8cd151c9f278555f9cf255b20d244e_135_0.png)


    # What Just Happened?


    We just made a map using the Microsoft Virtual Earth/Bing API. It works similar
    to how the Google and Yahoo! Maps API work—by providing a script tag to the Microsoft
    mapping API. We can communicate with Microsoft''s map server and use different
    type values. Let''s go over the properties, as there is a new one the other third
    party layer classes do not provide.


    # VirtualEarth layer class properties


    Like the previous layers, the type property controls what layers we get back from
    the map server. However, there is a unique animationEnabled property that we can
    use with the VirtualEarth layer. Let''s take a look at it:


    | Property | Data Type | Description |

    |---|---|---|

    | animationEnabled | {Boolean} | This property determines if panning/zooming animations
    should be enabled. By default, the value is true. If it is false, the animations
    will be the same as the other layers'' animations. If you look at the Road layer
    from the previous example, you can see the difference with this property set to
    false. |'
  merge: -1
  img_proc: true
- pgno: 136
  md: "# Possible type values\n\nThe possible values for the `type` property, at the\
    \ time of writing, are the following.\n\n| Type | Description |\n|------|-------------|\n\
    | `VEMapStyle.Shade` | Displays a shaded street/road map, showing elevations.\
    \ |\n| `VEMapStyle.Aerial` | Displays aerial (satellite) imagery. |\n| `VEMapStyle.Road`\
    \ | Displays a road map. |\n| `VEMapStyle.Hybrid` | Displays an aerial layer overlaid\
    \ with a road map. |\n\nLet's cover one more layer type before we start combining\
    \ different layers together—the **OpenStreetMap** Layer.\n\n# OpenStreetMap\n\n\
    OpenStreetMap (or **OSM**) is a free, wiki-style, map of the world driven by user\
    \ contributed content. You are able to use your own OSM tiles or ones provided\
    \ through the OpenStreetMap servers. Unlike the previous third party APIs, there\
    \ is no `type` property to specify for this layer.\n\nSetting up an OpenStreetMap\
    \ service and tiles yourself is not too difficult, but it is outside the scope\
    \ of this book (visit http://wiki.openstreetmap.org/wiki/OpenLayers_Simple_Example\
    \ for more information on this). Accessing OSM with OpenLayers, however, isn't.\n\
    \n![](img/1b8cd151c9f278555f9cf255b20d244e_136_0.png)\n\n> More information about\
    \ OpenStreetMap can be found at http://www.openstreetmap.org/.\n\n# Time for Action\
    \ – creating an OpenStreetMap Layer\n\n+   1. For the OpenStreetMap layer, we\
    \ do not need to include a script; we can access it outside of the box.\n+   2.\
    \ This will be pretty simple. We just need to create an OSM layer object:\n\n\
    ```\nvar osm_layer = new OpenLayers.Layer.OSM(\n    'OpenStreetMap Layer'\n);\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 137
  md: "3. Then, we just add the layer object to the map. Even though we're only passing\
    \ in one layer object, we'll use the addLayers function to keep our code consistent:\n\
    \n```\nmap.addLayers([osm_layer]);\n```\n\n4. You should see something like this:\n\
    \n![](img/1b8cd151c9f278555f9cf255b20d244e_137_0.png)\n\n# What Just Happened?\n\
    \nThe map we just created is showing an OpenStreetMap layer. Unlike the previous\
    \ layers, we did not have to provide an API key or link to OSM specific files—OpenLayers\
    \ knows about it already. Another thing that separates the OpenStreetMap layer\
    \ from the other third party map layers is that the OSM layer has no type property.\n\
    \n# Accessing your own OSM tiles\n\nThe above code uses the publicly available\
    \ OSM tiles, but it is easy to point it at your own tiles. To do so, create the\
    \ layer in this format:\n\n```\nvar osm_layer = new OpenLayers.Layer.OSM(\n  \
    \  'My OSM Layer',\n    'http://URL_TO_TILES/${z}/${x}/${y}.png',\n```"
  merge: -1
  img_proc: true
- pgno: 138
  md: "```\n    {}\n) ;\n```\n\nTo use this, you would replace URL_TO_TILES with the\
    \ server hosting your OSM tiles. The ${z}, ${x}, ${y} are variables which OpenLayers\
    \ will replace with the appropriate values to reference specific map tiles.\n\n\
    # Spherical Mercator\n\nLet's talk about Spherical Mercator. I've made a couple\
    \ of references to it throughout this chapter, but what is it? It is a term used\
    \ to refer to the projection that many commercial, third party mapping APIs use.\
    \ We need to use Spherical Mercator to properly overlay data and layers on top\
    \ of third party map layers.\n\nAll the APIs we've used in this chapter so far\
    \ (Google, Yahoo!, VirtualEarth/Bing, and OSM) are in the Spherical Mercator projection—a\
    \ projection that treats the earth as a sphere (as opposed to an ellipsoid).\n\
    \n# Spherical Mercator—EPSG code\n\nThe official EPSG code for the projection\
    \ is currently EPSG:3857, but when the code was established it was referred to\
    \ as EPSG:900913. This EPSG:900913 code can still be used in OpenLayers, as the\
    \ EPSG:3857 code is identical to it. Google was one of the (if not the) first\
    \ to publish maps with this projection—notice how 900913 resembles 'gOOgIE' (with\
    \ a backwards 'E' for 3).\n\n> You may also see other EPSG codes that represent\
    \ the same Spherical Mercator projection. For example, ArcGIS version 9.3 uses\
    \ the code EPSG:102113, and you may also encounter the standard EPSG:3785. These\
    \ all refer to the same 'Spherical Mercator' projection and can be used interchangeably.\n\
    \nSo, what does this mean for us? Well, when we use these third party APIs, we\
    \ use coordinates that don't look like Lon/Lat coordinates (they are x, y in meters).\
    \ Because the earth is treated as a sphere in the Spherical Mercator projection,\
    \ calculations are affected and data from other sources may not match up perfectly\
    \ with it if we don't re-project our data.\n\nWe need to set up Spherical Mercator\
    \ before we can add in other layer classes and have them line up correctly, so\
    \ let's take a look."
  merge: -1
  img_proc: true
- pgno: 139
  md: "# Time for Action – using Spherical Mercator\n\nLet's set up a map using Spherical\
    \ Mercator with a Yahoo! Maps Layer. When using the Google Maps Layer (V3), the\
    \ sphericalMercator property is set to true automatically, so you do not need\
    \ to do anything extra. However, explicitly specifying it is a good idea when\
    \ working with other layers that are not in the Spherical Mercator projection.\n\
    \n1. Since we'll use the Virtual Earth layer type, we need to make sure to include\
    \ the Microsoft Mapping API:\n\n```\n<script\nsrc=\"http://ecn.dev.virtualearth.net/mapcontrol/mapcontrol.ashx?v=6.2&mkt=en-us\"\
    ></script>\n```\n\n2. The first step is to specify the maxExtent, maxResolution,\
    \ units, and projection properties when creating our map object. If you'll remember\
    \ from the previous chapter, these are the properties we must set when we specify\
    \ a map projection other than the default EPSG:4326 projection. We'll also set\
    \ the displayProjection property to an EPSG:4326 projection object. This displayProjection\
    \ property specifies what projection various controls, such as the MousePosition\
    \ control, display coordinates in. For the EPSG: 900913 projection, (-)128 * 156543.0339\
    \ is the max extent.\n\n```\nmap = new OpenLayers.Map('map_element',{\n    maxExtent:\
    \ new OpenLayers.Bounds(\n        -128 * 156543.0339,\n        -128 * 156543.0339,\n\
    \        128 * 156543.0339,\n        128 * 156543.0339),\n    maxResolution: 156543.0339,\n\
    \    units: 'm',\n    projection: new OpenLayers.Projection('EPSG:900913'),\n\
