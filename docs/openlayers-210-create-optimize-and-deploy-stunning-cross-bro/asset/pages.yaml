- pgno: 141
  md: '# units


    This specifies that the map is in meters. It is a {String} data type.


    ```

    units: ''m'',

    ```


    By default, the units property is set to degrees. Since Spherical Mercator is
    a projection that uses meters, we need to specify it here.


    # projection


    Here we set the map''s projection to be EPSG:900913, i.e., the Spherical Mercator
    projection:


    ```

    projection: new OpenLayers.Projection(''EPSG:900913''),

    ```


    If we wish to work with Longitude/Latitude, or other layer types in a different
    projection, we need to transform the coordinates from EPSG:900913 to the appropriate
    other projection. Once we start to use a third party map API, we''re stuck using
    the Spherical Mercator projection.


    # Using Google Maps and other layers


    Getting other layers to play nicely with these third party layers involve three
    things, two of which we''ve already done:


    +   1. Set up the correct map projection properties.

    +   2. Make sure sphericalMercator is set to true on the third party map layer.

    +   3. Ensure all raster layers (any non-Vector or Image layer), such as WMS,
    are in the map''s projection. In this case, we''ll need to make sure we ask our
    WMS server for map tiles in the EPSG:900913 projection.


    Using what we learned so far, let''s make a mashup. We''ll use a Google Maps layer
    as the base layer, and WMS and Vector layers as overlay layers.'
  merge: -1
  img_proc: true
- pgno: 142
  md: '# Time For Action – creating your first mashup


    Let''s make a map ''mashup'' that consists of a Google Map layer, a WMS layer,
    and a Vector layer.


    +   1. First, we need to add the Google Maps V3 script API tag in the <head> section:

    +   ```html

    +   <script src="http://maps.google.com/maps/api/js?sensor=false&v=3.2"></script>

    +   ```

    +   2. Now, set up your map object with the proper projection info, like in the
    previous example:

    +   ```javascript

    +   map = new OpenLayers.Map(''map_element'', {

    +       maxExtent: new OpenLayers.Bounds(

    +           -128 * 156543.0339,

    +           -128 * 156543.0339,

    +           128 * 156543.0339,

    +           128 * 156543.0339),

    +       maxResolution: 156543.0339,

    +       units: ''m'',

    +       projection: new OpenLayers.Projection(''EPSG:900913''),

    +       displayProjection: new OpenLayers.Projection("EPSG:4326"),

    +   });

    +   ```

    +   3. Now let''s create a Google Maps layer. Because we are using V3 of the API,
    we do not need to specify sphericalMercator: true because it is set to true automatically.

    +   ```javascript

    +   var google_streets = new OpenLayers.Layer.Google(

    +       "Google Streets",

    +       {numZoomLevels: 20}

    +   );

    +   ```

    +   4. We''ll create our WMS layer now and specify that we want the basic and
    various label layers back from the WMS server. We''ll also set the opacity to
    .7, or 70 percent opaque, and set isBaseLayer: false so we''re sure it will be
    an overlay layer. Now, we are not specifying a projection property on the layer
    because our layer will inherit the projection of the map object. All layers (with
    the exception of the Vector layer) should be in the same projection as your map.
    The WMS server we''re using does support the EPSG:900913 projection, so we''ll
    get back proper map tiles. If the WMS service does not support this projection,
    we wouldn''t be able to use it—we''ll talk about this more after the example.
    Go ahead and create the WMS layer:

    +   ```javascript

    +   var wms_layer = new OpenLayers.Layer.WMS(

    +   ```'
