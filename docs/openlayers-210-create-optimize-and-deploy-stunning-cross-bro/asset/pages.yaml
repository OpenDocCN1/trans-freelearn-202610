    +   2. Extract it and copy the proj4js folder to your root code directory (the
    folder where your OpenLayers.js file is located).

    +   3. Add the following line in the <head> section of your code after the OpenLayers
    library inclusion code.

    +   4. Now, open up the page and start Firebug. Type and run the following:

    +   5. You should see output that looks like the following:


    ```

    <script type=''text/javascript'' src="proj4js/lib/proj4js-combined.js"></script>

    ```


    ```

    var test_proj = new Proj4js.Proj(''EPSG:4325'');

    console.log(test_proj);

    ```


    ```

    Object { srsCodeInput="EPSG:4325", more...}

    ```


    # What Just Happened?


    We just included the Proj4js library and tested to see if it worked. If you received
    an error when you attempted to call new Proj4js.Proj() it means that the location
    of the proj4js-combined.js file was wrong. Ensure that the directories are set
    up properly (your example file should be in the same directory as the proj4js
