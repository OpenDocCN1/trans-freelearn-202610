- pgno: 253
  md: '# Vector Layer class


    The Vector Layer, by itself, is a layer like the other layers we''ve discussed
    so far—but to really get the most out of it, we''ll be working with other classes.


    To even get a basic example working (like the first one in this chapter), we make
    use of a few other classes. Specifically, the Vector class makes use of the Feature
    class to show objects on the layer. But for the Feature class to work, it needs
    to use the Geometry class to create geometry objects. Therefore, the actual vector
    objects in your vector layers are Feature objects which are composed of Geometry
    objects—we''ll cover all that soon.


    Before we do that though, let''s cover the Vector Layer class itself. We''ll first
    go over the properties of the Vector class, and then the methods (in a similar
    manner to Chapter 3).


    # OpenLayers.Layer.Vector properties


    Let''s go over the properties that the Vector class contains. Some of them are
    instantiated objects from other classes, which will be covered later in this chapter.


    +   - `drawn: {Boolean}`. Returns `true` or `false` depending on whether the features
    have been drawn or not. You do not set this property when instantiating the vector
    layer object.

    +   - `features: {Array {OpenLayers.Feature.Vector}}`. This is an array of feature
    objects belonging to the vector layer. We saw this in the earlier example—by accessing
    this array, we can find out information about all the objects (features) which
    a vector layer contains. Since this is an array, you can access an individual
    feature by calling `vector_layer.features[X]`, where X is the index of the desired
    feature. We''ll go much more in depth with how to interact with features later
    in the chapter.

    +   - `filter: {OpenLayers.Filter}`. By assigning a filter object to a vector
    layer object, you can (as the name implies) filter out certain data based on the
    properties supplied to the filter object. This is very useful when you want to
    display some, but not all, features from a data source. We will go over this property
    thoroughly in the Filter class section in Chapter 10.

    +   - `isBaseLayer: {Boolean}`. Default value is `false`. Specifies if the layer
    is a base layer or not. You could use a vector layer as a base layer, having an
    entirely vector based map instead of relying on a WMS or Google Maps Layers as
    a base layer.

    +   - `isFixed: {Boolean}`. Default value is `false`. Determines if the vector
    layer will move around when the map is dragged. This can come in handy if, for
    instance, you want to place a marker on your map that always stayed in the center
    of the map (in which case you would set this property to `true`).'
  merge: -1
  img_proc: true
- pgno: 254
  md: '+   - `isVector: {Boolean}`. Returns `true` if the layer is a vector layer.
    You do not set this property when you instantiate the vector layer. This property
    is used primarily to check if an already instantiated layer is a vector layer
    or not. For instance, if you wanted to loop through all the layers on your map
    and determine if a layer was a vector layer or not, you would likely use this
    property.

    +   - `protocol: {OpenLayers.Protocol}`. Specifies a protocol object to use for
    the vector layer. In the section on strategies, protocols, and formats, we talk
    about this in much more depth.

    +   - `renderers: {Array{String}}`. Specifies an array containing strings which
    contain the renderers to use. Each renderer is tried, in order, and if it is not
    supported by the browser, the next one is tried. Earlier in the chapter we went
    over how to use this property.

    +   - `rendererOptions: {Object}`. The renderer will use an anonymous object consisting
    of properties. We won''t talk any more about renderers in this chapter, but the
    properties this object can contain are listed in the OpenLayers docs for each
    renderer class at http://dev.openlayers.org/docs/files/OpenLayers/Renderer-js.html.

    +   - `reportError: {Boolean}`. Default is `true`. This property specifies whether
    or not to report error messages if the renderer fails to load.

    +   - `selectedFeatures: {Array{OpenLayers.Feature.Vector}}`. This property contains
    an array of features the layer contains that are currently selected. Features
    can be selected by, for instance, clicking on a feature. This property is discussed
    more in the section on interacting with features.

    +   - `strategies: {Array{OpenLayers.Strategy}}`. An array of strategy objects.
    Strategies tell the vector layer how to behave, such as clustering features together.
    In the section on strategies, protocols, and formats, we talk about this in much
    more depth.

    +   - `style: {Object}`. Contains style information for the vector layer. Using
    this, we can change the color, size, etc. of features in our vector layer. We
    talk about this in much more detail in Chapter 10.

    +   - `styleMap: {OpenLayers.StyleMap}`. A stylemap object that defines styles
    the vector layer will use. Chapter 10 covers the Style and StyleMap class in detail.

    +   - `unrenderedFeatures: {Object}`. This contains an anonymous object of features
    that failed to render (if any exists). You do not set this property when instantiating
    the vector layer object.'
