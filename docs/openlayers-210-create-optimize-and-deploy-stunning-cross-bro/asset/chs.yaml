  \n## 前言\n\nWeb mapping 是设计、实现、生成和在万维网及其产品上交付地图的过程。OpenLayers 是一个功能强大、由社区驱动、开源的纯\
  \ JavaScript 网络制图库。借助它，你可以轻松使用 WMS、Google Maps 和无数其他地图后端创建自己的网络地图混搭。对 OpenLayers\
  \ 感兴趣吗？本书将帮助你从零开始学习 OpenLayers。\n\n*OpenLayers 2.10 Beginner's Guide* 将以最简单和最高效的方式带你了解\
  \ OpenLayers 库。OpenLayers 的核心组件以详细的方式讲解，并配有示例，结构清晰，方便你日后随时查阅。\n\n本书首先介绍 OpenLayers\
  \ 库，最后指导你开发和部署一个功能齐全的网络地图应用，带你完成每一步。\n\n在整本书中，你将学习 OpenLayers 库的每个组件。你将使用 WMS 等后端服务、Google\
  \ Maps 等第三方 API，甚至从静态图像创建地图。你将从 KML 和 GeoJSON 文件加载数据，创建交互式矢量图层，并自定义地图的行为和外观。\n\n\
  混合位置数据与网络应用的趋势日益增长。*OpenLayers 2.10 Beginner's Guide* 将向你展示如何使用最好的网络制图库创建强大的网络地图。\n\
  \n本书将指导你轻松使用开源 JavaScript 库 OpenLayers 开发强大的网络地图。\n\n\n\n## 本书所需\n\n本书唯一需要的是一台计算机和文本编辑器。你的操作系统自带文本编辑器，任何一种都可以使用，但如果你使用\
  \ Windows，我推荐使用 Notepad++ (http://notepad-plus-plus.org/)，Linux 使用 VI，OSX 使用 Textmate。查看地图需要互联网连接，你还需要一个现代网页浏览器，例如\
  \ Firefox、Google Chrome、Safari 或 Opera。虽然需要现代浏览器才能充分利用该库，OpenLayers 甚至为非标准浏览器提供支持，例如\
  \ Internet Explorer（甚至在一定程度上支持 IE6）。\n\n无需具备地理信息系统（GIS）知识，也不需要丰富的 JavaScript 经验。对\
  \ JavaScript 语法以及 HTML / CSS 有基本了解将极大有助于理解内容，但不是必需的。\n\n## 本书涵盖内容\n\n第 1 章：入门 OpenLayers。本章将介绍\
  \ OpenLayers 及其背后的一些编程概念。内容涵盖如何创建地图，并逐步讲解如何设置代码和配置各种设置。\n\n第 2 章：使用 Firebug 修复错误。本章将介绍\
  \ Firebug 插件的设置，我们将在全书中使用它，以便进行简单调试并更好地理解 OpenLayers 背后的工作原理。\n\n第 3 章：OpenLayers\
  \ 中的“图层”。在这里，我们将介绍 OpenLayers 的核心类之一——Layer 类。我们将讨论什么是“图层”，如何使用图层以及不同的图层类。\n\n第\
  \ 4 章：理解投影。本章将介绍一些基础地理概念以及理解它们如何帮助我们使用 OpenLayers。我们还将介绍投影、它们为何被使用以及如何使用它们。\n\n\
  第 5 章：与第三方 API 交互。本章将重点介绍如何使用不同的第三方 API（如 Google Maps 和 OpenStreetMaps）创建 OpenLayers\
  \ 地图。\n\n第 6 章：控制控件。我们将介绍 OpenLayers 的另一个核心类——Control 类。我们将介绍控件是什么，并讨论各种类型的控件以及如何处理事件。\n\
  \n第 7 章：为控件添加样式。本章将逐步讲解 OpenLayers 如何使用 CSS 来设置控件样式。\n\n第 8 章：探索地图类。本章将讨论 OpenLayers\
  \ 的另一个核心组件——Map 类。我们将学习地图函数及其属性，以及如何在同一页面上设置多个地图。\n\n第 9 章：使用矢量图层。在这里，我们将学习矢量图层是什么以及其工作原理。我们还将介绍如何处理数据，例如\
  \ KML 文件。\n\n第 10 章：矢量图层样式指南。本章将介绍如何设置矢量图层的样式以及如何使用 Rule 和 Filter 类。\n\n第 11 章：创建\
  \ Web 地图应用。本最终章将介绍如何从头构建 Web 地图应用，以及如何使用 OpenLayers 构建文件。\n\n## 本书适合人群\n\n本书适合任何对在网站上使用地图感兴趣的人，从业余爱好者到专业\
  \ Web 开发者。OpenLayers 提供了一套功能强大但易于使用的纯 JavaScript 和 HTML（无需第三方插件）工具包，可快速创建跨浏览器 Web\
  \ 地图。对 JavaScript 有基本了解会有所帮助，但使用本书无需任何先验知识。如果你从未使用过地图，本书将介绍一些常见的地图主题，并温和地引导你学习 OpenLayers\
  \ 库。如果你是有经验的应用开发者，本书也可作为 OpenLayers 核心组件的参考。\n\n## 如何阅读本书\n\n本书主要设计为从头到尾阅读，各章节相互构建，复杂度逐步增加。同时，各章节是模块化的，因此在学习完内容后，每一章也可作为参考。当然，本书最好先通读一遍，然后再作为参考使用。\n\
