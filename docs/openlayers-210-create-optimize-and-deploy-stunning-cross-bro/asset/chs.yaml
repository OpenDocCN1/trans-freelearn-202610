  \ 函数那样调用；通过调用 `layer_object.function_name()`；某些方法需要你传入参数。我们不会介绍基础层类的所有函数，因为有些已弃用、存在于\
  \ Map 类函数列表中，或超出本书范围。\n\n所需的参数（如有）列在参数列下。\n\n| 函数 | 描述/操作 | 参数 | 返回值 |\n|---|---|---|---|\n\
  | `setName( newName )` | 根据传入的字符串为层设置新名称。这也会更新图层切换控件中层的显示名称，并可能触发 changelayer 事件。\
