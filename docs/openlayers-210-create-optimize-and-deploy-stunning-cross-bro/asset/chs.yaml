  \ options 参数，允许你设置层的属性。 | options: {Object} 包含层属性和值的键值对的匿名对象。 | - |\n| redraw()\
  \ | 重绘层。如果层成功重绘则返回 true，如果层无法重绘则返回 false。在向矢量层添加要素时需要调用此方法，我们将在第 9 章介绍。 | - | {Boolean}\
