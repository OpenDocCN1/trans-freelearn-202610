  \ Jesuthas\n\n## 关于作者\n\n**Erik Hazzard** 是一名网页开发者-设计师、开源倡导者和 VI 用户。他喜欢学习、教学，并偶尔在他的网站\
  \ http://vasir.net/ 上写博客。作为一名有五年专业网页开发经验的开发者，Erik 专注于 Python 和 JavaScript，尽可能使用开源软件。当他不开发网络应用程序时，他经常在开发或设计电子游戏。\n\
  \n他在 FREAC（佛罗里达资源与环境分析中心）工作，那是一个拥有优秀团队、从事各种 GIS 和网络开发工作的绝佳地方。\n\n我想感谢 OpenLayers\
