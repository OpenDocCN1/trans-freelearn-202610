  \ Alisen，她的理解以及花时间帮助我确保本书尽可能易于阅读。\n\n## 关于审阅者\n\n**Xurxo Méndez Pérez** 出生于 1983\
  \ 年，出生地是西班牙加利西亚南部的小镇 Ourense。他在那里生活到开始在 A Coruña 大学攻读信息技术学位，该学位于 2008 年完成。\n\n在过去的两年里，他在\
  \ A Coruña 大学的计算机架构组工作，开发 GIS 应用程序（大量使用许多 OGC 标准），例如 Sitegal 和 SIUXFor（基于网络 GIS\
  \ 的应用程序，用于管理加利西亚地区的土地产权并促进其良好利用）、MeteoSIX（一个 GIS 系统，提供加利西亚地区地理定位的观测和预报气象数据访问）等。\n\
  \n他还拥有 3 年以上移动应用程序开发经验，最初使用 JavaME，如今他专注于 Google Android，开发了十多款应用程序，其中一些结合了 GIS\
  \ 和地理定位、实时响应和多用户需求等概念。\n\n**Alan Palazzolo** 在过去五年里一直在构建大大小小的网络应用程序，其中大部分使用开源内容管理系统\
  \ Drupal，并在过程中积累了一些数据可视化和地图方面的经验。他是软件和生活方式中开源方法论的坚定信徒和倡导者。他参与了在双城地区启动 Free Geek\
  \ 分会，并不断尝试使用技术，特别是互联网，来改善那些比大多数人更不幸的人的生活。\n\n**Ian Turton** 是宾夕法尼亚州立大学的地理学研究员。他在近\
  \ 20 年前偶然成为地理学家，到现在还没有逃脱。在此期间，他是 GeoTools 开源 Java 工具包的联合创始人，该工具包现已成为许多地理开源项目的基础。他继续担任该项目的项目指导委员会成员，并提交新代码和补丁。他还在宾夕法尼亚州立大学和利兹大学教授非常受欢迎的课程“开放网络地图”，使用开放标准和开源程序。\n\
