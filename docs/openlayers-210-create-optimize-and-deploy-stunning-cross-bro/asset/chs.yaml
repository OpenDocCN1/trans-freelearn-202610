  \ 5 图表绘制精要\n\nISBN: 978-1-84969-076-8      平装版：380 页\n\n使用 OmniGraffle 以更少的努力创建更好的图表\n\
  \n- 1. 制作高质量、专业外观的图表，其传达信息的能力远胜于文字\n- 2. 让 Macintosh 用户的图表绘制变得有趣且简单\n- 3. 精通用 OmniGraffle\
  \ 阐释想法的艺术\n- 4. 学习绘制引人入胜的图表和图形，以吸引观众对您演示文稿的注意力\n\n请访问 www.PacktPub.com 了解我们的图书信息\n"
