  \ true 使层成为基础层，false 使其成为覆盖层。 | - |\n| `setOpacity( opacity )` | 根据传入的值设置层的不透明度。传入的\
  \ `opacity` 值是一个浮点数，有效范围为 0 到 1，0 表示完全透明，1 表示完全不透明。0.5 表示 50% 透明。 | `opacity:` `{Float}`\
  \ 期望的不透明度值。 | - |\n\n## 勇敢尝试 – 调用一些函数\n\n现在我们已经介绍了本书中将使用的一些 Layer 类函数，请尝试自己调用它们。打开\
  \ Firefox，启用 Firebug，并尝试在层对象上调用上述一些函数（通过 `map.layers` 数组或全局层对象本身访问层对象）。再次提醒，不要害怕尝试或破坏东西！\n\
  \n## 总结\n\n本章我们讨论了 Layer 类。我们介绍了层的概念以及基础层和覆盖层之间的区别。我们深入探讨了 WMS Layer 类。我们讨论了 Layer\
  \ 类的属性和方法，并介绍了各种层子类。\n\n呼！这可能信息量很大。我们单独介绍了许多 Layer 类，但尚未使用不同类型的 Layer 类制作地图。这是 OpenLayers\
  \ 擅长的一项功能，也是地图“拼贴”驱动因素。不过，要了解如何将不同层类组合在一起，我们需要对投影有一个基本了解——这是下一章的主题。\n\n# 4\n\n#\
  \ 理解投影\n\n当你看地图时，你看到的是一个三维物体（地球）的二维表示。因为我们在创建地图时本质上“丢失”了一个维度，所以没有地图能完美地表示地球。所有地图都有一些失真。\n\
  \n失真取决于你使用的投影（将地球表面表示在二维平面上的方法）。在本章中，我们将更详细地讨论投影是什么、为什么重要以及如何在 OpenLayers 中使用它们。我们还将介绍一些其他基本地理原理，以帮助更好地理解\
  \ OpenLayers。\n\n本章将介绍：\n\n- 地图投影的概念\n- 投影类型\n- 经度、纬度和其他地理概念\n- OpenLayers 投影类\n\
  - 坐标转换\n\n开始吧！\n\n\n\n## 地图投影\n\n没有任何地球地图是真正完美的再现；所有地图都有某种失真。其原因在于它们试图将三维物体（椭球体：地球）表示在二维中（平面：地图本身）。\n\
  \n**投影**是三维球体整个表面或部分表面在二维平面（或其他类型几何体）上的表示。\n\n### 为什么要使用投影？\n\n每张地图都有某种投影——这是地图固有的属性。想象剥开一个橘子然后把果皮摊平。会产生某种失真，如果你试图将果皮完全放入正方形或矩形（像一张平坦的二维地图）中，你会非常困难。\n\
  \n为了让果皮完美地贴合在平坦的正方形或矩形上，你可以尝试拉伸果皮的某些部分或剪掉果皮的一些碎片并重新排列它们。在尝试创建地图时也适用同样的想法。\n\n实际上存在无限多种可能的地图投影；有无限多种方法可以将三维表面表示为二维，但没有一种是完全无失真的。\n\
  \n那么，既然有这么多不同的地图投影，我们如何决定使用哪一种？有没有最好的？答案是否定的。使用的“最佳”投影取决于你使用地图的上下文、你正在查看的内容以及你希望保留的特征。\n\
  \n### 投影特征\n\n由于二维表示并非没有失真，每个投影都在某些特征之间做出权衡。而且当我们将地球投影到地图上时，我们会失去一个维度，因此我们必须在想要保留的特征之间做出某种权衡。有许多特征，但现在让我们关注其中三个。\n\
  \n### 面积\n\n面积指的是地图上要素的大小。保留面积的投影被称为等面积投影（也称为等积、等价或同形投影）。如果例如在地图不同位置测量的一英寸覆盖相同的实际面积，则投影保留面积。因为面积保持不变，**角度**、**比例尺**和**形状**会失真。这就是等面积投影地图可能的样子：\n\
  \n![](img/1b8cd151c9f278555f9cf255b20d244e_109_0.png)\n\n### 比例尺\n\n比例尺是地图距离与实际距离的比率（例如，地图上一厘米可能等于实际一百米）。所有地图投影在地图的某些区域都会错误地显示比例尺；没有地图能在整个地图上显示相同的比例尺。然而，地图上有些部分比例尺保持正确——这些位置的放置可以减轻其他地方的比例尺误差。比例尺的变形还取决于被测绘的区域。如果投影在地图上某一点与每一点之间都保持真实比例尺，则称为**等距**投影。\n\
  \n### 形状\n\n保留形状的地图被称为**保角**或**正形**。形状意味着地图上各点之间的相对角度是正确的。显示整个地球的大多数地图都是保角的，例如墨卡托投影（由\
  \ Google Earth 和其他常见网络地图使用）。根据具体投影，地图各处的面积通常会失真，但在某些地方可能正确。保角的地图不能同时是等面积的。我们迄今为止使用的地图都是保角的。\n\
  \n### 其他特征\n\n投影还有许多其他特征，例如方位、距离和方向。这里需要记住的关键概念是，所有投影都在以牺牲其他特征为代价保留某些特征。例如，保留形状的地图不能完全保留面积。\n\
  \n没有“完美”的地图投影。投影的实用性取决于地图的使用上下文。特定投影可能在某些任务中表现出色，例如导航，但在其他用途中可能是不好的选择。\n\n## 投影类型\n\
  \n投影是用二维表面表示三维的一种方式。投影被投影到某些几何表面，最常见的三种是**平面**、**圆锥**或**圆柱**。\n\n想象一个圆柱体包裹在地球周围，其圆周的中心触及赤道。现在，地球被投影到该圆柱体的表面上，如果你将圆柱体从上到下垂直切开并展开，平铺开来，你就会得到一个常规的圆柱投影：\n\
  \n![](img/1b8cd151c9f278555f9cf255b20d244e_110_0.png)\n\n**墨卡托**投影是一种投影类型。如果你以前从未使用过投影，很可能你看到的大多数地图都采用这种投影。\n\
  \n由于其特性，在两极附近存在严重的失真。看前面的截图，你可以看到单元格逐渐变大，越接近北极和南极。对于例如，格陵兰看起来比南美洲大，但实际上它大约相当于墨西哥的大小。如果地图中面积失真很重要，你可以考虑使用我们之前提到的**等面积**投影。\n\
  \n> 有关投影的更多信息可以在**美国地质调查局（US Geological Survey）**网站 http://egsc.usgs.gov/isb/pubs/MapProjections/projections.html\
  \ 上找到。\n\n## EPSG 代码\n\n正如我们提到的，实际上存在无限多种可能的投影。因此，建立一个 universally agreed upon 分类系统来跟踪投影信息是有意义的。有许多不同的分类系统，但\
  \ OpenLayers 使用 **EPSG** 代码。EPSG 指的是欧洲石油勘探集团，一个从事石油勘探的科学组织，该组织在 2005 年被 OGP（**国际石油天然气生产商协会**）接管。\n\
  \n对于 OpenLayers 来说，EPSG 代码被称为：\n\n```\nEPSG:4326\n```\n\nEPSG: 之后的数字（本例中为 4326）指的是投影识别号。该投影\
  \ EPSG:4326 是 OpenLayers 使用的默认投影。它一直是我们迄今为止所有示例中使用的投影，并使用熟悉的经度/纬度坐标系统，坐标范围为 -180°\
  \ 至 180°（经度）和 -90° 至 90°（纬度）。\n\n## 动手实践 – 使用不同的投影代码\n\n让我们使用不同的投影创建一个基本地图。\n\n\
  - 1. 使用模板代码，按以下方式重新创建你的地图对象。我们将指定 `projection` 属性，以及 `maxExtent`、`maxResolution`\
  \ 和 `units` 属性。如果我们使用非默认投影，我们需要告诉 OpenLayers 使用的坐标类型，设置 `maxExtent` 就是一种方法。我们将要使用的投影是\
  \ `EPSG:900913`，这是一种由 Google Maps 和其他第三方 API 使用的投影。\n```javascript\nmap = new OpenLayers.Map('map_element',\
  \ {\n  projection: 'EPSG:900913',\n  maxExtent: new OpenLayers.Bounds(-20037508,\
  \ -20037508,\n    20037508, 20037508.34),\n  maxResolution: 156543.0339,\n  units:\
  \ 'm'\n});\n```\n- 2. 保存文件，我们将其称为 `chapter4_ex1.html`。\n- 3. 你应该会看到类似以下内容：\n\n![](img/1b8cd151c9f278555f9cf255b20d244e_112_0.png)\n\
  \n## 发生了什么？\n\n我们刚刚创建了一个投影为 `EPSG:900913` 的地图。你会注意到它看起来与我们迄今为止制作的地图大不相同。这是因为它采用了不同的投影。\n\
  \n## 指定不同的投影\n\nOpenLayers 支持任何投影，但如果你想使用除 `EPSG:4326` 之外的投影，必须指定以下三个选项：\n\n- **maxExtent**:\
  \ 默认值是 `-180,-90,180,90`\n- **maxResolution**: 默认值是 `1.40625`\n- **projection**:\
  \ 默认值是 `EPSG:4326`\n\n\n\n如果未指定这些选项，则使用默认值（迄今为止所有其他地图都使用默认值）。你还应指定 units 属性，就像我们使用\
  \ units: 'm' 一样，具体取决于你的投影使用的单位。\n\n你必须指定这些属性的原因是不同的投影使用不同的坐标。在上面的示例中，我们将 maxExtent\
  \ 设置为：\n\n```\nmaxExtent: new OpenLayers.Bounds(-20037508, -20037508,\n    20037508,\
  \ 20037508.34)\n```\n\n这些值与默认值相差很大——它们不是经度和纬度值。相反，它们使用 x/y 坐标系统，对于 OpenLayers 而言，经度是\
  \ x 值，纬度是 y 值。\n\n## 小测验 – 投影\n\n给出一些你可能想要使用 EPSG:4326 以外的投影的原因。哪些区域不适合显示 EPSG:4326\
  \ 投影？\n\n## 经度/纬度\n\n经度和纬度是大多数人都熟悉的两个术语，即使他们地理知识有限或对两者感到困惑。让我们先看一下下面的截图，然后再介绍这两个术语。\n\
  \n![](img/1b8cd151c9f278555f9cf255b20d244e_113_0.png)\n\n### 纬度\n\n纬线是与赤道平行的假想线，也恰当地称为“纬线”。纬度分为\
  \ 90 个“度”，或 90 个空间（或单元），位于赤道上方和下方。-90° 是南极，0° 是赤道，90° 是北极。\n\n每个空间或单元（例如从 42° 到\
  \ 43°）进一步细分为 60 分，每分钟细分为 60 秒。分钟和秒的术语与时间关系不大。在制图上下文中，它们只是用于精度的术语。纬度一度 的大小是恒定的。因为它们测量“南北”，所以\
  \ OpenLayers 将 y 坐标视为纬度。\n\n### 经度\n\n经线与纬线垂直。所有经线，也称为子午线，在北极和南极相交，并且与纬度不同，每条经线的长度相同。经度分为\
  \ 360 个“度”，或空间。与纬度类似，每个空间也分为 60 分，每分钟分为 60 秒。\n\n随着经线之间的空间变小，越接近两极，经度一度的大小就会发生变化。越接近两极，绕地球行走所需的时间就越短。\n\
  \n对于纬度，使用赤道作为 0° 是有意义的，但对于经度，没有一个地方比另一个地方更适合作为 0° 标记的起点。因此，虽然这个位置实际上是任意的，但今天英国格林威治天文台被普遍认为是\
  \ 0° 经度。因为经度测量东西，所以 OpenLayers 将 x 坐标视为经度。\n\n### 动手时间 – 确定 LonLat 坐标\n\n让我们看一下来自我们之前地图的几个坐标示例。\n\
  \n- 1. 打开第 1 章的最终示例。\n- 2. 在任何方向平移地图。然后，在 Firebug 中输入：\n`map.getCenter();`\n- 3.\
  \ 根据你平移的位置，输出应类似于：\n`lon=-72.8125, lat=19.6875`\n- 4. 现在，打开本章开头的示例。\n- 5. 平移地图，然后在\
  \ Firebug 中输入：\n`map.getCenter();`\n\n6. 你应该看到类似的内容：\n\n```\nlon=-9397474.0038099,lat=3595597.9798909\n\
  ```\n\n## 发生了什么？\n\n我们刚刚查看了两个具有不同投影的地图中地图中心的经度和纬度值。当我们调用 map.getCenter() 时，我们会得到一个\
  \ OpenLayers LonLat 对象。\n\n在第一张地图中，地图的最大范围经度在 -180° 到 180° 之间，纬度在 -90° 到 90° 之间。这些是\
  \ EPSG:4326 使用的值，它是一种经度/纬度类型的坐标系统。第二张地图中经度和纬度的值发生变化，因为它们不在同一投影中（它们使用的是 EPSG:900913）。\n\
  \n## OpenLayers 投影类\n\n到目前为止，我们一直在讨论投影的抽象概念。让我们深入了解 OpenLayers 的 Projection 类 OpenLayers.Projection，这就是我们实际处理投影时使用的类。Projection\
  \ 类依赖于一个名为 Proj4js 的外部库，可以在 http://proj4js.org 找到。首先，我们将讨论在没有 proj4js 库的情况下可以做什么，然后讨论使用它可以做什么。\n\
  \n### 创建投影对象\n\n要实例化 Projection 类的对象，代码如下所示：\n\n```\nmy_proj = new OpenLayers.Projection('EPSG:4326',\
  \ {});\n```\n\n### 参数\n\n让我们看一下 Projection 类的参数。\n\n- **projectionCode: {String}**:\
  \ 用于标识投影的众所周知的标识符（WKID）的字符串，例如形式为 `EPSG:4326` 的 EPSG 代码。\n- **options: {Object}**:\
  \ 一个可选对象。对于实例化投影对象，通常会省略它。\n\n在创建地图并指定 projection 属性时，你可以传入一个投影对象（如上面创建的），也可以传入包含投影代码的字符串。此字符串，例如\
  \ EPSG:4326，也称为 SRS 代码。当传入代码时，就像我们在迄今为止的所有示例中所做的那样，OpenLayers 会自动将其转换为投影对象。\n\n\
  ### 函数\n\nProjection 类有许多方法，包括：\n\n| 函数 | 描述 | 参数 |\n|---|---|---|\n| getCode()\
  \ | 返回包含投影代码的 `{String}`，例如 'EPSG:4326' | - |\n| getUnits() | 返回投影的单位字符串 `{String}`，例如\
  \ 'degrees'。如果页面上未包含 Proj4js 库，则返回 null。 | - |\n| addTransform(from, to, method)\
  \ | 定义两个投影之间的自定义转换函数。通常不需要此操作，特别是如果你使用 Proj4js，除非你需要定义自定义投影转换。 | from: `{String}`\
  \ 源投影代码\nto: `{String}` 目标投影代码\nmethod: `{Function}` 一个将源点转换到目标点的函数，保持原始点不变。 |\n\
  | transform(point, source, destination) | 调用此函数会将传入的点从传入的源投影转换到传入的目标投影。你也可以传入一个\
  \ `{Object}`，只要它包含 x 和 y 属性。此函数会就地转换点，意味着你传入的点将被转换。如果需要点的副本，应在调用 transform() 之前先通过调用点的\
  \ clone() 方法克隆它。 | point: `{Geometry.Point}` 来自 OpenLayers.Geometry.Point 类的对象，包含\
  \ x 和 y 坐标\nsource: `{OpenLayers.Projection}` 源投影的投影对象\ndestination: `{OpenLayers.Projection}`\
  \ 目标地图投影的投影对象。 |\n\n## 投影转换\n\n转换点意味着你将一个投影中的坐标转换为另一个投影的坐标。除了 EPSG:4326 到 EPSG:900913\
  \ 及其反向转换之外，OpenLayers 不提供开箱即用的其他投影转换支持——要转换其他投影，你需要包含 Proj4js（可在 http://proj4js.org/\
  \ 找到）。\n\n在大多数情况下，处理投影转换是后端地图服务器的工作，但在客户端进行转换通常很有用或更快（例如矢量图层坐标转换的情况）。让我们看看如何使用 OpenLayers\
  \ 将 EPSG:4326 转换为 EPSG:900913。\n\n### 动手时间 – 坐标转换\n\n对于此示例不需要 Proj4js，因为在这两个投影之间转换无需\
  \ Proj4js 即可实现。\n\n- 1. 在 Firefox 中打开上一个示例。我们不会修改任何代码，因此包含 OpenLayers 库的任何页面都可以。\n\
  - 2. 打开 Firebug。在控制台中创建两个投影对象：\n```\nvar proj_4326 = new OpenLayers.Projection('EPSG:4326');\n\
  var proj_900913 = new OpenLayers.Projection('EPSG:900913');\n```\n- 3. 现在让我们创建一个\
  \ LonLat 对象，其中将包含 EPSG:4326 坐标的点。\n```\nvar point_to_transform = new OpenLayers.LonLat(-79,\
  \ 42);\n```\n- 4. 现在让我们转换它。我们将从 EPSG:4326（我们的源 proj_4326 投影对象）转换到 EPSG:900913（我们的目标\
  \ proj_900913 投影对象）：\n```\npoint_to_transform.transform(proj_4326, proj_900913);\n\
  ```\n- 5. 最后，我们将打印新值：\n```\nconsole.log(point_to_transform);\nconsole.log(point_to_transform.lon,\
  \ point_to_transform.lat)\n```\n- 6. 你的输出应类似于：\n```\nlon=-8794239.7714444,lat=5160979.4433314\
  \ { lon=-8794239.7714444, more...}\n-8794239.7714444 5160979.4433314\n```\n\n\n\n\
  ## 发生了什么？\n\n我们刚刚将 EPSG:4326 投影中的一个点转换到 EPSG:900913 投影中的一个点。让我们更仔细地查看我们在 point_to_transform\
  \ 对象上调用的 transform 方法。\n\n```\npoint_to_transform.transform(proj_4326, proj_900913);\n\
  ```\n\n这将把原始点从 proj_4326 投影转换到 proj_900913 投影。注意，我们调用的不是投影对象的 transform() 函数，而是\
  \ LonLat 对象的 transform() 函数。OpenLayers.LonLat 对象的 transform() 函数定义如下：\n\n| 函数 |\
  \ 描述 | 参数 |\n|---|---|---|\n| `transform(source, dest)` | 此函数原地转换一个点，意味着原始点将被转换；因此原始值将丢失。如果需要它的副本，请先使用\
  \ `.clone()` 方法。它返回自身。 | `source`: 源投影<br>`dest`: 目标投影。 |\n\n在这种情况下，我们的源投影为 EPSG:4326，目标投影为\
  \ EPSG:900913。需要注意的是，如果不包含 Proj4js 库，使用 OpenLayers 只能对 EPSG:4326 和 EPSG:900913 这两种投影进行转换。\n\
  \n> 当创建地图时，你的所有栅格图层（基于图像的图层；几乎所有除矢量和图像图层之外的图层）必须与地图使用相同的投影。你可以使用坐标和矢量图层进行投影转换，但一旦\
  \ OpenLayers 从地图服务器获取到图像，它就无法自行重投影图像（这是地图服务器需要做的事）。\n\n## Proj4js 库\n\nProj4js 库允许你将坐标从一个坐标系统转换到另一个坐标系统。Proj4js\
  \ 网站位于 http://proj4js.org。只需在页面上包含 Proj4js 库（就像你使用 OpenLayers 一样），你就可以在 OpenLayers\
  \ 中进行更多转换。并非所有 EPSG 代码都受支持，但有很多，如果你的目标代码不受支持，你可以为其添加投影定义。\n\n> 网站 http://spatialreference.org\
  \ 包含大多数 EPSG 代码的 Proj4js 定义。\n\n理想情况下，你应该在整个地图中使用相同的投影，但在某些情况下，你可能希望以不同的投影显示坐标——例如使用矢量图层。让我们看看如何设置\
  \ Proj4js 库。\n\n## 动手实践 – 设置 Proj4js.org\n\n这一步与我们设置 OpenLayers 的方式类似。\n\n- 1. 从\
  \ http://trac.osgeo.org/proj4js/wiki/Download 下载 Proj4js。截至撰写时，最新版本为 proj4js-1.0.1.zip，所以请继续下载（或下载最新版本）。\n\
  - 2. 解压它并将 proj4js 文件夹复制到你的根代码目录（即存放 OpenLayers.js 文件的文件夹）。\n- 3. 在代码的 <head> 部分，在\
  \ OpenLayers 库包含代码之后添加以下行。\n- 4. 现在，打开页面并启动 Firebug。输入并运行以下内容：\n- 5. 你应该会看到如下输出：\n\
  \n```\n<script type='text/javascript' src=\"proj4js/lib/proj4js-combined.js\"></script>\n\
  ```\n\n```\nvar test_proj = new Proj4js.Proj('EPSG:4325');\nconsole.log(test_proj);\n\
  ```\n\n```\nObject { srsCodeInput=\"EPSG:4325\", more...}\n```\n\n## 发生了什么？\n\n\
  我们刚刚包含了 Proj4js 库并测试它是否正常工作。如果你在尝试调用 new Proj4js.Proj() 时收到错误，这意味着 proj4js-combined.js\
  \ 文件的位置错误。请确保目录设置正确（你的示例文件应与 proj4js 文件夹在同一目录中，而 proj4js 文件夹内应包含许多文件和文件夹，包括包含 proj4js-combined.js\
  \ 文件的 lib 文件夹）。\n\n## 定义自定义投影\n\n现在 Proj4js 库已包含，你可以像在前一个示例中那样使用更多投影进行转换。并非所有投影都已定义；不过，你可以自行定义，例如：\n\
  \n```\nProj4js.defs[\"EPSG:27563\"] = \"+title=LAMB sud france +proj=lcc\n+lat_1=44.1\
  \ +lat_0=44.1 +lon_0=0 +k_0=0.999877499 +x_0=600000\n+y_0=200000 +a=6378249.2 +b=6356515\
  \ +towgs84=-168,-60,320,0,0,0,0\n+pm=paris +units=m\";\n```\n\n之后，你就可以像使用之前的示例中的\
  \ EPSG:4326 和 EPSG:900913 一样使用 EPSG:27563 进行投影转换。\n\n有一些已经定义的投影，你可以在 http://proj4js.org\
  \ 上更广泛地查看它们。更完整的列表（包含几乎任何 EPSG 代码的 Proj4js 定义）可以在 http://spatialreference.org/ 上找到。\n\
  \n## 总结\n\n在本章中，我们讨论了投影。我们介绍了它们是什么以及各种不同类型的投影。经度、纬度和其他地理概念也被讨论过。虽然我们只是触及了这些相当复杂主题的表面，但你应该拥有足够的基础信息来理解如何使用投影。\n\
  \n我们还讨论了 Projection 类，以及如何转换坐标和使用 Proj4js 库。你经常会处理 EPSG:4326 以外的坐标系统中的数据，了解如何在其他投影中工作和转换数据非常重要。\n\
  \n在下一章中，我们将看看 Google Maps 和其他第三方 API，并将我们最近获得的关于投影的知识付诸实践。\n\n# 5\n\n# 与第三方 API\
  \ 交互\n\n*网络地图今天非常流行，并且日益流行。在 Google Maps 推出后，出现了交互式网络地图的爆炸式增长。Google 提供了用于与其地图服务交互的\
  \ API，其他公司现在也提供了类似的 API，而 OpenLayers 与其中大多数都能很好地配合使用。我们不仅可以将这些第三方 API 与 OpenLayers\
  \ 一起使用，还可以在其上“mashup”其他图层。*\n\n在本章中，我们将学习：\n\n- 第三方地图 API 的概念\n- 使用第三方 API 的图层类：Google、Microsoft\
  \ 和 Yahoo！\n- 如何使用 OpenStreetMap\n- 使用球面墨卡托投影\n- 组合不同的图层类\n\n## 第三方地图 API\n\n基于网络的地图今天已司空见惯。网络地图爆炸式增长的催化剂是\
  \ Google Maps 的推出。在此之前网络地图就已存在，但它们并不快速也不利于开发者。2005 年 6 月，Google 发布了 Google Maps\
  \ 的 API，该 API 提供了前端客户端（OpenLayers 所扮演的角色）以及对后端地图服务器的访问。\n\n这使得任何人不仅可以在其网站上插入 Google\
  \ 地图，还可以添加自己的点数据并以其他方式操作地图。Google Maps 越来越受欢迎，其他公司，如 Microsoft 和 Yahoo！，纷纷效仿，创建了自己的网络地图\
  \ API。\n\n## 地图 Mashup\n\n术语 **mashup** 指的是将各种不同的数据源和功能组合在一起的应用程序。**map mashup**\
  \ 是将不同图层和数据组合在一起的地图。第三方地图 API，如 Google 和 Yahoo！ Maps，使得人们更容易创建这些“map mashups”。例如，一个以\
  \ Google Maps 为底图并叠加标记以追踪你去过的地方的地图可以被视为一个地图 mashup。\n\nOpenLayers 并未引入地图 mashup，但它能让我们轻松创建非常强大的\
  \ mashup。使用 OpenLayers 将 Google 的地图图层、WMS 图层和矢量图层组合起来非常简单。\n\n## OpenLayers 与第三方\
  \ API\n\nOpenLayers 允许你在地图应用程序中使用第三方地图 API，让你可以在自己的地图中使用它们的地图。主要限制是，截至撰写时，第三方 API\
  \ 地图必须是底图层（但正如我们之前讨论的，你可以使用任意多个底图层）。\n\nOpenLayers 可以通信的三个大型商业地图 API 是 **Google\
  \ Maps**、**Yahoo! Maps** 和 **Bing (Microsoft) Maps**。还有另一个免费开源的 API，OpenLayers 与其配合良好（并且以与前三个类似的方式工作），称为\
  \ **OpenStreetMap**。\n\n我们首先将逐一查看这四个图层类，然后再介绍如何将它们与其他图层类组合。\n\n## Google Maps\n\n\
  Google Maps 背后的软件由客户端和服务器组成。客户端是你访问 `http://maps.google.com` 时使用的，它与 Google Maps\
  \ 后端服务器通信。Google 提供了让你使用其客户端和后端服务器的 API，但由于我们使用 OpenLayers 作为客户端，我们只对与 Google 的后端地图服务器交互感兴趣。\n\
  \n> 根据你计划如何使用 Google Maps，可能存在法律限制。完整限制可在 `http://code.google.com/apis/maps/terms.html`\
  \ 和 `http://www.google.com/intl/en_ALL/help/legalnotices_maps.html` 找到。\n\n\n\n\
  在之前的章节中，我们使用 Google Maps API 的版本 3（V3）设置了 Google 层。由于 Google Maps 会更新其 API，OpenLayers\
  \ 也必须进行更新以适应所做的任何更改。基于本书的 OpenLayers 2.10 之前的版本使用 Google Maps API 的版本 2（V2）。然而 Google\
  \ Maps V2 的使用已被弃用，因此我们将重点关注使用 V3。从我们的角度来看，我们的代码变化不大——OpenLayers 在幕后为我们处理所有特定版本的功能。\n\
  \n然而，你很可能会遇到使用 Google Maps 版本 2 创建的旧版 OpenLayers 地图，因此我们将介绍如何同时使用 V2 和 V3。再次提醒，请在创建新地图时仅使用\
  \ V3，因为 V2 最终将不再受支持。\n\n## Google Maps 版本 2 与版本 3 之间的差异\n\n从 Google Maps V3 切换到\
  \ V2（或反之）时，实际上只有三件事需要做不同：\n\n- 1. 你添加以引用 Google Maps 库的 script 标签不同。使用 Google Maps\
  \ API V3 时无需提供 API 密钥。\n- 2. `type` 属性中使用的图层名称不同。例如，V3 中的 'terrain' 图层定义为 `type:\
  \ google.maps.MapTypeId.TERRAIN`，而在 V2 中则是 `type: G_PHYSICAL_MAP`。\n- 3. 图层使用球面墨卡托配置（我们稍后会介绍其含义）。\n\
  \n> 建议你使用 Google Maps API V3。官方 Google Maps V3 文档可在 http://code.google.com/apis/maps/documentation/javascript/\
  \ 找到。\n> \n> 官方 Google Maps API V2 文档可在 http://code.google.com/apis/maps/documentation/javascript/v2/reference.html\
  \ 找到。\n\n## 动手实践 – 使用 Google Maps V3（标准方式）\n\n让我们使用 Google Maps API V3 创建一个地图。我们已在第\
  \ 3 章中完成过此操作，因此你应该对此有所了解。这是使用 Google Maps 层的标准方式，除非你特别需要 V3 尚未支持的 V2 中的图层类型，否则应使用此方法。\n\
  \n> 在 OpenLayers 2.10 之前的版本中，访问 Google Maps V3 可能无法工作。\n\n1. Google Maps API 版本\
  \ 3 不需要 API 密钥。然而，你仍必须在 <head> 部分包含以下内容，以便 OpenLayers 知道在哪里查找 Google Maps API 库。我们将请求地图的\
  \ API 并指定我们想要 Google Maps API 的 v3.2 版本（如果你希望 Google Maps 自动为你提供最新版本，可以保留 &v=3.2\
  \ 参数）。在包含 OpenLayers 的脚本之前添加此内容：\n\n```\n<script\nsrc=\"http://maps.google.com/maps/api/js?sensor=false&v=3.2\"\
  ></script>\n```\n\n2. 让我们开始为地图添加一个混合图层。type 属性的形式为 google.maps.MapTypeId.TYPE，其中本例中的\
  \ TYPE 为 HYBRID：\n\n```\nvar google_hybrid = new OpenLayers.Layer.Google(\n    \"\
  Google Hybrid\",\n    {type: google.maps.MapTypeId.HYBRID}\n);\n```\n\n3. 现在我们将添加一个物理（地形类型）图层：\n\
  \n```\nvar google_physical = new OpenLayers.Layer.Google(\n    \"Google Physical\"\
  ,\n    {type: google.maps.MapTypeId.TERRAIN}\n);\n```\n\n4. 添加卫星图层类型：\n\n```\nvar\
  \ google_satellite = new OpenLayers.Layer.Google(\n    \"Google Satellite\",\n \
  \   {type: google.maps.MapTypeId.SATELLITE}\n);\n```\n\n5. 现在，我们将创建一个街道图层。如果未传入图层类型，则默认使用街道图层。如果你希望手动指定类型，街道地图类型为\
  \ google.maps.MapTypeId.ROADMAP。\n\n```\nvar google_streets = new OpenLayers.Layer.Google(\n\
  \    \"Google Streets\",\n    {\n});\n```\n\n6. 我们将把图层添加到地图：\n\n```\nmap.addLayers([google_hybrid,google_physical,google_satellite,\n\
  \    google_streets]);\n```\n\n7. 最后，添加一个图层切换控件。你还会注意到，我们添加到地图上的所有图层都是基础图层。默认情况下，第三方地图\
  \ API 图层作为基础图层。\n\n```\nmap.addControl(new OpenLayers.Control.LayerSwitcher());\n\
  ```\n\n8. 打开页面。你应该会看到类似这样的内容：\n\n![](img/1b8cd151c9f278555f9cf255b20d244e_125_0.png)\n\
  \n## 发生了什么？\n\n我们刚刚使用 Google Maps API V3 创建了一个地图。我们只需要做两件事：\n\n- 1. 包含 Google Maps\
  \ V3 API `<script src=\"http://maps.google.com/maps/api/js?sensor=false&v=3.2\"\
  ></script>`。这让 OpenLayers 可以访问 Google Maps API。\n- 2. 设置 `type` 属性，例如 `type: google.maps.MapTypeId.HYBRID`。\n\
  \n包含 Google Maps API 使 OpenLayers 能够与 Google Maps 后端通信。由于我们包含了 Google Maps API，我们可以使用其中的变量。具体来说，`type`\
  \ 属性的可能值直接来自 Google Maps API——例如，如果我们未包含 API，就无法使用 `google.maps.MapTypeId.HYBRID`。\n\
  \n请注意，如果你在 Firebug 中运行 `map.getCenter();`，返回的中心点坐标与我们习惯的非常不同——它们不是经度/纬度值。这是因为 `sphericalMercator`\
  \ 已自动为我们设置，因此我们可以轻松地将其他图层（如矢量图层）叠加在第三方地图图层之上。在我们介绍其原因（这与其它第三方地图 API 相关）之前，让我们更详细地介绍\
  \ Google Maps 层类。\n\n## 创建 Google Maps 层对象\n\n创建 Google Maps 层对象的格式对于 Google Maps\
  \ API 的 V2 和 V3 都是相同的。实例化 Google Maps 层的基本格式为：\n\n```\nvar google_layer_object =\
  \ new OpenLayers.Layer.Google(\n    'Layer Name',\n    {Properties}\n);\n```\n\n\
  第一个参数，与大多数 Layer 类一样，是图层的 **name**。第二个参数是一个 **properties** 对象。只有少数几个特定于 Google 层的属性，让我们来介绍一下。\n\
  \n## Google 层属性\n\n由于 Google 层继承自基础 Layer 类，你可以使用 Layer 类提供的几乎任何属性——例如 `numZoomLevels`\
  \ 或 `maxExtent`。我们只介绍特定于 Google Maps 层类的属性。**type** 属性的可能值取决于所使用的 Google Maps API\
  \ 版本。\n\n### sphericalMercator {Boolean}\n\n该属性决定地图是否应作为墨卡托投影地图行为。设置为 true 将允许我们使用其他图层（如\
  \ Vector 层）与实际地图投影一起使用。球面墨卡托将在本章后面更深入地介绍。使用 Google Maps API V3 时，此属性会自动设置为 true。使用\
  \ V2 时，你需要手动将其设置为 true。示例：sphericalMercator: true。\n\n### type {GmapType}\n\ntype\
  \ 属性指定 Google Maps 层类型——Google 应提供给我们的图层。Google Maps API 的 V2 和 V3 具有不同的可能值。让我们先介绍版本\
  \ 3 的值，然后再查看版本 2 的值。\n\n### V3 GMapType 值\n\n引用图层类型的标准 V3 方式形式为：\n\n```\nvar google_layer_V3\
  \ = new OpenLayers.Layer.Google(\n    'Google Maps V3 Layer',\n    {type: google.maps.MapTypeId.TYPE}\n\
  );\n```\n\n要指定图层类型，我们只需更改 TYPE 属性。可能的 TYPE 值可以是以下之一：\n\n| 类型 | 描述 |\n|------|-------------|\n\
  | google.maps.MapTypeId.ROADMAP | 默认值，若未传入则使用。显示默认街道地图（与 G_NORMAL_MAP 相同）。 |\n|\
  \ google.maps.MapTypeId.HYBRID | 显示叠加在卫星图像上的半透明街道图层的地图（与 G_HYBRID_MAP 相同）。 |\n|\
  \ google.maps.MapTypeId.SATELLITE | 显示卫星图像（与 G_SATELLITE_MAP 相同）。 |\n| google.maps.MapTypeId.TERRAIN\
  \ | 显示具有地形等特征的地图（与 G_PHYSICAL_MAP 相同）。 |\n\n![](img/1b8cd151c9f278555f9cf255b20d244e_127_0.png)\n\
  \n> 最新可能的图层类型列表可在 Google Maps API 文档 http://code.google.com/apis/maps/documentation/javascript/maptypes.html#MapTypes\
  \ 中找到。\n\n在撰写本文时，非地球（月球、火星和天空）图层尚未从 Google Maps 提供。\n\n\n\n## V2 GMapType 值\n\n\
  Version 2 of the Google Maps API provides various layers as well. Some of the layer\
  \ types are even maps of other planets, but no extra work is required to view them\
  \ inside the OpenLayers. To specify the map type for V2, use the following:\n\n\
  ```\nvar google_layer_V2 = new OpenLayers.Layer.Google(\n    'Google Maps V2 Layer',\n\
  \    {type: TYPE}\n);\n```\n\n可能的 TYPE 值如下：\n\n| Type | Description |\n|---|---|\n\
  | G_NORMAL_MAP | 默认值。如果未指定 GMapType，则使用此值。此地图类型将显示普通街道地图。 |\n| G_SATELLITE_MAP |\
  \ 显示卫星图像。 |\n| G_AERIAL_MAP | 显示航空摄影。 |\n| G_HYBRID_MAP | 显示在卫星图像上叠加半透明街道图层的地图。\
  \ |\n| G_AERIAL_HYBRID_MAP | 显示在航空图像上叠加半透明街道图层的地图。 |\n| G_PHYSICAL_MAP | 显示带有地形等特征的地图。\
  \ |\n| G_MOON_ELEVATION_MAP | 显示月球地形图，海拔高度以颜色编码。 |\n| G_MOON_VISIBLE_MAP | 显示从月球轨道拍摄的照片。\
  \ |\n| G_MARS_ELEVATION_MAP | 显示火星地形图，海拔高度以颜色编码。 |\n| G_MARS_VISIBLE_MAP | 显示从火星轨道拍摄的照片。\
  \ |\n| G_MARS_INFRARED_MAP | 显示火星红外图像。温暖区域明亮，凉爽区域较暗。 |\n| G_SKY_VISIBLE | 显示完整天球的地图。\
  \ |\n\n要使用这些图层类型中的任何一种，只需在创建图层时传入类型名称即可。示例：type: G_NORMAL_MAP。\n\n![](img/1b8cd151c9f278555f9cf255b20d244e_128_0.png)\n\
  \n> 撰写本文时，前面的列表为支持的图层类型，但当前和最新的图层值可以在 Google Maps V2 API 文档中找到，网址为 http://code.google.com/apis/maps/documentation/javascript/v2/reference.html#GMapType。\n\
  \n## 动手实践 – 使用 V2 创建 Google 地图图层（已弃用）\n\n让我们使用 Google Maps API V2 创建一个地图。这不是使用 Google\
  \ Maps 图层的正确方法，但我将其包含在内，因为您很可能会遇到使用 V2 API 的代码。Google Maps V2 还提供了一些 V3 在撰写本文时未提供的不同图层类型（如月球图层）。\n\
  \n- 1. V2 的 Google Maps API 要求您注册一个 API 密钥，因此请在 http://code.google.com/apis/maps/signup.html\
  \ 处免费获取一个。如果您没有域名，请使用 http://localhost。\n- 2. 在 <head> 部分，在 OpenLayers 脚本标签之前，包含以下内容。将\
  \ YOUR_KEY 替换为步骤 1 中生成的密钥：\n```\n<script src='http://maps.google.com/maps?file=api&amp;v=2&amp;key=YOUR_KEY'></script>\n\
  ```\n- 3. 现在让我们创建一些图层。V2 中 type 属性的格式略有不同。我们将在此示例之后介绍可能的图层类型值。首先，让我们创建一些图层，从 'hybrid'\
  \ 图层开始。混合图层的 type 值是 G_HYBRID_MAP。我们还将使用 numZoomLevels 属性指定 20 个缩放级别。不同的底图可以支持不同的缩放级别数量：\n\
  ```\n//Create Google Map Layer objects\nvar google_hybrid = new OpenLayers.Layer.Google(\n\
  \  \"Google Hybrid\",\n  {type: G_HYBRID_MAP, numZoomLevels: 20}\n);\n```\n- 4.\
  \ 现在让我们创建一个 'physical' 图层，这是一种地形/拓扑类型的图层。类型是 G_PHYSICAL_MAP，我们将指定不同的 numZoomLevels\
  \ 属性：\n```\nvar google_physical = new OpenLayers.Layer.Google(\n  \"Google Physical\"\
  ,\n  {type: G_PHYSICAL_MAP, numZoomLevels: 22}\n);\n```\n- 5. 我们将使用 G_SATELLITE_MAP\
  \ 创建卫星图层：\n```\nvar google_satellite = new OpenLayers.Layer.Google(\n  \"Google\
  \ Satellite\",\n  {type: G_SATELLITE_MAP}\n);\n```\n- 6. 如果我们不传入 type，则将使用默认的 'streets\
  \ map' 图层。这是 Google 地图中的默认图层。如果您希望手动指定此图层类型，则称为 G_NORMAL_MAP。\n```\nvar google_streets\
  \ = new OpenLayers.Layer.Google(\n  \"Google Streets\",\n  {}\n);\n```\n- 7. 现在让我们添加一个图层类型，该类型在撰写本文时不受\
  \ Google Maps API V3 支持——火星图层：\n```\nvar google_mars = new OpenLayers.Layer.Google(\n\
  \  \"Google Mars\",\n  {type: G_MARS_VISIBLE_MAP}\n);\n```\n- 8. 最后我们只需将图层添加到地图：\n\
  ```\nmap.addLayers([google_hybrid,google_physical,google_satellite,\n  google_streets,google_mars]);\n\
  ```\n- 9. 查看您的地图。您应该会看到类似以下内容：\n\n![](img/1b8cd151c9f278555f9cf255b20d244e_130_0.png)\n\
  \n## 发生了什么？\n\n我们刚刚使用 Google Maps V2 创建了一个地图，其中使用了几种可能的 Google Maps 图层类型。由于我们在这里使用的是不同版本的\
  \ API，您会注意到我们的代码与使用标准（V3）Google Maps API 时略有不同。具体来说，`type` 属性不同，因为 V2 API 支持的图层类型与版本\
  \ 3 不同。\n\n## Yahoo! Maps API\n\nOpenLayers 也为我们提供了与 Yahoo! 映射 API 接口的简便方法。我们使用它的方式与使用\
  \ Google Maps Layer 类的方式类似。官方 Yahoo! Maps API 文档可在 http://developer.yahoo.com/maps/\
  \ 找到。让我们来看看！\n\n## 动手实践 – 使用 Yahoo! Maps 图层\n\n让我们使用 Yahoo! Maps Layer 类创建一个地图。\n\
  \n- 1. 在 `<head>` 部分，我们需要引用 Yahoo! Maps API 的位置。在 OpenLayers 包含脚本标签之前添加以下内容：\n```html\n\
  <script src=\"http://api.maps.yahoo.com/ajaxmap?v=3.0&appid=euzuro-openlayers\"\
  ></script>\n```\n- 2. 现在让我们设置一些 Yahoo! 图层对象。像 Google Maps Layer 一样，我们通过设置 `type`\
  \ 属性来指定想要的图层类型。让我们创建一个混合图层。Yahoo! 图层的 `type` 属性以 `YAHOO_MAP_` 开头，后跟一个三字符代码：\n```javascript\n\
  var yahoo_hybrid = new OpenLayers.Layer.Yahoo(\n  \"Hybrid\",\n  {type: YAHOO_MAP_HYB,\
  \ numZoomLevels: 24}\n);\n```\n- 3. 现在让我们创建一个卫星图层类型。卫星的三字符代码是 `SAT`。我们还将设置不同的缩放级别数量，以进一步说明每个底图可以有自己的缩放级别数量：\n\
  ```javascript\nvar yahoo_satellite = new OpenLayers.Layer.Yahoo(\n  \"Satellite\"\
  ,\n  {type: YAHOO_MAP_SAT, numZoomLevels: 20}\n);\n```\n- 4. 接下来让我们添加一个默认图层。如果我们不传入\
  \ type，则将使用默认值，即 YAHOO_MAP_REG——类似街道的地图。\n```\nvar yahoo_street = new OpenLayers.Layer.Yahoo(\n\
  \  \"Street\",\n  {}\n);\n```\n- 5. 最后我们只需将图层添加到地图：\n```\nmap.addLayers([yahoo_hybrid,\
  \ yahoo_satellite, yahoo_street]);\n```\n- 6. 打开页面。您应该会看到类似以下内容：\n\n![](img/1b8cd151c9f278555f9cf255b20d244e_132_0.png)\n\
  \n## 发生了什么？\n\n我们刚刚使用 Yahoo! Maps 图层创建了一个地图。像 Google Maps 图层一样，我们需要包含指向 Yahoo! API\
  \ 的链接——但我们不需要 API 密钥。我们通过以下方式包含了 API：\n```\n<script src=\"http://api.maps.yahoo.com/ajaxmap?v=3.0&appid=euzuro-openlayers\"\
  ></script>\n```\n像 Google Maps API 脚本一样，此脚本允许 OpenLayers 与 Yahoo! Maps API 通信。它还为我们提供了可用于\
  \ type 属性的值。\n\n## Yahoo! Maps Layer 类属性\n\n像 Google Maps 一样，我们对这个图层类的主要关注点是 type\
  \ 属性。让我们介绍一下可用的 type 值。\n\n## Yahoo! Maps 图层类型\n\n撰写本文时，Yahoo! Maps API 为我们提供了三种图层类型：\n\
  \n| Type | Description |\n|---|---|\n| YAHOO_MAP_HYB | 显示由卫星地图叠加常规街道地图组成的混合地图。 |\n\
  | YAHOO_MAP_SAT | 显示卫星照片。 |\n| YAHOO_MAP_REG | 显示街道地图。这是默认的 type 值，因此如果未传入 type\
  \ 将使用此值。 |\n\n## Microsoft 的映射 API\n\nMicrosoft 也提供了其映射服务的接口。其映射服务以前被称为 Virtual\
  \ Earth，但此后已重新命名为 Bing Maps。因此，在 OpenLayers 中，图层类称为 VirtualEarth，我们使用它的方式与创建 Google\
  \ 和 Yahoo! 图层的方式相同。官方 Microsoft 文档可在 http://msdn.microsoft.com/en-us/library/dd877180.aspx\
  \ 找到。\n\n## 动手实践 – 创建 Bing/Virtual Earth 图层\n\n- 1. 在您的 <head> 部分，在 OpenLayers 包含脚本之前，包含对\
  \ Microsoft Mapping API 的引用：\n```html\n<script src=\"http://ecn.dev.virtualearth.net/mapcontrol/mapcontrol.ashx?v=6.2&mkt=en-us\"\
  ></script>\n```\n- 2. 现在让我们设置一些图层对象。我们像前面的示例一样指定 type 属性。对于此图层，type 以 VEMapStyle.\
  \ 为前缀，表示 'Virtual Earth Map Style'。让我们创建一个 'shaded' 图层，在这种情况下它是带有阴影高程的街道/道路图层：\n\
  ```javascript\nvar ve_shaded = new OpenLayers.Layer.VirtualEarth(\n  \"Shaded\"\
  ,\n  {type: VEMapStyle.Shade}\n);\n```\n\n\n\n3. 我们现在添加一个航空（卫星影像）图层：\n\n```\nvar\
  \ ve_aerial = new OpenLayers.Layer.VirtualEarth(\n  \"Aerial\",\n  {type: VEMapStyle.Aerial}\n\
  );\n```\n\n4. 现在，让我们创建一个默认图层。如果不传入 type，VEMapStyle.Road 图层将被使用。它类似于阴影图层，但没有阴影。我们还将使用另一个名为\
  \ animationEnabled 的属性，并将其设置为 false。默认情况下，该属性设置为 true，并控制是否对图层应用缩放动画（此动画是 Virtual\
  \ Earth 图层特有的属性）：\n\n```\nvar ve_road = new OpenLayers.Layer.VirtualEarth(\n  \"\
  Road\",\n  {animationEnabled: false}\n);\n```\n\n5. 让我们添加一个混合图层：\n\n```\nvar ve_hybrid\
  \ = new OpenLayers.Layer.VirtualEarth(\n  \"Hybrid\",\n  {type: VEMapStyle.Hybrid}\n\
  );\n```\n\n6. 最后，将图层对象添加到地图中：\n\n```\nmap.addLayers([ve_shaded, ve_aerial, ve_road,\
  \ ve_hybrid]);\n```\n\n7. 你应该会看到类似以下内容：\n\n![](img/1b8cd151c9f278555f9cf255b20d244e_135_0.png)\n\
  \n## 发生了什么？\n\n我们刚刚使用 Microsoft Virtual Earth/Bing API 创建了一张地图。它的工作原理与 Google 和\
  \ Yahoo! Maps API 类似——通过提供指向 Microsoft 映射 API 的 script 标签。我们可以与 Microsoft 的地图服务器通信并使用不同的\
  \ type 值。让我们回顾一下属性，因为与其他第三方图层类不同，这里有一个新的属性。\n\n## VirtualEarth 图层类属性\n\n与之前的图层一样，type\
  \ 属性控制从地图服务器获取的图层。然而，有一个独特的 animationEnabled 属性可与 VirtualEarth 图层一起使用。让我们来看看它：\n\
  \n| 属性 | 数据类型 | 描述 |\n|---|---|---|\n| animationEnabled | {Boolean} | 此属性决定是否应启用平移/缩放动画。默认情况下，值为\
  \ true。如果为 false，动画将与其它图层的动画相同。如果查看前面示例中的 Road 图层，你可以看到将此属性设置为 false 时的差异。 |\n\n\
  ## 可能的 type 值\n\n截至撰写本文时，`type` 属性的可能值如下。\n\n| 类型 | 描述 |\n|------|-------------|\n\
  | `VEMapStyle.Shade` | 显示阴影街道/道路地图，显示海拔。 |\n| `VEMapStyle.Aerial` | 显示航空（卫星）影像。\
  \ |\n| `VEMapStyle.Road` | 显示道路地图。 |\n| `VEMapStyle.Hybrid` | 显示叠加了道路地图的航空图层。 |\n\
  \n在开始组合不同的图层之前，让我们再介绍一种图层类型——**OpenStreetMap** 图层。\n\n## OpenStreetMap\n\nOpenStreetMap（或\
  \ **OSM**）是由用户贡献内容驱动的免费、维基风格的世界地图。你可以使用自己的 OSM 瓦片或通过 OpenStreetMap 服务器提供的瓦片。与之前的第三方\
  \ API 不同，此图层没有需要指定的 `type` 属性。\n\n自己设置 OpenStreetMap 服务和瓦片并不太困难，但超出了本书的范围（有关此内容的更多信息，请访问\
  \ http://wiki.openstreetmap.org/wiki/OpenLayers_Simple_Example）。然而，使用 OpenLayers\
  \ 访问 OSM 却很简单。\n\n![](img/1b8cd151c9f278555f9cf255b20d244e_136_0.png)\n\n> 有关 OpenStreetMap\
  \ 的更多信息，可访问 http://www.openstreetmap.org/。\n\n## 动手实践 – 创建 OpenStreetMap 图层\n\n\
  - 1. 对于 OpenStreetMap 图层，我们不需要包含脚本；我们可以直接访问它。\n- 2. 这会很简单。我们只需要创建一个 OSM 图层对象：\n\n\
  ```\nvar osm_layer = new OpenLayers.Layer.OSM(\n    'OpenStreetMap Layer'\n);\n\
  ```\n\n3. 然后，我们只需将图层对象添加到地图中。即使我们只传入一个图层对象，我们仍将使用 addLayers 函数以保持代码一致：\n\n```\n\
  map.addLayers([osm_layer]);\n```\n\n4. 你应该会看到类似这样的内容：\n\n![](img/1b8cd151c9f278555f9cf255b20d244e_137_0.png)\n\
  \n## 发生了什么？\n\n我们刚刚创建的地图显示的是一个 OpenStreetMap 图层。与之前的图层不同，我们不需要提供 API 密钥或指向 OSM 特定文件的链接——OpenLayers\
  \ 已经知道它了。OpenStreetMap 图层与其它第三方地图图层之间的另一个区别是，OSM 图层没有 type 属性。\n\n## 访问你自己的 OSM\
  \ 瓦片\n\n上面的代码使用公开可用的 OSM 瓦片，但指向你自己的瓦片也很简单。为此，请按以下格式创建图层：\n\n```\nvar osm_layer =\
  \ new OpenLayers.Layer.OSM(\n    'My OSM Layer',\n    'http://URL_TO_TILES/${z}/${x}/${y}.png',\n\
  \    {}\n) ;\n```\n\n使用时，你需要将 URL_TO_TILES 替换为托管你 OSM 瓦片的服务器。${z}、${x}、${y} 是变量，OpenLayers\
  \ 将用适当的值替换它们以引用特定的地图瓦片。\n\n## 球面墨卡托\n\n让我们谈谈 Spherical Mercator。我在整章中提到了它几次，但它是什么？它是指许多商业、第三方映射\
  \ API 使用的投影的术语。我们需要使用 Spherical Mercator 才能在第三方地图图层之上正确叠加数据和图层。\n\n我们在本章中迄今为止使用的所有\
  \ API（Google、Yahoo!、VirtualEarth/Bing 和 OSM）都使用 Spherical Mercator 投影——一种将地球视为球体（而不是椭球体）的投影。\n\
  \n## Spherical Mercator—EPSG 代码\n\n该投影的官方 EPSG 代码目前是 EPSG:3857，但在代码建立时被称为 EPSG:900913。EPSG:900913\
  \ 代码仍可在 OpenLayers 中使用，因为 EPSG:3857 代码与之相同。Google 是（如果不是的话）第一个使用此投影发布地图的公司之一——注意\
  \ 900913 如何类似于 'gOOgIE'（3 代表倒写的 'E'）。\n\n> 你也可能会看到代表相同 Spherical Mercator 投影的其他\
  \ EPSG 代码。例如，ArcGIS 9.3 版本使用代码 EPSG:102113，你也可能会遇到标准 EPSG:3785。它们都指的是相同的 'Spherical\
  \ Mercator' 投影，可以互换使用。\n\n这对我们意味着什么？嗯，当我们使用这些第三方 API 时，我们使用的坐标看起来不像 Lon/Lat 坐标（它们是米为单位的\
  \ x、y）。由于在 Spherical Mercator 投影中地球被视为球体，计算会受到影响，如果我们不重新投影数据，其他来源的数据可能无法与之完美匹配。\n\
  \n我们需要在添加其他图层类并使它们正确对齐之前设置 Spherical Mercator，所以让我们来看看。\n\n## 动手实践 – 使用 Spherical\
  \ Mercator\n\n让我们使用 Spherical Mercator 和 Yahoo! Maps 图层设置一张地图。使用 Google Maps 图层（V3）时，sphericalMercator\
  \ 属性会自动设置为 true，因此你无需做额外操作。然而，在处理非 Spherical Mercator 投影的其他图层时，显式指定它是个好主意。\n\n1.\
  \ 由于我们将使用 Virtual Earth 图层类型，我们需要确保包含 Microsoft 映射 API：\n\n```\n<script\nsrc=\"\
  http://ecn.dev.virtualearth.net/mapcontrol/mapcontrol.ashx?v=6.2&mkt=en-us\"></script>\n\
  ```\n\n2. 第一步是在创建地图对象时指定 maxExtent、maxResolution、units 和 projection 属性。如果还记得上一章，这些是我们指定除默认\
  \ EPSG:4326 投影之外的地图投影时必须设置的属性。我们还将 displayProjection 属性设置为 EPSG:4326 投影对象。此 displayProjection\
  \ 属性指定各种控件（如 MousePosition 控件）以何种投影显示坐标。对于 EPSG: 900913 投影，(-)128 * 156543.0339\
  \ 是最大范围。\n\n```\nmap = new OpenLayers.Map('map_element',{\n    maxExtent: new OpenLayers.Bounds(\n\
  \        -128 * 156543.0339,\n        -128 * 156543.0339,\n        128 * 156543.0339,\n\
  \        128 * 156543.0339),\n    maxResolution: 156543.0339,\n    units: 'm',\n\
  \    projection: new OpenLayers.Projection('EPSG:900913'),\n    displayProjection:\
  \ new OpenLayers.Projection(\"EPSG:4326\"),\n});\n```\n\n3. 现在，我们将创建一个 Microsoft\
  \ Virtual Earth（Bing）地图图层对象。这次，我们将指定 sphericalMercator: true，以便图层正确投影到投影上：\n\n```\n\
  var ve_road = new OpenLayers.Layer.VirtualEarth(\n    \"Road\",\n    {sphericalMercator:true}\n\
  );\n```\n\n- 4. 打开地图，并在 Firebug 中运行命令：\n  `map.getProjection();`\n- 5. 你应该看到以下输出：\n\
  \  `\"EPSG:900913\"`\n\n## 发生了什么？\n\n我们刚刚使用启用了球面墨卡托的 Yahoo! 地图图层设置了一个地图。使用不同的投影时，我们必须指定一些属性（如我们在上一章中讨论的）。让我们简要回顾一下与\
  \ EPSG:900913，即球面墨卡托投影相关的属性。\n\n## 使用球面墨卡托图层的地图属性\n\n由于我们使用的是不同的投影，因此必须告诉 OpenLayers\
  \ 有关地图的一些信息，以便它知道如何设置。让我们看看上面代码中设置的地图属性。\n\n### maxExtent\n\n我们传入地图属性的第一个属性是：\n\n\
  ```\nmaxExtent: new OpenLayers.Bounds(\n    -128 * 156543.0339,\n    -128 * 156543.0339,\n\
  \    128 * 156543.0339,\n    128 * 156543.0339),\n```\n\nmaxExtent 属性告诉 OpenLayers\
  \ 地图的边界。四个数字代表最小 x、最小 y、最大 x 和最大 y 坐标。我们在此使用的数字是 EPSG:900913 中世界范围的坐标——与经度/纬度坐标大不相同。如果不指定\
  \ maxExtent，我们的地图将无法正确显示，因为 OpenLayers 不会知道世界的边界在哪里。\n\n### maxResolution\n\n此属性设置地图的\
  \ maxResolution，其基于将地图范围适配到 256 像素。这是一个 {Float} 数据类型。例如，\n\n```\nmaxResolution:\
  \ 156543.0339,\n```\n\n有关此属性的更多信息可在第 8 章、关于 Map 类的章节中找到。\n\n### units\n\n这指定地图单位为米。它是一个\
  \ {String} 数据类型。\n\n```\nunits: 'm',\n```\n\n默认情况下，units 属性设置为度。由于球面墨卡托是一种使用米的投影，因此我们需要在此处指定它。\n\
  \n### projection\n\n在这里我们将地图的投影设置为 EPSG:900913，即球面墨卡托投影：\n\n```\nprojection: new\
  \ OpenLayers.Projection('EPSG:900913'),\n```\n\n如果我们希望使用经度/纬度，或在不同投影中使用其他图层类型，我们需要将坐标从\
  \ EPSG:900913 转换到适当的其他投影。一旦开始使用第三方地图 API，我们就只能使用球面墨卡托投影。\n\n## 使用 Google Maps 和其他图层\n\
  \n让其他图层与这些第三方图层良好配合涉及三件事，其中两件我们已经完成了：\n\n- 1. 设置正确的地图投影属性。\n- 2. 确保第三方地图图层上的 sphericalMercator\
  \ 设置为 true。\n- 3. 确保所有栅格图层（任何非 Vector 或 Image 图层），如 WMS，都在地图的投影中。在这种情况下，我们需要确保向\
  \ WMS 服务器请求 EPSG:900913 投影的地图瓦片。\n\n利用我们迄今为止学到的知识，让我们制作一个 mashup。我们将使用 Google Maps\
  \ 图层作为底图图层，并使用 WMS 和 Vector 图层作为叠加图层。\n\n## 动手实践 – 创建你的第一个 mashup\n\n让我们制作一个包含 Google\
  \ 地图图层、WMS 图层和 Vector 图层的地图“mashup”。\n\n- 1. 首先，我们需要在 <head> 部分添加 Google Maps V3\
  \ 脚本 API 标签：\n  ```html\n  <script src=\"http://maps.google.com/maps/api/js?sensor=false&v=3.2\"\
  ></script>\n  ```\n- 2. 现在，使用与前一个示例类似的正确投影信息设置你的地图对象：\n  ```javascript\n  map =\
  \ new OpenLayers.Map('map_element', {\n      maxExtent: new OpenLayers.Bounds(\n\
  \          -128 * 156543.0339,\n          -128 * 156543.0339,\n          128 * 156543.0339,\n\
  \          128 * 156543.0339),\n      maxResolution: 156543.0339,\n      units:\
  \ 'm',\n      projection: new OpenLayers.Projection('EPSG:900913'),\n      displayProjection:\
  \ new OpenLayers.Projection(\"EPSG:4326\"),\n  });\n  ```\n- 3. 现在让我们创建一个 Google\
  \ Maps 图层。由于我们使用的是 API V3，因此无需指定 sphericalMercator: true，因为它会自动设置为 true。\n  ```javascript\n\
  \  var google_streets = new OpenLayers.Layer.Google(\n      \"Google Streets\",\n\
  \      {numZoomLevels: 20}\n  );\n  ```\n- 4. 我们现在将创建 WMS 图层并指定我们希望从 WMS 服务器获取基本图层和各种标签图层。我们还将不透明度设置为\
  \ .7，即 70% 不透明，并设置 isBaseLayer: false，以确保它是一个叠加图层。现在，我们没有在图层上指定投影属性，因为我们的图层将继承地图对象的投影。所有图层（Vector\
  \ 图层除外）都应与你的地图使用相同的投影。我们使用的 WMS 服务器确实支持 EPSG:900913 投影，因此我们将获得正确的地图瓦片。如果 WMS 服务不支持此投影，我们就无法使用它——我们将在示例后更详细地讨论这个问题。现在创建\
  \ WMS 图层：\n  ```javascript\n  var wms_layer = new OpenLayers.Layer.WMS(\n  'OpenLayers\
  \ WMS',\n  'http://vmap0.tiles.osgeo.org/wms/vmap0',\n  {layers: 'basic,clabel,ctylabel,statelabel',\
  \ transparent: true},\n  {isBaseLayer: false,\n  opacity: .7}\n  );\n  ```\n- 5.\
  \ 现在让我们添加一个 Vector 图层。它也将使用 EPSG:900913 投影，因为它继承自地图对象的投影。然而，我们可以为矢量图层指定不同的投影并实时重新投影矢量数据（我们不能对栅格图层，如\
  \ WMS 图层这样做）——但我们将把这个主题留到第 9 章，我们的 Vector 图层章节。创建矢量图层对象：\n  ```\n  var vector_layer\
  \ = new OpenLayers.Layer.Vector(\n  'Editable Vectors');\n  ```\n- 6. 我们现在将添加一个\
  \ EditingToolbar 控制，它允许我们通过工具栏向矢量图层添加点和多边形，该工具栏默认会出现在地图右上角。创建控制对象时，我们只需传入我们希望控制使用的矢量图层对象：\n\
  \  ```\n  //Add a vector editing control\n  map.addControl(new OpenLayers.Control.EditingToolbar(vector_layer));\n\
  \  ```\n- 7. 最后，我们只需要将图层添加到地图中。\n  ```\n  map.addLayers([google_streets, wms_layer,\
  \ vector_layer]);\n  ```\n- 8. 现在打开你的地图。你可以通过右上角的 **EditingToolbar** 控制向矢量图层添加点和多边形：\n\
  \n![](img/1b8cd151c9f278555f9cf255b20d244e_144_0.png)\n\n## 发生了什么？\n\n我们刚刚使用 Google\
  \ Maps、WMS 和 Vector 图层创建了一个地图。我们还将一个 **EditingToolbar** 控制连接到矢量图层对象，这将允许我们在矢量图层中创建点和多边形。我们创建的任何点或多边形（也称为\
  \ **features**）都将位于地图的投影 `EPSG:900913` 中，并与下方的 Google 地图图层对齐。\n\n## 使用球面墨卡托/第三方地图图层的\
  \ WMS\n\n我们还有一个设置为叠加图层的 WMS 图层。要在 Google Maps 图层（或任何其他第三方地图图层）之上使用 WMS 服务，WMS 服务必须支持\
  \ `EPSG:900913` 投影。我们使用的 WMS 服务 `http://vmap0.tiles.osgeo.org/wms/vmap0` 确实支持此投影，因此地图瓦片图像能够正确地与\
  \ Google Maps 图层对齐。如果 WMS 服务不支持 `EPSG:900913` 投影，地图瓦片图像将无法正确对齐。\n\n> 要了解 WMS 服务支持哪些投影，你可以向服务器发出\
  \ `getCapabilities` 请求。要发出此请求，请在 URL 中指定 `request`、`service` 和 `version` 属性。例如，`http://wmserver/?request=GetCapabilities&service=WMS&version=1.1.1`。\n\
  \n## 总结\n\n在本章中，我们讨论了第三方地图 API 是什么以及如何使用它们。我们学习了如何使用 Google、Yahoo! 和 Microsoft 地图\
  \ API，以及 OpenStreetMaps API。我们还讨论了球面墨卡托并演示了如何使用它。最后，我们创建了一个地图“mashup”，混合了各种不同的图层类型。\n\
  \n下一章将重点介绍 OpenLayers 的另一个部分——**Control** 类。这是 OpenLayers 有别于其他地图库的另一个特点。有了它，我们能够与地图交互，添加大量附加功能，甚至创建自己的自定义控件。\n\
  \n\n"
- "# 6 控制控件\n\n*到目前为止，我们一直理所当然地认为拖动地图时地图会移动。或者只需在图层切换器中点击一个图层即可打开或关闭它。或者可以放大和缩小。我们尚未详细讨论地图交互背后的实际内容或其工作原理。*\n\
  \n*简单来说，OpenLayers Control 类使我们的地图具有交互性。有许多内置控件，每个控件都有其独特的功能。但不仅如此，你可以使用大量预制的控件，而且还可以轻松创建自己的控件。*\n\
  \n本章我们将介绍：\n- 什么是控件\n- 向地图添加控件\n- Control 类及其子类\n- 使用面板在地图外部添加控件\n- 创建自定义控件\n\n\
  ### 什么是控件？\n\n**控件**允许我们与地图交互。它们还允许我们显示额外信息，例如使用 **ScaleLine** 控件显示比例尺。有些控件没有视觉外观，例如\
  \ **ArgParser** 控件，但也有一些有，例如 **OverviewMap** 控件。你可以在地图上添加任意数量的控件。甚至有些情况下你可能不想要任何控件——例如在页面中嵌入不可移动的地图，或显示用于打印的静态地图。\n\
  \n### 在 OpenLayers 中使用控件\n\n大多数控件直接添加到地图中，例如 **Navigation** 控件。\n\n其他控件添加到地图中，但也可以放置在地图外部的\
  \ `<div>` 标签中——就像概览地图控件一样。\n\n其他控件类似于可以点击或切换开/关的按钮。这类控件可以放置在 **panel** 内，而该面板也可以放置在地图外部。\n\
  \n此外，我们甚至可以创建自己的控件，并将其直接放置在地图中或面板内部。我们将介绍所有这些内容以及更多内容，因此让我们开始学习如何向地图添加控件。\n\n###\
  \ 向地图添加控件\n\n有两种方法向地图添加控件。\n\n1. 在实例化地图对象时传入一个 OpenLayers Control 对象的 JavaScript\
  \ 数组。\n2. 在地图对象创建后，通过调用两个地图函数之一 `addControl()` 传入单个控件对象，或 `addControls()` 传入控件对象数组来向地图对象添加控件。\n\
  \n当你创建地图时，会自动添加四个控件对象。这四个控件是：\n\n- `OpenLayers.Control.Navigation`：负责处理来自鼠标事件的地图交互，例如拖动鼠标、使用滚动条缩放和双击。\n\
  - `OpenLayers.Control.PanZoom`：在地图左上角添加平移/缩放条。包含用于平移的上下左右箭头，以及用于缩放的放大、缩小和缩放至最大地图范围按钮。\n\
  - **OpenLayers.Control.ArgParser**：允许地图根据调用地图的 URL 缩放到特定位置并打开/关闭图层。换句话说，当你使用 OpenLayers.Control.Permalink\
  \ 控件生成 URL 时，ArgParser 控件将解析 URL 并根据 URL 中嵌入的参数操作地图。我们将在本章后面详细讨论这两个控件。\n- **OpenLayers.Control.Attribution**：如果向图层对象传入任何署名，此控件将把图层的署名添加到地图中。\n\
  \n由于这些控件是在我们未显式添加的情况下添加的，我们如何选择不包含它们？最简单的方法是在实例化地图对象时向 `controls` 属性传入一个空数组。\n\n\
  ### 动手实践 – 创建一个没有控件的地图\n\n没有控件，我们的地图将不可交互。有时这正是你想要的，例如在打印机友好页面上显示地图时。\n\n1. 首先，我们需要创建地图对象并向\
  \ `controls` 属性传入一个空数组：\n```\nmap = new OpenLayers.Map('map_element', {\n  controls:\
  \ []\n});\n```\n2. 现在，除非手动调用 `addControl` 或 `addControls`，否则不会向地图添加任何控件。让我们创建一个\
  \ WMS 图层并将其添加到地图中：\n```\nvar wms_layer = new OpenLayers.Layer.WMS(\n  'WMS Layer\
  \ Title',\n  'http://vmap0.tiles.osgeo.org/wms/vmap0',\n  {layers: 'basic'},\n \
  \ {}\n);\nmap.addLayer(wms_layer);\n```\n3. 确保你也设置了范围——正如前几章所述，此步骤将在所有后续示例中被隐含：\n\
  ```\nif (!map.getCenter()) {\n  map.zoomToMaxExtent();\n}\n```\n4. 打开页面。你应该会看到一个没有控件的地图，并且由于地图没有控件，你将无法平移或放大，如下所示：\n\
  \n![](img/1b8cd151c9f278555f9cf255b20d244e_150_0.png)\n\n### 发生了什么？\n\n我们刚刚创建了一个没有控件的地图。用户无法与地图交互——他们可以看到它，但无法导航或更改它。通过在实例化地图对象时\
  \ via controls: [] 传入一个空数组，我们覆盖了默认添加到地图的四个控件。\n\n### 动手实践 – 向地图添加控件\n\nOpenLayers\
  \ 提供了大量其他控件，它们默认不会传入但仍然非常有用。让我们看看其中一些控件以及如何将它们添加到地图中。在介绍完如何操作后，我们将更详细地介绍每个 Control\
  \ 类。\n\n1. 我们现在要做的是创建一个控件对象数组，并在创建地图对象时传入。让我们先创建一个 NavigationControl 对象。这样，我们就可以在代码中的任何地方轻松引用该控件。接下来，我们将创建一个\
  \ JavaScript 数组，其中包含我们创建的 navigation_control 对象；以及另外四个我们将立即实例化的控件对象。因此，我们在 init()\
  \ 函数内部需要做的第一件事就是创建一个控件对象数组：\n```\nvar navigation_control = new OpenLayers.Control.Navigation({});\n\
  ```\n```\nvar controls_array = [\n    navigation_control,\n    new OpenLayers.Control.PanZoomBar({}),\n\
  \    new OpenLayers.Control.LayerSwitcher({}),\n    new OpenLayers.Control.Permalink(),\n\
  \    new OpenLayers.Control.MousePosition({})\n];\n```\n2. 现在我们将创建地图对象并传入刚刚创建的控件数组：\n\
  ```\nmap = new OpenLayers.Map('map_element', {\n    controls: controls_array\n});\n\
  ```\n3. 创建并添加一个 WMS 图层，如前例所示。如果我在本章后续示例中要求你创建一个 WMS 图层，我将指的是这段代码。\n```\nvar wms_layer\
  \ = new OpenLayers.Layer.WMS(\n    'WMS Layer Title',\n    'http://vmap0.tiles.osgeo.org/wms/vmap0',\n\
  \    {layers: 'basic'},\n    {}\n);\n\nmap.addLayer(wms_layer);\n```\n4. 在创建地图对象时传入控件对象数组是一种添加控件的方法，但正如你所知，我们也可以调用\
  \ addControl 或 addControls。让我们调用 addControl 并传入一个即时实例化的对象——我们不会创建变量来引用它。\n```\n\
  map.addControl(new OpenLayers.Control.ScaleLine());\n```\n5. 让我们创建一个概览地图控件对象。我们将实例化它并使用变量保存对其的引用，然后通过将其传入数组并调用\
  \ addControls 将其添加到地图中。我们还将传入一个 KeyboardDefaults 控件，该控件将在 addControls 中实例化。这两种方法都有效——传入对控件对象的引用，或在方法调用中实例化对象：\n\
  ```\nvar overview_map = new OpenLayers.Control.OverviewMap();\nmap.addControls([\n\
  \    overview_map,\n    new OpenLayers.Control.KeyboardDefaults()\n]);\n```\n6.\
  \ 打开页面。你应该会看到类似以下内容：\n\n![](img/1b8cd151c9f278555f9cf255b20d244e_152_0.png)\n\n\
  ### 发生了什么？\n\n我们通过在构造地图对象时传入控件对象数组，并通过调用 `map.addControl` 和 `map.addControls` 向地图添加了各种控件。这两个函数接收控件对象并将其添加到地图中，这也会导致\
  \ `map.control` 数组得到更新。\n\n### 试一试 – 添加控件\n\n添加和移除各种控件，看看你是否能确定哪些控件是哪些。查看 **Control**\
  \ 类文档 http://dev.openlayers.org/docs/files/OpenLayers/Control-js.html 以查看所有可用控件类的列表（我们很快会介绍每个控件），并尝试向地图添加不同的控件。\n\
  \n使用 `map.removeControl()` 并传入你想要移除的控件对象。你可以使用变量名，或使用一种不太优雅的方法直接访问 `controls` 数组本身，例如：\n\
  ```\nmap.removeControls(map.controls[2]);\n```\n\n\n\n这样做应该能清楚地说明为什么创建变量来实例化控制/图层对象是一种更好的方式，因为它使访问正确的对象变得容易得多。使用\
  \ controls 数组本身的另一个缺点是，移除一个控制会改变所有其他控制的索引，因此在确定实际移除的是哪个控制时可能会有很多猜测。总之，如果可以的话，避免以这种方式移除控制。\n\
  \n## 通过传入控制数组来添加控制\n\n指定地图控制的第一种方式是在实例化地图对象时以数组形式传入。在创建地图对象时传入控制对象数组是添加控制的首选方式——它将所有控制对象保存在一个地方，使代码更易于阅读和维护。\n\
  \n在上面的示例中，我们创建了一个包含五个控制对象的数组，其中四个是在数组本身中实例化的：\n\n```\nvar navigation_control = new\
  \ OpenLayers.Control.Navigation({});\nvar controls_array = [\n    navigation_control,\n\
  \    new OpenLayers.Control.PanZoomBar({}),\n    new OpenLayers.Control.LayerSwitcher({}),\n\
  \    new OpenLayers.Control.Permalink(),\n    new OpenLayers.Control.MousePosition({})\n\
  ];\n```\n\n正如我们之前提到的，在将对象添加到地图之前，最好先为该对象（无论是控制对象还是图层对象）创建一个引用。我们在数组外部创建了 navigation_control\
  \ 对象，因此只需引用它即可轻松访问它。\n\n要访问其他控制，我们必须调用 controls_array[index] 或 map.controls[index]，其中\
  \ index 是要访问的控制的索引。如果可能，请尽量避免这种方法，因为数组可能会发生变化，导致索引出错。此外，以这种方式按索引访问控制会影响代码的可读性，因为不容易看出你试图访问的是哪个控制对象。\n\
  \n## 使用 addControl() 和 addControls() 向地图添加控制\n\n在地图创建后，你可能希望动态地向地图添加控制。为此，我们可以使用地图对象的\
  \ addControl() 方法并传入单个控制对象，或者使用 addControls() 并传入对象数组。\n\n在上面的示例中，我们调用了 addControl\
  \ 并传入了一个 ScaleLine 控制对象，该对象是在运行时实例化的：\n\n```\nmap.addControl(new OpenLayers.Control.ScaleLine({}));\n\
  ```\n\n我们还通过传入一个已实例化的控制对象以及在函数调用本身中创建的对象来使用 addControls：\n\n```\nvar overview_map\
  \ = new OpenLayers.Control.OverviewMap();\nmap.addControls([\n  overview_map,\n\
  \  new OpenLayers.Control.KeyboardDefaults()\n]);\n```\n\n无论你使用哪种添加控制的方法，都应尽量将所有与控制相关的代码放在一起。你在编程中花费的大部分时间都是在阅读代码而不是编写代码。如果对代码进行组织，你的代码将更容易阅读和维护。组织代码没有“正确”的方法，但将相关内容（如与控制相关的代码块）分组在一起是一个很好的经验法则。\n\
  \n## 移除控制\n\n那么，我们知道如何添加控制，但如何移除它们呢？有两种常见的方法可以做到这一点：\n\n- 调用 `map.removeControl(map.controls[x])`；其中\
  \ x 是要移除的控制的索引。正如我们之前所说，以这种方式移除控制是不推荐的，因为不清楚实际移除的是哪个控制。\n- 另一种方法是调用 `map.removeControl(control_object)`；其中\
  \ `control_object` 是你已实例化的控制对象的引用。请记住，如果你在函数内部使用 var 定义一个对象，你将无法在函数外部访问它。\n\n现在我们熟悉了如何添加和移除控制，让我们深入了解\
  \ Control 类本身，并查看各种不同类型的控制。\n\n## OpenLayers.Control 类\n\n正如我们在前面的示例中看到的，我们可以使用相当多的控制。Control\
  \ 类与 Layer 类的性质相似——存在一个基础 Control 类，所有其他控制子类都继承自它。由于大多数控制提供的功能完全不同，基础 Control 类不包含很多属性。\n\
  \n该类的官方最新文档可在 http://dev.openlayers.org/docs/files/OpenLayers/Control-js.html 找到。\n\
  \n## OpenLayers.Control 属性\n\n与其他类的属性一样，你可以在实例化控制对象时指定这些属性。基础 OpenLayers.Control\
  \ 类有几个属性，所有其他 Control 类都继承了这些属性：\n\n| 名称 | 类型 | 描述 |\n|---|---|---|\n| autoActivate\
  \ | {Boolean} | 将控制设置为添加到地图时激活。默认值是 false。 |\n| div | {HTML Element} | 许多控制支持将自身放置在地图外部的\
  \ div 中的能力。（不过这并不适用于所有控制。）示例调用看起来像：{div: document.getElementById('my_control_div')\
  \ } |\n| id | {String} | 这指定将分配给控制的 HTML 元素的 ID。 |\n| eventListeners | {Object}\
  \ | 此对象指定要注册的事件监听器。事件将在本章后面介绍。 |\n| displayClass | {String} | 指定控制将接收的 CSS 类。默认情况下，控制接收由\
  \ OlControl 加上控制名称组成的类名，例如 OlControlNavToolBar。我们将在第 7 章关于样式化控制的内容中更详细地介绍这一点。 |\n\
  | title | {String} | 你在此处设置标题将在工具提示（或适当的其他位置）中显示。 |\n| type | {Number} | 指定控制的类型，这与控制的功能有关。在各种情况下使用，例如在处理按钮或面板时。我们将在本章后面关于面板的部分介绍这一点。\
  \ |\n\n## OpenLayers.Control 函数\n\n有几个函数是所有控制子类继承的，我们应该了解一下。\n\n| 名称 | 描述 |\n|---|---|\n\
  | destroy() | 这将执行任何清理操作（例如移除附加到控制的任何事件），然后将控制从地图中移除。由于控制已从地图中移除，因此在访问 map.controls\
  \ 时它将不再显示。 |\n| `moveTo(location)` | 此函数接收单个参数，`location`，一个 **OpenLayers.Pixel**\
  \ 对象，并将控制移动到传入的像素坐标（按 x 坐标、y 坐标的顺序）。此函数只会影响具有可见组件的控制。示例调用可能是：`control_object.moveTo(new\
  \ OpenLayers.Pixel(200,100))`；这将把控制移动到地图内部的 x、y 位置 200、100。原点是地图的左上角，因此它将向右移动 200\
  \ 像素，向下移动 100 像素。 |\n| `activate()` | 调用此函数将激活控制及其事件处理程序（如果已设置）。如果控制成功激活则返回 `true`，如果它已处于活动状态则返回\
  \ `false`。 |\n| `deactivate()` | 停用控制及任何关联的事件处理程序。此行为在不同控制之间会有所不同。如果控制成功停用则返回 `true`，如果它已处于非活动状态则返回\
  \ `false`。 |\n| `draw()` | 此函数初始化控制。你很少需要调用它，因为它通常会自动调用。然而，可能存在你希望手动发出调用的情况。它返回一个\
  \ `{DOMElement}`，即包含控制的 div 的引用（如果存在）。 |\n\n## OpenLayers.Control 子类\n\nOpenLayers\
  \ 提供了许多不同类型的控制，最新列表始终可在 http://dev.openlayers.org/docs/files/OpenLayers/Control-js.html\
  \ 找到。一些控制已弃用，不应使用，因此我们不会介绍在 OpenLayers 3.0 或更高版本中不受支持的控制。\n\n一些控制的一些属性和函数主要面向高级用户，超出了本书的范围，因此我们不会全部介绍。一些其他控制仅与\
  \ Vector Layer 类一起使用——因此我们将在第 9 章介绍它们。然而，这仍然给我们留下了很多需要在这里介绍的内容，所以让我们开始吧！\n\n## OpenLayers.Control.ArgParser\n\
  \n正如我们之前提到的，这是默认添加到地图的控制。它的命名很贴切；它解析通过 URL 传入的参数。例如，当在地图 URL 后附加 ?zoom=0&lat=0&lon=0&layers=B\
  \ 时，ArgParser 控制将解析变量（即 zoom=0、lat=0、lon=0 和 layers=B）。\n\n\n\n该控件随后会根据参数操纵地图——它会将地图缩放至\
  \ 0 级，将纬度和经度设为 0，并打开某一图层。ArgParser 控件不处理这些 URL 参数的生成。它通常与 Permalink 控件一起使用。我们稍后会看到，Permalink\
  \ 控件才是实际生成 URL 的控件。\n\n示例调用：`var argparser_control = new OpenLayers.Control.ArgParser();`\n\
  \n## OpenLayers.Control.Permalink\n\nPermalink 控件将在地图右下角创建一个 HTML 链接元素（一个锚点、一个 <a>\
  \ 元素）。该链接包含嵌入了当前地图的经度、纬度、缩放值和图层信息（例如哪些图层已打开）的 URL。\n\n当从其中一个生成的 URL 访问页面时，URL 会被我们刚才讨论的\
  \ ArgParser 控件读取。只要地图更新（缩放、平移、打开/关闭图层等），永久链接 URL 就会更改以反映地图的当前状态。\n\n示例调用：`var permalink_control\
  \ = new OpenLayers.Control.Permalink();`\n\n![](img/1b8cd151c9f278555f9cf255b20d244e_157_0.png)\n\
  \n使用 Permalink 控件时，ArgParser 控件将被自动添加到地图中。\n\n## OpenLayers.Control.Attribution\n\
  \n这是默认添加到地图的另一个控件。它将在地图上显示图层署名（如果为图层指定了 attribution 属性）。图层署名只是一些字符串，将与此控件一起显示在地图上。您还可以通过设置\
  \ separator 属性来指定分隔符，它将分隔每个图层的署名。要使此控件有用，必须为要显示署名的图层指定 attribution 属性。\n\n### 署名属性\n\
  \n| 名称 | 类型 | 描述 | 默认值 |\n|---|---|---|---|\n| separator | {String} | 用于图层署名文本之间的分隔符。\
  \ | ', ' |\n| div | {HTML Element} | 放置此控件的 HTML 元素。示例：`document.getElementById('map_control_div');`\
  \ |  |\n\n## 动手实践 – 使用署名\n\n让我们看看署名控件的实际使用情况。\n\n- 1. 要使 **Attribution** 控件有用，我们必须在图层对象上指定一个\
  \ `attribution` 属性。因此，让我们创建一个 WMS 图层，并将此属性设置为 `'Base WMS Layer'`：\n```js\nvar wms_base\
  \ = new OpenLayers.Layer.WMS(\n  'OpenLayers WMS',\n  'http://vmap0.tiles.osgeo.org/wms/vmap0',\n\
  \  {layers: 'basic'},\n  {attribution: 'Base WMS layer'}\n);\n```\n- 2. 现在，让我们添加另一个图层并将\
  \ `attribution` 文本设置为 `'State Boundary'`。\n```js\nvar wms_state_lines = new OpenLayers.Layer.WMS(\n\
  \  'State Line Layer',\n  'http://vmap0.tiles.osgeo.org/wms/vmap0',\n  {layers:\
  \ 'stateboundary'},\n  {attribution: 'State Boundary', isBaseLayer: false,\n   opacity:\
  \ .2}\n);\n```\n- 3. 最后，将图层添加到地图：\n```js\nmap.addLayers([wms_base, wms_state_lines]);\n\
  ```\n- 4. 您应该会看到如下内容，图层署名文本显示在地图右下角：\n\n![](img/1b8cd151c9f278555f9cf255b20d244e_158_0.png)\n\
  \n## 发生了什么？\n\n您刚刚使用包含一个 `attribution` 属性的两个图层使用了署名控件。\n地图右下角的文本显示当前活动图层的署名文本。\n\
  让我们继续介绍更多内置控件类。\n\n## OpenLayers.Control.EditingToolbar\n\n**EditingToolbar** 控件是一个由允许绘制和编辑矢量要素的工具组成的面板。它要求地图中存在矢量图层。我们将在第\
  \ 9 章中详细介绍此控件及其使用方法。\n\n## OpenLayers.Control.Graticule\n\n这将在地图上显示经线和纬线（或投影的任何测量值）。与某些其他控件不同，此控件有相当多的属性可以设置以改变其行为。这是使用默认参数添加\
  \ Graticule 控件后地图的外观：\n\n![](img/1b8cd151c9f278555f9cf255b20d244e_159_0.png)\n\n\
  让我们介绍一下 **Graticule** 控件的属性。\n\n### Graticule 属性\n\n| 名称 | 类型 | 描述 | 默认值 |\n|---|---|---|---|\n\
  | intervals | {Float Array} | 可能的格网宽度浮点数数组，以度为单位。不同的宽度将根据当前地图缩放级别使用。示例：intervals:\
  \ [50,30,15,7,4,2,1,.5] | [45,30,20,10,5,2,1,0.5,0.2,0.1,0.05,0.01,0.005,0.002,0.001]\
  \ |\n| displayInLayerSwitcher | {Boolean} | 如果设置为 true，格网控件将在图层切换器中显示。 | true |\n\
  | visible | {Boolean} | 确定格网控件是否可见。 | true |\n| numPoints | {Integer} | 指定每个格网线使用的点数。\
  \ | 50 |\n| targetSize | {Integer} | 确定地图上网格的最大像素尺寸。 | 200 |\n| layerName | {String}\
  \ | 指定将在 LayerSwitcher 控件中显示的图层名称。 | null |\n| labeled | {Boolean} | 确定是否应为格网线标注标签。\
  \ | true |\n| labelFormat | {String} | 标签将显示的坐标格式。例如，可能的值为 'd'、'dm' 或 'dms'，分别代表\
  \ '度'、'分' 和 '秒'，决定坐标显示的精度。 | 'dm' |\n| lineSymbolizer | {Symbolizer} | 指定用于渲染线的符号化器。符号化器指定样式信息。在第\
  \ 10 章中，我们将详细介绍符号化器及其使用方法。 |  |\n| labelSymbolizer | {Symbolizer} | 用于渲染标签的符号化器，控制标签样式。第\
  \ 10 章详细讨论了符号化器（定义样式的对象）。 |  |\n\n## OpenLayers.Control.KeyboardDefaults\n\n此控件添加了由键盘控制的平移和缩放功能。通过按箭头键、加/减键或\
  \ Home 键，地图将被移动或缩放。我们应该查看一个相关属性。\n\n### KeyboardDefaults 属性\n\n| 名称 | 类型 | 描述 |\
  \ 默认值 |\n|---|---|---|---|\n| slideFactor | {Integer} | 设置地图滑动的像素数。 | 75 |\n\n##\
  \ OpenLayers.Control.LayerSwitcher\n\n此控件将创建一个图层列表，允许您打开/关闭地图图层。默认情况下，它在地图中创建一个可切换的窗口，但您可以传入一个\
  \ div HTML 元素，图层列表将在其中创建。\n\n### LayerSwitcher 属性\n\n| 名称 | 类型 | 描述 | 默认值 |\n|---|---|---|---|\n\
  | ascending | {Boolean} | 更改图层的显示顺序。 | true |\n| roundedCorner | {Boolean} | 指定图层切换器窗口是否应创建圆角。\
  \ | true |\n| div | {HTML Element} | 如果指定，则放置此控件的 HTML 元素。如果使用此选项，应将 roundedCorner\
  \ 属性设置为 false，否则圆角将在目标 div 内创建。示例：document.getElementById('map_control_div'); |\
  \ null |\n\n### LayerSwitcher 函数\n\n我们可以手动调用一些函数来显示或隐藏 LayerSwitcher 控件。\n\n- **minimizeControl()**：调用时，它会最小化图层切换器控件。特别是在您想要以编程方式隐藏图层切换器控件时很有用。\n\
  - **maximizeControl()**：显示图层切换器控件；它基本上与 `minimizeControl()` 相反。\n\n## OpenLayers.Control.MousePosition\n\
  \n此控件显示鼠标当前所在位置的经度和纬度。默认情况下，控件在地图右下角显示位置。\n\n### MousePosition 属性\n\n| 名称 | 类型 |\
  \ 描述 | 默认值 |\n|---|---|---|---|\n| prefix | `{String}` | 将添加到坐标文本开头的字符串。 | `''`\
  \ |\n| suffix | `{String}` | 将添加到坐标文本后的字符串。 | `''` |\n| emptyString | `{String}`\
  \ | 如果鼠标移出地图，则显示的文本将代替坐标。默认情况下，当鼠标移出地图时，最后已知的坐标仍会显示。 | null |\n| separator | `{String}`\
  \ | 将放置在经度和纬度之间的字符串。 | `','` |\n| numDigits | `{Integer}` | 指定显示坐标的小数点后数字的位数（即精度）。\
  \ | 5 |\n\n\n\n| 名称 | 类型 | 描述 | 默认值 |\n|---|---|---|---|\n| displayProjection |\
  \ `{OpenLayers.Projection}` | 控制坐标将以何种投影显示。任何除 `EPSG:4326` 或 `EPSG:900913` 之外的投影都需要\
  \ Proj4js 库来正确地重新投影坐标。如果未设置此属性，则将使用地图的投影。 |  |\n| div | `{HTML Element}` | 如果指定，则为放置此控件的\
  \ HTML 元素。 |  |\n\n## OpenLayers.Control.Navigation\n\n**Navigation** 控件是默认添加到地图的四个控件之一。此控件通过鼠标输入处理地图导航，例如拖动地图和滚动以放大。让我们看一下其中几个属性。\n\
  \n### Navigation 属性\n\n| 名称 | 类型 | 描述 | 默认值 |\n|---|---|---|---|\n| documentDrag\
  \ | `{Boolean}` | 确定当鼠标移出地图视口（即地图 HTML div 元素）时是否允许拖动地图。 | `false` |\n| handleRightClicks\
  \ | `{Boolean}` | 如果设置为 true，地图将拦截右键单击。双击右键时，地图将缩小。 | `false` |\n| zoomWheel | `{Boolean}`\
  \ | 指定鼠标滚轮是否会使地图缩放。 | `true` |\n| autoActivate | `{Boolean}` | 确定控件在添加到地图时是否应被激活。在将此控件添加到面板时可能很有用。\
  \ | `true` |\n\n## OpenLayers.Control.NavigationHistory\n\n**NavigationHistory**\
  \ 控件存储有关（正如你猜到的）地图导航的信息。它实际上是一个创建两个子控件的控件，分别称为 `next` 和 `previous`。你不需要直接访问这些子控件，通常只需要使用\
  \ **NavigationHistory** 控件对象本身的方法即可。通过调用 `nextTrigger()` 或 `previousTrigger()` 函数，你可以在导航历史中向前或向后（如果可能）移动。\n\
  \n### NavigationHistory 属性\n\n| 名称 | 类型 | 描述 | 默认值 |\n|---|---|---|---|\n| limit\
  \ | {Integer} | 指定要存储的历史状态限制。 | 50 |\n| nextStack | {Array} | 包含下一个历史状态的数组。实例化对象时不使用。\
  \ |  |\n| previousStack | {Array} | 包含上一个历史状态的数组。实例化对象时不使用。 |  |\n\n### NavigationHistory\
  \ 函数\n\n有两种函数可以调用来访问导航历史记录。\n\n- **nextTrigger()**：此函数将调用子 `next` 控件的 trigger()\
  \ 函数（也可以通过 `nav_history_control.next.trigger()` 调用）。如果存在下一个位置，它将把地图移动到位置栈上的下一个位置。\n\
  - **previousTrigger()**：此函数将调用子 `previous` 控件的 trigger() 函数（也可以通过 `nav_history_control.previous.trigger()`\
  \ 调用）。如果存在上一个位置，它将把地图移动到位置栈上的上一个位置。\n\n### Time for Action – using the NavigationHistory\
  \ control\n\n让我们使用 **NavigationHistory** 控件的 `nextTrigger` 和 `previousTrigger` 方法来遍历我们的导航历史。\n\
  \n- 1. 打开之前的示例并启用 Firebug。我们将通过控制台创建一个 **NavigationHistory** 控件对象并将其添加到地图中。输入并运行以下代码：\n\
  ```\nvar nav_history_control = new OpenLayers.Control.NavigationHistory();\nmap.addControl(nav_history_control);\n\
  ```\n- 2. 在地图上平移和缩放。每次更新地图时，**NavigationHistory** 控件都会存储有关你操作的信息。然后，在 Firebug 中发出以下命令：\n\
  - 3. 你应该会看到地图返回到之前的缩放级别和坐标。现在，让我们通过调用以下命令返回到之前的位置：\n```\nnav_history_control.previousTrigger();\n\
  ```\n```\nnav_history_control.nextTrigger();\n```\n\n### What Just Happened?\n\n\
  我们刚刚创建并向地图添加了 **NavigationHistory** 控件，然后调用了 `previousTrigger()` 和 `nextTrigger()`\
  \ 方法。\n\n## OpenLayers.Control.NavToolbar\n\nOpenLayers 的 **NavToolbar** 控件创建了一个导航控件按钮工具栏。默认情况下它包含两个按钮——一个用于平移，一个用于缩放。平移模式允许你像在\
  \ **Navigation** 控件中一样在地图上平移；而缩放控件让你可以选择要缩放的范围。如果希望为地图提供额外的自定义功能，此控件尤其方便。\n\n##\
  \ OpenLayers.Control.OverviewMap\n\n**OverviewMap** 控件在地图右下角创建一个可切换的窗口，显示一个较小的、缩小的地图，其中包含一个可拖动的矩形，表示你在地图上的当前位置（即概览地图）。当你放大地图本身时，概览地图会相应更新（尽管，你可以通过在\
  \ `mapOptions` 属性中设置 `numZoomLevels` 属性来关闭此行为）。\n\n![](img/1b8cd151c9f278555f9cf255b20d244e_165_0.png)\n\
  \n你可能熟悉此工具，许多人期望它出现在网络地图上，因为 Google、Bing 等都有类似的控件——因此根据你的应用情况，包含它可能是一个好主意。我们应该介绍一些配置选项。\n\
  \n### OverviewMap 属性\n\n| 名称 | 类型 | 描述 | 默认值 |\n|---|---|---|---|\n| size | {OpenLayers.Size}\
  \ | 设置概览地图的大小，以像素为单位，格式为宽度、高度。示例调用为：`size: new OpenLayers.Size(300,300)`。这将增加概览地图本身的大小，但概览地图所在实际\
  \ div 元素的大小由 CSS 指定。 | `new OpenLayers.Size(180, 90)` |\n| layers | {Array {OpenLayers.Layer}}\
  \ | 指定从地图中用于概览地图的图层数组。如果此处未添加任何图层，默认情况下将使用底图作为概览地图。 | Uses the map base layer by\
  \ default. |\n| minRectSize | {Integer} | 此属性确定范围矩形的最小宽度或高度（以像素为单位），在此之前它将被 `minRectDisplayClass`\
  \ 的值替换。数字越大，范围矩形在被替换前越大。此属性可与 `minRatio` 和 `maxRatio` 属性一起使用，以提供概览地图控件的更自定义行为。 |\
  \ 15 |\n| minRectDisplayClass | {String} | 这指定当达到 minRectSize 值时范围矩形将使用的类名。我们将在下一章关于样式化地图控件的部分更详细地讨论控件样式。\
  \ | 'RectReplacement' |\n| minRatio | {Float} | 此属性有助于确定何时缩小概览地图。此比率通过将概览地图的分辨率除以底图的分辨率来计算。默认值是\
  \ 8。这意味着如果概览地图的分辨率小于主地图分辨率的 8 倍，概览地图将缩小。 | 8 |\n| maxRatio | {Float} | 此属性有助于确定何时放大概览地图。原则与上面相同。默认值是\
  \ 32，意味着如果概览地图的分辨率大于主地图分辨率的 32 倍，概览地图将放大。 | 32 |\n| mapOptions | `{Object}` | 这是一个对象，就像地图对象的\
  \ options 属性一样。它是一个匿名对象，可以包含地图可以包含的相同选项。设置其中一些选项非常有用，尤其是 `numZoomLevels` 属性。例如，`mapOptions:\
  \ {numZoomLevels: 1}` 将导致概览地图永远不会放大或缩小，保持在最大范围。 | `{}` |\n| autoPan | `{Boolean}`\
  \ | 此属性确定是否自动平移概览地图以使范围矩形保持在中间。将此值设置为 `true` 将模仿 Google 地图中的概览地图行为。 | `false` |\n\
  | div | `{HTML Element}` | 如果指定，则为放置此控件的 HTML 元素。如果未指定，**OverviewMap** 控件位于地图右下角。\
  \ |  |\n\n### OverviewMap 函数\n\n- **minimizeControl()**：调用时，它将最小化图层切换控件。如果希望以编程方式隐藏图层切换控件，这尤其有用。\n\
  - **maximizeControl()**：它显示图层切换控件，本质上与 `minimizeControl()` 相反。\n\n## OpenLayers.Control.PanPanel\n\
  \n此控件在地图左上角添加一个平移面板。它包含四张图片：上、左、右、下箭头。单击箭头将按箭头方向平移地图。\n\n\n\n## PanPanel 属性\n\n\
  | 名称 | 类型 | 描述 | 默认值 |\n|---|---|---|---|\n| slideFactor | {Integer} | 类似于 **KeyboardDefault**\
  \ 控制，它设置滑动的像素数。 | 50 |\n\n## OpenLayers.Control.PanZoom\n\n这是在默认情况下添加到地图上的四个控件之一。它在地图左上角添加了\
  \ **PanPanel** 和 **ZoomPanel** 控件。它包含 **PanPanel** 所具有的 `slideFactor` 属性。除此属性外，此控件没有其他需要介绍的属性。\n\
  \n## OpenLayers.Control.PanZoomBar\n\n此控件与 **PanZoom** 控件类似；不过，它还添加了一个带滑块的缩放条，您可以上下移动它来指定缩放级别。我们来看一下其中的几个属性。\n\
  \n## PanZoomBar 属性\n\n| 名称 | 类型 | 描述 | 默认值 |\n|---|---|---|---|\n| zoomWorldIcon\
  \ | {Boolean} | 指定是否应显示缩放至最大范围世界图标。如果设置为 `false`，图标将被隐藏。 | true |\n| div | {HTML\
  \ Element} | 如果指定，则放置此控件的 HTML 元素。 |  |\n\n## OpenLayers.Control.Scale\n\n使用此控件时，地图将以比例形式显示当前地图比例尺（例如\
  \ Scale = 1:443M），默认放置在地图右下角。我们只需要查看一个相关属性。\n\n## Scale 属性\n\n| 名称 | 类型 | 描述 | 默认值\
  \ |\n|---|---|---|---|\n| geodesic | {Boolean} | 确定是否应使用大地测量。如果地图的投影为 `EPSG:900913`，则应将此值更改为\
  \ `true`。设置为 `true` 时，比例尺是根据像素到地图中心的水平尺寸计算得出的。 | false |\n\n## OpenLayers.Control.ScaleLine\n\
  \n**ScaleLine** 控件在地图左下角添加了一条表示比例尺的线。它将使用 km 和 mi，或在放大时使用 m 和 ft（默认）来显示比例尺。通过指定不同的属性值，我们可以更改此行为；让我们来看一下。\n\
  \n## ScaleLine 属性\n\n| 名称 | 类型 | 描述 | 默认值 |\n|---|---|---|---|\n| maxWidth | {Integer}\
  \ | 控制比例尺线的最大宽度，以像素为单位。 | 100 |\n| topOutUnits | {String} | 指定地图缩小时比例尺线顶部栏的缩放单位。\
  \ | km (kilometers) |\n| topInUnits | {String} | 指定地图放大时比例尺线顶部栏的缩放单位。 | m (meters)\
  \ |\n| bottomOutUnits | {String} | 指定地图缩小时比例尺线底部栏的缩放单位。 | mi (miles) |\n| bottomInUnits\
  \ | {String} | 指定地图放大时比例尺线底部栏的缩放单位。 | ft (feet) |\n| geodesic | {Boolean} | 确定是否应使用大地测量。如果地图的投影为\
  \ `EPSG:900913`，则应将此值更改为 `true`。 | false |\n| div | {HTML Element} | 如果指定，则放置此控件的\
  \ HTML 元素。 |  |\n\n## OpenLayers.Control.ZoomPanel\n\n**ZoomPanel** 控件将在地图左上角添加一个缩放面板。它包含通过点击相应图标激活的\
  \ **ZoomIn**、**ZoomOut** 和 **ZoomToMaxExtent** 控件。它是默认添加到地图的 **PanZoom** 控件的一部分！我们对内置控件的概述到此为止！让我们继续另一个相关主题——**Panels**。\n\
  \n## Panels\n\n到目前为止，我们已经介绍了最常用的控件，这些控件将在本书中反复使用。我们尚未讨论的另一种控件类型是 **panel** 控件。它是一个容器，一个控件，允许我们在（你猜对了）面板内添加和分组其他控件。我们实际上已经在讨论的一些控件中或多或少地遇到了面板控件。**PanPanel**\
  \ 和 **ZoomPanel** 控件实际上是包含其他控件的面板。\n\n## Control types\n\n对于面板，每个控件都由一个图标表示（您可以随意设置样式）。当点击图标时，会调用该控件的\
  \ `activateControl` 方法。记住调用 `activateControl` 非常重要——大多数控件不会自行激活（我们很快会更详细地介绍这一点）。我们遇到的一些控件可以放在面板中，正如我们稍后会看到的那样。\n\
  \n面板中的每个控件都有三种“类型”之一：\n\n- `OpenLayers.Control.TYPE_BUTTON`：这是一种按钮类型控件，其行为类似于按钮——当点击时，会触发某些事件。此类型的一个示例控件是我们在此\
  \ **ZoomPanel** 控件中遇到的 **ZoomIn** 和 **ZoomOut** 按钮。\n- `OpenLayers.Control.TYPE_TOGGLE`：此类控件通过一次点击激活，通过另一次点击关闭。打开其中一个控件不会影响其他控件，您可以在同一面板中拥有任意数量的切换控件。\n\
  - `OpenLayers.Control.TYPE_TOOL`：这种类型的控件类似于上面的切换控件，但一次只能有一个 *工具* 类型控件处于活动状态。例如，**ZoomBox**\
  \ 控件就是此类控件之一。\n\n让我们看看如何创建面板以及如何向其中添加控件。\n\n## Time for Action – using Panels\n\n\
  在此示例中，我们将演示如何创建和使用 Panel 类。我们将创建一个面板控件对象，该对象将放置在地图外的 div 中，然后向面板添加控件对象。我们将把面板放在地图外的\
  \ div 元素中。我们首先创建一个 HTML <div> 元素来包含我们的面板。在地图 div 之后添加一个新的 div，如下所示：\n\n```\n<div\
  \ id='panel_div'></div>\n```\n\n1. 现在，我们需要创建一个面板控件对象。我们将首先创建一个 Navigation 控件对象，因为它将充当面板的“默认控件”，这意味着它将是默认激活的控件。然后，我们将创建面板对象并将其放置在之前创建的\
  \ panel_div HTML 元素内。在 init() 函数中添加一个 WMS 层，并在 map.addLayer() 调用之后放置以下代码。\n\n```\n\
  var navigation_control = new OpenLayers.Control.Navigation();\nvar control_panel\
  \ = new OpenLayers.Control.Panel({\n    div: document.getElementById('panel_div'),\n\
  \    defaultControl: navigation_control\n});\n```\n\n2. 让我们向其中添加一些控件。Panel 控件有一个名为\
  \ addControls 的方法，它接受一个控件对象数组。让我们添加一个 ZoomBox 和 ZoomToMaxExtent 控件。请注意，我们传入了 navigation_control，即一个已实例化的对象，而不是即时实例化一个\
  \ Navigation 控件对象。此 navigation_control 对象与 defaultControl 属性指向的同一个控件对象相同。如果我们在这里即时实例化一个\
  \ Navigation 控件对象，defaultControl 属性将指向不同的控件对象。在此数组之外创建导航控件对象可确保我们使用相同的对象。\n\n```\n\
  control_panel.addControls([\n    navigation_control,\n    new OpenLayers.Control.ZoomBox(),\n\
  \    new OpenLayers.Control.ZoomToMaxExtent()\n])\n```\n\n3. 现在我们已经创建了面板，只需将其添加到地图即可。面板控件有一个名为\
  \ autoActivate 的属性，当它被添加到地图时会激活面板控件。默认情况下，它设置为 true。面板必须被激活后才能使用，因此如果将此属性设置为 false，则必须调用面板的\
  \ activate() 方法。同样，如果您希望默认激活的控件不是 defaultControl，则可以调用面板的 activateControl() 方法并传入所需的控件。\n\
  \n```\nmap.addControl(control_panel);\n```\n\n4. 还有一件最后的事情要做。如果现在打开页面，您可能不会在面板中看到任何内容。这是因为控件尚未与任何样式关联。我们将在下一章中全面介绍其背后的原因以及如何自定义控件样式——但现在，只需在页面的\
  \ <head> 部分（<script> 标签之外）放置以下 CSS <style> 标签即可：\n\n```\n<style type='text/css'>\n\
  \    /*Navigation Control*/\n    #panel_div .olControlNavigationItemActive {\n \
  \       background: #226699 url('http://dev.openlayers.org/releases/OpenLayers-2.9.1/theme/default/img/pan_on.png');\n\
  \        width: 22px;\n        height: 22px;\n    }\n    #panel_div .olControlNavigationItemInactive\
  \ {\n        background: #996622 url('http://dev.openlayers.org/releases/OpenLayers-2.9.1/theme/default/img/pan_off.png');\n\
  \        width: 22px;\n        height: 22px;\n    }\n    \n    /*Zoom Box Control*/\n\
  \    #panel_div .olControlZoomBoxItemInactive {\n        width: 22px;\n        height:\
  \ 22px;\n        background:#999933 url('http://dev.openlayers.org/releases/OpenLayers-2.9.1/img/drag-rectangle-off.png');\n\
  \    }\n    #panel_div .olControlZoomBoxItemActive {\n        width: 22px;\n   \
  \     height: 22px;\n        background:#999966 url('http://dev.openlayers.org/releases/OpenLayers-2.9.1/img/drag-rectangle-on.png');\n\
  \    }\n</style>\n```\n\n\n/*Zoom to Max Extent Control*/\n#panel_div .olControlZoomToMaxExtentItemInactive\
  \ {\n  width: 18px;\n  height: 18px;\n  background:#333399 url('http://dev.openlayers.org/releases/OpenLayers-2.9.1/img/zoom-world-mini.png');\n\
  }\n</style>\n\n- 5. 现在打开页面，你应该会看到类似以下内容：\n\n![](img/1b8cd151c9f278555f9cf255b20d244e_174_0.png)\n\
  \n## 发生了什么？\n\n我们刚刚创建了一个面板并在其中放置了三个控件。通过点击面板中的其中一个按钮，你可以激活该控件（具体来说，会调用 activateControl\
  \ 方法）。当创建希望以编程方式激活的面板内部控件时，你必须调用面板的 activateControl 方法，并传入期望的控件对象。如果你点击 ZoomBox\
  \ 控件按钮，你会注意到 Navigation 控件被停用了——一次只能有一个控件处于活动状态。\n\n> 由于面板控件是一个添加到地图上的控件对象，因此面板控件可在\
  \ `map.controls` 数组中使用。对于添加到面板中的控件也是如此。\n\n## 小测验 – zoomBox 控制类型\n\nZoomBox 控制是哪种类型的控件？\n\
  \n- 1. TYPE_BUTTON\n- 2. TYPE_TOGGLE\n- 3. TYPE_TOOL\n- 4. 导航控件没有控制类型\n- 5. TYPE_I_DONT_KNOW\n\
  \n提示：如果你不确定，可以查看 ZoomBox 控件对象的 `type` 属性。\n\n## OpenLayers.Control.Panel\n\n正如我们在前面的示例中看到的，我们能够创建一个面板并将其放置在地图外部的\
  \ `<div>` 元素内。如果我们不指定 `div` 属性，面板将直接添加到地图中。我们制作的面板非常简单，但即使创建更高级的面板也不是太困难。\n\n在我们开始变得过于花哨之前，让我们先回顾一下面板类的属性和方法，这样我们就知道自己在处理什么。\n\
  \n## 面板属性\n\n| 名称 | 类型 | 描述 | 默认值 |\n|---|---|---|---|\n| controls | {Array {OpenLayers.Control}}\
  \ | 指定添加到面板中的控件对象数组。如前例所示，你可以在调用本身中实例化对象（通过 new OpenLayers.Control）或使用之前创建的对象。创建面板时，你需要使用此属性指定面板接收的控件，或使用面板的\
  \ addControls 方法。示例：controls: [new OpenLayers.Control.Navigation(), new OpenLayers.Control.ZoomBox()]\
  \ | [] |\n| autoActivate | {Boolean} | 确定面板在添加到地图时是否应被激活。如果未将其设置为 true，则在使用面板之前必须调用面板的\
  \ activate() 方法。 | true |\n| defaultControl | {OpenLayers.Control} | 指定要激活的默认控件。这应指向面板将拥有或已拥有的控件。如上例所示，你应传入一个已经实例化的控件对象。如果你指定值时实例化对象，而不是传入已创建的对象，则不会发生任何事情，因为默认控件将指向与面板拥有的对象不同的对象。示例：defaultControl:\
  \ my_control_object | null |\n| saveState | {Boolean} | 如果此属性为 true，则面板内部控件的活动状态（即其状态）在面板被停用时将被保存，并在激活时恢复。它还将在首次激活后覆盖\
  \ defaultControl 属性（如果已设置），而是恢复之前处于活动状态的控件。 | false |\n\n## 面板函数\n\nPanel 类目前我们只需要知道两个函数。\n\
  \n-   - **Activate()**：此函数将激活面板控件本身。默认情况下，`autoActivate` 属性设置为 `true`，此函数将自动调用。但是，如果面板默认未激活，则必须调用此函数才能使用面板。\n\
  -   - **activateControl({OpenLayers.Control})**：此函数将激活传入的控件。传入的控件必须是属于该面板的控件。这是在用户点击面板内部控件时被调用的函数。如果你希望手动激活控件，将调用此函数。\n\
  \n## 现在怎么办？\n\n呼！我们已经涵盖了 OpenLayers 提供的大多数控件，并介绍了如何使用面板。有很多内容需要消化，但不要感到不知所措。我们涵盖如此多的原因之一是为了以后如果需要复习如何使用控件或可以用控件做什么时，可以回头参考本章。\n\
  \n因此，现在我们已经完成了这些细枝末节的细节，让我们继续进行一些稍微复杂一点的内容。\n\n## 创建自己的控件\n\n到现在为止，你已经熟悉（或可能厌倦了）控件描述。让我们让事情变得更有趣一些，自己创建一个控件。计划如下：\n\
  \n- 1. 快速讨论 Button 控件类。\n- 2. 创建一个具有自定义功能的 Button 控件。\n- 3. 将按钮添加到面板中。\n- 4. 哇！你刚刚创建了自己的自定义控件。\n\
  \n因此，在我们讨论创建自定义按钮之前，让我们先回顾一下上面部分中未涵盖的 **Button** 子类，我们将用它来创建自定义控件。\n\n## OpenLayers.Control.Button\n\
  \n这里其实没什么好讲的，因为我们已经介绍过基础控件类。我们需要讨论的两个属性是 `type` 和 `displayClass` 属性。我们在创建自己的自定义控件时会使用这两个属性。\n\
  \n## 按钮属性\n\n| 名称 | 类型 | 描述 | 默认值 |\n|---|---|---|---|\n| type | {Integer} | 这是一个整数，表示此按钮控件的类型。这是我们之前讨论的内容——按钮类型。OpenLayers.Control.TYPE_BUTTON\
  \ 用 1 表示，OpenLayers.Control.TYPE_TOGGLE 用 2 表示，OpenLayers.Control.TYPE_TOOL 用 3\
  \ 表示。默认情况下，作为 OpenLayers.Control.TYPE_BUTTON 控件，其值为 1。但是，通过更改此属性的值，你可以更改其控件类型。你可以通过使用\
  \ {Integer} 数字（如 2）或使用内置常量名称来指定类型。常量名称以 OpenLayers.Control 开头，后跟控件类型（如 OpenLayers.Control.TYPE_BUTTON）。两种方法都能达到相同的效果，但使用常量名称更简洁、更易读。\
  \ | 1 (or OpenLayers.Control.TYPE_BUTTON) |\n| displayClass | {String} | 此字符串将指定按钮将被赋予的\
  \ CSS 类名称。例如为 'olControlMyButton'。你指定的任何类，OpenLayers 都会在末尾自动加上 'ItemInactive'。如果它是可切换的按钮，则在按钮激活时会在末尾加上\
  \ 'ItemActive'。我们将在下一章详细介绍这一点。如果未定义此属性，它将获得默认值 'olControlButtonItem'（末尾加上 'Inactive'\
  \ 或 'Active'）。 | olControlButtonItemInactive |\n\n## 按钮函数\n\n这里我们也只需要介绍一个函数。此函数的主要用途之一是我们通常在实例化按钮对象时将其传入。\n\
  \n-   - **trigger()**：此函数在点击控件按钮时被调用（假设它是一个 `OpenLayers.Control.TYPE_BUTTON` 控件）。如果我们在创建按钮时未定义它（或在按钮创建后定义它），点击按钮时不会发生任何事情。当在创建按钮对象时将此作为属性传入时，应传入函数返回代码（函数名称），而不是实际的函数。因此，要在实例化时定义它，请在\
  \ `new OpenLayers.Control.Button` 调用之外创建一个函数，然后将该函数名称作为 trigger 引用。例如，\n\n```\n\
  var my_func = function(){ alert( 'Stop clicking me'); }\nvar my_button = new OpenLayers.Control.Button({\
  \ trigger: my_func\n});\n```\n\n## 创建自定义按钮\n\n你现在对 Button 类有了更多的了解，让我们将这些知识付诸实践。我们将创建一个相当简单的自定义按钮（控件类型为\
  \ `TYPE_BUTTON`），它将更新底图层的透明度并将地图缩放到随机位置。我们将介绍创建按钮时应包含的几个基本内容：\n\n-   - 指定按钮的 `displayClass`\
  \ 以赋予其样式（可选）\n-   - 创建一个函数并将其设为触发函数\n-   - 将按钮添加到面板中，然后将该面板添加到地图中\n\n## 动手实践 – 创建一个简单按钮\n\
  \n让我们创建一个具有 CSS 类并且包含触发函数、点击时执行一些操作的简单按钮。\n\n- 1. 使用第 1 章中的地图模板创建一个新页面。我们将创建一个按钮和一个放置按钮的面板（不过这次面板将在地图内部）。\n\
  \n\n\n\n2. 在创建按钮之前，让我们先创建一个函数，该函数将在通过 `trigger` 函数点击按钮时被调用。我们实际上要创建一个变量并为其分配一个函数——这正是\
  \ JavaScript 如此强大的原因之一。让我们让该函数更改地图图层的透明度并缩放至随机坐标。在 `init()` 函数内部，添加一个 WMS 图层，并在\
  \ `map.addLayer(wms);` 调用之后添加以下内容。它将生成一个随机坐标，将地图中心设置为该坐标，并更改 WMS 图层的透明度：\n\n```js\n\
  var custom_button_func = function(){\n    //Get a random coordinate from -90 to\
  \ 90\n    var random_lon = Math.floor(Math.random() * 360) - 180;\n    var random_lat\
  \ = Math.floor(Math.random() * 180) - 90;\n\n    if(map.layers[0].opacity === 1){\n\
  \        //If the layer opacity is 1 (fully opaque), then change it and zoom\n \
  \       map.layers[0].setOpacity(.5);\n        map.setCenter(new OpenLayers.LonLat(random_lon,\n\
  \        random_lat), 3);\n    }\n    else{\n        //If the layer opacity is anything\
  \ but 1, change it and zoom\n        map.layers[0].setOpacity(1);\n        map.setCenter(new\
  \ OpenLayers.LonLat(random_lon,\n        random_lat), 3);\n    }\n};\n```\n\n3.\
  \ 现在让我们创建按钮控件对象。我们将为其分配一个 CSS 类，并将 `trigger` 设置为我们刚刚创建的 `custom_button_func`。因此，当按钮被点击时，`custom_button_func`\
  \ 函数将被调用。注意我们只是传入了函数名称（也称为函数的返回代码），并且在调用函数时通常使用的括号并没有使用。\n\n```js\nvar custom_button\
  \ = new OpenLayers.Control.Button({\n    displayClass: 'olControlCustomButton',\n\
  \    trigger: custom_button_func\n});\n```\n\n4. 让我们创建一个面板来存储新创建的按钮。我们不会传入 div，因此它将直接添加到地图中。\n\
  \n```js\nvar control_panel = new OpenLayers.Control.Panel({});\n```\n\n5. 我们已经创建了面板，现在需要将自定义按钮添加到其中。即使我们只有一个控件，仍然必须调用\
  \ addControls，因为 Panel 类没有单一的 addControl 方法。\n\n```\ncontrol_panel.addControls([\n\
  \    custom_button\n])\n```\n\n6. 几乎完成了！现在，让我们将面板添加到地图中：\n\n```\nmap.addControl(control_panel);\n\
  ```\n\n7. 现在，默认情况下，面板将出现在地图的左上角。我们可以通过 CSS 来更改它，但让我们坚持到目前为止所涵盖的内容，使用 moveTo 函数，将面板向右移动\
  \ 450 像素（原点是地图的左上角）。\n\n```\ncontrol_panel.moveTo(new OpenLayers.Pixel(450,0));\n\
  ```\n\n8. 最后一点，如果我们现在查看地图，我们将看不到按钮。这是因为我们为其分配了自定义 CSS 类，但尚未定义该类。因此，让我们在 <head> 部分、<script>\
  \ 标签之前添加以下内容。即使我们的 displayClass 设置为 olControlCustomButton，我们也必须定义 olControlCustomButtonItemInactive，因为这是\
  \ OpenLayers 为按钮非活动状态生成的实际类名。\n\n```\n<style type='text/css'>\n  /*Custom Button*/\n\
  \  .olControlCustomButtonItemInactive {\n    background:#22dd22;\n    border:5px\
  \ solid #202020;\n    cursor: pointer;\n    height: 28px;\n    width: 28px;\n  }\n\
  </style>\n```\n\n9. 好的。查看地图。你应该在地图的右上角看到一个又大又难看的按钮：\n\n![](img/1b8cd151c9f278555f9cf255b20d244e_182_0.png)\n\
  \n## 发生了什么？\n\n我们刚刚创建了一个相当简单的按钮控件，点击时它会更改地图的透明度和中心位置。在下一章中，我们将更详细地讨论如何使用 CSS 使其看起来像一个按钮，而不是一个丑陋的绿色方块。在结束本章之前，让我们再回顾一件事——创建一个控件类型与我们刚刚创建的\
  \ `TYPE_BUTTON` 控件不同的自定义按钮。\n\n## 其他控件类型\n\n因此，在之前的示例中，我们创建了一个类型为 `TYPE_BUTTON`\
  \ 的按钮控件。它按我们期望的方式工作，但如果我们希望它可以切换呢？我们从本章前面知道，存在 `TYPE_TOOL` 和 `TYPE_TOGGLE` 按钮类型，并且我们提到过如何将按钮分配为这些类型之一。\n\
  \n## 创建其他按钮控件类型的流程\n\n虽然有几种不同的方法可以实现这一点，但流程基本上归结为以下几点：\n\n- 创建一个控件对象（通过扩展基础 Control\
  \ 类——一种更高级的技术，或通过创建 Button 控件）并指定 `type`\n- 指定在某些事件发生时将被调用的函数（例如，当控件被激活时）\n\n为了保持简单并实现这一点，我们将像前一个示例中那样创建一个\
  \ Button 控件。然后，我们将指定 `eventHandlers`，当控件被激活时它们将调用函数。但什么是事件？\n\n## 事件\n\n事件基本上就是字面意思——某事正在发生。实际上，所有用户输入都是事件——按键、鼠标点击等都是事件。\n\
  \n使用 JavaScript，我们能够访问用户生成的事件，例如鼠标点击，并在事件发生时执行操作。事件驱动着 OpenLayers 中的交互——当你拖动地图时，你实际上是在发出一个鼠标事件，OpenLayers\
  \ 会解释它然后相应地更新地图。\n\nOpenLayers 有自己的 Event 类，这使得与事件的交互变得更容易，甚至使我们能够创建自己的自定义事件。我们现在不会深入探讨这个问题，但我们应该简要谈谈被称为事件处理程序的东西。\n\
  \n## 事件监听器和处理器\n\n如果你理解了前面的段落，那么你可能能够猜出事件处理程序（和监听器）是什么。本质上，事件监听器是监听事件的东西，而事件处理程序是响应事件的东西。\n\
  \n考虑我们在前一个示例中创建的按钮控件。控件会等待有人点击它——这就是事件监听器。当按钮被点击时，`trigger` 函数会被调用——这就是事件处理程序。因此，在\
  \ OpenLayers 中，**事件监听器** 用于向某些事件类型（如点击或鼠标悬停）添加 **事件处理程序** 函数。\n\n## 自定义事件\n\n虽然用户创建的事件给了我们很多可操作的内容，但如果我们能处理除鼠标点击和按键之外的其他事件，生活会更轻松。如果我们能与由地图本身触发而不是由用户触发的事件进行交互，那么我们就可以做很多更有趣和巧妙的事情。当然，如果\
  \ OpenLayers 没有提供这种能力，我们也不会构建这个概念。\n\n虽然我们在这里不会创建自己的自定义事件，但我们将使用自定义事件。当你点击一个 `TYPE_TOGGLE`\
  \ 控件按钮时，会触发一个名为 `activate` 的自定义事件。反过来，如果我们想在那时调用某个函数，我们可以将 `eventHandler` 分配给 `activate`\
  \ 事件。我们将在创建更高级的自定义控件时详细讨论这一点。\n\n## 创建 TYPE_TOGGLE 控件\n\n现在是时候使用 `TYPE_TOGGLE` 和\
  \ `TYPE_TOOL` 创建更多自定义控件了。要做到这一点，需要发生两件事——我们必须创建控件对象，然后必须分配在控件被激活时调用的函数（即事件处理程序）。上一节关于事件的内容用于解释事件背后的理论，但如果你有点困惑也不用担心。我们将通过代码来澄清我们将要讨论的内容。开始吧！\n\
  \n## 动手实践 – 创建自定义 TYPE_TOGGLE 控件\n\n我们将创建一个 `TYPE_TOGGLE` 控件按钮。我们实际上将以两种方式使用事件。我们将使用事件在控件被激活/停用（即切换）时调用函数。这个激活/停用概念很重要，因为如果控件未被激活，我们就无法使用它们。\n\
  \n当切换控件被激活时，被调用的 `activate()` 函数将向地图添加一个事件处理程序。地图事件处理程序将查找点击事件，并在点击时调用一个函数，该函数更新基础图层的透明度。当控件被停用时，被调用的\
  \ `deactivate()` 函数将移除地图事件处理程序。\n\n1. 打开之前的示例。我们将以此作为本示例的基础。我们实际上不需要在那里更改任何内容，所以让我们继续开始创建我们的按钮！\n\
  \n\n\n2. 首先，我们将创建在地图被点击时随机更改地图底图透明度的函数。这仅在我们的切换控件处于激活状态时发生。在 `map.addControl(control_panel);`\
  \ 行之前插入以下内容：\n\n```javascript\n//Function that the map will call when the map is\
  \ clicked (only when\n// the toggle button is active though)\nvar map_event_function\
  \ = function(){\n    map.layers[0].setOpacity(Math.random());\n}\n```\n\n3. 在创建\
  \ `TYPE_TOGGLE` 按钮之前，我们需要创建两个函数：一个在激活时调用，一个在停用时调用。这与我们在前一个示例中所做的类似。让我们在上一段代码之后这样做：\n\
  \n```javascript\n//Create a function for the toggle button\nvar toggle_button_activate_func\
  \ = function(){\n    //Attach the map_event_function to the map\n    map.events.register('click',\
  \ map, map_event_function);\n}\n\nvar toggle_button_deactivate_func = function(){\n\
  \    //Remove the map_event_function from the map\n    map.events.unregister('click',\
  \ map, map_event_function);\n\n    //Restore the layer's opacity\n    map.layers[0].setOpacity(1);\n\
  }\n```\n\n4. 现在，我们需要创建切换控件本身。格式与之前类似，但我们将使用一些不同的属性。因为这是一个切换控件，我们不会使用触发函数。相反，我们将添加两个事件监听器——一个用于激活事件，另一个用于停用事件。我们还将类型设置为\
  \ `OpenLayers.Control.TYPE_TOGGLE`（`TYPE_TOGGLE` 类型——我们也可以将类型设置为 2 来实现同样的效果，但使用内置的常量名称可读性更高）。在下一行添加以下内容：\n\
  \n```javascript\n//Create the toggle button object\nvar custom_toggle_button = new\
  \ OpenLayers.Control.Button({\n    displayClass: 'olControlCustomButtonToggle',\n\
  \    eventListeners: {\n        'activate': toggle_button_activate_func,\n     \
  \   'deactivate': toggle_button_deactivate_func\n    },\n    type: OpenLayers.Control.TYPE_TOGGLE\n\
  })\n```\n\n5. 你大概能猜到下一步——将控件添加到面板中。很容易！\n\n```javascript\ncontrol_panel.addControls([custom_toggle_button]);\n\
  ```\n\n6. 现在，只需确保 control_panel 已添加到地图中：\n\n```javascript\nmap.addControl(control_panel);\n\
  ```\n\n7. 最后，我们只需要添加适当的 CSS 类。我们给切换控件的类名是 olControlCustomButtonToggle，因此我们需要添加相应的类。因为这是一个切换控件，实际上我们需要两个\
  \ CSS 类——一个用于激活状态，另一个用于非激活状态。在 <head> 部分的 <style> 标签内添加以下内容：\n\n```css\n/*Custom\
  \ Toggle Button*/\n\n.olControlCustomButtonToggleItemActive {\n    background:#336699;\n\
  \    border:5px solid #202020;\n    cursor: pointer;\n    height: 28px;\n    width:\
  \ 28px;\n}\n.olControlCustomButtonToggleItemInactive {\n    background:#003366;\n\
  \    border:5px solid #202020;\n    cursor: pointer;\n    height: 28px;\n    width:\
  \ 28px;\n}\n```\n\n8. 全部完成！当你点击新创建的控件时，activate() 事件会被触发，并且由于我们为其添加了事件监听器，相应的 toggle_button_activate_func\
  \ 将被调用。它将向地图添加一个事件处理程序，等待点击。当鼠标点击事件触发时，底层的透明度将被设置为 0（完全透明）到 1（完全不透明）之间的某个随机值。然后，当再次点击切换控件时，它将被停用，图层将恢复完全不透明。\n\
  \n![](img/1b8cd151c9f278555f9cf255b20d244e_187_0.png)\n\n## 发生了什么？\n\n你现在可能已经对我们刚刚制作的控件的工作原理有了一个很好的了解。快速回顾一下，发生以下情况：\n\
  \n- 1. `custom_toggle_button` 切换控件等待 `activate` 或 `deactivate` 事件被触发（这些是自定义的 OpenLayers\
  \ 事件，而不是像鼠标点击那样的通用 JavaScript 事件）。这是通过使用 `map.events.register` 注册事件来完成的。\n- 2. 当点击\
  \ `custom_toggle_button` 控件时（这会将其切换为开启），`activate_control` 事件被检测到，对应的 `toggle_button_activate_func`\
  \ 函数将被调用。\n- 3. 被调用的 `toggle_button_activate_func` 函数随后向地图添加一个事件监听器（再次使用 `map.events.register`）。\n\
  - 4. 此事件监听器将等待 `click`（鼠标点击，一个通用 JavaScript 事件），然后每次收到点击时触发 `map_event_function`。\n\
  - 5. 当 `custom_toggle_button` 控件按钮接收到 `deactivate` 事件时（即它被点击并切换为关闭），对应的 `toggle_button_deactivate_func`\
  \ 函数将被调用。\n- 6. `toggle_button_deactivate_func` 函数使用 `map.events.unregister` 移除之前添加的地图事件监听器。因此，监听器已不存在，地图上的鼠标点击将不再导致\
  \ `map_event_function` 被触发。\n\n就这些了！\n\n![](img/1b8cd151c9f278555f9cf255b20d244e_188_0.png)\n\
  \n> 使用面板内的面板和控件时，请确保控件通过 `activate()` 或面板的 `activateControl()` 方法被激活。如果控件未被激活（或用户无法通过点击控件等方式激活），则控件无法使用。\n\
  \n## 摘要\n\n本章我们涵盖了相当多的内容。我们讨论了控件背后的概念以及它们在 OpenLayers 中的使用方式。然后我们演示了如何将控件添加到地图中。我们深入介绍了\
  \ Control 类及其各种子类。我们还介绍了如何设置面板以及如何向其添加控件。为了结束本章，我们介绍了事件并学习了如何创建自己的自定义控件。\n\n尽管本章已经相当详尽，但关于控件仍有更多内容需要学习——例如如何设置它们的样式。在第\
  \ 9 章《Vector 层类》中，我们将介绍一些我们忽略的特定于 Vector 层的控件。本章内容可能很多，但下一章会短一些。我们将讨论使用 CSS 设置控件样式，并制作看起来像是应该被点击的控件，而不仅仅是大的绿色和蓝色方块。\n"
- "# 7 控件样式\n\n*到目前为止，我们已经看到如何自定义 OpenLayers 提供的几乎所有内容——图层、控件等。然而，我们并没有太关心地图界面的实际外观。*\n\
  \n*OpenLayers 提供了外观相当不错的默认控件，因此你可能不需要更改它们。不过，与 OpenLayers 中的几乎所有其他内容一样，更改 Control\
  \ 类使用的样式和图像也很简单。*\n\n*我们在上一章讨论了 Control 类，在本章中我们将探讨 OpenLayers 如何为控件应用样式以及如何自定义控件。*\n\
  \n本章我们将：\n\n- 讨论 CSS 是什么以及它的作用\n- 讨论 HTML 如何使用 CSS\n- 介绍 OpenLayers 如何使用 CSS\n-\
  \ 介绍 OpenLayers 为控件使用的命名方案\n- 为控件提供一些自定义样式\n\n让我们开始吧！\n\n## 什么是 CSS？\n\n**CSS**\
  \ 是 **Cascading Style Sheets**（层叠样式表）的缩写。它是一种用于指定 HTML 元素外观的标记语言。CSS 其实相当简单，如果你能跟上本书到目前为止的内容，你绝对不会有任何问题。在更深入地了解之前，让我们先谈谈\
  \ CSS 的工作原理。\n\n## CSS 和 HTML 背后的思想\n\n**HTML**、**CSS** 和 **JavaScript** 各自服务于三个不同的目的。\n\
  \n- **HTML** 如我们所见，用于创建网页的结构和 *内容*\n- **CSS** 另一方面，用于控制网站的 *呈现*，即页面应如何显示\n- **JavaScript**\
  \ 如本书所述，用于处理网站背后的 *逻辑*\n\n因此，当你制作一个网站时，至少需要考虑三个独立的部分——背后的 HTML、为 HTML 赋予样式的 CSS，以及处理任何逻辑或用户交互的\
  \ **JavaScript**。目前，我们将重点关注 HTML 和 CSS。\n\n理想情况下，HTML、CSS 和 JavaScript 不应混合（即，你不应在\
  \ HTML 中使用 style 标签或像 `<center>` 这样的标签）。你的 HTML 页面应链接到外部 JavaScript 和 CSS 文件，尤其是在生产环境中。遵循这一原则的一个优点是，如果你想更改网站的外观，只需在一个地方（外部文件）编辑\
  \ CSS，而不是在每个页面上编辑。缺点是如果所有内容都包含在同一个 HTML 文件中，编辑起来会稍微更容易、更快；这就是我们到目前为止一直这样做的原因。\n\n\
  但我们如何编辑 CSS，这到底是什么意思？\n\n## 编辑 CSS\n\n如果你熟悉 CSS，请随意跳过接下来的几页，直接进入关于 *OpenLayers 如何使用\
  \ CSS* 的第二部分。如果你不熟悉，也不用担心！它非常简单。\n\nCSS 不是编程语言；事实上，你已经熟悉它的结构。让我们看看应用 CSS 样式的“模板”代码：\n\
  \n```\nelement {\n    property: value;\n    property-two: value;\n}\n```\n\n\n\n\
  看起来很熟悉吗？它本质上就是 JavaScript 中匿名对象 的样子。主要区别在于每行末尾需要分号（;）（而不是逗号）。\n\n![](img/1b8cd151c9f278555f9cf255b20d244e_191_0.png)\n\
  \n> 你会注意到我们这里也有 属性：值（键：值 对）。存在许多不同的可能属性和值。我们将在本章后面介绍常见的内容，但完整列表可以在 http://www.w3schools.com/css/css_reference.asp\
  \ 找到。\n\n另一个区别，你会注意到的是，在方括号前面有一个叫做 element 的东西。这指的是一个或多个 HTML 元素——通过标签名、类名或 ID。多个元素用逗号分隔。\n\
  \n## HTML 元素\n\n到目前为止，我们只谈了一点点关于 HTML 中的元素。你的 HTML 页面中的每个 <tag> 都是一个元素（例如，<div id='my_div'>This\
  \ div is an element</div>）。现在，要使用 CSS，我们必须有一种方法来引用我们想要设置样式的元素（们）。这是上面 CSS 代码大纲中的\
  \ element 部分。\n\n![](img/1b8cd151c9f278555f9cf255b20d244e_191_1.png)\n\n> DOM（Document\
  \ Object Model）是一种表示页面中对象（例如这些元素）的方式。我们现在不会深入讨论它，但如果你有兴趣了解更多，那么 http://w3schools.com/dom/default.asp\
  \ 是一个很好的资源。\n\n## HTML—ID 和类\n\n我们可以通过两种主要方式引用特定元素：通过 ID 或类名。\n\n### HTML ID\n\n\
  每个 HTML 元素都可以有一个 ID。ID 是唯一的，并且没有元素应该共享相同的 ID。例如，\n\n```\n<div id='map_element'></div>\n\
  ```\n\n使用这段代码，我们创建了一个 ID 为 'map_element' 的 div 元素——没有其他元素（无论是 div 还是其他）应该有相同的 ID。因此，当我们想要引用一个特定元素时，ID\
  \ 非常有用。我们已使用 ID 属性来指定地图应该出现在哪一个 div 中（通过 <div id='map_element'></div> 并在实例化地图对象时指定\
  \ map_element）。\n\n### HTML 类\n\n还有另一种引用元素的方式，通过 **类名**。HTML 中的类与你在 JavaScript 中习惯的类几乎没有共同之处。你在\
  \ HTML 中关于类真正需要知道的只是，与 ID 不同，类名可以多次使用（这主要是它们的设计目的），并且一个元素可以有多个类名（用单个空格分隔）。\n\n那么，这在\
  \ HTML 中看起来是什么样子的？\n\n```\n<div id='some_div' class='some_class_1'></div>\n<div\
  \ id='some_other_div' class='some_class1 some_class2'></div>\n```\n\n这里，我们有两个不同的\
  \ div 元素，每个都有不同的 ID。然而，这两个元素都共享类 `some_class1`，并且会接收该类包含的任何属性。第二个 div 也会继承类 `some_class2`\
  \ 包含的任何属性。\n\n## 使用 CSS 样式化 HTML 元素\n\n现在我们知道了 HTML 如何使用类和 ID，我们可以学习如何将它们与 CSS 一起使用。具体来说，我们如何在\
  \ CSS 代码中引用 `element`？在 CSS 中指定元素有三种方式：\n\n**元素类型**：单独指定元素的名称将把样式应用到所有该类型的元素。例如：\n\
  \n```\ndiv {\n  color: #ff0000;\n}\n```\n\n这将把颜色 #ff0000（红色）应用到所有 div 元素。\n\n**元素\
  \ ID**：指定 ID 将导致样式仅应用于具有指定 ID 的元素。为此，在期望的 ID 前放置一个八进制符号（井号或磅符号，#）。例如：\n\n```\n#map_element\
  \ {\n  height:500px;\n  width:500px;\n}\n```\n\n**元素类名**：指定类名将导致样式应用于所有具有期望类名的元素。为此，在类名前放置一个句点。例如：\n\
  \n```\n.some_class1 {\n  color:#0000ff;\n}\n```\n\n## 在代码中使用 CSS\n\n我们现在知道如何引用元素了，但如何在\
  \ HTML 中使用 CSS 呢？有三种方法：\n\n- **包含外部 CSS 文件：** 这是在 HTML 页面中添加 CSS 的首选方式，因为如果我们需要更改样式，只需在一个地方更改即可。其原理与包含外部\
  \ JavaScript 文件的方式类似——我们基本上指向一个外部 CSS 文件，页面会读取它。为此，我们在 HTML 页面的 `<head>` 部分放置一个\
  \ `<link>` 标签。例如：\n\n```\n<link rel='stylesheet' href='style.css' />\n```\n\n`rel`\
  \ 属性指定链接是一个样式表，而 `href` 指定 `.css` 文件本身的位置。\n\n- **在 `<head>` 标签中 `<style>` 标签内包含\
  \ CSS：** 这是指定 CSS 的另一种方式，但是最不理想的方式，因为如果我们想更改某些样式，就必须在每个页面上更新它。然而，当只使用一个文件时，这并不是什么大问题，这也是为什么到目前为止我们在本书中一直这样做的原因。在\
  \ `<head>` 标签中，你可以添加一个 `<style>` 标签，其中包含所有 CSS 定义。`<style>` 标签内的所有内容都被解释为 CSS 代码，与\
  \ `<script>` 标签内的代码被视为 JavaScript 代码类似。\n\n- **作为元素上的 style 属性包含“内联”CSS 定义：** 我们在前几章中见过这一点。style\
  \ 属性引号内的所有内容都被视为 CSS 代码。一个例子是：\n\n```\n<div id='map_element' style='height:500px;\
  \ width:500;' ></div>\n```\n\n```\n<link rel='stylesheet' href='style.css' />\n\
  ```\n\n```\n<div id='map_element' style='height:500px; width:500;' ></div>\n```\n\
  \n![](img/1b8cd151c9f278555f9cf255b20d244e_193_0.png)\n\n对于熟悉 `<link>` 标签的人来说，你可能会注意到我们只包含了\
  \ rel 和 href 属性。在 HTML5 中，我们不需要指定 type 属性，HTML5 是写作时的当前 HTML 版本。\n\n## 动手时间 – 使用外部\
  \ CSS 文件\n\n让我们创建一个简单的页面，使用外部 CSS 样式表文件（一个 .css 文件），并使用 ID 和类。\n\n- 1. 创建一个新、空的\
  \ HTML 文件。我们只需制作一个基本的 HTML5 页面，其中包含几个 `<div>` 标签来演示 CSS 继承。我们还将包含一个 `<link>` 标签，该标签将引用在下一步中创建的\
  \ CSS 文件，其中包含我们所有的 CSS 代码。\n- 2. 首先，我们需要用一个 `DOCTYPE` 标签开始 HTML 页面，告诉浏览器这是一个 HTML5\
  \ 标准页面。然后，我们需要一个 `html` 标签和一个 `head` 标签，其中包含一些元信息（例如 `title` 标签），以及我们的 JavaScript\
  \ 和 CSS 文件链接。\n- 3. 现在，我们需要创建一个 `body` 标签，其中将包含页面的实际内容。我们还将放入一些 `div` 标签，它们充当内容块。每个\
  \ `div` 元素将有一个唯一的 ID。每个 div 也将至少有一个类。类可以被多个元素使用，并且你可以通过用空格分隔类名来将多个类应用于一个元素：\n- 4.\
  \ 创建一个名为 `ex1_style.css` 的文件并放入以下代码。我们将为 `body` 标签指定一个 `background` 和文本 `color`\
  \ 属性。因为元素从其父元素继承样式，所以每个元素都会收到这两个属性（但它们可以被覆盖）：\n\n```\n<!DOCTYPE html>\n<html lang='en'>\n\
  <head>\n    <meta charset='utf-8' />\n    <link rel='stylesheet' href='ex1_style.css'\
  \ />\n    <title>Ugly_Webpage_01</title>\n</head>\n```\n\n```\n<body>\n    <div\
  \ id='title' class='background_green'>\n        Hello world!\n    </div>\n    <div\
  \ id='content' class='background_green align_left'>\n        The cake is a lie.\n\
  \        <div id='message' class='align_left'>\n            Hello, world.\n    \
  \    </div>\n    </div>\n</body>\n</html>\n```\n\n```\nbody {\n    background:#ffffff;\n\
  \    color:#000000;\n}\n```\n\n- 5. 让我们通过 # 符号指定元素的样式，ID 用于指定单个元素。这将导致具有指定 ID 的元素被样式化；然而，我们将定义它。我们还将通过使用句点（.）来指定类的样式。在\
  \ CSS 中，类用于将样式应用于多个元素：\n\n```\n#title {\n    font-size:1.5em;\n    font-variant:\
  \ small-caps;\n}\n#content {\n    background:#ababab;\n    color:#f0f0f0;\n    font-weight:bold;\n\
  \    text-align:right;\n}\n    #message {\n        background:#336699;\n    }\n\
  .background_green {\n    background: #22dd22;\n}\n.align_left {\n    text-align:left;\n\
  }\n```\n\n- 6. 你应该会看到类似这样的内容：\n\n![](img/1b8cd151c9f278555f9cf255b20d244e_195_0.png)\n\
  \n## 发生了什么？\n\n我们演示了本章迄今为止所讨论的内容，包括包含外部 CSS 文件以及使用 ID 和类名引用元素。你可能想知道为什么有些样式被应用而有些没有。让我们快速回顾一下原因，然后继续学习\
  \ OpenLayers 如何使用 CSS。\n\n\n\n> 在 CSS 中，你可以使用 /* 开始注释，并使用 */ 结束它。例如，/* This is a\
  \ comment */\n\n## 动手试试 – 在 Firebug 中查看 HTML 和 CSS\n\n打开 Firebug 并访问任意网站。Firebug\
  \ 会自动构建 HTML 树，并在 Style 选项卡中填充网站的样式信息。随意探索并尝试使用 Firebug 修改值，你就能立即看到站点外观根据 Firebug\
  \ 应用的样式而发生变化。\n\n## 级联样式表—继承\n\nCSS 使用的继承方式与我们在 JavaScript 中的类类似。对于 CSS，子元素可以继承其父元素的属性，同时也可以覆盖它们。因此，如上例所示，我们的\
  \ body 元素文本颜色（color 属性）为黑色（#000000）。这意味着 body 元素内的任何元素（实际上是页面上几乎所有 HTML 元素）都会接收\
  \ color:#000000 属性，除非被覆盖。\n\n这就是 CSS 中“级联”部分发挥作用的情况。样式会“级联”向下，因此子元素（最“底部”的元素）中发现的属性会覆盖其从父元素（其上方的元素）继承的属性。\n\
  \n## 继承顺序\n\n在尝试确定元素将接收哪种样式时，任何来自类名的样式都会覆盖基础元素样式，而任何来自 ID 的样式都会覆盖类样式。请看以下代码：\n\n\
  ```\n<div id='my_element' class='random_class'> Some text </div>\n<style>\n.random_class\
  \ { color: #00ff00; }\n#my_element { color: #ff0000; }\ndiv { color: #000000; }\n\
  </style>\n```\n\n在此代码中，该元素的最终颜色为 #ff0000。基础元素（div 样式）会被 .random_class 类样式覆盖，然后类样式会被\
  \ #my_element ID 样式覆盖。因此，重要性顺序为 ID > class > 基础元素类型。\n\n在属性值后使用 !important 声明可确保该属性不会被其子元素覆盖。但是，如果其中一个子元素在该属性上包含\
  \ !important 声明，则它将被覆盖。\n\n## 引用元素\n\n我们可以用 CSS 做的一件非常有用的事情是使用我们刚刚谈到的继承。\n更具体地说，我们可以写：\n\
  \n```\n#my_element div {\n  background: #2222ff;\n}\n```\n\n这将仅对 #my_element 的子元素中的\
  \ div 元素应用背景颜色。\n这种嵌套可以深浅随意——只需用空格分隔元素。例如：\n\n```\n#my_element #my_inner_element\
  \ .random_class a {\n  font-weight: bold;\n}\n```\n\n这将应用于 #my_element 内的 ID 为 my_inner_element\
  \ 的元素内的 class 为 random_class 的元素内的所有 a 元素（锚点标签，由 <a> 指定）。如果我们想将相同样式应用于多个元素，我们只需指定元素并在它们之间放置逗号：\n\
  \n```\n#my_element1, #my_element2, .random_class {\n  color:#cdcdcd;\n}\n```\n\n\
  好了，我们已经介绍了 CSS 和 HTML 元素引用的基础知识，那么让我们看看 OpenLayers 如何使用 CSS。\n\n## 小测验 – 如何引用元素\n\
  \n请看以下代码。尝试想出至少三种不同的方式来引用 inner_most span 元素。提示——想想如何通过继承访问它。\n\n```\n<div id='outer_div'>\n\
  \  <p class='paragraph_style'>\n    <div id='middle_div'>\n      <span id='inner_most'>\n\
  \      </span>\n    </div>\n  </p>\n</div>\n```\n\n## OpenLayers 与 CSS\n\nOpenLayers\
  \ 会为其创建的大多数 HTML 元素应用类名和 ID，因此一旦我们知道它如何生成类名和 ID，自定义地图的 UI 就非常容易。在谈论如何覆盖样式之前，我们需要知道样式文件本身在哪里。\n\
  \n## 样式化 OpenLayers—使用主题\n\n在 OpenLayers 中，主题用于控制 UI 元素的外观。主题由 CSS 文件和任何相关的用户界面图像组成。OpenLayers\
  \ 默认使用名为 `default` 的主题来为地图应用大量样式。创建自己的主题很容易。\n\n如果你想为地图创建自定义 UI 样式，你基本上需要创建包含 CSS\
  \ 文件和 UI 控件使用的图像（例如，平移箭头图像）的“主题文件夹”，或手动覆盖某些默认样式。主题文件夹可以放在任何你想要的位置，只需在 HTML 文件中引用它时记住其路径即可。\n\
  \n要使用自己的主题，你只需做三件事：\n\n- 1. 在页面中包含 OpenLayers 后，添加指向包含自定义地图样式的 CSS 文件的链接。\n- 2.\
  \ 你必须告诉 OpenLayers 在哪里找到地图使用的图像。为此，通过向 JavaScript 代码中添加以下内容来指定图像所在文件夹（你的主题文件夹）的路径。路径相对于包含\
  \ JavaScript 代码的文件：\n```\nOpenLayers.ImgPath = 'path/to/your/theme_folder/';\n```\n\
  - 3. 在创建地图对象时通过 `theme` 属性指定主题文件夹的位置。路径相对于包含 JavaScript 代码的文件。例如：\n```\nvar map\
  \ = new OpenLayers.Map('map_element', {theme:\n'theme_folder'});\n```\n\n## 创建自己的主题\n\
  \n现在我们知道如何使用主题，但如何创建主题呢？答案很简单——我们只需创建一个 CSS 文件、一些图像，并创建一个存放它们的目录即可。图像将放在主题文件夹内的名为\
  \ img 的文件夹中。然后，我们只需告诉 OpenLayers 使用该主题。随着 OpenLayers 后续版本的发布，主题文件夹的预期结构可能会发生变化，因此弄清默认提供的图像（及其名称）的最佳方法是查看默认主题文件夹。你可以在下载的\
  \ OpenLayers 文件夹的 theme/default 文件夹中找到它。\n\n但更大的问题是如何引用用户界面元素？答案在于了解 OpenLayers\
  \ 如何为其创建的元素生成类名和 ID。\n\n## OpenLayers—类名和 ID\n\n要样式化一个元素，你必须引用它。如果我们想引用特定的 div，我们需要知道它的类和/或\
  \ ID。OpenLayers 会生成类名和 ID，因此我们只需要知道名称是如何生成的。最常见的方法是使用生成的类名来样式化控件。\n\n## 生成的类名\n\n\
  OpenLayers 为控件生成的类名遵循以下形式\n\n```\n.olControlControlNameExtra\n```\n\n这意味着 .olControl\
  \ 总是出现在类名的开头，ControlName 是控件类本身的名称。Extra 指控件的任何额外描述或元素（例如，在许多控件后添加的“Inactive”和“Active”，尤其是按钮控件）。\n\
  \n例如，如果我们想样式化比例尺线控件，我们会将其引用为\n\n```\n.olControlScaleLine\n```\n\n正如我们之前遇到的那样，对于按钮类型控件，我们在末尾添加“Inactive”或“Active”。其他控件，例如\
  \ OverviewMap 控件，也包含一个 OverviewMapElement 类名——元素指的是概览控件生成的 HTML 容器。LayerSwitcher\
  \ 控件也有类似情况。快速确定元素类名的方法是使用 Firebug 检查页面并找到该元素。\n\n我们很快会介绍常见控件的类名，但在那之前让我们谈谈引用控件元素的另一种方式：通过\
  \ ID。\n\n## 生成的 ID\n\n通过类名引用控件元素是样式化控件的首选方式，但通过 ID 样式化也是可能的。有两种方法可以实现：\n\n- **Wrong\
  \ way**: 使用生成的 ID。ID 的生成形式为 `OpenLayers.Control.ControlName_XX`，其中 `XX` 是一个基于各种因素（如控件顺序）分配的数字。数字可能会根据你制作地图的方式而改变。因此，如果你在样式声明中使用它并且\
  \ ID 发生变化，则样式将不再应用。\n- **Right way**: 在创建控件时传入 ID 并引用它——换句话说，当你创建一个新控件时，传递 `id`\
  \ 属性并赋予某个字符串值，该值将用作元素的 ID。这样，我们就不必担心生成的 `XX` 数字会改变，并且可以确定 ID 会是什么。\n\n好了，现在我们知道如何引用元素，以及\
  \ OpenLayers 如何生成类名和 ID，让我们看一个示例来巩固概念。\n\n## 动手操作 – 样式化控件\n\n让我们练习样式化一些 OpenLayers\
  \ 控件。我们这里不会创建主题；相反，我们只需链接到一个外部 CSS 文件，该文件将覆盖我们希望样式化的元素的默认样式。\n\n- 1. 让我们先创建一个新页面。我们还将把所有自定义样式放在一个名为\
  \ **control_style.css** 的文件中。因此，每当添加样式时，请确保将其放入 **control_style.css** 中。另请确保在 `<head>`\
  \ 部分使用以下方式包含 CSS 文件：\n```\n<link rel='stylesheet' href='control_style.css' />\n\
  ```\n- 2. 现在，让我们创建地图对象。我们在实例化时指定 controls 数组，因为在此示例中我们不想要 **PanZoombar** 控件。我们*不*使用自定义主题（我们只是通过外部\
  \ CSS 文件覆盖样式），但如果我们使用的话，也会指定 `theme` 属性。\n```\nmap = new OpenLayers.Map('map_element',\
  \ {\n  controls: [new OpenLayers.Control.Navigation()]\n});\n```\n- 3. 好了，让我们创建一些控件。我们将逐个介绍每个控件，以便可以看到涉及的所有步骤。首先，让我们创建一个\
  \ **ScaleLine** 控件。在 JavaScript 代码中使用以下内容创建一个默认的 **ScaleLine** 控件对象：\n```\nmap.addControl(new\
  \ OpenLayers.Control.ScaleLine());\n```\n\n\n\n4. 现在，让我们为其应用一些样式。因为我们没有传入类名或 ID，我们将使用自动生成的类名。这是一个标准控件，没有“active”或“inactive”状态，因此我们可以直接使用默认生成的名称\
  \ olControlScaleLine。在你的 control_style.css 文件中，添加以下内容：\n\n```\n.olControlScaleLine\
  \ {\n    background: #777777;\n    color:#ffffff;\n}\n```\n\n5. 大多数控件只需使用其主类名（即\
  \ .olControlControlName）即可设置样式。其他控件，例如按钮和具有 active/inactive 状态的控件，具有额外的类名。这是一件好事——你通常希望按钮在被点击时具有不同的样式。让我们使用\
  \ NavToolbar 控件——在你的 JavaScript 代码中，输入以下内容：\n\n```\nmap.addControl(new OpenLayers.Control.NavToolbar());\n\
  ```\n\n6. 现在，让我们为 NavToolbar 控件设置样式。我们需要设置两件事——NavToolbar 控件本身（它实际上是一个面板）以及其包含的按钮的\
  \ Inactive/Active 状态。NavToolbar 控件还包含一个 ZoomBox 控件，我们也需要为其设置样式。它还包含需要设置样式的 Inactive/Active\
  \ 状态。\n\n默认情况下，按钮具有 left 和 top 属性。我们将用 0 替换这些值并添加 !important 值，这将确保我们新设置的值不会被覆盖。在你的\
  \ CSS 文件中，添加：\n\n```\n.olControlNavToolbar {\n    top: 0;\n}\n.olControlNavigationItemInactive\
  \ {\n    background: #787878 !important;\n    border: 2px solid #232323;\n    cursor:\
  \ pointer;\n    left:0 !important;\n    top:0 !important;\n}\n.olControlNavigationItemActive\
  \ {\n    background: #dedede !important;\n    border: 2px solid #787878;\n    cursor:\
  \ pointer;\n    left:0 !important;\n    top:0 !important;\n}\n```\n\n```\n.olControlZoomBoxItemInactive\
  \ {\n    background: #336699 !important;\n    border: 2px solid #232323;\n    cursor:\
  \ pointer;\n    left:0 !important;\n    top:0 !important;\n}\n.olControlZoomBoxItemActive\
  \ {\n    background: #77aadd !important;\n    border: 2px solid #5588aa;\n    cursor:\
  \ pointer;\n    left:0 !important;\n    top:0 !important;\n}\n```\n\n7. 让我们创建一个\
  \ **概览地图** 控件。在你的 JavaScript 代码中，添加以下内容：\n\n```\nmap.addControl(new OpenLayers.Control.OverviewMap());\n\
  ```\n\n8. 现在，让我们为其设置样式。这是一个由几个不同元素组成的控件，但它们都有类名，因此我们可以随意设置样式。我们将设置打开概览地图时的背景（通过\
  \ `.olControlOverviewMap`）、概览地图上的范围矩形，以及最小化/最大化按钮的位置。将此添加到你的 CSS 中：\n\n```\n.olControlOverviewMapMaximizeButton,\n\
  .olControlOverviewMapMinimizeButton{\n    bottom:0 !important;\n}\n\n.olControlOverviewMapElement\
  \ {\n    background: #cdcdcd !important;\n}\n.olControlOverviewMapExtentRectangle\
  \ {\n    background:rgba(60,90,120,.7);\n    border:2px dashed #22dd22 !important;\n\
  }\n```\n\n9. 打开你的地图，移动一下并查看你的控件。你应该会看到类似这样的内容：\n\n![](img/1b8cd151c9f278555f9cf255b20d244e_203_0.png)\n\
  \n## 发生了什么？\n\n我们制作了一些控件并为其添加了样式。我们以以下三种不同的方式应用了样式：\n\n- 根据其类名设置控件本身的样式（例如，`olControlScaleLine`）\n\
  - 设置按钮控件的样式（其 Inactive 和 Active 状态）\n- 设置控件创建的各种其他元素的样式\n\n可能并不总是立即清楚使用什么类名来引用一个控件，但总是有可能弄清楚。其中最快、最简单的方法之一是使用\
  \ Firebug（或其他 Web 开发工具）检查页面的生成 HTML 并查找类名中包含控件名称的元素。\n\n## 动手实践 – 设置 LayerSwitcher\
  \ 控件的样式\n\n现在让我们看看如何设置 LayerSwitcher 控件的样式。与之前的示例不同，我们将把此控件放置在地图外部的 div 元素中。\n\n\
  1. 开始一个新页面。我们将链接到一个外部 CSS 文件，该文件将覆盖基础 LayerSwitcher 控件样式，如之前的示例。包含一个 `<link>` 标签，引用一个名为\
  \ `ex3_layerswitcher_style.css` 的文件，我们稍后会创建它。\n2. 接下来，我们需要创建一个 div 元素来容纳我们的控件。在\
  \ map_element div 之后创建一个 div 标签：\n```html\n<div id='layer_switcher_control'></div>\n\
  ```\n3. 现在，在你的 JavaScript 代码中，像往常一样创建地图和 WMS 层对象。添加一个 LayerSwitcher 控件，并将 layer_switcher_control\
  \ 元素作为 div 属性传入：\n```javascript\nmap.addControl(new OpenLayers.Control.LayerSwitcher({\n\
  \  div: document.getElementById('layer_switcher_control')\n}));\n```\n4. 现在，如果你打开地图，你应该会看到地图下方有图层切换控件：\n\
  5. 默认情况下，它看起来很朴素。它还有一个带圆角的边框。首先，我们需要通过传入 roundedCorner: false 来禁用圆角。\n```javascript\n\
  map.addControl(new OpenLayers.Control.LayerSwitcher({\n  div: document.getElementById('layer_switcher_control'),\n\
  ```\n\n![](img/1b8cd151c9f278555f9cf255b20d244e_204_0.png)\n\n```\nroundedCorner:\
  \ false\n})) ;\n```\n\n6. 现在让我们创建 ex3_layerswitcher_style.css 文件。我们将在此处指定控件的样式。由于我们在创建控件时手动指定了\
  \ div 属性，我们首先要设置样式的是我们传入的 div（ID 为 layer_switcher_control）。因为是我们自己传入的，OpenLayers\
  \ 不会为其应用任何默认样式。让我们为其添加实心边框和一些内边距。将此添加到样式文件中：\n\n```\n#layer_switcher_control {\n\
  \    border:2px solid #454545;\n    padding:2px;\n}\n```\n\n7. 现在我们需要开始覆盖控件从 OpenLayers\
  \ 继承的样式。首先，我们需要获取相关的类名。我们可以使用 Firebug 查看“Base Labels”文本位于 class 为 baseLbl 的 div\
  \ 中。由于它是下面列出基础图层的标题，让我们让它大一点并赋予背景。它也位于我们的 layer_switcher_control div 内，因此在 CSS 中指定它时，让我们尽可能具体：\n\
  \n```\n#layer_switcher_control .baseLbl {\n    background:#cdcdcd;\n    font-size:1.3em;\n\
  \    font-weight:bold;\n}\n```\n\n8. 让我们也为实际图层名称的标签文本设置样式。使用 Firebug，我们可以看到标签文本位于\
  \ class 为 labelSpan 的 <span> 标签内，它是 class 为 baseLayersDiv 的 div 的子元素。所有基础图层都将显示在此\
  \ div 中，而任何叠加图层将显示在名为 dataLayersDiv 的 div 中。利用这些信息，让我们为其应用样式，指定继承以访问该元素：\n\n```\n\
  #layer_switcher_control .baseLayersDiv .labelSpan {\n    font-style: italic;\n \
  \   font-weight:bold;\n}\n```\n\n9. 现在打开页面，你应该会看到样式化的图层切换器 div：\n\n![](img/1b8cd151c9f278555f9cf255b20d244e_206_0.png)\n\
  \n## 发生了什么？\n\n我们刚刚在地图外部添加了一个 LayerSwitcher 控件并为其设置了样式。我们看到了如何设置我们创建的 div 元素的样式，以及通过获取\
  \ OpenLayers 生成的类名来设置元素的样式。LayerSwitcher 控件以及其他一些控件如 OverviewMap，比其他控件具有更多需要设置样式的元素。可能并不总是立即清楚需要设置哪些元素的样式，但我们始终可以使用\
  \ Firebug 检查 HTML 并确定类名。\n\n## 勇敢尝试 – 添加图层\n\n向你刚刚创建的地图添加更多图层。注意现在叠加图层有一个新的元素集合，位于\
  \ class 以 'dataLayers' 开头的元素中。你的所有叠加图层都被视为“data layers”并将显示在此处，而基础图层显示在 baseLayersDiv\
  \ 中。利用你在前一个示例中学到的知识，为叠加图层 div 元素应用你自己的样式。\n\n## 其他资源\n\nCSS 的全面覆盖超出了本书的范围，但希望本章已提供了设置\
  \ OpenLayers 元素样式所需的必要信息。关于 CSS 的更详细信息可以在 W3Schools 网站找到，网址为 http://www.w3schools.com/css/default.asp。\n\
  \n\n\n具备熟练设计技能的开发者并不常见——幸运的是，有一些资源提供高质量、专业的用户界面元素。**GeoExt** 是一个第三方库，它将流行的 JavaScript\
  \ 框架 **ExtJS** 与 OpenLayers 集成，并包含众多用户界面和 OpenLayers 地图组件。然而，它确实需要对 ExtJS 库有一定的熟悉程度。GeoExt\
  \ 可在 http://www.geoext.org/index.html 找到，ExtJS 可在 http://www.sencha.com/products/js/\
  \ 找到。\n\n## 摘要\n\n本章我们讨论了 CSS 是什么以及它的用途。我们学习了如何将 CSS 和 HTML 结合使用，以及如何在 CSS 中引用元素。然后，我们讨论了\
  \ OpenLayers 如何使用 CSS，以及控制元素是如何命名。最后，我们为某些控件创建并应用了自己的自定义样式。\n\n本章的目标是为理解如何使用 CSS\
  \ 样式化控件提供基础。如果你之前很少使用过 CSS，或者不确定如何样式化其他类型的控件，不用担心。我们将在整本书中使用本章介绍的相同原则来样式化控件，因此你将获得更多实践经验。\n"
- "# 8 绘制地图类\n\n> *地图类正如你现在可能已经猜到的，是地图背后的核心部分。你创建的地图对象(s)是你地图背后的最重要的东西，因为没有地图对象你就无法对图层或控件做任何事情。在本章中，我们将讨论地图类，而我们迄今为止一直将其视为理所当然。*\n\
  >\n> *理解地图类将使我们能够为应用程序做更多酷炫的事情，并提供一种以编程方式告诉地图该做什么的方法。*\n\n到目前为止，我们一直在本书中使用地图类，但实际上并不真正知道如何或为什么使用它。本章旨在不仅解释我们一直在做什么以及为什么这样做（例如使用\
  \ `map.zoomToMaxExtent()`），而且还全面介绍 OpenLayers 的核心部分之一——地图类。我们将查看\n\n- 地图类是什么\n-\
  \ 地图类与我们讨论过的其他类之间的关系\n- 访问地图类的属性\n- 使用地图类的函数\n- 使用事件来定义和扩展地图行为\n- 创建一个包含多个地图的简单应用程序\n\
  \n### 地图类\n\nOpenLayers 的地图类驱动着我们的地图。我们希望对地图做的所有事情——移动它们、缩放、添加图层——所有这些都由这个类实现。我们已经通过创建地图对象、向其添加控件和图层，然后告诉地图缩放至最大范围，广泛地使用过它。虽然我们已经相当详细地介绍了图层和控件，但我们尚未真正讨论地图类背后的功能，我们应用程序的核心组件。\n\
  \n在 OpenLayers 中，控件和图层对象属于一个地图对象。如果我们希望它们发挥作用，控件和图层对象必须连接到地图。因此，我们需要一个地图对象来真正制作一个有用的地图——正如你可能想象的那样，我们稍后在本章中会看到，使用多个地图对象制作应用程序是可能的。\n\
  \n### 创建地图对象\n\n在我们深入之前，让我们回顾一下实例化地图对象的基代码。我们之前做过很多次，但一点回顾不会有坏处。\n\n```\nvar map\
  \ = new OpenLayers.Map('html_element', { options });\n```\n\n第一个参数是一个字符串，由你希望地图放置其中的\
  \ HTML 元素的 ID 组成（几乎总是 div 元素）。第二个参数是可选的，由一个对象字面量或匿名对象（键：值对）组成，其中包含属性和值设置。\n\n所以，这里还没有什么新东西。这本质上是你设置地图对象所需的一切。然而，正如我们之前提到的，如果你使用的是\
  \ EPSG:4326 以外的投影，例如球面墨卡托，在创建地图对象时你还需要设置一些其他属性（例如 maxExtent 和 units）。\n\n本章将涵盖通过地图类可用的大多数属性和函数，因此让我们从属性开始。\n\
  \n### 地图类属性\n\n你可以传入的可能属性非常多，我们在书中已经见过其中一些。还有一些相当有用的属性我们尚未介绍。我将先介绍一些属性，然后我们将通过一些示例来实际操作它们。\n\
  \n在解释属性和方法时，我通常会将任意地图对象称为 `map`。如果你的地图对象叫其他名字，你只需将 `map` 替换为你的地图对象的名字。另一个快速说明；虽然我们将在创建地图对象时传入这些属性的上下文中讨论所有这些属性，但你可以随时调用它们来获取值（例如，调用\
  \ `map.tileSize` 将返回地图的瓦片大小）。\n\n> 虽然我们将涵盖与本书中的所有示例和讨论相关的所有属性和函数，但要获取始终最新且完整的列表，你可以访问\
  \ http://dev.openlayers.org/docs/files/OpenLayers/Map-js.html 上的文档。\n\n### 地图属性\n\
  \n让我们回顾一下在创建地图对象时通常会传入的地图属性。还有一些属性我们可以访问但不应在实例化时传入——我们稍后会介绍这些。现在，让我们专注于在实例化地图对象时使用的属性。\n\
  \n#### allOverlays\n\n```\nallOverlays: {Boolean} Default is false\n```\n\n`allOverlays`\
  \ 属性指定地图是否可以在没有基础图层的情况下运行。到目前为止，我们在所有示例中都使用了基础图层，无论是显式还是隐式（让我们的图层自动设置为基础图层）。通过设置此属性，*所有*\
  \ 图层都将作为覆盖图层运行。\n\n可能有时候你希望使用它——只要记住，使用此属性时，用户有能力禁用所有图层，他们实际上可以看到一个空地图。通过将此属性设置为\
  \ `true`，第三方 API 图层也将作为覆盖图层运行。因此，如果你愿意，你可以将 Google 地图图层用作覆盖图层并使其半透明。\n\n#### controls\n\
  \n```\ncontrols: {Array {OpenLayers.Control}}\n```\n\n我们在第 6 章中介绍了控件，因此这里不需要深入讨论。我们可以在创建地图对象时定义地图的控件，也可以在地图对象实例化后通过\
  \ `addControl(s)` 添加它们。地图实例化后，我们可以通过调用 `map.controls` 访问其控件。如果你没有在创建地图时指定控件数组供地图使用，你的地图将获得四个默认控件：**Navigation**、**PanZoom**、**ArgParser**\
  \ 和 **Attribution**。\n\n#### displayProjection\n\n```\ndisplayProjection: {OpenLayers.Projection}\n\
  ```\n\n此属性主要由显示坐标信息的控件使用。通过在地图对象上设置此属性，任何具有 displayProjection 属性的控件都将被设置为此值。控件，例如\
  \ MousePosition 控件，可以在 displayProjection 中显示坐标。因此，你的地图可能使用与你希望显示坐标的投影不同的投影。然而，要使用\
  \ EPSG:4326 或 EPSG:900913 以外的 displayProjection，必须在你的页面上包含 Proj4js。\n\n如果例如你的地图使用球面墨卡托投影（即\
  \ EPSG:900913），但你可能希望以另一个投影（如 EPSG:4326）显示坐标（以显示 lon/lat 坐标），此属性非常方便。\n\n#### div\n\
  \n```\ndiv: {HTML Element or String}\n```\n\n到目前为止，我们一直是这样创建地图的：\n\n```\nvar map\
  \ = new OpenLayers.Map('map_element', {});\n```\n\n使用 div 属性，我们可以改为在选项中传入 HTML 元素（或元素的\
  \ ID，如上所述）；即，\n\n```\nvar map = new OpenLayers.Map({'div': 'map_element'});\n```\n\
  \n这样做的一个优点是 div 属性是可选的，因此你可以创建一个地图对象并选择不将其放置在任何 div 中。如果你这样做，你可以使用 render() 方法稍后将地图放置在\
  \ div 中。\n\n这实际上几乎与 OpenLayers 在我们传入 HTML 元素进行地图对象实例化时自动为我们做的事情相同。当我们指定此 div 属性时，OpenLayers\
  \ 只是在此时调用 render() 方法——我们只是延迟了此操作，并在选择不指定 div 时手动调用它。这在我们只想在用户点击按钮后才显示地图时很有用，例如。\n\
  \n### 动手实践 – 使用 allOverlays 地图属性\n\n让我们看看如何使用 allOverlays 属性并在创建地图时不指定 div。\n\n\
  - 1. 在你的 init() 函数中，让我们使用 allOverlays 设置为 true 并传入一些控件来创建我们的地图对象。我们也不会指定 HTML 元素：\n\
  - \n-       var map = new OpenLayers.Map({\n\n```\nallOverlays: true,\n    controls:\
  \ [new OpenLayers.Control.Navigation(),\nnew OpenLayers.Control.PanZoom(),\nnew\
  \ OpenLayers.Control.LayerSwitcher()]\n});\n```\n\n2. 现在，让我们创建几个图层，以便了解 allOverlays\
  \ 属性的工作方式。我们假设在今后的示例中你会向地图添加 WMS 图层。\n\n```\nvar wms_layer_all = new OpenLayers.Layer.WMS(\n\
  \    'OpenLayers WMS',\n    'http://vmap0.tiles.osgeo.org/wms/vmap0',\n    {layers:\
  \ 'basic'},\n    {}\n);\n```\n\n```\nvar wms_layer_labels = new OpenLayers.Layer.WMS(\n\
  \    'Labels',\n    'http://vmap0.tiles.osgeo.org/wms/vmap0',\n    {layers: 'clabel,ctylabel,statelabel',\n\
  transparent:true},\n    {}\n);\n```\n\n```\nmap.addLayers([wms_layer_all, wms_layer_labels]);\n\
  ```\n\n3. 由于在实例化地图对象时没有指定 div，我们必须调用 render() 函数将地图放置在 div 中。该函数接受 HTML 元素或元素 ID\
  \ 的字符串，因此让我们传入元素的 ID。\n\n```\nmap.render('map_element');\n```\n\n4. 最后，检查是否已设置中心点。如果没有，则缩放至最大范围。我们假设你在今后的示例中也会执行此步骤。如果你愿意，可以将对\
  \ render() 函数的调用放在这段代码之后，它仍然会缩放至中心或最大范围——调用 render() 和设置地图位置的顺序由你决定。\n\n```\nif\
  \ (!map.getCenter()) {\n    map.zoomToMaxExtent();\n}\n```\n\n5. 查看地图并打开图层切换器——你应该能够关闭两个图层并看到现在为空的地图。因为我们没有底图，并且所有叠加图层默认都是禁用的，所以在你启用图层之前你只会看到空白地图。\n\
  \n![](img/1b8cd151c9f278555f9cf255b20d244e_214_0.png)\n\n## 发生了什么？\n\n我们刚刚查看了一些我们提到的属性——`allOverlays`、`controls`，以及（省略）`div`\
  \ 属性。我们还看到了用户通过关闭所有图层可能完全看不到地图的方式。\n\n地图不会自动渲染，因为我们没有传入 HTML 元素。相反，我们在创建地图对象后调用了\
  \ `render()` 方法并传入了 HTML 元素。可能有时候你希望延迟渲染地图，例如等待用户点击按钮，在这种情况下这是一种很好的做法。我们将在本章后面更详细地讨论地图方法，但让我们回到地图属性的讨论。\n\
  \n### 事件监听器\n\n`eventListeners: {Object}`\n\n此属性接受一个匿名对象，其中包含事件类型（作为键）和在触发这些事件时调用的函数（作为值）的键值对。我们在第\
  \ 6 章中简要介绍了此属性，这里它的行为方式相同。一个示例是：\n\n```\nvar map = new OpenLayers.Map('map_element',\
  \ {\n    eventListeners: { 'moveend': my_moveend_function }\n});\n```\n\n上面的代码假设存在一个名为\
  \ `my_moveend_function` 的函数。我们将在本章的事件部分中更详细地介绍此属性以及可能的事件类型。\n\n### 穿透\n\n```\nfallThrough:\
  \ {Boolean} Default: true\n```\n\nfallThrough 属性决定 OpenLayers 是否允许地图上的事件向下传播（即“穿透”）到页面上的其他元素。\n\
  \n让我们通过一个示例来说明其含义。假设你的 map_element div 上附加了一个事件，当你点击它时会显示一个警告。这个事件在 OpenLayers 之外。现在，假设你创建一个地图对象并将其附加到该\
  \ map_element div。如果 fallThrough 设置为 true（默认情况下是这样），你通过点击地图会收到原始警告——鼠标点击事件将被允许“穿透”。如果将其设置为\
  \ false，你将不会收到警告，因为 OpenLayers 将会消耗该鼠标点击事件。\n\n### 图层\n\n```\nlayers: {Array {OpenLayers.Layer}}\n\
  ```\n\n我们已经在一定程度上遇到过此属性。地图实例化后，我们可以通过调用 map.layers 来访问其图层。到目前为止，我们一直是先创建地图对象，然后创建图层对象，然后使用\
  \ addLayer() 将图层添加到地图。然而，我们也可以在实例化地图时使用 layers 属性并传入图层对象的数组。\n\n在创建地图对象时使用此属性传入图层或调用\
  \ addLayers 本质上做的是同一件事——使用你最熟悉的方法即可。一个示例是：\n\n```\nvar map = new OpenLayers.Map('map_element',\
  \ {\n    layers: [my_layer_1, new OpenLayers.Layer.WMS({ ... })]\n});\n```\n\n你可以传入已创建的图层对象（例如\
  \ my_layer_1，假设已创建了该名称的图层对象），或在调用中实例化图层对象（例如 new OpenLayers.Layer.WMS({...})）。\n\
  \n![](img/1b8cd151c9f278555f9cf255b20d244e_215_0.png)\n\n> 在上面的示例中，... 将被 WMS 图层的选项替换。\n\
  \n### 最大范围\n\nmaxExtent: {OpenLayers.Bounds} 默认值：以十进制度为单位的范围，(-180, -90, 180, 90)\n\
  \n设置此项将指定地图的最大范围。超出最大范围的瓦片不会被请求，用户也不能平移到位于 maxExtent 之外的坐标。如果你使用的是与默认投影不同的投影，你需要更改此设置以反映所需投影中世界的坐标。\n\
  \nmaxExtent 属性的数据类型是 OpenLayers.Bounds 对象。OpenLayers.Bounds 类用于创建“bounds”对象，其中包含构成边界框的四个坐标。这四个坐标是最小\
  \ x（左）、最小 y（底）、最大 x（右）和最大 y（顶）。要实例化一个 bounds 对象，只需按以下顺序传入坐标：\n\n```\nvar bounds_object\
  \ = new OpenLayers.Bounds(minx, miny, maxx, maxy);\n```\n\n### 最小范围\n\nminExtent:\
  \ {OpenLayers.Bounds}\n\n设置 minExtent 将指定地图的最小范围。此属性没有默认值。你通常不需要设置它，除非你使用 maxResolution\
  \ 指定自定义分辨率——在这种情况下，你通常会将值设置为 (-1, -1, 1, 1)。\n\n### 受限范围\n\nrestrictedExtent: {OpenLayers.Bounds}\n\
  \n此属性指定用户可以导航的范围——也就是说，用户只能在 restrictedExtent 属性指定的范围（如果给出，并且限制其导航是可能的）内平移。\n\n\
  设置此属性仍允许用户放大以查看超出受限范围的地图部分，但地图的中心将被设置为受限范围。如果你想限制缩放级别，可以设置 resolutions 数组、maxResolution\
  \ 或 scales 属性（在后面的页面中介绍）。此属性类似于 maxExtent，然而，restrictedExtent 之外的瓦片仍会被请求，但用户不一定能够平移到它们。\n\
  \n### 缩放级别数\n\nnumZoomLevels: {Integer} 默认值：16\n\nnumZoomLevels 属性指定地图将拥有的可能缩放级别的数量。对于许多应用来说，给用户\
  \ 16 个缩放级别并不总是理想的。在大多数情况下，只需指定 numZoomLevels（如果使用不同的投影，则连同 maxExtent）即可设置缩放级别的数量。随着我们查看其他属性，我们将看到更多指定缩放级别数量的方法（有些方法根本不使用此属性）。然而，让我们看看如何使用此属性来设置缩放级别的数量——非常简单！\n\
  \n## 动手实践 – 设置缩放级别和最大范围\n\n1. 通过指定 numZoomLevels 并添加 PanZoomBar 控制来创建你的地图对象。我们还将\
  \ numZoomLevels 属性设置为 8，意味着只有八个缩放级别可用。最后，我们将 maxExtent 属性设置为仅包含世界的一部分，如下所示：\n\n\
  ```\nmap = new OpenLayers.Map('map_element', {\n    controls: [\n        new OpenLayers.Control.Navigation(),\n\
  \        new OpenLayers.Control.PanZoomBar(),\n        new OpenLayers.Control.LayerSwitcher()\n\
  \    ],\n    numZoomLevels: 8,\n    maxExtent: new OpenLayers.Bounds(-100, -30,\
  \ 40, 30)\n});\n```\n\n2. 打开页面，你应该会看到类似这样的内容：\n\n![](img/1b8cd151c9f278555f9cf255b20d244e_217_0.png)\n\
  \n\n\n## What Just Happened?\n\n我们的地图只有八个缩放级别，最大范围为 (-100, -30, 40, 30)。你一定注意到地图起始的缩放级别比预期放大了几次。这主要是由于最远的缩放级别会显示超出地图最大范围的内容。让我们快速聊聊缩放级别是什么。\n\
  \n访问 map.zoom 属性（或调用 map.getZoom()）的缩放级别会显示你当前的缩放级别（一个 {Integer} 值）。缩放级别数字从 0 开始递减（'最远'\
  \ 的缩放级别——地图通常在此级别开始），到最大缩放值减一（因为第一个值从 0 开始，而不是 1）。\n\n在我们的示例中，我们可以拥有的最高缩放值为 7，因为我们的\
  \ numZoomLevels 设置为 8。由于缩放值从 0 开始，而不是 1，因此我们需要从最大缩放级别数中减去一来得到当前缩放级别值。\n\n在 PanZoomBar\
  \ 控件中，滑块的最底部项代表更远的缩放级别（我们称之为最小缩放级别）。你可以达到的最高级别将被称作最大缩放级别。现在，如果我们使用第三方 API 图层，我们可以简单地在这些图层属性上设置\
  \ minZoomLevel 和 maxZoomLevel，但要为地图（和其他非第三方 API 图层）设置这些值，我们使用 scales 或 resolutions\
  \ 以及 min 或 maxScale 和 min 或 maxResolution。\n\n## Map properties—Continued\n\n让我们继续讨论地图属性。\n\
  \n## Resolutions\n\n```\nresolutions: {Array{Float}}\n```\n\n这是地图将使用的分辨率数组。数组中的每个值都是一个可能的缩放级别。如果你在实例化地图（或图层）时未传入此参数，它将根据其他属性（如\
  \ maxExtent）自动确定。设置此属性是指定地图缩放级别数量的另一种方式。分辨率数组从高值到低值递减。\n\n分辨率是每个像素的地图单位宽度/高度——例如，150\
  \ 英里除以 512 像素的分辨率为 0.29296875。如果使用瓦片缓存服务器，你需要指定瓦片被缓存的分辨率（同时设置 serverResolutions\
  \ 属性，该属性指定服务器上瓦片被缓存的分辨率）。否则，你通常只需定义 numZoomLevels 来指定想要的缩放级别数量。\n\n![](img/1b8cd151c9f278555f9cf255b20d244e_219_0.png)\n\
  \n> 关于分辨率数组的另一个小提示是，数组中每个值都是前一项值的一半。因此，如果你的分辨率数组第一项为 0.703125，下一个值将为 0.3515625，再下一个为\
  \ 0.17578125，以此类推。\n\n## Time for Action – using resolutions array\n\n设置分辨率数组是指定缩放级别数量的一种方式。让我们在实践中看看。\n\
  \n- 1. 在地图对象定义中按如下方式指定分辨率数组：\n```\nmap = new OpenLayers.Map('map_element', {\n \
  \   resolutions: [ 1.40625,0.703125, 0.703125, 0.3515625,\n0.17578125, 0.087890625,\
  \ 0.0439453125 ]\n});\n```\n- 2. 在地图上缩放。因为我们只提供了五个可能的分辨率，你应该能够放大五次。\n\n## What Just\
  \ Happened?\n\n使用分辨率数组，我们能够指定缩放级别的数量。除非我们使用缓存瓦片服务，否则这不一定是最简单的方式来指定缩放级别的数量。我们之前提到过我们也可以使用\
  \ scales，还可以使用 minResolution 和 maxResolution。\n\n## Map/Layer property inheritance\n\
  \nResolutions/scales/max extent 等属性可以在地图对象或图层对象中指定。最好在地图中指定它们，这样你就不必担心将属性应用到哪些图层上。然而，如果你在地图中未指定它们，则底图图层的设置将被应用到地图上。这不一定不好，但可能会有点模糊，难以确定哪些图层控制着分辨率，因为如果这些属性设置在覆盖图层中，它们不一定会被应用。\n\
  \n因此，为了安全起见，如果你在地图上设置这些属性，就不必担心将它们应用到图层上。主要例外是如果你使用第三方 API 图层——在这种情况下，你必须设置这些图层属性，例如\
  \ minZoomLevel、maxZoomLevel、（两个第三方 API 特定属性无法设置在地图上），以及 numZoomLevels。\n\n如果你想设置模拟限制最小或最大缩放级别的属性，可以使用\
  \ max/minResolution 或 max/minScale，我们现在就来介绍。\n\n## Map properties discussion—Continued\n\
  \n让我们回到查看一些剩余的地图属性。\n\n## maxResolution\n\n```\nmaxResolution: {Float or String\
  \ (with value of 'auto')}. Default: 360 degrees / 256 px\n```\n\nmaxResolution 属性指定地图的最大分辨率可以是多少。换句话说，地图可以放得多远。设置此属性会影响基础缩放级别是什么以及你可以放大的程度。如果你想获取此属性的值，可以缩放至所需缩放级别并调用\
  \ map.getResolution()；或在 Firebug 中访问 map.resolution 属性以获取当前缩放级别的分辨率。\n\n将 maxResolution\
  \ 设置为 'auto' 是确保地图范围完全 '适配' 地图 div 的一种方法。将属性设置为 'auto' 也可以与其他属性一起使用以自动生成缩放级别。\n\n\
  ## minResolution\n\n```\nminResolution: {Float or String (with value of 'auto')}\n\
  ```\n\n指定此属性将限制地图的最小分辨率——用户可以放大的程度。此属性也可以设置为 'auto'，但如果是这样，则必须同时设置 minExtent 属性。如果未设置\
  \ minResolution，缩放级别的数量将由 numZoomLevels 设置、分辨率数组或 scales 属性决定。\n\n## Time for Action\
  \ – using Min and Max resolution\n\n让我们看看如何使用 minResolution 和 maxResolution 属性以及它们如何影响我们的缩放级别。\n\
  \n- 1. 通过指定 min/max 分辨率属性来实例化你的地图对象：\n//Create a map with an empty array of controls\n\
  map = new OpenLayers.Map('map_element', {\n    controls: [\n        new OpenLayers.Control.Navigation(),\n\
  \        new OpenLayers.Control.PanZoomBar(),\n        new OpenLayers.Control.LayerSwitcher()\n\
  \    ],\n    minResolution: 0.02197265625,\n    maxResolution: 0.3515625\n});\n\
  - 2. 你应该会看到类似以下内容，缩放级别受限：\n\n![](img/1b8cd151c9f278555f9cf255b20d244e_221_0.png)\n\
  \n- 3. 现在，让我们重新创建地图元素并设置 maxResolution 和 numZoomLevels 属性：\n```\nmap = new OpenLayers.Map('map_element',\
  \ {\n    controls: [\n        new OpenLayers.Control.Navigation(),\n        new\
  \ OpenLayers.Control.PanZoomBar(),\n        new OpenLayers.Control.LayerSwitcher()\n\
  \    ],\n    maxResolution: 0.3515625,\n    numZoomLevels:8\n});\n```\n- 4. 地图现在应显示类似以下的缩放级别：\n\
  \n![](img/1b8cd151c9f278555f9cf255b20d244e_221_1.png)\n\n## What Just Happened?\n\
  \n我们刚刚使用 minResolution 和 maxResolution 属性来指定地图的缩放级别。除了使用分辨率之外，指定缩放级别的另一种方式是使用 scales\
  \ 属性。\n\n## scales\n\n```\nscales: {Array}\n```\n\n要指定比例尺，请传入一个比例尺值数组。使用此属性时，不要使用\
  \ minResolution、maxResolution、minScale、maxScale、numZoomLevels、minExtent 或 resolutions\
  \ 属性。如果设置了这些属性，它们会覆盖 scales 属性且 scales 属性将不会被使用。如果你使用的投影单位不是 'degrees'，还应指定 unit\
  \ 属性。\n\n与分辨率数组类似，scales 按从高到低排序——从最放大到最放大。你可以使用 map.getScale() 获取当前缩放级别的比例尺。\n\n\
  ## maxScale\n\n```\nmaxScale: {Float}\n```\n\n这指定了地图的最大比例尺。此属性类似于 maxResolution——它限制用户可以放大的程度。如果你指定了\
  \ maxScale 属性，设置 maxResolution 或 minResolution 属性可能会导致错误。使用 scales 或 resolutions\
  \ 其一，但避免混用。\n\n## minScale\n\n```\nminScale: {Float}\n```\n\n此属性指定地图的最小比例尺。更具体地说，它决定用户可以放大的程度。如果你设置此属性，与\
  \ maxScales 相同——不要混用 scales 和 resolutions 属性。\n\n![](img/1b8cd151c9f278555f9cf255b20d244e_222_0.png)\n\
  \n> 设置 maxScale 和 minScale 时，minScale 值应大于 maxScale 值。\n\n\n\n\n## 行动时间 – 使用比例尺\n\
  \n使用比例尺是控制地图缩放级别的另一种方式。让我们来看一下。\n\n1. 使用 minScale 和 maxScale 按如下方式创建地图对象：\n\n```\n\
  map = new OpenLayers.Map('map_element', {\n    controls: [\n        new OpenLayers.Control.Navigation(),\n\
  \        new OpenLayers.Control.PanZoomBar(),\n        new OpenLayers.Control.LayerSwitcher()\n\
  \    ],\n    maxScale: 27683990.15625,\n    minScale: 221471921.25\n});\n```\n\n\
  2. 你应该会看到类似这样的内容：\n\n![](img/1b8cd151c9f278555f9cf255b20d244e_223_0.png)\n\n3. 现在，让我们回到代码并重新创建地图对象。这次，我们将传入一个\
  \ scales 数组。\n\n```\n//Create a map with an empty array of controls\nmap = new OpenLayers.Map('map_element',\
  \ {\n    controls: [\n        new OpenLayers.Control.Navigation(),\n        new\
  \ OpenLayers.Control.PanZoomBar(),\n        new OpenLayers.Control.LayerSwitcher()\n\
  \    ],\n    scales: [ 55367980.3125, 27683990.15625, 13841995.078125, 6920997.5390625],\n\
  });\n```\n\n4. 你应该会看到类似这样的内容：\n\n![](img/1b8cd151c9f278555f9cf255b20d244e_224_0.png)\n\
  \n## 发生了什么？\n\n我们刚刚使用比例尺来确定地图的缩放级别。当你想要指定最大或最小缩放级别，以及想要指定硬编码的缩放级别值数组时（尤其是在使用缓存瓦片服务器时），使用比例尺或分辨率非常有用。现在让我们谈谈一些其他与缩放级别无关的属性。\n\
  \n## panMethod\n\n```\npanMethod: {Function} Default: OpenLayers.Easing.Expo.easeOut\n\
  ```\n\n此属性指定平移地图时使用的缓动动画类型。默认值是一个名为 OpenLayers.Easing.Expo.easeOut 的函数，它会导致动画在平移结束时“缓出”（或减速）。截至撰写时，可能的值为\
  \ OpenLayers.Easing.Expo、OpenLayers.Easing.Quad 和 OpenLayers.Easing.Linear。这三个基本函数各自又分为三种类型：easeOut（'out'\
  \ 表示动画结束时）、easeIn（in 表示动画开始时）以及 easeInOut（表示动画在两者时间都会发生）。http://dev.openlayers.org/docs/files/OpenLayers/Tween-js.html\
  \ 上的文档将包含最最新的可能值。\n\n指定此属性时，请使用基类和子类的完整组合，例如 OpenLayers.Easing.Quad.easeInOut。每当地图被平移时都会出现动画效果，例如使用平移箭头按钮时、用键盘平移地图时，或调用\
  \ panTo() 时。\n\n## panDuration\n\npanDuration: {Integer} Default: 50\n\n指定此属性将控制平移完成所需的时间。与\
  \ `panMethod` 属性一样，此属性仅影响地图的平移动画。\n\n## 行动时间 – 使用平移动画\n\nOpenLayers 让我们能够在用户平移地图时使用不同类型的动画。利用我们刚刚讨论的属性，让我们学习如何自定义平移动画。\n\
  \n1. 从第 1 章的模板创建一个新页面。按如下方式定义地图对象，传入 `panMethod` 和 `panDuration` 属性：\n2. 通过点击左上角控件中的一个箭头来平移地图。在\
  \ Firebug 中，调用以下 `panTo` 函数来平移地图并传入坐标：\n3. 平移地图时你应该会看到动画。\n\n```\nmap = new OpenLayers.Map('map_element',\
  \ {\n    panMethod: OpenLayers.Easing.Quad.easeInOut,\n    panDuration: 100\n});\n\
  ```\n\n```\nmap.panTo(new OpenLayers.LonLat(-18,42));\n```\n\n## 发生了什么？\n\n我们刚刚使用\
  \ `panMethod` 和 `panDuration` 属性来自定义地图的平移动画。更改 `panDuration` 会影响动画本身的持续时间，而更改 `panMethod`\
  \ 则决定使用哪种类型的动画。通过使用这些属性，你可以模仿 Google Maps 或其他第三方地图的功能。\n\n## 试一试英雄 – 使用不同的动画类型\n\
  \n利用上一节学到的知识，尝试将 `panMethod` 属性更改为各种不同的可能值（例如 `OpenLayers.Easing.Expo.easeInOut`），以查看不同的动画样式。另请更改\
  \ `panDuration`，以查看不同值如何影响动画速度。\n\n现在让我们回到更多地图属性。\n\n## projection\n\n```\nprojection:\
  \ {String} Default: 'EPSG:4326'\n```\n\n我们在第 4 章投影章节中已深入介绍过此内容，因此这里无需花费太多时间。基本上，如果你使用的是除\
  \ EPSG:4326 之外的投影，则可以在此处设置 EPSG 代码来指定地图的投影。所有图层都应与地图的投影相同。如果你在此处设置投影，通常还必须指定相关属性，如\
  \ maxExtent、maxResolution 和 units（如果投影不是以度为单位）。\n\n## theme\n\n```\ntheme: {String\
  \ or null} Default: 'theme/default/style.css'\n```\n\n此属性指定地图主题样式文件的相对路径（即，相对于地图页面所在的路径）——一个\
  \ CSS 文件。如果你使用自己的主题文件，应在此处指定 CSS 文件的路径，并设置 OpenLayers.ImgPath（任何自定义地图图像的路径）。\n\n\
  此属性也可以设置为 null，在这种情况下，你只需在页面中包含 CSS 文件链接标签（或将样式信息放在 <style> 标签中）。有关使用 CSS 样式化地图的更多信息，请参阅第\
  \ 7 章。\n\n## tileSize\n\n```\ntileSize: {OpenLayers.Size} Default: (256, 256)\n\
  ```\n\n指定此项将覆盖默认瓦片大小，即 256 x 256 像素。此默认大小 (256, 256) 是来自 Google 等第三方 API 的瓦片大小。如果你不使用第三方\
  \ API，可能有很好的理由更改此值。瓦片越大，需要向服务器发出的请求越少——但每个瓦片传输所需的时间越长。一些瓦片缓存服务器可能以 512 x 512 像素缓存瓦片；在这种情况下，你需要将地图大小设置为匹配。尽管如此，在大多数情况下你无需更改此项，但请随意尝试更改值以找到应用程序的“最佳”点。例如：\n\
  \n```\ntileSize: new OpenLayers.Size(512,512);\n```\n\n## unit\n\n```\nunit: {String}\
  \ Default: 'degrees'\n```\n\n这指定了地图的单位。除非你使用非默认投影，否则可能无需更改此项。可能的值为 'degrees' 或 ('dd')、'm'、'ft'、'km'、'mi'、'inches'。\n\
  \n## 地图函数\n\n我们已经使用了 Map 类的一些方法，例如 `addLayers` 和 `zoomToMaxExtent`。事实上，我们在前几章中至少使用过几次更常见的方法。我们尚未详细介绍它们，而且还有一些我们尚未遇到但仍然非常有用的函数，尤其是在开发具有某种自定义功能的地图时。\n\
  \n本节分为相关功能组。每个组都有自己的标题，然后按字母顺序列出函数，以便你能快速找到所需函数。\n\n## 与控件相关\n\n- `addControl( control\
  \ )`: Parameters—control `{OpenLayers.Control}`. 此函数接收单个控件对象并将其添加到地图。\n- `addControls(\
  \ controls )`: Parameters—controls `{Array {OpenLayers.Control}}`. 此函数接收一组控件对象并将其添加到地图。\n\
  - `getControl( match )`: Parameters—match `{String}`. 接受一个参数，即控件的 ID。它将返回一个与传入 ID\
  \ 匹配的控件对象（如果找到）。**返回：** `{OpenLayers.Control}` 或 null。如果未找到匹配项，则返回 null。\n- `getControlsBy(\
  \ property, match )`: Parameters—property `{String}`, match `{String or Object}`.\
  \ 这是一个有时被忽视但非常有用的函数。如果你需要获取符合某些条件的控件对象，这就是要使用的函数。它接受两个参数，一个 **属性**（例如 `'active'`），和一个\
  \ **匹配**（例如 `true`）。**匹配** 参数可以是字符串、正则表达式或布尔值。属性是控件的任何属性的字符串名称——因此，如果你想获取所有活动的控件，将调用\
  \ `map.getControlsBy('active', true);`。**返回：** `{{Array of OpenLayers.Control objects}}`\
  \ 或 null。如果未找到匹配项，则返回 null；否则，返回匹配的控件对象数组。\n- `getControlsByClass( match )`: Parameters—match\
  \ `{String or Object}`. 与 `getControlsBy` 类似，但将按类名进行匹配。调用此函数并传入包含类名（或正则表达式）的字符串将返回\
  \ null 或控件对象数组。**返回：** `{Array of OpenLayers.Control objects}` 或 null。\n\n\n\n◆\
  \ `removeControl( control )`: **参数**—`control` { `OpenLayers.Control` }。此函数接收单个参数，即\
  \ OpenLayers 控制对象，并将其从地图中移除。移除控件会影响 `map.controls` 数组，因此如果你在代码的其他地方使用索引引用控件对象，请注意这一点。这也是为什么创建变量来引用控件对象是首选的原因之一，因为你不必担心\
  \ `map.controls` 数组的顺序。\n\n## 动手实践 – 使用控件方法\n\n让我们通过一个快速示例来使用我们刚刚介绍的一些函数。\n\n- 1.\
  \ 打开一个已有的地图（任何地图都可以）。\n- 2. 在 Firebug 中，输入并运行以下内容：\n  ```js\n  var returned_controls\
  \ = map.getControlsBy('active', true);\n  ```\n- 3. 现在，如果该数组不为空，请调用以下内容。如果数组为空，则表示没有活动的控件。尝试向地图添加一些控件，直到此函数返回一个非空数组：\n\
  \  ```js\n  map.removeControl(returned_controls[0])\n  ```\n\n## 发生了什么？\n\n我们刚刚获取了一个活动控件的数组，然后从地图中移除了返回数组中的第一项。如果\
  \ `returned_controls` 数组为空，调用 `removeControl` 不会执行任何操作（你无法移除一个 `null` 控件）。现在让我们来看一个更大的函数组。\n\
  \n## 范围/坐标/边界相关\n\n以下函数在某种程度上都与移动地图或获取其位置信息相关。\n\n其中一些函数会使用 **OpenLayers.LonLat**\
  \ 类。此类用于创建坐标对象，其中包含经度和纬度值（或根据投影的不同为 x 和 y 值）。要实例化一个 **LonLat** 对象，只需调用该类并传入经度（x）和纬度（y）值（它们是\
  \ `{Float}` 数据类型）：\n\n```\nvar my_lonlat_object = new OpenLayers.LonLat(-42.18,\
  \ 42.20);\n```\n\n## 方法\n\n方法如下：\n\n- getCenter() : 返回 {OpenLayers.LonLat}。调用此函数将返回一个包含地图中心点的\
  \ LonLat 对象。\n- getExtent() : 返回 {OpenLayers.Bounds}。返回地图当前的范围。\n- getMaxExtent()\
  \ : 返回 {OpenLayers.Bounds}。返回由地图最大范围组成的 Bounds 对象；本质上，它返回 map.maxExtent 属性的值。\n\
  - getMaxResolution() : 返回 {Float}。返回地图的最大分辨率。\n- getNumZoomLevels() : 返回 {Integer}。返回地图包含的缩放级别数量。\n\
  - getResolution() : 返回 {Float}。返回地图当前的分辨率。\n- getResolutionForZoom( zoom ) : 参数为\
  \ zoom { Integer }。此函数允许你传入一个缩放级别 zoom（一个 {Integer}），并接收该缩放级别的分辨率。返回：{Float}。返回传入缩放级别的分辨率。\n\
  - getScale() : 返回 {Float}。返回地图当前的比例尺值。\n- getZoom() : 返回 {Integer}。返回当前的缩放级别值，这也是\
  \ map.zoom 属性的值。\n- getZoomForExtent(bounds, closest) : 参数为 bounds {OpenLayers.Bounds}，closest\
  \ {Boolean}（可选）。接收一个 OpenLayers.Bounds 对象和一个可选的 closest 参数（默认值 false），并返回适用于传入范围的级别。如果\
  \ closest 设置为 true，则会返回一个合适的缩放级别，该级别可能无法完全包含整个范围。返回：{Integer}。这会返回适用于传入范围的缩放级别。\n\
  - getZoomForResolution(resolution, closest): 参数为 resolution {Float}，closest {Boolean}（可选）。类似于\
  \ getZoomForExtent；接收一个分辨率和可选的 closest 参数并返回一个缩放级别。返回：{Integer}。返回适用于传入分辨率的缩放级别。\n\
  - isValidLonLat( lonlat ) : 参数为 lonlat {OpenLayers.LonLat}。接收单个 lonlat 对象并返回一个布尔值，指定传入的坐标是否在地图范围内。返回：{Boolean}。传入点是否在地图的\
  \ maxExtent 内。\n- **isValidZoomLevel( zoomLevel )**: 参数为 zoomLevel {Integer}。此函数接受单个\
  \ zoomLevel 参数，如果传入的缩放级别在地图缩放级别范围内，则返回 true 或 false。返回：{Boolean}。传入的缩放级别是否在地图缩放级别范围内。\n\
  - **moveTo( lonlat, zoom, options )**: 参数为 lonlat {OpenLayers.LonLat}，zoom {Integer}，options\
  \ {Object}（可选）。接收一个 OpenLayers.LonLat 对象、缩放级别和可选的 options 对象。此函数会将地图移动到指定的坐标和缩放级别，但不会显示平移动画。\n\
  - **pan( dx, dy, options )**: 参数为 dx {Integer}，dy {Integer}，options {Object}（可选）。此函数接收两个整数参数和一个可选的\
  \ options 对象。dx 参数指定在 x（经度）方向上平移地图的距离，可以为正或负。dy 参数指定在 y（纬度）方向上平移地图的距离。options 对象可以包含两个属性：animate\
  \ {Boolean} 指定是否启用平移动画，默认值 true。第二个属性是 dragging {Boolean}，指定是否使用 dragging 调用 setCenter，默认值\
  \ false。\n- **panTo( lonlat )**: 参数—lonlat {OpenLayers.LonLat}。将地图平移到传入的坐标（一个 OpenLayers.LonLat\
  \ 对象）。如果传入的坐标在当前范围内，将执行相关的平移动画。\n- **setCenter( lonlat, zoom, dragging )**: 参数—lonlat\
  \ {OpenLayers.LonLat}，zoom {Integer}（可选），dragging {Boolean}（可选）。此函数会将地图中心设置为传入的坐标以及（可选的）缩放级别。如果\
  \ dragging 设置为 true（默认为 true），则会触发 movestart 和 moveend 事件。\n- **zoomIn()**: 调用 zoomIn()\
  \ 将使地图在可能的情况下放大到下一个缩放级别。\n- **zoomOut()**: 调用 zoomOut() 将使地图在可能的情况下缩小一个缩放级别。\n-\
  \ **zoomTo( zoomLevel )**: 参数—zoomLevel {Integer}。接收一个缩放级别并将地图缩放到指定的缩放级别。\n- **zoomToExtent(\
  \ bounds, closest )**: 参数—bounds {OpenLayers.Bounds}，closest {Boolean}（可选）。缩放至传入的范围并重新居中地图。默认情况下，closest\
  \ 设置为 false。如果为 true，将找到最接近匹配范围的缩放级别，但可能无法完全包含范围。\n- zoomToMaxExtent( options ):\
  \ 参数—options {Object}（可选）。缩放至地图的最大范围。可以传入一个可选的 options 对象，其中包含一个属性—restricted（默认为\
  \ true）。如果 restricted 设置为 true，此函数将缩放至地图的受限范围。\n\n## 动手实践 – 使用坐标相关函数\n\n让我们使用一些这些函数！\n\
  \n- 1. 打开一个已有的地图，任何页面都可以。\n- 2. 在 Firebug 中，让我们调用 pan 函数。我们将在 x（经度）方向上移动 -30 度（向左\
  \ 30 度），在 y（纬度）方向上向上移动 30 度。在 Firebug 控制台中，输入并运行以下内容：\n  `map.pan(-30,30);`\n- 3.\
  \ 现在让我们看看 setCenter 函数的工作方式。\n  `map.setCenter( new OpenLayers.LonLat(-42, 70),\
  \ 2);`\n- 4. 现在使用 zoomOut() 函数缩小：\n  `map.zoomOut();`\n- 5. 让我们检查地图最大范围之外的坐标是否有效。以下内容应返回\
  \ False：\n  `map.isValidLonLat( new OpenLayers.LonLat(-190, 20) );`\n\n```\nmap.pan(-30,30);\n\
  ```\n\n```\nmap.setCenter( new OpenLayers.LonLat(-42, 70), 2);\n```\n\n```\nmap.zoomOut();\n\
  ```\n\n```\nmap.isValidLonLat( new OpenLayers.LonLat(-190, 20) );\n```\n\n## 发生了什么？\n\
  \n正如你所见，调用我们想要的任何地图函数都很简单。之前的函数组相当长，但它是长度最长的组——我保证！我们将做一个快速测验，然后再查看一些其他函数。\n\n##\
  \ 快速测验 – 使用坐标相关函数\n\n在大多数情况下，将是你的地图用户来导航地图。然而，以编程方式控制地图导航通常是必要或有用的。请描述两种将地图中心移动或设置为坐标\
  \ (-42, 52) 的可能方法。\n\n\n\n## 与图层相关的函数\n\n以下函数组涉及图层操作——添加图层、移除图层等。你已经见过其中大部分函数：\n\
  \n- `addLayer( layer )`: **参数**—layer `{OpenLayers.Layer}`。接收一个图层对象并将其添加到地图中。图层对象可以是一个已经实例化的对象，也可以在调用时即时实例化一个图层对象。\n\
  - `addLayers( layers )`: **参数**—layers `{Array{OpenLayers.Layer}}`。此函数接收一个图层对象数组并将其添加到地图中。与\
  \ `addLayer` 函数类似，你可以传入已实例化的图层或在调用时即时实例化。建议实例化图层对象以便按名称引用它们，但两种方式都可以接受。\n- `raiseLayer(\
  \ layer, delta )`: **参数**—layer `{OpenLayers.Layer}`，delta `{Integer}`。这允许你更改图层在地图上的显示顺序，从而将图层放置在其他图层的上方或下方。此函数根据传入的\
  \ delta 值更改图层的顺序。如果 delta 为正，则图层在 map.layers 数组中向上移动 delta 位。如果为负，则向下移动 delta 位。我们将在本书后面使用此函数来移动图层列表中的图层。\n\
  - `removeLayer( layer, setNewBaseLayer )`: **参数**—layer `{OpenLayers.Layer}`，setNewBaseLayer\
  \ `{Boolean}`（可选）。此函数会从地图中移除传入的图层。它会移除关联的 HTML 元素，从地图的图层列表中移除图层，将图层的 map 值设为 null，并触发一个\
  \ `removelayer` 事件。`setNewBaseLayer` 属性是可选的，默认为 true，如果需要会尝试设置新的底图。\n- `getNumLayers()`:\
  \ **返回：** `{Integer}`。返回地图上的图层数量。\n\n## 其他函数\n\n以下函数也非常有用，将在整本书中使用，但不一定属于上述函数类别：\n\
  \n- `destroy()`: 调用 `destroy()` 会做你所想的事情——它会销毁地图对象。地图被销毁后，地图对象基本上变得无用。\n- `getLonLatFromPixel(\
  \ pixel )`: **参数**—pixel `{OpenLayers.Pixel}`。此函数基于传入的像素返回一个 `{OpenLayers.LonLat}`\
  \ 对象——传入像素中的坐标将被返回。一个示例调用是 `map.getLonLatFromPixel(new OpenLayers.Pixel(250,250))`。我们将在本书后面使用此函数。\n\
  \  **返回：** `{OpenLayers.LonLat}`。从传入的像素返回一个 LonLat 对象。\n- `getPixelFromLonLat( lonlat\
  \ )`: **参数**—`lonlat` `{OpenLayers.LonLat}`。此函数将根据传入的 `lonlat` 坐标返回一个像素位置。返回的像素坐标以视口坐标返回（意味着像素位置相对于地图\
  \ div 元素）。如果例如你想在指定坐标处在地图上方显示另一个 div，此函数非常有用。我们将在本书后面使用此函数。\n  **返回：** `{OpenLayers.Pixel}`。它从传入的坐标返回一个\
  \ `OpenLayers.Pixel`。\n- `render( element )`: **参数**—`element` `{HTML element or\
  \ String (of ID of element)}`。此函数接收一个参数——一个 HTML 元素或你希望将地图渲染到的元素的 ID。我们在本章前面见过此函数的实际应用。如果你在创建地图对象时没有传入\
  \ HTML 元素（或 ID），你可以延迟渲染并稍后调用此 render 方法。此函数会将地图渲染到传入的元素上。\n- `updateSize()`: 每当地图\
  \ div 的大小更新时都应调用此函数。例如，如果你有一个可调整大小的 div 且地图放置其中，那么你的代码应在该 div 调整大小时调用 `map.updateSize()`。\n\
  \n## 使用事件做事\n\n在第 6 章中，我们介绍了事件的概念以及 OpenLayers 如何使用事件。核心上，OpenLayers 使用本质上两种类型的事件：浏览器事件和地图事件。**浏览器**事件例如用鼠标点击地图\
  \ div，而**地图**事件例如将地图缩放至某个坐标。我们在第 6 章中对事件做了一点工作，所以让我们扩展这些知识并为地图添加更多自定义功能。\n\n![](img/1b8cd151c9f278555f9cf255b20d244e_233_0.png)\n\
  \n> 我们不会过多介绍浏览器事件，但它们背后的思想本质上与地图事件相同。了解更多关于浏览器事件的绝佳资源可以在 https://developer.mozilla.org/en/DOM/event\
  \ 找到。\n\n## 地图事件类型\n\n有多种受支持的地图事件类型。让我们先看看它们，然后我们将介绍如何在地图中使用它们。你也可以调用 `map.EVENT_TYPES`，它将返回一个有效的地图事件数组。某些事件类型会向事件监听器返回一个**事件对象**。如果返回了事件对象，它将在下面的事件类型描述中指定为\
  \ *Event Object*：\n\n- **addlayer**：此事件在图层添加*之后*触发。*Event object*：包含一个引用已添加图层的 `layer`\
  \ 属性。\n- **changebaselayer**：在底图更改后触发。\n- **changelayer**：此事件在图层的属性更改后触发。具体来说，每当其名称、顺序、不透明度、参数或可见性更改时就会触发。*Event\
  \ object*：包含一个引用已更改图层的 `layer` 属性，以及一个引用所更改属性类型的 `property` 属性（顺序、不透明度等）。\n- **mousemove**：每当鼠标在地图内部移动时触发此事件。\n\
  - **mouseout**：此事件在鼠标移出时触发；每当你的鼠标离开地图 div。\n- **mouseover**：每当地图获得鼠标悬停事件时触发；每当你的鼠标首次进入地图\
  \ div。\n- **movestart**：每当拖动、平移或缩放开始时，此事件就会触发。此事件指的是地图本身的移动，而不仅仅是鼠标。\n- **moveend**：在拖动、平移或缩放完成之后触发。此事件指的是地图本身的移动，而不仅仅是鼠标。\n\
  - **move**：此事件在地图的任何拖动、平移或缩放时触发。\n- **preaddlayer**：此事件在图层添加*之前*触发。*Event object*：包含一个引用将要添加图层的\
  \ `layer` 属性。\n- **removelayer**：当图层已从地图中移除时，此事件会触发。*Event object*：包含一个引用已移除图层的\
  \ `layer` 属性。\n- **zoomend**：此事件在地图缩放完成后触发。\n\n## 使用地图事件\n\n主要有两种常见的使用地图事件的方法。两种方法实现相同的目的——向地图添加监听器，以便在特定类型的事件触发时执行某些操作。一种方法是在创建地图对象时使用\
  \ `eventListeners` 属性。另一种方法是使用 `map.events.register(type, obj, listener)`。我们将介绍这两种方法。\n\
  \n## 使用 eventListeners 属性\n\n如果你在初始创建地图对象时就知道想要为地图添加哪些事件，这是一种不错的方法。要使用此属性，传入一个匿名对象，由\
  \ eventType: listenerFunction（键：值）对组成。eventType 是我们在上一节中描述的事件类型之一，而 listenerFunction\
  \ 是在该事件类型发生时将被调用的函数的名称。\n\n## 动手实践 – 使用 eventListeners\n\n让我们演示如何使用事件监听器。我们将从一个简单的示例开始，只要地图完成缩放就会发送一个警报。\n\
  \n- 1. 我们首先需要做的是创建一个函数，当某些事件发生时事件监听器会调用它。我们需要为 eventListeners 方法和稍后要讨论的 map.events.register\
  \ 方法都这样做。让我们创建一个简单的函数，当用户放大时发送警报。将它放在你的 init() 函数的第一行，在 OpenLayers 地图代码之前：\n- 2.\
  \ 接下来，我们需要创建地图对象并传入一个 eventListeners 对象。我们希望监听 zoomend 事件类型，这是地图完成缩放时发生的事件。因此，我们\
  \ eventListeners 对象中的键将是事件类型，即 'zoomend'。值将是我们希望被调用的函数的名称。请确保不要包含括号，因为我们实际上并没有调用函数——我们只是将值设置为对函数的引用，该函数将在事件发生时稍后被调用：\n\
  - 3. 现在，当你访问地图并放大时，一个警报框会弹出，显示文本 'You finished zooming'。\n\n```\nfunction alert_on_zoom(event){\
  \ alert('You finished zooming'); }\n```\n\n```\nmap = new OpenLayers.Map('map_element',\
  \ {\n    eventListeners: {\n        'zoomend': alert_on_zoom\n    }\n});\n```\n\n\
  \n\n## 发生了什么？\n\n我们刚刚使用地图对象的 `eventListeners` 属性为 `zoomend` 事件类型添加事件监听器。务必将值仅设置为函数名，不要包含括号，因为我们现在不想调用函数。当\
  \ `zoomend` 事件发生时，它会调用 `alert_on_zoom` 函数并传入事件对象。我们稍后会谈论事件对象包含的内容。\n\n## 使用 map.events.register\n\
  \n使用 `map.events.register` 基本上与设置 `eventListeners` 属性做同样的事情，但我们可以在地图对象创建后设置它。\n\n\
  函数调用如下：\n\n```\nmap.events.register(type, object, listener);\n```\n\n`type` 参数指的是\
  \ `eventType`，`object` 是对地图对象的引用——你几乎总是只需传入你的地图对象——而 `listener` 指的是事件触发时将被调用的函数。以下示例与之前事件监听器部分中的示例完全相同。像之前一样，我们创建一个函数，当\
  \ `zoomend` 事件发生时该函数将被调用。这里的不同之处在于，我们是在地图对象创建后才向其添加事件。\n\n```\nfunction alert_on_zoom(event){\
  \ alert('Map zoomed'); }\nmap.events.register('zoomend', map, alert_on_zoom);\n\
  ```\n\n现在，让我们谈谈传递给监听器函数的事件对象。\n\n## 事件对象\n\n处理事件时，通常了解发生了什么是有用的。事件对象为我们提供了有关事件的一些信息。根据事件类型，事件对象将具有不同的属性。\n\
  \n所有事件对象至少会有一个名为 `object` 的属性，它引用地图对象，以及一个 `element` 属性，它引用地图所在的 HTML 元素。此外，一些事件类型还包含更多属性。之前的\
  \ *地图事件类型* 部分包含了不同事件类型下事件对象属性的填充信息。\n\n要访问事件对象的属性，只需使用 `event.property`，其中 property\
  \ 是你想要访问的属性的名称。\n\n## 动手实践 – 使用地图事件\n\n- 1. 在地图对象实例化之前，让我们创建一个函数，当地图的 zoomend 事件被调用时该函数会被调用。首先，我们创建该函数：\n\
  \n```\nfunction zoomend_event(event) {\n  alert('Done zooming');\n}\n```\n\n- 2.\
  \ 让我们在之后再添加一个函数，当地图移动结束时，该函数会将第一层的透明度更新为随机值。首先，创建该函数：\n\n```\nfunction update_opacity(event)\
  \ {\n  map.layers[0].setOpacity(Math.random());\n}\n```\n\n- 3. 现在我们将创建地图对象。使用以下代码实例化地图对象，并传入\
  \ zoomend 和 moveend 的事件监听器：\n\n```\nmap = new OpenLayers.Map('map_element', {\n\
  \  eventListeners: {\n    'zoomend': zoomend_event,\n    'moveend': update_opacity\n\
  \  }\n});\n```\n\n- 4. 确保向地图添加一个 WMS 图层，并像我们之前所做的一样设置范围。现在，打开地图并开始在其中导航。当你放大时，你应该会收到一个警告。当你完成平移时，图层的透明度应该会发生变化。现在，让我们看看我们刚刚创建的事件实际上如何触发其他事件。有了我们拥有的\
  \ moveend 事件监听器，每当用户完成平移时，图层的透明度就会发生变化。更改图层的透明度会触发图层的 changelayer 事件。因此，让我们演示它是如何工作的。创建一个函数，该函数将发送一个包含有关事件对象的一些信息的警告，即图层的名称和被更改的属性。\n\
  \n```\nfunction show_layer_info(event) {\n  alert('Layer changed: ' + event.layer.name\
  \ + ' | Property Changed: ' + event.property);\n}\n```\n\n- 5. 现在，我们需要注册 changelayer\
  \ 事件。就像之前一样，我们将使用 map.events.register：\n\n```\nmap.events.register('changelayer',\
  \ map, show_layer_info);\n```\n\n- 6. 现在打开你的地图并开始触发事件。你可能很快就会对这些警告感到厌烦。\n\n![](img/1b8cd151c9f278555f9cf255b20d244e_238_0.png)\n\
  \n## 发生了什么？\n\n我们刚刚演示了如何将事件监听器添加到地图，并在地图事件发生时触发函数。你可能也注意到，每当你移动地图时，`changelayer`\
  \ 事件就会被调用。这是因为图层的透明度被更新，从而触发了 `changelayer` 事件。因此，一个重要的要点是事件可以（并且经常会）调用其他事件。我们将在整本书中使用更多事件，所以如果你现在对它们还不是完全熟悉——不用担心；它们还会再次出现。\n\
  \n## 多个地图\n\n到目前为止，我们所有的示例中只使用了一个地图。对于大多数应用程序来说，只需要一个地图就足够了。不过，有时拥有两个地图是件好事——比如当你学习\
  \ Map 类的工作原理时（虽然，我相信你可以更有创意一些）。\n\n## 使用多个地图对象\n\n在页面上创建两个地图对象并不太难。我们只需要另一个元素来放置第二个地图元素，并向地图添加控件和图层——这些都是我们在整本书中一直在做的事情。\n\
  \n我们谈到过控件和图层对象属于单个地图对象。但如果想要多个地图对象使用相同的图层怎么办？单个图层对象一次只能属于一个地图对象，但幸运的是，有一种简单的方法可以在多个地图中使用“相同”的图层对象——通过调用图层（或控件）的\
  \ clone() 方法。\n\n## 动手实践 – 使用多个地图对象\n\n到目前为止，我们所有的示例中只使用了一个地图对象。添加多个地图对象并不难——让我们弄清楚如何做到这一点。\n\
  \n- 1. 我们首先需要为第二个地图添加另一个 HTML 元素，并为保持一致性重命名第一个地图元素的 ID。编辑你的 HTML div 元素：\n- 2. 现在，在你的\
  \ JavaScript 代码中，让我们重命名全局 map 变量并添加另一个变量来保存我们的第二个地图（在 init() 函数正上方）：\n- 3. 让我们创建第一个地图及其图层和控件。这里没有什么新东西，我们主要只是将地图对象重命名为\
  \ map_1，并向其添加图层并设置中心：\n\n```html\n<div id='map_1_element' style='height: 500px;\
  \ float:left; width:400px;'></div>\n<div id='map_2_element' style='height: 500px;\
  \ float:left; width:400px;'></div>\n<div style='clear:both;'></div>\n```\n\n```javascript\n\
  var map1, map2;\n```\n\n```javascript\nmap_1 = new OpenLayers.Map('map_1_element',\
  \ {});\n\n//Create a base layer\nvar wms_layer_all = new OpenLayers.Layer.WMS(\n\
  \    'OpenLayers WMS',\n    'http://vmap0.tiles.osgeo.org/wms/vmap0',\n    {layers:\
  \ 'basic'},\n    {}\n);\n\nmap_1.addLayer(wms_layer_all);\n\nif (!map_1.getCenter())\
  \ {\n    map_1.zoomToMaxExtent();\n}\n```\n\n- 4. 现在，让我们创建第二个地图对象。\n\n```\nmap_2\
  \ = new OpenLayers.Map('map_2_element', {});\n```\n\n- 5. 我们还没有向其添加任何图层。在这种情况下，我们希望使用第一个地图拥有的相同图层。然而，由于图层对象一次只能属于一个地图，因此我们需要调用图层的\
  \ clone() 方法，这基本上会创建一个重复的图层对象。\n\n```\nvar wms_layer_all_map_2 = wms_layer_all.clone();\n\
  ```\n\n- 6. 添加图层，然后我们将使用第二个地图放大并将其设置为不同的位置：\n\n```\nmap_2.addLayer(wms_layer_all_map_2);\n\
  map_2.setCenter(new OpenLayers.LonLat(-42, 42), 3);\n```\n\n- 7. 查看你的页面。你应该会看到类似这样的内容：\n\
  \n![](img/1b8cd151c9f278555f9cf255b20d244e_240_0.png)\n\n## 发生了什么？\n\n我们刚刚在同一页面上创建了两个地图。我们使用了图层的\
  \ clone() 方法来复制图层对象，以便每个地图对象都有相同的图层，而无需手动重新创建图层对象。如果我们向地图添加控件对象，我们会使用控件对象的 clone()\
  \ 方法来复制它们。虽然这是一个相当简单的示例，但在某些情况下并排显示地图会更有用。\n\n\n\n## 多个地图和自定义事件\n\n让我们创建一个稍微复杂一些的应用程序，使用多个地图并添加事件监听器。一个地图将显示一个国家的缩放视图，而旁边的地图将显示一个特写视图。每当一个地图被移动时，另一个地图的中心点会立即更新。这种类型的地图应用程序对于诸如数据录入流程等事情非常有用，在这些流程中，两个大地图可能比一个带概览地图的大地图更易用。\n\
  \n让我们把本章中学到的一些概念整合起来，创建一个类似类型的应用程序。\n\n### 动手实践 – 创建多个地图和自定义事件应用程序\n\n在本示例中，我们将制作一个应用程序，其中包含两个并排的地图，在移动时相互更新。\n\
  \n- 1. 复制之前的示例。我们将以此为基础进行工作。\n- 2. 让我们重新创建第一个地图对象。对于本示例，我们将使第一个地图稍微放大一些并设置 maxResolution，以便地图不能缩放得比几次更多。我们还将使用两个控件——Navigation\
  \ 和 PanZoomBar。\n- 3. 让我们也更改中心点。我们将创建一个变量来存储起始中心坐标（也将由第二个地图使用）并更改 map.zoomToMaxExtent\
  \ 行。在图层添加到地图后，使用以下代码：\n\n```\nmap_1 = new OpenLayers.Map('map_1_element', {\n  \
  \  controls: [\n        new OpenLayers.Control.Navigation(),\n        new OpenLayers.Control.PanZoomBar()\n\
  \    ],\n    maxResolution:0.0054931640625,\n    minResolution:0.00034332275390625\n\
  });\n```\n\n```\nvar map_center = new OpenLayers.LonLat(-120, 34);\nif (!map_1.getCenter())\
  \ {\n    map_1.setCenter(map_center);\n}\n```\n\n- 4. 现在对于第二个地图，我们将使其处于更放大的级别并同样限制分辨率。将第二个地图的创建代码更改为以下内容：\n\
  \n```\nmap_2 = new OpenLayers.Map('map_2_element', {\n    controls: [\n        new\
  \ OpenLayers.Control.Navigation(),\n        new OpenLayers.Control.PanZoomBar()\n\
  \    ],\n    maxResolution: 0.17578125,\n    minResolution: 0.0439453125\n});\n\
  ```\n\n- 5. 接下来，让我们将 map_2 对象的中心点设置为与第一个地图相同的中心点：\n\n```\nmap_2.setCenter(map_center);\n\
  ```\n\n- 6. 现在，我们的两个地图对象已按我们想要的方式设置——我们的工作完成了一半。如果打开地图，你应该会看到类似这样的内容：\n\n![](img/1b8cd151c9f278555f9cf255b20d244e_242_0.png)\n\
  \n- 7. 我们的下一个目标是向地图添加事件，以便在地图移动时使地图对象相互更新。这比乍一看要棘手一些。让我们先为每个地图创建一个函数，当触发 moveend\
  \ 事件时会被调用。\n\n调用 setCenter 时传递 true 作为第三个参数非常重要，这样 moveend 事件不会被触发。如果被触发，我们将陷入无限循环（不好）。\n\
  \n```\nfunction update_map_1(event){\n    map_2.setCenter(map_1.getCenter(), null,\
  \ true);\n}\n```\n\n```\nfunction update_map_2(event){\n    map_1.setCenter(map_2.getCenter(),\
  \ null, true);\n}\n```\n\n- 8. 最后，让我们通过为两个地图对象注册事件来完成工作。\n\n```\nmap_1.events.register('moveend',\
  \ map_1, update_map_1);\nmap_2.events.register('moveend', map_2, update_map_2);\n\
  ```\n\n- 9. 全部完成！打开页面并平移。当你用一个地图完成平移时，另一个地图将被更新。\n\n### 到底发生了什么？\n\n你刚刚创建了一个相当复杂的地图应用程序，其中包含两个地图对象和几个自定义事件。凭借本章和前几章中学到的所有知识，我们可以开始做一些相当有趣的事情。这个示例只是我们只需在\
  \ OpenLayers 中做一点工作就能实现的内容的一个小样本。\n\n### 总结\n\n这就结束了 OpenLayers 库的核心覆盖范围。此时，我们已相当详细地介绍了三个“核心”类——Layer、Control\
  \ 和 Map。\n\n本章专门介绍了 Map 类及其属性和方法。然后我们更详细地介绍了地图事件以及如何使用它们。最后，我们学习了如何在同一页面上使用多个地图对象。\n\
  \n现在我们已经掌握了基础知识，我们就可以开始应用这些概念并创建一些非常有趣的地图应用程序。下一章介绍 Vector 类，这是一个非常强大的图层类，允许我们做很多很棒的事情。\n"
- "# 9 使用向量图层\n\n*此时，我们已经介绍了 OpenLayers 的基础。我们已经介绍了核心类——Map、Controls 和 Layers。本书的其余部分将更侧重于完善这些核心知识，扩展已介绍的概念并深入了解使用\
  \ API 可以做的更多“高级”事情。*\n\n*我们将从本章开始深入研究这些高级主题，介绍 Vector Layer 类。有了它，我们的地图可以通过显示和允许与矢量数据交互来变得更具交互性、响应性和更精致。*\n\
  \n*我们将介绍如何创建矢量图层、在其中创建和交互对象、从外部文件（如 KML）加载数据等等。在本章中，我们将介绍许多不同类型的示例并在此基础上构建，以演示 Vector\
  \ Layer 的工作原理。*\n\n本章将介绍 Vector Layer 类以及另外几个相关的类。我们将：\n\n- 讨论 Vector Layer 类是什么以及它如何工作\n\
  - 介绍 Vector Layer 类的属性、方法和事件\n- 介绍 Feature 和 Geometry 类\n- 讨论如何创建更高级的 Vector 图层\n\
  - 演示如何使用 Strategy 类\n- 了解 Protocol 类\n- 介绍 Format 类\n\n### 什么是向量图层？\n\nOpenLayers\
  \ 的 Vector 类通常用于在地图顶部显示数据并允许实时与数据交互。这是什么意思？基本上，这意味着我们可以从诸如 KML 或 GeoJSON 文件之类的地理空间文件中加载数据，并在地图上显示其内容，并按我们喜欢的方式设置数据的样式。例如，看看这张地图：\n\
  \n![](img/1b8cd151c9f278555f9cf255b20d244e_246_0.png)\n\n这显示了一张以 Google 图层作为底层底图并在其上叠加矢量图层的地图。数据（所有带数字的圆圈）是从\
  \ GeoJSON 文件加载的，这是一种许多其他应用程序支持的开放文件格式。在矢量图层中，地图上散布着许多数据点。地图上的每个点都是矢量图层中的一个对象，这些对象被称为\
  \ Features。\n\n在这种情况下，每个要素实际上是一个数据点的集群——每个圆圈中的数字代表属于该集群的点数。这种聚类行为是 OpenLayers 可以通过\
  \ Strategy 类开箱即用地使用的，我们将在本章后面介绍它。在进入那一点之前，让我们谈谈将矢量图层与其他图层区分开来的主要事情之一。\n\n### 向量图层有什么特别之处？\n\
  \n对于栅格图像，你所看到的就是你所得到的。如果你要在地图上查看一些近距离的卫星图像并看到一堆聚集在一起的建筑物，你不一定会知道关于那些建筑物的任何额外信息。你甚至可能不知道它们是建筑物。由于栅格图层由图像组成，因此解释你所看到的内容取决于用户。这不一定是坏事，但矢量图层提供了更多。\n\
  \n使用矢量图层，你可以显示建筑物的实际几何形状并附加额外信息——例如其价值、所有者、其平方英尺等。正如我们将在本章后面看到的那样，很容易将矢量图层放在现有的栅格图层之上并在特定位置创建要素。我们还将看到只需单击或将鼠标悬停在要素上即可获取有关要素的额外信息。\n\
  \n### 向量图层是客户端的\n\n另一个根本区别是矢量图层通常用作客户端图层。这意味着通常与实际矢量数据的交互仅发生在客户端。例如，当你在地图上导航时，矢量图层不会向服务器发送请求以获取有关图层的更多信息。一旦你获得初始数据，它就存在于你的浏览器中，你通常不需要再次请求相同的数据（在大多数情况下，尽管\
  \ WFS 是一个例外；我们将在本章后面介绍）。\n\n由于在大多数情况下矢量数据是在客户端加载的，因此与矢量图层的交互通常几乎是即时的。然而，存在一些限制。矢量图层依赖于用户的浏览器和计算机。虽然除\
  \ Internet Explorer 之外的大多数浏览器每天都在以惊人的速度进步并变得更加强大，但限制确实存在。\n\n由于浏览器限制，矢量图层中的要素过多会开始变慢。要素数量没有硬性数字，但通常超过几百个要素就会在大多数计算机上开始变慢。然而，有很多方法可以解决这个问题，例如在不需要时删除要素，我们将在后面更深入地讨论性能问题。\n\
  \n### 其他用途\n\n使用矢量图层，我们可以显示任何我们想要的几何对象——点、线、多边形、正方形、标记……任何你能想象的形状。我们可以使用矢量图层绘制线条或多边形，然后计算它们之间的距离。我们可以绘制形状然后使用多种格式导出数据，然后将该数据导入其他程序，例如\
  \ Google Earth。这些只是一些基本情况，而在本章中你将看到矢量图层可以多么强大。\n\n\n\n## 什么是“向量”？\n\n在图形方面，本质上只有两种类型的图像：栅格和矢量。你看到的大多数图像都是栅格图像——也就是说，从根本上讲，它们由像素网格组成，放大时质量会下降。例如，照片就是栅格图像。如果你放大它，它往往会变得模糊或被拉伸。大多数图像文件——.jpegs、.png、.gifs、任何位图图像——都是栅格图像。\n\
  \n矢量则不同，它使用基于数学方程的几何形状来构成图像。这意味着放大时质量得以保留。如果你放大一个圆形的矢量图像，线条始终看起来是弯曲的——而在栅格图像中，线条看起来会是直的，因为栅格图像由颜色网格组成。矢量图形不受网格限制，因此在所有比例下都能保持形状。\n\
  \n## 动手时间 – 创建矢量图层\n\n让我们开始创建基本的矢量图层。在这个示例中，在你向矢量图层添加一些点和其他要素类型后，尝试放大。你会注意到，随着放大的进行，你添加的点不会失去质量。之后我们会讲解其工作原理。\n\
  \n- 1. 我们先使用一个基本的 WMS 图层：\n```\nvar wms_layer = new OpenLayers.Layer.WMS(\n    'OpenLayers\
  \ WMS',\n    'http://vmap0.tiles.osgeo.org/wms/vmap0',\n    {layers: 'basic'},\n\
  \    {}\n);\n```\n- 2. 现在，让我们创建矢量图层本身。我们将使用默认投影和矢量图层的默认值，因此要创建图层，我们所需要做的就是创建它：\n\
  ```\nvar vector_layer = new OpenLayers.Layer.Vector('Basic Vector Layer')\n```\n\
  - 3. 现在将图层添加到地图：\n```\nmap.addLayers([wms_layer, vector_layer]);\n```\n- 4. 如果我们现在查看地图，只会看到一张简单的地图——我们的矢量图层没有加载任何数据，而且我们也没有任何控件来让我们添加矢量数据。\n\
  \n- 5. 让我们向地图添加 **EditingToolbar** 控件，它允许我们在矢量图层上添加点并绘制多边形。要做到这一点，我们只需要从 `OpenLayers.Control.EditingToolbar`\
  \ 实例化一个对象并传入一个矢量图层。我们将传入之前创建的 `vector_layer` 对象：\n```\nmap.addControl(new OpenLayers.Control.EditingToolbar(vector_layer));\n\
  ```\n- 6. 现在查看地图。你应该能看到 `EditingToolbar` 控件（它基本上是一个带有控制按钮的面板控件）。选择不同的控件将允许你在矢量图层上放置矢量对象（称为要素）。尝试使用\
  \ `EditingToolbar` 控件并在地图上放置几个不同的点/多边形：\n\n![](img/1b8cd151c9f278555f9cf255b20d244e_249_0.png)\n\
  \n- 7. 现在，再进行最后一步。你已在地图上放置了一些要素（点/多边形/线等），但如果刷新页面它们就会消失。我们可以获取这些要素的信息，然后将其导出为地理空间文件。我们稍后会处理文件，但现在让我们获取我们创建的要素的信息。要访问矢量图层要素的信息，我们所需要做的就是访问其\
  \ `features` 数组。在 Firebug 中，输入并运行以下内容：\n```\nmap.layers[1].features\n```\n\n- 8.\
  \ 你应该会看到列出的一堆对象，每个对象都是你在地图上放置的一个要素：\n```\n[Object { layer=Object, more...}, Object\
  \ { layer=Object, more...}, Object { layer=Object, more...}, ...]\n```\n- 9. 现在，如果你展开其中一个对象，你将获得有关要素的信息。`geometry`\
  \ 属性是每个要素都有的一个匿名对象，其中包含几何信息。你还可以看到要素对象的方法——尝试使用不同的函数。你可以通过使用 `map.layers[1].features[x]`\
  \ 来访问单个要素，其中 x 是 features 数组中要素的索引。例如，要销毁我们添加到地图上的第一个要素，我们可以使用：\n```\nmap.layers[1].features[0].destroy();\n\
  ```\n\n## 刚才发生了什么？\n\n我们刚刚演示了如何创建基本的矢量图层并使用 `EditingToolbar` 控件向其添加要素。使用矢量图层的 `features`\
  \ 数组，我们还销毁了一些要素。正如你刚才看到的，开始使用矢量图层并不困难——事实上非常容易。本章的其余部分或多或少都是在此基础上构建的，所以无需感到畏惧。\n\
  \n## 小测验 – 为什么使用矢量图层？\n\n矢量图层往往非常快，因为数据可以完全存储在客户端。交互是即时的，这可以极大地增强用户体验。想出几个你会使用矢量图层的情况。\n\
  \n现在，在我们深入矢量图层的更高级用法之前，先来看看它实际是如何工作的。\n\n## 矢量图层的工作原理\n\n要理解矢量图层的工作原理，我们主要需要涵盖四件事。\n\
  \n- 如何渲染矢量图层\n- 矢量图层类本身\n- 几何和要素类\n- 如何使用相关的 Strategy、Protocol 和 Format 类\n\n让我们来回顾渲染——幸运的是，这并不复杂。\n\
  \n## 矢量图层的渲染方式\n\n正如我们之前讨论的，矢量图层不使用栅格图形。其他图层类型使用 <img> 标签（图像标签）来显示图像——在 HTML 中，图像标签只会显示栅格图像。因此，我们不能像其他图层那样只使用\
  \ <img> 标签。相反，我们必须使用矢量图像渲染器。正如我们之前提到的，矢量数据不仅仅是一张图像，还可以包含诸如数据坐标之类的附加信息。\n\n矢量数据必须被渲染才能被看到。OpenLayers\
  \ 支持三种渲染矢量图层的方式：SVG、Canvas 和 VML。\n\n## SVG\n\n渲染矢量图层的默认方式是使用 SVG 渲染器，它使用 <svg>\
  \ 标签。SVG 是 Scalable Vector Graphics（可缩放矢量图形）的缩写，允许我们在浏览器中渲染矢量图像。所有浏览器（除 Internet\
  \ Explorer 外）都支持 SVG，因此默认情况下 OpenLayers 使用 SVG 来渲染矢量图层。\n\n## Canvas\n\n我们可以使用 Canvas\
  \ 渲染器，它使用 <canvas> HTML 标签。然而，使用这种渲染器往往会稍微慢一些，因为矢量实际上会被 canvas 标签转换为栅格——但在某些情况下这可能是可取的。\n\
  \n## VML\n\nInternet Explorer 不遵循网络标准，并且在撰写本文时不支持 SVG 或 Canvas。幸运的是，默认情况下，OpenLayers\
  \ 会检测用户网络浏览器是否不支持现代技术，并使用一个名为 VML 的后备渲染器（它类似于 SVG，但特定于 Microsoft）。SVG 通常比 VML 更快，因此你只想在\
  \ Internet Explorer 中使用时才使用 VML 而非 SVG。\n\n## “Renderers” 数组\n\n当你创建矢量图层时，它会查找一个名为\
  \ renderers 的数组，其中包含要使用的渲染器的名称，按顺序排列。默认情况下，renderers 数组设置为：\n```\n[\"SVG\", \"VML\"\
  , \"Canvas\"]\n```\n这意味着 OpenLayers 会首先尝试使用 SVG，如果浏览器不支持 SVG，它将回退到 VML——如果不支持 VML，它将尝试使用\
  \ Canvas。\n\n## 动手时间 – 更改 Renderers 数组\n\n让我们使用 Canvas 渲染器，看看我们的地图是什么样子的。\n\n- 1.\
  \ 复制之前的示例。我们只会更改代码中的一行。\n- 2. 我们需要做的唯一事情是在实例化矢量图层时设置 renderers 属性。默认情况下，它设置为 ['SVG',\
  \ 'VML', 'Canvas']。让我们将 Canvas 设为默认渲染器。用以下内容替换你的矢量图层实例化代码：\n- 3. 打开地图并绘制一些点。它可能看起来相似，但你可能会注意到线条不如使用\
  \ SVG 渲染器时那样清晰。如果使用 Firebug 检查地图元素，你会看到一个 <canvas> 标签：\n```\nvar vector_layer =\
  \ new OpenLayers.Layer.Vector('Basic Vector Layer', {\n  renderers: ['Canvas', 'SVG',\
  \ 'VML']\n});\n```\n![](img/1b8cd151c9f278555f9cf255b20d244e_252_0.png)\n\n## 刚才发生了什么？\n\
  \n你刚刚看到了更改矢量图层所使用渲染器是多么容易——尽管通常没有必要更改它。\n\n现在我们知道了矢量图层是如何渲染的，让我们谈谈它本身的类。\n\n\n\n\
  ## Vector Layer class\n\n向量图层本身与我们迄今为止讨论过的其他图层一样——但要充分利用它，我们将与其他类一起工作。\n\n即使要让一个基本示例运行（就像本章中的第一个示例），我们也会使用其他几个类。具体来说，向量类使用\
  \ Feature 类在图层上显示对象。但 Feature 类要工作，需要使用 Geometry 类来创建几何对象。因此，你的向量图层中的实际向量对象是 Feature\
  \ 对象，它们由 Geometry 对象组成——我们很快会介绍所有这些内容。\n\n在此之前，让我们先介绍 Vector Layer 类本身。我们将首先介绍 Vector\
  \ 类的属性，然后是方法（方式与第 3 章类似）。\n\n## OpenLayers.Layer.Vector properties\n\n让我们回顾一下 Vector\
  \ 类包含的属性。其中一些是来自其他类的实例化对象，将在本章后面介绍。\n\n- `drawn: {Boolean}`. 返回 `true` 或 `false`，取决于要素是否已被绘制。在实例化向量图层对象时不会设置此属性。\n\
  - `features: {Array {OpenLayers.Feature.Vector}}`. 这是属于向量图层的要素对象的数组。我们在之前的示例中见过它——通过访问此数组，我们可以了解向量图层包含的所有对象（要素）的信息。由于这是一个数组，你可以通过调用\
  \ `vector_layer.features[X]` 来访问单个要素，其中 X 是所需要素的索引。我们将在本章后面更深入地介绍如何与要素交互。\n- `filter:\
  \ {OpenLayers.Filter}`. 通过将过滤器对象分配给向量图层对象，你可以根据提供给过滤器对象的属性（正如名称所示）过滤掉某些数据。当你只想显示来自数据源的部分要素而不是全部时，这非常有用。我们将在第\
  \ 10 章的 Filter 类部分详细讨论此属性。\n- `isBaseLayer: {Boolean}`. 默认值为 `false`。指定图层是否为底图。你可以使用向量图层作为底图，从而拥有完全基于向量的地图，而不必依赖\
  \ WMS 或 Google Maps 图层作为底图。\n- `isFixed: {Boolean}`. 默认值为 `false`。确定在拖动地图时向量图层是否会移动。如果例如你想在地图上放置一个始终保持在地图中心的标记，这会很有用（在这种情况下你会将此属性设置为\
  \ `true`）。\n- `isVector: {Boolean}`. 如果图层是向量图层，则返回 `true`。在实例化向量图层时不会设置此属性。此属性主要用于检查已实例化的图层是否为向量图层。例如，如果你想遍历地图上的所有图层并确定某个图层是否为向量图层，你很可能会使用此属性。\n\
  - `protocol: {OpenLayers.Protocol}`. 指定向量图层使用的协议对象。在关于策略、协议和格式的部分中，我们将对此进行更深入的讨论。\n\
  - `renderers: {Array{String}}`. 指定包含要使用的渲染器的字符串数组。每个渲染器按顺序尝试，如果浏览器不支持，则尝试下一个渲染器。本章前面我们介绍了如何使用此属性。\n\
  - `rendererOptions: {Object}`. 渲染器将使用一个由属性组成的匿名对象。我们在本章中不会再谈论渲染器，但此对象可以包含的属性在 OpenLayers\
  \ 文档中列出，每个渲染器类在 http://dev.openlayers.org/docs/files/OpenLayers/Renderer-js.html。\n\
  - `reportError: {Boolean}`. 默认值为 `true`。此属性指定如果渲染器加载失败是否报告错误消息。\n- `selectedFeatures:\
  \ {Array{OpenLayers.Feature.Vector}}`. 此属性包含图层中当前被选中的要素的数组。例如，可以通过单击要素来选择要素。此属性在关于与要素交互的部分中会更详细地讨论。\n\
  - `strategies: {Array{OpenLayers.Strategy}}`. 策略对象的数组。策略告诉向量图层如何行为，例如将要素聚类。在关于策略、协议和格式的部分中，我们将对此进行更深入的讨论。\n\
  - `style: {Object}`. 包含向量图层的样式信息。通过它，我们可以更改向量图层中要素的颜色、大小等。我们将在第 10 章中更详细地讨论这个问题。\n\
  - `styleMap: {OpenLayers.StyleMap}`. 定义向量图层将使用的样式的 stylemap 对象。第 10 章详细介绍了 Style\
  \ 和 StyleMap 类。\n- `unrenderedFeatures: {Object}`. 这包含未能渲染的要素的匿名对象（如果存在）。在实例化向量图层对象时不会设置此属性。\n\
  \n## OpenLayers.Layer.Vector methods\n\n现在我们已经介绍了 Vector Layer 类的属性，让我们讨论可以调用的方法。我们只介绍特定于\
  \ Vector 图层的功能；从基础 OpenLayers.Layer 父类继承的功能可以在第 3 章中找到。\n\n- `clone()`: 复制图层及其包含的要素。返回一个\
  \ `{OpenLayers.Layer.Vector}` 对象，即图层的副本。\n- `getDataExtent()`: 此函数将返回一个 `{OpenLayers.Bounds}`\
  \ 对象，其中包含包含图层所有要素的最大范围。\n- `refresh(obj)`: 导致图层请求要素并重绘它们。如果图层可见且在地图范围之内，则会触发刷新事件。接受一个可选的\
  \ `obj` 对象，其中包含事件侦听器的属性。\n- `assignRenderer()`: 根据图层的 `renderers` 属性为图层分配渲染器。\n\
  - `displayError()`: 显示一个警告，告知用户其浏览器不支持图层的渲染器。\n\n## Working with features\n\n我们将讨论的剩余方法涉及要素。正如我们之前看到的，要素是属于向量图层的对象。我们将先介绍方法，然后通过相关示例逐步说明如何正确使用它们。\n\
  \n**addFeatures(features, options)**: 调用此函数将向地图添加要素。你必须至少传入一个 `features` 对象数组，并且可以可选地传入一个\
  \ `options` 对象。`features` 参数是 `{Array{OpenLayers.Feature.Vector}}`，而 `options` 是一个匿名\
  \ `{Object}`。\n\n## Time for Action – adding features\n\n让我们手动向地图添加一些要素。\n\n1. 复制第一个示例——我们只需要一个基本的\
  \ WMS 底图和一个向量图层。\n2. 在 Firefox 中打开地图并启用 Firebug。我们将使用 JavaScript 控制台向向量图层添加要素。\n\
  3. 让我们先创建一些要素。为此，我们需要使用 OpenLayers.Geometry 类。让我们先创建一个 OpenLayers.Geometry.Point\
  \ 对象，传入经度和纬度（在 Firebug 中输入并执行以下内容）：\n\n```\nvar point = new OpenLayers.Geometry.Point(-72,\
  \ 42);\n```\n4. 现在我们有了几何对象，可以从中创建一个要素对象。我们将使用 OpenLayers.Feature.Vector 类使用我们刚刚创建的点对象创建一个要素对象。实例化时，构造函数可以接受三个参数——geometry、attributes（可选）和\
  \ style（可选）。我们将在本章后面详细介绍 Feature 类。创建要素点，传入上面创建的几何对象：\n\n```\nvar feature_point\
  \ = new OpenLayers.Feature.Vector(point);\n```\n5. 好了，现在我们可以使用 addFeatures 将要素添加到地图了。即使我们只传入一个要素，仍然必须传入一个数组。像这样添加：\n\
  \n```\nmap.layers[1].addFeatures([feature_point]);\n```\n6. 你应该会看到点已添加到地图：\n\n![](img/1b8cd151c9f278555f9cf255b20d244e_256_0.png)\n\
  \n## What Just Happened?\n\n我们刚刚使用 addFeatures 方法将从几何对象创建的要素添加到地图。如果 OpenLayers.Geometry\
  \ 类对你来说是新的，不用担心——我们将在本章中介绍它，并提供更多示例。\n\n\n\n## 动手试试 – 创建更多点\n\n现在你已经知道如何向地图添加点，请尝试添加更多点。以之前的示例代码为指导，向地图添加多个\
  \ Geometry Point 对象。更改坐标并观察位置如何受影响。还尝试在地图范围外添加一个点，看看会发生什么。\n\n让我们继续讨论关于矢量图层的方法。\n\
  \n## 矢量图层方法（续）\n\n- **removeFeatures(features, options)**: 此函数将通过擦除传入的要素并将其从图层中移除来从矢量图层中移除要素（但要素本身*并未*被销毁）。对于每个要素都会触发两个事件——`beforefeatureremoved`\
  \ 和 `featureremoved`。\n\n此函数接收两个参数，与 `addFeatures` 方法类似。`features` 参数是一个 `{Array{OpenLayers.Feature.Vector}}`，而\
  \ options 是一个匿名 `{Object}`。`options` 参数可以接受一个 `silent` 属性，其类型为 `{Boolean}`，默认值为\
  \ `false`，用于决定是否触发事件。\n\n- **removeAllFeatures(options)**: 调用此函数将从地图中移除所有要素。与上述方法类似，它不会销毁要素，但会将其从地图中擦除并从图层的要素数组中移除。它接收一个可选的\
  \ `options` 参数，可以接受一个 `silent` 属性，如果设置为 `true`，将抑制事件触发。\n\n- **destroyFeatures(features,\
  \ options)**: 此函数将擦除并销毁传入的任何要素。此函数与 `removeFeatures` 的区别在于，`destroyFeatures` 会同时从图层中移除要素*并*销毁要素本身——因此无法将已被销毁的要素重新添加到地图中。它接收两个参数——两者都是可选的。如果未传入\
  \ `features` 参数，图层的*全部*要素将被销毁。\n\n## 动手实践 – 销毁要素\n\n让我们演示 `removeFeatures` 与 `destroyFeatures`\
  \ 之间的区别。\n\n1. 打开本章的第一个示例。我们再次使用 Firebug。\n\n2. 在移除要素之前，我们首先需要将它们添加到地图。我们将使用之前的示例中的相同代码。让我们创建一个要素对象。在\
  \ Firebug 中，输入并执行：\n```javascript\nvar feature_point = new OpenLayers.Feature.Vector(new\
  \ OpenLayers.Geometry.Point(-72, 42));\n```\n\n3. 现在，让我们将其添加到地图：\n```javascript\n\
  map.layers[1].addFeatures([feature_point]);\n```\n\n4. 现在地图上已有要素，让我们看看 removeFeatures\
  \ 的工作原理。我们可以调用此函数，并传入来自 map.layers[1].features 数组的要素，或传入我们已创建的要素对象。让我们使用第二种方法：\n\
  ```javascript\nmap.layers[1].removeFeatures([feature_point]);\n```\n\n5. 现在你应该在地图上看不到任何要素。如果我们检查\
  \ map.layers[1].features 数组，它应该为空：\n```javascript\n>>>map.layers[1].features;\n\
  []\n```\n\n6. 正如我们所预期的那样，我们最初添加到地图的要素已不再在 features 数组中。然而，该要素本身仍然存在。我们可以通过简单地输入要素对象的名称来检查这一点：\n\
  ```javascript\n>>>feature_point\nObject { data=Object, more... }\n```\n\n7. 这就是\
  \ removeFeatures 与 destroyFeatures 之间主要区别所在——调用 removeFeatures 时，要素本身仍然存在于内存中。如果计划不再使用该要素，这不是一件好事。让我们看看使用\
  \ destroyFeatures 会发生什么。首先，我们必须将要素重新添加到地图：\n```javascript\nmap.layers[1].addFeatures([feature_point]);\n\
  ```\n\n8. 现在我们可以销毁它。我们将在调用 destroyFeatures 时使用 map.layers[1].features 数组来传入要素：\n\
  ```javascript\nmap.layers[1].destroyFeatures([map.layers[1].features[0]]);\n```\n\
  \n9. 要素现在应该已从地图中移除。不过要素对象本身也会被销毁。如果我们尝试访问该要素，所有属性都为 null。\n\n```\n>>>feature_point.data\n\
  null\n>>>feature_point.geometry\nnull\n```\n\n## 发生了什么？\n\n我们刚刚演示了 `removeFeatures`\
  \ 与 `destroyFeatures` 之间的区别。前者将要素从图层中移除，而后者同样会移除要素并销毁要素本身，因此无法再次将其添加到地图中。\n\n继续。\n\
  \n## 矢量图层方法（续）\n\n- **drawFeature(feature, style)**: 此函数将绘制/重绘传入的要素到图层。只有在要素样式发生变化时才应使用此函数——它不会将要素添加到图层，并且仅在要素已被添加后才有效。`feature`\
  \ 参数是要绘制的要素，`style` 参数是一个可选的样式 `{Object}`。如果未传入样式，则使用图层的默认样式。\n\n- **eraseFeatures(features)**:\
  \ 此函数接收一个要素对象数组并将其从地图中擦除。它*不会*从图层对象中移除要素，也不会销毁要素对象本身。使用此函数，你可以从地图中移除要素，但保留要素在图层的要素列表中——然后可以将已擦除的要素传入\
  \ `drawFeature` 方法以重新显示它。\n\n- **getFeatureById(featureId)**: 此函数接受一个由要素 ID 组成的\
  \ `{String}`。它将返回一个对应的 `{OpenLayers.Feature.Vector}` 对象（要素对象）——如果未找到，则返回 `null`。如果在创建要素对象时未设置\
  \ ID，ID 将是一个自动生成的字符串，类似于 `OpenLayers.Feature.Vector_42`——数字也基本上是随机的，因此你可能只有在创建要素时设置了\
  \ ID 时才需要使用此函数。否则，你可能想使用 `getFeatureByFid` 方法。\n\n- **getFeatureByFid(featureFid)**:\
  \ 此函数与 `getFeatureById` 函数类似，但查找的是 FID 而不是 ID。FID 是一个字符串，通常指定要素在 `features` 数组中的索引（如果不是从外部源加载数据，可能需要手动设置）。与\
  \ `getFeatureById` 类似，它接受一个由要素 Fid 组成的 `{String}`。它将返回一个对应的 `{OpenLayers.Feature.Vector}`\
  \ 对象（要素对象）——如果未找到，则返回 `null`。\n\n- **getFeatureFromEvent(event)**: 调用此函数将返回在 `{Event}`\
  \ 发生时经过的要素，或返回 `null`。例如，如果传入了 `featureselected` 事件，此函数将返回被选中的要素。我们将在下一节介绍矢量图层事件。\n\
  \n- **onFeatureInsert(feature)**: 此方法将在要素插入到矢量图层后*立即*被调用。默认情况下，它是一个空函数。如果提供一个函数，它将在要素插入后被调用。`feature`\
  \ 参数将传入到你创建的任何函数中。覆盖此函数的示例调用如下：\n\n```\nmap.layers[1].onFeatureInsert = function(feature){\
  \ alert(feature);\n};\n```\n\n上述代码将导致显示一个 alert，显示插入到地图中的要素。下一个 *动手实践* 示例将使用此函数。\n\
  \n- **preFeatureInsert(feature)**: 此方法将在要素插入到矢量图层前*立即*被调用。默认情况下，它是一个空函数。如果提供一个函数，它将在要素插入前被调用。`feature`\
  \ 参数将传入到你创建的任何函数中。覆盖此函数的示例调用如下：\n\n```\nmap.layers[1].preFeatureInsert = function(feature){\
  \ alert(feature);\n};\n```\n\n上述代码将导致显示一个 alert，显示将要插入到地图中的要素。下一个 *动手实践* 示例将使用此函数。\n\
  \n## 动手实践 – 处理要素事件\n\n让我们快速回顾一下之前的几个 Vector 类方法。\n\n1. 打开本章的第一个示例——我们将使用 Firebug，并且只需要一个矢量图层和\
  \ EditingToolbar 控制。我们不会编辑任何代码，因此打开第一个示例和 Firebug 的 JavaScript 控制台。\n\n2. 我们将使用\
  \ `preFeatureInsert` 添加一个函数，该函数将显示包含要素 ID 的 alert。此函数将在要素插入地图之前触发。在 Firebug 中输入并运行以下代码以创建函数：\n\
  \n```\nmap.layers[1].preFeatureInsert = function(feature){\n  alert('preFeatureInsert\
  \ - ID: ' + feature.id)\n};\n```\n\n\n\n3. 现在查看地图并使用 EditingToolbar 控制（或调用 `map.layers[1].addFeatures()`）添加一个点。你应该会看到一个在要素添加到地图之前触发的警告框，显示即将添加要素的\
  \ ID。请注意警告框中包含的 ID。\n\n4. 使用警告框中的 ID，让我们调用 `getFeatureById` 函数（如果没有获取到 ID，只需创建另一个要素或在\
  \ `map.layers[1].features` 数组中找到 ID）。我生成的 ID 为 `OpenLayers.Feature.Vector_143`，所以我将使用它——但请确保使用为你生成的\
  \ ID。调用以下函数，将我使用的 ID 替换为你的 ID：\n\n```\nmap.layers[1].getFeatureById('OpenLayers.Feature.Vector_143');\n\
  ```\n\n运行后应返回要素对象给你。\n\n5. 现在，让我们使用 `onFeatureInsert` 在要素添加后触发一个函数调用。让我们显示一个包含要素几何信息的警告框：\n\
  \n```\nmap.layers[1].onFeatureInsert = function(feature){\n  alert('onFeatureInsert\
  \ - Geometry:' + feature.geometry)\n};\n```\n\n6. 现在，尝试添加一个要素。你应该会看到两个警告框——一个在点添加之前显示要素的\
  \ ID，另一个在要素添加之后包含几何信息。\n\n## What Just Happened?\n\n发生了什么？\n\n我们刚刚使用了涉及矢量图层事件的几个函数。这结束了我们对\
  \ Vector 类方法部分的讨论，并开始介绍 Vector 图层类事件的覆盖范围。别担心——它没有前面的章节那么长，而且你在之前的章节中已经接触过困难的事件内容。\n\
  \n## Vector Layer class events\n\n矢量图层类事件\n\n在第 8 章中我们介绍了事件。这里讨论的相同概念同样适用，但本章后面会使用一些尚未介绍的特定于矢量图层的事件类型。让我们先回顾支持的事件类型，然后再实际操作。因为\
  \ Vector 类继承自 `OpenLayers.Layer` 基类，所以图层类的所有事件类型也可以使用。\n\n## Vector Layer event\
  \ types\n\n矢量图层事件类型\n\n所有这些事件都可以像上一章注册事件那样进行注册。例如：\n\n```\nvector_layer.events.register(type,\
  \ obj, listener);\n```\n\n假设 `vector_layer` 是你的矢量图层对象的名称，上面的代码将为传入类型的事件注册一个监听器。除了图层类的事件类型外，Vector\
  \ 类还支持以下事件类型（按字母顺序排列）：\n\n- **afterfeaturemodified**: 在要素被修改后触发。监听函数接收一个引用已修改要素的\
  \ `feature` 对象。\n- **beforefeatureadded**: 此事件在单个要素添加到地图之前触发。监听函数将接收一个包含 feature\
  \ 属性的对象，该属性引用即将添加的要素。如果监听函数返回 `false`，要素将不会被添加到地图。\n- **beforefeaturesadded**: 此事件与\
  \ `beforefeatureadded` 做同样的事情，但监听函数将接受一个要素数组而不是单个要素。如果监听函数返回 `false`，要素将不会被添加。\n\
  - **beforefeaturemodified**: 在要素被选中修改之前触发。监听函数接收一个引用即将被修改要素的 `feature` 对象。\n- **beforefeatureremoved**:\
  \ 在单个要素对象从地图中移除之前触发，监听函数接收一个引用被移除要素的 `feature` 对象。\n- **beforefeaturesremoved**:\
  \ 在一组要素对象从地图中移除之前触发，监听函数接收一个引用被移除要素的 `features` 数组。\n- **featureadded**: 在单个要素对象添加到地图后立即触发，监听函数接收一个引用已添加要素的\
  \ `feature` 对象。\n- **featuresadded**: 与前一种类型类似，但设计用于接收要素数组。它在要素对象数组添加到地图后立即触发。监听函数接收一个引用已添加要素的\
  \ `features` 数组。\n- **featuremodified**: 在要素被修改时触发。这与 `afterfeaturemodified` 事件有细微差别。此\
  \ `featuremodified` 事件在要素刚被修改时就触发，而 `afterfeaturemodified` 事件在修改完全完成后才触发。监听函数接收一个引用已修改要素的\
  \ `feature` 对象。\n- **featureremoved**: 在单个要素对象从地图中移除后触发，监听函数接收一个引用被移除要素的 `feature`\
  \ 对象。\n- **featuresremoved**: 在要素对象数组从地图中移除后触发，监听函数接收一个引用被移除要素的 `features` 数组。\n\
  - **featureselected**: 在要素被选中后触发。监听函数接收一个引用所选要素的 `feature` 对象。通常在使用本章后面介绍的 SelectFeature\
  \ 控制时使用。\n- **featureunselected**: 在要素被取消选中后触发。监听函数接收一个引用未选中要素的 `feature` 对象。通常在使用本章后面介绍的\
  \ SelectFeature 控制时使用。\n- **refresh**: 当矢量图层请求新要素时，或当调用 `refresh` 方法时会触发此事件。例如使用\
  \ WFS 协议时，矢量图层会发出额外的要素请求并触发此事件。我们将在本章后面介绍从外部源请求数据。\n- **sketchcomplete**: 在草图完成后再触发。例如使用\
  \ `EditingToolbar` 控制可以制作草图——绘制线条或多边形被视为“草图”。当绘制完全完成时（即双击完成草图时），`sketchcomplete`\
  \ 事件会被触发。监听器接收一个引用草图要素的 `feature` 对象。如果监听函数返回 `false`，要素将不会被添加。\n- **sketchmodified**:\
  \ 当草图被修改时触发。例如，如果你正在使用 `EditingToolbar` 控制绘制多边形并移动鼠标，就会触发此事件。监听器接收一个引用草图要素的 `feature`\
  \ 对象，以及引用已修改点的 `vertex` 属性。\n- **sketchstarted**: 草图一开始就触发。例如，如果你点击 `EditingToolbar`\
  \ 控制的绘制多边形控制并在地图上放置一个点，就会触发此事件。监听器接收一个引用草图要素的 `feature` 对象，以及引用起始点的 `vertex` 属性。\n\
  - **vertexmodified**: 每当任何要素包含的任何顶点被修改时就会触发此事件。监听函数接收三个参数：`feature` 引用顶点所属的要素，`vertex`\
  \ 引用一个点（已修改的顶点），以及 `pixel` 包含顶点被修改时的屏幕像素位置。\n\n## Time For Action – using Vector\
  \ Layer events\n\n动手实践 – 使用矢量图层事件\n\n现在你知道了可能的事件类型，让我们试玩一些。\n\n1. 打开本章的第一个示例。我们不会编辑代码，而是再次使用\
  \ Firebug。我们只需要一个矢量图层和 `EditingToolbar` 控制。如前几章所述，`map.layers[1]` 被假定为矢量图层。\n\n\
  2. 打开 Firebug。我们将首先向地图注册一个 `beforefeatureadded` 事件。首先，像第 8 章一样，我们需要创建一个在事件触发时会被调用的监听函数。我们从之前的事件类型列表中知道监听函数将接收一个包含要素的对象，所以让我们创建一个带有\
  \ `feature` 参数的函数，该参数将引用要素。在 Firebug 中，创建一个函数：\n```javascript\nfunction before_feature_added(feature){\
  \ console.log('before adding a feature!', feature); };\n```\n\n3. 现在我们要做的就是在矢量图层上注册\
  \ `beforefeatureadded` 事件：\n```javascript\nmap.layers[1].events.register('beforefeatureadded',\
  \ this, before_feature_added);\n```\n\n4. 现在，查看你的地图并添加一个要素。我们使用了 `console.log` 并向其传入了两个参数（一个字符串和一个要素对象）。在使用应用程序中谨慎使用\
  \ `console.log`——没有 Firebug 或开发控制台的用户可能会收到错误。由于我们现在只是测试，所以不必担心。你的控制台应记录类似以下内容：\n\
  ```\nbefore adding a feature! Object { feature=Object, more... }\n```\n\n5. 此事件类型的定义说我们可以返回\
  \ `false` 来阻止要素被添加。为此，我们必须为图层注册一个不同的事件以用于 `beforefeatureadded` 事件类型。让我们先 `unregister`\
  \ 该事件，以确保我们不会遇到任何问题：\n```javascript\nmap.layers[1].events.unregister('beforefeatureadded',\
  \ this, before_feature_added);\n```\n\n6. 现在尝试向地图添加一些要素。没有任何事情会发生，因为我们取消注册了 `beforefeatureadded`\
  \ 事件。所以，让我们重新定义函数然后再次将其注册到图层。\n```javascript\nfunction before_feature_added(feature){\n\
  \    console.log('feature will not be added!', feature);\n}\n```\n\n\n\n```\nreturn\
  \ false;\n};\n```\n\n7. 现在我们只需注册事件：\n\n```\nmap.layers[1].events.register('beforefeatureadded',\
  \ this, before_feature_added);\n```\n\n8. 尝试向地图添加要素。该要素不应被添加，并且控制台应记录：\n\n```\n\
  feature will not be added! Object { feature=Object,  more...}\n```\n\n## 发生了什么？\n\
  \n我们刚刚演示了如何在矢量图层上注册和注销一个事件，该事件在要素添加到图层之前触发。让我们再看一个涉及事件的示例，然后继续讨论 Vector 图层类的工作方式。\n\
  \n## 实践时间 – 处理更多事件\n\n在本示例中，我们将检查与向地图添加要素相关的事件。我们将查看要素已添加事件类型，该事件在要素被添加到地图时触发（无论是通过编程还是用户操作），以及可由\
  \ EditingToolbar 控制触发的草图事件。\n\n- 1. 打开本章的第一个示例。同样，我们将使用 Firebug。\n- 2. 这次，我们将演示\
  \ featureadded、sketchstarted 和 sketchcomplete 事件。让我们创建三个合适的监听函数：\n```\nfunction\
  \ feature_added(feature) { console.log('feature added', feature); };\nfunction sketch_start(feature){\
  \ console.log( 'sketch started:', feature); };\nfunction sketch_complete(feature){\
  \ console.log( 'sketch done:', feature); };\n```\n- 3. 现在，注册要素已添加事件：\n```\nmap.layers[1].events.register('featureadded',\
  \ this, feature_added);\n```\n- 4. 查看地图并添加一个要素。在添加点或添加多边形/线（草图）后，你应该会看到一条消息：\n```\n\
  feature added Object { feature=Object,  more...}\n```\n\n5. 现在让我们注册草图事件。它们将在使用任何\
  \ EditingToolbar 控制时触发。\n\n```\nmap.layers[1].events.register('sketchstarted', this,\
  \ sketch_start);\nmap.layers[1].events.register('sketchcomplete', this, sketch_complete);\n\
  ```\n\n6. 现在，在添加点或创建多边形/线时，在完成添加要素后，你应该会看到总共三条消息：\n\n```\nsketch started Object\
  \ { feature=Object,  more...}\nsketch done Object { feature=Object,  more...}\n\
  feature added Object { feature=Object,  more...}\n```\n\n## 发生了什么？\n\n我们刚刚演示了几种更多事件类型。你也可以通过查看控制台日志来了解事件是如何传播的（哪些事件先执行）。从上面的示例可以看出，sketchcomplete\
  \ 事件在 featureadded 事件之前执行。\n\n即使我们先注册了 featureadded 事件，注册事件的顺序也不会改变事件传播的顺序。我们将在整章中使用更多矢量图层事件，但它不会比前两个示例复杂多少。那么，让我们继续吧！\n\
  \n## Geometry and Feature classes\n\n在本章中，我们一直在使用要素对象，但并没有真正讨论 Feature 类本身。我们也提到了\
  \ Geometry 类，但到目前为止还没有深入细节。本节将更详细地介绍这两个类，以便你能更自信地使用它们。别担心——很简单，你已经接触过这两个类了。\n\n\
  在进入 Feature 类之前，我们应该先介绍 Geometry 类，因为它用于创建构成要素对象的实际几何对象。\n\n## Geometry class\n\n\
  The **Geometry** class is, more or less, the foundation of the feature objects we've\
  \ seen so far. Specifically, up to this point, we have been using the `Feature.Vector`\
  \ class as the base class for our feature objects. We'll talk more about that shortly,\
  \ but for now it is just important to know that the `Feature.Vector` class uses\
  \ the `Geometry` class to store geometry information about a feature.\n\n但 **Geometry**\
  \ 类到底是什么？简单来说，它存储地理信息。还记得本章前面添加要素的示例吗？代码如下：\n\n```\nvar feature_point = new OpenLayers.Feature.Vector(\n\
  \    new OpenLayers.Geometry.Point(-72, 42)\n);\n```\n\n我们传入了 Geometry Point 对象（我们稍后会介绍子类）。现在，如果执行并在地图上查看，我们会在坐标\
  \ -72, 42 处看到一个点。然后，如果我们通过类似 `map.layers[1].features[0]` 的方式获取要素信息，我们会看到有关该要素的信息。查看时，我们会看到一个\
  \ geometry 属性。\n\n展开它，或使用 `map.layers[1].features[0].geometry`，我们会发现它具有 `bounds`\
  \ 属性，以及 `x`、`y` 和 `ID` 属性。这就是要素如何在几何对象中存储地理信息的方式。\n\n让我们再次看看实例化几何对象的代码：`new OpenLayers.Geometry.Point(-72,\
  \ 42)`。正如你可能猜到的，我们正在使用 Geometry 类的 Point 子类。\n\n## Geometry subclasses—Theory\n\n\
  在使用 Geometry 类时，我们实际上几乎总是使用它的某个子类。我们是什么意思？想想我们在整本书中使用的 Layer 类——我们一直在使用基 Layer 类的子类（`Layer.WMS`、`Layer.Image`\
  \ 等都是 `OpenLayers.Layer` 类的子类）。\n\n就像我们处理图层一样，当我们想要一个 Geometry 对象时，我们几乎总是使用 `OpenLayers.Geometry`\
  \ *子类*。到目前为止，我们唯一明确调用的是 `Geometry.Point` 子类，它接受单个 X,Y 坐标并基于传入的坐标创建几何。还有许多其他子类让我们能够做比仅仅处理点更复杂的事情。\n\
  \n在介绍子类之前，让我们快速了解一下通过基 `Geometry` 类可用于*所有*子类的一些方法。所有这些方法都可用于任何 Geometry 子类，因为所有子类都继承自\
  \ Geometry 类。\n\n## Geometry class methods\n\n- **atPoint(lonlat, toleranceLon,\
  \ toleranceLat)**: 这将返回一个 `{Boolean}`，指示几何对象是否位于传入的 lonlat。lonlat 参数是一个包含要检查坐标的\
  \ `{OpenLayers.LonLat}` 对象，而 toleranceLon、toleranceLat 参数指定一个 `{Float}` 数字，分别设置经度和纬度的阈值。如果一个点位于经度和纬度的阈值范围内，将返回\
  \ `true`——否则返回 `false`。确定几何是否位于传入点的计算是基于几何对象边界的近似值。\n- **calculateBounds()**: 调用此函数将重新计算几何的边界。它不返回任何内容。如果想查看几何对象的边界，请参阅\
  \ `getBounds()`。\n- **clearBounds()**: 此函数会将几何对象的边界对象设为 null。\n- **clone()**: 此函数创建几何的副本并返回一个克隆的\
  \ `{OpenLayers.Geometry}` 对象。\n- **destroy()**: 调用此函数将销毁几何对象。注意——如果在已属于要素对象的几何对象上调用此函数，它不会从地图中移除几何对象。\n\
  - **distanceTo(geometry, options)**: 调用此函数将计算当前几何对象与传入几何对象之间的最近距离。options 参数可以包含额外的计算选项，具体取决于几何子类而有所不同。有一个\
  \ details 选项，它是一个 `{Boolean}`，可为所有子类指定。如果在 options 参数中将 details 设置为 `true`，此函数将返回一个包含距离以及表示两个几何对象坐标的\
  \ x0、y0 和 y1、y0 值的 `{Object}`。如果未设置 details（或设置为 `false`），此函数默认将返回包含距离的 `{Number}`。请注意地图的单位。\n\
  - **extendBounds(bounds)**: 此函数将扩展几何的边界，包括传入的边界对象，该对象必须是 `{OpenLayers.Bounds}` 对象。如果调用此函数时几何没有设置边界，则会设置边界。\n\
  - **getArea()**: 返回一个包含几何对象覆盖面积的 `{Float}`。此函数在各种子类中被重新定义，但可由所有子类调用。\n- **getBounds()**:\
  \ 以 `{OpenLayers.Bounds}` 对象的形式返回几何的边界。如果未设置边界，则会计算边界。这将返回单个几何对象的边界——如果你想获取图层上所有要素的边界，请参阅\
  \ Vector 类的 getDataExtent 方法。\n\n\n\n-   **getCentroid()**: 返回一个包含几何对象中心点的 `{OpenLayers.Geometry.Point}`\
  \ 对象。此函数在各个子类中被重新定义，但可被所有子类调用。\n-   **getLength()**: 返回一个包含几何对象覆盖长度的 `{Float}`。此函数在各个子类中被重新定义，但可被所有子类调用。\n\
  -   **getVertices(nodes)**: 此函数返回几何对象中所有点的 `{Array}`。它接受一个默认为 True 的 `{Boolean}`\
  \ 参数，指定应返回所有顶点。如果将其设为 false，则当几何对象为 Line 时，此函数将只返回非端点的顶点。\n-   **toString()**: 返回几何对象的\
  \ WKT（Well-Known Text）`{String}`。WKT 是一种标记语言，类似于 HTML 或 XML，用于表示几何对象。例如，对具有坐标 (-72,\
  \ 42) 的 `Geometry.Point` 对象调用此函数将返回 WKT 字符串 \"POINT(-72 42)\"。有关 WKT 的更多信息请访问 http://en.wikipedia.org/wiki/Well-known_text。\n\
  \n## 实践时间 – 使用 Geometry 类方法\n\n让我们演示一下我们刚刚讨论的一些方法。这些方法可以应用于任何几何子类——Point、Polygon\
  \ 等。\n\n1.  打开本章的第一个示例。我们将再次使用 Firebug 来演示这些函数。\n2.  在我们能做任何事情之前，我们需要一些几何对象。这里我们不会使用\
  \ `Feature` 类——我们只是演示一些几何对象方法。因为这次我们没有将 Geometry 对象与 Feature 对象关联，所以我们看不到任何内容被添加到地图上，因为单独的\
  \ Geometry 对象不一定与任何图层或要素绑定。让我们创建两个具有随机坐标的几何点对象：\n\n```\nvar geom_1 = new OpenLayers.Geometry.Point(\n\
  \    (Math.floor(Math.random() * 180) - 90),\n    (Math.floor(Math.random() * 180)\
  \ - 90)\n);\nvar geom_2 = new OpenLayers.Geometry.Point(\n    (Math.floor(Math.random()\
  \ * 180) - 90),\n    (Math.floor(Math.random() * 180) - 90)\n);\n```\n\n3.  现在我们有两个几何点对象。让我们使用\
  \ `distanceTo` 来计算两个点之间的距离。我们将计算 `geom_1` 和 `geom_2` 之间的距离。由于使用了随机数，此次调用的输出很可能与你的不同：\n\
  \n```\ngeom_1.distanceTo(geom_2);\n```\n\n4.  现在让我们使用 `atPoint` 方法并尝试一下容差参数。首先，让我们获取\
  \ `geom_1` 对象的中心点坐标：\n\n```\ngeom_1.getCentroid();\n```\n\n5.  返回的对象将具有 x 和 y 属性。我的分别是\
  \ x: 27，y: 35。将你的返回坐标替换到下一步中。首先，让我们调用 `atPoint` 方法——使用返回的坐标以确保它能工作：\n\n```\ngeom_1.atPoint(new\
  \ OpenLayers.LonLat(27,35));\n```\n\n6.  如果你已替换你的坐标，输出应为 `true`。现在，让我们尝试调用它但将坐标偏移五度：\n\
  \n```\ngeom_1.atPoint(new OpenLayers.LonLat(32,40));\n```\n\n7.  现在你应该得到 `false`，因为我们尚未设置容差。让我们继续设置，使用\
  \ 5 作为 lon 和 lat 的容差：\n\n```\ngeom_1.atPoint(new OpenLayers.LonLat(32,40), 5, 5);\n\
  ```\n\n8.  因为我们的点在容差范围内，你应该看到返回 `true`。如果将容差设为 4，则会返回 `false`。\n9.  再举一个快速示例——让我们创建一个线几何对象然后将其添加到地图上。使用\
  \ `Geometry.LineString` 类，我们可以创建一个单线。我们只需传入一个 Point 对象数组来创建一条线。\n\n```\nvar line_geom\
  \ = new OpenLayers.Geometry.LineString([\n    new OpenLayers.Geometry.Point(\n \
  \       (Math.floor(Math.random() * 360) - 180),\n        (Math.floor(Math.random()\
  \ * 180) - 90)\n    ),\n    new OpenLayers.Geometry.Point(\n        (Math.floor(Math.random()\
  \ * 360) - 180),\n        (Math.floor(Math.random() * 180) - 90)\n    )\n]);\n```\n\
  \n10. 现在让我们将其添加到地图上：\n\n```\nmap.layers[1].addFeatures([new OpenLayers.Feature.Vector(line_geom)]);\n\
  ```\n\n11. 你应该会在地图上看到一条随机放置的线。例如：\n\n![](img/1b8cd151c9f278555f9cf255b20d244e_271_0.png)\n\
  \n## 发生了什么？\n\n我们刚刚演示了如何使用几个 Geometry 类方法。请记住——我们只使用了 Geometry.Point 和 Geometry.LineString\
  \ 子类，但我们使用的方法（以及我们介绍过的方法）可用于所有 Geometry 子类。\n\n我们还看到了如何使用 Geometry.LineString 类创建线。类似地，我们可以通过将\
  \ LineString 数组传入 Geometry.MultiLineString 类来创建 MultiLine 字符串。让我们简要了解一下其他一些 Geometry\
  \ 子类。\n\n## Geometry 子类\n\n让我们快速了解一下一些 Geometry 子类。我们不会介绍它们的方法，只看看如何从它们创建对象。所有子类再次可以使用我们之前讨论过的方法——它们只是实现略有不同。\n\
  \n-   Geometry.Point：包含属性 x 和 y。实例化时传入 x 和 y。例如：\n```\nvar my_point = new OpenLayers.Geometry.Point(-50,\
  \ 42);\n```\n\n-   **Geometry.Collection**：这是一个包含几何对象集合（一个 {Array}）的类。许多其他几何类，例如\
  \ `LineString`，继承自此类。实例化时传入几何对象数组。例如，要创建几何集合对象，你需要传入几何对象数组（假设你有 `geom_point_object`\
  \ 和 `geom_line_object`）：\n```javascript\nvar geom_collection_object = new OpenLayers.Geometry.Collection([\n\
  geom_point_object, geom_line_object ]);\n```\n\n-   **Geometry.MultiPoint**：这是一个几何点对象的集合（{Array}）。其他类，例如\
  \ `LineString`，继承自此类。实例化时传入 Point 对象数组：\n```javascript\nvar geom_multipoint = new\
  \ OpenLayers.Geometry.MultiPoint([ geom_point_1, geom_point_2 ]);\n```\n\n-   **Geometry.Curve**：此类与\
  \ MultiPoint 类似（它也继承自它），但它假设点对象是连接的。实例化时传入 Point 对象数组：\n```javascript\nvar geom_curve\
  \ = new OpenLayers.Geometry.Curve([ geom_point_1, geom_point_2 ]);\n```\n\n-   **Geometry.LineString**：此类如我们之前所见，由连接在一起的点对象组成。它继承自\
  \ Curve 类——它基本上是一条曲线，不能包含少于两个点。实例化时传入 Point 对象数组：\n```javascript\nvar geom_line\
  \ = new OpenLayers.Geometry.LineString([ geom_point_1, geom_point_2 ]);\n```\n\n\
  -   **Geometry.MultiLineString**：MultiLineString 包含多个 LineString 对象。实例化时传入 LineString\
  \ 对象数组：\n```javascript\nvar geom_multi_line = new OpenLayers.Geometry.MultiLineString([\n\
  geom_line_1, geom_line_2 ]);\n```\n\n-   **Geometry.LinearRing**：此类是 LineString\
  \ 的一种闭合版本——意味着线条“回环”，起点和终点相连。创建对象时，你可以通过使最后一个点等于第一个点来自行闭合线条。实例化时传入 Point 对象数组：\n\
  ```javascript\nvar geom_linear_ring = new OpenLayers.Geometry.LinearRing([ geom_point_1,\
  \ geom_point_2, geom_point_3, geom_point_1 ]);\n```\n你也可以不将起点作为终点传入。如果这样做，它会自动为你闭合（OpenLayers\
  \ 会自动将起点添加为终点）。\n\n-   **Geometry.Polygon:** 此类本质上只是 `LinearRing` 对象的 `{Array}`。对于基本多边形，你只需传入一个\
  \ `LinearRing` 对象。你传入的第一个 `LinearRing` 对象将作为多边形的外部边界。之后传入的所有 `LinearRings` 对象将在多边形内形成孔洞（例如，你可以先传入一个大圆然后传入一个小圆来形成甜甜圈）。实例化时传入\
  \ `LinearRing` 对象数组：\n\n```\nvar geom_polygon = new OpenLayers.Geometry.Polygon([\
  \ geom_linear_ring_1, geom_linear_ring_2 ]);\n```\n\n-   **Geometry.MultiPolygon:**\
  \ MultiPolygon 由多个 Polygon 对象组成。实例化时传入 `Polygon` 对象数组：\n\n```\nvar geom_multi_polygon\
  \ = new OpenLayers.Geometry.MultiPolygon([ geom_polygon_1, geom_polygon_2 ]);\n\
  ```\n\n## Geometry 子类方法\n\n所有 Geometry 子类都包含基 Geometry 类方法的自己的版本，以及某些子类中的一些额外方法。本章（和本书）的其余部分将重点关注我们迄今为止看到的方法，因此你应该拥有继续所需的所有知识。\n\
  \n![](img/1b8cd151c9f278555f9cf255b20d244e_273_0.png)\n\n> 书中范围之外的一些子类方法，但它们都可以在官方文档\
  \ http://dev.openlayers.org/docs/files/OpenLayers/Geometry-js.html 中找到。\n\n## Feature\
  \ 类\n\n在继续进一步讨论 Vector 类之前，我们还应介绍一个类。**Feature** 类是 Vector 类用来在地图上实际显示 Geometry\
  \ 对象的类。我们在本章中一直使用 Feature 类，因为好吧，没有它我们就无法在矢量图层上显示对象——因此你已经接触到该类的很多内容了。\n\n### Feature\
  \ 类的工作原理\n\nVector 图层类有一个名为 `features` 的属性，它是 Feature 对象的数组。我们在本章中已经使用过它，并且以后会更多地使用它。顾名思义，feature\
  \ 对象是由 **Feature** 类创建的。\n\n基本 Feature 类由两部分组成——**Geometry 对象**（如你所见），和 **属性**。属性包含与要素相关联的数据。\n\
  \n\n\n## 特性子类\n\n只有一个子类我们会使用——`Feature.Vector` 类。与其父类 Feature 类一样，它由一个 Geometry\
  \ 对象组成并包含一个 `attributes` 属性。此外，还有一个 `style` 属性控制要素的外观（类似于 CSS 如何样式化 HTML）。我们将在第\
  \ 10 章详细介绍 Style 类。\n\n## 特性函数\n\n本书中我们将使用的其实只有几个方法：\n\n- **destroy()**：销毁要素对象。\n\
  - **clone()**：创建要素对象的副本并返回它，作为一个 `{OpenLayers.Feature.Vector}` 对象。\n- **getVisibility()**：返回一个\
  \ `{Boolean}`，指定要素是否显示。\n- **move(location)**：将要素移动到传入的位置。`location` 可以是 `{OpenLayers.LonLat}`\
  \ 对象，将要素移动到传入的地图坐标，或 `{OpenLayers.Pixel}` 对象，将其移动到屏幕上的像素位置。\n- **onScreen(boundsOnly)**：返回一个\
  \ `{Boolean}`，指示要素是否在地图视口内（如果在屏幕上可见）。可以传入一个 `boundsOnly` 参数，它是一个默认为 `false` 的 `{Boolean}`。如果设为\
  \ `true`，将使用更快但精度较低的边界框相交方法。\n\n## 实例化要素对象\n\n要创建要素对象，我们只需这样调用：\n\n```\nvar my_feature\
  \ = new OpenLayers.Feature.Vector( geometry_object,\nattributes, style);\n```\n\n\
  `geometry_object` 是一个几何对象（在上一节中介绍过）。`attributes` 对象是一个可选的对象字面量，将映射到要素的 `attributes`\
  \ 属性，可用于提供有关要素的额外信息（例如 `{'building_area': 18000, 'building_floors': 2}`）。最后，`style`\
  \ 对象是一个可选对象，指定要素的样式（将在第 10 章详细介绍）。\n\n## 使用 Control.SelectFeature 与要素交互\n\n现在我们知道如何创建要素并将其放入矢量图层，如何与它们交互？前面我们说过，与要素的交互几乎是即时的——这是因为所有矢量要素数据都存储在客户端浏览器中。点击要素时无需从服务器请求信息。\n\
  \n要使点击要素时发生某些事情，我们需要使用 SelectFeature 控制类（OpenLayers.Control.SelectFeature 类）。此控件允许我们与要素对象交互——例如在鼠标悬停或点击要素时执行操作。让我们先通过示例了解如何使用它，然后再介绍\
  \ SelectFeature 控制类本身。\n\n## 动手实践 – 使用 SelectFeature 控件\n\n让我们把迄今为止学到的一些东西组合起来。我们将创建一些点和一个多边形，将其放置在地图上，并使用\
  \ SelectFeature 控件允许用户选择它们。我们将注册要素已选择和要素未选择事件，以便在用户与要素交互时触发事件。当这些事件被触发时，我们将访问要素的\
  \ attributes 对象并显示其中的信息。开始吧。\n\n- 1. 我们将添加一个矢量图层、一些要素和一个 SelectFeature 控件。该文件将被称为\
  \ `chapter9_selectFeature.html`。\n- 2. 首先，让我们像本章前面那样将 vector_layer 设为全局变量。将其放在 `init`\
  \ 函数之外，紧跟在 `var map;` 之后。\n  ```js\n  var vector_layer;\n  ```\n- 3. 接下来，我们将添加一个\
  \ `<div>` 元素，当用户点击要素时我们将要素信息输出到该元素中。在地图 div 之后添加此 div：\n  ```html\n  <div id='map_feature_log'></div>\n\
  \  ```\n- 4. 现在，回到 `init` 函数代码。在 WMS 图层添加到地图之后添加矢量图层：\n  ```js\n  vector_layer =\
  \ new OpenLayers.Layer.Vector('Basic Vector Layer');\n  map.addLayer(vector_layer);\n\
  \  ```\n- 5. 现在，让我们添加一些要素。我们将添加两个点要素和一个多边形要素。我们将向每个要素传入一个 attributes 对象（一个用于存储数据的键值对对象）。首先创建两个点要素：\n\
  \  ```js\n  var feature_point_1 = new OpenLayers.Feature.Vector(\n    new OpenLayers.Geometry.Point(6.055,\
  \ 46.234),\n    {\n  ```\n```\n'location': 'Cern',\n'description': \"Stand back,\
  \ I'm going to try science!\"\n}\n);\nvar feature_point_2 = new OpenLayers.Feature.Vector(\n\
  \    new OpenLayers.Geometry.Point(-129, 3),\n    {\n        'location': 'The Sea',\n\
  \        'description': 'Here be dragons'\n    }\n);\n```\n- 6. 注意我们传入了两个键值对——location\
  \ 和 description。这些只是任意的键和值——你可以使用任何你喜欢的，我们一会儿就会看到如何访问它们。不过首先，让我们添加一个多边形要素。为此，请记住——我们需要将一组点传入\
  \ LinearRing 对象，然后将该 LinearRing 对象传入 Polygon 类以实例化它。呼。虽然听起来复杂，但其实更容易：\n```\nvar\
  \ feature_polygon = new OpenLayers.Feature.Vector(\n    //We'll make a polygon from\
  \ a linear ring object, which\n    //consists of points\n    new OpenLayers.Geometry.Polygon(new\
  \ OpenLayers.Geometry.\n    LinearRing(\n        [\n            new OpenLayers.Geometry.Point(-124.2,\
  \ 41.9),\n            new OpenLayers.Geometry.Point(-120.1, 41.9),\n           \
  \ new OpenLayers.Geometry.Point(-120, 39),\n            new OpenLayers.Geometry.Point(-114.5,\
  \ 34.9),\n            new OpenLayers.Geometry.Point(-114.7, 32.7),\n           \
  \ new OpenLayers.Geometry.Point(-117.1, 32.5),\n            new OpenLayers.Geometry.Point(-120,\
  \ 34),\n            new OpenLayers.Geometry.Point(-123.7, 38.4)\n            //We\
  \ won't pass in the first point, the polygon will close automatically\n        ]\n\
  \    )),\n    {\n        'location': 'Fanghorn Forest',\n        'description':\
  \ 'Land of the Ents'\n    }\n);\n```\n- 7. 现在我们将要素添加到地图：\n```\nvector_layer.addFeatures([feature_point_1,\
  \ feature_point_2, feature_polygon]);\n```\n- 8. 好——到目前为止没有什么太新的。查看地图，你应该能看到要素。不过我们还不能与它们交互。\n\
  \n![](img/1b8cd151c9f278555f9cf255b20d244e_277_0.png)\n- 9. 现在，让我们使要素具有交互性。为此，我们首先需要一个\
  \ selectFeature 控件。实例化时，我们传入想要控件使用的矢量图层（或者，如果我们希望控件使用多个矢量图层，也可以传入一个 {Array} 的矢量图层）。我们还将传入几个属性，我们将在本示例之后详细介绍。multiple\
  \ 属性允许一次选择多个要素，toggle 属性会在选择不同要素时取消选择要素，而 multipleKey 指定按下哪个键以允许选择多个要素：\n```\nvar\
  \ select_feature_control = new OpenLayers.Control.SelectFeature(\n    vector_layer,\n\
  \    {\n        multiple: false,\n        toggle: true,\n        multipleKey: 'shiftKey'\n\
  \    }\n);\nmap.addControl(select_feature_control);\n```\n- 10. 此时，控件已创建并已添加到地图。然而，在使用它之前，我们必须通过调用其\
  \ activate 方法来激活它。\n```\nselect_feature_control.activate();\n```\n- 11. 现在我们可以选择要素了。因为我们传入了\
  \ multipleKey 属性，所以可以通过按住 Shift 并点击来选择多个要素。按住 control 会切换要素选择。点击一个要素查看：\n\n![](img/1b8cd151c9f278555f9cf255b20d244e_278_0.png)\n\
  - 12. 现在，让我们在用户点击要素时做些事情。为此，我们将创建两个函数，当要素已选择和要素未选择事件被触发时调用它们（它们由 SelectFeature 控件触发）。首先让我们创建在要素被选择时调用的函数。它将清除\
  \ map_feature_log div，然后查看传入要素的 attributes 对象。最后，它将遍历所有已选择的要素并显示所有已选择要素的 location\
  \ 属性。\n```\nfunction selected_feature(event) {\n    //clear out the log's contents\n\
  \    document.getElementById('map_feature_log').innerHTML = '';\n\n    //Show the\
  \ current selected feature (passed in from the event object)\n    var display_text\
  \ = 'Clicked on: '\n        + '<strong>' + event.feature.attributes.location + '</strong>'\n\
  \        + ': ' + event.feature.attributes.description + '<hr />';\n    document.getElementById('map_feature_log').innerHTML\
  \ =\n    display_text;\n}\n```\n\n//Show all the selected features\ndocument.getElementById('map_feature_log').innerHTML\
  \ += 'All selected features: ';\n\n//Now, loop through the selected feature array\n\
  for(var i=0; i<vector_layer.selectedFeatures.length; i++){\n    document.getElementById('map_feature_log').innerHTML\
  \ +=\n    vector_layer.selectedFeatures[i].attributes.location + ' | ';\n}\n}\n\n\
  13. 我们现在需要一个在要素取消选择时调用的函数。它将做与之前函数类似的事情——显示用户点击的要素，然后显示所有已选择的要素。\n\n```\nfunction\
  \ unselected_feature(event){\n    var display_text = event.feature.attributes.location\
  \ + 'unselected!' + '<hr />';\n    document.getElementById('map_feature_log').innerHTML\
  \ = display_text;\n\n    //Show all the selected features\n    document.getElementById('map_feature_log').innerHTML\
  \ += 'All selected features: ';\n\n    //Now, loop through the selected feature\
  \ array\n    for(var i=0; i<vector_layer.selectedFeatures.length; i++){\n      \
  \  document.getElementById('map_feature_log').innerHTML +=\n        vector_layer.selectedFeatures[i].attributes.location\
  \ + ' | ';\n    }\n}\n```\n\n14. 现在只剩最后一件事了！我们必须注册事件，以便在要素被选择或取消选择时调用这些函数：\n\n```\n\
  vector_layer.events.register('featureselected', this, selected_feature);\nvector_layer.events.register('featureunselected',\
  \ this, unselected_feature);\n```\n\n15. 全部完成！打开你的地图并选择一些要素（使用 Shift 选择多个要素）。你应该会看到日志更新：\n\
