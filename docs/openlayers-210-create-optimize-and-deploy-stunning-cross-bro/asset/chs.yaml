  - 3. 5\n- 4. 将会报错，因为变量 b 不能在测试函数外部访问。\n\n## 层类方法\n\n我们已经介绍了基础层类的属性，并讨论了大多数层子类。到目前为止，剩下的主题是基础层类的函数或方法。由于我们将讨论层类的函数，所有层子类都继承并使用这些函数。在进入函数之前，让我们先介绍如何在\
