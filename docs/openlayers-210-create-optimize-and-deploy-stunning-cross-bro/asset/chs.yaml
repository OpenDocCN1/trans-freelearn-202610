  \n## 感谢您购买\nOpenLayers 2.10 初学者指南\n\n## 关于 Packt 出版社\n\nPackt，发音为 'packed'，于 2004\
  \ 年 4 月出版了其第一本书 \"Mastering phpMyAdmin for Effective MySQL Management\"，随后继续专注于出版针对特定技术和解决方案的高度聚焦的书籍。\n\
  \n我们的书籍和出版物分享了您同行的 IT 专业人士在适应和定制当今系统、应用程序和框架方面的经验。我们的解决方案型书籍为您提供了定制正在使用的软件和技术的知识和能力，以完成工作。与您过去看到的\
  \ IT 书籍相比，Packt 的书籍更具体、更少泛泛而谈。我们独特的商业模式使我们能够提供更聚焦的信息，让您了解更多所需的内容，减少不必要的内容。\n\nPackt\
  \ 是一家现代且独特的出版公司，专注于为开发人员、管理员和新手等社区生产优质的前沿书籍。如需了解更多信息，请访问我们的网站：www.packtpub.com。\n\
  \n## 关于 Packt 开源\n\n2010 年，Packt 推出了两个新品牌 Packt Open Source 和 Packt Enterprise，以继续专注于专业化。本书是\
  \ Packt Open Source 品牌的一部分，该品牌是出版围绕开源许可构建的软件书籍的家园，并为从高级开发人员到初出茅庐的网页设计师的任何人提供信息。开源品牌还运营着\
  \ Packt 的开源版税计划，Packt 会向其书籍所介绍的软件所属的每个开源项目支付版税。\n\n## 为 Packt 撰稿\n\n我们欢迎所有有兴趣撰稿的人的咨询。书稿提案应发送至\
  \ author@packtpub.com。如果您的书稿想法仍处于早期阶段，并且您希望在撰写正式书稿提案之前先进行讨论，请联系我们；我们的约稿编辑会与您联系。\n\
  \n我们不仅寻找已出版的作者；如果您具有强大的技术技能但没有写作经验，我们经验丰富的编辑可以帮助您发展写作事业，或为您提供专业知识的额外回报。\n\n## [PACKT]\
