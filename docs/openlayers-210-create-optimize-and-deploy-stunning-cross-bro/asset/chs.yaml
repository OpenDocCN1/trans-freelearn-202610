  \ `{String}` 指定一个键，按住时将 `toggle` 属性设置为 `true`。释放键时，`toggle` 属性将恢复为 `false`。例如 `multipleKey`:\
  \ `'altKey'`。默认值为 `null`。\n\n这些属性可以在实例化 `SelectFeature` 控制时设置。创建 `SelectFeature`\
