  \  ```\n- **handlers**: `{Object}` 这包含对处理程序对象实例的引用。\n- **highlightOnly**: `{Boolean}`\
  \ 指定要素是否可以被选择，或只能被高亮。默认为 `false`。如果 `hover` 设置为 `true`，则此设置无效。\n- **hover**: `{Boolean}`\
  \ 默认为 `false`。如果设置为 `true`，当用户将鼠标悬停在要素上时，要素将被选中（并添加到 `vector_layer.features` 数组中）——点击要素不会起作用，只有悬停才有效。\n\
  - **layer**: `{OpenLayers.Layer.Vector}` or `{Array{OpenLayers.Layer.Vector}}` 指定\
  \ selectFeature 控制关联的矢量图层（或图层数组）。\n- **multiple**: `{Boolean}` 控制是否可以通过点击选择多个要素。默认为\
  \ `false`。这并不意味着永远不能选择多个要素（即使此设置为 `false`，你也可以使用 `multipleKey` 来选择多个要素）。如果设置为 `true`，点击其他要素时要素不会被取消选择。\n\
  - **multipleKey**: `{String}` 指定用于允许多选要素的键。按住该键时可以选中多个要素。例如 `multipleKey: 'shiftKey'`\
  \ 或 `'altKey'`。默认值是 `null`。\n- **onBeforeSelect**: `{Function}` 在要素被选择前调用的函数。默认为空函数。\n\
  - **onSelect**: `{Function}` 在要素被选择时调用的函数。默认为空函数。\n- **onUnselect**: `{Function}`\
  \ 在要素被取消选择时调用的函数。默认为空函数。\n- **renderIntent**: `{String}` 用于从图层的样式映射中获取要使用的样式。样式在第\
