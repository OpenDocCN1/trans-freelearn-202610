  overturn_probability: 0.3
  alternative: 前置内容（致谢、献词、关于作者等）的组成部分，不应单独作为章节分割点
  counter_evidence:
  - 规则明确要求‘前言、序言、致谢、关于作者等正文之前的内容，统一划分为一章’，因此分割点应置于最前的前置内容行（如第0行书名或第2行献词），而非‘# 前言’这一行
  - 第14行前已有多行献词、致谢、关于作者等内容，若在第14行分章会导致前置内容被拆分为两章，违背合并规则
