  \n选择无头电商平台的缺点如下：\n\n* **开发复杂性**：与传统的单体电商解决方案相比，实施无头可组合电商需要更高的技术专业知识。开发人员需要处理前端与后端的集成和同步，这可能会增加开发复杂性和时间。由于前端和后端是分开开发的，因此需要额外的开发工作来构建和维护，这可能会导致成本增加，尤其是在企业缺乏必要的\
  \ IT 资源或专业知识的情况下。\n* **依赖 API 和后端稳定性**：后端及其 API 的性能和可靠性对于确保内容顺畅交付和整体平台功能至关重要。任何后端问题或\
  \ API 中断都可能直接影响用户体验并需要立即解决。\n* **开箱即用功能有限**：与传统电商平台相比，无头可组合电商解决方案可能提供更少的开箱即用功能和特性，因为重点主要放在自定义前端和后端开发上，而非集成的电商功能。这要求企业投入额外的开发工作来构建或集成特定的电商功能。\n\
  * **系统复杂性增加**：无头可组合电商引入了额外的组件和集成，这可能会增加整体系统复杂性。管理和维护多种技术、API 和服务需要仔细协调和持续监控。这种复杂性可以通过利用供应商管理的技术栈来缓解。\n\
  * **运营成本**：无头电商平台要求企业在构建 IT 能力、技能组合、开发和运营资源方面进行大量投资。实施成本高昂，通常最适合拥有庞大且技术娴熟的电商团队的企业。\n\
  \n与任何架构设计决策一样，在选择无头电商方法之前，仔细评估其优缺点至关重要。\n\n### 选项 3：构建云原生电商平台\n\n基于微服务的电商系统对于寻求完全灵活性、精细控制以及通过电商提供独特客户体验的企业来说可能是一个完美的解决方案。在此模型中，传统的电商应用栈被拆分为更小、松耦合的服务，这些服务可以独立开发、部署和扩展。这涉及识别核心功能组件；定义服务边界；设计\
  \ API；选择合适的技术栈和部署平台；实施服务发现和编排；确保数据一致性、CI/CD 实践和部署；以及扩展自动化。需要注意的是，开发基于微服务的电商平台需要仔细的规划、协调和专业知识。以下是对基于云原生架构的典型电商应用的表示：\n\
  \n![图 3.6 – 云原生电商平台架构](img/B18893_03_6.jpg)\n图 3.6 – 云原生电商平台架构\n\n企业评估并了解这种方法的利弊将是明智的。让我们回顾一下其中的一些优势：\n\
  \n* **可扩展性和灵活性**：微服务允许根据需求独立扩展不同的组件。这种灵活性能够实现高效的资源利用，并在旺季和闪购期间处理高流量，同时也能适应未来的增长。\n\
  * **通过模块化开发加快上市时间**：微服务促进模块化开发，使团队能够独立地在不同服务上工作。这加快了开发周期，并能够使用最适合每个微服务需求的不同技术和框架。\n\
  * **快速创新和部署**：基于微服务的架构促进更快的部署周期，并使团队能够独立创新并发布新功能或更新。这种敏捷性使企业能够快速响应市场趋势和客户需求。\n*\
  \ **技术多样性**：借助微服务，IT 团队可以为每个功能服务选择不同的技术和编程语言。这使团队能够利用特定技术和框架的优势，实现最佳性能和生产力。\n* **改进的故障隔离和恢复**：微服务提供更好的故障隔离，这意味着单个服务的故障不会影响整个系统。这种隔离便于故障排除、加快恢复速度并提高整体系统稳定性。\n\
  \n以下是这种方法的一些缺点：\n\n* **复杂性增加**：管理微服务分布式系统与单体架构相比会引入额外的复杂性。诸如服务间通信、数据一致性和事务管理等挑战需要仔细解决。\n\
  * **运营开销**：维护和管理多个微服务需要额外的运营工作。部署、监控和编排等任务可能会变得更加复杂，需要强大的 DevOps 实践。\n* **架构一致性**：微服务严重依赖服务间通信，这可能会引入网络延迟并影响整体系统性能。适当的设计和高效的通信模式对于缓解这一挑战至关重要。\n\
  * **数据完整性**：在多个微服务之间维护数据一致性可能很复杂，尤其是在处理事务或共享数据时。可能需要事件溯源或分布式事务等技术来确保数据完整性。\n* **IT\
  \ 技能和资源**：开发和管理微服务需要专业技能和专业知识。找到并留住具有构建和维护分布式系统经验的人才可能具有挑战性。\n* **服务编排和集成**：协调和编排多个微服务可能具有挑战性。实施服务发现和\
  \ API 网关并确保服务之间无缝集成需要额外的规划和实施工作。\n\n下表显示了不同方法各项标准的并排比较：\n\n| 标准 | 传统电商（打包应用） | 基于\
  \ SaaS 的电商 | 无头电商 | 基于微服务的电商 |\n| --- | --- | --- | --- | --- |\n| 可扩展性 | 有限 | 高\
  \ | 高 | 高 |\n| 预先投资 | $$$ | $ | $$ | $$ |\n| 灵活性 | 高 | 低 | 中等 | 高 |\n| 上市时间 | 慢\
  \ | 中等 | 快 | 快 |\n| 所需 IT 技能 | 高级 | 基础 | 中级 | 高级 |\n| 所需 IT 资源 | 高 | 低 | 中等 | 高\
  \ |\n| 供应商依赖 | 低 | 高 | 高 | 低 |\n| 内置安全和合规性 | 中等 | 高 | 中等 | 低 |\n| 硬件/软件许可和支持 | 高\
  \ | 不适用 | 不适用 | 中等（本地部署）不适用（公有云） |\n| 运营费用 | $ | $$$ | $$ | $$ |\n| 集成支持 | 高 | 中等\
  \ | 中等 | 高 |\n\n\n\n| 开箱即用的分析 || 有限 || 中等 || 中等 || 自定义 |\n| 持续维护 || 高 || 低 || 高\
  \ || 高 |\n表 3.1 – 不同电商架构方法的比较\n对 IT 组织而言，审慎评估能力、考虑权衡、对照业务优先级进行评估并选择合适的策略是明智的。\n\n\
  # 识别云转型的合适工作负载\n\n企业面临的主要挑战之一是识别云转型的合适工作负载，因为每个企业环境中的业务挑战都是独特的。即便是在同一行业垂直领域或具有相似商业模式和收入的企业中，一刀切的方法也不奏效，企业领导者必须对企业范围的云转型之旅有清晰的愿景和战略。企业可以根据独特的业务需求和驱动事件选择多种云转型策略，包括大爆炸迁移、数据中心退出、平移迁移、构建全新举措，或通过云原生能力增强应用程序。我们将在\
  \ *第 5 章**，企业云转型之旅* 中更详细地回顾这些云转型之旅。在本节中，让我们探讨一些企业云转型面临的挑战。\n\n## 大爆炸迁移\n\n大爆炸云迁移是一种方法，即在一次协调的努力中将整个企业的基础设施、应用程序和数据迁移到云中。大爆炸迁移的目标是在规定的时间内快速迁移并实现所有企业系统和应用程序到云的平稳无中断过渡，最小化停机时间并确保对业务运营的最小影响。它涉及将所有系统和工作负载从本地或托管数据中心迁移到基于云的基础设施。向云的过渡在相对较短的时间范围内进行，通常会计划停机以执行迁移过程。它通常涉及全面的分析和规划阶段，以确保在迁移前解决所有依赖关系、安全要求和合规性考虑。\n\
  \n组织可能会根据特定情况和要求选择大爆炸云迁移方法，例如数据中心整合、遗留系统现代化、全球业务扩张、合并、分拆或收购。虽然大爆炸迁移在某些情况下可以带来好处，但它需要仔细规划、资源分配和风险管理。企业应彻底评估其准备情况、评估依赖关系、进行适当的测试并制定稳健的应急计划，以减轻潜在风险，确保迁移成功。\n\
  \n与大爆炸迁移方法相关的一些挑战如下：\n*   **规模和复杂性**：大爆炸迁移涉及一次性迁移整个企业基础设施和应用程序。这可能非常复杂，尤其对于大型组织而言，其拥有众多相互连接的系统和依赖关系。迁移的规模需要细致的规划、协调和执行，以确保平稳过渡。\n\
  *   **停机和中断**：大爆炸迁移通常在迁移过程中需要临时停机。这可能导致业务运营中断，包括在线服务、客户支持和内部工作流程。最小化停机时间并确保无缝过渡对于避免潜在收入损失和负面客户体验至关重要。\n\
  *   **迁移风险**：与分阶段或增量迁移方法相比，大爆炸迁移的失败风险更高。迁移过程中出现的问题可能同时影响整个企业，导致广泛中断。稳健的应急计划、彻底的测试和回退策略对于减轻迁移风险至关重要。\n\
  *   **数据和应用程序依赖关系**：许多企业系统和应用程序彼此之间存在错综复杂的依赖关系。大爆炸迁移可能会破坏这些依赖关系并导致不可预见的问题。在迁移前识别和解决依赖关系对于确保成功过渡并避免潜在数据不一致或应用程序故障至关重要。\n\
  *   **资源和预算管理**：大爆炸迁移需要大量资源，无论是人员还是预算。组织必须确保为规划、迁移、测试和迁移后支持分配足够的资源。充足的预算分配和资源规划对于防止延迟、瓶颈和预算超支至关重要。\n\
  *   **有限的回退选项**：在大爆炸迁移中，由于迁移的规模和复杂性，回滚到之前的环境或基础设施可能具有挑战性。这凸显了在执行迁移前进行彻底测试、验证和制定回退计划的重要性。\n\
  *   **变更管理**：企业范围的迁移影响整个组织，变更管理对于确保用户采用并最小化抵触至关重要。充分的沟通、培训和支持对于帮助用户过渡到新的云环境并确保他们能够有效利用新工具和服务是必要的。\n\
  *   **软件知识产权和许可**：许多传统企业系统和应用程序基于遗留的 COTS 和打包应用程序。某些专有软件部署可能包含关于目标部署平台和位置限制的合同条款，这可能成为云迁移的障碍。根据目标云平台的选择，这些应用程序和系统的迁移可能会触发许可和可支持性限制。因此，务必让各种内部和外部利益相关方和供应商参与评估和规划迁移。\n\
  *   **专用遗留系统和 HCI**：传统的大型组织通常拥有用于专用工作负载和业务功能的遗留、过时、已停止支持的软件堆栈和 **超融合基础设施** (**HCI**)。组织可以根据特定的业务目标和需求从多种可用方法中选择来迁移这些系统，包括退役（不再需要的系统）、重新托管（零代码更改重新部署应用程序）、同地部署（在目标云基础设施附近托管系统，尤其是专用硬件）、重新平台化（以最小更改迁移到基于云的运行时）、重构（重组和优化现有应用程序代码）或仿真（在仿真器上虚拟化应用程序以模拟遗留行为）。彻底的评估和规划对于确保在迁移前捕获并考虑这些因素至关重要。\n\
  *   **网络和安全**：企业在执行大爆炸迁移时面临的另一个常见挑战是从传统的分层 IP 网络转向扁平的云原生 **软件定义网络** (**SDN**)。尽管云网络可定制，并且多家主要提供商提供\
  \ BYOIP 等功能以及支持硬件负载均衡器和防火墙等组件的同地部署，但必须明确定义和规划全面的迁移策略。云原生 SDN 还引入了新的安全考虑，因为企业数据在网络边界之外传输。企业必须仔细规划和实施安全措施来保护数据，例如加密、访问控制和网络分段，利用云提供商提供的纵深防御安全架构和控制。\n\
  \n## 数据中心退出\n\n\n\n# 数据中心退出策略\n\n另一条多家企业选择的常见数字化转型路径是退出现有数据中心。虽然大爆炸式迁移侧重于在较短时间内将所有本地系统和应用程序完全转向公共云，但数据中心退出可能具有若干独特的企业目标。企业选择退出数据中心的主要动机包括成本优化、利用云规模经济、降低托管费用、可扩展性、将资源集中于核心业务、利用技术进步进行创新，以及简单地避免硬件和技术更新等迫在眉睫的事件。视业务动机和目标而定，数据中心退出策略必须经过仔细评估和规划。例如，某组织可能会选择退出数据中心并迁移到基于云的基础设施，以避免即将到来的硬件和技术更新。将数据中心迁移到云中可能会给企业带来若干挑战。以下是一些关键考虑因素：\n\
  \n## 关键考虑因素\n\n### 遗留系统和应用程序\n企业通常拥有与多个其他应用程序、服务和数据中心基础设施紧密集成的遗留系统和应用程序。这些系统可能依赖于特定的硬件或软件配置，使得直接迁移到云中变得困难。将这些遗留应用程序现代化或重新架构以使其云兼容可能耗时且复杂。必须制定明确的迁移评估和规划练习，以捕捉当前状况和目标未来状态。我们将在第\
  \ 6 章中详细探讨一些迁移模式和蓝图以及如何构建云迁移评估计划，《构建开放且敏捷的 **云框架**》。\n\n### 数据传输\n将大量数据从数据中心迁移到云中可能具有挑战性，尤其是在线传输时，因为可用网络带宽可能有限，甚至可能变得成本高昂。数据在网络上传输所需的时间以及相关成本会影响迁移时间表和预算。企业需要仔细规划和优化数据传输流程以最大限度地减少中断。大多数公共云提供商提供经济实惠的离线批量数据传输/迁移服务，可通过物理存储设备促进从本地或托管数据中心的数据迁移。必须对数据加密给予认真考虑，以防止敏感数据丢失。\n\
  \n### 应用程序兼容性\n并非所有应用程序都设计为在云环境中运行。某些应用程序可能需要修改、重构，甚至完全重写才能成为云原生并利用云效率和自动化能力。应用程序兼容性计划必须作为云迁移评估的一部分制定，并附带潜在选项，以确保迁移成功和业务连续性。\n\
  \n### 安全性和合规性\n公共云提供商在 *共享责任* 和 *共享命运* 模式下运营。组织必须清楚了解云提供商提供的<|message|>安全范式至关重要。共享责任模型基于这样一种前提，即各层的安全责任界定明确，其中\
  \ **云服务提供商**（**CSPs**）和客户负责各自层级的<|message|>安全。然而，在共享命运模型中，CSP 在保护云环境方面发挥着更积极的作用。例如，支持共享命运的\
  \ CSP 通过采取合作方式保护客户租户，提供默认安全即开即用配置并满足合规义务、安全蓝图、风险保护计划和策略智能工具。重要的是要理解，云安全措施和实践可能与数据中心不同，需要对企业与云提供商之间的共享安全责任有透彻的理解。确保数据隐私、访问控制以及传输中和静态加密至关重要。我们将在第\
  \ 9 章中深入探讨云安全框架和最佳实践，《 **数字转型** 的方面》。\n\n### 供应商锁定\n企业在选择云提供商时必须仔细考虑潜在的供应商锁定风险。将应用程序和数据迁移到特定云提供商的平台可能会限制未来轻松更换提供商的能力。制定开放的云友好策略或多云策略，将工作负载分布在不同的云提供商之间，可以降低供应商锁定的风险并提供更大的灵活性。\n\
  \n### 网络连接\n建立企业本地基础设施与云环境之间可靠且高性能的网络连接至关重要，尤其是在选择混合云或多云方法时。视数据中心和云区域的地理位置而定，可能会出现网络延迟和连接问题。网络架构计划应作为迁移计划的一部分进行定义，以实施适当的网络配置来帮助优化网络性能。存在多种连接选项，包括专用连接，用于从数据中心到云建立直接\
  \ MPLS 连接；合作伙伴驱动连接，通过 ISP 建立到云的 MPLS 连接；对于已与云提供商同址的数据中心企业，可使用交叉连接；以及 IPSEC VPN，用于通过公共互联网安全连接到云服务。\n\
  \n### 技能差距\n迁移到云需要可能与传统数据中心运营不同的专业技能。企业可能需要提升 IT 员工技能、与合作伙伴合作或聘请云专家来了解云技术、管理工具和最佳实践。确保员工具备管理并优化云环境所需技能，对于成功迁移至关重要。\n\
  \n### FinOps 和成本管理\n虽然云提供潜在成本节约，但企业需要仔细管理和优化云成本。如果没有适当的监控和治理，云支出可能会迅速攀升。许多组织在开展云转型时常犯的一个错误是\
  \ *为高水位线配置*（这是指提前规划并配置服务器以满足预期峰值容量的做法），就像在传统数据中心中所做的那样，而没有利用云的弹性和按需付费模式。了解定价模式、优化资源利用率并实施成本控制措施对于避免意外成本超支至关重要。对于成熟的组织而言，建立\
  \ FinOps 实践以进行持续的成本管理和治理是明智之举。\n\n### 云运营\n数据中心中使用的运营流程和程序可能与云环境所需的不相符。企业需要调整其运营实践以有效管理和监控云资源。这包括配置自动扩展、实施监控和告警、管理云原生服务，并确保适当的治理和合规性。\n\
  \n\n\n## 云中的灾难恢复 (DR)\n企业的一个专门用例是在云中设置新的灾难恢复实例，以增强本地生产环境的弹性，或退出 DR 数据中心以优化成本。企业必须仔细规划本地生产环境与云中\
  \ DR 之间在应用和环境方面的对等性，以实现无缝的灾难恢复。我们将在 *第 5 章* 中更详细地讨论这一旅程。\n\n## 将应用迁移到云端\nLift and\
  \ shift 策略，也称为 *重新托管* 或 *迁移并放置* 策略，是指将应用程序和系统从本地数据中心迁移到云环境，且修改最少或不做修改。在大多数情况下，lift\
  \ and shift 策略通常是多阶段迁移方法中的第一步。在这种方法中，目标是快速将现有基础设施、应用程序和数据迁移到云平台，同时保留其功能和架构。Lift\
  \ and shift 策略是在主要目标是实现云优势时选择的，例如可扩展性、成本优化、对业务运营的最小干扰、保留对应用程序和软件许可的现有投资，以及通过逐步重构或重新架构实现分阶段应用现代化的灵活性。我们将在\
  \ *第 5 章* 中更深入地探讨 lift and shift 作为云转型之旅。虽然 lift and shift 策略可以提供相对更快的云迁移路径，但它也给企业带来某些挑战和限制：\n\
  * **无法利用云原生优化**：Lift and shift 迁移通常优先考虑速度和简单性，而非充分利用云原生能力。因此，企业可能会错失优化应用程序以在短期内实现更好性能、可扩展性和成本效率的机会。然而，有了明确的应用现代化路线图，企业可以将\
  \ lift and shift 方法用作分阶段转型的良好落地区。例如，lift and shift 迁移将使团队更好地了解云平台，为利益相关者提供快速成果和信心，并提升\
  \ IT 团队的云原生应用现代化技能。\n* **应用相互依赖**：企业关键任务应用通常与本地环境中的核心基础设施、库、数据库和其他系统存在复杂的相互依赖关系。应用依赖关系在迁移应用时可能带来挑战，需要仔细评估替代的云原生解决方案，以确保在云环境中的正常功能。必须为相关的基础设施需求和环境考虑因素以及外围应用程序和服务制定明确的迁移计划，以确保业务连续性。\n\
  * **数据传输和切换**：从本地环境到云的大规模数据传输可能耗时，影响整体迁移时间表。此外，企业必须规划一次性批量数据传输、通过线路的增量数据传输，以及切换策略，以最大限度地减少迁移过程中所考虑的应用程序的中断和停机时间。\n\
  * **性能和可扩展性**：迁移到云的应用程序可能无法自动受益于云固有规模和弹性的全部潜力。一些应用单体传统上是为垂直扩展而开发的。如果没有架构修改或优化，其中一些应用程序可能无法实现期望的性能改进或根据工作负载需求水平扩展的能力。企业可以通过重新架构、重构或重写应用程序来利用云原生的弹性、规模和性能优势。\n\
  * **成本优化有限**：虽然成本节约是云迁移的主要动机之一，但 lift and shift 策略可能无法完全优化成本。迁移到云的应用程序可能无法充分利用云优化资源利用的能力。如果没有适当的评估和优化，企业可能会过度配置资源或低利用可用的云资源，导致成本增加或性能不佳。适当的监控和优化工作对于长期实现成本节约是必要的。\n\
  * **运营挑战**：本地环境中使用的运营流程和工具可能无法与云环境无缝对齐。企业需要调整其运营实践，以有效管理监控云资源，包括实施云特定的监控、管理和治理流程。\n\
  * **许可和支持**：lift and shift 策略可能未考虑本地环境与云之间不同的软件许可模式或定价结构。企业需要审查和优化许可安排，并考虑潜在的成本影响，以避免意外支出或不合规。企业在迁移到云时确保基础设施和环境基线得到支持也至关重要。某些应用厂商还可能规定推荐或支持的云提供商或平台，以便获得持续的企业支持。\n\
  * **容错能力**：使用 lift and shift 策略迁移的应用程序可能无法从云内置的弹性和容错功能中 inherent 受益。企业应评估并实施适当的备份、灾难恢复和容错机制，以确保云中的高可用性和业务连续性。\n\
  * **安全和合规**：Lift and shift 迁移必须解决云环境特定的安全和合规要求。这包括确保数据保护、访问控制、身份和访问管理，以及遵守相关法规。企业需要评估云提供商的安全能力，实施身份同步和单点登录以实现无缝业务运营，并实施必要措施来保护迁移的应用程序和数据。\n\
  * **变更管理与用户采用**：将应用程序迁移到云需要变更管理工作以确保用户顺利采用。用户和利益相关者需要了解迁移过程，接受任何更改或新功能的培训，并在过渡期间获得支持，以最大限度地减少中断并最大化用户满意度。\n\
  \n## 混合云策略\n\n\n\n## 混合云战略\n\n一项 **混合云战略** 是企业能够结合使用公共云、私有云或本地环境以满足其独特业务需求的方法。在混合云设置中，组织将其部分应用程序、数据和基础设施保留在本地或私有云中，同时利用公共云服务来处理专门的工作负载和用例。该战略使企业能够获得两者的优势，并在公共云中创建灵活且可扩展的\
  \ IT 环境，作为其私有或本地 IT 基础设施的延伸。正如我们在 *第 2 章**, 云计算入门* 中探讨的各种云范式，根据 NIST 定义，“*混合云是由两个或多个不同的云基础设施组成的，这些基础设施保持独立实体，但通过标准化或专有技术绑定在一起，从而实现数据和应用的可移植性*。”\
  \ 这里的关键短语是“*绑定在一起*”和“*实现数据和应用的可移植性*”。这意味着混合云环境必须使用由通用工具集管理的统一实体，使用户能够同时与私有云和公共云服务进行交互。仅在多个公共云、私有云和本地传统服务器中运营，而没有统一或可移植性能力的组织并不构成混合云架构。凭借明确定义的混合云战略，企业可以利用诸如在公共和私有云之间灵活的应用程序放置和部署；通过选择具有成本效益的部署模式、高效的数据集成、实施强大的灾难恢复和业务连续性解决方案来优化成本；为季节性需求实施云爆发；避免供应商锁定和统一管理等专业能力。组织可以通过仔细规划、架构设计和持续管理获得所有这些好处。我们将回顾企业在实施无缝混合云战略时面临的一些挑战：\n\
  \n* **架构复杂性**：混合云环境与孤立的本地和云部署相比会引入额外的复杂性。在一个或多个云平台、本地基础设施和数据中心之间集成和管理资源具有挑战性，需要仔细的规划和架构设计。如果做得正确，这可以作为企业更快交付现代业务能力的坚实基础和起点。\n\
  * **互操作性**：混合云架构可能带来互操作性挑战，确保公共云和私有云环境之间无缝的数据集成和互操作性可能很复杂。企业需要建立高效的数据移动机制，实施适当的集成解决方案，并在不同平台上保持数据一致性和安全性。\n\
  * **运营复杂性**：管理混合云部署需要有效的运营流程和工具。企业必须建立运营框架，自动化管理任务，并在本地和云环境中确保一致的监控和性能管理。这种复杂性会增加运营负担，并需要额外投资于\
  \ SRE 实践、管理工具和专业知识。\n* **治理和合规**：建立统一的治理政策并确保本地和公共云平台之间的一致性对企业来说可能具有挑战性。组织需要在公共和私有云环境中定义和执行资源配置、访问控制、数据管理和合规监控的政策。\n\
  * **遗留系统集成**：由于架构、协议或兼容性差异，将遗留系统与混合云环境集成可能会带来挑战。企业可能需要投资现代化工作、应用程序重构或实施集成解决方案，以无缝连接遗留系统与云资源。\n\
  * **数据主权**：在混合云部署中，企业需要考虑数据主权和驻留法规，这些法规规定了某些类型数据可以存储和处理的位置。当数据分布在公共和私有云环境中时，确保遵守这些法规可能具有挑战性。\n\
  * **数据备份和恢复**：在混合云环境中实施一致的数据备份和恢复机制可能具有挑战性。企业需要确保关键数据得到适当备份，并在数据丢失或系统故障时能够恢复，同时考虑公共和私有云中可用的不同备份和恢复选项。\n\
  * **性能变化**：混合云部署可能由于网络延迟、数据中心区域、数据传输速度以及不同云平台性能的差异等因素而出现性能变化。确保混合环境中一致且可预测的性能需要仔细的架构设计和网络优化。\n\
  * **技能和专业知识**：混合云部署需要专门的技能和知识来架构、设计并在公共和私有云平台之间有效管理一致性和资源优化。企业可能面临寻找和留住具有云架构、集成、安全和混合云管理等方面正确专业知识的\
  \ IT 专业人员方面的挑战。\n* **迁移和集成**：将现有应用程序和系统迁移到混合云环境并将其与新基础设施集成可能复杂且耗时。企业需要仔细规划和执行迁移策略，确保不同环境之间的兼容性，并最大限度地减少对业务运营的干扰。\n\
  * **供应商管理**：与多个提供商合作需要有效的供应商管理实践。企业需要与多个供应商建立关系，管理 SLA，并确保一致的支持和沟通渠道。在不同供应商之间协调和解决问题会增加管理流程的复杂性。\n\
  * **安全和合规**：在混合云部署中实施安全和合规控制会增加复杂性。企业必须确保公共和私有基础设施之间一致的安全控制和访问管理，保持一致的数据保护标准，并遵守行业特定法规。解决数据泄露或未经授权访问等安全风险需要明确的安全架构和策略。\n\
  * **组织文化**：采用混合云需要文化转变以及 IT 团队运营方式的变化，尤其是在采用现代云原生技术和运营时。企业可能面临管理变革、教育员工以及在管理不同云环境的团队之间促进协作方面的挑战。建立拥抱云技术并鼓励协作的文化对成功至关重要。\n\
  \n混合云战略为企业提供了无缝集成和管理本地基础设施、私有云服务和公共云资源的战略机会。让我们探索企业在多个公共云方面的多云战略。\n\n## 多云战略\n\n\
  \n\n# 多云战略\n\n众多企业采用 **多云战略**，即组织利用多个公共云与传统的本地部署基础设施相结合，以利用每个部署平台所提供的独特功能。企业良好的多云战略涉及利用多个云服务提供商来满足其特定的业务需求。它使组织能够避免供应商锁定，实现更高的可用性，优化成本，并获得更广泛的服务和功能。例如，组织可能会选择订阅\
  \ Google Cloud、Microsoft Azure 和 Amazon Web Services 公共云平台，以实现每个平台独特的价值主张。\n\n成功的多云战略涉及明确目标；根据服务能力、定价模式、地理覆盖、可靠性、安全功能、合规能力、业务利益（业务冲突）以及客户支持来评估云服务提供商；确定工作负载部署位置；为互操作性进行架构设计；FinOps；以及建立一致的治理控制。为了充分发挥多云战略的潜力，例如灵活性和独特的优势，企业必须考虑组织的独特需求和限制，了解业务需求，并不断调整战略以最大化利用多个云服务提供商的好处。尽管多云战略提供独特的优势，企业仍必须解决一些关键挑战：\n\
  \n* **管理复杂性**：管理多个云服务提供商会带来复杂性，因为每个云服务提供商都有自己的工具、界面和管理控制台。企业必须投资专门的技能和工具，以高效管理跨云资源、部署和不同云中的配置。\n\
  * **供应商依赖**：虽然多云旨在避免供应商锁定，但企业必须仔细规划和设计其应用程序以确保可移植性。避免依赖专有服务和 API 对于保持灵活性和防止在提供商之间转换时出现挑战至关重要。\n\
  * **一致的服务体验**：在多个云中部署应用程序时，提供一致的用户体验可能具有挑战性，因为每个提供商可能具有不同的性能特征、服务级别、区域存在和可用区。在所有云中确保一致的服务质量和正常运行时间需要仔细规划和监控。尽管正在努力标准化云服务和\
  \ API，但不同提供商之间仍缺乏统一性。这可能导致兼容性问题，使得在多个云中一致地集成和管理服务变得困难。\n* **供应商管理**：管理与多个云供应商的关系需要专门资源和有效的供应商管理实践。企业需要建立牢固的关系、谈判合同，并确保与每个提供商进行清晰的沟通和目标一致。\n\
  * **互操作性和集成**：确保不同云平台之间无缝互操作和集成可能具有挑战性，企业需要投资强大的集成解决方案，利用行业标准，并采用兼容的架构以实现云之间的顺畅数据和应用程序流。在多个云服务提供商之间管理数据需要明确定义的数据管理和治理策略。\n\
  * **安全控制**：在多个云中实施一致的安全措施和合规控制可能很复杂。每个提供商都有自己的规定性安全框架，企业必须确保在所有云中保持统一且强大的安全态势。监控、威胁检测和事件响应在分布式环境中可能变得更加困难。\n\
  * **FinOps**：虽然多云战略可以提供成本优化机会，但在不同提供商之间有效管理成本可能具有挑战性。企业必须实施一致且强大的 FinOps 实践，以在所有云中获得使用情况、支出和资源优化的可见性。选择合适的定价模式、利用成本管理工具以及监控使用情况至关重要。\n\
  * **提升技能和再培训**：采用多云战略需要 IT 团队具备专门的技能和培训。每个云服务提供商都有其独特的功能和管理界面，需要深入了解每个平台。企业必须投资培训计划，以确保其\
  \ IT 人员在多个云中具备熟练程度。不断提升和再培训 IT 团队对于成功的多云战略至关重要。\n* **网络管理**：多云环境通常需要在不同云平台和本地基础设施之间实现互连。这可能导致网络管理工作和成本显著增加，尤其是与带宽和出站流量相关的成本。确保低延迟、高带宽和可靠的网络连接对于提供一致的用户体验至关重要。企业必须评估网络架构并建立稳健的连接以优化性能。\n\
  * **SLA 和支持**：在多个云服务提供商之间管理 SLA 和支持可能很复杂，组织必须了解每个提供商的服务保证、支持渠道和升级流程，以确保在所有云中保持一致且可靠的服务水平。\n\
  * **数据迁移和传输**：在多个云服务提供商之间传输数据可能很复杂且耗时，尤其是在处理大量数据时。确保高效的数据迁移流程、最小化停机时间并保持数据完整性在过渡期间可能带来挑战。\n\
  * **性能优化**：企业需要考虑数据本地性、网络延迟和工作负载分布等因素，以确保在所有云中实现最佳性能，因为在多云环境中优化性能可能很棘手。平衡资源分配和工作负载部署在多个提供商的情况下可能带来复杂性。\n\
  * **工作负载监控**：监控和排查分布在多个云中的应用程序和基础设施可能具有挑战性。组织应实施统一的监控和故障排除方法，以获得多云环境的可见性，以便快速识别和解决问题。\n\
  \n随着企业开展云转型，通常需要为具有不同业务优先级的多个工作负载采用多种策略。然而，进行详细的工作负载评估并考虑挑战、权衡以及成功的数字化转型的长期愿景至关重要。在确定正确的战略后，选择满足所有维度的合适的云服务提供商非常重要。在下一节中，我们将探讨选择云服务提供商时需要考虑的关键因素。\n\
  \n# 选择合适的云服务提供商\n\n为企业用例选择合适的云服务提供商通常具有挑战性，尤其对于采用混合云和多云战略的组织而言，因为它构成了企业数字化转型的基础。选择合适的云服务提供商需要根据当前和未来的业务需求进行仔细评估和多维度考虑。评估\
  \ CSP 的可靠性、长期关注点和能力至关重要，因为我们将关键任务应用程序和数据托付给它。\n\n![图 3.7 – 选择云服务提供商时需要考虑的因素](img/B18893_03_7.jpg)\n\
  \n图 3.7 – 选择云服务提供商时需要考虑的因素\n\n\n\n让我们回顾企业在踏上云端之旅前必须评估和考量的一些关键因素。请注意，其中一些因素在选择私有云时也适用。\n\
  \n## 业务方面\n首先要考虑的支柱是云服务提供商与企业商业模式的建设性价值、协作性和兼容性。这通常是一个关键因素，因为它会影响诸如支持长期愿景、行业专业知识和合规性等诸多方面。例如，选择具有竞争性商业模式的云服务提供商有时会对组织的商业利益和目标造成不利影响，尤其是在存储和提供敏感数据时。该支柱涵盖业务兼容性、SLAs、行业和技术领导力等诸多方面。\n\
  *   **业务兼容性**：选择 CSP 的第一步是明确定义组织的业务和功能需求、目标和优先事项，并根据 CSP 的能力制定评估地图。作为这一关键步骤的一部分，企业还必须考虑与\
  \ CSP 的业务兼容性，以确保不会出现商业利益冲突。\n*   **合同和 SLA**：企业采购和采购团队的下一个关键步骤是仔细审查企业合同、商业条款和 SLA，以及与数据安全、数据隐私、**知识产权**\
  \ (**IP**) 权利、数据处理、使用第三方供应商提供功能（如有）、终止和争议解决流程、价格和付款条款、责任和赔偿相关的细节。\n*   **客户参考**：评估\
  \ CSP 成熟度和可靠性的一个关键标准是研究与企业行业和技术成熟度相符的客户参考和反馈。组织还可以与 IDC、Gartner 和 Forrester 等技术研究和咨询公司合作以获得洞察。通过寻求客户参考、与行业同行建立联系、参加会议或利用在线社区收集真实经验和建议，可以帮助企业做出明智的决策。\n\
  *   **行业专业知识**：除了纯技术能力之外，企业还必须考虑云服务提供商的行业专业知识和专业化程度。一些 CSP 可能会提供针对特定行业（如零售、医疗保健、制造、金融、电信等）量身定制的专业解决方案或服务，这可以增强企业的行业专业知识能力。选择对行业需求有深刻理解的提供商会非常有帮助。\n\
  *   **供应商可行性**：组织明智的做法是评估云服务提供商的声誉、财务稳定性和长期可行性，考虑因素包括其市场存在感、客户群、财务报告和战略合作伙伴关系。\n\
  *   **合作伙伴协同**：除了原生云服务提供商服务外，合作伙伴提供的服务通常为企业提供扩展能力、定制解决方案和快速启动。这对于在传统本地基础设施中已有现有解决方案和合作伙伴关系的企业也可能非常有益。企业必须了解\
  \ CSP 与不同供应商的合作关系、资质、技术能力和认证。理想的服务提供商可以轻松融入企业的更大生态系统。除了市场产品外，企业还必须考虑云服务提供商的 **系统集成商**\
  \ (**SI**) 和 **托管服务提供商** (**MSP**) 合作伙伴关系。\n*   **总拥有成本**：企业必须评估云服务提供商提供的各种定价模式，并了解其如何与预算和使用模式保持一致。组织还可以通过考虑按需付费、灵活承诺、抢占式实例、持续使用折扣和价格层级等因素，从\
  \ **总拥有成本** (**TCO**) 和 **投资回报率** (**ROI**) 评估中受益。确保透明的定价结构、提供商的成本管理工具和 FinOps 实践以优化云支出至关重要。\n\
  \n## 技术方面\n选择云服务提供商时需要考虑的下一个重要支柱是技术。这指的是云服务提供商的技术能力，可以简化云转型，同时促进创新。这包括诸如遵循开放标准、通过工具简化迁移、针对行业垂直领域量身定制的流程以及客户支持等诸多方面：\n\
  *   **开放标准和互操作性**：供应商锁定通常是企业的一个严重问题，无论是通过合同还是专有技术。组织必须评估与每个云服务提供商相关的潜在供应商锁定风险。云本质上是建立在开源技术之上的，企业必须评估云服务提供商用于构建其托管服务所使用的服务的标准化程度、开放标准的使用情况和兼容性，以及避免和减轻供应商锁定的迁移工具和支持的可用性。\n\
  *   **工具和功能**：评估不同云服务提供商提供的服务和产品。考虑计算实例、存储选项、数据库、网络能力、安全功能、机器学习工具、托管服务产品和开发者服务等因素，以确定其与业务需求的一致性。\n\
  *   **概念验证**：考虑与入围的云服务提供商进行概念验证或试点项目。这使企业能够在承诺长期合作之前评估提供商的服务、性能、支持以及与应用程序和工作负载需求的兼容性。\n\
  *   **迁移工具和支持**：将现有工作负载迁移到公有云——尤其是数据量大的工作负载——是复杂、耗时且有风险的。但通过正确的规划，组织可以迅速建立正确的实践以加速迁移、降低风险并在云中取得成功。成熟的云服务提供商提供多个快速启动模板、迁移框架和工具集，专门针对遗留应用程序迁移、应用程序重构和数据现代化，这对企业非常有帮助。\n\
  *   **可用性和可靠性**：云服务提供商的性能、可靠性和可用性是企业云转型成功的基础和关键。考虑因素包括正常运行时间保证、可用区、网络连接和延迟要求。\n\
  *   **客户支持**：评估云服务提供商提供的支持和客户服务水平。了解其支持渠道、响应时间和升级流程非常重要，同时还应考虑文档、社区支持、论坛、技能可用性和培训资源等因素，以协助入职和故障排除。\n\
  *   **事件管理**：企业还可考虑 CSP 提供的针对业务需求的专业事件管理支持。例如，CSP 可能会为零售商在黑五销售等高峰季节提供容量规划和高级预订支持，为医疗保健的开放注册期提供专用支持机制等。\n\
  \n## 创新方面\n\n\n\n# 创新与数字化颠覆\n\n创新和数字化颠覆代表了任何企业云成熟度的最高水平。云服务提供商在创新方面的领导力、对开源社区的贡献以及技术专长，\
  \ all can be 帮助引领创新的极其关键因素。例如，提供商的专业知识可以通过早期访问计划、运营研究计划以及在企业创新中心开展的研讨会进行交叉传播，从而加速创新进程。这一重要支柱涵盖了创意服务、获取新兴技术、开放标准支持和可持续性等方面。\n\
  \n### 专业化服务\n云转型企业的主要驱动力之一是创新。企业必须考虑 CSP 提供的独特且专业化的服务方案，这些方案可以增强、受益于并推动企业的目标和愿景。例如，企业可以通过利用专门的\
  \ AI 方案为客户提供差异化服务。\n\n### 混合云支持\n即使混合云不是最初的考虑因素，企业仍应确保云服务提供商提供强大的混合云解决方案、产品和服务组合，能够无缝帮助企业在云和本地基础设施之间迁移工作负载。混合云支持可以为企业节省时间和精力与资源，并可支持\
  \ **一次构建，到处部署** (**BODA**) 架构。\n\n### 多云方法\n如果多云方法是在企业云战略的核心组成部分，组织必须确保 CSP 对开放标准和框架的支持，因为应用程序和数据可移植性至关重要。随着越来越多的云服务提供商继续标准化和构建基于开放架构的方案，这仍然是一个不断发展的领域。\n\
  \n### 可持续性\nESG 和可持续性目标是成熟现代企业的关键特征。随着双重实质性和 ESG 考量对长期成功至关重要，企业会明智地与在可持续性目标和减少碳足迹等方面具有共同目标的\
  \ CSP 合作，例如。\n\n### 投资\n云转型的首要目标之一是持续创新并跟上变化。这需要持续投资于现代技术以满足并超越消费者需求。企业可以评估 CSP\
  \ 在研发、创新和技术投资方面的历史、当前和未来承诺，这可以直接惠及企业的愿景。\n\n## 安全方面\n\n安全是基础，但在选择云服务提供商时往往被视为事后考虑。确保云服务提供商的安全方面与企业安全蓝图一致非常重要。安全方面超出了基本合规要求，明智的做法是考虑诸如基础安全态势、遵守开放安全标准、与本地和第三方安全工具的集成、纵深防御安全以及风险管理等因素：\n\
  \n### 安全态势\n安全是每个人的责任，在云转型之旅中比以往任何时候都更相关。企业必须仔细评估 CSP 提供的 security posture、框架和政策。这可能包括物理数据中心安全以及关于共享责任与共同命运的安全态势。企业必须评估云服务提供商的弹性，特别关注区域能力/历史可用性数据。\n\
  \n### 开放安全架构\n随着企业开展云转型，明智的做法是设想一种开放安全架构，能够无缝支持多个部署目标。**开放安全架构** (**OSA**) 指的是为组织内部设计、实施和管理安全解决方案提供结构化方法的框架或方法论。选择支持\
  \ OSA 的云服务提供商促进了开放标准、最佳实践和协作的使用，以开发稳健有效的 security architectures。\n\n### 合规审计\n在选择云服务提供商时，企业必须考虑联邦、州和行业法规的影响。CSP\
  \ 通常会按服务和区域发布一套合规性、鉴证和认证，这可以帮助企业自信地部署解决方案并遵守各种报告和监管义务。\n\n### 安全治理\n企业必须确保所选 CSP\
  \ 提供全面的安全政策和程序，以控制对提供商和客户系统的访问。完善的云治理框架可以帮助管理风险、增强数据安全并实现企业的无缝云运营。\n\n### 风险管理\n\
  云计算中的风险管理涉及识别、评估和减轻使用云服务相关的潜在风险。企业必须评估数据安全、数据隐私、数据治理、网络和共享基础设施风险并制定缓解策略。这还可能涉及评估\
  \ CSP 提供威胁情报、网络威胁检测、攻击向量检测和监控的能力。企业安全还必须在满足 SOC 等监管合规性之外定期进行渗透和漏洞测试。\n\n### 数据安全与隐私\n\
  企业必须确保 CSP 为所有级别和类型的云服务提供全面的安全基础设施和访问控制策略。评估 CSP 的数据管理、数据驻留、数据备份、复制、保留和地理围栏安全政策和程序非常重要，以确保企业和客户数据的完整性。\n\
  \n## 处理财务问题\n\n随着企业踏上首次云转型之旅，关于云是否像承诺的那样具有财务可行性和益处，常常存在巨大争论，因为这涉及融资范式的转变。传统的本地 IT\
  \ 投资通常会产生前期 **资本支出** (**CapEx**)，预计将在多年内使用，未来继续惠及业务，并最终收回成本。**运营支出** (**OpEx**)\
  \ 通过企业的日常运营产生，通常包括服务和维护。随着技术的指数级演进和业务需求的快速变化，CapEx 投资的使用寿命变得不确定，过时，甚至在收回成本之前就已过时。传统\
  \ CapEx 投资的另一个固有缺点是，组织可能最终为未来业务不需要的过剩容量付费，或陷入耗时且昂贵的扩容过程。由于云订阅费通常属于 OpEx，一些传统企业的\
  \ IT 领导者在说服财务部门关于成本价值方程时可能面临挑战，因为这涉及对传统 IT 投资摊销和折旧方式的根本性改变。正如我们在 *第 2 章**，云计算入门*\
  \ 中探讨的那样，云转型需要在整个组织中进行文化转变，企业领导者必须建立涵盖 TCO、ROI 和业务价值的价值评估框架；优化 OpEx 的 FinOps 实践；以及衡量和展示价值的价值实现计划。当云计算背景下处理从\
  \ CapEx 到 OpEx 的转变时，企业可以采用多种策略：\n\n\n\n### 财务规划\n企业应仔细分析财务状况并结合长期目标，以确定在资本支出（CapEx）和运营支出（OpEx）之间进行资源分配的最合适方式。这涉及考虑现金流、税务影响、成本可预测性以及对组织整体财务影响等因素。\n\
  \n### FinOps 与成本管理\n实施 FinOps 和健全的云成本管理实践对于优化云中的 OpEx 至关重要。这包括监控和分析云使用情况、实施成本控制措施、利用自动化进行资源配置和释放，以及定期审查和优化云资源利用率以最大限度地减少不必要的支出。\n\
  \n### 战略性工作负载部署\n企业应分析工作负载，并确定哪些应用程序在成本节约、创新价值和运营效益方面更适合云。通过战略性地构建或迁移特定工作负载到云中，组织可以利用云的扩展性、灵活性和按需付费模式来优化\
  \ OpEx。\n\n### 利用灵活的定价模式\n云服务提供商提供各种定价模式，例如按需付费、预留实例、持续使用折扣和抢占式实例。企业应仔细评估这些选项，并选择与工作负载模式、成本可预测性和预算要求相一致的定价模式。选择合适的定价模式有助于有效管理\
  \ OpEx。\n\n### 总拥有成本（TCO）分析\n进行全面的 TCO 分析有助于企业比较在云中与本地基础设施部署和管理应用程序的成本。该分析考虑了硬件、软件许可、维护、人员和基础设施成本等因素，并提供了采用基于云的\
  \ OpEx 模式的财务影响的见解。这也有助于 IT 领导者构建业务价值论证。\n\n### 供应商谈判\n企业通常可以与云服务提供商谈判承诺合同和 SLA 以优化成本并确保灵活性。基于工作负载波动谈判折扣、有利的定价条款和灵活的协议有助于有效管理\
  \ OpEx。\n\n### 云治理\n建立治理框架并实施监控和跟踪机制使组织能够获得云使用情况和支出的可见性。这使他们能够识别成本优化领域、执行成本控制策略和警报，并确保符合预算限制。\n\
  \n### 混合云和多云策略\n企业可以采用混合云或多云策略来实现 CapEx 和 OpEx 之间的平衡。通过利用本地基础设施、私有云和公有云的组合，组织可以根据特定工作负载要求优化成本并利用不同成本模型的优势。\n\
  \n### 持续优化\n云成本和定价模式会发生变化，要求企业定期审查和优化云支出。这涉及进行定期成本评估、分析使用模式、识别优化领域并做出调整以确保持续的成本效率。\n\
  \n通过实施其中一些策略，企业可以有效管理从 CapEx 到 OpEx 在云中的过渡，优化云支出，并与云计算提供的财务模型和运营优势保持一致。\n\n# 摘要\n\
  在本章中，我们探讨了企业在云采用和数字化转型方面面临的各种挑战。踏上云采用之旅的企业会遇到一系列需要战略规划和深思熟虑实施的挑战。应对这些障碍可确保云采用成为创新和效率的变革力量，而非意外复杂性的来源。\n\
  我们还讨论了企业如何识别和选择正确的云战略来现代化 IT——以零售商的电子商务应用程序为例——同时也探讨了各种云转型战略。此外，我们还讨论了企业在选择云服务提供商时必须评估和考虑的各个方面。\n\
  最后，我们讨论了如何处理云引入的新财务模式，并通过云采用实现财务可行性和价值。\n在下一章中，我们将探讨企业在踏上云转型之旅时构建稳健云基础所需核心要素。\n"
- '# 第 2 部分：混合云和多云的成功实践

  在本部分，我们将学习企业可以利用的策略和技术来构建现代 IT 企业的基础。由于每个企业都是独特的，因此数字化转型之旅也各不相同。我们将探讨企业可以利用的各种云之旅来实现业务数字化转型。此外，我们将学习一些经过验证的策略，组织可以采用这些策略来构建开放且敏捷的云转型框架。最后，我们将深入探讨一些企业在各自行业实现数字化颠覆的真实案例。

  本部分包括以下章节：

  * *第 4 章*, *构建现代企业的基石*

  * *第 5 章*, *企业云转型之旅*

  * *第 6 章*, *构建开放且灵活的云框架*

  * *第 7 章**, 混合云用例*

  '
- "## 构建现代企业的基石\n在上一章中，我们讨论了企业在引领数字化转型方面面临的挑战。作为企业 IT 领导者，确保为成功的云转型之旅奠定正确的基础非常重要。本章旨在概述一些基础框架，帮助企业有效应对复杂性并拥抱变革。在当今超竞争的商业环境中，组织力求在不断变化的市场动态和技术进步中取得并保持成功。为了应对这一复杂环境，企业需要一种全面的方法——一种涵盖人员、流程和技术之间相互作用的方法。管理变革对于企业蓬勃发展至关重要，使组织能够适应不断变化的市场趋势、创新变革、吸引员工、降低风险并获得竞争优势。随着我们探讨本章关于构建现代云就绪企业基础的内容，我们将探索各种策略、工具和框架，帮助企业领导者在其各自行业中管理、拥抱和引领数字化颠覆。\n\
  在本章中，我们将涵盖以下主题：\n* 有助于企业管理变革的工具和框架\n* 企业云采用策略和云成熟度评估框架\n* 建立 **云卓越中心** (**CCoE**)\n\
  * 以创业心态、产品思维和平台工程构建云优先企业的基石\n* 通过 **关键用户旅程** (**CUJs**) 实现以客户为中心的设计思维\n* 在开源和开放标准上构建云基础\n\
  \n## 莱维特变革管理的钻石模型\n\n\n\n# 利维特钻石变革管理\n\n每个转型举措都会带来变革，而企业规模的数字化转型则加剧了这种变革。企业领导者在数字化转型中面临的最困难挑战之一，是在人员、流程和技术方面管理变革。深思熟虑的变革管理对数字化转型至关重要，因为它通过为员工做好准备、精简运营以及通过技术促进即将发生的变革的创新来减轻抵触。有效的变革管理确保组织内的每个人都朝着共同愿景努力。\n\
  \n1965 年，斯坦福大学组织行为学和心理学教授 **哈罗德·J·利维特** 提出了一个组织变革管理的综合模型，被称为 **利维特系统模型**，也被称为 **利维特钻石**\
  \ *\\[1\\]*。利维特提出该模型是为了理解组织内部四个关键要素之间的相互关系——结构、人员、技术和任务。\n\n![图 4.1 – 利维特钻石变革管理的示意图](img/B18893_04_1.jpg)\n\
  \n图 4.1 – 利维特钻石变革管理的示意图\n\n让我们更仔细地了解一下：\n\n*   **结构**：组织结构是指组织内部角色、职责和汇报关系的正式安排，涵盖组织架构图、角色和职责等各方面。在当今企业中，结构已演进以适应扁平化层级、矩阵式组织和敏捷团队等变化。这种结构影响着沟通、决策和协调，并在支持协作、创新和灵活性方面发挥着至关重要的作用。\n\
  \n*   **人员**：人员要素强调员工在组织有效性中的重要性，以便有效地拥抱和管理变革。当今企业关注员工敬业度、人才管理、多样性和包容性举措。随着远程和灵活工作安排的重要性日益增加，管理虚拟团队和培养积极的组织文化是关键考量。支持员工的福祉、持续学习和职业发展至关重要，以确保员工作为变革推动者参与决策过程，同时影响高绩效目标。\n\
  \n*   **技术**：技术已成为现代企业不可或缺的一部分，涵盖组织内部用于帮助员工完成任务和实现目标的工具、系统和流程。它包括硬件和软件工具、系统和数字平台。随着企业利用\
  \ **人工智能** (**AI**)、大数据、云计算和自动化等新兴技术来提高效率、决策能力和客户体验，技术的采用和有效利用对于推动创新、竞争力和运营卓越至关重要。\n\
  \n*   **任务**：任务管理涵盖个人和团队为实现组织目标而承担的具体活动、流程和工作流。当今企业通常关注流程优化、工作流自动化和敏捷方法。精简流程、识别瓶颈和实施精益实践是提高效率、质量和客户满意度的关键。数字化转型的兴起导致任务被重新构想和重新设计，以便与数字能力和客户期望保持一致。\n\
  \n利维特钻石强调这四个要素相互关联、相互影响。一个要素的变化或修改可能会对其他要素产生连锁反应。例如，实施新技术可能需要对组织结构进行调整、改变工作任务以及对员工进行培训。该模型建议组织应努力在四个要素之间实现平衡对齐，以实现最佳绩效和有效性。通过考虑结构、人员、技术和任务之间的相互依赖性和交互作用，组织可以识别改进领域，有效管理变革并提升整体组织绩效。即使在今天，利维特钻石仍然是企业分析组织系统并识别改进机会的宝贵框架，包括组织行为、管理\
  \ and 系统思维。\n\n在当今企业中应用利维特钻石涉及考虑这四个要素之间的相互依赖性和交互作用。这凸显了为实现组织有效性而实现对齐和整合的需求。以下是利维特钻石在当代企业中应用的一些示例：\n\
  \n*   **组织变革**：在实施变革时，例如采用新技术、重新组织团队或引入新流程，企业必须评估对钻石四个要素的全部影响。这可确保变革与组织结构保持一致，调动并支持员工，利用适当的技术，并优化任务以实现预期成果。\n\
  \n*   **数字化转型**：数字化转型举措要求企业评估并协调钻石的所有要素。这涉及从其对数字能力的支持角度考虑组织结构，对员工进行再培训或提升技能以利用新技术，整合适当的数字工具和平台，并重新定义任务和流程以利用数字优势。\n\
  \n*   **敏捷和跨职能团队**：采用敏捷方法论的企业需要考虑结构、人员、技术和任务之间的交互作用。组织必须确保具备适当的结构来支持协作和决策，选择具有多样化技能和专业知识的团队成员，为他们提供合适的技术工具和平台，并定义任务和工作流以实现敏捷性和迭代开发。\n\
  \n*   **变革管理**：应用变革管理原则涉及解决钻石的四个要素。这包括有效的沟通和利益相关者参与（人员）、评估变革对组织结构、角色和汇报线的影响、提供技术采用所需的培训和支持，以及重新定义任务和流程以与变革保持一致。\n\
  \n利维特钻石提供了一个变革管理框架和一种在组织内管理变革的整体方法。由于每个企业都是独特的，利维特钻石可以提供有关公司在四个要素——结构、任务、人员和技术方面的关键成功因素的见解。在下一节中，我们将探讨建立在利维特钻石之上的黄金三角的三个支柱。\n\
  \n# 黄金三角\n\n\n\n在动态的商业环境中，企业面临着实现并维持成功的艰巨挑战。为应对这一挑战，需要一种整体方法——将人员、流程和技术整合为无缝框架。**人员-流程-技术**（**PPT**），也称为**黄金三角**，是另一个极受欢迎且重要的组织管理框架，企业必须利用它以确保在变革中无缝运作。PPT\
  \ 建立在 Leavitt’s diamond 之上，并强调了人员、流程和技术在实现组织成功中的关键作用，强调了这三个要素的相互关联性和相互依赖性。它认识到每个支柱都是必不可少的且相互关联的，需要仔细关注和整合。通过关注培养和赋能人员、优化流程以及利用技术，组织可以提升其有效性、效率和创新能力。PPT\
  \ 框架为企业构建坚实基础提供了路线图，并可为可持续增长、改善客户满意度和提高盈利能力铺平道路。\n\n## 人才——组织成功的基石\n\n人才支柱是黄金三角的基石，认识到人力资本对组织的重要性。它还强调了战略人力资源管理、人才发展以及重视个人的支持性工作文化的需求，促进组织与其最宝贵资源之间的共生关系。让我们更仔细地了解一下：\n\
  \n*   **人力资本**：人力资本由个人的技能、知识和能力构成，是创新、解决问题和创造力的核心要素，而这些都是成功数字化转型的关键组成部分。熟练的劳动力不仅能够实现数字解决方案的实施，还能培养敏捷和韧性的文化，使组织在技术颠覆中蓬勃发展。对人力资本的战略投资是释放数字技术变革力量的关键，并确保组织的长期成功和可持续性。\n\
  \n*   **组织文化与领导力**：组织文化和领导力在数字化转型计划的成功中发挥着关键作用，同时也应对变革阻力，而变革阻力是数字化转型期间的常见挑战。在技术不断演进的数字化转型背景下，积极且适应性强的组织文化提供了拥抱变革和创新的必要肥沃土壤。无论是高管还是中层管理层的领导力，对于设定组织数字化旅程的基调都至关重要。\n\
  \n*   **人才获取、发展与保留**：随着企业踏上数字化转型之路，人才管理变得极其重要，以确保组织拥有具备必要技能的合适人才，从而使他们保持相关性并保留顶尖人才以打造稳定且忠诚的员工队伍。在人才获取、发展和保留的三管齐下方法中，人才获取策略应侧重于吸纳来自不同背景的个人，他们不仅具备技术技能，还能带来新视角并展现创新思维和前瞻性思维。另一方面，人才发展策略必须侧重于提供持续学习机会、职业发展、培养适应能力以及拥抱变革的意愿。最后，积极包容的工作文化以及专业成长、奖励和认可的机会可以培养归属感并提高人才保留率。\n\
  \n## 流程——精简运营并提升效率\n\n正如俗话所说，用旧流程拥抱新技术只会产生一个非常昂贵的旧流程。随着组织为现代数字企业奠定基础，识别并认识到用现代最佳实践取代旧流程的机会以实现更高投资回报率，变得极其重要。以下是企业可以拥抱的几个关键流程改进领域：\n\
  \n*   **运营卓越与持续改进**：精简和优化流程可提高效率。稳定一致的结果消除浪费并提升资源利用率。坚实的运营基础使组织能够专注于创新，因为日常运营顺畅运行，为创造性思考留出空间。实施精益和六西格玛方法使组织能够识别并消除流程瓶颈和变异。持续改进不仅帮助组织提升当前运营，还使其保持对变化趋势的适应性。运营卓越与持续改进共同使组织能够持续交付高质量的产品或服务，满足客户期望并保持竞争力。\n\
  \n*   **工作流程与协作**：拥抱数字化转型使组织能够迅速响应不断变化的市场趋势和客户期望。然而，这需要在开发、运营和流程控制方面实现范式转变。企业必须采用敏捷方法来培养持续改进的文化，重点是通过定期反馈循环交付有形的增量价值，使团队能够在项目生命周期内调整和完善策略。培养业务与\
  \ IT 团队之间的跨职能协作以打破信息孤岛，从而全面理解组织目标和客户需求，也至关重要。\n\n*   **质量保证与风险管理**：新技术的整合、流程变化以及不断演变的监管环境引入了各种风险，例如网络安全威胁、数据泄露和运营中断。随着技术进步的指数级演进和采用，确保数字解决方案的质量对于满足客户期望、赢得客户信任以及实现业务目标至关重要。质量保证实践涉及对数字流程和技术进行严格的测试、验证和确认，以保证其功能性、可靠性和安全性。这不仅提升了整体用户体验，也有助于组织的信誉和可信度。同时，积极的风险管理和遵守监管和法律合规对于识别、评估和减轻不确定性以及建立利益相关者信任至关重要。\n\
  \n## 技术——推动创新和竞争优势\n\n技术是促进创新并推动数字化转型的催化剂。它使组织能够重新构想传统流程、提升效率并创造新的商业模式。持续采用新兴技术是企业创新并巩固其作为数字颠覆领导者地位的数字化转型的核心：\n\
  \n*   **新兴技术与自动化**：新兴技术提供变革性能力，有助于重新定义传统商业模式并使组织能够利用技术力量提升客户体验，同时推动运营效率。通过拥抱自动化和新兴技术，组织可以解锁新的敏捷性、可扩展性和竞争力水平，使其处于行业演进的前沿，并确保数字化转型的长期成功。\n\
  \n\n\n# 数据转换\n组织可以战略性地利用数据转换作为成功数字化转型计划的支点。在现代数字环境中，数据是每个企业都不可估量的资产，充分发挥其全部潜力至关重要。数据转换涉及收集、清洗、组织和分析数据的全面过程，以得出可操作的洞察。数据驱动的洞察使组织能够了解客户行为、预测市场趋势、定制营销策略，并优化供应链管理以提高效率。\n\
  \n## 企业云成熟度评估\n为现代云就绪企业建立坚实的基础对于确保数字化转型成功至关重要。云就绪评估是了解组织在成熟度曲线中的位置并制定与业务目标一致的适当策略不可或缺的第一步。由于每个企业都是独特的，成熟度评估可以成为一个有用的工具，不仅可以评估当前状态，还可以作为未来转型目标的指引。云成熟度评估是一个重要工具，可以帮助企业改进云采用和使用。几种成熟度评估侧重于特定功能，例如云就绪、安全性和服务成熟度。企业最佳的云成熟度模型将取决于组织的具体需求和目标。然而，所有模型都可以为组织的云成熟度水平提供有价值的见解，并帮助制定改进路线图。\n\
  \n### 云采用成熟度模型 (CAMM)\nCAMM 是一个有见地的框架，有助于企业评估和衡量其云采用成熟度。通过评估其当前的云成熟度，组织可以获得有价值的见解，推动其努力实现变革性成熟度水平。基于我在多个行业领域与多家企业合作的经验，该\
  \ CAMM 框架是对多个行业领先框架的改编，旨在与企业需求保持一致。CAMM 模型由不同维度上的六个成熟度级别组成，并独特地与黄金三角相联系，以帮助管理变革：\n\
  * **Baseline**: 在此级别，企业主要在传统的本地或托管环境中运行，使用遗留系统和单体应用堆栈。部门或组织层面没有重大的云计划，也没有迁移或采用云计算的计划。\n\
  * **Explore**: 处于此成熟度水平的企业处于调查阶段。任何云服务采用和使用通常是探索性的且有限的，孤立的概念验证不涉及高管赞助。\n* **Ad hoc**:\
  \ 此级别的组织正在开展云计算，无论是私有云还是公有云部署。大多数云使用是部门级的，并由特定的业务需求驱动，以增加 IT 因速度或能力限制而无法提供的现代功能。在此级别，没有全企业范围的云采用，主要是由业务部门领导推动。\n\
  * **Define**: 在此级别，企业开始将云计算作为企业范围内的标准采用，但由于缺乏既定的治理政策、最佳实践和控制措施，云的使用仍然是战术性的且受限。在此阶段，云访问通常是集中的，使得团队更难访问、探索和创新。组织层面存在一定程度的高管赞助。\n\
  * **Orchestrate**: 处于此成熟度水平的组织拥有明确的云战略，并已实施流程和控制措施以高效管理监控云环境。本地、公有云和私有云之间实现了无缝集成，并采用统一的\
  \ DevOps 实践、自动化、流程、控制和工具。在此级别，企业通常已定义治理政策、流程和工具，使团队能够引领变革并比以往更快地交付云中的高级功能。在此阶段，云访问是分散的，各个团队承担所有权和责任。\n\
  * **Transform**: 此级别的组织持续优化云环境以提高性能、弹性、安全性和成本效率。在此阶段，数字化转型开始，企业工作负载高度灵活、安全、可移植，并且可以在不同平台上开发和托管。此成熟度水平的企业通常引领数字颠覆，被视为各自行业中的领导者。\n\
  \n下图描绘了企业云采用和成熟度的级别：\n\n![图 4.2 – 企业云采用和成熟度级别](img/B18893_04_2.jpg)\n图 4.2 – 企业云采用和成熟度级别\n\
  \nCAMM 框架是企业各种规模的宝贵工具，有助于衡量组织的当前成熟度水平并改进云采用和使用。它使用起来相当容易，可以根据组织的具体需求进行定制。通过利用 CAMM\
  \ 框架，组织可以实现一些重大收益，例如评估组织的云成熟度水平、识别云使用和采用的改进领域、确保组织的云战略安全合规、评估组织的云治理能力、与长期业务目标保持一致，并能够制定云成熟度改进路线图。\n\
  \n企业的云成熟度通常在黄金三角或 PPT 框架的不同维度上进行衡量。典型的评估涉及衡量组织在每个维度上的成熟度得分，累计得分表示整体成熟度得分。这通常是企业衡量、跟踪和改进整体云成熟度的第一步。由于每个企业都是独特的，组织可以考虑在三个支柱中的每一个上采用更少或更多的维度。让我们详细回顾成熟度级别以及它们如何在这些维度上进行评估。\n\
  \n### 人才支柱\n人才支柱涉及组织技能发展、招聘、战略合作伙伴关系和团队协作等维度。本节提供了组织如何利用 CAMM 框架自我评估云采用成熟度的指南。\n\
  \n#### 组织技能发展\n组织技能发展涉及组织为提升其员工的技能、能力和素质而做出的有意且系统性的努力。随着技术、行业趋势和工作要求的不断发展，持续的组织技能发展对于保持熟练、积极和有韧性的劳动力至关重要：\n\
  * **Ad hoc**: 未建立正式的培训目标、认证或指标。\n* **Explore**: 培训、认证和动手练习必须专门申请\n* **Define**:\
  \ 提供按需和讲师指导的培训，并积极支持和推广正式认证\n* **Orchestrate**: 除正式培训和按需学习外，还推广和奖励跨组织知识共享、个性化发展计划和基于角色的认证指导\n\
  * **Transform**: 组织推广外部知识共享、技术分享、行业领导力、黑客马拉松以及提升技能的绩效激励\n\n#### 招聘流程\n\n\n\n## 人员支柱\n\
  \n### 员工队伍\n该维度指的是组织为吸引和聘用不仅精通云和数字技术，而且热衷于推动创新并为组织数字化转型之旅做出贡献的员工所采取的战略步骤：\n* **临时**:\
  \ 候选人无需具备先前的云经验\n* **探索**: 某些职位要求具备先前的云经验\n* **定义**: 最相关的职位要求候选人具备先前的云经验\n* **编排**:\
  \ 相关岗位被重新定义，要求员工提升技能，作为构建云优先组织的基石\n* **转型**: 所有职位招聘均要求具备云经验，目标是实现企业数字化转型\n\n###\
  \ 合作伙伴\n合作伙伴维度定义了组织利用与供应商和合作伙伴的战略合作伙伴关系的能力，以推动其 IT 成熟度并引领行业技术变革：\n* **临时**: 依赖第三方提供云能力。合作伙伴拥有并维护云租户\n\
  * **探索**: 第三方提供大部分云能力\n* **定义**: 合作伙伴提供专业知识或技能以交付现代云能力\n* **编排**: 合作伙伴与内部 IT 部门合作提供云能力，同时注重提升技能\n\
  * **转型**: 第三方主要用于人员补充和咨询服务\n\n### 团队构成\n团队构成维度指的是 IT 团队能够与跨职能团队有效协作并分享其专业知识和经验，以便为共同的业务目标做出贡献的能力：\n\
  * **临时**: 团队彼此独立工作，按职能划分，基于本地角色定义形成信息孤岛\n* **探索**: 组织存在云专业知识的局部区域，并进行非正式的跨职能协作\n\
  * **定义**: 正式的跨职能协作，CCoE 提供基础支持\n* **编排**: 团队利用 CCoE 定义的标准、模板和模式，跨职能协作在组织内普遍存在\n\
  * **转型**: 完全自主且自给自足的团队，在技术和流程领域具备专业知识\n\n## 流程支柱\n流程支柱涉及领导力、高管赞助、KPI 衡量和预算分配等维度。本节解释组织如何利用\
  \ CAMM 框架对云采用成熟度进行自我评估。\n\n### 领导力与赞助\n该维度有助于评估组织在进行云转型时领导层的参与度和高管赞助情况。这是决定组织数字化转型成功基调的重要维度：\n\
  * **临时**: 云计划无高管赞助\n* **探索**: 来自业务部门负责人或高级管理层的赞助\n* **定义**: 来自一个或多个 C 级高管的赞助\n*\
  \ **编排**: 对云采用和迁移进行全面的 C 级赞助\n* **转型**: 高管赞助为企业范围内的云优先采用、研发和创新设定基调和步伐\n\n### 衡量\n\
  正如俗话所说，*无法衡量的就无法改进*。衡量是一个关键维度，有助于评估和指导组织如何衡量云计划的成功和成果：\n* **临时**: 云计划无明确的成功标准\n\
  * **探索**: 概念验证和 **最小可行产品** (**MVP**) 工作指导企业探索并充当伪衡量指标\n* **定义**: 通过将生产工作负载部署到云中并实现业务价值来衡量成功成果\n\
  * **编排**: 成功标准作为扩展生产工作负载、运营与关键任务企业应用集成的核心服务的函数来衡量\n* **转型**: 成功标准基于通过转型计划和创新创造的业务价值来衡量\n\
  \n### 预算\n该维度有助于评估组织如何为直接影响和推动业务价值的云计划提供资金并分配财务资源：\n* **临时**: 云计划无明确资金，或企业纯粹基于预计成本节约分配云预算\n\
  * **探索**: 为特定云项目分配部门级预算\n* **定义**: 为特定计划和部分基于云的研发提供专用预算\n* **编排**: 为云优先计划分配预算，减少对本地投资的关注\n\
  * **转型**: 为实现业务价值而对云计划进行隐性预算分配，仅在合理时进行本地投资\n\n## 技术支柱\n技术支柱涵盖 IT 架构、自动化能力、IT 运营、安全、数据管理以及人工智能和机器学习等新兴技术等维度。本节概述组织如何利用\
  \ CAMM 框架对技术支柱中的云采用成熟度进行自我评估。\n\n### 架构\n架构维度评估组织在 IT 成熟度方面的程度，即其如何利用现代云原生架构进行 IT\
  \ 计划：\n* **临时**: 主要为本地单体应用，采用多种技术栈，通常为预期峰值进行配置。\n* **探索**: 大多数工作负载部署在长期运行的虚拟机中。对容器和微服务的实验有限。云中基于容器的负载提供可扩展性优势。\n\
  * **定义**: 生产工作负载部署在容器或无服务器计算上，部分工作负载仍在短期虚拟机上，利用自动扩缩容部分工作负载\n* **编排**: 大多数应用采用基于微服务的架构。定期使用短期虚拟机、容器或基于函数的计算，导致根据应用指标利用自动扩缩容。\n\
  * **转型**: 广泛使用具有弹性、可扩展且一致安全的架构蓝图。在此，您可以利用容器、无服务器函数和优化的虚拟机，并在部署拓扑——本地或云——中一致使用云原生工具。\n\
  \n### 自动化能力\n自动化是关键能力，有助于简化运营、消除错误、改善上市时间并实现成本节约。该维度对于开展云转型的组织至关重要，有助于评估企业的自动化成熟度：\n\
  * **临时**: 手动或不进行云服务配置\n* **探索**: 云服务通过脚本配置，但不存在正式的组织范围流程和标准\n* **定义**: 云服务配置已自动化，但未在项目间一致使用\n\
  * **编排**: 大多数项目团队利用 **基础设施即代码** (**IaC**) 工具来自动化云服务配置\n* **转型**: 一致的 IaC 工具和流程在全企业范围内使用，按\
  \ CCoE 规定\n\n### 运营\n运营维度评估 IT 组织采用现代 DevOps 实践（如 IaC、CI/CD 和 SRE 实践）的能力：\n* **临时**:\
  \ 项目采用传统的代码、构建、测试和部署实践。未建立 CI/CD 流程。应用程序就地更新。\n* **探索**: 缺乏一致的 SRE 实践，CI/CD 工具和流程使用有限。新的发布通过滚动更新交付，需要维护窗口。\n\
  * **定义**: 许多项目团队利用 CI/CD 和 SRE 实践。新的发布与当前版本并行部署，并采用手动切换和回退机制。\n\n\n\n* **编排**: 全组织范围内使用\
  \ SRE 最佳实践和基于项目的 CI/CD。现代 SRE 实践（如金丝雀或蓝绿部署）与随时部署策略相结合。\n* **转型**: 企业范围内拥有标准化且一致的\
  \ SRE 和 CI/CD 工具。 新版本透明且增量发布每天进行多次，无需人工干预。\n\n## 安全\n安全维度有助于评估组织在云中的安全措施及其跟上现代安全威胁的能力：\n\
  * **临时**: 手动进行用户或系统账户配置，身份策略不一致。基础设施安全主要依赖网络防火墙。系统管理员根据临时请求手动管理访问控制。\n* **探索**:\
  \ 集中式组织 IDP，拥有统一的身份、审计和访问策略，但需人工干预。基于网络的安全通过用户身份上下文验证得到增强。访问控制定期审查，但本地和云环境分开。\n\
  * **定义**: 在本地和云基础设施中建立了统一的 IDP 标准，并制定全组织范围的身份、审计和访问控制策略。此时可引入 2FA 或 MFA，并定期进行访问策略和控制审查。\n\
  * **编排**: 跨本地和云环境实现联合身份管理及自动同步，采用 SSO 并强制所有用户使用 2FA/MFA。基于风险的自动化工作流控制访问管理，对网络安全控制的依赖减少。访问策略和控制定期审查和认证，问题得到主动补救。\n\
  * **转型**: 这是用户和服务身份的单一来源，具有完全集中化和自动化的身份和访问控制策略。MFA 和 SSO 已成为企业标准，采用即时权限进行访问管理并提供实时告警。还提供完全集成且自动化的基于风险的访问权限审查，几乎不依赖网络安全，访问由用户身份、上下文和设备管理。\n\
  \n## 数据管理\n数据管理维度有助于评估组织的数据成熟度，因为数据分布在本地和云基础设施中：\n* **临时**: 数据蔓延，数据管理分散，组织几乎不了解数据存储位置。没有手动数据分类。备份在本地或跨站点维护。\n\
  * **探索**: 各部门持有数据并记录模式、敏感性和数据访问策略。存在防止未经授权数据访问的策略。关键应用的数据备份在网络连接设备上实现自动化。\n* **定义**:\
  \ 存在数据清单，并手动维护数据分类和敏感性。有一套集中的策略和控制，但监控有限。大多数云应用的数据备份已自动化，但需人工干预。\n* **编排**: 组织全面了解数据位置、血缘、冗余、分类和敏感性。数据外泄风险通过预防性、检测性和纠正性策略和控制得到缓解。数据备份完全自动化，并提供不可变副本以实现更快恢复。\n\
  * **转型**: 自动化的数据和元数据目录、业务友好的术语表、数据质量指标、数据血缘跟踪、自动化备份和恢复测试，以及具有不可变副本的数据冗余。它提供完全自动化的预防控制、主动监控、异常检测、审计和告警。\n\
  \n## AI/ML\nAI/ML 维度描述了组织采用现代 AI/ML 能力以推进业务目标并引领数字化颠覆的能力：\n* **临时**: AI/ML 不是组织的重点。\n\
  * **探索**: 组织仍处于评估模式。没有正式的全组织标准，各部门构建原型以解决有趣的问题。\n* **定义**: CCoE 制定 AI 愿景并提供系统化的蓝图和指导。组织从概念验证转向将部分\
  \ AI 工作负载投入生产\n* **编排**: 组织倡导将 AI/ML 嵌入应用中，并创建 AI 实践以探索、研究和现代化。\n* **转型**: AI 已成为组织\
  \ DNA 的一部分，多款应用利用 AI 能力改变业务运营方式。组织开始引领这一颠覆。\n\n需要注意的是，CAMM 框架下讨论的维度只是部分核心维度，并不详尽。由于每个企业都是独特的，组织必须努力在人员、流程和技术三大支柱中定义维度和属性，同时确保保持更新。对云成熟度的定期评估对于衡量当前状态并确立目标至关重要。\n\
  \n## Google 的云采用框架 (CAF)\n存在多种云就绪评估框架变体。我个人最喜欢之一是 **Google 的** CAF，因为它建立在人员、流程和技术\
  \ *\\[2\\]* 的黄金三角评分标准之上。这是一个通用的框架，企业可以利用它来评估云成熟度并朝着云优先组织发展。该框架在三个阶段中规定了四个领域，有助于衡量和改进组织的云就绪程度。这是一个有主见的框架，主张在构建云优先组织时，组织必须在四个领域中都表现出色。\n\
  \n### 四个领域\nCAF 定义了四个领域——learn、lead、scale 和 secure——有助于评估和衡量组织的云就绪程度和采用成熟度：\n* **学习**:\
  \ 该支柱描述了组织提供的学习和技能提升计划的范围和水平，以及组织持续学习、提升技能和再培训的能力。该领域还有助于组织了解提供的学习计划的质量以及与第三方供应商和合作伙伴合作通过云推进业务目标的能力。\n\
  * **领导**: 该支柱有助于评估领导层赞助和云转型的自上而下承诺，以及跨职能团队推动云采用举措实现共同业务目标的自下而上动力。\n* **扩展**: 该支柱描述了组织利用云原生架构、托管服务和无服务器产品来抽象基础设施的能力，从而实现无缝扩展同时降低运营开销。\n\
  * **安全**: 该支柱描述了组织利用纵深防御安全模型保护云中应用程序和服务免受未经授权和非请求访问的能力。\n\n### 三个阶段\nCAF 还为组织定义了三个云成熟度阶段——战术、战略和变革：\n\
  * **战术**: 在战术成熟度阶段，组织通常有明确的目标部署单个云工作负载，而没有为未来扩展的更大计划或战略。在此阶段，主要目标是通过云迁移实现特定系统和应用的成本降低。虽然这种方法可能带来快速成果和短期收益，但缺乏可扩展性和创新的必要基础。\n\
  \n![图 4.3 – 战术成熟度阶段的 PPT 对齐](img/B18893_04_3.0.jpg)\n图 4.3 – 战术成熟度阶段的 PPT 对齐\n\n\
  \n\n### 战略\n在战略成熟度阶段，组织由一个涵盖多个工作负载的全面愿景指导。这些工作负载经过精心架构和设计，重点关注未来需求和可扩展性。在此阶段，组织踏上转型之旅，积极将人员和流程纳入其中。IT\
  \ 团队表现出卓越的效率和效能，提升了利用云进行业务运营所带来的业务价值。\n\n![图 4.4 – 战略成熟度阶段的 PPT 对齐](img/B18893_04_4.0.jpg)\n\
  图 4.4 – 战略成熟度阶段的 PPT 对齐\n\n### 变革\n在变革成熟度阶段，组织拥有成熟稳定运行的云运营，并专注于整合从云经验中获得的数据和洞察。组织将云作为战略平台来降低运营开销，使团队能够专注于创新和业务转型。这一技术转变进一步得到人员和流程转型的支持。在战略成熟度阶段，IT\
  \ 已从成本中心演变为战略业务合作伙伴。\n\n![图 4.5 – 变革成熟度阶段的 PPT 对齐](img/B18893_04_5.0.jpg)\n图 4.5\
  \ – 变革成熟度阶段的 PPT 对齐\n\nCAF 可作为组织如何利用框架来评估、衡量和改进其云采用和成熟度的良好示例。然而，随着组织为云转型奠定基础，该框架可以作为一个良好的起点，并可根据特定需求进行定制和演进。在下一节中，我们将回顾企业如何建立和设立\
  \ CCoE 以推进数字化颠覆。\n\n## CCoE\n随着云采用的持续增长，建立 CCoE 成为寻求在数字时代蓬勃发展的企业不可或缺的举措。建立 CCOE\
  \ 是拥抱云计算的企业至关重要的一步。通过提供领导力、治理、架构指导、技能发展、成本优化策略并促进协作，CCoE 使组织能够充分发挥云计算的全部潜力。CCoE\
  \ 确保云计划与组织的整体业务目标保持一致，确保云采用支持公司的愿景、使命和长期目标。通过建立治理政策、指南和控制措施，CCoE 使企业能够有效管理与云相关的风险。它确保符合监管要求、数据保护、安全和隐私标准。更重要的是，CCoE\
  \ 在包括 IT 团队、开发人员、运营和业务部门在内的各利益相关者之间培育知识共享和协作文化，促进跨职能专业知识并加速云技术的采用。\n\n![图 4.6 –\
  \ CCoE 框架](img/B18893_04_6.jpg)\n图 4.6 – CCoE 框架\n\n### CCoE 的关键组成部分\nCCoE 专注于四个主要组成部分——从定义云架构蓝图和最佳实践并促进云技能发展和专业知识，到实施云运营最佳实践和建立云治理：\n\
  \n* **云架构和最佳实践**：\n  * **架构框架**：CCoE 定义云架构框架和参考架构，为设计和部署云解决方案提供指导。这些框架必须考虑可扩展性、可用性、安全性和性能，以确保基于云的应用程序和基础设施的成功实施。\n\
  \  * **最佳实践**：CCoE 识别并推广云采用各个方面的最佳实践，包括云迁移策略、应用程序开发方法、基础设施管理和安全协议。它促进持续改进并鼓励采用业界认可的标准和框架。\n\
  * **技能发展**：\n  * **云培训计划**：CCoE 开发并提供培训计划，以教育员工了解云计算概念、技术和服务。它提供认证、工作坊和学习资源，以提升组织内云知识和技能。\n\
  \  * **技能评估与发展**：CCoE 进行技能评估以识别技能差距和改进领域。它与人力资源和培训团队合作制定有针对性的技能发展计划，并为员工提供在云架构、安全、DevOps、数据分析以及高级技能如\
  \ AI/ML 方面提升技能的资源。\n* **云运营**：\n  * **成本优化策略**：CCoE 实施成本优化策略以有效管理云支出。它利用资源利用率监控工具，识别诸如\
  \ rightsizing 实例、预留实例和 Spot 实例等成本节约机会，并建立预算分配和跟踪政策。\n  * **财务治理**：CCoE 开发财务治理框架以确保云支出方面的财务问责和控制。它建立成本分摊、预算管理和利用云资源的内部部门或项目的分摊机制流程。\n\
  * **云治理**：\n  * **领导力赞助**：成功的 CCoE 需要强大的高层赞助来推动云采用并确保与业务目标保持一致。高层领导必须担任执行赞助人，提供指导、支持决策并在整个组织中倡导云的好处。\n\
  \  * **治理框架**：建立企业范围的治理政策、标准和控制措施以管理与云相关的风险是 CCoE 的主要职责之一。它定义角色和职责，建立决策流程，并确保符合监管要求和行业最佳实践。\n\
  \n随着组织在云环境的复杂性中航行，CCoE 成为精心策划和成功的云采用和数字化转型的战略驱动力。CCoE 为组织在云中实现长期成功和创新奠定基础，同时最大限度地降低风险。\n\
  \n# 为云就绪企业奠定基础\n数字化转型涉及随着云计算等新技术的不断发展而重新构想企业内部的 IT 流程和技术团队。在传统的 IT 环境中，典型的 **软件开发生命周期**\
  \ (**SDLC**) 实践，如瀑布方法，在开发、测试、安全和运营的独立团队中已足够。然而，随着业务需求和云计算等技术的快速发展，技术组织面临着在竞争环境中蓬勃发展所需的苛刻上市速度和\
  \ IT 敏捷性，并需要在软件工程实践中进行根本性的文化转变。DevSecOps 是现代企业成功 IT 管理的关键，它清楚地说明了开发、安全和运营之间的紧密相互依赖性。正如我们讨论的黄金三角在数字化转型中的关键作用，了解企业需要在人员、流程和技术这三个方面采用的范式转变非常重要。让我们回顾一些企业可以利用的最佳实践，以为云就绪组织建立坚实的基础。\n\
  \n## 初创心态\n\n\n\n虽然企业完全复制初创公司文化的各个方面并不总是可行或理想，但采用初创公司思维可以为组织提供在快速变化的商业环境中蓬勃发展所需的敏捷性、创新性和以客户为中心。它使企业能够拥抱变化，承担经过计算的风险，并抓住增长和转型的机会。初创公司通常通过引入新的商业模式、产品和服务来颠覆成熟行业。它们倾向于优先理解客户需求并提供价值，在快节奏的环境中运营，吸引顶尖人才，并优先考虑学习和实验。采用初创公司思维运营的企业可以主动识别并利用新兴机会，相对于更传统的同行获得竞争优势。为了以初创公司思维运营，企业可以采取以下几个步骤在整个组织中培养这种文化：\n\
  * **创业者思维**：鼓励员工像企业家一样思考将促进自主性、主人翁意识和承担风险的意愿。创造一个支持快速实验、快速失败以及从失败中学习的环境，对数字化转型可以产生巨大的积极影响。\n\
  * **以客户为中心**：每个举措或项目都必须高度强调理解客户需求和偏好。实施客户反馈循环、开展用户研究以及让客户参与产品开发过程将确保与业务和市场需求保持一致。\n\
  * **扁平化组织结构**：减少层级结构并培养更扁平的组织层级，促进开放沟通和快速决策，同时也赋予员工贡献其想法和专业知识的能力。\n* **流程简化**：大多数组织在拥抱新技术时未能做到的就是审视可以被淘汰的现有流程。新方法和功能往往因现有流程的压力而受阻，而这些流程是为不同的问题陈述而设计的。识别并消除阻碍决策的官僚流程、简化审批工作流程，以及在预定义边界内授权员工自主决策，可以对员工生产力和运营效率产生放大影响。\n\
  * **敏捷项目管理**：实施 Scrum、Kanban、精益开发、Crystal 或极限编程等敏捷项目管理方法，以促进灵活性、适应性和增量进展，可以实现更短的开发周期、更频繁的反馈循环以及快速转型的能力。\n\
  * **增量价值交付**：传统上，企业应用以全有或全无的方式交付。初创公司思维将增加对行动和成果的偏向，以便更快地交付增量价值和最小可行产品，并迅速纳入反馈。\n\
  \n## 一切皆产品\n在传统的 IT 中，组织倾向于关注技术基础设施、维护、提供技术服务以及满足内部利益相关者的需求，优先考虑技术要求和限制而非用户需求。更重要的是，IT\
  \ 在孤岛中运作，对技术如何与更广泛的业务目标保持一致缺乏深入理解，其主要目标是维护和支持现有系统，而非主动寻求改进它们的方式。与之相反，产品思维更强调以用户为中心，为终端用户或客户提供价值。它帮助组织通过定义产品愿景、优先考虑功能并确保与业务目标和用户需求保持一致来拥抱产品所有权。它优先考虑理解用户需求、设计直观的用户体验，并根据用户反馈持续改进产品。以下是企业在数字化转型中培养产品思维可以利用的一些关键原则：\n\
  * **产品愿景**：*一切皆产品* 的思维方式能够建立清晰的产品愿景，并确定云转型应交付的期望成果、利益和价值，使其与整体业务目标保持一致。\n* **以用户为中心**：产品思维的主要目标是以用户为中心的设计，在设计和开发基于云的解决方案时优先考虑终端用户的需求和要求。产品思维有助于更深入地了解用户画像、开展用户研究并收集反馈，以确保解决方案与用户期望保持一致并提供无缝体验。\n\
  * **产品所有权和价值交付**：企业应指定产品负责人或产品经理，负责推动云转型计划。产品负责人必须深入了解业务和技术方面，并作为客户和利益相关者的倡导者，识别云采用的最高价值领域，并根据其潜在影响和可行性对其进行优先排序。这有助于组织专注于尽早、频繁地交付增量价值，解决关键的业务需求和痛点。\n\
  * **MVPs**：在数字原生云转型中，尤其是在组织大规模创新的情况下，并非总是可以预测和规划。产品思维强调构建和交付 MVP 以验证假设、测试假设并在云转型过程早期收集反馈的概念。这种方法允许更快地学习，减少浪费，并确保资源集中于提供价值。\n\
  * **构思、迭代和创新**：采用迭代和敏捷的方法来构建和改进云服务，促进整个云转型旅程中持续改进和实验的文化。这鼓励团队尝试不同的云服务、架构和技术，以确定最适合企业特定需求的解决方案。这涉及将云解决方案分解为更小、可管理的增量，并根据用户反馈和不断变化的业务需求持续迭代和完善。\n\
  \n## 平台即产品\n采用产品思维方法，企业可以开始设计、架构和开发优秀的产品。然而，一切都归结于这些产品交付的速度。在动态的商业环境中，上市速度是保持竞争力和获得市场份额的关键。DevOps\
  \ 通过整合开发和运营统一了 SDLC，获得了流程可扩展性并权衡了复杂性。采用 *你构建它，你运行它* 的思维方式，随着更多产品采用更现代的技术和工具推出，尤其是在云原生时代，开发者的复杂性变得呈指数级增长。例如，在诸如十二要素应用和云原生十五要素等方法中，开发人员必须学习如何编码、构建、测试、发布、部署、运营、监控，并掌握支持\
  \ DevOps 生命周期各个方面的众多工具。Spotify、Netflix 和 Uber 等多个组织通过开发一个 *平台* 来克服这一挑战，该平台可以帮助自动化\
  \ SDLC，从而催生了现代的 *平台工程* 趋势。在 Gartner 的敏捷和 DevOps  hype cycle 中，平台工程被视为云原生环境中的自然演进。\n\
  \n根据 `www.platformengineering.org`，“*Platform engineering is the discipline of designing\
  \ and building toolchains and workflows that enable self-service capabilities for\
  \ software engineering organizations in the cloud-native **era.***” [*3*]\n\n##\
  \ 内部开发者平台\n\n\n\n\n平台工程师通常会构建一个平台，能够满足整个软件开发生命周期（SDLC）中最常见和运营上的需求，避免重复造轮子。这通常被称为\
  \ IDP。为什么它被称为 IDP？每个 IDP 都应根据技术选型、架构模式、安全控制和蓝图为每个企业量身定制，因此具有独特性。在传统的 IT 系统中，存在一个名为\
  \ *系统管理员* 的传统角色，通常是管理应用程序或软件运营的守门人。开发人员通常开发软件应用程序，然后将其 *扔过栅栏* 给系统管理员进行部署和运营，导致双方体验都很差。\n\
  \n平台工程的目标是开发和维护一个 IDP，从而抽象掉运营和管理软件与基础设施层下方的复杂性。采用 *一切皆产品* 的方法，IDP 必须被视为一种产品，其消费者或利益相关者是产品团队。IDP\
  \ 的主要目标是提供一个自助服务平台，使技术团队能够交互并自助获取运行其应用程序所需的基础设施，通过将交付产品所需的工具链粘合在一起使技术栈标准化，减少变异性，并自动化基础设施交付：\n\
  \n![图 4.7 – IDP 的层级与交互](img/B18893_04_7.jpg)\n\n图 4.7 – IDP 的层级与交互\n\nIDP 定义了三个不同的层级——后端基础设施、平台和自助服务——以抽象底层基础设施，从而简化并普及访问：\n\
  \n*   **后端基础设施层**：这是平台工程团队将支持的最基础层级。这涉及平台和厂商选型，是否支持混合云或多云架构的决策，在安全、合规和企业目标维度上创建经批准、授权和支持的服务矩阵，以及管理所选平台相关的维护、扩展和\
  \ FinOps。平台工程还需要定期审查、发布、评估并启用云厂商提供的最新技术和功能。\n\n*   **平台层**：这是核心抽象层，有助于规范化 DevSecOps\
  \ 功能，而不论底层基础设施选择如何。该层级的目标是自动化和简化基础设施管理，并制定最佳实践，使产品团队能够更快地实施解决方案，而无需在 DevSecOps 方面重复造轮子。例如，该层级将为产品团队在软件架构框架、服务编排、CI/CD\
  \ 流水线、安全控制和可观测性方面的选择提供明确的观点。\n\n*   **自助服务层**：自助服务层是产品团队开展云计划时的主要接口。理想的自助服务层将提供用户体验和\
  \ API，帮助企业各产品团队配置沙箱、研发测试床，甚至生产级环境。通过统一的平台方法，产品团队可以交付能够无缝与其他产品交互的解决方案，同时快速开发和迭代，从而实现运营效率和上市速度。\n\
  \n# 专注于 CUJ\n\n在敏捷开发方法论中，用户故事是许多组织用于软件开发和用户体验设计的基础组件。用户故事通常限定在单个开发迭代或冲刺范围内，这有助于将较大的功能或功能性分解为更小、可管理的任务单元，并主要指导开发团队实施特定的功能或功能性。另一方面，CUJ\
  \ 采用更广阔的视角，提供用户旅程的端到端视图。它们涵盖多个用户故事，并在不同的触点和交互中捕捉完整的端到端用户体验。但为什么 CUJ 很重要？在产品——通常被称为\
  \ **服务等级目标**（**SLOs**）——并根据服务的健康状况配置警报。这是确保 CUJ 成功并可作为进一步改进反馈循环的关键步骤。\n\n采用 CUJ\
  \ 方法进行应用程序和产品开发，增强了组织以客户和用户为中心、提供无缝客户体验的能力。\n\n## 拥抱云中的开源\n\n\n\n云本质上是由开源软件（`OSS`）和开放标准构建并驱动的。一些构成云平台基础的流行开源软件包括\
  \ Linux、KVM、Kubernetes、Docker、Nginx、PostgreSQL、Git、Jenkins、Apache Kafka、TensorFlow，以及开放标准如\
  \ HTTP、TCP/IP、REST、SSL/TLS、ANSI、XML、JDBC、AMQP、SAML、JSON、MQTT 等。日益增长的是，大多数云服务提供商要么参与其中，要么为开源软件和开放标准做出贡献，例如\
  \ CNCF、OASIS 和 CSA。如果云建立在开源之上，企业是否应该在其应用程序上构建开源软件？简单的答案是肯定的。有几个令人信服的理由，例如成本效益、灵活性、供应商中立性、充满活力的社区支持和互操作性，企业应考虑在云上基于开源软件和标准构建\
  \ IT 基础。然而，在企业用例的背景下，选择并不总是容易的。虽然利用开源技术有巨大的优势，其中两个主要动机是由于避免许可或订阅费用而带来的前期成本节约以及防止供应商锁定，但企业必须注意一些考虑因素，例如与\
  \ OSS 定制、实施和维护相关的成本、对社区支持的依赖、熟练资源的可用性，以及可扩展性、安全性和性能要求。\n\n自建与购买现成解决方案之间始终存在激烈的争论。只要企业对其优势有自我认知，并且其决策与整体愿景保持一致，就没有哪种方法更好或更差。*理解企业基因至关重要*。在我担任企业架构师的职责中，我曾遇到一家财富\
  \ 100 强零售企业，它更倾向于商业现成（`COTS`）和托管服务产品，使其精简的 IT 部门能够花费更多时间和精力解决业务需求，同时将软件维护、支持、功能发布、安全性和合规性外包。这完全契合其组织的基因。在光谱的另一端，另一家财富\
  \ 100 强企业强烈偏好从头构建并利用开源软件。虽然这种策略使他们能够灵活地定制、定制并构建适合其需求的功能，但他们需要在 IT 和维护方面进行大量投资。\n\
  \n正如我们在上一章讨论的那样，企业必须努力降低供应商锁定风险，但在大多数情况下无法完全避免。在构建与购买之间取得正确的平衡对于数字化转型成功至关重要。当企业选择云提供商时也必须引起共鸣。构建支持开放标准的软件和应用程序比开源与闭源软件的选择更为关键，因为它有助于互操作性。例如，组织\
  \ A 可以选择 COTS B2B 软件与供应商发送和接收采购订单和发票，而组织 B 倾向于使用开源技术构建 B2B 软件。这里的关键考虑是确保采用开放标准，例如\
  \ EDI。在云术语中，企业可以考虑以下因素来驾驭供应商中立性和互操作性优势：\n\n* **可移植性的通用平台**：而不是直接在供应商平台或服务架构上构建，企业可以通过构建基于开源和开放标准、可以在任何地方运行的通用平台基础来获得长期利益。这可以成为企业在任何目标平台或基础设施上运行应用程序和服务的绝佳混合云和多云策略。\n\
  \n* **云提供商选择**：企业可以通过选择投资并采用开源和开放标准的云提供商来避免供应商锁定。例如，利用云提供商的托管服务本身并不构成锁定，只要该服务建立在未分叉的开源软件上并基于开放标准。利用这一点，企业可以构建无缝的退出策略。\n\
  \n* **云无关架构**：基于开放标准（如 IaC、微服务和开放 API）设计基础设施、应用程序和服务可以实现无缝的可移植性和互操作性，并有助于供应商中立。\n\
  \n拥抱开源和开放标准是企业踏上云转型之旅时的自然设计选择，因为云基础建立在开源之上。它使组织能够获得关键能力，包括应用程序可移植性和互操作性，同时降低供应商锁定风险。\n\
  \n# 摘要\n在本章中，我们讨论了如何为云优先企业构建坚实的基础，以及如何在组织内的人、流程和技术职能中拥抱和管理变革。我们回顾了云采用成熟度模型和可定制以评估、衡量和改进企业云成熟度的成熟度评估框架。我们还探讨了如何构想和建立\
  \ CCoE，使其作为组织内的中央实体，为云架构和运营最佳实践提供建议和倡导，以确保云采用成功并降低风险。\n\n然后，我们讨论了企业如何通过拥抱创业心态、产品思维和平台工程来为云转型构建稳健的基础。我们还阐述了设计思维如何通过利用\
  \ CUJs 等框架帮助组织以客户为中心进行创新。最后，我们探讨了基于开源和开放标准制定云战略的好处。\n\n在下一章中，我们将探讨企业可以利用的各种云转型旅程和策略，以实现\
  \ IT 现代化和创新。\n\n# 延伸阅读\n本章使用的参考资料以及一些额外资源如下列出：\n\n1. [`cio-wiki.org/wiki/Leavitt%27s_Alignment_Model`](https://cio-wiki.org/wiki/Leavitt%27s_Alignment_Model)\n\
  2. [`services.google.com/fh/files/misc/google_cloud_adoption_framework_whitepaper.pdf`](https://services.google.com/fh/files/misc/google_cloud_adoption_framework_whitepaper.pdf)\n\
  3. [`platformengineering.org/blog/what-is-platform-engineering#:~:text=Platform%20engineering%20is%20the%20discipline,in%20the%20cloud%2Dnative%20era`](https://platformengineering.org/blog/what-is-platform-engineering#:~:text=Platform%20engineering%20is%20the%20discipline,in%20the%20cloud%2Dnative%20era)\n"
- '## 5 企业迈向云转型的旅程




  云计算已被证明是企业在多个维度实现数字化转型的引擎，其动力源于创新和竞争的渴望。如我们在 *第 4 章**，构建现代企业的基石* 中探讨的那样，云转型可以为企业带来诸多益处，包括增强灵活性、可靠性、提升运营韧性、降低
  IT 成本并推动创新。然而，通往云端的旅程并非一刀切的过程，因为每个企业都踏上独特的征程，受其特定目标、挑战和组织文化的影响。企业通往云端的旅程是一个高度个性化的过程，受多种因素影响，例如现有的
  IT 格局、行业法规、组织文化、时机和市场需求。云之旅还取决于企业的成熟度水平。根据具体的业务目标和成熟度水平，一些企业可能会优先考虑成本削减，并寻求将基础设施迁移到云端以实现运营效率，而其他企业则可能专注于利用云的弹性和灵活性来推动创新并引领数字化颠覆。在本章中，我们将探讨企业面临的各种云之旅，包括以下内容：


  * 使用多维度价值-复杂性矩阵挑选合适的云计划

  * 各种企业云转型之旅

  * 迁移工作负载到云时的策略

  * 混合云策略

  * 通过新兴技术在云中创新


  # 使用多维度价值-复杂性矩阵挑选合适的云计划


  在上一章中，我们讨论了组织可以采用的各种策略来构建现代云就绪企业的基石，以及用于评估云成熟度的云就绪评估框架。企业云之旅中最关键的步骤之一是为云选择合适的工作负载。组织可以利用多种不同的策略在云中迁移或构建应用程序。然而，选择合适的工作负载至关重要——尤其是如果这是组织首次涉足云端——以确保数字化转型的成功。在本节中，我们将探讨企业可以利用的多维度价值矩阵作为工具，帮助为云之旅挑选合适的工作负载。在传统方法中，组织通常使用衡量价值与复杂性比率的价值-复杂性矩阵来评估合适的工作负载。多维度价值-复杂性矩阵方法允许采用更全面的方法，在多个维度上评估价值和复杂性。图
  5.1 中的价值-复杂性矩阵显示了各种项目根据感知价值和复杂性绘制的图表，其中气泡大小代表项目的 **净现值** (`NPV`)：


  ![图 5.1 – 价值复杂性矩阵](img/B18893_05_1.jpg)


  图 5.1 – 价值复杂性矩阵


  在 `Y` 轴上绘制复杂性因素，在 `X` 轴上绘制业务价值要素，同时以气泡大小代表一项计划或项目的 `NPV`，可以全面了解哪些计划最适合云。在每个企业成熟度水平上，DNA
  和感知的业务价值都是独特的，建立价值-复杂性矩阵以挑选出能产生正确业务价值回报的工作负载至关重要。例如，多维度因素，如工作负载的业务关键性、与其他企业系统的互依赖性、安全考虑、数据主权、许可、迁移或实施所需的工作量以及成本，都可能决定特定计划或工作负载的复杂性。同样，通过创新、上市速度、总拥有成本、进入新市场、增强性能以及改善客户
  **满意度和可持续性**（基于 `ESG` 框架）实现的价值，凸显了业务价值效益。我们将在 *第 11 章**，ESG 和可持续性* 中更详细地介绍 `ESG`
  和可持续性。最后，企业评估可归因于云计划的业务价值实现的 `NPV` 可能是一个明智的做法。


  让我们回顾复杂性和业务价值因素，以及企业如何对这些要素进行评分。


  ## 复杂性因素


  **复杂性因素** 定义了任何云计划所涉及的复杂性和风险。这些因素可能包括诸如应用程序架构复杂性、上游或下游系统的互依赖性、时间、工作量和成本复杂性等。由于企业环境中的每个云计划都可能独一无二，组织可以定制这些复杂性因素。然而，以下是一些需要考虑的复杂性因素：


  * **业务关键性**：这代表根据业务影响评估和分类工作负载或应用程序的过程。这可能受应用程序的各种属性影响，例如其收入产生影响、业务连续性、客户影响、**恢复时间目标**
  (`RTO`)、**恢复点目标** (`RPO`) 和风险状况。根据这些属性，应用程序、计划或工作负载可以被归类为任务关键型、重要型、重要或辅助型。考虑到应用程序的业务关键性很重要，因为任何中断或停机都可能对业务造成不利影响。


  * **互依赖性**：应用程序互依赖性构成了另一个关键的复杂性因素，在云迁移中经常被误解，无论是由于随着时间的推移的有机增长还是缺乏文档。一个任务关键型应用程序可能拥有数十甚至数百个来自上游和下游系统的集成，这可能增加其复杂性。了解并对应用程序的互依赖性进行评分并相应分类至关重要。


  * **安全**：在云转型中需要考虑的另一个关键因素是应用程序的安全态势。这可能涉及数据安全、网络安全、访问控制和 Web 应用程序防火墙。面向内部的应用程序的安全考虑可能与其面向外部的对应物截然不同。


  * **数据主权**：由于数据的广泛收集和处理、对隐私和安全的担忧以及遵守各种数据保护法规的需求，数据主权变得越来越重要。确保遵守适用的数据保护法律并了解数据驻留的法律影响，对于维护应用程序的数据主权至关重要。这是一个重要的复杂性因素，需要考虑以维护应用程序的完整性和合规性。


  * **许可和支持**：另一个关键的复杂性，尤其与云 lift and shift 迁移相关的是所考虑的应用程序或软件的许可和支持考虑。某些应用程序和软件供应商已授权并支持他们将持续提供支持的云平台。企业也必须探索替代策略，例如应用程序重构、市场可用性等。


  * **工作量**：在云转型中最重要的考虑因素是实施或迁移解决方案到云所需的工作量。开展首个云计划的企业必须确保工作负载并非极其任务关键且不需要大量工作。




  ## 治理与运营

  治理和运营方面的考虑，例如应用正常运行时间、可用性、SLA、SLO、网络架构以及监控和发布管理，对于确保关键应用的 disruptions 保持在最低限度至关重要。另一个重要考虑因素是，云环境中应用的运营和治理可能与传统的本地部署设置有显著不同。


  在回顾了复杂性因素之后，让我们回顾业务价值因素。


  ## 业务价值因素

  业务价值因素定义了组织可从云计划中实现的 perceived value。这些因素可能包括组织的创新速度、提供现代能力、上市时间、性能改进以及总拥有成本的降低，等等。以下是一些需要考虑的业务价值因素：


  ### 创新

  衡量创新的价值至关重要，但也具有挑战性，因为创新的价值不易量化，且通常涉及定性和长期成果。然而，企业可以利用多个关键指标和度量来评估创新工作的价值，例如盈利能力提升、客户反馈和满意度、专利和知识产权申请、社会影响评分以及市场份额。


  ### 总拥有成本（TCO）

  评估云计划潜在业务价值的另一个关键指标是 TCO。全面的 TCO 和 ROI 评估可以为选择合适的 workload 或项目指明方向。


  ### 应用性能

  诸如应用可扩展性、弹性、性能、可用性和易用性等性能考虑因素会直接影响业务价值。例如，零售电商网站是经典示例，也是客户体验的可靠衡量标准，因为网站的性能和易用性可以带来转化率提升，以及网站的可扩展性，这两者在季节性高峰期间同等重要。


  ### 客户满意度

  客户满意度评分是评估云计划业务价值和影响的另一个关键要素。这可能包括客户服务、访问便捷性、联系中心自动化、忠诚度计划、沉浸式体验、个性化服务或产品推荐、无缝全渠道体验等方面的增量改进。已识别
  workload 的 CSAT 评分可以决定该计划的业务价值。


  ### 环境、社会和治理（ESG）

  云计划的 ESG 评分可通过定性和定量指标的组合来衡量。为了衡量 ESG 评分，企业可以创建定制框架或采用专业评级机构提供的现有 ESG 评级方法。这些方法通常使用来自公开披露、报告和独立评估的数据组合。例如，环境影响可通过可再生能源驱动的节能技术、应用的碳足迹以及认可机构颁发的绿色认证来衡量。同样，社会因素可通过数据隐私和安全标准（如
  GDPR 合规性）、劳动实践、供应链责任和可访问性来衡量。同样，数据治理、透明度以及遵守道德标准和法规等治理指标也会直接影响 ESG 评分并带来业务价值。


  重要的是要理解这些是方向性的业务价值因素，组织必须根据业务背景仔细选择和定制它们。现在我们已经回顾了各种业务价值因素，让我们看看如何为所选的云计划定义和评估净现值。


  ## 净现值

  财务可行性对每个计划都至关重要，也适用于云转型。企业普遍的抱怨是未能评估和评价财务可行性，这可能对数字化转型工作造成不利影响。计算云计划的净现值涉及估算该计划在其生命周期内相关的预期现金流，并使用适当的折现率将其折现为现值。这包括估算现金流、确定净现值以及进行敏感性分析。在现金流估算中，重要的是同时考虑初始投资（例如迁移成本和设置成本）和持续运营成本（例如订阅费和维护成本）。净现值评估超出了本书范围。在价值-复杂性矩阵中，气泡大小代表云
  workload 或计划的净现值。气泡越大代表净现值评分越好，负净现值应被忽略，因为它们在财务上不可行。对于负净现值计划，必须考虑替代策略。


  一旦确定了复杂性和业务价值因素，企业可以利用评分框架为每个已识别的 workload 或计划中的每个因素进行评分。累计得分构成 workload 的整体复杂性和业务价值。通常，具有云卓越中心（CCoE）实践的组织负责制定框架和指导，以确保企业范围内评分的一致性。以下是一些有助于评估所考虑
  workload 复杂性和业务价值的问题：


  | 序号 | 评估主题 | 影响领域 |

  | --- | --- | --- |

  | 1 | 应用基础设施是否需要即将到来的硬件更新？ | TCO/ROI |

  | 2 | 与本地部署相比，云中运行该应用的成本是否显著更低？ | TCO/ROI |

  | 3 | 该应用是否能从云原生规模、可用性、弹性以及灾难恢复中受益？ | 性能 |

  | 4 | 该应用是否能从显著提升性能的云原生服务中受益？ | 性能 |

  | 5 | 该应用的业务关键性如何？ | 业务关键性 |

  | 6 | 该应用是面向外部（客户）还是面向内部（企业）？ | 业务关键性 |

  | 7 | 该应用有多少集成/依赖？ | 互依赖性 |

  | 8 | 该应用是否有清晰、最新的架构文档？ | 工作量 |

  | 9 | 该 workload 的运营要求（SLA、SLO）是什么？ | 治理 |

  | 10 | 该 workload 是否有任何法律、监管或合规要求？ | 安全、数据主权 |

  | 11 | 该应用的延迟敏感性如何？ | 治理、业务关键性 |

  | 12 | 该应用是否可移植？该应用是否能从在云原生平台上运行中受益？ | 工作量 |

  | 13 | 应用数据是否受数据驻留或其他隐私法规管辖？ | 数据主权 |

  | 14 | 该应用是否有许可和支持要求（COTS 应用、遗留系统、开源）？ | 许可和支持 |

  | 15 | 该应用是否能从重新托管、再平台化、重新采购或重构中受益？ | 工作量 |

  | 16 | 应用迁移是否存在时间敏感性（许可续期、数据中心退出、合同义务等）？ | 许可和支持、工作量、互依赖性 |

  | 17 | 该应用是否有特定的硬件依赖？ | 互依赖性 |

  | 18 | IT 团队是否具备所需的技能和资源进行迁移？ | 工作量 |


  表 5.1 – 云 workload 复杂性和业务价值评估




  在评估了复杂度和业务价值因素后，必须对各个维度进行单独评分，以得出复杂度和业务价值的累计得分。重要的是要为各种复杂度和业务价值维度采用加权评分机制，因为并非所有维度都相等。例如，在特定的业务环境中，安全复杂性因素可能需要更高的权重，而
  TCO 业务价值维度可能需要相对较低的权重。


  ![图 5.2 – 对复杂度和业务价值维度进行评分](img/B18893_05_2.jpg)

  图 5.2 – 对复杂度和业务价值维度进行评分


  利用这一框架，企业可以选择通过云转型能够带来最佳业务价值的合适工作负载。在迁移之前，评估工作负载的价值和复杂性非常重要。例如，选择第四象限（高价值、低复杂度）的工作负载作为云迁移的首个工作负载似乎是不言而喻的决定。然而，该工作负载可能极其关键，迁移、切换和时间线相关的风险可能超过业务价值。相反，迁移一个辅助且不常用的应用程序将难以证明其价值。获得一些早期成果至关重要，尤其是在第一次云转型之旅中；因此，经验法则是选择对业务至关重要、提供显著业务价值、正的净现值（NPV）且相对复杂度较低的工作负载。


  在下一节中，我们将探讨企业可以考虑的各种云转型之旅以及每种方法的利弊。


  # 企业云转型之旅


  每个企业的上云之旅都是独一无二的，并由特定的业务目标指导。企业云之旅可能与组织本身一样多样化。每段旅程的独特性受技术目标、行业特定挑战、文化准备度以及创新愿望等因素影响。总体而言，主要有三种云转型之旅：


  * 现代化本地部署应用

  * 优化本地数据中心

  * 云原生诞生


  让我们踏上这些云转型之旅并探索它们。


  ## 现代化本地部署应用


  这是最常见的云之旅，因为大多数企业拥有包含遗留系统和应用的传统数据中心和 IT 资产。成熟的组织选择云之旅来现代化现有应用，以提高敏捷性、可扩展性和成本效率。企业可以根据既定的业务目标采用多种策略来现代化本地
  IT 环境。让我们考虑一些场景。


  ### 数据中心退出


  数据中心退出云之旅是寻求优化运营、现代化应用、降低成本并提高可扩展性的企业的战略决策。通过将本地数据中心迁移到云端，组织可以利用更快的应用程序部署、弹性资源分配和改进的灾难恢复能力。一些企业选择数据中心退出作为从传统数据中心迁移并在云端现代化的策略。这可能源于多种原因，例如组织希望专注于业务功能并退出数据中心业务、数据中心运营成本高昂、即将进行大规模硬件更新，以及托管解决方案情况下的数据中心租约续签、收购、剥离等。无论理由如何，企业都可以利用这一机会在云端现代化应用。成功的数据中心退出云之旅需要周密的规划和执行。企业必须评估其当前的基础设施和应用程序，以确定最佳迁移方法，同时考虑时间、努力和复杂性之间的平衡——无论是重新托管、就地迁移、重构还是重新采购。这使组织能够获得云的优势，例如可扩展性、灵活性、成本优化以及访问尖端技术。虽然旅程可能带来挑战，但周密的规划、遵循最佳实践以及与云服务提供商的合作可以帮助企业成功完成数据中心退出。通过拥抱云，企业能够在快速变化的数字环境中蓬勃发展，并保持对未来创新的适应性。以下是关于数据中心退出的一些考虑因素：


  * **优点**：数据中心退出使组织能够重组和重新构想 IT 格局并为创新奠定基础

  * **缺点**：典型的数据中心退出可能复杂而繁琐，因此需要仔细评估、规划和协作


  数据中心退出通常是企业的战略性且大胆的选择，也体现了领导层对未来的承诺和愿景。更重要的是，它使组织能够专注于核心业务，而不是拥有和运营 IT 数据中心。


  ### 迁移并转移应用


  将应用迁移并转移到云端的旅程是企业在最大限度减少干扰的同时快速拥抱云计算的宝贵策略。通过将应用程序原样迁移到云端，企业可以获得即时收益，例如可扩展性、成本效益和改进的访问性。迁移并转移迁移策略涉及以最少更改将工作负载从本地数据中心迁移到云端。在这种方法中，应用程序的底层架构、代码库和功能基本保持不变。目标是快速将应用程序过渡到云端，而无需广泛的重构或重构，从而减少迁移复杂性和停机时间。通过将应用程序原样迁移到云端，企业可以实现诸如改进的访问性、可扩展性和降低维护成本等即时收益。这种迁移策略是迈向更全面云采用的垫脚石，与其他迁移方法相比可提供更快的投资回报率。以下是迁移并转移方法的利弊：


  * **优点**：迁移并转移策略使企业能够以极少的更改快速将应用程序迁移到云端

  * **缺点**：迁移并转移策略无法充分利用云原生能力，可能导致价值实现不佳


  通常被认为是对云的快速而粗糙的方法，迁移并转移策略使组织能够快速迁移到云端，利用云能力，同时允许分阶段转型。


  ### 升级到 SaaS




  ## 升级到 SaaS 云旅程

  升级到 SaaS 云的旅程代表了企业的一次变革性转变，使其能够获得灵活、可扩展且成本高效的软件解决方案。通过采用 SaaS，组织可以专注于核心业务活动，同时将软件更新、维护和安全交给云服务提供商负责。企业可能会出于业务转型的需求选择此策略，因为现有应用无法应对增长或创新、提供新功能，以及缺乏现有的应用路线图。升级到
  SaaS 涉及从传统的本地软件安装转向基于 Web 的订阅式解决方案，使组织能够利用多样化的云原生应用。虽然采用 SaaS 带来诸多益处，但围绕数据迁移、集成和治理制定策略至关重要。在组织将应用升级到
  SaaS 时，以下是一些需要考虑的事项：

  - **Pros**：采用 SaaS 可提供多项即时益处，例如根据用户需求进行扩展、内置业务连续性计划、降低维护工作量、访问现代技术，以及改善可访问性和协作

  - **Cons**：SaaS 可能会强制限制定制，企业必须围绕应用集成、数据访问和迁移制定明确的策略

  除其带来的益处外，升级到 SaaS 对于精简 IT 团队的组织而言也可能极具优势。


  ## 在云上重新架构

  企业可利用的另一项常见现代化应用策略是在云上重新架构应用。在云上重新架构应用是一项战略举措，使组织能够充分发挥云平台的全部潜力。这是一个全面的过程，超越了简单的迁移和搬迁，涉及将单体应用拆分为更小、模块化的微服务，以便独立部署和管理。通过采用云原生实践，组织可以优化性能、增强可扩展性并简化运营。以下是重新架构云上应用的一些利弊：

  - **Pros**：重新架构的应用可实现动态扩展、弹性、资源效率、成本节约和创新

  - **Cons**：重新架构应用需要深入了解应用架构、依赖关系和 IT 技能，以及大量的时间和资源

  除了利弊之外，重新架构应用还能让企业从零开始，重新构想未来的应用。


  ## 优化本地数据中心

  随着企业越来越多地采用云计算以获得敏捷性、可扩展性和成本效益，优化现有本地数据中心可能成为关键要素。能够将本地基础设施与云服务集成，使组织能够在最大限度减少对持续运营干扰的同时，兼顾两者的优势。本地数据中心多年来一直是企业
  IT 基础设施的支柱，提供控制、隐私和直接访问数据。它们是关键任务应用的基础，确保低延迟运行并遵守特定的监管和合规要求。然而，本地环境通常未针对云规模的扩展性、灵活性以及技术进步进行优化。企业可以利用多种策略来优化本地数据中心。让我们来看看。


  ### 构建私有云

  构建私有云涉及将传统的本地数据中心战略性地转变为动态且以自助服务为导向的云环境。这包括通过虚拟化和软件定义技术现代化基础设施，实现资源的自动化配置和管理。私有云之旅为企业提供了一个变革性的机会，使其能够在数据中心内实现云计算的优势，同时保持控制和灵活性，与遗留应用共存，并符合数据驻留或合规需求之间取得平衡。通过踏上这段旅程，组织可以现代化其
  IT 基础设施、优化资源利用并促进应用部署的敏捷性。以下是利弊：

  - **Pros**：私有云为企业提供灵活性，可根据特定需求定制针对性能优化的云环境，提供对数据主权完全的控制，并提供可预测的性能。

  - **Cons**：构建私有云通常需要更高的初始成本，这对某些组织而言可能成本过高，与公共云超大规模提供商相比限制可扩展性，并带来维护复杂性

  通过在安全且隔离的环境中提供专用资源，私有云使企业能够在遵守严格监管要求的同时托管和管理敏感数据和关键应用。这种控制和定制水平确保组织能够根据特定需求定制私有云环境，优化性能并满足独特的业务需求。


  ### 混合云采用

  本地优化的另一种方法是在本地构建云能力，以构建混合云战略。多家公共云提供商提供服务，可帮助企业在其数据中心内构建公共云能力。这是一个利基领域，对于某些企业而言可能极具益处，因为由于本地存在对延迟敏感的应用和数据驻留要求，最近的公共云数据中心访问并不可行。对于已建立公共云战略并寻求混合云选项以弥补差距的企业而言，这可能是一个很好的方法。该模型的主要优势在于它模仿了相同的公共云架构，可无缝扩展到本地应用。一些服务提供商将其作为完全托管的服务提供，而其他则可自行管理。这也有助于解决企业某些利基云用例，例如云爆发。一些示例包括
  AWS Outposts、Google Anthos、Azure Stack 和 Oracle Cloud@Customer。以下是混合云方法的一些考虑因素：

  - **Pros**：公共云以超低延迟在您所在的位置与您相遇，它解决了数据驻留限制，并且具有与公共云相同的架构

  - **Cons**：前期投资高；在完全托管服务的情况下，可能存在更长的合同义务，并且公共云中的并非所有服务都完全具备功能或可用

  混合云方法允许本地和云环境之间无缝集成，提供利用两全其美优势的能力，并且通常是拥有大量本地投资的企业所寻求的战略。


  ## Born in the Cloud

  **Born in the cloud** 指的是以云原生思维构思和建立的企业和组织，从成立之初就将云计算作为其运营的基础。与后期才迁移到云的传统企业不同，born
  in the cloud 实体从第一天起就充分利用云计算的全部潜力。*born in the cloud* 的含义是以对云技术的基础性依赖建立组织，用于其基础设施、应用和服务。

  Born in the cloud 为组织提供了创新并颠覆传统行业竞争对手的诸多优势：





  # 云上诞生


  *   **敏捷性**：对于没有传统 IT 和遗留应用负担的组织而言，云上诞生有助于它们快速开发、测试和部署新的应用和功能。这使企业能够快速响应市场变化、客户需求和新兴趋势，培养持续创新的文化。

  *   **资源效率**：云上原生组织可以避免构建本地基础设施相关的前期资本支出。在云优先模式下，它们只为所消耗的资源付费，降低财务风险并实现资源的有效分配。

  *   **全球覆盖**：云平台天生提供全球数据中心网络，使云上原生实体无需庞大的全球物理基础设施即可触达世界各地的客户和用户。这种全球存在支持快速扩张和市场渗透。

  *   **精简 IT**：通过将基础设施管理外包给云服务提供商，云上原生组织倾向于将资源和专业知识集中在其核心能力和业务差异化上。

  *   **技术创新**：云服务提供商提供大量先进技术和服务，例如人工智能、机器学习、大数据分析以及 **物联网** (**IoT**) 能力。这使云上原生组织能够快速实验、创新并将其轻松集成到其产品中。

  *   **可持续性**：与传统同行相比，云上原生实体通常具有更小的碳足迹，因为它们更高效地消耗资源并减少电子废弃物。


  云上诞生不仅仅是一种技术方法。随着技术的不断进步，它不仅代表一种商业方式，更是重新定义组织在数字时代动态环境中能够实现什么本质的途径。


  一些公司示例体现了云上原生方法，包括 Slack、Twilio、Zoom、Stripe 和 HashiCorp *\[1\] \[**2\] \[3\]*。


  ## 其他独特的转型之旅


  以下部分涵盖了一些企业采用的独特云之旅，这些之旅深受创新、颠覆市场和引领行业转型的愿望影响。


  ### 全球扩张之旅


  希望全球扩张或进入新市场的企业可能会利用公共云快速在不同地区建立自身。扩展到新地理区域时，企业必须遵守各种当地监管和合规协议。公共云为进入新市场的企业提供以下几个主要优势：


  *   在新地理区域建设新的数据中心和 IT 生态系统耗时极长；成熟的云服务提供商提供主要优势——易用性和上市速度

  *   云服务提供商通常遵守各种当地和政府法规，这对企业快速启动并保持合规具有巨大优势

  *   在一个地区已建立公共云战略的企业可以利用相同的<|message|> 基础设施、架构、网络、安全和运营模式。


  ### 数据云之旅


  正如俗话所说 *数据是新的石油*，利用云满足数据需求是企业的另一条独特之旅。企业的创新和数字化转型成功主要取决于其如何利用第一方数据与第二方和第三方数据相结合的力量。强大的数据基础是激活现代用例同时利用人工智能和机器学习的关键。这使组织能够通过统一客户数据并实时利用人工智能和自动化对洞察采取行动，从而做出数据驱动的决策、获得洞察并提供个性化体验。


  ### 绿色云之旅


  除了技术和商业动机之外，注重环境的企业会开展以可持续性措施为重点的云转型之旅，例如最大限度减少电子废弃物和碳足迹。许多超大规模云服务提供商因在无碳能源和可再生能源上运营云数据中心而更加关注
  ESG，提供可视化和报告云服务使用碳排放的工具，建设更智能、更节能的数据中心，并推广可持续供应链实践。关注绿色云计划的企业可以选择具有可持续性记录和承诺的云服务提供商。据世界经济论坛报告称，2021
  年至 2024 年间向云计算的转型应至少防止 6.29 亿公吨二氧化碳进入大气 *\[4\]*。为了便于理解，这相当于在一年内将 410 万英亩美国森林免于转为耕地所固碳的量。


  云之旅是独特的，必须由企业的更大愿景指导，后者为云转型定下基调。现在，让我们探讨企业可以利用的各种云迁移策略。


  # 云迁移策略


  在仔细评估并了解 IT 格局后，企业云转型的最关键阶段是开始迁移。本章前面我们回顾了价值-复杂性矩阵，它可以帮助您为云迁移选择合适的 workload。本节将讨论企业可以利用的不同云迁移策略。


  ## 应用迁移策略的 6R


  2010 年，Gartner 发布了将应用迁移到云的 5R 方法——*重新托管，重构，修订，重建，和替换* *\[5\]*。此后，出现了多种其他 *R* 迁移策略，例如
  AWS 的 6R、Citrix 的 7R 和 Infosys 的 8R。然而，核心目标是为组织在迁移应用到云时可利用的各种策略提供指导。多年来，云迁移策略演变为我们更常称之为应用迁移的
  6R——Rehost、Replatform、Repurchase、Refactor、Retire 和 Retain。必须理解，这些迁移策略并非相互排斥。大多数企业都有可通过一种或多种迁移策略解决的应用迁移。重要的是评估与整体业务目标相符的每种策略的利弊。例如，一个应用可以被重新托管、重构或重新购买。有趣的是，一个应用甚至可能包含属于一个或多个
  R 的部分——应用的一部分可以被重新平台化，而另一部分可以被重新托管。决策取决于多种因素，并且在每个企业环境中都是独特的。让我们回顾这些云迁移策略。


  ### Rehosting – 也称为 lift and shift


  Rehosting，也更常被称为 **lift and shift**，是最常见的迁移方法。它是指将应用和工作负载从本地基础设施迁移到云端，而无需对应用进行重大修改。大多数企业以重新托管策略开始其云转型之旅，作为快速测试云能力和实现价值的方式。在这种方法中，应用的核心架构和功能基本保持不变，以实现快速迁移，同时利用云的优势，例如可扩展性、易于管理以及潜在的成本节约。企业可以根据应用的类型、复杂性和业务目标选择几种不同的方式在云上重新托管应用。




  # 重托管与再平台化概述


  ## 平移迁移 – 公有云作为基础设施平台


  利用公有云作为基础设施平台——主要利用计算、存储和网络——将应用程序平移迁移到云端。这可能是一种可行的策略，当应用程序可以在云原生虚拟机上运行时。采用此方法，应用程序架构基本保持不变，仅对网络和操作系统进行少量更改。组织可以受益于快速的迁移时间、低迁移工作量、云原生可扩展性、可用性、备份以及下层维护的卸载。在这种方法中，企业仍无法获得全方位的云优势，因为仍存在维护负担——在自定义操作系统的情况下进行操作系统/内核修补、应用程序、库和数据库维护。


  ## 基于仿真器的遗留应用程序迁移


  那些根本不适合在云基础设施上运行的遗留应用程序可以受益于公有云提供商或第三方解决方案提供的仿真器。当由于业务需求（如数据中心退出、硬件更新周期或合同义务）而需要迁移时，这种方法对企业有益。作为迈向更大优化之旅的中间步骤，仿真选项为遗留应用程序提供了一个落地区。尽管仿真是一个很好的中间解决方案，但可能会对应用程序的性能产生影响。将大型机现代化迁移到云端是基于仿真器迁移的一个例子。


  ## 嵌套虚拟化


  嵌套虚拟化是企业可以利用的另一个选项，对于无法承受架构任何更改的应用程序来说是一个很好的选择，包括 IP 地址、操作系统、内核和网络。一些遗留应用程序需要静态
  IP 地址以及特定的操作系统和内核补丁级别，这些在云上维护起来更困难或根本不可行。在这种情况下，公有云上的嵌套虚拟化解决方案是一个很好的选择，因为应用程序的功能和架构没有修改。硬件辅助的嵌套虚拟化往往比基于软件的解决方案更好。然而，应用程序仍可能存在性能影响。


  ## 公有云上的 VMware


  作为应用程序现代化的一个部分，各种企业工作负载仍基于 `VMware`。随着企业寻求利用现有投资并以很少的更改迁移这些工作负载，在公有云上创建和运行 `VMware`
  可以提供一种无缝的方式，使工作负载的运行方式与传统本地运行的方式相同。尽管这提供了迁移的便利性，但由于 `VMware` 的许可和维护成本，工作负载仍无法受益于水平扩展和
  TCO 等云原生功能。


  ## 托管


  另一种不太常见的重托管方法，尽管在某些情况下至关重要，例如大爆炸式数据中心退出、收购或剥离情况，就是托管。将遗留硬件、应用程序以及负载均衡器、防火墙和超融合基础设施等基于硬件的解决方案进行托管，可以为企业提供一种新颖的方式，在优化云转型之旅时兼顾两者之长。随着遗留堆栈在物理上与云提供商的网络和基础设施相邻，企业可以受益于更低的延迟和渐进式转型。


  ## 重托管的优势


  总体而言，重托管可以为企业提供以下几个优势：


  * **速度**：重托管提供了一条直接的迁移路径，使其成为快速高效的选择。无需进行大量代码更改，减少了迁移的复杂性和所需时间。

  * **云优势**：通过重托管，企业可以快速利用云功能，如可扩展性、高可用性、自动备份、维护和管理。这使组织能够在不改造应用程序架构的情况下享受云优势。

  * **成本节约**：虽然从长期来看并非最具成本效益的选择，但重托管可以通过避免重新开发或重构应用程序的需求而产生初始成本节约。对于希望迅速迁移并在以后优化云环境的组织而言，这可以是一个切实可行的第一步。

  * **风险缓解**：重托管通过保留现有功能并减少迁移过程中引入新错误或错误的可能性，从而最大限度地降低了迁移关键应用程序相关的风险。


  ## 重托管的劣势


  以下是重托管的一些劣势：


  * **云利用率不佳**：重托管的应用程序无法充分利用云功能和云原生能力，可能导致云资源利用不足并错失成本优化的机会。例如，已重托管的应用程序通常垂直扩展，导致资源过度配置。

  * **敏捷性和创新性受限**：虽然重托管提供了快速迁移，但它可能会阻碍利用云原生功能实现敏捷性和创新的能力。组织必须将重托管作为中间步骤，并在以后重构应用程序以释放云的全部潜力。

  * **潜在的安全漏洞**：重托管的应用程序可能会继承其原始环境中的安全漏洞或配置。在云中确保适当的安全措施和访问控制至关重要，否则可能使应用程序暴露于网络威胁，从而可能需要额外的安全措施。

  * **缺乏成本优化**：虽然可以实现初始成本节约，但组织可能无法达到与云原生策略相同的成本优化水平。需要仔细分析长期成本影响。


  虽然重托管可能无法提供与更具变革性的迁移策略相同的优化和创新水平，但其重要性在于能够提供一条快速且相对低风险的云采用路径。它使组织能够在保留现有应用程序架构的同时开始受益于云的可扩展性、灵活性和成本效益。


  ## 再平台化 – 又称迁移并改进


  再平台化涉及在进行最小代码更改的同时将应用程序迁移到云端，以利用云原生功能。与平移迁移方法不同，再平台化允许对应用程序架构、配置和集成进行有针对性的调整，以优化应用程序在云原生环境中的性能和效率。不是简单地将应用程序原样迁移到云端，再平台化的重点是将应用程序堆栈的部分迁移到云原生服务，以更好地利用云能力和规模经济。需要注意的是，再平台化并不打算更改所考虑的应用程序的核心架构。例如，考虑一个在本地运行的以下堆栈的打包应用程序：


