  21. [`pages.awscloud.com/hybrid-cloud-outposts.html`](https://pages.awscloud.com/hybrid-cloud-outposts.html)\n\
  22. [`cloud.google.com/anthos`](https://cloud.google.com/anthos)\n23. [`azure.microsoft.com/en-us/solutions/hybrid-cloud-app/#products`](https://azure.microsoft.com/en-us/solutions/hybrid-cloud-app/#products)\n\
  24. [`www.oracle.com/cloud/hybrid-cloud/#rc30p0`](https://www.oracle.com/cloud/hybrid-cloud/#rc30p0)\n"
- "## 3 企业云采用面临的挑战\n\n\n\n企业在数字化转型和采用云技术时面临的常见挑战之一，是其平衡现有传统本地 IT 生态系统与云的能力。在传统企业中，任何新技术的采用仍需依赖\
  \ IT 来提供业务能力。例如，计划重塑 ERP 的财务部门可以挑选 ERP 软件或供应商，但仍需与其 IT 部门合作提供基础设施、平台、安全性和集成，以使其完全发挥功能。现代云技术降低了业务与\
  \ IT 之间的摩擦和依赖。例如，销售组织可以几乎即时采购和运营 CRM SaaS 解决方案来满足其业务需求，而无需依赖 IT。当然，IT 组织仍需管理应用程序集成、数据集成和安全复杂性。下图说明了典型企业\
  \ IT 生态系统将是什么样的：\n\n![图 3.1 – 一个典型的企业 IT 生态系统](img/B18893_03_1.jpg)\n\n图 3.1 – 一个典型的企业\
  \ IT 生态系统\n\n本章将探讨企业在数字化转型中面临的挑战和复杂性，以及应对这些挑战的一些策略。具体而言，我们将讨论并解决以下问题：\n* 在企业 IT\
  \ 生态系统复杂性之下，我们应从何处开始数字化转型？\n* 通过电子商务应用现代化示例选择正确的云策略\n* 如何识别适合云转型的 workload 以及各种策略\n\
  * 混合云和多云采用的最佳实践\n* 企业如何应对新的财务模式——具体来说是从资本支出 CapEx 到运营支出 OpEx\n\n# 我们从哪里开始？企业 IT\
  \ 生态系统的复杂性\n\n当今的企业 IT 生态系统已超越了物理企业的边界。随着有机增长和不断增长的业务需求，企业 IT 管理变得难以管理和维护。由于市场动态和不断增长的客户需求，企业已超越传统数据中心的范围，并涉足托管服务、SaaS\
  \ 云、边缘计算（即微型数据中心）、私有云、公有云以及与合作伙伴生态系统的集成。尽管这些举措增强了业务能力，但仍存在数据蔓延、数据冗余、源于多种应用架构的反模式、集成、供应商管理、数据安全、隐私和合规等自然挑战。让我们回顾一下围绕企业\
  \ IT 的一些复杂性。\n\n## 技术债务\n\n技术债务或技术债是指在软件系统的开发和维护过程中，随着时间推移所做出的次优决策、妥协和捷径所累积的后果。它代表企业在为快速交付解决方案而以高维护成本进行权衡时，随着时间推移所承担的成本。技术债务在多个企业中普遍存在，可能源于各种因素，例如时间限制、预算限制、业务优先级的改变、技术专业知识不足、规划不足以及不断变化的技术环境。开发团队可能会选择快速而粗糙的解决方案以满足紧迫的截止日期，或因资源限制而偷工减料，从而导致技术债务累积。\n\
  \n技术债务可以表现为不同的形式：\n* **架构债务**：次优的系统设计和架构决策\n* **代码债务**：复杂、冗长且文档记录不佳的代码库\n* **数据债务**：数据的冗余副本，也常被称为数据蔓延或数据孤岛\n\
  * **软件债务**：过时且不受支持的软件、冗余的软件功能\n* **遗留债务**：需要大量维护和返工的遗留系统\n* **硬件债务**：在硬件堆栈上的累积投资；需要专业顾问和支持的超融合基础设施\n\
  \n累积的技术债务可能对企业产生重大影响，因为它可能减缓开发、阻碍生产力、增加维护成本，并带来系统故障、错误和安全漏洞的更高风险。它可能阻碍创新并妨碍企业适应不断变化的市场需求的能力。\n\
  \n## 业务部门创建自己的 IT 中心\n\n随着消费者和市场需求呈指数级增长，企业不断面临满足业务需求以保持竞争力的挑战。由于企业的主要驱动力是紧跟市场需求，业务部门领导者通常会选择提供更快上市时间、易于管理、低管理开销且对\
  \ IT 依赖较小的解决方案。随着 **软件即服务**（**SaaS**）商业模式的出现，业务部门可以投资于快速解决业务需求的解决方案。例如，销售团队可以利用其预算投资于现代\
  \ CRM 平台，以提高客户保留率、提供更好的客户服务、提高销售预测准确性并深入了解客户行为。尽管这可能在短期内帮助满足特定的业务需求，但这可能会迅速导致孤岛式解决方案以及企业\
  \ IT 生态系统内部多样化技术、平台和架构的 proliferate，从而导致应用程序集成、数据集成和安全复杂性。企业必须拥有明确的业务战略和相应的 IT 战略，以在不增加\
  \ IT 复杂性和维护负担的情况下实现可持续的长期业务目标。\n\n## 专有私有云\n\n云技术从根本上建立在开源技术之上。然而，随着越来越多的云厂商在开源技术之上构建专有包装以提供差异化的产品，谨慎的做法是企业在适当的规划、设计和管理下仔细评估利弊。这种效应在私有云产品中更为严重，因为私有云通常需要对基础设施、硬件、软件、开发方法和咨询工作进行大量前期投资。使用专有技术限制了灵活性并导致供应商锁定。在私有云中，资源分配和优化对于确保可用基础设施的高效利用至关重要。根据需求平衡工作负载、管理虚拟机放置以及优化资源分配可能是需要持续监控和微调的复杂任务。企业在选择私有云部署模型时，其他主要考虑因素是数据主权和合规需求。由于私有云存储敏感的企业数据和应用程序，因此需要强大的安全措施、管理访问控制、数据加密并防范威胁，这可能变得复杂。遵守行业特定法规（如\
  \ HIPAA 或 GDPR）增加了另一层复杂性，需要仔细配置和审计安全控制。构建和管理私有云的另一个常见挑战是提供 **服务等级协议**（**SLAs**）、监控、容量规划和计费回溯机制的能力，这些都需要强大的服务管理流程和工具。\n\
  \n## 数据蔓延与集成\n\n\n\n## 数据蔓延\n数字化转型中另一个非常常见的挑战是企业范围内的数据蔓延。数据蔓延是指数据在企业范围内不受控制的增长和分散，带来诸多复杂性。数据蔓延会使在需要时定位和访问相关数据变得困难。在多个系统和存储库中搜索和发现数据变得具有挑战性，导致数据驱动的决策流程效率低下和延迟。建立和执行一致的数据治理政策、维护数据质量和安全以及遵守法规变得具有挑战性。在多个系统和位置管理数据会导致存储和基础设施成本增加，而由于格式不一致和数据孤岛，数据集成和互操作性受损。发现和访问相关数据变得困难，影响决策流程，并使数据备份和恢复变得更加复杂。为应对这些复杂性，必须实施稳健的数据治理框架、集成策略和技术，同时配合数据分类、元数据管理和定期审计，以缓解数据蔓延带来的挑战。\n\
  \n## 安全\n在企业数字化转型的过程中，安全挑战是一个关键考虑因素，因为组织采用新技术并拥抱数字化举措。随着企业 IT 生态系统开始跨越本地基础设施、公共云、边缘计算、第三方集成和物联网，它导致了攻击面增加的复杂且动态的\
  \ IT 环境。保护这一错综复杂的生态系统需要持续监控、威胁检测和漏洞管理。确保数据保护和隐私变得至关重要，尤其是在 GDPR 或 CCPA 等不断演进的法规下，企业必须制定和实施稳健的安全措施，包括加密、访问控制和数据生命周期管理。\n\
  \n## 选择合适的云策略\n企业具有独特业务需求，评估、评估和规划合适的云策略至关重要。鉴于云部署模型和云超大规模厂商种类繁多，企业在踏上云之旅之前必须仔细评估其业务目标、识别工作负载适用性，并评估供应商的能力以及支持/安全措施。企业面临的主要挑战之一是决定从哪里开始云之旅。一个业务问题可以通过多种解决方案来解决。解决方案的选择主要取决于企业当前的\
  \ capabilities、技能组合、驱动事件、IT 成熟度以及资源的可用性。\n\n### 示例\n让我们考虑一个零售企业踏上数字化转型之旅，构建现代全渠道电子商务平台的示例。展示了传统的单体电子商务应用架构：\n\
  \n![图 3.2 – 传统电子商务架构](img/B18893_03_2.jpg) \n图 3.2 – 传统电子商务架构\n\n从业务需求角度来看，零售商可以定义业务目标以及相关的关键结果和指标：\n\
  \n![图 3.3 – 目标与关键结果 (OKR)](img/B18893_03_3.jpg) \n图 3.3 – 目标与关键结果 (OKR)\n\n以下是 OKR\
  \ 如何为电子商务现代化设想和定义的示例。\n\n*   **目标**：目标是提高电子商务平台效率并提供全渠道用户体验，以满足、服务和支持现代购物者的需求。\n\
  *   **关键结果**：成果旨在解决电子商务现代化目标，例如平台效率、提供全渠道用户体验以及满足新的消费者期望。以下是可以直接影响整体目标的一些关键结果：\n\
  \    *   **现代用户体验**：直观且易于导航的界面可在不同设备和屏幕尺寸上提供无缝用户体验，包括网页、移动应用、移动网页和语音助手。\n    * \
  \  **移动体验**：随着智能手机、平板电脑、智能设备和可穿戴设备的普及，对电子商务平台进行全面移动优化以满足日益增长的移动购物者数量至关重要。\n    *\
  \   **强大的产品目录管理**：实现产品信息的高效管理，包括详细描述、多个产品图片、价格、库存可用性和变体。\n    *   **B2C、B2B、B2B2C\
  \ 能力**：这是支持消费者、企业对企业商务和直接面向消费者销售的能力。\n    *   **安全可靠的支付处理**：支持各种支付方式，包括信用卡/借记卡、数字钱包以及与开放银行生态系统的集成，以提供个性化灵活的支付和融资选项，例如\
  \ **先买后付** (**BNPL**) 和其他在线支付系统。\n    *   **高效订单管理**：实现无缝的跨渠道订单处理，包括下单、跟踪和履约。与库存管理系统集成以提供准确的库存信息。\n\
  \    *   **与第三方服务集成**：与外部服务（如物流提供商、分析工具、CRM 系统、供应链、营销自动化平台和企业后端系统）集成对于高效运营和数据分析至关重要。\n\
  \    *   **强大的搜索和筛选功能**：强大的搜索功能和高级筛选选项帮助客户快速找到所需产品，提升用户体验并推动转化。\n    *   **可扩展性和性能**：构建处理大量流量和交易的能力，而不会出现明显的性能下降，同时也能适应未来增长和需求激增，例如季节性或闪购。\n\
  \    *   **跨渠道个性化**：在多个渠道（如网站、移动应用、社交媒体和实体店）提供无缝购物体验，使客户能够通过其偏好的渠道与品牌互动，并支持个性化促销、电子邮件和动态产品推荐。\n\
  \    *   **嵌入式 AI**：支持利用现代 AI 解决方案的广泛能力，例如个性化购物体验、产品推荐、提供 24/7 支持的虚拟助手、智能产品发现、欺诈检测与预防、视觉和语音搜索能力、动态定价和促销。\n\
  \    *   **安全与合规**：防范诸如勒索软件、DDoS 攻击、金融欺诈、智能抓取机器人、网络钓鱼、**跨站脚本** (**XSS**) 和 **中间人**\
  \ (**MITM**) 攻击等恶意软件攻击。平台还应支持各种监管和合规法规，例如 PCI、PII、GDPR、COPPA 和 ADA。\n\n从技术角度来看，这一问题陈述和目标可以通过多种方式解决。让我们探讨一些选项以及每种方法的优缺点。\n\
  \n### 选项 1：使用 SaaS 构建电子商务平台\nSaaS 电子商务平台因其便利性、上市速度快和成本效益而变得越来越受欢迎。SaaS 电子商务平台对于寻求经济高效、可扩展且无忧的在线商店建立和管理解决方案的企业而言，是一个有吸引力的选择。然而，企业评估利用基于\
  \ SaaS 的电子商务平台的优缺点至关重要。\n\n![图 3.4 – 基于 SaaS 的电子商务架构](img/B18893_03_4.jpg) \n图 3.4\
  \ – 基于 SaaS 的电子商务架构\n\n以下是 SaaS 方法的一些优势：\n\n\n\n# SaaS 电商平台概述\n\n## 优势\n\n* **上市时间更快**：SaaS\
  \ 平台提供用户友好的界面并提供预建模板和主题，使企业能够快速设置和启动其在线商店。\n* **成本效益高**：SaaS 平台提供基于订阅的定价模式，允许企业按需付费，而非进行大额前期投资。这对于中小型企业或\
  \ IT 资源和预算有限的组织尤其有利，因为它可以帮助它们避免与托管、安全和维护相关的成本。\n* **可扩展性**：SaaS 平台旨在随着业务增长而轻松扩展。SaaS\
  \ 服务提供商承担扩展基础设施和资源以处理增加的流量、交易和产品目录的责任，而无需对底层架构进行重大更改。\n* **安全性和合规性**：SaaS 提供商通常会大量投资安全措施，通过实施行业标准安全协议、进行定期安全审计并确保符合各种数据保护法规来保护其平台和客户数据。SaaS\
  \ 平台提供强大的安全措施，包括数据加密、定期备份以及符合 PCI 等行业标准。平台提供商通常处理安全更新并确保平台免受漏洞威胁。\n* **降低 IT 负担**：使用\
  \ SaaS 电商平台，企业可以将基础设施管理和技术复杂性转移给服务提供商。这使内部 IT 团队能够专注于更具战略性的任务和核心业务活动，而非日常维护和更新。\n\
  * **功能增强**：SaaS 平台通常提供频繁的更新和新功能发布，确保电商商店保持与最新技术和趋势同步。这些更新可以帮助企业在市场上保持竞争力。\n* **运营和维护**：由于\
  \ SaaS 平台由服务提供商运营和维护，这非常适合中小型企业和精简的 IT 组织，企业可以将精力投入到其他业务优先事项上。\n* **数据分析和洞察**：SaaS\
  \ 电商平台包含内置的分析和报告功能，可提供有关业务绩效的宝贵洞察。组织可以跟踪关键指标、分析客户行为，并做出数据驱动的决策以优化电商运营并推动增长。\n\n\
  在上述优势之外，企业必须意识到存在一些缺点：\n\n## 缺点\n\n* **定制有限**：与自托管解决方案相比，SaaS 平台在定制选项方面可能存在限制。虽然它们提供可在一定程度上定制的模板和主题，但企业通常在修改底层代码或实施高度特定的设计和功能要求方面受到限制。\n\
  * **供应商依赖**：由于电商平台由提供商托管和管理，企业依赖于平台的正常运行时间、性能和支持。如果平台出现技术问题或停机，可能会影响在线商店的可用性和功能。\n\
  * **差异化服务**：基于 SaaS 的解决方案也可能成为实施独特差异化服务的障碍，例如嵌入基于 AI 的解决方案、第三方搜索/产品发现服务等。\n* **数据所有权和迁移挑战**：使用\
  \ SaaS 平台时，数据存储在提供商的服务器上。如果未来决定更换平台，这可能会引发数据所有权和可移植性的担忧。企业在将数据和定制迁移到不同系统时也可能面临挑战。\n\
  * **集成和控制有限**：使用 SaaS 平台时，您对后端基础设施和服务器配置的控制有限。这对于具有特定托管要求或需要与外部或现有企业后端系统进行高级定制和集成的企业来说可能是一个劣势。\n\
  * **长期运营成本**：虽然基于订阅的定价模式对许多企业来说具有成本效益，但它可能成为长期支出。随着时间推移，企业需求增长，企业将需要利用各种附加服务来构建能力，累积的订阅成本可能超过构建和维护自托管电商解决方案的成本。\n\
  \n### 选项 2：基于无头电商构建电商平台\n\n开发电商解决方案的另一个重要趋势是基于 **微服务化、API 优先、云原生和无头** (`MACH`) 架构的无头可组合电商。在无头可组合电商架构中，内容管理能力与电商应用的展示层或前端分离。无头可组合电商使开发人员能够从多个来源组合和合并内容，包括外部\
  \ API、微服务或其他内容存储库，从而在跨各种系统的内容聚合和集成方面提供更大的灵活性。无头电商为内容创作者和编辑提供用户友好的界面来创建、管理和组织内容，包括内容编辑、版本控制、内容工作流和用户权限等功能。使用无头\
  \ CMS，前端与后端分离，允许开发人员灵活选择最合适的[content]\n# SaaS 电商平台概述\n\n## 优势\n\n* **上市时间更快**：SaaS\
  \ 平台提供用户友好的界面并提供预建模板和主题，使企业能够快速设置和启动其在线商店。\n* **成本效益高**：SaaS 平台提供基于订阅的定价模式，允许企业按需付费，而非进行大额前期投资。这对于中小型企业或\
  \ IT 资源和预算有限的组织尤其有利，因为它可以帮助它们避免与托管、安全和维护相关的成本。\n* **可扩展性**：SaaS 平台旨在随着业务增长而轻松扩展。SaaS\
  \ 服务提供商承担扩展基础设施和资源以处理增加的流量、交易和产品目录的责任，而无需对底层架构进行重大更改。\n* **安全性和合规性**：SaaS 提供商通常会大量投资安全措施，通过实施行业标准安全协议、进行定期安全审计并确保符合各种数据保护法规来保护其平台和客户数据。SaaS\
  \ 平台提供强大的安全措施，包括数据加密、定期备份以及符合 PCI 等行业标准。平台提供商通常处理安全更新并确保平台免受漏洞威胁。\n* **降低 IT 负担**：使用\
  \ SaaS 电商平台，企业可以将基础设施管理和技术复杂性转移给服务提供商。这使内部 IT 团队能够专注于更具战略性的任务和核心业务活动，而非日常维护和更新。\n\
  * **功能增强**：SaaS 平台通常提供频繁的更新和新功能发布，确保电商商店保持与最新技术和趋势同步。这些更新可以帮助企业在市场上保持竞争力。\n* **运营和维护**：由于\
  \ SaaS 平台由服务提供商运营和维护，这非常适合中小型企业和精简的 IT 组织，企业可以将精力投入到其他业务优先事项上。\n* **数据分析和洞察**：SaaS\
  \ 电商平台包含内置的分析和报告功能，可提供有关业务绩效的宝贵洞察。组织可以跟踪关键指标、分析客户行为，并做出数据驱动的决策以优化电商运营并推动增长。\n\n\
  在上述优势之外，企业必须意识到存在一些缺点：\n\n## 缺点\n\n* **定制有限**：与自托管解决方案相比，SaaS 平台在定制选项方面可能存在限制。虽然它们提供可在一定程度上定制的模板和主题，但企业通常在修改底层代码或实施高度特定的设计和功能要求方面受到限制。\n\
  * **供应商依赖**：由于电商平台由提供商托管和管理，企业依赖于平台的正常运行时间、性能和支持。如果平台出现技术问题或停机，可能会影响在线商店的可用性和功能。\n\
  * **差异化服务**：基于 SaaS 的解决方案也可能成为实施独特差异化服务的障碍，例如嵌入基于 AI 的解决方案、第三方搜索/产品发现服务等。\n* **数据所有权和迁移挑战**：使用\
  \ SaaS 平台时，数据存储在提供商的服务器上。如果未来决定更换平台，这可能会引发数据所有权和可移植性的担忧。企业在将数据和定制迁移到不同系统时也可能面临挑战。\n\
  * **集成和控制有限**：使用 SaaS 平台时，您对后端基础设施和服务器配置的控制有限。这对于具有特定托管要求或需要与外部或现有企业后端系统进行高级定制和集成的企业来说可能是一个劣势。\n\
