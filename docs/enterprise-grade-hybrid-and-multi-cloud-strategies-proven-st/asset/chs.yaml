  图 5.3 – 一个示例的本地 Web 应用栈


  虽然重托管迁移会寻求以绝对最小的修改部署堆栈原样，但再平台化练习涉及对应用程序架构、认证和可支持性的更深入调查。在前面的示例中，对企业业务功能至关重要的 `COTS`
  应用程序可能具有多种经过认证和支持的目标平台。即使是看似较小的再平台化工作，企业也可以实现潜在的长期收益，例如更低的 TCO、改进的性能、降低的许可要求以及更低的管理和维护工作。例如，将应用程序的虚拟化堆栈从商业
  hypervisor 再平台化到云原生 hypervisor（如 `KVM`）可以对给定应用程序的整体 TCO、移植性、可用性和可维护性产生显著积极影响。




