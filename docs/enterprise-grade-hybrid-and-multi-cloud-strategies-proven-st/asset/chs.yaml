  无论双重重要性评估是否由法规强制要求，它都能为企业利益相关者和董事会提供更深入的可见性和洞察，了解其对 ESG 和商业价值的影响。


  # 采用 ESG 报告计划


  无论选择哪种 ESG 标准和框架，ESG 数据收集和衡量的准确性与透明度、ESG 流程的自动化以及可审计性，都是成功采用和报告 ESG 的核心。类似于为人力资源
  (`HR`)、企业资源计划 (`ERP`) 和财务等各种业务职能实施专用 `IT` 软件系统，ESG 报告也需要专用的软件系统。组织可以从专业的 ESG 软件平台中受益，以跨多个维度采集
  ESG 数据，并衡量排放数据和可持续发展举措。ESG 报告软件可以通过直接从多个来源自动采集数据、基准测试和透明报告，帮助组织保持井井有条，同时遵守不断变化的监管要求。以下是组织可以利用的四阶段方法，以简化和优化
  ESG 报告：


  ![Figure 11.2 – ESG reporting life cycle](img/B18893_11_02.jpg)


  图 11.2 – ESG 报告生命周期


  让我们详细了解这些阶段：


  *   **收集**：数据收集是可持续发展报告的第一步。ESG 数据收集对于为组织提供所需信息以做出明智决策、管理风险、建立信任，并为可持续和负责任的商业环境做出贡献至关重要。这涉及跨多个企业数据源、系统和应用程序无缝收集和整合数据，汇聚到单一的统一事实存储库中。


  *   **衡量**：ESG 报告的下一步是衡量和基准测试。衡行为组织提供可量化的指标来评估 ESG 绩效。这些指标有助于评估可持续发展举措的有效性，识别改进领域，并为未来进展设定基准。衡量使公司能够将其
  ESG 绩效与行业同行、行业基准和最佳实践进行比较。这种比较分析有助于组织了解其相对地位，以及可能需要追赶或引领的领域。


  *   **报告**：报告通常是帮助组织向内部或外部利益相关者报告 ESG 状况的关键步骤。无论是自愿报告还是应对审计或监管要求，ESG 报告的透明度和准确性都至关重要，因为利益相关者越来越多地利用报告的
  ESG 信息做出明智决策。这也是组织传达其对 ESG 价值观承诺的机会，这更有可能吸引资本、建立积极的品牌形象，并吸引和留住顶尖人才。


  *   **分析**：*分析*阶段帮助组织深入了解 ESG 指标，并将其转化为可执行的战略和绩效基准。通过仪表板深入了解 ESG 指标，企业领导者可以访问、筛选和可视化
  ESG 数据，从而更快地做出更好的决策。利用预测分析，组织可以为正确的目标业务成果模拟不同的目标和结果。


  # 云计算作为 ESG 赋能者


  云计算可以通过多种方式助力 ESG 目标，符合可持续和负责任的商业实践，涵盖环境考量、社会影响和治理。利用云服务使组织能够优化资源、增强协作、负责任地创新，并采用更可持续、高效的
  `IT` 实践。以下是云计算帮助组织推进可持续发展和 ESG 目标的一些方式。


  ## 环境因素





  ## 环境因素


  随着企业努力实现零碳和碳中和等更大、更大胆的目标，云计算为实现这些愿景提供了一条无缝的路径。通过利用云服务提供商的绿色数据中心、节能计算选项以及持续演进的即用型
  ESG 报告能力，组织可以实现长期商业价值，同时将资源集中于更宏大、更核心的业务目标上。以下是一些有助于组织履行 ESG 承诺的环境因素。


  ### 能源效率


  通过利用云服务提供商的节能基础设施、应用和服务，企业可以借助基础设施整合与优化，同时将技术进步与环境责任相结合。以下是一些超大规模云服务商助力提升能源效率的示例：


  * **绿色数据中心**：超大规模云服务商投资于绿色数据中心技术，利用可再生能源、水资源补给计划、节能硬件和先进冷却系统来最大程度地减少对环境的影响。**电能使用效率**（**PUE**）通常被用作衡量数据中心效率的常用指标。PUE
  的定义是描述数据中心使用能源效率的指标。理想的 PUE 值为 1.0，表示数据中心效率完美，即设施 100%的电力都输送给 IT 设备。典型数据中心的年平均 PUE
  为 1.58 *[9]*。让我们将这个指标与一些主流云服务提供商的数据中心进行比较。例如，**亚马逊云服务**（**AWS**）的 PUE 为 1.2，Azure
  为 1.12，谷歌云为 1.10（分数越低，效率越高）*[10] [11]*。这对企业意味着什么？通过在云端运行工作负载，组织可以对其 ESG 目标产生显著的积极影响。除能源之外，各大云服务提供商还制定了净零目标，实施水资源管理和补给计划，并朝着循环经济的目标实现零废弃物。更重要的是，随着超大规模云服务商大力投入并不断朝着更宏大的可持续发展目标努力，企业可以共享并利用这些收益。

  * **基础设施整合**：云服务提供商运营大规模数据中心，通过高效的服务器整合，与本地部署的基础设施相比，可实现更高的资源利用率并降低每个工作负载的能耗。多家云服务提供商还针对使用绿色能源、低碳强度或无碳能源（**CFE**）运行的数据中心区域提供透明指标。这使得有可持续发展目标的组织可以选择
  CFE 占比更佳、更清洁的区域来运行其工作负载。例如，谷歌通过展示 CFE 百分比和当地电网的碳强度来发布其所有云区域的碳数据，AWS 则发布电力地图。


  ### 减少碳足迹


  凭借云计算的规模经济、无服务器技术、弹性扩展以及减少电子废弃物，组织可以显著降低总体碳排放。以下是一些有助于减少碳足迹的关键因素：


  * **规模经济**：云服务提供商通过多租户模式实现规模经济，允许多个组织在同一基础设施上共享计算资源。与各组织自行管理数据中心相比，这降低了整体碳足迹。传统数据中心消耗大量能源，产生大量碳排放。相比之下，云端工作负载的聚合提高了服务器利用率并推动了规模经济，融入了更新的高效服务器，并利用回收或再生水来冷却云数据中心。根据**世界经济论坛**（**WEF**）发表的一项研究，2021
  年至 2024 年间向云计算的迁移应可避免至少 6.29 亿公吨二氧化碳进入大气层。

  * **动态扩展**：云服务使组织能够根据需求弹性地扩展或缩减资源。这种弹性有助于避免过度配置，从而在需求较低的时期降低能源消耗。在最基本的层面上，传统数据中心以过度配置来应对流量高峰为原则运行——有时闲置容量甚至高达
  3 倍。相比之下，凭借云计算的弹性按需扩展，服务器效率得到显著提升，从而使整体数据中心运营更加高效。企业还可以通过选择云中的全托管服务和产品（例如无服务器和无实例服务）来进一步提高效率，因为这些服务具有更高的打包、部署和运营效率。

  * **减少电子废弃物**：通过依赖云服务，组织可以减少维护和处理物理 IT 设备的需求，从而有助于减少电子废弃物（e-waste）。


  ### 可持续发展影响仪表板


  多家超大规模云服务商提供可持续发展仪表板，可深入了解组织的碳排放情况。这有助于企业衡量、跟踪、报告并落实可持续发展目标。例如，谷歌云提供即用型仪表板，可概览与谷歌云服务使用相关的电力总碳排放量，并按服务、项目和区域进行细分。同样，Azure
  提供 Emissions Impact Dashboard（排放影响仪表板），以提高碳排放的透明度。这有助于组织做出有针对性的决策，围绕云使用创造新的效率。


  ## 社会因素


  ESG 中的社会因素对于构建负责任且可持续的商业模式不可或缺。优先考虑社会因素的企业展现了对道德实践、员工福祉、社区参与和客户满意度的承诺，有助于在日益注重社会责任的商业环境中取得长期成功。以下是一些云计算如何推动积极社会影响的示例：


  * **促进远程协作**：从本质上讲，云计算遍布全球，支持企业和员工几乎从任何地方访问云服务。虚拟桌面、**统一通信即服务**（**UCaaS**）和生产力工作空间工具等云解决方案促进了灵活办公和远程办公。设想一个
  SaaS ERP 应用这样的云解决方案，只需通过带互联网连接的浏览器即可访问，而传统本地部署的封闭生态系统则远非如此。开放安全防火墙和访问权限往往极为棘手，而云服务从一开始就是为开放安全而设计的。从社会影响的角度来看，云计算服务通过让员工随时随地访问应用、数据和协作工具来支持远程工作。这有助于实现工作与生活的平衡，同时减少通勤相关的环境影响，从而产生积极的社会影响。

  * **全球协作**：基于云的协作工具和平台还促进了全球协作——这是一个重要的社会维度，使组织能够与多元化团队和合作伙伴携手合作，助力实现社会和文化多样性目标。从某种意义上说，云计算拉平了竞争环境，使最合适的人选能够胜任工作岗位，无论其身在何处。






  *   **无障碍与多样性**：云技术为残障人士或有特殊需求的人群提供了平等使用现代应用和服务的机会。他们不再受制于必须到办公室上班的约束，并继续享有同等的资源获取渠道和职业发展机会。


  ## 治理因素


  尽管治理在 ESG 中排在最后，但公司治理是锚定并驱动环境和社会方面的基础要素。公司治理的范畴涵盖多种要素，包括公司结构、董事会构成、商业道德实践以及反腐败措施。下面我们来回顾公司治理中与
  ESG 原则相关的一些关键方面。


  ### 数据安全与隐私


  数据安全与隐私是 ESG 框架的关键组成部分，在治理和商业道德实践中发挥着重要作用。随着企业持续将 ESG 原则置于优先位置，强大的数据保护措施已成为践行商业道德、赢得利益相关者信任以及履行企业整体责任的关键保障：


  *   **数据保护与合规**：数据安全与合规是组织内部治理的关键组成部分。云服务提供商在强大的安全措施、数据加密和合规认证方面投入巨大。采用云服务可以帮助组织增强数据保护和治理实践，从而与
  ESG 原则保持一致。


  *   **法规遵从**：云服务提供商通常会提供全面的工具、报告和合规可见性，帮助组织遵守数据保护法规，从而促进良好治理并遵循法律和道德标准。这些工具和开箱即用的报告提高了透明度，并简化了审计、跟踪和行业法规遵从的流程。


  *   **日志记录、监控与审计**：云平台通常提供全面的日志记录和审计功能，使组织能够跟踪用户活动、配置更改和系统事件，从而支持透明度和可审计性。借助实时监控能力，组织可以主动识别并解决潜在的治理问题，以实现更好的决策和风险缓解。


  ### 业务连续性（BC）


  业务连续性（BC）在 ESG 背景下至关重要，因为它能确保企业在中断期间维持运营，保障利益相关者的利益并促进社会责任。通过优先考虑业务连续性，企业展示了其对韧性和风险管理的承诺，从而赢得投资者和社区的信任：


  *   **灾难恢复（DR）与韧性**：云服务提供强大的灾难恢复能力，包括备份、灾难恢复和冗余功能，确保在不可预见事件面前维持业务连续性。这种韧性通过最大程度地减少运营中断，与
  ESG 目标保持一致。


  *   **强化风险评估**：云计算使组织能够更有效地评估和管理风险，包括与数据泄露、系统停机和其他潜在中断相关的风险。通过利用基于云的工具和服务，企业可以增强其整体风险管理实践，促进更好的治理。


  ### 供应商风险管理


  供应商风险管理是 ESG 的一个重要方面，因为它确保了整个供应链中的道德和可持续实践。通过评估和缓解与供应商相关的风险，企业展示了其对社会责任、公平劳动实践和环境标准的承诺。它还能增强治理并加强利益相关者的信任，有助于构建更负责任、更可持续的商业生态系统：


  *   **云服务提供商的尽职调查**：组织可以对**云服务提供商**（**CSP**）进行尽职调查，以评估其安全实践、合规认证以及对道德商业行为的承诺。这通过确保第三方关系与组织价值观和标准保持一致来支持治理。


  *   **合同协议**：云计算合同通常包含与数据保护、安全和合规相关的条款。有效的治理涉及审查并与云服务提供商协商合同协议，以符合组织的治理目标。


  既然我们已经回顾了云如何助力组织实现整体 ESG 目标，接下来让我们探讨组织在云端设计和构建应用时，如何融入 ESG 和可持续性原则。


  ## 在云端构建可持续应用


  构建可持续的云应用需要在应用的整个生命周期中综合考虑环境、社会和经济因素。可持续云应用旨在最大限度地减少对环境的影响、促进社会责任并助力长期经济可行性。虽然从传统的本地数据中心迁移到云端有助于实现组织的可持续发展目标，但这并不是可持续发展之旅的终点。为了延续并推进可持续发展承诺，自上而下的领导层承诺至关重要，需要从基础层面将
  ESG 原则推动并嵌入到应用中。以下是一些设计原则和架构最佳实践，可帮助将可持续性置于每个应用的核心：


  *   **选择可持续的云服务提供商**：选择同样致力于可持续发展并运营绿色数据中心的云服务提供商。投资于可再生能源和节能基础设施的提供商有助于降低整体环境影响，从而直接有利于组织的
  ESG 目标。可考虑那些透明报告其碳足迹、用水效率、水资源补充、循环经济和废弃物减少情况的云服务提供商。选择发布年度可持续发展报告并详细说明其环保举措*\[12\]*的提供商。


  *   **优化云资源**：精心优化计算资源、存储和网络带宽的分配，以最大限度地减少过度配置和资源浪费。确保应用架构设计充分利用支持动态扩展的云服务，以匹配实际需求。


  *   **节能计算**：优先选择在数据中心重视能源效率的云服务提供商和服务。在云端部署工作负载时，选择使用无碳能源（CFE）、低碳强度和可再生能源的区域和可用区。


  *   **为效率而设计**：在设计应用时，应优先选择完全托管的服务以及无服务器（serverless）和无实例（instanceless）架构，而不是自行构建。手动安装和部署的应用在效率上不如由提供商托管的应用。


  *   **优化代码**：鼓励开发团队编写高效且优化的代码，以减少资源消耗。这包括尽量减少不必要的计算、优化算法以及使用缓存策略。


  *   **迭代开发**：采用迭代式开发流程，以便持续进行增强和优化。定期重新评估和更新应用，融入最新的可持续实践和技术。


  *   **内部培训**：对开发团队进行可持续实践和技术环境影响方面的教育。在组织内部推广具有环保意识和责任感的氛围。向用户提供有关应用可持续性功能的教育和信息，以鼓励环保的使用模式，并宣传使用可持续技术带来的积极影响。





  - **数据压缩与去重**：实施数据压缩和去重技术，以最大限度地减少存储需求、存储加密和哈希处理，并减少不必要的数据移动、带宽消耗和数据传输成本。

  - **数据生命周期管理（DLM）**：定义 DLM 策略，自动归档或清除不再需要的数据。这有助于控制存储成本并提高效率。

  - **持续监控**：实施监控工具，持续评估应用程序的性能和资源利用率。识别优化和效率改进的机会。

  - **成本管理**：定期审查并优化云成本。利用云提供商的工具和第三方解决方案来识别节省成本的机会，并确保资源的高效利用。一些云提供商提供与 ESG 数据相关联的推荐服务，以识别浪费的资源，并推荐替代方案以提高效率。

  - **安全与合规**：对传输中和静态数据实施强加密实践，以改进治理实践。保护敏感数据，以维护用户隐私并遵守数据保护法规。确保应用程序符合相关的环境和社会责任标准，并遵守行业特定的法规和认证要求。

  - **包容性与可访问性**：为促进社会责任，设计应用程序时需考虑包容性和可访问性，确保面向用户的应用程序可供具有不同能力和背景的用户使用。

  - **数据的道德使用**：实施合乎道德的数据实践，确保负责任地收集、使用和存储数据。清楚传达隐私政策，并在处理数据前获得用户同意。

  - **支持非营利组织**：考虑向符合可持续性和社会责任目标的非营利组织或项目提供云资源或服务。

  - **开源贡献**：为专注于可持续和道德技术实践的开源项目做贡献。与社区分享专业知识和最佳实践，以推进负责任的技术发展。

  - **反馈循环**：建立反馈循环，从内部和外部用户及利益相关者处收集见解。利用这些反馈对应用程序进行持续改进，解决可持续性问题并满足用户期望。


  通过将这些考量融入云应用程序的基础设计、开发和运营，组织可以为构建可持续、环境友好且具有社会责任感的解决方案做出贡献。目标是创造不仅满足功能需求，而且符合更广泛的
  ESG 原则，并对世界产生积极影响的技术。


  # 总结


  在本章中，我们讨论了企业 ESG 的各种指导原则，以及云计算如何促进组织实现其整体 ESG 目标。我们还探讨了各种 ESG 监管报告标准（包括双重重要性），以及整合
  ESG 原则的价值。此外，我们回顾了企业如何利用云计算作为 ESG 推动因素，并通过选择致力于可持续发展的提供商、优化资源分配、使用节能计算以及面向效率进行设计来构建可持续的云应用程序。


  通过将这些考虑因素整合到云应用程序的设计、开发和运营中，组织可以创造出符合更广泛 ESG 原则、并对世界产生积极影响的技术。


