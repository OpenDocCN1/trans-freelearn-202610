- '# 第 3 部分：用云引领和转变您的业务


  在本部分中，我们将学习如何设计一个具备云就绪能力的 IT 企业，以及数字化转型的各个方面。我们还将回顾企业如何利用云技术进行领导和创新。最后，我们将重点探讨企业如何在云端负责任地进行创新，特别关注环境、社会和治理（ESG）以及可持续发展目标。


  本部分包含以下章节：


  * *第 8 章*，*架构设计云就绪企业*

  * *第 9 章*，*数字化转型的各个方面*

  * *第 10 章*，*用云引领和创新*

  * *第 11 章*，*ESG 与可持续性*

  '
- "## 8 架构设计云就绪企业\n\n成功的企业有什么共同点？它们都具备保持敏捷且与时俱进的根本能力，以满足消费者的需求和期望。正如我们在前面章节中探讨的那样，当今商业环境中的业务与科技的影响密不可分。麦肯锡的研究发现，2000\
  \ 年标准普尔前 10 家公司的中位年龄为 85 岁，而到 2018 年已降至 33 岁 *\\[1\\]*。更有趣的是，该研究估计到 2027 年，标普 500\
  \ 成分公司的平均存续时间将仅为 12 年。在当今的数字经济中，随着独角兽初创企业通过现代科技颠覆市场，企业生存和持续发展的能力在很大程度上取决于通过战略性地利用技术保持敏捷。\n\
  \n在上一章中，我们探讨了企业如何采用云策略以实现数字化转型。在本章中，我们将讨论如何架构设计一个云就绪企业，从而提高组织保持灵活、更快地对消费者需求做出反应和响应，并领先于竞争对手的能力。在本章中，我们将探讨以下主题：\n\
  \n* 一个具有明确观点的混合云框架，可作为架构设计中立厂商的云就绪企业的基础蓝图\n\n\n\n\n*   主要云服务提供商（AWS、Google Cloud\
  \ 和 Azure）的规范性云架构框架\n*   私有云和混合云策略\n\n# 为云就绪型企业构建框架\n\n成熟企业通常拥有现有的数据中心，具有大量的基础设施、技术和软件资产，从零开始并不现实。在前几章中，我们讨论了领导力在引领和规划成功数字化转型道路中的关键作用，以及愿景、意愿和思维转变的重要性。现在我们已经确立了由云技术主导的全企业范围数字化转型的必要性，重新定义和构建基础构建模块以使\
  \ IT 组织走向成功变得至关重要。这引出了对规范性框架的根本需求，无论选择何种平台或提供商。许多企业陷入了采用速成、一次性转型的陷阱，由于缺乏坚实基础，这些转型往往以失败告终，导致复杂性、工作量和成本方面出现不良结果。例如，Acme\
  \ Corp. 在没有强大数据基础的情况下投资现代数据分析解决方案，引发了数据集成和语义层重新设计的巨大复杂性和成本，同时仍无法在正确的时间将正确的数据提供给正确的角色。\n\
  \n在本节中，我们将探讨一个与提供商无关的框架，它有助于重新定义和构建云就绪型企业，无论企业部署平台如何。这是一个我创建、倡导并为企业架构师和 IT 领导者开具的有主见的框架，它遵循并符合一些通用的企业架构框架。典型的企业\
  \ IT 占地面积通常包含本地数据中心、任务关键型应用程序（包括遗留应用程序）、支持 SaaS 的业务职能，以及可能混合的私有云和公有云服务。企业在这种模式下面临的一个共同挑战是如何在确保业务连续性的同时达到云原生状态。根据\
  \ `Cloud Native Computing Foundation` (`CNCF`) 的定义，“*云原生技术使组织能够在现代动态环境（如公有云、私有云和混合云）中构建和运行可扩展的应用程序。容器、服务网格、微服务、不可变基础设施和声明式\
  \ API 体现了这种方法。*” *[2]*。云原生方法使企业能够构建松耦合、具有弹性、可管理和可观测的系统，同时能够频繁且可预测地交付高影响力的变更。\n\n\
  企业通常也会开始遵循云原生架构构建全新的应用程序。然而，如果没有云基础和生态系统来支持它，这可能导致孤岛效应，难以与现有的本地系统和应用程序集成，甚至导致复杂性和工作量增加。将应用程序广泛分类并识别为三个主要类别也将被证明是明智之举：\n\
  \n*   **遗留应用程序**：这些是服务于企业主要业务职能且对业务至关重要的应用程序。这些应用程序通常需要更长的路线图才能完全转型到云端，最适合在现有的本地环境中运行。\n\
  *   **云就绪型**：这些是使用传统软件开发方法设计和构建的应用程序，但有潜力重新平台化或重构以在云环境中运行。\n*   **云原生**：这些通常是诞生于云端的应用程序，或从头重新架构以成为云原生的应用程序。\n\
  \n以下是构建云就绪型企业架构时的一些主要目标：\n\n*   通过提高开发速度和开发人员生产力，改善业务敏捷性和上市速度\n*   减少支持业务职能和增长所需的\
  \ IT 工作量和时间——考虑基础设施扩展、补丁管理、DevOps、自动化、升级和维护\n*   确保应用程序可用性、可扩展性和弹性作为基本要求\n*   支持创新、原型设计和利用现代技术快速试验新想法的环境\n\
  *   通过采用开放标准和开放技术，确保应用程序可移植性并减少对底层基础设施和平台的依赖\n\n**图 8.1** 描述了企业混合云框架的核心组成部分和层级：\n\
  \n![图 8.1 – 企业混合云框架的层级](img/B18893_08_1.jpg)\n\n图 8.1 – 企业混合云框架的层级\n\n现在，让我们详细回顾这些层级。\n\
  \n## 云基础层\n\n这是最重要的基础层，由基础设施服务和平台服务的组合构成。该层的主要目标是将底层核心基础设施与应用服务解耦，以确保可移植性和平台无关的部署。云基础层中需要考虑的一些关键架构组件如下：\n\
  \n*   网络基础设施现代化\n*   计算基础设施现代化\n*   存储基础设施现代化\n*   云原生应用设计原则\n\n### 网络基础设施现代化\n\n\
  无论是私有云、公有云还是多云策略，成功数字化转型最关键的因素都是网络基础设施。不幸的是，当企业努力尽可能高效地向客户交付新产品和服务时，这往往也是许多企业最容易忽视的方面。在传统方法中，网络边界被限制在可预测的范围内并得到加固，遵循单一窗口访问策略。这更容易构建、控制、保护和管理。然而，在数字化时代，网络边界已扩展以满足多种需求，并开放了多个入口和访问点。例如，引入\
  \ SaaS 服务以满足特定业务需求、采用一个或多个公有云平台、全球办事处和远程办公的企业合作伙伴、通过 5G 等现代协议连接到企业网络的物联网设备、供应商和合作伙伴的第三方访问、在边缘或门店部署计算设备——所有这些都导致网络边界模糊，凸显了网络基础设施现代化的必要性。随着数字化转型的加剧，企业网络的商业价值从未如此之高。\n\
  \n传统网络从根本上建立在涉及物理网络、路由器、交换机、基于硬件的负载均衡器、网络安全设备和协议标准的前提上，这些通常由各个网络或设备供应商定义。在传统网络基础设施中，数据平面和管理平面紧密耦合，每当网络需要变更时，都需要巨大的工作量来进行设备配置。相比之下，现代基于云的基础设施依赖\
  \ `software-defined networking` (`SDN`) 原则，抽象掉了物理网络基础设施。`SDN` 将控制平面与数据平面解耦，使网络管理员能够近实时地传播网络配置和变更。\n\
  \n`SDN` 实现了一项关键能力，即网络管理员可以使用标准 `SDN` API 像操作软件一样操作和管理网络。`SDN` 为企业启用的一些关键能力如下：\n\n\
  \n\n\n# 云基础现代化\n\n## 网络基础设施现代化\n\n- **开放标准**：基于 SDN 的架构通过开放 API 引入开放标准，以支持多云和供应商中立的互操作性。这也有助于网络运营商通过\
  \ API 管理网络服务和控制。\n- **网络抽象**：SDN 带来的主要优势是对底层网络硬件和技术的抽象，从而实现无缝连接和互操作性。\n- **网络智能**：传统网络本质上是分布式的，对网络状态的感知有限，而基于\
  \ SDN 的网络提供集中式的基于策略的控制，利用人工智能来管理网络性能、带宽和安全性。\n\n这种网络现代化不仅仅局限于数据中心。随着 SD-WAN 的出现，企业可以采用软件定义的方法，为企业范围内的业务应用提供安全可靠的访问。\n\
  \n## 计算基础设施现代化\n\n在典型企业中，传统的本地计算基础设施通常包含多种计算资源，涵盖商品化的通用硬件基础设施以及专业化的专有超融合基础设施。专门负责管理传统数据中心基础设施的团队，其大部分工作集中在维护和修补活动、管理硬件刷新周期以及维持日常运行上。\n\
  \n随着业务对更现代、更先进、更强大计算资源的需求持续增长，例如**高性能计算**（HPC）、**图形处理单元**（GPU）和**张量处理单元**（TPU），数据中心的管理和维护对企业来说正变得成本高昂。云平台使各种计算能力的获取变得大众化，改变了组织快速试验和使用计算资源的方式，无需承担长期承诺、维护和刷新开销。\n\
  \n以下是企业在设计面向云就绪的计算基础设施时可以采纳的一些最佳实践，尤其是在混合云的背景下：\n\n- **虚拟化和容器化**：通过利用开放标准的虚拟化和容器化技术，组织可以创建独立于底层物理基础设施的抽象计算环境。这提高了计算资源的灵活性、可移植性和可重用性。\n\
  - **基础设施即代码（IaC）**：IaC 工具使组织能够将计算基础设施定义为代码，自动化调配、配置和管理。这简化了流程，减少了错误，并确保了跨环境的一致性。\n\
  - **计算实例标准化**：在两种环境中建立标准的实例类型和配置，可以简化容量规划、资源分配和成本管理。组织可以通过利用一致的配置来优化其计算基础设施。\n-\
  \ **集中式镜像管理**：为操作系统和应用镜像建立集中式存储库，可确保一致性、安全性和合规性。通过维护单一的镜像来源，组织可以简化计算环境的部署和维护。\n\
  - **混合云管理平台**：混合云管理平台提供了一个集中式仪表盘，用于管理本地和云环境中的计算资源。它支持无缝工作负载迁移、资源优化和简化管理。\n\n组织还可以从实施自动化修补流程、建立全面的监控和日志系统，以及设计覆盖本地和云环境的统一**灾难恢复**（DR）和**业务连续性计划**（BCP）中受益。\n\
  \n## 存储基础设施现代化\n\n随着企业采用混合云以同时获得本地环境和云环境的优势，必须对存储基础设施进行现代化和标准化，以优化效率和灵活性。典型的本地存储解决方案包括用于块级存储的**存储区域网络**（SAN）、用于文件级存储的**网络附加存储**（NAS），以及用于存储和管理企业数据的**对象存储设备**（OSD）。\n\
  \n云原生存储服务通过利用对象存储处理大型数据集、块存储处理高性能应用、文件存储处理传统文件型工作负载，提供可扩展、弹性且经济高效的存储解决方案。除云原生存储解决方案之外，企业还可以采用\
  \ S3 API 等通用协议，在混合云环境中访问存储解决方案，同时利用存储网关无缝处理本地和云端之间的数据类型和协议。\n\n以下是在混合云环境中标准化和现代化存储基础设施的一些最佳实践：\n\
  \n- **存储虚拟化**：使用存储虚拟化技术将存储基础设施资源从物理基础设施中抽象出来，以实现无缝数据访问和迁移，并提高资源利用率。\n- **数据分层**：在存储基础设施设计方面，根据数据访问、频率、合规性和性能需求实施分层存储策略始终是最佳实践。例如，可以对频繁访问的数据使用高性能存储，对归档数据使用经济高效的存储。\n\
  - **统一数据管理**：实施统一数据管理平台，为管理本地和云环境中的存储提供单一管理视图，实现集中化的数据可见性、控制和治理。\n- **数据加密与安全**：对静态数据和传输中的数据进行加密，确保数据的机密性和安全性。实施访问控制策略和审计机制，防止未经授权的访问。\n\
  - **备份与灾难恢复**：建立包含本地和云端存储的稳健备份和灾难恢复策略，以确保在发生故障或灾难时数据保护和业务连续性。\n\n在回顾了云基础层的核心基础设施组件——网络、计算和存储——之后，让我们探讨企业如何在利用云原生原则的同时设计和构建现代应用。\n\
  \n## 设计云原生应用\n\n随着云原生技术催化应用开发、部署和管理方式的革命性转变，建立一个一致、开放且可移植的平台以支持云原生架构至关重要。云原生是一种构建现代应用的软件方法，这些应用具有高度可扩展性、灵活性和弹性，组织在交付软件应用时可以获得显著的竞争优势，例如提高效率、平台独立性、更快上市，以及降低技术债务和整体\
  \ TCO。\n\n传统的软件应用开发采用单体方法，所有应用功能都位于一个单一的块式结构中，之后移交给运维团队进行软件交付和管理。对应用的任何细微更改都需要进行长时间、全面的回归测试和部署。\n\
  \n相比之下，云原生应用提倡微服务架构方法，将应用拆分为更小的微服务，这些微服务协同工作以提供应用功能。这意味着开发团队可以独立地处理各自的服务，这些服务可以被独立地管理、运维和扩展。\n\
  \n\n\n\n站在这场变革最前沿的是 CNCF，它是一个开源的、厂商中立的云原生计算中心，推动着创新、标准化和社区参与。订阅 CNCF 项目和标准可以为企业提供一套丰富的技术产品，这些产品遵循云原生架构的核心原则。一些流行且值得关注的\
  \ CNCF 项目包括 Kubernetes、Istio、Envoy、Fluentd、Helm 和 Prometheus。更重要的是，几家主要云服务提供商都是\
  \ CNCF 的活跃贡献者。在当代数字化环境中，采用云原生基础对企业至关重要，且是成功数字化转型的典型要素，无论部署模式是私有云、公有云还是混合云。其核心在于，云原生架构遵循以下指导原则：\n\
  \n![Figure 8.2 – Guiding principles of cloud-native applications](img/B18893_08_2.jpg)\n\
  \n图 8.2 – 云原生应用的指导原则\n\n让我们逐一了解这些原则：\n\n* **不可变基础设施**：该原则是云原生架构的首要要求，即底层基础设施与应用程序完全解耦。以声明方式部署的应用程序定义了底层基础设施需求，并可在任何满足该需求的基础设施上运行。这提倡了*将基础设施视为牲畜而非宠物*的理念。例如，单体应用必须依赖非常特定的同构基础设施组件，缺少这些组件就会失败。相比之下，云原生应用本质上是分布式的，可以在硬件故障、计划内或计划外停机或扩缩容事件等情况下丢弃底层基础设施。\n\
  \n* **微服务架构**：微服务架构是一种现代软件设计实践，应用程序由小型、独立的服务组成，每个服务专注于特定的业务能力。与传统单体架构不同，微服务将复杂应用拆解为模块化、松耦合的组件，它们独立运行、通过定义良好的\
  \ API 通信，并可独立开发、部署和扩展。这促进了敏捷性、可扩展性和易维护性，使组织能够快速适应不断变化的需求，并为应用程序的不同部分利用多样化技术。\n\n\
  * **容器和镜像仓库**：容器是轻量级、可移植且自给自足的单元，封装了软件及其依赖项，确保在各种计算环境中一致且可靠地执行。这提供了一个隔离且标准化的运行时环境，允许开发人员将应用程序与所有必要的库和依赖项打包在一起，无论底层基础设施如何，都能独立运行。容器化技术（以\
  \ Docker 为代表）简化了开发和部署流程，增强了可扩展性，并促进了微服务架构的创建。容器在实现高效、一致的应用交付方面发挥着关键作用，贯穿开发、测试到生产的全过程，促进了更敏捷、可复现的软件开发生命周期。\n\
  \n* **API 优先**：云原生应用提倡 API 优先设计，这是微服务在应用内部以及跨应用通信中的规定通信模式。API 有助于解耦应用程序间的相互依赖，并为请求响应定义契约。\n\
  \n* **服务网格**：服务网格是一个专用的基础设施层，用于促进分布式应用中微服务之间的通信、管理和控制。它充当一个透明的、与语言无关的网络，处理服务间通信，从而在微服务架构中实现更好的可观测性、可靠性和安全性。服务网格（如\
  \ Istio 和 Linkerd）提供流量管理、负载均衡、加密和监控等功能，使开发人员更容易构建有弹性和可扩展的应用程序。它们抽象掉了网络通信的复杂性，使开发团队能够专注于构建和维护微服务的功能，而不必纠结于网络问题。\n\
  \n如*图 8.3*所述，云原生应用栈包含以下层：\n\n* **基础设施**：这是基础层，由计算资源组成，包括操作系统、网络和存储，这些通常由云服务提供商或平台管理。\n\
  \n* **供应/配置**：这是云原生栈中的第一层，包含用于配置、构建和加固应用程序基础的工具。该层包括用于自动配置、创建和管理底层基础设施的工具，以及用于容器镜像扫描和存储的工具。\n\
  \n* **运行时**：该层提供容器运行所需的技术和工具，包括访问云原生存储、云原生网络和容器运行时。\n\n* **编排和管理**：云原生应用天生具备可扩展性并依赖自动化。该层包含管理容器化服务的工具，如服务编排、服务发现、调度、服务代理、API\
  \ 网关和服务网格。\n\n* **应用定义和 DevOps**：这是 CNCF 栈的顶层，专注于开发和部署云原生应用的工具。这包括数据库、流处理、消息传递、应用定义、镜像构建和\
  \ CI/CD 工具。\n\n* **可观测性和分析**：可观测性和分析是云原生应用的关键层之一，因为它提供工具来度量、记录、监控、追踪和分析应用的各个方面，以检测和修复异常：\n\
  \n![Figure 8.3 – Layers of a cloud-native application](img/B18893_08_3.jpg)\n\n\
  图 8.3 – 云原生应用的层级\n\n正如我们所见，虽然构建云原生应用带来了规模、弹性、灵活性和效率等优势，但企业仍必须制定计划来管理遗留应用并与之集成。让我们回顾一些策略，帮助遗留应用与其云原生对应应用共存。\n\
  \n## 遗留应用\n\n对于踏上混合云战略的企业来说，周密的规划和路线图对于运行和维护遗留应用至关重要。在企业语境下，这些通常是无法在云原生环境中轻松重新架构、重新平台化或重构，但仍然至关重要的业务应用。正如我们在*第\
  \ 5 章**《企业云转型之旅》*中回顾的云迁移“6 R”策略，这些应用将归入*保留直至退役*类别。企业可以根据特定业务需求采用多种策略：\n\n* **数据优先方法**：在该方法中，从遗留系统中提取关键数据并迁移到云原生数据库。此策略可帮助企业释放数据价值，利用多种云能力，包括利用数据进行人工智能/机器学习建模、分析和报告，从而减少对遗留系统在外围需求上的依赖。\n\
  \n* **重构**：根据考虑的遗留应用或系统，企业可以利用代码转换或翻译工具将应用迁移到云就绪或云原生技术栈。\n\n\n\n\n- **重构（Re-architect）**：如果没有紧迫的压力，例如即将到期的合同续约或数据中心退出计划，企业可以选择重构并重写遗留应用程序，无论是原生地重构在云上，还是用\
  \ COTS（商用现成软件）或 SaaS（软件即服务）产品来替代它们。这种策略通常耗时较长，但拥有从头开始（clean slate）的优势。\n- **重新托管（Rehost）或云邻接**：如果面临即将到来的数据中心退出，或者企业\
  \ IT 的重心已转移到公共云模式，这通常是速度最快的选择。将遗留系统重新托管到紧邻公共云的托管数据中心中，可以提供云服务之间的低延迟连接，提高运营效率和 IT\
  \ 管理维护工作的效率，同时降低 TCO（总体拥有成本）。在遗留系统的功能正在云上原生重构的过渡阶段，这也可能是一个中期策略。\n- **API 黑盒**：根据遗留系统的类型，组织通过中间件或\
  \ API 网关实施集成策略将更为明智，这可以在无需底层或专有连接的情况下实现对遗留应用程序的连接。例如，云服务或云原生应用程序可以通过 API 与遗留应用程序无缝交互，而无需考虑遗留系统运行在何处以及如何运行。\n\
  \n## 应用开发与运维\n\n在确定了针对遗留应用程序的策略后，让我们将注意力转移到企业内其他类别的应用程序上。我们可以将应用程序大致分为四类：云原生应用、云就绪应用、云附加应用和新兴技术应用。让我们简要定义这些分类：\n\
  \n- **云原生应用**：这些是*生于云*的应用程序，完全按照云原生原则从底层进行架构设计和开发。当企业着手进行云转型时，这一类应用起初规模较小，随着应用程序的现代化改造而逐渐增长。\n\
  - **云就绪应用**：这些应用程序可以通过少量的重构或重新平台化工作来确保其云就绪状态，但无法充分利用云原生能力。例如，应用程序的某些组件，如 Web 服务器、操作系统、负载均衡器或数据库，可以被重新平台化为云原生（即服务）组件，而应用程序本身基本保持不变。通常，这是企业在分阶段进行云原生转型过程中的一个中间阶段。云就绪演化架构中的一个关键模式是*绞杀榕（strangler\
  \ fig）*模式 *\\[3\\]*。与完全重写应用程序不同，这种模式允许重构应用程序的部分，同时使它们仍然能与原始的单块应用程序通信。\n- **云附加应用**：这是可以利用现有云解决方案的一类应用程序。一些例子包括可以基于现有云应用程序或数据快速构建的低代码或无代码解决方案，以及为\
  \ SaaS 应用程序定制开发的扩展功能。这些应用程序通常支持特定的业务功能和需求，开发部署速度快。\n- **新兴技术**：这些应用程序是云转型的创新基石。该类别的应用程序利用新兴技术为企业产品组合带来全新能力。该类别的应用程序通常是人工智能、区块链、机器人、AR/VR\
  \ 等新兴技术的早期采用者。这些应用程序的成功采用和部署将作为其他应用程序的指引灯塔。\n\n## API 编排与集成层\n\n在云原生应用程序架构领域，API\
  \ 编排和集成在发挥云计算全部潜力方面起着关键作用。云原生应用由众多微服务组成，每个微服务负责特定功能，API 实现了这些服务之间的无缝通信和数据交换。在混合云的背景下，API\
  \ 和编排层起着至关重要的作用，因为它有助于抽象底层基础设施和服务，使开发人员能够专注于业务逻辑，而不是复杂的集成。这种抽象能力使组织能够提高敏捷性和灵活性，以应对不断变化的业务需求。\n\
  \nAPI 编排和集成层也是帮助提高应用程序可扩展性和性能的重要组成部分。这通过管理 API 流量、负载均衡和缓存来实现。通过优化 API 交互，该层增强了应用程序性能，并确保系统在重载下仍保持响应性。由于现代应用程序通常依赖于外部服务（如支付网关、分析平台和社交媒体集成），API\
  \ 编排和集成层通过提供标准化接口并管理 API 凭据和认证，简化了与这些服务的集成过程。这也有助于简化开发流程，并减少与第三方集成相关的运营复杂性。\n\n\
  API 编排和集成层提供的另一个显著优势是安全和治理控制。经过良好架构设计的 API 层是流量管理、实施安全策略（如身份验证、授权和威胁检测）的中心点。以下是一些有助于解锁云原生计算益处的考量事项和最佳实践：\n\
  \n- **定义 API 标准**：建立清晰的 API 标准和治理对于可扩展性和互操作性至关重要。这包括定义一致的命名约定、数据格式和安全协议。企业还应考虑 REST\
  \ 或 GraphQL 等行业最佳实践，以确保互操作性和可维护性。\n- **实施 API 网关**：API 网关是所有 API 请求的入口点，提供请求路由、负载均衡、身份验证和速率限制等功能。网关将底层微服务从外部消费者处进行抽象，提供统一的接口和增强的安全性。\n\
  - **构建服务网格**：对于复杂的微服务环境，服务网格极具价值。它在服务间通信层面提供服务发现、流量管理、可观测性和安全性。服务网格增强了云原生应用程序的可靠性和弹性。\n\
  - **第三方集成**：API 编排和集成层应支持与第三方服务的无缝集成。对于组织来说，考虑提供全面连接器和适配器套件的 API 堆栈将是明智之举，以简化与数据库、外部\
  \ API 和消息队列的连接。\n- **治理**：强大的监控和分析对于了解 API 使用情况、识别性能瓶颈和检测安全威胁至关重要。企业应实施工具来跟踪 API\
  \ 指标、生成警报，并提供见解以支持持续改进。\n\n### 可观测性与分析层\n\n\n\n\n随着云原生应用为现代 IT 基础设施带来前所未有的灵活性和可扩展性，可观测性成为确保云原生系统可靠性、性能和安全性的一个极其重要的因素。可观测性是指根据系统的外部输出洞察其内部状态的能力。在云原生应用的背景下，可观测性涵盖了整个软件栈的监控、日志记录、追踪和指标收集，从单个微服务到底层基础设施组件。采用全面的可观测性实践使组织能够有效地实时检测、诊断和排查问题，从而提高系统可靠性和正常运行时间。在设计可观测性和分析层时，特别是对于采用混合云策略的企业，以下是一些需要考虑的关键因素：\n\
  \n* **集中式日志聚合**：可观测性的基础在于集中式日志聚合。企业应实施一套统一的工具，从本地和云环境中的各种来源（包括应用程序、基础设施和网络设备）收集、存储和索引日志，以获得系统事件的综合视图。\n\
  \n* **监控和指标**：建立强大的监控能力，持续监控关键性能指标并发出警报，例如 `CPU utilization`、`memory usage` 和 `network\
  \ latency`。企业可以利用提供实时仪表板、警报和历史趋势分析的监控工具。\n\n* **分布式追踪**：对于复杂的微服务架构，实施分布式追踪能力至关重要，因为它允许企业跟踪请求在其遍历多个服务的过程，从而识别瓶颈、性能问题和依赖关系。为了实现更高层级的治理和可观测性能力，组织还可以专注于在分布式追踪的基础上实施\
  \ `business transaction management` (`BTM`) 能力，以深入了解业务交易与后端 IT 服务的关联情况。\n\n* **基础设施可观测性**：在混合云环境中，监控本地和云中基础设施的健康状况和性能至关重要。这包括监控计算实例、存储系统和网络资源的指标。企业应利用云原生监控服务或第三方工具来获得对其基础设施的可见性。\n\
  \n* **应用性能管理 (APM)**：`APM` 工具提供对应用性能的深度洞察，包括响应时间、错误率和代码级分析。通过监控最终用户体验，企业可以主动解决性能问题并优化应用功能。\n\
  \n* **安全监控和警报**：可观测性延伸至安全监控。企业应实施工具以检测潜在威胁，例如可疑的网络活动、未经授权的访问尝试和漏洞利用。自动化警报和事件响应机制对于降低安全风险至关重要。\n\
  \n### 数据管理层\n\n随着数据呈指数级增长，在云原生环境中设计数据栈是一项战略性工作，要求在可扩展性、弹性和价值创造之间取得微妙的平衡。传统的本地数据栈本质上是孤岛式的，并且不断面临数据快速增长、规模扩大、数据蔓延、数据重复和适应性挑战。云原生数据管理方法要求一个开放的数据栈，该栈去中心化、API\
  \ 驱动，并优先考虑数据模块化，以支持不断增长的业务需求。`IDC` 估计，全球数据圈将从 `2018` 年的 `33ZB` 增长到 `2025` 年的 `175ZB`，增长\
  \ `530%` [4]。`Harvard Business Review` (`HBR`) 的另一项研究表明，组织中用于决策的结构化数据不到 `50%`，非结构化数据不到\
  \ `1%`。这清楚地表明，数据收集和数据处理在企业内部不是挑战，但在正确的时间激活正确的数据并采取行动以创造正确的价值仍然是一个主要瓶颈。在某种程度上，云和现代技术（如边缘计算、移动、\
  \ `IoT` 和 `artificial intelligence`/`machine learning`）的出现只会加剧数据挑战。例如，在典型企业中，数据源曾主要来自企业应用程序和系统，现在涵盖来自\
  \ `SaaS` 应用程序、供应商、合作伙伴、消费设备、市场趋势、第三方数据和 `IoT` 设备的数据。现代数据战略的核心原则包括从单体数据平台向具有联邦数据访问的灵活、专用数据集群的战略转变，以及通过\
  \ `data-as-a-product` 构建实现数据所有权和访问的民主化。让我们简要回顾现代数据分析平台的核心阶段：\n\n* **数据摄取**：现代数据平台必须支持从各种来源摄取数据，包括实时流式传输、事务系统、与\
  \ `SaaS` 系统的集成，以及结构化、半结构化和非结构化数据。\n\n* **数据存储**：传统数据组织拥有众多数据平台和技术，遍布整个领域，包括事务系统、专有数据格式、超融合数据仓库和难以扩展的数据湖。这通常意味着在系统间不断移动数据，导致数据蔓延。利用支持\
  \ `Avro`、`Apache Parquet` 和 `Iceberg` 等开放文件格式的分析湖仓方法可以标准化数据存储，无论底层平台如何。现代云数据平台还必须支持数据存储层和数据处理层的关注点分离，使其能够独立扩展。数据存储层还必须为各种数据消费者提供无缝的读写\
  \ API。\n\n* **数据处理**：这是关键层，因为组织必须在此设计 `data-as-a-product` 架构。在 `data mesh` 架构中，数据在区域间处理和移动，以根据业务需求实现跨企业的消费。数据网格旨在将数据生产者直接连接到业务用户，以获取最大价值。我们将在\
  \ *第 9 章**、数字化转型的侧面* 中深入探讨数据网格架构。云原生数据处理平台的另一个关键考虑因素是利用无服务器能力的能力。例如，在传统数据系统中，数据处理层随数据存储成比例扩展。然而，无服务器数据解决方案可以在成本、时间和精力方面提供显著收益，并根据数据处理的持续时间按需弹性扩展。\n\
  \n* **数据消费者**：解耦数据层使各种应用消费者能够利用来自传统 BI 分析工具和数据科学的数据。例如，报告应用程序可以直接在精选数据的语义层上交互，而机器学习应用程序可以在原始数据湖上工作，而不是复制它，从而加速价值实现时间。\n\
  \n* **数据治理**：建立统一的数据治理提供了一个中心位置，用于管理、监控和治理湖仓中的数据，并使其安全地可供各种数据分析和数据科学工具访问。该层包含三个主要关注点：\n\
  \n    * **数据管理**：这涉及数据搜索、发现、数据血缘、数据安全、数据访问和数据质量等关注点。\n\n\n\n\n\n## 数据层\n\n*   **可观测性**：这涉及数据\
  \ SRE、日志记录、监控和告警。\n\n*   **数据编排**：这涉及自动化数据工作流编排、创作管道、调度和监控。\n\n*   **数据 FinOps**：数据\
  \ FinOps 代表了数据管理的战略演进，其中财务考量成为决策过程不可或缺的一部分。随着组织在复杂的数据环境中航行，实施数据 FinOps 原则可带来成本优化、改进资源分配，并采取更负责任、更具战略性的数据投资方法。它还有助于组织识别未充分利用的资源并优化数据工作流。更重要的是，通过了解不同数据流程的成本影响，组织可以优先投资于能带来最大影响和价值的领域。\n\
  \n## 自动化和治理层\n\n自动化和治理是一个横切层，对于确保云原生应用安全、合规、高性价比地部署和运行以实现可持续增长和成功至关重要。云原生应用旨在利用云基础设施和微服务架构，需要全面的自动化实践来简化部署、扩展和管理。此外，治理框架确保合规性、安全性和成本效率，为成功的云原生运营提供必要的护栏。以下是企业在混合云环境背景下采用云原生实践时的一些最佳实践和考量因素：\n\
  \n*   **`IaC`**：`IaC` 通过自动化手动活动发挥着关键作用。通过使用 `Terraform` 或 `Ansible` 等工具将基础设施配置代码化，企业可以自动完成基础设施预置、管理和更新。这减少了人为错误，强制执行一致性，并加速了部署流程。\n\
  \n*   **配置管理**：配置管理工具（如 `Puppet` 或 `Chef`）使企业能够集中管理和强制执行期望的应用程序和系统配置。这确保了环境保持一致并符合既定标准。\n\
  \n*   **持续集成和持续交付 (`CI/CD`)**：`CI/CD` 管道自动化构建、测试和部署流程，实现更快、更频繁的软件发布。实施 `CI/CD` 工具使组织能够简化软件交付生命周期并缩短上市时间。\n\
  \n*   **容器编排**：容器编排平台（如 `Kubernetes`）简化了容器化应用的部署、扩展和管理。通过自动化这些任务，企业可以优化资源利用率并降低运营开销。\n\
  \n*   **策略驱动治理**：策略驱动治理对于维持对混合云环境的控制至关重要。通过定义和建立管控资源使用、安全性和合规性的策略，企业可以自动化并强制执行标准，以预防和缓解风险。策略引擎可以自动监控并强制执行这些策略。\n\
  \n## 统一安全层\n\n随着组织越来越多地采用混合云和云原生架构以利用可扩展性、灵活性和创新性的优势，确保这些环境中的强大安全性变得极其关键。混合云环境由本地基础设施和公有/私有云服务组成，给安全团队带来了复杂性和挑战。跨不同环境管理安全策略、访问控制和身份管理可能变得碎片化且难以维护。此外，构建于微服务架构和容器化之上的云原生应用引入了新的攻击向量和安全考量，例如容器漏洞、`API`\
  \ 安全和编排平台安全等。统一安全是指在单一集成框架下保护传统本地基础设施和云原生应用的凝聚力方法。统一安全层提供一致的安全策略、集中式可见性和控制、集成的身份与访问管理、协同的威胁检测与响应，以及简化的合规管理。以下是在设计统一安全层时应考虑的一些最佳实践：\n\
  \n*   **采用零信任架构**：零信任安全架构假设所有用户和设备均不可信，并仅基于显式验证授予访问权限。传统企业基于封锁式 IT 原则运行，由明确的边界管控，通过\
  \ `VPN` 等安全构造更易于管理。随着 IT 环境扩展到传统 IT 边界之外，例如公有云、与外部服务的集成（如合作伙伴网络、`IoT` 网络和 `BYOD`\
  \ 策略）以及全球分布的员工队伍，保护边界变得比以往任何时候都更难。零信任架构主要将安全性从网络边界推向边缘。更重要的是，零信任架构消除了企业的 `VPN` 瓶颈，可显著提升性能和整体安全性。\n\
  \n*   **集中式安全管理平台**：对于拥有混合云策略的组织而言，另一个关键考量是部署能够跨本地和云环境集成安全工具和服务、实现集中式可见性和控制的 `SIEM`\
  \ 解决方案。\n\n*   **身份与访问管理 (`IAM`)**：建立强大的混合 `IAM` 解决方案，配备中央身份提供商，并通过开放安全标准与云服务提供商集成。强制实施\
  \ `MFA`、建立策略驱动的访问控制并自动化审计以审查访问权限和风险也至关重要。\n\n*   **网络安全**：通过 `SDN` 实施细粒度网络分段，并部署下一代防火墙和\
  \ `IDS/IPS` 以防范未经授权的访问和恶意流量。\n\n*   **数据安全**：倾向于使用强加密算法来加密存储在云存储服务、数据库和本地文件系统中的静态数据。根据数据敏感度需求建立安全策略。例如，考虑使用云原生\
  \ `HSM` 来安全地存储和管理加密密钥，同时满足 `FIPS 140-2` 等合规要求。\n\n*   **安全监控和审计**：配置跨本地和云环境的统一安全事件日志记录和监控。利用威胁情报源和漏洞扫描工具识别潜在威胁。建立事件响应和取证分析的安全治理流程，并维护安全事件和安全态势变更的可审计日志。\n\
  \n在探讨了混合云基础设施的各个层面以及企业如何构建云原生框架之后，让我们简要回顾一下主要云服务提供商倡导的规范性云架构框架。\n\n# 主要云服务提供商的云架构框架\n\
  \n\n\n\n\n在本节中，我们将探索并回顾主流云服务商（CSP）所规定的云架构框架。这些框架是多年云经验的结晶，它们不断更新，并反映了帮助组织构建安全、具有弹性且高效的云基础设施的最佳实践和指南。它还充当了企业架构师以及开发运营（DevOps）团队的蓝图，使其能够与行业最佳实践保持一致并据此进行适应。无论企业的战略是完全部署在单一云上，采用混合云方法，还是多云策略，企业架构师制定一个符合开放标准、缓解供应商锁定、评估权衡并确保可移植性的云策略都是明智之举。\n\
  \n由于这些框架通常可以在在线找到，并由各自的云服务提供商维护并保持最新状态，因此我们只会简要介绍每个供应商所倡导的理念和重点领域。虽然你会发现这些云提供商所倡导的一些支柱和概念有很多共同点，但承认它们独特的观点也很重要，同时也应认识到这些原则必须适应组织所选择的云策略。你可以通过参考章节末尾提供的链接，在*Further\
  \ reading*（延伸阅读）部分了解有关这些框架的更多信息。\n\n## AWS 善构框架（Well-Architected Framework）\n\n\
  **AWS 善构框架（AWS Well-Architected Framework）** 是一套基于六大关键支柱——运营卓越、安全性、可靠性、性能效率、成本优化和可持续性*[5]*——用于设计和在\
  \ AWS 云上运行应用程序的最佳实践。该框架旨在面向 CTO、企业架构师、开发人员及运维团队成员，并提供一种一致的架构方法，帮助从 AWS 中获得最大价值。它还能使云架构师在\
  \ AWS 上构建可扩展、可持续且高性能的应用程序。善构框架还为各个行业和技术领域提供了特殊指导——这些通常被称为 AWS 善构透镜（Well-Architected\
  \ Lens），例如政府架构透镜、医疗行业透镜、混合网络透镜和机器学习透镜等。AWS 还提供了一种名为 AWS 善构工具（AWS WA Tool，又称 AWS\
  \ 善构工具）的云服务，帮助审查和衡量应用程序架构是否符合最佳实践。该工具还提供改进工作负载可靠性、安全性、性能和成本的建议。AWS 善构框架组织为以下六大支柱或类别：\n\
  \n![Figure 8.4 – AWS 善构框架的表示图](img/B18893_08_4.jpg)\n\n图 8.4 – AWS 善构框架的表示图\n\n\
  让我们仔细看看。\n\n### 运营卓越支柱\n\n运营卓越支柱专注于运行和监控系统以持续交付业务价值。该支柱倡导自动化、频繁测试以及改进运营程序，以提高效率并保持强大的运营卓越性。它包括将基础设施和运营程序视为代码、进行小型且可逆的变更、利用托管服务、定期改进程序以及预期故障并从中学习。\n\
  \n### 安全设计支柱\n\nAWS 善构框架的安全支柱专注于保护 AWS 工作负载，并保护数据和系统的机密性、完整性和可用性。它包含五个关键组成部分：IAM（身份和访问管理）、检测控制、基础设施保护、数据保护以及事件响应。IAM\
  \ 涉及管理用户访问和权限，以确保只有授权人员才能访问敏感资源。检测控制提供机制来监控和检测安全事件，例如恶意活动或未经授权的访问尝试。基础设施保护包括保护网络、计算资源和存储系统免受外部威胁的措施。数据保护涉及实施加密、数据分类和备份策略，以保护数据的机密性和完整性。最后，事件响应专注于建立响应和恢复安全事件的程序，以最大程度减少损害并确保业务连续性。通过解决这些方面，安全支柱旨在创建一种强大的安全态势，保护\
  \ AWS 资源和工作负载免受各种威胁。\n\n### 可靠性设计支柱\n\nAWS 善构框架的可靠性支柱强调设计和运行能够承受故障并快速恢复的系统。它包含五个组成部分：工作负载可用性、服务配额、变更管理、灾难恢复（DR）以及测试。工作负载可用性专注于确保系统以最大化正常运行时间并最小化中断的方式进行设计和部署。服务配额帮助组织理解和管理工作负载限制，以防止因超出这些限制而导致的可靠性问题。变更管理涉及实施过程来控制和跟踪环境中的变更，从而降低计划外中断的风险。灾难恢复（DR）计划概述了在发生重大中断时恢复系统和数据的程序。最后，测试涉及定期验证恢复程序和故障转移机制，以确保系统能够迅速从故障中恢复并保持业务连续性。\n\
  \n### 性能效率设计支柱\n\nAWS 善构框架的性能效率支柱指导组织选择并优化云资源，以平衡成本和其他考量，同时实现所需的性能水平。它由五个组成部分构成：资源选择、弹性、监控与可观测性、数据管理以及权衡。资源选择涉及根据工作负载要求选择合适的计算、存储和网络资源。弹性使系统能够动态扩展资源以满足变化的需求。监控与可观测性提供系统性能的见解，使组织能够识别瓶颈并相应地优化资源。数据管理专注于优化数据存储和访问模式以提高性能。最后，权衡强调需要在性能目标与成本、安全性和可用性等要素之间取得平衡，确保整个系统高效地满足所需的性能目标。\n\
  \n### 成本优化设计支柱\n\nAWS 善构框架的成本优化支柱专注于在保持服务质量并满足业务需求的同时管理和降低云成本的策略。它包含五个组成部分：资源优化、成本分配与跟踪、生命周期管理、预留实例与节省计划，以及持续优化。资源优化涉及最大化资源利用率并消除浪费。成本分配与跟踪使组织能够将成本归因于特定工作负载或部门，促进问责制和明智的决策。生命周期管理有助于管理资源的生命周期，减少与闲置或过度配置资源相关的成本。预留实例和节省计划为可预测的工作负载提供成本节约机制。最后，持续优化要求组织定期审查和调整其云基础设施和使用模式，以识别进一步降低成本的机会。通过实施这些最佳实践，组织可以优化其\
  \ AWS 支出，并最大化从云投资中获得的价值。\n\n### 可持续性支柱\n\n\n\nAWS Well-Architected Framework 的可持续性支柱强调了减少云计算环境影响的重要性。它包含五个要素：环境影响、资源效率、供应链可持续性、数据管理和碳足迹跟踪。环境影响侧重于评估和最小化\
  \ AWS 工作负载的碳足迹。资源效率提倡使用节能资源并优化资源利用率以降低功耗。供应链可持续性鼓励 AWS 供应链中的负责任实践和道德采购。数据管理涉及可持续地管理数据存储和处置，包括最小化数据存储量和实施安全处置方法。最后，碳足迹跟踪使组织能够监控和报告其\
  \ AWS 碳排放，为进一步的优化和减排计划提供见解。通过解决这些方面，可持续性支柱帮助组织最小化其环境影响，并为云计算资源的负责任使用做出贡献。\n\nAWS\
  \ Well-Architected Framework 提供了一套全面的指南和最佳实践，旨在指导组织在 AWS 平台上设计和运行可靠、安全、高效、具有成本效益且可持续的基于云的系统。现在，让我们探讨一下\
  \ Google Cloud Architecture Framework。\n\n## Google Cloud Architecture Framework\n\
  \n`Google Cloud Architecture Framework` 为 IT 领导者、架构师和云从业者提供最佳实践建议，以在 `Google Cloud\
  \ Platform` (`GCP`) 上设计和运行安全、高效、弹性强、高性能且具有成本效益的云拓扑 [6]。该框架倡导的最佳实践和设计建议反映了 Google\
  \ Cloud 不断扩展的能力、行业最佳实践、社区知识和行业反馈。`Google Cloud Architecture Framework` 组织为六个关键类别：\n\
  \n![图 8.5 – Google Cloud Architecture Framework](img/B18893_08_5.jpg)\n\n图 8.5 –\
  \ Google Cloud Architecture Framework\n\n### 系统设计支柱\n\n系统设计支柱构成了 `Google Cloud Architecture\
  \ Framework` 的基础，并提供了一套全面的设计原则、架构建议和最佳实践，用于在 `GCP` 上构建稳健的云基础。这是一套 Google 倡导的非常广泛的系统设计原则，包括选择云区域、管理云资源、设计基础架构（网络、计算、存储）、优化数据库、数据分析，以及实施机器学习策略以设计可持续的云工作负载。系统设计支柱还深入探讨了设计现代云原生架构，如无状态和无服务器架构。重要的是要注意，Google\
  \ 的 Cloud Architecture Framework 将可持续性规定为系统设计的基础方面，而不是将其视为一个单独的支柱。\n\n### 运营卓越支柱\n\
  \n运营卓越支柱提供了关于如何在云中实现运营卓越的指导。该支柱侧重于如何在 Google Cloud 上高效地部署、运行、管理和监控云工作负载。它涵盖了自动化部署、设置监控、告警、日志记录、建立云支持和升级流程、管理容量和配额、规划高峰流量和发布活动、以及创建自动化文化等主题。通过遵循此类别中概述的最佳实践，组织可以提高其云运营的可靠性、可扩展性和效率。该支柱还讨论了支持运营卓越目标的\
  \ `GCP` 产品和功能。\n\n### 安全、隐私和合规支柱\n\n`Google Cloud Architecture Framework` 的安全、隐私和合规支柱是一套详尽的原则，为保护\
  \ `GCP` 内的云资产、数据和工作负载提供指导。Google 首创的一些核心安全原则，如多层纵深防御安全模型、共同命运和零信任，构成了安全支柱的基础。它涵盖了广泛的主题，包括\
  \ Google 倡导的共同命运优于共担责任、风险管理、资产管理、身份和访问管理、计算和容器安全、网络安全、数据安全、应用安全、合规义务、数据驻留和主权要求、隐私要求，以及日志记录和检测控制。通过遵循此类别中的指导，组织可以保护其资产、维护数据隐私并满足监管义务，从而能够自信地在云中运行并蓬勃发展。\n\
  \n### 可靠性支柱\n\n在 `Google Cloud Architecture Framework` 中，可靠性支柱提供了关于在 `GCP` 上设计和维护高弹性服务的指导。该支柱侧重于组织如何定义、衡量和管理可靠性目标，包括定义\
  \ `service-level indicators` (`SLIs`) 和 `service-level objectives` (`SLOs`) 以及管理错误预算以提高云中的服务可靠性。可靠性支柱还提供了云设计模式和操作程序，以便为扩展性、高可用性和业务连续性设计工作负载。通过遵守可靠性原则和最佳实践，组织可以设计和实施高可用、高弹性且能够快速从故障中恢复的系统，确保其基于云的服务平稳运行。\n\
  \n### 成本优化支柱\n\n`Google Cloud Architecture Framework` 中成本优化支柱的主要重点是最大化 Google Cloud\
  \ 中云投资的企业业务价值。成本优化支柱提供了策略和技术，帮助您在 Google Cloud 中管理和优化成本。它涵盖了成本管理的各个方面，包括 `FinOps`\
  \ 采用和实施、监控和控制成本，以及针对特定服务优化成本，如计算、容器、无服务器、存储、数据库、智能分析、网络和云运维。通过遵循该支柱提供的最佳实践、工具和技术，组织可以在保持应用性能和可靠性的同时优化云成本。\n\
  \n### 性能优化支柱\n\n性能优化支柱涉及设计和调优 Google Cloud 资源和服务以实现最佳性能。优化云中工作负载的性能可为组织带来诸多益处，包括提高效率、改善客户满意度、增加收入和降低成本。性能优化支柱提供了关于实施性能优化、持续监控和分析云资源性能，以及优化计算、存储、网络、数据库和分析性能的指导。\n\
  \n正如我们所讨论的，`Google Cloud Architecture Framework` 为组织提供了一个结构化且全面的指南，用于在 `GCP` 上构建和运行企业级云原生解决方案，满足质量、安全、可靠性、性能、成本效率和敏捷性的最高标准。现在，让我们探讨一下\
  \ Azure 的 Well-Architected Framework。\n\n## Microsoft Azure Well-Architected Framework\n\
  \n\n\n\n与 AWS 和 Google 的云架构框架类似，Microsoft Azure 也制定了一套 Azure 架构良好的框架（Well-Architected\
  \ Framework），它作为一组经过验证的最佳实践和建议，旨在最大化部署在 Azure 上的工作负载的业务价值 *\\[7\\]*。Azure 架构良好的框架为组织应对云架构的复杂性提供了指导。通过整合每个支柱中概述的原则，组织可以在\
  \ Azure 云中构建弹性、安全且经济高效的解决方案。随着技术的持续演进，该框架仍是一种动态资源，指导组织充分利用云计算的潜力，同时为数字化转型奠定坚实基础：\n\
  \n![图 8.6 – Azure 架构良好的框架](img/B18893_08_6.jpg)\n\n图 8.6 – Azure 架构良好的框架\n\nAzure\
  \ 架构良好的框架建立在五大核心支柱之上，每个支柱都针对云架构的关键方面。\n\n### 可靠性支柱\n\nAzure 架构良好的框架的可靠性支柱建立在关键原则之上，这些原则有助于在\
  \ Azure 上创建健壮且可靠的云架构。该支柱侧重于确保在 Azure 中设计的云解决方案具有高可用性、弹性，并且能够从故障中恢复。它强调需要设计简单且易于实现的系统，这些系统可以利用平台功能，并承受组件故障、网络中断和其他意外事件。该支柱涵盖容错、冗余和灾难恢复等关键概念。通过优先考虑可靠性，组织可以最大限度地减少服务中断并保持业务连续性。该框架提供了关于实现多个可用区、负载均衡器、自动故障转移机制以及备份和恢复策略的指导，以增强云工作负载的弹性和可用性，确保关键应用程序和服务保持可访问和可操作。\n\
  \n### 成本优化支柱\n\nAzure 架构良好的框架的成本优化支柱侧重于管理和降低云成本，同时最大化云投资的业务价值。它提供了优化资源利用、利用成本节约机制和实施成本意识文化的策略。关键考虑因素包括选择合适的云资源、实现自动扩展和弹性、利用预留实例以及监控云消费模式。通过采用成本优化的最佳实践，组织可以减少浪费性支出，有效预测和控制云预算，并确保其云投资与业务目标保持一致。该框架强调了持续成本分析、性能监控以及利用自动化来识别和实施成本降低机会的重要性。\n\
  \n### 安全支柱\n\nAzure 架构良好的框架的安全支柱优先保护云工作负载免受潜在威胁、数据泄露和合规性违规的影响。它包含多个安全措施层，包括 IAM、网络安全、数据加密以及威胁检测和响应。该框架提供了关于实现\
  \ Azure 安全中心、利用**基于角色的访问控制**（**RBAC**）、通过防火墙和网络安全组保护网络流量以及对静态和传输中的敏感数据进行加密的指导。通过遵循安全最佳实践，组织可以建立强大的安全态势，保护其云资产免受恶意行为者的侵害，并确保符合行业标准和法规，如\
  \ ISO 27001、SOC 2 和 HIPAA。\n\n### 运维卓越支柱\n\nAzure 架构良好的框架的运维卓越支柱侧重于构建和维护能够实现运维效率、弹性以及快速响应变化能力的云解决方案。它强调了自动化、DevOps\
  \ 实践和监控系统的重要性。关键方面包括自动化基础设施配置、实施 CI/CD 管道、监控**关键绩效指标**（**KPI**）以及进行定期补丁管理。通过优先考虑运维卓越，组织可以简化其云运维，提高服务可靠性，减少人为错误，并增强整体客户体验。该框架提供了关于利用\
  \ Azure Monitor、Azure Automation 和其他工具来监控工作负载、自动化任务以及持续提高云解决方案效率和有效性的指导。\n\n###\
  \ 性能效率支柱\n\nAzure 架构良好的框架的性能效率支柱指导组织选择和优化云资源，以实现所需的性能水平。它涉及在资源类型、大小和可扩展性等因素与成本和安全性考量之间进行平衡。关键概念包括选择适当的计算、存储和网络资源，实施自动扩展和弹性机制，以及优化数据访问模式。通过关注性能效率，组织可以确保其云解决方案能够处理变化的工作负载，提供一致的性能，并满足最终用户的期望。该框架提供了关于监控性能指标、识别瓶颈以及通过\
  \ Azure Monitor 和 Azure Load Balancer 等工具优化资源利用的建议。\n\nAWS、Google 和 Azure 的规范性云架构框架在核心原则方面有很多共同之处，例如可靠性、运维卓越和成本优化。所有框架还通过特定于平台的服务提供了实现这些目标的指导和最佳实践。从安全角度来看，AWS\
  \ 强调运维安全，Azure 侧重于安全治理和合规性，而 Google Cloud 引入了共享命运模型（shared-fate model），这与共享责任模型有显著不同。当组织踏上云转型之旅时，可持续性往往是企业领导者最关心的问题。AWS\
  \ 将可持续性作为一个独立的支柱来强调，而 Google Cloud 则主张将可持续性考量作为基础性系统设计支柱的一部分。无论采用哪种方法——单云、混合云还是多云——对于企业架构师来说，明智的做法是吸收最佳实践和指导，并开发一个与组织愿景和目标相一致的、与供应商无关的云框架。现在，让我们探讨一些可用的私有云和混合云策略。\n\
  \n# 私有云和混合云策略\n\n\n\n\n\n# 私有云与混合云产品\n\n虽然公有云提供了可扩展性和灵活性，但在某些情况下，组织会选择私有云解决方案，以应对与安全、合规、监管控制及限制相关的特定需求。私有云战略代表了一种精细化的云计算方法，在云的优势与控制、安全和合规需求之间为组织提供了平衡。无论是部署在本地还是由第三方提供商托管，私有云都使组织能够根据特定需求定制其\
  \ IT 基础设施，从而为其数字化运营提供灵活且安全的基础。私有云是一种专用于单一组织的云计算模型。与在多个用户之间共享的公有云不同，私有云将其资源专供单个组织使用。这种隔离性增强了对数据、安全和合规的控制。多家公有云提供商也提供私有云解决方案，使组织能够在其本地环境中同样利用公有云的原则、架构和技能组合。然而，如前所述，企业必须谨慎架构和设计符合开放标准、开放\
  \ API 和开放文件格式的云框架。让我们来回顾一些常见的私有云和混合云产品。\n\n## VMware Cloud Foundation（VCF）\n\n**VCF**\
  \ 是一个集成平台，将 VMware 的虚拟化、软件定义存储和网络虚拟化技术整合到一个统一的技术栈中。它旨在跨私有云和公有云提供一致且标准化的基础设施，从而打造更敏捷、更高效的\
  \ IT 环境。对于在 IT 环境中拥有大量 VMware 部署并希望保持对基础设施控制权的企业来说，这可能是一个不错的选择。\n\n让我们来看一下 VCF 的一些关键组件：\n\
  \n*   **vSphere**：VMware Cloud Foundation 的核心是 vSphere，即 VMware 的旗舰虚拟化平台。vSphere\
  \ 为虚拟化计算资源提供了基础，使组织能够以高性能和高效率运行和管理**虚拟机**（**VM**）。\n*   **虚拟存储区域网络（vSAN）**：VMware\
  \ Cloud Foundation 利用 vSAN 实现软件定义存储。vSAN 将服务器节点上的直连存储资源进行池化，无需外部存储阵列即可创建高度可扩展且弹性的存储基础设施。\n\
  *   **NSX**：网络虚拟化通过 VMware NSX 实现，它允许组织创建和管理虚拟网络，为应用程序和服务的部署提供敏捷性和灵活性。\n*   **vRealize\
  \ Suite**：包含 vRealize Suite 增强了 VCF 的管理能力。它提供全面的云管理、自动化和监控工具，使组织能够优化资源利用并提升运营效率。\n\
  \n主要的公有云提供商也在公有云上提供 VCF，这对于采用混合云战略、即将退出数据中心或存在云爆发等用例的组织极为有益。VCF 的一些关键优势包括统一的基础设施管理、确保本地、私有云和公有云环境之间的一致性、集成的管理工具、自动化以及加速部署。然而，相关挑战包括初始投资、复杂性和对\
  \ VMware 生态系统的依赖，应在规划和实施阶段仔细考虑并加以解决。\n\n## OpenStack\n\n**OpenStack** 是一个云计算平台，提供一套用于构建和管理公有云及私有云的软件工具。它使组织能够创建和管理可扩展的**基础设施即服务**（**IaaS**）环境，提供灵活性、可扩展性和定制化能力。作为开源云计算平台，OpenStack\
  \ 已成为云技术动态格局中的一股变革力量。OpenStack 于 2010 年推出，已迅速演变为一个由社区驱动的项目，促进了创新与协作。OpenStack 广泛用于在组织内部构建私有云，为内部需求提供安全且可扩展的基础设施。它同时也可作为各种服务提供商提供的公有云服务的基础。组织通常利用\
  \ OpenStack 构建混合云环境，集成私有云和公有云服务。这为工作负载的部署位置提供了灵活性，并在不同云环境之间实现了无缝体验。\n\n以下是 OpenStack\
  \ 的一些关键组件：\n\n*   **Nova（计算）**：OpenStack Nova 是负责管理虚拟机并提供可扩展、按需计算服务的计算组件。它使组织能够运行虚拟机实例，满足各种计算需求。\n\
  *   **Swift（对象存储）**：Swift 是 OpenStack 的对象存储组件，专为存储和检索大量非结构化数据而设计。它提供可扩展、冗余且持久的存储能力，适用于存储镜像、视频和备份等数据对象。\n\
  *   **Cinder（块存储）**：Cinder 在 OpenStack 中提供块存储服务，允许组织将存储卷附加到虚拟机。这为应用程序和数据库提供了额外的存储容量，并提供了高性能的块存储解决方案。\n\
  *   **Neutron（网络）**：Neutron 是 OpenStack 的网络组件，提供**网络即服务**（**NaaS**）。它使组织能够在云基础设施内定义和管理网络及连接，支持多样化的网络拓扑。\n\
  *   **Keystone（身份）**：Keystone 充当 OpenStack 中的身份和认证服务。它提供用户及其权限的中央目录，确保所有 OpenStack\
  \ 服务的安全访问控制和身份验证。\n*   **Glance（镜像服务）**：Glance 是镜像服务组件，允许用户发现、注册和检索虚拟机镜像。它有助于高效管理用于创建虚拟机的操作系统镜像。\n\
  *   **Horizon（仪表板）**：Horizon 是 OpenStack 基于 Web 的仪表板，为用户提供图形化界面来访问和管理资源。它简化了用户体验，并允许管理员监控和控制云资源。\n\
  \nOpenStack 证明了开源协作和社区驱动开发在塑造云基础设施未来方面的力量。它对私有云和公有云、研究、教育、电信及混合云场景的影响，凸显了其多功能性和适应性。随着技术的不断发展，OpenStack\
  \ 在赋能组织构建可扩展、可互操作且灵活的云环境方面的作用，在云计算的不断演进格局中仍然至关重要。然而，企业必须考虑以下挑战：\n\n*   **部署复杂性**：部署和配置\
  \ OpenStack 可能很复杂，需要专业知识和周密规划。不过，各种发行版和部署工具旨在简化这一过程。\n*   **生态系统演变**：云技术格局的快速演变给使\
  \ OpenStack 与新兴技术保持一致带来了挑战。社区通过定期更新和增强来积极应对这些挑战。\n*   **竞争技术**：OpenStack 面临来自其他云平台和服务的竞争，包括专有解决方案和替代性开源项目。随着新技术的出现，这一格局也在持续演变。\n\
  \n## AWS Outposts\n\n\n\n\n### AWS Outposts\n\n在云计算时代，组织正在持续寻找创新解决方案，将云的优势与本地基础设施无缝融合。**AWS\
  \ Outposts** 由 AWS 推出，代表了弥合本地数据中心与云之间差距的一种方法。AWS Outposts 是 AWS 云基础设施的延伸，将 AWS 服务、计算、存储和数据库功能带到本地环境中。它旨在解决某些工作负载、数据或应用程序因特定需求（如低延迟、数据驻留、监管合规、需要超低延迟的应用程序以及边缘计算）而必须驻留在本地数据中心中的场景。AWS\
  \ Outposts 提供以下关键优势：\n\n*   **混合云能力**：AWS Outposts 通过将本地基础设施与 AWS 云无缝集成，使组织能够构建真正的混合云环境。这使得两个环境之间可以实现一致的操作。\n\
  *   **全托管服务**：AWS Outposts 是一项全托管服务，意味着 AWS 负责硬件安装、维护和软件更新。这消除了组织在运维方面的负担，并确保基础设施始终保持最新状态。\n\
  *   **原生 AWS 服务**：借助 AWS Outposts，组织可以在本地利用广泛的 AWS 服务，包括计算实例（EC2）、存储（S3、EBS）和数据库（RDS）。这确保了与\
  \ AWS 云的一致性，并促进了工作负载的可移植性。\n*   **本地处理和低延迟**：AWS Outposts 将计算和存储能力直接带到本地位置，最大限度地减少了需要本地处理的应用程序的延迟。这对于延迟敏感型工作负载特别有益。\n\
  *   **安全且一致的操作**：AWS Outposts 将 AWS 的安全性和合规性延伸到本地环境。组织可以应用 AWS IAM 策略，使用 AWS **密钥管理服务**（**KMS**），并实施\
  \ VPC 对等连接，以实现安全且一致的操作。\n\n以下是使用此策略的企业需要考虑的一些关键事项：\n\n*   **初始部署复杂性**：尽管 AWS 管理硬件和软件更新，但\
  \ AWS Outposts 的初始部署可能需要仔细规划并与 AWS 进行协调。组织需要确保本地环境满足必要的前置条件。\n*   **成本考量**：AWS Outposts\
  \ 涉及硬件成本和 AWS 持续管理的费用。组织需要评估总拥有成本（TCO），并确定收益是否证明投资是合理的。\n*   **与现有基础设施的集成**：将 AWS\
  \ Outposts 与现有的本地基础设施和网络配置集成可能会带来挑战。适当的规划并与 AWS 合作对于确保顺利集成至关重要。\n*   **以 AWS 为核心的云**：如果企业战略完全投入\
  \ AWS，那么这可能是一个绝佳的选择。\n\n### Google GKE Enterprise (Anthos)\n\n**GKE Enterprise**，通常也被称为\
  \ Google Anthos，是一个现代云应用平台，旨在为混合和多云环境提供一致的开发和操作体验。Anthos 使组织能够跨本地数据中心、GCP 和其他云提供商无缝构建、部署和管理应用程序。Google\
  \ Anthos 处于这一转型的最前沿，提供了一个综合平台，促进应用现代化、环境间的一致性以及运营效率。\n\n以下是 GKE Enterprise（Anthos）的一些主要功能：\n\
  \n*   **多云和混合云支持**：Google Anthos 采用多云和混合云方法，允许组织在不同的云提供商、本地环境和 GCP 之间一致地运行应用程序。这种灵活性提供了摆脱供应商锁定自由，并支持多样化的基础设施需求。\n\
  *   **Google 分布式云边缘**：分布式边缘功能允许企业将本地 GKE 集群添加到他们的舰队中，这些集群运行在由 Google 提供和维护的硬件上，并几乎可以在任何地方支持\
  \ GKE Enterprise 功能的一个子集。\n*   **基于 Kubernetes 的容器编排**：Google Anthos 的核心是 Kubernetes，一个开源容器编排平台。Anthos\
  \ 利用 Kubernetes 自动化容器化应用的部署、扩展和管理，促进可移植性和可扩展性。\n*   **Anthos 配置管理**：Anthos 配置管理使组织能够在其\
  \ Kubernetes 集群中一致地执行策略和配置设置，无论底层基础设施如何。这种集中管理简化了操作并确保治理。\n*   **Anthos 服务网格**：Anthos\
  \ 服务网格基于开源 Istio 项目构建，为应用程序中的微服务提供统一且安全的通信层。它增强了微服务架构的可见性、控制力和安全性。\n*   **多云可移植性**：Google\
  \ Anthos 使组织能够构建和管理可在多个云提供商上运行的应用程序，促进多云策略。这降低了供应商锁定的风险，并提供选择最合适云服务的灵活性。\n*   **迁移和现代化应用程序**：Google\
  \ Anthos 通过允许组织将工作负载直接迁移（lift and shift）或将应用程序重构为容器，促进现有应用程序的现代化。这支持向云原生架构的逐步过渡。\n\
  *   **集成的 DevOps 和工具**：Anthos 与流行的开发工具集成，包括 Google Cloud Build 和 Google Cloud Code，为开发人员提供熟悉且简化的环境，用于构建、测试和部署应用程序。\n\
  \n在采用 GKE Enterprise（Anthos）时，需要考虑的一些事项如下：\n\n*   **运营复杂性**：虽然 GKE Enterprise 简化了混合云和多云操作的某些方面，但管理混合环境可能仍然很复杂。组织需要投资于培训和资源，以有效地运行和维护\
  \ GKE Enterprise。\n*   **成本考量**：组织应仔细评估在本地部署和维护 GKE Enterprise 的总拥有成本（TCO）。这包括硬件成本、许可证费用以及持续的运营费用，就像企业对本地基础设施所做的那样。\n\
  \n### Azure Stack\n\n**Azure Stack** 是 Microsoft Azure（微软的云计算平台）的延伸。它允许组织在其基础设施上本地部署\
  \ Azure 服务，创建一致的混合云环境。Azure Stack 支持开发和部署可以在本地和 Azure 云环境中运行的应用程序。通过提供一致的 Azure\
  \ 体验，Azure Stack 使拥有 Azure 战略的组织能够拥抱混合云战略，支持多样化的工作负载和场景。\n\n以下是 Azure Stack 的一些主要功能：\n\
  \n*   **一致的 Azure 体验**：Azure Stack 提供与 Azure 一致的体验，允许组织使用相同的 **Azure 资源管理器**（**ARM**）模板、Azure\
  \ 门户和 Azure PowerShell 命令。这种一致性简化了跨环境的应用程序开发和部署。\n*   **本地的 Azure 服务**：借助 Azure\
  \ Stack，组织可以将部分 Azure 服务引入其数据中心。这包括诸如 Azure 应用服务、Azure 函数、Azure Blob 存储等服务。这使得能够创建利用本地云能力的应用程序。\n\
  \n\n\n\n\n- **混合云灵活性**：Azure Stack 支持混合云战略，使组织能够在本地和 Azure 公有云中运行工作负载。对于因监管要求、数据驻留问题或特定性能需求而需要将某些工作负载保留在本地的场景，这种灵活性非常有价值。\n\
  - **集成的安全性和合规性**：Azure Stack 继承了 Azure 的安全功能和合规认证。这确保在 Azure Stack 上运行的工作负载能够获得与\
  \ Azure 公有云中相同级别的安全控制、身份管理和合规标准。\n- **面向容器的应用服务**：Azure Stack 通过 **Azure Kubernetes\
  \ Service**（**AKS**）和 **Azure Container Instances**（**ACI**）支持容器。这使组织能够使用容器化架构现代化应用，同时保持在本地运行它们的灵活性。\n\
  - **边缘和断连场景**：Azure Stack 适用于低延迟处理至关重要的边缘计算场景。它使组织能够在偏远地点或连接受限的区域部署 Azure 服务，确保一致的计算体验。\n\
  \n以下是一些关键考量：\n\n- **硬件兼容性和要求**：部署 Azure Stack 需要符合 Microsoft 规格的兼容硬件。组织需要确保其现有基础设施或新投资与\
  \ Azure Stack 的要求保持一致。\n- **运营复杂性**：虽然 Azure Stack 简化了混合云运营的某些方面，但管理混合环境仍然可能很复杂。组织需要投入培训和资源，以有效运营和维护\
  \ Azure Stack。\n- **成本考量**：组织应仔细评估部署和维护 Azure Stack 的总体拥有成本（TCO）。这包括硬件成本、许可费用和持续的运营支出。\n\
  \n## 总结\n\n在本章中，我们讨论了在本地 IT 基础设施上投入大量资金的企业如何采用云计算来加速并转变其业务目标。我们探讨了组织如何通过一个带有明确方法论且厂商中立的框架来构建混合云的基础，以及构成该框架的核心层。我们还探讨了组织在云中设计和开发现代应用时必须考虑的云原生原则。\n\
  \n随后，我们探讨了不同的云架构框架，以及三大云服务提供商——AWS、Google Cloud 和 Azure——所倡导的各个支柱。最后，我们讨论了企业可以采用的一些独特的私有云和混合云战略及产品。\n\
  \n在下一章中，我们将讨论数字化转型的各个方面。\n\n## 延伸阅读\n\n要了解本章涵盖主题的更多信息，请查看以下参考资料：\n\n1. [`www.mckinsey.com/~/media/McKinsey/Industries/Electric%20Power%20and%20Natural%20Gas/Our%20Insights/Traditional%20company%20new%20businesses%20The%20pairing%20that%20can%20ensure%20an%20incumbents%20survival/Traditional-company-new-businesses-VF.pdf`](https://www.mckinsey.com/~/media/McKinsey/Industries/Electric%20Power%20and%20Natural%20Gas/Our%20Insights/Traditional%20company%20new%20businesses%20The%20pairing%20that%20can%20ensure%20an%20incumbents%20survival/Traditional-company-new-businesses-VF.pd)\n\
  2. [`landscape.cncf.io/`](https://landscape.cncf.io/)\n3. [`martinfowler.com/bliki/StranglerFigApplication.html`](https://martinfowler.com/bliki/StranglerFigApplication.html)\n\
  4. [`www.seagate.com/files/www-content/our-story/trends/files/idc-seagate-dataage-whitepaper.pdf`](https://www.seagate.com/files/www-content/our-story/trends/files/idc-seagate-dataage-whitepaper.pdf)\n\
  5. [`docs.aws.amazon.com/wellarchitected/latest/framework/welcome.html`](https://docs.aws.amazon.com/wellarchitected/latest/framework/welcome.html)\n\
  6. [`cloud.google.com/architecture/framework`](https://cloud.google.com/architecture/framework)\n\
  7. [`azure.microsoft.com/en-us/solutions/cloud-enablement/well-architected/#reliability`](https://azure.microsoft.com/en-us/solutions/cloud-enablement/well-architected/#reliability)\n"
- '## 第 9 章 数字化转型的九个方面


  何时才是制定云战略的合适时机？对一些企业而言，答案是在采用云的同时；而对另一些企业而言，答案仍不明确。Gartner 在其 *Cloud Strategy Cookbook*
  中建议，组织甚至应在启动云转型计划之前就制定云战略 *\[1\]*。该手册认识到，考虑到现代企业多样化的需求和业务目标，一刀切的云方法是不够的。随着现代技术不断模糊业务与
  IT 之间的界限，将组织的云战略与业务目标紧密对齐至关重要，这样才能最大化云投资所带来的价值并推动切实成果。随着组织持续采用云计算——无论部署模式是 IaaS、PaaS
  还是 SaaS——设计并制定一项将作为未来业务目标基础的数字化战略至关重要。那些主要在数据中心边界内支撑传统 IT 生态系统的工具、流程和技术，已无法支撑基于云的生态系统的规模、多样性、复杂性和需求。踏上云之旅会给企业
  IT 的各个职能带来范式转变。一个基本示例是云的共同责任模型：云提供商负责管理和保护部分技术栈，而消费者负责其余部分。这本身就是企业 IT 运营的重大转变，因为组织现在对基础设施或应用程序栈的很大一部分几乎没有或完全没有控制权。此外，这也意味着栈顶层的责任同样受到明确框架的引导和限制。例如，如今大多数组织的
  IT 生态系统中都有某种形式的 SaaS 应用——想想用于办公应用的 Microsoft 365、用于在线生产力的 Google Workspace、用于 HR
  的 Workday，或用于 CRM 的 Salesforce。所有这些应用都运行在传统 IT 组织无法控制的云环境中。这意味着组织的 IT 足迹刚刚扩展到传统数据中心的边界之外，因此需要一套稳健的战略来覆盖网络连接、集成、应用安全、数据安全和治理。


  在本章中，我们将探讨数字化转型的各个方面，它们可以帮助为组织的云战略奠定基础并定下基调。具体来说，我们将探讨以下主题：


  - 企业如何构建安全优先的云基础，以确保涵盖网络、数据、应用和资产管理的整体企业安全

  - 学习在混合云图景中重新思考基础设施，重点关注基础设施现代化

  - 构建云原生应用的策略，重点关注应用现代化

  - 利用云原生设计实现数据生态系统现代化

  - 学习如何构建云治理模型，以优化云基础设施的成本、性能和资源效率，并最大化云投资的价值


  ## 构建安全优先的云架构






  如果以**国家标准与技术研究院**（**NIST**）维护的**国家漏洞数据库**（**NVD**）中所发布的**通用漏洞与暴露**（**CVE**）数量来衡量，我们会发现仅在过去
  7 年中，CVE 数量就增长了惊人的 4.5 倍。根据数据，2016 年 NVD 平均每周发布约 100 个 CVE，而到 2023 年这一数字跃升至每周 450
  个 CVE *\[2\]* *\[3\]*。


  安全是每个人的事，对于现代企业而言尤其关键，因为随着云计算的普及，现代技术的获取已变得大众化。在网络威胁日益复杂化的时代，为企业构建安全优先的云架构是一项至关重要的任务。


  企业在采用云计算时通常会遇到的一个共同挑战，是云引入的共享责任模型。清晰理解共享责任模型，对于保护云中的应用工作负载和数据安全极为重要。由于共享责任模型可能因每个**云服务提供商**（**CSP**）、服务模型以及所使用云服务的不同而各有独特定义，这一任务往往颇具挑战性。


  在深入探讨安全控制之前，我们先回顾一下组织在云转型过程中面临的一些常见挑战。根据 *Pandemic 11* 报告，以下是组织在云安全方面面临的首要担忧 *\[4\]*：


  1. 身份、凭据、访问和密钥管理不足

  2. API 和接口不安全

  3. 云配置错误以及变更控制不当

  4. 缺乏云安全战略和架构

  5. 软件开发实践不安全


  除此之外，企业还面临以下由外部威胁向量进一步加剧的挑战：


  - **云服务的持续变化**：由于云服务具有动态特性，新服务不断更新和发布，企业必须保持警惕。为了跟上步伐，组织必须建立相应的流程和安全控制，以对照基线安全配置进行验证和测试，从而满足不断变化的要求并保持合规。

  - **利用多个服务层**：企业的工作负载通常跨越多种服务类型。这要求在兼顾整体工作负载安全需求的同时，对每种服务类型的安全控制进行统一和验证。例如，支付处理服务可能利用多种服务类型（计算基础设施、API
  平台和支付网关 SaaS），同时需要满足**支付卡行业**（**PCI**）合规义务。

  - **数据安全**：随着企业数据从本地环境扩展到云端，数据安全成为企业的一个关键决策点。根据监管要求和数据引力，安全组织必须确定数据加密密钥的管理位置，这一点至关重要。

  - **外部威胁**：随着新的安全漏洞和**高级持续性威胁**（**APT**）持续增加，这可能构成重大挑战。例如，暴力破解/**分布式拒绝服务**（**DDoS**）攻击、恶意软件或勒索软件攻击，以及**中间人**（**MITM**）攻击，都可能成为企业必须防范的新攻击向量。


  让我们探讨企业在构建云基础时必须考虑的一些基础安全原则。


  ## 基础安全原则


  对希望利用云计算优势同时确保数据和应用程序安全的企业来说，构建安全的云环境极为关键。通过实施基础安全原则，组织可以建立稳固的安全态势，保护数据和应用程序，并与内外部利益相关者建立信任。让我们进一步了解这些原则：


  - **着陆区设计**：云服务部署最基础的方面是着陆区设计。着陆区定义了组织云部署的基础方面，如组织策略、互联互通、资源管理、安全、网络以及**身份和访问管理**（**IAM**）。在组织开始在云上部署工作负载之前，健全的着陆区设计必不可少。同样重要的是，将着陆区设计模块化，并在考虑可扩展性和增长需求的前提下进行适配。

  - **零信任架构（ZTA）**：云中的零信任安全是一种消除云环境内隐式信任的综合方法 *\[5\]*。零信任不假设网络内的用户或设备值得信赖，而是要求对所有访问请求进行持续验证和认证。这通过**多因素认证**（**MFA**）、最小权限访问和微隔离等机制实现。通过将访问限制在必要范围内，零信任最小化攻击面，从而降低入侵风险。

  - **风险评估**：定期进行正式风险评估至关重要，以确保组织的安全要求既满足内部安全义务，也满足外部安全义务。这提供了风险摘要以及组织检测和应对安全威胁的能力。一些最佳实践包括利用**云安全联盟**（**CSA**）的**云控制矩阵**（**CCM**）和**互联网安全中心**（**CIS**）基准进行风险评估。

  - **定义并采用安全蓝图**：自动化是跟上不断变化的安全态势的关键。安全组织的主要职责之一是为云中的一些常见部署定义安全蓝图。这些蓝图可以标准化企业资产部署，同时支持更快的部署和集中治理。

  - **分层安全设计/左移安全策略**：企业必须采用分层的**纵深防御**（**DiD**）安全设计，利用应用程序或工作负载每一层的安全功能来限制攻击向量。另一种策略是在开发和部署阶段融入安全最佳实践；例如，测试应用程序代码中的安全问题、在部署期间扫描容器镜像、自动扫描以及检测配置错误和安全反模式。

  - **自动化部署和安全监控**：通过自动化部署来消除手动部署活动中的人为错误，不仅能提高开发和部署速度，更重要的是能改善组织的安全态势。同样，投资自动化工具来扫描基础设施漏洞并自动化扫描**持续集成/持续部署**（**CI/CD**）管道，也是一项安全最佳实践。

  - **用于安全自动化的机器学习（ML）**：机器学习在增强企业云安全方面发挥着关键作用，它为威胁检测、**事件响应**（**IR**）和整体风险管理提供了高级能力。随着云环境变得更加复杂、动态和互联，基于机器学习的安全自动化可以帮助实现高级威胁检测、**用户与实体行为分析**（**UEBA**）以及零日预测分析，并改善云中工作负载的整体安全性。






  *   **遵守数据主权和数据驻留要求**：根据企业性质，遵守当地法规以及数据驻留和数据主权要求至关重要。从头开始架构应用程序以满足合规要求，往往能节省大量时间和精力；例如，在面向公共部门的安全云区域中托管工作负载，并利用机密**虚拟机**（**VM**）防止内存数据泄露。

  *   **补偿性控制**：在云端的共享责任模型下，组织应努力通过技术补偿性控制、合同保护和第三方认证来降低风险。例如，利用云原生安全控制对静态数据和传输中数据进行加密可作为一种技术补偿性控制，而**业务伙伴协议**（**BAA**）或**云数据处理附录**（**CDPA**）可作为合同保护
  *\[6\]*。

  *   **风险保护计划**：最后，企业还可以利用网络保险计划，更好地了解、修复风险，并实现高水平的安全态势。

  *   **安全审计和评估**：定期开展渗透测试，以识别和解决网络基础设施中的漏洞。使用自动化漏洞扫描工具，定期评估云环境的安全态势。


  ## 自动化云资产管理


  拥有准确的资产清单，并充分了解所有云资产及其关系，对企业安全至关重要。随着团队开始构建应用程序或将工作负载迁移到云端，资产管理可能迅速变得复杂且难以管控。使用**基础设施即代码**（**IaC**）工具（如
  Terraform）自动化资产管理，有助于满足企业安全最佳实践。安全团队还必须专注于实施自动化资产监控和告警，以监控资产的不合规情况和偏离安全蓝图的行为。在混合云部署模型的背景下，企业还可以利用现有的**安全信息和事件管理**（**SIEM**）系统作为**单一视图**（**SPOG**），以管理和监控整个企业的资产。


  ## IAM


  **IAM** 是保护企业资源的关键组件，特别是在多云和混合云环境中，资源分布在本地数据中心和云服务提供商（CSP）之间。实施有效的 IAM 实践有助于组织管理用户访问、保护敏感数据并确保合规。以下是一些
  IAM 最佳实践：


  *   **集中式身份管理（IdM）**：实施一个跨越本地和云环境的集中式 IdM 系统。这种集中化有助于简化用户预配、取消预配和访问管理流程，同时也能安全地集中管理身份。

  *   **实施破玻璃应急程序**：云中的破玻璃应急程序是指一种紧急访问机制，在发生锁定等紧急情况时，授予临时的特权访问权限以访问云中的关键系统或数据。此程序通常保留用于高度敏感的操作，或在其他访问方法不可用时使用。它通过严格的安全控制来实施，以防止未经授权的使用。一旦激活，破玻璃应急程序允许指定人员绕过正常的访问限制，从而使他们能够快速解决关键问题或降低风险。

  *   **通过单点登录（SSO）联合访问**：使用安全的联合协议，如**安全断言标记语言**（**SAML**）或**开放授权**（**OAuth**），实现本地和云环境之间的身份联合，允许用户一次性认证并无缝访问资源。

  *   **启用 MFA**：强制要求访问关键系统和数据时使用 MFA。这增加了一层额外的安全保障，即使凭证泄露，也能降低未经授权访问的风险。

  *   **保护超级管理员账户**：避免使用现有用户账户，为超级管理员访问创建新账户。确保破玻璃应急程序有完善的文档记录，启用 MFA，并结合物理安全令牌和备用账户使用。

  *   **记录所有活动**：确保所有云活动均被记录并集成到集中式 SIEM 中。这也有助于审计访问并满足合规要求。

  *   **实施最小权限原则（PoLP）**：过度授权用户访问权限通常是与云资源配置错误及内部威胁风险相关的首要安全风险。在整个组织中采用 PoLP 或**即时**（**JIT**）访问策略。实施针对特权访问的强有力控制，如会话录制和监控，可降低未经授权操作的风险。

  *   **自动化策略控制**：利用云原生工具自动审查访问策略、权限和不必要的特权，以便及时将安全风险降至最低。


  ## 网络安全


  将网络扩展到传统数据中心之外会对网络安全产生影响。本地网络通常具有明确、可预测的网络边界或边界，更容易通过网络防火墙、**入侵检测系统**（**IDS**）和物理路由器进行保护。确保强大的网络安全，特别是在混合云环境中，对于保护敏感数据、保持合规和防范网络威胁至关重要。保护混合云网络的一些最佳实践如下：


  *   **分段和微分段**：将网络划分为多个段，以隔离不同类型的数据和服务。如果一个网段被攻破，这能限制攻击者的横向移动。实施微分段以应用细粒度的访问控制，特别是在多层应用程序中。这限制了各个工作负载之间的通信。

  *   **致力于零信任网络**：零信任安全模型意味着默认不信任任何人，无论他们从何处访问网络，除非伴随其他层级的访问检查，如身份检查、上下文或受信任设备。

  *   **保护跨云连接**：使用**虚拟专用网络**（**VPN**）或专用连接（如 Google Cloud Interconnect、AWS Direct
  Connect 或 Azure ExpressRoute）确保本地和云环境之间的安全连接。使用 TLS/SSL 等协议加密 Web 流量，使用 IPsec 加密站点到站点
  VPN，以保护传输中的数据。

  *   **保护云边界**：利用纵深防御（DiD）网络安全策略，在不同层级定义网络防火墙策略和规则，以允许或拒绝网络流量。

  *   **自动化网络流量检查**：利用云原生工具，如云 IDS、基于 ML 的**下一代防火墙**（**NGFW**）、防火墙规则日志记录和流量镜像，来检查、监控和保护云中的工作负载。

  *   **应用安全**：部署**Web 应用防火墙**（**WAF**）以保护 Web 应用免受常见安全威胁和漏洞的侵害。通过适当的身份验证、授权和加密来保护
  API，防止未经授权的访问和数据泄露。

  *   **网络监控和日志记录**：实施持续的网络监控，以及时发现异常和潜在安全事件。集中管理本地和云环境的日志，以全面了解网络活动。

  *   **实施云访问安全代理（CASB）**：实施集中式 CASB 解决方案，特别是在混合云和多云部署中，以监控和管理云服务的使用，并确保合规和数据安全。


  ## 应用安全





  在混合云环境中保护应用安全对于保护敏感数据、确保合规性以及维护业务运营的完整性至关重要。组织在云端开发应用时采用分层安全方法，并将安全实践**左移**，这至关重要。以下是在混合云或多云环境中应用安全的一些最佳实践：


  - **实施安全应用开发最佳实践**：培训开发人员掌握安全编码实践，并利用自动化 DevOps 工具缓解应用代码中的常见漏洞，例如注入攻击、缓冲区溢出和**跨站脚本攻击**（**XSS**）。


  - **使用安全加固的虚拟机或容器镜像**：强制执行策略，仅利用安全加固的虚拟机镜像和容器镜像进行应用开发和部署。利用云原生产品，如屏蔽虚拟机。


  - **自动化应用发布**：由于复杂的应用开发环境错综复杂，手动部署、更新和修补它们非常困难，尤其是在遵循一致的安全要求时。自动化部署流水线可以消除人为错误、标准化开发反馈循环、实现快速产品迭代并保障应用发布安全。


  - **实施 DevOps 安全**：特别是在云原生应用开发中，攻击者可能会破坏 CI/CD 流水线，从而影响整个技术栈。建立最佳实践，如二进制授权、保护制品或容器注册表、容器镜像漏洞扫描、加密容器镜像，以及在
  CI/CD 流水线中进行签名验证。


  - **补丁管理**：通过实施稳健的补丁管理流程，使所有应用组件、框架和库保持最新安全补丁。组织必须为补丁频率、优先级、漏洞扫描和测试程序制定明确准则，并实施自动化补丁管理工具以简化和加速部署流程。


  - **依赖项扫描**：定期扫描第三方库和依赖项中的已知漏洞。解决并更新应用堆栈中的任何易受攻击组件。此外，建立流程验证第三方组件——尤其是开源组件——保持最新并符合企业安全标准。


  - **实施动态应用安全测试 (DAST)**：使用 DAST 工具模拟真实攻击场景，并在运行时识别漏洞。


  # 数据安全


  云中数据安全的重要性怎么强调都不为过，因为组织越来越依赖云服务来存储、处理和管理其数据。实施强有力的安全措施以防范不断演变的威胁、确保合规性并维护数据信任，势在必行。以下是企业可采用的一些最佳实践，以保护混合云环境中的数据：


  - **数据分类**：根据敏感度和法规要求对数据进行分类，并根据分类应用相应的安全措施。利用自动化工具在数据生命周期早期对数据进行分类和保护。


  - **实施全面的数据治理**：数据治理是一系列流程的组合，确保数据被编目、保护、准确、可用且可获取。建立稳健的数据治理实践，包括数据管理性和数据生命周期管理。基于数据引力，实施数据治理最佳实践，如数据编目、自动元数据收集和企业数据质量检查，以识别和整理数据资产。


  - **数据加密**：加密本地环境与云环境之间传输过程中的数据。实施专为数据分类设计的加密机制。例如，针对**联邦信息处理标准**（**FIPS**）140-2
  3 级数据安全，利用**硬件安全模块**（**HSM**）进行密钥管理。


  - **实施数据丢失防护 (DLP)**：部署 DLP 解决方案以监控、检测和防止未经授权的敏感数据访问和传输。实施数据掩码和遮盖技术以保护敏感信息，并使用令牌化用令牌替换敏感数据，降低处理和存储关键信息的相关风险。


  - **备份和灾难恢复 (DR)**：实施关键数据的定期备份，并确保**灾难恢复计划**（**DRP**）包含数据恢复程序。纳入将任务关键型数据备份到不可变、版本控制、冗余存储中的程序，以缓解和防止勒索软件等攻击。


  - **数据保留策略**：定义并强制执行数据保留策略，以确保定期清除不必要的数据，降低暴露风险。


  - **使用密钥管理器管理机密**：集中采用密钥管理解决方案来存储和保护机密，如应用凭据、数据库密码、API 密钥、账号密钥和 TLS 证书。实施最佳实践，如自动密钥轮换策略。


  # 数据主权和数据驻留


  数据主权和数据驻留要求通常基于区域性和行业特定法规。不同组织可能有不同级别的要求。随着应用和数据跨越本地环境和云端，了解并管控数据如何以及在何处存储、访问和处理以符合法规要求非常重要。一些最佳实践包括：


  - **确保数据主权**：对于有数据主权要求的企业，控制并防止云提供商访问数据至关重要。一些技术包括将加密密钥存储和管理在本地密钥管理器中、授予对密钥请求和访问的细粒度访问控制，以及保护使用中的数据。


  - **管理运营主权**：在目标云环境中实施策略，如保障计划，以确保企业工作负载仅部署在特定区域和可用区，并根据地理位置和认证限制云人员访问，以符合法规。


  - **管理软件主权**：软件主权是指无论目标环境如何，都能快速部署或迁移软件应用的能力。这是一项重要的 DevOps 实践和考量，以确保软件主权得以维持。


  - **管理数据驻留**：数据驻留是指企业静态数据的存储位置。这包括确保数据仅在授权区域存储、备份和复制。


  现在我们已经了解了如何构建安全优先的云基础，让我们探讨企业如何在云中重新思考基础设施。


  # 重新思考基础设施





  数字化转型的下一个方面是基础设施现代化。构建混合云基础设施涉及整合本地和云资源，以创建灵活且可扩展的 IT 环境。企业必须重新思考基础设施，以实现更高的自动化、一致性和可扩展性，这些对于有效管理动态
  IT 环境至关重要。企业可以采用的策略之一是将基础设施资源视为牛群而非宠物。这种方法符合 DevOps 的原则，非常适合云原生和容器化应用，因为应用对底层基础设施的依赖微乎其微。然而，这是企业
  IT 传统看待基础设施方式的范式转变，传统上基础设施被视为不可替代且单独管理。我们将基础设施组件分为计算基础设施、网络基础设施和存储基础设施。


  ## 计算基础设施


  计算基础设施是基础但关键的组成部分，构成了组织交付可扩展、灵活且高效计算资源能力的支柱。无论采用何种云战略，以下是企业可以采用的一些最佳实践：


  * **标准化基础设施**：必须为服务器定义标准化配置，以确保整个基础设施的一致性。避免手动配置更改，并依赖自动化工具识别和修复配置漂移，以确保基础设施一致性。


  * **自动化基础设施**：利用 `IaC` 工具（如 `Terraform` 或 `Ansible`）以可重复且自动化的方式定义和部署基础设施配置。将基础设施变更集成到
  `CI/CD` 流水线中，以自动化测试、部署和回滚流程。


  * **解耦基础设施**：将服务器视为不可变实体，通过替换或更新整个实例而不是修改现有实例。这降低了配置漂移的风险并确保一致性。将应用层与底层基础设施解耦，以确保应用可移植性并最大化使用无状态的无服务器计算选项。将实例视为短暂且可丢弃的。不要在单个服务器上排查和修复问题，而是通过自动化将其替换为新实例。在解耦架构时实现缓存逻辑，并利用实时迁移等功能减少对基础设施的依赖。


  * **为规模而构建**：利用自动扩缩容组或类似的云原生功能，根据需求自动调整实例数量。这确保了可扩展性以及对不同工作负载的响应能力。


  * **计算选择**：利用多种计算选项并提供选择能力，以支持不同成熟度水平的 DevOps 团队。例如，制定明确策略，提供裸金属解决方案、`VMs`、容器编排和无服务器技术，供
  DevOps 团队按需选择。


  * **自愈系统**：设计自愈系统，通过自动检测故障并从故障中恢复，减少在基础设施问题发生时对人工干预的需求。


  * **声明式基础设施**：使用声明式方法定义基础设施的期望状态。声明基础设施应呈现的样子，并让自动化工具将其带到该状态。


  * **版本控制**：对基础设施代码进行版本控制，以跟踪变更，并在需要时回滚到先前配置。


  * **测试**：将自动化测试纳入部署流水线，在基础设施变更进入生产环境之前进行验证，包括功能测试、安全测试和性能测试。


  * **持续改进**：基于基础设施性能探针建立反馈回路，持续评估和改进基础设施。监控性能，收集事件反馈，并利用这些信息优化和增强配置。


  ## 网络基础设施


  为混合云和多云战略设计网络基础设施，涉及创建无缝且安全的环境，整合本地和云资源。在本地和云生态系统之间建立稳健、冗余且安全的网络连接，对于提供低延迟的**服务质量**（**QoS**）和改善客户体验至关重要。以下是一些最佳实践：


  * **尽早设计虚拟网络**：考虑尽早设计虚拟网络，兼顾长期目标并预留扩展空间。设计跨越所有所选云提供商的统一网络架构。在设计中考虑带宽、延迟和数据传输成本等因素。这包括谨慎分配稀缺网络资源（例如将连续的
  `IP` 范围分配给不同云生态系统）、`IPv6` 采用策略、防火墙配置和流量路由，因为后期更改网络配置往往极其困难且具有挑战性。


  * **冗余网络**：在建立本地和云生态系统之间的连接时，考虑建立冗余网络连接，用于回退和网络**高可用性**（**HA**）。如果存在极端的 `HA` 要求，考虑通过多个**服务提供商**（**SPs**）来配置冗余网络。


  * **云互联**：定义连接云和本地网络的网络策略。利用直连或专用网络链路，在本地基础设施与每个云提供商之间建立高性能、低延迟的连接。对于多云战略，考虑采用云交换设计，以便集成并让跨多个云的服务直接通信。使用
  `VPNs` 通过互联网建立安全、加密的连接，适用于敏感度较低的数据传输。


  * **网络 QoS**：实施网络 `QoS` 措施，优先处理关键网络流量。定义带宽分配策略，以确保关键应用获得最佳性能。


  * **统一 DNS**：实施统一的 `DNS` 策略，利用 `DNS` 转发或与云 `DNS` 服务集成，实现本地和云资源之间的无缝解析。这在跨多个云解析 `DNS`
  时通常是一个常见挑战。


  * **统一网络安全策略**：在本地和云环境中实施一致的安全策略。利用防火墙、**入侵检测系统（IDS）/入侵防御系统**（**IPS**）和加密来保护传输中的数据。利用
  `TLS/SSL` 等加密协议保护传输中的数据，以确保所有互连点的加密标准一致。


  * **负载均衡**：制定策略，在本地和云环境中设计并实施负载均衡，以高效分配工作负载并确保最佳资源利用率。这对于设计和构建跨本地和云的高可用应用服务尤其有帮助。


  ## 存储基础设施


  定义存储基础设施战略需要深入理解企业的各种存储需求、数据主权要求以及数据引力。为混合云战略设计整体存储基础设施，涉及创建灵活高效的数据存储环境，无缝整合本地和云资源。以下是一些用于设计和构建存储基础设施的最佳实践：






  # 存储现代化最佳实践


  - **存储分类**：了解各种存储需求，并根据工作负载、检索频率、延迟、IOPS、存储位置、复制需求、容量和数据格式选择合适的存储类型。利用存储类型选项，根据工作负载需求实现性价比平衡。

  - **数据传输**：利用各种存储传输方法进行批量数据传输，例如基于网络的传输、基于设备的传输和软件驱动的数据传输，同时需要考虑速度、数据量、传输频率和延迟。

  - **构建冗余**：利用多级冗余来设计系统并保护数据，防止设备故障、数据中心故障和数据丢失。对于非关键数据（可从源数据重新生成的数据），利用云存储内置的冗余就足够了。但是，对于业务关键数据，需要规划额外的数据复制和备份策略。

  - **存储策略**：虽然某些存储类型可以灵活地用于多种用途，但基于云的存储类型为各种应用需求提供了专用存储。对于一般应用工作负载，可使用持久化磁盘（HDD、SSD）；对于大规模非结构化数据，可使用对象存储；对于**网络文件系统**（**NFS**）和**网络附加存储**（**NAS**），可使用文件存储。

  - **存储生命周期管理**：通过启用自动生命周期管理策略来优化对象存储的使用。例如，将使用频率较低的数据与使用频率较高的数据区分开，并将数据移动到合适的存储类别。实施自动化的数据生命周期管理策略，根据预定义的标准移动、归档或删除数据，以优化存储成本和性能。

  - **基于云的内容分发网络（CDN）**：利用基于云的 CDN 来缓存和提供静态数据，以优化成本和访问延迟。

  - **数据加密**：建立一致的数据加密方法，对静态数据和传输中的数据进行加密。根据数据类型和数据敏感程度，采用相应的加密方法和密钥管理技术。

  - **元数据管理**：实施有效的元数据管理策略，以增强混合存储环境中数据的可发现性和可访问性。

  - **数据复制与同步**：实施数据复制和同步机制，以确保本地和云存储环境之间的数据一致性和可用性。使用云存储网关促进本地存储系统与云存储服务之间的无缝通信。


  在回顾了企业如何重新构想和思考涵盖计算、网络和存储的基础设施现代化之后，现在让我们来探讨组织如何在云中开发和现代化应用。


  # 应用现代化战略


  数字化转型的下一个关键方面是应用现代化。随着组织向云原生应用开发和部署过渡，实施稳健的应用现代化战略至关重要。应用现代化并非“一刀切”的方法，它取决于每个组织的长期数字化转型目标以及云战略的选择。然而，组织可以采纳一些基本原则，以提高业务敏捷性、可扩展性和弹性，并减少技术债务。应用现代化可分为两大类——传统应用现代化和云原生应用
  DevOps。


  ## 传统应用现代化


  虽然在云原生范式下更容易构想和构建新应用，但重新架构和重写遗留应用并不总是可行的。当组织专注于应用现代化时，明确制定企业中现有遗留应用和传统单体应用的战略非常重要。以下是一些最佳实践：


  - **确定优先级并规划迁移**：使用 6R 方法对应用进行分类，为遗留应用现代化发布短期、中期和长期的迁移批次路线图，并将此传达给企业内的利益相关者。这通常是奠定云转型基调的重要第一步。

  - **契合度评估**：进行全面的契合度评估，以根据目标状态目标识别适合迁移的候选应用和阻碍因素。例如，某些计划重写的遗留应用，在采用混合云战略的情况下可以保留在本地；而对于采用分阶段转型方法或数据中心退出战略的组织，则可以将这些应用重新托管、共置或迁移到公有云。

  - **利用容器实现现代化**：对于使用 Java 和 .NET 技术栈构建的传统应用，利用容器对其进行现代化改造，使其适配云端。企业通常可以将此策略作为中间阶段策略来采用，之后再将应用完全重新架构为云原生。

  - **虚拟化策略**：在传统企业中，应用通常运行在各种虚拟化技术上，而这些技术往往是专有的。这些技术可能包括 VMware、Hyper-V 或**红帽虚拟化**（**RHV**）。由于云平台依赖**基于内核的虚拟机**（**KVM**）和
  Xen 等开放虚拟化标准，企业必须制定明确的策略来实现虚拟化应用的标准化。

  - **通过 API 网关进行抽象**：在某些情况下，一些遗留应用可能并非合理化、现代化或迁移的理想目标。然而，随着组织不断现代化并构建云原生应用，它们将不得不与这些应用无缝集成。API
  管理解决方案可以充当抽象层，将遗留应用的功能以标准 RESTful API 的形式暴露出来，使面向客户端的应用免受后端服务变化的影响，并让现代应用和云服务能够使用这些功能。该策略还允许企业快速构建外围应用并交付移动应用等新功能，同时允许底层应用随着时间的推移逐步实现现代化。API
  管理还为遗留服务带来了安全性、分析能力和可扩展性。


  ## 云原生 DevOps


  云原生应用开发是一套在云中构建和运行应用的原则和实践，旨在利用云计算平台的独特特性。DevOps 是一套强调开发团队与运维团队之间协作的实践，以确保应用能够快速高效地构建和部署，并且可靠、可扩展。云原生应用
  DevOps 是在云中构建和运行敏捷、可扩展、弹性且高效的应用的强大方式。让我们来探讨一些构建云原生应用的最佳实践：


  - **微服务架构**：使用微服务架构构建应用，以获得更好的可扩展性、灵活性和可维护性。利用 Docker 和 Kubernetes 等容器和容器编排技术来打包应用，并实现应用服务的自动化部署、扩展和管理。

  - **API 与服务网格**：实施 API 以实现微服务之间的通信，并考虑使用服务网格来管理服务与服务之间的通信。采用 API 优先的方法来加速应用设计，以便在混合云和多云环境中治理、分析并全面掌握所有应用
  API 的情况。






  *   **为互操作性而构建**：规划本地与多云环境之间的互操作性，以实现灵活性和风险缓解。设计应用程序时，应允许在不同云提供商之间轻松迁移数据。利用声明式方法来管理跨环境的策略。


  *   **通过无服务器实现扩展**：利用无服务器架构处理应用程序功能，以降低运维开销并提高资源利用率。无服务器计算平台能够根据流量自动扩展资源，从而消除基础设施管理和容量规划的需求。它鼓励设计响应事件和采用异步通信模式的应用程序。


  *   **现代化 DevOps**：在应用开发中采用 DevOps 实践，并实施 CI/CD 流水线以自动化测试、部署和发布流程，从而实现更快、更可靠的软件交付。在软件交付中利用安全的软件供应链实践，例如用于存储、管理和保护容器镜像的无服务器
  CI/CD 流水线制品注册表，实施二进制授权以控制部署，并使用 AI 辅助 IDE 插件以提升代码质量和开发人员生产力。使用 IaC（基础设施即代码）定义和管理基础设施，允许以声明式方式抽象目标部署平台，从而实现一致且可重复的部署。


  *   **为韧性进行架构设计**：通过构建分布式环境中的冗余和故障转移机制来设计系统以应对故障。实施混沌工程原则，以主动测试并提高系统韧性。


  *   **数据管理**：选择可扩展且与云服务兼容的云原生数据库和存储解决方案。考虑采用事件溯源和**命令查询职责分离**（**CQRS**）以实现数据一致性和可扩展性。


  让我们现在探讨如何在云原生环境中现代化企业数据生态系统。


  # 数据现代化


  云环境中的数字化转型的下一个方面是数据管理。云原生数据管理代表了一种战略紧迫性，旨在帮助企业利用现代 IT 架构的全部潜力。通过遵循云原生设计原则，集成先进技术，并优先考虑安全性和合规性，组织可以构建一个坚韧且灵活的数据基础设施，以适应数字环境不断变化的需求。在混合云中迈向有效的云原生数据管理之旅，不仅仅是一次技术进化；它是对数据驱动型企业未来的战略投资。随着企业数据呈指数级增长——来自社交媒体、IoT
  设备以及曾经不存在且对业务功能不关键的现有市场趋势等新数据源——拥有一个清晰且健全的数据策略对企业至关重要。随着企业内部出现新的数据管理功能和角色，例如**首席数据官**（**CDO**）和**首席数据与分析官**（**CDAO**），这一点得到了证实。现代数据也经历了一种独特的范式转变，如今企业处理的数据越来越倾向于非结构化和半结构化。根据一项
  IDC 调查，到 2025 年，全球数据圈将达到 175 ZB，其中 80% 的数据是非结构化数据 *[7]*。在一篇题为*你的数据战略是什么？*的文章中，**哈佛商业评论**（**HBR**）认为，企业用于制定业务决策的数据不到
  50%，而被利用进行分析的非结构化数据甚至不到 1% *[8]*。这意味着组织现在更擅长收集和存储海量数据，但缺乏从中实现价值的手段。以下是企业可以采用的一些基础数据现代化原则：


  *   **构建平台无关性**：开放数据格式已经革新了现代数据湖架构，实现了完整的数据互操作性、可移植性和灵活性，并防止供应商锁定。开放格式促进了各种系统之间的无缝数据交换，使将分析、处理引擎和其他工具集成到企业数据湖环境变得更加容易，同时通过启用多个应用程序和分析工具以一致的格式读写数据来增强数据可访问性。随着数据湖架构的演进，开放格式支持新数据源的集成和新兴技术的采用。对于寻求保护其数据湖基础设施未来的企业来说，这种适应性至关重要。


  *   **促进模式演进**：选择支持模式演进的开放格式，允许随时间推移更改数据结构而无需重新组织整个数据湖。这是一个重要的灵活性优势，因为企业经常需要适应不断变化的业务需求。开放格式的选择还提供了高效的压缩算法，降低了存储成本并提高了性能。例如，Parquet
  和**优化行列式存储**（**ORC**）是列式存储格式，提供出色的压缩比，适用于大规模数据湖。


  *   **单副本数据湖架构**：构建单副本数据湖架构涉及为多种数据源创建一个统一和集中的存储库，减少冗余并促进数据一致性。企业今天面临的一个常见挑战是数据蔓延和数据孤岛。例如，同一数据集为多个部门、多种用途被复制多次，导致数据量、数据管道、数据治理、数据不一致性和数据安全挑战呈指数级增长。这还导致了*数据不信任综合征*，即企业无法再保证数据源的可信度。企业可以利用的一种策略是联邦数据网格架构，其中数据作为服务由业务数据域提供。


  *   **通过 AI 释放数据价值**：随着非结构化数据持续增长，传统平台工具不具备实现其价值的能力。在数据生态系统中嵌入 AI 能力，在释放数据潜能方面可能极其强大。随着
  AI 格局的快速演变，组织必须调整并适应 AI 策略和新兴技术。例如，组织可以利用 AI，基于浏览活动和用户行为向客户提供相关的、实时的、个性化的推荐。


  *   **整合和统一工具**：制定策略以整合和统一企业内部利用的数据平台和工具。这可以包括标准化专有数据仓库平台、合理化数据湖以及整合分析工具，从而简化流程，减少技术债务，提高整体生产力。


  数字原生数据管理涵盖七大领域——*摄取*、*处理*、*存储*、*分析*、*激活*、*保护*和*治理*。


  以下是企业可以采用的一些最佳实践，用于定义现代数据战略：






  # 现代数据架构


  ## 数据接入


  高效的数据接入是现代数据架构的关键组成部分，可确保多样化数据无缝、及时地流入集中式存储库。数据接入的最佳实践包括采用可扩展的事件驱动架构，以实现对来自众多数据源（从遗留系统到
  SaaS）的数据进行实时或近实时的处理。采用诸如 Apache Avro 或 Parquet 之类的 schema-on-read 方法，可确保在处理不同数据类型时具备灵活性。使用
  Apache Kafka 等开放标准编排数据管道，可实现数据跨系统的可靠、安全移动。在接入阶段优先考虑数据质量检查、验证和错误处理，对于维护数据完整性至关重要。元数据管理实践和数据血缘记录有助于全面理解所接入的数据，从而为治理和合规工作提供支持。同样重要的是，采用模块化和可扩展的方法来适应不断变化的数据源和不断变化的业务需求，确保数据接入流程的适应性和可持续性。


  ## 数据处理


  现代数据架构中的高效数据处理可使组织从海量多样的数据集中获取宝贵洞察。数据处理的最佳实践包括利用 Apache Spark 或 Apache Flink 等分布式数据处理框架来处理大规模数据处理任务。实施实时流式处理、批量数据传输、数据分区和并行处理策略，可通过充分利用底层基础设施的全部处理能力来提升性能。在适用的情况下，内存处理和缓存机制有助于缩短查询响应时间。作为数据处理阶段的一部分，组织应审慎地优先考虑容错性，设计稳健的错误处理、重试机制和检查点策略，以确保数据处理工作流的韧性。与
  Apache Airflow 等数据编排工具的集成可简化工作流管理和调度。采用无服务器计算和云原生技术，可根据需求自动扩展，从而优化资源利用率和成本。


  ## 数据存储


  遵循单副本数据湖架构的原则，数据存储策略对于适应不断增长的数据量和数据多样性至关重要。组织可以利用基于云的存储解决方案来实现可扩展性、持久性和成本效益，从而规划数据湖仓。为关系型、NoSQL、内存缓存和对象存储中的结构化、半结构化和非结构化数据制定稳健的策略。实施数据分区和索引策略可以优化查询性能，尤其是在大型数据集中。定期根据使用模式对数据进行归档和分层存储有助于成本优化。组织还应考虑将数据湖用作各种数据类型的集中存储库，通过版本控制和文档记录促进数据存储的灵活性和敏捷性，从而增强数据血缘和元数据管理。


  ## 数据分析


  培养数据驱动型文化有助于提升组织的竞争优势，使分析洞察无缝融入决策流程。这涉及采用高级分析和现代机器学习技术，从海量数据集中提取可操作的智能。利用 Apache
  Spark 等开放分布式计算框架，可为复杂的分析任务实现可扩展和并行的数据处理。通过自助式 AI 驱动的分析工具实现数据民主化，可使业务用户独立探索和分析数据。持续监控分析绩效并建立用户反馈循环，能够实现迭代改进和优化。


  ## 数据激活


  在现代数据架构的背景下，数据激活是将洞察转化为可执行结果的关键步骤。在企业内部实现数据激活的民主化对众多人员而言十分重要。一些策略包括构建统一的语义层，以便为各种分析平台和工具上的分析提供数据服务。企业还可以在分析中利用现代
  AI 能力，例如**生成式 AI**（**GenAI**），并为非传统业务用户提供数据服务，以满足临时报告和快速获取洞察的需求。


  ## 数据安全


  鉴于数据日益复杂和庞大，加之网络威胁不断演变，在云原生现代数据架构中确保强大的数据安全至关重要。数据安全的最佳实践包括：对静态数据和传输中的数据实施强加密机制，并利用
  SSL/TLS 进行安全数据传输；纳入 DiD 安全策略，包括实施统一访问控制和 IdM 以执行 PoLP，确保用户无论通过何种访问方式都只能访问其角色所需的数据；以及采用数据脱敏和匿名化等
  DLP 机制，在分析和共享过程中保护**个人身份信息**（**PII**）和敏感数据。


  ## 数据治理


  统一的数据治理是现代数据架构成功的基础，确保数据得到负责任的管理、保护和利用。数据治理的一些最佳实践包括为数据质量、隐私和安全制定明确的政策和标准。组织应明确不同**业务部门**（**BU**）对数据的所有权和问责制，培养责任和管理文化。实施全面的元数据管理策略也有助于理解和跟踪数据血缘，增强透明度和合规性。定期审计和监控数据访问、使用和变更，有助于维护数据的完整性和安全性。


  在了解了如何在云端实现数据生态系统现代化之后，接下来让我们探讨如何优化云成本并实施云治理，以从云采用中最大化业务价值。


  # 云优化与成本治理


  随着云原生继续推动整个企业的创新，优化和治理对于在创新与成本控制之间取得适当平衡至关重要，从而实现可持续、负责任且成功的长期云应用。FinOps 代表了财务、运营和工程团队之间协作管理云支出的文化。据麦肯锡称，到
  2030 年，价值驱动因素可使云在整个《福布斯》全球 2000 强企业中带来超过 3 万亿美元的**税息折旧及摊销前利润**（**EBITDA**）价值 *\[9\]*。该研究还定义了企业如何在以下三个维度上最大化所获取的云价值：


  ## 焕新


  该维度定义了企业可从云支出（包括应用程序开发、基础设施和维护）中的 IT 成本效率中获得的潜在价值。IT 成本优化涉及优化应用程序开发、IT 维护和基础设施方面的成本，提高业务韧性，并利用最新云技术的进步来改善整体
  IT 运营。


  ## 创新


  该维度定义了企业可通过解锁云中的现代技术（如高级分析、物联网和自动化）所能获得的价值，包括收入提升。企业可以利用新的用例来推动创新，并通过降低技术获取门槛和实现技术民主化来加速**上市时间**（**TTM**）。





  - **先驱**：先驱维度涉及试验新兴技术并探索新的商业模式。例如，试验诸如区块链、量子计算、**增强现实/虚拟现实**（**AR/VR**）和生成式 AI 等现代云技术，可以帮助企业引领变革和数字颠覆。


  根据*Flexera 2023 云状态报告*，82%的企业将管理云支出列为首要组织挑战*\[10\]*。让我们回顾一下云 FinOps 框架，企业可以利用该框架来掌握成本治理并最大化在云中实现的收益。


  云 FinOps 框架是一套最佳实践和指导原则，组织可以遵循这些原则来优化云资源的财务管理。其目标是对齐财务、运营和技术团队的目标，确保云操作的成本效益。早期采纳
  FinOps 并将其作为组织内的一项实践，对于最大化云投资的商业价值至关重要。云 FinOps 框架的核心是在整个组织中培养 FinOps 文化，促进协作和共同承担云成本的责任。该框架通常由以下几个关键支柱组成，核心是一个
  FinOps**卓越中心**（**CoE**）。对于拥有成熟云采用的现代企业，应努力建立 FinOps CoE，其主要目标是通过教育和赋能人员、利用云技术的持续进步、建立标准化流程，同时保持维护和改进整体绩效、生产率和效率的目标，来最大化云投资的收益。领导层的参与和支持对于推动协作文化至关重要，对于
  FinOps CoE 的成功极其关键，否则可能会疏远团队，而不是共同朝着共同的目标努力。让我们详细看看这些 FinOps 阶段。


  ## 信息阶段


  *信息*阶段是组织 FinOps 旅程的第一步。这是一个关键阶段，涉及从各种来源收集数据，以获取组织云使用情况和支出模式的见解。正如著名的管理名言所说：“*你无法改进你无法衡量的事物*。”*信息*阶段对于衡量并清晰理解组织的云支出至关重要。然后可以利用这些数据创建报告、识别异常、将支出与同行进行基准比较、将成本分配给适当的
  BU，并为云资源创建分类法和标签。然后可以利用这些信息对如何优化整体云支出做出明智的决定。该阶段的主要目标之一是收集详细的云资源分配信息，使 FinOps 团队能够将云资源利用率和成本与企业成本中心和业务利益相关者联系起来。这种可见性有助于责任分配、避免意外成本、识别改进机会以及向利益相关者展示云的业务价值。


  以下是在*信息*阶段通常执行的一些最佳实践：


  - 基于**总拥有成本**（**TCO**）估算整体云成本

  - 创建提供云使用情况和支出模式见解的报告

  - 通过云成本管理和建议工具，赋予团队可见性，以使其能够就绩效、成本和异常做出明智的业务决策

  - 通过创建分类法、标签和项目层次结构，将成本分配给 BU

  - 利用统一的云成本管理工具来报告、基准和预测成本

  - 利用云提供商提供的迁移工具和服务，发现和评估本地资源，以规划迁移和现代化

  - 将云支出与同行进行基准比较


  ## 优化阶段


  FinOps 框架中的下一个阶段是*优化*阶段。此阶段涉及识别并抓住优化组织云支出的机会，同时保持工作负载的相同性能水平。*信息*阶段获得的见解将用于指导优化工作。FinOps
  团队可以利用多种自动化技术来优化云成本和资源。这些技术可以包括使用承诺使用折扣，如预留或承诺实例以及长期承诺以降低成本，评估云环境并调整资源大小，采用等效的云原生功能（如无服务器），以及利用工具自动扩展或关闭不必要的资源。具体而言，此阶段关注的活动包括：


  - **关键绩效指标（KPI）**：用于跟踪进度和衡量优化工作成功率的指标

  - **利用云原生推荐服务**：这有助于提高云成本效益、性能、可靠性和安全性

  - **成果**：你希望通过优化工作实现什么目标？

  - **优化使用**：这包括识别和消除不必要或低利用率资源

  - **优化费率**：这包括与云提供商谈判以获得更好的价格

  - **业务案例**：这些文件将证明你优化工作的必要性，并帮助你获得资金


  ## 运营阶段


  *运营*阶段是 FinOps 框架的最后阶段。它涉及建立组织持续云成本管理和云治理的标准框架，使组织能够长期保持最佳的云使用和成本效率。在此阶段，重点将是组织和文化的
  FinOps 最佳实践采纳。以下是*运营*阶段的一些最佳实践：


  - 在云资源中建立护栏，以帮助确保云合规性，避免错误配置，并实施一致的资源共享策略治理

  - 在组织和项目层面实施云成本管理、预算和警报策略，以减轻成本失控

  - 利用云原生资源见解和最佳实践来优化持续和未来的云采用

  - 利用**云采用框架**（**CAF**）和**架构框架**（**WAF**）来采纳最佳实践，改善云旅程

  - 通过教育团队 FinOps 最佳实践，使团队能够学习新技能以最大化价值和效率，从而促进团队协作

  - 制定计划以激励最能利用和采纳 FinOps 最佳实践的团队


  # 总结


  在本章中，我们探索了数字化转型的各个方面以及企业可以利用的最佳实践，无论部署模式如何，都能建立坚实的云基础。我们回顾了企业如何必须从构建安全优先的云基础开始，以确保涵盖网络、数据、应用和资产管理的整体企业安全。我们还学习了如何在云原生生态系统中重新思考基础设施现代化。


  然后，我们探索了企业可以利用的策略来使应用景观和数据生态系统现代化。最后，我们回顾了优化云成本、最大化价值以及提高云资源效率和性能的最佳实践。


  在下一章中，我们将探索企业如何通过在云中领导与创新，利用新兴技术。


