  Google 的现任职位之前，Sathya 在 Oracle 担任企业架构师， spearheading 零售和医疗保健行业的面向市场和数字原生战略。他是一名技术布道者，定期在各种论坛上撰写新兴技术文章，也经常在行业活动和会议上演讲。Sathya
  拥有工商管理研究生学位和电子工程学士学位。除了专业工作外，Sathya 还担任 CDAO 圈子的顾问委员会成员，指导年轻毕业生，并为人道主义事业做志愿者。Sathya
  与妻子和两个女儿生活在北卡罗来纳州的 Apex。


