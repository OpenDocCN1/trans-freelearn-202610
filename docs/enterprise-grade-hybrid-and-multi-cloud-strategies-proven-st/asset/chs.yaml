- '## 11 ESG 与可持续发展


  **联合国气候变化大会**（**COP28**）在迪拜闭幕，达成了一项协议，标志着化石燃料时代*结束的开始*，该协议通过深度减排和扩大融资，推动向可再生能源进行公正公平的过渡*[1]*。**ESG**代表**环境、社会和治理**，包含一套用于衡量公司运营的可持续性和道德影响的标准。随着
  ESG 原则在各行各业的重要性日益凸显，它们不仅是锦上添花，更已成为企业蓬勃发展的核心必需品。由于利益相关者的期望、监管压力、竞争优势以及企业对应对全球挑战所起作用更广泛认知的汇合，可持续发展已成为各行业首席执行官的关键目标。随着首席执行官将可持续发展列为优先事项，企业不仅是在应对外部压力，也在认识到可持续实践为组织带来的战略价值和长期生存能力。





  全球范围内，涉及气候披露、供应链尽职调查、**多元、公平与包容**（**DEI**）以及制造业和循环经济等广泛主题的可持续发展和 ESG（环境、社会和公司治理）相关立法与法规正在日益增多。例如，2022
  年，美国**证券交易委员会**（**SEC**）提出了一项规则提案，旨在增强并规范公共公司提供的气候披露要求。根据新规定，各组织必须在注册文件和年度报告中提供具体的气候相关信息披露，包括与气候相关财务影响和支出相关的基本指标。作为旨在成为首个气候中和大洲的《欧洲绿色协议》的一部分，**欧洲联盟**（**欧盟**）法律要求所有大型企业和所有上市公司披露有关
  ESG 的信息 *\[2\]*。随着 ESG 和**企业社会责任**（**CSR**）标准在全球各地区不断演进，例如**欧洲可持续发展报告标准**（**ESRS**）、**国际可持续发展准则理事会**（**ISSB**）以及**自然相关财务披露工作组**（**TNFD**），在多个地区开展业务的全球组织将需要遵守这些法规。


  在本章中，我们将涵盖以下主题：


  - ESG 和可持续发展的原则

  - ESG 整合对企业产生的价值

  - 构建并实施 ESG 报告计划

  - 利用云作为 ESG 的赋能者


  # ESG 与可持续发展的定义


  ESG 指的是投资者和其他利益相关者用于评估一家公司超越其财务绩效之外对地球产生影响的准则集合。将 ESG 考量纳入企业实践的业务利益是多样的，且能对公司运营的各个方面产生积极影响。ESG
  原则有助于评估组织运营在可持续性和道德方面的影响。以下是 ESG 各组成部分的详细说明。


  ## 环境影响


  这一维度评估公司如何管理其对环境影响——对气候、生物多样性以及自然资源使用的影响：


  - **气候变化**：减少温室气体排放的努力、能源效率以及可再生能源的使用

  - **资源使用**：原材料的可持续采购、能源管理、水资源管理、燃料管理以及废物减量

  - **生物多样性**：保护生物多样性和生态系统的倡议、减少产品环境影响的努力以及材料采购


  ## 社会影响


  社会维度关注公司与员工、客户、社区和其他利益相关者的关系：


  - **员工关系**：在员工健康、安全与福祉方面的努力，实施公平工资、劳动实践、多元与包容

  - **社区参与**：社会责任、慈善事业以及对社区发展的贡献

  - **客户关系**：产品安全、质量、道德营销、公平广告、公平披露及产品标签

  - **人权**：尊重供应链和企业运营中的人权


  ## 公司治理


  治理考察指导组织的系统和结构，包括其领导力、透明度和问责制：


  - **董事会结构**：董事会的独立性、多样性及其有效性

  - **风险管理**：事故和安全管理、系统性风险管理实践

  - **高管薪酬**：公平透明的高管薪酬实践

  - **反腐败措施**：防止腐败和贿赂的政策与实践

  - **股东权利**：保护股东权利及公平对待


  这些 ESG 原则通常被用作评估企业可持续性和道德实践的框架，因为投资者、评级机构和其他利益相关者越来越多地将 ESG 因素纳入其决策过程。展现出强劲 ESG
  绩效的公司通常被视为更具韧性、更具责任感，并更受那些优先考虑可持续和社会责任投资的投资者青睐。


  # ESG 对企业来说的价值


  将 ESG 整合到业务实践中可以提升品牌声誉、改善风险管理、降低成本、增加融资渠道并增强长期韧性，最终有助于企业的整体成功与可持续发展。以下是可持续性成为企业首要议程的关键原因。


  ## 利益相关者的期望


  随着 ESG 原则成为核心焦点，内部和外部利益相关者的需求持续推动着业务优先事项。以下是利益相关者的主要期望：


  - **投资者需求**：投资者越来越要求公司不仅要展示财务绩效，还要体现 ESG 责任。如今，许多投资者将可持续性因素视为衡量公司长期可行性的关键指标。

  - **客户偏好**：消费者正变得更加具有环境和社会意识。那些与可持续实践相符的公司，可能通过吸引那些偏好来自环境和负责任公司的产品与服务的客户而获得竞争优势。

  - **员工期望**：劳动力，特别是年轻一代，越来越寻求与其价值观一致的雇主。优先考虑可持续发展的公司可以通过营造具有目的驱动性和社会责任的工作环境来吸引和留住顶尖人才。


  ## 竞争优势


  驱动业务价值的另一个主要考量因素是企业 ESG 目标在行业中带来的竞争优势：


  - **创新与差异化**：可持续性可以驱动公司内部的创新，从而促成新产品、新服务和流程的开发。优先考虑可持续发展的公司往往致力于培育一种创新文化，以开发环保的产品和流程，从而实现长期的竞争力。首席执行官们认识到，对可持续发展的承诺可以让其公司在市场中独树一帜，并增强竞争力。

  - **品牌声誉**：消费者和其他利益相关者重视具有强大可持续发展资质的公司。首席执行官们理解，在环境和社会责任方面拥有良好声誉可以增强品牌忠诚度和信任，从而对购买决策产生积极影响。


  ## 长期业务可行性


  长期业务可行性是 ESG 驱动的另一项重大价值，其结果包括：


  - **韧性与适应性**：面对全球挑战，首席执行官们日益认识到长期韧性和适应性的重要性。可持续的商业实践通过考虑对环境、社会和治理的长期影响，有助于提升公司的整体韧性。

  - **资源效率**：诸如能源效率和负责任资源管理等可持续实践有助于节约成本和运营效率，支持公司的长期财务健康。

  - **员工生产力**：拥有强大社会实践（包括公平劳动标准、多样性和员工福祉计划）的公司，往往具有更高的员工满意度和生产力，从而降低流失率和招聘成本。


  ## 风险缓解


  随着全球对道德责任要求的提高，商业伙伴更倾向于与拥有共同 ESG 目标的组织合作。采用 ESG 原则可以通过以下方式帮助缓解风险：





  # 构建可持续发展计划


  构建有效的 ESG 可持续发展计划需要采取战略性和综合性的方法。这涉及从各种数据源收集 ESG 数据、定义指标、进行测量、基准对比和报告。在本节中，我们将回顾主流的
  ESG 报告标准和框架，并构建一个可持续发展计划。


  ## 为什么 ESG 能驱动商业价值


  ### 气候与环境风险

  气候变化和环境退化对商业可持续性构成重大风险。企业认识到纳入可持续发展实践以减轻环境风险、确保长期运营连续性并避免潜在法律和财务挑战的必要性。


  ### 供应链韧性

  可持续发展举措（如负责任采购和供应链透明度）有助于构建更具韧性、更不易受干扰影响的供应链。


  ### 监管格局

  全球各国政府正日益实施并收紧与环境和社会问题相关的法规。CEO 们明白，使其公司与可持续发展目标保持一致，不仅是道德责任的体现，也是遵守当前和未来监管要求的策略。


  ## ESG 报告标准与框架


  ESG 标准和框架为组织提供了一种结构化方法，用于评估和改进其在影响环境、社会和治理的关键领域的表现。如今，存在各种框架和标准——自愿报告、监管类和基准测试类——以指导组织将
  ESG 原则融入业务运营。ESG 咨询公司治理与问责研究院在一项研究中报告称，标普 500 指数中的最大型公司 ESG 披露率已接近 100%，而构成罗素 1000
  指数中市值最小一半的中型公司也在持续缩小差距，2022 年有 82% 发布了报告。


  那么，为什么 ESG 框架和标准很重要？如果没有遵循的框架或标准，对公司 ESG 得分所处位置进行基准测试和衡量极其困难，也会给目标设定留下空间，导致目标要么过于遥远且缺乏阶段性里程碑，要么随意设定，甚至导致漂绿等意外做法。漂绿是指公司利用误导性广告或语言，将自身或其产品宣传为可持续或环保的做法。这可能导致罚款甚至品牌声誉受损等后果。例如，一家公司可能设定一个宏大的、跨越数十年的目标，即到
  2050 年实现碳中和或净零排放，又或设定购买碳信用额或碳抵消等表面性目标。碳抵消是指公司投资于绿色减排项目，以换取碳信用证书，而非自行减少碳排放的项目。


  尽管不同地区存在多种不断演进的 ESG 框架和标准，但框架的选择取决于组织的实质性评估、利益相关者期望、区域或地理分布以及行业需求。以下是一些主流框架。


  ### 可持续发展会计准则委员会 (SASB)

  SASB 是一个非营利组织，成立于 2011 年，专注于可持续发展会计以及环境、社会和公司治理。截至 2022 年，SASB 标准制定职责由国际财务报告准则 (IFRS)
  基金会下属的 ISSB 承担。SASB 标准赋能组织向利益相关者提供行业特定的披露，内容涉及可能影响现金流并影响投资者决策的可持续发展风险和机遇。SASB 确定了
  77 个行业，并定义了每个行业中与投资者决策最相关的可持续发展议题。


  ### ISSB

  作为 IFRS 基金会的一部分，ISSB 发布了两项可持续发展披露准则，旨在创建一套统一的全球披露标准，用于向投资者报告 ESG 数据。IFRS S1 涉及与可持续发展相关的财务信息一般要求，IFRS
  S2 涉及气候相关披露。


  ### 全球报告倡议组织 (GRI)

  GRI 是一个自愿报告框架，也是国际上最受认可的标准和框架之一。GRI 标准为组织编制自身的可持续发展报告提供指导 [3]。GRI 标准设计为模块化，通过三大标准全面展示组织的实质性议题、相关影响及其管理方式：


  - **通用标准**：帮助报告人权和环境尽职调查，符合适用于所有组织的政府间期望

  - **行业标准**：帮助实现行业或部门特定标准的一致性报告

  - **专题标准**：帮助适应通用标准的修订和披露


  ### 碳信息披露项目 (CDP)

  CDP 是一个非营利慈善组织，运营着面向投资者、公司、城市、州和地区的全球披露系统，以管理其环境影响 [4]。使用 CDP 的组织需回复 CDP 问卷，并相应获得
  CDP 评分。CDP 被视为企业环境报告的黄金标准，并完全符合气候相关财务信息披露工作组 (TCFD) 的建议 [5]。截至 2023 年 10 月，TCFD
  已解散并并入 IFRS 基金会，接管对公司气候相关披露的监测和进度跟踪工作。


  ### 国际综合报告框架

  国际综合报告框架现已并入 IFRS 基金会，旨在推动综合报告的采用 [6]。该框架旨在提高投资者和金融资本提供者可获取信息的质量，推动统一高效的企业报告方法，强化对多种资本的问责和受托责任，并鼓励优先考虑短、中、长期创造企业价值的决策。


  ### 欧盟企业可持续发展报告指令 (CSRD)

  欧盟 CSRD 建立了一个名为 ESRS 的报告框架。该框架包含环境、社会、治理和横切性要求，旨在增强欧盟 ESG 报告的广度、深度和一致性，同时提高可持续发展信息对投资者的可靠性和实用性
  [7]。该框架已最终确定 12 项 ESRS 准则，包括 2 项适用于所有可持续发展事项的横切性准则，以及 10 项涵盖广泛环境、社会和治理事项的专题准则：


  - **环境准则**：ESRS E1 气候变化，ESRS E2 污染，ESRS E3 水和海洋资源，ESRS E4 生物多样性和生态系统，ESRS E5 资源利用和循环经济。

  - **社会准则**：ESRS S1 组织自身员工，ESRS S2 价值链工人，ESRS S3 受影响社区，ESRS S4 消费者和最终用户。

  - **治理准则**：ESRS G1 商业行为。

  - **横切性准则**：ESRS 1 规定一般要求，ESRS 2 规定一般披露。


  ### 联合国全球契约




  联合国全球契约为企业可持续发展规定了五大核心特征，包括负责任经营、强化社会贡献、承诺最高层领导力、报告进展以及采取本地行动。联合国全球契约还提供了一个动态管理框架——联合国全球契约管理模型，作为四大领域的指南：人权、劳工、环境和反腐败。


  在回顾了提供结构化 ESG 报告方法的各类 ESG 标准和报告框架后，让我们探讨双重重要性的概念及其对企业的影响。


  # 双重重要性评估与报告


  双重重要性的概念承认了企业与其外部环境在 ESG 因素方面的双向关系。它强调了同时考虑外部因素如何影响企业，以及企业如何通过其行动和决策影响更广泛的 ESG 格局的重要性。这对于旨在将可持续发展融入核心业务战略和运营的企业至关重要。双重重要性是财务重要性与影响重要性的交集或并集。虽然财务重要性是传统财务报告中一个成熟的概念，但在
  ESG 报告的背景下它已有所演变。ESG 领域的财务重要性描述了企业通过 ESG 和可持续发展举措创造经济价值的情况。影响重要性描述了企业决策对环境和外部利益相关者的影响。


  每当企业做出战略决策时，各行各业都能看到双重重要性的体现。例如，当一家制造企业为其生产采购原材料时，影响重要性可以描述在上游和下游价值链上实施可持续采购实践如何影响环境，而财务重要性则描述企业在材料成本、消费者忠诚度和品牌声誉等方面的财务影响。


  从组织背景、行业和运营的角度来看，每个组织都是独一无二的，双重重要性的方法也是如此。然而，组织可以考虑一些最佳实践，例如进行双重重要性评估，并利用标准框架进行双重重要性报告。进行双重重要性评估通常类似于一个研究项目，有助于识别哪些环境、社会和治理问题对业务具有影响力和相关性。这通常可以通过精心挑选公司内部的利益相关者群体来识别和描述用于双重重要性评估考量的实质性议题来完成。组织还可以对利益相关者进行访谈，以了解他们对影响、风险和机遇的看法，随后将其总结以得出财务重要性和影响重要性。以下是**赛诺菲**——一家总部位于法国巴黎的跨国制药和医疗保健公司——进行的双重重要性评估示例
  *\[8\]*。该矩阵展示了赛诺菲在 2022 年识别出的 16 个实质性议题，这些议题在 `y` 轴上的影响重要性与 `x` 轴上的影响重要性进行了映射：


