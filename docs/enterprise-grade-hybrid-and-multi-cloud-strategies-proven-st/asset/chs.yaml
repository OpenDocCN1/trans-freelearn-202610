- '# 第 1 部分：企业规模下云采用的挑战


  在本部分，我们将探讨并理解企业在进行云端数字化转型时所面临的挑战，以及领导力愿景、意志和思维方式的重要性。我们还将回顾云计算的基本要素，以及组织如何利用云来推动业务敏捷性。最后，我们将探讨企业在云转型中面临的各种挑战和复杂性，以及应对这些挑战的策略。


  本部分包含以下章节：


  * *第 1 章*, *领导力、意志和思维方式*

  * *第 2 章*, *云计算入门*

  * *第 3 章*, *企业云采用的挑战*

  '
- "## 1 领导力、意志和思维方式\n\n在关于云计算的书籍中，你可能会觉得出现一整章专门讨论领导力、意志和思维方式有些不寻常。随着技术持续指数级演进，企业往往陷入两难境地；有些因害怕失败而落后于创新曲线，而另一些则开始追逐每一个新趋势。这直接反映了缺乏愿景和领导力。在我们深入云计算世界之前，本章的目的是认识到领导力、意志和思维方式对于成功数字化转型的重要作用。\n\
  \n在当今的数字世界中，组织应对市场需求的业务敏捷性与其数字成熟度和能力成正比。在现代企业架构的表述中，IT 已从传统的成本中心演变为业务创新的核心支柱。在每一次成功的数字化转型核心，领导力、意志和思维方式都是不可或缺的。强大的有远见的领导者设定愿景和战略方向，塑造创新型组织文化，并倡导企业数字化转型，以挖掘组织在增长和竞争力方面的全部潜力。\n\
  \n数字化转型已成为快速演进的技术环境中推动创新的关键因素。它不仅仅是一个选项或趋势；对于企业生存、蓬勃发展并保持竞争力而言，它已成为必需。数字化转型涉及将数字技术整合到组织的各个方面，从根本上改变其运营方式和为客户创造价值的方式。然而，成功的数字化转型需要的不仅仅是采用新技术。所有成功组织共有的一个属性是它们创新并为消费者创造价值的能力。为什么有些组织比其他组织更成功，创新几乎总是自然发生且不需要外部动机？答案在于强大的领导力、意志和思维方式，能够指导、激励并培养可持续的创新文化。创新型领导者通过制定清晰的愿景、营造实验环境、倡导以客户为中心以及赋能团队协作，在企业中释放数字化转型。在本章中，我们将探讨领导力、意志和思维方式在设定企业数字化转型步伐和基调方面的关键作用。我们还将深入探讨以下内容：\n\
  \n* 创新对于现代企业而言不仅仅是一个选择，而是要在竞争环境中保持可持续发展和繁荣\n* 各行业数字化趋势的指数级演进\n* 通过创新连续体建立创新流程\n\
  * 两个企业的故事——柯达和富士胶片，以及领导力、意志和思维方式如何塑造了它们的命运\n* 企业领导者如何引领战略性和可持续的数字化转型？\n\n让我们通过以下案例研究来理解为什么创新不是选择而是必需。\n\
  \n### Blockbuster 案例研究\n\n1985 年秋季，David Cook 创立了 Blockbuster，它后来不仅成为视频/DVD 电影租赁的场所，也成为当地电影爱好者聚会社交的社交空间。在接下来的几年里，在其成功的推动下，Blockbuster\
  \ 将业务扩展到国际市场，成为家喻户晓的名字。不久之后，Viacom 收购了 Blockbuster 并于 1999 年将其上市。在其巅峰时期，Blockbuster\
  \ 在全球拥有超过 9000 家门店，收入达 5.9 百万美元的美元 [*1*]。在势头和消费者需求的推动下，Blockbuster 巩固了其地位和商业模式，并利用其几乎垄断的市场优势惩罚忠实消费者逾期归还；这一点可以从\
  \ 2000 年约 16% 的 Blockbuster 收入来自滞纳金这一事实得到证明。进入世纪之交，随着技术的指数级增长，客户偏好和需求正在迅速演变。消费者不再走进实体店租赁\
  \ DVD，而是更喜欢在网上浏览 DVD 并以可接受的订阅费送货上门，且免除 Blockbuster 以此闻名的滞纳金。利用数字化颠覆和不断变化的客户需求，Netflix\
  \ 和 RedBox 等多家新玩家进入视频租赁领域，提供 DVD 邮寄和在线流媒体等新渠道。尽管消费者需求发生变化、数字化颠覆以及竞争加剧，Blockbuster\
  \ 几乎没有改变其战略，拒绝适应不断变化的市场趋势。具有讽刺意味的是，在 2000 年，Blockbuster 拒绝了以 5000 万美元收购 Netflix\
  \ 的提议，这随后导致 Blockbuster 在十年内申请破产 [*2*]。\n\n导致 Blockbuster 衰落的主要因素如下：\n\n* **未能拥抱数字化颠覆**：Blockbuster\
  \ 对现有商业模式感到满意，未能认识到行业趋势以及客户需求和偏好的转变，导致其忽视在线租赁和流媒体服务的潜力，而这些服务最终颠覆了传统的实体视频租赁模式。该公司在适应在线订阅和流媒体等新兴趋势方面反应太慢，而\
  \ Netflix 等竞争对手已利用数字技术为消费者提供便利和可及性，造成 Blockbuster 市场份额受损。\n* **未能创造客户价值**：Blockbuster\
  \ 将重点放在营业收入而非创造消费者价值上。该公司在通过向忠实客户收取滞纳金来最大化利润和收入的同时，未能为消费者创造价值。它也未能评估采用现代数字趋势所能产生的显著消费者价值。Netflix\
  \ 等竞争对手提供了更大的便利性、更广泛的内容库、个性化推荐以及与消费者产生共鸣的订阅模式。Blockbuster 难以与竞争对手提供的产品和价值主张相匹配。\n\
  * **战略决策不佳**：Blockbuster 做出了一系列加剧其衰落的战略失误。例如，该公司在 Netflix 初期错过了收购机会，低估了新兴商业模式的潜力。Blockbuster\
  \ 还推出了 DVD 亭和在线流媒体等后期进入举措，但这些努力未能收复失地。\n\n\n\n\n自造纸术、青霉素和电力以来，世界经历了多次彻底改变世界的科技创新。然而，过去一个世纪的发明，如飞机（1903\
  \ 年）、电视（1927 年）、录像机（1965 年）、个人电脑（1971 年）、手机（1973 年）、互联网（1983 年）、万维网（1989 年）、便携式\
  \ GPS（1990 年）、Google 搜索（1997 年）、Facebook（2004 年）、YouTube（2005 年）、iPhone（2007 年）和\
  \ Android（2008 年），已将技术进步民主化，惠及大众。\n\n另一种从根本上改变企业创新方式的技术进步是人工智能（AI）。1950 年，艾伦·图灵在其开创性论文题为\
  \ *计算机器与智能* 中以一个发人深省的问题开篇，“*机器能思考吗？*” [*3*]。此后，人工智能经历了快速演进，已成熟为一种颠覆性技术，对几乎每个行业都产生了深远影响。人工智能正在推动各种创新应用，包括自动驾驶汽车、机器人手术、欺诈检测，以及能够创作新艺术的生成式人工智能，仅举几例。\n\
  \n如果我们将这些颠覆性技术与其渗透市场所需的时间进行对照，近期出现的技术进步，如个人电脑、互联网、移动设备、社交媒体和数字支付，相较于前几代的创新，仅需约四分之一的时间就能渗透市场\
  \ [*4*]。事实上，现代技术颠覆只是在呈指数级增长，迫使各行业的企业跟上步伐或落后 [*5*]。值得注意的是，数字时代的现代技术创新（图表下方突出显示的区域）已呈指数级渗透全球市场：\n\
  \n![图 1.1 – 技术创新及其渗透世界市场所需的时间](img/B18893_01_1.jpg)\n图 1.1 – 技术创新及其渗透世界市场所需的时间\n\
  \n让我们比较两种革命性的技术进步——汽车和手机。汽车的发明颠覆了我们的出行方式，而手机的发明不仅改变了人们的沟通方式，也改变了现代企业的运营方式。自 19 世纪末发明以来，汽车行业花了六十多年才渗透市场并站稳脚跟，而手机的出现仅用了十年。现代技术以惊人的速度演进，企业保持相关性至关重要。\n\
  \n对于移动设备制造商而言，跟上每个十年之交快速的技术进步和通信技术指数级颠覆并不容易：模拟蜂窝（1G）、数字蜂窝（2G）、移动宽带（3G）、原生 IP 网络（4G）和新空口（5G）；曾经占据显著市场份额的传统厂商，如诺基亚和摩托罗拉，被三星和苹果等新进入者取代\
  \ [*6*]。\n\n# 创新不是可选项\n\n许多历史悠久的企业发现难以实现有机增长，而年轻公司则表现优于老牌企业。为了说明这一点，随着数字化颠覆速度的加快，标普\
  \ 500 公司平均存续期一直在下降 [*7*]。20 世纪 70 年代末，标普 500 公司的平均年龄为 35 年，预计到 2027 年这一数字将进一步降至仅\
  \ 12 年。\n\n在数字化颠覆中经受住考验的组织，都采用了不断演进的战略，以帮助它们在更不稳定或不确定的市场环境中保持韧性。对新进入者或初创公司来说，提出一个颠覆整个行业的想法并不需要太多努力。让我们看看几家偏离传统方法并彻底革新各自行业的公司：\n\
  \n*   **Airbnb** 成立于 2008 年，是最大的住宿平台之一，颠覆了酒店业。传统酒店公司拥有、维护和运营物业，而 Airbnb 通过作为短租民宿和度假体验的在线市场，革新了旅游业。\n\
  *   **Uber** 成立于 2009 年，是最大的共享出行公司，颠覆了汽车租赁和租赁行业。传统汽车租赁公司将汽车租赁给客户，而 Uber 仅通过移动应用程序提供拼车服务，改变了这一动态。\n\
  *   **Netflix** 成立于 1997 年，最初是 DVD 租赁业务，如今已成为最大的流媒体平台，改变了消费者租赁和观看电影及电视节目的方式。虽然 Netflix\
  \ 也制作自己的电影和电视节目，但它主要租赁可在其平台上流媒体播放的电影和电视节目。\n*   **Amazon** 成立于 1994 年，最初是图书在线市场，通过作为连接买家和卖家的市场平台，成为最大的在线零售商，革新了零售业，而传统零售商必须拥有和运营实体砖石店并管理库存。此后，亚马逊转型为集团公司并扩展到多个行业。\n\
  *   **Spotify** 成立于 2006 年，是最大的音乐流媒体服务，但并不拥有任何音乐。相反，它从唱片公司获得音乐许可，并允许订阅用户付费流媒体播放。\n\
  *   **Robinhood** 成立于 2013 年，通过提供股票、交易所交易基金和加密货币的免佣金交易，颠覆了金融服务行业，这在以前是不可想象的。Robinhood\
  \ 通过简单的移动应用程序实现了交易的民主化。\n*   **Teladoc** 成立于 2002 年，是最大的远程医疗公司之一，通过利用移动技术在医疗机构之外随时虚拟连接患者和医生，颠覆了医疗保健行业。与传统医疗保健提供者不同，Teladoc\
  \ 不雇佣医生，也不拥有医疗设施。\n*   **Pillpack** 成立于 2013 年，颠覆了传统上由在实体空间运营的零售商主导的制药行业，为患者配药。Pillpack\
  \ 构想并实施了整合多种药片处方并送货上门的理念。\n*   **Chime** 成立于 2012 年，是一家挑战者银行，完全通过在线和移动方式提供银行服务，通过提供免手续费银行、提前发薪、无手续费且无需信用检查的信用卡，颠覆了银行业，迫使传统参与者做出回应。\n\
  *   **Rent the Runway** 成立于 2009 年，是一家服装租赁公司，通过其在线平台允许客户租赁、订阅或购买设计师服装，颠覆了设计师服装行业。这种商业模式解决了消费者\
  \ overspending 以及拥有不常使用的服装如活动服装、婚纱和滑雪服等的主要顾虑。\n\n所有这些公司的一个共同点是，商业颠覆几乎总是由现代数字技术引领。让我们探讨企业如何创新并迈向数字前沿。\n\
  \n# 创新连续体\n\n与认为创新发生在孤立的真空环境中的信念相反，创新实际上是一个系统性和持续性的过程。创新不仅需要产生新想法，还需要实施和持续采用这些想法。这通常涉及克服重大的障碍和挑战，例如抵制变革、监管障碍或技术限制。它还要求系统性地识别和解决客户需求、了解市场趋势并利用可用资源和专业知识。\n\
