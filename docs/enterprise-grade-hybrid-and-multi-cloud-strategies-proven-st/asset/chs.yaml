- "## 6 构建开放且灵活的云框架\n\n在我们探讨了各种云转型之旅后，下一个关键步骤是建立一个开放且灵活的基础，以支持当前和未来的业务需求。开放的云框架对于企业数字化转型的成功至关重要，但在组织开始云之旅时往往是一个被忽视的方面。例如，一个组织可能在其孤立的业务部门内启动云之旅，不断推动数字化创新和转型的边界，随着时间的推移，这可能导致\
  \ **云债务**。云债务可能源于缺乏标准化的基础设施或平台、缺乏集成的既定标准、云反模式、缺乏治理以及缺乏复用。\n\n选择合适的技术栈和工具比实际选择云提供商和平台更为重要。无论组织是建立单一的战略云选择、混合云策略还是多云策略，建立基于开放标准且稳健的技术栈基础对于实现未来保障和助力可移植性都是必不可少的。建立基于开放标准的云框架需要在栈的各个层级进行仔细的评估和规划，包括基础基础设施、平台、应用、数据、安全和治理。在本章中，我们将探讨企业可以利用的策略来构建云转型的框架，包括平台、技术、工具的选择，以及企业必须警惕的一些云反模式。本章重点关注以下关键主题：\n\
  \n* 定义一个云采用框架，可为云转型提供结构化和方法化的方法\n* 各种混合云和多云部署模式\n* 混合和多云部署架构的基础网络蓝图\n* 企业的安全基础\n\
  * 设计安全优先的云架构\n* 云原生反模式\n\n在前几章中，我们探讨了企业可以采用的各种策略来选择合适的云提供商和平台、评估成熟度和能力，并进行工作负载评估和迁移策略。云转型之旅中的下一步逻辑是定义\
  \ **云采用框架** (**CAF**)。CAF 提供了一套结构化的指南，帮助组织以系统和高效的方式迁移到云端。它还充当规划、执行和治理云采用计划的蓝图。尽管\
  \ CAF 可以以各种粒度来定义，但定义云采用框架的四个核心阶段包括评估、规划、部署和优化。\n\n## 评估\n\n评估阶段充当诊断和规划步骤，帮助组织了解其当前状态并为迁移到云环境做好准备。评估阶段之后是其他阶段，重点关注更深入的规划、实际的云迁移或部署，然后是持续的管理和优化。评估阶段所做工作的质量直接影响整个云采用之旅的成功。评估阶段的关键步骤如下：\n\
  \n* **云成熟度评估**：这是一个关键步骤，尤其对于开展首次云计划的组织而言。正如我们所讨论的评估组织云成熟度的各种方法，此步骤有助于在技能、文化和流程等多个维度上评估组织的准备情况。\n\
  * **IT 格局评估**：评估当前 IT 格局在基础设施、应用、数据、安全和合规方面的足迹是评估阶段的下一个关键步骤。在云迁移的情况下，这有助于制定正确的云迁移策略，而在全新云计划的情况下，它提供了利用现有最佳实践和架构协同效应的见解。\n\
  * **识别业务目标**：评估阶段的下一步是识别企业通过云转型将实现的前三大业务目标。每个云转型目标都是独特的，可以由已识别的业务目标指导，例如成本节约、创新、敏捷性或上市速度。\n\
  * **选择云模型**：在此步骤中，企业决定最适合的云模型——IaaS、PaaS 或 SaaS——以及部署模型——公有、私有、混合或多云——以最好地契合组织目标。\n\
  * **商业案例开发**：商业案例的开发在评估阶段早期就开始，因为它对云转型的成功至关重要。它首先确保关键利益相关者和领导层的协调，概述关键里程碑和潜在价值实现。这将与转型后发生的业务价值实现相联系。\n\
  * **依赖性分析**：依赖性分析提供了业务和技术依赖性、潜在风险和集成触点的见解。\n* **财务评估**：财务评估有助于定义、预算和分配云计划的财务资源，并识别持续运营成本。在此步骤中，企业执行成本效益和投资回报率分析。\n\
  \n## 规划\n\n规划阶段是 CAF 中继评估阶段后的下一个关键阶段。在规划阶段，组织将策略正式化，创建详细的架构和迁移计划，并为云环境的实施做好准备。规划阶段为云采用框架中的后续阶段提供了必要的蓝图，有助于最大限度地降低风险，确保资源的高效使用，并为成功的云采用奠定基础。以下是规划阶段通常涉及的关键活动的分解：\n\
  \n\n\n# 规划\n\n### 正式化云战略\n在此步骤中，企业创建一份详细的商业论证，概述范围、收益、风险和投资回报率。组织还建立关键绩效指标以衡量云采用之旅的成功。\n\
  \n### 技术计划\n开发架构设计、迁移计划（在从本地迁移到云的情况下）、部署计划（在云原生项目的情况下）以及安全和合规计划构成了此步骤。在此步骤中，组织基于评估阶段得出的发现和决策开发云架构。这包括设立企业架构评审委员会（`EARB`）（如果尚不存在），以细化基础设施设计、网络架构、安全架构、集成设计和存储规划的细节。\n\
  \n### 资源配置\n资源配置包括人力和财务资源的计划。对内部团队进行培训或识别外部合作伙伴以弥补技能差距，确认云采用流程的预算分配，包括迁移和运营支出。\n\
  \n### 应用程序和平台服务\n规划阶段的另一个关键步骤是选择应用程序和平台组件及服务。各种应用程序和平台组件的选择可能取决于所考虑的云转型或迁移策略。\n\n\
  ### 云卓越中心 (`CCoE`)\n开展战略性云转型计划的企业必须考虑建立一个集中的 `CCoE` 来治理、管理和指导并影响云转型或采用计划。\n\n###\
  \ 运营就绪\n规划阶段的此步骤有助于建立云管理的治理框架，并识别和定义运营模型，其中包括监控、告警、事件管理、SLA 和 SLO。\n\n### 沟通计划\n\
  建立沟通和变更管理计划对整体云转型的成功至关重要。制定沟通计划对于在云采用过程中让利益相关者保持知情和参与非常重要，并为组织做好准备，以应对云转型带来的技术、流程和工作流的变革。\n\
  \n### 路线图创建\n在此步骤中，组织创建详细的时间表和路线图，明确各种云组件将如何、何时以及以何种方式构建或迁移，识别依赖关系并制定应急计划。核心成功标准和指标的定义是衡量云计划成功与否的关键规划练习。\n\
  \n### 验证\n开发概念验证（`PoCs`）、价值验证（`PoV`）、最小可行产品（`MVPs`）以及针对复杂迁移或新架构的基准测试，对于确保更广泛的云转型的验证至关重要。这也有助于组织快速失败并制定回退策略。\n\
  \n# 部署\nCAF 中的部署阶段是真正付诸实践的阶段。在全面评估和规划之后，部署阶段涉及将资源、应用程序和数据实际部署或迁移到云环境中。此阶段通常是最耗资源且时间最关键的阶段，需要跨职能团队、部门和利益相关者之间进行细致的协调。以下是部署阶段通常涉及的活动分解：\n\
  \n### 迁移前检查清单\n部署阶段的第一步涉及验证并根据架构设计设置目标云基础设施。一些关键活动包括确保关键数据和配置的完整备份，并验证所有依赖性要求是否得到解决，最终确定切换和回滚计划。\n\
  \n### 云资源配置\n此步骤涉及根据架构设计创建或分配云资源、云租户设置、身份和访问策略、与企业身份提供者（`IDP`）的集成、单点登录（`SSO`）配置、基线安全和合规设计活动。\n\
  \n### 网络设计\n网络设计是技术云架构设计中最关键的元素之一，做对了可以带来长期成功。尤其是在公共云 IaaS 和 PaaS 部署的情况下，组织必须专注于创建既可扩展又高效的稳健网络设计。建立专用多协议标签交换（`MPLS`）和边界网关协议（`BGP`）网络电路到云提供商网络，以及配置\
  \ VLAN、VPN 和防火墙，是云网络设计中的一些关键步骤。\n\n### 安全架构设计\n与网络设计类似，安全架构对云转型成功至关重要。随着网络安全事件的不断增加，使用云原生工具保护云基础设施并遵循现有安全架构蓝图至关重要。\n\
  \n### 数据迁移\n对于涉及将应用程序或数据迁移到公共云的云转型，安全高效地将数据从本地迁移到云至关重要。在此步骤中，基于数据的性质、数据量和数据敏感性，组织必须仔细评估诸如通过网络传输数据或使用数据传输设备等选项。\n\
  \n### 应用程序和平台服务\n此阶段涉及创建和配置应用程序和平台服务，例如 API 接口、API 网关、Kubernetes 集群、Web 服务器、负载均衡器等。\n\
  \n### 测试\n在此步骤中，进行基本功能测试，例如单元测试、集成测试、性能或负载测试、用户验收测试和安全测试，以确保满足所有核心成功标准。\n\n### 演练\n\
  此步骤涉及执行演练和 A/B 测试，以验证和确认云部署是否符合定义的标准和目标。\n\n### 治理\n在此阶段，组织实施日志记录和监控工具，并创建仪表板以捕获和报告应用程序性能指标、用于\
  \ KPI 跟踪的告警以及用于合规报告的审计追踪。\n\n### 运营过渡\n生产发布和切换完成后，运营将移交给 CloudOps 团队进行持续维护和支持，部署阶段最终形成一个完全运行的云环境，与组织的战略目标保持一致。\n\
  \n# 优化\nCAF 的优化阶段旨在微调云服务和解决方案，以为业务提供更好的价值。在初始云部署之后，此阶段确保运营不仅稳定，而且高效且具有成本效益。与前三个阶段不同，优化阶段是一个持续进行的流程，包括定期审查、调整以及对云环境和应用程序足迹的微调，以更高效地持续满足业务目标。此阶段的一些关键步骤包括以下内容：\n\
  \n### 治理和合规\n由于治理和合规政策往往会根据行业法规、安全态势和技术进步而定期发生变化，因此定期评估治理和合规性是确保云服务和应用程序符合所需标准的关键步骤。这是组织平台团队的核心职能。\n\
  \n\n\n# 云采用框架优化阶段\n\n### FinOps\n成本管理是任何云转型的关键，因为如果订阅式服务管理不当，可能会出现意外。定期评估应用需求并持续优化环境规模、设置预算和警报、利用云原生成本管理工具监控和分析成本、审查各种成本效益杠杆（如云承诺和持续使用折扣），以及在可能的情况下迁移到云原生框架（如无服务器），共同构成战略性的\
  \ FinOps 实践。\n\n### Site reliability engineering (SRE)\n此步骤包括监控 **关键绩效指标** (**KPIs**)\
  \ 以衡量云服务有效性、日志聚合和分析以追踪和理解用户行为、**应用性能监控** (**APM**)、安全补丁以及确保高可用性和可靠性。这些因素对任何云转型计划的成功至关重要。\n\
  \n### Automating everything\n这也被视为 SRE 的一部分；自动化一切的做法被认为是云转型的最高成熟度级别，因为这可以由于减少人为干预和错误而带来可重复且可靠的系统。自动化常见任务和工作流程，例如通过\
  \ **基础设施即代码** (**IaC**) 进行的基础设施自动化、配置自动化、应用部署、备份、自动扩缩容和拆除，是本阶段的重要组成部分。\n\n### Business\
  \ continuity\n在此步骤中，组织实施健全的 **业务连续性计划** (**BCPs**) 和数据备份并定期测试它们。\n\n### Identifying\
  \ reuse\n优化阶段的另一个关键要素是能够识别可在整个企业中重复使用的模式和架构。云运营、CCoE 和 EARB 之间必须存在一致的反馈循环，以识别架构蓝图并在整个组织中应用最佳实践，避免重复造轮子。\n\
  \n在了解了建立云采用框架的重要阶段和构成要素之后，让我们探讨组织如何为混合云部署奠定基础。\n\n# 各种混合云和多云部署模式\n\n对于大多数企业而言，混合云部署模型提供了公有云的独特灵活性和私有基础设施的控制力。然而，将公有云架构与传统的本地部署统一起来会带来挑战，主要是因为它们在运营、安全和治理框架上存在本质差异。由于基础设施、现有的\
  \ DevOps 实践、技能、工作负载和流程对每个企业环境都是独特的，因此混合云或多云部署策略必须根据具体需求进行调整。混合云和多云的术语通常被过度使用且使用不一致。**混合云**\
  \ 指的是将应用程序或工作负载部署在本地和公有云之间并通过公共网络互联的部署策略，而 **多云** 指的是将应用程序或工作负载部署在多个公有云中的部署策略，可选择性地集成本地环境。本节将回顾一些常见的混合云部署模式。\n\
  \n## 分层混合云模式\n\n分层混合云部署模式涉及根据工作负载和应用程序的关键性、性能要求和安全问题，对其在云和本地私有计算环境之间进行战略性分配。该模式通常将应用程序或工作负载分为两个层级——**前端**\
  \ 和 **后端**。面向用户的**前端**运行在现代技术栈上并根据需求波动，而**后端**则是服务于关键业务功能且更难重新平台化的传统应用程序或系统。在此模式中，前端利用灵活且现代的公有云基础设施，而后端则保持原样在本地环境中运行。该模式允许组织针对特定任务利用各环境优势，提供成本、性能和安全的平衡方法。\n\
  \n该模式的一些关键优势包括以下内容：\n\n*   **实验与创新**：该模式允许在本地有大量投资的企业在云中更快地测试、实验和创新，同时保留关键资产在本地环境中。\n\
  *   **可扩展性和资源优化**：分层模式允许企业根据公有云环境中的需求动态增减资源，同时利用现有资源并优化本地后端。应用程序也可以在不同层级之间动态迁移，优化资源利用并确保最佳性能。\n\
  *   **安全性和合规性**：关键且敏感的应用程序可在私有云或本地环境中得到保护，确保符合行业法规、数据驻留和数据保护标准。较不敏感的工作负载可放置在公有云中，同时保持适当的安全措施。\n\
  *   **成本优化**：通过战略性地分配工作负载，组织可在公有云和本地之间优化成本。重新托管、重新平台化或重新架构风险过高或耗时过长的关键后端可以继续在本地或私有云中运行，以避免潜在的数据传输成本，而前端和应用程序组件则可利用公有云的成本效益可扩展性。\n\
  *   **性能优化**：根据性能要求对工作负载进行分层可确保应用程序获得满足性能期望所需的资源。这可防止在“一刀切”的云方法中可能出现的资源争用和延迟问题。\n\
  \n虽然该模式有诸多优势，但组织必须注意以下挑战和考虑因素。\n\n*   **复杂性**：在各种公有云环境中管理多个层级可能很复杂，需要专业技能和工具。将层级拆分到公有云和本地环境跨越异构部署范式，因此需要透彻了解工作负载特征、架构、数据流和安全要求。另一个关键考虑因素是选择可在公有云和本地环境之间无缝运行的兼容技术。\n\
  *   **网络延迟**：由于层级分布在公有云和本地环境之间，可能引入网络延迟，尤其对于需要实时数据处理的应用程序而言。精心规划网络架构、接口设计和 API 网关对于缓解这一挑战至关重要。\n\
  *   **资源分配**：在高峰需求或意外工作负载期间，将资源适当分配给在公有云和本地环境中运行的工作负载可能具有挑战性。仔细的设计考虑，例如实施监控资源利用率和动态资源分配的机制，对于缓解这一挑战至关重要。\n\
  \n## 分区多云模式\n\n分区多云模式利用多云部署策略，将应用程序部署在多个云环境中。该策略为企业提供了最大程度的灵活性，可将工作负载部署到最适合或可在最佳云环境中高效运行的环境中。该模式有两种变体：\n\
  \n*   工作负载被分区并分布在多个云中，允许应用程序流量无缝穿越。\n\n\n\n# 分区多云模式\n\n应用根据最佳匹配原则部署在云环境中，同时保持可移植性。\n\
  \n## 关键组件\n\n分区多云模式中的一些关键组件包括以下内容：\n\n* **计算分区**：在此模式中，云环境纯粹被用作基础设施部署平台，通过遵循开放标准来支持工作负载的可移植性。例如，AWS\
  \ EC2、Google Compute Engine 和 Azure VM 等服务可以根据服务或应用程序的具体计算需求进行选择。同样，这也可以推广到超 visor\
  \ 级别的可移植性，用于利用 Hyper-V、KVM 或 VMware 的基于 VM 的实时迁移。\n* **容器分区**：在此模型中，会在多个云中选择一个通用的容器编排平台，以帮助无缝部署、移植或迁移应用程序。例如，服务如\
  \ **Google Kubernetes Engine**（**GKE**）、AWS EKS 和 **Azure Kubernetes Service**（**AKS**）可以简化\
  \ Kubernetes 集群在多个云中的部署，包括本地部署，作为开发和部署现代云原生微服务架构应用程序的一种方式。\n* **数据存储分区**：利用统一的数据存储架构可以帮助企业无缝扩展统一存储平台，以增强数据耐久性和冗余度并优化成本。例如，可以使用通用的基于\
  \ S3 的存储 API 利用 AWS S3、Google Cloud Storage 和 Oracle Object Storage。\n* **网络分区**：网络分区对于多云部署架构模式至关重要。通过利用软件定义网络，组织可以定义虚拟私有云以满足不同的网络需求，同时通过交叉连接实现无缝的云间通信。一些公共云提供商原生支持交叉连接，或可通过云交换服务提供商如\
  \ Equinix、Digital Realty 或 CenturyLink 启用。\n\n## 优势\n\n分区多云为企业提供一些独特的优势，如下所示：\n\n\
  * **最佳方案组合方法**：组织能够利用不同云提供商的专业化服务，通过采用最佳方案组合解决方案最大化能力和效率。\n* **供应商独立性**：避免供应商锁定是企业的主要优势，因为分区方法降低了供应商锁定的风险，使得根据需要更轻松地为特定服务切换提供商。\n\
  * **资源优化**：与一刀切的方法相比，不同云提供商提供的资源和专业化服务的最佳利用通常可以带来更好的资源效率和财务结果。\n* **标准化**：分区多云可以实现企业\
  \ IT 的标准化，从而实现现代技术和开放标准的无缝采用。\n\n## 挑战\n\n虽然该模式提供了包括灵活性和成本效益在内的诸多优势，但也存在不应忽视的挑战。\n\
  \n* **复杂性**：管理多个云提供商在管理、计费和治理方面增加了复杂性。\n* **数据传输和集成**：在不同云提供商之间传输数据可能会产生成本和延迟问题。周密的规划对于减轻跨云延迟和出口成本至关重要。\n\
  * **安全策略**：在处理多个云提供商时，定义和管理可在各分区统一应用的统一安全态势和合规性可能会变得具有挑战性。\n* **技能和投入**：需要多样化的技能来构建、管理和优化来自不同云平台的服务。技术栈的标准化与自动化对于解决这一挑战至关重要。\n\
  \n# 边缘计算部署模式\n\n在混合边缘计算部署模式中，主要目标是在集中式云基础设施和更靠近数据源的边缘计算节点之间共享计算负载。这有助于企业创建灵活的部署模式，其中数据可以根据计算复杂性、延迟敏感性、用户体验或其他特定要求在边缘本地处理或发送到中央服务器。混合边缘计算部署模式的典型应用包括以下内容：\n\
  \n* **物联网**（**IoT**）部署包括部署在网络边缘的设备、传感器和网关，应用于零售店、医院、制造设施和物流等各种环境。边缘的物联网部署会产生大量数据，这些数据会使用可用的计算能力在本地处理。随后，相关联并整合的数据会传输到中央云计算基础设施进行进一步处理和分析。\n\
  * 亭机、**销售点**（**POS**）系统和 **下一代计算单元**（**NUC**）可以在边缘处理数据，以实现极快的响应时间来改善用户体验，或在发送到中央云服务之前进行微批处理。此用例的典型应用可在餐厅和零售店中找到。\n\
  * 远程连接或缺乏网络可用性保证的区域可以利用此模式提供业务关键服务，例如，远洋船只、农业农场、远程部署的监控机器人/设备，这些设备可以定期与中央云服务器同步数据。\n\
  \n## 优势\n\n该模式的一些关键优势如下：\n\n* **低延迟应用**：混合边缘计算模式通过使数据处理更靠近源头来降低延迟。这对于需要实时分析或控制的应用尤其重要，例如自动驾驶汽车或工业自动化系统。\n\
  * **高效带宽利用**：通过在边缘预处理数据，只需将相关信息发送到集中式云，从而节省带宽并降低传输成本。\n* **可扩展性**：这种方法允许组织从边缘小规模开始并向上扩展，根据需要整合更多集中式云资源。\n\
  * **资源优化**：混合边缘模型允许根据资源需求和限制将任务分配给最合适的处理单元，无论是边缘节点还是中央云服务器。\n\n## 挑战\n\n该模式的挑战包括以下内容：\n\
  \n* **技术复杂性**：由于需要动态任务分配、数据同步和网络管理，管理混合系统比纯集中式或基于边缘的模型更复杂。\n* **前期成本**：边缘基础设施的初始设置成本可能很高。然而，这可能会被长期运营成本节约和整体解决方案带来的价值所抵消。\n\
  * **安全性和合规性**：由于其分布式特性，混合模型可能会带来更多组织需要积极管理的安全挑战。例如，保护边缘设备极其关键，因为它们可能成为恶意行为者获取企业数据和\
  \ **中间人**（**MITM**）攻击的容易目标。\n\n# 冗余混合部署模式\n\n冗余混合部署是指一种架构模式，其中计算资源在云和数据中心之间进行战略性复制。在此模式中，在每个级别引入冗余以确保高可用性和容错性，使任务和数据能够在多个位置处理，并设有同步机制以维护数据一致性和完整性。企业可以利用此模式来实现三种混合用例：\n\
  \n\n\n## 环境混合模式\n通常被称为云端 dev-test，这是指一种模式，其中应用程序的开发和测试环境按需在云环境中创建和销毁，而生产环境则构建在私有本地部署中。这种模式乍一看似乎有风险，因为在公有云和传统本地部署之间建立环境一致性很困难。然而，这使组织能够在所有环境中实现功能等价，而非环境一致性，从而需要采用云原生部署范式。这也是一种低风险模式，适合踏上混合云之旅的企业，有助于熟悉云概念并更有信心地迁移后续工作负载。\n\
  \n### 主要优势\n* 使用 IaC 构造的按需和自动化环境配置可以标准化整个环境配置、部署代码、执行测试以及拆除环境。\n* 开发和测试环境通常间歇性使用。将这些环境配置在云环境中可以通过停止未使用的环境并仅按需配置来帮助降低成本。基于云的环境还能为应用程序实现多个并行发布周期。\n\
  * 利用云中具有技术等价性（开源软件）的托管服务，可以节省安装、管理和修补以及为多个非生产环境管理这些服务的时间和资源。\n\n### 架构考虑因素\n* 确保网络拓扑允许并阻止环境之间的通信。例如，非生产环境可能具有逻辑应用程序和数据网络隔离，而生产环境网络则与较低环境隔离。\n\
  * 为了确保应用程序或工作负载的可移植性并抽象掉环境一致性方面的考虑，企业需要设计和构建一个通用工具链，以促进利用容器和容器编排平台的基于微服务的部署方法。\n\
  * 为了应对本地部署和云环境之间基础设施和资源可用性的差异，选择支持混合云部署模型的 CI/CD 工具非常重要，这些工具提供灵活性、可移植性和与现有系统的集成。设计标准化工作流并实施变更管理流程以跟踪和管理\
  \ CI/CD 管道、基础设施和应用程序中的变更至关重要。\n* 实施单一视图治理模型，有助于为混合云环境中的 CI/CD 流程建立整体治理和合规策略。从监控和可观测性角度来看，明智的做法是实施全面的监控和可观测性工具，以跟踪本地部署和云系统上\
  \ CI/CD 管道以及已部署应用程序的健康状况、性能和安全性。\n* 缓存、存储、消息传递和数据库服务的选择需在本地部署和云托管服务之间保持一致。例如，Apache\
  \ Kafka 主题可能是本地部署的首选消息服务，而 Cloud Pub/Sub（GCP）或 Amazon MSK（AWS）可作为托管服务用于实现消息代理的功能等价性。\n\
  \n## 业务连续性混合模式\n在业务连续性混合模式中，生产环境主要在本地数据中心运行，而灾难恢复（DR）环境则配置在公有云上。关键任务应用程序和系统通常以在灾难期间保持弹性为目标进行配置。通过在公有云中复制关键任务系统，企业可以避免单点故障，最大限度地降低影响本地基础设施的风险，并防范不可预见的安全威胁。该模式也为企业提供了进入云端的低风险途径。DR\
  \ 规划的一个关键方面是定期将数据复制并备份到公有云，以最大限度地减少恢复点目标（RPO），并保持云端（暖备或热备）待机以最大限度地减少恢复时间目标（RTO）。\n\
  \n### 优势\n* 公有云提供商通常拥有多个具有冗余数据中心的云区域，通常称为可用区或域，这些区域可原生提供正常运行时间、可用性和弹性基础设施架构。\n*\
  \ 借助公有云的弹性扩展能力，数据可以安全地复制和备份到公有云，使用不可变备份并通过 HSM 加密和保护。\n* 公有云中的灾难恢复环境配置可能大幅更经济，尤其是配置为暖备或冷备时，因为停止的资源通常在公有云中不会产生费用。\n\
  * 公有云环境中的热备可以扩展以服务不同地理区域的流量，并支持诸如 A/B 测试、金丝雀部署等创新策略。\n* 该模式使能够并支持新的业务连续性计划，针对在传统本地部署环境中因成本、投入和维护更高而更难实现的应用和工作负载。\n\
  \n### 注意事项\n* 每个应用程序都需要一份全面的业务连续性计划（BCP），以帮助配置正确的 DR 策略、RPO 和 RTO 目标。\n* 由于数据在本地部署和云之间传输或交换，必须建立具有冗余和备用连接的稳健网络拓扑，以确保无缝且安全的数据流。\n\
  * 与其他本地系统的负载依赖关系必须仔细评估，以避免因流量激增导致的瓶颈——尤其是在热备或主动-主动设置中。\n* 尤其是在主动-主动配置中，本地部署与公有云环境之间的双向数据同步可能使环境暴露于脑裂问题，导致冲突、数据不一致，甚至数据丢失或损坏。脑裂问题的常见原因之一是网络集群配置不正确或不足。应考虑缓解策略，例如确保冗余网络、仲裁检查或专用主节点。\n\
  * 自动化一切至关重要，这可以避免架构中的单点故障，例如，如果一个环境变得不可用，确保 CI/CD 流程能够在新环境中部署新版本并应用配置。\n* 定期且有意的故障切换测试对于确保\
  \ BCP 稳定、最新且完全可用至关重要。\n\n\n\n## 云突发模式\n\n公有云为企业提供的边缘用例之一是云突发。云突发模式的思路是利用本地部署或私有云环境处理稳定的应用负载，并在流量高峰或需要额外容量时突发到公有云。通常，经历流量波动的面向互联网应用、批处理作业或训练\
  \ AI/ML 模型都是该模式的良好候选者。在传统设置中，这一挑战是通过过度配置本地资源来缓解的。这种方法可能成本高昂。然而，云突发的关键要求是确保应用程序或工作负载的可移植性，并制定无缝跨环境分发流量的策略。通常，对于面向互联网的应用，必须在本地环境或公有云中配置全局负载均衡器，以便能够智能地跟踪和适当路由流量。\n\
  \n### 主要优势\n\n* 云突发可在本地部署和公有云环境之间实现高资源利用率，因为企业无需为预期峰值而过度配置本地资源。\n* 容量规划可能很繁琐，尤其对于在闪购或季节性期间出现不可预测流量峰值的组织而言，而云突发可以确保应用在高峰需求下的可用性和可靠性。\n\
  * 云突发还允许组织以创造性方式应对本地部署（主）应用程序或资源维护方面的挑战，例如重大升级、滚动更新、修补或甚至硬件更新周期，而无需导致应用停机。\n* 可以利用该模式在公有云环境中运行批处理作业，这些作业通常需要在本地环境中排队以便在非高峰时段运行或在需要过度配置资源时运行。利用抢占式或可抢占\
  \ VM 实例时，这也可能极具成本效益。\n* 通过利用该模式，企业还可以开发和构建现代基于 AI/ML 的应用程序和服务，通过在公有云中训练机器学习模型，因为数据随时可用，且模型训练可按需获得\
  \ CPU 和 GPU。\n\n### 注意事项\n\n* 网状网络拓扑对于确保本地部署和云环境之间资源无缝访问至关重要。\n* 在选择公有云提供商和区域时必须慎重考虑，同时还要考虑能够满足应用当前和未来需求的能力，例如，选择地理位置更靠近本地数据中心的云区域，建立低延迟\
  \ MPLS 连接和平台及托管服务支持，并具备可与本地部署资源共存的核心基础设施能力，例如混合全局负载均衡器。\n* 必须对安全、访问控制和策略进行细致规划以减少攻击面。例如，所有网络流量必须加密，且仅通过\
  \ VPN 隧道或专用 MPLS 电路等受信任通道路由，建立通用身份以在环境边界之间安全认证。\n* 应用程序，尤其是对流量峰值做出反应的面向互联网应用，必须遵循现代云原生应用架构和最佳实践以实现无缝工作负载可移植性。有状态的应用组件处理起来可能很棘手，尤其是在云突发期间。\n\
  * DevOps 和 SRE 实践必须确保 CI/CD 流程、监控、可观测性和治理的标准化。\n\n在回顾了各种云部署模式、其优点和注意事项之后，让我们探索一些混合云和多云部署的基础网络拓扑蓝图。\n\
  \n# 混合云和多云部署架构的基础网络蓝图\n\n在着手云转型之前，安全可靠地将企业的本地数据中心或私有计算环境连接到公有云对于任何成功的混合云或多云部署都至关重要。随着企业应对混合云和多云部署的复杂性，可靠、可扩展且安全的网络架构变得越来越重要，并充当支持高可用性、性能优化、增强安全性和高效可扩展性的骨干。最终，强大的网络架构不仅仅是运营要求，更是战略使能因素，可显著影响组织的敏捷性。由于每个企业的云之旅都是独一无二的，所选的基础架构和网络拓扑必须满足业务需求。在本节中，我们将探讨企业混合云和多云部署的一些基础蓝图。\n\
  \n## 网状混合云网络拓扑\n\n在此拓扑中，本地私有计算环境与公有云提供商之间通过简单的 VPN 隧道配置或专用 MPLS 电路建立连接。这也常被称为网状网络拓扑，因为它建立了一个可跨多个环境扩展的扁平网络，使所有系统和服务能够无缝相互通信。细粒度的访问控制由路由规则和防火墙管理。该拓扑最适合分层应用和云突发场景。\n\
  \n图 6.1 显示了典型的网状混合云网络架构，其中本地环境通过 VPN（通过公共互联网）、专用互连（MPLS）或其组合建立到公有云的连接，以实现故障转移和冗余：\n\
  \n![图 6.1 – 网状混合云网络拓扑](img/B18893_06_1.jpg)\n图 6.1 – 网状混合云网络拓扑\n\n## 多云网络拓扑\n\n\
  类似于混合云网络拓扑，多云网络拓扑涉及至少两个与本地私有计算环境交互的公有云提供商。采用多云战略的企业可以与每个公有云建立专用 MPLS 网络连接——最好通过能够支持多个云网络的云交换合作伙伴，同时启用冗余\
  \ VPN 隧道作为故障转移和高可用网络网状。为了为每个云配置不重叠的唯一地址范围、路由逻辑、出口管理、网络防火墙和安全，需要细致的网络和安全架构规划。\n\n\
  此架构的细微变化可能包括以下内容：\n\n* 配置并仅允许从本地网络对云环境进行私有访问。\n* 建立交叉连接以实现云到云的数据流和通信——该拓扑对于工作负载迁移和跨云分析用例特别有用。\n\
  * 设置通用 Layer 4 网络防火墙安全。\n* 仅从本地 VLAN 环境配置公共出口。\n\n如图 6.2 所示，最好通过云交换建立专用网络以连接到所选的公有云网络。或者，也可通过公共互联网建立安全\
  \ VPN 连接以实现与延迟无关的连接或网络冗余。选择能够支持所有考虑中的公有云的云交换提供商也是一个重要的设计。\n\n![图 6.2 – 多云网络拓扑](img/B18893_06_2.jpg)\n\
  图 6.2 – 多云网络拓扑\n\n## 网关出口混合云拓扑\n\n\n\n## 网关出口混合云拓扑\n\n**网关出口网络**拓扑的基本思想是仅将本地部署环境中的选定服务和\
  \ API 暴露给公有云工作负载。此拓扑可防止暴露应用 VLAN，其中 API 网关部署在充当网络流量守门员的 DMZ 网络区域中。此拓扑非常适合流量需要仅限制到特定服务和工作负载以及在本地部署环境中创建网络边界的用例。在此拓扑中，本地部署工作负载或服务不允许直接与公有云通信，并且连接始终由公有云通过本地部署\
  \ DMZ 发起。\n\n*图 6.3* 显示了网关出口混合云网络拓扑，其中对本地 API 的连接通过 API 网关暴露给所选公有云网络，可通过专用网络或通过公共互联网上的\
  \ VPN 实现：\n\n![图 6.3 – 网关出口混合云网络拓扑](img/B18893_06_3.jpg)\n\n图 6.3 – 网关出口混合云网络拓扑\n\
  \n## 网关入口混合云拓扑\n\n**网关入口拓扑**是网关出口模型的完全相反，其中公有云资源和服务通过特定端点或 API 暴露给本地部署环境。在此网络拓扑中，托管在公有云内的资源和服务通常配置为拒绝所有流量，除非来自受信任的本地部署网络。此拓扑非常适合仅将特定端点暴露给外部世界的边缘混合场景。\n\
  \n如 *图 6.4* 所示，网关入口混合云网络拓扑有助于通过 API 网关将部署在一个或多个公有云中的 API 服务层暴露给本地部署环境，可通过专用网络或通过公共互联网上的\
  \ VPN 实现：\n\n![图 6.4 – 网关入口混合云网络拓扑](img/B18893_06_4.jpg)\n\n图 6.4 – 网关入口混合云网络拓扑\n\
  \n## 共享网络拓扑\n\n**共享网络架构**允许在主机项目中创建可与服务项目共享的常用资源。此拓扑可以帮助网络管理员对子网、路由和防火墙等网络资源进行集中控制，同时将某些管理职责委托给服务项目。需要注意的是，共享网络的概念因云提供商而异。\n\
  \n*图 6.5* 描述了共享云网络拓扑，该拓扑有助于通过专用 VPC 网络，通常称为主机 VPC，将所有从公有云进入或流出的网络流量进行隔离和 containment：\n\
  \n![图 6.5 – 共享网络拓扑](img/B18893_06_5.jpg)\n\n图 6.5 – 共享网络拓扑\n\n## 私有混合拓扑\n\n在 **私有混合网络**拓扑中，公有云环境中的资源配置为*仅为私有*，并且不允许任何互联网流量。对于互联网访问，来自公有云的流量会被路由回本地部署路由器以提供请求。虽然这可以使用公有云内的\
  \ NAT 网关（原生）来实现，但对于在极其敏感的安全边界内运营并希望对出口流量进行精细控制的企业而言，这非常有帮助。\n\n从 *图 6.6* 可以看出，公有云网络的所有互联网流量均被禁止，并且通过专用网络或\
  \ VPN 与本地部署环境的连接得以建立。所有从公有云环境发往互联网的流量均被路由到本地部署：\n\n![图 6.6 – 私有混合云网络拓扑](img/B18893_06_6.jpg)\n\
  \n图 6.6 – 私有混合云网络拓扑\n\n## 网络对等拓扑\n\n**网络对等**是又一种极其强大的网络拓扑，其中多个云网络可以在网状或集线和定制架构中相互对等。网络对等允许跨多个网络甚至跨组织边界的公有云资源相互通信。这可以是一个极其强大的拓扑，其中拥有多个具有隔离网络边界的部门的企业仍可在网络之间通信，同时保持对其网络的专用控制。此网络拓扑支持的另外一些创造性用例包括以下内容：\n\
  \n* 组织可以通过一个虚拟云网络私下构建和发布定制的 **软件即服务**（**SaaS**）产品到另一个虚拟云网络。\n* 恰好位于同一云提供商网络上的合作伙伴和服务提供商可以在不经过公共网络的情况下私下通信。\n\
  * 此架构还可以提供极低的网络延迟，因为流量经过私有内部网络结构传输，同时还提供高网络安全性和相对较低的网络出口成本。\n\n*图 6.7* 中描述了一个示例网络对等拓扑，其中两个虚拟云网络相互对等以形成网络网状，使\
  \ VPC 1 和 VPC 2 中的服务之间的流量能够在私有网络上无缝通信，而无需经过外部网络：\n\n![图 6.7 – 网络对等拓扑](img/B18893_06_7.jpg)\n\
  \n图 6.7 – 网络对等拓扑\n\n## 边缘网络拓扑\n\n**边缘网络**拓扑最适合具有边缘计算和物联网需求的企业。在此架构中，来自物联网传感器、设备和边缘计算设备（如\
  \ NUCs）的数据在边缘使用边缘网关进行聚合和处理，并实时或以微批量的形式发送到公有云进行进一步处理、遥测或分析。\n\n如 *图 6.8* 所示的边缘网络拓扑描述了一个典型的边缘站点，其中容纳了边缘设备，例如物联网传感器和\
  \ NUCs，它们通过轻量级消息协议，如 **消息队列遥测传输**（**MQTT**）以及 Zigbee 或 Z-Wave 本地连接到物联网网关，以进行本地处理、合并和关联。然后网关设备定期或实时与公有云网络交互以进行进一步处理和分析。\n\
  \n![图 6.8 – 边缘网络拓扑](img/B18893_06_8.jpg)\n\n图 6.8 – 边缘网络拓扑\n\n在探讨了各种混合云、多云和边缘网络拓扑以及组织如何建立坚实的网络基础之后，让我们现在了解如何为云建立坚实的安全基础。\n\
  \n# 企业安全基础\n\n\n\n一旦网络基础搭建完成，接下来最重要的基础层就是安全。安全是一个宽泛的话题，涵盖了多个安全层级。对于踏上云端之旅的企业而言——无论是原生混合云、多云还是全云方法——确保各层都具备稳健的安全基础至关重要。正如俗话所说，安全是每个人的责任；在云部署模式下，这一观点更为相关且突出，因为云转型的方方面面——从应用开发、部署、数据存储、访问到合规——都具有核心的安全依赖。私有本地环境中的传统安全架构与公有云安全在本质上存在差异，因为存在共享责任模型——，意味着安全方面的某些部分由云服务提供商管理和治理，而其余部分由企业管理。共享责任因所使用的云服务提供商和提供的服务类型而异。例如，SaaS\
  \ 提供商负责大部分云栈的安全，而 IaaS 服务仅管理底层物理硬件直至客户操作系统层的安全。一般而言，共享责任模型对于各种云部署模型如下图所示，尽管就实际目的而言，一些服务存在重叠的责任。例如，云基础设施（IaaS）提供商可能声称负责物理网络管理，而软件定义网络配置则是客户的责任。图\
  \ 6.9 显示了云服务提供商在多个服务领域中典型的共享责任模型：\n\n![图 6.9 – 公有云共享责任模型](img/B18893_06_9.jpg)\n\
  \n图 6.9 – 公有云共享责任模型\n\n现在让我们探索主要云服务提供商，即 Amazon Web Services（AWS）、Google Cloud Platform（GCP）和\
  \ Microsoft Azure 所倡导的共享安全模型。\n\n## 主要 CSP 的共享安全模型\n\nAmazon Web Services（AWS）将共享责任模型定义如下：\n\
  \nAWS 负责“云的安全”，而客户负责“云中的安全”。\n\n*AWS 负责保护运行 AWS 云中所有服务的基础设施。该基础设施由运行 AWS 云服务的硬件、软件、网络和设施组成。*\n\
  \n*客户的责任将由客户选择的 AWS 云服务决定。这决定了客户作为其安全责任的一部分必须执行多少配置工作。*\n\n图 6.10 改编自 AWS 文档，展示了\
  \ AWS 与客户责任的明确划分 [1]：\n\n![图 6.10 – AWS 共享责任模型](img/B18893_06_10.jpg)\n\n图 6.10\
  \ – AWS 共享责任模型\n\n例如，纯 IaaS 服务要求客户执行所有必要的安全配置和管理任务，而 PaaS 服务或抽象化服务仅要求客户保护平台上的数据资产。要详细了解\
  \ AWS 共享责任模型，请参阅进一步阅读部分。\n\nAWS 还提供了一套全面的安全参考架构，与 AWS 安全基础保持一致 [2]：\n\n* **AWS CAF**：提供在\
  \ AWS 上构建解决方案的最佳实践和方法的指导。\n* **AWS well-architected framework**：专注于云架构师，帮助构建安全、弹性且高效的\
  \ AWS 云环境。\n\nMicrosoft Azure 支持在各种提供的服务之间划分责任。无论部署类型如何，物理数据中心、网络和主机均由 Azure 完全管理，而数据、端点、账户和访问管理则是客户的责任。图\
  \ 6.11 改编自 Azure 文档，展示了 Azure 共享责任模型 [3]：\n\n![图 6.11 – Azure 共享责任模型](img/B18893_06_11.jpg)\n\
  \n图 6.11 – Azure 共享责任模型\n\nMicrosoft Azure 还提供了一份 **Azure Security Benchmark Foundation**\
  \ 蓝图，帮助构建安全且合规的 Azure 环境。请参阅本章末尾的进一步阅读部分以获取更多详细信息 [4]。\n\nGoogle Cloud 提倡一种 **shared\
  \ fate model** 共享命运模型，该模型超越了传统的云共享责任模型。共享命运建立在共享责任模型之上，但通过提供明确的、有见地的、透明的安全控制、登陆区、安全基础蓝图和最佳实践，将云安全视为一种持续的合作伙伴关系。图\
  \ 6.12 描述了 Google Cloud 的共享命运模型 [5]：\n\n![图 6.12 – Google Cloud 平台共享命运模型](img/B18893_06_12.jpg)\n\
  \n图 6.12 – Google Cloud 平台共享命运模型\n\nGoogle Cloud 对 Google Cloud 安全最佳实践提供了有见地的观点，以帮助企业根据需要进行定制和调整。有关\
  \ Google Cloud 共享命运模型的更多详细信息，请参阅本章末尾的进一步阅读部分 [6]。\n\n现在让我们探索如何构建以安全为先的云基础架构。\n\n\
  ## 设计以安全为先的云架构\n\n由于以下原因，保护云基础设施与传统的本地环境大不相同：\n\n* 与传统锁定在本地的环境相比，云环境的部署方式、访问方式和暴露方式存在根本差异。\n\
  * 现代云原生 DevSecOps 实践的演进使微服务、容器和 API-first 等应用开发方法论民主化。\n* 云服务和产品的速度和多样性以及它们的使用方式。\n\
  \n企业必须建立纵深防御安全策略，以确保云栈的每一层都得到加固。随着公有云服务的可用性不断演进，企业安全架构必须定期根据一系列安全和合规标准评估和认证公有云服务，并在内部发布为企业团队在公有云上构建应用程序的指南。例如，云服务和标准可以被标记为\
  \ required、approved、conditionally approved、alternative 或 denied：\n\n* **Required**：指特定部署的先决条件。例如，仅可对组织范围内的资源使用私有\
  \ IP 地址范围。\n* **Approved**：指可用于云应用开发的完全批准的服务列表。这指的是已通过所需安全和合规控制的服务。\n* **Conditionally\
  \ approved**：指在某些限定条件下批准的一组云服务。例如，云对象存储仅在限制为私有访问时才可使用。\n* **Alternative**：指作为托管服务或产品的替代方案而使用的替代解决方案——开源或现有第三方。例如，使用\
  \ `Terraform` 进行基础设施自动化，以替代提供商原生解决方案。\n* **Denied**：指预期在企业云部署中不使用的一组服务，且未获得安全许可或尚未评估。\n\
  \n让我们回顾一些基础安全方面和最佳实践。\n\n### 网络安全\n\n\n\n## 网络安全\n在基础层面，网络安全对于防止来自互联网或外部要素的入站网络威胁进入部署在云环境中的资源至关重要。优化云网络架构对云安全至关重要。网络安全的一些关键要素包括以下内容：\n\
  * 通过专用 `MPLS` 连接或 `VPN` 隧道保护本地网络与公有云之间的流量。\n* 通过 `VPCs` 和 `VPC` 网络对等连接对网络进行分段和保护，以减少横向网络流量移动。\n\
  * 实施有状态和无状态防火墙以帮助控制网络流量。\n* 采用零信任网络安全架构，其中云网络内部或外部的任何实体默认都不被信任，从而最大程度地降低内部和外部威胁的风险。\n\
  * 采用端点安全解决方案来监控和保护连接的设备。\n* 实施入侵检测 (`IDS`) 来监控网络流量中的异常和异常模式，这些模式可能表明正在进行的攻击，以及入侵预防\
  \ (`IPS`) 以主动识别与正常系统行为的偏差。\n* 通过下一代防火墙 (`NGFW`) 解决方案实施数据包检测以确保网络安全。`NGFWs` 是企业的重要保障，尤其是在医疗保健或金融等监管严格的行业中。典型的\
  \ `NGFW` 还执行深度数据包检测 (`DPI`)，其超越了传统防火墙方法，后者仅检查协议头。`NGFW` 解决方案可以帮助检查和跟踪从 `Layer 2`\
  \ 到应用层的所有网络流量。\n\n## 身份和访问管理\n身份和访问管理 (`IAM`) 是网络安全的基础，尤其是在云环境中，资源和服务分布在各个位置并由众多用户访问。`IAM`\
  \ 是云资源的守门人，在云安全中发挥着至关重要的作用。`IAM` 是向合适的人员以合适的访问级别授予对合适云资源的访问权限的做法。由于云环境通常具有复杂且不断变化的用户、设备、应用程序和服务集合，`IAM`\
  \ 最佳实践的应用变得至关重要。`IAM` 的一些最佳实践包括以下内容：\n* 基于角色的访问控制 (`RBAC`)：`RBAC` 是 `IAM` 的关键要素，它根据组织内的角色限制系统访问。`RBAC`\
  \ 确保用户仅拥有履行其工作所需的访问权限，遵循 *最小权限* 原则。通过根据工作职责将用户组织成角色，并仅向这些角色而非个人用户分配访问权限，组织可以简化权限管理流程，从而降低未经授权或不必要的访问风险。\n\
  * 身份管理：在云中管理身份构成了 `IAM` 的基础。虽然它是基础性的，但管理云 `IAM` 中身份、用户、角色和组的配置、保护和取消配置也很重要。利用提供商原生的密钥管理解决方案轮换密钥、利用基于硬件安全模块\
  \ (`HSM`) 的密钥，或利用现有的本地密钥管理解决方案，都可以成为保护凭据的良好策略。主要存在三种身份：\n  * 企业身份：这些身份标识需要访问企业资源的企业员工、合作伙伴和承包商。\n\
  \  * 服务身份：通常也称为服务账户，这些身份有助于管理应用到应用或系统到系统的交互。\n  * 客户身份：这些身份标识与部署在云上的应用程序或系统交互的最终用户或客户。\n\
  * 身份联合和单点登录：`SSO` 解决方案可以为用户提供使用一套凭据访问多个服务或平台的便利性。在安全实施的情况下，`SSO` 减少了用户需要记住和管理的密码数量，从而降低了与密码相关的安全风险。尽管大多数云提供商提供身份平台，但在典型的企业环境中，可以利用现有的身份提供商，例如\
  \ `Active Directory` ——通常称为 `IDP` —— 而无需在云 `IDP` 中重新创建用户组织。在这种情况下，云提供商充当服务提供商 (`SP`)，并支持\
  \ `SAML` 等标准联合协议以启用 `SSO`。\n* `IAM` 生命周期管理：`IAM` 最佳实践还涉及管理身份的整个生命周期。这包括用户身份的入职、配置、取消配置和离职。自动化系统可以帮助简化此流程，确保在需要时快速授予访问权限，并在不再需要时撤销访问权限，从而最大程度地减少未经授权访问的机会窗口。\n\
  * 特权访问管理：特权账户，例如网络管理员和安全管理员账户，通常具有广泛而强大的访问权限，使其成为攻击者的主要目标。特权访问管理 (`PAM`) 解决方案通过各种机制（例如会话隔离和监控）帮助保护这些敏感账户，并要求使用时提供理由。在云环境中实施\
  \ `PAM` 变得更加关键，因为管理访问可能会影响多个服务和数据存储。\n* 多因素身份验证：`IAM` 最佳实践的主要原则之一是实施 `MFA`。采用 `MFA`\
  \ 提供额外的安全层，建立强大的安全基础设施以确保对云资源的受控访问。仅输入用户名和密码是不够的；用户可能还必须输入发送到其手机的代码或提供生物识别验证。实施\
  \ `MFA` 可降低未经授权访问的可能性，即使密码被泄露也是如此。\n* 即时访问：在遵循最小权限原则的同时，而不是授予永久访问权限，组织可以向用户授予完成日常活动所需且仅所需的访问权限，而不多也不少。此原则可以降低与对敏感资源进行特权访问管理相关的重大风险，同时减少用户完成工作时的摩擦。\n\
  * 定期审计和审查：对访问控制和权限进行持续监控和定期审计可以在问题变得严重之前突出潜在问题。对角色、权限和身份验证策略进行定期安排的审查有助于保持安全的 `IAM`\
  \ 态势。这也有助于使 `IAM` 策略适应组织内部不断变化的需求和结构变化。\n\n## 基础设施安全\n公有云中的计算资源，例如 `VMs`、`containers`、`serverless`\
  \ 和 `storage`，构成了应用程序和数据的底层基础。在公有云环境中保护计算资源对于确保在其上运行的应用程序和数据的保密性、完整性和可用性至关重要。每个基础设施组件，例如\
  \ `VM`、`container` 或 `storage`，都需要不同类型的保护。虽然公有云提供商提供共享责任或共享命运模型，其中底层物理基础设施安全由云厂商管理，但组织仍需保护上层基础设施，例如\
  \ `VMs` 中的客户操作系统、`storage` 的 `RBAC`，以及为 `containers` 保护容器注册表。以下是在公有云中保护基础设施时应考虑的一些最佳实践：\n\
  \n\n\n## 网络安全组 (NSGs) 和防火墙\nNSGs 和防火墙通常作为基础设施安全的首道防线，通过监管流向 **网络接口卡** (**NICs**)、**虚拟机**\
  \ (**VMs**) 以及其他网络资源的入站和出站流量。NSGs 由一系列安全规则组成，这些规则根据源 IP 地址和目标 IP 地址、端口号以及所使用的协议等因素允许或拒绝流量。它们具有高度可扩展性，可以与子网、单个\
  \ VM 或甚至特定的网络接口关联，提供对网络流量的精细控制。另一方面，防火墙可以是基于硬件的或基于软件的，并提供更复杂的功能集，包括深度包检测、入侵检测系统和应用层过滤。防火墙通常与\
  \ NSGs 结合使用以实现分层安全，通常称为纵深防御安全策略。\n\n## 全组织范围策略\n随着组织内部云使用量的不断增长，安全管理员识别、检测和修复反模式可能会变得困难。例如，生产环境中的\
  \ VM 实例配置了关联公共 IP 地址的 NIC，或对象存储桶配置为暴露于互联网的公共存储桶，这可能意味着安全威胁。组织可以利用云原生功能，例如组织策略或服务控制策略，来控制云资源的最佳实践使用。在前述示例中，可以设置全组织范围策略以阻止在所有项目中创建公共存储桶。\n\
  \n## 服务账号\n服务账号是专门用于应用程序、服务和自动化任务在公共云中与其他资源交互的身份。在云环境中，服务账号通常用于运行需要对某些资源进行受限访问的进程。例如，服务账号可能用于运行定期检查数据库新条目然后根据这些条目执行某些操作的脚本。授予该服务账号的权限将被精确定义，仅允许访问脚本所需的特定数据库和操作。这符合最小权限原则，该原则规定账号应仅拥有完成任务所需的权限，从而最大程度地减少因意外配置错误或恶意攻击造成的潜在损害。服务账号也可以与安全策略协同使用，以控制对云资源的访问，提供细粒度的安全控制。\n\
  \n## 补丁管理\n在公共云环境中，补丁管理是维护安全稳定基础设施的关键方面。利用云原生工具进行清单管理、漏洞扫描和自动化修补可以帮助组织保持强大的安全态势，同时利用云环境提供的可扩展性和灵活性。云服务提供商通常提供用于自动化常规任务的内置服务，包括补丁管理，使组织能够更轻松地使用最新的安全补丁和功能更新保持系统最新。云补丁管理中的关键步骤之一是维护所有资产的清单。了解正在运行哪些实例、服务和软件对于确定需要修补的内容至关重要。云服务通常带有标记功能，使分类和管理资源变得更容易。建立清单后，组织可以使用自动化扫描工具识别需要修补的漏洞。这些扫描可以安排在定期间隔运行，并可在补丁可用时触发自动化工作流以应用补丁。\n\
  \n## 容器安全\n随着组织继续开发云原生应用程序，在容器安全方面通常需要范式转变。尽管基于微服务的架构可以为 IT 和业务提供极致的规模、灵活性和敏捷性，但它需要一套专门的安全控制措施。容器安全的一些最佳实践和注意事项包括以下内容：\n\
  * 利用专为容器使用而优化且经过安全加固的容器优化操作系统，其操作系统占用空间更小。\n* 使用云原生工具，例如 `binary authorization`，在部署前对容器镜像进行认证和信任，并定期使用安全补丁更新它们。\n\
  * 限制容器注册表访问以防止未经授权访问容器镜像。\n* 使用不可变镜像以防止恶意部署。\n* 实施运行时安全措施，例如使用工具监控恶意活动。\n\n## 加密\n\
  加密对于保护静态数据和传输中数据至关重要。大多数云服务提供商提供即用型解决方案和工具，可自动加密和解密存储卷、持久磁盘和网络流量。然而，组织可以利用定制的本地密钥管理解决方案来管理加密密钥，或使用\
  \ HSM 密钥管理解决方案以进一步改善安全态势。\n\n## 机密计算环境\n在高度监管行业运营或处理敏感数据的企业可以利用大多数公共云服务提供商提供的机密计算选项。它涉及使用专用硬件和固件来保护\
  \ **使用中的数据**，在数据被解密进行处理时，数据会暴露于各种风险中，包括未经授权的系统访问或潜在黑客。机密计算，也通常被称为 GCP 中的 Shielded\
  \ VM 和 AWS 中的 Nitro System，通过使用专用硬件来实现——通常称为 **可信执行环境** (**TEEs**) 或安全飞地——该硬件在处理器的安全部分中隔离并执行代码。通过在整个生命周期中保护数据，机密计算为安全数据分析、隐私保护计算和跨组织数据共享等应用开辟了新的可能性。\n\
  \n## 工厂模式\n最后，自动化对安全至关重要，因为它可以防止用户错误并实现云中的 **默认安全** 操作。通过 `IaC` 自动化工具（如 `Terraform`）配置安全蓝图，该蓝图涵盖预定义的身份验证、授权、日志记录、监控、VM\
  \ 和容器的已批准受信任镜像（也称为黄金镜像）以及预防性和检测性控制，企业可以确保以安全为先的云转型。\n\n## 应用安全\n随着企业将现有应用程序迁移到云端或构建全新的云原生应用程序，应用安全问题日益突出。虽然云环境提供无与伦比的可扩展性和灵活性，并作为创新的起点，但它们也引入了一系列独特的安全挑战，尤其针对应用程序。云中有效的应用安全需要将针对本地软件量身定制的传统实践与云环境特有的新方法相结合。云中应用安全的基础要素之一是安全设计。这包括应用程序本身的架构以及它在云中与其他服务交互的方式。无论选择何种应用程序开发策略和框架，例如\
  \ `12-factor app` 或 `15-factor app`，从开发过程开始就采用 *安全设计* 方法可以最大程度地减少漏洞。例如，实施基于微服务的架构可以将故障和潜在的安全漏洞隔离到更小的攻击面，从而限制损害：\n\
  \n\n\n\n- **应用迁移**：对于迁移到云端的应用——特别是在直接迁移或迁移并优化场景中，强制执行云原生最佳实践可能是不可能的，或者仅限于最小程度。在这种情况下，企业可以通过使用云原生组件现代化外围应用组件来加强应用安全；这些措施包括利用原生云虚拟化代替虚拟机监控程序直接迁移，使用增强了\
  \ **Web 应用防火墙** (**WAF**) 的云原生负载均衡器来防范 SQL 注入、代码注入和 **跨站脚本攻击** (XSS)，以及使用安全计算环境，如机密计算、加固的操作系统和内核进程间通信。\n\
  \n- **云原生应用开发**：踏上重构或重新架构应用开发战略的企业可以利用现代 AppDev 原则，如 12 要素或 15 要素方法论，来开发安全的云原生应用\
  \ [7]。这有助于利用声明式格式实现应用设置自动化，确保无论部署平台如何都能实现最大可移植性，构建具有弹性、可扩展的应用，并最大限度地减少开发环境与生产环境之间的差异。让我们简要回顾一下云原生应用开发的\
  \ 15 个要素：\n\n    - **代码库**：一个在版本控制中跟踪的代码库，可部署多份\n    - **依赖**：显式声明并隔离依赖\n    - **配置**：在环境中存储配置\n\
  \    - **后端服务**：将后端服务视为附加资源\n    - **构建、发布和运行**：严格分离构建和运行阶段\n    - **进程**：将应用作为一个或多个无状态进程执行\n\
  \    - **端口绑定**：通过端口绑定导出服务\n    - **并发**：通过进程模型横向扩展\n    - **可丢弃性**：通过快速启动和优雅关闭最大化健壮性\n\
  \    - **开发/生产环境一致性**：保持开发、预发布和生产环境尽可能相似\n    - **日志**：将日志视为事件流\n    - **管理进程**：将管理/运维任务作为一次性进程运行\n\
  \    - **API 优先**：定义服务契约\n    - **遥测**：监控进程性能\n    - **认证**：跨硬件、网络和软件层保护应用安全\n\n\
  - **API 安全**：在云环境中，应用通过 API 与其他服务和资源交互。保护这些 API 对整体应用安全至关重要。这涉及使用安全的方法进行 API 调用，在\
  \ API 网关后保护 API，利用现代认证和授权协议（如 OpenID 和 OAuth），使用 **JSON Web 令牌** (**JWT**) 进行内部\
  \ API 通信，以及为应用 API 访问创建作用域等最佳实践。\n\n- **DevSecOps 实践**：将安全集成到 DevOps 中对于确保安全优先架构至关重要，也是推荐的最佳实践，因为\
  \ DevSecOps 旨在通过在 **软件开发生命周期** (**SDLC**) 的早期和贯穿始终集成安全来保护应用开发过程。这通常也被称为 **左移**。例如，从\
  \ *图 6.13* 可以看出，安全方面在早期和架构规划阶段就已集成，集成了 **静态应用安全测试** (**SAST**) 以分析和查找源代码漏洞、软件成分分析、**动态应用安全测试**\
  \ (**DAST**) 以检测运行中应用的漏洞、执行渗透测试、漏洞测试、合规验证、日志记录、审计、安全监控、威胁情报和合规验证。\n\n![图 6.13 –\
  \ DevSecOps 流程](img/B18893_06_13.jpg)\n\n图 6.13 – DevSecOps 流程\n\n- **API 管理**：通过向云服务添加代理层，API\
  \ 网关充当抽象层或外观以保护后端 API。API 管理平台还有助于抽象应用代码，通过尖峰抑制、威胁防护、数据脱敏和审计流量来强制执行配额和服务等级。\n\n\
  - **微服务**：虽然微服务提供了极大的灵活性和可扩展性，但设计良好的基于微服务的架构最重要的是通过遏制请求在环境中横向遍历来减少攻击面，并且必须将安全从代码构建、持续集成和部署集成到\
  \ SDLC 中。例如，利用容器分析漏洞扫描工具、在服务边界内保护制品或容器注册表，以及使用二进制授权仅允许部署可信镜像，可以帮助在多个层级保护云环境安全。\n\
  \n- **服务网格**：服务网格为管理复杂、分布式、基于微服务的应用提供了强大的能力。它基于零信任原则运行，不仅仅依赖网络边界进行安全防护，而是要求在每个接触点进行验证。采用最佳实践，如\
  \ **双向 TLS** (**mTLS**)、细粒度授权、用于密钥和证书管理的集中式 **证书颁发机构** (**CA**)、持续监控、用于 **策略执行点**\
  \ (**PEPs**) 的边车代理和边界代理，以及配置自动化，可以帮助提高云原生应用的整体安全性。\n\n- **漏洞管理**：定期渗透测试和漏洞评估对于识别潜在安全弱点不可或缺。云提供商通常提供工具，用于持续监控和扫描应用以识别已知漏洞，第三方解决方案甚至可以提供更全面的能力。\n\
  \n- **无服务器架构**：无服务器架构虽然提供了可扩展性和成本效益等诸多优势，但也带来了一组不同的安全考量，在许多方面，它比传统的基于服务器的架构更安全。例如，由于无需管理服务器，与无服务器相关的攻击面减小了。由于其短暂和短生命周期的特性，无服务器可以限制攻击向量的时间窗口，能抵御\
  \ DDoS 攻击，并能利用内置安全功能，如 RBAC、专用网络和加密。通过应用最小权限原则并在单独的容器中隔离，无服务器的影响范围也可以被最小化。\n\n在回顾了如何为安全优先的云环境进行设计和架构的各种考量后，现在让我们探讨一下在开发云原生应用时的一些反模式。\n\
  \n# 云原生反模式\n\n正如我们迄今为止所探讨的，云原生架构彻底改变了企业重新构想 IT 以及管理和部署其软件和服务的方式。它提供了一系列好处，如可扩展性、灵活性和成本效益。然而，云并非解决所有问题的灵丹妙药。事实上，伴随好处而来的是挑战，这些挑战往往表现为反模式——导致意外后果并阻碍云原生解决方案充分发挥潜力的常见做法。了解这些反模式有助于避免陷阱，并充分利用云计算的优势。在本节中，我们将回顾一些在踏上云转型之旅时需要警惕的常见云原生反模式。\n\
  \n## 云端的单体城堡\n\n\n\n\n\n云转型中常见的反模式之一是将单体应用直接“搬迁上云”。尽管该反模式存在特定例外情况——例如合同义务或数据中心退出场景，此时它被用作云原生转型前的过渡阶段——但这在各种规模的企业中仍是一种更为常见的模式。单体架构虽广泛应用于传统软件开发，但置于云环境中时会暴露出多个弊端。由于单体应用设计为作为单一单元运行，这会阻碍扩展、降低响应速度，并阻止组织利用现代技术：\n\
  \n*   **阻碍扩展性**：单体应用通常设计为单一单元，难以独立扩展各个组件。在云环境中，动态扩展资源以应对不断变化的工作负载至关重要。采用单体架构时，扩展意味着必须扩展整个应用，即使只有特定部分面临需求激增。这会导致资源利用率低下和成本增加。\n\
  \n*   **降低敏捷性**：云原生应用应具备敏捷性，能快速响应需求变更。单体架构会拖慢开发周期，因为应用的任何变更或更新都需要大量的测试和协调，这是由于组件间的相互关联性所致。这阻碍了云原生开发所倡导的快速迭代和部署。\n\
  \n*   **单点故障**：云原生架构通过隔离和复制组件及服务来实现高可用，从而提升容错能力。反之，单体应用存在单点故障。如果单体的某一部分失效，整个应用可能变得不可用，影响用户体验和业务运营。云环境提供了构建弹性和高可用系统的机会，而单体架构难以实现这一点。\n\
  \n*   **技术创新受限**：云平台提供广泛的服务和工具，可增强应用性能、创新、安全性和可扩展性。在单体架构中，因应用内部的相互依赖，采用新技术或服务以满足业务需求可能非常复杂。这阻碍了组织充分释放云平台的能力。\n\
  \n*   **过度配置的风险**：单体应用通常需要静态资源分配以确保整个技术栈正常运行。在云环境中，资源可动态分配以匹配需求，从而提高资源利用率和成本效益。单体架构往往导致资源过度配置或利用不足，影响运营成本。\n\
  \n## 忽视资源与成本优化\n\n资源与成本优化是云转型的关键考量与亮点。在云环境中忽视成本优化会给企业带来显著的负面后果，可能导致超支、预算受限和资源利用低效。这是导致企业云资源利用低效、云计划投资回报率（ROI）降低的常见反模式之一：\n\
  \n*   **过度配置**：大多数企业从传统本地部署思维中延续下来的一个常见反模式是资源过度配置。按高水位线或峰值使用量进行规模规划，并预先分配资源，是云原生架构的反模式。云资源通常按使用量计费，若缺乏监控和控制，极易在未充分利用的服务上超支。忽视成本优化会导致开支膨胀，影响组织整体财务健康。\n\
  \n*   **资源利用低效**：若无合理的成本优化策略，组织可能配置超出必要的资源，导致利用率不足。这浪费了宝贵的算力，在不带来相应业务价值的情况下增加成本。\n\
  \n*   **错失良机**：大多数云服务商提供各种成本优化和 FinOps 工具及功能，如 `auto-scaling`（自动扩缩容）、`reserved instances`（预留实例）、`spot\
  \ instances`（抢占式实例）以及 `spend or commit-based discounts`（基于消费或承诺的折扣）。未能利用这些机会，会导致在维持或提升服务质量的同时降低成本的良机流失。\n\
  \n*   **ROI 降低**：云投资旨在通过提升性能、可扩展性和效率来实现投资回报。忽视成本优化会侵蚀潜在 `ROI`，因为云服务的收益可能被不必要的开支抵消。\n\
  \n*   **创新受限**：在云资源上的超支会挤占本可投入创新项目和其他战略举措的资源。忽视成本优化会阻碍组织为业务增长和技术进步分配资源。\n\n## 非差异化重体力劳动\n\
  \n当组织管理本可通过云服务自动化的运维任务（如资源配置和维护）时，就会出现此反模式。这会导致复杂性增加、敏捷性降低，并产生分散核心业务目标精力的运维开销。非差异化重体力劳动涵盖云用户需管理但无法提供竞争优势、亦不直接贡献于核心业务目标的运维任务。这些任务包括配置服务器、管理数据库、配置网络和确保安全合规等活动。虽这些任务对云资源平稳运行至关重要，但会将宝贵的时间和资源从创新和核心业务活动中分流。该反模式的另一变体是过度使用或过度依赖开源或第三方工具及产品，而非简单的云原生或厂商原生产品。例如，因担心供应商锁定，选择在\
  \ `compute VM`（计算虚拟机）上部署 `PostgreSQL` 数据库，而非利用原生支持 `PostgreSQL` 的托管数据库产品。这对企业而言可能是高度非差异化的重体力劳动，因为底层软件——此处为\
  \ `PostgreSQL`——是数据库标准，可轻松移植或迁移至不同部署平台。该反模式的主要挑战包括：\n\n*   **资源消耗**：组织常花费大量时间精力管理基础设施相关任务，而这些任务无法直接在市场上差异化其产品或服务。这将资源从战略举措和创新中分流，是该反模式的关键阻碍之一。\n\
  \n*   **方案复杂性**：单纯将云平台视为另一种基础设施或本地环境的替代品，会使方案过度复杂。这很快会变得难以维护和管理。\n\n*   **上市时间延迟**：花费在非差异化重体力劳动上的时间会拖慢开发周期和新功能、服务的\
  \ `time-to-market`（上市时间）。\n\n## 臃肿的容器\n\n\n\n\n\n## 臃肿的容器\n\n企业构建云原生应用时面临的另一个常见反模式是**臃肿容器**的挑战。臃肿容器是指容器体积增大的情况，这可能导致多种挑战，影响应用集群的效率、性能和可管理性。容器镜像体积可能因多种因素而增加，例如低效的依赖管理、未使用的构建产物、不必要的层缓存、使用完整操作系统作为基础层构建镜像，以及包含大型二进制文件（如编译后的可执行文件或媒体文件）构建镜像。该反模式的一些主要挑战包括：\n\
  \n*   **资源消耗低效**：臃肿容器消耗更多的 CPU、内存和存储资源。这可能导致资源利用率低下，从而增加成本并降低整体集群性能。\n*   **可扩展性**：过大的容器会影响\
  \ Kubernetes 高效扩展应用的能力。当扩展基于资源利用率时，较大的容器可能导致不准确的扩展决策，从而造成资源的过度配置或配置不足。\n*   **启动时间缓慢**：较大的容器通常需要更长的启动时间，因为它们需要加载更多的资源和依赖项。这会拖慢部署和扩展流程，影响应用的响应能力。\n\
  *   **攻击面增加**：较大的容器可能包含不必要的软件或依赖项，增加潜在的攻击面和安全风险。未修补或不必要的软件可能使应用容易受到漏洞利用和攻击。\n* \
  \  **故障排查复杂性**：臃肿容器会使故障排查和调试更加复杂，因为当容器包含大量组件和依赖项时，识别性能瓶颈、资源争用问题或兼容性问题会变得更难。\n* \
  \  **网络流量**：依赖项过多的容器会产生更多网络流量，影响整体网络性能，导致拥塞或延迟问题。\n*   **资源碎片化**：大型容器可能需要的资源超过单个节点上的可用资源。这可能导致资源碎片化和利用率不足，因为原本可以在同一节点上调度多个较小的容器。\n\
  *   **可维护性**：随着时间的推移，管理大型或复杂的容器变得更具挑战性。升级、修补和维护此类容器容易出错且耗时。\n\n## 可变基础设施\n\n**可变基础设施**是指直接对现有基础设施组件进行更改，而不是用新组件替换它们的做法。在云计算语境下，这涉及修改现有资源（如虚拟机、数据库和网络组件），而不是从头创建新实例，这可能是一种反模式。云原生架构主张将基础设施组件视为不可变的，这指的是创建新实例而不是修改现有实例的做法。云环境中可变基础设施的一些挑战包括：\n\
  \n*   **配置漂移**：随着时间的推移，在可变基础设施中，不同实例上的配置设置可能会偏离其原始状态，导致配置漂移。这可能导致不一致，并难以维护一个可预测且稳定的环境。\n\
  *   **依赖管理**：随着可变基础设施中对组件进行增量修改，这些组件之间的依赖关系可能变得复杂且难以管理。确保对一个组件的更改不会无意中影响其他组件，需要仔细考量。\n\
  *   **回滚挑战**：如果更新失败或更改导致问题，在可变基础设施设置中回滚更改可能更具挑战性。这要求回滚机制定义明确且经过测试，以最大限度地减少停机时间和潜在数据丢失。\n\
  *   **版本控制与追踪**：如果没有适当的版本控制和追踪机制，管理可变基础设施组件的更改将极具挑战性。追踪更改内容、更改人及更改原因对于故障排查和审计至关重要。\n\
  \n当组织踏上云转型之旅时，反模式可能会阻碍云价值的最佳利用。理解并识别这些反模式对于组织避免昂贵的错误、最大化效率、提高可靠性并充分发挥云优势至关重要。\n\n\
  # 总结\n\n在本章中，我们重点介绍了组织如何构建一个稳健、开放且敏捷的面向云的企业基础，以支持当前和未来的业务需求。我们探讨了云采用框架的四个阶段，即评估、规划、部署和优化，以及每个阶段中能为云转型计划提供结构化方法的关键要素。我们还详细讨论了企业可以采用的各种混合云和多云部署模式，特别关注拥有大量本地\
  \ IT 资产的组织，并确认了云采用面临的挑战。\n\n当组织在混合云和多云部署的复杂性中航行时，一个可扩展且安全的网络架构对于支持高可用性、性能优化和规模扩展等关键考量至关重要。考虑到这一点，我们回顾了一些核心基础网络架构蓝图、其适用性及注意事项。我们还深入探讨了企业如何将安全架构为其云环境的一等公民，重点关注身份与访问管理、基础设施安全和应用安全等各个安全方面。随后，我们探讨了\
  \ AWS、Azure 和 Google Cloud 等主要云服务提供商提供的安全模型。\n\n最后，我们讨论了组织从本地迁移到云时常见的五个云原生反模式陷阱。在下一章中，我们将探讨一些大型企业的云用例。\n\
  \n# 延伸阅读\n\n本章使用的参考资料及一些额外资源列表如下：\n\n1.  AWS 共享责任模型：[`aws.amazon.com/compliance/shared-responsibility-model/`](https://aws.amazon.com/compliance/shared-responsibility-model/)\n\
  2.  AWS 安全基础：[`docs.aws.amazon.com/prescriptive-guidance/latest/security-reference-architecture/foundations.html`](https://docs.aws.amazon.com/prescriptive-guidance/latest/security-reference-architecture/foundations.html)\n\
  3.  Azure 共享责任模型：[`learn.microsoft.com/en-us/azure/security/fundamentals/shared-responsibility`](https://learn.microsoft.com/en-us/azure/security/fundamentals/shared-responsibility)\n\
  4.  Azure 安全基准基础：[`learn.microsoft.com/en-us/azure/governance/blueprints/samples/azure-security-benchmark-foundation/`](https://learn.microsoft.com/en-us/azure/governance/blueprints/samples/azure-security-benchmark-foundation/)\n\
  5.  Google Cloud 共同命运模型：[`cloud.google.com/architecture/framework/security/shared-responsibility-shared-fate`](https://cloud.google.com/architecture/framework/security/shared-responsibility-shared-fate)\n\
  6.  Google Cloud 企业基础：[`cloud.google.com/architecture/security-foundations#a_defense-in-depth_security_model`](https://cloud.google.com/architecture/security-foundations#a_defense-in-depth_security_model)\n\
  7.  12 Factor App：[`12factor.net/`](https://12factor.net/)\n"
- "## 7. 混合云用例\n\n\n\n\n在过去十年中，云计算不仅解决了企业面临的常见挑战，如按需服务供给、弹性扩展和降低总拥有成本，还通过普及现代技术，成为数字化转型的引擎。随着客户体验成为焦点，上市速度、弹性和可用性已成为任何企业蓬勃发展的基本要求。当组织寻求通过\
  \ Web 3.0、生成式 AI 或元宇宙等现代技术颠覆市场时，云计算成为业务转型的事实标准。就在十年前，那些拥有资本、资源和实力构建并维护 Tier 4 数据中心的企业，相对于在\
  \ Tier 1 数据中心运营的竞争对手，拥有一种惊人的优势。云计算已经普及了计算能力以及现代技术的访问途径，使各种规模的企业都能进行创新并大规模交付。\n\n\
  至关重要的是，云计算使企业能够引领一场由技术驱动的业务转型，而这样的转型在其他情况下是不可能或极难培养出相应能力的。例如，开发具有现代 AI 能力的应用程序需要构建服务器基础设施\
  \ AI 集群，这在人力和成本方面都可能耗费大量资源。再加上不断变化的硬件技术格局，这很快就会变得成本过高且难以扩展。基于云的基础设施不仅提供对现代硬件的按需访问，更重要的是，它允许团队进行实验、快速失败并迅速创新。\n\
  \n在本章中，我们将探讨几个在不同程度上拥抱云计算的企业案例研究，包括现有模型面临的挑战、采用云计算的驱动因素，以及它们实现的业务收益。\n\n在本章中，我们将介绍以下公司/企业的用例：\n\
  \n* Airbnb\n* 家乐福\n* 温迪\n* 第一资本\n\n# Airbnb——以技术引领业务转型\n\nAirbnb 创立于 2008 年，是一个在线市场，致力于为消费者提供短期和长期民宿以及独特的体验。该公司提供一个基于网络的平台，将世界各地的客人和房东连接起来，房东可以在平台上列出自己的房产，而客人可以搜索、查看可用性和价格并预订住宿。自成立以来，Airbnb\
  \ 平台已拥有超过 500 万房东，并服务了全球超过 15 亿客人。\n\n## 颠覆酒店业\n\nAirbnb 在 2022 年报告了 84 亿美元的收入，并拥有\
  \ 800 亿美元的市值 *[1]*。作为对比，Airbnb 在 2014 年的收入为 4 亿美元，并实现了数倍同比增长。Airbnb 在多个方面颠覆了传统酒店业，包括从根本上改变了人们旅行和预订住宿的方式。在某种程度上，Airbnb\
  \ 仅通过在互联网上搭建一个社区平台，就成为了酒店业的领导者，而无需拥有、运营和维护房产。Airbnb 颠覆该行业的一些关键方式如下：\n\n* **引入点对点模式**：Airbnb\
  \ 引入了点对点模式，允许个人将房屋或空闲房间出租给旅行者。这有别于传统的酒店业模式，在传统模式下，旅行者通常住在酒店、汽车旅馆或其他商业住宿场所。\n\n*\
  \ **多样化的住宿选择**：Airbnb 提供了一系列富有创意的住宿选择，包括公寓、房屋、共管公寓，甚至还有树屋或船屋等独特空间。这种多样化有别于传统酒店或度假村以标准化产品运营的方式。这也使\
  \ Airbnb 能够为客人创造和提供独特体验，同时让房东在经济上可行，从而形成三赢策略。\n\n* **全球化思维，本地化体验**：Airbnb 为旅行者提供了像当地人一样体验目的地的独特机会。与标准酒店相比，住在别人家中可以提供更真实、独一无二的体验。这让\
  \ Airbnb 能够超越传统酒店的物理空间进行扩展，将客人与房东联系起来。\n\n* **灵活的预订**：Airbnb 推出了灵活的预订选项，包括短期和长期租赁。这种灵活性为需求各异的旅行者提供了极大的便利，无论是简单的周末短途旅行还是长期住宿。\n\
  \n* **社区平台**：Airbnb 允许房东和客人留下评论、反馈和评分，从而建立了社区感和信任。这种反馈机制作为一种信任手段，帮助房东和旅行者做出明智决策。更重要的是，Airbnb\
  \ 通过允许房东出租空间赚取收入，同时为客人提供独特体验，对社区产生了经济影响。\n\n* **数字平台**：Airbnb 专注于打造一个易于使用且可扩展的数字平台，让社区成员只需通过浏览器或移动应用就能极其简单轻松地浏览、预订和管理住宿。这使得\
  \ Airbnb 能够扩展到全球，让旅行者几乎在世界任何角落都能找到住宿。\n\n## 云上诞生的业务\n\nAirbnb 拥有独特的业务模式，主要依赖于无缝、弹性且可扩展的数字平台。因此，Airbnb\
  \ 需要现代化的 IT 基础设施，以便按需扩展，帮助业务拓展以支持全球运营，尤其注重卓越的客户体验和上市速度。在精简的 IT 团队支持下，关键是让资源专注于核心的高价值业务功能，而不是耗费在日常事务（如\
  \ IT 运营和持续维护）上。Airbnb 成立于**亚马逊云服务**（**AWS**）推出约两年后。云计算对 Airbnb 来说是一个显而易见的选择，因为它提供了急需的按需、托管、可扩展且弹性的基础设施，帮助它们快速启动并运行。通过云原生方式，Airbnb\
  \ 能够以简单的云架构起步，同时随着时间推移不断调整，实现运营和财务效率的提升。让我们来看看 Airbnb 是如何随着时间推移演进其服务和效率的。\n\n##\
  \ 最初的架构\n\nAirbnb 作为一家商业企业，其成功的很大一部分归功于其敏捷性——随着时间推移，不断采用尖端技术以适应不断变化的趋势，确保顶级客户体验，并无缝满足业务需求。在云计算仍属于小众领域的时候，Airbnb\
  \ 利用云技术实现了两个主要目标：随着业务扩展无缝扩展的能力，以及以超精简的 IT 运营团队运营的能力。Airbnb 利用了 AWS 最早提供的一些云服务，如\
  \ EC2、S3、RDS、DynamoDB、ElastiCache 和 Route53，构建了一个简单、可扩展且具有弹性的平台。由于该应用程序由 Ruby on\
  \ Rails 驱动且具有单体架构，这一架构被称为“单轨”（monorail）。该平台利用了 AWS 提供的一些基础云服务 *[2]*：\n\n* **EC2**：Web\
  \ 服务器、应用程序和服务\n\n* **S3**：存储房源中不断增长的图片和视频\n\n* **ElastiCache**：通过数据缓存提高性能\n\n* **RDS**：处理事务性数据\n\
  \n* **DynamoDB**：元数据、NoSQL 和汇总数据\n\n* **Route 53**：下图展示了 Airbnb 的初始云架构：\n\n![图 7.1\
  \ – Airbnb 的初始云架构](img/B18893_07_1.jpg) \n\n图 7.1 – Airbnb 的初始云架构\n\n\n\n\n这对 Airbnb\
  \ 平台最初的需求和需要来说非常合适，因为 Airbnb 花了几年时间才获得人气和动力。这种单体平台提供了诸多好处，例如简单、易于构建、监控和部署，同时还减少了开销，使这个小团队能够迅速将\
  \ Airbnb 推向市场。云平台能够无缝按需扩展，以支持 Airbnb 的增长突增，2013 年用户总数增加了一倍多，从 400 万增至 900 万。最初的一些服务包括房产搜索、定价和欺诈预测。值得注意的是，Airbnb\
  \ 能够以极其精简的团队持续满足消费者需求，而这个架构仅由一个五人运维团队支持。\n\n## 向微服务演进\n\n随着 Airbnb 继续全球扩张并进入超高速增长阶段，最初的\
  \ Monorail 单体平台带来了一些挑战。Airbnb 正处于一个拐点。例如，单体架构无法无限扩展，无法快速发布新功能，也无法实现无缝的开发者协作，尤其是在组织实力不断壮大的情况下。2014\
  \ 年，Airbnb 进行了一次重大的品牌重塑活动。这也意味着 Airbnb 的工程团队必须投入大量资源来重新设计平台的每个方面。到 2016 年，Airbnb\
  \ 推出了`Airbnb Experiences`，世界各地的当地房东或旅游运营商可以设计和提供独特的体验给客人。基于压倒性的积极客户体验和反馈，Airbnb\
  \ 还推出了`Airbnb Plus`和`Airbnb Collections`。通过云优先策略，Airbnb 能够迅速从单体架构转向云原生的面向服务架构，而无需担心技术债务。不仅如此，云还使\
  \ Airbnb 团队能够快速试验、部署和大规模扩展新功能[3][4]。\n\n凭借一千多名工程师专注于提供尖端服务，Airbnb 得以将 Monorail 重构为面向服务的架构，实现了\
  \ API 驱动的方式，将独立服务组件模块化、标准化通信协议，并独立扩展服务，从而更易于维护。这提供了更好的问责制，并能更快地交付新功能，有助于提升业务敏捷性。该平台还能够无缝支持移动等新平台，结果也证明了这一点。由于回滚减少，Airbnb\
  \ 平台的停机时间显著减少，页面性能提升了 10 倍。\n\n从架构角度来看，Airbnb 逐渐摆脱了`EC2`等核心基础设施服务，转向`Kubernetes`平台，以更好地适应微服务范式。一个非常关键的改进是，基于`Kubernetes`的微服务架构允许\
  \ Airbnb 按需自动独立扩展各个服务，如下面的微服务架构图所示[5]：\n\n![图 7.2 – Airbnb 的微服务架构](img/B18893_07_2.jpg)\n\
  \n图 7.2 – Airbnb 的微服务架构\n\n若干关键的渐进式改进使 Airbnb 能够扩展平台，以支持数亿用户，并投资于结合了内部技术和开源技术的通用基础设施。以下是一些关键的架构组件：\n\
  \n*   **API 框架**：基于`HTTP`上的`Thrift`开发的内部框架\n*   **Powergrid**：用于编排和管理任务的**有向无环图**（`DAG`）\n\
  *   **OneTouch**：一个`Kubernetes`框架，可跨环境高效管理服务\n*   **Spinnaker**：开源持续交付平台\n*   **GraphQL**：用于数据访问的统一模式\n\
  \n这是 Airbnb 持续数字化转型中的一个重要里程碑，因此拥抱云技术以进一步实现业务目标[6]：\n\n## 多云采用与转型\n\n随着 Airbnb 继续全球扩张，团队也在全球范围内壮大。保护跨本地数据中心和云运行的任务关键型企业应用成为首要任务。`Airbnb.com`主要托管在`AWS`上，而一些特定的支持服务则出于延迟考虑运行在本地数据中心内。有一段时间，Airbnb\
  \ 和任何企业一样，利用`VPN`等传统技术让员工连接到企业应用。然而，随着团队出差或从不同地点连接企业应用和服务，在保证安全访问的同时提供无缝体验成为一项挑战。完全依赖`VPN`进行访问控制意味着要么速度缓慢，要么体验不一致。Airbnb\
  \ 希望改变安全实施方式，为员工提供低延迟连接，无论他们身在何处，同时让他们能够在任何地方（陆地或空中）工作，只要有互联网接入即可。\n\n解决方案是**BeyondCorp**，这是由`Google`开发的一种安全模型，利用身份和上下文来评估访问决策的信任度，而不是将企业网络作为边界[7]。Airbnb\
  \ 迅速采用了多云战略，由`Google Cloud`管理 Airbnb 服务的网络和安全态势，无论它们在哪里运行。下图展示了 Airbnb 如何利用`BeyondCorp`的上下文感知访问的高层架构：\n\
  \n![图 7.3 – Airbnb 的多云架构](img/B18893_07_3.jpg)\n\n图 7.3 – Airbnb 的多云架构\n\n## 疫情与经济放缓——优化阶段\n\
  \n云架构为企业提供的另一项关键能力是，能够以低得多的风险阈值快速试验新技术，同时将成本控制在合理范围内。`Covid-19`疫情对全球多个行业和企业造成了大规模影响，Airbnb\
  \ 也不例外。然而，Airbnb 很早就组建了一个云`FinOps`团队，并开始研究其云使用情况以寻找优化途径，部分原因是为其`IPO`做准备，并实现了显著的云成本优化。云治理和`FinOps`实践使\
  \ Airbnb 比一些同行更好地应对了全球疫情的影响，而那些同行正在裁员数十名员工。Airbnb 成功优化了其云存储成本约 27%，并将`OpenSearch`服务成本优化了\
  \ 60%[8]。\n\n让我们来看看 Airbnb 进行的一些关键云优化：\n\n*   **全面识别并可视化当前云使用情况，同时利用云提供商提供的工具**：在这种情况下，Airbnb\
  \ 利用了名为`AWS Cost Explorer`的成本分配可视化引擎，以及来自`AWS Cost & Usage Report`工具的数据。这帮助 Airbnb\
  \ 在细粒度层面可视化、理解、管理和优化其云技术栈。\n*   **识别并优化跨云环境的大型数据存储**：云提供商提供不同层级的数据存储选项——从即时访问到归档——以满足特定的应用需求。在这种情况下，Airbnb\
  \ 利用了`AWS S3`的智能分层功能，优化并将正确的数据存储需求与正确的存储层级对齐，从而大幅节省存储成本。\n*   **在云中创建扁平网络**：这不仅节省了成本，还带来了低维护和改进的性能效率。\n\
  *   **识别并利用现有的各种节省计划与合同工具**：通过这样做，Airbnb 能够在运行相同工作负载时获得更高的节省。例如，承诺使用一定基线的用量，这有助于\
  \ Airbnb 以折扣价格实现显著的成本效益。\n\n\n\n\n\n## Airbnb 的云原生转型\n\n- **迁移到定义的无服务器平台**：从原始的专用计算基础设施迁移到具有应用程序定义的横向扩展规则的无服务器平台，可对成本节约产生积极影响。\n\
  \n- **利用交互式日志分析和实时应用程序**：作为一项持续的 FinOps 最佳实践，Airbnb 还利用交互式日志分析和实时应用程序监控功能，持续评估和优化云成本。\n\
  \n通过采用云优先的云原生方法，Airbnb 不仅通过技术颠覆了酒店业，还成功适应了动态的市场条件，同时保持了敏捷和以客户为中心。\n\n# 家乐福的可持续数字化转型之旅\n\
  \n家乐福成立于 1959 年，是一家跨国零售集团，是世界上最大、最知名的超市和大卖场连锁品牌之一。截至 2024 年，家乐福仍是全球第八大零售商，业务遍及 30\
  \ 个国家，经营超过 12,225 家门店。家乐福经营多种零售业态，包括大卖场、超市、便利店和电商平台，提供种类繁多的商品，包括生鲜食品、日用百货、电子产品、服装和家居用品。家乐福被视为行业领导者，主导了一些大胆且成功的数字化转型举措，包括开发现代电商平台和数字服务，以提升客户购物体验。家乐福还参与了各种可持续发展和环保举措，包括承诺减少碳足迹、推广可持续采购和减少食物浪费。家乐福在零售业的成功使其成为全球市场的重要参与者，为许多国家的消费者提供各种产品和服务。其持续的扩张和对不断变化的消费者需求的适应，使其能够保持在零售业的突出地位。\n\
  \n家乐福的数字化转型是其为保持在不断演变的零售市场中具有竞争力而做出的更广泛努力的一部分，在该市场中，数字技术和不断变化的消费者行为发挥着重要作用。这一转型使公司能够满足日益数字化和互联的客户群体的需求，并优化其运营以提高效率和可持续性。家乐福数字化转型举措的几个关键方面如下：\n\
  \n- **电商现代化**：家乐福利用云技术大幅扩展其电商业务，让顾客能在线购买生鲜杂货和各类商品。这包括传统电商平台和移动应用，为顾客提供了创新的购物方式，即下单配送或选择“点击自提”选项。这使家乐福能动态扩展以满足消费者需求，提供个性化推荐，同时优化运营和基础设施维护相关成本。\n\
  \n- **数字服务**：家乐福推出各种数字服务以提升客户体验，包括在线订购、送货上门，以及电子目录、购物清单和个性化推荐等功能。它还开发了移动应用程序，为客户提供便捷的购物方式、获取折扣和促销信息、管理会员卡。家乐福还采用并提供各种数字支付方式，包括移动钱包和非接触式支付选项，以方便客户进行更快捷、更便利的交易。\n\
  \n- **忠诚度计划**：家乐福将其忠诚度计划数字化，根据客户的购物习惯和偏好提供个性化折扣和奖励。\n\n- **供应链优化**：数字技术使家乐福能够提高供应链效率，降低成本并准确预测需求，确保门店和在线订单的产品供应。\n\
  \n- **全渠道整合**：家乐福致力于整合其线下和线上渠道，为客户提供无缝购物体验。这让客户能灵活购物，家乐福将其定义为 “*想买什么就买什么，想在哪买就在哪买，想什么时候买就什么时候买，想怎么买就怎么买*”。这使家乐福能够挽回流失客户、增加忠诚度并提升在线销售额。\n\
  \n- **数据洞察**：家乐福利用现代数据分析深入了解客户行为、购物趋势和库存管理。这种数据驱动的方法帮助公司做出明智决策并改进运营。\n\n- **环保举措**：家乐福利用数字工具推动可持续发展。2018\
  \ 年，家乐福董事长兼首席执行官 Alexandre Bompard 发起了 *Act for Food* 全球计划，通过具体举措帮助其客户和员工吃得更好——无论身在何处——且价格实惠。例如，公司利用技术减少食物浪费、优化能源消耗并支持环保举措。\n\
  \n- **客户互动**：家乐福利用数字渠道通过营销、社交媒体和客户支持与客户互动，促进更牢固的品牌与消费者关系。这极为有效，帮助家乐福在消费者中建立了强大的品牌价值。\n\
  \n- **创新合作伙伴关系**：家乐福与科技公司和初创企业建立战略合作伙伴关系，推动零售创新。这些合作促成了新服务和解决方案的开发。\n\n## 家乐福的全渠道战略\n\
  \n2017 年 4 月，在巴黎的投资者日上，家乐福展示了其零售战略及其面向 *赋能消费者* 的愿景 \\[9\\]。主要重点是确保家乐福对透明度的承诺，并为质量、标准和消费者忠诚度建立基准。这一年，家乐福认识到新消费者时代的到来，他们更加城市化、数字化和移动化，并关注所分享的数据。市场调研数据中的一些有趣观察包括以下内容：\n\
  \n- 2014 年城市化率为 54%，预计 2050 年将达到 66%\n- 数字化渗透率仅在 2000 年至 2016 年间就增长了七倍\n- 消费者所有购买中有\
  \ 34% 通过移动设备完成\n- 58% 的消费者因全天候可用性而更喜欢在线购物\n\n针对这些统计数据，家乐福投资构建多业态、全渠道的零售体验，不仅方便无缝，还提供愉悦的购物体验。作为多业态使命的一部分，家乐福的每种业态都专注于提供独特的体验。例如，大卖场确保消费者能在一个屋檐下以有竞争力的价格买到几乎所需的一切，而超市则战略性地选址在居民区附近，专注于提供生鲜食品。便利店提供生活必需品并延长营业时间，而\
  \ *Cash & Carry*（现购自运）门店则以批发价提供产品，带来无花哨的购物体验。最重要的是，电商店通过最全的产品品类丰富了产品目录，提供全面、便捷、随时随地的购物体验。电商平台\
  \ *Carrefour banque et assurance*（家乐福银行与保险）还提供预订旅游体验、租车和保险等增值服务。\n\n\n\n\n\n全渠道模式抓住了确保电子商务可持续发展的独特机遇。例如，家乐福整合了其供应链、CRM、人力资源、电子商务和数字营销，以实现无缝的全渠道转型，将后端订单管理投入运营，使消费者能够在不同业态（大卖场、超市或便利店）之间跨店取货，提供送货上门服务，并提供店内“点击提货”以及储物柜等自提点。这是帮助家乐福整个生态系统中消费者的关键因素。它通过长期忠诚度、提高钱包份额和购物频率、焕活客户群以及赢回流失消费者来实现这一点。\n\
  \n家乐福数字化转型战略的另一个关键方面是构建一套凝聚力的数据战略，收集相关的客户和运营数据。家乐福为**数据即服务**模式奠定了基础，该模式有助于从其庞大的第一方数据（与第三方数据混合）中提取有意义的洞察。第一方数据包括家乐福从其电子商务应用、移动应用、忠诚度计划和社交媒体中获取的消费者和运营数据，而第三方数据则涉及匿名数据。这些宝贵的数据使家乐福能够通过提供个性化推荐、检测客户流失和提高忠诚度来改善客户关注度，同时通过实时检测**销售点**（**POS**）和缺货异常以及改进需求预测来提高运营关注度。\n\
  \n## 一项由云转型助推的大胆举措\n\n2018 年，家乐福推出了*“食品行动”*，这是一项全球性的具体举措计划，旨在让消费者无论身处何地都能以可负担的价格吃得更好。该计划与公司层面的转型计划保持一致，即致力于成为全球*食品转型*领域的领导者。**食品转型**被定义为向可持续食品体系的过渡，在该体系中，食品的生产和消费不会损害子孙后代营养的经济、社会和环境基础。在接下来的几个月里，家乐福采取了一项大胆的战略举措，利用云技术作为基础支柱，将技术注入其业务目标的服务中。这意味着家乐福利用其核心数字化转型理念，与超大规模云服务商合作，以快速创新、引领和转型。家乐福选择谷歌云作为其战略合作伙伴，不仅是为了助力数字化转型之旅，更重要的是利用谷歌在零售中心解决方案、数据分析、人工智能、营销、媒体转型和现代数字工作场所方面的专业知识\
  \ *\\[11\\]*。\n\n在云转型之旅开始之前，家乐福主要利用本地数据中心、私有云和公有云的组合来支持其跨地域的电子商务。这些选择通常由当地的家乐福在本地做出，导致服务提供商布局分散。家乐福为其云转型之旅奠定了四大关键支柱：\n\
  \n- **定义云愿景和战略**：家乐福数字化转型的核心思想是让所有 IT 工作聚焦于更好地服务客户。家乐福观察到零售业的快速演变趋势，并很早就认识到上市速度是绝对优先事项，从而制定了云环境下的数字化转型愿景和战略。\n\
  - **明确专用云服务模式**：正如每个企业都是独一无二的，数字化转型也是如此。家乐福定义了围绕不同云服务模式（IaaS、PaaS 和 SaaS）的使用标准。例如，虽然其大部分应用程序可以在\
  \ IaaS 和 PaaS 上进行定制和现代化改造，但某些支持功能（如人力资源和财务）可以快速受益于专用的 SaaS 应用程序。\n- **组织对齐**：当企业踏上重大数字化转型之旅时，传统组织必须发展和适应以支持这一进程。家乐福认识到需要建立**云卓越中心**（**CCoE**）来发展云运营方面的专业知识、管理新技术栈、识别合适的解决方案、制定路线图、招聘云专家，并定义参考架构蓝图，同时注入云\
  \ FinOps 等关键治理功能。\n- **沟通**：家乐福大规模云转型成功的主要原因之一归功于有效的沟通。家乐福公开了其云转型的意图，同时确保愿景和战略在整个组织中得到充分传达。这有助于确立组织方向，并激励团队朝着这一更大的使命迈进。\n\
  \n当家乐福开始对其零售业务进行数字化转型并在云端创新时，它制定了一些与业务挑战相关的非常明确的价值主张：\n\n- **无缝扩展**：无论在架构上还是运营上，维护单体电子商务平台对\
  \ IT 团队来说都很艰难，这使其难以适应业务需求。采用云原生的方法有望解决这一挑战。\n- **上市速度**：上市速度与响应市场需求的业务敏捷性成正比。当家乐福致力于数字化转型时，云计算通过消除许多平凡但关键的本地决策（如选择合适的基础设施、采购、软件和硬件合规性以及容量规划）直接改善了上市速度，从而补充了该战略。\n\
  - **持续创新**：采用云原生和**自由开源软件**（**FOSS**）战略帮助家乐福利用尖端技术，同时以低风险快速进行实验。家乐福也认识到，在竞争激烈的零售环境中，持续创新对于蓬勃发展和持续生存至关重要。\n\
  - **可用性**：在现有的本地环境中，从资源、成本和时间限制来看，实现持续的高可用性极其困难。例如，三个 9 的可用性与四个 9 的可用性表面上似乎差异很小，但可能导致应用程序正常运行时间产生\
  \ 8 倍的影响。\n- **可持续性**：云转型的主要动机之一是家乐福对全面可持续性的坚定关注。家乐福的云战略能够使其实现显著更高的**电源使用效率**（**PUE**），优化能源使用，并减少其全球碳足迹。\n\
  - **安全性**：随着网络威胁持续上升，保护 IT 基础设施变得比以往任何时候都更加复杂。通过其云战略，家乐福可以利用云提供商的安全专业知识，并采用现代云原生安全解决方案和纵深防御安全架构来管理、监控和保护其关键应用程序和数据。\n\
  - **效率**：通过其云战略，家乐福可以将所有资源集中在业务优先事项上，而不是建设和运营数据中心。家乐福根据用例的性质采用了多模式云，以提高整体效率。\n\n\
  ## 将传统 IT 转变为现代云\n\n\n\n\n家乐福在数十个国家开展业务，其面临的主要挑战之一是：每个地区的家乐福集团都拥有自己的 IT 部门、数据中心、应用程序和技术选型。这种模式在一段时间内运作良好；然而，多年来，组织内部的各个业务单元构建了大量应用程序，导致基础设施环境分散且异构，存在冗余解决方案和数据孤岛。随着零售市场需求呈指数级增长，这些应用程序、基础设施和解决方案中的许多已触及极限，这迫切需要进行革新，以制定面向未来的可扩展、有弹性且现代化的\
  \ IT 战略。在构建零售业未来的过程中，家乐福采取了精简且分阶段的方法，推动跨区域的 IT 转型。\n\n## GearUp 计划\n\n家乐福的云转型第一阶段始于\
  \ 2019 年，主要重点是改进 IT 运营以推动性能和创新。该计划代号为 GearUp。GearUp 计划的核心思想是专注于重塑 IT 并确保业务对齐。这包含以下几个方面：\n\
  \n*   **评估现状**：这涉及采访业务利益相关者以了解业务愿景和顾虑，同时评估跨基础设施、应用程序和业务流程的当前 IT 全景。\n*   **战略对齐**：家乐福通过研讨会与\
  \ Gartner 合作，以获得关于战略和组织对齐的见解。\n*   **IT 路线图定义**：这涉及为各种 IT 项目定义近期、中期和长期路线图。\n*  \
  \ **利益相关者沟通**：家乐福向业务和 IT 利益相关者展示并传达了愿景、战略和路线图，并获得了支持。\n\n根据初步评估，家乐福必须解决的一个关键挑战是重塑这个拥有\
  \ 60 年历史的组织，并使其适应新一代 IT。家乐福在现有 IT 运营中识别出一组 23 个痛点。以下是家乐福实施的一些运营和流程变更，这些变更对其业务优先级产生了直接的积极影响：\n\
  \n![图 7.4 – 传统 IT 转型的关注领域](img/B18893_07_4.jpg)\n\n图 7.4 – 传统 IT 转型的关注领域\n\n既然我们已经探讨了家乐福在传统\
  \ IT 转型方面的战略，现在让我们回顾一下家乐福西班牙在云端的数字化转型。\n\n## 家乐福西班牙的数字化转型\n\n家乐福的使命是通过为全球客户提供最优质的购物体验、以最优价格提供最优产品，来转型零售业的未来。家乐福西班牙作为其西班牙子公司，是家乐福集团中最早拥抱数字化转型的实体之一，在全国拥有\
  \ 1,000 多家实体门店，每年服务 140 万笔在线交易。为了确保家乐福无论通过哪个购物渠道都能为客户提供同等高质量的服务，整合来自多个数据流和后台职能（涉及产品、本地库存、定价和可用性）的数据至关重要。意识到现有本地\
  \ IT 基础设施的局限性、消费者对无缝全渠道购物体验的需求以及利用技术创新的潜力，家乐福西班牙决定彻底改造并现代化其老旧的 IT 基础设施，同时为未来构建以数据为中心的技术基础。其主要目标包括：\n\
  \n*   **整合并现代化后台 ERP 基础设施**\n\n    多年来，家乐福在本地构建了大量应用程序和解决方案来满足其 ERP 需求。这导致了两大挑战——不一致的数据孤岛和无法支持业务需求的遗留基础设施——从而造成数据蔓延和数据孤岛。家乐福西班牙在\
  \ Google Cloud 上现代化了其 SAP，这提供了一个绝佳机会来标准化和整合其数据流及后台业务流程 [12]。在 4 个月内，家乐福便利用混合云基础设施实现了第一阶段的投入运营。借助基于云的\
  \ ERP 基础设施，家乐福西班牙能够整合并集成 2,000 多个数据流，利用可扩展的基础设施实时收集、分析并处理信息，这为以数据为中心的基础设施奠定了基础骨干。这种现代化还使家乐福能够快速扩展\
  \ ERP 功能，集成物联网 (IoT) 和机器学习能力，用于预测性分析，如需求预测。\n\n*   **现代化电商平台以实现无缝扩展并交付新能力**\n\n\
  \    家乐福西班牙关注的另一个关键优先事项是现代化其电商平台和基础设施。现有的电商平台是单体架构，基于老旧的本地基础设施。该平台的可用性和弹性是一个巨大的隐患，尤其是在电商流量的季节性高峰期间，因为公司必须仔细评估并推测本地基础设施的容量。家乐福西班牙将其电商平台重新部署到\
  \ Google Cloud，同时利用现代开源容器技术 Kubernetes，这有助于根据需求无缝部署和扩展。这个现代化平台还使家乐福西班牙能够快速向客户交付新能力，而无需将资源分流到构建、配置、扩展和管理基础设施上。转型成果显著，家乐福西班牙能够无缝扩展以适应并维持每秒\
  \ 20,000 多次操作的性能，即使在达到正常工作负载 4 倍的极端流量高峰时也是如此。云原生平台还允许他们部署各种客户应用程序，从库存管理到“点击自提”。\n\
  \n*   **为未来构建以云为中心的基础**\n\n    云迁移对家乐福的 IT 团队产生了重大影响，特别是对他们的工作方式。例如，开发人员能够专注于代码并快速实验，而无需解决基础设施容量挑战和环境一致性问题；运维团队采用了现代云原生实践，如\
  \ IaC，可在几分钟内对环境进行快速简便的更改。这极大地提高了生产力，团队能够构建并迭代多个更新，从而提供更高质量的服务。\n\n## 家乐福的 IT 架构战略\n\
  \n家乐福的云转型旨在从三个层面优化组织——基础设施、应用和安全现代化。为了最大化 Google Cloud 采用的效益，家乐福的云转型历程结合了 Google\
  \ V1 和 Google V2：前者专注于利用 IaaS 产品进行基础设施现代化，后者旨在利用 PaaS 产品进行应用转型。这使家乐福能够通过以下方式优化资源分配并利用每种环境的独特能力：\n\
  \n*   **基础设施现代化**：为提高运营效率，家乐福从物理服务器过渡到无服务器架构，采用 DevOps 流程，从批处理迁移到实时处理，并实现了部署和测试程序的自动化。这些变更降低了运营复杂性并提高了可扩展性。\n\
  \n\n\n\n# 家乐福云转型案例研究\n\n## 初始转型策略\n\n### 应用转型\n家乐福专注于从单体架构向微服务架构迁移，采用**面向服务的架构（SOA）**方法，并在应用层面从计划流程转向实时流程。通过将应用拆解为更小、更模块化的组件，他们增强了灵活性、敏捷性以及单独扩展各个服务的能力。\n\
  \n### 安全现代化\n为保证其应用和服务在混合云环境中的安全，家乐福实施了零信任模型，基于用户身份和上下文授予访问权限。公司还将控制权从网络层移至应用层，强化了安全措施。这种方法提供了对访问权限的细粒度控制，减少了攻击面并提高了数据保护水平。\n\
  \n## 六层蓝图设计\n家乐福定义并采用了一种开放平台策略，配合解耦的六层蓝图设计，可支持广泛的应用架构和需求。如下图 [13] 所示：\n\n![图 7.5\
  \ – 家乐福的六层蓝图设计](img/B18893_07_5.jpg)\n\n**图 7.5 – 家乐福的六层蓝图设计**\n\n## 2019 年底的成果\n\
  到 2019 年底，云转型战略为家乐福带来了令人瞩目的成果。\n\n### 规模与敏捷性\n西班牙电商业务从本地单体架构现代化迁移至云原生微服务架构，使家乐福在黑色星期五等季节性高峰期拥有了极致的扩展能力。这还使公司能更快地交付新的客户体验。例如，家乐福实现了约\
  \ 400 多次新功能部署，而本地环境仅为 52 次。另一个显著成果是谷歌云上的数据湖现代化：本地数据湖上限为 700 TB 且难以扩展，而谷歌云上的数据湖每日维持\
  \ 2 TB 的增量数据量，同时服务 80 多个应用和每月 1 亿次请求。\n\n### 上市速度\n利用云平台的敏捷性和规模，家乐福能在几分钟内完成算力和平台资源的供给，而采购、上架和配置服务器通常需要长达\
  \ 3 个月。另一大优势是云原生环境中对容量需求可以“随意悲观”或“过度乐观”。在首次新冠疫情封控期间，家乐福利用全球云数据中心，跨其运营的多个国家快速推出了一系列“一次性”网站和服务，为客户提供生活必需品。疫情结束后这些服务即下线。一个典型例子是\
  \ *Les essentials Carrefour* 网站，它根据位置提供固定日期的食品包裹送货上门服务，并保证基本食品的供应 [14]。\n\n### 专注创新\n\
  谷歌云平台为家乐福提供了最前沿的现代技术。更重要的是，这意味着公司能以更低的风险、成本和精力快速试验和测试这些能力。家乐福利用预训练的 AI 模型（如 Vision\
  \ AI）融入图像识别等功能。谷歌在开源目标上是家乐福的协同合作伙伴，公司受益于多项开源贡献，如 Dataflow（基于 Apache Beam）、Google\
  \ Kubernetes Engine（基于 Google Kubernetes）、TensorFlow，并遵循 **云原生计算基金会（CNCF）**。例如，创新的核心在于谷歌的技术领导力：谷歌工程师发现并修补了微处理器安全漏洞——**Spectre\
  \ 和 Meltdown**——以及 Heartbleed 和 Rowhammer 等其他漏洞，且在其所有云数据中心实现了零停机修补。\n\n### 弹性与高可用性\n\
  凭借云中各项服务基于 SLA 的可用性，家乐福获得了更好的应用栈可用性和弹性。例如，在本地为三层应用实现三个 9（99.9%）的可用性，意味着整个栈必须全冗余，且每年最大停机时间不足\
  \ 9 小时，这极难实现且成本高昂。而在云环境中，家乐福以有限的精力和投入即达成了这一目标。\n\n### 云上可持续发展\n可持续发展是家乐福的核心基因，与谷歌的合作确保家乐福能快速实现其可持续发展目标。传统数据中心的平均**电源使用效率（PUE）**得分约为\
  \ 1.5，而谷歌云节能数据中心的平均 PUE 得分为 1.1。通过对多种云服务选择相关的碳排放透明化，家乐福能准确测量其碳足迹总量，追踪云项目的排放概况，并在报告和披露中纳入碳排放数据，助力其达成\
  \ ESG 目标。\n\n## 下一阶段：以客户为中心与数据中心迁移\n凭借云迁移的初步成功，家乐福进入了云上数字化转型的下一阶段，聚焦于以客户为中心。为加速向云过渡，团队开始关闭多个本地数据中心并将应用迁移至云端。以下是家乐福实施的一些关键转型策略：\n\
  \n## 关键转型策略（下一阶段）\n\n### 提升并迁移 VMware 工作负载\n家乐福拥有大规模的 VMware 环境，承载着各类应用工作负载。重构或重新架构所有这些应用意味着团队需投入大量时间精力，同时面临应用兼容性和集成风险。为加速云转型，家乐福利用\
  \ Google Cloud VMware Engine（一种原生谷歌云服务）无缝迁移并在 GCP 上运行 VMware 工作负载 [15]。该方案还提供灵活的按需容量，并与现有本地应用保持完全的运营兼容性和一致性。这使家乐福能利用云基础设施优化资源与成本，同时实现效率提升。在云环境中，家乐福采用了\
  \ FinOps 最佳实践，如在不需要时自动关闭非生产环境。通过这一举措，家乐福将总拥有成本降低了 30%。\n\n### 数据与分析转型\n作为其云转型使命的一部分，家乐福团队将目光聚焦于核心使命——以客户为先。为在更深层次上了解客户，家乐福利用谷歌云数据生态系统转型并现代化其数据平台（内部称为达尔文项目）。达尔文项目为海量数据集提供了单一、统一、安全且透明的事实来源。Google\
  \ BigQuery 成为该数据平台的基石，为公司数据科学家提供可靠的数据访问，助力开发更智能的 AI/ML 模型。此外，这使团队能构建与电商集成的推荐引擎，为客户提供个性化购物体验。转型成果显著：\n\
  \n*   凭借现代 AI/ML 能力的采用和全新个性化推荐引擎，家乐福能为客户定制并交付个性化购物体验，在新冠疫情期间在线收入实现了令人印象深刻的 60% 至\
  \ 70% 增长。\n*   其数据平台扩展以满足业务需求与增长。\n\n\n\n\n\n# 家乐福的数字化转型\n\n- 家乐福利用 Looker——一个用于商业智能、数据应用和嵌入式分析的企业平台——不仅实时可视化和分析数据，还通过提供基于数据的洞察来改善与供应商和合作伙伴的协作。\n\
  \n- **以 API 为主导的集成**：随着家乐福构建数字服务和平台，为跨渠道客户提供顺畅无缝的在线体验，消费者需求增长到数十亿次 API 请求。为了更好地应对流量高峰并提供可扩展、低延迟的体验，家乐福利用\
  \ Apigee 标准化 API 集成和管理。Apigee 平台使开发人员能够构建、管理、扩展和保护 API，同时充当后端服务 API 的门面，提供安全性、速率限制、配额和可见性。这也大大提高了开发人员的工作效率，因为他们可以专注于构建服务，而无需担心服务机制。\n\
  \n- **以可持续发展为核心的数字转型**：与 Google Cloud 的合作使家乐福得以实现其可持续发展目标。例如，仅通过将工作负载从物理数据中心迁移到\
  \ Google Cloud VMware Engine，家乐福就将能耗降低了 35%。家乐福与 Google Cloud 共同创建的另一项关键举措是家乐福的*生鲜品类解决方案*。该解决方案使当地门店能够根据需求更好地调节和管理生鲜订单。这有助于减少食物浪费，同时让消费者及时获得合适的生鲜产品。\n\
  \n## 展望未来——家乐福 2026 年数字零售战略\n\n家乐福目前正在制定 2026 年数字零售战略，这是其自 2018 年以来深度数字化转型的成果。凭借以数据为中心、数字优先的方针，家乐福的目标是到\
  \ 2026 年将其电子商务**商品交易总额**（**GMV**）增至三倍，达到 100 亿欧元，届时数字业务将为经常性营业利润额外贡献 6 亿欧元。为实现这一目标，家乐福计划将数字投资增加\
  \ 50%，同时到 2030 年实现其电子商务活动的碳中和——比家乐福集团 2040 年的整体目标提前 10 年。以数据为中心、数字优先的战略将取决于四个关键驱动因素：\n\
  \n- **加速电子商务**：家乐福打算通过创新的数字形式来巩固其零售领导地位，例如极速配送（3 小时内送达）、即时零售（15 分钟以内）、社交电商、B2B 和直播购物。\n\
  \n- **加强数据和零售媒体**：通过*家乐福链接*平台，家乐福预计将从其丰富的第一方和第三方数据中提取价值。例如，家乐福的产业合作伙伴可以在多个渠道（门店、移动应用和网站）开展营销活动，获得端到端的可见性，并衡量影响。\n\
  \n- **金融服务数字化**：家乐福打算利用其在金融和保险服务领域的强大影响力和专业知识，将金融服务活动、产品和服务数字化，为 B2C 和 B2B 客户提供新能力，如**先买后付**（**BNPL**）、小额信贷和联名保险。\n\
  \n- **通过数字技术深度变革传统零售**：家乐福已将其 30% 的应用迁移到云端，并计划到 2026 年全面云化。通过采用以数据为中心、数字优先的战略，家乐福将推动其业务流程的数字化，通过运营效率和个性化来改善客户体验。\n\
  \n在回顾了家乐福的数字化转型及其对零售市场的更大影响之后，让我们简要探讨温迪如何改变消费者体验并颠覆餐饮行业。\n\n# 温迪重塑消费者体验\n\n温迪总部位于美国俄亥俄州都柏林，是一家美国快餐连锁店，也是世界第三大汉堡快餐连锁品牌。作为\
  \ 50 多年前率先推出取餐窗口的餐饮品牌，温迪始终走在创新的前沿。1970 年，温迪创始人戴夫·托马斯（Dave Thomas）在其独立式温迪餐厅中设想了一个新的设计元素——*取餐窗口*，这是一项突破性创新，彻底改变了客户体验。温迪的第一个现代得来速也是催化剂，推动温迪从一家拥有四家门店的本地汉堡连锁店成长为蓬勃发展的全球品牌。在设计和创新的传承基础上，温迪最近宣布了一项全球餐厅设计新标准——*全球下一代*——该标准有望通过现代数字技术提升其餐厅的客户体验，并改善员工的体验\
  \ *[16]*。\n\n## 全球下一代\n\n2023 年 2 月，温迪公布了其 2030 年气候目标。作为**快餐服务餐厅**（**QSRs**）的领导者，温迪的目标是将其范围\
  \ 1 和范围 2 的温室气体绝对排放量以及范围 3 的排放量减少 47% *[17]*。为实现这一雄心勃勃的目标，关键行动之一是为其新餐厅建设推出温迪全球下一代设计，该设计比传统温迪标准餐厅节能约\
  \ 10%。作为全球下一代战略的一部分，温迪的每个业务职能部门（从运营到技术）都将参与设计和战略制定，以帮助满足日益增长的客户需求和期望。一些关键设计特点包括：为配送司机提供便捷、更快的取餐窗口；提供专门的移动订单取餐选项，包括专用停车位和货架；重新设计厨房以提高销售点效率和加快订单履行；优化基础设施以减少能源消耗；以及大力投资下一代技术，以应对数字业务和创新的增长\
  \ *[18]*。\n\n## 通过技术重塑餐厅体验\n\n温迪一直处于数字化转型的前沿，通过大胆重塑客户体验来革新餐饮行业。从移动点餐和非接触式支付，到个性化忠诚度计划和\
  \ AI 驱动的推荐，温迪一直在利用技术创造无缝、愉悦的体验，以满足现代食客不断变化的需求。通过与尖端技术提供商的战略合作，温迪推出了一系列创新解决方案，改变了顾客点餐、互动和享受餐食的方式。让我们回顾一下温迪如何利用新兴技术进行创新的几个亮点。\n\
  \n### 利用生成式 AI 重塑得来速体验\n\n\n\n\n# Wendy’s – 变革得来速与餐厅体验\n\n随着 75% 至 80% 的 Wendy’s\
  \ 顾客偏爱得来速，提供无缝的得来速点餐体验一直是一项挑战。基于与 Google 的技术合作，Wendy’s 采用现代生成式 AI 技术开发了一个突破性的 AI\
  \ 平台——Wendy’s FreshAI。FreshAI——自动得来速点餐系统——将带来与 Wendy’s 店员互动般自然的体验。目标是简化得来速点餐流程，并缩短顾客在得来速车道中的等待时间。菜单不断变化且有数千种定制可能性，训练\
  \ AI/ML 模型可能是一项难以逾越的挑战。在此案例中，Wendy’s 利用多种生成式 AI 能力来定制和训练大语言模型，使其包含 Wendy’s 及其顾客独有的短语、同义表达和术语，从而提供无缝的餐厅体验。例如，JBC\
  \ 指 Junior Bacon Cheeseburger（小培根芝士汉堡），而大杯巧克力奶昔指大杯巧克力 Frosty。Wendy’s 还将 AI 驱动的语音助手与可视化订单显示屏配对，让顾客对订单准确性更有信心。通过创新的餐厅技术，Wendy’s\
  \ 旨在消除得来速点餐和数字订单取餐体验中的复杂性，同时让店员能够专注于提供新鲜、快速且优质的食物 *\\[19\\]*。\n\n## 通过数据释放价值\n\n\
  作为社会，仅在过去十年，我们已从数据稀缺转变为数据过剩。对企业而言也是如此，如今大多数企业面临的挑战是数据利用不足——即把正确的数据用于正确的用途。Wendy’s\
  \ 曾可获取大量第一方和第三方数据，而数据是其释放全新顾客、店员和餐厅体验愿景的核心。Wendy’s 利用数据消除消费者与其餐厅体验之间的摩擦。例如，了解消费者是希望尽快拿到食物还是喜欢尝试新事物，对于提供最佳体验至关重要。对数据的洞察使\
  \ Wendy’s 能够通过个性化优惠提供差异化结果。同样，Wendy’s 利用来自其加盟店和业务职能部门的数据，改善加盟商和餐厅团队的运营。\n\n## 偏向云端的混合云\n\
  \n与大多数企业一样，Wendy’s 拥有庞大的本地数据中心足迹，支持其关键任务应用。Wendy’s 的 IT 战略，尤其是在交付新能力时，一直采用移动优先和云优先设计。云优先战略为\
  \ Wendy’s 带来优势：尽早利用前沿技术、创新、更快实验，并以低得多的成本和风险更快交付新能力。Wendy’s 与 Google Cloud 的合作使公司能够通过云原生数据分析、预训练\
  \ AI/ML 模型以及对混合云的支持，为客户提供无缝体验。使用合适的工具和技术配置基础设施不再是主要瓶颈，这赋能业务，并让 Wendy’s 团队专注于核心业务职能。\n\
  \n## 边缘计算实现即时客户体验\n\nWendy’s 拥有独特优势，可获取分布在多个地点的大量且多样化的数据。在正确的时间处理正确的数据，并在正确的地点激活它，对长期成功至关重要。虽然一些应用可从历史数据分析中受益，但某些应用需要实时分析。Wendy’s\
  \ 将这些分析称为“相关时间”。凭借其分布式地点，Wendy’s 通过边缘计算释放了新价值。正如 Wendy’s 所说，快餐店（QSR）的圣杯是 POS 系统必须能够在餐厅内、云端或边缘运行，因为这为几乎任何地方——城市、乡村和偏远地区——开设\
  \ Wendy’s 餐厅提供了巨大灵活性。传统 POS 旨在接收订单并处理订单。然而，在当今数字世界中，这还不够。借助 Google Anthos——一种混合云解决方案——Wendy’s\
  \ 可以设想并在边缘执行 AI 功能，以提供即时且个性化的客户体验 *\\[20\\]*。\n\n# Capital One – 通过技术变革银行业\n\nCapital\
  \ One 是一家美国银行控股公司，总部位于弗吉尼亚州麦克莱恩，业务主要在美国。按**管理资产总额**（**AUM**）衡量，它是美国前 10 大银行之一，也是\
  \ Visa 和 Mastercard 信用卡的第三大发卡机构。Capital One 最初是一家以信用卡为主的单线银行，随后将业务扩展至汽车贷款，并于 2005\
  \ 年进入零售银行市场。自 20 世纪 90 年代以来，Capital One 一直是金融服务行业的颠覆者，当时它迅速意识到信用卡服务行业几乎没有差异化。当业内大多数企业采用*一刀切*的统一定价方法时，早在\
  \ 90 年代，Capital One 就利用数据的力量，并使用基于公开信用和人口统计数据的统计模型来了解其消费者群体，并定制信用卡产品以满足客户需求——将合适的产品提供给合适的客户。\n\
  \nCapital One 在前沿引领数字创新，这从其收购战略到技术采用都显而易见。从收购角度看，Capital One 通过一系列收购增强和巩固了其数字优先战略，例如\
  \ ING Direct，以提供高价值数字银行服务；Bankons，一家创建基于地理位置的优惠的移动初创公司；Bundle，一家支出数据分析公司；Sail，一套移动销售点刷卡系统；Confyrm，一项数字身份和欺诈警报服务；以及\
  \ Wikibuy，一款购物比价应用 *\\[21\\]*。Capital One 也是云计算的早期采用者之一，并一直处于数字化转型的前沿。\n\n## Capital\
  \ One 的云转型之旅\n\nCapital One 是最早试验和利用现代云技术推进其数字化转型目标的金融服务公司之一。Capital One 创立于这样一种信念：银行业将被数字技术彻底变革；其战略一直是将领先科技公司的技术创新与其风险管理能力相结合，通过使用包括\
  \ AI/ML 和数据在内的现代技术来构建并交付卓越客户体验。Capital One 拥有超过 6500 万个账户，不仅仅是一家信用卡公司或银行。其商业模式的基础是一家技术驱动型公司。Capital\
  \ One 很早就意识到，其客户绝大多数通过数字渠道互动来申请产品和服务，并反过来通过数字渠道获得服务。例如，Capital One 客户使用其移动应用的频率是网页应用的两倍。为迎合其精通数字技术的消费者，Capital\
  \ One 采用了云优先战略，云使其能够为客户构建出色的银行应用，而不是将注意力和投资转移到建设数据中心基础设施上。\n\nCapital One 基于以下原则构建其\
  \ IT 战略：\n\n* 大规模投资于顶尖工程人才\n* 利用开源软件栈并协作构建软件\n* 使用敏捷方法交付软件并实施 DevOps\n* 采用 API 优先和基于微服务的架构\n\
  * 利用大数据和快速数据进行分析\n\n\n\n\n\n在 2010 年代初，Capital One 以实验模式利用云来测试其能力，并迅速在企业范围内推广云。该公司将云技术视为一种颠覆性力量，使其能够创新并专注于通过技术提供卓越的客户体验。Capital\
  \ One 确定了云的六项关键转型优势 [22]：\n\n*   **速度**：云能够按需、即时地配置基础设施，带来巨大的生产力提升和上市速度。\n*   **弹性**：面对波动的客户需求，云计算能够动态扩展基础设施容量，相比传统的本地部署具有显著优势。\n\
  *   **可用性**：随着 Capital One 努力通过数字渠道提供服务，高可用性是基本要求。云技术提供了多层弹性，这在本地环境中实现起来极其困难和昂贵。\n\
  *   **安全性**：在数字渠道运营会面临网络安全威胁。然而，利用云平台的纵深防御安全机制，Capital One 能够在细粒度级别管理安全性。\n*   **技术访问**：云中的创新速度是\
  \ Capital One IT 战略的关键要素，它提供了亟需的现代技术访问途径。\n*   **人才**：Capital One 对云的积极态度帮助其寻找并吸引行业顶尖人才，以提供前沿解决方案。\n\
  \nCapital One 的云转型之旅经历了四个采用阶段 [24]：\n\n![图 7.6 – Capital One 的云转型之旅和阶段](img/B18893_07_6.jpg)\n\
  \n图 7.6 – Capital One 的云转型之旅和阶段\n\n让我们更详细地探讨这些云转型阶段。\n\n### 实验阶段\n\n2013 年至 2014\
  \ 年间，云技术仍处于起步阶段，Capital One 开始了与 `AWS` 合作的公有云之旅，主要目的是试验技术和运营模式。在这一阶段，Capital One\
  \ 的创新实验室——*Capital One 实验室*——创建了小规模学习环境，以证明技术和工具的适用性。Capital One 实验室的使命陈述如下：*我们探索新兴技术与金融的交汇点*。由于投入规模较小，只有少数软件工程师参与了这一实验阶段。试验成功后，建议继续使用公有云，按需、即时地配置基础设施容量，并利用其高可用性和弹性来加速创新步伐。\n\
  \n### 基础阶段\n\n大约在 2015 年，Capital One 在 `AWS` 上部署了生产就绪的云原生应用，这标志着一个巨大的里程碑。这一阶段意味着对大量\
  \ IT 员工进行培训和技能提升，使其能够在云原生环境中开发和工作。由于 Capital One 在本地数据中心也有大量投资，确保云应用能够与本地环境无缝集成以降低应用交付流程中的摩擦至关重要。建立\
  \ `DirectConnect` 使 Capital One 能够将数据中心从本地扩展到云（`AWS` 数据中心），从而帮助所有新工作负载向云优先架构过渡。在这一阶段，Capital\
  \ One 还建立了 `CCoE`，由云原生专家团队组成，包括开发人员、解决方案架构师、产品团队和技术客户经理。`CCoE` 在定义云工程模式和最佳实践方面发挥了重要作用，并与\
  \ `AWS` 合作，同时帮助 Capital One 各团队进行交叉交流与培训。在 `AWS` 年度大会 `ReInvent 2015` 上，Capital\
  \ One 分享了其愿景，即将数据中心足迹从 2014 年的八个减少到 2016 年底的五个，并在 2018 年进一步减少到仅三个。这一宏大愿景和目标促使 Capital\
  \ One 专注于利用公有云来简化基础设施、推动创新，并将节省的成本回馈到业务中：\n\n![图 7.7 – Capital One 云之旅的基础要素](img/B18893_07_7.jpg)\n\
  \n图 7.7 – Capital One 云之旅的基础要素\n\n### 迁移阶段\n\n接下来的几年标志着 Capital One 的“大迁移”阶段。Capital\
  \ One 团队继续与 `AWS` 及众多合作伙伴携手，协助建立模式和流程，以应对大规模云迁移。Capital One 战略性地采用了 `6 R` 迁移方法——*重新托管*、*重新平台化*、*重构*、*保留*、*回购*\
  \ 和 *退役*——以支持其摆脱数据中心业务的愿景。例如，对于只需要进行小幅更改且差异化不大的应用程序，Capital One 倾向于采用 *重新托管*（直接迁移）策略；而对于具有重大业务影响的应用程序，则采用\
  \ *重新平台化* 和 *重新架构*。在这一阶段，Capital One 还通过利用 `AWS` 平台产品（如 `Amazon Simple Queue Service`（`SQS`）用于消息队列的重新平台化，以及\
  \ `Amazon Relational Database Service`（`RDS`）用于传统事务性数据库的重新平台化）受益于云技术的进步，从而降低了扩展、打补丁、备份、升级等管理复杂性，同时也释放了更高的性能效率。\n\
  \n### 创新阶段\n\n随着 `AWS` 足迹的扩大，以及 Capital One 具备多年的云成熟度，这一阶段标志着向创新迈进。Capital One 利用云平台创新银行业的未来，并利用\
  \ `AI/ML` 能力进行欺诈检测，通过移动助手（如 `Eno`）提供个性化体验。这一阶段还使 Capital One 能够优化其云投资，主要目的是提高性能和成本效率。早期的一些优化工作包括调整应用基础设施、实施基础设施自动化，以及在\
  \ `PaaS` 产品（如无服务器产品）上重构应用。以下是一些关键优化：\n\n*   检测 `AWS` 上运行的应用工作负载的未使用容量，并优化 `Linux`\
  \ 发行版。这有助于减少计算基础设施的使用量和成本：\n\n    ![图 7.8 – 云中平均计算资源使用量及其优化潜力的示意图](img/B18893_07_8.jpg)\n\
  \n    图 7.8 – 云中平均计算资源使用量及其优化潜力的示意图\n\n*   实施 `IaC`，在云中动态即时地创建和拆除环境。\n\n*   将应用从传统基础设施（基于容量）重新平台化到无服务器\
  \ `PaaS` 产品（基于使用量）。例如，在计算实例（`EC2`）上部署服务意味着 Capital One 必须为*盒子里的所有东西*付费，无论该服务是否在使用中，同时还要管理基础设施：\n\
  \n    ![图 7.9 – 基于基础设施的应用架构](img/B18893_07_9.jpg)\n\n    图 7.9 – 基于基础设施的应用架构\n\n\
  将此应用和服务重构到无服务器平台（`Lambda`）意味着 Capital One 只需在服务运行时付费：\n\n![图 7.10 – 基于平台和无服务器的应用架构](img/B18893_07_10.jpg)\n\
  \n图 7.10 – 基于平台和无服务器的应用架构\n\n## Capital One 的人才招聘策略\n\n\n\n\n# Capital One 的云转型与移动应用重构\n\
  \n## 将 IT 员工提升为云专家\n\n在本节中，我们将简要探讨 Capital One 如何将其才华横溢的 IT 员工（他们主要是内部部署技术专家）提升为云主题专家。为了寻求变革，Capital\
  \ One 的领导层制定了一个“独角兽”职位规格，并希望从市场上招聘顶尖的云人才。这根本行不通，因为那种“独角兽”根本不存在。Capital One 迅速意识到，他们可以转型已有的极具技能、积极主动且敬业的人才。事后看来，Capital\
  \ One 阐述了其采取的、效果显著的步骤 *[25]*：\n\n1.  **接受**：这是关键的第一步，Capital One 必须说服其才华横溢的工程师和领导者，他们能够学习现代云技能——在本例中是\
  \ AWS——并能够提升技能。灌输适当的自信、创造学习环境、规划清晰路径、给予充足时间以及提供激励，这些就足够了。\n\n2.  **培训**：Capital\
  \ One 团队迅速开始通过官方课堂培训为团队提供学习机会。\n\n3.  **动手实践**：改变极其困难，违背人类心理。然而，创建一个无责备后果的正确环境可以成为强大的变革推动者。Capital\
  \ One 为工程师提供了沙箱环境，让他们在云端摸索实践，从而帮助创建了扎实的学习环境。\n\n4.  **两个披萨团队**：Capital One 组建的第一个工程团队由来自不同专业领域的\
  \ IT 人员组成，如网络、数据库、系统管理员、应用工程师、存储管理员和安全工程师。这非常合理，因为云技术模糊了这些职位角色之间的界限，而在传统的内部部署环境中，这些角色通常是截然不同的。\n\
  \n5.  **引入外部专业知识进行交叉融合**：必须帮助内部 IT 与一些外部辅导和指导进行交叉融合。这就是合作伙伴关系能带来显著优势的地方。Capital\
  \ One 引入了经过专业认证的 AWS 合作伙伴专家，协助初始推出。这产生了变革性的效果，Capital One 团队通过观看、提问和亲自实践来学习，为未来做好准备。\n\
  \n6.  **落地实施**：为两个披萨团队设定构建和交付真实生产负载的目标，这是关键一招。此处的目标是找到一个重要但不过于关键任务的工作负载。关键在于确保该工作负载不需要过多定制云构建模块（本例中为\
  \ AWS），因为这起初可能成为技术障碍。\n\n7.  **以细胞分裂方式扩大学习**：一旦第一个团队交付成功成果，就该分裂这个团队——他们现在拥有必要的经验——变成两个四人团队，同时每个团队再引入四名工程师。这有助于通过动手实践和在职学习来扩大学习。Capital\
  \ One 重复这一过程，直到拥有数百名熟练的云工程师，并产生了大量全新云应用的额外副作用。\n\n8.  **云认证**：Capital One 发现工程师认证与在\
  \ AWS 上交付的应用数量之间存在直接相关性。认证流程确保 Capital One 的工程师理解 AWS 语言，并对技术有更广泛的理解。\n\n9.  **扩大认证与领导力**：Capital\
  \ One 主张让 10%的工程师获得认证并成为平台倡导者，达到临界质量后网络效应便会生效。培养和激励工程师获得认证产生了光环效应，这不仅有助于内部认知，也改善了外部形象。\n\
  \n10. **认可与奖励**：Capital One 的云（AWS）认证被视为一项伟大成就。公开认可和奖励工程师对团队士气和动力产生了巨大影响。\n\n11.\
  \ **挑战自我**：作为领导者，身体力行也很重要。在 Capital One，领导层主动接受认证挑战，以获得对 AWS 术语更广泛、更深入的理解。\n\n12.\
  \ **重新定义职位系列**：云产生了深远影响，这不仅是技术领域的转型，也涉及业务职能、流程和运营。Capital One 重新定义了职位组合以反映这一点。\n\
  \n这一整体战略帮助 Capital One 不仅从市场上获取了合适的人才，还通过提升技能实现云转型，激活了内部人才。现在，让我们探讨 Capital One\
  \ 如何构想并开创面向消费者的创新移动体验。\n\n## 在云上重构 Capital One 移动应用\n\nCapital One 云转型工作的巅峰是其最大的面向客户的移动应用的重构。这是一个雄心勃勃的项目，因为该移动应用拥有数千万用户。这远不止简单的“迁移”，而是需要对整个应用进行全面重构，包括集成、编排系统和运维支持工具。构建云原生软件往往是一套全新的游戏规则，因为它要求思维从传统软件开发转向云原生\
  \ DevSecOps *[26]*。\n\n使命很简单：Capital One Mobile 必须能够跟上消费者需求，由随产品需求而动的基础设施提供支持。\n\
  \nCapital One 拥有一大优势，即移动应用现有架构的大部分已“云就绪”。例如，该应用利用了基于微服务的 API 驱动架构（Capital One 称之为微体验\
  \ API——稍后详述）、用于服务端负载均衡的 Netflix Zuul OSS、用于服务容错的 Netflix Hystrix OSS、作为服务注册表的 Netflix\
  \ Eureka，以及用于运维自动化的 Ansible。这意味着 Capital One 团队只需进行微调，即可确保充分利用 AWS 的云原生能力 *[27]*。例如，从在内部部署的单一封闭基础设施中部署服务组件，转变为在\
  \ AWS 的分布式基础设施上部署，可以实现更好的扩展性和容错性。\n\nCapital One 创造了**体验 API**（**xAPIs**）和**微体验**的概念。xAPIs\
  \ 与常规 API 的区别在于，xAPIs 专注于交付用户体验流程，而常规 API 可能指服务于资源或数据模型。微体验本质上是多个 xAPIs 的集合，可放入单个可部署单元中。例如，客户点击*兑换奖励*可以是一个微体验，它可包含多个微体验\
  \ API。\n\n![图 7.11 – Capital One 的移动应用架构](img/B18893_07_11.jpg)\n\n图 7.11 – Capital\
  \ One 的移动应用架构\n\n在探讨了 Capital One 的移动应用架构后，让我们回顾一下他们早期云 DevOps 工作中的挑战和经验教训。\n\n\
  ### DevOps 挑战与经验教训\n\n以下是我们从 Capital One 大规模云转型工作中总结出的一些云 DevOps 最佳实践：\n\n*   尽可能利用云原生能力以提高效率。例如，Capital\
  \ One 用 AWS Route53 替换了企业 GTM 解决方案，并将数据存储从内部部署的 RDBMS 迁移到 RDS。\n\n*   为基于服务的部署开发部署模式，而非全栈部署，以提高微发布和增量部署的频率。\n\
  \n\n\n* 利用**自动扩缩组**（**ASGs**）执行蓝绿部署。这对于确保真实环境测试在出现问题时不会产生较大影响至关重要。\n* 构建一个预置了所有应用程序和服务器级依赖项的黄金镜像。\n\
  * 将一切自动化——构建 DevOps 和 SRE 最佳实践，同时利用自动化减少不必要的人为接触点和错误。\n* 拥有稳健的性能测试计划有助于识别云环境中可优化的机会。这包括在不同计算系列和存储类型上测试软件，以获得最佳的性价比。\n\
  * 将服务器基础设施视为“牲畜”而非“宠物”。\n* 基于扩缩事件或性能指标持续调优应用软件，往往能暴露应用程序的差距和漏洞，而在本地环境中，过度配置的硬件或容量可能掩盖了这些问题。\n\
  * 利用模拟测试软件进行按需模拟测试。Capital One 采用了基于 Mountebank 开源软件的解决方案。\n* 在云中，为功能而构建，为韧性而设计架构。\n\
  \n### 全面拥抱云\n\n2020 年，Capital One 坚守目标，关闭了八个本地数据中心，并完全迁移到云端。在此过程中，它回收了 103 吨铜和钢，同时在云端运行着数以千计的应用程序\
  \ *\\[28\\]*。Capital One 在行业中处于独特地位，作为一家数字银行运营，仅在少数几个州保留实体分行，同时通过遍布全国的 40,000 台\
  \ ATM 提供其服务。此外还有 Capital One 咖啡馆，作为社区中心，Capital One 也几乎可以在任何地方为客户提供技术访问。Capital\
  \ One 是一个成熟的例子，证明了金融服务等高度监管行业中的财富 100 强公司，可以将传统的本地生态迁移到云端，并交付由数据和 AI 驱动的全新客户体验。\n\
  \n以下是云如何加速 Capital One 创新的一些关键亮点：\n\n* 首先，实现的关键优势之一是能够几乎即时地以几乎无限的规模访问计算资源，同时还能灵活地按使用付费。这把开发环境的前置时间从大约\
  \ 3 个月缩短到几分钟。应用程序现在可以按需使用或多或少的资源，以维持和满足业务需求。\n* 退出数据中心帮助 Capital One 利用云规模经济实现了更低的**总体拥有成本**（**TCO**）。\n\
  * Capital One 从按季度和月度更新应用程序，转变为每天多次向生产环境发布变更，从而加快了上市速度，更快地交付新功能。它还观察到事务错误数量减少了 50%，关键事件解决时间也缩短了。\n\
  * Capital One 的技术人员得以随时访问现代技术，并利用实时数据流、机器学习以及云的力量来解决独特的业务挑战。\n* 云为其系统和应用程序实现了极高的可用性和韧性。大多数应用程序转向了双活架构，并实现了自动化故障转移，无需付出太多努力，也无需投入大量基础设施来支持。例如，如果云中的一个可用区发生故障，工作负载可以在该区域内的另一个可用区中移动或继续服务；如果整个云区域发生故障，则可以在新的云区域中启动相同的工作负载。这在传统数据中心范围内几乎是不可能实现的。Capital\
  \ One 在测试中观察到灾难恢复能力提升了 70%。\n* 云已成为 Capital One 以客户为中心的创新的支柱。一个典型的例子是 Eno——完全使用\
  \ Amazon EC2、Lambda、DynamoDB 和 Kinesis 等云技术开发的智能助手。Eno 的主动洞察可帮助 Capital One 客户保障账户安全：留意异常信用卡收费、跟踪支出，并在发现更优优惠时发送有用的提示。另一个例子是\
  \ Capital One Shopping，这是一个免费工具，通过比较各网站的价格、主动寻找可用优惠券，并提供价格跟踪和提醒来帮助购物者省钱。云使 Capital\
  \ One 能够快速尝试新技术和新产品，而无需大量前期投资和风险。\n* 向现代架构和流程（如 RESTful API、微服务和 DevSecOps）的转变，使\
  \ Capital One 在业务上更加敏捷。\n\n总之，Capital One 的案例研究很好地展示了企业如何利用云作为催化剂来推动业务目标的实现。通过利用云的可扩展性、敏捷性和成本效益，Capital\
  \ One 得以更快地交付创新产品和服务，改善客户体验，并在金融行业中获得竞争优势。Capital One 的云之旅证明了云计算和开源在推动数字时代业务增长和成功方面的巨大潜力。\n\
  \n# 总结\n\n正如我们在本章中所探讨的，云计算已从一种服务模式演变为现代技术演进的中心。这为企业和初创公司提供了颠覆行业的巨大机遇。从某种意义上说，云重塑了公平竞争的环境，客户体验成为蓬勃发展的关键。从我们探索的云转型之旅和业务成果中，让我们思考一些共同的要点。\n\
  \n组织愿景极为关键，而在许多转型任务中，它往往被忽视。通过云技术对企业进行数字化转型也不例外。我们从 Airbnb（酒店行业）、家乐福（零售业）和 Capital\
  \ One（金融服务业）等组织为其团队设定的清晰目标中可以看出这一点。这为整个组织围绕一个愿景团结一致定下了基调。\n\n从案例研究中可以看出，沟通是极其重要的一个方面，它确保愿景在业务和\
  \ IT 职能之间得到传达。家乐福的云战略将沟通视为成功数字化转型的主要驱动力之一。我们还探讨了关注业务成果而非底层技术的重要性。例如，技术格局日新月异，IT\
  \ 组织很容易对多年来构建的技术或基础设施产生偏爱，这可能对业务成果产生不利影响。这就是“牲畜与宠物”的心态。\n\n从 Airbnb 和家乐福的用例中，我们可以看到云如何被用作创新的跳板，成为成功企业的基石。当今所有现代技术，从数字助手到生成式\
  \ AI，从实时数据流到物联网，从区块链到 AR/VR，都在云上构建和交付。尽早接触、进行试验，并更快地推动客户体验至关重要。\n\n轻视“直接迁移”（lift\
  \ and shift）并将其视为毫无价值的云计划，是大多数企业（尤其是当今）常见的陷阱。然而，正如我们从 Capital One 退出数据中心中看到的那样，这完全是一种误解。直接迁移为成熟企业提供了一个独特的机会，使其摆脱技术债务，充当学习的跳板，帮助启动下一阶段的云成熟度，使公司对人才库更具吸引力，最重要的是有助于节省资源、优化成本并实现\
  \ ESG 目标。\n\n\n\n混合云是大多数拥有大量本地部署业务的企业的切实可行且易于获取收益的策略，其重点在于在云优先策略下开启新的业务合作。\n\n在下一章中，我们将探讨如何设计下一代企业云战略，特别关注主要云提供商的规范性框架和价值实现。\n\
