    For our example, we can consider two different users, `user1` for vendor `1` and
    `user2` for vendor `2`. QuickSight will match the username accessing the dataset
    with the value of the `UserName` field and then apply the filter or filters using
    the remaining column. In our example, it will use the `vendorid` column from the
    `yellowtrips_3mo` dataset.


    See our following mapping table for the scenario described previously:


    | UserName | vendorid |

    |---|---|

