    ## Working with navigation actions


    As you are adding visuals to analysis, it can reach a point when there might be
    too many visuals for a single page. In these scenarios, you can organize visuals
    into sheets. For each sheet, you can provide a user-friendly name to help your
    BI users navigate the dashboard. For each sheet, you can provide the following
    details:


    - Title

    - Description


    Both can help give your users context. Title and description can be particularly
    useful in scenarios where there are many sheets. Navigation actions can help you
    define actions that will allow your users to quickly navigate to different sheets
    within the same analysis.


    When configuring navigation actions, you will need to choose a visual in your
    analysis and then provide the following information:


    - **Action name**: The name of the navigation action.

    - **Activation**: **Menu option** or **Select**: **Menu Option** will add a menu
    item when you click a data point in your visual. This option, when clicked, will
    activate the URL action. On the other hand, with the **Select** option, your URL
    action will be activated directly when you click a data point.

    - **Target sheet**: The sheet name where your user redirects to when the action
    activates.

    - **Parameters**: This lets the user set parameter values after navigating to
    the target sheet.


    Next, we will look at another type of action: URL actions.


    ## Working with URL actions


    URL actions allow us to redirect our user to another website or another dashboard
    when the user clicks on a specific area of a dashboard. URL actions can help your
    BI users easily retrieve additional context for the dashboard.


    When configuring URL actions, you will need to choose a visual in your analysis
    and then provide the following information:


    - **Action Name**: A user-friendly and descriptive name for the URL action.

    - **Activation**: **Menu Option** or **Select**: **Menu Option** will add a menu
    item when you click a data point in your visual. This option, when clicked, will
    activate the URL action. On the other hand, with the **Select** option, your URL
    action will be activated directly when you click a data point.

    - **URL**: The URL where you want to redirect your user.


    > **Note**

    > You can add references to the parameters of field values in the URL field.

    > This will allow you to redirect your users to different URLs, based on the user
    selection. The syntax to refer to a parameter is <<$parameter-name>>, while the
    syntax to refer to a field is {{ {field-name} }}.


    - **Open in**: This option determines how your browser will open the link from
    the URL actions. The options are opening in the same tab, opening in a different
    tab, or opening in a different browser window.


    To understand how to set up URL actions, we will use our New York Taxi analysis.
    Let’s assume that we need to add a link to an external website with additional
    information on each of the New York boroughs. For this example, we will use the
