    ## Introducing QuickSight architecture


    QuickSight is a fully managed service that runs exclusively on the AWS cloud.
    QuickSight visualizations can be consumed either via QuickSight for the web, the
    QuickSight mobile app, or can be embedded into a custom application. Embedded
    analytics will be covered in more detail in _Chapter 7, Understanding Embedded
    Analytics_. QuickSight is centrally hosted, which means that AWS is responsible
    for scaling and managing the underlying infrastructure, allowing users to focus
    on developing BI applications. QuickSight is licensed on a subscription basis
    according to the number of users or sessions.


    In this section, we will cover a few fundamental topics of the QuickSight architecture.
    These will cover the basic networking concepts and storage.


    ## Introducing QuickSight networking concepts


    In this section, we will cover fundamental networking topics that will help us
    understand how to architect with QuickSight. Networking is an important concept
    when you configure your data sources because QuickSight will need to establish
    a working connection to either query the data source or load data from the source
    into the QuickSight service.


    AWS **Virtual Private Cloud (VPC)** is a logically isolated virtual network on
    the AWS cloud. Organizations that need to achieve workload isolation use AWS VPC
    to create a virtual network to host their workloads. Analytical databases, such
    as data warehouses, are commonly hosted on a VPC configured to block inbound internet
    connectivity. BI applications that need to connect to those data sources will
    need to have a network route to them. In Amazon QuickSight, admins can configure
    VPC connectivity. Once configured, Amazon QuickSight will automatically set up
    a QuickSight elastic network interface inside your VPC. An **elastic network interface
    (ENI)** is the equivalent of a virtual network card.


    Only data sources that have been configured to use the VPC connection will use
    the interface. Using this connection, you can access a data source with a private
    IP address, without internet access. The following diagram shows the network configuration
    when connecting QuickSight to a VPC data store.


    ![](img/33bad1d211a2d93fd743a1978d403f9a_51_0.png)


    Figure 2.3 – VPC connectivity with Amazon QuickSight


    Now that we have discussed the networking fundamentals, we will talk about SPICE,
    the QuickSight managed storage technology.


    ## Introducing SPICE


    **Super-fast Parallel In-memory Calculation Engine (SPICE)** is an important concept
    in Amazon QuickSight that can speed up QuickSight performance while reducing costs.
    You can import data into SPICE and use it as a caching layer between your data
    source and QuickSight. BI applications make it possible to trigger many queries
    at one time, some of which can be expensive. Typically, analytical queries scan
    and aggregate a large number of rows, and this can be computationally intensive.
    However, when datasets are imported into SPICE, you avoid direct queries against
    the data source. Instead, data is served by SPICE, which is optimized to run analytical
    queries. Data imported into SPICE can be reused by multiple dashboards and users,
    eliminating the need to scale the underlying database or the data warehouse. If
    the data source is a pay-per-query type, such as Amazon Athena, then SPICE will
    introduce direct cost benefits, as it will reduce the number of queries needed
    to run the BI application. The data sources will only need to serve data imports
    into SPICE, and not the analytical queries to populate the visuals.


    Capacity planning for SPICE storage is the responsibility of the QuickSight admin.
    Each AWS Region has a separate SPICE capacity. AWS provides a formula to calculate
    the size of SPICE capacity for a data source. The overall capacity is determined
    by the following:


    - The number of rows

    - The number of columns

    - The type of columns


    ## Introducing QuickSight editions and user authorization options


    In this section, we will discuss the QuickSight editions and authorization options.
    These are choices we will need to make first when creating a QuickSight account.


    ### QuickSight editions


    Amazon QuickSight is offered in two editions:


    - **Standard edition**: The QuickSight Standard version contains the basic QuickSight
    functionality. The concepts of an author and a reader user role don''t apply in
    the Standard edition. For every registered user, bundled SPICE capacity is included,
    and additional SPICE capacity can be purchased.


    - **Enterprise edition**: The Enterprise edition offers the full functionality
    of Amazon QuickSight. The concept of a reader user is only applicable in the Enterprise
    edition of QuickSight. Every author user is bundled with SPICE storage. For reader
    users, Amazon QuickSight has pay-per-session pricing capped to a maximum price
    point per month. ML Insights, forecasting, and embedded dashboards are only available
    in the Enterprise edition of QuickSight.


    > Note

    > There are certain features, including forecasting, ML Insights, and dashboard
    embedding and AD integration, that aren''t supported in the Standard edition and
    are only available with the Enterprise edition.


    ## Choosing between editions


    For some users, the Standard version might suffice to try the basic functions
    of Amazon QuickSight and get familiar with the user interface and the look and
    feel. However, the Standard edition does not offer the full functionality of QuickSight.
    Given that a subscription to the Enterprise version can be stopped at any time,
    without any commitment, the Enterprise edition might be the best starting point
    for the majority of use cases. For this book, we will choose the QuickSight Enterprise
    edition, as we will be using features only found in the Enterprise edition.


    Now that we have seen the different options for QuickSight editions, we will discuss
    the different options for user authorization.


    ## User authorization with QuickSight


    In this section, we will look more closely into user authorization options for
    Amazon QuickSight. This concept is more relevant to AWS administrators, who are
    responsible for setting up the QuickSight subscription. During QuickSight setup,
    the administrator will need to select the method to authenticate QuickSight users.


    First, let''s examine the required permissions needed to set up an Amazon QuickSight
    account. The AWS principal who sets up a QuickSight account will need to have
    permissions to call the QuickSight API. An AWS administrator (assuming that they
    have the `AdministratorAccess` managed policy) can set up a QuickSight subscription
    as they inherit full access to the QuickSight API. However, if another user needs
    to set up a QuickSight subscription, then they will need to be explicitly allowed
    to call the required QuickSight API actions. For example, the `QuickSight :Subscribe`
    action is needed to subscribe to QuickSight and `QuickSight :CreateAdmin` to create
    a QuickSight administrator. The full list of API actions that are allowed will
    depend on the actions a user needs to be allowed. If you don''t explicitly allow
    an API action for a user, then **deny** is the AWS IAM default behavior.


    When you set up Amazon QuickSight Enterprise edition, you will need to specify
    how your users will connect to the service. QuickSight offers the following two
    options:


    - Use Role Based Federation (SSO)

    - Use Active Directory


    Once configured, you can invite your users, either via email or via their federated
    logins, or via Active Directory if you have an Active Directory QuickSight account.
    When inviting users, you can choose to use AWS IAM user authentication credentials,
    or create brand-new credentials for QuickSight.


