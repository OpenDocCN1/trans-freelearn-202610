  - '[PAGE 25]


    While scaling data lake storage is something that organizations and CIOs don’t
    need to worry about much anymore, data lake governance needs to be considered
    carefully. Data lakes do not enforce data schemas or data formats and, without
    any governance, data lakes can degrade into unusable data repositories, often
    referred to as **data swamps**. AWS offers a number of services for data governance.


    The **AWS Glue Catalog** is part of the AWS Glue service. It is a fully managed
    Apache Hive metastore-compatible data catalog. Big data applications (for example,
    Apache Spark, Apache Hive, Presto, and so on) use the metadata in the catalog
    to locate and parse data. The AWS Glue Catalog is a technical metadata repository
    and can catalog data in Amazon S3, and a number of relational or non-relational
    data stores including Redshift, Aurora, and DynamoDB, among others.


    **AWS Lake Formation** runs on top of AWS Glue and Amazon S3 and provides a governance
    layer and access layer for data lakes on Amazon S3. It also provides a set of
    reusable ETL jobs, called blueprints, that can be used to perform common ETL tasks
    (for example, loading data from a relational data store into an S3 data lake).
    Lake Formation allows users to manage access permissions, using a familiar GRANT
    REVOKE syntax that you might have seen in **relational database management systems
    (RDBMSes)**.


    **Amazon Macie** is an AWS service for data protection. It provides an inventory
    of Amazon S3 buckets and it uses machine learning to identify and alert its users
    about sensitive data, such as **personally identifiable information (PII)**.


    Finally, and perhaps most importantly, AWS **Identity and Access Management (IAM)**
    is a fundamental AWS service that allows users to assign permissions to principals
    (for example, users, groups, or roles) and explicitly allow or deny access to
    AWS resources including data lake locations or tables in the data catalog.


    # ## Ad hoc analytics


    Ad hoc analytics refers to getting answers from the data on an as-needed basis.
    Contrary with what happens with scheduled reports, ad hoc querying is initiated
    by a user when they need to get specific answers from their data. The user typically
    uses SQL via a workbench type of application or other analytics frameworks (for
    instance, Apache Spark) using notebook environments or other BI applications.
    AWS has a number of analytics services that can be used for ad hoc analytics.'
  - '[PAGE 26]


    Amazon Redshift can be used for ad hoc analysis of data. For ad hoc querying,
    users will typically connect to Amazon Redshift using a query editor application
    with the Redshift JDBC/ODBC drivers. Notebook integrations or BI tool integrations
    are also possible for ad hoc analysis. AWS offers a number of managed notebook
    environments such as EMR notebooks and SageMaker notebooks. Amazon Redshift also
    allows its users to query data that is stored outside the data warehouse. Amazon
    Redshift Spectrum allows Redshift users to query data stored in Amazon S3, eliminating
    the need to load the data first before querying. Redshift''s federated querying
    capability allows users to query live data in operational data stores such as
    PostgreSQL and MySQL.


    For big data and data lakes, Presto is a popular choice for ad hoc analysis. Presto
    provides a high-performance parallel SQL query engine. **Amazon Athena** lets
    users run Presto queries in a scalable serverless environment. Amazon QuickSight
    natively supports Amazon Athena. We will talk more about this native integration
    in _Chapter 3, Preparing Data with Amazon QuickSight_. Amazon EMR is a fully managed
    Hadoop cluster, and it comes with a range of applications from the open source
    big data ecosystem. Presto has two community projects, PrestoSQL and PrestoDB,
    both of which are part of the Amazon EMR service. Other options included with
    EMR are Hive on EMR and Spark on EMR.


    # # Extract, transform, load


    **ETL** is a term used to describe a set of processes to extract, transform, and
    load data usually for analytical purposes. Organizations gather data from different
    data sources and centralize them in a central data repository. Data from different
    sources typically has different schemas and different conventions and standards,
    and therefore it can be challenging to combine them to get the required answers.
    For that reason, data needs to be transformed so that it can work together. For
    example, cleaning the data, applying certain data quality thresholds, and standardizing
    to a specific standard (for instance, date and time formats used) are all important
    tasks to ensure the data is useable. A visual representation of the ETL process
    is shown in the following figure.'
  - '[PAGE 27]


    ![](img/33bad1d211a2d93fd743a1978d403f9a_27_0.png)


    Figure 1.2 – The ETL process


    AWS Glue is a fully managed ETL service offered by AWS. When it was first introduced
    in 2017, Glue ETL offered an Apache Spark environment optimized for ETL. Now,
    Glue ETL offers a wider range of options:


    +   - PySpark – Apache Spark using Python

    +   - Spark with Scala – Apache Spark with Scala

    +   - Python shell – For smaller ETL jobs that don’t need a Spark cluster

    +   - Glue Studio and Glue Databrew – Visual approach to ETL without the need
    to write code


    Amazon EMR transient clusters, with applications such as Spark or Hive, can be
    leveraged for ETL workloads. ETL workloads can be bulk or streaming: streaming
    ETL workloads usually need to be up and running constantly, or at least for as
    long as the source stream is on; batch ETL workloads don’t need to run at all
    times and they can stop once the data is loaded into the target system. This type
    of workload fits nicely with the flexibility of the cloud. With the cloud, data
    architects don’t need to think of Hadoop clusters as big monolithic clusters.
    Instead, users prefer purpose-built transient clusters, optimized and sized to
    handle specific workloads and data loads.


    Now that we’ve had our overview of the AWS analytics ecosystem, let’s learn about
    modern data architecture and how they are built.'
  - '[PAGE 28]


    # # Exploring the modern data architecture on AWS


    The modern data architecture is a modern data analytics architecture: as the name
    suggests, it combines the **data lake** and the **data warehouse** into a seamless
    system. This approach extends the traditional data warehouse approach and opens
    up new possibilities for data analytics. For this reason, it is important to understand
    this architecture, which can be used as a data backend for Amazon QuickSight or
    other BI applications. To understand the architecture better, let’s first start
    by understanding the differences between a data lake and data warehouse.


    # ## Data lakes versus data warehouses


    Data lakes and data warehouses are designed to consume large amounts of data for
    analytics purposes. Data warehouses are traditional database systems, used by
    organizations and enterprises for years. Data lakes, on the other side, are relatively
    young implementations that emerged from the big data and Hadoop ecosystems. Tables
    stored in data warehouses need to have clearly defined schemas. The schema needs
    to be defined upfront, before any data is added. This approach is called **schema
    on write**, and it ensures that data conforms to a specific structure before being
    ingested into the data warehouse. However, it can be less flexible, and it may
    introduce complexity when dealing with evolving schemas. Evolving schemas are
    an increasingly common scenario because organizations need to capture more and
    more data points from their customer interactions to drive data-driven decisions.


    On the other side, data lakes don’t enforce a schema upfront. Instead, applications
    that have the required permissions can write data to a data lake. Structure and
    data formats aren’t enforced by the data lake: it is a responsibility of the writing
    application.


    Data stored in a data lake has few to no limitations regarding its format: it
    can be **structured**, **semi-structured**, or completely **unstructured**. For
    many datasets, a schema can be inferred, either because the data is semi-structured
    (CSV, JSON, and others), or they follow patterns that can be identified after
    applying regular expressions and extracting specific columns. In data lakes, the
    schema is inferred when the data is read by the querying application. This approach
    is called **schema on read**, and it gives an organization flexibility regarding
    the data type stored. However, it also introduces challenges with data complexity
    and enforcing data quality.


    For that reason, it is common that data that lands into the data lake goes through
    a series of transformations to get to a stage where it is useable. The first stage,
    often referred to as the **raw** layer, is where the data first lands, and it
    is stored as is.'
  md: '


    While scaling data lake storage is something that organizations and CIOs don’t
    need to worry about much anymore, data lake governance needs to be considered
    carefully. Data lakes do not enforce data schemas or data formats and, without
    any governance, data lakes can degrade into unusable data repositories, often
    referred to as **data swamps**. AWS offers a number of services for data governance.


    The **AWS Glue Catalog** is part of the AWS Glue service. It is a fully managed
    Apache Hive metastore-compatible data catalog. Big data applications (for example,
    Apache Spark, Apache Hive, Presto, and so on) use the metadata in the catalog
    to locate and parse data. The AWS Glue Catalog is a technical metadata repository
    and can catalog data in Amazon S3, and a number of relational or non-relational
    data stores including Redshift, Aurora, and DynamoDB, among others.


    **AWS Lake Formation** runs on top of AWS Glue and Amazon S3 and provides a governance
    layer and access layer for data lakes on Amazon S3. It also provides a set of
    reusable ETL jobs, called blueprints, that can be used to perform common ETL tasks
    (for example, loading data from a relational data store into an S3 data lake).
    Lake Formation allows users to manage access permissions, using a familiar GRANT
    REVOKE syntax that you might have seen in **relational database management systems
    (RDBMSes)**.


    **Amazon Macie** is an AWS service for data protection. It provides an inventory
    of Amazon S3 buckets and it uses machine learning to identify and alert its users
    about sensitive data, such as **personally identifiable information (PII)**.


    Finally, and perhaps most importantly, AWS **Identity and Access Management (IAM)**
    is a fundamental AWS service that allows users to assign permissions to principals
    (for example, users, groups, or roles) and explicitly allow or deny access to
    AWS resources including data lake locations or tables in the data catalog.


    ## Ad hoc analytics


    Ad hoc analytics refers to getting answers from the data on an as-needed basis.
    Contrary with what happens with scheduled reports, ad hoc querying is initiated
    by a user when they need to get specific answers from their data. The user typically
    uses SQL via a workbench type of application or other analytics frameworks (for
    instance, Apache Spark) using notebook environments or other BI applications.
    AWS has a number of analytics services that can be used for ad hoc analytics.


    Amazon Redshift can be used for ad hoc analysis of data. For ad hoc querying,
    users will typically connect to Amazon Redshift using a query editor application
    with the Redshift JDBC/ODBC drivers. Notebook integrations or BI tool integrations
    are also possible for ad hoc analysis. AWS offers a number of managed notebook
    environments such as EMR notebooks and SageMaker notebooks. Amazon Redshift also
    allows its users to query data that is stored outside the data warehouse. Amazon
    Redshift Spectrum allows Redshift users to query data stored in Amazon S3, eliminating
    the need to load the data first before querying. Redshift''s federated querying
    capability allows users to query live data in operational data stores such as
    PostgreSQL and MySQL.


    For big data and data lakes, Presto is a popular choice for ad hoc analysis. Presto
    provides a high-performance parallel SQL query engine. **Amazon Athena** lets
    users run Presto queries in a scalable serverless environment. Amazon QuickSight
    natively supports Amazon Athena. We will talk more about this native integration
    in _Chapter 3, Preparing Data with Amazon QuickSight_. Amazon EMR is a fully managed
    Hadoop cluster, and it comes with a range of applications from the open source
    big data ecosystem. Presto has two community projects, PrestoSQL and PrestoDB,
    both of which are part of the Amazon EMR service. Other options included with
    EMR are Hive on EMR and Spark on EMR.


    ## Extract, transform, load


    **ETL** is a term used to describe a set of processes to extract, transform, and
    load data usually for analytical purposes. Organizations gather data from different
    data sources and centralize them in a central data repository. Data from different
    sources typically has different schemas and different conventions and standards,
    and therefore it can be challenging to combine them to get the required answers.
    For that reason, data needs to be transformed so that it can work together. For
    example, cleaning the data, applying certain data quality thresholds, and standardizing
    to a specific standard (for instance, date and time formats used) are all important
    tasks to ensure the data is useable. A visual representation of the ETL process
    is shown in the following figure.


    ![](img/33bad1d211a2d93fd743a1978d403f9a_27_0.png)


    Figure 1.2 – The ETL process


    AWS Glue is a fully managed ETL service offered by AWS. When it was first introduced
    in 2017, Glue ETL offered an Apache Spark environment optimized for ETL. Now,
    Glue ETL offers a wider range of options:


    - PySpark – Apache Spark using Python

    - Spark with Scala – Apache Spark with Scala

    - Python shell – For smaller ETL jobs that don’t need a Spark cluster

    - Glue Studio and Glue Databrew – Visual approach to ETL without the need to write
    code


    Amazon EMR transient clusters, with applications such as Spark or Hive, can be
    leveraged for ETL workloads. ETL workloads can be bulk or streaming: streaming
    ETL workloads usually need to be up and running constantly, or at least for as
    long as the source stream is on; batch ETL workloads don’t need to run at all
    times and they can stop once the data is loaded into the target system. This type
    of workload fits nicely with the flexibility of the cloud. With the cloud, data
    architects don’t need to think of Hadoop clusters as big monolithic clusters.
    Instead, users prefer purpose-built transient clusters, optimized and sized to
    handle specific workloads and data loads.


    Now that we’ve had our overview of the AWS analytics ecosystem, let’s learn about
    modern data architecture and how they are built.


    ## Exploring the modern data architecture on AWS


    The modern data architecture is a modern data analytics architecture: as the name
    suggests, it combines the **data lake** and the **data warehouse** into a seamless
    system. This approach extends the traditional data warehouse approach and opens
    up new possibilities for data analytics. For this reason, it is important to understand
    this architecture, which can be used as a data backend for Amazon QuickSight or
    other BI applications. To understand the architecture better, let’s first start
    by understanding the differences between a data lake and data warehouse.


