    数据落地后，将应用第一系列转换，并将数据存储在处理层。由于数据可以是任何格式，可能的转换类型是无限的。仅举几例，数据质量函数可以在此阶段应用，以删除不完整的行，并将数据标准化为特定的日期时间或时区格式。其他数据工程活动也可以在此阶段执行，例如将数据转换为针对分析优化的不同文件数据格式，或使用特定信息（通常是时间信息）将其组织到文件夹中，这些信息稍后可被查询应用用作分区列。


    最后，数据可以转换为特定用例并落地到目标层。例如，数据可以以特定机器学习算法可用于处理数据的方式进行转换。另一个用例可能是 BI 应用程序，例如 Amazon
    QuickSight，其中数据可以预先连接或聚合，因此从大型数据集减少为更小的、更易于可视化的数据集。此阶段还可以应用其他数据工程以优化性能。


    Figure 1.3 – 数据湖层


    - AWS Glue 是用于存储技术元数据的数据湖目录。


    ## 介绍 AWS 分析生态系统


    > **注意**

    > AWS Glue Catalog 表可以存储在 Amazon Redshift 中，在数据仓库和 S3 数据湖之间提供统一的元数据目录。


    Amazon Redshift 支持允许其与数据仓库交互的功能。让我们更详细地了解这些功能。


    ### 从数据仓库查询数据湖的能力


    **Redshift Spectrum** 是 Redshift 的一项功能，允许您针对 S3 数据湖中的数据执行 SQL 查询。查询直接从数据仓库触发，因此您不需要连接到不同的环境来提交查询。您需要将
    Spectrum 表定义为数据仓库上的外部表。Redshift 集群还需要有权限访问数据湖 S3 位置。Redshift 集群需要分配一个 IAM 角色，该角色需要有权访问所需的
    S3 位置。


    Redshift Spectrum 的另一个关键特征是，Spectrum 查询在 Redshift 集群之外的 Spectrum 节点上运行。这在需要查询数据湖数据时，有效地为
    Redshift 集群扩展了额外的计算能力。


    最后，Spectrum 表和 Redshift 表可以组合和连接。如果没有此功能，您将不得不在连接之前移动数据并将其并置。


    ### 从数据湖加载数据的能力


    Redshift 可以高效地从 S3 数据湖加载数据。具体来说，Redshift 的 COPY 命令可以从 Amazon S3 并行加载数据。您（至少）需要定义表名、数据位置（通常是
    S3）以及访问源位置中数据的授权。当从 S3 加载多个文件时，Redshift 通过将每个文件分配给一个 Redshift 切片（Redshift 中的处理单元）来并行化加载。


    ### 将数据卸载到数据湖的能力


    Redshift 还具有将数据从数据仓库卸载回数据湖的功能。具体来说，UNLOAD 命令将查询结果卸载到 Amazon S3。您（至少）需要指定 S3 位置和授权。还有更多选项，例如定义文件格式（使用
    FORMAT AS 选项）或应用分区（使用 PARTITION BY 选项）等。


    在以下图表中，我们看到一个示例数据管道，它同时使用 AWS 上的数据仓库和数据湖。数据从运营数据存储加载到数据湖原始层的 Amazon S3 对象存储中。然后，通过一组
    ETL 作业，数据达到可以加载到数据仓库以用于 BI 目的的阶段。为了成本效益，您可能不希望将所有数据加载到仓库中。相反，您可能希望将数据留在数据湖中，但需要时能够查询数据。此架构考虑数据的温度（数据被访问的频率）以确定最佳存储。**热**数据（需要频繁访问）被加载到数据仓库，而**冷**数据保留在数据湖中，这是一种更便宜的长期存储选项。


    ![](img/33bad1d211a2d93fd743a1978d403f9a_31_0.png)


    Figure 1.4 – AWS 上的示例数据管道


    现在我们已经对 AWS 上的现代数据架构有了概述，让我们在 AWS 上构建一个基本的现代数据架构。


    ## 创建基本的现代数据架构


    在本节中，我们将通过一个动手示例来创建基本的现代数据架构。本教程将使用 AWS CLI 和 AWS 控制台。到本节结束时，我们将启动一个工作数据湖和数据仓库环境，并加载演示数据。


    > **重要说明**

    > 本教程的资源可能会向您的 AWS 账户产生费用。完成练习后，请确保清理资源以防止产生进一步费用。


    ## 创建数据湖存储


    在此步骤中，我们将添加数据湖存储。然后我们将上传一个演示数据集并自动发现其架构。


    ### 步骤 1 – 创建 S3 存储桶


    让我们开始：


    1. 如果您尚未安装，请按照 AWS 文档安装和配置 AWS CLI。要完成本教程，您需要使用具有访问 S3、Glue、Redshift 和 IAM 服务权限的角色：https://docs.aws.amazon.com/cli/latest/userguide/cli-chap-configure.html。


    2. 首先，让我们创建 S3 存储桶作为数据湖存储。您的 S3 存储桶需要有一个全局唯一的名称。出于这个原因，我们应该为其引入一些随机性。让我们选择一组随机的
    10 个字符和数字。对于本教程，您应该为这个字符串选择自己的随机字符集；例如，SF482XHS7M。我们将在数据湖名称中使用随机字符串，以确保它是全局唯一的。让我们使用
    my-data-lake-<随机字符串> 作为存储桶名称。


    3. 要创建存储桶，我们可以在 CLI 中键入以下命令。将以下随机字符串替换为您的随机字符串：


    ```bash

    % aws s3api create-bucket --bucket data-lake-xxxxxxxxxx --region us-east-1

    ```


    响应应该如下所示：


    ```json

    {

    "Location": "/data-lake-xxxxxxxxxx"

    }

    ```


    ### 步骤 2 – 向数据湖添加数据


    现在让我们添加一些数据。对于此练习，我们将使用纽约市出租车和豪华轿车委员会（TLC）行程记录数据的一个子集：


    1. 让我们先看看数据集：


