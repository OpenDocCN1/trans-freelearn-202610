    • **Action name**: Wikipedia look up

    • **Activation**: Menu option

    • **URL**: `https://en.wikipedia.org/wiki/<<{Pick Up Borough}>>`

    • **Open in**: New browser tab


    5. Click Save.


    The URL action has now been applied to our visual. To test URL actions, you need
    to click on the data points of the visual where you applied the action. In our
    example, every data point will redirect to a different URL, since we are using
    the Pickup Borough field as part of our URL. When you test something like this
    in the real world, you will need to ensure that each URL is redirecting the user
    correctly. The following screenshot is what we''ll see upon right-clicking on
    the Manhattan bar in our bar chart. Notice that a **Wikipedia look up** menu option
    appears, which will redirect us to the Manhattan Wikipedia page (`https://en.wikipedia.org/wiki/Manhattan`)
    when we click on it:


    ![](img/33bad1d211a2d93fd743a1978d403f9a_129_0.png)


    Figure 5.15 – URL action menu item


