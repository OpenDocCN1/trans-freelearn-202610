    \ will learn how to control QuickSight resources using the QuickSight API. This\
    \ section is not meant to be a full reference guide to the QuickSight API, nor\
    \ is it going to cover every possible action that can be done using the API. For\
    \ a full reference guide to the QuickSight API, please refer to the QuickSight\
    \ documentation:\nhttps://docs.aws.amazon.com/quicksight/latest/APIReference/Welcome.html\n\
    \nThis section will provide you with practical hands-on examples of using the\
    \ API to control QuickSight resources. These examples will give you a solid understanding\
    \ of the types of activities that can be completed using the API, which in turn\
    \ will help you to manage your QuickSight environment.\nOur first example will\
    \ be to learn how to set up a data source using the QuickSight API.\n\n## Setting\
    \ up a dataset using the CLI\n\nIn Chapter 2, Introduction to Amazon QuickSight,\
    \ we learned how to create data sources and datasets. To create these resources,\
    \ we accessed the QuickSight GUI via our web browser. While the GUI is user-friendly,\
    \ we can create datasets programmatically using the API. This can be a good option\
    \ when we need to ensure the consistency of a specific configuration, as manual\
    \ configurations can be prone to errors. Let's create a data source from the data\
    \ warehouse we created in Chapter 1, Introducing the AWS Analytics Ecosystem.\n\
    \n> Note\n> The tutorial from Chapter 1, Introducing the AWS Analytics Ecosystem,\
    \ included creating a sample Amazon Redshift cluster, which will incur charges.\
    \ For this tutorial, you don't need the cluster running. A paused cluster can\
    \ work well for this example, as we only need to configure the dataset and we\
    \ won't need a live connection to it.\n\nNow, let's create a Redshift data source\
    \ using the CLI. We will use the create-data-source CLI command to create a Redshift\
    \ data source:\nhttps://docs.aws.amazon.com/cli/latest/reference/quicksight/create-data-source.html\n\
    \nHere are a few parameters we need to configure:\n\n- AwsAccountId: This value\
    \ represents your AWS numerical account ID.\n- DataSourceId and Name: You will\
    \ need to define a unique account and region identifier and a user-friendly name\
    \ to describe your data source.\n- Type: This is the type of data source. For\
    \ Redshift data sources, this needs to be set up as REDSHIFT.\n- DataSourceParameters:\
    \ The type of data source parameters will depend on the type of data source you\
    \ configure. For Redshift data sources, you will need to define the hostname,\
    \ port number, Redshift database name, and cluster identifier.\n- Credentials:\
    \ These are the credentials required by QuickSight to access the data store. For\
    \ Redshift data sources, you can use a credential pair consisting of a username\
    \ and password.\n- Permissions: In this section, you will need to define the permissions\
    \ for the newly created datasets and determine which user has access to it and\
    \ what levels of access they have. For our example, we want our reader user to\
    \ be able to create datasets from the newly created data source, but we also want\
    \ to restrict that user from deleting or updating the data source.\n\nNow, let’s\
    \ see how to configure the Redshift connection described previously, using the\
    \ QuickSight CLI:\n\n1. First, open a text editor and copy the following JSON\
    \ configuration. Replace the highlighted values with those from your environment.\
    \ For the permissions, note that we only give permissions to the PassDataSource,\
    \ DescribeDataSource, and DescribeDataSourcePermissions actions, which will allow\
    \ this user to use this data source to set up new datasets, but it will not allow\
    \ them to update or delete the data source:\n\n```json\n{\n  \"AwsAccountId\"\
    : \"<account id>\",\n  \"DataSourceId\": \"RedshiftDatasouceCLI\",\n  \"Name\"\
    : \"CLI Datasouce\",\n  \"Type\": \"REDSHIFT\",\n  \"DataSourceParameters\": {\n\
    \    \"RedshiftParameters\": {\n      \"Host\": \"hostname\",\n      \"Port\"\
    : 5439,\n      \"Database\": \"dev\",\n      \"ClusterId\": \"mycluster\"\n  \
    \  }\n  },\n  \"Credentials\": {\n    \"CredentialPair\": {\n      \"Username\"\
    : \"admin\",\n      \"Password\": \"R3dsh1ft\"\n    }\n  },\n  \"Permissions\"\
    : [\n    {\n      \"Principal\": \"arn:aws:quicksight:us-east-1:xxxxxxxxxxxx:user/default/author\"\
    ,\n      \"Actions\": [\n        \"quicksight:DescribeDataSource\",\n        \"\
    quicksight:DescribeDataSourcePermissions\",\n        \"quicksight:PassDataSource\"\
    \n      ]\n    }\n  ]\n}\n```\n\n2. Save the file as create-data-source.json.\n\
    3. Run `aws quicksight create-data-source --cli-input-json file://create-data-source.json`.\n\
    \nThe result of this command will look like the following:\n\n```json\n{\n  \"\
    Status\": 202,\n  \"DataSourceId\": \"SampleRedshiftDatasouce\",\n  \"RequestId\"\
    : \"xxxxxx-xxxxxx-xxxxxx-xxxxxx-xxxxxxxxxx\",\n  \"CreationStatus\": \"CREATION_IN_PROGRESS\"\
    ,\n  \"Arn\": \"arn:aws:quicksight:us-east-1:xxxxxxxxxxxx:datasource/SampleRedshiftDatasouce\"\
    \n}\n```\n\nNow that we have configured the new data source, let’s validate that\
    \ the Author user will be able to use it to set up a new dataset:\n\n1. For this\
    \ tutorial, we can verify the newly created data source simply by logging into\
    \ QuickSight as the `author` user.\n2. Then, navigate to **Datasets**, and then\
    \ click **New Datasets**. You should be able to find the newly created data source\
    \ under the **FROM EXISTING DATA SOURCES** menu, as shown in the following figure:\n\
    \n![](img/33bad1d211a2d93fd743a1978d403f9a_176_0.png)\n\nFigure 8.3 – Creating\
    \ a data source using the CLI\n\n3. Click on the data source. Note that the buttons\
    \ to delete or edit the data source are not shown, as this user doesn’t have the\
    \ permissions required to update or delete this data source:\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_176_1.png)\n\
    \nFigure 8.4 – Sample CLI data source permissions\n\nNow that we have learned\
    \ how to configure a data source, we will use the QuickSight CLI to change the\
    \ QuickSight settings for our environment.\n\n## Editing account settings using\
    \ the QuickSight API\n\nIn this section, we will use the QuickSight API to edit\
    \ settings on our account. This allows us to configure account customizations\
    \ on our account. For our example, we will change the default theme for our QuickSight\
    \ Account.\n\n1. First, let's use the QuickSight API to retrieve the global QuickSight\
    \ account details. Using the CLI as a QuickSight or AWS admin, type the following\
    \ command, replacing the `aws-account-id` value with the value from your environment:\n\
    \n```bash\n$aws quicksight describe-account-settings --aws-account-id <account-id>\n\
    ```\n\nThe response should look like the following:\n\n```json\n{\n    \"Status\"\
    : 200,\n    \"AccountSettings\": {\n        \"DefaultNamespace\": \"default\"\
    ,\n        \"Edition\": \"ENTERPRISE\",\n        \"NotificationEmail\": \"your-email\"\
    ,\n        \"AccountName\": \"quicksight-account-name\"\n    },\n    \"RequestId\"\
    : \"xxxxxxxxxxxxxxxxxxxxxx\"\n}\n```\n\n2. Next, let's type the following command\
    \ to get our QuickSight account customizations. Account customizations refer to\
    \ a set of settings that can be parameterized for a QuickSight account. Currently,\
    \ you can add a custom default theme by using account customization:\n\n```bash\n\
    $aws quicksight describe-account-customization --aws-account-id <account-id>\n\
    ```\n\nSince we haven't yet added any customizations, the response would most\
    \ likely look like the following:\n\n```\nAn error occurred (ResourceNotFoundException)\
    \ when calling the DescribeAccountCustomization operation: Account customization\
    \ does not exist for AwsAccountId <account-id>\n```\n\n3. Now, let’s add an account\
    \ customization and set Midnight as the default theme. Type the following command\
    \ using the CLI, replacing the aws-account-id value with your account ID value:\n\
    \n```bash\naws quicksight create-account-customization \\\n--aws-account-id <account-id>\
    \ --account-customization \\\nDefaultTheme=arn:aws:quicksight::aws:theme/MIDNIGHT\
    \ \\\n--region=us-east-1\n```\n\n4. Now, let’s confirm the creation of the new\
    \ account customization by running again the describe-account-customization command\
    \ from Step 2. This time, the response should look like the following:\n\n```json\n\
    {\n \"Status\": 200,\n \"RequestId\": \"xxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx\",\n\
    \ \"AccountCustomization\": {\n \"DefaultTheme\": \"arn:aws:quicksight::aws:theme/MIDNIGHT\"\
    \n },\n \"Arn\": \"arn:aws:quicksight:us-east-1:xxxxxxxxxxxx:customization/account/xxxxxxxxxxxx\
    \ \",\n \"AwsAccountId\": \"xxxxxxxxxxxx\"\n}\n```\n\n> Note\n> The account customization\
    \ applies at the account and **AWS Region** levels.\n\nTo verify that the customization\
    \ setting has been applied on this account, you can create a sample analysis on\
    \ the account for the same region where you applied the account customization.\n\
    \nNow that we have learned how to edit our account settings using the CLI, in\
    \ the next section, we will learn how to use the template API, which is useful\
    \ when developing analysis and dashboards across multiple environments.\n\n"
  mdcn: "\n\n## 使用 QuickSight API 控制资源\n\n在本节中，我们将学习如何使用 QuickSight API 控制 QuickSight\
    \ 资源。本节并非旨在成为 QuickSight API 的完整参考指南，也不会涵盖使用 API 可以完成的每一种可能操作。有关 QuickSight API\
    \ 的完整参考指南，请参阅 QuickSight 文档：\nhttps://docs.aws.amazon.com/quicksight/latest/APIReference/Welcome.html\n\
    \n本节将为您提供使用 API 控制 QuickSight 资源的实际操作示例。这些示例将使您对可以使用 API 完成的活动类型有扎实的了解，进而帮助您管理\
    \ QuickSight 环境。\n我们的第一个示例将是学习如何使用 QuickSight API 设置数据源。\n\n## 使用 CLI 设置数据集\n\n\
    在第 2 章“Amazon QuickSight 简介”中，我们学习了如何创建数据源和数据集。要创建这些资源，我们通过网络浏览器访问了 QuickSight\
    \ GUI。虽然 GUI 很用户友好，但我们可以使用 API 以编程方式创建数据集。当我们需要确保特定配置的一致性时，这可能是一个不错的选择，因为手动配置容易出错。让我们从第\
    \ 1 章“AWS 分析生态系统简介”中创建的数据仓库创建一个数据源。\n\n> Note\n> 第 1 章“AWS 分析生态系统简介”中的教程包括创建一个示例\
    \ Amazon Redshift 集群，这将产生费用。对于本教程，您不需要集群正在运行。暂停的集群对于此示例来说效果很好，因为我们只需要配置数据集，并且不需要与其建立实时连接。\n\
    \n现在，让我们使用 CLI 创建一个 Redshift 数据源。我们将使用 create-data-source CLI 命令来创建 Redshift 数据源：\n\
    https://docs.aws.amazon.com/cli/latest/reference/quicksight/create-data-source.html\n\
    \n以下是我们需要配置的几个参数：\n\n- AwsAccountId：此值表示您的 AWS 数字账户 ID。\n- DataSourceId 和 Name：您需要定义一个唯一的账户和区域标识符以及一个用户友好的名称来描述您的数据源。\n\
    - Type：这是数据源的类型。对于 Redshift 数据源，这需要设置为 REDSHIFT。\n- DataSourceParameters：数据源参数的类型将取决于您配置的数据源类型。对于\
    \ Redshift 数据源，您需要定义主机名、端口号、Redshift 数据库名称和集群标识符。\n- Credentials：这些是 QuickSight\
    \ 访问数据存储所需的凭据。对于 Redshift 数据源，您可以使用由用户名和密码组成的凭据对。\n- Permissions：在本节中，您需要定义新创建数据集的权限，并确定哪个用户可以访问它以及他们拥有什么级别的访问权限。对于我们的示例，我们希望我们的读者用户能够从新创建的数据源创建数据集，但我们也希望限制该用户删除或更新数据源。\n\
    \n现在，让我们看看如何使用 QuickSight CLI 配置先前描述的 Redshift 连接：\n\n1. 首先，打开文本编辑器并复制以下 JSON\
    \ 配置。用您环境中的值替换高亮显示的值。对于权限，请注意，我们仅授予 PassDataSource、DescribeDataSource 和 DescribeDataSourcePermissions\
    \ 操作的权限，这将允许此用户使用此数据源设置新数据集，但不会允许他们更新或删除数据源：\n\n```json\n{\n  \"AwsAccountId\"\
    : \"<account id>\",\n  \"DataSourceId\": \"RedshiftDatasouceCLI\",\n  \"Name\"\
    : \"CLI Datasouce\",\n  \"Type\": \"REDSHIFT\",\n  \"DataSourceParameters\": {\n\
    \    \"RedshiftParameters\": {\n      \"Host\": \"hostname\",\n      \"Port\"\
    : 5439,\n      \"Database\": \"dev\",\n      \"ClusterId\": \"mycluster\"\n  \
    \  }\n  },\n  \"Credentials\": {\n    \"CredentialPair\": {\n      \"Username\"\
    : \"admin\",\n      \"Password\": \"R3dsh1ft\"\n    }\n  },\n  \"Permissions\"\
    : [\n    {\n      \"Principal\": \"arn:aws:quicksight:us-east-1:xxxxxxxxxxxx:user/default/author\"\
    ,\n      \"Actions\": [\n        \"quicksight:DescribeDataSource\",\n        \"\
    quicksight:DescribeDataSourcePermissions\",\n        \"quicksight:PassDataSource\"\
    \n      ]\n    }\n  ]\n}\n```\n\n2. 将文件另存为 create-data-source.json。\n3. 运行 `aws\
    \ quicksight create-data-source --cli-input-json file://create-data-source.json`。\n\
    \n此命令的结果将如下所示：\n\n```json\n{\n  \"Status\": 202,\n  \"DataSourceId\": \"SampleRedshiftDatasouce\"\
    ,\n  \"RequestId\": \"xxxxxx-xxxxxx-xxxxxx-xxxxxx-xxxxxxxxxx\",\n  \"CreationStatus\"\
    : \"CREATION_IN_PROGRESS\",\n  \"Arn\": \"arn:aws:quicksight:us-east-1:xxxxxxxxxxxx:datasource/SampleRedshiftDatasouce\"\
    \n}\n```\n\n现在我们已配置新数据源，让我们验证 Author 用户是否能够使用它来设置新数据集：\n\n1. 对于本教程，我们可以通过以 `author`\
    \ 用户身份登录 QuickSight 来简单验证新创建的数据源。\n2. 然后，导航到 **Datasets**，然后单击 **New Datasets**。您应该能够在\
    \ **FROM EXISTING DATA SOURCES** 菜单下找到新创建的数据源，如下图所示：\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_176_0.png)\n\
    \nFigure 8.3 – 使用 CLI 创建数据源\n\n3. 单击数据源。请注意，未显示删除或编辑数据源的按钮，因为该用户没有更新或删除此数据源所需的权限：\n\
    \n![](img/33bad1d211a2d93fd743a1978d403f9a_176_1.png)\n\nFigure 8.4 – 示例 CLI 数据源权限\n\
    \n现在我们已学习如何配置数据源，我们将使用 QuickSight CLI 更改环境的 QuickSight 设置。\n\n## 使用 QuickSight\
    \ API 编辑账户设置\n\n在本节中，我们将使用 QuickSight API 编辑账户上的设置。这允许我们在账户上配置账户自定义设置。对于我们的示例，我们将更改\
    \ QuickSight 账户的默认主题。\n\n1. 首先，让我们使用 QuickSight API 检索全局 QuickSight 账户详细信息。使用\
    \ CLI 作为 QuickSight 或 AWS 管理员，键入以下命令，将 `aws-account-id` 值替换为您环境中的值：\n\n```bash\n\
    $aws quicksight describe-account-settings --aws-account-id <account-id>\n```\n\
    \n响应应如下所示：\n\n```json\n{\n    \"Status\": 200,\n    \"AccountSettings\": {\n \
    \       \"DefaultNamespace\": \"default\",\n        \"Edition\": \"ENTERPRISE\"\
    ,\n        \"NotificationEmail\": \"your-email\",\n        \"AccountName\": \"\
    quicksight-account-name\"\n    },\n    \"RequestId\": \"xxxxxxxxxxxxxxxxxxxxxx\"\
    \n}\n```\n\n2. 接下来，让我们键入以下命令以获取 QuickSight 账户自定义设置。账户自定义设置是指可以为 QuickSight 账户参数化的一组设置。目前，您可以通过账户自定义设置添加自定义默认主题：\n\
    \n```bash\n$aws quicksight describe-account-customization --aws-account-id <account-id>\n\
    ```\n\n由于我们尚未添加任何自定义设置，响应很可能如下所示：\n\n```\nAn error occurred (ResourceNotFoundException)\
    \ when calling the DescribeAccountCustomization operation: Account customization\
    \ does not exist for AwsAccountId <account-id>\n```\n\n3. 现在，让我们添加一个账户自定义设置并将\
    \ Midnight 设置为默认主题。使用 CLI 键入以下命令，将 aws-account-id 值替换为您的账户 ID 值：\n\n```bash\n\
    aws quicksight create-account-customization \\\n--aws-account-id <account-id>\
    \ --account-customization \\\nDefaultTheme=arn:aws:quicksight::aws:theme/MIDNIGHT\
    \ \\\n--region=us-east-1\n```\n\n4. 现在，让我们通过再次运行步骤 2 中的 describe-account-customization\
    \ 命令来确认新账户自定义设置的创建。这次，响应应如下所示：\n\n```json\n{\n \"Status\": 200,\n \"RequestId\"\
    : \"xxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx\",\n \"AccountCustomization\": {\n \"DefaultTheme\"\
    : \"arn:aws:quicksight::aws:theme/MIDNIGHT\"\n },\n \"Arn\": \"arn:aws:quicksight:us-east-1:xxxxxxxxxxxx:customization/account/xxxxxxxxxxxx\
    \ \",\n \"AwsAccountId\": \"xxxxxxxxxxxx\"\n}\n```\n\n> Note\n> 账户自定义设置适用于账户和\
    \ **AWS 区域** 级别。\n\n要验证自定义设置是否已应用于此账户，您可以在应用账户自定义设置的同一区域的账户上创建示例分析。\n\n现在我们已学习如何使用\
    \ CLI 编辑账户设置，在下一节中，我们将学习如何使用模板 API，这在开发跨多个环境的分析和仪表板时很有用。\n\n"
