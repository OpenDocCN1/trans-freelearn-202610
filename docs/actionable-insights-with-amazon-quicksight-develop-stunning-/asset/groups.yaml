    # # Working with QuickSight threshold-based alerts


    QuickSight allows you to set up threshold-based alerts when certain changes occur
    in your data. Using threshold-based alerts, you can receive notifications when
    a specific metric changes above or below a certain threshold. For example, when
    a **key performance indicator (KPI)** falls below a target, you get notified so
    that action can be taken to get the KPI back on target.


    > > **Note**

    > > You can have multiple alerts based on different conditions for a specific
    KPI. Creating different types of alerts for the same metric allows you to implement
    a complex KPI-monitoring alert system.


    In the next section, we will learn how to add threshold-based alerts.'
