    # # Adding QuickSight data sources


    In this section, we will learn how to add and configure data sources with Amazon
    QuickSight. QuickSight supports a number of data sources. We will begin by listing
    the supported data sources.


    # # Supported data sources with QuickSight


    Let''s look at the different types of data sources that can be configured in Amazon
    QuickSight. A very common scenario for BI tools is to drive the visualizations
    from an analytical database or a data warehouse. Specifically, QuickSight supports
    the following **data warehouses**:


    +   - Redshift with autodiscover

    +   - Redshift manual connect

    +   - Snowflake

    +   - Teradata


    > > **Note**

    > > A use case for Redshift manual connect is when QuickSight and the Redshift
    cluster are in different AWS Regions.


    Other **relational database systems** that are supported include the following:


    +   - RDS

    +   - MySQL

    +   - PostgreSQL

    +   - Oracle'
  - '[PAGE 61]


    +   - Amazon Aurora

    +   - MariaDB


    QuickSight also supports the following:


    +   - Amazon Timestream

    +   - Amazon Elasticsearch Service


    Both are popular data stores for **time series datasets**.


    For certain use cases, users might need to work with **individual files**, for
    example a Microsoft Excel file ( `.xls`). Amazon QuickSight supports files as
    data sources either via direct upload or via a manifest file that points to the
    S3 location of one or more files.


    QuickSight also supports popular **big data technologies**; specifically, the
    following:


    +   - Amazon Athena

    +   - Presto

    +   - Spark


    Another category is data sources from **APIs** and popular SaaS applications;
    specifically, the following:


    +   - Salesforce

    +   - GitHub

    +   - Twitter

    +   - Jira

    +   - ServiceNow

    +   - Adobe Analytics


    Finally, QuickSight supports **AWS IoT Analytics** to visualize **Internet of
    Things (IoT)** data and integration with **S3 Analytics** to visualize access
    patterns on your S3 buckets.


    Now that we have seen the data source options, in the next section we will configure
    our first data source using the **autodiscover** feature.'
