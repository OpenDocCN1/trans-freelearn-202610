    # # Working with advanced operations


    In this section, we will focus on advanced dataset operations. We will learn to
    add calculated fields to our dataset and apply dataset operations such as filtering
    and joining. Finally, we will add security controls, including row- and column-level
    filters. For this section, we will use our SPICE dataset that we configured earlier
    in this chapter.


    # ## Adding calculated fields


    QuickSight allows BI developers to add calculated fields to their datasets at
    the data preparation stage. This dataset, including its calculated fields, can
    then be used to develop multiple analyses.


    There are a number of prebuilt functions with QuickSight that we can use when
    building a calculated field. Those functions include the following:


    +   - **Aggregate functions** are used to calculate metrics over a number of values.
    For example, we can use the `min()` function to calculate the minimum value of
    a set of values.


    +   - **Conditional functions** allow us to use conditional logic in a calculated
    field, for example, `isNotNull()` returns `true` if the argument passed is not
    null.


    +   - **Date functions** help us work with date column types. For example, we
    can use the `dateDiff()` function to calculate the difference between two date
    fields.


    +   - **Numeric functions** and **string functions** can help us work with numerical
    values and string values respectively. For example, we can calculate the absolute
    value of a given expression using the `abs()` function or we can concatenate two
    or more strings using the `concat()` function.


    +   - Finally, **table calculations**, can be used to discover how dimensions
    influence specific measures. For example, the `sumOver()` function calculates
    the sum of a measure partitioned by a list of dimensions.'
