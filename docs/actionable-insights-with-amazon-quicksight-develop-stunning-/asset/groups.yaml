    # # Managing QuickSight usage


    In this section, we will focus on managing QuickSight assets. We will learn how
    to organize QuickSight assets using folders and how to set up alarms and reports.


    # ## Managing folders


    You can use folders to easily organize, navigate, and discover QuickSight assets.
    QuickSight _assets_ include the following:


    +   - Datasets

    +   - Analyses

    +   - Dashboards


    Folders can be either of the following:


    +   - **Personal folders**: These can be used to organize your work for yourself.

    +   - **Shared folders**: These can be used to simplify the sharing of QuickSight
    assets across multiple teams and BI developers.


    > > **Note**

    > > Only a QuickSight Admin user can create shared folders. Ownership of shared
    folders can be transferred to another user who belongs to the Author user cohort.
    Personal folder ownership always belongs to the user who created it.


    To create folders, you can use either the QuickSight Console or QuickSight API.
    To better understand how to use folders, we will use a hands-on example using
    the New York Taxi sample dataset, analysis, and dashboard configured in _Chapter
    4, Developing Visuals and Dashboards_.


    # ## Working with personal folders


    In this section, we will work with personal folders and use them to group different
    assets together. For our example, let''s assume that the Author user needs to
    organize all assets (datasets, analyses, and dashboards) of a specific project
    together. This will allow them to organize the QuickSight assets as they develop
    different projects.


    To organize these assets, you can use QuickSight folders:


    +   1. First, log into the QuickSight console as the Author user.

    +   2. Then, click **My folders**, and then click **+ New** in the top right-hand
    corner.'
