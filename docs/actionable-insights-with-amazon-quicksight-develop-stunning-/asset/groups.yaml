    # 10 Amazon QuickSight 中的多租户


    在本章中，我们将学习如何在 **Amazon QuickSight** 中设置多租户。具体来说，我们将探讨多租户架构，并了解 QuickSight 命名空间如何帮助我们构建多租户环境。


    本章将涵盖以下主题：


    - - 使用命名空间介绍多租户

    - - 设置多租户


    ## 技术要求


    本章，您需要访问以下内容：


    - - 一个 AWS 帐户和 **AWS Identity and Access Management (IAM)** 用户，具有提升的访问权限

    - - 一个配置了管理员用户的 Amazon QuickSight（企业版）帐户

    - - 在 _第 4 章，开发可视化和仪表板_ 中创建的仪表板


    ## 使用命名空间介绍多租户


    在本节中，我们将介绍 Amazon QuickSight 中多租户的概念。根据我们迄今所学的知识，拥有 QuickSight 资产的用户可以将资源与帐户中的任何其他注册用户共享。但是，存在单个
    QuickSight 帐户需要支持多个 **租户** 的用例。


    ### 了解多租户


    QuickSight 提供允许开发人员构建多租户 **商业智能 (BI)** 平台的功能。由于其云原生架构，QuickSight 会根据用户数量自动扩展。此功能结合
    QuickSight 的嵌入功能及其可通过编程方式访问的 API 操作，帮助开发人员实现多租户 BI 平台。


    多租户平台的一个关键特征是租户之间不相互交互，这有效地防止租户向属于另一个租户的用户授予（或撤销）访问权限。此外，不同租户通常对其用户有不同的权限要求，以及不同的
    _外观和感觉_ 要求。多租户平台可以服务于大型企业，其中租户可以是公司的每个子公司或独立部门。


    另一个用例是软件供应商向其客户提供 BI 功能。在此示例中，平台的每个租户都将代表软件供应商的一个客户。每个租户都能够管理自己的 BI 资产并与自己的用户共享（但不与其他租户共享）。对于此场景，租户通常通过
    Web 门户访问 QuickSight。为了分离和组织来自不同租户的用户，QuickSight 引入了 _命名空间_ 的概念。


    在下一节中，我们将介绍 QuickSight 命名空间。


    # 介绍 QuickSight 命名空间


    为了解决多租户要求，Amazon QuickSight 引入了命名空间 API。命名空间 API 允许组织构建多租户环境，而无需创建多个 QuickSight
    帐户。


    QuickSight 命名空间是用户和组的逻辑容器，可用于分离不同的部门或组织。同一命名空间内的用户可以相互共享资产，而来自不同命名空间的用户无法相互交互。


    命名空间可以是以下之一：


    - 默认命名空间


    - 自定义命名空间


    创建新 QuickSight 帐户时，您的第一个作者和管理员用户将属于 *默认* 命名空间。您创建的任何其他命名空间都是 *自定义* 命名空间。


    ![](img/33bad1d211a2d93fd743a1978d403f9a_219_0.png)


    用户不能属于多个命名空间。无法在命名空间之间移动用户。其他 QuickSight 资产，如分析仪表板和数据集，不专属于命名空间。相反，使用 Access API
    管理对 QuickSight 资产的访问，如我们在第 8 章《了解 QuickSight API》中所学。因此，可以通过编程方式将资产与不同命名空间的用户共享。例如，组织可能需要将共享仪表板与所有命名空间的所有用户共享。


    下图描绘了多租户 BI 分析的示例架构：


    ![](img/33bad1d211a2d93fd743a1978d403f9a_220_0.png)


    图 10.1 – 多租户架构


    该架构的主要组件如下：


    - • **自定义命名空间**：用于组织来自不同租户的用户。


    - • **默认命名空间**：用于管理员用户。


    - • **Amazon SPICE 和数据集**：特定于 QuickSight 帐户。对这些资源的访问是单独使用 QuickSight API 管理的，如我们在
    _第 3 章，使用 Amazon QuickSight 准备数据_ 和 _第 9 章，管理 QuickSight 权限和用量_ 中所学。


    - • **嵌入式门户和身份存储**：允许用户进入 QuickSight 控制台。对于不需要嵌入式 Web 门户的用例，可以改用 QuickSight Web
    应用程序。嵌入式门户可以是任何自定义构建的 Web 应用程序。如何构建 Web 应用程序的实现细节超出了本书的范围。


    现在我们已了解在 QuickSight 中使用多租户架构的基础知识，在下一节中，我们将查看一个实际操作示例。


