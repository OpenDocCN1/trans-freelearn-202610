    # # Summary


    Congratulations on completing this chapter. In this chapter, we learned about
    the embedding capabilities of Amazon QuickSight and talked about the different
    types of embedded analytics. We started by focusing on its main drivers and business
    benefits. We learned about the main architectural components of dashboard embedding,
    and then we identified key AWS services that can be used to build these architectural
    layers. We discussed the end-to-end flow of embedded analytics. Finally, we used
    simple CLI commands to generate a read-only dashboard URL so that we could see
    the APIs in action.


    In the next chapter, we will focus on managing QuickSight and learn how to automate
    operations using the QuickSight API.


    # # Q&A


    Answer the following questions to test your knowledge of this chapter:


    +   1. What are the main drivers for dashboard embedding?

    +   2. What are the different types of embedded analytics with Amazon QuickSight?

    +   3. What is the role of the STS service in the embedded analytics flow?

    +   4. What is session capacity planning and what type of embedded analytics is
    relevant to it?

    +   5. What are the different layers in the embedded analytics architecture?


    # # Further reading


    For more information on the topics that were covered in this chapter, take a look
    at the following resources:


    +   • QuickSight User Guide – AWS: https://docs.aws.amazon.com/ QuickSight/latest/user/amazon-QuickSight-user.pdf

    +   • Working with Embedded Analytics – AWS: https://docs.aws.amazon.com/ QuickSight/latest/user/embedded-analytics.html

    +   • Build Your First Serverless Web Application – AWS: https://aws.amazon.com/
    serverless/build-a-web-app/'
