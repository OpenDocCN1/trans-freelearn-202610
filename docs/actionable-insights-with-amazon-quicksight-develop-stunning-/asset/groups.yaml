    - • Build Your First Serverless Web Application – AWS: https://aws.amazon.com/\
    \ serverless/build-a-web-app/\n\n"
  mdcn: "\n\nPolicies can be assigned to IAM roles, which can be assumed by applications\
    \ before they call AWS services. A policy will determine the level of access to\
    \ AWS. The next important step is to establish a trust relationship between the\
    \ IAM identity provider and the role so that authenticated entities can assume\
    \ the role and generate the embedding dashboard URL. When you create an IAM role,\
    \ you will need to select the type of trusted entity. The choice is between an\
    \ AWS service, such as a role that can be assumed by a service, for example, AWS\
    \ Lambda, another AWS account, a web identity such as Amazon Cognito or other\
    \ OpenID identity providers, or SAML 2.0 Federation for corporate users. You will\
    \ see the following when selecting the type of your entity when creating a role:\n\
    \n![](img/33bad1d211a2d93fd743a1978d403f9a_157_0.png)\n\nOnce you create the role,\
    \ you can attach a policy with the required permissions to call the QuickSight\
    \ APIs for the dashboard embedding. To get the temporary credentials, your web\
    \ application layer will need to call the **Amazon STS** service’s `AssumeRole`\
    \ API or `AssumeRoleWithSAML` or `AssumeRoleWithWebIdentity`, depending on the\
    \ identity provider. Once you have the required credentials, then your web application\
    \ will be able to call the QuickSight APIs to retrieve the embed URL, which is\
    \ then added to your web frontend.\n\n## 把所有内容整合在一起\n\nNow that we have looked\
    \ at the main architectural components of the architecture, we will enrich _Figure\
    \ 7.1_ by adding more specific components (including the relevant AWS services)\
    \ to each of its layers.\n\nFor the authentication layer, we can use the following\
    \ AWS services:\n\n- **IAM** to define your required roles\n- A **Cognito** User\
    \ Pool or another compliant IDP as the identity provider\n\nFor the web application\
    \ layer, we can use the following services:\n\n- AWS **Lambda**, **S3**, and **API\
    \ Gateway**. There are several examples online of how to use these services to\
    \ build a serverless web application using these services.\n- Other options include\
    \ hosting our web app using **container** services or using Amazon **EC2** instances.\
    \ You are not limited to hosting your web application on AWS; you can host your\
    \ web application anywhere, including on-premises if you need to.\n\nFor the BI\
    \ layer, we can use the following service:\n\n- **Amazon QuickSight**, including\
    \ its SPICE storage\n\nFor the data layer, we can use the following services:\n\
    \n- **Amazon S3** as the central data lake storage.\n- **Amazon Athena**, which\
    \ allows you to perform SQL queries over data stored in S3 or other data stores\
    \ (using Federated Query: `https://docs.aws.amazon.com/athena/latest/ug/connect-to-a-data-source.html`).\n\
    - **Amazon Redshift** as a data warehouse. **Snowflake**, another popular cloud\
    \ data warehouse, is also natively supported.\n- Other databases that are hosted\
    \ inside or outside AWS.\n\nAfter adding these components, our architecture diagram\
    \ will look as follows:\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_159_0.png)\n\
