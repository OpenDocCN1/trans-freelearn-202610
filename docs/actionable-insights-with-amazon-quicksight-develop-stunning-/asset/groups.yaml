    # Contributors


    ## About the author


    **Manos Samatas** is a solutions architect specializing in big data and analytics.
    He has several years of experience developing and designing big data applications
    for various industries, including telecommunications, cybersecurity, healthcare,
    and the public sector. He is an accredited AWS **Subject Matter Expert** (SME)
    in analytics and he possesses the AWS Data Analytics Specialty and the AWS Solutions
    Architect Professional certifications. Manos lives in London with his fiancée
    Gabriela. In his free time, he enjoys traveling, socializing with friends, and
    taking care of his plants.


    # About the reviewers


    **Madhavan Sriram** is a manager of data science at Amazon and focuses on building
    data-intensive products for Amazon''s transportation business. His team processes
    over 200 TB of data annually to build intelligent products that enable automated
    warehouse operations by leveraging machine learning, big data, and visualisation
    techniques. His research focus areas are in the space of big data and machine
    learning from an applied context. In the past, he worked for several large enterprises
    including IBM, Toyota, and Royal Philips on furthering their science and data
    landscape. He and his wife reside in Luxembourg and enjoy spending the time outdoors
    with their furry golden retriever "Richard Parker".


    **Raquel Marasigan** is an information security engineer II lead at CBSPI, where
    she analyses the effectiveness of security strategies. Raquel earned her Bachelor
    of Arts from Arellano University, majoring in political science. Her interest
    in technology and security motivated her to continue her education in data analytics.
    She is currently enrolled with the University of Asia and the Pacific, completing
    a Masters Applied Business Analytics degree, and completing her capstone project
    for the 2022 school year. Raquel is fortunate to work alongside the author, Jason
    Dunn, Mia Heard, and other experts in the AWS Community Builders and AWS Users
    Group where they share their insights. Many thanks to Raquel''s two sons for their
    encouragement throughout the process of reviewing this book.


