  mdcn: "\n\n## 创建计划\n\n时区\n\nEurope/London\n\n重复\n\n每天\n\n开始\n\n每小时\n\n每天\n\n每周\n\
    \n每月\n\n取消\n\n创建\n\n图 3.12 – “创建计划”对话框\n\n现在，我们已经了解了如何配置 SPICE 数据集、安排自动刷新以及监控刷新作业，在下一节中，我们将学习如何通过重命名列和数据类型来编辑数据集。\n\
    \n## 编辑列名和数据类型\n\nBI 开发人员在构建可视化之前编辑数据集是很常见的。例如，列名直接来自数据库时，可能不够用户友好或不够描述性。在设计 BI\
    \ 应用程序时，我们需要从最终用户的角度出发，并尝试以友好且描述性的方式命名列，使其在 BI 应用程序的上下文中易于理解。同样重要的是，要确保数据集中的每个字段都具有预期的数据类型，以便我们可以执行所需的计算。在本节中，我们将提供一个分步指南，介绍如何使用我们之前配置的\
    \ SPICE 数据集来编辑列和数据类型。\n\n### 重命名列\n\n使用数据集编辑器重命名列是一个简单的过程：\n\n1. 首先，我们通过访问数据集并选择\
    \ **编辑数据集** 选项来开始，这将带我们进入数据集编辑器页面。\n\n2. 在数据集编辑器中，我们可以看到数据的预览，包括列名，如下图所示。\n\n\
    ![](img/33bad1d211a2d93fd743a1978d403f9a_74_0.png)\n\n图 3.13 – 数据集预览屏幕\n\n3. 接下来，我们可以通过单击列名旁边的铅笔图标来简单地重命名列名。例如，让我们将\
    \ `tpep_pickup_datetime` 列重命名为更用户友好的名称 `Pick up date`，如下图所示。在此阶段，我们还可以为列添加描述，以便向其他可能处理同一数据集的作者描述该列。\n\
    \n![](img/33bad1d211a2d93fd743a1978d403f9a_74_1.png)\n\n图 3.14 – “编辑字段”对话框\n\n\
    现在我们已经了解了如何编辑列名和描述，在下一节中，我们将了解如何编辑数据类型。\n\n## 更改数据类型\n\n通过为每个列使用正确的数据类型，我们可以确保访问数据集中每个列的正确功能。例如，QuickSight\
    \ 支持日期列类型的时间聚合。如果日期列被错误地映射为字符串列，则无法使用这些聚合。同样，计算平均值或最小值/最大值等计算仅适用于数值数据类型。如果我们需要执行和可视化这些计算，我们需要确保已应用数值数据类型。\n\
    \nQuickSight 支持以下数据类型：\n\n- 字符串\n- 日期\n- 十进制\n- 整数\n\n还支持以下地理空间类型：\n\n- 县\n- 州\n\
    - 城市\n- 邮政编码\n- 纬度\n- 经度\n\n现在，让我们看一个快速的动手示例，了解如何在数据集中编辑数据类型。对于此示例，我们将使用 `yellowtrips`\
    \ 数据集（在 `yellowtrips_3mo` 集中，列数据类型似乎是正确的，因此没有什么可编辑的）。\n\n1. 首先，我们需要访问 `yellowtrips`\
    \ 数据集并导航到数据集编辑器。\n2. 在此数据集中，您可以看到日期列已被识别为字符串。这是我们需要编辑的内容，以便我们可以在后续分析中使用基于时间的聚合。\n\
    \n3. 要更改数据类型，我们需要单击列名下的数据类型（在此示例中为 **字符串**）并选择 **日期**。\n\n4. 接下来，QuickSight 将打开编辑日期格式弹出屏幕，如下图所示。我们需要定义数据集的日期格式。在我们的示例中，这是\
    \ `yyyy-MM-dd HH:mm:ss`，其中 `yyyy` 表示使用四位数的年份（例如，2020）；`MM` 表示使用两位数的月份（例如，2 月为\
    \ `02`），语法中的其他元素也是类似。一旦我们输入日期格式，QuickSight 将根据所选的日期格式验证我们的数据集，以确保数据符合该格式。\n\n\
    ![](img/33bad1d211a2d93fd743a1978d403f9a_76_0.png)\n\n图 3.15 – 编辑日期格式\n\n我们可以对\
    \ `tpep_dropoff_datetime` 列重复此过程。现在我们已经了解了如何编辑列，包括更改列名和类型以及添加描述，在下一节中，我们将学习高级数据集操作，包括联接和安全控制。\n\
    \n## 使用高级操作\n\n在本节中，我们将重点介绍高级数据集操作。我们将学习如何向数据集添加计算字段并应用数据集操作，例如筛选和联接。最后，我们将添加安全控制，包括行级和列级筛选器。对于本节，我们将使用本章前面配置的\
    \ SPICE 数据集。\n\n### 添加计算字段\n\nQuickSight 允许 BI 开发人员在数据准备阶段向其数据集添加计算字段。然后，可以使用包含计算字段的数据集来开发多个分析。\n\
    \nQuickSight 提供了一系列预构建函数，我们可以在构建计算字段时使用。这些函数包括以下内容：\n\n- **聚合函数** 用于计算多个值上的指标。例如，我们可以使用\
    \ `min()` 函数来计算一组值的最小值。\n- **条件函数** 允许我们在计算字段中使用条件逻辑，例如，如果传递的参数不为 null，`isNotNull()`\
    \ 返回 `true`。\n- **日期函数** 帮助我们处理日期列类型。例如，我们可以使用 `dateDiff()` 函数来计算两个日期字段之间的差异。\n\
    - **数值函数** 和 **字符串函数** 可以分别帮助我们处理数值和字符串值。例如，我们可以使用 `abs()` 函数计算给定表达式的绝对值，或者可以使用\
    \ `concat()` 函数连接两个或多个字符串。\n- 最后，**表计算** 可用于发现维度如何影响特定度量。例如，`sumOver()` 函数按维度列表分区计算度量的总和。\n\
    \n## 60 使用 Amazon QuickSight 准备数据\n\n要添加计算字段，我们执行以下操作：\n\n1. 首先，我们需要在数据集编辑器中打开数据集。\n\
    2. 然后，我们可以简单地选择 **添加计算字段** 选项来进入计算字段编辑器，如下图所示：\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_78_0.png)\n\
    \n图 3.16 – 计算字段编辑器\n\n3. 接下来，让我们添加第一个计算字段。在我们的数据集中，虽然我们有接车时间和下车时间，但获取这两个时间戳之间以分钟为单位的差异可能很有趣。要计算此差异，我们可以键入以下内容：\n\
    \n```\ndateDiff({Pick up Date},{tpep_dropoff_datetime},\"MI\")\n```\n\n4. 最后，让我们给它一个描述性的名称，例如\
    \ `Trip duration (mins)`，然后单击 **保存**。\n\n现在我们可以在数据集编辑器中观察新的计算字段。接下来，我们将看到其他数据集操作，包括筛选和联接。\n\
    \n## 筛选和联接数据集\n\n在本节中，我们将讨论如何筛选和联接数据源。\n\n### 筛选数据集\n\n存在您可能需要从数据源中获取表子集的场景。 \
    \ \nQuickSight 支持数据源筛选，以便您可以将数据集所需的子集导入  \n到 SPICE。这允许您仅使用真正需要的 SPICE 容量来构建高效的\
    \ BI 解决方案。在 QuickSight 中添加筛选器很简单。在以下示例中，我们  \n将看到如何从我们之前创建的数据集中筛选出列和行的示例：\n\n\
    1. 首先，您需要访问数据集编辑器。在左侧，您可以找到 **排除的字段** 和 **筛选器** 菜单。\n2. 对于此示例，让我们假设我们对 `store_and_fwd_flag`\
    \ 列中的信息不感兴趣。要从数据集中排除此列，请展开 **排除的字段** 选项，然后选择 `store_and_fwd_flag`。\n3. 现在我们已经删除了一个列，让我们应用一个筛选器来删除行。让我们假设对于此分析，如果距离显示为\
    \ 0.0，我们不想包含行程，并且我们只希望值大于 0 的数据。\n4. 展开 **筛选器** 菜单并选择 `trip_distance` 列。从下拉菜单中选择\
    \ **大于**，然后输入 `0`。添加这些值后，筛选器应如下图所示：\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_79_0.png)\n\
    \n图 3.17 – 添加数据集筛选器\n\n5. 接下来，单击 **应用**。QuickSight 将为数据集触发刷新作业。\n\n"
