    # # Controlling resources using the QuickSight API


    In this section, we will learn how to control QuickSight resources using the QuickSight
    API. This section is not meant to be a full reference guide to the QuickSight
    API, nor is it going to cover every possible action that can be done using the
    API. For a full reference guide to the QuickSight API, please refer to the QuickSight
    documentation:

    https://docs.aws.amazon.com/quicksight/latest/APIReference/ Welcome.html


    This section will provide you with practical hands-on examples of using the API
    to control QuickSight resources. These examples will give you a solid understanding
    of the types of activities that can be completed using the API, which in turn
    will help you to manage your QuickSight environment.

    Our first example will be to learn how to set up a data source using the QuickSight
    API.


    # # Setting up a dataset using the CLI


    In Chapter 2, Introduction to Amazon QuickSight, we learned how to create data
    sources and datasets. To create these resources, we accessed the QuickSight GUI
    via our web browser. While the GUI is user-friendly, we can create datasets programmatically
    using the API. This can be a good option when we need to ensure the consistency
    of a specific configuration, as manual configurations can be prone to errors.
    Let''s create a data source from the data warehouse we created in Chapter 1, Introducing
    the AWS Analytics Ecosystem.


    > Note

    > The tutorial from Chapter 1, Introducing the AWS Analytics Ecosystem, included
    creating a sample Amazon Redshift cluster, which will incur charges. For this
    tutorial, you don''t need the cluster running. A paused cluster can work well
    for this example, as we only need to configure the dataset and we won''t need
    a live connection to it.


    Now, let''s create a Redshift data source using the CLI. We will use the create-data-
    source CLI command to create a Redshift data source:

    https://docs.aws.amazon.com/cli/latest/reference/quicksight/ create-data-source.html'
