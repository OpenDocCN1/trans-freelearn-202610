    ## 将参数链接到筛选器


    在我们仍处于分析状态并以作者用户身份登录的情况下，要将参数链接到筛选器，我们需要执行以下操作：


    1. 首先，找到我们之前创建的筛选器。您可以单击已应用筛选器的可视化对象，然后单击左侧菜单中的“筛选器”项。


    2. 现在单击 **Edit**，或直接单击我们之前创建的 **Payment Type** 筛选器。


    3. 要将筛选器与参数链接，我们需要从 **Filter Type** 下拉菜单中选择 **Custom filter**。


    4. 接下来，勾选 **Use parameters** 复选框。


    5. 接下来，会出现一个弹出窗口，询问您是否要更改筛选器的范围。由于我们不需要筛选分析中的其他可视化对象，我们将选择 **No**。


    > Note

    > 创建参数后，随时可以编辑筛选器的范围。范围更新将立即生效，无需更新参数或控件。


    6. 从下拉菜单中，选择我们之前创建的 `paymenttype` 参数。以下屏幕截图显示了将筛选器链接到参数时筛选器配置的外观：


    ![](img/33bad1d211a2d93fd743a1978d403f9a_119_0.png)


    图 5.6 – 将筛选器链接到参数


    7. 单击 **Apply**，然后单击 **Close**。


    现在，我们的筛选器和参数已连接，筛选器将继承参数的默认值。在我们的示例中，我们使用了多值参数。我们可以确认，透视表仅显示包含参数默认值的记录。现在我们已将参数与可视化对象链接，将学习如何添加屏幕控件，并允许读者更改参数值。


    ## 添加屏幕控件


    QuickSight 允许您添加屏幕控件，以便读者用户可以动态设置参数的值。在我们的示例中，设置 `paymenttype` 参数的值将导致 **Payment
    Type** 筛选器的值发生变化，该筛选器已应用于透视表可视化对象。要添加屏幕控件，请执行以下步骤：


    1. 首先，从左侧菜单中选择 **Parameters** 项。


    2. 然后，选择我们之前创建的 `paymenttype` 参数。从下拉菜单中，单击 **Add control**，如下所示：


    ![](img/33bad1d211a2d93fd743a1978d403f9a_120_0.png)


    图 5.7 – 添加屏幕控件


    3. 从控件的创建设置中，我们需要定义以下参数：


    - **Display Name**：屏幕控件的用户友好名称。在我们的示例中，我们使用了 `Payment Type`。


    - **Style**：用户用于设置参数的控件类型。控件样式选项也由参数的数据类型决定。例如，如果我们的参数是日期类型，则 **Date Picker**
    将是可用选项之一。在我们的示例中，我们将使用 **List – Multiselect** 样式，如以下屏幕截图所示。此类型将允许用户从下拉菜单中选择多个值。


    - **Values**：用户可以选择的值。您可以将这些值链接到数据集中的值，这可确保可用值与数据集同步，因此无需单独维护这些值。在我们的示例中，我们链接了
    `Payment Type` 字段的值。以下屏幕截图显示了屏幕控件配置示例：


    ![](img/33bad1d211a2d93fd743a1978d403f9a_121_0.png)


    4. 单击 **Apply** 以添加屏幕控件。


    现在我们已添加屏幕控件，拥有了发布交互式仪表板所需的所有组件。让我们来看看使仪表板实现交互性的一系列事件：


    1. 首先，用户使用屏幕控件选择值。


    2. 所选值将传递给参数。


    3. 然后，这些参数用作筛选条件。


    4. 最后，筛选器范围内的可视化对象在用户选择后更新。


    以下图表描述了此处所述的流程：


    ![](img/33bad1d211a2d93fd743a1978d403f9a_122_0.png)


    图 5.9 – 交互式筛选组件


    现在我们已配置所有必需的组件，让我们来测试屏幕控件：


    1. 首先，请注意，在屏幕顶部，我们有一个名为 **Controls** 的新部分，其中包含新创建的 Payment Type 屏幕控件。以下屏幕截图显示了新创建的控件：


    ![](img/33bad1d211a2d93fd743a1978d403f9a_123_0.png)


    图 5.10 – 多选控件


    2. 更改此控件的选择将自动更改 `paymenttype` 参数的值，该参数已配置为与我们的 Payment Type 筛选器协同工作。


    3. 您可以从筛选器控件访问其他选项。可用选项之一允许您将控件从屏幕顶部分离并添加到分析表中。这是范围较窄的筛选器的一个好选项。在我们的示例中，我们的筛选器仅覆盖单个可视化对象，因此将控件放在可视化对象旁边可能会提供更好的整体用户体验，同时节省屏幕顶部的空间。以下屏幕截图显示了将屏幕控件放置在透视表旁边：


    ![](img/33bad1d211a2d93fd743a1978d403f9a_123_1.png)


    图 5.11 – 放置在分析表上的屏幕控件


    现在我们已配置分析并安排了屏幕控件，可以将分析发布为仪表板并与读者用户共享。至此，我们已创建第一个真正交互式的 QuickSight 仪表板。接下来，我们将学习如何使用操作向仪表板添加更多交互式控件。


    ## 使用操作


    QuickSight 操作允许您向仪表板添加交互性。它们可以是以下任意一种：


    - **筛选器操作**

    - **导航操作**

    - **URL 操作**


    接下来，我们将更详细地了解每种操作类型。为了理解每种类型，我们将使用纽约出租车示例分析来配置它们。


    ## 使用筛选器操作


    URL 操作允许我们在用户单击仪表板特定区域时立即筛选数据。筛选器操作使读者更容易专注于分析的特定数据点。


    在配置筛选器操作时，您需要选择分析中的一个可视化对象，然后提供以下信息：


    - **操作名称**：筛选器操作的用户友好且具有描述性的名称。

    - **激活方式**：**菜单选项** 或 **选择**：**菜单选项** 会在您单击可视化对象中的数据点时添加一个菜单项。单击该选项时，将激活 URL 操作。另一方面，使用
    **选择** 选项时，您的 URL 操作将在单击数据点时直接激活。

    - **筛选器范围**：哪些可视化对象将被筛选。


    为了理解筛选器操作，我们将使用纽约出租车分析中的一个示例。假设我们希望用户立即关注特定行政区，并更新 KPI 和桑基图可视化对象以仅反映所选行政区。要选择行政区，我们将使用显示每个行政区平均小费的柱状图，我们在
    _第 4 章，开发可视化对象和仪表板_ 中配置了该图表：


    1. 首先，导航到分析，通过单击选择柱状图可视化对象。


    2. 接下来，在选中可视化对象的情况下，从左侧菜单中单击 **操作**。


    3. 单击 **添加操作**，然后从 **操作类型** 下拉菜单中选择 **筛选器操作**。


    4. 添加以下屏幕截图中显示的值：


    ![](img/33bad1d211a2d93fd743a1978d403f9a_125_0.png)


    图 5.12 – 筛选器操作


    我们将更新以下参数：


    - **操作名称**：`Filter by borough`


    - **激活方式**：**选择**


    - **筛选器范围**：选定字段


    - **目标可视化对象**：KPI 和桑基图可视化对象


