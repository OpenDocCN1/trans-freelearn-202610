    # Introducing Amazon QuickSight


    Amazon QuickSight is a **business intelligence (BI)** cloud-native service. BI
    developers use QuickSight to develop data visualizations and dashboards and report
    the state of the business. Being cloud-native **BI** software, QuickSight can
    scale to thousands of users without the need to provision additional compute capacity.
    In fact, the concept of compute capacity doesn''t exist in QuickSight: AWS is
    responsible for scaling QuickSight up or down when demand grows or shrinks, while
    BI developers focus on developing data visualizations.


    Next, we will define the following core concepts of QuickSight:


    - Datasets

    - Analysis

    - Visuals and insights

    - Dashboards


    ## Datasets


    **QuickSight datasets** are the data imported into QuickSight for visualization;
    a dataset can be built from one or more data sources. Amazon QuickSight supports
    a number of data sources. Datasets can either be cached in QuickSight (SPICE,
    which we will cover later in this chapter) or query the data source directly.
    We will discuss data sources and data preparation in more detail in _Chapter 3,
    Preparing Data with Amazon QuickSight_.


    > **Note**

    > Datasets and data sources are different concepts in QuickSight. A dataset can
    consist of one or more data sources. Typically, a degree of data preparation is
    applied to a data source before it becomes a dataset.


    ## Analysis


    An analysis in QuickSight refers to the editing part of the application, typically
    used by a BI developer to build their visualizations. We will see how to create
    an analysis in _Chapter 4, Developing Visuals and Dashboards_.


    > **Note**

    > A QuickSight analysis can be developed against one or more datasets.


    # Visuals and insights


    A QuickSight analysis consists of onscreen components/widgets that contain data
    visualizations. A BI developer can add two different types of these components:


    - Visuals

    - Insights


    **Visuals** are graphical representations of a dataset commonly using plot types
    and charts. Other visual types include tables (simple or pivot), geospatial visualizations
    such as maps, and others. We will cover the various visual types in detail in
    _Chapter 4, Developing Visuals and Dashboards_.


    > **Tip**

    > QuickSight has a special visual type called **AutoGraph**. It appears with the
    symbol. When selected, QuickSight automatically identifies and applies the most
    appropriate visual type for the data types and fields selected.


    **Insights** are special components that use common analytical or ML functions
    to provide insights into data. The result of an insight appears in natural language.
    Amazon QuickSight provides both pre-built insights and customizable insights.
    We will talk more about QuickSight insights in _Chapter 6, Working with ML Capabilities
    and Insights_.


    # Dashboards


    Once an analysis is developed and ready to be published, a BI developer can export
    it into a QuickSight dashboard. A dashboard is a read-only version of an analysis.
    A dashboard is typically accessed by business users and shared by BI developers
    for reporting reasons. A BI developer can also add custom controls and add interactivity
    to their dashboards. We will cover QuickSight dashboards in detail in _Chapter
    4, Developing Visuals and Dashboards_.


    Next, we will define the different user roles found in Amazon QuickSight.


    # Introducing Amazon QuickSight user types


    QuickSight supports three different user types:


    - Admin

    - Author

    - Reader

