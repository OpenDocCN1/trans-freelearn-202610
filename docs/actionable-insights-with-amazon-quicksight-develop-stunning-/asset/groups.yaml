    to be defined upfront, before any data is added. This approach is called **schema
    on write**, and it ensures that data conforms to a specific structure before being
    ingested into the data warehouse. However, it can be less flexible, and it may
    introduce complexity when dealing with evolving schemas. Evolving schemas are
    an increasingly common scenario because organizations need to capture more and
    more data points from their customer interactions to drive data-driven decisions.


    On the other side, data lakes don’t enforce a schema upfront. Instead, applications
    that have the required permissions can write data to a data lake. Structure and
    data formats aren’t enforced by the data lake: it is a responsibility of the writing
    application.


    Data stored in a data lake has few to no limitations regarding its format: it
    can be **structured**, **semi-structured**, or completely **unstructured**. For
    many datasets, a schema can be inferred, either because the data is semi-structured
    (CSV, JSON, and others), or they follow patterns that can be identified after
    applying regular expressions and extracting specific columns. In data lakes, the
    schema is inferred when the data is read by the querying application. This approach
