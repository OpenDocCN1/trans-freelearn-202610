    最后一步将重定向到分析 Web 界面。我们将在 _第 4 章，开发可视化和仪表板_ 中使用此界面。目前，单击屏幕左上角（QuickSight 标志）返回 QuickSight
    主页。您可以通过访问左侧的数据集菜单来验证新创建的数据集。


    要配置 Redshift Spectrum 表，请重复上述步骤。在架构和表选择步骤中，选择 **spectrum_schema**（而不是 **public**）以及该架构下的
    **yellowtrips** 表。然后重复之前的步骤，为我们之前配置的 Spectrum 表配置第二个 Redshift 数据源。请注意，Redshift
    Spectrum 表不会加载到数据仓库中；相反，它们位于我们的数据湖中，可以直接从该处访问和查询。


    > Note

    > 要访问 Spectrum 表中的数据，QuickSight 需要能够访问 Amazon S3 中的底层数据。


    ## 设置 S3 数据源


    QuickSight 的常见数据源是 S3。例如，您可能希望可视化存储在 Amazon S3 中的 CSV 文件。在配置 S3 数据源之前，您需要确保您的
    QuickSight 账户拥有访问存储文件的 S3 位置所需的权限。


    > Note

    > QuickSight 不会自动继承对新创建存储桶的访问权限。即使您启用了 **Access all buckets in my account** 复选框，QuickSight
    也只会在该时间点获取对账户中每个存储桶的访问权限，而不会获取从该时间点之后创建的任何存储桶的访问权限。如果您需要为新存储桶添加权限，您需要 AWS 管理员来管理
    QuickSight 服务对账户中 AWS 服务的权限。


    对于 S3 数据源，QuickSight 需要一个包含设置数据集所需信息的清单文件。清单文件采用 JSON 格式，包含以下对象：


    - **fileLocations**：在此处，您只需使用 `URIs` 属性追加文件的完整 S3 URI（作为 JSON 数组）来定义需要导入的文件（或文件）的
    S3 位置。如果您想要添加特定 S3 前缀（类似于传统文件系统中的文件夹）下的所有文件，可以填充 `URIPrefixes` 属性。


    - `globalUploadSettings`：`globalUploadSettings` 是可选的。您可以使用此属性覆盖 QuickSight 的默认选项。QuickSight
    默认使用 **CSV 格式**，使用 "," **(逗号)** 字段分隔符和 **双引号** (") 作为文本限定符。默认情况下，QuickSight 将使用
    CSV 文件的第一行作为 **header**，这意味着第一行将确定数据集字段名称，并且不会被视为数据集中的值。


    现在我们已经了解了如何配置某些数据集类型，在下一节中，我们将使用 QuickSight 数据集编辑器编辑数据集。


    # 编辑数据集


    在本节中，我们将更仔细地查看作者用户编辑数据集通常需要执行的任务。在实际应用中，数据集通常需要进行一定程度的处理，以便 QuickSight 可以最佳地使用它们。


    这些任务包括以下内容：


    - Importing into SPICE

    - Renaming fields

    - Changing the field types

    - Adding calculated fields

    - Combining datasets together

    - Applying security filters


    在下一节中，我们将学习如何使用之前配置的示例数据集完成这些任务。


    # 导入到 SPICE


    是时候学习如何将数据集导入 SPICE 了。我们将使用数据集编辑器更改查询模式，然后观察导入作业的状态。最后，我们将学习如何为 SPICE 数据集安排自动刷新作业。


    # 设置数据集查询模式


    在本章前面，我们将 Redshift 数据集配置为 Direct Query。假设我们意识到数据仓库正忙于为许多应用程序提供服务并为组织生成报告，因此我们更愿意将数据导入
    SPICE，以便 QuickSight 仪表板使用 SPICE 存储，而不是直接访问数据仓库。将数据导入 SPICE 后，我们的数据仓库将仅用于数据导入，而不用于查询数据以填充仪表板。


    现在让我们将数据集添加到 SPICE 并配置其导入持续时间：


    1. 首先，您需要以我们之前创建的作者用户身份登录。

    2. 然后，在左侧菜单中选择 datasets 以获取所有数据集的列表。

    3. 对于此实践示例，我们将 `yellowtrips_3mo` 数据集导入 SPICE。单击 `yellowtrips_3mo`，然后在您在以下屏幕截图中看到的弹出窗口中单击
    **Edit dataset**。


    ![](img/33bad1d211a2d93fd743a1978d403f9a_69_0.png)


    图 3.6 – 数据集弹出屏幕


    4. 现在我们应该位于数据集编辑器主页面。在此页面上，我们将在本节后面完成大多数编辑和转换数据集的操作。目前，我们只需将 **Query mode** 设置为
    **SPICE**，如以下屏幕截图所示。完成后，单击 **Save**。


    ![](img/33bad1d211a2d93fd743a1978d403f9a_70_0.png)


    图 3.7 – 将数据集查询模式设置为 SPICE


    5. 您会注意到我们的数据集现在被标记为 SPICE 数据集。现在我们首次设置了 SPICE 数据集，QuickSight 将在后台自动运行其第一个导入作业。


