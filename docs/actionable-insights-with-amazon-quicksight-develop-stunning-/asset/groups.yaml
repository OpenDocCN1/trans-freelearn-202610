    \ the QuickSight console as the author-a user. Then, navigate to\n+   Dashboards\
    \ to view the available dashboards. The New York Taxi dashboard\n+   should now\
    \ be available for you to view, as shown in the following screenshot:"
  md: "\n\n## Setting up multitenancy\n\nIn this chapter, we will set up a simple\
    \ multi-tenant environment using the namespace API. This exercise will help you\
    \ understand how to set up multi-tenant environments as a QuickSight Admin user.\
    \ It will also help you understand what your BI users’ experience will be in multi-tenant\
    \ scenarios, and how QuickSight prevents users from sharing assets with other\
    \ tenants.\n\n## Creating a namespace\n\nCreating namespaces is simple, and it\
    \ can be done using the QuickSight API. At the time of writing, it is not possible\
    \ to create namespaces through the QuickSight **graphical user interface (GUI)**:\n\
    \n1. First, you need to log into Amazon QuickSight as the QuickSight Admin user.\n\
    2. Next, open the **AWS Command Line Interface (CLI)**, and type the following\
    \ command, replacing the highlighted values with the values from your environment.\
    \ For this exercise, we will create a custom namespace called `companyA`. Note\
    \ that we already have a default namespace for our existing Admin, Author, and\
    \ Reader users used throughout this book:\n\n   ```bash\n   $aws quicksight create-namespace\
    \ --aws-account-id <account-id> --namespace companyA --identity-store QUICKSIGHT\n\
    \   ```\n\n   This will result in an asynchronous creation of the new namespace.\
    \ Note, in the CLI response, the status is `CREATING`:\n\n   ```json\n   {\n \
    \   \"Status\": 202,\n    \"Name\": \"companyA\",\n    \"CapacityRegion\": \"\
    us-east-1\",\n    \"CreationStatus\": \"CREATING\",\n    \"IdentityStore\": \"\
    QUICKSIGHT\",\n    \"RequestId\": \"xxxxxx-xxxxx-xxxxxxxxxxxxxx\"\n   }\n   ```\n\
    \n3. To confirm that the new namespace has been created, we will use the `list-namespaces`\
    \ CLI command. Type the following command, replacing the highlighted values with\
    \ those from your environment:\n\n   ```bash\n   $aws quicksight list-namespaces\
    \ --aws-account-id <aws-account-id>\n   ```\n\nNote the response. It should look\
    \ like the following:\n\n```json\n{\n  \"Status\": 200,\n  \"Namespaces\": [\n\
    \    {\n      \"Name\": \"companyA\",\n      \"Arn\": \"arn:aws:quicksight:us-east-1:<account-id>:namespace/companyA\"\
    ,\n      \"CapacityRegion\": \"us-east-1\",\n      \"CreationStatus\": \"CREATED\"\
    ,\n      \"IdentityStore\": \"QUICKSIGHT\"\n    },\n    {\n      \"Name\": \"\
    default\",\n      \"Arn\": \"arn:aws:quicksight:us-east-1:<account-id>:namespace/default\"\
    ,\n      \"CapacityRegion\": \"us-east-1\",\n      \"CreationStatus\": \"CREATED\"\
    ,\n      \"IdentityStore\": \"QUICKSIGHT\"\n    }\n  ],\n  \"RequestId\": \"xxxxxxx-xxx-xxx-xxx-xxx\"\
    \n}\n```\n\nBoth namespaces have now been created successfully.\n\n> **Note**\n\
    > Namespaces span **AWS Regions**, and a user will be assigned to the same QuickSight\
    \ namespace, regardless of which Region they are using.\n\nNow that we have created\
    \ our new namespace, in the next section, we will allocate a new user to the namespace.\n\
    \n## Using QuickSight namespaces\n\nIn this section, we will add users, and then\
    \ we will see how namespaces don’t allow users to share assets with other namespaces.\
    \ At the end of this section, we will learn how we can configure common assets\
    \ across namespaces.\n\n## Adding users\n\nNow that we have a new namespace, we\
    \ will register new users using the new namespace.  \nFor this exercise, we will\
    \ register a new IAM user in QuickSight:\n\n1. First, create a new IAM user called\
    \ `author-a` using the **AWS Console**. Select IAM, and then the users from the\
    \ left-hand side menu.\n\n2. Select **Add users**. On the next screen, choose\
    \ a user name, and then check the **Password – AWS Management Console access**\
    \ checkbox, as shown in the following screenshot:\n\n## Set user details\n\nYou\
    \ can add multiple users at once with the same access type and permissions. Learn\
    \ more\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_223_0.png)\n\n## Select AWS\
    \ access type\n\nSelect how these users will primarily access AWS. If you choose\
    \ only programmatic access, it does NOT prevent users from accessing the console\
    \ using an assumed role. Access keys and autogenerated passwords are provided\
    \ in the last step. Learn more\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_223_1.png)\n\
    \nFigure 10.2 – Creating an IAM user\n\n3. On the next screen, leave the permissions\
    \ empty and click **Create**. Take note of the user arn value, as we will use\
    \ it in the next step.\n\n4. Now that we have created our new user, we will register\
    \ them with QuickSight under the `companyA` namespace. Using the CLI, type the\
    \ following command, replacing the highlighted values with those from your environment:\n\
    \n```bash\n$aws quicksight register-user --identity-type IAM \\\n--email <your-email>\
    \ --user-role AUTHOR --iam-arn arn:aws:iam::<aws-account-id>:user/author-a \\\n\
    --aws-account-id <aws-account-id> --namespace companyA\n```\n\nTo confirm the\
    \ creation of the user, we will use the `list-users` CLI command. Note that we\
    \ specify `companyA` as the namespace:\n\n```bash\n$aws quicksight list-users\
    \ --aws-account-id <aws-account-id> --namespace companyA\n```\n\nThe response\
    \ will look like the following:\n\n```json\n{\n  \"Status\": 200,\n  \"UserList\"\
    : [\n    {\n      \"Arn\": \"arn:aws:quicksight:us-east-1:xxxxxxxxxxxx:user/companyA/author-a\"\
    ,\n      \"UserName\": \"author-a\",\n      \"Email\": \"xxx@xxx\",\n      \"\
    Role\": \"AUTHOR\",\n      \"IdentityType\": \"IAM\",\n      \"Active\": true,\n\
    \      \"PrincipalId\": \"federated/iam/xxxxx\"\n    }\n  ],\n  \"RequestId\"\
    : \"xxxx-xxxx-xxxx-xxxx\"\n}\n```\n\n5. Now that we have successfully created\
    \ our user, let’s try to understand the effects of a namespace. Open the AWS Console,\
    \ and log into QuickSight as the newly created user. Expand the top-right menu.\
    \ Note the namespace name, as shown in the following screenshot:\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_224_0.png)\n\
    \nFigure 10.3 – Logging in to a multi-tenant QuickSight account\n\n6. Next, we\
    \ want to ensure that this user cannot share their dashboards, analyses, or datasets\
    \ with users from other namespaces. The easiest way to check this is to quickly\
    \ create a new dataset, analysis, or dashboard and try sharing it with other users.\
    \ Once the asset is created, open its permissions manager and try to invite a\
    \ Author or Reader user who belongs to a different namespace:\n\n# Manage dataset\
    \ permissions\n\nYou can manage the settings and permissions for users, analyses,\
    \ and dashboards that access this dataset.\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_225_0.png)\n\
    \nShared with 1 user\n\n| Name | Permission | Actions |\n|---|---|---|\n| author-a\
    \ | Owner | |\n| Close | | Invite users |\n\nFigure 10.4 – Sharing assets in multi-tenant\
    \ environments\n\nWhen sharing assets, QuickSight autocompletes when it finds\
    \ relevant users. You will notice that as you type `author`, there is no suggestion\
    \ from QuickSight, and the dataset cannot be shared. The reason for this is that\
    \ the Author user belongs to a different namespace to the `author-a` user.\n\n\
    Now that we have seen how namespaces prevent users from sharing assets with other\
    \ users, we will see how it is possible to configure common assets between users\
    \ in different namespaces.\n\n## Sharing common assets\n\nIt is possible to have\
    \ use cases where assets need to be visible to users that inhabit different namespaces.\
    \ For example, a large corporation might want to share a specific dashboard with\
    \ users that belong to different departments, which are configured as namespaces.\
    \ To complete this action, we will need to use the QuickSight API. As we learned\
    \ in the previous section, completing this via the QuickSight console is not possible,\
    \ as users from one namespace cannot discover users from another namespace.\n\n\
    To better understand this concept, we will use the New York Taxi dashboard configured\
    \ in Chapter 4, Developing Visuals and Dashboards. For this tutorial, we will\
    \ use the QuickSight Admin user and the AWS CLI:\n\n1. First, open a terminal\
    \ with the AWS CLI installed.\n\n2. List the dashboards using the list-dashboard\
    \ action. Type the following command, replacing the highlighted values with those\
    \ from your environment:\n\n   ```bash\n   $aws quicksight list-dashboards --aws-account-id\
    \ <aws-account-id>\n   ```\n\n   Focus on the DashboardSummaryList array, and\
    \ capture the DashboardId value, as we will use it in the next step:\n\n   ```json\n\
    \   \"DashboardSummaryList\": [\n       {\n           \"Arn\": \"arn:aws:quicksight:us-east-1:xxxxxxxxxx:dashboard/xxxx-xxxx-xxxx-xxxx-xxxxxx\"\
    ,\n           \"DashboardId\": \"xxxx-xxxx-xxxx-xxxx-xxxx\",\n           \"Name\"\
    : \"New York Taxi Dashboard\",\n           ...\n       }\n   ]\n   ```\n\n3. To\
    \ update the dashboard permissions, we will use the update-dashboard-permissions\
    \ CLI command. Type the following command, replacing the highlighted values with\
    \ those from your environment:\n\n   ```bash\n   $aws quicksight update-dashboard-permissions\
    \ --aws-account-id <aws-account-id> --dashboard-id <dashboard-id> --grant-permissions\
    \ Actions=quicksight:DescribeDashboard,quicksight:ListDashboardVersions,quicksight:UpdateDashboardPermissions,quicksight:QueryDashboard,quicksight:UpdateDashboard,quicksight:DeleteDashboard,quicksight:DescribeDashboardPermissions,quicksight:UpdateDashboardPublishedVersion,\
    \ Principal=arn:aws:quicksight:us-east-1:<aws-account-id>:user/companyA/author-a\n\
    \   ```\n\nNow that we have provided access to our author-a user, we will log\
    \ in to the QuickSight console and view the available dashboards.\n\n4. Log into\
    \ the QuickSight console as the author-a user. Then, navigate to Dashboards to\
    \ view the available dashboards. The New York Taxi dashboard should now be available\
    \ for you to view, as shown in the following screenshot:\n\n"
  mdcn: "\n\n## 设置多租户\n\n在本章中，我们将使用命名空间 API 设置一个简单的多租户环境。此练习将帮助你了解如何以 QuickSight 管理员用户身份设置多租户环境。它还将帮助你了解你的\
    \ BI 用户在多租户场景下的体验，以及 QuickSight 如何防止用户与其他租户共享资产。\n\n## 创建命名空间\n\n创建命名空间很简单，可以使用\
    \ QuickSight API 完成。在撰写本文时，无法通过 QuickSight **图形用户界面 (GUI)** 创建命名空间：\n\n1. 首先，你需要以\
    \ QuickSight 管理员用户身份登录 Amazon QuickSight。\n2. 接下来，打开 **AWS 命令行界面 (CLI)**，并键入以下命令，将高亮显示的值替换为你环境中的值。对于此练习，我们将创建一个名为\
    \ `companyA` 的自定义命名空间。请注意，我们已经为本书中使用的现有 Admin、Author 和 Reader 用户有一个默认命名空间：\n\n\
    \   ```bash\n   $aws quicksight create-namespace --aws-account-id <account-id>\
    \ --namespace companyA --identity-store QUICKSIGHT\n   ```\n\n   这将导致新命名空间的异步创建。请注意，在\
    \ CLI 响应中，状态为 `CREATING`：\n\n   ```json\n   {\n    \"Status\": 202,\n    \"Name\"\
    : \"companyA\",\n    \"CapacityRegion\": \"us-east-1\",\n    \"CreationStatus\"\
    : \"CREATING\",\n    \"IdentityStore\": \"QUICKSIGHT\",\n    \"RequestId\": \"\
    xxxxxx-xxxxx-xxxxxxxxxxxxxx\"\n   }\n   ```\n\n3. 要确认新命名空间已创建，我们将使用 `list-namespaces`\
    \ CLI 命令。键入以下命令，将高亮显示的值替换为你环境中的值：\n\n   ```bash\n   $aws quicksight list-namespaces\
    \ --aws-account-id <aws-account-id>\n   ```\n\n请注意响应。它应该如下所示：\n\n```json\n{\n\
    \  \"Status\": 200,\n  \"Namespaces\": [\n    {\n      \"Name\": \"companyA\"\
    ,\n      \"Arn\": \"arn:aws:quicksight:us-east-1:<account-id>:namespace/companyA\"\
    ,\n      \"CapacityRegion\": \"us-east-1\",\n      \"CreationStatus\": \"CREATED\"\
    ,\n      \"IdentityStore\": \"QUICKSIGHT\"\n    },\n    {\n      \"Name\": \"\
    default\",\n      \"Arn\": \"arn:aws:quicksight:us-east-1:<account-id>:namespace/default\"\
    ,\n      \"CapacityRegion\": \"us-east-1\",\n      \"CreationStatus\": \"CREATED\"\
    ,\n      \"IdentityStore\": \"QUICKSIGHT\"\n    }\n  ],\n  \"RequestId\": \"xxxxxxx-xxx-xxx-xxx-xxx\"\
    \n}\n```\n\n两个命名空间现在都已成功创建。\n\n> **Note**\n> 命名空间跨越 **AWS 区域**，无论用户使用哪个区域，都会被分配到同一个\
    \ QuickSight 命名空间。\n\n现在我们已经创建了新命名空间，在下一节中，我们将把新用户分配到该命名空间。\n\n## 使用 QuickSight\
    \ 命名空间\n\n在本节中，我们将添加用户，然后了解命名空间不允许用户与其他命名空间共享资产。在本节结束时，我们将学习如何在命名空间之间配置共用资产。\n\
    \n## 添加用户\n\n现在我们有了新命名空间，将使用新命名空间注册新用户。  \n对于此练习，我们将在 QuickSight 中注册一个新 IAM 用户：\n\
    \n1. 首先，使用 **AWS 控制台** 创建一个名为 `author-a` 的新 IAM 用户。选择 IAM，然后从左侧菜单中选择用户。\n\n2.\
    \ 选择 **添加用户**。在下一屏幕上，选择用户名，然后选中 **密码 – AWS 管理控制台访问** 复选框，如下图所示：\n\n## 设置用户详细信息\n\
    \n你可以一次添加多个具有相同访问类型和权限的用户。了解更多\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_223_0.png)\n\
    \n## 选择 AWS 访问类型\n\n选择这些用户主要如何访问 AWS。如果你只选择编程访问，它并 **不会** 防止用户使用假设角色访问控制台。访问密钥和自动生成的密码将在最后一步提供。了解更多\n\
    \n![](img/33bad1d211a2d93fd743a1978d403f9a_223_1.png)\n\n图 10.2 – 创建 IAM 用户\n\n\
    3. 在下一屏幕上，保持权限为空并单击 **创建**。请记下用户 arn 值，我们将在下一步中使用它。\n\n4. 现在我们已经创建了新用户，将在 `companyA`\
    \ 命名空间下将其注册到 QuickSight。使用 CLI，键入以下命令，将高亮显示的值替换为你环境中的值：\n\n```bash\n$aws quicksight\
    \ register-user --identity-type IAM \\\n--email <your-email> --user-role AUTHOR\
    \ --iam-arn arn:aws:iam::<aws-account-id>:user/author-a \\\n--aws-account-id <aws-account-id>\
    \ --namespace companyA\n```\n\n要确认用户创建，我们将使用 `list-users` CLI 命令。请注意，我们将 `companyA`\
    \ 指定为命名空间：\n\n```bash\n$aws quicksight list-users --aws-account-id <aws-account-id>\
    \ --namespace companyA\n```\n\n响应将如下所示：\n\n```json\n{\n  \"Status\": 200,\n  \"\
    UserList\": [\n    {\n      \"Arn\": \"arn:aws:quicksight:us-east-1:xxxxxxxxxxxx:user/companyA/author-a\"\
    ,\n      \"UserName\": \"author-a\",\n      \"Email\": \"xxx@xxx\",\n      \"\
    Role\": \"AUTHOR\",\n      \"IdentityType\": \"IAM\",\n      \"Active\": true,\n\
    \      \"PrincipalId\": \"federated/iam/xxxxx\"\n    }\n  ],\n  \"RequestId\"\
    : \"xxxx-xxxx-xxxx-xxxx\"\n}\n```\n\n5. 现在我们已成功创建用户，让我们尝试了解命名空间的影响。打开 AWS 控制台，以新创建的用户身份登录\
    \ QuickSight。展开右上角菜单。请注意命名空间名称，如下图所示：\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_224_0.png)\n\
    \n图 10.3 – 登录多租户 QuickSight 账户\n\n6. 接下来，我们要确保此用户无法将其仪表板、分析或数据集与其他命名空间的用户共享。检查这一点的最简单方法是快速创建一个新数据集、分析或仪表板，并尝试与其他用户共享。一旦资产创建完成，打开其权限管理器，尝试邀请一个属于不同命名空间的\
    \ Author 或 Reader 用户：\n\n# 管理数据集权限\n\n你可以管理访问此数据集的用户、分析和仪表板的设置和权限。\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_225_0.png)\n\
    \n已与 1 个用户共享\n\n| 名称 | 权限 | 操作 |\n|---|---|---|\n| author-a | Owner | |\n| 关闭\
    \ | | 邀请用户 |\n\n图 10.4 – 在多租户环境中共享资产\n\n共享资产时，QuickSight 在找到相关用户时会自动补全。你会注意到，当你输入\
    \ `author` 时，QuickSight 没有任何建议，且无法共享数据集。原因是 Author 用户属于与 `author-a` 用户不同的命名空间。\n\
    \n现在我们已经了解命名空间如何防止用户与其他用户共享资产，我们将了解如何在不同命名空间的用户之间配置共用资产。\n\n## 共享共用资产\n\n可能存在需要让不同命名空间的用户可见的资产的用例。例如，一家大型公司可能希望将特定仪表板与属于不同部门（配置为命名空间）的用户共享。要完成此操作，我们需要使用\
    \ QuickSight API。如前一节所学，通过 QuickSight 控制台无法完成此操作，因为一个命名空间的用户无法发现另一个命名空间的用户。\n\n\
    为了更好地理解此概念，我们将使用第 4 章“开发可视化和仪表板”中配置的纽约出租车仪表板。对于本教程，我们将使用 QuickSight 管理员用户和 AWS\
    \ CLI：\n\n1. 首先，打开安装了 AWS CLI 的终端。\n\n2. 使用 list-dashboard 操作列出仪表板。键入以下命令，将高亮显示的值替换为你环境中的值：\n\
    \n   ```bash\n   $aws quicksight list-dashboards --aws-account-id <aws-account-id>\n\
    \   ```\n\n   关注 DashboardSummaryList 数组，并捕获 DashboardId 值，我们将在下一步中使用它：\n\n  \
    \ ```json\n   \"DashboardSummaryList\": [\n       {\n           \"Arn\": \"arn:aws:quicksight:us-east-1:xxxxxxxxxx:dashboard/xxxx-xxxx-xxxx-xxxx-xxxxxx\"\
    ,\n           \"DashboardId\": \"xxxx-xxxx-xxxx-xxxx-xxxx\",\n           \"Name\"\
    : \"New York Taxi Dashboard\",\n           ...\n       }\n   ]\n   ```\n\n3. 要更新仪表板权限，我们将使用\
    \ update-dashboard-permissions CLI 命令。键入以下命令，将高亮显示的值替换为你环境中的值：\n\n   ```bash\n\
    \   $aws quicksight update-dashboard-permissions --aws-account-id <aws-account-id>\
    \ --dashboard-id <dashboard-id> --grant-permissions Actions=quicksight:DescribeDashboard,quicksight:ListDashboardVersions,quicksight:UpdateDashboardPermissions,quicksight:QueryDashboard,quicksight:UpdateDashboard,quicksight:DeleteDashboard,quicksight:DescribeDashboardPermissions,quicksight:UpdateDashboardPublishedVersion,\
    \ Principal=arn:aws:quicksight:us-east-1:<aws-account-id>:user/companyA/author-a\n\
    \   ```\n\n现在我们已为 author-a 用户提供了访问权限，我们将登录 QuickSight 控制台并查看可用仪表板。\n\n4. 以 author-a\
    \ 用户身份登录 QuickSight 控制台。然后，导航到仪表板以查看可用仪表板。纽约出租车仪表板现在应可供你查看，如下图所示：\n\n"
