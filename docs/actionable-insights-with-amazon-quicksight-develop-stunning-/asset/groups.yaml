    are up to date with your latest dashboards. Your business users will receive email
    notifications either when new data is available or when certain thresholds are
    met.


    ## Summary


    Congratulations on completing this chapter.


    In this chapter, we learned how to configure permissions for our Amazon QuickSight
    users and groups. We also learned how to define fine-grained permissions, and
    we discussed the benefits of integrating QuickSight with Amazon Lake Formation.
    Then, we focused on how best to organize QuickSight assets such as analyses, datasets,
    and dashboards by using folders, and how to share assets using shared folders.
    Finally, we learned how to configure automated email reports and how to configure
    threshold-based alerts.


    Using the things you learned in this chapter, you will be able to define your
    permissions and make sure you manage them effectively, making use of groups and
    folders where possible. In the next (and final) chapter, we will learn how to
    configure and architect multi-tenant QuickSight environments.


