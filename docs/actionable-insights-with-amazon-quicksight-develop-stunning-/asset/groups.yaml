    ## Using tables


    Tables can be useful when we want to display the values of specific metrics, without
    using other visual means. Table visuals can be used to display raw data, which
    can be useful for users familiar with the data being used to populate a BI application.
    QuickSight supports the following:


    - Table visual for simple table visualizations

    - Pivot table visual for tables that need to summarize data in multiple dimensions


    For the simple table visual, you will need to define the value and the group by
    fields in the field well. The group by field is used to aggregate your data, while
    the value field contains the metrics that will be added to the table, broken down
    by the group by fields. You can add one or more value fields if you are interested
    in more than one metric. You can use one or more group by fields; however, a pivot
    table might be a better fit if you need to break down the data using more than
    one dimension.


