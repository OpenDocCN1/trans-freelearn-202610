    +   2. Then, click **My folders**, and then click **+ New** in the top right-hand
    corner.


    3. Select a meaningful project name for your folder, for example, New York Taxi
    Project.


    4. Next, we will add the relevant assets. Locate each asset (dataset, analysis,
    and dashboard), click **Add to folder**, and select the newly created folder,
    as shown in the following screenshot:


    ![](img/33bad1d211a2d93fd743a1978d403f9a_205_0.png)


    Figure 9.9 – Adding assets to folders


    5. After adding all the relevant assets, navigate back to **My folders** and open
    your New York Taxi Project folder, as shown in the following screenshot:


    ![](img/33bad1d211a2d93fd743a1978d403f9a_205_1.png)


    Figure 9.10 – Grouping different assets into folders


    Note that now we have grouped together different assets relevant to a specific
    project, which saves you time when searching for relevant assets. The benefits
    of managing and organizing assets using folders are greater when you have a large
    number of projects and assets to work with.


    Now that we have learned how to use personal folders, in the next section, we
    will look at shared folders.


    # Working with shared folders


    Shared folders can be used to share assets between users or groups. Shared folders
    can be particularly useful when there are many BI developers working on a project.
    You can create shared folders for your users so they can easily find assets in
    a consistent way. As you onboard new users into your QuickSight environment, you
    can share folders with the new users, and your users will inherit the access to
    the underlying assets.


    > **Note**

    > Sharing a folder will give the underlying assets the same permissions as the
    shared folders. This will allow you to share multiple dashboards that belong to
    a folder with multiple users or groups, without having to configure specific rules
    for each asset.


    To create a shared folder, we will use the following steps:


    +   1. Log in to the QuickSight Console (or use the CLI) as a QuickSight Admin
    user and select **Shared folders**, and then select **+ New**.


    +   2. Give your shared folder a meaningful name, and select **Create**.


    +   3. Now we will share our folder with our Reader user. Before this step, to
    better understand the concept, we will remove the access to the dashboard for
    that user and then re-enable access by sharing the shared folder, which will contain
    the dashboard.


    +   4. In _Chapter 4, Developing Visuals and Dashboards_, we learned how to manage
    user access for QuickSight dashboards. To remove user access from a dashboard,
    log in as the Author user, open your _New York Taxi_ dashboard, then select **Share**,
    then **Manage Access**, and then remove the Reader user.


    +   5. To add your _New York Taxi_ dashboard into your newly created shared folder,
    simply select the dashboard and select **Add to folder**, as shown in the following
    screenshot. Select your shared folder, and then click **Add**:


