    \ embedding would be as follows:\n\n1. The user uses their web browser to open\
    \ the web portal application.\n2. The user authenticates with the identity provider\
    \ and accesses the resource provider via the web application.\n3. The web application\
    \ assumes the embedding IAM role.\n4. Using the IAM role, the web server calls\
    \ QuickSight APIs to get the embed URL and display it to the user.\n5. To populate\
    \ the visuals, QuickSight will fetch the data from the various data sources, abstracting\
    \ this from the user and the web application.\n\nNow that we have explored the\
