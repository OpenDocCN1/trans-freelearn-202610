    \ 查询，该查询将从表中返回 10 个值。\n\n> Note\n> 此命令将创建一个带有公共 IP 地址的 Redshift 集群。在实际场景中，应避免这种情况。提供的说明经过简化，仅用于本教程的目的，因为本书不专注于\
