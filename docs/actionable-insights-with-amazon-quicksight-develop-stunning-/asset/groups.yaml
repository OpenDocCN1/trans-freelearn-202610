    ,\n \"AccountCustomization\": {\n \"DefaultTheme\": \"arn:aws:quicksight::aws:theme/\n\
    \ MIDNIGHT\"\n },\n \"Arn\": \"arn:aws:quicksight:us-east-\n 1:xxxxxxxxxxxx:customization/account/xxxxxxxxxxxx\
    \ \",\n \"AwsAccountId\": \"xxxxxxxxxxxx\"\n}\n```\n\n> > **Note**\n> > The account\
