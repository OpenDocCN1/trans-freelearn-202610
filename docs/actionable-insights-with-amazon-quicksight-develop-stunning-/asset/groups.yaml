    \n![](img/33bad1d211a2d93fd743a1978d403f9a_190_0.png)\n\n| Name    | Age    |\n\
    |---------|--------|\n| String  | Integer |\n| George  | 54     |\n| Anna    |\
    \ 56     |\n\n图 8.8 – 预览导入的数据\n\n注意我们数据集中的新值。QuickSight 已完成导入，现在新值已在 SPICE 中，在我们更新文件后不久。我们事件驱动架构的一个关键优势是我们不需要等待计划刷新——相反，一旦有新值，数据就会立即刷新。\n\
    \n# 摘要\n\n恭喜您完成本章。\n\n在本章中，我们学习了访问 QuickSight API 的不同选项，包括 CLI，并了解了使用 Python SDK\
    \ 的示例。然后，使用 AWS CLI，我们学习了如何以编程方式控制 QuickSight 资源。我们学习了如何以编程方式创建新数据源，还使用 QuickSight\
    \ API 控制账户设置（例如更改 QuickSight 的默认主题）。最后，使用一个简单的示例，我们学习了如何使用模板 API 创建分析蓝图，然后如何使用模板以编程方式创建分析。\n\
    \n使用本章所学的内容，您将能够以编程方式控制 QuickSight 资源，这将使跨多个环境工作更加容易，并安全且一致地将更改应用到您的 QuickSight\
    \ 账户。最后，使用一个简单的动手示例，我们学习了如何构建一个调用 QuickSight API 并自动将 S3 数据集导入 SPICE 的事件驱动应用程序。在下一章中，我们将学习如何管理\
    \ QuickSight 权限和使用情况。\n\n# 问题\n\n以下是几个问题，用于复习本章所学内容。\n\n1. 什么是 QuickSight 模板？\n\
    2. 我们如何访问 QuickSight API？\n3. 我们如何从模板创建分析？\n4. 您如何使用 QuickSight API 构建自动化？\n\n\
