    such as calculating the average or min/max applies only to numerical data types.
    If we need to perform and visualize these calculations, we will need to ensure
    that a numerical data type has been applied.


    QuickSight supports the following data types:


    +   - String

    +   - Date

    +   - Decimal

    +   - Integer


    The following geospatial types are also supported:


    +   - County

    +   - State

