    \ 提供基础设施服务，允许开发人员在云中以编程方式配置虚拟机。现在，AWS 提供更多服务，其中许多不是基础设施服务。Amazon QuickSight 就是这样一项服务的绝佳示例。QuickSight\
    \ 是一项运行在 AWS 基础设施上的云端 **商业智能 (BI)** 服务，但开发人员不需要配置基础设施。相反，开发人员可以使用 QuickSight API\
    \ 访问应用程序中的功能并执行操作，例如创建数据集、执行数据分析或共享仪表板。到目前为止，在本书中，我们学习了如何使用通过 Web 浏览器访问的 **图形用户界面\
    \ (GUI)** 在 QuickSight 控制台中完成这些操作。在本章中，我们将学习如何以编程方式完成这些操作，这将使我们在创建 BI 应用程序时能够构建自动化。首先，我们将学习如何访问\
    \ QuickSight API。\n\n### 访问 QuickSight API\n\n在本节中，我们将学习可以用来访问 QuickSight API\
    \ 的方法。访问 AWS API 有两种主要方式：\n\n- 使用 **软件开发工具包 (SDK)**\n- 使用 **命令行界面 (CLI)**\n\n\
    接下来，我们将通过实际示例更详细地查看这些选项。\n\n### 使用 AWS CLI 访问 QuickSight API\n\nAWS 提供了一个简单的 CLI，允许开发人员访问\
