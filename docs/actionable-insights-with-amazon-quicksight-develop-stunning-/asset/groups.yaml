    \ Python SDK 以编程方式检索 QuickSight 仪表板并在屏幕上打印它们的名称。\n\n### 安装 AWS SDK\n\n在此示例中，我们将使用\
    \ Python AWS SDK。如果您尚未安装 Python，则需要在环境中安装 Python。\n\n如果您已安装 Python，请在终端中键入以下命令：\n\
    \n```\n$pip install boto3\n```\n\n接下来，打开您首选的代码编辑器，并输入即将出现的 Python 代码。\n\n> **Note**\n\
    > AWS 提供一个名为 **Cloud9** 的云端 **集成开发环境 (IDE)**。\n\n要创建 Cloud9 环境，请登录 AWS 控制台并从服务列表中选择\
