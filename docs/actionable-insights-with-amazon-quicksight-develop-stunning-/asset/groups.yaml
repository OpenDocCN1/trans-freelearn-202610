  mdcn: "\n\n嵌入式仪表板的形式是带有授权代码的 URL。要获取嵌入式仪表板 URL，您需要调用 GetDashboardEmbedUrl API 调用。该\
    \ API 调用返回一个带有授权代码的会话 URL，可用于将仪表板嵌入到您的网站中。GetDashboardEmbedUrl API 调用需要由 Web 应用程序服务器发起，而不是从用户的浏览器发起。要将嵌入式仪表板\
    \ URL 添加到您的网站，您可以使用 QuickSight Embedding SDK 中的 embeddedDashboard(options) 方法。这样您可以轻松设置参数值，以便仪表板以特定的初始参数启动。其他选项包括嵌入式框架格式、允许/不允许打印、滚动行为和起始工作表。有关更多信息，您可以阅读\
    \ QuickSight Embedding SDK 文档：https://github.com/aws labs/amazon-QuickSight-embedding-sdk。\n\
    \n## 了解 QuickSight 控制台嵌入\n\n您可以将完整的 QuickSight 控制台应用程序嵌入到您的 Web 应用程序中。嵌入式控制台功能仅适用于经过身份验证的\
    \ QuickSight 用户。如预期，匿名访问不适用于此类嵌入。与 QuickSight Web 应用程序类似，只有经过身份验证的用户才能访问 QuickSight\
    \ 控制台。控制台嵌入将为您的用户提供完整的 QuickSight 体验。您将能够让读取者和作者用户都使用它。作者将能够配置数据集、执行分析和共享仪表板，而您的读取者将能够访问只读仪表板。控制台会话的形式是带有授权代码的\
    \ URL。要获取控制台嵌入 URL，您需要使用 QuickSight GetSessionEmbedUrl API 操作。一旦您有了 URL，您可以使用\
    \ QuickSight Embedding SDK 中的 embedSession(options) 将 QuickSight 控制台嵌入到您的 Web\
    \ 应用程序中。有关更多信息，请访问 https://github.com/aws labs/amazon-QuickSight-embedding-sdk。\n\
    \n现在我们已经讨论了两种嵌入式分析类型，在下一节中，我们将讨论嵌入式分析架构。\n\n## 探索架构和用户身份验证\n\n在本节中，我们将重点介绍嵌入式分析的架构组件。要了解这种端到端架构，我们将其分解为三个层：\n\
    \n- Web 应用程序层\n- BI 和数据层\n- 身份验证和授权层\n\n这可以通过以下图表更好地表示：\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_153_0.png)\n\
    \n图 7.1 – 嵌入式分析的通用架构\n\n通常，客户端通常使用 Web 浏览器访问 Web 应用程序或 Web 门户。在许多情况下，用户需要向 Web\
    \ 应用程序进行身份验证。客户端将用户凭据（通常是用户名和密码）提交给 **身份验证层**，后者会返回访问代码/令牌，以便客户端可以与 **Web 应用程序层**\
    \ 进行通信。在嵌入式分析中，Web 应用程序层将负责从 **BI 层** 获取嵌入式可视化内容，而 BI 层则负责从数据源查询数据并对其进行可视化（**数据层**）。\n\
    \n在下一节中，我们将分析这些架构组件中的每一个，并确定可用于构建它们的 AWS 服务。\n\n## Web 应用程序层概述\n\n在嵌入式仪表板应用程序中，嵌入式仪表板嵌入在此层中。Web\
    \ 应用程序层与身份验证层和仪表板层进行交互。Web 应用程序通常由用户的 Web 浏览器访问。Web 应用程序层负责将应用程序的内容发送回浏览器用户。确保\
    \ Web 应用程序层有足够的资源来支持您的用户是您的责任，您需要确保 Web 服务器有足够的容量来接受传入连接。出于这个原因，您可以考虑 AWS 无服务器服务，例如\
    \ **Amazon Lambda**、**Amazon S3**（用于静态内容）和 **Amazon API Gateway**，以构建一个能够根据传入需求自动扩展的无服务器\
    \ Web 应用程序。其他选项包括其他计算和容器服务，例如 **Amazon EKS**、**ECS**、**Fargate** 和 **EC2**。您还可以将此层托管在\
    \ AWS 之外，这意味着您不需要将应用程序移至 AWS 云即可使用 QuickSight 的嵌入式分析。为了使嵌入式分析正常工作，您需要在 QuickSight\
    \ 的设置中将 Web 应用程序的域加入白名单。\n\n要在 Amazon QuickSight 中加入域白名单，请执行以下步骤：\n\n1. 以管理员用户身份登录，并从右上角的下拉菜单中选择\
    \ **Manage QuickSight**。\n\n2. 接下来，选择 **Domains and Embedding** 以转到以下屏幕截图中显示的菜单：\n\
    \nEdition: Enterprise\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_154_0.png)\n\
    \n图 7.2 – 域和嵌入设置\n\n3. 输入您的 Web 应用程序的域并单击 **Add**。请注意，如果需要，您可以选择包含子域，只需勾选 **Include\
    \ subdomains** 复选框即可。\n\n现在我们已经讨论了 Web 应用程序层，将继续介绍 BI 层。\n\n## BI 层概述\n\n仪表板层是向\
    \ Web 应用程序层提供嵌入式仪表板的组件。Amazon QuickSight 是此层的核心组件。此层也可以嵌入，使用完整的控制台嵌入。BI 层负责以下内容：\n\
    \n- 与数据源集成\n- 强制执行对仪表板的访问\n- 提供嵌入式仪表板 URL\n\n关于可扩展性，QuickSight 将根据您配置的用户数量自动扩展。如果您有匿名嵌入，则需要启用会话容量规划。此层与数据存储进行交互，消除了将访问数据存储的代码嵌入到应用程序中的需求，从而简化了与数据源的集成。要使用数据集，您必须使用我们在第\
    \ 3 章《使用 Amazon QuickSight 准备数据》中了解的 QuickSight 功能，而不是开发自定义代码。可视化和洞察是使用 QuickSight\
    \ 的原生功能开发的。最后，在此层中，我们配置哪些用户可以访问哪些仪表板。获授权的用户会获得带有授权代码的仪表板 URL，而没有访问权限的用户将不会获得仪表板\
    \ URL。接下来，我们将讨论 QuickSight 中嵌入式分析解决方案的身份验证层。\n\n## 了解身份验证层\n\n在使用 QuickSight 构建嵌入式\
    \ BI 应用程序时，用户授权和身份验证是重要的考虑因素。需要解决的关键问题如下：\n\n- 如何对用户进行身份验证？（身份验证）\n- 哪些用户可以访问哪些仪表板？（授权）\n\
    \n在嵌入式分析中，用户通常使用存储在 Amazon QuickSight 之外的身份存储中的凭据进行身份验证。您可以使用 **Amazon Cognito**\
    \ 用户池作为云原生嵌入式分析架构的身份存储。您可以使用 IAM 配置身份提供程序，以便为经过身份验证的实体担任 IAM 角色。\n\n要使用 IAM 配置身份提供程序，请执行以下步骤：\n\
    \n1. 以 AWS 管理员身份登录并打开 IAM 控制台。\n2. 单击 **Identity providers** 选项，如下所示：\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_156_0.png)\n\
    \n图 7.3 – 配置身份提供程序\n\n3. 选择身份提供程序的类型（SAML 或 OIDC），并为您的身份提供程序提供所需的元数据。\n\n设置身份提供程序后，您可以为\
    \ IAM 角色配置信任关系。您的 Web 应用程序需要能够担任具有访问所需 QuickSight API 权限的 IAM 角色，以便它可以检索嵌入 URL。\n\
    \n以下是允许调用者对所有资源调用 `GetDashboardEmbedUrl` 和 `GetAuthCode` 函数的示例策略：\n\n```\n{\n\
    \ \"Version\": \"2012-10-17\",\n \"Statement\": [\n```\n\n"
