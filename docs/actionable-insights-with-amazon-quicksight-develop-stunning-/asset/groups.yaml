    1. First, navigate to the analysis and select the bar chart visual.

    2. Next, with the visual selected, click on Actions from the left-hand side menu.

    3. Click Add action and then select URL action from the Action Type drop-down
    menu.

    4. Add the values shown in the following screenshot:


    ![](img/33bad1d211a2d93fd743a1978d403f9a_128_0.png)


    Figure 5.14 – URL action


