    # ## Accessing the QuickSight API using SDKs


    AWS provides various development kits that support a number of programming languages.
    This means developers can integrate their applications with AWS services without
    the need to change their programming language. Most common programming languages
    are supported by AWS, including **Python**, **Java**, **C++**, **Go**, **JavaScript**,
    and **Ruby**. For more information on the latest language support, refer to the
    AWS documentation at `https://aws.amazon.com/tools/`. To better understand the
    AWS SDK, we will use a simple hands-on example. For this example, we will use
    the Python SDK to programmatically retrieve the QuickSight dashboards and print
