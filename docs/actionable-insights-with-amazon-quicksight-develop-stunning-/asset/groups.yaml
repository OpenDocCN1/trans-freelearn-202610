    metadata catalog across both the data warehouse and the S3 data lake.


    Amazon Redshift supports functionality that allows it to interact with the data
    warehouse. Let''s look at those features in more detail.


    ### Ability to query the data lake from the data warehouse


    **Redshift Spectrum** is a feature of Redshift that allows you to perform SQL
    queries against data in the S3 data lake. The queries are triggered directly from
    the data warehouse, and therefore you don''t need to connect to a different environment
    to submit your queries. You need to define the Spectrum tables as external tables
    on their data warehouse. The Redshift cluster also needs to have permission to
    access the data lake S3 location(s). The Redshift cluster will needs to be assigned
    an IAM role, which needs to have access to the desired S3 locations.


    Another key characteristic of Redshift Spectrum is that the Spectrum queries are
    running in the Spectrum nodes that are outside of the Redshift cluster. This effectively
    extends the Redshift cluster with additional compute capacity when data lake data
    needs to be queried.


    Finally, Spectrum tables and Redshift tables can be combined and joined. Without
    this feature, you would have to move data and collocate it before joining it.


    ### Ability to load data from the data lake


    Redshift can efficiently load data from the S3 data lake. Specifically, Redshift''s
    COPY command can load data in parallel from Amazon S3. You (at a minimum) need
    to define a table name, the data location (commonly S3), and the authorization
    to access the data in the source location. When loading multiple files from S3,
    Redshift parallelizes the loading by allocating each file to a Redshift slice
    (the unit of processing in Redshift).


    ### Ability to unload data to the data lake


    Redshift also comes with the ability to unload data from the data warehouse back
    to the data lake. Specifically, the UNLOAD command unloads the result of the query
    onto Amazon S3. You (as a minimum) need to specify the S3 location and the authorization.
    There are more options, such as defining the file format (using the FORMAT AS
    option) or applying partitioning (using the PARTITION BY option), and others.


    In the following diagram, we see an example data pipeline that is using both a
    data warehouse and a data lake on AWS. Data is loaded from the operational data
    stores into the Amazon S3 object store in the raw layer of the data lake. Then,
    with a set of ETL jobs, the data reaches a stage that can be loaded into the data
    warehouse for BI purposes. For cost-effectiveness, you might not want to load
    all the data into the warehouse. Instead, you might want to leave the data in
    the data lake but have the ability to query the data when needed. This architecture
    considers the temperature of the data (how frequently the data is accessed) to
    determine the best storage. **Hot** data that needs to be accessed frequently
    is loaded into the data warehouse, while **colder** data remains in the data lake,
    a cheaper long-term storage option.


    ![](img/33bad1d211a2d93fd743a1978d403f9a_31_0.png)


    Figure 1.4 – Example data pipeline on AWS


    Now that we have had an overview of the modern data architecture on AWS, let’s
    build a basic modern data architecture on AWS.


    ## Creating a basic modern data architecture


    In this section, we will go through a hands-on example to create a basic modern
    data architecture. This tutorial will use the AWS CLI and the AWS console. By
    the end of this section, we will have spun up a working data lake and a data warehouse
    environment with demo data loaded.


    > **Important note**

    > The resources for this tutorial might introduce charges to your AWS account.
    Once you finish with the exercise, make sure you clean up the resources to prevent
    incurring further charges.


    ## Creating the data lake storage


    In this step, we will add the data lake storage. Then we will upload a demo dataset
    and will discover its schema automatically.


    ### Step 1 – creating the S3 bucket


    Let’s begin:


    1. If you haven’t installed it already, follow the AWS documentation to install
    and configure the AWS CLI. To complete this tutorial, you will need to use a role
    that has access to the S3, Glue, Redshift, and IAM services: https://docs.aws.amazon.com/cli/latest/userguide/cli-chap-configure.html.


    2. First, let’s create the S3 bucket as the data lake storage. Your S3 bucket
    needs to have a globally unique name. For that reason, we should introduce some
    randomness to it. Let’s pick a random set of 10 characters and numbers. For this
    tutorial, you should choose your own random set of characters for this string;
    for example, SF482XHS7M. We will use the random string in the data lake name,
    to ensure it is globally unique. Let’s use my-data-lake-<random string> as the
    bucket name.


    3. To create a bucket, we can type the following command into the CLI. Replace
    the following random string with your random string:


    ```bash

    % aws s3api create-bucket --bucket data-lake-xxxxxxxxxx --region us-east-1

    ```


    And the response should look like this:


    ```json

