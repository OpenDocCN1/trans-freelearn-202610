    # # Introducing multitenancy using namespaces


    In this section, we will introduce the concept of multitenancy in Amazon QuickSight.
    Based on what we have learned so far, a user that owns a QuickSight asset can
    share the resource with any other registered user in the account. However, there
    are use cases where a single QuickSight account needs to support multiple **tenants**.


    # ## Understanding multitenancy


    QuickSight offers features that allow developers to build multi-tenant **business
    intelligence (BI)** platforms. Due to its cloud-native architecture, QuickSight
    scales automatically depending on the number of users. This feature, coupled with
    QuickSight’s embedding capabilities and its API actions that can be accessed programmatically,
    helps developers to implement multi-tenant BI platforms.


    A key characteristic of a multi-tenant platform is that tenants don’t interact
    with each other, which effectively prevents a tenant from granting (or revoking)
    access to users belonging to another tenant. It is also common that different
    tenants can have different permission requirements for their users and different
    _look and feel_ requirements. Multi- tenant platforms can serve large corporations,
    where a tenant can be each subsidiary or a separate department within the company.


    Another use case can be software vendors who offer BI capabilities to their customers.
    In this example, each tenant of the platform would represent a customer of the
    software vendor. Each tenant would be able to manage their own BI assets and share
    them with their own users (but not with other tenants). For this scenario, the
    tenants would typically access QuickSight through a web portal. To separate and
    organize users from different tenants, QuickSight introduced the concept of _namespaces_.


    In the next section, we will introduce QuickSight namespaces.'
  - '[PAGE 219]


    # # Introducing QuickSight namespaces


    To address multitenancy requirements, Amazon QuickSight introduced the namespace
    API. The namespace API allows organizations to build multi-tenant environments
    without the need to create multiple QuickSight accounts.


    A QuickSight namespace is a logical container of users and groups, and it can
    be used to separate different departments or organizations. While users within
    the same namespace can share assets between themselves, users from different namespaces
    cannot interact with each other.


    A namespace can be one of the following:


    +   - Default namespace


    +   - Custom namespace


    When you create a new QuickSight account, your first Author and Admin users will
    belong to the *default* namespace. Any other namespaces that you create are *custom*
    namespaces.


    ![](img/33bad1d211a2d93fd743a1978d403f9a_219_0.png)


    A user cannot belong to more than one namespace. It is not possible to move users
    between namespaces. Other QuickSight assets, such as analysis dashboards and datasets,
    don''t belong exclusively to namespaces. Instead, access to QuickSight assets
    is managed using the Access API, as we learned in Chapter 8, Understanding the
    QuickSight API. Therefore, it is possible to programmatically share an asset with
    users from different namespaces. For example, an organization might need to share
    a common dashboard with all users of all namespaces.'
  - '[PAGE 220]


    The following figure depicts an example architecture for multi-tenant BI analytics:


    ![](img/33bad1d211a2d93fd743a1978d403f9a_220_0.png)


    Figure 10.1 – Multi-tenant architecture


    The main components of the architecture are as follows:


    +   • **Custom namespaces**: These are to organize the users from different tenants.


    +   • **Default namespace**: These are for Admin users.


    +   • **Amazon SPICE and datasets**: These are specific to a QuickSight account.
    Access to these resources is managed separately using the QuickSight API, as we
    learned in _Chapter 3, Preparing Data with Amazon QuickSight_, and _Chapter 9,
    Managing QuickSight Permissions and Usage_.


    +   • **Embedded portal and Identity Store**: This allows users into the QuickSight
    console. For those use cases that don''t need an embedded web portal, the QuickSight
    web app can be used instead. The embedded portal can be any custom-built web app.
    Implementation details on how to build web applications are outside the scope
    of this book.


    Now that we have learned the fundamentals of using multi-tenant architectures
    in QuickSight, in the next section, we will look at a hands-on example.'
