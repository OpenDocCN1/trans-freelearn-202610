    \nOnce you create the role, you can attach a policy with the required permissions\
    \ to call the QuickSight APIs for the dashboard embedding. To get the temporary\
    \ credentials, your web application layer will need to call the **Amazon STS**\
    \ service’s `AssumeRole` API or `AssumeRoleWithSAML` or `AssumeRoleWithWebIdentity`,\
    \ depending on the identity provider. Once you have the required credentials,\
    \ then your web application will be able to call the QuickSight APIs to retrieve\
    \ the embed URL, which is then added to your web frontend."
