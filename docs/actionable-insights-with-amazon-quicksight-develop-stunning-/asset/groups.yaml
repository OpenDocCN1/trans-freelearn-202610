    will learn how to edit an insight.


    ## Editing an insight


    When adding elements to your narrative, you can automatically add the following:


    - **Computations**: Predefined calculations

    - **Parameters**: Variables that you can set in your analysis

    - **Functions**: Used to change a field into the desired format


    To better understand how to use these terms, we will edit our example narrative:


    1. First, let''s add two new parameters, `DateStart` and `DateEnd`, as we learned
    in Chapter 5, Building Interactive Dashboards. Set the default value to 01 October
    2020 for the `DateStart` parameter and 31 December 2020 for the `DateEnd` parameter.

    2. Connect these parameters to a filter, and use the **Pick Date** field to control
    the parameter value. Make sure that the filter scope includes the insight visual.

    3. Now that we have the two parameters set up, we will edit the narrative.


