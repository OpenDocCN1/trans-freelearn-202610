    ## 摘要


    恭喜您完成本章！在本章中，我们学习了如何为仪表板添加交互性。我们学习了如何添加 QuickSight 参数和屏幕控件，以根据用户输入筛选分析的数据。我们还学习了如何配置三种类型的操作：筛选器操作、导航操作和
    URL 操作。使用这些功能，您将能够创建具有交互式控件的 BI 应用程序，从而增强 BI 应用程序的用户体验。通过本章学习的操作，您的用户将能够执行单击筛选、轻松在多个工作表之间导航，以及打开提供额外上下文的外部网站。


    在下一章中，我们将学习如何在分析中使用洞察并添加机器学习。


    ## 问答


    1. 哪种筛选器类型可以链接到参数？

    2. 您如何将参数与 URL 操作一起使用？

    3. 我们何时需要使用工作表？

    4. 我们如何帮助业务用户在不同工作表之间导航？

    5. 筛选器操作和导航操作之间有什么区别？

    6. 操作激活方式中 **菜单选项** 和 **选择** 之间有什么区别？


    ## 进一步阅读


