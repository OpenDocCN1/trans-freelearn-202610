    运行命令后，我们应该会收到一条确认的 JSON 消息。\n\n9. 捕获角色 ARN，因为它将在定义爬虫时稍后使用。\n\n10. 然后，让我们将所需策略附加到此角色。对于此角色，我们要分配两个策略：`AWSGlueServiceRole`\
