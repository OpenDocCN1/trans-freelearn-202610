    ## 第 1 部分：Amazon QuickSight 和 AWS 分析生态系统简介


    本部分介绍 Amazon QuickSight 和现代数据架构。

    完成本部分后，读者将了解如何设置 Amazon QuickSight、管理数据源以及构建和共享基本仪表板。


    本部分包含以下章节：


    - 第 1 章，介绍 AWS 分析生态系统

    - 第 2 章，Amazon QuickSight 简介

    - 第 3 章，使用 Amazon QuickSight 准备数据

    - 第 4 章，开发可视化和仪表板


    ## 1 介绍 AWS 分析生态系统


    随着数据在数量和种类上的不断增加，各行各业的组织都在采用云分析服务进行数据分析。AWS 提供了多种分析服务，涵盖数据湖、数据仓库、大数据处理、**提取、转换、加载**（ETL）和数据可视化。在本章中，我们将介绍
    AWS 分析生态系统。我们在此讨论的一些服务将在本书后面再次提及。


    首先，我们将 AWS 服务映射到各个类别。然后，我们将讨论 Amazon QuickSight 如何融入更广泛的 AWS 分析生态系统。我们将更仔细地研究现代数据架构，并讨论其优势和组件。最后，我们将提供一份逐步指南，介绍如何在
    AWS 上设置现代数据架构，并加载和查询演示数据样本。其中一些信息您可能已经熟悉，但让我们回顾一下基础知识。


    在本章中，我们将涵盖以下主题：


    - 探索 AWS 分析生态系统

    - 探索 AWS 上的现代数据架构

    - 创建基本的现代数据架构


    ## 技术要求


    要跟随本章进行操作，您需要以下先决条件：


    - 具有控制台访问权限的 AWS 账户

    - AWS CLI 访问权限


    本章的代码示例可以在本书的 GitHub 仓库中访问，地址为 `https://github.com/PacktPublishing/Actionable-Insights-with-Amazon-QuickSight/tree/main/chapter_1`。


    ## 探索 AWS 分析生态系统


    AWS 提供了大量的分析服务。除此之外，AWS 还有许多专注于数据分析并提供在 AWS 基础设施上运行的分析解决方案的合作伙伴。然而，合作伙伴解决方案不在本部分的范围内。本部分专注于
    AWS 完全托管的分析服务。为了列出这些服务，我们将首先定义与分析功能相关的特定类别。机器学习和预测分析也不在本章的范围内。对于每个服务类别，我们将列出可用的
    AWS 服务，并对每个服务提供高级别描述。_图 1.1_ 描绘了常用的 AWS 分析服务。


    ![](img/33bad1d211a2d93fd743a1978d403f9a_23_0.png)


    图 1.1 – AWS 分析服务


    ### 商业智能


    越来越多的组织渴望成为数据驱动型组织，并利用数据推动战略决策。**商业智能（BI）**工具帮助组织将数据转化为可操作的洞察。使用 BI 工具，用户可以分析数据，然后在报告或仪表板中展示他们的发现。这些报告或仪表板随后可以被希望了解业务状况的业务用户使用。


    2015 年，AWS 推出了 **Amazon QuickSight**，一款云原生 BI 工具。从那以后，AWS 为 QuickSight 添加了新功能，用机器学习功能丰富了标准仪表板功能，并提供了嵌入式仪表板功能。Amazon
    QuickSight 是本书将要涵盖的主要技术。在接下来的几章中，我们将从 Amazon QuickSight 的基本功能开始，然后探索更多高级功能。在可能的情况下，我们将使用可在您自己的开发环境中重复的实际示例，让您获得使用
    Amazon QuickSight 的实践经验。


    ## 数据仓库


    数据仓库是数据的存储库，是 BI 流程的重要组成部分。存储在数据仓库中的数据通常是结构化的。传统上，数据从不同的运营数据存储中摄取并集中到数据仓库中。数据仓库经过优化，可在大量数据上运行分析查询。分析查询的结果通常是在对一个或多个表中的多行进行聚合后计算得出的。BI
    应用程序使用分析查询来聚合数据并对其进行可视化。使用数据仓库为 BI 应用程序提供数据是一种常见的架构方法。


    早在 2012 年，AWS 就推出了 **Amazon Redshift**，一款云原生、完全托管的数据仓库服务。如今，Redshift 是最受欢迎的云数据仓库之一，来自不同行业的数千家组织正在使用它来分析他们的数据。其他流行的云数据仓库包括
    Snowflake 和 Google BigQuery。Amazon Redshift 与大多数 BI 工具集成，并且与 Amazon QuickSight
    原生集成。我们将在 _第 3 章，使用 Amazon QuickSight 准备数据_ 中更详细地讨论这个话题，届时我们将更仔细地研究 Amazon QuickSight
    支持的数据源。


    ## 数据湖存储和治理


    数据湖是一个数据存储库，组织可以轻松地将所有数据集中起来，并将其应用于不同的用例，例如报告、可视化、大数据分析和预测分析。存储在数据湖中的数据可以是结构化或半结构化的。通常，数据以原始格式摄取到数据湖中，然后被转换并存储回数据湖以供进一步处理和分析。云数据湖通常使用云对象存储来存储数据。AWS
    于 2006 年 3 月推出了 **Amazon Simple Storage Service (S3)**，为开发人员提供了高度可扩展、可靠且低延迟的数据存储基础设施，成本非常低。Amazon
    S3 可以存储无限量的数据，这是数据湖特别有用的功能。组织无需再担心一件事，因为他们不需要考虑随着存储数据量的增长而扩展存储。


