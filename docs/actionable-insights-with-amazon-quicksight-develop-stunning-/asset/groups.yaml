    \ section, we will use the QuickSight API to edit settings on our account. This\
    \ allows us to configure account customizations on our account. For our example,\
    \ we will change the default theme for our QuickSight Account.\n\n+   1. First,\
    \ let's use the QuickSight API to retrieve the global QuickSight account details.\
    \ Using the CLI as a QuickSight or AWS admin, type the following command, replacing\
    \ the `aws-account-id` value with the value from your environment:\n+   \n+  \
    \ ```bash\n+   $aws quicksight describe-account-settings \n+   --aws-account-id\
    \ <account-id>\n+   ```\n\nThe response should look like the following:\n\n```\n\
    {\n    \"Status\": 200,\n    \"AccountSettings\": {\n        \"DefaultNamespace\"\
    : \"default\",\n        \"Edition\": \"ENTERPRISE\",\n        \"NotificationEmail\"\
    : \"your-email\",\n        \"AccountName\": \"quicksight-account-name\"\n    },\n\
    \    \"RequestId\": \"xxxxxxxxxxxxxxxxxxxxxx\"\n}\n```\n\n+   2. Next, let's type\
    \ the following command to get our QuickSight account customizations. Account\
    \ customizations refer to a set of settings that can be parameterized for a QuickSight\
    \ account. Currently, you can add a custom default theme by using account customization:\n\
    +   \n+   ```bash\n+   $aws quicksight describe-account-customization \n+   --aws-account-id\
    \ <account-id>\n+   ```\n\nSince we haven't yet added any customizations, the\
    \ response would most likely look like the following:\n\n```\nAn error occurred\
    \ (ResourceNotFoundException) when calling the DescribeAccountCustomization operation:\
    \ Account customization does not exist for AwsAccountId <account-id>\n```"
