    the visual title and column names. In our example, we can replace the `fare_amount`
    column name with the user-friendly name `Fare amount`, which is easier to read.
    Additionally, we can choose to display a total aggregate of the value fields and
    control how and where the total will be displayed. In our example, the total will
    be useful to add to the table.


