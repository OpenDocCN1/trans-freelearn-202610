    \ **用户组**。用户组允许您将用户分组，然后在组级别而非个人级别应用权限，这为您节省了时间和精力。当用户加入组时，他们会自动继承组权限。同样，当用户离开组时，他们将失去对组资源的访问权限。\n\
    \n为了更好地了解如何在 Amazon QuickSight 中管理组，我们将使用一个简单的动手示例：\n\n1. 首先，让我们为市场部创建一个组。使用配置了\
    \ AWS CLI 并具有提升访问权限的终端，键入以下命令，将 `<account-id>` 值替换为您环境中的值：\n\n   ```\n   $aws\
    \ quicksight create-group --group-name \"Marketing\" \n   --description \"Group\
    \ for the Marketing Department\" \n   --aws-account-id <account-id> --namespace\
    \ default \n   --region us-east-1\n   ```\n\n2. 接下来，让我们将我们的 Reader 用户添加到此组。为此，我们将使用\
    \ create-group-membership CLI 命令。键入以下内容，将高亮值替换为您环境中的值：\n\n   ```\n   $aws quicksight\
    \ create-group-membership --member-name reader --group-name Marketing --aws-account-id\
    \ <account-id> --namespace default --region us-east-1\n   ```\n\n3. 接下来，我们将使用\
    \ QuickSight 控制台将新仪表板共享给市场组，而不是单个用户。以 Author 用户身份登录 QuickSight。打开 New York Taxi\
    \ 分析并将其发布为全新的仪表板。为您新创建的仪表板命名。\n\n4. 在下一个屏幕上，共享仪表板时，选择 **Marketing** 组并共享您的仪表板，如下面的屏幕截图所示：\n\
    \n![](img/33bad1d211a2d93fd743a1978d403f9a_196_0.png)\n\n图 9.1 – 与组共享仪表板\n\n5.\
    \ 要验证您的仪表板是否已成功共享，请注销并以 Reader 用户身份重新登录。导航到 **Dashboards**，并注意新创建的仪表板：\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_196_1.png)\n\
    \n图 9.2 – 确认仪表板组访问权限\n\n请注意，我们不需要直接为 Reader 用户授予此仪表板的访问权限。相反，我们将 Reader 用户添加到\
    \ **Marketing** 组，然后允许该组的所有用户访问我们发布的仪表板。在未来，如果有更多用户加入 **Marketing** 组，他们将自动获得对与该特定组共享的资源的访问权限，从而无需在单个用户级别定义特定权限。\n\
    \n现在我们已经了解了用户组以及如何使用它们来简化我们的权限，在下一节中，我们将讨论自定义权限。\n\n## 设置自定义权限\n\n在 _第 2 章，Amazon\
    \ QuickSight 简介_ 中，我们了解了不同的用户群组：Admin、Author 和 Reader。用户群组决定了对 QuickSight 控制台中功能的访问级别。自定义配置文件允许您使用自定义安全配置文件覆盖默认权限，并定义符合您组织要求的权限。\n\
    \n> Note\n> 要使自定义权限生效，您需要使用 IAM 联合用户。\n\n为了更好地了解自定义权限，我们将使用一个简单的动手示例。默认情况下，Author\
    \ 用户可以配置新数据源。对于我们的示例，让我们假设，为了保护我们的 **Amazon SPICE** 空间，我们希望防止作者创建新数据源：\n\n1. 首先，以\
    \ QuickSight Admin 用户身份登录 QuickSight 控制台。\n2. 展开屏幕右上角的 QuickSight 菜单并选择 **Manage\
    \ QuickSight**。\n3. 在选择 **Manage users** 选项后，单击 **Manage permissions**，如下面的屏幕截图所示：\n\
    \n![](img/33bad1d211a2d93fd743a1978d403f9a_197_0.png)\n\n图 9.3 – 访问自定义权限\n\n4.\
    \ 在下一个屏幕上，勾选 **Creating or updating all data sources** 复选框，如下面的屏幕截图所示：\n\n# 编辑自定义权限\n\
    \n**名称**\n\ncustom-author\n\n**限制访问**\n\n**仪表板和分析**\n\n☐ 添加或运行异常检测\n\n☐ 创建或更新主题\n\
    \n☐ 导出为 CSV\n\n☐ 导出为 Excel\n\n☐ 共享分析\n\n☐ 共享仪表板\n\n☐ 共享数据集\n\n**数据集**\n\n☐ 创建或更新所有数据集\n\
    \n☐ 仅创建或更新 SPICE 数据集\n\n**数据源**\n\n☑ 创建或更新所有数据源\n\n**文件夹**\n\n☐ 创建共享文件夹\n\n☐ 重命名共享文件夹\n\
    \n**报表**\n\n☐ 创建或更新电子邮件报表\n\n☐ 订阅电子邮件报表\n\n**阈值警报**\n\n☐ 创建或更新阈值警报\n\n图 9.4 –\
    \ 编辑自定义权限\n\n**Note**\n\n使用 QuickSight 控制台定义自定义权限时，您选择要 *限制* 访问的操作。其余操作将根据用户所属的群组进行允许。\n\
    \n5. 在分配权限之前，值得确认我们的 Author 用户将能够创建新数据集。以 Author 用户身份登录 QuickSight 控制台，并确认您可以通过选择\
    \ **New dataset** 来创建新数据集。\n\n6. 接下来，我们需要添加一个新的 Author 用户。确保在注册用户时勾选 IAM 复选框以使用该用户的\
    \ IAM 凭证。对于此示例，我们可以将用户命名为 `author-iam`。\n\n7. 注册新的 author-iam 用户后，我们将新的自定义权限配置文件分配给他们。使用\
    \ AWS CLI 并以 QuickSight Admin 用户身份，键入以下命令，将高亮值替换为您环境中的值：\n\n```\n$aws quicksight\
    \ update-user --user-name author-iam\n--role AUTHOR --custom-permissions-name\
    \ custom-author\n--email <your-email> --aws-account-id <account-id>\n--namespace\
    \ default --region us-east-1\n```\n\n8. 现在，我们已将自定义权限附加到新创建的 Author 用户。我们可以验证控制台访问是否符合预期。注销并以\
    \ author-iam 用户身份重新登录 QuickSight 控制台。\n\n9. 接下来，从左侧菜单选择 **Datasets**，然后选择 **Create\
    \ a Dataset**。您的屏幕应如下图所示，没有创建新数据集的选项：\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_199_0.png)\n\
    \n图 9.5 – 应用自定义权限\n\n通过应用自定义权限，我们能够覆盖默认的 Author 行为，并防止新注册的 Author 用户创建新数据源。您可以在\
    \ QuickSight 帐户中配置多个自定义权限配置文件并将其分配给用户。一个用户不能拥有多个自定义权限配置文件。\n\n10. 作为最后一步，我们将从\
    \ QuickSight 注销 author-iam 用户，因为我们不再需要他们。要注销用户，您可以使用 QuickSight Admin 控制台或 AWS\
    \ CLI，键入以下命令并将高亮值替换为您环境中的值：\n\n```\naws quicksight delete-user --user-name author-iam\n\
    --aws-account-id <account-id> --namespace default\n--region us-east-1\n```\n\n\
    现在我们已经了解了如何配置自定义权限，在下一节中，我们将学习如何将 QuickSight 与 Amazon Lake Formation 集成。\n\n##\
    \ 与 Amazon Lake Formation 集成\n\n在本节中，我们将了解 QuickSight 与 Amazon Lake Formation\
    \ 的集成。**Amazon Lake Formation** 在 **AWS Glue Data Catalog** 之上提供了额外的权限层，允许您在 AWS\
    \ 上的数据湖之上设置细粒度权限。与 Lake Formation 的集成对于 **Amazon Athena** 数据集很有用。结合 QuickSight，Lake\
    \ Formation 将允许您从单一位置管理数据权限，通过增强现有的 QuickSight 细粒度权限，在数据湖层强制执行权限。为了了解 Lake Formation\
    \ 带来的价值，我们首先需要了解如何在没有 Lake Formation 的情况下为 Athena 数据集应用权限。\n\n## 在没有 Amazon Lake\
    \ Formation 的情况下配置 Amazon Athena 数据集权限\n\n为了更好地了解 Lake Formation 的价值，了解如何为 Athena\
    \ 数据集配置权限很重要。我们将使用在 _第 1 章，AWS 分析生态系统简介_ 中配置的演示数据。具体来说，我们已配置以下 AWS Glue 数据库：\n\
    \n- 数据库：my-data-lake-db\n- 表名：yellowtrips\n- S3 位置：`s3://data-lake-xxxxxxxx/yellowtrips/`\n\
    \n为了能够创建 Athena 数据集，您需要 QuickSight 执行以下操作：\n\n- 配置对 Amazon Athena 的访问。\n- 配置对底层\
    \ S3 存储桶的访问。\n\n在 _第 2 章，Amazon QuickSight 简介_ 中，我们了解了如何授予 QuickSight 对 **Amazon\
    \ S3** 存储桶的访问权限。您可以遵循类似的过程来授予对 Athena 服务的访问权限。\n\n要启用 Athena 访问，我们可以使用以下步骤：\n\n\
    1. 首先，以 QuickSight Admin 用户身份登录 AWS 控制台并选择 **Manage QuickSight**。\n\n"
