    \n# 9 管理 QuickSight 权限和使用情况\n\n在本章中，我们将学习如何管理 **Amazon QuickSight** 操作和权限。我们将重点介绍\
    \ QuickSight 权限模型，并学习如何配置细粒度权限。我们还将学习如何管理和组织 QuickSight 资源到文件夹中，以及如何设置基于阈值的警报和电子邮件报告。\n\
    \n我们将在本章中涵盖以下主题：\n\n- 管理 QuickSight 权限\n- 管理 QuickSight 使用情况\n\n# 技术要求\n\n对于本章，您需要访问以下内容：\n\
    \n- 一个 AWS 账户和 AWS Identity and Access Management (IAM) 用户，具有提升的访问权限\n- AWS 命令行界面\
    \ (CLI)\n- 一个配置了 Author 和 Reader 用户的 Amazon QuickSight 账户\n- 第 1 章《AWS 分析生态系统简介》中创建的环境\n\
    - 第 4 章《开发可视化和仪表板》中创建的仪表板\n\n# 管理 QuickSight 权限\n\n在本节中，我们将学习如何配置针对 QuickSight\
    \ 资源的用户权限。首先，让我们介绍设置权限时需要了解的基本主题：\n\n- **Principal**: AWS 主体是需要访问 AWS 资源的用户（或用户组）或应用程序。\n\
    - **Action**: 操作定义主体允许或拒绝的 API 操作集。例如，在 QuickSight 中，`DeleteDataSet` 操作删除数据集。要查看\
    \ QuickSight 操作的完整列表，请参阅 AWS 文档：https://docs.aws.amazon.com/service-authorization/latest/reference/list_amazonquicksight.html#amazonquicksight-actions-as-permissions。\n\
    - **Resource**: 对于大多数操作，我们可以将策略范围缩小到特定资源。通常，单个资源具有其自身唯一的 **Amazon Resource Number\
    \ (arn)**。\n- **Condition**: AWS 允许您根据特定条件定义访问。例如，允许来自特定 IP 地址的应用程序访问的条件。\n\n\
    在授予 AWS 权限（包括 QuickSight 权限）时，请确保遵循 **最小权限** 安全最佳实践。根据最小权限原则，您应仅允许用户访问其所需的特定操作和资源。\n\
    \n"
