  md: "\n\n## Step 3 – identifying the schema\n\nThe next step is to identify the\
    \ schema of the dataset. For this purpose, we will use the AWS Glue crawlers.\
    \ AWS Glue crawlers crawl through the data to detect the schema. If a schema can\
    \ be determined (remember there is no guarantee that the data has a specific schema)\
    \ then Glue crawlers will populate the Glue Catalog with the schemas identified\
    \ after crawling the data. Glue tables always belong to a Glue database. A database\
    \ in Glue is just a logical repository of tables in the Glue Catalog:\n\n1. Let’s\
    \ start by creating a database using the `create-database` command:\n\n```\n%\
    \ aws glue create-database --database-input\n\"{\\\"Name\\\":\\\"my-data-lake-db\\\
    \"}\" --region us-east-1\n```\n\n2. We can verify the successful database creation\
    \ using the `get-databases` command:\n\n```\n% aws glue get-databases --region\
    \ us-east-1\n{\n \"DatabaseList\": [\n {\n \"Name\": \"default\",\n \"CreateTime\"\
    : 1553517157.0\n },\n {\n \"Name\": \"my-data-lake-db\",\n \"CreateTime\": 1616865129.0\n\
    \ }\n ]\n}\n```\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_34_0.png)\n\n3. Before\
    \ we create the Glue Crawler, we need to create an IAM role that will be assigned\
    \ to the Crawler and allow it to access the data in the data lake. The crawler\
    \ doesn’t need to write to the data lake location, therefore only the read access\
    \ permission is needed. To give the required permissions to a role, we need to\
    \ attach policies that define the permissions. Let’s define a policy document\
    \ that allows read access to our data lake:\n\n```\n% aws iam create-policy --policy-name\
    \ DataLakeReadAccess --policy-document file:///policy\n```\n\nThe preceding command\
    \ created the policy and we should get a confirmation JSON object back. Note the\
    \ **policy ARN**, as we will use it in a later step.\n\n6. Next, let’s create\
    \ the IAM role that the Glue crawler will assume. First, let’s define the role\
    \ policy document:\n\n```\n{\n\t\"Version\": \"2012-10-17\",\n\t\"Statement\"\
    : [\n\t\t{\n\t\t\t\"Action\": \"sts:AssumeRole\",\n\t\t\t\"Effect\": \"Allow\"\
    ,\n\t\t\t\"Principal\": {\n\t\t\t\t\"Service\": \"glue.amazonaws.com\"\n\t\t\t\
    }\n\t\t}\n\t]\n}\n```\n\n7. Then create a file called `role-policy` and copy in\
    \ the preceding JSON document:\n\n```\n% vim role-policy\n```\n\nThis role policy\
    \ document allows the Glue service to assume the role we will create.\n\n8. To\
    \ create the role, we will use the `iam create-role` CLI command:\n\n```\n% aws\
