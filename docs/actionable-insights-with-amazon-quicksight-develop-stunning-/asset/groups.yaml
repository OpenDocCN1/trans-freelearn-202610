    # # Technical requirements


    For this chapter, you will need access to the following:


    +   • An AWS account and AWS Identity and Access Management (IAM) user, with elevated
    access


    +   • The AWS Command Line Interface (CLI)


    +   • An Amazon QuickSight account with Author and Reader users configured


    +   • The environment created in Chapter 1, Introducing the AWS Analytics Ecosystem


    +   • The dashboards created in Chapter 4, Developing Visuals and Dashboards


    # # Managing QuickSight permissions


    In this section, we will learn how to configure user permissions against QuickSight
    resources. First, let''s introduce the fundamental topics we need to understand
    when setting up permissions:


    +   • **Principal**: An AWS principal is the user (or group of users) or application
    that needs to access AWS resources.


    +   • **Action**: Actions define the set of API operations that a principal is
    allowed or denied. For example, in QuickSight, the `DeleteDataSet` action deletes
    a dataset. To see a full list of QuickSight actions, refer to the AWS Documentation:
    https://docs.aws.amazon.com/service-authorization/latest/reference/list_amazonquicksight.html#amazonquicksight-actions-as-permissions.


    +   • **Resource**: For most actions, we can narrow down the scope of a policy
    to a specific resource(s). Typically, a single resource has its own unique **Amazon
    Resource Number (arn)**.


    +   • **Condition**: AWS allows you to define access based on specific conditions.
    For example, a condition that gives access to an application from a specific IP
    address.


    When granting AWS permissions, including QuickSight permissions, make sure you
    follow the **least privilege** security best practice. According to the principle
    of least privilege, you should only allow users to have access to the specific
    actions and resources they require.'
