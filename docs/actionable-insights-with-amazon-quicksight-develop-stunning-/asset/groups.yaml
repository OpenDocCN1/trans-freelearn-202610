    you should

    +   choose your own random set of characters for this string; for example, SF482XHS7M.

    +   We will use the random string in the data lake name, to ensure it is globally
    unique.

    +   Let’s use my-data-lake-<random string> as the bucket name.


    +   3. To create a bucket, we can type the following command into the CLI. Replace
    the

