    # # Integrating with Amazon Lake Formation


    In this section, we will learn about the QuickSight integration with Amazon Lake
    Formation. **Amazon Lake Formation** provides an additional permission layer above
    the **AWS Glue Data Catalog**, allowing you to set up fine-grained permissions
    on top of your data lake on AWS. The integration with Lake Formation is useful
    for **Amazon Athena** datasets. Combined with QuickSight, Lake Formation will
    allow you to manage your data permissions from a single place, enforcing the permissions
    at the data lake layer by enhancing the existing QuickSight fine-grained permissions.
    To understand the value added by Lake Formation, we will first need to understand
    how to apply permissions for Athena datasets without Lake Formation.


    # # Configuring Amazon Athena datasets permissions without Amazon Lake Formation


    To better understand the value of Lake Formation, it is important to understand
    how to configure permissions for Athena datasets. We will use the demo data we
    configured in _Chapter 1, Introducing the AWS Analytics Ecosystem_. Specifically,
    we have configured the following AWS Glue database:


    +   - Database: my-data-lake-db


    +   - Table name: yellowtrips


    +   - S3 location: `s3://data-lake-xxxxxxxx/yellowtrips/`


    In order to be able to create the Athena dataset, you will need QuickSight to
    do the following:


    +   - Configure access to Amazon Athena.


    +   - Configure access to the underlying S3 buckets.


    In _Chapter 2, Introduction to Amazon QuickSight_, we learned how to give QuickSight
    access to **Amazon S3** buckets. You can follow a similar process to give access
    to the Athena service.


    To enable Athena access, we can use the following steps:


    +   1. First, log into the AWS Console as the QuickSight Admin user and select
    **Manage QuickSight**.'
