  - "[PAGE 179]\n\n# # Reusing assets using the template API\n\nQuickSight offers\
    \ a template API, which allows you to build blueprints for analysis and then use\
    \ those blueprints to create other analyses for different users, or even for different\
    \ accounts, with consistency. Templates are not visible on the GUI, and we can\
    \ access them only by using the API. Next, we will show a simple example of creating\
    \ a template using the New York Taxi analysis:\n\n+   1. First, let's list our\
