    # # Building automation using the QuickSight API


    So far, we have learned how to use the QuickSight API to control resources by
    using the AWS CLI. In this section, we will discuss an architecture that will
    allow us to call the QuickSight API automatically.


    # ## Understanding the role of AWS Lambda


    **AWS Lambda** is a serverless compute service that allows you to run code without
    creating servers. The unit of computation is a _Lambda function_. Lambda functions
    can be triggered by specific events or at a specific point in time. Using AWS
    Lambda and the AWS SDK, we can control QuickSight resources programmatically to
    respond to specific events or changes to our infrastructure. For example, instead
    of scheduling a refresh on an interval, we could use the SDK to set our data to
    refresh on specific events.


    **Amazon EventBridge** can be used for more complex integrations. Amazon EventBridge
    is a serverless event bus that makes it easier to build event-driven applications
    on AWS. Using EventBridge, you can deliver real-time events that are generated
    by your applications, integrated **software-as-a-service (SaaS)** applications,
    and AWS services. AWS Lambda can be a target of these events, and this allows
    you to design responses to certain events. To better understand how to automate
    QuickSight operations, in the next section, we will create a simple event-driven
    ingestion from an **Amazon S3** data source using AWS Lambda.'
