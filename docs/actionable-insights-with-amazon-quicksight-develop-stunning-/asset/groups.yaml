    ## Q&A


    - 1. What is a visual in Amazon QuickSight?

    - 2. What visual types are better fits for visualizing time series data?

    - 3. Can you give some examples where conditional formatting is particularly useful?

    - 4. How can you create and apply a custom theme?

    - 5. What is a Sankey diagram and when would you use it?


    ## Further reading


    For more information regarding what was covered in this chapter, take a look at
    the following resource:


    - QuickSight User Guide – AWS: https://docs.aws.amazon.com/quicksight/latest/user/amazon-quicksight-user.pdf


    ## Section 2: Advanced Dashboarding and Insights


    In this section, we will dive deeper into some more advanced features of Amazon
    QuickSight that will allow the reader to develop interactive and embedded dashboards
    and add machine learning capabilities to their dashboards.


    This section consists of the following chapters:


    - Chapter 5, Building Interactive Dashboards

    - Chapter 6, Working with ML Capabilities and Insights

    - Chapter 7, Understanding Embedded Analytics


    ## 5 Building Interactive Dashboards


    In this chapter, we will learn how to develop interactive dashboards with Amazon
    QuickSight. You will learn how to add custom controls to your dashboards and add
    interactivity to your BI application using parameters. We will also look at advanced
    filtering options with point and click actions, as well as URL actions.


    In this chapter, we will cover the following topics:


    - Using filters and parameters

    - Working with QuickSight Actions


    ### Technical requirements


    For this chapter, you will need the following:


    - An AWS account

    - A QuickSight account with the Author and Reader users configured

    - The dashboard we created in _Chapter 4, Developing Visuals and Dashboards_


    ## Using filters and parameters


    Users can interact with dashboards by clicking on specific areas of the application
    or hovering over a visual to get additional information on specific data points.
    As a BI developer, you might come across scenarios where you will need to add
    additional interactivity to your dashboards, allowing your users to filter datasets
    or implement specific actions. In this section, we will learn how to leverage
    those specific QuickSight features to add interactivity to our dashboards. We
    will provide hands-on examples while using the New York dataset and dashboard
    we developed earlier in Chapter 4, Developing Visuals and Dashboards. But first,
    we will need to understand how to use QuickSight filters.


    ## Working with filters


    QuickSight authors can filter datasets. For example, you can use filtering when
    you need to refine a dataset before you visualize it. You can control the scope
    of the QuickSight filters so that they can be applied to the visuals you want.
    Filtering, when applied to a QuickSight analysis, is transparent from the reader’s
    perspective. You can apply additional settings when sharing a dashboard with your
    readers if you need to allow your readers to filter data. Let’s look at an example
    to understand how to add and apply filters. For our example, let’s assume that
    we have detected null values and that we want to remove them from certain visuals:


    1. First, we will need to open our New York Taxi analysis.

    2. We will use the pivot table we created earlier. When we open the Borough category,
    we can observe the null value as the payment type. null values can be useful as
    they can help us detect issues with our data. For this example, let’s assume we
    don’t want to visualize the null values in the pivot table while keeping the rest
    of the visuals unaffected:


    | Pick Up Borough | Payment Type | Fare Amount   |

    |-----------------|--------------|---------------|

    | Bronx           | null         | $969,806.58   |

    |                 | Cash         | $50,961.67    |

    |                 | Credit Card  | $100,715.51   |

    |                 | Dispute      | -$334.70      |

    |                 | No Charge    | $1,036.51     |

    |                 | Subtotal     | $1,122,185.57 |

    | Brooklyn        |              | $2,172,314.53 |


    Figure 5.1 – Pivot table with null values


    3. Select the pivot table by clicking on the visual. Then, select the filter tab
    from the left-hand side menu, as shown in the following screenshot:


    ![](img/33bad1d211a2d93fd743a1978d403f9a_115_0.png)


    Figure 5.2 – Select visual for filtering


    4. Since we have no filtering, we will get a prompt to create one. Click on the
    **Create one...** prompt and then select the filter you need to filter against
    (Payment Type, in this example).


    5. This action will create a filter. Click on the newly created filter to get
    the filter configuration options.


    6. Now that we created the filter, we need to confirm its scope. By default, a
    filter is only applied to the selected visual. The filter will not be applied
    to the entire analysis. We can change the scope of a filter if we need to add
    more visuals to its scope.


    7. Next, we will need to define the conditions of the filtering. For our example,
    we will add a condition that _excludes_ the NULL values, as shown here:


    ![](img/33bad1d211a2d93fd743a1978d403f9a_116_0.png)


    Figure 5.3 – Defining filter conditions


    8. Click **Apply** and observe how the NULL values are excluded from our visual.
    Note that the rest of the visuals that are outside of the scope of our filter
    remain unchanged.


    By default, filters don’t appear on the reader user interface. Some BI applications
    might need to give users the ability to filter data.


    > **Note**

    > When filtering a dataset, QuickSight will query the dataset and then apply filtering.
    If your dataset has been configured as a direct query, QuickSight will connect
    to the data source to fetch the latest data before filtering. If your dataset
    is configured as a SPICE dataset, then QuickSight will fetch the data directly
    from SPICE, without the need to query or import data from the original data source.


    To allow our reader users to filter data, we need to check the **Enable ad hoc
    filtering** option on the dashboard publishing screen. This option can be found
    under **Advanced publish options**, as shown here:


    ![](img/33bad1d211a2d93fd743a1978d403f9a_117_0.png)


    Figure 5.4 – Enable ad hoc filtering


    Now that we have learned how to add a filter, let’s introduce the concept of QuickSight
    parameters.


    ## Working with parameters


    Parameters in QuickSight are variables that a user can set, commonly using on-screen
    controls. A parameter can be used in various ways. For example, we can filter
    the analysis data dynamically based on a parameter. To understand this concept,
    we will use our example New York taxi analysis. Let’s assume that our business
    users need to understand patterns and changes in customer behaviors based on what
    payment type the customers are using. To implement this use case, we will create
    a parameter that will store the user selection for the `Payment Type` field.


    ## Creating a parameter


    Creating a parameter is straightforward, as shown here:


    1. You can either select the **Parameter** item on the left-hand side menu or
    click the + **Add** button at the top right-hand side of the screen and then select
    **Add parameter**. Once selected, you will see the parameter creation screen,
    as shown here:


    ![](img/33bad1d211a2d93fd743a1978d403f9a_118_0.png)


    Figure 5.5 – Adding parameters


    2. For this example, we will use the following values (as shown in the preceding
    screenshot):


    - **Name**: `paymenttype`

    - **Data type**: String

    - **Values**: Multiple values

    - **Default values**: Cash, Credit Card, Dispute, No Charge


    3. Next, click **Create**. The parameter should now be added to your analysis.


    At this stage, our parameter has been added to the analysis, but we are not using
    it yet. Next, we will link this parameter to the filter we created earlier.


