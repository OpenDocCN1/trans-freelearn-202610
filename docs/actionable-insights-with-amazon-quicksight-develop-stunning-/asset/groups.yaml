    # # Data warehousing


    Data warehouses are repositories of data; they are important components of the
    BI process. Data stored in data warehouses is typically structured. Traditionally,
    data is ingested and centralized into data warehouses from different operational
    data stores. Data warehouses are optimized to run analytical queries over large
    amounts of data. The results of analytical queries are usually calculated after
    an aggregation over multiple rows from one or more tables. BI applications use
    analytical queries to aggregate data and visualize it. It is a common architectural
    approach to use a data warehouse to serve data to a BI application.


    Back in 2012, AWS launched **Amazon Redshift**, a cloud-native, fully managed
    data warehouse service. Today, Redshift is one of the most popular cloud data
    warehouses with thousands of organizations from different verticals using it to
    analyze their data. Other popular cloud data warehouses include Snowflake and
    Google BigQuery. Amazon Redshift integrates with most BI tools and it integrates
    natively with Amazon QuickSight. We will discuss this topic in more detail in
    _Chapter 3, Preparing Data with Amazon QuickSight_, when we look more closely
    into Amazon QuickSight-supported data sources.


    # # Data lake storage and governance


    A data lake is a repository of data where organizations can easily centralize
    all of their data and apply it in different use cases such as reporting, visualization,
    big data analytics, and predictive analytics. Data stored in data lakes can be
    structured or semi-structured. Usually, data is ingested into the data lake in
    its raw format, and is then transformed and stored back into the data lake for
    further processing and analysis. A cloud data lake typically uses a cloud object
    store to store data. AWS introduced **Amazon Simple Storage Service (S3)** in
    March 2006, offering developers a highly scalable, reliable, and low-latency data
    storage infrastructure at very low cost. Amazon S3 can store an unlimited amount
    of data, a particularly useful feature for data lakes. Organizations have one
    less thing to worry about because they don’t need to think about scaling their
    storage as the amount of data stored grows.'
