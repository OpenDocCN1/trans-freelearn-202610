    +   .amazon.com/cli/latest/userguide/cli-chap-configure.html.


    +   2. First, let’s create the S3 bucket as the data lake storage. Your S3 bucket
    needs to have

    +   a globally unique name. For that reason, we should introduce some randomness
    to

