    # 贡献者


    ## 关于作者


    **Manos Samatas** 是一位专注于大数据和分析的解决方案架构师。他拥有多年为包括电信、网络安全、医疗保健和公共部门在内的各个行业开发和设计大数据应用程序的经验。他是分析领域的
    AWS **认证主题专家**（SME），并持有 AWS 数据分析专项认证和 AWS 解决方案架构师专业认证。Manos 与他的未婚妻 Gabriela 住在伦敦。在空闲时间，他喜欢旅行、与朋友社交以及照料他的植物。


    ## 关于审稿人


    **Madhavan Sriram** 是 Amazon 的数据科学经理，专注于为 Amazon 的运输业务构建数据密集型产品。他的团队每年处理超过 200
    TB 的数据，以构建利用机器学习、大数据和可视化技术实现自动化仓库运营的智能产品。他的研究重点领域在于应用环境下的大数据和机器学习。过去，他曾为包括 IBM、丰田和皇家飞利浦在内的多家大型企业工作，以推进其科学和数据格局。他和妻子居住在卢森堡，喜欢与他们的金毛寻回犬“理查德·帕克”在户外度过时光。


    **Raquel Marasigan** 是 CBSPI 的信息安全工程师 II 主管，在那里她分析安全策略的有效性。Raquel 获得 Arellano
    大学的政治学文学学士学位，主修政治学。她对技术和安全的兴趣促使她继续攻读数据分析学位。她目前正在亚洲与太平洋大学攻读应用商业分析硕士学位，并完成 2022
    学年的毕业设计项目。Raquel 很幸运能与作者、AWS Community Builders 和 AWS 用户组的 Jason Dunn、Mia Heard
    等其他专家并肩工作，他们在那里分享自己的见解。感谢 Raquel 的两个儿子在审阅本书过程中的鼓励。


