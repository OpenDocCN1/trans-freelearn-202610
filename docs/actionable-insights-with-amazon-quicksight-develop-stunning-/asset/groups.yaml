    +   5. 接下来，单击 **Save**，然后运行 ML 分析以生成异常。几分钟后，我们的洞察将填充发现的任何异常。请参阅以下截图作为示例：


    ![](img/33bad1d211a2d93fd743a1978d403f9a_146_0.png)


    图 6.14 – 异常检测洞察示例


    +   6. 与其他叙述类似，我们可以自定义此叙述，以便显示我们希望最终用户看到的文本。目前，我们将保留自动生成的文本。让我们观察识别出的异常——在特定日期（12
    月 8 日），行驶里程比预期多出六倍以上。


    请注意异常检测洞察底部的 **Explore anomalies** 按钮。在下一节中，我们将学习如何探索异常并执行贡献者分析。


    # 探索异常


    QuickSight 为用户提供了一种工具，用于探索异常并了解异常值的影响因素。为了更好地理解此功能，我们将使用在上一节中配置的异常检测洞察。单击 ML 驱动洞察底部的
    **Explore anomalies** 以访问此用户界面：


    ![](img/33bad1d211a2d93fd743a1978d403f9a_147_0.png)


    图 6.15 – 探索异常


    在屏幕顶部，我们可以选择设置以确定将显示哪些异常。我们可以从以下选项中选择：


    +   - **Severity**：这决定了我们的算法在检测异常时的敏感度。

    +   - **Direction**：这决定了我们是关注高于预期的值、低于预期的值，还是两者皆关注。

    +   - **Minimum delta**（绝对值或百分比）：这允许我们设置特定的值或百分比，以确定异常检测的阈值。


    对于此示例，我们不需要更改这些值。我们可以关注屏幕左侧，查看异常的贡献者。我们可以按其对异常的贡献进行排名，并按以下标准对其进行排序：


    +   - 偏离预期值

    +   - 绝对差值

    +   - 贡献百分比

    +   - 百分比差异


    现在，让我们观察使用示例数据能获得什么样的洞察。当按贡献百分比排序时，我们可以观察到，与正常情况相比，Boro Zone 作为接送区域对总里程的贡献要显著更多。就行政区而言，Queens
    作为接送行政区的贡献差异最大，而 Manhattan Beach 和 Crown Heights North 作为送达行政区的贡献差异最大。当我们按偏离预期值对贡献者进行排序时，结果也是一致的。我不确定那天纽约是否发生了任何重大事件，但我们当然可以轻松地看出，那个星期天的出租车数据有些异常。


    # ## 摘要


    恭喜您完成本章。在本章中，我们学习了如何将 ML 功能添加到仪表板中。我们学习了如何添加预测，包括使用假设分析构建复杂场景。我们还学习了如何配置叙述，并使用
    QuickSight 叙述编辑器对其进行自定义。最后，我们学习了如何创建异常值检测，并为异常检测执行贡献者分析。凭借本章学到的功能，您的用户将能够通过简单的计算或更复杂的
    ML 驱动计算，获取丰富的可视化效果和自然语言叙述。


    此时，我们已经了解了 QuickSight 分析的大部分功能，并结合您迄今在本书中学到的知识，可以配置为业务用户提供丰富洞察的复杂仪表板。在下一章中，我们将学习如何将这些仪表板嵌入到您自己的自定义应用程序中。


    # ## 问题


    +   1. 添加预测时，最合适的可视化类型是什么？

    +   2. 什么是 QuickSight 叙述，我们何时应该使用它们？

    +   3. 我们何时应该为洞察使用 ML 智能，而不是更简单的计算？

    +   4. 在 QuickSight 中配置异常检测时，贡献者是什么？

    +   5. 我们如何访问异常值检测应用程序？


    # ## 延伸阅读


    +   • *Amazon QuickSight 用户指南：*

    +   https://docs.aws.amazon.com/quicksight/latest/user/amazon-quicksight-user.pdf


    # # 7 了解嵌入式分析


    在本章中，我们将了解 Amazon QuickSight 的嵌入式功能。我们将讨论嵌入式分析的业务驱动因素，并深入了解其架构。最后，在本章中，我们将提供动手示例，帮助您了解如何设置嵌入式分析。


    在本章中，我们将涵盖以下主题：


    +   • QuickSight 嵌入式分析简介

    +   • 架构和用户身份验证

    +   • 生成嵌入式仪表板 URL


    # # 技术要求


    本章，您需要以下内容：


    +   - 具有管理员权限的 AWS 账户


    +   - 配置了 Author 和 Reader 用户的 QuickSight 账户


    +   - 在 _第 4 章，开发可视化和仪表板_ 中创建的仪表板


    # # QuickSight 嵌入式分析简介


    到目前为止，在本书中，我们学习了如何在原生 QuickSight Web 应用程序中创建仪表板并处理分析。对于许多用例，这已经足够。另一方面，有些组织需要将数据可视化添加到现有
    Web 门户中，而不在原生 QuickSight 应用程序内。


    # # 了解嵌入式的业务驱动因素


    在嵌入式之前，组织需要开发自己的自定义 **Business Intelligence (BI) 解决方案**。D3.js (https://d3js.org)
    是一个用于 Web 数据可视化的开源 JavaScript 库。D3.js 需要高水平的专业知识。这种人才很难找到，使得许多组织很难采用这项技术。虽然网上有很多关于如何构建
    D3.js 可视化效果的示例 (https://observablehq.com/@d3/gallery)，但 JavaScript 对 BI 开发人员来说可能是一门难以学习的语言。同时，Web
    开发人员可能对组织的数据缺乏深入了解，这使得他们难以为试图解决的问题选择合适的可视化效果，以及从数据中获得洞察。除此之外，在构建嵌入式 BI 解决方案时，组织还需要考虑其他方面，例如以下几点：**


    +   - 我们如何从数据存储中获取数据？


    +   - 我们需要多久获取一次新数据？


    +   - 有多少用户将访问该应用程序？


    QuickSight 可以通过仪表板嵌入直接解决这些挑战。您无需开发自定义可视化组件，而是可以使用 QuickSight API 请求数据可视化，并将其嵌入到
    HTML 代码中。QuickSight 是一项完全托管的 AWS 服务，并会根据用户数量自动扩展，使组织和 BI 开发人员能够将精力集中在构建仪表板上，而不是扩展其
    BI 解决方案。出于这些原因，当组织需要利用 AWS 云的规模来为其嵌入到 Web 应用程序中的 BI 解决方案时，嵌入式仪表板可以是一种高效且易于使用的解决方案。接下来，我们将区分
    QuickSight 支持的两种嵌入式分析类型。


    # ## 了解嵌入式分析类型


    Amazon QuickSight 支持两种不同的嵌入式功能：


    +   • 只读仪表板嵌入


    +   • QuickSight 控制台嵌入


    # ## 了解只读仪表板嵌入


    您可以将只读仪表板嵌入到 Web 应用程序中。这种嵌入式可用于向自定义门户应用程序添加只读可视化效果，并将其暴露给内部或外部用户。访问嵌入式仪表板的用户的体验与通过
    Web 应用程序访问 QuickSight 仪表板的体验类似，如第 3 章《使用 Amazon QuickSight 准备数据》中所示。虽然用户可以查看可视化效果，以及钻取或选择特定的数据点或类别，但他们无法访问创作界面和数据集创建过程。在这种模式下，可视化创建、数据集设置以及作者用户可以完成的所有其他操作，只能使用
    QuickSight Web 应用程序完成。对于只读仪表板嵌入，您的用户可以进行身份验证，或者您可以启用匿名访问，以允许未经过身份验证的用户查看仪表板。后者是一个不错的选择，当您不需要用户进行身份验证即可访问仪表板时，例如当您需要将仪表板嵌入到面向公众的网站时。


    > 注意

    > 要启用匿名访问，您的 QuickSight 管理员需要启用会话容量规划。使用会话容量规划，您可以根据仪表板预期的流量购买多个会话。每个会话是一个 30
    分钟的使用块。


