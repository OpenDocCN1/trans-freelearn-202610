    # # Admin


    The QuickSight **admin** role can perform both administrative tasks and BI development
    tasks. A QuickSight account can have one or more users with the admin role assigned.
    The admin user role can do the following:


    +   - Manage users

    +   - Manage QuickSight settings and subscriptions

    +   - Manage connections and storage

    +   - Whitelist domains for dashboard embedding

    +   - Configure **single sign-on (SSO)**


    > > **Note**

    > > Admins are _not_ superusers in Amazon QuickSight and they don''t gain automatic
    access to analyses or dashboards created by other users.


    # # Author


    In QuickSight, **author** is the role needed for BI developers to build datasets
    and analyses. The author role can do the following:


    +   - Create datasets

    +   - Create and develop analyses

    +   - Share analyses

    +   - Publish dashboards to users


    # # Reader


    In QuickSight, **reader** is the role for business users to consume dashboards.
    The reader role can do the following:


    +   - Log in to the QuickSight mobile or web app

    +   - Receive email alerts

    +   - Access and view dashboards

    +   - Use a dashboard''s predefined onscreen controls'
