    ## 可视化时间序列


    BI 应用程序通常需要可视化指标随时间的变化情况。时间序列数据通常使用折线图来表示。时间序列可视化需要确保时间字段在 QuickSight 中存储为 `Date`
    字段类型。这将启用基于时间的聚合；例如，天、周、月、季度或年。


    在本节中，我们将使用简单的折线图来创建第一个时间序列可视化。假设我们想要可视化出租车车费随时间的变化总额，以便观察车费金额随时间的分布情况。


    折线图要求您定义以下内容：


    - **X 轴**：在时间序列中，这将是我们的时间字段。

    - **值**：您想要随时间测量的值。

    - 可选，**颜色**字段：当您想要可视化多个类别时，可以使用 `Color` 字段。这将导致同一折线图上出现多条线。


    在我们的示例中，您需要选择 `tpep_dropoff_datetime` 作为 X 轴，`total_amount (Sum)` 作为值。此数据集仅包含
    3 个月的数据；因此，每日聚合可能有足够的数据点来进行有意义的数据可视化。您需要确保选择了每日聚合。为此，请选择 X 轴列并展开下拉菜单，如以下屏幕截图所示：


    ![](img/33bad1d211a2d93fd743a1978d403f9a_95_0.png)


    图 4.10 – 基于时间的聚合


    以下屏幕截图显示了从 9 月到 12 月期间每日聚合的总车费金额折线图：


    # 按时间汇总的总金额


    ![](img/33bad1d211a2d93fd743a1978d403f9a_96_0.png)


    图 4.11 – 折线图


    现在我们已经学习了如何设置折线图，我们将学习如何使用表格可视化。


    ## 使用表格


    当我们想要显示特定指标的值，而不使用其他可视化手段时，表格可能很有用。表格可视化可用于显示原始数据，这对于熟悉用于填充 BI 应用程序的数据的用户来说可能很有用。QuickSight
    支持以下内容：


    - 用于简单表格可视化的表格可视化

    - 用于需要在多个维度上汇总数据的表格的透视表可视化


    对于简单表格可视化，您需要在字段井中定义值和分组字段。分组字段用于汇总数据，而值字段包含将添加到表格中的指标，并按分组字段进行细分。如果您对多个指标感兴趣，可以添加一个或多个值字段。您可以使用一个或多个分组字段；但是，如果您需要使用多个维度来细分数据，透视表可能更合适。


    要了解表格的用法，让我们使用我们的示例数据集。在这个示例中，假设我们想要可视化一个按区划分的总车费金额表格。对于这个可视化，我们将使用 Borough 列作为分组字段，fare_amount
    (sum) 作为值字段。


    您可以使用其他选项自定义表格可视化。首先，您可以控制可视化标题和列名称。在我们的示例中，我们可以将 `fare_amount` 列名称替换为用户友好的名称
    `Fare amount`，这更易于阅读。此外，我们可以选择显示值字段的总聚合，并控制总计的显示方式和位置。在我们的示例中，将总计添加到表格中将很有用。


    > Note

    > 表格可视化中默认不显示总计，因此如果我们需要显示它，则需要启用它。


    请随时通过可视化右侧的齿轮图标熟悉其他设置。在以下屏幕截图中，您可以看到使用我们示例数据的表格可视化：


    # 按区划分的出租车车费


    | Borough | Fare Amount |

    |---|---|

    | Total | $55,791,387 |

    | Bronx | $1,122,186 |

    | Brooklyn | $2,172,315 |

    | EWR | $2,907 |

    | Manhattan | $45,001,178 |

    | Queens | $6,022,819 |

    | Staten Island | $77,035 |

    | Unknown | $1,392,948 |


    图 4.12 – 表格可视化


    现在，假设我们想要为读者提供一个表格，让他们能够深入了解每个区的数据，并按支付类型进行细分。可以使用透视表可视化代替简单表格。在透视表中，您可以定义以下内容：


    - 行

    - 列

    - 作为行或列的值


    在我们的示例中，我们将使用 fare_amount 列作为值字段（作为列）。对于行字段，这次我们将添加两个字段：Borough 和 Payment Type。与表格可视化类似，您可以使用齿轮图标访问其他设置，以更改可视化的标题、字段命名和总计计算。此外，透视表可以为每个类别显示小计，并具有其他样式控制。以下透视表使用了我们示例中的数据集：


    # 按区和支付类型划分的车费金额


    | Borough   | Payment Type   | fare_amount   |

    |-----------|---------------|---------------|

    | Bronx     | null          | $969,806.58   |

    |           | Cash          | $50,961.67    |

    |           | Credit Card   | $100,715.51   |

    |           | Dispute       | -$334.70      |

    |           | No Charge     | $1,036.51     |

    |           | Subtotal      | $1,122,185.57 |

    | Brooklyn  |               | $2,172,314.53 |

    | EWR       |               | $2,907.37     |

    | Manhattan |               | $45,001,178...|

    | Queens    |               | $6,022,818.58 |

    | Staten Island |           | $77,034.66    |

    | Unknown   |               | $1,392,948.05 |


    图 4.13 – 透视表可视化


    现在我们已经学习了如何使用表格，在下一节中，我们将学习关于可视化地理空间数据的内容。


    ## 可视化地理空间数据


    QuickSight 可以处理地理空间数据。在撰写本文时，QuickSight 支持两种类型的地理空间可视化：


    - 地图上的点

    - 填充地图


    当您需要在地图上突出显示特定点时，地图上的点可视化非常合适。点的大小由 Size 字段决定。当您需要可视化不同类别时，可以添加多种颜色。地图上的点可视化与坐标配合良好，但也可以处理其他地理空间数据类型，例如城市、州和国家。


    当您需要可视化覆盖更广地理范围（例如国家）的指标时，**填充地图**可视化可能更合适。创建填充地图可视化时，您需要定义两个字段：位置字段和颜色字段。


    在下一节中，我们将学习如何可视化源和目标之间的流动。


    ## 可视化源和目标之间的流动


    存在一些场景，您可能希望在考虑源和目标的同时可视化指标。**Sankey** 可视化类型在我们需要可视化在源和目标之间流动的指标时非常合适。Sankey 图将源到目标的流动描绘为一条线。线的宽度取决于指标的值。例如，在我们的数据集中，我们捕获出租车的上车和下车位置。我们可以使用查找表丰富位置
    ID，并获取上车区和下车区。现在，假设我们想要可视化纽约各区之间行驶的总里程。使用 Sankey 可视化类型，我们需要将 **Pick Up Borough**
    设置为 **Source** 字段，将 **Drop off Borough** 设置为 **Destination** 字段，并将 **trip_distance**
    设置为 **Weigh** 字段。


    以下屏幕截图显示了使用我们示例数据集的示例 Sankey 可视化：


    ![](img/33bad1d211a2d93fd743a1978d403f9a_99_0.png)


    图 4.15 – Sankey 可视化类型


