    ## Linking parameters to filters


    While we are still on the analysis and logged in as the author user, to link parameters
    to filters, we will need to do the following:


    1. First, locate the filter we created earlier. You can click on the visual where
    the filter has been applied and then click on the filters item on the left-hand
    side menu.


    2. Now click **Edit**, or simply click on the **Payment Type** filter we created
    earlier.


    3. To link a filter with a parameter, we will need to select **Custom filter**
    from the **Filter Type** drop-down menu.


    4. Next, tick the **Use parameters** checkbox.


    5. Next, there will be a pop-up, asking if you want to change the scope of your
    filter. Since we don''t need to filter other visuals from our analysis, we will
    select **No**.


    > Note

    > The scope of the filter can be edited at any time once the parameter has been
    created. The scope update will have an immediate effect, without the need to update
    the parameters or your controls.


    6. From the drop-down menu, select the `paymenttype` parameter we created earlier.
    The following screenshot shows what the filter configuration will look like when
    linking a filter to a parameter:


    ![](img/33bad1d211a2d93fd743a1978d403f9a_119_0.png)


    Figure 5.6 – Linking filters to parameters


    7. Click **Apply** and then **Close**.


    Now that our filter and parameter are connected, the filter will inherit the default
    values of our parameter. In our example, we have used a multi-value parameter.
    We can confirm that the pivot table only displays the records that contain the
    default values of the parameter. Now that we have linked the parameter with the
    visual, we will learn how to add on-screen controls and allow readers to change
    the parameter value.


    ## Adding on-screen controls


    QuickSight allows you to add on-screen controls so that your reader users can
    set the value of a parameter dynamically. In our example, setting the `paymenttype`
    parameter value will result in changes in the value of the **Payment Type** filter,
    which has been applied to the pivot table visual. To add an onscreen control,
    follow these steps:


    1. First, select the **Parameters** item from the left-hand side menu.


    2. Then, select the `paymenttype` parameter we created earlier. From the drop-down
    menu, click **Add control**, as shown here:


    ![](img/33bad1d211a2d93fd743a1978d403f9a_120_0.png)


    Figure 5.7 – Adding on-screen controls


    3. From the control’s creation settings, we will need to define the following
    parameters:


    - **Display Name**: A user-friendly name for the on-screen control. In our example,
    we used `Payment Type`.


    - **Style**: The type of control that your users will be using to set the parameter.
    The control styles options are also determined by the data type of the parameter.
    For example, if our parameter was a date type, **Date Picker** would be among
    the available options. For our example, we will use the **List – Multiselect**
    style, as shown in the following screenshot. This type will allow our users to
    select multiple values from a drop-down menu.


    - **Values**: The values that the users can select from. You can link these values
    to values from a dataset, which ensures that the available values are synced with
    the dataset, so there isn’t a need to maintain these values separately. In our
    example, we linked the values of the `Payment Type` field. The following screenshot
    shows an example of an on-screen control configuration:


    ![](img/33bad1d211a2d93fd743a1978d403f9a_121_0.png)


    4. Click **Apply** to add the on-screen control.


    Now that we''ve added the on-screen control, we have all the required components
    that allow us to publish interactive dashboards. Let''s look at the sequence of
    events that enable interactivity on our dashboards:


    1. First, the user selects values using on-screen controls.


    2. The selected values are passed to parameters.


    3. Then, these parameters are used as filter conditions.


    4. Finally, the visuals in the scope of the filter are updated after user selections.


    The following diagram depicts the flow described here:


    ![](img/33bad1d211a2d93fd743a1978d403f9a_122_0.png)


    Figure 5.9 – Components for interactive filtering


    Now that we have configured all the required components, let''s test the on-screen
    controls:


    1. First, notice that at the top of the screen, we have a new section named **Controls**,
    under which we have the newly created Payment Type on-screen control. The following
    screenshot shows the newly created control:


    ![](img/33bad1d211a2d93fd743a1978d403f9a_123_0.png)


    Figure 5.10 – Multi-select control


    2. Changing the selection of this control will automatically change the values
    of the `paymenttype` parameter, which was configured to work with our Payment
    Type filter.


    3. You can access additional options from the on-filter controls. One of the options
    that’s available allows you to detach the control from the top of the screen and
    add it to the analysis sheet. This is a good option for filters that have a narrow
    scope. In our example, our filter covers only a single visual, so placing the
    control next to the visual might provide a better overall user experience while
    saving screen estate at the top of the screen. The following screenshot shows
    the on-screen control being placed next to the pivot table:


    ![](img/33bad1d211a2d93fd743a1978d403f9a_123_1.png)


    Figure 5.11 – On-screen control placed on the analysis sheet


    Now that we have configured the analysis and arranged the onscreen controls, we
