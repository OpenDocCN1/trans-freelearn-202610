    ![](img/33bad1d211a2d93fd743a1978d403f9a_128_0.png)


    图 5.14 – URL 操作


    这些值如下：

    • **操作名称**：Wikipedia look up

    • **激活方式**：Menu option

    • **URL**：`https://en.wikipedia.org/wiki/<<{Pick Up Borough}>>`

    • **打开方式**：New browser tab


    5. 单击 Save。


    URL 操作现已应用于我们的可视化对象。要测试 URL 操作，您需要单击应用了操作的可视化对象上的数据点。在我们的示例中，每个数据点都将重定向到不同的 URL，因为我们将
    Pickup Borough 字段作为 URL 的一部分。在现实世界中测试类似内容时，您需要确保每个 URL 都能正确地将用户重定向。以下屏幕截图显示了我们在柱状图中右键单击
    Manhattan 柱状图时将看到的内容。请注意，会出现一个 **Wikipedia look up** 菜单选项，单击它将重定向到 Manhattan Wikipedia
    页面 (`https://en.wikipedia.org/wiki/Manhattan`)：


    ![](img/33bad1d211a2d93fd743a1978d403f9a_129_0.png)


    图 5.15 – URL 操作菜单项


