    \ as the default theme. Type the following command using the CLI, replacing the\
    \ aws-account-id value with your account ID value:\n\n```\naws quicksight create-account-customization\
    \ \\\n--aws-account-id <account-id> --account-customization \\\nDefaultTheme=arn:aws:quicksight::aws:theme/MIDNIGHT\
    \ \\\n--region=us-east-1\n```\n\n# ## 4. Now, let’s confirm the creation of the\
