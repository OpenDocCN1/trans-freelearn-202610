    \ that allows developers to access the AWS API. Before using the CLI, you will\
    \ need to install it. Follow the AWS instructions to install the CLI for your\
    \ operating system:\n\nhttps://docs.aws.amazon.com/cli/latest/userguide/cli-chap-install.html\n\
    \n### Verifying the installation\n\nOnce installed, open a terminal and run the\
    \ following command to check what CLI version was installed:\n\n```\n$aws --version\n\
    aws-cli/2.1.13 Python/3.7.4 Darwin/20.5.0 exe/x86_64 prompt/off\n```\n\n### Configuring\
    \ the AWS CLI\n\nNow that we have installed the CLI, we need to configure it.\
    \ First, we need to create a set of credentials that will be used by the CLI:\n\
    \n1. Log in to the AWS Console with your user credentials.\n2. Open **Services**\
    \ and select **Identity and Access Manager**.\n3. Under **Access Management**,\
    \ select **Users**, and then click on the IAM username whose security credentials\
    \ need to be generated.\n4. On the next page, select the **Security credentials**\
    \ tab.\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_169_0.png)\n\nFigure 8.1 –\
    \ Creating access keys\n\n5. Under the Access keys section, select Create access\
    \ key.\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_170_0.png)\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_170_1.png)\n\
    \n### Figure 8.2 – Retrieving the access key\n\n6. Note the values in the Access\
    \ key ID and Secret access key fields.\n\n7. Next, open the terminal, run the\
    \ following command, and add your access key ID and secret access key when prompted.\
    \ Leave everything else as-is by hitting the Return key.\n\n```\n$aws configure\n\
    ```\n\n### Accessing the QuickSight API using the CLI\n\nNow that we have configured\
    \ the CLI, we can run a few commands:\n\n1. To get a list of all QuickSight CLI\
    \ commands, type the following:\n\n```\n$aws quicksight help\n```\n\n2. To list\
    \ our dashboards, type the following command:\n\n```\n$ aws quicksight list-dashboards\
    \ --aws-account-id <numerical account id> --region us-east-1\n{\n \"Status\":\
    \ 200,\n \"DashboardSummaryList\": [\n {\n \"Arn\": \"arn.aws:quicksight:us-east-1:xxxxxxx:dashboard/xxxxxxxx\"\
    ,\n \"DashboardId\": \"xxxxxxxx\",\n \"Name\": \"New York Taxi Dashboard\",\n\
    \ \"CreatedTime\": \"2021-06-02T20:19:00.285000+01:00\",\n \"LastUpdatedTime\"\
    : \"2021-07-06T23:55:04.960000+01:00\",\n \"PublishedVersionNumber\": 14,\n \"\
    LastPublishedTime\": \"2021-06-02T20:19:00.285000+01:00\"\n }\n ],\n \"RequestId\"\
    : \"xxxxxxx\"\n}\n```\n\nNote the structure of the CLI command:\n\n- aws: To access\
    \ all CLI commands.\n- quicksight: To access the QuickSight CLI commands.\n- list-dashboards:\
    \ To access the API that returns all the dashboards for an account and region.\n\
    - Options (--): Use this symbol to add options for the command.\n\nNow that we\
    \ have configured the CLI and run a simple command, feel free to experiment with\
    \ the other commands before proceeding to the next section. Refer to the AWS documentation\
    \ to view the available and required options for your selected CLI command:\n\
    https://awscli.amazonaws.com/v2/documentation/api/latest/reference/quicksight/index.html\n\
    \nNext, we will access the QuickSight API using the AWS SDK.\n\n### Accessing\
    \ the QuickSight API using SDKs\n\nAWS provides various development kits that\
    \ support a number of programming languages. This means developers can integrate\
    \ their applications with AWS services without the need to change their programming\
    \ language. Most common programming languages are supported by AWS, including\
    \ **Python**, **Java**, **C++**, **Go**, **JavaScript**, and **Ruby**. For more\
    \ information on the latest language support, refer to the AWS documentation at\
    \ `https://aws.amazon.com/tools/`. To better understand the AWS SDK, we will use\
    \ a simple hands-on example. For this example, we will use the Python SDK to programmatically\
    \ retrieve the QuickSight dashboards and print their names on the screen.\n\n\
    ### Installing the AWS SDK\n\nFor this example, we will use the Python AWS SDK.\
    \ You will need to install Python in your environment if you haven't already.\n\
    \nIf you have Python installed, then type the following command in a terminal:\n\
    \n```\n$pip install boto3\n```\n\nNext, open your preferred code editor, and type\
    \ in the upcoming Python code.\n\n> **Note**\n> AWS provides a cloud-based **integrated\
    \ development environment (IDE)**, called **Cloud9**.\n\nTo create a Cloud9 environment,\
    \ log in to the AWS Console and select **Cloud9** from the services list. For\
    \ this tutorial, you can leave all the default settings as they are. For more\
    \ information on setting up Cloud9, follow the AWS documentation:\n\nhttps://docs.aws.amazon.com/cloud9/latest/user-guide/create-environment.html\n\
    \nBefore running the following code, replace the `AwsAccountId` value with the\
    \ numerical account ID from your environment:\n\n```\nimport boto3\nclient = boto3.client('quicksight',\
    \ region_name='us-east-1')\nresponse = client.list_dashboards(AwsAccountId='xxxxxxxx')\n\
    dashboards_list = response['DashboardSummaryList']\nprint('Number of dashboards:\
    \ ' + str(len(dashboards_list)) + '\\n')\nfor dashboard in dashboards_list:\n\
    \    print(dashboard['Name'])\n```\n\nSave the Python script and run it. It should\
    \ print the total number of dashboards for that region, followed by the name of\
    \ each dashboard.\n\n"
  mdcn: "\n\n## 第 3 部分：高级主题与管理\n\n本章将重点介绍如何使用 Amazon QuickSight API 和其他 AWS 服务（例如\
