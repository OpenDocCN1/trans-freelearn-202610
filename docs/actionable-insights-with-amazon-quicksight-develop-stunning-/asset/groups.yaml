    # # User authorization with QuickSight


    In this section, we will look more closely into user authorization options for
    Amazon QuickSight. This concept is more relevant to AWS administrators, who are
    responsible for setting up the QuickSight subscription. During QuickSight setup,
    the administrator will need to select the method to authenticate QuickSight users.


    First, let''s examine the required permissions needed to set up an Amazon QuickSight
    account. The AWS principal who sets up a QuickSight account will need to have
    permissions to call the QuickSight API. An AWS administrator (assuming that they
    have the `AdministratorAccess` managed policy) can set up a QuickSight subscription
    as they inherit full access to the QuickSight API. However, if another user needs
    to set up a QuickSight subscription, then they will need to be explicitly allowed
    to call the required QuickSight API actions. For example, the `QuickSight :Subscribe`
    action is needed to subscribe to QuickSight and `QuickSight :CreateAdmin` to create
    a QuickSight administrator. The full list of API actions that are allowed will
    depend on the actions a user needs to be allowed. If you don''t explicitly allow
    an API action for a user, then **deny** is the AWS IAM default behavior.


    When you set up Amazon QuickSight Enterprise edition, you will need to specify
    how your users will connect to the service. QuickSight offers the following two
    options:


    +   - Use Role Based Federation (SSO)


    +   - Use Active Directory


    Once configured, you can invite your users, either via email or via their federated
    logins, or via Active Directory if you have an Active Directory QuickSight account.
    When inviting users, you can choose to use AWS IAM user authentication credentials,
    or create brand-new credentials for QuickSight.'
