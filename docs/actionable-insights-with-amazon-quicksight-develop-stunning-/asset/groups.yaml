    \ as we will use it later in _Step 4_.\n\n3. Next, we will need to retrieve our\
    \ dashboard ID. We will use the `list-dashboards` CLI command to do. Type in the\
    \ following command. Replace `<aws account id>` with the 12-digit long ID from\
    \ your AWS account. Ensure your dashboard is shared with the admin user so that\
    \ the following command returns the expected results:\n\n```bash\n$aws quicksight\
    \ list-dashboards --aws-account-id <aws account id> --region us-east-1\n```\n\n\
    So far, we have only created one dashboard, so the response should look as follows:\n\
    \n```json\n{\n    \"DashboardSummaryList\": [\n        {\n            \"Arn\"\
    : \"arn:aws:QuickSight:us-east-1:<aws account id>:dashboard/<dashboard id>\",\n\
    \            \"DashboardId\": \"<dashboard id>\",\n            \"Name\": \"New\
    \ York Taxi Dashboard\",\n            \"CreatedTime\": \"2021-06-02T19:19:00.285000+00:00\"\
    ,\n            \"LastUpdatedTime\": \"2021-07-06T22:55:04.960000+00:00\",\n  \
    \          \"PublishedVersionNumber\": 14,\n            \"LastPublishedTime\"\
    : \"2021-06-02T19:19:00.285000+00:00\"\n        }\n    ],\n    \"Status\": 200,\n\
    \    \"RequestId\": \"\"\n}\n```\n\nNote the dashboard ID as we will use it in\
    \ the next step.\n\n4. Next, we will use the `get-dashboard-embed-url` CLI command\
    \ to generate the embedding URL. Type the following command. Replace the AWS account\
    \ ID with your 12-digit long account ID, along with the dashboard ID we captured\
    \ in _Step 3_, and the `user arn` property that we captured in _Step 1_:\n\n```bash\n\
    %aws quicksight get-dashboard-embed-url --aws-account-id <aws account id> --dashboard-id\
    \ <dashboard id> --identity-type QUICKSIGHT --user-arn <user arn> --region us-east-1\n\
    ```\n\nThis command will return the following output:\n\n```json\n{\n  \"Status\"\
    : 200,\n  \"EmbedUrl\": \"https://us-east-1.quicksight.aws.amazon.com/embed/xxxxxxxxxx/dashboards/xxxxx-xxxx-xxxx-xxxx-xxxxxxxxxx?code=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx&identityprovider=QuickSight&isauthcode=true\"\
    ,\n  \"RequestId\": \"xxxxxx-xxxx-xxxxxx-xxxxxx-xxxxxx\"\n}\n```\n\nNote the EmbedUrl\
    \ value. For this example, just open a browser and paste the embed URL to view\
    \ the dashboard. This will look as follows:\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_162_0.png)\n\
    \nFigure 7.6 – Opening the embed URL on a web browser\n\nIn real-world examples,\
    \ the embed URL will be generated by your application server, and the embed URL\
    \ will be embedded within your web server. The domain of your web server will\
    \ need to be whitelisted.\n\n## Summary\n\nCongratulations on completing this\
    \ chapter. In this chapter, we learned about the embedding capabilities of Amazon\
    \ QuickSight and talked about the different types of embedded analytics. We started\
    \ by focusing on its main drivers and business benefits. We learned about the\
    \ main architectural components of dashboard embedding, and then we identified\
    \ key AWS services that can be used to build these architectural layers. We discussed\
    \ the end-to-end flow of embedded analytics. Finally, we used simple CLI commands\
    \ to generate a read-only dashboard URL so that we could see the APIs in action.\n\
    \nIn the next chapter, we will focus on managing QuickSight and learn how to automate\
    \ operations using the QuickSight API.\n\n## Q&A\n\nAnswer the following questions\
    \ to test your knowledge of this chapter:\n\n1. What are the main drivers for\
    \ dashboard embedding?\n2. What are the different types of embedded analytics\
    \ with Amazon QuickSight?\n3. What is the role of the STS service in the embedded\
    \ analytics flow?\n4. What is session capacity planning and what type of embedded\
    \ analytics is relevant to it?\n5. What are the different layers in the embedded\
    \ analytics architecture?\n\n## Further reading\n\nFor more information on the\
    \ topics that were covered in this chapter, take a look at the following resources:\n\
    \n- • QuickSight User Guide – AWS: https://docs.aws.amazon.com/ QuickSight/latest/user/amazon-QuickSight-user.pdf\n\
