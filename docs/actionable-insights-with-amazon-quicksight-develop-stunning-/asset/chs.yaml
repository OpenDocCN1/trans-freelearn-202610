- "# 3 使用 Amazon QuickSight 准备数据\n\n在本章中，我们将重点介绍 QuickSight 数据源和数据集配置。\n我们将提供一个逐步指南，使用我们在第一章（Introducing\
  \ the AWS Analytics Ecosystem）中配置的数据来设置数据集。然后我们将重点介绍在 QuickSight 中使用数据编辑器来编辑数据集。接下来，我们将探索高级数据集操作，例如使用计算字段和联接操作。最后，我们将了解如何设置安全控制。\n\
  \n总结，在本章中我们将学习如何执行以下操作：\n\n- 添加 QuickSight 数据源\n- 编辑 QuickSight 数据集\n- 使用高级操作\n\
  - 配置安全控制\n\n\n\n\n\n### 技术要求\n\n本章需要以下内容：\n\n- 一个 AWS 账户。\n- 一个配置了 Author 用户的 QuickSight\
  \ 账户。\n- 对于本章的某些部分，我们将使用在 _第 1 章，AWS 分析生态系统简介_ 中创建的架构。\n\n### 添加 QuickSight 数据源\n\
  \n在本节中，我们将学习如何使用 Amazon QuickSight 添加和配置数据源。QuickSight 支持多种数据源。我们将首先列出支持的数据源。\n\n\
  ### QuickSight 支持的数据源\n\n让我们来看看可以在 Amazon QuickSight 中配置的不同类型的数据源。BI 工具的一个非常常见的场景是从分析数据库或数据仓库驱动可视化。具体来说，QuickSight\
  \ 支持以下 **数据仓库**：\n\n- 带自动发现的 Redshift\n- Redshift 手动连接\n- Snowflake\n- Teradata\n\
  \n> **注意**\n> Redshift 手动连接的一个用例是当 QuickSight 和 Redshift 集群位于不同的 AWS 区域时。\n\n其他支持的\
  \ **关系型数据库系统** 包括以下内容：\n\n- RDS\n- MySQL\n- PostgreSQL\n- Oracle\n- Amazon Aurora\n\
  - MariaDB\n\nQuickSight 还支持以下内容：\n\n- Amazon Timestream\n- Amazon Elasticsearch\
  \ Service\n\n两者都是 **时间序列数据集** 的流行数据存储。\n\n对于某些用例，用户可能需要处理 **单个文件**，例如 Microsoft\
  \ Excel 文件 (`.xls`)。Amazon QuickSight 支持文件作为数据源，可以通过直接上传或通过指向 S3 上一个或多个文件位置的清单文件来实现。\n\
  \nQuickSight 还支持流行的 **大数据技术**；具体来说，包括以下内容：\n\n- Amazon Athena\n- Presto\n- Spark\n\
  \n另一类是来自 **API** 和流行 SaaS 应用程序的数据源；具体来说，包括以下内容：\n\n- Salesforce\n- GitHub\n- Twitter\n\
  - Jira\n- ServiceNow\n- Adobe Analytics\n\n最后，QuickSight 支持 **AWS IoT Analytics**\
  \ 来可视化 **物联网 (IoT)** 数据，并与 **S3 Analytics** 集成以可视化 S3 存储桶上的访问模式。\n\n现在我们已经了解了数据源选项，在下一节中，我们将使用\
  \ **自动发现** 功能配置我们的第一个数据源。\n\n### 配置我们的第一个数据源\n\n在本节中，我们将配置我们的前两个数据源，连接我们在 _第 1 章，AWS\
  \ 分析生态系统简介_ 中构建的架构。\n\n在 QuickSight 中设置数据源之前，我们需要确保 QuickSight 服务有通往我们 Redshift\
  \ 集群的网络路由。由于我们使用默认设置，我们的集群默认处于锁定状态。我们可以通过打开其安全组来确认这一点。安全组充当虚拟防火墙，用于控制入站和出站流量。默认安全组不会允许任何入站或出站流量，除非流量来自其自身（一个\
  \ **自引用安全组**）。因此，如果不采取任何操作，Amazon QuickSight 将无法访问 Redshift 集群。为了允许 QuickSight 访问我们的\
  \ Redshift 集群，我们需要编辑 Redshift 集群的安全组，并允许来自 Amazon QuickSight IP 地址范围的入站流量。\n\n在下一节中，我们将提供启用\
  \ QuickSight 访问我们 Redshift 集群的分步指南。\n\n### 启用对 Redshift 集群的访问\n\n让我们开始：\n\n1. 首先，让我们获取我们\
  \ Redshift 集群的安全组：\n\n   ```bash\n   aws redshift describe-clusters --cluster-identifier\
  \ mycluster --region us-east-1\n   ```\n\n   AWS CLI 响应将包含有关集群的大量信息。安全组 ID 可以在 API\
  \ 响应的 _VpcSecurityGroups_ 键下找到：\n\n   ```json\n   \"VpcSecurityGroups\": [\n   \
  \    {\n           \"Status\": \"active\",\n           \"VpcSecurityGroupId\": \"\
  sg-xxxxxxx\"\n       }\n   ]\n   ```\n\n   或者，我们可以轻松地从 Redshift 控制台找到此信息。导航到 Redshift\
  \ 控制台，选择您的 Redshift 集群 (**mycluster**) 然后选择 **Properties** 选项卡。安全信息位于 **Network\
  \ and security settings** 下，因此展开此选项。\n\n### 网络和安全设置\n\n| 虚拟私有云 (VPC) | 可用区 | VPC\
  \ 安全组 | 公开可访问 |\n|---|---|---|---|\n| default | us-east-1f | 指定哪些实例和设备可以连接到集群。 |\
  \ 允许 VPC 外部的实例和设备通过集群端点连接到您的数据库。 |\n| default | 增强型 VPC 路由 已禁用 | | 已启用 |\n| 端点 URL\
  \ | | | |\n\n图 3.1 – Redshift 网络和安全设置选项卡\n\n2. 现在我们有了 VPC 安全组 ID，让我们检查其内容以验证它是否不允许对\
  \ Amazon QuickSight 的入站访问。单击安全组 ID 以打开 EC2 控制台并观察其规则。在 EC2 控制台中，单击安全组 ID 然后选择入站规则。您应该能够看到一个自引用入站规则，但没有其他规则。Amazon\
  \ QuickSight 不是此安全组的成员；因此，此阶段无法访问。\n\n3. 现在我们已经验证了入站规则，我们将添加对 Amazon QuickSight\
  \ 的入站访问。为此，请选择 **Edit inbound rules** 以添加新规则。从下拉菜单中选择 **Redshift** 作为规则类型。对于源，我们需要添加\
  \ QuickSight 服务 IP 地址空间。为此，我们需要查阅 AWS 文档 `https://docs.aws.amazon.com/quicksight/latest/user/regions.html`\
  \ 并找到我们正在使用的区域的 IP 地址空间。在我们的示例中，我们使用的是 **N. Virginia**。该区域的 QuickSight IP 地址范围是\
  \ `52.23.63.224/27`。将此 IP 范围添加为源。最好为此规则添加描述，以帮助您记住此配置的目的，例如 `QuickSight Access to\
  \ Redshift`。\n\n4. 验证值如下：\n\n   - **类型**: `Redshift`\n   - **协议**: `TCP`\n   - **端口范围**:\
  \ `5439`\n   - **源**: `Custom – 52.23.63.224/27`\n   - **描述**: `QuickSight Access\
  \ to Redshift`\n\n5. 验证这些值后，单击 **Save rules**。\n\n现在我们已经配置了 QuickSight 和 Redshift\
  \ 之间的网络访问，在下一节中，我们将设置我们的第一个 Redshift 数据源。\n\n### 设置 Redshift 数据源\n\n在本节中，我们将设置我们的\
  \ Redshift 数据源。对于此步骤，我们需要使用在 _第 2 章，Amazon QuickSight 简介_ 中创建的 Author 用户访问 Amazon\
