  \ Spectrum 表不会加载到数据仓库中；相反，它们位于我们的数据湖中，可以直接从该处访问和查询。\n\n> Note\n> 要访问 Spectrum 表中的数据，QuickSight\
  \ 需要能够访问 Amazon S3 中的底层数据。\n\n### 设置 S3 数据源\n\nQuickSight 的常见数据源是 S3。例如，您可能希望可视化存储在\
  \ Amazon S3 中的 CSV 文件。在配置 S3 数据源之前，您需要确保您的 QuickSight 账户拥有访问存储文件的 S3 位置所需的权限。\n\n\
  > Note\n> QuickSight 不会自动继承对新创建存储桶的访问权限。即使您启用了 **Access all buckets in my account**\
  \ 复选框，QuickSight 也只会在该时间点获取对账户中每个存储桶的访问权限，而不会获取从该时间点之后创建的任何存储桶的访问权限。如果您需要为新存储桶添加权限，您需要\
  \ AWS 管理员来管理 QuickSight 服务对账户中 AWS 服务的权限。\n\n对于 S3 数据源，QuickSight 需要一个包含设置数据集所需信息的清单文件。清单文件采用\
  \ JSON 格式，包含以下对象：\n\n- **fileLocations**：在此处，您只需使用 `URIs` 属性追加文件的完整 S3 URI（作为 JSON\
  \ 数组）来定义需要导入的文件（或文件）的 S3 位置。如果您想要添加特定 S3 前缀（类似于传统文件系统中的文件夹）下的所有文件，可以填充 `URIPrefixes`\
  \ 属性。\n\n- `globalUploadSettings`：`globalUploadSettings` 是可选的。您可以使用此属性覆盖 QuickSight\
  \ 的默认选项。QuickSight 默认使用 **CSV 格式**，使用 \",\" **(逗号)** 字段分隔符和 **双引号** (\") 作为文本限定符。默认情况下，QuickSight\
  \ 将使用 CSV 文件的第一行作为 **header**，这意味着第一行将确定数据集字段名称，并且不会被视为数据集中的值。\n\n现在我们已经了解了如何配置某些数据集类型，在下一节中，我们将使用\
  \ QuickSight 数据集编辑器编辑数据集。\n\n### 编辑数据集\n\n在本节中，我们将更仔细地查看作者用户编辑数据集通常需要执行的任务。在实际应用中，数据集通常需要进行一定程度的处理，以便\
  \ QuickSight 可以最佳地使用它们。\n\n这些任务包括以下内容：\n\n- Importing into SPICE\n- Renaming fields\n\
  - Changing the field types\n- Adding calculated fields\n- Combining datasets together\n\
  - Applying security filters\n\n在下一节中，我们将学习如何使用之前配置的示例数据集完成这些任务。\n\n### 导入到 SPICE\n\
  \n是时候学习如何将数据集导入 SPICE 了。我们将使用数据集编辑器更改查询模式，然后观察导入作业的状态。最后，我们将学习如何为 SPICE 数据集安排自动刷新作业。\n\
  \n### 设置数据集查询模式\n\n在本章前面，我们将 Redshift 数据集配置为 Direct Query。假设我们意识到数据仓库正忙于为许多应用程序提供服务并为组织生成报告，因此我们更愿意将数据导入\
  \ SPICE，以便 QuickSight 仪表板使用 SPICE 存储，而不是直接访问数据仓库。将数据导入 SPICE 后，我们的数据仓库将仅用于数据导入，而不用于查询数据以填充仪表板。\n\
  \n现在让我们将数据集添加到 SPICE 并配置其导入持续时间：\n\n1. 首先，您需要以我们之前创建的作者用户身份登录。\n2. 然后，在左侧菜单中选择 datasets\
  \ 以获取所有数据集的列表。\n3. 对于此实践示例，我们将 `yellowtrips_3mo` 数据集导入 SPICE。单击 `yellowtrips_3mo`，然后在您在以下屏幕截图中看到的弹出窗口中单击\
  \ **Edit dataset**。\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_69_0.png)\n\n图 3.6\
  \ – 数据集弹出屏幕\n\n4. 现在我们应该位于数据集编辑器主页面。在此页面上，我们将在本节后面完成大多数编辑和转换数据集的操作。目前，我们只需将 **Query\
  \ mode** 设置为 **SPICE**，如以下屏幕截图所示。完成后，单击 **Save**。\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_70_0.png)\n\
  \n图 3.7 – 将数据集查询模式设置为 SPICE\n\n5. 您会注意到我们的数据集现在被标记为 SPICE 数据集。现在我们首次设置了 SPICE 数据集，QuickSight\
  \ 将在后台自动运行其第一个导入作业。\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_70_1.png)\n\n图 3.8\
  \ – 查看 SPICE 数据集\n\n## 监控导入作业状态\n\n几分钟后，QuickSight 将完成其首个 SPICE 导入作业。接下来，我们将收集有关导入作业状态的信息：\n\
  \n1. 首先，单击数据集名称以获取有关导入状态的信息，如以下屏幕截图所示：\n\n### yellowtrips_3mo\n\nSPICE Dataset 1.3GB\n\
  \nImport complete:\n100% success\n4652013 rows were imported to SPICE\n0 rows were\
  \ skipped\n\nLast refreshed: 11 minutes ago\n\nView history\n\nRefresh Now\n\nSchedule\
  \ refresh\n\nEmail owners when a refresh fails\n\nData source name: test\n\nDatabase\
  \ name: dev\n\n图 3.9 – 查看导入状态\n\n从第一页我们可以观察到，460 万行数据已成功导入，使用了 1.3 GB 的 SPICE 容量。\n\
  \n2. 接下来，让我们查看导入历史。我们可以通过单击 **View history** 来完成此操作，我们将看到类似于以下内容的弹出屏幕：\n\n### View\
  \ refresh history of yellowtrips_3mo\n\nStart time within Last 90 days Job status\
  \ of All\n\n| Date Started (UTC) | Status | Information | Job Type |\n|---|---|---|---|\n\
  | | Completed | Ingestion completed in 1 minutes 9 seconds. Rows dropped: 0, Rows\
  \ ingested: 4652013 | Manual, Edit |\n| | Completed | Ingestion completed in 1 minutes\
  \ 9 seconds. Rows dropped: 0, Rows ingested: 4652013 | Manual, Edit |\n\n图 3.10\
  \ – 查看导入历史\n\n3. 从前面的屏幕中，我们可以获取有关数据集导入时间、导入数据集所需时间、导入的行数和跳过的行数的有用信息。\n\n现在我们已经介绍了刷新和导入作业，在下一节中，我们将了解如何自动刷新数据集。\n\
  \n### 安排自动刷新\n\nQuickSight 支持一个简单的刷新功能，用于自动刷新 SPICE 中的数据集。具体来说，用户可以设置每小时、每天、每周或每月的刷新作业。让我们看看如何操作：\n\
  \n> Note\n> 您可以为每个数据集配置多个刷新计划，除非您的计划是每小时。每个数据集最多可以有一个每小时刷新计划。\n\n1. 在我们的示例中，首先您需要访问数据集，然后单击\
  \ **Schedule refresh**，如以下屏幕截图所示。\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_72_0.png)\n\
  \n2. 接下来，您将收到一条通知，指出没有计划，并且您有创建新计划的选项。单击 **Create** 按钮以创建新的刷新计划。\n\n3. 接下来，您可以使用\
  \ _Figure 3.12_ 中显示的编辑器创建计划。为了本教程的目的，我们不需要创建计划刷新，因为我们的数据集是静态的，但请随时熟悉各种选项。\n\n\n\n\
  \n\n## 创建计划\n\n时区\n\nEurope/London\n\n重复\n\n每天\n\n开始\n\n每小时\n\n每天\n\n每周\n\n每月\n\n\
  取消\n\n创建\n\n图 3.12 – “创建计划”对话框\n\n现在，我们已经了解了如何配置 SPICE 数据集、安排自动刷新以及监控刷新作业，在下一节中，我们将学习如何通过重命名列和数据类型来编辑数据集。\n\
  \n### 编辑列名和数据类型\n\nBI 开发人员在构建可视化之前编辑数据集是很常见的。例如，列名直接来自数据库时，可能不够用户友好或不够描述性。在设计 BI\
  \ 应用程序时，我们需要从最终用户的角度出发，并尝试以友好且描述性的方式命名列，使其在 BI 应用程序的上下文中易于理解。同样重要的是，要确保数据集中的每个字段都具有预期的数据类型，以便我们可以执行所需的计算。在本节中，我们将提供一个分步指南，介绍如何使用我们之前配置的\
  \ SPICE 数据集来编辑列和数据类型。\n\n### 重命名列\n\n使用数据集编辑器重命名列是一个简单的过程：\n\n1. 首先，我们通过访问数据集并选择\
  \ **编辑数据集** 选项来开始，这将带我们进入数据集编辑器页面。\n\n2. 在数据集编辑器中，我们可以看到数据的预览，包括列名，如下图所示。\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_74_0.png)\n\
  \n图 3.13 – 数据集预览屏幕\n\n3. 接下来，我们可以通过单击列名旁边的铅笔图标来简单地重命名列名。例如，让我们将 `tpep_pickup_datetime`\
  \ 列重命名为更用户友好的名称 `Pick up date`，如下图所示。在此阶段，我们还可以为列添加描述，以便向其他可能处理同一数据集的作者描述该列。\n\n\
  ![](img/33bad1d211a2d93fd743a1978d403f9a_74_1.png)\n\n图 3.14 – “编辑字段”对话框\n\n现在我们已经了解了如何编辑列名和描述，在下一节中，我们将了解如何编辑数据类型。\n\
  \n### 更改数据类型\n\n通过为每个列使用正确的数据类型，我们可以确保访问数据集中每个列的正确功能。例如，QuickSight 支持日期列类型的时间聚合。如果日期列被错误地映射为字符串列，则无法使用这些聚合。同样，计算平均值或最小值/最大值等计算仅适用于数值数据类型。如果我们需要执行和可视化这些计算，我们需要确保已应用数值数据类型。\n\
  \nQuickSight 支持以下数据类型：\n\n- 字符串\n- 日期\n- 十进制\n- 整数\n\n还支持以下地理空间类型：\n\n- 县\n- 州\n\
  - 城市\n- 邮政编码\n- 纬度\n- 经度\n\n现在，让我们看一个快速的动手示例，了解如何在数据集中编辑数据类型。对于此示例，我们将使用 `yellowtrips`\
  \ 数据集（在 `yellowtrips_3mo` 集中，列数据类型似乎是正确的，因此没有什么可编辑的）。\n\n1. 首先，我们需要访问 `yellowtrips`\
  \ 数据集并导航到数据集编辑器。\n2. 在此数据集中，您可以看到日期列已被识别为字符串。这是我们需要编辑的内容，以便我们可以在后续分析中使用基于时间的聚合。\n\
  \n3. 要更改数据类型，我们需要单击列名下的数据类型（在此示例中为 **字符串**）并选择 **日期**。\n\n4. 接下来，QuickSight 将打开编辑日期格式弹出屏幕，如下图所示。我们需要定义数据集的日期格式。在我们的示例中，这是\
  \ `yyyy-MM-dd HH:mm:ss`，其中 `yyyy` 表示使用四位数的年份（例如，2020）；`MM` 表示使用两位数的月份（例如，2 月为 `02`），语法中的其他元素也是类似。一旦我们输入日期格式，QuickSight\
  \ 将根据所选的日期格式验证我们的数据集，以确保数据符合该格式。\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_76_0.png)\n\
  \n图 3.15 – 编辑日期格式\n\n我们可以对 `tpep_dropoff_datetime` 列重复此过程。现在我们已经了解了如何编辑列，包括更改列名和类型以及添加描述，在下一节中，我们将学习高级数据集操作，包括联接和安全控制。\n\
  \n### 使用高级操作\n\n在本节中，我们将重点介绍高级数据集操作。我们将学习如何向数据集添加计算字段并应用数据集操作，例如筛选和联接。最后，我们将添加安全控制，包括行级和列级筛选器。对于本节，我们将使用本章前面配置的\
  \ SPICE 数据集。\n\n### 添加计算字段\n\nQuickSight 允许 BI 开发人员在数据准备阶段向其数据集添加计算字段。然后，可以使用包含计算字段的数据集来开发多个分析。\n\
  \nQuickSight 提供了一系列预构建函数，我们可以在构建计算字段时使用。这些函数包括以下内容：\n\n- **聚合函数** 用于计算多个值上的指标。例如，我们可以使用\
  \ `min()` 函数来计算一组值的最小值。\n- **条件函数** 允许我们在计算字段中使用条件逻辑，例如，如果传递的参数不为 null，`isNotNull()`\
  \ 返回 `true`。\n- **日期函数** 帮助我们处理日期列类型。例如，我们可以使用 `dateDiff()` 函数来计算两个日期字段之间的差异。\n\
  - **数值函数** 和 **字符串函数** 可以分别帮助我们处理数值和字符串值。例如，我们可以使用 `abs()` 函数计算给定表达式的绝对值，或者可以使用\
  \ `concat()` 函数连接两个或多个字符串。\n- 最后，**表计算** 可用于发现维度如何影响特定度量。例如，`sumOver()` 函数按维度列表分区计算度量的总和。\n\
  \n### 使用 Amazon QuickSight 准备数据\n\n要添加计算字段，我们执行以下操作：\n\n1. 首先，我们需要在数据集编辑器中打开数据集。\n\
  2. 然后，我们可以简单地选择 **添加计算字段** 选项来进入计算字段编辑器，如下图所示：\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_78_0.png)\n\
  \n图 3.16 – 计算字段编辑器\n\n3. 接下来，让我们添加第一个计算字段。在我们的数据集中，虽然我们有接车时间和下车时间，但获取这两个时间戳之间以分钟为单位的差异可能很有趣。要计算此差异，我们可以键入以下内容：\n\
  \n```\ndateDiff({Pick up Date},{tpep_dropoff_datetime},\"MI\")\n```\n\n4. 最后，让我们给它一个描述性的名称，例如\
  \ `Trip duration (mins)`，然后单击 **保存**。\n\n现在我们可以在数据集编辑器中观察新的计算字段。接下来，我们将看到其他数据集操作，包括筛选和联接。\n\
  \n### 筛选和联接数据集\n\n在本节中，我们将讨论如何筛选和联接数据源。\n\n### 筛选数据集\n\n存在您可能需要从数据源中获取表子集的场景。  \n\
  QuickSight 支持数据源筛选，以便您可以将数据集所需的子集导入  \n到 SPICE。这允许您仅使用真正需要的 SPICE 容量来构建高效的 BI 解决方案。在\
  \ QuickSight 中添加筛选器很简单。在以下示例中，我们  \n将看到如何从我们之前创建的数据集中筛选出列和行的示例：\n\n1. 首先，您需要访问数据集编辑器。在左侧，您可以找到\
  \ **排除的字段** 和 **筛选器** 菜单。\n2. 对于此示例，让我们假设我们对 `store_and_fwd_flag` 列中的信息不感兴趣。要从数据集中排除此列，请展开\
  \ **排除的字段** 选项，然后选择 `store_and_fwd_flag`。\n3. 现在我们已经删除了一个列，让我们应用一个筛选器来删除行。让我们假设对于此分析，如果距离显示为\
  \ 0.0，我们不想包含行程，并且我们只希望值大于 0 的数据。\n4. 展开 **筛选器** 菜单并选择 `trip_distance` 列。从下拉菜单中选择\
  \ **大于**，然后输入 `0`。添加这些值后，筛选器应如下图所示：\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_79_0.png)\n\
  \n图 3.17 – 添加数据集筛选器\n\n5. 接下来，单击 **应用**。QuickSight 将为数据集触发刷新作业。\n\n\n\n\n\n现在我们已经学习了如何在数据集上应用筛选器，在下一节中，我们将通过将数据集与参考数据进行连接来丰富我们的数据集。\n\
  \n### 连接数据集\n\n连接数据集可用于将数据集合并在一起，并提供数据的单一视图。拥有相关且高质量的数据是我们 BI 应用程序成功的关键。在本示例中，我们将使用之前使用过的数据集，并使用一个可以从网站提供商处下载的参考数据集进行丰富。或者，我们可以创建一个查找\
  \ CSV 文件并将其上传到 QuickSight。让我们开始：\n\n1. 首先，让我们从 https://s3.amazonaws.com/nyc-tlc/misc/taxi+_zone_lookup.csv\
  \ 下载我们的小型查找表。\n2. 接下来，在数据集编辑器中，单击 **Add data** 然后上传文件。\n3. 上传查找文件。\n4. 接下来，为连接列选择位置\
  \ ID，并选择 **Left** 作为连接配置。请参阅以下截图以获取示例。\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_80_0.png)\n\
  \n图 3.18 – 连接配置\n\n5. 应用后，您可以在数据集编辑器中确认新列。\n\n现在我们已经学习了如何连接数据集，我们将学习如何为数据集添加安全控制。\n\
  \n### 配置安全控制\n\nQuickSight 支持行级和列级安全控制。在本节中，我们将学习如何为数据集添加安全控制。\n\n### 添加列级安全控制\n\
  \n在某些情况下，BI 开发人员可能希望限制对特定列的访问以保护敏感数据（例如个人身份数据）。一旦 BI 开发人员添加了列级安全性，只有允许的用户才能查看和访问受限列。默认情况下，当您与另一用户共享数据集时，您会授予他们访问该数据集所有列的权限。因此，如果您需要限制某些列，则需要添加列级安全控制。要添加列级安全性，您可以选择\
  \ **Column-level security** 选项。\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_81_0.png)\n\
  \n图 3.19 – 列级安全性\n\n然后您将看到数据集中的列列表。您会注意到，默认情况下，有权访问数据集的用户和组可以访问所有列。要限制某个列，您需要选择它，然后添加您要启用访问权限的用户或组。此选择将覆盖“所有人”默认设置，只有您添加的用户或组才能访问。完成后，您会注意到数据集旁边有一个挂锁图标，以确认存在安全限制。\n\
  \n### 添加行级安全性\n\nQuickSight 支持数据集的行级安全性。当您希望某些用户或组根据其用户名或组成员身份对数据子集拥有不同级别的访问权限时，行筛选器特别有用。要应用行级安全性，您需要提供权限文件或在数据库中创建权限表，然后将其添加到\
  \ QuickSight。在我们的示例中，`vendorid` 列有两个不同的值，`2` 和 `1`，分别代表不同的供应商。让我们设想一个场景，供应商 `1`\
  \ 的用户需要访问数据集，但他们只能访问供应商 `1` 的数据，而不能访问供应商 `2` 的数据。同样，供应商 `2` 只能被允许查看其数据。在本示例中，我们可以应用行级安全控制。\n\
  \n### 应用行级筛选器\n\n在我们的示例中，我们可以考虑两个不同的用户，供应商 `1` 的 `user1` 和供应商 `2` 的 `user2`。QuickSight\
  \ 将访问数据集的用户名与 `UserName` 字段的值进行匹配，然后使用其余列应用筛选器或筛选器。在我们的示例中，它将使用 `yellowtrips_3mo`\
  \ 数据集中的 `vendorid` 列。\n\n请参阅我们下面的映射表，了解之前描述的场景：\n\n| UserName | vendorid |\n|---|---|\n\
  | user1 | 1 |\n| user2 | 2 |\n\n图 3.20 – 映射表\n\n### 配置安全控制\n\n要应用行级权限，我们需要执行以下操作：\n\
  \n1. 我们将映射表保存为 `.csv` 文件，然后将其导入为新数据集。文件格式如下：\n\n```\nUserName,vendorid\nuser1,\"\
  1\"\nuser2,\"2\"\n<your-admin-user>,\"\"\n```\n\n2. 编辑新创建的数据集，并确保 `vendorid` 字段的类型为\
  \ **String**。\n\n3. 然后，选择 **yellowtrips_3mo** 数据集并选择 **Row-level security**，如下面的截图所示：\n\
  \n![](img/33bad1d211a2d93fd743a1978d403f9a_83_0.png)\n\n图 3.21 – 添加行级安全性\n\n4. 然后选择您在\
  \ _步骤 1_ 中添加的映射表。\n\n5. 然后单击 **Apply to dataset**。现在筛选器已应用，如下面的截图所示：\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_83_1.png)\n\
  \n图 3.22 – 数据集规则已应用\n\n下一章不需要这些权限。应用行级筛选器后，您可以通过执行以下操作将其删除：\n\n1. 选择 **yellowtrips_3mo**\
  \ 数据集，然后选择 **Row-level security**。\n2. 在选定映射表的情况下，单击 **Remove dataset**。\n3. 再次单击\
  \ **Remove dataset** 以确认操作。\n\n## 摘要\n\n恭喜您完成本章。在本章中，我们学习了如何在 Amazon QuickSight\
  \ 中创建和编辑数据集。我们成功将数据集导入 SPICE 并安排自动刷新作业。我们还编辑了字段并添加了自定义计算，以从数据集及其列中获得更多价值。然后，我们研究了高级数据集操作，包括连接数据集并使用参考数据对其进行丰富。在本章的最后部分，我们学习了如何应用安全控制（无论是列级还是行级），以便您可以保护敏感信息或为用户应用特定筛选器。\n\
  \n在下一章中，我们将学习如何使用 QuickSight 分析和仪表板来可视化数据集。\n\n## 问答\n\n1. 直接查询和 SPICE 数据源有什么区别？\n\
  2. 如何在 Amazon QuickSight 中添加列级安全控制？\n3. 我们什么时候需要为数据集配置行级安全性？\n4. 为什么我们可能需要从数据集中排除某些列？\n\
  5. 我们如何使用参考数据丰富数据集？\n6. 为数据集中的每个列配置正确的数据类型为什么很重要？\n\n## 延伸阅读\n\n- • QuickSight 用户指南\
  \ - 准备数据：https://docs.aws.amazon.com/quicksight/latest/user/preparing-data.html。\n"
- "## 4 开发可视化和仪表板\n\n在本章中，我们将介绍 Amazon QuickSight 的主要分析构建功能。我们将首先探索作者用户界面并了解不同的可视化类型。在添加某些可视化类型并解释其功能后，我们将介绍仪表板的概念，并展示如何通过简单的实操示例将仪表板共享给业务用户。最后，我们将探讨如何使用现有或自定义主题来设计仪表板。\n\
  \n在本章中，我们将涵盖以下主题：\n\n- 使用 QuickSight 可视化\n- 发布仪表板\n- 自定义应用程序的外观和感觉\n\n### 技术要求\n\
  \n在本章中，您需要以下内容：\n\n- 一个 AWS 账户\n- 一个配置了作者和读者用户的 QuickSight 账户\n- 我们在 _第 3 章，使用 Amazon\
  \ QuickSight 准备数据_ 中创建的数据集\n\n### 使用 QuickSight 可视化\n\n可视化定义为您可以添加到 QuickSight 分析中的屏幕小部件，用于可视化数据。选择正确的可视化类型对于\
  \ BI 应用程序的成功至关重要。在本节中，我们将了解支持的可视化类型以及如何为不同场景选择最合适的可视化类型。\n\n### 创建分析\n\n在查看可用的可视化类型之前，我们需要创建第一个分析。QuickSight\
  \ 分析是开发 BI 应用程序的主要用户界面。在处理分析时，您将能够添加数据可视化小部件、配置 ML 功能，并配置 BI 应用程序的外观和感觉。\n\n要创建分析，请执行以下步骤：\n\
  \n1. 首先，以作者用户身份登录 QuickSight。\n2. 接下来，从左侧菜单中选择 **Analyses**，然后选择 **New analysis**，如下面的截图所示：\n\
  \n![](img/33bad1d211a2d93fd743a1978d403f9a_86_0.png)\n\n图 4.1 – Analyses 菜单\n\n\n\
  \n\n\n## 然后，您需要选择一个数据集来开始分析。选择我们之前配置的 yellowtrips_3mo 数据集，并选择 **Create Analysis**。\n\
  \n## 这将带您进入主分析用户界面，如下图所示：\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_87_0.png)\n\
  \nFigure 4.2 – 分析用户界面\n\n这是我们在整本书中将用于开发 BI 应用程序的主用户界面。\n\n> **Note**\n> 熟悉分析用户界面，包括主屏幕、顶部菜单、侧边菜单、字段容器、数据集、列列表和可视化类型选择工具，因为我们将在整本书中使用它们。\n\
  \n接下来，我们将通过查看示例数据集的示例，重点介绍不同的可视化类型。\n\n### 支持的可视化类型\n\nQuickSight 支持多种可视化类型，您可以选择这些类型来可视化数据。AWS\
  \ 正在不断扩展此列表。在接下来的几个部分中，我们将通过关注业务问题以及可视化如何帮助您解决这些问题来探索这些类型。\n\n### 可视化指标或关键绩效指标\n\
  \n在某些场景中，您可能希望可视化 **关键绩效指标** (KPI)。可视化指标相对于目标指标的进度，或将当月销售额与上月销售额进行比较，是组织通常需要监控的\
  \ KPI 示例。适用于这些类型可视化的两种可视化类型如下：\n\n- KPI 可视化类型\n- 仪表图\n\n让我们使用在 _Chapter 3, Preparing\
  \ Data with Amazon QuickSight_ 中创建的数据集，更仔细地查看每种可视化类型。\n\n### KPI 可视化类型\n\nKPI **可视化类型**允许您显示指标，包括相对于时间间隔或趋势的比较。要选择\
  \ KPI 可视化类型，您只需选择 ![](Aspose.Words.04d2b017-2c05-4e5a-8a24-02e0e0b6c449.001.png)\
  \ 图标。然后，您可以开始参数化 KPI 可视化，如下图所示：\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_88_1.png)\n\
  \nFigure 4.3 – KPI 可视化字段\n\nKPI 可视化允许我们设置三种类型的字段：\n\n- **Value**：此字段表示我们要衡量的值。\n\
  - **Target value**：此字段表示我们要将值字段与之比较的目标指标。\n- **Trend group**：在某些场景中，您需要可视化指标的趋势；例如，随时间的变化趋势。趋势组字段可用于此目的。\n\
  \n> Note\n> 您可以将目标值或趋势组与 KPI 可视化一起使用，但不能同时使用。\n\n要了解 KPI 可视化，我们将查看使用本书前面导入 QuickSight\
  \ 的纽约出租车数据集的示例。在此示例中，假设我们想要可视化小费相对于总车费的表现情况。小费低于总额 10% 可能表明人们不太慷慨。让我们看看数据告诉我们什么！\n\
  \n对于此 KPI 可视化，我们将使用 `tip_amount` 作为值字段，并使用 `total_amount` 作为目标。要添加这些字段，只需将每个字段拖放到相应的列中，如下所示。添加这些字段后，可视化应如下所示：\n\
  \n![](img/33bad1d211a2d93fd743a1978d403f9a_89_0.png)\n\nFigure 4.4 – 小费 KPI 可视化\n\
  \n现在我们有了第一个 KPI 可视化，将配置其中的一些参数。字段中的每个字段都可以通过选择相应的下拉菜单来单独配置，如下所示：\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_90_0.png)\n\
  \nFigure 4.5 – 字段选项\n\n从此菜单中，我们可以选择字段的聚合方式和格式。对于聚合，我们有以下选项：\n\n- Sum (default)。\n\
  - Average。\n- Count。\n- Count distinct。\n- Max。\n- Median。\n- Min。\n- Percentile：选择百分位数时，还需要选择百分位数值；例如，95\
  \ 以计算 P95。\n- Standard deviation。\n- Standard deviation: Population。\n- Variance。\n\
  - Variance: Population。\n\n对于我们的示例，我们可以保留默认设置，即 **Sum** 聚合，因为它显示了小费和车费的总金额。接下来，让我们查看格式。可用选项如下：\n\
  \n- **Number**\n- **Currency**\n- **Percentage**\n\n**Currency** 格式类型更适合我们的字段。选择类型后，您可以通过选择\
  \ **More formatting options** 菜单详细编辑格式。最后，我们可以通过选择可视化旁边的齿轮图标来格式化整个可视化。这将打开一个菜单，我们可以在其中编辑比较格式（例如，实际值的百分比）、更改字体大小和更改标题。让我们将标题设置为\
  \ **New York Taxi Tips Percentage**，并将副标题设置为 **10% Target**。现在，可视化应如下所示：\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_91_0.png)\n\
  \nFigure 4.6 – 纽约出租车小费百分比 KPI\n\n现在我们已经了解了如何配置 KPI 可视化类型，我们将学习如何配置仪表图可视化。\n\n###\
  \ 仪表图\n\n仪表图是将值与目标值进行比较的有用方法。仪表图帮助我们可视化相对于目标的进度。\n\n> **Note**\n> 与仪表图类似的可视化可以通过\
  \ KPI 可视化上的进度条来实现。\n\n要了解仪表图，我们可以使用纽约出租车数据集。在此示例中，假设我们 3 个月的目标是拥有 650 万名乘客，并且我们希望将实际数字与此目标进行比较。添加此目标值的快速方法是简单地创建一个计算字段并将其赋值为\
  \ 6,500,000。此值将添加到数据集的每一行，增加所需的 SPICE 空间总量。然后，我们可以使用 `passenger_count (sum)` 作为仪表图的\
  \ **Value** 字段，并将新创建的计算字段（聚合为平均值）作为 **Target** 字段。与我们之前看到的 KPI 图表类似，我们将能够访问此可视化的其他设置，例如设置标题、控制显示的值、字体粗细、数据标签和工具提示。请随意熟悉此可视化的设置。使用默认设置（仅增加字体大小），仪表可视化将如下所示：\n\
  \n![](img/33bad1d211a2d93fd743a1978d403f9a_92_0.png)\n\nFigure 4.7 – 仪表图\n\n现在我们已经了解了如何可视化\
  \ KPI，我们可以专注于其他可视化类型。接下来，我们将查看如何使用可视化类型来帮助我们可视化数据集中所选属性的构成。\n\n### 可视化属性的构成\n\n\
  可视化数据集中一个或多个维度的构成，可能是您希望通过 BI 应用程序回答的常见问题。例如，您可能希望查看每个地区对总销售额的贡献程度。在我们的示例中，我们可以可视化每个出租车区域对收取的总出租车车费的贡献程度。这些类型的问题可以使用以下类型的图表来可视化：\n\
  \n- 饼图\n- 环形图\n\n在设置这两种可视化时，您需要指定一个组/颜色字段和值字段。\n\n> Note\n> 如果您不指定值字段，QuickSight\
  \ 将默认使用记录计数。\n\n使用我们的示例数据集，我们将使用环形图来按服务区域可视化记录。同样，我们将使用饼图来按行政区可视化记录计数。为此，我们可以将 service_zone\
  \ 字段和 Borough 字段分别设置为环形图和饼图的组/颜色。结果，这两种可视化将如下所示：\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_93_0.png)\n\
  \nFigure 4.8 – 环形图和饼图\n\n这两种可视化类型都可以帮助您可视化属性的构成，并且在类别数量较少时效果尤其好。当您想要进行并排比较时，这两种可视化类型效果不佳。接下来，我们将查看可以帮助您可视化此类并排比较的可视化类型。\n\
  \n### 可视化并排比较\n\nQuickSight 允许您通过提供多种柱状图选项来可视化并排比较。水平、垂直或堆叠柱状图是此类可视化的一些示例。要了解这些可视化，我们将使用我们的数据集并配置一个柱状图。假设我们想要了解和比较纽约各行政区的小费百分比：\n\
  \n1. 首先，我们需要一个计算字段，并必须将 {tip_amount}/{fare_amount} 值分配给 Tip Percentage。\n2. 接下来，我们需要添加可视化。柱状图是比较各行政区小费百分比的理想解决方案。\n\
  \n\n\n\n\n柱状图（无论是垂直还是水平）都需要配置以下字段：\n\n- **X 轴**\n- **值**\n- （可选）**分组/颜色**\n\nX 轴是您希望针对其值来理解的主要维度。在我们的示例中，这将是\
  \ Borough 字段。对于值字段，您需要设置要理解和比较的值。在我们的示例中，这将是新创建的 Tip Percentage 计算字段，聚合方式为平均值。最后，如果您需要为可视化添加另一个维度，可以添加分组/颜色字段。\n\
  \n> **Note**\n> 柱状图至少需要一个 X 轴和一个值字段。分组/颜色字段是可选的。如果您需要在同一可视化中监控多个值，可以设置多个值字段。\n\n\
  应用这些字段后，垂直柱状图将如下所示：\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_94_0.png)\n\n图 4.9\
  \ – 垂直柱状图\n\n现在我们已经学习了如何使用简单的柱状图，在下一节中，我们将学习如何可视化时间序列。\n\n### 可视化时间序列\n\nBI 应用程序通常需要可视化指标随时间的变化情况。时间序列数据通常使用折线图来表示。时间序列可视化需要确保时间字段在\
  \ QuickSight 中存储为 `Date` 字段类型。这将启用基于时间的聚合；例如，天、周、月、季度或年。\n\n在本节中，我们将使用简单的折线图来创建第一个时间序列可视化。假设我们想要可视化出租车车费随时间的变化总额，以便观察车费金额随时间的分布情况。\n\
  \n折线图要求您定义以下内容：\n\n- **X 轴**：在时间序列中，这将是我们的时间字段。\n- **值**：您想要随时间测量的值。\n- 可选，**颜色**字段：当您想要可视化多个类别时，可以使用\
  \ `Color` 字段。这将导致同一折线图上出现多条线。\n\n在我们的示例中，您需要选择 `tpep_dropoff_datetime` 作为 X 轴，`total_amount\
  \ (Sum)` 作为值。此数据集仅包含 3 个月的数据；因此，每日聚合可能有足够的数据点来进行有意义的数据可视化。您需要确保选择了每日聚合。为此，请选择 X\
  \ 轴列并展开下拉菜单，如以下屏幕截图所示：\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_95_0.png)\n\n\
  图 4.10 – 基于时间的聚合\n\n以下屏幕截图显示了从 9 月到 12 月期间每日聚合的总车费金额折线图：\n\n### 按时间汇总的总金额\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_96_0.png)\n\
  \n图 4.11 – 折线图\n\n现在我们已经学习了如何设置折线图，我们将学习如何使用表格可视化。\n\n### 使用表格\n\n当我们想要显示特定指标的值，而不使用其他可视化手段时，表格可能很有用。表格可视化可用于显示原始数据，这对于熟悉用于填充\
  \ BI 应用程序的数据的用户来说可能很有用。QuickSight 支持以下内容：\n\n- 用于简单表格可视化的表格可视化\n- 用于需要在多个维度上汇总数据的表格的透视表可视化\n\
  \n对于简单表格可视化，您需要在字段井中定义值和分组字段。分组字段用于汇总数据，而值字段包含将添加到表格中的指标，并按分组字段进行细分。如果您对多个指标感兴趣，可以添加一个或多个值字段。您可以使用一个或多个分组字段；但是，如果您需要使用多个维度来细分数据，透视表可能更合适。\n\
  \n要了解表格的用法，让我们使用我们的示例数据集。在这个示例中，假设我们想要可视化一个按区划分的总车费金额表格。对于这个可视化，我们将使用 Borough 列作为分组字段，fare_amount\
  \ (sum) 作为值字段。\n\n您可以使用其他选项自定义表格可视化。首先，您可以控制可视化标题和列名称。在我们的示例中，我们可以将 `fare_amount`\
  \ 列名称替换为用户友好的名称 `Fare amount`，这更易于阅读。此外，我们可以选择显示值字段的总聚合，并控制总计的显示方式和位置。在我们的示例中，将总计添加到表格中将很有用。\n\
  \n> Note\n> 表格可视化中默认不显示总计，因此如果我们需要显示它，则需要启用它。\n\n请随时通过可视化右侧的齿轮图标熟悉其他设置。在以下屏幕截图中，您可以看到使用我们示例数据的表格可视化：\n\
  \n### 按区划分的出租车车费\n\n| Borough | Fare Amount |\n|---|---|\n| Total | $55,791,387\
  \ |\n| Bronx | $1,122,186 |\n| Brooklyn | $2,172,315 |\n| EWR | $2,907 |\n| Manhattan\
  \ | $45,001,178 |\n| Queens | $6,022,819 |\n| Staten Island | $77,035 |\n| Unknown\
  \ | $1,392,948 |\n\n图 4.12 – 表格可视化\n\n现在，假设我们想要为读者提供一个表格，让他们能够深入了解每个区的数据，并按支付类型进行细分。可以使用透视表可视化代替简单表格。在透视表中，您可以定义以下内容：\n\
  \n- 行\n- 列\n- 作为行或列的值\n\n在我们的示例中，我们将使用 fare_amount 列作为值字段（作为列）。对于行字段，这次我们将添加两个字段：Borough\
  \ 和 Payment Type。与表格可视化类似，您可以使用齿轮图标访问其他设置，以更改可视化的标题、字段命名和总计计算。此外，透视表可以为每个类别显示小计，并具有其他样式控制。以下透视表使用了我们示例中的数据集：\n\
