  请随意尝试在分析中为其他可视化对象添加更多筛选器操作。接下来，我们将学习如何配置导航操作。


  ### 使用导航操作


  在向分析添加可视化对象时，可能会出现单个页面包含过多可视化对象的情况。在这些场景中，您可以将可视化对象组织到工作表中。对于每个工作表，您可以提供用户友好的名称，以帮助
  BI 用户导航仪表板。对于每个工作表，您可以提供以下详细信息：


  - 标题

  - 描述


  这两者都可以帮助为用户提供上下文。标题和描述在存在多个工作表的场景中尤其有用。导航操作可以帮助您定义操作，允许用户在同一分析中快速导航到不同的工作表。


  配置导航操作时，您需要选择分析中的一个可视化对象，然后提供以下信息：


  - **操作名称**：导航操作的名称。

  - **激活方式**：**菜单选项**或**选择**：**菜单选项**会在您单击可视化对象中的数据点时添加一个菜单项。单击该选项时，将激活 URL 操作。另一方面，使用**选择**选项时，单击数据点会直接激活
  URL 操作。

  - **目标工作表**：操作激活后用户重定向到的工作表名称。

  - **参数**：这允许用户在导航到目标工作表后设置参数值。


  接下来，我们将探讨另一种类型的操作：URL 操作。


  ### 使用 URL 操作


  URL 操作允许我们在用户单击仪表板特定区域时，将用户重定向到另一个网站或另一个仪表板。URL 操作可以帮助 BI 用户轻松获取仪表板的额外上下文。


  配置 URL 操作时，您需要选择分析中的一个可视化对象，然后提供以下信息：


  - **操作名称**：URL 操作的用户友好且描述性的名称。

  - **激活方式**：**菜单选项**或**选择**：**菜单选项**会在您单击可视化对象中的数据点时添加一个菜单项。单击该选项时，将激活 URL 操作。另一方面，使用**选择**选项时，单击数据点会直接激活
  URL 操作。

  - **URL**：您希望将用户重定向到的 URL。


  > **注意**

  > 您可以在 URL 字段中添加对字段值参数的引用。

  > 这将允许您根据用户选择，将用户重定向到不同的 URL。引用参数的语法是 <<$parameter-name>>，而引用字段的语法是 {{ {field-name}
  }}。


  - **打开方式**：此选项决定浏览器如何从 URL 操作打开链接。选项包括在同一标签页中打开、在不同标签页中打开，或在不同浏览器窗口中打开。


  要了解如何设置 URL 操作，我们将使用我们的 New York Taxi 分析。假设我们需要在每个 New York 区上添加一个指向包含额外信息的外部网站的链接。对于此示例，我们将使用在第
  4 章“开发可视化对象和仪表板”中配置的柱状图可视化对象。我们将使用 Wikipedia 作为外部网站：


  1. 首先，导航到分析并选择柱状图可视化对象。

  2. 接下来，在选中可视化对象的情况下，单击左侧菜单中的 Actions。

  3. 单击 Add action，然后从 Action Type 下拉菜单中选择 URL action。

  4. 添加以下屏幕截图中显示的值：


  ![](img/33bad1d211a2d93fd743a1978d403f9a_128_0.png)


  图 5.14 – URL 操作


  这些值如下：

  • **操作名称**：Wikipedia look up

  • **激活方式**：Menu option

  • **URL**：`https://en.wikipedia.org/wiki/<<{Pick Up Borough}>>`

  • **打开方式**：New browser tab


  5. 单击 Save。


  URL 操作现已应用于我们的可视化对象。要测试 URL 操作，您需要单击应用了操作的可视化对象上的数据点。在我们的示例中，每个数据点都将重定向到不同的 URL，因为我们将
  Pickup Borough 字段作为 URL 的一部分。在现实世界中测试类似内容时，您需要确保每个 URL 都能正确地将用户重定向。以下屏幕截图显示了我们在柱状图中右键单击
  Manhattan 柱状图时将看到的内容。请注意，会出现一个 **Wikipedia look up** 菜单选项，单击它将重定向到 Manhattan Wikipedia
  页面 (`https://en.wikipedia.org/wiki/Manhattan`)：


  ![](img/33bad1d211a2d93fd743a1978d403f9a_129_0.png)


  图 5.15 – URL 操作菜单项


