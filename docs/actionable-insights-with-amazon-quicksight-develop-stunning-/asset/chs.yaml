  \ 能够访问的存储桶。默认情况下，所选存储桶具有只读权限。但是，您必须为 Athena 工作组功能授予写入权限。\n\n全选\n\nS3 存储桶写入权限（用于\
  \ Athena 工作组）\ndata-lake-xxxxxxxxx\n\n图 9.7 – 启用 Amazon Athena 访问权限\n\n+   5. 单击\
  \ **Finish**。\n+   6. 要验证访问权限，您可以创建一个新的 Athena 数据集（如我们在 _Chapter 2, Introduction\
  \ to Amazon QuickSight_ 中学习的那样）。\n\n虽然设置起来很简单，但这会让所有用户对 Athena 和 S3 具有相同的访问权限。当涉及到不同用户和组对数据的权限时，组织通常有不同的要求。出于这个原因，QuickSight\
  \ 提供了定义精细访问控制的功能。此功能可通过 **Security and Permissions** 设置下的 **Resource access for\
  \ individual users and groups** 菜单访问。这将允许您将特定的 IAM 策略分配给特定的 QuickSight 用户或组，从而为您的\
  \ QuickSight 环境定义更详细的权限。\n\n现在我们已经学习了如何在不使用 Lake Formation 的情况下创建 Athena 数据集，在下一节中，我们将了解如何配置由\
  \ Lake Formation 管理的数据集。\n\n### 使用 Amazon Lake Formation 配置 Amazon Athena 数据集\n\n\
  Lake Formation 在您的 Athena 数据集之上提供了额外的权限层。您不再使用 IAM 授予权限，而是将 S3 存储注册到 Lake Formation，然后您可以使用\
  \ Lake Formation 控制台或 Lake Formation API 授予或撤销数据目录中表的权限。Lake Formation 支持基于列的访问策略、基于行的过滤和基于标签的访问控制，这些功能允许您为数据集定义高级且精细的访问控制。\n\
  \n您不再定义 IAM 策略并将其分配给用户或组，而是可以使用 Lake Formation 集中管理权限。在 Lake Formation 中，您使用授予/撤销语法（这对\
  \ **business intelligence**（BI）开发人员来说会很熟悉）来管理权限，而不是为 IAM 定义 JSON 文档。使用 QuickSight\
  \ 主体时，您需要将 QuickSight 用户或组 `arn` 作为 Lake Formation 主体，如下图所示：\n\n### 授予数据权限\n\n##\
  \ 主体\n\nIAM 用户和角色 来自此 AWS 账户的用户或角色。\n\nSAML 用户和组 SAML 用户和组或 QuickSight ARN。\n\n\
  外部账户 此账户之外的 AWS 账户或 AWS 组织。\n\n### SAML 和 Amazon QuickSight 用户和组\n\n输入 SAML 用户或组\
  \ ARN 或 Amazon QuickSight ARN。按 Enter 键添加更多 ARN。\n\narn:aws:quicksight:us-east-1:\
  \ user/default/author\n\n## LF-Tags 或目录资源\n\n由 LF-Tags 匹配的资源（推荐） 通过特定的一组 LF-Tags\
  \ 间接管理资源或数据的权限。\n\n命名数据目录资源 管理特定数据库或表的权限，此外还支持精细的数据访问。\n\n### 数据库\n\n选择一个或多个数据库。\n\
  \n选择数据库\n\n加载更多\n\nmy-data-lake-db × 663817732471\n\n### 表 - 可选\n\n选择一个或多个表。\n\n\
  选择表\n\n加载更多\n\nyellowtrips × 663817732471\n\n图 9.8 – 使用 Amazon Lake Formation 配置\
  \ QuickSight 用户\n\n在 Lake Formation 中定义权限允许您定义复杂且精细的权限，而无需编写代码或 IAM 策略。这些数据权限在 AWS\
  \ 控制台中集中管理，这使您可以轻松更改和验证每个用户对特定数据集的访问级别。\n\n现在我们已经学习了如何配置自定义权限，并简要讨论了 Lake Formation\
  \ 集成，在下一节中，我们将学习如何使用文件夹组织 QuickSight 资产，并设置警报和电子邮件报告。\n\n## 管理 QuickSight 使用情况\n\
  \n在本节中，我们将重点介绍管理 QuickSight 资产。我们将学习如何使用文件夹组织 QuickSight 资产，以及如何设置警报和报告。\n\n## 管理文件夹\n\
  \n您可以使用文件夹轻松组织、导航和发现 QuickSight 资产。QuickSight _assets_ 包括以下内容：\n\n+   - 数据集\n+ \
  \  - 分析\n+   - 仪表板\n\n文件夹可以是以下两种之一：\n\n+   - **个人文件夹**：这些文件夹可用于为您自己组织工作。\n+   -\
  \ **共享文件夹**：这些文件夹可用于简化多个团队和 BI 开发人员之间的 QuickSight 资产共享。\n\n> **Note**\n> 只有 QuickSight\
  \ 管理员用户可以创建共享文件夹。共享文件夹的所有权可以转移给属于 Author 用户组的另一位用户。个人文件夹的所有权始终属于创建它的用户。\n\n要创建文件夹，您可以使用\
  \ QuickSight 控制台或 QuickSight API。为了更好地了解如何使用文件夹，我们将使用在 _Chapter 4, Developing Visuals\
  \ and Dashboards_ 中配置的纽约出租车示例数据集、分析和仪表板进行实际操作示例。\n\n## 使用个人文件夹\n\n在本节中，我们将使用个人文件夹，并使用它们将不同的资产分组在一起。在我们的示例中，假设\
  \ Author 用户需要将特定项目的所有资产（数据集、分析和仪表板）组织在一起。这将允许他们在开发不同项目时组织 QuickSight 资产。\n\n要组织这些资产，您可以使用\
  \ QuickSight 文件夹：\n\n+   1. 首先，以 Author 用户身份登录 QuickSight 控制台。\n+   2. 然后，单击 **My\
  \ folders**，并在右上角单击 **+ New**。\n\n3. 为您的文件夹选择一个有意义的项目名称，例如，New York Taxi Project。\n\
  \n4. 接下来，我们将添加相关资产。找到每个资产（数据集、分析和仪表板），单击 **Add to folder**，并选择新创建的文件夹，如下图所示：\n\n\
  ![](img/33bad1d211a2d93fd743a1978d403f9a_205_0.png)\n\n图 9.9 – 将资产添加到文件夹\n\n5. 添加所有相关资产后，返回\
  \ **My folders** 并打开您的 New York Taxi Project 文件夹，如下图所示：\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_205_1.png)\n\
  \n图 9.10 – 将不同资产分组到文件夹中\n\n请注意，现在我们已将与特定项目相关的不同资产分组在一起，这在搜索相关资产时为您节省了时间。当您需要处理大量项目和资产时，使用文件夹管理和组织资产的好处会更大。\n\
  \n现在我们已经学习了如何使用个人文件夹，在下一节中，我们将了解共享文件夹。\n\n### 使用共享文件夹\n\n共享文件夹可用于在用户或组之间共享资产。当有许多\
  \ BI 开发人员参与项目时，共享文件夹尤其有用。您可以为用户创建共享文件夹，以便他们可以以一致的方式轻松找到资产。在将新用户加入您的 QuickSight 环境时，您可以与新用户共享文件夹，您的用户将继承对底层资产的访问权限。\n\
  \n> **Note**\n> 共享文件夹将使底层资产具有与共享文件夹相同的权限。这将允许您将文件夹中的多个仪表板共享给多个用户或组，而无需为每个资产配置特定规则。\n\
  \n要创建共享文件夹，我们将使用以下步骤：\n\n+   1. 以 QuickSight 管理员用户身份登录 QuickSight 控制台（或使用 CLI），选择\
  \ **Shared folders**，然后选择 **+ New**。\n\n+   2. 为您的共享文件夹指定一个有意义的名称，然后选择 **Create**。\n\
  \n+   3. 现在我们将文件夹与我们的 Reader 用户共享。在此步骤之前，为了更好地理解概念，我们将删除该用户对仪表板的访问权限，然后通过共享包含该仪表板的共享文件夹来重新启用访问权限。\n\
  \n+   4. 在 _Chapter 4, Developing Visuals and Dashboards_ 中，我们学习了如何管理 QuickSight\
  \ 仪表板的用户访问权限。要从仪表板中删除用户访问权限，请以 Author 用户身份登录，打开您的 _New York Taxi_ 仪表板，然后选择 **Share**，再选择\
  \ **Manage Access**，然后删除 Reader 用户。\n\n+   5. 要将您的 _New York Taxi_ 仪表板添加到新创建的共享文件夹中，只需选择仪表板并选择\
  \ **Add to folder**，如下图所示。选择您的共享文件夹，然后单击 **Add**：\n\n\n\n\n\n## Dashboards\n\nNew\
  \ York Taxi Dashboard  \nUpdated 2 months ago\n\nFigure 9.11 – 将仪表板添加到共享文件夹\n\n\
  请注意，您的资产将与共享文件夹具有相同的共享权限的消息：\n\n## 添加到共享文件夹？\n\n此项目将具有所选文件夹相同的共享权限。\n\nFigure 9.12\
  \ – 共享权限消息\n\n6. 接下来，我们将文件夹与 Reader 用户共享。要共享文件夹，请选择共享文件夹，然后选择 **Share**（如下图所示），并添加您的\
