- "# 10 Amazon QuickSight 中的多租户\n\n在本章中，我们将学习如何在 **Amazon QuickSight** 中设置多租户。具体来说，我们将探讨多租户架构，并了解\
  \ QuickSight 命名空间如何帮助我们构建多租户环境。\n\n本章将涵盖以下主题：\n\n- - 使用命名空间介绍多租户\n- - 设置多租户\n\n\
  ## 技术要求\n\n本章，您需要访问以下内容：\n\n- - 一个 AWS 帐户和 **AWS Identity and Access Management\
  \ (IAM)** 用户，具有提升的访问权限\n- - 一个配置了管理员用户的 Amazon QuickSight（企业版）帐户\n- - 在 _第 4 章，开发可视化和仪表板_\
  \ 中创建的仪表板\n\n### 使用命名空间介绍多租户\n\n在本节中，我们将介绍 Amazon QuickSight 中多租户的概念。根据我们迄今所学的知识，拥有\
  \ QuickSight 资产的用户可以将资源与帐户中的任何其他注册用户共享。但是，存在单个 QuickSight 帐户需要支持多个 **租户** 的用例。\n\
  \n### 了解多租户\n\nQuickSight 提供允许开发人员构建多租户 **商业智能 (BI)** 平台的功能。由于其云原生架构，QuickSight\
  \ 会根据用户数量自动扩展。此功能结合 QuickSight 的嵌入功能及其可通过编程方式访问的 API 操作，帮助开发人员实现多租户 BI 平台。\n\n多租户平台的一个关键特征是租户之间不相互交互，这有效地防止租户向属于另一个租户的用户授予（或撤销）访问权限。此外，不同租户通常对其用户有不同的权限要求，以及不同的\
  \ _外观和感觉_ 要求。多租户平台可以服务于大型企业，其中租户可以是公司的每个子公司或独立部门。\n\n另一个用例是软件供应商向其客户提供 BI 功能。在此示例中，平台的每个租户都将代表软件供应商的一个客户。每个租户都能够管理自己的\
  \ BI 资产并与自己的用户共享（但不与其他租户共享）。对于此场景，租户通常通过 Web 门户访问 QuickSight。为了分离和组织来自不同租户的用户，QuickSight\
  \ 引入了 _命名空间_ 的概念。\n\n在下一节中，我们将介绍 QuickSight 命名空间。\n\n### 介绍 QuickSight 命名空间\n\n\
  为了解决多租户要求，Amazon QuickSight 引入了命名空间 API。命名空间 API 允许组织构建多租户环境，而无需创建多个 QuickSight\
  \ 帐户。\n\nQuickSight 命名空间是用户和组的逻辑容器，可用于分离不同的部门或组织。同一命名空间内的用户可以相互共享资产，而来自不同命名空间的用户无法相互交互。\n\
  \n命名空间可以是以下之一：\n\n- 默认命名空间\n\n- 自定义命名空间\n\n创建新 QuickSight 帐户时，您的第一个作者和管理员用户将属于 *默认*\
  \ 命名空间。您创建的任何其他命名空间都是 *自定义* 命名空间。\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_219_0.png)\n\
  \n用户不能属于多个命名空间。无法在命名空间之间移动用户。其他 QuickSight 资产，如分析仪表板和数据集，不专属于命名空间。相反，使用 Access API\
  \ 管理对 QuickSight 资产的访问，如我们在第 8 章《了解 QuickSight API》中所学。因此，可以通过编程方式将资产与不同命名空间的用户共享。例如，组织可能需要将共享仪表板与所有命名空间的所有用户共享。\n\
  \n下图描绘了多租户 BI 分析的示例架构：\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_220_0.png)\n\n\
  图 10.1 – 多租户架构\n\n该架构的主要组件如下：\n\n- • **自定义命名空间**：用于组织来自不同租户的用户。\n\n- • **默认命名空间**：用于管理员用户。\n\
  \n- • **Amazon SPICE 和数据集**：特定于 QuickSight 帐户。对这些资源的访问是单独使用 QuickSight API 管理的，如我们在\
  \ _第 3 章，使用 Amazon QuickSight 准备数据_ 和 _第 9 章，管理 QuickSight 权限和用量_ 中所学。\n\n- • **嵌入式门户和身份存储**：允许用户进入\
  \ QuickSight 控制台。对于不需要嵌入式 Web 门户的用例，可以改用 QuickSight Web 应用程序。嵌入式门户可以是任何自定义构建的 Web\
  \ 应用程序。如何构建 Web 应用程序的实现细节超出了本书的范围。\n\n现在我们已了解在 QuickSight 中使用多租户架构的基础知识，在下一节中，我们将查看一个实际操作示例。\n\
  \n\n\n\n\n## 设置多租户\n\n在本章中，我们将使用命名空间 API 设置一个简单的多租户环境。此练习将帮助你了解如何以 QuickSight 管理员用户身份设置多租户环境。它还将帮助你了解你的\
  \ BI 用户在多租户场景下的体验，以及 QuickSight 如何防止用户与其他租户共享资产。\n\n## 创建命名空间\n\n创建命名空间很简单，可以使用\
  \ QuickSight API 完成。在撰写本文时，无法通过 QuickSight **图形用户界面 (GUI)** 创建命名空间：\n\n1. 首先，你需要以\
  \ QuickSight 管理员用户身份登录 Amazon QuickSight。\n2. 接下来，打开 **AWS 命令行界面 (CLI)**，并键入以下命令，将高亮显示的值替换为你环境中的值。对于此练习，我们将创建一个名为\
  \ `companyA` 的自定义命名空间。请注意，我们已经为本书中使用的现有 Admin、Author 和 Reader 用户有一个默认命名空间：\n\n \
  \  ```bash\n   $aws quicksight create-namespace --aws-account-id <account-id> --namespace\
  \ companyA --identity-store QUICKSIGHT\n   ```\n\n   这将导致新命名空间的异步创建。请注意，在 CLI 响应中，状态为\
  \ `CREATING`：\n\n   ```json\n   {\n    \"Status\": 202,\n    \"Name\": \"companyA\"\
  ,\n    \"CapacityRegion\": \"us-east-1\",\n    \"CreationStatus\": \"CREATING\"\
  ,\n    \"IdentityStore\": \"QUICKSIGHT\",\n    \"RequestId\": \"xxxxxx-xxxxx-xxxxxxxxxxxxxx\"\
  \n   }\n   ```\n\n3. 要确认新命名空间已创建，我们将使用 `list-namespaces` CLI 命令。键入以下命令，将高亮显示的值替换为你环境中的值：\n\
  \n   ```bash\n   $aws quicksight list-namespaces --aws-account-id <aws-account-id>\n\
  \   ```\n\n请注意响应。它应该如下所示：\n\n```json\n{\n  \"Status\": 200,\n  \"Namespaces\": [\n\
  \    {\n      \"Name\": \"companyA\",\n      \"Arn\": \"arn:aws:quicksight:us-east-1:<account-id>:namespace/companyA\"\
  ,\n      \"CapacityRegion\": \"us-east-1\",\n      \"CreationStatus\": \"CREATED\"\
  ,\n      \"IdentityStore\": \"QUICKSIGHT\"\n    },\n    {\n      \"Name\": \"default\"\
  ,\n      \"Arn\": \"arn:aws:quicksight:us-east-1:<account-id>:namespace/default\"\
  ,\n      \"CapacityRegion\": \"us-east-1\",\n      \"CreationStatus\": \"CREATED\"\
  ,\n      \"IdentityStore\": \"QUICKSIGHT\"\n    }\n  ],\n  \"RequestId\": \"xxxxxxx-xxx-xxx-xxx-xxx\"\
  \n}\n```\n\n两个命名空间现在都已成功创建。\n\n> **Note**\n> 命名空间跨越 **AWS 区域**，无论用户使用哪个区域，都会被分配到同一个\
  \ QuickSight 命名空间。\n\n现在我们已经创建了新命名空间，在下一节中，我们将把新用户分配到该命名空间。\n\n## 使用 QuickSight\
  \ 命名空间\n\n在本节中，我们将添加用户，然后了解命名空间不允许用户与其他命名空间共享资产。在本节结束时，我们将学习如何在命名空间之间配置共用资产。\n\n\
  ## 添加用户\n\n现在我们有了新命名空间，将使用新命名空间注册新用户。  \n对于此练习，我们将在 QuickSight 中注册一个新 IAM 用户：\n\n\
  1. 首先，使用 **AWS 控制台** 创建一个名为 `author-a` 的新 IAM 用户。选择 IAM，然后从左侧菜单中选择用户。\n\n2. 选择 **添加用户**。在下一屏幕上，选择用户名，然后选中\
  \ **密码 – AWS 管理控制台访问** 复选框，如下图所示：\n\n## 设置用户详细信息\n\n你可以一次添加多个具有相同访问类型和权限的用户。了解更多\n\
  \n![](img/33bad1d211a2d93fd743a1978d403f9a_223_0.png)\n\n## 选择 AWS 访问类型\n\n选择这些用户主要如何访问\
  \ AWS。如果你只选择编程访问，它并 **不会** 防止用户使用假设角色访问控制台。访问密钥和自动生成的密码将在最后一步提供。了解更多\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_223_1.png)\n\
  \n图 10.2 – 创建 IAM 用户\n\n3. 在下一屏幕上，保持权限为空并单击 **创建**。请记下用户 arn 值，我们将在下一步中使用它。\n\n\
  4. 现在我们已经创建了新用户，将在 `companyA` 命名空间下将其注册到 QuickSight。使用 CLI，键入以下命令，将高亮显示的值替换为你环境中的值：\n\
  \n```bash\n$aws quicksight register-user --identity-type IAM \\\n--email <your-email>\
  \ --user-role AUTHOR --iam-arn arn:aws:iam::<aws-account-id>:user/author-a \\\n\
  --aws-account-id <aws-account-id> --namespace companyA\n```\n\n要确认用户创建，我们将使用 `list-users`\
  \ CLI 命令。请注意，我们将 `companyA` 指定为命名空间：\n\n```bash\n$aws quicksight list-users --aws-account-id\
  \ <aws-account-id> --namespace companyA\n```\n\n响应将如下所示：\n\n```json\n{\n  \"Status\"\
  : 200,\n  \"UserList\": [\n    {\n      \"Arn\": \"arn:aws:quicksight:us-east-1:xxxxxxxxxxxx:user/companyA/author-a\"\
  ,\n      \"UserName\": \"author-a\",\n      \"Email\": \"xxx@xxx\",\n      \"Role\"\
  : \"AUTHOR\",\n      \"IdentityType\": \"IAM\",\n      \"Active\": true,\n     \
  \ \"PrincipalId\": \"federated/iam/xxxxx\"\n    }\n  ],\n  \"RequestId\": \"xxxx-xxxx-xxxx-xxxx\"\
  \n}\n```\n\n5. 现在我们已成功创建用户，让我们尝试了解命名空间的影响。打开 AWS 控制台，以新创建的用户身份登录 QuickSight。展开右上角菜单。请注意命名空间名称，如下图所示：\n\
  \n![](img/33bad1d211a2d93fd743a1978d403f9a_224_0.png)\n\n图 10.3 – 登录多租户 QuickSight\
  \ 账户\n\n6. 接下来，我们要确保此用户无法将其仪表板、分析或数据集与其他命名空间的用户共享。检查这一点的最简单方法是快速创建一个新数据集、分析或仪表板，并尝试与其他用户共享。一旦资产创建完成，打开其权限管理器，尝试邀请一个属于不同命名空间的\
  \ Author 或 Reader 用户：\n\n### 管理数据集权限\n\n你可以管理访问此数据集的用户、分析和仪表板的设置和权限。\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_225_0.png)\n\
  \n已与 1 个用户共享\n\n| 名称 | 权限 | 操作 |\n|---|---|---|\n| author-a | Owner | |\n| 关闭 |\
  \ | 邀请用户 |\n\n图 10.4 – 在多租户环境中共享资产\n\n共享资产时，QuickSight 在找到相关用户时会自动补全。你会注意到，当你输入\
  \ `author` 时，QuickSight 没有任何建议，且无法共享数据集。原因是 Author 用户属于与 `author-a` 用户不同的命名空间。\n\
  \n现在我们已经了解命名空间如何防止用户与其他用户共享资产，我们将了解如何在不同命名空间的用户之间配置共用资产。\n\n## 共享共用资产\n\n可能存在需要让不同命名空间的用户可见的资产的用例。例如，一家大型公司可能希望将特定仪表板与属于不同部门（配置为命名空间）的用户共享。要完成此操作，我们需要使用\
  \ QuickSight API。如前一节所学，通过 QuickSight 控制台无法完成此操作，因为一个命名空间的用户无法发现另一个命名空间的用户。\n\n\
  为了更好地理解此概念，我们将使用第 4 章“开发可视化和仪表板”中配置的纽约出租车仪表板。对于本教程，我们将使用 QuickSight 管理员用户和 AWS CLI：\n\
  \n1. 首先，打开安装了 AWS CLI 的终端。\n\n2. 使用 list-dashboard 操作列出仪表板。键入以下命令，将高亮显示的值替换为你环境中的值：\n\
  \n   ```bash\n   $aws quicksight list-dashboards --aws-account-id <aws-account-id>\n\
  \   ```\n\n   关注 DashboardSummaryList 数组，并捕获 DashboardId 值，我们将在下一步中使用它：\n\n   ```json\n\
  \   \"DashboardSummaryList\": [\n       {\n           \"Arn\": \"arn:aws:quicksight:us-east-1:xxxxxxxxxx:dashboard/xxxx-xxxx-xxxx-xxxx-xxxxxx\"\
  ,\n           \"DashboardId\": \"xxxx-xxxx-xxxx-xxxx-xxxx\",\n           \"Name\"\
  : \"New York Taxi Dashboard\",\n           ...\n       }\n   ]\n   ```\n\n3. 要更新仪表板权限，我们将使用\
  \ update-dashboard-permissions CLI 命令。键入以下命令，将高亮显示的值替换为你环境中的值：\n\n   ```bash\n \
  \  $aws quicksight update-dashboard-permissions --aws-account-id <aws-account-id>\
  \ --dashboard-id <dashboard-id> --grant-permissions Actions=quicksight:DescribeDashboard,quicksight:ListDashboardVersions,quicksight:UpdateDashboardPermissions,quicksight:QueryDashboard,quicksight:UpdateDashboard,quicksight:DeleteDashboard,quicksight:DescribeDashboardPermissions,quicksight:UpdateDashboardPublishedVersion,\
  \ Principal=arn:aws:quicksight:us-east-1:<aws-account-id>:user/companyA/author-a\n\
  \   ```\n\n现在我们已为 author-a 用户提供了访问权限，我们将登录 QuickSight 控制台并查看可用仪表板。\n\n4. 以 author-a\
  \ 用户身份登录 QuickSight 控制台。然后，导航到仪表板以查看可用仪表板。纽约出租车仪表板现在应可供你查看，如下图所示：\n\n\n\n\n\nFigure\
  \ 10-5 – 在多租户环境中查看公共资产\n\n与仪表板类似，其他资产（如数据集或分析）可以使用 QuickSight API 共享。\n\n## 摘要\n\
  \n恭喜你完成本章，这是本书的最后一章。\n\n在本章中，我们了解了 Amazon QuickSight 中的多租户概念。我们还详细探讨了一种示例架构，该架构允许多个租户通过\
  \ Web 门户访问 QuickSight 中的嵌入式资产。随后，我们重点介绍了 QuickSight 命名空间，并学习了如何配置它们。最后，我们通过两个动手示例了解命名空间如何防止用户共享资产，以及管理员用户如何为不同命名空间中的用户配置公共资产。\n\
  \n现在，你应该理解 Amazon QuickSight 中多租户的基本概念，并知道如何使用 AWS CLI 创建命名空间并组织不同的租户。\n\n在关闭本书之前，请确保为此书及其练习创建的所有\
  \ AWS 资源都已关闭，以防止向你的 AWS 账户产生费用。\n\n感谢你花时间阅读，希望本书符合你的期望。如有任何意见和进一步的问题，可以在 LinkedIn\
  \ 上找到我。欢迎与我联系，我很乐意听取你的想法和反馈。祝学习愉快！\n\n## 问题\n\n- 1. 多租户平台的主要特征是什么？\n- 2. 创建多租户 BI\
