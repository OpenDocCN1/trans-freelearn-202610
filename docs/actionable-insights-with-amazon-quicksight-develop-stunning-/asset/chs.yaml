  - Gauge visual\n\n要配置基于阈值的警报，请完成以下步骤：\n\n1. 首先，以 Author 或 Reader 用户身份登录 QuickSight\
  \ 控制台，并打开 New York Taxi 仪表板。\n\n> **Note**  \n> 基于阈值的警报只能在 QuickSight 仪表板上配置，而不能在\
  \ QuickSight 分析上配置。\n\n2. 接下来，找到显示乘客总数与假设目标对比的仪表可视化，然后单击该可视化。注意右侧的警报（铃铛）图标：\n\n\
