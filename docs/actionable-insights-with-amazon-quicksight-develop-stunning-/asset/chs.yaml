  \ QuickSight 警报\n\nQuickSight 允许您在数据发生某些更改时设置基于阈值的警报。使用基于阈值的警报，当特定指标高于或低于某个阈值时，您可以接收通知。例如，当\
  \ **关键绩效指标 (KPI)** 低于目标时，您会收到通知，以便采取措施使 KPI 重新回到目标。\n\n> **Note**  \n> 您可以针对特定 KPI\
  \ 的不同条件设置多个警报。为同一指标创建不同类型的警报，可以让您实现复杂的 KPI 监控警报系统。\n\n在下一节中，我们将学习如何添加基于阈值的警报。\n\n\
