- "# # 7 了解嵌入式分析\n\n在本章中，我们将了解 Amazon QuickSight 的嵌入式功能。我们将讨论嵌入式分析的业务驱动因素，并深入了解其架构。最后，在本章中，我们将提供动手示例，帮助您了解如何设置嵌入式分析。\n\
  \n在本章中，我们将涵盖以下主题：\n\n+   • QuickSight 嵌入式分析简介\n+   • 架构和用户身份验证\n+   • 生成嵌入式仪表板 URL\n\
  \n## ## 技术要求\n\n本章，您需要以下内容：\n\n+   - 具有管理员权限的 AWS 账户\n\n+   - 配置了 Author 和 Reader\
  \ 用户的 QuickSight 账户\n\n+   - 在 _第 4 章，开发可视化和仪表板_ 中创建的仪表板\n\n## ## QuickSight 嵌入式分析简介\n\
  \n到目前为止，在本书中，我们学习了如何在原生 QuickSight Web 应用程序中创建仪表板并处理分析。对于许多用例，这已经足够。另一方面，有些组织需要将数据可视化添加到现有\
  \ Web 门户中，而不在原生 QuickSight 应用程序内。\n\n## ## 了解嵌入式的业务驱动因素\n\n在嵌入式之前，组织需要开发自己的自定义 **Business\
  \ Intelligence (BI) 解决方案**。D3.js (https://d3js.org) 是一个用于 Web 数据可视化的开源 JavaScript\
  \ 库。D3.js 需要高水平的专业知识。这种人才很难找到，使得许多组织很难采用这项技术。虽然网上有很多关于如何构建 D3.js 可视化效果的示例 (https://observablehq.com/@d3/gallery)，但\
  \ JavaScript 对 BI 开发人员来说可能是一门难以学习的语言。同时，Web 开发人员可能对组织的数据缺乏深入了解，这使得他们难以为试图解决的问题选择合适的可视化效果，以及从数据中获得洞察。除此之外，在构建嵌入式\
  \ BI 解决方案时，组织还需要考虑其他方面，例如以下几点：**\n\n+   - 我们如何从数据存储中获取数据？\n\n+   - 我们需要多久获取一次新数据？\n\
  \n+   - 有多少用户将访问该应用程序？\n\nQuickSight 可以通过仪表板嵌入直接解决这些挑战。您无需开发自定义可视化组件，而是可以使用 QuickSight\
  \ API 请求数据可视化，并将其嵌入到 HTML 代码中。QuickSight 是一项完全托管的 AWS 服务，并会根据用户数量自动扩展，使组织和 BI 开发人员能够将精力集中在构建仪表板上，而不是扩展其\
  \ BI 解决方案。出于这些原因，当组织需要利用 AWS 云的规模来为其嵌入到 Web 应用程序中的 BI 解决方案时，嵌入式仪表板可以是一种高效且易于使用的解决方案。接下来，我们将区分\
  \ QuickSight 支持的两种嵌入式分析类型。\n\n### ###### 了解嵌入式分析类型\n\nAmazon QuickSight 支持两种不同的嵌入式功能：\n\
  \n+   • 只读仪表板嵌入\n\n+   • QuickSight 控制台嵌入\n\n### ###### 了解只读仪表板嵌入\n\n您可以将只读仪表板嵌入到\
  \ Web 应用程序中。这种嵌入式可用于向自定义门户应用程序添加只读可视化效果，并将其暴露给内部或外部用户。访问嵌入式仪表板的用户的体验与通过 Web 应用程序访问\
  \ QuickSight 仪表板的体验类似，如第 3 章《使用 Amazon QuickSight 准备数据》中所示。虽然用户可以查看可视化效果，以及钻取或选择特定的数据点或类别，但他们无法访问创作界面和数据集创建过程。在这种模式下，可视化创建、数据集设置以及作者用户可以完成的所有其他操作，只能使用\
  \ QuickSight Web 应用程序完成。对于只读仪表板嵌入，您的用户可以进行身份验证，或者您可以启用匿名访问，以允许未经过身份验证的用户查看仪表板。后者是一个不错的选择，当您不需要用户进行身份验证即可访问仪表板时，例如当您需要将仪表板嵌入到面向公众的网站时。\n\
  \n> 注意\n> 要启用匿名访问，您的 QuickSight 管理员需要启用会话容量规划。使用会话容量规划，您可以根据仪表板预期的流量购买多个会话。每个会话是一个\
  \ 30 分钟的使用块。\n\n\n\n\n\n嵌入式仪表板的形式是带有授权代码的 URL。要获取嵌入式仪表板 URL，您需要调用 GetDashboardEmbedUrl\
  \ API 调用。该 API 调用返回一个带有授权代码的会话 URL，可用于将仪表板嵌入到您的网站中。GetDashboardEmbedUrl API 调用需要由\
  \ Web 应用程序服务器发起，而不是从用户的浏览器发起。要将嵌入式仪表板 URL 添加到您的网站，您可以使用 QuickSight Embedding SDK\
  \ 中的 embeddedDashboard(options) 方法。这样您可以轻松设置参数值，以便仪表板以特定的初始参数启动。其他选项包括嵌入式框架格式、允许/不允许打印、滚动行为和起始工作表。有关更多信息，您可以阅读\
  \ QuickSight Embedding SDK 文档：https://github.com/aws labs/amazon-QuickSight-embedding-sdk。\n\
  \n### 了解 QuickSight 控制台嵌入\n\n您可以将完整的 QuickSight 控制台应用程序嵌入到您的 Web 应用程序中。嵌入式控制台功能仅适用于经过身份验证的\
  \ QuickSight 用户。如预期，匿名访问不适用于此类嵌入。与 QuickSight Web 应用程序类似，只有经过身份验证的用户才能访问 QuickSight\
  \ 控制台。控制台嵌入将为您的用户提供完整的 QuickSight 体验。您将能够让读取者和作者用户都使用它。作者将能够配置数据集、执行分析和共享仪表板，而您的读取者将能够访问只读仪表板。控制台会话的形式是带有授权代码的\
  \ URL。要获取控制台嵌入 URL，您需要使用 QuickSight GetSessionEmbedUrl API 操作。一旦您有了 URL，您可以使用 QuickSight\
  \ Embedding SDK 中的 embedSession(options) 将 QuickSight 控制台嵌入到您的 Web 应用程序中。有关更多信息，请访问\
  \ https://github.com/aws labs/amazon-QuickSight-embedding-sdk。\n\n现在我们已经讨论了两种嵌入式分析类型，在下一节中，我们将讨论嵌入式分析架构。\n\
  \n### 探索架构和用户身份验证\n\n在本节中，我们将重点介绍嵌入式分析的架构组件。要了解这种端到端架构，我们将其分解为三个层：\n\n- Web 应用程序层\n\
  - BI 和数据层\n- 身份验证和授权层\n\n这可以通过以下图表更好地表示：\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_153_0.png)\n\
  \n图 7.1 – 嵌入式分析的通用架构\n\n通常，客户端通常使用 Web 浏览器访问 Web 应用程序或 Web 门户。在许多情况下，用户需要向 Web 应用程序进行身份验证。客户端将用户凭据（通常是用户名和密码）提交给\
  \ **身份验证层**，后者会返回访问代码/令牌，以便客户端可以与 **Web 应用程序层** 进行通信。在嵌入式分析中，Web 应用程序层将负责从 **BI\
  \ 层** 获取嵌入式可视化内容，而 BI 层则负责从数据源查询数据并对其进行可视化（**数据层**）。\n\n在下一节中，我们将分析这些架构组件中的每一个，并确定可用于构建它们的\
  \ AWS 服务。\n\n### Web 应用程序层概述\n\n在嵌入式仪表板应用程序中，嵌入式仪表板嵌入在此层中。Web 应用程序层与身份验证层和仪表板层进行交互。Web\
  \ 应用程序通常由用户的 Web 浏览器访问。Web 应用程序层负责将应用程序的内容发送回浏览器用户。确保 Web 应用程序层有足够的资源来支持您的用户是您的责任，您需要确保\
  \ Web 服务器有足够的容量来接受传入连接。出于这个原因，您可以考虑 AWS 无服务器服务，例如 **Amazon Lambda**、**Amazon S3**（用于静态内容）和\
  \ **Amazon API Gateway**，以构建一个能够根据传入需求自动扩展的无服务器 Web 应用程序。其他选项包括其他计算和容器服务，例如 **Amazon\
  \ EKS**、**ECS**、**Fargate** 和 **EC2**。您还可以将此层托管在 AWS 之外，这意味着您不需要将应用程序移至 AWS 云即可使用\
  \ QuickSight 的嵌入式分析。为了使嵌入式分析正常工作，您需要在 QuickSight 的设置中将 Web 应用程序的域加入白名单。\n\n要在 Amazon\
  \ QuickSight 中加入域白名单，请执行以下步骤：\n\n1. 以管理员用户身份登录，并从右上角的下拉菜单中选择 **Manage QuickSight**。\n\
  \n2. 接下来，选择 **Domains and Embedding** 以转到以下屏幕截图中显示的菜单：\n\nEdition: Enterprise\n\n\
  ![](img/33bad1d211a2d93fd743a1978d403f9a_154_0.png)\n\n图 7.2 – 域和嵌入设置\n\n3. 输入您的\
  \ Web 应用程序的域并单击 **Add**。请注意，如果需要，您可以选择包含子域，只需勾选 **Include subdomains** 复选框即可。\n\n\
  现在我们已经讨论了 Web 应用程序层，将继续介绍 BI 层。\n\n### BI 层概述\n\n仪表板层是向 Web 应用程序层提供嵌入式仪表板的组件。Amazon\
  \ QuickSight 是此层的核心组件。此层也可以嵌入，使用完整的控制台嵌入。BI 层负责以下内容：\n\n- 与数据源集成\n- 强制执行对仪表板的访问\n\
  - 提供嵌入式仪表板 URL\n\n关于可扩展性，QuickSight 将根据您配置的用户数量自动扩展。如果您有匿名嵌入，则需要启用会话容量规划。此层与数据存储进行交互，消除了将访问数据存储的代码嵌入到应用程序中的需求，从而简化了与数据源的集成。要使用数据集，您必须使用我们在第\
  \ 3 章《使用 Amazon QuickSight 准备数据》中了解的 QuickSight 功能，而不是开发自定义代码。可视化和洞察是使用 QuickSight\
  \ 的原生功能开发的。最后，在此层中，我们配置哪些用户可以访问哪些仪表板。获授权的用户会获得带有授权代码的仪表板 URL，而没有访问权限的用户将不会获得仪表板\
  \ URL。接下来，我们将讨论 QuickSight 中嵌入式分析解决方案的身份验证层。\n\n### 了解身份验证层\n\n在使用 QuickSight 构建嵌入式\
  \ BI 应用程序时，用户授权和身份验证是重要的考虑因素。需要解决的关键问题如下：\n\n- 如何对用户进行身份验证？（身份验证）\n- 哪些用户可以访问哪些仪表板？（授权）\n\
  \n在嵌入式分析中，用户通常使用存储在 Amazon QuickSight 之外的身份存储中的凭据进行身份验证。您可以使用 **Amazon Cognito**\
  \ 用户池作为云原生嵌入式分析架构的身份存储。您可以使用 IAM 配置身份提供程序，以便为经过身份验证的实体担任 IAM 角色。\n\n要使用 IAM 配置身份提供程序，请执行以下步骤：\n\
  \n1. 以 AWS 管理员身份登录并打开 IAM 控制台。\n2. 单击 **Identity providers** 选项，如下所示：\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_156_0.png)\n\
  \n图 7.3 – 配置身份提供程序\n\n3. 选择身份提供程序的类型（SAML 或 OIDC），并为您的身份提供程序提供所需的元数据。\n\n设置身份提供程序后，您可以为\
  \ IAM 角色配置信任关系。您的 Web 应用程序需要能够担任具有访问所需 QuickSight API 权限的 IAM 角色，以便它可以检索嵌入 URL。\n\
  \n以下是允许调用者对所有资源调用 `GetDashboardEmbedUrl` 和 `GetAuthCode` 函数的示例策略：\n\n```\n{\n \"\
  Version\": \"2012-10-17\",\n \"Statement\": [\n```\n\n\n\n\n\nPolicies can be assigned\
  \ to IAM roles, which can be assumed by applications before they call AWS services.\
  \ A policy will determine the level of access to AWS. The next important step is\
  \ to establish a trust relationship between the IAM identity provider and the role\
  \ so that authenticated entities can assume the role and generate the embedding\
  \ dashboard URL. When you create an IAM role, you will need to select the type of\
  \ trusted entity. The choice is between an AWS service, such as a role that can\
  \ be assumed by a service, for example, AWS Lambda, another AWS account, a web identity\
  \ such as Amazon Cognito or other OpenID identity providers, or SAML 2.0 Federation\
  \ for corporate users. You will see the following when selecting the type of your\
  \ entity when creating a role:\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_157_0.png)\n\
  \nOnce you create the role, you can attach a policy with the required permissions\
  \ to call the QuickSight APIs for the dashboard embedding. To get the temporary\
  \ credentials, your web application layer will need to call the **Amazon STS** service’s\
  \ `AssumeRole` API or `AssumeRoleWithSAML` or `AssumeRoleWithWebIdentity`, depending\
  \ on the identity provider. Once you have the required credentials, then your web\
  \ application will be able to call the QuickSight APIs to retrieve the embed URL,\
  \ which is then added to your web frontend.\n\n### 把所有内容整合在一起\n\nNow that we have\
  \ looked at the main architectural components of the architecture, we will enrich\
  \ _Figure 7.1_ by adding more specific components (including the relevant AWS services)\
  \ to each of its layers.\n\nFor the authentication layer, we can use the following\
  \ AWS services:\n\n- **IAM** to define your required roles\n- A **Cognito** User\
  \ Pool or another compliant IDP as the identity provider\n\nFor the web application\
  \ layer, we can use the following services:\n\n- AWS **Lambda**, **S3**, and **API\
  \ Gateway**. There are several examples online of how to use these services to build\
  \ a serverless web application using these services.\n- Other options include hosting\
  \ our web app using **container** services or using Amazon **EC2** instances. You\
  \ are not limited to hosting your web application on AWS; you can host your web\
  \ application anywhere, including on-premises if you need to.\n\nFor the BI layer,\
  \ we can use the following service:\n\n- **Amazon QuickSight**, including its SPICE\
  \ storage\n\nFor the data layer, we can use the following services:\n\n- **Amazon\
  \ S3** as the central data lake storage.\n- **Amazon Athena**, which allows you\
  \ to perform SQL queries over data stored in S3 or other data stores (using Federated\
  \ Query: `https://docs.aws.amazon.com/athena/latest/ug/connect-to-a-data-source.html`).\n\
  - **Amazon Redshift** as a data warehouse. **Snowflake**, another popular cloud\
  \ data warehouse, is also natively supported.\n- Other databases that are hosted\
  \ inside or outside AWS.\n\nAfter adding these components, our architecture diagram\
  \ will look as follows:\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_159_0.png)\n\
  \nFigure 7.5 – Dashboard embedding with AWS services\n\nThe flow for dashboard embedding\
  \ would be as follows:\n\n1. The user uses their web browser to open the web portal\
  \ application.\n2. The user authenticates with the identity provider and accesses\
  \ the resource provider via the web application.\n3. The web application assumes\
  \ the embedding IAM role.\n4. Using the IAM role, the web server calls QuickSight\
  \ APIs to get the embed URL and display it to the user.\n5. To populate the visuals,\
  \ QuickSight will fetch the data from the various data sources, abstracting this\
  \ from the user and the web application.\n\nNow that we have explored the main components\
  \ of the embedded analytics architecture and the flow between components, in the\
  \ next section, we will use a few simple commands to generate an embedded dashboard\
  \ URL.\n\n### 生成嵌入式仪表板 URL\n\nIn this section, we will use the QuickSight CLI to\
  \ generate an embedded dashboard URL that, for this example, we will display on\
  \ a web browser. Setting up authentication and the web server is outside the scope\
  \ of this book. In _Chapter 2, Introduction to Amazon QuickSight_, we created a\
  \ reader user in our QuickSight account. First, let’s verify the details of this\
  \ user and get their unique resource number:\n\n1. Log in to the AWS console as\
  \ a QuickSight or AWS admin and open **AWS CloudShell**.\n2. To view the details\
  \ of the `reader` user, use the `describe-user` CLI command:\n\n```bash\n$aws quicksight\
  \ describe-user --user-name reader\n--aws-account-id <aws account id> --namespace\
  \ default\n--region us-east-1\n```\n\nVerify that the user has been found. The response\
  \ should look similar to the following:\n\n```json\n{\n \"Status\": 200,\n \"User\"\
  : {\n \"Arn\": \"arn:aws:quicksight:us-east-1:<aws account id>:user/default/reader\"\
  ,\n \"UserName\": \"reader\",\n \"Email\": \"your-email@something.com\",\n \"Role\"\
  : \"READER\",\n \"IdentityType\": \"QUICKSIGHT\",\n \"Active\": true,\n \"PrincipalId\"\
  : \"\"\n },\n \"RequestId\": \"818a21fc-4146-3bf6-b5c3-a1b315cb874b\"\n}\n```\n\n\
  Note the `User Arn` property as we will use it later in _Step 4_.\n\n3. Next, we\
  \ will need to retrieve our dashboard ID. We will use the `list-dashboards` CLI\
  \ command to do. Type in the following command. Replace `<aws account id>` with\
  \ the 12-digit long ID from your AWS account. Ensure your dashboard is shared with\
  \ the admin user so that the following command returns the expected results:\n\n\
  ```bash\n$aws quicksight list-dashboards --aws-account-id <aws account id> --region\
  \ us-east-1\n```\n\nSo far, we have only created one dashboard, so the response\
  \ should look as follows:\n\n```json\n{\n    \"DashboardSummaryList\": [\n     \
  \   {\n            \"Arn\": \"arn:aws:QuickSight:us-east-1:<aws account id>:dashboard/<dashboard\
  \ id>\",\n            \"DashboardId\": \"<dashboard id>\",\n            \"Name\"\
  : \"New York Taxi Dashboard\",\n            \"CreatedTime\": \"2021-06-02T19:19:00.285000+00:00\"\
  ,\n            \"LastUpdatedTime\": \"2021-07-06T22:55:04.960000+00:00\",\n    \
  \        \"PublishedVersionNumber\": 14,\n            \"LastPublishedTime\": \"\
  2021-06-02T19:19:00.285000+00:00\"\n        }\n    ],\n    \"Status\": 200,\n  \
  \  \"RequestId\": \"\"\n}\n```\n\nNote the dashboard ID as we will use it in the\
  \ next step.\n\n4. Next, we will use the `get-dashboard-embed-url` CLI command to\
  \ generate the embedding URL. Type the following command. Replace the AWS account\
  \ ID with your 12-digit long account ID, along with the dashboard ID we captured\
  \ in _Step 3_, and the `user arn` property that we captured in _Step 1_:\n\n```bash\n\
  %aws quicksight get-dashboard-embed-url --aws-account-id <aws account id> --dashboard-id\
  \ <dashboard id> --identity-type QUICKSIGHT --user-arn <user arn> --region us-east-1\n\
  ```\n\nThis command will return the following output:\n\n```json\n{\n  \"Status\"\
  : 200,\n  \"EmbedUrl\": \"https://us-east-1.quicksight.aws.amazon.com/embed/xxxxxxxxxx/dashboards/xxxxx-xxxx-xxxx-xxxx-xxxxxxxxxx?code=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx&identityprovider=QuickSight&isauthcode=true\"\
  ,\n  \"RequestId\": \"xxxxxx-xxxx-xxxxxx-xxxxxx-xxxxxx\"\n}\n```\n\nNote the EmbedUrl\
  \ value. For this example, just open a browser and paste the embed URL to view the\
  \ dashboard. This will look as follows:\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_162_0.png)\n\
  \nFigure 7.6 – Opening the embed URL on a web browser\n\nIn real-world examples,\
  \ the embed URL will be generated by your application server, and the embed URL\
  \ will be embedded within your web server. The domain of your web server will need\
  \ to be whitelisted.\n\n### 摘要\n\nCongratulations on completing this chapter. In\
  \ this chapter, we learned about the embedding capabilities of Amazon QuickSight\
  \ and talked about the different types of embedded analytics. We started by focusing\
  \ on its main drivers and business benefits. We learned about the main architectural\
  \ components of dashboard embedding, and then we identified key AWS services that\
  \ can be used to build these architectural layers. We discussed the end-to-end flow\
  \ of embedded analytics. Finally, we used simple CLI commands to generate a read-only\
  \ dashboard URL so that we could see the APIs in action.\n\nIn the next chapter,\
  \ we will focus on managing QuickSight and learn how to automate operations using\
  \ the QuickSight API.\n\n### 问答\n\nAnswer the following questions to test your knowledge\
  \ of this chapter:\n\n1. What are the main drivers for dashboard embedding?\n2.\
  \ What are the different types of embedded analytics with Amazon QuickSight?\n3.\
  \ What is the role of the STS service in the embedded analytics flow?\n4. What is\
  \ session capacity planning and what type of embedded analytics is relevant to it?\n\
  5. What are the different layers in the embedded analytics architecture?\n\n###\
  \ 延伸阅读\n\nFor more information on the topics that were covered in this chapter,\
  \ take a look at the following resources:\n\n- • QuickSight User Guide – AWS: https://docs.aws.amazon.com/\
  \ QuickSight/latest/user/amazon-QuickSight-user.pdf\n- • Working with Embedded Analytics\
  \ – AWS: https://docs.aws.amazon.com/ QuickSight/latest/user/embedded-analytics.html\n\
  - • Build Your First Serverless Web Application – AWS: https://aws.amazon.com/ serverless/build-a-web-app/\n\
  \n\n\n\n"
- '# 第 3 部分：高级主题与管理


  本章将重点介绍如何使用 Amazon QuickSight API 和其他 AWS 服务（例如 Amazon CloudTrail）来管理和监控 Amazon
  QuickSight。我们还将探讨带有命名空间的多租户模式。


  本部分包含以下章节：


  - 第 8 章，了解 QuickSight API

  - 第 9 章，管理 QuickSight 权限与使用情况

  - 第 10 章，Amazon QuickSight 中的多租户模式

  '
- "# 第 8 章 了解 QuickSight API\n\n在本章中，我们将学习如何使用 **Amazon QuickSight** API 执行操作。我们还将探索自动化数据集操作的模式，并演示一些允许我们控制账户设置的\
  \ API 操作。完成本章后，您将熟悉 QuickSight API 以及如何以编程方式控制其资源，这在构建自动化时至关重要。\n\n本章将涵盖以下主题：\n\n\
  - QuickSight API 简介\n- 使用 API 控制资源\n\n### 技术要求\n\n本章，您需要访问以下内容：\n\n- 一个 **AWS 账户**\
  \ 和一个 **AWS Identity and Access Management (IAM)** 用户，并拥有提升的访问权限\n- Python 3\n-\
  \ 已配置 Author 和 Reader 用户的 Amazon QuickSight 账户\n- 第 1 章，AWS 分析生态系统简介中创建的环境\n- 第\
  \ 3 章，使用 Amazon QuickSight 准备数据中创建的仪表板\n\n### QuickSight API 简介\n\n在本节中，我们将介绍 Amazon\
  \ QuickSight API。**应用程序编程接口 (API)** 是一组定义的函数，允许应用程序开发人员访问某个应用程序或库的功能。AWS API 允许开发人员以编程方式访问\
  \ AWS 服务。传统上，AWS 提供基础设施服务，允许开发人员在云中以编程方式配置虚拟机。现在，AWS 提供更多服务，其中许多不是基础设施服务。Amazon\
  \ QuickSight 就是这样一项服务的绝佳示例。QuickSight 是一项运行在 AWS 基础设施上的云端 **商业智能 (BI)** 服务，但开发人员不需要配置基础设施。相反，开发人员可以使用\
  \ QuickSight API 访问应用程序中的功能并执行操作，例如创建数据集、执行数据分析或共享仪表板。到目前为止，在本书中，我们学习了如何使用通过 Web\
  \ 浏览器访问的 **图形用户界面 (GUI)** 在 QuickSight 控制台中完成这些操作。在本章中，我们将学习如何以编程方式完成这些操作，这将使我们在创建\
  \ BI 应用程序时能够构建自动化。首先，我们将学习如何访问 QuickSight API。\n\n### 访问 QuickSight API\n\n在本节中，我们将学习可以用来访问\
  \ QuickSight API 的方法。访问 AWS API 有两种主要方式：\n\n- 使用 **软件开发工具包 (SDK)**\n- 使用 **命令行界面\
  \ (CLI)**\n\n接下来，我们将通过实际示例更详细地查看这些选项。\n\n### 使用 AWS CLI 访问 QuickSight API\n\nAWS\
  \ 提供了一个简单的 CLI，允许开发人员访问 AWS API。在使用 CLI 之前，您需要安装它。按照 AWS 说明为您的操作系统安装 CLI：\n\nhttps://docs.aws.amazon.com/cli/latest/userguide/cli-chap-install.html\n\
  \n### 验证安装\n\n安装完成后，打开终端并运行以下命令以检查已安装的 CLI 版本：\n\n```\n$aws --version\naws-cli/2.1.13\
  \ Python/3.7.4 Darwin/20.5.0 exe/x86_64 prompt/off\n```\n\n### 配置 AWS CLI\n\n现在我们已安装\
  \ CLI，需要对其进行配置。首先，我们需要创建一组将由 CLI 使用的凭据：\n\n1. 使用您的用户凭据登录 AWS 控制台。\n2. 打开 **Services**\
  \ 并选择 **Identity and Access Manager**。\n3. 在 **Access Management** 下，选择 **Users**，然后单击需要生成安全凭据的\
  \ IAM 用户名。\n4. 在下一页，选择 **Security credentials** 选项卡。\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_169_0.png)\n\
  \n图 8.1 – 创建访问密钥\n\n5. 在 Access keys 部分下，选择 Create access key。\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_170_0.png)\n\
  \n![](img/33bad1d211a2d93fd743a1978d403f9a_170_1.png)\n\n### 图 8.2 – 检索访问密钥\n\n\
  6. 记下 Access key ID 和 Secret access key 字段中的值。\n\n7. 接下来，打开终端，运行以下命令，并在提示时添加您的访问密钥\
  \ ID 和秘密访问键。按 Return 键保持其他所有内容不变。\n\n```\n$aws configure\n```\n\n### 使用 CLI 访问 QuickSight\
  \ API\n\n现在我们已配置 CLI，可以运行一些命令：\n\n1. 要获取所有 QuickSight CLI 命令的列表，请键入以下内容：\n\n```\n\
  $aws quicksight help\n```\n\n2. 要列出我们的仪表板，请键入以下命令：\n\n```\n$ aws quicksight list-dashboards\
  \ --aws-account-id <numerical account id> --region us-east-1\n{\n \"Status\": 200,\n\
  \ \"DashboardSummaryList\": [\n {\n \"Arn\": \"arn.aws:quicksight:us-east-1:xxxxxxx:dashboard/xxxxxxxx\"\
  ,\n \"DashboardId\": \"xxxxxxxx\",\n \"Name\": \"New York Taxi Dashboard\",\n \"\
  CreatedTime\": \"2021-06-02T20:19:00.285000+01:00\",\n \"LastUpdatedTime\": \"2021-07-06T23:55:04.960000+01:00\"\
  ,\n \"PublishedVersionNumber\": 14,\n \"LastPublishedTime\": \"2021-06-02T20:19:00.285000+01:00\"\
  \n }\n ],\n \"RequestId\": \"xxxxxxx\"\n}\n```\n\n注意 CLI 命令的结构：\n\n- aws：用于访问所有\
  \ CLI 命令。\n- quicksight：用于访问 QuickSight CLI 命令。\n- list-dashboards：用于访问返回账户和区域中所有仪表板的\
  \ API。\n- 选项 (--)：使用此符号为命令添加选项。\n\n现在我们已配置 CLI 并运行了一个简单的命令，请随时在继续下一节之前尝试其他命令。参考\
  \ AWS 文档以查看所选 CLI 命令的可用和必需选项：\nhttps://awscli.amazonaws.com/v2/documentation/api/latest/reference/quicksight/index.html\n\
  \n接下来，我们将使用 AWS SDK 访问 QuickSight API。\n\n### 使用 SDK 访问 QuickSight API\n\nAWS 提供支持多种编程语言的各种开发工具包。这意味着开发人员可以将其应用程序与\
  \ AWS 服务集成，而无需更改其编程语言。AWS 支持大多数常见编程语言，包括 **Python**、**Java**、**C++**、**Go**、**JavaScript**\
  \ 和 **Ruby**。有关最新语言支持的更多信息，请参阅 `https://aws.amazon.com/tools/` 中的 AWS 文档。为了更好地理解\
  \ AWS SDK，我们将使用一个简单的实际示例。在此示例中，我们将使用 Python SDK 以编程方式检索 QuickSight 仪表板并在屏幕上打印它们的名称。\n\
  \n### 安装 AWS SDK\n\n在此示例中，我们将使用 Python AWS SDK。如果您尚未安装 Python，则需要在环境中安装 Python。\n\
  \n如果您已安装 Python，请在终端中键入以下命令：\n\n```\n$pip install boto3\n```\n\n接下来，打开您首选的代码编辑器，并输入即将出现的\
  \ Python 代码。\n\n> **Note**\n> AWS 提供一个名为 **Cloud9** 的云端 **集成开发环境 (IDE)**。\n\n要创建\
  \ Cloud9 环境，请登录 AWS 控制台并从服务列表中选择 **Cloud9**。对于本教程，您可以保留所有默认设置。有关设置 Cloud9 的更多信息，请参阅\
  \ AWS 文档：\n\nhttps://docs.aws.amazon.com/cloud9/latest/user-guide/create-environment.html\n\
  \n在运行以下代码之前，请将 `AwsAccountId` 值替换为您环境中的数字账户 ID：\n\n```\nimport boto3\nclient = boto3.client('quicksight',\
  \ region_name='us-east-1')\nresponse = client.list_dashboards(AwsAccountId='xxxxxxxx')\n\
  dashboards_list = response['DashboardSummaryList']\nprint('Number of dashboards:\
  \ ' + str(len(dashboards_list)) + '\\n')\nfor dashboard in dashboards_list:\n  \
  \  print(dashboard['Name'])\n```\n\n保存 Python 脚本并运行它。它应该打印该区域的仪表板总数，然后是每个仪表板的名称。\n\
  \n\n\n\n\n### 使用 QuickSight API 控制资源\n\n在本节中，我们将学习如何使用 QuickSight API 控制 QuickSight\
  \ 资源。本节并非旨在成为 QuickSight API 的完整参考指南，也不会涵盖使用 API 可以完成的每一种可能操作。有关 QuickSight API\
  \ 的完整参考指南，请参阅 QuickSight 文档：\nhttps://docs.aws.amazon.com/quicksight/latest/APIReference/Welcome.html\n\
  \n本节将为您提供使用 API 控制 QuickSight 资源的实际操作示例。这些示例将使您对可以使用 API 完成的活动类型有扎实的了解，进而帮助您管理 QuickSight\
  \ 环境。\n我们的第一个示例将是学习如何使用 QuickSight API 设置数据源。\n\n### 使用 CLI 设置数据集\n\n在第 2 章“Amazon\
  \ QuickSight 简介”中，我们学习了如何创建数据源和数据集。要创建这些资源，我们通过网络浏览器访问了 QuickSight GUI。虽然 GUI 很用户友好，但我们可以使用\
  \ API 以编程方式创建数据集。当我们需要确保特定配置的一致性时，这可能是一个不错的选择，因为手动配置容易出错。让我们从第 1 章“AWS 分析生态系统简介”中创建的数据仓库创建一个数据源。\n\
  \n> Note\n> 第 1 章“AWS 分析生态系统简介”中的教程包括创建一个示例 Amazon Redshift 集群，这将产生费用。对于本教程，您不需要集群正在运行。暂停的集群对于此示例来说效果很好，因为我们只需要配置数据集，并且不需要与其建立实时连接。\n\
  \n现在，让我们使用 CLI 创建一个 Redshift 数据源。我们将使用 create-data-source CLI 命令来创建 Redshift 数据源：\n\
  https://docs.aws.amazon.com/cli/latest/reference/quicksight/create-data-source.html\n\
  \n以下是我们需要配置的几个参数：\n\n- AwsAccountId：此值表示您的 AWS 数字账户 ID。\n- DataSourceId 和 Name：您需要定义一个唯一的账户和区域标识符以及一个用户友好的名称来描述您的数据源。\n\
  - Type：这是数据源的类型。对于 Redshift 数据源，这需要设置为 REDSHIFT。\n- DataSourceParameters：数据源参数的类型将取决于您配置的数据源类型。对于\
  \ Redshift 数据源，您需要定义主机名、端口号、Redshift 数据库名称和集群标识符。\n- Credentials：这些是 QuickSight\
  \ 访问数据存储所需的凭据。对于 Redshift 数据源，您可以使用由用户名和密码组成的凭据对。\n- Permissions：在本节中，您需要定义新创建数据集的权限，并确定哪个用户可以访问它以及他们拥有什么级别的访问权限。对于我们的示例，我们希望我们的读者用户能够从新创建的数据源创建数据集，但我们也希望限制该用户删除或更新数据源。\n\
  \n现在，让我们看看如何使用 QuickSight CLI 配置先前描述的 Redshift 连接：\n\n1. 首先，打开文本编辑器并复制以下 JSON 配置。用您环境中的值替换高亮显示的值。对于权限，请注意，我们仅授予\
  \ PassDataSource、DescribeDataSource 和 DescribeDataSourcePermissions 操作的权限，这将允许此用户使用此数据源设置新数据集，但不会允许他们更新或删除数据源：\n\
  \n```json\n{\n  \"AwsAccountId\": \"<account id>\",\n  \"DataSourceId\": \"RedshiftDatasouceCLI\"\
  ,\n  \"Name\": \"CLI Datasouce\",\n  \"Type\": \"REDSHIFT\",\n  \"DataSourceParameters\"\
  : {\n    \"RedshiftParameters\": {\n      \"Host\": \"hostname\",\n      \"Port\"\
  : 5439,\n      \"Database\": \"dev\",\n      \"ClusterId\": \"mycluster\"\n    }\n\
  \  },\n  \"Credentials\": {\n    \"CredentialPair\": {\n      \"Username\": \"admin\"\
  ,\n      \"Password\": \"R3dsh1ft\"\n    }\n  },\n  \"Permissions\": [\n    {\n\
  \      \"Principal\": \"arn:aws:quicksight:us-east-1:xxxxxxxxxxxx:user/default/author\"\
  ,\n      \"Actions\": [\n        \"quicksight:DescribeDataSource\",\n        \"\
  quicksight:DescribeDataSourcePermissions\",\n        \"quicksight:PassDataSource\"\
  \n      ]\n    }\n  ]\n}\n```\n\n2. 将文件另存为 create-data-source.json。\n3. 运行 `aws\
  \ quicksight create-data-source --cli-input-json file://create-data-source.json`。\n\
  \n此命令的结果将如下所示：\n\n```json\n{\n  \"Status\": 202,\n  \"DataSourceId\": \"SampleRedshiftDatasouce\"\
  ,\n  \"RequestId\": \"xxxxxx-xxxxxx-xxxxxx-xxxxxx-xxxxxxxxxx\",\n  \"CreationStatus\"\
  : \"CREATION_IN_PROGRESS\",\n  \"Arn\": \"arn:aws:quicksight:us-east-1:xxxxxxxxxxxx:datasource/SampleRedshiftDatasouce\"\
  \n}\n```\n\n现在我们已配置新数据源，让我们验证 Author 用户是否能够使用它来设置新数据集：\n\n1. 对于本教程，我们可以通过以 `author`\
  \ 用户身份登录 QuickSight 来简单验证新创建的数据源。\n2. 然后，导航到 **Datasets**，然后单击 **New Datasets**。您应该能够在\
  \ **FROM EXISTING DATA SOURCES** 菜单下找到新创建的数据源，如下图所示：\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_176_0.png)\n\
  \nFigure 8.3 – 使用 CLI 创建数据源\n\n3. 单击数据源。请注意，未显示删除或编辑数据源的按钮，因为该用户没有更新或删除此数据源所需的权限：\n\
  \n![](img/33bad1d211a2d93fd743a1978d403f9a_176_1.png)\n\nFigure 8.4 – 示例 CLI 数据源权限\n\
  \n现在我们已学习如何配置数据源，我们将使用 QuickSight CLI 更改环境的 QuickSight 设置。\n\n### 使用 QuickSight\
  \ API 编辑账户设置\n\n在本节中，我们将使用 QuickSight API 编辑账户上的设置。这允许我们在账户上配置账户自定义设置。对于我们的示例，我们将更改\
  \ QuickSight 账户的默认主题。\n\n1. 首先，让我们使用 QuickSight API 检索全局 QuickSight 账户详细信息。使用 CLI\
  \ 作为 QuickSight 或 AWS 管理员，键入以下命令，将 `aws-account-id` 值替换为您环境中的值：\n\n```bash\n$aws\
  \ quicksight describe-account-settings --aws-account-id <account-id>\n```\n\n响应应如下所示：\n\
  \n```json\n{\n    \"Status\": 200,\n    \"AccountSettings\": {\n        \"DefaultNamespace\"\
  : \"default\",\n        \"Edition\": \"ENTERPRISE\",\n        \"NotificationEmail\"\
  : \"your-email\",\n        \"AccountName\": \"quicksight-account-name\"\n    },\n\
  \    \"RequestId\": \"xxxxxxxxxxxxxxxxxxxxxx\"\n}\n```\n\n2. 接下来，让我们键入以下命令以获取 QuickSight\
  \ 账户自定义设置。账户自定义设置是指可以为 QuickSight 账户参数化的一组设置。目前，您可以通过账户自定义设置添加自定义默认主题：\n\n```bash\n\
  $aws quicksight describe-account-customization --aws-account-id <account-id>\n```\n\
  \n由于我们尚未添加任何自定义设置，响应很可能如下所示：\n\n```\nAn error occurred (ResourceNotFoundException)\
  \ when calling the DescribeAccountCustomization operation: Account customization\
  \ does not exist for AwsAccountId <account-id>\n```\n\n3. 现在，让我们添加一个账户自定义设置并将 Midnight\
  \ 设置为默认主题。使用 CLI 键入以下命令，将 aws-account-id 值替换为您的账户 ID 值：\n\n```bash\naws quicksight\
  \ create-account-customization \\\n--aws-account-id <account-id> --account-customization\
  \ \\\nDefaultTheme=arn:aws:quicksight::aws:theme/MIDNIGHT \\\n--region=us-east-1\n\
  ```\n\n4. 现在，让我们通过再次运行步骤 2 中的 describe-account-customization 命令来确认新账户自定义设置的创建。这次，响应应如下所示：\n\
  \n```json\n{\n \"Status\": 200,\n \"RequestId\": \"xxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx\"\
  ,\n \"AccountCustomization\": {\n \"DefaultTheme\": \"arn:aws:quicksight::aws:theme/MIDNIGHT\"\
  \n },\n \"Arn\": \"arn:aws:quicksight:us-east-1:xxxxxxxxxxxx:customization/account/xxxxxxxxxxxx\
  \ \",\n \"AwsAccountId\": \"xxxxxxxxxxxx\"\n}\n```\n\n> Note\n> 账户自定义设置适用于账户和 **AWS\
  \ 区域** 级别。\n\n要验证自定义设置是否已应用于此账户，您可以在应用账户自定义设置的同一区域的账户上创建示例分析。\n\n现在我们已学习如何使用 CLI\
  \ 编辑账户设置，在下一节中，我们将学习如何使用模板 API，这在开发跨多个环境的分析和仪表板时很有用。\n\n\n\n\n\n### 使用模板 API 重用资源\n\
  \nQuickSight 提供模板 API，允许你构建分析蓝图，然后使用这些蓝图为不同用户，甚至不同账户，创建其他分析，以保持一致性。模板在 GUI 上不可见，只能通过\
  \ API 访问。接下来，我们将展示使用纽约出租车分析创建模板的简单示例：\n\n1. 首先，让我们列出现有的分析。使用 CLI，键入以下命令，将 `<account-id>`\
  \ 值替换为你账户中的值：\n\n```\n$aws quicksight list-analyses --aws-account-id <account-id>\
  \ --region us-east-1\n```\n\n记下我们纽约出租车分析的 analysis-id 值。\n\n2. 接下来，我们将捕获更多分析详细信息，包括有关我们数据集的详细信息。键入以下命令，将\
  \ `<account-id>` 和 analysis-id 值替换为你环境中的值：\n\n```\naws quicksight describe-analysis\
  \ --aws-account-id <account-id> --analysis-id xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx\
  \ --region us-east-1\n```\n\n响应应如下所示：\n\n```json\n{\n    \"Status\": 200,\n    \"\
  Analysis\": {\n        \"Status\": \"CREATION_SUCCESSFUL\",\n        \"Name\": \"\
  yellowtrips_3mo analysis\",\n        \"LastUpdatedTime\": 1629144517.0,\n      \
  \  \"DataSetArns\": [\n            \"arn:aws:quicksight:us-east-1:xxxxxxxxxxxx:dataset/xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx\"\
  ,\n            \"arn:aws:quicksight:us-east-1:xxxxxxxxxxxx:dataset/xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx\"\
  \n        ],\n        \"CreatedTime\": 1621766161.633,\n        \"Sheets\": [\n\
  \            {\n                \"SheetId\": \"xxxxxxxx-xxxx-xxxxxx-xxxxxx-xxxxxxxxxxx\"\
  ,\n                \"Name\": \"Executive Summary\"\n            }\n        ],\n\
  \        \"ThemeArn\": \"arn:aws:quicksight::aws:theme/MIDNIGHT\",\n        \"Arn\"\
  : \"arn:aws:quicksight:us-east-1:xxxxxxxxxxxx:analysis/xxxxxxxx-xxxx-xxxxxx-xxxxxx-xxxxxxxxxxx\"\
  ,\n        \"AnalysisId\": \"xxxxxxxx-xxxx-xxxxxx-xxxxxx-xxxxxxxxxxx\"\n    },\n\
  \    \"RequestId\": \"xxxxxxxx-xxxx-xxxxxx-xxxxxx-xxxxxxxxxxx\"\n}\n```\n\n捕获数据集的\
  \ arn 值（高亮显示），因为我们将在下一步中使用它们。\n\n3. 接下来，打开文本编辑器并粘贴以下 JSON 配置，该配置将用于创建我们的第一个 QuickSight\
  \ 模板。将 AwsAccountId、源分析 arn 和数据集引用 arn 值替换为你环境中的值。将文件另存为 create-template.json：\n\
  \n```json\n{\n    \"AwsAccountId\": \"xxxxxxxxxx\",\n    \"TemplateId\": \"first-template\"\
  ,\n    \"Name\": \"My First Template\",\n    \"SourceEntity\": {\n        \"SourceAnalysis\"\
  : {\n            \"Arn\": \"arn:aws:quicksight:us-east-1:xxxxxxxxxx:analysis/xxxxxxxx-xxxx-xxxxxx-xxxxxx-xxxxxxxxxxx\"\
  ,\n            \"DataSetReferences\": [\n                {\n                   \
  \ \"DataSetPlaceholder\": \"Main Dataset\",\n                    \"DataSetArn\"\
  : \"arn:aws:quicksight:us-east-1:xxxxxxxxxxxx:dataset/xxxxxxxx-xxxx-xxxxxx-xxxxxx-xxxxxxxxxxx\"\
  \n                },\n                {\n                    \"DataSetPlaceholder\"\
  : \"Enrich Dataset\",\n                    \"DataSetArn\": \"arn:aws:quicksight:us-east-1:xxxxxxxxxxxx:dataset/xxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxx\"\
  \n                }\n            ]\n        }\n    },\n    \"VersionDescription\"\
  : \"1\"\n}\n```\n\n4. 接下来，我们将确认模板的创建。如前所述，模板只能通过 QuickSight API 使用和列出，没有 UI 元素。使用\
  \ CLI，我们将键入以下命令：\n\n```\n$aws quicksight list-templates --aws-account-id <account-id>\
  \ --region us-east-1\n```\n\n响应应如下所示：\n\n```json\n{\n    \"Status\": 200,\n    \"\
  TemplateSummaryList\": [\n        {\n            \"LatestVersionNumber\": 1,\n \
  \           \"LastUpdatedTime\": 1629320961.782,\n            \"TemplateId\": \"\
  first-template\",\n            \"CreatedTime\": 1629320961.782,\n            \"\
  Arn\": \"arn:aws:quicksight:us-east-1:xxxxxxxxxxxx:template/first-template\",\n\
  \            \"Name\": \"My First Template\"\n        }\n    ],\n    \"RequestId\"\
  : \"xxxxxxxxxx\"\n}\n```\n\n5. 接下来，我们将使用此模板创建新分析。为此示例，为了避免产生费用，我们将使用现有的 Author 用户，并从模板创建分析。为此部分，我们将使用\
  \ create-analysis CLI 命令。打开文本编辑器并粘贴以下内容，然后将其另存为 create-analysis-from-template.json。将高亮显示的值替换为与你环境匹配的值：\n\
  \n```json\n{\n    \"AwsAccountId\": \"xxxxxxxxxxxx\",\n    \"AnalysisId\": \"analysis-from-template\"\
  ,\n    \"Name\": \"Analysis From Template\",\n    \"Permissions\": [\n        {\n\
  \            \"Principal\": \"arn:aws:quicksight:us-east-1:xxxxxxxxxxxx:user/default/author\"\
  ,\n            \"Actions\": [\n                \"quicksight:RestoreAnalysis\",\n\
  \                \"quicksight:UpdateAnalysisPermissions\",\n                \"quicksight:DeleteAnalysis\"\
  ,\n                \"quicksight:DescribeAnalysisPermissions\",\n               \
  \ \"quicksight:QueryAnalysis\",\n                \"quicksight:DescribeAnalysis\"\
  ,\n                \"quicksight:UpdateAnalysis\"\n            ]\n        }\n   \
  \ ],\n    \"SourceEntity\": {\n        \"SourceTemplate\": {\n            \"DataSetReferences\"\
  : [\n                {\n                    \"DataSetPlaceholder\": \"Main Dataset\"\
  ,\n                    \"DataSetArn\": \"arn:aws:quicksight:us-east-1:xxxxxxxxxxxx:dataset/xxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx\"\
  \n                },\n                {\n                    \"DataSetPlaceholder\"\
  : \"Enrich Dataset\",\n                    \"DataSetArn\": \"arn:aws:quicksight:us-east-1:xxxxxxxxxxxx:dataset/xxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxx\"\
  \n                }\n            ],\n            \"Arn\": \"arn:aws:quicksight:us-east-1:xxxxxxxxxxxx:template/first-template\"\
  \n        }\n    }\n}\n```\n\n6. 接下来，键入以下命令：\n\n```bash\n$aws quicksight create-analysis\
  \ --cli-input-json file://create-analysis-from-template.json --region us-east-1\n\
  ```\n\n7. 你可以通过使用 list-analyses CLI 命令来确认分析的创建：\n\n```bash\n$aws quicksight list-analyses\
  \ --aws-account-id xxxxxxxxxxxx\n```\n\n8. 作为 Author 用户重新登录 QuickSight UI 并查看新创建的分析：\n\
  \n![](img/33bad1d211a2d93fd743a1978d403f9a_183_0.png)\n\n图 8.5 – 从模板生成分析\n\n打开分析后，你会注意到它与我们在前几章中创建的分析相同。主要区别在于，从模板创建的分析是使用几个\
  \ CLI 命令以编程方式创建的。使用模板和分析 API，我们可以创建和共享分析蓝图，然后使用此蓝图，我们可以创建新分析并将其与其他用户或账户共享。如果没有模板\
  \ API，你将需要手动重新创建分析，这可能涉及许多步骤，并且使得一致地应用更改变得更加困难。\n\n现在我们已经学习了如何以编程方式控制 QuickSight\
  \ 资源，在下一节中，我们将讨论构建自动化的模式。\n\n### 使用 QuickSight API 构建自动化\n\n到目前为止，我们已经学习了如何使用 QuickSight\
  \ API 通过 AWS CLI 控制资源。在本节中，我们将讨论一种架构，该架构将允许我们自动调用 QuickSight API。\n\n### 了解 AWS\
  \ Lambda 的角色\n\n**AWS Lambda** 是一种无服务器计算服务，允许你在不创建服务器的情况下运行代码。计算单位是 _Lambda 函数_。Lambda\
  \ 函数可以由特定事件触发，或在特定时间点触发。使用 AWS Lambda 和 AWS SDK，我们可以以编程方式控制 QuickSight 资源，以响应特定事件或基础架构的变化。例如，我们可以使用\
  \ SDK 在特定事件上设置数据刷新，而不是按间隔安排刷新。\n\n**Amazon EventBridge** 可用于更复杂的集成。Amazon EventBridge\
  \ 是一种无服务器事件总线，使在 AWS 上构建事件驱动应用程序变得更加容易。使用 EventBridge，你可以传递由你的应用程序、集成 **软件即服务 (SaaS)**\
  \ 应用程序和 AWS 服务生成的实时事件。AWS Lambda 可以是这些事件的目标，这使你能够针对某些事件设计响应。为了更好地了解如何自动化 QuickSight\
  \ 操作，在下一节中，我们将使用 AWS Lambda 创建一个从 **Amazon S3** 数据源进行简单的事件驱动摄取。\n\n### 自动化 Amazon\
  \ S3 数据源的摄取\n\n在本节中，我们将配置一个简单的应用程序，当底层 S3 数据更新时，该应用程序将自动刷新 **Amazon SPICE** 数据源。使用此方法，我们不再等待计划刷新（这会引入延迟），而是在新数据可用时立即触发刷新（这将最大限度地减少延迟）。为此示例，我们将使用一个示例\
  \ `.csv` 文件，该文件将配置为 QuickSight 中的 S3 数据源。然后，我们将配置一个由 S3 通知触发的 Lambda 函数。Lambda 函数将调用\
  \ QuickSight API 的 `createIngestion` 函数，这将导致 QuickSight 将新数据集导入 SPICE。下图显示了各个组件如何协同工作：\n\
  \n![](img/33bad1d211a2d93fd743a1978d403f9a_185_0.png)\n\n图 8.6 – 事件驱动的数据刷新\n\n现在我们已经讨论了高级架构，为了更好地理解它，让我们探索一个动手示例。\n\
  \n### 创建 S3 数据集\n\n让我们先创建一个示例数据集。我们需要创建一个 `.csv` 文件和一个清单文件：\n\n1. 首先，打开文本编辑器并创建一个\
  \ `sample.csv` 文件。将以下内容复制为其内容：\n\n   \"Name\",\"Age\"\n   \"George\",\"54\"\n\n\
  2. 将文件上传到你在 _第 1 章，AWS 分析生态系统简介_ 中创建的 S3 数据湖。在你的数据湖存储桶下创建一个名为 `samples` 的文件夹，或者简单地使用\
  \ `s3 cp` CLI 命令上传你的 `.csv` 文件：\n\n   `$aws s3 cp sample.csv s3://<data-lake-xxxxxxxx>/samples/`\n\
  \n\n\n\n\n## 接下来，我们将创建一个清单文件，用于定义需要导入到 QuickSight 的文件。我们可以拥有多个文件，但在此示例中为简单起见，我们将导入单个文件。打开文本编辑器并创建\
  \ manifest.json 文件。复制以下内容，并将高亮值替换为您环境中的值：\n\n```json\n{\n\"fileLocations\": [\n\
  {\n\"URIs\": [\n\"s3://data-lake-xxxxxxxxxx/samples/sample.csv\"\n]\n}\n]\n}\n```\n\
  \n## 接下来，我们将在 QuickSight 中创建一个 S3 数据源。以 Author 用户身份登录 QuickSight，单击 Datasets，然后单击\
  \ Create。从可用源列表中选择 S3。接下来，为数据源命名，并上传清单文件。\n\n## 导入后，您应该能够编辑数据集并验证其内容。\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_186_0.png)\n\
  \n图 8.7 – 创建 S3 数据源\n\n现在我们已配置 S3 数据源并将其导入到 SPICE，在下一节中，我们将配置将触发 SPICE 刷新的 Lambda\
  \ 函数。\n\n### 配置 QuickSight 导入 Lambda 函数\n\n在本节中，我们将学习如何配置 Lambda 函数以触发 SPICE 刷新。该函数将调用\
  \ createIngestion QuickSight API 调用来刷新我们在前面步骤中创建的示例数据集。\n\n登录到 AWS 控制台并选择 **AWS\
  \ Lambda**。在 Lambda 控制台中，选择 **Create function**。添加以下详细信息：\n\n- **Name**: quicksight-refresh\n\
  - **Runtime**: Python 3.8\n- **Execution Role**: 创建具有基本 Lambda 权限的新角色\n\n将其余选项保留默认值，然后单击\
  \ **Create function**。\n\n在继续之前，我们需要确保我们的 Lambda 函数具有调用 QuickSight API 所需的权限。为此函数选择\
  \ IAM 角色，并添加允许访问以下 QuickSight API 操作的策略：\n\n- quicksight:CreateIngestion\n- quicksight:CancelIngestion\n\
  - quicksight:DeleteDataSource\n- quicksight:DeleteDataSet\n\n对于本教程，您可以使用以下策略文档。将高亮值替换为您环境中的值：\n\
  \n```json\n{\n    \"Version\": \"2012-10-17\",\n    \"Statement\": [\n        {\n\
  \            \"Sid\": \"VisualEditor0\",\n            \"Effect\": \"Allow\",\n \
  \           \"Action\": \"quicksight:DeleteDataSet\",\n            \"Resource\"\
  : \"arn:aws:quicksight:*:<aws-account-id>:dataset/*\"\n        },\n        {\n \
  \           \"Sid\": \"VisualEditor1\",\n            \"Effect\": \"Allow\",\n  \
  \          \"Action\": [\n                \"quicksight:CreateIngestion\",\n    \
  \            \"quicksight:DeleteDataSource\",\n                \"quicksight:CancelIngestion\"\
  \n            ],\n            \"Resource\": [\n                \"arn:aws:quicksight:*:<aws-account-id>:datasource/*\"\
  ,\n                \"arn:aws:quicksight:*:<aws-account-id>:dataset/*/ingestion/*\"\
  \n            ]\n        }\n    ]\n}\n```\n\n现在我们的 Lambda 函数已拥有所需 API 的访问权限，让我们添加\
  \ Python 代码。\n使用 Lambda 代码编辑器，只需粘贴以下代码。将高亮值替换为您环境中的值：\n\n```python\nimport boto3\n\
  import uuid\nclient = boto3.client('quicksight')\ndef lambda_handler(event, context):\n\
  \    response = client.create_ingestion(\n        DataSetId='<dataset-id>',\n  \
  \      IngestionId=uuid.uuid4().hex,\n        AwsAccountId='<aws-account-id>'\n\
  \    )\n    return response\n```\n\n完成此步骤后，单击 **Deploy**。我们可以测试我们的 Lambda 函数并验证它是否触发刷新。在响应中查找\
  \ \"`IngestionStatus`\": \"`INITIALIZED`\" 以验证来自 QuickSight API 的响应。\n\n现在我们已配置\
  \ Lambda 函数，在下一节中，我们将配置 S3 触发器。\n\n### 配置 S3 触发器\n\n在本节中，我们将配置 S3 触发器。触发器应仅在我们的数据湖的\
  \ `samples` 文件夹中有新对象时触发刷新：\n\n1. 打开 Lambda 控制台并选择 **Add trigger**。\n2. 从下拉菜单中选择\
  \ S3 服务，然后选择您的 S3 数据湖存储桶。接着，配置以下值：\n   - **Event type**: All object create events\n\
  \   - **Prefix**: `samples/`\n   - **Suffix**: `.csv`\n3. 单击 **Add** 以添加新触发器。\n\n\
  现在我们已配置触发器，在下一节中，我们将测试我们的应用程序。\n\n### 测试应用程序\n\n要测试应用程序，请完成以下步骤：\n\n1. 打开 `sample.csv`\
  \ 文件并添加一行新行，使其如下所示：\n\n```csv\n\"Name\",\"Age\"\n\"George\",\"54\"\n\"Anna\",\"\
  56\"\n```\n\n2. 接下来，我们将在 S3 中更新文件。您可以使用 AWS 控制台或 AWS CLI：\n\n```bash\n$aws s3 cp\
  \ sample.csv s3://<data-lake-xxxxxxxxxx>/samples/\n```\n\n3. 这将触发我们的 Lambda 函数，进而调用\
  \ API 并触发刷新。要验证，请登录 QuickSight 并选择 **Datasets**。选择示例数据集，然后编辑以访问预览模式：\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_190_0.png)\n\
  \n| Name    | Age    |\n|---------|--------|\n| String  | Integer |\n| George  |\
  \ 54     |\n| Anna    | 56     |\n\n图 8.8 – 预览导入的数据\n\n注意我们数据集中的新值。QuickSight 已完成导入，现在新值已在\
  \ SPICE 中，在我们更新文件后不久。我们事件驱动架构的一个关键优势是我们不需要等待计划刷新——相反，一旦有新值，数据就会立即刷新。\n\n### 摘要\n\
  \n恭喜您完成本章。\n\n在本章中，我们学习了访问 QuickSight API 的不同选项，包括 CLI，并了解了使用 Python SDK 的示例。然后，使用\
  \ AWS CLI，我们学习了如何以编程方式控制 QuickSight 资源。我们学习了如何以编程方式创建新数据源，还使用 QuickSight API 控制账户设置（例如更改\
  \ QuickSight 的默认主题）。最后，使用一个简单的示例，我们学习了如何使用模板 API 创建分析蓝图，然后如何使用模板以编程方式创建分析。\n\n使用本章所学的内容，您将能够以编程方式控制\
  \ QuickSight 资源，这将使跨多个环境工作更加容易，并安全且一致地将更改应用到您的 QuickSight 账户。最后，使用一个简单的动手示例，我们学习了如何构建一个调用\
  \ QuickSight API 并自动将 S3 数据集导入 SPICE 的事件驱动应用程序。在下一章中，我们将学习如何管理 QuickSight 权限和使用情况。\n\
  \n### 问题\n\n以下是几个问题，用于复习本章所学内容。\n\n1. 什么是 QuickSight 模板？\n2. 我们如何访问 QuickSight API？\n\
  3. 我们如何从模板创建分析？\n4. 您如何使用 QuickSight API 构建自动化？\n\n### 进一步阅读\n\n- _Amazon QuickSight\
  \ 用户指南：_\n- https://docs.aws.amazon.com/quicksight/latest/user/amazon-quicksight-user.pdf\n"
- "# 9 管理 QuickSight 权限和使用情况\n\n在本章中，我们将学习如何管理 **Amazon QuickSight** 操作和权限。我们将重点介绍\
  \ QuickSight 权限模型，并学习如何配置细粒度权限。我们还将学习如何管理和组织 QuickSight 资源到文件夹中，以及如何设置基于阈值的警报和电子邮件报告。\n\
  \n我们将在本章中涵盖以下主题：\n\n- 管理 QuickSight 权限\n- 管理 QuickSight 使用情况\n\n## 技术要求\n\n对于本章，您需要访问以下内容：\n\
  \n- 一个 AWS 账户和 AWS Identity and Access Management (IAM) 用户，具有提升的访问权限\n- AWS 命令行界面\
  \ (CLI)\n- 一个配置了 Author 和 Reader 用户的 Amazon QuickSight 账户\n- 第 1 章《AWS 分析生态系统简介》中创建的环境\n\
  - 第 4 章《开发可视化和仪表板》中创建的仪表板\n\n## 管理 QuickSight 权限\n\n在本节中，我们将学习如何配置针对 QuickSight\
  \ 资源的用户权限。首先，让我们介绍设置权限时需要了解的基本主题：\n\n- **Principal**: AWS 主体是需要访问 AWS 资源的用户（或用户组）或应用程序。\n\
  - **Action**: 操作定义主体允许或拒绝的 API 操作集。例如，在 QuickSight 中，`DeleteDataSet` 操作删除数据集。要查看\
  \ QuickSight 操作的完整列表，请参阅 AWS 文档：https://docs.aws.amazon.com/service-authorization/latest/reference/list_amazonquicksight.html#amazonquicksight-actions-as-permissions。\n\
  - **Resource**: 对于大多数操作，我们可以将策略范围缩小到特定资源。通常，单个资源具有其自身唯一的 **Amazon Resource Number\
  \ (arn)**。\n- **Condition**: AWS 允许您根据特定条件定义访问。例如，允许来自特定 IP 地址的应用程序访问的条件。\n\n在授予\
  \ AWS 权限（包括 QuickSight 权限）时，请确保遵循 **最小权限** 安全最佳实践。根据最小权限原则，您应仅允许用户访问其所需的特定操作和资源。\n\
  \n\n\n\n\n## 使用用户组\n\n随着用户数量的增加以及其访问模式变得越来越复杂，配置其对资源的权限的复杂性也呈指数级上升。在这种情况下，我们可以使用\
  \ **用户组**。用户组允许您将用户分组，然后在组级别而非个人级别应用权限，这为您节省了时间和精力。当用户加入组时，他们会自动继承组权限。同样，当用户离开组时，他们将失去对组资源的访问权限。\n\
  \n为了更好地了解如何在 Amazon QuickSight 中管理组，我们将使用一个简单的动手示例：\n\n1. 首先，让我们为市场部创建一个组。使用配置了\
  \ AWS CLI 并具有提升访问权限的终端，键入以下命令，将 `<account-id>` 值替换为您环境中的值：\n\n   ```\n   $aws quicksight\
  \ create-group --group-name \"Marketing\" \n   --description \"Group for the Marketing\
  \ Department\" \n   --aws-account-id <account-id> --namespace default \n   --region\
  \ us-east-1\n   ```\n\n2. 接下来，让我们将我们的 Reader 用户添加到此组。为此，我们将使用 create-group-membership\
  \ CLI 命令。键入以下内容，将高亮值替换为您环境中的值：\n\n   ```\n   $aws quicksight create-group-membership\
  \ --member-name reader --group-name Marketing --aws-account-id <account-id> --namespace\
  \ default --region us-east-1\n   ```\n\n3. 接下来，我们将使用 QuickSight 控制台将新仪表板共享给市场组，而不是单个用户。以\
  \ Author 用户身份登录 QuickSight。打开 New York Taxi 分析并将其发布为全新的仪表板。为您新创建的仪表板命名。\n\n4. 在下一个屏幕上，共享仪表板时，选择\
  \ **Marketing** 组并共享您的仪表板，如下面的屏幕截图所示：\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_196_0.png)\n\
  \n图 9.1 – 与组共享仪表板\n\n5. 要验证您的仪表板是否已成功共享，请注销并以 Reader 用户身份重新登录。导航到 **Dashboards**，并注意新创建的仪表板：\n\
  \n![](img/33bad1d211a2d93fd743a1978d403f9a_196_1.png)\n\n图 9.2 – 确认仪表板组访问权限\n\n\
  请注意，我们不需要直接为 Reader 用户授予此仪表板的访问权限。相反，我们将 Reader 用户添加到 **Marketing** 组，然后允许该组的所有用户访问我们发布的仪表板。在未来，如果有更多用户加入\
  \ **Marketing** 组，他们将自动获得对与该特定组共享的资源的访问权限，从而无需在单个用户级别定义特定权限。\n\n现在我们已经了解了用户组以及如何使用它们来简化我们的权限，在下一节中，我们将讨论自定义权限。\n\
  \n## 设置自定义权限\n\n在 _第 2 章，Amazon QuickSight 简介_ 中，我们了解了不同的用户群组：Admin、Author 和 Reader。用户群组决定了对\
  \ QuickSight 控制台中功能的访问级别。自定义配置文件允许您使用自定义安全配置文件覆盖默认权限，并定义符合您组织要求的权限。\n\n> Note\n\
  > 要使自定义权限生效，您需要使用 IAM 联合用户。\n\n为了更好地了解自定义权限，我们将使用一个简单的动手示例。默认情况下，Author 用户可以配置新数据源。对于我们的示例，让我们假设，为了保护我们的\
  \ **Amazon SPICE** 空间，我们希望防止作者创建新数据源：\n\n1. 首先，以 QuickSight Admin 用户身份登录 QuickSight\
  \ 控制台。\n2. 展开屏幕右上角的 QuickSight 菜单并选择 **Manage QuickSight**。\n3. 在选择 **Manage users**\
  \ 选项后，单击 **Manage permissions**，如下面的屏幕截图所示：\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_197_0.png)\n\
  \n图 9.3 – 访问自定义权限\n\n4. 在下一个屏幕上，勾选 **Creating or updating all data sources** 复选框，如下面的屏幕截图所示：\n\
  \n### 编辑自定义权限\n\n**名称**\n\ncustom-author\n\n**限制访问**\n\n**仪表板和分析**\n\n☐ 添加或运行异常检测\n\
  \n☐ 创建或更新主题\n\n☐ 导出为 CSV\n\n☐ 导出为 Excel\n\n☐ 共享分析\n\n☐ 共享仪表板\n\n☐ 共享数据集\n\n**数据集**\n\
  \n☐ 创建或更新所有数据集\n\n☐ 仅创建或更新 SPICE 数据集\n\n**数据源**\n\n☑ 创建或更新所有数据源\n\n**文件夹**\n\n☐\
  \ 创建共享文件夹\n\n☐ 重命名共享文件夹\n\n**报表**\n\n☐ 创建或更新电子邮件报表\n\n☐ 订阅电子邮件报表\n\n**阈值警报**\n\n\
  ☐ 创建或更新阈值警报\n\n图 9.4 – 编辑自定义权限\n\n**Note**\n\n使用 QuickSight 控制台定义自定义权限时，您选择要 *限制*\
  \ 访问的操作。其余操作将根据用户所属的群组进行允许。\n\n5. 在分配权限之前，值得确认我们的 Author 用户将能够创建新数据集。以 Author 用户身份登录\
  \ QuickSight 控制台，并确认您可以通过选择 **New dataset** 来创建新数据集。\n\n6. 接下来，我们需要添加一个新的 Author\
  \ 用户。确保在注册用户时勾选 IAM 复选框以使用该用户的 IAM 凭证。对于此示例，我们可以将用户命名为 `author-iam`。\n\n7. 注册新的\
  \ author-iam 用户后，我们将新的自定义权限配置文件分配给他们。使用 AWS CLI 并以 QuickSight Admin 用户身份，键入以下命令，将高亮值替换为您环境中的值：\n\
  \n```\n$aws quicksight update-user --user-name author-iam\n--role AUTHOR --custom-permissions-name\
  \ custom-author\n--email <your-email> --aws-account-id <account-id>\n--namespace\
  \ default --region us-east-1\n```\n\n8. 现在，我们已将自定义权限附加到新创建的 Author 用户。我们可以验证控制台访问是否符合预期。注销并以\
  \ author-iam 用户身份重新登录 QuickSight 控制台。\n\n9. 接下来，从左侧菜单选择 **Datasets**，然后选择 **Create\
  \ a Dataset**。您的屏幕应如下图所示，没有创建新数据集的选项：\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_199_0.png)\n\
  \n图 9.5 – 应用自定义权限\n\n通过应用自定义权限，我们能够覆盖默认的 Author 行为，并防止新注册的 Author 用户创建新数据源。您可以在\
  \ QuickSight 帐户中配置多个自定义权限配置文件并将其分配给用户。一个用户不能拥有多个自定义权限配置文件。\n\n10. 作为最后一步，我们将从 QuickSight\
  \ 注销 author-iam 用户，因为我们不再需要他们。要注销用户，您可以使用 QuickSight Admin 控制台或 AWS CLI，键入以下命令并将高亮值替换为您环境中的值：\n\
  \n```\naws quicksight delete-user --user-name author-iam\n--aws-account-id <account-id>\
  \ --namespace default\n--region us-east-1\n```\n\n现在我们已经了解了如何配置自定义权限，在下一节中，我们将学习如何将\
  \ QuickSight 与 Amazon Lake Formation 集成。\n\n## 与 Amazon Lake Formation 集成\n\n在本节中，我们将了解\
  \ QuickSight 与 Amazon Lake Formation 的集成。**Amazon Lake Formation** 在 **AWS Glue\
  \ Data Catalog** 之上提供了额外的权限层，允许您在 AWS 上的数据湖之上设置细粒度权限。与 Lake Formation 的集成对于 **Amazon\
  \ Athena** 数据集很有用。结合 QuickSight，Lake Formation 将允许您从单一位置管理数据权限，通过增强现有的 QuickSight\
  \ 细粒度权限，在数据湖层强制执行权限。为了了解 Lake Formation 带来的价值，我们首先需要了解如何在没有 Lake Formation 的情况下为\
  \ Athena 数据集应用权限。\n\n## 在没有 Amazon Lake Formation 的情况下配置 Amazon Athena 数据集权限\n\n\
  为了更好地了解 Lake Formation 的价值，了解如何为 Athena 数据集配置权限很重要。我们将使用在 _第 1 章，AWS 分析生态系统简介_ 中配置的演示数据。具体来说，我们已配置以下\
  \ AWS Glue 数据库：\n\n- 数据库：my-data-lake-db\n- 表名：yellowtrips\n- S3 位置：`s3://data-lake-xxxxxxxx/yellowtrips/`\n\
  \n为了能够创建 Athena 数据集，您需要 QuickSight 执行以下操作：\n\n- 配置对 Amazon Athena 的访问。\n- 配置对底层\
  \ S3 存储桶的访问。\n\n在 _第 2 章，Amazon QuickSight 简介_ 中，我们了解了如何授予 QuickSight 对 **Amazon\
  \ S3** 存储桶的访问权限。您可以遵循类似的过程来授予对 Athena 服务的访问权限。\n\n要启用 Athena 访问，我们可以使用以下步骤：\n\n\
  1. 首先，以 QuickSight Admin 用户身份登录 AWS 控制台并选择 **Manage QuickSight**。\n\n\n\n\n\n##\
  \ 选择“安全性和权限”。\n\n## 从“QuickSight 访问 AWS 服务”菜单中选择“添加或删除”。\n\n管理用户\n您的订阅\nSPICE 容量\n\
  账户设置\n安全性和权限\n管理 VPC 连接\n移动设置\n域和嵌入\n账户自定义\n\n### 安全性和权限\n\nQuickSight 可以控制对 AWS\
  \ 资源的访问权限，适用于 e\n\n### QuickSight 访问 AWS 服务\n\n### 已授予 5 个服务的访问权限\n\nAmazon Redshift\
  \ Amazon RDS\n\n通过配置对 AWS 服务的访问权限，QuickSight 可通过以下选项进行控制。\n\n添加或删除\n\n图 9.6 – 允许\
