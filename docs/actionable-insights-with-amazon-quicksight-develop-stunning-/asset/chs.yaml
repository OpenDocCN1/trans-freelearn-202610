  | Bronx     | null          | $969,806.58   |\n|           | Cash          | $50,961.67\
  \    |\n|           | Credit Card   | $100,715.51   |\n|           | Dispute   \
  \    | -$334.70      |\n|           | No Charge     | $1,036.51     |\n|       \
  \    | Subtotal      | $1,122,185.57 |\n| Brooklyn  |               | $2,172,314.53\
  \ |\n| EWR       |               | $2,907.37     |\n| Manhattan |              \
  \ | $45,001,178...|\n| Queens    |               | $6,022,818.58 |\n| Staten Island\
  \ |           | $77,034.66    |\n| Unknown   |               | $1,392,948.05 |\n\
  \n图 4.13 – 透视表可视化\n\n现在我们已经学习了如何使用表格，在下一节中，我们将学习关于可视化地理空间数据的内容。\n\n### 可视化地理空间数据\n\
  \nQuickSight 可以处理地理空间数据。在撰写本文时，QuickSight 支持两种类型的地理空间可视化：\n\n- 地图上的点\n- 填充地图\n\n\
  当您需要在地图上突出显示特定点时，地图上的点可视化非常合适。点的大小由 Size 字段决定。当您需要可视化不同类别时，可以添加多种颜色。地图上的点可视化与坐标配合良好，但也可以处理其他地理空间数据类型，例如城市、州和国家。\n\
  \n当您需要可视化覆盖更广地理范围（例如国家）的指标时，**填充地图**可视化可能更合适。创建填充地图可视化时，您需要定义两个字段：位置字段和颜色字段。\n\n\
  在下一节中，我们将学习如何可视化源和目标之间的流动。\n\n### 可视化源和目标之间的流动\n\n存在一些场景，您可能希望在考虑源和目标的同时可视化指标。**Sankey**\
  \ 可视化类型在我们需要可视化在源和目标之间流动的指标时非常合适。Sankey 图将源到目标的流动描绘为一条线。线的宽度取决于指标的值。例如，在我们的数据集中，我们捕获出租车的上车和下车位置。我们可以使用查找表丰富位置\
  \ ID，并获取上车区和下车区。现在，假设我们想要可视化纽约各区之间行驶的总里程。使用 Sankey 可视化类型，我们需要将 **Pick Up Borough**\
  \ 设置为 **Source** 字段，将 **Drop off Borough** 设置为 **Destination** 字段，并将 **trip_distance**\
  \ 设置为 **Weigh** 字段。\n\n以下屏幕截图显示了使用我们示例数据集的示例 Sankey 可视化：\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_99_0.png)\n\
  \n图 4.15 – Sankey 可视化类型\n\n\n\n\n\n现在我们已经学习了如何处理大多数可用的可视化类型，在下一节中，我们将学习如何发布分析，以便与其他用户共享。\n\
  \n### Publishing dashboards\n\n在本节中，我们将学习如何发布仪表板并与其他读者用户共享。仪表板是分析的只读版本，可供读者用户使用。仪表板不是分析的时间点快照。当用户访问仪表板时，QuickSight\
  \ 将获取数据以填充仪表板可视化内容。根据您配置数据源的方式，数据将通过直接查询或使用 SPICE 获取。当您使用 SPICE 数据源时，QuickSight\
  \ 将根据用户数量自动扩展。当您直接查询数据源时，需要确保数据源（例如数据仓库）具有足够的资源来支持工作负载。\n\n共享仪表板非常简单。让我们来看看：\n\n\
  1. 首先，您需要打开要作为仪表板共享的分析。\n2. 单击屏幕右上角的 **Share** 按钮。这将打开 **Publish a dashboard** 屏幕，如下图所示：\n\
  \n![](img/33bad1d211a2d93fd743a1978d403f9a_100_0.png)\n\nFigure 4.16 – Publish a\
  \ dashboard screen\n\n3. 输入名称 – 例如，New York Taxi Dashboard – 然后单击 **Publish dashboard**。\n\
  4. 几秒钟后，仪表板将生成，并出现 **Share dashboard** 屏幕，如下图所示：\n\n### Share dashboard\n\nFind\
  \ a person or group to share with.\n\nEnter a username, group, or email address\n\
  \nShare with everyone in this account\n\n| Name | Email | Permission | Role |\n\
  |---|---|---|---|\n| | | | |\n\nManage dashboard access Share\n\nFigure 4.17 – Share\
  \ dashboard screen\n\n5. 添加您想要共享仪表板的任何用户或组，然后单击 **Share**。\n\n6. 恭喜 – 您已创建第一个 QuickSight\
  \ 仪表板！如下图所示：\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_102_0.png)\n\nFigure 4.18\
  \ – Our first QuickSight dashboard\n\nQuickSight 仪表板主要由希望从组织数据中获取洞察的业务用户使用。对于这些用户，应用程序的外观和感觉可能是一个重要因素。在下一节中，我们将学习一些可用于更改\
  \ BI 应用程序外观和感觉的基本控件。\n\n### Customizing the look and feel of the application\n\n\
  在本节中，我们将关注应用程序的外观和感觉。我们可能需要更改应用程序默认外观和感觉的原因有很多。例如，组织可能需要使用与其品牌相匹配的颜色。在本节中，我们将学习如何执行以下操作：\n\
  \n- Apply themes\n- Format individual visuals\n\n让我们开始！\n\n### Applying themes\n\
  \nQuickSight 中的主题是一组外观设置，可以应用于多个分析和仪表板。要访问 **Themes** 菜单，我们需要打开一个分析：\n\n1. 首先，以作者用户身份登录并打开一个分析。这里，我们将使用在本章中开发的\
  \ New York Taxi 分析。\n2. 注意左侧菜单中存在 **Themes** 选项。单击 **Themes** 菜单，如下所示：\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_103_0.png)\n\
  \nFigure 4.19 – Themes\n\n3. 注意有预构建的主题可供我们开始使用。对于此示例，我们将选择 **Midnight** 主题，并使用之前创建的仪表板观察外观和感觉。\n\
  4. 选择 **Midnight** 主题。\n5. 现在，我们需要刷新仪表板。单击屏幕右上角的 **Share** 选项，然后单击 **Publish dashboard**。\n\
  \n6. 这次，我们需要替换现有仪表板，而不是创建新仪表板。请参见以下示例：\n\n### Publish a dashboard\n\nPublish new\
  \ dashboard as\nNew dashboard 1\n\nReplace an existing dashboard\nNew York Taxi\
  \ Dashboard\nRename\n\nAdvanced publish options\nPublish dashboard\n\nFigure 4.20\
  \ – Updating an existing dashboard\n\n7. 观察仪表板的新外观和感觉，如下图所示：\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_104_0.png)\n\
  \nFigure 4.21 – Dashboard with the Midnight theme applied\n\n> Note\n> You can create\
  \ a theme using your colors and a selection of different fonts.\n> Consult the AWS\
  \ documentation to understand how each color group setting\n> is used by QuickSight.\n\
  \n虽然主题可以应用于分析的所有可视化内容，但您可能希望更改单个可视化内容的颜色。在下一节中，我们将学习如何更改单个可视化内容的外观和感觉。\n\n### Formatting\
  \ visuals\n\n您可能希望更改特定可视化内容的颜色，或更改可视化内容中特定数据点的颜色。在其他情况下，您可能希望根据特定条件应用格式设置。在本节中，您将学习如何执行以下操作：\n\
  \n- Edit the colors of a specific visual.\n- Apply conditional formatting.\n\n让我们开始！\n\
  \n### Editing the color of a specific visual\n\n要编辑特定可视化内容的颜色，请执行以下步骤：\n\n1. 首先，打开分析并单击可视化内容的彩色区域以打开颜色选项，如下图所示：\n\
  \n![](img/33bad1d211a2d93fd743a1978d403f9a_105_0.png)\n\nFigure 4.22 – Chart color\
  \ settings\n\n2. 注意我们的柱状图只有一种颜色。假设我们想要更改图表颜色，并且还希望最高值（Manhattan）以另一种颜色突出显示。\n\n\
  3. 要更改图表颜色，您需要从 **Chart Color** 选项中选择想要的颜色。您可以选择一组预定义的颜色，也可以选择自定义颜色。\n\n4. 最后，要仅更改最高值（在我们的示例中为\
  \ _Manhattan_）的颜色，您需要从 **Color Manhattan** 中选择一种颜色。您可以从一组预定义的颜色中选择，也可以选择自定义颜色。\n\
  \n5. 以下图片显示了按照前面步骤描述进行颜色更改后的图表：\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_106_0.png)\n\
  \nFigure 4.23 – Bar chart after updating its color\n\n现在我们已经学习了如何更改可视化内容的颜色，让我们学习如何应用条件格式。\n\
  \n### Applying conditional formatting\n\n某些可视化类型支持条件格式。当您需要根据条件控制可视化内容的外观和感觉时，可以使用条件格式。在本节中，我们将选择之前开发的一个可视化内容并应用条件格式。\n\
  \n仪表图可视化支持可视化格式。对于此示例，假设我们希望当百分比目标低于 95% 时，文本颜色为红色：\n\n1. 首先，我们需要访问 **Conditional\
  \ formatting** 设置，如下图所示：\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_107_0.png)\n\
  \n2. 在此示例中，我们有兴趣更改文本颜色，因此需要单击 **Add text color** 选项。\n\n3. 然后，我们必须配置条件，如下所示：\n \
  \  a) Format field based on: Percent (%)\n   b) Condition: Less than\n   c) Value\
  \ (%): 95\n   d) Color: Red:\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_107_1.png)\n\
  \n4. 接下来，单击 **Apply**。一旦设置应用，可视化内容将重新加载并显示，如下图所示。请注意，颜色已更改为红色，因为该值低于 95% 的阈值：\n\n\
  **Note** Not all visual types have the option for conditional formatting. The conditional\
  \ formatting parameters will depend on the visual’s type.\n\n### Summary\n\n恭喜完成本章。在本章中，我们学习了如何创建分析，这是\
  \ BI 开发者的主要用户界面。我们添加了最常见的可视化类型，这些类型回答了 BI 应用程序中的最常见问题，例如可视化 KPI、类别和时间序列数据。完成分析后，我们学习了如何将分析导出为仪表板并与业务用户共享。\n\
  \n最后，我们学习了如何通过应用主题或独立更改每个可视化内容的颜色以及应用条件格式来更改仪表板的外观和感觉。有了本章获得的知识，您可以使用 QuickSight\
  \ 为您的业务构建有意义的可视化内容。\n\n在下一章中，我们将学习如何通过向仪表板添加交互性来构建更丰富的 BI 应用程序。\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_108_0.png)\n\
  \nFigure 4.26 – Visual after conditional formatting has been applied\n\nFeel free\
  \ to try out different visual types and different conditions and settings.\n\n\n\
  \n\n\n### Q&A\n\n- 1. 什么是 Amazon QuickSight 中的可视化？\n- 2. 哪些可视化类型更适合可视化时间序列数据？\n\
  - 3. 你能举一些条件格式特别有用的示例吗？\n- 4. 如何创建和应用自定义主题？\n- 5. 什么是桑基图，何时会使用它？\n\n### 进一步阅读\n\n\
  有关本章所涵盖内容的更多信息，请参阅以下资源：\n\n- QuickSight 用户指南 – AWS: https://docs.aws.amazon.com/quicksight/latest/user/amazon-quicksight-user.pdf\n"
- '# 第 2 部分：高级仪表板和洞察


  在本部分中，我们将深入探讨 Amazon QuickSight 的一些更高级功能，这些功能将使读者能够开发交互式和嵌入式仪表板，并为仪表板添加机器学习功能。


  本部分包含以下章节：


  - 第 5 章，构建交互式仪表板

  - 第 6 章，使用 ML 功能和洞察

  - 第 7 章，了解嵌入式分析

  '
- '# 5 构建交互式仪表板


  在本章中，我们将学习如何使用 Amazon QuickSight 开发交互式仪表板。你将学习如何向仪表板添加自定义控件，并使用参数为 BI 应用程序添加交互性。我们还将探讨带有点击操作的高级筛选选项，以及
  URL 操作。


  在本章中，我们将涵盖以下主题：


  - 使用筛选器和参数

  - 使用 QuickSight 操作


  ### 技术要求


  对于本章，你需要以下内容：


  - 一个 AWS 账户

  - 一个配置了 Author 和 Reader 用户的 QuickSight 账户

  - 我们在 _第 4 章，开发可视化和仪表板_ 中创建的仪表板


  ### 使用筛选器和参数


  用户可以通过单击应用程序的特定区域或将鼠标悬停在可视化上来与仪表板交互，以获取特定数据点的其他信息。作为 BI 开发人员，你可能会遇到需要为仪表板添加额外交互性的场景，允许用户筛选数据集或实现特定操作。在本节中，我们将学习如何利用这些特定的
  QuickSight 功能为仪表板添加交互性。我们将提供使用我们在前面第 4 章开发可视化和仪表板中开发的纽约数据集和仪表板的实际操作示例。但首先，我们需要了解如何使用
  QuickSight 筛选器。


  ### 使用筛选器


  QuickSight 作者可以筛选数据集。例如，当你需要在可视化之前细化数据集时，可以使用筛选。你可以控制 QuickSight 筛选器的范围，以便它们可以应用到你想要的可视化上。当应用于
  QuickSight 分析时，筛选对读者来说是透明的。如果你需要允许读者筛选数据，可以在与读者共享仪表板时应用其他设置。让我们看一个示例来了解如何添加和应用筛选器。对于我们的示例，让我们假设我们已检测到空值，并且希望从某些可视化中删除它们：


  1. 首先，我们需要打开我们的纽约出租车分析。

  2. 我们将使用之前创建的透视表。当我们打开 Borough 类别时，可以观察到支付类型为空值。空值可能很有用，因为它们可以帮助我们检测数据中的问题。对于此示例，让我们假设我们不想在透视表中可视化空值，同时保持其他可视化不受影响：


  | Pick Up Borough | Payment Type | Fare Amount   |

  |-----------------|--------------|---------------|

  | Bronx           | null         | $969,806.58   |

  |                 | Cash         | $50,961.67    |

  |                 | Credit Card  | $100,715.51   |

  |                 | Dispute      | -$334.70      |

  |                 | No Charge    | $1,036.51     |

  |                 | Subtotal     | $1,122,185.57 |

  | Brooklyn        |              | $2,172,314.53 |


  图 5.1 – 带有空值的透视表


  3. 通过单击可视化来选择透视表。然后，从左侧菜单中选择筛选器选项卡，如下面的屏幕截图所示：


  ![](img/33bad1d211a2d93fd743a1978d403f9a_115_0.png)


  图 5.2 – 选择要筛选的可视化


  4. 由于我们没有筛选，将收到创建筛选器的提示。单击 **Create one...** 提示，然后选择需要筛选的筛选器（在此示例中为 Payment Type）。


  5. 此操作将创建一个筛选器。单击新创建的筛选器以获取筛选器配置选项。


  6. 现在我们已创建筛选器，需要确认其范围。默认情况下，筛选器仅应用于所选可视化。筛选器不会应用于整个分析。如果我们需要将更多可视化添加到其范围，可以更改筛选器的范围。


  7. 接下来，我们需要定义筛选条件。对于我们的示例，我们将添加一个条件来 _排除_ NULL 值，如下所示：


  ![](img/33bad1d211a2d93fd743a1978d403f9a_116_0.png)


  图 5.3 – 定义筛选条件


  8. 单击 **Apply** 并观察 NULL 值如何从我们的可视化中排除。请注意，筛选器范围之外的其他可视化保持不变。


  默认情况下，筛选器不会显示在读者用户界面上。某些 BI 应用程序可能需要给用户筛选数据的能力。


  > **注意**

  > 筛选数据集时，QuickSight 将查询数据集，然后应用筛选。如果数据集已配置为直接查询，QuickSight 将在筛选前连接到数据源以获取最新数据。如果数据集配置为
  SPICE 数据集，则 QuickSight 将直接从 SPICE 获取数据，而无需查询或从原始数据源导入数据。


  要允许读者用户筛选数据，我们需要在仪表板发布屏幕上选中 **Enable ad hoc filtering** 选项。该选项位于 **Advanced publish
  options** 下，如下所示：


  ![](img/33bad1d211a2d93fd743a1978d403f9a_117_0.png)


  图 5.4 – 启用临时筛选


  现在我们已经学习了如何添加筛选器，让我们介绍 QuickSight 参数的概念。


  ### 使用参数


  QuickSight 中的参数是用户可以设置的变量，通常使用屏幕上的控件。参数可以以多种方式使用。例如，我们可以根据参数动态筛选分析数据。为了理解这个概念，我们将使用我们的纽约出租车分析示例。让我们假设我们的业务用户需要根据客户使用的支付类型来了解客户行为的模式和变化。为了实现此用例，我们将创建一个参数来存储用户对
  `Payment Type` 字段的选择。


  ### 创建参数


  创建参数很简单，如下所示：


  1. 你可以选择左侧菜单上的 **Parameter** 项目，或单击屏幕右上角的 + **Add** 按钮，然后选择 **Add parameter**。选中后，你将看到参数创建屏幕，如下所示：


  ![](img/33bad1d211a2d93fd743a1978d403f9a_118_0.png)


  图 5.5 – 添加参数


  2. 对于此示例，我们将使用以下值（如上一张屏幕截图所示）：


  - **Name**: `paymenttype`

  - **Data type**: String

  - **Values**: Multiple values

  - **Default values**: Cash, Credit Card, Dispute, No Charge


  3. 接下来，单击 **Create**。参数现在应已添加到你的分析中。


  此时，我们的参数已添加到分析中，但我们尚未使用它。接下来，我们将此参数与之前创建的筛选器关联起来。






  ### 将参数链接到筛选器


  在我们仍处于分析状态并以作者用户身份登录的情况下，要将参数链接到筛选器，我们需要执行以下操作：


  1. 首先，找到我们之前创建的筛选器。您可以单击已应用筛选器的可视化对象，然后单击左侧菜单中的“筛选器”项。


  2. 现在单击 **Edit**，或直接单击我们之前创建的 **Payment Type** 筛选器。


  3. 要将筛选器与参数链接，我们需要从 **Filter Type** 下拉菜单中选择 **Custom filter**。


  4. 接下来，勾选 **Use parameters** 复选框。


  5. 接下来，会出现一个弹出窗口，询问您是否要更改筛选器的范围。由于我们不需要筛选分析中的其他可视化对象，我们将选择 **No**。


  > Note

  > 创建参数后，随时可以编辑筛选器的范围。范围更新将立即生效，无需更新参数或控件。


  6. 从下拉菜单中，选择我们之前创建的 `paymenttype` 参数。以下屏幕截图显示了将筛选器链接到参数时筛选器配置的外观：


  ![](img/33bad1d211a2d93fd743a1978d403f9a_119_0.png)


  图 5.6 – 将筛选器链接到参数


  7. 单击 **Apply**，然后单击 **Close**。


  现在，我们的筛选器和参数已连接，筛选器将继承参数的默认值。在我们的示例中，我们使用了多值参数。我们可以确认，透视表仅显示包含参数默认值的记录。现在我们已将参数与可视化对象链接，将学习如何添加屏幕控件，并允许读者更改参数值。


  ### 添加屏幕控件


  QuickSight 允许您添加屏幕控件，以便读者用户可以动态设置参数的值。在我们的示例中，设置 `paymenttype` 参数的值将导致 **Payment
  Type** 筛选器的值发生变化，该筛选器已应用于透视表可视化对象。要添加屏幕控件，请执行以下步骤：


  1. 首先，从左侧菜单中选择 **Parameters** 项。


  2. 然后，选择我们之前创建的 `paymenttype` 参数。从下拉菜单中，单击 **Add control**，如下所示：


  ![](img/33bad1d211a2d93fd743a1978d403f9a_120_0.png)


  图 5.7 – 添加屏幕控件


  3. 从控件的创建设置中，我们需要定义以下参数：


  - **Display Name**：屏幕控件的用户友好名称。在我们的示例中，我们使用了 `Payment Type`。


  - **Style**：用户用于设置参数的控件类型。控件样式选项也由参数的数据类型决定。例如，如果我们的参数是日期类型，则 **Date Picker** 将是可用选项之一。在我们的示例中，我们将使用
  **List – Multiselect** 样式，如以下屏幕截图所示。此类型将允许用户从下拉菜单中选择多个值。


  - **Values**：用户可以选择的值。您可以将这些值链接到数据集中的值，这可确保可用值与数据集同步，因此无需单独维护这些值。在我们的示例中，我们链接了 `Payment
  Type` 字段的值。以下屏幕截图显示了屏幕控件配置示例：


  ![](img/33bad1d211a2d93fd743a1978d403f9a_121_0.png)


  4. 单击 **Apply** 以添加屏幕控件。


  现在我们已添加屏幕控件，拥有了发布交互式仪表板所需的所有组件。让我们来看看使仪表板实现交互性的一系列事件：


  1. 首先，用户使用屏幕控件选择值。


  2. 所选值将传递给参数。


  3. 然后，这些参数用作筛选条件。


  4. 最后，筛选器范围内的可视化对象在用户选择后更新。


  以下图表描述了此处所述的流程：


  ![](img/33bad1d211a2d93fd743a1978d403f9a_122_0.png)


  图 5.9 – 交互式筛选组件


  现在我们已配置所有必需的组件，让我们来测试屏幕控件：


  1. 首先，请注意，在屏幕顶部，我们有一个名为 **Controls** 的新部分，其中包含新创建的 Payment Type 屏幕控件。以下屏幕截图显示了新创建的控件：


  ![](img/33bad1d211a2d93fd743a1978d403f9a_123_0.png)


  图 5.10 – 多选控件


  2. 更改此控件的选择将自动更改 `paymenttype` 参数的值，该参数已配置为与我们的 Payment Type 筛选器协同工作。


  3. 您可以从筛选器控件访问其他选项。可用选项之一允许您将控件从屏幕顶部分离并添加到分析表中。这是范围较窄的筛选器的一个好选项。在我们的示例中，我们的筛选器仅覆盖单个可视化对象，因此将控件放在可视化对象旁边可能会提供更好的整体用户体验，同时节省屏幕顶部的空间。以下屏幕截图显示了将屏幕控件放置在透视表旁边：


  ![](img/33bad1d211a2d93fd743a1978d403f9a_123_1.png)


  图 5.11 – 放置在分析表上的屏幕控件


  现在我们已配置分析并安排了屏幕控件，可以将分析发布为仪表板并与读者用户共享。至此，我们已创建第一个真正交互式的 QuickSight 仪表板。接下来，我们将学习如何使用操作向仪表板添加更多交互式控件。


  ### 使用操作


  QuickSight 操作允许您向仪表板添加交互性。它们可以是以下任意一种：


  - **筛选器操作**

  - **导航操作**

  - **URL 操作**


  接下来，我们将更详细地了解每种操作类型。为了理解每种类型，我们将使用纽约出租车示例分析来配置它们。


  ### 使用筛选器操作


  URL 操作允许我们在用户单击仪表板特定区域时立即筛选数据。筛选器操作使读者更容易专注于分析的特定数据点。


  在配置筛选器操作时，您需要选择分析中的一个可视化对象，然后提供以下信息：


  - **操作名称**：筛选器操作的用户友好且具有描述性的名称。

  - **激活方式**：**菜单选项** 或 **选择**：**菜单选项** 会在您单击可视化对象中的数据点时添加一个菜单项。单击该选项时，将激活 URL 操作。另一方面，使用
  **选择** 选项时，您的 URL 操作将在单击数据点时直接激活。

  - **筛选器范围**：哪些可视化对象将被筛选。


  为了理解筛选器操作，我们将使用纽约出租车分析中的一个示例。假设我们希望用户立即关注特定行政区，并更新 KPI 和桑基图可视化对象以仅反映所选行政区。要选择行政区，我们将使用显示每个行政区平均小费的柱状图，我们在
  _第 4 章，开发可视化对象和仪表板_ 中配置了该图表：


  1. 首先，导航到分析，通过单击选择柱状图可视化对象。


  2. 接下来，在选中可视化对象的情况下，从左侧菜单中单击 **操作**。


  3. 单击 **添加操作**，然后从 **操作类型** 下拉菜单中选择 **筛选器操作**。


