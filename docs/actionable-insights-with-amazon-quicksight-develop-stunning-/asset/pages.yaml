    # ## Setting up an S3 data source


    A common data source for QuickSight is S3. For example, you might want to visualize
    CSV files that are stored in Amazon S3. Before you configure an S3 data source,
    you need to ensure your QuickSight account has the required permissions to access
    the S3 locations where the files are stored.


    > Note

    > QuickSight doesn''t automatically inherit access to newly created buckets. Even
    if you enable the **Access all buckets in my account** checkbox, QuickSight will
    only get access to every bucket in your account at that point in time, and not
    to any bucket you create from the point onward. If you need to add permissions
    to new buckets, you will need an AWS administrator to manage the permissions of
    the QuickSight service to AWS services in your account.


    For the S3 data source, QuickSight requires a manifest file containing the required
    information to set up the datasets. The manifest file is in JSON format and contains
    the following objects:


    +   - **fileLocations**: Here you will define the S3 location of the file (or
    files) you need to import by just appending the full S3 URI of your files (as
    a JSON array) using the `URIs` property. You can populate the `URIPrefixes` property,
    if you want to add all of the files that are under a specific S3 prefix (similar
    to a folder in a traditional filesystem).'
  merge: -1
  img_proc: true
- pgno: 68
  md: '+   - `globalUploadSettings`: The `globalUploadSettings` is optional. You can
    use this property to override the QuickSight default options. QuickSight will
    default to **CSV format**, using a "," **(comma)** field delimiter and **double
    quotes** (") as the text qualifier. By default, QuickSight will use the first
    row of the CSV file as the **header**, which implies that the first row will determine
    the dataset field names, and won''t be considered as values in the dataset.


    Now that we have learned how to configure certain datasets types, in the next
    section we will edit datasets using the QuickSight dataset editor.


    # # Editing datasets


    In this section, we will look more closely at the typical tasks an author user
    needs to do to edit a dataset. In real-world applications, it is common that datasets
    might need some degree of processing so that they can be used optimally by QuickSight.


    These tasks include the following:


    +   - Importing into SPICE

    +   - Renaming fields

    +   - Changing the field types

    +   - Adding calculated fields

    +   - Combining datasets together

    +   - Applying security filters


    In the next section, we will learn how to complete these tasks using the example
    dataset we configured earlier.


    # # Importing into SPICE


    It''s time for us to learn how to import a dataset into SPICE. We will change
    the query mode using the dataset editor and then we will observe the status of
    the import job. Finally, we will learn how to schedule automatic refresh jobs
    for our SPICE datasets.'
  merge: -1
  img_proc: true
