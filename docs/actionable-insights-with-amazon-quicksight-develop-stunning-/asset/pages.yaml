    # # Changing data types


    By using the right data type for every column, we can make sure to access the
    right functionality for each column in our datasets. For example, QuickSight supports
    time aggregation for date column types. If a date column is incorrectly mapped
    as a string column, then those aggregations cannot be used. Similarly, calculations
    such as calculating the average or min/max applies only to numerical data types.
    If we need to perform and visualize these calculations, we will need to ensure
    that a numerical data type has been applied.


    QuickSight supports the following data types:


    +   - String

    +   - Date

    +   - Decimal

    +   - Integer


