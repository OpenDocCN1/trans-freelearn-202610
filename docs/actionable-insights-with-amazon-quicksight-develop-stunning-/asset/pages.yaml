    Next, we will learn how to configure navigation actions.


    # # Working with navigation actions


    As you are adding visuals to analysis, it can reach a point when there might be
    too many visuals for a single page. In these scenarios, you can organize visuals
    into sheets. For each sheet, you can provide a user-friendly name to help your
    BI users navigate the dashboard. For each sheet, you can provide the following
    details:


    +   - Title


    +   - Description'
