- pgno: 141
  md: 'Next, we will add the two date parameters. You can access the **Parameters**
    menu on the right-hand side of the screen and simply add the two parameters.


    Note, the expression will look like `${DateStart}`. Observe **Preview**, which
    is located below the editor. You might notice that the time is displayed in the
    epoch format, which is not what the end user would expect. For that reason, we
    will need to covert the date into a format that is understandable by the end user.
    To change the format, we will use the `formatDate` function. You can locate the
    function by expanding the **Functions** menu on the right-hand side menu and selecting
    `formatDate`. The function expects two arguments:


    +   • The date column

    +   • The format expressed as a string


    In our example, we will use the `dd MMM yyyy` format, and therefore, the function
    will be `formatDate(${DateStart},''dd MMM yyyy'')` for the start date and `formatDate(${DateEnd},''dd
    MMM yyyy'')` for the end date.


    Now that we have added the start and end date, the text will be as follows:


    The total distance traveled in New York over the period between `formatDate(${DateStart},''dd
    MMM yyyy'')` and `formatDate(${DateEnd},''dd MMM yyyy'')` is `TotalAggregate.totalAggregate.formattedValue`
    miles.


    Finally, use the editor to edit the text format. For example, we can change the
    color of the number of miles and make the start and end date text bold for emphasis.
    After applying these changes, click **Save**. The narrative will look like the
    following:


    ![](img/33bad1d211a2d93fd743a1978d403f9a_141_0.png)


    Figure 6.9 – Insight with a customized narrative


    Narratives can be really useful to describe important insights from the data using
    natural language. With the QuickSight editor, we have full control over how the
    text is displayed to the end user. Now that we have learned how to work with and
    customize insights, in the next section, we will learn how to use ML-driven insights.'
  merge: -1
