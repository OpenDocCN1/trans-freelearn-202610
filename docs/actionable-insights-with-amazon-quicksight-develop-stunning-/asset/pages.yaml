- pgno: 114
  md: "# # Using filters and parameters\n\nUsers can interact with dashboards by clicking\
    \ on specific areas of the application or\nhovering over a visual to get additional\
    \ information on specific data points. As a BI\ndeveloper, you might come across\
    \ scenarios where you will need to add additional\ninteractivity to your dashboards,\
    \ allowing your users to filter datasets or implement specific\nactions. In this\
    \ section, we will learn how to leverage those specific QuickSight features to\n\
    add interactivity to our dashboards. We will provide hands-on examples while using\
    \ the\nNew York dataset and dashboard we developed earlier in Chapter 4, Developing\
    \ Visuals and\nDashboards. But first, we will need to understand how to use QuickSight\
    \ filters.\n\n# # Working with filters\n\nQuickSight authors can filter datasets.\
    \ For example, you can use filtering when you need\nto refine a dataset before\
    \ you visualize it. You can control the scope of the QuickSight\nfilters so that\
    \ they can be applied to the visuals you want. Filtering, when applied to a\n\
    QuickSight analysis, is transparent from the reader’s perspective. You can apply\
    \ additional\nsettings when sharing a dashboard with your readers if you need\
    \ to allow your readers to\nfilter data. Let’s look at an example to understand\
    \ how to add and apply filters. For our\nexample, let’s assume that we have detected\
    \ null values and that we want to remove them\nfrom certain visuals:\n\n+   1.\
    \ First, we will need to open our New York Taxi analysis.\n+   \n+   2. We will\
    \ use the pivot table we created earlier. When we open the Borough category,\n\
    +   we can observe the null value as the payment type. null values can be useful\
    \ as\n+   they can help us detect issues with our data. For this example, let’s\
    \ assume we don’t\n+   want to visualize the null values in the pivot table while\
    \ keeping the rest of the\n+   visuals unaffected:\n\n| Pick Up Borough | Payment\
    \ Type | Fare Amount   |\n|-----------------|--------------|---------------|\n\
    | Bronx           | null         | $969,806.58   |\n|                 | Cash \
    \        | $50,961.67    |\n|                 | Credit Card  | $100,715.51   |\n\
    |                 | Dispute      | -$334.70      |\n|                 | No Charge\
    \    | $1,036.51     |\n|                 | Subtotal     | $1,122,185.57 |\n|\
    \ Brooklyn        |              | $2,172,314.53 |\n\nFigure 5.1 – Pivot table\
    \ with null values"
  merge: -1
  img_proc: true
- pgno: 115
  md: '# 3. Select the pivot table by clicking on the visual. Then, select the filter
