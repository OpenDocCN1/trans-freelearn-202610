- pgno: 227
  md: '![](img/33bad1d211a2d93fd743a1978d403f9a_227_0.png)


    Figure 10-5 – Viewing common assets in a multi-tenant environment


    In a similar way to dashboards, other assets (such as datasets or analyses) can
    be shared using the QuickSight API.


    # ## Summary


    Congratulations on completing this chapter, which is the final chapter of this
    book.


    In this chapter, we learned about multitenancy in Amazon QuickSight. We also looked
    closely at an example architecture that allows multiple tenants to access embedded
    assets in QuickSight through a web portal. Then, we focused on QuickSight namespaces,
    and we learned how to configure them. Finally, we looked at two hands-on examples
    to understand how namespaces prevent users from sharing assets, and how an Admin
    user can configure common assets for users in different namespaces.


    You should now understand the fundamental concepts of multitenancy in Amazon QuickSight,
    and you should know how to use the AWS CLI to create namespaces and organize your
    different tenants.


    Before you close this book, please ensure that all AWS resources created for this
    book and its exercises are shut down to prevent charges to your AWS account.


    I want to thank you for your time, and I hope this book met your expectations.
    For any comments and further questions, you can find me on LinkedIn. Feel free
    to connect with me, I would love to hear your thoughts and feedback. Happy learning!'
  merge: -1
  img_proc: true
