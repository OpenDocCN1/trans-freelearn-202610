    \ by only using the SPICE capacity  \nthat’s really required. Adding a filter\
    \ in QuickSight is simple. In the following example, we  \nwill see an example\
    \ of how to filter out columns and rows from the dataset we created earlier:\n\
    \n+   1. First, you will need to access the dataset editor. On the left-hand side,\
