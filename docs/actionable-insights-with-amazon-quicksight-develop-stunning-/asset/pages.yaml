- pgno: 161
  md: "Note the `User Arn` property as we will use it later in _Step 4_.\n\n3. Next,\
    \ we will need to retrieve our dashboard ID. We will use the `list-dashboards`\
    \ CLI command to do. Type in the following command. Replace `<aws account id>`\
    \ with the 12-digit long ID from your AWS account. Ensure your dashboard is shared\
    \ with the admin user so that the following command returns the expected results:\n\
    \n```\n`$aws quicksight list-dashboards --aws-account-id <aws account id> --region\
    \ us-east-1`\n```\n\nSo far, we have only created one dashboard, so the response\
    \ should look as follows:\n\n```\n```\n{\n    \"DashboardSummaryList\": [\n  \
    \      {\n            \"Arn\": \"arn:aws:QuickSight:us-east-1:<aws account id>:dashboard/<dashboard\
    \ id>\",\n            \"DashboardId\": \"<dashboard id>\",\n            \"Name\"\
    : \"New York Taxi Dashboard\",\n            \"CreatedTime\": \"2021-06-02T19:19:00.285000+00:00\"\
    ,\n            \"LastUpdatedTime\": \"2021-07-06T22:55:04.960000+00:00\",\n  \
    \          \"PublishedVersionNumber\": 14,\n            \"LastPublishedTime\"\
    : \"2021-06-02T19:19:00.285000+00:00\"\n        }\n    ],\n    \"Status\": 200,\n\
    \    \"RequestId\": \"\"\n}\n```\n```\n\nNote the dashboard ID as we will use\
    \ it in the next step.\n\n4. Next, we will use the `get-dashboard-embed-url` CLI\
    \ command to generate the embedding URL. Type the following command. Replace the\
    \ AWS account ID with your 12-digit long account ID, along with the dashboard\
