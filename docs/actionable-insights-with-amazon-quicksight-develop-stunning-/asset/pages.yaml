    \ From the drop-down\n+   menu, click **Add control**, as shown here:\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_120_0.png)\n\
    \nFigure 5.7 – Adding on-screen controls\n\n+   3. From the control’s creation\
