    ![](img/33bad1d211a2d93fd743a1978d403f9a_80_0.png)


    Figure 3.18 – Join configurations


    +   5. Once applied, you can confirm the new columns in the dataset editor.


    Now that we have learned how to join datasets, we will learn how to add security
    controls

    to our datasets.'
