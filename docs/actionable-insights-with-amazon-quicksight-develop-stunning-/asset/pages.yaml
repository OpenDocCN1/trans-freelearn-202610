  md: '# ## 5. Now, the insight should appear as follows:


    ![](img/33bad1d211a2d93fd743a1978d403f9a_139_0.png)


    Figure 6.7 – Total aggregation insight


    Now, we have managed to add the insight into our analysis. We now need to edit
    it so that it matches the narrative we were aiming for. In the next section, we
    will learn how to edit an insight.


    # ## Editing an insight


    When adding elements to your narrative, you can automatically add the following:


    +   - **Computations**: Predefined calculations

    +   - **Parameters**: Variables that you can set in your analysis

    +   - **Functions**: Used to change a field into the desired format


    To better understand how to use these terms, we will edit our example narrative:


    +   1. First, let''s add two new parameters, `DateStart` and `DateEnd`, as we
