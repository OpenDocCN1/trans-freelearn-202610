  md: '+   5. Click **Finish.**

    +   6. To verify access, you can create a new Athena dataset (as we learned in
    _Chapter 2, Introduction to Amazon QuickSight_).


    While this is straightforward to set up, it gives all users the same level of
    access to Athena and S3. It is very common for organizations to have different
    requirements when it comes to permissions to data for different users and groups.
    For that reason, QuickSight offers you the ability to define fine-grained access
    controls. This feature can be accessed via the **Resource access for individual
    users and groups** menu under the **Security and Permissions** settings. This
    will allow you to assign specific IAM policies to specific QuickSight users or
    groups, allowing you to define more detailed permissions to your QuickSight environment.


    Now that we have learned how to create Athena datasets without Lake Formation,
    in the next section, we will understand how to configure datasets that are managed
    by Lake Formation.


    # ## Configuring Amazon Athena datasets with Amazon Lake Formation


    Lake Formation provides an additional permission layer over your Athena datasets.
    Instead of granting permissions using IAM, you register your S3 storage in Lake
    Formation, and then you can use the Lake Formation Console or the Lake Formation
    API to grant or revoke permissions to the tables in your data catalog. Lake Formation
    supports column-based access policies, row-based filtering, and tag-based access
    controls, which allow you to define advanced and fine-grained access controls
    for your dataset.


    Instead of defining IAM policies and defining assignments to your users or groups,
    you can use Lake Formation to manage your permissions centrally. In Lake Formation,
    you manage permissions with a grant/revoke syntax (which will be familiar to **business
    intelligence** (BI) developers), rather than defining JSON documents for IAM.
    When working with QuickSight principals, you will need to use the QuickSight user
    or group `arn` as the Lake Formation principal, as shown in the following figure:'
