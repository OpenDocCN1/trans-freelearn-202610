- pgno: 113
  md: '# # 5 Building Interactive Dashboards


    In this chapter, we will learn how to develop interactive dashboards with Amazon
    QuickSight. You will learn how to add custom controls to your dashboards and add
    interactivity to your BI application using parameters. We will also look at advanced
    filtering options with point and click actions, as well as URL actions.


    In this chapter, we will cover the following topics:


    +   - Using filters and parameters

    +   - Working with QuickSight Actions


    # ## Technical requirements


    For this chapter, you will need the following:


    +   - An AWS account

    +   - A QuickSight account with the Author and Reader users configured

    +   - The dashboard we created in _Chapter 4, Developing Visuals and Dashboards_'
