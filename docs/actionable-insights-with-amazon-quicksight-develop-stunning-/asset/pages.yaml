    # ## Visualizing the flow between the source and a destination


    There are scenarios where you might want to visualize a metric while considering
    a source and a destination. The **Sankey** visual type can be a great fit when
    we need to visualize a metric that flows between a source and a destination. The
    Sankey diagram depicts the flow from the source to a destination as a line. The
    width of the line depends on the value of the metric. For example, in our dataset,
    we capture the taxi pick-up and drop-off locations. We can enrich the location
    ID using a lookup table and get the pick-up borough and drop-off borough. Now,
    let’s assume that we want to visualize the total miles traveled between the New
    York boroughs. Using the Sankey visual type, we will need to set **Pick Up Borough**
    as the **Source** field, **Drop off Borough** as the **Destination** field, and
    **trip_distance** as the **Weigh** field.


    The following screenshot shows an example Sankey visual using our example dataset:


    ![](img/33bad1d211a2d93fd743a1978d403f9a_99_0.png)


