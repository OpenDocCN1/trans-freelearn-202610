- pgno: 225
  md: '6. Next, we want to ensure that this user cannot share their dashboards, analyses,

    or datasets with users from other namespaces. The easiest way to check this is
    to

    quickly create a new dataset, analysis, or dashboard and try sharing it with other

    users. Once the asset is created, open its permissions manager and try to invite
    a

    Author or Reader user who belongs to a different namespace:


    # Manage dataset permissions


    You can manage the settings and permissions for users, analyses, and dashboards
    that access this dataset.


    ![](img/33bad1d211a2d93fd743a1978d403f9a_225_0.png)


    Shared with 1 user


    | Name | Permission | Actions |

    |---|---|---|

    | author-a | Owner | |

    | Close | | Invite users |


    Figure 10.4 – Sharing assets in multi-tenant environments


    When sharing assets, QuickSight autocompletes when it finds relevant users. You
    will

    notice that as you type `author`, there is no suggestion from QuickSight, and
    the dataset

    cannot be shared. The reason for this is that the Author user belongs to a different

    namespace to the `author-a` user.


    Now that we have seen how namespaces prevent users from sharing assets with other

    users, we will see how it is possible to configure common assets between users
    in different

    namespaces.


    # Sharing common assets


    It is possible to have use cases where assets need to be visible to users that
    inhabit different

    namespaces. For example, a large corporation might want to share a specific dashboard

    with users that belong to different departments, which are configured as namespaces.

    To complete this action, we will need to use the QuickSight API. As we learned
    in the

    previous section, completing this via the QuickSight console is not possible,
    as users from

    one namespace cannot discover users from another namespace.'
  merge: -1
  img_proc: true
- pgno: 226
  md: "To better understand this concept, we will use the New York Taxi dashboard\n\
    configured in Chapter 4, Developing Visuals and Dashboards. For this tutorial,\
    \ we will use\nthe QuickSight Admin user and the AWS CLI:\n\n+   1. First, open\
    \ a terminal with the AWS CLI installed.\n\n+   2. List the dashboards using the\
    \ list-dashboard action. Type the following\n+   command, replacing the highlighted\
    \ values with those from your environment:\n\n```\n$aws quicksight list-dashboards\
    \ --aws-account\n<aws-account-id>\n```\n\nFocus on the DashboardSummaryList array,\
    \ and capture the DashboardId\nvalue, as we will use it in the next step:\n\n\
    ```\n\"DashboardSummaryList\": [\n    {\n        \"Arn\": \"arn:aws:quicksight:us-east-\n\
    1:xxxxxxxxxx:dashboard/xxxx-xxxx-xxxx-xxxx-xxxxxx\",\n        \"DashboardId\"\
    : \"xxxx-xxxx-xxxx-xxxx-xxxx\",\n        \"Name\": \"New York Taxi Dashboard\"\
    ,\n        ...\n    }\n```\n\n+   3. To update the dashboard permissions, we will\
    \ use the update-dashboard-\n+   permissions CLI command. Type the following command,\
    \ replacing the\n+   highlighted values with those from your environment:\n\n\
    ```\n$aws quicksight update-dashboard-permissions --aws-ac\ncount-id <aws-account-id>\
    \ --dashboard-id <dashboard-id>\n--grant-permissions Actions=quicksight:DescribeDash-\n\
    board,quicksight:ListDashboardVersions,quicksight :Update-\nDashboardPermissions,quicksight:QueryDashboard,quick-\n\
    sight:UpdateDashboard,quicksight:DeleteDashboard,\nquicksight:DescribeDashboardPermissions,quicksight:UpdateDash-\n\
    boardPublishedVersion, Principal=arn:aws:quicksight:us-\neast-1:<aws-account-id>:user/companyA/author-a\n\
    ```\n\nNow that we have provided access to our author-a user, we will log in to\
    \ the\nQuickSight console and view the available dashboards.\n\n+   4. Log into\
    \ the QuickSight console as the author-a user. Then, navigate to\n+   Dashboards\
