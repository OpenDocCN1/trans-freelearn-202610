- pgno: 86
  md: '# # Technical requirements


    For this chapter, you will need the following:


    +   - An AWS account


    +   - A QuickSight account with the author and reader users configured


    +   - The datasets we created in _Chapter 3, Preparing Data with Amazon QuickSight_


    # # Working with QuickSight visuals


    Visuals are defined as the on-screen widgets that you can add to your QuickSight
    analysis to visualize your data. Selecting the right visual type is important
    for the success of your BI application. In this section, we will learn about the
    supported visual types and how to select the most appropriate visual type for
    different scenarios.


    # # Creating an analysis


    Before we look at the available visual types, we need to create our first analysis.
    QuickSight analysis is the main user interface for developing your BI applications.
    While working on an analysis, you will be able to add data visualization widgets,
    configure ML capabilities, and configure the look and feel of your BI application.


    To create an analysis, perform the following steps:


    +   1. First, log into QuickSight as an author user.


    +   2. Next, select **Analyses** from the left-hand side menu and select **New
    analysis**, as shown in the following screenshot:


    ![](img/33bad1d211a2d93fd743a1978d403f9a_86_0.png)


    Figure 4.1 – Analyses menu'
  merge: -1
  img_proc: true
- pgno: 87
  md: '# ## 3. You will then need to select a dataset to start your analysis. Choose
    the yellowtrips_3mo dataset we configured earlier and select **Create Analysis**.


    # ## 4. This will take you to the main analysis user interface, as shown in the
    following screenshot:


    ![](img/33bad1d211a2d93fd743a1978d403f9a_87_0.png)


    Figure 4.2 – Analysis user interface


    This is the main user interface that we will be using throughout this book to
    develop our BI application.


    > > **Note**

    > > Familiarize yourself with the analysis user interface, including the main
    screen, the top menu, the side menu, the field wells, the dataset, the column
    list, and the visual types selection tool as we will be using them throughout
    this book.


    Next, we will focus on the different visual types by looking at examples using
    our example datasets.'
  merge: -1
  img_proc: true
- pgno: 88
  md: '# # Supported visual types


    QuickSight supports several visual types that you can choose to visualize your
    data with. AWS is constantly expanding this list. In the next few sections, we
    will explore those types by focusing on the business question and how the visuals
    can help you address them.


    # ## Visualizing a metric or a key performance indicator


    There are scenarios where you might want to visualize a **key performance indicator**
    (KPI). Visualizing the progress of a metric against a target metric or comparing
    the monthly sales of the current month with the sales of the last month are examples
    of KPIs that organizations often need to monitor. The two visual types that are
    ideal for these types of visualizations are as follows:


    +   - KPI visual type

    +   - Gauge chart


    Let’s look closer at each of these visual types using the dataset we created in
    _Chapter 3, Preparing Data with Amazon QuickSight_.


    # ### The KPI visual type


    The KPI **visual type** allows you to display metrics, including comparisons against
    time intervals or a trend. To select the KPI visual type, you simply need to select
    the ![](Aspose.Words.04d2b017-2c05-4e5a-8a24-02e0e0b6c449.001.png) icon. Then,
    you can start parameterizing your KPI visual, as shown in the following screenshot:


    ![](img/33bad1d211a2d93fd743a1978d403f9a_88_1.png)


    Figure 4.3 – The KPI visual fields'
  merge: -1
  img_proc: true
- pgno: 89
  md: 'The KPI visual allows us to set up three types of fields:


    +   - **Value**: This field represents the value we want to measure.


    +   - **Target value**: This field represents the target metric we want to compare
    the value field against.


    +   - **Trend group**: There are scenarios where you will need to visualize how
    a metric is trending; for example, a trend over time. The trend group field can
    be used for this purpose.


    > Note

    > You can use either a target value or a trend group with the KPI visual, but
    not both.


    To understand the KPI visual, we will look at an example of using the New York
    Taxi dataset we imported into QuickSight earlier in this book. For this example,
    let’s assume we want to visualize how the tips are performing compared to the
    overall fare. A tip value below 10% of the total might indicate that people aren’t
    very generous with their tips. Let’s see what the data tells us!


    For this KPI visual, we will use `tip_amount` as the value field and `total_amount`
    as the target. To add these fields, simply drag and drop each field to the corresponding
    column, as shown here. Once you’ve added these fields, the visual should look
    as follows:


    ![](img/33bad1d211a2d93fd743a1978d403f9a_89_0.png)


    Figure 4.4 – Tips KPI visual'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'Now that we have our first KPI visual, we will configure some of its parameters.
    Each field that''s in a field can be configured individually by selecting the
    respective drop-down menu, as follows:


    ![](img/33bad1d211a2d93fd743a1978d403f9a_90_0.png)


    Figure 4.5 – Field options


    From this menu, we can choose how the field is aggregated and how it is formatted.
    For aggregation, we have the following options:


    +   - Sum (default).

    +   - Average.

    +   - Count.

    +   - Count distinct.

    +   - Max.

    +   - Median.

    +   - Min.

    +   - Percentile: When percentile is selected, you will also need to select the
    percentile value; for example, 95 to calculate P95.

    +   - Standard deviation.

    +   - Standard deviation: Population.

    +   - Variance.

    +   - Variance: Population.


    For our example, we can keep the default setting, which is the **Sum** aggregation,
    as it shows us the total amount of tips and fares. Next, let''s look at the format.
    The available options are as follows:


    +   - **Number**

    +   - **Currency**

    +   - **Percentage**'
  merge: -1
  img_proc: true
- pgno: 91
  md: 'The **Currency** format type fits better for our field. Once the type has been
    selected, you will be able to edit the format in detail by selecting the **More
    formatting options** menu. Finally, we can format the entire visual by selecting
    the cog icon next to our visual. This will open up a menu where we can edit the
    comparison format (for example, the percentage of actual values), change the font
    size, and change the title. Let''s set the title to **New York Taxi Tips Percentage**
    and set the subtitle to **10% Target**. Now, the visual should look as follows:


    ![](img/33bad1d211a2d93fd743a1978d403f9a_91_0.png)


    Figure 4.6 – New York Taxi Tips Percentage KPI


    Now that we have seen how to configure the KPI visual type, we will learn how
    to configure the gauge chart visual.


    # ## The gauge chart


    The gauge chart is a useful way to compare a value with the target value. Gauge
    charts help us visualize the progress against a target.


    > > **Note**

    > >

    > > A similar visualization to the gauge chart can be achieved with the progress
    bar on the KPI visual.'
  merge: -1
  img_proc: true
- pgno: 92
  md: 'To understand the gauge chart, we can use our New York Taxi dataset. For this
    example, let’s assume that our target for these 3 months is to have 6.5 million
    passengers and we want to compare the actual numbers against this target. A quick
    way to add this target value is to simply create a calculated field and assign
    it with the value 6,500,000. This value will be added to every row of our dataset,
    increasing the total SPICE space required. Then, we can use `passenger_count (sum)`
    as the **Value** field of the gauge chart and the newly created calculated field
    (aggregated as the average) as the **Target** field. Similar to the KPI chart
    that we saw earlier, we will be able to access additional settings for this visual,
    such as setting a title, controlling the values that are displayed, the thickness
    of the fonts, the data labels, and the tooltip. Feel free to get familiar with
    the settings of this visual. With the default settings (and only increased font
    size) the gauge visual will look as follows:


    ![](img/33bad1d211a2d93fd743a1978d403f9a_92_0.png)


    Figure 4.7 – The gauge chart


    Now that we have learned how to visualize KPIs, we can focus on other visual types.
    Next, we will look at using visual types to help us visualize the composition
    of a selected attribute in our dataset.


    # ## Visualizing the composition of an attribute


    Visualizing the composition of one or more of your dataset dimensions can be a
    common question you want to answer with your BI application. For example, you
    might want to see how much each region contributes to the total sales. In our
    example, we can visualize how much each taxi zone contributes to the total taxi
    fares collected. These types of questions can be visualized with the following
    types of charts:


    +   - Pie charts


    +   - Donut charts'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'When setting up both visuals, you will need to specify a group/color field
    and the value field.


    > Note

    > If you don’t specify a value field, QuickSight will default to the count of
    records.


    Using our example dataset, we will use a donut chart to visualize the records
    by service zone. Similarly, we will use a pie chart to visualize the count of
    records by borough. For this purpose, we can set the service_zone field and then
    the Borough field as a group/color for the donut chart and the pie chart, respectively.
    As a result, the two visuals will look as follows:


    ![](img/33bad1d211a2d93fd743a1978d403f9a_93_0.png)


    Figure 4.8 – The donut and pie charts


    Both visual types can help you visualize the composition of an attribute, and
    they work particularly well when you have a small number of categories. Both visual
    types are not very effective when you want to do side-by-side comparisons. Next,
    we will look at visual types that can help you visualize such side-by-side comparisons.


    # Visualizing side-by-side comparisons


    QuickSight allows you to visualize side-by-side comparisons by offering several
    bar chart options. Horizontal, vertical, or stacked bar charts are some examples
    of this type of visual. To understand these visuals, we will use our dataset and
    configure a bar chart. Let’s assume we want to understand and compare the tip
    percentage for each of the New York boroughs:


    +   1. First, we need a calculated field and must assign the {tip_amount}/{fare_amount}
    value to Tip Percentage.


    +   2. Next, we will need to add our visual. A bar chart would be an ideal solution
    to compare the tip percentage for each borough.'
  merge: -1
  img_proc: true
- pgno: 94
  md: 'A bar chart, either vertical or horizontal, will need the following fields
    to be configured:


    +   • **X axis**

    +   • **Value**

    +   • (Optionally) **Group/color**


    The x axis is the primary dimension that you want to understand for your value.
    In our example, this will be the Borough field. For the value field, you will
    need to set the value you want to understand and compare. In our example, this
    will be the newly created Tip Percentage calculated field, aggregated as the average.
    Finally, you can add a Group/ Color field, if you need to add another dimension
    to your visual.


    > > **Note**

    > > A bar chart needs at least an x-axis and a value field. The group/color field
    is optional. You can set more than one value field if you need to monitor multiple
    values in the same visual.


    Once we’ve applied these fields, this is what the vertical bar chart will look
    like:


    ![](img/33bad1d211a2d93fd743a1978d403f9a_94_0.png)


    Figure 4.9 – Vertical bar chart


    Now that we have learned how to use a simple bar chart, in the next section, we
    will learn how to visualize time series.'
  merge: -1
  img_proc: true
- pgno: 95
  md: '# # Visualizing time series


    It is common for BI applications to visualize how a metric is changing over time.
    Time series data is usually represented with line charts. Time series visualizations
    need to ensure that temporal fields are stored as the `Date` field type in QuickSight.
    This will enable time-based aggregations; for example, day, week, month, quarter,
    or year.


    In this section, we will use a simple line chart to create our first time series
    visualization. Let’s assume that we want to visualize the total amount of taxi
    fares over time so that we can observe how the fare amount is distributed over
    time.


    A line chart requires you to define the following:


    +   - **X axis**: In time series, this will be our temporal field.


    +   - **Value**: The value you want to measure over time.


    +   - Optionally, the **Color** field: When you want to visualize multiple categories,
    you can use the `Color` field. This will result in multiple lines on the same
    line chart.


    For our example, you will need to pick `tpep_dropoff_datetime` as the x-axis and
    `total_amount (Sum)` as the value. This dataset is only for 3 months; therefore,
    a daily aggregate is likely to have enough data points for a meaningful data visualization.
    You will need to ensure that the daily aggregation is chosen. To do that, select
    the x-axis column and expand the drop-down menu, as shown in the following screenshot:


    ![](img/33bad1d211a2d93fd743a1978d403f9a_95_0.png)


    Figure 4.10 – Time-based aggregations'
  merge: -1
  img_proc: true
- pgno: 96
  md: 'The following screenshot shows a line chart of the total fare amount aggregated
    daily for

    the period from September to December:


    # Sum of the total amount by time


    ![](img/33bad1d211a2d93fd743a1978d403f9a_96_0.png)


    Figure 4.11 – The line chart


    Now that we have learned how to set up line charts, we will learn how to use table
    visuals.


    # Using tables


    Tables can be useful when we want to display the values of specific metrics, without
    using

    other visual means. Table visuals can be used to display raw data, which can be
    useful for

    users familiar with the data being used to populate a BI application. QuickSight
    supports

    the following:


    +   - Table visual for simple table visualizations


    +   - Pivot table visual for tables that need to summarize data in multiple dimensions


    For the simple table visual, you will need to define the value and the group by
    fields

    in the field well. The group by field is used to aggregate your data, while the
    value field

    contains the metrics that will be added to the table, broken down by the group
    by fields.

    You can add one or more value fields if you are interested in more than one metric.
    You

    can use one or more group by fields; however, a pivot table might be a better
    fit if you

    need to break down the data using more than one dimension.


    To understand the use of tables, let''s use our example dataset. For this example,
    let''s

    assume that we want to visualize a table with the total fare amount broken down
    by

    borough. For this visual, we will use the Borough column as the group by field
    and

    fare_amount (sum) as the value field.'
  merge: -1
  img_proc: true
