    \ _Step 1_:\n\n```\n`%aws quicksight get-dashboard-embed-url --aws-account-id\
    \ <aws account id> --dashboard-id <dashboard id> --identity-type QUICKSIGHT --user-arn\
    \ <user arn> --region us-east-1`\n```"
