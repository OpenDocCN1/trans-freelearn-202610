    01 October 2020 for the `DateStart` parameter and 31 December 2020 for the `DateEnd`
    parameter.

    +   2. Connect these parameters to a filter, and use the **Pick Date** field to
    control the parameter value. Make sure that the filter scope includes the insight
    visual.

    +   3. Now that we have the two parameters set up, we will edit the narrative.'
  merge: -1
  img_proc: true
