  md: "# # Configuring our first data source\n\nIn this section, we will configure\
    \ our first two data sources, connecting the architecture we\nbuilt in _Chapter\
    \ 1, Introducing the AWS Analytics Ecosystem_.\n\nBefore we set up the data source\
    \ in QuickSight, we will need to ensure that QuickSight\nservice has a network\
    \ route to our Redshift cluster. Since we are using the default settings,\nour\
    \ cluster is locked down by default. We can confirm this by opening its security\
    \ group.\nA security group acts as a virtual firewall to control the inbound and\
    \ outbound traffic. The\ndefault security group will not allow any inbound or\
    \ outbound traffic, unless it is coming\nfrom itself (a **self-referencing security\
    \ group**). Therefore, without any action, Amazon\nQuickSight won't have access\
    \ to the Redshift cluster. To allow QuickSight to access our\nRedshift cluster\
    \ we will need to edit the security group of the Redshift cluster and allow\n\
    inbound traffic from the IP address range of Amazon QuickSight.\n\nIn the next\
    \ section, we will provide a step-by-step guide for enabling QuickSight access\
    \ to\nour Redshift cluster.\n\n# # Enabling access to the Redshift cluster\n\n\
    Let's start:\n\n+   1. First, let's get the security group of our Redshift cluster:\n\
    +   \n+   ```\n+   aws redshift describe-clusters --cluster-identifier\n+   mycluster\
    \ --region us-east-1\n+   ```\n\nThe AWS CLI response will contain a lot of information\
    \ about the cluster. The\nsecurity group ID can be found under the _VpcSecurityGroups_\
    \ key of the API\nresponse:\n\n```\n```\n\"VpcSecurityGroups\": [\n    {\n   \
    \     \"Status\": \"active\",\n        \"VpcSecurityGroupId\": \"sg-xxxxxxx\"\n\
    \    }\n]\n```\n```\n\nAlternatively, we can easily find this information from\
    \ the Redshift console.\nNavigate to the Redshift console, select your Redshift\
    \ cluster (**mycluster**) and then\nselect the **Properties** tab. The security\
    \ information is under **Network and security**\n**settings**, so expand this\
    \ option."
  merge: -1
  img_proc: true
