- pgno: 100
  md: 'Now that we have learned how to work with most of the visual types that are
    available, in

    the next section, we will learn how to publish our analysis so that it can be
    shared with

    other users.


    # # Publishing dashboards


    In this section, we will learn how to publish a dashboard and share it with other
    reader users.

    A dashboard is the read-only version of an analysis that can be consumed by reader
    users. A

    dashboard is not a point-in-time snapshot of the analysis. When a user accesses
    a dashboard,

    QuickSight will fetch the data to populate the dashboard visuals. Depending on
    how you

    configured your data source, data is fetched either using a direct query or using
    SPICE.

    When you use SPICE data sources, QuickSight will scale automatically for the number
    of

    users you have. When you query your data source directly, you need to ensure that
    the data

    source (for example, a data warehouse) has enough resources to support the workload.


