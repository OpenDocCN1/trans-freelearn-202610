- pgno: 81
  md: '# # Configuring security controls


    QuickSight supports row-level and column-level security controls. In this section,
    we will learn how to add security controls to our datasets.


    # ## Adding column-level security controls


    In certain cases, BI developers might want to restrict access to specific columns
    to protect sensitive data (such as personally identifiable data). Once a BI developer
    adds column-level security, only the allowed users will be able to view and access
    the restricted column. By default, when you share a dataset with another user,
    you give them access to all columns of this dataset. Therefore, you will need
    to add column-level security controls if you need to restrict certain columns.
    To add column-level security, you can select the **Column-level security** option.


    ![](img/33bad1d211a2d93fd743a1978d403f9a_81_0.png)


    > > Figure 3.19 – Column-level security'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'You will then see the list of columns in your dataset. You will notice that
    by default, users and groups with access to the dataset have access to all columns.
    To restrict a column, you will need to select it and then add the users or groups
    you want to enable access for. This selection will override the "everyone" default
    setting and only the users or groups you add will have access. Once completed,
    you will notice a padlock icon next to your dataset to confirm that security restrictions
    are present.


    # ## Adding row-level security


    QuickSight supports row-level security for your datasets. Row filters are particularly
    useful when you want certain users or groups to have different levels of access
    to a subset of data depending on their username or group membership. To apply
    row-level security you will need to provide a permissions file or create a permissions
    table in your database and then add it to QuickSight. In our example, the `vendorid`
    column has two distinct values, `2` and `1`, each representing a different vendor.
    Let’s imagine a scenario where users from vendor `1` need to have access to the
    dataset, but they should only be able to access the vendor `1` data and not data
    from vendor `2`. Likewise, vendor `2` should only be allowed to view their data.
    For this example, we can apply row-based security controls.


    # ## Applying a row-level filter


    For our example, we can consider two different users, `user1` for vendor `1` and
    `user2` for vendor `2`. QuickSight will match the username accessing the dataset
    with the value of the `UserName` field and then apply the filter or filters using
    the remaining column. In our example, it will use the `vendorid` column from the
    `yellowtrips_3mo` dataset.


    See our following mapping table for the scenario described previously:


    | UserName | vendorid |

    |---|---|

    | user1 | 1 |

    | user2 | 2 |


    Figure 3.20 – Mapping table'
  merge: -1
  img_proc: true
- pgno: 83
  md: '# # Configuring security controls 65


    To apply row-based permissions, we need to do the following:


    +   1. We save the mapping table as a `.csv` file and then import it as a new
    dataset. The format of the file will be as follows:

    +   ```

    +   UserName,vendorid

    +   user1,"1"

    +   user2,"2"

    +   <your-admin-user>,""

    +   ```


    +   2. Edit the newly created dataset, and ensure that `vendorid` field is of
    type **String**.


    +   3. Then, select the **yellowtrips_3mo** dataset and select **Row-level security**,
    as shown in the following screenshot:


    ![](img/33bad1d211a2d93fd743a1978d403f9a_83_0.png)


    Figure 3.21 – Add row-level security


    +   4. Then select the mapping table you added in _step 1_.


    +   5. Then click on **Apply to dataset**. Now the filter has been applied, as
    shown in the following screenshot:


    ![](img/33bad1d211a2d93fd743a1978d403f9a_83_1.png)


    Figure 3.22 – Dataset rules applied'
  merge: -1
  img_proc: true
- pgno: 84
  md: 'We will not need these permissions for the next chapter. After you have applied
    the row-level filters, you can remove them by doing the following:


    +   1. Select the **yellowtrips_3mo** dataset and then **Row-level security.**

    +   2. With the mapping table selected, click on **Remove dataset.**

    +   3. Click **Remove dataset** again to confirm the action.


    # ## Summary


    Congratulations on completing this chapter. In this chapter, we learned how to
    create and edit datasets in Amazon QuickSight. We managed to import datasets into
    SPICE and schedule automatic refresh jobs. We also edited fields and added custom
    calculations to get more value from a dataset and its columns. We then looked
    at advanced dataset operations including joining datasets together and enriching
    them with reference data. In the last part of this chapter, we learned how to
    apply security controls, either at the column level or row level, so that you
    can protect sensitive information or apply specific filters to your users.


    In the next chapter, we will learn how to visualize datasets with QuickSight analyses
    and dashboards.


    # ## Q&A


    +   1. What is the difference between a direct query and a SPICE data source?

    +   2. How do you add column-level security controls in Amazon QuickSight?

    +   3. When might we need row-level security for our dataset?

    +   4. Why might we need to exclude columns from a dataset?

    +   5. How do we enrich a dataset with reference data?

    +   6. Why is it important to configure the correct data type for every column
    in our dataset?


    # ## Further reading


    +   • QuickSight User Guide - Preparing data: https://docs.aws.amazon.com/quicksight/latest/user/preparing-data.html.'
  merge: -1
