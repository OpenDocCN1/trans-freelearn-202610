- pgno: 124
  md: 'Now that we have configured the analysis and arranged the onscreen controls,
    we can publish the analysis as a dashboard and share it with our reader users.
    With that, we have created our first truly interactive QuickSight dashboard. Next,
    we will learn how to use actions to add more interactive controls to our dashboards.


    # # Working with actions


    QuickSight Actions allow you to add interactivity to your dashboards. They can
    be any of the following:


    +   - **Filter actions**

    +   - **Navigation actions**

    +   - **URL actions**


    Next, we will look closer at each of these action types. To understand each type,
    we will configure them using our New York taxi sample analysis.


    # # Working with filter actions


    URL actions allow us to instantly filter data when the user clicks on a specific
    area of a dashboard. Filter actions make it easier for your readers to focus on
    specific data points of the analysis.


    When configuring filter actions, you will need to choose a visual in your analysis
    and then provide the following information:


    +   - **Action Name**: A user-friendly and descriptive name for the filter action.

    +   - **Activation**: **Menu Option** or **Select**: **Menu Option** will add
    a menu item when you click a data point in your visual. This option, when clicked,
    will activate the URL action. On the other hand, with the **Select** option, your
    URL action will be activated directly when you click a data point.

    +   - **Filter scope**: Which visuals will be filtered.


    To understand filter actions, we will use an example from our New York Taxi analysis.
    Let’s assume that we want our users to instantly focus on a specific borough and
    update the KPI and Sankey visual to reflect the selected borough only. To select
    a borough, we will use the bar chart diagram that displays the average tip per
    borough, which we configured in _Chapter 4, Developing Visuals and Dashboards_:


    +   1. First, navigate to the analysis and select the bar chart visual by simply
    clicking on it.

    +   2. Next, with the visual selected, click on **Actions** from the left-hand
    side menu.'
  merge: -1
  img_proc: true
- pgno: 125
  md: '# 3. Click **Add action** and then **Filter action** from the **Action Type**
    drop-down menu.


    # 4. Add the values shown in the following screenshot:


    ![](img/33bad1d211a2d93fd743a1978d403f9a_125_0.png)


    Figure 5.12 – Filter action


    We''ll update the following parameters:


    +   - **Action name**: `Filter by borough`


    +   - **Activation**: **Select**


    +   - **Filter scope**: Selected fields


    +   - **Target visuals**: The KPI and Sankey visuals'
  merge: -1
