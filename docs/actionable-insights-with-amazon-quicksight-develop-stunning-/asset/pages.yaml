- pgno: 160
  md: "+   4. Using the IAM role, the web server calls QuickSight APIs to get the\
    \ embed URL and display it to the user.\n\n+   5. To populate the visuals, QuickSight\
    \ will fetch the data from the various data sources, abstracting this from the\
    \ user and the web application.\n\nNow that we have explored the main components\
    \ of the embedded analytics architecture and the flow between components, in the\
    \ next section, we will use a few simple commands to generate an embedded dashboard\
    \ URL.\n\n# # Generating an embedded dashboard URL\n\nIn this section, we will\
    \ use the QuickSight CLI to generate an embedded dashboard URL that, for this\
    \ example, we will display on a web browser. Setting up authentication and the\
    \ web server is outside the scope of this book. In _Chapter 2, Introduction to\
    \ Amazon QuickSight_, we created a reader user in our QuickSight account. First,\
    \ let’s verify the details of this user and get their unique resource number:\n\
    \n+   1. Log in to the AWS console as a QuickSight or AWS admin and open **AWS\
    \ CloudShell**.\n\n+   2. To view the details of the `reader` user, use the `describe-user`\
    \ CLI command:\n\n```\n```\n$aws quicksight describe-user --user-name reader\n\
    --aws-account-id <aws account id> --namespace default\n--region us-east-1\n```\n\
    ```\n\nVerify that the user has been found. The response should look similar to\
    \ the following:\n\n```\n```\n{\n \"Status\": 200,\n \"User\": {\n \"Arn\": \"\
    arn:aws:quicksight:us-east-1:<aws account\nid>:user/default/reader\",\n \"UserName\"\
    : \"reader\",\n \"Email\": \"your-email@something.com\",\n \"Role\": \"READER\"\
    ,\n \"IdentityType\": \"QUICKSIGHT\",\n \"Active\": true,\n \"PrincipalId\": \"\
    \"\n },\n \"RequestId\": \"818a21fc-4146-3bf6-b5c3-a1b315cb874b\"\n}\n```\n```"
  merge: -1
