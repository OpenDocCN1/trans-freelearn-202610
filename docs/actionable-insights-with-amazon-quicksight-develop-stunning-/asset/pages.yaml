- pgno: 132
  md: '# # Technical requirements


    For this chapter, you will need the following:


    +   - An **AWS account**


    +   - A QuickSight account with **Author** and **Reader** users configured


    +   - The datasets created in _Chapter 2, Introduction to Amazon QuickSight_


    +   - The analysis created in _Chapter 3, Preparing Data with Amazon QuickSight_


    # # Using forecasting


    Amazon QuickSight allows you to add **forecasting** to your dashboards without
    the need to develop complex ML models. To better understand how to configure forecasting,
    we will use the example dataset we configured in _Chapter 2, Introduction to Amazon
    QuickSight_.


    # # Adding forecasting


    For our example, let''s assume that we need to develop a dashboard that contains
    forecasts about the total number of taxi fares in the future. As expected, our
    data has a certain degree of seasonality. Also, we can see from the line chart
    visual we developed in _Chapter 3, Preparing Data with Amazon QuickSight_, that
    during Sundays, there is a drop in the total taxi fares compared to the other
    days of the week. Identifying the most appropriate seasonality for our dataset
    is not always straightforward. In our example, we have different levels of seasonality
    depending on what time interval we will consider. A season can be 24 hours, or
    a week, or a year. Identifying the right seasonality is important when configuring
    forecasts, as they can be used to more accurately predict future events and metrics.


    Now, let''s add forecasting in our _New York Taxi_ analysis:


    +   1. First, select the line chart diagram we developed in _Chapter 3, Preparing
    Data with Amazon QuickSight_.


    > > **Note**

    > > Not all visual types support forecasting. Line charts with a time dimension
    are very good candidates for forecasting, as they commonly visualize time series
    data.'
  merge: -1
  img_proc: true
- pgno: 133
  md: '# ## 2. Next, click on the visual settings and then click **Add forecast**,
    as shown here:


    ![](img/33bad1d211a2d93fd743a1978d403f9a_133_0.png)


    Figure 6.1 – Adding forecasts


    # ### 3. Next, we will edit the forecasting parameters as follows:


    +   - **Forecast length**: Periods forward/backward are the number of time intervals
    that you want to get a forecast for.


    > > **Note**

    > > When configuring forecasting periods, a period is matching the period of the
    visual where the forecasting is applied. For example, if your data is aggregated
    daily, then a period of seven (7) intervals equals 1 week. If your data is aggregated
    monthly, then a period will correspond to a month, therefore a period of 12 intervals
    will be a full year.


    +   - **Prediction interval**: This represents the probability that the future
    values will be within the forecasted values.


    > > **Note**

    > > The prediction interval can be between 5% and 95%. The lower the prediction
    interval, the narrower the forecasting range will be.


    +   - **Seasonality**: This is the time interval when your time series has predictable
    changes. By default, QuickSight will automatically identify the best seasonality
    pattern for your data. You can choose to override the automatic selection with
    a manual selection.'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'For our example, we will use the following values:


    +   - **Periods forwards**: 30 – This will give us predictions for 1 month if
    our data is aggregated daily.


    +   - **Periods backwards**: 0 – In this example, we are not interested in backward
    predictions.


    +   - **Prediction interval**: 75 – We can start with 75 as a starting point,
    and then adjust.


    +   - **Seasonality**: `Automatic`.


    4. The forecasted area is shown as a range of values, highlighted with different
    colors. We can see the visual with forecasting as shown in the following figure:


    ![](img/33bad1d211a2d93fd743a1978d403f9a_134_0.png)


    Figure 6.2 – Time series data with forecasting


    Now that we have added forecasting capabilities to a line chart visual, in the
    next section, we will learn how to add different scenarios that can alter our
    forecasts, called what-if scenarios.'
  merge: -1
  img_proc: true
- pgno: 135
  md: '# # Working with what-if scenarios


    **What-if scenarios** allow us to project a specific target in the future and
    then observe how this affects a forecast. To better understand the what-if analysis,
    we will use the forecast visual we just configured. Let’s assume, because of a
    new initiative, taxi ridership is expected to increase, and by 15 January 2020,
    we will have at least a 2.5x increase. We can use this scenario to understand
    how this goal will affect our projections for the future:


    +   1. First, to open the what-if analysis, we simply need to click on a data
    point in the forecast area.


    +   2. Next, we will need to define our scenario. In our case, with 15 Jan, 2021
    selected, we simply add our target value as $2，500，000, which is more than double
    the original forecast.


    +   3. Click **Apply** and then observe that we have a second forecast line that
    corresponds to the scenario of having increased revenue. The original forecast
    can be observed too with the dotted lines. See the following figure for an example
    of a what-if scenario:


    ![](img/33bad1d211a2d93fd743a1978d403f9a_135_0.png)


    Figure 6.3 – What-if scenario


    Congratulations, you have added a what-if analysis with only a few clicks. Next,
    we will learn how to use insights, which are a special type of QuickSight visual
    that allow you to describe your insights from your data using natural language.'
  merge: -1
  img_proc: true
- pgno: 136
  md: '# # Working with insights


    QuickSight **insights** offer a set of features that allow you to express insights
    from data using natural language. QuickSight can automatically interpret a diagram
    and suggest narratives that you can quickly add to your analysis. In addition
    to that, you can build your own custom narrative. In this section, we will do
    the following:


    +   - Learn how to use suggested insights.

    +   - Create and edit a custom insight.


    # ## Adding suggested insights


    To better understand the **autonarrative** features, we will use the example _New
    York Taxi_ analysis. Let’s start with the Sankey diagram to discover interesting
    insights from the data:


    +   1. First, open the analysis and select any visual by clicking on it.

    +   2. Next, click on the insights icon to reveal the **Suggested insights** list,
    as shown here:


    ![](img/33bad1d211a2d93fd743a1978d403f9a_136_0.png)


    Figure 6.4 – Selecting the suggested insights'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'Next, we will select an insight that looks interesting to display. For example,
    we can display the days with the highest and lowest taxi fares over the entire
    period we are visualizing.


    +   3. Scroll down to find the **WORST DAY** insight and then click the plus icon
    to add the insight to your analysis.


    +   4. Repeat _Step 3_ for the **BEST DAY** insight.


    +   5. Resize and format the insights.


    | BEST DAY | WORST DAY |

    |---|---|

    | Highest day is Oct 7, 2020 with total total_amount of $1,978,758.30 | Lowest
    day is Dec 25, 2020 with total total_amount of $345,309.32 |


    Figure 6.5 – Adding suggested insights


    Interestingly, Christmas day happens to be the day with the least taxi fares.
    Feel free to explore and familiarize yourself with the other narrative suggestions.
    In the next section, we will learn how to create a new narrative manually, which
    is particularly useful when you need a different narrative from those autosuggested,
    and need to control the text displayed by customizing your narrative.


    # # Creating and editing an insight


    In this section, we will learn how to create and edit a custom insight. To better
    understand how to set it up, we will use the New York dataset analysis. Let’s
    assume that we want to display the total number of miles traveled by New York
    taxis and display it on the screen using natural language. For example, consider
    the following:


    ```

    ```

    The total distance traveled in New York over the period between <Start Date> to
    <End Date> was <number> miles.

    ```

    ```


    In the next section, we will learn how to develop an insight that answers the
    previous questions.'
  merge: -1
  img_proc: true
- pgno: 138
  md: '# # Adding an insight


    In this section, we will start by learning how to add an insight in Amazon QuickSight:


    +   1. First, click on the **+ Add** button and then select **Add Insight**.


    +   2. Next, we will need to select the computation type for our insight, as shown
    in the following figure:


    ![](img/33bad1d211a2d93fd743a1978d403f9a_138_0.png)


    Figure 6.6 – Selecting the computation type


    +   3. Select the **Total aggregation** computation type, since our problem is
    a total aggregation of the `trip_distance` field, which represents the total miles
    traveled.


    +   4. Now, we need to choose the fields from our dataset to populate our insight.
    Selecting fields is similar to how we were selecting fields for our visuals, by
    dragging and dropping the values into the **Field Well** area of the screen at
    the top of the analysis. For our calculation, we need to select `trip_distance
    (Sum)` as the **Values** field and leave the **Time** and **Categories** fields
    empty.'
  merge: -1
