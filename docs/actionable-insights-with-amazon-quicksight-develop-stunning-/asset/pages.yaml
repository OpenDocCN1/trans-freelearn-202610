- pgno: 194
  md: '# # Technical requirements


    For this chapter, you will need access to the following:


    +   • An AWS account and AWS Identity and Access Management (IAM) user, with elevated
    access


    +   • The AWS Command Line Interface (CLI)


    +   • An Amazon QuickSight account with Author and Reader users configured


    +   • The environment created in Chapter 1, Introducing the AWS Analytics Ecosystem


    +   • The dashboards created in Chapter 4, Developing Visuals and Dashboards


    # # Managing QuickSight permissions


    In this section, we will learn how to configure user permissions against QuickSight
    resources. First, let''s introduce the fundamental topics we need to understand
    when setting up permissions:


    +   • **Principal**: An AWS principal is the user (or group of users) or application
    that needs to access AWS resources.


    +   • **Action**: Actions define the set of API operations that a principal is
    allowed or denied. For example, in QuickSight, the `DeleteDataSet` action deletes
    a dataset. To see a full list of QuickSight actions, refer to the AWS Documentation:
    https://docs.aws.amazon.com/service-authorization/latest/reference/list_amazonquicksight.html#amazonquicksight-actions-as-permissions.


    +   • **Resource**: For most actions, we can narrow down the scope of a policy
    to a specific resource(s). Typically, a single resource has its own unique **Amazon
    Resource Number (arn)**.


    +   • **Condition**: AWS allows you to define access based on specific conditions.
    For example, a condition that gives access to an application from a specific IP
    address.


    When granting AWS permissions, including QuickSight permissions, make sure you
    follow the **least privilege** security best practice. According to the principle
    of least privilege, you should only allow users to have access to the specific
    actions and resources they require.'
  merge: -1
  img_proc: true
- pgno: 195
  md: "# # Using user groups\n\nAs the number of users increases and their access\
    \ patterns become more and more sophisticated, the complexity of configuring their\
    \ permissions to resources also rises exponentially. In these circumstances, we\
    \ can use **user groups**. User groups allow you to group users together and then\
    \ apply permissions at the group level, rather than the individual level, which\
    \ saves you time and effort. When a user joins a group, they automatically inherit\
    \ the group permissions. Likewise, when a user leaves the group, then they lose\
    \ access to the group’s resources.\n\nTo better understand how to manage groups\
    \ in Amazon QuickSight, we will use a simple hands-on example:\n\n+   1. First,\
    \ let’s create a group for the marketing department. Using a terminal with AWS\
    \ CLI configured and with elevated access, type the following command, replacing\
    \ the `<account-id>` value with the value from your environment:\n+   \n+   ```\n\
    +   $aws quicksight create-group --group-name \"Marketing\" \n+   --description\
    \ \"Group for the Marketing Department\" \n+   --aws-account-id <account-id> --namespace\
    \ default \n+   --region us-east-1\n+   ```\n\n+   2. Next, let’s add our Reader\
    \ user to this group. For this purpose, we will use the create-group-membership\
    \ CLI command. Type the following, replacing the highlighted values with those\
    \ from your environment:\n+   \n+   ```\n+   $aws quicksight create-group-membership\
    \ --member-name reader --group-name Marketing --aws-account-id <account-id> --namespace\
    \ default --region us-east-1\n+   ```\n\n+   3. Next, we will use the QuickSight\
    \ Console to share a new dashboard with the marketing group, rather than an individual\
    \ user. Log into QuickSight as the Author user. Open the New York Taxi analysis\
    \ and publish it as a brand-new dashboard. Give any name to your newly created\
    \ dashboard."
  merge: -1
  img_proc: true
