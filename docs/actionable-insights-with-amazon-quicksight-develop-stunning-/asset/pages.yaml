  md: 'Once you open the analysis, you will notice an identical analysis to the one
    we created in previous chapters. The main difference is that the analysis from
    the template was created programmatically using a few CLI commands. Using the
    template and analysis API, we can create and share a blueprint of an analysis,
    and then using this blueprint, we can create a new analysis and share it with
    other users or accounts. Without the template API, you would need to recreate
    the analysis manually, which can involve many steps and makes it harder to apply
    changes consistently.


    Now that we have learned how to control QuickSight resources programmatically,
    in the next section, we will discuss patterns to build automations.


    # # Building automation using the QuickSight API


    So far, we have learned how to use the QuickSight API to control resources by
    using the AWS CLI. In this section, we will discuss an architecture that will
    allow us to call the QuickSight API automatically.


    # ## Understanding the role of AWS Lambda


    **AWS Lambda** is a serverless compute service that allows you to run code without
    creating servers. The unit of computation is a _Lambda function_. Lambda functions
    can be triggered by specific events or at a specific point in time. Using AWS
    Lambda and the AWS SDK, we can control QuickSight resources programmatically to
    respond to specific events or changes to our infrastructure. For example, instead
    of scheduling a refresh on an interval, we could use the SDK to set our data to
    refresh on specific events.


    **Amazon EventBridge** can be used for more complex integrations. Amazon EventBridge
    is a serverless event bus that makes it easier to build event-driven applications
    on AWS. Using EventBridge, you can deliver real-time events that are generated
    by your applications, integrated **software-as-a-service (SaaS)** applications,
    and AWS services. AWS Lambda can be a target of these events, and this allows
    you to design responses to certain events. To better understand how to automate
    QuickSight operations, in the next section, we will create a simple event-driven
    ingestion from an **Amazon S3** data source using AWS Lambda.'
  merge: -1
  img_proc: true
- pgno: 185
  md: "# # Automating the ingestion of an Amazon S3 data source\n\nIn this section,\
    \ we will configure a simple application that will automatically refresh an **Amazon\
    \ SPICE** data source when the underlying S3 data is updated. With this approach,\
    \ instead of waiting for a scheduled refresh (which would introduce delays), we\
    \ will trigger a refresh as soon as new data is available (which will minimize\
    \ delays). For this example, we will use a sample `.csv` file, which will be configured\
    \ as an S3 data source in QuickSight. Then, we will configure a Lambda function\
    \ that will be triggered by S3 notifications. The Lambda function will call the\
    \ `createIngestion` function of the QuickSight API, which will result in QuickSight\
    \ importing the new dataset into SPICE. The following figure shows how the various\
    \ components work together:\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_185_0.png)\n\
    \nFigure 8.6 – An event-driven data refresh\n\nNow that we have discussed the\
    \ high-level architecture, to better understand it, let’s explore a hands-on example.\n\
    \n# # Creating an S3 dataset\n\nLet’s begin by creating a sample dataset. We will\
    \ need to create a `.csv` file and a manifest file:\n\n+   1. First, open a text\
    \ editor and create a `sample.csv` file. Copy the following as its content:\n\
    +   \n+      \"Name\",\"Age\"\n+      \"George\",\"54\"\n\n+   2. Upload the file\
    \ into the S3 data lake you created in _Chapter 1, Introducing the AWS Analytics\
    \ Ecosystem_. Create a folder named `samples` under your data lake bucket, or\
    \ simply use the `s3 cp` CLI command to upload your `.csv` file:\n+   \n+    \
    \  `$aws s3 cp sample.csv s3://<data-lake-xxxxxxxx>/samples/`"
  merge: -1
  img_proc: true
