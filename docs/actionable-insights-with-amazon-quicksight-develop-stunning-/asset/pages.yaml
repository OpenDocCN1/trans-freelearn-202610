    Role\": \"AUTHOR\",\n      \"IdentityType\": \"IAM\",\n      \"Active\": true,\n\
    \      \"PrincipalId\": \"federated/iam/xxxxx\"\n    }\n  ],\n  \"RequestId\"\
    : \"xxxx-xxxx-xxxx-xxxx\"\n}\n```\n\n+   5. Now that we have successfully created\
    \ our user, let’s try to understand the effects of  \n+   a namespace. Open the\
    \ AWS Console, and log into QuickSight as the newly created  \n+   user. Expand\
    \ the top-right menu. Note the namespace name, as shown in the  \n+   following\
    \ screenshot:\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_224_0.png)\n\nFigure\
    \ 10.3 – Logging in to a multi-tenant QuickSight account"
