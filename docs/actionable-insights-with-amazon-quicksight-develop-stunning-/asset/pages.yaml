    # ## Summary


    Congratulations on completing this chapter. In this chapter, we learned how to
    add ML capabilities to our dashboards. We learned how to add forecasting, including
    building complex scenarios with what-if analysis. We also learned how to configure
    narratives and customize them using the QuickSight narrative editor. Finally,
    we learned how to create outlier detections and perform contributor analysis for
    anomaly detection. With the capabilities we learned in this chapter, your users
    will be able to get access to rich visuals and narratives in natural language
    with simple calculations or more sophisticated ML-driven calculations.


    At this stage, we have learned about most of the capabilities of QuickSight analysis,
    and by combining the knowledge you have learned so far in this book you can configure
    complex dashboards that provide rich insights for your business users. In the
    next chapter, we will learn how to embed these dashboards into your own custom
    application.


    # ## Questions


    +   1. What are the most appropriate visual types to add forecasting?

    +   2. What are the QuickSight narratives and when should we use them?

    +   3. When should we use ML insights versus simpler computations for our insights?

    +   4. What are the contributors when configuring anomaly detection in QuickSight?

    +   5. How can we access the outlier detection application?


