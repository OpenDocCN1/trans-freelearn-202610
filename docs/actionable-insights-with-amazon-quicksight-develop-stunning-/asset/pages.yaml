  md: '# # 9 Managing QuickSight Permissions and Usage


    In this chapter, we will learn how to manage **Amazon QuickSight** operations
    and permissions. We will focus on the QuickSight permissions model and learn how
    to configure fine-grained permissions. We will also learn how to manage and organize
