    iam_role ''arn:aws:iam::xxxxxxxxxxxx:role/

    RedshiftSpectrumRole'' FORMAT AS CSV dateformat ''auto''

    ignoreheader 1;

    ```


    9. At this stage, we have a data lake with 12 months'' worth of data and a data
    warehouse that contains only the most recent data (3 months). One of the characteristics
    of the modern data architecture is that it allows its users to query the data
    lake from the data warehouse. Feel free to query the data and start getting an
    understanding of the dataset. Let''s create the external schema so that we can
    enable the Spectrum feature. Use the following command in your Redshift editor.
    Replace the role ARN with the values from your environment:


    ```

    create external schema spectrum_schema from data catalog

    database ''my-data-lake-db''

    iam_role ''arn:aws:iam::xxxxxxxxxxxx:role/

    RedshiftSpectrumRole''

    create external database if not exists;

    ```


    10. Let''s just compare the size of the two tables using a simple count(*) query:


    ```

    select count(*) from public.yellowtrips_3mo;

    select count(*) from spectrum_schema.yellowtrips;

    ```'
  merge: -1
  img_proc: true
