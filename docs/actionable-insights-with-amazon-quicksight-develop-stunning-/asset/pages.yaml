    +   - The dashboards created in Chapter 3, Preparing Data with Amazon QuickSight


    # # Introducing the QuickSight API


    In this section, we will introduce the Amazon QuickSight API. An **application
    programming interface (API)** is a set of defined functions that allow application
    developers to access the features of a certain application or library. The AWS
    API allows developers to access AWS services programmatically. Traditionally,
    AWS provided infrastructure services, allowing developers to programmatically
    provision virtual machines on the cloud. Now, AWS provides many more services,
    many of which are not infrastructure services. Amazon QuickSight is a great example
    of one such service. QuickSight is a cloud-based **business intelligence (BI)**
    service that runs on AWS infrastructure, but developers don''t need to provision
    infrastructure. Instead, developers can use the QuickSight API to access features
    and conduct actions in the application, such as creating datasets, performing
    data analysis, or sharing dashboards. So far in this book, we have learned how
    to complete these operations using the QuickSight console with a **graphical user
    interface (GUI)** accessed via a web browser. In this chapter, we will learn how
    to complete these operations programmatically, which will allow us to build automation
    when creating BI applications. First, we will learn how to access the QuickSight
    API.


    # # Accessing the QuickSight API


    In this section, we will learn about the methods you can use to access the QuickSight
    API. There are two main ways of accessing AWS APIs:


    +   - Using a **software development kit (SDK)**

    +   - Using the **command-line interface (CLI)**


    Next, we will look at these options in more detail with hands-on examples.


    # # Accessing the QuickSight API using the AWS CLI


    AWS provides a simple CLI that allows developers to access the AWS API. Before
    using the CLI, you will need to install it. Follow the AWS instructions to install
    the CLI for your operating system:


    https://docs.aws.amazon.com/cli/latest/userguide/cli-chap-

    install.html'
  merge: -1
