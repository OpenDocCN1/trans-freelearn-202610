    +   .amazon.com/cli/latest/userguide/cli-chap-configure.html.


    +   2. First, let’s create the S3 bucket as the data lake storage. Your S3 bucket
    needs to have

    +   a globally unique name. For that reason, we should introduce some randomness
    to

    +   it. Let’s pick a random set of 10 characters and numbers. For this tutorial,
    you should

    +   choose your own random set of characters for this string; for example, SF482XHS7M.

    +   We will use the random string in the data lake name, to ensure it is globally
