    # Setting up custom permissions


    In _Chapter 2, Introduction to Amazon QuickSight_, we learned the different user
    cohorts:

    Admin, Author, and Reader. The user cohort determines the level of access to features
    in

    the QuickSight console. Custom profiles allow you to override the default permissions
    with

    custom security profiles and define permissions that fit your organization’s requirements.


    > Note

    > For custom permissions to work, you will need to be using IAM federated

    > users.


    To better understand custom permissions, we will use a simple hands-on example.
    By

    default, an Author user is able to configure a new data source. For our example,
