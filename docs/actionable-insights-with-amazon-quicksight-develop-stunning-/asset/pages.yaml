    Now that we have learned how to add a filter, let’s introduce the concept of QuickSight
    parameters.


    # # Working with parameters


    Parameters in QuickSight are variables that a user can set, commonly using on-screen
    controls. A parameter can be used in various ways. For example, we can filter
    the analysis data dynamically based on a parameter. To understand this concept,
    we will use our example New York taxi analysis. Let’s assume that our business
    users need to understand patterns and changes in customer behaviors based on what
    payment type the customers are using. To implement this use case, we will create
    a parameter that will store the user selection for the `Payment Type` field.'
  merge: -1
  img_proc: true
- pgno: 118
  md: "# # Creating a parameter\n\nCreating a parameter is straightforward, as shown\
    \ here:\n\n+   1. You can either select the **Parameter** item on the left-hand\
    \ side menu or click the + **Add** button at the top right-hand side of the screen\
    \ and then select **Add parameter**. Once selected, you will see the parameter\
    \ creation screen, as shown here:\n\n![](img/33bad1d211a2d93fd743a1978d403f9a_118_0.png)\n\
    \nFigure 5.5 – Adding parameters\n\n+   2. For this example, we will use the following\
    \ values (as shown in the preceding screenshot):\n+   \n+   • **Name**: `paymenttype`\n\
    +   • **Data type**: String\n+   • **Values**: Multiple values\n+   • **Default\
    \ values**: Cash, Credit Card, Dispute, No Charge\n\n+   3. Next, click **Create**.\
    \ The parameter should now be added to your analysis.\n\nAt this stage, our parameter\
    \ has been added to the analysis, but we are not using it yet. Next, we will link\
    \ this parameter to the filter we created earlier."
  merge: -1
  img_proc: true
- pgno: 119
  md: '# # Linking parameters to filters


    While we are still on the analysis and logged in as the author user, to link parameters
    to filters, we will need to do the following:


    +   1. First, locate the filter we created earlier. You can click on the visual
    where the filter has been applied and then click on the filters item on the left-hand
    side menu.


    +   2. Now click **Edit**, or simply click on the **Payment Type** filter we created
    earlier.


    +   3. To link a filter with a parameter, we will need to select **Custom filter**
    from the **Filter Type** drop-down menu.


    +   4. Next, tick the **Use parameters** checkbox.


    +   5. Next, there will be a pop-up, asking if you want to change the scope of
    your filter. Since we don''t need to filter other visuals from our analysis, we
    will select **No**.


    > Note

    > The scope of the filter can be edited at any time once the parameter has been
    created. The scope update will have an immediate effect, without the need to update
    the parameters or your controls.


    +   6. From the drop-down menu, select the `paymenttype` parameter we created
    earlier. The following screenshot shows what the filter configuration will look
    like when linking a filter to a parameter:


    ![](img/33bad1d211a2d93fd743a1978d403f9a_119_0.png)


    Figure 5.6 – Linking filters to parameters


    +   7. Click **Apply** and then **Close**.'
  merge: -1
  img_proc: true
- pgno: 120
  md: "Now that our filter and parameter are connected, the filter will inherit the\
