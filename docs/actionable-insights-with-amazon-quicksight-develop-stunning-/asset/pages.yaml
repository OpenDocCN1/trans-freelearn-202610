- pgno: 131
  md: '# # 6 Working with ML Capabilities and Insights


    In this chapter, we will explore visual types in **Amazon QuickSight**. Using
    hands-on examples, we will add **machine learning (ML)** capabilities to our dashboards.
    More specifically, we will add forecasting for time series data and anomaly detection
    capabilities. To describe insights from the data, we will add natural language
    narratives in our dashboards.


    In this chapter, we will cover the following topics:


    +   - Using forecasting

    +   - Working with insights

    +   - Working with ML insights'
  merge: -1
