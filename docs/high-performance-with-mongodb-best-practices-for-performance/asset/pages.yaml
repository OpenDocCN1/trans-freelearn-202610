    service discovery mechanisms, which are especially important in replica set and
    sharded cluster deployments. When working with MongoDB Atlas, remember that DNS
    propagation delays can sometimes cause temporary connection issues after cluster
    configuration changes. If you’ve recently modified your Atlas cluster, allow sufficient
    time for DNS updates to propagate through your network.


    # Connection monitoring best practices


    After understanding how to diagnose specific connection problems, implementing
    a comprehensive monitoring strategy becomes essential for maintaining system health
    over time. For effective connection monitoring, you should do the following:


    +   1. **Establish baselines**: Understand normal connection patterns for your
    application

    +   2. **Set meaningful thresholds**: Configure alerts based on connection usage
    relative to limits

    +   3. **Correlate metrics**: Connect driver-side and server-side metrics for
    a complete picture

    +   4. **Monitor trends**: Watch for gradual changes that might indicate evolving
    issues

    +   5. **Automate alerts**: Set up proactive notifications for high wait queue
    times or connection counts approaching limits


    By combining these monitoring practices with the troubleshooting approaches outlined
    earlier, you can build a robust connection management strategy that helps prevent
    problems before they impact your users.'
  merge: -1
  img_proc: true
- pgno: 271
  md: '# Optimizing connection management


    Now that you understand how to achieve and maintain a resilient system via connection
    management, as well as how to monitor and troubleshoot connection issues, let’s
    take things a step further and talk about how to optimize connection management.
    Achieving optimal MongoDB performance and resilience requires thoughtful tuning
    of your connection management strategy. This section covers key approaches for
    optimizing connection pools and implementing strategies for different workload
    patterns.


    # Connection pool optimization


    Optimizing the connection pool starts with ensuring the size of the pool is ideal
    for your application. The ideal connection pool size varies based on your application’s
    workload characteristics:


    +   - **OLTP workloads:** Start with moderate pool sizes (50-100 connections)
    for many short operations

    +   - **OLAP workloads:** Use smaller pools sized to match expected concurrent
    analytical operations

    +   - **Batch processing:** Size the pool to match the parallelism of your batch
    operations


    A best practice is to tune your connection pool size based on application performance
    metrics and observed behavior, rather than relying on a fixed utilization percentage.
    Monitor key indicators such as wait queue size, operation latency, and server-side
    connection metrics to determine whether your pool size needs adjustment.


    Consider these guidelines when tuning connection pools:


    +   - If your application spends excessive time creating new connections, increase
    `minPoolSize` to ensure sufficient connections are available at startup

    +   - If the database CPU usage is higher than expected with many connection attempts,
    consider reducing `maxPoolSize` to decrease the load

    +   - If the load is low but the application throughput is less than expected,
    you may need to increase `maxPoolSize` or adjust application threading


    Remember that each MongoDB driver creates a separate connection pool for each
    server in your topology, so the total connections from an application will be
    `maxPoolSize` multiplied by the number of MongoDB servers.'
  merge: -1
  img_proc: true
- pgno: 272
  md: "# Connection timeout configuration\n\nBuilding resilient, high-performance\
    \ applications that gracefully handle network disruptions and service degradation\
    \ requires the configuration of proper timeout settings. Poorly configured timeouts\
    \ can lead to cascading failures, resource exhaustion, or degraded user experience.\
    \ MongoDB provides several configurable timeout parameters that control different\
    \ aspects of connection behavior:\n\n+   - **connectTimeoutMS**: How long the\
    \ driver waits when establishing a new connection. Set this to a value greater\
    \ than the longest network latency you have to any member of your deployment.\n\
    +   - **socketTimeoutMS**: How long the driver waits for a response for a specific\
    \ operation. Set this to two or three times the length of the slowest operation\
    \ that your driver runs.\n+   - **maxIdleTimeMS**: How long idle connections remain\
    \ in the pool (balance between connection churn and resource utilization).\n\n\
    Properly tuning these timeout parameters requires understanding both your application\
    \ behavior and your MongoDB deployment topology.\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_272_0.png)\n\
    \n> **Important**\n> \n> Do not use socketTimeoutMS to prevent long-running server\
    \ operations. Instead, use maxTimeMS() or timeoutMS() for drivers that support\
    \ client-side operators timeout with your queries so that the server can cancel\
    \ long-running operations. For example, if operations time out gracefully at the\
    \ driver level, the application can attempt meaningful retries without overwhelming\
    \ the server. Without proper timeouts, retries could flood connection pools, amplify\
    \ resource exhaustion, and result in system-wide downtime.\n\n# Server-side optimization\n\
    \nIn self-managed deployments, you need to configure both MongoDB’s connection\
    \ parameters and the underlying operating system limits to ensure optimal performance.\
    \ These settings work together to determine how many concurrent clients can connect\
    \ to your database.\n\n```\n```yaml\nnet:\n  maxIncomingConnections: 65536\n```\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 273
  md: 'The maxIncomingConnections setting controls the maximum number of simultaneous
    client connections that MongoDB will accept. Increasing this limit allows more
    concurrent client applications to connect to your MongoDB server, which is essential
    for high-traffic applications or environments with many microservices. However,
    simply increasing this parameter is not sufficient; you must also adjust the operating
    system’s limits.


    # Operating system configuration


    In Unix-based systems, MongoDB uses one file descriptor per client connection.
    When MongoDB reaches either the maxIncomingConnections limit or the operating
    system’s file descriptor limit (whichever is lower), it will refuse additional
    client connections. This creates a bottleneck that can severely impact application
    availability during periods of high demand.


    For Linux systems using systemd, you should configure the file descriptor limit
    in the MongoDB service file:


    ```

    [Service]

    # In the MongoDB systemd service file

    LimitNOFILE=64000

    ```


    For non-systemd environments, set the limits for the MongoDB service user in the
    /etc/security/limits.conf file:


    ```

    mongodb soft nofile 64000

    mongodb hard nofile 64000

    ```


    After changing these limits, MongoDB must be restarted for the changes to take
    effect. To confirm that your configuration changes are benefiting your deployment,
    you can use these verification methods:


    +   1. Check the current operating system limits with the following:

    +   ```

    +   ulimit -n      # For the current shell session

    +     cat /proc/$(pidof mongod)/limits  # For the running MongoDB process

    +   ```

    +   2. Monitor MongoDB connection utilization through the serverStatus command:

    +   ```

    +   db.adminCommand({ serverStatus: 1 }).connections

    +   ```'
  merge: -1
  img_proc: true
- pgno: 274
