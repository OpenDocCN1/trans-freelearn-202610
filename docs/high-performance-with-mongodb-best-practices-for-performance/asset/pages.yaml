- pgno: 144
  md: 'The default setting of 10 seconds should be optimal for most use cases, and
    adjusting it is not recommended.


    **Note**

    The `setParameter` administrative command is unavailable in MongoDB Atlas.


    # Replication and the oplog


    The **operations log (oplog)** is a central component of MongoDB replication.
    It is a special capped collection where the nodes record all write operations.
    Secondary nodes use the oplog to replicate changes and stay in sync with the primary.


    Here are some key characteristics of the oplog:


    +   - **Capped collection:** The oplog by default has a fixed size, which operates
    on a first-in, first-out (FIFO) basis. Older entries are automatically removed
    when the oplog reaches its size limit.

    +   - **Replication process:** Secondary nodes continuously apply oplog entries
    from the primary to replicate changes.

    +   - **Performance considerations:** Proper sizing of the oplog is crucial. If
    the oplog is too small, secondary nodes may fall behind and require a full resync.
    Conversely, an oversized oplog may consume unnecessary storage.


    Suppose your workload generates 2 GB of updates per hour. To ensure smooth replication,
    the oplog should be sized to store several hours’ worth of operations, typically
    upward of 24 to 48 hours. This reduces the risk of prolonged resyncs if a secondary
    node goes offline temporarily.


    For instance, if you configure an oplog size of 10 GB, this will provide approximately
    5 hours of operation history. This buffer allows secondary nodes to catch up after
    brief network interruptions or maintenance periods without requiring a full data
    resynchronization, but may be too short if the node fails in a way that takes
    longer than 5 hours to bring back online.


    A larger oplog provides a longer window for secondaries to catch up if they fall
    behind due to network issues, resource constraints, or maintenance. This is particularly
    important in high-throughput environments or during planned downtime for secondary
    nodes.


    To determine the appropriate oplog size for your deployment, consider the following:'
  merge: -1
  img_proc: true
- pgno: 145
  md: '+   - Your application’s average and peak write volume

    +   - The expected maximum duration of potential outages

    +   - Network reliability between data centers (for geographically distributed
    deployments)

    +   - The number of secondary nodes (more secondaries may require a larger window)


    MongoDB provides tools to monitor oplog usage and estimate your current window:


    ```

    // Check oplog size and replication window

    db.printReplicationInfo();


    // Sample output:

    // configured oplog size: 5120MB

    // Log length start to end: 86400secs (24hrs)

    // oplog first event time: Wed Apr 02 2025 10:03:25 GMT+0000

    // oplog last event time: Thu Apr 03 2025 10:03:25 GMT+0000

    // now: Thu Apr 03 2025 10:05:01 GMT+0000

    ```


    The oplog boundaries can be set in one of two ways, size and time, as follows:


    +   - size: The maximum size of the oplog in megabytes, which can be configured
    to any value between 990 MB and 1 petabyte

    +   - minRetentionHours: The minimum number of hours to preserve an oplog entry


    As the oplog is a capped collection, when these configured boundaries are met,
    the oldest entries in the oplog will be deleted.


    Changing the configured size of the oplog from its current value to 16 GB could
    be done as follows:


    ```

    db.adminCommand({ "replSetResizeOplog": 1, size: Double(16384)})

    ```


    Similarly, if instead of a fixed size you wanted to ensure exactly 48 hours of
    oplog content was always available, the command would be the following:


    ```

    db.adminCommand({ "replSetResizeOplog": 1, minRetentionHours: 48})

    ```


    ![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_145_0.png)


    # Risk of disk space exhaustion with minRetentionHours


    When minRetentionHours is configured, the oplog can grow without constraint so
    as to retain oplog entries for the configured number of hours. This may result
    in a reduction or exhaustion of system disk space due to a combination of high
    write volume and large retention period.'
  merge: -1
  img_proc: true
- pgno: 146
  md: 'Changing the oplog size or minimum oplog retention period of a given replica
    set member with replSetResizeOplog does not change the oplog size of any other
    member in the replica set. You must run replSetResizeOplog on each replica set
    member in your cluster to change the oplog size or minimum retention period for
    all members.


    # Managing replication lag


    Replication lag occurs when secondary nodes cannot keep up with the rate of operations
    being processed by the primary. This can lead to stale reads and longer failover
    times if the lagging node needs to become primary. To minimize replication lag,
    consider implementing the following strategies:


    | Strategy | Action | Considerations |

    |---|---|---|

    | Optimize networking | Place secondaries closer to the primary or upgrade network
    links. | Consider dedicated network links between replica set members. Implement
    bandwidth prioritization for replication traffic. |

    | Scale resources | Increase CPU, memory, or disk I/O capacity. | Upgrade hardware
    on existing nodes. |

    | Improve read workload targeting | Offload intensive queries to dedicated secondaries
    tailored for analytics, keeping the rest of the replica set balanced. | Configure
    read preferences to direct specific workloads to appropriate nodes. |


    *Table 5.3: Strategies to reduce replication lag in MongoDB replica sets*


    By proactively addressing replication lag through these strategies, you can ensure
    faster failovers, more consistent read performance, and overall greater stability
    within your MongoDB replica set. Regular monitoring and fine-tuning based on workload
    patterns will help maintain optimal replication health as your deployment scales.


    # Read and write strategies


    MongoDB offers flexible strategies for optimizing reads and writes across replica
    sets. Read preference settings determine which nodes handle read queries, balancing
    consistency, availability, or latency. Write concern defines how many nodes must
    acknowledge a write, affecting data durability versus write latency.'
  merge: -1
  img_proc: true
- pgno: 147
  md: 'Carefully tuning these strategies helps manage latency and maintain resilience.
    In this section, we will look at the key approaches and considerations for read
    and write operations in MongoDB.


    # Read preference


    A replica set will contain more than one server that can service an operation,
    and MongoDB’s client libraries can perform server selection based on a configured
    read preference to ensure operations are routed to the desired server.


    By default, an application directs its read operations to the primary member in
    a replica set (that is, read preference mode is "primary"); however, clients can
    specify a read preference to send read operations to secondaries.


    ![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_147_0.png)


    *Figure 5.3: MongoDB read preference behavior across data centers*


    Read preference consists of the read preference mode and optionally, a tag set
    list, and the maxStalenessSeconds option. Since replica set members can lag behind
    the primary (due to factors such as network congestion, low disk throughput, long-running
    operations, etc.), the read preference maxStalenessSeconds option lets you specify
    a maximum replication lag, or staleness, for reads from secondaries.


    When a secondary’s estimated staleness exceeds maxStalenessSeconds, the client
    stops using it for read operations. By default, there is no maximum staleness,
    and clients will not consider a secondary’s lag when choosing where to direct
    a read operation; however, when configuring this option, you must specify a value
    of 90 seconds or longer.'
  merge: -1
  img_proc: true
- pgno: 148
  md: 'There are many read preference modes available, which provide varying degrees
    of flexibility as it relates to maximizing availability and consistency, or minimizing
    latency.


    | Read preference mode | Description |

    |---|---|

    | primary | The default read preference, where all operations read from the current
    replica set primary.


    To maximize consistency and avoid stale reads, this read preference mode should
    be used. |

    | primaryPreferred | In most situations, operations read from the primary, but
    if it is unavailable, operations read from secondary members.


    This read preference mode allows for maximum availability, as consistent read
    operations will be delivered so long as a primary is available. If the primary
    is unavailable, however, you can still query secondaries. |

    | secondary | All operations read from the secondary members of the replica set.
    |

    | secondaryPreferred | Operations typically read data from secondary members of
    the replica set. If the replica set has only one primary member and no other members,
    operations read data from the primary member. |

    | nearest | To minimize latency, operations read from a random eligible replica
    set member, irrespective of whether that member is a primary or secondary, based
    on a specified latency threshold. The operation considers the following when calculating
    latency:


    - The localThresholdMS connection string option

    - The maxStalenessSeconds read preference option

    - Any specified tag set lists |


    *Table 5.4: MongoDB read preference modes*


    For applications that are geographically distributed, a read preference of nearest
    can further improve read performance as operations will be routed to any member
    with the smallest latency window, as defined by localThresholdMS (default 15 milliseconds).'
  merge: -1
  img_proc: true
- pgno: 149
  md: 'If a replica set member or members are associated with tags, you can specify
    a tag set list (array of tag sets) in the read preference to target those members.


    For example, consider the following tag set list with three tag sets:


    ```

    [ { "region": "South", "datacenter": "A" }, { "rack": "rack-1" }, { } ]

    ```


    First, MongoDB tries to find members tagged with both "region": "South" and "datacenter":
    "A". If a member is found, the remaining tag sets are not considered. Instead,
    MongoDB uses this tag set to find all eligible members.


    If a member isn''t found, { "rack": "rack-1" } is tried next, followed by the
    final tag of { }, which will match any eligible member.


    ![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_149_0.png)


    **Note**


    Tags and maxStalenessSeconds are not compatible with a read preference mode of
    primary.


    Read preference configurations allow applications to target the primary or secondary
    replica set members based on specific needs. This can enhance performance and
    availability by distributing read loads across multiple nodes, reducing latency,
    and ensuring continued access to data even if the primary node is unavailable.


    # Write concern and durability


    In MongoDB replica sets, write concern is an important configuration option that
    determines the level of acknowledgment a client requires from the database when
    performing a write operation. This mechanism directly impacts the delicate balance
    between data durability and system performance.


    Starting in MongoDB 5.0, the implicit default write concern is w:"majority". With
    this write concern, writes request acknowledgment that the calculated majority
    of data-bearing voting members have durably written the change to their local
    oplog. The calculated majority is determined by taking the smaller of the following:


    +   - The majority of all voting members (including arbiters)

    +   - The number of all data-bearing voting members.'
  merge: -1
  img_proc: true
- pgno: 150
  md: 'Write concern for replica sets describes the number of data-bearing members
    (i.e., the primary and secondaries, but not arbiters) that must acknowledge a
    write operation before the operation returns as successful.


    ![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_150_0.png)


    *Figure 5.4: Write concern with majority acknowledgment in MongoDB*


    An application that issues a write operation waits until the primary receives
    acknowledgment from the required number of members for the specified write concern.
    For a write concern of w greater than 1 or w : "majority", the primary waits until
    the required number of secondaries acknowledge the write before returning write
    concern acknowledgment. For a write concern of w:1, the primary can return write
    concern acknowledgment as soon as it locally applies the write, since it is eligible
    for contributing to the requested write concern.


    The more members that acknowledge a write, the less likely the written data is
    to roll back if the primary fails. However, specifying a high write concern can
    increase latency as the client must wait until it receives the requested level
    of write concern acknowledgment.'
  merge: -1
  img_proc: true
- pgno: 151
  md: "Write concern is specified using two primary parameters: w and wtimeout. The\
    \ first parameter (w) determines the number of nodes that must acknowledge the\
    \ write, and can accept value configurations:\n\n+   - Number values (1, 2, 3):\
    \ Specific number of replica set members\n+   - \"majority\": (Default) A majority\
    \ of voting members must acknowledge\n+   - Replica set tags: Custom-defined subset\
    \ of replica set members\n\nThe second parameter (wtimeout) specifies a time limit,\
    \ in milliseconds, for a write operation to propagate to enough members to achieve\
    \ the write concern after the operation succeeds on the primary. If the wtimeout\
    \ value is exceeded and a write concern error is returned to the client, the write\
    \ operation will likely still succeed; however, the client will not be waiting\
    \ longer than this period for acknowledgement. By default, wtimeout is “infinity”,\
    \ so if you want your application to return an error rather than wait until replication\
    \ to a calculated majority of the cluster succeeds, you should provide your own\
    \ appropriate wtimeout value.\n\nThe following example demonstrates setting a\
    \ custom write concern on an insert operation that ensures the write has been\
    \ acknowledged by the calculated majority of nodes and will return a write concern\
    \ error if the write hasn’t been acknowledged within 5 seconds:\n\n```\ndb.collection.insertOne(\n\
    \  { item: \"example\" },\n  {\n    writeConcern: {\n      w: \"majority\",\n\
    \      wtimeout: 5000\n    }\n  }\n);\n```\n\nAll MongoDB drivers provide the\
    \ ability to specify write concerns at both the connection level and on a per-operation\
    \ basis, allowing fine-grained control."
  merge: -1
  img_proc: true
- pgno: 152
  md: "You can modify the global default write concern by issuing the setDefaultRWConcern\
    \ command. From the MongoDB Shell, assuming you have the appropriate privileges\
    \ to do so, you could modify this value as follows:\n\n```\ndb.adminCommand({\n\
    \  \"setDefaultRWConcern\" : 1,\n  \"defaultWriteConcern\" : {\n    \"w\" : 2\n\
    \  }\n})\n```\n\nThe preceding example sets the global write concern to w:2. If\
    \ you issue a write operation with a specific write concern, the write operation\
    \ uses its own write concern instead of the default.\n\nWe recommend leaving w\
    \ at its default \"majority\" value, even though it may seem that latency would\
    \ be better without waiting for replication. Keep in mind that if the secondaries\
    \ start falling behind, flow control will kick in and start throttling your writes.\n\
    \n# Summary\n\nMongoDB’s replication system provides a robust foundation for building\
    \ highly available and fault-tolerant database deployments. Replica set architecture,\
    \ combined with automatic failover through elections, ensures that your database\
    \ can withstand node failures while maintaining data integrity. The oplog serves\
    \ as the backbone of the replication process, allowing secondary nodes to stay\
    \ in sync with the primary.\n\nWhen designing your replica set, consider factors\
    \ such as the geographical distribution of data and the appropriate oplog size\
    \ for your workload characteristics. These decisions will significantly impact\
    \ your database’s resilience, performance, and ability to meet your application’s\
    \ specific needs.\n\nRemember that proper configuration is not a one-time task\
    \ but an ongoing process that should evolve with your application’s growth and\
    \ changing requirements. Through continuous observation and iterative improvements,\
    \ you can maintain optimal replication behavior even as your MongoDB deployment\
    \ scales.\n\nIn the next chapter, we’ll explore how MongoDB’s sharding works with\
    \ replication to provide horizontal scalability for deployments with large datasets\
    \ and high throughput requirements."
  merge: -1
  img_proc: true
- pgno: 153
  md: '# 6


    # Sharding


    As modern applications generate and store increasingly vast amounts of data, ensuring
    high performance and scalability becomes a key concern for any database system.
    MongoDB’s sharding architecture is a solution designed to provide horizontal scalability
    for applications with massive datasets and demanding throughput requirements.
    Unlike traditional vertical scaling, which often results in expensive and size-limited
    hardware upgrades, sharding offers a more efficient and cost-effective way to
    scale by distributing data across multiple servers. Understanding sharding architecture
    will help you handle spikes in user activity, global expansion, and growing data
    complexity.


    This chapter delves into the foundational principles of MongoDB’s sharding architecture,
    enabling you to understand how sharding interacts with replication for high scalability
    and reliability. We’ll begin by examining the core components of a sharded cluster
    and their roles in routing and data distribution. From there, we’ll explore critical
    aspects such as selecting an optimal shard key. Finally, we’ll address practical
    considerations such as shard key refinement, strategic data placement, and techniques
    for handling large-scale imports and resharding operations. By the end of this
    chapter, you’ll have a strong grasp of MongoDB’s sharding ecosystem, enabling
    you to design scalable architectures that support your application’s evolving
    data demands.


    This chapter will cover the following topics:


    +   - How sharding enables horizontal scalability by distributing data across
    replica sets

    +   - The roles and functionalities of shards, mongos processes, and config servers
    in a sharded cluster

    +   - Strategies for selecting an efficient shard key to optimize data distribution
    and query targeting

    +   - Comparing range-based, hashed, and zone-based sharding methods for varying
    workloads'
  merge: -1
  img_proc: true
- pgno: 154
  md: '+   - Using resharding to redistribute data and address performance bottlenecks
    without downtime

    +   - Techniques for colocating related data to improve transaction and aggregation
    query performance

    +   - Configuring and monitoring the balancer to manage chunk migrations effectively

    +   - Approaches to refine shard keys to resolve issues such as jumbo chunks or
    poor granularity


    # Understanding core sharding architecture


    MongoDB’s sharding works with replication to provide **horizontal scaling** for
    deployments with large datasets and high-throughput requirements. Traditionally,
    when a workload exceeded the capabilities of the database server, it had to be
    upgraded to a bigger server. This is known as **vertical scaling**, and it’s limited
    in terms of both the maximum size of any particular server and the price-performance
    ratio; supercomputers tend to be very expensive! Instead, if you can distribute
    the workload to multiple smaller servers, you can theoretically scale your workload
    horizontally nearly infinitely, with, ideally, the costs rising linearly with
    the number of servers. This is what MongoDB sharding allows you to do when your
    workload outgrows the capabilities of a single replica set.


    If your workload has multiple distinct databases that are relatively isolated
    from each other, there is nothing wrong with deploying a separate replica set
    for each one of them. For instance, you might have a separate replica set for
    users, another for accounts, and a third one for user activity. However, over
    time, even a single cluster may no longer be able to handle a distinct subset
    of your overall application workload. That’s when it becomes necessary to shard
    or partition the workload across multiple shards, each one of which is itself
    a replica set.


    So, when your data grows beyond what a single replica set can handle, sharding
    distributes it across multiple replica sets, each containing a subset of your
    data. This horizontal scaling allows MongoDB to handle massive datasets and high
    throughput requirements. This section reviews what the architecture of a sharded
    cluster is and its important performance elements.


    # Architectural components of a sharded cluster


    A sharded cluster consists of several components: **shards** (each a replica set
    responsible for a subset of data in the cluster), **mongos processes** (which
    are primarily responsible for routing operations to different shards and returning
    results back to the client), and **config servers** (a special replica set that
    maintains metadata about sharding configuration and location of data in the cluster).
    Starting from MongoDB version 8.0, config servers don’t need to be separate servers
    and can be embedded with one of the shards.'
  merge: -1
  img_proc: true
- pgno: 155
  md: 'mongos is the most interesting component here because from the point of view
    of the driver or client application, it acts as if it’s the database, accepting
    CRUD operation requests and returning results to the driver. On the flip side,
    it acts as the proxy for the driver when it’s talking to shards, sending them
    CRUD operations, and then forwarding the result back to the driver. Normally,
    there are multiple mongos processes in a production sharded cluster. Figure 6.1
    shows all the components of a sharded cluster and how the application connects
    to it.


    ![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_155_0.png)


    Cluster with a dedicated config server


    *Figure 6.1: Sharded cluster architecture*


    But how does mongos know which shards to forward the operations to? Based on the
    information persisted in the config servers, mongos keeps a current routing table,
    meaning for each collection, it knows where its data lives, and if the collection
    is sharded, it tracks where each part of the collection is located. It then forwards
    the operations it receives to one or more shards, as needed, and if it’s more
    than one shard, then it also has to merge or combine results from each of the
    shards to return a single result to the client.


    # Sharding a collection and selecting a shard key


    When you first deploy a sharded cluster, you have to decide how you want to distribute
    the data across the shards. This is critical for achieving horizontal scalability
    because a scalable sharded cluster distributes data in a way that operations are
    divided equally across all the shards. This means you want all your read and write
    operations to be spread roughly equally across all the shards.'
  merge: -1
  img_proc: true
- pgno: 156
  md: "While you can choose to isolate different collections to different shards,\
    \ most commonly, sharding is employed when you have a large enough collection\
    \ that can’t be handled by a single shard. At this point, you have to shard or\
    \ partition the collection, and you get to decide how it will be partitioned by\
    \ selecting a shard key.\n\nThe shard key value is used to split the collection\
    \ logically into ranges, called chunks. These chunks are then distributed across\
    \ shards in a way that aims to balance the data evenly across all the shards.\
    \ In older versions of MongoDB, this typically meant that each shard had roughly\
    \ the same number of chunks, but in newer versions, chunks are only split when\
    \ necessary. As a result, while data is still distributed evenly, this doesn’t\
    \ necessarily translate into the same number of chunks on each shard.\n\nConsider\
    \ a simple example: if your shard key is username and the values of username range\
    \ from aaaa to zzzz, then your chunks may be divided into ranges such as a-b,\
    \ c-d, e-f, and so on. The balancer, a background process that runs on the sharded\
    \ cluster, will automatically distribute data corresponding to these chunk ranges\
    \ to all the shards, ensuring approximately equal distribution of data.\n\n> **Balancer\
    \ limitations in assessing shard key activity**\n> \n> The balancer acts based\
    \ on data size alone and cannot determine which ranges of shard key values may\
    \ be more *active* than others.\n\nNow, mongos will route operations that include\
    \ username starting with a specific letter to the shard that *owns* the chunk\
    \ range that includes this username.\n\nYou must be wondering, what happens to\
    \ a request that doesn’t include a username? In such cases, mongos has to send\
    \ the request to all the shards. This type of request is called a **broadcast**\
    \ or **scatter-gather** operation, and it doesn’t scale horizontally nearly as\
    \ effectively as targeted single-shard operations.\n\n# Why scatter-gather is\
    \ bad\n\nIt’s a common misconception that scatter-gather queries are efficient\
    \ simply because each shard only has to process a small subset of the data. While\
    \ this may seem intuitively true, and indeed mirrors how the original map-reduce\
    \ data process worked (by splitting huge amounts of work across many servers),\
    \ this approach doesn’t scale well horizontally in most cases. Let’s explore why\
    \ that is."
  merge: -1
  img_proc: true
- pgno: 157
  md: 'When a query request goes to a single shard, that shard executes the operation
    and sends the results back to mongos, which forwards them to the client. But when
    a query request targets all the shards (a scatter-gather operation), each shard
    has to execute the operation on its own portion of the data and send the result
    back to mongos to merge and forward it to the client. Notice something about these
    two scenarios? In targeted queries, only one shard has to execute the operation.
    In scatter-gather queries, every shard has to execute the operation.


    So, in a cluster with 20 shards, a single scatter-gather operation is translated
    into 20 operations. Even though it may seem like a cheaper operation, processing
    only 1/20th of the total data, the operation execution overhead is still the same
    for each shard, and mongos has to do the extra work of merging the results. In
    some cases, mongos cannot start returning data to the client until it has heard
    back from every shard that received the query.


    Suppose your cluster is processing tens or hundreds of thousands of queries. Here’s
    how a single request going to one shard versus a scatter-gather query scaling
    across a 20-shard cluster will look:


    | Client queries | Targeted queries only | Scatter-gather queries only |

    |---|---|---|

    | 100 | 100 | 2,000 |

    | 1,000 | 1,000 | 20,000 |

    | 10,000 | 10,000 | 200,000 |

    | 100,000 | 100,000 | 2,000,000 |


    *Table 6.1: Table showing total queries executing across all 20 shards*


    Now, imagine if you were to double the number of shards in Table 6.1. The targeted
    queries column will remain the same, but the scatter-gather queries column will
    double! So, you don’t get the benefit of linear scaling because increasing the
    number of shards in your cluster will increase the total number of queries too.
    As an additional detriment, scatter-gather queries that need to hear from all
    the shards increasingly get slower as the number of shards grows. This is because
    the chances of one shard experiencing a latency hiccup (such as a network misconfiguration,
    an election, or a crash) also increase. This contributes to additional latency
    to every broadcast query, unlike targeted queries, which only impact a subset
    of queries directed to the impacted shard.


    # Strategic shard key selection


    Shard key selection is a critical decision that directly impacts the performance
    and scalability of a sharded cluster. A good shard key can target the operations
    to specific shards, provide appropriate granularity to evenly distribute data,
    and minimize the risk of creating hot shards. Let’s look at some important elements
    of a good shard key.'
  merge: -1
  img_proc: true
- pgno: 158
  md: '# Shard key for targeting operations


    To understand how data partitioning influences the distribution of operations,
    let’s look at another example of how collections can be partitioned across shards
    based on the defined shard key.


    Suppose you have an orders collection. You might partition it by order_id, which
    is unique and will allow many chunk ranges to be created, allowing fine distribution
    of data across shards. However, if order_id is monotonically increasing, then
    the last chunk (the one from a high order_id to maxInt range) will always get
    all the new inserts.


    That may or may not be a problem. If new order creation is the bottleneck in your
    system, this could be problematic, but if new orders are created relatively infrequently
    and the majority of the load is from orders being updated, read, or aggregated,
    it may not be a big issue.


    Now, let’s consider an operation that reads all recent orders for a particular
    customer. Since you don’t know which range the customers’ orders are in, you will
    have to broadcast the query to all the shards that have chunks for the orders
    collection, as shown in Figure 6.2, and that’s problematic for horizontal scalability.


    ![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_158_0.png)


    *Figure 6.2: Broadcasting query*


    If you know that your application will always have the customer_id value when
    it’s dealing with an order (a reasonable assumption), it would be better to use
    a compound shard key such as {customer_id:1,order_id:1}. This will keep each customer’s
    orders on a single shard (since they will tend to fall within a single chunk),
    and queries about a particular customer’s orders will be targeted to a single
    shard instead of scattered to all shards.'
  merge: -1
  img_proc: true
- pgno: 159
  md: 'In Figure 6.3, all the orders for customer A are within the chunk covering
    from the lowest customer_id (inclusive) to customer I (exclusive), which is on
    shard A. As such, the query for all the recent orders for customer A will only
    be sent to shard A. As an additional benefit, new orders will no longer be created
    on the same shard. However, in this case, all your operations on orders must include
    both customer_id and order_id values in the query to ensure they’re targeted to
    a single shard.


    ![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_159_0.png)


    Figure 6.3: Targeting query


    Scaling sharded clusters is all about targeting operations to as few shards as
    possible. A great shard key will allow the majority of the operations to be targeted
    to a single shard.


    # Shard key with good granularity


    You’ve probably heard that it’s important to choose a shard key that gives you
    good granularity, primarily because it allows chunks to split effectively. The
    example we looked at in the previous section illustrated this well. Since order_id
    is unique, any shard key that includes it as a component can be easily split into
    smaller chunks. But why is granularity so important, and what will happen if your
    shard key isn’t granular enough?


    Imagine a multi-tenant system where the shard key is tenant_id. At first glance,
    it seems like a good idea because every tenant operation always includes the tenant_id
    value, which is great for targeting the operations for a specific tenant to one
    shard, and new tenants are not created fast enough for you to worry about all
    the inserts going into a single chunk range. However, what if one single tenant
    became a power user, generating so much data in the collection that it is just
    too big to fit on one shard?'
  merge: -1
  img_proc: true
- pgno: 160
  md: 'The way that you can locate data on two shards is by deciding which values
    of the shard key will live where. However, in our case, all of the tenant’s data
    has the same shard key value, making the data unsplittable, and the chunk that
    contains the data is now labeled a jumbo chunk. In Figure 6.4, tenant_I has a
    lot of data, and the chunk from tenant_I (inclusive) to tenant_J (exclusive) is
    labeled jumbo. Shard B has more data than shard A, however, since the chunk is
    unsplittable, the balancer is unable to move data from shard B to shard A to balance
    the data. This is where refining or extending the shard key can help by adding
    another field as a component of the shard key after tenant_id.


    # Shard key: tenant_id


    ![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_160_0.png)


    Figure 6.4: Shard key on tenant_id


    Luckily, there is a command to refine the shard key without any downtime, and
    it allows you to extend your shard key when it’s not granular enough. This is
    an inexpensive operation as it allows you to add a field or multiple fields without
    having to move any data. Once the shard key is extended with another field (for
    instance, _id or another field that makes sense in your data model), MongoDB can
    then split the chunk for the big tenant on the _id value, and some of its data
    can be balanced or moved to another shard. In Figure 6.5, after refining the shard
    key, the previous jumbo chunk can now be split, and some of the data can be moved
    to the other shard.


    # Shard key: tenant_id, _id


    ![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_160_1.png)


    Figure 6.5: Refine the shard key and wait for the data to be balanced'
  merge: -1
  img_proc: true
- pgno: 161
  md: 'The best shard key will be granular enough to allow splitting ranges of data
    for better distribution across shards.


    # Avoid increasing or decreasing shard key values


    You may have read that a monotonically increasing shard key is a bad idea. In
    fact, as highlighted in the earlier example, it is something you should be concerned
    about if there is likely to be a bottleneck of new document inserts. Let’s look
    at an example where that would likely be the case and why it would be a problem.


    Think back to the Socialite app example from Chapter 2, Schema Design for Performance.
    Consider the content collection, which receives user posts. This collection experiences
    a high number of writes, primarily from users inserting new posts into the collection.
    Now imagine sharding the content collection by the _id value of each post, using
    the default ObjectId type. Since the first four bytes of ObjectId represent the
    current timestamp, you might think it is useful to have it as a proxy for created
    time, and that it’s not a bad idea to have all recent posts on the same shard
    for targeting purposes. After all, users usually only want to read the most recent
    posts, right? However, what this results in is every insert going into the highest
    chunk range.


    ![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_161_0.png)


    *Figure 6.6: Hot shard caused by a monotonically increasing shard key*


    As you can see in Figure 6.6, new inserts are going to turn whichever shard has
    the top chunk into the hot shard, while the other shards won’t receive any writes
    at all (since posts are usually neither updated nor deleted). Even if your schema
    design includes updating posts with something such as the count of likes, the
    activity will be concentrated on only recent posts (because how often do users
    go back months to like someone’s post from back then?). So, the only writes that
    aren’t going to the top chunk would be the deletes (when users decide to clean
    up or archive old content), right? But even those would also create a hot chunk
    by going to the lowest range values!'
  merge: -1
  img_proc: true
- pgno: 162
  md: 'You also wouldn’t get any benefit from targeting the reads, because when you
    query for posts to show to someone, they are usually either your friends’ posts
    or your own posts. The query would look something like this:


    ```

    // Query to get latest 20 posts for a subset of users

    // This query may result in a scatter-gather operation


    db.posts.find({userId:{$in:["..."]}}).sort({_id:-1}).limit(20)

    ```


    This kind of query, to get the latest 20 posts to show for a subset of users,
    is likely to result in a scatter-gather query. Not only that, but such a query
    requires waiting for all shards to sort their results, merge them on mongos, and
    start returning any results to the client. Since the most important thing in a
    social media app with a feed is to start showing results as quickly as possible,
    this is not acceptable.


    The solution would probably be to use a better shard key. The most obvious one
    would be to shard by {userId:1, _id:1}, which will likely colocate every user’s
    content in the same chunk, meaning that as hundreds or thousands of users are
    creating new posts, they will likely be distributed to all the shards that own
    the chunks for those users. If your userId is random (as any user-selected name
    would be), your distribution will be random as well. But even if you use some
    sort of system-generated, unique, monotonically increasing value, and even if
    your new users tend to be more active at first, this would be balanced out by
    all the already-existing users creating content and distributing the writes more
    or less evenly across the shards.


    This is a similar approach to one we saw in the earlier example of orders, where
    prefixing customer_id to order_id makes a better shard key than just order_id
    alone. In multi-user or multi-tenant systems, always consider making the leading
    field of the shard key your user or tenant ID to maximize query targeting for
    each user or tenant.


    Note that it’s not necessarily a good idea to randomize a monotonically increasing
    shard key value by hashing it. We will look at some trade-offs to consider before
    deciding to hash your shard key in the next section.


    If you’re still not confident in your shard key choice before sharding or resharding
    a collection, you can always use the configureQueryAnalyzer command to collect
    a sample of queries on your collection, then run the analyzeShardKey command to
    evaluate a shard key for this collection.'
  merge: -1
  img_proc: true
- pgno: 163
  md: '# Types of sharding


    Fundamentally, MongoDB supports one core mechanism for distributing data across
    shards: **range-based sharding**. However, it also offers two special flavors
    that are best for different use cases: **hashed sharding** and **zone-based sharding**.
    Let’s explore how they work, how they are related to each other, and when each
    would be an appropriate choice.


    # Range-based sharding


    Range sharding is the default and most intuitive approach. This is what we have
    been describing in this chapter so far. Range sharding splits data by the natural
    order of shard key values and then distributes the ranges of data to different
    shards. This is the right method for most use cases; just be sure to pick a good
    shard key for your read and write patterns. All the examples we’ve discussed so
    far use regular range sharding. All other sharding methods use range sharding
    as their foundation, but they give you additional abilities on top to either change
    the values used for ranges or to influence how the ranges are balanced across
    your cluster.


    # Hashed sharding


    Hashed sharding takes your shard key, runs it through a hash function, and then
    applies ranges to those hashed values. The result is similar to shuffling all
    your pages before placing them into volumes, which is great for spreading things
    out randomly. All the operations automatically do this hashing, so your application
    doesn’t need to change anything in the way it queries the data.


    Imagine storing logs or events in a huge collection where the _id value of each
    event is always increasing. With range sharding, all those records have to be
    inserted into the same shard. But if you use { _id: "hashed" }, the system will
    distribute them randomly, avoiding insert hotspots.


    There are multiple pitfalls and extra costs with hashing the shard key value.
    Range queries on the hashed shard key are inefficient, and there is an additional
    random access index to maintain on every insert. Most importantly, you need to
    remember that you don’t gain any additional *granularity* by hashing the shard
    key value. If your distribution is bad because of poor granularity of the shard
    key (not enough distinct values), then hashing them won’t change that at all.
    You’ll still have poor distribution with the added overhead of a hashed key.


    In cases where a hashed shard key is still the best option for your use case,
    MongoDB version 7.0 introduced the ability to drop the hashed index, provided
    you have a different index to support the shard key and your collection is already
    balanced. Once you drop the hashed shard key index, no more balancing takes place,
    but you save on having to maintain the hashed index on every insert.'
  merge: -1
  img_proc: true
- pgno: 164
  md: "# Zone-based sharding\n\nZone sharding is a way to control which ranges of\
    \ data reside on which sets of shards based on a policy that you create. It’s\
    \ a way to introduce geography into the picture, or just a way to limit a sharded\
    \ collection to a subset of shards. There are two steps to follow to use zone\
    \ sharding. You assign zone tags or labels to a shard or set of shards, and then\
    \ specify shard key ranges to be associated with these specific zones, giving\
    \ you control over where the data is physically stored.\n\nConsider a global SaaS\
    \ company that wants to store user data for European users in the EU for compliance.\
    \ By zoning shard ranges for the \"EU\" region to Frankfurt-based shards and the\
    \ \"NA\" region to North America-based shards, it keeps data local, fast to access,\
    \ and policy-compliant.\n\nHere is what those steps look like in database commands\
    \ that shard the collection, assign appropriate zones to shards, and add shard\
    \ key ranges to zones:\n\n```\n// Shard a collection and assign zones for geo-based\
    \ data placement\nsh.shardCollection(\"db.coll\", {country:1, userid:1})\nsh.addShardToZone(\"\
    shard0\", \"NA\")\nsh.addShardToZone(\"shard1\", \"EU\")\nsh.addTagRange(\"db.coll\"\
    , \n{country:\"DE\",userid:MinKey},{country:\"DE\",userid:MaxKey},\"EU\")\nsh.addTagRange(\"\
    db.coll\", \n{country:\"US\",userid:MinKey},{country:\"US\",userid:MaxKey},\"\
    NA\")\n```\n\nYou can find more examples in the MongoDB documentation:\n\n+  \
    \ - *Segmenting Data by Location:* https://www.mongodb.com/docs/manual/tutorial/sharding-segmenting-data-by-location/\n\
    +   - *Segmenting Data by Application or Customer:* https://www.mongodb.com/docs/manual/tutorial/sharding-segmenting-shards/\n\
    +   - *Distributed Local Writes for Insert Only Workloads:* https://www.mongodb.com/docs/manual/tutorial/sharding-high-availability-writes/\n\
    +   - *Distribute Collections Using Zones:* https://www.mongodb.com/docs/manual/tutorial/sharding-distribute-collections-with-zones/\n\
    \nOnce the number of shards in your cluster grows, you will want to exercise more\
    \ control over where each sharded (and unsharded) collection is located. For instance,\
    \ you may have two huge sharded collections across 10 shards, but rather than\
    \ having each collection on each of the 10 shards, you may prefer to have each\
    \ collection only on 5 of its own shards. This can help in a number of ways:"
  merge: -1
