- pgno: 48
  md: '# Key architectural components of MongoDB


    The MongoDB server uses a single mongod process that can run anywhere. You can
    deploy the mongod process on many classes of computers, including laptops, self-managed
    servers within data centers within your business, cloud instances managed by your
    business, and cloud instances managed by MongoDB Atlas.


    Many of the concepts we’ll discuss apply to this server process; however, it’s
    also a building block of the MongoDB distributed system. A basic deployment in
    production would usually at a minimum be a **replica set** with three computers,
    each running a mongod process. One of them would be the primary, and the other
    two would be secondaries. All members of a replica set have the same copy of the
    data. You will learn more about this in *Chapter 5, Replication*, but the most
    important thing to know is that replication provides high availability for your
    application by monitoring the health of all members and electing a new primary
    automatically should there be a failure of the old primary.


    When you horizontally scale MongoDB, you would treat your replica set as the first
    **shard** and then add as many additional shards as you need. Each shard is a
    replica set. Each shard holds a subset of the data, and a smart **router** process
    directs operations to the correct shard, eliminating the need for your application
    to know how the data is distributed. You’ll learn more about this in *Chapter
    6, Sharding*.


    Atlas is an integrated suite of cloud database and data services to accelerate
    and simplify how you build with data. Atlas extends MongoDB’s flexibility and
    ease of use to enable you to build full-text search, real-time analytics, and
    event-driven features.


    MongoDB client libraries (or drivers) allow your application code to communicate
    with the database using a native library and APIs that look like any other API
    in the language you’re using. You construct a request in your preferred programming
    language, and the driver converts it to messages MongoDB understands.


    MongoDB provides official drivers for most of the popular programming languages,
    including Python, Java, C#, and Node.js, among others. You can find the full list
    in the MongoDB documentation at https://www.mongodb.com/docs/drivers/.'
  merge: -1
  img_proc: true
