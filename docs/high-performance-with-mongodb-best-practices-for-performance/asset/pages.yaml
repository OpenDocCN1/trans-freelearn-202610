- pgno: 267
  md: 'For more information on the above connection pooling parameters, make sure
    to check out the MongoDB documentation at https://www.mongodb.com/docs/manual/tutorial/connection-pool-performance-tuning/.


    Connection pool behavior varies significantly depending on whether the driver
    is synchronous or asynchronous. For synchronous drivers, when no connections are
    available, the calling thread blocks operations until a connection becomes available
    or the wait queue timeout expires. On the other hand, asynchronous drivers return
    a future or promise that resolves when a connection becomes available, instead
    of blocking.


    # MongoDB server connection handling


    Efficient connection handling supports scalable, high-performance MongoDB deployments.
    On the server side, MongoDB uses a combination of configurable parameters and
    operating system-level resources to manage incoming client connections:


    +   - **net.maxIncomingConnections**: Controls the maximum number of simultaneous
    client connections (default: 1 million on Windows; on Linux, defaults to 80% of
    the maximum file descriptor limit). Since each connection requires a file descriptor,
    this limit helps prevent resource exhaustion on the server.

    +   - **Operating system limits**: File descriptor limits (`ulimit -n` on Linux/Unix
    systems) can also restrict the number of connections.


    The specifics of connection management also depend on the deployment topology
    (whether it’s a standalone instance, a replica set, or a sharded cluster):


    +   - **Standalone**: Applications connect directly to a single MongoDB server
    with a single connection pool

    +   - **Replica set**: Drivers discover all members and maintain separate connection
    pools for each, routing operations based on read preferences

    +   - **Sharded cluster**: Applications connect to mongos routers, which maintain
    their own connections to shards, creating a multi-tier connection architecture


    Now that you’re familiar with MongoDB’s connection architecture, let’s discuss
    how it facilitates monitoring and troubleshooting connections.'
  merge: -1
