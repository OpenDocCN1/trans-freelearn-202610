- pgno: 307
  md: '# 13


    # Operating Systems and System Resources


    When running a self-managed MongoDB deployment, you have the flexibility to configure
    kernel and operating system settings to suit your specific needs. However, this
    flexibility also introduces additional variables and potential performance bottlenecks
    that must be carefully considered during tuning.


    This chapter is primarily relevant to self-managed environments, as MongoDB Atlas
    does not permit direct access to the underlying operating system. In Atlas, configuration
    is handled based on instance tier, and operating system upgrades are managed automatically
    to prevent unexpected performance issues due to kernel or system changes. Additionally,
    Atlas can auto-scale compute and storage in response to workload changes, which
    is a capability that we’ll explore later in the chapter.


    In this chapter, you’ll learn how to do the following:


    +   - Optimize system performance by understanding the impact of infrastructure
    choices

    +   - Fine-tune operating system and storage configurations for improved reliability
    and throughput

    +   - Identify and address performance bottlenecks in both self-managed and managed
    (Atlas) environments'
  merge: -1
  img_proc: true
- pgno: 308
  md: '# Technical requirements


    This chapter will mainly focus on Linux and high-level operating system concepts.
    For details on specific operating systems and MongoDB versions, see the documentation
    operations checklist at https://www.mongodb.com/docs/manual/administration/production-checklist-operations/
    and the production notes at https://www.mongodb.com/docs/manual/administration/production-notes/
    for self-managed deployments.


    To monitor utilization of all kinds of system resources, you can use operating
    system commands, MongoDB Atlas monitoring, and other GUI tools that are designed
    specifically for monitoring multiple servers. More details will be provided in
    *Chapter 14, Monitoring and Observability*.


    For system resources, Linux commands such as top, vmstat, iostat, and netstat
    can be used to monitor CPU, memory, storage, and network, respectively, at a point
    in time on a single server. Tools such as dstat and sar can be used to combine
    data from simpler tools and view it over a period of time.


    MongoDB Atlas monitoring provides historical and real-time system resource data,
    which is integrated with database-specific metrics.


    For self-managed deployments, you can use graphical tools such as Netdata, Prometheus
    + Grafana, Zabbix, Munin, or Observium. Finally, you can use commercial **application
    performance monitoring (APM)** tools such as AppDynamics, Datadog, Dynatrace,
    LogicMonitor, New Relic, SolarWinds, and Splunk Observability.


    To try the configuration changes or commands mentioned in this chapter, you will
    need to use a Linux server and install MongoDB locally. You can download the MongoDB
    Community Edition from mongodb.com. You will also need to download the official
    drivers for the language of your choice (Ruby or Python): https://www.mongodb.com/docs/drivers/.


    # Managing resources for optimal performance


    So far, throughout this book, we’ve explored situations where performance is limited
    by a resource being used to its full capacity. For example, these resources can
    include CPU cycles, memory, storage, or network bandwidth. To improve performance,
    we either need to increase the availability of the limiting resource or reduce
    its usage. This section provides an overview of each type of resource and describes
    how it can impact MongoDB performance.'
  merge: -1
  img_proc: true
- pgno: 309
  md: '# CPU utilization


    If the CPU on the primary MongoDB server is the current bottleneck for your application,
    you may need to scale up to faster instances with more cores. If you’re running
    MongoDB as a replica set and have already scaled the instances or systems as much
    as possible, it might be time to shard. This was covered in detail in Chapter
    6, Sharding.


    Alternatively, you can optimize your application’s queries and database operations
    to minimize their CPU footprint. This includes using appropriate indexes, designing
    efficient data models, and avoiding inefficient aggregation pipelines or sort
    operations that can consume excessive CPU cycles. These techniques were discussed
    in more detail in Chapters 2, 3, 4, and 12.


    By default, the MongoDB server is configured to use all available CPU cores on
    the system it’s running on. This is a deliberate choice to maximize the database’s
    ability to process multiple simultaneous queries, handle concurrent connections,
    and manage internal operations efficiently. The WiredTiger storage engine, for
    instance, benefits significantly from multi-core parallelism.


    If you’re self-managing MongoDB, it’s recommended to deploy the MongoDB servers
    on dedicated machines. Running other CPU-intensive software on the same system
    is strongly discouraged. Diagnosing performance issues becomes significantly more
    complex when multiple applications are competing for the same resources.


    At MongoDB, the efficiency of the database server is continuously being improved
    by tuning code and adopting modern compilers, linkers, and optimizers that make
    better use of CPU cycles. This process involves careful code tuning to reduce
    overhead, eliminate bottlenecks, and streamline critical operations. MongoDB also
    evaluates new hardware architectures, instruction sets, and tools to generate
    more optimized machine code, leading to lower resource consumption. This two-pronged
    approach (software-level and technology-level optimization) is central to MongoDB’s
    mission of delivering a high-performance, resource-efficient database.


    Later in the chapter, in the Configuring systems for MongoDB performance section,
    we’ll explore practical examples of how to ensure CPUs are being utilized effectively
    and how to identify whether other applications are impacting CPU availability
    for the MongoDB server.


    # Memory management


    Figure 13.1 shows a high-level diagram of the memory layout of a system running
    a MongoDB server. It’s useful to keep this in mind as you work on performance
    tuning, because some features will use more data than others, which, in turn,
    reduces the amount of memory available for the filesystem (page) cache, leading
    to more I/O requests being directed to storage devices.'
  merge: -1
  img_proc: true
- pgno: 310
  md: '![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_310_0.png)


    *Figure 13.1: Memory layout of a system running the MongoDB server*


    At a fundamental level, the server’s memory usage can be broadly categorized into
    several key components, each playing an important role in its overall functionality.


    Starting from the bottom of the diagram, we have the following:


    +   - **OS/resident binaries:** This is the code in memory for the operating system
    and the MongoDB server binary.

    +   - **MongoDB static structures:** Metadata that the server uses and allocates
    when it first starts.

    +   - **WiredTiger cache:** By default, this is 50% of memory (minus 1 GB). The
    WiredTiger cache holds frequently accessed data and indexes in RAM to minimize
    disk I/O. We covered this cache in some detail in *Chapter 7, Storage Engines*.
    Some Atlas instances may use different relative sizes for the WiredTiger cache.

    +   - **MongoDB dynamic “working” memory:** MongoDB uses memory buffers to construct,
    parse, and manipulate BSON documents during operations. When queries are executed,
    MongoDB allocates memory for various operations, including sorting, aggregation
    pipeline stages, and projection operations. Complex queries or those involving
    large sorts or aggregations can temporarily consume significant amounts of memory.
    Very large sort operations may spill to disk. Each active client connection to
    the MongoDB server consumes a certain amount of memory, and a large number of
    concurrent connections can cumulatively use a substantial portion of RAM.'
  merge: -1
  img_proc: true
- pgno: 311
  md: "+   - **“Free” memory (page cache)**: This refers to the remaining memory,\
    \ typically used by the kernel to cache filesystem data in RAM to avoid repeated\
    \ disk I/O. It provides a second layer of caching beyond WiredTiger’s cache and\
    \ is particularly beneficial in scenarios where the WiredTiger cache is heavily\
    \ utilized.\n\nUnderstanding this memory distribution helps you better diagnose\
    \ performance issues and make informed decisions about where to optimize system\
    \ resources.\n\n# Storage\n\nDifferent types of storage devices typically have\
    \ their own set of performance limitations. Physical storage devices generally\
    \ fall into two main categories: mechanical HDDs and SSDs. Networked disks and\
    \ virtual drives in cloud environments have other limitations.\n\nThe performance\
    \ of physical storage devices is constrained by the following factors:\n\n+  \
    \ - **Bus interface speed**: The bandwidth of the device’s connection, such as\
    \ SATA, PCIe, or NVMe, can cap the maximum available throughput.\n+   - **Memory\
    \ and cache size**: Most modern storage devices contain internal memory and cache.\
    \ Insufficient caching can lead to bottlenecks when handling large amounts of\
    \ data.\n+   - **Fragmentation**: Data scattered across sectors or blocks can\
    \ increase seek times and reduce performance for both HDDs and SSDs.\n+   - **Read\
    \ vs. write operations**: Write operations often require more processing than\
    \ read operations, especially for SSDs, due to erase-before-write requirements.\n\
    \n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_311_0.png)\n\n> **Erase-before-write**\n\
    > \n> SSDs use NAND flash memory, which requires data to be erased before new\
    \ data can be written to the same location. This can slow down successive write\
    \ operations, especially if many blocks need erasing. To mitigate this, SSD firmware\
    \ and the operating system’s TRIM functionality can preemptively clean up unused\
    \ cells to ensure available space, avoiding erase delays for future writes.\n\n\
    +   - **Sequential vs. random I/O**: Sequential reads and writes typically have\
    \ higher throughput compared to random I/O due to reduced mechanical movement\
    \ (for HDDs) or reduced overhead (for SSDs)."
  merge: -1
  img_proc: true
- pgno: 312
  md: '+   - **Concurrent access:** High levels of concurrent I/O requests can overwhelm
    the capabilities of the storage device, especially if it lacks efficient queue
    management or optimizations for parallel access.

    +   - **Medium degradation:** Both HDDs and SSDs can experience reduced performance
    over time—HDDs due to mechanical wear, and SSDs due to wear on NAND flash memory
    cells.

    +   - **Overfilling storage:** Storage devices typically perform worse when they’re
    close to full capacity. This is particularly true for SSDs, where over-provisioning
    space is required to sustain consistent write performance.


    HDDs are less frequently used now in high-performance systems. At the time of
    writing, the cost per GB of HDDs is still lower than SSDs, but the gap is closing.
    For HDDs, the performance-limiting factors include the following:


    +   - **Disk speed:** The spinning speed of platters (measured in **revolutions
    per minute (RPM)**) affects latency and sustained throughput

    +   - **Read/write head movement:** The movement and positioning of the read/write
    head introduce mechanical delays (seek time)


    SSDs offer various advantages over HDDs in performance, durability, and power
    efficiency. For SSDs and flash storage arrays, the limiting factors include the
    following:


    +   - **NAND limitations:** NAND cell programming time and the number of simultaneous
    operations in a NAND array can limit performance

    +   - **Wear leveling:** Performance can degrade if wear-leveling algorithms become
    inefficient or fail to manage writes effectively across NAND cells

    +   - **Firmware optimizations:** SSD controllers use internal algorithms (such
    as garbage collection, wear leveling, and over-provisioning) that can impact performance,
    especially under heavy workloads

    +   - **Overheating:** Excessive heat can throttle the performance of modern SSDs,
    as internal thermal management mechanisms reduce performance to prevent damage


    For networked disks and virtual drives in a cloud environment, the following factors
    can constrain or limit performance:


    +   - **Bandwidth:** The speed at which data can be transmitted over the network
    can limit storage performance in **network-attached storage (NAS)** or **storage
    area networks (SANs)**

    +   - **Latency:** Network latency can introduce delays that are critical for
    applications requiring low-latency I/O

    +   - **Concurrent network I/O:** High volumes of simultaneous network traffic
    accessing storage can lead to contention and bottleneck issues'
  merge: -1
  img_proc: true
- pgno: 313
  md: "A filesystem connects the operating system and block storage devices, providing\
    \ a unified abstract interface across physical disks, networked disks, and virtual\
    \ drives in a cloud environment. Choosing the right filesystem is critical, as\
    \ it can have significant performance implications. With a self-managed MongoDB\
    \ deployment, you have the option to use separate storage devices for the journal\
    \ and data files. By separating journal files and data files onto different storage\
    \ devices, you minimize I/O contention between journal writes and data reads/writes.\
    \ This can improve performance for high-write workloads.\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_313_0.png)\n\
    \n> **Tip**\n> \n> Place journal files on a fast SSD or NVMe drive. This enables\
    \ MongoDB to handle frequent sequential writes much faster, without competing\
    \ for I/O bandwidth with the main data files.\n\nData files, which are typically\
    \ larger and require bulk storage, can be placed on higher-capacity, cost-effective\
    \ storage solutions (e.g., slower HDDs). However, there are some downsides to\
    \ consider. Managing separate storage devices for journal and data files introduces\
    \ complexity and increases the probability of failure:\n\n+   - You have two devices\
    \ to configure, monitor, and investigate for potential bottlenecks.\n+   - Using\
    \ two devices increases the probability of failure. For example, the typical **annualized\
    \ failure rate (AFR)** for enterprise SSDs is currently 0.3%–0.8% per year. If\
    \ we use the midpoint of that range (0.55%), and the server is using two SSDs\
    \ independently for journal and data, the AFR for the storage would be 1.1%. As\
    \ a safety net, the MongoDB replication mechanism protects against the risk of\
    \ such failures.\n+   - In cloud environments, separating journal and data files\
    \ onto different virtual disks may still lead to hidden contention.\n+   - It\
    \ can make it challenging to perform a consistent snapshot of both the journal\
    \ and data files. Snapshots are often used to take instantaneous backups of the\
    \ database, and consistent snapshots depend on atomicity across both the journal\
    \ and data files.\n\nA data services platform, such as a database, depends on\
    \ the underlying storage technology. This means it’s important, from both a performance\
    \ and lifecycle point of view, to understand the characteristics of the technology\
    \ you’re using."
  merge: -1
  img_proc: true
- pgno: 314
  md: '# Network


    Networking plays a crucial role in the performance of a MongoDB deployment. The
    following are key networking factors that can limit MongoDB performance:


    +   - **High network latency:** This causes delays in communication between the
    application and the MongoDB database, or between cluster nodes in a sharded or
    replicated setup.

    +   - **Insufficient network bandwidth:** This limits the flow of data between
    MongoDB components, especially in high-throughput environments, affecting read
    and write operations.

    +   - **Packet loss:** This occurs when data packets fail to reach their destination
    due to network congestion, hardware faults, or misconfiguration. This can lead
    to the following:

    +     - Increased retries on failed operations, slowing down overall database
    performance

    +     - Potential replication lag on secondary nodes of a replica set

    +     - Interruptions in communication between shards in a distributed cluster

    +   - **Slow or unreliable DNS resolution:** This causes delays in connecting
    to MongoDB servers, particularly during initial connections or failover events.

    +   - **High network traffic:** Competition for shared resources can degrade MongoDB’s
    ability to transmit or receive data efficiently.

    +   - **Misconfigured firewalls:** Overly restrictive security policies may block
    or delay legitimate traffic, affecting MongoDB performance.

    +   - **Inconsistent network topology:** A poorly designed network infrastructure
    can cause asymmetric routing, inconsistent latency, or inefficient data flow.

    +   - **Geographic latency:** Deploying MongoDB nodes across geographically distant
    regions can introduce significant communication delays.


    Slow or unreliable network connections can severely affect database throughput,
    latency, and scalability.


    In summary, performance bottlenecks often arise from using a resource to its full
    capacity. The most common examples are CPU cycles, memory, storage, and network.
    It’s worth noting that with MongoDB Atlas, many of these resources are managed
    for you.'
  merge: -1
  img_proc: true
- pgno: 315
  md: '# Configuring systems for MongoDB performance


    In this section, we will look at actions you can take to diagnose and fix example
    issues with CPU cycles, memory, storage, and network.


    # Understand the ideal ratio of simultaneous operations per CPU core


    The MongoDB server runs multiple operations concurrently and distributes them
    across threads running on multiple CPU cores. As we saw in Chapter 1, Systems
    and MongoDB Architecture, the application server can become a bottleneck if it
    doesn’t send enough operations in parallel to fully utilize the MongoDB server.


    For example, if you were to run a series of experiments using your application’s
    critical performance workload and chart the results in a spreadsheet, you might
    see a graph similar to Figure 13.2, which shows CPU utilization and performance
    trends as the number of threads or parallel operations increases.


    # DB ops/s and CPU Utilization


    ![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_315_0.png)


    *Figure 13.2: The effects on CPU utilization and performance trends as you increase
    parallelism*


    In this example, the database server is running on a 16-core CPU. Performance
    peaks at 64 threads, and may even decline slightly beyond that point as more threads
    are added. This is a typical pattern for many applications. In this case, optimal
    performance is reached with 64 threads on 16 cores, suggesting a ratio of 4 active
    threads or connections per core. It’s important to test with a production workload
    and dataset to determine the ideal threads-to-core ratio for your critical performance
    workloads. For instance, you don’t want to find yourself running only 8 operations
    in parallel on a 16-core machine, leaving half the cores idle, as this can lead
    to unnecessary resource costs.'
  merge: -1
  img_proc: true
- pgno: 316
  md: "# Search for other CPU-intensive processes during performance dips\n\nPeriodic\
    \ performance dips can be caused by other CPU-intensive processes competing for\
    \ system resources. To diagnose these issues, you can use various tools and commands\
    \ to identify which processes are consuming significant resources. You can use\
    \ Linux tools such as top, htop, ps, pidstat, iotop, and perf to see what's running\
    \ on the system during performance dips.\n\nFor example, running the top command\
    \ shows the top processes by resource usage:\n\n```\ntop - 18:09:15 up 10 min,\
    \  1 user,  load average: 1.01, 0.02, 0.00\n\n%Cpu(s):  87.0 us, 13.0 sy,  0.0\
    \ ni,  0.0 id,  0.0 wa,  0.0 hi,  0.0 si,  0.0 st\nMiB Mem :  31373.4 total, \
    \ 30190.5 free,   428.5 used,   754.3 buff/cache\nMiB Swap:      0.0 total,  \
    \    0.0 free,      0.0 used.  30616.0 avail Mem\n\n  PID USER      PR  NI   \
    \ VIRT    RES    SHR S  %CPU  %MEM     TIME+ COMMAND\n 1927 ubuntu    5 -15  531488\
    \ 139020  70108 R  47.3  0.4  1:08.63 mongod\n 1910 ubuntu    5   0  500288  99191\
    \   6436 R  16.1  0.1  0:25.98 python\n    1 root     20   0  167004  11108  \
    \ 7464 S   6.0  0.0  0:01.06 systemd\n    4 root      0 -20       0      0   \
    \   0 I   0.0  0.0  0:00.00 rcu_par_gp\n  589 root     20   0   82100   3204 \
    \  2796 S   0.3  0.0  0:00.03 irqbalance\n 1968 ubuntu    5 -15    7148   3296\
    \   2448 R   0.3  0.0  0:00.04 top\n    2 root     20   0       0      0     \
    \ 0 S   0.0  0.0  0:00.00 kthreadd\n```\n\nIn this output, you can see that there\
    \ are no idle CPU cycles (0.0 id), and a Python process is using 16.1% of the\
    \ CPU, time that MongoDB (mongod) might otherwise be able to use.\n\nIf MongoDB\
    \ is running on a virtual machine, periodic dips might also result from processes\
    \ outside the virtual machine, such as other virtual machines or hypervisor tasks.\
    \ In this case, check host-level resource usage using hypervisor tools such as\
    \ vmstat, virt-top, or your cloud provider’s monitoring tools.\n\n# Select the\
    \ right filesystem for your application\n\nThis section focuses on Linux filesystems.\
    \ We’ll cover the two most relevant options, eXtend File System (XFS) and fourth\
    \ extended filesystem (ext4), in more detail, and touch on other filesystems in\
    \ a later section."
  merge: -1
  img_proc: true
- pgno: 317
  md: '# Extent file system (XFS)


    The MongoDB production notes recommend XFS for production deployments. XFS generally
    delivers better performance for workloads with high throughput and concurrent
    read/write operations. It handles large files and fragmented data more efficiently
    than ext4 and tends to better manage large numbers of flush operations, exhibiting
    fewer I/O stalls during checkpoints. XFS also supports larger file and filesystem
    sizes.


    Originally developed by Silicon Graphics, Inc. (SGI) in 1994, XFS was ported to
    Linux in 2001 and integrated into the mainline kernel in 2004 (version 2.6). Red
    Hat adopted XFS as the default filesystem for RHEL 7 in 2014, citing its scalability
    and performance for enterprise workloads.


    # Fourth extended filesystem (ext4)


    If the Linux distribution you are using supports XFS, use that. If not, ext4 remains
    a solid choice. ext4 is a mature, widely used filesystem and has long been the
    default on many Linux distributions. While ext4 used to be more widely available
    than XFS, the gap has closed in recent years. The performance gap between ext4
    and XFS has also narrowed over time as operating systems, kernels, and MongoDB
    itself have evolved.


    # Other file systems


    While MongoDB can run on other filesystems, their features sometimes overlap with
    those already provided by MongoDB and WiredTiger, leading to inefficiencies:


    +   - **Network File System (NFS)**: Not recommended for MongoDB. See the MongoDB
    production notes for more information.

    +   - **B-tree File System (Btrfs)**: Can struggle with write-heavy workloads.
    Its **copy-on-write** (CoW) design can cause write amplification, where a 100B
    document at the database level could result in many times more data being written
    to the storage device. Btrfs also implements mechanisms that already exist in
    WiredTiger.

    +   - **Zettabyte File System (ZFS)**: Better suited for large, sequential data
    such as backups or media. For MongoDB’s small, random reads/writes, ZFS can be
    slower than XFS or ext4.

    +   - **Ceph File System (CephFS)**: Designed for distributed storage clusters
    and cloud-native apps. MongoDB already supports these use cases via sharding and
    replication.


    In general, XFS or ext4 are the most reliable choices for MongoDB deployments,
    offering the best balance of performance, stability, and compatibility.'
  merge: -1
  img_proc: true
- pgno: 318
  md: '# Filesystem settings


    By default, before kernel 2.6.30, Linux updated the **access time (atime)** metadata
    for files every time they were read. This meant read-intensive workloads also
    triggered a write operation each time a file was accessed on disk. Since 2.6.30,
    **relative access time (relatime)** became the default behavior. This reduces
    the frequency of atime updates and avoids unnecessary disk writes, significantly
    improving file I/O performance while retaining sufficient atime information for
    most use cases.


    You can disable all atime update behavior by adding the noatime option to the
    filesystem mount settings. The `/etc/fstab` file is a Linux configuration file
    that defines how filesystems, partitions, and storage devices should be mounted
    during boot.


    To disable atime writes, add the noatime option in `/etc/fstab`, as in this example:


    ```

    /dev/sdx /path/to/mongodb_data xfs defaults,noatime 0 0

    ```


    Other filesystem options can also improve performance, but many of them reduce
    the durability of writes. In general, MongoDB doesn’t recommend using such options
    unless you clearly understand the risks and trade-offs.


    # Avoid RAID with parity


    A **redundant array of independent (or inexpensive) disks (RAID)** storage device
    refers to a system that uses multiple physical HDDs or SSDs combined to improve
    performance, data redundancy, or both. RAID is commonly used in servers, workstations,
    and storage systems to provide better reliability or performance compared to a
    single disk. However, RAID is being used less frequently as the industry moves
    toward more modern, distributed, and software-defined storage solutions that offer
    better scalability, redundancy, and fault tolerance.


    MongoDB doesn’t require RAID for fault tolerance. If your organization mandates
    the use of RAID, it’s recommended to use RAID 0 or RAID 10. RAID 0 splits (stripes)
    data across multiple drives. It writes data simultaneously to all drives in the
    array, improving read and write performance by leveraging parallelism.


    However, RAID 0 does not store mirrored or parity data, meaning it provides no
    data protection. If one drive fails, all data is lost. RAID 10 (also called RAID
    1+0) combines mirroring and striping. It creates mirrored pairs of drives (RAID
    1) for redundancy, then stripes data across the mirrored pairs (RAID 0) for better
    performance.


    The MongoDB production notes recommend avoiding RAID 5 or RAID 6 for write-heavy
    databases because their parity calculations can slow down write operations.'
  merge: -1
  img_proc: true
- pgno: 319
  md: '# Adjust readahead settings


    The Linux readahead feature is a kernel-level optimization designed to enhance
    the efficiency of sequential disk reads. It anticipates future data access by
    reading additional data blocks beyond what’s requested and caching them in memory.
    For workloads where disk access and data layout are sequential, the next block
    may already be in the cache by the time the database issues an I/O request. This
    can improve performance by reducing disk I/O latency.


    With MongoDB, the impact of readahead tuning depends on the nature of the workload,
    data layout on disk, and the kernel version. MongoDB queries typically access
    data in a random pattern. However, if your workload accesses documents in the
    order they were written, a higher readahead value can be beneficial.


    By default, MongoDB’s WiredTiger engine reads ~28 KB data blocks most of the time
    (with the default leaf_page_max=32KB setting). In Linux, the readahead value is
    specified in blocks, with each block being 512 bytes. For example, a readahead
    value of 32 means the kernel will prefetch 32 blocks, which translates to 16 KB.


    In Linux kernels 5.x and 6.x, the handling of readahead with a value of 0 was
    improved to avoid the performance penalties seen in 4.x kernels. Kernel 6.x also
    includes better scaling heuristics, which more efficiently determine readahead
    size based on workload behavior and device characteristics. It also simplifies
    readahead logic by removing redundant code paths. Changing kernel versions can
    significantly impact performance, so it can be useful to rerun readahead tuning
    experiments after a kernel change or upgrade.


    It’s recommended to start with a readahead value of 32, then test with 16 and
    64. If performance improves with either, continue tuning in that direction. Values
    of 0 or above 256 are generally not recommended.


    # Change filesystem cache settings


    Tuning system settings such as vm.dirty_background_ratio can improve MongoDB’s
    performance and reliability by controlling how the Linux kernel handles dirty
    (modified but not yet written to disk) pages in memory.


    The vm.dirty_background_ratio setting defines the percentage of total system memory
    that can be filled with dirty pages before the kernel starts flushing them to
    disk in the background. Dirty pages represent changes to the filesystem (e.g.,
    from MongoDB writes) that haven’t yet been persisted to storage.'
  merge: -1
  img_proc: true
- pgno: 320
  md: 'MongoDB frequently writes to disk and relies on the operating system for write
    buffering. If vm.dirty_background_ratio is set too high, the kernel may delay
    flushing, allowing a large number of dirty pages to accumulate. This can trigger
    sudden, intensive I/O spikes that increase latency. Lowering this value results
    in smaller, more frequent flushes, smoothing out disk writes.


    Another related setting, vm.dirty_ratio, defines the maximum percentage of memory
    that can be filled with dirty pages. Once this threshold is exceeded, processes
    generating new writes are blocked until dirty pages are flushed to the disk.


    # Write-ahead journal versus data file writes


    > These settings affect writes to data files. Write-ahead journal operations are
    flushed immediately by MongoDB for durability (rather than relying on kernel-level
    mechanisms).


    You might consider tuning vm.dirty_background_ratio in the following scenarios:


    +   - **I/O spikes or high latency:** If you see irregular bursts of disk I/O
    when large batches of dirty pages are flushed at once, lower the dirty background
    ratio to trigger smaller, more frequent flushes. Use the iostat command to look
    for high values of await. The await measurement is the total response time (in
    milliseconds) seen by applications making I/O requests. It includes both the time
    waiting in the I/O scheduler queue and the time spent accessing the disk itself.
    Measure await before and after a change to see whether it makes a difference.

    +   - **Excessive memory usage by dirty pages:** If dirty memory consistently
    occupies a significant portion of the memory, greater than 10–20% of RAM, lower
    vm.dirty_background_ratio to trigger earlier background flushes. You can use the
    following command to monitor the dirty memory on Linux:


    ```

    $ cat /proc/meminfo | grep -E "Dirty|Mem"

    ```


    Here is the example output:


    ```

    MemTotal:      32126312 kB

    MemFree:        3067873 kB

    MemAvailable:   3134261 kB

    Dirty:          6425262 kB

    ```


    The grep part of the command looks for the Dirty and Mem substrings in the output.
    In this example, the system has ~10% of free memory and nearly 20% dirty.'
  merge: -1
  img_proc: true
- pgno: 321
  md: '+   - **Slow checkpoints or high write latency:** Long MongoDB checkpoint durations
    or latency during write operations may indicate poor synchronization between MongoDB
    and kernel flush behavior.

    +   - **Write stalls due to dirty ratio exceeded:** If MongoDB writes are blocked
    when dirty memory exceeds the threshold defined by vm.dirty_ratio, adjustments
    to both vm.dirty_ratio and vm.dirty_background_ratio are needed. You can use the
    following command on Linux to see write operations and blocked processes:

    +   - **System performance drops during high write activity:** High CPU usage
    or disk performance degradation during write spikes suggests inefficient dirty
    page flushing.


    ```

    dstat -c --top-io

    ```


    These scenarios highlight when tuning vm.dirty_background_ratio becomes necessary,
    but understanding the adjustment is just the first step; applying it thoughtfully,
    alongside complementary settings and monitoring, is key to improving overall write
    performance.


    To do this, start by moderately lowering vm.dirty_background_ratio to control
    the accumulation of dirty pages and trigger earlier flushes. The default is often
    10%. It’s recommended to start with a lower value, ranging between 5–7%:


    ```

    sudo sysctl -w vm.dirty_background_ratio=7

    ```


    Dial down vm.dirty_ratio to reduce blocking risk. The default is often 20–30%.
    It’s recommended to lower this value to 15–18%:


    ```

    sudo sysctl -w vm.dirty_ratio=18

    ```


    The previous two commands make changes to the running system. If you want the
    changes to persist when the server reboots, you need to make edits to /etc/sysctl.conf.
    When experimenting with these configuration settings, we recommend:


    +   - Monitoring performance after making each adjustment

    +   - Using iostat or sar to ensure smooth and predictable I/O without bursts

    +   - Measuring MongoDB write latency using mongostat

    +   - Searching the database logs for checkpoint completion times to ensure predictable
    durations


    If your workload exhibits write latency spikes, large memory usage by dirty pages,
    or blocked writes, lowering vm.dirty_background_ratio can help smooth out disk
    flush operations and reduce performance bottlenecks. Combine this with monitoring
    and adjustments to other settings, such as vm.dirty_ratio, MongoDB checkpoint
    frequency, and WiredTiger cache size, for maximum optimization.'
  merge: -1
  img_proc: true
- pgno: 322
  md: '# Check SSD health


    SSDs use sophisticated firmware techniques such as wear leveling, garbage collection,
    over-provisioning, and TRIM to reduce the performance impact of erase-before-write.
    At the operating system level, make sure TRIM and garbage collection are enabled.
    These features make modern SSDs fast and reliable across a wide range of use cases.
    However, it’s important to monitor their health to detect when wear is starting
    to impact performance or when the drive is nearing the end of its lifespan.


    On Linux, most SSDs support SMART data reporting, which provides detailed health
    and diagnostic metrics such as wear leveling status, remaining life, and bad block
    count. Many SSD vendors offer proprietary tools to monitor their drives. These
    tools often expose wear-related data and let you set alerts for health issues
    or performance degradation. If you’re using enterprise-grade SSDs in a server
    or data center, additional monitoring tools may be available, such as Nagios,
    Datadog, Dynatrace, Zabbix, or Prometheus with Node Exporter.


    SSDs also log system-level warnings or errors when health or performance begins
    to degrade. On Linux, check /var/log/syslog, use journalctl, or run dmesg to look
    for I/O-related errors tied to your SSDs.


    # Avoid double encryption and compression


    Some storage technologies include support for compression or encryption, and some
    support both. For example, enterprise storage arrays and SSDs often include both.
    Cloud storage services typically don’t support compression but do support encryption
    to protect data at rest, in transit, and within snapshots.


    Compressed or encrypted data is harder to compress. If the database compresses
    and/or encrypts the data, the storage device’s compression logic may find fewer
    redundant patterns, resulting in little to no further compression. In some cases,
    attempting compression on already compressed data may cause storage overhead,
    increasing the required compute resources.


    Data processed by both the database and the storage device could be compressed
    and encrypted twice. This is often inefficient and may impact performance while
    offering no significant benefits. To prevent this, you should determine where
    compression and encryption are most effectively applied, either at the database
    layer or at the storage layer.


    In some industries, double encryption may provide an extra layer of defense by
    ensuring encryption is enforced independently at multiple layers (e.g., database
    encryption for logical security and storage device encryption for physical security).'
  merge: -1
  img_proc: true
- pgno: 323
  md: '# Ensure resident memory usage stays below 80%


    As a general rule, you should try to keep resident memory usage below 80% because
    low memory can have a big impact on performance. For example, code could be paged
    out (evicted from physical RAM) because it can be reloaded from its original source.
    However, if it needs to run again, it will need to be paged back in and wait for
    I/O. If swap is configured, the system moves less frequently used memory pages
    to disk to free up RAM for active processes. This causes a write and subsequent
    read from storage when the memory is accessed again. If memory gets critically
    low, the **out-of-memory (OOM)** “killer” could terminate the server process.


    If you are self-managing a MongoDB system and can’t add memory, you should regularly
    monitor the memory usage of your cluster for insights on whether adjustments are
    needed. You could experiment with reducing the size of WiredTiger’s cache, as
    we discussed in *Chapter 7, Storage Engines*.


    In Atlas, you can set up fine-grained alerts to notify you when resident memory
    approaches critical thresholds. You can remediate this by scaling to a higher
    tier or enabling auto-scaling, which is described in more detail in the *Using
    autoscaling for Atlas performance* section later in this chapter.


    In both Atlas and self-managed deployments, if a large amount of memory is being
    used by complex aggregations running analytical workloads, you could use MongoDB’s
    features for workload isolation.


    Workload isolation minimizes contention for memory and ensures each workload runs
    efficiently. When creating an Atlas cluster, you have options to create analytics
    nodes or search nodes for workload isolation.


    Use analytics nodes to isolate queries that you do not wish to contend with your
    operational workload. For example, analytics nodes can handle data analysis operations,
    such as reporting queries from BI Connector for Atlas. The cluster tier for your
    analytics nodes can be different from the operational nodes. If you select an
    analytics node on a significantly lower tier, you need to monitor replication
    lag to make sure it’s not under-resourced.


    Similarly, you can use dedicated search nodes to isolate search workloads from
    your operational workload. Finally, if you are not using sharding yet, this could
    be a good reason to start. See *Chapter 6, Sharding*, for more details on when
    and how to add sharding.'
  merge: -1
  img_proc: true
- pgno: 324
  md: '# Networking best practices


    As with all distributed systems, following networking best practices is essential
    for stable and high-performance MongoDB deployments. If you’ve determined that
    the network is the current limiting factor, the following checklist may help:


    +   - Deploy MongoDB clusters close to your application servers (e.g., in the
    same region if using cloud infrastructure).

    +   - Utilize low-latency network connections with high-speed interconnects.

    +   - Use network compression and monitor/optimize query patterns to reduce data
    transfer. This is a feature that MongoDB drivers support but is not enabled by
    default.

    +   - Allocate sufficient bandwidth for MongoDB servers, especially in high-traffic
    production environments.

    +   - Use network interfaces optimized for higher throughput (e.g., gigabit or
    multi-gigabit Ethernet).

    +   - Rely on a stable, well-maintained network infrastructure to minimize packet
    loss.

    +   - Prioritize MongoDB traffic using quality-of-service (QoS) settings.

    +   - Set short and consistent time-to-live (TTL) values for DNS entries to prevent
    stale cache issues.

    +   - Deploy MongoDB clusters with fixed IPs or DNS names that resolve quickly;
    use local DNS servers for faster resolution.

    +   - Isolate MongoDB traffic from non-critical workloads using VLANs or QoS.

    +   - Scale network infrastructure or migrate MongoDB to a less congested environment
    if needed.

    +   - Avoid deep packet inspection of MongoDB traffic where possible.

    +   - Use virtual private clouds (VPCs), trusted networks, and VPNs to secure
    traffic without overloading packet filtering systems.

    +   - Implement consistent routing policies across all nodes.

    +   - Test network topology regularly to ensure balanced and efficient traffic
    distribution.

    +   - Deploy MongoDB clusters within the same geographic region when possible.

    +   - Leverage MongoDB Atlas’s global clusters for distributed workloads while
    minimizing latency.

    +   - Choose cloud providers with optimized regional interconnects.'
  merge: -1
  img_proc: true
- pgno: 325
  md: 'Additionally, consider tuning the following operating system-level networking
    parameters:


    +   - **somaxconn**: In Linux, this parameter defines the maximum number of pending
    connection requests that can be queued on a socket. Increasing the somaxconn value
    allows MongoDB to queue more incoming connections, reducing the likelihood of
    connection errors during periods of heavy network traffic.

    +   - **tcp_max_syn_backlog**: Controls how many pending SYN requests are queued
    during the initial TCP handshake.

    +   - **tcp_syncookies**: Prevents SYN flood attacks when the SYN backlog is full.

    +   - **tcp_fin_timeout**: This parameter controls the amount of time (in seconds)
    a socket remains in the TIME_WAIT state after the connection has been closed.
    The TIME_WAIT state is a safety mechanism ensuring that all packets related to
    the closed connection have been properly transmitted and acknowledged before the
    socket is released for reuse. While this is critical for preventing packet retransmission
    errors, an unnecessarily high tcp_fin_timeout value can cause resource exhaustion
    in busy environments, as the system holds onto a large number of closed connection
    states for an extended period.


    Although networking bottlenecks are typically less common than those related to
    CPU, memory, or storage, it’s still wise to monitor network health actively and
    address issues proactively with the right tools and configuration.


    # Using auto-scaling for Atlas performance


    MongoDB Atlas offers auto-scaling, a powerful feature designed to streamline resource
    management and ensure optimal performance for your cluster workloads. By dynamically
    adjusting both cluster tier and storage capacity, auto-scaling helps you maintain
    high availability and performance while minimizing manual intervention. It can
    scale compute up or down; storage is auto-scaled up only. Users benefit from Atlas’s
    simplicity and efficiency. If your particular needs aren’t addressed, consult
    MongoDB support for guidance tailored to your specific application.


    When workloads change and data grows, scaling resources manually can be challenging
    and inefficient. Automatic scaling addresses these challenges by leveraging automation,
    ensuring that your cluster resources align with your application’s demands in
    real time. This eliminates over-provisioning or underutilization, resulting in
    cost efficiency and consistent performance.'
  merge: -1
  img_proc: true
- pgno: 326
  md: 'Key performance benefits of auto-scaling include the following:


    +   - **Seamless workload management:** Automatically adjusts resources to accommodate
    sudden spikes or drops in workload without requiring downtime

    +   - **Enhanced reliability:** Ensures that sufficient resources (CPU, RAM, and
    storage) are available to avoid bottlenecks during peak usage

    +   - **Cost optimization:** Prevents unnecessary provisioning when workload demands
    are low, reducing operational expenses

    +   - **Proactive scaling:** Prepares your application for rapid usage spikes
    or large data ingestion events to deliver uninterrupted service


    With auto-scaling, MongoDB Atlas automatically monitors your cluster’s performance
    and utilization metrics, such as CPU usage and disk space.


    Here are the two main components of auto-scaling in MongoDB Atlas:


    +   - **Cluster-tier auto scaling:** Adjusts the cluster tier (e.g., M10, M20,
    or M40) to ensure sufficient resources for CPU and memory utilization

    +   - **Storage auto-scaling:** Scales disk capacity to accommodate data growth,
    preventing errors related to insufficient storage


    Automatic scaling is enabled by default when you provision a new cluster, which
    can be disabled if needed. To stay informed about scaling events, set up alerts
    in the Atlas Monitoring suite. Alerts will notify you of resource changes, allowing
    you to track activity and ensure that adjustments align with your expectations.
    Automatic scaling is not a substitute for other performance best practices, such
    as optimizing queries. It is a temporary safety net, but in the long term, you
    should periodically review your cluster’s performance and scaling history to identify
    patterns and apply other optimizations.'
  merge: -1
  img_proc: true
- pgno: 327
  md: '# Summary


    This chapter has provided an in-depth guide to optimizing MongoDB performance
    by configuring the operating system and other system resources, with a primary
    focus on self-managed deployments. While MongoDB Atlas automates many of these
    tasks, understanding the underlying principles remains valuable.


    We covered key resource categories (CPU, memory, storage, and networking) and
    offered practical guidance on topics such as core-to-operation ratios, choosing
    the right filesystem (with a recommendation for XFS), and tuning filesystem cache
    settings. We also cautioned against using double encryption/compression and exceeding
    80% resident memory usage.


    Additionally, we outlined a checklist for network optimization, including ensuring
    cluster proximity, maintaining low-latency connections, and planning for bandwidth
    allocation. Finally, we explained how MongoDB Atlas’s auto-scaling dynamically
    adjusts cluster tiers and storage capacity to meet demand.


    The next chapter examines monitoring and observability in MongoDB, showing how
    to track critical metrics, leverage both built-in and external tools, and establish
    practices that ensure reliability and performance at scale.'
  merge: -1
