    \  }},\n  { $unwind: \"$details\" },\n  { $match: { \"details.date\": { $gt: ISODate(\"\
    2025-05-20T00:00:00.000Z\") } } }\n])\n{  \"stages\" : [\n    { \"$cursor\" :\
    \ {\n        \"queryPlanner\" : {\n          // ...\n        },\n        // ...\n\
