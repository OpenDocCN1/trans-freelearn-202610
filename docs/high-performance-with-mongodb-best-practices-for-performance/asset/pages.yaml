- pgno: 214
  md: '+   - **Weaker consistency is acceptable:** Not every application requires
    strict consistency guarantees. In some cases, allowing relaxed consistency can
    improve performance and scalability by reducing locking and coordination overhead.
    For example, analytics dashboards or social media feeds can tolerate slight delays
    or temporary discrepancies in data without impacting user experience. Choosing
    a weaker consistency when appropriate can help optimize resource use and system
