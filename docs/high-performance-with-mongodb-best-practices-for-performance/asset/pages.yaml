- pgno: 329
  md: '# 14


    # Monitoring and Observability


    In high-performance database environments, understanding what’s happening under
    the hood isn’t just beneficial, it’s essential. Monitoring and observability form
    the foundation of maintaining and optimizing MongoDB deployments, especially as
    systems scale and workloads become more complex.


    This chapter provides a practical guide to monitoring and observability in MongoDB,
    equipping you with the knowledge to maintain high performance and reliability
    as your systems grow. You’ll learn how to interpret key metrics, leverage built-in
    and external tools, and respond proactively to early signs of trouble before they
    impact your applications. Whether you’re running MongoDB in the cloud with Atlas
    or managing your own infrastructure, this chapter will help you build a robust
    observability strategy tailored to your needs.


    Key topics covered in this chapter include the following:


    +   - The difference between monitoring and observability

    +   - Why monitoring and observability both matter for database performance

    +   - The core MongoDB metrics and signals to track for optimal health and troubleshooting

    +   - How to use MongoDB Atlas and self-managed tools for real-time monitoring
    and alerting

    +   - Best practices for integrating MongoDB metrics into broader observability
    platforms


    # Key differences between monitoring and observability


    While often used interchangeably, monitoring and observability represent distinct
    but complementary practices. Monitoring answers Is something wrong? by collecting
    and alerting on predefined metrics, opcounters, cache pressure, page faults, and
    connection counts against known thresholds. It’s focused on tracking the known
    failure modes of a system.'
  merge: -1
  img_proc: true
- pgno: 330
  md: '**Observability** answers *Why is it happening?* by enriching those metrics
    with contextual data such as logs, traces, and explain plans, so you can drill
    down from an alert to the root cause. It enables the exploration of unknown issues
    by providing a comprehensive view of the system''s internal state.


    In high-throughput environments, whether running a single replica set or a global
    sharded cluster, subtle performance degradations can cascade into major outages.
    Without comprehensive visibility into resource utilization, query performance,
    and system health, identifying bottlenecks becomes a frustrating guessing game.


    Observability transforms this guesswork into data-driven insights. By continuously
    tracking key signals, you can optimize performance and detect early signs of trouble
    before they impact your applications. Here are some examples:


    +   - **Correlate logged operations** with index usage (or lack thereof) and execution
    plans to pinpoint missing or inefficient indexes

    +   - **Overlay disk queue depths** with commit times to uncover storage contention
    under peak workloads

    +   - **Chart replication lag** against write throughput to detect network bottlenecks
    during failover events

    +   - **Monitor memory pressure** to identify optimal cache sizes and prevent
    page faults

    +   - **Track connection patterns** to properly size connection pools and prevent
    queuing


    These practices are important because they turn raw monitoring data into actionable
    insights. By correlating slow queries with index usage, overlaying disk queue
    depths with commit times, and tracking replication lag, memory pressure, and connection
    patterns, you can move beyond simply detecting that something is wrong; you can
    pinpoint the root cause of performance issues. This enables you to proactively
    optimize your MongoDB deployment, prevent outages, and ensure that your database
    continues to deliver reliable, high performance as workloads grow and change.
    In short, these techniques help you shift from reactive troubleshooting to continuous,
    data-driven improvement.


    To truly optimize performance, you need more than just a snapshot of system health;
    you need clear, timely signals that reveal when and where degradation is occurring.
    A robust monitoring and observability strategy provides these essential signals,
    making it possible to identify emerging issues such as slow queries, resource
    constraints, replication lag, storage bottlenecks, or connection problems. With
    this visibility, you gain the context and confidence to diagnose, prioritize,
    and resolve issues before they escalate, turning what would otherwise be reactive
    firefighting into a process of ongoing improvement and resilience.'
  merge: -1
  img_proc: true
- pgno: 331
  md: "# Core MongoDB metrics and signals\n\nUnderstanding the internal state of your\
    \ MongoDB deployment is crucial for maintaining optimal performance and diagnosing\
    \ issues. MongoDB exposes a comprehensive set of metrics that provide insights\
    \ into its health, resource utilization, and operational characteristics. By monitoring\
    \ and correlating these core signals, you can proactively identify potential bottlenecks,\
    \ make informed decisions about capacity planning, and ensure that your database\
    \ effectively supports your application workloads.\n\nThese metrics generally\
    \ fall into two categories: operational metrics, which give a real-time view of\
    \ the database’s current activity, and performance-specific metrics, which delve\
    \ deeper into workload behavior and potential areas of contention.\n\n# Operational\
    \ metrics\n\nOperational metrics answer the question How is my database operating\
    \ right now?. These are exposed by the serverStatus command and can be collected\
    \ via the shell, drivers, or external monitoring solutions such as Prometheus,\
    \ as discussed later in the Integration with external monitoring systems section.\n\
    \nThe following example demonstrates how to extract a few of the most important\
    \ operational metrics using the MongoDB Shell. This code retrieves the current\
    \ server status and prints a selection of key metrics that are essential for monitoring\
    \ real-time health and workload:\n\n```\n// Run from the MongoDB shell\n// Example:\
    \ Extract key operational metrics in the MongoDB shell\nconst status = db.serverStatus();\n\
    printjson({\n    opcounters:    status.opcounters,    // reads, writes, commands\n\
    \    memUsageMB:    status.mem.resident,  // resident memory in MB\n    cacheStats:\
    \    status.wiredTiger.cache,  // WiredTiger cache\n    utilization\n    connections:\
    \   status.connections    // active vs available\n});\n```\n\nThe preceding code\
    \ reveals several of the most actionable metrics for day-to-day monitoring, but\
    \ it’s important to note that serverStatus exposes a much broader set of metrics\
    \ covering nearly every aspect of MongoDB’s operation. In the following list,\
    \ we highlight only some of the most relevant fields for practical, ongoing observability.\
    \ Here’s what each field represents, and where to find related metrics not shown\
    \ in the code:"
  merge: -1
  img_proc: true
- pgno: 332
  md: '+   - **opcounters (from status.opcounters in the code)**: These track the
    number of database operations (reads, writes, commands) since the server started.
    Monitoring these helps you understand workload patterns and spot sudden spikes
    that may indicate query storms or application issues. Imbalances between reads
    and writes may suggest opportunities for scaling or optimization.

    +   - **memUsageMB (from status.mem.resident in the code)**: This shows the amount
    of physical RAM (in megabytes) currently used by the MongoDB process. Keeping
    an eye on this helps ensure that your working set fits in memory, minimizing disk
    access and maintaining performance. For a deeper view, the mem section of serverStatus
    also includes virtual memory, mapped memory, and page faults.

    +   - **cacheStats (from status.wiredTiger.cache in the code)**: This provides
    details on the WiredTiger storage engine’s internal cache usage, including how
    much data is cached and the ratio of dirty (modified) to clean pages. High cache
    pressure or frequent evictions can signal the need for more memory or cache tuning.
    The full wiredTiger.cache section contains additional metrics such as eviction
    rates and maximum cache size.

    +   - **connections (from status.connections in the code)**: This reports the
    number of active client connections and the available connection slots. Monitoring
    this helps prevent connection saturation, which can lead to application errors
    or degraded responsiveness. The connections section also shows the number of available
    connections and the total created since startup.

    +   - **Replication metrics (not shown in the code)**: For deployments using replica
    sets, metrics such as replication lag, oplog window, heartbeat times, and election
    metrics are available in the repl1 and oplog sections of serverStatus, or via
    replica set-specific commands such as rs.status() and rs.printReplicationInfo().
    These are vital for ensuring data durability and failover readiness.

    +   - **Disk I/O metrics (not shown in the code)**: Storage performance metrics,
    such as queue depth, latency, throughput, and IOPS, are found in the wiredTiger
    and metrics sections of serverStatus, or through external monitoring tools. These
    are crucial for identifying storage bottlenecks and ensuring that your disk subsystem
    can handle the workload.


    By regularly collecting and reviewing these metrics, you gain a comprehensive,
    real-time view of your database’s operational health, enabling you to detect emerging
    issues and optimize performance before problems escalate.'
  merge: -1
  img_proc: true
- pgno: 333
  md: '# Performance-specific metrics


    While operational metrics provide a broad overview of database activity, performance-specific
    metrics delve deeper into the sources of slowdowns and inefficiencies. These metrics
    help pinpoint bottlenecks and answer the critical question: *Where exactly are
    the performance issues occurring?*. Performance-specific metrics include slow
    query statistics, query execution statistics, and index usage metrics.


    To capture and review slow operations, use the MongoDB database profiler (via
    db.setProfilingLevel() and the system.profile collection), or Query Insights in
    Atlas. Locking and contention metrics can be accessed through the serverStatus
    command and visualized through external tools such as Prometheus and Grafana.


    For query execution statistics, such as documents examined versus returned and
    execution time breakdowns, use the explain() method in the shell or drivers, the
    database profiler, and Atlas Query Insights. For programmatic monitoring, extract
    the relevant fields from the profiler output or system.profile. To understand
    index usage and effectiveness, leverage the explain() method, the collStats command,
    Atlas Performance Advisor, and Query Insights to identify usage patterns and optimization
    opportunities.


    For now, familiarize yourself with the built-in tools (MongoDB database profiler,
    explain plans, serverStatus, and the Atlas UI) and external integrations (Prometheus,
    Grafana, and Datadog) that make this level of observability possible.


    # Monitoring with MongoDB Atlas


    MongoDB Atlas provides a fully managed, cloud-based database service that surfaces
    critical database signals in real time and guides you toward data-driven optimizations.
    In high-performance database environments, effective monitoring isn’t just about
    collecting metrics; it’s about transforming those metrics into actionable insights
    that help you maintain peak performance for your clusters.


    # Atlas UI features


    The Atlas UI provides a robust suite of features for monitoring and performance
    analysis. The Real-Time Performance Panel offers live visualizations of cluster
    health, including resource consumption, operation rates, and query execution times,
    ideal for immediate oversight. The'
  merge: -1
  img_proc: true
- pgno: 334
  md: 'Performance Advisor continually analyzes workloads, suggesting indexes to enhance
    performance, while Query Insights provides a higher-level view by grouping similar
    queries, monitoring latency percentiles, and identifying **hot** collections.
    Lastly, profiler integration within Query Insights simplifies the diagnosis of
    performance bottlenecks by offering a user-friendly interface for the MongoDB
    database profiler.


    # Real-Time Performance Panel (RTPP)


    MongoDB Atlas provides a live, high-level visualization of your cluster’s health
    and operational throughput, updating every few seconds. Available for M10+ clusters,
    RTPP is especially useful for monitoring live environments, load testing, and
    post-deployment performance validation. It enables you to visually identify spikes,
    bottlenecks, and trends across a range of critical metrics, helping you correlate
    performance changes with resource utilization or operational load in real time.


    RTPP offers two main views, **Graph** and **Table**, each surfacing a comprehensive
    set of metrics, including the following:


    +   - **Resource Consumption**: CPU usage, system memory, and disk **I/O operations
    per second** (**IOPS**), as well as network traffic (bytes in/out). These metrics
    help you spot resource saturation or sudden spikes that often correlate with performance
    degradation.

    +   - **Operation Rates**: The number of read, write, command, and aggregation
    operations processed per second, providing insight into workload intensity and
    patterns.

    +   - **Query Execution Times**: Latency statistics for current read, write, and
    command operations, allowing you to quickly identify slowdowns.

    +   - **Query Targeting**: The ratio of documents scanned to documents returned
    across all operations during a sampling period, which helps assess index efficiency
    and query optimization needs.

    +   - **Replication Lag**: For replica sets, the delay between primary and secondary
    nodes, critical for data consistency and failover readiness.

    +   - **Reads & Writes**: The number of active and queued read/write operations,
    indicating potential bottlenecks or resource contention if queues grow.

    +   - **Connections**: Current client connections and network throughput, useful
    for detecting connection saturation.

    +   - **Hottest Collections**: Collections with the most operations, highlighting
    potential hotspots for further investigation (leveraging mongotop-like statistics).

    +   - **Slowest Operations**: The slowest currently running operations, with the
    ability to drill down for details or terminate problematic queries.'
  merge: -1
  img_proc: true
- pgno: 335
  md: 'You can pause the Graph view to inspect exact metric values at a specific point
    in time, including the slowest operations and hottest collections. RTPP is enabled
    by default but can be toggled in Project Settings by users with Project Owner
    access. RTPP is particularly valuable during load testing, production incidents,
    or after deployments to quickly correlate performance changes with resource utilization
    or operational load.


    # Performance Advisor


    The Atlas Performance Advisor continuously analyzes your cluster’s workload, specifically
    looking for inefficient query patterns. It offers actionable insights through
    the following:


    +   - **Index suggestions**: Recommends specific indexes that could improve the
    performance of identified slow queries, often providing an estimated impact percentage.

    +   - **Index management**: Allows you to review, create, or drop suggested indexes
    directly through the Atlas UI. It also highlights potentially unused indexes that
    could be dropped.


    Integrating Performance Advisor checks into development workflows or CI/CD pipelines
    helps you proactively identify and address potential query performance issues
    before they reach production.


    # Query Insights


    Query Insights exposes improved observability and granular telemetry with namespace-level
    and operation-level latency statistics.


    # Namespace Insights


    Monitor collection-level query latency with **Namespace Insights**. The Namespace
    Insights page displays two charts and a table with information for each top or
    pinned namespace. The information includes metrics and statistics for certain
    hosts and operation types. You can manage pinned namespaces and choose up to five
    namespaces to show in the corresponding query latency charts. This allows you
    to monitor the performance difference between multiple namespaces using percentile
    latencies (P50, P95, and P99), revealing not just average performance but also
    tail latency experienced by users. High P95 or P99 latencies indicate that some
    users may be experiencing slow responses.


    Reviewing this information can help you identify hot collections, which can be
    combined with other tooling to provide a high-level view of workload distribution.'
  merge: -1
  img_proc: true
- pgno: 336
  md: '# Query Shapes and Query Profiler


    Within Query Insights, Atlas provides a user-friendly interface for surfacing
    insights about logged operations. Operations are logged to mongos/mongod logs
    when they exceed the slowms threshold (which defaults to 100 milliseconds).


    The Query Shapes tab groups these operations by shape and allows you to see their
    performance metrics. The Query Profiler can help you see more details to diagnose
    and resolve performance bottlenecks with greater precision through the following:


    +   - **Slow query identification:** Detects queries that consistently exceed
    the slowms threshold. This can occur on a collection scan (reading entire collections
    without using an index) or operations that aren’t optimally indexed. If you see
    a slow query with planSummary: COLLSCAN, consider an appropriate index.

    +   - **Recent slow operations:** List of operations exceeding your configured
    threshold, along with key details such as execution time, namespace (database
    and collection), and documents scanned versus returned. If execution time is high
    and the ratio of documents examined versus documents returned is elevated, optimize
    the query or add indexes to reduce unnecessary scanning.

    +   - **Execution statistics:** Drill down into individual slow operations to
    examine their execution plan, index usage, read/write latency, and response size.
    Add or adjust indexes as needed. Large response sizes may indicate the need for
    projections to limit returned fields.

    +   - **Filter and drill down:** Narrow down the profiler output by time range,
    operation type, or namespace to isolate specific issues. Use this to correlate
    slowdowns with application changes, deployment events, or specific workloads.


    In practice, use the Query Insights in tandem with Performance Advisor to confirm
    that new indexes or query changes yield the expected latency improvements.


    # Alerts


    Atlas issues alerts for the database and server conditions configured in your
    alert settings. When a condition triggers an alert, Atlas displays a warning symbol
    on the cluster and sends alert notifications. Your alert settings determine the
    notification methods. Atlas continues sending notifications at regular intervals
    until the condition resolves or you delete or disable the alert.'
  merge: -1
  img_proc: true
- pgno: 337
  md: 'Atlas has a number of predefined alerts at both the organization and project
    levels; however, you can create custom alerts as well. Let’s look at some common
    alert categories and how the underlying issues can be addressed.


    # Atlas Search issues


    Atlas Search triggers alerts when the amount of CPU and memory used by Atlas Search
    processes reaches a specified threshold. If the search process (mongot) runs out
    of memory, indexing and queries fail.


    Atlas Search alerts often occur when you try to build a large or complex search
    index. These indexes remain in the Initial Sync phase until you resolve the memory
    issue.


    If the search process runs out of memory or disk space, you can upgrade your cluster
    to fix the immediate problem. You can select a cluster tier with more memory,
    storage, and IOPS, or consider a dedicated search node for even greater availability,
    performance, and workload balancing.


    # Connection issues


    Connection alerts typically occur when the maximum number of allowable connections
    to a MongoDB process has been exceeded. Once the limit is exceeded, no new connections
    can be opened until the number of open connections drops below the limit.


    Connection alerts are generally a symptom of a larger problem. If these alerts
    are being triggered often, a proper solution will likely involve the following:


    +   - Examining your database applications for flawed connection code. Situations
    in which connections are opened but never closed can allow old connections to
    pile up and eventually exceed the connection limit. Additionally, you may need
    to implement some form of connection pooling.

    +   - Upgrading to a larger Atlas cluster tier, which allows a greater number
    of connections, if your user base is too large for your current cluster tier.


    By identifying the root cause and addressing it, whether in your application code
    or cluster configuration, you can prevent recurring connection issues and ensure
    smoother, more reliable database performance.'
  merge: -1
  img_proc: true
- pgno: 338
  md: '# Query issues


    The query targeting alert typically occurs when there is no index to support a
    query or queries, or when an existing index only partially supports a query or
    queries. Examples of these alerts are as follows:


    +   - **Query Targeting: Scanned Objects / Returned:** These alerts are triggered
    when the average number of documents scanned relative to the average number of
    documents returned server-wide across all operations during a sampling period
    exceeds a defined threshold. The default alert uses a 1000:1 threshold. Ideally,
    the ratio of scanned documents to returned documents should be close to 1. A high
    ratio negatively impacts query performance.

    +   - **Query Targeting: Scanned / Returned:** These alerts occur if the number
    of index keys examined to fulfill a query relative to the actual number of returned
    documents meets or exceeds a user-defined threshold. This alert is not enabled
    by default.


    The most common source of this issue is a missing index, which the Performance
    Advisor provides the easiest and quickest way to investigate. The Performance
    Advisor monitors queries that MongoDB considers slow and recommends indexes to
    improve performance. Identifying issues using these alerts, coupled with the concepts
    introduced in *Chapter 12, Advanced Query and Indexing Concepts*, can help you
    more effectively troubleshoot and address underperforming queries.


    # Oplog issues


    In *Chapter 5, Replication*, we learned about the **operations log (oplog)** and
    the role it plays in ensuring write operations are propagated to all replica set
    members. We also learned that the oplog is a capped collection of a fixed size
    (either by disk size or window size in time).


    If a large amount of write operations are conducted on the primary node of the
    replica set and the secondary nodes do not have enough time to replay all of the
    operations contained in the oplog, this will typically result in “falling off
    the oplog,” which requires an initial sync in order to recover and ensure that
    the data is consistent across all nodes.


    Atlas offers monitoring and alerting of events relevant to this scenario in the
    form of the following:


    +   - **Replication Oplog Window is (X):** This occurs if the approximate amount
    of time available in the primary replication oplog meets or goes below the specified
    threshold. This refers to the amount of time that the primary can continue logging,
    given the current rate at which oplog data is generated.

    +   - **Oplog Data Per Hour is (X):** This occurs if the amount of data per hour
    being written to a primary’s replication oplog meets or exceeds the specified
    threshold.'
  merge: -1
  img_proc: true
- pgno: 339
  md: 'The most common trigger for these alerts is intensive write and update operations
    in a short period of time. When this occurs, some common mitigations are as follows:


    +   - Increase the oplog size by editing your cluster’s configuration to ensure
    it is higher than the peak value from the Oplog GB/Hour graph in the cluster metrics
    view.

    +   - Ensure that all write operations specify a write concern of majority to
    ensure that writes are replicated to at least one node before moving on to the
    next write operation. This controls the rate of traffic from your application
    by preventing the primary from accepting writes more quickly than the secondaries
    can handle.


    To get the most value from your alerting system, regularly review and tune alert
    thresholds to match your workload and business requirements, which helps avoid
    both alert fatigue and missed incidents. Integrate alert notifications with your
    team’s preferred communication and incident management tools to ensure rapid response.
    Treat alerts as actionable signals: when triggered, promptly investigate the root
    cause, take corrective action (such as scaling resources, optimizing queries,
    or adjusting thresholds), and document the resolution for future reference.


    Periodically audit the configured alerts to ensure they remain relevant as your
    application and infrastructure evolve. Finally, use alert history and trends to
    inform capacity planning, identify recurring issues, and drive continuous improvement
    in your monitoring strategy.


    For a full list of available alert conditions, see the MongoDB Atlas documentation
    at https://www.mongodb.com/docs/atlas/reference/alert-conditions/.


    # Self-managed monitoring tools


    When operating MongoDB outside of the managed Atlas environment, you are responsible
    for assembling your own observability pipeline. Fortunately, MongoDB provides
    a suite of built-in command-line utilities and database commands designed to offer
    deep insights into the server’s real-time activity and historical performance.
    Mastering these tools is essential for diagnosing issues, understanding workload
    characteristics, and ensuring the health of your self-hosted deployments.


    # mongostat: real-time activity snapshot


    Think of mongostat as a MongoDB-specific monitoring utility that provides a dynamic,
    real-time view of the status of a running mongod or mongos instance. By sampling
    the server status periodically (by default, every second), it presents key metrics
    in a concise, tabular format, allowing you to quickly assess the current operational
    load and resource utilization.'
  merge: -1
  img_proc: true
- pgno: 340
  md: "To run mongostat, you can connect to your MongoDB instance like so:\n\n```\n\
    // Run from the System Command Line\nmongostat --host localhost:27017 --rowcount\
    \ 2\n```\n\nYou'll see an output similar to the following, updating each second:\n\
    \n```\ninsert query update delete getmore command dirty used flushes vsize res\n\
    \    0     8      0      0       0      3|0   3.4% 7.4%      0 1.2G   512M\n \
    \   1    12      0      0       0      5|0   3.7% 2.5%      0 1.2G   210M\n```\n\
    \nKey fields include the following:\n\n+   - **Operation counters:** Shows the\
    \ number of operations per second, indicating the shape and intensity of your\
    \ workload (insert, query, update, and delete).\n+   - **Memory:** Reveals memory\
    \ utilization details, including mapped memory, virtual size, and resident memory.\
    \ Significant changes or high resident memory might indicate memory pressure (mapped,\
    \ vsize, and res).\n+   - **Commands:** Shows the number of commands executed\
    \ per second (command).\n\nFor replica sets, you can use the --discover option\
    \ to automatically track all members and their status:\n\n```\nmongostat --discover\n\
    ```\n\nUse mongostat for a quick health check, to observe the immediate impact\
    \ of application changes, or during performance incidents to get a high-level\
    \ view of database activity.\n\n# mongotop: Collection-level read/write timings\n\
    \nWhile mongostat provides a server-wide overview, mongotop focuses specifically\
    \ on the time spent performing read and write operations on a per-collection basis.\
    \ This is invaluable for identifying which collections are experiencing the heaviest\
    \ activity or potentially causing I/O bottlenecks.\n\nLike mongostat, you connect\
    \ mongotop to a running instance:\n\n```\n// Run from the System Command Line\n\
    mongotop --host localhost:27017 --rowcount 2\n```\n\nThe output looks like this:\n\
    \n```\nns              total   read    write   2025-04-30T16:30:27-04:00\nmydb.users\
    \      0.1ms   0.1ms   0.0ms\nmydb.orders     5.2ms   2.8ms   2.4ms\n```"
  merge: -1
  img_proc: true
- pgno: 341
  md: 'The columns show the following:


    +   - `ns`: The namespace (`<database>.<collection>`) being monitored

    +   - `total`: Total time the server spent performing operations on this collection
    during the interval

    +   - `read`: Time spent on read operations

    +   - `write`: Time spent on write operations


    Use mongotop to pinpoint hot collections that might benefit from schema optimization,
    indexing improvements, or sharding if activity is consistently high and impacting
    overall performance. For example, in the preceding output, you can see that the
    `mydb.orders` collection experiences significantly higher read and write activity
    compared to `mydb.users`, which might warrant further investigation.


    # serverStatus: Comprehensive metrics via the shell


    For the most detailed snapshot of a MongoDB server’s state, the `serverStatus`
    command is the definitive source. It returns a large JSON document containing
    hundreds of metrics covering nearly every aspect of the server’s operation:


    ```

    // Run from the MongoDB shell

    db.adminCommand({ serverStatus: 1 })


    // Or using the shell helper

    db.serverStatus()

    ```


    While the output is too extensive to detail fully here, important sections include
    the following:


    +   - `opcounters`: Granular counts of all database operations since the server
    started

    +   - `connections`: Information about current, available, and queued client connections

    +   - `locks`: Information about lock contention (database, collection, or global)

    +   - `wiredTiger`: Deep metrics specific to the WiredTiger storage engine, including
    the following:

    +     - Cache usage (pages read into cache, pages written from cache, dirty bytes)

    +     - Transaction checkpoints

    +     - Block manager statistics

    +   - `mem`: Resident and virtual memory statistics

    +   - `metrics`: Various operational metrics such as document insertion/update/deletion
    rates, query executor stats, and replication details'
  merge: -1
  img_proc: true
- pgno: 342
  md: 'serverStatus is less suited for real-time monitoring due to the volume of data,
    but it is essential for deep analysis, establishing performance baselines, and
    programmatic monitoring where specific metrics are extracted and tracked over
    time by external systems.


    # Database profiler: Deep dive into slow operations


    When you need to understand the performance characteristics of individual queries,
    the database profiler is the tool of choice. It captures detailed information
    about database operations for a specific database, allowing you to identify slow
    or inefficient queries that might impact application performance.


    To get started, you can enable the profiler for a specific mongod instance using
    the setProfilingLevel() method from the MongoDB Shell. This method offers three
    profiling levels, each suited for different needs:


    +   - **Level 0 (off)**: The profiler is disabled by default and does not collect
    any data

    +   - **Level 1 (slow operations)**: It captures data only for operations slower
    than a specified threshold (slowms, default 100 ms)

    +   - **Level 2 (all operations)**: It captures data for all operations (use with
    caution in production due to performance overhead)


    Additionally, you can configure slowms, which is the slow operation threshold.
    Any user operation that completes faster than this will not be logged to the mongod
    log. sampleRate can also be set, which allows you to control what fraction of
    slow operations should be logged.


    The following command, when run via the MongoDB Shell, will enable the database
    profiler for the current database with a slow operation threshold of 20 milliseconds
    and a sample rate of 42%:


    ```

    db.setProfilingLevel(1, { slowms: 20, sampleRate: 0.42 })

    ```


    Once enabled, you can query the profiler data to analyze recent operations. For
    example, this command finds and displays the five most recent profiled operations:


    ```

    // Run from the MongoDB shell

    // Find the 5 most recent profiled operations

    db.system.profile.find().sort({ ts: -1 }).limit(5).forEach(printjson)

    ```


