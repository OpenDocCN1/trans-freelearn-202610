- pgno: 266
  md: "5. **Authentication stage:** The final stage verifies client identity before\
    \ allowing database operations. SCRAM-SHA-256 (default) provides strong security\
    \ but requires multiple round-trips. X.509 certificate authentication binds identity\
    \ to TLS certificates for enhanced security. LDAP and Kerberos proxy authentication\
    \ add additional network hops and latency. Once the authentication is complete,\
    \ the connection is fully established and ready for use.\n\nEach of these steps\
    \ contributes to the total connection latency, which can range from a few milliseconds\
    \ in local deployments to several hundred milliseconds across geographic regions\
    \ or with complex authentication schemes. This connection overhead underscores\
    \ why connection pooling is critical for high-performance applications.\n\n# Driver\
    \ connection pooling\n\nMongoDB drivers are language-specific libraries that handle\
    \ the complexities of communicating with MongoDB servers. One of their most important\
    \ functions is connection pooling. When your application initializes the MongoDB\
    \ client, the driver creates a connection pool (or multiple pools, depending on\
    \ the topology). The driver then borrows an available connection from the pool\
    \ when your code executes a MongoDB operation. It sends the command over the connection\
    \ and waits for a response. After the operation completes, the connection is returned\
    \ to the pool for reuse. The driver also maintains the connection pool by monitoring\
    \ the health of connections and may periodically test them or replace them.\n\n\
    Connection pools have the following parameters that can be adjusted:\n\n+   -\
    \ **maxPoolSize**: The maximum number of connections the pool can maintain (default:\
    \ 100 in most drivers).\n+   - **minPoolSize**: The minimum number of connections\
    \ the pool can maintain, even when idle (default: 0 in most drivers).\n+   - **maxConnecting**:\
    \ Limits how many connections can be in the process of being established concurrently\
    \ (default: 2 in most drivers). This parameter is not available in the Rust driver.\n\
    +   - **maxIdleTimeMS**: The duration an idle connection remains in the pool before\
    \ being closed.\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_266_0.png)\n\n> **Optimizing\
    \ maxPoolSize for asynchronous applications**\n> \n> For asynchronous applications,\
    \ setting maxPoolSize to match your expected concurrency rather than your thread\
