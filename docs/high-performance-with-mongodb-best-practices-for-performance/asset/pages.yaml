  md: "# Best practice\n\nChoose the narrowest scope that meets your requirements.\
    \ This will maximize performance by reducing resource consumption on the database\
    \ server and minimize the number of events your application needs to process.\n\
    \nHowever, you need to balance this with the number of change streams because\
    \ each, in effect, is parsing and filtering the oplog. For example, if a database\
    \ has 20 collections and you want to process changes from 16 of them, it’s better\
    \ to have one change stream on the database than 16 change streams on each collection.\n\
    \n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_196_0.png)\n\n# Server-side filtering\
    \ with aggregation pipelines\n\nOne of the most effective performance techniques\
    \ for change streams is server-side filtering using aggregation pipelines. This\
    \ approach dramatically reduces network bandwidth consumption and application\
    \ client-side processing overhead.\n\nFor example, if you’re only interested in\
    \ price changes on product documents, you can set up a change stream with an aggregation\
    \ pipeline that matches only changes to the price field:\n\n```\n// MongoDB Node.js\
    \ driver code snippet\n// Opening a change stream with a filter pipeline\nconst\
    \ pipeline = [\n  // Only capture update operations on the products collection\n\
    \  { $match: { 'ns.coll': 'products', operationType: 'update' } },\n\n  // Further\
    \ filter to only include price updates\n  { $match: { 'updateDescription.updatedFields.price':\
    \ { $exists: true } } }\n];\n\nconst filteredStream = collection.watch(pipeline);\n\
    ```\n\nThis filtered change stream emits only events for updates to the price\
    \ field in the products collection, significantly reducing the amount of data\
    \ sent over the network and processed by the client application."
