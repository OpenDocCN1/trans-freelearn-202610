    # Best practices for MongoDB Profiler in production


    Enabling the MongoDB database profiler at level 2 (profiling all operations) in
    production environments can introduce significant performance overhead. In most
    production scenarios, it is best practice to use level 1 profiling, set sampleRate,
    or enable full profiling only for short, targeted periods during troubleshooting.
    Always monitor system impact when adjusting profiler settings in live environments.


    ![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_344_0.png)


    Use profiler data to pinpoint inefficient queries, detect missing indexes, and
    guide schema refinements. By analyzing patterns in slow operations, you can make
    targeted optimizations that significantly improve application performance.


    # Integration with external monitoring systems


    While MongoDB provides powerful built-in tools such as mongostat, mongotop, and
    serverStatus commands, and MongoDB Atlas offers a comprehensive managed monitoring
    suite, modern application environments rarely operate in isolation. To achieve
    true end-to-end observability, it’s crucial to integrate MongoDB’s performance
    signals into broader external monitoring and observability platforms.


    This integration allows you to do the following:


    +   - Correlate database behavior with application performance and infrastructure
    health

    +   - Create unified dashboards spanning your entire technology stack

    +   - Implement consistent alerting across all components

    +   - Gain historical context for performance analysis

    +   - Support root cause analysis across system boundaries


    In essence, by feeding MongoDB’s performance data into your organization’s wider
    observability tools, you gain a more holistic view, making it easier to connect
    database performance with overall application health, manage alerts centrally,
    and perform comprehensive root cause analysis across your entire technology stack.'
