  md: '![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_368_0.png)


    # Automatic cursor lifecycle management in MongoDB


    MongoDB automatically manages cursor lifecycles in most normal operations. Cursors
    are closed when they’re fully iterated through after timing out (typically after
    10), or when a client session ends. In applications that use standard MongoDB
    drivers and patterns, cursor leaks are relatively rare.


    The customer’s deployment continued to degrade, with more users experiencing slow
    response times and errors. Key system indicators such as CPU, memory, and I/O
    all showed a serious bottleneck. Even after a thorough investigation by our support
    team, the exact cause wasn’t clear, but we needed to stabilize the system fast
    to avoid an outage. The support team recommended that the customer restart the
    primary node. This would trigger a planned failover, making one of the secondary
    nodes the new primary, ensuring services would continue. After the secondary was
    successfully promoted, system performance immediately improved, confirming that
    this action temporarily resolved the urgent operational problems.


    The support team continued to monitor the system overnight. The open cursor count
    was rising, but user activity was lower, and operation latencies had not yet reached
    a critical level. When the customer engineer started work the following morning,
    the open cursor count had risen to 260,000 and was still climbing.


    The support team and the customer worked together to diagnose the issue in real
    time and identified several key indicators:


    +   - **Profiler Analysis**: The customer enabled the database profiler for 40
    minutes to capture queries taking longer than 20 ms.

    +   - **Log Analysis**: Analyzing the logs, the support engineer observed the
    open cursors spike to 600,000 and then drop back close to zero. From the server
    status, they observed the following:

    +     - Large numbers of `cursor.lifespan.greaterThanOrEqual10Minutes`

    +     - Over 500 `cursor.totalOpened` per second but fewer than 250 `cursor.moreThanOneBatch`

    +     - Over 300,000 log messages with `{"ctx":"LogicalSessionCacheRefresh","msg":"Killing
    cursor as part of killing session(s)"}`'
  merge: -1
