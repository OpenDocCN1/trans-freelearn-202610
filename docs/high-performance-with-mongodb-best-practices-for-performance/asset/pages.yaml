- pgno: 208
  md: '# Understanding multi-document ACID transactions


    Let’s dig into MongoDB’s multi-document ACID transactions, a capability that marked
    a significant milestone in MongoDB’s evolution from a basic document-oriented
    database to a platform capable of handling complex, mission-critical workloads.
    While MongoDB has always provided powerful document-level atomicity, multi-document
    transactions extend these guarantees across multiple documents, collections, and
    databases.


    Even though many applications can utilize a rich document structure to ensure
    related writes happen together, there are still use cases that require the coordination
    of writes between multiple different documents that may be in the same or different
    collections. Because of this, it’s important to understand what MongoDB ACID multi-document
    transactions guarantee and how to best use them.


    In this section, we’ll first explore the history and evolution of transaction
    support in MongoDB, from single-document atomicity to distributed transactions
    across sharded clusters. Then, we’ll break down the core ACID properties, that
    is, **atomicity**, **consistency**, **isolation**, and **durability**, and how
    they apply within MongoDB’s transaction model. Finally, we’ll compare document-level
    atomicity with multi-document transactions, helping you understand when each approach
    is appropriate and how to balance data integrity with performance.


    # History and evolution of transactions in MongoDB


    MongoDB’s journey with transaction support tells an interesting story of how the
    database has evolved to meet increasingly complex application requirements:


    +   - **The single-document era (pre-MongoDB 4.0)**: From its inception, MongoDB
    provided atomicity at the single-document level. This was sufficient for many
    use cases, especially when leveraging MongoDB’s flexible document model to embed
    related data within a single document. Developers would often design schemas specifically
    to take advantage of this single-document atomicity.

    +   - **The replica set milestone (MongoDB 4.0, 2018)**: This release introduced
    multi-document ACID transactions for replica sets, a game-changer that brought
    MongoDB into parity with relational databases for applications requiring strong
    consistency across multiple documents. This initial implementation supported transactions
    within a single replica set.

    +   - **The distributed transactions breakthrough (MongoDB 4.2, 2019)**: Building
    on the previous release, MongoDB 4.2 extended multi-document transaction support
    to sharded clusters. This significant advancement enabled distributed transactions
    across shards, providing a comprehensive solution for complex, large-scale applications.'
  merge: -1
  img_proc: true
- pgno: 209
  md: '+   - **Continued refinements (MongoDB 4.4 and beyond)**: Recent releases have
    focused on performance improvements, operational manageability, and broader API
    support for transactions.


    This evolution reflects MongoDB''s commitment to meeting diverse application needs
    while maintaining its core strengths in flexibility, scalability, and performance.


    # Introduction to ACID properties in MongoDB


    ACID represents the fundamental properties that ensure database transactions are
    processed reliably, even in the face of errors, crashes, or power failures. Let’s
    break down what each of these properties means in the context of MongoDB:


    +   - **Atomicity:** This guarantees that a transaction is all or nothing; that
    is, either every operation in the transaction succeeds or none do. If any part
    of the transaction fails, the entire transaction is rolled back, leaving the database
    in its original state. While MongoDB has always provided atomicity at the single-document
    level, that is, if any change to a document fails, then all changes to that document
    fail, multi-document transactions extend this guarantee across multiple documents.

    +   - **Consistency:** This property ensures that a transaction brings the database
    from one valid state to another, maintaining all defined rules and constraints.
    In MongoDB, consistency validations primarily exist on a per-document basis through
    document and schema validation features. Both single-document operations and multi-document
    transactions guarantee consistency. Other consistency validations, such as unique
    index constraints, are also guaranteed the same way inside and outside of transactions.

    +   - **Isolation:** Think of isolation as each transaction operating in its own
    little bubble. It ensures that concurrently executing transactions don’t interfere
    with one another’s outcomes, as if they were executed sequentially. MongoDB provides
    snapshot isolation for transactions, meaning each transaction sees a consistent
    snapshot of the data as it existed at the start of the transaction, regardless
    of changes made by other transactions that commit during its execution. If two
    transactions try to make a conflicting modification, one of them will fail and
    retry the entire transaction.

    +   - **Durability:** Once a transaction is committed, its changes are permanent
    and will survive subsequent system failures such as power outages or crashes.
    In MongoDB, durability is achieved through journaling on multiple nodes and write
    concern mechanisms. When a transaction is committed with an appropriate write
    concern (such as the default `{w: "majority"}`), the changes are guaranteed to
    be durable across the majority of replica set members. This is a stronger guarantee
    than a single node committing a write to disk.'
  merge: -1
  img_proc: true
- pgno: 210
  md: "Together, the ACID properties provide a foundation for predictable and reliable\
    \ behavior in MongoDB transactions. They ensure that multi-step operations are\
    \ either fully completed or have no effect, helping maintain data integrity even\
    \ in the presence of concurrent workloads, application errors, or system failures.\
    \ This can be particularly important for applications that coordinate changes\
    \ across multiple collections, such as processing orders, updating inventory,\
    \ or managing user accounts.\n\n# Document-level atomicity versus multi-document\
    \ transactions\n\nUnderstanding the difference between MongoDB’s default document-level\
    \ atomicity and multi-document transactions is crucial for effective data modeling\
    \ and optimizing performance.\n\n# Document-level atomicity\n\nMongoDB has always\
    \ guaranteed that operations on a single document are atomic. When you update\
    \ multiple fields within a document, either all changes are applied or none are;\
    \ there’s no in-between state where only some fields are updated. These changes\
    \ are also only ever visible to other threads together or not at all. This built-in\
    \ atomicity, combined with MongoDB’s rich document model that allows for embedding\
    \ related data, means many use cases don’t actually need multi-document transactions\
    \ at all.\n\nFor example, if you’re tracking an order with its line items, embedding\
    \ the line items within the order document ensures that updates to both the order\
    \ status and its items happen atomically:\n\n```\n```json\n{\n  \"_id\": \"order123\"\
    ,\n  \"customer\": \"jane_doe\",\n  \"status\": \"shipped\",\n  \"items\": [\n\
