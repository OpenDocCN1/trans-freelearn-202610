- pgno: 268
  md: '# Monitoring and troubleshooting connections


    Effective connection management requires ongoing monitoring and the ability to
    quickly diagnose problems when they occur. By implementing proactive monitoring
    practices and having clear troubleshooting approaches ready, you can identify
    potential issues before they impact your application’s performance and reliability.


    MongoDB drivers expose detailed metrics about their connection pools, giving you
    visibility into how your application is utilizing database connections.


    Most MongoDB drivers implement the Connection Monitoring and Pooling (CMAP) specification,
    though each language driver provides different methods for accessing these metrics.
    For example, in Node.js, you can use event listeners to monitor connection pool
    activity:


    ```

    // Node.js example using event listeners for CMAP events

    const uri = "mongodb+srv://user:pass@abcdef.mongodb.net/";

    const client = new MongoClient(uri);

    client.on(''connectionPoolCreated'', event => console.log(event));

    client.on(''connectionCheckedOut'', event => console.log(event));

    client.on(''connectionCheckedIn'', event => console.log(event));

    ```


    See https://www.mongodb.com/docs/drivers/node/current/monitoring-and-logging/monitoring/#connection-pool-events
    to learn more about tracking these connection metrics using the Node.js driver.


    While driver metrics capture the application’s view of its interactions with the
    database, MongoDB servers provide complementary metrics about incoming connections
    from their viewpoint. These metrics can help you understand your deployment’s
    overall connection utilization across all client applications:


    +   - **connections.current**: Number of active client connections to the server.
    Approaching the maximum indicates potential connection saturation.

    +   - **connections.available**: How many more connections the server can accept
    before reaching its configured limit.

    +   - **connections.totalCreated**: Total number of connections created since
    server start. Rapid increases may indicate connection churn.


    You can retrieve these metrics through the serverStatus command in MongoDB Shell
    or through your preferred MongoDB driver:


    ```

    db.adminCommand({ serverStatus: 1 })

    ```'
  merge: -1
  img_proc: true
- pgno: 269
  md: 'By correlating client-side and server-side metrics, you can build a comprehensive
    view of connection health across your entire application stack. Check out the
    MongoDB documentation for the serverStatus command at https://www.mongodb.com/docs/manual/reference/command/serverStatus/#connections
    to learn more.


    When connection issues occur, they typically manifest as specific error types.
    Learning how to recognize these symptoms is crucial for effective troubleshooting:


    +   - **socketTimeout**: The operation takes longer than the configured socketTimeoutMS.
    Often indicates network congestion or overloaded servers.

    +   - **EOF (End of File)**: The server closed the connection unexpectedly. This
    may result from server restarts, network interruptions, or idle timeout policies.

    +   - **Broken pipe**: The connection was severed while the client was still using
    it. Typically indicates network failures or proxy interruptions.

    +   - **Authentication failures**: Incorrect credentials or authentication configuration.
    May occur after credential rotations or configuration changes.


    Connection pool exhaustion is a particularly serious condition that can rapidly
    degrade application performance. Look out for these warning signs:


    +   - Increasing wait queue length in driver metrics

    +   - MongoWaitQueueTimeoutException or similar errors in application logs

    +   - Sudden increases in operation latency

    +   - Request failures during traffic spikes


    It’s important to remember that connection pool exhaustion can quickly cascade
    into system-wide failures as timeouts trigger retries, which create more connection
    requests, accelerating the exhaustion.


    For deployments using TLS or DNS-based service discovery, additional connection
    problems may arise from security or network configuration issues. These issues
    can be particularly challenging because they may appear intermittently or only
    under specific conditions. Secure connections depend on proper TLS configuration
    and certificate management. When experiencing TLS-related connection failures,
    verify the following:


    +   - Certificate chains are valid and trusted by all clients

    +   - Certificate hostnames match the server’s configured hostname

    +   - TLS protocol versions and cipher suites are compatible between client and
    server'
  merge: -1
  img_proc: true
