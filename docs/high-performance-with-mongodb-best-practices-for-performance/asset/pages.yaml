- pgno: 381
  md: '# Use case: Diagnosing insufficient IOPs in self-managed MongoDB


    On self-managed systems, it’s common to see a similar pattern across customer
    deployments: workloads naturally grow over time, often outpacing the capabilities
    of the underlying infrastructure. With MongoDB Atlas, this is easy to catch early
    using built-in monitoring tools that provide real-time visibility into key metrics
    such as idle CPU, disk IOPs headroom, and the number of operations being executed.
    However, when managing MongoDB clusters independently, teams must rely on scripts
    or external monitoring tools to track these metrics.


    In this example, we revisit a case from a customer who was self-managing MongoDB
    on their cloud infrastructure. As performance issues began to surface, the MongoDB
    support team turned to the server’s diagnostic data.


    # Diagnosing the cause


    MongoDB servers capture system information and internal counters every second
    in **Full-Time Diagnostic Data Capture (FTDC)**. This data doesn’t contain any
    sensitive information such as queries, query predicates, results, or credentials.


    Analyzing the storage read requests per second (which on Linux comes from the
    iostat command), they found the database server was issuing 16,600 IOPs. FTDC
    data from vmstat showed 39% iowait, indicating the system was spending significant
    time waiting for I/O operations.


    The customer had provisioned the underlying storage with 15,000 IOPs. Cloud providers
    typically allow bursting beyond the provisioned limit for a period before throttling.
    This bursting, followed by throttling, was experienced as stalls by the customer’s
    application.


    Looking at the IOPS allocation, we realized we were using more IOPS than provisioned.
    Performance was acceptable for a time because higher burst IOPS were provided.
    However, after the burst allowance was exhausted, a sharp performance degradation
    followed. The system no longer had enough IOPS, and operations slowed, waiting
    for I/O.


    # Implementing the solution


    The customer increased the provisioned IOPS from 15,000 to 18,000, which immediately
    resolved the performance stalls.'
  merge: -1
  img_proc: true
- pgno: 382
  md: '# Results and learnings


    This case highlights several important principles regarding hardware resource
    constraints in Atlas and self-managed MongoDB deployments. I/O limitations frequently
    present themselves as high iowait percentages, signaling potential bottlenecks
    in storage. In cloud environments, it’s worth noting that temporary bursting above
    provisioned limits may be possible, but this is not always sustainable for growing
    workloads. A deep understanding of the relationship between application workload
    and resource provisioning is critical for maintaining optimal performance. Even
    without the advanced monitoring capabilities provided by Atlas, diagnostic tools
    such as FTDC can offer valuable insights to identify and address underlying issues.
    Finally, it’s worth remembering that sometimes the simplest and most effective
    solution to performance problems is simply increasing the available resources
    to match the demands of the workload. This case serves as a reminder of the importance
    of proactive planning and monitoring to avoid resource bottlenecks.


    # Systematic approach to performance troubleshooting


    Based on the examples we’ve explored, here is a structured methodology to diagnose
    and resolve MongoDB performance issues:


    +   1. **Identify symptoms and gather initial data:** The first step in troubleshooting
    is pinpointing performance symptoms and collecting relevant data to understand
    the problem. Determine when the issue started, identify which database operations
    or collections are affected, and gather baseline metrics such as CPU usage, IOPS,
    and query performance for comparison. This initial information helps build a clear
    picture of what’s happening and guides the next steps in diagnosis.

    +   2. **Use multiple diagnostic tools:** Leverage a variety of diagnostic tools
    to gain deeper insights into the issue. For Atlas users, monitoring dashboards
    provide a visual overview of key performance metrics, while those on self-managed
    clusters can use system monitoring tools to achieve similar results. The database
    profiler is invaluable for detecting slow queries, log files help uncover errors
    or patterns linked to performance degradation, and the currentOp() command identifies
    running operations. Additionally, the Performance Advisor offers recommendations
    for index optimization, which can often address query efficiency concerns. Remember
    that the observability and monitoring ecosystem is constantly evolving, and it’s
    important to stay current with emerging technologies.'
  merge: -1
  img_proc: true
- pgno: 383
  md: "+   3. **Categorize the issue:** Once the data is collected, categorize the\
    \ nature of the issue to narrow down possible solutions. Is it caused by inherently\
    \ slow operations, such as full collection scans or poor indexing strategies?\
    \ Could it stem from blocked operations, such as locks or cursor-related problems?\
    \ Or, is it the result of resource constraints involving CPU, memory, or disk\
    \ I/O limitations? Understanding the root cause is critical for selecting the\
    \ right approach to remediation.\n+   \n+   4. **Determine the scope:** Next,\
    \ assess the scope of the issue to ensure solutions are targeted effectively.\
    \ Is the problem affecting specific queries or collections, or is it broader and\
    \ system-wide? Additionally, verify whether the issue only occurs at specific\
    \ times, such as during peak workloads or scheduled jobs, to determine whether\
    \ timing or patterns play a role. Defining the impact and scope ensures efforts\
    \ are directed where they’ll be most effective.\n+   \n+   5. **Implement targeted\
    \ solutions:** Once the issue is understood, implement fixes tailored to the specific\
    \ problem. For inherently slow operations, consider adding indexes or optimizing\
    \ queries to improve efficiency. Blocked operations may require killing long-running\
    \ or stuck processes and resolving cursor-related issues. If resource constraints\
    \ are identified, scaling up CPU, memory, or disk IOPS, or redistributing workloads\
    \ across shards or clusters, can alleviate performance bottlenecks.\n+   \n+ \
    \  6. **Verify the solution:** After implementing changes, monitor key metrics\
    \ to ensure the problem has been successfully resolved. Verify that the issue\
    \ does not recur and confirm that performance has improved to the expected level.\
    \ Set up alerts or proactive monitoring to catch similar issues early in the future,\
    \ minimizing downtime and user impact.\n+   \n+   7. **Document findings and preventative\
    \ measures:** Finally, document the root cause of the issue and the steps taken\
    \ to resolve it. Use this opportunity to implement preventative measures, such\
    \ as updated monitoring workflows or infrastructure changes, to avoid similar\
    \ problems moving forward. Share these findings and best practices with other\
    \ team members to ensure alignment and reinforce a culture of proactive performance\
    \ management.\n\nBy following a structured approach, teams can systematically\
    \ identify, address, and prevent performance issues in MongoDB deployments. Consistent\
    \ monitoring and timely intervention are key to maintaining a responsive, scalable\
    \ system."
  merge: -1
  img_proc: true
- pgno: 384
  md: '# Summary


    In this chapter, we’ve explored real-world examples of MongoDB performance issues
    that align with William Zola’s three fundamental causes: inherently slow operations,
    blocked operations, and insufficient hardware resources. Through case studies,
    we saw how to identify performance issues using MongoDB’s built-in tools. We diagnosed
    root causes by examining query patterns, cursor behavior, and resource utilization.
    We then implemented targeted solutions through indexing, query optimization, and
    resource management. Finally, we set up preventative measures to catch issues
    before they become critical.


    The debugging tools for MongoDB performance have improved significantly in recent
    years. Atlas provides comprehensive monitoring and alerting capabilities, while
    self-managed deployments can leverage tools such as the database profiler, log
    analysis, and FTDC data.


    Remember that performance optimization is an ongoing process, not a one-time task.
    As your data grows and application patterns evolve, continually monitor performance
    metrics, review index usage, and adjust your configuration to maintain optimal
    performance.


    By systematically approaching performance issues using the principles and techniques
    outlined in this chapter, you’ll be better equipped to maintain high-performing
    MongoDB deployments regardless of scale or complexity.'
