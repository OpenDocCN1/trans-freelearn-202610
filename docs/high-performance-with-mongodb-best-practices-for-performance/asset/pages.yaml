- pgno: 165
  md: 'if the workload generated by each collection is different, you could allocate
    different resources via asymmetrical shard scaling, and any scatter-gather operations
    that are sent to every shard the collection lives on would only be sent to half
    as many shards. Since decreasing the number of total operations in the cluster
    helps scalability, this is a simple way to achieve that. As a bonus, if you have
    unexpected trouble with one of your shards, only one of the two collections will
    be impacted rather than both.


    To distribute two collections to a subset of shards, the database commands might
    look like this:


    ```

    // Example of distributing collections to subsets of shards using zones

    sh.addShardToZone("shard0", "C1")

    sh.addShardToZone("shard1", "C1")

    sh.addShardToZone("shard2", "C2")

    sh.addShardToZone("shard3", "C2")

    sh.addTagRange("db.coll1",{"<shKey>":MinKey},{"<shKey>":MaxKey},"C1")

    sh.addTagRange("db.coll2",{"<shKey>":MinKey},{"<shKey>":MaxKey},"C2")

    ```


    These commands first label each shard with either a C1 or C2 label, and then assign
    the coll1 collection to shards labeled C1 and the coll2 collection to shards labeled
    C2. You would use your actual shard key field names for <shKey>. This control
    adds complexity. You need to manage zones and range boundaries and how they map
    to zones, monitor balance across shards, and plan for uneven growth.


    While there are advantages of isolating each sharded collection to its own subset
    of shards, there are two cases where doing so should be avoided, and instead,
    collections should be colocated on the same shards with shard key ranges that
    keep related data together. One is to support multi-document transactions across
    two collections staying on a single shard; the other is keeping $lookup operations
    between two collections from needing to work across the network. We''ll discuss
    this further in the Colocating sharded collection chunks together section, later
    in this chapter.


    # Advanced sharding administration


    When working with sharded clusters, there are a handful of operational considerations
    that, while not part of the core sharding mechanics, are important to understand
    if you want to keep your deployment efficient and responsive over time. These
    include resharing when things go sideways, pre-splitting for large data loads
    into new collections, managing the balancer, moving unsharded collections, and
    understanding how to best distribute your data for best performance.'
  merge: -1
  img_proc: true
- pgno: 166
  md: '# Resharding: Whether, when, and how


    Picking the right shard key the first time is ideal, but let’s face it, sometimes
    we make the wrong decision the first time, and other times, real-world usage patterns
    evolve. What started as a good key might become a bottleneck. Maybe you chose
    a hashed shard key on a field that was already randomized without realizing the
    extra overhead caused by it, and now you want to change it to a regular ranged
    shard key. Or maybe you used order_id for your orders collection and now you realize
    that the majority of your queries for a particular customer’s orders are scatter-gathered
    and not targeted, and you want to change the shard key to {customer_id, order_id}
    because it allows better targeting of queries.


    MongoDB’s resharding feature gives you a second chance. Without downtime, you
    can change the shard key to something more appropriate that lets your data be
    rewritten across shards without downtime. Resharding is a background operation;
    it reads and rewrites all your data behind the scenes, but when it completes,
    you’re left with a better-distributed collection and a system that can breathe
    again.


    Resharding is not just for changing your shard key; it can be used with an existing
    shard key to redistribute or rewrite your collection to existing shards faster
    than it might take the balancer to move chunks and clean up orphans. Starting
    from MongoDB version 8.0, you can run the reshardCollection command on your collection
    using the same shard key by setting the forceRedistribution option to true. Consider
    using it if you are adding or removing multiple shards at once, or after sharding
    an existing unsharded collection. In Figure 6.7, there are three shards in this
    cluster, and there is an unsharded collection on shard A. Now, the data in this
    collection has grown and you want to shard it. As a shard can only be involved
    in one chunk migration at a time, the balancer can only move the data from shard
    A to either shard B or shard C at a time. The balancing speed could be slow. Also,
    after a chunk is migrated, shard A would need to delete its original copy of the
    data in this chunk, and the disk space is not reclaimed automatically. If you
    reshard this collection immediately after sharding it, the resharding mechanism
    then creates a temporary collection, and all three shards can read the data from
    shard A and rewrite it to the temporary collection in parallel. When resharding
    completes, it will rename the temporary collection and drop the original collection.
    The disk space is reclaimed automatically on shard A.'
  merge: -1
  img_proc: true
- pgno: 167
  md: '![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_167_0.png)


    ![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_167_1.png)


    ![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_167_2.png)


    Figure 6.7: Chunk migration versus resharding


    See the documentation for more details, restrictions, and examples: https://www.mongodb.com/docs/manual/core/sharding-reshard-a-collection/.


    The command to refine (or extend) your shard key that we mentioned in the Shard
    key with good granularity section is different from the resharding command, since
    extending the shard key with additional fields does not require moving any data
    from their current shards. Read more about refining the shard key in the documentation:
    https://www.mongodb.com/docs/manual/core/sharding-refine-a-shard-key/#std-label-shard-key-refine.


    # Balancer considerations


    Behind the scenes of a MongoDB sharded cluster, the balancer works to ensure that
    data is evenly distributed across shards. Its job is to monitor data distribution
    and move chunks when things get uneven, keeping the system balanced. But while
    it’s turned on by default and it’s easy to forget about it, the balancer isn’t
    free, and understanding its behavior can be key to avoiding unintended side effects.


    First, there is overhead. Each chunk migration triggered by the balancer involves
    copying data from one shard to another, updating the metadata in the config servers,
    and deleting the original copy of the data. While these operations are efficient
    and safe, they still consume I/O, CPU, and network bandwidth. On a lightly loaded
    cluster, you might never notice it happening. On a busy production system, especially
    during peak demand hours, those background moves can compete with your application’s
    operations for resources and slow things down.'
  merge: -1
  img_proc: true
- pgno: 168
  md: 'This is why MongoDB allows you to set balancer windows, specific hours during
    which chunk migrations are allowed. For instance, you might restrict balancing
    to overnight hours or off-peak periods when traffic is lowest. This lets you maintain
    optimal performance during the day while still allowing the system to redistribute
    data when it’s safer to do so without noticeable impact.


    But even with balancing windows set, you’ll want to keep an eye on things. The
    balancer can act based on data size, not on access frequency. That means it might
    not catch hot shards that serve more traffic, even if they hold fewer documents.
    Regularly reviewing the distribution of not just data but load is essential to
    avoiding silent performance degradation. The balancerStatus, currentOp, and sh.status()
    commands are your friends here, as well as monitoring charts showing you the number
    of operations on each shard. The last thing to remember is that the balancer is
    great at moving small chunks of data around to restore balance in a somewhat-unbalanced
    sharded collection. When you need entire shards to be populated with data, resharding
    may be faster.


    # Pre-splitting: Whether, when, and how


    Most of the time, MongoDB’s balancer does a great job of reacting to growing data
    and keeping it distributed. But in some scenarios, such as large initial imports,
    you don’t want to insert everything into one shard and then wait for the balancer
    to catch up. That’s where pre-splitting comes in.


    Pre-splitting depends on your shard key value range. You’ll need to create a script
    that splits the full range of shard key values into several chunks and distributes
    them evenly among the shards that will receive new data using the moveRange command.
    If your shard key value is a string, use ranges such as MinKey-k, k-s, and s-MaxKey,
    if you want to start with chunks on three shards. If your values are of other
    types, figure out the approximate range of values in your dataset and then split
    them accordingly. Remember that you don’t have to be very precise as the balancer
    will easily handle smaller imbalances once enough of your data is loaded. What
    you want to avoid is having all the data going to a single shard at the beginning.


    Generally, you want to use pre-splitting before a bulk import into a brand-new
    empty collection, or during the early stage of setting up a new cluster. Pre-splitting
    is simplest when you understand how your data is distributed ahead of time, and
    you want to start off on the right foot.


    Pre-splitting is proactive. It shifts your mindset from reactive load management
    to deliberate data planning, and in the right hands, it’s one of the most effective
    ways to ensure your cluster starts and stays healthy.'
  merge: -1
  img_proc: true
- pgno: 169
  md: '# Moving unsharded collections


    Not every collection in your database will be sharded. In fact, all smaller collections
    will be unsharded, and only collections too large to fit on one shard should be
    sharded. Just like not every sharded collection needs to live on every shard,
    unsharded collections don’t need to live together on one primary shard. In fact,
    it would usually be better to distribute them evenly among your shards, because
    even unsharded data can cause issues if it causes your cluster distribution to
    be uneven. Imagine small daily collections for events where each day you dump
    the data into a separate unsharded collection (and eventually drop old ones).
    If all the days are on the same shard, that shard will eventually become overwhelmed,
    not because of sharding, but because of an imbalance of unsharded collections.


    In these situations, the moveCollection command (supported starting in MongoDB
    version 8.0) should be your tool of choice. It lets you manually move an entire
    unsharded collection from one shard to another. It’s not automatic, and it does
    briefly block writes during the move if you are running it on an active collection
    (usually for just a few seconds), but it can be a lifesaver in rebalancing workloads
    without going through the complexity of sharding a collection that doesn’t need
    to be sharded. As a bonus, if you anticipate this and execute moveCollection right
    at the beginning when you first create the collection, moving an empty collection
    is going to be fast and low cost.


    In Figure 6.8, originally, the unsharded A-H collections in the testdb database
    are all on shard0. We can run the following commands to move some of them to shard1
    to distribute the data in this cluster:


    ```

    // Move unsharded collections to specific shards

    // Useful for balancing unsharded data across the cluster

    db.adminCommand({moveCollection:"testdb.E", toShard:"shard1"})

    db.adminCommand({moveCollection:"testdb.F", toShard:"shard1"})

    db.adminCommand({moveCollection:"testdb.G", toShard:"shard1"})

    db.adminCommand({moveCollection:"testdb.H", toShard:"shard1"})

    ```'
  merge: -1
  img_proc: true
- pgno: 170
  md: '![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_170_0.png)


    *Figure 6.8: Moving unsharded collections*


    # Colocating sharded collection chunks together


    As was mentioned in the Zone-based sharding section, there are two cases where
    it may be beneficial for performance to disable the balancer and manually (via
    scripting) colocate two or more collections on the same shards with shard key
    ranges that keep related data together. The first case where it can significantly
    help is multi-document transactions, where single-shard transactions are significantly
    more performant than multi-shard ones, and the other is aggregations with $lookup
    operations between two collections, where keeping related ranges on the same shards
    allows the pipeline to execute locally rather than needing to send data across
    the network to another shard.


    An example of that is the case of the TPC-C benchmark commerce data, which has
    collections for warehouses, districts, customers, and orders. We can use range
    sharding on each of these collections, which share prefixes to locate the same
    values on the same shards:


    | Collection | Shard key |

    |---|---|

    | WAREHOUSE | w_id |

    | DISTRICT | w_id, d_id |

    | CUSTOMER | w_id, d_id, c_id |

    | ORDERS | w_id, d_id, c_id, o_id |


    *Table 6.2: Collections and their shard keys for the TPC-C benchmark*


    To achieve colocation, we would disable the balancer for these collections, then
    split them on the same prefix (w_id) values, and move the chunk ranges with the
    same values to the same shards. Alternatively, we can associate the zone ranges
    on the same prefix (w_id) values with the same zone using the following commands,
    and let the balancer split and move the chunk ranges accordingly:'
  merge: -1
  img_proc: true
- pgno: 171
  md: '```

    // Colocating sharded collection chunks together for TPC-C benchmark

    sh.shardCollection("db.WAREHOUSE", {w_id:1})

    sh.shardCollection("db.DISTRICT", {w_id:1, d_id:1})

    sh.shardCollection("db.CUSTOMER", {w_id:1, d_id:1, c_id:1})

    sh.shardCollection("db.ORDERS", {w_id:1, d_id:1, c_id:1, o_id:1})


    // Associate each shard to a unique zone

    sh.addShardToZone("shardA", "ZoneA")

    sh.addShardToZone("shardB", "ZoneB")

    sh.addShardToZone("shardC", "ZoneC")


    // For each collection, associate the range with the same prefix to the same zone

    sh.addTagRange("db.WAREHOUSE",{w_id:MinKey},{w_id:33},"ZoneA")

    sh.addTagRange("db.DISTRICT", {w_id:MinKey,d_id:MinKey},

    {w_id:33, d_id:MinKey},"ZoneA")

    sh.addTagRange("db.CUSTOMER", {w_id:MinKey,d_id:MinKey,c_id:MinKey},

    {w_id:33,d_id:MinKey,c_id:MinKey},"ZoneA")

    sh.addTagRange("db.ORDERS", {w_id:MinKey,d_id:MinKey,c_id:MinKey,

    o_id:MinKey}, {w_id:33, d_id:MinKey,c_id:MinKey,o_id:MinKey},"ZoneA")


    sh.addTagRange("db.WAREHOUSE", {w_id:33},{w_id:66},"ZoneB")

    sh.addTagRange("db.DISTRICT", {w_id:33,d_id:MinKey},

    {w_id:66,d_id:MinKey},"ZoneB")

    sh.addTagRange("db.CUSTOMER", {w_id:33,d_id:MinKey,c_id:MinKey},

    {w_id:66,d_id:MinKey, c_id:MinKey},"ZoneB")

    sh.addTagRange("db.ORDERS", {w_id:33,d_id:MinKey,c_id:MinKey,o_id:MinKey},

    {w_id:66,d_id:MinKey,c_id:MinKey,o_id:MinKey},"ZoneB")


    sh.addTagRange("db.WAREHOUSE", {w_id:66}, {w_id:MaxKey},"ZoneC")

    sh.addTagRange("db.DISTRICT", {w_id:66,d_id:MinKey},

    {w_id:MaxKey, d_id:MaxKey},"ZoneC")

    sh.addTagRange("db.CUSTOMER", {w_id:66,d_id:MinKey,c_id:MinKey},

    {w_id:MaxKey, d_id:MaxKey, c_id:MaxKey},"ZoneC")

    sh.addTagRange("db.ORDERS", {w_id:66,d_id:MinKey,c_id:MinKey,o_id:MinKey},

    {w_id:MaxKey,d_id:MaxKey,c_id:MaxKey,o_id:MaxKey},"ZoneC")

    ```'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'Figure 6.9 shows that after the zone ranges are defined, the balancer splits
    and moves the chunks to the corresponding shard associated with the zone.


    ![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_172_0.png)


    Figure 6.9: Same ranges for different collections on the same shard


    While this may seem operationally complex, in reality, this would be scripted,
    and after being tested in a staging environment, the process in production would
    just be to run the script to initialize the data distribution automatically.


    By partitioning the same warehouse ID values to the same shards, we maximize the
    likelihood that transactions that involve the same customer, orders, districts,
    and warehouses will happen on a single shard. This is the same way that we would
    minimize cross-shard $lookup for aggregation queries that need to look up the
    details for related entities.


    Just like every decision about your MongoDB schema and indexes depends on your
    requirements and the trade-offs you’re able to make, so does the decision to shard
    for performance and scalability of your cluster. Selecting the shard key with
    your SLAs in mind is imperative to ensure that you are optimizing for what’s most
    important. There’s usually no perfect answer, just trade-offs. The key is to understand
    your application’s dominant access patterns. Are you reading data by entity or
    writing it in bulk? Do you expect some entities to dominate the workload? Balance
    is possible, but it starts with modeling intentionally, and it continues with
    monitoring, iterating, and sometimes... yes, resharding.'
  merge: -1
  img_proc: true
- pgno: 173
  md: '# Summary


    MongoDB’s sharding architecture is a powerful and flexible tool for achieving
    horizontal scalability in deployments with massive datasets and demanding throughput
    requirements. By understanding the core components of a sharded cluster, the importance
    of shard key selection, and the variety of sharding methods available, you can
    design a system that efficiently distributes and targets operations. Additionally,
    the advanced techniques discussed, such as refining shard keys, using zoning for
    strategic data placement, pre-splitting during bulk imports, and balancing workloads
    across shards, all contribute to maintaining an efficient and responsive cluster
    as your data and workload scale. Effective sharding is not just about distributing
    data, but also about anticipating and managing the nuances of query patterns,
    operational overhead, and evolving needs. With this knowledge, you’re well positioned
    to create scalable and robust architectures that can support the growing demands
    of your application.


    In the next chapter on storage engines, we’ll shift our focus from data distribution
    to data storage, diving deeper into the WiredTiger storage engine, the default
    and most commonly used storage engine for MongoDB.'
  merge: -1
