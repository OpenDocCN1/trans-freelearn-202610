- pgno: 123
  md: '![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_123_0.png)


    # Avoid early $project stage to preserve pipeline optimization


    It’s not necessary to manually remove fields that won’t be used. This is something
    that the pipeline optimization stage already does automatically for you by examining
    which fields your pipeline is using and avoiding fetching unused fields. This
    automatic pipeline optimization can be unintentionally defeated by adding an unnecessary
    early explicit inclusion $project stage, so don’t use $project till the end of
    the pipeline to rename or otherwise reshape the results into the form that the
    client expects.


    MongoDB can combine certain stages into a single, more efficient stage. This coalescence
    reduces overhead and speeds up execution. As a best practice, you can group similar
    operations yourself and avoid unnecessary stages to help the optimizer do its
    job, but don’t spend too much time on it as some of these stages may already be
    very fast. On the other hand, some stages can be significantly sped up by doing
    the right thing:


    +   - When the $sort stage is immediately followed by a $limit stage, MongoDB
    optimizes this by combining them and only tracking the top N sorted documents,
    significantly reducing memory usage for the sort. This is referred to as a top-N
    sort, and it’s infinitely more performant than sorting the entire dataset and
    later only keeping the top N values.

    +   - Multiple adjacent $match stages are typically merged into a single $match
    stage, combining their filter conditions with an implicit AND, so you shouldn’t
    need to combine them yourself. But make sure you have a compound index to support
    conditions in the combined filter.


    In general, when stages that the MongoDB query system can optimize are placed
    early in the pipeline, they are pushed down to the query subsystem, and only documents
    that the query returns are processed in the pipeline. When looking at explain
    output, this will usually manifest by the first stage being $cursor and will absorb
    all the early stages, such as $match, $sort, and $limit, into it. In cases where
    there are no further aggregation stages and the full aggregation pipeline could
    have been expressed as a find command, it will actually get executed the same
    as the equivalent find command, and explain will not show any additional aggregation
    stages.


    In this section, you saw how certain stages can be pushed down to the query subsystem
    when they are placed early in the pipeline. They should be optimized the same
    way as equivalent queries would be. Let’s now look at some of the other potentially
    challenging stages and scenarios.'
  merge: -1
  img_proc: true
- pgno: 124
  md: '# Avoid unnecessary $unwind and $group


    The $unwind stage is used to flatten arrays, and it is often misunderstood as
    a performance villain, but in reality, it is not inherently slow or problematic.
    The challenge arises from what is done with its results. When unwinding or flattening
    an array is done to apply some stages to resultant documents, but then the results
    are grouped again (using $group) with "$_id" as the group key (reconstructing
    them back into original documents), it’s always the case that it was a mistake
    to use $unwind + $group. Instead, one or more array-processing expressions should
    have been used on documents without deconstructing them.


    The $map expression allows you to manipulate each element in an array and returns
    an array of the results, allowing transforming array elements in place. Other
    array expressions include $filter, which returns only array elements that satisfy
    a given condition, $sortArray for sorting elements of the array, and $reduce for
    aggregating array elements within a document without unwinding.


    Sometimes, of course, unwinding before $group is the only correct option, particularly
    when you need to group on individual array elements across multiple documents.
    In such cases, if you don’t intend to keep all the elements, you can use $match
    with $elemMatch on the array element before $unwind. This allows you to use an
    index on the array field to improve performance.


    # Design efficient $group operations


    The $group stage can be memory-intensive, especially with high-cardinality grouping
    keys or when each group document is going to be large. $group must maintain the
    current state for each unique group it encounters. If the field you are grouping
    by (the _id field inside $group) has many unique values, this stage might need
    to store more data in memory than it’s allowed (by default, 100 MB is the in-memory
    limit for any individual stage, which we discuss shortly).


    To control group size, only keep fields and values that are necessary in grouping,
    and avoid using $push of entire incoming documents unless it is absolutely necessary.


    Different accumulators may also have different performance characteristics. Accumulators
    such as $sum, $avg, $min, $max, $first, and $last are generally efficient as they
    only need to maintain a single running value per group. In contrast, $push and
    $addToSet will be more memory-intensive when they accumulate many items into arrays,
    especially when these are large items.'
  merge: -1
  img_proc: true
