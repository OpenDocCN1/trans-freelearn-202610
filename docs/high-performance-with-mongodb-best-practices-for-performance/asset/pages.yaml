    +   5. Monitor shard-0 and the destination shard''s hardware metrics and operation
    execution times.


    ```

    db.adminCommand({ moveCollection: "db.collection_b", toShard: "shard-1" })

    ```


    # MoveCollection causes short write block


    The moveCollection command blocks writes to the collection for up to 2 seconds
    during its critical section. You can find more details in the documentation at
    https://mongodb.com/docs/manual/tutorial/move-a-collection/.


    # Results and learnings


    The team expected that migrating most resource-intensive unsharded collections,
    along with earlier schema and indexing optimizations, would ease the cluster''s
    resource demands, enabling them to downscale infrastructure, significantly reduce
    costs, and sustain performance levels.


    This example demonstrates that addressing hardware resource constraints requires
    more than simply scaling up; it calls for a strategic approach that integrates
    monitoring, diagnostics, workload analysis, and operational planning. Tools such
    as Atlas monitoring and Query Insights are crucial for pinpointing resource bottlenecks
    and analyzing both short-term metrics and long-term workload trends. With clear
    visibility into these metrics, organizations can implement data-driven solutions
    tailored to their cluster''s unique needs, ensuring corrective actions are precise
    and impactful.'
