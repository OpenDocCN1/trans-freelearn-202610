- pgno: 295
  md: "On the left, the non-multikey index uses tight bounds to find all documents\
    \ where the field a is between 5 and 10. On the right, the plan uses the index\
    \ to find all documents where a is between 5 and infinity and then fetches the\
    \ document to check that there is also a that's less than 10. Why can't a multikey\
    \ index use the same index bounds as a non-multikey index, and instead has to\
    \ choose between using one bound in the index and checking the other bound manually\
    \ in the FETCH stage? This is because array semantics say, “*one element can match\
    \ one condition, and a different element can match the other condition,*” and\
    \ if we used tight bounds, we would miss matching documents such as {a: [1, 11]},\
    \ where neither of the elements falls between 5 and 10!\n\n# Deduplication\n\n\
    Since every element of an array is indexed separately in the B-tree, additional\
    \ work is required to deduplicate the matched documents when a multikey indexed\
    \ query looks like {a: {$in: [1, 5, 10]}}. In this case, we perform three lookups\
    \ in the B-tree, one for each value, but all three may point to the same recordId.\
    \ The query must always perform extra work with multikey fields of multikey indexes\
    \ to ensure that duplicate records are not being returned (or counted more than\
    \ once).\n\nLet's look at the executionStats portion of the explain output for\
    \ the query {a: {$in: [500, 501, 502]}}, where multiple documents have arrays\
    \ with several of these values:\n\n```\nexecutionStats: {\n  inputStage: {\n \
    \   stage: 'IXSCAN',\n    nReturned: 1,\n    works: 4,\n    advanced: 1,\n   \
    \ isEOF: 1,\n    keyPattern: { a: 1 },\n    isMultiKey: true,\n    multiKeyPaths:\
    \ { a: [ 'a' ] },\n    indexBounds: { a: [ '[500, 500]', '[501, 501]', '[502,\
    \ 502]' ] },\n    keysExamined: 3,\n    seeks: 1,\n    dupsTested: 3,\n    dupsDropped:\
    \ 2\n  }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 296
  md: 'The single document returned had all three values in the search list in array
    "a", which is why we see that out of the three tested results, two were dropped
    as duplicates. This shows the extra work performed, which you can already see
    because nReturned is 1 while keysExamined is 3. The extra work is not because
    the index doesn’t efficiently store all the values we want to return; it’s because
    of the extra work done to eliminate duplicate results. While arrays are a powerful
    way of representing complex structures in your documents, it’s important to be
    aware of the extra cost some queries can have when dealing with indexed array
    fields.


    # Challenges with null and $exists


    In MQL, the query {a: null} matches all documents where a is either absent or
    a is present and equal to null. This includes cases where a is an array that contains
    null as well as some more complex scenarios.


    But in all of these cases, because both missing and null are returned by this
    query, the B-tree indexes store the value null to indicate that a value is either
    explicitly null or it’s missing; that is, it is not there at all. So, indexes
    can be used to easily check that a field is not equal to null, but it cannot be
    used to answer $exists:true or $exists:false queries. That’s because the document
    would still need to be checked to see whether the field exists with a null value,
    or whether it’s not there at all. The only exception to this is sparse indexes,
    which only index values that exist (including null) and, therefore, can answer
    the $exists:true predicate directly from the index without needing to check additional
    details in the document itself.


    Here are several explain fields when an index on a is used to check db.coll.find({a:
    {$ne: null}}):


    ```

    stage: ''IXSCAN'',

    keyPattern: { a: 1 },

    indexBounds: { a: [ ''[MinKey, null)'', ''(null, MaxKey]'' ] }

    ```


    The index bounds show that the query is handled as a range query, which matches
    values less than null and greater than null.


    All of this is essential to understand to write queries that are correct, but
    it’s also important to understand when indexes can and cannot be used as effectively
    as you might expect. In summary, if your application has a query that must check
    for the existence of a field, a sparse index can be used.'
  merge: -1
  img_proc: true
- pgno: 297
  md: '# Additional best practices


    Here are a few additional tips on the best ways to write your applications and
    knowing what to be aware of, as well as what to avoid as a general rule if you
    want to have a performant and scalable system. Some of the features to avoid are
    already planned for deprecation and removal by MongoDB, while others are meant
    for very specific use cases, and using them outside of those cases can introduce
    unnecessary overhead to your system.


    # Updates


    When composing your update modifications, it is always preferable to use individual
    field modifications rather than replacing the full document. From the application
    developer’s point of view, using updateOne is generally better than using replaceOne
    because replacing the full document when only a handful of fields have changed
    will be less efficient for the replication subsystem.


    In some cases, when the new version of a document is received from outside your
    application, and determining the exact changes would be prohibitively expensive
    or impractical, there is a trick you can use. Don’t use the following syntax:


    ```

    db.coll.replaceOne({_id:X}, {entire-new-document})

    ```


    Instead, use this updated syntax to achieve the same effect:


    ```

    db.coll.updateOne({_id:X}, [ {$replaceWith:{$literal:entire-new-document}} ])

    ```


    While at a glance this seems to use the aggregation syntax to tell the system
    to perform the same “replace existing document with this new document” process,
    in practice, what happens internally is that MongoDB compares the existing and
    new documents and generates deltas to record in the replication oplog, resulting
    in a much smaller oplog entry. In cases where our computation finds that those
    deltas are actually more verbose to record than the entire new document, we will
    write the entire new document to the oplog.


    For correctness, in multi-threaded systems, make sure you compose your updates
    using update modifiers, which allow multiple threads to make changes to the same
    document simultaneously without overwriting each other’s work. That means using
    $inc to increment counters rather than reading the document, modifying it in code,
    and then writing it back out. If the read-modify-write pattern is unavoidable
    for application-specific reasons, use versioning to ensure no other change has
    been made to the document between your read and write, or use the previous value
    of the field you are modifying in the filter for the write, so your write only
    succeeds if the value hasn’t been changed since you read it.'
  merge: -1
  img_proc: true
- pgno: 298
  md: '# findAndModify


    The findAndModify command is known in driver methods as findOneAndUpdate, and
    its purpose is frequently misunderstood. It is essentially the exact same command
    as updateOne, but instead of returning the result document that informs the client
    exactly what the update did (for example, was there an update, did it match any
    document or not, etc.), findOneAndUpdate performs the same update operation but
    returns the document that was updated (if any), either the version before the
    update or the one after it.


    Why does this functionality even need to exist? This is because sometimes you
    need to know what effect your update had, or which document was updated, and your
    update filter is structured in such a way that you don’t know and cannot determine
    this information any other way. Consider an example where there is a single document
    collection that just tracks a counter that’s being incremented by 1 every time
    a value is used:


    ```

    {_id:1, count: 35}

    ```


    If a client wants to use the next available count value and increment the counter
    so that it’s in the correct state for the next thread, it cannot do it with two
    separate update and find commands as there is no guarantee that another thread
    won’t sneak in there between the two operations. This is where findOneAndUpdate
    is useful: it lets the client send an update with {$inc:{count:1}} to increment
    the counter and, at the same time, retrieve the correct value the document had
    before or immediately after the update.


    Another example would be a client that’s looking for the next item of work in
    a collection that represents a queue. In addition to retrieving the _id value
    of the next document to be processed, it also needs to write to the document to
    indicate that it’s now being worked on, preventing another thread from trying
    to work on the same item. Here, returning the document, while at the same time
    atomically setting a field to logically lock it from other threads that are trying
    to find their own next piece of work, can be easily achieved with the findOneAndUpdate
    (aka findAndModify) command. It applies a filter and sort to find the document
    that’s ready for work (typically with the lowest or highest timestamp value) and
    isn’t already locked by another thread, sets the field to indicate “I’m going
    to work on this document,” and returns the document so the client knows what it’s
    working on. Using a separate updateOne operation followed by a findOne operation
    would not only introduce an unnecessary extra round trip but also leave no reliable
    way to know how to find the document that was just modified in a separate call.'
  merge: -1
  img_proc: true
- pgno: 299
  md: 'So, why is `findAndModify` more expensive than update, since both commands
    update one document and return one document (either the result document or the
    modified document)? It turns out that the main reason is a feature described in
    *Chapter 10, Client Libraries*, called *retryable writes*, where a MongoDB driver
    automatically retries a write operation that may or may not have succeeded during
    primary failover in a replica set. MongoDB internally tracks whether each write
    operation has succeeded, and can easily return a duplicate copy of the *result*
    if an operation is retried after already succeeding. However, to return the correct
    version of the document when a `findAndModify` operation is retried, the system
    has to do the extra work of writing a copy of the pre-change modified document
    to a special side collection. This introduces overhead that can make your system
    slower if you routinely use `findOneAndUpdate` unnecessarily instead of `updateOne`,
    and the impact is even greater and more problematic if your documents are quite
    large.


    Therefore, it’s perfect to use `findAndModify` when it’s necessary to correctly
    implement your application logic, but best to avoid it when a simple `updateOne`
    can do the job.


    # Aggregation and query


    Some aggregation stages and expressions are fine when used sparingly and only
    in specific cases they were designed for, but you should not overuse them when
    a simpler, more efficient alternative would suffice. This section will list some
    of those stages, operators, and commands that should be avoided or used sparingly,
    along with their potentially more performant alternatives.


    # $sample


    The `$sample` stage is meant to return some number, *N*, of randomly selected
    documents from the point in the pipeline where it appears. However, it performs
    efficiently in only one very specific scenario: when it is the *first stage* of
    the pipeline on a collection with *more than 100 documents*, and the number of
    documents requested is *less than 5%* of the total documents in the collection.
    In that one scenario, it uses a pseudo-random cursor to select those *N* documents.
    In all other scenarios, `$sample` does an expensive random sort of all the documents
    just to return the first *N*. If you genuinely need a truly random subset of documents,
    then of course, use `$sample`, but in most cases, where you simply want to limit
    the number of returned documents, it’s a lot quicker to use `$limit`.'
  merge: -1
  img_proc: true
- pgno: 300
  md: "# $facet\n\n$facet processes multiple aggregation pipelines within a single\
    \ stage on the same set of input documents. There is a misconception that the\
    \ $facet stage does some aggregation magic to parallel-process a pipeline into\
    \ multiple branches. That’s not really what happens at all. The simplest way to\
    \ think about $facet is this: every document flowing through the pipeline up to\
    \ that point is sent to each branch of $facet. This means that if one branch needs\
    \ only the first 10 documents, but another needs 1 million, then all 1 million\
    \ documents will be sent to every $facet branch.\n\n$facet is an excellent candidate\
    \ when you want to do extremely similar processing in each branch, for instance,\
    \ when computing both counts by category and counts by price range of all incoming\
    \ documents. It is not at all a good candidate when the processing you want to\
    \ do in its branches is very different. One example would be wanting to return\
    \ the first 10 documents as well as the total count of documents. In such cases,\
    \ it’s much better to use $unionWith, which runs two (or more) pipelines while\
    \ preserving all the optimizations that can be performed on each of them.\n\n\
    # $where, $function, $accumulator, and mapReduce\n\nWhen run on the server, JavaScript\
    \ will always be slower than expressing the same logic using native MQL syntax.\
    \ In addition, JavaScript is inherently a security risk for MongoDB servers and\
    \ has been deprecated with the intention of eventually removing it altogether\
    \ to eliminate that risk.\n\nFor faster execution and better security, avoid using\
    \ any JavaScript in your MongoDB queries or aggregations.\n\n> **JavaScript execution:\
    \ Server versus mongosh shell**\n> \n> This doesn’t apply to the mongosh shell,\
    \ which expands and interprets all the JavaScript before sending it to the server.\
    \ This warning is specifically for any and all JavaScript that is meant to be\
    \ executed on the database server itself.\n\n# $text\n\nIf you wanted to do a\
    \ full-text search before the MongoDB Atlas full-text search feature was introduced,\
    \ your options were either using a $text operator, which relied on legacy MongoDB\
    \ text indexes, or sending your data to another system. Since the launch of Atlas\
    \ Search, development on native legacy text indexes has been stopped, and it’s\
    \ fully expected that this feature will eventually be deprecated in favor of Lucene-based\
    \ search. This newer search capability will be available in the MongoDB Community\
    \ version as well as MongoDB Atlas."
  merge: -1
  img_proc: true
- pgno: 301
  md: '# $regex and indexes


    Because indexes store values in sorted order, it might not come as a surprise
    that when you use a $regex operator to match part of a string, the index can only
    be used efficiently if $regex is the equivalent of the starts with pattern, what
    we call a left-rooted or anchored regular expression. Additionally, the index
    can only be used efficiently if the regular expression does not specify the case-insensitive
    option. For example, if your query is something such as { s: { $regex: /^Abc/
    } }, which says, “all strings that start with exactly Abc,” then an index on s
    will be used as an efficient range query. For case-insensitive string matching,
    consider using indexes with appropriate collation.


    # Aggregation versus match expressions


    There are a few expressions that share the same name in both find and aggregate
    but behave slightly differently. Always be cautious and ensure that you are expressing
    the exact semantics your application needs, and check that indexes are being used
    the way you want them to be. For example, $eq in aggregation literally means equal;
    it does not look inside arrays. On the other hand, $in in aggregation means “are
    any array elements equal to this value?” whereas in find, $in is checking whether
    any of the specified values are equal to the field we are searching (with equals
    in find meaning “is equal to the value or contained within an array”).


    # $expr and indexes


    Because using $expr in find or $match means “I’m about to use an aggregation expression,”
    it implies aggregation semantics, and the use of indexes, which are designed to
    support find semantics, becomes tricky. This is why many queries that use $expr
    don’t use indexes when you might have expected them to, or they use indexes but
    have additional steps to ensure that the correct semantics are applied to your
    query. If it’s possible to express the query without using $expr, then make sure
    that’s how it’s written, and only use $expr when it’s the only way to achieve
    the exact query semantics you need.


    # $or clause and indexes


    Normally, a single query can only use one index. In this context, query refers
    to a single query filter passed to the find command or $match stage; a pipeline
    with many stages or subpipelines can use different indexes for different components.
    For instance, each subpipeline in a $unionWith stage is planned independently
    of the rest of the pipeline, and $lookup pipelines do their own planning using
    appropriate indexes regardless of the top-level pipeline.'
  merge: -1
  img_proc: true
- pgno: 302
  md: 'The only exception in the current MongoDB versions is when you have a query
    with a top-level $or. In this case, each branch of $or can use a different index
    since the results are a union of all of the branch results. In some cases, an
    $or might even be inside an $and clause and can be rewritten to be at the top
    level so that multiple indexes can be used. Sometimes the query optimizer rewrites
    this automatically, but to make things simpler, put the $or clause at the top
    level if it’s possible. What you learned about query planning still applies, as
    each clause of the $or statement is planned separately, but each clause’s plan
    will show up in the explain output as a special SUBPLAN stage.


    # Special collections, index types, and features


    There are use cases that are challenging to implement using basic documents and
    regular B-tree indexes. For very specific patterns, such as time series, geospatial
    coordinates, or vector embeddings, MongoDB offers specialized collections and
    indexes. MongoDB’s special collection types and advanced indexing features can
    substantially boost your application’s performance for specific use cases.


    # Time-series collections


    Imagine you’re building an IoT platform that collects temperature readings every
    second from thousands of sensors, or tracking stock prices that change by the
    millisecond. You’ll have a constant stream of data points, each with a timestamp.
    Updates are rare, and queries are usually over slices of time.


    In MongoDB, any set of documents where every document includes a timestamp and
    all documents share some metadata fields can be stored in a special time-series
    collection. For more details, see https://www.mongodb.com/docs/manual/core/timeseries-collections/.


    Rather than treating each timestamped document separately, MongoDB time-series
    collections group them internally into buckets, so that data from the same source
    is stored alongside other data points from a similar point in time. This reduces
    storage requirements and write amplification, as well as making typical range
    queries over time slices much faster.


    The performance gains come from several factors. MongoDB automatically compresses
    and organizes time-series data into an internal columnar format, which is incredibly
    efficient for the repetitive measurements typical of sensor or financial data.
    This leads to massive storage savings, often between 70 and 90%. A clustered index
    on the time field is created automatically, making time-range queries highly efficient
    without any extra setup. This translates to query speeds that are often 3-5x faster
    than what you’d get with the same queries on a standard collection. The reduced
    storage footprint also means less memory usage, smaller backups, and lower infrastructure
    costs.'
  merge: -1
  img_proc: true
- pgno: 303
  md: 'For instance, one fintech start-up saw their query times drop from 5 seconds
    to just 200 ms after migrating to a time-series collection, while a manufacturing
    customer cut their data storage costs by over 80%.


    # Geospatial indexes


    MongoDB supports query operations on geospatial data. By storing data as GeoJSON
    objects or coordinate pairs and then building geospatial indexes on it, you unlock
    access to multiple geospatial query operators to find objects within particular
    geometry, intersecting shapes, and points nearest to a specific location. You
    can find a full overview of geospatial queries and capabilities at https://www.mongodb.com/docs/manual/geospatial-queries/.


    When working with geospatial data, a well-configured 2dsphere index can improve
    query performance by orders of magnitude, especially for large datasets where
    queries without indexes would be painfully slow. However, keep in mind that geospatial
    indexes are larger than standard B-tree indexes, so it’s wise to monitor their
    memory usage, particularly if you’re indexing large polygons. The density of your
    data also matters; if your query area contains many points, MongoDB will have
    more work to do. In such cases, it’s a good idea to use additional filters to
    narrow down the results. For queries that frequently combine location with other
    criteria, such as finding restaurants within a 5 km radius that are currently
    open, a compound index on both the geospatial field and the other filter fields
    is the best approach for optimal performance.


    # Atlas Search


    While MongoDB’s regular query capabilities are powerful, sometimes you need more
    advanced full-text search functionality. Atlas Search integrates Apache Lucene
    directly into your MongoDB cluster. You can learn more at https://www.mongodb.com/docs/atlas/atlas-search/.


    Atlas Search delivers highly optimized text search, a significant step up from
    what’s possible with regular indexes. It excels at natural language searches,
    fuzzy matches, and autocomplete functionality, with results ranked by relevance
    to help users find what they need faster. This not only improves the user experience
    but also boosts infrastructure efficiency. Without Atlas Search, you would likely
    need to maintain a separate search engine alongside MongoDB, which adds operational
    complexity and data synchronization headaches. Because Atlas Search is built on
    Lucene, it maintains consistent performance even as your dataset grows.'
  merge: -1
  img_proc: true
- pgno: 304
  md: '# Atlas Vector Search


    Atlas Vector Search enables efficient similarity searches using vector embeddings,
    a task that is computationally expensive and slow with standard query methods.
    By storing your vector data alongside your other MongoDB data, you can use it
    as a vector database. This enables you to query data based on its semantic meaning
    and power your AI applications. To learn more, visit https://www.mongodb.com/docs/atlas/atlas-vector-search/vector-search-overview/.


    When implementing Vector Search, there’s a trade-off between query speed and accuracy
    and your choice of similarity algorithm (such as cosine, euclidean, or dotProduct)
    will impact both. Cosine similarity often provides a good balance between the
    two. For very large collections, using approximate nearest neighbor (ANN) searches
    can be dramatically faster than exact searches with only a minimal trade-off in
    accuracy.


    # Collations


    Different languages have different rules for sorting and comparing strings. Collation
    lets you specify language-specific rules for string comparison. Rather than jumping
    through complex hoops of storing your strings normalized to simple binary comparison,
    you can store data as it is and use appropriate collation to influence how sorting
    and comparisons behave in your application without sacrificing performance. Collation
    is an option on regular B-tree indexes. It is not just for supporting different
    characters in languages such as French or German; it also allows you to use case-insensitive
    string comparison, among other options. You can read more about how it works at
    https://www.mongodb.com/docs/manual/reference/collation/.


    For the best performance, it’s crucial that your queries use the same collation
    settings as your indexes. A mismatch will prevent MongoDB from using the index,
    forcing a much slower collection scan instead. While indexes with collation may
    use slightly more memory than standard ones, the trade-off is usually worth it.
    Sorting large result sets in memory with or without complex collations is very
    CPU-intensive, so relying on indexed sorts is always the better option when possible.


    The main benefit of using a specialized tool for a particular use case is that
    it can save you a significant amount of time compared to supporting the features
    yourself using base MongoDB features as building blocks. MongoDB special collections
    and indexes are optimized at the storage engine level to perform better than what
    can be implemented in your application. Don’t start thinking about these features
    only when you anticipate that you will reach enterprise scale. The ease of use
    of ready-made implementation means you can leverage it for small time-series collections,
    or limited geo or full-text search, as well as petabyte-sized workloads.'
  merge: -1
  img_proc: true
- pgno: 305
  md: '# Summary


    Optimizing database performance starts with a thorough understanding of how the
    MongoDB query engine processes queries and utilizes indexes. Knowing the life
    cycle of query execution, that is, how queries are parsed, planned, executed,
    and returned, provides developers with the foundation needed to design efficient
    operations. Diagnostic tools such as the explain command and log messages are
    invaluable for examining query results and identifying inefficiencies caused by
    suboptimal query plans, resource constraints, or other issues. These insights
    allow developers to pinpoint whether performance problems stem from the query
    itself or external factors such as disk I/O or memory contention. Proper evaluation
    of metrics such as query targeting ratios and execution statistics further equips
    developers to design smarter queries that minimize unnecessary overhead and reduce
    latency.


    Beyond the execution life cycle, avoiding inefficient operations and leveraging
    MongoDB’s specialized features can significantly improve system performance while
    reducing development effort. Using time-series collections for IoT or financial
    data, geospatial indexes for location-based queries, and tools such as Atlas Search
    or Atlas Vector Search for full-text and semantic similarity searches offers tailored
    solutions for unique use cases. These features, optimized at the storage engine
    level, provide efficiency and scalability without requiring custom implementations.
    Additionally, implementing strategies such as query hints, persistent query settings,
    and well-tuned indexes ensures a fine-grained control over execution plans and
    keeps systems running optimally. By combining thoughtful query design and robust
    diagnostic practices and selecting the right tools for the right workloads, developers
    can create high-performing, scalable applications that meet diverse requirements
    with less effort and fewer resources.


    In the next chapter, we will describe how operating systems and system resources
    can influence the performance and cost of your production systems.'
  merge: -1
  img_proc: true
