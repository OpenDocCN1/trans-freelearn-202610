    \n```\nconf = rs.conf();\nconf.members[0].tags = { \"usage\": \"production\" };\n\
    conf.members[1].tags = { \"usage\": \"reporting\" };\nconf.members[2].tags = {\
    \ \"usage\": \"production\" };\nrs.reconfig(conf);\n```"
