- pgno: 33
  md: '# 1


    # Systems and MongoDB Architecture


    Every database deployment operates within a larger system that includes networks,
    applications, hardware, and users. To scale or optimize MongoDB effectively, we
    must approach it with the mindset of a system designer, rather than thinking only
    as database engineers. This chapter introduces that shift in thinking. It will
    help you see how small changes in one area can lead to significant and sometimes
    unexpected effects across an entire system. Solving performance problems is not
    just about tuning technical settings; it also requires a deep understanding of
    how systems behave.


    We will begin by looking at systems more broadly, starting with examples from
    nature and the real world. You will be introduced to key concepts such as delays,
    feedback loops, and bottlenecks. These ideas will help explain why systems sometimes
    behave in counterintuitive or surprising ways when we attempt to change them.
    As the chapter progresses, we will gradually narrow our focus. We will move from
    general systems to software systems, then to data services, and finally, to MongoDB.
    Along the way, we will provide a high-level overview of common bottlenecks and
    examine two specific examples in more detail. We will also introduce a step-by-step
    process that you can use to diagnose and resolve performance and scalability issues.


    Every system contains a limiting factor, or bottleneck. When a system has multiple
    inputs and components, the true limiting factor is not always obvious. Improving
    other parts of the system will not increase overall performance unless the bottleneck
    itself is addressed. In my experience, many people spend time optimizing the wrong
    part of the system because they make incorrect assumptions about where the bottleneck
    lies. A structured approach, based on measurement and experimentation, makes it
    easier to identify and address the real issue.'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'This chapter will cover the following topics:


    +   - Examining the fundamental characteristics of systems

    +   - Exploring a typical software system and identifying potential performance
    bottlenecks

    +   - Introducing MongoDB architecture and its foundations

    +   - Understanding the connection between core MongoDB components and their role
    in application performance

    +   - Discussing strategies for managing complexity in modern data platforms

    +   - Reviewing performance monitoring tools and observability techniques

    +   - Finding bottlenecks and the iterative process for tuning


    # What are systems?


    A system is an interconnected set of elements organized in a way that fulfills
    a purpose. Donella Meadows defines systems as follows:


    > > A set of things—people, cells, molecules, or whatever—interconnected in such
    a way that they produce their own pattern of behavior over time. The system may
    be buffeted, constricted, triggered, or driven by outside forces. But the system''s
    response to these forces is characteristic of itself, and that response is seldom
    simple in the real world. [1]


    We see systems at many scales. Our solar system is a system of planets. Earth
    has weather and climate systems, as well as political and social systems such
    as countries and cities. A city contains institutional systems such as universities,
    which, in turn, have academic systems such as faculties, professors, and students.
    The engineering faculty has a lab system with multiple computers connected through
    a network system of bridges and routers. Each computer is a system of hardware
    and software components, including processors, memory, and applications.


    A store in the city is a system that manages products such as computers, with
    processes for inventory replenishment from suppliers and factories. Beyond the
    city, a forest is an ecological system containing trees, each a system of roots,
    branches, and leaves. A wild boar in the forest has biological systems, including
    skeletal, nervous, circulatory, and digestive systems. Even a single cell within
    the boar''s ear is a system, with its own internal subsystems such as mitochondria,
    a nucleus, and ribosomes.'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'The common thread unifying all these different systems is that their elements
    interact with each other within the system and with other systems around them.


    A system’s performance is often not determined by the strongest or fastest element,
    but by the weakest link. This is sometimes referred to as the **bottleneck** or
    the **limiting factor**. This is the element within a system that significantly
    restricts the system’s overall performance or growth. Bottlenecks can change over
    time. If you fix a bottleneck, another element will then become the bottleneck.
    Remember, everything that is true for general systems is true for software systems,
    as well. In later sections, we’ll look at typical software bottlenecks and some
    of the tactics you can use to fix them.


    # Characteristics of systems


    In this section, we’ll look at the potential pitfalls we can encounter when changing
    systems. We’ll see how buffers and delays can make it hard to understand a system’s
    behavior, and how changes can lead to unexpected outcomes.


    # Changing systems is a risky business


    The elements of a system can interact in non-linear ways. For example, a school
    is a system with elements such as students, classrooms, playgrounds, and basketball
    hoops. The behavior of the system doesn’t always emerge in a predictable way,
    as discussed here:


    +   - **Small changes can have big effects (butterfly effect)**: An insignificant
    action can lead to massive, unpredictable consequences. For example, a student
    starts running in the playground. Another student starts running after the first
    one. Soon, more and more students see the fun and join in. Suddenly, half the
    playground is playing tag.

    +   - **Feedback loops (chain reaction)**: This is a direct, step-by-step process
    where one event leads to another. In the cafeteria, a student tells a joke. If
    it’s funny, a few others laugh. Their laughter makes others in the cafeteria curious,
    and soon, everyone is laughing, even those who didn’t hear the joke. The laughter
    spreads in a way that builds on itself. This is called a **positive feedback loop**.

    +   - **More than the sum of its parts (synergy)**: A system can produce results
    that are greater than just adding up its components. During band practice, a single
    drum beat sounds simple. A single trombone note is cool. But when a whole band
    plays together, the music sounds much better than just adding up individual sounds.

    +   - **Unexpected outcomes (emergence)**: Systems can create results that aren’t
    obvious from the individual parts. For instance, during art class, a student mixes
    red and yellow paint to get orange, which surprises them.'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'Non-linear interactions mean small actions can trigger big changes, feedback
    loops can amplify their effects, elements can work together unexpectedly, and
    new outcomes can emerge. In general, humans struggle to comprehend non-linear
    interactions between different elements of the system and tend to see behavior
    as a series of discrete events, making it easy to miss the underlying patterns.


    We can build models of systems and see how they behave. Of course, the real world
    is always going to be more complex than any model we can build. A model of a system
    has inputs, stocks, variables, and feedback loops. An example of a store/inventory
    system is shown in Figure 1.1.


    We’ll use this example to explain the concepts of stocks, variables, and feedback
    loops. Reading from the top left in an anticlockwise direction, the system has
    an inflow of deliveries and an outflow of sales. The products in the store are
    in stock, called the inventory.


    ![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_36_0.png)


    Figure 1.1: An example system model showing store inventory management


    The delivery delay and customer demand are inputs regulating the flow of products.
    B signifies a balancing feedback loop. Customer demand causes the products to
    flow out of the system as sales, reducing inventory. The manager doesn’t want
    to keep checking the stock every day, so there’s a perception delay variable.
    After the delay, the manager compares perceived sales with the desired inventory.
    The manager doesn’t want to overreact to a change in customer demand, so they
    have a response delay variable limiting the size of an order to the supplier,
    who then delivers more product after a delay.


    This model only uses balancing feedback loops. The other kind of feedback loop
    is a reinforcing loop, which typically increases the size of stocks. For example,
    in a bank savings account, the'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'more money you have in the account, the more you earn in interest, which, in
    turn, increases the amount of money in the account.


    # A system with no delays is simple


    Let’s say the manager wants to keep 10 days of demand in inventory, and the demand
    is 200 items per day. This means the desired inventory is 2,000. On day 10, demand
    increases by 10%. Customers are now buying 220 items per day. The manager increases
    the size of the order, and more inventory is delivered on the same day. The desired
    inventory goes up to 2,200.


    ![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_37_0.png)


    *Figure 1.2: Behavior over time in a simple system with no delays*


    When there are no delays in the system, adjustments can be made instantly to changes
    in demand, making the system’s behavior straightforward and predictable.'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# A system with delays can behave in unexpected ways


    In complex systems, there are often delays between taking an action and seeing
    its effect, as described by Donella Meadows:


    > Because of feedback delays within complex systems, by the time a problem becomes
    apparent it may be unnecessarily difficult to solve. [1]


    For example, if inventory orders take several days to arrive, a sudden increase
    in demand might not be addressed quickly enough. This lag can cause overcorrections
    or shortages, creating instability. Understanding and managing these delays is
    crucial to maintaining smooth system performance.


    Now, let’s add some delays:


    +   - **Perception delay:** Before changing the order, the manager averages sales
    over a 5-day period

    +   - **Response delay:** The manager makes up 40% of the inventory shortfall
    when changing the order

    +   - **Delivery delay:** The factory takes 5 days to deliver the order


    ![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_38_0.png)


    *Figure 1.3: Inventory levels oscillate after demand rises due to delayed order
    adjustments*'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'As you can see in Figure 1.3, after day 10, when demand increases by 10% first,
    we see the stock levels start to drop. Then, after 5 days, the manager adjusts
    the order to make up 40% of the shortfall. The increased deliveries start to arrive,
    and on day 20, the stock equals the desired inventory. However, the increased
    deliveries continue, and by day 25, the store is overstocked. The manager reduces
    the order. The cycle continues, and the inventory oscillates between under- and
    over-stocked.


    # Trying to fix oscillations


    Here are three options you could try to fix this unwanted behavior:


    +   - Faster perception (reduce delay)

    +   - Faster response (increase order)

    +   - Slower response (decrease order)


    Close your eyes for a minute and decide which of these options you''d try first.
    We''ll examine the outcome of each option.


    First, we''ll reduce the perception delay from five days to two, as shown in Figure
    1.4.


    ![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_39_0.png)


    Figure 1.4: Reducing perception delay from five days to two days for faster response


    So, the manager reacts sooner, and the desired inventory goes up to 2,200 faster,
    but if anything, the oscillations start a little sooner, and they are slightly
    higher. The peak inventory just before the 60-day mark is now 2,994 items. It
    was 2,981 before changing the perception delay.'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'Next, we''ll try responding faster by changing the order to make up 60% of
    the shortfall, which was originally 40%. As you can see in Figure 1.5, the behavior
    gets even worse. The oscillations get much bigger, and the peak inventory goes
    even higher to 3,800 and falls to 1,400 some days.


    ![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_40_0.png)


    Figure 1.5: Reducing response delay – inventory swings grow larger


    Finally, we’ll try a slower response, reducing the response delay (the change
    in the order) to 25% instead of 60%, as we saw in the previous example.'
  merge: -1
  img_proc: true
- pgno: 41
  md: '![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_41_0.png)


    *Figure 1.6: Slower order changes reduce inventory oscillations*


    As shown in Figure 1.6, the behavior of the system is much better now. The inventory
    still oscillates, but it starts to settle close to the desired inventory around
    20 days after the change in demand.


    # Systems surprise us


    Systems can react in counterintuitive ways. In this relatively simple system,
    the store manager was reacting too quickly. Our natural inclination was toward
    faster perceptions and responses, but they made the system behave even worse.
    It was only when we tried something that seemed counterintuitive (slower responses)
    that the behavior of the system improved. This is also true of software systems,
    and we’ll see some practical examples later in this chapter. Changing some variables
    can have a big impact on the overall behavior, but others might have little to
    no effect. In these examples, we saw that a perception delay had little effect,
    but a response delay did.


    Real systems are always more complex than models and can have hidden variables
    or feedback loops. This system was relatively simple. A more complex system can
    have multiple stocks and more feedback loops. Systems are inherently oscillatory.
    System behavior is revealed as a series of events over time. Our human minds are
    not good at understanding non-linear growth and interactions between elements.
    We make assumptions about what the current bottleneck is and try to improve elements
    of the system that will not increase performance unless the limiting factor is
    improved.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# A typical software system


    Now, let’s apply what we’ve discussed about systems in general to a software system.
    We’ll begin by looking at a typical software system at a high level, as shown
    in Figure 1.7, and describe some of the potential bottlenecks.


    ![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_42_0.png)


    *Figure 1.7: High-level view of a software system showing a client-to-database
    request flow*


    Looking from left to right, we see two clients. These could be a desktop computer
    and a mobile device. These clients connect via the internet to an application
    programming interface (API) gateway, which sends requests and receives notifications.
    The API gateway connects to multiple application servers. These modify, route,
    and forward client requests to one or more software components running on those
    application servers. Each application server can have multiple software components
    using one or more frameworks (FW) such as Spring or Rails. These typically contain
    data service abstractions or object modeling components that use a database-specific
    driver (sometimes called a client library) that talks to the data services.


    Any of these components (the computers they run on or the networks connecting
    them) could be a bottleneck to the performance or scalability of the overall application.


    Here are two examples of performance bottlenecks in a software system:


    +   - **An API gateway bottleneck:** As the system gains popularity and more users
    connect to the API gateway, the API reaches a point where it is handling so many
    connections and requests that the CPU is fully utilized. This could be identified
    by looking at the idle CPU available on the computer running the API gateway.
    This could be solved by vertically scaling the computer or the cloud instance
    running the API gateway.'
  merge: -1
  img_proc: true
- pgno: 43
  md: '+   - **A framework bottleneck:** The application software may send seemingly
    simple requests to the framework, but under the hood these requests can trigger
    expensive database operations, such as a full collection or table scan on the
    database. This inefficient querying uses CPU and storage bandwidth on the database
    while also sending more data than necessary back to the application servers. As
    a result, unnecessary network bandwidth is used, and additional CPU resources
    are required on the application server to process the data.


    This latter bottleneck could be identified in a number of ways:


    +   - Profiling the application could find that the requests to the framework
    are taking a surprising amount of time.

    +   - During development, an end-to-end trace can be used to track a user request
    from a client through the application code, framework, and data services abstraction
    to see what kind of query is run on the data services and the subsequent **input/output
    (I/O)** operations.

    +   - This could identify read or write amplifications, where a small client request
    results in a disproportionately large database operation. For example, a client
    query for one data point of 32 bytes could make its way through the full system
    and result in a table scan on the database that pulls 32 GB of data through I/O
    and caches for no reason. This could be remedied by configuring the framework
    to be more efficient.


    We will provide specific examples of these kinds of bottlenecks and solutions
    throughout the book, culminating in a number of specific case studies in *Chapter
    15, Debugging Performance Issues.*


    Identifying potential bottlenecks is only the first step in optimizing a software
    system. To remove these bottlenecks, we need a structured approach applying performance
    engineering principles.


    Performance engineering principles span a range from algorithmic theory to Little’s
    law. By applying these principles, developers can minimize bottlenecks, improve
    scalability, and maximize resource efficiency. In the next subsections, we’ll
    explore some of these principles and see how they guide the design of high-performing
    systems, which you can keep in mind as you read this book.


    # Algorithmic efficiency (complexity)


    The choice of algorithm and data structure is typically where most computer science
    courses first introduce performance. An algorithm that scales linearly or logarithmically
    with input size will perform better than one that scales exponentially. No amount
    of micro-optimization will compensate for an inherently slow algorithm. In modern
    systems, this might mean using built-in libraries (often optimized in C or assembly)
    or leveraging parallel algorithms.'
  merge: -1
  img_proc: true
- pgno: 44
  md: "# Avoid premature optimization\n\nAs the saying goes, “Make it work, then make\
    \ it fast.” In other words, focus on building a correct and reliable system before\
    \ worrying about performance.\n\nThis idea is echoed by computer scientist Donald\
    \ Knuth, who famously warned that “premature optimization is the root of all evil.”\
    \ Developers often guess wrong about what’s slowing their systems down; profiling\
    \ tools regularly uncover performance bottlenecks in unexpected places. Modern\
    \ processors can also execute compiled code in ways that defy human intuition.\n\
    \nBy resisting the urge to optimize too early, you keep your code clean and maintainable.\
    \ You also ensure that your performance efforts are grounded in real data, not\
    \ assumptions.\n\n# Amdahl’s law (limit of parallel speedup)\n\nAmdahl’s law explains\
    \ why certain workloads don’t speed up proportionally with more cores. If a fraction\
    \ S of a program must run sequentially, for example, to protect a shared data\
    \ structure, then even with infinite processors, the speedup is limited to 1/S.\
    \ For example, if 10% of a task is serial, the best overall speedup you can get\
    \ approaches 10x (assuming the other 90% runs on many processors). When using\
    \ multicore processors and distributed computing, one must identify and reduce\
    \ the serial portions of the workload.\n\n# Locality and caching\n\nPrograms typically\
    \ access a relatively small portion of data or code repeatedly in a short period\
    \ of time. Caches can be used to speed up access to frequently used data. Systems\
    \ use caches at various levels: in-memory caches for database results, and CPU\
    \ caches to avoid recomputation or slow accesses by storing results of expensive\
    \ operations and reusing them. However, caching introduces complexity, such as\
    \ stale data and memory overhead. This is why it’s mentioned in the following\
    \ joke:\n\n> There are 2 hard problems in computer science: cache invalidation,\
    \ naming things, and off-by-1 errors.\n> \n> Leon Bambrick"
  merge: -1
  img_proc: true
- pgno: 45
  md: "Ironically, there’s now a counterpoint to that joke:\n\n> There’s 2 hard problems\
    \ in computer science: we only have one joke and it’s not funny.\n> \n> *Phillip\
    \ Scott Bowden*\n\nThe use of caching (e.g., in I/O operations) is crucial to\
    \ get good performance out of slow devices, but it’s also applicable at other\
    \ layers of distributed systems.\n\n# Little’s law (throughput versus latency)\n\
    \nPerformance is multi-dimensional. Sometimes the goal is to handle a high volume\
    \ of operations (throughput), while other times, the priority is to minimize the\
    \ delay between the start and completion of a single operation (latency). In many\
    \ cases, both are equally important.\n\nYou can increase concurrency to improve\
    \ throughput (e.g., using multithreading, asynchronous I/O, or non-blocking event\
    \ loops). However, these techniques might introduce queuing delays that affect\
    \ latency. Having too many concurrent operations can push a system into an inefficient\
    \ state. It’s important to first identify your performance target and then optimize\
    \ accordingly. For high throughput, maximize resource utilization (CPU, network,\
    \ and disk) with concurrency. For low latency, minimize waiting and depth of processing.\
    \ Balancing these is an art, guided by analysis and benchmarks.\n\nIn summary,\
    \ performance engineering should be data-driven, using profilers and monitors\
    \ to identify bottlenecks. It should be informed by both classic insights (such\
    \ as algorithmic complexity and Amdahl’s law) and modern techniques (such as parallel\
    \ computing, vectorization, and distributed load balancing). Focus optimization\
    \ efforts where they yield the most benefit, and always verify the impact with\
    \ measurements."
  merge: -1
