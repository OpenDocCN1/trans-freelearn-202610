- pgno: 84
  md: "# Key prefixing pattern\n\nThe key prefixing pattern involves adding meaningful\
    \ prefixes or identifiers to a field (usually the _id field) to group related\
    \ data, enable efficient querying, and reduce the need for secondary indexes.\
    \ The key prefixing pattern is best for workloads with many small, related documents\
    \ that need to be efficiently retrieved together without using additional indexes.\n\
    \nThe following example from the Socialite app includes documents that contain\
    \ data about user notifications:\n\n```\n```json\n{\n  _id: \"user_5f4e5b6d3c1e2a1b3c4d5e6f\"\
    ,  // Main user document\n  username: \"jane_smith\",\n  email: \"jane.smith@example.com\"\
    \n  // ... other user fields\n}\n\n{\n  _id: \"user_5f4e5b6d3c1e2a1b3c4d5e6f_notif_001\"\
    ,  // Notification with prefix\n  type: \"like\",\n  message: \"Alex liked your\
    \ post\",\n  timestamp: ISODate(\"2023-04-10T10:30:00Z\"),\n  read: false\n}\n\
    \n{\n  _id: \"user_5f4e5b6d3c1e2a1b3c4d5e6f_notif_002\",  // Another notification\n\
    \  type: \"comment\",\n  message: \"Sarah commented on your post\",\n  timestamp:\
    \ ISODate(\"2023-04-10T11:15:00Z\"),\n  read: false\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 85
  md: "Let’s go over this example to understand how the key prefixing pattern has\
    \ been applied. Here, the pattern is used to structure the _id field to associate\
    \ notifications with a specific user by prefixing _id with the user identifier:\n\
    \n+   - **Main document prefix:** The primary user document has an _id value (user_5f4e5b6d3c1e2a1b3c4d5e6f)\
    \ where the prefix user_ clearly identifies it as a user record. This structured\
    \ _id value helps organize documents logically and simplifies queries targeting\
    \ specific types of records.\n+   - **Related notifications:** Notifications related\
    \ to the user use the same prefix (user_5f4e5b6d3c1e2a1b3c4d5e6f) followed by\
    \ an additional suffix (_notif_001, _notif_002). This ensures all notifications\
    \ are directly associated with the user and can be queried efficiently using _id.\n\
    \nWith the default index on the _id field, you can efficiently retrieve all notifications\
    \ for a user using a range query. Additionally, if the prefix part after user_\
    \ is an object ID, notifications are naturally sorted by time as well.\n\n# Patterns\
    \ for query and analytics optimization\n\nIn this section, we’ll look at schema\
    \ design patterns that are beneficial for query and analytics optimization. These\
    \ include the computed pattern, which precomputes and stores derived or aggregated\
    \ data to reduce the cost of on-the-fly calculations during query execution; the\
    \ schema versioning pattern, which tracks changes in document structures over\
    \ time to ensure compatibility across versions and facilitate analytics on evolving\
    \ datasets; and the polymorphic pattern, which allows storing different types\
    \ of related data in a unified collection by leveraging flexible schemas, enabling\
    \ efficient querying and analytics without the need for multiple collections.\n\
    \n# Computed pattern\n\nWith the computed pattern, you precalculate and store\
    \ aggregation results to avoid expensive computation during read operations. This\
    \ includes incrementing counters when operations happen, so that the totals always\
    \ reflect current metrics.\n\nThe following is a sample document from the Socialite\
    \ database that contains post analytics:\n\n```\n{\n  _id: ObjectId(\"5f4e5b6d3c1e2a1b3c4d6f7k\"\
    ),\n  content: \"Check out my new photography portfolio!\",\n  postDate: ISOD\
    \ ate(\"2023-04-10T14:30:00Z\"),\n}\n```"
  merge: -1
  img_proc: true
- pgno: 86
  md: "```\n// Pre-computed metrics\nengagementMetrics: {\n  totalViews: 1432,\n \
    \ uniqueViewers: 1053,\n  likeCount: 287,\n  commentCount: 43,\n  shareCount:\
    \ 18,\n  avgTimeViewed: 12.5,  // in seconds\n  conversionRate: 0.086  // % of\
    \ viewers who took action\n},\n\n// Demographics of engagers (pre-computed)\n\
    audienceBreakdown: {\n  genderDistribution: {\n    male: 0.48,\n    female: 0.51,\n\
    \    other: 0.01\n  },\n  ageGroups: {\n    \"18-24\": 0.32,\n    \"25-34\": 0.45,\n\
    \    \"35-44\": 0.15,\n    \"45+\": 0.08\n  }\n}\n}\n```\n\nLet’s go over this\
    \ example to understand how the computed pattern has been applied. Here, the pattern\
    \ is used to store precomputed engagement metrics and audience demographic breakdowns\
    \ alongside the main post content:\n\n+   - **Engagement metrics**: The document\
    \ includes a precomputed engagementMetrics field containing aggregated data such\
    \ as totalViews, uniqueViewers, likeCount, commentCount, shareCount, avgTimeViewed,\
    \ and conversionRate. Instead of calculating these metrics dynamically for every\
    \ query, they are stored directly in the document for instant retrieval.\n+  \
    \ - **Audience demographics**: The audienceBreakdown field provides precomputed\
    \ data about viewers’ gender distribution and age group percentages. This eliminates\
    \ the need to perform analytics calculations or run expensive aggregation pipelines\
    \ at query time."
