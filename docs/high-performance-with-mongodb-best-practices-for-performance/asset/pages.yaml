- pgno: 366
  md: '# Implementing the solution


    The customer, faced with a non-critical operation that was consuming excessive
    resources and threatening system stability, took decisive action. To regain control
    and prevent further degradation, they initiated a termination sequence for the
    problematic process. To do this, the following command was used:


    ```

    db.killOp(201)

    ```


    In this case, the team killed the problematic ad hoc operation, and the issue
    was resolved. During follow-up analysis, the MongoDB support team discovered the
    complex query issued by the administrator had caused massive cache eviction. This
    had occurred because the scan loaded massive amounts of rarely used documents
    into memory, pushing out frequently accessed data from the limited cache space.
    This explained why performance remained affected even after terminating the query;
    the damage to the cache had already been done. After approximately 2-3 minutes,
    once the frequently accessed data (working set) had been reloaded into MongoDB’s
    cache from disk storage, database performance metrics returned to their baseline
    levels. While this recovery period might appear as additional performance degradation
    following the intervention, it’s important to note that the system was already
    blocked by the problematic query, so this brief recovery phase was an unavoidable
    consequence of addressing the root issue.


    # Results and learnings


    This case highlights several important principles. First, long-running collection
    scans can dramatically impact performance for all users. Additionally, cached
    data eviction is a common side effect of large collection scans.


    Ad hoc queries by administrators on production databases represent a significant
    risk that requires careful management and governance. While these impromptu investigations
    can provide valuable insights, they can also severely impact system performance
    and availability when executed without proper consideration of their resource
    requirements. To avoid this, organizations must implement strict policies regarding
    who can run ad hoc queries on production systems, when they can be executed, and
    what limitations should be placed on their scope and complexity. Ideally, such
    exploratory work should be conducted on secondaries or during maintenance windows,
    with query timeouts and resource limits configured to prevent runaway processes.
    Without these safeguards, even well-intentioned database administrators can inadvertently
    trigger cascading performance issues that affect thousands of application users.'
