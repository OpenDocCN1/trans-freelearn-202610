    They moved the smallest two collections first and checked the metrics to verify
    the changes were working. For each collection move, they followed this process:


    +   1. Monitor shard-0 and the destination shard''s hardware metrics and operation
    execution times.

    +   2. Verify the destination shard has free disk space, IOPs, network resources,
    and CPU headroom.

    +   3. Connect to mongos and move a collection:

    +   4. If something goes wrong during the move, use the abortMoveCollection admin
