    # Managing performance and durability


    Building high-performance applications with change streams requires careful consideration
    of both resource usage and data durability. Let''s explore strategies to optimize
    both.


    # Resource optimization strategies


    Change streams consume resources across your entire stack. In some cases, performing
    additional processing on the server can reduce the workload on your application.
    In other situations, extra processing on the client side can enhance overall system
    performance. Table 8.2 summarizes these trade-offs:


    | Resource area | Impact factors | Optimization approaches |

    |---|---|---|

    | Server-side | - CPU usage for oplog processing

    - Memory usage for cursor state

    - Network bandwidth consumption | - Filter aggressively.

    - Use the smallest appropriate scope.

    - Multiplex several change streams into one and let the application filter to
    reduce the number of cursors consuming the oplog.

    - Size the oplog to avoid streams falling too far behind the updates. Ultimately,
    the oplog is the buffer if the application change stream processing falls behind.
    |

    | Application-side | - Connection pool usage

    - Event processing capacity

    - Memory used for buffering

    - Network bandwidth usage | - Dedicate connections

    - Use batch processing |


    *Table 8.2: Trade-offs between server and application processing*'
