- pgno: 65
  md: '# 2


    # Schema Design for Performance


    MongoDB was created to bridge the gap between fast, horizontally scalable key-value
    stores and traditional relational databases. To achieve the best performance,
    you need to understand MongoDB’s strengths and design your application to take
    advantage of them. Whether you’re handling large volumes of reads, writes, or
    both, the goal is to balance readability, maintainability, and speed. MongoDB’s
    flexible schema design offers unique opportunities, but it requires thoughtful
    planning to avoid common pitfalls.


    In this chapter, we’ll cover fundamental principles of designing MongoDB schemas
    for high performance. We’ll start by covering the key principles of schema design
    in MongoDB and clearing up some common misunderstandings. Then, we’ll look at
    how MongoDB’s document model makes it easier to build flexible and efficient schemas.
    After that, we’ll review common mistakes and anti-patterns that can hurt performance
    or make your data harder to manage. Finally, we’ll share practical schema design
    patterns to help you optimize reads and writes. To bring it all together, we’ll
    apply these ideas to a sample app so you can see how they work in practice.


    This chapter will cover the following topics:


    +   - Core principles of schema design

    +   - Strengths of MongoDB’s schema model

    +   - Using schema validation for data integrity

    +   - Schema design patterns organized by benefits'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# Understanding the core principles of schema design


    Schema design in MongoDB is driven by how your application accesses and modifies
    data; there’s no single *correct* structure that applies to every use case. This
    is a shift from the relational model, where normalization is the default starting
    point and denormalization is a performance tuning step. In MongoDB, you begin
    by understanding your workload and then design your schema to match.


    In this section, we’ll cover key principles such as data collocation, read and
    write trade-offs, document sizing, and common pitfalls. These guidelines will
    help you build data models that are both efficient and aligned with your application’s
    behavior.


    # There is no single right way


    Here’s the most important thing about schema design that you may not realize:
    *there is no single correct way to structure your documents.* Yes, you read that
    right! Each use case demands a unique balance between read and write efficiency.
    The key is to think about your application’s workload first; *data that’s frequently
    retrieved together should be stored together to avoid costly lookups.*


    This is fundamentally different from how you may have learned to manage data in
    relational databases. In that model, data normalization is the expected approach
    from the start. Only when performance cannot keep up with a fully normalized data
    model will you begin selectively denormalizing some of the data based on how it’s
    used. With MongoDB, we start with the question, *How will this data be used?*
    and create a data model that best fits our access patterns.


    Think of urban planning. Some towns isolate residential, commercial, and industrial
    zones into distinct areas. But in a well-designed city, areas are not organized
    strictly by type, but instead, as neighborhoods where daily necessities are within
    easy reach for their inhabitants. Similarly, MongoDB gives you the flexibility
    to organize your data based on how your application actually uses it, not by arbitrary
    categorization.


    # Data collocation


    Once you’ve identified the entities your application will work with, the main
    decision is whether to embed related data or store it separately and reference
    it. You’ll repeatedly ask yourself whether an object is an independent entity
    that should be stored in its own collection or whether it is an attribute of another
    object and should be stored as part of that object. Similarly, for each attribute
    of an object, you’ll need to consider whether to embed it directly or store it
    separately.'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'This is where the principle of *data that''s used together should be stored
    together* comes in. It might sound simple at first glance, but it''s powerful
    when you understand its implications. Here''s how it plays out in practice:


    +   - **Embed data that is always retrieved together**: This reduces the number
    of round trips to the database and keeps reads efficient. For example, embedding
    order line items within an order document makes sense if they are usually accessed
    together.

    +   - **Separate infrequently accessed data**: Keep large but rarely used fields
    out of the main document. This helps prevent overhead if most queries don''t need
    them. Storing large attributes that are only occasionally needed in a document
    increases disk I/O and wastes RAM. For example, storing a full-size image of a
    user in the primary user document isn''t efficient if only a small thumbnail is
    displayed on most user pages.


    The worst mistake would probably be to treat MongoDB like a relational database,
    normalizing data across multiple collections and then joining it back together
    for every query. On the other hand, over embedding can also be suboptimal if it
    bloats your documents to an extreme extent. You will end up needing significantly
    more cache, **input/output operations per second (IOPS)**, and network bandwidth
    than if you structured the data more in line with your application needs.


    # Read and write trade-offs


    When designing your schema, you may face conflicting requirements between optimizing
    for reads versus writes. This is not unique to MongoDB, but the document model
    gives you more options for resolving these conflicts. Here are a few common factors
    to consider when balancing read and write performance in your schema design:


    +   - **Indexing**: Indexes speed up reads but add overhead to writes and use
    other resources. Adding multiple indexes to a collection can dramatically improve
    query performance but will add cost to write operations. It is a classic trade-off,
    but one worth making if the indexes are correctly designed for your application.

    +   - **Strict service level agreements (SLAs)**: Prioritize operations with the
    strictest latency requirements. Sometimes you optimize for writes and other times
    for reads, rarely both equally. For instance, an order processing system may prioritize
    fast writes, while a reporting system may optimize for read efficiency.

    +   - **Reducing I/O**: Work to minimize the amount of data reads and writes.
    Every data block you access has a cost. If you can eliminate unnecessary reads
    or writes, all operations become cheaper and faster.'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'These considerations also influence whether to model data using large or small
    documents, which affects how efficiently your application can read, write, and
    update data.


    # Small versus large documents


    Understanding how MongoDB stores documents on disk is crucial for optimizing performance.
    MongoDB’s WiredTiger storage engine, which is covered in more detail in Chapter
    7, Storage Engines, uses a page-oriented architecture, where documents are stored
    on pages that are loaded into memory as needed.


    Here is why this matters:


    +   - **Minimum page size:** WiredTiger has a minimum uncompressed page size of
    32 KB. Documents smaller than this threshold (under 32 KB uncompressed) share
    a page with other documents, allowing multiple small documents to be retrieved
    in a single page read.

    +   - **Related document fragmentation:** If related data is split across multiple
    documents, your application ends up making multiple queries to retrieve the complete
    dataset. Additionally, these documents may reside on different pages, requiring
    more I/O operations to retrieve all related data.

    +   - **Write amplification:** When large documents are updated, even with small
    changes, the entire document must still need to be written to disk during checkpoints.
    The larger the document, the more likely it is to cause larger than necessary
    writes.


    Understanding this leads us to our next important principle: *high read velocity
    workloads benefit from embedded document patterns.* This is because related data
    is stored in one place, on one page. On the other hand, for high write velocity
    workloads, where you’re frequently updating small portions of data, multiple document
    patterns may be more efficient.


    # Common myths


    Let’s bust some common misunderstandings about MongoDB schema design:


    +   - **Denormalization:** Denormalizing data does not always mean *more storage*
    or *data duplication*. In some cases, embedding related data in one place lowers
    overall space usage and reduces the number of required indexes. For example, embedding
    line items within an order document eliminates the need for order ID indexes in
    both the orders and line items collections, and can help reduce the total data
    size. Embedding frequently accessed domain data that rarely or never changes will
    also reduce additional lookups and improve overall performance.'
  merge: -1
  img_proc: true
- pgno: 69
  md: '+   - **Dynamic schema:** MongoDB offers flexibility, but you don’t have to
    use it. You can enforce a strict schema through your application layer or through
    MongoDB’s own schema validation capabilities, or even both. Flexible schema is
    an option, not a requirement.

    +   - **Intentional design:** If you didn’t consciously design your data structure,
    it’s not really a schema. Someone passing you JSON that you store directly in
    the database is not schema design; it’s just storing payload. True schema design
    reflects the specific needs and requirements of your application.

    +   - **Indexing is not automatic:** It is not a common myth, but it’s out there.
    Each collection automatically creates a unique index on the required _id field,
    which is the primary key for each record, and if you don’t supply it with the
    document when inserting it, it will be generated automatically. But an important
    part of schema design is figuring out which secondary attributes you’ll be querying
    by and making sure you create all indexes that are necessary to efficiently support
    those queries. You’ll learn more about indexes in *Chapter 3, Indexes.*


    Remember when relational database practitioners would debate *whether every table
    needed a surrogate key or a natural key?* Now, we have more interesting discussions
    about *whether to embed or reference related data*, conversations that directly
    impact application performance!


    # Key strengths of the MongoDB schema design


    Compared to relational databases, MongoDB’s document model enables patterns that
    simplify data access, reduce query complexity, improve performance for read-heavy
    and write-heavy workloads, and adapt more readily to evolving application requirements.
    Instead of enforcing a rigid structure, MongoDB allows developers to model data
    in ways that reflect real-world use cases and access patterns. This flexibility
    is at the heart of MongoDB’s approach to schema design, enabling developers to
    build applications optimized for speed and scalability. In this section, we’ll
    cover the key strengths of MongoDB’s schema design, including handling one-to-many
    relationships, embedding weak entities, supporting dynamic attributes, leveraging
    caching and snapshots, optimizing for common use cases, and accommodating seamless
    schema evolution.


    # One-to-many relationships


    One-to-many relationships in MongoDB are treated as first-class citizens, with
    arrays, objects, and arrays of objects enjoying full querying, updating, and indexing
    capabilities. This capability is baked into the foundation of MongoDB’s document
    model, rather than added as an afterthought.'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'This makes MongoDB perfect for storing structured, repeating data such as comments
    in a blog post, tags for a product, or variations in merchandise. For example,
    in a blogging platform, a blog post document can contain its comments in an array,
    allowing the application to retrieve the post and its comments in a single query.
    By storing related data together, MongoDB eliminates the need for costly joins,
    reduces query complexity, and minimizes disk I/O operations, improving overall
    performance.


    # Embedding weak entities


    Weak entities (items that rely on a parent entity for context) are ideal candidates
    for embedding in MongoDB. For example, order line items in an e-commerce platform
    are inherently dependent on their parent order. Embedding these line items within
    the order document ensures all related data is stored together, without the need
    for separate lookups or joins. An order without its line items serves little value,
    and keeping them together allows developers to query and update order data efficiently.
    This approach improves performance by reducing I/O operations and query complexity,
    making data retrieval faster and simplifying application logic at the same time.


    # Dynamic attributes


    Relational databases often struggle with modeling entities where field names or
    the number of attributes are not known ahead of time. These challenges typically
    involve costly schema migrations to add new columns or require storing the attributes
    in cumbersome, inefficiency-prone formats. MongoDB, however, embraces dynamic
    data modeling natively. For instance, a product catalog can include variable attributes
    such as "color" for clothing items or "engine size" for vehicles, without requiring
    rigid definitions or structural changes. Documents can easily store attribute
    names as keys with corresponding values or use arrays of key-value pairs, both
    of which support efficient indexing and querying. This eliminates operational
    overhead and ensures faster queries, even as data evolves.


    # Caches and snapshots


    In traditional databases, data normalization discourages redundancy, but MongoDB
    allows selective duplication to optimize frequent access patterns. For example,
    storing a customer’s shipping address directly within each order document ensures
    quick retrieval of this information without querying a separate collection. Similarly,
    storing a handful of a user’s most recent actions, such as posts or reviews, within
    their parent document reduces repeated queries and speeds access to frequently
    requested data. This use of data duplication acts as an effective cache or point-in-time
    snapshot, reducing I/O overhead and ensuring faster queries for applications subject
    to high user traffic.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# Optimization for common use cases


    Some of the examples mentioned previously allow you to optimize your system for
    operations that happen thousands of times a minute, such as users looking at their
    orders or their friends’ posts, and allow you to worry less about operations that
    may happen once in a blue moon, if at all (how often does a user change their
    name, and does that operation really need to be instantaneous?). This optimization
    allows developers to focus on key workflows, such as retrieving user posts or
    order details, while deprioritizing rare operations, such as users changing their
    account information. MongoDB’s schema flexibility allows developers to focus on
    optimizing these frequent operations, reducing unnecessary processing overhead
    and ensuring smooth, fast performance for everyday transactions.


    # Schema evolution


    Have you ever tried to add a column to a large table in a relational database
    in production? With MongoDB’s dynamic schema, you can start using new fields immediately
    while either lazily updating old documents or not at all, depending on your requirements.
    Applications should gracefully handle new fields or shapes in documents. This
    can ensure backward compatibility and smooth transitions during schema updates.
    Good data access layers in MongoDB applications understand schemas can evolve
    over time without requiring a full data conversion.


    MongoDB’s schema design strengths provide flexibility and efficiency for modern
    applications, empowering developers to build tailored data models that maximize
    real-world performance. Whether handling one-to-many relationships, embedding
    weak entities, supporting dynamic attributes, leveraging caching and snapshots,
    optimizing for high-frequency operations, or accommodating schema evolution, MongoDB
    enables developers to create high-performance applications that adapt to changing
    needs. By simplifying queries, reducing latency, and streamlining data access
    patterns, MongoDB delivers the power and versatility required for scalable, modern
    workloads. Its document model is not just a convenience; it’s a cornerstone of
    performance optimization for real-world applications.


    # Schema validation


    While much of schema design focuses on how data is structured and accessed, one
    often overlooked but critical aspect is schema validation. Just because MongoDB
    is flexible doesn’t mean you should allow just any data structure to be stored.
    Schema validation is an important tool for maintaining data integrity and is almost
    completely free in terms of performance impact. The performance cost of validating
    documents as they’re inserted or updated is negligible compared to the total cost
    of the write, and it offers several practical benefits:'
  merge: -1
  img_proc: true
- pgno: 72
  md: '+   - **Catch errors early:** Validation prevents incorrect or malformed data
    from entering your database

    +   - **Enforce business rules:** You can define requirements such as minimum
    values or valid patterns directly in your data model

    +   - **Document your schema:** Validation rules serve as living documentation
    for your data model

    +   - **Smooth evolution:** You can easily adapt validation rules as your schema
    evolves


    While MongoDB offers great flexibility, schema validation ensures that flexibility
    doesn’t come at the cost of data integrity. By defining clear rules for your data
    model, you not only prevent errors and enforce business logic but also lay the
    groundwork for maintainable, evolving schemas. Let’s now look at common schema
    design mistakes, many of which can be avoided with thoughtful validation and a
    solid understanding of your data’s structure and usage patterns.


    # Common schema design mistakes


    MongoDB’s flexible document model offers powerful advantages when used thoughtfully.
    The same features that enable high performance and developer agility can lead
    to inefficiencies or bottlenecks if applied incorrectly. Common schema design
    mistakes can undermine performance, increase complexity, or negate the benefits
    of MongoDB’s model. Understanding these pitfalls will help you make more informed
    design choices and avoid costly rewrites down the line.


    # Overnormalizing


    This often happens when developers with a relational database background apply
    the same normalization principles to MongoDB. Here are some signs that you might
    be overnormalizing:


    +   - Your code makes frequent $lookup operations (MongoDB’s version of JOIN)

    +   - You have multiple collections representing entities that are usually accessed
    together

    +   - Read queries require piecing together data from multiple collections

    +   - You need multi-document transactions to update related fields stored in
    separate documents that could be stored together and updated atomically without
    transactions


    If you have the same number of collections in MongoDB as you would in a relational
    database, there’s a good chance that you’ve overnormalized your schema.'
  merge: -1
  img_proc: true
- pgno: 73
  md: '![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_73_0.png)


    # Cost of overnormalization


    I was reviewing an application where developers had created a separate collection
    for user preferences, another for user profiles, another for user settings...
    You get the idea. Every user page load required seven different queries! We consolidated
    the frequently accessed fields into a single user document, and page load times
    dropped from 600 ms to under 100 ms.


    # Overembedding


    This is the opposite problem: when developers get excited about MongoDB’s document
    model and try to put too much into a single document. Here are some signs you
    might be overembedding:


    +   - Document size keeps growing without bounds

    +   - You have very large documents

    +   - You’re storing data you rarely access within documents you frequently access

    +   - You have arrays that grow indefinitely (such as comments on popular posts)

    +   - Writing queries to return just specific parts of the document becomes complicated

    +   - Updates to deeply embedded fields require complex update operators

    +   - Creating effective indexes for deeply nested fields becomes challenging


    If your documents are approaching the 16 MB document size limit, that’s a strong
    indication that you must reconsider your schema design.


    # Other common anti-patterns


    In addition to overnormalizing and overembedding, there are several schema design
    patterns that often cause problems, or what we call anti-patterns. Recognizing
    and avoiding these pitfalls can help you build more efficient, maintainable, and
    scalable applications:


    +   - **Requiring transactions for everything:** Designing schemas that always
    need multi-document transactions negates the benefits of the document model. With
    proper embedding, most operations can be atomic without transactions.

    +   - **Poor indexing strategy:** Not knowing how to index properly for your query
    patterns leads to full collection scans and poor performance.

    +   - **Complex updates to embedded data:** If you can’t easily update deeply
    nested fields, your schema may be too complex or over-embedded.'
  merge: -1
  img_proc: true
- pgno: 74
  md: '+   - **Inefficient querying:** If you can’t easily query for just the relevant
    parts of your documents, reconsider your schema design.

    +   - **Treating MongoDB like a relational database:** Spreading related data
    across collections and joining it back with $lookup for every query negates the
    benefits of the document model. Excessive use of $lookup slows down queries and
    can be avoided with strategic embedding or denormalization.

    +   - **Unbounded array growth:** Embedding arrays that could grow indefinitely
    (such as comments on a viral post) can lead to document size issues and poor performance.

    +   - **Ignoring write patterns:** Optimizing only for reads when your application
    is write-heavy can lead to contention and performance bottlenecks.

    +   - **Over-indexing:** Creating indexes on every field just in case adds overhead
    to writes and doesn’t necessarily improve query performance.

    +   - **Storing large binary data in documents:** While MongoDB can store binary
    data, very large files (>16 MB) should either use GridFS or be stored externally,
    with references in your documents.


    Now that you’re familiar with common pitfalls in schema design, let’s focus on
    patterns that optimize the efficiency of reads, writes, querying, storage, and
    more.


    # Schema design patterns by benefit


    Now that we’ve covered the fundamentals, let’s explore a set of practical schema
    design patterns, each organized by the specific benefits they offer, such as improving
    read performance, write efficiency, or query flexibility. These patterns aren’t
    just theoretical; they’re grounded in real-world use cases and common challenges.


    Throughout this section, we’ll use examples from a social media application called
    **Socialite** to illustrate schema design patterns. Socialite consists of three
    main data stores:


    +   - **Content store:** Holds posts, media, and comments

    +   - **User graph:** Manages users and relationships between users (followers,
    following)

    +   - **Timeline cache:** Optimized for fast display of relevant content when
    a user logs in


    This separation allows Socialite to optimize each store for its specific access
    patterns. As we explore different schema design patterns, we’ll refer back to
    these components to demonstrate some practical applications. But next, let’s discuss
    some MongoDB-specific schema strengths.'
  merge: -1
  img_proc: true
- pgno: 75
  md: "# Patterns for read performance optimization\n\nIn this section, we’ll look\
    \ at schema design patterns that are beneficial for optimizing read performance.\
    \ These include the embedding pattern, which allows frequently accessed related\
    \ data to be stored together; the extended reference pattern, which balances embedding\
    \ and referencing for flexibility and performance; and the subset pattern, which\
    \ helps retrieve only the most relevant parts of a document without loading unnecessary\
    \ data.\n\n# Embedding pattern\n\nIn MongoDB, the embedding pattern involves including\
    \ related data within the same document instead of normalizing it and referencing\
    \ it from another collection. In the following example, this pattern is used in\
    \ a sample document from the users collection to store hierarchical and related\
    \ information:\n\n```\n{\n  _id: ObjectId(\"5f4e5b6d3c1e2a1b3c4d5e6f\"),\n  username:\
    \ \"jane_smith\",\n  name: \"Jane Smith\",\n  email: \"jane.smith@example.com\"\
    ,\n  profile: {\n    bio: \"Travel enthusiast and photographer\",\n    location:\
    \ \"San Francisco, CA\",\n    birthdate: ISODate(\"1988-04-12T00:00:00Z\"),\n\
    \    avatar: \"https://socialite.com/images/avatars/jane_smith.jpg\"\n  },\n \
    \ preferences: {\n    theme: \"dark\",\n    emailNotifications: true,\n    privacySettings:\
    \ {\n      profileVisibility: \"friends\",\n      activityStatus: \"everyone\"\
    \n    }\n  }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 76
  md: "Let’s go over this document to understand how the embedding pattern has been\
    \ applied here:\n\n+   - **Profile data as sub-document:** The profile field is\
    \ embedded as a sub-document, containing details such as bio, location, birthdate,\
    \ and avatar. Instead of storing this information in a separate collection and\
    \ referencing it, all user profile-related data resides together as one cohesive\
    \ unit. This keeps the data localized for quick access and retrieval.\n+   - **Preferences\
    \ data as sub-document:** Similarly, the preferences field includes the user-specific\
    \ settings, such as theme, emailNotifications, and nested privacySettings. By\
    \ embedding these preferences directly into the main document, it avoids the complexity\
    \ of separate collections and joins, making it easier to query and update user\
    \ settings in one operation.\n+   - **Nested privacy settings:** privacySettings,\
    \ which is a sub-document within preferences, demonstrates a deeper embedding\
    \ as it stores profileVisibility and activityStatus. This shows MongoDB’s flexibility\
    \ to create multi-level embeddings while retaining a logical structure.\n\nBy\
    \ using the embedding pattern for the profile and preferences sub-documents, the\
    \ design achieves data denormalization, reduces the need for costly joins, and\
    \ ensures data locality for optimized performance in reads and writes. This pattern\
    \ works well in scenarios where related data is frequently accessed together,\
    \ eliminating the need for multiple queries.\n\n# Extended reference pattern\n\
    \nThe extended reference pattern is used in MongoDB when we need to reference\
    \ another document in a related collection while also including some of its key\
    \ fields for convenience and performance when querying. This approach helps avoid\
    \ unnecessary lookups, especially when frequently accessed fields are readily\
    \ available.\n\nThe following example is a document from the posts collection\
    \ that contains a reference to the author and author-related data:\n\n```\n{\n\
    \  _id: ObjectId(\"5f4e5b6d3c1e2a1b3c4d6f4h\"),\n  content: \"Just visited the\
    \ Golden Gate Bridge! #travels #sanfrancisco\",\n  postDate: ISODate(\"2023-04-07T09:15:30Z\"\
    ),\n  media: [\"https://socialite.com/images/posts/golden_gate.jpg\"],\n  likes:\
    \ 42,\n  comments: 7,\n  author: {\n\n```"
