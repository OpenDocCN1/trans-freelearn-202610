- pgno: 97
  md: '# 3


    # Indexes


    What’s the most common database operation? It’s a query, or a read of a single
    document or several documents. We insert documents once, we update them sometimes,
    and we read them a lot. So, it’s important to ensure that those reads are as fast
    as they can possibly be.


    In this chapter, you’ll learn how to use indexes to improve the performance of
    your queries. You’ll start by understanding what indexes are and how MongoDB uses
    them. Then, you’ll explore query plans and how to interpret them to identify slow
    or inefficient operations. You’ll also practice creating and using indexes to
    speed up queries and see how MongoDB chooses which index to use. By the end of
    this chapter, you’ll be able to make informed decisions about when and how to
    use indexes to optimize performance.


    This chapter will cover the following topics:


    +   - Indexes and the types of indexes MongoDB supports

    +   - Cardinality, selectivity, and how they affect indexes

    +   - Best practices for optimizing compound indexes

    +   - Why partial indexes and covered index queries are important for performance


    # Introduction to indexes


    Let’s begin by looking at a basic example. Say you have a collection of orders,
    and you want to find the order with the ID value of 295:


    ```

    db.orders.find({ orderId: 295 })

    ```


    Without an index, MongoDB has to examine every document in the collection to check
    whether it has an orderId field, and then see whether its value is 295. For a
    collection with millions of documents, this can be painfully slow. It results
    in a time complexity of O(n), meaning the time it takes grows linearly with the
    number of documents.'
  merge: -1
  img_proc: true
- pgno: 98
  md: 'This is analogous to packing everything into boxes for a move. If you don’t
    take the time to organize, group, and label the boxes, then finding a specific
    item later means looking through everything. This isn’t very efficient, but it
    does save you time when packing. Database indexes work the same way. You have
    to decide whether it’s more important to spend time organizing and labeling items
    when packing (writing) or whether you can afford to take extra time when searching
    for an item (reading). In most cases, the smart move is to spend a bit of time
    up front so that finding things is easier later.


    # What is an index?


    In the database world, an index is a data structure that allows you to find records
    quickly without scanning the full collection. MongoDB uses a type of data structure
    called a **B-tree** for most of its indexes.


    A B-tree is a self-balancing tree data structure that maintains data in sorted
    order and allows various operations in logarithmic time, which is *O(log n)*.
    This means that as your data grows, the time to find a document increases much
    more slowly compared to a collection scan, which scales linearly with the size
    of your data, or *O(n)* time.


    Let’s take a peek under the hood. If we create an index on our orderId field,
    the simplified B-tree might look something like Figure 3.1:


    ![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_98_0.png)


    *Figure 3.1: Simplified view of B-tree on the orderId field*


    When searching for the order ID 295, MongoDB would follow these steps:


    +   1. Start at the root node, [200].

    +   2. Compare 295 to 200. Since 295 > 200, go right.

    +   3. Arrive at node [300].

    +   4. Compare 295 to 300. Since 295 < 300, go left.

    +   5. Arrive at node [250].

    +   6. Compare 295 to 250. Since 295 > 250, go right.

    +   7. Continue right until 295 is found or determine that it doesn’t exist.'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'This process takes O(log n) time, which is dramatically faster than the O(n)
    time required for a collection scan.


    The leaf nodes store the indexed values as well as pointers (recordID) to the
    documents containing those values. So, when we reach the leaf node containing
    a value of 295, we find the associated recordID, which is a pointer or reference
    to the actual document location. If multiple documents share the same value, the
    leaf node contains multiple record IDs. A B-tree usually has more than two branches
    from each node, and like a typical B+-tree, MongoDB B-trees only have data in
    leaf nodes; the inner nodes are for navigation only.


    Interestingly, the specific data structure used isn’t as important as the fact
    that the indexed values are stored in a **sorted** data structure that can be
    efficiently searched and traversed in order. If you think of an index as a sorted
    list or a binary search tree, you’re not far off. The important thing is that
    you can easily access data and find it in sorted order, and because it’s sorted,
    it’s relatively quick (O(log n) time) to jump to a particular value or range of
    values.


    # Resource efficiency and trade-offs


    Indexes aren’t just about speeding up queries; they’re also key to using your
    system’s resources efficiently. When you do a full collection scan, you’re forcing
    MongoDB to load the entire collection into memory (specifically, the WiredTiger
    cache). Not only does this take longer, but it also consumes a limited resource
    (cache memory) and can cause a lot of disk I/O due to constant churn.


    Alternatively, when you use an index, MongoDB only needs to load the relevant
    parts of the index (typically smaller than a collection) and then fetch the specific
    document(s) that match the query criteria. This saves precious memory and IOPS
    that can be used for other operations, making your entire database more efficient.


    Beyond faster lookups, indexes also support requirements to return results in
    a specific order. If the documents are read in order from the index, you can avoid
    expensive in-memory sort operations. In a nutshell, indexes speed up queries,
    minimize disk I/O, lower RAM requirements, and reduce overall CPU load.


    But indexes aren’t free; there’s a trade-off. Every index you add requires that
    it be atomically updated whenever an indexed value is changed, a new document
    is written, or an existing document is deleted. This slows down write operations.
    Maintaining indexes in memory uses more RAM, and writing to both indexes and documents
    increases disk usage.'
  merge: -1
  img_proc: true
- pgno: 100
  md: 'The performance impact on write latency for each index can range from 5–70%,
    depending on the number of fields, the overall size and type of index, and on
    your workload based on tests performed by the MongoDB performance team. There
    isn''t a formula, and the only reliable way to know how much your write latency
    is impacted is to benchmark your actual data and workload. That''s why you should
    be strategic about which indexes you create, avoid maintaining redundant indexes,
    and don''t just index everything.


    # Resource usage


    We mentioned indexes requiring disk space and RAM, but how much RAM do they use?
    You can see the size of your index using $collStats, but the size of the index
    doesn''t necessarily mean that all of it must fit in RAM. Not all indexes are
    created equal when it comes to resource usage. There is a myth that all your indexes
    must fit in RAM to achieve the best performance, but that would only be true if
    you were always accessing the full index. This may not be necessary in a well-designed
    application.


    Imagine your application processes orders with sequentially increasing IDs. New
    orders always have higher IDs than existing ones. In your B-tree index, all new
    writes occur on the right side of the tree, as shown in Figure 3.2.


    ![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_100_0.png)


    *Figure 3.2: B-tree with all recent activity on the right side*


    New orders are always inserted to the right side of the index (highest values),
    and the majority of updates happen to recent orders, not to mention the fact that
    older orders are seldom read as well. This creates what we call a right-balanced
    index. The part of the index with older orders is seldom accessed and, therefore,
    won''t be loaded into RAM and can stay “cold” on disk. Only the accessed part
    of the index (the active part containing recent data) needs to be in memory.


    Fields that can create a right-balanced index include anything that''s naturally
    increasing, for instance:


    +   - Auto-incrementing IDs such as order IDs'
  merge: -1
  img_proc: true
- pgno: 101
  md: "+   - Timestamps and/or dates\n+   - MongoDB’s automatically generated object\
    \ IDs (because they include a timestamp component as the first four bytes)\n\n\
    In contrast, when you index a random value, access patterns will span the entire\
    \ B-tree, eventually requiring the entire index to be loaded into memory, making\
    \ it much less efficient. Types of random values that can force the entire index\
    \ to stay in RAM include the following:\n\n+   - UUID\n+   - Most string values\
    \ (names, usernames, etc.)\n+   - Any hashed value\n\nSo, while index size matters,\
    \ how you access that index matters even more. Designing your data access patterns\
    \ thoughtfully can significantly reduce memory usage and boost performance.\n\n\
    # Common misconceptions about indexes in MongoDB\n\nThere are a few common myths\
    \ about MongoDB (and NoSQL in general). One is that MongoDB is so fast that it\
    \ doesn’t need indexes. This might only hold true if your dataset is so tiny that\
    \ everything fits into RAM and every query is fast, even though it’s doing a full\
    \ collection scan. This would never be the case for a real production system.\
    \ Another myth is that every field is automatically indexed. In MongoDB, only\
    \ the primary key (the _id field) is automatically indexed. To achieve acceptable\
    \ performance in production environments, you need to analyze your query patterns\
    \ and create the right secondary indexes accordingly.\n\n# Types of indexes in\
    \ MongoDB\n\nMongoDB offers multiple types of indexes to optimize different query\
    \ patterns. The majority of them use B-trees, but not all of them. This chapter\
    \ will focus on the ones that do use B-trees as their underlying structure.\n\n\
    ![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_101_0.png)\n\n> Field versus attribute\
    \ in index types\n> \n> The type of index can refer to either what fields you\
    \ are indexing or what attributes you assign to the index. The former specifies\
    \ the fields that will be stored in the B-tree; the latter is more about attributes\
    \ of the index as a whole.\n\nLet’s take a look at some of the more common index\
    \ types."
  merge: -1
  img_proc: true
- pgno: 102
  md: '# Single-field indexes


    A single-field index in MongoDB is an index created on a single field of a collection.
    This is how you create a basic index on a single field:


    ```

    db.collection.createIndex({ fieldName: 1 })

    ```


    In the What is an index? section, we already saw an example using {orderId:1},
    which speeds up queries for specific order IDs, as well as sorts or range queries
    by order ID.


    A single-field index that exists in every regular collection is the _id index,
    which enforces uniqueness, though it doesn’t explicitly display the unique attribute
    when you run a command to list the indexes:


    ```

    // Command to show all indexes on collection

    db.collection.getIndexes()

    // output showing _id index only

    [ { "v" : 2, "key" : { "_id" : 1 }, "name" : "_id_" } ]

    ```


    This is how you can see the indexes that exist for a particular collection. Most
    indexes you create in real life will not be single-field indexes; however, each
    regular collection will have at least one index by default: a unique index on
    the _id field, which is the primary key.


    # Compound indexes


    Compound indexes are created on multiple fields. Here is an example that creates
    an index on three fields:


    ```

    db.collection.createIndex({ status: 1, country: 1, zipString: 1 })

    ```


    Compound indexes store multiple field values from each document, so each entry
    has multiple values concatenated together. The B-tree stores the data sorted by
    the combined values. Let’s look at an example indexing by status, country, and
    zip:


    | Values for status, country, and zip in your collection | The order in which
    these values are stored in the index |

    |---|---|

    | "processing", "US", "10007" | "done", "FR", "" |

    | "done", "US", "95401" | "done", "US", "14850" |

    | "done", "FR", "" | "done", "US", "90210" |

    | "done", "US", "90210" | "done", "US", "95401" |

    | "done", "US", "14850" | "processing", "US", "10007" |


    Table 3.1: How index ordering affects document retrieval'
  merge: -1
  img_proc: true
- pgno: 103
  md: 'First, the records are sorted by status, then by country, and finally, by zip.
    You can probably see that the order of fields when you create a compound index
    is very important. It allows you to use the compound index for querying on just
    the first field or any prefix fields of it. More on that shortly.


    # Multikey indexes


    A multikey index isn’t technically a separate type of index that you create explicitly;
    you still create an index on one or more fields. But if any one of those fields
    contains an array, MongoDB creates an index entry for each element in the array
    and tags the index as being a multikey index. Here’s a simple example:


    ```

    // If documents have: { tags: ["electronics", "sale", "new"] }

    db.collection.createIndex({ tags: 1 })

    // Creates index entries for "electronics", "sale", and "new"

    // all of which point to the same recordID

    ```


    Single-field, compound, and other indexes can all be tagged as multikey if any
    indexed field contains an array. We’ll revisit the implications of this throughout
    the rest of this chapter and again in Chapter 12, Advanced Query and Indexing
    Concepts.


    # Sparse indexes


    If you specify that the index should be sparse, then only documents that have
    the fields being indexed will be inserted into the B-tree. This is in contrast
    to regular (non-sparse) indexes, which will index every document in the collection,
    even ones that don’t have the fields being indexed.


    Here’s how you create a sparse index in MongoDB:


    ```

    // sparse is an attribute of index being created

    db.collection.createIndex({a:1}, {sparse:true})

    ```


    The preceding creates an index on the a field, which only contains documents where
    the a field is present.


    Because of MongoDB Query Language (MQL) null semantics, non-sparse indexed documents
    in which a field is missing are indexed the same as documents in which the field
    exists with a value of null. In a sparse index, a null entry means the field is
    present and set to null. We’ll explore this further in Chapter 12, Advanced Query
    and Indexing Concepts.'
  merge: -1
  img_proc: true
- pgno: 104
  md: "# Wildcard indexes\n\nWildcard indexes allow you to specify an index without\
    \ knowing the names of the fields in advance. This is not uncommon with a dynamic\
    \ schema:\n\n```\n// Index fields inside attr subdocument\ndb.collection.createIndex({\
    \ \"attr.$**\": 1 })\n// Sample document\n// { ...,\n//   attr: {\n//     genre:\
    \ \"Mystery\",\n//     author: \"John Smith\",\n//     pages: NumberInt(298),\n\
    //     ...\n//   }\n// }\n// query using the index\ndb.collection.find({\"attr.pages\"\
    :{$gt:500}})\n```\n\nThis allows you to query using an index on any of the attributes\
    \ stored under attr without having to create a separate index for each one of\
    \ them. Wildcard indexes are sparse by default.\n\n# Partial indexes\n\nSometimes,\
    \ you may want to only index and query a subset of your documents. Partial indexes\
    \ will only index documents that match a specified filter. This command creates\
    \ an index on two fields, but only indexes documents where status is equal to\
    \ \"processing\":\n\n```\ndb.orders.createIndex(\n  { country: 1, dateOrdered:\
    \ 1 },\n  { partialFilterExpression: { status: \"processing\" } }\n)\n```\n\n\
    A query with {status:\"processing\"} among other query predicates will be able\
    \ to use this partial index.\n\nUsing partial indexes can significantly reduce\
    \ index size and save on resources. This is particularly useful when your queries\
    \ target only a small portion of the collection. For instance, if you frequently\
    \ query only active documents, which make up a small subset of your data, an index\
    \ with a partial filter of {active:true} will be both compact and efficient. When\
    \ a document is updated to {active:false}, it is automatically removed from the\
    \ index."
  merge: -1
  img_proc: true
- pgno: 105
  md: 'This isn’t an exhaustive list of all index types and attributes; you can read
    more about them in the MongoDB Server documentation at https://www.mongodb.com/docs/manual/indexes/.


    # Designing efficient indexes


    Indexes are a cornerstone of MongoDB’s performance optimization strategy, enabling
    fast, efficient querying and sorting over large datasets. However, designing effective
    indexes requires more than understanding their basic function; it demands careful
    consideration of query patterns, field cardinality, and operational needs. Common
    misconceptions about low-cardinality fields and inequality queries often mislead
    developers, but the right indexing strategies can drastically improve performance.
    Compound indexes, index compression, covered queries, and partial indexes provide
    powerful tools for optimizing database operations, and the **Equality, Sort, Range**
    (ESR) guideline simplifies complex decisions around field ordering.


    In this section, we’ll explore the foundational principles of index design, covering
    critical topics such as cardinality versus selectivity, compound index design,
    prefix compression, partial indexes, and how indexes support aggregation pipelines,
    giving you the tools to design indexes that maximize performance for your application.


    # Cardinality and selectivity


    There is a common misunderstanding that low-cardinality fields (fields with few
    unique values) should not be included in indexes. This is simply not true.


    **Cardinality** in databases refers to how many distinct values a particular field
    can have. A boolean field has a cardinality of two: true or false. A unique ID
    field has cardinality equal to the number of documents in the collection. Last
    name has a higher cardinality than first name. Cardinality is not as important
    to query effectiveness as selectivity, the number of documents in the collection
    that match a specific value in your query.


    As an example, imagine an orders collection with a status field, which can either
    be "processing" or "done". At any given time, less than 0.01% of orders have status:
    "processing" because most orders are "done". An index on status would be excellent
    for querying for processing orders because it’s highly selective, even though
    the field has low cardinality. On the other hand, using that index to find all
    orders that have been carried out is of limited help because it matches 99.99%
    of all documents in the collection.'
  merge: -1
  img_proc: true
- pgno: 106
  md: "This brings us to a related misunderstanding that inequality queries (such\
    \ as $ne) cannot use indexes effectively. That’s false! If you query for {status:\
    \ {$ne: \"done\"}} against the same orders collection, it will be just as selective\
    \ as querying for {status: \"processing\"}. The MongoDB query engine handles it\
    \ slightly differently (it’s processed as a range query), but being highly selective,\
    \ it is still very efficient, even though it will use a different query plan:\n\
    \n```\n// For {status: {$ne: \"done\"}}, the index scan uses:\n\"indexBounds\"\
    : {\n  \"status\": [\n    \"[MinKey, \\\"done\\\")\",\n    \"(\\\"done\\\", MaxKey]\"\
    \n  ]\n}\n// For { status: \"processing\" }, the index scan uses:\n\"indexBounds\"\
    : {\n  \"status\": [\n    \"[\\\"processing\\\",\\\"processing\\\"]\"\n  ]\n}\n\
    ```\n\nThese are examples of output from the explain method, which we will talk\
    \ about more later, in Chapter 12, Advanced Query and Indexing Concepts, where\
    \ we start trying to debug our queries and validate how well our indexes help\
    \ with performance. Knowing whether an operation is an equality or range query\
    \ matters a lot to our next topic of ordering fields in compound indexes.\n\n\
    # Constructing compound indexes\n\nOptimal compound indexes require understanding\
    \ how different queries use them. A compound index indexes multiple fields in\
    \ a defined order, and that order significantly affects how MongoDB uses the index.\n\
    \nA compound index in MongoDB includes multiple fields, and sorts documents first\
    \ by the value of the first indexed field, then by the second, and so on. Internally,\
    \ it’s organized like a sorted tree structure, enabling efficient traversal when\
    \ the query matches the beginning of the index key pattern. For example, a compound\
    \ index on {a:1, b:1, c:1} allows MongoDB to efficiently locate documents that\
    \ match queries filtering on the following:\n\n```\n{ a: <value> }\n{ a: <value>,\
    \ b: <value> }\n{ a: <value>, b: <value>, c: <value> }\n```"
  merge: -1
  img_proc: true
- pgno: 107
  md: 'This is known as **prefix matching**. The query must match the prefix of the
    index fields in order to be eligible to use the index. A query that skips over
    the first field, such as {b:<value>} or {c:<value>}, cannot use this index. In
    those cases, MongoDB performs a full collection scan.


    Let’s take a look at a more practical example. Suppose you create a compound index
    such as this: {category:1,price:1,stock:1}.


    This index works well for queries such as {category:"books"} or {category:"books",price:
    {$lt:20}}. Using a sorted list can help us to visualize how the index can be utilized:


    ```

    "books",10,399

    "books",13,205

    "books",15,11

    "books",22,0

    "pens",2,175

    "pens",5,42

    "pens",12,109

    "pens",15,98

    ```


    When the list is sorted by category and then price, it’s easy to quickly find
    all books or all pens, and once we find a single category, it’s easy to find the
    "price less than $20" range and return those records in order by price.


    However, you can see that if I just asked for all items less than $20 without
    specifying a category, we would have to go through every category value, which
    would make the index far less useful. This is because the query skips over the
    category field. Since the index is sorted first by category, MongoDB has no efficient
    way to isolate the relevant range of documents by price alone. And the index is
    completely unusable to answer a query such as "what items have stock 0". We may
    as well do a collection scan for that query.


    Understanding how prefix matching works is important for designing compound indexes
    that align with your application’s most common query patterns.


    # Equality queries


    A common query pattern involves using equality on multiple fields. For example,
    suppose you’re storing addresses, mostly in the United States, where the following
    applies:


    +   - country is usually "US" (low cardinality)

    +   - state has about 50 possibilities (medium cardinality)

    +   - zipString has over 42,000 unique values (high cardinality)'
  merge: -1
  img_proc: true
- pgno: 108
  md: 'Let’s say we always query with equality on all three fields:


    ```

    db.collection.find({country: "US", state: "NY", zipString: "10001"})

    ```


    Which compound index would perform better?


    +   - Option 1: { country: 1, state: 1, zipString: 1 }

    +   - Option 2: { zipString: 1, state: 1, country: 1 }


    Conventional wisdom, or your gut, might say Option 2 because the most selective
    field is ordered first. But it turns out that it wouldn’t make the queries run
    any faster. For queries with equality conditions on all fields, both indexes will
    perform equally well. This is an important concept to understand: when selecting
    on all fields, the B-tree for Option 1 and Option 2 will be the same size because
    they have to index the same number of documents; therefore, they will be the same
    depth, and finding a specific value will be the exact same O(log n) for both.


    That said, you should still prefer Option 1 if all else is equal. When low-cardinality
    fields (such as country, which might only be "US" or "CA") appear first, MongoDB
    can compress long runs of repeated values more effectively. Because of prefix
    compression, placing low-cardinality fields first will significantly reduce the
    index size on both disk and in RAM:


    ```

    "country_1_state_1_zipString_1": 620 KB

    "zipString_1_state_1_country_1": 804 KB

    ```


    That’s almost a 30% difference in size! Smaller indexes mean less disk usage,
    faster loads, and more efficient memory usage.


    There may still be valid reasons to order fields a certain way. For example, the
    Option 2 index can serve queries on just zipString or on both zipString and state.
    So, there might be good use cases for choosing Option 2 over Option 1, but expecting
    “faster queries” with equality on all three fields is not one of them.


    Things get more interesting (and more complex) when we start adding range queries
    and sort operations into the mix.


    # Sorts and range queries


    Indexes allow us to efficiently answer range queries because we can quickly find
    the value at one end of the range and then proceed through the index, getting
    documents in order till we reach the first value above our upper bound, as follows:'
  merge: -1
  img_proc: true
- pgno: 109
  md: '![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_109_0.png)


    Figure 3.3: Using indexes for efficient range queries and sorting


    For a query on {field: {$gt: 205, $lt:290}}, we find our lower range, 205, and
    then traverse along the leaf nodes until we encounter a value greater than our
    upper range, 290. Note that we are getting these values in order from the index,
    so if the query had sort:{field:1}, we would get the values in sorted order “for
    free.” If the sort expression was on {field:-1}, we would just start by looking
    for 290, the upper value of the range first, and then scan the index right to
    left (i.e., backward rather than forward) till we got past 205, the lower boundary,
    which would give us the values in descending order.


    What happens if we have an equality query on one field and a range query on another
    field? Let''s look at the index on {category:1,price:1} and the {category:"books",price:{$lt:20}}
    query. We already saw that we can easily find documents with equality on category
    and range (or sort) on price:


    ```

    "books",10

    "books",13

    "books",15

    "books",22

    "pens",2

    "pens",5

    "pens",12

    "pens",15

    ```


    Since the equality field comes first, we can navigate directly to the part of
    the sorted tree matching that value, and the second field remains in order, so
    applying a range filter is just as straightforward. But what happens if the index
    is on {price:1,category:1}, which means the range filter is on the first field,
    and equality is on the second field?'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'The index would now look like this:


    ```

    2,"pens"

    5,"pens"

    10,"books"

    12,"pens"

    13,"books"

    15,"books"

    15,"pens"

    22,"books"

    ```


    In this index, when we navigate to the index range where price is less than 20,
    we’ll find that category is all mixed. This means we’ll have to scan more index
    entries with a price less than 20, throwing away ones that don’t match the equality
    predicate, than we would with a different index structure. And what if we needed
    a sort on the second field after applying range on the first field? Again, because
    the values are not in order, we would need to do a lot more work in memory.


    The same concept applies if we have equality and sorting. If the equality is on
    the first field in the compound index, then the second field values are still
    “in order” in the part of the index we have navigated to. But if sort is on the
    first field in the index, then while we can get those values in order while scanning
    the full index, we have to keep checking and throwing away the entries where the
    second field is not equal to our predicate.


    What if we have all three: equality, range predicate, and a sort on another field?
    Let’s return to our example with three fields in the {category:1,price:1,stock:1}
    index and these values:


    ```

    "books",10,399

    "books",13,205

    "books",15,11

    "books",22,0

    "pens",2,175

    "pens",5,42

    "pens",12,109

    "pens",15,98

    ```'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'We can see that if we query on the "books" category, the prices are in order,
    but the stock is not. If the index switched the order of price and stock to become
    {category:1,stock:1,price:1}, we would have this:


    ```

    "books",0,22

    "books",11,15

    "books",205,13

    "books",399,10

    "pens",42,5

    "pens",98,15

    "pens",109,12

    "pens",175,2

    ```


    Now, we can quickly find specific category items that have zero stock, or sort
    specific categories by stock, but we no longer have our price values in order.
    So, if we had range and sort or two range queries, while we would be able to determine
    whether the document matches from the index, we would not be able to limit the
    number of index entries we examine to just the ones that match.


    All this leads us to some general principles we can apply.


    # The ESR guideline


    You may have heard of the ESR guideline for compound indexes:


    +   - E: Equality fields first

    +   - S: Sort fields next

    +   - R: Range fields last


    While this isn’t a hard rule, it serves as a helpful guideline, and one part of
    it is absolute: put equality fields first. Applying equality to the leading field(s)
    of the compound index allows us to still take advantage of the rest of the field
    values being in sorted order. However, whether sort or range fields should come
    next depends on your specific needs:


    +   - If avoiding in-memory sorts is critical, then put sort fields before range
    fields (ESR)

    +   - If your range predicate in the query is very selective, place it before
    sort fields (ERS) to reduce the number of documents to sort and allow for efficient
    in-memory sorting


    So, equality must come first because the structure of a sorted index with multiple
    fields allows us to apply an equality filter while still preserving the sorted
    order of the remaining fields.'
  merge: -1
  img_proc: true
- pgno: 112
  md: "# Maximizing resources with partial indexes\n\nSometimes, we don’t need to\
    \ index every document, especially if a query only ever targets a small, well-defined\
    \ subset of your collection. In some cases, your multiple equality query might\
    \ always specify a particular field with only a single value. For example, in\
    \ a collection of orders that are being processed, there will likely be far fewer\
    \ orders with a \"processing\" status than those marked \"done\". On the other\
    \ hand, those are the orders you are more likely to be querying frequently. In\
    \ such a case, creating an index that supports queries on \"processing\" orders\
    \ (and ignores \"done\" orders) can be much more efficient than a regular index\
    \ on every document.\n\nTo support queries for orders being processed where we\
    \ get zip, state, and country, we can create the following index:\n\n```\n{status:1,\
    \ zipString:1,state:1,country:1}\n```\n\nThis index will already benefit from\
    \ prefix compression, but it would not benefit from being right-balanced, even\
    \ though we are only querying documents with status processing, because when the\
    \ status is updated to \"done\", we now have to update pages in the part of the\
    \ index that’s not usually read. We would save more space and resources by indexing\
    \ only the documents with status: \"processing\", like this:\n\n```\ndb.coll.createIndex(\n\
    \  {zipString:1,state:1,country:1},\n  {partialFilterExpression:{status:\"processing\"\
    }})\n```\n\nNow, only a small subset of your entire collection is stored in the\
    \ index, and when an order is updated to have status set to \"done\", it will\
    \ automatically be unindexed or removed from the index, keeping its size small.\n\
    \n# Covered queries: the performance holy grail\n\nA covered query is one where\
    \ all the fields needed to satisfy the query are in the index, so MongoDB doesn’t\
    \ need to look at the actual documents at all. These queries usually require the\
    \ least resources. Here is an example of what it would take to have a covered\
    \ query:\n\n```\n// We create this index:\ndb.orders.createIndex({ orderId: 1,\
    \ status: 1 })\n\n// This query is covered, the index already contains status\
    \ field:\ndb.orders.find({ orderId: 295 }, { _id: 0, status: 1 })\n```"
  merge: -1
  img_proc: true
- pgno: 113
  md: '```

    // This query is not covered, we need to fetch documents to get the total field

    db.orders.find({ orderId: 295 }, { _id:0, total: 1 })

    ```


    There are some limitations, though. Covered queries generally can’t work with
    multikey indexes when the field you need to return could be an array. This is
    because MongoDB needs to look at the document to see whether the value to be returned
    is a scalar or an array. Some null queries cannot be covered because the index
    doesn’t differentiate between fields that contain null and fields that don’t exist.


    No form of the $exists clause can be determined from a regular index at all because
    of the same null semantics, so if you hope to have an efficient indexed query,
    stay away from $exists clauses as a rule, unless you are using a sparse index.
    We’ll look at this topic in more detail in Chapter 12, Advanced Query and Indexing
    Concepts.


    # Ascending versus descending index order


    If you noticed, all the examples used {field:1} as opposed to {field:-1}. This
    is because we don’t usually need to have our index stored in descending order.
    The query engine can scan the B-tree from left to right or right to left, depending
    on whether it needs the results in ascending or descending order. There is only
    one exception to this, and that’s when you have a sort on multiple fields in opposite
    directions. Let’s say we have the following query:


    ```

    db.coll.find({category:"books"}).sort({genre:1, price:-1})

    ```


    To create an index that will support this fully, we would have to make the index
    one of the following:


    ```

    {category:1, genre:1, price:-1} OR {category:1, genre:-1, price:1}

    ```


    This is because the sort order specified in the query uses two sort fields in
    opposite directions (one ascending, and one descending); therefore, the index
    on those two fields should also be in opposite order to support sort. Since the
    index can be scanned in forward or backward order, we can reverse the order of
    either of the two sort fields.


    # Indexing and aggregation pipelines


    Indexes are eligible for use by all MongoDB commands that need to find a subset
    of documents in a collection: find, update, delete, and even aggregate. But the
    last one often causes some confusion: when can it use indexes to filter data,
    and when can it not?'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'Think about what indexes do: they help locate documents by their record IDs.
    Once an aggregation pipeline transforms documents into new shapes, those indexes
    no longer apply because we’re dealing with new, in-memory documents that don’t
    correspond to our indexed collection structure. But when aggregation needs to
    get documents from a collection that actually exists, then indexes are just as
    critical as for any find operation.


    Indexes are used in the $match and $sort stages of aggregation when they apply
    to documents in the collection being aggregated. Indexes are also used by any
    stage that goes to another collection, such as $unionWith (which executes a new
    pipeline) or $lookup (which executes a query on another collection based on a
    value in the current pipeline). We’ll take a closer look at how to determine which
    indexes are being used in Chapter 4, Aggregations, and Chapter 12, Advanced Query
    and Indexing Concepts.


    # Summary


    Indexes are powerful tools that can significantly speed up your MongoDB queries
    when used correctly. While they improve read performance, they come with a slight
    trade-off: slower writes. In most cases, this trade-off is well worth it for the
    performance gains. It’s important to understand how different types of indexes
    behave. For example, right-balanced indexes, such as those based on ObjectID or
    other sequential values, are more efficient in their use of memory.


    When choosing which fields to index, focus on selectivity (the ability of a field
    to narrow down results) rather than cardinality alone. In compound indexes, placing
    low-cardinality fields first can improve prefix compression, but it’s also essential
    to consider prefix matching to minimize the number of indexes you create. Partial
    indexes can be a game-changer by dramatically reducing index size when only a
    subset of documents needs to be indexed. Additionally, covered queries (where
    all the required fields are in the index) are usually the most efficient, so keep
    them in mind when designing your indexes.


    By applying these best practices, you’ll be well equipped to build a high-performing
    MongoDB database that meets your application’s demands. In the next chapter, we’ll
    explore MongoDB’s powerful aggregation framework and delve into more advanced
    topics, such as how the query optimizer selects indexes.'
  merge: -1
  img_proc: true
- pgno: 115
  md: '# 4


    # Aggregations


    If you’ve ever tried to wrangle data into meaningful insights, you know that raw
    documents alone won’t cut it. You need to slice, dice, transform, and summarize.
    This is where MongoDB’s aggregation framework shines. Think of it like a data
    assembly line: documents enter from one end, undergo a series of transformations
    as they pass through various stages, and emerge transformed on the other end.
    It’s powerful and flexible, but if you’re not careful, it can become a performance
    bottleneck.


    In this chapter, we’ll explore how to build aggregation pipelines that are both
    powerful and performant. We’ll look at pipeline optimization strategies, memory
    management techniques, stage-specific considerations, and approaches for handling
    large datasets, all with performance as our North Star.


    This chapter will cover the following topics:


    +   - The fundamentals of MongoDB’s aggregation framework

    +   - Optimization techniques for aggregation pipeline performance

    +   - Best practices for working with large datasets

    +   - Aggregation in distributed environments and sharded collections

    +   - Monitoring, profiling, and troubleshooting aggregation performance'
  merge: -1
  img_proc: true
- pgno: 116
  md: '# MongoDB’s aggregation framework


    MongoDB’s aggregation framework is the Swiss Army knife of data transformation
    and analysis in the database world. But before we dive into optimization techniques,
    let’s understand what makes this tool so special.


    In the early days, MongoDB’s aggregation options were, let’s say, minimalist.
    Developers relied on the mapReduce command or handling aggregations in client
    code to perform data summarization. While functional, these approaches were often
    clunky, slow, and not particularly easy to use.


    Enter the aggregation pipeline, a game-changer introduced in MongoDB 2.2. Suddenly,
    developers could chain together a series of stages, each transforming the data
    in some way, much like an assembly line in a factory or a Unix command-line pipe.
    Over subsequent releases, the aggregation framework has grown more powerful, adding
    new stages, operators, expressions, and performance optimizations to meet increasingly
    sophisticated data processing needs.


    If you’re coming from a SQL background, you might be used to writing SELECT …
    GROUP BY … HAVING … queries with multiple JOIN operations and subqueries. The
    aggregation pipeline offers similar capabilities but with a twist: instead of
    a monolithic query, you build a pipeline of stages, each performing a specific
    task or transformation. Documents flow from a collection into the first stage,
    then from there into subsequent stages, and eventually are returned to the client
    as the result.


    This modular approach makes complex data-processing tasks more readable and maintainable,
    especially when working with complex document structures that are common in MongoDB.
    Additionally, you can do things in MongoDB aggregations, including working with
    complex arrays of documents, that could make a traditional SQL query blush with
    the complexity.


    # Core concepts of the aggregation pipeline


    Think of your data as a river, and each pipeline stage as a dam, filter, or turbine
    that changes the flow in some way. Documents enter the pipeline, are transformed
    by each stage, and emerge at the end as the result set you want. This is very
    similar to using the Unix command-line pipe to do multiple transformations on
    a large text file:


    ```

    grep xxx file.log | cut .. | sed | sort | head -20

    cat file.log | awk ''{print $2, $NF}'' | ... >> newfile.log

    ```'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'The order of stages matters... a lot! Filtering early will dramatically reduce
    the amount of work downstream. Each stage works exclusively on the documents it
    receives from the previous stage, and its output becomes the input for the next
    stage in the sequence.


    # Data in


    ```

    { $match: { language: "English" } }

    ```


    ```

    { $unwind: "$subjects" }

    ```


    ```

    { $group: { _id: "$subjects", count: { $sum: 1 } } }

    ```


    ```

    { $sort: { count: -1 } }

    ```


    # Data out


    ![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_117_0.png)


    Figure 4.1: Documents transform as they flow through stages of the pipeline'
  merge: -1
