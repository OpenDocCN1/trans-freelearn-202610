  md: '![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_60_0.png)


    # Loads and Threads


    *Figure 1.12: Performance improves as load and threads grow until the system is
    overloaded*


    As the load and number of active threads increase, the performance in IOPS also
    increases until the system reaches a point where the threads start to contend
    for shared resources. Beyond this point, further increasing the load and number
    of threads can cause performance to decline. Most systems have this characteristic.
    Peak performance tends to be a factor of the following:


    +   - The amount of work being performed for each request

    +   - The ratio of threads to CPU cores

    +   - The contention for shared resources


    The best way to understand this load/performance graph for your application or
    workload is to run stress/load experiments before you put your product into production.


    To resolve this issue, we add a second application server; overall performance
    improves, but doesn’t reach our performance goal.


    We re-analyze the load of the components and now see that the CPU on the server
    running the mongod process is fully utilized. Performance goes from the Underutilized
    part of the graph to the Overloaded part. We now see that the MongoDB server is
    the bottleneck.


    Now that we have doubled the load from the application servers, we can reduce
    it in a finer-grained way by reducing the number of concurrent operations or threads
    running in the server. You could manage this from your application servers, but
    another way to do so is to lower the maxPoolSize limit in your database driver
    or framework/object-relational mapper (ORM). This will reduce the maximum number
    of connections to the database, which will reduce the maximum'
  merge: -1
