  md: "# Document lookup strategies and performance\n\nChange streams offer several\
    \ options for accessing document data, each with different performance implications:\n\
    \n+   - **Delta-only**: Default behavior; includes only change information.\n\
    +   - **Current state lookup**: fullDocument: 'updateLookup' fetches the current\
    \ document.\n+   - **Before and after images (MongoDB 6.0+)**: Provides the document\
    \ state before and after changes. This optional feature can affect performance\
    \ because the database has to capture and store the document before or after the\
    \ change.\n\nThe best approach depends on your specific use case. Ask yourself\
    \ the following questions to guide your decision:\n\n+   - Is the value delta\
    \ in updateDescription sufficient for your application use case?\n+   - How much\
    \ additional network bandwidth can you afford?\n+   - Is the latency of an additional\
    \ document lookup acceptable?\n\nChoosing the right option depends on your application’s\
    \ need for accuracy, performance, and resource efficiency. For example, the 'updateLookup'\
    \ option will fetch the fullDocument sometime after the update has occurred. This\
    \ can have a clear performance impact if the document is large. However, it may\
    \ also require careful handling in your application. For instance, if the document\
    \ is changing frequently and there is a queue of changes to be processed, you\
    \ could end up reading a version that is three changes later. This could also\
    \ happen if you replay the change stream; the fullDocument your application receives\
    \ (when using 'updateLookup') is the current version of the document, not the\
    \ one at the time of the change.\n\n# Building a price monitoring service\n\n\
    To illustrate these concepts in action, let’s implement a service that monitors\
    \ product price changes and notifies interested parties. The following code sets\
    \ up an aggregation pipeline to watch for updates to the price field and notifies\
    \ other parts of the application when the change exceeds a defined threshold:\n\
    \n```\n// Code snippets for MongoDB Node.js driver\n// Configure the collection\
    \ to using preImages (before the changes happen)\ndb.runCommand({ collMod: \"\
    yourCollectionName\",\n    changeStreamPreAndPostImages: { enabled: true }\n});\n\
    ```"
