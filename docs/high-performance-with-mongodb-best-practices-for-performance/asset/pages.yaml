- pgno: 205
  md: '# Performance-tuning recap


    When optimizing change streams for production, several key strategies should be
    implemented. Server-side filtering with aggregation pipelines significantly reduces
    the event volume, minimizing network traffic and processing overhead. Select an
    appropriate document lookup strategy based on your specific application requirements,
    carefully choosing between the various `fullDocument` options to balance completeness
    with performance.


    Size your oplog appropriately for expected maximum downtime scenarios, ensuring
    it can retain operations long enough to bridge maintenance windows or recovery
    periods. Always configure your connection pool size to exceed the number of open
    change streams, preventing resource exhaustion.


    Limit the number of specifically targeted change streams, as these cannot leverage
    indexing optimizations, potentially increasing server load. For applications with
    particularly high event volumes, consider dedicated infrastructure to isolate
    change stream processing from your main database workload, preventing performance
    impact on critical operations.


    # Summary


    Change streams transform MongoDB from a traditional database into a reactive data
    platform, enabling real-time responses to data changes. When implemented thoughtfully
    with performance considerations in mind, they provide a powerful foundation for
    building responsive, event-driven applications.


    The next chapter shifts the focus to transactions, an important part of building
    reliable and consistent applications. We’ll delve into the mechanics of multi-document
    ACID transactions and discuss key considerations for optimizing their performance
    in various MongoDB architectures.'
