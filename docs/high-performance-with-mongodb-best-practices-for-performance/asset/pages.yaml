- pgno: 191
  md: '# 8


    # Change Streams


    Change streams represent one of MongoDB’s most powerful capabilities for building
    reactive, event-driven applications. Think of them as a live data stream, constantly
    sending notifications of updates as they occur within your collections and databases
    and across your entire MongoDB deployment. This chapter explores the architecture,
    implementation strategies, and performance considerations for change streams,
    providing practical guidance to help you leverage this feature effectively in
    high-performance MongoDB deployments.


    We will begin by examining the architecture behind change streams and the evolution
    from manual operation log (oplog) tailing. You’ll learn how MongoDB transforms
    write operations into change events, what those events look like, and how they
    move through their life cycle. We will then cover how to implement change streams
    effectively by selecting the right observation scope, applying server-side filtering
    with aggregation pipelines, and using document lookup strategies that balance
    performance and completeness. Finally, a hands-on example will demonstrate how
    to build a real-time price monitoring service using change streams.


    The second half of the chapter focuses on performance and durability: strategies
    for resource optimization, designing resilient consumers, and handling high-volume
    streams. We also address special considerations for sharded clusters, document
    size constraints, and collection life cycles. The chapter concludes with guidance
    on monitoring and replica set nuances and a recap of tuning techniques to ensure
    your change stream implementation is production-ready.


    This chapter covers the following topics:


    +   - Understanding the architecture of change streams and how they work

    +   - Using change streams efficiently

    +   - Managing performance and durability

    +   - Advanced patterns and production readiness'
  merge: -1
  img_proc: true
- pgno: 192
  md: '# Understanding change streams architecture


    At its core, a change stream is a cursor that remains open and delivers database
    change events to applications as they occur. To fully utilize change streams,
    it’s essential to understand how they operate beneath the surface. Before change
    streams were introduced in MongoDB 3.6, developers who needed change events either
    relied on polling, built application-side notification systems, or manually tailed
    MongoDB’s oplog collection.


    These approaches had several drawbacks. Polling from the application could add
    unnecessary load to the database server if the polling interval was more frequent
    than the changes. On the other hand, if the polling interval was less frequent,
    the application risked missing some changes or introducing delays, requiring additional
    complexity to handle such scenarios. Parsing raw oplog entries also demanded knowledge
    of MongoDB internals, adding further complexity. Moreover, the implementation
    was fragile, since the oplog format is an internal detail that could change between
    MongoDB versions. Finally, manually tailing the oplog offered limited guarantees:
    there was no built-in resumability if network connectivity was lost, and no consistent
    ordering guarantees. These limitations made oplog tailing a brittle solution that
    required significant expertise to implement correctly and left applications vulnerable
    to internal breaking changes between MongoDB versions.


    Change streams solve these problems by providing an official, supported interface
    that abstracts away underlying complexities. With it, you can take advantage of
    features such as the following:


    +   - **Reliability:** There are no duplicate or missed event notifications

    +   - **Structured event documents:** A well-defined format with detailed information
    about each change

    +   - **Resumability:** Built-in resume tokens enable reliable recovery after
    disconnections

    +   - **Ordering guarantees:** Ensure consistent global ordering of events, even
    across sharded clusters

    +   - **Filtering capabilities:** Server-side filtering using aggregation pipelines

    +   - **More secure:** While the oplog exposes all changes on the server, change
    streams only deliver updates that the user or code has permission to access

    +   - **Simpler:** Events are sent only for majority-committed writes, so your
    application doesn’t need to handle rollbacks

    +   - **Optional images:** You can get a copy of the changed document before and/or
    after the change'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'Together, these features offer a robust and reliable foundation for building
    real-time applications that respond to data changes, while maintaining consistency
    and resilience, even in the face of disconnections or server failures.


    # How change streams work: From write operations to events


    Change streams are built on MongoDB’s replication infrastructure. Understanding
    this connection helps explain both their capabilities and limitations. At a high
    level, a client application is notified of a change through the following steps:


    +   1. Part of the client application performs a write operation on a MongoDB
    collection.

    +   2. The operation is recorded in the primary’s oplog.

    +   3. The change stream feature monitors the oplog for majority-committed entries.

    +   4. Raw oplog entries are transformed into a more developer-friendly format.

    +   5. Events are delivered to client applications through an open cursor.


    ![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_193_0.png)


    Figure 8.1: Sequence of how document changes are notified through change streams


    Figure 8.1 shows a high-level view of the steps involved in delivering change
    notifications from MongoDB to client applications using change streams. App_A
    and App_B could represent the same application. The oplog is part of MongoDB,
    while the change stream cursor (CS_Cursor) exists both within the MongoDB server
    and on the client side in App_B.'
  merge: -1
  img_proc: true
- pgno: 194
  md: "This process ensures that all database changes are captured reliably and delivered\
    \ in a consistent order to applications that need to respond in real time. In\
    \ sharded clusters, the process becomes more intricate, as the router must coordinate\
    \ across multiple shards while preserving the global ordering of events.\n\n#\
    \ Event structure and life cycle\n\nEach change stream event contains information\
    \ about what changed and provides tools for maintaining continuity. For example,\
    \ here is a change stream event for a change to the price field in a document\
    \ in a products collection:\n\n```\n{\n  \"_id\": {\n    \"_data\": \"825F65A78B00000012B022C0100296E5A1004...\"\
    \  // Resume token\n  },\n  \"operationType\": \"update\",\n  \"ns\": {\n    \"\
    db\": \"inventory\",\n    \"coll\": \"products\"\n  },\n  \"documentKey\": {\n\
    \    \"_id\": ObjectId(\"5f65a78b0000000000000001\")\n  },\n  \"updateDescription\"\
    : {\n    \"updatedFields\": {\n      \"price\": 29.99,\n      \"lastModified\"\
    : ISODate(\"2023-09-15T14:22:01.123Z\")\n    },\n    \"removedFields\": [\"promotion\"\
    ]\n  },\n  \"fullDocument\": { // Only present with fullDocument option\n    //\
    \ Complete current state of the document\n  }\n}\n```\n\nAs you can see, the change\
    \ stream event can include the full document, if requested during the change stream\
    \ setup. However, this can significantly impact performance, so it should be used\
    \ judiciously. A change stream cursor progresses through the following states\
    \ during its life cycle:"
  merge: -1
  img_proc: true
- pgno: 195
  md: '+   1. **Opening:** Establishing its position in the oplog

    +   2. **Waiting:** Remaining idle until changes occur

    +   3. **Delivering:** Sending events to the client

    +   4. **Resuming:** Re-establishing the stream after a disconnection

    +   5. **Invalidation:** Terminating after certain operations


    Understanding this life cycle is key to building resilient applications.


    # Implementing change streams effectively


    Now that you’re familiar with the architecture of change streams, let’s look at
    how to implement an application that uses them effectively for optimal performance
    across different scenarios.


    # Choosing the right scope and filtering strategy


    MongoDB provides flexibility in both observation scope and filtering capabilities.
    The combination of these two factors has a significant impact on performance.
    The observation scope can be limited to a collection, span a database, or extend
    across the entire deployment. In general, the broader the scope, the greater the
    performance impact, since more resources are consumed and a higher volume of change
    events must be processed.


    Table 8.1 outlines each scope, its resource usage, the expected event volume,
    and a typical use case for when you might choose it in your application:


    | Scope | Resource usage | Event volume | Use cases |

    |---|---|---|---|

    | Collection | Lower | Focused | Specific business events, targeted synchronization
    |

    | Database | Medium | Moderate | Cross-collection workflows, database-wide auditing
    |

    | Deployment | Higher | Highest | Global audit logging, multi-tenant event broadcasting
    |


    *Table 8.1: Change stream scopes and characteristics*


    As shown in Table 8.1, choosing the appropriate observation scope is a balancing
    act between visibility and performance. A collection-level scope offers the most
    efficient resource usage and is ideal for targeted use cases. Expanding to a database
    or deployment-wide scope increases observability but also demands more from the
    database and your application.'
