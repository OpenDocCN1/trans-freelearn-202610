- pgno: 59
  md: 'Initially, we assume the bottleneck is somewhere in the data services layer
    or below, but when we look at CPU and I/O utilization, we see idle CPU time, and
    the storage IOPS and bandwidth are not being reached. So, we assume the limiting
    factor is further upstream. Through measurements on the application server, we
    see it has no idle CPU time, so it is the bottleneck. It is not generating enough
