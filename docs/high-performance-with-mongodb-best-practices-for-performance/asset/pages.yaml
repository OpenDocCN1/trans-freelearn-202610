    # Transactions API and session management


    MongoDB provides two approaches to working with transactions: the Core API and
    the Callback API. Each has its place, depending on your requirements and coding
    style.


    # Core API


    The Core API gives you explicit control over each step of the transaction life
    cycle. You’re responsible for starting the session, beginning the transaction,
    committing or aborting it, and ending the session. Here’s a typical pattern that
    starts a session, starts a transaction, performs a number of operations, and tries
    to commit the transaction. It has to handle either the success or failure of the
    commit, and if there is to be another attempt, it has to be explicitly written
    in the code, like in the following:


    ```

    // Start a session

    const session = client.startSession();


    // Start a transaction

    session.startTransaction();

    ```'
