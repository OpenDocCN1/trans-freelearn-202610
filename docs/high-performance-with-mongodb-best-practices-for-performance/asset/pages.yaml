    Figure 4.2: Aggregation pipeline with streaming and blocking stages


    In sharded clusters, when the pipeline involves documents from more than one shard,
    MongoDB executes as much of the pipeline as possible on the individual shards
    to distribute the workload before merging the results. For example, filtering
    and transformation stages are performed on shards, reducing the amount of data
    sent across the network, while operations such as grouping or sorting only do
    initial work on the shards, but then may require merging intermediate results
    and finishing the work on the mongos router.


    MongoDB is doing a lot of work to speed up your pipeline. What optimizations does
    that leave for you?


    # Optimizing aggregation pipelines


    The order of stages in your aggregation pipeline can significantly impact performance.
    While MongoDB’s query optimizer is quite intelligent and can automatically reorder
    stages, understanding these optimizations can help you design better pipelines.


    MongoDB’s query engine executes a slightly different pipeline than the one passed
    to the query optimizer. You can compare the actual pipeline that will be executed
    with what you wrote by using the explain() method, which reveals how MongoDB has
    transformed your pipeline for'
