- pgno: 87
  md: "By precomputing this data and embedding it into the document, queries related\
    \ to engagement statistics and audience demographics can be executed quickly,\
    \ without requiring access to raw event logs or other related datasets.\n\nThis\
    \ pattern eliminates the need for complex aggregation queries during read operations.\
    \ Note that this increases the cost of what would normally be just a read or a\
    \ write by adding an additional write; to avoid this cost, you can queue the additional\
    \ write to be performed as an async write rather than making it required during\
    \ the original operation.\n\n# Schema versioning pattern\n\nWhen applying the\
    \ schema versioning pattern, you include a version field to track schema changes\
    \ over time, allowing for smooth transitions during schema evolution.\n\nThe following\
    \ example includes two sample user documents from the Socialite database:\n\n\
    ```\n// New document with schema version 3\n{\n  _id: ObjectId(\"5f4e5b6d3c1e2a1b3c4d5e6f\"\
    ),\n  schemaVersion: 3,\n  username: \"jane_smith\",\n  name: { // In schema v3,\
    \ we split name into first/last\n    first: \"Jane\",\n    last: \"Smith\"\n \
    \ },\n  email: \"jane.smith@example.com\",\n  // ... other fields\n}\n\n// Older\
    \ document with schema version 2\n{\n  _id: ObjectId(\"5f4e5b6d3c1e2a1b3c4d5e7a\"\
    ),\n  schemaVersion: 2,\n  username: \"john_doe\",\n  fullName: \"John Doe\",\
    \ // In schema v2, we used a single name field\n  email: \"john.doe@example.com\"\
    ,\n  // ... other fields\n}\n```"
  merge: -1
  img_proc: true
- pgno: 88
  md: "Let’s go over this example to understand how the schema versioning pattern\
    \ has been applied here:\n\n+   - **Version identification:** The schemaVersion\
    \ field explicitly indicates which version each document conforms to, enabling\
    \ application-level logic to handle variations in the schema during queries, updates,\
    \ or reads.\n+   - **Schema evolution:** In the example, the two documents are\
    \ associated with different schema versions. For version 3, the name is stored\
    \ in two fields (first and last), while in version 2, the name is stored as a\
    \ single fullName field.\n\nThis pattern allows your application to handle documents\
    \ with different schema versions gracefully. It may not be necessary to use a\
    \ schemaVersion field unless it’s needed for schema validation or parts of the\
    \ application cannot make due with just using the absence of a field as an indication\
    \ of the schema version.\n\n# Polymorphic pattern\n\nThe polymorphic pattern stores\
    \ similar but not identical entities in the same collection for flexible querying.\n\
    \nThe following example includes documents from the Socialite database that contain\
    \ activity feed data, including post, following, and group join activity:\n\n\
    ```\n// Post activity\n{\n  _id: ObjectId(\"5f4e5b6d3c1e2a1b3c4d5e6f\"),\n  activityType:\
    \ \"post\",\n  userId: ObjectId(\"5f4e5b6d3c1e2a1b3c4d5e7a\"),\n  timestamp: ISODate(\"\
    2023-04-10T15:30:00Z\"),\n  content: \"Just posted a new photo!\",\n  mediaUrl:\
    \ \"https://socialite.com/images/photo123.jpg\"\n}\n\n// Follow activity\n{\n\
    \  _id: ObjectId(\"5f4e5b6d3c1e2a1b3c4d5e7b\"),\n  activityType: \"follow\",\n\
    \  userId: ObjectId(\"5f4e5b6d3c1e2a1b3c4d5e7a\"),\n  timestamp: ISODate(\"2023-04-10T16:45:00Z\"\
    ),\n  targetUserId: ObjectId(\"5f4e5b6d3c1e2a1b3c4d5e8c\"),\n  targetUsername:\
    \ \"alex_wong\"\n}\n```"
  merge: -1
  img_proc: true
- pgno: 89
  md: "```\n// Group join activity\n{\n  _id: ObjectId(\"5f4e5b6d3c1e2a1b3c4d5e8d\"\
    ),\n  activityType: \"group_join\",\n  userId: ObjectId(\"5f4e5b6d3c1e2a1b3c4d5e7a\"\
    ),\n  timestamp: ISODate(\"2023-04-10T17:15:00Z\"),\n  groupId: ObjectId(\"5f4e5b6d3c1e2a1b3c4d5e9e\"\
    ),\n  groupName: \"Photography Enthusiasts\"\n}\n```\n\nLet’s go over this example\
    \ to understand how the polymorphic pattern has been applied here:\n\n+   - **Shared\
    \ collection:** All activities are stored in the same collection. Each document\
    \ represents a distinct activity type but shares common fields such as `_id`,\
    \ `activityType`, `userId`, `timestamp`, and additional fields specific to the\
    \ activity.\n+   - **Type-specific fields:** The `activityType` field specifies\
    \ the type of activity (`post`, `follow`, or `group_join`). Based on this value,\
    \ type-specific fields are included in each document. For example, a post activity\
    \ includes `content` and `mediaUrl`.\n\nNow, instead of maintaining separate collections\
    \ for each type of activity, queries can target the single collection using `activityType`\
    \ as a filter.\n\nThis pattern allows for efficient querying across different\
    \ types of activities while maintaining type-specific fields.\n\n# Archive pattern\
    \ for storage optimization\n\nIn this section, we’ll look at the archive patterns\
    \ which is beneficial for storage optimization. This pattern helps reduce active\
    \ storage costs by moving infrequently accessed or historical data to a separate\
    \ collection or database optimized for long-term storage.\n\nTo apply the archive\
    \ pattern, you move old or infrequently accessed data to separate collections\
    \ to improve the performance of the main collection.\n\nThe following example\
    \ includes message documents from two collections: one for active messages that\
    \ are recent and frequently accessed, and another for long-term storage of old\
    \ message documents:"
  merge: -1
