- pgno: 118
  md: 'Everything in the pipeline uses specific syntax to perform its magic:


    +   - **Stages** define what kind of transformation happens, such as the `$match`
    stage for filtering documents, `$group` for grouping or aggregating them, `$set`
    for adding new fields or changing existing field values, and `$sort` for changing
    the order of documents in the flow. MongoDB offers many such stages, each serving
    a specific purpose. You can explore the full list at https://www.mongodb.com/docs/manual/reference/operator/aggregation-pipeline/.

    +   - **Aggregation expressions** such as `$eq`, `$gt`, `$in`, and `$convert`
    are used to evaluate, compute, and assign new values.

    +   - **Path expressions** give you a way to use existing values in current fields.

    +   - **Accumulator expressions** such as `$sum`, `$avg`, `$push`, `$min`, and
    `$max` are used within grouping stages to perform aggregations on grouped data.


    Expressions in the aggregation framework use JSON-like syntax. You''ll see lots
    of dollar signs ($); they indicate operators, expressions, or field paths. Expressions
    can be nested, allowing for powerful and flexible computations. For example, you
    might use `$add` to sum two fields, `$cond` or `$switch` to implement conditional
    logic, or a wide range of built-in operators for arithmetic, string manipulation,
    date handling, and logical operations.


    You can refer to fields within your documents using field path notation (simple
    fields with "$fieldName", nested fields with "$object.nestedField"). The framework
    also supports several types of variables, including system variables such as `$$ROOT`
    to reference the entire document or `$$NOW` to get the current time, and allows
    you to set your own variables for readability.


    # Performance considerations


    While the aggregation framework is powerful, it’s not magic. A lot of performance
    depends on how you build your pipelines. A well-designed pipeline can be incredibly
    fast, while a poorly designed one can bring your database to its knees. The key
    is to think about how data flows through your pipeline and how each stage will
    impact performance.'
  merge: -1
  img_proc: true
- pgno: 119
  md: 'For example, filtering documents early with $match can dramatically reduce
    the amount of data that subsequent stages need to process. Using indexes effectively
    is also crucial. Just like with regular queries, a pipeline that can use an index
    to quickly find the documents it needs will be far more performant than one that
    has to scan the entire collection.


    As we’ll see in the next section, MongoDB’s query optimizer does a lot to improve
    performance automatically, but understanding the principles behind these optimizations
    will help you write better pipelines.


    # Aggregation pipeline flow


    After parsing the pipeline, MongoDB’s query optimizer analyzes it and tries to
    make it as efficient as possible. It may reorder stages to improve performance
    (making sure it won’t change the results), combine compatible operations, push
    filters closer to the data to use available indexes effectively, and create an
    optimal execution plan based on your pipeline structure. It also analyzes which
    fields from original documents your pipeline is using to limit the amount of data
    it brings into the pipeline from the collection.


    Under the hood, MongoDB sends batches of documents through the pipeline in a streaming
    fashion. Each stage receives a batch of documents from the previous stage, applies
    its transformation, and passes the results to the next stage. This design minimizes
    memory usage and allows for efficient processing of large datasets.


    However, not every stage can pass each batch to the next stage because some stages
    need to see all the input coming to it, before any of it can be passed on. Think
    of $sort, which doesn’t know what the highest or lowest value is until it’s seen
    the last document, or $group, which cannot know each grouping is complete till
    it has seen every document. You’ll hear those stages referred to as blocking stages,
    as opposed to streaming stages. Streaming stages can keep each batch of documents
    streaming when their own work is done, but blocking stages must receive all the
    documents before any documents can be passed on to the next stage.'
  merge: -1
