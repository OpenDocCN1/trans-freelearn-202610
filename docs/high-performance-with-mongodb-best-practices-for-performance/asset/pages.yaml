    Performance Advisor are invaluable in identifying missing indexes, even for infrequent
    query patterns. It provides actionable recommendations to enhance efficiency and
    resolve bottlenecks.


    # Addressing hardware resource constraints


    Hardware resource constraints represent a critical challenge in maintaining optimal
    MongoDB performance. Even with well-optimized queries and thoughtfully designed
    schemas, the underlying hardware ultimately dictates how efficiently your database
    can handle workloads. Resource constraints arise when the computational, memory,
    network, or storage capacity of your deployment is insufficient to support the
    demands placed on it, leading to cascading performance issues. Imagine a production
    line where machines are running at their maximum capacity. Any increase in demand
    or inefficiency pushes systems past their limits, resulting in bottlenecks and
    delays. Similarly, resource constraints in MongoDB can significantly impair your
    application’s responsiveness and scalability.


    These constraints typically surface in four primary areas: CPU, memory, disk I/O,
    and network. High CPU utilization may limit the processing power available for
    queries, aggregations, and background tasks, forcing operations to queue and delaying
    results. Memory constraints occur when the available RAM is insufficient to store
    the working set, leading to increased reliance on slower disk reads and degraded
    performance. Disk I/O constraints, such as a slow or overloaded storage subsystem,
    can drastically impede operations that require frequent or large data reads and
    writes. Network constraints can significantly impact distributed database operations,
    causing issues such as increased replication lag, slower initial syncs, extended
    backup times, and delayed elections in replica sets, all of which can compromise
    data availability and consistency across your deployment.'
  merge: -1
  img_proc: true
- pgno: 375
  md: 'The impact of resource constraints is often gradual, emerging alongside growing
    data volumes, increasing workloads, or changes in usage patterns. However, the
    problem can also appear suddenly when resources are unevenly distributed across
    a cluster, creating hotspots or imbalances that exacerbate performance bottlenecks.
    Recognizing and addressing these hardware limitations is essential for ensuring
    MongoDB remains responsive and reliable at scale. Understanding how CPU, memory,
    and storage interact with MongoDB workloads allows teams to proactively mitigate
    constraints and optimize resource allocation across deployments.


    # Case study: Atlas cluster resource optimization


    Continuing from the previous Atlas monitoring cluster example, the team noticed
    that even after addressing the inherently slow operations with indexing improvements,
    resource utilization on shard-0 remained higher than on other shards. This imbalance
    presented a significant problem because it created a performance bottleneck within
    the distributed system. When one shard consistently operates at higher utilization
    levels than others, it effectively becomes the limiting factor for overall cluster
    performance. This not only risks resource exhaustion on the overloaded shard,
    potentially leading to operation failures, but also represents inefficient use
    of the entire cluster’s capacity. Additionally, this imbalance undermines the
    fault tolerance and scalability benefits that sharding is designed to provide,
    as the system becomes disproportionately constrained by a single shard’s performance.


    Looking at the unnormalized process CPU on the primaries of each shard, they observed
    that shard-0 had higher utilization and data size than all other shards, as shown
    in Figure 15.8.


    ![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_375_0.png)


