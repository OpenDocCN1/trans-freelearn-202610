- pgno: 216
  md: "# Callback API\n\nThe Callback API (also known as the Convenient API) simplifies\
    \ transaction management by handling much of the boilerplate code for you. Rather\
    \ than explicitly having to write out all the steps, each driver provides a less\
    \ verbose way of doing the same thing, as well as handling the retries on some\
    \ errors automatically. To get a better idea, let’s take a look at an example:\n\
    \n```\n// Using the Callback API\nawait client.withSession(async (session) =>\
    \ {\n  return await session.withTransaction(async () => {\n    // Perform operations\
    \ within the transaction\n    await collection1.updateOne({ _id: 1 }, { $set:\
    \ { status: \"active\" } }, { session });\n    await collection2.insertOne({ refId:\
    \ 1, details: \"...\" }, { session })\n  });\n});\n```\n\nThis example demonstrates\
    \ MongoDB transactions using the Callback API, which offers several advantages\
    \ over the Core API:\n\n+   - **Simplified session management:** The client.withSession()\
    \ method automatically creates a session and ensures it’s properly closed when\
    \ the operation completes, regardless of success or failure.\n+   - **Automated\
    \ transaction handling:** The session.withTransaction() method manages the entire\
    \ transaction life cycle. It starts the transaction, attempts to commit it when\
    \ your callback completes, and automatically aborts it if an error occurs.\n+\
    \   - **Built-in retry logic:** Unlike the Core API example, the Callback API\
    \ includes automatic retry logic for transient errors, following MongoDB’s recommended\
    \ retry pattern.\n+   - **Cleaner code:** The nested callback structure eliminates\
    \ the need for explicit try/catch/finally blocks, making your code more concise\
    \ and focused on business logic rather than transaction management.\n\nFor most\
    \ applications, the **Callback API is recommended** due to its simplicity and\
    \ built-in retries and error handling. However, the Core API might be preferable\
    \ in situations requiring very specific control over transaction behavior or when\
    \ you need to interleave transaction and non-transaction operations in complex\
    \ ways."
  merge: -1
  img_proc: true
- pgno: 217
  md: "# Read/write concerns and transaction behavior\n\nRead and write concerns control\
    \ the durability and consistency guarantees of your operations, including the\
    \ staleness and durability of the data you read. However, in transactions, read\
    \ and write concerns have some special behaviors.\n\nTransactions in MongoDB employ\
    \ speculative majority read behavior to ensure read-your-own write semantics,\
    \ which means that all or most read concerns behave the same way: they read the\
    \ latest data available in the snapshot, and the successful ability of the transaction\
    \ to commit means that data will be majority committed by the time the transaction\
    \ successfully completes.\n\nA write concern determines the level of acknowledgment\
    \ requested by MongoDB for write operations. We discussed the various options\
    \ in Chapter 5, Replication, but for transactions, the important thing to know\
    \ is that the default write concern, majority, is the only one that makes sense\
    \ to use, and it applies to the transaction as a whole and not to individual writes\
    \ inside a transaction.\n\n> **Transaction-level read and write concerns**\n>\
    \ \n> Read and write concerns are set at the transaction level, not on individual\
    \ operations within the transaction, so you cannot specify a different read or\
    \ write concern for individual operations in a transaction.\n\nTo set a read or\
    \ write concern on a transaction, pass the values to the startTransaction method:\n\
    \n```\n// Example showing proper transaction read/write concern configuration\n\
    session.startTransaction({\n  readConcern: { level: \"snapshot\" },  // Default\n\
    \  writeConcern: { w: \"majority\" }      // Default\n});\n```\n\nAs a general\
    \ rule, it’s best to leave the default values for read and write concerns for\
    \ transactions if you care about their correctness and durability."
  merge: -1
  img_proc: true
- pgno: 218
  md: '# Performance considerations with transactions


    When it comes to MongoDB transactions, performance is an important consideration
    that can make or break your application. While transactions provide powerful consistency
    guarantees, they also introduce overhead that can impact your system’s speed,
    scalability, and resource utilization. In this section, we’ll examine the key
    performance considerations for MongoDB transactions and provide practical advice
    for optimizing your transactional workloads.


    # Replica set versus sharded cluster transactions


    Transactions behave differently and have different performance implications depending
    on whether you’re running on a replica set or a sharded cluster. In replica sets,
    transaction performance is relatively straightforward. All operations in a transaction
    are coordinated by the primary node. The main factors that affect performance
    are the number of documents affected, the size of documents, and the network latency
    between clients and the primary. These elements directly impact how quickly a
    transaction can be executed and committed.


    In sharded clusters, things get more complex. Cross-shard transactions, that is,
    those that touch data on multiple shards, require a distributed transaction coordinator
    and a two-phase commit protocol. This increases overhead and can impact performance
    in several ways:


    +   - **Increased latency:** Each cross-shard operation adds network round-trips
    between the coordinator and the shards

    +   - **Higher resource utilization:** Additional memory and CPU are needed for
    transaction coordination

    +   - **Potential for cascading performance issues:** If one shard becomes slow,
    it can affect transaction performance across the entire cluster


    However, not all sharded transactions are alike. Transactions that only interact
    with documents on one shard are the same as replica set transactions performance-wise.
    Sharded transactions that read from multiple shards but write to only one incur
    a small performance penalty. The most expensive transactions are those that write
    to multiple shards. The more shards involved, the higher the latency.


    In sharded environments, performance can be significantly improved by designing
    for shard locality. This means structuring your data and shard keys so that related
    documents that are frequently updated together in a transaction reside on the
    same shard. This minimizes the need for cross-shard transactions.'
  merge: -1
  img_proc: true
- pgno: 219
  md: 'Additionally, if your application is globally distributed, it’s important to
    account for cross-region transaction latency. To mitigate this, consider distributing
    your collections in such a way that your writes are limited to a single region
    or explore other techniques to balance consistency and performance.


    # WiredTiger cache considerations


    MongoDB’s WiredTiger storage engine uses an in-memory cache to improve performance,
    but transactions interact with this cache in ways that can sometimes cause performance
    issues.


    Transactions rely on cache by creating snapshots of documents they read or modify.
    These snapshots must remain in the cache until the transaction is complete. Long-running
    transactions can prevent cache eviction, leading to memory pressure.


    The most serious issue is when this leads to the TransactionTooLargeForCache error,
    which occurs when a transaction’s operations and snapshots exceed the available
    cache size. This commonly happens in the following instances:


    +   - A transaction touches too many documents

    +   - A transaction includes very large documents

    +   - A transaction runs for too long, preventing cache eviction

    +   - The WiredTiger cache is configured too small for the workload


    To prevent these scenarios, there are a few strategies depending on the situation:


    +   - **Limit transaction size:** Keep the number of documents per transaction
    below 1,000

    +   - **Limit transaction duration:** Commit or abort transactions within 60 seconds
    (the default limit)

    +   - **Configure appropriate cache size:** Ensure the WiredTiger cache is set
    to at least 50% of RAM for transaction-heavy workloads

    +   - **Monitor cache pressure:** Watch for an increase in metrics such as `wiredTigerCacheSizeBytes`
    and `wiredTigerCacheMaxBytes`


    Ensuring good transaction performance requires using best practices, diligent
    monitoring, and minimizing transaction use when it’s not necessary.'
  merge: -1
  img_proc: true
- pgno: 220
  md: '# Managing transaction runtime limits and errors


    MongoDB enforces a default 60-second transaction runtime limit to prevent long-running
    transactions from impacting cluster health. This limit exists for several important
    reasons: extended transactions can lock documents for long periods, preventing
    other operations from accessing needed data and creating bottlenecks in your application;
    they increase memory pressure on your servers, potentially affecting overall database
    performance; they prevent the WiredTiger cache from evicting data from the cache,
    which can lead to memory exhaustion and degraded performance; and they significantly
    increase the likelihood of operation conflicts and aborts, forcing your application
    to handle more error cases.


    Given these constraints, effectively managing transaction duration becomes critical
    for application reliability. You can monitor transaction duration by tracking
    how long your transactions typically run and setting alerts for those approaching
    the limit, giving you time to optimize before failures occur. While it’s possible
    to configure the limit by adjusting the transactionLifetimeLimitSeconds server
    parameter, increasing it should be considered a last resort since it doesn’t address
    the underlying performance issues and may worsen the overall system health.


    A more sustainable approach is to optimize transactions to complete more quickly.
    This can be accomplished by splitting large transactions into smaller, more manageable
    ones that process fewer documents at once; ensuring indexes are in place for all
    query predicates to speed up document selection; optimizing any queries and aggregation
    pipelines used within the transaction to reduce processing time; avoiding unnecessary
    operations within the transaction scope; and performing read-only operations outside
    the transaction when possible, when they don’t require the ACID guarantees that
    transactions provide.


    Beyond the time limit challenge, distributed systems such as MongoDB inevitably
    experience transient errors that require proper handling for robust applications.
    MongoDB helps developers identify these situations through specific error labels
    that suggest appropriate recovery strategies. When you encounter a TransientTransactionError,
    it indicates a temporary issue, such as network glitches, primary elections, or
    momentary resource constraints, that could succeed if retried. For these cases,
    implementing a full transaction retry with exponential backoff allows your application
    to recover gracefully while preventing overloading the system during instability.


    Similarly, an UnknownTransactionCommitResult error indicates uncertainty about
    whether a commit succeeded, typically caused by network issues during commit acknowledgment.
    The proper response here differs slightly: you should retry only the commit operation
    rather than the entire transaction, as the transaction work itself has already
    been performed and only the final confirmation is in question.'
  merge: -1
  img_proc: true
- pgno: 221
  md: 'Importantly, monitoring retry rates provides valuable insight into your system’s
    health. A sudden increase in retries often indicates an underlying performance
    problem, such as network instability, resource constraints, or configuration issues,
    that requires investigation. By connecting your retry monitoring with your overall
    performance metrics, you can identify and address problems before they significantly
    impact your application’s reliability.


    # Lock acquisition and contention management


    MongoDB uses a multi-granular locking system for transactions. Understanding lock
    behavior is crucial for optimizing transaction performance. MongoDB’s locking
    mechanism operates at multiple levels of granularity, from database-wide to individual
    document locks, creating a hierarchical system that balances data consistency
    with operational throughput.


    Lock contention typically emerges when multiple transactions compete to modify
    the same document, during administrative operations such as index or collection
    creation, or under high-volume write workloads concentrated on a small subset
    of documents. Effective mitigation requires a multi-faceted approach focused on
    reducing both the likelihood and duration of lock conflicts.


    Keeping transactions small and focused serves as the foundation for minimizing
    lock duration, allowing other operations to proceed more quickly. Rather than
    concentrating writes on specific documents, distributing this activity helps prevent
    the formation of hotspots that become bottlenecks. Administrative tasks should
    be scheduled during periods of lower activity to avoid competing with regular
    application workloads.


    Proper indexing plays a crucial role in operational efficiency by reducing execution
    time for operations and therefore minimizing the time they spend holding locks.
    Regular monitoring through db.serverStatus().locks provides valuable insights
    into lock wait times, enabling proactive identification of emerging issues before
    they impact application performance.


    Recognition of lock contention problems typically manifests through several key
    indicators: transaction abort rates and the number of retries begin climbing as
    operations fail to complete successfully the first time, operation queues grow
    longer as requests wait for resource availability, lock wait times increase measurably,
    and clients experience timeouts as operations exceed acceptable response thresholds.
    By understanding these patterns and implementing appropriate preventive measures,
    database administrators can maintain optimal performance even under demanding
    workloads.'
  merge: -1
  img_proc: true
- pgno: 222
  md: '# Optimizing transaction size and duration


    The most effective way to ensure good transaction performance is to keep transactions
    small and short-lived. In this section, we’ll focus on how to optimize your transaction
    footprint by limiting the transaction size and minimizing the transaction duration.


    First, try limiting the size of your transaction. When possible, limit it to fewer
    than 1,000 modified documents per transaction. Next, there are a few important
    strategies for minimizing transaction duration:


    +   - **Prepare data before the transaction:** Perform expensive calculations
    outside the transaction

    +   - **Use efficient queries:** Ensure all operations within transactions use
    indexes

    +   - **Batch related changes:** Group multiple writes into a single batch operation
    when possible

    +   - **Split large operations:** Break up very large operations into smaller,
    more manageable transactions


    By applying these optimization strategies, you can significantly improve the performance
    of your transactional workloads in MongoDB.


    # Common transaction anti-patterns and their performance costs


    Even with the best intentions, it’s easy to fall into common traps when using
    transactions in MongoDB. Understanding how not to use transactions is just as
    crucial as knowing when to use them. In this section, we’ll explore the most frequent
    anti-patterns, explain why they hurt performance, and provide practical guidance
    on how to avoid them, so you can keep your database humming and your ops team
    happy.


    # Long-running transactions and their impact on system performance


    When designing transactions for MongoDB, performance should be a primary consideration.
    Efficient transactions ensure your database remains responsive, maintains high
    throughput, and provides a good experience for users. Poor transaction design,
    particularly when operations run for too long, can put excessive pressure on system
    resources, increase the risk of conflicts, and ultimately lead to failures.'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'Long-running transactions are like that visitor who overstays their welcome;
    they tie up resources, block other operations, and can cause significant performance
    issues. Some examples of overly long transactions are as follows:


    +   - A transaction that attempts to insert or update thousands or millions of
    documents in a single operation

    +   - Operations that include external API calls, complex computations, or end
    user interactions causing the transaction to remain open for many seconds or minutes

    +   - Batch-processing jobs that wrap an entire day’s worth of data imports within
    a single transaction


    With long-running transactions come several performance costs. These include the
    following:


    +   - **Increased lock contention:** Locks are held for the duration of the transaction,
    blocking other operations from accessing the locked documents and significantly
    reducing concurrency and throughput.

    +   - **WiredTiger cache pressure:** The storage engine must keep all pre-images
    and post-images of modified data in the cache until the transaction completes.
    Large transactions can consume substantial cache, forcing frequent evictions of
    other useful data.

    +   - **Risk of TransactionTooLargeForCache errors:** If the modifications exceed
    a certain threshold of the WiredTiger cache, the transaction will fail completely.

    +   - **Exceeding transactionLifetimeLimitSeconds:** MongoDB’s default 60-second
    transaction limit exists for good reason. Long-running transactions risk getting
    automatically aborted, leading to wasted work and retry storms.

    +   - **Replication lag:** Large transactions can generate a burst of oplog entries
    upon commit, potentially causing secondaries to fall behind.


    The key takeaway is this: break down large operations into smaller, more manageable
    transactions. Keep transactions short and sweet, ideally completing in milliseconds
    rather than seconds. This approach helps maintain system performance, reduces
    resource contention, and decreases the likelihood of transaction failures.


    # Unnecessary use of transactions where single-document atomicity would suffice


    Developers new to MongoDB can fall into the trap of overusing transactions, bringing
    habits from relational databases that aren’t always necessary into the document
    model. Let’s examine some common scenarios where transactions are misapplied:'
  merge: -1
