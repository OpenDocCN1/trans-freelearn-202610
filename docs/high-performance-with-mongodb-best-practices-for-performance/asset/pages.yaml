    # Considerations for external tools


    When integrating MongoDB with external monitoring systems, several important factors
    should be considered to ensure effective and secure monitoring. Securing access
    to your MongoDB instances and the data flowing to monitoring systems is paramount.
    This involves implementing robust authentication mechanisms, encrypting data in
    transit, and adhering to the principle of least privilege for monitoring users.
    Careful attention to these security aspects will help protect your data and maintain
    the integrity of your monitoring setup.


    Key security practices include the following:


    +   - **Dedicated monitoring users**: Create MongoDB users specifically for monitoring
    tools with minimum required privileges (typically the clusterMonitor role)

    +   - **Strong authentication**: Use strong passwords and consider certificate-based
    authentication, where supported

    +   - **TLS/SSL**: Encrypt communication between monitoring tools and MongoDB

    +   - **Network security**: Restrict monitoring tool access to MongoDB through
    appropriate firewall rules


    Beyond security, another critical aspect of integrating external monitoring tools
    is managing their resource consumption. Monitoring systems, by their nature, interact
    with your MongoDB deployment to collect data. This interaction, if not carefully
    configured, can impose an additional load on your database servers, potentially
    impacting their performance. Therefore, it’s essential to be mindful of how these
    tools consume resources to ensure that the act of monitoring doesn’t degrade the
    performance of the system you’re trying to observe.


    Key considerations for managing resource consumption include the following:


    +   - **Scraping/polling frequency**: Configure appropriate intervals for metric
    collection (typically 10–60 seconds) to balance between timely data and minimizing
    overhead

    +   - **Resource overhead**: Monitor the resource consumption of the monitoring
    agents themselves to ensure they don’t impact MongoDB performance'
  merge: -1
  img_proc: true
- pgno: 352
  md: '+   - **Payload size:** Be aware of the volume of data being collected, especially
    from commands such as serverStatus that return large documents

    +   - **Benchmark in staging:** Test monitoring configurations in non-production
    environments before deploying to production


    In summary, integrating external monitoring tools with MongoDB requires a balanced
    approach, prioritizing both security and performance. By securing access and carefully
    managing resource usage, you can ensure reliable monitoring without compromising
    your deployment’s stability or integrity.


    # Common performance patterns and what to monitor


    Understanding common performance bottlenecks in MongoDB and knowing which metrics
    signal their presence is crucial for proactive performance management. By monitoring
    key indicators, you can detect and diagnose issues before they significantly impact
    your application’s responsiveness and reliability. This section explores recurring
    performance challenges and the essential signals to track.


    # Disk I/O bottlenecks


    The storage subsystem is frequently a limiting factor for database performance,
    especially under heavy read or write workloads. When the disk cannot keep up with
    the demand from MongoDB, operations will slow down as they wait for data to be
    read from or written to disk.


    To identify and diagnose disk I/O bottlenecks, it’s instrumental to monitor several
    key indicators:


    +   - **Disk latency:** Measure the time it takes for read and write operations
    to complete at the disk level. Consistently high latency (typically above a few
    milliseconds, depending on the storage medium) is a primary indicator of an I/O
    bottleneck. This is often monitored via OS-level tools or cloud provider metrics,
    and Atlas surfaces disk latency in its metrics views.

    +   - **I/O queue depth:** Track the number of pending I/O operations waiting
    to be serviced by the disk. A persistently high queue depth signifies that the
    storage system is saturated.

    +   - **Disk throughput (bytes/sec) and IOPS:** Monitor the actual data transfer
    rate and the number of I/O operations per second. Compare these against the provisioned
    limits of your storage hardware. Reaching these limits confirms an I/O bottleneck.'
  merge: -1
  img_proc: true
- pgno: 353
  md: 'Addressing disk I/O bottlenecks may involve optimizing queries to reduce disk
    access, improving indexing, increasing provisioned IOPS/throughput, upgrading
    storage hardware, or ensuring the working set fits in RAM to minimize disk reads.


    # Cache pressure (WiredTiger cache utilization)


    MongoDB’s WiredTiger storage engine uses an internal cache to hold frequently
    accessed data and indexes in memory, minimizing the need for slower disk access.
    Cache pressure occurs when the active working set (the data and indexes required
    by the current workload) exceeds the size of the configured WiredTiger cache.
    This leads to increased cache eviction activity and page faults, degrading performance.


    Several key metrics can help you detect and diagnose WiredTiger cache pressure
    in MongoDB. Monitoring these indicators gives you early warning signs of performance
    bottlenecks caused by memory constraints:


    +   - **Cache utilization:** Track the amount of the WiredTiger cache currently
    in use (serverStatus().wiredTiger.cache["bytes currently in the cache"]). While
    high utilization is generally good, consistently hitting the maximum limit indicates
    pressure.

    +   - **Cache eviction rate:** Monitor the rate at which pages are being evicted
    from the cache to make room for new data (serverStatus().wiredTiger.cache["unmodified
    pages evicted"]). A high or rapidly increasing eviction rate suggests the cache
    is churning frequently. Atlas often visualizes cache activity, highlighting evictions.

    +   - **Pages read into cache:** Track the rate at which data is being read from
    disk into the cache (serverStatus().wiredTiger.cache["pages read into cache"]).
    High rates often correlate with high eviction rates and indicate that the required
    data is frequently not found in memory.

    +   - **Page faults:** While not solely tied to the WiredTiger cache (OS page
    faults can also occur), frequent page faults ( serverStatus().extra_info.page_faults
    or OS metrics) often accompany cache pressure, indicating that MongoDB processes
    are requesting data not currently in physical RAM.


    Monitoring these metrics provides a clear picture of cache health. High utilization
    isn’t inherently bad, but when combined with high eviction rates, increased page
    reads from disk, and page faults, it signals that the cache is struggling to keep
    up with the workload, forcing frequent reads from slower disk storage.'
  merge: -1
  img_proc: true
- pgno: 354
  md: 'The following db.serverStatus() command can be used in the MongoDB Shell to
    retrieve some of these key cache metrics:


    ```

    // Run from the MongoDB shell

    // Check WiredTiger cache usage and eviction metrics

    const wtCache = db.serverStatus().wiredTiger.cache;

    const bytesInCache = wtCache["bytes currently in the cache"];

    const maxBytes = wtCache["maximum bytes configured"];

    const evictedPages = wtCache["unmodified pages evicted"];


    print(`Cache utilization: ${(bytesInCache/maxBytes*100).toFixed(2)}%`);

    print(`Evicted pages: ${evictedPages}`);

    ```


    Resolving cache saturation typically involves increasing the available RAM and
    the configured WiredTiger cache size, optimizing queries and indexes to reduce
    the working set size, or scaling the cluster horizontally.


    # Replication lag and oplog window drift


    Replication lag is a common metric you may want to monitor, as excessive lag can
    impact read consistency (if reading from secondaries), increase failover time,
    and put data durability at risk.


    Replica set health can be tracked by monitoring the following key metrics:


    +   - **Replication lag**: Monitor the lag in seconds for each secondary node.
    This is an important metric available in the rs.status() output and prominently
    displayed in the Atlas UI. Alerts should be configured for lag exceeding acceptable
    thresholds.

    +   - **Oplog window**: Track the estimated time window covered by the oplog (rs.printReplicationInfo()
    or Atlas metrics). A shrinking oplog window increases the risk of secondaries
    needing to resync if they fall behind.

    +   - **Oplog rate (GB/hour)**: Monitor the rate at which the oplog is being generated
    on the primary. High rates can contribute to replication lag if secondaries cannot
    apply writes fast enough or if the network bandwidth is insufficient. Atlas provides
    metrics for oplog throughput.


    Collectively, these metrics provide a comprehensive view of replication health.
    Monitoring lag ensures data consistency and readiness for failover, tracking the
    oplog window helps prevent costly full resynchronizations of secondaries, and
    observing the oplog generation rate can highlight whether the primary’s write
    load is outpacing the replication capacity.'
  merge: -1
  img_proc: true
- pgno: 355
  md: "You can use the following commands in the MongoDB Shell to retrieve the current\
    \ replication status and oplog information:\n\n```\n// Run from the MongoDB shell\n\
    // Check replication lag on all secondary nodes\nconst rsStatus = rs.status();\n\
    const primary = rsStatus.members.find(m => m.state === 1);\nrsStatus.members.forEach(member\
    \ => {\n    if (member.state === 2) { // secondary\n        const lagSeconds =\
    \ Math.abs((primary.optimeDate.getTime() - member.optimeDate.getTime()) / 1000);\n\
    \        print(`Secondary ${member.name} lag: ${lagSeconds.toFixed(2)}s`);\n \
    \   }\n});\n\n// Check oplog window size\nconst oplogInfo = db.getReplicationInfo();\n\
    print(`Oplog window: ${oplogInfo.timeDiff / 3600}h`);\n```\n\nThis script utilizes\
    \ several key commands and concepts. rs.status() fetches a detailed document for\
    \ each replica set member, including state and optimeDate (the timestamp of the\
    \ last applied operation). The script then compares the optimeDate value of the\
    \ primary with that of each secondary to calculate replication lag in seconds.\
    \ db.getReplicationInfo() is used to retrieve information about oplog, specifically\
    \ timeDiff, which indicates the oplog window duration. Finally, the script prints\
    \ the calculated lag for each secondary and the oplog window in hours, providing\
    \ a clear snapshot of replication health.\n\nExecuting this script might produce\
    \ output similar to the following:\n\n```\nSecondary mongo-secondary-0.example.com:27017\
    \ lag: 2.35s\nSecondary mongo-secondary-1.example.com:27017 lag: 1.80s\nOplog\
    \ window: 48.25h\n```\n\nThis output allows administrators to quickly assess whether\
    \ secondaries are keeping up with the primary and whether the oplog window is\
    \ sufficient for the operational needs.\n\nCauses of replication lag include high\
    \ write volume on the primary, insufficient resources (CPU, RAM, or I/O) on secondaries,\
    \ network latency between nodes, or long-running operations on secondaries blocking\
    \ replication."
  merge: -1
  img_proc: true
