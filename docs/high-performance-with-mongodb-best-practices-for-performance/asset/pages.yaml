    should be used by the application or users. If these changes are applied separately
    and one update fails, it could lead to conflicting data, such as multiple active
    versions or none at all, causing errors or inconsistent behavior. Multi-document
    transactions allow both updates to be made atomically, maintaining a clear and
    reliable version state.


    However, not every multi-step process needs a transaction. MongoDB’s document
    model was designed from the ground up with performance in mind, and this is most
    evident when we compare single-document operations to multi-document transactions.
    The performance gap between the two exists because transactions require additional
    locking to ensure isolation, maintaining snapshots of data, coordination across
    multiple servers (in sharded clusters), and a two-phase commit protocol (in sharded
    clusters).


    **When performance matters, follow this rule:** If you can design your data model
    to keep related data in a single document, you’ll almost always get better performance
    than using multi-document transactions. Therefore, consider avoiding multi-document
    transactions in the following instances:


    +   - **Related data can be modeled within a single document:** If all the information
    that needs to be updated atomically fits within a single document, it’s more efficient
    to leverage MongoDB’s built-in single-document atomicity. This approach reduces
    the complexity and overhead associated with multi-document transactions, resulting
    in better performance and simpler error handling. Using single-document atomicity
    also avoids the additional locking and coordination costs that come with transactions
    spanning multiple documents or collections.'
