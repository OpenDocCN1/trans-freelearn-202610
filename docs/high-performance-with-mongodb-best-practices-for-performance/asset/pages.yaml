- pgno: 175
  md: '# 7


    # Storage Engines


    As we saw in Chapter 1, Systems and MongoDB Architecture, WiredTiger is a component
    within the MongoDB server and the most common storage engine for MongoDB. Storage
    engines act as the interface between the logical structure of the data (as seen
    by users, applications, and higher layers of the database) and the physical storage
    of that data. As such, they are a critical factor when diagnosing and resolving
    performance issues. This chapter aims to equip you with a high-level understanding
    of the WiredTiger storage engine, enabling you to make informed decisions about
    its configuration. By the end of this chapter, you will have a solid grasp of
    WiredTiger’s performance-related inner workings and the knowledge to fine-tune
    it for efficiency.


    The topics covered in this chapter include the following:


    +   - An overview of storage engines and their role in MongoDB

    +   - The architecture of WiredTiger, including its storage format, concurrency
    control, and caching strategies

    +   - How WiredTiger manages its cache, ensures data durability, and handles recovery
    from unexpected failures

    +   - The compression algorithms supported by WiredTiger, and the trade-offs between
    compression efficiency and resource usage

    +   - Key configuration options for WiredTiger and how to tune them for your specific
    workload and hardware setup'
  merge: -1
  img_proc: true
- pgno: 176
  md: '# Exploring storage engines


    Different storage engines employ various data structures, algorithms, and techniques
    to optimize performance, scalability, reliability, and other characteristics of
    the database system.


    Some common types of storage engines include the following:


    +   - **Row-oriented storage engine**: These engines store data in rows, where
    each row represents a record and contains multiple columns or fields.

    +   - **Column-oriented storage engine**: These engines store data in columns,
    where each column represents a field and contains values from multiple rows.

    +   - **Key-value storage engine**: These engines store data as collections of
    key-value pairs, where each unique key is associated with a single corresponding
    value. The application can access a value using its key. For example, a key could
    be a string or a user ID, and the value could be a complex nested data structure.


    WiredTiger is a key-value storage engine that can be configured to store data
    in rows or columns. Other popular examples of database storage engines are InnoDB,
    MyISAM, and RocksDB. The choice of storage engine can significantly impact the
    performance, scalability, and functionality of a database system. Different storage
    engines are optimized for different workloads and use cases, and may offer trade-offs
    between various factors, such as read/write performance, data compression, transaction
    support, and data consistency.


    For example, InnoDB is currently the default storage engine for MySQL. It provides
    features such as transactions, row-level locking, and foreign key support. MyISAM,
    an older storage engine, is known for its simplicity and speed for read-heavy
    operations, but it does not support transactions or row-level locking.


    In theory, WiredTiger could be used as a storage engine for other databases, and
    MongoDB could use other storage engines. MongoDB has defined a storage engine
    API that enables developers to implement adapters for other storage engines. For
    example, MongoRocks is a RocksDB storage engine module for MongoDB.


    A specific database might only use a subset of a storage engine’s features and
    allow users to configure a subset of its configuration parameters. For example,
    at the time of writing, MongoDB doesn’t use features such as WiredTiger’s column
    storage or data structures such as log-structured merge trees. This is because
    MongoDB doesn’t currently implement features that use these capabilities, but
    it may do so in the future. The MongoDB server configuration options support a
    subset of the WiredTiger configuration options.'
  merge: -1
  img_proc: true
- pgno: 177
  md: '# Overview of WiredTiger


    WiredTiger is the default and most commonly used storage engine for MongoDB. It
    has been available since MongoDB version 3.0. Before that, the default storage
    engine for MongoDB was MMAPv1, which used memory-mapped files to manage data.
    While MMAPv1 was functional, it had some limitations.


    The fundamental data structure underlying WiredTiger is the B-tree, which maintains
    sorted data and allows search, sequential access, insertions, and deletions in
    logarithmic time. Each node in a B-tree can contain multiple keys (data entries),
    where the number of keys a node can hold is determined by the degree or order
    of the tree. Searching for a key in a B-tree involves navigating from the root
    to a leaf, following the pointers that represent ranges of keys. This is efficient
    because the height of the tree is logarithmic relative to the number of keys.
    When compared to binary search trees, B-trees are shallower because they allow
    more than two children per node. This reduces the number of disk accesses required
    when walking the tree, which is crucial for databases where I/O operations are
    expensive.


    ![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_177_0.png)


    *Figure 7.1: The WiredTiger B-tree*


    Each node of the B-tree contains keys and values. Leaf nodes store actual data,
    while internal nodes guide the search process through the tree. The fundamental
    building block of WiredTiger is the key-value pair. Multiple key-value pairs can
    be combined into pages, and every piece of data is associated with a unique key,
    enabling efficient retrieval and updates. The internal keys are called record
    IDs.'
  merge: -1
  img_proc: true
- pgno: 178
  md: '![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_178_0.png)


    # Pages in the Linux kernel versus WiredTiger storage engine


    The concept of pages exists in both the Linux kernel and the WiredTiger storage
    engine. While the term *page* is used in both, it represents distinct concepts
    in each. A page in the Linux kernel is the fundamental unit of memory management.


    For example, when trying to retrieve a document with a specific indexed field,
    such as _id, first an index B-tree is searched using the _id key to get the record
    ID value. Then, this record ID is used as the key to search the collection and
    return the value, which corresponds to a MongoDB document.


    WiredTiger employs **multiversion concurrency control (MVCC)** to manage concurrent
    access to data in B-trees and pages. This allows multiple readers and writers
    to operate simultaneously, offering more concurrency than simpler schemes.


    Data is persistently stored in files that contain the B-tree structures along
    with metadata. These files can grow dynamically as needed. On disk, you''ll find
    a separate file for each index and MongoDB collection.


    Another set of WiredTiger files is used to store the **journal**, which is often
    called the **write-ahead log (WAL)** in other database systems. Every operation
    that modifies the database is first written to the journal to ensure the durability
    of writes, should the server crash or lose power.


    When a collection or index is first accessed, the root and first layer of internal
    nodes are loaded into a cache. As read and write operations occur, the in-memory
    cache is populated with pages on demand. By default, the WiredTiger cache uses
    50% of the available memory minus 1 GB. For example, on a system with a total
    of 8 GB of RAM, the WiredTiger cache would use 3.5 GB of RAM (0.5 * (8 GB - 1
    GB) = 3.5 GB).


    The current implementation does not allow explicit pinning of documents or collections
    in the cache. The cache is shared across all databases and collections in a MongoDB
    server. WiredTiger periodically creates consistent checkpoints that capture a
    persistent snapshot of the database at a specific point in time.


    WiredTiger supports fully ACID transactions, ensuring data consistency and integrity
    even in the face of failures. The following sections will tie all these concepts
    together by describing lookup, update, and insert operations.'
  merge: -1
  img_proc: true
- pgno: 179
  md: '# A lookup operation


    When an application runs a query on the database, it is translated into one or
    more storage engine lookup operations, each of which does the following:


    +   1. Assuming we’re reading a document identified by an indexed field, WiredTiger
    walks the index B-tree from root to the leaf containing the key.

    +   2. If any pages are not in cache, they are loaded from storage into both the
    operating system filesystem cache and the WiredTiger cache. Eventually, WiredTiger
    finds the record ID corresponding to the indexed field.

    +   3. The record ID from the previous step is used to walk the collection’s B-tree.

    +   4. If any pages are not in cache, they are loaded from storage both into the
    operating system filesystem cache and the WiredTiger cache, where they are decrypted
    and uncompressed.

    +   5. When WiredTiger finds the record ID, it returns the document from the page.


    This operation ensures pages are used from memory if they are in the cache and
    avoids unnecessary storage I/O.


    # An update operation


    When the application updates a document, the database translates this into an
    update operation on the storage engine. Here’s what typically happens:


    +   1. The document is read into cache as described in the previous section.

    +   2. The page is marked as dirty, and the new values of the document are stored
    in an update list in memory.

    +   3. If the write is part of a transaction, it waits until the transaction is
    committed.

    +   4. An entry is written to the WiredTiger log that contains enough information
    to redo the operation should a crash occur. This log write is flushed to the storage
    device.

    +   5. Later, when either a checkpoint runs or the page needs to be evicted from
    cache, WiredTiger walks through the page’s update list and writes the in-memory
    page to storage. Older versions of the document are written to a separate history
    store file.


    This mechanism provides durability, crash recovery, and version tracking, all
    of which are essential for reliable database operations.'
  merge: -1
  img_proc: true
- pgno: 180
  md: '# An insert operation


    For insert operations, WiredTiger performs the following:


    +   1. It traverses the B-tree to find the appropriate leaf node to insert a key
    for the record/document.

    +   2. When writing the node to storage, if it is full, it is split. The split
    operation may cascade back up the tree if the parent node is full.


    Like reads and updates, inserts rely on efficient B-tree traversal and dynamic
    node management to maintain the performance and structural integrity of the data.
    All of the operations on the data involve traversing the B-tree data structures
    of the indexes and the collection data.


    # Eviction, checkpointing, and recovery


    The cache is limited in size, so WiredTiger needs to evict pages from the cache
    when it needs space for newer data. WiredTiger uses background threads to manage
    the eviction process. These threads continuously assess the cache state and perform
    eviction tasks, running alongside other database operations.


    Pages are selected for eviction based on a variation of the least recently used
    algorithm, where the least recently accessed pages are candidates for eviction.
    This means frequently accessed pages should stay in memory/cache longer.


    WiredTiger tracks three types of cache data: total data, dirty data, and updates.
    For each, it has two thresholds to manage eviction from the cache:


    +   - **Target:** When the cache reaches this level, WiredTiger begins eviction
    activities to gradually bring the cache usage back down.

    +   - **Trigger:** If this level is exceeded, WiredTiger enlists database operation
    threads to quickly free up space and prevent the cache from becoming full. This
    reduces the number of threads that can run simultaneous database operations.


    These thresholds are configurable when running MongoDB self-managed. We’ll see
    examples later in the Configuration for improving performance section of this
    chapter. When using Atlas, MongoDB selects these thresholds based on the instance
    size you are running.


    A checkpoint takes all of the in-memory data structures and writes any modifications
    to storage. You can configure how frequently checkpointing occurs. We’ll look
    at an example of this later in the chapter. The rest of the database server continues
    to read and write to pages during the checkpoint process.'
  merge: -1
  img_proc: true
- pgno: 181
  md: 'The checkpoint process involves the following steps:


    +   1. WiredTiger ensures all transactions that have been committed up to that
    point are durably stored in the disk image of the database by writing all the
    dirty pages from the cache.

    +   2. All pending writes to files are flushed.

    +   3. The journal files that contain the transaction logs are rotated.

    +   4. WiredTiger marks the checkpoint end in its logs and metadata. This allows
    safe recovery from this point onward.


    From a performance perspective, if a large volume of data is written between two
    checkpoints, many storage and file operations will take place during the second
    checkpoint. On IOPS- or bandwidth-constrained systems, this can result in periodic
    performance dips.


    Recovery is required if the computer running the MongoDB server crashes or loses
    power without a proper shutdown. When the server restarts, it begins the recovery
    process by first loading the database state from the last completed checkpoint.
    If the previous shutdown was not clean, additional changes stored in the WiredTiger
    log (journal) are replayed on top of the last checkpoint. As a result, the longer
    the interval between checkpoints, the longer the recovery time will be.


    # Compression and encryption


    While compression helps save storage space, it comes at the cost of higher CPU
    usage. If your workload is already constrained by CPU usage on a server running
    MongoDB, you may choose to disable compression in either of the following cases:


    +   - You are not concerned about the size of the files on your storage devices

    +   - The data you are storing is not very compressible


    Alternatively, you can switch to a different compression algorithm to reduce CPU
    usage, although this typically results in larger file sizes due to less effective
    compression. MongoDB currently supports three compression options:


    | Compression algorithm | CPU usage | Compression efficiency | Notes |

    |---|---|---|---|

    | Snappy | Lowest | Lowest | Fastest option with minimal CPU cost; less effective
    compression |

    | zstd | Medium | Better than Snappy | A balanced choice between speed and compression
    ratio |

    | zlib | Highest | Best | Slowest, but offers the highest compression |


    Table 7.1: Compression algorithms and their performance characteristics'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'The main compression option is used to compress both the journal and the collection
    data. Indexes use a form of *prefix compression*. This is effective for data with
    indexed fields that have common initial sequences.


    As mentioned earlier, every workload and dataset is unique, so it’s important
    to run your own experiments to determine the best configuration. For example,
    if you’re using zlib with a highly compressible, large dataset, each storage read
    may expand into more pages inside the WiredTiger cache. This can lead to increased
    evictions and potentially more cache misses when re-reading or updating documents.


    MongoDB Enterprise uses industry-standard algorithms such as **Advanced Encryption
    Standard** (AES) for data-at-rest encryption, specifically AES-256 in **Cipher
    Block Chaining** (CBC) mode configured with PKCS#7 padding. MongoDB Atlas uses
    encryption at rest by default for all data stored within its clusters. This means
    someone with physical access to the storage devices can’t read the data. Modern
    processors have hardware acceleration for these algorithms, which means security
    adds little overhead.


    If you are self-managing your MongoDB deployment and you suspect AES hardware
    acceleration is not being used, you can confirm it by profiling MongoDB and analyzing
    flame graphs.


    # Configuration for improving performance


    This section outlines several configuration options for the WiredTiger storage
    engine that can help improve performance. In general, Atlas does not allow direct
    manipulation of many WiredTiger settings. It automatically manages and optimizes
    these settings based on the instance tiers. Thanks to Atlas’s simplicity and efficiency,
    you can rely on its advanced automation to optimize performance in response to
    demand. If your particular needs aren’t addressed, you can consult MongoDB support
    for guidance tailored to your specific application.


    However, if you’re running a self-managed MongoDB cluster, you can configure and
    experiment with WiredTiger settings. When you start the MongoDB server, default
    values will be selected. As you can imagine, it is impossible for MongoDB to pick
    defaults that are optimal for all datasets and workloads. If you know WiredTiger
    is the current limiting factor for your workload, then here are some experiments
    you can run to diagnose and improve performance.'
  merge: -1
  img_proc: true
- pgno: 183
  md: "# Changing the size of the WiredTiger cache\n\nIf you know your workload is\
    \ I/O bound, you can increase the size of the WiredTiger cache to reduce the amount\
    \ of I/O needed. For example, if you are running MongoDB on a cloud instance,\
    \ you can use the cloud provider’s metrics dashboards to see how much IOPS your\
    \ workload is using. With 4,200 IOPS provisioned, a dataset larger than cache,\
    \ and a workload consisting of 95% read and 5% updates, you might observe steady\
    \ state metrics such as the following:\n\n+   - 3,500 storage read requests per\
    \ second\n+   - 700 storage writes per second (including both journal/log and\
    \ data files)\n+   - 15,000 database read queries per second\n+   - 800 database\
    \ update operations per second\n\nIncreasing the size of the WiredTiger cache\
    \ can reduce the number of I/O operations needed per database operation, so while\
    \ the workload is still limited to 4,200 storage operations per second, more database\
    \ operations can run because they access data in cache rather than reload it from\
    \ storage.\n\nTo adjust the cache size to 20 GB, you can use the following command:\n\
    \n```\ndb.adminCommand({setParameter: 1,\n  wiredTigerEngineRuntimeConfig: 'cache_size=20G'})\n\
    ```\n\nThis command can be used on a running MongoDB instance from the shell.\n\
    \nHowever, there are also situations where reducing the size of the cache can\
    \ improve performance. For example, if you have a read-intensive workload that\
    \ accesses random, compressible documents in a dataset larger than the cache,\
    \ reducing the size of the WiredTiger cache allows more space for the filesystem\
    \ cache, where the data remains compressed. Each random read is more likely to\
    \ miss the WiredTiger cache but hit the filesystem cache, reducing the number\
    \ of I/O operations and increasing the number of database operations per second.\n\
    \nFor example, in some cases, reducing the size of the WiredTiger cache by a factor\
    \ of three can improve database performance, in operations per second, by as much\
    \ as 60%. However, this change also has its downsides, such as reducing the performance\
    \ of an insert workload by nearly 20%."
  merge: -1
  img_proc: true
- pgno: 184
  md: "# Changing syncdelay\n\nReducing syncdelay increases the frequency of checkpointing\
    \ and is beneficial when you need consistent, smaller, and frequent disk write\
    \ operations to avoid performance spikes. It also reduces the recovery time if\
    \ a server crashes and restarts.\n\nIf you have a write-intensive workload and\
    \ you notice periodic performance drops that coincide with spikes in storage operations,\
    \ it could indicate that reducing syncdelay might help.\n\nIn Figure 7.2, we see\
    \ an illustration of this situation. Periodically, during checkpoints (marked\
    \ with C in the diagram), storage I/O operations increase, and the number of database\
    \ operations drops.\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_184_0.png)\n\n\
    *Figure 7.2: Periodic drops in performance during checkpoints*\n\nYou can reduce\
    \ syncdelay (seconds) by changing the value in the configuration file. It defaults\
    \ to 60 seconds. If it is already running, you’ll need to restart the MongoDB\
    \ server after changing the configuration file:\n\n```\n```yaml\nstorage:\n  syncdelay:\
    \ 30\n```\n```\n\nAlternatively, you can set syncdelay with a command-line option:\n\
    \n```\n```bash\nmongod --syncdelay 30\n```\n```\n\nThis should change the performance\
    \ graphs to something similar to Figure 7.3. The performance drops and I/O spikes\
    \ are not as pronounced during checkpoints."
  merge: -1
  img_proc: true
- pgno: 185
  md: '![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_185_0.png)


    *Figure 7.3: Smaller performance drops with more frequent checkpoints*


    On the other hand, increasing syncdelay can be beneficial for write-intensive
    workloads when you want to reduce the total number of disk I/O operations, particularly
    during bulk data processing. For example, in nightly batch workloads that update
    many documents multiple times, fewer I/O operations may be needed if a document
    is updated more than once between checkpoints. This reduces the impact of checkpoints
    on the main workload and may also lower overhead from less frequent transaction
    management and storage flush operations.


    # Changing minSnapshotHistoryWindowInSeconds


    The minSnapshotHistoryWindowInSeconds parameter in MongoDB specifies the minimum
    time window (in seconds) for which the storage engine retains snapshot history.
    A larger window allows you to query the value of a document at a specific point
    in time using the snapshot read concern over a longer period.


    However, maintaining a longer snapshot history, especially for frequently updated
    documents, requires more storage and may impact write performance, as the system
    must track more historical versions of the data.


    This parameter can be set both at runtime using the setParameter command and at
    startup using the setParameter setting. For example, to set the parameter to 5
    seconds at runtime, you can use the following:


    ```

    db.adminCommand({setParameter: 1, minSnapshotHistoryWindowInSeconds: 5})

    ```


    **Avoid modifying the snapshot history window on config server nodes**


    In sharded clusters, avoid changing the default value on config server nodes,
    as this can cause internal operations to fail.'
  merge: -1
  img_proc: true
- pgno: 186
  md: "# Changing how eviction works\n\nWhile Atlas does not allow direct manipulation\
    \ of internal WiredTiger eviction settings, such as eviction_dirty_target or eviction_trigger,\
    \ these settings control how eviction begins gradually (target) and then uses\
    \ database operation threads (trigger) to bring cache usage back down. Atlas automatically\
    \ manages and optimizes these settings based on the instance tier.\n\nWhen self-managing\
    \ MongoDB, you might observe periodic drops in performance, as illustrated in\
    \ Figure 7.4. During a checkpoint, a large number of write IOPS may occur on the\
    \ storage device, sometimes exceeding the provisioned capacity, resulting in a\
    \ dip in database operations per second.\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_186_0.png)\n\
    \nFigure 7.4: Periodic drops in performance during checkpoints\n\nReducing syncdelay,\
    \ as discussed earlier, can help shorten the interval between checkpoints, but\
    \ it may not be sufficient to reduce storage spikes. Instead, a more effective\
    \ approach is to adjust two eviction settings to clean and evict data from the\
    \ cache faster. This involves lowering eviction_dirty_target from its default\
    \ of 5% of cache to 2% and increasing the number of eviction worker threads:\n\
    \n```\n```json\n\"storage\": {\n  \"wiredTiger\": {\n    \"engineConfig\": {\n\
    \      \"configString\": \"eviction_dirty_target=2, eviction=(threads_max=6)\"\
    \n    }\n  }\n}\n```\n```\n\nNow, when you monitor performance, you’ll see a higher\
    \ number of storage operations per second, but smaller spikes during checkpoints,\
    \ and the impact on database operations per second is less pronounced. This is\
    \ because more worker threads are running and evicting dirty pages at a lower\
    \ threshold before the checkpoint, so less data needs to be written during the\
    \ checkpoint."
  merge: -1
  img_proc: true
- pgno: 187
  md: "![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_187_0.png)\n\n*Figure 7.5: Less pronounced\
    \ drops and spikes with changes in eviction settings*\n\nAs with many performance-tuning\
    \ recommendations, it’s important to experiment with your workload and dataset.\
    \ For example, we’ve seen workloads with a large number of insert operations where\
    \ increasing eviction_dirty_target and reducing the number of eviction worker\
    \ threads (as low as 1) can significantly improve performance.\n\n# Switching\
    \ to the in-memory storage engine\n\nThe in-memory storage engine allows you to\
    \ avoid disk I/O, giving you higher performance and lower, more predictable latency\
    \ for database operations. Other than some metadata and diagnostic information,\
    \ the in-memory storage engine does not write any data to disk. In effect, you\
    \ can use it as a cache, loading and storing data from another database.\n\n>\
    \ **Note**\n> \n> The in-memory storage engine is available only in self-managed\
    \ deployments and is not supported on MongoDB Atlas.\n\nBy default, the in-memory\
    \ storage engine uses 50% of physical RAM minus 1 GB. However, since your data\
    \ isn’t being written to disk (and you don’t need as much filesystem cache), you\
    \ can increase the allocated size to use more memory. This can be configured in\
    \ the configuration file (see the following) or set via the command line:\n\n\
    ```\nstorage:\n  engine: inMemory\n  dbPath: <path>\n  inMemory:\n    engineConfig:\n\
    \      inMemorySizeGB: <newSize>\n```"
  merge: -1
  img_proc: true
- pgno: 188
  md: "Write operations that would cause the data to exceed the specified memory size\
    \ will return an error. If you’re running a self-managed deployment, you can configure\
    \ shards or replica sets to include a mix of in-memory and WiredTiger storage\
    \ engines.\n\nA mixed storage engine setup within a replica set should be designed\
    \ carefully, as it introduces nuances in data persistence, failover behavior,\
    \ and performance characteristics. This configuration is typically suitable for\
    \ scenarios where the benefits of rapid access from in-memory members significantly\
    \ outweigh the added complexity of a hybrid persistence model.\n\n# Changing the\
    \ max leaf page size\n\nAs we saw in Chapter 1, Systems and MongoDB Architecture,\
    \ storage devices have throughput and bandwidth limitations. If you’re bandwidth-constrained\
    \ rather than throughput-constrained, you may be able to improve performance by\
    \ reducing the maximum leaf page size for WiredTiger.\n\nThe current default page\
    \ size is 32 KB for collections and 16 KB for indexes. This means that if you’re\
    \ running an application that performs random reads on a dataset much larger than\
    \ the cache, each operation that misses the cache only reads one document. If\
    \ your documents are only 1 KB in size and only one is used per page, you’re effectively\
    \ wasting 31 KB of disk bandwidth (and cache space) per database operation that\
    \ accesses storage.\n\nFor example, in a self-managed cloud deployment, you could\
    \ use performance monitoring tools or iostat to check whether your storage bandwidth\
    \ is frequently at the limit.\n\nYou can change the leaf_page_max setting (for\
    \ new collections) via the configuration file or command line:\n\n```\nstorage:\n\
    \  engine: wiredTiger\n  wiredTiger:\n    collectionConfig:\n      configString:\
    \ \"leaf_page_max=8192\"  # 8kB\n```\n\nYou can also specify it when creating\
    \ a collection:\n\n```\ndb.createCollection(\"myCollection\", {\n  storageEngine:\
    \ {\n    wiredTiger: {\n      configString: \"leaf_page_max=8192\"  # 8kB\n  \
    \  }\n  }\n})\n```"
  merge: -1
  img_proc: true
- pgno: 189
  md: "The benefits of such a change can vary depending on factors such as instance\
    \ size, dataset size, average document size, and the compressibility of your data.\
    \ For example, in experiments on large instances, we’ve seen up to a 2x improvement\
    \ in read-intensive workloads with relatively small documents (1 KB) and a dataset\
    \ twice the size of available memory. However, when the dataset grows to 10 times\
    \ the size of memory, the improvement drops to around 1.4x. On smaller instances,\
    \ the gain might be just 1.1x.\n\nAs with any change, there are potential downsides.\
    \ For example, if insert performance matters to your application, smaller leaf\
    \ pages can result in more I/O operations since pages fill up faster as you insert\
    \ documents. Also, smaller pages mean the following:\n\n+   - Fewer compression\
    \ possibilities, so the dataset on disk might be larger\n+   - For workloads that\
    \ scan a lot of data, you need to issue more I/O operations to scan through the\
    \ same number of documents\n\nOn many cloud storage devices, the optimal block\
    \ size is 256 KB, so smaller pages might be less efficient from a full system\
    \ perspective.\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_189_0.png)\n\n> **Changing\
    \ leaf_page_max requires data rewrite**\n> \n> You can’t change the leaf_page_max\
    \ value for existing data, so to change leaf_page_max for a collection, you’d\
    \ need to read the data and rewrite it.\n\n# Summary\n\nIn summary, WiredTiger\
    \ is a sophisticated storage engine that blends efficient data structures, advanced\
    \ concurrency control, and robust data management to deliver a high-performance,\
    \ scalable, and flexible storage solution for modern applications.\n\nMongoDB\
    \ chose the current WiredTiger defaults to strike a good balance across a wide\
    \ range of workloads and datasets. However, your workload and dataset are unique,\
    \ and running experiments before moving your application into production can help\
    \ you identify more efficient configurations that unlock better performance.\n\
    \nIn the next chapter, we delve deeper into MongoDB’s reactive capabilities by\
    \ exploring advanced patterns, best practices, and real-world considerations for\
    \ using change streams in production environments. You’ll gain insights into scaling\
    \ event-driven architectures, managing high-throughput scenarios, and integrating\
    \ change streams with external systems to build robust applications that respond\
    \ dynamically to changes in your data."
