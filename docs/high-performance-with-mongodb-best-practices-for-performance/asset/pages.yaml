    \ can be indexed so that it’s simple and fast to query for all users interested\
    \ in hiking, for example.\n\nHave you ever tried to model hierarchical data in\
    \ a relational database? If you have, you know it often feels like trying to fit\
    \ a square peg into a round hole. In MongoDB, nested structures are a natural\
    \ fit, with no complex joins or entity-relationship diagrams required."
