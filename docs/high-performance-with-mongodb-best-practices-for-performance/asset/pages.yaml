    \        raise Exception(\"Unable to find the document due to the following error:\
    \ \", e)\n\n# Run the async function\nasyncio.run(main())\n```\n\nImplementing\
    \ asynchronous patterns within MongoDB client libraries enables you to build highly\
    \ responsive and performant applications. By leveraging constructs such as Promises,\
    \ async/await, or, as is the case with the preceding example, language-specific\
    \ concurrency features, developers can ensure database operations do not block\
