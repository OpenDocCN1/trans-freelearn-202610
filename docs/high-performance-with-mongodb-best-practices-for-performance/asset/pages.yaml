  md: "# Managing blocked operations\n\nBlocked operations can occur when a process\
    \ must wait for another operation to complete or for a resource to become available,\
    \ creating a domino effect that can severely impact your application’s responsiveness.\
    \ Understanding what causes operations to block is essential for maintaining optimal\
    \ database performance. Recognizing these patterns early allows you to implement\
    \ preventive measures before they impact your users’ experience.\n\nTypical causes\
    \ of blocked operations in MongoDB include the following:\n\n+   - Long-running\
    \ operations with exclusive locks, such as index builds or collection drops\n\
    +   - Resource contention, where multiple operations attempt to access the same\
    \ collections or documents, especially during peak usage\n+   - Connection pool\
    \ exhaustion, which occurs when all available connections are in use and new operations\
    \ must wait, creating artificial queuing\n\n> **Blocking-like symptoms from non-blocking\
    \ issues**\n> \n> Some conditions, such as cursor leaks or high network latency,\
    \ can produce symptoms that resemble blocking. For example, high latency or slow\
    \ queries, but they do not involve actual lock contention.\n\n# Case study: Cursor\
