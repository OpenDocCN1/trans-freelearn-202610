    \ of the calculation. This can also improve readability and maintainability. It’s\
    \ not strictly necessary to do that, since using the $let expression and creating\
    \ temporary variables in your $addFields stage can make writing very complex expressions\
    \ easier, but multiple sequential $set stages won’t significantly increase execution\
    \ time on your pipeline, and likely won’t increase it in a measurable way.\n\n\
    Keeping all these techniques in mind will be extra-helpful when your dataset size\
    \ grows significantly."
