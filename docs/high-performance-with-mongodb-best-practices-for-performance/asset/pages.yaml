- pgno: 252
  md: 'To illustrate how to fine-tune connection pools, consider the following scenarios
    and their corresponding recommendations:


    | Scenario | Recommendation |

    |---|---|

    | Slow application-side operation times that are not reflected in the database
    server logs or the real-time panel. | Use connectTimeoutMS to ensure the driver
    does not wait indefinitely during the connection phase. Set connectTimeoutMS to
    a value greater than the longest network latency you have to a member of the set.


    For example, if a member has a latency of 10,000 milliseconds, setting connectTimeoutMS
    to 5000 (milliseconds) prevents the driver from connecting to that member. |

    | A misconfigured firewall closes a socket connection incorrectly and the driver
    cannot detect that the connection closed improperly. | Use socketTimeoutMS to
    ensure that sockets are always closed. Set socketTimeoutMS to two or three times
    the length of the slowest operation that the driver runs. |

    | The server logs or real-time panel show that the application spends too much
    time creating new connections. | Not enough connections are available at startup.
    Allocate connections in the pool by setting minPoolSize. Set minPoolSize to the
    number of connections you want to be available at startup. The MongoClient instance
    ensures that the number of connections exists at all times. |

    | The load on the database is low and there’s a small number of active connections
    at any time. The application performs fewer operations at any one time than expected.
    | Increase maxPoolSize, or increase the number of active threads in your application
    or the framework you are using. |

    | Database CPU usage is higher than expected. The server logs or real-time panel
    show more connection attempts than expected. | Decrease the maxPoolSize value
    or reduce the number of threads in your application. This can reduce load and
    response times. |


    *Table 10.1: Connection-related performance issues and recommended MongoDB driver
    settings*


    By fine-tuning these parameters, you can significantly enhance your application’s
    efficiency and reliability when interacting with MongoDB.'
