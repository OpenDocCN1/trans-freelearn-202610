- pgno: 253
  md: '# Read/write concerns and read preferences


    As discussed in *Chapter 5, Replication*, MongoDB provides configurable read preferences,
    write concerns, and read concerns that give you fine-grained control over how
    operations interact with replica sets. These settings can be configured directly
    through client libraries and play a crucial role in balancing consistency, availability,
    and performance:


    +   - **Read preferences:** These determine which replica set members handle read
    operations:

    +     - `primary`: This is the default setting. All reads go to the primary node.

    +     - `primaryPreferred`: Try the primary first and use the secondary if unavailable.

    +     - `secondary`: Read only from secondaries.

    +     - `secondaryPreferred`: Try secondaries first and use the primary if unavailable.

    +     - `nearest`: Read from the node with the lowest network latency.

    +   - **Write concerns:** These specify the level of acknowledgment required for
    write operations:

    +     - `w:1`: The primary acknowledges writes.

    +     - `w: "majority"`: The default setting. A write must be persisted on the
    majority of replica set members.

    +     - `w:0`: No acknowledgment required (fire and forget – not recommended).

    +     - `wtimeout`: Option to specify a time limit to prevent write operations
    from waiting indefinitely.

    +   - **Read concerns:** These control the consistency and isolation properties
    of the data read from replica sets and sharded clusters:

    +     - `local`: Default setting. Returns the latest data from the instance.

    +     - `available`: Similar guarantees as local. It is used in sharded clusters
    for lowest-latency reads at the expense of consistency as an available read concern
    can return orphaned documents when reading from a sharded collection.

    +     - `majority`: Returns data that has been acknowledged by a majority of the
    replica set members. The documents returned by the read operation are durable,
    even in the event of failure.

    +     - `linearizable`: Returns data that reflects all successful majority-acknowledged
    writes that completed prior to the start of the read operation. The query may
    wait for concurrently executing writes to propagate to a majority of replica set
    members before returning results.'
  merge: -1
  img_proc: true
- pgno: 254
  md: "+   - **snapshot:** A query with the snapshot read concern returns majority-committed\
    \ data as it appears across shards from a specific single point in time in the\
    \ recent past. The snapshot read concern provides its guarantees only if the transaction\
    \ commits with the majority write concern.\n\nThrough the effective use of write\
    \ concerns and read concerns, you can adjust the level of consistency and availability\
    \ guarantees as appropriate, such as waiting for stronger consistency guarantees\
    \ or loosening consistency requirements to provide higher availability.\n\n# Compression\
    \ and network performance\n\nOptimizing data transfer between your application\
    \ and MongoDB can significantly impact performance, especially with large datasets\
    \ or high-throughput requirements:\n\n+   - **Network compression:** MongoDB drivers\
    \ support several compression algorithms:\n+     - **Snappy:** Offers a good balance\
    \ between compression ratio and speed\n+     - **zlib:** Higher compression ratio\
    \ but more CPU-intensive\n+     - **zstd:** Newer algorithm with excellent compression\
    \ and good speed\n\n+   - **Minimizing network latency:** Deploy your application\
    \ and database in the same region or data center when possible. Consider edge\
    \ deployments or caching strategies for geographically distributed applications.\n\
    \n+   - **Batch operations:** When inserting, updating, or querying multiple documents,\
    \ use bulk operations to minimize network overhead, as shown here:\n\n```\n//\
    \ Instead of multiple single inserts\nconst bulkOp = collection.initializeUnorderedBulkOp();\n\
    for (const doc of documents) {\n  bulkOp.insert(doc);\n}\nawait bulkOp.execute();\n\
    ```\n\n+   - **Projection:** Request only the fields you need, rather than retrieving\
    \ entire documents, as shown here:\n\n```\n// Only retrieve necessary fields\n\
    const result = await collection.findOne(\n  { _id: documentId },\n  { projection:\
    \ { name: 1, email: 1 } }\n);\n```"
