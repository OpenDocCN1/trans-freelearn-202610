- pgno: 289
  md: '# Identifying problematic patterns


    Just as not all fast queries are optimally efficient, sometimes well-written,
    index-supported queries can still be slow. It’s important to understand why they
    are slow to avoid wasting time tuning something that’s not the root cause of the
    performance issue.


    Will problematic queries always be slow? Not necessarily. We already know that
    slow is relative, and by default, queries that are slower than 100 milliseconds
    are recorded in the mongod logs. This threshold can be configured to be higher,
    lower, or based on something other than an absolute time threshold; see Chapter
    14, Monitoring and Observability, for more details. However, inefficient queries
    may still slip under the radar if they fall just below the threshold, even though
    they could still be significantly faster with optimal indexes. We can look for
    these slow queries by adjusting the logging threshold and looking at the query
    targeting ratio, disk use, or other resource contention.


    # Query targeting ratio


    One of the most important metrics for how efficient your queries are is called
    the query targeting ratio. Now that we’ve seen what details are available in explain
    and log messages, let’s look at what goes into this ratio. When you query for
    all documents that satisfy a particular criterion, the fewer documents the system
    has to look at to determine which ones to return, the faster the query will complete.


    Query targeting ratio refers to either the number of index keys read compared
    to the number of documents returned or the number of documents read compared to
    the number of documents returned. The ideal number for either of these would be
    1, as we’d like to only look at index entries or only documents that need to be
    returned to the client. If there is an optimal index for a query and each index
    entry scanned ends up being in the result set, then the ratio will be 1:1. Covered
    index queries are a special case where we don’t even need to look at any documents
    and will be indicated by having "docsExamined": 0, but let’s put those aside for
    the purpose of understanding the following examples.


    The simplest example is query {a: 5} and an index on a. Every index entry we look
    at will be for the value we want to match, and we will only visit documents that
    need to be returned to the client. That’s an ideal ratio. If there is no index
    on a, then we have to do a collection scan, meaning we look at every document
    in the collection. If there are 50 documents that match our condition and need
    to be returned, and there are 50 million documents in the collection, then our
    targeting ratio will be 1 million to one, which is not very good, given the ideal
    ratio would be one to one.'
  merge: -1
  img_proc: true
- pgno: 290
  md: 'Here are several log message snippets from queries that used an index to satisfy
    several query predicate clauses but then had to examine additional fields in the
    document to determine whether it should be returned to the client:


    ```

    "keysExamined":977,"docsExamined":977,"nreturned":4

    "keysExamined":69070,"docsExamined":147,"nreturned": 0

    ```


    While the keysExamined to docsExamined ratio tells you how efficient the indexes
    were in narrowing down the number of documents the query needed to examine, nreturned,
    being significantly lower still indicates that additional filters had to be applied
    to the document directly. This only applies to queries, not aggregations, which
    can return a lower number of documents due to aggregating them into a smaller
    number of total groups.


    # Waiting for disk or other resources


    One of the most useful metrics in our logs may be storage, which will be empty
    in the case of a fast query. However, if any of the index or data pages were not
    in the storage engine cache, the metrics related to that will appear in the storage
    field. Very slow queries, even those that use indexes effectively, are often slow
    because the data isn’t already in the WiredTiger cache, and this is the field
    that will indicate whether that’s the case.


    Here’s what partial log messages might look like for three queries:


    ```

    storage:{data:{bytesRead:8674010,timeReadingMicros:6297}},durationMillis:105

    storage:{data:{bytesRead:15353,timeReadingMicros:918415}},durationMillis:919

    storage:{data:{bytesRead:31033716,timeReadingMicros:82948}},

    durationMillis:145

    ```


    From the database’s point of view, this indicates that the data didn’t come from
    its cache. This data could still have been read from the filesystem cache.


    In different cases, the root cause may be a problematically very slow disk (second
    example line), a large amount of data not present in cache, or an in-memory sort
    that had to spill data to disk. You can track this by finding "usedDisk":true
    in the log message, or by examining the more detailed information in the explain
    output.


    In the same way, log messages can indicate that a slow query used an optimal execution
    plan, but was still slow due to other unavailable resources, such as waiting for
    other slow operations. There is no point trying to tune that query because it’s
    the system overall, or other slow operations, that need to be addressed.'
  merge: -1
  img_proc: true
- pgno: 291
  md: '# How to influence query execution


    Sometimes, no matter how much you try to create a perfect index for a query, the
    query planner picks a different index. There are two ways you can influence the
    execution to force your preferred index to be selected, or to block undesirable
    queries from being able to execute entirely.


    # Using hint


    You can pass a hint directive to any query with the name or definition of an index.
    This instructs the query engine to completely bypass the query cache and planning
    process, and instead use the specified index for the query. There are a few things
    to be cautious about when using hints. Specifying a non-existent index will return
    an error. Specifying a sparse, partial, or otherwise incompatible index can return
    incomplete results if the index does not include all documents satisfying the
    query predicate.


    When using hint within your application code, it’s important to proceed with caution:
    periodically check that it’s still necessary. It’s usually preferable to remove
    extra indexes that cause the query engine to make suboptimal choices, but in cases
    where that’s not possible, using hints can provide a quick solution.


    Here is an example of code that forces find to use an index by its name via a
    hint:


    ```

    db.coll.find({<filter>}).hint("indexName")

    ```


    Use hints thoughtfully. Always validate their continued relevance as your data
    and indexes evolve.


    # Using query settings


    MongoDB version 8.0 introduced a new feature called persistent query settings.
    This feature allows you to control query execution by automatically adding hints
    on the server without having to make code changes to your application, defining
    rejection filters, and configuring other fields. Rather than relying on a hint
    being explicitly added to a particular query shape in the application code (which
    comes with the risk of missing some places if the query is invoked in multiple
    parts of the system), you can configure the server to automatically apply a hint
    whenever a specific query shape is observed.'
  merge: -1
  img_proc: true
- pgno: 292
  md: "This command sets an index hint for a specific database, collection, and query\
    \ shape:\n\n```\ndb.adminCommand({\n  setQuerySettings: {\n    find: \"collName\"\
    ,\n    filter: {<filter>},\n    $db: \"dbName\"\n  },\n  settings: {\n    indexHints:\
    \ {\n      ns: {db: \"dbName\", coll: \"collName\"},\n      allowedIndexes: [\"\
    indexName\"]\n    }\n  }\n})\n```\n\nWhen you want to block a problematic query\
    \ from running entirely, modify the settings field to include the reject:true\
    \ directive. To learn more about the setQuerySettings command, visit https://www.mongodb.com/docs/manual/reference/command/setquerysettings/.\n\
    \n# Other options\n\nAnother setting worth noting, which exists as a giant hammer,\
    \ though generally not recommended for production environments, is the --no tablescan\
    \ option when starting mongod. This setting can block any and all queries that\
    \ have a query filter but do not have an eligible index to use. This might be\
    \ safe to enable in a test or staging system to find out whether any queries are\
    \ unexpectedly running collection scans, but it may not be such a good idea to\
    \ use such a non-discriminate tool in production. You can monitor for such queries\
    \ in production and either decide to block them from the system using query settings\
    \ or add indexes to support them.\n\n# MQL semantics and indexes\n\nAs discussed\
    \ in Chapter 3, Indexes, indexes were designed to support MongoDB Query Language\
    \ (MQL) find semantics, but what does that mean? MQL has several components, some\
    \ specific to aggregation, some specific to updates, and some specific to find\
    \ command filters, which are called match expressions. This is the syntax you\
    \ use when you specify a query predicate for the find, update, and delete commands,\
    \ and also the syntax that the $match aggregation stage expects. Indexes support\
    \ some of the peculiarities of match expressions, and this can impact how efficiently\
    \ your index can be used by a specific query. Understanding this can help you\
    \ spot, debug, and rewrite hard-to-optimize queries and write more efficient queries\
    \ from the start."
  merge: -1
  img_proc: true
- pgno: 293
  md: '# Challenges with arrays and multikey indexes


    Fields that store arrays introduce unique challenges for query planning and index
    use. Documents with fields that could be arrays need special consideration to
    avoid becoming a source of unintended performance issues.


    # Equality is not just equality


    In an MQL query specifying equality ($eq) to a value—explicit or implicit—means
    either *equal* or *array where one of the elements is equal to the value.*


    For example, `db.coll.findOne({a:5})` matches `{a:5}` as well as `{a:[1, 5, 10]}`.


    This means that an index on field a that contains the entry 5 must point to documents
    where a is 5, as well as documents where a is an array containing 5. The entries
    look exactly the same, but as soon as any array element is indexed, the index
    acquires the multikey property, which tells the query engine that a might be an
    array. Therefore, when returning the value a, it cannot be returned from the index
    alone; the document must be fetched to return the actual value of the field.


    Note that in aggregation, the $eq expression does not have this nuance. In `{$eq:[v1,
    v2]}`, the result is true if the two values are equal, and false otherwise. Aggregation
    expressions do not reach inside arrays to match individual values.


    # $elemMatch


    How we index arrays doesn’t just have implications for returning potential array
    fields; it also impacts how we can use indexes to check $elemMatch conditions.
    The $elemMatch operator checks *whether at least one element in the array satisfies
    the query criteria.*


    For example, the query `{a:{$elemMatch:{$eq:5}}}` will match `{a: [1, 4, 5]}`
    but will not match `{a: 5}` because 5 here is not an array element.


    Similarly, `{a:{$gt:5, $lt:10}}` will match `{a: [1, 4, 11]}` because both conditions
    are true; a has an element that is smaller than 10 and it also has an element
    that is greater than 5.


    In order to look for a single element that matches both conditions, we would have
    to write `{a:{$elemMatch:{$gt:5, $lt:10}}}`. Now, the meaning becomes: *a must
    have a single element that is both greater than 5 and less than 10.*


    Given that we index array values in the B-tree, there are several situations where
    the index may not answer the query as efficiently as you might expect. A simple
    `{a:{$elemMatch:{$eq:5}}}` query can use the index to find all documents where
    a is either scalar 5 or an array containing 5.'
  merge: -1
  img_proc: true
- pgno: 294
  md: 'But without looking at the document, it’s not possible to tell whether a is
    an array element or not, because a flexible schema allows you to include scalars
    and arrays in the same field in a collection.


    Another case where a query’s use of indexes may surprise you is when you don’t
    use $elemMatch for multiple conditions, specifically when you don’t want a single
    element to satisfy several conditions, but instead want to find an array where
    different elements can satisfy these conditions.


    An example is the preceding {a: {$gt: 5, $lt:10}} query, which can use an index
    on a, but if the index is multikey (that is, if it’s known that a can be an array
    in some of the documents), then it cannot be used the same way as a regular non-array
    index.


    Consider the example we’ve been looking at and how it could use a non-multikey
    versus multikey index:


    ```

    db.coll.explain().find({a:{$gt:5, $lt:10}})

    ```


    Table 12.1: Query uses different index bounds depending on whether the index is
    multikey


    | // non-multikey index on a | // multikey index on a |

    |---|---|

    | "winningPlan" : { "stage" : "FETCH", "inputStage": { "stage" : "IXSCAN", "keyPattern":{"a":1},
    "isMultiKey" : false, "indexBounds": {"a":["(5.0,10.0)"]}}} | "winningPlan" :
    { "stage" : "FETCH", "filter" : {"a" : {"$lt" : 10}}, "inputStage" : { "stage"
    : "IXSCAN", "keyPattern" : {"a" : 1}, "isMultiKey" : true, "indexBounds" : {"a":["(5.0,inf.0)"]}},
    "rejectedPlans" : [...] } |


    *Table 12.1: Query uses different index bounds depending on whether the index
    is multikey*'
