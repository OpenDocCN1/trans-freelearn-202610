- pgno: 129
  md: '# Working with large datasets


    MongoDB’s aggregation framework is designed to handle everything from bite-sized
    collections to datasets that would make a data scientist sweat. But as your data
    grows, so do the challenges. Let’s explore strategies for working with large datasets
    and keeping your pipelines running smoothly.


    # Aggregation pipeline limits


    MongoDB imposes several limits to keep your aggregations from running amok:


    +   - **Result size restrictions:** Each document in the result must adhere to
    the 16 MB limit. The document maximum size limit also applies to documents that
    flow between stages. The $facet stage can only return a single document, which
    cannot be larger than 16 MB.

    +   - **Number of stages limit:** Pipelines can have up to 1,000 stages. If you
    hit this, it’s probably time to rethink your approach!

    +   - **Memory limit:** Individual aggregation stages are limited by default to
    100 MB of RAM. If a stage exceeds this, the aggregation operation will leverage
    temporary files on disk automatically since allowDiskUse has been enabled by default
    since MongoDB version 6.0. This option can be disabled if needed for performance
    reasons, but then pipelines with stages that exceed this threshold will fail and
    return an error.


    These limits are designed to protect your system from runaway workloads, not to
    restrict thoughtful development. By understanding and working within them, you
    can design aggregation pipelines that are both efficient and reliable, even at
    scale.


    # Managing memory constraints with allowDiskUse


    Blocking stages such as $group or unindexed $sort can be memory hogs, and because
    of that, there is a 100 MB memory limit on them by default. When you hit that
    limit, data being kept in memory automatically spills to disk using temporary
    files. This behavior is controlled by the allowDiskUse option, which by default
    is set to true. You have two options to avoid using disk for sorts:


    +   - **Optimize your pipeline** to reduce memory usage (the better approach for
    performance)

    +   - **Explicitly disable disk usage** with allowDiskUse:false, if you prefer
    operations to fail with an error rather than slow down by having to read and write
    to disk'
  merge: -1
  img_proc: true
- pgno: 130
  md: 'While having allowDiskUse enabled by default provides a safety net for memory-intensive
    operations, it’s important to be aware that disk I/O is significantly slower than
    in-memory operations. You may want to explicitly disable it by setting allowDiskUse:false
    in scenarios where low latency is critical and it’s preferable for operations
    to fail fast rather than potentially becoming slow due to disk usage.


    Only certain aggregation stages are subject to this limit; they are all blocking
    stages:


    +   - **Unindexed $sort operations on large datasets:** Sorting a large number
    of documents *without the benefit of an index* and without an immediate $limit
    following it requires all documents to be sorted to be maintained in memory

    +   - **$group with high cardinality keys and/or large result documents for each
    key:** If the field(s) used in the _id of a $group stage have many unique values
    and/or if each grouping has to maintain a large amount of data, the stage needs
    to maintain a large amount of data for each distinct group in memory

    +   - **$bucket, $bucketAuto, and $setWindowFields:** These stages are variants
    of $group and can consume significant memory in the same circumstances as $group


    ![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_130_0.png)


    # Blocking stages and memory usage considerations


    Not all blocking stages are able or likely to exceed this stage limit. For instance,
    $count is a blocking stage that needs to count all the incoming documents, but
    since it only outputs a single document as its result, its memory use is trivially
    tiny. The $sortByCount stage is a blocking stage that groups all of its input
    into small documents containing only two fields, but then it has to sort them
    in memory. If you don’t specify a $limit stage after the $sortByCount and you
    have well over 1 million distinct group key values, then the result could possibly
    exceed 100 MB, but that scenario is not very likely. You would likely use $limit
    rather than returning millions of results to the client.


    # Aggregation in distributed environments


    Sharding, which we cover in Chapter 6, Sharding, is MongoDB’s secret sauce for
    scaling horizontally, but it adds a layer of complexity to aggregation pipelines.
    When your data is spread across multiple shards, understanding how aggregation
    works in this distributed environment is key to maintaining performance and avoiding
    bottlenecks.'
  merge: -1
  img_proc: true
- pgno: 131
  md: '# Optimizing aggregation for sharded collections


    In a sharded cluster, aggregation pipelines can be executed in parallel across
    shards. MongoDB tries to push as much work as possible to each shard that holds
    the data needed for aggregation, minimizing the amount of data that needs to be
    transferred over the network.


    If an aggregation query can be satisfied by data residing on a single shard (or
    a subset of shards), mongos will route the query only to the relevant shard(s).
    This is the most efficient scenario as it minimizes cross-shard communication
    and coordination overhead. This typically happens when the query includes a filter
    on the shard key, or the collection being aggregated only lives on one or a small
    subset of shards.


    If the aggregation cannot be targeted (e.g., no filter on the shard key and data
    lives on multiple shards), mongos performs a scatter-gather operation. It sends
    the first part of the pipeline to all shards that hold data for the target collection.
    mongos then gathers the results and merges them by running the rest of the pipeline
    itself. There are also scenarios where the merge stage must happen on a selected
    shard rather than on mongos.


    The choice of shard key can make or break your aggregation performance. A well-chosen
    shard key can enable many aggregation queries to be targeted to a single shard,
    dramatically improving performance. Conversely, a poorly chosen shard key can
    lead to most aggregations becoming scatter-gather operations, increasing latency
    and load on the cluster.


    # Understanding shard-local versus merged operations


    Not all pipeline stages are created equal. Some can be executed on individual
    shards, while others must be merged on mongos. Use the explain() command to determine
    where each stage runs. The output will show how the pipeline is split, and which
    parts are executed on the shards and which on mongos.


    All streaming stages can run on shards, as well as the first parts of blocking
    stages. In some special cases, even $group can run entirely on a shard, if you
    are grouping by the shard key. The final part of the first blocking stage that
    cannot run entirely on the shard, and all stages that follow, will have to run
    on the merging location, which is usually mongos.


    Keep as much processing as possible on the shards to reduce network traffic and
    speed up your pipeline. If an aggregation can run entirely on a single shard,
    it avoids network latency and the merging overhead on mongos.'
  merge: -1
  img_proc: true
- pgno: 132
  md: 'If you have a $group stage, and the group key is (or includes) the shard key,
    each shard can perform the full group operation locally, with the pipeline continuing
    locally, and mongos only needs to return the results to the client without additional
    processing. If the group key is different, or if there is another blocking stage,
    then the shards perform the initial part of that stage, and mongos does a final
    merge and all the following stages, which is more work for mongos.


    Merges are frequently unavoidable, but you can minimize their impact. The earlier
    stages in your pipeline ($match) should aggressively filter out documents. The
    less data each shard sends to mongos for merging, the faster the merge operation
    will be.


    # Monitoring and profiling aggregation performance


    Even the most carefully crafted aggregation pipeline can run into performance
    issues. That’s why monitoring and profiling are essential skills for any MongoDB
    practitioner.


    You saw briefly how the explain() method is your window into the inner workings
    of an aggregation pipeline. It reveals the execution plan, showing how each stage
    is processed, which indexes are used, and where the heavy lifting happens. We’ll
    show a lot more about explain in Chapter 12, Advanced Query and Indexing Concepts.


    To get the explain output for an aggregation, append .explain() to your collection
    name before the aggregate() command, use the {explain:true} option inside aggregate,
    or in mongosh, append .explain() to the end of your aggregate method. Common verbosity
    modes include the following:


    +   - **explain("queryPlanner")**: Shows the plan selected by the query optimizer,
    including stages as they will be executed and how indexes are utilized

    +   - **explain("executionStats")**: Executes the query and returns detailed statistics
    about the execution, such as the number of documents returned (nReturned), total
    documents examined (totalDocsExamined), total execution time after each stage
    (execTimeMillis), and index usage

    +   - **explain("allPlansExecution")**: Same as executionStats but includes additional
    information and statistics about rejected query plans in the $cursor stage


    The primary goal of using explain() is to find opportunities for improvement.
    Look for COLLSCAN (collection scan) as an inputStage for $match or $sort operations
    where you expected an IXSCAN (index scan). COLLSCAN means MongoDB had to read
    all documents in the collection to find the relevant ones, which is usually inefficient.'
  merge: -1
  img_proc: true
- pgno: 133
  md: 'Stages such as $group or $sort that show a high increase in execTimeMillis
    over the previous stage and process many documents might be memory-intensive.
    High totalDocsExamined values compared to nReturned for a $match stage suggest
    that the filter is not very selective or isn’t using an index effectively.


    You can see whether the $lookup stage used indexes, and if so, how efficient it
    was. You can also make sure the indexes used are the ones you expected to be selected,
    and if they are not, you can see whether you have indexes that are redundant and
    can be dropped. You can also see whether a blocking stage spilled to disk and
    how much disk space it used. If the operation was fully in memory, you can see
    how much memory was used and whether it may be getting close to the 100 MB limit,
    when things will slow down a lot.


    Experience and profiling often reveal common patterns that lead to performance
    issues.


    # Utilizing materialized views


    Sometimes a complex aggregation will be slower than the required SLA to return
    its results, in which case you can run the aggregation periodically to cache its
    results in another collection, which the clients can query directly.


    Use $out or $merge to store intermediate results as these stages write the results
    of the aggregation pipeline to a specified collection, which can then be queried,
    indexed, or used as input for further aggregations.


    # Summary


    Let’s distill what you’ve learned in this chapter into key principles that will
    help you build aggregation pipelines that are both powerful and performant. First,
    filter early. The most impactful optimization you can make is often the simplest.
    Every document you can exclude early means less work for every subsequent stage.
    This isn’t just about adding a $match stage at the beginning, although that’s
    the most impactful optimization you can make. It’s also about adding $limit when
    you know you won’t be using all the documents to minimize data flow, not creating
    fields you won’t be using, and reviewing your pipeline with explain to check that
    only the necessary data is being passed from stage to stage.


    Next, leverage indexes strategically. Indexes aren’t just for find() operations;
    they’re vital for aggregation performance. For instance, initial $match stages
    can use indexes just like regular queries; early $sort operations will use indexes,
    when possible; $lookup will use indexes on from collections; and some $group operations
    can leverage indexes. The key is ensuring your pipeline structure allows MongoDB
    to use those indexes. For example, when you need both filtering and sorting, make
    sure you have a compound index that supports both operations.'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'Also, design with sharding in mind. In a sharded environment, understanding
    how aggregation stages distribute across shards can make or break performance.
    For best results, filter on the shard key early to target only specific shards,
    minimize the number of shards involved, and be aware of which stages force a merge
    (that is, stop parallel execution). Finally, monitor and measure performance.
    Keep experimenting, keep measuring, and keep refining your approach. The most
    elegant pipeline isn’t necessarily the one with the fewest stages; it’s the one
    that balances readability, maintainability, and performance to deliver insights
    accurately and efficiently.


    With your data processing optimized, it’s time to turn our attention to the pathways
    that carry your data.


    The next chapter explores replication, read preference, and write concern, which
    are essential for maintaining data availability, consistency, and performance
    across distributed systems.'
