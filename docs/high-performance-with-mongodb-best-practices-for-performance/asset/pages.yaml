- pgno: 369
  md: '+   - **Query Pattern Analysis:** Using grep commands, they analyzed the log
    file patterns:


    ```

    grep ''aCollection'' mongodb.log* | grep -v ''getMore'' | wc -l

    122784


    grep ''aCollection'' mongodb.log* | grep ''"cursorExhausted":true'' | wc -l

    46954

    ```


    The first command counts all operations on ''aCollection'' while excluding ''getMore''
    operations, revealing 122,784 initial cursor creations. The second command counts
    only cursors that were properly exhausted (fully iterated through or explicitly
    closed), showing just 46,954 such cases. This significant discrepancy (only about
    38% of cursors being properly closed) confirmed our suspicion of a cursor leak,
    as the majority of cursors created by the application were being abandoned without
    proper cleanup, causing them to accumulate until their timeout period elapsed.


    # Root cause identification


    The problem originated from a specific bug in the customer’s application that
    had remained hidden until recently. When queries began returning more than the
    default 101 documents in a single batch due to data growth, the issue finally
    became apparent. The application was designed to process small result sets and
    would properly handle cursors in those cases.


    This issue only manifests when a client keeps an active session open while not
    fully exhausting the cursor (either by not iterating through all results or not
    explicitly calling close() on the cursor). Under normal circumstances, with properly
    implemented cursor handling or smaller result sets, this problem wouldn’t occur.
    Most MongoDB driver implementations and standard query patterns automatically
    handle cursor lifecycle management, making this type of leak relatively uncommon
    in well-designed applications.


    For more information on how cursors behave, visit the MongoDB Documentation on
    cursors at https://www.mongodb.com/docs/manual/core/cursors/#behavior.


    # Implementing the solution


    While the customer’s development team worked on a permanent fix, the MongoDB support
    team provided a key temporary measure: a shell command to terminate idle cursors
    on the affected namespace. This helped prevent a build-up of inactive cursors,
    which could have worsened performance and caused system instability. This command
    offered immediate relief and gave the development team valuable time to fix the
    core issue.'
