    \ potentially huge increase in latency and risk of exceeding the transaction timeout\
    \ limit, the correct technique would be to compose a single update (using expressive\
    \ aggregation syntax if necessary) to make all the modifications in a single operation.\n\
    \nIf it’s critical that no other thread is reading a document while one thread\
    \ is making updates to it, it’s possible to achieve that without a transaction\
    \ by placing a logical lock field in the document with one update and later when\
    \ updating the other fields unsetting that field. Take care that the rest of the\
    \ operations check that no lock exists when they interact with the document.\n\
    \n# Transactions for read-only operations\n\nUsing multi-document transactions\
    \ solely for read operations is an unnecessary overhead that can negatively impact\
    \ performance. To ensure a consistent snapshot for a series of reads across many\
    \ documents, use read concern snapshot rather than starting a transaction. If\
    \ you need to ensure reads reflect your previous writes, use causally consistent\
    \ sessions or use the linearizable read concern."
  merge: -1
