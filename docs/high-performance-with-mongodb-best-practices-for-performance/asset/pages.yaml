- pgno: 61
  md: 'number of threads that can be active from your application server at a time.
    It brings the mongod performance back to the Peak part of the graph in Figure
    1.12. With these two changes, we have now reached our performance goal.


    This is another example of what seems like a counterintuitive change. Reducing
    something can improve performance.


    # An incremental process for optimization


    In general, you can follow a seven-step process with a five-step loop. When we’ve
    seen people struggle with performance tuning and scaling, it is because they start
    in the middle, skip steps, or don’t know where they are in the process:


    ![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_61_0.png)


    Figure 1.13: An incremental process for optimization and tuning


    Let’s go through these steps in detail:


    +   1. **Determine the goal/requirement:** There’s always room for improvement
    somewhere in a complex system. Without an agreed goal at the start of the process,
    performance tuning can become a never-ending task. The goal can become a moving
    target as the market or requirements change. Get agreement for what the performance
    requirements will be from project sponsors and stakeholders before starting the
    project. A performance requirement should be **SMART**, which stands for **specific,
    measurable, achievable, relevant, and time-bound**. Make it as fast as possible
    is not very specific, achievable, or time-bound. 1M queries per second on a 1GHz
    4-core CPU, with 3k IOPS is not achievable. The requirement should also be relevant
    to your end user.'
  merge: -1
  img_proc: true
- pgno: 62
  md: "This is also a good time to think about the limits of scalability of the system.\
    \ Presuming data can’t increase unbounded forever, how will data expire or be\
    \ archived over time? What are the performance targets when data is being archived?\n\
    \n+   2. **Gather data:** Start by gathering data. The working set is the size\
    \ of the frequently used data and indexes. Does the working set fit in memory?\
    \ We’ll see examples of this calculation later in the book. In general, be aware\
    \ of the costs of a particular operation. For example, if your application has\
    \ an administrator feature that runs an occasional query over a large dataset,\
    \ it’s likely that the data won’t be in any of the many caches. Worst case, the\
    \ database will have to retrieve each document from a different disk location,\
    \ resulting in I/O operations. Your system will have some limit on I/O bandwidth,\
    \ and this is shared among all the queries running at the same time.\n+   \n+\
    \   3. **Generate hypotheses:** Next, generate hypotheses, or possible explanations\
    \ for the current bottleneck. Typically, there will be more than one possible\
    \ hypothesis. It’s a good idea to get a group of people together to brainstorm.\
    \ Each person will have different levels of experience in different parts of the\
    \ system. However, everyone will have pet theories based on their experience.\
    \ Sometimes discussions can get bogged down in one area. At first, focus on quantity;\
    \ try to get people to suggest possible hypotheses without judgment or analysis.\n\
    +   \n+   4. **Prioritize hypotheses:** Then, walk through each hypothesis and\
    \ try to prioritize them. Note any evidence or data that might support a hypothesis.\
    \ Again, it’s important to time-box the discussion and not spend too much time\
    \ on any one hypothesis.\n+   \n+   5. **Validate #1:** Now that we have a #1\
    \ hypothesis or a prime suspect, we need to identify a test that could prove or\
    \ disprove the hypothesis. For example, if we think a specific part of the system\
    \ could be CPU-bound, try increasing the size of the server it’s running on.\n\
    +   \n+   6. **Make a change:** Next, make a change that should improve the situation\
    \ and prove the hypothesis. For example, you could increase the number of IOPS\
    \ or reduce or increase the number of threads in your application. Ideally, you\
    \ should make one change at a time.\n+   \n+   7. **Measure effect:** Finally,\
    \ measure the change in performance. Hopefully, it’s an improvement. If the overall\
    \ performance requirement is met, you can release and celebrate. If not, you’ll\
    \ need to undo the changes that didn’t work, then iterate and look at the next\
    \ hypothesis and bottleneck.\n\nOptimization is not a one-time task. It is a structured,\
    \ iterative process. By following the steps in order and avoiding the temptation\
    \ to skip ahead, you can prevent common pitfalls and achieve measurable improvements\
    \ in system performance."
  merge: -1
