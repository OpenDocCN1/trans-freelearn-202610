    # Diagnosing the cause


    The root cause of the imbalance stemmed from the cluster’s initial configuration.
    The cluster contained a single database with numerous collections, and when the
    database was first created, shard-0 was designated as the primary shard. As a
    result, all unsharded collections were placed on shard-0 by default. Over time,
    as the number of unsharded collections and their respective data volumes grew,
