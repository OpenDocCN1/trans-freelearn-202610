- pgno: 80
  md: "# Patterns for write performance optimization\n\nIn this section, we’ll look\
    \ at schema design patterns that are beneficial for optimizing write performance.\
    \ These include the document versioning pattern, which allows you to manage changes\
    \ to frequently updated documents efficiently by storing previous versions within\
    \ the same document or a separate collection; the bucketing pattern, which groups\
    \ multiple related records into a single document to reduce the number of writes\
    \ and improve the efficiency of write-heavy workloads; and the key prefixing pattern,\
    \ which engineers the value of the _id field to avoid the creation of secondary\
    \ indexes.\n\n# Document versioning pattern\n\nInstead of updating existing documents\
    \ and storing what changed, create new versions and maintain a pointer to the\
    \ current version. This is particularly useful when there’s a requirement to always\
    \ keep the full history of changes to an entity.\n\nThe following is an example\
    \ of feature rollout configuration in the Socialite app that shows two documents\
    \ containing two different versions:\n\n```\n// Current version (in main collection)\n\
    {\n  _id: \"feature_story_sharing\",\n  name: \"Story Sharing Feature\",\n  isEnabled:\
    \ true,\n  userPercentage: 75,\n  configuration: {\n    maxDurationSeconds: 30,\n\
    \    allowedFilters: [\"sepia\", \"noir\", \"vintage\"],\n    maxFileSize: 15728640\n\
    \  },\n  version: 3,\n  lastUpdated: ISODate(\"2023-04-12T16:30:00Z\")\n}\n```"
  merge: -1
  img_proc: true
- pgno: 81
  md: "```\n// History collection (previous versions)\n{\n  _id: ObjectId(\"5f4e5b6d3c1e2a1b3c4d7f2o\"\
    ),\n  featureId: \"feature_story_sharing\",\n  name: \"Story Sharing Feature\"\
    ,\n  isEnabled: true,\n  userPercentage: 50,  // Was 50%, now 75%\n  configuration:\
    \ {\n    maxDurationSeconds: 30,\n    allowedFilters: [\"sepia\", \"noir\"], \
    \ // \"vintage\" filter added later\n    maxFileSize: 15728640\n  },\n  version:\
    \ 2,\n  updatedAt: ISODate(\"2023-04-10T09:15:00Z\")\n}\n```\n\nLet’s go over\
    \ this example to understand how the document versioning pattern has been applied\
    \ here. The document versioning pattern is used to track changes to a document\
    \ over time by storing the current version in a main collection and previous versions\
    \ of the document in a separate history collection:\n\n+   - **Current version\
    \ document (the main collection)**: The first document represents the active configuration\
    \ of the feature, storing the following:\n+     - The current state of the feature\
    \ (isEnabled: true, userPercentage: 75)\n+     - The latest configuration settings\
    \ (allowedFilters now includes \"vintage\")\n+     - The current version number\
    \ (version: 3) and the timestamp (lastUpdated), indicating when it was last modified\n\
    \nThis document is stored in the main collection, which focuses on the current\
    \ version, serving applications that need to access or modify the latest feature\
    \ configuration. This optimizes for fast reads and updates as it represents the\
    \ most up-to-date data.\n\n+   - **Previous versions document (the history collection)**:\
    \ The second document provides a snapshot of an earlier version of the feature\
    \ configuration, including the following:\n+     - Historical settings, such as\
    \ userPercentage: 50 and allowedFilters, before the \"vintage\" filter was added"
  merge: -1
  img_proc: true
- pgno: 82
  md: "+   - The version: 2 field clearly shows this is an earlier version of the\
    \ feature\n+   - The updatedAt timestamp documents when this version was replaced\
    \ by a newer one\n\nThis document is stored in a separate history collection dedicated\
    \ to maintaining versions of documents. Storing older versions separately ensures\
    \ that the main collection remains lightweight while still enabling access to\
    \ historical data for use cases such as audits, debugging, or comparative analysis.\n\
    \nThe document versioning pattern avoids the need for a second write to record\
    \ “what changed” by separating the current version of a feature configuration\
    \ from its historical versions. This pattern is best suited for applications that\
    \ require maintaining an audit trail, tracking changes over time, or supporting\
    \ rollbacks, such as configuration management systems, content publishing platforms,\
    \ or any system needing historical data without compromising performance for active\
    \ workflows.\n\n# Bucketing pattern\n\nFor time-series or high-volume data, you\
    \ can use the bucketing pattern to group related data points into “buckets” to\
    \ reduce the number of documents, when using a special time-series collection\
    \ is not possible for some reason.\n\nThe following is an example of a timeline\
    \ cache in the Socialite app that tracks a user’s daily activity:\n\n```\n// With\
    \ bucketing (optimized for fast timeline displays)\n{\n  _id: ObjectId(\"5f4e5b6d3c1e2a1b3c4d5f2f\"\
    ),\n  userId: ObjectId(\"5f4e5b6d3c1e2a1b3c4d5e6f\"),\n  date: ISODate(\"2023-04-10T00:00:00Z\"\
    ),\n  activities: [\n    {\n    type: \"post\",\n    postId: ObjectId(\"5f4e5b6d3c1e2a1b3c4d6f4h\"\
    ),\n    timestamp: ISODate(\"2023-04-10T10:00:00Z\"),\n    content: \"Just posted\
    \ a new photo!\",\n    mediaUrl: \"https://socialite.com/images/photo123.jpg\"\
    ,\n    likes: 42\n    },\n  ]\n}\n```"
  merge: -1
  img_proc: true
- pgno: 83
  md: "```\n{\n    type: \"follow\",\n    timestamp: ISODate(\"2023-04-10T10:15:12Z\"\
    ),\n    targetUser: {\n        id: ObjectId(\"5f4e5b6d3c1e2a1b3c4d6f7j\"),\n \
    \       username: \"travel_adventures\"\n    }\n},\n{\n    type: \"like\",\n \
    \   timestamp: ISODate(\"2023-04-10T10:25:30Z\"),\n    postId: ObjectId(\"5f4e5b6d3c1e2a1b3c4d6f8k\"\
    ),\n    postAuthor: \"mountain_explorer\",\n    postSnippet: \"Summit day at Mt.\
    \ Rainier...\"\n}\n\n    // ... more activities within this day\n],\n    activityCount:\
    \ 27\n}\n```\n\nLet’s go over this example to understand how the bucketing pattern\
    \ has been applied here:\n\n+   - **Grouping activities:** Instead of storing\
    \ each user activity (such as posts, likes, and follows) as individual documents,\
    \ all activities for the user on a specific date (date: ISODate(\"2023-04-10T00:00:00Z\"\
    )) are grouped into a single document under the activities array. Each entry in\
    \ the array represents an activity, making it easy to track related actions within\
    \ that timeframe.\n+   - **Metadata for aggregation:** The document includes an\
    \ activityCount field, providing an aggregated summary of the number of activities\
    \ stored within the bucket for quick reference.\n\nIn this example, the bucketing\
    \ pattern is applied by grouping a user’s daily activities into a single document,\
    \ rather than creating individual documents for each activity. This pattern dramatically\
    \ reduces write operations and makes displaying a user’s timeline extremely fast,\
    \ as one query can retrieve a full day’s worth of activity. The bucketing pattern\
    \ is well suited for use cases involving time-based or logically grouped data,\
    \ such as activity logs, event tracking, IoT sensor readings, or time-series data,\
    \ where natural clustering of records exists and querying grouped records is common."
