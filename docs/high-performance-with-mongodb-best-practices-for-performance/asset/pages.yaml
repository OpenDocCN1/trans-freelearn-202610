- pgno: 135
  md: '# 5


    # Replication


    In this chapter, you''ll learn how MongoDB uses replication for continuous operation
    and automatic failover. Replica sets orchestrate data synchronization across multiple
    nodes, ensuring your application stays online when hardware or network issues
    arise. You''ll see why the right combination of nodes is crucial for reliability,
    and how features such as read preference and write concern let you tune your system
    for performance, consistency, and durability.


    You will learn about processes such as elections and failover, and dive into advanced
    replica set configurations that provide workload isolation, reduce network strain,
    and keep analytics from interfering with operational queries. By the end of this
    chapter, you''ll have the tools to design, configure, and monitor replica sets
    for robust MongoDB deployments.


    This chapter will cover the following topics:


    +   - How replica sets ensure high availability and automatic failover

    +   - The roles of primary, secondary, and arbiter nodes

    +   - Strategies for balancing performance, consistency, and durability with read/write
    settings

    +   - Monitoring replication health, diagnosing lag, and handling failover

    +   - Advanced features such as chained replication, analytics nodes, and optimal
    oplog sizing


    # Understanding MongoDB replica sets


    MongoDB replication ensures data availability and system resilience by maintaining
    copies of data across multiple servers, organized into a replica set. Within this
    set, a single primary server handles write operations, while secondary servers
    maintain copies of the data, enabling read requests and providing failover capabilities.
    Read preference controls which servers are utilized for read operations, giving
    you greater control over which nodes are sent read operations.'
  merge: -1
  img_proc: true
- pgno: 136
  md: 'Write concern determines the level of confirmation the database provides after
    a write operation, allowing you to fine-tune the trade-off between write speed
    and data durability.


    These elements combined create a system that can tolerate server failures and
    manage heavy read loads. Put simply, **replication** makes data copies, **read
    preference** chooses where to read from, and **write concern** dictates the confirmation
    level needed after writing data, resulting in a robust database system.


    # Components of a replica set


    A typical MongoDB replica set includes an odd number of nodes to provide fault
    tolerance and high availability, and consists of one primary node and one or more
    secondary nodes:


    +   - **Primary:** The primary node is responsible for handling all write operations.
    It maintains the latest state of the data and propagates changes to the secondary
    nodes.

    +   - **Secondaries:** Secondary nodes continuously replicate the primary’s data
    to maintain updated copies. They can also serve read operations if the application
    is configured to allow secondary reads.

    +   - **Arbiters (optional):** An arbiter node participates in elections but does
    not store data. Arbiters are not recommended for use in production configurations;
    however, if system limitations prevent storing data, they can be used to break
    ties in voting scenarios when you have an even number of data-bearing nodes.


    ![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_136_0.png)


    *Figure 5.1: MongoDB replica set architecture*'
  merge: -1
  img_proc: true
- pgno: 137
  md: "Replica sets use an election process to ensure high availability. If the primary\
    \ node becomes unavailable, an election is triggered to select a new primary.\
    \ The election process follows these steps:\n\n+   1. A node calls for an election\
    \ if it believes it can become the primary (for example, if a secondary cannot\
    \ see a primary).\n+   2. Nodes cast votes based on factors such as priority settings,\
    \ replication state, and availability.\n+   3. The node that receives the majority\
    \ of votes is elected as the new primary.\n\nWhen designing a MongoDB replica\
    \ set for optimal performance, you need to carefully consider the number of nodes,\
    \ their placement, and how to configure election and read preferences. A well-designed\
    \ replica set configuration can help you balance throughput, fault tolerance,\
    \ and latency requirements while ensuring high availability for your application.\n\
    \nHaving an odd number of voting members in a MongoDB replica set is essential\
    \ to ensuring that the election process can be completed successfully. When only\
    \ an even number of voting members are available, it’s more likely that a quorum\
    \ cannot be reached and the successful election of a new primary may be delayed.\n\
    \nIn some deployments, additional secondary nodes may be added to distribute read\
    \ workloads or support analytics without impacting the primary’s performance.\
    \ This configuration ensures the high availability of data while also enabling\
    \ workload isolation through read targeting.\n\n> **Secondaries are for redundancy,\
    \ not scalability**\n> \n> Though read preference enables you to target secondaries\
    \ for reads, this is not meant to be a mechanism for scaling reads across the\
    \ cluster. Secondaries provide the cluster with high availability and resilience.\n\
    \n# Replication and high availability\n\nAs long as a cluster has a minimum of\
    \ three nodes (the default in MongoDB Atlas), it will be fault-tolerant and resilient\
    \ out of the box. In the case of a primary member outage, a replica set election\
    \ process automatically detects the failure, elects a secondary member as a replacement,\
    \ and promotes that secondary member to become the new primary."
  merge: -1
  img_proc: true
- pgno: 138
  md: 'The entire election and failover process happens within seconds, without manual
    intervention.


    ![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_138_0.png)


    *Figure 5.2: MongoDB replica set failover process*


    Failover time is dependent on several factors, including network latency. The
    MongoDB election process is designed to avoid unnecessary failover and provide
    flexibility for different deployment needs.


    To minimize downtime during failovers, proper election configuration, including
    appropriate priorities and timeouts, is crucial for ensuring a swift and seamless
    transition of leadership among replica set members:


    +   - **Node priority**: Assign higher priority values to nodes to influence election
    outcomes.

    +   - **Election timeouts**: Configure electionTimeoutMillis to balance between
    quick failover and avoiding unnecessary elections due to temporary network issues.
    The default of 10,000 (10 seconds) should be suitable for most configurations.


    Replica set members exchange heartbeat messages every 2 seconds to monitor each
    other’s status. If the connection fails due to a network error, depending on the
    member being monitored, a primary that doesn’t receive a heartbeat from a majority
    of voting members will step down, whereas a secondary that doesn’t receive a heartbeat
    from the primary can call for an election. If there isn’t a network failure, and
    a response isn’t received within the electionTimeoutMillis threshold, the same
    action will also be taken.'
  merge: -1
  img_proc: true
- pgno: 139
  md: '# Understanding the MongoDB election process


    As just mentioned, a MongoDB replica set uses a fully automated election process
    to determine which set member will become the new primary member. Replica sets
    can trigger an election in response to a variety of events, such as the following:


    +   - Losing connectivity to a primary member for more than the configured time-out
    (for MongoDB Atlas, the default is 5 seconds, or 10 seconds otherwise)

    +   - Adding a new node to the replica set

    +   - Performing replica set maintenance


    During any of these events, sophisticated algorithms control the member election
    process. The election algorithm processes a range of parameters, including a historical
    analysis to identify those replica set members that have applied the most recent
    updates from the primary, heartbeat (ping or connectivity) status, and user-defined
    priorities assigned to replica set members. This process ensures that the most
    suitable secondary member is promoted to primary. Once the new primary replica
    set member has been elected, the remaining secondary members automatically start
    replicating from the configured sync source, as explained in the upcoming *Chained
    replication* section. If the original primary comes back online, it will recognize
    that it is no longer the primary and reconfigure itself to become a secondary
    member of the replica set and begin catching up.


    # Replica set configuration


    In this section, we delve into specialized replica set configurations that extend
    beyond basic primary-secondary setups. These advanced techniques can help you
    optimize performance, reduce operational overhead, or cater to specific workload
    requirements. While each feature introduces additional complexities, they can
    prove invaluable for teams looking to fine-tune their MongoDB deployments.


    > **Note**

    > Replica set reconfiguration is not available in MongoDB Atlas.'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# Chained replication


    By default, secondaries can pull data changes (oplog entries) from the primary
    or another secondary. Chained replication enables a secondary to fetch oplog data
    from another secondary. This approach can help reduce network load on the primary
    in large or distributed deployments. Chained replication works as follows:


    +   1. MongoDB determines the nearest or best secondary to serve as the sync source.

    +   2. The syncing secondary continuously fetches oplog entries from this secondary
    source instead of the primary.

    +   3. Changes propagate through the replica set with reduced bandwidth usage
    on the primary node.


    Though there are many advantages to chained replication, there can be some disadvantages
    as well:


    | Benefits | Drawbacks |

    |---|---|

    | Assists globally distributed deployments: Secondary nodes in remote regions
    can pull from a geographically closer source, reducing latency | Increased lag
    in chains: If a downstream secondary falls behind, nodes that depend on it in
    the chain will also lag |

    | Optimizes network traffic: Particularly beneficial in multi-region deployments
    where network bandwidth between regions may be limited or costly | Complexity
    of troubleshooting: Longer replication paths may complicate diagnosing replication
    issues |

    | — | Cascading delays: Network issues affecting intermediate nodes can impact
    multiple downstream secondaries |


    *Table 5.1: Advantages and disadvantages of chained replication in MongoDB replica
    sets*


    You can allow (or disallow) chained replication by adjusting the replica set configuration
    from a MongoDB Shell connection to your cluster:


    ```

    cfg = rs.conf();

    cfg.settings = cfg.settings || {};

    // true allows secondaries to replicate from other secondaries

    // false restricts them to replicate only from the primary

    cfg.settings.chainingAllowed = true;

    rs.reconfig(cfg);

    ```'
  merge: -1
  img_proc: true
- pgno: 141
