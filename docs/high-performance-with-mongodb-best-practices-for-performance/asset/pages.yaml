- pgno: 6
  md: '# Contributors


    # About the authors


    **Asya Kamsky** is a Principal KnowItAll at MongoDB, where she has worked since
    2012. Before discovering MongoDB, she spent nearly two decades coaxing relational
    databases into doing what they were never designed to do at a series of startups,
    most of which no one remembers. Asya has an extensive background in software development,
    databases, and telling people what they’re doing wrong.


    **Ger Hartnett** is a Lead Engineer on MongoDB’s product performance team, where
    he loves working on fascinating optimization and scaling challenges. Before MongoDB,
    he founded a startup that built a project communication platform (that had scaling
    issues). Prior to that, he architected and tuned embedded software at Intel, where
    he co-authored a book. Even before that, he developed systems at companies including
    Tellabs, Digital, and Motorola.


    **Alex Bevilacqua** is the Lead Product Manager at MongoDB for Developer Experience.
    Prior to joining MongoDB in 2018, he worked as a software engineer and systems
    architect, implementing solutions in a number of languages, technologies, and
    frameworks. Aside from his passion for programming that consumes more than just
    his working hours, Alex can typically be found at an arena with one of his kids,
    both of whom play rep hockey.'
  merge: -1
  img_proc: true
- pgno: 7
  md: '# About the reviewers


    **Keith Smith** is a systems and storage expert with decades of experience in
    operating systems and data infrastructure. Based in the U.S., he has contributed
    to innovations at companies like Sun Microsystems, NetApp, and MongoDB. Keith
    started his career designing real-time UNIX systems and went on to build extensible
    operating systems at Harvard, where he earned his PhD. His work has spanned object-based
    storage, metadata catalogs, and file system architectures. Since 2020, he has
    led storage engine development at MongoDB. Keith is passionate about scalable
    systems and continues to push the boundaries of data storage technology.


    **John Page** is a full-stack engineer who joined MongoDB in 2013. Since then,
    he has held senior technical roles focused on customer success across all phases
    of the development lifecycle. Before MongoDB, he spent 18 years building document
    database systems for law enforcement and the U.S. military. Trained as a geologist,
    John can find silicon in the wild, build a computer from raw components, and write
    everything from operating systems and databases to front ends and documentation.


    **James Kovacs** is a director of engineering in Database Experience at MongoDB.
    He focuses on client libraries, object-document mappers, framework integrations,
    and AI/ML. He has over 25 years of professional software engineering experience,
    having worked in a wide variety of companies and industries over that time. When
    not in front of a keyboard, you can find him playing board games/TTRPGs, cooking
    tasty vegan meals in the kitchen, or at the dojo teaching karate.


    **Stephanie Eristoff** is a software engineer on the Storage Execution team at
    MongoDB, which she joined in 2024. She brings experience in performance testing
    of time-series collections and indexes and has also contributed to the Performance
    and Query Execution teams. Outside of work, Stephanie enjoys baking, running,
    and biking.


    **Katya Kamenieva** is a product manager at MongoDB, where she has been driving
    improvements to the aggregation framework, change streams, and other features
    since 2019. Her work focuses on enhancing how users interact with data in MongoDB.
    Outside of work, she’s a mom to two young daughters and finds mindfulness through
    quiet moments, a good cup of coffee, yoga, and watercolor painting.'
  merge: -1
  img_proc: true
