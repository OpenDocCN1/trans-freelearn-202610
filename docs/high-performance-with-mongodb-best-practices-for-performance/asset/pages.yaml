- pgno: 50
  md: '# The data services system


    Let’s zoom in now to the data services part of the overall software system that
    we looked at earlier in Figure 1.7.


    ![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_50_0.png)


    *represents multiple instances


    Figure 1.8: MongoDB architecture showing the connections between core database
    components


    Looking from left to right in Figure 1.8, we see that the application servers
    are communicating with the data services through a driver or client library. In
    this case, we are showing a sharded cluster. For simpler deployments, the application
    server could connect to a single replica set without the mongos and config server.
    Conceptual elements such as the schema, queries, and indexes are shared between
    the application server and the data services layer. Some performance and scalability
    issues can be caused by these conceptual elements, and changing them might be
    the source of some improvements.


    In this case, we are looking at a diagram of an Atlas deployment that includes
    elements such as the Atlas UI (which includes monitoring and backup), the Atlas
    control plane, charts, and features such as Vector and Semantic Search, and Data
    Federation.'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'The rest of the components are considered the **core** database, and they are
    as follows:


    +   - **mongod**: A single server process. Atlas can deploy multiple mongod processes
    in replica sets (for high availability) and shards (for horizontal scaling).

    +   - **mongos**: A router process for a sharded cluster. It routes queries to
    one or more shards and combines results from multiple shards into responses.

    +   - **config**: A special, internal database that stores the metadata for a
    sharded cluster. The metadata reflects the state and organization of all data
    within the sharded cluster. mongos uses this metadata to route read and write
    operations to the correct shards. It also maintains a cache of this data.


    Finally, in *Figure 1.8*, the mongod processes will save and retrieve the data
    via the storage subsystem. This could be a disk in a self-managed MongoDB system
    or cloud storage, such as the following:


    +   - **Elastic Block Storage (EBS)** in AWS and Alibaba Cloud

    +   - **Managed Disks** in Azure

    +   - **Persistent Disks (PD)** in GCP

    +   - Locally attached ephemeral SSDs


    When using Atlas, we present the overall data services system as a black box with
    a small number of settings you need to consider. Atlas takes care of the details
    for you. The settings from an Atlas perspective are as follows:


    +   - The number of shards and replica set members.

    +   - The instance size, which determines the number of **virtual central processing
    units** (**vCPUs**), the amount of memory, and network performance.

    +   - The storage configuration, which includes the size and throughput of the
    device. Throughput is usually defined as **input/output operations per second
    (IOPS)**.


    If you are self-managing MongoDB on your own cloud or physical servers, you have
    visibility of many of the component settings inside the server and software that
    the mongod process is running on. This is a double-edged sword. You have more
    settings you can tune to improve performance. However, you also have more elements
    to manage and potential bottlenecks to explore.'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'Now, if we zoom in to the mongod, we find that it is itself a system with multiple
    elements. The following diagram (Figure 1.9) shows the main elements inside the
    MongoDB server (mongod):


    ![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_52_0.png)


    *Figure 1.9: Elements inside the MongoDB server*


    # Query engine


    MongoDB’s query engine takes your query, determines the most efficient way to
    find the data you need, and returns the results. It uses indexes to optimize query
    execution and passes requests to the storage engine to execute operations.


    An index is like the index at the back of a book. Instead of reading every page
    of a book to find a topic, you can use the index to directly find out which pages
    contain the topic. Similarly, in a database, an index helps the query engine locate
    data more efficiently.


    MongoDB allows you to do a lot more than a key-value store. MongoDB’s query and
    indexing capabilities rival (and, in some ways, surpass) traditional relational
    databases:


    +   - You can query on any field, not just the primary key

    +   - You can perform complex logical operations

    +   - You can query inside nested documents and arrays

    +   - You can aggregate and analyze data

    +   - You can create indexes on any combination of fields, including arrays and
    subdocuments

    +   - You can add multiple indexes to a collection of documents


    Indexes make queries more efficient. As with many aspects of performance, there
    are costs to indexes, too. When creating/inserting new documents, every index
    will necessitate an additional write operation to storage. Similarly, when updating
    an indexed field of a document, an extra write will be needed to update the index.'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'You can get the query system to provide **explain plans**, which provide details
    about how a query ran. This can provide valuable information for finding potential
    bottlenecks and generating ideas for improvements.


    We’ll go into a lot more detail about indexes and queries in *Chapters 3, Indexes,*
    and *Chapter 12, Advanced Query and Indexing Concepts.*


    # Storage engine/WiredTiger


    Each mongod process needs to store the data on disk. The storage engine is MongoDB’s
    filing system; it’s the component responsible for managing how data is stored,
    retrieved, and maintained on disk. Since MongoDB 3.2, WiredTiger has been the
    default storage engine.


    The storage engine takes care of persisting data and indexes on disk, fetching
    the data from disk, as well as handling the compression and encryption of the
    data on disk. It also handles the journal known as the **write-ahead log** in
    many databases. The storage engine also contains an in-memory cache of the most
    recently accessed documents. You can change the size of the WiredTiger cache using
    the wiredTigerCacheSizeGB setting. The remaining memory will be used by the operating
    system’s filesystem (page) cache. You’ll learn more about storage engines in *Chapter
    7, Storage Engines.*


    # Libraries


    When developing MongoDB, we used many other building blocks and libraries. These
    also have settings that can be changed to improve performance.


    Starting with MongoDB Server 8.0, a newer version of the memory allocator (TCMalloc)
    supports per-CPU caches, instead of per-thread caches. This can reduce memory
    fragmentation and make your database more resilient to high-stress workloads.
    A number of system configuration settings may need to be modified to use per-CPU
    caches. You’ll find more details on system settings in *Chapter 13, Operating
    System and System Resources.* If you really know what you are doing, you can change
    controls such as the logical page size, but this could necessitate changing the
    settings in the MongoDB source code and rebuilding the server. Again, Atlas provides
    defaults and implements best practices.'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'Compression algorithms are more accessible. You can specify the storage compression
    algorithm to be used either when creating a collection or via configuration options
    when starting the server. By default, Atlas uses an algorithm called **Snappy**.
    When running self-managed MongoDB, you have four compressor options:


    +   - None

    +   - **Snappy**: Fastest, lowest CPU consumption; doesn’t compress data as much

    +   - **Zstd**: A middle ground between Snappy and Zlib

    +   - **Zlib**: Slowest, highest CPU consumption; compresses data better


    You can also use network compression between the driver and the MongoDB server.
    In this case, you can select the compression algorithm via the driver in your
    application code, whether the server is on Atlas or not.


    MongoDB uses OpenSSL to handle TLS/SSL encryption for the following:


    +   - Client-server connections (e.g., mongod [] MongoDB Shell)

    +   - Replication and sharded cluster communication

    +   - MongoDB drivers connecting to the database


    Different versions of OpenSSL have different performance characteristics and scalability
    on higher-tier instances/servers.


    # Other system components that mongod uses


    MongoDB runs within an operating system, which, in turn, is managed by a kernel.
    In operating systems such as Linux, parameters such as vm.dirty_ratio and vm.dirty_writeback_centisecs
    tune the kernel’s mechanisms for managing virtual memory. They change how data
    is handled before being written from memory to disk.


    MongoDB can run inside **virtual machines (VMs)**. However, you need to make sure
    it’s configured correctly from the VM perspective. For example, over-allocating
    vCPUs can lead to CPU contention among VMs running on the same host, which can
    degrade performance. You can learn more about concepts such as ballooning and
    how to configure MongoDB for VMs in the MongoDB server production notes at https://www.mongodb.com/docs/manual/administration/production-notes/.


    MongoDB runs on many types of CPUs in networked systems with different amounts
    of memory. These typically depend on the cloud instance size or computer server
    on which you deploy MongoDB. In general, larger instances or servers will have
    more CPUs, memory, and higher network bandwidth.'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'As we saw earlier, with Atlas, you can select different types and configurations
    of cloud storage. You typically have the same options when running your own cloud
    instances or self-managed storage. In addition, you can choose different filesystems
    and settings, such as readahead. When a program reads a file, Linux anticipates
    future reads and loads additional data into memory. This reduces the number of
    disk access operations, making sequential reads faster. This will be discussed
    in more detail in Chapter 13, Operating System and System Resources.


    # Managing complexity in modern data platforms


    Let’s zoom back out from a single mongod process to look at the data services
    layer again. To your application, the data services element is one component,
    but in reality, it can be a complex distributed system in its own right with multiple
    individual servers.


    MongoDB’s approach is to provide a data services API that simplifies this complexity
    using three key principles: a flexible data model, built-in redundancy and resilience,
    and horizontal scaling.


    # Flexible data model with rigorous capabilities


    The document model allows you to represent relationships naturally while still
    supporting rigorous data governance when needed. One MongoDB user explained it
    perfectly: “We can push updates to our application without having to coordinate
    complex database migrations. The schema evolves with our code, not against it.”
    You can learn more about this flexible data model in Chapter 2, Schema Design
    for Performance.


    # Built-in redundancy and resilience


    Rather than treating high availability as an add-on feature, MongoDB bakes resilience
    into its core architecture through replication:


    +   - **Automatic failover:** If the primary node fails, an election determines
    a new primary within seconds

    +   - **Self-healing:** When failed nodes recover, they automatically catch up
    and rejoin the replica set


    Again, Atlas provides defaults, implements best practices, and simplifies the
    number of settings you need to consider. When self-managing MongoDB, you can dig
    deeper into replication settings. For example, if running MongoDB on your own
    servers, you can change server parameters to tune how replication data is batched.
    Larger batches reduce network traffic and the number of IOPS required on secondaries,
    but can add latency for writes. You can also configure **flow control**, which
    can prevent replication lag by slowing down writes if secondaries are falling
    behind. You can learn more about replication in Chapter 5, Replication.'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# Horizontal scaling with intelligent distribution


    MongoDB’s sharding capability distributes data across multiple replica sets while
    keeping related data together:


    +   - **Automatic balancing:** MongoDB continuously rebalances data across shards
    as your data grows

    +   - **Query routing:** The MongoDB router (mongos) intelligently directs operations
    to the appropriate shards

    +   - **Zone sharding:** You can align data distribution with your infrastructure
    (keeping European customer data in European servers, for example)


    MongoDB Atlas simplifies sharding by automating key processes, enabling best practices,
    and providing built-in features to ensure optimal performance. You can read more
    about this in *Chapter 6, Sharding.*


    # Performance tools


    You can use performance monitoring tools to help find potential bottlenecks or
    limiting factors. These could be in any of the components or elements we mentioned
    earlier. More details will be provided in *Chapter 14, Monitoring and Observability.*


    The mongod and mongos processes write log files with performance information.
    They also support the serverStatus command, which returns information about the
    running process. The query engine can “explain” how a query will run and supports
    a profiler feature. Command-line tools, such as mongostat and mongotop, are provided
    to monitor a running mongod process.


    To monitor utilization of all kinds of system resources, you can use operating
    system commands, MongoDB Atlas monitoring, and other GUI tools that are designed
    specifically for monitoring multiple servers.


    For system resources specifically, Linux commands such as top, vmstat, iostat,
    and netstat can be used to monitor CPU, memory, storage, and network at a point
    in time on a single server. Tools such as dstat and sar can be used to combine
    data from simpler tools and view it over a period of time.


    MongoDB Atlas monitoring provides historical and real-time system resource data,
    which is integrated with database-specific metrics. It has tools such as **Real-Time
    Performance Panel (RTPP)**, Performance Advisor, Namespace Insights, and Query
    Profiler. You can also set alerts for specific performance events.'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'For self-managed deployments, you can use graphical tools such as Netdata,
    Prometheus + Grafana, Zabbix, Munin, or Observium. You can use observability frameworks
    such as OpenTelemetry. Finally, you can use commercial **application performance
    monitoring (APM)** tools such as AppDynamics, Datadog, Dynatrace, LogicMonitor,
    New Relic, SolarWinds, and Splunk Observability.


    # Finding bottlenecks


    As mentioned at the start of this chapter, every system has a limiting factor
    or bottleneck. With multiple inputs to a system, it’s not always clear what the
    limiting factor is. We need to find the element or component that is the current
    bottleneck. To do this, we need to use the tools mentioned previously to analyze
    the performance of all of the potential bottlenecks we mentioned so far.


    In summary, the following table lists the potential bottlenecks you might encounter
    when tuning a typical software application. The first column shows the potential
    bottlenecks you could encounter on both Atlas and self-managed systems. The second
    column shows the additional bottlenecks you are responsible for with self-managed
    deployments. As you can see, using Atlas significantly reduces the number of bottlenecks
    you need to consider.


    | Atlas and self-managed (private cloud) | Self-managed (private cloud) |

    |---|---|

    | UI/application code | Network |

    | Framework | Replication |

    | Driver | Storage engine |

    | Network | Libraries (allocator, compression, and encryption) |

    | Schema/model | OS/kernel |

    | Queries | Virtual machine |

    | Indexes | Memory (extra details) |

    | Sharding | CPU (extra details) |

    | Cloud storage | Storage (extra details) |

    | CPU | — |

    | Memory | — |


    *Table 1.1: Atlas vs. self-managed (private cloud)*'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'For the remainder of this section, we’ll look in more detail at two example
    bottlenecks.


    We’ll look at a storage bottleneck first, including the measurements and indicators
    that will help us identify it. In this example, we have a workload that’s mostly
    reading data:


    +   - 95% of the database operations in the steady state are reads of documents
    using the _id field (primary key)

    +   - The documents are being retrieved in random order, meaning the _id values
    are being accessed in a different order from when they were inserted

    +   - The dataset is 10x larger than the memory on the database server, so most
    of the read operations cannot be satisfied by a cache read and they need to access
    the storage device.

    +   - The storage device is specified to provide 4,000 IOPS


    We see the system is running 5,500 database operations per second using mongostat
    or Atlas monitoring. We try to increase performance by scaling up the instance
    type. The database performance stays at 5,500 operations per second. After running
    this experiment, we know the bottleneck is not the CPU or memory size of the systems
    running the MongoDB server. We scale the instance size down again.


    Next, we look at measurements of I/O:


    +   - If running self-managed instances, you can look at the number of IOPS using
    the iostat command on Linux

    +   - If running in Atlas, you can observe the number of IOPS being used on the
    Max Disk IOPS metric when you look at monitoring


    To try and improve performance, we now increase the number of storage IOPS from
    4,000 to 8,000. Database performance doubles to 11,000 operations per second.
    We see this situation quite frequently with customers. They assume they need to
    use a more powerful database instance when, in reality, they really need more
    IOPS from the storage subsystem.


    In the second example, we’ll focus on a subset of Figure 1.8. Here, we have an
    application server interacting with a data services layer:


    ![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_58_0.png)


    *Figure 1.10: Application server connects to storage through data services*'
