    ,\n    \"state\": \"CA\",\n    \"zip\": \"12345\"\n  },\n  \"interests\": [\"\
    hiking\", \"photography\", \"travel\"]\n}\n```\n\nThis contains a number of properties\
    \ about a user. In a relational database, the user’s interests would be stored\
    \ in a separate table, which would have to be queried separately or joined with\
